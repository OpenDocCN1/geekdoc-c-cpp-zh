    Deducing this Recipe 19.8: Transforming auto Recipe 19.9: char8_t and std::u8string
    types Recipe 19.10: Suffix for std::size_t Recipe 19.11: Named universal character
    escapes Recipe 19.12: Monadic operations for std::optional Recipe 19.13: Using
    std::expected Recipe 19.14: Pre-processing directives elifdef and elifndef Recipe
    19.15: invoke_r Recipe 19.16:<spanstream></spanstream> Recipe 19.17: Bit initialization Recipe
    19.18: Extend init-statement to allow alias-declaration Since this chapter is
    a collection of many different features, we get many different results whether
    the compiler has completed that feature. Overall, there is decent coverage, but
    a few that we will still have to wait for.   {                    } Objectives By
    the end of this chapter, the reader will understand some new ways to write clean
    code, and why it is important. Some of the new features you will learn are structural,
    while other features are new types, or new keywords. Admittedly some are easier
    than others, but after you have learned them, then you will appreciate how they
    can help you. Recipe 19.1: Familiar template syntax Lambdas Problem: We want a
    cleaner way of using lambdas. Solution: C++20 has created a way to make templated
    lambdas look better. Lambdas have been a part of the language since C++11\. Each
    release has had some additions. For C++20, they added a mechanism so that knowing
    the deduced type a lot easier. The result is a cleaner look with less code and
    looking more natural. The auto keyword is handy, but then you need to get the
    type with Aside from the bit of extra typing, it does not look clean, and certainly
    is not as handy. First, let us state the headers we will be using in this chapter:  #include #include<iostream></iostream> #include #include<ranges></ranges> #include<type_traits></type_traits> #include<cstddef></cstddef> #include #include<map
    class="calibre31"></map> #include #include<array></array> #include<unordered_map></unordered_map> #include #include #include #include<optional></optional> #include<functional></functional> #include<algorithm></algorithm> #include
    <cmath></cmath>// for bit manipulation #include<format></format> #include<ostream></ostream> #include<fstream></fstream> #include #include #include<cstdint></cstdint> #ifdef
    __cpp_lib_spanstream #include<spanstream></spanstream> #endif #include<stdexcept></stdexcept> #include<cassert></cassert> #include<iomanip></iomanip> #include #include  If
    we look at the code snippet:  {  { << << << __FUNCTION__ << auto Cpp14AutoLambda
    = x, y) {  }; auto Cpp20TemplatedLambda = [] <class _="" span="">X, class && x,
    Y && y) {</class>   }; } };  It does not show a huge difference, but the second
    lambda does look better. (see references) We are used to the syntax of using <
    > to template our code, and so the option of specifying a type and not using auto
    is familiar and makes the lambda seem natural. Recipe 19.2: Lambda parameter packs Problem:
    We want a cleaner way of using a variadic template with lambdas. Solution: C++20
    added a cleaner syntax for parameter packs. While we are talking about lambdas,
    we can mention another feature as well. Parameter packs were also released with
    C++11, and they allow you to provide an unspecified number of parameters to a
    templated function. We can do a quick review with the following sample code. Our
    Lcm() function has a parameter pack. Although it could just say we specified that
    the parameters need to be some type of integers. There are many ways you can work
    with parameter packs; in this case, we say our method has at least two arguments.
    We get the least-common-multiplier for the first two values, and then check if
    we have any more in the rest parameter. If the rest parameter is empty, then we
    are done. If we do have more, then we can recurse and call our function again,
    with the result we just calculated as the first parameter. This will make the
    parameter expand, taking a value out of rest to be passed into the second parameter.
    We keep doing this until we have no more values to evaluate. This is a clean and
    efficient way of working through an unspecified number of parameters.  { TIntegral,
    std::integral... TRest> static constexpr TIntegral TIntegral& first, const TIntegral&
    second, const TRest& ... rest) { result = std::lcm(first, second); > { rest...); 
    } return result; } Rest> static auto LcmWithLambda(Rest... rest) {  auto lcmFn
    = [&, rest...] {   };  auto res = lcmFn(); return res; }  static void LookAtTemplateExpansion()
    { std::cout << std::endl << std::endl << __FUNCTION__ << std::endl; std::cout
    << "result1=" << << std::endl; std::cout << "result2=" << << std::endl; std::cout
    << } static void LookAtLambdaExpansion() { std::cout << std::endl << std::endl
    << __FUNCTION__ << std::endl; LookAtTemplateExpansion(); std::cout << "result
    from calling lambda=" << << std::endl << std::endl; } };  C++20 added lambda captures
    for parameter packs. If we had a requirement that we needed a lambda, we can define
    the lambda with a variadic capture, and call the Lcm() function we used previously.
    We can see our LcmWithLambda function still has similar functionality, it is now
    just a bit cleaner. This gives us the same result, as shown in Figure ![](image-tszv45ov.png) Figure
    19.1: Output from LookAtLambdaExpansion Recipe 19.3: Literal class types in non-type
    template parameters Problem: We want a way of passing different types of data
    into our templates. Solution: C++20 made more allowances for that. The topic will
    probably need a couple of explanations. We have used a number of templates, so
    that part should be clear. We can pass non-type parameters into a template, meaning
    something that is not templated, but rather, is an actual value. These values
    need to have a structural type. This means they could be:  An enum An integer A
    float A pointer (to an object or function) A l-value reference (to an object or
    function) What C++20 allowed us to do is to pass in a class type, meaning an instance
    of a class. We did add the extra qualifier of literal class indicating that it
    cannot be any instantiation of a class. It would need the following properties:  All
    non-static members (in itself, and any base class) would need to be public and
    non-mutable. This could mean that everything is constant. All non-static members
    (in itself, and any base class) would need to be structural types. So, although
    there are quite a few restrictions, this adds some new capabilities. If you were
    looking for such a mechanism, it would certainly allow you to do this in a much
    cleaner fashion. A simple example of this would be:  template<typename _="" span="">T,
    std::size_t N></typename> struct SizedThing { T data[N]; Count() { return N; //
    sizeof(data) / sizeof(*data); } }; struct PreAllocation { const bool HasNumber{
    false }; const int Number{}; {}; constexpr int& number) : Number(number) {}; }; template<typename
    _="" span="">T, PreAllocation maybe></typename>  {  std::vectordata{}; AnotherSizedThing()
    { { data.reserve(maybe.Number);  } } }; {  static void LookAtNonTypeParameters()
    { std::cout << std::endl << std::endl << __FUNCTION__ << std::endl; SizedThing<int_
    _="" span="">myNumbers;</int_> std::cout << "Number of values in sized thing =
    " << myNumbers.Count() << std::endl; AnotherSizedThing<long_ _="" span="">PreAllocation{}
    > maybeSomeValues;</long_> std::cout << "Capacity in non-preallocated other thing
    = " << maybeSomeValues.data.capacity() << std::endl; 10 }; AnotherSizedThing<long_
    _="" span="">pa > someValues;</long_> std::cout << "Capacity in preallocated other
    thing = " << someValues.data.capacity() << std::endl; } };  We first create a
    providing the type to use, and the number we want in the collection. We create
    that for comparison to what we do next. We then create a couple of AnotherSizedThing
    objects. For the first we do not pass a value, but for the second one, we create
    a constexpr object and pass that in. That reserves space for values. The output
    is shown in the following Figure ![](image-s14vh8v0.png) Figure 19.2: Output for
    LookAtNonTypeParameters Recipe 19.4: Multidimensional subscript operator Problem:
