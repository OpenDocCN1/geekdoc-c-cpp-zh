    were another part of the Big 4 features of C++ 20\. Some say it was the hardest
    feature to implement; some say it is the biggest shift in how code was written
    before, and some say that it is the best feature of that release. There certainly
    are a number of pieces that we will need to look into, and learn about. While
    in the last chapter, we talked about a bunch of new features that will help you
    create asynchronous code better, coroutines allow you to declare asynchronous
    operations. Coroutines are not always asynchronous, but they can be coded that
    way. In a way, the coroutines in your code look like blocking code, but without
    the blocking. Creating coroutines will give your code better responsiveness, and
    so the end users will appreciate that. The IT department that has to make sure
    your application can scale will also appreciate it as well. C++ 11 helped a lot
    by making asynchronous code cleaner by using lambda expressions, but the C++ 20
    and 23 releases are designed to make code simpler and yet cleaner. Sometimes there
    can be an easier transition from non-asynchronous code to using coroutines, than
    switching to asynchronous code. Moreover, some love the coroutine flow because
    it is easy to continue from where you left off. While coroutines did not change
    much in C++23, there were some features that people wanted to have added but,
    in the end, they were not included. Structure In this chapter, we will cover the
