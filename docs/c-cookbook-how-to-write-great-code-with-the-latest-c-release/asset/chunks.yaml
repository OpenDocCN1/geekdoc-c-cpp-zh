    will have to plan differently, and put your functions in a class or structure
    (which seems like a good idea to do anyway). Just to finish things off for now,
    and to preview our next topic, we should mention how we brought <iostream></iostream>into
    use. After seeing the #include statement for years, you may not have noticed that
    this was actually an import statement. We can use #include and import statements
    in the same file, although we will be using import a lot more in the future. Recipe
    10.2: What the compiler does with a module Problem: We have learned what a module
    is, but how is it better? Solution: The first answer is speed, plus helps with
    many issues. Although the vast focus on this book is on coding, modules are a
    dramatic enough change that it would be good to know a bit more about them. We
    already mentioned that when a header file gets included, it is basically copying
    all the header text into the destination file. We also said that macro definitions
    can cause major headaches. You can still have templates and definitions in a module,
    but the definitions in a module never "escapes" out of the module. This is not
    a complete sequence: but a simplified overview would be as follows:  Look to see
    what header files that modules import can be precompiled. Figure out the sequence
    (as best it can) for the modules to be built. Compile the modules, and this is
    needed only once. The output are temporary files called Compiled Module Interface
    files, although they may have a different extension. Some older references might
    refer to them as Binary Module Interface but that term was changed to stress the
    point that these are not distributable. CMI files are built based on the compiler
    flags, for that particular build of the compiler, on that specific build operating
    system. They cannot be transported to another system (unless it was the exact
    same, but the effort and risk do not have much reward). Compile the CPP files,
    referencing the CMI files. The result is still your traditional object files. Build
    your executable, based on the CMI and object files. The speed increase with modules
    has been reported by many to be threefold. That is something that will lure many
    into using modules, regardless of all their other benefits. It must be stressed
    that the CMI files are not distributable, but they are hoping that they can be
    used for other purposes. Although you currently cannot parse a CMI into anything
    else tangibly helpful (such as an interface for consumption in other languages,
    or code documentation systems, and so on), people are working to see what tools
    they can make to leverage the knowledge held within the CMI files, and so that
    is something to look forward to in the future. Recipe 10.3: How to use a module Problem:
