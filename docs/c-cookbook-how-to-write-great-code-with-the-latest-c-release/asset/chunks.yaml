    Processing Introduction Naturally, as the world evolves, things get more complicated
    and we want things done as soon as possible. This, in the software world, means
    that we want them to run concurrently, although concurrent does not guarantee
    faster; it just means organizing things so some can get the focus they need and
    others can wait, which often means the net result is faster. C++ 23 continues
    the trend of providing more support so that developers can make their code smarter
    in terms of dividing up the work to complete it more efficiently. Having an application
    that works concurrently is no longer nice to have but essential. Distributed systems
    and web services running in the background to provide updated information, means
    that today’s users need to have an application that responds to their actions,
    and provides information back to them as soon as it is available. For such an
    important part of coding, the concurrent library has had important and welcome
    enhancements, although no sweeping changes in recent releases. There were a few
    features that people were hoping might get into C++23 that did not, but perhaps
    were a testament to a good initial design. Structure In this chapter, we will
