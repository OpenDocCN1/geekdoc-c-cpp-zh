    if it is below an arbitrary number of 70\. Of course, this same result can be
    done in many ways, but it is good to know we can involve a concept in a solution. Recipe
    6.4: relation and equivalence_relation Problem: We want a way of checking the
    relationship between multiple expressions. Solution: C++ 20 was released with
    concepts named relation and We will only mention these concepts; they are used
    more as building blocks for other concepts. They specify that a relation defines
    a binary relation over a set of expressions. If you have a set, you can say two
    objects in that set are related if they satisfy a certain property. The concept
    equivalence_relation is similar to but it does mention some semantic requirements: A
    relation r is an equivalence relation if  It is reflexive: for all x, r(x, x)
    is true; It is symmetric: for all a and b, r(a, b) is true if and only if r(b,
    a) is true; It is transitive: r(a, b) && r(b, c) implies r(a, c). The relation
    concept ensures that you can apply an algorithm that can tell if there is a relation
    between the objects, while the equivalence_relation is more precise, and states
    that the two objects are equivalent. Recipe 6.5: strict_weak_order Problem: We
    want a way to impose a strict weak ordering on its arguments. Solution: Related
    to relation, there is also the strict_weak_order concept. Again, a concept related
    to the relation concept, but semantic differences (See references): A relation
    r is a strict weak ordering  It is irreflexive: for all x) is false; It is transitive:
    for all b and if r(a, b) and r(b, c) are both true then r(a, c) is true; b) be
    !r(a, b) && !r(b, then e is transitive: e(a, implies Since these deal with math
    terms that could get into more depth than we want to cover in this book, let us
    borrow an analogy (See references) and relate it to our cooking theme. Say there
    was a pie-baking competition, where the baker had to cook a pie from scratch and
    present it on a plate to the judges before the timer expired. Of the 10 contestants,
    3 of the bakers failed to present their pie on time, and so, were disqualified.
    There was one pie that the judges unanimously agreed was the best pie they tasted
    in years. Then two other bakers made very good pies and the judges had a tough
    time deciding. For weak ordering, it is easier to group them:  The pie that was
    unanimously the best. The two pies were also very good. The rest of the pies from
    the bakers were not disqualified. The entries from the bakers were disqualified. Thus,
    we do not know the complete ranking, but this weak ordering gives us a decent
    idea on how the bakers performed. If all the bakers finished, and the judges could
    rank all the pies well enough that there were no ties, then that would be more
    of a strict weak ordering. Another way of looking at it (See references), is that
    partial ordering would use the <= comparison operator to compare the values in
    the set. You could not perform a total order operation (such as because it would
    not know how to ensure things were ranked properly. Strict weak ordering is more
    like using the < operator when trying to sort your items. This would allow for
    greater precision. Let us say that you came across a comparison, for example,
    a situation where object a versus object b. When comparing if a < b is false,
    and b < a is false, then the only logical conclusion you could make is that a
    and b are equivalent. There is a chance a and b and not identical, but in terms
    of sorting the set, that is the best conclusion you can reach. That would be called
    strict weak ordering. Moreover, to clarify something, the strict part of the name
    means it is the irreflexive form < of the comparison, rather than the reflexive
    The weak part means that if a < b and b < it does not imply they are equal but
    comparatively equivalent. Now that we have reached the end of our math lesson,
    we can say that the concept strict_weak_order complies with the requirements that
    an algorithm could be applied to a set so that it is sorted to the best of the
