    19.3: Output from LookAtMultidimensional Recipe 19.5: std::make_shared supports
    arrays Problem: We want a clean way of having a smart pointer for an array. Solution:
    C++ 20 allows us to safer share arrays. This shows what a great release C++20
    was. Aside from the big four set of features, dozens of smaller features could
    make a big impact on how you coded. Now, instead of doing a complicated workaround
    by hand, or resorting to a third-party library, you can call to create a smart
    pointer of an array. Hopefully your mindset these days is to use make_shared and
    make_unique as much as possible, and only use new and delete in rare circumstances.
    Now, there is one less reason why you should risk a memory leak. Look at the following
    code:  { int x; }; {  { << << << __FUNCTION__ << = = << "value1[37] = " << << <<
    "value1[99] = " << << auto arrMS2 =  = << "value2[37] = " << << auto arrMS3 = 
    = << "value3[42] = " << << = = // does not compile // auto arrMU2 = std::make_unique<somevalue_100_>();</somevalue_100_> } };  This
    shows us allocating and initializing an integer array. You can use it as you would
    a normal array, but we did not have to use new or delete, and memory gets freed
    up automatically. It will also make resource ownership clearer, since you will
    not have the debate on who should delete the resource. We also create a shared
    array in our structure. With std::make_shared() in C++23, we can also now pass
    the size as a parameter. Of course the sibling function to std::make_shared is
    and we can now pass the size as a parameter for that as well. While you can create
    a unique pointer to some array with a parameter value of 100, we cannot create
    an array of 100 elements. Refer to Figure ![](image-8vaxw498.png) Figure 19.4:
    Output from LookAtMakeShared In the output, we show that when we try to retrieve
    a value that was not set, we get a default value. There are a couple of related
    C++ features, but we will save talking about those for the upcoming chapter on
    performance. Recipe 19.6: CTAD improvements Problem: We want a cleaner way of
    doing template argument deductions. Solution: C++20 has made things easier, and
    better looking. In C++17, there was a feature called Class Template Argument Deduction
    which meant you did not always have to specify the types when declaring an instance
    of your template. This was good in some cases but failed in others. Often, it
    worked fine with many standard library types but failed with your custom types
    that had initializers. The bad news was that in C++17, you had to create a workaround
    and create a deduction guide. This was to aid the compiler in what you were trying
    to do. The good news is that with C++20, you probably do not need the deduction
    guide any longer. This means a bit less code, and a cleaner way of doing things.
    Look at the sample code:  template T1, typename T2> { T1 first{}; T2 second{}; const
    = }; // deduction guide was needed in C++17, but no longer //template <typename
    _="" span="">T1, typename T2></typename> //MyPair(T1,T2) -> MyPair<t1_ _="" span="">T2>;</t1_> {  { <<
    << << __FUNCTION__ <<  { pr1{ 2.3f }; pr2{ 2.3f }; if (pr1 == pr2) { << "pair1
    {" << pr1.first << "," << pr1.second << "} =="   << " pair2 {" << pr2.first <<
    "," << pr2.second <<  } else { << "pair1 {" << pr1.first << "," << pr1.second
    << "} !="   << " pair2 {" << pr2.first << "," << pr2.second <<  } <<  }  { mpr1{
    2.3f }; MyPair 2.3f }; if (mpr1 == mpr2) { << "mypair1 {" << mpr1.first << ","
    << mpr1.second << "} =="   << " mypair2 {" << mpr2.first << "," << mpr2.second
    <<  } else { << "mypair1 {" << mpr1.first << "," << mpr1.second << "} !="   <<
    " mypair2 {" << mpr2.first << "," << mpr2.second << }  } } };  The first block
    shows the original intent for CTAD. Instead of being forced to explicitly state
    it was pair with <int_float></int_float>template parameters, you can omit that
    part and the compile will deduce what you want. That worked well, although in
    some cases, it was finicky with the values. The problem arose when you had your
    own type. If you look at the MyPair struct, it has default initializers and that
    confused the compiler. The workaround was to have that odd looking (T1,T2) ->
    syntax. As mentioned, the newer compilers know better, and that part can be avoided.
    There is also a feature planned for C++23 that improves CTAD for inherited constructors.
    Although at this current time, none of the major compilers have completely implemented
    that feature. Recipe 19.7: Deducing this Problem: We want a cleaner way of writing
    functions that understand whether they should be returning const or not. Solution:
    C++23 has a new mechanism that will cut down on the amount of code you should
    be writing. The birth of this feature came about when some developers were working
    on other features, but both had the same issue: they were writing too many functions.
    (see references) To be thorough, they were writing different functions that did
    the same thing, but:  One was for non-const lvalues One was for const lvalues One
    was for non-const rvalues One was for const rvalues There could be others as well,
    such as if you were working with volatile codes. Most coders do not write all
    four versions for every function; some might write a const and non-const versions
    for some of their functions. If you are working on a library, the move coverage
    you have for different situations would be better. Dealing with all the cvref
    (const-volatile-reference) situations can be burdensome. Being frustrated with
    all of this duplication, they worked on a mechanism that would cut down on all
    of that. If we think about it, when we call one-member function from another,
    we are implicitly passing so that it can be used in the called function. Instead
    of passing this implicitly, we can call it explicitly. We can also pass it with
    the reference operator, so it is an r-value reference. This is not required for
