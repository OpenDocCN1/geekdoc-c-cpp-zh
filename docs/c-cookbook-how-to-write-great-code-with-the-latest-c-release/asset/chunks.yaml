    with cyclical dependencies when including headers, how does it work with modules? Solution:
    There is a solution, but there is some work involved. Modules offer incredible
    power, but nobody is saying the switch is zero effort. One good example is when
    you have a cyclical header includes. Typical with headers, that means when file1.h
    includes and file2.h includes That issue would be greatly complicated if other
    macro defines were involved, but even without them, compilers have to be smart
    (which they are; with pragmas and other possible header guards) to avoid problems. When
    compilers look at cyclical headers, they try to do the best they can, and if it
    does not work, then you need to perform some tricks or modify your source code.
    If there was a chance that there were cyclical modules, this time the compiler
    will just say it will not even try to resolve it, and you need to modify the code. If
    you had one module that had a forward declaration:  #ifdef DOES_NOT_COMPILE  import  SecondType*
    pSecond; }; #endif  And another module that had the opposite forward declaration:  #ifdef
    DOES_NOT_COMPILE  import  FirstStruct* pFirst; }; #endif  The compiler will just
    fail, with some error that basically says you need to fix your bad design. The
    compromise to be made, is to combine them into one module, and have a forward
    declaration:    FirstStruct* pFirst; }; SecondType* pSecond; };  This is less
    than ideal and could cause problems in large, complex systems, but one of the
    few shortcomings with modules. Recipe 10.7: Importing the standard modules. Problem:
    We want to have to include fewer headers when dealing with modules. Solution:
    We will learn in C++23 that there are two standard modules: std and We saw earlier
    in this chapter that it was easy to have export import statements, to amalgamate
    other modules into one. That is what was done in C++23 to make it easier for developers
    to have cleaner code, and simplify the coding import process. They defined two
    modules: std and The std module includes:  Everything in the std namespace from
    the C++ library headers that was capable of being exported. The C++ headers for
    C library facilities (such as std::puts() from Declarations in the global namespace
    for storage allocation and deallocation (such as the new operator). The std.compat
    module includes:  Everything mentioned in the std module Declarations in the global
    namespace corresponding to declarations in the std namespace that are provided
    by C++ for the C library (such as the fclose() function) This means that you should
    be able to reduce the number of import statements required for some basic functionality:    {  { <<
    << __FILE__ << " : " << << << message = "Hello << message <<  } };  For more complex
    code, you will probably still have to include others, but this helps simplify
    things for some of the simple code files. Note that currently the Visual Studio
    compiler names the module but at this current time it is unknown if this will
    be the final name. Also note, that as the time of writing, Microsoft has not fully
    implemented the import std.compat module yet. They say there is a workaround,
    but we will not bother including it, and hope it gets resolved soon. Recipe 10.8:
    What are module partitions Problem: We would like a mechanism to split a module
    into multiple files. Solution: We will learn about module partition units. As
    mentioned earlier, a module’s name follows standard conventions, based on letters,
    numbers, and dots. There is no hierarchy involved. It is possible that you can
    have a module split into multiple implementation files, and this may be beneficial
    if your module becomes too large, or you want to separate the code into logical
    pieces. The mechanism for dividing up a module is called partitions. We have learned
    how you can immediately export the module you are importing. This is similar but
    has the extra benefit that it knows that other modules are parts of a larger module. We
    have divided our code into a couple of modules. There is no rule about how to
    partition them. It can be done with type definitions versus implementations, or
    into subcomponents, or however, you think makes sense.   }; Our other module file
    contains:  import }; left, RightHandType& right) { // ... }  Note the new character
    in the module name. The colon ) denotes it as a partition, and so it knows that
    Left and Right are partitions in the Chapter10_PartitionExample module. You will
    also notice that when we import a module, the name starts with a colon. This tells
    the compiler that it is a sibling partition, so we do not have to specify the
    full name, but just the ending partition part. And in our module, combines them:  Module10_8_PartitionExample;   right,
    LeftHandType& left) { // ... }  Here you can see again that we can export and
    import at the same time, but the name is specified with a colon, indicating that
    it is a partition of the parent. This partitioning mechanism is another feature
    that allows you to organize your code more cleanly and easily than if you only
    had header files to use. Conclusion Hopefully, you can understand how modules
    are a great addition to the C++ language, and how impactful it may become. Remember
    you have lots of choices on how to implement them. You can have separate declaration
    and implementation files as we have traditionally had, or you can combine them
    to avoid duplication. You could rewrite your code to get rid of the secret implementation
    functions you created, and leverage the private module fragment to hide them that
    way. You can also split your code into module partitions, to organize things logically
    that way. Once you migrate to modules, you will notice an improve in your compile
    times and appreciate that your code looks cleaner. Points to remember  Modules
    were a huge new feature of C++20, and there could be ripple effects on how they
    are used for years to come. Module names are not related to namespaces, class/type
    names, or file/folder names, but you should carefully think about the logical
    hierarchy of your naming convention. Although modules are great for new code,
    it will take effort to improve your old code. The private module fragment should
    greatly improve encapsulation, as well as readability, or your code. You can import
    the std or std.compat modules, to simplify your import (or include) statements.
    If you need other headers, you should try import rather than including them. Partitions
    are a handy way of adding an extra logical layer of organization. References  CoreCPP.
