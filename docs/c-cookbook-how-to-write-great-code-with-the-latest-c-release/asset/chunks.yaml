    Related Specifiers Introduction The C++ keyword const has existed since C++ 98,
    and it helps the coder know when a variable or parameter can be modified. The
    C++ world of const-ness did not change much, until C++11 with the keyword It had
    improvements in the C++ 14 release, and again how the language dealt with const-ness
    did not change for several years. In C++ 20, not only were there further improvements
    to but two other keywords, consteval and were introduced. These added great power
    to the programmer, but more so for the compiler. They help the compiler understand
    what it can optimize and compile down to make the code run faster. What went from
    a simple mechanism, to denote a value could not be changed, to several mechanisms
    that can work together to not only ensure values are not changed but significantly
    speed up the performance of the code. Structure In this chapter, we will cover
    the following recipes:  Recipe 7.1: constexpr enhancements Recipe 7.2: constexpr
    for transient allocation Recipe 7.3: consteval Recipe 7.4: constinit Recipe 7.5:
    constexpr if Recipe 7.6: if consteval Recipe 7.7: Some hidden problems with constexpr Unfortunately,
