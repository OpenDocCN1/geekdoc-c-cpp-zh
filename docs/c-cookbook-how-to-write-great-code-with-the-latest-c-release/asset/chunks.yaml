    that is not the focus. It is relating to initializing aggregates, which is what
    we want to talk about. C++20 cleaned up a number of small issues relating to initialization.
    (See references) The first was more of an inconsistency than an attempt to make
    your code safer. In the following example, we have removed the constructor of
    our Thing class. That means that you cannot just create an object. In C++17, you
    could create it with an empty initializer. That ability, albeit a breaking change,
    seemed worthwhile to clean up in C++20. Another inconsistency dealt with parentheses
    versus braces, and so now you should, in most situations, declare an object with
    either. One of the problems was for asserts, or other macros. You could instantiate
    an object with parenthesis within a macro, but the compiler did not understand
    when you tried to instantiate an object with braces. There were also problems
    when trying to do perfect forwarding in templates, and so emplace and make_unique
    did not work for aggregates. Since C++20, aggregate initialization can be with
    either, and will work in the same manner, except that:  Parenthesis () does not Braces
    { not allow narrowing conversions. But the suggestion is, that if you know your
    code is correct, if one fails then try the other approach. Another initialization
    feature relates to range-based loops. In our example, when you call it may be
    library code that you do not know how it works, and when you call it might be
    trying to loop on a temporary variable, which could cause undefined behaviour.
    In C++20, they defined an initializer that you could have before your loop. This
    would mean your variable stays in scope for that loop, and you do not have to
    worry about it.  { Thing() = }; { int x; int y; }; {}; { // other code { } }; Menu
