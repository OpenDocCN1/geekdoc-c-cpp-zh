    something that sounds simple such as comparison, has a lot of different pieces
    to it. For this chapter on iterator concepts, by the time we are done, you might
    get the same feeling. Unlike other concepts, some of these iterator concepts are
    a piece of the puzzle. We are not saying it is complicated, but there are different
    things to consider. You can think of an iterator just as a pointer that walks
    through a collection, and you can look at the de-referenced value, meaning the
    value that the iterator is pointing to. Of course, there are different ways to
    create or use an iterator. Iterators can be just for reading, or just for writing
    (and of course, both). Iterators can start at the beginning, the end, or somewhere
    in the middle of your collection. We will go into the different concepts available,
    so that you can decide which is the best concept to use when creating function
    arguments, or when creating your own concepts. This chapter will also look at
    sentinels, and Unlike previous chapters, you probably will not reuse most of these
    concepts. Many of these smaller iterator concepts are to describe facets of what
    the larger concepts do. They are still worth mentioning, because we will see them
    as requirements for concepts in future chapters. Structure In this chapter, we
