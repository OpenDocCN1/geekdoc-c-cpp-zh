    the New Callable Concepts Introduction We have covered a variety of groups of
    concepts, and callable concepts is the last of this main group of chapters on
    concepts, although we will certainly be talking more about them later. In a broad
    sense, a callable is something that one can call to execute some functionality.
    For our C++ purposes, it would be a type for which one could invoke. There are
    different entities one can invoke, and there are different mechanisms in how you
    can invoke them. We will go into some detail, (but not too deep), so that we can
    talk about how to set up some of the concepts. We have several concepts that we
    are going to talk about, but some of them are not directly used that much, and
    some are more related to ranges. Just like anything else related to concepts,
    it will be good to at least learn about them, in case you need to set something
    up with them. Certainly, C++ is very different today, versus how it looked in
    the pre-modern era. There is a lot more focus on organization, and defining things
    in a way that they can be flexible. The goal is to keep classes small, functions
    small, and utilize the power the language, the compiler, and the operating system
    offers us. That means being able to take a small piece of code, and to define
    that we have choices on how to execute that code. It could be to execute it right
    away, or we could execute it later, after something else gets completed. That
    something else could be unrelated, by tasks that are queued up so we do not over-burden
    the system, or that something else could be related, and we are saying that to
    execute some code, something else has to happen which puts us in the right state.
    All of these choices means there is more to understand, but also gives us great
    power on how we want our program to run. Structure In this chapter, we will cover
    the following recipes:  Recipe 6.1: invocable Recipe 6.2: regular_invocable Recipe
