    from https://en.cppreference.com/w/cpp/language/class_template_argument_deduction CHAPTER1Working
    with Concepts Introduction Concepts were a big new feature (part of The Big Four
    features) of C++ 20\. The proposal had been around for several years, hoping to
    become part of the official C++ language, but due to all the implications and
    scenarios, it took a long time to be fine-tuned to get eventually accepted. The
    idea of concepts is about as old as templates (which were first introduced in
    C++ 11). Unfortunately, we only got to experience templates by themselves for
    over a decade, which is longer than what people would have wanted. Templates are
    powerful, but they were found to be too vague in dealing with all the entities
    that were passed to them, such as:  If you pass a string, when at first when the
    code was created, you were thinking you would only be passing numbers, or perhaps
    when passing things such as collections; Passing complex structures, although
    you initially assumed you would use just simple types. Templates were poor at
    type-checking cleanly and/or easily; the problem being, when you pass something
    specific into a vague template, you end up with tricky runtime errors, which of
    course is too late to deal with in a clean manner. At best, you get extremely
    confusing compiler errors. Compilers (that handled templates properly) tried to
    do their best to tell you what the problem was, but it took a lot of effort (and
    patience) to understand what the compiler was trying to tell you about the coding
    issue that was related to the template. Concepts put restrictions on templates,
    and so, the runtime and even compile time troubles go away if you give a little
    bit more of a description to the types of data you are passing in. As we progress,
    you will learn that this little bit of extra effort required, makes things clearer,
    a lot easier to use, and a lot more powerful too. Concepts are a breakthrough
    way of simplifying how you will code going forward. If you worked with templates,
    then you will greatly appreciate how confusing and frustrating it was, to deal
    with template compile errors. The constraints for concepts are checked at compile
    time, and the error messages are much more understandable than before when using
    just templates. Let us focus on the new era of concepts because they are huge
    - you will soon always use concepts, and rarely use templates on their own. To
    answer the question that you might have been thinking: If the book includes the
    latest version of C++ which is C++23, then why start the book with a chapter about
    C++20?Here are a few reasons:  Just in case the reader has previously used a version
    pre-C++ 20\. Concepts are such an important new feature that it is worth reviewing. C++
    20 was a good release in that it had a lot of big features, but there were also
    many shortcomings and little issues that needed to be fixed/improved in C++ 23.
    So, without getting into specifics about it, we can say that C++20 is when concepts
    were introduced, and C++ 23 is when concepts were ready for wide use. Perhaps,
    some coders did not rush into C++ 20, thinking it was too new to use. Concepts
    are used in other features of C++ 20 and C++ 23, so, it is important to have a
    solid understanding of them. Quick takeaways of concepts would include:  Concepts
    (designated by the new keyword are evaluated at compile time. They constrain parameters
    (template arguments). They help make the code cleaner, and certainly make compiler
    errors cleaner and easier to understand. Concepts simplify how templates are used
    (and reused). You can think of concepts as an interface (as you might in Java
    or C#), or (almost) as a type, which has defined constraints, or you can think
    of them as a set of requirements – to which your entities will match up with.
    At times, they may not appear to add much, but for those that used templates a
    lot before, they will soon appreciate the new feature. Structure In this chapter,
    we will cover the following topics:  Recipe 1.1: Creating your first concept Recipe
    1.2: Using a concept Recipe 1.3: Creating a constraint Recipe 1.4: Creating a
    conjunction Recipe 1.5: Making a requires clause Recipe 1.6: Constraining a function Recipe
    1.7: Creating a requires expression Recipe 1.8: Multiple requires expression Recipe
    1.9: Nested requirements Recipe 1.10: Function templates Recipe 1.11: Compound
    requirements Recipe 1.12: Different types of expressions Recipe 1.13: Specializations Objectives By
    the end of this chapter, the readers will be introduced to the concept, with practical
    help from the various recipes added. They will also learn how to create a constraint
    for a template or a function, what the required keyword does and what are the
    requires clauses. Lastly, the chapter will also discuss the different types of
    requires expressions. Recipe 1.1: Creating your first concept Problem: We want
    a better way to use templates. A big new feature in C++ 20 is called concepts. You
    will always need to include the concepts header (concepts), which defines concepts
    and a lot more, that we will get into later. Our header will define an overly
    simplistic entity; since we are working with a cookbook of recipes, we want something
    that counts recipes. There could be a few or many thousands of recipes. The main
    idea to focus on is that the number is whole, without fractions.  // chapter1.h #include template
    <class _="" span="">T></class> concept PageCount = std::is_integral_v<t>;</t>  One
    thing to note is that there are different ways of specific something. For example:  template
    <typename _="" span="">T></typename> concept PageCount = std::is_integral<t>::value;</t>  Under
    the covers, the compiler will create slightly different code, but for simplicity’s
    sake we will say the 2 PageCount definitions are the same.  Note: One tricky area
    about concepts (or about templates, or about several features of C++ in general)
    is that it can be written in different ways. Most times it will not make a difference
    how you define it, but do not be alarmed when you see something written differently.  So
    now, our PageCount has the constraint that T must obey the class template (defined
    in C++ 17), saying that the type must be an integer. Now, again, this does not
    give any big obvious gain over just using a template, but using concepts will
    give you:  Compile time type-checking Clearer messages, if there is a compile-time
    problem As we will see soon enough, we can build off of the concepts we define. Recipe
    1.2: Using a concept Problem: How to restrict a function argument to only allow
    types with specific constraints? Solution: Concepts can be used in different ways.
    One handy way is a function argument. To use our concept, we could simply have:  #include
    "chapter1.h" PageCount auto AddPageCounts(PageCount auto chapter1, PageCount auto
    chapter2) { return chapter1 + chapter2; }  This function adds up the number of
    pages in the first two chapters of our cookbook. If we did not know what PageCount
    was, we get a hint it is a concept (versus a type) because it includes the keyword
    auto in the declaration. You might ask why we just added two values instead of
    a collection of values. Here are a couple of reasons:  We could have defined many
    parameters in the function, but we wanted to keep it simple for our example. Since
    PageCount is a concept and not a type, we could not have coded our parameter as
    a collection of concept values. To accomplish that, we would have to define another
    concept. The C++23 compiler does not understand if we had AddPageCounts(PageCount*
    chapters, int numberOfChapters) or used a contain, such as AddPageCounts(std::vector<pagecount></pagecount> Suggestion A
    brief aside, and a quick reminder, that you might be asking why even bother with
    a concept or a template. Why can we not simply say that the method uses an integer? You
    can definitely do that, but remember that C++ has lots of variations for the integers
    of various sizes, whether it is signed or not, as shown in the following list:  Short
    (or short int, signed short, signed short int) Unsigned short (or unsigned short
    int) Ont (or signed, signed int) Unsigned (or unsigned int) Long (or long int,
    signed long, signed long int) Unsigned long (or unsigned long int) Long long (or
    long long int, signed long long, signed long long int) Unsigned long long (or
    unsigned long long int) When you have so many types of integers, a template and
    type check can be very handy. If you just use a template, then you are confining
    all of your variables to be of that specific type. That is fine if you are defining
    a library function that can be used with different types, as long as each particular
    invocation of that function uses the same type each time. In other words, if it
    was just a template, then you could call it with an int and an int. Another time,
    you could call it with two unsigned longs. The template gives you some flexibility,
    as long as you are consistent in each usage. Implementing your function using
    a concept, allows you to mix your types, as long as the types adhere to the requirements
    specified. Whether writing the functions or calling the functions, concepts add
    that extra bit of clarity to help you understand how to use the function. It also
    gives that extra safety, so you know the function will be used as expected. We
    can create a little function that uses our  static void AddSimplePageCounts()
    { unsigned short int ch1 = 4; long long ch2 = 123456; auto chapterTotal = AddPageCounts(ch1,
    ch2); }  Although we are passing different types of values to our function, since
    it knows that it adheres to an integer type, it can add the two values together. Recipe
    1.3: Creating a constraint Problem: How to reuse a concept to create another constraint? Solution:
    Using a concept as an argument and returning a Boolean can be rather handy. You
    will start to realize the potential of concepts; instead of having a method such
    as AddPageCounts that returns the same type of value as you provided, you can
    have a function that can also act as a constraint:  // function that uses our
    previously defined PageCount bool IsEvenNumberOfPages(PageCount auto n) {   return
    (n % 2 == 0); }  As mentioned earlier, things get more interesting when we start
    to combine concepts and constraints. We can do that, although, using logical operators. Recipe
    1.4: Creating a conjunction Problem: Is it possible to combine multiple concepts? Solution:
    You can use logical operators to leverage existing concepts into new ones. Let
    us tweak our existing concept since it does not make sense to have a negative
    number of pages:  // a concept that uses another C++ 17 class template template<class
    _="" span="">T></class> concept UnsignedPageCount = std::is_unsigned<t>::value;</t> //
    a new concept combining other concepts template<class _="" span="">T></class> concept
    UnsignedEvenPageCount = UnsignedPageCount&& IsEvenNumberOfPages<t>;</t>  So now,
    at compile time, you will get a readable error message if you do not assign an
    even integer to  Note: This definition that contains a combination of multiple
    concepts is called a conjunction. If instead you use the logical OR (||) instead
    of the logical AND (&&), it is called a disjunction. Naturally, it satisfies the
    definition if either of the two constraints are true. You can overload (basically
    define a sub-type) for more detailed concepts. Suggestion In case you are not
    that familiar with them, you will see that the book has already used a couple
    of constraints such as std::is_integral_v and These are in the library header
    which was introduced in C++ 11. A lot has been added in subsequent releases. Although
    not used every day, it would be a good idea to take a look in there and see how
    those definitions can be used when you make your own concepts. Another type of
    constraint is called which is an expression that can be evaluated at compile time.
    It cannot be broken down any further, such as the case if it is evaluated to a
    If we look at some code:  template <typename _="" span="">T></typename> concept
    LargePageCount = std::is_integral_v&& sizeof(T) > 4; void PrintPageCount(LargePageCount
    auto count) { std::cout << "That is a big chapter!: " << count << "\n"; } void
    PrintPageCount(PageCount auto count) { std::cout << "This is a small chapter:
    " << count << "\n"; } static void PrintPageCounts() { unsigned short int ch1 =
    4; long long ch2 = 123456; PrintPageCount(ch1); PrintPageCount(ch2); }  We defined
    a new concept named This is a conjunction, combining two different constraints.
    The first is the integral check we have been using, and the second is checking
    the size. This sizeof check is atomic, since it is either true or false. The output
    of the function is: ![](image-5sfzcoib.png) Figure 1.1: Output from PrintPageCounts Although
    our two PrintPageCount functions have different signatures, we had to place the
    one that uses LagePageCount first. Otherwise, when the code ran, it would have
    used the first function it could, and even with a large value, it would still
    work with the one that uses the regular PageCount parameter.  Note: Just like
    the rules of evaluating a math equation, there are rules, or orders of precedence,
    on how constraints are judged. This is something readers must know.  Another keyword
    introduced in C++ 20 is The requires keyword is used to specify extra constraints
    on the arguments or on the declaration itself. You could use requires on normal
    templates too. Although our focus is on the new features, note that you can always
    create your constraints. Recipe 1.5: Making a requires clause Is there more than
    one way to define a concept? The requires clause is another mechanism that allows
    you to state a constraint. We will change our function from earlier from:  template<class
    _="" span="">T></class> concept UnsignedPageCount = std::is_unsigned<t>::value;</t> //
    a new concept combining other concepts template<class _="" span="">T></class> concept
    UnsignedEvenPageCount = UnsignedPageCount&& IsEvenNumberOfPages<t>;</t>  We can
    also have our code look like this, which is a bit different, but we would get
    a similar result:  template<typename _="" span="">T></typename>   requires UnsignedEvenPageCount bool
    IsEvenNumberOfPages(T n) { return (n % 2 == 0); }  In the previous concept example,
    we used a function to help constrain a type. In a way, this concept requires a
    type to help constrain a function. Again, for the most part, it can be used in
    the same manner as before – however, this version is written with a requires clause
    after the template parameter list. In some scenarios, you can state the requires
    constraint after a function declarator. Recipe 1.6: Constraining a function Can
    you use a requires clause to constrain a type or a function? The requires clause
    defines the constraint before your function code. To restrict the type used, we
    could rewrite a previous example and have our fictitious code as:  template<typename
    _="" span="">T> requires PageCount</typename> T AddPageCounts(T a, T b) { return
    a + b; }  This will ensure that we do not provide something like strings that
    would append, or collections that get added together. Keep in mind, that this
    code would not pass scrutiny since it does not do bounds checking. The preceding
    code snippet shows an example of the requires clause, where the keyword states
    the constraint on the template argument or the function declaration. Recipe 1.7:
    Creating a requires expression Do we need to define the constraint in the preceding
    code, where we use the type? A requires expression allows you to define your constraints
    in a code block after the concept name. The other scenario is to use a requires
    expression. This type of constraint is similar to being atomic, where it evaluates
    the expression of type bool to ensure the condition is true:  template<typename
    _="" span="">T></typename> concept IsAddable = requires (T a, T b) {  a + b;  };  In
    this scenario, it does not return any numerical value. The constraint just says
    that it is possible to add two values together. So, in this snippet, you could
    add two strings together. Recipe 1.8: Multiple requires expressions Does stating
    the requires expression in a code block mean we can state multiple constraints? The
    requires expression can hold/define many facets of the concept (whether you call
    them capabilities or restrictions).  Note: The syntax in the prior example. Within
    the brackets, it has the expression a + b; only, although when used, the result
    would be non-Boolean. This constraint is a Boolean saying it is possible to add
    two values together.  To tighten up that code, if we wanted to ensure it was integers
    we were trying to add, we can have multiple expressions:  template<typename _=""
    span="">T></typename> concept ArePageCountsAddable = requires (T a, T b) {   a
    + b;   std::is_integral_v<t>;</t> };  Understandably the example is rather contrived,
    needing to check if numbers can be added - when inherently we know they can be.
    However, it is a simple example of the feature’s capabilities. In the expression,
    the first expression on line 3 is called a simple and the second on line 4 is
    called a type Another usage is that of a compound which defines constraints on
    return types:  template<typename _="" span="">T></typename> concept HasDoubleIt
    = requires (T t) {   { t.DoubleIt() } -> std::convertible_to<int>;</int> };  For
    this snippet, the concept HasDoubleIt has the constraint that the type must contain
    a function named The syntax says the result (indicated by the must be convertible
    to an Keep in mind that the return constraint may not be a simple type. The return
    type being convertible means that it can be converted to an which has more leeway
    than if your constraint was just using    { t.DoubleIt() } -> std::same_as<int>;</int> Recipe
    1.9: Nested requirements If we can have multiple constraints in a requires expression,
    can we have multiple requires also? There is the ability to combine multiple requires
    statements to create a more complex concept. The last scenario to discuss is nested
    which relate to constraints on type parameters by reusing previous concepts:  template<typename
    _="" span="">T></typename> concept UnsignedOddPageCount = UnsignedPageCount&&
    requires(T) {   requires !UnsignedEvenPageCount<t>;</t> };  The usage would be
    as follows:  // is fine since we provided an unsigned UnsignedOddPageCount auto
    a = 43u; // will not compile since we provided an even number UnsignedOddPageCount
    auto a = 42u; // would not compile, since the number 43 is signed UnsignedOddPageCount
    auto a = 43;  So, remember that there are different ways to write the same (or
    at least very similar) thing, but the UnsignedOddPageCount example shows that
    you can reuse a constraint as a requirement. Just be wary that it is dangerous
    to define a constraint as the negation of another constraint. Recipe 1.10: Function
    templates If we can define concepts in different ways, is there one way that is
    better than the others? How you define your concept can depend on your style and
    what works best in each situation. If we think of different ways to write the
    same thing, we can go over function templates, as follows:  #include template
    <typename _="" span="">T></typename> concept PageCount = std::is_unsigned<t>::value;</t> auto
    AddPageCountsUsingAbbreviatedFunctionTemplate(PageCount auto a, PageCount auto
    b) { return a + b; } template <typename _="" span="">T> requires PageCount</typename> auto
    AddPagesCountsUsingRequiresClause(T a, T b) { return a + b; } template <typename
    _="" span="">T></typename> auto AddPageCountsWithTrailingRequiresClause(T a, T
    b) requires PageCount{ return a + b; } template <pagecount _="" span="">T></pagecount> auto
    AddPageCountsWithConstrainedTemplate(T a, T b) { return a + b; }  We have seen
    our definition of PageCount before. Further, we have also seen our example of
    although here it returns auto instead of which might be a bit safer. You might
    see functions such as which specify the requires and then the function. For it
    moves the requires to after the function name. Lastly, as you see with instead
    of specifying we could embed the concept name into the template and the compiler
    should generate the same code.  Note: You will have to follow the corporate coding
    guidelines, or at least try to be consistent. Recipe 1.11: Compound requirements What
    requirements can we place on a template type? Concepts allow to put various constraints,
    similar to an interface. When you look at the next example of compound you realize
    you could use concepts (with or without almost like an interface:  template<typename
    _="" span="">T></typename> concept DoesMagicalThings = requires(T t) { { t.Magical()
    } -> std::same_as<void>;</void> };  Basically, within the concept block, we are
    defining what the concept’s traits are. They could be methods, member properties,
    type constraints, and so on. If you recall in our earlier example, we used ->
    showing we need a function to return and this example says that it is the same
    as void. This looks a bit odd, but there was a clarification to the standard and
    decided to do things this way. Previously it was possible to say -> int but there
    were cases where this was not desirable. You can still leave off the return type
    and just have Then, it does adhere to the function name, but it does not check
    the return type. So, it could be or and so on. Recipe 1.12: Different types of
    expressions Needing to be able to constrain a function’s return type in different
    ways. Concepts can constrain the return value, but it needs to be exact, or at
    least similar. Speaking of signatures for requirements, let us consider the following
    snippet:  template<typename _="" span="">T></typename> concept HasDoubleIt = requires
    (T t) {  // member function that returns the same type,  // but still could overflow 
    { t.DoubleIt() } -> std::convertible_to<t>;</t> // similar to above, but is a
    static function  { T::DoubleIt(t) } -> std::convertible_to<t>;</t>  // just in
    case the large number is odd,  // and we’d have a leftover fraction  { t.HalfIt()
    } -> std::same_as<double>;</double>  { t.SomeNoExceptFunction() } noexcept ->
    std::same_as<int>;</int> };  Here are a few things to note:  The last SomeNoExceptFunction
    was added to note that in addition to the function name, function parameters,
    and return type - the compiler also checks on noexcept clauses. So, if you provided
    a type that had SomeNoceptFunction but did not have then it will not match. For
    those who know the language, it does seem to be a bit Python-esque, where (in
    pure terms) it does not define an interface. However, if what you defined obeys
    the requirements of the interface definition, then it is considered that type. Some
    of this relates to an odd acronym called Substitution Failure Is Not An Error
    The premise is that when the compiler is evaluating template type substitutions,
    in some cases, supplied arguments will not fit into the template definition. Instead
    of immediately failing with an error, the compiler will just go on and try another
    template. So, when trying a particular type to see if it adheres to the concept,
    failing the first time does not mean that nothing will ever work. Rather, it just
    means that the template does not fit for that example. To illustrate this, let
    us look at another snippet. Recipe 1.13: Specializations It would be good to have
    a mechanism that checks for the variables we need. Concepts can define a constraint
    so that the proper variable exists. Refer to the following code snippet:  #include template
    <typename _="" span="">T></typename> concept HasIngredientList = requires (T v)
    { v.IngredientList; }; template <typename _="" span="">T></typename> concept CompleteRecipe
    = requires (T v) {   v.IngredientList;   v.Instructions; }; void RecipeFunction(HasIngredientList
    auto x) {} void RecipeFunction(CompleteRecipe auto x) {} struct ThingWithIngredients
    {   int IngredientList; }; struct ThingWithSomethingElse {   bool IsHealthy; }; struct
    ThingWithIngredientsAndInstructions {   int IngredientList;   int Instructions; }; struct
    AnotherThingWithIngredients {   float IngredientList; }; int main() {   // compiles,
    since only one method is possible RecipeFunction(ThingWithIngredients{});   //
    compiler error, since the parameter doesn’t match any functions   RecipeFunction(ThingWithSomethingElse{});   //
    compiler error, since ambiguous   RecipeFunction(ThingWithIngredientsAndInstructions{});   //
    also compiles, even though member variable is a different type   RecipeFunction(AnotherThingWithIngredients{}); }  So,
    here we have two concepts: one that has a member variable and another that has
    IngredientList as well as We have two overloaded functions named that take different
    arguments. We have then defined a few structures with various fields. When you
    call a function with everything builds without issue. That is because ThingWithIngredients
    has and there was one function that accepted an IngredientList as an argument. When
    we call with it cannot find any function that takes that as a parameter – so naturally
    it fails to compile. The interesting scenario is when we call using Some might
    think it would be fine since that matches the requirements of the CompleteRecipe
    concept. The problem, however, is that it also still matches the function that
    accepts the concept and so, it is a compiler error saying it is ambiguous. The
    other case, when we use an instance of also works fine. That is because we never
    specified the type for the member fields, but just the name. To fix our ambiguous
    problem, we will have to make an adjustment to the concept requirements:  template
    <typename _="" span="">T></typename> concept CompleteRecipe = HasIngredientList&&
    requires (T v) {   v.Instructions; };  If we say that one concept is more specific
    than the other (but adding a requires clause), then the compiler can figure things
    out.  Note: Different to the preceding example where a requires expression might
    be embedded within a clause, you might see a requires requires clause. This would
    be used in something called an anonymous concept. Note that although it could
    be done, it is something that should not actually be done - it just seems safer
    to state them separately.  Some other things to keep in mind about concepts are
    as follows:  Concepts cannot be recursive. They cannot be partially defined. They
    can be redeclared. However, this is not normally desirable and thus it is something
    to be aware of. Conclusion This chapter showed you that concepts are an extremely
    important new feature of the C++ language. They have made using templates very
    accessible; it is a lot easier to understand when the compiler gives you an error,
    and a lot more flexible. We have shown there can be different parts of a concept,
    from the requires clause to all the different ways to state requires expressions. In
    the next chapter, the book will show you that there are a lot of new concepts
    built into the language that you can use. Points to remember  Concepts were a
    new C++20 feature. Concepts will greatly enhance and make it easier for you to
    do templates. There are different ways to define how you want to make a constraint. References  CPPreference.
