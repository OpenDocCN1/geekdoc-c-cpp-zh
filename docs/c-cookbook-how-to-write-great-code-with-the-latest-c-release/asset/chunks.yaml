    out there who see them and yell That will be handy! Conclusion After this chapter,
    you see the power that the ranges library brings. You can start with a container,
    which is interpreted as a range. We can then call one or more adaptors, which
    results in a view. We also saw with the pipe symbol that it is really easy to
    pass containers (or other types) into adaptors, and we can even chain adaptors
    together! The ability to separate, manipulate, and join data back together is
    one of the most powerful features C++ has had in many releases. You can change
    the values, and/or what you are looking at, without using loops, or long custom
    functions, or lots of temporary variables. We wanted to give one last example
    about how powerful ranges and views can be. Although there were some hacks, and
    using a third-party library in spots, it is worth watch a CPPCon video on making
    a calendar. Points to remember  While ranges were originally released in the C++20
    release, there were some new adaptors in C++23\. Using the pipe symbol to compose
    multiple adaptors together is incredible. Think about how you want to look at
    your data because there is probably an adaptor that will take how your data is,
    to how you want to use it. Adaptors still give you the ability to transform and
    filter your data. This gives you extra power to easily change the values you are
    looking at. Most adaptors are lazily executed, and so it does not process the
    value until it needs to. In addition to that, since adaptors can be chained together,
    you could see a nice performance boost. There may be some legacy, or special reasons
    that you will have to adjust the state of your data. Luckily, there are some adaptors
    for those cases as well. References  CPPreference. (n.d.). SFINAE. Retrieved from
