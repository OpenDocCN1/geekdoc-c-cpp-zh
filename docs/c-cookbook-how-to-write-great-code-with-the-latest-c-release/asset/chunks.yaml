    bit in this chapter. We dove down to talk about various aspects of a callable
    (or invocable, if you prefer). We went off on a couple of tangents into sorting,
    but it is good to understand what the meaning is behind some of these concepts.
    They offer checks to ensure the code is done properly, and it should also help
    your code be cleaner as well, which is not always easy to do with callables. We
    are going to move away from concepts for now, to talk about const-related specifiers. Points
    to remember  Three are different types of callables, some are easier and/or better
    to use than others. There are different ways to call a callable, although there
    are both advantages and disadvantages to them. There are many callable concepts;
    they were created to make your code a bit cleaner, but mainly as a check to ensure
    things are being done properly. Some concepts care about the return type, some
    do not. There are many related concepts: some that deal with the values directly,
    and some are for when the value is used indirectly through a reference. References  CPPStories.
