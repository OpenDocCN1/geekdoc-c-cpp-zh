    and spending time with his family. About the Reviewers  Maxim Chetruşca is a Software
    Engineer with almost a decade of professional experience in C++. Throughout his
    career, he focused on real-time, latency sensitive systems. During his work, he
    used C++ for the backend of the busiest websites, distributed databases as well
    as squeezing microseconds from high frequency trading systems. A firm believer
    of C++ philosophy, he had the chance to use the language versions ranging from
    03 to 20 in production, running the code on 4 different platforms. Outside of
    working hours he spends time learning about new car models with his 2-year-old
    son. Kris Jusiak is a passionate Software Engineer with experience across various
    industries, including telecommunications, gaming, and most recently, finance.
    He specializes in modern C++ development, with a keen focus on performance and
    quality. Kris is also an active conference speaker and open-source enthusiast,
    having created multiple open-source libraries. Chetan Sachdeva is a Tech Enthusiast,
    with over 13 years of expertise in C++ and Python in software development. With
    a dynamic career spanning Automotive, AR/VR, IoT, Android native development,
    Typography, and Printing RIP. His true passion lies in solving complex problems
    with data structures and algorithms. His entrepreneurial spirit has led to the
    successful design of software and products for startups. Beyond his professional
    endeavors, Chetan is an avid reader of non-fiction and IT-related books, staying
    at the forefront of industry trends. Acknowledgement I remember that warm summer
    day in the mid-1970s, when my father’s father told me You should get into and
    me not knowing what one was. I remember my dad taking me into his work, because
    they just got their first computer there. I later recall when my parents got us
    our first family computer, I thought to myself, I will never be bored I have to
    thank them for that, because I have not been bored yet. I am very grateful to
    all those publishing material (books, web-pages, videos) in the goal of wanting
    people to learn what they know. I hope I have done your efforts justice. My gratitude
    also goes to the team at BPB Publications, for giving me a chance to do this. Preface C++
    Cookbook walks you through all the recent new features. In a cookbook-type style
    that talks about each new class or function, it shows you in simple terms how
    to use it. Authored by a software professional, with over 3 decades of experience,
    their passion for coding shows in the book. This book takes the reader on a tour
    of what they will need to know to be up to date with the latest C++ abilities. The
    book outlines new features, with lots of code examples. They can use it as a reference
    guide, or progress through each how-to recipe to maximize their knowledge. Sometimes
    it will give suggestions on the best approach, but mainly wants to inform you
    of options, and lets you take the right path for your individual situation. The
    book should help those that have not kept up to date with recent C++ releases.
    Whether your company was sticking to an older standard, or you are starting with
    a new product. There are a lot of great new features available, and this book
    will help you working with the latest and greatest functionality. You can walk
    through all the chapters with their code examples, or use it as a quick-reference
    guide for something specific. After reading it, you will be up to date and will
    make you and your project work better. Chapter 1: Working with Concepts – It defines
    what a concept is, how to use one, and how to create your own. It discusses the
    different styles how concepts are defined; whether creating a single constraint
    on a variable or a function, making a requires clause, or combining concepts to
    make a conjunction or compound requirement. Chapter 2: Using the New Core Language
    Concepts – The chapter initiates a long journey to learn what existing concepts
    are included in C++. There are concepts for comparison, assignment, checking on
    the type, and hierarchy. Chapter 3: Using the New Comparison Concepts – The chapter
    continues delving into predefined concepts. We look at those relating to equality,
    and comparison. Chapter 4: Using the New Iterator Concepts – Our next step into
    concepts looks at all of the concepts defined for iterators, and also talks about
    the progression of functionality with types of iterators. We also touch on some
    other concepts relating to moving or copying values. Chapter 5: Using the New
    Object Concepts – We pick up where we left off, talking about concepts relating
    to the constraints of moving or copying values. We also discuss the similarities
    and differences between the concepts semiregular and regular. Chapter 6: Using
    the New Callable Concepts – We will talk about concepts relating functions, or
    other mechanisms that we can call to execute some code. Chapter 7: Const Related
    Specifiers – With this chapter, we end our lengthy talk about concepts and discuss
    specifiers relating to defining what is constant. We go over previously existing
    specifiers, and talk about newer ones that will help your code be more efficient. Chapter
    8: Concurrent Processing – The chapter discusses threads, callbacks, and different
    ways for your code to be executed safely by different threads at the same time. Chapter
    9: Coroutines – The chapter presents a new mechanism for executing code. We get
    into the details of the parts of a coroutine, how to create them, and how to use
    them. Chapter 10: Organizing Your Code with Modules – The chapter covers a great
    new addition to the language. Modules will help you organize your code easier.
    We get into the details of its components and go through how to using other modules,
    and learn how to write our own code. Chapter 11: Introduction to Ranges and Views
    – The chapter starts discussion about what ranges, views, and spans are. The differences
    between them, and how to use them are discussed. Since ranges relate to concepts,
    we will talk about some of the existing range concepts. Chapter 12: Range Access
    and Non-Modifying Sequence Functions for Ranges – The chapter continues to discuss
    ranges, and some of the functionality relating to subranges, sizes, iterating,
    and comparing. Chapter 13: Range Algorithms: Sort, Search and More – The next
    leg of our journey talks about ranges deals with searching and sorting. We can
    perform functions on a range to get a value, or even a new range by doing a permutation. Chapter
    14: Range Algorithms: Memory and Modification Functions – We focus on memory;
    moving values around, and doing transformations. Chapter 15: Views and Range Adaptors
    – The chapter talks about the many functions that exist so we can get values in
    a view by calling a range with an adaptor. Chapter 16: Range Factories and Utilities
    – We conclude our talk about ranges by showing some exiting new functionality.
    We can create an infinite view of values, whether by using a simple function or
    a generator. There is code showing how to even format your range for output. Chapter
    17: New Features for Containers – The chapter covers a lot of ground, dealing
    with new container types, and simple new functions. Chapter 18: Making it Easier
    to Code – There are a number of new features discussed that you will be happy
    to see such as easier output, new enhancements for strings and ranges, plus an
    easier way to use enums and bits. There is also new types for dates, times and
    time zones. Chapter 19: Making Your Code Cleaner – The chapter covers many recent
    features for lambdas, new suffixes, optional and expected arguments, plus new
    preprocessor directives for cleaner code. Chapter 20: Making Your Code Safer –
    The chapter touches on some important new features to make code less fragile. Chapter
    21: Making Your Code Faster and Easier to Debug – We conclude by talking about
    ways to make your code run faster; including some new functions, and new attributes.
    We also talk about new types that could help you debug your code. Code Bundle
