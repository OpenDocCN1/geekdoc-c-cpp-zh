  ![SQL](img/00006.jpeg)\n\n## 引言\n\nC++ 的许多应用涉及更复杂的软件部分组织，包括图形和科学计算。这并不是说 Java 或语言缺乏处理这类问题的能力。C++\
  \ 在这些领域确实有历史，其祖先是 C 编程语言。最好的看待方式是，C++ 在 C 语言的基础上增加了一些面向对象的原则（`OOP`），以便在当时更加现代化。\n\
  \n（注：原文中引言部分存在大量重复，此处已按要求仅翻译一次）\n\n\n\n\n编程中重要的语法结构主要是分隔符的放置。更具体地说，是语言要求我们如何构建函数、给入口函数起什么名字，以及语句是否需要终止符。后者的一个例子是在\
  \ `C++` 和其他语言中基本上将分号用作句号使用。\n\n最后一次提到主要是关于一种名为 `Python` 的语言。它使用制表符（tabs）作为指示，来判断下一行是否属于函数、循环或类块的一部分。它与\
  \ `C++` 相比有种令人喜欢的、不同的风味，在我们掌握了仍需涵盖的基础编程概念之后，可能值得研究一下。\n\n[点击此链接获取 Notepad++](https://notepad-plus-plus.org/download/v6.9.html)\n\
  \n最棒的部分是这个代码编辑器不仅可以高亮 `C++`，还可以高亮许多其他语言。Linux 也使用一种名为 `gedit` 的混合文本和代码编辑器，这是 Notepad++\
  \ 的另一个酷点。有趣的是，我们基本上是在试图让 Windows 变得更像 Linux，这样我们就可以编程了，对吧？\n\n# 第三章：设置工作空间：文件结构是关键\n\
  \n最后的设置步骤在这里。有些人会说这一步是可选的；然而，请考虑这个简单的场景：假设有一个非常大的项目由你负责协助开发。还有其他程序员和你在一起。他们每个人都有自己做事的方式，这在早期就可能导致一些问题。其中一人请求你帮助他处理他的那部分代码。他试图快速解释，但当你试图进入一个又一个软件文件夹时，你已经迷失了方向。可能这里有一个界面，那里有一个感悟，在远处的另一个文件夹里还有一些工具。看到问题了吗？\n\
  \n现在，这个简单的例子似乎违背了需要严格目录结构的初衷，但在倒数第二章中，将让你向程序中添加几段代码，以验证易理解的目录结构的必要性。我们要做的最多操作涉及\
  \ 2 个文件夹。\n\n对于主示例，我们需要创建一个名为 `tutorials` 的文件夹。如果你已经知道如何执行此，请继续阅读第 4 章。否则，这里是使用\
  \ Windows 创建新文件夹的逐步说明，尽管大多数其他操作系统也会遵循相似的格式。\n\n第一步是进入桌面（Desktop）。这是你所有图标所在的地方。底部是任务栏，上面有开始按钮和右下角的时钟。将光标置于桌面上并右击。你应该能看到与右侧图片类似的界面。\n\
  \n选择此项后，我们要做的下一步是重命名文件夹，以便以后更容易找到。要做到这一点，你只需要右击文件夹并点击“重命名”（rename）。你可能需要先左击文件夹，以确保在右击之前文件夹已被选中。下面的图片将显示右键菜单可能的样子。\n\
  \n![1new_folder](img/00007.jpeg)\n\n尽管这看起来很简单，但还有其他方法仅通过命令行操作来创建文件夹。在没有图形用户界面（`GUI`）的系统中（大多数操作系统都是如此），确保将文件和文件夹放在正确位置是至关重要的。代码可以写得多么完美都可以，但如果你或编译器找不到它，它就好像根本不存在一样。\n\
  \n关于文件结构的最后一个注释是，创建它是一回事，而在整个开发过程中坚持遵守它是大多数程序员面临的问题。这意味着在任何时候都始终知道什么在什么位置。如果你能向一个对系统几乎或完全不了解的人解释你的代码结构，并且他们可以找到目录中的任何文件夹或（更好的话是）文件，那么我们就做对了。\n\
  \n![3rename_folder](img/00008.jpeg)\n\n# 第四章：编程时间：向世界致敬\n\n吸气，呼气。现在我们可以编程了。我们首先要做的是将命令提示符进入正确的工作目录，也就是我们放置\
  \ `tutorial` 文件夹的地方。让我们开始吧。\n\n点击底部任务栏上的开始按钮。在底部搜索框中输入 `cmd`，或点击右侧的“运行...”（Run…）选项。获取运行提示的另一种方法是按住\
  \ Windows 键然后按 `r` 键。你应该看到以下屏幕。\n\n![ ![running_cmd](img/00009.jpeg)`cd` 命令将你的目录更改到命令后单词指定的目录。点击地址栏，然后按\
  \ `Ctrl` + `C` 复制其中的地址。然后右击命令提示符并粘贴代码。接下来的两张图片将显示所有操作。\n\n```\ncd tutorial\ntouch\
  \ hello.cpp\npwd\n```\n```\n\n \n```\n```\n\n![find_working_directory](img/00010.jpeg)\n\
  ![goto_working_directory](img/00011.jpeg)\n![create_the_program_file](img/00012.jpeg)\n\
  \n这里我们终于可以开始编码了。你成功创建了一个 `C++` 源文件，尽管它现在可能还不完整。要打开它，你可以采用几种方法。最明显的方法是双击它；但是，你可能有其他应用程序可能会干扰并在其他程序中打开文件。为了避免这种情况，右击新创建的文件并选择“打开方式”（Open\
  \ with）选项，点击“选择默认程序...”（Choose default program…）选项。然后找到 Notepad++ 的安装位置。通常，在 32\
  \ 位系统上它应该在 `C:\\Program Files (x86)\\Notepad++`，而在 64 位系统上在相同的位置但没有 `(x86)`。\n\n\
  ![the_program](img/00013.jpeg)\n\n给出的代码解释如下。前四行是预处理器命令。本质上，我们可以将这些视为库引用，以便借用绿色注释行提到的那些常用函数。这在大多数\
  \ `C/C++` 程序中非常常见，并且只是预处理器可以做的一小部分，我们稍后会提到。\n\n下一行是函数头文件。在大多数现代语言中，编译器会尝试寻找名为 `main`\
  \ 的函数，并将其作为第一个运行的函数。这并不意味着我们必须把所有代码放在那里；事实上，这是一种坏习惯，稍后当我们有多个函数时就会看到这一点。在目前这种情况的情况下，我们定义了一个典型的\
  \ `main` 函数，它返回一个整数数据类型（缩写为 `int`），它将输出我们指定的数字。同样注意，括号内没有任何输入（或参数）。大括号开始函数的定义。\n\
  \n\n\n\n至于程序体，我们有两个部分需要介绍。第一部分是 `printf` 函数，它接受一种名为 `string` 的数据类型，以及可选的、各种数据类型的可变大小列表，用于将其放入主字符串中。将其分解来看，`string`\
  \ 只是字符的集合。`C++` 中的字符完全通过美国标准信息交换码（ASCII）表来表示，该表可以通过简单的 Google 搜索获得。从本质上说，两个引号之间出现的任何内容都可以是一个\
  \ `string`，除了使用反斜杠进行特殊格式化外。该函数将按照出现的形式原样将字符串打印到屏幕上。\n\n`printf` 函数的最后一个实例包含了前面提到的一些有趣格式化。`\"\
  %c\"` 模式告诉函数我们想在该空间放置一个字符，该字符的值从列表中的第一个变量中获取，该变量是函数的可选第二个参数。我们想要放入字符串的字符是 `'\\n'`。这个字符是换行符，它将强制随后的字符串显示在屏幕的下一行。我们基本上只是在告诉函数在这种情况下将\
  \ `\"%c\"` 替换为 `'\\n'`。同样，在更复杂的系统中，这将非常有用，特别是对于你尝试附加到主字符串中的字符串的实际格式化。\n\n主函数体的最后部分，我们将介绍\
  \ `C++` 如何与 C 语言不同地处理标准输入输出。在这种情况下，我们看到令牌 `std::cout` 和 `std::endl` 中使用了 `std` 命名空间。命名空间只是收集相关数据部分的方法，以便以最小的开销轻松访问它们。这里使用的特定变量分别指代标准输出流和结束行字符串。\n\
  \n有趣的部分是 `\"<<\"` 部分。它告诉程序本质上将它从任何种的函数、字面量或属于 `string` 数据类型的变量接收到的数据推出去。将其想象为将所有信息通过流推向\
  \ `cout`。\n\n结束的右大括号将结束函数定义并完成我们的第一个程序。在代码的最后一行之后添加一个新行是一个好主意。这不仅有助于人类的可读性，而且过去的编译器会寻找新行来确定何时结束对代码结尾的解析。似乎是过去的遗迹。接下来我们将介绍编译，以确保代码实际上可以运行。\n\
  \n# 第 5 章：编译时间：获取可执行文件\n\n同样，编译深入涉及软件的一个特定领域，值得它所受的关注。如果没有编译器，高阶语言就无法真正存在，因为它们需要一种被翻译成机器可理解代码的方法。现在，让我们专注于将我们的程序更改为可执行文件从根本上需要理解的内容。希望你没有关闭命令提示符，因为我们即将回到那里。请确保命令提示符处于正确的工作目录。实现此点的一种简单方法是运行\
  \ `dir` 或 `ls` 命令，它们分别在 Windows 或 Linux 上向屏幕打印你当前工作目录中的文件。目前，你应该看到的唯一文件是 `\"hello.cpp\"\
  `。\n\n实际的编译命令随机器而异。通常通的形式是 `g++`，偶尔后面会直接跟一个 `\"-\"\"`。这种差异发生的原因可能是使用了冲突的编译器版本。这最可能是由于同一台机器上安装了各种\
  \ IDE。另一个有用的点是 `-o` 标志，它后面需要接一些文本，这将是命名的可执行文件的名称。Windows 中编译器使用的默认名称为 `\"a.exe\"\
  `。\n\n如果你到目前为止遵循了教程，那么在编译器运行并创建可执行文件之后，不应该有额外的文本打印出来。如果尝试编译的代码有问题，可能会有一些异常抽象的错误信息，试图告诉你代码哪里出了问题。它提供的最有用的信息是行号和它们出现的文件。它们出现在错误所在行的最前面的部分，通常遵循以下模式：`\"\
  <filename> : <line number> : <column number>.\"`。\n\n这是它应该看起来的图片。关于版本差异的点在这里也有显示，因为这里使用的笔记本电脑需要所示的版本。我在成功编译后立即运行了程序。被绿色圆圈圈的部分是实际输出。\n\
  \n![program_output](img/00014.jpeg)\n\n编译器理解我们何时需要去另一个文件获取某些函数定义，这样我们只需要向编译器传递那一个文件的名称。既然我们已经获得了程序运行的绿灯，让我们继续下去吧，并顺便多加一点内容。\n\
  \n# 第 6 章：变得复杂：变量与函数\n\n接下来的几个概念作为一组奖励课程包含在内，以促进学习。基本上，接下来的几个重要步骤是使用变量和调用一些函数。这些是开始编程时的基础内容。\n\
  \n让我们先处理变量。这样我们现在可以将所有内容保留在 `main` 内部。目前代码的一个明显问题是 `\"Hello World\"` 和 `\"Program\
  \ Output\"` 字符串频繁出现。让我们这两个字符串放入一些较小的可重用变量中。我们称它们 `hello` 和 `prog_out`。\n\n让我花点时间谈谈变量命名。如果你有三个代表三维坐标系的变量，它们可以是\
  \ `x`、`y` 和 `z`，这在这种情况下可能是可以的；然而，可能涉及多个系统，例如图形引擎中的模型、摄像和世界坐标系统，它们需要各自的变量。这里的问题是你如何命名每组变量。一种方法是用每个系统的第一个字母对其进行标记，例如用于模型系统的\
  \ `x_m`。这种方法的问题是，如果你在长时间没有处理这些代码后回来，你可能会忘记 `\"m\"` 代表什么，因为它可能代表模型或主视图。命名这种变量最好（有时也是最长）的方法是将整个单词放在后面，例如\
  \ `x_model`。这会让操作变得非常容易。\n\n现在我们已经过了关于命名的部分，就可以让变量为当前代码工作了。下面的图片在某种程度上总结了情况，但如果你需要文字说明，我也在对其进行了解释。\n\
  \n![pic1](img/00015.jpeg)\n\n顶部明显注意到的是额外的 `include` 语句。它将 `string` 数据类型引入我们的程序，以便在函数中使用。下一步是函数定义之外的\
  \ `using namespace` 部分。这类似于使用变量名来缩短代码，因为现在我声明正在使用 `std` 命名空间，所有与其相关的变量都自动带入了我们的程序中。\n\
  \n\n\n\n指针是 C/C++ 中的一个核心概念，它实际上在我们现在的代码中也经常出现。出现在函数调用中变量前的 `&` 符号基本上是告诉函数不要使用变量本身，而是使用该变量所引的值。下面的图片应该能消除大多数初学者在最初理解时产生的某些困惑。\n\
  \n![ref](img/00016.gif)\n\n核心点在于，如果你有一个指向任何特定数据类型的指针变量，那么你可以使用前面的星号 `*` 将该指针转换为一个值，或者使用前面的取地址符\
  \ `&` 获取变量的地址并将其传递给其他函数等。这只是对指针的一个非常简化的介绍，仅供你了解。\n\n现在，让我们回到代码。我们在函数中提到的变量前面应该有\
  \ `&` 符号，因为它们需要的是字符串的指针而不是值。这使得函数能够传递正确的字符串，并打印出与上次相同的输出。\n\n我们要在当前程序中添加的下一个内容是编写多个函数的想法。这对于我们简单的示例来说可能不是必须的，所以让我们添加一些简单的计算来展示函数的威力。这个想法是将两个数字相加并返回它们的和。作为一个挑战，尝试添加一个\
  \ `if` 语句来检查值是否为负，如果是则返回零。解决方案将出现在结论中。\n\n至于我们要添加的函数，让我们取出程序的中间部分，并将其替换为想要添加的函数。为了方便起见，我们将其命名为\
  \ `calc_sum` 以保持简单。\n\n下面的图片显示了添加它的其中方法。其想法是，我们在添加新功能时，希望尽可能保留旧程序的内容。我们就说程序员喜欢节省时间。不同之处在于，我们是否希望函数负责将其输出打印到屏幕上。在一种情况下，这也影响了它的返回值是\
  \ `void` 还是 `int`。截图之后提供了代码的简要概述。\n\n![last](img/00017.jpeg)\n\n注意，在 `main` 函数之前又有一行单行代码。这一行被称为函数声明（原型），它告诉编译器我们稍将在程序的后面定义一个我们想要使用的函数。在这种情况下，它被称为\
  \ `calc_sum`，并接受两个整数值作为参数。\n\n定义本身非常简单，我们只需要返回两个整数相加的结果。它读起来和我们在数学中的做法类似，只不过我们现在将结果返回给调用者。为了让这更简单，可以直接返回两个值相加的操作，本质上就是完全删除了\
  \ `result` 变量。关于直接返回是否是一个好主意可能会发生一些有趣的争论，但这意味着它也是一个很好的学习机会。\n\n我们可以简单地将函数放入标准输出流，这一事实对我来说非常棒。在\
  \ C++ 中，整数到字符串数据类型的转换是隐式的，这可能也挺不错。\n\n## 结论\n\n我们成功地制作了一个运行的程序。不仅如此，我们还深入学习了 C++\
  \ 内部的一些入门概念，这将帮助你开启编程知识。学习编程最棒的部分是，任何切入点都能帮助增加你进入整个领域的动力。\n\n在产生动力冲动之前，让我们后退一步，意识到我们甚至还没有谈及虚函数、友元类（friend\
  \ classes）以及许多其他酷炫的概念。编程绝对是我个人的兴趣爱好。有趣的是，我正试图将其作为职业。我能提供的最好的解释是：作为爱好，随手写出一些程序是一件很棒的事，但涉及到将其作为职业时，它完全是另一回事。可用信息量不断扩大，因此软件行业的人必须不断学习。\n\
  \n对于之前提到的 `if` 语句的解决方案，下一页的图片应该对其进行了整体总结。当然，还有许多其他方法，例如使用 `switch` 语句或三元运算符，这些也可以同样容易地实现。再次，这都是主观的。解释是编写软件的一件大事，尽管编译器会告诉你什么是对什么是错。\n\
  \n再次，需要注意的一些重要因素是 `result` 变量被用来检查结果。如果我们想使用直接返回的方法，那么条件检查就会变得不那么有趣，而是稍微困难一点。编程始终是一个可以塑塑的工具。\n\
  \n![last4real](img/00018.jpeg)\n\n作为之前提到的 `if` 语句的解决方案，下一页的图片应该对其进行了整体总结。当然，还有许多其他方法，例如使用\
  \ `switch` 语句或三元运算符，这些也可以同样容易地实现。再次，这都是主观的。解释是编写软件的一件大事，尽管编译器会告诉你什么是对什么是错。\n\n再次，需要注意的一些重要因素是\
  \ `result` 变量被用来检查结果。如果我们想使用直接返回的方法，那么条件检查就会变得不那么有趣，而是稍微困难一点。编程始终是一个可以塑塑的工具。\n\n\
  作为最后的几句话，我可以提供一些参考，供你可能想要继续你的软件之旅。最具影响力的书籍之一是唐纳德·克努斯的《算法导》（The Art of Programming）。如果你在大学上过课程，教授很可能会在课程的某处提到这本书或这位作者。这本书和其他书籍提到的软件关键部分包括算法、建模、流程以及许多其他必要的行动，这些行动在本质上并不一定涉及编码。\n\
  \n提到建模，有一个有趣的观点：有些人甚至在写下第一行代码之前，就会根据先前的分析字面上连续讨论几个小时系统应该是什么样的。当他们听到这类事情时，可能会大喊官僚主义的邪恶，但事实是，设计软件是减少编码本身风险的关键。\n\
  \n即使是算法设计也参与了软件。充分发现解决问题的正确算法所需的数学和分析思维，只能被比作艺术家的才华和他们作品之美，而且后者再次是相当主观的。这稍稍延伸到了计算机科学的姊妹领域，但它仍然影响着软件，更高效的算法就在转角等待被发现。\n\
  \n我提到的最后一点是，软件拥有它可以经历的特殊流程。这涉及到一些管理原则，但也主要影响大型团队，而这也是这些原则的充分条件。简单来说，理解流程最容易的方法就是思考你个人是如何编码的。好了，这可能是你的第一次，但我很有信心你跟着这个教程一起写了代码。你可能直接跳到了底部获取最后一段代码，看看你将学习什么。无论哪种，这至少展示了你编程的方式。下一个问题是：你未来将如何编程？\n\
  \n答案就在代码中……\n\n感谢阅读。希望你喜欢。我请求你留下诚实的反馈。\n\n"
