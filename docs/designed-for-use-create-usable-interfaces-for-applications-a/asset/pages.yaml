- pgno: 109
  md: 'Finally, you should print each task on its own piece of paper. Since you don’t
    know how many tasks a user will get through, using individual pieces of paper
    for each task allows you to hand out tasks as you go along or switch the order
    of the tasks on the fly if you need to do so.


    At this point, you should run through each task. Make sure that the individual
    goals are feasible and that you’ve included every screen and pop-up element you’re
    likely to need.


    # Paper Prototype Creation Checklist


    +   - Prepare all the screens people are likely to progress through while doing
    your tasks. Don’t make them too crude.

    +   - Add the surrounding user interface elements (such as browser windows around
    sketches of a website) where necessary.

    +   - Create the pop-up elements you might need.

    +   - Prepare some way for people to draw on top of your prototype.

    +   - Print out the tasks on individual pieces of paper.

    +   - Do a test run of each task, and make sure you’ve prepared all of the screens
    and pop-up elements you’re likely to need.


    # Preparing for the Test


    To run a usability test with your paper prototype, you need at least one additional
    person: the person who is going to do the tasks. This person is sometimes called
    the test subject, but since you’re not testing this person, I usually call her
    the tester. She’s the one who is testing your design, after all.


    I won’t go into great depth on how to recruit testers in this book. There are
    many good resources on the topic,¹ but generally, pretty much anyone outside of
    your company will do. It’s best to avoid recruiting testers from within your company.
    They are too familiar with your product and your company’s jargon; this familiarity
    may mask usability problems with your product. It sometimes makes sense to recruit
    testers from your product’s target audience, but generally, it doesn’t matter
    too much. Almost anybody will do, including friends and family.


    How many tests should you run with any version of the paper prototype? Paper prototypes
    take a bit of time to create, so it makes sense to test each prototype with more
    than just one person. Additionally, with a paper prototype, it’s easily possible
    to make small adjustments


    1. This Nielsen Norman report does a great job: http://www.nngroup.com/reports/tips/recruiting/.'
