- pgno: 108
  md: 'that people can find in the user interface, you are essentially giving them
    a hint about how to perform the task.


    It’s a good idea to prepare at least five or six tasks; more is better. Each task
    should take between two and ten minutes. It’s likely that you won’t make it through
    all of the tasks, but it’s hard to tell before doing the actual test, so it’s
    better to be prepared if people blow through your tasks quickly.


    # Creating the Paper Prototype


    Based on the tasks you’ve come up with, it’s pretty easy to tell which screens
    you will need to show to people (but be liberal when deciding which screens to
    include in your prototype; people may not always take the most obvious steps toward
    the goals you’ve set).


    You can use existing sketches for paper prototypes, if they’re not too crude and
    simple. Using very simple sketches can cause problems if they are not easily readable
    by people who are not already familiar with your product.


    To turn a sketch or mock-up into something suitable for a usability test, you
    need to add the user interface elements surrounding your own user interface. For
    example, if you’re testing a website, add relevant parts of the browser user interface
    to the prototype (forward and back buttons, the address bar, the title bar, and
    so on). Similarly, if you’re testing an application, you should add the menu bar
    and maybe even parts of the desktop if it is an application running on a desktop
    operating system.


    After you’ve created the screens, you should think about state changes on individual
    screens.


    What happens if somebody clicks a drop-down menu? You should prepare any pop-up
    windows in advance. Some people like to use Post-it notes for them, which makes
    it easy to stick them to the paper prototype once the user activates them.


    What happens if the user has to type data into a field? There are several ways
    of handling this. If you are not going to reuse the paper prototype, you can simply
    give people a pencil and an eraser and let them change the data on the screen
    using these tools. If you are going to reuse the prototype (say, you’re doing
    more than one test), you could use transparencies. Put them over your prototype,
    and let people draw on the transparency.'
