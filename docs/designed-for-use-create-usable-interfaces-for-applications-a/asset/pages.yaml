  md: 'achieve great results. It’s the same concept found in games: take a challenge
    that seems hard and allow people to master it.


    But that’s not all we can learn from games.


    # 26.3 What We Can Learn from Games


    Game designers have decades of experience in making things that are fun. If we
    keep in mind how games are different from our own products, user interface designers
    can learn a lot from how games are designed.


    # Progress


    In his paper “Heuristics for Designing Enjoyable User Interfaces: Lessons from
    Computer Games,”⁴ Thomas W. Malone notes:


    > For both toys and tools, however, users need some kind of performance feedback
    to know how well they are achieving their goals. In games, this performance feedback
    is provided by things like the missing bricks in Breakout and the position of
    the incorrect arrows on the number line in Darts. There may be similar ways to
    incorporate performance feedback for the external task into tools. For example,
    the Writer’s Workbench developed at Bell Laboratories measures various stylistic
    features of manuscripts such as word length, sentence length, percentage of sentences
    using passive voice, and so forth. These rudimentary kinds of performance feedback
    for the external goal of producing a readable manuscript may enhance the challenge
    of using the tool.


    In other words, measuring progress and providing feedback about that progress
    makes an activity more fun.


    Video games like Capcom’s Ghosts ’n Goblins provide an overview map. After every
    world the player masters, the game’s knight progresses a bit further. This shows
    the player’s task, and it also gives constant feedback on her progress. EpicWin⁵
    is an iPhone tasklist app that uses the same metaphor to show the user’s progress
    at ticking items off the tasklist.


    4. Find it at http://portal.acm.org/citation.cfm?id=801756.

    5. Get the app at http://www.rexbox.co.uk/epicwin.'
