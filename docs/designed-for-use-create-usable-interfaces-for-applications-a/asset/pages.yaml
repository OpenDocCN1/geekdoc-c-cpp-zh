    # Chapter 2


    # Job Shadowing and Contextual Interviews


    +   - Research

    +   - Design

    +   - Implementation


    # What Are the Techniques?


    Job shadowing and contextual interviews are two techniques used to find out what
    people actually do, where they need help, and how your product can help them.
    To do that, you will be accompanying people while they do their jobs and talking
    to them about their jobs.


    Use these techniques if your application or website is targeted at a specific
    audience and if you have the ability to interact with people from your audience.
    For example, if you''re creating a product for photographers, read this chapter.
    If you''re creating a product that will be used by employees of a company and
    you can talk to employees of the company, read this chapter. If, on the other
    hand, the audience of your product is not well-defined or you don''t have access
    to your audience, don''t feel bad about skipping this chapter.


    # Why Is This a Good Idea?


    Your users are different from you. Getting to know them and getting to know their
    problems will help you understand how to create a product that is truly usable
    to them.'
