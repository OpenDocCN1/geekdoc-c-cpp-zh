  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_119_0.png)


    # Chapter 12


    # Realism


    Pick up any reasonably modern device—say, a tablet or a smartphone—and you''ll
    quickly notice that a lot of work has gone into making the user interface appear
    realistic.


    You see shadows, gradients, 3D effects, and textures. On-screen elements and whole
    applications are based on real objects. Even the user interactions themselves
    are patterned after the real world: you can touch and move sliders, you can toggle
    switches, and if you give a scrollable area a push, it keeps scrolling for a bit,
    steadily slowing down as if there were actual friction. The book application on
    your tablet device resembles an actual book, and the calendar application''s user
    interface looks like an actual paper calendar.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_119_1.png)


    THE PALM PRE USES SHADOWS, TEXTURES, AND TRANSPARENCY


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_119_2.png)


    APPLE USES A PHYSICAL CALENDAR AS A MODEL FOR ITS CALENDAR APP ON THE IPAD, INCLUDING
    PARTIALLY RIPPED OFF PAPER


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_119_3.png)


    MICROSOFT USES SHADOWS, TEXTURES, AND TRANSPARENCY IN WINDOWS 7. THEY EVEN USE
    3D ANIMATIONS FOR CERTAIN FEATURES OF THE OS


    Unlike objects in the real world, applications and websites are not bound by the
    laws of nature; they can do anything. After all, they are just a bunch of glowing
    dots on a screen. If someone picks up a rock and lets it drop, she knows what''s
    going to happen. But if she touches a pixel on a touch screen, there is no telling
    what kind of behavior the'
