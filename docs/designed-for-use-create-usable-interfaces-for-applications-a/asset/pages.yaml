- pgno: 160
  md: 'target audience. If the target audience is experienced with the subject matter,
    it may be OK to make the feature a bit less discoverable and trust the user''s
    ability to find it.


    In 37signals’ and Apple’s case, the designers probably assumed that the features
    aimed at existing customers can be a bit less obvious, since these people already
    know where to find them. Potential new customers have less experience with the
    site, so features aimed at them are given more weight.


    Then, there are cases where you can make features less discoverable because they’re
    not strictly essential and because people are likely to find out about them in
    some other way. For example, “pinching” an image on an iPhone to zoom in or out
    is not easily discoverable, but you don’t need to know about this feature to use
    an iPhone. Plus, the feature is so compelling that people who know about it tell
    people who don’t, creating an avenue for discovering the feature that is external
    to the application itself. The “pinch-to-zoom” feature is so simple that people
    easily remember it once they’ve seen it, and it works consistently in many different
    apps. So, once people have learned to use it, they’re unlikely to forget that
    it exists.


    To recap, you can make a commonly used feature less discoverable if


    +   - People can get along just fine without knowing that the feature exists.

    +   - They’re likely to find out about the feature even if it’s not directly discoverable.

    +   - The feature is compelling, simple, and used consistently so people will
    remember it once they’ve learned it exists.


    # 17.2 When to Make Things Discoverable


    Not every feature of your product is relevant at all times. So after you’ve decided
    which features should be discoverable, you should decide when they need to be
    discoverable.


    One way to do this is to use contextual or modal user interfaces. Let’s see how
    this could work for a vector graphics editor. Your users probably want to be able
    to rotate objects, so you need to add a “Rotation” property to your toolbar or
    inspector window:'
