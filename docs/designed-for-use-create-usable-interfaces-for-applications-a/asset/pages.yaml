- pgno: 177
  md: 'One way of making modes obvious is to provide visual feedback indicating that
    a mode is active. In a paper called “The Prevention of Mode Errors Through Sensory
    Feedback,”¹ user interface designer Bill Buxton describes the results of experiments,
    noting, “there were significantly fewer mode errors in conditions with visual
    feedback than those without for both novices and experts.” When testing visual
    and kinesthetic feedback (the latter being based on perception of the motion of
    one’s own body—for example, the vibration you feel when your phone’s silent alert
    goes off), he further observes:


    > The benefits of visual and kinesthetic feedback were found regardless of whether
    or not subjects were experienced users. (...) Thus, even though many of the expert
    subjects commented that they were used to keeping track of the mode “in their
    head,” feedback of both kinds significantly reduced their mode errors nonetheless.


    If static visual feedback doesn’t work, an animation might just do the trick;
    animations are much harder to ignore than static visuals, as discussed in Chapter
    15, Animations, on page 145.


    However, visual feedback is not the best possible solution. Buxton’s research
    shows that kinesthetic feedback works even better. You’re probably wondering how
    to give kinesthetic feedback without adding special hardware to your users’ computers.
    You could use keys on users’ keyboards as mode activators; for example, dragging
    a file in the Mac OS X Finder moves the file, but by holding down the Alt key,
    Mac OS X switches to a “copy” mode. Since the user has to touch and press the
    Alt key to stay in this mode, this is a kind of kinesthetic, tactile feedback
    constantly telling the user that he’s still in the copy mode. Such temporary,
    constantly activated modes are called quasimodes. I’ll get back to them at the
    end of this chapter.


    In his essay “Visual Feedback and How Modes Kill,”² Aza Raskin points out another
    option:


    > Visual indication is one method for trying to bring your attention to the system
    state, but as Buxton showed it has a decent chance of failure. Using sound-based
    feedback is more likely to succeed, because while you can avoid looking


    1. Read it at http://www.billbuxton.com/ModeErrors.html.

    2. Read it at http://www.azarask.in/blog/post/is_visual_feedback_enough_why_modes_kill/.'
