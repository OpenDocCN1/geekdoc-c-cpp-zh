  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_166_0.png)


    # Figure 18.1: Don''t make me choose


    For example, after a user selects to play a movie, simply start from the last
    play position. It''s probably what he wanted, and if it isn''t, he will easily
    be able to jump back to the beginning of the movie. Similarly, if he taps a link,
    simply open the link. It''s probably what he wanted. Then, offer a way of adding
    open web pages to Instapaper.


    # 18.2 Front Load Decisions


    In some cases you have to ask the user to make a decision. For those instances,
    it''s a good idea to front load decisions as much as possible so the user can
    make them all at once and then be left alone. For example, it''s best to allow
    users to enter software-licensing information at the beginning of the installation
    process and not stop the installation in the middle to ask them for their licensing
    data.


    Here''s another example of an unnecessary interruption, this time from OpenOffice.org:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_166_1.png)'
