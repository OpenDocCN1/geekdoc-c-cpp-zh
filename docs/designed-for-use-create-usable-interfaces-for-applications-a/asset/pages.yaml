- pgno: 272
  md: '# 32.1 Don''t Blame Your Users in Your Error Messages


    We''ve all encountered an error message like this:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_272_0.png)


    The first thing people will read is, “You have typed the address incorrectly.”
    This error message blames the user for trying to access a URL that doesn’t lead
    to a page. But the user very likely didn’t do anything wrong. When people encounter
    “page can’t be found” errors, it’s more likely that they simply clicked a broken
    link, probably a broken link on the very website where the address leads to.


    Instead of blaming the user, we should start by apologizing for the problem. This
    is good usability, because it helps people calm down and deal with the issue.
    In The Man Who Lied to His Laptop [NY10], author Clifford Nass writes about an
    experiment with a computer that provides “emotional support” while the user plays
    a game. He concludes that “actively acknowledging and addressing people’s emotional
    states alleviated the high negativity and high excitement associated with frustration.
    In other words, people feel better when you show that you have heard them, understand
    their feelings, and sympathize.”


    Another problem with the error page shown earlier is that it uses a lot of jargon
    to explain what the problem is. Most people don’t know and don’t care what 404
    means or what a “URL” is.


    And finally, the error page isn’t helpful. It offers reasons for the problem but
    doesn’t offer any solutions. The site could determine where the user intended
    to go, based on the information available to the site. For example, links to blog
    posts often contain the year, month, and day that a blog post was written. Even
    if the last part of the URL got cut off'
