- pgno: 236
  md: 'Say you’ve come up with a new way of letting people send messages in your Twitter
    app. You’ve implemented it, and it works. But will people get it? Don’t guess.
    Instead, test.


    # 27.2 Preparing for the Test


    You should have your code running on a portable device. If your product relies
    on a service or is a service, prepare a guest login so people don’t have to supply
    their email addresses or other personal data. If your code relies on an Internet
    connection, make sure this works where you’re going. Check that your portable
    device’s battery is full (keep a spare if possible and necessary).


    You should also think about how to explain your product and come up with some
    simple tasks you want people to perform. Then, make sure your product is bug-free
    for these specific tasks; run through each task to see whether it works. Your
    aim is to find issues with the user interface, not bugs in your code.


    If you want to, you can install something like Silverback or Jing² on the computer
    to record the user’s actions.


    # 27.3 How Do You Find Testers?


    Simply visit a nearby café, look for people who don’t appear to be buried in the
    newspaper or a laptop, and ask them whether they are interested in participating
    in a short usability test.


    If you’re working in an office building, it’s often also possible to find people
    near the watercooler or people who are on a cigarette break. Unless you specifically
    want to find out how well a new feature works for existing users, you should try
    to avoid people who are overly familiar with your product, though.


    # 27.4 How Many Testers


    Since you don’t have to schedule testers in a guerilla-style usability test, you
    can test with as many people as you need to until you feel you have a solid answer
    to your question. Three to five people is usually


