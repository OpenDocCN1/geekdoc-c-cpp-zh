  md: 'shown in the previous chapter. Doing more extensive usability tests allows
    you to get better results.


    # Are There Any Prerequisites?


    Yes. You need to have running code, and at least part of your user interface needs
    to be in working order.


    You should also have read Chapter 11, *Paper Prototype Testing*, on page 104,
    since that chapter introduces concepts that are used in this and the following
    chapters and are not explained in detail again.


    # 28.1 Usability Tests Don’t Have to Be Expensive


    The basic goal of a usability test is to observe users while they use your product
    or a prototype of your product and to thus identify areas of your user interface
    that might be difficult for people to navigate.


    At the expensive end of the spectrum, this can mean hiring a usability expert,
    using a lab with two-way mirrors, planning the tests for weeks, running several
    tests with different testers, evaluating and discussing the results, and producing
    a report (possibly including videos) of all the problems and possible solutions.


    At the very low end of the spectrum, you can simply take your laptop to a café
    and ask people to do some simple tasks with your product.


    This chapter is about the middle ground: getting great results but still keeping
    your investment as low as possible.


    Usability expert Jakob Nielsen notes¹ that even poor usability testing yields
    *some* useful results.


    Better usability methodology does lead to better results, at least on average.
    But the very best performance was recorded for a team that only scored 56% on
    compliance with best-practice usability methodology. And even teams with a 20–30%
    methodology (i.e., people who ran lousy studies) still found 1/4 of the product’s
    serious usability problems.


    1. Read more at http://www.useit.com/alertbox/discount-usability.html.'
