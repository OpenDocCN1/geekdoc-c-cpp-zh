    # Chapter 7


    # Hierarchies in

    User Interface Design


    In thinking about how websites are organized, you’ll find that they often make
    use of hierarchies. Sometimes, these hierarchies are even used as explicit user
    interface elements. Here is an example of a “breadcrumbs” navigation element as
    it appears on sites like Google Directory:


    # Software


    Science > Biology > Bioinformatics > Software


    This navigation element tells people where in a hierarchy the current page is
    and allows them to “jump up the hierarchy.”


    The headers of many news sites also show a hierarchy of sorts but often use two
    or three levels of tabs instead of breadcrumbs:


    | U.S. | World | Europe | Technology | Business | Science | Opinion |

    | Africa | Asia | Middle East | Japan | | | |


    These two examples show how whole websites (or products in general) can be organized
    into hierarchical structures. But the individual screens themselves also use hierarchies
    to structure their content. Check out this screenshot from Google’s Chrome browser:'
