    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_159_3.png)


    37signals’ Basecamp home page puts the greatest emphasis on acquiring new customers;
    plans, pricing, and features take center stage. Less weight is given to things
    like support and the “Sign in” link.


    Apple puts its most recent product in the spotlight. Some room is given to a navigation
    bar that allows people to reach other products; very little room is given to other
    elements.


    Amazon puts a lot more weight on navigation, providing a lot of room for product
    categories and a search feature. Since Amazon sells so many different items, making
    navigation and search easily discoverable is the primary goal of the home page.


    You should start by looking for important features and make it a priority to make
    them discoverable. You should also think about a feature’s'
