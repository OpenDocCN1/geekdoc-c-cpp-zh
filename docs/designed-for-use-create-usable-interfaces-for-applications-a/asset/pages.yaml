- pgno: 14
  md: 'usable choices when designing your user interface. But people will still surprise
    you by finding creative ways of misunderstanding your application’s user interface,
    getting lost on your website, behaving in unpredictable, seemingly illogical ways,
    and being unable to do the very tasks that seem most obvious to you.


    Never assume you can apply a list of usability rules to a product and end up with
    something usable. Use common sense when designing user interfaces, but don’t rely
    on it. Know the rules, but break them if it improves your product. The point is
    not to do exactly what I tell you to do but instead to take my words as a source
    of inspiration—and to always test your designs.


    # How the Book Is Organized


    The chapters in this book are presented roughly in the order in which they are
    applicable during a typical design process, which I’ve divided into three stages:
    research, design, and implementation.


    # Research


    It’s tempting to jump right in and start designing a product as early as possible
    (or perhaps even to start writing code if you’re a programmer). In some cases,
    that may be OK, but it’s usually better to start by doing a bit of research. Who
    is your product for? What problems do you want to solve?


    # Design


    Think about how to solve your audience’s problems. Design solutions and then test
    them before writing any code. Fixing mistakes on paper is a lot easier than fixing
    them in code.


    From a design point of view, this stage is probably the most important in the
    development process and, consequently, represents the largest part of the book.


    # Implementation


    Create the product, but keep testing it. Were your earlier assumptions correct?
    Does your design work? How do people interact with it now that it’s running? Is
    your implementation good enough? How does your product deal with errors and real
    data? Does it perform well enough?


    Deciding where to put idea chapters was more of a gut call than an exact science.
    I’ve put these chapters where you’re likely to find them'
