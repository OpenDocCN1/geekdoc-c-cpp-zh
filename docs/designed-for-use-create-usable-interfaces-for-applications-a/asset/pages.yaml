- pgno: 41
  md: 'people understand your product, and they help you find potential problems with
    your product.


    After designing a feature, write a blog post telling your users why the feature
    is awesome and how they can use it to do cool stuff. You don''t have to publish
    it (yet). Just write it. Can you easily explain why people should care about the
    feature? Can you easily describe how simple the feature is?


    If the answer to one of these questions is "no," then maybe there''s some way
    you can change your design to make it more compelling, more useful, or more easily
    explainable.


    As a side note, you should probably save all of the design documents and mock-ups
    you create during the design process. They might make an awesome "this is how
    I came up with this design" blog post.


    # 5.3 Screencasts


    Screencasts are a great tool for introducing new products or new features of existing
    products. If you''re working on a design, think about how you would present it
    in a screencast. What hook could you use to get people interested in a feature?
    Is there a specific problem that you could show how to solve in a screencast?
    Can you explain the new feature in a linear narrative?


    If you have a prototype, go ahead and create a screencast explaining how it works.
    You don''t have to publish it; merely creating the screencast will probably alert
    you to issues with your design. (If you can''t come up with a problem to solve
    in the screencast, maybe the feature doesn''t need to exist at all.) What''s more,
    this is great practice for when your product is done and you''re creating screencasts
    for public consumption.


    # 5.4 Press Releases


    Press releases are another thing you can write during the design process. Can
    you explain your product in the space of a press release, making it sound exciting?


    If the press release doesn''t sound useful and exciting, there''s probably something
    wrong with your plan.'
