  md: '+   - Storyboards help you flesh out and communicate the interaction design
    of your product.

    +   - Simple sketches help you figure out *what* to put on individual screens.

    +   - Wireframes help you decide *where* to put things on individual screens.

    +   - Mock-ups help you iterate quickly on the visual design.


    # Further Reading


    Flow diagrams, storyboards, wireframes, and mock-ups are the four techniques I
    use most often. They allow me to start with a bird''s-eye view and progressively
    move down to the details. Other designers, however, prefer a different combination
    of techniques. *Undercover User Experience Design* [BB10] by Cennydd Bowles and
    James Box teach you these and other techniques.


    Bill Buxton''s *Sketching User Experiences* [Bux07] is another great book on this
    topic, and Robert Hoekman also covers some of these techniques in *Designing the
    Obvious* [Hoe06].


    Tyler Tate writes about different sketching and prototyping methods.¹³'
