  md: "> **Users**\n> \n> It was astronomer and author Cliff Stoll who famously asked,\
    \ “Why is it drug addicts and computer aficionados are both called users?” It’s\
    \ unfortunate that the term *user* is used in both contexts, but I don’t have\
    \ a good alternative to the word. So, it is with considerable chagrin that I admit\
    \ defeat and begrudgingly continue to use the word in this book.\n> \n> Whenever\
    \ possible, I try to use a better term, though. *Human* and *person* and *customer*\
    \ are each often perfectly serviceable replacements for *user*.\n\n# Are There\
    \ Any Prerequisites?\n\nYou should have an idea of who your target audience is\
    \ and be able to easily access the people who make up your target audience.\n\n\
    # 2.1  Observing Your Audience\n\nIn the previous chapter, we established that\
    \ most people are not product designers. They are hard-pressed to explain what\
    \ kind of product they need to help them achieve their goals, and they are often\
    \ unable to correctly evaluate their own feelings about a product.\n\nAs a result,\
    \ we can’t just ask people what they want. Instead, we need to figure it out on\
    \ our own. *Job shadowing* and *contextual interviews* are two techniques we can\
    \ use to do just that.\n\n# 2.2  Job Shadowing\n\nSince people don’t know what\
    \ they want, a good approach is to simply observe what they do. The idea of shadowing\
    \ is to visit users in our target audience at the place where they will use our\
    \ product. The goal is to find out how our product will help them achieve their\
    \ goals. This is a bit like doing a usability test, but instead of inviting people\
    \ to test and telling them what to do, we visit them and observe what they do.\n\
    \nWith usability testing, the goal is to find issues with the user interface.\
    \ When you are shadowing somebody, the goal is to figure out what kind of product\
    \ to create or how to change your product on a more fundamental level."
