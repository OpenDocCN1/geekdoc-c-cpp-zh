    # Chapter 16


    # Consistency


    Consistency is a pretty popular word in the area of user interface criticism;
    when we dislike user interfaces, we often attribute our dislike to a “lack of
    consistency.”


    But what is consistency?


    Merriam-Webster says that consistency is the “agreement or harmony of parts or
    features to one another or a whole.” Simply put, when we say that a user interface
    isn’t consistent, we mean that it isn’t in agreement with its host system or with
    popular applications on its host system or that different features in a product
    don’t agree with each other. We mean that it is different from other products
    we already know or that different parts of a product work differently.


    # 16.1 Identifying Archetypes


    But what kinds of differences are we talking about?


    Quite often, we are talking about appearance. Things don’t look quite right. Buttons
    in an application don’t look quite like the host system’s default buttons. Windows
    look a bit different from each other. Scroll bars look slightly strange.


    Visual inconsistencies are very obvious, so people notice them easily. However,
    this focus on how things look is misguided. Often, when it comes to usability,
    appearance doesn’t matter all that much. Humans are not stupid. You don’t need
    to make elements look exactly the same in order for them to be immediately identifiable.
    For example, even though they look quite different, all of these buttons are clearly
    identifiable as buttons:'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_155_0.png)


    (I''ve written more about how much detail a user interface element needs to be
    easily identifiable in Chapter 12, Realism, on page 120.)


    Elements of the same type don''t need to look exactly the same. They just need
    to be immediately recognizable for what they are.


    You can easily evaluate whether visual consistency is an issue with a simple usability
    test: just show people pictures of your user interface elements (preferably in
    the context of your whole user interface) and ask them what they are. If users
    have no problem identifying items for what they are, you don''t have to worry
    about visual consistency.


    Or, as Ralph Waldo Emerson put it:


    > A foolish consistency is the hobgoblin of little minds, adored by little statesmen
    and philosophers and divines. With consistency a great soul has simply nothing
    to do.


    So, let''s ditch the foolish consistencies and move on to the areas where consistency
    actually matters.


    # 16.2 Behavioral Consistency


    Being good at recognizing user interface elements for what they are can cause
    a bit of a problem for people: they tend to apply their existing mental models
    liberally. The more a user interface element looks like something users already
    know, the more they will expect it to work like the thing they already know.


    ALL OF THESE LOOK LIKE SCROLL BARS, BUT...


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_155_1.png)'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'This problem often arises with custom versions of common user interface elements,
    which you may sometimes need to create. Because people will apply their existing
    mental models to your custom elements, you need to ensure that these elements
    behave *exactly* like the commonly used elements. If you violate their expectations,
    you will make them confused, frustrated, and maybe even angry.¹


    For example, the windows in Adobe Photoshop running on a Mac look almost exactly
    like *real* Mac windows, but they are not.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_156_0.png)


    Adobe implemented its own custom windows. Unfortunately, in doing so, Adobe got
    some behavior wrong. For example, when a user clicks the little close button on
    a regular Mac window, the button gets a little bit darker to indicate to the user
    that he has hit the button. This doesn’t happen with Adobe’s buttons. It’s just
    a small difference, a little detail Adobe didn’t get right, but it causes a tiny
    bit of confusion every time the user notices it and wonders for a fraction of
    a second just what exactly has gone wrong.


    If you *don’t* want your custom versions to behave like a regular user interface
    element, they need to look *very* different from the regular one—so different,
    in fact, that your users won’t identify your element as a member of the regular
    type of element and thus won’t apply their mental model of the element to your
    custom, inconsistent version of it. This is pretty hard to achieve. Scroll bars,
    windows, buttons, and menus, for example, always kind of look like scroll bars,
    windows, buttons, and menus. It’s almost impossible to make your custom scroll
    bar


    1. If you *do* decide to reimplement existing user interface elements, don’t forget
    to also take care of their accessibility features. These may not always be obvious
    to you, but forgetting them means that people with certain disabilities may not
    be able to use your custom user interface element.'
