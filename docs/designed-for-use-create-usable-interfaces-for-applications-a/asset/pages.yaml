- pgno: 162
  md: '# Color


    Recently, there’s been a bit of a trend toward using less color in user interfaces.
    Apple’s iTunes, for example, has replaced its colored icons with monochrome ones.


    From a usability perspective, using color is beneficial. Colors make things easier
    to perceive. Our brains are really good at doing tasks such as “find the green
    icon on this screen.” In Information Visualization (War04), Colin Ware notes that
    color is “preattentively processed,” meaning that we identify color before we
    give it conscious attention. In other words, when we look at a user interface,
    we can find and identify user interface elements with a specific color really
    quickly and easily.


    Do use color (for example, to make it easier to differentiate between icons),
    but don’t rely solely on color. Not everybody can see color perfectly.


    them more discoverable.¹ Certain colors (most notably red) make things appear
    more important. Conversely, you can use these properties to de-emphasize things
    you consider to be less important but still need to put somewhere visible.²


    # User Expectations


    Once people have used your product for a while, they will get a feel for where
    the important parts are. Be consistent. Use the same kind of arrangement for every
    screen. Don’t put the important things on the left of the screen in one layout
    and on the right in the next.


    Similarly, if the user has an established mental model of how your product works,
    she probably has pretty strong opinions on where things should be. Often you can
    use this expectation to make things more (or less) discoverable. (For more on
    this topic, read Chapter 9, The Mental Model, on page 77.)


    1. Jakob Nielsen calls this the “F-Pattern” because in eye-tracking studies, the
    heat maps created by measuring what people actually focus on when reading websites
    looks like a giant F superimposed over the user’s screen. You can see examples
    at http://www.useit.com/eyetracking.


    2. Neutral colors are also used for user interfaces in content creation applications.
    We don’t want a colorful user interface to influence how people perceive their
    pictures in, say, a photo-editing tool.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Search


    When people can’t discover things immediately, they may turn to your product’s
    search feature, provided they can find it. To help your users with search, you
    need to do these three things:


    +   - Provide a search feature.

    +   - Make the search feature itself discoverable.

    +   - Make sure the search feature returns useful results.


    The last point is often the hardest. Fortunately, you may be able to draw from
    the card sorts you did way back in Chapter 7, *Hierarchies in User Interface Design*,
    on page 58. This help comes in the form of feedback on terminology. What kinds
    of words did people use back then? If people put these words into your search
    engine, will they get the results they expect?


    Another way of improving search results is to pay attention to how people use
    search once it’s available to them. Especially pay attention to search terms that
    return zero or few results or to situations where the user searches for something,
    the site returns results, but the user doesn’t click any of them.


    # Animations


    Animations are your most powerful tool for drawing a user’s attention. Use them
    wisely and sparingly; never use animation for things that are visible over longer
    periods of time. You can read more about animations in Chapter 15, *Animations*,
    on page 145.


    # Takeaway Points


    +   - Decide which things need to be easily discoverable and which ones can be
    tucked away somewhere. Then, assign weights to the things that you decide to make
    discoverable, and design accordingly.

    +   - Keep in mind that not every feature has to be available at all times. Different
    things can be discoverable at different times.

    +   - Use your visual layout, a good search function, and (in rare cases) animations
    to make things discoverable.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Chapter 18


    # Don’t Interrupt


    In his book *Flow: The Psychology of Optimal Experience* [Csi02], psychology professor
    Mihaly Csikszentmihalyi explained that when people are completely absorbed by
    an activity they are doing, they reach a state of total focus that he calls *flow*.
    When people talk about “being in the zone,” they are often talking about that
    state of complete, single-minded immersion in a task.


    It usually takes us a bit of time to “get into the groove,” and it’s often easy
    to pull us out again. Maybe I’m completely immersed in writing this chapter, but
    suddenly—*bing*—goes the computer. I think, “New email!” and then spend the next
    five minutes reading the new message. Just like that, I’m out of the zone.


    Interruptions are expensive. They don’t just cost the time it takes somebody to
    deal with them. They also cost the time it takes to get back into whatever they
    were doing when you interrupted them—if they can do that at all. A recent Microsoft
    study showed that after being interrupted by an incoming email or instant message,
    it took Microsoft workers an average of 15 minutes to return to their previous
    tasks. People were easily distracted, and it generally took them a long time to
    recover from each distraction.¹


    So, interruptions cost time. They are also annoying and sometimes even a bit rude.
    After all, an interruption is nothing but an outside influence that stops people
    from doing what they’re currently doing.


    Whenever possible, you should not interrupt your users. Here’s how to do that.


    > 1. Steve Lohr summarizes some of the research in a *New York Times* article
    at http://www.nytimes.com/2007/03/25/business/25multi.html.'
  merge: -1
