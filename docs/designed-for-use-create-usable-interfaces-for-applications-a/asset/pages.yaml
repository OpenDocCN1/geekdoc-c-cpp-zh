  md: 'At this point, we know who our audience is going to be. But we''ve found out
    that they don''t know what they want, so we can''t just ask them what they need.
    Instead, we need to figure it out on our own. Our goals are rather straightforward:


    | Find Problems | Find Solutions |

    |---|---|

    | Find out what people are currently doing. | Find a way of making what they are
    already doing easier and more efficient. |

    | Find out what people have to do but really dislike doing. | Find a way of making
    the things they dislike obsolete, or at least more fun. |

    | Find out what they would like to be doing. | Find a way of making what they
    want to be doing possible. |


    You''ll find out how to do that in the following chapters.'
