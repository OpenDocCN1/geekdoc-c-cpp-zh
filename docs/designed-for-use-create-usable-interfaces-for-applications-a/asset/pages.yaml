    However, Jakob Nielsen also revealed that users ignore photos if they look like
    generic stock photography or pure filler.11


    # 6.9 Use Words People Understand


    Don’t let your pet peeves guide your writing. Some people don’t like to use the
    word podcast. Some people don’t like blog. Some people don’t like to use Lite
    for free versions of iPhone apps. But pretty much every-


