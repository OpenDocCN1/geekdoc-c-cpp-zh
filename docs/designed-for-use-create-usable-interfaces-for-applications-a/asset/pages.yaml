    A paper from the psychology department of the North Carolina State University
    titled “Failure to Recognize Fake Internet Popup Warning Messages”⁶ analyzed how
    people deal with fake pop-up warnings. When discussing the results, the researchers
    note:


    Data from the post task questionnaire indicated that 12% of those who clicked
    on the OK button indicated that they did so because the text told them to, while
    23% said they always click on that button when they encounter error messages.
    Just under half (42%) responded that they just wanted to “get rid of it.”


    Pop-up windows don’t even consciously register with people before they click them
    away. They are just a nuisance that keeps people from doing their work, and making
    them go away usually seems to fix the problem.


    But this doesn’t just apply to text in pop-up messages. People skip text whenever
    they think they can get away with it.


    # 6.3 Say Less


    Since people don’t read, it’s best to avoid bothering them with text whenever
    possible.


    For example, don’t warn people when they are about to do something destructive.
    Instead, allow them to undo their change.


    Similarly, if an error occurs and you have a way to make your product recover
    on its own without telling the user, do it. If the user has entered a website
    address that is truncated but your website receives enough information to identify
    the page he’s looking for, simply forward him to that page. If your application
    tries to connect to a server but the connection times out, make the application
    try again before telling the user there’s something wrong. Notify the user only
    if your product really can’t fix the problem on its own.


    6. Read it at http://media.haymarketmedia.com/Documents/1/SharekWogalterFakeWarning_publicationFinal_805.pdf.'
