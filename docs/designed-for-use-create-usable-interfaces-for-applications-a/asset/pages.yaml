    # What''s the Technique?


    In the chapter about paper prototypes (Chapter 11, *Paper Prototype Testing*,
    on page 104), you got a first taste of usability testing. Now, we want to do the
    same kinds of tests with real running code. In many ways, testing code is actually
    easier than testing paper prototypes, because you don''t need to simulate a computer.
    Testing running applications also allows you much more freedom in how to perform
    a usability test. This chapter reviews some ideas covered previously, while also
    introducing a number of new concepts that are not applicable to paper prototypes.


    This chapter focuses on explaining usability testing and on preparing for such
    a test. The next two chapters show how to run usability tests.


    Some of the concepts introduced in this chapter work well for larger teams; others
    work well for smaller teams or even for people running the whole show on their
    own. There should be something for everybody in this chapter, even if not everything
    directly applies to your situation.


    # Why Is This a Good Idea?


    If you want to know if your design *works*, you need to see whether people get
