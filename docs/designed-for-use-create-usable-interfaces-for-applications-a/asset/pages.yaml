    member Mike Kruzeniski writes that “a user interface is created of pixels, so
    in Metro we try to avoid using the skeuomorphic shading and glossiness used in
    some UIs that try to mimic real world materials and objects.”5


    Of course, in some ways, this is a bit of a false dichotomy. Often, it makes sense
    to use design cues from the real world and take advantage of the freedom digital
    devices offer. Take the Palm Pre’s calendar


