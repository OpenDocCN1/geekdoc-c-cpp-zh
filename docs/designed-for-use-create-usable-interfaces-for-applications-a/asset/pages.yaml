  img_proc: true
- pgno: 222
  md: 'You don’t need to make a task harder for your users. If a user doesn’t feel
    sufficiently challenged by her task, she will make it harder. She will add more
    complex transitions and titles to her movie. She will create a beautiful letterhead
    for her letter. She will learn how to use layer effects when editing photographs.


    There’s an additional issue with the idea that we should emulate games by making
    our products more difficult to use. As it turns out, most modern games aren’t
    actually difficult; they are specifically and carefully designed to merely *give
    the impression* of being hard.


    At the beginning of Nintendo’s seminal game Super Metroid, the heroine of the
    game is attacked by a huge monster. The fight seems impossible, and it takes all
    of the player’s skill to dodge the monster’s attacks while still fighting back.
    Just when her energy is about to run out and she thinks she’s done for, the monster
    gives up and flees. Wow, that was hard! A lesser player wouldn’t have made it!


    Actually, the monster always gives up seconds before the player dies. Anyone would
    have made it. It just *feels* like it was a nearly insurmountable challenge.


    In an article called “Hot Failure: Tuning Gameplay With Simple Player Metrics,”¹
    game developer Chris Pruett describes the system he uses to balance the difficulty
    of his Android game Replica Island.² To test his game, he released to players
    a version that reported where the players died. From this data, he created a heat
    map, shown in Figure 26.1, on the following page, that showed where in each level
    people died the most. Brighter colors indicate areas where people died more often.


    Using the heat map, he eliminated areas that were too difficult or caused deaths
    that were unfair to the player (such as pits that were invisible during a jump).


    Additionally, his game employs a dynamic difficulty-adjustment system that allows
    him to decrease the difficulty for players who die more often. He explains:


    > This system secretly increases the player’s life and flight power after a certain
    number of consecutive deaths.


    1. Read it at http://www.gamasutra.com/view/feature/6155/hot_failure_tuning_gameplay_with_.php.

    2. Find out more at http://replicaIsland.net.'
