- pgno: 246
  md: '# Moderated Tasks Tests


    In a moderated tasks test, a facilitator moderates the tests and introduces the
    testers to different activities or tasks. The moderator then observes the testers
    while they work on the tasks. The facilitator stays with the testers during the
    test and interacts with them.


    # Unmoderated Tasks Tests


    In an unmoderated tasks test, the facilitator introduces the user to the usability
    test and explains how everything works. The facilitator then gives the user a
    number of tasks on a sheet of paper and leaves the room. There is no or very little
    interaction between the tester and the facilitator in this type of test, which
    rules out any influence the facilitator might exert on the tester.


    # Free-Form Tests


    In a free-form test, the testers are given no tasks. Instead, the facilitator
    encourages the testers to explore the product on their own and do the tasks that
    interest them. This works best if you''ve recruited people who already have an
    interest in your product (say, you''ve recruited testers via your website).


    In reality, you will often combine aspects of different types of tests. For example,
    tests often start with the facilitator encouraging the tester to explore the product
    and then switch to task-based tests.


    # 28.7 Preparing for the Test


    Depending on the type of test you''re running, there are different things you
    need to do to prepare. In most cases, you will need a computer. Uninstall all
    the extraneous stuff that might interrupt the test, such as virus protection software.
    Install the product in a way that will allow you to easily reset the system to
    its default state (you don''t want to confuse testers with data other users have
    entered into the system). Install screen-recording software and a microphone.
    If you decide to record the user, you also need a webcam.


    It''s important to be as faithful to the product as possible. For example, you
    wouldn''t test an iPad application running in a simulator on a computer if you
    could avoid it. Instead, you would get an iPad for the tests and run the application
    on the device itself. Otherwise, you would miss'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'important problems—such as buttons that are too small to be touched with a
    finger but can be clicked using a mouse.


    If you''re going to test software that doesn''t run on a computer, you might need
    a camera that allows you to record the session.


    If you''re running a moderated test, where the facilitator stays with the user,
    recording the session is not strictly necessary. It can sometimes be useful, though.


    # Preparing Tasks


    For a task test (either unmoderated or moderated), you prepare by creating tasks
    for your testers. Think back to the very beginning of this book, where I talked
    about activities, and start with those. Focus on the most basic, most important
    activities of the product.


    Programmers use code coverage as a measure of how much of their code is covered
    by a test suite. When testing user interfaces, you can''t measure how much of
    the user interface is covered by a test quite so easily. But keep “user interface
    coverage” in mind as a goal. You want to design your tasks so that they touch
    on many different areas of your user interface.


    Just like with designing tasks for paper prototypes (in Chapter 11, Paper Prototype
    Testing, on page 104—in fact, if you want to, you can probably reuse tasks from
    your paper prototype usability test), you don''t want your tasks to be too prescriptive,
    so you should come up with a scenario that one of your users might actually experience.
    Describe the situation and the goal; do not describe any of the actual steps,
    and do not use words that are visible on-screen.


    Prepare at least five tasks. For a moderated test, print each task on an individual
    piece of paper. Otherwise, print them all on one piece.


    # 28.8 Running the Test


    When running the actual test, you basically have two choices: either meet the
    tester in person or do a remote test. In most situations, doing remote usability
    tests is a lot simpler and cheaper, and it removes some of the issues that in-person
    tests have.


    I recommend starting by doing a few in-person tests first to get a feel for how
    usability tests work and to get used to interacting with testers. This is a lot
    easier if you can sit right there next to them.'
