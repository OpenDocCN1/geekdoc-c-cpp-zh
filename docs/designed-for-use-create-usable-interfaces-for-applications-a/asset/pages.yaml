    # Chapter 6


    # Text Usability


    When we discuss design and usability, we tend to focus on visual elements first—text
    often gets overlooked. This is unfortunate, because text is one of the the main
    ways in which people interact with your application or website. In fact, in tests
    that track the movement of people’s eyes as they scan a screen, text is often
    the first thing people look for.¹


    > > When asked for feedback on a web page, users will comment on the quality and
    relevance of the content to a much greater extent than they will comment on navigational
    issues or the page elements that we consider to be “user interface” (as opposed
    to simple information). Similarly, when a page comes up, users focus their attention
    on the center of the window where they read the body text before they bother looking
    over headerbars or other navigational elements.


    The guys at 37signals concur. In Getting Real [FHL09], they write that “good writing
    is good design.” Words need to be considered as part of the interface design.




