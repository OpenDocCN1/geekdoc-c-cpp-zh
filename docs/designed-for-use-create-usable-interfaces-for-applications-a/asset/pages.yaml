  img_proc: true
- pgno: 104
  md: '# Why Is This a Good Idea?


    The earlier you find issues with your design, the easier it is to fix them. Every
    problem you fix with a pencil on paper is a problem you don’t have to fix in code.


    # Are There Any Prerequisites?


    You should have started doing sketches.


    # 11.1 Guerilla Paper Prototype Testing


    At this point in the process, you have static representations of your product.
    Whether it’s simple, crude sketches, wireframes, or detailed mock-ups, your product
    exists in the form of a series of pictures.


    At its most basic, paper prototype testing simply means you get a real person
    to “interact” with those pictures in order to gauge whether your planned user
    interface is understandable to your users. This could be as simple as showing
    somebody a drawing of a user interface and asking them something like “If you
    wanted to change the font size of the text document on this screen, where would
    you click?”


    You need a reasonably detailed sketch, wireframe, or mock-up of one of your product’s
    screens to do paper prototype tests. Then, find somebody willing to spend five
    minutes with you. Show them the screen, and ask a generic question: “What do you
    see on this screen? What do you suppose this product could be used for?”


    Alternatively, you can ask a simple task-based question: “If you had to use this
    application to add a picture to a document, what would you do?”


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_104_0.png)'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Paper?


    This chapter is about "paper prototypes," but the "paper" part isn’t meant too
    literally. You don’t necessarily need to do sketches on paper to do these kinds
    of tests. You can also do mock-ups on a computer and print them out. Or, instead
    of printing them, put them on a tablet computer, and show that to people. You
    could even create a simple interactive prototype of your product by putting sketches
    into an application like PowerPoint or Keynote.


    I guess this chapter should really be called "how to do usability tests with (mostly
    but sometimes not entirely) static sketches or mock-ups of your final product,"
    but that didn’t fit into the book’s layout.


    This kind of test will give you a general idea of whether people understand your
    design and what parts people don’t get. That way, you know where you have to make
    changes and where you’re on the right track.


    Simply showing people a mock-up of one screen of your product helps you understand
    whether people understand that screen. This is useful, but we can go a step further
    and test interactions. To do this, prepare more than one screen in advance. If
    you need pop-up elements or other elements that have to be added or removed from
    the screen, also prepare them in advance; draw them on Post-it notes so you can
    easily add them to the prototype.


    Prepared in this way, you can run actual task-based usability tests. Of course,
    you can’t let people veer too far off track, but if they do, you already know
    that there’s a problem with your design, because people don’t follow the path
    you expected them to take.


    You can do this type of simple test with pretty much anyone. It takes only a few
    minutes, and it’s quite easy to explain:


    I’m working on a new Twitter app. You know what Twitter is? OK, great. I’m currently
    working on the design of my app, and I’m trying to figure out whether people understand
    what I’ve done. You know, when you work on something for weeks, you lose any objectivity,
    and it’s hard for me to tell whether what I’m doing makes sense to anyone else.
    I was wondering'
  merge: -1
