  md: '# 26.4 Fun vs. Usability


    Being usable is a bit like being edible.¹² A lot of things are edible, but being
    edible alone doesn’t mean that something is also *delicious*. Similarly, a lot
    of things are usable, but that alone doesn’t mean that we *want* to use them.


    But while being edible is not sufficient for being delicious, it *is* required.
    Similarly, being usable is not sufficient for being fun, but it *is* required.


    So although not every usable product is necessarily fun, every fun product has
    to be usable—otherwise it will just be frustrating.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_230_0.png)


    Actually, this may not be entirely true. There is a kind of product that can be
    unusable yet still fun: art.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_230_1.png)


    If challenging your user is your only goal, then you’re basically creating art.
    This book is not about art; it is about applications and websites that humans
    use to reach specific goals.


    Victor Papanek was particularly harsh in his book *Design for the Real World*
    [Pap05], when he wrote that “the cancerous growth of the creative individual expressing
    himself egocentrically at the expense of the spectator and/or consumer has spread
    from the arts, overrun most of


