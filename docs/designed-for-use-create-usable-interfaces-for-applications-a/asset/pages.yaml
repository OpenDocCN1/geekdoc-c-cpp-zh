  md: 'a good idea, but even a single tester often yields useful insights into potential
    issues with your design.


    # 27.5 Running the Test


    This is pretty simple. Find somebody willing to lend you five minutes. Explain
    what exactly you are doing, what the application does, and what the task is that
    you want the person to perform. If you intend to record the session, get the user’s
    permission.


    We’re working on a new Twitter app. You know what Twitter is? OK, great. We’re
    working on this app, and in order to make sure that we got the design right, we
    want to see whether people can figure out how to use it, so we’re testing our
    design. We’re not testing you. Don’t worry if you don’t immediately get something,
    because that’s exactly the kind of feedback we’re looking for. It means we got
    something wrong with our design. If it’s OK with you, we’ll record this test so
    that we can go through it later. We won’t publish the recording or anything like
    that. OK? Great. For the first test, we want to test our “new message” user interface.
    We’re already logged in, and we just want to see whether people can figure out
    how to post Twitter messages. Feel free to talk during the test and explain what’s
    going through your mind while you’re using the app.


    Then, sit back, observe, and take notes.


    It’s very likely that the tester will run into issues rather quickly. If you feel
    that he gets frustrated, intervene and either give a hint or stop the test. Otherwise,
    just keep your mouth shut.


    I will talk more about how to run usability tests in later chapters, but for now,
    this is really all you need to know.


    # 27.6 The Results


    Once you’ve done this with a few people, you’ll end up with a list of problems.
    Some of them will likely have occurred with more than just one person, and those
    are the ones you want to focus on first. Think about why people didn’t get your
    design. Think about how to fix it. Implement a fix. Test again, until people get
    it.'
