  md: '# The Original Computers


    It seems funny to us that we would call a human *the computer*. Historically,
    though, computers actually were humans. The term was first used around 1600 and
    referred to people who carried out calculations.


    It was only during World War II that machines started to take over this task,
    when people like Konrad Zuse and Alan Turing created the first computing machines.
    As these machines became more prevalent, the term *computer* eventually changed
    its meaning.


    between tests. A good solution is to invite three or four testers and schedule
    them two or three hours apart. That way, you have enough time between tests to
    quickly go through the issues you’ve found and, if possible, make changes to the
    paper prototype accordingly.


    While you can run a paper prototype usability test on your own, it’s helpful to
    have at least one additional person there to assist you. Since you have created
    the paper prototype and since you know how the storyboard of your application
    looks, you are the perfect person to “play the computer” during the test. This
    means you will have to switch screens, show pop-ups, and simulate the user interface.
    This leaves you with little time to interact with the tester. Although you can
    do both if you have to, it makes sense to find a second person who can help you
    with this. This person is called the *facilitator*. Figure 11.1, on page 114 shows
    a typical setup for paper prototyping.


    The facilitator is the person who guides the usability test by introducing the
    tester to how the test works by giving out tasks and by answering any questions
    the tester might have.


    | Role | Responsibility |

    |---|---|

    | Computer | Controls the paper prototype, reacts to user input |

    | Facilitator | Introduces the tester to the process, gives tasks, answers questions
    |

    | Tester | Interacts with the paper prototype according to the given tasks |


    The facilitator should take notes during the test and (if you record the session)
    add the recording’s timecode to the note so that each note'
