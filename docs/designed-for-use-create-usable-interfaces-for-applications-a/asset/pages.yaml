    Images can also give your text a more inviting look. Facing a wall of text is
    discouraging, but add a few images, and the text looks more enjoyable to read.
    In their paper “What’s Psychology Worth? A Field Experiment in the Consumer Credit
    Market,”10 Marianne Bertrand et al. show that that merely adding a picture of
