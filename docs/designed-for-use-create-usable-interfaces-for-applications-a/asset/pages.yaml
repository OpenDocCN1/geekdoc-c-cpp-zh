- pgno: 226
  md: 'But progress doesn’t have to be shown quite so literally. When creating a movie
    trailer in iMovie, progress is shown as a list of scenes the user has to set up.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_226_0.png)


    Again, this shows the task and tells the user how far he’s progressed.


    # Skill Growth


    Another aspect of games design that can apply to product design in general is
    skill growth, or learning. Games get harder as the player’s skill improves. Users
    of your product will create greater challenges for themselves on their own—if
    they can. To keep your users in the “flow zone” where the challenge and the user’s
    skill match, your product needs to be able to grow alongside the user’s skill.


    A good example of this is the image-editing application Pixelmator.⁷ At first
    its user interface seems deceptively simple. But as the user’s skill grows, she
    can discover and learn new aspects of the application that are initially hidden.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_226_1.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_226_2.png)


    PIXELMATOR SEEMS DECEPTIVELY SIMPLE AT FIRST...


    ...BUT AS THE USER''S SKILLS GROW, SO DOES THE APPLICATION.


    7. Find out more at http://www.pixelmator.com.'
