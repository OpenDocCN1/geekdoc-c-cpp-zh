- pgno: 101
  md: 'On the Mac, OmniGraffle⁵ fills many of your user interface sketching needs.
    People have created user interface stencils specifically for OmniGraffle.⁶ If
    you’re an iPhone developer, check out Briefs⁷ and Review.⁸


    Some people also use tools like PowerPoint⁹ or Keynote¹⁰ to create mock-ups and
    prototypes. These tools even allow you to add simple animations and interactions.
    Sites like Keynotopia¹¹ and Keynote Kung-fu¹² provide user interface templates
    for these applications. Templates can help you create pixel-perfect mock-ups that
    use a platform’s standard user interface elements.


    All of these tools can make your life a lot easier. On the other hand, there are
    good reasons for going with paper. It’s faster, it’s more natural, and as long
    as everybody is in the same room, it’s easy to collaborate with other people;
    the only thing people need in order to contribute ideas is their own pencil. And
    since everybody has some kind of gadget with a built-in camera nowadays, sending
    the sketched user interface to somebody else is as easy as taking a picture and
    emailing it.


    Just use what’s easiest for you. If sketching on paper works best, sketch on paper.
    If you prefer to use an application specifically created for user interface designers,
    use that. If you want to use a graphics application instead, that’s fine too.
    Or simply use all of these tools, depending on your current task.


    # Takeaway Points


    +   - Start with a bird’s-eye view and work your way down to the details, from
    flow diagrams to storyboards to simple sketches to wireframes and eventually to
    detailed mock-ups.

    +   - Fix problems early. The earlier you notice a problem with your design, the
    cheaper it is to fix it.

    +   - Flow diagrams help you make it as simple as possible for your users to reach
    their goals.


    5. At http://www.omnigroup.com.

    6. For example, at http://graffletopia.com/categories/user-interface.

    7. At http://giveabrief.com.

    8. At http://www.getreviewapp.com.

    9. At http://office.microsoft.com.

    10. At http://www.apple.com/iwork.

    11. At http://keynotopia.com.

    12. At http://keynotekungfu.com.'
