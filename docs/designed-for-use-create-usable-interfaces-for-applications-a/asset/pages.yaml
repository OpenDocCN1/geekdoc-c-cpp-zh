- pgno: 67
  md: 'Next, go through the cards with the people doing the card sort, and make sure
    they understand what each word means in the context of your product.


    Now, ask the participants to sort these cards into categories that make sense
    to them, stacking cards they think belong together.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_67_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_67_1.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_67_2.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_67_3.png)


    Invite them to think out loud and to ask questions. Start taking notes at this
    point. If participants come up with new words, you can either make additional
    cards as necessary or add the words to existing cards as relevant.


    If the participants create many small groups of cards, encourage them to merge
    similar groups. If they come up with only a few large groups, encourage them to
    break them up.


    Alternatively, depending on the situation, you can also do a “closed” card sort,
    where you define a number of groups beforehand and let participants sort the cards
    into the different groups.


    It’s important to let people discard those cards that they feel don’t fit anywhere.
    These rejected cards may indicate product features or website areas that are not
    important enough to include or that are extraneous to the problems your users
    usually solve with your product.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Next, ask the participants to identify names for each stack of cards. Add a
    card with the name of the stack to the top of each stack (preferably in a different
    color).


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_68_0.png)


    If there are enough stacks, ask participants to arrange them so that those that
    belong together are located near each other. Depending on the people participating
    in your card sort and the words you’ve picked to put on the cards, you might even
    want to ask people to draw connecting lines between associated stacks. (If you
    intend to do that, do the card sort on a large sheet of paper.)


    Finally, collect the data. A quick and easy way to do this is to take a picture
    of the whole arrangement and then secure the individual groups of cards with rubber
    bands.


    # 8.5  Running a Remote Card Sort


    You don’t necessarily have to invite people to a physical place to do card sorts.
    Card sorting can easily be done remotely. In fact, there are a'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'number of good card-sorting websites like websort.net or OptimalSort³ that
    are specifically designed for doing remote card sorts.


    Remote card sorts give you more exact data, since you can do card sorts with a
    lot more people. However, you’ll miss a lot of the qualitative information you
    get from doing card sorts in person. What words are people confused by? What synonyms
    do they use? What kinds of associations do they have to the words on the cards?
    Remote card sorts won’t tell you these things.


    Of course, nothing prevents you from doing both kinds of card sorts.


    # 8.6 Evaluating the Results


    If you’re working with predefined groups of cards (a closed card sort), evaluating
    the results is simple. Count how often each card got sorted into each group, and
    you’ll get a pretty good idea of where most people would expect to find the thing
    that the card represents.


    |  | Group 1 | Group 2 | Group 3 | Group 4 | Group 5 | Group 6 | Group 7 |

    |---|---:|---:|---:|---:|---:|---:|---:|

    | Card 1 |  | 4 |  |  | 3 |  |  |

    | Card 2 |  |  | 2 | 6 |  |  |  |

    | Card 3 | 7 |  |  |  |  |  |  |

    | Card 4 |  |  | 5 | 1 |  | 1 |  |

    | Card 5 |  |  | 5 | 4 |  |  |  |

    | Card 6 | 1 | 4 |  |  |  |  | 3 |


    If you’re working with user-defined groups of cards, on the other hand, start
    by defining the groups. Sometimes different people use different words to describe
    the same group. In those cases, it may make sense to combine these groups. Other
    times, different people come up with entirely different ways of sorting the cards,
    creating entirely different groups. If this happens, it may be an indicator that
    you need to provide different ways of accessing the same things. Once you’ve hashed
    out which groups to use, you again count how many times each card was sorted into
    each group.


    > 3. At http://www.optimallworkshop.com/optimalsort.htm.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'Now you can develop a hierarchy based on the information you’ve collected and
    then use this hierarchy for your visual layout and for your information architecture.
    I would advise against formal, statistical evaluations of the data because you
    probably haven''t collected enough information. Card sorting provides input for
    your design decisions, not proof that a specific solution is the “correct” one.


    Simply take the information you’ve collected into consideration when working out
    things like the storyboard of your application, the hierarchy of your website’s
    content, or the hierarchy of individual screens. What you gain from a card sort
    is insight into how people think about the things in your product, the criteria
    people use to put the concepts present in your product into different mental boxes,
    and people’s mental model of how your product is supposed to work.


    After you’ve decided on a hierarchy, it is generally a good idea to create a simple
    paper prototype and run a few short rounds of usability testing. (See Chapter
    11, Paper Prototype Testing, on page 104 for more information on how to do this.)
    This way, you know whether your interpretation of the results is correct.


    # # 8.7 Guidelines for Creating Usable Hierarchies


    The data from card sorts can help you design good hierarchies. Here are some additional
    guidelines that should help you do that.


    # ## Allow Things to Exist in Several Places


    Keep in mind that hierarchies don''t have to be strict: things don''t have to
    be in exactly one place inside the hierarchy. You can give users several paths
    that lead to the same result. This is sometimes called a poly-hierarchical classification.
    There’s an example in Figure 8.1, on the next page.


    I mentioned a bit earlier that some users who experience problems with their computers
    might start by searching the website for their exact laptop model. Others may
    prefer to go directly to the Support section of the website to look for their
    laptop model. Still others may go to the Support section and start a search based
    on their specific problem. If you find that different people tend to sort cards
    into different groups in a card sort, it makes sense to create such a nonstrict
    hierarchy.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_71_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_71_1.png)


    # Figure 8.1: Example polyhierarchical classification


    # Shallow or Deep?


    A lot of the time, people evaluate user interfaces by counting clicks. How many
    times does the user have to click to reach the goal? It makes intuitive sense
    to assume that fewer clicks are better.


    This focus on counting clicks might tempt you to keep hierarchies as shallow as
    possible, making every possible goal reachable with the fewest clicks. Although
    it may often make sense to make sure that people can access a small number of
    important, often used features with few clicks, I advise against intentionally
    trying to achieve shallow hierarchies, because these force users to choose from
    a bigger number of possible actions at each level of the hierarchy. By cutting
    down on the depth of a hierarchy, you are increasing the potential choices at
    each level of the hierarchy.


    In fact, research shows that optimizing for fewer clicks doesn’t necessarily yield
    positive results. Summarizing the research, ux myths.com writes that “the number
    of necessary clicks affects neither user satisfaction nor success rate. That’s
    right; fewer clicks don’t make users happier and aren’t necessarily perceived
    as faster.”


    > 4. At http://uxmyths.com/post/654026581/myth-all-pages-should-be-accessible-in-3-clicks.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_72_0.png)


    # SHALLOW


    THE USER CAN REACH EACH OF THE NINE GOALS IN ONE SINGLE CLICK, BUT HAS TO PICK
    OUT OF NINE DIFFERENT CHOICES


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_72_1.png)


    # DEEP


    THE USER HAS TO CLICK TWICE TO REACH ONE OF THE SAME NINE GOALS, BUT ONLY HAS
    TO PICK OUT OF THREE CHOICES EACH TIME


    A rule similar to the “the fewer clicks, the better” rule is that you must constrain
    the number of options given to the user; do not make her choose from more than
    seven options. The reason given for this idea is that humans are incapable of
    processing more than seven possible choices. Like the “fewer clicks” rule, this
    rule is wrong.


    The “seven rule” originates from a paper published in 1956 by Princeton University’s
    cognitive psychologist George A. Miller.5 In the paper the author concludes that
    the average human can hold only about seven different objects in working memory.
    Although this may be true, it doesn’t apply to picking from a number of options,
    because you don’t have to keep all the options in working memory. You merely have
    to look through them and pick the first one that seems like it would bring you
    closer to your goal. This behavior is called satisficing, a term coined by psychologist
    Herbert Simon in 1956. Instead of comparing all available options in order to
    find the perfect choice, most people will simply pick the first option that seems
    sufficiently satisfying.


    In The Paradox of Choice [Sch05], however, Barry Schwartz notes that some people
    are “maximizers”—those who try to find the best possible solution, rather than
    the first suitable one. What’s more, although most people can cope with a large
    number of choices, many don’t like doing so. Schwartz writes that “a large array
    of options may discourage consumers because it forces an increase in the effort
    that goes into making a decision.”


    5. Wikipedia has a great article about this paper at http://en.wikipedia.org/wiki/The_Magical_Number_Seven,_Plus_or_Minus_Two.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'In other words, even though most people are perfectly capable of picking from
    many choices, they may not like it.


    A great user interface is not one where each goal can be reached with the smallest
    number of clicks possible, or where the user has to pick from only a small number
    of choices at each step, but one where each individual click is as obvious as
    possible. If your users have a clear goal in mind, each level of the hierarchy
    should have one option that clearly satisfies their goal—or at least gets them
    closer to that goal. As long as users feel that they are getting closer to their
    goal with each step, they don’t mind drilling down into a deep hierarchy.


    # # Grouping Things


    Humans may be capable of picking from dozens of choices, but that doesn’t mean
    you should throw ungrouped lists of choices at them. Being confronted by a wall
    of seemingly equally valid choices is discouraging.


    It helps users when you group or order choices in a meaningful way. Better grouping
    allows users to more easily scan the available options. The maximum number of
    choices that can appear on a single screen is mainly constrained by the design
    of the page that shows the choices to the user. If many different choices appear
    at the current level of the hierarchy, grouping them—in a way, adding a local,
    visual hierarchy to the choices—helps users find the option they are looking for
    among a large number of choices.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_73_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_73_1.png)


    Using proximity isn’t the only way you can create this kind of local structure.
    In his book Vision Science: Photons to Phenomenology [Pal99], Stephen E. Palmer
    describes a number of different ways of grouping'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'elements. These eight dots are ungrouped. Individual dots don’t seem to belong
    together in any way.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_74_0.png)


    Even by merely shifting them a bit, we can make it look as if there were four
    pairs of dots, rather than eight individual dots. This is called *proximity*,
    as mentioned earlier.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_74_1.png)


    Here’s another way of grouping the dots into pairs: changing the *colors* of four
    of the dots again turns the dots into four pairs of similarly colored dots.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_74_2.png)


    We can also change the *size* of the dots to achieve the same effect.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_74_3.png)


    Or we can change the *orientation*.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_74_4.png)


    These three examples show groupings based on color, size, and orientation. But
    these aren’t the only similarities you can use to group things. Different font
    styles, for example, might be another way of achieving this.


    A more obvious way of grouping elements is to put them into common regions.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_74_5.png)


    Or you can connect them directly.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_74_6.png)


    There are many ways of creating structure and grouping things. Use these methods
    when you need to show a large number of individual items on a single screen.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Takeaway Points


    +   - Don''t use internal structures as blueprints for hierarchies that users
    see in your product or website.

    +   - Use card sorts to find out where people think individual things should go.

    +   - Don''t optimize whole hierarchies for low click counts.

    +   - Use grouping to organize individual screens.


    # Further Reading


    There’s really only one book you need to read to find out pretty much everything
    there is to know about card sorting: Donna Spencer’s *Card Sorting: Designing
    Usable Categories* [Spe09].


    If you’re interested in the larger field of information architecture, *Information
    Architecture for the World Wide Web* [MR06] by Peter Morville and Louis Rosenfeld
    and *A Practical Guide to Information Architecture* [Spe10] by Donna Spencer are
    both good ways to get started. Spencer also writes a great card sorting blog⁶
    and a blog about information architecture.⁷


    If you’re interested in how humans perceive things, *Vision Science: Photons to
    Phenomenology* [Pal99] is a fascinating read.


    6. At http://rosenfeldmedia.com/books/cardsorting/.

    7. At http://practical-ia.com.'
