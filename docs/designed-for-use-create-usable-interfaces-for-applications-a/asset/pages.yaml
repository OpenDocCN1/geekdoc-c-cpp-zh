    # Chapter 27


    # Guerilla Usability Testing


    | | | |

    |Research|Design|Implementation|


    # What’s the Technique?


    Usability testing typically involves inviting people to come to you. This creates
    a number of issues with scheduling, setting up simple test labs, and finding people
    who are willing to help you out as testers. You can circumvent these problems
    by doing one simple thing: going to people instead of having them come to you.


    # Why Is This a Good Idea?


    You can do the best job possible planning and designing your product, but until
    you test it with real people, you don’t know how well it works.¹ By going out
    and asking people to do simple tasks with our product, you can quickly identify
    areas where your design needs additional work and fix these areas while the code
    is still easy to change. If you don’t invest time in finding out where your product’s
    problems are now, you’ll find out about them after you’ve launched it.'
