- pgno: 284
  md: 'If the quality of your design is currently somewhere in the middle of this
    graph, then you won’t be able to get to the best design possible by making only
    small, iterative changes and A/B-testing them. Think of it like this: if you go
    mountain climbing and decide to always climb up, you’ll eventually reach the peak
    of the mountain, but you’ll never reach the nearby mountain peak, which might
    be even higher. You have to climb down first to reach that higher peak.


    Similarly, you sometimes have to make a fresh start with a design that performs
    worse if you want to eventually arrive at a design that works much better.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_284_0.png)


    To avoid this problem, you might need to let go of this type of iterative design
    and take a chance on an entirely different design. A/B testing is a great tool
    in every designer’s tool belt. Just be aware of its limitations.


    # Takeaway Points


    +   - A/B testing allows you to compare different designs and find out which one
    works best.

    +   - The definition of what “works” depends on your users’ goals.

    +   - Getting usage data is simple for websites but harder for desktop or mobile
    applications. Remember to get your users’ consent and tell them exactly what you’re
    doing.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '+   - Make sure to check whether results are statistically significant before
    basing decisions on this kind of data.

    +   - When you compare your highly optimized old design to your new design, realize
    that even if the new design performs worse in a direct comparison, it might eventually
    perform better if you give it the same kind of attention you gave to the previous
    design.'
