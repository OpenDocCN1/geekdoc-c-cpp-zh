  img_proc: true
- pgno: 199
  md: 'If the action takes only one or two seconds, it''s OK to change the cursor
    to an hourglass or add a small “I''m working” indicator that doesn''t explicitly
    show how far the action has progressed.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_199_0.png)


    The goal here is not to tell the user how long the action will take but to make
    it obvious that the computer has received the user''s command and is working on
    it. The word obvious is quite important. If you watch people using web browsers,
    you will notice that they click a link repeatedly, thinking that the click didn''t
    “take” on the first try. Perhaps you do this yourself. Why? Because the little
    “Loading” throbbber or progress bar most browsers show is not obvious enough,
    and it''s not where the user''s focus is when she clicks a link.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_199_1.png)


    There is no clear feedback that the browser has received the user''s click, so
    people often try to click again and again.


    For actions that take longer than a few seconds, you need to provide some kind
    of progress feedback that indicates how long the action will take. This is typically
    done using a progress bar.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_199_2.png)


    In some cases, it may make sense to also tell the user what specific thing the
    computer is currently working on. This is especially important if it helps the
    user understand why he has to wait. For example, if the user is uploading a movie
    from a movie-editing tool, the task typically has two stages. First, the movie
    needs to be rendered and encoded.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Second, it needs to be uploaded. You could add some short explanatory text
    or even a little animation representing the active task near the progress bar,
    giving the user some indication of what is currently going on. Telling the user
    which stage the application is in provides an explanation for why the whole process
    is taking so long and can help make him comfortable with the idea of having to
    wait.


    If a task takes a long time, it’s likely that people will focus on something else.
    Eventually, they may forget that the task is running at all. You can use audio
    feedback to indicate that the task is done; that way, people will know even if
    they’re paying attention to something else.


    # 23.3 Perceived Speed


    Speed is perception. People are not going to measure your product’s response time
    with stopwatches. What really counts isn’t how long an action takes in seconds
    and milliseconds but how your users perceive your product’s speed.


    One thing you can do to improve speed perception is to start showing partial results
    as soon as possible. If you are implementing a user interface for a search system,
    don’t wait for the search to finish before you show the results to the user. Instead,
    start showing search results as soon as you start finding them.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_200_0.png)


    Another way of improving speed perception is to make sure that actions that take
    a long time don’t block your product’s user interface. If your users can do something
    else instead of being forced to wait for a process to finish, they are less likely
    to notice how long the process takes.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Here''s a final idea. Adding simple ripple effects that move counter to the
    direction of a progress bar can make the progress bar appear to move faster.³


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_201_0.png)


    # 23.4 Slowing Down


    Slow products are annoying, but the opposite can also be true. Sometimes, things
    can be too fast. A typical example of this is scrolling. If your application scrolls
    too quickly, users overshoot their target. It often makes sense to artificially
    slow down your product so people can keep up with it.


    A similar problem once occurred to me when I was working on Appway, a business
    process management system. Its process editor includes a Save feature that allows
    users to manually save changes to a process. When people used the editor and wanted
    to save their changes, they often repeatedly clicked the Save button rather than
    just clicking once and sometimes complained that it did not work properly.


    It turned out that the application was simply too fast for them. Saving the workflow
    took only a fraction of a second. The absence of a progress indicator meant users
    had no obvious feedback indicating that the document had actually been saved,
    but saving a document felt so important to them that they expected to see something
    reasonably substantial happen when they clicked the button. The solution was to
    throw up a “fake” progress indicator that took about half a second to finish.


    3. As shown here: http://www.newscientist.com/blogs/nsfv/2010/12/best-videos-of-2010-progress-bar-illusion.html.'
