- pgno: 188
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_188_0.png)


    # Chapter 22


    # Hierarchies, Space, Time, and How We Think About the World


    When computers allow people to organize their data, they often allow people to
    organize that data into hierarchies. The file system on your PC is the most obvious
    example of this.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_188_1.png)


    Hierarchies work well for a lot of things. People are used to hierarchies, since
    they encounter hierarchies all the time. Families are hierarchies of people (the
    “family tree”). We look at animals and see that individual species are related
    to each other in an evolutionary hierarchy. Stores arrange their products using
    hierarchical logic. (For example, if you’re looking for strawberry jam, you’ll
    go to the food section of the store. In the area where you’ll also find peanut
    butter and honey, you’ll look at the shelf with the jams, and you’ll find different
    kinds of strawberry jam.) Arranging music in a hierarchic fashion (Genre → Band
    → Album → Song) makes sense, and the arrangement is (usually) obvious and easily
    understood.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'When there is an obvious, generally understood way of arranging things into
    a hierarchy, people typically don''t have a problem with understanding and using
    such hierarchies. The problem occurs when we ask people to create and maintain
    hierarchies of arbitrary items.


    # 22.1 Hierarchies


    Humans are not good at organizing arbitrary things into a hierarchy and then later
    remembering where exactly they sorted a specific thing. For example, Mark Shuttleworth¹
    points to the hierarchical file system as a main source of usability issues in
    Ubuntu, saying, “People save an attachment they receive in email, and an hour
    later have no idea where to find it.”² Similarly, in a paper called “Improving
    the Usability of the Hierarchical File System,”³ author Gary Marsden writes:


    > Anyone who has studied how application users store files realizes that the file
    system is quite a large barrier to all but the most advanced users.


    In their paper “Hierarchical File Systems are Dead,” Margo Seltzer and Nicholas
    Murphy write:⁴


    > Users no longer know where their files are stored. Moreover, they tend to access
    their data in a more search-based fashion. We encourage the skeptical reader to
    ask nontechnical friends where their email is physically located. Can even you,
    the technically savvy user, produce a path name to your personal email? Your Quicken
    files? The last Word document you edited? The last program you ran? For that matter,
    how many files are on your desktop right now? How many of them are related to
    each other?


    This issue is compounded by several people accessing the same data; the hierarchical
    structure that may make sense for one person may be utterly incomprehensible for
    another, and even if they agree on a general structure, they will probably often
    disagree on where exactly to put individual items.


    +   1. Shuttleworth is the former CEO of Canonical Ltd., creator of the Ubuntu
    family of Linux distribution. Ubuntu is an operating system that is based on the
    Linux kernel, with a strong focus on usability.

    +   2. Read his essay at http://www.markshuttleworth.com/archives/223.

    +   3. You can find the paper at http://people.cs.uct.ac.za/~gaz/publ.html.

    +   4. Read it at http://www.eecs.harvard.edu/~margo/papers/hfos09/.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 22.2 Space


    Although we are able to understand reasonably obvious, intuitive hierarchies such
    as family structures and the logic governing where a store puts stuff, we''re
    not really good at coming up with hierarchies for most other things. We typically
    don''t arrange the stuff we own in a deeply hierarchical fashion. Sure, you may
    put all of your dinnerware into one cupboard and all of your kitchenware into
    another, but that''s hardly a hierarchy. Instead, you''re arranging things in
    space, putting related things next to each other. You don''t remember where to
    find your plates by any kind of hierarchy. Instead, you remember where to find
    your plates because you know where you put them.


    Similarly, your desk may be a huge mess, but you''ll probably have a pretty good
    idea of where on your desk you put that letter you got last week. Not because
    you''re using some kind of hierarchical organization scheme for your desk but
    simply because you know where you put it.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_190_0.png)


    This is called spatial reasoning. Humans are good at it. If your product can make
    use of the human ability to think in terms of space and if you can let your users
    arrange their data in space, do it.


    One example of this is Firefox''s Group Your Tabs feature. It allows users to
    get a spatial view of all the tabs in a window and group them on a two-dimensional
    plane.⁵


    5. Aza Raskin explains the thinking behind the feature at http://www.azarask.in/blog/post/designing-tab-candy/.'
