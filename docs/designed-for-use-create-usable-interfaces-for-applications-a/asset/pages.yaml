- pgno: 61
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_61_0.png)


    Interacting with a user interface element shouldn''t affect things that are placed
    above it in the visual hierarchy.


    Hierarchies are everywhere, and they affect how people expect your product to
    behave. By using hierarchies properly. you can give people hints that allow them
    to figure out how to use your product.


    # Takeaway Points


    +   - Think about how the elements of your product can be arranged hierarchically.

    +   - Use hierarchies to give your users hints about how your product works. Individual
    screens convey implicit or explicit hierarchies to the user.


    # Further Reading


    What most people call “organizing things,” designers call *information architecture*.
    There are a number of great books on the topic. Donna Spencer has written one
    called *A Practical Guide to Information Architecture* [Spe10]. The book *Information
    Architecture for the World Wide Web* [MR06] by Peter Morville and Louis Rosenfeld
    is another good place to get started.'
