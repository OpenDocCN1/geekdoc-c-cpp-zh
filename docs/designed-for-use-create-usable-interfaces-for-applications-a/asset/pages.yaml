- pgno: 277
  md: '# Takeaway Points


    +   - Take responsibility. “User errors” are really user interface design failures;
    they are *designer errors*. Simply assuming that the user is responsible for a
    problem doesn’t make the problem go away.

    +   - Don’t blame the user in your user interface. It makes your customers feel
    bad, and the problem was probably your fault to begin with.

    +   - Present useful error messages. If something goes wrong, explain what went
    wrong, but more importantly, explain how the user can fix the problem.

    +   - Prevent the problem. It’s always best to avoid errors altogether. If users
    encounter errors, think about how you can change the product so that the error
    doesn’t occur again.

    +   - Prevent mode errors by avoiding modes or by clearly indicating your product’s
    current mode.

    +   - Prevent input errors by clearly showing what you expect users to do or by
    preventing invalid input from ever occurring.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_278_0.png)


    # Chapter 33


    # A/B Testing


    | | | |

    | Research | Design | Implementation |


    # What’s the Technique?


    So far, I’ve mainly talked about usability tests that involve observing how individual
    users behave. This is great for finding problems with your designs, but it’s not
    good if you need to compare two (or more) different designs and find the best
    one.


    Let’s say you’re working on the text of your sign-up page, and you’re not sure
    which version works best for convincing people to sign up. Or you’re trying to
    decide between two different positions for the login form on your home page, and
    you’re not sure which one will work better for your users. The most common way
    to answer such questions is with A/B testing. With an A/B test, you can find out
    which one of two (or more) designs works best.


    Even though it’s called A/B testing, you don’t need to compare only two different
    designs; it can be used to test several different versions of a design. For this
    reason, it’s sometimes also called A/B/n testing.


    # Why Is This a Good Idea?


    A/B testing lets you improve your design using hard data. There’s no guessing
    involved. If you need to make your design perform better, A/B testing is the tool
    that will help you do that.


    # Are There Any Prerequisites?


    Yes. You need to have a working version of your product, and it should be used
    by a fair number of people.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Multivariate Testing


    *Multivariate testing* (sometimes called *multivariable testing*) is a version
    of A/B testing. With a regular A/B test, you test different fully implemented
    designs.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_279_0.png)


    *A/B TESTING COMPARES FULLY FORMED DESIGNS TO EACH OTHER.*


    With multivariate testing, you test different versions of individual parts of
    your design at the same time. (You have several variables in your design, which
    is why it’s called *multivariate*.)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_279_1.png)


    *MULTIVARIATE TESTING COMPARES SEVERAL INDIVIDUAL ASPECTS OF A DESIGN TO EACH
    OTHER.*


    Think of multivariate testing as running a number of concurrent A/B tests on small
    parts of your design. Unless you have good reasons for doing multivariate testing,
    I would avoid doing it, because it can lead to Frankensteinian designs that have
    a combination of elements that don’t match: the individual design elements that
    performed best in a multivariate test often don’t combine to form a great design
    when put together. Instead, it’s usually better to pit two or more fully formed,
    coherent designs against each other and then see which one performs better.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# 33.1 When to Do A/B Testing


    A/B testing is useful for comparing two or more designs and finding out which
    one works better. Generally speaking, there are two situations when this is useful:


    +   - You’ve redesigned or rewritten something, and you want to know whether the
    new design or the new copy works better than the previous version.

    +   - There are several possible solutions to a problem, and you want to find
    out which one works best.


    You can use A/B testing to compare everything from vastly different layouts to
    small changes in color or wording.


    If, like Google or Amazon, you have millions of people using your site every day,
    even minuscule differences in usability can result in tens of thousands of people
    either running into a problem or not. You probably don’t have that many people
    using your product, so small differences in usability may not matter much. There’s
    no need to check every little change with an A/B test. But when making larger
    changes, or for areas of your product that are particularly important (say, the
    sign-up screen of your web service), A/B testing is tremendously useful.


    # 33.2 What’s Success?


    The basic idea behind A/B testing is to implement two different designs and see
    which one works better. But there’s an inherent problem with this. What exactly
    does “works better” mean? At what point has the user successfully used your product?
    Sometimes, the answer is obvious. For example, in designing a checkout system,
    the system “works” when the user is able to finish the checkout process. Often,
    however, there is no immediately obvious answer to what constitutes “success.”


    One way to define “success” is to go back to the very beginning of the design
    process and think about your users’ goals. If you know why they use the product,
    then you can define success: the product works better if a higher percentage of
    your users are able to reach their goals.


    Sometimes, all it takes is to measure the percentage of people who click a link
    on a website or the percentage of your website visitors who sign up for your service.
    Other times, answering this question is more involved. How many people who start
    a task actually finish it? The definition of success depends on your product.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 33.3 Preparing for the Test


    At this point, you have two (or more) designs you want to test, and you have a
    definition of success. Now, you have to implement both designs and find a way
    of distributing them to your users.


    If your product is a desktop application, either you need to create two (or more)
    different builds and distribute the appropriate build to your individual users
    or you need to add both designs to the same application and decide which design
    to show when the user launches the application.


    If your product is a website, you need to implement a way of accessing the different
    versions of your website, either by giving the two designs different URLs or by
    deciding which design to show when the user accesses the single URL. A number
    of online tools are available for running A/B tests on websites. You can use Google
    Analytics¹ for A/B testing, but Google also offers Website Optimizer² to test
    changes to websites. Vertster³ is another tool that helps you create multivariate
    tests for websites.


    # 33.4 Running the Test


    When running A/B tests, you want to make sure that individual users don’t switch
    between the two different designs. (Seeing one version of the design and then,
    after clicking a link or restarting the application, suddenly seeing the other
    version would be really confusing.) To do that, you should partition your users
    into different groups that consistently see the same design.


    While the test is running, you’ll need a way of collecting the results. This is
    simple when you’re dealing with a website (since you can “see” what each user
    is doing), but it can be harder when dealing with a desktop application.


    You also need to inform users that you’re receiving usage data and explain exactly
    what you’re going to send back and why. Here’s how Google does this on Chrome’s
    download page:


    1. To find out more on how to use Google Analytics to run A/B tests on your website,
    read the essay by George Palmer at http://www.rowtheboat.com/archives/39.

    2. At http://www.google.com/websiteoptimizer.

    3. At http://www.vertster.com.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_282_0.png)


    # 33.5 Interpreting the Results


    Most A/B tools interpret the results for you; quite often, you can see early trends
    indicating which design performs best. But be careful: humans are pattern seekers,
    and it''s easy to see patterns where there are none. One thing to keep in mind
    here is statistical significance. You need to have some idea of how big the probability
    is that the results you''re seeing have occurred because of random chance.


    The company User Effect⁴ has a simple calculator⁵ that reveals whether the results
    of an A/B test with two designs are statistically significant. If they''re not,
    the calculator also tells you how many more visitors you need to get a significant
    result.


    If you have more than two designs in your A/B test, you can compare individual
    designs to see whether the difference is significant.


    # 33.6 Keep in Mind


    If you use A/B testing to compare the performance of small, incremental changes
    to your design, keep in mind that A/B testing will only


