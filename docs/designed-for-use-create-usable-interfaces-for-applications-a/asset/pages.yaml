- pgno: 93
  md: 'By now, you have a pretty good idea of who your audience is and what kinds
    of problems you want to solve. You probably even have a basic idea of how the
    solution might work. But be careful: you don’t want to settle on any particular
    solution yet. The human mind is pretty good at rationalizing information that
    goes against its current opinion. So, don’t form opinions too quickly. Try not
    to focus on a specific design or solution; doing so might make you blind to *better*
    approaches.


    Instead of immediately going for fully formed ideas, start slowly. In this part
    of the book, you’ll start by doing flow diagrams of your product. These are very
    simple, high-level ideas that will help you figure out how your product might
    work. Slowly, you’ll add details, moving from flow diagrams to storyboards to
    simple sketches and eventually to fully formed mock-ups and even to interactive
    prototypes.


    Always remain open to the possibility that you’re wrong. The longer you hold on
    to a design that doesn’t work, the harder it will be to change it. Failing early
    is a good thing.


    To make sure you’re on the right track and to allow you to fail early, you’ll
    test your design ideas with actual users. Pretty quickly, you’ll find out what
    works and what doesn’t.


    This part of the book is about iteration. Avoid strong opinions. Instead, design,
    test, accept if something doesn’t work, and iterate.'
  merge: -1
  img_proc: true
