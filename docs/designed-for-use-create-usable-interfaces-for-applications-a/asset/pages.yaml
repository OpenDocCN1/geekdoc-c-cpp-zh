  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_103_0.png)


    # Chapter 11


    # Paper Prototype Testing


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_103_1.png)


    # What’s the Technique?


    In the previous chapter, I explained how to sketch your product. I said that you
    should sketch before you commit to code because sketches are easier to change.
    But I kind of skirted around the issue of how you know what changes to make.


    In some cases, issues with a design—such as features that are available at the
    wrong time or overcrowded screens—become obvious once you see it sketched out
    before you.


    But in other cases, it’s not obvious. When is a design good? If you have more
    than one idea of how to do something, which idea will work best? Where are the
    issues with your current idea? This chapter will help you find answers to these
    questions.


    Your sketches are basically primitive forms—prototypes, if you like—of your product.
    As such, you can run usability tests with them and see whether your designs work
    the way you expect them to work. The easiest way to do that is to show them to
    people and see whether they understand them.


    If you’re working alone or in a small team, feel free to skip the part of this
    chapter that explains how to run full usability tests with paper prototypes.'
