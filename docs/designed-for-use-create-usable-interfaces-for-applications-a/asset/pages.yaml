    Besides minimizing the influence of moderators, unmoderated tests are less stressful
    for testers, because there is nobody sitting next to them, constantly looking
    over their shoulder.


    # Free-Form Tests


    In a free-form test, there are no tasks. The goal is to see what people do if
    they don’t already know what they are supposed to do. Just introduce the tester
    to the test, let him have at your product, and see what happens. I do recommend
    observing the test, either in person or from another room, in order to intervene
    when the tester gets bored or stuck. If that happens, suggest some tasks, and
    move to a task-based test.


    # Should You Encourage Talking?


    It’s a good idea to tell people that they are free to talk during the test if
    they want to, but you should take care not to force the issue. Some people just
    don’t like to talk, and constantly encouraging them to speak their mind will make
    them uncomfortable or distract them (especially if they have to speak in a non-native
    language, as is sometimes the case when testing with people from different cultural
    backgrounds). Avoid screening testers for people who like to talk; you don’t want
    to test your product only with extraverts.


    Although it is often useful to hear what’s on people’s minds, it’s not required
    information. In most cases, the problems your testers find are quite obvious even
    without knowing what’s going through their heads.


    In my experience, people tend to offer opinions when they are encouraged to speak.
    Your main job is to pay attention to what people are doing, not what they are
    saying. If people are getting sidetracked and start offering their opinions rather
    than doing a task, just gently remind them of what you need them to do. Say something
    like this: “What are you looking for right now?” to get them back on track.


    # Should I Record Tests?


    If you’re doing a moderated test, you don’t have to record the test, since you
    can see what the tester is doing and take notes during the test. But even if you
    don’t have to, should you record?'
