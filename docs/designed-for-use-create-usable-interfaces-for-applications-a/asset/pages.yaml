  md: 'There are a lot of Twitter apps out there. A lot. We''ve tried to look at all
    of them, but we gave up after we ran out of disk space from downloading them.
    Clearly, what the world needs right now is *even more* Twitter apps! So, today
    we''re introducing our own. Say hello to BizTwit!


    Why does the world need another Twitter app?


    Well, most of the Twitter apps we''ve looked at are for everyday Twitter users.
    They allow you to follow other people, respond to their tweets, and write your
    own tweets. The more advanced Twitter apps also support multiple accounts and
    neat features such as integration with Instapaper. But they''re pretty much all
    aimed at regular people.


    BizTwit is different. It''s aimed at people who have to update a company''s Twitter
    account:


    +   - Several different people can use the same account.

    +   - Everybody can share the same drafts.

    +   - Different people can have different rights.


    In the coming days, we''re going to explain these features and more. For now,
    go ahead and download your copy!


    Even a short, simple blog post like this one goes a long way toward defining what
    kind of product you want to build.


    # Takeaway Points


    +   - Writing manuals and blog posts, as well as creating screencasts, forces
    you to explain your design to other people. This helps you find issues with your
    design: if something is hard to explain, it may be hard to use.

    +   - People read manuals when they''re already unhappy, so manuals should fix
    the problem, not make people even more unhappy.

    +   - Press releases and blog posts help you think about your product''s goals
    and put the focus on the problems you want to solve. Can you explain your product
    in a single sentence? If not, maybe you''re trying to do too much or you''re not
    solving a specific problem.'
