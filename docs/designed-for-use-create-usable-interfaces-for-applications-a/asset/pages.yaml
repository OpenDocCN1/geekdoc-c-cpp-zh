  md: '# Chapter 23


    # Speed


    When we do usability tests, one thing that often gets little attention is the
    product’s speed and responsiveness. Usability tests will quickly show when users
    don’t understand what a button label means. But they usually don’t show that your
    product responds too slowly. People using your product in a usability test have
    a different motivation for doing so than your actual customers. The people in
    a usability test know that they are supposed to test your product; they won’t
    suddenly abandon it and switch to a competitor because they grow frustrated when
    they have to wait.


    Your real customers might. Tech investor Fred Wilson explains:


    > Speed is more than a feature. Speed is *the most important feature*. If your
    application is slow, people won’t use it. I see this more with mainstream users
    than I do with power users. I think that power users sometimes have a bit of sympathetic
    eye to the challenges of building really fast web apps, and maybe they’re willing
    to live with it, but when I look at my wife and kids, they’re my mainstream view
    of the world. If something is slow, they’re just gone. (...) When we see some
    of our portfolio company’s applications getting bogged down, we also note that
    they don’t grow as quickly. There is real empirical evidence that substantiates
    the fact that speed is more than a feature. It’s a requirement.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_197_0.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'It’s important to keep an eye on performance problems even if usability tests
    don’t show obvious signs that speed or responsiveness might not be good enough.


    # 23.1 Responsiveness


    The first thing to look at is how responsive your product is. Research is pretty
    consistent on this topic.² If an action takes less than 0.1 second to finish,
    the user perceives it as instantaneous. If it takes less than 1 second to finish,
    the user no longer perceives it as instantaneous but will not lose track of what
    is going on. If an action takes longer than a second, the chance increases that
    the user gets distracted while waiting for it to finish.


    Whenever possible, it’s best to make sure actions take less than 0.1 second.


    A somewhat related topic is continuous interactions on natural user interfaces,
    such as scrolling through a list by dragging the list with a finger. In those
    cases, performance is especially important. The user interface’s response to the
    user’s action must be immediate and fluid. The user interface must be able to
    keep up with the user’s actions, and it must be able to do so at a high frame
    rate. Responsiveness can make the difference between the user getting the impression
    that she is interacting with actual physical objects and her consciously noticing
    that she is simply giving commands to a computer. In such user interfaces, indications
    of poor performance, such as input lag or choppy animations, can destroy the user’s
    mental model of your product and can be extremely irritating. (I’ve written more
    on this particular topic in Chapter 13, Natural User Interfaces, on page 130.)


    # 23.2 Progress Feedback


    If an action takes longer than 0.1 second, you need to provide some kind of feedback.
    Determining the type of feedback required depends on two things: how long the
    action takes and what kind of action it is.


    2. For more information, read Jakob Nielsen’s essay on response time: http://www.useit.com/papers/responsetime.html.'
