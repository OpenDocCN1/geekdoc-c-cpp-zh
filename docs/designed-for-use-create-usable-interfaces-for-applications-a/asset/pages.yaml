- pgno: 51
  md: '# The Passive Voice


    When people give writing advice, they often claim you should "avoid the passive
    voice." Although there is some truth to that ("click Backup to create a copy is
    better than "a copy is created by clicking Backup"), the case against the passive
    voice is often overstated. There is nothing wrong with writing something like
    "Don’t worry about the Backup button—your documents will be backed up automatically,"
    even though "your documents will be backed up automatically" uses the passive
    voice. In fact, changing this to active voice would simply add useless words to
    the sentence, making the end result worse: "the application will back up your
    documents automatically."


    I suspect that people don’t really mean you should avoid the passive voice. After
    all, passive voice merely means that the subject of the sentence doesn’t initiate
    the sentence’s action but is its recipient.


    Instead, what people mean is that you should avoid writing in a way that makes
    it unclear who a sentence’s active party is. People often use the passive voice
    to shift responsibility away from themselves ("Mistakes were made"). Avoiding
    that kind of writing is generally good advice.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_51_0.png)


    Read the text out loud. Ask yourself whether this is something you would want
    to read. Ask yourself whether the text contains information anyone not working
    in your marketing department would find useful.




    Maintaining images and screenshots can be a lot of work. With each product update,
    you have to go through all of the pictures and fix the ones that are out of-date.
    It’s tempting to just avoid pictures altogether. But pictures can make your text
    more understandable and readable.


    Pictures help illustrate points. A good screenshot can replace several paragraphs
    of text and may be easier to understand. Depending on your audience, even simple
    explanations can benefit from an illustration.'
