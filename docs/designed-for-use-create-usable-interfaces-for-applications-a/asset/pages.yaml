    Say something like this:


    To test this website, I’m going to give you a task. I’ll read it to you first,
    and then I’ll give it to you in written form.


    Then, hand the tester the piece of paper, shut up, and observe. It’s OK to take
    notes, but try to avoid influencing the tester as much as possible. Don’t make
    any noises. Definitely don’t laugh. Sit back a little.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_251_0.png)


    If the tester finishes a task, say something to acknowledge that fact, and move
    on to the next task. If, on the other hand, the tester looks unhappy or seems
    to be stuck, feel free to stop the current task. If you have to stop a task, you
    must avoid discouraging the tester; you can do that by ensuring he knows that
    the result of the test was helpful, even if he didn’t finish the task. Say something
    like this:


    Yes, I had a hunch there might be a problem with this interface. I can see what
    we have to change now. I think we’ve learned all we can from this task—let’s move
