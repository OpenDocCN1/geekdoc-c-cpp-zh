- pgno: 227
  md: 'To make it possible for people to increase their skills, your product needs
    depth. It should be easy for new users to learn, but it also needs to provide
    advanced features for advanced users to discover. Thomas W. Malone suggests making
    this progression an explicit part of your product:


    For example, a multilayered text editor could be designed so that beginning users
    need only a few simple commands and more advanced users can use more complicated
    and more powerful features of the system.


    The point here is that a multilayered system could not only help resolve the trade-off
    between simplicity and power, it could also enhance the challenge of using the
    system. Users could derive self-esteem and pleasure from successively mastering
    more and more advanced layers of the system, and this kind of pleasure might be
    more frequent if the layers are made an explicit part of the system.


    # Discovery and Rewards


    Modern games often combine conveying progress with discovery. They do this using
    something called *achievements*. Microsoft’s Xbox first introduced achievements,
    and other consoles have followed suit since then. Some systems call them trophies,
    challenges, or badges, or they use other names. By now, regular applications and
    websites have started using them.


    Achievements are awards given out to users either for discovering a new aspect
    of a product or for doing something positive. They are used both to encourage
    experimentation, as well as to reward good behavior.


    Audible’s mobile app uses badges as well as usage statistics that show the user’s
    progress to encourage people to listen to audiobooks more often. Figure 26.2,
    on the next page shows this. Audible also uses this data to assign different levels
    to users, from “newbie” to “master,” further encouraging them to use the app more
    often.


    Location-based social networking site Foursquare uses secret badges to encourage
    exploration: users are rewarded for figuring out unusual situations for using
    Foursquare.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_228_0.png)


    # Figure 26.2: Progress feedback in Audible


    Question-and-answer site Stack Overflow⁸ uses badges to encourage and reward good
    behavior. In addition to this, Stack Overflow awards points to users. It even
    has something called *user flair*, a piece of HTML their users can include in
    other sites to showcase their points and their badges.


    # Competition


    Publicly showcasing points introduces another element commonly found in games:
    competition. Systems like Nike+⁹ or RunKeeper¹⁰ use scores and competition to
    get users to use their systems more regularly.


    Twitter is another system that uses competition to engage users. Online community
