- pgno: 112
  md: '# **Observers**


    The three roles I’ve mentioned so far are computer (the person who controls the
    paper prototype), tester (the person who interacts with the paper prototype),
    and facilitator (the person who leads the test). For most smaller companies, these
    are often all the people you will have in a usability test for a paper prototype.
    However, in larger companies, it makes sense to have more people participate and
    observe the tests. In my experience, programmers and people from the management
    team can profit tremendously from seeing how users interact with their products.


    We call the people who observe tests observers.


    For a usability test of a paper prototype, observers can either sit in the same
    room as the other three people, observe from a different room, or watch the video
    after the fact. If they sit in the same room, they need to know that they should
    not interfere or influence the tester in any way. Generally, I think it is a bad
    idea to have observers in the same room as the tester, but since tests of paper
    prototypes already require a computer and a facilitator, adding two or three observers
    might not make much of a difference.


    Tell your observers to take notes during the test. Afterward, you should spend
    an hour or so going through the issues found during the test. The more people
    who observe the test, the more issues they will find. You can use affinity diagrams
    to prioritize issues coming from several observers. This is explained in Carolyn
    Snider’s excellent book Paper Prototyping: The Fast and Easy Way to Define and
    Refine User Interfaces (Sni03).'
  merge: -1
  img_proc: true
