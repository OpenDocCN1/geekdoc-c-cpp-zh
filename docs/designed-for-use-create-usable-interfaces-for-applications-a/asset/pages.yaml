  md: 'want to feel like I''m really getting my money''s worth." OK, so we made it
    big. And then when Lynx came out, suddenly they all said, "So big?! Why is this
    thing so big?" It was awful. The original Lynx was mostly air space inside! We
    should have followed our instincts; instead, we did what the focus groups told
    us to do, and that was a mistake.


    It turned out that people didn''t really know what they wanted from a handheld
    gaming device; they were not capable of correctly predicting how they would use
    it. Despite what people claimed, they did not want large, powerful devices. Instead,
    kids liked to put these devices into their school bags and carry them around.
    The Lynx was too large for this, and the powerful processor and the color screen
    ate through a set of batteries within less than four hours; in other words, a
    full set of fresh batteries typically didn''t even last a single school day. What''s
    more, all the hardware power of the Lynx made it expensive enough that a lot of
    parents were not comfortable handing one to their kids.


    People thought they wanted a big device with a powerful processor and a color
    screen, because they imagined how awesome the games on such a device would be.
    In reality, they wanted a cheap, small device they could easily carry with them
    and play for a long time on a single set of batteries.


