  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_291_0.png)


    # Chapter 35


    # Dealing with User Feedback


    Once your product is out there, the hard part starts. Real people will use your
    product in ways you’ve never imagined. They will encounter issues you never thought
    of, and they’ll complain to you about them. I’ve already mentioned some aspects
    of how to deal with user feedback in Chapter 24, *Avoiding Features*, on page
    205, where I explained how to use “The Five Whys” to evaluate feedback. In other
    parts of the book, I’ve talked about when to listen to your users and when to
    take their feedback with a grain of salt.


    This chapter covers some additional aspects of user feedback.


    # 35.1 Unexpected Uses


    One important thing to keep an eye out for is unexpected ways people use your
    software. In the 1970s and 1980s, IBM vastly underestimated the market for personal
    computers, not realizing that people would find uses for these devices that IBM
    itself could not think of.


    When Tim Berners-Lee proposed the World Wide Web at CERN in 1989, his stated goal
    for the technology was “to link and access information of various kinds as a web
    of nodes in which the user can browse at will.” Today, we write *whole applications*
    that run on his platform.


    For a more recent example, when the podcasting company Odeo came up with the idea
    of building a simple system for posting the kinds of status messages that people
    would otherwise put into their Skype status, they had no clue that their users
    would “abuse” Twitter as a microblogging site.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'The point is that people do not always use your product the way you want them
    to or the way you thought they would use it when you built it. And that’s not
    a bad thing: it means you’ve stumbled upon a market you didn’t know would be interested
    in your product or perhaps didn’t even know existed.


    There are three ways of dealing with this:


    +   - Ignore it. This mostly applies if the additional market is smaller than
    your “main” market. If these people are happy with what your product does, great.
    You’re getting a few more users for free.

    +   - Adapt your product to it. If this new market is much bigger than your original
    target market, it may make sense to change the direction of your product and specifically
    target this new market.

    +   - Split your product. If both your original market and this new market seem
    interesting, create specific editions of your product that are uniquely targeted
    at each individual market.


    Each of these choices can be valid, but it’s important that you think about your
    options before going with one.


    # 35.2 Bad Feedback


    People are often vicious when writing feedback. One of the reasons for this is
    that people sometimes don’t expect anybody to read their messages. So, they use
    your feedback form as a way of venting their frustration.


    Don’t take it personally. After all, the fact that these people took the time
    to yell at you means they at least care enough about your product to take the
    time to yell at you. It could be worse: they could not care at all.


    When I talked about his design process with interaction designer Chris Clark,¹
    he told me the following:²


    > I’m kind of weird; I love negative feedback. Unsolicited complaint means somebody
    cared enough to write it down, and then when you fix their pet peeve, they transform
    into a fan. Plus you got to fix a real problem for a real person, which is


    1. Find him at http://releasecandidateone.com.

    2. Read the whole interview at http://ignco.de/320.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'pretty rewarding. The oft-bemoaned fact that iOS developers can''t reply directly
    to App Store commenters is all the more reason to fix the root of the problem.


    Customer comments do ease the planning of future software releases a little. They''re
    the squeaky wheels. It''d be foolish to ignore your own ideas and priorities in
    favor of being 100 percent feedback-driven...you''d find yourself in the Henry
    Ford “my customers wanted a faster horse” situation pretty quickly, but it''s
    helpful nonetheless. Popular feature requests jump up the queue, others languish.


    Some negative feedback just isn''t helpful, but that''s life. The world has its
    share of caustic assholes with nothing better to do than give one-star reviews
    on iTunes, but if mean words really bother you, you have no business making things
    and selling them to the public. Don''t be a musician, either. Or a writer. Or
    a chef.


    Rather than taking bad feedback as an insult, take it as an opportunity to turn
    a passionate user of your product into a passionate fan of your product.


    Take a deep breath. Don''t be defensive. Think about what the user actually said.
    Does he have a valid reason for being angry? Is there anything you can do to help
    this person? Is there something you can do to make sure that nobody else encounters
    the problem this person encountered?


    We are designing products because we want to help people achieve their goals.
    This is exactly why you''ve read this book: you want to make people''s lives better.
    Bad user feedback doesn''t mean you''ve failed. It merely means that you still
    have work to do.


    # Takeaway Points


    +   - People may not use your product the way you intended. This can often be
    a great opportunity to take your product into new directions.

    +   - Don''t let bad feedback get you down. Instead, use it to turn an angry customer
    into a fan.'
