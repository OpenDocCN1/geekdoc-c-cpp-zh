- pgno: 124
  md: 'However, enabling users to immediately form a strong mental model is not necessarily
    always a good thing. It means that your users have very specific expectations
    of how your product works before they even use it. In other words, if you go with
    a realistic visual design, you’re obligated to ensure that the interaction design
    is similarly realistic.


    You can’t create a book-reader application that uses a realistic depiction of
    a book as its user interface, only to then add “next” and “back” buttons to let
    users move from page to page. If people see a realistic book on a screen, they
    expect to be able to leaf through the book by “flipping” the pages with their
    fingers. They also expect to be able to see how far along they are in a book by
    looking at the layer of pages stacked up on each side of the book, because that’s
    how real books work.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_124_0.png)


    Conversely, offering realistic interactions in a nonrealistic user interface is
    typically not harmful, but chances are people simply won’t discover these interactions
    unless you introduce some realism—textures, for example—that provide hints. Such
    user interfaces don’t provide enough affordances.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_124_1.png)


    If you are creating an application or website that represents a real-world object,
    going with a realistic visual design and a realistic interaction design sounds
    like a winner. However, there are potential problems with this approach.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 12.3 Replicating Physical Constraints in Digital Products


    Although realistic user interface elements allow people to quickly form accurate
    mental models, these elements also restrict what you can do. In his essay “Overdoing
    the interface metaphor,” Instapaper developer Marco Arment pinpoints the issue:²


    > It’s important to find the balance between real-world reproduction and usability
    progress. Physical objects often do things in certain ways for good reasons, and
    we should try to preserve them. But much of the time, they’re done in those ways
    because of physical, technical, economic, or practical limitations that don’t
    need to apply anymore.


    Usability consultant Bruce Tognazzini agrees, noting that “in the hands of an
    amateur, slavish fidelity to the way a real-world artifact would act is often
    carried way too far.”³


    Korg’s Synthesizer shown earlier looks like a real synthesizer. Here’s a screenshot
    of Beatwave,⁴ a different synthesizer for the iPad:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_125_0.png)


    It doesn’t look like a real synthesizer at all and makes use of an interaction
    model that wouldn’t be possible in the real world.


    Here’s another example. A physical calendar exists on a limited number of two-dimensional
    sheets of paper. Since the calendar manufacturer


