    # Takeaway Points


    +   - If you want to know whether a user interface works, you need to test it
    with actual people.

    +   - Usability tests don''t have to be expensive or take a lot of time.

    +   - You should do tests regularly; the more testing you do, the better you get
    at it, and shorter iterations make it easier to test user interface ideas to see
    whether they work.

    +   - It''s better to do smaller tests more often, rather than testing less often
    with more people. It''s fairly simple to do one usability test with one (different!)
    person each week.

    +   - You should test with novice users, as well as with people who already know
    how to use your product, because the two groups of people are likely to find different
    kinds of issues.

    +   - When selecting testers, look for diverse cultural backgrounds. Don''t forget
    to test accessibility issues as well.

    +   - There are different kinds of usability tests, including moderated or unmoderated,
