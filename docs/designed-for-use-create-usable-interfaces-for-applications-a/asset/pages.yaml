  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_271_0.png)


    # Chapter 32


    # User Error Is Design Error


    When people fail at using our products, we may be tempted to attribute that failure
    to user incompetence. It’s a “user error,” we may say. This response has its own
    acronym: “PEBKAC,” which stands for “Problem Exists Between Keyboard And Chair.”


    When you do your first usability test, it’s natural to experience some amount
    of denial—surely your product can’t be that bad. You probably just happened to
    pick a few truly inept people to test it, right?


    This tendency to blame users is often supported by users themselves, who also
    tend to blame themselves for problems with your product. When they are unable
    to figure out how to use it and you show them how, they will often respond with
    something like “Oh wow, I have no idea how I did not see this! It seems so obvious
    now!” They tend to blame themselves for not seeing something, rather than blaming
    your product for not making it obvious enough.


    Blaming the user for your product’s errors does not fix the error. If tens of
    thousands of people use your product, every problem you see in a usability test
    will be experienced by hundreds or even thousands of users. Rather than assigning
    blame, fix the problem. In his book The Design of Everyday Things [Nor88], Don
    Norman puts it like this:


    > Don’t think of the user as making errors; think of the actions as approximations
    of what is desired.


    People don’t make errors. Your product makes errors when it doesn’t interpret
    the user’s actions correctly.'
