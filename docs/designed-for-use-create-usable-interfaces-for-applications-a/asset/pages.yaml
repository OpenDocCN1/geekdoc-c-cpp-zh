- pgno: 121
  md: '# The Case for Symbols


    If symbols are so complicated, why use them at all? Wouldn’t it be easier to just
    use text labels and omit images altogether?


    In the book *Information Visualization* (War04), author Colin Ware outlines research
    on how humans are really good at quickly recognizing pictures, pointing out:


    > The fact that visual images are easily recognized after so little exposure suggests
    that icons in user interfaces should make excellent memory aids, helping us recall
    functionality of parts of complex systems. Icons that are readily recognized may
    trigger activation of related concepts in the semantic network of long-term memory.


    In other words, symbols can make a product easier to use.


    specific camera. The button without the details, on the other hand, is archetypal.
    It doesn’t display a specific camera. Instead, it conveys the concept “camera.”


    At the same time, having too few details makes it more difficult for users to
    identify exactly what you’re trying to convey.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_121_0.png)


    As usual, you can find the sweet spot between the two extremes. You want to be
    somewhere in the middle of this entirely unscientific graph:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_121_1.png)


    Usability testing can help you identify the sweet spot for your particular images.'
