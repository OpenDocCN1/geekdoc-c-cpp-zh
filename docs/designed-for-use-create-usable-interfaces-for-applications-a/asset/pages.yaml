  md: '# Before We Start, a Word


    This is a book for visual designers and programmers. It’s not, however, about
    visual design or about code. Instead, it’s about something much more important:
    the people who will be using your product.


    The best product is of no consequence whatsoever if people don’t use it. You can
    create the most beautiful, sturdiest, most elegant brush in the world, but if
    nobody uses it to paint a picture, your work was in vain.


    This book helps you make products—applications and websites—that people will want
    to use.


    There are two kinds of chapters in this book: “technique chapters” and “idea chapters.”
    Each technique chapter explains a specific technique you can use during the design
    process to make your product more user-friendly: storyboarding, usability tests,
    or paper prototyping, for example. Technique chapters explain concrete things
    you can do—the tools for your designer’s tool belt.


    Idea chapters, on the other hand, talk about ideas or concepts in more general
    terms: how to write usable text, how realistic your designs should look, when
    to use animations, and so on. Idea chapters explain things to think about and
    consider while coming up with designs.


    # Technique Chapters


    You can identify technique chapters by the cog on the first page.


    All technique chapters follow the same basic outline. Since not all techniques
    work well in all situations, I start by quickly outlining the kinds of situations
    to which the technique applies. Then, I explain what the technique is and how
    to use it. I end many of the technique chapters with a specific example of the
    technique as applied to a fictional application we design as we proceed through
    the book.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_11_0.png)'
