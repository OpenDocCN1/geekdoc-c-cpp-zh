  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_219_0.png)


    # Chapter 26


    # Learning from Video Games


    We want to make our products fun. But how? A lot of different things can be fun.
    For example, some people think that being scared is fun. They like riding roller
    coasters and visiting haunted houses. Obviously, in most cases, we can''t make
    our product more fun by making it scarier. Instead, the kind of fun we most typically
    experience when we use applications and websites is the one associated with what
    psychology professor Mihály Csíkszentmihályi calls *flow*.


    # 26.1 What''s Fun?


    Fortunately, there is a lot of great research on the psychology of this kind of
    fun, and the results are rather consistent. In his book *Flow: The Psychology
    of Optimal Experience* [Csi02], Mihály Csíkszentmihályi explains that people experience
    fun when they have a goal, a way of measuring progress toward that goal, constant
    feedback on their success, and skills that match the challenge, neither exceeding
    it nor falling short. He notes that “by far the overwhelming proportion of optimal
    experiences are reported to occur within sequences of activities that are goal-directed
    and bounded by rules—activities that require the investment of psychic energy,
    and that could not be done without the appropriate skills.”


    Similarly, in his book *A Theory of Fun for Game Design* [Kos04], Raph Koster
    comes to the conclusion that people who play video games have fun when they are
    able to master tasks; the game presents what appear to be difficult problems that
    make sense to the player in the context of the game’s world. The player’s ability
    to solve these problems is what makes the game fun. Koster writes:'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Fun is all about our brains feeling good—the release of endorphins into our
    system. (...) One of the subtlest releases of chemicals is at that moment of triumph
    when we learn something or master a task. This almost always causes us to break
    out into a smile. After all, it is important to the survival of the species that
    we learn—therefore our bodies reward us for it with pleasure. There are many ways
    we find fun in games, but this is the most important.


    So, let''s quickly recap these points. People experience fun when the following
    three criteria are met:


    +   - They have a meaningful challenge or task.

    +   - They have a way of measuring whether they are getting closer to mastering
    that challenge.

    +   - They have the ability to master that challenge.


    To be an actual challenge, the user''s task can''t feel too easy, because that''s
    boring. On the other hand, the task can''t be too hard; otherwise, it will be
    stressful. People experience fun when their skill level matches the challenge.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_220_0.png)


    The mechanism that makes a video game fun is very similar to the one that makes
    your application or website fun.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 26.2 Why Your Product Is Not Like a Game


    What we’ve discussed so far applies both to games and to your product. However,
    there are two important differences between them: where tasks come from and who
    sets the tasks’ difficulties.


    # Games Need to Provide Tasks; Your Product Doesn’t


    When playing a game, the game itself provides the tasks. With your product, the
    user provides the tasks.


    I sometimes hear user interface designers say something like:


    Games make the player do unnecessary tasks, such as collecting coins. But people
    have fun playing games. So, it’s probably OK for my application to make the user
    do unnecessary tasks; they’ll still have fun using my product.


    This rationalization seems to offer some justification for overly complicated
    design. Overly complicated design provides more things for the user to do. Games
    also provide things for the player to do: evil Bowser has kidnapped the princess,
    and the player needs to get her back by jumping on turtles.


    Your product, however, is different from a game. You don’t have to provide any
    tasks. The user will provide the tasks—for example, creating a movie or a presentation
    or finding a specific piece of information. The application or website is the
    tool used for accomplishing these tasks.


    # Games Need to Control the Difficulty; Your Product Doesn’t


    In a game, the designer controls the difficulty of the task. With your product,
    the user controls the difficulty of the task.


    This might sound like an inconsequential difference, but it affects how you should
    design your product. Here’s something I’ve heard designers say about difficulty:


    Games can be difficult to play, but people still have fun playing them. So, it’s
    OK to make my application difficult to use. That’ll just make it more fun for
    my users.


    An application or website that is hard to use does not present a meaningful challenge
    if the difficulty is unrelated to the actual task. It merely makes the user feel
    stupid and gives him the impression that he is not completely in control.'
