- pgno: 207
  md: '# 24.3 Instead of Adding a New Feature, Make an Existing Feature More Usable


    If a lot of feature requests are coming in that can be solved using your product''s
    existing feature set, chances are you should invest time into fixing your existing
    features, rather than creating new ones. Similarly, if your product has a neat
    feature that nobody seems to know about or use, it''s generally a good idea to
    investigate how you can improve that feature.


    Essentially, rather than adding a completely new feature, the goal is to make
    an existing feature available to more of your users. By taking this approach,
    you''re actually simplifying your product—not making it more complex. At the same
    time, you''re essentially adding functionality for all of the people who didn''t
    realize the feature even existed or who didn''t know how to use it.


    It''s also possible that a new feature might replace an existing feature. When
    considering a new feature, you should ask yourself whether it makes an already
    existing feature obsolete. An argument in favor of implementing the new feature
    is if you can remove an existing feature because the new feature provides the
    same or similar functionality but in a much better, easier-to-use way.


    # 24.4 Solve Several Problems with One Change


    Instead of adding new features individually, it often makes sense to consider
    similar (or even seemingly unrelated) features as part of one problem to solve.


    For example, consider these feature requests for a word processor:


    User 1: I often write letters, so it would be really useful if I could insert
    my letterhead automatically into my documents.


    User 2: I would like a way to change the default font.


    User 3: Is there some way I can change the footer style on several documents at
    the same time?


    Ostensibly, these requests don''t have much in common. However, they could all
    be satisfied by implementing a templating system. Giving people the option to
    create their text document from a set of templates solves a number of different
    user requests.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 24.5 Consider the Cost


    Every new feature has both a value and a cost. To properly evaluate the impact
    a new feature will have, it’s important to consider both aspects.


    A feature’s value is usually quite obvious—namely, what it allows your users to
    do.


    But the cost of adding a new feature to your product might not be readily apparent:
    the additional complexity might take a toll on people who aren’t interested in
    using the feature. Adding a new feature to your product prevents you from working
    on other things, and having it in your product might slow down future progress
    because you have to maintain yet another feature. A feature that relies on systems
    you can’t control, or that is error-prone for other reasons, might lead to rising
    costs in user support.


    Consider the cost of a feature, rather than just its benefits.


    # 24.6 Make It Invisible


    If you can add a useful feature in a way that does not add to the user’s “cognitive
    load,” do it. Invisible features are the best, because they make your product
    better without making it more complex. Can you improve text rendering so documents
    created with your product look better than documents created with your competitor’s
    product? If you add HTTPS support to your web application, can you just switch
    your users to HTTPS and make them more secure without forcing them to enable the
    new feature manually?


    These features make your product better, but people don’t have to consciously
    deal with them.


    # 24.7 Provide an API and a Plug-in Architecture


    You don’t have to implement every feature on your own. Often, it makes sense to
    let others chip in and help. Twitter, for example, started out with an extremely
    simple service. But its API³ allowed other developers to step in and create a
    whole ecosystem of great products that revolve around Twitter. Photoshop is another
    great example. Although


    3. An application programming interface (API) allows developers to create applications
    that interact with your product.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Adobe has added an incredible number of features to Photoshop, it couldn’t
    possibly implement every feature that its customers might want. Instead, Adobe
    allows third-party developers to create plug-ins for Photoshop, thus broadening
    the market for the product without investing any of their own money or making
    Photoshop even more complex than it already is.


    By adding an API and a plug-in architecture, you can avoid implementing features
    that will help only part of your audience, leaving that to other developers. You
    could even use your own plug-in architecture to implement new features yourself.


    # 24.8 Listen to Your Users


    It’s important to keep in mind that you are not your users. At most, you are one
    of your users; one user typically constitutes a minority of all users. You may
    think that a new feature sounds extremely useful, but chances are that many of
    your users disagree. This disconnect is sometimes called the internal-audience
    problem: the people who design and implement solutions do so for people who are
    like them, rather than for people who are like their actual customers.


    You know too much about how your product works and too little about how people
    use it. Your users, on the other hand, know a lot about how they use your product
    but very little about how it works.


    It’s often tempting to add what amounts to useless complexity. You understand
    how your product works, so it doesn’t seem complex to you.


    It is always smart to run new feature ideas by your users. Note that people are
    often reluctant to provide negative feedback, so it’s important to show them simple
    draft sketches, rather than actual implementations. This gives the impression
    that you’re not yet heavily invested in the idea so they are less reluctant to
    burst your bubble. It also helps to explicitly ask for negative feedback, saying,
    for example, “Tell me three things you don’t like about this new feature.”


    You might be surprised by your users’ reactions—I know I’ve been surprised whenever
    someone has told me that a proposed new feature sounded really cool but that they
    saw no reason to ever use it.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 24.9 But Don’t Listen to Your Users Too Much


    Writing about the people who still tell him that the Mac version of Microsoft
    Word 5.1 was the perfect version of the product,⁴ Microsoft’s Rick Schaut points
    out that if you ask these same people what they really want in a word processor,
    they almost always require at least one unusual, additional feature. It’s not
    just “Word 5.1,” it’s “Word 5.1 plus one feature.” But everybody has a different
    “plus one” feature, and if you add all of these additional features, Rick notes,
    you eventually arrive at the feature set of a modern Word version.


    When your users envision your product, they envision a product that is tailor-made
    for them, a product where the features the product offers are exactly the features
    they use. This often includes one or two specific, quirky features that almost
    nobody else uses.


    If you add most of the “I just need one unusual feature” requests, you end up
    with a product where most features are unusual and very few features are used
    by many people. This works well for Microsoft, but it’s not necessarily a good
    idea for your product.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_210_0.png)


    WHAT YOUR USERS ASK YOU TO DO: A BASIC APPLICATION, PLUS JUST ONE UNUSUAL FEATURE.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_210_1.png)


    WHAT THEY GET IF YOU ACTUALLY LISTEN TO THEM: A TON OF UNUSUAL FEATURES WITH A
    BASIC APPLICATION BURIED SOMEWHERE BENEATH THEM.


    Recent research by Debora Viana Thompson, Rebecca W. Hamilton, and Roland T. Rust
    has shown that, when asked, most users say that they prefer products with more
    features. People think that they might


