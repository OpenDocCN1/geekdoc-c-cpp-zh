- pgno: 235
  md: '# Why “Guerilla”?


    Ostensibly, it’s called *guerilla usability testing* because, analogous to guerilla
    warfare, it circumvents many of the tools and techniques of traditional usability
    testing in favor of a simpler, less people-intensive approach that relies heavily
    on mobility and on the element of surprise. However, I think, it’s mainly called
    guerilla usability testing because we programmers and designers like to make our
    jobs sound much more badass than they really are. Hi there, Code Ninjas and Rock-Star
    Designers!


    # Are There Any Prerequisites?


    Yes. You need to have running code, and at least part of your user interface needs
    to be working. You also need to be able to run your product on a portable device,
    such as a notebook, cell phone, or iPad.


    # Guerilla Style


    In a typical usability test, you invite people to come to you. You sit them down
    in front of a specially prepared workspace and ask them to do specific tasks while
    you record their actions. You then use the information gleaned from this interaction
    to improve your user interface.


    This kind of testing involves quite a bit of preparation. You need to set up a
    workspace and devise a way of recording your testers; you need to find testers,
    schedule them, and maybe also pay them for their participation.


    As usability testing became more widespread in the software community, people
    developed a set of techniques that circumvent all the process issues. This is
    commonly known as *guerilla usability testing*.


    The main difference to a regular usability test is that we go to testers, instead
    of having them come to us.


    # 27.1 How Often to Test


    Guerilla testing is simple, requires almost no preparation, and can be done pretty
    much at any time. As a result, it’s often a good idea to do guerilla testing when
    you actually have a question you need answered.'
