- pgno: 63
  md: '# 8.1 Designing Hierarchies


    In the previous chapter, we saw that products are often organized using hierarchies.
    Here’s another example.


    Open any website, and it’s likely to be arranged in a hierarchy. Let’s say your
    laptop’s internal camera doesn’t work anymore, and you need help. You open the
    manufacturer’s website in your browser. Where do you go to find help? If your
    computer is from a big electronics manufacturer, you probably start by clicking
    “Computers” and then “Notebooks.” Here you’ll see a list of laptop lines from
    your manufacturer. Clicking the proper line of notebooks should take you to a
    list of laptop models, and you should be able to find yours in that list. On the
    page for the specific model, you’ll probably look for “Support.” Ideally, this
    will show a support page for your model, with a number of potential laptop issues.
    With some luck, you’ll find your problem (and a solution to it) in that list.


    Here’s the path you took through the site’s hierarchy:


    Computers → Notebooks → Notebook Line → Notebook Model → Notebook Model Support
    → Answer to a specific question


    But that’s not the only way you could have arrived there. You could also have
    gone straight to the Support section of the website. The question is, if you are
    designing this website, how do you know what path the user will take? And how
    do you know where people expect to find the individual pages of your site?


    # Card Sorting


    A common way of finding answers to these questions is to use card sorting—a great
    way to determine where people expect to find things. Card sorting is really easy.
    In her book *Card Sorting: Designing Usable Categories* [Spe09], Donna Spencer
    explains that “at its core, card sorting is a pretty simple technique—write things
    on index cards and ask people to sort the cards into groups.”


    Of course, there are nuances, so let’s look at some of the details of how to do
    this.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_64_0.png)


    # 8.2 Preparing for a Card Sort


    To prepare for a sort, you simply take a bunch of index cards and put the things
    you need to sort on them. For example, if you’re structuring a website, you represent
    the individual pages or areas of your website as the individual cards to sort.
    If you’re structuring an application, you use the names of features, properties,
    menu items, commands, windows, tasks, goals, or visible elements as your cards.


    It sometimes makes sense to pick things that are roughly on the same level in
    your product: don’t mix terms that are high up in the hierarchy with terms that
    are far down in the hierarchy. Instead, do multiple card sorts to get information
    on different levels of the hierarchy.


    It’s best to use terms that are obvious and easily understandable. If you absolutely
    can’t avoid using jargon, explain the meaning before the card sort, and allow
    participants to substitute their own terms.


    When coming up with words to use in the card sort, you need to make sure they
    can’t be grouped on the basis of superficial similarities, such as how the words
    look or sound. The risk of picking words that look or'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'sound similar is that people may group them based on that similarity, rather
    than on their meaning.¹


    You should end up with anywhere from twenty to eighty cards. If you have fewer
    than twenty, then you’re probably not thinking hard enough. If you have more than
    eighty, then you might overwhelm your participants.


    Also prepare some empty cards.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_65_0.png)


    Since people might write on cards during a card sort, or otherwise alter them,
    and since you’ll want to do more than just one card sort, making multiple card
    sets by hand is often too time-consuming. Instead, it’s easier to print cards
    out and cut them up.


    # 8.3 Participants


    You can do each card sort with one person at a time or with several people at
    once. Both have advantages. Having more than one user in one session can be harder
    to schedule, and one person typically dominates the process anyway. On the other
    hand, having multiple participants may create conversations that offer valuable
    insights into how people think about these things.


    If you go with multiple participants, be careful not to overdo it. More than three
    or four people typically won’t be able to participate in a card sort at the same
    time.


    1. Jakob Nielsen talks about this problems and offers solutions for it at http://www.useit.com/alertbox/word-matching.html.'
