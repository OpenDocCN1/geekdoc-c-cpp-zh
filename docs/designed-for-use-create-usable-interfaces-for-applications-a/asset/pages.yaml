- pgno: 242
  md: '# 28.3 How Many Testers


    Jakob Nielsen famously wrote that only five users are needed to find almost all
    the usability problems that a larger group would have found.² But even testing
    with such a small group takes a lot of work. Remember, our goal is to spend only
    half a day each week. Finding five testers, scheduling them so they can all come
    in on the same day, making sure somebody takes care of them if they come too early
    or too late, preparing all the paperwork five times—you can’t do that in half
    a day.


    Instead, you can get useful results by doing only one test with only one person
    each week.


    Before covering the reasons for testing a single user, let’s look at the arguments
    against it. Nielsen points out two of the disadvantages in his essay.


    For one, you won’t have anybody to compare that one person’s results to. If you
    test with five people, it’s easier to identify the pressing problems because more
    than one person will stumble upon them. Usually, you can make a reasonable guess
    as to the importance of a problem even when testing with only one person—but not
    always. However, that’s not a huge problem; since you’re going to test your design
    each week, you can just ignore problems if you’re not sure they’re urgent. The
    urgent problems will pop up again pretty soon.


    Another problem is that your test preparation yields only one test result, which
    is especially problematic when running more extensive tests that require more
    preparation. A pretty big investment can result in a pretty meager outcome. If
    the plan is to run extensive usability tests that require a lot of preparation,
    then you need to test with more people. However, the kinds of tests introduced
    in this chapter do not require a lot of preparation.


    So, there are disadvantages. Fortunately, testing with only one person also comes
    with clear advantages:


    +   - It’s easier to find testers since you have to find only one person at a
    time.


    +   - It removes the overhead of trying to match the schedules of several people.
    It’s usually easy to find a date that works for two people: the designer and the
    tester. Trying to get an additional person to'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'show up on the same day significantly increases the complexity. There''s a
    reason why most people that we make appointments with have waiting rooms in their
    offices: scheduling people is hard, and it usually doesn''t work out properly.


    Even if you manage to find a date that works for everybody, you will run into
    problems during the test. With just one user, you can let the test session run
    a bit longer than expected; if somebody else is waiting, you''ll have to stop
    the test when the allocated time is up.


    +   - If you have only one user, it''s easy to run the whole thing by yourself.
    If you have more than one user, you might need somebody who can help take care
    of the people who are waiting and who can welcome people who arrive while you''re
    in a test.


    Of course, given sufficient time, budget, and helpers, testing with three to five
    users offers more insight than testing with only one. But don''t let a lack of
    time and budget prevent you from doing usability tests.


    (Note that this restriction does not apply to guerilla-style usability tests introduced
    in the previous chapter. If you go to your testers instead of having them come
    to you, the issues with doing multiple tests essentially disappear. In those cases,
    I recommend doing more than one test at a time.)


    # 28.4 Who Should Test Your Product?


    Unless you are designing a product that targets a very specific group of people,
    who you invite for usability tests typically doesn''t matter much. And even if
    you do target a particular group, it still makes sense to test with people from
    outside of that group as well. There are two reasons for this.


    One is that people are surprisingly consistent in how they behave. If you have
    big problems in your design, you''ll probably find them regardless of who you
    recruit as a tester.


    The other is that even if you target specific groups of people, the members of
    this group may not be entirely homogeneous. Certain people will be more experienced
    with the topic than others. By intentionally picking testers from a specific group
    of people, you could miss design issues that affect less experienced members of
    the target group. For example, say you''re testing a product used in a hospital.
    If you test'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'only with people who already work at that hospital, you will get testers who
    are familiar with the hospital''s processes and all the related medical jargon.
    However, new hires at that hospital may not be familiar with these things and
    may encounter usability issues that nobody in your test group did. So although
    it makes sense to include people from your target audience, you should never limit
    your testers to people from that group.


    The same applies to existing users or people who have already participated in
    usability tests for a specific product. If you are designing an update to a product,
    it often makes sense to do a subset of your tests with people who have some familiarity
    with your product. These people may have learned specific behaviors that cause
    them to navigate your user interface differently from novice users. Focus on testing
    with people who don’t bring any preconceptions to the test but do include some
    tests with existing users.


    When it comes to testing, one thing that can matter a lot is cultural background.
    Symbols and colors mean different things to people from different parts of the
    world. For example, Japanese video games often indicate victory by displaying
    a huge red ring, which kind of looks like a stop sign. Although this indicates
    winning to Japanese audiences, it typically conveys the opposite message for Western
    audiences.


    If you’re expecting a lot of people with different cultural backgrounds to use
    your product, it makes sense to reflect this diversity with your testers.


    And finally, although this book doesn’t cover accessibility,³ I will mention here
    that it often makes sense to do usability tests with people with poor eyesight,
    with older people, and generally with people who have disabilities that might
    affect how they can interact with your product. Doing this can help uncover accessibility
    issues that would have gone unnoticed.


    The main point remains: don’t spend too much time trying to recruit testers from
    a specific demographic. Most of the time, people will find the same kinds of usability
    issues, regardless of their background.


    3. If you’re looking for information on accessibility, check out Mark Pilgrim’s
    "Dive Into Accessibility" at http://diveintoaccessibility.org, and Joe Clark’s
    website at http://joeclark.org.'
