  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_36_0.png)


    # Chapter 4


    # Activity-Centered Design


    So far in this book, we''ve assumed that human-centered design processes are always
    a good idea. The fact is, they are not always the best idea. Another approach
    is to make activities the center of your design process. For many products, this
    makes more sense.


    In human-centered design, the idea is to get a deep understanding of the people
    who are going to use your product and design something that is tailor-made for
    them. In activity-centered design, products are tailor-made for activities or
    goals.


    This isn''t really a new idea; most design is activity-centered. A door handle
    is not designed for a specific audience; it''s designed to make the activity of
    opening a door as easy and obvious as possible. The steering wheel of a car, the
    buttons in an elevator, probably most of the applications on your computer, and
    a majority of the websites you use on a regular basis—each is designed to make
    a specific activity, or a number of activities, as easy and obvious as possible.


    An activity-centered design process may not be the perfect solution for all projects.
    Sometimes, you want to create a product that is optimized for a limited audience.
    Compare, for example, the two computer mice shown in Figure 4.1, on the next page.


    The mouse on the left is the one that ships with Macs. It is designed with the
    widest possible audience in mind. The person who touches a mouse for the first
    time should be able to use it just as easily as somebody with twenty years of
    computer experience. To that end, in its default configuration, it has only a
    single button, and that single button can be activated by pushing down anywhere
    on the mouse.'
  merge: -1
  img_proc: true
