  md: 'idiosyncrasies or even errors. Still, contextual interviewing gives us a useful
    overview of the things people do and potential areas where improvements are possible.
    Also, by doing interviews with several people, we can figure out much of the missing
    or misreported information.


    # 2.4 Remote Shadowing


    If visiting people is out of the question, you can ask them to start their screen-recording
    software, let it run for half a day or so while they work, and then have them
    send you the resulting movie. At first, this sounds like it would create immensely
    large movie files. Fortunately, there are a few factors working to our advantage:


    +   - You can record at a low frame rate. In almost all cases, a frame rate of
    one or two pictures per second is plenty to tell you what the user is doing.

    +   - You don''t need to see all the details, so you can scale the image down
    to about 30 percent of the screen''s full resolution and use a strong compression
    setting.

    +   - You probably don''t need sound at all.

    +   - Most of the time, only small parts of the screen change while people are
    working, so the resulting movies typically compress well. But do tell people to
    turn off their screensavers, especially if they are using visually complex ones.


    Using these guidelines, recording a screen for four hours can compress down to
    a file size below 100MB while still yielding perfectly viewable results.


    Alternatively, if that is not an option, send them a video camera, and have them
    set it up behind their workplace. That way, they can simply return the camera
    to you once they''ve finished recording.


    Fast-forwarding through this movie can give you a pretty good idea of the kinds
    of things people do. Then, you can get back to them with specific questions.


    # 2.5 Limitations of Contextual Interviews


    Humans can do something almost no other animal can: they can imagine themselves
    in hypothetical situations. In his book Stumbling on'
