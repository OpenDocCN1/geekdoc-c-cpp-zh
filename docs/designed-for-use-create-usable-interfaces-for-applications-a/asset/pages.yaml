  md: 'body else uses and understands these words. People know what a podcast is,
    what a blog is, and what to expect if an iPhone app has the word Lite after its
    name. Just use the words people understand, even if you don’t like these words.
    As former Guardian science editor Tim Radford puts it,12 “No one will ever complain
    because you have made something too easy to understand.”


    Keep in mind that the people who read your text probably use different words than
    you do. If you know your audience, write for it. Your audience may have an age
    range, skill level, or domain knowledge that is different from the average person.
    Taking these things into account when writing text will make it easier for your
    audience to read and understand your text.


    But above all, just keep it simple. In On Writing [Kin00], Stephen King explains
    that “one of the really bad things you can do to your writing is to dress up the
    vocabulary, looking for long words because you’re maybe a little bit ashamed of
    your short ones.” His rule of thumb: “Use the first word that comes to your mind,
    if it is appropriate and colorful. If you hesitate and cogitate, you will come
    up with another word—of course you will, there’s always another word—but it probably
    won’t be as good as your first one or as close to what you really mean.”


    Now, King is talking about writing novels. But then, why shouldn’t your writing
    be just as engaging and interesting as a Stephen King novel?


    # 6.10 Test Your Text


    Since text is part of your user interface, you can test text as part of a regular
    usability test. But that’s not all you can do. Usability expert Angela Colter
    encourages also testing your text using a Cloze test.13


    In a Cloze test, you remove some of the words of your text and then ask test participants
    to find the missing words. A sample is shown in Figure 6.1, on the next page.


    Colter suggests picking sample text from your product that is between 125 and
    250 words and then removing every fifth word. Ask participants to fill in the
    missing words. Calculate the test score by dividing the number of correct answers
    by the total number of removed words.'
