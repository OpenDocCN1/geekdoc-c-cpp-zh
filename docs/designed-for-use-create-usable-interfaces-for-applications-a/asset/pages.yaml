- pgno: 120
  md: 'programmer imbued it with. For this reason, making an application or a website
    look and behave like a real-world object can be a good idea. That congruity helps
    people understand how things work—it tells them that the same laws that govern
    the real world also apply to products. It helps people understand what possibilities
    a user interface element offers.


    Realistic details can help communicate possible actions (also called *affordances*,
    as discussed in Section 9.5, *Principle 7: Affordances*, on page 90). The closer
    the product is to reality, the easier it is for the user to figure out how it
    is supposed to work and to form a correct mental model for using the product.


    However, if you''re not careful about how you use realism, you can also create
    confusion.


    # 12.1 Symbols


    Many of the visual elements in a modern user interface are meant to stand for
    actions or ideas. The little pencil isn''t meant as a literal representation of
    a physical pencil; it represents the idea "edit." The stop sign isn''t there as
    a signal to stop a car; it''s meant to alert you to a potential problem.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_120_0.png)


    What do you suppose this button is trying to convey?


    Without any context, users can''t be sure, but a likely explanation would be that
    they need to activate the button to take a picture.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_120_1.png)


    What about this button?


    Clearly, trying to make the button''s camera look more like the actual object
    doesn''t make it easier to figure out what the button means. In fact, when it
    comes to determining what the button does, the extra detail might just increase
    the user''s confusion.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_120_2.png)


    In his book *Understanding Comics* [McC94], cartoonist Scott McCloud points out
    that adding details to an image makes it less universal. The button with the realistic
    camera doesn''t "mean" anything; it depicts a'
