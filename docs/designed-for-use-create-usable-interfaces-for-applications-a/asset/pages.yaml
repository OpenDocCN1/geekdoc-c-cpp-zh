    test itself is going to work.


    What happens next depends on the type of test.


    # Moderated Tasks Tests


    You start by explaining how moderated tasks tests work. This includes pointing
    out that while the tester is welcome to ask questions, you may not always be able
    to respond.


    Then you turn to the computer (or device). Before you initiate the test, the computer
    should be in a neutral state. You start your product (if it''s a website, by entering
    the URL into the browser''s address bar; if it''s an application, by launching
    the application) and hand over control to the tester.


    The first thing you want to know is whether the tester can figure out what the
    product is, so you start the test by saying something along the lines of this:


    Take a look at this website. Feel free to scroll around. What kind of service
    do you think this website offers?'
