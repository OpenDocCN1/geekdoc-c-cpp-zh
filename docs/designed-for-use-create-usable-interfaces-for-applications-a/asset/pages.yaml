  md: 'make a note and ask after the task is done. If the tester has a question, just
    reply in a noncommittal way:


    How would you deal with this question at home, if you were alone?


    After the last task, ask any remaining questions, ask the tester to give feedback
    on how the test was run, and thank your tester for his time. Make sure to end
    the test on a positive note.


    # Unmoderated Tasks Tests


    Moderated tasks tests pose a bit of a problem. That problem is us. As facilitators,
    we have to stay with the tester during the test, so we are very likely to influence
    her in subtle ways, even if we do our best to avoid doing so (for more on this,
    see Chapter 31, How Not to Test: Common Mistakes, on page 268).


    Facilitators can also make people anxious; we probably wouldn''t like it if somebody
    was constantly looking over our shoulder and making notes about everything we
    are doing, either. Finally, testers often subconsciously try to please the facilitator,
    so if we''re sitting right next to them, they will be more likely to keep trying
    until something works.


    The simplest solution to this problem is to take ourselves out of the equation.


    In an unmoderated tasks test, you introduce the tester to the test, hand him a
    list of tasks on a sheet of paper, start recording, and leave him alone.


    The one obvious problem with this approach is that you can''t easily intervene
    when the tester gets stuck. At the beginning of the test you need to explain what
    to do if this happens. Depending on your equipment, there are different ways of
    dealing with this. If you''re doing the test in a usability lab furnished with
    a two-way mirror, the question is moot; you''ll be observing the test, and you''ll
    be able to communicate with the tester.


    If you''re doing the test in a place where communication is impossible, you could
    say something like this:


    If you get stuck on one of the tasks, don''t worry. This is exactly the kind of
    thing we''re looking for. Feel free to keep trying for a bit, but as soon as you
    get bored or think you can''t figure out how to continue or that there''s a problem'
