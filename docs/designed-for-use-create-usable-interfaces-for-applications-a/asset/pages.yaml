- pgno: 98
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_98_0.png)


    # 10.5 Wireframes


    Wireframes represent the exact structure of a screen but without the decoration—no
    colors, shadows, or pictures. Wireframes are about the content. What do you want
    to show on each screen, and where do you want to put it? How big should things
    be? How close to each other should they be? Figure 10.1, on the following page
    shows a sample wireframe (on the left).


    This is also the time when you start working on the copy. You don’t need to get
    this exactly right yet, but you should think about text you want to include and
    where to put it.


    The goal of wireframes is to identify exactly what you need to show on each screen
    and where you want to put things. Once you’ve done this, you can move on to decoration.


    # 10.6 Mock-ups


    Wireframes tell you about the layout of a screen. Mock-ups add the decoration,
    or visual details: shadows, textures, images, transparency. This is how you want
    the screen to look based on your current knowledge. Compare the mock-up in Figure
    10.1, on the next page (on the right) with the wireframe (on the left).


    Adding visual details is not just about making your product look pretty. Of course,
    the goal is for the end product to look good, but visual design can also give
    the user hints about the functionality of your product. User interface designers
    often call these *affordances*. I’ll talk more about this in Section 9.5, *Principle
    7: Affordances*, on page 90. For now, here are some examples of affordances: textures
    to let the user know that he can touch and drag something, shadows and bevels
    to show'
