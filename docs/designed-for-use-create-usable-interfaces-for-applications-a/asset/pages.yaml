    prefer to have the list at the top of the view.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_185_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_185_1.png)


    In reality, there is one solution that works best for most people. It’s your job
    to find that solution. You can do usability tests with different configurations
    of your product and see which one really works best. Your users can’t.


    Fourth, leaving the choice up to the user also means you’ll have to support several
    different ways of using your product for the rest of its lifetime. If you pick
    one of the options instead of leaving it up to your users, you won’t have to spend
    time working on the other options; you’ll have more time to make the one option
    you chose as good as it can possibly be. And when problems do occur, preferences
    make it harder to track them down. Every pointless preference increases the possible
    code paths in your product. The more ways your users can change how your product
    behaves, the harder it becomes to replicate problems and to provide timely help
    if something goes wrong.


    # 21.2 How to Avoid Preferences


    Say no to your users (and have a look at Chapter 24, Avoiding Features, on page
    205). Some people might really like a smaller font size. Perhaps they’ll even
    send you email, asking you to let them change the font sizes. But that doesn’t
    mean that adding a preference for font sizes is really the best course of action.
    You may make some of your customers happy, but you’ll inconvenience everybody
    else, and you’ll be forced to support windows with different font sizes.


    Say no to yourself. Maybe a preference sounds really good. Often, it’s the easiest
    way out. By simply making something a preference, you don’t have to make that
    choice yourself. But you’re doing your users a disservice. Remember way back in
    the beginning of the book (in Chap-'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'ter 3, *Personas*, on page 30), when we talked about your users? For every
    preference, ask yourself: How does this help my users? What goal can this preference
    help my users reach that they couldn’t reach before? If you can’t come up with
    an obvious answer, dump the preference.


    *Be consistent.* If you can’t decide between two choices and your users might
    have used similar products, be consistent with those products. Your users can
    then apply their existing knowledge to your product.


    *Run a usability test.* If there are two solutions to a problem and you’re not
    sure which way to go, create paper prototypes and test them (see Chapter 11, *Paper
    Prototype Testing*, on page 104). Or implement both, and run an A/B test (see
    Chapter 33, *A/B Testing*, on page 279). The feedback and data you get from such
    tests may even help you come up with a new idea that is better than the options
    you came up with originally.


    *Have opinions.* If there are two equally valid ways you could go with, go with
    the one you like better. Which one would *you* prefer to use? It’s OK to have
    opinions. If you try to please everybody, you will excite nobody.


    *Have implicit preferences.* Rather than letting users set behavior explicitly,
    remember what they did the last time. Don’t let users set the default window size;
    simply use the window size from the last time they resized a window as the default
    window size. Don’t let users set their preferred protocol in a file-sharing application;
    simply default to the protocol they used the last time, and let them change it
    if necessary. Don’t let users set whether they want to see a “new document” or
    an “open document” dialog when they open an application; simply reopen the files
    from the last time they used the application.


    # 21.3 If You Can’t Avoid Preferences


    If you truly can’t avoid preferences, make sure that the default choice for each
    preference works well for a majority of your users. Most people stick with the
    default values and never change them. Usability expert Jakob Nielsen points out:²


    > Many previous studies, including my own, have shown that the top few entries
    in search listings get the preponderance


    2. See the full article at http://www.useit.com/alertbox/defaults.html.'
