  md: '# Chapter 5


    # Time to Start Working on

    Documentation


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_39_0.png)


    # What’s the Technique?


    In this chapter, I’ll talk about manuals, blog posts, screencasts, press releases,
    and similar things. Broadly put, this is about stuff that will get people interested
    in your product and will help people learn how to use your product. Starting to
    work on this at the very beginning of your development process is sometimes called
    *working backward*.


    # Why Is This a Good Idea?


    Creating documentation as early as possible will help you evaluate your designs.
    If you can’t easily explain something, there’s a good chance that it is not designed
    well.


    Starting work on the manual during the design process also means you’re less likely
    to regress into jargon and more likely to explain things from a user’s point of
    view. The longer you work on something, the harder it gets to explain it to people
    who don’t share your knowledge.


    # Are There Any Prerequisites?


    Yes. You should have a general idea of who your audience is and what kinds of
    problems your product will solve.'
