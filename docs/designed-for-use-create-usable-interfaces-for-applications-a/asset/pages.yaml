  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_202_0.png)


    This reassured users that something substantial had happened. User experience
    consultant Harry Brignull refers to a similar story⁴ about coin-counting machines.
    Supposedly, the machines counted coins so quickly that customers did not trust
    that they could have counted them correctly. To fix this user experience problem,
    the manufacturer changed the machines to display the results more slowly and added
    speakers to produce coin-counting sounds while the machines waited for the counter
    to get to the final amount. As a result, people felt that the machine put the
    proper effort into counting their money and trusted the result.


    # Takeaway Points


    +   - Responsiveness and speed are extremely important properties of your products.
    Usability tests don’t always reveal these kinds of problems.

    +   - To be perceived as instant, actions should take less than 0.1s.

    +   - Actions taking more than a second should show some kind of indicator that
    the application is working. This should appear where the user’s focus is.

    +   - Perceived speed is more important than actual speed. Sometimes, tricks can
    help you make your product *feel* faster.

    +   - It’s possible for things to happen *too* fast. In some cases, artificially
    limiting the speed of some features of your product can improve the user experience.


    4. View the article at http://www.90percentofeverything.com/2010/12/16/adding-delays-to-increase-perceived-value-does-it-work/.'
