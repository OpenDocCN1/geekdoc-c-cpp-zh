  md: '# Input Errors


    Another common example of “user errors” occurs when products don’t clearly explain
    what they expect users to do, for example in overzealous and nonobvious form data
    validation schemes:


    Birth Date:

    Credit Card Number:


    It’s not clear what format the product expects for the date and credit-card number.
    As a result, users will try to enter all kinds of different formats. This often
    doesn’t work properly.


    Birth Date: August 28th, 1979

    Error: Please enter the date using the following format: MM/DD/YYYY

    Credit Card Number: 4111 1111 1111 1111

    Error: Enter number as XXXX-XXXX-XXXX-XXXX


    Apps and websites either should explicitly state what they expect the user to
    do (for example, by entering example data into the fields) or should be liberal
    in the kinds of user input they accept.


    Another way of solving this problem is to provide a user interface that doesn’t
    leave the input format up to the user. For example, rather than asking people
    to enter a date into a text field, the user interface could show a calendar.


    ICAL ONLY LETS YOU CHANGE ONE NUMBER AT A TIME, MAKING SURE THE FORMAT IS ALWAYS
    CORRECT.


    WINDOWS USES A CALENDAR THAT LETS YOU PICK A DATE BY CLICKING ON ITS DAY AND ONLY
    USES TEXT ENTRY FOR THE TIME OF DAY.


    THE IPHONE USES A DATE ENTRY INTERFACE THAT AVOIDS TEXT ENTRY BY THE USER ALTOGETHER.'
