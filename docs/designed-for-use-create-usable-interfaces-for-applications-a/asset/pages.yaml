- pgno: 40
  md: '# 5.1 The Manual


    Many products come with some type of manual that explains how to use the product.
    Most manuals are pretty awful, which is bad, because people tend to open the manual
    when they can’t figure out how to use a product. In other words, they’re already
    annoyed and unhappy, and then they get to slog through a distressingly crappy
    manual.


    Manuals don’t have to be crappy. But creating a great manual means giving it high
    priority. And that means starting to think about—and work on—the manual early
    on.


    During the design process, your brain is still free of implementation details.
    This helps you see the manual from the point of view of the user, who also doesn’t
    have a clue about all the technical minutiae that makes your product tick.


    Starting to work on the manual early has another benefit: it forces you to explain
    how your product works. Few things make you think about the details of your design
    quite as much as having to describe how to use it; if something is hard to explain,
    it’s probably hard to use and in need of rethinking.


    So, how do you go about writing a manual?


    Look at the manual as part of your product. A great manual is a useful feature;
    maintain it the same way you maintain other features. (If you’re writing code
    as well as the manual, check the manual into your version-control system.) Design
    the manual the same way you design any other feature of your product. Ask yourself
    these questions: How will people use the manual? How should the manual be structured?
    What should be included?


    Your product’s manual shouldn’t be an afterthought. It’s an important feature
    of your product and deserves the same attention you give to any other important
    feature.


    # 5.2 Blog Posts


    Manuals are important, but they are not the only way you can talk to people about
    your product. In fact, some products don’t have manuals at all.


    Blog posts are another important tool for communicating what your product can
    do, and like manuals, they have two advantages: they help'
