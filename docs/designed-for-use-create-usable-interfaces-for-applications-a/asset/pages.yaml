    Will I write the *plan* by the end of the month, or is the plan to *finish the
    book* by the end of the month?


    If your text requires less thinking on the readers'' behalf, they are more likely
    to read it and get something out of it.


    Clarity is especially important for titles. Start titles with relevant words so
    people still get the meaning of the title, even if they view it on a device with
    a small screen that cuts off words at the end of the title.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_50_0.png)


    # 6.7 Talk Like a Human, Not Like a Company


    Companies often use style guides to enforce a consistent tone throughout all of
    the company''s content. Writers are encouraged to use the third person and a neutral
    tone. As a result, they are discouraged from letting their personalities show
    through in their writing.


    Unfortunately, such guides encourage text that is boring and bland. People don''t
    want to read that, and it can be a soul-crushing experience for the people who
    have to *write* the text.


    If you focus on consistency, you''ll bring everybody down to the level of your
    worst writer. It''s better to focus on engaging your readers. Address them directly.
    Write sentences that would sound natural when used in a conversation. Be informal.
    Talk to the reader. Avoid marketing buzzwords. Say "you" and "we" when it works
    (although avoid that overly patronizing "we" you sometimes hear when adults talk
    to children).'
