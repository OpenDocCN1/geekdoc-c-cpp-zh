- pgno: 18
  md: '# Chapter 1


    # User Research


    When designers talk about their design process, they usually mention that it is
    “human centered” or “user centered.” In a very vague sense, this means they are
    constantly thinking about the people who are going to use their product and trying
    to create the best possible product for these people.


    But how do we do that?


    This question is more difficult to answer than it seems, but the answer generally
    starts with user research.


    How do we find out what goals people have, and how we can solve these goals? The
    most obvious answer would be to simply ask them. Although this can sometimes lead
    to useful information, we need to be careful when evaluating such opinions.


    > Henry Ford is quoted as saying, “If I’d asked people what they wanted, they
    would have said faster horses.” And why shouldn’t they answer in this way? Most
    people are not product designers. They don’t spend a lot of time thinking about
    where their issues are (such as that they constantly have to care for their horses)
    and how a new product could solve these issues. They just work around the issues
    (by building stables for their horses and hiring people to care for them) and
    then promptly become blind to them. Rather than asking for something different
    that actually fixes their problems, they ask for the same thing that’s slightly
    better.


    As a result, people often aren’t able to tell us how we can solve their problems.
    Worse, people may not even be able to tell us what their problems are. And worst
    of all, people are pretty bad at predicting whether and how they would use a product
    if we proposed to build it for them.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Focus Group


    The term *focus group* describes a kind of user research in which a brand, a service,
    a new design, a device, or a similar product is shown to a group of people and
    the group’s subjective reaction and opinion are recorded. The goal is to use this
    data to predict the general public’s response to the product.


    Take the Atari Lynx, for example. Back in the early 1990s, the Japanese video
    game company Nintendo owned the handheld gaming market with its Game Boy.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_19_0.png)


    Almost every kid had one, and those who didn’t were adding it to their wish lists
    and eagerly waiting for their birthdays to arrive. Atari, a competing video game
    company, wanted in on the action.


    After talking to focus groups, Atari decided to go with a console that was much
    more powerful than Nintendo’s title gray device. Atari put a color screen and
    a faster processor into its device and called it the Lynx, clearly trumping the
    comparatively puny and punily named Game Boy. Atari also went with a huge case
    for the device, because people in the focus groups said they preferred a larger
    model.


    The device bombed. Nobody wanted a Lynx.


