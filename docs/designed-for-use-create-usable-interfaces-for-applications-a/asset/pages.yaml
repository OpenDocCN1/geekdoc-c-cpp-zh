- pgno: 86
  md: '# Principle 4: Flexibility


    Let users perform actions in any order, using different techniques if possible.


    In modern word processors, users can switch to the different styles they want
    to use for different parts of a document while they’re typing. Or they can type
    all of their text first and then go through the document and apply different styles.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_86_0.png)


    # Principle 5: Feedback


    Always give immediate, useful feedback to user interactions. If the user clicks
    something, it should highlight immediately. If she drags something, it should
    move in line with her mouse or finger, without any lag. If she initiates an action
    that takes a bit of time, show an activity indicator such as a progress bar to
    inform her that the computer has received her command and is working on it (there’s
    more about this in Chapter 23, Speed, on page 198).


    Getting immediate feedback helps people correct flaws in their mental model and
    builds trust in their own actions when their mental model is correct.


    Figure 9.3, on the next page shows two pictures of different buttons used in trams
    in Zürich. You push them when you want the tram to stop. The one on the right
    lights up once pushed; the one on the left doesn’t. While riding trams in Zürich,
    you will often notice people repeatedly pushing the button in the style shown
    on the left, just to make sure that their push was really registered; there’s
    no obvious feedback that it was. You rarely see that with the one on the right.


    Of course, it’s possible to overdo things. Buttons in some trains use a scheme
    with different colors, one to indicate that the button can be pushed (which activates
    only shortly before the train stops) and one'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_87_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_87_1.png)


    LACK OF FEEDBACK MAKES IT HARD TO LEARN HOW EXACTLY THE BUTTON WORKS AND TO TRUST
    THAT IT WORKS AT ALL


    THE BUTTON LIGHTS UP ONCE PRESSED. THIS IMMEDIATE FEEDBACK MAKES IT EASY FOR THE
    USER TO LEARN HOW IT WORKS


    Figure 9.3: Push these to stop a tram


    to indicate that it has already been pushed. Since people can never remember which
    color is which, they tend to push the button several times, just to make sure
    it has switched to the correct state. Adding some feedback helps people form correct
    mental models. Adding too much or unclear feedback can cause even more confusion.


    # Principle 6: Safety


    User actions should not be harmful, unless the user intends them to be. Closing
    a document with unsaved changes should not destroy those changes without giving
    the user the opportunity to get them back. Always allow users to undo their actions
    (see Chapter 19, Instead of Interrupting, Offer Undo, on page 171). Give them
    the freedom to explore without fear of permanent harm, and they''ll be more open
    to learning and to adapting their mental model to how your product works.


    For example, if someone closes a window containing several tabs in Google Chrome
    and then decides that she really needs to get some of those tabs back, she can
    simply restore the closed window using the History menu.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Assuming Causality


    People tend to assume causality when things happen at the same time or close to
    each other. If B happens right after the user does A, he will often conclude that
    A caused B. Although you can use this causality element as a way to help people
    form correct mental models, keep in mind that this can easily create incorrect
    mental models.


    This issue often appears in troubleshooting behavior; if something doesn’t work
    and the user does something in an attempt to fix it and then it works, it’s natural
    for the user to assume that what he did fixed the problem. After all, the user
    doesn’t know whether it would have worked if he hadn’t done anything.


    In Switzerland, you often see people scratching coin-operated machines with coins
    the machine didn’t accept on their first attempt:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_88_0.png)


    Since the coin is usually accepted after scratching the machine, it’s natural
    to assume that scratching the machine was what fixed the problem, even though
    the coin would have worked on the second attempt independent of the scratching.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_89_0.png)


    Similarly, if Chrome crashes, she can restore all of the windows that were open
    at the time of the crash.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_89_1.png)


    # Principle 7: Affordances


    Your user interface elements should be created in a way that suggests to your
    users how they can interact with them. Design details that communicate possible
    interactions are called affordances.


    In The Design of Everyday Things [Nor88], Don Norman writes:


    > A good designer makes sure that appropriate actions are per- ceptible and inappropriate
    ones invisible.


    Nintendo''s old NES controller (below, pictured on the left) doesn’t make it obvious
    how you’re supposed to hold it. In fact, the two red buttons are placed so far
    down the right side that it’s more comfortable to hold the controller upside down.
    Compare this to Nintendo''s newer Game-Cube controller. Although the newer controller
    is a lot more complex, it’s immediately obvious how you’re supposed to hold it,
    thanks to the nubs on each side of the controller that invite you to wrap your
    hands around them.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_0.png)


    User interfaces often use bevels and highlights to indicate elements you can interact
    with.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_1.png)


    Highlighting user interface elements when you move the cursor over them further
    indicates that they are clickable.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_2.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_3.png)


    Of course, if this “hover effect” doesn’t work correctly, the affordance is misleading,
    suggesting to the user that he can interact with a user interface element when
    he really can’t. For example, Mac OS X highlights the buttons in its windows’
    title bars even before the user moves the cursor over a clickable area; this can
    cause users to click too early, missing their target.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_4.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_5.png)


    Similarly misleading affordances can often be found in audio software like Propellerhead
    Software’s ReBirth. These apps often use knobs that look like real knobs, indicating
    that the user can interact with them by turning them.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_6.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_90_7.png)


    Instead, you change their values by dragging vertically.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'I''ll talk a bit more about how affordances apply to user interface design
    in Chapter 12, *Realism*, on page 120.


    # Takeaway Points


    +   - Humans have ideas about how things work. The closer your product matches
    these ideas, the less people have to learn in order to use your product.

    +   - To match your users’ mental models, you often have to hide implementation
    details from them. Watch out for leaky abstractions.

    +   - To design for mental models, make your product simple, familiar, flexible,
    and safe. Provide feedback, and make it obvious to people what options they have
    at any given moment.


    # Further Reading


    Alan Cooper has a good chapter on mental models in his book *About Face* [Coo95].
    Robert Hoekman also covers mental models in *Designing the Obvious* [Hoe06]. Joel
    Spolsky’s *User Interface Design for Programmers* [Spo11] covers mental models
    from the perspective of a developer.


    Jakob Nielsen has written about mental models.⁷


    7. At http://www.useit.com/alertbox/mental-models.html.'
  merge: -1
