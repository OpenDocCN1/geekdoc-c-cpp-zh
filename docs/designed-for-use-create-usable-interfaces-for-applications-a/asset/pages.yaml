- pgno: 274
  md: '# 32.2 No Error, No Blame


    It’s good practice not to blame users for the errors they make. It’s even better
    practice to include error messages that help users figure out how to fix the problem.
    But it’s best not to let the problem occur at all. If something goes wrong, it’s
    usually not the user’s fault; it’s your fault. If your product worked differently,
    then the problem might never have occurred.


    You can prevent a number of common errors from occurring simply by changing the
    user interface. Let’s look at two sources of such errors.


    # Mode Errors


    Problems we perceive as “user error” can often be attributed to products not clearly
    indicating their current state or what specific action they expect from the user.
    I’ve written about this in Chapter 20, Modes, on page 175, but since modes are
    such a common source of errors that we often perceive as “user errors,” let’s
    quickly recap.


    A typical example of a mode error is a cell phone that goes off during a movie;
    most cell phones don’t have obvious “silent” modes. A cell phone’s current state
    is not clear just by looking at it. It’s too easy to forget whether it is currently
    in “silent” mode.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_274_0.png)


    An obvious hardware button on the device that toggles between the two modes, like
    the one found on iPhones or webOS devices, would help prevent this problem.


    A similar issue can occur in modal applications when the application doesn’t clearly
    indicate what mode it is in or when it switches the mode'
