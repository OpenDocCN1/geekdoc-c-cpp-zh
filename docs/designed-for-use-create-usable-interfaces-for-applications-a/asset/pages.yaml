- pgno: 26
  md: 'Happiness [Gil07], Harvard psychologist Dan Gilbert explains that “the greatest
    achievement of the human brain is its ability to imagine objects and episodes
    that do not exist in the realm of the real, and it is this ability that allows
    us to think about the future.”


    Although thinking about the future is indeed a great achievement, the unfortunate
    fact is that we’re quite bad at it, as we saw in the Atari Lynx story in the previous
    chapter. Gilbert notes that “we make a systematic set of errors when we try to
    imagine what it would feel like if.”


    His explanations of why this is are fascinating,¹ but for the purpose of this
    book, you merely need to know that these errors exist.


    As a result, you can’t rely on people’s opinions. When doing contextual interviews,
    try to focus on finding out what people actually do, what tasks they need to accomplish,
    and what problems they encounter. Don’t expect them to be able to tell you how
    the solution to their problems should look. Figuring this out is your task.


    The fact that humans are bad at predicting how they will use a product is unfortunate.
    Even more unfortunate is that this also applies to us designers. We simply don’t
    know what will work, and we can’t be sure how a new product will be used.²


    User research can help us make better predictions, but it can’t remove all uncertainty.
    Don’t get drawn into endless research. At some point, you have to take a leap
    of faith, try something, and see whether people find it useful.


    # The BizTwit Case


    For our BizTwit example app, we spend half a day with a number of people at ACME
    Corp, a company that maintains a Twitter account, both as a means of publishing
    information about the company (this includes things such as links to articles
    that mention its products, links to press releases, or quotes from customers)
    and as a way of interacting with customers.


