  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_223_0.png)


    Figure 26.1: Heat map showing where characters died in Replica Island


    Many modern games use systems like these. When I talked to Bruce Oberg, co-owner
    of Sucker Punch, a game studio that developed titles like inFamous and the Sly
