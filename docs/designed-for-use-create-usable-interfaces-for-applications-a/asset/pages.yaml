  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_174_0.png)


    # Chapter 20


    # Modes


    In 1985, when writing Apple''s Mac developer documentation called *Inside Macintosh*
    [Ros86], author Caroline Rose deemed modes to be important enough to mention them
    at the very start of the very first volume. She writes that “a mode is a part
    of an application that the user has to formally enter and leave, and that restricts
    the operations that can be performed while the mode is in effect.”


    Basically, a mode is a state that an application or an individual window is in
    that changes how the application or window reacts to user input. Modes can be
    a source of usability problems. Rose writes that “since people don’t usually operate
    modally in real life, having to deal with modes in computer software reinforces
    the idea that computers are unnatural and unfriendly.” There’s another issue with
    modes: if people don’t understand what mode an application or window is in, their
    input produces results that they did not expect.


    Perhaps the most popular example of a mode is the Caps Lock key. Whether the Caps
    Lock key is active or not is a state that changes the user interface reaction
    to user input.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_174_1.png)


    *QUIZ: ONE OF THESE TWO PASSWORD FIELDS WAS FILLED IN WITH AN ACTIVE CAPS LOCK
    KEY! WHICH ONE IS IT?*


    In one mode, logging in works. In the other mode, using the exact same input,
    logging in fails.'
