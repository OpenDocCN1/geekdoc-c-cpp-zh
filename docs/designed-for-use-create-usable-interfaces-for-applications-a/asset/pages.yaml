    You don’t necessarily have to create mock-ups using a graphics application. If
    you prefer, you can do mock-ups in code. Simply use the medium that will be easiest
    for you when you have to make sweeping changes. But keep in mind that you are
    creating prototypes, not early versions of the final product. In The Pragmatic
    Programmer [HT00], Andrew Hunt and David Thomas write:


    > With a prototype, you’re aiming to explore specific aspects of the final system.
    With a true prototype, you will throw away whatever you lashed together when trying
    out the concept, and recode it properly using the lessons you’ve learned.


    Even if you do mock-ups in code, the goal is still to explore ideas in a way that
    makes it easy to throw things away if they don’t work out.'
