- pgno: 111
  md: 'can be matched to a video of what occurred. Taking good notes during the test
    can keep you from having to sift through hours of recorded usability tests.


    Recording the session can be a good idea. It allows you to go through the session
    after it’s over. Viewing a session after the fact allows you to focus specifically
    on what the tester is doing and will provide a ton of insight into the kinds of
    problems she encountered; often these are small things you might not have noticed
    during the test. Additionally, if you’re not the one making the relevant decisions,
    a movie that shows people repeatedly failing at the same task can often quickly
    persuade people who otherwise don’t believe that there even is a problem with
    the user interface.


    I tend not to go into legal issues in this book. But remember that in addition
    to having testers sign a consent form,² the facilitator should also explicitly
    get permission from the tester to record the session if a recording will be made.


    # Test Preparation Checklist


    +   - Recruit three to five testers, and schedule them about two hours apart.

    +   - Find and train somebody to act as the facilitator.

    +   - If you want to, prepare a way to record the test.

    +   - Prepare a consent form for the tester.


    # Preparing the Tester


    Have the tester sit across from the person playing the computer so that the computer
    can change the prototype in front of the tester. The facilitator should sit next
    to the tester, preferably slightly behind her so as not to be in the way.


    Once everybody is ready, the first thing the facilitator has to do is to explain
    to the tester that it is not she who is being tested, but the user interface.
    This is basically the standard introduction you give at every usability test;
    you can read more about it in Chapter 28, Usability Testing, on page 240. A short
    version of the introduction might go:


    > 2. If you don’t already have a consent form for usability tests, I suggest you
    write one with the help of a lawyer familiar with the legal requirements in your
    location. Just make sure that your testers will be able to understand any legal
    provisions in the consent form.'
