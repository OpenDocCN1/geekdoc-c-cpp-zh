- pgno: 169
  md: '# Interruptions Are Rude


    Unless you really have no other choice than to ask your users for their input
    and unless you really require that information *right now*, don''t interrupt them.
    It''s just rude.


    # Takeaway Points


    +   - Don''t interrupt people. It makes them less happy and less productive, and
    it''s not polite.

    +   - Make decisions for your users, rather than asking them questions.

    +   - If you can''t make decisions for your users, ask everything you need to
    know once, rather than interrupting them every time you come up with a new question
    you need to ask.

    +   - If there is something you really need to tell people, at least make sure
    it''s as nonintrusive as possible so that they can deal with it in their own time
    frame.


    # Further Reading


    *Flow: The Psychology of Optimal Experience* [Csi02] by Mihály Csikszentmihályi
    explains how important it is for people to be able to focus on a task without
    being interrupted.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_170_0.png)


    # Chapter 19


    # Instead of Interrupting,

    Offer Undo


    Have you ever accidentally done something stupid while using a computer and the
    computer warned you about it, but you just clicked the warning away, because you
    were thinking, “I know what I’m doing. Get out of my way, computer!”?


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_170_1.png)


    It happens to me all the time. We get so used to these warning dialogs that we
    often don’t even consciously notice them anymore. “Are you sure you want to...?”
    Yeah, yeah, I wouldn’t have clicked the button if I wasn’t sure, would I? “Do
    you really want to delete these...?” Yes. Yes, I really wanted to. “You will not
    be able to recover...” Yes! Yes! Yes! No, wait, what did I just do?


    Eventually, we reflexively click warning dialogs away. Psychologists call this
    habituation; most of the time, dialog boxes are an annoying distraction, just
    background noise, so we get in the habit of ignoring them. The one time we actually
    do something wrong, by the time we notice our mistake, we’ve already clicked OK.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# WHAT YOU INTENDED:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_171_0.png)


    # WHAT PEOPLE ACTUALLY SEE:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_171_1.png)


    Warnings are good for shifting the blame to the users—after all, they should have
    read the warning, right? They are not good, however, for preventing problems.


    Fortunately, in most situations, we can provide a better solution than a warning
    dialog.


    # 19.1  Let Users Undo Their Actions


    Instead of forcing people to deal with constant warnings, undo offers a simple,
    transparent solution. Unless users accidentally do something unintended, undo
    is invisible. Once an accident happens, it’s easy to go back.


    One crucial note here is that people need to trust your implementation of undo.
    That means you have to cover as many actions as possible and offer multilevel,
    “deep” undo, which allows the user to undo more than just the most recent action.
    If undo doesn’t work reliably or doesn’t go back far enough, people will lose
    trust in your application. They will hesitate to explore new features, they will
    be afraid to use features they know, and eventually they will become unhappy with
    your application altogether.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Trust


    Allowing people to trust your application is one of your most important tasks.
    A reliable undo function is just one aspect of this. You also need to make your
    application predictable and stable.


    I once worked on a product that shipped with a very destructive bug. A specific
    feature of the application would destroy user data. Even though we fixed the problem
    very quickly, usability testing showed that people who were affected by the problem
    would avoid using that specific feature years after the problem had originally
    occurred.


    Cutting down on warning dialogs in favor of undo has the added advantage that
    people will be less likely to automatically click away actual warning dialogs,
    because they won''t be quite as used to them.


    # 19.2 Temporary Undo


    There are some situations where implementing undo is impossible for technical
    reasons. You can''t let the user undo sending an email; once it''s sent, it''s
    out of your control. Similarly, while you can delete a tweet once it''s sent and
    unpublish a blog post once it''s published, that''s not quite the same as preventing
    the action altogether.


    One solution to this is to delay the action and allow the user to undo it temporarily.
    Instead of sending the mail right away, show an undo button for a few seconds.
    If the user undoes the action, don''t send the mail. Otherwise, remove the undo
    button and send the mail. Gmail implements this in its web interface:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_172_0.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Graphic and interaction designer Clayton Miller calls this “delayed passive
    confirmation,” because the user passively confirms the action by not stopping
    it. Here is his mock-up of how this might look in a desktop application.¹


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_173_0.png)


    # Takeaway Points


    +   - Warning people before they do something potentially dangerous doesn’t work,
    because people ignore these warnings.

    +   - Instead, allow people to undo their actions so that they can revert accidents.

    +   - If it is not technically possible for you to offer undo, at least delay
    the potentially dangerous action so that people can prevent it from happening
    even after issuing the command.


    1. You can read more about his ideas at http://iuface.net/7u8.'
  merge: -1
  img_proc: true
