- pgno: 256
  md: '# Chapter 30


    # Remote Testing


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_256_0.png)


    # What’s the Technique?


    Doing traditional, in-person usability tests requires you to either go to a tester
    or have a tester visit you. Scheduling and meeting people usually involves quite
    a bit of work—so much work, in fact, that it gets put off way too often.


    Fortunately, you don’t have to physically meet with people to do usability tests.
    Instead, you can do remote tests. This chapter explains how to do that.


    # Why Is This a Good Idea?


    Testing remotely is often easier than testing in person, since it gets around
    some of the harder parts of usability testing, such as finding willing testers
    who live nearby and scheduling them to show up for a test. Being free of these
    problems means you can test more often, which helps you identify and fix more
    usability problems.


    # Are There Any Prerequisites?


    Yes. You should read the previous two chapters before reading this one.'
