    or, if it hasn’t been recognized, why not. Simple, error-tolerant gestures work
    best. Straight lines work best. Short gestures work better than long ones. If
    people need to make gestures that start or end in specific areas, make these areas
    large. And in case the computer recognizes a gesture incorrectly, there should
    be a simple way for the user to undo its effects.


    # 13.3 Accidental Input


    Some time ago, I switched from a simple pen-and-paper list to an application on
    my cell phone for grocery checklists. Pretty quickly, I noticed that I forgot
    to buy two or three items every time I went shopping. Further investigation showed
    that I didn’t really forget these items as much as accidentally remove them from
    my grocery checklist. While holding my phone with one hand and putting an item
    into my shopping cart with the other, I would often inadvertently touch the phone’s
    screen, thereby accidentally marking an item as “done.”'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'Similarly, when friends and I played Kinect⁴ for the first time, the game would
    constantly pause for no apparent reason. We finally figured out that a person
    behind the players was leaning against a table, and Kinect interpreted this as
    its “pause gesture.”


    Brushing against a touch screen can delete things. Leaning against a table can
    trigger an action in a video game. Speaking on the phone can activate a nearby
    device’s voice recognition system. These mistakes are easily made, but the results
    are often not immediately noticeable.


    Of course, people make mistakes when using graphical user interfaces, too. They
    click the wrong button, or they drag when they meant to click. But in most cases,
    such mistakes are easily corrected, because the problem is immediately obvious
    to the user. Just undoing the action fixes it.


    But when users don’t notice that there is a problem, they can’t undo it. If the
    source of the problem isn’t obvious, users can’t easily prevent it from happening
    again.


    When designing a natural user interface, it’s important to spend some time thinking
    about how to prevent accidental input, how to teach people what went wrong when
    something does go wrong, and how to let users reverse unwanted actions even if
    they didn’t notice the problem immediately.


    # 13.4 Conventions


    Let’s say you want to give people the security they need to freely explore your
    application. To achieve that, you want to implement a simple way for them to undo
    their actions.


    Designing a user interface for “undo” is easy if you’re working on a desktop platform
    like Windows or Mac OS X. There are conventions and guidelines that explain how
    to do it. Figure 13.1, on the following page is a screenshot of BusyCal (at http://www.busymac.com).


    If your product has a natural user interface, on the other hand, it’s a lot harder.
    There aren’t many conventions or rules that help with this.⁵


    4. Microsoft’s Kinect is a peripheral for the Xbox 360 video game console that
    enables users to control games by moving their bodies and arms.


    5. If people have expectations about how natural user interfaces should work,
    they often come from science-fiction movies, as Chris Noessel and Nathan Shedroff
    explain in their presentation Learning From SciFi Interfaces. Watch it at http://vimeo.com/15233780.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_135_0.png)


    # Figure 13.1: Undoing in BusyCal


    You have to come up with your own design, preferably something that feels “natural.”
    But in real life, you can’t turn back time and revert to the way things were a
    few seconds ago. So, how do you present that concept in a natural user interface?


    Unfortunately, there is no simple, obvious solution to the problem of designing
    “natural” user interfaces, but there are some ideas you can follow:


    +   - If possible, copy real-world behavior. Have the computer respond immediately
    and behave in a way that the user will recognize and understand. That way, people
    can apply real-world knowledge to virtual systems.

    +   - Copy what popular applications are doing. Chances are that your users have
    already seen these other applications and are familiar with their approach.

    +   - Implement interactive prototypes of different ideas, and do usability tests
    to see how people react to them.


    Until NUIs become more popular, we will have to live with a lack of commonly accepted
    user interface conventions. This makes our job harder, but fortunately, it also
    makes it more interesting.


    # Takeaway Points


    +   - Allow direct manipulation whenever possible.

    +   - Give immediate, live feedback to any user action.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '+   - Use gestures that don''t manipulate objects but instead invoke commands
    only as shortcuts rather than as primary interactions.

    +   - Make sure people don''t have to learn complex gestures.

    +   - Make sure people don''t have to make precise gestures; be liberal in accepting
    user input, but allow them to undo false input.

    +   - Hardware that runs natural user interfaces is especially prone to interpreting
    unintended user actions as input. Whenever possible, prevent accidental input,
    and provide fallback solutions for when it does happen.

    +   - Follow what nature does.

    +   - Follow what popular applications do.

    +   - Regularly test interactive prototypes of your user interface with actual
    people.


    # Further Reading


    Dan Saffer''s *Designing Gestural Interfaces* [Saf08] covers some of the things
    mentioned in this chapter and many additional topics. Josh Clark talks about gestures
    (among many other things) in his excellent book *Tapworthy* [Cla10].


    Fred Beecher lists a number of useful guidelines for designing natural user interfaces.⁶'
