  md: '# More from PragProg.com


    # HTML5 and CSS3


    HTML5 and CSS3 are the future of web development, but you don''t have to wait
    to start using them. Even though the specification is still in development, many
    modern browsers and mobile devices already support HTML5 and CSS3. This book gets
    you up to speed on the new HTML5 elements and CSS3 features you can use right
    now, and backwards compatible solutions ensure that you don''t leave users of
    older browsers behind.


    **HTML5 and CSS3: Develop with Tomorrow''s Standards Today**

    Brian P. Hogan

    (280 pages) ISBN: 9781934356685. $33.00

    http://pragprog.com/titles/bhh5


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_313_0.png)


    # The RSpec Book


    RSpec, Ruby''s leading Behaviour Driven Development tool, helps you do TDD right
    by embracing the design and documentation aspects of TDD. It encourages readable,
    maintainable suites of code examples that not only test your code, they document
    it as well. The RSpec Book will teach you how to use RSpec, Cucumber, and other
    Ruby tools to develop truly agile software that gets you to market quickly and
    maintains its value as evolving market trends drive new requirements.


    **The RSpec Book: Behaviour Driven Development with RSpec, Cucumber, and Friends**

    David Chelimsky, Dave Astels, Zach Dennis, Aslak Hellesoy, Bryan Helmkamp, Dan
    North

    (450 pages) ISBN: 978-1-9343563-7-1. $42.95

    http://pragprog.com/titles/achbd


