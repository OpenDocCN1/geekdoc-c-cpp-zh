  md: '# Skeuomorphs


    When designers talk about realistic user interfaces, they sometimes call them
    skeuomorphs—new versions of objects that retain purely ornamental design details
    from earlier versions of the same kind of object. Example skeuomorphs: shoes with
    parts that are glued together but have nonfunctional, purely decorative stitching
    as well, or postage stamps as user interface decoration in email applications
    (the screenshot on the right shows an image-sharing app for the Mac called Courier).*


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_123_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_123_1.png)


    Both the stitching and the stamps serve no actual use.


    * Find out more at http://www.realmacsoftware.com/courier.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_123_2.png)'
