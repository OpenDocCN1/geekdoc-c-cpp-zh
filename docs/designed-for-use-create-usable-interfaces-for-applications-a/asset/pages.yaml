  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_204_0.png)


    # Chapter 24


    # Avoiding Features


    Product design is a never-ending race. To avoid being overtaken by competitors,
    you need to keep running and running—or, in our case, designing and designing.
    But this race has no clear finish line; your product is never really “done.” At
    most, it simply becomes a bit less unfinished with each new release. This is the
    best we can hope for.


    Like a species of shark that needs to keep moving in order to supply its gills
    with oxygenated water, if your product remains stagnant for too long, it dies.
    This is a problem, because it means you must constantly add new things. As a result,
    most products are forever acquiring new features, without much thought going into
    it.


    As you add new features, your product can quickly grow from its original state—an
    elegant solution to a well-defined problem—into a byzantine mess of unrelated
    functions. It may be that, on the whole, the product solves a number of problems,
    but chances are that it solves most of them poorly. The fact that a product could
    (in theory) solve many problems is meaningless if its users have trouble figuring
    out how to find the features that solve their particular problem.


    Although those users with existing knowledge of your product may be able to keep
    up with all of the features, you are essentially closing the door for new users
    who do not have the benefit of starting out with a simple product and learning
    how to use all of the additional features as they appear.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_205_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_205_1.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_205_2.png)


    1984


    1988


    2010


    What’s worse, your existing users, who grow alongside your product, will turn
    into advanced users, which means they will continue to push you to add more advanced
    features. If you do this, your customer base will skew even more toward advanced
    users.¹ It’s a vicious cycle.


    How do you manage product growth and avoid adding countless new features?


    # 24.1 Remember the User’s Goals


    Think about what your users want to achieve with your product. Does the new feature
    help them produce better results? Does it allow them to reach new goals? Does
    it make the product easier to use? As Kathy Sierra puts it,² “People are not into
    your tool, they are into what the tool enables.”


    # 24.2 The Five Whys


    When receiving user feedback, your first task is to find out what exactly the
    user is trying to achieve. Often, the solution to the user’s problem can be found
    without adding new functionality to your product.


    One process you can use to find the root cause of a problem is “The Five Whys.”
    According to legend, this approach was originally developed by Sakichi Toyoda,
    the founder of Toyota Industries. It works pretty well when trying to find out
    what caused somebody to send in a particular feature request: you simply keep
    asking “why?” (or something along those lines that sounds a little less unfriendly)
    until you figure out


    1. Chris Clark mentions this problem at http://releasecandidateone.com/236:crotchety_old_power_users.


    2. You can read more of her writing at http://headrush.typepad.com.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'what prompted your users to think they needed an additional feature. You don''t
    have to ask exactly five times. Sometimes, fewer times does the trick, and sometimes,
    more asking is required to get to the bottom of the issue.


    Let''s look at an example of how this works:


    **User:** Hey, it would be awesome if you could add a feature where BizTwit regularly
    saves a copy of the message I''m currently writing.


    **Designer:** That sounds interesting. If it is OK with you, I''d like to ask
    you a few questions to make sure I understand how you would use this new feature.
    This way, I can do the best possible job of making the feature as useful to you
    as possible, if I decide to add it to the product.


    Can I ask you what you would use this feature for?


    **User:** Well, I often need to go back to an earlier version of a message I''m
    writing.


    **Designer:** Yes, I see how this could be useful. Is there a specific purpose
    for which you want to use earlier versions of your documents?


    **User:** I sometimes make changes to messages that I am unhappy with. If I had
    earlier versions, I could just copy parts of one into my message.


    **Designer:** There is already an Undo feature in the product that should allow
    you to reverse unwanted changes. Does that not work for you?


    **User:** It usually works, I guess, but every time I save my draft of the message
    I''m writing, for some reason I can''t undo past that point. Also, your product
    sometimes crashes when I try to paste formatted text into a message, so I''ve
    made it a habit to save as often as possible, every few minutes, which means that
    the Undo command often doesn''t work properly.


    In this example, the user''s initial request was for a versioning feature. But
    it turns out that the actual root cause of her request was one bug in BizTwit
    that prevented the Undo command from undoing saved changes and another bug that
    caused it to crash regularly. Instead of adding new features to the product, the
    user''s problem can be solved by fixing these two bugs.


    Always try to see the bigger picture. What do people really want? What actual
    problem are they trying to solve with the feature they''ve asked you to add to
    your product?'
