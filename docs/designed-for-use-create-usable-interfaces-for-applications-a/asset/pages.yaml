    It''s probably a good idea to try various ways of dealing with this problem and
    do usability tests on them to find out which ones work.


    But even if designers realize that they need to make modes obvious and find a
    workable way of doing so, people may still be confused by the result, because
    the way the mode is exposed is unclear. Here''s an example from Apple''s iPhone.
    The included camera application has an HDR mode.³ Whether or not the mode is currently
