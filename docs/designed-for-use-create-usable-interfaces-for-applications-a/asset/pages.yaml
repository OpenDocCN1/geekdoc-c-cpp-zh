  md: 'If people don’t understand some part of your user interface, don’t add explanatory
    text. This just adds more clutter and makes the problem worse.


    If it’s impossible to avoid communicating, design your user interface under the
    assumption that people won’t read what you write. For example, use verbs as button
    labels, and make sure that each button has a specific, mutually exclusive label.
    Instead of labeling two buttons “Yes” and “No,” label them “Delete File” and “Cancel.”
    That way, people don’t have to read the text in the dialog box to figure out what
    each button does.


    # 6.4 Make Text Scannable


    Often you can’t avoid text. To know how to write, first you need to know how people
    read.


    Jakob Nielsen’s research shows that people typically don’t read text on the Web
    word by word. Instead, they “scan” the page, looking for sentence fragments that
    contain what they are looking for. To help people do that, Nielsen suggests⁷ the
    following rules:


    +   - Use words that make sense to your audience.

    +   - Convey one idea in each paragraph.

    +   - Introduce the paragraph’s idea in the first sentence so people can quickly
    decide whether to read the paragraph.

    +   - Use meaningful headings.

    +   - Highlight keywords.

    +   - Use bullet lists.

    +   - Keep text short, simple, and informal.

    +   - Start text with conclusions, and include a summary of its content.


    # 6.5 No Fluff


    People are trying to achieve a goal and are reading your text because they think
    it might help them with their task. Write short, clear, obvious


