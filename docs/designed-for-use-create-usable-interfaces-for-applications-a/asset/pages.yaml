    Another example is Prezi,⁶ a presentation app that shows the whole presentation
    on one flat surface and breaks it down into individual screens by moving a camera
    across this plane.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_191_1.png)


    6. At http://prezi.com.'
