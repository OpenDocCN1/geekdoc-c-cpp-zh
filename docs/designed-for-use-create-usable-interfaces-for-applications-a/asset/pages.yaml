  md: 'sentences. Keep individual paragraphs short. Don’t waste your readers’ time.
    Keep their goal in mind.


    As Patricia Wright puts it in the book *Quality of Technical Documentation* [SJ94],
    “Writers often believe that they should communicate more than readers want to
