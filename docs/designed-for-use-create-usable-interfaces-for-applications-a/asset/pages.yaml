- pgno: 66
  md: "How many card sorts should you do in total? Jakob Nielsen recommends fifteen\
    \ card sorts with one user each.² Since card sorts are simple, doing many of them\
    \ is easily possible. Different people may expect things to be in different places;\
    \ the more card sorts you do, the clearer the picture becomes.\n\n# 8.4 Running\
    \ a Card Sort\n\nAfter you’ve welcomed the participant or participants, explain\
    \ what they are about to do. This introduction should go something like this:\n\
    \n> Hi, my name is Lukas Mathis. I’m currently working on the design for a new\
    \ Twitter application. Twitter is a social networking tool, similar to Facebook.\n\
    > \n> Right now, I’m working on the basic organization of the app you know, where\
    \ to put which feature, stuff like that. The exercise we’re about to do will help\
    \ me understand where people expect to find things in our application.\n> \n>\
    \ In a minute, I’m going to give you a bunch of index cards that have words written\
    \ on them. These words are things that exist in our application, like features\
    \ or objects. What I want you to do is to group these index cards into little\
    \ piles. Each pile should contain things that, to your mind, belong together.\
    \ Let me explain this a little bit more clearly. We’re not looking for superficial\
    \ similarity, like grouping words that sound similar or start with the same letter.\
    \ Instead, imagine that you are using this application. Which things would you\
    \ expect or want to see on the same screen, for example? If there’s a list of\
    \ items on a screen, which items would you expect to see next to each other in\
    \ the list?\n> \n> If there are cards you can’t group anywhere or think don’t\
    \ belong in the application, feel free to put them in their own group. I have\
    \ empty cards handy, and there’s a marker on the table, so if the word on a card\
    \ seems unclear to you, feel free to cross it out and replace it with a better\
    \ word. You can also make copies of cards, if you feel that certain cards should\
    \ be in more than one group.\n> \n> Before we start this, let’s go through all\
    \ the cards.\n\n² Read his essay at http://www.useit.com/alertbox/20040719.html."
  merge: -1
