  md: '# Pulling It All Together


    To give you a feel for how a typical remote test would work, here’s a hypothetical,
    somewhat abbreviated version of a session.


    For this test, let’s assume that the tester provided his Skype name on your online
    form, and you’re now contacting him via Skype. Be sure to wear a headset so you
    have your hands free to take notes.


    **Facilitator:** Hey, this is Lukas Mathis, from BizTwit.biz. How are you? Listen,
    about twenty minutes ago, you filled in a form on our website, indicating that
    you’d like to help us make BizTwit even better.


    **Tester:** Right, yeah. Didn’t think I’d hear from you!


    **Facilitator:** So, do you have fifteen minutes for this?


    **Tester:** Yeah, sure.


    If the tester replies in the negative, stop the test.


    Next, we want to know if this is the kind of participant we’re looking for.


    **Facilitator:** So, have you ever used our Twitter app, BizTwit?


    **Tester:** No, not so far.


    **Facilitator:** And you visited our website because you might be interested in
    such an app?


    **Tester:** Right. I was looking for a Twitter app for businesses and found you
    on Google.


    **Facilitator:** Great, you’re exactly the kind of person we’re looking for. So,
    here’s what this is about. We’re currently testing a new design for our app, and
    we want to know whether people can figure it out, you know, find out what parts
    of the design we have to make better. This is about testing the new design and
    seeing whether it works, not testing you. How this works is, you’ll have to share
    your screen with me. Is this OK with you? During the duration of the test, I’ll
    be able to see your screen.


    **Tester:** Sure, not a problem.


    **Facilitator:** OK. From now on, I’ll record this call. We’ll use this recording
    to look for problems with our design. It won’t be made public—it’s purely for
    us to improve our product.


    **Tester:** OK.'
