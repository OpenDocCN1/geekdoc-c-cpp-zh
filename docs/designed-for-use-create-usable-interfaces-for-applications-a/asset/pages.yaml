    Making your product fun is a great goal, but fun can and should never come at
    the expense of usability.


    # Takeaway Points


    +   - Merely being usable doesn’t make your product fun. However, if your product
    isn’t usable, it’s probably not fun either.

    +   - People experience fun if they have a meaningful challenge, a way of measuring
    their progress toward mastering that challenge, and the skills to master the challenge.

    +   - Don’t provide the challenge. Your users will do that for you.

    +   - You don’t need to set the difficulty. Your users will pick a challenge that
    is suitably difficult for them.

    +   - Providing feedback on people’s progress, and allowing them to grow along
    with the challenges they master, makes their experience more fun.

    +   - Try to find a way to reward exploration and positive behavior.


    # Further Reading


    Both *Flow: The Psychology of Optimal Experience* [Csi02] by Mihály Csikszentmihályi
    and *A Theory of Fun for Game Design* [Kos04] by Raph Koster provide useful insight
    into what makes things fun. *Rules of Play: Game Design Fundamentals* [SZ03] by
    Katie Salen and Eric Zimmerman is also worth reading, as is Thomas W. Malone’s
    paper “Heuristics for Designing Enjoyable User Interfaces,”¹³


    Replica Island developer Chris Pruett writes a great blog about game design that
    sometimes touches on usability issues.¹⁴


    On YouTube, there’s an interesting presentation called “Putting the Fun in Functional:
    Applying Game Mechanics to Functional Software” by Shufflebrain CEO Amy Jo Kim.¹⁵


