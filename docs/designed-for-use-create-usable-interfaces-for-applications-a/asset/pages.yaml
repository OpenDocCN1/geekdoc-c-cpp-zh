  md: '# Restrict Depth


    If you give people just a little bit of rope, they’ll have a harder time using
    it to hang themselves. If you give people the ability to create only shallow hierarchies,
    they probably won’t get lost in them. One example of such a system is the photo-sharing
    site Picasa, which allows its users to sort their pictures into albums but doesn’t
    let them put one album into another album. An album contains a number of pictures,
    and that’s it. It’s unlikely that people will lose their albums, since they can’t
    hide them inside other albums to begin with.


    # Show Hierarchies Spatially


    When Apple added folders to its iOS operating system,⁸ it did a very clever thing:
    as long as you don’t put more than nine apps into a folder, you are always able
    to see all of the folder’s apps inside the folder’s icon. So even though this
    is technically a hierarchical arrangement of apps, users are unlikely to lose
    track of where things are, because the hierarchical arrangement looks like a spatial
    arrangement to the user.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_194_0.png)


    # Allow Items to Exist in More Than One Place


    It’s often not clear where individual items belong. Let’s say you are using a
    document management system. It contains various directories, such as an Insurance
    directory for documents from your insurance and a Bills directory for your bills.
    Well, what happens if your insurance company sends you a bill? The same document
    needs to exist in two different places. Hierarchical file systems should always
    let people put the same file into more than one place.


    # Support Tagging and Other Metadata


    Simply letting people sort items into a hierarchy is semantically weak. Hierarchies
    often express only one aspect of an item’s nature. For example, the biological
    classification of animals uses the principle of common


    8. iOS is an operating system most prominently used by iPhone, iPad, and iPod
    touch.'
