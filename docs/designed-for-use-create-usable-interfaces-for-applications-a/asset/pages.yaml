    things a real calendar could not. For example, it contracts free time so a person
    sees only the parts of the day when she’s busy.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_127_0.png)


    # Takeaway Points


    +   - Adding realistic details communicates possible actions, or affordances,
    to users.

    +   - Symbols shouldn’t be too realistic or they will lose their meaning.

    +   - Replicating real objects can help users quickly form correct mental models.

    +   - Realistic graphics and an interaction design based on real objects should
    go hand in hand.

    +   - Sometimes, replicating the constraints of real objects can be limiting in
    needless ways, since objects on screens are not bound by physical laws.

    +   - It’s possible to combine realistic elements that help people figure out
    how to use your product with advanced features that would not be possible in real
    life, but you need to make it obvious where your product’s realism stops so that
    people can form a correct mental model.'
