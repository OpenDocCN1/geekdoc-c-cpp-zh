  md: 'I usually don’t go back to watch recordings if I have them. But making recordings
    is easy and cheap to do, and from time to time, they can be extremely useful.
    If you can easily do it, record tests. But if that’s not possible, don’t worry
    about it.


    For Macs, I recommend Silverback, a screen-recording application that is specifically
