  md: '# Recruiting


    When you do a traditional usability test, first you have to recruit testers, and
    then you have to schedule a date for the test. So, recruiting often happens days
    or weeks before the test. With remote testing, you don’t have to schedule a physical
    meeting, so you don’t need to recruit as far in advance of the test.


    Remote testing offers another way of recruiting that isn’t possible with a traditional
    usability test: “live recruiting.” Just put a note on your website that you’re
    looking for people to help you test a new application or website, with a link
    to a recruiting page.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_258_0.png)


    To increase the number of respondents, you can offer participants some kind of
    reward—a small Amazon gift certificate, for example.


    People who click the link should get a form where they can enter their contact
    info (perhaps their email address, Skype name, or phone number, depending on how
    you run the test) and any other information you need in order to screen people
    for the test. In their book Remote Research [BT10], Nate Bolt and Tony Tulathimutte
    recommend using this form to weed out potentially poor testers who have visited
    your site specifically to participate in a test. (This problem occurs only if
    you offer rewards to participants.) They suggest asking a question like “Why did
    you come to the site today?” They write:


    > This question not only helps determine whether a user’s motives for coming to
    the site match the goals of the study, but also helps to root out fakers. (...)
    Most authentic visitors will have a good specific reason for being there, and
    by asking open-ended questions, you can usually get a strong intuitive feel for
    authentic visitors. We almost always begin our screeners with the simple question
    “Why did you come to'
