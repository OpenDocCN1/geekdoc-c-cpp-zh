  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_76_0.png)


    # Chapter 9


    # The Mental Model


    The people who use your products are not neutral or unbiased. They have ideas
    about how your product should work before they’ve ever used it. And yet, most
    products don’t work the way people expect them to; people have to *learn* how
    to use things.


    Instead of forcing people to learn how to use your product, wouldn’t it be better
    if you created products that work the way people already expect them to work?
    Joel Spolsky notes in *User Interface Design for Programmers* [Spo11], “A user
    interface is well designed when the program behaves exactly how the user thought
    it would.”


    Of course, different people have different ideas about how things work. But even
    so, you can make an effort to minimize the gap between what people expect from
    a product and how the product actually works.


    # 9.1 What People Think


    The concept a user forms about how something works is called a *mental model*.
    Mental models are usually much simpler than reality. In *About Face* [Coo95],
    Alan Cooper refers to mental models as “a cognitive shorthand (...), one that
    is powerful enough to cover [the user’s] interactions with [the product], but
    which doesn’t necessarily reflect its actual inner mechanics.”


    Jakob Nielsen says, “A mental model is *what the user believes* about the system
    at hand.”¹'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Here''s an example. Somebody driving a car might think there is a direct mechanical
    connection between the gas pedal and the engine, assuming that pushing down on
    the gas pedal opens some sort of valve that causes more fuel to enter the engine,
    thus making the car run faster.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_77_0.png)


    This mental model of how cars work is not actually correct. Instead, the gas pedal
    is connected to a computer. The input from the gas pedal is just one of many data
    points the computer takes into account, and the fuel system is just one of many
    systems the computer controls.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_77_1.png)


    Based on all of this data, the computer then tries to figure out what the driver
    is doing. Is he trying to accelerate quickly because he has just gotten on the
    highway? Is he starting from a complete stop because the red light has just turned
    green? Is he suddenly letting go of the gas pedal because he''s trying to stop
    the car as quickly as possible?


    If the computer works correctly, the driver doesn’t notice any of this. Stepping
    on the gas pedal makes the car go faster, just as you’d expect it to do.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'There’s an important point here: the user’s mental model of how the car works
    is technically wrong. However, it still helps him understand how to control the
    car, because the interaction logic of the mental model—push the gas pedal to make
    the car go faster—matches the car’s behavior (most of the time).


    In other words, the user’s mental model doesn’t have to be correct. It just has
    to be consistent with the product’s behavior.


    # 9.2 Three Different Models


    Our product actually reflects three different models:


    +   - How the user thinks the product works. This is the user’s mental model of
    the product.

    +   - How the product is presented to the user in the user interface. I call this
    the UI model.²

    +   - How the product is implemented. I call this the implementation model.³


    In an ideal product, these three models are consistent with each other. The user
    interface perfectly represents the implementation, and the user perfectly understands
    what he sees.


    # 9.3 Hiding Implementation Details


    In reality, the three models are never entirely consistent. For example, the implementation
    model may be complex and archaic, so you have to simplify what the user sees.
    This is at odds with the goal of making the implementation model consistent with
    the UI model.


    2. The model espoused by the visual representation of the product (its user interface)
    is sometimes also called the design model, manifest model, or designer’s model.

    3. The model espoused by the implementation is sometimes also called the system
    model or the programmer’s model.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Anthropomorphism


    People tend to attribute human characteristics to applications, websites, and
    other products.* This is a kind of mental model; people assume that machines work
    similarly to humans. So when a coin-counting machine finishes too quickly, we
    think that it hasn’t put the proper effort into its task. We get angry at our
    computers as if they are our documents on purpose. We suspect that our car’s navigation
    system has led us astray deliberately. We give our devices names.


    Car manufacturers are especially good at making use of our tendency to anthropomorphize
    their products. They intentionally design their cars to look as if they have human
    characteristics, making them look friendly or aggressive.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_79_0.png)


    As designers, we should keep an eye on what kinds of human characteristics people
    will attribute to our products. Do our products behave like nice people or like
    unfriendly ones? Do they seem cold and unconcerned, or do they have a bit of personality?
    Are they tardy or so efficient that people might become suspicious?


    > * Clifford Nass writes about research on this topic in *The Man Who Lied to
    His Laptop* (NY10).'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_80_0.png)


    It''s a trade-off. You are simplifying the user interface so that most users will
    have a better experience. But this means your UI model may not be entirely consistent
    with the implementation model.


    Let''s say you''re creating an online platform for purchasing downloadable movies.
    Your potential customers probably know how buying a movie works:


    +   1. Go to a store.

    +   2. Browse through a number of movies until they find one they like.

    +   3. Exchange money for the chosen DVD.


    This is the user''s mental model of how buying a movie works.


    But this isn''t how buying a movie works on the Internet. Your customers don''t
    give you physical money; instead, software running on your server asks a credit
    card company to change some numbers in a database. Then, your software updates
    some stuff in your database, signaling that the customer is now allowed to download
    a file. When the customer starts the download, the file is typically watermarked
    and possibly encrypted. Once the file is downloaded, software on the customer''s
    computer decrypts the file, decodes the stored movie, and shows it on the customer''s
    screen.


    How do we represent this complex string of actions in the user interface?'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# You Know More Than Your Users


    If you’re creating a user interface for a product, you probably know how the product
    is implemented. If you’re creating a website representing a company, you probably
    know that company’s internal structure. Your users (most likely) don’t know these
    things. So, right from the beginning, your mental model of how things work is
    different from your users’ mental models, because yours is informed by things
    your users don’t know.


    Just because something makes sense to you doesn’t mean it will make sense to your
    users.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_81_0.png)


    The user interface sits between the customer’s mental model of how movie-buying
    works and the implementation model. Those two things are very different, so it’s
    the user interface’s job to translate between the two worlds, to present all of
    those strange things that happen outside of the user’s view in a way that the
    user can understand and relate to. To help the user understand what is going on,
    the UI model has to be closer to the user’s mental model than to the implementation
    model, hiding some of the implementation’s complexity.


    # 9.4 Leaky Abstractions


    Hiding implementation details from the user makes your UI model easier to understand.
    But it creates a different problem: whenever some of the hidden implementation
    details leak to the user, it will not match his mental model of how your product
    behaves.


    Going back to the earlier example of somebody buying a movie, let’s say that same
    person now wants to buy a movie for her sister. Her mental model of buying a movie
    as a gift is simple:'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   1. Go to a store.

    +   2. Browse through a number of movies until she finds one her sister likes.

    +   3. Exchange money for a DVD.

    +   4. Wrap the DVD in nice wrapping paper.

    +   5. Deliver the wrapped DVD to her sister.


    When it comes to buying a movie for her sister online, this user’s mental model
    breaks down. The UI model hides a crucial aspect of the implementation model:
    the movie she bought is encrypted and needs to be decoded in order to be viewed.
    It can be decoded and shown only on her own computer. It would be reasonable for
    her to assume that she could put the downloaded movie on a memory stick and give
    that to her sister, because that matches her mental model of how movies work.
    But in fact, her sister would not be able to watch that movie.


    How can you prevent these kinds of problems?


    # 9.5 Designing for Mental Models


    First, you need to find out how people think something works—by having a conversation
    with them to figure out what their preexisting mental model is (see Chapter 2,
    Job Shadowing and Contextual Interviews, on page 23). Then you do a card sort
    to find out how people think things fit together (see Chapter 8, Card Sorting,
    on page 63). Next up is usability testing with paper prototypes (see Chapter 11,
    Paper Prototype Testing, on page 104) to come up with designs that match people’s
    mental models. You show them your design, describe an interaction, and ask them
    what they expect to happen. ("If I type some text and then close this document,
    what do you think will happen?")


    Using the information you’ve gathered from conversations and usability testing,
    you can design a UI model that is consistent with your users’ mental models. If
    you’re creating your product from scratch, make sure that the implementation model
    matches that UI model.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'This isn’t always possible. Sometimes, you have to deal with an existing product
    that simply doesn''t work the way people expect it to, and you can''t change how
    it works. If that happens, make sure that the things your users have to learn
    are few and simple so that people can easily change their mental model of your
    product to fit how it actually works.


    If you discover that people always form false mental models of your product when
    they use it (say, during usability tests), try changing how it looks, for example,
    by avoiding metaphors that don''t fit your product''s behavior (for more on metaphors,
    check out Chapter 12, Realism, on page 120). You can also try making your product
    appear unique so that people will immediately understand that it behaves differently
    from what they already know.


    In their paper “Mental Models and Usability,” Mary Jo Davidson, Laura Dove, and
    Julie Weltz describe seven user interface design principles that help users form
    valid mental models:


    # **Principle 1: Simplicity**


    Mental models are simplified versions of reality. If your product follows a small
    number of simple rules, your users’ mental models are more likely to be consistent
    with how the system actually works, and people will be able to learn these rules
    more easily.


    The Flip video camera, for example, has a huge red button on the back. Even if
    people have never used one, they have to take only one look at it to form a correct
    mental model of how the camera works. Push the button to start recording. Push
    again to stop.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Principle 2: Familiarity


    Users bring a lot of prior knowledge to your product. You need to be consistent
    across similar products and with how things work in the real world, and people
    will be more likely to form correct mental models.


    An example of this is the way people delete files in most modern operating systems:
    they throw them into a bin and then empty the bin. You don’t need to explain to
    people how to tell an empty bin from one with files in it; their prior knowledge
    of how bins work suffices.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_84_0.png)


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_84_1.png)


    EMPTY WINDOWS 7 BIN

    BIN WITH FILES INSIDE


    Of course, this prior knowledge of how trash bins work can cause problems. On
    Mac OS X, dragging a DVD onto the Trash icon (which then turns into an eject symbol)
    ejects the DVD. Predictably, a lot of people are confused by this; after all,
    they don’t want to risk accidentally destroying the DVD by throwing it into the
    trash.


    A lot of the music apps on Apple’s iPad also make use of familiarity. Figure 9.1,
    on the following page shows an app called djay.


    This looks exactly like a real, physical dual-turntable DJ system. As a result,
    people familiar with such systems can start using this app without having to learn
    anything. They already have the mental model that allows them to make perfect
    sense of what they see.


    # Principle 3: Recognition


    Instead of making people recall how to do something, show them the cues or obvious
    choices that allow them to understand the options currently available to them.


    For example, the menu bar in Windows 7 displays actions related to the files the
    user is currently looking at. If she’s looking at pictures, it offers commands
    related to sharing or viewing pictures, shown in Figure 9.2, on the next page


    People don’t have to remember how to show pictures in a slide show. The option
    is right there when they are likely to need it.


    6. Find out more at http://www.algoriddim.com.'
