  md: '+   - Are there specific tasks that this person is spending a lot of time on?

    +   - Is the person doing the same thing repeatedly?

    +   - Is she doing something that looks like a workaround?

    +   - Is she doing something that seems to bore or annoy her?

    +   - Is she forced to memorize steps or technical aspects of a task or other
    things that the computer could manage for her?

    +   - Is she using other tools in conjunction with her computer, such as paper
    lists or a calculator?


    As a general rule, you should not interfere with the person while she’s working,
    but if you’re unsure what she’s doing, feel free to ask.


    # 2.3 Contextual Interviews


    What you see is more important than what people say. Still, by asking the right
    questions, you can often get some useful information out of people.


    After shadowing somebody, spend half an hour asking that person about the things
    she was doing. The kinds of things you’re looking for are areas where improvements
    seem possible. Don’t ask for opinions, and avoid questions that force the person
    to play product designer.


    We want to ask the person about tasks he is performing, so questions should include
    the following:


    +   - Are there tasks you often do that I did not see today?

    +   - What kind of problem are you solving most often?

    +   - Why are you doing [something you’ve seen] in this specific way?

    +   - What happens if you don’t have all the information you need to complete
    a task?

    +   - Who are the people you regularly interact with, and how do you do that?

    +   - What do you have to do if somebody you need is not at work or if some other
    problem occurs?


    Keep in mind, though, that people are spontaneously providing this information;
    therefore, it is often incomplete and may include personal'
