  md: '# Skype Can Do Screen Sharing?


    Yes. But Skype’s screen-sharing feature is a bit hidden. To activate it on a Mac,
    first start a video call. Then, in the video window, click the button with the
    “square and arrow” icon, select Share Screen, and select the screen you want to
    share.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_257_0.png)


    On Windows, start a video call, and then select “Show entire screen” from the
    pop-up that appears when you click the “two rectangles” icon.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_257_1.png)


    Since the tester has to share his screen, you will have to walk him through this
    somewhat complex task if you use Skype.


    # 30.1  Moderated Remote Testing


    Let’s say you want to run a usability test, but you can’t find any testers who
    live nearby. Or you want to test with a more diverse group of testers, so it may
    make sense to test with people who live in different places. Or you want to recruit
    testers on your website, so they might be from all over the place. Or maybe you
    just want to simplify testing even more and avoid that whole meeting-in-person
    thing.


    You can do this using screen-sharing apps such as Skype, iChat, or Copilot.¹ Instead
    of meeting your testers physically, you meet them online.


    1. At https://www.copilot.com.'
