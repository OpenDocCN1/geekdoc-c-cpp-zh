- pgno: 179
  md: '# 20.2 Unexpected Modes


    Dialog boxes are a specific type of mode. Unlike nonobvious modes, dialog boxes
    are usually reasonably obvious, at least when they first pop up. They are, however,
    often unexpected, therefore causing the same problems as nonobvious modes: the
    user interface doesn’t do what the user wants because it is not in the mode the
    user expects.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_179_0.png)


    THE USER EXPECTS TYPED TEXT TO APPEAR IN HIS DOCUMENT


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_179_1.png)


    BUT THE UNEXPECTED DIALOG BOX "EATS" TYPED TEXT


    Not only do dialog boxes change the mode of the user interface unexpectedly, but
    it’s also possible that the user’s input is mistakenly interpreted as input for
    the modal dialog box, rather than for the previously active window. (This is called
    stealing focus, since it moves the computer’s focus from where the user wants
    it to be to somewhere else.) This means that the user may accidentally discard
    a modal window or approve something she intended to reject. Instead of moving
    the cursor to a new line, the Return key may unmount a network disk or delete
    a file, because that was the default button’s action in the modal window.


    # 20.3 Sticky Modes


    This is my alarm clock. To change the time the when the alarm goes off, I have
    to push the topmost button. This puts the clock into its “change alarm time” mode.
    In that mode, the topmost button now changes the hour of the alarm. So, if I can’t
    push this button again to exit the mode, how do I exit the mode?


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_179_2.png)


    It is often not obvious to the user how to resolve an active mode, and this causes
    usability problems. Another example of this is the Insert'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'key on PC keyboards. Once the user has activated the overtype mode by hitting
    the Insert key (perhaps by accident), it is entirely unclear and nonobvious how
    to go back to the “normal” mode.


    If you use modes, always make it clear how the user can exit the mode.


    To solve the alarm clock riddle, you can’t actively leave the “change alarm time”
    mode. You can push buttons all you want. In fact, pushing buttons merely ensures
    that you will remain stuck in that mode, since the clock will exit the “change
    alarm time” mode on its own a few seconds after the user stops frantically and
    randomly pushing buttons, trying to get out of the mode.


    # 20.4  Modes Are Not Always Bad


    Because of the problems they can cause, it’s no surprise that modes have a pretty
    bad reputation. In reality, that reputation is largely undeserved. Trying to make
    a user interface entirely nonmodal increases its complexity. Modes can be used
    to show functionality only when it is wanted; nonmodal interfaces are forced to
    offer a much wider array of possible user actions at any given time.


    Modes are bad only when they are nonobvious, unexpected, or hard to leave. If
    the user intentionally changes a user interface’s mode, that mode is entirely
    obvious to her as long as it remains active, and she always knows how to leave
    that mode, then there is nothing wrong with using modes.


    Keep these basic rules in mind, and your modes will improve your user interface,
    rather than making it more confusing.


    # 20.5  Quasimodes


    Quasimodes, as Jef Raskin calls them, are modes that are temporary and exist only
    as long as the user explicitly keeps them active. In *Inside Macintosh* [Ros86],
    Rose calls them *spring-loaded* modes. The quasimodal counterpart to the Caps
    Lock key is the Shift key. Instead of putting the computer into a permanent mode,
    the Shift key introduces a transient mode that is active only as long as the user
    holds the key down. Since the user has to keep the quasimode alive explicitly,
    there is no chance that the mode will be nonobvious, unexpected, or hard to leave.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Another quasimode that Rose mentions in her book is pressing down on the mouse
    key; it''s active only as long as the user keeps pressing. Computers behave differently
    when the mouse key is held down, but people are never confused about whether they
    are currently pushing the mouse key.


    If you need to use modes, consider whether quasimodes might solve your particular
    user interface need.


    # Takeaway Points


    +   - Modes can be a source of confusion if they''re not designed properly.

    +   - Modes can be useful since they help you avoid overcrowding your product
    with user interface elements.

    +   - To work well, modes should be obvious, expected, and easy to leave.

    +   - Use quasimodes instead of full modes whenever possible.


    # Further Reading


    Modes are mentioned in many books on user interface design. About Face [Coo95],
    for example, mentions modes in several different contexts. Jef Raskin''s The Humane
    Interface [Ras00] has a chapter on modes. Aza Raskin has written a great essay
    on modes.⁴


    Inside Macintosh [Ros86] only covers modes superficially, but it''s worth reading
    in general.


    4. At http://www.azarask.in/blog/post/is_visual_feedback_enough_why_modes_kill/.'
