  md: 'want to use these features in the future, even if they see no immediate need
    for them.⁵ However, when the same people get around to using the product they
    said they wanted, they wind up being frustrated by all the features. They thought
    they would prefer a product with more, but they end up being happier with fewer,
    even if a simplified product doesn’t provide all the features they think they
    might want to use in the future. People who pick up your product because it offers
    the most features quickly turn into a liability when they end up being unhappy
    with their purchase.


    Similarly, in *The Paradox of Choice* [Sch05], Barry Schwartz notes that as the
    number of choices people have goes up, the satisfaction they derive from their
    choice goes *down*. Giving people more things to do may make them less happy.


    If you want satisfied, happy customers who will recommend your product to their
    friends, be careful when adding new features.


    # 24.10 Not All Users Need to Be Your Users


    Finally, it''s important to keep in mind that you don''t have to own 100 percent
    of your market. It''s true that adding more features to your product allows you
    to target more users, but doing so comes at a cost. Your product becomes more
    desirable to the people who would not be able to use it if it didn''t offer a
    specific feature. However, it also makes your product less desirable to the people
    who have no use for that specific feature.


    It’s OK to let some people go to your competitors to get what they need; you can’t
    be everything to everybody.


    Isaac Hall, cofounder of Dropbox competitor Syncplicity, writes that he ran into
    the CEO of Dropbox and asked him why Dropbox didn’t support multifolder synchronization.
    The answer,⁶ Hall says, explains why Dropbox is so popular. Dropbox added multifolder
    support early on but, when beta testing the feature, found that it confused people.
    Dropbox couldn’t get the user interface right. Because it was too hard to use,
    Dropbox removed the feature.


    5. You can read more about their research here: http://hbr.org/2006/02/defeating-feature-fatigue/ar/1.


