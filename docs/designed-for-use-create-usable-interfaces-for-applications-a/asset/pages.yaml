- pgno: 129
  md: '# Chapter 13


    # Natural User Interfaces


    Natural user interfaces (NUIs) are interfaces that ignore the traditional conventions
    of GUIs in favor of an interaction design based on the natural world. Instead
    of windows and buttons and menus, natural user interfaces are based on realistic
    objects and gestures. Instead of a mouse and keyboard, natural user interfaces
    rely on multitouch screens, cameras, microphones, pens, and other devices that
    allow people to interact with the interface directly with their hands and fingers,
    with their voice, or by moving their whole body.


    | CLI

    Command Line Interface

    Interaction based on a predefined set of textual commands. | GUI

    Graphical User Interface

    Interaction based on metaphors, with icons representing data and commands. | NUI

    Natural User Interface

    Interaction based on direct, natural manipulation of realistic objects. |


    The command-line interface makes you remember its strict syntax. Graphical user
    interfaces improve upon this by showing you what you can do at any given time,
    but you still have to remember what each thing on the screen actually means. Natural
    user interfaces are based on things you already know. In the best case, there’s
    nothing to remember—not how to do things (you do them as you would in real life)
    and not what things mean (they mean the same thing as in the real world).


    Trying to reproduce the real world is an admirable goal, since it makes learning
    and using a product easier. But, it also has its problems; I’ve already pointed
    out some of them in the chapter on the mental model (Chapter 9, The Mental Model,
    on page 77) and in the chapter on realism (Chapter 12, Realism, on page 120).
    In this chapter, I want to touch on some ideas related to natural user interfaces
    that I haven’t touched on before.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 13.1 Avoid Gesture Magic


    If you choose gestures, make sure they directly and immediately affect things
    on the screen in a familiar way that users understand from the real world. Gestures
    work best when the system gives constant feedback while the user is interacting
    with it. In *Designing Gestural Interfaces* [Saf08], Dan Saffer points out:


    > We''re used to instant reaction to physical manipulation of objects. (...) When
    engaged with a gestural interface, users want to know that the system has heard
    and understood any commands given to it. This is where *feedback* comes in. Every
    action by a human directed toward a gestural interface, no matter how slight,
    should be accompanied by some acknowledgment of the action—whenever possible and
    as rapidly as possible.


    This kind of interaction—where the user directly manipulates objects, rather than
    giving commands and then watching the results—is called *direct manipulation*,
    a term first used in this context by Ben Shneiderman, a professor of computer
    science at the Human-Computer Interaction Laboratory at the University of Maryland.¹


    Shneiderman notes that allowing people to manipulate objects directly makes the
    user interface easier to learn and allows the user to focus on her actual task,
    rather than the user interface itself.


    Scrolling through text by touching the text and moving the finger, for example,
    is an action that yields immediate feedback; as soon as the user starts moving
    her finger, the text starts scrolling. If the user does something wrong, it is
    immediately obvious that the gesture isn''t working, and she can try a different
    approach.²


    On the other hand, telling people to draw an S in order to save a document is
    bad. Like Harry Potter invoking a magic spell with his wand, the user has to finish
    making the gesture before the action executes. She receives no useful feedback
    while she is making the gesture, and if the gesture fails, it is not obvious why
    the system did not recognize it.


    1. For more, read Ben Shneiderman''s paper “Direct Manipulation for Comprehensible,
    Predictable and Controllable User Interfaces.”

    2. Though this interaction is not always easily discoverable, it can be made so
    by making sure that the last visible element of a list is only partially visible,
    showing the user that there is more content further down.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Furthermore, such “magic” gestures force users to remember which gestures correspond
    to which commands and how to execute a gesture. In that sense, it is no better
    than a command-line interface, except that the user is entering commands by moving
    his fingers on a screen, rather than by typing on a keyboard.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_131_0.png)


    Along similar lines, natural user interfaces often avoid “traditional,” established
    user interface elements such as visible menus or buttons. Features are sometimes
    hidden and accessed in a way that is not easily discoverable by the user—for example
    by touching and holding user interface elements until a menu pops up.


    The point is, for natural user interfaces more than for any other type of user
    interface, direct manipulation, visibility, and simplicity are important. People
    need to be able to figure out how to interact with the things on their screen
    without having to consult a manual.


    # 13.2 Recognizing Gestures


    When you observe people using a device with a touch screen, sooner or later you
    will see them repeatedly fail at one of the simplest gestures: swiping. Swiping
    is used in many applications—most prominently in book readers to move from one
    page of the book to the next. If it is so simple and used consistently across
    applications, why do people often fail at executing the gesture properly?


    One reason is that different applications implement the gesture slightly differently;
    the exact same swipe gesture may be recognized in one application but not in another.
    As a result, people may get used to swiping in one application but then get confused
    when the same gesture doesn’t work in another.


    A more important reason is that there is often no useful feedback telling the
    user the exact moment the device “accepts” the gesture. The user doesn’t know
    when he can stop the gesture, because he doesn’t know'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'at which point lifting the finger will cancel the gesture and at which point
    it will cause the application to jump to the next screen. These issues aren’t
    limited to swipes, of course. They affect all gestures. Don Norman explains the
    problem like this:³


    > Gestures lack critical clues deemed essential for successful human-computer
    interaction. Because gestures are ephemeral, they do not leave behind any record
    of their path, which means that if one makes a gesture and either gets no response
    or the wrong response, there is little information available to help understand
    why.


    The solution is not always obvious, but it often boils down to making it clear
    to users when the computer has recognized a gesture.


    Something as simple as a toggle switch can benefit from this. On a computer with
    a mouse, toggling a switch is easy; the user simply has to click it. There is
    little room for error.


    # GUIS ARE DIGITAL


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_132_0.png)


    SIMPLY CLICK TO TOGGLE THE SWITCH.


    # NUIS ARE OFTEN ANALOG


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_132_1.png)


    HOW FAR SHOULD THE USER DRAG TO TOGGLE THE SWITCH?


    In a natural user interface, interactions feel gradual and nuanced. Gestures don’t
    have a clear start and end, so it’s not always apparent when the user can stop
    sliding the switch. Giving feedback on when the gesture was successful tells the
    user when she is “done” and teaches her how to use the system more efficiently.


    Here’s an example from the official Twitter app. It tells people when they can
    stop making the gesture:


