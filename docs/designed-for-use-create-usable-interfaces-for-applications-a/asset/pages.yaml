- pgno: 212
  md: 'Not having that particular feature may have cost Dropbox a few customers, but
    this less-is-more philosophy made Dropbox incredibly easy to use and, consequently,
    the most popular application of its kind.


    Being feature-rich comes at a cost. Users are more enthusiastic about a product
    that does one thing incredibly well than a product that does everything kind of
    OK.


    In their book *Rework* [FH10], the people from 37signals explain that “we’re willing
    to lose some customers if it means that others love our products intensely. That’s
    our line in the sand.”


    # Takeaway Points


    +   - Adding more features can make your product more desirable to people who
    need those features but less desirable to the people who don’t. Usually, for any
    given feature, the second group is the larger one.

    +   - Use “The Five Whys” to evaluate user feedback and find the root of the problem.

    +   - Instead of adding a new feature, improve an existing one.

    +   - Try to add features that solve several problems at once and perhaps allow
    you to remove existing features from your product.

    +   - Consider the cost of a new feature as well as its benefits.

    +   - Focus on features that make your product better without increasing user
    interface complexity.

    +   - Provide an API and a plug-in architecture. Implement niche features as plug-ins,
    or leave them to third-party developers.

    +   - Do proper user research before adding new features to find out whether people
    really need the feature and what they need it for.

    +   - If you implement every “I just need this one feature” request, you end up
    with a product where most features are unpopular.

    +   - Accept that not every person needs to be your customer.'
