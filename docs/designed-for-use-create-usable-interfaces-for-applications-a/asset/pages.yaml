- pgno: 175
  md: '# 20.1 Nonobvious Modes


    In *The Humane Interface* [Ras00], Jef Raskin explains that “modes are a significant
    source of errors, confusion, unnecessary restrictions, and complexity in interfaces.”


    Modes are confusing when people do not realize what mode they are in—in other
    words, when they are nonobvious. The Caps Lock key, for example, indicates that
    it is active with a small light that is easily overlooked.


    Another example of a nonobvious mode is the currently active tool in an image
    editor:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_175_0.png)


    *QUIZ: IN ONE OF THESE TWO CASES, CLICKING AND DRAGGING WILL CREATE A RECTANGLE.
    IN THE OTHER, IT WILL CREATE A CIRCLE. WHICH IS WHICH?*


    Since people may not realize what mode the user interface is in, their actions
    may create unexpected results. Logging in doesn''t work properly, or the image
    editor creates a circle when the user wants to create a rectangle.


    Modes should be obvious even if the user doesn''t remember having activated them.
    For example, if you select the Open File menu command in Mac OS X, a modal dialog
    box opens. This mode is obvious to the user immediately after he has selected
    Open File, but if he then goes to get a cup of coffee and comes back to his computer
    five minutes later, he may not immediately realize that the computer is still
    in the Open File mode.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_176_0.png)


    Now, clicking the text window merely makes the computer beep, and it may not be
    immediately apparent why this occurs. Of course, in this particular case, the
    mode isn''t necessary at all. There is no reason why the Open File dialog box
    needs to block the whole application. However, in other cases, simply getting
    rid of the mode doesn''t work. For example, an application installer may ask for
    the user''s password:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_176_1.png)


    If we got rid of the “asking for the user’s password” mode, the user could activate
    the installer window with the password window still open but then couldn’t continue
    with the installation. This is even more confusing than not being able to activate
    the installer window at all. You can’t always get rid of modes; you just have
    to make it clear to the user what exactly is going on.'
  merge: -1
