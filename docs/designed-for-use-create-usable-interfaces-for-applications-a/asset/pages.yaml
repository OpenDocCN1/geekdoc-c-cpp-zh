- pgno: 58
  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_58_0.png)


    This is a very simple user interface, but even so, it implies a hierarchical structure.
    For example, buttons inside a tab only apply to other things inside that tab.
    If you hit the “back” button, anything outside of the currently active tab won’t
    be affected. But if you hit the window’s “close” button, the whole window will
    be closed, including both open tabs. Buttons affect only things that are on the
    same or on a lower hierarchical level.


    # 7.1 Creating Hierarchical Structure Visually


    If you look at any user interface, usually you can discern a hierarchy of user
    interface elements relatively quickly. Most Western users understand intuitively
    that hierarchies go from left to right, from top to bottom, and from outside to
    inside. Here are several examples showing representations of A hierarchically
    above B:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_58_1.png)


    For example, take an MP3 player that shows the currently playing track of an audio
    book. How would you arrange the following elements: track number, chapter number
    inside a track (for audiobooks, or podcasts with chapter markers), and the playhead’s
    current position in the chapter? Obviously, the relationship between these elements
    is as follows:


    Track→Chapter of current track→Playhead position in current chapter'
