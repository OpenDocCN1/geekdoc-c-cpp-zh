- pgno: 95
  md: '# 10.1 Designing the Structure


    In *Rework* [FH10], Jason Fried and David Heinemeier Hansson write that “architects
    don’t worry about which tiles go in the shower or which brand of dishwasher to
    install in the kitchen until *after* the floor plan is finalized.”


    This is what flow diagrams and storyboards are: your product’s floor plan. We’re
    at the very beginning of the “design” part of our design process. Flow diagrams
    and storyboards are not about details. They are about the big picture: the structure.


    # 10.2 Flow Diagrams


    Flow diagrams answer the following questions: What does the user have to do to
    get what he wants? What steps does she have to follow to reach her goal?


    Pick the most important user goals, and think about the required steps.


    For our Twitter app example, a simple flow diagram for replying to a message would
    look a bit like this:


    # REPLY TO A MESSAGE


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_95_0.png)


    It’s OK to add branching to flow diagrams, but don’t make them too complex. In
    theory, you could have one enormous flow diagram that describes your whole product.
    In reality, it makes more sense to create several flow diagrams for the most important
    user goals. That way, you can keep the individual flow diagrams concise and clearly
    arranged.


    The goal of this exercise is to think about what’s involved in each goal. What
    kinds of screens do you need to show to the user? What kinds of decisions does
    he have to make at what point?'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 10.3 Storyboards


    Storyboarding is a technique originally developed to plan animations for movies.
    Storyboards break animations down into their important frames; they turn a moving
    picture into a comic book. In user interface design, we use storyboards for a
    similar purpose. They break down the user’s path into a series of snapshots.


    Storyboards mostly ignore branching and focus instead on interaction details.
    What exactly is the user seeing on each screen? What do you want the user to do?
    Where should you use animations or graphics to help the user understand what he
    should do?


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_96_0.png)


    You can indicate where and how interactions happen by drawing arrows or hands
    (if it’s a touch-screen user interface).


    Making storyboards can take a lot of time, so you want to use them only for those
    parts of the application where the design is not obvious. Everybody who is familiar
    with comic books can follow a storyboard—it’s a great tool for communicating design.
    If you need to explain to a programmer how to implement something, storyboards
    can be a huge help.


    # 10.4 Sketching


    After architects design the floor plan, they design the individual rooms. After
    you design the structure of your product, you want to design the individual screens.
    By making flow diagrams and storyboards, you should have a pretty good idea of
    what screens your product requires and what functionality each screen should provide.


    You’ve already done simple sketches of some of the screens while doing storyboards.
    In the storyboard example, some of the screens already'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'contained things that were unrelated to the task performed in the storyboard.
    For example, the pop-over menu didn’t just have a “reply” button; it also had
    a “retweet” button. Now, we want to nail down the contents of the individual screens.


    Usability consultant Bruce Tognazzini notes:[^1]


    > > Jumping into complex, finely-tuned prototypes is perhaps the worst mistake
    a team can make. (...) Users (and clients) [feel more free] to express contrary
    views if models look less than perfected. But there’s another side, too: designers
    and developers are more willing to listen to dissent if they haven’t lavished
    ultimate care on what should have been a storyboard or quick-and-dirty prototype.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_97_0.png)


    Experiment with using simple sketches to figure out how individual screens should
    look at a very basic level. Everybody can sketch, so you’re free to involve other
    people in the process. Show them your ideas, and see whether they come up with
    their own.


    Once you’re happy with the basic design of your screens, move on to wireframes.


    [^1]: Read more at http://www.asktog.com/columns/005roughsketches.html.'
  merge: -1
