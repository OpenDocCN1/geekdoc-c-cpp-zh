- pgno: 42
  md: 'One company that starts product design by writing a press release is Amazon.
    Werner Vogels, Amazon''s CTO, notes¹ that “writing a press release up front clarifies
    how the world will see the product—not just how we think about it internally.”


    Similarly, you can try writing an ad or even just a slogan for your product. Can
    you describe your product in a single sentence? If not, why not?


    # 5.5 Talk About Tasks


    Whether you''re writing the manual, writing a blog post, or recording a screencast,
    it''s always a good idea to talk about tasks, rather than features.


    Documentation often simply explains how the individual features of a product work.
    But unless you are creating the most basic of products—say, an alarm clock—explaining
    individual features is not particularly helpful. People don''t want to learn how
    to use features; they want to learn how to do things. People have goals, and they
    use your product because they think it can help them reach these goals.


    For example, rather than describing in your blog post how layers work in a photo
    editor, explain how to frame a photograph and add cool effects to it—and include
    layers in that process. Rather than showing in your manual how tabs work in a
    word processor, explain how to design a beautiful letter—and explain tabs as part
    of this.


    In their book Getting Real [FHL09], the guys at 37signals recommend that “if you
    do find yourself requiring words to explain a new feature or concept, write a
    brief story about it.” Avoid technical details. Instead, just talk about it.


    Think of yourself as a teacher, rather than a technical writer.


    # The BizTwit Case


    To clearly define what BizTwit does, the design team has written a blog post that
    could be used to introduce the product once it is finished.


    1. You can read more of his thoughts on the topic at http://www.allthingsdistributed.com/2006/11/working_backwards.html.'
