- pgno: 106
  md: 'whether I could show you some of these designs and ask you a few questions
    about them to see whether people can figure them out? It won’t take more than
    five minutes.


    You can start doing this with friends and family members to get used to running
    these tests. Then, ask random people. A good place to start is a café. People
    usually have a few minutes to spare.


    Once you see how people interpret your designs, it will be easy to figure out
    where your designs work and where potential problems lie.


    # 11.2 Running Full Usability Tests with Paper Prototypes


    The simple tests I''ve described so far will allow you to do some early usability
    testing on your designs. There is, of course, a much more elaborate way of doing
    prototype testing. I don''t recommend this process for most smaller teams, but
    if you have the time and the people required to do such tests, they can give great
    feedback even before a single line of code is written.


    A prototype typically represents only a subset of your finished product. Not every
    screen of your final product will be part of your prototype. Not every feature
    will be represented. For this reason, prototype usability tests are almost always
    based on specific tasks: you will give a person a specific task and ask that person
    to execute that task on your prototype. That way, you have a pretty good idea
    of what screens and UI elements you will need to prepare.


    So, the first thing you want to do is define tasks you want to test.


    # Defining Tasks


    Now that you’ve created a storyboard and mock-ups, you probably have a pretty
    good idea of where potential user interaction problems might be found. If it was
    hard to come up with a user interface for a feature, this is probably something
    you want to test early. If it is a critical, central feature of your product,
    it’s definitely something you want to test early. Pick the features that are important
    to your product, that you think might be hard to use, or that you think might
    cause problems.


    Next, come up with tasks that use these areas of your product. You can draw upon
    the user research you did in the first part of the book, if you need.'
