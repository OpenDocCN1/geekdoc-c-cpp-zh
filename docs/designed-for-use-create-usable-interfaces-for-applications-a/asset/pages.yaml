  md: '# 28.5 How to Find Testers


    There are many different avenues you can use to find testers. Here are some ideas
    to get you started.⁴


    +   - *Friends and relatives.* The easiest way to start recruiting testers is
    to ask friends and relatives. It’s OK to reuse testers, but don’t overdo it by
    using the same people over and over. I would advise against using workmates for
    testing, since they tend to have at least some level of insight into your product
    that normal users won’t have.

    +   - *Professional recruiting agencies.* There are professional recruiting agencies
    that will help you find testers, but definitely compare costs before committing
    to one of them. If you use agencies, you’re a bit more likely to get people who
    regularly participate in such tests, which is not always what you’re looking for.

    +   - *Through your website.* You can also look for testers through your website;
    the downside there is that you’re likely to get existing users of your product.

    +   - *Through a local newspaper.* Simply putting an ad in a local newspaper often
    works out well. If you live near a university, they probably have a pinboard where
    you can advertise for testers.


    Keep in mind that depending on how the testers were recruited, it might be necessary
    to compensate them.


    # 28.6 Different Types of Tests


    If you’re doing a paper prototype, you’re quite restricted in how you can run
    usability tests. The nature of a paper prototype pretty much dictates how you
    test it. Usability tests with actual running code are more forgiving, and there
    are different schools of thought on how they should be run. I’ll roughly group
    them into three different types of tests: moderated tasks tests, unmoderated tasks
    tests, and free-form tests.


    Since the type of test determines how you prepare for it, I’ll introduce the different
    types of tests now and explain how to run each test later.


    4. Christine Perfetti offers some additional ideas in this great video introduction
    to usability testing: http://uxideas.com/shows/usability_tests_nutshell/.'
