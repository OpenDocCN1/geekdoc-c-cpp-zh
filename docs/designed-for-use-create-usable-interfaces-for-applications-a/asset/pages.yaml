    # Disadvantages


    There are a number of downsides to moderated remote testing, compared to in-person
    testing.


    Because you aren''t sitting next to the tester, you miss out on a number of physical
    cues. Is the tester getting agitated or frustrated? It''s hard to tell when doing
    remote testing, so you need to pay particular attention to this and be prepared
    to stop the task if the tester shows signs of fatigue or annoyance. Pay attention
    to the tester''s tone and choice of words.


    Additionally, you can''t see what the tester is looking at. If you get confused
    by what the tester is doing or are not sure whether the tester is still engaged
