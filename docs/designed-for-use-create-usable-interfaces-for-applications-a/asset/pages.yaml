    For Windows PCs, TechSmith offers a number of different solutions.²


    For Linux, use something like xvidcap.³


    # What Should You Do with the Results?


    You need to list the problems you’ve found. Prioritize them. Fix the most important
    ones. Test again. Don’t worry if it’s impossible to fix all problems; if a problem
    is important and you haven’t fixed it, it will eventually reappear in a future
    test.


    If more than one person is observing the test, do a Post-it post-mortem. Have
    everybody write their ten most important issues on Post-it notes. Stick them on
    a wall, placing duplicate issues next to each other. Pretty quickly, it’ll be
    clear which problems get more “votes” and should be fixed sooner.


    Don’t write reports unless it’s really necessary, because they often create more
    work than simply fixing the problems would. Usually, no one reads these reports
    anyway. Instead, identify the most pressing issues, and make sure these get fixed.


