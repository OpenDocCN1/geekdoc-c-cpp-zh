    with the tester decreases the quality of the graphics on her end and produces
    a small delay between input and response, which can be very irritating to many
    people and may skew the test results.


    # Advantages


    I’ve already mentioned that one potential advantage of remote testing is that
    you get to test your product in the tester’s natural surroundings. This is not
    the only advantage that remote testing offers.


    Another huge advantage of remote testing is that it allows you to easily recruit
    testers if you have a website that is reasonably well visited.


    Also, you pretty much eliminate the chance of unduly influencing the tester. Since
    remote testers can’t see your facial expressions or body posture, they won’t be
    influenced by your behavior.


    And, of course, remote testing makes it easier to schedule testers—you don’t have
    to physically meet them and can even eliminate scheduling altogether.'
