- pgno: 27
  md: 'While at ACME Corp we meet with the three people who update the Twitter account
    to find out when and how they use Twitter. At the end of each half day, we take
    30 minutes to ask them some specific questions.


    During our visits, we notice that the CEO of the company starts his workday by
    browsing articles related to ACME Corp’s industry. Sometimes he publishes links
    to articles he likes on the company’s Twitter account. For the rest of the day,
    he occasionally checks Twitter but rarely writes or responds to messages. He writes
    about two or three messages a week. He currently uses a desktop Twitter app to
    do this, but during the interview, he explains that he sometimes posts from his
    cell phone when he’s not at the office.


    The second person who publishes to ACME’s Twitter account is the company’s PR
    representative. It’s his job to get the company mentioned in trade magazines,
    and when a magazine covers the company, he writes about it on Twitter. He publishes
    a message on Twitter about once a week.


    The last person to publish messages on the company’s Twitter account is an engineer,
    who is tasked with writing messages during the company’s events, when the CEO
    and PR rep are busy talking to guests. During such events, she’ll mostly post
    short messages from her cell phone, describing new announcements made at the event.
    She rarely posts to Twitter, but when she does, she may post a half dozen messages
    within one or two hours.


    While we are interviewing each of these three people after shadowing them for
    half a day, some additional ideas come up. The PR rep says:


    > > One of the issues I have is that our CEO tends to make typos while publishing
    Twitter messages from his cell phone. It would be great if I could somehow correct
    his messages.


    The engineer explains:


    > > During our events, the people who normally do these things are busy, so it’s
    up to me to publish updates on Twitter. But I’m not a trained writer, and I often
    worry that the things I write sound too colloquial or don’t properly represent
    what I’m intending to say.


    ACME Corp is just one company we visit to find out what kinds of problems our
    Twitter app BizTwit should solve; however, these three people alone have provided
    very valuable information that helps us understand what kinds of problems our
    product needs to solve.'
