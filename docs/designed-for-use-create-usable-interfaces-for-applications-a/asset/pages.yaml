  md: '# Takeaway Points


    +   - Usability testing can be simple yet still yield useful, actionable results.

    +   - Run informal, guerilla-style usability tests whenever you need to test a
    change to the user interface.

    +   - Prepare for the test by installing your product on a portable device, making
    sure it runs, and coming up with some simple tests.

    +   - Go to a nearby café or find bored people in your office building. Ask them
    whether they''re willing to spend five minutes helping you out.

    +   - If you find a tester, explain how the test works, explain the premise of
    your product, and give him or her a simple task.

    +   - Don''t interrupt, unless you feel the tester is getting frustrated or is
    stuck. Take notes.

    +   - After a few tests, you''ll have a pretty good idea of where your user interface
    still has issues. Fix them, and then test again.'
