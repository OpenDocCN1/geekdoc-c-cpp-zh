    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_178_0.png)


    But what does "HDR On" actually mean? Does it mean that I can turn on HDR by touching
    the button, or does it mean that it is currently on and I can turn it off by touching
    it? In The Humane Interface [Ras00], Jef Raskin recommends using checkboxes or
    radio buttons to indicate active modes.


    ☒ HDR


    This is unambiguous.


    3. High Dynamic Range images combine pictures with different exposures to create
    an image that shows greater dynamic range than the camera would normally be able
    to produce.'
