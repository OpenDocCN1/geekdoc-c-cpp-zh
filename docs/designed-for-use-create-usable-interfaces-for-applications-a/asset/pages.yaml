  md: '# People Don''t Like to Be Insulted


    At folklore.org, Andy Hertzfeld recounts a funny experience that occurred while
    doing usability testing for Apple’s Lisa computer.* He explains that the two default
    buttons in dialog boxes were originally called Cancel and Do It. In usability
    testing, however, they found out that a few users regularly clicked Cancel when
    they should have clicked Do It instead. When they talked to a user who seemed
    particularly confused by the dialog box, he replied “I’m not a dolt; why is the
    software calling me a dolt?”


    People simply didn’t notice the space between “Do” and “It” and read it as “Dolt.”
    As a result, the Lisa team changed “Do It” to “OK.”


    * Read the full story, and many other interesting stories about the development
    of the Mac, at http://www.folklore.org/StoryView.py?project=Macintosh\&story=Do_It.txt\&sortOrder=Sort%20by%20Date\&detail=medium\&searc


    or was entered incorrectly, the remaining information can be used to determine
    likely candidates for the specific page the user was trying to open. How about
    something this:


