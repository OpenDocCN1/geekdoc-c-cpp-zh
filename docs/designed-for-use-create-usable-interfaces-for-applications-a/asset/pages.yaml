- pgno: 283
  md: '# Partitioning Users


    Partitioning users into two groups is pretty simple when testing a desktop application.
    Give each user one of the builds at random when he downloads your app; typically
    each user downloads the app only once, so you don’t have to worry about individual
    users switching from one design to the other. Similarly, if both designs are in
    the same build, pick a design at random when the user first launches the application,
    and store the design you’ve picked as a user setting.


    Dealing with a website is a bit more complex. One way of picking a design for
    each visitor is to use a modulo of the hash of the visitor’s IP address to determine
    which design to show* and then set a cookie indicating which design to show on
    the user’s computer. For repeat visitors, first check whether they have a cookie,
    and if they don’t, fall back to the IP address to determine which design to show.
    This system is not entirely fool-proof (users might not allow cookies and change
    their IP address), but it should cover almost all cases.


    *, Since IP addresses are not random, simply taking the modulo of the IP address
    itself would skew the number of people in the different partitions; applying a
    hash function to the IP address removes that bias.


    bring you to a local maximum of usability. Making many incremental changes will
    get you to a good design but may not get you to the best design possible.


    Imagine all possible designs for your product. Some of them are more usable; others
    less. If you could plot them on a graph, you might get something like this:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_283_0.png)


    If you change your design, the usability changes.'
