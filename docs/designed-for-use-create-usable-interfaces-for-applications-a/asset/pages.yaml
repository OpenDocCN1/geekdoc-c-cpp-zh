- pgno: 192
  md: 'Keep in mind that in real life, stuff doesn''t move on its own. In a spatial
    system, people expect to be able to find things where they left them. Make sure
    you never change things behind the user''s back.


    Spatial systems tend to break down when users have to manage large numbers of
    items. It''s easy to create and keep track of a spatial arrangement of dozens
    or hundreds of items. It becomes harder when it''s thousands of items, and it
    becomes almost impossible when the system has to manage hundreds of thousands
    of items.


    # 22.3 Time


    Millennia of living in a spatial world have taught humans how to organize and
    find things in such a world. Similarly, we have become pretty good at thinking
    about and organizing our world in temporal terms.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_192_0.png)


    Although you may not remember exactly where inside a folder you''ve filed that
    report you wrote last week, you know for sure that you wrote it last week. You
    probably also remember the time of day it was, and you may even remember the specific
    day as well.


    So, depending on your product, it may make sense to let users access their data
    in some kind of temporal view. Nintendo does a pretty good job of this; instead
    of a file system, Nintendo likes to use calendars to'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'show user-created data. Using a Nintendo system, you never have to file a drawing
    or photograph you''ve made; instead, you just have to remember the month when
    you made it, and you''ll probably be able to see a small version of the picture
    in the month view.


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_193_0.png)


    Another example of an application that uses a temporal view is Media Atelier''s
    Mac app Alarms⁷—a to-do list that eschews the traditional hierarchical list view
    used by other task lists, opting instead for a temporal view in which to present
    to-do items.


