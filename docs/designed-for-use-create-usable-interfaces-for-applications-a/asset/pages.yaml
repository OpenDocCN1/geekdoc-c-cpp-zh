  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_158_0.png)


    # Chapter 17


    # Discoverability


    Designers use *Discoverability* to mean whether users will be able to find and
    use a feature. Discoverability is important—from the user’s point of view, there’s
    no difference between a feature she can’t find or can’t use and one that doesn’t
    exist.


    # 17.1 What to Make Discoverable


    Discoverability often involves a trade-off. Make one thing more discoverable,
    and it may detract from other things. So, you want to start by deciding which
    features to make more discoverable and (conversely) which parts of your product
    you can make less discoverable. Sometimes it’s even OK to hide a feature if you
    know that the people who require that feature will be able to find out how to
    use it.


    For example, a lot of browsers ship with features used only by web developers.
    These features are turned off by default, but the target audience is assumed to
    be capable of finding out that the features exist and knowing how to activate
    them. As Figure 17.1, on the next page shows, in Safari this involves opening
    the settings window, switching to the Advanced tab, and checking the “Show Develop
    menu in menu bar” checkbox.


    Once you’ve decided which features must be easily discoverable and which ones
    can be relegated to the background, you need to assign weights to the important
    features. You can’t make every feature equally obvious.'
