  md: 'Here''s how this is arranged in the iPod app on iPhones:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_59_0.png)


    The chapter number and track number are shown in “reverse” order, with the current
    track''s chapter number appearing above the track number:


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_59_1.png)


    This visual arrangement implies the following, wrong hierarchy:


