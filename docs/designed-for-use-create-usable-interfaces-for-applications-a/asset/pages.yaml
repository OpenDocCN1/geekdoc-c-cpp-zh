  md: 'descent to sort animals into a hierarchy. That’s useful if you’re interested
    in how closely individual species are related to each other, but it’s useless
    if you’re compiling a list of all animals that are poisonous to humans, or a list
    of all aquatic animals. Allowing users to maintain metadata for the individual
    items in a hierarchy allows them to maintain data that is not expressed by the
    hierarchy itself.


    # Support Alternative Ways of Accessing Data


    Even if items are primarily sorted into a hierarchy, you should allow users to
    access this data in nonhierarchical ways. For example, you should let people search
    through their data. Similarly, if you keep track of when individual items were
    changed, you can let people access their hierarchical data in a temporal view.
    Think about how people might want to search or browse through their data.


    # The BizTwit Case


    Since every published Twitter message has a publication date, offering people
    a temporal view of their messages makes a lot of sense and makes it easy to go
    back to earlier conversations.


    BizTwit lets people schedule messages that will be published automatically on
    a specified date. The temporal view could be expanded to include such messages,
    which would prevent any ambiguity about when messages will be published. Figure
    22.1, on the next page shows a wireframe of how such a user interface might look.


    In this view, people can filter what kinds of messages they want to see (sent
    messages, replies from other people, drafts, scheduled messages, or all messages).
    The dots in the individual days indicate the day’s activity, from zero dots (no
    messages were sent or received) to three dots (lots of messages were sent or received).
    For days in the future, dots indicate scheduled messages. Finally, tapping a day
    shows the day’s messages. This kind of view should be familiar to anyone who uses
    calendar apps.


    This user interface gives people a quick overview over their Twitter account’s
    activity, allows them to easily find past messages, and lets them quickly see
    what messages are scheduled to be tweeted when.


    # Takeaway Points


    +   - Sometimes, hierarchies work well, but they need to be obvious and commonly
    accepted.'
