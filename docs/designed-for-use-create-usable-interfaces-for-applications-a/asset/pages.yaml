  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_286_0.png)


    # Chapter 34


    # Collecting Usage Data


    | Research | Design | Implementation |


    # What''s the Technique?


    Now that you''ve designed and released your product, it''s done, so your job is
    done as well, right? Well, application and website design is never really done.
    When people start to use your product, it''s time to figure out how well your
    design works and what people do with your product. This chapter presents some
    ideas that help you do exactly that.


    # Why Is This a Good Idea?


    When your product is out in the wild, people use it in ways you never expected.
    You need to know what people actually do in order to know how to improve your
    product.


    # Are There Any Prerequisites?


    Yes. You need to have a working, released version of your product.


    # 34.1 Measure Speed


    Performance matters. If your product involves a lot of waiting, people will not
    like the experience. You can and should test your product''s performance while
    it is still in development, using test data. But you just know that your users
    are going to do crazy things with your product— things you never even thought
    about.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'If you’re writing a DVD cataloging application that allows people to keep track
    of the movies they own, you might assume that most people would own no more than
    200 DVDs, so you might make sure that your product performs well for collections
    around that size. In reality, a sizeable portion of your customers are movie collectors
    (this being their reason for buying your product in the first place). So instead
    of keeping track of hundreds of DVDs, they might want to keep track of *tens of
    thousands* of DVDs.


    Or let’s consider a website that allows freelancers to track the time they spend
    on their various projects and clients. The service might perform beautifully during
    testing, so you figure you could just take the performance you saw during testing
    and linearly scale up from that to the number of users you expect to have after
    launch. However, this assumes that each of your users will hit your sites in (what
    appear to you as) random intervals. Consider what happens once you release your
    product and people start using it. Every morning, many of the users living in
    the same time zone start working at roughly the same time. They all fire up their
    computers, open your website, and start working on a project. In other words,
    all of them are hitting your service at the same time, causing a spike in traffic.
    Instead of access being spread out over the whole day, you get peaks and valleys
    of traffic. How does your service perform during the peaks? Will your users’ first
    experience every day be a bad one, because your servers are not able to cope with
    the sudden peak in demand?


    Once you’ve finished your product and people start using it, make sure to keep
    track of how well it performs in real-world situations.


    For more on how fast your product has to be, go back to Chapter 23, *Speed*, on
    page 198.


    # 34.2  Exit Points


    One of the questions you want to answer when looking at how people use your product
    is “when do people stop using it?” The point at which people exit your product
    can tell you a lot about the kinds of problems they are experiencing. Are they
    exiting the product once they’ve finished a task? In that case, you’re probably
    in the clear. Are they exiting the product in the middle of a task? For example,
    are they abandoning a full shopping cart in your online store? If so, you probably
    have a problem somewhere. Maybe people are getting bored with your product. Maybe'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'they don''t understand how to finish a task. Maybe they''re not sure what will
    happen when they continue. But something is probably going wrong.


    Exit points in the middle of tasks are indicators of usability issues. Keep track
    of them in order to find out where potential issues with your product lie.


    # 34.3 Measure Failure


    It’s often obvious when your product has failed its users, so this is one area
    where it can be simple to get useful data on areas that require improvements.


    If your users encounter a 404 page or a similar error when using your website,
    you know that something went wrong. Keep track of such errors and of the referring
    sites, and fix the issues if possible.


    If your users search for something and get zero search results or don’t click
    any of the search results they receive, it might make sense to look at the search
    string they entered and try to figure out why they didn’t find what they were
    looking for. Is there anything you can do to fix this issue?


    Whenever people undo something, it might be because your product didn’t do what
    they expected it to do. Keep track of what people do before they undo their changes.


    Although crashes are not, strictly speaking, usability issues, they are clearly
    very detrimental to the user experience. Make sure to give your users a simple
    way of reporting crashes to you and fix the issue whenever possible (and sometimes
    even when impossible).


    Similar to how game designers measure where exactly people die in games (see Chapter
    26, Learning from Video Games, on page 220), you can measure where your product
    fails and fix these problems.


    # 34.4 User Behavior


    After you have deployed your product, you can start running analytics on it. Which
    links do people click, and which ones do they never use? Which features are popular,
    and which ones are not? Services'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'like ClickTale and Crazy Egg¹ allow you to get information on how your users
    behave. Use this information to evaluate design and feature ideas or even to help
    decide which features you can remove. (See Chapter 25, Removing Features, on page
    215 for a bit more on that.)


    This doesn’t just apply to websites. You can also give users of a desktop application
    the option of regularly sending you usage data.


    Once somebody consents to sending you data, you need to determine what kind of
    data is useful. Microsoft’s Jensen Harris writes² that “we collect anything we
    think might be interesting and useful as long as it doesn’t compromise a user’s
    privacy.”


    Microsoft collects keyboard shortcuts people use, how much time people spend on
    different tasks, even what and how much people create (such as how many mail folders
    they have), and much more. The better you know what your users actually do, the
    better informed your design decisions are.


    When your product has been out in the wild for a while, you can also start doing
    usability tests with experienced users or visit some of your users and observe
    how they actually use your product (as opposed to how you envisioned your product
    would be used in the real world—the two are often vastly different).


    # Takeaway Points


    +   - Once your product is being used by real people, it’s time to start measuring
    how well it performs.

    +   - Speed is one important aspect of performance, because it’s often hard to
    figure out how well your product performs until it’s in your users’ hands.

    +   - Keep track of exit points, since they indicate potential issues with your
    product.

    +   - Measure failures such as broken links, empty search results, or crashes.

    +   - Measure user behavior to get a better grasp of where to improve your product,
    which features to add, and which ones to remove.


    1. Find these services at http://www.clicktale.com and http://www.crazyegg.com.

    2. You can read the whole essay at http://blogs.msdn.com/b/jensenh/archive/2006/04/05/568947.aspx.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '• Now that people are getting their hands on your product, it’s not time to
    stop designing. It’s time to look into what people actually do with your product
    and how you can use that information to make it even better.


    # Further Reading


    Jensen Harris, director of Program Management for the Microsoft Windows User Experience
    Team, writes a fascinating blog. He often writes about how Microsoft uses data
    when making design decisions.'
