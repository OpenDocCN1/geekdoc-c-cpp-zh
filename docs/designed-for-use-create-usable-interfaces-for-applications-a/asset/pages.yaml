    ways in which gamers hold their mice. The mouse sensitivity can be adjusted on
    the fly. It has removable weights so that people can make the mouse heavier or
    lighter. It’s also a wired mouse. It’s wired because people who play action games
    dislike the slight input lag that wireless connections can cause.


    All of these features make this mouse perfect for its target audience, but many
    of these same features make the mouse less desirable to people who are not in
    its target audience. A wired mouse with fifteen programmable actions and removable
    weights is essentially unusable for most people.


    The mouse on the right is *complex*. This means it’s some people’s perfect mouse,
    but it also means many people will not be able to use it.


    Whether you want to focus on users or on activities depends on the specific nature
    of your product. Each design process creates different outcomes; deciding early
    where your focus lies is important.


