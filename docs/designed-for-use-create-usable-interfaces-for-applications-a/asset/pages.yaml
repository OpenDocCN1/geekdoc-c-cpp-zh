    of all, it''s important to avoid influencing the tester. This is especially relevant
    when the tester gets stuck and starts asking questions. Once it becomes obvious
    that the tester won''t be able to solve the problem by herself, it''s OK to give
    a hint (or move on to the next task), but generally, the facilitator must take
    care not to lead the tester.


    At most, the facilitator can ask questions but, again, should make sure not to
    accidentally influence the tester by offering hints on how to use the design.
    Avoid terminology seen in the design. The facilitator''s questions should be as
    generic as possible, along the lines of “What are you thinking right now?” or,
    if the tester is stuck, “Tell me what you see on that screen.” For more common
    mistakes made during usability tests, see Chapter 31, How Not to Test: Common
    Mistakes, on page 268.


    Generally, as long as the tester seems occupied by the interface, it''s best to
    remain silent. After all, people using your product at home don''t have one of
    your employees looking over their shoulder, constantly asking them how they feel
    about your product.


    The facilitator should avoid doing anything that may make the tester feel uncomfortable.
    Having people observe your errors can already be stressful; don''t add to the
    stress. If the facilitator notices that the tester is getting frustrated, it''s
    OK to intervene and offer a bit of help, encouragement, or even a quick break.
    Indicators that intervention is necessary are the tester asking for help, the
    tester starting to blame herself for problems, or the tester getting stuck. Make
    sure to avoid sounding condescending when you offer encouragement or a break.


    The computer''s job is to update the prototype based on the tester''s input. If
    everything goes as planned, with paper prototype testing this mainly consists
    of replacing the current screen with a different screen or adding and removing
    Post-it notes of interface elements as needed. In some cases (for example, when
    the tester uses the search function), the computer can also erase things from
    screens or write text onto screens. For data-heavy applications, especially if
    they include a promi-'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'nent search feature, it may make sense to prepare some screens that you''ve
    already filled in with data for the path you expect the tester to take.


    Sometimes, the tester takes a route nobody expected. In those cases, the computer
    can create a quick mock-up of the screen, or, if the tester goes too far off track,
    the facilitator can intervene and either stop the test or bring the tester back
    on track.


    After the tester has finished the first task, both the facilitator and the computer
    can take a minute to ask any questions they might have and didn''t want to (or
    could not) ask during the test—for example, “You hesitated before clicking the
    Buy button; do you remember what went through your head at that point?” Personally,
    I prefer it if the facilitator doesn’t ask too many questions during the test
    and instead waits until the task is finished. This makes it less likely that the
    facilitator influences the tester’s behavior. The disadvantage is that the testers
    often don’t clearly remember exactly what they did during the test or why they
    did something.


    Once this is done, give the tester the next task, and have her continue with the
    test.


    When the last task is over or you''re about to run out of time, you can finish
    up by asking the tester for some opinions, if you want. Opinions are generally
    not what we''re looking for, but people sometimes come up with interesting thoughts
    after a test. For example, you could ask what the tester didn''t like about the
    design, whether she would use your product, and what she would use it for.


    It''s a good idea to ask what the tester thought of the whole experience. As a
    sort of meta-test, the things people point out after such a test can often be
    useful input for improving future tests.


    Finally, thank the tester again for her time, and make sure she understands that
    the results of the test were helpful to you.


    # Analyzing the Results


    Avoid any kind of statistical or formal evaluation. Usability tests provide qualitative
    data, not quantitative data. It would be misguided to do formal analyses of the
    results of such a test. It would also be unnecessary. In fact, even from merely
    looking at a video of a usability test, it is usually quite obvious where the
    big problems are.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Instead of investing a lot of time into analyzing the results, identify the
    problems, prioritize them, let each team member pick the ones they want to solve,
    let them come up with possible solutions, make the changes to the design, and
    test again as soon as possible (with another set of testers).


    # ## Knowing When to Stop Testing


    So, how do you know when your design is good enough and you can stop doing usability
    tests?


    Basically, you don''t stop testing. Testing is a constant part of the development
    process. During this process, as you iron out the problems with your paper prototypes
    and move toward writing real code, you will also gradually move from testing paper
    prototypes toward testing running code. However, paper prototyping will remain
    a valuable tool every time you work on a major design change. It’s always easier
    to test such changes on paper first and implement them in code only once you’ve
    settled on a workable, tested design.


    # ## Takeaway Points


    +   - To know how to improve sketches and mock-ups, test them with real people.

    +   - Tests don’t have to be complex. Show sketches to people, and ask them simple
    questions.

    +   - For more extensive tests, define tasks that touch critical areas of your
    product. Prepare at least five or six tasks. Each should take between two and
    ten minutes. Tasks should not be prescriptive.

    +   - Print out the tasks on individual pieces of paper.

    +   - Recruit three to five testers, and schedule them about two hours apart.

    +   - You can run the whole test on your own, but it’s best if you focus on simulating
    the computer and have another person act as the facilitator.

    +   - Prepare all the screens people are likely to progress through while doing
    your tasks. Screens should not be too crude. People unfamiliar with your product
    should be capable of reading them.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '+   - Add the surrounding user interface elements (such as browser windows
    around sketches of a website) where necessary. Create the pop-up elements you
    might need.

    +   - Do a test run of each task to make sure you’ve prepared all of the screens
    and pop-up elements you’re likely to need.

    +   - When the test starts, explain to the tester what is going on. Make sure
    to emphasize that you are testing the design, not the tester.

    +   - Make a checklist of everything you want to say, and check off the points
    as you make them during the introduction. Don’t forget to have the tester sign
    the consent form.

    +   - Explain how the tester should interact with the “computer.” Allow him or
    her to draw on top of your prototype.

    +   - During the test, avoid influencing the tester. Don’t make the tester feel
    uncomfortable. Intervene when you feel that the tester is getting frustrated.

    +   - After the test, do a short debriefing, and thank the tester for her help.


    # Further Reading


    Carolyn Snider has written the definitive book on paper prototyping. It’s called
    *Paper Prototyping: The Fast and Easy Way to Define and Refine User Interfaces*
    [Sni03]. If you’re serious about paper prototyping, you need to read it.


    Userfocus has a neat article about paper prototyping with links to more resources.³'
