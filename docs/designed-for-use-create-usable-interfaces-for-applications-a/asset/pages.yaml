  md: '# Typing Web Addresses


    This book contains a lot of web addresses. Some of them are pretty long. Maybe
    you’re reading a printed version of this book. Copying these long addresses from
    your book to a web browser can be cumbersome. To make it a little bit easier,
    I’ve set up http://designedforuse.net. This site contains a list of all the long
    addresses in this book. Instead of typing a long address, type http://designedforuse.net,
    and click the link there.


    obvious: people get into bike accidents, helmets prevent injuries, people who
    wear bike helmets can avoid injuries. Conclusion: force people to wear helmets.


    Over the years, a number of bike-helmet laws have been introduced. However, these
    laws have not led to the predicted outcome.


    In a 2009 study titled “The Health Impact of Mandatory Bicycle Helmet Laws,”²
    Piet de Jong, from the Department of Actuarial Studies at the Macquarie University
    in Australia, evaluated the effects of such laws. He discovered that people really
    don’t like bike helmets, so much so that many of them simply stop using their
    bikes altogether if they are forced to wear helmets while riding.


    This outcome prompted de Jong to conclude that bike-helmet laws actually have
    a negative effect on societal health as a whole. Yes, the laws prevent some injuries,
    but for people who stop using their bikes entirely (and often use their cars instead),
    the health consequences are overwhelmingly negative.


    The bottom line is, no one bothered to test the laws before enacting them. The
    people who were affected by the laws did something completely unexpected by the
    people who designed the laws.


    You will often observe the same effect when designing user interfaces. Design
    changes don’t always create the result you intended and sometimes have the opposite
    effect of what you expected.


    When you read the ideas and rules in this book, I want you to keep this in mind.
    You can do your best to come up with a usable solution; you can follow all the
    rules and make what seem like obviously


