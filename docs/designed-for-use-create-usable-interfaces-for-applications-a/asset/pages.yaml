- pgno: 100
  md: '# Terminology


    In this book, I use the following terms:


    | Sketch | Any representation of a user interface as a drawing. |

    | Wireframe | A static representation of a user interface where the individual
    elements are at least roughly where they are supposed to go, at their supposed
    sizes. |

    | Mock-up | A (usually static) representation of a user interface where decorations
    like shadows and colors are introduced. |

    | Prototype | Any representation of a product that is not the final product. |


    Not everybody uses these terms in that way. Sometimes, the term *prototype* denotes
    only interactive, high-fidelity representations. Sometimes, the term *mock-up*
    is used for any type of sketch of the final user interface. When you read about
    these things on the Internet or in other books, be aware that the author may use
    these words differently.


    # 10.7 Tools


    Sketching and prototyping are popular activities in the software development community—enough
    to have given rise to a whole ecosystem of products. The sole *raison d''être*
    for these applications and services is to help you sketch or prototype your product.


    There are many good reasons for using such products. One of the main ones is that
    they make it easy to collaborate on designs even when designers live far away
    from each other.


    Balsamiq² and Mockingbird³ are online tools that allow you to create and share
    sketches of your user interface.


    Google Docs has a drawing component called Google Drawings, which allows several
    people to collaborate on a design. Morten Just has a set of Google Drawings templates
    with user interface elements.⁴


    2. At http://balsamiq.com.

    3. At https://gomockingbird.com.

    4. At http://mortenjust.com/2010/04/19/a-wireframe-kit-for-google-drawings/.'
