  md: 'It’s just part of the test. If something doesn’t work or is boring you or upsetting
    you, you can stop the test at any time. OK?


    **Tester:** OK.


    Give the first task. For information on how to design tasks, see the previous
    chapters, as well as Chapter 11, *Paper Prototype Testing*, on page 104.


    Once the tasks are done, first explain how to stop screen sharing. Then ask any
    questions you might have.


    Finally, move on to the debriefing. The goal here is to end the test on a positive
    note. Being observed while making mistakes can be a bad, stressful experience.
    Telling the tester that his effort really helped you can offset that bad experience
    and make the tester’s investment feel worthwhile.


    **Facilitator:** Now I can’t see your screen anymore. OK, that was great; that
    helped clear up a lot of questions we had. Using the stuff we discovered today,
    we’ll be able to improve BizTwit’s user interface a lot. Thank you so much for
    helping us out! Now, do you have any questions or feedback for me?


    **Tester:** I was kind of confused at first about how to share my screen, but
    I guess it worked out in the end.


    **Facilitator:** Yeah, I’ll try to find a better way of explaining that in the
    future. Now, we’ve promised you an Amazon gift certificate, and I’ll send that
    to your email address, if that’s OK?


    **Tester:** Sure.


    **Facilitator:** Great. If you have any additional questions or comments, just
    send me an email. I’ll put my email address into Skype’s chat window. Thanks again
    for helping us, and have a great day!


    Don’t forget to send out the reward, if you’ve promised one.


    Do not write any reports. Do not create movies showing the results. Instead, after
    doing the test, make a list of the issues you found that you feel are most important
    to you, and fix them for the next test. If you are unsure about an issue, let
    it go for now, and see whether other testers encounter the same issue in future
    tests. If an issue is important, it will eventually show up again.'
