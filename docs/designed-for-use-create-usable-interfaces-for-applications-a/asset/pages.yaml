- pgno: 12
  md: 'Since Twitter¹ apps are our generation''s "Hello World" example application,
    for the technique chapters we''ll design a Twitter app. To make things interesting,
    we''re not designing a generic Twitter app. Our app is aimed at people who have
    to update Twitter accounts for their companies. We call this fictional application
    BizTwit.


    Think of the technique chapters as recipes. It''s OK to read the book from start
    to finish, but it''s also OK to delve into a specific topic. To that end, these
    chapters are typically short and to the point, and they contain references to
    further information both inside the book as well as in other books or on the Internet.


    # Idea Chapters


    While technique chapters introduce specific techniques and explain how to apply
    them, idea chapters are less specific. They introduce concepts and are mostly
    meant as sources of inspiration, rather than as strict rules. Some of the idea
    chapters mention techniques or refer to technique chapters, but they focus on
    more general concepts: How realistic should design be? How can we use animation
    most effectively? What are modes? What can we learn from video games?


    You can identify idea chapters by the light bulb on the first page.


    The ideas in these chapters may not always apply to the projects you''re working
    on, because to some degree, people are unpredictable. When using your products,
    they don''t always behave as you expect them to behave. And they don''t always
    act as your rules predict.


    To illustrate how people''s behavior is often different than predicted, let''s
    look at an example outside of user interface design. Let''s assume you are concerned
    with public health and safety. Where do you start? Given that tens of thousands
    of cyclists are injured in traffic accidents every year, bicycle safety is a good
    place to start.


    Studies show that helmets help cyclists avoid injuries. So, getting people to
    wear helmets should decrease the number of injuries, thereby increasing people''s
    health and safety. The predicted outcome seems


