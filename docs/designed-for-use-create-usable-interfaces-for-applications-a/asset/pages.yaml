    When you’re writing, ask yourself, “Does this sentence help the user?” If it doesn’t,
    get rid of it.


    # 6.6 Sentences Should Have One Obvious Interpretation


    Avoid sentences that can be interpreted in two different ways and sentences that
    lure your readers into an improper understanding when they have read only part
    of them.⁸


    Readers try to make sense of sentences before they reach the period at the end.
    Some sentences can mislead the reader. Consider the first few words of this headline:⁹


    > “Burger King fries the holy grail…”


    Now why would Burger King fry the holy grail? The sentence’s meaning becomes clear
    when you finish reading it:


    > “Burger King fries the holy grail for potato farmers”


    Ah, the fries *are* the holy grail. It’s still not entirely unambiguous, but the
    meaning is reasonably obvious now.


    Reading such a sentence requires more work on the part of your readers, since
    they’re forced to backtrack if they start with a wrong interpretation. To avoid
    confusing them, ask yourself whether a sentence is unambiguous even if you’ve
    read only part of it. A simple change makes this sentence completely clear:


    > “Burger King fries are the holy grail for potato farmers”


    Can you spot the problem with the following sentence?


    8. These are often called garden-path sentences, from the saying “to be led up
    the garden path.” The intuitive understanding of such a sentence is misleading;
    reaching the end of the sentence forces the reader to backtrack, looking for a
    different interpretation. Wikipedia has more on the topic: http://en.wikipedia.org/wiki/Garden_path_sentence.


    9. I found this example via the excellent Language Log blog at http://languagelog.ldc.upenn.edu/nll/?p=1762.
