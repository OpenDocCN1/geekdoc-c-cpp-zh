  md: '![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_182_0.png)


    # Chapter 21


    # Have Opinions Instead of Preferences


    If you''re are not sure about a specific design choice, it''s always easiest to
    leave it up to the user. When Mac users minimize windows into the Dock, some probably
    want it to elegantly flow into the Dock. Others may prefer their windows to just
    zoom away, linearly scaling down. So, why not give them both?


    ![](img/4c2ca26a2dc8a63bcb4d64fdf789fcc0_182_1.png)


    Every unnecessary checkbox in your Settings window is a design decision that you''re
    leaving to a person who is less qualified at making that decision than you are.
    You are in the best position to come up with the correct solution. Don''t let
    somebody who knows less about your'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'product make that decision for you. Chances are, their decisions will be worse
    than yours.


    Designer and developer Mike Rundle puts it like this:¹


    > If there’s a choice between setting a value to A or B and you always choose
    A, why not just make A the main, unsettable, unchangeable choice? If you think
    A is the best decision, why even let people choose B? (...)


    > [Steve Jobs] builds what he wants because he knows he’s building great stuff.
    That’s what you should do, too.


    You are trained to make these decisions, and you have the necessary information
    to do so correctly. Your users probably don’t.


    # What I’m Not Talking About


    Not everything you see in a settings window is bad. I’m specifically talking about
    preferences—things that could work either way but that some people prefer to work
    in a certain way. Let’s define how I use these terms in this chapter:


    | Settings | A global change the user can make to your product’s function or behavior.
    |

    | Configuration | Settings that are necessary for your product to work correctly,
    such as the screen resolution or network settings. If you’re creating a Twitter
    client, for example, you need to allow the user to configure it to show his personal
    Twitter messages. |

    | Preferences | Settings that change your product’s behavior and are not strictly
    necessary but that some people may prefer to be set differently—for example, the
    number of recent items in the Apple menu or Windows Start menu, or the place where
    the scroll arrows appear in Mac OS X’s scroll bars. |

    | Personalization | Settings that have purely visual effects and do not change
    the actual behavior of your product—for example, the desktop wallpaper. |


    1. Read his essay at http://flyosity.com/iphone/kill-the-settings-build-opinionated-software.php.'
