    # 5.5. Arrays as parameters'
- md: '

    At some moment we may need to pass an array to a function as a parameter.

    In C++ it is not possible to pass by value a complete block of memory as a parameter,
    even if it is ordered as an array, to a function, but it is allowed to pass its
    address, which has almost the same practical effect and is a much faster and more
    efficient operation.


    In order to admit arrays as parameters the only thing that we must do when declaring
    the function is to specify in the argument the base type for the array that it
    contains, an identifier and a pair of void brackets [] . For example, the following
    function:


    ```

    void procedure(int arg[])

