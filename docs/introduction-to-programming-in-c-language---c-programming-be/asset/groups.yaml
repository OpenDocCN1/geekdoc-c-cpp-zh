    ## 操作字符串的函数


    `cstring` 库 (`string.h`) 定义了许多用于对 C 风格字符串执行操作的函数（如已经解释过的 `strcpy`）。这里是常用的简要介绍：


    ### a) 字符串长度


    返回字符串的长度，不包括空字符 (0)。**strlen(const char* string);****


    ### b) 字符串拼接：


    将 *src* 字符串附加到 *dest* 字符串的末尾。返回 *dest*。字符串拼接有两种形式，第一种是将源的全部内容附加到目标，另一种是仅将源的一部分附加到目标。


    - 添加源的全部内容

    **strcat(char* dest, const char* src);**

    - 添加源的一部分

    **strncat(char* dest, const char* src, int size);**

    其中 size 是要附加的字符数。


    ### c) 字符串拷贝：


    用 *src* 字符串覆盖 *dest* 字符串的内容。字符串拷贝有两种形式，第一种是将源的全部内容复制到目标，另一种仅拷贝源的一部分到目标。


    - 复制源的全部内容

    **strcpy(char* dest, const char* src);**

    - 复制源的一部分

    **strncpy(char* dest, const char* src, int size);**

    其中 size 是要复制的字符数。


    ### d) 字符串比较：


    比较两个字符串 *string1* 和 *string2*。

    字符串比较有两种形式，第一种是比较两个字符串的全部内容，另一种是比较两个字符串的一部分。


    - 比较全部

    strcmp(const char* string1 , const char* string2);

    - 比较部分

    strcmp(const char* string1, const char* string2, int size ); 其中 size 是要比较的字符数。两个字符串比较函数都返回三个不同的值：


    - 如果字符串相等，返回 0

    - 如果第一个字符串小于第二个字符串，返回负值

    - 如果第一个字符串大于第二个字符串，返回正值


