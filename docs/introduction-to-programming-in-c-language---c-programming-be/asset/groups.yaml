    # 2.8.5.1. Prefix and Postfix:


    The prefix is written before the variable. Eg (++ myAge), whereas the postfix
    type appears after the variable name (myAge++).

    Prefix and postfix operators cannot be used at once on a single variable: Eg:
    ++age- or --age++ or or - age - is invalid


    In a simple statement, either type may be used. But in complex statements, there
    will be a difference.


    The prefix operator is evaluated before the assignment, and the postfix operator
    is evaluated after the assignment.


    E.g.

    int k = 5;

    (auto increment prefix) (auto increment postfix) (auto decrement prefix) (auto
    decrement postfix) y= ++k + 10; //gives 16 for y= k++ + 10; //gives 15 for y y
    --k + 10; //gives 14 for y= k-- + 10; //gives 15 for y


