    Expression is called the switch tag and the constants preceding each case are
    called the case labels.


    The out put of “expression” should always be a constant value. First expression
    is evaluated, and the outcome, which is a constant value, compared to each of
    the numeric constants in the case labels, in the order they appear, until a match
    is found.


    Note, however, that the evaluation of the switch tag with the case labels is only
    for equality


    The statements following the matching case are then executed. Note the plural:
    each case may be followed by zero or more statements (not just one statement).


    After one case is satisfied, execution continues until either a break statement
    is encountered or all intervening statements are executed, which means until the
    execution reaches the French bracket of the switch statement.


    The final default case is optional and is exercised if none of the earlier cases
    provide a match. This means that, if the value of the “expression” is not equal
    to any of the case labels, then the statements under default will be executed.


