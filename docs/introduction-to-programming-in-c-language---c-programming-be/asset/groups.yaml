    ### 2.8.1. 赋值运算符 (=)。


    赋值运算符导致赋值语句左侧的操作数的值被变为语句右侧的值。


    语法：Operand1=Operand2;

    Operand1 始终是一个变量

    Operand2 可以是以下某一个或它们的组合：


    - + 字面量常量：例如：x=12;

    - 一个变量：例如：x=y;

    - 一个表达式：例如：x=y+2


    ### 2.8.1.1. 复合赋值运算符 (+, -=, *, /,,, <<, &= ^)。


    复合赋值运算符是赋值运算符与其他运算符（如算术运算符和位运算符）的结合。

    赋值运算符有很多变体，通过与其他运算符结合获得。

    例如：


    ```

    value += increase; 等于 value = value + increase;

    a -= 5; 等于 a = a - 5;

    a /= b; 等于 a = a / b;

    price *= units + 1 等于 price = price * (units + 1);

    ```


    其余的也遵循此规律。


