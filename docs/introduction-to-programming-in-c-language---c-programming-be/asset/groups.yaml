    ## 5.6. Strings of Characters: What are Strings?


    In all programs and concepts we have seen so far, we have used only numerical
    variables, to express numbers exclusively. But in addition to numerical variables
    there also exist strings of characters that allows us to represent successive
    characters, like words, sentences, names, texts, etc. Until now we have only used
    them as constants, but have never considered variables to contain them.


    In C++ there is no elementary variable type to store string of characters. In
    order to fulfill this feature we can use arrays of type char, which are successions
    of char elements. Remember that this data type (char) is the one used to store
    a single character, for that reason arrays of them are generally used to make
    strings of single characters.


    For example, the following array (or string of characters) can store a string
    up to 20 characters long. You may imagine it thus:


    ```

    char name [20];

    ```


    ```

    name

    ```


    This maximum size of 20 characters is not required to be always fully used. For
    example


    We could represent name (an array of 20 elements of type char) storing the strings
    of characters "Hello" and "Studying C++" in the following way:


    ```

    Hello\0

    Studying C++\0

    ```


    Notice how after the valid content it is included a null character (''\0'') in
    order to indicate the end of string. The empty cells (elements) represent indeterminate
    values.


    ## 5.7. Initialization of Strings


    Because strings of characters are ordinary arrays they fulfill same rules as any
    array. For example, if we want to initialize a string of characters with predetermined
    values we can do it in a similar way to any other array:


    ```

    char mystring[] = { ''H'', ''e'', ''t'', ''o'', ''\0'' };

    ```


    In this case we have declared a string of characters (array) of 6 elements of
    type char initialized with the characters that compose Hello plus a null character
    ''\0''.


    Nevertheless, string of characters have an additional way to initialize its values:
    using constant strings.

    In the expressions we have used in examples of previous chapters there have already
    appeared several times constants that represented entire strings of characters.
    These are specified enclosed between double quotes (" "), for example:


    Eg: "the result is: " a constant string that we have probably used in some occasion.


    Unlike single quotes ('' '') which allow to specify single character constants,
    double quotes ("") are constants that specify a succession of characters. These
    strings enclosed between double quotes have always a null character (''\0'') automatically
    appended at the end.

    Therefore we could initialize the string mystring with values by any of the two
    ways:


    ```

    char mystring[] = { ''H'', ''e'', ''t'', ''o'', ''\0'' }; char mystring[] = "Hello";

    ```


    In both cases the Array or string of characters mystring is declared with a size
    of 6 characters (elements of type char): the 5 characters that compose Hello plus
    a null character (''\0'') which specifies the end of the string and that, in the
    second case, using double quotes ("") it is automatically appended.


    ```

    mystring="Hello";

    mystring[] = "Hello";

    neither would be: mystring = { ''H'', ''e'', ''l'', ''l'', ''o'', ''\0'' };

    ```


    Remember: We can "assign" a multiple constant to an Array only at the moment of
    initializing it. The reason will be more comprehensible when you know a bit about
    pointers, then it will be clarified that an array is simply a constant pointer
    pointing to an allocated block of memory. And because of this constant feature,
    the array itself cannot be assigned any value, but we can assign values to the
    elements of the array.


    At the moment of initializing an Array it is a special case, since it is not an
    assignment, although the same equal sign (=) is used. Anyway, have always present
    the rule previously underlined.


    ## Assigning Values to Strings


    Just like any other variables, array of character can store values using assignment
    operators. But the following is not allowed.

    mystring="Hello";


    This is allowed only during initialization. Therefore, the lvalue of an assignment
    can only be an element of an array and not the entire array, what would be valid
    to assign a string of characters to an array of char using a method like this:


    ```

    mystring[0] = ''H'';

    mystring[1] = ''e'';

    mystring[2] = ''l'';

    mystring[3] = ''l'';

    mystring[4] = ''o'';

    mystring[5] = ''\0'';

    ```


    But as you may think, this does not seem to be a practical method. Generally for
    assigning values to an array, more specifically to a string, functions like strcpy
    are used. strcpy ( string1 ) is defined in string.h library and can be called
    the following way:


    ```

    strcpy(string1, string2);

    ```


    For example:


    ```

    #include <iostream.h>

    #include <string.h>

    int main ()

    {

    char szMyName [20];

    strcpy(szMyName,"Hello");

    out << szMyName;

    return 0;

    }

    ```


    Look how we have needed to include <string.h> header in order to be able to use
    function strcpy. Although we can always write a simple function like the following
    set with the same strcpy:


    ```

    // setting value to string

    #include <iostream.h>

    #include <conio.h>


    void namecopy(char dest[], char source[]) {

    int c = 0;

    while(source[c] != ''\0'') {

    dest[c] = source[c];

    c++;

    }

    dest[c] = ''\0'';

    cout<< "\n your name after copying : "<<<<dest;

    }

    void main()

    {

    clrscr();

    char name[10],dest[10];

    cout<< "\n enter your name : "; cin>>name;

    namecopy(dest,name);

    getch();

    }

    ```


    Another frequently used method to assign values to an array is by using directly
    the input stream ( **cin** ). In this case the value of the string is assigned
    by the user during program execution.

    When **cin** is used with strings of characters it is usually used with its **getline**
    method, that can be called following this prototype:

    **cin.getline ( char buffer [], int length, char delimiter = ''\n'' )**

    **where** is the address where to store the input (like an array, example), **length**
    is the maximum length of the buffer (size of the array) and **delimiter** is the
    character used to determine the end of the user input, which by default - if we
    do not include that parameter - will be the newline character (''\n'').


    The following example repeats whatever you type on your keyboard. It is quite
    simple but serves as example on how you can use **cin.getline** with strings:


    ```

    // cin with strings


    #include <iostream.h>

    #include <conio.h>

    int main ()

    {


    char mybuffer [100];

    out << "What''s your name? ";

    cin.getline(mybuffer,100);

    out << "Hello " << mybuffer << ".",\n";

    }

    ```

