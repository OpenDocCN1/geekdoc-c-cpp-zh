    \n## 4.1. 函数基础\n\n处理问题的最好方法之一是从总体目标开始，然后将该目标分解为若干更小的任务。你不应该应该忘记总体目标，但也要考虑各个部分如何组合在一起以实现该目标。如果你的程序执行的操作很多，请将其拆分为几个函数。每个函数应该只执行一个主要任务。\n\
