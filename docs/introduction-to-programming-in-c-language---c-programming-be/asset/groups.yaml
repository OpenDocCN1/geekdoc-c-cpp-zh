    # 第章 数组与结构


    ## 5. 什么是数组


    相同数据对象的集合，存储在公共标题或变量名下的连续内存位置中。换句话说，数组是一个由相同名称引用的值组或表格。数组中的单个值称为元素。数组元素也是变量。一组相同类型的值，有一个单一名称并后跟一个索引。在
    C++ 中，索引紧跟在名称后的方括号中。一个表示存储许多简单数据变量集合的内存块，这些变量存储在单独的数组元素中，计算机在内存中连续存储数组的所有元素。


    ### 5.1. 数组的属性：


    C++ 中的数组是零边界的；也就是说，数组第一个元素的索引为 0，最后一个元素的索引为 N-1，其中 N 是数组的大小。引用数组边界之外的元素是非法的，根据编译器的不同，你的程序可能会崩溃或产生意想不到的结果。

    数组只能存储一种类型的值


    ### 5. 数组声明


    声明数组的名称和类型并设置数组中的元素数量被称为数组化（dimensioning）。像其他变量一样，数组在使用在使用之前必须声明。在数组声明中，人们必须定义：


    - 1. 数组的类型（即整数、浮点型、字符等）

    - 2. 数组名称，

    - 3. 要分配的内存位置总数或每个下标的最大值。即数组中的元素数量。


    因此，声明的通用语法为：

    **DataType arrayname [array size];**


    表达式 `array size`（即元素数量）必须是一个常量，例如 10，或者是一个在数组声明之前声明的符号常量，或者是常量表达式（如 `10*sizeof(int)`），这些值在编译时是已知的。


    **注意：** `array size` 不能是一个在程序运行时设置值的变量。

    因此，声明一个大小为 10、名为 `num` 的整数的方法是：


    int num [10];

    这意味着：将留出 10 个连续的字节内存位置并命名为 `num`。


    这意味着我们可以存储 10 个 **int** 类型的值，而无需声明 10 个具有不同标识符的单独变量。相反，使用数组我们可以存储 10 个相同类型（例如
    **int**）的不同值，且每个值都有一个唯一的标识符。


    ### 5.3. 初始化数组


    在声明局部作用域的数组（函数内部）时，如果我们不指定，则数组变量将不会被初始化，因此在向其存储某些值之前，其内容是不确定的。


    如果我们声明一个全局数组（任何函数之外），其内容将被初始化，所有元素将填充为零。因此，如果我们在全局范围内声明：


    ```

    int day [5];

    day 的每个元素最初都将设置为 **0:**

    ```


    此外，当我们声明数组时，我们有可能使用大括号 `{ }` 为它的每个元素分配初始值。例如：


    ```

    int day[5] = { 16, 2, 77, 40, 12071 };

    ```


    上面的声明将创建一个如下所示的数组：


    | day | 16 | 2 | 77 | 40 | 12071 |

    | --- | --- | --- | --- | --- | --- |


    用大括号 `{}` 初始化的数组元素数量必须等于或少我们在方括号 `[]` 中声明的数组元素长度。如果初始化的项目较少，其余部分将用零填充。例如，在 `day`
    数组的示例中，我们声明它有 5 个元素，而在大括号 `{}` 中的初始值列表中我们设置了 5 个值，每个元素对应一个。如果我们忽略上述初始化中的最后一个值（12071），最后一个数组元素将自动取
    0。由于这可以被视为无用的重复，C++ 允许将方括号 `[]` 留空，通过计算初始化大括号中的项数来设置数组的大小。


    ```

    int day[] = { 1, 2, 7, 4, 12, 9 };

    ```


    编译器将统计初始化项的数量为 6 个，并将数组 `day` 的大小设置为 6（即：`day[6]`）。你只有在定义数组时才能使用初始化形式。你不能再次将数组赋值给另一个。即：


    ```

    int arr[] = { 16, 2, 77, 40, 12071 }; int ar[]={1,2,3,4};//不允许 ar=ar; //不允许

    ```


    注意：在初始化数组时，我们可以提供比数组元素更少的值。例如：`int a[10] = { 10, 2, 3 };` 在这种情况下，编译器将剩余元素设置为零。


    ### 5.4. 访问和处理数组元素


    在程序中数组可见的任何点，我们都可以单独访问其元素中的任何一个进行读取或修改，就像它是一个普通变量一样。要访问单个元素，需要使用索引或下标。格式如下：


    name [ index ]


    在 C++ 中，第一个元素的索引为 0，最后一个元素的索引是数组大小减 1（即 `arraysize-1`）。因此，根据上面的声明，`day[0]` 是第一个元素，`day[4]`
    是最后一个元素。

    接上之前的示例，假设 `day` 有 5 个元素且每个元素都是 `int` 类型，我们可用于引用每个元素的名称如下：


    ![](img/1c71222ac226933a278356fa94fe60a5_72_0.png)


    例如，要在数组变量 `day` 的第三个元素中存储值 75，一个合适的语句是：


    ```

    day[2] = 75; //因为第三个元素位于索引 2

    ```


    并且，例如，将数组变量 `day` 的第三个元素的值传递给变量 `a`，我们可以写：


    ```

    a = day[2];

    ```


    注意，day 的第三个元素指定为 `day[2]`，第一个是 `day[0]`，第二个是 `day[1]`，因此这是 `day[2]`。由于这个原因，它的最后一个元素是
    `day[4]`。如果我们写 `day[5]`，我们将访问 `day` 的第六个元素，从而超出了数组的大小。这取决于编译器，可能会给你错误或意想不到的值。


    在 C++ 中，超出数组的索引范围是完全有效的，这会导致某些可检测的问题，因为它们不会导致编译错误，但在执行期间可能会产生意想不到的结果。允许这种现象的原因在我们开始使用指针时将会看到。此时，清楚地区分方括号
    `[]` 用于数组的两种用途很重要：


    - 一个是在声明期间设置数组的大小

    - 另一个是在访问数组元素时指定特定元素的索引


    ```

    例: int day[5]; // 声明新数组（类型类型开头）

    day[2] = 75; // 访问数组的元素

    ```


    数组访问和赋值的其他有效操作：


    ```

    int a=1;

    day[0] = a;

    day[a] = 5;

    b = day [a+2];

    day [day[a]] = day [2] + 5;

    ```


    例：数组示例显示数组中数字的和


    ```

    #include <iostream.h>

    int day [ ] = {16, 2, 77, 40, 12071}; int n, result=0;

    void main ()

    {

    for ( n=0 ; n<5; n++ )

    {

    result += day[n]; }

    cout << result;

    }

    getch();

    }

    ```


