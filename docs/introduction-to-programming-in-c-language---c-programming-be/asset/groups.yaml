    - 函数名。这仅仅是一个唯一的标识符。\n- 函数参数（也称为签名）。这是一组零或多个带类型的标识符，用于在函数内部外部传递值。\n\n### 4.3.2.\
    \ 定义函数：\n\n- 函数定义由两部分组成：接口（原型）和体。函数的括号内包含了使函数化的计算步骤（语句）。定义由一行被称为“声明”的代码组成。\n\n\
    - 如果函数定义是在 main 函数之前完成的，则不需要放置原型，否则原型应该在 main 函数开始之前编写好。\n\n### 4.3.3. 调用函数：\n\
    \n- 使用函数涉及“调用”它。\n- 调用函数意味着下达执行该函数的指令。\n\n一个函数调用由函数名后跟调用运算符括号‘()’组成，其中出现零或多个用逗号分隔的参数。参数的数量和类型应该与函数的参数匹配。每个参数都是一个表达式，其类型应与函数接口中对应参数的类型匹配。\n\
    \n当执行函数时，首先评估参数并将它们的计算结果赋值给相应的参数。然后执行函数体。最后，将返回值（如果有）传递给调用者。\n\nC++ 中的函数调用就像高速公路上的绕道。想象你正在沿着名为\
    \ main() 的主函数“道路”旅行。当你遇到一个函数调用语句时，你必须暂时离开 main() 函数并执行被调用的函数。当该函数结束（到达返回语句），程序控制返回\
