    # 7.5: Command Line Argument


    -Command line argument means facility by which you can supply arguments to the
    main() function. These arguments are supplied to the program when the main function
    is called from the command line. Eg. c:\> file-name arg1 arg2

    Where file-name is the name of file(the program) and arg1, arg2 are arguments
    passed to the program.

    -If we want to pass arguments to the main function, then main function should
    be written as follow.


    Return type main(int argc, char * argv[])

    -The first argument argc represents the number of arguments in a command line.
    The second argument argv is an array of character type pointers that points to
    the command line arguments. Argc is known as argument counter and argv is called
    argument vector.


    -C:\> student A B. The value of argc is 3 (student, A & B) and the argv would
    be an array of three pointers to string as follows:

    Argv[0] – points to student

    Argv[1] – points to A

    Argv[2] – points to B


    -note that argv[0] repereents the command name that invokes the program.

