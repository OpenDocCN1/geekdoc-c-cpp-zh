    ### 2.8.1. Assignment operator (=).


    The assignment operator causes the operand on the left side of the assignment
    statement to have its value changed to the value on the right side of the statement.


    Syntax: Operand1=Operand2;

    Operand1 is always a variable

    Operand2 can be one or combination of:


    - + Literal constant: Eg: x=12;

    - A variable: Eg: x=y;

    - An expression: Eg: x=y+2


    ### 2.8.1.1.Compound assignment operators (+, -=, *, /,, <<, &= ^).


    Compound assignment operator is the combination of the assignment operator with
    other operators like arithmetic and bit wise operators.

    The assignment operator has a number of variants, obtained by combining with other
    operators.

    E.g.:


    ```

    value += increase; is equivalent to value = value + increase;

    a -= 5; is equivalent to a = a - 5;

    a /= b; is equivalent to a = a / b;

    price *= units + 1 is equivalent to price = price * (units + 1);

    ```


    And the is true for the rest.


    ### 2.8.2. Arithmetic operators (+, *, /, %).


    Except for remainder or modulo (%), all other arithmetic operators can accept
    a mix of integers and real operands. Generally, if both operands are integers
    then, the result will be an integer. However, if one or both operands are real
    then the result will be real. When both operands of the division operator (/)
    are integers, the division is performed as an integer division and not the normal
    division we use to.

    Integer division always results in an integer outcome. Division of integer by
    integer will not round off to the next integer E.g.:


    9/2 gives 4 not 4.5. To obtain a real division when both operands are integers,
    you should cast one of the operands to be real.

    E.g.:


    ```

    int cost = 100;

    int volume = 80;

    double unitPrice = cost/(double)volume;

    ```


    The module(%) is an operator that gives the remainder of a division of two. For
    instance, 13 % 3 is calculated by integer dividing 13 to give an outcome of 4
    and a remainder of 1; the result is therefore 1.

    E.g.:


    ```

    a = 11 % 3

    a is 2

    ```


    ### 2.8.3. Relational operator (==, !=, >, <, >=, <=).


    In order to evaluate a comparison between two expressions, we can use the relational
    operator.

    The result of a relational operator is a bool value that can only be true or false
    according to the result of the comparison. E.g.:


    ```

    (7 == 5) would return false or returns 0

    (5 > 4) would return true or returns 1

    ```


    The operands of a relational operator must evaluate to a number. Characters are
    valid operands since they are represented by numeric values. E.g.:

    ‘A’ < ‘F’ would return true or 1. it is like (65 < 70)


    ### 2.8.4. Logical Operators (&, &&, ||).


    Logical negation (!) is a unary operator, which negates the logical value of operand.
    If the operand is non zero, it produce 0, and if it is 0 it produce 1.

    Logical AND (&&) produces 0 if one or both of its operands evaluate to 0 otherwise
    it produces 1.

    Logical OR (||) produces 0 if both of its operands evaluate to 0 otherwise, it
    produces 1.


    ```

    E.g.:

    20 //gives 0

    10 && 5 //gives 1

    10 || 5.5 //gives 1

    ```


    N.B.: The result of a relational operator is a bool value that can only be true
    or false.


    ### 2.8.5. Increment/Decrement Operators (++) and--)


    The increment (++) and decrement (--) provide a convenient way to increase or
    decrease a variable by 1.


    2.8.5.1. Prefix and Postfix:


    The prefix is written before the variable, whereas the postfix appears after the
    variable. In a simple statement, either type may be used.


    The prefix operator is evaluated before the assignment, and the postfix operator
    is evaluated after the assignment.


    E.g.:

    int k = 5;

    y = ++k + 10; //gives 16

    y = k++ + 10; //gives 15

    y = --k + 10; //gives 14

    y = k-- + 10; //gives 15


    ### 2.8.6. Conditional Operator (?:) The conditional operator takes three operands.
    It has the general form:


    ```

    Syntax:

    operand1 ? operand2 : operand3

    ```


    First operand1 is a relational expression and will be evaluated. If the result
    of the evaluation is non zero (which means TRUE), then operand2 will be the final
    result. Otherwise, operand3 is the final result.


    E.g.: General Example

    Z=(X<Y? X : Y)


    This expression means that if X is less than Y the value of X will be assigned
    to Z otherwise (if X>=Y) the value of Y will be assigned to Z.


    E.g.:

    int m=1,n=2;

    min = (m < n ? m : n);

    The value stored in min is 1.


    E.g.:

    (7 = 5 ? 4:3) returns 3 7 is not equal to 5


    ### 2.8.7. Comma Operator (,).


    Multiple expressions can be combined into one expression using the comma operator.

    The comma operator takes two operands. Operand1,Operand2 The comma operator can
    be used during multiple declaration, for the condition operator and for function
    declaration, etc It first evaluates the left operand and then the right operand,
    and returns the value of the latter as the final outcome. E.g.


    ```

    int m,n,min;

    int mCount = 0, nCount = 0;

    min = (m < n ? (mCount++, n));

    ```


    Here, when m is less than n, mCount++ is evaluated and the value of m is stored
    in min. otherwise, nCount++ is evaluated and the value of n is stored in min.


    ### 2.8.8. The sizeof() Operator.


    This operator is used for calculating the size of any data item or type.

    It takes a single operand (e.g. 100) and returns the size of the specified entity
    in bytes. The outcome is totally machine dependent.


    E.g.:

    '
  mdcn: '


    ## 2.6. 内存设置/内存概念。


    计算机提供内存存储器（RAM）用于存储可执行的程序代码以及程序处理的数据。


    内存可以被看作连续的位序列（bits），每个位都可以存储一个二进制数字。通常，内存被分为每 8 个连续位为一组，称为字节（byte）。字节按顺序寻址。因此，每个字节都可以通过其地址唯一地标识。


    字节地址


    ```

    ... 1211 1212 1213 1214 1215 1216 1217 ... memory ... byte byte byte

    byte byte byte

    1 0 1 0 0 0 1

    bit

    ```


    ## 2.7. 表达式与语句。


    在 C++ 中，语句控制执行顺序、评估表达式，或者什么都不做（空语句）。所有 C++ 语句都以分号结束。


    例如：x = a + b;


    其含义是：将 a 和 b 之和赋值给 x。**空白字符：** 空白字符（空格、制表符、换行符）在语句中是不可见的且通常被忽略。空白字符应用于使程序更具可读性并易于维护。**块：**
    块以左括号 ({) 开始，以右括号 (}) 结束。**表达式：** 表达式是一个产生值的计算过程。它也可以被视为任何评估出一个值（返回一个值）的语句。例如：语句
    `3+2;` 返回值 5，因此它是一个表达式。表达式的一些示例：


    例如 1：


    - 3.2 返回值 3.2

    - PI 浮点常量，如果定义了该常量，则返回值 3.14

    - secondsPerMinute 整数常量，如果声明了该常量，则返回 60


    例如 2：复杂的表达式：x = a + b;

    y = x = a + b;


    第二行按照以下顺序进行求值：

    1. 将 a 加到 b 上。

    2. 将表达式 a + b 的结果赋值给 x。

    3. 将赋值表达式 x = a + b 的结果赋值给 y。


