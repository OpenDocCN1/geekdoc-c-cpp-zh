    ## 2.7. Expressions and Statements.


    In C++, a statement controls the sequence of execution, evaluates an expression,
    or does nothing (the null statement). All C++ statements end with a semicolon.


    E.g.: x = a + b;


    The meaning is: assign the value of the sum of a and b to x. **White spaces:**
    white spaces characters (spaces, tabs, new lines) can''t be seen and generally
    ignored in statements. White spaces should be used to make programs more readable
    and easier to maintain. **Blocks:** a block begins with an opening brace ({ and
    ends with a closing brace (}). **Expressions:** an expression is a computation
    that yields a value. It can also be viewed as any statement that evaluates to
    a value (returns a value). E.g.: the statement 3+2; returns the value 5 and thus
    is an expression. Some examples of an expression:


    E.g. 1:


    - 3.2 returns the value 3.2

    - PI float constant that returns the value 3.14 if the constant is defined.

    - secondsPerMinute integer constant that returns 60 if the constant is declared


    E.g. 2: complicated expressions: x = a + b;

    y = x = a + b;


    The second line is evaluated in the following order:

    1. add a to b.

    2. assign the result of the expression a + b to x.

    3. assign the result of the assignment expression x = a + b to y.


