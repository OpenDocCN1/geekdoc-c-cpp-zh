    # Chapter Three Program Control Constructs.


    A running program spends all of its time executing instructions or statements
    in that program.

    The order in which statements in a program are executed is called flow of that
    program.

    Programmers can control which instruction to be executed in a program, which is
    called flow control.

    This term reflects the fact that the currently executing statement has the control
    of the CPU, which when completed will be handed over (flow) to another statement.

    Flow control in a program is typically sequential, from one statement to the next.

    But we also have execution that might be divided to other paths by branching statements.
    Or perform a block of statement repeatedly until a condition fails by Replication
    or looping.

    Flow control is an important concept in programming because it will give all the
    power to the programmer to decide what to do to execute during a run and what
    is not, therefore, affecting the overall outcome of the program.


    # 3. Sequential Statements


    Such kind of statements are instruction in a program which will executed after
    the other in the order scripted in the program. In sequential statements, the
    order will be determined during program development and can not be changed.


    # 4. Selection Statements


    Selection statements are statements in a program where there are points at which
    the program will decide at runtime whether some part of the code should or not
    be executed.


    There are two types of selection statements in C++, which are the “if'
