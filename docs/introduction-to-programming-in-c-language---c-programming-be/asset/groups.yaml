    # 2.8.3. Relational operator (==, !=, >, <, >=, <=).


    In order to evaluate a comparison between two expressions, we can use the relational
    operator.

    The result of a relational operator is a bool value that can only be true or false
    according to the result of the comparison. E.g.:


    ```

    (7 == 5) would return false or returns 0

    (5 > 4) would return true or returns 1

    The operands of a relational operator must evaluate to a number. Characters are
    valid operands since they are represented by numeric values. E.g.:

    ‘A’ < ‘F’ would return true or 1. it is like (65 < 70)

    ```


    # 2.8.4. Logical Operators (&, &&, ||).


    Logical negation (!) is a unary operator, which negates the logical value of operand.
    If the operand is non zero, it produce 0, and if it is 0 it produce 1.

    Logical AND (&&) produces 0 if one or both of its operands evaluate to 0 otherwise
    it produces 1.

    Logical OR (||) produces 0 if both of its operands evaluate to 0 otherwise, it
    produces 1.'
