    ## 2.6. 内存设置/内存概念。


    计算机提供内存（RAM）用于存储可执行的程序代码以及程序处理的数据。


    内存可以被看作是连续的位序列，每个位都可以存储一个二进制数字。通常，内存被分为每 8 个连续位为一组，称为字节。字节按顺序寻址。因此，每个字节都可以通过其地址唯一地标识。


    字节地址


    ```

    ... 1211 1212 1213 1214 1215 1216 1217 ... memory ... byte byte byte

    byte byte byte

    1 0 1 0 0 0 1

    bit

    ```


    ## 2.7. 表达式与语句。


    在 C++ 中，语句控制执行顺序、评估表达式，或者什么都不做（空语句）。所有 C++ 语句都以分号结束。


    例如：x = a + b;


    其含义是：将 a 和 b 之和赋值给 x。**空白字符：** 空白字符（空格、制表符、换行符）在语句中是不可见的且通常被忽略。空白字符应用于使程序更具可读性并易于维护。**块：**
    块以左括号 ({) 开始，以右括号 (}) 结束。**表达式：** 表达式是一个产生值的计算过程。它也可以被视为任何评估出一个值（返回一个值）的语句。例如：语句
    3+2; 返回值 5，因此它是一个表达式。表达式的一些示例：


    例如 1：


    - 3.2 返回值 3.2

    - PI 浮点常量，如果定义了该常量，则返回值 3.14

    - secondsPerMinute 整数常量，如果声明了该常量，则返回 60


