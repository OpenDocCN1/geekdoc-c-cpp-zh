    分时是多程序处理的一种特殊情况，用户通过终端访问计算机。在这里，计算机并不并行运行用户的作业，而是共享 CPU 的时间。


    ## 1.4. 主要编程范式


    编程世界中的主要里程碑是编程语言开发过程中观察到的不同类型的特性或属性。在这些，以下内容值得关注：


    - 过程化编程、结构化编程和面向对象编程范式。


    ### 1.4.1. 过程化编程。


    - 过程化编程是一种基于**过程调用**概念的编程范式。在许多涉及中等复杂度或需要高度可维护性的情况下，过程化编程通常比简单的顺序编程是更好的选择。

    - 潜在的优点：能够在不同地方重用相同的代码（函数或过程），比一组“GO TO”或“JUMP”语句更易于跟踪程序的执行流。


    ### 1.4.2. 结构化编程。


    - 将程序拆分成小的、独立的部分进行编写。这使得更容易控制程序的开发，并设计和测试其各个组件部分。

    - 结构化程序由单元*模块*构建，这些模块通常对应于单个过程或函数。

    - 可被视为*过程化编程*的*子集*或子学科。它最著名的是消除或减少对 GO TO 语句的依赖。


    ### 1.4.3. 面向对象编程。


    - OOP 背后的思想是，计算机程序是由*单个单元或对象*的集合组成的，而不是传统观点认为程序是给计算机的一系列指令列表。

    - 面向对象编程被认为提供了更大的灵活性，使程序的更改更容易。OOP 方法通常更容易开发和维护。


    ## 1.5. 问题的解决过程与软件工程。


    ### 1.5.1. 软件工程。


    - 软件工程是通过应用计算机科学、项目管理、工程、应用领域和其他技术和实践来创建和维护软件应用程序的专业。

    - 用于解决计算机科学和/或信息系统问题的方法被称为软件开发生命周期。

    - 软件开发生命周期包含以下组件：


    ![](img/1c71222ac226933a278356fa94fe60a5_6_0.png)


    # 初步调查


    ![](img/1c71222ac226933a278356fa94fe60a5_6_1.png)


    # 分析


    ![](img/1c71222ac226933a278356fa94fe60a5_6_2.png)


    # 设计


    ![](img/1c71222ac226933a278356fa94fe60a5_6_3.png)


    # 实现


    ![](img/1c71222ac226933a278356fa94fe60a5_6_4.png)


    # 测试与维护


    ### 1.5.2. 问题的解决


    - 问题的解决是利用我们对问题领域的知识，并依靠我们选择和使用适当的问题解决策略、技术和工具的能力，将问题的描述转换为解决方案的过程。

    - 问题是阻止组织完全实现其目的、目标和计划的不理想状况。或者，问题也可以定义为现状与预期状态之间的差距，问题解决将试图填补这一差距。


    解决问题有两种方法：

    - 自顶向下设计：是一种基于系统方法，其概念是问题的结构应该决定解决方案的结构以及低层应该做什么。这种方法将尝试将一个较大的问题分解成更小且易于管理的问题，以缩小问题领域。

    - 自底向上设计：是相反的过程，首先构建最低层组件，系统从底部开始构建，直到最终完成整个过程。


    ## 1.6. 基础程序开发技巧


    我们在任何编程语言中设计的程序都需要具备：**可靠性**：程序应该始终执行它被预期的功能，并处理所有类型的异常。

    **可维护性**：程序的设计方式应能够在需要时对其进行修改和升级。

    **可移植性**：需要能够以最少的修改为一种类型计算机编写的软件适配另一种计算机。**高效性**：程序的设计应该充分利用计算机的时间、空间和其他资源。


