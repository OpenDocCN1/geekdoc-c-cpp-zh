    # Chapter Six Pointers. Introduction


    We already seen how variables are memory cells that we can access by an identifier.
    But these variables are stored in concrete places of the computer memory. For
    our programs, the computer memory is only a succession of 1 byte cells (the minimum
    size for a datum), each one with a unique address. A pointer is a variable which
    stores the address of another variable. The only difference between pointer variable
    and regular variable is the data they hold. There are two pointer operators in
    C++:


    & the address of operator


    * the dereference operator


    Whenever you see the & used with pointers, think of the words “address of.\ The
    & operator always produces the memory address of whatever it precedes. The * operator,
    when used with pointers, declares a pointer or'
- md: '

    dereferences the pointer''s value. The dereference operator can be literally translated
    to "value pointed by".


    A **pointer** is simply the address of an object in memory. Generally, objects
    can be accessed in two ways: directly by their symbolic name, or indirectly through
    a pointer. The act of getting to object via a pointer to it, is called **dereferencing**
    the pointer. Pointer variables are defined to point to objects of a specific type
    so that when the pointer is dereferenced, a typed object is obtained.


    ```

    ptr = &var;

    ```


    This would assign to variable **ptr** the address of variable **var**, since when
    preceding the name of the variable **var** with the ampersand (& & ) character
    we are no longer talking about the content of the variable, but about its address
    in memory.


    We are going to suppose that **var** has been placed in the memory address **1776**
    and that we write the following:


    ```

    var=25;

    x=var;

    ptr = &var;

    ```


    The result will be the one shown in the following diagram:


    | | | |

    |---|---|---|

    | 1775 | 1776 | 1777 |

    | | var & | |

    | | | ptr |

    | 25 | | 1776 |


    We have assigned to x the content of variable var as we have done in many other
    occasions in previous sections, but to ptr we have assigned the address in memory
    where the operating system stores the value of var , that we have imagined that
    it is 1776 (it can be any address). The reason is that in the allocation of ptr
    we have preceded var with an ampersand (& ) character. The variable that stores
    the address of another variable (like ptr in the previous example) is by what
    we call a pointer.


    ## 6.1. Declaring Pointers:


    Is reserving a memory location for a pointer in the heap. Syntax:


    ```

    type * pointer_name ;

    ```


