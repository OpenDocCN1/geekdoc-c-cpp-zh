    can be referred using a single name (group name) and a member name. You can refer
    to a structure as a single variable, and you also can initialize, read and change
    the parts of a structure (the individual variables that make it up). Each element
    (called a member) in a structure can be of different data type. The General Syntax
    of structures is:


    ```

    Struct [structure tag]

    {

    Member definition; Member definition; ...

    Member definition;


    }[one or more structure variables];

