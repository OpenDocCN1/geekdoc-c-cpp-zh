    ## 5.6. 字符字符串：什么是字符串？


    在目前为止我们看到的所有程序和概念中，我们只使用了数值变量来专门表示数字。但数值变量之外，还存在字符串，它允许我们表示连续的字符，如单词、句子、名称、文本等。到目前为止我们只将它们作为常量使用，但从未考虑过让变量包含它们。


    在 C++ 中，没有基础变量类型来存储字符字符串。为了实现这一功能，我们可以使用 `char` 类型的数组，它是 `char` 元素的序列。记住，这种数据类型（`char`）用于存储单个字符的，因此通常使用它们的数组来制作单字符组成的字符串。


    例如，以下数组（或字符字符串）可以存储长达 20 个字符的字符串。你可以这样想象：


    ```

    char name [20];

    ```


    ```

    name

    ```


    这 20 个字符的最大长度并不总是需要完全用完。例如


    我们可以通过以下方式表示 `name`（一个包含 20 个 `char` 类型元素的数组），存储字符字符串 "Hello" 和 "Studying C++"：


    ```

    Hello\0

    Studying C++\0

    ```


    注意在有效内容之后包含了一个空字符（`''\0''`）以指示字符串的结束。空单元（元素）表示不确定值。


    ## 5.7. 字符串的初始化


    由于字符字符串是普通数组，它们遵循与任何数组相同的规则。例如，如果我们想用预定义的值初始化字符字符串，可以以类似于任何其他数组的方式来实现：


    ```

    char mystring[] = { ''H'', ''e'', ''t'', ''o'', ''\0'' };

    ```


    在这种情况下，我们声明了一个包含 6 个 `char` 类型元素的字符字符串（数组），并用组成 Hello 的字符加上一个空字符 `''\0''` 对其进行了初始化。


    尽管如此，字符字符串还有另一种方法来初始化它的值：使用常量字符串。

    在之前章节示例中使用的表达式中，已经多次出现过代表整个字符字符串的常量。这些常量通过包含在双引号（`" "`）之间指定，例如：


    例："the result is: " 是我们可能在某些场合使用过的常量字符串。


    与允许指定单字符常量的单引号（`'' ''`）不同，双引号（`""`）是指定字符序列的常量。这些双引号之间的字符串末尾会自动附加一个空字符（`''\0''`）。

    因此，我们可以通过以下两种方法之一初始化字符串 `mystring` 的值：


    ```

    char mystring[] = { ''H'', ''e'', ''t'', ''o'', ''\0'' }; char mystring[] = "Hello";

    ```


    在这两种情况下，数组或字符字符串 `mystring` 声明的大小均为 6 个字符（`char` 类型元素）：组成 Hello 的 5 个字符加上一个指定字符串结束的空字符（`''\0''`），在第二种情况下，使用双引号（`""`）会自动附加该字符。


    ```

    mystring="Hello";

    mystring[] = "Hello";

    ```

    两者都不是：mystring = { ''H'', ''e'', ''l'', ''l'', ''o'', ''\0'' };

    ```


    记住：我们只有在初始化数组的那一刻才能向数组“分配”多个常量。原因是：在初始化数组时，我们可以包含一个初始化列表，因此我们包含了第二个参数，用于告知函数作为第一个参数传递的每个数组的长度，以便打印数组的
    `for` 循环能够获取我们感兴趣的大小信息。`mult` 函数将每个元素的值翻倍，并将 `firstarray` 传递给它。输出被修改了，表明数组是按引用传递的。


    要按值传递数组，请将每个元素传递给函数。


    ## 给字符串赋值


    就像其他其他变量一样，可以使用赋值运算符给字符串赋值。赋值在初始化时允许的。

    mystring="Hello";


    另一种为数组赋值的常用方法是直接使用输入流（ **cin**）。在这种情况下，字符串的值是由用户在程序执行期间赋值的。

    当 **cin** 用于字符字符串时，通常使用它的 **getline** 方法，该方法可以按照以下原型调用：

    **cin.getline ( char buffer [], int length, char delimiter = ''\n'' )**

    **其中** 是用于存储输入的地址（类似于数组，例如），**length** 是缓冲区的最大长度（数组的大小），**delimiter** 是用于确定用户输入结束的字符，如果不包含该参数，它默认将是换行符（`''\n''`）。


    以下示例重复你在键盘上输入的任何内容。它非常简单，但可以作为你如何与字符串一起 **cin.getline** 的示例：


    ```

    // cin 与字符串


    #include <iostream.h>

    #include <conio.h>

    int main ()

    {


    char mybuffer [100];

    out << "What''s your name? ";

    cin.getline(mybuffer,100);

    out << "Hello " << mybuffer << ".",\n";

    }

    ```


