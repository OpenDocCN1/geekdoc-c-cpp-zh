    \ `delete` 运算符，其形式为：\n\n```cpp\ndelete pointer;\n或\ndelete [] pointer;\n```\n\
    - 第一个表达式应用于删除单个元素分配的内存，第二个用于为多个元素（数组）分配的内存。\n- 在大多数编译器中，这两个表达式是等价的，可以区分使用，尽管它们确实是两个不同的运算符，在运算符重载时必须考虑它们。\n\
    - 在下面的示例中，一个记录数字的程序对引入的数量没有限制，这归功于指针的概念请求系统足够的空间来存储用户想要的所有数字。\n\n```cpp\n#include\
    \ <iostream>\n#include <stdlib.h>\n#include <conio.h>\nint main ()\n{\nchar input\
    \ [100];\nint *n;\nlong *num;// total = 0;\ncout << \"How many numbers do you\
