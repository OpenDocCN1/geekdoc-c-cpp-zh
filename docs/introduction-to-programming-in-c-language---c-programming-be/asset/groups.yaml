    input. This method can also be used instead of cin.getline with strings of characters.
    For example, in our program, when we requested an input from the user we could
    have written:


    ```cpp

    cin >> mybuffer;

    ```

    this would work, but this method has the following limitations cin.getline has:


    - It can only receive single words (no complete sentences) since this method uses
    as delimiter any occurrence of a blank character, including spaces tabulations,
    newlines and carriage returns.

    - It is not allowed to specify a size for the buffer. What makes your program
    unstable in case that the user input is longer than the array that will host.


    For these reasons it is recommend that whenever you require strings of characters
    coming from cin you use cin.getline instead of cin >> .


    ## Converting strings to other types


    Due to that string may contain representations of other data types it might be
    useful to translate that content to a variable of a numeric type. For example,
    a string may contain "1977", but this is a sequence of 5 chars not so easily convertible
    to a single integer data type. The stdlib.h library provides three useful functions
    for this purpose:


    - atoi: converts string to int type.

    - atol: converts string to long type.

    - atof: converts string to float type.


    All of these functions admit one parameter and return a value of the requested
    type (int, long or float). These functions combined with getline method of cin
    are a more reliable way to get the user input when requesting a number than the
    classic cin>>>> method:


    // cin and ato* functions


    ```cpp

    #include <iostream.h>

    #include <stdlib.h>

    #include <conio.h>

    int main()

    { clrscr();


    char mybuffer[100];

    float price;

    int quantity;

    cout << "Enter price: ";

    cin.getline(mybuffer,100);

    price = atof(mybuffer);

    cout << "Enter quantity: ";

    cin.getline(mybuffer,100);

    quantity = atoi(mybuffer);

    cout <<"\nafter conversion: \n";

    cout <<"\nprice is: " <<price;

    cout <<"\nquantity is : " <<quantity; cout << "\nTotal price: " <<price*quantity;
    getch();

    return 0;

