    为了允许数组作为参数，我们在声明函数时唯一必须做的是在参数中指定它所包含的数组的基类型、一个标识符和一对空括号 `[]`。例如，以下函数：


    ```

    void procedure(int arg[])

    ```

    接受一个类型为“int 数组”、名为 `arg` 的参数。为了向此函数传递一个声明如下的数组：

    `int myArray[40];`

    只需如下调用：

    `procedure(myarray);` 这里有一个完整的示例：数组作为参数


    #include <iostream.h>

    #include <conio.h>

    void printarray(int arg[], int length) {

    for (int n=0; n<length; n++) cout << arg[n] << " " << cout << "\n";

    }

    void mult(int arg[], int length) {

    for (int n=0; n<length; n++) arg[n]=2*arg[n];

    }


    void main () {

    int firstarray[] = {5, 10, 15};

    int secondarray[] = {2, 4, 6, 8, 10};

