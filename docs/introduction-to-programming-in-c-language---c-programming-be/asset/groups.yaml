    | | 2 | | | | |


    Matrix represents a bi-dimensional array of 3 per 5 values of type int . The

    way to declare this array would be:

    int matrix[3][5];

    For example, to reference the second element vertically and fourth

    horizontally in an expression would be:

    matrix[1][3]


    | 0 | 1 | 2 | 3 | 4 |

    |---|---|---|---|---||

    | matrix | | | | | |

    | 1 | | | | | |

    | 2 | | | matrix [1] [3] |


    (remember that array indices always begin by 0 )


    Multidimensional arrays are not limited to two indices (two dimensions).

    They can contain so many indices as needed, although it is rare to have to

    represent more than 3 dimensions. Just consider the amount of memory that'
  - '[PAGE 84]


    an array with many indices may need. For example:


    char century [100][365][24][60];


    Assigns a **char** for each second contained in a century, that is more than 3
    billion chars ! What would consume about 3000 megabytes of RAM memory if we could
    declare it?

    Multidimensional arrays are nothing else than an abstraction, since we can simply
    obtain the same results with a simple array by putting a factor between its indices:


    **int matrix [3][5];** is equivalent to

    **int matrix [15];** (3 * 5 = 15)


    With the only difference that the compiler remembers for us the depth of each
    imaginary dimension. Serve as these two pieces of code, exactly the same result,
    one using bi-dimensional arrays and the other using only simple arrays:


