    ## Functions to manipulate strings


    The cstring library (string.h) defines many functions to perform some manipulation
    operations with C-like strings (like already explained strcpy). Here you have
    a brief with the most usual:


    ### a) String length


    Returns the length of a string, not including the null character (0). **strlen(const
    char* string);**


    ### b) String Concatenation:


    Appends src string at the end of *dest* string. Returns *dest*. The string concatenation
    can have two forms, where the first one is to append the whole content of the
    source to the destination the other will append only part of the source to the
    destination.


    - Adding the whole content of the source

    **strcat(char* dest, const char* src);**

    - Appending part of the source

    **strncat(char* dest, const char* src, int size);**

    Where size is the number characters to be appended.


    ### c) String Copy:


    Overwrites the content of the *dest* string by the *src* string. The string copy
    can have two forms, where the first one is to copying the whole content of the
    source to the destination and the other will copy only part of the source to the
    destination.


    - Copy the whole content of the source

    **strcpy(char* dest, const char* src);**

    - Appending part of the source

    **strncpy(char* dest, const char* src, int size);**

    Where size is the number characters to be copied.


    ### d) String Compare:


    Compares the two string *string1* and *string2*.

    The string compare can have two forms, where the first one is to compare the whole
    content of the two strings and the other will compare only part of the two strings.


    - Copy the whole content of the source

    strcmp(const char* string1 , const char* string2);

    - Appending part of the source

    strcmp(const char* string1, const char* string2, int size ); Where size is the
    number characters to be compared Both string compare functions returns three different
    values:


    - Returns 0 if strings are equal

    - Returns negative value if the first is less than the second string

    - Returns positive value if the first is greater than the second string


