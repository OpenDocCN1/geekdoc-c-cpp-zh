    # 7.4.2: Random Access File Concepts


    -Random access enables you to read or write any data in your disk file with having
    out to read and write every piece of data that precedes it.

    -Generally you read and write file records. A record to a file is analogues to
    a C++ structure. A record is a collection of one or more data values (called fields)
    that you read and write to disk. Generally you store data in the structures and
    write structures to disk.

    -When you read a record from disk, you generally read that record into a structure
    variable and process it with your program.

    -Most random access files are fixed-length records. Each record (a row in the
    file) takes the same amount of disk space.

    -With fixed length records, your computer can better calculate where on the disk
    the desired record is located.


    0 100 200 300 400 500 Byte

    offsets


    100 100 ..................... 100 100 Bytes bytes bytes bytes


    # 7.2.2.1 Opening Random-Access Files


    -There is really no difference between sequential files and random files in C+.
    The difference between the files is not physical, but lies in the method that
