    -The ostream member function writes a fixed number of bytes, beginning at a specific
    location in memory, to the specified stream.

    -When the stream is associated with a file, function writes the data at the location
    specified by the “put” file pointer.

    -The istream member function reads a fixed number of bytes from the specified
    stream into an area in memory beginning at the specified address.

    -When the stream is associated with a file, function read inputs bytes at the
    location in the file specified by the “get” file poison pointer.'
