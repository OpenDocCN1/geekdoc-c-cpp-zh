    # 1.9. Mechanics of Creating a program (C++)


    C++ programs typically go through five phases to be executed: these are edit,
    preprocess, compile, link, load:


    Edit: this is accomplished with an editor program. The programmer types C++ statements
    with the editor and makes corrections if necessary. The programs source file is
    then stored on secondary storage device such as a disk with ".cpp" file name.


    After the program is edited, C++ is principally compiled in three phases: preprocessing,
    translation to object code, and linking (the last two phases are what are generally
    thought of as the "comp" process). Preprocess: In a C++ system, a preprocessor
    program executes automatically before the compiler''s translation phase begins.
    The C++ preprocessor obeys command preprocessor directives, which indicate that
    certain manipulations are to be performed on the program before compilation. The
    preprocessor is invoked by the compiler before the program is converted to machine
    language. The C++ preprocessor goes over the program text and carries out the
    instructions specified by the preprocessor directives (e.g., #include). The result
    is a modified program text which no longer contains any directives. Compile: Then,
    the C++ translates the program code. The compiler may be a true C++ compiler which
    generates native (assembly or machine) code. The output may be incomplete due
    to the program referring to library routines which are not defined as a part of
    the program. For example, the << operator which is actually defined in a separate
    IO library.


    Linking: C++ programs typically contain references to functions and data defined
    else where, as in the standard libraries. The object code produced by the C++
    compiler typically contains "holes" due to these missing parts. A linker links
    the object code with the code for the missing function to produce an executable
    image (with no missing pieces). Generally, the linker completes the object code
    by linking it with the object code of any'
