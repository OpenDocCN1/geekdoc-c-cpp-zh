  md: '# 1.1. Generations of programming language.


    Programming languages are categorized into five generations: (1st, 2nd, 3rd, 4th
    and 5th generation languages)

    These programming languages can also be categorized into two broad categories:
    low level and high level languages.


    o Low languages are machine specific or dependent. o High level languages like
    COBOL, BASIC are machine independent and can run on variety of computers.


    From the five categories of programming languages, first and second generation
    languages are low level languages and the rest are high level languages.

    The higher the level of a language, the easier it is to understand and use by
    programmers.


    Languages after the forth generation are refereed to as a very high level languages.


    # 1.1.1. First Generation (Machine languages, 1940s):


    Difficult to write applications with.

    Dependent on machine languages of the specific computer being used.

    Machine languages allow the programmer to interact *directly with the hardware*,
    and it can be executed by the computer without the need for a translator.


    Is more powerful in utilizing resources of the computer.

    Gives power to the programmer.

    They execute very quickly and use memory very efficiently.


    # 1.1.2. Second Generation (Assembly languages, early 1950s):


    Uses symbolic names for operations and storage locations. A system program called
    an *assembler* translates a program written in assembly language to machine language.


    Programs written in assembly language are not portable. i.e., different computer
    architectures have their own machine and assembly languages.

    They are highly used in system software development.


    # 1.1.3. Third Generation (High level languages, 1950s to 1970s):


    Uses English like instructions and mathematicians were able to define variables'
