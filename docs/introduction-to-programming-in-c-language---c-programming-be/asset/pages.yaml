    # 4.1. Function Basics


    One of the best ways to tackle a problem is to start with the overall goal, then
    divide this goal into several smaller tasks. You should never lose sight of the
    overall goal, but also think of how individual pieces can fit together to accomplish
    such a goal. If your program does a lot, break it into several functions. Each
    function should do only one primary task.


    # 4.2. Summarized function basics.


    +   C++ functions generally adhere to the following rules.

    1. Every function must have a name.

    2. Function names are made up and assigned by the programmer following the same
    rules that apply to naming variables. They can contain up to 32 characters, they
    may not begin with a letter, and they can consist of letters, numbers, and the
    underscore (_) character.

    3. All function names have one set of parenthesis immediately following them.
    This helps you (and C++ compiler) differentiate them from variables.

    4. The body of each function, starting immediately after parenthesis of the function
    name, must be enclosed by braces.


    # 4.3. Declaring, defining and calling functions


    # 4.3.1. Declaring function:


    +   The interface of a function (also called its prototype) specifies how it may
    be used. It consists of three entities:

    - The function return type. This specifies the type of value the function returns.
    A function which returns nothing should have a return type void.

    - The function name. this is simply a unique identifier

    - The function parameters (also called its signature). This is a set of zero or
    more typed identifiers used for passing values to and from the function.'
