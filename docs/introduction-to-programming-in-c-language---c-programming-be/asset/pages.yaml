    # 4.3.3. Calling the function:


    +   o Using a function involves ‘calling’ it.

    o Calling a function means making the instruction of the function to be executed.


    A function call consists of the function name followed by the call operator brackets
    ‘()’, inside which zero or more comma-separated arguments appear. The number and
    type of arguments should match the function parameters. Each argument is an expression
    whose type should match the type of the corresponding parameter in the function
    interface.


    When a function is executed, the arguments are first evaluated and their resulting
    values are assigned to the corresponding parameters. The function body is then
    executed. Finally the return value (if any) is passed to the caller.


    A function call in C++ is like a detour on a highway. Imagine that you are traveling
    along the “road” of the primary function called main(). When you run into a function-calling
    statement, you must temporarily leave the main() function and execute the function
    that was called. After that function finishes (its return statement is reached),
    program control returns to main(). In other words, when you finish a detour, you
    return to the “main” route and continue the trip. Control continues as main()
    calls other functions.

