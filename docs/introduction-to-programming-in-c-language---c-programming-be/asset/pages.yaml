  md: '# 4.3.1. The continue statement


    The continue statement terminates the current iteration of a loop and instead
    jumps to the next iteration.

    It is an error to use the continue statement outside a loop.

    In while and do loops, the next iteration commences from the loop condition.

    In a "for" loop, the next iteration commences from the loop’s third expression.


    E.g.:


    ```

    for(int n=10;n>0;n--)

    { if(n==5)

    continue;//causes a jump to n--

    cout<<n<< " "; }

    ```


    When the continue statement appears inside nested loops, it applies to the loop
    immediately enclosing it, and not to the outer loops. For example, in the following
    set of nested loops, the continue statement applies to the “for” loop, and not
    to the “while” loop.


    E.g.:


    while(more)


    ```

    {

    for(i=0;i<n;i++)

    { cin>>num;


    if(num<0)

    continue;//causes a jump to : i++ }

    ```


