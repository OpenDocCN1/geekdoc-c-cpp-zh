    Procedural, Structured and Object Oriented Programming Paradigms.


    # 1.4.1. Procedural Programming.


    +   o Procedural programming is a programming paradigm based upon the concept
    of **procedure call**. Procedural programming is often a better choice than simple
    sequential programming in many situations which involve moderate complexity or
    require significant ease of maintainability.


    +   o Possible benefits: the ability to re-use the same code (function or procedure)
    at different places, an easier way to keep track of program flow than a collection
    of “GO TO” or “JUMP” statements.


    # 1.4.2. Structured Programming.


    +   o Process of writing a program in small, independent parts. This makes it
    easier to control a program''s development and to design and test its individual
    component parts.


    +   o Structured programs are built up from units *modules*, which normally correspond
    to single procedures or functions.

    o Can be seen as a *subset* or sub discipline of *procedural programming*. It
    is most famous for removing or reducing reliance on the GO TO statement.


    # 1.4.3. Object-Oriented Programming.


    +   o The idea behind OOP is, that computer program is composed of a collection
    of *individual units, or objects* as opposed to traditional view in which a program
    is a list of instructions to the computer.


    +   o Object-oriented programming is claimed to give more flexibility, easing
    changes to programs. The OOP approach is often simpler to develop and'
