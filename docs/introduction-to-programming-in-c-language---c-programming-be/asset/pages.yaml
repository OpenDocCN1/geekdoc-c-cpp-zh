  md: '# 6.7. Pointer Arithmetic


    To conduct arithmetical operations on pointers is a little different than to conduct
    them on other integer data types. To begin, only addition and subtraction operations
    are allowed to be conducted, the others make sense in the world of pointers. But
    both addition and subtraction have a different behavior with pointers according
    to the size of the data type to which they point to.


    When we saw the different data types that exist, we saw that some occupy more
    or less space than others in the memory. For example, in the case of integer numbers,
    char occupies 1 byte, short occupies 2 bytes and long occupies 4. Let''s suppose
    that we have 3 pointers:


    ```

    char *mychar; short *myshort; long *mylong;

    ```


    And that we know that they point to memory locations 1000 , 2000 and 3000 respectively.
    So if we write:


    ```

    mychar++; myshort++; mylong++;

    ```


    mychar , as you may expect, would contain the value 1001 . Nevertheless, myshort
    would contain the value 2002 , and mylong would contain 3004 . The reason is that
    when adding 1 to a pointer we are making it to point to the following element
    of the same type with which it has been defined, and therefore the size in bytes
    of the type pointed is added to the pointer.'
