  md: '# Chapter One Introduction


    What is programming?

    **Programming** is a skill that can be acquired by a computer professional that
    gives him/her the knowledge of making the computer perform the required operation
    or task.


    Why do we need to learn computer programming?

    **Computer programming** is critical if one wants to know how to make the computer
    perform a task. Most users of a computer only use the available applications on
    the computer. These applications are produced by computer programmers. Thus if
    someone is interested to make such kind of applications, he/she needs to learn
    how to talk to the computer, which is learning computer programming.


    What is programming language?

    **Programming Language:** is a set different category of written symbols that
    instruct computer hardware to perform specified operations required by the designer.


    What skills do we need to be a programmer?

    For someone to be a programmer, in addition to basic skills in computer, needs
    to have the following major skills:


    +   - **Programming Language Skill**: knowing one or more programming


    language to talk to the computer and instruct the machine to perform a task.


    +   - **Problem Solving Skill**: skills on how to solve real world problem and
    represent the solution in understandable format.


    +   - **Algorithm Development**: skill of coming up with sequence of simple and
    human understandable set of instructions showing the step of solving the problem.
    Those set of steps should not be dependent on any programming language or machine.


    In every programming Language there are sets of rules that govern the symbols
    used in a programming language. These set of rules determine how the programmer
    can make the computer hardware to perform a specific operation. These sets of
    rules are called **syntax**.'
