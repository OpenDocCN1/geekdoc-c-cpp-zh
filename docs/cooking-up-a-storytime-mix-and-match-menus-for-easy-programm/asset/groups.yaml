  - '[PAGE 38]


    *Arf! Beg! Catch! Dogs from A to Z* by Henry Horenstein (Scholastic, 1999). A
    simple alphabet book of dogs with large and alluring photographs. Perfect for
    discussion!


    *The Book of ZZZs* by Arlene Alda (Hyperion Books for Children, 2005). Large full-page
    photographs populate this look at the many ways animals and people sleep. Perfect
    for sharing with toddlers or preschoolers.


    *Clothes in Many Cultures* by Heather Adamson (Capstone Press, 2007). This very
    simple book features full-page photographs of clothing worn for a variety of purposes.


    *A Cool Drink of Water* by Barbara Kerley (National Geographic Society, 2002).
    A photographic journey portraying people around the world enjoying a cool drink
    of water. Gorgeous.


    *The Cutest Critter* by Marion Dane Bauer (Adventure Publications, 2010). This
    is a perfect title to use at storytimes. Large, full-page photographs accompanied
    by simple text introduce children to many different animals. And it rhymes!


    *Do You Know about Reptiles?* by Buffy Silverman (Lerner, 2010). Large photographs
    and simple yet interesting text make this a nice choice for sharing.


    *Families* by Ann Morris (HarperCollins, 2000). Large photographs of families
    around the world combined with simple text make this an enjoyable read for preschool
    storytimes.


    *Growing Colors* by Bruce McMillan (Lothrop, Lee and Shepard, 1988). This book
    is so simple, only one word per page, but the photographs just beg for conversation.
    A gem for all ages.


    *Hair* by Nicola Whittaker (Gareth Stevens, 2002). The entertaining photographs
    and accessible text make this a great choice for reading in its entirety at storytimes.


    *I''m a Seed* by Jean Marzollo (Scholastic, 1996). This easy reader makes a great
    storytime book as it follows two seeds trying to discover their futures.


    *My Five Senses* by Margaret Miller (Simon and Schuster Books for Young Readers,
    1994). Very simple text, wonderful photographs, and lots of possibilities for
    interaction make this a perfect storytime book.


    *Pattern Fish* by Trudy Harris (Millbrook Press, 2000). This wonderfully fun book
    is ideal for storytimes. The pattern is established on a double-page spread featuring
    some sort of sea creature. The children are prompted to complete the pattern when
    the page is turned. Hilarious illustrations.


    *Plant Patterns* by Nathan Olson (Capstone Press, 2007). Oversized photographs
    of plants and gardens and very simple text mean this book can be nicely shared
    in its entirety at storytime. Nice for discussion as well.


    *Rah, Rah, Radishes! A Vegetable Chant* by April Pulley Sayre (Beach Lane Books,
    2011). A great storytime book thanks to its beautiful photographs of vegetables
    far and wide and its accompanying rhyming chant.'
