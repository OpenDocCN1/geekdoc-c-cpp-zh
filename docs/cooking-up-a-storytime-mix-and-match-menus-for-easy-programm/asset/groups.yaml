    # ### Suggested Informational Title


    *Clothes in Many Cultures* by Heather Adamson (Capstone Press, 2007). This very
    simple book features full-page photographs of clothing worn for a variety of purposes.


    # ### Fingerplay or Story


    Getting Dressed (chapter 4)


    # ### Poem


    “Dressing Too Quickly” by Jill Townsend, in *Here’s a Little Poem*, collected
    by Jane Yolen (Candlewick, 2007), p. 14.


    # ### Interactive Games and Activities


    Print photographs of different kinds of hats and engage the children in a discussion
    about who uses which hat and why. (Include a silly hat photo, like the Cat in
    the Hat’s hat or the Mad Hatter’s hat.)


    Microphone (chapter 6): Using the microphone, describe an article of clothing
    that you really love (or loved). Encourage the children to individually share
    favorite articles of clothing.


    # ### Math Activity


    Moving Shapes (chapter 7)


    # ### Science Activity


    Shoes (chapter 8)


    # ### Additional Fiction Titles


    *Animals Should Definitely Not Wear Clothing* by Judi Barrett (Atheneum, 1970).
    The humor of animals wearing inappropriate clothing appeals to young children
    and those who are young at heart!


    *Froggy Gets Dressed* by Jonathan London (Viking, 1992). A crowd-pleaser with
    a wonderful repeating exchange between Froggy and his mother.


    *Jesse Bear, What Will You Wear?* by Nancy Carlstrom (Simon and Schuster Books
    for Young Readers, 1986). Jesse Bear looks at all the things he will wear in a
    day—clothing and other things! This rhyming book could spark some interesting
    discussion about things we wear besides clothes.


    *My Mother’s Sari* by Sandhya Rao (Lerner, 2011). A very simple book about a young
    girl’s feelings about her mother’s beautiful sari.


    *Old Hat, New Hat* by Stan Berenstain (Random House, 1970). Filled with adjectives
    describing hats, this simple book works well as an introduction to a box of real
    hats for dressing up (for smaller groups).'
  - '[PAGE 147]


    *What Color Is Your Underwear?* by Sam Lloyd (Scholastic, 2004). The combination
    of animals and underwear guarantees a hit for storytimes.


    *Which Hat Is That?* by Anna Grossnickle Hines (Harcourt, 2002). A name-the-hat
    guessing game with a lift-the-flap format.


    *Whose Hat?* by Margaret Miller (William Morrow, 1997). The hat photographs in
    this book make a great guessing game for both toddlers and preschoolers.


    # Additional Informational Titles


    *Clothes* by Karen Bryant-Mole (Rigby Interactive Library, 1997). Simple yet sizable
    photographs give a nice amount of information about clothes.


    *Shoes, Shoes, Shoes* by Ann Morris (Lothrop, Lee and Shepard, 1995). Very simple
    text and photographs showing people all over the world and the shoes they wear
    make this a perfect book for toddlers. As a discussion starter this would work
    well for preschool storytimes too.


    *Whose Shoes? A Shoe for Every Job* by Stephen R. Swinburne (Boyds Mills Press,
    2010). A photographic journey through shoes and feet with interaction built in.
    Wonderful gender-bending photographs as well.


    # Additional Poem


    > "The Smart Lady" by Rose Fyleman, in *Mary Middling and Other Silly Folk: Nursery
    Rhymes and Nonsense Poems* (Clarion Books, 2004), unp.


    # Color


    # Suggested Fiction Titles


    *A Color of His Own* by Leo Lionni (Pantheon Books, 1975). A little chameleon
    tries on different colors looking for one that suits him. Show photos of real
    chameleons to preschoolers after reading the book for connection to the real world.


    *Wow! Said the Owl* by Tim Hopgood (Farrar, Straus and Giroux, 2009). The bright,
    colorful illustrations, the repeating line, and the charming story of a little
    owl experiencing the daytime for the first time make this a favored storytime
    choice.


    *Pete the Cat: I Love My White Shoes* by Eric Litwin (Harper, 2010). It introduces
    color, it rhymes, you can sing it, children adore it—this one is a keeper, indeed.'
