    *Directions*


    Holding the cards face down in your lap, flip them up one at a time and ask the
    children, “Is this a picture or a word?”


    # Picture/Word/Number


    *Supplies*


    +   - photographs of interesting items or objects

    +   - numbers for each of the photographs

    +   - names of the items or objects printed on cards or paper

    +   - tape


    *Directions*


    Tape the photographs on the walls of the storytime room with a number beside each
    one. Place the object names in your lap and flip them over one at a time, reading
    the name aloud and running your finger across its letters. Encourage the children
    to look around the room for the object and call out its corresponding number.


    # Rhyming Bag


    *Supplies*


    +   - simple words printed on cards or small pieces of paper (for example, book,
    bake, ate, cat, bear, feet, pet, pig, pit, bite, dog, pot, boot, cow, dug, due,
    up)

    +   - small box or bag


    *Directions*


