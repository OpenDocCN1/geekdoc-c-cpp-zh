    # *Supplies*


    +   - yellow felt (sun)

    +   - white felt (birds)

    +   - brown felt (boat)

    +   - gray felt (whale)

    +   - pink felt (coral)

    +   - green felt (fish)

    +   - blue felt (sea)

    +   - scissors


    # *Directions*


    Download patterns 5.2 through 5.8 from alaeditions.org/webextras. Using the patterns,
    cut the sun, birds, boat, whale, coral, fish, and sea out of the chosen shades
    of felt.


    # *Telling*


    Arrange all the items on the flannelboard before you begin the story. As you complete
    each line, pause, allowing the children to choose the appropriate rhyming piece
    to remove.


    # **The Rat, the Gnat, and the Fine, Fat Cat**


    This flannelboard is a fun exploration of the “at” sound—great for decoding the
    sounds of words and determining what they have in common. You may strengthen the
    children’s rhyming skills by turning the story into a completion prompt if you
    like.


    Once there was a cat.

    He was actually quite fat.

    He wore a tall top hat,

    This fine, fat cat.


    He had a friend, a rat,

    Who held a baseball bat,

    And sat upon a mat

    Beside the fine, fat cat.


    A tiny, noisy gnat

    Buzzed around the rat,

    Buzzed around the cat,

    And buzzed around his hat.'
