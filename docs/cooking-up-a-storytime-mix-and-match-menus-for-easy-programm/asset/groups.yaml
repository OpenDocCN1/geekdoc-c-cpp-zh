    a bit small for large storytimes, but the story is big enough to share.


    *The Doghouse* by Jan Thomas (Harcourt, 2008). Children will love the hilarious
    mystery of why the animals keep disappearing into the doghouse.


    *A Dog Needs a Bone* by Audrey Wood (Blue Sky Press, 2007). In hilarious rhyming
