  - '[PAGE 160]


    # Additional Informational Titles


    *Families* by Debbie Bailey (Annick Press, 1999). This lovely book looks big,
    but it is divided into sections: “My Mom,” “My Dad,” “Brothers,” “Sisters,” “Grandpa,”
    and “Grandma.” Photos of many different families engaged in many different activities
    make this a fine book to share at least in part.


    *Our Grandparents: A Global Album* by Maya Ajmera (Charlesbridge, 2010). Gorgeous
    photographs from all over the world show children and their grandparents engaging
    in many activities together.


    # Additional Poems


    “Grandpa” by Berlie Doherty, in *Here’s a Little Poem*, collected by Jane Yolen
    (Candlewick, 2007), p. 39.


    “Piggy Back” by Langston Hughes, in *Here’s a Little Poem*, collected by Jane
    Yolen (Candlewick, 2007), p. 30.


    # Farms


    # Suggested Fiction Titles


    *Farmer Duck* by Martin Waddell (Candlewick, 1992). Children love this funny story
    about a duck that tires of doing all the farmer’s work.


    *Hattie and the Fox* by Mem Fox (Bradbury Press, 1986). The hen’s observation
    of a nose, eyes, ears, and so on, and the repeated reactions of the other farm
    animals will easily hold the interest of preschoolers at storytime.


    *Tippy-Toe Chick, Go!* by George Shannon (Greenwillow, 2003). The little chick
    who outsmarts the dog plus the vibrant illustrations will delight children in
    this made-to-be-read-aloud book.


    # Suggested Informational Title


    *Senses on the Farm* by Shelley Rotner (Millbrook Press, 2009). The attention
    drawn to the senses makes this a really memorable book to use at story-time. The
    accompanying photographs are terrific.


    # Fingerplay or Story


    +   - The Farmer (chapter 4)

    +   - A Visit to the Farm (chapter 4)'
  - '[PAGE 161]


    # **Poem: “Chook, Chook”** *(Anonymous)*


    Chook, chook, chook, chook,

    Good morning, Mrs. Hen,

    How many chickens have you got?

    Madam, I''ve got ten.

    Four of them are yellow,

    Four of them are brown,

    And two of them are speckled red,

    The nicest in the town.


    # **Interactive Games and Activities**


    Duplicate small photos of farm animals with their names typed below them. Pass
    out the photographs and tell the children that they are part of the library barn.
    When you raise your hands, the children should make their animal sound. When you
    lower your hands, they should quiet down.


    For large groups, show photos of farm animals and have all the children make the
    animal sounds together.


    # **Math Activity**


    Using a tape measure, show the children the approximate size of a chicken and
    compare that to the approximate size of a cow. Engage the children in a discussion
    of chickens or cows they may have seen. What did they look like? Sound like? Smell
    like? What other animal sizes could you approximate?


    # **Science Activity**


    Bring in a hard-boiled egg for the children to handle. Engage them in a discussion
    about chickens and eggs. If some of the children have chickens, encourage them
    to describe what their chickens look like, what sounds they make, what color eggs
    they lay, and so on.


    # **Additional Fiction Titles**


    +   - *Barnyard Banter* by Denise Fleming (Henry Holt, 1994). A wonderfully simple
    book featuring farm animals and their sounds.

    +   - *The Big Sneeze* by Ruth Brown (Lothrop, Lee and Shepard, 1985). A hilarious
    book about the consequences around the farm when a fly causes the farmer to sneeze.

    +   - *Bob* by Tracey Campbell Pearson (Farrar, Straus and Giroux, 2002). The
    amusing story of a rooster''s search for his own sound plus the large, vivid illustrations
    will make this a favorite at storytimes.'
  - '[PAGE 162]


    *Cat Goes Fiddle-i-fee* by Paul Galdone (Clarion Books, 1985). The old cumulative
    song is accompanied by Galdone’s wonderful illustrations in this classic for preschoolers.


    *Click, Clack, Moo: Cows That Type* by Doreen Cronin (Simon and Schuster Books
    for Young Readers, 2000). This very funny book may be a bit over the preschooler’s
    heads, but adding a demonstration using a typewriter or putting one out for experimentation
    after storytime could be a very popular activity.


    *Cock-a-Doodle-Doo: A Farmyard Counting Book* by Steve Lavis (Lodestar Books/Dutton,
    1997). A simple counting book with lots of opportunities for barnyard animal noises.


    *Cock-a-Doodle-Moo* by Bernard Most (Harcourt Brace, 1996). The hilarious mix-up
    of animal sounds in this book keeps the children laughing. And it’s very fun to
    read aloud!


    *Duck on a Bike* by David Shannon (Blue Sky Press, 2002). Children will enjoy
    Duck’s daring and the absurdity of all the animals on bikes. Large illustrations
    and great humor.


    *First the Egg* by Laura Vaccaro Seeger (Roaring Brook Press, 2007). Use this
    book to talk about the concept first . . . and then . . . and then. Relate it
    to an activity or event for the day (for example, “First we sing a welcome song
    and then we read a book and then . . .”) and let the children fill in the blanks.
    This is a great activity for developing vocabulary and narrative skills as well
    as early math skills.


    *A Hat for Minerva Louise* by Janet Stoeke (Dutton Children’s Books, 1994). This
    classic about a somewhat clueless hen has many dialogic reading prompts embedded
    in the story.


    *Hello, Day!* by Anita Lobel (Greenwillow, 2008). Beautiful illustrations introduce
    the animals on the farm. This is a great book for those who enjoy making animal
    sounds.


    *Hurry! Hurry!* by Eve Bunting (Harcourt, 2007). This very simple book introduces
    some excellent vocabulary as well as many farm animals. The loving ending makes
    this a nice book for young listeners.


    *Los Pollitos Dicen / The Baby Chicks Sing* by Nancy Abraham Hall (Little, Brown,
    1994). Choose one of the singing rhymes to share from this wonderful book.


    *Mary Had a Little Lamb* by Sarah Hale, illustrated by Tomie dePaola (Holiday
    House, 1984). The adorable illustrations make this a nice choice for sharing.


    *One Red Rooster* by Kathleen Sullivan Carroll (Houghton Mifflin, 1992). It counts,
    it rhymes, it has lovely illustrations—this book has something for everyone.'
  - '[PAGE 163]


    *One Windy Wednesday* by Phyllis Root (Candlewick, 1996). This book’s small format
    might make it challenging for large groups, but the amusing story has too much
    child appeal to pass up!


    *The Piggy in the Puddle* by Charlotte Pomerantz (Macmillan, 1974). One of the
    most challenging and hilarious books to read aloud! If only it would be reissued
    in a larger format for storytimes. A favorite!


    *Rosie’s Walk* by Pat Hutchins (Simon and Schuster Books for Young Readers, 1968).
    A classic about a busy hen and an unlucky fox.


    *Silly Little Goose* by Nancy Tafuri (Scholastic, 2001). Wonderful, large illustrations
    and a repeating phrase make this a nice choice for a farm storytime.


    *Summer Sun Risin’* by N. Nikola-Lisa (Lee and Low Books, 2002). Rhyming poems
    on each page follow a young farm boy from dawn to night on a hot summer day.


    *Ten Little Mice* by Joyce Dunbar (Harcourt Brace Jovanovich, 1990). The vividness
    of the illustrations might inspire a nice discussion about mice in the wild and
    on a farm. Plus, it contains counting backwards from ten.


    *Who Took the Farmer’s Hat?* by Joan L. Nodset (Harper and Row, 1963). This classic
    story of the farmer questioning the many animals about the whereabouts of his
    favorite hat is small in format but large in appeal.


    *Who Wakes Rooster?* by Clare Hodgson Meeker (Simon and Schuster Books for Young
    Readers, 1996). All ages will enjoy the simple illustrations and the mystery behind
    everyone sleeping late on the farm.


    # ### Additional Informational Titles


    *Farms ABC: A Counting Book* by B. A. Hoena (Capstone Press, 2005). Full-page
    photographs star in this comprehensive look at farms.


    *My First Farm Book*, edited by Shaila Awan (Dorling Kindersley, 2000). Each double-page
    spread features photographs of various aspects of farm life. Ideal for lap reading,
    but it could work at storytimes piecemeal.


    # ### Additional Poems


    “Cow” by Karla Kuskin, in *Moon, Have You Met My Mother? The Collected Poems of
    Karla Kuskin* (Laura Geringer Books, 2003), p. 102.


    “The Cow” by Ogden Nash, in *Custard and Company: Poems by Ogden Nash*, selected
    by Quentin Blake (Little, Brown, 1980), p. 72.


    “Hen’s Song” by Rose Fyleman, in *Mary Middling and Other Silly Folk: Nursery
    Rhymes and Nonsense Poems* (Clarion Books, 2004), unp.


    “Rabbit” by Rose Fyleman, in *Mary Middling and Other Silly Folk: Nursery Rhymes
    and Nonsense Poems* (Clarion Books, 2004), unp.'
