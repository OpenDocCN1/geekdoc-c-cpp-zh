    hilarious book. Will be especially loved by those who frequently share animal
    photo e-mails!


    # Additional Poems


    "Flaco Means Skinny" by Jay M. Harris, in *The Moon Is La Luna: Silly Rhymes in
    English and Spanish* (Houghton Mifflin, 2007), unp.


    "How a Puppy Grows" by Leroy F. Jackson, in *Read-Aloud Rhymes for the Very Young*,
    edited by Jack Prelutsky (Knopf, 1986), p. 40.


    "Just Three" by William Wise, in *The 20th Century Children''s Poetry Treasury*,
    edited by Jack Prelutsky (Knopf, 1999), p. 79.


