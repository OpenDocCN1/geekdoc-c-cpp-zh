    ## 动物园里是谁？


    这些是给孩子们猜的谜语。我喜欢用一个袋子，里面装着每种动物的手指偶，不过你也可以使用动物的小照片。


    我的脚像树干，

    我的鼻子像软管。

    我用它来喷洗

    我的背和脚趾。

    我的耳朵很大，

    我的眼睛很小，

    而我几乎

    和我身高一样宽。

    我是什么？

    *(大象)*


    我满身斑点，

    像斑驳的树荫。

    我身材瘦长，

    长得优雅。

    在非洲的阳光下，

    我小口啃食树叶。

    我的脖子

    比谁的都长。

    我是什么？

    *(长颈鹿)*


    丛林之王，

    这就是我的名字。

    我有强壮的爪子，

    这是真的。

    我的毛发如此浓密，

    他们称之为鬃毛。

    如果我凝视你，

    你可要小心。

    我是什么？

    *(狮子)*


    我有黑色的条纹。

    我有白色的条纹。

    如果我感到害怕，

    四只蹄子能奔跑。

    我啃食青草，

    当然还有树叶。

    我可能看起来像马，

    但我不是马。

    我是什么？

    *(斑马)*


    我喜欢吃草，

    还有树叶和虫子，

    你绝不会说我笨！

    我在树上荡来荡去，

    我叽叽喳喳、尖声叫喊，

