    The text is simple so there are many opportunities to engage the children in discussion
    and observation.

    - *Be Nice to Spiders* by Helen Graham (HarperCollins, 1967). The illustrations
    in this classic are rather small and detailed, but all children should hear this
    wonderful story read aloud at least once. And there are some great spider-science
    connections that might spark discussion.

    - *Bugs for Lunch* by Margery Facklam (Charlesbridge, 1999). This realistic rhyming
    book looks at the many creatures (including humans!) that eat bugs. The illustrations
    are large, attractive, and ideal for storytime, and the content will likely generate
    a lot of wonderful discussion!

    - *Butterfly, Butterfly* by Petr Horáček (Candlewick, 2007). Bright illustrations,
    the introduction of many colors and bugs, and the wonderful surprise pop-up ending
    will amuse and delight the children at storytime. Great for discussion as well.

    - *The Caterpillar and the Polliwog* by Jack Kent (Prentice-Hall, 1982). This
    classic about two creatures that grow into new creatures still reads beautifully
    at storytime and has repetition for participation.

    - *Inch by Inch* by Leo Lionni (Astor-Honor, 1960). A wonderful story about a
    worm and his clever escape from birds. And with math possibilities too!

    - *The Itsy Bitsy Spider* by Iza Trapani (Whispering Coyote Press, 1993). The
    short song has been lengthened into a rhyming story of a persistent spider. The
    illustrations are nice, and everyone can sing at least part of the song.

    - *Ladybug, Ladybug* by Ruth Brown (Dutton, 1988). A beautifully illustrated version
    of the old rhyme. It features some wonderful wild and domestic creatures and could
    easily spark discussion.

    - *Max''s ABC* by Rosemary Wells (Viking, 2006). Children enjoy the bright and
    bold illustrations of Max trying to rid himself of ants. The large alphabet letters
    make this a terrific book to read through and then repeat, focusing on the letters,
    sounds, and story.

    - *Old Black Fly* by Jim Aylesworth (Henry Holt, 1995). A hilarious rhyming alphabet
    book with spot-on illustrations by Stephen Gammell. The repeating phrase makes
    for nice participation as well.

    - *Spider on the Floor* by Bill Russell, illustrated by True Kelley (Crown, 1993).
    The book is small in format, but the illustrations are oversized in relation and
    so wonderfully silly that they deserve to be seen. Plus, you can sing the whole
    thing!

    - *Ugh! A Bug* by Mary Bono (Walker, 2002). This informative title discusses many
    bugs and how to act around them. The cute, oversized illustrations and rhyming
    text make this a great choice for storytimes.

    - *The Very Busy Spider* by Eric Carle (Philomel Books, 1984). Children will enjoy
    the many animal sounds in the book, the growing spider web, and the repeating
    phrase.

    - *The Very Hungry Caterpillar* by Eric Carle (Philomel Books, 1994). Every child
    deserves to hear and see this classic from the master.

    - *The Very Lazy Ladybug* by Isobel Finn (Tiger Tales, 2001). Preschoolers will
    enjoy the antics of this ladybug as she hitches a ride on many jungle animals.
    The illustrations are colorful, and there is nice repetition to the story.


    ### Additional Informational Titles


    - *Brilliant Bees* by Linda Glaser (Millbrook Press, 2003). Large illustrations
    and fairly simple but accurate text make this a nice choice to read aloud in the
    spring.

    - *Buzz, Bee, Buzz!* by Dana Meachen Rau (Marshall Cavendish Benchmark, 2008).
    A small book, but the photographs are still large and great for storytime. Very
    simple text makes this a quick read-through for younger groups.

    - *Let’s Look at Snails* by Laura Hamilton Waxman (Lerner, 2010). A simple, photographic
    look at snails.


    ### Additional Poems


    - “Bugs Never Speak” by Karla Kuskin, in *Moon, Have You Met My Mother? The Collected
    Poems of Karla Kuskin* (Laura Geringer Books, 2003), p. 64.

    - “Spiders” by Karla Kuskin, in *Moon, Have You Met My Mother? The Collected Poems
    of Karla Kuskin* (Laura Geringer Books, 2003), p. 58.


    ## Cats


    ### Suggested Fiction Titles


    - *Fat Cat: A Danish Folktale* by Margaret Read MacDonald (August House Littlefolk,
    2001). MacDonald''s charming retelling features memorable repetition, great vocabulary,
    and an appealing story.

    - *Kitten''s First Full Moon* by Kevin Henkes (Greenwillow, 2004). This Caldecott
    winner also works beautifully as a storytime book.

    - *What Will Fat Cat Sit On?* by Jan Thomas (Harcourt, 2007). Large, cartoony
    illustrations and a funny, repetitive story make this a winning addition to storytimes.


    ### Suggested Informational Title


    - *Guess Who Purrs?* by Dana Meachen Rau (Marshall Cavendish Benchmark, 2009).
    Children will answer the question the book poses on the first page, but the photographs
    are wonderful and the bilingual text makes it an interesting choice for groups
    with Spanish-speaking attendees.


    ### Fingerplay or Story


    My Little Kitty (chapter 4)


    ### Poem


    “Flaco Means Skinny” by Jay M. Harris, in *The Moon Is La Luna: Silly Rhymes in
    English and Spanish* (Houghton Mifflin, 2007), unp.


    ### Flannelboard


    The Rat, the Gnat, and the Fine, Fat Cat (chapter 5)


    ### Interactive Game


    Microphone (chapter 6): Describe your pet cat if you have one or an experience
    that you have had with a cat or cats. Passing the microphone around, or holding
    it in front of children who wish to contribute, encourage them to share something
    they know about cats. Or describe something that you like about cats. Ask the
    children to take a minute to think of something that they like about cats.


    ### Math Activity


    Print pictures of cats and tape them (or place stuffed animal cats!) around your
    story room. At the chosen moment in your storytime, ask the children if they noticed
    that there are lots of cats in the room and tell them you want their help to count
    them all. (Make sure there are at least twenty so the children have an opportunity
    to count past ten.)


    ### Science Activity


    Wild and Domestic (chapter 8): Share a book about wild cats or photographs of
    wild cats. Compare lions and tigers and jaguars and pumas, describing how they
    are alike and how they are different. Share photos of house cats and talk about
    the ways in which they are alike and different. Then look at similarities and
    differences between the wild cats and the domesticated cats.


    ### Additional Fiction Titles


    - *Bittle* by Patricia MacLachlan (Joanna Cotler Books, 2004). A dog and a cat
    wonder if they will like the new baby. Preschoolers familiar with infants will
    find this book especially appealing.

    - *A Cat Like That* by Wendy Wahman (Henry Holt, 2011). A winner for preschool
    storytimes with its bright illustrations, good humor, and great information about
    all things cat.

    - *Feathers for Lunch* by Lois Ehlert (Harcourt Brace Jovanovich, 1990). This
    is a simple book for storytimes, but the large illustrations, the hungry cat,
    and the happy ending (for the bird!) make it quite popular.

    - *Have You Seen My Cat?* by Eric Carle (Simon & Schuster Books for Young Readers,
    1987). A wonderful repeating sentence and Carle''s signature cut-paper illustrations
    make this an excellent book for storytimes. Use it to spark discussion about the
    different places to which the boy travels.

    - *I Don''t Want a Cool Cat* by Emma Dodd (Little, Brown, 2010). The large illustrations
    and the fantastic vocabulary make this a winner.

    - *I Love Cats* by Sue Stainton (Katherine Tegen Books, 2007). Repetition, interesting
    vocabulary, and great illustrations make this a lovely book for storytime.

    - *Kitten from One to Ten* by Mirra Ginsburg (Crown, 1980). Not only a simple
    counting book but a simple counting book with a nice story.

    - *Kitty''s Cuddles* by Jane Cabrera (Holiday House, 2007). The large, bright
    illustrations, the repetition, and the many different animals make this a cuddly
    winner for storytime.

    - *Millions of Cats* by Wanda Gág (Coward, McCann, 1988). A classic story with
    a wonderful repeating phrase. Best for older preschoolers and younger, school-age
    children.

    - *Mrs. Tattles and Her Houseful of Cats* by Alyssa Satin Capucilli (Margaret
    K. McElderry Books, 2001). An alphabet of cats (and one dog) makes for great fun
    (and learning).

