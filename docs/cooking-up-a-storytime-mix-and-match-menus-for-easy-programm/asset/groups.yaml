    and *then* get them up on their feet.


    +   5. Look for math concepts that could be introduced through the book: size,
    shape, pattern, time, age, distance, comparison, amount—all books contain some
    mathematical concepts. For example, if you’re sharing a book about animals, you
    could introduce the concepts of big, small, fast, slow, thick, thin, soft, rough,
    old, young, bright, dull, and so on.


