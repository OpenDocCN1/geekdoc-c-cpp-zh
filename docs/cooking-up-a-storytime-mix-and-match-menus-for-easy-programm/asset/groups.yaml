    # # Menus


    MY FAVORITE PART OF FINDING A NEW COOKBOOK IS PORING OVER THE RECIPES, looking
    for gems, and dropping ingredients and adding others to suit the season and my
    tastes. And that is the point at which we have now arrived!


    # ## Notes for the Chef


    We have examined how children grow and learn. We have tasted delicious and healthy
    ingredients for storytimes. We have perused math and science skills that children
    need to find easy success at school, and we have played with possible and palatable
    ways to add poetry to storytimes. Now we will look at putting them all together.
    The following menus are themed, but as you will notice, they are themed very broadly.
    Themes are not essential, but many librarians and parents find them comforting
    and perhaps helpful in planning. The only really important factor in the content
    of our stories is that they are jam-packed with wonderful books, stories, conversations,
    learning, and *fun*.


    Each menu initially suggests three fiction titles. The first is a book in which
    the story is paramount. It is filled with interesting settings, characters, and
    plot elements that will engage children''s minds and hearts. Such books make it
    very easy to pose open-ended questions and give children practice in understanding
    emotion, story, and event. The second title may be interactive or involve math
    or science in some fashion. The third title may be funny or provocative or simply
    short and entertaining. An appropriate informational title that may be used is
    also highlighted.'
  - '[PAGE 131]


    How many books you share at storytimes and where they fit in your own storytime
    plan are matters of personal preference and audience. Some librarians may use
    two books amid many fingerplays, stories, and games. Some may read four or five
    books amid only one or two other activities. These menus are designed to accommodate
    individual styles and tastes. Many more activities are suggested than could ever
    be used at one sitting. The activities and the additional fiction and informational
    titles included mean that a particular menu may be used two or three or more times
    a year. Children may recognize the fingerplays or flannelboards, but the books
    and activities can change.


    Out-of-print titles are included in the menus. Great chefs go to great lengths
    to track down the perfect ingredients, and our children certainly deserve to share
    in beloved titles from the past. Besides, wonderful out-of-print titles come back
    into print every year, and some of them may still be hiding in the deep recesses
    of our storytime collections or on the Internet.


    Each menu contains enough new and easily accessible titles to fill any storytime
    need. The fiction and informational suggestions are suited to most preschool audiences.
    However, if you come across titles that are too advanced for your children, pull
    out a single page to share or simply use the photographs or illustrations to enhance
    the learning at storytime.


    The suggested fingerplays or action verses in the menus are from chapter 4 in
    this book. They are meant to be added to the favorite fingerplays you are currently
    using in your own storytimes. The menu refers to them by title, and the titles
    are listed alphabetically in chapter 4. If a flannelboard is listed, it may be
    found alphabetically by title in chapter 5. The interactive games or activities
    listed by title alone are described in full in chapter 6. Math activities listed
    by title are described in full in chapter 7, and science activities listed only
    by title are described in chapter 8. Suggested poems are also listed here, including
    potential sources, as are appropriate anonymous poems.


    It is my hope that this volume becomes dog-eared and covered with notes, additions,
    inspirations, and splotches of chocolate.'
