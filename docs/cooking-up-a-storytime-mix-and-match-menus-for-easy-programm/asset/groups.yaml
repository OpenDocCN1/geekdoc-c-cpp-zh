  - '[PAGE 7]


    In this chapter we begin with a discussion of the basic concepts and principles
    that underlie the study of motion. We then develop the tools needed to describe
    and analyse the motion of objects, and apply them to a range of familiar situations.


    # ## INTRODUCTION


    Everyday experience shows that the motion of an object depends on the frame of
    reference from which it is observed. In this chapter we shall describe motion
    in terms of displacement, velocity and acceleration, and use graphs and equations
    to represent the motion of objects moving with constant acceleration.


    # ## GENERAL OBJECTIVES


    By the end of this chapter you should be able to describe the motion of objects
    in a straight line, distinguish between distance and displacement, and solve problems
    involving uniform acceleration.


    # ## ADDITIONAL OBJECTIVES


    +   1. Define displacement, velocity and acceleration.

    +   2. Interpret displacement–time and velocity–time graphs.

    +   3. Apply the equations of motion to solve problems.

    +   4. Describe the motion of freely falling bodies.


    # ## LEARNING THE HARD WAY


    +   1. A car accelerates uniformly from rest to a speed of 20 m/s in 8 s. Calculate
    its acceleration and the distance travelled.

    +   2. A stone is dropped from a cliff and takes 3 s to reach the ground. Calculate
    the height of the cliff.


    Answers are given at the end of the book.'
