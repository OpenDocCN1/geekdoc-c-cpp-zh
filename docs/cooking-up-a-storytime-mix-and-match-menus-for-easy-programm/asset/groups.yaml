  mdcn: "\n*今天下雨*，Kristin Sterling 著（Lerner，2010）。精美的照片和简单的句子提供了各种关于雨的可能讨论想法。这是关于不同天气类型的系列中的一本。\n\
    \n### 附加诗歌\n\n**“瓢虫”** *（佚名）*\n\n瓢虫，  \n瓢虫，  \n瓢虫，  \n不要飞走。  \n你对我的花园有益，  \n拜托，瓢虫——留下来。\n\
    \n**“暴风雨”** *（佚名）*\n\n雷声轰鸣，  \n闪电划过，  \n整个世界都震动了。  \n小猪  \n卷起尾巴，  \n跑去保住自己的培根！\n\
    \n这里也是展示你喜爱的任何诗歌的菜单！\n\n## 海滨\n\n### 推荐虚构类书名\n\n- *迷路的小鱼*，Nancy Van Laan 著（Atheneum\
    \ Books for Young Readers，1998）。一个可爱的故事，语言有趣，有很多机会让孩子们一起重复短语。\n- *海滩所需的一切*，Alice\
    \ Schertle 著（Silver Whistle/Harcourt，2004）。从一粒沙子开始，这本插图精美的书以非常有趣的方式探索海滨。\n- *我是海洋里最大的东西*，Kevin\
    \ Sherry 著（Dial Books for Young Readers，2007）。这本书不仅极具娱乐性，还介绍了许多海洋生物以及更大和更小的概念。\n\
    \n### 推荐信息类书名\n\n*海洋形状*，Suse MacDonald 著（Harcourt Brace，1994）。每一页都从一个形状开始，然后一帧一帧地扩展成海景。大幅彩色插图非常适合故事时间。\n\
    \n### 手指游戏或故事\n\n在海边（第4章）\n\n### 诗歌\n\n“海就是 El Mar”，Jay M. Harris 作，收录于 *月亮就是\
    \ La Luna：英语和西班牙语趣味押韵诗*（Houghton Mifflin，2007），无页码。\n\n### 绒布板\n\n海洋谜语（第5章）\n\n\
    ### 互动游戏\n\n手电筒词汇（第6章）：在故事时间开始前，把不同海洋生物的照片张贴在房间四周。调暗灯光，用手电筒逐一照射这些生物，并引导孩子们讨论每种生物：“它是什么？”“它生活在海里的什么地方？”“它吃什么？”“你见过这样的生物吗？”等等。\n\
    \n### 数学活动\n\n把绒布鱼、纸鱼或塑料鱼放进盒子或袋子里。抓一把鱼，请孩子们估计你手里有多少条鱼。大家一起大声地一条一条数。\n\n### 科学活动\n\
    \n带来贝壳、海星等物品，让孩子们观察和描述。\n\n带来淡水和海水的样本，用于比较和对照。\n\n### 附加虚构类书名\n\n*海滩日*，Karen Roosa\
    \ 著（Greenwillow，1990）。有趣的押韵文字配以可爱的插图，描绘一家人享受海滨时光。\n\n*海滩的一天*，Douglas Florian 著（Greenwillow，1990）。文字简单（每页只有一两个词），使其成为学前故事时间的简单选择，但插图很棒，大多数页面都需要互动或讨论，或两者兼有。\n\
    \n*海滩派对！*，Harriet Ziefert 著（Blue Apple Books，2005）。这本简单的书展示了不同海滩生物如何移动。它非常适合每个人都喜欢动起来的故事时间。\n\
    \n*贝贝去海滩*，Susan Middleton Elya 著（Harcourt，2008）。贝贝回来啦，踏上欢闹的海滩之旅。有趣！\n\n*蓝色海洋*，Robert\
    \ Kalan 著（Greenwillow，1979）。孩子们喜欢这本关于海洋生活的简单书中的追鱼和捕鱼情节。\n\n*深蓝的海*，Audrey Wood\
    \ 著（Blue Sky Press，2005）。一个关于海洋和颜色的精彩累积故事。你朗读时，孩子们可以补出颜色名称。\n\n*鱼眼：一本可以数数的书*，Lois\
    \ Ehlert 著（Harcourt Brace Jovanovich，1990）。非常简单的插图在这本简单的数数书中展示了许多色彩斑斓的鱼，故事时间之后正适合装饰纸鱼。\n\
    \n*隐藏的森林*，Jeannie Baker 著（Greenwillow，2000）。这个关于男孩设置鱼陷阱的迷人故事会在故事时间吸引孩子，华丽的插图也会如此。\n\
    \n*寻找螃蟹*，Bruce Whatley 著（Angus and Robertson，1993）。一家人在海滩上寻找螃蟹。插图非常有趣，引得孩子们参与互动。\n\
    \n*一只孤独的海马*，Saxton Freymann 著（Arthur A. Levine Books，2000）。如同 Freymann 的其他书一样，不同种类的食物被用来创造角色。孩子们喜欢辨认食物，这使本书成为非常互动的读物。\n\
    \n*船的形状*，Stella Blackstone 著（Barefoot Books，2006）。充满活力的绗缝插图以及内置的互动，使其成为故事时间的绝佳选择。\n\
    \n### 附加信息类书名\n\n*寄居蟹*，Lola M. Schaefer 著（Heinemann Library，2002）。因为每个跨页都以一个问题开头，这本书简直在恳求学龄前儿童回答。照片偏小，但仍然很棒。\n\
    \n*海洋数数：奇数*，Jerry Pallotta 著（Charlesbridge，2005）。大幅插图在故事时间会很好用。根据参加故事时间的孩子的年龄，你可能可以完整读完这本书，但也可以用它来突出按奇数数数。\n\
    \n*一个夜晚的海洋*，Deborah Lee Rose 著（Scholastic，2003）。大幅插图数着许多在孩子睡着时醒着的海洋生物。\n\n*图案鱼*，Trudy\
    \ Harris 著（Millbrook Press，2000）。这本奇妙有趣的书非常适合故事时间。图案在一个以某种海洋生物为特色的跨页上建立。翻到那一页时，孩子们会被提示完成图案。插图很搞笑。\n\
    \n*海滨的感官*，Shelley Rotner 著（Millbrook Press，2006）。大幅照片、简单文字以及运用感官探索海滩，使本书成为故事时间的理想选择。\n\
    \n*海洋分类*，Jennifer Rozines Roy 著（Marshall Cavendish Benchmark，2005）。精美的物品集合照片。\n\
    \n*海之星：海星的一天*，Janet Halfmann 著（Christy Ottaviano Books，2011）。这本书跟随一只海星，讲述她遇到许多不同生物的经历。大幅而可爱的插图在故事时间会很好用。\n\
    \n*海滩漫步*，Jo Waters 著（Raintree，2006）。一本非常简单的书，满是人们可能在海滩上找到的物品的照片。非常适合在故事时间完整读完。\n\
    \n*谁在海洋里长大？一本关于海洋动物及其后代的书*，Theresa Longenecker 著（Picture Window Books，2003）。在故事时间一次读完可能有点长，但每个跨页一种海洋动物的大幅插图使这本书成为部分分享的好选择。\n\
    \n### 附加诗歌\n\n“家”，Jean Jaszi 作，收录于 *给幼儿的朗读韵诗*，Jack Prelutsky 编（Knopf，1986），第30页。\n\
    \n“贝壳之歌”，Nicola Davies 作，收录于 *你的窗外：第一本自然之书*（Candlewick，2012），第46页。\n\n“海岸”，Mary\
    \ Britton Miller 作，收录于 *给幼儿的朗读韵诗*，Jack Prelutsky 编（Knopf，1986），第30页。\n\n## 交通工具\n\
    \n### 推荐虚构类书名\n\n*甘比先生的汽车*，John Burningham 著（Macmillan，1975）。每个学龄前儿童都值得坐一坐甘比先生的车。\n\
    \n*在车站旁*，Will Hillenbrand 著（Harcourt Brace，1999）。在这首歌曲的迷人版本中，小火车从镇上各处接上小动物（包括孩子们），然后把它们送到动物园。\n\
    \n*桥升起来了*，Babs Bell 著（HarperCollins，2004）。这本有趣的书中的重复句提供了很好的互动。插图对孩子们很有吸引力。\n\n\
    *在车站旁*，Jennifer Riggs Vetter 著（Tricycle Press，2009）。这首老歌的改编版配有可爱的插图，并展示了大量的交通方式。\n\
    \n*快餐*，Saxton Freymann 著（Arthur A. Levine Books，2006）。食物造型大师以巧妙而搞笑的方式呈现交通工具。孩子们会喜欢猜不同的食物。\n\
    \n*货运列车*，Donald Crews 著（Greenwillow，1978）。这本简单的书结合了颜色、火车车厢和丰富的词汇。所有年龄段都必读。\n\n\
    *晚安，晚安，建筑工地*，Sherri Duskey Rinker 和 Tom Lichtenheld 著（Chronicle Books，2011）。一个关于建筑车辆准备“睡觉”的押韵故事。\n\
    \n*叭叭！嘀嘀！*，Daniel Kirk 著（Disney/Hyperion Books，2010）。一个带有重复副歌的押韵故事，以及大幅、可爱、类似乐高积木的插图。\n\
    \n*嘘，小挖掘机*，Ellen Olson-Brown 著（Tricycle Press，2006）。这首对《知更鸟》歌曲的搞笑改编，出现了许多不同的工程车辆。\n\
    \n*我很快！*，Kate McMullan 著（Balzer and Bray，2012）。孩子们会为汽车和火车之间的比赛而兴奋。大家都会喜欢俏皮的词汇。\n\
    \n*我一直在铁路上工作*，Ann Owen 编（Picture Window Books，2003）。有趣的引言和只使用一节歌词，使这本书成为参加者年龄范围广泛的故事时间的好补充。\n\
    \n*本的火车的去处真有趣*，Robert Burleigh 著（Orchard Books，1999）。一个关于小男孩和他为自己创造的火车冒险的押韵故事。重复句将帮助孩子们参与讲述故事。\n\
    \n*机器去上班*，William Low 著（Henry Holt，2009）。每隔一页就提出一个关于某种交通方式的问题，使这本书成为高度互动且插图精美的故事时间读物。\n\
    \n*拖拖拖船*，Kevin Lewis 著（Hyperion Books for Children，2006）。拖船几乎和恐龙一样有趣，所以这本色彩鲜艳、插图明快的生动书籍会在故事时间吸引孩子。\n\
    \n*轮子整天都做什么？*，April Jones Prince 著（Houghton Mifflin，2006）。大开本、简单的押韵文字和生动的剪纸插图使这本书成为赢家。\n\
    \n### 附加信息类书名\n\n*机场*，Byron Barton 著（Crowell Junior Books，1982）。简洁的文字和质朴的插图使这本书成为故事时间的绝佳选择。\n\
    \n"
