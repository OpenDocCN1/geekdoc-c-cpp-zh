  - '[PAGE 48]


    +   - *Just Like Daddy* by Frank Asch (Prentice-Hall, 1981). The simple story
    and the repeating phrase make this a nice choice for toddlers and preschoolers,
    and mommies and daddies will snicker or cringe at the surprise ending.

    +   - *Kitty''s Cuddles* by Jane Cabrera (Holiday House, 2007). The large, bright
    illustrations, the questions, and the many different animals make this a cuddly,
    interactive winner for storytime.

    +   - *Little Donkey Close Your Eyes* by Margaret Wise Brown (HarperCollins, 1995).
    Rhyme, repetition, and beautiful woodcut illustrations make this a lovely, gentle
    choice for storytime.

    +   - *Mama, Is It Summer Yet?* by Nikki McClure (Abrams Books for Young Readers,
    2010). A little boy repeatedly asks if it''s summer yet in this lovely book for
    preschoolers.

    +   - *Meow and the Pots and Pans* by Sebastian Braun (Boxer, 2010). Large, bright
    illustrations, simple text, and an amusing mystery of a story make this a storytime
    winner. The direct questions embedded in the text will naturally draw interaction
    from the children. Create a storytime band after the reading for extra fun.

    +   - *Millions of Cats* by Wanda Gág (Coward, McCann, 1988). This simple, classic
    book deserves to be read by all children.

    +   - *Mother, Mother, I Want Another* by Maria Polushkin Robbins (Crown, 1978).
    The misunderstanding between a mother and her baby at bedtime is an entertaining
    read for storytime.

    +   - *Mothers Are Like That* by Carol Carrick (Clarion Books, 2000). This beautifully
    illustrated book shares the qualities of many animal mothers and features a repeating
    line.

    +   - *Muncha! Muncha! Muncha!* by Candace Fleming (Atheneum Books for Young Readers,
    2002). Children will enjoy the antics of the rabbits and the lengths to which
    the farmer goes to deny them his garden.

    +   - *The Napping House* by Audrey Wood (Harcourt, 1984). The text in this wonderful
    book is cumulative, and children will enjoy joining in as the story unfolds.

    +   - *No Dinner! The Story of the Old Woman and the Pumpkin* by Jessica Souhami
    (Marshall Cavendish, 1999). This retelling of an old Asian folktale features many
    opportunities for repeating phrases. Plus, it''s a highly entertaining story.

    +   - *Noisy Nora* by Rosemary Wells (Dial, 1973). Rhyming text and a few repeating
    lines make this a nice read-aloud at storytimes.

    +   - *Pie’s in the Oven* by Betty G. Birney (Houghton Mifflin, 1996). The refrain
    will have everybody hungry for pie by the book’s end. Delicious!'
