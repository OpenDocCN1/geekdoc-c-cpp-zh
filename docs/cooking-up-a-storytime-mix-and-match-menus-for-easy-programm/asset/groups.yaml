    # # Building Nutritional Programs


    THE NEXT STEP IN CREATING RELEVANT AND ENJOYABLE PROGRAMS FOR OUR children and
    families is to take what we know about how children learn and focus our programs
    on supporting learning as well as entertainment.


    # ## All Dessert, All the Time?


    Librarians love presenting storytimes. We thrive on obsessively selecting the
    perfect developmentally appropriate books, jamming them into themes, hunting down
    related fingerplays and rhymes and songs, memorizing entertaining and beautiful
    stories, and looking for ways to be ever more engaging. We craft our own little
    “Your Favorite Librarian” shows, setting our sights on the satisfaction we feel
    when our entire storytime group sits enraptured, laughing in all the right places,
    amazed at our special talents and expertise. And, certainly, having families return
    week after week and experiencing the increasing devotion that children come to
    show us seem desirable goals. We want families to attend storytimes! We want strong
    storytime numbers for our monthly reports! But when we closely examine our offerings
    in the light of early learning research and standards outside the library walls,
    is this really the best we can do for the children? Are we offering the most nutritious
    storytimes possible, or are they perhaps a bit heavy on the dessert side? Can
    storytimes be more effective in terms of learning for the child and still be highly
    entertaining? The answer to the last question is undoubtedly yes, but because
    we know'
