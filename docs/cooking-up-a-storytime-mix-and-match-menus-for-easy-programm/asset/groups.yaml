    will likely generate a lot of wonderful discussion!

    +   - *Butterfly, Butterfly* by Petr Horáček (Candlewick, 2007). Bright illustrations,
    the introduction of many colors and bugs, and the wonderful surprise pop-up ending
    will amuse and delight the children at storytime. Great for discussion as well.

    +   - *The Caterpillar and the Polliwog* by Jack Kent (Prentice-Hall, 1982). This
    classic about two creatures that grow into new creatures still reads beautifully
    at storytime and has repetition for participation.

    +   - *Inch by Inch* by Leo Lionni (Astor-Honor, 1960). A wonderful story about
    a worm and his clever escape from birds. And with math possibilities too!

    +   - *The Itsy Bitsy Spider* by Iza Trapani (Whispering Coyote Press, 1993).
    The short song has been lengthened into a rhyming story of a persistent spider.
    The illustrations are nice, and everyone can sing at least part of the song.

    +   - *Ladybug, Ladybug* by Ruth Brown (Dutton, 1988). A beautifully illustrated
    version of the old rhyme. It features some wonderful wild and domestic creatures
    and could easily spark discussion.

    +   - *Max''s ABC* by Rosemary Wells (Viking, 2006). Children enjoy the bright
    and bold illustrations of Max trying to rid himself of ants. The large alphabet
    letters make this a terrific book to read through and then repeat, focusing on
    the letters, sounds, and story.'
