    is measurement of the children’s comprehension, vocabulary, social and emotional
    development, and overall learning even possible? The research is clear that reading
    aloud to young children is the most powerful way of developing their understanding
    and interest in reading. But research is also clear that it is not simply the
    reading aloud that does the trick. It is the *conversation* that surrounds the
    reading that has the greatest impact on children’s skill development (Dickinson
    and Smith 1994). If we do all the talking, we may actually be limiting the children’s
