  - '[PAGE 44]


    *Bear''s Picture* by Daniel Pinkwater (Houghton Mifflin Company, 2008). This tongue-in-cheek
    book about a nonconformist bear and two judgmental gentlemen is a delight to share
    at storytime.


    *Bunny Cakes* by Rosemary Wells (Dial, 1997). All children deserve to hear a story
    featuring Max and Ruby. Not only is this story funny, it lends itself to a follow-up
    writing activity: using a large poster board, create a giant story-time grocery
    list together. What items would children really like to buy? As the children call
    out items, write them on the list.


    *Can You Guess?* by Margaret Miller (Greenwillow, 1993). The large photograph
    of a mailbox can be used effectively in a storytime about letters and the mail.


    *Carlo Likes Reading* by Jessica Spanyol (Candlewick, 2001). This very simple
    book''s illustrations are so packed with labels that it becomes a writing lesson
    all on its own. There are some wonderful opportunities for interaction as well.
    Create oversized “labels” with card stock or cardboard, a hole punch, and yarn.
    Ask the children to identify items in the room—chairs, tables, doors, coatracks,
    and the like. Create labels for the items and tie the labels onto the objects.
    Or perhaps create Carlo-type labels to use as name tags.


    *Children Make Terrible Pets* by Peter Brown (Little, Brown, 2010). Amusing illustrations
    and a tongue-in-cheek story make this an entertaining choice for storytime. Talk
    about how the author used dialogue “bubbles” to tell the story. Create some silly
    dialogue bubbles of your own and use them during storytime or the playtime after.
    Occasionally use drawings or photographs in the dialogue bubbles so the children
    can be in on the joke as well.


    *Click, Clack, Moo: Cows That Type* by Doreen Cronin (Simon and Schuster Books
    for Young Readers, 2000). Duck''s use of a typewriter to secure special comfort
    for the farm animals is a riot. After sharing the book, engage the children in
    a conversation about their experiences with typewriters. Have they ever seen one
    before? Where? Have they ever used one? If possible, place the typewriter in a
    place where the children can interact with it after storytime.


    *Dear Bunny* by Michaela Morgan (Scholastic/Chicken House, 2006). This is an adorable
    story about two bunnies in love. Letter writing and the ripped-up and rearranged
    sentences may prompt some fun learning activities. Rather long for young groups,
    but it''s too charming to omit. Create Valentines and let the children paste tender
    words onto them.


    *Giggle, Giggle, Quack* by Doreen Cronin (Simon and Schuster Books for Young Readers,
    2002). Duck is back in this hilarious book that features many handwritten notes.
    Talk with the children about how we use notes to each other. Have they ever seen
    a note? Hang note paper around the room and let the children “write” notes of
    their own.'
  - '[PAGE 45]


    *Henry Works* by D. B. Johnson (Houghton Mifflin, 2004). This story might be rather
    sophisticated for many storytime groups, but it could spark interesting discussion
    about authors and writing. Engage the children in a conversation about what an
    “author” is.


    *I Miss You Every Day* by Simms Taback (Viking, 2007). Vibrant illustrations and
    rhyming text that repeats make this a great book for storytimes. Pull out the
    brown paper and boxes, and let the writing begin.


    *Letter to Amy* by Ezra Jack Keats (Harper and Row, 1968). This classic book features
    an alluring story and wonderful illustrations. The letter at the center of the
    story offers an opportunity to explore written materials. Engage the children
    in a conversation about writing letters and about their experiences with receiving
    or sending letters. Talk about the form that letters take. Provide a template
    of a letter as a takeaway for the children, or encourage them to write a letter
    or draw a picture or do both for someone special. If possible, provide envelopes.
    Talk about stamps and why we use them.


    *My Crayons Talk* by Patricia Hubbard (Henry Holt, 1995). Cute illustrations,
    simple text that rhymes, colors and crayons—follow a reading with a crayon activity
    for a very fun storytime. Hang or spread out a big piece of paper—the bigger,
    the better. Set out crayons or paint (if you’re brave) and let the children explore
    their own pictures and paint their own crayons “talk.” Celebrate their efforts.
    Post this same paper at future storytime sessions and let new children add their
    art.


    *Patrick Paints a Picture* by Saviour Pirotta (Frances Lincoln Children’s Books,
    2007). The large illustrations and the embedded interactive guessing game make
    this a wonderful book to share. And if you are brave, set up a painting activity
    after sharing.


    *Secret Valentine* by Catherine Stock (Bradbury Press, 1991). A small book in
    format but with a loving and heartfelt message that children deserve to hear and
    see. (As long as you can read it without crying!)


    # ## Fostering Interaction and Repetition


    The last portion of this chapter is about books that encourage children to actively
    participate. Some of the books are filled with questions aimed directly at the
    children. Others contain repeating lines. With a little practice beforehand or
    with some encouragement during the reading, children may join in the repeating
    line. This repetition not only is very enjoyable for the children but can often
    assist in maintaining their attention to the story. The following book titles
    are wonderful for storytime and have built-in interaction or repeating phrases
    that will encourage the children to “read” along. Titles with asterisks have fewer
    words per page.'
  - '[PAGE 46]


