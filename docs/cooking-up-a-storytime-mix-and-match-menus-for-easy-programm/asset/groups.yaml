    \ alaeditions.org/webextras 获取\n\n在本章中，我们首先讨论运动研究的基本概念和原理。然后，我们开发描述和分析物体运动所需的工具，并将其应用于一系列熟悉的情境。\n\
    \n## 引言\n\n日常经验表明，物体的运动取决于观察它所依据的参考系。在本章中，我们将用位移、速度和加速度来描述运动，并使用图形和方程来表示匀加速运动物体的运动。\n\
    \n## 总体目标\n\n学完本章后，你应该能够描述物体在直线上的运动，区分距离与位移，并解决涉及匀加速运动的问题。\n\n## 附加目标\n\n- 1.\
    \ 定义位移、速度和加速度。\n- 2. 解读位移-时间图和速度-时间图。\n- 3. 应用运动方程解决问题。\n- 4. 描述自由落体的运动。\n\n##\
    \ 实践练习\n\n- 1. 一辆汽车从静止开始匀加速，8 秒内达到 20 m/s 的速度。计算其加速度和行驶的距离。\n- 2. 一块石头从悬崖上落下，用时\
    \ 3 秒到达地面。计算悬崖的高度。\n\n答案见书末。\n\n## 序言\n\n谨以此书献给我的父母迈克和安迪·安德森——感谢你们用如此多的故事和爱，为我疯狂的人生增添滋味。\n\
    \n## 序言\n\n我祖母新鲜出炉的面包的滋味；我母亲那只金黄多汁、刚出炉的填料火鸡的模样；从亚美尼亚邻居家后院飘来的辛辣异域烧烤香气：这些关于食物的记忆将我与童年以及我所爱的人紧紧相连。食物的准备与分享是一种必不可少且令人愉悦的人类体验。它是安慰、温暖和爱。但对我来说，比享受一顿美餐更有趣的，是真正被邀请*进入*厨房：坐在高脚凳上，看着或受邀参与切、筛、翻、搅；用勺子伸进锅里蘸一下；品尝时感受到的那种纯粹的喜悦——那真是天堂般的体验。正是在那些厨房里，我意识到出色的烹饪并非凭空发生。它需要观察、训练、实践和热情。它是理解食材、以美味的方式组合它们、不断尝试，最后也是最重要的一点——与你所爱的人分享的最终成果。\n\
    \n我发现，准备美味食物与准备精彩的故事时间之间有许多相似之处。充满热情的儿童图书馆员就像大厨：语言提供了他们选择、筛选、搅拌并分装成完美份额的食材，用以滋养他们所在社区幼儿正在发展的心灵和头脑。因此，带着这种类比，我编写了这本故事时间烹饪书，希望其中充满美味且有营养的想法，能够款待孩子们以及照顾他们的人。\n\
    \n第一章涵盖基础知识：概述有助于使故事时间创作符合儿童发展特点、具有文化敏感性并充满学习机会的知识和经验。第二章提供关于重新思考故事时间规划的想法，以最大限度地提高到场儿童和看护人的学习机会。后续章节提供多种多样的故事时间食材——图书、手指游戏、毛毡板、游戏、诗歌、数学和科学活动。本书以一系列故事时间的“菜单”作为结尾。\n\
    \n本书的重点主要是创建学龄前故事时间，菜单在很大程度上也反映了这一点。我希望亲爱的读者们能将本书中的想法作为起点，创作出尽可能美味的故事时间，从而继续使你们的图书馆成为早期学习社区中充满活力、备受珍视和不可或缺的中心。\n\
    \n## 故事时间炖菜\n\n*从对儿童学习与成长方式的知识和理解开始*\n\n*花时间精心规划*\n\n*选择高质量、有趣且适合年龄和受众的绘本*\n\n\
    *搭配丰富的儿歌、手指游戏、故事、歌曲和伸展活动*\n\n- 加入\n  - 少量游戏\n  - 一点诗歌\n  - 一盎司数学\n  - 一份科学\n\n\
    *融入大量互动——让孩子们积极参与的想法*\n\n*加入一位充满热情的馆员的独特才能*\n\n*让它滋滋作响*\n\n*满怀爱意地献给孩子们、父母和看护人*\n\
    \n*开始盛宴吧！*\n\n"
