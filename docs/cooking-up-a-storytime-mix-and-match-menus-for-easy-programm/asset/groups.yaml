  - '[PAGE 117]


    # # Exploring the World at Storytime


    # ### Animals and Babies


    *Supplies*


    +   - separate photographs of animals and their babies (for example, dog/puppy,
    cat/kitten, horse/foal, cow/calf, sheep/lamb, goat/kid, chicken/chick, duck/duckling,
    goose/gosling, frog/tadpole, bear/cub, sparrow/nestling, fox/kit, kangaroo/joey)


    *Directions*


    Hand out the animal baby photographs to each child (or do this activity a few
    times if your storytimes are very large). Hold up a photograph of an animal and
    ask the child who has the matching baby to bring it up to the front of the room.
    Talk about the animals for a moment: “What does a horse eat?” “What sounds does
    a chicken make?” “What names do we have for bears?”


    # ### Animals and Homes


    *Supplies*


    +   - separate photographs of animals and the homes in which they live (for example,
    birds/nests, foxes/dens, cows/barns, dogs/beds or dogs/houses, cats/cat beds,
    fish/bowls or fish/ponds, chickens/coops, frogs/ponds, rabbits/holes, eagles/aeries,
    moles/holes, ants/anthills)


    *Directions*


    This activity is similar to “Animals and Babies” but with photographs of animals
    and their homes. Hand out a photograph of an animal to each child. Hold up a photograph
    of an animal home and encourage the child who has the photograph of the animal
    that belongs in that home to bring his or her photograph up to you. Talk about
    the animal and the home in which it lives: “Where might we find this home?” “Does
    the animal build the home itself?” “How does it do that?”


    # ### Animals Near and Far


    *Supplies*


    +   - photographs or books of two different animals—one that lives near your area
    and one that lives in an area remote from where you live


    *Directions*


    Using the photographs or books about these animals, compare and contrast them—their
    fur/skin/feathers, babies, food, beds, sleeping patterns, and so on. Engage the
    children in a discussion about how the animals are alike and how they are different.'
  - '[PAGE 118]


    # **Animal Skins and Shells**


    *Supplies*


    +   - pieces of real animal fur, feathers, leather, shells, and the like


    *Directions*


    Pass the objects around the room or provide an opportunity for children to explore
    the objects at a nature table. Encourage them to see, smell, and touch the objects.
    Then engage the children in a discussion about the objects: "How are they similar?"
    "How do they differ?" "From what animal or creature do they come?" "What do they
    provide that animal?"


    # **Bees**


    *Supplies*


    +   - photographs of bees at work

    +   - photographs of (or the actual) fruits that require bees for pollination:
    kiwi, strawberry, watermelon, tangerine, tangelo, lemon, lime, lychee, apple,
    mango, apricot, cherry, plum, peach, boysenberry, blackberry, raspberry, elderberry,
    blueberry, cranberry, grape, and cantaloupe

    +   - jar of honey


    *Directions*


    Using the photographs or fruits, engage the children in a discussion about bees.
    "Have you ever seen bees?" "Where were you?" "What were the bees doing?" Talk
    about the difference between bees and hornets. Do the children eat any of these
    fruits? Talk about honey and what it tastes like.


    # **Explore Box**


    *Supplies*


    +   - box with low sides

    +   - assortment of natural materials: seeds, leaves, stems, moss, twigs, flowers,
    and the like


    *Directions*


    Fill a box with many natural materials. Place this box in a place where the children
    may explore it either before or after storytime. The materials can be changed
    to reflect different seasons.'
  - '[PAGE 119]


    # Fruits and Veggies


    *Supplies*


    +   - assortment of fruits or vegetables or both

    +   - attractive grocery sack


    *Directions*


    Tell the children that you are going to show them many different kinds of fruits
    and vegetables. Pull the items out of the grocery sack one at a time and engage
    the children in a conversation about how the various fruits and vegetables look,
    how they feel, how they smell, and how they taste. Pass them around for the children
    to handle and explore. “Have you ever tasted one of these before?” “What did you
    think?” “How did it taste? Sweet? Sour? Bitter?” Talk about different tastes.


    # Gravity


    *Supplies*


    +   - two objects of differing shape, size, or weight or any combination of these
    attributes


    *Directions*


    Stand in front of the children and hold the two objects out in front of you at
    the same level. Ask the children what they think will happen when you drop the
    objects at the same time. Will the objects float up? Will they fall down? How
    can we make a prediction? Drop the objects. Engage the children in a conversation
    about why they think the objects did what they did. If possible, pass out objects
    and allow the children to experiment with dropping them. Encourage the caregivers
    to talk with the children about what happens.


    # Heavy and Light


    *Supplies*


    +   - assorted objects of varying weight (for example, a feather, brick, marshmallow,
    big, pebble, rock, scarf, metal pipe, paper cup, cast-iron pot, cork, dinner plate,
    empty bottle, full bottle, leaf, bowling ball, yarn, melon, balloon, barbell)


    *Directions*


    Tell the children that today you are going to explore “heavy” and “light.” Pass
    the objects around the room and encourage everyone to handle them. After the children
    have investigated each object, encourage everyone to sit back down or quiet down
    from the sharing. Ask each child to bring an object to you and then ask the group
    if they think that object is heavy or light. Place the heavy objects on one side
    of you and the light objects on the other. If you like, record the results on
    a chart.'
  - '[PAGE 120]


    # ### Life Cycle of a Frog


    *Supplies*


    +   - photographs showing the life cycle of a frog or a book about the life cycle
    of a frog


    *Directions*


    Show the children the photographs or the book. Engage them in a discussion about
    their experiences with frogs: "Have you seen frogs before?" "Where did you see
    them?" "What kind of environment were they in?" "What sorts of plants were around
    them?" "What sounds do they make?" and so on.


    # ### New Moon/Full Moon


    *Supplies*


    +   - photographs of the moon in different stages of waxing and waning


    *Directions*


    Show the photographs and let the children tell you what they see. Wonder about
    the fact that the moon looks different sometimes. Engage the children in a conversation
    about their observations of the moon. You needn''t explain the science behind
    the phases of the moon. You are simply encouraging the children to share what
    they know or attempting to spark their interest in the night sky. You might, however,
    identify the full moon and the new moon for vocabulary growth.


    # ### Prisms and Light


    *Supplies*


    +   - prism

    +   - flashlight


    *Directions*


    Show the prism to the children and ask them to tell you what they notice about
    it. Turn the flashlight on and shine it at the prism. Encourage the children to
    describe what they see. You might use this activity to engage the children in
    a conversation about rainbows: "Have you ever seen a rainbow?" "Where did you
    see it?" "What did it look like?" and so on.


    # ### Ramps


    *Supplies*


    +   - a length of cardboard or a length of timber (a wider piece will make the
    "experiment" easier as the objects will not fall off the side)

    +   - two different objects (for example, a ball, a toy car, a pencil, a plastic
    animal, a block)'
  - '[PAGE 121]


    *Directions*


    Set the cardboard or wood from a table to the floor, creating a ramp. Place the
    two different objects at the top of the ramp and ask the children to predict which
    object will roll down the ramp the fastest. Roll the objects and wonder about
    what happened. Do this a few times to test the results. Leave the ramp up after
    storytime so the children can experiment and play with them.


    # Rocks and Minerals


    *Supplies*


    +   - rocks of different textures, shapes, and sizes (for example, smooth river
    rocks, small pebbles, large granite stones, flat slate, quartz, gemstones, rolled
    and polished rocks, man-made bricks, and the like)


    *Directions*


    Pass the rocks around for the children to handle or invite them to explore the
    rocks around a table. Engage them in a conversation about the rocks: “Where can
    you find river rocks like these?” “What does slate feel like?” “How are pebbles
    and amethyst alike?” “How are they different?” and so on. Display some rock and
    mineral guides for checkout if possible.


    # Seashells


    *Supplies*


    +   - a variety of seashells


    *Directions*


    Pass the seashells around to the children. Allow plenty of time for them to look
    at them, handle them, smell them, and so on. Talk about the shells together: “What
    do they look like?” “Where might they have come from?” “Who might use shells like
    these?” and so on.


    # Seeds


    *Supplies*


    +   - photographs of the life cycle of a seed or a book about the life cycle of
    a seed


    *Directions*


    Share the photographs or book with the children. Open a package of seeds for the
    children to see. Sunflower or pumpkin seeds make a nice display because they are
    rather large. Compare the real seeds to the seeds in the photographs or book.
    Perhaps plant a seed in early spring in a cup or pot and check on the seed’s progress
    every week during the spring and summer. Pass out seeds for the children to plant
    at home.'
