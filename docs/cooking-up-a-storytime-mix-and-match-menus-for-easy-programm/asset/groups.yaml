  md: "\n*Big Rigs on the Move* by Candice Ransom (Lerner, 2011). Photographs accompany\
    \ simple text in a book with great appeal for preschoolers.\n\n*This Train* by\
    \ Paul Collicutt (Farrar, Straus and Giroux, 2001). Simple text, lots of repetition,\
    \ and some wonderful math words make this a winner for storytime. Collicutt has\
    \ many books on different modes of transportation done in this simple style—*This\
    \ Rocket, This Truck, This Boat, This Plane*, and more.\n\n## Additional Poems\n\
