    ## Voici pourquoi les prix de l''alimentation devraient baisser en 2025


    Mesure phare du gouvernement, l''inflation devrait ralentir cette année. De quoi
    redonner du pouvoir d''achat aux ménages français.


    Les prix dans les supermarchés vont-ils enfin baisser ? Alors que les Français
    attendent des jours meilleurs après deux ans d''inflation alimentaire, tout porte
    à croire que l''année 2025 sera celle de la désinflation. C''est en tout cas la
    promesse du gouvernement. Invité sur Franceinfo lundi 6 janvier, le ministre de
    l''Économie, Éric Lombard, a indiqué que la baisse des prix allait se poursuivre.
    Il s''est engagé à ce que l''inflation alimentaire passe sous les 2 % au premier
    semestre. Et si la tendance se confirme, les prix pourraient baisser durablement.


    ### Une baisse des prix des matières premières


    Ce revirement de tendance, on le doit d''abord à la baisse des prix des matières
    premières agricoles. Entre 2022 et 2024, les prix mondiaux du blé, du maïs ou
    encore du colza ont fortement chuté, revenant à des niveaux comparables à ceux
    d''avant la crise du Covid. Par ricochet, les industriels de l''agroalimentaire
    voient leurs coûts de production diminuer. Les supermarchés, eux, ont tout intérêt
    à répercuter ces baisses sur les étiquettes pour attirer des consommateurs toujours
    plus regardants sur leurs dépenses.


    ### La fin du « quoi qu''il en coûte »


    Autre explication : la politique monétaire. Pour lutter contre l''inflation, la
    Banque centrale européenne (BCE) avait drastiquement augmenté ses taux directeurs
    à partir de 2022. Résultat : le crédit est devenu plus cher, ce qui a freiné la
    consommation et donc les prix. Mais depuis juin 2024, l''institution dirigée par
    Christine Lagarde a entamé un mouvement inverse. En baissant ses taux à plusieurs
    reprises, elle rend l''argent moins cher à emprunter, ce qui relance l''économie
    sans raviver l''inflation.

