- raw:
  - '[PAGE 156]


    *I Love You Just the Way You Are* by Virginia Miller (Candlewick, 1998). Little
    Bartholomew’s grumpiness rings true, and George’s loving response is spot on.


    *Walter Was Worried* by Laura Vaccaro Seeger (Roaring Brook Press, 2005). This
    creative book shows many different people experiencing different emotions. Emotions
    are literally spelled out on their faces. A great title for letter knowledge!


    # ### Additional Informational Titles


    *Lots of Feelings* by Shelley Rotner (Millbrook Press, 2003). Full-page photographs
    and sparse text make this selection accessible for all ages. Perfect for sparking
    conversation.


    *The Way I Feel* by Janan Cain (Parenting Press, 2000). Nice, large illustrations
    and one emotion per page make this an effective book for use at preschool storytimes.
    A wonderful discussion starter.


    # ### Additional Poems


    “It’s Eleven O’Clock” by Nancy Chambers, in *Read-Aloud Rhymes for the Very Young*,
    edited by Jack Prelutsky (Knopf, 1986), p. 80.


    “Runaway” by William Wise, in *Read-Aloud Rhymes for the Very Young*, edited by
    Jack Prelutsky (Knopf, 1986), p. 80.


    “Someone’s Face” by John Ciardi, in *Read-Aloud Rhymes for the Very Young*, edited
    by Jack Prelutsky (Knopf, 1986), p. 81.


    # ## Families


    # ### Suggested Fiction Titles


    *Oh, No, Gotta Go!* by Susan Middleton Elya (Putnam, 2003). As soon as the family
    gets into the car, the daughter realizes that nature is calling. This is a funny,
    rhyming book that will entertain children and their caregivers.


    *Mama, Do You Love Me?* by Barbara Joosse (Chronicle Books, 1991). This is a soothing
    book about the unconditional love of a mother.


    *Jazz Baby* by Lisa Wheeler (Harcourt, 2007). Like a bouncing jazz riff, this
    book literally rolls off the tongue. Children and caregivers will be snapping
    and bopping along.


    # ### Suggested Informational Title


    *Families* by Ann Morris (HarperCollins, 2000). Large photographs of families
    around the world with simple text make this an enjoyable read for preschool storytimes.'
  - '[PAGE 157]


    # ### Fingerplay or Story


    Who Is in a Family? (chapter 4)


    # ### Poem


    “Growing Old” by Rose Henderson, in *Tomie dePaola’s Book of Poems*, selected
    and illustrated by Tomie dePaola (Putnam, 1988), p. 58.


    # ### Flannelboard


    Family (chapter 5): Bilingual extended family vocabulary


    # ### Interactive Games


    Opposites (chapter 6)


    Engage the children in a discussion about what makes a family. Talk about the
    ways in which families are different from one another and the ways in which they
    are alike.


    # ### Math Activities


    Shape Families (chapter 7)


    Going by family, make large tick marks on a dry erase board or a posterboard showing
    how many children each family has. Count the total number by ones to see how many
    children are in your storytime families.


    # ### Science Activity


    Engage the children in a discussion about hair color and texture, skin color,
    height, eye color, and other traits that family members have in common with one
    another. Use one of the photographic family books to highlight how people who
    are related by blood tend to look like one another.


    # ### Additional Fiction Titles


    *Families*


    *Hush, Little Baby* by Brian Pinkney (Greenwillow, 2006). The large and vibrant
    illustrations, plus the fact that you can sing the book, make it a wonderful choice
    for storytimes.


    *I Miss You Every Day* by Simms Taback (Viking, 2007). The simple text, wonderful
    illustrations, and repeating line will captivate children. Plus, the story inspires
    letter writing and dialogue about how the mail functions. This would be a great
    book to use with the Storytime Mailbox activity described in the writing section
    of chapter 3, “Books.”


    *Kitchen Dance* by Maurice J. Manning (Clarion Books, 2008). A joyfully illustrated
    story of a family having a night dance in the kitchen.'
  - '[PAGE 158]


    *Oonga Boonga* by Frieda Wishinsky (Little, Brown, 1990). Children will enjoy
    this story about the baby who refuses to be comforted by anyone but the big brother.


    *Tortillas and Lullabies / Tortillas y Cancioncitas* by Lynn Reiser (Greenwillow,
    1998). A lovely book with a repeating verse about four generations of women in
    a family and how they are alike and different.


    *Uncle Peter''s Amazing Chinese Wedding* by Lenore Look (Atheneum Books for Young
    Readers, 2006). An amusing and authentic look at family, change, and jealousy!


    # *Daddies*


    *Just Like Daddy* by Frank Asch (Prentice-Hall, 1981). The simple illustrations,
    repeating text, and amusing ending make this a popular choice for preschool storytimes.


    *Papa, Do You Love Me?* by Barbara Joosse (Chronicle Books, 2004). Similar to
    *Mama, Do You Love Me?* but featuring a papa instead.


    # *Mommies*


    *Because You Are My Baby* by Sherry North (Abrams Books for Young Readers, 2008).
    A mommy dreams of all the many things she would do for her baby in this fun, gender-busting
    book.


    *Full, Full, Full of Love* by Trish Cooke (Candlewick, 2003). Large, loving illustrations
    and a comforting story make this a nice choice for storytimes.


    *Honey Baby Sugar Child* by Alice Faye Duncan (Simon and Schuster Books for Young
    Readers, 2005). The gorgeous illustrations and abundant love between a mother
    and her child will appeal to children and caregivers alike.


    *I Love My Mommy* by Sebastien Braun (HarperCollins, 2004). This book features
    many different animals and is just adorable.


    *If I Could: A Mother''s Promise* by Susan Milord (Candlewick, 2008). A very simple
    book about a mother raccoon showing all the ways she loves her little one.


    *Mother, Mother, I Want Another* by Maria Polushkin Robbins (Crown, 1978). The
    misunderstanding between a mother and her baby at bedtime is an entertaining read
    for storytime.


    *Mothers Are Like That* by Carol Carrick (Clarion Books, 2000). A beautifully
    illustrated book that shares the qualities of many animal mothers and features
    a repeating line.


    *On Mother''s Lap* by Ann Herbert Scott (Clarion Books, 1992). A little boy wonders
    if there is enough room on his mother''s lap for him now that there is a new baby
    in the house.'
  - '[PAGE 159]


    *Te Amo, Bebé, Little One* by Lisa Wheeler (Little, Brown, 2004). A mother sings
    a repeating song to her baby as he grows in this sweet book.


    # *Babies*


    *Baby Knows Best* by Kathy Henderson (Little, Brown, 2001). The rhyming text and
    the humor make this a winner for storytime.


    *Bouncing Babies* by Michael Brownlow (Ragged Bears, 2002). Preschoolers will
    enjoy the large illustrations and this rhyming look at the things that babies
    do. (Caregivers will enjoy the joke at the end!)


    *Hush Little Baby: A Folk Song with Pictures* by Marla Frazee (Browndeer Press,
    1999). The old song, deftly and amusingly illustrated, will find new fans and
    spur a desire for repeated readings.


    *I’m a Baby, You’re a Baby* by Lisa Kopper (Viking, 1995). A simple book that
    compares human babies with baby animals and what we call them.


    *Lola Reads to Leo* by Anna McQuinn (Charlesbridge, 2012). Children will enjoy
    the heartwarming story of big sister Lola reading her favorite books to her new
    baby brother. The adorable illustrations are sized perfectly for storytime sharing.


    *More, More, More Said the Baby* by Vera Williams (Tupelo Books, 1990). The fun,
    repetitive language, and homey familiarity make this classic a necessity for sharing
    at storytime.


    *No More Kissing!* by Emma Chichester Clark (Doubleday Books for Young Readers,
    2002). The bright personality of the young monkey and the sweet relationship he
    has with his baby brother make this a nice storytime choice.


    *Such a Silly Baby* by Stefanie and Richard Lorig (Chronicle Books, 2008). Everywhere
    a mother goes, her baby gets swapped out for some other creature in this silly,
    song-like book.


    # *Other Family*


    *Grandpa Loves Me!* by Marianne Richmond (Marianne Richmond Studios, 2009). This
    loving book looks at many different grandpas and all the things they do with their
    grandchildren.


    *Tummy! Tummy! Tummy! A Palestinian Folktale* by Margaret Read MacDonald (Marshall
    Cavendish Children, 2006). The naughty little child/pot in this tale will amuse
    older preschoolers.


    *Watch Out! Big Bro’s Coming!* by Jez Alborough (Tundra Books, 2005). A funny
    book about perceptions and imaginations run wild.'
