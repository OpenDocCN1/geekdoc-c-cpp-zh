  mdcn: "\n## 质地\n\n### 材料\n\n- 具有不同质地的物品（例如砂纸、天鹅绒、灯芯绒布、橡皮泥、金属、一块木头、塑料气泡膜、橡胶、玻璃、石头、毛皮、Gak\
    \ 等）\n\n### 步骤\n\n把不同质地的物品传给孩子们触摸，或在故事时间开始前把它们放在桌上供孩子们探索。一次举起一个物品，和孩子们谈谈它的特性：“摸起来是什么感觉？”“为什么会有这种感觉？”“哪些物品的质地相似？”“哪些不同？”等等。\n\
    \n## 今日天气\n\n### 材料\n\n- 顶部印有各种天气图标的海报板：太阳、风、雨、云、雪等\n\n### 步骤\n\n故事时间开始前，谈谈外面的天气。把它与你们上次故事时间聚会时的天气作比较。问孩子们哪个图标最能代表今天的天气。在那个图标下方做一个标记或放一个标记物。经过多次活动后，看看图表，讨论孩子们发现的任何规律。用图表引发关于天气的讨论，并涉及季节。\n\
    \n## 野生与家养\n\n### 材料\n\n- 野生动物及其家养近亲的照片——例如，\n  - 狗和狼、狐狸、郊狼、澳洲野犬\n  - 猫和狮子、老虎、豹、美洲豹、美洲狮\n\
    \  - 猪和野猪\n  - 山羊和雪羊\n\n### 步骤\n\n分享野生动物及其家养近亲的照片。谈谈它们的相似之处和不同之处。\n\n插图非常精美。遗憾的是，书中没有收录歌曲的曲调，但值得翻阅。\n\
    \n- *《鹅妈妈：拉丁裔童谣宝库》* 作者：Alma Flor Ada（Hyperion Books for Children，2004）。这是一部极好的双语传统西班牙语童谣集，配有可爱的插图。\n\
    - *《玛丽·米德林及其他滑稽人物》* 作者：Rose Fyleman（Clarion Books，2004）。这是一部出色的短篇滑稽诗歌图画书合集。\n\
    - *《月亮，你见过我妈妈吗？卡拉·库斯金诗歌集》* 作者：Karla Kuskin（Laura Geringer Books，2003）。这本书满是诗歌瑰宝，对幼儿极具吸引力，主题也很熟悉。人人都该爱上卡拉·库斯金！\n\
    - *《月亮就是 La Luna：英语和西班牙语滑稽韵文》* 作者：Jay M. Harris（Houghton Mifflin，2007）。一本可爱的小书，韵文中穿插着西班牙语单词。\n\
    - *《街区鹅妈妈》* 作者：Nina Crews（Greenwillow，2004）。传统童谣配以精彩的多文化城市儿童照片。\n- *《一起做梦的诗 /\
    \ Poems Para Soñar Juntos》* 作者：Francisco X. Alarcón（Lee and Low Books，2005）。本卷大多收录较长的诗，但也有几首适合学龄前儿童的双语（西班牙语和英语）珍品。\n\
    - *《幼儿朗读韵文》*，Jack Prelutsky 选编（Knopf，1986）。Marc Brown 为这部精彩合集绘制插图。这里有太多伟大的诗歌和韵文，你可能不得不把故事时间的整个环节都献给这本书！\n\
    - *《汤米·德保拉诗集》*，Tomie dePaola 选编并绘制插图（Putnam，1988）。DePaola 真正理解孩子，这本理想的诗集证明了这一点。\n\
    - *《20世纪儿童诗歌宝库》*，Jack Prelutsky 编，Meilo So 绘（Knopf，1999）。名副其实的宝库。\n- *《欢迎你，宝宝！婴儿时光的婴儿韵文》*\
    \ 作者：Stephanie Calmenson（HarperCollins，2002）。这是一部可爱的韵文集，适合婴儿及以上儿童。\n- *《扭一扭，摇一摇：给幼儿的故事和韵文》*\
    \ 作者：Margaret Mayo（Knopf，2002）。收录了一些适合学龄前儿童的优秀韵文，以及一些可大声朗读的短篇故事。\n- *《满满一动物园的动物》*，William\
    \ Cole 选编（Houghton Mifflin，1992）。一部精彩的动物诗集，许多诗非常短。插图也极具娱乐性，使这部合集很适合陈列展示。\n\n##\
    \ 第4部分：筹划晚餐派对\n\n![](img/726487289a66f26aae16af221d544409_130_0.png)\n\n## 菜单\n\
    \n寻找一本新食谱书时，我最喜欢的部分就是仔细研读食谱，寻找亮点，删去食材、加入其他食材，以顺应季节和我的口味。而我们现在正到了这一步！\n\n### 给主厨的说明\n\
    \n我们已经考察了儿童如何成长和学习。我们品尝了故事时间的美味健康食材。我们仔细研读了孩子们在学校轻松成功所需的数学和科学技能，也尝试了将诗歌加入故事时间的可行且可口的方式。现在我们要看看如何把它们全部整合起来。以下菜单都有主题，但你会注意到，它们的主题非常宽泛。主题并非必需，但许多图书馆员和家长觉得它们令人安心，也许还有助于规划。我们故事内容中唯一真正重要的因素，是它们塞满了精彩的图书、故事、对话、学习和*乐趣*。\n\
    \n每份菜单起初建议三本虚构类图书。第一本以故事为重。书中充满有趣的背景、人物和情节元素，能吸引孩子们的心智和情感。这类书非常容易引出开放式问题，并让孩子练习理解情感、故事和事件。第二本可能是互动性的，或以某种方式涉及数学或科学。第三本可能滑稽、发人深省，或者只是简短有趣。还会标出一本可使用的合适知识类图书。\n\
    \n在故事时间分享多少本书，以及它们在你自己的故事时间计划中处于什么位置，取决于个人偏好和受众。有些图书馆员会在许多手指游戏、故事和游戏之间使用两本书。有些人可能只在一两个其他活动之间读四五本书。这些菜单旨在适应个人风格和口味。建议的活动远多于一次活动能用完的量。所包含的活动以及额外的虚构类和知识类图书意味着，一份特定的菜单一年可以使用两三次甚至更多次。孩子们可能会认出这些手指游戏或毛毡板，但图书和活动可以更换。\n\
    \n菜单中收录了绝版图书。大厨们不遗余力地寻找完美食材，我们的孩子当然也应该分享过去那些深受喜爱的图书。此外，精彩的绝版图书每年都会重新出版，其中一些可能仍藏在我们故事时间藏书深处的角落，或藏在互联网上。\n\
    \n每份菜单都包含足够多新颖且易于获取的图书，可满足任何故事时间需求。虚构类和知识类建议适合大多数学龄前受众。不过，如果你遇到对孩子来说难度过高的图书，可以抽出一页来分享，或者直接使用照片或插图来增强故事时间的学习。\n\
    \n菜单中建议的手指游戏或动作韵文出自本书第4章。它们旨在补充你目前在故事时间中喜欢使用的手指游戏。菜单按标题提到它们，标题在第4章按字母顺序列出。如果列出了毛毡板，可以在第5章按标题字母顺序找到。仅列出标题的互动游戏或活动在第6章有完整描述。按标题列出的数学活动在第7章有完整描述，仅按标题列出的科学活动在第8章有描述。这里还列出了建议的诗歌，包括可能的来源，合适的佚名诗也同样列出。\n\
    \n我希望这本书被翻得卷角，布满笔记、补充、灵感，还有巧克力污渍。\n\n"
