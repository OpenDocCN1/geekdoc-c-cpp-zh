    *Jazz Baby* by Carol Boston Weatherford (Lee and Low Books, 2002). An energetic
    rhyming book featuring many children singing and dancing. Fun!


    *Jim and the Beanstalk* by Raymond Briggs (Putnam and Grosset, 1997). A hilarious
    story about a needy giant. It''s a longer story, but the humor will captivate
    the audience, and the possibility of measurement activities following the reading
