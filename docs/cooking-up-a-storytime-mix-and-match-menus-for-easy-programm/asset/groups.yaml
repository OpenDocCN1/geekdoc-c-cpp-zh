    \ Old/Young/New\n+   - Day/Night\n+   - Fast/Slow\n+   - Happy/Sad\n+   - Big/Little\n\
    +   - Apart/Together\n+   - Front/Back\n+   - Right/Wrong/Left\n+   - Clean/Dirty\n\
    +   \n+   - Tall/Short\n+   - Fat/Thin\n+   - First/Last\n+   - Many/Few\n+  \
    \ - Dark/Light\n+   - Quick/Slow\n+   - Thick/Thin\n+   - Stop/Go\n+   - Rough/Smooth\n\
    +   - Hard/Soft/Easy\n\nChildren often come up with “outside the box” opposites,\
    \ which can make this a very enjoyable game.\n\n# Photos\n\n*Supplies*\n\n+  \
    \ - large, easy-to-see photographs of a particular subject (for example, types\
    \ of food, hats, farm animals, baby animals, sea creatures, tools, types of transportation,\
    \ articles of clothing)\n\n# Directions\n\nUsing photographs in storytimes not\
    \ only expands children’s world knowledge but is highly entertaining as well.\
    \ Our nonfiction collections feature many wonderful photos, and clip art collections\
    \ can be reasonably purchased, allowing us to print out incredible photographs\
    \ of a myriad of subjects. Show the photographs one at a time and begin a dialogue\
    \ with the children. With larger groups, if it’s possible, walk through the group\
    \ and give children in all areas of the room a chance to participate. Ask questions\
    \ such as: “What is this?” “Where would we find it?” “Have you ever seen this\
    \ before?” Sprinkle some facts into the discussion or highlight books that contain\
    \ more information.\n\n# Picture/Word\n\n*Supplies*\n\n+   - cards of clip art\
    \ or photographs of interesting yet familiar items (for example, a car, house,\
    \ dog, horse, tree, child, diaper, hot dog, pair of underpants). It’s fun to add\
    \ silly pictures—the humor will encourage engagement.\n+   - cards of printed\
    \ words"
