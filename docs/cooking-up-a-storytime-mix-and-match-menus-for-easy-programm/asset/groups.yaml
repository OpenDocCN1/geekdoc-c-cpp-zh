    ## Math Fun


    ### Suggested Fiction Titles


    *Jim and the Beanstalk* by Raymond Briggs (Putnam and Grosset, 1997). A hilarious
    story about a needy giant. It’s a longer story, but the humor will captivate the
    audience, and the possibility of measurement activities following the reading
    helps make this an excellent choice.


    *My Heart Is Like a Zoo* by Michael Hall (Greenwillow, 2010). A variety of adjectives
    describe animals that are made from heart shapes. This book begs for an accompanying
    art activity.


    *Ten Black Dots* by Donald Crews (Greenwillow, 1986). Probably the best beginning
    counting book one could find. And with terrific dot art extension possibilities
    as well.


    *Mouse Count* by Ellen Stoll Walsh (Harcourt Brace Jovanovich, 1995). Simple,
    suspenseful, and begins at one. A classic.


    *One Foot, Two Feet: An EXCEPTIONAL Counting Book* by Peter Maloney (Putnam, 2011).
    This very simple, die-cut counting book starts at one (goes to a billion!) and
    is great for storytime.


    *Over in the Meadow* by Ezra Jack Keats (Viking, 1999). The old Wadsworth rhyme
    beautifully illustrated by Keats. Perfect for preschool storytimes.


    *Over in the Meadow* by John Langstaff (Harcourt, Brace, 1957). Another version
    of the old Wadsworth rhyme with intricate illustrations by Caldecott winner Feodor
    Rojankovsky.


    *Spot Can Count* by Eric Hill (Putnam, 1999). This is an ideal book for beginning
    counters—contains simple illustrations, begins at one, and clearly shows items
    to count.


    *Ten Little Caterpillars* by Bill Martin Jr. (Beach Lane Books, 2011). A wonderful
    counting book that counts using ordinal numbers (first, second, third, and so
    on). Very simple with beautiful illustrations by Lois Ehlert and some wonderful
    science connection possibilities as well—a winner!


    *10 Little Rubber Ducks* by Eric Carle (HarperCollins, 2005). A counting book,
    but with science connections as well because it is based on the true story of
    a carton of rubber ducks that went overboard from a ship and scattered to many
    regions of the Pacific Ocean.


    *Ten Red Apples: A Bartholomew Bear Counting Book* by Virginia Miller (Candlewick,
    2002). A nice one-to-ten counting book with the apples off to the side for subitizing.


    *We All Went on Safari: A Counting Journey through Tanzania* by Laurie Krebs (Barefoot
    Books, 2003). This wonderful counting book is simple and accompanied by a repeating
    phrase for extra fun.


    ### Suggested International Title


    *Pattern Fish* by Trudy Harris (Millbrook Press, 2000). This wonderfully fun book
    is ideal for storytimes. The pattern is established on a double-page spread featuring
    some sort of sea creature. The children are prompted to complete the pattern when
    that page is turned. Hilarious illustrations.


    ### Fingerplay or Story


    - Numbers Like to Fly (chapter 4)


    ### Poem


    > “Counting” by Eve Merriam, in *Higgle Wiggle Happy Rhymes* (Morrow Junior Books,
    1994), unp.


    ### Flannelboards


    - Bubbles (chapter 5)

    - Shapes and Colors (chapter 5)


    ### Interactive Game


    - Letter/Number Game (chapter 6)


    ### Math Activity


    - High and Low (chapter 7)


    ### Science Activity


    - Shadow and Light (chapter 8)


    ## Measurement


    *Big, Bigger, Biggest!* by Nancy Coffelt (Henry Holt, 2009). A very simple book
    with excellent comparison examples.


    *Blue Sea* by Robert Kalan (Greenwillow, 1979). Children love this simple book
    where the little fish gets away. Cut out paper fish of varying sizes for the children
    to sort by size after the storytime.


    *Inch by Inch* by Leo Lionni (Astor-Honor, 1960). Cut a piece of yarn or string
    and use it to measure items in the room the way the worm uses himself. Introduce
    a ruler and show the children what an inch looks like. Talk about “longer,” “shorter,”
    “taller,” “wider,” and so forth. Outline and cut out your feet and the children’s
    feet and use the cutouts to measure things around the room. (How many “feet” is
    this object?)


    ### Order


    *First the Egg* by Laura Vaccaro Seeger (Roaring Brook Press, 2007). Use this
    book to talk about the concept first . . . and then . . . and then. Relate the
    book to an activity or event for the day (for example, “First we sing a welcome
    song and then we read a book and then . . .”) and let the children fill in the
    blanks. This is a great activity for developing vocabulary and narrative skills
    as well as early math skills.


    ### Patterns


    *Fun with Patterns* by Peter Patilla (Millbrook Press, 1998). Use the introduction
    in this book to begin a discussion of patterns.


    *Gray Rabbit''s Odd One Out* by Alan Baker (Kingfisher, 1995). Rabbit (and the
    readers!) must find the odd item on each page. This interactive title is cute,
    vibrant, and filled with learning.


    *Hide and Snake* by Keith Baker (Harcourt Brace Jovanovich, 1991). This very simple
    book has many opportunities for interaction as children look for the hiding snake
    on each page. It also offers an opportunity to talk about patterns.


    ### Shapes


    *Brown Rabbit''s Shape Book* by Alan Baker (Kingfisher Books, 1994). This clever
    yet simple book looks at many shapes, but also features the science of air going
    out of balloons! Fun!


    *Changes, Changes* by Pat Hutchins (Macmillan, 1971). As children watch the block
    characters make, dismantle, and remake their world in this wonderful wordless
    book, they might very well beg for a set of blocks for play after the storyline.


    *Circus Shapes* by Stuart J. Murphy (HarperCollins, 1998). This wonderful rhyming
    book features animals and shapes in the context of a circus performance. Great
    for prompting a discussion about shapes.


    *Color Farm* by Lois Ehlert (Lippincott, 1990). The clarity of the shapes as each
    page is turned makes this a wonderful choice for storytimes. And the animals are
    creative, amusing, and colorful.


    *Round Is a Mooncake* by Roseanne Thong (Chronicle Books, 2000). Basic shapes
    are introduced in this vivid book. Grace Lin provides gorgeous illustrations featuring
    traditional Chinese items.


    *Sea Shapes* by Suse MacDonald (Harcourt Brace, 1994). Each page begins with a
    shape and then grows frame by frame into a seascape. Perfect for storytime—nice,
    large, colorful illustrations.


    *Shape Capers* by Cathryn Falwell (Greenwillow, 2007). Children will enjoy this
    rhythmic story about shapes.


    *The Shape of Things* by Dayle Ann Dodds (Candlewick, 1994). The very simple format
    and the clarity of the shapes make this a great choice for storytimes where younger
    children are present.


    *Shapes and Patterns* by Eyelike Books (Play Bac, 2007). Large photographs cover
    a two-page spread demonstrating a wide variety of shapes and patterns. A single
    page from this book is ideal for demonstrating a specific shape or pattern concept.


    *Ship Shapes* by Stella Blackstone (Barefoot Books, 2006). The vibrant quilted
    illustrations and the built-in interaction make this an excellent choice for storytime.


    ### Sorting


    *Sorting at the Ocean* by Jennifer Rozines Roy (Marshall Cavendish Benchmark,
    2006). Use this book to introduce the concept of sets.


    ### Supplementary Titles


    *Hide and Seek* by Janet Wong (Harcourt, 2005). The counting in this book is secondary
    to the poetry of the words, but children will enjoy the concept of seeking a place
    to hide while someone counts to ten.


    *Look! Look! Look!* by Nancy Elizabeth Wallace (Marshall Cavendish, 2006). As
    the mice examine the different aspects of a postcard that arrives for the humans
    in their home, they cover quite a few mathematical concepts. This book inspires
    many art and writing activities!


    *Mother Goose: Numbers on the Loose* by Leo and Diane Dillon (Harcourt, 2007).
    A fun book filled with Mother Goose rhymes that contain numbers or counting.


    *Mouse Views: What the Class Pet Saw* by Bruce McMillan (Holiday House, 1993).
    Vivid photographs of classroom items in tight close-up make this a perfect book
    for eliciting interaction.


    *26 Letters and 99 Cents* by Tana Hoban (Greenwillow, 1987). This is a great photographic
    book about letters and coins and counting.


    ### Additional Informational Titles


    *The Icky Bug Counting Book* by Jerry Pallotta (Charlesbridge, 1992). This wonderful
    book begins with zero and counts up to twenty-six. If the information about real
    insects is too long for your storytime, simply use the illustrations to generate
    conversation about the children''s life experiences with the different bugs.


    *One Nighttime Sea* by Deborah Lee Rose (Scholastic, 2003). Large illustrations
    count many sea creatures that are awake when children are asleep.

