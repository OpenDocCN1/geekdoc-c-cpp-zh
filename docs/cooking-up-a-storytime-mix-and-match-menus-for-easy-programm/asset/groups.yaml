    *Mama Goose: A Latino Nursery Treasury* by Alma Flor Ada (Hyperion Books for Children,
    2004). A terrific bilingual collection of traditional Spanish rhymes with adorable
    illustrations.


    *Mary Middling and Other Silly Folk* by Rose Fyleman (Clarion Books, 2004). Excellent
    picture-book collection of short, silly poems.


    *Moon, Have You Met My Mother? The Collected Poems of Karla Kuskin* by Karla Kuskin
    (Laura Geringer Books, 2003). This book is chockful of poetry gems that have great
    appeal for young children and feature familiar subjects. Everyone should fall
    in love with Karla Kuskin!


    *The Moon Is La Luna: Silly Rhymes in English and Spanish* by Jay M. Harris (Houghton
    Mifflin, 2007). A lovely little book with rhymes that are peppered with Spanish
    words.


    *The Neighborhood Mother Goose* by Nina Crews (Greenwillow, 2004). The traditional
    rhymes accompanied by wonderful multicultural photographs of children in the city.


    *Poems to Dream Together / Poems Para Soñar Juntos* by Francisco X. Alarcón (Lee
    and Low Books, 2005). This volume contains mostly longer poems but has a couple
    of gems for preschoolers in Spanish and English.


    *Read-Aloud Rhymes for the Very Young*, selected by Jack Prelutsky (Knopf, 1986).
    Marc Brown illustrated this wonderful collection. There are so many great poems
    and rhymes here, you may have to devote a whole section of storytime to this book!


    *Tomie dePaola''s Book of Poems*, selected and illustrated by Tomie dePaola (Putnam,
    1988). DePaola really understands children, and this collection of ideal poems
    demonstrates that.


    *The 20th Century Children''s Poetry Treasury*, edited by Jack Prelutsky, illustrated
    by Meilo So (Knopf, 1999). A treasury indeed.


    *Welcome, Baby! Baby Rhymes for Baby Times* by Stephanie Calmenson (HarperCollins,
    2002). This is an adorable collection of rhymes for infants and up.


    *Wiggle Waggle Fun: Stories and Rhymes for the Very Young* by Margaret Mayo (Knopf,
    2002). Features some excellent rhymes for preschoolers and some short stories
    to read aloud as well.


    *A Zooful of Animals*, selected by William Cole (Houghton Mifflin, 1992). A wonderful
    collection of animal poems, many very short. The illustrations are wildly entertaining
    as well, making this a nice collection to put on display.'
