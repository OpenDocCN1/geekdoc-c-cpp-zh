    # **Poem: “Bed”** *(Anonymous)*


    > > In jumping and tumbling

    > > We spend the whole day,

    > > ’Til night, by arriving,

    > > Has finished our play.

    > > What then? One and all

    > > There’s no more to be said.

    > > As we tumbled all day,

    > > So we tumble to bed.


    # **Flannelboard**


    Counting Sheep (chapter 5)


    # **Interactive Games and Activities**


    Flashlight Vocabulary (chapter 6)

    Moon and Sun Game (chapter 6)


    # **Math Activity**


    Flannelboard Counting: Cut out about twenty moon shapes and place them in a bag
    or box. Reaching your hand in, pull out a handful of the moons and ask the children
    to estimate how many you hold in your hand. Place the moons on the flannelboard
    and count them together. After they are counted, discuss how the children went
    about making their estimations and what factors helped them guess the number of
    moons.


    # **Science Activity**


    New Moon/Full Moon (chapter 8)


    # **Additional Fiction Titles**


    *All the Pretty Little Horses: A Traditional Lullaby*, illustrated by Linda Saport
    (Clarion Books, 1999). Lovely, muted illustrations and a soft lullaby make this
    a nice choice for a gentle storytime book.


    *Animals Are Sleeping* by Suzanne Slade (Sylvan Dell, 2008). Muted but alluring
    illustrations show many animals asleep. Lovely, with a wee touch of humor.


    *Bear Snores On* by Karma Wilson (Margaret K. McElderry Books, 2002). Rhyme, repetition,
    and a fun story make this a great choice for storytime. Nice, large illustrations
    as well.


    *Geraldine’s Blanket* by Holly Keller (Greenwillow, 1984). This comforting story
    follows a little pig who adapts her beloved blanket to suit everyone, including
    herself.'
  - '[PAGE 138]


    *The House in the Night* by Susan Marie Swanson (Houghton Mifflin, 2008). Caldecott
    winner with simple text, gorgeous woodcuts, and a gentle message.


    *How Do Dinosaurs Say Good Night?* by Jane Yolen (Scholastic, 2001). Toddlers
    and preschoolers will love the silly dinosaurs, the engaging illustrations, the
    rhyming text, and the questions posed.


    *Little Donkey, Close Your Eyes* by Margaret Wise Brown (HarperCollins, 1995).
    A gently repeating phrase accompanies many animals readying for sleep. Wonderful
    for toddlers and young preschoolers.


    *May We Sleep Here Tonight?* by Tan Koide (Atheneum, 1983). Preschoolers will
    enjoy this story about little creatures hoping to find shelter from a storm. The
    scary entrance of a large beast ends comfortably well.


    *The Napping House* by Audrey Wood (Harcourt, 1984). Cumulative tale that is a
    popular read for both children and adults.


    *Siesta* by Ginger Foglesong Guy (Greenwillow, 2005). A Spanish/English bilingual
    book about two young friends assembling everything they will need for a nap in
    the backyard.


    *Sleep, Big Bear, Sleep* by Maureen Wright (Marshall Cavendish Children, 2009).
    The antics of the bear who mishears a message from Old Man Winter will greatly
    amuse the children at storytime.


    *So Sleepy Story* by Uri Shulevitz (Farrar, Straus and Giroux, 2006). A lilting
    story whose illustrations will work more effectively for smaller groups. Very
    sleepy.


    *Ten in the Bed* by Jane Cabrera (Holiday House, 2000). The old song is accompanied
    by vivid illustrations in this book you can sing.


    *Ten in the Den* by John Butler (Peachtree, 2005). A book you can sing, with detailed
    and adorable illustrations.


    *Ten, Nine, Eight* by Molly Bang (Greenwillow, 1983). This gentle counting book
    begins at ten and counts down to sleep.


    *Tuck Me In* by Dean Hacohen (Candlewick, 2010). Cut pages, repetition, and very
    simple text make this a perfect choice for the younger storytime children.


    *What? Cried the Granny: An Almost Bedtime Story* by Kate Lum (Dial Books for
    Young Readers, 1999). Granny does all sorts of outlandish yet handy things to
    help her grandchild get to sleep. Preschoolers find this one very amusing.


    *When Sheep Sleep* by Laura Numeroff (Abrams Books for Young Readers, 2006). The
    large illustrations, repetition, and rhyme make this a nice choice for storytimes.
    Plus, one can make many snoring noises for added entertainment.'
  - '[PAGE 139]


    # Additional Informational Titles


    *One Nighttime Sea* by Deborah Lee Rose (Scholastic, 2003). Large illustrations
    count out many sea creatures who are awake when children are asleep.

    *Sleep Is for Everyone* by Paul Showers (HarperCollins, 1997). Nicely illustrated,
    this could be read in its entirety or a few pages could be singled out to start
    a discussion about sleep and sleep habits.


    # Additional Poems


    +   - “The Dream Keeper” by Langston Hughes, in *The 20th Century Children’s Poetry
    Treasury*, edited by Jack Prelutsky (Knopf, 1999), p. 31.

    +   - “Glass Covers Windows” by Nikki Giovanni, in *The 20th Century Children’s
    Poetry Treasury*, edited by Jack Prelutsky (Knopf, 1999), p. 85.

    +   - “Good Night, Good Night” by Dennis Lee, in *Read-Aloud Rhymes for the Very
    Young*, edited by Jack Prelutsky (Knopf, 1986), p. 88.

    +   - “Night Bear” by Lee Bennett Hopkins, in *Here’s a Little Poem*, collected
    by Jane Yolen (Candlewick, 2007), p. 88.

    +   - “Sheep” by Mike Thaler, in *A Zozul of Animals*, selected by William Cole
    (Houghton Mifflin, 1992), p. 67.

    +   - “The Stars Show” by Nicola Davies, in *Outside Your Window: A First Book
    of Nature* (Candlewick, 2012), p. 100.


    # **“Night Light Tongue Twister”** *(Author unknown)*


    > > You’ve no need to light a night-light

    > > On a light night like tonight,

    > > For a night-light’s light is a slight light,

    > > And tonight’s a night that’s light.

    > > When a night’s light, like tonight’s light,

    > > It is really not quite right

    > > To light night-lights with their slight lights

    > > On a light night like tonight.'
  - '[PAGE 140]


    # # Bugs


    # ## Suggested Fiction Titles


    *The Giant Jam Sandwich* by John Vernon Lord (Houghton Mifflin, 1972). Preschoolers
    will enjoy this rhyming story about a town’s creative way of getting rid of wasps.


    *I Love Bugs* by Philemon Sturges (HarperCollins, 2005). Simple text, many varieties
    of bugs, large illustrations, rhyme, and a gentle ending make this a nice choice
    for storytimes.


    *Ten Little Caterpillars* by Bill Martin Jr. (Beach Lane Books, 2011). A wonderful
    counting book that counts using ordinal numbers (first, second, third, and so
    on). Very simple with beautiful illustrations by Lois Ehlert and some wonderful
    science connections as well—as winner!


    # ## Suggested Informational Title


    *Pattern Bugs* by Trudy Harris (Millbrook Press, 2001). This amusing book features
    math prompts, information, and many vivid bugs. The interaction is built in and
    so is the fun.


    # ## Fingerplay or Story


    +   - Bugs in the Yard (chapter 4)

    +   - Bugs Move (chapter 4)


    # ## Poem: Little Miss Muffet


    > > Little Miss Muffet

    > > Sat on a Tuffet

    > > Eating her curds and whey.

    > > Along came a spider and sat down beside her

    > > And frightened Miss Muffet away.

    > >

    > > — *Mother Goose*


    # ## Interactive Game


    +   - Birds and Insects (chapter 6)


    # ## Math Activity


    Cut out enough L’s, D’s, F’s, and B’s for all the children. Explain that the L
    stands for ladybug. Show a photo of a ladybug, place an L beside it, and place
    it in one corner of the room. Show a photo of a dragonfly and put it and the D
    in another corner. A firefly photo and the F go into the third corner, and the
    B and the butterfly photo go into the last corner. Pass out the letters to the
    children. Play music or clap or snap and encourage all bugs to gather in their
    corners. Count each corner’s inhabitants.'
