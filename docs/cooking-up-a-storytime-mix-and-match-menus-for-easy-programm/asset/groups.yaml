    life cycle, prey and predator, ecosystems, light and shadow, weather, anatomy,
    gravity, and the like. For example, after you have shared the book *Fiesta* by
    Ginger Foglesong Guy, you might bring out a top like the one pictured in the book
    and ask, “Do you remember this from the book?” Then engage the children in a dialogue
    about how tops spin. (For large groups, you could demonstrate the top spinning
