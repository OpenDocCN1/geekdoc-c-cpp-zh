  mdcn: "\n*《移动中的大卡车》* 作者 Candice Ransom（Lerner，2011）。书中照片配合简单文字，对学龄前儿童极具吸引力。\n\n\
    *《这就是火车》* 作者 Paul Collicutt（Farrar, Straus and Giroux，2001）。简单的文字、大量重复，以及一些奇妙的数学词汇，使这本书成为故事会的首选。Collicutt\
    \ 以这种简洁风格创作了许多关于不同交通方式的图书——*《这就是火箭》《这就是卡车》《这就是船》《这就是飞机》* 等。\n\n## 其他诗歌\n\n- “*《Rápido\
    \ 很快》*” 作者 Jay M. Harris，收录于 *《月亮是 La Luna：英语和西班牙语趣味韵诗》*（Houghton Mifflin，2007），无页码。\n\
    - “*《你难道不想吗？》*” 作者 John Ciardi，收录于 *《给幼儿的朗读韵诗》*，Jack Prelutsky 编（Knopf，1986），第33页。\n\
    \n## 精选参考文献\n\n- 美国儿科学会传播与媒体委员会。2011。“政策声明：2岁以下儿童的媒体使用。”《Pediatrics》128 (5): 1040–45（2011年10月17日电子版）。doi:10.1542/peds.2011-1753.\n\
