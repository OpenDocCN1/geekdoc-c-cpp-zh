    # # Flannelboards


    WHEN I WAS FOUR, MY MOTHER BELONGED TO A BOWLING LEAGUE. AND WAY back then, the
    bowling alley offered a nursery school for the children of league bowlers (imagine!).
    I don''t recall the name or the face of the lovely woman who entertained us while
    our mothers bowled, but I do remember three things about her: her very full, crinoline-lined
    skirts; her kind and gentle manner; and her astonishing flannelboard. To my four-year-old
    self, those little figures hanging magically on that fuzzy black board captivated
    me almost as much as the story or song that accompanied them. I think perhaps
    I have been obsessed with flannelboards ever since! And I love the idea of using
    the flannelboard to engage the children in conversation and language play.


    # ## Using the Flannelboard


    The flannelboard can be used in many ways to develop the early language and literacy
    skills of young children—to encourage rhyming skills; to introduce concepts such
    as numbers, counting, and colors; to prompt developing language skills through
    open-ended questions; and to incorporate movement to help scaffold language learning.
    This chapter introduces some fun flannelboard ideas and includes patterns.


    # ### RHYMING FLANNELBOARDS


    Creating flannelboard figures that have rhyming prompts within them encourages
    the children to participate and allows us to gauge their abilities based on their'
  - '[PAGE 81]


    responses. We may introduce flannelboards with figures that rhyme or incorporate
    what are called *completion prompts*. To use a completion prompt, begin a phrase
    with an embedded rhyme but stop short of completing the rhyme to allow the children
    to complete it. For example, during a storytime about food, I might say,


    > “When I am hungry, I stand on my feet,

    > And walk to the kitchen for something to _____.”


    Pausing and allowing the children to complete the rhyme makes the learning more
    active for them and allows us to measure their ability to hear and produce rhymes.
    The following flannelboards all focus on developing the skill of hearing and producing
    rhymes.


    # Child’s Face


    This flannelboard rhyme is an example of a completion prompt. You can alter the
    hair to make this figure any child you like or a number of different children.


    To make a child in this place

    We must put up one, round _____. *(face)*

    We will add for some flare,

    Black, shiny, curly _____. *(hair)*

    Because our child will want to hear,

    On each side, we’ll place an _____. *(ear)*

    Our child will want to see the skies,

    So we’ll add two shining _____. *(eyes)*

    So that she can smell a rose,

    Let’s put here a button _____. *(nose)*

    If we put this upside down,

    She will wear a lovely _____. *(frown)*

    But we want a happy style,

    So let’s flip it to a _____. *(smile)*

    A bow right here and she is done,

    Our happy child is ready for fun!


    ![](img/726487289a66f26aae16af221d544409_81_0.png)


    # Supplies


    +   - small amounts of felt in colors appropriate for the child you would like
    to create

    +   - scissors


    # Directions


    Download pattern 5.1 from aleditions.org/webextras. Using the pattern, cut the
    face, hair, ears, eyes, nose, smile, and bow out of different colors of felt.'
