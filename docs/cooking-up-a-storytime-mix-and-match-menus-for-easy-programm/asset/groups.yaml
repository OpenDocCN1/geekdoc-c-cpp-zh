    ### Poem


    “My Puppy” by Aileen Fisher, in *Here’s a Little Poem*, collected by Jane Yolen
    (Candlewick, 2007), p. 36.


    ### Flannelboard


    Counting Puppies (chapter 5; math activity too!)


    ### Interactive Games and Activities


    Using *Arf! Beg! Catch! Dogs from A to Z*, go through the alphabet and ask the
    children what they see in the photographs. Talk about the concepts and point out
    the letters.


    Microphone (chapter 6): Describe your dog, if you have one (or a dog you wish
    you could have, or a friend’s dog, or any dog). Encourage the children to describe
    their dogs. Ask some open-ended questions about dogs to keep the children talking.


    ### Math Activity


    Floor Shapes (chapter 7): The children could pretend to be dogs as they move to
    the music!


    ### Science Activities


    Share a dog breed book from the library. Pick out a few very different dog breeds
    and engage the children in a discussion about their differences (size, weight,
    sound of bark, fur, and the like) and their similarities (noses, growls, manners,
    loyalty, and so forth). Encourage the children to talk about dogs they have known
    or have seen.


    Talk with the children about the fact that dogs are very different and that strange
    dogs may not always be friendly and should be treated accordingly.


