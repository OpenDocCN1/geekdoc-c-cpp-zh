    # # Language Play


    THE NEXT ESSENTIAL INGREDIENTS FOR OUR STORYTIME PANTRY ARE THE rhymes and fingerplays
    that enhance our children’s love for words and language.


    # ## Language and Learning


    Seasoned librarians practice the rich library tradition of sharing fingerplays
    and action verses with young children and their caregivers. Our library shelves
    are filled with volumes of delightful verses to use with children, and with access
    to the Internet, it’s as easy to find entertaining fingerplays, action verses,
    and stretchers as it is to type “fingerplays cows” on the keyboard. As we know
    from the research behind *Every Child Ready to Read*, these verses increase vocabulary
    skills, narrative skills, phonological awareness, listening skills, and knowledge
    about the world. Plus, they are really, really fun! Preschool children learn a
    great deal through imitation, and the fingerplays that we employ are wonderful
    for encouraging imitation. When we repeat their rich vocabulary and incorporate
    movement, song, or chant, we literally bathe children in language.


    Incorporating more interaction into our language play with children, asking the
    children themselves to make more of a contribution, will add even more to their
    learning. By asking for their contribution, we ask them to listen to the question
    posed, ponder an answer, relate it to what they already know, brainstorm ways
    to contribute, and finally articulate their idea to the group. This is very active
    learning! Plus, when the children are part of the creation, the verse will constantly
    change'
  - '[PAGE 53]


    and can therefore be repeated many times and still be fun. And contributions from

    the children are often quite inventive, making the storytime more enjoyable for

    adults as well!


    # ## A Potful of Words


    The following are interactive fingerplays and action verses that invite contributions

    from the children.


    # ### Action Words


    +   - I can stand. *(stand)*

    +   - Can you stand? *(encourage children to stand)*

    +   - I can sit. *(sit)*

    +   - Can you sit? *(encourage children to sit)*

    +   - Stand, sit.

    +   - Stand, sit.

    +   - We can stand and sit!


    What else can we do? (Take suggestions from the children. Pick two new actions.)


    +   - I can _____ *(one of the actions suggested)*.

    +   - Can you _____?

    +   - I can _____ *(the other action suggested)*.

    +   - Can you _____?

    +   - _____, _____.

    +   - _____, _____.

    +   - We can _____ and _____!


    *(Repeat until everyone is exhausted!)*


    # ### Autumn


    +   - What is the season?

    +   - What is the season?

    +   - What is the season?

    +   - Do you know?


    *(Encourage the children to name the season.)* How can you tell when it''s autumn?

    What do we see in the world outside that makes us think of autumn? (Choose one'
  - '[PAGE 54]


    observation and insert it into the chant. For example, we see the red leaves or
    we see the leaves fall or we see the pumpkins.)


    We see the leaves fall,

    We see the leaves fall,

    We see the leaves fall,

    That means autumn!


    We see the pumpkins . . .

    We feel the cold air . . .

    We feel the wind blow . . .


    # ### Bugs in the Yard


    It is so nice to wander (mime walking)

    All around the yard.

    The grass is soft and fuzzy, (wiggle your fingers like grass)

    And the rocks are hard. (bump your knuckles together)

    We look up at the sky, (look up)

    We look down on the ground. (look down)

    And suddenly . . . oh! (point)

    A bug''s been found!

    Oooh! What is it? (look more closely)


    What kinds of bugs might we see outside? (Choose one of the suggestions.) What
    does a ______ look like? Does it fly? Has anyone else seen a ______?


    It is so nice to wander (mime walking)

    All around the yard.

    The grass is soft and fuzzy, (wiggle your fingers like grass)

    And the rocks are hard. (bump your knuckles together)

    We look up at the sky, (look up)

    We look down on the ground. (look down)

    We''ve already found a ______,

    And . . . oh! (point)

    Another bug''s been found!

    Oooh! What is it?


    (Take more suggestions and choose one.)


    It is so nice to wander (mime walking)

    All around the yard.'
  - '[PAGE 55]


    The grass is soft and fuzzy, (wiggle your fingers like grass)

    And the rocks are hard. (bump your knuckles together)

    We look up at the sky, (look up)

    We look down on the ground. (look down)

    We''ve already found a ____ and a ____,

    And now what bug''s been found? (point)


    *(Keep repeating until you have a long list of bugs, then:)*


    It is so nice to wander (mime walking)

    All around the yard.

    The grass is soft and fuzzy, (wiggle your fingers like grass)

    And the rocks are hard. (bump your knuckles together)

    We''ve seen so many bugs,

    They crawl and hop and fly.

    But now it''s time to go inside

    And so you bugs, good-bye!


    # **Bugs Move**


    This chant is very active as you act out each of the bug activities together.
    There are no wrong ways to act out the bugs. Just have fun. You can extend the
    learning by initiating discussion about the bugs either before or after the chant.


    Spiders in the yard they

    spin, spin,

    spin, spin,

    spin, spin.

    Spiders in the yard they

    spin, spin,

    On a sunny day.


    Butterflies they

    flutter, flutter,

    flutter, flutter,

    flutter, flutter.

    Butterflies they

    flutter, flutter,

    On a sunny day.'
