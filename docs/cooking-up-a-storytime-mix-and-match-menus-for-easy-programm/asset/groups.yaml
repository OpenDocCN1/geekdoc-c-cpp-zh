  - '[PAGE 175]


    *It’s Rainy Today* by Kristin Sterling (Lerner, 2010). Excellent photographs and
    simple sentences present all sorts of potential discussion ideas about rain. This
    is one in a series about different kinds of weather.


    # ADDITIONAL POEMS


    **“Ladybug”**　　　　　　　　　　　　　　　　　*(Anonymous)*


    Ladybug,

    Ladybug,

    Ladybug,

    Don’t fly away.

    You’re good for my garden,

    Please, ladybug—stay.


    **“The Storm”**　　　　　　　　　　　　　　　　*(Anonymous)*


    The thunder crashed,

    The lightning flashed,

    And all the world was shaken.

    The little pig

    Curled up his tail,

    And ran to save his bacon!


    This is also the menu in which to feature any poems that you love!


    # Seashore


    # Suggested Fiction Titles


    +   - *Little Fish Lost* by Nancy Van Laan (Atheneum Books for Young Readers,
    1998). An adorable story with interesting language and lots of opportunities for
    children to join in on repeating phrases.

    +   - *All You Need for a Beach* by Alice Schertle (Silver Whistle/Harcourt, 2004).
    Beginning with one grain of sand, this beautifully illustrated book explores the
    seashore in a very entertaining way.

    +   - *I’m the Biggest Thing in the Ocean* by Kevin Sherry (Dial Books for Young
    Readers, 2007). This book not only is highly entertaining but also introduces
    a lot of sea creatures as well as the concepts of bigger and smaller.'
  - '[PAGE 176]


    # **Suggested Informational Title**


    *Sea Shapes* by Suse MacDonald (Harcourt Brace, 1994). Each page begins with a
    shape and then grows frame by frame into a seascape. The large, colorful illustrations
    are perfect for storytime.


    # **Fingerplay or Story**


    Down at the Seaside (chapter 4)


    # **Poem**


    “The Sea Is El Mar” by Jay M. Harris, in *The Moon Is La Luna: Silly Rhymes in
    English and Spanish* (Houghton Mifflin, 2007), unp.


    # **Flannelboard**


    Ocean Riddles (chapter 5)


    # **Interactive Game**


    Flashlight Vocabulary (chapter 6): Before the storytime starts, post photographs
    of different sea creatures around the room. Dim the lights, shine the flashlight
    on the creatures one by one, and engage the children in a discussion about each
    creature: “What is it?” “Where in the sea does it live?” “What does it eat?” “Have
    you ever seen one of these?” and so forth.


    # **Math Activity**


    Place flannel, paper, or plastic fish into a box or bag. Grab a fistful of fishes
    and ask the children to estimate how many fish you are holding. Count them one
    by one together out loud.


    # **Science Activities**


    Bring in seashells, sea stars, and the like for the children to examine and describe.


    Bring in a sample of freshwater and salt water for comparing and contrasting.


    # **Additional Fiction Titles**


    *Beach Day* by Karen Roosa (Greenwillow, 1990). Fun, rhyming text accompanies
    cute illustrations of families enjoying the seaside.


    *A Beach Day* by Douglas Florian (Greenwillow, 1990). The simplicity of the text
    (just one or two words per page) makes this a simple choice for preschool storytimes,
    but the illustrations are wonderful and most pages call for interaction or discussion
    or both.'
  - '[PAGE 177]


    *Beach Party!* by Harriet Ziefert (Blue Apple Books, 2005). This simple book shows
    how different beach creatures move. It would be ideal for a story-time in which
    everyone likes to move.


    *Bebé Goes to the Beach* by Susan Middleton Elya (Harcourt, 2008). Bebé returns
    in a romping trip to the beach. Fun!


    *Blue Sea* by Robert Kalan (Greenwillow, 1979). Children love the fish chasing
    and fish trapping in this simple book about life in the ocean.


    *The Deep Blue Sea* by Audrey Wood (Blue Sky Press, 2005). A wonderful cumulative
    story about the sea and colors. Children can fill in the color names as you read.


    *Fish Eyes: A Book You Can Count On* by Lois Ehlert (Harcourt Brace Jovanovich,
    1990). Very simple illustrations show many colorful fish in this simple counting
    book that begs for decorating paper fish following the storytime.


    *The Hidden Forest* by Jeannie Baker (Greenwillow, 2000). This fascinating story
    of a boy setting a fish trap will captivate children at storytime, as will the
    gorgeous illustrations.


    *Looking for Crabs* by Bruce Whatley (Angus and Robertson, 1993). A family searches
    for crabs on the beach. The illustrations are very amusing and beg for interaction
    from the children.


    *One Lonely Sea Horse* by Saxton Freymann (Arthur A. Levine Books, 2000). As in
    other books by Freymann, different sorts of food are used to create the characters.
    Children love identifying the foods, making this a very interactive read.


    *Ship Shapes* by Stella Blackstone (Barefoot Books, 2006). The vibrant quilted
    illustrations and the built-in interaction make this an excellent choice for storytime.


    # Additional Informational Titles


    *Hermit Crabs* by Lola M. Schaefer (Heinemann Library, 2002). Because each double-page
    spread begins with a question, this book just begs preschoolers to answer. The
    photographs are on the small side, but still wonderful.


    *Ocean Counting: Old Numbers* by Jerry Pallotta (Charlesbridge, 2005). The large
    illustrations will work nicely at storytime. Depending on the ages of your storytime
    attendees, you might be able to read this book all the way through, but it could
    also be used to highlight counting by odd numbers.


    *One Nighttime Sea* by Deborah Lee Rose (Scholastic, 2003). Large illustrations
    count many sea creatures that are awake when children are asleep.


    *Pattern Fish* by Trudy Harris (Millbrook Press, 2000). This wonderfully fun book
    is ideal for storytimes. The pattern is established on a double-page'
  - '[PAGE 178]


    spread featuring some sort of sea creature. The children are prompted to complete
    the pattern when that page is turned. Hilarious illustrations.


    *Senses at the Seaside* by Shelley Rotner (Millbrook Press, 2006). Large photographs,
    simple text, and the use of the senses to explore the beach make this an ideal
    choice for storytime.


    *Sorting at the Ocean* by Jennifer Rozines Roy (Marshall Cavendish Benchmark,
    2005). Excellent photographs of sets of things.


    *Star of the Sea: A Day in the Life of a Starfish* by Janet Halfmann (Christy
    Ottaviano Books, 2011). This book follows a sea star as she encounters many different
    creatures. Large and lovely illustrations would work well at storytime.


    *A Walk on the Beach* by Jo Waters (Raintree, 2006). A very simple book filled
    with photographs of objects one might find at the beach. Wonderful for reading
    all the way through at storytime.


    *Who Grows Up in the Ocean? A Book about Ocean Animals and Their Offspring* by
    Theresa Longenecker (Picture Window Books, 2003). Probably a bit long for reading
    in one sitting at storytime, but the large illustrations of one sea animal per
    double-page spread make this a nice choice for sharing in part.


    # ### Additional Poems


    “Home” by Jean Jazsi, in *Read-Aloud Rhymes for the Very Young*, edited by Jack
    Prelutsky (Knopf, 1986), p. 30.


    “Shell Song” by Nicola Davies, in *Outside Your Window: A First Book of Nature*
    (Candlewick, 2012), p. 46.


    “Shore” by Mary Britton Miller, in *Read-Aloud Rhymes for the Very Young*, edited
    by Jack Prelutsky (Knopf, 1986), 30.


    # ## Transportation


    # ### Suggested Fiction Titles


    *Mr. Gumpty''s Motor Car* by John Burningham (Macmillan, 1975). Every preschooler
    deserves to take a ride in Mr. Gumpty''s car.


    *Down by the Station* by Will Hillenbrand (Harcourt Brace, 1999). In this appealing
    version of the song, the little engine picks up baby animals from all over town
    (including the children) and drops them at the zoo.


    *The Bridge Is Up* by Babs Bell (HarperCollins, 2004). The repeating line in this
    fun book provides great interaction. The illustrations hold appeal for children.'
  - '[PAGE 179]


    <!-- no content -->'
  - '[PAGE 180]


    *Down by the Station* by Jennifer Riggs Vetter (Tricycle Press, 2009). This play
    on the old song features sweet illustrations and a plethora of modes of transportation.


    *Fast Food* by Saxton Freymann (Arthur A. Levine Books, 2006). The master of food
    manipulation provides a clever and hilarious look at transportation. Children
    will enjoy guessing the different food items.


    *Freight Train* by Donald Crews (Greenwillow, 1978). This simple book combines
    colors, train cars, and great vocabulary. A must-read for all ages.


    *Goodnight, Goodnight, Construction Site* by Sherri Duskey Rinker and Tom Lichtenheld
    (Chronicle Books, 2011). A rhyming story about construction vehicles getting ready
    for “bed.”


    *Honk Honk! Beep Beep!* by Daniel Kirk (Disney/Hyperion Books, 2010). A rhyming
    story with a repeating refrain and large, adorable, Lego-like illustrations.


    *Hush Little Digger* by Ellen Olson-Brown (Tricycle Press, 2006). This funny retake
    on the mockingbird song features many different working vehicles.


    *I’m Fast!* by Kate McMullen (Balzer and Bray, 2012). Children will thrill at
    the race between the car and the train. And everyone will love the playful vocabulary.


    *I’ve Been Working on the Railroad*, edited by Ann Owen (Picture Window Books,
    2003). An interesting introduction and the use of just one verse make this a nice
    addition to storytimes with a wide age range among attendees.


    *It’s Funny Where Ben’s Train Takes Him* by Robert Burleigh (Orchard Books, 1999).
    A rhyming story about a young boy and the train adventures that he creates for
    himself. The repeating line will help involve the children in telling the story.


    *Machines Go to Work* by William Low (Henry Holt, 2009). Every other page poses
    a question about some form of transportation or another, making this a highly
    interactive and nicely illustrated storytime book.


    *Tugga-Tugga Tugboat* by Kevin Lewis (Hyperion Books for Children, 2006). Tugboats
    are almost as interesting as dinosaurs, so this vivid book with its bright illustrations
    will appeal to children at storytime.


    *What Do Wheels Do All Day?* by April Jones Prince (Houghton Mifflin, 2006). The
    large format, simple rhyming text, and vivid cut-paper illustrations make this
    a winner.


    # **Additional Informational Titles**


    *Airport* by Byron Barton (Crowell Junior Books, 1982). The spare text and the
    folksy illustrations make this an excellent choice for storytime.'
