  - '[PAGE 132]


    # Let''s Get Cooking!


    # Animals


    # Suggested Fiction Titles


    As previously mentioned, the longest story is first, followed by a wonderful interactive
    title, with the third title finishing the storytime on a humorous note.


    *The Three Billy Goats Gruff* by Paul Galdone (Seabury Press, 1973). A superb
    retelling of the folktale with folksy yet evocative illustrations.


    *I Spy with My Little Eye* by Edward Gibbs (Templar Books/Candlewick, 2011). The
    die-cut pages of this book pose questions for the children to answer about real
    animals. A gem.


    *Animals Should Definitely Not Wear Clothing* by Judi Barrett (Atheneum, 1970).
    A classic children''s book showing many animals and why articles of clothing don''t
    really work for them.


    # Suggested Informational Title


    *Who Has These Feet?* by Laura Hulbert (Henry Holt, 2011). This vibrant book shows
    a pair of feet across a two-page spread and then the animal to which the feet
    belong on the next two-page spread. Simple text and embedded interaction make
    this a storytime must!


    # Fingerplay or Action Verse


    +   - Walking through the Forest (chapter 4)

    +   - Zoo Who? (chapter 4)


    # Poem


    > “The Panther” by Ogden Nash, in *Custard and Company: Poems by Ogden Nash*,
    selected by Quentin Blake (Little, Brown, 1980), p. 29.


    # Interactive Game


    Birds and Insects (chapter 6)


    # Math Activity


    Large and Small Chart (chapter 7)'
  - '[PAGE 133]


    # Science Activity


    Animals Near and Far (chapter 8)


    # Additional Fiction Titles


    *All God''s Critters* by Bill Staines (Simon and Schuster Books for Young Readers,
    2009). Even though this might be seen as a religious song, Kadir Nelson''s illustrations
    are too fabulous to go without mention. At least put it out for checkout!


    *Animals Aboard* by Andrew Fusek Peters (Frances Lincoln, 2007). A rhythmic, rhyming
    song of a book featuring farm animals boarding a train.


    *The Baby BeeBee Bird* by Diane Redfield Massie (HarperCollins, 2000). Preschoolers
    will laugh at the frustration of the zoo animals when the new birdie prevents
    them from getting their sleep.


    *Big, Bigger, Biggest!* by Nancy Coffelt (Henry Holt, 2009). This animal book
    compares animals by differing attributes and introduces fantastic vocabulary words.


    *Circus Shapes* by Stuart J. Murphy (HarperCollins, 1998). This wonderful rhyming
    book features animals and shapes in the context of a circus performance. Great
    for prompting a discussion about shapes.


    *Dear Zoo* by Rod Campbell (Little Simon, 1983). Children enjoy the many “wrong”
    pets sent to the little boy who is searching for the perfect pet.


    *Do Monkeys Tweet?* by Melanie Walsh (Houghton Mifflin, 1997). Children will enjoy
    this simple book of silly questions.


    *From Head to Toe* by Eric Carle (HarperCollins, 1997). This beauty from the master
    encourages children to move like the animals in the illustrations. Great for active
    storytimes.


    *Going to the Zoo* by Tom Paxton (Morrow Junior Books, 1996). This wonderful book
    encourages the children to imitate all the animals at the zoo. And it can be sung!


    *Hug* by Jez Alborough (Candlewick, 2000). Essentially one word repeated with
    increasing emotion makes this a fun choice for dramatic librarians!


    *I Am Small* by Emma Dodd (Scholastic, 2010). A wee penguin enjoys being small
    because the love his parents feel for him is large. This is a smallish book in
    format, but the illustrations are vivid and nice for storytime, and children will
    enjoy the repeating text.


    *I Can Help* by David Hyde Costello (Farrar, Straus and Giroux, 2010). Empathy
    and helping are beautifully illustrated in this circular story with bright, colorful
    illustrations.


    *If You See a Kitten* by John Butler (Peachtree, 2002). Adorable illustrations
    pair animals with sounds that we might utter if we were to encounter them.'
  - '[PAGE 134]


    *If You Were a Penguin* by Wendell and Florence Minor (Katherine Tegen Books,
    2009). Fun, rhyming text and oversized illustrations portray many aspects of penguins.


    *If You''re Hoppy* by April Pulley Sayre (Greenwillow, 2011). This retelling of
    the ubiquitous song has great illustrations and fun information and is a blast
    to sing at storytime.


    *Leo the Late Bloomer* by Robert Kraus (Windmill Books, 1971). Leo''s father worries
    as Leo takes his time growing up. This is a lovely book about patience and allowing
    children time to grow.


    *My Heart Is Like a Zoo* by Michael Hall (Greenwillow, 2010). A variety of adjectives
    describe animals that are made from heart shapes. This book begs for an accompanying
    art activity.


    *The Seals on the Bus* by Len? Hort (Henry Holt, 2000). A hilarious send-up of
    the “Wheels on the Bus” song. This one will have everyone at storytime laughing!


    *Slowly, Slowly, Slowly Said the Sloth* by Eric Carle (Philomel Books, 2002).
    A simple book that not only captures the attributes of a sloth but has wonderful
    vocabulary, a lesson about staying true to your nature, and Carle’s signature
    vibrant illustrations.


    *Two at the Zoo* by Danna Smith (Clarion Books, 2009). The counting stops at ten
    but the illustrations are big and bold and the rhyme will prompt children to do
    the counting.


    *When the Elephant Walks* by Keiko Kasza (Putnam, 1990). A circular story in which
    different animals react to one another. The illustrations are simple and are surrounded
    by lots of white space.


    *Who Hops?* by Katie Davis (Harcourt Brace, 1998). The built-in questions, vibrant
    illustrations, and silly humor make this a fun storytime book.


    *Who? Who?* by David Carter (Little Simon, 2007). The die-cut illustrations and
    interactivity built into this book make it a nice choice for smaller storytimes
    during which everyone can see the pages clearly.


    # Additional Informational Titles


    *About Books* by Cathryn Sill (Peachtree, 2003). Excellent, informative text and
    great illustrations make these books wonderful to read all the way through at
    storytime. There are many opportunities for interchange as well. The series includes
    penguins, rodents, mammals, birds, crustaceans, reptiles, and fish. Sill also
    has a series on habitats.


    *Animal Babies in Grasslands* by Jennifer Schofield (Kingfisher, 2004). An excellent
    book for preschool storytimes because the photographs are vivid and every other
    page poses a question about who the pictured animal''s'
  - '[PAGE 135]


    mother might be. Schofield also uses the same format in a book featuring animal
    babies in many different climes.


    *Animals* by Peter Riley (Gareth Stevens, 2004). Though this book may offer too
    much information in its entirety for preschoolers, sharing one full page at storytime
    would work beautifully. Riley covers mammals, insects, amphibians, reptiles, birds,
    and other creatures.


    *Hair* by Nicola Whittaker (Gareth Stevens, 2002). The entertaining photographs
    and accessible text make this a great choice for reading in its entirety at storytimes.


    *Just One Bite* by Lola Schaefer (Chronicle Books, 2010). An oversized picture
    book featuring the different foods animals eat.


    *Life-Size Zoo: From Tiny Rodents to Gigantic Elephants, an Actual-Size Animal
    Encyclopedia* by Teruyuki Komiya (Seven Footer Kids, 2009). This book tours the
    zoo, showing photographs of animals life-size. A crowd-pleaser.


    *Swirl by Swirl: Spirals in Nature* by Joyce Sidman (Houghton Mifflin Harcourt,
    2011). Gorgeous words and simple text make this an excellent story-time book with
    many discussion possibilities.


    *Tender Moments in the Wild: Animals and Their Babies* (Moonstone Press, 2001).
    The two-page photo spreads in this sweet book will work even for large storytimes.
    Very simple text and the gentle subject matter make this a comforting read.


    *Zoo Pairs* by Patricia Whitehouse (Heinemann Library, 2002). This excellent book
    examines the concept of pairs. The photographs of animals and the easy text make
    this a nice choice for storytimes.


    # ### Additional Poems


    +   - “Baby Birds” by Nicola Davies, in *Outside Your Window: A First Book of
    Nature* (Candlewick, 2012), p. 36.

    +   - “The Elephant” by Louis Phillips, in *A Zooful of Animals*, selected by
    William Cole (Houghton Mifflin, 1992), p. 18.

    +   - “Giraffes Don’t Huff” by Karla Kuskin, in *Read-Aloud Rhymes for the Very
    Young*, edited by Jack Prelutsky (Knopf, 1986), p. 58.

    +   - “Polar Bear” by Gail Kredenser, in *Read-Aloud Rhymes for the Very Young*,
    edited by Jack Prelutsky (Knopf, 1986), p. 10.

    +   - “Red-Winged Blackbird” by Grace Taber Hallock, in *The 20th Century Children’s
    Poetry Treasury*, edited by Jack Prelutsky (Knopf, 1999), p. 37.

    +   - “Wild Beasts” by Evaleen Stein, in *Read-Aloud Rhymes for the Very Young*,
    edited by Jack Prelutsky (Knopf, 1986), p. 16.'
