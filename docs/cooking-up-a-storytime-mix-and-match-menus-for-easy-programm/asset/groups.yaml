    ## Me!


    ### Suggested Fiction Titles


    *Children Make Terrible Pets* by Peter Brown (Little, Brown, 2010). Amusing illustrations
    and a tongue-in-cheek story make this an entertaining choice for storytime.


    *Someone Bigger* by Jonathan Emmett (Clarion Books, 2004). Great illustrations
    and rhyming text, plus the fact that the small child solves the problem, make
    this a favorite.


    *Jazz Baby* by Carole Boston Weatherford (Lee and Low Books, 2002). This riffing,
    rhyming, romp of a book will delight preschoolers and get all toes tapping. It
    is small in format, but the illustrations are large enough for many storytime
    groups.


    ### Suggested Informational Title


    *We Are All Alike . . . We Are All Different* by the Cheltenham Elementary School
    Kindergartners (Scholastic, 1991). This wonderfully interactive book of photographs
    and illustrations looks at the many ways we are alike and different.


    ### Fingerplay or Story


    Action Words (chapter 4)


    ### Poem: “Something About Me”


    (Anonymous)


    There’s something about me

    That I’m knowing,

    There’s something about me

    That isn’t showing,

    I’m growing!


    *How Do You Wokka-Wokka?* by Elizabeth Bluemle (Candlewick, 2009). Filled with
    rhythmic language, this simple book makes a fun addition to preschool storytimes.


    *I Ain''t Gonna Paint No More* by Karen Beaumont (Harcourt, 2005). Not only does
    this book have a repeating line for audience participation, but it also is filled
    with rhyming completion prompts!


    *If You''re Happy and You Know It* by Anna McQuinn (Barefoot Books, 2009). Wonderfully
    illustrated version of the song with many different movement prompts for a wiggling
    storytime!


    *If You''re Happy and You Know It* by Jane Cabrera (Holiday House, 2005). The
    large and vibrant illustrations stand out in this version of the popular song.


    *I''m a Jolly Farmer* by Julie Lacome (Candlewick, 1994). A little girl imagines
    becoming different people, real and fictional.


    *A Letter to Amy* by Ezra Jack Keats (Harper and Row, 1968). This classic book
    features an alluring story and wonderful illustrations. It also could serve as
    an excellent springboard for a writing activity, a discussion about friends and
    feelings, or both.


    *My Name Is Elizabeth* by Annika Dunklee (Kids Can Press, 2011). The young girl''s
    demands that people address her by her full name and not a nickname make this
    a funny and familiar story.


    *No, David!* by David Shannon (Blue Sky Press, 1998). The simple text and familiar
    situations plus the oversize and evocative illustrations will make this a popular
    book at storytimes.


    *These Hands* by Hope Lynn Price (Hyperion Books for Children/Jump at the Sun,
    1999). A simple rhyming book about the many things that hands can do. Large, lovely
    illustrations are perfect for storytime.


    *Where Does It Go?* by Margaret Miller (Greenwillow, 1992). The silliness of the
    photographs in this book will hold great appeal and perhaps spark discussion.


    *Whoever You Are* by Mem Fox (Harcourt Brace, 1997). Excellent storytime book
    with colorful multicultural illustrations and a simple rhyme with a unifying theme.


    ### Additional Informational Titles


    *Guess Whose Shadow?* by Stephen R. Swinburne (Boyds Mills Press, 1999). Children
    will love the photographs of all sorts of shadows and the shadow guessing game
    in the middle of the book. This is a perfect nonfiction title to read all the
    way through at storytime.


    *My Five Senses* by Margaret Miller (Simon and Schuster Books for Young Readers,
    1994). Very simple text, wonderful photographs, and lots of possibilities for
    interaction make this an ideal storytime book.


    *To Be a Kid* by Maya Ajmera (Charlesbridge, 1999). The large photographs of children
    all over the world doing what kids do, plus the simple text, make this a book
    perfect for reading at storytimes. Each page could spark interesting interaction.


    *What Is Touch?* by Jennifer Boothroyd (Lerner, 2010). Excellent photographs and
    simple text help fuel the discussion examining our sense of touch. (This is part
    of a wonderful series by Jennifer Boothroyd called *Your Amazing Senses*.)


