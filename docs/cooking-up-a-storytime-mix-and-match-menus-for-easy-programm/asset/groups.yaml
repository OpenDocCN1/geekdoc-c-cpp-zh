    # Cats


    # Suggested Fiction Titles


    *Fat Cat: A Danish Folktale* by Margaret Read MacDonald (August House Littlefolk,
    2001). MacDonald''s charming retelling features memorable repetition, great vocabulary,
    and an appealing story.


    *Kitten''s First Full Moon* by Kevin Henkes (Greenwillow, 2004). This Caldecott
    winner also works beautifully as a storytime book.


    *What Will Fat Cat Sit On?* by Jan Thomas (Harcourt, 2007). Large, cartoony illustrations
    and a funny, repetitive story make this a winning addition to storytimes.


    # Suggested Informational Title


    *Guess Who Purrs?* by Dana Meachen Rau (Marshall Cavendish Benchmark, 2009). Children
    will answer the question the book poses on the first page, but the photographs
    are wonderful and the bilingual text makes it an interesting choice for groups
    with Spanish-speaking attendees.


    # Fingerplay or Story


    My Little Kitty (chapter 4)


    # Poem


    “Flaco Means Skinny” by Jay M. Harris, in *The Moon Is La Luna: Silly Rhymes in
    English and Spanish* (Houghton Mifflin, 2007), unp.


    # Flannelboard


    The Rat, the Gnat, and the Fine, Fat Cat (chapter 5)


    # Interactive Game


    Microphone (chapter 6): Describe your pet cat if you have one or an experience
    that you have had with a cat or cats. Passing the microphone around, or holding
    it in front of children who wish to contribute, encourage them to share something
    they know about cats. Or describe something that you like about cats. Ask the
    children to take a minute to think of something that they like about cats.


    # Math Activity


    Print pictures of cats and tape them (or place stuffed animal cats!) around your
    story room. At the chosen moment in your storytime, ask the children if they noticed
    that there are lots of cats in the room and tell them you want their help to'
