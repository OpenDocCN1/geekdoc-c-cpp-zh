    # ## Intentionality


    One term that surfaces repeatedly in early learning circles is *intentionality*.
    Teachers of young children are being encouraged to think deeply about their students’
    learning. They are urged to be very intentional: set broad goals, stay alert for
    learning opportunities, introduce concepts, follow the children’s lead, observe
    results, and then evaluate what sort of learning occurred and how they might build
    and enrich that learning. This seems an excellent light in which to examine our
