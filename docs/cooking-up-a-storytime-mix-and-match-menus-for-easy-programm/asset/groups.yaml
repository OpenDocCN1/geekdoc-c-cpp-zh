    \ by Laura Vaccaro Seeger (Roaring Brook Press, 2007). Use this book to talk about\
    \ the concept first . . . and then . . . and then. Relate it to an activity or\
    \ event for the day (for example, “First we sing a welcome song and then we read\
    \ a book and then . . .”) and let the children fill in the blanks. This is a great\
    \ activity for developing vocabulary and narrative skills as well as early math\
    \ skills.\n- *A Hat for Minerva Louise* by Janet Stoeke (Dutton Children’s Books,\
    \ 1994). This classic about a somewhat clueless hen has many dialogic reading\
    \ prompts embedded in the story.\n- *Hello, Day!* by Anita Lobel (Greenwillow,\
    \ 2008). Beautiful illustrations introduce the animals on the farm. This is a\
    \ great book for those who enjoy making animal sounds.\n- *Hurry! Hurry!* by Eve\
    \ Bunting (Harcourt, 2007). This very simple book introduces some excellent vocabulary\
    \ as well as many farm animals. The loving ending makes this a nice book for young\
    \ listeners.\n- *Los Pollitos Dicen / The Baby Chicks Sing* by Nancy Abraham Hall\
    \ (Little, Brown, 1994). Choose one of the singing rhymes to share from this wonderful\
    \ book.\n- *Mary Had a Little Lamb* by Sarah Hale, illustrated by Tomie dePaola\
    \ (Holiday House, 1984). The adorable illustrations make this a nice choice for\
    \ sharing.\n- *One Red Rooster* by Kathleen Sullivan Carroll (Houghton Mifflin,\
    \ 1992). It counts, it rhymes, it has lovely illustrations—this book has something\
    \ for everyone.\n- *One Windy Wednesday* by Phyllis Root (Candlewick, 1996). This\
    \ book’s small format might make it challenging for large groups, but the amusing\
    \ story has too much child appeal to pass up!\n- *The Piggy in the Puddle* by\
    \ Charlotte Pomerantz (Macmillan, 1974). One of the most challenging and hilarious\
    \ books to read aloud! If only it would be reissued in a larger format for storytimes.\
    \ A favorite!\n- *Rosie’s Walk* by Pat Hutchins (Simon and Schuster Books for\
    \ Young Readers, 1968). A classic about a busy hen and an unlucky fox.\n- *Silly\
    \ Little Goose* by Nancy Tafuri (Scholastic, 2001). Wonderful, large illustrations\
    \ and a repeating phrase make this a nice choice for a farm storytime.\n- *Summer\
    \ Sun Risin’* by N. Nikola-Lisa (Lee and Low Books, 2002). Rhyming poems on each\
    \ page follow a young farm boy from dawn to night on a hot summer day.\n- *Ten\
    \ Little Mice* by Joyce Dunbar (Harcourt Brace Jovanovich, 1990). The vividness\
    \ of the illustrations might inspire a nice discussion about mice in the wild\
    \ and on a farm. Plus, it contains counting backwards from ten.\n- *Who Took the\
    \ Farmer’s Hat?* by Joan L. Nodset (Harper and Row, 1963). This classic story\
    \ of the farmer questioning the many animals about the whereabouts of his favorite\
    \ hat is small in format but large in appeal.\n- *Who Wakes Rooster?* by Clare\
    \ Hodgson Meeker (Simon and Schuster Books for Young Readers, 1996). All ages\
    \ will enjoy the simple illustrations and the mystery behind everyone sleeping\
    \ late on the farm.\n\n### Additional Informational Titles\n\n- *Farms ABC: A\
    \ Counting Book* by B. A. Hoena (Capstone Press, 2005). Full-page photographs\
    \ star in this comprehensive look at farms.\n- *My First Farm Book*, edited by\
    \ Shaila Awan (Dorling Kindersley, 2000). Each double-page spread features photographs\
    \ of various aspects of farm life. Ideal for lap reading, but it could work at\
    \ storytimes piecemeal.\n\n### Additional Poems\n\n- “Cow” by Karla Kuskin, in\
    \ *Moon, Have You Met My Mother? The Collected Poems of Karla Kuskin* (Laura Geringer\
    \ Books, 2003), p. 102.\n- “The Cow” by Ogden Nash, in *Custard and Company: Poems\
    \ by Ogden Nash*, selected by Quentin Blake (Little, Brown, 1980), p. 72.\n- “Hen’s\
    \ Song” by Rose Fyleman, in *Mary Middling and Other Silly Folk: Nursery Rhymes\
    \ and Nonsense Poems* (Clarion Books, 2004), unp.\n- “Rabbit” by Rose Fyleman,\
    \ in *Mary Middling and Other Silly Folk: Nursery Rhymes and Nonsense Poems* (Clarion\
    \ Books, 2004), unp.\n"
  mdcn: "\n### 更多信息类图书\n\n- 黛比·贝利（Debbie Bailey）著*家庭*（Annick Press，1999）。这本可爱的书看起来很大，但分为几个部分：“我的妈妈”“我的爸爸”“兄弟”“姐妹”“爷爷”和“奶奶”。许多不同家庭参与各种不同活动的照片，使它成为一本至少适合分享部分内容的好书。\n\
    - 玛雅·阿杰梅拉（Maya Ajmera）著*我们的祖父母：全球相册*（Charlesbridge，2010）。来自世界各地的精美照片展示了儿童和他们的祖父母一起参与许多活动。\n\
    \n### 更多诗歌\n\n- 伯利·多尔蒂（Berlie Doherty）的“爷爷”，收录于简·约伦（Jane Yolen）编选的*这里有一首小诗*（Candlewick，2007），第39页。\n\
    - 兰斯顿·休斯（Langston Hughes）的“背背驮”，收录于简·约伦（Jane Yolen）编选的*这里有一首小诗*（Candlewick，2007），第30页。\n\
    \n## 农场\n\n### 建议虚构类图书\n\n- 马丁·沃德尔（Martin Waddell）著*农夫鸭*（Candlewick，1992）。孩子们喜欢这个有趣的故事：一只鸭子厌倦了替农夫干所有的活。\n\
    - 梅姆·福克斯（Mem Fox）著*哈蒂和狐狸*（Bradbury Press，1986）。母鸡对鼻子、眼睛、耳朵等的观察，以及其他农场动物反复做出的反应，很容易在故事时间吸引学龄前儿童的兴趣。\n\
    - 乔治·香农（George Shannon）著*踮脚小鸡，快跑！*（Greenwillow，2003）。这只智胜狗的小鸡，加上充满活力的插图，会让孩子们在这本专为朗读而作的书里感到快乐。\n\
    \n### 建议信息类图书\n\n- 谢莉·罗特纳（Shelley Rotner）著*农场里的感官*（Millbrook Press，2009）。对感官的关注使这本书成为故事时间非常值得记住的一本书。随附的照片棒极了。\n\
    \n### 手指游戏或故事\n\n- 农夫（第4章）\n- 参观农场（第4章）\n\n### 诗歌：“咯咯，咯咯” *(佚名)*\n\n咯咯，咯咯，咯咯，咯咯，\
    \  \n早上好，母鸡太太，  \n你有多少只小鸡？  \n夫人，我有十只。  \n其中四只是黄色，  \n四只是棕色，  \n还有两只是带斑点的红色， \
    \ \n是城里最漂亮的。\n\n### 互动游戏与活动\n\n复制农场动物的小照片，并在照片下方打上它们的名字。把照片分发出去，告诉孩子们他们是图书馆谷仓的一部分。当你举起手时，孩子们应该发出他们所属动物的叫声。当你放下手时，他们应该安静下来。\n\
    \n对于大型团体，展示农场动物的照片，让所有孩子一起模仿动物的叫声。\n\n### 数学活动\n\n使用卷尺向孩子们展示鸡的大致大小，并与牛的大致大小进行比较。引导孩子们讨论他们可能见过的鸡或牛。它们长什么样？叫起来什么样？闻起来什么样？你们还能估算其他哪些动物的大小？\n\
    \n### 科学活动\n\n带一个煮熟的鸡蛋来让孩子们触摸。引导他们讨论鸡和鸡蛋。如果有些孩子养鸡，鼓励他们描述他们的鸡长什么样、发出什么声音、下什么颜色的蛋等等。\n\
    \n### 更多虚构类图书\n\n- 丹尼斯·弗莱明（Denise Fleming）著*谷仓闲聊*（Henry Holt，1994）。一本极其简单的书，以农场动物和它们的叫声为特色。\n\
    - 露丝·布朗（Ruth Brown）著*大喷嚏*（Lothrop, Lee and Shepard，1985）。一本滑稽的书，讲述一只苍蝇让农夫打喷嚏后，农场里发生的一连串后果。\n\
    - 特蕾西·坎贝尔·皮尔逊（Tracey Campbell Pearson）著*鲍勃*（Farrar, Straus and Giroux，2002）。这个有趣的故事讲述一只公鸡寻找自己的叫声，加上大而鲜艳的插图，将使这本书成为故事时间的最爱。\n\
    - 保罗·加尔东（Paul Galdone）著*猫儿拉琴*（Clarion Books，1985）。这首古老的累积歌曲配有加尔东的精美插图，成为学龄前儿童的经典。\n\
    - 多琳·克罗宁（Doreen Cronin）著*咔嗒，咔嗒，哞：会打字的奶牛*（Simon and Schuster Books for Young Readers，2000）。这本非常有趣的书可能有点超出学龄前儿童的理解，但添加一个使用打字机的演示，或者在故事时间后放一台打字机供他们尝试，可能会是一项非常受欢迎的活动。\n\
    - 史蒂夫·拉维斯（Steve Lavis）著*喔喔喔：农场数数书*（Lodestar Books/Dutton，1997）。一本简单的数数书，有很多机会模仿农场动物的叫声。\n\
    - 伯纳德·莫斯特（Bernard Most）著*喔喔哞*（Harcourt Brace，1996）。这本书中动物叫声的滑稽混淆让孩子们笑个不停。而且它朗读起来非常有趣！\n\
    - 大卫·香农（David Shannon）著*鸭子骑自行车*（Blue Sky Press，2002）。孩子们会喜欢鸭子的胆大，以及所有动物骑自行车的荒诞。大插图和高超的幽默。\n\
    - 劳拉·瓦卡罗·西格（Laura Vaccaro Seeger）著*先有蛋*（Roaring Brook Press，2007）。用这本书来讨论“先……然后……然后……”的概念。把它与当天的活动或事件联系起来（例如，“我们先唱一首欢迎歌，然后读一本书，然后……”），让孩子们填空。这是一个很好的活动，可以发展词汇和叙事技能以及早期数学技能。\n\
    - 珍妮特·斯托克（Janet Stoeke）著*米纳瓦·路易丝的帽子*（Dutton Children’s Books，1994）。这个关于一只有点糊涂的母鸡的经典故事，在故事中嵌入了许多对话式阅读提示。\n\
    - 安妮塔·洛贝尔（Anita Lobel）著*你好，白天！*（Greenwillow，2008）。精美的插图介绍了农场里的动物。对于喜欢模仿动物叫声的人来说，这是一本很棒的书。\n\
    - 伊芙·邦廷（Eve Bunting）著*快！快！*（Harcourt，2007）。这本非常简单的书介绍了一些极好的词汇以及许多农场动物。充满爱的结尾使这本书成为适合年幼听众的好书。\n\
    - 南希·亚伯拉罕·霍尔（Nancy Abraham Hall）著*小鸡们叫 / 小鸡们唱歌*（Little, Brown，1994）。从这本精彩的书中选择一首歌唱童谣来分享。\n\
    - 莎拉·黑尔（Sarah Hale）著，汤米·德保拉（Tomie dePaola）绘*玛丽有只小羊羔*（Holiday House，1984）。可爱的插图使这本书成为分享的好选择。\n\
    - 凯瑟琳·沙利文·卡罗尔（Kathleen Sullivan Carroll）著*一只红公鸡*（Houghton Mifflin，1992）。它数数，它押韵，它有可爱的插图——这本书适合每个人。\n\
    - 菲利斯·鲁特（Phyllis Root）著*一个刮风的星期三*（Candlewick，1996）。这本书的小开本可能对大型团体来说有挑战性，但这个有趣的故事对孩子的吸引力太大，不容错过！\n\
    - 夏洛特·波梅兰茨（Charlotte Pomerantz）著*泥坑里的小猪*（Macmillan，1974）。这是朗读起来最具挑战性、最滑稽的书之一！要是它能以更大的开本重新出版，用于故事时间就好了。最爱！\n\
    - 帕特·哈钦斯（Pat Hutchins）著*萝西散步*（Simon and Schuster Books for Young Readers，1968）。一个关于忙碌母鸡和倒霉狐狸的经典故事。\n\
    - 南希·塔富里（Nancy Tafuri）著*傻乎乎的小鹅*（Scholastic，2001）。精美的巨大插图和重复的短语使这本书成为农场故事时间的好选择。\n\
    - N. 尼古拉-丽莎（N. Nikola-Lisa）著*夏日太阳升起*（Lee and Low Books，2002）。每一页上的押韵诗跟随一个农场小男孩，在一个炎热的夏日从黎明到夜晚。\n\
    - 乔伊斯·邓巴（Joyce Dunbar）著*十只小老鼠*（Harcourt Brace Jovanovich，1990）。插图的生动性可能会引发一场关于野生老鼠和农场老鼠的愉快讨论。此外，它还包含从十倒数。\n\
    - 琼·L. 诺德塞特（Joan L. Nodset）著*谁拿走了农夫的帽子？*（Harper and Row，1963）。这个经典故事讲述农夫询问许多动物他最心爱的帽子在哪里，开本虽小，吸引力却很大。\n\
    - 克莱尔·霍奇森·米克（Clare Hodgson Meeker）著*谁叫醒公鸡？*（Simon and Schuster Books for Young\
    \ Readers，1996）。所有年龄段的人都会喜欢这些简单的插图，以及农场里大家都睡懒觉背后的谜团。\n\n### 更多信息类图书\n\n- B. A.\
    \ 霍纳（B. A. Hoena）著*农场ABC：数数书*（Capstone Press，2005）。整页照片在这本全面介绍农场的书中唱主角。\n- 莎伊拉·阿万（Shaila\
    \ Awan）编*我的第一本农场书*（Dorling Kindersley，2000）。每个跨页都展示了农场生活各个方面的照片。非常适合亲子共读，但也可以分部分用于故事时间。\n\
    \n### 更多诗歌\n\n- 卡拉·库斯金（Karla Kuskin）的“奶牛”，收录于*月亮，你见过我妈妈吗？卡拉·库斯金诗集*（Laura Geringer\
    \ Books，2003），第102页。\n- 奥格登·纳什（Ogden Nash）的“奶牛”，收录于*卡斯塔德和公司：奥格登·纳什诗集*，昆汀·布莱克（Quentin\
    \ Blake）编选（Little, Brown，1980），第72页。\n- 罗斯·法伊尔曼（Rose Fyleman）的“母鸡之歌”，收录于*玛丽·米德林和其他傻气的人们：童谣与荒诞诗*（Clarion\
    \ Books，2004），无页码。\n- 罗斯·法伊尔曼（Rose Fyleman）的“兔子”，收录于*玛丽·米德林和其他傻气的人们：童谣与荒诞诗*（Clarion\
    \ Books，2004），无页码。\n"
