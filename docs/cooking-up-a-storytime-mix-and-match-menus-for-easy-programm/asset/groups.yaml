    mentioned earlier. You can say, “Let’s talk about what happened in that story.”
    Then, remembering that it takes children time to process and formulate their thoughts,
    allow them to ponder. If responses are still not forthcoming, open the book and
    allow the illustrations to spur their memories. (After all, it’s *their* skills
