    ## CONCEPT FLANNELBOARDS


    The following flannelboards help develop many different conceptual skills.


    ### Bubbles


    This is an easy flannelboard song/chant that can be used to focus on counting
    or color vocabulary.


    I blew one big bubble, (put a bubble on the flannelboard)

    I blew one big bubble,

    I blew one big bubble,

    I hope that it won''t pop! (clap once)

    Pop! (clap once)

    Pop! (clap once)

    I hope that it won''t pop! (clap once)


    I blew two big bubbles, (put another bubble on the flannelboard)

    I blew two big bubbles,

    I blew two big bubbles,

    I hope that they won''t pop! (clap twice)

    Pop! (clap twice)

    Pop! (clap twice)

    I hope that they won''t pop! (clap twice)


    (Keep adding bubbles and counting their pops until you run out of bubbles or the
    children grow weary of counting!)


    ![](img/726487289a66f26aae16af221d544409_85_0.png)


    **Supplies**


    - felt in one color

    - scissors


    **Directions**


    Download patterns 5.15 through 5.17 from alaeditions.org/webextras. Create all
    the bubbles in the same color to clarify the activity for the children. Preschoolers
    are generally only able to focus on one attribute at a time, and creating bubbles
    in different colors might make the activity confusing.


    ### Bubbles (Color Alternative)


    - I blew one big bubble, *(put a bubble on the flannelboard)*

    - I blew one big bubble,

    - I liked the color of this bubble,

    - It was _____. *(encourage children to name the color of the bubble)*

    - I blew two big bubbles, *(put another bubble on the flannelboard)*

    - I blew two big bubbles,

    - I liked the color of these bubbles,

    - They were ____ and _____. *(continue adding bubbles and naming their colors)*


    **Supplies**


    - felt in many colors

    - scissors


    **Directions**


    Create the bubbles in many different colors, but choose only one size for them
    all.


    ### Shapes and Colors


    Cut out different shapes for the flannelboard. Most preschool children can only
    focus on one attribute at once, so either put up one shape in many colors (for
    example, circles in many colors) so you can talk about color, or many shapes in
    one color (for example, many red shapes) so you can talk about shape. This can
    also be a wonderful opportunity to develop vocabulary in different languages.


    | Common Shapes in Spanish | Common Colors in Spanish |

    | --- | --- |

    | heart — un corazón | red — rojo |

    | square — un cuadrado | blue — azul |

    | circle — un círculo | green — verde |

    | rectangle — un rectángulo | white — blanco |

    | oval — un óvalo | orange — anaranjado |

    | cube — un cubo | purple — morado |

    | pentagon — un pentágono | yellow — amarillo |

    | triangle — un triángulo | brown — café |

    |  | black — negro |

    |  | gray — gris |


    ### Counting Sheep


    Here''s a little woolly sheep


    *(hold up the sheep in your hand that is opposite the flannelboard)*


    Who wants to say good night.

    Count her leaping over


    (*leap* the sheep over yourself and place her on the flannelboard)


    To help us sleep tight.

    ONE!

    How many sheep do you see?

    You''re right, just one!


    ![](img/726487289a66f26aae16af221d544409_88_0.png)


    Here''s another woolly sheep

    Who wants to say good night.

    Count him leaping over

    To help us sleep tight.

    TWO! *(place the second sheep on the flannelboard next to the first sheep)*

    How many sheep are there now?

    Let''s count them together.

    One, two.

    How many?


    *(Encourage the children to count out loud as you point to each sheep. Each time
    you finish counting sheep on the board, ask the children, “How many?” This approach
    helps the children to understand cardinal numbers—the numbers that stand for how
    many items they see at once.)*


    ### Subitizing Leaves


    This flannelboard gives the children practice subitizing without counting. Young
    children will have better success at subitizing if the number of items is six
    or fewer. (To work on counting higher than ten, make many more flannelboard pieces.)


    ![](img/726487289a66f26aae16af221d544409_88_1.png)


    One little leaf in the autumn,

    Fallen from the tree.

    One little leaf in the autumn.

    How many do we see?


    *(Count the leaf and then ask, “How many?”)*


    Another leaf in autumn,

    Fallen from the tree.

    Another leaf in autumn.

    How many do we see?


    *(Count the leaves and then ask, “How many?” Continue to add up to six leaves.)*


    ### Subitizing Snowmen


    Here’s another flannelboard to help children practice subitizing.


    ![](img/726487289a66f26aae16af221d544409_89_0.png)


    Here’s a snowman standing tall.

    Can we count him, one and all?


    *(Count the snowman and then ask, “How many?”)*


    Another snowman standing tall.

    Can we count them, one and all?


    *(Count the snowmen and then ask, “How many?” Add up to six snowmen.)*


    ## FLANNELBOARD IDEAS WITHOUT A STORY


    Using open-ended flannelboards—those not necessarily tied to a story—allows the
    children to do the work. When we simply put a piece on the flannelboard and ask
    "What''s this?" we are encouraging children to ponder, recall, and articulate
    an answer, all of which involves a whole lot more skill building than just watching
    and listening! Following are some ideas for open-ended flannelboard figures. The
    flannelboard patterns and ideas presented here were created to maximize interaction
    and conversation, while focusing on development of various skills.


    ### Family


    This flannelboard can be used at storytimes as a vocabulary builder for the names
    of family members in English and other languages as befits your community. Download
    patterns 5.22 through 5.28 from alaeditions.org/webextras. The father and mother
    figures can become aunts and uncles, the brother and sister figures can become
    cousins or stepbrothers and stepsisters, and so on. You may use them with the
    rhyme "Who Is in a Family?" (see chapter 4) or on their own as prompts to talk
    about different types of families. They are designed to stand beside one another
    holding hands.


    ![](img/726487289a66f26aae16af221d544409_90_0.png)


    ![](img/726487289a66f26aae16af221d544409_90_1.png)


    ![](img/726487289a66f26aae16af221d544409_90_2.png)


    ![](img/726487289a66f26aae16af221d544409_90_3.png)


    ![](img/726487289a66f26aae16af221d544409_90_4.png)


    ![](img/726487289a66f26aae16af221d544409_90_5.png)


    ![](img/726487289a66f26aae16af221d544409_90_6.png)


    ![](img/726487289a66f26aae16af221d544409_90_7.png)


    ### Ladybug under the Flower


    This flannelboard was inspired by the popularity of “Little Mouse, Little Mouse,
    are you in the ____ house?” If you are unfamiliar with that flannelboard story,
    it involves having houses of many colors on the flannelboard with a small mouse
    hidden behind one house. The storyteller repeats the rhyme, and the children call
    out the color of the house to pull off the flannelboard in search of the hidden
    mouse. Children love playing this sort of hidden object game. But in an effort
    to encourage even more dialogue, using more complex objects means the children
    must use words more descriptive than just a color name to identify the object
    they wish removed. This increased dialogue builds vocabulary and incorporates
    social and emotional skill building, as the children must take turns describing
    which item to remove.


    Download patterns 5.29 through 5.37 from alaeditions.org/webextras. Place all
    the flowers on the board with the ladybug hidden beneath one. Tell the children
    that the ladybug is hiding behind a flower and ask where they think she is hiding.
    Let the children choose which flower to remove first, second, third, and so on.


