    # Games


    ![](img/726487289a66f26aae16af221d544409_96_1.png)


    PLAYING GAMES AT STORYTIME ALLOWS US TO INTRODUCE THE ALPHABET, math concepts,
    science concepts, real-world information, language play, print awareness, phonological
    awareness, vocabulary—a wealth of possibilities. Plus, games are fun! Games can
    also help children build many social and emotional skills: taking turns, waiting
    for a turn, focusing, communicating, troubleshooting, and the like. The following
    games are meant as a starting point. Build, change, and morph them into games
    suited to your audience and size of storytime.


    # Alphabet Hunt


    *Supplies*


    +   - alphabet banner

    +   - individual letters of the alphabet (preferably identical in font and color
    to the letters on the banner)

    +   - bag or box to hold the letters


    *Directions*


    Post the alphabet banner in the room or post individual letters around the room.
    (Create letters large enough for all the children to see at storytime.) Print
    a second set for yourself (these could be smaller, but in a font and color that
    match the larger corresponding letters). Put all the smaller letters in a bag
    and slap your hand on your thigh as you chant this rhyme:'
  - '[PAGE 97]


    Hunt, hunt,

    An alphabet hunt,

    We''re going on an alphabet hunt.

    The letter ______(pull a letter from the bag and call out its name)

    Is hiding its face.

    Let''s go find its hiding place!


    (Holding up the letter for all to see, choose a child to locate the letter on
    the banner or in the room.)


    # **Birds and Insects**


    *Supplies*


    +   - photographs of a variety of birds

    +   - photographs of a variety of insects


    *Directions*


    Play “Is it a bird, or is it an insect?” Prior to playing the game, engage the
    children in a discussion of the differences between birds and insects: two legs/six
    legs, feathers/ no feathers, and so on. Hold up one photograph at a time and ask
    if it’s a bird or an insect. If your group is small enough, engage the children
    in a discussion about whether they have seen any of these birds or insects before.


    # **Categories**


    *Supplies*


    +   - category names printed on paper

    +   - small box or bag


    *Directions*


    Place all the category names into a bag or a box and tell the children that you
    are going to ask them to think very hard. Tell them that you will pull out a category,
    which is a wonderful word for “a group of things,” and that when you announce
    the category, you want them to name things that belong in that category.


    *Category Names*


    +   - Colors

    +   - Kinds of Pets

    +   - Pieces of Clothing

    +   - Animals

    +   - Fun Places to Visit

    +   - Kinds of Weather

    +   - Modes of Transportation

    +   - Family Members

    +   - Community Helpers'
  - '[PAGE 98]


    # Color Cards


    *Supplies*


    +   - color cards—all uppercase names of colors printed in color (for example,
    "GREEN" printed or written in green)


    *Directions*


    Explain to the children that you are tired of reading and now it is their turn!
    Tell them you are going to show them some color names and you want them to read
    the names out loud for you. (Children catch on very quickly that the name is written
    in the color.) After they have correctly named the color, read each letter aloud
    and then say the color name again. Celebrate the fact that the children are such
    good "readers."


    # Emotion Vocabulary


    Giving names to emotions helps young children manage them in a healthy way. In
    this game, you begin with more common words for emotions: happy, sad, angry, scared,
    and so on. Engage the children in a discussion about what these emotions look
    like. When a person is happy, how does her face look? What about when she is sad?
    Continue asking similar questions about other emotions. Once you have moved through
    the familiar emotions, talk about less familiar emotions—frustrated, surprised,
    tense, and so forth. What do those feelings look like? Recall a time you felt
    frustrated or surprised or tense and tell the children what made you feel that
    way and, perhaps, what you did to mediate it.


    Another approach is to talk about words that describe a particular emotion. Choosing
    one emotion at a session, discuss other words that mean the same thing. Talk about
    the different levels of emotions—"If happy looks like this (*show happy face*),
    what do you think joyous looks like?" Act out the levels of emotions with your
    whole body. You might even get the children and families up on their feet to act
    out emotions together.


    *Emotion Words*


    +   * Happy—glad, cheerful, joyous, merry, jolly, blissful, chipper

    +   * Sad—forlorn, unhappy, depressed, heartbroken, mournful, weepy, sorrowful

    +   * Angry—mad, furious, enraged, cross, ticked, miffed, incensed

    +   * Scared—frightened, terrified, afraid, horrified, petrified, alarmed, panicked

    +   * Tired—exhausted, beat, sleepy, weary, drained, bushed, fatigued

    +   * Surprised—shocked, stunned, caught unawares, astounded, flabbergasted, stupefied,
    dumbstruck'
  - '[PAGE 99]


    # **Flashlight Vocabulary**


    *Supplies*


    +   - photographs of interesting items hung about the storytime room

    +   - flashlight

    +   - tape


    *Directions*


    Before storytime begins, tape the photographs around the room. At the designated
    time in the storytime, turn the lights down or off, turn on the flashlight, and
    shine its light on one photo at a time. Encourage the children to identify the
    item and describe it. Ask open-ended questions to build vocabulary.


    # **Letter/Number Game**


    *Supplies*


    +   - cards (index cards or laminated card-sized paper) of numbers 1–20 and some
    higher numbers

    +   - cards of the individual letters of the alphabet (all uppercase letters for
    younger storytime groups; mixed uppercase and lowercase letters for older groups)


    *Directions*


    Mix the number and letter cards together and hold them face down in your lap.
    Flip them up one at a time and ask, “Letter or number?” If the children are very
    adept at recognition, speed up the flipping. If the children are struggling, slow
    down and spend time talking about each number or letter. This game is intended
    to be fun, not stressful!


    # **Lowercase/Uppercase Matching Game**


    *Supplies*


    +   - cards or papers printed with individual uppercase letters

    +   - cards or papers printed with individual lowercase letters

    +   - tape


    *Directions*


    Tape the uppercase letters on the walls of your storytime room. Gather the children
    in the center of the room and give them each a lowercase letter. Tell the children
    (and their caregivers) that you are going to play music and when the music stops,
    you want them to be standing with the uppercase letter that corresponds to the
    lowercase letter in their hands. Allow lots of music time so the children don’t
    crash into one another. Let each child hold up and name his or her letter. Then
    have all the children return to the center of the room, exchange letters, and
    begin again. For very large groups, you may need to print multiple copies of the
    letters.'
  md: "\n## FLANNELBOARDS WITH MOVEMENT OR HANDS-ON PARTICIPATION\n\n### Five Brown\
    \ Buns\n\nUsing traditional rhymes at storytimes connects our modern children\
    \ to the canon of western literature, plus the rhymes have wonderful vocabulary\
    \ and rhythm. To add interest and participation to \"Five Brown Buns,\" have five\
    \ children line up against a wall to the right or left of where you sit. Give\
    \ them each a penny and place five brown bun pieces on the flannelboard. Sing\
    \ the rhyme together and encourage the five children, one at a time, to walk across\
    \ the room, stop to hand you a penny at the appropriate time, and take a bun from\
    \ the flannelboard. With the entire group, count the buns left on the board and\
    \ then sing the rhyme again as the next child walks across the room to \"buy\"\
    \ a bun. It may seem as though you are singing the rhyme a thousand times (which\
    \ for large groups may be about right), but the children and their caregivers\
    \ really seem to enjoy this activity, and it truly seals the rhyme in everyone's\
    \ memory.\n\nFive brown buns in the bakery shop,  \nFive brown buns with sugar\
    \ on top,  \nAlong came a fellow/gal with a penny in his/her hand,  \nHe/She took\
    \ one bun,  \nAnd away he/she ran.\n\n![](img/726487289a66f26aae16af221d544409_93_0.png)\n\
    \n### Love Tree\n\nFor this flannelboard, place the tree trunk on the board. Pass\
    \ out a flannelboard piece to each child. You may have to work in groups if you\
    \ have very large storytimes. The pieces might be red and pink hearts for Valentine's\
    \ Day or assorted green hearts to celebrate the return of spring. Tell the children\
    \ that when it is their turn to give their \"leaf\" to the tree, they will say,\
    \ \"Here is my love for Tree\" or \"Here is a leaf for Tree.\" Practice that line\
    \ several times with the children so they are comfortable in their knowledge of\
    \ it. Then begin the story.\n\n![](img/726487289a66f26aae16af221d544409_93_1.png)\n\
    \n![](img/726487289a66f26aae16af221d544409_93_2.png)\n\n![](img/726487289a66f26aae16af221d544409_96_0.png)\n\
    \n## Games\n\n![](img/726487289a66f26aae16af221d544409_96_1.png)\n\nPLAYING GAMES\
    \ AT STORYTIME ALLOWS US TO INTRODUCE THE ALPHABET, math concepts, science concepts,\
    \ real-world information, language play, print awareness, phonological awareness,\
    \ vocabulary—a wealth of possibilities. Plus, games are fun! Games can also help\
    \ children build many social and emotional skills: taking turns, waiting for a\
    \ turn, focusing, communicating, troubleshooting, and the like. The following\
    \ games are meant as a starting point. Build, change, and morph them into games\
    \ suited to your audience and size of storytime.\n\n### Alphabet Hunt\n\n*Supplies*\n\
    \n- alphabet banner\n- individual letters of the alphabet (preferably identical\
    \ in font and color to the letters on the banner)\n- bag or box to hold the letters\n\
    \n*Directions*\n\nPost the alphabet banner in the room or post individual letters\
    \ around the room. (Create letters large enough for all the children to see at\
    \ storytime.) Print a second set for yourself (these could be smaller, but in\
    \ a font and color that match the larger corresponding letters). Put all the smaller\
    \ letters in a bag and slap your hand on your thigh as you chant this rhyme:\n\
    \nHunt, hunt,  \nAn alphabet hunt,  \nWe're going on an alphabet hunt.  \nThe\
    \ letter ______ (pull a letter from the bag and call out its name)  \nIs hiding\
    \ its face.  \nLet's go find its hiding place!\n\n(Holding up the letter for all\
    \ to see, choose a child to locate the letter on the banner or in the room.)\n\
    \n### Birds and Insects\n\n*Supplies*\n\n- photographs of a variety of birds\n\
    - photographs of a variety of insects\n\n*Directions*\n\nPlay \"Is it a bird,\
    \ or is it an insect?\" Prior to playing the game, engage the children in a discussion\
    \ of the differences between birds and insects: two legs/six legs, feathers/no\
    \ feathers, and so on. Hold up one photograph at a time and ask if it's a bird\
    \ or an insect. If your group is small enough, engage the children in a discussion\
    \ about whether they have seen any of these birds or insects before.\n\n### Categories\n\
    \n*Supplies*\n\n- category names printed on paper\n- small box or bag\n\n*Directions*\n\
    \nPlace all the category names into a bag or a box and tell the children that\
    \ you are going to ask them to think very hard. Tell them that you will pull out\
    \ a category, which is a wonderful word for \"a group of things,\" and that when\
    \ you announce the category, you want them to name things that belong in that\
    \ category.\n\n*Category Names*\n\n- Colors\n- Kinds of Pets\n- Pieces of Clothing\n\
    - Animals\n- Fun Places to Visit\n- Kinds of Weather\n- Modes of Transportation\n\
    - Family Members\n- Community Helpers\n\n### Color Cards\n\n*Supplies*\n\n- color\
    \ cards—all uppercase names of colors printed in color (for example, \"GREEN\"\
    \ printed or written in green)\n\n*Directions*\n\nExplain to the children that\
    \ you are tired of reading and now it is their turn! Tell them you are going to\
    \ show them some color names and you want them to read the names out loud for\
    \ you. (Children catch on very quickly that the name is written in the color.)\
    \ After they have correctly named the color, read each letter aloud and then say\
    \ the color name again. Celebrate the fact that the children are such good \"\
    readers.\"\n\n### Emotion Vocabulary\n\nGiving names to emotions helps young children\
    \ manage them in a healthy way. In this game, you begin with more common words\
    \ for emotions: happy, sad, angry, scared, and so on. Engage the children in a\
    \ discussion about what these emotions look like. When a person is happy, how\
    \ does her face look? What about when she is sad? Continue asking similar questions\
    \ about other emotions. Once you have moved through the familiar emotions, talk\
    \ about less familiar emotions—frustrated, surprised, tense, and so forth. What\
    \ do those feelings look like? Recall a time you felt frustrated or surprised\
    \ or tense and tell the children what made you feel that way and, perhaps, what\
    \ you did to mediate it.\n\nAnother approach is to talk about words that describe\
    \ a particular emotion. Choosing one emotion at a session, discuss other words\
    \ that mean the same thing. Talk about the different levels of emotions—\"If happy\
    \ looks like this (*show happy face*), what do you think joyous looks like?\"\
    \ Act out the levels of emotions with your whole body. You might even get the\
    \ children and families up on their feet to act out emotions together.\n\n*Emotion\
    \ Words*\n\n- Happy—glad, cheerful, joyous, merry, jolly, blissful, chipper\n\
    - Sad—forlorn, unhappy, depressed, heartbroken, mournful, weepy, sorrowful\n-\
    \ Angry—mad, furious, enraged, cross, ticked, miffed, incensed\n- Scared—frightened,\
    \ terrified, afraid, horrified, petrified, alarmed, panicked\n- Tired—exhausted,\
    \ beat, sleepy, weary, drained, bushed, fatigued\n- Surprised—shocked, stunned,\
    \ caught unawares, astounded, flabbergasted, stupefied, dumbstruck\n\n### Flashlight\
    \ Vocabulary\n\n*Supplies*\n\n- photographs of interesting items hung about the\
    \ storytime room\n- flashlight\n- tape\n\n*Directions*\n\nBefore storytime begins,\
    \ tape the photographs around the room. At the designated time in the storytime,\
    \ turn the lights down or off, turn on the flashlight, and shine its light on\
    \ one photo at a time. Encourage the children to identify the item and describe\
    \ it. Ask open-ended questions to build vocabulary.\n\n### Letter/Number Game\n\
    \n*Supplies*\n\n- cards (index cards or laminated card-sized paper) of numbers\
    \ 1–20 and some higher numbers\n- cards of the individual letters of the alphabet\
    \ (all uppercase letters for younger storytime groups; mixed uppercase and lowercase\
    \ letters for older groups)\n\n*Directions*\n\nMix the number and letter cards\
    \ together and hold them face down in your lap. Flip them up one at a time and\
    \ ask, \"Letter or number?\" If the children are very adept at recognition, speed\
    \ up the flipping. If the children are struggling, slow down and spend time talking\
    \ about each number or letter. This game is intended to be fun, not stressful!\n\
    \n### Lowercase/Uppercase Matching Game\n\n*Supplies*\n\n- cards or papers printed\
    \ with individual uppercase letters\n- cards or papers printed with individual\
    \ lowercase letters\n- tape\n\n*Directions*\n\nTape the uppercase letters on the\
    \ walls of your storytime room. Gather the children in the center of the room\
    \ and give them each a lowercase letter. Tell the children (and their caregivers)\
    \ that you are going to play music and when the music stops, you want them to\
    \ be standing with the uppercase letter that corresponds to the lowercase letter\
    \ in their hands. Allow lots of music time so the children don't crash into one\
    \ another. Let each child hold up and name his or her letter. Then have all the\
    \ children return to the center of the room, exchange letters, and begin again.\
    \ For very large groups, you may need to print multiple copies of the letters.\n"
  mdcn: "\n## 带动作或动手参与的绒布板活动\n\n### 五个棕色小面包\n\n在故事时间使用传统童谣，能把我们现代的孩子与西方文学经典联系起来，而且这些童谣拥有美妙的词汇和节奏。为了让“五个棕色小面包”更有趣、更具参与性，让五个孩子靠墙排成一排，站在你座位右侧或左侧。给每个孩子一枚便士，并在绒布板上放五个棕色小面包贴片。大家一起唱这首童谣，并鼓励这五个孩子一个接一个地走过房间，在适当的时候停下来把一枚便士递给你，然后从绒布板上拿走一个小面包。和全体孩子一起数一数板上剩下的小面包，然后在下一个孩子走过房间来“买”小面包时再唱一遍这首童谣。你可能会觉得自己把这首童谣唱了一千遍（对于人数多的群体来说，这也许差不多），但孩子们和他们的照护者似乎真的很喜欢这个活动，而且它确实能把这首童谣牢牢印在每个人的记忆里。\n\
    \n五个棕色小面包在面包店里，  \n五个棕色小面包顶上撒着糖，  \n来了一个小伙子/姑娘，手里拿着一便士，  \n他/她拿了一个小面包，  \n就跑开了。\n\
    \n![](img/726487289a66f26aae16af221d544409_93_0.png)\n\n### 爱心树\n\n对于这个绒布板活动，先把树干放在板上。给每个孩子发一个绒布板贴片。如果你的故事时间人数非常多，可能需要分组进行。贴片可以是情人节用的红色和粉色爱心，也可以是庆祝春天回归的各种绿色爱心。告诉孩子们，轮到他们把“叶子”送给树时，他们要说：“这是我对树的爱”，或者“这是给树的一片叶子”。和孩子们一起把这句话练习几遍，让他们能自如地掌握它。然后开始讲故事。\n\
    \n![](img/726487289a66f26aae16af221d544409_93_1.png)\n\n![](img/726487289a66f26aae16af221d544409_93_2.png)\n\
    \n![](img/726487289a66f26aae16af221d544409_96_0.png)\n\n## 游戏\n\n![](img/726487289a66f26aae16af221d544409_96_1.png)\n\
    \n在故事时间玩游戏，让我们能够引入字母表、数学概念、科学概念、现实世界信息、语言游戏、印刷文字意识、语音意识、词汇——丰富的可能性。而且，游戏很有趣！游戏还能帮助孩子培养许多社交和情感技能：轮流、等待轮到自己、集中注意力、交流、解决问题等等。以下游戏只是一个起点。你可以在此基础上构建、改变和调整，使它们适合你的听众和故事时间的规模。\n\
    \n### 字母搜寻\n\n*材料*\n\n- 字母横幅\n- 单个字母（最好与横幅上的字母字体和颜色相同）\n- 用来装字母的袋子或盒子\n\n*说明*\n\
    \n把字母横幅张贴在房间里，或者把单个字母张贴在房间四周。（制作字母时要足够大，让故事时间的所有孩子都能看见。）再为自己打印一套字母（这套可以小一些，但字体和颜色要与相应的大字母一致）。把所有较小的字母放进一个袋子里，一边念这首童谣，一边用手拍大腿：\n\
    \n找呀找，  \n找字母，  \n我们要去找字母。  \n字母 ______（从袋子里抽出一个字母并大声说出它的名称）  \n藏起了它的脸。  \n我们去找它藏在哪里！\n\
    \n（把字母举起来让所有人看到，选一个孩子在横幅上或房间里找到这个字母。）\n\n### 鸟类与昆虫\n\n*材料*\n\n- 各种鸟类的照片\n- 各种昆虫的照片\n\
    \n*说明*\n\n玩“它是鸟，还是昆虫？”在开始游戏之前，和孩子们讨论鸟类与昆虫的区别：两条腿/六条腿、有羽毛/没有羽毛，等等。一次举起一张照片，问它是鸟还是昆虫。如果你们的人数足够少，可以和孩子们讨论他们以前是否见过这些鸟或昆虫中的任何一种。\n\
    \n### 分类\n\n*材料*\n\n- 印在纸上的类别名称\n- 小盒子或袋子\n\n*说明*\n\n把所有类别名称放进袋子或盒子里，并告诉孩子们，你要请他们非常努力地思考。告诉他们，你会抽出一个类别，也就是“一组事物”的一个很棒的说法；当你宣布这个类别时，你希望他们说出属于该类别的物品。\n\
    \n*类别名称*\n\n- 颜色\n- 宠物种类\n- 衣物\n- 动物\n- 有趣的可参观地点\n- 天气种类\n- 交通方式\n- 家庭成员\n- 社区服务人员\n\
    \n### 颜色卡\n\n*材料*\n\n- 颜色卡——所有颜色名称都用大写字母、并以对应颜色印刷（例如，用绿色印刷或书写“GREEN”）\n\n*说明*\n\
    \n向孩子们解释，你读累了，现在轮到他们了！告诉他们，你要给他们看一些颜色名称，希望他们大声读给你听。（孩子们很快就会明白，名称是用对应颜色写成的。）在他们正确说出颜色名称后，大声读出每个字母，然后再读一遍颜色名称。庆祝孩子们是如此出色的“读者”。\n\
    \n### 情绪词汇\n\n给情绪命名有助于幼儿以健康的方式管理情绪。在这个游戏中，你先从较常见的情绪词开始：开心、伤心、生气、害怕，等等。和孩子们讨论这些情绪看起来是什么样子。一个人开心时，她的脸是什么样？她伤心时又是什么样？继续就其他情绪提出类似问题。在讲过熟悉的情绪之后，谈谈不太熟悉的情绪——沮丧、惊讶、紧张，等等。那些感受看起来是什么样？回想一次你感到沮丧、惊讶或紧张的经历，告诉孩子们是什么让你有那种感受，也许还可以说说你做了什么来缓解它。\n\
    \n另一种方法是谈论描述特定情绪的词。每次活动选择一种情绪，讨论其他表示相同意思的词。谈谈情绪的不同程度——“如果开心看起来是这样（*做出开心的表情*），你觉得欢乐看起来是什么样？”用整个身体表演出情绪的不同程度。你甚至可以让孩子们和家人站起来，一起表演情绪。\n\
    \n*情绪词*\n\n- 开心——高兴、愉快、欢乐、快活、喜气洋洋、幸福、兴致勃勃\n- 伤心——孤苦、不快乐、沮丧、心碎、哀伤、泪汪汪、悲痛\n- 生气——发疯、暴怒、愤怒、恼怒、气恼、愠怒、激怒\n\
    - 害怕——恐惧、惊恐、畏惧、惊骇、吓呆、惊慌、恐慌\n- 疲倦——精疲力竭、累垮、困倦、疲惫、被掏空、累坏、疲乏\n- 惊讶——震惊、目瞪口呆、措手不及、惊愕、大吃一惊、发愣、哑口无言\n\
    \n### 手电筒词汇\n\n*材料*\n\n- 挂在故事时间房间各处的有趣物品照片\n- 手电筒\n- 胶带\n\n*说明*\n\n在故事时间开始前，用胶带把照片贴在房间四周。到了故事时间指定的环节，把灯光调暗或关掉，打开手电筒，一次把光照在一张照片上。鼓励孩子们认出物品并描述它。提出开放式问题来丰富词汇。\n\
    \n### 字母/数字游戏\n\n*材料*\n\n- 数字1–20以及一些更大数字的卡片（索引卡或覆膜卡纸）\n- 单个字母的卡片（年龄较小的故事时间群体用全大写字母；年龄较大的群体用大小写混合字母）\n\
    \n*说明*\n\n把数字卡和字母卡混在一起，正面朝下放在你的腿上。一次翻起一张，问：“字母还是数字？”如果孩子们非常擅长辨认，就加快翻卡速度。如果孩子们觉得有困难，就放慢速度，花时间谈谈每个数字或字母。这个游戏是为了好玩，而不是让人有压力！\n\
    \n### 小写/大写配对游戏\n\n*材料*\n\n- 印有单个大写字母的卡片或纸\n- 印有单个小写字母的卡片或纸\n- 胶带\n\n*说明*\n\n\
    用胶带把大写字母贴在故事时间房间的墙上。把孩子们聚集到房间中央，给每个孩子一个小写字母。告诉孩子们（以及他们的照护者），你要播放音乐，当音乐停止时，希望他们站到与自己手中小写字母相对应的大写字母旁边。留出充足的音乐时间，以免孩子们互相撞到。让每个孩子举起自己的字母并说出它的名称。然后让所有孩子回到房间中央，交换字母，再重新开始。如果人数非常多，你可能需要打印多份字母。\n"
