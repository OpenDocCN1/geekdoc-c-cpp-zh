  - '[PAGE 40]


    *Zoo Pairs* by Patricia Whitehouse (Heinemann Library, 2002). An excellent book
    that examines the concept of pairs. The photographs of animals and the easy text
    make this a nice choice for preschool storytimes.


    # ## Singing Stories


    Singing is one of the most effective and enjoyable ways to help children hear
    the smaller parts in words. It automatically breaks words up into syllables. And
    it slows down pronunciation allowing the individual sounds to be highlighted.
    Plus, song lyrics most often rhyme! These are all excellent ways to build the
    phonological decoding skills that are a necessary part of being ready to read.
    Children don''t care if you can carry a tune or not, but if self-consciousness
    is going to keep you from singing at storytimes, then by all means use a CD or
    iPod and encourage everyone to sing along!


    To inspire more music at storytime, here are some wonderful books that will encourage
    singing:


    +   - *A You''re Adorable* by Buddy Kaye (Candlewick, 1994). Martha Alexander''s
    sweet illustrations really help bring this wonderful book to life. If you don''t
    know the tune, there is a wonderful *Sesame Street* video of it on YouTube!

    +   - *All the Pretty Little Horses: A Traditional Lullaby*, illustrated by Linda
    Saport (Clarion Books, 1999). Lovely, muted illustrations and a soft lullaby make
    this a nice choice for a gentle storytime book.

    +   - *A-Tisket A-Tasket* by Ella Fitzgerald (Philomel Books, 2003). The old rhyme
    gets a facelift through Ella''s jazzy lyrics and the vibrant illustrations.

    +   - *Cat Goes Fiddle-I-Fee* by Paul Galdone (Clarion Books, 1985). The old cumulative
    song is accompanied by Galdone''s wonderful illustrations in this classic for
    preschoolers.

    +   - *Down by the Bay* by Raffi (Crown, 1987). Nadine Bernard Westcott''s amusing
    illustrations make this a fun and silly title to share.

    +   - *Down by the Station* by Will Hillenbrand (Harcourt Brace, 1999). In this
    appealing version of the song, the little engine picks up baby animals from all
    over town (including the children) and drops them at the zoo.

    +   - *Five Little Ducks* by Raffi (Crown, 1989). The well-known song features
    wonderful illustrations by Jose Aruego. (Raffi has many more songbooks.)

    +   - *Five Little Monkeys Jumping on the Bed*, illustrated by Eileen Christelow
    (Clarion Books, 1989). This song counts backward from five, children love singing
    and jumping along, and that is what we affectionately call *playing with numbers*.'
  - '[PAGE 41]


    *Going to the Zoo* by Tom Paxton (Morrow Junior Books, 1996). This wonderful book
    encourages the children to imitate all the animals at the zoo. And it can be sung!


    *How Much Is That Doggie in the Window?* by Iza Trapani (Gareth Stevens, 1999).
    The classic song in adorable book format. (Iza Trapani has many more songbooks.)


    *Hush, Little Baby* by Brian Pinkney (Greenwillow, 2006). The large and vibrant
    illustrations, plus the fact that you can sing the book, make it a wonderful choice
    for storytimes.


    *Hush Little Baby* by Sylvia Long (Chronicle Books, 1997). The old song gets a
    nature-based reworking in this lovely book. The adorable rabbit illustrations
    and the gentle bedtime theme will appeal to storytime audiences.


    *Hush Little Baby: A Folk Song with Pictures* by Marla Frazee (Browndeer Press,
    1999). The old song, deftly and amusingly illustrated, will find new fans and
    spur a desire for repeated readings.


    *Hush Little Digger* by Ellen Olson-Brown (Tricycle Press, 2006). This funny retake
    on the mockingbird song features many different working vehicles.


    *If You''re a Monster and You Know It* by Rebecca Emberley (Orchard Books, 2010).
    A crowd-pleasing, interactive, singing update of a classic—this is such fun to
    share!


    *If You''re Happy and You Know It* by Anna McQuinn (Barefoot Books, 2009). Wonderfully
    illustrated version of the song with many different movement prompts for a wiggling
    storytime!


    *If You''re Happy and You Know It*, illustrated by Jane Cabrera (Holiday House,
    2005). The large and vibrant illustrations stand out in this version of the popular
    song.


    *If You''re Happy* by April Pulley Sayre (Greenwillow, 2011). This retooling of
    the ubiquitous song has great illustrations and fun information and is a blast
    to sing at storytime.


    *Inch by Inch: The Garden Song* by David Mallett (HarperCollins, 1995). Simple
    illustrations and a wonderfully singable song make this a winner for spring.


    *Itsy Bitsy Spider* by Lorianne Siomades (Boyds Mills Press, 2001). This is a
    nice, colorful yet very simple version of the song.


    *I''ve Been Working on the Railroad*, edited by Ann Owen, illustrated by Sandra
    D''Antonio (Picture Window Books, 2003). An interesting introduction and the use
    of just one verse make this a nice addition for storytimes with a wide age range
    among the attendees.


    *Los Pollitos Dicen / The Baby Chicks Sing* by Nancy Abraham Hall (Little, Brown,
    1994). Choose one of the singing rhymes from this wonderful book to share.'
  - '[PAGE 42]


    *Mary Had a Little Lamb* by Sarah Hale, illustrated by Tomie dePaola (Holiday
    House, 1984). The adorable illustrations make this a nice choice for sharing.


    *Peanut Butter and Jelly: A Play Rhyme* by Nadine Westcott (Dutton, 1987). This
    chanting book features an old rhyme, amusing illustrations replete with elephants,
    and a repeating line for participation. (Nadine Westcott has many more songbooks.)


    *Pete the Cat: I Love My White Shoes* by Eric Litwin (Harper, 2010). It introduces
    color, it rhymes, you can sing it, children adore it—this one is a keeper, indeed.


    *Rah, Rah, Radishes! A Vegetable Chant* by April Pulley Sayre (Beach Lane Books,
    2011). A great storytime book thanks to its beautiful photographs of vegetables
    far and wide and its accompanying rhyming chant.


    *The Seals on the Bus* by Lenny Hort (Henry Holt, 2000). A hilarious send-up of
    the “Wheels on the Bus” song. This one will have everyone at storytime laughing!


    *Spider on the Floor* by Bill Russell, illustrated by True Kelley (Crown, 1993).
    The book is small in format, but the illustrations are oversized in relation and
    so wonderfully silly that they deserve to be seen. Plus, you can sing the whole
    thing!


    *Ten in the Bed*, illustrated by Jane Cabrera (Holiday House, 2005). The old song
    is accompanied by large, vivid illustrations.


    *Ten in the Den* by John Butler (Peachtree, 2005). A book you can sing, with detailed
    and adorable illustrations.


    *There Was an Old Lady Who Swallowed a Fly* by Simms Taback (Viking, 1997). Taback''s
    wonderful illustrations and easy text will encourage children to sing along.


    *There Was an Old Monster* by Rebecca Emberley (Orchard Books, 2009). Vivid illustrations
    on a black background are the perfect accompaniment to this hoot of a book.


    *This Land Is Your Land* by Woody Guthrie, illustrated by Kathy Jakobsen (Little,
    Brown, 1998). The detailed folk art illustrations may be too intricate for full
    storytime sharing, but this song can carry the book.


    *To Market, To Market* by Anne Miranda (Harcourt Brace, 1997). A wonderful retelling
    of the old song with riotous illustrations by Janet Stevens.


    *Today Is Monday* by Eric Carle (Philomel Books, 1993). The old song accompanied
    by Carle''s wonderful cut-tissue illustrations. This is a good one to sing.


    *We''re Going on a Bear Hunt* by Michael Rosen (Margaret K. McElderry Books, 1989).
    Helen Oxenbury''s wonderful illustrations make this a great book to chant at storytime.'
