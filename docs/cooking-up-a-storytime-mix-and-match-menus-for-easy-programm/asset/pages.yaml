    # Sundial


    *Supplies:*


    +   - object to use as a sundial (perhaps a wrapping paper tube taped to the ground
    or a caution cone)

    +   - masking or painter’s tape


    *Directions*


    Before the storytime begins, place the tall sundial object in a sunny spot in
    your room or in the library. Tell the children that today they are going to measure
    the passage of time by measuring the movement of the object’s shadow. While the
    children watch, tape the outlines of the object’s shadow onto the floor and proceed
    with the storytime. When you are finished, call the children’s attention to the
    tape and wonder about the outcome.


    If you don’t have sun shining into your room, you might use a flashlight to show
    the children a shadow’s movement. Engage the children in a discussion about the
    passage of time.'
