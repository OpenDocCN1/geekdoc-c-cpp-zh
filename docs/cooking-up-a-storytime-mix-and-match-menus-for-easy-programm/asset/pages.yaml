- pgno: 157
  md: '# ### Fingerplay or Story


    Who Is in a Family? (chapter 4)


    # ### Poem


    “Growing Old” by Rose Henderson, in *Tomie dePaola’s Book of Poems*, selected
    and illustrated by Tomie dePaola (Putnam, 1988), p. 58.


    # ### Flannelboard


    Family (chapter 5): Bilingual extended family vocabulary


    # ### Interactive Games


    Opposites (chapter 6)


    Engage the children in a discussion about what makes a family. Talk about the
    ways in which families are different from one another and the ways in which they
    are alike.


    # ### Math Activities


    Shape Families (chapter 7)


    Going by family, make large tick marks on a dry erase board or a posterboard showing
    how many children each family has. Count the total number by ones to see how many
    children are in your storytime families.


    # ### Science Activity


    Engage the children in a discussion about hair color and texture, skin color,
    height, eye color, and other traits that family members have in common with one
    another. Use one of the photographic family books to highlight how people who
    are related by blood tend to look like one another.


    # ### Additional Fiction Titles


    *Families*


    *Hush, Little Baby* by Brian Pinkney (Greenwillow, 2006). The large and vibrant
    illustrations, plus the fact that you can sing the book, make it a wonderful choice
    for storytimes.


    *I Miss You Every Day* by Simms Taback (Viking, 2007). The simple text, wonderful
    illustrations, and repeating line will captivate children. Plus, the story inspires
    letter writing and dialogue about how the mail functions. This would be a great
    book to use with the Storytime Mailbox activity described in the writing section
    of chapter 3, “Books.”


    *Kitchen Dance* by Maurice J. Manning (Clarion Books, 2008). A joyfully illustrated
    story of a family having a night dance in the kitchen.'
