- pgno: 16
  md: '# # Understanding How Children Grow and Learn


    IF LIBRARIANS HOPE TO PARTNER EFFECTIVELY WITH EARLY LEARNING PROFESSIONALS, IT''S
    VITAL THAT WE POSSESS AN OVERALL KNOWLEDGE OF CHILD DEVELOPMENT AND OUR POTENTIAL
    ROLE IN HELPING CHILDREN BECOME READY FOR SCHOOL.


    # ## Libraries and Early Learning


    Storytimes are one of the most enduring, beneficial, and popular programs that
    libraries offer. And with very good reason: library patrons of all ages attend
    storytimes. A wonderful portion of the library collection is featured and circulated
    there. Parents and caregivers discover information, entertainment, and community
    when they attend storytimes. But most importantly, the story room is an ideal
    setting in which to introduce children to the incredible world of language, stories,
    and books. It is where we can help prepare them for successful school experiences.
    And set them on the path to becoming curious, compassionate, and lifelong learners.


    Our world is abuzz with burgeoning research about the developing brain and the
    importance of the first few years of a person''s life. We now understand that
    the experiences of those first few years have enormous ramifications for a person''s
    physical, social, and intellectual health for the *rest of her life*. Community
    organizations of all sorts, researchers, health departments, educational service
    districts,'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'parent groups, tribes, service organizations, child care facilities, preschools,
    school districts—all are uniting in the understanding that if we work together,
    we can help change children''s lives for the better. Children''s librarians can,
    and should, be critical partners in these growing early learning collaborations.
    We have a long and rich tradition of programming for young children, but to be
    considered essential partners in these growing coalitions, we must dedicate ourselves
    to becoming what I like to call *seasoned librarians*—those who have not only
    an encyclopedic knowledge of the best books, authors, and resources but also a
    strong understanding of how children think, grow, and learn. So I begin this book
    with an overview of important ideas to ponder as we plan programs for our communities—rather
    like cooking lessons would be for people who want to prepare healthy gourmet meals
    for the folks who sit down at their table.


    # Early Learning Contexts


    Our understanding of how children grow and develop has deepened and clarified,
    thanks to more accurate and abundant measurement methods and tools. This insight
    has helped us better articulate the types of activities and environments that
    are most beneficial for discovery and learning. There are two vital concepts to
    keep in mind as we look closely at children''s learning and development: one,
    that children learn *best* in the context of caring relationships, and two, that
    in everything we plan, we should consider the *whole child*—body, mind, and heart.


    When a trusting relationship exists with another person, the richest learning
    can occur. Indeed, for children under two years of age, learning happens almost
    *entirely* in that context, which is one of the main reasons the American Academy
    of Pediatrics recommends no screen time at all for children under two (American
    Academy of Pediatrics 2011). Several studies have now demonstrated that babies''
    brains are wired to scrutinize, imitate, and engage other humans *face-to-face*.
    And even though preschoolers can learn from many mediums, the human relationship
    remains the most powerful. For the learning that happens is not just language,
    letters, and concepts, but the deep knowledge of what it means to be a loving
    human being.


    Our storytimes give us wonderful opportunities to establish warm, trusting relationships
    with children and their families. As young children grow, they move out gradually
    from the circle of their family to test relationships in the larger community.
    When we librarians learn children''s names and engage them in conversation (and,
    most especially, *listen* to them when they speak with us), we show the children
    that they are important to us and that we care about them and their families.
    Week after week, as they attend storytimes, we establish a relationship with them.
    This'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'interaction not only broadens their circle but also models how caring adults
    in the world behave. Children''s sense of trust builds. And when they feel trust
    and a sense of belonging, not only are they empowered for further exploration
    but the library becomes an optimal place for learning to occur. Therefore, I believe
    it''s best to really focus on human interaction at our storytimes. Today''s children
    have a plethora of opportunities in which to engage technology and fewer and fewer
    chances to engage loving and receptive people.


    As for planning programs with whole-child appeal, our storytimes easily do this
    (and have done so for over one hundred years!). We engage the children physically
    through the use of fingerplays, bouncers, stretchers, movement, and dance. We
    can engage the children''s minds by sharing a wide variety of beautiful and interesting
    books and stories and by asking open-ended questions that encourage conversation
    about what we have shared. It is through our selection of books and activities
    that we can spur wonder about our world.


    Wonderful stories appeal to children''s hearts as well. They may recognize themselves
    in the unfolding events and sympathize with the characters. Perhaps they are touched
    by the story. This learning helps build emotional vocabulary and understanding,
    both essential components in the development of empathy, compassion, and perspective
    taking.


    If we put these two research themes together—the importance of relationships and
    consideration of the whole child—it seems to me that if we really want to create
    rich, heartfelt learning at storytimes, we should offer as many interactive opportunities
    for the children as possible. It is through interaction that they will truly engage
    in learning with us, with their caregivers, and with other children. It is also
    through interaction that we can grasp what they understand and what they don''t.
    The more opportunities there are for participation, interaction, and even assessment
    during storytimes, the more vital the storytimes will be for our children and
    their families. And that is why interaction is at the heart of this book. I believe
    storytimes should be loads of fun, but I also believe they can provide children
    a chance to ponder, test, and practice what they see, hear, feel, and think.


    # ## How Young Children Learn


    Research into early learning and the testimonies of experienced teachers reveal
    that very young children often take longer to process new information and questions
    than do older children and adults. Thus, if we add more interactive elements to
    storytimes, we should be prepared to give the children plenty of time to process
    a question posed, formulate an answer, and respond. Some experts have recommended
    slowly counting to five after posing a question, which may not sound like'
  merge: -1
  img_proc: true
