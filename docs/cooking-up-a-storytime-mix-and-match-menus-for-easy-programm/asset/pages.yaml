  md: 'chair here.” “I see four mats in the front row that are still empty.” When
    we add these sorts of counting words into our everyday dialogue, we are bathing
    the children in contextual math vocabulary, thus elevating their math and literacy
    learning.


    # *Subitizing*


    As mentioned in the flannelboard chapter, *subitizing* is the ability to recognize
    at a glance the number of objects in a set (for instance, the number of dots on
    the side of a die). This is an important mathematical skill and one that we can
    help develop at storytime by giving the children plenty of practice. We can use
    flannelboards or even papers with a number of items printed on them. For example,
    if you have just read a book about birds, you could show the children papers or
    large index cards with one bird, two birds, six birds, and so forth printed on
    them. Simply flip up the pages one at a time and ask, “How many do you see?” This
    is a fun game to play at storytimes and is a cinch to adapt to almost any theme.


    # **Geometry and Spatial Sense**


    The exploration of shapes is a perfect beginning point for preschool geometry.
    And what better way to explore shapes than with a large set of blocks? A fascinating
    study by Dr. Dmitri Christakis and his colleagues at the University of Washington
    (*JAMA and Archives Journals 2007*) demonstrated that children whose parents engaged
    them in block-play every day showed not only excellent foundational math understanding
    but improved literacy skill development as well! Not surprising since block-play
    with others requires communication, expanded vocabulary (names of blocks and structures,
    etc.), and even storytelling when children act out a scene using the blocks. Because
    young children learn primarily through their senses, blocks are ideal for hands-on
    understanding not only of shapes but also of scientific concepts like gravity,
    stability, trial and error, and prediction. Adding free block-play to a storytime
    room is such a powerful yet simple idea. Block-play can be a wonderful transitional
    activity before storytime begins (or after it ends) and can also act as a reminder
    for parents of the importance of such play.


    # **Measurement**


    To understand the concept of measurement, children must first learn the attributes
    of measuring (weight, length, size, nearness, etc.) and then be able to apply
    these attributes to actually measure things. Whenever possible, it’s important
    to move beyond the simple big/little comparison; think about capacity, area, length,
    width, height, weight, distance, and so on.


    # *Comparing*


    The concept of comparing is best developed in young children by manipulating real
    objects and using hands-on activities whenever possible. We also want to help'
