    # **Science Activity**


    Wild and Domestic (chapter 8): Share a book about wild cats or photographs of
    wild cats. Compare lions and tigers and jaguars and pumas, describing how they
    are alike and how they are different. Share photos of house cats and talk about
    the ways in which they are alike and different. Then look at similarities and
    differences between the wild cats and the domesticated cats.


    # **Additional Fiction Titles**


    +   - *Bittle* by Patricia MacLachlan (Joanna Cotler Books, 2004). A dog and a
    cat wonder if they will like the new baby. Preschoolers familiar with infants
    will find this book especially appealing.

    +   - *A Cat Like That* by Wendy Wahman (Henry Holt, 2011). A winner for pre-school
    storytimes with its bright illustrations, good humor, and great information about
    all things cat.

    +   - *Feathers for Lunch* by Lois Ehlert (Harcourt Brace Jovanovich, 1990). This
    is a simple book for storytimes, but the large illustrations, the hungry cat,
    and the happy ending (for the bird!) make it quite popular.

    +   - *Have You Seen My Cat?* by Eric Carle (Simon and Schuster Books for Young
    Readers, 1987). A wonderful repeating sentence and Carle''s signature cut-paper
    illustrations make this an excellent book for storytimes. Use it to spark discussion
    about the different places to which the boy travels.

    +   - *I Don''t Want a Cool Cat* by Emma Dodd (Little, Brown, 2010). The large
    illus-trations and the fantastic vocabulary make this a winner.

    +   - *I Love Cats* by Sue Stainton (Katherine Tegen Books, 2007). Repetition,
    inter-esting vocabulary, and great illustrations make this a lovely book for sto-rytime.

