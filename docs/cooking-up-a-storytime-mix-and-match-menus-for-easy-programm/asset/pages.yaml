  md: '*Te Amo, Bebé, Little One* by Lisa Wheeler (Little, Brown, 2004). A mother
    sings a repeating song to her baby as he grows in this sweet book.


    # *Babies*


    *Baby Knows Best* by Kathy Henderson (Little, Brown, 2001). The rhyming text and
    the humor make this a winner for storytime.


    *Bouncing Babies* by Michael Brownlow (Ragged Bears, 2002). Preschoolers will
    enjoy the large illustrations and this rhyming look at the things that babies
    do. (Caregivers will enjoy the joke at the end!)


    *Hush Little Baby: A Folk Song with Pictures* by Marla Frazee (Browndeer Press,
    1999). The old song, deftly and amusingly illustrated, will find new fans and
    spur a desire for repeated readings.


    *I’m a Baby, You’re a Baby* by Lisa Kopper (Viking, 1995). A simple book that
    compares human babies with baby animals and what we call them.


    *Lola Reads to Leo* by Anna McQuinn (Charlesbridge, 2012). Children will enjoy
    the heartwarming story of big sister Lola reading her favorite books to her new
    baby brother. The adorable illustrations are sized perfectly for storytime sharing.


    *More, More, More Said the Baby* by Vera Williams (Tupelo Books, 1990). The fun,
    repetitive language, and homey familiarity make this classic a necessity for sharing
    at storytime.


    *No More Kissing!* by Emma Chichester Clark (Doubleday Books for Young Readers,
    2002). The bright personality of the young monkey and the sweet relationship he
    has with his baby brother make this a nice storytime choice.


    *Such a Silly Baby* by Stefanie and Richard Lorig (Chronicle Books, 2008). Everywhere
    a mother goes, her baby gets swapped out for some other creature in this silly,
    song-like book.


    # *Other Family*


    *Grandpa Loves Me!* by Marianne Richmond (Marianne Richmond Studios, 2009). This
    loving book looks at many different grandpas and all the things they do with their
    grandchildren.


    *Tummy! Tummy! Tummy! A Palestinian Folktale* by Margaret Read MacDonald (Marshall
    Cavendish Children, 2006). The naughty little child/pot in this tale will amuse
    older preschoolers.


    *Watch Out! Big Bro’s Coming!* by Jez Alborough (Tundra Books, 2005). A funny
    book about perceptions and imaginations run wild.'
