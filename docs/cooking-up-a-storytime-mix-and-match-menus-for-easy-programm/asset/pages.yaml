- pgno: 33
  md: 'With these considerations in mind, it’s critical for us to use the lens of
    diversity when selecting titles to share. Storytime should be an experience of
    both belonging and exploring. So the books that we share should work to those
    ends.


    Here are some questions to ponder as you strive for variety and inclusion at storytime:


    +   - Will the children who attend my storytime see themselves reflected in this
    book?

    +   - Will they find something familiar in this book?

    +   - Will they find something unfamiliar in this book?

    +   - Will they catch a glimpse of the world outside the scope of their day-to-day
    lives?

    +   - Will this book inspire them to explore an unfamiliar place, idea, or subject?

    +   - Are there steps that I could take or activities that I could introduce to
    encourage that exploration?

    +   - Is there a healthy variety in the books that I share week to week?


    Asking these questions helps ensure that our storytimes are welcoming and enjoyable
    for everyone.


    Here are some wonderful storytime titles that reflect our diverse communities.
    Titles with asterisks have fewer words per page.


    *Abuela* by Arthur Dorros (Dutton Children’s Books, 1991). A young girl and her
    grandmother sail over their New York City neighborhood.


    *A-Tisket A-Tasket* by Ella Fitzgerald (Philomel Books, 2003). The old rhyme gets
    a facelift through Ella’s jazzy lyrics and the vibrant illustrations.


    *Bebé Goes Shopping* by Susan Middleton Elya (Harcourt, 2006). Wonderful rhyming
    book about a baby and his mama doing their grocery shopping. The Spanish words
