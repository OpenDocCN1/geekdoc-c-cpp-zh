  md: '*Mouse Count* by Ellen Stoll Walsh (Harcourt Brace Jovanovich, 1995). Simple,
    suspenseful, and begins at one. A classic.


    *One Foot, Two Feet: An EXCEPTIONAL Counting Book* by Peter Maloney (Putnam, 2011).
    This very simple, die-cut counting book starts at one (goes to a billion!) and
    is great for storytime.


    *Over in the Meadow* by Ezra Jack Keats (Viking, 1999). The old Wadsworth rhyme
    beautifully illustrated by Keats. Perfect for preschool storytimes.


    *Over in the Meadow* by John Langstaff (Harcourt, Brace, 1957). Another version
    of the old Wadsworth rhyme with intricate illustrations by Caldecott winner Feodor
    Rojankovsky.


    *Spot Can Count* by Eric Hill (Putnam, 1999). This is an ideal book for beginning
    counters—contains simple illustrations, begins at one, and clearly shows items
    to count.


    *Ten Little Caterpillars* by Bill Martin Jr. (Beach Lane Books, 2011). A wonderful
    counting book that counts using ordinal numbers (first, second, third, and so
    on). Very simple with beautiful illustrations by Lois Ehlert and some wonderful
    science connection possibilities as well—a winner!


    *10 Little Rubber Ducks* by Eric Carle (HarperCollins, 2005). A counting book,
    but with science connections as well because it is based on the true story of
    a carton of rubber ducks that went overboard from a ship and scattered to many
    regions of the Pacific Ocean.


    *Ten Red Apples: A Bartholomew Bear Counting Book* by Virginia Miller (Candlewick,
    2002). A nice one-to-ten counting book with the apples off to the side for subitizing.


    *We All Went on Safari: A Counting Journey through Tanzania* by Laurie Krebs (Barefoot
    Books, 2003). This wonderful counting book is simple and accompanied by a repeating
    phrase for extra fun.


    # *Measurement*


    *Big, Bigger, Biggest!* by Nancy Coffelt (Henry Holt, 2009). A very simple book
    with excellent comparison examples.


    *Blue Sea* by Robert Kalan (Greenwillow, 1979). Children love this simple book
    where the little fish gets away. Cut out paper fish of varying sizes for the children
    to sort by size after the storytime.


    *Inch by Inch* by Leo Lionni (Astor-Honor, 1960). Cut a piece of yarn or string
    and use it to measure items in the room the way the worm uses himself. Introduce
    a ruler and show the children what an inch looks like. Talk about “longer,” “shorter,”
    “taller,” “wider,” and so forth. Outline and cut out your feet and the children’s
    feet and use the cutouts to measure things around the room. (How many “feet” is
    this object?)'
