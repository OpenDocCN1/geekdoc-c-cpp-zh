  md: '# # Exploring the World at Storytime


    # ### Animals and Babies


    *Supplies*


    +   - separate photographs of animals and their babies (for example, dog/puppy,
    cat/kitten, horse/foal, cow/calf, sheep/lamb, goat/kid, chicken/chick, duck/duckling,
    goose/gosling, frog/tadpole, bear/cub, sparrow/nestling, fox/kit, kangaroo/joey)


    *Directions*


    Hand out the animal baby photographs to each child (or do this activity a few
    times if your storytimes are very large). Hold up a photograph of an animal and
    ask the child who has the matching baby to bring it up to the front of the room.
    Talk about the animals for a moment: “What does a horse eat?” “What sounds does
    a chicken make?” “What names do we have for bears?”


    # ### Animals and Homes


    *Supplies*


    +   - separate photographs of animals and the homes in which they live (for example,
    birds/nests, foxes/dens, cows/barns, dogs/beds or dogs/houses, cats/cat beds,
    fish/bowls or fish/ponds, chickens/coops, frogs/ponds, rabbits/holes, eagles/aeries,
    moles/holes, ants/anthills)


    *Directions*


    This activity is similar to “Animals and Babies” but with photographs of animals
    and their homes. Hand out a photograph of an animal to each child. Hold up a photograph
    of an animal home and encourage the child who has the photograph of the animal
    that belongs in that home to bring his or her photograph up to you. Talk about
    the animal and the home in which it lives: “Where might we find this home?” “Does
    the animal build the home itself?” “How does it do that?”


    # ### Animals Near and Far


    *Supplies*


    +   - photographs or books of two different animals—one that lives near your area
    and one that lives in an area remote from where you live


    *Directions*


    Using the photographs or books about these animals, compare and contrast them—their
    fur/skin/feathers, babies, food, beds, sleeping patterns, and so on. Engage the
    children in a discussion about how the animals are alike and how they are different.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# **Animal Skins and Shells**


    *Supplies*


    +   - pieces of real animal fur, feathers, leather, shells, and the like


    *Directions*


    Pass the objects around the room or provide an opportunity for children to explore
    the objects at a nature table. Encourage them to see, smell, and touch the objects.
    Then engage the children in a discussion about the objects: "How are they similar?"
    "How do they differ?" "From what animal or creature do they come?" "What do they
    provide that animal?"


    # **Bees**


    *Supplies*


    +   - photographs of bees at work

    +   - photographs of (or the actual) fruits that require bees for pollination:
    kiwi, strawberry, watermelon, tangerine, tangelo, lemon, lime, lychee, apple,
    mango, apricot, cherry, plum, peach, boysenberry, blackberry, raspberry, elderberry,
    blueberry, cranberry, grape, and cantaloupe

    +   - jar of honey


    *Directions*


    Using the photographs or fruits, engage the children in a discussion about bees.
    "Have you ever seen bees?" "Where were you?" "What were the bees doing?" Talk
    about the difference between bees and hornets. Do the children eat any of these
    fruits? Talk about honey and what it tastes like.


    # **Explore Box**


    *Supplies*


    +   - box with low sides

    +   - assortment of natural materials: seeds, leaves, stems, moss, twigs, flowers,
    and the like


    *Directions*


    Fill a box with many natural materials. Place this box in a place where the children
    may explore it either before or after storytime. The materials can be changed
    to reflect different seasons.'
