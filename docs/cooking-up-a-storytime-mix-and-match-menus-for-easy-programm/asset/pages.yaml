  md: '# Let''s Get Cooking!


    # Animals


    # Suggested Fiction Titles


    As previously mentioned, the longest story is first, followed by a wonderful interactive
    title, with the third title finishing the storytime on a humorous note.


    *The Three Billy Goats Gruff* by Paul Galdone (Seabury Press, 1973). A superb
    retelling of the folktale with folksy yet evocative illustrations.


    *I Spy with My Little Eye* by Edward Gibbs (Templar Books/Candlewick, 2011). The
    die-cut pages of this book pose questions for the children to answer about real
    animals. A gem.


    *Animals Should Definitely Not Wear Clothing* by Judi Barrett (Atheneum, 1970).
    A classic children''s book showing many animals and why articles of clothing don''t
    really work for them.


    # Suggested Informational Title


    *Who Has These Feet?* by Laura Hulbert (Henry Holt, 2011). This vibrant book shows
    a pair of feet across a two-page spread and then the animal to which the feet
    belong on the next two-page spread. Simple text and embedded interaction make
    this a storytime must!


    # Fingerplay or Action Verse


    +   - Walking through the Forest (chapter 4)

    +   - Zoo Who? (chapter 4)


    # Poem


    > “The Panther” by Ogden Nash, in *Custard and Company: Poems by Ogden Nash*,
    selected by Quentin Blake (Little, Brown, 1980), p. 29.


    # Interactive Game


    Birds and Insects (chapter 6)


    # Math Activity


    Large and Small Chart (chapter 7)'
