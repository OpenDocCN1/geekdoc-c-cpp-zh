  md: '# # 8


    # # Science


    AS WITH MATH, ADDING SCIENTIFIC CONCEPTS TO STORYTIMES IS REALLY just a matter
    of being more intentional when planning. Keeping in mind that young children are
    already natural scientists and that they learn best through their senses, we can
    look at the books we have chosen for the week, ponder the scientific ideas that
    may be in the text or illustrations, and build an activity around them.


    Young children are eager to explore and manipulate the environment around them.
    To encourage the scientific explorer within each child, look for ways to introduce
    objects—photos, shells, leaves, feathers, things preschoolers are familiar with—into
    storyline that will inspire questions, investigation, and discussion. Anything
    you introduce should be concrete rather than abstract, something within preschoolers’
    physical experience. For example, you might talk about the warmth of the sun on
    a summer day and have the children take turns moving from shadow to sunlight in
    the story room to test the difference in temperature. You might ask: “What is
    the difference between how the shadow looks and how the sunlight looks?” “What
    is the difference in how they feel?” “What do we know about the sun?” “How could
    we find out more about it?” You needn’t launch into an in-depth investigation
    of the chemical makeup of the sun and its place in the solar system. You simply
    want to encourage the children to share what they know and kindle their interest
    in the universe. With this approach in mind, here are some activities that can
    be added to storytimes to enhance science learning.'
  merge: -1
  img_proc: true
