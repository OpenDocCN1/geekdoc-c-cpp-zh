- pgno: 172
  md: '*To Be a Kid* by Maya Ajmera (Charlesbridge, 1999). The large photographs of
    children all over the world doing what kids do, plus the simple text, make this
    a book perfect for reading at storytimes. Each page could spark interesting interaction.


    *What Is Touch?* by Jennifer Boothroyd (Lerner, 2010). Excellent photographs and
    simple text help fuel the discussion examining our sense of touch. (This is part
    of a wonderful series by Jennifer Boothroyd called *Your Amazing Senses*.)


    # Additional Poems


    +   - “Big” by Dorothy Aldis, in *Read-Aloud Rhymes for the Very Young*, edited
    by Jack Prelutsky (Knopf, 1986), p. 28.

    +   - “Halfway Down” by A. A. Milne, in *Here’s a Little Poem*, collected by Jane
    Yolen (Candlewick, 2007), p. 16.

    +   - “I Am Rose” by Gertrude Stein, in *The Baby’s Good Morning Book* by Kay
    Chorao (Dutton, 1986), p. 54.

    +   - “Look” by Charlotte Zolotow, in *Read-Aloud Rhymes for the Very Young*,
    edited by Jack Prelutsky (Knopf, 1986), p. 25.

    +   - “Singing-Time” by Rose Fyleman, in *Read-Aloud Rhymes for the Very Young*,
    edited by Jack Prelutsky (Knopf, 1986), p. 3.

    +   - “Some Things Don’t Make Any Sense at All” by Judith Viorst, in *Tomie dePaola’s
    Book of Poems*, selected and illustrated by Tomie dePaola (Putnam, 1988), p. 53.


