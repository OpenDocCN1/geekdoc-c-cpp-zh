    for storytimes.


    *Hush Little Baby* by Sylvia Long (Chronicle Books, 1997). The old song gets a
    nature-based reworking in this lovely book. The adorable rabbit illustrations
    and the gentle bedtime theme will appeal to storytime audiences.


    *Hush Little Baby: A Folk Song with Pictures* by Marla Frazee (Browndeer Press,
    1999). The old song, deftly and amusingly illustrated, will find new fans and
    spur a desire for repeated readings.


    *Hush Little Digger* by Ellen Olson-Brown (Tricycle Press, 2006). This funny retake
    on the mockingbird song features many different working vehicles.


    *If You''re a Monster and You Know It* by Rebecca Emberley (Orchard Books, 2010).
    A crowd-pleasing, interactive, singing update of a classic—this is such fun to
