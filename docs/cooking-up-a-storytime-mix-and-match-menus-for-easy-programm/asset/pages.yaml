- pgno: 24
  md: '# # Building Nutritional Programs


    THE NEXT STEP IN CREATING RELEVANT AND ENJOYABLE PROGRAMS FOR OUR children and
    families is to take what we know about how children learn and focus our programs
    on supporting learning as well as entertainment.


    # ## All Dessert, All the Time?


    Librarians love presenting storytimes. We thrive on obsessively selecting the
    perfect developmentally appropriate books, jamming them into themes, hunting down
    related fingerplays and rhymes and songs, memorizing entertaining and beautiful
    stories, and looking for ways to be ever more engaging. We craft our own little
    “Your Favorite Librarian” shows, setting our sights on the satisfaction we feel
    when our entire storytime group sits enraptured, laughing in all the right places,
    amazed at our special talents and expertise. And, certainly, having families return
    week after week and experiencing the increasing devotion that children come to
    show us seem desirable goals. We want families to attend storytimes! We want strong
    storytime numbers for our monthly reports! But when we closely examine our offerings
    in the light of early learning research and standards outside the library walls,
    is this really the best we can do for the children? Are we offering the most nutritious
    storytimes possible, or are they perhaps a bit heavy on the dessert side? Can
    storytimes be more effective in terms of learning for the child and still be highly
    entertaining? The answer to the last question is undoubtedly yes, but because
    we know'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'that children learn by doing, we must be willing to involve the children *much*
    more directly. We must be willing to let go of the “Your Favorite Librarian” solo
    show and invite the children to come with us into the messy early learning kitchen
    where feasts are thoughtfully created and joyously (and often sloppily) eaten.


    # ## Intentionality


    One term that surfaces repeatedly in early learning circles is *intentionality*.
    Teachers of young children are being encouraged to think deeply about their students’
    learning. They are urged to be very intentional: set broad goals, stay alert for
    learning opportunities, introduce concepts, follow the children’s lead, observe
    results, and then evaluate what sort of learning occurred and how they might build
    and enrich that learning. This seems an excellent light in which to examine our
    storytimes as well. If we build a storytime around a theme and place our focus
    on making it highly entertaining, will it contain excellent learning possibilities?
    Perhaps, but how can we tell? If we are doing all the talking during a storytime,
    is measurement of the children’s comprehension, vocabulary, social and emotional
    development, and overall learning even possible? The research is clear that reading
    aloud to young children is the most powerful way of developing their understanding
    and interest in reading. But research is also clear that it is not simply the
    reading aloud that does the trick. It is the *conversation* that surrounds the
    reading that has the greatest impact on children’s skill development (Dickinson
    and Smith 1994). If we do all the talking, we may actually be limiting the children’s
    learning!


    And that is why we want to invite the children into the storytime kitchen. Because
    we want them to do more at storytimes, instead of looking for books and activities
    based on a particular theme, perhaps we should look for books and rhymes that
    encourage interaction and language skill building. For example, an important pre-reading
    skill is retelling. If we want to focus on the skill of retelling at storytime,
    what can we do? We can certainly get the children up on their feet to act out
    a story after they have listened to us read it, but we are still doing most of
    the heavy lifting there, because we are doing the retelling and the children are
    following our directions for the most part. We have not required them to actually
    retell anything. A more interactive way might be to look for a book with memorable
    events, read it aloud in our own unique style, and afterward say, “Let’s talk
    about what happened in this story.” This activity can be very challenging for
    preschool children, as they may need time to truly process a book reading. But
    if we open the book at the beginning and look at each page together one at a time,
    and encourage the children to talk about each illustration, we provide them with
    an opportunity to absorb the story more fully. This strategy is not only a really
    enjoyable way to talk about'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'the book but also a wonderful modeling exercise for caregivers because it provides
    plenty of opportunities for dialogue.


    Another excellent idea, because children are new to the skill of understanding
    story, is to scaffold their understanding of the story by setting up the main
    story points for them *before* we begin reading. For instance, before sharing
    the book *Inch by Inch* by Leo Lionni, we might say, "In this book, a little worm
    finds himself in a scary situation. A bird wants to eat him! He has to find some
    way to fool the bird and get away. Now he''s a very clever worm, and so he finds
    a very clever way to escape. Do you want to read this story together and find
    out how the little worm gets away from the bird? Let''s do!" And then after reading
    the story aloud, we engage the children in a discussion about how the worm got
    away and other aspects of the story that they noticed. In this manner, we are
    deepening their experience with the book, and we are gauging their understanding
    as well. Sharing thus becomes much more intentional.


    Here are some guidelines for incorporating more intentionality in storytimes:


    +   1. Choose each book carefully. Are interactive opportunities embedded in the
    book itself? For example, does the text pose questions to the reader? If not,
    at what points in the book might you pose a question or two in order to engage
    the children more actively and give them a richer understanding of the book? Not
    so many that you lose the thread of the story, but one or two carefully placed
    questions to keep the children''s interest piqued. I also like to look for at
    least one book for the storytime that is very interactive—we might not even read
    the text, but just look at the illustrations or photographs and talk about them
    together. This approach is also an excellent way to incorporate more informational
    texts into storytime.


    +   2. Read through each book and look for any potentially challenging words.
    You might introduce and define them before beginning to read. This way you ensure
    that when the children hear the word during the reading of the story, they won''t
    be distracted by the mystery of it, but will remain engaged with the story instead.


    +   3. Before beginning to read the story, hold up the cover of the book and ask
    the children, "What do you see?" Ask open-ended questions until the children have
    established enough about the cover to guess what the book is about. Involving
    the children in this way not only offers you the opportunity to set up the story
    but also provides an engaging way to attract the children''s attention.


    +   4. If we really want children to have a rich understanding of the stories
    that we read to them, ideally we should read them more than once. Children love
    reading the same books over and over (however, their caregivers would'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'probably stop attending storytimes, and they are usually the ones responsible
    for transportation!). In place of rereading books, try the retelling scenario
    mentioned earlier. You can say, “Let’s talk about what happened in that story.”
    Then, remembering that it takes children time to process and formulate their thoughts,
    allow them to ponder. If responses are still not forthcoming, open the book and
    allow the illustrations to spur their memories. (After all, it’s *their* skills
    that we are hoping to develop!) If I want the children to act out a story after
    we have read it together, I have them retell it with me in this fashion first
    and *then* get them up on their feet.


    +   5. Look for math concepts that could be introduced through the book: size,
    shape, pattern, time, age, distance, comparison, amount—all books contain some
    mathematical concepts. For example, if you’re sharing a book about animals, you
    could introduce the concepts of big, small, fast, slow, thick, thin, soft, rough,
    old, young, bright, dull, and so on.


    +   6. What science concepts could be introduced through this book? Look for habitat,
    life cycle, prey and predator, ecosystems, light and shadow, weather, anatomy,
    gravity, and the like. For example, after you have shared the book *Fiesta* by
    Ginger Foglesong Guy, you might bring out a top like the one pictured in the book
    and ask, “Do you remember this from the book?” Then engage the children in a dialogue
    about how tops spin. (For large groups, you could demonstrate the top spinning
    and “wonder” how it is able to keep spinning. Encourage the children to find the
    answer in the library.) Or after sharing *Hush, A Thai Lullaby* by Minfong Ho,
    you might go back through the book page by page, point out the creature on each
    page, and ask the children if that creature lives near them. The creatures featured
    first are a mosquito and farm animals, which may be familiar to most children,
    but as the book progresses, the animals become more particular to Thailand, which
    would open an opportunity to converse about the world’s many diverse creatures.


    +   7. Next think about what fingerplays, songs, and stories you want to use and
    why. You want to include fingerplays that children can imitate and join in on,
    as well as ones in which they are partners in creation. The fingerplays and action
    verses written for this book are designed to elicit contributions from the children,
    thus enhancing their involvement and engagement. Combining these fingerplays and
    verses with your own collection of incredible fingerplays will provide delicious
    and nutritious language play for storyline.


    +   8. What connections can you make to the real lives of the children? Have they
    ever visited a place like the one described in the book? Are their family members
    similar to characters in the story? Have they ever played in the snow? Dressed
    themselves? Eaten these foods? Seen that kind of animal?'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'This process of connecting the stories to the lives of the children enriches
    their experience with the book.


    +   9. Think about how you might engage more of the children’s senses. Can you
    introduce real items for them to touch and smell? Can movement be incorporated
    in some way?


    This list may seem like a lot of extra work, but it’s actually just a change in
    the way we approach our planning. We certainly don’t want to jam every single
    skill-building possibility into every single storytime, but we can easily add
    excellent nutrition and interesting seasonings to each meal. And the wonderful
    part of it is that we don’t have to give up the sweets that we love! We are simply
    creating story-times that are an entire feast and not simply a single serving
    of dessert!'
  merge: -1
  img_proc: true
