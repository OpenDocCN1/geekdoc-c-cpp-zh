    *Trash Town* by Andrea Zimmerman (HarperCollins, 1999). An adorable and accessible
    story with a wonderful repetitive chant.


    *Can You Make a Scary Face?* by Jan Thomas (Beach Lane Books, 2009). This book
    has it all—simple text, bold illustrations, embedded movement prompts, and a large
    dose of hilarity. Highly interactive!


    # Suggested Informational Title


    *Spikey, Slimy, Smooth: What Is Texture* by Jane Brocket (Putnam and Grosset,
    1997). This book features large, evocative photographs of many items of differing
    textures. The embedded questions make this a wonderful interactive read for storytime.'
