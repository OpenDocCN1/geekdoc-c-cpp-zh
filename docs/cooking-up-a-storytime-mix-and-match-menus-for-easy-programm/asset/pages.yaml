  md: '# **Fingerplay or Story**


    Grocery Cart (chapter 4)


    # **Poem**


    “Twinkle, Twinkle” by Lewis Carroll, in *Read-Aloud Rhymes for the Very Young*,
    edited by Jack Prelutsky (Knopf, 1986), p. 46.


    # **Interactive Game**


    Categories (chapter 6)


    # **Math Activity**


    Clap and Count (chapter 7)


    # **Science Activity**


    Gravity (chapter 8)


    # **Additional Fiction Titles**


    *Bear’s Picture* by Daniel Pinkwater (Houghton Mifflin, 2008). A fun book to read
    aloud and a wonderful lesson about art. Paint on!


    *Bears on Chairs* by Shirley Parenteau (Candlewick, 2009). This is a sweet book
    about solving a problem—not enough chairs for the number of bears. Could lead
    to some interesting discussion.


    *Black, White, Day, Night* by Laura Vaccaro Seeger (Roaring Brook Press, 2006).
    This simple concept book is great for initiating conversations and making connections
