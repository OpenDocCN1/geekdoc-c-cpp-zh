  md: '# Counting Sheep


    Here''s a little woolly sheep


    *(hold up the sheep in your hand that is opposite the flannelboard)*


    Who wants to say good night.

    Count her leaping over


    *(`leap` the sheep over yourself and place her on the flannelboard)*


    To help us sleep tight.

    ONE!

    How many sheep do you see?

    You''re right, just one!


    ![](img/726487289a66f26aae16af221d544409_88_0.png)


    Here''s another woolly sheep

    Who wants to say good night.

    Count him leaping over

    To help us sleep tight.

    TWO! *(place the second sheep on the flannelboard next to the first sheep)*

    How many sheep are there now?

    Let''s count them together.

    One, two.

    How many?


    *(Encourage the children to count out loud as you point to each sheep. Each time
    you finish counting sheep on the board, ask the children, “How many?” This approach
    helps the children to understand cardinal numbers—the numbers that stand for how
    many items they see at once.)*


    # Subitizing Leaves


    This flannelboard gives the children practice subitizing without counting. Young
    children will have better success at subitizing if the number of items is six
    or fewer. (To work on counting higher than ten, make many more flannelboard pieces.)


    ![](img/726487289a66f26aae16af221d544409_88_1.png)


    One little leaf in the autumn,

    Fallen from the tree.

    One little leaf in the autumn.

    How many do we see?'
