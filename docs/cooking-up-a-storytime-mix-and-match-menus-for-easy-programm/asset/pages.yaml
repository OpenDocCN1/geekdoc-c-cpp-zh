  md: '# Fruits and Veggies


    *Supplies*


    +   - assortment of fruits or vegetables or both

    +   - attractive grocery sack


    *Directions*


    Tell the children that you are going to show them many different kinds of fruits
    and vegetables. Pull the items out of the grocery sack one at a time and engage
    the children in a conversation about how the various fruits and vegetables look,
    how they feel, how they smell, and how they taste. Pass them around for the children
    to handle and explore. “Have you ever tasted one of these before?” “What did you
    think?” “How did it taste? Sweet? Sour? Bitter?” Talk about different tastes.


    # Gravity


    *Supplies*


    +   - two objects of differing shape, size, or weight or any combination of these
    attributes


    *Directions*


    Stand in front of the children and hold the two objects out in front of you at
    the same level. Ask the children what they think will happen when you drop the
    objects at the same time. Will the objects float up? Will they fall down? How
    can we make a prediction? Drop the objects. Engage the children in a conversation
    about why they think the objects did what they did. If possible, pass out objects
    and allow the children to experiment with dropping them. Encourage the caregivers
    to talk with the children about what happens.


    # Heavy and Light


    *Supplies*


    +   - assorted objects of varying weight (for example, a feather, brick, marshmallow,
    big, pebble, rock, scarf, metal pipe, paper cup, cast-iron pot, cork, dinner plate,
    empty bottle, full bottle, leaf, bowling ball, yarn, melon, balloon, barbell)


    *Directions*


    Tell the children that today you are going to explore “heavy” and “light.” Pass
    the objects around the room and encourage everyone to handle them. After the children
    have investigated each object, encourage everyone to sit back down or quiet down
    from the sharing. Ask each child to bring an object to you and then ask the group
    if they think that object is heavy or light. Place the heavy objects on one side
    of you and the light objects on the other. If you like, record the results on
    a chart.'
