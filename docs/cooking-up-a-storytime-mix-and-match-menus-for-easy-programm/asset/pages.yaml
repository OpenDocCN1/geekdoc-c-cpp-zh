  md: '*One Windy Wednesday* by Phyllis Root (Candlewick, 1996). This book’s small
    format might make it challenging for large groups, but the amusing story has too
    much child appeal to pass up!


    *The Piggy in the Puddle* by Charlotte Pomerantz (Macmillan, 1974). One of the
    most challenging and hilarious books to read aloud! If only it would be reissued
    in a larger format for storytimes. A favorite!


    *Rosie’s Walk* by Pat Hutchins (Simon and Schuster Books for Young Readers, 1968).
    A classic about a busy hen and an unlucky fox.


    *Silly Little Goose* by Nancy Tafuri (Scholastic, 2001). Wonderful, large illustrations
    and a repeating phrase make this a nice choice for a farm storytime.


    *Summer Sun Risin’* by N. Nikola-Lisa (Lee and Low Books, 2002). Rhyming poems
    on each page follow a young farm boy from dawn to night on a hot summer day.


    *Ten Little Mice* by Joyce Dunbar (Harcourt Brace Jovanovich, 1990). The vividness
