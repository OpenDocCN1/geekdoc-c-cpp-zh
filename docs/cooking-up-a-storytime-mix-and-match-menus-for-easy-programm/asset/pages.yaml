  md: '# Suggested Informational Title


    *The Animal in Me Is Very Plain to See* by Laurie C. Tye (WestWinds Press, 2005).
    Nice photographs and a spare format in which emotions are described and types
    of animals are pictured. The visual nature of this book might help some children
    put names to certain feelings.


    # Fingerplay or Story


    Feelings (chapter 4)


    # Poem


    “Sometimes” by Jack Prelutsky, in *Read-Aloud Rhymes for the Very Young*, edited
    by Jack Prelutsky (Knopf, 1986), p. 80.


    # Flannelboard


    Child’s Face (chapter 5)


    # Interactive Game


    Emotion Vocabulary (chapter 6)


    # Math and Science Activity


    Make an emotion chart with different emotions listed across the top. Going emotion
    by emotion, ask the children how many have felt that emotion in the last couple
    of days. Count which emotions seem most common. Talk together about what the emotions
    look like, focusing on specific facial features. For example, when someone is
    happy, her mouth smiles, her eyebrows go up, her eyes sparkle. When someone is
    sad, his mouth droops down, his eyebrows scrunch together, and his eyes tear up.


    # Additional Fiction Titles


    *Anger*


    *Sometimes I’m Bombaloo* by Rachel Vail (Scholastic, 2002). Excellent look at
    the enormity of anger and how it can sometimes feel scary.


    *Where the Wild Things Are* by Maurice Sendak (Harper and Row, 1963). Every child
    deserves to hear about the wild things. Let the rumpus begin!


    *Fear*


    *The Gruffalo* by Julia Donaldson (Dial Books for Young Readers, 1999). Children
    delight at the repeating refrain and the different animal snacks the mouse mentions
    to scare away predators. But the book could be a wonderful discussion starter
    about unfounded fears.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# *Frustration*


    *“I''m Not Cute!”* by Jonathan Allen (Hyperion Books for Children, 2006). A young
    bird becomes frustrated by always being called “cute” no matter what he is doing
    or feeling.


    # *Happiness*


    *The Feel Good Book* by Todd Parr (Little, Brown, 2002). A tour through many things
    that might make one feel good—silly, active, sweet. There are many conversation
    starters in this bright book.


    *Mouse in Love* by Robert Kraus (Orchard Books, 2000). Simple text and wonderful
    pictures make this look at love a great choice for preschoolers.


    # *Moodiness*


    *The Grouchy Ladybug* by Eric Carle (HarperCollins, 1996). The “growing page”
    format, the repetition, and the amusing grouchy ladybug make this a nice choice.
    Plus, the clock on each page could lead into a learning moment about time.


    *Grump Growl* by bell hooks (Hyperion Books for Children, 2008). The simplicity
    of the text, aided by the incredibly evocative illustrations, makes this an excellent
    example of grumpiness. This book begs for discussion and connection to the children’s
    own experience.


    *Grumpy Bird* by Jeremy Tankard (Scholastic, 2007). Preschoolers will delight
    in the antics that ensue when a grumpy little bird takes a walk.


    *I Love It When You Smile* by Sam McBratney (HarperCollins, 2005). It takes some
    muddy silliness to finally make the little kangaroo smile.


    # *Worry*


    *Leo the Late Bloomer* by Robert Kraus (Windmill Books, 1971). Leo’s father worries
    as Leo takes his time growing up. This is a lovely book about patience and allowing
    children time to grow up at their very own pace.


    *Llama, Llama, Red Pajama* by Anna Dewdney (Viking, 2005). Little Llama’s worry
    at bedtime is both familiar and entertaining.


    *Owen* by Kevin Henkes (Greenwillow, 1993). Even though the illustrations are
    small, the fun language and familiar sentiment in this wonderful book make it
    an effective choice for storytimes.


    # *Various*


    *How Are You Feeling? Foods with Mood* by Saxton Freymann (Arthur A. Levine Books,
    1999). A classic title showing many different kinds of feelings but using food
    items as the characters. Preschoolers really love these photographs!'
