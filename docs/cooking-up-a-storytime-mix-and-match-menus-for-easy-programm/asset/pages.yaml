  md: '# # Language Play


    THE NEXT ESSENTIAL INGREDIENTS FOR OUR STORYTIME PANTRY ARE THE rhymes and fingerplays
    that enhance our children’s love for words and language.


    # ## Language and Learning


    Seasoned librarians practice the rich library tradition of sharing fingerplays
    and action verses with young children and their caregivers. Our library shelves
    are filled with volumes of delightful verses to use with children, and with access
    to the Internet, it’s as easy to find entertaining fingerplays, action verses,
    and stretchers as it is to type “fingerplays cows” on the keyboard. As we know
    from the research behind *Every Child Ready to Read*, these verses increase vocabulary
    skills, narrative skills, phonological awareness, listening skills, and knowledge
    about the world. Plus, they are really, really fun! Preschool children learn a
    great deal through imitation, and the fingerplays that we employ are wonderful
    for encouraging imitation. When we repeat their rich vocabulary and incorporate
    movement, song, or chant, we literally bathe children in language.


    Incorporating more interaction into our language play with children, asking the
    children themselves to make more of a contribution, will add even more to their
    learning. By asking for their contribution, we ask them to listen to the question
    posed, ponder an answer, relate it to what they already know, brainstorm ways
    to contribute, and finally articulate their idea to the group. This is very active
    learning! Plus, when the children are part of the creation, the verse will constantly
    change'
  merge: -1
  img_proc: true
