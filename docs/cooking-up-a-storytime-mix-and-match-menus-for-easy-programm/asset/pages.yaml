- pgno: 40
  md: '*Zoo Pairs* by Patricia Whitehouse (Heinemann Library, 2002). An excellent
    book that examines the concept of pairs. The photographs of animals and the easy
    text make this a nice choice for preschool storytimes.


    # ## Singing Stories


    Singing is one of the most effective and enjoyable ways to help children hear
    the smaller parts in words. It automatically breaks words up into syllables. And
    it slows down pronunciation allowing the individual sounds to be highlighted.
    Plus, song lyrics most often rhyme! These are all excellent ways to build the
    phonological decoding skills that are a necessary part of being ready to read.
    Children don''t care if you can carry a tune or not, but if self-consciousness
    is going to keep you from singing at storytimes, then by all means use a CD or
    iPod and encourage everyone to sing along!


    To inspire more music at storytime, here are some wonderful books that will encourage
    singing:


    +   - *A You''re Adorable* by Buddy Kaye (Candlewick, 1994). Martha Alexander''s
    sweet illustrations really help bring this wonderful book to life. If you don''t
    know the tune, there is a wonderful *Sesame Street* video of it on YouTube!

    +   - *All the Pretty Little Horses: A Traditional Lullaby*, illustrated by Linda
    Saport (Clarion Books, 1999). Lovely, muted illustrations and a soft lullaby make
    this a nice choice for a gentle storytime book.

    +   - *A-Tisket A-Tasket* by Ella Fitzgerald (Philomel Books, 2003). The old rhyme
    gets a facelift through Ella''s jazzy lyrics and the vibrant illustrations.

    +   - *Cat Goes Fiddle-I-Fee* by Paul Galdone (Clarion Books, 1985). The old cumulative
    song is accompanied by Galdone''s wonderful illustrations in this classic for
    preschoolers.

    +   - *Down by the Bay* by Raffi (Crown, 1987). Nadine Bernard Westcott''s amusing
    illustrations make this a fun and silly title to share.

    +   - *Down by the Station* by Will Hillenbrand (Harcourt Brace, 1999). In this
    appealing version of the song, the little engine picks up baby animals from all
    over town (including the children) and drops them at the zoo.

    +   - *Five Little Ducks* by Raffi (Crown, 1989). The well-known song features
    wonderful illustrations by Jose Aruego. (Raffi has many more songbooks.)

    +   - *Five Little Monkeys Jumping on the Bed*, illustrated by Eileen Christelow
    (Clarion Books, 1989). This song counts backward from five, children love singing
    and jumping along, and that is what we affectionately call *playing with numbers*.'
  merge: -1
  img_proc: true
