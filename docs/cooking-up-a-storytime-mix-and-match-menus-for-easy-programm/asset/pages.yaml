- pgno: 10
  md: '# # preface


    THE TASTE OF MY GRANDMOTHER''S FRESHLY BAKED BREAD; the sight of my mother''s
    juicy, golden stuffed turkey, fresh from the oven; the spicy, exotic scent wafting
    over the backyard fence from my Armenian neighbor''s barbecue: these food memories
    connect me with my childhood and the people whom I loved. The preparation and
    sharing of food is an essential and pleasurable human experience. It is comfort,
    warmth, and love. But more than sitting down to a great meal, the fun for me was
    actually being invited *into* the kitchen: perching on a stool, overlooking or
    being asked to participate in the chopping, sifting, flipping, and stirring; dipping
    a spoon into the pot; experiencing the sheer delight of tasting—that was heaven.
    And it was in those kitchens that I realized that exceptional cooking doesn''t
    just happen. It requires observation, training, practice, and passion. It is the
    culmination of coming to understand ingredients, putting them together in delectable
    ways, experimenting, and finally, and most importantly, sharing with people you
    love.


    I find many similarities between the preparation of delicious food and the preparation
    of exceptional storytimes. Passionate children''s librarians are rather like great
    chefs: language provides the ingredients they select, sift, stir, and portion
    out in perfect servings in order to feed the developing hearts and minds of the
    young children in their communities. So with that comparison in mind, I''ve compiled'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'this storytime cookbook, filling it with what I hope will be delicious and
    nutritious ideas to serve hungry children and the people who care for them.


    The first chapter covers the basics: an overview of the knowledge and experience
    that will help make storytime creation developmentally appropriate, culturally
    sensitive, and packed with opportunities for learning. The second chapter provides
    ideas for rethinking storytime planning in order to maximize the learning opportunities
    for the children and caregivers in attendance. The subsequent chapters offer a
    wide variety of storytime ingredients—books, fingerplays, flannelboards, games,
    poetry, and math and science activities. And the book concludes with a series
    of “menus” for storytimes.


    The focus of this book is predominantly the creation of preschool storytimes,
    and the menus largely reflect that. My hope is that you, dear readers, will use
    the ideas in this book as starting points for creating the tastiest storytimes
    possible, thus continuing to make your libraries vital, cherished, and essential
    centers of your early learning communities.'
  merge: -1
  img_proc: true
