    # ## Science Activity


    Bees (chapter 8)


    # ## Additional Fiction Titles


    +   - *Beetle Bop* by Denise Fleming (Athenaeum Books for Young Readers, 2002).
    Wonderful vocabulary, rhyme, and oversized vibrant illustrations make this a nice
    choice. The text is simple so there are many opportunities to engage the children
    in discussion and observation.

    +   - *Be Nice to Spiders* by Helen Graham (HarperCollins, 1967). The illustrations
    in this classic are rather small and detailed, but all children should hear this
    wonderful story read aloud at least once. And there are some great spider-science
    connections that might spark discussion.

    +   - *Bugs for Lunch* by Margery Facklam (Charlesbridge, 1999). This realistic
    rhyming book looks at the many creatures (including humans!) that eat bugs. The
    illustrations are large, attractive, and ideal for storytime, and the content
    will likely generate a lot of wonderful discussion!

    +   - *Butterfly, Butterfly* by Petr Horáček (Candlewick, 2007). Bright illustrations,
