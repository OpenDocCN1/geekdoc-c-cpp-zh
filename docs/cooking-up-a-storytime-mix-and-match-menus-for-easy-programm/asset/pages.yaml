- pgno: 93
  md: '# FLANNELBOARDS WITH MOVEMENT OR HANDS-ON PARTICIPATION


    # Five Brown Buns


    Using traditional rhymes at storytimes connects our modern children to the canon
    of western literature, plus the rhymes have wonderful vocabulary and rhythm. To
    add interest and participation to "Five Brown Buns," have five children line up
    against a wall to the right or left of where you sit. Give them each a penny and
    place five brown bun pieces on the flannelboard. Sing the rhyme together and encourage
    the five children, one at a time, to walk across the room, stop to hand you a
    penny at the appropriate time, and take a bun from the flannelboard. With the
    entire group, count the buns left on the board and then sing the rhyme again as
    the next child walks across the room to "buy" a bun. It may seem as though you
    are singing the rhyme a thousand times (which for large groups may be about right),
    but the children and their caregivers really seem to enjoy this activity, and
    it truly seals the rhyme in everyone''s memory.


    Five brown buns in the bakery shop,

    Five brown buns with sugar on top,

    Along came a fellow/gal with a penny in his/her hand,

    He/She took one bun,

    And away he/she ran.


    ![](img/726487289a66f26aae16af221d544409_93_0.png)


    # Love Tree


    For this flannelboard, place the tree trunk on the board. Pass out a flannelboard
    piece to each child. You may have to work in groups if you have very large storytimes.
    The pieces might be red and pink hearts for Valentine''s Day or assorted green
    hearts to celebrate the return of spring. Tell the children that when it is their
    turn to give their "leaf" to the tree, they will say, "Here is my love for Tree"
    or "Here is a leaf for Tree." Practice that line several times with the children
    so they are comfortable in their knowledge of it. Then begin the story.


    ![](img/726487289a66f26aae16af221d544409_93_1.png)


    ![](img/726487289a66f26aae16af221d544409_93_2.png)'
