- pgno: 174
  md: '*Jazz Baby* by Carol Boston Weatherford (Lee and Low Books, 2002). An energetic
    rhyming book featuring many children singing and dancing. Fun!


    *Jim and the Beanstalk* by Raymond Briggs (Putnam and Grosset, 1997). A hilarious
    story about a needy giant. It''s a longer story, but the humor will captivate
    the audience, and the possibility of measurement activities following the reading
    helps make this an excellent choice.


    *Miss Mary Mack: A Hand-Clapping Rhyme* by Mary Ann Hoberman (Little, Brown, 1998).
    The popular and silly song is accompanied by hilarious illustrations and followed
    by creative ideas on how to share the book with children.


    *No Dinner! The Story of the Old Woman and the Pumpkin* by Jessica Souhami (Marshall
    Cavendish, 1999). This retelling of an old Asian folktale features many opportunities
    for repeating phrases. Plus, it''s a highly entertaining story.


    *Please Don''t Slam the Door* by Dori Chaconas (Candlewick, 2010). A romping,
    circular story that rhymes and is funny!


    *Shout! Shout It Out!* by Denise Fleming (Henry Holt, 2011). Bold illustrations
    encourage children to shout out many conceptual categories: numbers, colors, letters
    of the alphabet, modes of transportation, and animals.


    *Ten Black Dots* by Donald Crews (Greenwillow, 1986). A wonderful counting book
    and a wonderful inspiration for using black dot stickers in creative ways.


    *This Is the Bear* by Sarah Hayes (Candlewick, 1993). A simple rhyming story about
    a stuffed bear that has an adventure at the dump. Discussions about beloved possessions
    or garbage or both could be very interesting and entertaining!


    *This Land Is Your Land* by Woody Guthrie, illustrated by Kathy Jakobsen (Little,
    Brown, 1998). The detailed folk art illustrations may be too intricate for full
    storytime sharing, but the song can carry the book.


    *A Tree Is Nice* by Janice May Udry (Harper, 1956). The 1957 Caldecott winner
    is a lovely, calm book to share with preschoolers.


    *Would You Rather ...* by John Burningham (Crowell, 1978). Though this may be
    a bit long for many storytime children, the silly questions posed on each page
    make it a highly interactive and very entertaining book to share in part at storytimes.


    # **Additional Informational Titles**


    *A Cool Drink of Water* by Barbara Kerley (National Geographic Society, 2002).
    A photographic journey portraying people around the world enjoying a cool drink
    of water. Gorgeous.'
