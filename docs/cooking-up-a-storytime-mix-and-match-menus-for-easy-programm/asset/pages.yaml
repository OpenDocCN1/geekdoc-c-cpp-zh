  img_proc: true
- pgno: 120
  md: '# ### Life Cycle of a Frog


    *Supplies*


    +   - photographs showing the life cycle of a frog or a book about the life cycle
    of a frog


    *Directions*


    Show the children the photographs or the book. Engage them in a discussion about
    their experiences with frogs: "Have you seen frogs before?" "Where did you see
    them?" "What kind of environment were they in?" "What sorts of plants were around
    them?" "What sounds do they make?" and so on.


    # ### New Moon/Full Moon


    *Supplies*


    +   - photographs of the moon in different stages of waxing and waning


    *Directions*


    Show the photographs and let the children tell you what they see. Wonder about
    the fact that the moon looks different sometimes. Engage the children in a conversation
    about their observations of the moon. You needn''t explain the science behind
    the phases of the moon. You are simply encouraging the children to share what
    they know or attempting to spark their interest in the night sky. You might, however,
    identify the full moon and the new moon for vocabulary growth.


    # ### Prisms and Light


    *Supplies*


    +   - prism

    +   - flashlight


    *Directions*


    Show the prism to the children and ask them to tell you what they notice about
    it. Turn the flashlight on and shine it at the prism. Encourage the children to
    describe what they see. You might use this activity to engage the children in
    a conversation about rainbows: "Have you ever seen a rainbow?" "Where did you
    see it?" "What did it look like?" and so on.


    # ### Ramps


    *Supplies*


    +   - a length of cardboard or a length of timber (a wider piece will make the
    "experiment" easier as the objects will not fall off the side)

    +   - two different objects (for example, a ball, a toy car, a pencil, a plastic
    animal, a block)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '*Directions*


    Set the cardboard or wood from a table to the floor, creating a ramp. Place the
    two different objects at the top of the ramp and ask the children to predict which
    object will roll down the ramp the fastest. Roll the objects and wonder about
    what happened. Do this a few times to test the results. Leave the ramp up after
    storytime so the children can experiment and play with them.


    # Rocks and Minerals


    *Supplies*


    +   - rocks of different textures, shapes, and sizes (for example, smooth river
    rocks, small pebbles, large granite stones, flat slate, quartz, gemstones, rolled
    and polished rocks, man-made bricks, and the like)


    *Directions*


    Pass the rocks around for the children to handle or invite them to explore the
    rocks around a table. Engage them in a conversation about the rocks: “Where can
    you find river rocks like these?” “What does slate feel like?” “How are pebbles
    and amethyst alike?” “How are they different?” and so on. Display some rock and
    mineral guides for checkout if possible.


    # Seashells


    *Supplies*


    +   - a variety of seashells


    *Directions*


    Pass the seashells around to the children. Allow plenty of time for them to look
    at them, handle them, smell them, and so on. Talk about the shells together: “What
    do they look like?” “Where might they have come from?” “Who might use shells like
    these?” and so on.


    # Seeds


    *Supplies*


    +   - photographs of the life cycle of a seed or a book about the life cycle of
    a seed


    *Directions*


    Share the photographs or book with the children. Open a package of seeds for the
    children to see. Sunflower or pumpkin seeds make a nice display because they are
    rather large. Compare the real seeds to the seeds in the photographs or book.
    Perhaps plant a seed in early spring in a cup or pot and check on the seed’s progress
    every week during the spring and summer. Pass out seeds for the children to plant
    at home.'
