  md: 'develop the children’s vocabulary around comparison—tall, short, wide, narrow,
    high, low, fast, slow, small, large, old, young, dark, light, open, closed, and
    so forth.


    # Math Activities


    Keeping fun foremost in our minds when planning learning experiences for children,
    the following activities can be easily added to storytimes to make them more math-friendly.


    # Attributes


    # *Supplies*


    +   - selected opposing attributes (for example, big/little, near/far, heavy/light,
    wide/narrow, long/short, dark/light)

    +   - objects in the storytime room


    # *Directions*


    Choose one set of opposing attributes on which to focus attention during a storytime
    (for example, big and little). If you have a small group, point to something in
    the classroom and ask a child if that item is big or little. Choose another item
    and ask a different child if that item is big or little. If you have a large group,
    point to an object and ask the group to decide if it is big or little.


    # Clap and Count


    Explain to the children that you are going to clap and count together, but you’re
    going to start not at one, but somewhere “in the middle.” Clap and count starting
    at 8 or 3, or better yet, 11. If you do this activity often at storytime, you
    might let the children choose the starting number. That allows them to let you
    know the level of their counting skills; perhaps they are very comfortable with
    one through ten but struggle with eleven through twenty.


    # Counting Fingerplays


    Before you use a counting fingerplay, tell the children, “Let’s do a counting
    fingerplay now.” This draws the children’s and their caregivers’ attention to
    the concept of counting! It’s easier for preschool children to use fingerplays
    that count up at first and count backward at a later point. And involving their
    bodies adds even richer learning!'
