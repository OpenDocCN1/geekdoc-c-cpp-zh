  md: '*It’s Rainy Today* by Kristin Sterling (Lerner, 2010). Excellent photographs
    and simple sentences present all sorts of potential discussion ideas about rain.
    This is one in a series about different kinds of weather.


    # ADDITIONAL POEMS


    **“Ladybug”**　　　　　　　　　　　　　　　　　*(Anonymous)*


    Ladybug,

    Ladybug,

    Ladybug,

    Don’t fly away.

    You’re good for my garden,

    Please, ladybug—stay.


    **“The Storm”**　　　　　　　　　　　　　　　　*(Anonymous)*


    The thunder crashed,

    The lightning flashed,

    And all the world was shaken.

    The little pig

    Curled up his tail,

    And ran to save his bacon!


    This is also the menu in which to feature any poems that you love!


    # Seashore


    # Suggested Fiction Titles


    +   - *Little Fish Lost* by Nancy Van Laan (Atheneum Books for Young Readers,
    1998). An adorable story with interesting language and lots of opportunities for
    children to join in on repeating phrases.

    +   - *All You Need for a Beach* by Alice Schertle (Silver Whistle/Harcourt, 2004).
    Beginning with one grain of sand, this beautifully illustrated book explores the
    seashore in a very entertaining way.

    +   - *I’m the Biggest Thing in the Ocean* by Kevin Sherry (Dial Books for Young
    Readers, 2007). This book not only is highly entertaining but also introduces
    a lot of sea creatures as well as the concepts of bigger and smaller.'
