- pgno: 123
  md: '# ## Texture


    # ### Supplies


    +   - objects with varying textures (for example, sandpaper, velvet, corduroy
    fabric, play dough, metal, a block of wood, plastic bubble wrap, rubber, glass,
    rocks, fur, Gak, and the like)


    # ### Directions


    Pass the different-textured objects around for the children to handle, or place
    them on a table for the children to explore before the storytime begins. Hold
    up each object one at a time and talk with the children about its attributes:
    “What does it feel like?” “What makes it feel that way?” “Which objects are similar
    in texture?” “Which ones are different?” and so on.


    # ## Today''s Weather


    # ### Supplies


    +   - posterboard with various weather icons across the top: sun, wind, rain,
    clouds, snow, and the like


    # ### Directions


    Before storytime, talk about the weather outside. Compare it to the last time
    you gathered for storytime. Ask the children which icon best represents the weather
    today. Place a mark or marker under that icon. Look at the chart after many sessions
    and discuss any patterns the children see. Use the chart to generate discussion
    about weather and touch on the seasons.


    # ## Wild and Domestic


    # ### Supplies


    +   - photographs of wild animals and their domesticated cousins—for example,

    +     - dogs and wolves, foxes, coyotes, dingoes

    +     - cats and lions, tigers, leopards, jaguars, pumas

    +     - pigs and wild boars

    +     - goats and mountain goats


    # ### Directions


    Share the photographs of the wild animals and their domesticated cousins. Talk
    about the similarities and differences.'
