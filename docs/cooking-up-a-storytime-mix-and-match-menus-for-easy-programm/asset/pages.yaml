    *Once I Ate a Pie* by Patricia MacLachlan (Joanna Cotler Books, 2006). Share a
    poem from this wonderful book.


    *What Puppies Teach Us: Life Lessons from Our Little Friends* by Glenn Dromgoole
    (Willow Creek Press, 2003). Adorable photos accompany life lessons in this often
