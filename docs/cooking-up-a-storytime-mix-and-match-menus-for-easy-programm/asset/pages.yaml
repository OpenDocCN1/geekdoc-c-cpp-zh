  md: '# ## Numbers and Operations


    The skills in the numbers and operations category include counting, comparing,
    grouping, partitioning, and composing. Preschoolers with hands-on experiences
    in these skills will begin school with a strong math foundation.


    When working on numbers and operations skills, it’s important to note that we
    are not simply encouraging rote memorization of counting numerals, but fostering
    an understanding of number sequence. So we want children to be able to count in
    the proper order without omitting numbers, but we also want them to comprehend
    that four is more than three and less than five. We want them to comprehend what
    the numeral 4 actually means.


    # *Counting*


    Of course, counting is a huge part of numbers and operations. Before children
    can move on to more challenging math concepts, they must master counting. And
    in order to do that, they must have a firm grasp on the three aspects of counting:


    +   1. *Number sequence* (1, 2, 3, 4, 5, etc.)

    +   2. *One-to-one correspondence*—1 symbolizes one of something, 5 symbolizes
    five of something, and so on

    +   3. *Cardinal number*—the last number named when counting a set tells how many
    items are in that set (the quantity)


    We can help children develop number sequence by giving them plenty of practice
    counting. We also want to count past ten whenever possible because in English,
    the numbers eleven through nineteen have a different pattern than other sets of
    ten. (If they were like twenty through twenty-nine, we would count “ten-one, ten-two,
    ten-three” instead of “eleven, twelve, thirteen.”) And since most of the books
    we share at storytime count only from one to ten (or count backward from ten to
    one), any practice we can offer for counting past ten will help support children’s
    understanding of that atypical number sequence.


    To encourage the grasp of one-to-one correspondence, we can provide plenty of
    practice in seeing how many items make up a spoken number. For example, we can
    place one item in front of us or on the flannelboard and say, “Here is one.” Then
    present another object and say, “And now we have two.” Once we have placed all
    the objects before the children or on the flannelboard and counted them, we then
    ask the magic question, “How many do we have?” This sort of scaffolding helps
    develop the concept of cardinal numbers as well as one-to-one correspondence.


    Using counting words as often as possible during storytime is an easy way to help
    children absorb number concepts without direct instruction. For example, you might
    say: “I have *three* books today. Which one shall we read *first*?” “You all walked
    in through the *two* doors to the meeting room.” “I am sitting by my *one'
