  md: '*Down by the Station* by Jennifer Riggs Vetter (Tricycle Press, 2009). This
    play on the old song features sweet illustrations and a plethora of modes of transportation.


    *Fast Food* by Saxton Freymann (Arthur A. Levine Books, 2006). The master of food
    manipulation provides a clever and hilarious look at transportation. Children
    will enjoy guessing the different food items.


    *Freight Train* by Donald Crews (Greenwillow, 1978). This simple book combines
    colors, train cars, and great vocabulary. A must-read for all ages.


    *Goodnight, Goodnight, Construction Site* by Sherri Duskey Rinker and Tom Lichtenheld
    (Chronicle Books, 2011). A rhyming story about construction vehicles getting ready
    for “bed.”


    *Honk Honk! Beep Beep!* by Daniel Kirk (Disney/Hyperion Books, 2010). A rhyming
    story with a repeating refrain and large, adorable, Lego-like illustrations.


    *Hush Little Digger* by Ellen Olson-Brown (Tricycle Press, 2006). This funny retake
    on the mockingbird song features many different working vehicles.


    *I’m Fast!* by Kate McMullen (Balzer and Bray, 2012). Children will thrill at
    the race between the car and the train. And everyone will love the playful vocabulary.


    *I’ve Been Working on the Railroad*, edited by Ann Owen (Picture Window Books,
    2003). An interesting introduction and the use of just one verse make this a nice
    addition to storytimes with a wide age range among attendees.


    *It’s Funny Where Ben’s Train Takes Him* by Robert Burleigh (Orchard Books, 1999).
    A rhyming story about a young boy and the train adventures that he creates for
    himself. The repeating line will help involve the children in telling the story.


    *Machines Go to Work* by William Low (Henry Holt, 2009). Every other page poses
    a question about some form of transportation or another, making this a highly
    interactive and nicely illustrated storytime book.


    *Tugga-Tugga Tugboat* by Kevin Lewis (Hyperion Books for Children, 2006). Tugboats
    are almost as interesting as dinosaurs, so this vivid book with its bright illustrations
    will appeal to children at storytime.


    *What Do Wheels Do All Day?* by April Jones Prince (Houghton Mifflin, 2006). The
    large format, simple rhyming text, and vivid cut-paper illustrations make this
    a winner.


    # **Additional Informational Titles**


    *Airport* by Byron Barton (Crowell Junior Books, 1982). The spare text and the
    folksy illustrations make this an excellent choice for storytime.'
