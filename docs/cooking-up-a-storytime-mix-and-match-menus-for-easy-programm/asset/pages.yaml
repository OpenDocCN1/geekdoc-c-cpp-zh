    book encourages the children to imitate all the animals at the zoo. And it can
    be sung!


    *How Much Is That Doggie in the Window?* by Iza Trapani (Gareth Stevens, 1999).
    The classic song in adorable book format. (Iza Trapani has many more songbooks.)


    *Hush, Little Baby* by Brian Pinkney (Greenwillow, 2006). The large and vibrant
