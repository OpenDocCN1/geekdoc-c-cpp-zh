    have been shown to do so in some cases) in the following ways:


    +   - **Attention:** A number of studies done with educational software engineering
    simulations have repeatedly shown that students find these simulations enjoyable,
    engaging, and an interesting challenge they are happy to take on (Baker et al.,
    2003; Dantas et al., 2004; Navarro & van der Hoek, 2005a; Sharp & Hall, 2000;
    Stevens, 1989). This is particularly true for game-based simulations. Clearly
    this is the result of the elements of surprise, humor, challenge, and fun that
    are integral to many game-based simulations.

    +   - **Relevance:** Because learners can experience firsthand how the knowledge
    they are learning is relevant in a real-world situation (the one that is portrayed
    in the simulation),


    simulation promotes a feeling of relevance to students’ future careers. This relevance
    can be enhanced by the usage of real-world data in the model to make the simulation
    more realistic. Furthermore, as the theory suggests, relevance is enhanced even
    further if the educational approach builds on previous and present knowledge.
    Simulations that are used to demonstrate concepts that have already been communicated
    to the students in another form (e.g., lecture or text) directly address this.


    +   - **Confidence:** Simulations provide a non-trivial challenge that is also
    doable. As students are given the opportunity to succeed at a simulation, they
    will feel a sense of personal confidence in the learning material. This is especially
    true in game-based simulations, in which students have the additional benefit
    of feeling they have “won the game.”'
