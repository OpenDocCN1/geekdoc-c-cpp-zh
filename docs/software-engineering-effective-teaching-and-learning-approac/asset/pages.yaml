- pgno: 76
  md: 'ing progress, and purchasing tools. At the end of the game, the player receives
    a score indicating how well they performed, and an explanatory tool provides them
    with a visual analysis of their game, including which rules were triggered when,
    a trace of events, and the “health” of various attributes (e.g., correctness of
    the code) over time (see Figure 2).


    To date, six SimSE game models exist: a waterfall model, an inspection model,
    an incremental model, an Extreme Programming model, a rapid prototyping model,
    and a Rational Unified Process model. For more information on SimSE, including
    its design, game play, and simulation models, see (Navarro, 2006).


    The idea of SimSE was originally motivated by the hypothesis that simulation can
    bring to software engineering education many of the same benefits it has brought
    to other educational domains. Specifically, we believed that software


    engineering process education could be improved by using simulation to allow students
    to practice managing different kinds of “realistic” software engineering processes.
    The constraints of the academic environment prevent students from having the opportunity
    to practice many issues surrounding the software engineering process in their
    course projects. Our approach therefore focused on providing this opportunity
    through the use of simulation.


    To guide us in the design of SimSE, we performed two activities: (1) a study of
    the domain of software engineering education to discover what its unique needs
    are, and (2) a survey of well-known principles for successful educational simulations
    from the research literature. The result of this was a specific set of key decisions
    that are listed here and discussed in light of the learning theory (or theories)
    that we later discovered related directly to them:


    Figure 1. SimSE graphical user interface


