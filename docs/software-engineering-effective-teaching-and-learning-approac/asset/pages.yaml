  md: '# Chapter XIV


    # Software Engineering

    at Full Scale:

    A Unique Curriculum


    Jochen Ludewig

    Universität Stuttgart, Germany


    # Abs TRACT


    In 1996, a new Software Engineering curriculum was launched at Universität Stuttgart.
    It was based on many years of practical experience teaching computer science and
    also on experience in industry where most of our graduates will find jobs. While
    the topics of this curriculum are not very different from those of computer science,
    there is much more emphasis on problem solving, software construction, and project
    work. In 2009, our traditional curriculum leading to the so-called diploma (equivalent
    to a master’s degree) will be replaced by a new curriculum according to the bachelor
    and master concept. This chapter describes both the old and the new curriculum,
    and discusses problems and achievements.


    # INTRODUCTION


    Software engineering is usually taught as a special course for students studying
    computer science or engineering. But software engineering is not just a set of
    topics, as the SWEBOK (SWEBOK, 2004) suggests, but also, or primarily, a particular
    mindset, a way of thinking, very similar to the mindset engineers tend to have.
    One might say that you get a software engineer if you combine a


    computer science graduate’s knowledge with the mental structure, the way of thinking,
    reasoning, and solving problems, of an engineer.


    In order to educate such people, it is not enough to modify our CS programs by
    some cosmetic changes, a new lecture or a nice little project. We need a radical
    change. And we cannot pretend that our knowledge should be good enough for our
    students; we have to teach them what they need rather than teaching them what
    we like, because'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'most people like to teach what they have taught all the time (Ludewig, Reiβing,
    1998). This paper describes such a new curriculum that was launched in 1996, and
    discusses our experience.


    # bACkGROUND


    Traditionally, students of science and engineering in Germany finally receive
    a diploma, which is equivalent to a master’s degree. Since there is no formal
    level below the diploma, there is no equivalent to the Bachelor’s degree and,
    hence, no straightforward mapping between a curriculum in Germany and a curriculum
    in Great Britain or in the United States.


    The Diploma curriculum is similar to what is called an integrated master’s degree
    program in Great Britain, India and some other countries.


    Though space does not allow for a detailed comparison, here are some significant
    differences:


    +   - In Germany, three levels of school education are available, differing in
    their requirements and in their duration. The highest level leads to a final examination,
    the so-called “Abitur”. One out of three young people actually pass this examination,
    usually at an age around 19. In most of the engineering studies including computer
    science and software engineering, those who hold an Abitur may enrol without entrance
    examinations. But many of them underestimate the difficulties they encounter at
    university. That is one of the reasons why many students fail soon after beginning.

    +   - A complete curriculum consists of 9 semesters: 4 semesters for the “basic
    studies”, another 4 for the “advanced studies”, and one for the diploma thesis.
    Most students take more time, resulting in an average of some 12 semesters. Many
    students have a part-time job in industry, or even run a small business.


    +   - Both written and oral examinations are offered once in every semester; there
    are no mid-term exams. Students may attend a lecture this year and take the examination
    next year or even later. If they fail, they are required to repeat the examination
    after another semester. If they do not pass in the second attempt, they have to
    leave.

    +   - The curriculum of the basic studies (semesters 1 through 4) is fairly rigid
    because there is little choice for the students. Still, they may postpone lectures
    and examinations. Therefore, only a minority has actually finished all the examinations
    that constitute the so-called “Pre-diploma” (Diplomvorprüfung) after two years.
    The Pre-diploma is not a degree but only the entrance condition for the advanced
    studies. Though the Pre-diploma may at first sight resemble a bachelor’s degree,
    it is in fact very different because it covers mainly fundamental topics like
    mathematics and theory.

    +   - In the advanced studies, the students can arrange their schedule as they
    like. When they have met all requirements, they can start their diploma thesis,
    which is strictly limited to six months.


    The effect of these differences is that our students must take full responsibility
    for themselves. If they fail to work continuously, they will drop out sooner or
    later, as more than 50 % actually do. Those who survive can usually handle common
    problems fairly well. Colleagues from abroad who come to Germany and teach at
    our university tend to find that the system is strange for them but works well
    for those who succeed.


    Faculty members in Germany enjoy a constitutional freedom of teaching: While we
    have to teach, we decide what we teach. This freedom has a subtle influence on
    curricula: There are no standardized components like in the US, because any professor
    teaching e.g. the basic course “introduction to CS” can (and often will) change
    the'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'content, the text book, and the exercises. When we design a new curriculum,
    we better make sure that we can actually implement it with the faculty that is
    around. If they do not like it, the curriculum will not work.


    A few years ago, there was a political decision (the so called “Bologna agreement”)
    to switch to the bachelor/master schedule; these changes will be discussed in
    the final part of this chapter.


    Other changes take place as well. Traditionally, universities (like schools) were
    free for the students who had to pay a small administrational fee only. Now, they
    are charged in most states of our federal republic. Currently, charges are low
    compared to most universities in the world (around 1000 € per year), but this
    may be only the beginning. Private schools and universities do exist in Germany
    but are not relevant in a statistical sense. More than 96 % of all students attend
    one of the public universities; if only universities offering a Ph.D. are considered,
    it is more than 99 % (HRK, 2007).


    # CONCEPTs


    When the Software Engineering curriculum (SEC) was designed in 1995 and 1996,
    little material was available. There was a guideline issued by the German CS society
    (Gesellschaft für Informatik, 1985); a new guideline was being prepared at that
    time. While the new guideline did not influence our curriculum, the curriculum
    had some impact on the guideline (Gesellschaft für Informatik, 1997; Mahn et al.,
    1999). Some of our concepts, in particular the large projects, have been successfully
    copied in other universities (cp. Bungartz, Bernreuther, 2006), but a complete
    university-level curriculum in software engineering has not yet been offered anywhere
    else in Germany.


    In 1995, our department decided to have an evaluation of the CS curriculum including
    inter-


    views with alumni. Many of them voted for better education in software engineering.


    The SEC was launched in 1996. Since then, every year some 60 to 140 students were
    enrolled. In 1999, the SEC was evaluated by an international group of peers, with
    extremely positive results. Some minor changes were implemented shortly after.
    This paper refers to the SEC that has been applied since 2000.


    The fundamental idea was to offer a curriculum that comprises most of the courses
    also contained in the CS curriculum, but far more project work of various types.
    The structure is very similar to an electrical engineering curriculum. (The author
    who designed the curriculum holds a diploma in electrical engineering.) This concept
    is often confused with an education covering both traditional engineering and
    CS, like the curriculum at MacMaster University in Hamilton, Ontario (Parnas,
    1999). While their graduates are engineers in a traditional sense, our graduates
    should cooperate with other engineers, but not replace them. The similarity to
    other engineering studies lies in the practical, constructive approach: If you
    encounter a problem, solve it using a minimum of resources!


    Many universities offer courses in software engineering as an add-on for CS students.
    But, despite SWEBOK, software engineering is not only a body of knowledge. Software
    engineering is a paradigm. If you put physicists into some courses on materials,
    they will still be physicists, not electrical engineers, because they have not
    enjoyed an engineer’s education. Software engineering must be taught, and practiced,
    early.


    Some time ago, when I talked to a student, I asked him if he was a CS student
    or an SE student. He said that he was a first year SE student. “Well, then you
    won’t really feel a big difference, do you?” “Oh yes, I do”, was his answer. “The
    CS students are those whose programs are unreadable.”'
