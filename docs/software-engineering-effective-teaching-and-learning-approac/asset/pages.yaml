    # USING THE CASES


    Our case studies have been used both within our software engineering curriculum
    and in a technical communication setting with a wide variety of students. The
    material appears to have not only the depth to recreate the complexity of communication
    in a software project, but also the breadth to connect with students outside of
    software engineering. We report on our findings here.


    # Technical Communication


    We have used the Seabase case study in an interdisciplinary technical communication
    course that included computer science and software engineering students along
    with students majoring in engineering, business, and technical communication.
    The case was used over a two-and-a-half-week unit during summer 2006 and over
    a four-week unit during fall 2006. Students worked in interdisciplinary teams,
    each of which included a computer science or software engineering student. In
    class discussions, in memos, and in final reports, they analyzed how the various
    communication genres produced by the senior design group (such as requirements
    documents, risk documents, emails, timelines, meeting minutes, reports, and presentations)
    contributed to action or nonaction of project stakeholders and ultimately to the
    overall success or failure of the Seabase project. For example, one in-class exercise
    asked students to rewrite a set of meeting minutes taken from the case after extensive
    discussions about the purposes and audiences for these documents. Similarly, in
    their final reports, the teams of students not only analyzed the communication-related
    causes of the Seabase project’s failure but also drew on their analyses to make
    recommendations that were designed to help future senior design students and faculty
    improve their communication practices.


    The successful use of this case in a technical communication course demonstrates
    that the lessons that it teaches about communication and about working on interdisciplinary
    teams are applicable outside of, as well as within, the computer science classroom.


    From written student comments and the analyses presented in their final reports,
    we conclude that students responded well to a rhetorical approach. They came away
    from the case study with a better understanding of the importance of a rhetorical—rather
    than rote—approach to problem solving and to communication cycles. The project
    particularly highlighted for students the importance of considering a document’s
    various audiences—or stakeholders. In his reflections about the project, one student
    wrote, “Before this class I had simply written paper after paper without any thought
    as to who was reading it aside from the professor who assigned it. I feel that
    not only did I learn how to design a paper to fit a particular audience, I also
    learned to pick an audience and the importance of doing so.”


    Students particularly liked the fact that the case included the actual documents
    produced by the senior design group for the Seabase project: they were able to
    see how the documents’ lack of rhetorical awareness (attention to factors of audience,
    purpose and context) significantly contributed to the project’s ultimate failure.
    For example, in one final report students observed how the timeline produced by
    the CS team lacked dates and deliverables: “The biggest problem is that there
    are no dates at all on the timeline,” they write. “The team has not worked out
    starting times, durations, and, most importantly, deadlines.” The students reading
    the case study concluded that the document was produced in a rote manner, to satisfy
    a course requirement—without awareness that anyone would actually read it, use
    it, or modify it in the future. The student readers provided a revised timeline
    that included dates, deadlines, and deliverables, and specified which'
