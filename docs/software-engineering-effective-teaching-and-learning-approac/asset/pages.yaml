  md: '# Detailed Table of Contents


    Foreword .......................................................................................................................
    xv


    Preface ...........................................................................................................................
    xvii


    Acknowledgment ...........................................................................................................
    xxv


    # Section I

    Introduction


    # Chapter I


    Software Engineering Education: Past, Present, and Future.......................................................
    1


    Gregory W. Hislop, Drexel University, USA


    There is a strong and growing global demand for skilled software engineers. The
    institutions that educate software engineers are evolving and changing to meet
    this need. This chapter provides an overview of this effort to develop software
    engineering education. It discusses the historical development of software engineering
    education, provides some perspective on current status, and identifies some of
    the challenges faced by software engineering educators. The intended audience
    for this chapter is anyone interested in software engineering education who has
    not participated in the developments to the present time. The goal is to provide
    a summary background of how the discipline has evolved and pointers to key publications
    that are part of that history. Since this chapter surveys foundational topics
    in software engineering education, many of the topics touched on in this chapter
    are covered in more detail in other chapters of this volume.


    # Section II

    Student Learning and Assessment


    # Chapter II


    Constructive Alignment in SE Education: Aligning to What? .....................................................
    15


    Jocelyn Armarego, Murdoch University, Western Australia


    Practitioner studies suggest that formal IT-related education is not developing
    the skills and knowledge needed by graduates in daily work. In particular, a shift
    in focus from technical competency to the soft and metacognitive skills is identified.
    This chapter argues that a framework for learning can be developed'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'that more closely models the experiences of practitioners, and addresses their
    expectations of novice Software Engineers. Evaluation of a study incorporating
    three Action Research cycles shows that what is needed is a mapping between the
    characteristics of professional practice and the learning model that is applied.
    The research shows that a relationship also exists between learner and learning
    model, and that this relationship can be exploited in the development of competent
    discipline practitioners.


    # Chapter III


    # On the Role of Learning Theories in Furthering Software Engineering Education
    ................................... 38


    Emily Oh Navarro, University of California, Irvine, USA

    André van der Hoek, University of California, Irvine, USA


    Learning theories describe how people learn. There is a large body of work concerning
    learning theories on which to draw, a valuable resource of which the domain of
    software engineering educational research has thus far not taken full advantage.
    In this chapter, the authors explore what role learning theories could play in
    software engineering education. The authors propose that learning theories can
    move the field of software engineering education forward by helping us to categorize,
    design, evaluate, and communicate about software engineering educational approaches.
    They demonstrate this by: (1) surveying a set of relevant learning theories, (2)
    presenting a categorization of common software engineering educational approaches
    in terms of learning theories, and (3) using one such approach (SimSE) as a case
    study to explore how learning theories can be used to improve existing approaches,
    design new approaches, and structure and guide the evaluation of an approach.


    # Section III


    # Innovative Teaching Methods


    # Chapter IV


    # Tasks in Software Engineering Education: The Case of a Human Aspects of Software
    Engineering Course................................................................................................................
    61


    Orit Hazzan, Technion - IIT, Israel

    Jim Tomayko, Carnegie Mellon University, USA


    The field of software engineering is multifaceted. Accordingly, students must
    be educated to cope with different kinds of tasks and questions. This chapter
    describes a collection of tasks that aim at improving students’ skills in different
    ways. The authors illustrate their ideas by describing a course about human aspects
    of software engineering. The course objective is to increase learners’ awareness
    with respect to problems, dilemmas, ethical questions, and other human-related
    situations that students may face in the software engineering world. The authors
    attempt to achieve this goal by posing different kinds of questions and tasks
    to the learners, which aim at enhancing their abstract thinking and expanding
    their analysis perspectives. The chapter is based on the authors’ experience teaching
    the course at Carnegie-Mellon University and at the Technion – Israel Institute
    of Technology.'
