    groups and they are told to discuss their individual findings with the other members
    of the group and come to a consensus opinion on each scenario prior to the class
    meeting. In the class itself we will get each group to present their findings
    on one particular scenario – each presentation is then followed by a class discussion.
    An alternative approach (if verbal student presentations present too much of a
    challenge) is, at the start of the session, to issue each group with one or two
    sheets of poster-sized paper and get the group to write up their findings on one
    particular scenario. These are then posted on the classroom wall, the students
    view them and then we debate each one. Once started, students will usually debate
    issues for a reasonable time – getting them to debate is usually not a challenge,
    although getting groups or individuals to do presentations often is! Hence the
    use of posters.


    # THE sUNDERLAND APPROACH: ADDREss ING DEVELOPMENTs AND A FRAMEWORK FOR PROFEsS
    IONALIs M


    Our next step is to provide a wider contextual view for the role of ethics in
    computing and the developments there have been towards creating a professional
    discipline. As our exemplar we concentrate on the efforts that there have been
    with regard to Software Engineering. We cover both the developments in the USA
    during the 1990s and what IFIP was undertaking at the same time.


    # Developments in Professionalism


    We often use the USA developments as an example of the problems and “politics”
    that can occur over a number of years:'
