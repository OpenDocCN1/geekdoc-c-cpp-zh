- pgno: 320
  md: 'International students are often at a disadvantage due to the fact that English
    is their second language. This affects their writing ability where a weakness
    in vocabulary often prevents them from expressing themselves clearly and succinctly.
    It also undermines their confidence in public speaking due to concerns about their
    command of the language and fears that others will not understand them because
    of their accents. It can also severely limit their participation in class discussions.


    International students are not the only ones with problems in communications.
    Many of the students, particularly those with computer science backgrounds, are
    not used to writing technical documents. While they may be good at writing code,
    they often have difficulties in expressing themselves succinctly in a written
    document.


    The most direct approach to dealing with significant changes in the student population
    has been to adapt the curriculum and individual courses to meet the changing needs
    of our students. Employed students are encouraged to express their perspectives
    on the material so that their experiences can be shared with students that have
    yet not entered the field. In some classes, programming assignments can be written
    in Java or C++ depending upon the student’s choice.


    Another change has been the incorporation of more term papers into course work
    to allow students to get greater experience in writing. Papers are graded on technical
    content, structure, adherence to topic, and on the use of language. Corrections
    are suggested and students have a chance to resubmit corrected work. With respect
    to verbal communications, students are required to make oral presentations of
    their term projects. This way, until they reach the capstone project, students
    would have had the opportunity to exercise their communications skills several
    times. We have also observed significant progress in the communication skills
    and self-confidence of students when we created multicultural teams, and encouraged
    informal peer-mentoring. As one of our external program reviewers observed,


    the oral communications skills of students significantly improved when they were
    repeatedly videotaped, and discussed the strengths and weaknesses of their recorded
    presentations with the instructor.


    # GUIDANCE ON sTARTING AND MANAGING PROGRAMs


    Based on the experience described above in starting and managing Monmouth University’s
    software engineering program we would offer the following advice to academic departments
    that are considering a similar program:


    +   1. Conduct research to determine the most current curriculum recommendations
    from the IEEE, ACM and other sources.

    +   2. Find out, by participating in national groups and committees that develop
    those recommendations, what likely future changes might take place.

    +   3. Enlist the academic institution’s industrial advisory boards to determine
    how the general recommendations need to be tailored to suit the needs of local
    industry. The partnership with the local industry will bring multiple benefits,
    such as a good source of real world projects for courses, student placement for
    summer internships, industry guest lecturers for courses or a research seminar.

    +   4. Form a Task Force with professors from both SE and CS departments to make
    sure the two departments will not conflict each other. Also invite an external
    reviewer who can offer concrete guidance, based on personal experiences in building
    such a program at another university.

    +   5. Recruit full-time faculty who are competent to teach the required variety
    of courses and who have industrial experience in applying software engineering
    techniques in real'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'work environments. Don’t expect this to be an easy task. You might need to
    manage the program initially with significant help from part-time faculty.


    +   6. Expect that the curriculum will need to change with time to accommodate
    both changes in the discipline as well as changes in the needs of local employers.


    +   7. Define a set of students learning outcomes that you will continuously monitor,
    and use the results to evaluate the need for improvements.


    +   8. Periodically seek accreditation from a national board, or at least solicit
    a thorough review from an external evaluator, who is a prominent figure in the
    field. These efforts will ensure the quality of your curriculum.


    +   9. If you intend to advertise your program to international students, make
    sure that you educate student’s expectations regarding the research oriented or
    practical training oriented nature of the program.


    +   10. If you intend to offer the program over multiple campuses, or on-line,
    you need to secure the equipment, technology and instructors qualified and willing
    to teach distance learning courses. Don’t expect this to be an easy task, the
    instructor’s effort to teach these courses might be considerably higher than teaching
    face-to-face courses.


    # FUTURE TRENDs


    Having looked at the past, it is now appropriate to look to the future for our
    program. In particular, we recognized a need for another set of changes. The introduction
    of an undergraduate software engineering program had profound consequences on
    the graduate program, forcing severe changes in its curriculum. The redesigned
    curricula should allow the new graduates of the bachelor’s degree in software
    engineering to have the opportunity


    of extending their knowledge and skills to new frontiers. In particular, we believe
    that while in the undergraduate program students should focus on the application
    level software development, at the graduate level they should focus on the enterprise
    and global levels. Also, we expect these students to show originality in the application
    of their knowledge and pursue research to push the boundaries of knowledge in
    the SE area of their choice (similar to the UK program reported in (Edwards, 2003)).


    With this respect, in 2007 we modified our graduate program, such that the students
    with a bachelor’s degree in SE will be required to take 5 core courses, 6 elective
    courses and a two-semester thesis. Up to 9 credits of core courses can be waived
    if equivalent courses have been completed as part of the students’ Bachelor of
    Science in software engineering program. This would make our SE graduate program
    similar in structure to masters programs in electrical engineering, mechanical
    engineering, etc. throughout the United States (see Figure 5).


    In particular, we moved a bridge course into a core course: former SE501 (Mathematical
    Foundations) is combined with former SE561(Formal Methods) into a new and augmented
    core course, SE561(Mathematical Foundations of Software Engineering). This course
    will include mathematical methods that a software engineer needs to master, such
    as graph theory, formal languages, logic, sets theory, etc.


    Former SE565 and SE570, the requirements and design courses, have been changed
    to cover techniques at the global and enterprise levels of software development.
    Former SE575, the software verification and validation course, has been changed
    to cover verification, validation and maintenance techniques and tools. Former
    SE580 course will cover the team software process (Humphrey,1999) due to the recognition
    that the graduates will need to work in teams for most of their careers, and the
    feedback received from graduates.'
