- pgno: 338
  md: 'With no reference materials provided, it could be difficult for faculty to
    find suitable textbooks or materials to cover the desired topics. On the other
    hand, SWEBOK provides detailed description and interesting discussion for each
    KA, subarea, topic and subtopic defined as well as links to books and articles.


    # sTARTING THE PROCESs


    The practical process of developing a vision for a specific instance of a Software
    Engineering program includes a number of concerns to be addressed, such as focus,
    style, leadership, and the requirements derived from the institutional strengths,
    weaknesses and opportunities. The experience of the authors is that of developing
    a program within the context of existing computing and engineering programs within
    the sponsoring institution, so issues concerning the creation of new academic
    structures will only be by inference.


    # Project Leadership


    The immediate starting point is necessarily one of leadership – who will lead
    the project to define and launch the program. While this may seem trite, clearly
    defining the academic stakeholders is critically important, as the risks of not
    involving appropriate representation from related academic departments early in
    the program development are real, and have proven to be stumbling blocks to SE
    program development. As with any successful project, establishing executive sponsorship
    at various levels is key, as is communication with the executive sponsors and
    other stakeholders. One mechanism for supporting ongoing validation, communication
    and development of the program is a steering committee.


    An effective program development steering committee should follow effective patterns
    within the institution, and typically is formed from department chairs, experienced
    faculty,


    external advisors, and anyone else deemed appropriate to the institution. This
    committee, whether formal or informal in its makeup, should necessarily include
    persons who have the authority to formally propose a new program within the institution.
    In some cases, this process may require cross-college cooperation, and thus may
    also include either academic deans or their representatives.


    The steering committee should at minimum approve program development decisions,
    but may (as in our situation) be significantly more active in the development
    of the program details. Among these, determining the expected style of the program
    was a significant set of decisions. For example, in our case, the deliberate choice
    was to not require co-ops, and to not focus on one particular SE style, such as
    embedded systems, but rather allow styles and domains to be student-selected via
    the use of technical electives.


    In our development process, the project started with one faculty project leader,
    and eventually formed a development committee after the housing (which department)
    issue was settled. In the case of Butler University in Indiana, the housing department
    was clear, and they developed an external advisory board consisting of local software
    industry leaders which helped significantly in crafting the program and building
    internal credibility (Henderson, 2003).


    # Capitalizing on Institutional strengths


    Each educational institution has its own set of distinguishing characteristics,
    including things like the faculty, teaching style(s), history, physical location,
    etc. Part of the success of a new program is its ability to realize these characteristics
    within the program in ways that strengthen the program, its appeal to students
    and its effectiveness for graduates.


    In many cases, these institutional strengths are easily recognized, and involve
    institution-wide'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'structures to support them. These structures can take on many forms: core curricula,
    freshmen sequences, service learning, marketing, development, alumni services,
    cooperative arrangements, etc. While many of these academic and non-academic features
    may also act as constraints, they are also what bring the institutions’ unique
    stamp to the new program. Clearly identifying and celebrating these institutional
    strengths are significant for marketing the program, both internally and externally.
    Performing a formal Strengths, Weaknesses, Opportunities and Threats (SWOT) analysis
    may be useful.


    One of the more common SE program development questions that hinges upon institutional
    strengths is that of requiring cooperative employment placements as part of the
    academic program. In some institutions, such as Rochester Institute of Technology
    (RIT) and Drexel University, this is an institutional strength, and is required
    of most programs. In other schools, required co-ops are common, and institutional
    support is readily available. Yet this is not the case in most institutions –
    neither the culture nor the academic structures support co-ops, so the decision
    to include a required co-op placement as part of the program design may involve
    significantly more cost to the program.


    In our case, similar to that of Butler University, we developed our BSSE program
    in a ‘liberal arts’ institution, where the general education requirements included
    36 semester hours of general education, and provides a significant institutional
    ‘stamp’ to the program. Similarly, there was no institutional support for required
    co-op placements, and despite the attraction of such an arrangement, it was deemed
    unfeasible by the development steering committee.


    One of the more important institutional limitations to be negotiated is the availability
    of faculty resources; some institutions are very risk-adverse, and consequently
    are very reluctant to invest in new faculty positions for new programs until the


    enrollment proves the need. Other institutions are more accepting of risk, and
    are more tolerant of investment that will help distinguish a program, and ensure
    its early success.


    In our case, after creating the initial academic plan, we projected the faculty
    resources needed to develop and sustain the new program. With an enrollment estimate,
    the request took the form of one new faculty member the year after the program
    launch, and another faculty member two years after launch if enrollment met or
    exceeded the estimates.


    # CURRICULUM CONsTRUCTION AND DEsIGN


    Students gain and build knowledge and skills from the courses they take while
    in college. Curriculum dictates what courses students in a specific program should
    take and the sequence of taking them. Hence curriculum plays an important role
    in determining what knowledge and skills students should possess when they graduate
    with a bachelor’s degree. On the other hand, each course students take has a specific
    set of course objectives that students completing the course are expected to accomplish;
    curriculum also plays a determining role in what program outcomes will be achieved
    through the course outcomes. Furthermore, curriculum is the place where each institution
    showcases its strength, uniqueness and special program focus. So what courses
    should be included in an institution’s BSSE curriculum? There is no one easy answer
    for that.


    For the purpose of creating an accreditable program, where graduates meet or exceed
    expected program outcomes, in our experience, there are several factors to consider
    during the curriculum design and construction process.'
  merge: -1
