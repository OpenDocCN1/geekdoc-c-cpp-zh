  md: 'Here is a list of those components (courses) that were designed for, and are
    offered exclusively to, the Software Engineering students. They are discussed
    in detail in the following paragraphs.


    +   a. Programming lab (b 1st semester)

    +   b. Courses in English and economics

    +   c. Programming in the large ("Introduction to SE I" in Figure 1), including
    project-manager training using a project simulator (SESAM) (3rd semester)

    +   d. Programming in the small ("OOP" in Figure 1) (3rd semester)

    +   e. Formal methods ("Introduction to SE II" in Figure 1) (4th semester)

    +   f. First software project ("Basic project" in Figure 1) (4th semester)

    +   g. Lecture on advanced software engineering (5th semester)

    +   h. Large software project (5th and 6th semester)

    +   i. Large software project in an application area (6th and 7th semester)

    +   j. Project on problem analysis (8th semester)


    All the lectures described below include exercises where small problems are discussed.
    The exercises are usually under the control of Ph.D. students (who are, in most
    cases, employees of the university). The volume is given in credit points. Our
    standard formula is 3 credit points per 2 lessons (= 2*45 min) per week for a
    full semester (15 weeks).


    # COURsE DETAILs


    # Programming Lab (1st semester; 3 Credit Points)


    Many students have written programs before they enter the university, while a
    few have not. Therefore, we have to teach programming, preferably


    using a language that is equally unknown to all the students. Currently, we teach
    Ada as the first programming language.


    Programming is taught in the introductory course (where SE students are not separated
    from the CS students). The programming lab is directed towards systematic programming,
    with emphasis on style guides and other standards (e.g. for comments) that are
    to be observed. Our message is: The program that you build is not for you. It
    is for others who have to read and maintain it.


    Until recently, we used to teach programming like most people do, i.e. bottom-up.
    Students learn some concepts of programming, like types and control structures.
    Then, they build a small program. From a software engineering point of view, that
    is wrong. Soon after, it takes us much effort to convince our students that large
    programs are not just multiples of small ones. The fact that software engineering
    is primarily concerned with complexity is not well integrated.


    Therefore, we changed this course, starting with a fairly large software system.
    We use a program named AdaDoc, which generates HTML documents from Ada code. It
    is sufficiently large (2700 statements, 9341 non-comment source lines, more than
    23 000 LOC altogether) to challenge the students. In order to modify this program,
    they have to understand it, though only partially. They easily learn to appreciate
    good style (egoless programming). The new course started only recently (in October
    2007), but the first results are very promising. Students co-operate and learn
    from experience and understanding what used to be a boring, bureaucratical command.


    # Courses in English and Economics (3rd and 4th semester; 6 Credit Points)


    All our students (at least those who grew up in Germany) learned English in school.
    But some'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'of them did not learn it very well. In order to make sure that our graduates
    can read English documents and communicate on an international level, we offer
    a course followed by a test (similar to a TOEFL). They also learn some economics
    because many of them will later be managers or run a software company.


    # Programming in the Large, Including Project Manager Training Using a Project
    simulator (sEsAM) (3rd semester; 6 Credit Points)


    The whole curriculum is project-driven. Therefore, the lecture on programming
    in the large covers a small project from planning and cost estimation all the
    way to testing, in order to equip our students for the larger projects (see d,
    g, h). Towards the end of this course, students practice software project management
    using a simulator that was developed in the department (SESAM; Drappa, Ludewig,
    2000).


    # Programming in the small (3rd semester; 4 Credit Points)


    Complementary to programming-in-the-large (b), students learn how to develop object-oriented
    systems using UML and Java.


    # First software Project (4th semester, 9 Credit Points)


    In groups of three, students develop a mid-size program. All students start from
    the same (informal) specification. Some of the results are still in use, e.g.
    a tool for generating time shift diagrams.


    # Formal Methods (4th semester; 5 Credit Points)


    Students learn how to apply formal techniques for specification and verification;
    currently, they use Alloy as a specification language.


    # Lecture on Advanced software Engineering (5th semester; 6 Credit Points)


    This lecture has two goals: Firstly, students should know more about software
    project management for mastering the problems of the large projects (see below).
    Secondly, some topics not strongly related to their project work like process
    assessment and improvement or ethics need to be addressed as well.


    Much time is dedicated to discussion and motivation. Only if the students understand
    why good software engineering is desirable will they be able to convince their
    colleagues in industry.


    # Large software Project (5th and 6th semester; 24 Credit Points)


    Research groups submit proposals for projects to the curriculum committee. These
    projects should not include research but serious software development. Most frequently,
    students develop some new tool or a new component for an existing tool. When a
    project has been accepted students can select it; but their freedom is limited
    by the condition that each project must have between six and twelve participants.


    We require for each project certain roles to be provided by the research group:
    There must be a professor who will eventually examine the students; there is a
    customer, and there are (usually) two supervisors who will help the students when
    necessary. In order to avoid confusion, the customer must not serve as a supervisor;
    these roles are clearly separated. All responsibility rests'
