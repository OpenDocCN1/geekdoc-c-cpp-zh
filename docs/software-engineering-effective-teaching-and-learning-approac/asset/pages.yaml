  md: '# Table 2. Software engineering educational approaches and the learning theories
    they incorporate


    | | Learning by Doing | Situated Learning | Keller''s ARCS | Model-Based Instruction
    | Discovery Learning | Learning Through Failure | Learning Through Reflection
    | Elaboration |

    |---|---|---|---|---|---|---|---|---|

    | Industrial Partnership – Real Project | ** | *** | ** |  |  |  | * |  |

