  md: '+   - *Change requirements.* Requirements changes may be introduced by the
    customer at any time.

    +   - *Change technologies.* Projects typically leverage open source technologies
    to complete project implementations. These technologies are subject to frequent
    change, and teams are asked to change with the technology.

    +   - *Rotate team roles.* Though not as intrusive as switching team members,
    changing roles within a team tends to lead to greater intra-team chemistry.

    +   - *Turnover between semesters.* A common issue with projects spanning more
    than one semester is student turnover. This is embraced as indicative of the “real
    world” where team member turnover is expected.


    Certainly these types of issues tend to slow down and degrade the quality of the
    final software products produced. The benefit is that teams must rely on good
    process practices, organization, risk analysis, judgment, and collaboration to
    work through these problems.


    # Project Assessment


    Student projects are graded on their ability to define a process, follow the process,
    and adapt to change. Grades are weighted for the sequence (particularly the second
    year) primarily on the ability to set, follow, and adapt activities within the
    context of a process, and only secondarily on the quality of deliverables produced.
    It is difficult to construct an assessment model based on these criteria. For
    one, it is difficult to directly measure the impact of one process model against
    another, particularly in a setting with naïve practitioners of the process (which
    by definition students typically are). Second, tracking process-related data on
    student projects can be a significant time burden for faculty. The validity of
    student process data gathering is another issue. While the PSP/TSP does emphasize
    aspects of data gathering and


    data-driven process improvements, it still remains difficult to ask students to
    ascertain, for example, the impact of a particular configuration management policy
    on software quality. Additionally, students are grade-driven, so asking for honest
    reporting of process data when students are concerned about grade impacts often
    leads to optimistic reporting where sometimes the true nature of a team’s situation
    is not revealed until the end of the semester. In our view, there are no easy
    answers to these issues.


    Additionally, there are two key components of Enterprise projects that have an
    impact on assessment.


    +   - Collaboration across academic years. As discussed previously, project teams
    consist of juniors and seniors collaborating on the same team. These teams also
    meet and work together on extended lab sessions once a week. The energy seniors
    devote to mentoring is included in the assessment of their final grade. This can
    be a point of contention with exceptionally talented students who have a tendency
    to work ahead of the rest of their team instead of pulling the team forward with
    them.

    +   - Entire class is “the company.” Student team projects are usually pitted
    against one another in a competition to show off the best resulting product in
    order to obtain the maximum grade. In the Enterprise all project teams are part
    of the same company, and the success of the company is as important, if not more
    important, than individual project success. Therefore a percentage of the final
    grade is influenced by how well all of the class projects perform, not just the
    project in which the team participates. This encourages teams to share lessons
    learned and sometimes resources across projects. This principle has been employed
    in other Capstone experiences (Coppit 2006; Turhan & Bener, 2007), though the
    principle differ-'
