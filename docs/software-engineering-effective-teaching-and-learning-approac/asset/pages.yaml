  md: '# scheduling Guidelines


    A key aspect of planning for an RPRCC is to develop a scheduling framework to
    keep teams on track and working at a steady rate. This type of framework increases
    the probability of successful project completion in the available timeframe. In
    a fully structured approach, which is appropriate for students new to software
    development, the instructor sets a strict schedule of when major work products
    are due and the team has control over intermediate deadlines.


    As students gain experience with software development methods, especially in their
    second or third RPRCC, the instructor can use an approach in which teams determine
    their own deadlines. In capstone courses, this can be an excellent tool for practice
    in setting and meeting deadlines. For this approach to work, the instructor must
    maintain regular contact with each team to ensure they are making progress and
    meeting deadlines. This can be accomplished through periodic written progress
    reports, formal face-to-face meetings, and informal discussions.


    # Additional Guidelines


    Guidelines are useful for helping teams maintain consistency in their efforts
    and can also make the task of evaluating work products easier for both the instructor
    and the client. Providing students with formatting guidelines can help them learn
    to follow professional workforce practices and can introduce consistency that
    is useful in assessing and using the work products. Guidelines can specify methods
    for submitting work products, for example number of hardcopies or how to submit
    work products via electronic means (e.g. as email attachments, as a document with
    a specific name in a specific folder, or as a submission within a course management
    system such as WebCT or Blackboard).


    A guideline about deadlines can indicate what teams must do to request an extension
    and any consequences, such as how the grading will be affected, if there are delays.
    A related guideline could explain what a team must do to re-scope their project
    if the instructor and client agree that this is acceptable.


    Another guideline might concern who can see work products and when. For some courses,
    the Website or project directory will be accessible only by team members; at the
    other extreme, work products might be posted on a public team Website throughout
    the course, thereby allowing anyone on the Internet to view them. If there are
    security and privacy requirements for the project, the instructor and the team
    must take care to protect private information.


    Configuration management of one type or another is essential for coordinating
    versions of work products and also adds important skills to students’ toolsets.
    A guideline can be introduced to explain whether teams are required to use a specific
    configuration management tool, another tool of their choice, or a more informal
    method for keeping track of versions of work products. A related guideline can
    cover the use of defect tracking tools and what types of defects teams should
    be tracking and reporting.


    # Individual Work Products


    Formal individual writing assignments can help students explore issues related
    to the on-going work, as well as encourage them to read selected articles relevant
    to the project work. Such assignments can provide students with the opportunity
    to reflect on the team’s work and think through possible solutions to problems.
    These types of assignments can serve an important role in the course, both in
    getting students to think and helping the instructor to better monitor team dynamics
    and frustrations.


    Several of us review project work completed by individual students to help in
    assigning individual grades. Individual assignments can also help students think
    about the project and reflect'
