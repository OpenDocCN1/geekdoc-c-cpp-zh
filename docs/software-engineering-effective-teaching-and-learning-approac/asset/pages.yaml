  md: 'c. Select one or more qualitative research tools described in Lesson 4 - Software
    as a Product. Design a small-scale research outline that examines the influence
    of specific programming style guidelines on the way programmers develop a computer
    program. Conduct the research and describe your conclusions.


    This question is composed of two focused parts – (a) and (b) – and a more open
    part – (c). The first two parts aim at highlighting the influence of programming
    style on program comprehension processes. The third part requires the students
    to be creative and to plan a small research project for a specific target. It
    is hoped that such an experience will show the students, first, that there are
    cases in which a small-scale research is needed and, second, that they are equipped
    with the tools required to conduct such a research study.


    # X. building Case studies / story Telling


    These questions ask students to construct scenarios and case studies, based on
    their personal experience as well as on what has been learned and discussed in
    the course. The scope of the cases varies: from short and focused stories to vast
    narratives that encompass multiple aspects of software engineering. These tasks
    have several advantages. First, students must consider what is important, as well
    as less important, to include in the case study. Second, they must integrate different
    issues related to software engineering into a single story. Third, they must analyze
    what they have constructed, an activity that once again enhances their awareness
    of different topics related to software engineering. In what follows, we illustrate
    the application of these ideas with respect to stories of different scopes.


    # Example 13: Lesson 5

    Software Engineering Code of Ethics, Intermediate-Stage Question


    Suggest a situation in software development in which a team of software developers
    must make the decision whether or not to report to their management about a bug
    in a specific software tool they developed. What does the code of ethics say in
    such cases? How would you behave in such a case?


    This task focuses on ethical issues. It asks the students to create a scenario
    that focuses on a particular case. It illustrates how small details determine
    the nature of the situation. When such a task is repeated with respect to different
    topics, this message is emphasized and highlighted.


    # Example 14: Lesson 5

    Software Engineering Code of Ethics, Summary Question


    Compose a story that raises ethical considerations. Interview software engineers
    about this case. Ask them to express their opinion and predicted behavior in such
    a case. Analyze their reactions. Are all of the reactions similar? How do they
    differ from each other and from your opinion? What do these reactions imply with
    respect to software development? What lessons will you take with you from this
    experience to your future development of software?


    This task illustrates another way in which case studies can be used for educational
    purposes. Specifically, based on a story that the students develop, they carry
    out a small-scale research that explores different opinions related to software
    engineering processes.'
