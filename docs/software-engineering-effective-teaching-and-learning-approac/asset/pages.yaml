  md: 'ceptable peer reviews—could expect to earn a B. Students who made less contribution
    than this, in terms of effort expended, failure to attend meetings, failure to
    deliver work products as promised, or inability to do the technical work, received
    a lower grade. Students who made a greater technical contribution to the accomplishments
    of the team, delivered superior products, took on extra work, and contributed
    constructively to meetings and to team interactions got a higher grade.


    # Assessment of the Bene.ts of This Approach


    At present, we have only qualitative data confirming that the SQUARE approach
    is beneficial. Many of the students have gone on to positions in the security
    field and have indicated that the case study work was very useful to them. Here
    are comments from two students that we have stayed in touch with.


    Hassan is with Ernst & Young: “The real-world experience I gained from the SQUARE
    project gave me the perfect set of information security project management and
    budgeting skills that were invaluable in my job at Ernst & Young.”


    Eric is working as a software engineer with the Space and Naval Warfare Systems
    Center (SPAWAR), San Diego: “While working on the SQUARE project with Dr. Mead,
    I took part in several in-depth case studies involving organizations of varying
    size and reputation. It was a wonderful opportunity to get a feel for how real
    companies develop and manage large IT projects. This insight, along with the security
    focus of SQUARE, allowed me to hit the ground running here at SPAWAR with the
    security projects we’re developing. Overall it was an extremely valuable experience
    and I’m grateful that I was involved.”


    Also, we received the following testimonial from a client that was a subject of
    the study: “Our company operates in a lean, fast-paced, ever-changing environment,
    and I had some reserva-


    tions as to how much time we could spend in accommodating the CMU graduate students’
    project goals and their busy schedules. I was impressed with how well we coordinated
    efforts in setting meeting dates, adhering to the schedule, and sharing information
    with minimal inconvenience to either side. Our company provided them with an opportunity
    to assess a many-faceted product, and they responded graciously by sharing the
    different techniques they used to analyze the security aspects of our application.
    Their results gave us insight that has since influenced our application development
    and configuration. It was a pleasure working with the three separate groups and
    their sponsor over the two-year period.”


    # FUTURE PLANs


    At present we are piloting workshop and academic course materials for security
    requirements engineering. This material will be made available to educators who
    wish to incorporate such topics into software engineering courses. In addition,
    we are doing further study of the coverage of the software assurance body of knowledge
    in standard software engineering curricula. As experience with these approaches
    grows, our plans include the gathering of more quantitative data to show the benefit
    of the approaches we have discussed here. It is our hope that in the future there
    will be more synergy between software assurance and software engineering education.


