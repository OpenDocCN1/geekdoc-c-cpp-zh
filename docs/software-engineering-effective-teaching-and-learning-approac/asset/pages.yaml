  md: 'interesting challenge for RPRCCs, as such projects are often targeted for a
    harsher environment than an office setting. For example, in a project for a Water
    Quality Department, students developed embedded software for a hand-held device.
    A benefit of working for governmental agencies is that the students, the department,
    and the institution can gain widespread favorable publicity.


    If an RPRCC is to produce software for for-profit businesses, potential clients
    can be drawn from among alumni, graduate students, and industrial advisors who
    have business connections. While relationships with industry can reap benefits
    for the RPRCC instructor and the department, political concerns may render it
    desirable for the instructor to have some experience at running RPRCCs prior to
    recruiting industry clients. For students, who may be seeking internships or full-time
    employment, clients drawn from business can lead to rewarding contacts. In addition
    to the regular client tasks, clients from for-profit businesses can often double
    as mentors thanks to experience with issues such as budget, schedule, deadlines,
    deliverables, quality, iterative development, communication skills, requirements,
    risk assessment, and testing.


    If the department has one, the PAB can be a useful source of clients (Modesitt,
    2005, 2006). Because PAB members are often eager to work with students who may
    one day become employees, they have a vested interest in successful projects.
    PAB members are also in a unique position to offer a wide variety of real problems
    for student teams. As an added benefit, PAB clients can serve a double purpose
    because accreditation organizations such as the Computing Accreditation Commission
    (CAC) of ABET encourage departments to utilize PABs.


    # How Many Clients are Sufficient?


    The number of clients required to run an RPRCC depends on how the RPRCC is organized.
    If each team is to do a unique project, and each client


    is to represent a single project, then the number of clients must equal the number
    of teams. A variation practiced by some of us is to offer more project options
    than the number of teams. With an excess of options, each team is more likely
    to end up matched with a project that suits its members well. A downside to this
    strategy is that some clients may not be matched with a team, an outcome that
    should be discussed in the process of managing the client’s expectations (see
    the next subsection).


    At times, a client may ask to propose multiple projects. If the client truly has
    time to act as the client for multiple projects, then the instructor can make
    do with fewer clients than teams. If the projects are completely distinct, then
    client interactions with each team can be relatively independent. If the client
    proposes a larger project, then different components can be assigned to different
    teams and integrated later, with the client meeting as appropriate with the separate
    teams or the combined team. We do not, however, recommend that clients work with
    multiple teams if they have never served in this role before.


    # Preparing the Potential Client for What to Expect


    During the process of recruiting prospective clients, the instructor must provide
    clear information about what the role entails, both risks and rewards. A good
    starting point can be a flyer or webpage that introduces the course, the role
    of the client, the rhythm of the activities in the course, and the types of project
    that are appropriate. This information can also be communicated via telephone
    or email, either personal or broadcast.


    The introductory information supplied to potential clients should include:


    +   - An indication that this is a quest for clients who have project ideas that
    could be developed by a team of students.'
