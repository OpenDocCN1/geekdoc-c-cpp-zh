  md: 'through first forum discussions during the WBT usage. The workshop typically
    considers domain-specific examples, the coaching introduces some superficial enterprise-specific
    problems (hours of preparation for the coach), and consulting brings up detailed
    problems (days of preparation). This ends in the cooperation phase, where the
    degree of adaptation cannot be further increased. The flexibility of the knowledge
    presentation is also zero for the WBT, since all material is presented in a standard
    form. For the workshops, this situation is slightly improved, but the coach still
    depends on a standard set of presentation slides and exercises. Since the effort
    available for preparation is significantly higher in subsequent phases, there
    is also much more room for selecting alternative approaches, discussions, etc.


    # Recommendations


    The evaluations and observations presented in the previous sections can be summarized
    into several general consequences and recommendations:


    +   - Even though e-learning and Web-based trainings aim to shorten learning time
    we point out that learning still needs time. This insight should be emphasized
    towards the enterprise management as often as possible to ensure adequate scheduling
    of the training.

    +   - Let people choose their own learning mode and learning situation. We assume,
    that people are interested in flexible learning solutions and that they are capable
    of adapting a learning program to their individual context constraints in the
    most appropriate way (time, priorities of tasks).

    +   - Combine e-learning resp. Web-based training with classroom training and
    coaching. Our experience is that individual learning via media (books, digital
    content) is an important issue. However, it is very content driven. To learn more
    about professional methodologies, participants should be enabled and encouraged
    to apply the knowledge they have learned and to learn what the effects in the
    real world are. This can be done in classroom trainings by using real-world tasks
    and materials or in real projects with the assistance of a coach.


    abled and encouraged to apply the knowledge they have learned and to learn what
    the effects in the real world are. This can be done in classroom trainings by
    using real-world tasks and materials or in real projects with the assistance of
    a coach.


    +   - A social climate of confidence, with personal relationships between coach
    and employees (but also between coach and management), is very important. It should
    be deliberately developed during the project phases, e.g., by the following means:

    +     - Introduce the coach early, e.g., with personalized kick-off emails or
    even meetings with the WBT users.

    +     - Let the same person do the workshop and the subsequent coaching.

    +     - Do not change coaches.

    +     - Do not denigrate existing competencies, integrate them.

    +   - The content should be adapted as early as possible. In the best case, you
    can take a concrete problem from the application environment as a reference example.
    However, this increases project costs early on.

    +   - Do not stop the project too early, e.g., directly after the WBT. This leaves
    people alone with the mentioned content and application uncertainty.

    +   - For the same reason, the project targets should be readjusted from time
    to time. Regular talks with the different participants help to reconcile their
    interests.

    +   - Identify internal experts who can support and continue the knowledge transfer
    in the future.


