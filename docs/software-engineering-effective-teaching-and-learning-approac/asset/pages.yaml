    The set of U.S. institutions currently known to offer BSSE degrees is presented
    in Table 2. It is interesting to consider some of the overall characteristics
    of this group of institutions that might have made them early adopters in development
    of the BSSE.


    For example, over a third of these institutions are technology focused colleges
    or universities. On the one hand, this might make a BSSE an easy fit. On the other
    hand, most of these institutions already have multiple computing degrees, which
    could make for sharp differences of opinion about the wisdom of adding yet another
    computing degree.


    A second characteristic is that a number of these institutions have close connections
    with businesses in their local market. This is certainly


    true of some of the technical institutes, but also true of institutions like Monmouth
    and some of the branch campuses of the public institutions.


    It is also interesting to note that the list has a mix of institutional types
    in terms of the Carnegie Foundation’s classification scheme (Carnegie 2007). For
    example, there are four BSSE institutions (Auburn, Drexel, FIT, and Iowa) in one
    of the “Research University” categories and a good selection of institutions across
    the range of Master’s and Baccalaureate categories.


    While there is a relatively broad set of institutional types, institutions with
    highly ranked computer science departments are not present. For example, in considering
    the top 36 computer science departments according to the Taulbee Survey (Zweben
