- pgno: 312
  md: 'curriculum covered all the aspects of the software lifecycle. The capstone
    course was either a 3-credit practicum, or 6-credits of thesis research. The introduction
    of a thesis option was made possible by attracting faculty with the desire to
    engage in research activities.


    # 1998 Curriculum Changes


    The 1998 curriculum represented another major change by providing for much more
    flexibility in a 36 credit program, with 5 core, 5 elective courses, and a 6-credit
    practicum or a 6-credit thesis (see Figure 4).


    The recognition of the importance of exposure to practical experience in a software
    engineering program has lead to the increase of the practicum project from 3 to
    6 credits, and to the introduction of term projects in most of the courses in
    the curriculum. This is similar to the recommendations of the First MSE curriculum
    (Ardis,1989) of offering a two semester practicum and as much as 30% of the program
    be dedicated to project work.


    The MU curriculum continued to follow the software life-cycle model, as opposed
    to the CMU Model (Garlan, 1995), which emphasized teaching “cross-cutting principles
    of software development” throughout the curriculum. As such, the CMU Model offered
    five core courses organized around modeling, methods of development, management,
    analysis and architecture. Also, they included a software development studio for
    the development of practice skills, during the entire duration of the program.


    The 1998 MU curriculum has added a new course, The Process of Engineering Software,
    which largely follows Watts Humphrey’s Personal Software Process (PSP) principles
    (Humphrey, 2005). The introduction of this course was justified by the need for
    graduates who are aware and have the necessary skills for predictably producing
    high quality systems, in a timely and cost effective manner, using reusable components
    as much as possible in their work. In spite of the


    hard work necessary for the manual input of the data for the various forms and
    templates involved in the PSP, students have given us very positive feedback about
    the usefulness of the principles learned in this course. For alleviating the clerical
    work related to the manual input of data, we created a semi-automated tool to
    support the PSP process (Rosca, 2001). This tool was the result of a two-semester
    practicum project of one group of students.


    Two of the former core courses, mathematical foundations of SE, and principles
    of SE, have been transformed into preparatory (bridge) courses (see Figure 4).
    Together with three other programming courses the “bridge” program is offered
    for students with an undergraduate major other than computer science, computer
    engineering, electrical engineering, or information systems. After taking the
    15 credit preparatory courses and a one-semester project course, students can
    receive a certificate in software development if they don’t wish to pursue a Master’s
    program.


    The elective courses included in this curriculum were necessary for completing
    a chosen specialization track, such as organizational management, telecommunications,
    embedded systems, and information systems. These 15-credit tracks were much more
    comprehensive than their counterparts in the 1995 curriculum. They comprise courses
    from other disciplines such as business, electrical engineering and computer science.
    However, students have been able to select elective courses across tracks if they
    didn’t want to pursue a specialization. A brief description of the specialization
    tracks is given next.


    The Organisational Management track prepares students to become software development
    managers or specialists in software process improvement. Topics of study include
    process improvement, quality management, organisational development and management,
    risk management and project planning and management.'
