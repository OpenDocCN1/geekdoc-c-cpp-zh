  md: 'program demonstrate a number of specific student outcomes. While these mandated
    outcomes are not really “curricular topics”, there is precedent for requirements
    of this type in the program criteria for many other disciplines (Engineering Accreditation
    Commission, 2007, pp. 5-18).


    The software engineering program criteria require the program to demonstrate that
    graduates have the ability to analyze, design, verify, validate, implement, apply,
    and maintain software systems. Although the term “analyze” has a generic engineering
    meaning, in this context it is generally understood to refer to requirements analysis.
    Graduates must also be able to apply, in the context of complex software systems,
    discrete mathematics, probability, statistics, and relevant topics in computer
    science and supporting disciplines.


    Additionally, the program must demonstrate that graduates have the ability to
    work in one or more significant application domains. In itself, this requirement
    does not dictate any particular curricular content, but it does imply some coursework
    or other experience beyond core software engineering and computer science topics.
    Some existing software engineering programs have chosen to require specific courses
    in one or more application domains such as embedded software, gaming software
    or web applications. Other programs have defined a set of elective course sequences,
    in a variety of areas, allowing students to choose according to their own interests.
    A few programs have adopted both of these strategies.


    In regard to faculty qualifications, the current program criteria for software
    engineering do not impose any additional requirements. Effective for the 2001-2002
    accreditation cycle, the program criteria were amended to require that “those
    faculty teaching core software engineering material have practical software engineering
    experience” (Engineering Accreditation Commission, 2000, p. 16), but that section
    was later deleted (Engineer-


    ing Accreditation Commission, 2002, p. 22) with little public explanation for
    the change.


    # GROWTH OF ACCREDITED SOFTWARE ENGINEERING PROGRAMs


    The first undergraduate program in software engineering in the United States was
    started in 1996 at Rochester Institute of Technology. Since that program took
    root and showed the viability of an undergraduate software engineering program,
    there has been a steady growth in the number of programs, with several new ones
    started each year. This has happened despite the general downturn in undergraduate
    computing program enrollments since 2000 (Computing Research News, 2007). There
    are currently 35 programs leading to an undergraduate degree in Software Engineering.
    Through the summer of 2007, fifteen of these programs have been accredited by
    ABET. The Rochester Institute of Technology program graduated its first class
    of baccalaureate-level software engineers in May 2001. The first four programs
    applying for accreditation had their campus visits in fall of 2002, and received
    accreditation approval in the summer of 2003. The EAC granted the Rochester Institute
    of Technology program an extended grandfathering which covered their May 2001
    class. That gave the program the distinction of awarding the first ABET accredited
    BS in Software Engineering degrees. Figure 1 shows the growth in both the total
    number of undergraduate software engineering programs and the number of accredited
    programs.


