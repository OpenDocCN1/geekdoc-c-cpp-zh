  md: '**Kenneth Modesitt**, prior to his retirement in 2007, was professor and interim
    chair of computer science as well as associate dean for external partnerships
    and research at Indiana University – Purdue University Ft. Wayne. His areas of
    expertise include software engineering, expert systems, and distributed learning.
    He has used teams of students to develop software for real clients for over 20
    years at four different universities. His experiences working for industry have
    had a major impact on his quest to bring “realism” to the classroom. These experiences
    began in 1963 at Control Data Corporation and have included software and management
    positions with Texas Instruments, Rockwell International, and Loral.


    **Emily Oh Navarro** is a project scientist in the Department of Informatics of
    the Donald Bren School of Information and Computer Sciences at the University
    of California, Irvine. She completed her PhD in information and computer science
    at UCI in 2006, with her dissertation entitled, “SimSE: A Software Engineering
    Simulation Environment for Software Process Education.” She also holds an MS in
    information and computer science from UCI, along with a BS in biological sciences,
    also from UCI. Emily’s research is focused on developing game-based simulation
    tools for software engineering education. She is the lead developer on the SimSE
    project and has also contributed to the design and evaluation of Problems and
    Programmers, an educational software engineering card game.


    **Donald M. Needham** is an associate professor of computer science at the United
    States Naval Academy. Dr. Needham is an ABET-CAC program evaluator and a member
    of the ACM and the IEEE Computer Society. His research interests include safety-critical
    software metrics as applied to software fault trees and software reuse within
    product lines. He has been funded by the Joint Technology Office, Naval Sea Command
    Systems, Electric Boat, Naval Research Lab and NASA and has published over 40
    archival publications (book, journal articles, book chapters, and conference/workshop
    articles). Dr. Needham graduated from the University of Connecticut in 1997 with
    a PhD in computer science and engineering.


    **Cherry Owen** is assistant professor of computer science in the Department of
    Mathematics and Computer Science in the College of Arts and Sciences at The University
    of Texas of the Permian Basin. She has 20 years of experience teaching computer
    science and mathematics as well as seven years experience as a systems analyst
    with Exxon Company, USA. She has been incorporating real projects into various
    courses whenever possible for the last ten years, with clients from industry,
    not-for-profits, and university faculty.


    **Christian Peper** studied computer science and physics at Saarland University,
    Germany. In 1995, he joined the University of Kaiserslautern as a researcher working
    on reuse-oriented application of formal description techniques. Since 2003, he
    has been working for the Fraunhofer Institute for Experimental Software Engineering
    (IESE) in Kaiserslautern with a current focus on development and specification
    of adaptive component-oriented systems. Since 2004, he has also acted as a UML
    trainer and consultant in several industrial education and cooperation projects.


    **Steve Roach** has been using cooperative learning and the ARG model in his courses
    and research since 1999. In 2002 and 2003, he chaired the IEEE CCSE Sub-Committee
    on Advanced Software Engineering Curricula. The CCSE is an international organization
    developing models of undergraduate'
