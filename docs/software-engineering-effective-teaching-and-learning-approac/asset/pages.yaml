- pgno: 10
  md: 'for best practices in software engineering. Several process features are introduced
    in an attempt to make projects, or more importantly the experience gained from
    project work, more applicable to industry expectations. At the conclusion of the
    Software Enterprise students have an applied understanding of how to leverage
    software process as a tool for successful project evolution. This chapter presents
    the Software Enterprise, focusing the presentation on three novel aspects: a highly
    iterative, learner-centered pedagogical model, cross-year mentoring, and multiple
    projects as a novel means of sequencing learning objectives.


    # Chapter VIII


    Teaching Software Engineering in a Computer Science Program Using the Affinity
    Research Group Philosophy...............................................................................
    136


    Steve Roach, The University of Texas at El Paso, USA

    Ann Q. Gates, The University of Texas at El Paso, USA


    This chapter describes a two-semester software engineering course that is taught
    in a computer science program at the University of Texas at El Paso. The course
    is distinguished from other courses in that it is based on the Affinity Research
    Group (ARG) philosophy that focuses on the deliberate development of students’
    team, professional and technical skills within a cooperative environment. To address
    the challenge of having to teach professional and team skills as well as software
    engineering principles, approaches, techniques, and tools in a capstone course,
    the authors have defined an approach that uses a continuum of instruction, practice,
    and application with constructive feedback loops. The authors hope that the readers
    will benefit from the description of the approach and how ARG components are incorporated
    into the course.


    # Chapter IX


    A Framework for Success in Real Projects for Real Clients Courses...............................................................................
    157


    David Klappholz, Stevens Institute of Technology, USA

    Vicki L. Almstrum, The University of Texas at Austin, USA

    Ken Modesit, Indiana University – Purdue University Ft. Wayne, USA

    Cherry Owen, The University of Texas of the Permian Basin, USA

    Allen Johnson, Huston-Tillotson University, USA

    Steven J. Condly, HSA Learning & Performance Solutions, USA


    This chapter demonstrates the importance of Real Projects for Real Clients Courses
    (RPRCCs) in computing curricula. Based on the authors’ collective experience,
    advice for setting up an effective support infrastructure for such courses is
    offered. The authors discuss where and how to find clients, the types of projects
    that they have used, and how to form and train teams. The authors also investigate
    the variety of standards and work projects that they have used in their courses
    and explore issues related to assessment and evaluation. Finally, the chapter
    considers the benefits of an RPRCC-centric approach to computing curricula.'
