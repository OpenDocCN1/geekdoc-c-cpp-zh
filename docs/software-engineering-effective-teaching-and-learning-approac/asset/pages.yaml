  md: 'The first step in assisting a team in resolving conflicts is to identify that
    a team has a problem. Frequently students will bring the problem to the attention
    of the instructor. To monitor teams who are not reporting difficulties, the Guidance
    Team looks at a number of indicators. For example, a lack of initiative shown
    in email trails or poor work delivered in rough drafts is an indication that a
    member of the team is not contributing. A series of work efforts not appearing
    in the final product or suggestions that appear in email, but not in work products
    may indicate team members are ignoring or discounting a team member.


    Once a team issue is identified, the Guidance Team meets with the project team.
    In relatively simple cases, there may be a discussion of team skills and techniques
    for ensuring that communication is clear, for example summarizing the results
    of team meetings and emailing task assignments immediately after the meeting.
    Follow-up meetings can be used to assess the change in team functioning. In more
    complex cases, the process may entail a lengthier process that includes having
    team members voice their perceptions and emotions and having other team members
    paraphrase what their teammates have said. Paraphrasing forces a student to listen
    to and understand the position of the other students. Often, the students come
    away from such an experience with a new respect for and appreciation of their
    team mates. Complex cases usually require several guided meetings before the team
    is able to address issues on its own.


    One source of team conflict is the case where we have highly motivated students
    mixed with less motivated students. While it is normal for lower-achieving students
    to become engaged and highly productive and valuable to project teams, it is not
    uncommon for teams to have one or two members who remain unmotivated and unproductive.
    In these cases, the Guidance Team negotiates grade and deliverable adjustments
    for individual students on the team.


    In most cases, these simple interventions suffice. However, in more extreme cases,
    we have teams develop a code of conduct and identify their expectations for the
    course and project. In the most egregious cases, we have removed team members
    from a team and had that student report directly to the Guidance Team.


    # Written and Oral Communications skills


    In order to develop students’ abilities to communicate technical concepts effectively,
    we use the Instruction-Practice-Apply Continuum shown in Figure 1. The process
    begins in the classroom. A common technique for ensuring individual accountability
    when using cooperative learning in class is to randomly select students to explain
    their group’s solution to a given in-class problem. When students explain a solution,
    the faculty member can guide the student to a clear explanation by asking questions
    and helping the student rephrase statements.


    Formal presentations are scheduled four times during the two semesters: a paper
    prototype presentation, a formal presentation of the SRS, an executable prototype
    presentation, and the final presentation. For each presentation, each student
    on the team is required to present some part of the product. The presentations
    are evaluated both on style and content by the Guidance Team and the clients.
    The rubric for evaluating students includes items such as use of visual aids,
    pace, eye contact, gender neutrality, ability to field questions, and use of language
    and terminology. The comments from the Guidance Team and clients are summarized
    and returned to the students. The common observation of the clients is that the
    final presentation is significantly better than the presentations from the first
    semester.


    While all of our students have taken English writing classes prior to entering
    the capstone course, many of them have great difficulty with'
