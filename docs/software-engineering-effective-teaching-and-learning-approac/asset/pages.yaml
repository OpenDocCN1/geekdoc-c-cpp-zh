  img_proc: true
- pgno: 315
  md: 'Java; in the requirements engineering course object-oriented analysis methods
    were added to the structured analysis methods (Rosca, 2000); in the design course
    a transition was made from structured design to object-oriented design, component-based
    design, and architectural design. In the testing course we have added segments
    on testing applications that are constructed using commercial off-the-shelf (COTS)
    components, using automated testing and test management tools. For project management
    more content was gradually introduced on the use of scheduling tools, such as
    MS project, risk simulators, like Risk+, and discussion of the use of buffer tasks
    in the planning of software development projects (McDonald, 2000). The burden
    of this continuous course creation or updating could be alleviated in the future
    by the curricular materials offered by the SWENET project (Lutz, 2003), created
    by the professionals in the SE community for the use of the community, at large.


    The continuous revisions of course material constitutes a significant amount of
    work on the part of the faculty. In as little as three years, the changes within
    the field are significant enough that many courses have to be totally redesigned.
    The adoption of UML and its subsequent evolution has forced revisions in design
    diagrams, the vocabulary used to describe designs, and introduce new best practices.


    # Dated Textbooks


    As technology changes and software engineering evolves, the ability of texts to
    keep up with these changes is severely stressed. An instructor will find himself
    or herself utilizing three or four texts in order to properly cover a topic area.
    Books will seemingly contradict each other, only because they were published two
    years apart. Often, a book that is only three years old will contain many concepts
    that have been already superseded or renamed. Many excellent textbooks have not
    been updated to use current representations, such as UML2, for example.


    This forces faculty continuously research new and updated prints. The faculty
    has to take into consideration student feedback on the usefulness of the recommended
    textbooks. Some new textbooks might be already dated at the time of their publication.


    # Operating system/Programming Language biases


    Few topics seem to generate as much debate as the selection of which operating
    system (OS) or programming language should be the lingua franca for course work.
    It seems that everyone has an opinion or a realistic need to learn one environment
    over another. The selection of one environment over the other has significant
    impacts on the tools available for use by the instructor, the knowledge that the
    instructor has to bring into the classroom, and the equipment that must be maintained.
    In our case, over the years we have migrated from UNIX platforms, to Windows,
    and to dual-boot machines that run both Windows and Linux. Most of the students
    are familiar with both operating systems, since different instructors favor one
    OS over the other. They appreciate the flexibility offered by the dual-boot machines
    available in our labs.


    The programming language debate is a little more problematic than OS preferences.
    Many of the students at the graduate level have jobs in which they work in C++,
    Java, or C#. The students often insist that the programming language that they
    use in the workplace be utilized in their courses. The problem is that choice
    of programming language can significantly impact what is appropriate content for
    a course. Designing C++ programs utilizes different patterns than those used in
    designing Java programs, since C++ programs must necessarily and explicitly manage
    memory. Historically, the choice of programming language has been made largely
    based on inputs from the market and external program reviewers. For example, at
    the time this paper was written,'
