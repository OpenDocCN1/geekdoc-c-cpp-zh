    # THE MOST DIFFICULT ISSUES


    While the survey results indicated a good deal of agreement between program leaders
    and program evaluators, there were some exceptions. Specifically, there was some
    evidence, of inconsistency, and even some contention, related to faculty qualifications
    and curricular content.


    Program leaders generally reported no problems related to faculty qualifications.
    However, several program evaluators expressed concerns regarding a low proportion
    of faculty with true breadth and depth of experience in software engineering.
    This issue seemed to arise primarily in software engineering programs housed in
    computer science departments. As one evaluator stated, “It is sometimes difficult
    to agree with established CS programs adding an SE program that they have sufficient
    breadth and stability in SE to satisfy the ABET criteria.”


    Another concern of some evaluators related to the isolation of some software engineering
    faculty members, who seemed to have little involvement with the software engineering
    practitioner community and with the software engineering education community.


    PEVs noted a need for all faculty to be aware of and be involved with the ABET/EAC
    procedures and self-study preparation. The problem most frequently observed across
    all criteria has been defining appropriate and viable assessment and evaluation
    processes. Even when adequate processes have been defined, PEVs often identify
    problems with faculty compliance. To satisfy the requirements of outcomes assessment,
    the program faculty members must be committed to ongoing execution of the defined
    processes. Most programs and evaluators understood that


    the Outcomes Criterion requires the direct measurement of student outcomes via
    capstone projects, portfolio evaluations or specific quiz or exam questions. However,
    almost all agreed that the overhead required to do this rigorously placed a high
    burden on the programs, particularly for programs that had decided to evaluate
    all outcomes and all students every year.


    As noted previously, the software engineering Program Criteria require appropriate
    curricular content. Several evaluators commented that there were problems with
    programs’ interpretations of the breadth and depth of software engineering material
    required to satisfy these criteria. They said that these problems have most frequently
    been seen when programs are developed from a base of a computer science or a computer
    engineering curriculum.


    Two programs reported that they have had problems with a specific program evaluator’s
    interpretation of the requirements related to Program Criteria. These evaluators,
    they say, were looking for coverage of a specific topic area, such as software
    evolution, as part of the maintenance activities which students are required to
    be able to do by the time they graduate according to this criterion.


    In the case of programs that have had problems with curricular content, faculty
    members have sometimes felt that they were already covering many of the required
    software engineering topics. By requiring students to take specific existing computer
    science courses and adding a software engineering capstone course to the curriculum,
    they felt that they would meet the breadth and depth requirements.


    The programs that have been most successful in satisfying the curriculum requirements
    of the program criteria have linked their curricula to accepted frameworks such
    as the Guide to the Software Engineering Body of Knowledge (2004) and Joint Task
    Force on Computing Curricula (2004) and have made these links explicit in their
    course syllabi, by describing which courses'
