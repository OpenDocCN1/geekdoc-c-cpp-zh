- pgno: 271
  md: 'includes support for the presentation of test cases execution results in textual
    (standard output in the command window) or graphical form. However, in real applications
    for which thousands of test cases are typically developed, these methods of presenting
    the information are unreadable and impractical. To cope with this problem we have
    instructed students in the use of the JUnitReport tool, which allows the generation
    of hypertext browsable documents in HTML format containing the execution results
    for every particular executed test case. This tool is able to merge the individual
    XML files generated by the <junit> Ant task, and apply a stylesheet on the final
    document. JUnitReport is provided with the Ant release as an additional task but
    installation of external third party libraries is required. One important thing
    to point out is that both <junit> and <junitreport> tasks must be written in different
    targets inside the Ant script so the test case execution and results reporting
    tasks are not interdependent.


    Another fundamental topic that must be covered is the correct interpretation of
    the obtained results. Usually, JUnit makes a distinction between errors and failures,
    however, this distinction is artificial, unuseful and usually a source of misunderstandings
    among students. This distinction does not provide clear information about the
    source of the software defects found. While failures relate to assertion methods
    that have not been satisfied, i.e. defects in the production code, errors reflect
    unanticipated situations that occurred during the test cases execution and could
    be caused by both defects in the production code or in the test code. This issue
    must be covered at the beginning of the course when the JUnit tool is introduced.


    # Integration Testing


    Integration tests are centered on the collaboration of classes in a system. Once
    the different classes have shown to work well in isolation, is necessary to verify
    that they also work well when combined. When doing unit testing over a target
    class, students do a little refactoring process to replace


    domain objects with mock objects through the use of factory methods. After that,
    mock objects must be replaced progressively by the original ones. This can be
    done straightforward using the approach presented in (Wick, M., Stevenson, D.,
    & Wagner, P. 2008). Students have to replace the factory method of the original
    target class with a new factory method that returns the actual object with which
    students wish to integrate. Note that this approach allows a step-by-step integration,
    i.e. if we replace factory methods one by one, we are adding the original classes
    to the integration test one-by-one. In comparison with unit tests, integration
    tests are more difficult to implement due to the complexity of setting up the
    domain in the right state to test a specific behavior. In integration tests lots
    of objects are involved while in unit tests only a few mock objects, plus the
    target object, are involved. Moreover, mock objects state is very easy to set
    up comparatively. Due to these difficulties, we have found that students need
    extra support and instruction to make integration testing successfully.


    # Functional Testing


    The final step is to make functional tests over the system as a whole. For this
    purpose students are provided with a brief Software Requirements Document in which,
    for example, the syntax of the HTTP requests served by the system and the format
    of the XML documents returned are described. The goal is to make automated tests
    to verify that the system behavior meets the software requirements. Making functional
    tests from scratch over a distributed application with the only help of JUnit
    (note that despite its name JUnit is not exclusively attached to unit testing.)
    is a hard task. To cope with this difficulty we have introduced in the learning
    environment two interesting JUnit extension libraries (these two libraries as
    well as all the tools included in the learning environment described in this chapter
    are free-available open source tools) that facilitate this work: HttpUnit and
    XMLUnit. Note that'
