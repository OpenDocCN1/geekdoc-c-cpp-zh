- pgno: 302
  md: '+   - Some of the students who are not doing very well in their exams show
    a great performance in projects. Our traditional criteria are biased towards scientific
    work, though most of our graduates will never do research but develop and maintain
    software systems and soon become managers.

    +   - When students do real projects, there is a strong demand for lectures that
    address real problems. Students explicitly ask for hints (how to write specs,
    how to design software, etc.). Using one’s own textbook (Ludewig, Lichter, 2007)
    is quite a relief in this situation, but its omissions are soon revealed. CS students
    who are usually not exposed to project work do not ask such questions.

    +   - In every project, a certain style of cooperation and communication will
    emerge; we do not yet know which conditions determine this style (otherwise, we
    would like to influence it). The project manager is obviously important; but the
    students choose their project manager, we do not interfere.

    +   - Any research group in the CS department may offer projects, i.e. act as
    a customer. But customers do not always appreciate good software engineering.
    This is not only true in industry but also within our university. We had several
    cases where the customer challenged planning and quality assurance in favour of
    fast progress in coding. Students have to learn that they must “sell” their approach
    well in order to avoid conflicts between tough deadlines and ambitious quality
    goals.


    # soft skills


    +   - Soft skills, like giving presentations, negotiating changes or delays, or
    organizing groups, do not develop automatically when needed; they have to be taught.
    We offer a course on techniques for writing papers and giving presentations. We
    also use the seminaries for coaching the presentation skills. Anything else is
    done within the projects.

    +   - Industrial experience is very useful in any case: Students who find a company
    with high software engineering standards can see how it works. Others who get
    into an environment where little is known about software engineering will see
    what happens when people work on software unsystematically, without quality assurance,
    etc.

    +   - We do not yet offer any other training courses, e.g. courses on group dynamics,
    mediation, or documentation. There is certainly a need for them, but not necessarily
    a demand. Students tend to spend their time only on activities that pay (in terms
    of credit points).


    # sWITCHING TO bACHELOR’s DEGREEs


    As mentioned in the beginning, our diploma will soon be abandoned, making way
    for bachelor’s and master’s degrees. While students starting in October 2008 will
    still follow the traditional schedule, those who enter in October 2009 will be
    in bachelor programs. Many universities have already switched to the new structures.
    (But new students prefer to enrol in other universities, demonstrating little
    confidence in the imported degrees.) In general, this is a revolution imposed
    from above, not supported by most of the faculty.


    The Bologna agreement defined a total of 10 semesters. But most universities agreed
    upon a 6 plus 4 schedule, so we have to design a six-semester undergraduate course.
    Some professors believe that they can simply rearrange their curriculum because
    they expect the students, at least the good ones, to stay for the master’s degree.
    But a majority of our students will leave as bachelors, because they are offered
    attractive jobs, their grants are discontinued, and they are fed up with taking'
