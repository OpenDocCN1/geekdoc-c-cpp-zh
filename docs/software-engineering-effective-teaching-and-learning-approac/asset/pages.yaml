  md: '(Q3) How do participants evaluate the training measure and its elements (e.g.,
    WBT, classroom training, training materials, exercises)?


    In the second questionnaire, the participants regarded classroom training as the
    most important learning mode in the blended learning program.


    To explore which element of the training program did support their individual
    learning process most effectively, participants were asked to evaluate each element
    on a scale from 1 (= very good) to 6 (= inadequate).


    When evaluating the elements of Classroom Training, participants were most satisfied
    with:


    +   - Trainer instructions (1.6)

    +   - Collaboration with colleagues (2)

    +   - Domain-specific exercises (2.5)

    +   - Training materials (2.7)


    When evaluating the elements of Web-based Training, participants were most satisfied
    with:


    +   - Illustrations (1.6)

    +   - Texts (1.8)

    +   - Exercises (2.1)

    +   - Animations (2.1)


    After the training, most of the participants (85 %) did not consider any of the
    parts dispensable.


    The evaluation of training elements proves, that the existing learning preferences
    and habits of participants (classroom training and discussion with colleagues)
    lead to correspondent evaluation results: What was expected to be most effective
    before the training started was evaluated as the most effective way to learn after
    the training. But e-learning as the new learning mode seems to be highly accepted,
    too. The good evaluation of the Web-based training elements and the fact that
    none of the training parts is considered dispensable suggest that participants
    look at e-learning as a valuable addition to training. The latter also suggests
    that e-learning is not considered as a stand-alone training mode, but blended
    learning is an appreciated approach from the learners’ point of view.


