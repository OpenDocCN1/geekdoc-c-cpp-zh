  md: '# Experiences in Project-Based Software Engineering


    # Table 3. Vehicles for measuring attainment of ABET program outcomes


    | ABET Program Outcomes | Vehicles for measuring attainment of ABET Program Outcomes
    |

    |---|---|

    | CS-b; CSE-e | Course Assignments 1 (Part II- Preliminary Project Idea) and 2
    (Specification and Software Quality Analysis), along with Course Assignment 3
    Part I require the student to analyze the problem and define its scope as part
    of the specification. |

    | CS-c; CSE-e | Course Assignment 3 (Part II- Multi-Faceted Design and Part III-
    Revised Multi-Faceted Design) involve the design of a computer-based system. |

    | CSE-e | Course Assignment 4 (Part I- Prototyping Plan and Part II- Management
    Plan and Part III – Prototype reports and Presentations) demonstrate to varying
    degrees an ability to identify, formulate and solve engineering problems. |

    | CS-d; CSE-d | All course assignments require teamwork to a variety of degrees.
    |

    | CSE-g | All course assignments require oral and written communication to the
    instructor. Prototype presentations are made to the entire class. For the final
    presentation, industry managers in computing are invited and critique/provide
    input. |

    | CS-e; CSE-h | Course Assignment 5 (Realistic Issues for Product Development)
    explores realistic issues related to commercialization (e.g., professional, ethical,
    legal, security, social, global issues and responsibilities). |

    | CS-f | All course assignments require oral and written communication to the
    instructor. Prototype presentations are to the entire class. For the final presentation,
    industry managers in computing are invited and critique/provide input. |

    | CS-g; CSE-c; CSE-f | Course Assignment 5 (Realistic Issues for Product Development)
    explores realistic issues and constraints related to commercialization for local
    and global impact of computing on individuals, organizations and society, including
    ethical, legal, security and global policy issues. |

    | CS-h; CSE-c; CSE-i; CSE-j | Course Assignment 5 (Realistic Issues for Product
    Development) requires students to learn and research a topic (such as commercialization)
    that was likely not covered in depth in their program. |

    | CS-i; CSE-k; CSE-l | Course Assignment 3 (Part II- Multi-Faceted Design and
    Part III- Revised Multi-Faceted Design) requires students to use current techniques
    (UML and other models) and associated tools for their design. |

    | CS-j | When given feedback on their teams’ initial and revised designs for Course
    Assignment 3 (Part II- Multi-Faceted Design and Part III- Revised Multi-Faceted
    Design), students must respond with revisions to the modeling and design of their
    systems. |

    | CS-k | Course Assignment 3 (Part II- Multi-Faceted Design and Part III- Revised
    Multi-Faceted Design) demonstrate an ability to apply UML (and other models) to
    construct a solution for their project. |


    Development was added for subsequent offerings of this course. Overall, the issue
    of using the capstone course to measure attainment of program outcomes is in the
    *Works* category, although the danger exists for the capstone course to be saddled
    with gathering too many such measurements as we discuss in the following section.


    As can be seen in Table 3, many program outcomes can be measured by capstone courses
    structured like CSE293. An unintended consequence of such a versatile (from an
    assessment perspective) course can be an undue burdening of the instructors teaching
    the course with the collection of a great deal of assessment data. To resolve
    this issue at USNA, the department’s as-'
