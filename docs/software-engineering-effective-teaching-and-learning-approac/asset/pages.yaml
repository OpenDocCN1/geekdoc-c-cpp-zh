- pgno: 328
  md: 'available, and ability to work with the faculty delivering these courses to
    be effective for the new program. While Software Engineering is normally classified
    as a computing sub-discipline, in many institutions computing disciplines may
    be in multiple departments scattered across multiple schools, or not. The character
    and ability of the various departments and schools to collaborate (e.g., School
    of Engineering vs. School of Arts and Science, etc.) may not be easily navigated,
    and can delay program introduction.


    The housing issue for a program is significant, as it can affect issues related
    to shared course content, accreditation, funding, hiring, tenure, and a plethora
    of other subtle and inter-related academic issues, not the least of which is the
    culture of the faculty leading the program. Mismatches can adversely affect program
    development, but more especially student learning and faculty retention issues.


    While many programs are initially housed in an existing department structure,
    in several instances, sponsoring departments have been cross-department, or even
    cross-college arrangements. In some cases these more complex structures, created
    to launch the SE program, were later replaced. Factors that can affect complex
    administrative structures include growing enrollments, competition, budgets and
    funding, faculty issues and other sustainability factors. In some schools, the
    more complex structures proved workable, and have been maintained (e.g., Drexel).
    The common theme is the ability to gain sufficient institutional agreement for
    offering SE course and related program content.


    In our case, this negotiation of where to house the program led to delaying the
    program launch by about a year. Our initial proposal was to run the new SE program
    with a systems orientation from the Electrical and Computer Engineering (ECE)
    department. What was at issue was the nature of software engineering – few faculty
    having significant experience beyond embedded software development, or exposure
    to the signifi-


    cant and world-wide efforts to define software engineering as a discipline (Bourque,
    2000). Locating authoritative guidelines as to what a software engineering undergraduate
    program should include was significant to this negotiation. Even with these guidelines,
    identifying the nature of our new SE program, and where it should be developed/housed
    was by no means a simple process.


    Addressing this housing issue led to several surveys and presentations, using
    materials from conferences (Diaz-Herrera, 2001), ABET program-specific criteria
    (ABET, 2005), the Certified Software Development Professional (CSDP) effort (McConnell,
    1999; IEEE CS, 2001), SWEBOK drafts (Abran, 2004), and the SE2004 drafts (Diaz-Herrera,
    2004) to define software engineering for students, faculty and administrators.
    In particular, SE2004, SWEBOK, and ABET proved to be the most useful, and served
    as authoritative guidelines for our proposal development. At the end of these
    discussions, even though the program proposal originated from our ECE department,
    the strong computing focus of the SE program was deemed more suitable to be housed
    in the Computer and Information Science (CIS) department offering our computer
    science (CS) and management information systems (MIS) degree programs.


    As the CIS department was housed in the same school as ECE, no administrative
    objections were encountered. The new task was to redevelop the program vision
    and program details with a team of primarily CIS faculty in a way that would succeed
    when the new program was launched and managed from the CIS department. The decision
    to house the program in a different department meant ECE relinquishing control
    on the proposal, the proposal champion working with a new department chair and
    new faculty partners. The benefit of this redevelopment work was the promise of
    building consensus around a shared vision from those who would ultimately deliver
    the program.'
