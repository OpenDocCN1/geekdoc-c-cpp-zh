  md: "the throws clause of the test method definition.\n\n```\npublic void testSomeMethod\
    \ () throws\nSomeCheckedException {\n    // test something\n}\n```\n\n# Source\
    \ Code Listing 5\n\n# Improving Maintainability\n\nNowadays, most of the activity\
    \ and economic benefits of software enterprises come from maintenance related\
    \ tasks. In fact, commonly in the vast majority of software projects, the maintenance\
    \ life-cycle is much longer than the development one and so is the volume of resources\
    \ dedicated to it. The interesting point here is that the larger the number of\
    \ resources needed, the larger the potential for cost-effectiveness improvement\
    \ and so must be the effort in teaching good practices on this topic.\n\nDuring\
    \ a maintenance stage in which the production code is being altered, regression\
    \ tests need to be done with a very high periodicity and have to be as much automated\
    \ as possible so they can be ran at a reasonable cost in resources. For this reason,\
    \ it is necessary to train students in good testing practices that guarantee the\
    \ production of not only maintainable test software but test software with a highly\
    \ automated that can be effectively used in regression. In addition to some general\
    \ recommendations, like minimizing the coupling between test code and production\
    \ code and using auto-deployment scripts, students are trained in the use of an\
    \ open source tool named JTestCase. This tool is very helpful assisting in the\
    \ test cases design and execution tasks; it is basically a JUnit extension library\
    \ that allows the test cases data to be separated from the test cases source code.\
    \ This separation is provided by using XML data files to store test cases data\
    \ in a very structured and readable fashion. To enhance maintainability even further,\
    \ different XML files must be used to store test data belonging to different classes.\n\
    \nJTestCase also provides the API methods required to load this data into memory\
    \ from the test code during the testing process. The main advantages that led\
    \ us to recommend students the use of this library are two:\n\n+   - It is possible\
    \ to enlarge the test cases data set with only adding a new test case description\
    \ to the XML files, and without modify and having to recompile the test source\
    \ code.\n\n+   - Developers who design test cases data sets don’t need to know\
    \ about the source code of the methods to test. Therefore a clear separation between\
    \ the test cases design and execution roles is established.\n\nNevertheless, this\
    \ library also presents some drawbacks we needed to deal with when designing the\
    \ laboratory exercises in order not to increase excessively their complexity.\
    \ For example, storing the parameters data of the methods to test in the XML files\
    \ when they are instances of complex data types or user defined classes, may result\
    \ in a very complex and tedious task (because they are not directly supported\
    \ by the syntax JTestCase provides). Although this problem may be overcome using\
    \ the JICE library, we considered it does not worth the time students spend to\
    \ learn a new tool.\n\nAnother recommendation we do is to use the XML documents\
    \ generated as part of the test cases design documentation (XML files are readable\
    \ by both humans and machines) and therefore avoid duplicated information that\
    \ is always hard to maintain.\n\n# Reporting and Interpreting Test Results\n\n\
    Once the test cases execution has been carried out using the corresponding Ant\
    \ script, a fair amount of information summarizing the errors and failures detected\
    \ is generated. The correct interpretation and understanding of this information\
    \ is a key issue to locate and solve adequately the software defects found during\
    \ the testing process. JUnit"
