  md: '**J. Barrie Thompson** is a national teaching fellow in the UK and is professor
    in applied software engineering in the School of Computing and Technology at the
    University of Sunderland, UK. His prime interests are educational, professional
    and ethical issues associated with Software Engineering. He promotes the development
    of innovative teaching approaches relevant to the needs of industry. He was a
    member of the Software Engineering curriculum steering committee representing
    IEEE Computer Society’s Technical Committee for Software Engineering. Since January
    2005 he has been the chair of IFIP Working Group 3.4, Professional and Vocational
    Education and Training. He is a member of the Editorial Advisory Board for the
    Journal of Information Communication and Ethics in Society and an associate editor
    for the International Journal of Information and Communication Technology Education.
    He also co-edits the on-line newsletter FASE (Forum for Advancing Software engineering
    Education).


    **James E. Tomayko** was a teaching professor in Carnegie Mellon University’s
    School of Computer Science for more than 16-year. At the same time, he served
    as a part-time senior member of the technical staff at the Software Engineering
    Institute. Dr. Tomayko’s publications include *Software Engineering Education:
    SEI Conference on Software Engineering* (1991), published by Springer-Verlag;
    *Computers in Space: Journeys with NASA* (1994), *Computers Take Flight: A History
    of NASA’s Pioneering Digital Fly-by-Wire Project* (2000) and *Human Aspects of
    Software Engineering* (2004, with Orit Hazzan). Dr. Tomayko died on January 2006
    after a long illness. He was 56.


    **Will Tracz** is a principal software engineer/application architect for the
    Global Combat Support System - AF (GCSS-AF) Application Integration department
    at Lockheed Martin IS&S in Endicott, NY responsible for investigating innovative
    applications of and evaluating technology for the GCSS-AF Architecture Integration
    Framework. Dr. Tracz is a member Lockheed Martin’s Corporate Advanced Software
    Technology Focus Group. In addition, he was a co-PI on the Defense Advanced Research
    Projects Agency (DARPA) Dynamic Assembly of Systems for Adaptability, Dependability,
    and Assurance (DASADA) and Domain-Specific Software Architecture (DSSA) Programs.
    Dr. Tracz is a member of the RIT Software Engineering Advisory Board, the Software
    Engineering Institute Technical Advisory Group on Engineering and Method, and
    an IEEE TCSE Executive Committee Member at Large. In addition, he is the editor
    of the ACM SIGSOFT Software Engineering Notes, past chairman of the International
    Conference on Software Engineering sponsored by IEEE and ACM, and the author of
    over 100 technical reports and books on software engineering, software architectures,
    and software reuse.


    **James R. Vallino** is an associate professor in the Department of Software Engineering
    at Rochester Institute of Technology. He was actively involved in the development
    of the software engineering program, the first undergraduate software engineering
    program in the United States. This involvement included bringing active learning
    and problem-based learning into the curriculum, developing an NSF CCLI-funded
    inter-disciplinary course sequence in real-time and embedded systems, and guiding
    the program through its ABET accreditation. Prior to RIT, Dr. Vallino had seventeen
    years of software development experience in industry, followed by his PhD studies
    in computer science at the University of Rochester. His research interests include
    pedagogy for software engineering education, software design, especially in the
    real-time and embedded systems area, and model-based development methodologies.'
