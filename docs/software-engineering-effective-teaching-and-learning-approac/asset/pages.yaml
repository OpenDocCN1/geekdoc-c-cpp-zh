- pgno: 68
  md: 'Nevertheless, some of the theories surveyed in this chapter do have elements
    of cognitive and/or behaviorist principles. For example, Learning through Failure
    involves a form of “punishment” (failure) meant to “extinguish” a certain behavior.


    An additional issue that should be noted is the distinction between learning “theories,”
    learning “models,” and learning “methods,” as well as their counterparts in the
    domain of instructional design (instructional design theories, models, and methods).
    Because the lines between these are blurred and often used interchangeably, it
    should be noted that in this chapter several of the “learning theories” we refer
    to can also be called by some of these other terms. When this is the case, we
    will point it out in our discussion of those theories. However, as is frequently
    done in the literature, we use the term “learning theory” broadly, as a term that
    covers all of these categories.


    One of best-known learning theories is Learning by Doing, a theory based upon
    the premise that people learn a task best not by hearing about it, but by actually
    doing it (Dewey, 1916). The implication of this theory for instructional design
    is the following: the learner should be provided with ample opportunity to actually
    perform the activities they are meant to learn, rather than using passive mediums
    such as lectures and readings. In software engineering education, this translates
    to going beyond just lectures and reading assignments (although, for most any
    domain, a certain amount of such scaffolding is necessary to provide the learner
    with the required background knowledge to effectively participate in the Learning
    by Doing). Software engineering educators have recognized this, and now a standard
    component of nearly all software engineering courses is the class project—a small
    software engineering project that students must develop using some of the techniques
    learned in class.


    Situated Learning (Lave, 1988) is an educational theory that builds upon the Learning
    by Doing approach. While Learning by Doing focuses on the specific learning activities
    that the student performs, the Situated Learning theory is concerned with the
    environment in which the Learning by Doing takes place. In particular, Situated
    Learning is based on the belief that knowledge is situated, being in large part
    a product of the activity, context, and culture in which it is developed and used.
    Therefore, the environment in which the student practices their newly learned
    knowledge should be “authentic”, resembling, as closely as possible, the environment
    in which the knowledge will be used in real life. A popular application of this
    theory in software engineering education focuses on incorporating aspects of realism
    (or “authenticity”) into the class project, such as using an industrial participant
    to play the role of the customer (Hayes, 2002), using maintenance- or evolution-based
    projects (McKim & Ellis, 2004), or using large teams of people that are distributed
    across geographical locations (Favela & Pena-Mora, 2001).


    Like Situated Learning, Keller’s ARCS Motivation Theory (Keller, 1983) also focuses
    on motivating students to learn. However, rather than focusing on the physical
    environment in which they learn, Keller’s ARCS Motivation Theory concerns itself
    with producing certain feelings in the learner that are believed to promote learning.
    In particular, these feelings are attention, relevance, confidence, and satisfaction.


    +   - Attention: The attention and interest of the learner must be engaged. Proposed
    methods for doing so are: introducing unique and unexpected events; varying aspects
    of instruction; and arousing information-seeking behavior by having the learner
    solve or generate questions or problems.


    +   - Relevance: Learners must feel that the knowledge is relevant to their lives.
    The theory suggests that knowledge be presented and practiced using examples and
    concepts that are relevant to learners’ past, present, and future experiences.'
