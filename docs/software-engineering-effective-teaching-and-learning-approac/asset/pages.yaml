  md: 'missing in the requirements elicitation process and tend to be neglected subsequently.
    In addition to employing applicable software engineering techniques, the organization
    must understand how to incorporate the techniques into its existing software development
    processes (Linger, 1998). The identification of organizational mechanisms that
    promote or inhibit the adoption of security requirements elicitation can be an
    indicator of the security level of the resulting product.


    # RELATING sECURITY REQUIREMENTs PRACTICEs TO CURRICULUM MODELs


    Although data exists to support the benefit of requirements engineering in general,
    the data to specifically support the benefits of security requirements engineering
    is anecdotal. It is generally assumed that organizations could significantly improve
    the security of their systems by utilizing a systematic approach to security requirements
    engineering. Nevertheless, it was also felt that the first step in deciding how
    to integrate security requirements engineering into the bodies of knowledge of
    the contributing disciplines was to understand the precise relationship between
    security requirements practices and the curriculum models for each field. Thus
    a study was undertaken to specifically examine how security requirements might
    best fit into the curriculum requirements of all of the traditional computer disciplines.
    That effort was materially aided by the fact that the sponsoring societies of
    the three most influential areas in higher education had just finished their own
    comprehensive inventory of those curricula.


    # The Authoritative baseline: CC2005


    That study is the Computing Curricula 2005: The Overview Report, which is commonly
    called “CC2005.” CC2005 is fully endorsed by


    each of the three bodies that prepared it, which are the ACM, the IEEE Computer
    Society, and the Association for Information Systems. The intention of CC2005
    was to “offer society a practical vision of our shared field, of the various disciplines
    within it, and of the meaningful choices that face students, educators, and their
    communities. The goal of this report is to articulate the shared identity, the
    separate identities of each” (JTCC, 2005, p. 8). In that respect, CC2005 merges
    the recommendations for the content and focus of Computer Engineering, Computer
    Science, Information Systems, and Software Engineering curricula into a single
    authoritative digest.


    To accomplish this, a working group of ACM, IEEE, and AIS experts reviewed the
    most current curriculum models for each of the participating disciplines. The
    group then “compared the contents [specified in the five model curricula] to one
    another, and synthesized what [they] believe to be the essential descriptive and
    comparative information” (JTCC, 2005, p. 5). That analysis produced 40 topic areas.
    These 40 topics are considered to be the complete set of curricular items appropriate
    for all five major computing disciplines. The report specifically states that
    “each one of the five discipline-specific curricula represents the best judgment
    of the relevant professional, scientific, and educational associations and serves
    as a definition of what these degree programs should be and do” (JTCC, 2005, p.
    5).


    In addition to the 40 topic areas, which in effect summarize all of the knowledge
    input to the teaching and learning process, CC2005 also provides a comparative
    view of the capabilities that might be expected from graduates of each degree
    program (JTCC, 2005). Thus, “besides summarizing what a student will study, [the
    report also]...summarizes the expectations for the student after graduation” (JTCC,
    2005, p. 28). In some respects, the 60 capability goals were the greatest help,
    since they imply knowledge that'
