- pgno: 373
  md: '# Professional Experience


    Experience builds on knowledge in many essential ways. Such as:


    +   - It develops and improves practical skills and competencies.

    +   - It provides understanding of task definition in the users’ terms.

    +   - It helps develop interpersonal skills that facilitate the communication
    and human interaction between all participants.

    +   - As many approaches to problem solution are not readily scaleable experience
    over a wide variety of problem types and sizes is desirable before working in
    an unsupervised environment. Experience is generally required in assessing task
    complexity.

    +   - Task management, overall project management and quality management generally
    require experience.


    Other professions have clear requirements for experience before allowing their
    members to practice without supervision.


    *In addition to a demonstrated mastery of the body of knowledge a minimum of the
    equivalent of two years supervised experience is recommended before the practitioner
    operates unsupervised.*


    # Best Practice and Proven Methodologies


    Experienced practitioners have identified and documented many practices and methodologies
    the use of which generally leads to successful project outcomes. Where such best
    practice and proven methodologies are available the practitioner should use them
    unless a particular task has exceptional attributes.


    Member societies drawing on all available international sources should encourage
    the documentation and promulgation of best practice and proven methodologies.


    *Practitioners should be familiar with current best practice and relevant proven
    methodologies.*


    # Maintenance of Competence


    To maintain demonstrated competence practitioners must be familiar with new developments
    in their domains of practice.


    Such developments may be reflected in the body of knowledge, best practice and
    proven methodologies as well as in specific skills.


    Familiarity with new developments may be obtained through formal education or
    peer interaction.


    There may be assessment of current competence by formal examination, peer assessment
    or employer or client acknowledgement of successful work.


    A practitioner should participate for at least the equivalent of 10 days per year
    in activities that contribute to maintaining competence. It is recognised that
    in different locations the opportunities for such ongoing development may vary.


    The standard in each country or region must state how this requirement will be
    met and the role of the IFIP member society in monitoring this function.


    *Practitioners must be able to provide evidence of their maintenance of competence.*'
