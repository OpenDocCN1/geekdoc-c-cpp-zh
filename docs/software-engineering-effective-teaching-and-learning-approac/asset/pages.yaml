  md: '# About the Contributors


    USC, during a sabbatical in 2002 and has spent parts of the past five summers
    as a Visiting Researcher engaged in improving CS577. Dr. Klappholz has five years
    of experience teaching a sophomore/junior-level required DBMS RPRCC at Stevens,
    with mostly university faculty and staff as clients, but also with a few not-for-profit
    and industry clients who heard about the course by word of mouth.


    **Jochen Ludewig** was born in 1947 in Hannover, Germany. He holds a diploma in
    electrical engineering from the Technical University of Hannover, and a postgraduate
    certificate in computer science from the Technical University of Munich. He holds
    a PhD from the TU Munich with a thesis on the specification of software for real
    time systems (1981). After five years at Brown Boveri Research in Baden, Switzerland,
    he became an associate professor at the Swiss Federal Institute (ETH) at Zurich.
    In 1988, he returned to Germany as a full professor of software engineering at
    the Universität Stuttgart. He has authored or co-authored eight books, including
    an introduction to computer science and a textbook on software engineering. He
    designed the software engineering curriculum launched in 1996 at the Universität
    Stuttgart, and supervised and improved it ever since.


    **James McDonald** is associate professor and chair of the Department of Software
    Engineering, Monmouth University. He earned a bachelor’s degree in electrical
    engineering from New Jersey Institute of Technology, an MSEE degree from Massachusetts
    Institute of Technology and a PhD from New York University. Dr. McDonald has an
    extensive industrial background in both software and electrical engineering. He
    has worked at AT&T, Bell Laboratories, Bellcore and Lucent Technologies. He is
    a senior member of the Institute of Electrical and Electronic Engineers (IEEE),
    the IEEE Computer Society, the Association for Computing Machinery (ACM) and the
    American Society for Engineering Education (ASEE). At Monmouth University he teaches
    courses on Project Management, Software Organization Management, Software Verification,
    Validation and Maintenance, a Software Engineering Practicum, Information Technology
    and other software engineering topics. He is serving as an ABET program evaluator
    for electrical, computer and software engineering programs.


    **Nancy R. Mead** is a senior member of the technical staff in the Survivable
    Systems Engineering Group, which is part of the CERT Program at the Software Engineering
    Institute (SEI). Mead is also a faculty member in the Master of Software Engineering
    and Master of Information Systems Management programs at Carnegie Mellon University.
    Her research interests are in the areas of information security, software requirements
    engineering, and software architectures. Mead has more than 100 publications and
    invited presentations. She is a Fellow of the Institute of Electrical and Electronic
    Engineers, Inc. (IEEE) and the IEEE Computer Society and is also a member of the
    Association for Computing Machinery (ACM). Dr. Mead received her PhD in mathematics
    from the Polytechnic Institute of New York, and received a BA and an MS in mathematics
    from New York University.


    **Allen Milewski** is currently an associate professor of software engineering
    at Monmouth University in West Long Branch, NJ, USA. His research interests combine
    studies of collaborative work and user interface design. Projects include team
    collaboration, global teamwork and cultural variation in social and cognitive
    processes. In addition, he has published in the area of user interface internationalization.
    Most recently, he has included the design of collaborative information systems
    for Homeland Security and Emergency Management use. He has more than 20 years
    of Industry experience in engineering.'
