- pgno: 357
  md: '+   - A framework or meta model that was approved by IFIP in 1999 and which
    was defined in a document entitled “Harmonization of Professional Standards” (Mitchell,
    Juliff, & Turner, 1998) and

    +   - The “Software Engineering Code of Ethics and Professional Practice” (SECEPP,
    1999) produced under the auspices of the ACM and IEEE Computer Society.


    With regard to the other ACM and IEEE Computer Society initiatives, the project
    that was concerned with defining a Body of Knowledge was completed by the IEEE
    Computer Society alone after a difference of views split the relationship (ACM,
    2000). The resultant publication “Guide to the Software Engineering Body of Knowledge”
    (SWEBOK) appearing in 2004 (Bourque & Dupuis, 2004). However, the two societies
    subsequently worked together to produce the curriculum document “Software Engineering
    2004, Curriculum Guidelines for Undergraduate Degree Programs in Software Engineering”
    (IEEE-CS & ACM, 2004).


    # IFIP’s Professional standards Framework


    IFIP is a non-governmental, non-profit umbrella organisation for national societies
    working in the field of information processing. The federation is essentially
    a society of societies—included in its membership are the ACM, Australian Computer
    Society, British Computer Society, and IEEE Computer Society along with many others.
    IFIP has the mission to be the leading, truly international, apolitical organisation
    which encourages and assists in the development, exploitation and application
    of Information Technology for the benefit of all people. Technical work, which
    is the heart of IFIP’s activity, is managed by a series of Technical Committees
    (TCs). Each of these is in turn responsible for a number of working groups (WGs).


    During the 1990’s, IFIP started to address issues that were related to the movement
    of Information Technology professionals from one country to another. A driver
    behind this was a view from the World Trade Organisation that the establishment
    of standards regarding the qualifications of professionals was very important
    in an era of international treaties that promoted free trade and the free movement
    of workers from one country to another. In 1997 a working party was created whose
    aim was to produce a document that would clearly set out the standards of tertiary
    education, experience or practice, ethics, and continuing education that a customer
    might expect from a practitioner offering services to the public. During 1998
    a small writing party met and produced a draft standard entitled “Harmonization
    of Professional Standards” (Mitchell, Juliff, & Turner, 1998). This was subsequently
    presented in August 1999 to the IFIP Technical Committee on Education (TC3) and
    to a meeting of members of the TC3 Working Group that is concerned with Vocational
    Education and Training (WG3.4).


    The main parts of the IFIP Professional Standards document are reproduced as Appendix
    1 to this chapter and address the following six areas:


    +   - Ethics of professional practice,

    +   - Established body of knowledge,

    +   - Education and training,

    +   - Professional experience,

    +   - Best practice and proven methodologies, and

    +   - Maintenance of competence.


    Within Working Group 3.4 it was felt that the most appropriate area within the
    field of Information Processing for consideration of professionalism was Software
    Engineering. Thus, starting in September 2000 a series of activities commenced
    that was undertaken over a two year period to promote the IFIP Professional Standards
    document and provide a forum for an analysis of its'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'relevance to Software Engineering community. The overall reaction by the community
    was very encouraging—it was recognised that the IFIP document essentially defines
    a framework or meta model, which should assist advancing professional standards
    if it is used in a sensitive and appropriate manner. A summary of the work undertaken
    in promoting and evaluating document and the most significant outcomes were reported
    at the IFIP 2005 World Conference on Computers in Education (Thompson, 2005).
    That paper also details concerns associated with Software Engineering maturity
    in the areas of best practice and proven methodologies, maintenance of competence,
    and the educational support for these.


    # software Engineering Code of Ethics and Professional Practice


    The ACM and IEEE-CS collaboration with regard to Software Engineering started
    in 1993 with the creation of a Joint Steering Committee for “The Establishment
    of Software Engineering as a Profession”. The committee’s task was primarily to
    “establish the appropriate set(s) of criteria and norms for professional practice
    of software engineering upon which industrial decisions, professional certification
    and education curricula can be based.” (ACM & IEEE-CS, 1999a). In 1998 the two
    organisations further formalised their co-operation with the creation of Software
    Engineering Coordinating Committee (SWECC) which was made responsible for co-ordinating,
    sponsoring and fostering all their various activities regarding Software Engineering
    (ACM & IEEE-CS, 1999b).


    A major success resulting from the SWECC co-operation between the ACM and IEEE-CS
    was the production of the Software Engineering Code of Ethics and Professional
    Practice (SECEPP) by a task force led by Don Gotterbarn of East Tennessee State
    University.


    The code is available in two forms - a short version which summarises aspirations
    at a high


    level of abstraction and a full version which has additional clauses (SECEPP,
    1999). The latter provide examples and details of how the aspirations of the code
    should change the way people act as SE professionals. The current short version
    of the code (version 5.2) is reproduced in Appendix 2 to this chapter and addresses
    basic principles with regard to eight areas:


    +   - Public,

    +   - Client and Employer,

    +   - Product,

    +   - Judgement,

    +   - Management, Profession,

    +   - Colleagues, and

    +   - Self


    Perhaps of particular note is the ordering of these areas with “Public” first
    and “Self” last. The code in addition to being approved by both ACM and IEEE-CS
    (Gotterbarn, Miller, & Rogerson, 1999) has been widely adopted across the world
    (SECEPP, ud). In fact it appears to be one particular project that has been outstanding
    in the lack of criticism associated with it. A possible reason for this was that
    the task force which produced the code (consisting of a three-person Executive
    Committee and a general membership of 22 members) had a truly international composition.


    # TEACHING AND LEARNING APPROACHES


    The importance of addressing ethical and professional issues in Software Engineering
    programmes is clearly recognised within the guiding principles for the Software
    Engineering volume of the Computing Curricula:


    > “The education of all Software Engineering students must include student experiences
    with the professional practice of Software Engineering. The professional practice
    of Software Engineering'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'encompasses a wide range of issues and activities including problem solving,
    management, ethical and legal concerns…" (IEEE-CS & ACM, 2004, p. 10).


    The particular issues associated with professionalism and ethics in the real world
    situations that Software Engineers operate in have been addressed in many papers
    and texts since the mid 1990s (e.g. Myers, Hall & Pitt, 1997, and Bott, 2005).
    Unfortunately, support for the teaching and learning related to the subject area
    is not so readily available as for other more technical subjects such as design
    and testing. A further problem is that the major Software Engineering textbooks
    tend to provide little more than passing references to professional and ethical
    issues. However, various teaching and leaning approaches have been addressed in
    depth in recent papers presented at the 2003 and 2004 Conferences on Software
    Engineering Education and Training (Towell, 2003, and Towell & Thompson, 2004).
    In addition, papers addressing teaching and learning approaches that relate to
    addressing professionalism and ethics, but to a wider computing audience, can
    be found in the proceedings of the Ethicomp Series of Conferences, The Ethicomp
    Journal and the Journal of Information Communication and Ethics in Society (further
    information on theses sources can be obtained from the Centre for Computing and
    Social Responsibility at De Montfort University (DMU, 2007)).


    More plentiful sources of information on teaching and learning approaches are
    the various workshops and tutorials that have been held in conjunction with international
    conferences (e.g. Granger et al (1997), Gotterbarn & Miller (2001), Thompson &
    Towell (2004)). The latter of these events was held at the 2004 Conference on
    Software Engineering Education and Training and specifically addressed the teaching
    of ethics in Software Engineering programs. The operation and results of the workshop
    were subsequently reported in the 160th issue of the Forum


    for Advancing Software engineering Education (FASE, 2004). During the workshop
    the commonest teaching techniques that were used when addressing ethics were identified
    as:


    +   - Discussion of an instructor’s personal experiences

    +   - Discussion of current events

    +   - Reviewing various codes of ethics such as the Software Engineering Code
    of Ethics and Professional Practice

    +   - Using case studies to highlight particular ethical considerations.

    +   - Using role-play to engage students in the exploration of ethical situations

    +   - Using games such as Lockheed Martin’s “The Ethics Challenge” (documented
    by Bekir, Cable, Hashimoto, & Katz, 2001)

    +   - Employing Web-Based Learning Systems such as Walter Maner’s Interactive
    Computer Ethics Explorer. (Maner, ud)


    Further details of these approaches can be found in a paper by Towell, Thompson
    and McFadden (2004) which considered how to address professional standards within
    the Information Systems curriculum.


    When it comes to delivery of ethical and professional related topics a major issue
    that instructors have to address is: whether the best approach is to have one
    or more very specific modules that address these areas or whether the topics should
    be treated throughout the curriculum and thus directly complement and support
    the other subject areas. Gotterbarn (2001) is a clear proponent of the pervasive
    approach, however this can present some real difficulties:


    +   - The majority of the staff teaching the other subjects need themselves to
    believe in the importance of ethics and professionalism and they need to have
    the necessary knowledge to address the issues that are likely to be raised by
    the students.'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'If the academic programme needs to be accredited (for example, by ABET in the
    USA or the British Computer Society in the UK) it can very hard to convince a
    visiting accreditation panel that these topics really are pervasive throughout
    the curriculum.


    The pragmatic approach taken by many institutions, especially when accreditation
    is seen as a major requirement, is to simply have one or more explicitly titled
    modules that can easily be identified as addressing the relevant issues.


    # THE sUNDERLAND APPROACH: OVERVIEW


    At the University of Sunderland we have employed a particular approach to addressing
    ethical and professional practice concepts within our masters level programmes
    in computing that combines several of the strategies listed in the previous section.
    These programmes cover a wide range of range of specialisms including a Masters
    in Software Engineering. A common module entitled Research, Ethical, Professional
    and Legal Issues forms a key part of each of these programmes and it is within
    this module that we address issues relating to professionalism, ethics and codes
    of practice. Here, I intend only to consider the activities that we undertake
    in lecture and tutorial sessions that are relevant to ethics and professional
    practice. Tutorials, in the Sunderland context, are formal timetabled sessions
    with a tutor and a relatively small group of students that usually involves practically
    orientated or discursive work. Details of the overall module, its learning outcomes
    and its operation can be found in a paper that was presented at the 2004 ETHICOMP
    Conference (Thompson & Edwards 2004). Nevertheless it is worth noting that in
    a single year the module has been studied by up to 300 masters level students
    on-campus by


    direct instruction and by an equal number of off-campus students via distance
    learning materials. Many of the on-campus programmes have a high intake of overseas
    students and we have found the approach to be very effective no matter what the
    ethnic mix. The major element of assessment is a critical review paper that addresses
    a particular ethical, professional, or legal issue and what we do in class helps
    provide a contextual understanding to support this.


    Our approach makes use of the following:


    +   - A brainstorming session to identify current ethical challenges.

    +   - Consideration of a number of very short situational case studies.

    +   - Consideration of international developments

    +   - Consideration of the IFIP model as a framework for professionalism.

    +   - Consideration of the Software Engineering Code of Ethics and Professional
    Practice (SECEPP)

    +   - A major class role play exercise that makes use of the SECEPP and a fictitious
    case study - “The Case of the Killer Robot” (Epstein, 1997).


    The above will be considered in turn in the following four sections. What we believe
    is important is student engagement and mechanisms that will encourage them to
    work together in teams rather than as individuals. We try to minimise the amount
    of face to face classroom teaching that involves simply information transfer.
    Our strategy is to use the lecture sessions to cover major concepts, outline new
    activities, and provide feedback on previous activity. The real work is undertaken
    in much smaller tutorial sessions via truly active learning.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# THE sUNDERLAND APPROACH: PREPARATORY WORK


    When addressing the concept of ethics we try and keep things as straightforward
    as possible. We start by pointing out that there are great debates by philosophers
    concerning ethics and morality but that we will simply consider ethics to be the
    moral principles held by an individual or a group. Thus, given a set of ethics,
    an individual can decide whether they believe certain behaviour to be right or
    wrong. We expand on this by considering ethics in academic research (which students
    can usually directly relate to) and the role of ethical committees to vet research
    activities. From then we go on to consider the ethical use of computer-based information
    systems especially with regard to the handling of personal information. Here we
    can use the lecturer’s own experiences and even those of some of the students
    themselves.


    Our first tutorial exercise is aimed at developing student engagement and collecting
    as wide a set of views as possible. We issue the students with Post-Its and then
    ask each student to write on a Post-It what they consider to be a major ethical
    challenge in computing. The submissions are posted on the classroom wall and one
    or two students are charged with the task of organising the submissions into groupings.
    We get the students to view and consider what has been submitted, and we then
    follow this with a classroom discussion in which we attempt to expand on the issues
    raised.


    Our next classroom exercise involves consideration of a set of mini-scenarios
    that were detailed in a paper “Can a Software Engineer Afford to be Ethical” (Langford,
    1996). These cover elements of individual behaviour, “public” behaviour, company
    behaviour, and effects of acting unethically at work with regard to short term
    consequences, image, and the law. We issue the students with copies of the paper
    several days before the class, tell them to read it fully and consider whether
    or not the examples are still relevant today (the paper being over 10 years old).
    The students have by then been organised into groups and they are told to discuss
    their individual findings with the other members of the group and come to a consensus
    opinion on each scenario prior to the class meeting. In the class itself we will
    get each group to present their findings on one particular scenario – each presentation
    is then followed by a class discussion. An alternative approach (if verbal student
    presentations present too much of a challenge) is, at the start of the session,
    to issue each group with one or two sheets of poster-sized paper and get the group
    to write up their findings on one particular scenario. These are then posted on
    the classroom wall, the students view them and then we debate each one. Once started,
    students will usually debate issues for a reasonable time – getting them to debate
    is usually not a challenge, although getting groups or individuals to do presentations
    often is! Hence the use of posters.


