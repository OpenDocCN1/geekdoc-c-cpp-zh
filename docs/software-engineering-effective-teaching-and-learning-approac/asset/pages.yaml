    # RELATED REsEARCH


    Software engineering in higher education is maturing at a fast rate, even in the
    face of enrollment declines. The field has been very active over the past decade
    with new degree programs coming online (Bagert & Chenoweth, 2005), curricular
    recommendations (ACM & IEEE-CS, 2004), an availability of a body of knowledge
    (IEEE-CS, 2004), and a growing body of literature on software engineering pedagogy,
    much of it focused on project-oriented coursework. There are a large number of
    variations possible in software engineering projects, and the Software Enterprise
    both borrows and advocates practices taken from


    previous works at other academic programs, as described throughout the chapter.
    In this section we draw attention to project offerings particularly influential
    on the overall structure and implementation on the Enterprise.


    Specific programs with exemplary project offerings that have had a deep influence
    on our evolution of the Software Enterprise include the Software Development Studio
    component of the Professional Master’s program at Carnegie Mellon University (Tomayko
    1996), the Software Development Laboratory at the Milwaukee School of Engineering
    (Sebern 2002), the Capstone projects at Auburn University (Umphress, Hendrix,
    & Cross, 2002), and the Capstone projects in the'
