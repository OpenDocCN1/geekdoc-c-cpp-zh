- pgno: 387
  md: '# EFFORTs TO sTANDARDIzE PROFESSIONAL CREDENTIALs


    It’s important to note that job frameworks are organized around skills and skill
    levels. This contrasts with the knowledge-based approach used by the CSDP certification
    scheme and the SWEBOK body of knowledge.


    The SFIA and EUCIP job frameworks were designed to cover the entire spectrum of
    information technology careers. The extent of this coverage tends to make such
    frameworks a less than perfect fit for industrial sectors or firms with specific
    needs. Grant (2006) explores the tension between specific and industry-wide frameworks.


    The increasing globalization of the software industry suggests that software engineers
    will increasingly need to move between countries. Such individuals will need a
    way of acquiring professional software engineering credentials that are portable
    across national borders. One possible approach would be for one country to enter
    into bilateral agreements with other countries for mutual recognition of professional
    credentials. Japan has done this for its examination scheme with other Asian countries.
    The problem with this approach is that the number of bilateral agreements quickly
    becomes very large, and managing a country-by-country equivalence matrix will
    become a large problem.


    A simpler and more maintainable approach would be to create an international standard
    for software engineering certifications. The existence of such a standard would
    make it easier for software engineering professionals to establish the international
    validity of certifications awarded by a country or professional society. A subcommittee
    of the International Standardization Organization (ISO) began such an effort in
    Fall 2004. Specifically, the ongoing effort is taking place within a working group
    of ISO/IEC JTC1 SC7, which is charged with developing software and systems engineering
    standards. A working draft of the standard has already been prepared, and it is
    hoped that the standard will be in final form and approved as an international
    standard by 2008. A certification scheme claiming conformance with the proposed
    standard will need to demonstrate (1) that it incorporates the processes for certification
    of individuals included in the existing international standard (ISO/IEC 17024)
    and (2) that the body of knowledge used by the certification scheme can be mapped
    to the SWEBOK body of knowledge for software engineering (Software Engineering
    Body of Knowledge, 2004).


    engineering standards. A working draft of the standard has already been prepared,
    and it is hoped that the standard will be in final form and approved as an international
    standard by 2008. A certification scheme claiming conformance with the proposed
    standard will need to demonstrate (1) that it incorporates the processes for certification
    of individuals included in the existing international standard (ISO/IEC 17024)
    and (2) that the body of knowledge used by the certification scheme can be mapped
    to the SWEBOK body of knowledge for software engineering (Software Engineering
    Body of Knowledge, 2004).


    Regional approaches to standardization are also under consideration. Several European
    countries have created job frameworks for information technology. We have already
    discussed the SFIA and EUCIP job frameworks, but there have also been other efforts
    to create frameworks in Europe. For this reason, the European Union has been working
    on standardizing professional credentials in information technology. This ongoing
    effort is centered in the work of the European Centre for the Development of Vocational
    Training (known by the French acronym CEDEFOP, www.cedefop.europa.eu). This organization,
    created in 1975, is the European Union’s reference center for vocational education
    and training. One example of CEDEFOP’s efforts to establish European standards
    for information technology skills is a series of conferences dealing with “e-skills”
    issues in Europe. The most recent conference in this series took place in Thessaloniki
    in October 2006. The URL describing the conference is http://eskills.cedefop.europa.eu/conference2006.
    One of the background papers for this conference is a document (European Committee
    for Standardization, 2006) released in February 2006 that proposed a European
    meta-framework for information technology skills. The intention is that a European
    meta-framework would provide a structure that could be used to contrast and compare
    existing national job frameworks, such as the UK’s SFIA, the German AITTS framework
    (Federal Ministry'
