- pgno: 318
  md: 'diversity spans several dimensions: educational background, employment status,
    educational goals and native language. The successful program must address all
    these dimensions of diversity.


    # Educational backgrounds


    Consistent with the origins of the program, many students in the graduate program
    achieved undergraduate degrees in computer science. These students have strong
    programming skills, but very seldom have the engineering discipline that emphasizes
    understanding the problem to be solved, or the process to be followed. These students
    tend to immediately start coding once they receive a problem to be solved. Students
    asked on more than one occasion why it was necessary to design a program when
    they could write one faster.


    We also have a large population of students that are coming into the graduate
    program from other engineering and non-engineering disciplines. These students
    usually are much more accepting of engineering processes, but have relatively
    weak programming skills and minimal knowledge about how computers function. To
    accommodate them we have had to incorporate a set of preparatory courses to provide
    the programming skills and computer knowledge necessary to succeed in the program.


    Our program has already started receiving a new group of students. These students
    have undergraduate degrees in software engineering and already have a good understanding
    of engineering practices balanced with programming skills. At this point, our
    program had to address increasingly more advanced software engineering topics
    that may be beyond the knowledge of the other two groups of students. A detailed
    discussion of this topic is deferred to in the Future Trends section.


    # Employment status


    The employment status of students has significant impact on the program. It affects
    how long students


    are in the program, the effort that they put into assignments, their willingness
    to accept course material, and when classes are offered. It should be noted that
    (with a few exceptions) students entering into the program full-time usually find
    work at the end of their first year and become part-time students. The majority
    of our student population attends school part-time with full-time employment in
    the software industry. Most of our classes are offered in the early evening to
    accommodate them.


    The fact that the average student is employed full-time and attends classes part-time
    means that they may be in the program for as long as 8 years. In fact, the population
    of students is much more stable than the curriculum. Some students have graduated
    on curriculums that have been replaced twice since they enrolled in the program.


    Employment in the software industry has significant impact on the willingness
    of some students to accept the concepts taught in the classroom. These students
    have already acquired work habits that are not consistent with best practices.
    Students often state that they don’t perform a particular engineering practice
    at work and that they don’t see a need for it. Of course, many of these same students
    talk about how their projects at work tend to be chaotic. Other students report
    the difficulties they’ve encountered in trying to practice in their conservative
    organizations what they’ve learned in class. Either case tends to undermine the
    instructor in presenting new material in the classroom. Here is one of the situations
    where the instructor’s industrial experience plays an important role in both selecting
    the material to be taught and in responding to student concerns regarding the
    usefulness of the topics learned in the real world.


    Employed students also tend to focus on what they immediately need to succeed
    in today’s workplace. There is often an insistence on learning a product (such
    as Oracle or Sybase) rather than the concepts (i.e., database principles). This
    emphasis on skill rather than knowledge runs counter to'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'the goals of the program that are the development of software engineers who
    can lead their organizations into the future. We have included some of these products
    into our classrooms, but the main goals of the courses remain to teach the engineering
    principles of the field, which can be applied to a large number of products.


    Students who are not employed in the industry have problems prioritizing the material
    being taught or placing it in the context of delivering a product. If they are
    required to know C++, they assume that all employers develop code in C++. They
    are often surprised when they get a job and discover that they will have to learn
    a new programming language. Students are occasionally concerned that courses cover
    many different methods and approaches to achieve a given goal rather than emphasize
    one method. They have to be taught to understand that the knowledge and skill
    they acquire in school will have to blend into whatever organization they join,
    and that they need to engage in a lifelong learning process that is inevitable
    in this dynamic field.


    +   - Start a career in which they can have a significant income

    +   - Get a job in the software field that does not involve a lot of coding.


    The major impact of these goals concerns the subject areas that interest the student.
    We have had to tailor our curriculum to respond to these different goals. We find
    a significant fraction of the students are very interested in the process, project
    management, and organizational management courses. Others find that the courses
    on requirements and software testing give them an entry point into a part of the
    software business that does not appear to require major coding efforts. Finally,
    the courses that emphasize specific types of software systems (real-time, information,
    and embedded systems) attract those students that are interested in gaining the
    particular knowledge and skills that will allow them to master their chosen field
    of work.


    # Communications skills


    There is significant diversity among our students in terms of their communication
    skills. However, communication skills are critical in software engineering, being
    considered as important as the technical skills (Teles, 2003; Lethbridge 2000).
    The average software engineering student will probably produce more documents
    and make more public presentations than the average English major. Communications
    have to be precise, unambiguous, complete, logically sound and well structured.
    Oral presentations have to convey complex information under time constraints.
    Students have to learn to gauge how much information is to be conveyed. This requires
    that they judge what their audience can be expected to know and what must be presented.
    Although typical undergraduate general education programs attempt to teach these
    skills most students who enter our graduate program require additional coaching
    and training in this area.


    # Educational Goals


    It would be nice if all students entered the program with the desire and goal
    of becoming a software engineer and delivering a specific kind of product. However,
    the educational goals of the students range from wanting to know all about software
    and engineering, to the other extreme where they only want to get the credentials
    that will allow them to earn a higher salary. Our student body appears to be driven
    by a small number of educational goals, as we were able to derive from their application
    packages, advising sessions and an alumni survey. These are:


    +   - Get the business and process knowledge that will allow them to manage software
    projects and people.

    +   - Get the skills and knowledge that will allow them to be more productive
    in their chosen career.'
