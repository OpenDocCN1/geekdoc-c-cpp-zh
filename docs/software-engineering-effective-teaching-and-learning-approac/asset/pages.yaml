- pgno: 346
  md: 'Growth in the field will come from rapidly evolving technologies as well as
    new software needs driven by information security concerns.


    With growing internationalization of software development, some countries will
    see more software development contracted out abroad. However, jobs in software
    engineering are less prone to being sent abroad because the occupation requires
    innovation and intense research and development. Most companies prefer to keep
    this function in-house whenever practical.


    Since the BSSE is a relatively new major, it is often difficult to obtain accurate
    statistics which isolate the major. This is true when discussing starting salaries.
    Some basic information is available from the National Association of Colleges
    and Employers web site (National Association of Colleges and Employers, 2007)
    (more detailed information is available to members). This press release lists
    the average starting salary offer to recent bachelor’s graduates in Management
    Information Systems/Business Data Processing as $46,966. The average offer for
    Computer Science graduates is listed as $52,177. The press release does not distinguish
    between types of job, nor does it list Software Engineering as a category of degree.


    The United States Bureau of Labor Statistics (U.S. Department of Labor, 2006b),
    lists median salary data for computer software engineers in the United States,
    but the data is for the profession. As discussed below, most practicing software
    engineers do not have a degree in Software Engineering, so the data applies to
    anyone working as a software engineer, not just to those with a Software Engineering
    degree.


    Given the promising employment outlook, a follow-up question is whether students
    are enrolling in BSSE programs. If we build it, will they come?


    As with employment trends, it is difficult to obtain accurate enrollment statistics
    which apply specifically to the Software Engineering major. The Digest of Education
    Statistics, 2005 (National


    Center for Education Statistics, 2005), lists 163 students receiving a Bachelor’s
    degree in Computer Software Engineering in 2003-04, while the 2004 Digest (National
    Center for Education Statistics, 2004), lists 121 students receiving a Bachelor’s
    degree in Computer Software Engineering in 2002-03. These are the most recent
    official statistics generally available as of this writing. While these statistics
    indicate solid growth in the number of bachelor’s degrees granted, the number
    of SE graduates is still extremely small when compared with the number of software
    engineers needed.


    It is also difficult to obtain statistics for software engineering as a career
    preference. For example, the Post-Secondary Planning Survey Analysis, conducted
    by the National Research Center for College and University Admissions (NRCCUA)
    Career-Choice Preferences lists “Computer Sciences,” “Information Technology,”
    and several Engineering choices, but “Software Engineering” is not included as
    a separate choice (NRCCUA, 2007). The SAT survey of intended majors of college
    bound students in 2007 includes only the broad categories of “Computer and Information
    Sciences and Support Services” and “Engineering” (The College Board, 2007).


    Based on the above numbers, it can be concluded that most practicing software
    engineers do not have a degree in Software Engineering, but rather in Computer
    Science or some other related discipline. The question is whether a traditional
    Computer Science degree program best prepares a student for today’s typical software
    engineering jobs and future career need not be addressed; there is room for and
    need for both majors.


    With promising employment and enrollment outlooks, a final general question is
    whether the market is already flooded with new BSSE programs. The brief, simple
    answer is “no” (or at least it was in 2002 and still is at the time of writing).


    In 2003, there were 21 known programs in the United States offering some type
    of bachelor’s'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'degree in Software Engineering, with more being proposed (Bagert, 2003). As
    of January 1, 2007, there are at least 34 known BSSE programs in the U.S. 13 of
    which are accredited by ABET (ABET, 2006). Based on these numbers and the projected
    need for Software Engineers, it seems that many more programs with a Software
    Engineering focus are needed.


    # building Additional support


    Once these initial questions are answered, support to proceed must be obtained
    from several groups. First, the affected faculty must support the program. If
    housed in a Computer Science program, one adjustment will be a shift in the focus
    of some upper division courses. The basics of programming, database, networking,
    operating systems, and computer architecture will be taught in both majors. However,
    Computer Science majors will then study topics such as analysis of algorithms,
    comparative programming languages, compilers, and formal languages. Software Engineers,
    on the other hand, with study topics such as software design and test, software
    architecture, requirements, project management, quality assurance, and human interface
    design.


    For some faculty, this will be an issue. It will be seen as a move from a set
    of courses with technical, well-defined content to a set of courses with a more
    subjective content. If co-located with a Computer Science program, the split in
    focus and teaching assignment for upper division courses may fall naturally along
    the strengths and interests of the faculty and be seen as a positive. If not,
    some accommodation will need to be made for and by the faculty. This can often
    be accomplished by judicious distribution of the core set of courses. Regardless
    of initial reaction, recent downward trends in enrollment in Computer Science
    programs should provide motivation for faculty to support a program which will
    likely lead to an increase in enrollment.


    Once the faculty is behind the concept of a Software Engineering program, the
    university administration must be convinced that launching the program is a good
    idea. While there are several factors involved, the overriding issue with the
    administration is likely to be economic: will the new program make money or lose
    money? For a university, the business case will boil down to whether revenue from
    increased enrollment will offset increased costs. The overall impact of the program
    proposal was the creation and staffing of seven new courses in software engineering;
    if offered annually, as was the plan, this defined the need for a new faculty
    member. In our case, we developed our proposal to feature launching the program
    first, and then adding the new faculty member in the second year in order to offset
    the economic impact.


    Cost increase can vary greatly depending on factors discussed in preceding sections.
    If the program is housed in a department such as Computer Science, there can be
    much reuse of courses and faculty. As such, there will likely be little additional
    cost when the program is first launched. As the program moves into its third and
    fourth years, new upper division courses must be developed and taught. Part of
    this cost can be shifted by eliminating or reducing the frequency of current courses
    which are under-enrolled. Other costs are more than offset by the increase in
    enrollment.


    A further advantage to the university is the visibility of offering a cutting-edge
    program. This will help attract both students and faculty. It will also bolster
    the overall image of the university. In our case, adding the SE program led to
    a change in the CS+SE enrollment trends – what had been on significant decline
    grew slightly and stabilized.


    Finally, to be successful, the program must be attractive to both students and
    their parents. One major point, of course, is that Software Engineering is a promising
    career. The field provides an adequate number of jobs and good salaries. A degree
    in Software Engineering provides the right'
