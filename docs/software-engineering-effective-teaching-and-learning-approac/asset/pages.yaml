  md: '# LEARNING THEORY-bAs ED CATEGORIzATION OF EXIs TING APPROACHES


    One of the main ways that learning theories can be used in software engineering
    educational research is to provide the field with a way to analyze and categorize
    existing approaches, both independently and in relation to each other. Such a
    categorization can serve to help us understand how the different approaches fit
    together and create a picture of the field as a whole, so that areas of


    strengths, weaknesses, and untapped potentials can be unearthed. We have done
    such a categorization, which we will present in this section.


    Before creating this categorization, in order to organize our analysis we first
    surveyed the major software engineering educational approaches published in the
    past several years and found that they can be lumped into three broad groupings:
    realism, topical, and simulation (these groupings can be broken down further into
    sub-groupings, as shown in Table 1). Realism approaches are those that focus on
    making various aspects of


    Table 1. Grouping of software engineering educational approaches


