- pgno: 332
  md: 'While the authoritative sources (ABET, SE2004 and SWEBOK) are all aimed at
    different target audiences, the definitions of software engineering they provide
    for these audiences are important. These definitions all speak directly to what
    the expectations would be for our BSSE graduates after the program was established,
    hopefully accredited, and they were well into their careers. Because the definitions
    were external, they carried significantly more weight than the viewpoint of any
    particular faculty member. These definitions, once blended, became central to
    developing the shared vision for our BSSE program as the program was developed,
    and has since continued to support outcomes assessment and program enhancement.


    Educational Objectives, is a broader set which applies to all engineering programs.
    The second category provides each engineering discipline a unique set of program
    criteria specific to the discipline.


    While these objectives and criteria are definitive for accreditation in the U.S.,
    they do not provide as much detail as the SE2004 guidelines (Diaz-Herrera, 2004).
    The difficulty is that when comparing the SE2004 Student Outcomes (Diaz-Herrera,
    2004) with the related EAC Program Educational Objectives (ABET, 2005) and EAC
    SE Program Criteria (ABET, 2005), there are noticeable gaps among them (Frezza,
    2006). However, the superset of related SE skills indicates that a program should
    provide at least the following outcomes (Frezza, 2006):


    # DEFINING THE bss E GRADUATE


    For the purposes of creating a quality, accreditable program, it is essential
    to define the desired knowledge and skills possessed by the BSSE graduates. One
    of the more useful forms for defining the desired knowledge and skills are the
    “outcomes” for the program. Outcomes relate to broadly defined skills, knowledge,
    and behaviors that students should acquire as they progress through the program
    (Wankat, 1993). If a graduate achieves all the program outcomes, this indicates
    that the student meets the program’s stated educational objectives and is equipped
    to function as expected of a BSSE graduate.


    To create an accreditable SE program, the program design must meet the established
    educational objectives and program criteria for a BSSE program. There are at least
    two primary sources for these objectives and criteria which define the minimal
    knowledge and skills for a BSSE graduate. In the US, the Engineering Accreditation
    Commission (EAC) provides two categories of objectives and criteria that apply
    to the design of engineering programs (ABET, 2005). The first category, the EAC
    Program


    +   - Show mastery of the software engineering knowledge and skills, and professional
    issues necessary to begin practice as a software engineer

    +   - Demonstrate the ability to appropriately apply science, discrete mathematics,
    empirical techniques, probability and statistics and relevant topics in computer
    science and supporting disciplines to the development of complex software systems

    +   - Work as an individual and as part of a multidisciplinary team to develop
    and deliver quality software artifacts

    +   - Reconcile conflicting project objectives, finding acceptable compromises
    within limitations of cost, time, knowledge, existing systems and organizations

    +   - Design appropriate solutions in one or more application domains using software
    engineering approaches that integrate ethical, social, legal and economic concerns

    +   - Understand professional and ethical responsibility

    +   - Demonstrate an understanding of and apply current theories, models, and
    techniques that provide a basis for problem identification'
