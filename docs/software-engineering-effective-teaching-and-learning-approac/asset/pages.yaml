- pgno: 79
  md: '# On the Role of Learning Theories


    attention and making it likely that they learn through failure at times) but not
    impossible, promoting eventual success that leads to confidence in the learning
    material and satisfaction in the experience (central principles to Keller’s ARCS).


    Looking back on the design of SimSE in light of learning theories served to link
    some of our intuition in the design of SimSE to these theories, thereby increasing
    our confidence of being on the right path with our approach. In addition to this,
    it also revealed some missed opportunities that we could have taken advantage
    of, had we originally designed SimSE with learning theories in mind. For example,
    we could have better taken advantage of the Elaboration theory by designing our
    models in incrementally complex versions, and introducing them to students in
    order of increasing complexity. In our usage of SimSE in courses and in out-of-class
    studies, we also could have made reflection a more central and structured part
    of the approach by providing the student with explicit explanatory tool exercises
    to complete, exercises that would encourage the type of reflection that would
    help solidify the lessons learned in the simulation (currently, the student is
    simply given the explanatory tool, and decisions about how to use it are left
    up to them). As another example, we could have better incorporated aspects of
    authenticity (promoting Situated Learning) by including more random events (a
    characterizing feature of the real world) in our models. These types of events
    are only used sparingly in many of our models.


    Like most software engineering educational approaches, SimSE was not designed
    with learning theories in mind. However, by looking back on its design in light
    of learning theories, we have learned a great deal about how SimSE promotes learning
    and how it can be improved to foster greater learning, as we have seen in this
    section.


    # LEARNING THEORY-CENTRIC EVALUATION


    Although we did not explicitly use learning theories in SimSE’s initial design,
    we did use them as a central guiding factor in designing a major part of its evaluation.
    Validating that the theories an approach was designed to employ (or appear to
    employ) are actually employed, as well as discovering if an approach incorporates
    aspects of any additional theories, can be highly useful exercises—such data can
    be used to make that and other similar approaches more effective as they are tailored
    to exploit the characteristics known to promote each theory (van Eck, 2006). Thus,
    as part of SimSE’s evaluation, we performed an in-depth observational study that
    focused on investigating the learning processes of SimSE players to determine
    whether they exhibited behaviors indicative of various learning theories.


    # Case study: simSE Evaluation setup


    For this study, we used as subjects 11 undergraduate students who had passed the
    introductory software engineering course at the University of California, Irvine.
    This requirement was put in place so that they would have at least the basic understanding
    of software engineering concepts required to play SimSE. The study occurred in
    a one-on-one setting—one subject and one observer. Each subject was first given
    instruction on how to play SimSE, and was then observed playing SimSE for about
    2.5 hours. In order to evaluate how well the explanatory tool achieves its goal
    of aiding Learning through Reflection, we had eight students play SimSE with the
    explanatory tool and three without. (Differences in the behavior, attitudes, and
    opinions of each group could then be compared, though clearly, not to the extent
    of being statistically significant.) While subjects were playing, their game play
    and behavior were observed and noted. Following this, the subject was interviewed
    about their experience for about'
  merge: -1
  img_proc: true
- pgno: 80
  md: '30 minutes. In addition to any spontaneous questions the observer formulated
    based on a particular subject’s actions or behavior during game play, all subjects
    were asked a set of standard questions. Several of these questions were designed
    to specifically detect the presence of one or more learning theories in the subject’s
    learning process. Some questions did not target a particular theory or set of
    theories, but were instead meant to evoke insightful comments from the subject
    from which various learning theories could be inferred, and from which general
    insights into the learning process could be discovered. Some samples from the
    standard set of questions are listed here, with the targeted learning theory (or
    theories) listed in parentheses afterwards when applicable.


    +   - *To what do you attribute the change (or lack of) (improvement, worsening,
    fluctuation, steady state) of your score with each game?* (Discovery Learning,
    Learning through Failure)

    +   - *Do you feel you learned more when you “won” or when you “lost”? Why? What
    did you learn from each “win” or “loss”?* (Discovery Learning, Learning through
    Failure)

    +   - *When you lost, did you feel motivated to try again or not? Why?* (Learning
    through Failure)

    +   - *On a scale of 1 to 5, how much did playing SimSE engage your attention?
    Why?* (Keller’s ARCS)

    +   - *How much has your level of confidence changed in the learning material
    since completing this exercise?* (Keller’s ARCS)

    +   - *Did you feel that you learned any new software process concepts from playing
    SimSE that you did not know before? If so, which ones?* (answer could be indicative
    of multiple theories)

    +   - *If you feel you learned from SimSE, what do you believe it is about SimSE
    that facilitated your learning?* (answer could be indicative of multiple theories)


    *your learning?* (answer could be indicative of multiple theories)


    There were also some questions primarily designed for comparison between the subjects
    who used the explanatory tool and those who did not. These questions were aimed
    at discovering how the player went about figuring out the reasoning behind their
    scores, as well as how well they understood this reasoning.


    +   - *Where do you think you went wrong in game 1/2/x?* (Learning through Reflection)

    +   - *Please describe the process that you followed to figure out the reasoning
    behind your score, or where you went wrong/right.* (Learning through Reflection)


    Following the experiment, the interviewer’s observations and interview notes were
    analyzed to try to discover which behaviors and comments were indicative of the
    various learning theories, and how, as well as to discover any other insights
    about SimSE as a teaching tool that could be gained from this data.


    # Evaluation Results


    The learning theory that was most clearly involved in every subject’s learning
    process was Discovery Learning. All subjects were able to recount at least a few
    lessons they learned from SimSE, and none of these lessons were ever told to them
    explicitly during their experience. Rather, they discovered them independently
    through exploration and experimentation within the game. Interestingly, although
    all subjects that played a model seemed to discover the same lessons (for the
    most part), no two subjects discovered them in the same way. Every subject approached
    the game with a different strategy, but came away with similar new knowledge,
    suggesting that SimSE can be applicable to a wide range of students that come'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'from different backgrounds with different ideas and possibly, different learning
    styles. This is a central aspect of a student-centered theory like Discovery Learning.
    Since learning depends primarily on the learner and not the instructor, the learner
    is free to use their own style and ideas in discovering the knowledge, rather
    than being forced to adhere to a rigid style of instruction.


    Learning through Failure also seemed to be widely evident. Every subject seemed
    to take a “divide and conquer” approach to playing SimSE, isolating aspects of
    the model and tackling them individually (or a few at a time). When subjects described
    the progression of their games in the interviews, it was clear that the way they
    conquered each aspect was by going through at least one or two rounds of failure
    in which they discovered what not to do, and from this discovering a correct approach
    that lead to success. When asked explicitly about learning through failure, every
    subject stated that they learned when they failed, but the amount of learning
    they reported varied. Five subjects said they learned more from failure than success,
    two subjects said they learned more when they succeeded, and four subjects said
    they learned equally as much from failure and success. All but one subject said
    that they were motivated to try again after they failed. This motivation was also
    evident in the behavior of several subjects, as some, after the completion of
    one failed game, hurriedly and eagerly started a new one. One subject even tried
    to start a new game when the time for the game play portion of the experiment
    was up and he was already informed that it would be the last game.


    The Learning by Doing theory seemed to be involved in most of the subjects’ learning
    experience. Eight out of the 11 subjects made comments about their experience
    playing SimSE that hinted at aspects of Learning by Doing. Some of their comments
    included:


    +   - “[SimSE helped me learn because it] puts you in charge of things. It’s a
    good way of applying your knowledge.”


    +   - “[SimSE helped me learn because it is] interactive, not just sitting down
    and listening to something.”


    Comments indicative of Situated Learning were also rather frequent, mentioned
    by seven out of the 11 subjects. Some of these included:


    +   - “[SimSE helped me learn because] it was very realistic and helped me learn
    a lot of realistic elements of software engineering, such as employees, budget,
    time, and surprising events.”


    +   - “[One of the learning-facilitating characteristics of SimSE was] seeing
    a real-life project in action with realistic factors like employee backgrounds
    and dialogues.”


    Behaviors and comments suggestive of Keller’s ARCS Motivation Theory were also
    evident, although certain aspects of the theory came out stronger than others.
    To explain, let us look at the four aspects of the theory (attention, relevance,
    confidence, and satisfaction) individually.


    First, the attention of the subjects seemed to be quite engaged with SimSE. This
    was evident in their body language, the comments made both during game play and
    the interview, and their ratings of SimSE’s level of engagement. Many of them
    spent the majority of their time during game play sitting on the edge of their
    seats, leaning forward and fixing their eyes on the screen. There were head nods,
    chuckles in response to random events and character descriptions, shouts of “Woo
    hoo!” after achieving a high score in a game, shaking of the head when things
    were not going so well for a player, and requests of, “Can I try this one more
    time?” when the experiment’s allotted time for game play was coming to an end.
    Words some subjects used to describe SimSE in the interview were “challenging”,
    “fun”, “interesting”, “addictive”, and “amusing.” When explicitly asked how much
    SimSE engaged their attention, the students rated it quite high—4.1 on average
    out of five.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Second, relevance was rated moderately high, but not as high as level of engagement.
    Five of the subjects rated SimSE’s relevance to their future experiences as “pretty
    relevant” or “very relevant”, five described it as “somewhat” or “partially” relevant
    and one said it was not relevant at all. Although not explicitly asked about SimSE’s
    relevance to their past experiences, nearly all of the subjects mentioned that
    they used some of the knowledge they had learned in software engineering courses
    to come up with their strategies for playing the game, suggesting that there is
    also a relevance between their past experiences (learning the concepts in class)
    and their learning experience with SimSE.


    Third, most subjects felt their level of confidence in the learning material (the
    software process model simulated and software process in general) had increased
    at least somewhat since playing SimSE. Four subjects reported their level of confidence
    had changed “a lot” or “very much”, five said it had changed “somewhat”, and two
    said it had not changed at all.


    Fourth, satisfaction was rated quite high by the subjects. Nine out of the 11
    subjects reported that they were “quite satisfied”, “very satisfied”, “fully satisfied”,
    or “pretty satisfied”, and three subjects stated they were “somewhat satisfied.”
    Most of the reported factors that contributed to a feeling of satisfaction pertained
    to a subject’s increasing success from game to game, although some also mentioned
    that the sheer fun and challenge of SimSE contributed to their satisfaction as
    well.


    The explanatory tool did seem to promote Learning through Reflection, to some
    extent. Most of the subjects that had access to the explanatory tool did make
    use of it, the duration of its use after most games ranging from five to 25 minutes.
    It was obvious that the subjects who did not have the explanatory tool (to whom
    we will henceforth refer as “non-explanatory subjects”) were significantly more
    confused and less confident about the reasoning behind their scores and how to
    improve than those who did have the explanatory tool (to whom we will henceforth
    refer as “explanatory subjects”).


    we will henceforth refer as “explanatory subjects”). All of the non-explanatory
    subjects expressed this, while only one explanatory subject stated such an opinion.
    The following are some of the comments made by the non-explanatory subjects:


    +   - “I was trying to guess what I was doing wrong, so I probably chose the wrong
    areas that I was doing wrong, and then I tried to switch back to my original way
    and then I kind of forgot what that was and once I started trying to improve it,
    all of my little details started changing and I didn’t know what parts were causing
    my score to go lower.”

    +   - “I felt like I knew, oh, that’s where I went wrong sometimes, like I should
    spend a little less time there, but a lot of times I was wrong about where it
    was I went wrong.”


    On the other hand, most of the explanatory subjects’ comments expressed that the
    explanatory tool did, indeed facilitate their learning:


    +   - “[The explanatory tool] showed me why I was doing poorly—because of certain
    events that were happening.”

    +   - “The rules [described in the explanatory tool] are really helpful—even if
    someone doesn’t know anything about software engineering I think the rules can
    teach you how to play the game.”


    # Implications of Evaluation Results


    Evaluating SimSE in terms of learning theories provided us with several valuable
    insights into how SimSE helps students learn. In addition, it also helped us to
    discover ways to potentially make SimSE more effective. In this subsection, we
    describe how focusing on some of the theories in our evaluation provided us with
    knowledge that will help us maximize SimSE’s effectiveness.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '**Learning through failure:** Overall, the challenge of receiving a “failing”
    score and trying to improve it seemed to be a significant avenue of learning and
    a strong motivating factor of SimSE. This reinforced our notion that simulation
    models should be made challenging enough that students are set up to fail at times.
    It is these failures that provide some of the greatest opportunities for learning.
    By focusing on this aspect in our observations, we also discovered that one of
    our models (Rapid Prototyping) was not quite challenging enough, and students
    could sometimes get a good score without really learning the lessons. Thus, we
    have since added more challenges to this model, and will continue to build simulation
    models in the future that have an adequate level of challenge.


    **Learning by doing:** Several of the subjects’ comments mentioned the ability
    to put previously learned knowledge into practice as a learning-facilitating characteristic
    of SimSE. This validates our choice to use SimSE complementary to other teaching
    methods, so that it can fulfill this important role of being an avenue through
    which students can employ Learning by Doing as they do the things they only heard
    about in class.


    **Situated learning:** The realistic elements in SimSE seem to add significantly
    to its educational effectiveness. Thus, it is important that we continue to include
    elements of the real world in our models, in order to situate students’ knowledge
    in a realistic environment.


    **Elaboration:** It became clear from our observations that one of our models
    (waterfall) is much too large and complex for a “SimSE beginner.” (Although the
    waterfall process is a simple one, the corresponding SimSE model is quite complicated,
    incorporating several non-technical, managerial aspects.) By giving such a complex
    model to a student who has never played SimSE before, we were clearly violating
    the principles of the elaboration theory. Thus, viewing this result in light of
    that theory taught us that such a model should not be introduced until the student
    has played other, simpler models first.


    **Keller’s ARCS:** Through this study we were able to discover what elements of
    SimSE and its models best hold students’ attention by noting when students appeared
    to be most engaged, and what kinds of things they commented about favorably in
    the interviews. For example, several students mentioned that the random events
    in the models (e.g., the customer changing their mind and requiring the team to
    rework part of the code) added an element of surprise and realism that kept things
    entertaining. Thus, we will continue to build these elements into our future models,
    as well as try to maximize them in our current models. We also discovered which
    elements students found unengaging. For instance, several subjects thought the
    inspection model was boring and repetitive. Through the interviews, we were able
    to detect exactly what it was about the inspection model that made it this way,
    and have recently implemented changes that we anticipate will make it more interesting
    for future SimSE players.


    **Learning through reflection:** The explanatory tool partially fulfills its goal
    of facilitating reflection, but it is clear that it needs to be improved. In particular,
    more help needs to be given to the user in generating meaningful, useful graphs,
    and the rule descriptions need to be more easily accessible. We have recently
    addressed these issues in our development by adding attributes to each model that
    are meant specifically for explanatory graphing purposes and by making the rule
    descriptions more accessible through the user interface.


    Learning theories can help structure evaluations by providing ideas about what
    the researcher should be looking for in the learning processes of students. As
    we have seen with SimSE, this can be done even if the approach was not designed
    with learning theories in mind. A careful retro-analysis of the approach’s design
    in terms of learning theories can reveal the aspects that a learning theory-centric
    evaluation should focus on. Conducting such an evaluation has the potential to
    both reveal the effectiveness of an approach, as well as guide future work in
    the area.'
