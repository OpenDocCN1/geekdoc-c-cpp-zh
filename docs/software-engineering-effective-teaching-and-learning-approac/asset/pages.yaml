- pgno: 228
  md: 'sessment committee compiled a matrix showing every possible program outcome
    that every course in the program could possibly measure. At a series of assessment-focused
    department meetings, the faculty members reviewed the matrix to ensure that each
    course in the program was indeed contributing to one or more outcomes, and modified
    the matrix to remove excessive redundancy (such as the same outcome being measured
    in too large a number of courses) as well as to evenly distribute the assessment
    workload across the curriculum. We sought to ensure that each program outcome
    was measured at least twice, and no more than four times throughout the program.
    This issue is definitely in the Works category as the process of analyzing our
    assessment matrix resulted in significant faculty buy-in to our approach to program
    assessment, and also served to streamline which of the possible program outcomes
    were measured in the various courses.


    # University-Wide Curriculum Goals


    In Fall 2005, CSE293 was required to additionally count as a writing-course (W-course)
    so that it could be used to fulfill a university-wide writing continuum. A W-course
    requires that each student write a paper of at least 15 single spaced pages, and
    that these pages include both original pages and edited (revisions suggested by
    the instructor on English grammar, formatting, content, etc.). Students at UConn
    must take two W-courses to meet their general education requirements. For CS&E
    and computer engineering programs, the students meet this requirement without
    CSE293. For the CS program, CSE293 is vital. This has been a nightmare for CSE293,
    and has required the instructor to carefully partition every project so that each
    student’s writing on each team can be tracked, even though only some of the students
    enrolled actually need CSE293 to count as a W-course. Further, there has been
    added documentation and revision cycles to attempt to get to the 15 pages early
    in the semester, since they must be


    “edited” pages. Every student easily meets this goal by the end of the semester
    with final reports, user manuals, individual/team assessments, and so on. However,
    this approach is burdensome on the instructor. While CSE293 serves an exemplary
    role in outcomes assessment for accreditation, its role as a W-course for general
    education requirements is misplaced since CSE293 is taken too late in the program
    to be beginning to teach students about technical writing. We are currently discussing
    moving the W-course requirement to an earlier location in our program so as to
    allow students to take advantage of what they learn about technical writing, program
    documentation, etc., in subsequent courses. CSE293 as a W-course, while on the
    fence between Works and Doesn’t, is clearly leaning towards Doesn’t.


    # Courseware sharing


    CSE293 materials, as they appear on the web page, have been used by a number of
    faculty members since the inception of this course in Spring 2001. In the most
    recent semester (Spring 2007), the identical core of materials (course projects)
    was used, with the various instructors of the course making some interesting additions
    to their sections. In one section we added a fourth prototype deliverable, and
    found that this approach was not very successful since there was a limited time
    after spring break (seven weeks) and adding a fourth deliverable meant that there
    was only a very small potential for incremental functionality advancements for
    that deliverable. In another section we asked for self and team assessments related
    to each team’s web site design for the course and the software development environment
    (SDE) used. For the SDE, we asked each student to detail the tools they used,
    how the tools were used, and if the student would use such tools again. Our analysis
    of the most recent offering of the course demonstrates that even though there
    are a core set of course assignments, there is enough versatility in the course
    to add to and otherwise customize'
