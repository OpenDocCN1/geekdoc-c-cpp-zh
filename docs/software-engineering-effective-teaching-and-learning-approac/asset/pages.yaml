  md: 'licensure examinations, it has proved easier to incorporate software engineering
    into this system. It’s important to note that since “engineer” and “engineering”
    are trademarks owned by Engineers Canada, accredited software engineering programs
    in Canada are offered in colleges of engineering. The provinces of Ontario, Alberta,
    and British Columbia are already licensing software engineers. This situation
    has led to a dispute between two professional societies: Engineers Canada (the
    business name of the Canadian Council of Professional Engineers) and the Canadian
    Information Processing Society (CIPS). The CIPS perspective on the Canadian situation
    is given in documents that can be found on the CIPS Website (Van Dalen, 2003;
    Canadian Information Processing Society, 2007). The Engineers Canada perspective
    can be found in a paper on its Website (Engineers Canada, 2001).


    In the UK, the British Computer Society (BCS) is a licensed member of Engineering
    Council UK, and its members are therefore eligible to apply for Chartered Engineer
    status. This means that graduates of BCS-accredited programs with appropriate
    experience can apply for chartered engineer status. In Australia, the Australian
    Computer Society and Engineers Australia have developed a joint approach to chartering
    software engineers. This success of this approach also depends on tight control
    of program accreditation.


    It is interesting to consider the emergence of software engineering in the context
    of the historical development of new professions. Adams (2004) discusses software
    engineering from this perspective, with particular reference to the US, UK, and
    Canada.


    # bROAD-bAsED PROFEssIONAL CERTIFICATIONs


    A broad-based professional certification scheme is intended to recognize an individual’s
    professional competence in a body of knowledge recognized


    by a community of professionals. Examples of such schemes include the Project
    Management Professional (www.pmi.org), board certifications for medical specialties
    (www.ambs.org), the Certified Financial Planner (www.cfp.net), and for software
    engineers, the IEEE Computer Society’s Certified Software Development Professional
    (CSDP; www.computer.org/certification).


    The IEEE Computer Society’s CSDP certification scheme is an example of a broad-based
    software engineering certification. The origin of this scheme can be traced back
    for almost a decade. In 1998, the IEEE Computer Society began to consider the
    feasibility of certifying software engineering professionals. The first step in
    a formal investigation of this possibility was to gather input from the professional
    community. In 1999, the Society conducted a study that included surveys and discussions
    with potential certificate holders and with industry representatives. The results
    of this study indicated a strong interest in certification. In the following two
    years, the Computer Society worked with a major test development consultant to
    prepare a certification examination. The process included preparing a listing
    of task and knowledge statements. The statements were then distributed for validation
    to a group of software engineers, whose comments were used to produce a final
    version of the statements. It’s important to observe that the knowledge statements
    are regarded as primary, with task statements explicitly mapped to knowledge statements.


    Furthermore, an appropriate knowledge level is assigned to each knowledge statement,
    using a taxonomy first proposed by Bloom (1984). Test specifications were then
    developed from information derived from the job analysis. The specifications became
    the blueprint for defining the final content of the examination and determining
    the content weights Test questions (items) were then prepared and evaluated by
    an independent group of software engineers. The consultant ensured that the examination
    was psychometrically valid and culturally appropriate. The approved items were'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'then assembled into two examination forms, each containing 180 questions, in
    accordance with the test specifications. The assembled forms were given a final
    review by a test developer and by a group of software engineers, who reviewed
    potential problem items and made substitutions were necessary. In 2001, the approved
    test forms when pilot-tested by a group of software engineers selected to match
    the targets for education and experience. After further analysis, cut scores were
    determined and accepted by the IEEE Computer Society Professional Practices Committee
    (PPC), acting as the CSDP oversight committee. The second form of the exam was
    then statistically equated to the first, after which the examination was officially
    ready for release.


    The CSDP examination has been given since 2002. It consists of 180 questions,
    to be completed in 3.5 hours. The examination is offered at testing centers in
    many countries. There are currently more than 700 CSDP certificate holders. These
    individuals reside in many countries, in all parts of the world. The IEEE Computer
    Society’s PPC is currently revising the examination to bring its body of knowledge
    into conformance with the revision of the SWEBOK body of knowledge (see www.swebok.org).
    At the same time, the PPC is developing a new examination targeting recent university
    graduates. This certification will be called the Certified Software Development
    Associate (CSDA).


    Another example of a professional certification scheme addressed to software engineers
    is operated by the International Software Quality Institute (iSQI), an independent
    nonprofit organization in Germany (with support from German national and state
    governments) that provides comprehensive services in the field of software quality.
    iSQI’s primary mission is to coordinate industry and professional efforts to develop
    and implement software quality standards. Certification of software engineering
    professionals is an important part of iSQI’s activities. Certification is offered
    in three software engineering profes-


    sional specialties: software architecture, project management, and software testing.
    Each iSQI examination is administered by an examination board.


    All examinations are offered at foundation level. The testing examination is also
    offered at an advanced level, and an expert-level certification is under development.
    Advanced-level examinations are anticipated for the other specialties as well.
    The foundation-level examinations are 90-minute multiple-choice examinations.
    The advanced-level testing examination consists of three 90-minute multiple-choice
    parts (Test Manager, Functional Tester, Technical Tester). The examinations are
    offered frequently at two sites in Germany. Training courses for prospective examination
    takers are provided by a number of organizations. The appropriate examination
    boards accredit organizations that provide training courses. The underlying bodies
    of knowledge and examination specifications can be inferred from the training
    course outlines found on the iSQI Website (www.isqi.org).


    In general, any approach to professional certification can be described using
    three relatively independent dimensions: (D1) a characterization of the professional
    role that is to be certified, (D2) a list of the abilities and skills needed by
    a professional in that role, and (D3) a description of the certification process
    and its organization, including development, management, and maintenance. National
    and international standards for certification schemes require a given scheme to
    describe how it is organized along these dimensions. In the United States, such
    a standard has been developed by the National Commission for Certifying Agencies
    (NCCA) (National Commission for Certifying Agencies, 2003). A similar international
    standard, ISO/IEC Standard 17024 (International Organization for Standardization,
    2003), has recently been adopted as a standard by the European Community. This
    model makes it possible to compare and contrast different approaches to professional
    certification.'
