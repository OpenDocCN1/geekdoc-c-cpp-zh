  md: 'learning and ‘being taught’, and indicated that students conceptions of the
    characteristics of their learning environments were related to their study orientations
    and strategies.


    Other research within this School (Armarego, Fowler, & Roy, 2001) indicates that
    engineering students’ motivation and success can be adversely affected if their
    learning styles, and the learning styles of the staff teaching them, are not taken
    into account. There is considerable evidence that a mismatch, between lecturers’
    expectations of the way students learn and students’ own individual preferred
    learning styles, disadvantage students. Research suggests that these mismatches
    lead to lack of motivation and interest in students and affect their success (Felder,
    1996; UWA, 1996; Zywno & Waalen, 2001).


    These findings were supported by the project discussed in this chapter, strengthening
    indications of the importance of additional alignments – teacher and learning
    environment to student. Learning styles instruments, when applied to engineering
    academic staff, also indicated a strong Converger approach to teaching. The implication
    of this was that the dominant teaching style did not exhibit the adaptability
    and flexibility required by either the characteristics of the discipline or the
    learning environment being developed.


    The term constructive alignment, therefore, goes beyond the need to ensure that
    teaching, assessment and every aspect of the teaching-learning environment are
    aligned to the main aims or intended learning outcomes of a course. When the course
    is not aligned with learner interests or the situation constrains the student’s
    approach to learning, the dependent learner mode will tend to dominate – control
    of the learning process is relinquished to the teacher, while the student will
    demand carefully articulated structure, clear guidance and clearly-defined assessment
    (Armarego, 2007b). A dependent learner, therefore, does not align with the discipline
    characteristics described earlier in this chapter. Staff development, to introduce
    experiential learning models


    and ‘teaching around the learning cycle’ (Felder, 1996) are advocated (Armarego
    & Fowler (2005) also discusses the staff development implemented in this project).


    # CONCEPTUAL MODEL OF ALIGNMENT


    The result of the investigation described here, and the Action Research project
    that underpins it, is the development of a complex model that aligns discipline
    competencies with student characteristics with learning environment, as illustrated
    in Figure 6.


    This chapter argues that traditional formal education does not meet the competency
    expectations of industry. Practitioner dissatisfaction with formal education focuses
    on non-technical components of competency: they look for graduates who are flexible,
    adaptable in the organisational environment and can continue learning. These have
    been identified as cognitive skills related to higher order learning, strategies
    to enable opportunism and creativity and the development of emotional intelligence.


    The three cycles of this project explored alternate learning models to evaluate
    their appropriateness for addressing these issues. A shift in focus from technical
    competency to the soft and metacognitive skills that enable the competent practice
    of SE was achieved. Each intervention strategy addressed specific concerns and,
    through evaluation of and reflection on the intervention, strategies are refined
    for the next cycle to address additional issues identified:


    +   - Cycle 1 – Cognitive Apprenticeship: Focus on authenticity and transfer of
    skills acquired to other courses and, eventually, to the profession. This cycle
    highlighted student problems in generalising their learning, and in willingness
    to apply previous knowledge to the ‘new’ learning. In effect they were'
