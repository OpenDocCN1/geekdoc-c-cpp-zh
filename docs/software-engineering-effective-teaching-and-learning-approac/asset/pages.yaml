  md: '# APPENDIX – SIX STAGES OF CASE STUDY CONSTRUCTION


    (Source: Tomayko and Haz­zan, 2004, pp. 286-287)


    **Step 1. Select a topic:** Think about a topic that you find interesting and
    relevant for you to discuss.


    **Step 2. Analyze the nature of the topic:** In this stage, you are asked to check
    whether the topic you wish to focus on has enough heft to be at the center of
    a case study. Ask yourself questions such as:


    +   - What software development activities are connected to the selected topic?

    +   - Which players, that participate in software development environments, are
    connected to the topic?

    +   - What human aspects of software engineering does the topic address?

    +   - Is the topic connected to the individual in the team or to the team as an
    entity?


    If your answers to the above questions indicate that the topic is indeed “rich”
    enough and can be connected to different issues in software development environments,
    it might be suitable as a central topic for a case study.


    **Step 3. Imagine possible situations:** Envision at least two situations in software
    engineering in which the topic may be relevant. The idea is to see whether there
    are specific situations in software engineering in which the topic you wish to
    pursue has a significant expression.


    **Step 4. Write the case study:** Start writing the selected case study. Try to
    make it as vivid as possible without forgetting to include the main issues you
    wish to address.


    **Step 5. Check the scope of the case study:** After completing the first draft
    (and editing) of the case study, check whether other related topics can be added
    to the case. Make sure you do not change the focus of the case study. Then, check
    issues such as: Is the main message you wanted to convey in this case study reflected
    properly? Are the connections between the different topics addressed in the case
    study clear?


    **Step 6. Develop questions about the case study:** Develop stimulating questions
    that can be explored with respect to the case study you just developed.'
  merge: -1
