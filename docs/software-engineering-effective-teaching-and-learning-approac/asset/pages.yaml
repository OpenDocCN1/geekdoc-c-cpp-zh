  md: 'National Center for Women in Information Technology. In addition, she is a
    program evaluator for the Computing Accreditation Committee of ABET. She received
    her PhD in computer science from New Mexico State University.


    Ines Grützner received her diploma in computer science and economics from Dresden
    University of Technology. She works as a scientist and project manager in the
    field of Software Engineering Education and Training as well as eGovernment at
    the Fraunhofer Institute for Experimental Software Engineering (IESE) in Kaiserslautern.
    Her research in eLearning is focused on the systematic, engineering-style development
    of online courses. She has led several projects targeted at the development of
    online courses on software engineering topics.


    Orit Hazzan is an associate professor at the Department of Education in Technology
    and Science of the Technion – Israel Institute of Technology and she heads the
    computer science education track of the department. She is a co-author (with Jim
    Tomayko) of Human Aspects of Software Engineering (2004, Charles River Media).
    Currently, she writes (with Yael Dubinsky) her second book – Agile Software Engineering
    – to be published by Springer in 2008. Dr. Hazzan has 19 years of teaching experience
    in academia and industry (courses, workshops, lectures and conference presentations)
    and she is the author of about 100 journal and conference publications.


    Gregory W. Hislop is a faculty member and former associate dean in the College
    of Information Science and Technology at Drexel University. He has played a central
    role in development, implementation, and revision of degree programs in software
    engineering, information systems, and information technology. He was one of the
    four leaders of the NSF SWENET project, which created an online repository of
    software engineering curricular materials. Prior to coming to Drexel, Dr. Hislop
    spent 18 years working in government and industry. His efforts encompassed technology
    planning and evaluation, software development and support, and development and
    delivery of technical education. His research interests include technology for
    learning and teaching, education in the computing disciplines, and design, evolution,
    and evaluation of software. He has delivered over 60 papers and presentations
    related to these areas in recent years.


    Allen Johnson is interim chair of computer science at Huston-Tillotson University.
    Dr. Johnson has more than 35 years of experience developing computer systems and
    software in the industry. He is the chair of the Student and Academic Relations
    Committee of the Association of Software Testing and served on the advisory board
    for the UT Austin Software Engineering Institute’s Software Project Management
    certificate program. In workshops and presentations, Dr. Johnson has been an advocate
    for the scholarship of teaching and learning. He has over 25 years of experience
    teaching one-semester courses at the graduate/senior/junior level, teaching computer
    science college-level courses for IBM and other corporations, and 48-week industry
    courses that involved clients from not-for-profits and industry.


    David Klappholz is associate professor of computer science at Stevens Institute
    of Technology. He has 33 years of experience teaching computer science and has
    performed and supervised technology research on parallel computing and compiler
    technology (sponsored by organizations such as NSF, DOE, and IBM Research). Dr.
    Klappholz is an ABET program evaluator and has been involved in NSF-sponsored
    software process pedagogy research. He co-taught CS577, Barry Boehm’s SE RPRCC
    at'
