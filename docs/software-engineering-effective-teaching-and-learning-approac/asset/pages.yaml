    al (2002)’s suggestion of a (critically) widening gap between the degree of flexibility
    and creativity needed to adapt to a changing world and the capacity to do so.


    # ALIGNING EDUCATION TO PRACTICE


    Reigeluth (1997) argues that the current paradigm of education is based on standardisation,
    conformity and compliance, geared to the mass production of industrial age manufacture.
    This does not equate with the needs of the late 20th/early 21st century job market,
    which revolves around problem solving, teamwork, communications, initiative taking
    and diverse perspectives. What this implies is a lack of coincidence between the
    actuality of practice in the discipline and the instructional design supposed
    to model it – suggesting the need for a new paradigm, based on customisation,
    diversity and initiative, to suit the needs of the information age.


    Felder and Brent (2005) assert that traditional engineering education does little
    to provide students with the systemic perspective on individual subjects (a global
    perspective) they need to function effectively, and the ones who take too long
    to get it by themselves are at risk academically. They see most engineering instruction
    oriented toward students with specific traits – introverts (favouring lecturing
    and individual assignments rather than active class involvement and cooperative
    learning), intuitors (preferring emphasis on science and math fundamentals rather
    than engineering applications and operations), thinkers (favouring objective analysis
    rather than interpersonal considerations in decision-making), and judgers (preferring
    emphasis on following the syllabus and meeting assignment deadlines rather than
    on exploration of ideas and creative problem solving). Holt and Solomon (1996)
    point out that, while engineering education relies heavily on problem solving
    and engineering science, it limits the opportunities of all learners to develop
    the skills required for proficiency in two key areas: design and invention (requiring
    a divergent approach), and business management (requiring accommodative skills).
    The work of Lumsdaine and Lumsdaine (1995) suggests that between 20%'
