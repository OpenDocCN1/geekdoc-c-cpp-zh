- pgno: 226
  md: 'In addition to the assignments shown in Table 2, each team must develop and
    deploy a project web page with all of these materials in electronic form, with
    each team member maintaining a blog of their activities throughout the semester.
    Students are required to use a UML tool (such as Borland’s Together Architect
    or Eclipse plug in) for UML diagram development, and are encouraged to use an
    appropriate interactive development environment with source code control. Sample
    solutions for all course assignments and presentations are available on the course
    web page.


    # WHAT WORks , WHAT DOESn''T


    There are many efforts on project-based software engineering that relate lessons
    learned, including Flener (2006), who details his experiences in attempting to
    incorporate realism into the software engineering course with collected student
    comments on positive and negative experiences; Polack-Wahl (2006), who considers
    the impact of the type of project (instructor vs. industry vs. other) and student
    outcomes from the perspective of landing their first software engineering position;
    and, van der Duim, et al., (2007) which reports on experiences on multi-university
    team projects with conclusions that include real-life projects being too complex.


    In this section, we report on our successes and failures in CSE293 in a number
    of different categories, ranging from external issues such as curriculum, accreditation
    and outcomes assessment, to internal issues such as project choice, team member
    backgrounds, and team size. We have found that the internal issues often have
    a strong potential for negative impact on both the students and the instructor.
    The remainder of this section discusses each of these issues in turn, and includes
    a candid assessment of our efforts as organized into two categories (what Works
    and what Doesn’t work).


    # Accreditation and Outcomes Assessment


    In terms of accreditation, project-based software engineering capstone courses
    (semester or year long) such as CSE293 provide an ideal opportunity to assess
    the attainment of program outcomes that cross the entire curriculum at the latter
    stage of a student’s program (for both CS and CS&E programs). In accreditation,
    program outcomes assessment is intended to be a continuous improvement process
    that occurs each semester by identifying and assessing key courses against the
    program outcomes, CS-a to CS-k for CS programs and CSE-a to CSE-m for CS&E programs
    as discussed in the previous section. For example, at UConn, our CS program is
    assessed using five different categories of courses (software engineering, algorithms,
    ethics, programming languages and compilers, and capstone senior design in CSE293).
    CSE293 provides a means through which the students’ deliverable work can be used
    to demonstrate significant contribution to outcomes CS-b to CS-k for CS programs
    and CSE-c to CSE-l for CS&E programs as outlined in Table 3.


    As can be seen in Table 3, Course Assignments 2, 3, and 5 contribute quite heavily
    in the measuring attainment of both CS and CS&E program outcome assessments.


    In summary, for both our CS and CS&E accredited programs, the ability of a capstone
    project-based software engineering course such as CSE293 to be used as the major
    outcomes assessment course for accreditation greatly facilitates the continuous
    evaluation process. For example, in analyzing CSE293 assessment measurements gathered
