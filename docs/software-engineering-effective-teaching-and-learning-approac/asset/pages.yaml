- pgno: 284
  md: 'teract with students, support university service activities, continue their
    own professional development, and maintain links with practitioners and employers.


    Second, the program faculty must be invested with sufficient authority to provide
    effective guidance for the program and to define and execute processes for assessment,
    evaluation, and continuous improvement of the program’s objectives, outcomes,
    and curriculum.


    Third, the criterion provides guidance for evaluating the competence of the faculty,
    citing factors such as education, diversity, engineering experience, teaching
    effectiveness, communication ability, scholarship, participation in professional
    societies, and professional engineering licensure. In addition to these traditional
    measures, the criterion also makes explicit the need for “enthusiasm for developing
    more effective programs” (Engineering Accreditation Commission, 2007, p. 3), perhaps
    recognizing the personal and communal investment that is required to institute
    and maintain effective assessment and improvement processes.


    Facilities. Programs are required to ensure that classrooms, laboratories, and
    equipment are adequate and that they provide an atmosphere conducive to learning,
    foster student-faculty interaction, and support professional development and activities.
    Students must have opportunities to learn the use of modern engineering tools
    and adequate computing facilities must be available to support both students and
    faculty.


    Support. Programs must have, and demonstrate that they have, the institutional
    support and financial resources needed to maintain the faculty and facilities.
    This criterion also explicitly requires adequate support personnel and institutional
    services. Specific mention is also made of the need for “constructive leadership”
    to assure the quality and continuity of the program.


    Program Criteria. The general engineering accreditation criteria are intended
    to apply across widely disparate engineering disciplines. While


    this commonality and consistency is valuable, it is also understood that each
    discipline may have its own specific requirements. To address these issues, the
    engineering criteria incorporate sets of program-specific criteria, which are
    (at least nominally) limited to curricular topics and faculty qualifications.
    The applicability of a given set of program criteria is determined by the name
    of the program; for example, a program in “computer and software engineering”
    would be expected to meet the program criteria for both computer engineering and
    software engineering. When multiple sets of program criteria are applicable, overlapping
    requirements need only to be satisfied once. The program criteria for software
    engineering are discussed in the following section.


    # PROGRAM CRITERIA FOR SOFTWARE ENGINEERING


    As noted above, program criteria are limited to curricular topics and faculty
    qualifications. The curriculum-related portion of the current software engineering
    program criteria (Engineering Accreditation Commission, 2007, p. 18) states two
    primary requirements.


    First, the curriculum is required to provide breadth and depth across the range
    of engineering and computer science topics implied by the title and objectives
    of the program. Except in unusual cases (e.g., a program that focuses on applying
    software engineering to aeronautics or to financial modeling), this will normally
    imply compliance with an accepted “community” definition of the software engineering
    discipline. Two such definitions are given in the Guide to the Software Engineering
    Body of Knowledge (2004) and in the undergraduate software engineering curriculum
    guidelines prepared by the Joint Task Force on Computing Curricula (2004).


    Second, the curriculum section of the program criteria for software engineering
    requires that the'
