- pgno: 53
  md: 'educational expectation (learning objective) is mapped to learning activities
    likely to achieve these (teaching context) while assessment tasks focus on the
    quality of the learning process. A model of alignment, based on the work of the
    engineering subject centre of the learning and teaching support network (LTSN,
    2002), was applied within the research project (see Figure 3).


    In order to facilitate all the alignments required, a map of the curriculum for
    SE at Murdoch University was constructed. Curriculum mapping, as an evaluative
    tool attributed to English (1978), has been used primarily in schools, with limited
    use in higher education. English advocated the use of mapping to ensure that the
    constructive alignment described above - alignment of declaration, delivery, learning
    and assessment of individual skills - is achieved.


    The outcome of these initial phases, examining curricula and learning models,
    and decoding the discipline through a meta-analysis of practitioner perspectives,
    was to confirm the need to build into the curriculum a focus on generic and soft
    skills as part of the outcomes of each course within the programme, to address
    both practitioner and discipline needs. To maximise effectiveness, these had to
    be embedded into


    the knowledge base constructed by the students during their learning. This has
    the advantage of enabling students to develop the requisite skills situated within
    the learning context but, of course, required extensive adaptation of the existing
    learning environment.


    Within the project undertaken, curriculum mapping was tackled course by course,
    commencing with the initial SE course offered (identified as ENG260), which addresses
    Requirements Engineering. This was categorised firstly by the broad area of curriculum
    and then by the learning outcomes to be addressed. The map was based on scrutiny
    of documentation related to the course; in particular syllabus and course outline
    information provided to students at the commencement of the semester. These detail
    topics to be covered, assessment elements and criteria and expected demonstrable
    outcomes. The data gleaned from all of these were initially mapped to Murdoch’s
    generic graduate outcomes, and then, as progress was made in developing the activities
    to address the learning outcomes identified, to these as well. Figure 4 shows
    the mapping necessary for alignment. The Learning Objectives are determined from
    the appropriate BoKs and model curricula, tempered by our understanding of the
