- pgno: 247
  md: '# Obs ERVATIONs AND EXPERIENCEs IN AN INDUs TRIAL sETTING


    The blended learning approach presented here has been successfully tested both
    in academia and in industry and several experience reports have been published
    (Grützner & Bunse, 2002; Grützner, Steinbach-Nordmann, Ochs, & Bunse 2003; Bunse,
    Grützner, Peper, & Steinbach-Nordmann, 2005). With the intention of improving
    the blended learning arrangements and matching the industrial training programs
    with the needs of the participants, continuous evaluation was established. Concurrent
    to these evaluation activities, participants were questioned about their individual
    learning needs, their learning behavior, and their learning preferences. The questioning
    was divided into a pre-questionnaire (before the online learning in Phase I started)
    and a post-questionnaire at the end of Phase II.


    # s chedule of the Training Program


    The blended learning approach had to be adapted to match the organizational needs
    of the enterprises. The education material for the workshops was adapted to match
    the specific needs of the domains and (as far as possible) the experience of the
    participants. For this purpose, the enterprises


    made some real-world material (documentations, source code, etc.) available that
    represented the specific application domain of the enterprise’s business area.
    The course was concluded by a certification day where a complex and domain-specific
    exercise had to be autonomously solved by the participants in two- or three-person
    teams. All participants were still granted access to the online course after having
    finished the training part.


    # The set-Up of the Case study


    To evaluate the impact and acceptance of the applied blended learning approach,
    we started some data collecting. We did not intend to test specified research
    hypotheses, but wanted to know more about the learning needs and preferences of
    the participants and how the training program could be improved.


    In particular, we were looking for answers to the following questions:


    Pre-Questionnaire:


    (Q1) What are the individual starting points of participants regarding the training
    (e.g. experiences with UML, motivation, expectations, and individual time schedules)?


    Figure 2. Product levels and phases


    ![](img/870ca27e7c1e774d15231ca545126a78_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '(Q2) How do participants prefer to learn?


    Post-Questionnaire:


    (Q3) How do participants evaluate the training measure and its elements (e.g.,
    WBT, classroom training, training materials, and exercises)?


    (Q4) How did participants use the Web-based training? Was it possible to integrate
    learning and working?


    The pre-questionnaire preceded the training program and aimed at the collection
    of learning needs, preferences, and expectations regarding the upcoming training
    phase (cf. Table 2). The post-questionnaire was provided to the learners at the
    end of the certification day (cf. Table 3).


    All participants were invited to fill out an online-questionnaire (see Table 2)
    at the beginning of Phase I (pre) and another printout questionnaire (see Table
    3) at the end of Phase II (post).


    # Results of the Case studies


    A total of 42 employees (software developers, managers, persons in charge) at
    the age of 20-49 years attended the training program.


    Group line-up of participants in the blended learning training in the industrial
    case study:


    +   - 43% Software Developers (others e.g., mechanical engineers)

    +   - 85.71% male

    +   - range of age:

    +     - 20 - 29 years (28.6%)

    +     - 30 - 39 years (35.71%)

    +     - 40 - 49 years (28.6%)

    +   (missing to 100: no entry)


    The return rate of questionnaires (28 pre/38 post) was quite satisfying, although
    the quantity of data and the group line-up do not allow any


    empirical generalization. Nevertheless, the results of the evaluation might give
    some interesting insights into the needs and expectations of learners and the
    usage of different elements of blended learning in an industrial context.


    Pre-Questionnaire (N=28)


    (Q1) What are the individual starting points of participants regarding the training?


    Asked about the importance of a training program on object-oriented software development
    with UML for their future project work, almost half of the participants (48 %)
    replied that it is urgent to learn more about UML. Furthermore, asked about their
    individual goals and expectations concerning the training program (open question),
    the vast majority of answers provided (80%) could be summarized as ‘be able to
    apply UML in future projects actively’.


    When the participants were asked which element of the blended learning approach
    they would expect most of, they referred to classroom training, coaching, and
    the WBT in descending order.


    When asked about which learning mode is most effective in their point of view,
    the participants decided in favor of more or less informal communication with
    their peers. Nearly at the same high level was classroom training involving a
    tutor who is also available after the training as a project coach (see Figure
    5).


    (Q2) How do participants prefer to learn? How do they integrate working and learning?


    Except for one person, none of the participants (97.3%) had any experiences with
    any kind of e-learning resp. online training.


    Post-Questionnaire (N=38)'
