  md: '# FUTURE OF sOFTWARE ENGINEERING EDUCATION


    the absence of BSSE programs probably results from a choice rather than constraints
    that prevent pursuing the BSSE.


    In thinking about what lies ahead for software engineering education, there are
    several perspectives that might be taken. For example, one set of challenges has
    been outlined by Lethbridge, et al (2007) as follows:


    +   1. Making programs attractive to students,

    +   2. Focusing education appropriately,

    +   3. Communicating industrial reality more effectively,

    +   4. Defining curricula that are forward-looking,

    +   5. Providing education for existing practitioners,

    +   6. Making software engineering education more evidence-based,

    +   7. Ensuring that software engineering educators have the necessary background,
    and

    +   8. Raising the prestige and quality of software engineering educational research.


    This is an excellent list, and clearly contains a variety of important challenges
    for software engineering education. It is interesting to note though, that most
    of the items in this list apply fairly well to all, or at least several, of the
    computing disciplines. This is particularly true if viewed in terms of not just
    computer science but also the newer disciplines like information technology. Even
    items 6, 7, and 8 apply more broadly if the words “software engineering” are removed.
    (For example, in IS for item 6 and IT for item 7.)


    One possible conclusion from this set of challenges is that the future of software
    engineering education is unavoidably linked to the other


    computing disciplines. To a large extent the group shares common challenges, and
    all will rise or fall depending on how well those challenges are addressed. In
    spite of a history of tensions among the computing disciplines, cooperation, where
    possible, is much more likely to result in advances for all.


    Another perspective on the future would be to look at the model proposed by Ford
    shown in Table 1. While there is substantial reason to look favorably on the progress
    made against this framework, there is still much to be done in most of these categories.
    Software engineering clearly has not reached the level of a “mature” profession
    as defined by the Ford model. It seems that this should be viewed as a comment
    on the relative newness of the discipline, and certainly not as a sign of failure.
    At the same time, it implies that the SE education community needs to keep advancing
    the discipline and not be content with the accomplishments thus far achieved.


    A more difficult perspective to assess is the ongoing evolution and tension among
    disciplines, particularly between computer science and software engineering. The
    continuing skirmishes that seem typical as new software engineering programs begin,
    and the absence of BSSE programs in institutions with highly ranked computer science
    programs, are two good indicators that this evolution is not complete. One root
    issue is the fact that a large percentage of CS graduates go on to careers as
    practitioners rather than scientists. This raises the question of whether growth
    in SE programs will come largely at the expense of CS programs. That possibility
    would present difficulties for both disciplines.


    Within the community of software engineering educators, the sense of cohesion
    maintained during the 1990’s seems to be substantially diminished. In part that
    reflects success in achieving initial goals such as accreditation. However, for
    a community that is still quite small this is cause for concern. As additional
    institutions offer software engineering degree programs, it is important that
    they have'
