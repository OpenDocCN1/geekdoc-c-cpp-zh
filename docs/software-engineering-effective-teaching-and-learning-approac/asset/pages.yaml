  md: '# Table 1. Areas of concern covered in each ABET criterion


    | Area of Concern | Criterion (2007-2008) | Criterion (2008-2009) |

    |---|---|---|

    | Students | Criterion 1 | Criterion 1 |

    | Program Educational Objectives | Criterion 2 | Criterion 2 |

    | Program Outcomes | Criterion 3 | Criterion 3 |

    | Continuous Improvement | Criterion 2-3 | Criterion 4 |

    | Curriculum | Criterion 4 | Criterion 5 |

    | Faculty | Criterion 5 | Criterion 6 |

    | Facilities | Criterion 6 | Criterion 7 |

    | Support | Criterion 7 | Criterion 8 |

    | Program Criteria | Criterion 8 | Criterion 9 |


    stable from the introduction of the EC2000 criteria until the present time. The
    criteria are:


    **Students.** For historical reasons, the criteria first address the relationship
    between an engineering program and its students, even though logically it would
    make more sense to begin with the program educational objectives and outcomes.
    Programs are required to evaluate students and monitor their progress, while providing
    both curricular and career advising. Specific note is made of the need for effective
    policies and procedures for the admission of transfer students, granting of transfer
    credit, and verification that all students meet all program requirements.


    **Program educational objectives.** Since the initial introduction of the EC2000
    criteria, there has been a continuing evolution and clarification of the terminology
    used to specify the results that an engineering program strives to achieve. By
    the current definition, the program educational objectives deal with the broad
    career and professional accomplishments for which graduates are being prepared.
    It is common for the program leadership and faculty to consult with employers
    and other stakeholders to ensure that the program objectives accurately reflect
    the environment in which the program’s graduates will work. Since


    these achievements relate to performance after graduation, the program’s success
    in this regard cannot, in general, be determined until some time has passed. Even
    then, it may be difficult to assess the program’s contribution to the individual
    graduate’s success in meeting these longer-term objectives.


    A program’s educational objectives are expected to be consistent with its institutional
    mission and to communicate its specific goals to potential students and to the
    public at large. A typical program objective might be, “Graduates of the program
    are expected to obtain employment in the software development industry and/or
    to enter graduate school within six months after graduation.”


    **Program outcomes.** To complement the program educational objectives, programs
    are also required to define and assess program outcomes, which are narrower statements
    that describe the knowledge and skills expected of students at the time of graduation.
    The underlying assumption is that this knowledge and skill will provide the basis
    for achievement of the longer-term career and professional achievements. This
    criterion requires that a set of eleven specific outcomes be incorporated (often
    referred to as “a-k” because of'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'the way they are enumerated), but programs are free to articulate additional
    outcomes. A typical outcome is: “By the time students have graduated from the
    program they must demonstrate the ability to apply knowledge of mathematics, engineering
    and science,” which is outcome a) in the specific list of outcomes.


    Historically, programs have been encouraged to formulate their own outcomes based
    on their specific program objectives. These program-specific outcomes are often
    designed to incorporate the “a-k” outcomes. For example, a software engineering
    program might adopt a program outcome related to designing software components
    and systems, implicitly referencing the “3(c)” outcome that deals with designing
    a system, component, or process within realistic constraints.


    However, defining a complete set of program-specific outcomes can also mean extra
    work for the program in preparing for an accreditation visit, since it is then
    necessary to demonstrate student achievement of both the “a-k” and the additional
    “program-defined” outcomes. One alternative is to augment the standard “a-k” outcomes
    by articulating a small number of additional outcomes, if the program judges that
    the generic outcomes are not sufficient. The proposed 2008-2009 engineering criteria
    omit a previous requirement that the program must “formulate program outcomes”
    related to the program objectives, perhaps suggesting a shift away from program-specific
    outcomes.


    **Continuous improvement.** The requirement for ongoing actions to improve the
    program, previously called out in the context of program objectives and outcomes,
    has become a separate criterion in the proposed 2008-2009 draft. Programs are
    required to show evidence for these actions, which are expected to be based on
    the results of assessment and evaluation processes called for in the criteria
    related to program objectives and program outcomes.


    **Curriculum.** This section of the engineering criteria has two major parts.
    The first deals with


    minimum standards for curriculum content. The curriculum must include at least
    one year (typically 32 semester credits or 48 quarter credits) of college-level
    mathematics and basic sciences. At least some of the basic sciences course work
    must include experimental experience. A minimum of one and one-half years (48
    semester credits or 72 quarter credits) of engineering topics is also required.
    The engineering topics consist of engineering sciences and engineering design.
    The curriculum is also required to incorporate a general education component that
    complements the technical content, but no quantitative specifications are mandated
    for this component.


    One question for software engineering programs is whether some computer science
    content can be used to meet the “mathematics and basic science” requirement. This
    type of accounting seems quite reasonable, since the relationship between computer
    science and software engineering resembles that between, for example, physics
    of mechanics and mechanical engineering. In addition, many computer science topics
    are mathematical in nature. However, there is at present no explicit policy on
    this matter, so many programs have taken a defensive position that ensures the
    credit requirement is met using course content consistent with a more traditional
    definition of mathematics and basic science.


    The second part of the curriculum criterion imposes a requirement that students
    be prepared for engineering practice through the curriculum and that this course
    work culminate in a major design experience that incorporates engineering standards
    and multiple realistic constraints. The requirement for a major design experience
    is often addressed by a “senior design project” course or course sequence.


    **Faculty.** The criterion related to the program faculty addresses three primary
    concerns. First, the number of faculty members and their competencies must be
    sufficient to cover all curricular areas of the program, while also assuring that
    faculty members have time to advise and in-'
