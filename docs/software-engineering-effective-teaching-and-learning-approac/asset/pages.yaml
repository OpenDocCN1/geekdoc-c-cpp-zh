  img_proc: true
- pgno: 299
  md: 'with the students. Projects differ widely; in the Software Engineering group,
    all projects start with a bidding phase. If there are nine participants (the ideal
    size!), they form three competing companies. After talking to the customer, they
    will prepare a presentation, trying to win the project. Then the groups are merged
    and they all work together. (The research group is not involved except for the
    roles mentioned above.) They will elect a project manager and organize their work
    following the principles they have learned in their lectures and in the small
    project they have done before. While the project manager usually keeps his or
    her role, all other students take several positions; somebody may e.g. co-author
    the specification, implement parts of the system, and organize the reviews. This
    is left to the team. They have to document their effort, so they notice if somebody
    spends significantly less or more time on the project than others.


    For ten to twelve months, the students spend much time together, and they experience
    all the problems and frustrations of real projects. This includes the effects
    of working in a fairly large group; while three people can cooperate without much
    organization, eight or ten can not. So they learn to appreciate good processes
    and sound project management. We try to make sure that they are eventually successful
    because we strongly believe that positive experience is much more effective than
    negative experience.


    There is not just one “right solution”. If it works and the documents are fairly
    complete and useful, it is fine. We found that a process with two passes is promising:
    They design and implement the core parts in about half of the time and then ask
    for feedback. Depending on the corrections and improvements that turn out to be
    necessary, they add some of the parts that are merely nice to have in the second
    pass.


    Finally, the students will deliver a product to the customer. This final presentation
    tends to be quite an event. And most of the projects deliver software that is
    as good as, or even better than,


    software that is commercially available. Many of the systems are actually used
    and maintained afterwards.


    The large projects include lectures and a seminar which addresses some more ambitious
    topics related to or beyond the project. We give marks on the project work (weight
    0.5), the seminary (0.2), and the examination (0.3), resulting in one final mark.
    Nobody can pass who fails in the project work. We usually grade the project as
    a whole and apply corrections for those whose contributions were clearly above
    or below average.


    In our (i.e. in the Software Engineering group’s) projects, we tried various settings,
    depending on the task. Sometimes, we had customers from industry; sometimes we
    were the customers (asking for a new component for our SESAM system, see above).
    Our latest project (finished in November 2007) produced a new tool for glass box
    testing. This tool can collect, and visualize, several coverage metrics. The developers
    were required to develop software for the public domain; in the seminary, we discussed
    not only technical aspects of testing, but also questions concerning the licenses
    used in the public domain.


    # Large software Project in an Application Area (6th and 7th semesters)


    Every student chooses an application area where he or she has to collect 18 credit
    points from written or oral examinations. We currently offer three such areas:


    +   - Traffic systems (railway, air traffic, etc.)

    +   - Industrial automation (including robotics and all the machines used in modern
    factories)

    +   - Technology management (e.g. product engineering)


    In this application area (i.e. in the department that sponsors the application
