  md: '# APPENDIX A


    # EXTRACTs FROM IFIP DOCUMENT: HARMONIzATION OF PROFEss IONAL sTANDARDs


    Drafted by Ian Mitchell, FNZCS, Peter Juliff, FACS and Joe Turner, FACM.


    # The standard for Professional Practice in Information Technology


    # Ethics of Professional Practice


    A code of ethics acknowledges the professional responsibilities of practitioners
    to society at large, members of the public, employers, contracting parties and
    fellow practitioners.

    Codes of ethics have been published by many member societies and IFIP itself.

    Every implementation of the standard must include a code of ethics.

    Such a Code of Ethics must be compatible with the culture of the society in which
    the practitioner normally works.

    Practitioners must operate in a manner compatible with the culture of the locale
    in which they are currently working and in which the product may be used.

    *Practitioners must publicly ascribe to the code of ethics published within the
    standard.*


    # Established Body of Knowledge


    Several IFIP member societies have published bodies of knowledge, some of which
    have gained wide acceptance. Such recognised bodies of knowledge are divided into
    many domains determined by the various services carried out by practitioners.
    The body of knowledge on which any implementation is based should include at least
    the common components of these but also ensure that each domain is complete in
    itself for the domains adopted locally.

    Mastery of such a body of knowledge forms the basis of preparation for practice.
    A practitioner must demonstrate mastery of at least one such domain as well as
    all core components identified in the body of knowledge.

    *Practitioners must be aware of and have access to a well-documented current body
    of knowledge relevant to the domain of practice.*


    # Education and Training


    Most practitioners will enter the workforce with prior education and training
    which will commonly be a baccalaureate degree assessing the mastery of the body
    of knowledge.

    Institutions offering such education and training should be prepared to openly
    compare themselves to internationally well-known and recognised peer institutions
    offering similar programmes.

    It is recognised that this level of mastery may be achieved by various combinations
    of education and experience. Nevertheless a practitioner must be able to provide
    evidence of such mastery to practitioners who have met this standard.

    *The minimum level of mastery of the body of knowledge must be at the baccalaureate
    level.*'
