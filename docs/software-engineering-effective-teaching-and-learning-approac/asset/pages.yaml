  md: 'members. This process assists team members and the Guidance Team in identifying
    problems and reviewing with teams the skills that resolve them. The recurring
    themes, especially in the first semester, are centered on meetings and lack of
    commitment from all members.


    Regarding meetings, the problems typically center on unproductive meetings, and
    length of meetings. The feedback in this area includes review of how to conduct
    effective meetings, e.g., setting an agenda, assigning roles such as time keeper
    and participation checker, creating action items, and checking status of previous
    action items. Students are also encouraged to consider the “100-mile rule,” i.e.,
    treat each meeting as though each member has travelled 100 miles to attend and,
    as a result, it’s imperative to arrive on time and have a productive meeting (Scholtes,
    1996).


    The advice given to teams regarding lack of commitment centers on building positive
    interdependence and the importance of recognizing members’ contributions to the
    project and valuing the opinions of others. Additional advice includes structuring
    individual accountability through task assignments and deadlines. The lead is
    encouraged to keep records of individual contributions and status through meeting
    minutes or e-mail exchanges. The following response to the question of “what worked
    well” reflects how one team improved from one semester to the next:


    We worked horribly as a team last semester. This semester, however, we’ve come
    to terms with each member’s benefits and weaknesses. Because we’ve learned to
    think as a team, we now act as one. It is much more evident that trusting of team
    members produces the desired results. Everyone is willing to spend as much time
    as necessary to produce what he/she needs to. By not wanting to let down the group,
    every member (including myself) works very hard to produce a team deliverable.


    Another example of reflection from a team member is the following:


    At the beginning of last semester when I looked at the names of my prospective
    team, I didn’t know what to think, only one familiar name. Looking at this team
    now, we are really a “melting pot”: one Taiwanese, one Hispanic/American, one
    Indian, one Mexican and one [anglo]. Who says that we can’t all get along together?
    Each one of us had our own strengths and weaknesses in our abilities and our personalities.
    Miraculously, what I lacked, someone else had to offer. What someone else needed,
    I could help. This is the true definition of teamwork. And we made it work. I
    am truly enriched for this experience and I thank each one of you for that.


    Product: Our assessment of the quality of the products produced by the students
