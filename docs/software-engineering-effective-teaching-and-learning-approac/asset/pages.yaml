  md: 'team members were responsible for which tasks. In a related example, students
    observed in class discussions how the risk document helped the senior design group
    to catalogue risks to the project as they occurred, but not to prevent or manage
    them.


    The case also provides an excellent opportunity to encourage students to both
    discuss and experience communicating with stakeholders outside of one’s discipline.
    For example, professors from the Mechanical Engineering department seemed to consistently
    underestimate the amount of work that the Computer Science students will need
    to put into the project. In the Module B, a mechanical engineering professor is
    quoted as saying that “working only on the crane controller would be ‘too simple.’”
    In the next module, which is excerpted above in Figure 1, a different Mechanical
    Engineering professor gives an entirely opposite opinion (that the controller
    will be the hardest part). These two modules provide an excellent opportunity
    to discuss not only the importance of clarifying stakeholder roles and adequate
    documentation in reconciling conflicting claims such as these but also to discuss
    strategies for communicating across disciplines.


    Although student response to the case in both the summer and fall sessions of
    this course was mostly positive, there were a couple of concerns that need to
    be addressed in future classes. First, students without experience in computer
    science were initially intimidated by the technical terminology that is employed
    throughout the case. Luckily, there were computer science and software engineering
    students in both sections of the course who helped to explain not only the terminology
    but also the level of knowledge about programs like Matlab that computer science
    students would likely have going into the project. As the case stands now, it
    would be difficult to teach without the help of students or an instructor with
    some expertise in the subject matter. As Schulery (1999) observes, “cases should
    [ideally] be applicable to all students in the class”. But this lack


    of technical information also had the unforeseen benefit of giving computer science
    and software engineering students a chance to explain technical information to
    people outside of their discipline, a skill that will certainly come in handy
    as they enter the workforce. These explanations could be formally built into the
    course. (For example, students could research an unfamiliar term and present a
    short “white paper” or similar document on the subject to the rest of the class.)


    Studying the CS team’s story was itself done in teams, which gave the case study
    readers a chance to apply immediately what they learned from analyzing the case.
    Some teams had to struggle with the very communication problems that the case
    highlighted — rote, formulaic approaches to document development, lack of respect
    for knowledge outside of one’s discipline were especially in evidence. In particular,
    students often faced the prospect of their own skills being undervalued, the kind
    of power-based intra-team conflict described by Meyers and Larson (2005). For
    instance, in her evaluation of the project, one technical communication student
    wrote, “I did not like how my team functioned. Skills possessed by some were overlooked
    or not valued. The function of my team was to ‘please the instructor’ and not
    do good job working on the assignment.” This is an issue that could be productively
    addressed in future courses: for example, students could discuss at the beginning
    of the project what skills they bring to the table and could clarify their own
    roles within the group.


    Because much of the content of the case was specific to computer science and software
    engineering, some students lost interest in the case, particularly in the fall
    semester when the case took up four weeks of a fourteen-week course. Most students,
    however, seemed to find the case interesting and relevant for what it taught about
    project management (and about the management of senior design projects in particular),
    collaborative work, and rhetorical approaches to problem solving and to communication
    cycles.'
