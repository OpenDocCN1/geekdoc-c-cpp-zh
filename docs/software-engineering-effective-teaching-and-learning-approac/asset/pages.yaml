- pgno: 334
  md: 'SEEK defines 10 education knowledge areas (KAs), each of which is recognized
    as a significant part of the body of knowledge that every bachelors-level software
    engineering graduate needs to know. A short description for each of the ten knowledge
    areas defined by SEEK (Diaz-Herrera, 2004) are listed below:


    +   1. **Software evolution.** “Software evolution is the result of the ongoing
    need to support the stakeholders’ mission in the face of changing assumptions,
    problems, requirements, architectures, and technologies.” (Diaz-Herrera, 2004)


    +   2. **Software process.** “Software process is concerned with knowledge about
    the description of commonly used software life-cycle process models and the contents
    of institutional process standards; definition, implementation, measurement, management,
    change and improvement of software processes; and use of a defined process to
    perform the technical and managerial activities needed for software development
    and maintenance.” (Diaz-Herrera, 2004)


    +   3. **Software verification and validation.** “Software verification and validation
    uses both static and dynamic techniques of system checking to ensure that the
    resulting program satisfies its specification and that the program as implemented
    meets the expectations of the stakeholders.” (Diaz-Herrera, 2004)


    +   4. **Software quality.** “Software quality is a pervasive concept that affects,
    and is affected by all aspects of software development, support, revision, and
    maintenance. It encompasses the quality of work products developed and/or modified
    … and the quality of the work processes used to develop and/or modify the work
    products.” (Diaz-Herrera, 2004)


    +   5. **Software design.** “Software design is concerned with issues, techniques,
    strategies, representations, and patterns used to determine how to implement a
    component or a system. The design will conform to functional requirements within
    the constraints imposed by other requirements such as resource, performance, reliability,
    and security.” (Diaz-Herrera, 2004)


    +   6. **Software management.** “Software management is concerned with knowledge
    about the planning, organization, and monitoring of all software life-cycle phases.”
    (Diaz-Herrera, 2004)


    +   7. **Computing essentials.** “Computing essentials includes the computer science
    foundations that support the design and construction of software products.” (Diaz-Herrera,
    2004)


    +   8. **Software modeling and analysis.** “Modeling and analysis can be considered
    core concepts in any engineering discipline, because they are essential to documenting
    and evaluating design decisions and alternatives. Modeling and analysis is first
    applied to the analysis, specification, and validation of requirements.” (Diaz-Herrera,
    2004)


    +   9. **Mathematical and engineering fundamentals.** “The mathematical and engineering
    fundamentals of software engineering provide theoretical and scientific underpinnings
    for the construction of software products with desired attributes.” (Diaz-Herrera,
    2004)


    +   10. **Professional practice.** “Professional Practice is concerned with the
    knowledge, skills, and attitudes that software engineers must possess to practice
    software engineering in a professional, responsible, and ethical manner.” (Diaz-Herrera,
    2004)


    Each knowledge area (KA) is further divided into smaller modules called units.
    The left column in Figure 2 lists the SEEK knowledge areas in light grey shades,
    and the knowledge units (KUs) defined for each KA in italics.'
