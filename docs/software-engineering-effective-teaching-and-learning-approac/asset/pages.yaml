    “The Art of Getting Students to Practice Team Skills,” at the 33rd ASEE/IEEE Frontiers
    in Education Conference (with E. Villa, J. Sullivan, R. Upchurch, and K. Smith).
    He is an IEEE-CS Certified Software Development Professional and a program evaluator
    for the Computing Accreditation Committee of ABET. He received a PhD in computer
    science from the University of Wyoming.


    **Daniela Rosca** is currently an associate professor in the Software Engineering
    Department at Monmouth University, NJ, USA. Her main research interests span the
    areas of requirements engineering, business rules, dynamic workflow systems, and
    process modeling. Recently, she has been applying her expertise to various systems
    for Emergency Management. Prior to joining Monmouth University, Dr. Rosca was
    a senior member of technical staff at the Romanian Institute for Computers Research.
    She is the author of numerous research papers published in journals, books, and
    conference proceedings. Dr. Rosca has served as program committee member, session
    chair or organizer for several international conferences and workshops. She is
    a member of ACM.


    **Mark J. Sebern** is a professor in the Electrical Engineering and Computer Science
    Department at the Milwaukee School of Engineering (MSOE). He was the founding
    program director of MSOE’s undergraduate software engineering program, one of
    the first four to be accredited in the United States. Prior to joining MSOE, Dr.
    Sebern worked in industry for twenty years as a practicing computer and software
    engineer. His interests include software engineering process, software design
    and architecture, databases, web application frameworks, and embedded computer
    systems. Dr. Sebern leads MSOE’s cooperative efforts with industry partners in
    the area of software process improvement, providing targeted training and coaching
    support to software development teams and managers. He has also served as an ABET
    program evaluator for computer engineering and software engineering programs.


    **Stephen B. Seidman** is dean of the College of Natural Sciences and Mathematics
    at the University of Central Arkansas. He has held administrative and academic
    posts at New Jersey Institute of Technology, Auburn University, Colorado State
    University, and George Mason University. He received a PhD in mathematics from
    the University of Michigan. Seidman’s research interests are in software architectures,
    formal methods, and computing education. He has been active in efforts to improve
    computing and software engineering education and professionalism, including service
    as the IEEE Computer Society’s Vice-President for Educational Activities, as a
    member of the CSAB board of directors, and as a member of an ISO/IEC working group.


    **Marika Seigel** is an assistant professor of rhetoric and technical communication
    at Michigan Technological University, where she teaches undergraduate and graduate
    courses in technical communication to students from a variety of disciplines.
    In addition to technical communication, her research interests include usability,
    gender studies, and rhetorics of science and technology. She received her bachelor’s
    degree in English from the University of Michigan and her master’s degree and
    PhD in English (with a focus in rhetoric and composition) from Penn State University.


    **Dan Shoemaker** is the director of the Centre for Assurance Studies, which is
    a National Security Agency (NSA) Center of Academic Excellence in IA Education.
