  md: 'how to deal with and appreciate diverse ideas. A number of recruiters have
    told us that they recruit from different colleges and universities simply so their
    workforce will be educationally, and culturally diverse. We model this approach
    in our teams.


    We assign students to five-member teams for an entire year, and it is rare that
    we remove a member from a team. Because of this, we are careful about the teams
    we create, and we expend substantial effort in selecting the members, considering
    four general areas: personality, position preference, experience, grade-point
    average, and project- and gender-specific issues. Students are given the position
    descriptions and the list of deliverables assigned for each position. They are
    asked to provide a résumé and write a letter of application in which they specify
    the three positions for which they feel most qualified or have the greatest interest.
    Our team assignment process includes steps such as evaluating students’ letters
    of application and résumés, assessing dominant personality characteristics, and
    balancing the diversity of the teams with respect to gender, ethnicity, grades,
    and educational experiences.


    We assess personality using the Shapes personality exercise (Bonura, 1998). This
    exercise is a modified form of the Myers Briggs personality type assessment. During
    the exercise, students select the personality “shape” with which they most identify.
    Students come to appreciate that not all of their fellow students identify with
    the same shape, and that there are strengths and needs associated with each of
    the shapes. On our teams, we strive to balance the four shapes on each team.


    We attempt to balance the teams with respect to the experiences and academic achievements
    of the students. We ask that students report their cumulative and major grade
    point averages on their résumés. We also do a preliminary assessment of their
    writing abilities based on the letter of application. Our goal is to balance teams
    in terms of their academic histories. We attempt to have


    several students with strong English skills or good academic records on each team.
    For particular projects, we also consider work experience and certain courses
    (such as database management) when assigning students to teams. We try to avoid
    assigning friends to the same team.


    The gender-specific issues include assigning female students, when possible, to
    teams with at least one other female. Although not always necessary, the practice
    of having more than one female student on a team helps in situations when the
    female’s opinions are ignored or not valued.


    # Development Professional Skills


    Rather than assume that students know how to work effectively in teams by the
    mere fact that they are on a team, we deliberately teach students how to work
    in teams by describing how to conduct effective meetings, giving each student
    the opportunity to learn how to take a lead role, requiring students to analyze
    their teams’ performance, and suggesting ways to improve individual participation
    and team effectiveness. Students are assigned specific positions on their team,
    and we use that position to assign the lead for different deliverables. The leader
    is responsible for ensuring the deliverable (refer to Table 1) is completed and
    that every team member contributes to each deliverable. This person is responsible
    for initiating the work (typically by calling a team meeting and setting the agenda
    for the meeting), monitoring task assignments, collecting finished products, and
    delivering the final version. Our goals in having rotating leads are to provide
    students with opportunities to practice task-planning strategies and to learn
    leadership skills. It has been our experience that some students who ordinarily
    would not choose to lead a team effort turn out to be good leaders and develop
    skills and exhibit talents that were previously unrecognized.


    Other approaches to developing professional skills include using cooperative learning
    in the'
