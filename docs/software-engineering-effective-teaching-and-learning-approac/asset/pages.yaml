  img_proc: true
- pgno: 187
  md: '# WHY RPRCCs?


    Other than using real projects and real clients, how different is it to teach
    an RPRCC version of a course compared to a more traditional version of the same
    course? Several of us have observed that teaching an RPRCC probably takes more
    time than teaching a traditional version of the same course, especially if the
    instructor has never worked in a disciplined development environment. Certain
    aspects of teaching an RPRCC can be difficult to predict and control. An RPRCC
    requires a different style of planning (e.g., to find clients, determine teams,
    coordinate schedules, and manage client expectations) and a different style of
    oversight (e.g., to ensure that teams are making progress toward their goals).
    When starting to teach such a course, there is a sharp learning curve, making
    the first semester or two especially demanding and risky.


    Why, then, should a computing instructor put in the added effort and a department
    expend the extra resources in order to offer RPRCCs? We argue that RPRCCs and
    RPRCC-centric curricula provide benefits to three constituencies: computing departments,
    computing students, and the IT/software development workforce. We discuss these
    issues below.


    # Benefits to the Department


    The most straightforward benefit to computing departments that offer RPRCCs has
    to do with accreditation. In addition to the traditional set of technical skills,
    the new criteria from ABET, Inc., the recognized accreditor for U.S. college and
    university programs in applied science, computing, engineering, and technology
    include a second set of equally important professional skills, which are also
    essential aspects of RPRCCs. Shuman, Besterfield-Sacre, and McGourty (2005) divide
    these latter skills into process skills, which include communication, teamwork,
    ethics, and professionalism, and awareness skills,


    which include lifelong learning, a knowledge of contemporary issues, and engineering
    within a societal and global context.


    A second potential benefit of RPRCCs is that using industrial clients can strengthen
    cooperation between educational institutions and industry. The close interaction
    can help students find placement in internships and post-graduation employment.
    The relationship can also support technology transfer and sharing of research
    results (Grisham, Krasner, & Perry, 2006).


    Recruiting and retention are major concerns to most computing departments. Because
    students enrolled in RPRCCs tend to be strongly motivated by the mixture of real
    and theoretical skills inherent in these courses (Hogan, Smith, & Thomas, 2005),
    computing curricula that include RPRCCs may increase retention. RPRCCs early in
    the curriculum, for example at the pre-CS1 and secondary levels, may convince
    students with little or no programming background or who would otherwise never
    select a career in software development to consider a computing major.


    The declining number of women in computing is disheartening when compared to increasing
    numbers of women in other areas of science and engineering. In 1985, 38% of B.S.
    degrees in CS were awarded to women. By 2003, their representation had shrunk
    to 28%. Because RPRCCs concentrate on interpersonal skills and because every community
    has potential RPRCC clients whose projects have social significance, the availability
    of RPRCCs can have a strong positive effect on efforts to recruit and retain women
    and members of under-represented minorities (Eisenman, 2001; Jessup, Sumner, &
    Barker, 2006; Margolis & Fisher, 2001; Norman & Keating, 1997; Schuhmann, 1992).


    # Benefits to students


    Individual students enrolled in RPRCCs and RPRCC-centric curricula can experience
    early opportunities for community service, added'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Benefits to the IT/Software Development Workforce


    confidence in their own abilities, and a strong foundation for life-long employment.
    If an RPRCC uses not-for-profit or educational clients, this enables students
    to perform service to the community at the same time they are earning academic
    credit.


    Many computing graduates report that what they learned as undergraduates did not
    prepare them sufficiently for the work they encountered after they entered the
    workforce (Fernandez & Tedford, 2006; Fernandez, Garcia, Camacho, & Evans, 2006).
    RPRCCs can help students gain confidence in their own skills as well as experience
    that will help them become productive more quickly once they enter the workforce.


    RPRCCs instill a number of skills, especially business-related and inter-personal
    skills, which are among the most difficult to offshore (Aspray, Mayadas, & Vardi,
    2006; Boehm, Abi-Antoun, Port, Kwan, & Lynch, 1999; Mitchell, 2006). While such
    skills can be taught as theoretical principles, most students will learn them
    in depth only by doing, that is, through active learning. Thus, the skills students
    practice while enrolled in RPRCCs form the basis for life-long careers for computing
    graduates wanting to work in countries that send work offshore.


    RPRCCs fit snugly within the active learning genre, a type of learning that emphasizes
    student engagement in realistic problem solving, teamwork, and application of
    theory and principle (McKeachie, 1961). Courses that incorporate active learning
    into the curriculum have been shown to realize demonstrable improvements in student
    learning, achievement, and transfer in subjects as diverse as general science
    (Akinoglu & Tandogan, 2007), medicine (Frohna, Hamstra, Mullan, & Gruppen, 2007),
    nursing, (Bowles, 2006), business management (Zheng & Padmanabhan, 2006), statistics
    (Enders & Diener-West, 2006), entrepreneurship (Tan & Ng, 2006), and textiles
    (Kadolph, 2005). Interested readers can refer to the journal Active Learning in
    Higher Education (http://alh.sagepub.com/) for up-to-date research in this field.


    RPRCCs provide both quantitative and qualitative benefits to the workforce. Statistics
    show that the current supply of computing graduates is not satisfying demand.
    The American Bureau of Labor Statistics (BLS) predicts that in the United States
    alone by 2014 there will be a total of 448,000 job openings in various aspects
    of IT and software development in response to industry growth and baby boomer
    retirement in spite of offshoring. In contrast, only 8,000 new research positions
    are predicted for computer and information scientists (Hecker, 2005; Vegso, 2006).
    Thus, if academia could produce sufficiently many new graduates to fill all of
    the projected openings, over 98% would be employed in some aspect of software
    development rather than in research. Students whose preparation includes the practical
    skills that RPRCCs are designed to instill in addition to the traditional theoretical
    background will be far better prepared to become productive members of the workforce
    soon after graduation.


    The Standish Chaos reports (Standish Group, 1994, 2003), which outline reasons
    for software project cost and schedule overruns and outright cancellations after
    significant expenditure of time and resources, indicate that a major factor is
    a lack of certain skills, many of which are taught in RPRCCs. Starney (2006) has
    revealed three primary reasons for project failures: lack of requirements management,
    lack of risk management, and poor project planning. All of these skills are addressed
    in RPRCCs.


    RPRCCs build skills above and beyond traditional academic computing skills, which
    cover only a fraction of the software development tasks that must be performed
    on typical projects. In addition to skills such as algorithm development and programming,
    project work requires skills inherent in RPRCCs, such as requirements engineering,
    analysis and design, testing, cost and'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'effort estimation, scheduling, risk management, and overall project management.
    The ubiquity of software libraries and sophisticated middleware makes algorithm
    development a far less dominant aspect of the development process than it was
    10 or 15 years ago.


    # WHY sO FEW RPRCCs?


    Given these benefits, why do so many departments not include RPRCCs among their
    offerings? As we began our study of RPRCCs, we conjectured that a major reason
    is that many departments lack faculty with the background and confidence to teach
    such courses. Unlike technical computing courses, teaching RPRCCs requires skills
    that are difficult to learn by reading a textbook and solving sample problems.
    Rather, learning to teach RPRCCs requires practical experience with developing
    real software for real clients, experience typically acquired by working in industry,
    either as one’s primary employment or through industrial faculty internships (e.g.,
    http://www.boeing.com/companyoffices/pwu/fellowship/objective.html; Johnson, Powers,
    & Wagert, 1989). In our experience many computing faculty enter academia directly
    from graduate school without any detours for industry experience and are, therefore,
    ill-prepared to teach RPRCCs.


    At the same time, industry folks coming to academia to teach RPRCCs can encounter
    challenges, although generally for different reasons. In one example, an instructor
    with over 30 years of industry and government experience taught a new RPRCC that
    had to be cancelled, with bad feelings all around. While the instructor did have
    the requisite software development skills, this individual lacked the teaching
    skills required to make the course interesting and successful for the students
    and the clients. On the other side of the pendulum, while working in industry
    one of our co-authors received special training in how to teach as part of the
    IBM University Programs in


    Technical Education and was able to convert that experience into success in the
    classroom.


    # THE AUTHORs’ sETTINGs


    The details of a particular RPRCC depend on factors such as the course’s desired
    outcomes, the preparation of students, and available resources. Before we address
    issues relating to clients, projects, teams, work products, and assessment, we
    describe the wide variety of settings in which we have taught RPRCCs at different
    levels of the computing curriculum.


    The ideas in this chapter are drawn from close to 50 years of cumulative experience
    teaching RPRCCs. Students at our institutions have very different backgrounds
    and the resources available to instructors vary widely. This breadth of experience
    shows the broad range of possibilities and the different ways that RPRCCs can
    be realized in different settings. We have taught RPRCCs in computer science departments
    at the following types of post-secondary institutions in the United States:


    +   - *A small private engineering school.* Students arrive well prepared, with
    overall SAT scores well above the national average. Nearly all entering CS freshmen
    have had at least one computing course in high school and quite a few students
    have done additional programming before entering the undergraduate program. In
    the past few years a handful of freshmen have entered with professional experience,
    mostly in Website design, and a small number have even had their own web design
    businesses.


    +   - *A small Hispanic-Serving university.* Students may be admitted with low
    SAT scores and many enter with low math placement scores. Only a few of the students
    entering the CS major have had high school programming or other advanced placement'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'courses. Some students have been employed in industry, which has given them
    valuable project-work experience.


    +   - *A small private Historically Black university.* Entering students have
    typically not had a programming course and may be weak in mathematics. Students
    are frequently admitted with low SAT scores, which can make it difficult for them
    to solve technical problems and design programs. Many students have family and
    job responsibilities as well as transportation problems, which makes it more difficult
    for them to schedule meetings and complete project work. As a partial solution
    to these problems, courses have been restructured to provide additional lab time
    for team meetings.


    +   - *A medium-sized regional state university that is primarily a commuter campus.*
    Students are relatively well prepared, with mathematics as the most typical deficiency.
    Entering students have the highest SAT verbal and total scores of students in
    any program in the college and significantly exceed university and national norms.
    Most students have had some programming experience in high school, but may take
    a basic computing course (CS0) if they arrive without this experience. By the
    time they take the first of two required RPRCCs they are familiar with networks,
    databases, and architecture, as well as with technical writing. The program of
    study includes a new prerequisite of a non-computing course that emphasizes teamwork
    and leadership skills.


    +   - *A large private research-oriented university.* The curriculum includes
    an elective two-semester introductory-level graduate SE RPRCC. Over three-quarters
    of the students in this course are recently-arrived Asian nationals, mostly Indian,
    but including many Chinese, Koreans, and Thais. About half of the students have
    some industry background.


    +   - *A very large public state research university.* Over half of incoming students
    have had a computing course in high school, many have advanced placement credit,
    and about half have done web programming or created Websites. Only a few have
    professional experience. CS majors have among the highest average SAT scores in
    the university. The program does, however, include a significant number of weaker
    students who enjoy using computers and want to be CS majors.


    Throughout the chapter, we embrace the diversity of our student populations and
    the great variety that characterizes RPRCCs at our different institutions. The
    courses in our examples include: several varieties of software engineering (SE)
    (e.g., a one-semester elective junior/senior-level course; a one-semester required
    course, and a two-semester required capstone sequence); a one-semester required
    sophomore/junior-level database course; a one-semester Information Systems Design
    course; a Senior Research course; and a required two-semester project-only capstone.
    In all of these courses, including those taught at levels as early as the sophomore
    year, students work on real projects for real clients.


    Because of the diversity of our student populations, the educational goals for
    our various RPRCCs are significantly different in some respects. As a result our
    approaches to issues involved in designing and teaching RPRCCs have ranged from
    structured and prescriptive at one end of the spectrum to “seat of the pants”
    at the other end. The examples we include should give a sense of this range.


    # bUILDING THE CLIENT POOL


    A planning challenge that can seem insurmountable to faculty members new to teaching
    an RPRCC is finding the clients who will form the backbone of the course (as well
    as the projects).'
