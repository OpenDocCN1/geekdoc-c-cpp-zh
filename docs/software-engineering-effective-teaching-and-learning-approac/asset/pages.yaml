    each prototype. |

    | 4-Part II | Week 6 | Management Plan | Teams complement the Assignment 4-Part
    I prototyping plan with a management plan that identifies the responsibilities
    of each team member for each sub-component, including a primary and backup individual
    per sub-component. Plan also identifies whether each sub-component is not-implemented
    (stub), partially implemented, or fully implemented for the respective prototypes.
    |

    | 4-Part III | Weeks 9, 12 and 14 | Prototype Reports and Presentations | Teams
    provide deliverables for each prototype, including:

    A. Presentation of their progress/status including system demonstrations.

    B. Update of the prototype and management plan (what milestones did they hit/miss).

    C. Evaluation of the project status, and critique of teamwork experiences. |

    | 5 | Last day of class | Realistic Issues for Product Development | Each student
    explores issues related to commercialization of their project by writing a 3 page
    analysis associated with issues such as: Funding, Commercialization, Intellectual
    Property, Social/Ethical/Legal, Software Licensing, Payment, HIPAA Security, or
    any other specific issues related to commercialization. |

    | Final Project | Last day of class | Final Project Delivery | Industry managers
    in computing are invited and critique/provide input. The final submission has
    both team and individual parts. For the Team Submission, each team provides an
    overview of the project and its goals, a summary of changes since Assignment 3-
    Part III, a detailed user manual, etc. For the Individual Submission, there are
    team-assessments and self-assessments as well as student reflections on their
    accomplishments, what they have learned, and what they would change/do differently
    if they started the project again. |


    meets with the instructor each week for the first half of the semester. The instructor
