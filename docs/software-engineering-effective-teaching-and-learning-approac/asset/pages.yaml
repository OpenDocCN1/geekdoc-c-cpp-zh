  md: 'ences in the required or elective courses they have taken, the outside software
    projects with which they have been involved, and the employment or internship
    opportunities they have enjoyed.


    Among the tools we have used to assess students’ skills are the following:


    +   - Survey instruments that list skills, including various programming languages
    and COTS products such as DB systems and middleware. Students respond by self-assessing
    each of these skills on a scale that ranges from zero to five.


    +   - Personal data forms that solicit information such as courses taken, weekly
    schedule, on-campus vs. commuter status (to determine availability outside of
    class time), and computing equipment available at home.


    +   - Formal resumes, in some cases prepared with the help of the Career Services
    department.


    +   - Informal “about-me” reports.


    +   - In-class interviews of each student, either by the instructor or by other
    students. The interview process can range from very informal to fairly formal
    to allow students to practice for future job interviews. Interview protocols can
    be adapted from ones provided by sources such as the department’s PAB.


    +   - Transcripts, which are typically legally available only to the instructor,
    not to TAs or other students.


    In the real world of software development, project management generally assigns
    developers to teams based on matching skills to project needs. If the instructor
    assigns students to teams, it may be easier to balance the skill mix for each
    team to help ensure that every team can succeed on its project. Allowing students
    themselves to determine the teams may result in an uneven distribution of skills
    across the teams.


    One of us starts the process of assigning students to teams by characterizing
    each student using these indicators:


    +   1. Technology experience (based on a self-assessment survey).


    +   2. Communication skills (based on grade point average (GPA) in humanities
    courses).


    +   3. Problem-solving skills (based on GPA in computing and mathematics courses).


    +   4. Drive to ensure the project will be successful (based on overall GPA).


    This instructor sets up teams so that each is composed of at least two students
    with high self-reported technology experience, at least one student with strong
    communication skills, at least one student with strong problem-solving skills,
    and at least one student with strong drive. On occasion, the instructor allows
    self-selected groups of four or five students who offer a compelling argument
    that they should be allowed to form a team, for example because they have previously
    worked together on a successful project. In most cases the results have been very
    good.


    Another instructor-driven approach to team formation sorts students according
    to information gathered via personal data collected early in the semester. One
    of us regularly uses this list of criteria, ordered from highest to lowest priority,
    to determine teams:


    +   1. Anti-affinity: Who does not want to work with whom.


    +   2. Schedule (compatibility): Based on general timing categories {morning,
    afternoon, early evening, late evening}, preferred days of the week, and full
    schedules as a final sanity check.


    +   3. Gender: No gender should be represented by only one person in a group except
    in the case of strong mutual requests (that is, avoid teams with just one woman).


    +   4. Break up cliques: No more than three mutual requests per team.


    +   5. Affinity: Who wants to work with whom; worth more if a mutual request.'
