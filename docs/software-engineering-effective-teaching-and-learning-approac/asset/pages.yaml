    # EVALUATION


    The Software Enterprise is currently in its fourth year; 82 different students
    have enrolled in at least one Enterprise course in the first three years and 43
    students (30 new) are currently enrolled in Fall 2007. Due to the limited time
    it has been offered and the relatively low population, a statistically valid evaluation
    of student performance in meeting the overall objective of “industry preparedness”
    is not feasible at this time. However, we are in the progress of collecting longitudinal
    data and share what we have learned so far.


    Several types of quantitative and qualitative assessment data are collected each
    year:


    +   1. **Course assessments:** These are the standard rating-oriented course assessments
    performed for all courses at ASU. Students are asked to rate the quality of the
    learning experience as well as provide some qualitative feedback.

    +   2. **Course survey:** An Enterprise-specific course survey is conducted at
    the end of each semester. Students are asked quantitative questions about the
    quality of the learning experience, as well as a self-assessment of expertise
    in course subject areas.

    +   3. **Affinity process:** Students are posed context-free questions in small
    groups and organize responses in naturally forming clusters (the “affinity” for
    each other’s responses). Interestingly, this process is also taught as part of
    requirements elicitation.


    +   4. **Impending and recent graduates survey:** A survey of impending and recent
    graduates asked about perceptions they hold regarding the utility of their education
    with respect to their technical profession. The goal is to repeat this study for
    several years to accumulate trend data about the preparedness of our graduates.

    +   5. Qualitative data is reflected in anonymous student write-in responses on
    surveys in 1 and 2, feedback from project sponsors, and input from two industry
    advisory councils.


    The Affinity process (3) and course survey (2) are particularly useful in assessing
    the industry-preparedness perceptions of our students. The graduates survey (4)
    will be useful when results are complete.


    *Affinity process.* An Affinity process is a method for obtaining unbiased results
    (Kawakita, 1982). The process is as follows:


    +   1. Explain the process to participants

    +   2. Pose question

    +   3. Ask each participant to write down as many responses as possible (at least
    10) regarding the question. Only one idea (preferably one word) should be written
    per post-it-note. Allow approximately 5 minutes for this phase.

    +   4. Ask all participants to place all of their post-it-notes on the white board
    and to remain at the board as a group. Tell participants (without discussing it
    with each other) to cluster the ideas into coherent groups by physically moving
    post-it-note into close proximity with each other. Participants should consider
    all items on the board, not just ones they created. If a dispute exists (e.g.,
    an idea ping pongs from one cluster to other, copy the idea onto another post-it-note
    and place in both clusters).'
