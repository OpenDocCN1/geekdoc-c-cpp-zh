  md: 'Software engineering focuses heavily on group-based work. This is reflected
    by an emphasis on team work and team projects in SE education. Section IV of this
    text includes a series of chapters that address various aspects of project-based
    work. The team emphasis is one mechanism to allow students to get experience with
    larger software systems.


    Team projects are one example of a broader emphasis on preparing students for
    practice. As an engineering discipline, SE has a strong emphasis on application
    of knowledge, and preparation for professional practice. The chapter by Armarego
    in this volume explores one approach to ensuring that SE education lines up with
    practice. Other chapters in Section VI discuss issues of professionalism and preparation
    for professional practice.


    Software engineering also involves a variety of human issues that range well beyond
    working in teams. In this volume, the chapter by Brady et al focuses particularly
    on the issue of communication about software. The chapter by Hazzan and Tomayko
    provides a survey of SE activities and topics with an emphasis on the human component.
    The broad sweep of topics addressed by these chapters plus the chapters on project-based
    work clearly shows that SE has a human component different from most of the traditional
    engineering disciplines.


    The challenges in teaching SE are being worked on as research projects by many
    SE faculty members. Funding for these efforts is competitive, but available from
    several sources. The most important funding source in the U.S. is the National
    Science Foundation, primarily through funding for research and development related
    to undergraduate education. As mentioned earlier, the focused funding once provided
    by the Department of Defense through the SEI is no longer available, although
    the Department of Defense did recently fund an effort to create a new Masters
    level curriculum model for Software Engineering. Various other federal agencies
    and foundations provide occasional grants that impact software engineering education.


    The combination of technical foundations and the emphasis on the issues outlined
    above makes teaching of SE particularly challenging. It also implies that qualifications
    for SE faculty members have distinct requirements, particularly with regard to
    the importance of having faculty with professional experience. This is a difficult
    issue since the pool of candidates with academic credentials and professional
    experience is relatively limited. The chapter by McDonald discusses this issue
    from an accreditation perspective, and Rosca et all address the issue of hiring
    and retaining faculty members with the right combination of qualifications.


    # Ass Ess MENT OF THE CURRENT s TATUs OF sOFTWARE ENGINEERING EDUCATION


    There is no regular census of software engineering programs worldwide, although
    there have been a variety of efforts to track the degree programs at both the
    undergraduate and master''s level including Knoke (1998), Modesitt, et al (2000),
    and Bagert (Bagert & Ardis, 2003; Bagert & Chenoweth 2005). As of 2007, there
    were at least 32 undergraduate software engineering programs and 53 MSSE programs
    in the U.S. alone. The worldwide numbers would at least double these counts. There
    are also 3 Ph.D. programs in software engineering in the U.S.


    Software engineering programs in the U.S. have not been immune to the downturn
    in student enrollment experienced by computing programs since about 2000. There
    are no reliable numbers to measure the extent of downturn for software engineering,
    but there is extensive anecdotal evidence that it has been substantial, although
    perhaps not as great as for computer science. It would be difficult to know how
    to interpret enrollment data in any case since fully two thirds of the BSSE programs
    have been started in the years since 2000. The more interesting question'
  merge: -1
