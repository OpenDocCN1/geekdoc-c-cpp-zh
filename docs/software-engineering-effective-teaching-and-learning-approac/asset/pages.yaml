    The final results indicate that about 85% of students (as an average of the three
    years in which the course has been held) completed the course satisfactory, being
    the average grade 7.5 out of 10. This percentage is very similar to the number
    of students who actually completed all the exercises comprised on the course.
    This, lead us to the conclusion that the learning environment success is guaranteed
    whenever the teachers get students enough involved on it.


    To evaluate the impact of the course on students learning and attitudes we carried
    out a series of surveys. Surveys took place at the beginning and at the end of
    the course that has been held during the last three academic years. Despite the
    voluntary nature of the surveys, 93% of an average of 150 students per year completed
    them. It is important to note that students knew that their answers to the questions
    would have no effect in their grades. The purpose of the surveys was to evaluate
    whether students attitudes over relevant software testing topics covered during
    the course, changed accordingly with our previously stated hypotheses.


    The attitude evaluation survey was designed in a similar fashion to the one presented
    in (Sitaraman, M., Long, T.J., Weide, B.W., Harner, E.J. & Wang, L. 2001). The
    survey consists on 18 statements. Each of them must be marked by students with
