  md: 'the students’ project experience more closely resemble one they would encounter
    in the real world. Some of these have included industry participation (Beckman
    et al., 1997; Kornecki et al., 2003; Wohlin & Regnell, 1999), emphasizing non-technical
    skills such as marketing and project management (Gnatz et al., 2003; Goold & Horan,
    2002), and focusing on making the nature and composition of the student teams
    that work on the project more realistic (e.g., making them very large (Blake,
    2003) or composed of several sub-teams (Navarro & van der Hoek, 2005b)). Topical
    approaches aim to educate students in detail about a topic generally not covered
    in depth in mainstream textbooks and lectures. These approaches do not focus on
    specific delivery methods, but instead focus on the mere addition of the topic
    as a crucial component of an effective and complete education in software engineering.
    Some examples of such topics are formal methods (Abernethy & Kelly, 2000), real-time
    software engineering (Kornecki, 2000), and specific software processes such as
    the Personal Software Process (Hilburn, 1999) or the Rational Unified Process
    (Halling et al., 2002). Finally, simulation approaches are those that have students
    practice software engineering processes in a (usually) computer-based simulated
    environment. Within the realm of software engineering simulations, there are three
    main types: industrial simulations brought to the classroom (Collofello, 2000;
    Pfahl et al., 2000), game-based simulations (Drappa & Ludewig, 2000; Navarro &
    van der Hoek, 2005a), and group process simulations (Nulden & Scheepers, 2000;
    Stevens, 1989).


    To categorize these approaches in terms of learning theories, we carefully studied
    each one to determine which learning theories appear to have been applied (whether
    intentionally or unintentionally), and which learning theories have clear potential
    to be employed. The resulting categorization is presented in Table 2 as a matrix
    of approaches and the learning theories that they leverage. (For a complete discussion
    of this categorization, see (Navarro, 2005) — here we present


    only the highlights.) The presence of three stars in the table indicates that
    the approach embodies the particular theory, or is centered around it. The presence
    of two stars represents that the theory appears to be involved in the design of
    that type of approach, but is perhaps not an intrinsic part of it, and may not
    be involved in all approaches that fall within that type. The presence of one
    star indicates that there is an obvious potential for that particular type of
    approach to employ that learning theory, but there have been very few, or no known
    cases of it.


    # Example: simulation and Learning Theories


    As an example of how we analyzed each approach in terms of learning theories,
    in this section we will focus on the simulation category and walk through how
    we determined the applicability of each learning theory for these approaches.
    First of all, all aforementioned educational software engineering simulations
    allow students to learn software processes by participating in them (Learning
    by Doing), albeit virtually. This theory is central to the paradigm of educational
    simulations (hence, the three stars in the table). These simulations also employ
    Situated Learning by adding realism to the learning environment, although in different
    ways: Industrial simulations add realistic factors in the form of real project
    data in the simulation model; Game-based simulations add realism by immersing
    the student in the role of a participant in a realistic game scenario; Group process
    simulations inject realism through the simulated characters that behave similarly
    to real-world participants. Because these realistic factors are artificial in
    that they are virtual (rather than in a real-life setting), we put two stars in
    the table for this theory.


    Simulation approaches strongly fit with the Keller’s ARCS model of learning. In
    particular, they are specifically designed to promote attention, relevance, confidence,
    and satisfaction (and'
