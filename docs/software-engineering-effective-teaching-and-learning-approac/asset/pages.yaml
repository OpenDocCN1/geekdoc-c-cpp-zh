  md: 'acquired by students is important in that it acts as a ‘filter’ for graduate
    employment, of greater impact on the professional competence is the focus on soft
    and metacognitive skills. These are learnable within a formal education environment,
    albeit through the application of non-traditional learning models. The final model
    developed and applied in the research project, Studio Learning, appeared to be
    effective in addressing issues raised in studies of discipline practitioners and
    the education literature. The application of Studio Learning within the Murdoch
    SE programme is discussed in greater detail elsewhere (Armarego, 2007a).


    The results of the alignment of this model with the discipline/educational issues
    highlighted earlier in this chapter can be summarised as the need to:


    +   - Provide students with authentic experiences which address competencies additional
    to specific discipline knowledge: students were exposed to learning both as a
    ‘generic’ metacognitive activity, and as a skill to be continually adapted and
    utilised within a discipline context. Flexibility in thinking - addressing creativity,
    opportunism and divergency/convergency - was made explicit and strategies to exploit
    it developed

    +   - Provide learners with a deep understanding of self and others in complex
    human activity systems in a collaborative environment: students became aware of
    and learnt to utilise each other’s strengths and weaknesses in achieving the learning
    outcomes. They learnt how to ‘jell’, what to do if they did not, and to be empathetic
    to the contexts of other students. They learnt to value and exploit alternate
    perspectives brought to a problem by different stakeholders (client, teacher/consultant,
    other team members) to enrich their learning. They became aware of the need to
    be self-motivated and learn independently - students were confident in questioning
    their own and others’ assumptions within the learning environment


    +   - Allow time to explore new ideas and to reflect on possible processes and
    outcomes: students were willing to ‘trust’ each other’s knowledge (implicit or
    not, technical or not), accepting the multi-disciplinary nature of the skills
    and knowledge required to achieve the learning objectives

    +   - Be challenged: students were motivated by the (increasing) complexity of
    the tasks assigned, and were able to focus on cognitive and interpersonal skills
    to adapt to the changes imposed.


    Techniques applied included: providing students with information about learning
    theory (PBL, situated learning, life-long learning), ensuring ‘higher order learning’
    was addressed with greater emphasis on analysis and synthesis rather than application
    of knowledge within courses, embedding reflective practices within each course
    (eg journals, performance and team-work reviews), emphasising alternative approaches
    to problems and ‘rewarding’ diversity of (feasible) solutions, embedding change
    in all aspects of the problems tackled (changing requirements, scenarios, deliverables,
    team composition, client contact, etc) to highlight the importance of opportunism,
    flexibility and adaptability (Armarego, 2007c).


    Not only was student feedback positive, and a significant improvement in their
    assessment marks discernable, but observation and analysis of subsequent learning
    (Armarego, 2007c) showed strong indications of willingness to transfer knowledge
    gained, to take control of their learning, and indicated motivation to deeper
    learning, as indicated by the work of Entwistle and Ramsden (1983).


