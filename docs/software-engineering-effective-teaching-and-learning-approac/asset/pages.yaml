  md: 'above a moderate level of expectation between curricular outcomes and the knowledge
    elements associated with secure practice.


    In terms of implementation, in each of these curricula, the practitioner orientation
    and the fact that security content is not the point of the field tends to indicate
    that the courses in which secure practice content would be most easily integrated
    would be those that are designed to provide students with knowledge about specific
    life cycle activities such as specification, design, and testing and assurance.


    As a final note, the measurement process used in this study (a raw count) is inherently
    less accurate than expert contextual analysis of the meaning of each knowledge
    element. Therefore a more rigorous comparison should be undertaken to better characterize
    the functional relationship between the items in the CBK and the various curricular
    standards.


    # INCORPORATING sECURITY REQUIREMENTs ENGINEERING INTO MAINs TREAM ACADEMIA


    Once we had better understood the relationship between the complete body of knowledge
    in security and the curricular recommendations for all computing disciplines,
    we were ready to tackle the question of how security requirements engineering
    is best presented in an academic setting.


    The typical undergraduate curriculum does not provide much room for the addition
    of security requirements engineering practices other than as part of a project
    course that includes security requirements. There are, however, a number of ways
    that security requirements engineering methods could be incorporated into a software
    engineering curriculum (Mead, 2006). If an undergraduate project included requirements
    development, the students could be given an assignment to identify (and implement)
    security requirements


    along with other more traditional requirements. This would occur in the early
    part of the project. Alternatively, if the students did not develop the project’s
    requirements, they could still be asked to recommend security requirements.


    At the graduate (master’s) level, it is much easier to see how security requirements
    might be addressed. This material could be part of a requirements course or a
    course on development of secure systems, with several lectures and an exercise
    or case study on security requirements. In a graduate level project course, the
    students would typically be developing requirements rather than developing software
    based on pre-existing requirements, so there would be opportunity to insert this
    methodology in such a course. In that instance the students would apply a method
    such as SQUARE as part of their requirements gathering process, and the instructor
    could grade the students on the quality of the security requirements and on the
    success of the implementation.


    Another possibility is to incorporate the material into a course that is part
    of a security specialty within a graduate level program in software engineering
    or information systems. Typically there are several courses on information security,
    at least one of which deals with the development of secure software. Discussion
    of security requirements engineering could fit into a series of lectures and case
    studies. Eventually a half-semester or full-semester course could be devoted to
    security requirements engineering. This would also allow for a comparative study
    of various techniques that have been developed to support security requirements
    engineering.


    # s ecurity Requirements Engineering Techniques


    A report by Mead et al., which focuses on survivable requirements engineering,
    describes several requirements engineering techniques (Mead, 2003). In the course
    of assembling an elicitation framework and applying it to a software devel-'
