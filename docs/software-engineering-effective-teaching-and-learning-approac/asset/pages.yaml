- pgno: 52
  md: 'and 40% of student intake to engineering is lost through not catering for students
    with strengths in communications and team work or creative problem solving, synthesis
    and design.


    In SE, Glass (1995) suggests that discipline and creativity are the odd couple
    of software development – the discipline imposed by methodology, for example,
    forms a frame for the opportunistic creativity of design. The educational dilemma
    becomes one of providing a base that enables software developers to both create
    and engineer the systems they build: to be adaptable to the changing environment
    that is inevitable in their chosen discipline. However, criticism has arisen regarding
    engineering graduates’ ability to be creative (Cropley & Cropley, 1998). The need
    for flexibility, fluency and originality in day-to-day dealings, which typically
    define the creative effort (Guilford, 1967), is seen as lacking from their education.


    The inadequacy of formal education in training competent practitioners, then,
    may be partly explained by the ‘incorrect’ learning environment that results from
    the poor fit between the characteristics of the discipline identified by practitioners
    and those of the learning model. A solution can be proposed through the development
    of a new framework for SE education. This framework should:


    +   - Be based on constructivist theory (as more suitable for learning in domains
    involving ill-structured problems (Spiro, Feltovich, Jacobson, & Coulson, 1991)
    with a focus on strategic knowledge to enhance knowledge construction and transfer.
    This includes metacognitive strategies for directing, monitoring and evaluating
    learning.


    +   - Be placed within a situated experiential learning environment where authenticity
    (with rich contextual information) is exploited (Dreyfus & Dreyfus, 1986). Focusing
    on the solution of authentic problems as a context for learning provides students
    with


    entry to the community of practice to which they will belong.


    +   - Provide the student with a learning environment that has an emphasis on
    modelling practice, making tacit knowledge explicit and thus empowering students
    to think independently.


    Several learning models apply these concepts. As noted previously, the project
    looked specifically at Cognitive Apprenticeship and problem-based learning as
    exemplars. However, there is a suggestion in the literature that efforts to help
    students learn at Bloom’s higher-order levels may be impeded by a mismatch between
    the kinds of thinking actually required in specific disciplines and generic formulae
    for encouraging higher-order thinking (Middendorf & Pace, 1986). In the final
    analysis, applying generic learning models (even non-traditional ones) for situated,
    higher-order learning that is student-centred may run counter to an important
    strand in the current thinking about teaching. This stresses the disciplinary
    nature of knowledge. As a tool for learning, the model must be adapted to the
    discipline. The development of a curriculum map aligns the needs of the discipline
    with the educational strategies to address these concerns.


    # Curriculum Mapping for Constructive Alignment


    As both curriculum development and learning theory move away from behavioural
    to cognitivist and constructivist approaches in order to address the needs of
    both the discipline and changing context for the discipline, the value of alignment
    is enhanced.


    The basis of a framework for a learning environment is a ‘constructive alignment’
    (Biggs, 1999) of objectives, teaching context and assessment tasks. Based on the
    discussions of Brown, Bull, and Pendlebury (1997), aligning these components achieves
    the following aims: the'
