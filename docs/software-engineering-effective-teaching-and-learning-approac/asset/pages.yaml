  md: '# Interdisciplinarity: Encouraging Further Reciprocation


    Software engineering is a field that draws from a wide range of disciplines. This
    project illustrates the benefits of reaching across disciplinary boundaries to
    bring outside knowledge into the software engineering curriculum (Brady, Johnson,
    & Wallace, 2006). For several decades, academic technical communicators have engaged
    in extraction and incorporation, the first stages of what Klein calls interdisciplinary
    exchange (Klein, 1990). That is, they have entered other disciplines (including
    software engineering), brought back important findings, and then applied them
    to technical communication practices and pedagogy. The result is a rich body of
    studies on communication and collaboration in real workplaces, as well as new
    ideas and best practices for interface design and composition. Our project represents
    the third stage of interdisciplinary exchange: reciprocation, in which technical
    communicators “give back”, offering the fruits of their work to improve the field
    of software engineering.


    To further this work and encourage others to engage in similar interdisciplinary
    efforts, we wish to build a community of software development stakeholders—both
    educators and practitioners—who understand one another’s potential contributions
    and who are committed to the principle of integrating communication education
    into the software engineering curriculum. These stakeholders can describe the
    problems they encounter in teaching and employing communication, and the practices
    that they have found effective. Working as a group, we hope to explore how to
    extend current educational practices.


    # ONLINE CASE STUDIES


    We have set up an online repository of case studies at www.speaksoft.mtu.edu/cases/.
    Currently the first-semester Seabase case and the SoilSim


    case are publicly available. Three more case studies will soon be added: the second
    (successful) semester of the Seabase project, the Java Logic Simulator project
    (interacting with a Computer Science professor to create an educational tool for
    circuit design), and the 3-D Maze project (interacting with another Computer Science
    professor to create a test platform for HCI research in three-dimensional interface
    navigation).


    # ACKNOWLEDGMENT


    This work has been supported by NSF Award #CCF-0417548. We wish to thank our colleagues
    who helped design and implement the case studies: Anne Mareck, Leroy Steinbacher,
    Jon Woods, and Robert Johnson. We also deeply appreciate the participation of
    the Senior Design students whose projects we documented, and the students who
    used the case studies and participated in the evaluation. Finally, we thank our
    reviewers for their helpful comments.


    # REFERENCES


    Abran, A., Moore, J. W., Bourque, P., & Dupuis, R. (Eds.). (2004). Guide to the
    Software Engineering Body of Knowledge. IEEE Computer Society.


    Agar, M. (1996). The Professional Stranger. Academic Press.


    Alred, G. J. (2006). Bridging Cultures: The Academy and the Workplace. Journal
    of Business Communication, 43, 79-88.


    Blakeslee, A. M. (2001). Bridging the Workplace and the Academy: Teaching Professional
    Genres Through Classroom-Workplace Collaborations. Technical Communication Quarterly,
    10(2), 169-192.


    Brady, A., Johnson, R. R., & Wallace, C. (2006). The intersecting futures of technical
    communica-'
