  md: 'This chapter introduced a blended learning approach (i.e., a mixture of online
    training and traditional classroom education) enhanced by tightly integrated coaching
    activities. This approach was practically applied to train professional software
    developers in object-oriented software development with UML. In detail, the approach
    uses online training activities to create a common understanding and knowledge
    of the technology, classroom trainings for transferring application- and domain-specific
    knowledge, and coaching to ensure that the recently learned elements are correctly
    applied.


    For successfully applying our approach in practice as well as for supporting others
    in their decision to adopt our results, it is important to evaluate the concrete
    effects of the approach and to critically reflect on the enabling factors, i.e.,
    evidence is warranted. The second part of this chapter therefore presented an
    industrial case study to gain more insights into the learner’s expectations, preferences
    and the integration of working and learning in an industrial setting. The results
    indicate that following a blended learning approach has a positive impact on learning
    time and, due to the integrated coaching measures, supports not only effective
    learning but also sustainable results. However, the limited amount of data-points
    does not allow generalizing the results. Thus, further additional studies are
    required.


