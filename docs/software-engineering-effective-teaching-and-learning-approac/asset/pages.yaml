    SE698,SE699,CS514,CS517,CS533,BM565


    **Thesis (6 credits)**

    Two semester Thesis:

    SE690A: Thesis Research

    and  SE690B: Thesis Research


    We have also made some changes in the bridge courses of our curriculum by adding
    two bridge-courses, SE510(Object-oriented Analysis and Design) and SE515 (Disciplined
    Software Development). We strongly believe that all our students should know the
    basic analysis and design methods by the time they enter the graduate program.
    This would allow us to teach advanced


    methods for software analysis and design in the corresponding core courses (SE565
    and SE570), instead of spending a considerable amount of time teaching basic knowledge.
    Also, we are strong believers of the engineering principles emphasized by a disciplined
    approach to developing programs, such as the Personal Software Process (PSP).
    We would like all our students to'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'be familiar with these engineering techniques at the individual level, to be
    able to leverage them at the team level in the software process core course (SE580).
    This course will also introduce principles of agile software development.


    We removed Operating Systems Concepts (CS505) from the curriculum since the material
    was covered in several other software engineering courses. We revised SE504 (Principles
    of Software Engineering) to focus on structured analysis and design methods while
    presenting the breadth of software engineering principles. This emphasis would
    allow us to focus on the modern object-oriented methods in the core analysis and
    design classes.


    In the electives courses, we added a course on Secure Web Services Design (SE611)
    to develop a sequence of courses on security, together with SE610 (Software Systems
    Security). This sequence will cover both the theoretical and practical aspects
    of software systems security, given the ubiquity of security issues in today’s
    systems.


    Another future trend that we believe will induce major changes in the way we deliver
    our program will be determined by the increasingly mobile characteristic of the
    majority of our students, whom are working full-time and take the courses part-time.
    To allow them maximum flexibility, we might need to change our delivery mode to
    include more distance learning, maybe in the way The Open University in UK does
    (Quinn, 2006). At the moment we are experimenting with offering “hybrid courses”
    that are a combination of a traditional, face-to-face delivery, and distance learning
    that uses online curricular materials. This delivery mode saves students the travel
    time to campus, and also allows them to keep up to speed when they travel for
    business. Students are required to come to campus every other week, to meet with
    the instructor for a face-to-face class. If their grade falls below a certain
    threshold, they are required to come to class every week. This is


    a new approach for us, and we don’t have enough data yet for a thorough evaluation.


    Another issue, that is beyond the scope of this paper though, is the awareness
    of the influence that the licensing of software engineers shall have on the design
    of the curriculum. However, the directions and discussions that are taking place
    with regard to licensing have to be followed so that appropriate changes can be
    implemented in the curriculum.


    # CONCLUSION


    This chapter has presented the main problems and lessons learned from one of the
    oldest programs in software engineering in the USA. The evolution of the graduate
    curriculum over its 21 years of existence has been shown as an example for other
    colleges and universities considering the addition of a software engineering degree.
    We expect this evolution to continue in the future, as the SE field is a constant
    moving target.


    We have argued that the continuous update of the course content has a special
    meaning in software engineering, due to the dynamics of the field. With this respect,
    we have shown the impact of the advances in the field on the textbooks used, the
    need for continuous reevaluation of the chosen programming language, operating
    system, or software tools used in class.


    The chapter has shown the difficulties we have experienced in attracting and retaining
    the faculty over the years, due to the need of the new faculty to have both a
    record of scholarly accomplishments and industrial experience. The emphasis here
    is on the conjunction of these two requirements, which sets great restrictions
    on the pool of available candidates.


    We explained how various issues related to the diversity of the student body influence
    the curriculum and course content. As such, the educational backgrounds, employment
    status,'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'educational goals, and communications skills of the student body are challenges
    any software engineering program has to solve.


    Based on our experience in dealing with these problems, we have offered some recommendations
    for those interested in starting a similar program, with an emphasis on the curriculum
    and course content issues that arise where an undergraduate and graduate program
    in software engineering coexist in the same department.


    As a measure of success of our continuous efforts to improve, we have seen the
    program enrollment increasing steadily over the years. This is not a reason to
    rest, since the SE field will continue to evolve, and we will have to respond
    to new challenges.


