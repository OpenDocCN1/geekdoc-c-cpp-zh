  md: 'content. Issues raised by a diversity of educational backgrounds, employment
    status, educational goals, and communication skills introduce challenges that
    need to be dealt with by any software engineering program.


    The remainder of the chapter discusses in detail the topics presented above. It
    begins with the presentation of the curriculum evolution over the history of our
    program. Then it discusses various issues involved in the continuous changes of
    the software engineering course content. The subsequent section outlines our experience
    in hiring and retaining the faculty, followed by a presentation of the student
    body influence of the diversity of the curriculum and course content. The chapter
    concludes with the presentation of our recommendations for those interested in
    starting a graduate program in software engineering, and future trends of the
    MU program. This discussion will emphasize the accommodation of an undergraduate
    and graduate program in software engineering in the same department.


    # CONTINUOUS CURRICULUM RESTRUCTURING


    Over its short history, software engineering (SE) as a field has been a moving
    target. We have observed the introduction of the capability maturity model, the
    unified modeling language, personal and team software process, and corporate adherence
    to ISO Standards emerge as major forces within software engineering organizations.
    We have observed important changes in analysis and design with transitions from
    structured analysis and design ,to object-oriented analysis and design. Even the
    architectures being released today have shifted from client-server architectures
    to distributed architectures with the current trend being focused on service-oriented
    architectures.


    A curriculum that addresses the skills and practices required by professionals
    in this field must continuously reinvent itself over time. The curriculum of Software
    Engineering changes with a frequency on the order of twice a decade as opposed
    to decades for engineering (Clough, 2005) and sciences (Stryer, 2003), in general.
    Just about every aspect of the software engineering curriculum is susceptible
    to change over a decade. In order to accommodate industry’s needs and to keep
    pace with the advances of software engineering as a field, we have added or dropped
    courses, and added new tracks and programs. The decisions were made in the context
    of creating and maintaining a balance between the theory, technology and practical
    aspects of software engineering.


    Changing the curriculum can not be performed in an ad hoc manner. We follow a
    well-defined process. First, the faculty discusses the need for change based on
    feedback from industry, students, and current publications. The acquisition of
    feedback is a continuous process that is assisted through an industry advisory
    board, alumni surveys, student exit interviews, student learning outcomes assessment,
    periodical evaluation of the program by an external reviewer who is a prominent
    figure in software engineering education, and attendance at professional meetings.
    We have established a set of learning outcomes that we monitor on a regular basis
    and we take into consideration when the need for a significant curriculum change
    is required.


    Next, the program director writes a proposal identifying the new curriculum, and
    any additional courses that might be required. This effort includes writing a
    complete syllabus for each course that is introduced, modifying existing syllabi
    for courses with significant content changes, and a justification for each course
    that is dropped.


    The proposal is put forth to the faculty in the department for comments. Comments
    include challenges to the changes in course content and discussion of the overall
    package. The syllabi'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'for the various courses may undergo several iterations.


    Once the proposal is approved within the department, the proposal is sent to the
    chairs meeting within the school. Often times, changes to the software curriculum
    may require changes in the course content of other departments (e.g., computer
    science and the business school). If significant push-back arises from the other
    departments within the school, the proposal is reconsidered by department.


    At the school chairs meeting it can be decided that a stronger business case is
    required. An external body typically develops this business case. It is either
    a survey developed by an independent firm, or by an external industrial advisory
    committee. The business case reflects the needs and state of industry, which will
    attract new students.


    After the eventual suggestions for change are incorporated into the proposal,
    it is submitted to the university graduate studies committee. Here the curriculum
    is evaluated in terms of its consistency with the University Policies applied
    to graduate programs. This includes establishing maximum class sizes, the number
    of contact hours, assignment of lab fees, and other factors.


    Next we present the evolution of the Monmouth University’s Graduate Software Engineering
    Curriculum. This evolution shows a gradual transition from a software engineering
    program created inside a Computer Science department, towards a program with engineering
    courses that span the entire software lifecycle. It incorporates the results of
    a strong collaboration between academia and industry (Powell, 1997).


    # The Initial Curriculum (1986)


    The initial software engineering curriculum at Monmouth University consisted of
    30 credits, with 6 core courses and 4 electives (see Figure 1). The core courses
    covered in detail only the implementation (in Ada) and project management aspects
    of the software lifecycle, due to the


    limited availability of faculty with an appropriate background. The curriculum
    looked more like “a computer science curriculum with an engineering flavor” (Dart,
    1997), covering classic computer science courses such as algorithms, operating
    systems, computer architecture and database management systems.


    Students’ practical training was accomplished in a 3-credit practicum course.
    This course consisted of a team project to develop a software system from initial
    requirements to the final, tested and documented product. The early curriculum
    was biased more on theoretical aspects (notice the heavy concentration on mathematical
    foundations of SE), with less exposure to specific SE technology and practice,
    as was very early recommended in (Ford, 1987).


    # 1991 Curriculum Changes


    This curriculum added a number of SE courses, including formal methods, formal
    specifications, software process and SE environments (see Figure 2). However,
    it still had a bias towards computer science, offering an artificial intelligence
    course, 4 courses of mathematical foundations and formal methods, and 4 courses
    in network technology, due to our geographic location in an area dominated by
    the telecommunications industry. It was similar to the First MSE model curriculum
    (Ardis, 1989a; Ardis 1989b) that recommended a set of 10-12 courses, which comprised
    6 core courses, 3 or more electives and a two-semester practicum project. However,
    due to the lack of qualified faculty, the core courses offered were not able to
    cover the entire software lifecycle.


    # 1995 Curriculum Changes


    In 1995 the curriculum was substantially changed to include 36 credits, with 10
    core and 2 elective courses (see Figure 3), in order to comply with the Software
    Engineering Institute model curriculum (Ardis, 1989) and the 1991 Computing'
