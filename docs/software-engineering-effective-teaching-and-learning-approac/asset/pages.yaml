  md: "or method, given certain inputs, conforms to its functional specification.\
    \ White box consists of analyzing the source code in order to guide the selection\
    \ of test data. In this respect, students need to have good enough Java programming\
    \ skills to throughfully understand the execution flow present in the methods’\
    \ source code. It is important to balance the pairs when creating them at the\
    \ beginning of the course; students with less Java programming skills must be\
    \ paired with the more experienced ones. Test data must be appropriately selected\
    \ to achieve an adequate coverage over the code to test. Students have to decide\
    \ which coverage (statement, edge, branch or path) to use when testing each method\
    \ and justify the decisions made. Also, students have to create flow graphs for\
    \ each method and depict on them special situations derived from exception handling\
    \ when it is the case. Note that only 6 methods of the whole system are selected\
    \ to be tested, so the workload is assumable.\n\nWe have encountered difficulties\
    \ among students to understand and appropriately set-up the context in which a\
    \ method for a given test case must be called. There is a trend to conceive a\
    \ method as an execution entity which results are only determined by the input\
    \ parameters regardless the context in which the method is invoked. This problem\
    \ is especially notorious when designing test cases under the white-box perspective.\
    \ For this reason we have selected some methods which results are strongly influenced\
    \ by events like the presence of a file in the file-system or the inner-state\
    \ of the object in which the method is defined. Another important issue is to\
    \ make students take into account all the factors involved in setting-up the method\
    \ invocation context and to check all the observable results of its execution.\n\
    \n# Testing in Isolation\n\nMaybe the most difficult aspect when doing unit testing\
    \ is to completely isolate a class from its collaborative classes. Usually an\
    \ object makes use of\n\nother objects to carry out certain tasks beyond its own\
    \ functionality. Obviously, the execution results (and so that the test results)\
    \ of methods belonging to that object are going to be strongly determined by the\
    \ inner-state of the object. Usually it is very difficult to set up domain state\
    \ on such a way that it exposes the features to be tested. Even if we can do it,\
    \ the written test will be probably very complex and difficult to understand and\
    \ maintain. We can avoid these problems using Mock Objects (Mackinnon, T., Freeman,\
    \ S., & Craig, P. 2000) that are a substitute implementation to emulate or instrument\
    \ other domain code (in particular the collaborative classes). They should be\
    \ simpler than the real code, not duplicate its implementation, and allow the\
    \ developer to set up private state to aid in testing. Mock Objects are very useful,\
    \ but to create them by hand may be tedious, therefore, students use a tool named\
    \ JMock. JMock automatically generates the mock classes’ source code from the\
    \ original classes and presents a very intuitive interface with a very plain learning\
    \ curve. In addition to the generation of the Mock Objects, a preliminary refactoring\
    \ process is typically required, consisting in creating the factory methods in\
    \ which the original objects will be replaced by mock objects. In the Source code\
    \ listing 1, it is shown an example of a factory method that instantiates a collaborative\
    \ class.\n\n```\npublic class TargetClass() {\n    protected CollabClass factory-Method(){\n\
    \        return new CollabClass();\n    }\n    ...\n}\n```\n\n# Source Code Listing\
    \ 1\n\nFollowing this procedure, it is possible to test objects that inherit from\
    \ the target class and override the factory method to replace the instantiation\
    \ of the collaborative object with the instantiation"
