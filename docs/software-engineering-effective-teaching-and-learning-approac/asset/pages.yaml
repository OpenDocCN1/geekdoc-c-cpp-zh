- pgno: 385
  md: 'also serve as a way of assessing a candidate’s past experience. The examination
    questions are developed by an examination committee, which comprises about 400
    experts from industry and academia. Subcommittees are charged with question development,
    checking, and selection. Each subcommittee has independent authority to construct
    appropriate questions. In general, new questions are produced for each examination,
    but some knowledge questions may be modified for reuse. After the examination,
    candidates can bring question papers home to use for self-study and further education.
    The correct answers for some questions are made available, and examinees can obtain
    their scores on the examination. Transparency of the examination is therefore
    ensured in several ways: scope of examination, production of examination questions,
    availability of examination scores and sample question answers.


    The Ministry of Economy, Trade, and Industry issues certificates to successful
    examinees. The certificates show the date of certification, but currently have
    no expiration date. From 1969 through 2004, 12,404,713 candidates took the examinations;
    certificates were awarded to 1,324,869 successful candidates. During its 35 years
    of existence, the Information Technology Engineers Examination has been able to
    adapt to the rapidly changing information technology environment. Its adaptability
    to the demands of the times has been a major factor in its success. Furthermore,
    nine Asian countries (India, Singapore, Korea, China, Philippines, Thailand, Vietnam,
    Myanmar, Taiwan) have recently agreed to accept the Japanese examination as a
    professional credential.


    # j Ob FRAMEWORKs


    Another approach to certifying the expertise of software engineering professionals
    is to place the tasks carried out by these professionals in a broader model of
    information technology pro-


    fessional positions. Such a model is called a job framework. The pioneering job
    framework effort in the information technology arena is the Skills Framework for
    the Information Age (SFIA, www.sfia.org.uk). The SFIA framework was developed
    in the UK and first launched in 2000; version 3 of the framework was released
    in 2005 (Skills Framework for the Information Age, 2005). SFIA is a two-dimensional
    model; the dimensions represent the skills used by information and communication
    technology (ICT) professionals and the levels at which these skills are needed
    for a particular job. The skills are placed along the first dimension of the model;
    they are grouped into six categories, such as development or service provision.
    The second dimension of the model consists of seven levels of responsibility and
    accountability exercised by ICT professionals. The two dimensions of the model
    give rise to a matrix showing the complete set of skills used by ICT professionals.
    Each skill and level in the matrix corresponds to a professional position. The
    model gives descriptors that provide examples of typical tasks performed by professionals
    in that position.


    For example, the SFIA 3.0 skill category “development” contains the subcategory
    “systems development”. The skills associated with this subcategory include “database
    design”, “programming/software development”, and “systems testing”. Four of the
    seven levels are used: “assist”, “apply”, “enable”, and “ensure/advise”. The descriptors
    for the levels used in this subcategory are given below.


    +   - (Assist) Designs, codes, tests, corrects and documents simple programs and
    assists in the implementation of software which forms part of a properly engineered
    information or communications system.

    +   - (Apply) Designs, codes, tests, corrects and documents moderately complex
    programs and program modifications from supplied specifications, using agreed
    standards and tools. Conducts reviews of supplied specifications, with others
    as appropriate.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '+   - (Enable) Designs, codes, tests, corrects and documents large and/or complex
    programs and program modifications from supplied specifications using agreed standards
    and tools, to achieve a well-engineered result. Takes part in reviews of own work
    and leads reviews of colleagues’ work.

    +   - (Ensure, advise) Sets standards for programming tools and techniques, advises
    on their application and ensures compliance. Takes technical responsibility for
    all stages in the software development process. Prepares project and quality plans
    and advises systems development teams. Assigns work to programming staff and monitors
    performance, providing advice, guidance and assistance to less experienced colleagues
    as required.


    The relationship of job frameworks to professional credentials is that an individual
    can be certified with respect to his or her level on one or more skills. For example,
    a software developer could be classified as Level 5 (ensure/advise) according
    to the description given above. An application for SFIA Level 5 certification
    would include documentation of appropriate education/training and work experience.
    Evaluation of an application would include a review of the applicant’s credentials
    and face-to-face interviews by examiners who are already certified at that level.


    More recently, the European Community has sponsored an informatics certification
    program (EUCIP, www.eucip.com) that is based on a job framework. EUCIP divides
    the informatics career space into a number of elective profiles. By February 2004,
    the following profiles were defined: Business Analyst, Information Systems Analyst,
    Software Developer, and Network Manager. Many more EUCIP profiles have since been
    defined (European Certification of Informatics Professionals, 2006). The structure
    of a profile includes a brief description of the tasks to be carried out by a
    person working in the corresponding job, a list of essential behavioral skills
    for that job, a list of required detailed skills, and a matrix of accredited learning
    modules by which an individual can demonstrate that he or she has these skills.


    The EUCIP job framework is also two-dimensional; one dimension consists of the
    skills needed, while the other dimension indicates the skill level, classified
    as deep (sound competence and experience), incisive (concepts reinforced by experience),
    or introductory (some concepts, general smattering).


    For example, the task description for a EUCIP Software Developer (European Certification
    of Informatics Professionals, 2004) includes sentences like “Defines detailed
    specifications and directly contributes to the efficient creation and/or modification
    of complex software systems using the proper standards and tools.”, and “Constructs
    or modifies, tests, and corrects large and/or complex component modules from specifications.”
    The corresponding behavioral skills are given by sentences like “The Software
    Developer role requires first of all a rational mental attitude capable of conceptual
    and analytical thinking, a high regard for detail and a persistent goal-oriented
    approach, leading to the result through structured solutions formulated in a flexible
    way.” The detailed skills are organized by level. Examples include:


    +   - Deep: “Use different programming design methods, such as object-oriented
    design, top-down design, structured programming”, “Understand the use of objects
    and classes”, “Apply the principles of software engineering.”

    +   - Incisive: “Gather and analyse user requirements”, “Coordinate a software
    development project”, “Reuse objects and code.”


    The list of learning modules for this profile (European Certification of Informatics
    Professionals, 2004, p.12) includes university program names (e.g. information
    systems, software engineering) and industry certificates (Microsoft, Oracle, Sun).'
