    that encourages teams to bond and work together.


    +   - The project must be feasible, or it must be possible to set the scope of
    the project for the teams so that their part of the project is feasible.


    Project clients have ranged from researchers in geology, agronomy, environmental
    sciences, and software engineering to project managers attempting to deliver software
    to customers in the U. S. Army, for the United States Geological Survey, and users
    of the geoinformatics grid (GEON, 2007). Here are some of the projects completed
    in the past several years.


    +   - PACES: Satellite Scene Viewer: This project provided access to the Pan American
    Center for Earth and Environmental Studies (PACES) satellite image archive by
    integrating ENVI image processing and Oracle database management system software
    with graphical-user interfaces.


    +   - HATS GUI (Winter, 2006): This project created a graphical user interface
    for the High-Assurance Transformation System (HATS) developed at Sandia National
    Laboratories. The HATS GUI facilitated the creation and interpretation of transformation
    rules used to generate software for high-assurance applications.


    +   - Scene and Countermeasures Integration for Munition Interaction with Targets
    (SCIMITAR) (Anderson, 1999): SCIMITAR is an analytical tool that evaluates munition
    interaction with ground platforms within a scene. SCIMITAR allows users to modify
    and analyze images by adding obscurants and target types onto the scene in order
    to analyze aimpoint probabilities and countermeasure effectiveness.


    +   - Gravity Data Repository and Processing System (GDRP) (GeoNet, 2007): GDRP


    is a web-based tool that provides general information about gravity measurements
    and presents a collection of tools for adding, accessing, visualizing, and manipulating
    data. The project was a coordinated effort with UTEP, Arizona State University,
    and U.S. Geological Survey.


    # Project Management


    The end result of the project should be a software product or a prototype product.
    In order to produce a working piece of software, project management is essential.
    This is particularly relevant when managing several software teams simultaneously.
    While many resources are available to guide an instructor in basic software project
    management (Wysock, 2006; Whitehead, 2001; DeMarco, 1999; McConnell 1997), in
    this section we discuss aspects of project management specific to the academic
    capstone project.


    Students in the UTEP course work in highly structured and managed project teams
    on all aspects of development: requirements elicitation, feasibility, modeling
    and analysis, prototyping, requirements specification, tracing, high-level and
    low-level designs, implementation, and testing. In addition, students submit formal
    documents (using IEEE standards when appropriate) including feasibility report,
    interview report, Software Requirements Specification (SRS), Software Design Document
    (SDD), test plan, testing defect report, and configuration management plan. Students
    participate in walkthroughs and inspections for designs and prototypes, and presentations
    of the software requirements and finished product are presented formally to the
    clients. Figure 2 shows a Gantt chart of the major deliverables for the two-semester
    course following a traditional academic year.


