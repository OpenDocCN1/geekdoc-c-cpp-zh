- pgno: 34
  md: 'SWENET, the Network Community for Software Engineering Educators.


    +   - **SWEEP:** In 1998-1999, the ACM and IEEE-CS sponsored the Software Engineering
    Education Project (SWEEP). This group worked to create guidelines for undergraduate
    Software Engineering curricula and a draft set of accreditation guidelines for
    undergraduate software engineering programs. Members of SWEEP started work that
    evolved into the Software Engineering curriculum model (ACM & IEEE, 2004).

    +   - **SWECC:** The Software Engineering Coordinating Committee was part of a
    joint effort by the ACM and IEEE-CS to promote SE as a profession. This effort
    provided the starting point for development of an SE Code of Ethics, and an SE
    Body of Knowledge project. The ACM withdrew from the group as part of the decision
    to take a position against licensing of software engineers.

    +   - **SE 2004:** The undergraduate SE Curriculum Model grew out of some of the
    earlier efforts mentioned above. But it was a clear step beyond those efforts
    in having endorsement of the IEEE-CS and the ACM. In addition, it benefited from
    the more formal and more broadly based development process that has evolved over
    the history of the computing curricula volumes.

    +   - **SWEBOK:** The Guide to the Software Engineering Body of Knowledge, was
    started as a project by SWECC in 1998. The intention “is to provide a consensually
    validated characterization of the bounds of the software engineering discipline
    and to provide a topical access to the Body of Knowledge supporting that discipline.”
    (SWEBOK, 2004, p. xvii). To provide a starting point, the SWEBOK drew on prior
    SE standards efforts supported by the IEEE. In addition, the SWEBOK is notable
    for the effort to be


    transparent and provide a consensus result based on broad participation.


    +   - **FASE:** The Forum for Advancing Software Engineering, is an online newsletter
    that includes announcements, reports, and short articles of interest to software
    engineering educators. It was published monthly for many years, and archived articles
    are maintained online.

    +   - **SWENET:** The Network Community for Software Engineering Education, was
    an NSF project that produced a repository of publicly available software engineering
    course modules (Hislop, Lutz & Sebern, 2006). SWENET also supported several workshops
    that were effective community building exercises for software engineering educators.
    The project ended in 2005, but the repository is still supported.


    The list above represents an impressive effort given the modest size of the software
    engineering community. At the same time, it is clear that some of the mechanisms
    that served well in the past have not kept up with the changes and growth in the
    software engineering community.


    For example, WGSEET, The Working Group on Software Engineering Education and Training
    has ceased to exist. An effort to replace WGSEET with SEECo, an Education Community
    within the IEEE CS Technical Council on Software Engineering, has not been a success.
    Similarly, SEPLA, the Software Engineering Program Leaders Association, was started
    as a spin-off of WGSEET to allow department chairs and program directors to interact.
    The group has a low activity listserv, but has never really been active. Finally,
    FASE, the online software engineering education newsletter, was published regularly
    for over 10 years. But FASE has been largely inactive for the last several years
    because few people are choosing to submit any material for distribution.


    These changes can be taken as reflections of the success of software engineering.
    Many of the'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'original goals of SE educators such as creating curriculum models and developing
    accreditation standards have been accomplished. These efforts now have mainstream
    support of the major computing professional societies. As such, the efforts will
    be widely visible, and maintained over time.


    On the other hand, it seems that the community of software engineering educators
    has lost some of the supporting structure that mechanisms like WGSEET and FASE
    once provided. The opportunity for informal interaction among interested faculty
    members was a valuable side effect of those efforts. Given that the total number
    of SE degree programs worldwide is still not very large, it seems that looking
    for additional opportunities for informal community interaction might be valuable
    in the future too.


    # ACCREDITATION, CERTIFICATION, AND LICENSING


    Accreditation has been a clear success for software engineering in the U.S. Accreditation
    criteria were developed in 1998-1999 and the first degree programs were accredited
    in 2003. At present 13 programs are accredited, and more are expected to complete
    this process over the next several years.


    SE accreditation is handled by the Engineering Accreditation Commission (EAC)
    of ABET, the accrediting body for engineering and technology in the U.S. After
    the SE accreditation effort began, ABET merged with CSAB, the accrediting body
    for computer science. With the merger of CSAB, ABET created a Computing Accreditation
    Commission (CAC). The CAC currently handles accreditation of computer science,
    information systems, and information technology.


    By curricular content, software engineering clearly has strong overlap with the
    CAC disciplines. On the other hand, it makes sense to place software engineering
    with the other engineering


    disciplines in the EAC. As it happens, this issue was decided simply by the sequence
    in which the events happened to occur (accreditation criteria development followed
    by the merger).


    Licensing has been and remains a controversial issue for software engineering.
    Although licensing (or chartering in the U.K.) has proceeded relatively smoothly
    in the U.K. and Canada, there has been little progress in the U.S. Without regard
    to the question of whether software engineers should be licensed, there are several
    difficult issues associated with licensing.


    Perhaps the most important question overall is the body of knowledge that provides
    the basis for license. Opinions diverge on whether software engineering knowledge
    is mature enough to support licensing in a meaningful way. That is, will a licensed
    practitioner in software engineering have the knowledge needed to protect the
    public from software risks, or, is the body of software engineering knowledge
    not mature enough to support meeting this responsibility? Shaw (1990) discusses
    this issue with a broad perspective of how a software engineering discipline might
    emerge. In a more recent discussion Shaw reiterates this argument with the comment:
    “...professional licensing carries a commitment to the public that we can achieve
    a level of practice that provides certain safety and utility properties of the
    product, but such a level of practice is not yet routinely achieved” (Shaw, 2000,
    p. 375).


    It is also important to note that much of the attention to licensing has revolved
    around the difficulty of bringing the software community into the engineering
    community. This plays out in a variety of ways, including the following:


    +   - Software engineering is not accepted by many engineers in traditional engineering
    disciplines as being a “real” engineering discipline

    +   - Traditional engineering disciplines deal with engineering of physical products,
    and core knowledge of traditional engineering is built'
