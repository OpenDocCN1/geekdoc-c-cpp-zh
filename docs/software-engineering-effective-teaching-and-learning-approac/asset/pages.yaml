- pgno: 350
  md: 'be involved in the process. The program needed to be advertised as much as
    possible, and admissions needed to understand the requirements for admission to
    the program. They also needed to place the incoming SE students in the proper
    courses for the freshman year.


    Finally, the issue of transfer students, both internal and external, needed to
    be addressed. Since the program was phased-in over four years, for the first two
    years, we would be unable to accept upper division transfers (unless they were
    willing to stay an extra year) since the upper division courses were not available
    during those first two years. We did, in fact, accept one sophomore transfer the
    first year of the program and he was able to graduate with just one additional
    semester.


    # CHANGE MANAGEMENT


    One important issue to address early in the program development is to plan for
    change. This begins with outcomes and measurement. We were fortunate that many
    of the processes that we required in this area were already largely in place.
    The CIS department already had outcomes defined for the CS and MIS majors and
    some measurement tools in place.


    Further, the Electrical Engineering and Mechanical Engineering departments were
    ABET accredited. Concurrently with the launching of the SE major, the CIS department
    was preparing for ABET accreditation for the two existing majors, and the EE and
    ME departments were preparing to renew their accreditation. To aid in this process,
    an online course evaluation tool was prepared to gather information specifically
    required by the ABET process. (A university-wide course evaluation instrument
    had been in use for all courses for several years, but it did not gather all information
    required by ABET.) This tool was used from the beginning of the SE program.


    Even though we are only about to begin our fourth year of the program, and the
    first time


    the senior level courses will be offered, we have already made changes to the
    program. First, we realized that we had a hole in coverage in the operating systems
    area. To address this issue within faculty time and budget constraints, we added
    the full Operating Systems course to the list of required courses. To make room,
    we dropped an Introduction to Engineering course which had only partial content
    relevant to our needs. We moved the relevant content into pieces of existing courses
    where they fit the best.


    One of the core Liberal Studies requirements is a basic business course. Many
    of our majors chose either Microeconomics or Macroeconomics. After two years of
    the program, we saw an opportunity to provide a business course more directly
    applicable to the SE majors. As such, we co-developed a course (Project Economics)
    with the business school which provides basic economics theory as well as the
    application of the theories in a project setting. This course is now the designated
    business course for SE majors.


    Our current Software Engineering Curriculum (2007-8) is listed in Figure 4. Diagonal
    shading indicates reused Computer and Information Science courses. The darker
    grey shading indicates new courses developed for the Software Engineering major
    by the Computer and Information Science department. One of the seven originally
    proposed new Software Engineering courses (See Figure 3), the Software Engineering
    Seminar, was offered two times and it was determined that the course was not serving
    the needs of our software engineering students. Therefore, it was removed from
    the curriculum. As noted in a previous section, Discrete Math 2 was developed
    by the Math department for our software engineering program. The remaining courses
    required for the software engineering major, including the application domain
    courses, are coded in Figure 4 as indicated by the shading key. These courses
    were already offered by various departments within the university, with the exception
    of Project Economics discussed above.'
