  md: '# Example 15: End of the Course Task, Case Study Construction and Analysis


    At the end of the course, the students are asked to construct and analyze a case
    study following a process that guides them in their case-study construction. The
    process is outlined in the Appendix to this chapter. The target of this task is
    to integrate all of the material learned in the course and to enable the students
    to express their perspective on the variety of topics learned in the course.


    # FUTURE TRENDs


    We now propose several suggestions for the continuation of the work presented
    in this chapter:


    Evaluation: This chapter is organized by kinds of tasks. The actual influence
    of these tasks is now being examined in a qualitative research project that examines
    the multi-faceted contribution of these questions to students’ awareness with
    respect to the different topics addressed in the course. In particular, we are
    exploring the development of this awareness, as well as its influence on students’
    perception of the discipline of software engineering.


    Other categorizations: The tasks given to the students in the Human Aspects of
    Software Engineering course are presented in this chapter according to the kind
    of task the students are required to carry out. Naturally, there are other ways
    of categorizing the different tasks students work on during the course. One such
    categorization is by the learning target of the questions; another is by the mental
    processes employed when working on the tasks.


    # CONCLUsION


    We conclude with some suggestions related to the application of the ideas presented
    in this chapter to other software engineering courses. In general, we propose
    that most kinds of tasks presented in this chapter can be applied in many software
    engineering courses.


    We suggest that the tasks presented in this chapter, can contribute to students’
    professional skills while dealing with the challenges of the profession of software
    engineering. In particular, we suggest introducing questions of the kinds presented
    in this chapter in courses that:


    +   - Aim at improving students’ analytical skills, reflection processes and problem-solving
    abilities using a learning approach that enables the students to formulate their
    perspectives and explore resources on which to base their points of view.

    +   - Aim at illustrating to students the multi-faceted nature of the profession
    of software engineering, in a way that guides them to seek for different points
    of view, controversial issues, and dilemmas and conflicts with which they will
    have to cope in the future.

    +   - aim at basing the lessons on student interactions that encourage them to
    learn from their peers and experience teamwork and information sharing.


    In our opinion, many of the courses taught in software engineering programs should
    target these issues. We hope that our contribution is be in the presentation of
    a collection of kinds of questions that can be used in order to achieve these
    goals.


    # NOTE


    This chapter is dedicated to my colleague Jim Tomayko, my co-author of Human Aspects
    of'
