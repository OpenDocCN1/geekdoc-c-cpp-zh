  md: 'contact person in the enterprise should be able to select proper sources, i.e.,
    he should already have some experience with the contents taught. (c) The participants
    should have enough time to become familiar with the selected original material.


    The main target of an industrial technology transfer project is to provide the
    employees of an enterprise with the ability to apply certain knowledge to a given
    problem. In practice, the exact identification of the knowledge content and its
    application modalities are not as clear as might be expected.


    The first reason for this is found in the different views of the involved people.
    We distinguish three roles in the context of an industrial project: Management
    is normally the project initiator and willing to invest into employees’ education
    to achieve higher productivity. Therefore, it generally has high expectations
    concerning the outcome of the project. These might include increased usage of
    a certain technique or an expensive tool. The employees typically have different
    prior


    experience and motivation in dealing with the new technology. Therefore, they
    often expect greatly different information from the knowledge content offered.
    The coach has to communicate this content to the employees, and keep in touch
    with management. Since management view and employee view usually differ, the coach
    becomes a moderator between these two parties. This also applies to the mediation
    between competitive groups of employees. Additionally, he might have his own academic
    interest, e.g., introducing a specific method, etc.


    The second reason for the uncertainty regarding the content is the change of evidence
    over time. All project participants gain experience during the project. Therefore,
    the focus can move to knowledge details, which have turned out to be important
    for a successful application but were considered at the beginning.


    In the blended learning approach we can distinguish several phases of project
    work: the self-organized occupation with the courseware or


