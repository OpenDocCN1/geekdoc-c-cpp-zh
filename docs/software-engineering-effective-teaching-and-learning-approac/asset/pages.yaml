  md: 'for the client organization in the near future is, therefore, almost certainly
    a poor choice.


    # Academic Challenges


    Some of us prefer to offer projects from domains with which students are at least
    somewhat familiar. For weaker students a completely unfamiliar domain can slow
    the team down so much that they cannot make much progress in one semester, which
    can lead to a sense of failure. For stronger students, being faced with an unfamiliar
    domain offers the advantage of simulating reality, although students may initially
    reel at being faced with this unaccustomed challenge. While some of us expend
    considerable energy in assessing the scope of potential projects, others leave
    the bulk of the task of scoping and adjusting expectations to the team as part
    of their learning experience.


    For any type of project, a key influence on the pace at which work can proceed
    is how familiar team members are with the tools or components that may be required,
    e.g. a DBMS or middleware. Some of us require students to use specific programming
    (or other) skills learned in earlier courses in their RPRCC projects, which can
    limit the types of projects that are appropriate. Others of us leave the choice
    of languages, tools, and components to the team as it develops an understanding
    of the client’s domain and requirements, begins to develop a design, and communicates
    with the stakeholders who will host the completed software to determine the technologies
    they are willing and able to support.


    For any type of project, one option is to have multiple teams work in parallel
    on different aspects of the same project or even on the entire project. Each team
    can work on one or more components of the project and integrate the full system
    later in the course. For example, when a 6th-grade teacher wanted a grading tool,
    one team focused on the front-end components (user interface and reports), while
    another team focused on back-end


    issues (DB and data analysis). The challenge with this approach is coordinating
    delivery schedules and integrating the completed components into a single product.
    A benefit of this approach is that it can stimulate teams to share ideas and review
    one another’s work. However, integration should be done iteratively, rather than
    at the end as a big bang effort.


    It is also possible to have multiple teams work independently on exactly the same
    project in parallel with one another, rather than on different aspects of the
    same project. While multiple attempts at accomplishing the client’s goals may
    appear to increase the likelihood that at least one will succeed, this approach
    can put an unacceptably heavy demand on the client’s time. One way around this
    is to require that all teams be represented at all client meetings. A downside
    to this approach, however, is that it can engender the sort of competition that
    tempts teams to undermine, rather than support, one another.


    For novice RPRCC instructors, particularly those who do not have earlier experience
    working in industry, it is probably best to avoid having multiple teams work in
    parallel on the same project. The potential risks can be difficult to appreciate
    and deal with until an instructor has sufficient experience.


    # Issues Relating to the Delivered Product


    Some of us accept only projects for which the client agrees to allow all artifacts
    produced by the team to be placed in the public domain. When projects are developed
    under an open-source agreement, future teams at the same or other institutions
    can extend them and learn from them. Others of us accept projects that obligate
    us, and sometimes the students, to sign contracts that restrict future uses of
    some or all resulting work products. If a project is being done for a for-profit
    business or university entity, then privacy, trade secrecy, and intellectual property
    issues may be important. In'
