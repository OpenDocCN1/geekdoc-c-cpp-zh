- pgno: 241
  md: '# Chapter XI


    # Applying Blended Learning in an Industrial Context:

    An Experience Report


    **Christian Bunse**

    *International University in Germany, Germany*


    **Christian Peper**

    *Fraunhofer Institute Experimental Software Engineering, Germany*


    **Ines Grützner**

    *Fraunhofer Institute Experimental Software Engineering, Germany*


    **Silke Steinbach-Nordmann**

    *Fraunhofer Institute Experimental Software Engineering, Germany*


    # Abs TRACT


    With the rapid rate of innovation in software engineering, teaching and learning
    of new technologies have become challenging issues. The provision of appropriate
    education is a key prerequisite for benefiting from new technologies. Experience
    shows that typical classroom education is not as effective and efficient as it
    could be. E-learning approaches seem to be a promising solution but e-learning
    holds problems such as a lack of social communication or loose control on learning
    progress. This chapter describes a blended learning approach that mixes traditional
    classroom education with e-learning and that makes use of tightly integrated coaching
    activities. The concrete effects and enabling factors of this approach are discussed
    by means of an industrial case study. The results of the study indicate that following
    a blended learning approach has a positive impact on learning time, effectiveness
    and sustainability.


    # INTRODUCTION


    Today, software systems are available for almost all aspects of human life, ranging
    from household appliances to transportation/logistics, com-


    munication and health. Although, this is good with respect to effort and costs,
    at the same time it increases the need for high quality systems. But, the development
    of high-quality software systems requires well-trained professionals using'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'sophisticated tools and techniques. Unfortunately, transferring new techniques
    and tools from research into industrial practice is not easy. It may take years
    for a new, promising and even proven idea to become accepted as standard industrial
    practice. Software developers and organizations are regularly faced with technology
    decisions concerning the adoption of technology. Thus, technology adaptation and
    introduction requires adequate training (Lutz 2007), especially concerning development
    methodology and quality management.


    Typically, the demand for training is based on the job- and activity profile of
    employees (i.e., developers are trained in technologies they are going to apply
    in their projects) or on the requirements of the applied curricula. Building a
    training program on the actual needs and requirements of its participants is a
    step into the right direction, since this overcomes the problems typically associated
    with static training programs concerning flexibility, timeliness, etc. (Singh
    2003). However, even the most flexible training program (wrt. content) is of limited
    value if its transfer methodology (i.e., how the training should be performed)
    is not adapted in a way that ensures maximum sustainability.


    According to (Wills 2006), “traditional” strategies, using classrooms and technology
    and topic experts (e.g., professionals or professors) are in broad use. Unfortunately,
    these strategies are not only cost- but also time-intensive. While this might
    be acceptable in a university context, companies, especially small and medium-sized
    enterprises that have tight development schedules and short software release rates,
    cannot afford such trainings. Developers participating in traditional training
    programs are not able to develop software at the same time (i.e., reduction of
    development time). E-learning has been advertised as one solution for this problem
    by allowing and actively supporting education at any time and at any place.


    E-learning, which requires initial investments for preparing training media, is
    not “cheap”.


    Companies offering such training activities therefore have to acquire a large
    audience in order to obtain a positive return on investment (Ochs & Pfahl 2002).
    However, a large audience bears the danger of generalization (i.e., the training
    material is not adapted towards the specific situation of its participants) and
    lacks in social communication (i.e., learning in isolation) (Stark & Schmidt 2002).
    Communication problems might be mitigated by providing online support, guidance,
    and discussion facilities, although these require extra resources and effort and
    thus, increase the need for an even larger audience. Another problem associated
    with large audiences is the varying level of experience and background knowledge
    of its participants (i.e., heterogeneity) (Bunse, Grützner, Peper & Steinbach-Nordmann
    2005). Thus, cost efficiency and large audiences are like chasing one’s own tail.


    Traditional and e-learning both have their strengths and weaknesses. Combining
    them in so- called blended learning arrangements may outweigh the negative effects
    of both approaches, conserve the positive effects, and may even add additional
    value. Based on practical observations and experience with both “traditional”
    and e-learning, we propose a blended learning approach (Bunse, Grützner, Peper
    & Steinbach-Nordmann 2005) that mixes traditional classes and e-learning: E-learning
    is used to leverage knowledge and skills in the very beginning, followed by in-depth
    seminars for teaching advanced concepts as well as for performing group work,
    and practical exercises.


    One important goal for developing and applying our approach has been the assurance
    of sustainable learning effects (Asian Development Bank 1997). In other areas
    of education and training (e.g., soft skills), coaching is an often used means
    for addressing this problem. Coaching is a technique for observing the current
    functioning, assessing the strengths and weaknesses, and developing measures for
    addressing needed changes. Transferred to the domain of technology educa-'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'tion, coaching has to be integrated into the daily work of the trainees (i.e.,
    be workflow-oriented) in order to obtain significant improvements. Therefore,
    our blended learning approach is enriched by a subsequent, workflow-oriented coaching
    process. To obtain evidence on the practicability and effectiveness of our approach,
    it has been applied in industrial training projects. The results show that especially
    its adaptivity towards the needs of participants and the coaching aspects are
    the most prominent benefits as perceived by the participants.


    The remainder of this chapter is structured as follows. Section two introduces
    our blended learning strategy for teaching object-oriented development with UML.
    Section three describes major rationales for the product structure derived from
    market trends. Section four describes already existing experience on using our
    strategy in various application areas (e.g., for training students and professionals).
    In addition, it analyzes the effects of our approach on an objective basis and
    discusses how blended learning can improve software engineering education. Section
    five discusses the latest trend and directions in software engineering education.
    Finally, Section six provides a short summary and some conclusions.


    # bLENDED LEARNING IN sOFTWARE ENGINEERING EDUCATION


    In general, blended learning uses a mixture of various teaching methods and media,
    to “get the right content in the right format to the right people at the right
    time”. It therefore combines multiple delivery methods that complement each other
    (Singh 2003). As stated by the American Management Association (AMA), it “integrates
    seemingly opposite approaches … in order to achieve individual and organization
    (learning) goals”. Besides traditional classroom trainings, possible elements
    of the blend include e-learning


    modules and components (for example, assessments, simulations, resource collections,
    or online workbooks), virtual collaboration means (like email, communities of
    practice, online meetings, or e-mentoring facilities), or face-to-face methods
    (e.g., workshops, assignments for project team work, or coaching) (Rossett & Vaughan
    Frazee 2006, Singh 2003). With its advantages, especially in the field of (social)
    interaction and learning organization, the blended learning approach is increasingly
    penetrating teaching practice at universities (Jones & Northrop 2006a), training
    providers (Jones & Northrop 2006b), and industry (Lutz 2007 and Heidecke, Mayrhofer,
    Schiesser & Back 2007). Interestingly, there is a great variety concerning the
    methods applied in these domains. Methods range from educational games (Jain &
    Boehm, 2006), writing about a topic (Wang & Sorensen 2006), case studies (Burge
    & Troy 2006), project work (Frailey 2006) to simulations (Ubal, Cano, Petit &
    Sahuquillo 2006 as well as Fetaji & Fetaji 2006).


    Interestingly, blended learning helps to overcome obstacles that prevent companies
    from using e-learning approaches to train their employees. According to market
    studies on e-learning potential (e.g. Ochs & Pfahl, 2002), the five most important
    resistance factors concerning e-learning are:


    +   1. Insufficient qualification of personnel for e-learning-related tasks,

    +   2. Low quality of the used software systems,

    +   3. the overall quality of e-learning tools is seen to be unsatisfactory.

    +   4. Existing tools are too expensive, and

    +   5. The quality of contents is often seen to be inadequate to meet specific
    needs.


    In addition, the study predicted an increased mid-term (i.e., 1-2 years, thus
    at present!) demand for service categories centered on e-learning (i.e., 43% for
    Web-based training, 61% for Web-based'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'tutoring, and 58% for Web-based cooperative learning and problem solving).


    Interestingly, the powers of resistance seem to be eliminated by blended learning
    programs, since these offer classroom trainings that fit exactly to the working
    context of the participants. An additional factor in this regard is that blended
    learning approaches (at least those presented in this chapter) allow using e-learning
    elements without requiring a special management system hosted on the training
    organization’s platform. The increase in quality and thus, the mitigation of risk
    factors, is also indicated in the context of industrial case studies (i.e., successful
    certification of participants).


    In summary, blended learning seems to be a valid approach for conducting effective
    and efficient trainings with sustainable effects. The blended learning approach
    presented in this chapter is based on the definition given in (Singh & Reed 2001):
    “Blended learning focuses on optimizing achievement of learning objectives by
    applying the “right” learning technologies to match the “right” personal learning
    style to transfer the “right” skills to the “right” person at the “right” time.”
    This definition focuses on the learning objective and on the fact that many different
    personal learning styles need to be supported to reach a broad audience.


    Ferreira, Fonseca, d’Alge and Montiero (2002) and Höhle and Cho (2000) have looked
    extensively into distance learning and how these courses are received and studied
    by their participants. They suggest that experience made in pure distance learning
    can be taken and applied to onsite combined learning courses, as that presented
    in this chapter. Following (Mühlhauser 2002) our approach is based on material
    that is used, updated and, most importantly of all, educates.


    Our approach is based on standard definitions and approaches however the most
    important question is what are the concrete effects when applying the approach
    and what are its enabling factors. Thus, empirical evidence is needed.


    Interestingly, previous research on case studies has not focused on blended learning
    (Solberg Søilen 2007). (Yildiz & Chang 2003) conclude that Web-based courses tend
    to be “richer and of more quality” than regular class room education. In contrast,
    (Mikulecky 1998) observed that students were able to generate more thoughtful
    responses in Web-based courses. Following (Solberg Søilen 2007) the three forms
    of interaction: learner-instructor, learner-content and learner-learner interaction
    are involved in interactive and blended learning. The case study presented in
    (Solberg Søilen 2007) confirms the importance of the interaction the student has
    with teacher and other student in addition to distance or e-learning. Our study
    supports this too and indicates that blended learning has a positive impact on
    learning time and, due to the integrated coaching measures, supports effective
    learning with sustainable results.


    # TEACHING OO-DEVELOPMENT WITH UML IN A bLENDED LEARNING APPROACH


    Blended learning is a promising approach to facilitate software engineering education,
    given the need for training-on-the-job, the rapid change of technologies, and
    the diversity of application domains. In this section, we describe the application
    or instantiation of the general blended learning approach towards model-based
    and object-oriented development with UML.


    Object-orientation and UML were chosen as training topics due to the growing popularity
    and distribution of the paradigm and its associated technologies in large parts
    of industry. Thus, in detail, there is a need for systematic education concerning
    sound OO analysis, design, and programming, as well as for model-based specifications
    and architectures using UML. Interestingly, the trend towards requesting e-learning
    facilities is increasing in parallel. This motivated'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'the development of an integrated product known as “Blended learning OO & UML”,
    which has already been successfully applied in academic and professional education.


    In general, as discussed and outlined in section 2, blended learning proposes
    a mixture of learning activities comprising self-steered learning activities,
    cooperative and collaborative learning activities, learning activities supported
    by online tutors, social learning activities, and traditional classroom teaching
    activities. The approach has to address all these elements but, at the same time,
    needs to be flexible and adaptable towards different context requirements. This
    is comparable to the situation of software engineering technologies, which are
    unlikely to be transferred into practice in a monolithic style.


    In summary, our approach establishes four modular learning product levels (see
    Figure 1). Each level integrates the respective lower level and supplements it
    with new activities in the teaching process. This modularity provides a maximum
    of flexibility for the design of educational programs and assures optimal appropriateness
    for the learners in specific programs. The following table (Table 1) provides
    a detailed description of each product level.


    In general, the different program modules can be independently applied in concrete
    training activities. Since there are no silver-bullets, especially not in engineering
    education, simply using a pre-defined learning program or module will hinder obtaining
    sustainable effects. To create such effects, a program or module must thus be
    individually adapted to various context factors such as application domain (e.g.,
    domain-specific examples and best-practices), skill level, etc. However, adaptation
    is neither easy nor cheap (e.g., adapting e-learning courses requires significant
    effort). Therefore, we defined in general that adaptation will focus on the classroom
    training aspects and use a standard e-learning course for creating a common understanding
    of the participants. The training material used in classroom training uses different
    modules that can be individually combined and/or exchanged. Thus, context-specific
    modules can be simply plugged into the training material. The underlying strategy
    (e-learning followed by classroom activities) requires the definition of a standard
    schema for actually conducting the training.


    Figure 2 depicts the standard schema defined in the context of OO&UML. The schema
    transports the various contents of the product levels


    Figure 1. Product levels


    ![](img/870ca27e7c1e774d15231ca545126a78_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Table 1. Description of the product levels


    | Levels of the learning product | Description |

    |---|---|

    | UML Basis | “UML Basis”, located at the lowest level, is centered around two
    Web-based trainings (WBT’s), which target different groups: (1) “UML Interactive
    for Technical Managers” presents information on the origins, characteristics,
    and advantages of UML. It also presents a short overview of the different UML
    diagrams and available tool support. It enables the learner to make a decision
    concerning the use of UML in upcoming development. (2) “UML Interactive for Software
    Designers” provides additional learning content to enable learners to develop
    UML diagrams with good quality. Both WBTs are supported by an Internet forum granting
    synchronous and asynchronous communication opportunities. Here learners can ask
    questions or chat / discuss with peers. |

    | UML Personal | “UML Personal” resides at the second level. In addition to “UML
    Basis”, it provides support by online tutors. Tutors answer subject matter and
    organizational questions. In an extended version of the tutoring activities, tutors
    provide feedback on practical exercises That simulate real working tasks. They
    represent the third stage of knowledge transfer (i.e., in addition to examples
    and self-tests in the WBTs). Thus, tutors are able to evaluate acquired knowledge
    and skills as well as the individual learning behavior. |

    | OO Practitioner (UML) | Learning activities added at the third level, “OO Practitioner
    (UML)”, are classroom trainings and project coaching. Classroom trainings provide
    several topics from the field of object-oriented analysis, design, and implementation,
    and intensify object-oriented concepts, e.g., through exercises from the learners’
    application context. Topics are identified in advance, together with learners
    and their superiors. Subsequent to classroom trainings, project coaching (also
    known as action-learning) is offered. During the coaching phase, learners apply
    their acquired knowledge and skills in a real-world project supported by experts.
    |

    | OO Designer (UML) | “OO Designer (UML)”, at the top level, adds certification
    of learning activities. During certification, the learner has to either solve
    a complex exercise together with a peer or work on a long-term project within
    a team. Results are presented to and discussed with the tutors. Certification
    topics belong to the daily working routine of the learners. |


    to the learners. In the first phase, the educational program is designed and organized,
    integrating a detailed analysis of the learner’s skills, educational needs, and
    learning environment. The method used to analyze these fields is the skill profiling
    and analysis method “QUALISEM-People”(de Haan, Waterson, Trapp & Pfahl, 2003),
    which assures that the content and instructional strategy of the program are defined
    based on objective information. This aims at increasing the acceptance level and
    thus the effectiveness of the learning program by satisfying objectively identified
    training needs. In the second phase, the educational program is launched. It starts
    with a kick-off workshop, which aims at learners as well as tutors getting to
    know each other and at explaining the organization of the program to the learners.
    This is followed by the online phase, in which the learners work with a Web-based
    training course of the UML


    Basis or the UML Personal level. The goal of the online learning phase is to reach
    an equal level of knowledge regarding the UML notation. This is a prerequisite
    for efficient teaching sessions in the subsequent classroom trainings, because
    the trainer can then concentrate on providing detailed advanced knowledge, such
    as object-oriented analysis, design, and programming from the product level OO
    Practitioner (UML). In the third phase, the knowledge acquired is transferred
    into practice. That is, the learners perform an object-oriented software development
    project. The tutors, now acting as coaches, support them in their efforts following
    the principles of scaffolding und fading. Eventually, the acquired knowledge is
    certified as having reached the highest product and thus education level OO Designer
    (UML).'
