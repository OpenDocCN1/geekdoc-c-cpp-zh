  md: '# About the Contributors


    **Heidi J. C. Ellis** is an assistant professor in the Computer Science Department
    at Trinity College, Hartford, CT. Dr. Ellis is a member of the IEEE Computer Society
    and the IEEE Education Society and has been involved in the development of the
    Computer Society’s Certified Software Development Professional exam. Dr. Ellis
    is currently involved in the Trinity humanitarian free and open source (H-FOSS)
    effort. She is also a member of the CONNJUR project, an open source integration
    environment for biomolecular NMR data analysis developed collaboratively with
    Dr. Michael Gryk at the University of Connecticut Health Center. Dr. Ellis’ research
    interests include software engineering education, technology for learning and
    teaching, and tools for biological data processing and analysis. Professor Ellis
    graduated from the University of Connecticut in 1995 with a PhD in computer science
    and engineering with a focus on software engineering.


    **Steven A. Demurjian** is a full professor of computer science & engineering
    at the University of Connecticut. Dr. Demurjian is a member of ACM, IEEE Computer
    Society, IFIP WG11.3 on Database Security, and was elected in 2007 as a member
    of the Connecticut Academy of Science & Engineering. Dr. Demurjian’s research
    interests include: UML extensions for role-based (RBAC) and mandatory (MAC) access
    control with assurance and automatic generation of aspect-oriented software for
    security enforcement, RBAC and MAC models and security solutions for assurance
    in web-based and distributed computing environments, and design/code level reusability
    and refactoring for component-based systems. Dr. Demurjian has over 120 archival
    publications (book, journal articles, book chapters, and conference/workshop articles).
    Dr. Demurjian graduated from The Ohio State University in 1987 with a PhD in Computer
    and Information Sciences with a focus on database models and systems.


    **J. Fernando Naveda** is co-founder and chair of the department of software engineering
    at Rochester Institute of Technology (RIT), where he has been since 1993. In 1986
    he earned a PhD in computer science from the University of Minnesota, Twin Cities;
    and a bachelor’s degree in computer systems engineering from Instituto Tecnológico
    y de Estudios Superiores de Monterrey, México, in 1975. In 1990 he was a visiting
    scientist at the Software Engineering Institute. An active member and volunteer
    with the IEEE Computer Society, Naveda currently serves as the vice-chair in the
    Educational Activities Board. He is the co-editor of the volume *IEEE Computer
    Society Real-World Software Engineering Problems – A Self-Study Guide for Today’s
    Software Professional.*


    * * *'
