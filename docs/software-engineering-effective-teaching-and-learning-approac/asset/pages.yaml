  md: 'these instances, teams may be required to sign non-disclosure agreements and
    to keep in-progress work products securely under lock-and-key. Some of us do not
    mind constraints of this type, while others have avoided such situations.


    A key issue that must be discussed with the client is post-delivery maintenance
    of software produced by student teams. Part of managing client expectations is
    to explain the likelihood that maintenance will be necessary in the future and
    to consider who will be responsible. In some cases, the client’s organization
    assumes this responsibility. For example, the client for a Website developed for
    a Chinese charity was a former teaching assistant from the instructor’s database
    course. For this project, the former TA was capable and willing to maintain the
    product after it was developed by the student team. Another solution is to have
    future student teams do maintenance, possibly as a part of their regularly scheduled
    project work. One of us has arranged to have maintenance tasks on past projects
    completed by students enrolled in independent study and student workers supported
    by a related grant. In other situations, all future maintenance will be the responsibility
    of a separate organization. Sun and Decker (2004) discuss tradeoffs among various
    options for who should handle maintenance, for example, the current team, a future
    team, or a separate support mechanism such as the client’s IT organization. At
    some of our institutions, the IT department has been willing to maintain Websites
    developed for clients at the institution if the product was developed using COTS
    products already in use and if, in addition, testing shows that the product is
    of sufficient quality.


    In some cases, a client proposes a project that is to be developed by multiple
    teams over multiple semesters. Each semester, one or more teams works to develop
    and deliver a component or increment of the project, which is then used as a foundation
    for a later class. Werner and MacLean (2006) describe one such project, a community
    service project that was expanded over 5 semesters. One of us has experience with
    this in industry, where a company took a very methodical approach to having teams
    successively build up a complex project over several semesters. Another one of
    us has experienced this with several clients from educational settings. For example,
    one project, which was designed to help young children explore mathematical concepts
    such as combinatorics and recursion, was expanded and improved over seven semesters
