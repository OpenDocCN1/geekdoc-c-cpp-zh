- pgno: 388
  md: 'for Information and Research, 2003) and the one developed by the French IT
    industry organization CIGREF (Club Informatique des Grandes Entreprises Françaises,
    2006).


    # sUMMARY AND FUTURE TRENDs


    It is increasingly clear that software engineering professionals (and more generally
    information technology professionals) need professional credentials that are not
    tied to a particular manufacturer’s products. Several different approaches to
    such credentials are possible.


    Professional licensure or chartered status builds on a model that is well established
    in other professions. In this approach, a government awards or approves the award
    of a professional status to an individual, and this status carries rights and
    privileges established in law. In the United States, this is only available to
    software engineers in Texas, and it doesn’t seem likely to spread quickly to other
    states. In Canada, this status is more easily obtained. In the United Kingdom
    and Australia, chartered status for software and/or information technology professionals
    has been successfully modeled on chartered status for engineers. It seems unlikely
    that this model will spread to many other countries.


    Broad-based professional certifications are generally awarded by professional
    societies. These certification schemes are based on established bodies of knowledge
    and conform to an international standard for the operation of certification schemes.
    Such schemes have been established and successful for many years in other professional
    disciplines. They are relatively new to software engineering, but based on the
    experience of other disciplines, it can be expected that they will gradually come
    to play a significant role in demonstrating the professional competence of a software
    engineer. The popularity and portability of these certification schemes will be
    aided by the emergence of an international standard.


    National examinations also have a role to play in demonstrating the competence
    of information technology professionals. They are most important in Japan, where
    such examinations have been offered for decades to millions of aspiring professionals.
    Japan offers its examinations in many Asian countries, and mutual recognition
    agreements are in place. Outside of Asia, national examinations play a smaller
    role, typically as a way of demonstrating competence for information technology
    professionals who cannot demonstrate appropriate academic experience.


    Job frameworks are yet another way to demonstrate the competence of information
    technology professionals. They are particularly popular in Europe, where the European
    Union is working to develop a meta-framework that can serve as a regional standard
    against which national frameworks can be measured.


    The importance of information and software technologies to society today is certain
    to expand still further in the future. Under these circumstances, it is likely
    that all of the approaches to professional certifications described above will
    continue to increase in popularity and acceptance.


    # ACkNOWLEDGMENT


    I would like to thank the following individuals for the information they provided
    on software engineering credentialing efforts in Europe, Australia, and Japan:
    Juan Garbajosa, Bob Hart, Bernd Hindel, Hiroshi Mukaiyama.


