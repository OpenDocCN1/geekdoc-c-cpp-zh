  md: 'and persuasion” (Fulmer, 1992). The skills that Fulmer describes are clearly
    rhetorical skills.


    Two reported deficiencies of case studies are their lack of immediacy and their
    failure to present compelling, realistic situations (Gale, 1993). While acknowledging
    the importance of case studies in pre-professional communications programs, Dorn’s
    analysis of case studies from business education (Dorn, 1999) finds that case-based
    instruction may be of limited usefulness in the workplace: “[the cases] typically
    require students to respond to exceptional rhetorical situations when in reality
    the rhetorical situations writers usually face require more mundane and standardized
    types of discourse”. For example, a common case study in technical communication
    focuses on the communication failures that led to the destruction of the space
    shuttle *Challenger* in 1986. While this is surely a compelling story, the circumstances
    are not likely to be encountered by many entry-level employees. Below, we describe
    a means to overcome these difficulties to create interesting cases that reflect
    the processes of undergraduate student projects.


    # CREATING THE CASES


    The case studies we have assembled draw from ethnography and rhetoric—fields closely
    allied with technical communication. Here we explain how we found rich stories
    of communication close to home, and how we gathered and composed them.


    # Locating the source


    The goal of building case studies for use in teaching is often hampered by the
    secrecy surrounding most software development. While many of our students and
    most of our faculty have had experiences in industry- or government-sponsored
    development, the proprietary nature of this information has typically prevented
    them


    from sharing their experiences. We do, however, have one valuable and readily
    available source: the students themselves. All Software Engineering students take
    the “Senior Design Project” capstone course. In this course, senior students develop
    real, practical software products intended for actual use in accordance with requirements
    from real clients and other stakeholders. These projects typically involve interaction
    with clients outside of the Computer Science department. The cases presenting
    these projects provide compelling, problematic examples of communication, and
    students can identify with them since they are grounded in the real experiences
    of fellow students.


    # Applying Ethnography to the Educational sphere


    Ethnography, as Beverly Moss explains, is “a qualitative research method that
    allows a researcher to gain a comprehensive view of the social interactions, behaviors,
    and beliefs of a community or social group. In other words, the goal…is to study,
    explore, and describe a group’s culture” (Moss, 1992). We used some proven techniques
    from ethnography to create views of real software development settings. Our case
    studies, however, should not be mistaken for true ethnographical studies; since
    our resources were limited, we could not perform the years of fieldwork required
    of such endeavors.


    Our method followed a qualitative case study approach, which attempts to “identify
    the important aspects or variables of the phenomenon” chosen for examination by
    “closely studying individuals, small groups, or whole environments” with the aim
    to identify avenues for further research (Lauer & Asher, 1988). In our work, that
    further research included the development of case studies based on our observations,
    and presented to other students as a means of simulating the conditions they will
    encounter later in their careers in computer science.'
