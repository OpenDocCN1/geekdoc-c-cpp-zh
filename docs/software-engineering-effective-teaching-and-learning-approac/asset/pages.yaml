    development. This is also a significant source of external expertise that can
    be used to help validate the program, such as a ‘blue-ribbon’ or other external
    panel that can validate or provide guidance to program development.


    In our case, finding help in the form of the Working Group on Software Engineering
    and Education, and the more recent Software Engineering Program Leaders Association
    (SEPLA) proved to be extremely useful for helping find and share materials to
    explain the SE profession to various constituents (faculty, students, administrators),
    as well as provide useful market data and comparison programs. Various SEPLA members
    also volunteered, and provided input on various program proposals. The SEPLA listserv
    is available at sepla@listserv.butler.edu.


    In our experience, the faculty development wherein we used authoritative guidelines
    to


    define Software Engineering for ourselves was absolutely essential. The need for
    this education came initially in response to addressing our organization issues.
    Our Accreditation goal dictated that ABET criteria needed to be considered, but
    the more extensive international guidelines (SWEBOK and SE2004) were more informative.
    The process of blending these viewpoints helped establish detailed ‘requirements’
    for our BSSE program, as well as establish agreement on these requirements. This
    analysis work was crucial to the success of the program proposal process, and
    became central to developing the program outcomes, expectations, and ultimately
    its detailed design. Our particular blending is summarized in the Defining the
    BSSE Graduate and the What Software Engineers Need to Know sections that follow.'
