  md: 'Masters track at the University of West Florida (Wilde et. al, 2003).


    The Software Development Studio at CMU (Tomayko 1996) is a seminal program in
    project-oriented software coursework. The Studio puts graduate students in a terminal
    degree program through a multi-semester project experience covering the full range
    of software process activities. The Studio motivated a precursor to the Enterprise
    called the Software Factory (Tvedt, Tesoriero, & Gary, 2001), which emphasized
    project engagement throughout the entire undergraduate experience. The Software
    Enterprise shares the multi-semester approach with an emphasis on soft-skill development
    with the Studio. The Enterprise, however, introduces the software phases in reverse
    order, and emphasizes soft-skills development through multi-year structured student
    collaborations. The Enterprise also introduces the sequence in the undergraduate,
    not graduate, program.


    The reverse ordering of the process phases is also introduced by the Software
    Development Laboratory at MSOE. Sebern (Sebern 2002) acknowledges the difficulty
    newer students have grasping process and soft-skills concepts, and therefore students
    are led from “grave to cradle” through process phases. Unfortunately a further
    description of the utility of this approach is not provided. Sebern also discusses
    the issue of student turnover, or project continuity, and describes a pre-course
    for seniors preparing them for the project sequence. This course includes mentoring
    activities from project enrollees, shared advice on the project, and basic skills
    preparation. This is a model we are looking to replicate in our Year 1, first
    semester Tools offering.


    (Umphress, Hendrix, & Cross, 2002) articulate the motivation for using the Capstone
    as a teaching and learning experience instead of a summative experience: “...Instructors
    expect them to integrate the technical skills they’ve learned in previous courses,
    learn to work synergistically as a team, plan and track their work, satisfy their
    customer – and produce sound software. Yet,


    more often than not, projects so framed teach their participants yet another way
    not to develop software.” We agree wholeheartedly. Further, our initial iterations
    of the Enterprise encountered some of the same concerns described in the paper
    – balancing workload, scaling of skills sets, responsibilities within a team –
    to which we responded by tightening certain parts of the process while leaving
    others intentionally open-ended. The result is our iteration-oriented RUP meta-model
    incorporating best practices along the way. This paper also influenced our thinking
    around using a process-oriented grading approach instead of a product-oriented
    one.


    The University of West Florida project (Wilde et. al, 2003) was also influential
    in our thinking in that it emphasized software evolution as well as software process.
    The authors make a strong argument that it is difficult to learn concepts in evolution
    without putting them into practice, thereby applying that classroom-oriented instruction
    in these concepts will not necessarily translate to their successful implementation
    in a Capstone project. In other words, the only option here is to immediately
    apply the concepts in order to ground them. This is part of the foundation for
    our reasoning for the iterative delivery model in Figure 2. We wish however, that
    the authors also applied this approach to management topics, where instead they
    implemented a seminar-style format. In the Enterprise, management concepts are
    also introduced using the same pedagogical model, which is very effective in showing
    the value of these tools (work breakdown structures, critical path analysis, earned-value
    analysis, etc.).


    Again, these are only a small cross-section of the large body of work now available
    on Capstone project implementations in software engineering. To a certain extent
    the Enterprise contributes its voice to the debates about the logistics of running
    such courses. On a larger level, the community now seems headed toward a larger
    discussion on the impact of software engineering education, what it is, where
    it has failed expectations, and'
