- pgno: 352
  md: '# CONCLUSION


    This article does not address the relative merits of the education provided by
    a traditional Computer Science program compared with a Software Engineering program.
    It does seem that there is a need to provide the type of Software Engineering
    curriculum discussed in the article and that the curriculum can be provided along
    with, rather than instead of, a more traditional Computer Science curriculum.
    Programs have been and can be introduced at institutions with diverse size, diverse
    overall focus, diverse program style, and diverse strengths.


    This article discusses many items to consider in the process of planning and launching
    a new BSSE program. Further, obtaining program accreditation is highly desirable,
    in some cases necessary. Understanding the steps required by the appropriate accrediting
    body to obtain accreditation is mandatory at some point in the program’s lifecycle.
    Understanding the steps very early and accounting for them during program planning
    will help smooth the journey to accreditation.


    # REFERENCES


    ABET Engineering Accreditation Commission (EAC) (2005). Criteria for Accrediting
    Engineering Programs, Effective for Evaluations during the 2006-7 Accreditation
    Cycle. Baltimore, MD. Retrieved May 28, 2007, from http://www.abet.org/forms.shtml.


    ABET (2006). List of Accredited Programs in Software Engineering, October 1, 2006.
    Retrieved May 28, 2007, from http://www.abet.org/ABETWebsite.asp#area


    ABET (2007). Home Page, Retrieved May 28, 2007, from http://www.abet.org/index.shtml


    Abran, A., & Moore, J. (Eds.). (2004). Guide to the Software Engineering Body
    of Knowledge,


