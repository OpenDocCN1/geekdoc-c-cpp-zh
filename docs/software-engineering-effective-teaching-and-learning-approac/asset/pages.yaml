  md: 'of interaction and the number of teams. On the other hand, larger teams can
    require more work because of the need to manage and coordinate subteams (although
    in some circumstances, the teams themselves can take on much of this responsibility).
    In the end, the choice of team size depends on the goals of the RPRCC and the
    instructor’s level of experience and comfort, as well as the individual team members.


    # Assembling Teams


    Once team size is decided, the next issue is how to assemble teams. The major
    approaches are (1) the instructor assigns students to teams, (2) students form
    teams on their own, and (3) hybrid approaches that combine these two options.
    If students form their own teams, the instructor can vet each team to ensure an
    appropriate mix of skills, adjusting team composition if necessary. If the course
    is assigned teaching assistants, the TAs can be enlisted to propose a first cut
    at teams based on a pre-specified algorithm, with the instructor fine-tuning as
    needed. Cultural and language considerations can also play into team composition.
    For example, one of us who usually assigns teams has at times allowed self-selected
    teams that were totally Chinese, African, or Middle Eastern because it supported
    better communication among teams, a critical success factor. In this case, the
    teams were still required to balance team skills as described later in this section.


    In a multi-staged two-semester approach to team formation, smaller teams go through
    all the steps required to create a platform-specific design during the first semester,
    then during the second semester carry out implementation, testing, installation,
    and user training. In one RPRCC sequence that uses this approach, students who
    enroll in the first semester are not required to enroll in the second. Because
    enrollment usually drops significantly from the first semester to the second semester,
    the number of teams also drops from the first semester to the second semester.
    In


    most cases the projects that are carried through lose at least one or two team
    members between semesters, so some students must be reassigned to a new team.
    If a project has lost most of its team members, it is rarely carried through to
    the second semester. This potential outcome must be clearly explained up front
    to potential clients as part of expectations management.


    A key question regarding team formation is how soon after the semester begins
    they should be formed. We have found that it is wise to wait with team formation
    until course registration has stabilized, assuming that the end of the drop/add
    period is not too far beyond the start of the course. While forming teams earlier
    can enable teams to start their project(s) earlier, this may require additional
    work if students are allowed to add or drop the course in the first few weeks
    (a problem that is less likely to occur if the RPRCC is a required course).


    Once the work is underway, circumstances can arise well into the semester when
    it is necessary to realign teams, for example, if the institution allows late
    drops. Realignment can also be necessary if team members become uniformly dissatisfied
    with one team member’s behavior or performance. It is prudent to publish a procedure
    that teams can use to bring grievances before the instructor so students understand
    the consequences of removing a team member from a team. In our experience, however,
    teams are generally able to work out such issues on their own.


    # skills Needed within Teams


    A team must possess a number of skills in order to succeed on a software development
    project. Among these are inter-personal communication skills, writing skills,
    problem-solving skills (e.g., for analysis and design), and technology skills.
    Different individuals will bring different strengths to the team, in part due
    to inherent talents. However, students’ earlier experiences will also have a strong
    influence, for example, because of differ-'
