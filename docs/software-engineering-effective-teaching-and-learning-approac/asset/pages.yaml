  md: 'client, and either the instructor or the client can respond so that all team
    members see the answer. A benefit of written, as opposed to oral, progress reports
    is that they provide a chronological record of the entire project from beginning
    to end.


    Most of us require that all client meetings be documented in client meeting reports.
    These reports can be part of the progress reports or can be separate documents.
    Client meeting reports should capture points of discussion and any decisions made
    during the meeting.


    A requirements document is used to record the required features both of the product
    and, if specified by the client, of the process to be used in developing it. This
    document helps ensure that the right system is built. In some situations, some
    of us have allowed teams to forego a requirements document in favor of a well-documented
    GUI prototype.


    A design document shows the structure of the application to be built. This document
    typically describes the high-level (architectural) and low-level designs of the
    projected software and may include both platform-independent and platform-dependent
    models, perhaps documented as dataflow or UML diagrams.


    Prototyping allows students to explore alternative possibilities and learn to
    use new development tools. A prototype can focus on the entire product or on only
    a part, such as the GUI interface. Prototypes are often thrown away after the
    proposed product is better understood, but in some cases are given to the client
    to support work on future increments. The following quote from the original edition
    of Brooks’ classic The mythical man-month (1975) reflects this situation well:


    > In most projects, the first system built is barely usable. It may be too slow,
    too big, awkward in use or all three. There is no alternative but to start again,
    smarting but smarter, and build a redesigned version in which these problems are
    solved. ... Where a new system concept or new technology is used, one has to build
    a system to


    > throw away, for even the best planning is not so omniscient as to get it right
    the first time. The management question, therefore, is not whether to build a
    pilot system and throw it away. You will do that. The only question is whether
    to plan in advance to build a throwaway, or to promise to deliver the throwaway
    to customers... (p. 116)


    This is true of many student projects. As with real world clients, RPRCC clients
    often do not know what they want until they see it. Additionally, the technology
    used on a project might be new to both the client and the student team. Incremental
    prototypes can help the client better clarify project requirements and understand
    development options. Even if a team does not use the full prototyping approach,
    many software development process models encourage prototyping at various phases
    of the project. (Section 3.4 of Pressman (2005) gives a rationale for this type
    of iterative process.)


    Testing, verification, and validation are closely related tasks but treated very
    differently in different RPRCCs. For example, some of us require a comprehensive
    Verification and Validation Plan that describes and specifies the timing for reviews
    of all types of project artifacts and the tests to be carried out at each stage
    of the development life cycle. Others of us include only functionality test planning,
    particularly if the offering is early in the curriculum. The instructor must guide
    teams to develop test plans that are suitable for the goals of the course, yet
    sufficiently limited in scope that the tests can be completed in the time available.
    A simple form of test plan lists each test with a unique test number, a description
    of the test, and a description of the expected test results. Once a test has been
    conducted, students should record the results and compare them with the expected
    results to demonstrate that the application is working as expected. Some of us
    require teams to describe all verification and validation work, including the
    test results, in a separate Verification and Validation Report.'
