- pgno: 314
  md: 'The Telecommunications track prepares students to become specialists in telecommunications.
    Topics of study include networks, software systems security, and evaluation of
    telecommunications systems.


    The Embedded Systems track prepares students to become specialists in embedded
    systems development. Topics of study include specification and analysis of embedded
    real-time systems requirements, design and implementation of embedded real-time
    software systems, performance evaluation of embedded real-time software systems,
    and development of real-time components.


    The Information Management track prepares students to become chief information
    officers or specialists in information systems integration and development. Topics
    of study include information technology management, specification and analysis
    of information systems, evaluation of information systems, and development of
    information systems software components.


    # 2002 Curriculum Change


    In 2002, the only curriculum change was the addition of a new specialization track:
    the Management of Software Technology, offered in collaboration with the Monmouth
    University School of Business. The idea of this track grew out of the recognition
    that industry is outsourcing increasing amounts of software development. This
    track prepares students to be chief technology officers or specialists in the
    acquisition of software systems for businesses. Topics of study include assessing
    the impact that software can have on organizations, the development of requirements
    for system acquisition via purchase or outsourcing, the assessment of software
    technologies with regard to organizational needs, and implementing a controlled
    introduction of technology into an organization.


    All the knowledge areas of the Software Engineering Body of Knowledge (SWEBOK)


    project (Bourque, 2004) can be identified in this curriculum.


    # CONTINUOU s DEVELOPMENT OF COURs E CONTENT


    Technologically, the computing field has undergone significant changes that have
    forced alterations in the material taught within Software Engineering courses.
    Since the inception of our SE Master’s program, we have witnessed the widespread
    adoption of Object-Orientation (along with massive changes in techniques and methodologies),
    the phenomenal explosion of the World Wide Web, the emergence of Java, and the
    move of security requirements from corporate to consumer platforms, just to name
    a few of these changes. Therefore, the material covered within a curriculum that
    addresses the technological understanding required by professionals in this field,
    needs to be continuously updated over time.


    This problem emerges in several different forms. In particular,


    +   - Continuous course content changes


    +   - Dated textbooks


    +   - Operating system/programming language biases


    +   - Continuous development of course projects


    Each of these areas is discussed in greater detail in the paragraphs that follow.


    # Course Content Changes


    One can expect to have to revise course material every year. This is necessary
    to accommodate technological changes and to incorporate new industrial practices.
    For example, since the inception of our program we have changed the programming
    languages taught in class from Ada, to C++ and'
