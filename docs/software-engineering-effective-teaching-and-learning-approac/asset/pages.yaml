- pgno: 29
  md: '# Chapter I


    # Software Engineering Education:

    Past, Present, and Future


    **Gregory W. Hislop**

    *Drexel University, USA*


    # Abs TRACT


    *There is a strong and growing global demand for skilled software engineers. The
    institutions that educate software engineers are evolving and changing to meet
    this need. This chapter provides an overview of this effort to develop software
    engineering education. It discusses the historical development of software engineering
    education, provides some perspective on current status, and identifies some of
    the challenges faced by software engineering educators. The intended audience
    for this chapter is anyone interested in software engineering education who has
    not participated in the developments to the present time. The goal is to provide
    a summary background of how the discipline has evolved and pointers to key publications
    that are part of that history. Since this chapter surveys foundational topics
    in software engineering education, many of the topics touched on in this chapter
    are covered in more detail in other chapters of this volume.*


    # INTRODUCTION


    The demand for skilled software developers is growing at an extraordinary rate
    as software is being used in an ever widening set of domains. The increase in
    the use of the internet, the phenomenal rate of growth of available data, and
    new developments such as biosensors, grid computing, and cognitive machines require
    software engineers who can correctly engineer and modify these kinds of systems
    within budget and at a reason-


    able cost. As a result, educational institutions are under increasing pressure
    to produce educated and capable software engineers. However, educational institutions
    face many challenges in producing these software engineers that extend far beyond
    curriculum issues. Software engineering is still a discipline trying to define
    itself and find a place among the set of computing and engineering disciplines.
    As such, this chapter will address a mix of issues related to three themes:'
