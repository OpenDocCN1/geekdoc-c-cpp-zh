  md: '# EXAMPLE: THE sEAbAsE CAsE sTUDY


    We present examples of material from the “Seabase” case study, where Senior Design
    students (called the “CS team”) worked with faculty and students in Mechanical
    Engineering to develop control software for a ship-based crane. The communication
    challenges in the project were significant: students had to learn the culture
    of mechanical engineers, as well as a new programming language, Matlab. As newcomers
    to a project that was already underway, they had to find their place in an established
    work environment that was foreign to them.


    An excerpt from the Module C story is shown in Figure 1. The story document includes
    hyperlinks to three primary sources: the meeting minutes for the project team
    leaders, the risk document of the team, and email from a project advisor in Mechanical
    Engineering. The email reveals an interesting problem for the CS team: communications
    from the Mechanical Engineering faculty members that indicates differing expectations
    in what the challenging aspect of the project will be. Here, advisor Hank Taylor
    indicates that “the crane [controller] part is the ‘biggest, nastiest’ part” and
    a side project to design a GUI for the crane controller is “the easiest part.”


    In a meeting one week earlier, Nancy Smith had stated the opposite: “The GUI design
    is a good project for the CS team,” and “working on only the crane controller
    would be ‘too simple.’” The questions (shown in Figure 2) and instructor notes
    challenge the readers to use problem solving to resolve this disparity.


    Figure 3 includes an excerpt from the Module E story that illustrates the notion
    of communication cycles. Two meetings occur in short order: first, an informal
    meeting of the team in which they prepare questions for Hank Taylor; then the
    meeting with Hank. There is a three-step process, in which the students formulate
    the questions, pose them, and finally unpack the answers later in Module F.


    The Module E questions (shown in Figure 4) ask the readers to evaluate the effectiveness
    of this process: to what extent the students were able to articulate their needs
    and interpret Hank’s responses. There are other links with wider scope. For instance,
    after listening to the discussion of the code from the model crane, the readers
    are asked to go back to documentation of this code that had been circulated earlier,
    and determine


    Figure 1. Excerpt from Module C Story, Seabase case study


    # Module C Story


    On Wednesday of the fourth week of the semester (Sept. 22) the leaders of the
    three crane project teams meet with Hank Taylor and Nancy Smith. They decide that
    since the “point of meeting is to get regular coordination of the teams, they
    will continue the meeting of team leaders on Wednesday from 12-1 on”. Representing
    the CS Team are JoAnn, Ken and Bob; Matt and Ben come for the crane builders;
    and Jon is there to talk about the platform.


    Minutes of Sept. 22 Crane Team Leaders meeting


    The items on JoAnn’s summary of the meeting are:


    +   - The CS Team will work on crane, not on the platform, this term.

    +   - In a discussion of scope of the CS Team’s part, Hank says the crane part
