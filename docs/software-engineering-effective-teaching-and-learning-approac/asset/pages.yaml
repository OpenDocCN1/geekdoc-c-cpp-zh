- pgno: 366
  md: 'The Killer Robot exercise has proved to be a success on almost every occasion
    we have run it - sometimes much to the surprise of the staff themselves. Even
    in cases where almost all the students have been from overseas countries we have
    found that they are willing to enter fully into the spirit of things. In fact
    some of the most animated interactions have occurred in such situations. However,
    again much depends on the staff motivating the students, encouraging diverse views,
    and keeping the trial progressing as an enjoyable and fun activity. The only start-up
    problem we encounter time and time again, when the case study is issued, is getting
    the students to understand that their group is NOT playing the allocated character
    they are playing the members of the prosecution and defence teams for that character.


    Obviously what can be achieved in the way of student interaction depends to a
    great extent on classroom situations. The arrangement at Sunderland is that all
    the students from different programmes undertaking one particular iteration of
    the module have lectures together. Since this can total well over one hundred
    students, any extended discussions can be somewhat limited within those sessions.
    Hence the interactive work must be mainly within the supporting tutorial sessions
    where there is typically one member


    of staff to 16/20 students. In many cases, due to rooming constraints, tutorial
    groups are doubled up with two members of staff and 35 to 40 students. However,
    we have found that this is a situation that can actually help discussions and
    interactions – the two members of staff can “play-off” against each other and
    this can encourage the students to become more involved. In situations where the
    total class size is much smaller a more interactive approach can be taken where
    the formal lecture sessions and the tutorials can blur together. We always try
    and adjust our approach so that it fits best with the total class size and the
    resources available (rooms and support staff).


    Wherever possible the tutorial sessions are for the students for one particular
    programme. This means that the discussions and considerations can be directed
    to address the particular challenges that exist within the relevant sphere of
    application. In such situations we can collect data from the Killer Robot Trial/Investigation
    that reflect the views of students on particular programs. Table 1 shows the data
    collected from one such set of trials. The figures reflect the levels of blame
    voted by students from six different MSc programmes. These figures can then be
