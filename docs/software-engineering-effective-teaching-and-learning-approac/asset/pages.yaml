- pgno: 230
  md: 'a web-based application for authors, reviewers, and editors to track submitted
    journal articles. In terms of innovation, hardware/software combination projects
    have included: an automatic mixing machine that used windshield wiper motors and
    PVC pipes controlled by a micro-processor and run via a web interface; a diagnostic
    system that ran on a laptop with a database and connected to a car’s serial port
    for real-time analysis of an automobile’s performance; model trains with embedded
    computers that support control and feedback sensors (termed digital trains) that
    are controllable through Java applications using serial connections; a multitude
    of single and multi-player web-based games; and robotics projects such as linking
    a robot to a PDA to a cell phone with a web-interface, and projects that link
    a robot with a web-controlled camera. What Doesn’t work: Teams that fail do so
    for a variety of reasons that are in part due to their project selection. One
    failure characterization that seems to dominate is when teams choose obscure or
    antiquated hardware where documentation or hardware support is unavailable or
    outside the students’ ability to acquire mastery over. For example, some team
    failures were attributed in part to their targeting of the Atari 800 computer
    platform. Other failures occurred when a team depended on the timing of commercial
    software releases that were promised by the company, but then didn’t occur (if
    they did at all) until there were only a few weeks left in the semester. Interestingly,
    projects undertaken by teams that succeed one semester can fail for teams undertaking
    the same project in the next semester, even when both the teams have similar skill
    sets. For example, the requirements for the previously mentioned digital train
    system were instructor provided, and the first team to undertake the project was
    quite successful. However, teams in subsequent semesters using the same digital
    train requirements were much less successful. In retrospect, the follow-on digital
    train teams tended to choose the project topic because the team was unable to
    come up with their own project idea. Overall, success and failure often seems
    to depend more on team member buy-in to the project idea, rather than on the particular
    skills of the team members.


    # Year-Long Capstone Design


    In many capstone-based software engineering courses, a two semester approach is
    promoted to provide adequate time for realistic experiences with the entire software
    engineering process (Bagert & Mengel, 2003; Clark, Davies & Skeers, 2005). In
    fact, at UConn and USNA, many of the non-computing engineering programs (e.g.,
    mechanical, chemical, etc.), have a history of year-long projects. As an experiment
    under a Spring/Fall cycle, a year long project was instituted at UConn. In the
    Spring semester, CSEYYY (a predecessor of CSE293) was split into two groups: one
    group did one semester projects as usual. The second group defined two-semester
    projects that would continue in a sequence with CSE293. For example, three of
    the six groups in CSEYYY continued on with their project in the subsequent Fall
    semester in CSE293. This required maintaining two separate schedules and milestones
    (for one semester vs. two semester groups) and also providing additional work
    for the two-semester groups so as to define a larger-scale project for the two-semester
    sequence. This issue was definitely in the Doesn’t work category at UConn; to
    say that it was a total failure would be an understatement. In Spring 2005, the
    three year-long groups had five, four, and four team members respectively. One
    group shrunk to two members who then switched projects. Another group, shrunk
    first from four to three members, and then to two over the last four weeks. The
    third group stayed intact, but had an overall implementation over the course of
    15 weeks that was only incrementally better than a one semester project. The final
    grades that the students earned were the lowest that the instructor has ever given
    in a project-based course over his career at UConn (20 years with 18 project courses).'
