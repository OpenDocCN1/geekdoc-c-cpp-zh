  md: '# Table 1. Illustrative example


    Step A: The question starts out as a preparation question for Lesson 4 – Software
    as a Product:


    Question formulation:


    1. Students are usually given a list of requirements and are asked to develop
    a software system that meets these requirements. This task may help you reveal
    some of the problems involved in defining software requirements. For this purpose,
    you are asked to assume that you are a customer who needs a software system for
    web-based surveys.

    First, determine the kind of business you have. Based on this decision, define
    your requirements for the web-based system. Write these requirements as would
    a person who is not a software developer.

    After you finish listing the requirements, analyze them:

    - What kinds of requirements did you list (user-oriented, technical-oriented,
    performance-oriented, others)?

    - Compare your list with real web-based survey tools. Can you use existing tools
    as a resource for gathering requirements?

    This exercise is important for at least two reasons. First, you may at some time
    be a customer of software systems and will have to define the requirements of
    the software systems you need. Second, as a software developer, when you have
    real customers, such an experience may help you see the situation from the customer’s
    point of view.

    2. Based on your experience in §1, explain why requirement changes are so predominant
    in software engineering.

    3. Data indicate that the percentage of software tools that actually meet customers’
    needs is relatively low. Based on your experience in §1, explain this phenomenon.


    Step B: The question continues as a summary question for Lesson 12 - Software
    as a Business:


    Question formulation:


    This question continues the task presented in Lesson 4 - Software as a Product,
    in which you were asked to list requirements for an application that supports
    on-line surveys.

    - Expand the requirements list you constructed for the on-line survey so that
    it also includes a means for e-commerce.

    - How might the addition of these requirements influence the development process
    of the on-line survey tool?


    In the second part of the task, the students are asked to expand the list that
    they originally generated. The idea is to illustrate that products can evolve
    in a gradual process, when customers either improve their understanding of their
    needs or when customer needs are expanded, and that additional features can be
    added to a software product as long as the development process supports the gradual
    addition of features. When the students add features, they are asked to analyze
    potential influences of this addition on the software development process.


    In summary, throughout this task, the students take the customer perspective,
    examine and expand their own requirements list, and analyze the connection between
    the process of requirement gathering and software development processes.


    It is reasonable to assume that such a collection of activities and perspectives
    that students take while working on this task, expand their perspective on software
    development processes in general, and increase their awareness of the human aspects
    of software engineering in particular.


