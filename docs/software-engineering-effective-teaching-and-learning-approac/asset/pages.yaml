  md: 'discussion of misuse cases, TROPOS (Giorgini, 2007), and goal-driven requirements
    engineering (KAOS) (De Landtsheer, 2005). In addition there is a case study based
    on the Common Criteria.


    Case studies for security requirements engineering and security engineering in
    general have been used at the International Institute of Information Technology,
    Hyderabad (Garg, 2006) as a means of bridging the industry/university gap.


    The Networked Systems and Survivability (NSS) program at the Software Engineering
    Institute has, over three academic semesters, experimented with a novel technique
    to educate students on the development of security requirements engineering for
    software systems (Mead, 2006). In three separate course projects, thirteen students
    gained hands-on experience through case studies involving real-world software
    development projects. We present an expanded discussion of these case studies
    below.


    A set of academic lectures has also been developed by the SEI for security requirements
    engineering and SQUARE. These are being piloted at University of Detroit Mercy
    and will be refined and made available to interested faculty elsewhere.


    # sQUARE CAsE sTUDIes


    Using the Security Quality Requirements Engineering methodology (Mead, 2005a),
    the students were able to understand the importance of security requirements in
    software systems, as well as to improve the security foundation of the client
    projects with which they worked. In each study, the students were graduate students
    at Carnegie Mellon University. All were enrolled in an information security oriented
    curriculum, although their primary focus varied between security technology and
    information security policy.


    # Case study selection Process


    The case study clients included industry and government projects. Specifically
    they included small to medium-size companies in the Pittsburgh area, a Department
    of Homeland Security project, and a Department of Defense project. Some of the
    considerations in project selection were (1) the ability to get access to key
    stakeholders in the organization, (2) projects that were a reasonable size for
    a one-semester project for a team of three to five students, (3) projects that
    were either new or major upgrades, although we did do some retrogressive analysis
    of existing projects, and (4) projects with a significant software development
    component. Note that clients were often concerned about the amount of time this
    would take, so we needed to be very sensitive to the need to manage meeting time
    and other client interactions. We also worked with a single point of contact on
    the client end so that we were not perceived as making constant demands on the
    time of large groups of staff members. We typically started with an overview briefing
    of the SQUARE process, identified key client participants, and then limited our
    interactions to only those participants until we were ready to report results.


    # Overview of the sQUARE Process


    Security Quality Requirements Engineering is a model developed at Carnegie Mellon
    University by Nancy Mead of the Software Engineering Institute. The motivation
    behind SQUARE is to see whether good requirements engineering processes can be
    adapted specifically to the problem of identifying security requirements. If this
    can be done successfully, organizations will have the ability to identify security
    requirements up front rather than as an afterthought. The SQUARE process provides
    a means for eliciting, categorizing, and prioritizing security requirements for
    information technology systems and applications. Note that while there is nothing
