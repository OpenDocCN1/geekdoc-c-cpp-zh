  md: '# APPENDIX A: TOP TWO LEVELs OF RPRCC TAXONOMY


    In this appendix we provide the top two levels of the current version of the draft
    RPRCC taxonomy. The taxonomy covers the large variety of issues relevant in Real
    Project for Real Client Courses (RPRCCs) and illustrates the potential diversity
    and robustness of RPRCCs. The taxonomy also demonstrates the broad set of issues
    that must be considered by any faculty member preparing to teach an RPRCC in order
    to tailor it to local needs and resource constraints.


    # I. COURSE


    +   1. Course Profile

    +   2. Professional topics covered in course

    +   3. Other activities for learning software engineering principles

    +   4. Course planning / flexibility ("reshuffling")

    +   5. Support materials

    +   6. Training students

    +   7. Additional staff

    +   8. Institutional memory

    +   9. Showcasing projects (completed or in process)

    +   10. Challenges

    +   11. Other


    # II. TEAM


    +   12. Team formation

    +   13. Team style / organization

    +   14. Matching teams with projects

    +   15. Team-building and defining team operations

    +   16. Communication considerations


    # III. CLIENT


    +   17. Sources of clients

    +   18. Client vetting by instructor

    +   19. Preparing clients for their role

    +   20. Legal issues


    # IV. PROJECT


    +   21. Project types

    +   22. Project vetting by instructor

    +   23. Project proposals

    +   24. Resource issues

    +   25. Process guideline

    +   26. Support tools

    +   27. Work products / deliverables

    +   28. Project-related activities

    +   29. Project planning and tracking

    +   30. Risk management of projects by students

    +   31. Students using data from projects


    # V. ASSESSMENT & EVALUATION


    +   32. Assessment during the academic term

    +   33. Formal assessment of final work products

    +   34. Evaluation of effectiveness and feedback on course'
