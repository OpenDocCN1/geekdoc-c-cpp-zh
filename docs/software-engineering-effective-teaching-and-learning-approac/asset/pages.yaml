- pgno: 232
  md: '# Assessment/Individual Contribution


    A delicate aspect of teaching CSE293 is the requirement for each team member to
    perform confidential self and team-member assessments. As noted by Chrisman and
    Beccue (1987), Scott, Bisland, Tiehenor, and Cross (1994) and Wilkins and Lawhead
    (2000), individually assessing students within team settings present difficult
    problems that can be further complicated by the need for instructor intervention
    to resolve intra-team disputes. Over the years, we have tried different approaches
    as given in Table 4.


    The first approach we tried, the “Letter Grade” technique from Table 4, resulted,
    with a few exceptions (less than seven out of more than 70 teams), in almost all
    students self-grading to an average of 90+ or higher for the semester and indicating
    that all team members deserve an A or A- at worst. This is often totally contrary
    to reality, particularly in terms of the grades that have been received by the
    students’ respective course projects. We believe that this is a result of students’
    perceptions that if they finish the course project and it more or less “works”,
    they deserve a high grade. A similar effect occurred when using the “Sums to One”
    approach in Table 4. Related examples occurred when each student was asked to
    identify his/her and teammates level of participation for each deliverable (e.g.,
    specification, design, etc.).


    Even though students are specifically told that not all students had to contribute
    equally to all deliverables, for four person teams, students usually indicated
    25% effort per person per deliverable, for five person teams, 20%, and so on.
    In a few cases, the assessments were lopsided. For example, we had a case where
    for a team of six, five students indicated that the sixth student did not contribute
    equally and deserved a low grade; refreshingly, that sixth student concurred!
    There have also been dysfunctional teams where every team member criticized a
    different team member as not contributing, and teams that complained that the
    leader was too controlling.


    Meaningful peer assessment has long been problematic in capstone courses. In efforts
    by Clark, et al. (2005), self and peer assessments were conducted in a formal
    business-oriented way with student supplied time sheets, detailed surveys, and
    grading formulas for instructors. In another effort (Ellis & Mitchell, 2004),
    surveys were used with the instructor making similar conclusions to our observations.
    In the following sections we discuss our approaches to strengthening the utility
    and impact of peer assessments.


    At USNA, we instituted the rubric shown in Table 5 in pursuit of what we termed
    a Peer-Assessment-Multiplier for awarding individual students grades for team
    projects. During these assessments, each student circles a rating to in-


    Table 4. Techniques for student assessments of self and team members


    | Description | Technique | Result |

    |---|---|---|

    | Letter Grade | Students assign a letter or numeric grade (0..100) to self and
    each of their teammates. | Unproductive. Almost all students self-graded to an
    average of 90+ or higher for the semester and indicated that all team members
    deserved an A or A- at worst |

    | Sums to One | Students assign a fraction to self and team members where the
    fractions must sum to one. | Unproductive. Almost all students self-graded to
    a .25 for four person teams, .20 for five person teams, etc. Same net effect as
    Letter Grade above. |

    | Descriptive Rubric | Students use a pre-defined descriptive rubric to assess
    self and team members. | Productive. Students rarely self-graded to a description
    that maximized their score, and few teams uniformly chose the highest descriptor
    for each team member. |'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'dicate the degree to which the evaluating student feels that each team member
    fulfilled his/her responsibilities in completing the team-oriented project assignments.
    Students were advised that their rating of their team members should reflect each
    individual’s level of participation, effort, and sense of responsibility, not
    his or her academic ability.


    Students were given the rubric at the beginning of the semester so they knew how
    they would be assessed by their peers, and that the instructors would assign weights
    to the various ratings (such as 100 for an Excellent rating, 90 for Very Good,
    etc). The students were told that their specific ratings of their team members
    would remain confidential, but that they would be advised of their averaged peer
    assessment by the instructor at about 4 week intervals throughout the course.
    This is another area in which larger team sizes (four to six) work better than
    smaller team sizes (two to three), as it is more difficult to ensure such confidentiality
    within small teams. For even larger teams (more than six) we have found that students
    bring in additional influences that tend to reduce the utility of peer assessments.
    For ex-


    ample, on the multi-disciplinary UAV and AUV teams discussed above, students from
    the same major tended to grade their fellow majors higher, primarily because they
    knew them better from having taken earlier classes together and they could better
    relate to the quality of the work done by students of the same major. With team
    sizes of four to six, we observed that there were generally less opportunities
    for such external influences to skew the peer assessments because the teams were
    comprised of either all the same major, or there were not enough students from
    each major to unduly the peer assessments.


    In all cases, what noticeably improved the usefulness of the peer assessments
    was when we began informing the students that their own team-generated individual
    peer evaluation, as compared to their teams overall peer evaluation average, would
    impact each student’s recorded team project grade. Our intentions were to use
    the peer assessment to award additional points to a team member whose peers felt
    was doing excellent work, and penalize poorly performing team members. For example,
    assume a team of four in which one team member’s peer assess-


    Table 5. Rubric for student assessments of self and team members


    | Rating | Description |

    |---|---|

    | Excellent | Consistently went above and beyond the call; nurtured teammates;
    routinely did far more than his/her assigned team responsibilities. |

    | Very Good | Always did what he/she was supposed to do; very well prepared and
    very cooperative. |

    | Good | Mostly did what he/she was supposed to do; acceptably prepared and cooperative.
    |

    | Satisfactory | More often than not did what he/she was supposed to do, no more,
    no less; minimally prepared and cooperative. |

    | Marginal | Sometimes failed to show up or complete assignments w/o valid reasons;
    rarely prepared. |

    | Deficient | Often failed to show up or complete assignments w/o valid reasons;
    rarely prepared. |

    | Grossly Unsat | Consistently failed to show up or complete assignments w/o valid
    reasons, unprepared. |'
