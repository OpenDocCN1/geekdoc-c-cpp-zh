    # Faculty Perspective and Logistical Issues


    This section covers many of the important logistical considerations faculty face
    in the Software Enterprise.


    # Selecting a Process Lifecycle Model


    The Software Enterprise uses a process meta-model to constrain process planning
    and process lifecycle model execution. The Software Enterprise constrains projects
    to use one process meta-model (a higher-order process model that may incorporate
    specific lifecycle models and process practices). This keeps major release points
    in synch across teams, and provides a basis for a higher-level of decision-making
    than exercised by projects constrained to a specific process lifecycle model.
    Process meta-models considered were the Personal/Team Software Process (PSP/TSP)
    (Humphrey 1997; Humphrey 2000), Agile methods specifically extreme programming
    (XP) (Beck 2000) the Rational Unified Process (RUP) (Krutchen 2000), and the Spiral/Theory-W
    model (Boehm et. al. 1998).


    Our decision was to use the RUP as the process meta-model for the Software Enterprise.
    We do incorporate aspects of the Win-Win Spiral model where relevant, such as
    risk analysis, risk management, phase boundary planning, prototyping, and negotiation.
    Though “borrowing” activities from the Spiral model, the RUP model is used due
    to current tool support, availability of texts and other supporting materials,
    definition of a collaborative model with team roles, and inclu-


    sion of a Transition (deployment) phase. It also helps that RUP’s four phases
    line up better on semester boundaries than the reentrant nature of the Spiral
    model.


    We decided against using Agile/XP methods at the process meta-model level. Logistically,
    students do not spend enough time on a single course to allow for the daily interactions
    needed for XP (Umphress, Hendrix, & Cross, 2002). More importantly, there is too
    much of a reliance on experience and constant integration to provide a suitable
    framework for student learning of software engineering in a project setting. Stated
    another way, many XP projects are successful due to the ability and experience
    of the engineers involved and their proximity to constantly collaborate. Students
    simply do not have the skill level or the consistent schedule needed to be successful
    with an Agile meta-model. However, many Agile methods, specifically XP, are very
    helpful in identifying practices useful during software construction, and we incorporate
    problem-centered learning modules based on these practices during the second semester
    (Construction & Transition) of the Enterprise sequence. Useful XP practices include
    refactoring, test-driven development, pair programming, metrics for evolution,
    configuration management, customer walkthroughs, frequent integration, and estimating
    velocity.


    We also decided not to use the PSP/TSP at the software lifecycle level. After
    reviewing the textbook materials (Humphrey 1997; Humphrey 2000) and online materials
    (Carnegie Mellon 2005) for these processes and reviewing the literature for examples
    of their application for software engineering education (Borstler et. al. 2002;
    Hilburn & Humphrey, 2002; Sebern 2005), we considered them simply too burdensome
    to introduce at the lifecycle model level. The PSP/TSP lacks the flexibility of
    RUP and the Spiral model at the process meta-level. In addition, the method for
    employing it implies a take-it-or-leave-it approach. Because we could not decouple
    PSP/TSP activities from each other cleanly, we also did not employ indi-'
