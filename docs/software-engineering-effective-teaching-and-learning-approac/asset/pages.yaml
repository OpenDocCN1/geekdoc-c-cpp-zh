- pgno: 272
  md: 'despite their names, XMLUnit and HttpUnit are not unit testing tools but functional
    testing tools; nevertheless the “unit” prefix is an easy way to make these tools
    easily recognizable as belonging to the JUnit family. In one hand HttpUnit simplifies
    the interaction with a Web application by hiding all the HTTP protocol details
    from the developer. This tool basically emulates the functionality of a Web browser
    allowing the test code to navigate a Web application and retrieve its contents
    as a user would do by clicking links and reviewing documents using a conventional
    Web browser and the mouse. Once the test code is able to retrieve documents from
    the system, the next step is to validate the contents and structure of the documents
    retrieved to ensure they follow the specification contained in the Software Requirements
    Document. For this purpose, HttpUnit can be used in combination of XmlUnit. While
    the former is able to parse and validate the contents of HTML documents (like
    the title of the page, tables and forms present in it and even the correctness
    of the script code) the later is able to do XML documents validation.


    Another interesting point when making functional tests is the possibility of allowing
    multiple failures, i.e. to allow more than one assert method to fail inside the
    same test method. JUnit typically stops the execution of a test method and continues
    with the execution of the next one when the first failure occurs. While this is
    convenient in the particular case of unit testing, in which after a failure happens
    the state of the object under test is potentially unpredictable, in functional
    tests is common to design a test case so it carries out a set of higher level
    operations that are often uncorrelated. In these cases, one failure may not affect
    the normal execution of the following operations and, since functional testing
    is usually a very time-consuming task, to be able to continue the testing process
    can save a lot of execution time. There is a specifically designed tool to overcome
    this drawback of JUnit when applied to functional


    tests, its name is JFunc and was also incorporated to the testing environment.


    In the following points we summarize some interesting issues we have observed
    during the three academic years the course have been held.


    +   - The process of incorporating functional testing tools to the course involves
    a relatively long learning curve if is not accompanied by the adequate examples
    and instruction.

    +   - Once the tools are effectively applied to the functional testing process,
    students realize the simplicity of the test code produced and the extensibility
    and generality of the solution. After an initial guided research effort followed
    by a posterior independent research effort, they incorporate to their curriculum
    a set of state-of-the-art functional testing tools that clearly improve the quality
    and the level of automation of the tests, as well as are very helpful in regression.

    +   - Sometimes students need extra support to distinguish between the aspects
    of a Web document that must be tested and those that must not. While the contents
    and organization of the information contained are important, aspects like presentation
    and Web design elements are obviously out of the scope.

    +   - The system to test produces dynamic documents, this is an interesting point
    because some dynamic contents we deliberately included, like time-stamps or auto-increment
    values, are by nature nearly impossible to test. In these cases, students are
    instructed to eliminate the validation of those values from the overall contents
    validation process.


    # Taking Advantage of Software Management Configuration Tools (SMC Tools)


    Nowadays SMC tools are essential to track the evolution of the software under
    development and also represent the basic support for the collaborative work model
    of every software development'
