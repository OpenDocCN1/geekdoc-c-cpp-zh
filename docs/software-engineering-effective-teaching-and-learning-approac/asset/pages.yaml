    engineering courses in these programs usually ranges from six to twelve. Typically
    those courses cover 50% to 80% of the topics specified in the referenced documents.


    While the program criteria do require breadth and depth of software engineering
    content, it is not necessary that these topics be covered in specific “software
    engineering” courses. However, if this content is embedded in other (e. g., computer
    science) courses it must be very clear from the course syllabi and from the work
