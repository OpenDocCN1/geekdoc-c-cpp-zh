- pgno: 362
  md: '+   - The creation in 1993 of the ACM and IEEE-CS Joint Steering Committee
    for “The Establishment of Software Engineering as a Profession” and the creation
    of task forces to address: Body of Knowledge and Recommended Practices, Ethics
    and Professional Practices, and Education. (ACM & IEEE-CS, 1999a).

    +   - The 1998 further formal co-operation with the creation of Software Engineering
    Coordinating Committee (SWECC) (ACM & IEEE-CS, 1999b)

    +   - The publication in 1999 of the Software Engineering Code of Ethics and Professional
    Practice (SECEPP, 1999).

    +   - A revision of The Texas Engineering Practice Act that came into operation
    on January 1st 1999 (Texas Board of Professional Engineers, 1999) and which allowed
    the recognition of Software Engineering as a distinct engineering discipline and
    hence the licensing of such engineers.

    +   - The withdrawal of the ACM from SWECC over the issue of licensing (ACM, 2000).

    +   - The eventual publication in 2004 of “Guide to the Software Engineering Body
    of Knowledge” (SWEBOK) (Bourque & Dupuis, 2004) under the auspices of the IEEE
    Computer Society alone.

    +   - The 2004 publication of the curriculum document “Software Engineering 2004,
    Curriculum Guidelines for Undergraduate Degree Programs in Software Engineering”
    (IEEE-CS & ACM, 2004) under the auspices of both organisations.

    +   - The IEEE Computer Society’s own effort to offer Certified Software Development
    Professional (CSPD) designation (Engel, 2006). This involves passing an examination
    that in turn is related to the SWEBOK.


    This somewhat erratic progress can be used to develop classroom discussions and
    examine the motivators behind what has happened.


    We also make clear that there are different models for regulating professional
    practices either by licensing or certification where:


    +   - Licensing – is a mandatory process administered by a government authority

    +   - Certification – is a voluntary process administered by the profession itself.


    Again these can lead to discussions on the pros and cons of each model.


    # The IFIP Professional standards Framework


    We use the development of the IFIP Professional Standards framework (Mitchell,
    Juliff, & Turner, 1998) as an example of international cooperation and we highlight
    how, with regard to Software Engineering, the efforts by the ACM and IEEE-CS together
    or alone are populating the IFIP framework that consists of:


    +   - Ethics of professional practice,

    +   - Established body of knowledge,

    +   - Education and training,

    +   - Professional experience,

    +   - Best practice and proven methodologies, and

    +   - Maintenance of competence.


    For example, both the SWEBOK and the Body of Knowledge defined within the Software
    Engineering 2004 curriculum document support the second element of the IFIP framework.


    We also emphasise, as detailed in the IFIP Professional Standards document, the
    claimed benefits for internationally recognised standards (Mitchell, Juliff, &
    Turner, 1998):


    +   - The public is assured that safety or economically critical work is performed
    by competent individuals regardless of where in the world'
