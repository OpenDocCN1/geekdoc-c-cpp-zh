  md: 'to examine the situation and approve the ejection as appropriate, in which
    case the individual will be responsible for completing his or her own project.


    +   3. Relapse Memo. If the individual temporarily corrects the lack of responsibility
    but then again relapses into being a nonfunctioning team member, no additional
    warning memos are necessary. The team may immediately follow the ejection memo
    steps delineated above.


    We have used the above Regulations for Ejecting Nonfunctioning Team Members for
    over 50 teams with very good results. Cases in which the instructor had to step
    in as an arbitrator were greatly reduced, from a few every semester or so, down
    to the point where virtually no arbitration was required with the regulations
    in effect. In total, there were just four cases of warning memos being routed,
    with one of those cases continuing on to the ejection memo stage. The Regulations
    for Ejecting Nonfunctioning Team Members technique falls squarely into the Works
    category. Our approach encourages teams to resolve minor disputes at an appropriately
    low level, improves team communication, and encourages team members to actively
    participate in their team’s project.


    # FUTURE TRENDs


    Future trends in software engineering focus at the discipline, program, and instructor
    levels. Software engineering education is being influenced on both a national
    and international level by many different efforts. ABET has currently accredited
    13 software engineering programs that meet its criteria. There are two major ongoing
    curriculum efforts: the Guide to Software Engineering Body of Knowledge (Abran
    & Moore, 2004), which is seeking to raise the software engineering profession
    to the level of other engineering disciplines in terms


    of licensing and accreditation; and, Software Engineering 2004 (LeBlanc & Sobel,
    2004), the curriculum guidelines for undergraduate degree programs in software
    engineering. Both of these efforts are the subject of much discussion in the literature:
    Simmons (2006) examined the need to address the world wide demand of software
    engineers as a result of outsourcing and US Department of Labor growth projections
    for the occupation; Thomson and Edwards (2006) reported on bridging the university/industry
    gap in software engineering education in the United Kingdom, and recommend the
    inclusion of best industry practices into curricula; and van Vliet (2005; 2006)
    identified the shortcomings of both SWEBOK and SE2004 in achieving real-world
    experiences, the dissimilarity between software engineering and other engineering
    disciplines, and the inaccuracy of project planning techniques. In addition, Bagert’s
    (2004) work on a software engineering roadmap is an excellent summary of the issues
    including a discipline code of ethics, professional licensing (Texas and Canada),
    and accreditation (United States and Canada).


    There are many novel efforts underway related to software engineering capstone
    courses such as CSE293. Bagert and Mengel (2003) discuss a standardized software
    process that is employed in their MSSE and BSCS programs that emphasizes a practice-based
    approach to software engineering education. Their undergraduate students take
    an initial software engineering course, followed by a senior-level product design
    course, and then a senior-level product implementation laboratory. This is similar
    to CSE293 in focus, but gives a full semester devoted to software design rather
    than the partial semester design focus of CSE293. Bernhart, Grechenig, Hetzl and
    Zuser (2006) have developed two courses in their quest to transition the software
    engineering knowledge requirements identified in SE2004 into actual software engineering
    course design. One is a project-based introductory software engineering'
