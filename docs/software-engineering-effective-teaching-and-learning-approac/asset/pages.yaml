  md: 'The desire to capture recurring patterns in software development problems has
    been expressed elsewhere in the software engineering literature. For instance,
    Sutcliffe et al. (A. G. Sutcliffe, Maiden, Minocha, & Manuel, 1988) propose that
    “if common abstractions in a new application domain could be discovered early
    in the requirements engineering (RE) process, then it may be possible to reuse
    generic requirements and link them to reusable designs. This could provide a conduit
    for reusing the wealth of software engineering knowledge that resides in reusable
    component libraries” (1073, italics ours). Put another way, individuals and the
    groups within which they work often create ways of coping with the uncertainties
    of the project design process, amassing a sizeable and valuable knowledge base
    as they do. Through our case studies we aim to capture that knowledge, reflected
    in the lived experience of one individual or group of individuals. Incorporating
    this knowledge and experience into pedagogical tools, our cases have the potential
    to instill that experience in others when used in the classroom.


    material (notes, meeting minutes, versions of the software, emails, and so forth)
    from the Senior Design students. Following standard practice in qualitative research
    (Agar, 1996; Kirsch & Sullivan, 1992; Lauer & Asher, 1988), the graduate students
    acted as participant observers during the majority of the students’ meetings.
    As researchers, they made audio recordings, drew diagrams of where people sat
    and how they moved about the room, and recorded field notes for later reference.
    Following the suggestions of Emerson, Fretz, and Shaw, their field notes recorded
    fine details (Emerson, Fretz, & Shaw, 1995) for later recall, reconstruction,
    and analysis. Further, their notes focused on key events and incidents — such
    as dramatic and unexpected shifts in the client’s requirements and expectations
    — and recorded stakeholders’ reactions. These strategies brought the cases “to
    life” by including details and rich descriptions of action, thus capturing the
    visual and oral ambiance of the situation and giving that “you are there” feeling.


    # Gathering the Data


    As the students work on their Senior Design projects, significant case study data
    is accumulated: meeting minutes, email, reports for clients and for the Senior
    Design instructor, and documented code. Email is collected through ad hoc mailing
    lists, which the project teams use for communicating among themselves and with
    others. Furthermore, Senior Design students reflect on their daily results and
    then consolidate the information they have collected in one-page progress reports
    that they submit on a weekly basis to the instructor. Consequently, work on the
    case studies during the academic year is focused on data collection, organization
    and coding; summers are focused on case study construction.


    As the project came to a close, the graduate students also conducted semi-structured
    interviews with the Senior Design students and their clients. They used these
    interviews to triangulate early results as Hesse-Biber and Leavy recommend (Hesse-Biber
    & Leavy, 2005), and to support findings and “earn the confidence of the reader
    that the researchers have ‘gotten it right’”.


    # Constructing the stories


    To construct the case studies, the graduate students first assembled all the original
    material chronologically into one long summary account, with hyperlinks to the
    original documents, and then divided it into modules. They also developed question
    sets for each module to help students identify and examine the issues, as well
    as some password-protected teaching aids for the instructor giving background
    material and an “insider’s view” of the situations. These were integrated into
    the final chronological version.


