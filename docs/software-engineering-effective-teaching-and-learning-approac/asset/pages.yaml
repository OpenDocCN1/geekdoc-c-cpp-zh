    diagrams from Tasks A to E. |

    | 3-Part III | Week 6 | Revised Multi-Faceted Design | Based on instructor’s critique
    for Assignment 3-Part II, the students are asked to revise their diagrams and
    written documentation. |

    | 4-Part I | Week 6 | Prototyping Plan | Teams lay out a plan for implementing
