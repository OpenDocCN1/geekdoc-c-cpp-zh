    # THE PROjECT


    To address the issue of providing students with the experience of developing large
    software systems, the course requires that students construct software for a real
    client, someone who needs a software solution to a problem. Given the project’s
    central role in the course, selection of the project is a key part of preparation
    for the course; however, the project is a means to an end. Our focus is on teaching
    students the methods that support building complex, reliable, and maintainable
    systems. The project gives them the opportunity to apply a process and practice
    process improvement.


    Software engineering is about managing change, but students tend to have experience
    with requirements that do not change. What they need, then, is real-world experience
    where the customer may change the requirements during the project, may be unclear
    about their own needs, and are unsure about how to best solve their problem. Identifying
    and clarifying ambiguous, incomplete, and inconsistent requirements, as well as
    managing change, are an important part of the course. Students often lack experience
    in eliciting and specifying requirements, and the comment below from one of our
    clients supports the importance of defining a requirements process:


    > As the SCIMITAR project lead, I felt the students received a real-world immersion
    in the complexities of software development. They learned the importance of listening
    to the customer, developing requirements, and getting feedback from the customer.
    They also learned how difficult it is to really nail down those requirements,
    and how much it saves in the long run to do so. --Lon Anderson, Army Research
    Laboratory (L. Anderson, personal communication, 2003)


    In addition to managing change in requirements and its impact on maintaining consistency,
    the students must learn to anticipate change in design. Indeed, the best way to
    appreciate designing for change is to have change looming during the design process,
    and then observe what happens to the design when change occurs.


    # Project Descriptions


    There are endless possibilities for software engineering projects, and we are
    frequently approached by potential clients. To help us select appropriate projects,
    we consider the following requirements for projects:


    +   - The client must truly want the software product. Involvement of the client
    is essential. Clients participate in interviews and demonstrations, and they are
    present for the final presentations each semester. They must be available to answer
    questions about the desired product during critical junctures of the two-semester
    course.


    +   - The client must be willing to wait for two semesters or more to receive
    functional software. Two approaches can be used in this capstone course. One is
    the waterfall model and the other is an adaptation of the agile approach called
    Feature-Driven Development (FDD) (Coad,1999). The use of waterfall is intentional:
    Our students are familiar with coding, but not as familiar with the other aspects
    of software engineering. The original version of FDD is composed of five processes:
    develop an overall model, build a feature list, plan by feature, design by feature,
    and build by feature. The modified version of FDD (Rauda, 2005) uses the five
    processes, but modifies the internal tasks of the processes to meet the outcomes
    of the course.


    +   - The project must have sufficient scope that it is infeasible for one or
    two students to complete'
