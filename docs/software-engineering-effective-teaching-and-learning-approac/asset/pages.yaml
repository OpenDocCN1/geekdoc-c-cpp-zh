  md: 'different campus). Several industry projects have chosen to meet primarily
    on-campus, often as the industry sponsor’s excuse to “get out of the office.”
    It is the student teams that need to be removed from their comfort zone. By conducting
    customer meetings at the customer site, student teams are much more cognizant
    of the business realities of the sponsoring organization, and as a result are
    better prepared and more professional. In a sense, it forces teams to act as service
    organizations (Poole, 2003). The Software Enterprise identifies project sponsors
    through personal industry contacts and industrial advisory boards. Only after
    off-campus sponsors are accounted for are on-campus sponsors considered.


    The best projects are sponsored by project managers, especially those with limited
    software development expertise. Sponsors with significant technical expertise
    are often too eager to solve problems for the team, and also tend to not express
    requirements but instead define technical tasks. This is particularly evident
    in Course 3, where project teams are charged with eliciting requirements, prototyping,
    and defining architecture. These activities are amongst the most challenging to
    students. While certainly some benefit is gained from technical interaction with
    industry mentor types, too often these technologists become a solution crutch.
    Faculty members also make poor project sponsors, as they usually are interested
    in the learning objectives and assessment criteria of the projects. In short,
    they think they are teaching and grading the teams instead of sponsoring them.
    The situation is worse if the faculty member participates in the Enterprise in
    any fashion due to an inability, on both sides, to create distinct lines between
    student-faculty and team-sponsor interactions. Project managers who are not active
    technically (though manage technical projects) have worked best as they tend to
    follow a model of interaction that focuses on expectations, plans, risks, and
    progress on deliverables, and as such teams become accustomed to focusing their
    work the service they are to provide. Unfortunately,


    at this time most Enterprise projects are sponsored by technologists, either from
    industry or academia.


    The best projects leverage existing technologies. We have found that students
    are tremendously lacking in their ability to work, at an implementation level,
    with existing source code. The main reason for this is simple - they haven’t been
    asked to yet. This is a larger problem for computing curricula. Students are not
    asked before the Enterprise to examine a large body of source code and understand
    its structure and style. Students are typically naïve about the scale of software
    systems, even ones they use every day. As an example, one in-class exercise asked
    students to estimate the lines of code in a specific software system they use
    almost every day. The system in question is about 2 million lines of code; more
    than half the class estimated 10 thousand lines or less, 2 less than one thousand.
    The Enterprise requires teams to leverage existing bodies of source code, often
    taken from previous solutions or from the open source community. Furthermore,
    most projects have a significant integration requirement, be it data or control
    integration. These projects are very useful for their realism as well as their
    technical characteristics.


    The best projects are vaguely defined. The principal objective of Course 3 is
    to gain a shared understanding of the problem and solution spaces through elicitation,
    prototyping, and architecture. Giving projects that are too “canned” reduces the
    project to a big programming exercise, stripping the team of the need to experience
    how to perform an iterative refinement process. As Szyperski points out, stakeholders
    typically are better at expressing requirements as incremental extensions to systems
    with which they are already familiar (Szyperski, 2005). However, we do not want
    a system where the requirements are readily expressed by the customer; instead
    we want students to work at elicitation to draw those requirements out. On the
    other hand, giving projects that are too discovery oriented are'
