  md: 'developed with enough versatility in the course to allow instructors to add
    to and otherwise customize the course based on the particular instructor’s background
    and preferences. Additionally, standardized core assignments can also contribute
    to the continuous improvement process required of accredited programs.


    We discussed our experiences with various team sizes, and conclude that a targeted
    team size of four to six students provides suitable proportions with which to
    support appropriately scoped semester-long projects, withstand unforeseen team
    member losses, support confidential, and useful, peer evaluations and ensure that
    sufficient intra-team communication complexities are experienced by the team members.


    In terms of project selection, we found that student-selected, instructor-scoped
    projects that involve well-known or emerging technologies work well. However,
    team members must conceptually buy-in to the basis behind the specific project
    proposed. Also, the team must take steps to avoid becoming constrained by commercially
    promised future software releases in order to complete their project. We have
    shown that year-long (as opposed to single-semester) inter-disciplinary capstone
    projects can work. We have discussed steps that can be taken concurrently across
    the involved departments to ensure that software and hardware being developed
    in different locations by different team subsets can be integrated at appropriate
    intervals throughout the year. Further, the design of software developed for such
    projects benefits from having paid careful attention to design reusability in
    order to gain the flexibility needed to overcome late term integration obstacles.


    Key aspects of team-oriented software engineering capstone courses include the
    need for confidential self and team-member assessments as well as mechanisms for
    dealing with uncooperative team members. We present a rubric that culminates in
    a peer-assessment-multiplier for assigning individual student grades for team
    projects. We have shown how this multiplier can


    be used to reallocate a team’s final project grade so that the peer-assessed hardest
    working team members are recognized, while also fairly dealing with underperforming
    team members. On very rare occasions, a team may have a team member that severely
    fails to fulfill his/her responsibilities towards the team project. To mitigate
    such situations, we presented our ejection regulations technique for empowering
    teams to handle such situations at the lowest possible level, much as they will
    need to do in industry.


    In terms of future work, at USNA, in addition to our current ABET accredited CS
    program we have recently developed, offered and successfully undergone a pilot
    accreditation of our Information Technology (IT) program. As of the writing of
    this chapter there are currently only 5 ABET accredited IT programs in the country.
    For future offerings of our project-oriented software engineering capstone course,
    we plan on requiring our CS and IT majors to conduct their capstone projects within
    mixed teams that include proportionate numbers of both CS and IT majors. We are
    currently modifying our capstone course to accommodate the mixture of majors,
    and to ensure that the combined capstone course can provide measurements for the
    program outcomes assessments required by both programs in a manner similar to
    that in which CSE293 addresses both CS and CS&E program outcomes assessment.


    For CSE293, we have also begun to explore different delivery mechanisms for the
    course. In an upcoming semester, we will be team teaching the course, with one
    instructor providing the overall guidance, and splitting the students into three
    sections (10 students and two teams per instructor) in order to provide more detailed
    interactions and guidance to each team through more contact hours with the instructor.
    This will allow one instructor to handle software/database focused projects, one
    instructor to handle software/web-based projects, and a third instructor to handle
    network/hardware based projects; each instructor will advise projects that are
    in their strength area.'
