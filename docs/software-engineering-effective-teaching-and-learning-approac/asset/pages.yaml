  md: '# Chapter V


    # Speaking of Software:

    Case Studies in Software Communication


    **Ann Brady**

    *Michigan Technological University, USA*


    **Marika Seigel**

    *Michigan Technological University, USA*


    **Thomas Vosecky**

    *Michigan Technological University, USA*


    **Charles Wallace**

    *Michigan Technological University, USA*


    # Abs TRACT


    We describe our recent efforts to generate and use case studies to teach communication
    skills in software development. We believe our work is innovative in several respects.
    The case studies touch on rhetorical issues that are crucial to software development
    yet not commonly associated with the field of software engineering. Moreover,
    they present students with complex, problematic situations, rather than sanitized
    post hoc interpretations often associated with case study assignments. The case
    study project is an interdisciplinary collaboration that interweaves the expertise
    of software engineers and technical communicators. Our software engineering and
    technical communication curricula have been enhanced through this cross-fertilization.


    # OVERVIEW


    We argue that the art of *communication*, in its oral and written forms, is given
    relatively little attention in software engineering education,


    despite its fundamental importance in software development. Two major problems
    appear to prevent a more thorough treatment of communication issues. First, although
    software engineers may be effective communicators, they typically'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'do not have practice in articulating what it is that makes communication effective
    (or ineffective). That is, their knowledge remains at a tacit level, from which
    it is difficult to impart it to students. Second, part of what makes communication
    in the software workplace difficult is its intricacy and subtlety—“the devil is
    in the details”. Students will not be convinced by toy examples; only realistic
    stories of software development will suffice. Yet the prospect of creating a communication
    setting of appropriate scale seems overwhelming.


    Our ongoing interdisciplinary work seeks to address both of these problems. It
    utilizes the expertise of technical communicators, who are well versed in discussing
    and analyzing communication. Equipped with examples from software engineering,
    empirical techniques from ethnography, and analytical techniques from rhetoric,
    we have created *case studies* for teaching communication skills in software development,
    and we have used the case studies in upper-level courses in both software engineering
    and technical communication. Here we use the term “case study” not in its sense
    as a research tool in the social sciences, but rather in its sense as a *pedagogical*
    tool, currently used most prominently in law and business schools. Our case studies
    are based on the experiences of real software engineering students engaged in
    their capstone projects. The associated instructional materials touch on rhetorical
    issues not usually associated with software engineering: audience, active listening,
    critical analysis, timing, and planning. Moreover, they present students with
    complex, problematic situations, rather than sanitized *post hoc* interpretations
    often associated with case study assignments.


    The case study project is an interdisciplinary collaboration that interweaves
    the expertise of software engineers and technical communicators. Our software
    engineering curriculum has been enhanced through this cross-fertilization—both
    by the insights into communication and by the qualitative methods employed in
    generating the cases. We report on the success of the project to


    date and describe some of the future directions we envision for this work.


    # MOTIVATION


    We believe there is a significant gulf between the skills that students practice
    in academia and the skills they must use in the workplace. In this section, we
    show that practicing software developers acknowledge the importance of communication
    skills and expect new employees to have them. We then turn to the current state
    of software engineering education and comment on the status of communication skills
    in academia.


    # Communication in the software

    Workplace


    Within the lifespan of a single project, software engineers must engage with a
    wide range of stakeholders, with very different perspectives and goals (Poole,
    2003). They must carefully elicit requirements from clients and keep them apprised
    of budget or scheduling changes. They must consult with end users to design products
    that provide both ease and value. They must also communicate within their development
    team, to maintain a clear vision of how to divide the labor and how to handle
    the project risks.


    Stepping up from the level of individual projects to survey the software development
    landscape, we find an astounding variety of applications. No other engineered
    product has such a diverse set of potential uses. With this diversity of uses
    comes a diversity of stakeholders. In the span of a career, a software developer
    moves from project to project—and most likely from firm to firm—at each step negotiating
    a new application and a new set of stakeholders with widely varying knowledge,
    requirements, and communication styles.


    Several studies point to deficiencies in requirements as the primary cause of
    large-scale'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'project failures (Curtis, Krasner, & Iscoe, 1988; Davis, 1990; Glass, 1998).
    This can be traced to a lack of commitment and trust between customer and developer.
    Developers consider risks such as “failure to gain user commitment” and “lack
    of adequate user involvement” more important than such serious risks as “introduction
    of new technology” and “insufficient/inappropriate staffing” (Keil, Cule, Lyytinen,
    & Schmidt, 1998). This evidence indicates the need for improved communication
    during requirements elicitation and analysis.


    Of course, communication issues are also a source of conflict within the development
    team. Demonstration of social skill sets—“the ‘good communication skills’ often
    referred to in job postings” (Reinsch & Shelby, 1997)—is now explicitly required
    of new workers (Muir, 2004). While intra-team conflicts are often viewed as management
    or organizational behavior issues, many researchers have identified them as inherently
    communicative (Putnam & Folger, 1988; Putnam & Poole, 1987; Schultz & Anderson,
    1984). Regardless of whether the conflict is rooted in the actions of management,
    the behavior of individuals, or deficiencies in communication, improving communication
    skills is one way to avoid conflict in the first place, or resolve it should it
    occur. Discussing the skills students need to negotiate work conflicts early in
    their careers, Myers and Larson state that “[a] communicative understanding of
    conflict can facilitate students’ transition to full-time employment by helping
    students to interpret the nature or types of conflicts employees experience in
    organizations” (Myers & Larson, 2005).


    A survey of software engineering professionals (McMillan & Rajaprabhakaran, 1999)
    ranks four software engineering project features based on what they felt was most
    important for professional development. The first two, respectively, are “working
    with real users” and “developing a working prototype.” This highlights the importance
    of client communication, essential to both these aspects of development. Student
    work often


    suffers when communication skills taught in class are not applied during their
    coursework both in communicating with their project teams and with their instructor
    (Liu, 2005).


    Communication in a software setting is essentially problematic, for a number of
    reasons. Software development is complex, due not only to the functionality of
    the software itself, but also to the competing and often conflicting goals of
    different stakeholders. Software engineering is a nascent field, without a time-honored,
    universal lexicon. The wide range of application areas draws together stakeholders
    with different backgrounds and little in the way of a common vocabulary. Moreover,
    software developers work in a world of incomplete, imperfect information. While
    they can access the internals of the machine through the precision of computer
    languages, they must work through the less mechanical channel of human language
    to understand the needs and desires of other stakeholders. For these reasons,
    instruction in communication strategies requires grounding in realistic contexts
    that reflect and simulate these difficulties.


    # Communication in software Engineering Education


    We believe that the process of communicating about software is not given sufficient
    attention in software engineering education, given its importance and its difficulty.
    Instruction in communicating with other stakeholders and documenting software
    is typically the role of ancillary courses in technical communication, taught
    through departments outside of software engineering. While these courses offer
    an important introduction to effective means of workplace communication, a single
    class cannot provide the extensive practice in the variety of discipline-specific
    contexts needed to prepare software engineering students adequately.


    The precision of programming languages and computer hardware is comforting to
    students and'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'educators in the computing disciplines, but that very comfort can lull students
    away from looking at the human problems that motivate software development in
    the first place. The process of interacting with human stakeholders is often seen
    as “soft” material, not worthy of serious attention. Of the software engineering
    education contributions to the SIGCSE and CSEET conferences in recent years, only
    a handful of papers address issues of communication between humans in software
    development.


    Part of the difficulty here is that the communicative skills that developers acquire
    on the job remain in a tacit form; by and large, there is no “explicit formulation
    of rules” (Freedman, 1993b). Addressing the gulf between the workplace and academia,
    Alred (Alred, 2006) suggests that “[t]he workplace requires practitioners to seek
    fundamentally different ways of responding to their contexts and exigencies—ways
    that do not require them, for example, to document either their intellectual processes
    or establish concurrence with scholarly or any other literature”.


    It is interesting to see how the issue of communication is treated in the IEEE
    Software Body of Knowledge (SWEBOK) (Abran, Moore, Bourque, & Dupuis, 2004). In
    the “Software Requirements” section, it states that “[o]ne of the fundamental
    tenets of good software engineering is that there be good communication between
    software users and software engineers”. In the section on “Project management”
    – a “related discipline” outside of software engineering itself – it notes that
    “[c]ommunication management is also often mentioned as an overlooked but major
    aspect of the performance of individuals in a field where precise understanding
    of user needs and of complex requirements and designs is necessary”.


    Clearly, there is some ambivalence in the SWEBOK about the role of communication.
    On one hand, it does include language emphasizing the importance of communication
    in the software process. “Communication management” is even cited as an “overlooked”
    aspect. Yet it is not clear


    that the SWEBOK helps to raise the prominence of communication. Only communication
    between users and developers is included within the bounds of “software engineering”;
    all other types of communication (including intra-team communication) are relegated
    to an ancillary area. Locating communication outside of software engineering encourages
    the status quo of “outsourcing” communication to other departments, rather than
    dealing with it in the context of the software engineering curriculum.


    # VISION AND APPROACH


    We have a vision of a new curriculum where communication is a core skill, tightly
    integrated with the other aspects of software engineering, rather than a stand-alone
    topic taught outside of the discipline. With such a curriculum, software engineering
    students will become not only creative designers and thoughtful analysts but also
    effective communicators. Empowering students to participate in active communication
    will make them more engaged in their profession and less prone to frustration
    and burnout. Furthermore, students with skills and interest in communication,
    who seek more than a cubicle-centered “programming” view of software development,
    will be attracted to the field. Margolis and Fisher indicate that many female
    students seek grounding in meaningful applications and become disillusioned with
    computer-centrism (Margolis & Fisher, 2002). Focusing on real software problems
    will likely attract those students who prefer “computing with a purpose”.


    To pursue this vision, we have assembled an interdisciplinary team of software
    engineers and technical communicators. We benefit from the experience our technical
    communicators have in preparing students for communication challenges. Here we
    explore the role of technical communication, rhetoric, and the value of case studies.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Technical Communication


    The practice of technical writing can be traced from the fifth century BCE, through
    the Middle Ages, and into the Industrial Revolution (Tebeaux & Killingsworth,
    1992). Its systematic instruction in the United States began after the Civil War
    (Connors, 2004). Histories of technical communication generally identify the Second
    World War as the birth of the profession, when the boom of wartime technologies
    triggered a corresponding boom in documentation that would facilitate dissemination
    and operation—and also necessitated a new class of workers to write and compile
    this documentation. Realizing that it was not profitable to hire engineers to
    both design and write, Westinghouse, General Motors, and General Electric developed
    their own in-house technical writing departments, and technical writing was finally
    recognized in the United States as a field of its own.


    Early courses in technical communication were grounded in what has been called
    a “windowpane” view of language (Miller, 1979). According to this view, the technical
    communicator’s role (whether that technical communicator is a professional in
    technical communication or a software developer who will work with technical communication
    genres as part of her profession) is to render technical information as clearly
    and transparently as possible. The problem with this view of technical communication
    is the implicit assumption that it is possible to attain a technical language
    that is universally clear and transparent. A corollary to this thesis is that
    any difficulties in deciphering such language are due to inadequacies of the reader
    or listener, not with the assumptions that underlie the presentation of the information.
    The windowpane view of technical communication assumes that meaning is transmitted
    unilaterally from sender to receiver rather than negotiated between them.


    Particularly within the latter half of the twentieth century, technical communication
    scholars


    have argued for a more rhetorical and humanistic approach to teaching and practicing
    technical communication. For example, in her landmark article “A Humanistic Rationale
    for Technical Writing” (Miller, 1979), Miller argues that it is “the common opinion
    that [it] is a ‘skills’ course with little or no humanistic value is the result
    of a lingering but pervasive positivistic view of science... an efficient way
    of coercing minds to submit to reality”. Consequently, students in technical communication
    courses tend to look upon writing as a “superfluous, bothersome, and usually irrelevant
    aspect of their technical work”. As a corrective, Miller recommends that we “teach
    technical or scientific writing, not as a set of techniques for accommodating
    slippery words to intractable things, but as an understanding of how to belong
    to a community... to write well is to understand the conditions of one’s own participation—the
    concepts, values, traditions and style which permit identification with that community
    and determine the success or failure of communication.” Even more recently, scholars
    have begun to focus on genres surrounding software documentation and development,
    noting parallels between approaches to usability testing and research and a rhetorical
    view of communication. Like rhetorical approaches to communication, usability
    focuses on different types of audiences and the particular contexts within which
    they work and the purposes to which documentation will be put rather than positing
    a universal decontextualized user for whom expert, system knowledge must be “dumbed
    down” (Johnson-Eiola, 2001; Johnson, 1998).


    Such a rhetorically grounded approach to technical communication, we believe,
    promises to make students more successful communicators when they enter the workplace.
    Rather than learning a rhetorical, rote approaches to technical communication
    genres, students learn to strategically engage with and manipulate those genres
    according to the audiences, purposes, and contexts within which and with which
    they are working.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Rhetoric


    In this project, we have a particular approach to communication grounded in theories
    and practices of rhetoric. While the term “rhetoric” has acquired a negative meaning
    of “[l]anguage that is elaborate, pretentious, insincere, or intellectually vacuous”,
    we use an older definition: “[t]he art or study of using language effectively
    and persuasively” (Pickett, 2004). More precisely, we define rhetoric as strategic
    communication. Software developers are frequently confronted with challenges that
    can only be met through careful communication: for instance, understanding the
    typical use of a software product in the workplace, assessing user satisfaction
    with a prototype, or breaking the bad news about a missed deadline. Successful
    communication requires a strategy informed by an awareness of audience, a broad
    knowledge of potential genres, and sensitivity to the effects of style.


    We see, in fact, a clean fit between rhetoric and software engineering. The software
    engineering student, like the rhetorician, can rely on the arts of knowing how
    to inquire, what questions to ask, in particular situations to make appropriate
    communications for a variety of audiences. When students are introduced to case
    studies, they are exposed to communication problems that can be analyzed and understood
    using these rhetorical principles.


    Revealing to software engineering students the complexity of the rhetorical situation
    is the first step in teaching them to communicate strategically (Johnson, 1998).
    Software engineers produce much more than source code — design documentation,
    user guides, memos to management or other team members, to name just a few examples
    — and they must learn how to consider the broad contexts of use within which their
    products reside. For example, communication in a small start-up will be significantly
    different from that in a large corporation since institutions and disciplines
    constrain and define how it is carried out. In a small, recently founded company,
    the communication system is likely to be organized in a “flat” manner; employees
    are likely to know one another and thus to communicate more directly and without
    regard to established protocols. Those working in larger and more established
    organizations may be required to communicate through a hierarchy of established
    channels. As another example, domestic communication practices will not necessarily
    work in international contexts, since cultures and historical legacies direct
    and shape organizational and stylistic conventions.


    out. In a small, recently founded company, the communication system is likely
    to be organized in a “flat” manner; employees are likely to know one another and
    thus to communicate more directly and without regard to established protocols.
    Those working in larger and more established organizations may be required to
    communicate through a hierarchy of established channels. As another example, domestic
    communication practices will not necessarily work in international contexts, since
    cultures and historical legacies direct and shape organizational and stylistic
    conventions. Software engineering students who understand these subtleties are
    better prepared to work with fellow members of development teams as well as with
    both domestic and international stakeholders.


    Rhetoric also offers software engineering students a practical understanding of
    communication as a problem solving process and gives them strategies for moving
    systematically toward a solution (Deili, 1988; Flower, 1998). While the term “problem”
    has a precise and time-honored meaning in the theory of computation, here we consider
    problems of a different sort—human-centered, not prone to mathematical formalization.
    Nevertheless, as software engineers venture into complicated contexts of communication,
    they can call upon a highly recognizable array of techniques from the problem-solving
    model. Specifically, rhetoric divides planning into stages: invention, arrangement,
    style, and delivery. This breakdown into stages is particularly useful for teaching
    students to engage in active listening and critical analysis.


    The first stage of planning, invention, is perhaps the most important since it
    sets the requirements for the following three. It offers students a method for
    gathering information about how to communicate most effectively with particular
    audiences in specific contexts and is based on four sets of questions. The first
    question set focuses on audience. It poses questions about the characteristics
    of the stakeholders, about their attitudes'
