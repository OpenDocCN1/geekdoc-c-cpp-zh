  md: 'include an inability to consistently guarantee a quality product, fit for the
    purpose for which it was developed, produced on time and within budget. The rates
    of successful projects reported in the mid 1990s are not significantly higher
    than those reported in the 1970s and 1980s (Mann, 1996), and continue to be low
    in the 2000s.


    There are positive implications as well for the label ‘craft’. Each system is
    considered a unique synergy between the hardware, software and organisational
    context in which it will be used. This viewpoint suggests that the development
    process cannot be repeatable, as the forces at play will differ for each context:
    continually changing as understanding of the characteristics of the developing
    system grows in all stakeholders. From this perspective software is a collaborative
    invention. Its development is an exploratory and self-correcting dialogue (Bach,
    1999), based on insight-driven knowledge discovery (Guindon, 1989) facilitated
    by opportunistic behaviour (Guindon, 1990; Visser, 1992).


    # EDUCATION FOR THE DIsCIPLINE


    Hannafin (1997) and Reeves (1994) suggest that several dimensions are relevant
    in the description of learning systems:


    +   - Epistemological foundations: Are concerned with theories about the nature
    of knowledge, and describe the world view to be disseminated. At one extreme (objectivism),
    content aims to be comprehensive and accurate, and based on advice from experts
    in the field. At the other (constructivism), content reflects the spectrum of
    views in the domain, providing multiple perspectives/options for constructing
    knowledge.


    +   - Psychological foundations: Represent beliefs about how individuals think
    and learn. On this continuum, shaping desirable behaviours via stimuli, feedback,
    reinforcement


    etc at one pole contrasts with a cognitivist emphasis on mental models and the
    connections between them. The type of knowledge to be constructed is seen to drive
    the learning strategy employed.


    +   - Philosophical foundations: Emphasise how to-be-learned domains are represented
    and affordances provided to support learning. An instructivist foundation stresses
    the importance of goals and objectives drawn from the domain. Constructivist foundations,
    on the other hand, stress the primacy of learner intentions, experience and metacognitive
    strategies through a rich environment that can be tailored to individual needs.


    These dimensions describe the nature of learning, the methods and strategies employed,
    and the ways in which the discipline should be organised and made available to
    the learner.


    Although any software development project is acknowledged as knowledge-intensive,
    with many concepts developed to ease or guide the processing of knowing (Robillard,
    1999), and learning (Klemola & Rilling, 2002), what is actually taught within
    a discipline is a complex synthesis deriving from the ideology of the discipline,
    the context of the learning and the ‘tools’ used to facilitate that learning,
    all, in theory, influenced by the needs of practitioners in the discipline. Figure
    1 describes a conceptual framework that identifies the elements of this synthesis:
    the bodies of knowledge (BoKs) and model curricula are a distillation of expert
    opinion and domain-specific texts. The breakdown is seen to cover the areas discussed
    in texts and standards, either identically, or, as noted in the SoftWare Engineering
    Body of Knowledge (SWEBoK), derived from these and other sources to reflect a
    consensus and identify mature and stable concepts (Sawyer & Kotonya, 2000) in
    the discipline.


    At the same time, a perspective (composed of the epistemological, psychological
    and philosophical foundations noted above) also exerts'
