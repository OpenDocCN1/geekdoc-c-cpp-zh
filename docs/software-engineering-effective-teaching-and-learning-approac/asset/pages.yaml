    It is a common expectation that at least some of these courses employ textbooks
    that address a variety of advanced software engineering topics, and that they
    do not rely primarily on the small number of commonly used introductory software
    engineering textbooks.


    # IMPROVEMENTs MADE


    The variety of improvements that have been made as a result of assessment and
    preparation for accreditation visits is extremely long. This section will summarize
    a subset of those with which the authors are familiar.


    For the requirements related to Students, a few programs have found that they
    were not advising and monitoring their students carefully enough. This sometimes
    resulted in students not completing all of the courses required by the program,
    usually due to course substitutions that were done without appropriate review.
    The programs that have had this problem have typically tightened their advising
    and monitoring processes to insure that the problem does not happen in the future.


    Several programs have formed new industrial advisory committees and gotten them
    deeply involved in helping to specify Program Educational Objectives. A few have
    developed employer surveys to get feedback on achievement of pro-


    gram educational objectives and at least one has modified the wording of its objectives
    to eliminate misunderstandings of the wording. Based on our experience, with our
    own programs and with programs that we have evaluated, we believe that the greatest
    benefits to the programs have been the improved relationships between the programs
    and local industry that have resulted from the involvement of industrial advisory
    committees in the accreditation process.


    In response to shortcomings identified in the Program Outcomes area and to the
    measurement of specific outcomes, many programs have modified the content of specific
    courses, usually with small changes to assure that prerequisite courses were meeting
    the expectations of instructors in later courses. Some programs have developed
    specific courses to assure that students were developing an understanding of professional
    and ethical responsibilities. Others have developed new methods and courses for
    assuring that students were receiving a broad education, recognizing the need
    to engage in life long learning and developing an understanding of contemporary
    issues. All of these improvements were made as direct results of measurements
    indicating that student learning results were below expectations for one or more
    of the specified outcomes.


    To effectively demonstrate compliance with the requirements for a major design
    experience by the Curriculum criterion, some programs have provided additional
    encouragement for students to document their engineering processes, design approaches
    and their consideration of engineering standards and multiple practical constraints
    in their design projects.


    To address shortcomings related to faculty experience and competencies to cover
    all curricular areas, as required by the Faculty criterion, a few programs have
    added one or more faculty members. Typically they have taken advantage of existing
    open positions or of planned retirements to add these resources. To strengthen
    faculty guidance and oversight, some programs have'
