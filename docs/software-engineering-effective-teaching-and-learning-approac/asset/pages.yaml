    Curriculum guidelines (Tucker, 1991; Ford 1991). That curriculum covered the entire
    software lifecycle in detail, by offering 3 new courses, specifically in requirements,
    implementation and reuse, and testing and quality. A former elective, software
    systems security, became a core course.


    Having such a heavy core, this curriculum offered little flexibility for learning
    aspects of SE that students would be most interested in. Another major change
    was reflected in the introduction of several new courses that would form 6 credit
    elective specialization tracks: in distributed software systems, software management,
    information systems, and real-time sys-


    tems. These tracks were introduced as a response to the needs and feedback from
    the local industry, and government collaborators (Powell,1997). The curriculum
    change was made possible by hiring faculty with both theoretical background and
    working experience in industry, supplemented with a substantial help from adjunct
    faculty with expertise in specialized areas of SE.


    # 1996 Curriculum Changes


    In 1996 minor changes were made in the curriculum. It remained a 36-credit program,
    with 9 core and 3 elective courses, which offered a bit more flexibility than
    the previous program. The'
