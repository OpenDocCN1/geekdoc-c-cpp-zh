- pgno: 340
  md: '# 1. Institutional/university strength and constraints


    Each university/educational institution has its unique set of characteristics
    as discussed in the Capitalizing on Institutional Strengths subsection. No matter
    what the characteristics are, some (such as faculty, teaching style(s) and co-op
    arrangement) are great for marketing as the unique strength of the institution
    while others (such as core curricula, co-op requirement and freshmen sequences)
    can be considered as constraints for curriculum development.


    In our case, our university mandates 36 credit hours of general education which
    ensures that every graduate achieves the university outcomes (Frezza, 2003). Although
    the number of credits required is mandated, every program does have the autonomy
    of restricting course(s) that students can select from each category to better
    suit the needs of each program. Furthermore, our SE program does not have co-op
    requirement which opens up credit hours for curriculum. On the other hand, if
    a co-op arrangement is instituted by the university, the number of credit hours
    required for the co-op arrangement would be a constraint for curriculum design.


    An area where this can be significant is that of total credit hours – in our case,
    the Computer Science and other Engineering programs all require over 130 semester
    credits, so this afforded a bit of room in creating courses for the SE program.
    Many schools have very specific credit constraints that can make this more difficult,
    e.g., in the United States, many schools have 128 credit limits for bachelors
    degree programs. As in our case, using related programs in the school (such as
    EE or CS) as patterns can prove to be effective. Many of the patterns these existing
    programs have, such as when they take general education courses, the patterns
    for lab courses and lab credits, the patterns for co-ops, the patterns for common
    and discipline-specific courses can prove to be useful. In our case we used the
    CS degree as the pattern,


    and reused as many of these courses as possible; by replacing some advanced mathematics
    courses with SE courses, this allowed us to create a program with essentially
    the same number of credit hours as the CS program.


    # 2. SE program hosting department/college constraints


    In addition to university/institutional constraints, program hosting department/college
    may have its own set of requirements (such as maximum reuse of faculty and existing
    courses offered, existing prerequisite structure, capstone project requirement,
    departmental outcomes, maximum number of credits required in a program) that need
    to be fulfilled.


    In our case, the SE hosting department, CIS, expects the new SE program to be
    compatible with the existing CIS computing programs: computer science and management
    information systems. This is not only for the economic benefits of shared courses
    and faculty resources but also allows students to switch majors early in the program
    without much impact on required time to earn the degree (Frezza, 2003). Such a
    requirement leads to the mapping/compatibility analysis of existing CIS course
    offerings, prerequisite structure and the SE program vision. Since the SE program
    focuses on the outsourced and MIS categories, the CIS faculty felt the strong
    need of solid programming, systems, networking and computing background for SE
    students which in turn leads to the reuse of a great number of existing CIS courses.
    Specifically, SE and CS program students have almost identical courses for the
    first two years. However, such an arrangement also limits the number of credits
    available for Software Engineering specific courses that can be offered.


    In addition, every CIS department graduate is expected to complete a capstone
    project and achieve a set of departmental outcomes. The capstone project, which
    integrates ethics and project management with a multi-disciplinary two'
