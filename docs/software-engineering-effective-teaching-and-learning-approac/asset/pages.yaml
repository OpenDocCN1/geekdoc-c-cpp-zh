  md: '# THE IMPORTANCE OF REQUIREMENTS ENGINEERING


    It is well recognized that requirements engineering is critical to the success
    of any major development project (Addison, 2000; Carr, 2000; Hecht, 2000; Mead,
    2006; Palyagar, 2004b). Several authoritative studies have shown that requirements
    engineering defects cost 10 to 200 times as much to correct once fielded than
    if they were detected during requirements development (Boehm, 2001). Other studies
    have shown that reworking requirements defects on most software development projects
    costs 40 to 50 percent of total project effort, and the percentage of defects
    originating during requirements engineering is estimated at more than 50 percent
    (McGibbon, 1999; Mead, 2005b). The total percentage of project budget due to requirements
    defects is 25 to 40 percent (McGibbon, 1999; Mead, 2005b).


    A recent study found that the return on investment when security analysis and
    secure engineering practices are introduced early in the development cycle ranges
    from 12 to 21 percent, with the highest rate of return occurring when the analysis
    is performed during application design (Soo Hoo, 2001). Thus the costs of poor
    security requirements show that even a small improvement in this area would provide
    a high value. By the time that an application is fielded and in its operational
    environment, it is very difficult and expensive to significantly improve its security.


    # The Problem with Developing security Requirements


    Security requirements are often identified during the system life cycle. However,
    the requirements tend to be general specifications of the functions required,
    such as password protection, firewalls, and virus detection tools. Often the security
    requirements are developed independently of the rest of the requirements engineering
    activity and hence are not integrated into the mainstream of the requirements
    activities. As a result, security requirements that are specific to the system
    and that provide for protection of essential services and assets are often neglected.


    In reviewing requirements documents, we typically find that security requirements,
    when they exist, are in a section by themselves and have been copied from a generic
    set of security requirements. The requirements elicitation and analysis that is
    needed to get a better set of security requirements seldom takes place.


    Much of the study of requirements engineering research and practice has addressed
    the capabilities that the system will provide. So a lot of attention is given
    to the functionality of the system, from the user’s perspective, but little attention
    is given to what the system should not do. In one discussion on requirements prioritization
    for a specific large system, ease of use was assigned a higher priority than security
    requirements. Security requirements were in the lower half of the prioritized
    requirements. This occurred in part because the only security requirements that
    were considered had to do with access control.


    Current research recognizes that security requirements are negative requirements.
    Therefore, general security requirements, such as “The system shall not allow
    successful attacks,” are generally not feasible because there is no consensus
    on ways to validate them other than to apply formal methods to the entire system,
    including COTS components. We can, however, identify the essential services and
    assets that must be protected. We are able to validate that mechanisms such as
    access control, levels of security, backups, replication, and policy are implemented
    and enforced. We can also validate that the system will properly handle specific
    threats identified by a threat model and correctly respond to intrusion scenarios.


    If security requirements are not effectively defined, the resulting system cannot
    be effectively evaluated for success or failure prior to implementation. Security
    requirements are often'
