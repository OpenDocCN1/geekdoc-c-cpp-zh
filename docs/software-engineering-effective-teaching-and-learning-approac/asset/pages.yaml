    The long-term vision for software developed during RPRCCs varies widely. In some
    cases, any future maintenance is solely the responsibility of the client. This
    means that if problems are discovered or if there are changes to the hosting platform,
    operating system, or component COTS product (for example, if one of these is updated
    to a new, incompatible version), the client must find someone else (perhaps another
    RPRCC team) to update the product.


    Another long-term consideration for products developed during an RPRCC is how
    (and if) they should be made available beyond the end of the course. One of us
    created an overall identity that spanned offerings to keep every project available
    as part of an instructor-maintained on-line repository. The repository included
    an underlying management system to support the course each semester and provide
    access to all work products under a uniform interface.


    # TEAM FORMATION AND PREPARATION


    Before students can begin to work on their projects they must be assigned to teams.
    In this section we discuss factors influencing choice of team size, options for
    how to assemble teams, how to prepare students for teamwork, and approaches to
    matching teams to projects. At smaller institutions with small class sizes, team
    set-up is somewhat simpler because the instructor already knows the'
