- pgno: 304
  md: 'sense. We estimate one deep experience, even in a fairly small niche of software
    engineering, higher than any high-level overview. Our graduates are expected to
    solve problems they (and we) never heard of. We cannot equip them for their future
    challenges. But we can provide the experience that systematic work, continuous
    quality assurance, plus a fair portion of both knowledge and creativity do work.
    That is possibly the shortest description of our approach. We want to grow great
    software engineers (Brooks, 1987).


    # ENTERING THE AGE OF sPECIALIsATION


    Software engineering is a great area. Many of our heroes, like Dave Parnas, Barry
    Boehm, and Fred Brooks, are still around and still contribute. Which other field
    could offer almost the whole history in one conference room, as we saw in 1991
    (Broy, Denert, 2002)?


    But the pioneers give way to young experts. Since the field is large, there is
    not just one area of expertise, but many of them, say half a dozen or even a dozen.
    Software engineering in banks and insurance companies is not like software engineering
    in automotive systems. Therefore, there will be specialists on software in various
    application areas because these people differ in their goals, in their methods,
    in their languages and tools.


    Specialisation is actually taking place but has hardly been reflected in books
    and magazines, and even less so in the education system. There are – at least
    – three reasons for this delay:


    +   - There is no generally accepted taxonomy of the field. We do not know how
    to cut it into pieces.

    +   - In most of these areas, we do not have the accumulated knowledge that would
    make up a scientific domain.


    +   - Specialists who could teach in those areas do exist, but hardly within the
    universities. Most colleagues in the department will not like the idea of having
    several new professors who are not members of the CS community in a traditional
    sense.


    Michael Jackson (1999) has pointed out that specialisation is very desirable.
    The IEEE CS & ACM Task Force (2004, 2.3.3) states: “Domain-specific techniques,
    tools, and components typically provide the most compelling software engineering
    success stories.” But to date, things have not changed a lot. If private companies
    analysed their needs, they would certainly find that they should sponsor new professors
    in their particular fields. Maybe we should try to communicate this idea.


    # CONCLUsION


    The SEC, started in 1996, has attracted more than 1000 students so far. Very few
    switched to CS later (which is comparatively easy). Many graduates have expressed
    their view that they have acquired very useful knowledge and experience. The curriculum
    has been influential in many other German universities, though nowhere else has
    a complete software engineering curriculum been established.


    Very soon, the SEC will be replaced by an undergraduate course leading to a bachelor’s
    degree. Most, though not all, features will survive. A master’s degree offering
    some specialisation will soon be added.


    # REFERENCEs


    Brooks, F.P. (1987). No silver bullet – Essence and accidents of software engineering.
    IEEE Computer, 20(4), 10-19.'
