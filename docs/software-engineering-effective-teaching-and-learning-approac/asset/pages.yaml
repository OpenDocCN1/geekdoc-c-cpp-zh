    moderately agree (4), agree (5) and strongly agree (6); where the number in brackets
    is the score associated to each choice. Table 2 contains 6 of the 18 sentences
    that compose the attitudinal survey. Note that each sentence is labeled with a
    word (“positive” or “negative”) that refers to the expected trend for the sentence’s
    results when comparing surveys at the beginning and end of the course.


    Table 3 summarizes results from the sentences contained in Table 2. These results
    are obtained from 134 students of the course that was offered in the 2005-2006
    academic year. The first column indicates the number of the sentence. The second
