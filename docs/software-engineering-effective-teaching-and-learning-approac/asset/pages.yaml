  md: 'ing undergraduate programs, it is no surprise that many faculty have encountered
    issues similar to the ones we encounter, and many of the approaches we suggest
    here are being used in other institutions. The use of cooperative and collaborative
    learning approaches, active learning, and pair programming facilitate the integration
    of teams where there are differences in the abilities of team members, assist
    team members in overcoming communications barriers, and help to motivate students
    in the team setting (Ellis, 2000; Aller, 2004; Doerschuk, 2004; Spickard-Prettyman,
    2004; Mickle, 2004; Layman, 2005). Assessment of team projects is difficult and
    time-consuming, and most effective approaches include reviews and engineering
    notebooks (Meyer, 2005; Cooley, 2004). There are many ways to attempt to give
    academic projects a “real world” flavor by incorporating real clients (for example,
    see Ford 2004 and Bruhn 2004).


    # FUTURE TRENDS


    The need for technology workers in the United States in the near future will continue
    to grow (Holahan, 2007; McGee, 2007a). The need for reliable software outstrips
    our ability to produce it. The President’s Council of Advisors on Science and
    Technology (PCAST, 2007) reports on the importance of networking and information
    technology (NIT) systems connected with the physical world. These include embedded
    systems, engineered systems, and cyber-physical systems, e.g., home health-care
    devices, ground transportation monitoring, and environmental monitoring. The ability
    to design and develop safety-critical and secure NIT systems is a national priority.
    There will be a need to educate a workforce that can work in multidisciplinary
    environments with a strong understanding of security and verification. In addition,
    employers will continue to seek project management, communications, and team skills
    (McGee, 2007b). Team skills that include the ability to work with members


    in different places, different time zones, and different cultures will become
    more common. The trend towards distributed team development (see for example Ramesh
    2002 and Duarte 2006) and multidisciplinary software development will continue.
    An example of this is the trend towards service orientation (SO), where applications
    are constructed from resources made available over the Internet as web or grid
    services. The term SO refers to the level of abstraction in which functionality
    is specified. In particular, SO is an approach for analysis, design, and development
    of modules that support principles such as reusability, loose coupling, abstraction,
    and separation of concerns (Erl, 2005). The more familiar term service-oriented
    architecture (SOA) is used to describe “the policies, practices, and frameworks
    that enable application functionality to be provided and consumed as sets of services”
    (Sprott, 2004).


    There will be a need to integrate existing software services and components to
    rapidly produce software solutions. Application developers from business and scientific
    domains are using web services to implement systems based on the SOA paradigm.
    Web service technologies provide the necessary mechanisms to expose shareable
    resources (service-oriented modules that provide data and functionality) over
    the network and allow the resources to be consumed by users across heterogeneous
    platforms, enhancing interaction across organizations. The needed skills include
    the ability to specify functionality of services so that services can be advertised
    and discovered.


    The Department of Labor’s Bureau of Labor Statistics projects that over the 2004-2014
    decade there will be increases of 46% for software engineers (Hecker, 2005). There
    is a strong need for software engineers who are familiar with software development
    tools such as automated testing tools and systems that assist developers in generating
    code from designs. The separation between CS and SE will increase, but the need
    for developers'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'will require that we produce capable developers in CS programs.


    # CONCLUsION


    The ARG model focuses on the development of the student. We use the cooperative
    learning and the development of skills by using the iterative feedback aspects
    of the ARG model to teach the software engineering capstone course. The course
    raises the level of our students to meet the needs and expectations of our constituents,
    the industry recruiters. The Instruction-Practice-Apply approach utilizes repeated
    application of software engineering techniques to a real-world problem and extensive
    interaction with experienced software engineers to teach students the practice
    of software engineering. As the ARG model suggests, we use structured and deliberate
    techniques to teach students how to work together to produce software engineering
    deliverables and resolve conflicts. Feedback from our industrial partners indicates
    that the team experience and the project are invaluable to our students. Feedback
    from our alumni and students indicate that theses experiences have a significant
    impact on their careers by preparing them for the workplace.


    CC 2001 (2001, p. 43) describes the importance of developing complementary curriculum,
    i.e., the constellation of skills that are taught through internship, such as
    the ability to write an effective résumé, manage time effectively, conduct library
    research, maintain professional responsibility, remain up current in the field,
    and engage in life-long learning. As described in this paper, it is clear that
    the UTEP SE approach provides the benefits of complementary curriculum by supporting
    the development of a set of transferable skills that enhance the students overall
    efficacy and ability to effectively contribute to the software engineering workforce.


