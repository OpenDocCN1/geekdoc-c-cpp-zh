  md: '# Table 2. continued


    | 3-Part I | Week 4 | Revised Specification | Based on instructor comments, a
    revised and expanded/enhanced specification is due. |

    | 3-Part II | Week 5 | Multi-Faceted Design | The design document requires the
    use of a design tool for UML and a detailed design organized into six tasks. Each
    student must be responsible for specific aspects of the design and must clearly
    identify their diagrams and documentation. The six tasks making contributing to
