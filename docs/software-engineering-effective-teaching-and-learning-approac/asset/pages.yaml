  md: 'stitute of Technology, of an academic course with the term “software engineering”
    in its title. For a variety of reasons, considerable time passed before courses
    with significant software engineering content became more common (Tomayko, 1998;
    Duggins 2002). Beginning in 1977, a number of graduate programs in software engineering
    were developed and began operation, including those at Seattle University, Texas
    Christian University, and the Wang Institute of Graduate Studies (Tomayko, 1998).
    At the undergraduate level, a number of computer science and computer engineering
    programs incorporated one or two courses in software engineering, typically taught
    using survey textbooks that offered reasonable breadth but relatively little depth.
    Although undergraduate software engineering programs began to emerge internationally
    as early as 1985 (Joint Task Force on Computing Curricula, 2004), it was not until
    1996 that the Rochester Institute of Technology initiated what was to become,
    in 2003, one of the first four software engineering programs to receive accreditation
    in the United States; the other programs in this group were offered by Clarkson
    University, Milwaukee School of Engineering, and Mississippi State University.


    While we recognize that software engineering programs in other countries have
    been accredited by accrediting agencies in those countries, this chapter addresses
    only the history and experiences of software engineering programs that have achieved
    accreditation in the United States. It is hoped that the material presented here
    will be of value to software engineering educators in both the United States and
    around the world.


    # AbET AND ENGINEERING PROGRAM ACCREDITATION


    ABET, Inc., formerly known as the Accreditation Board for Engineering and Technology,
    is the recognized accreditation body in the United States for college and university
    programs in


    applied science, computing, engineering, and technology. It is a federation of
    professional and technical societies (28 at present) representing those fields.
    ABET accreditation activities are managed by four commissions; the two most directly
    related to software engineering are the Engineering Accreditation Commission (EAC)
    and the Computing Accreditation Commission (CAC). Like other engineering disciplines,
    software engineering falls under the EAC, while the CAC is responsible for computer
    science, information systems, and information technology. In possible contrast
    to some other disciplines, accreditation has historically been an expected attribute
    of United States engineering programs, and is thus an important concern for software
    engineering educators.


    Each discipline has an associated “lead society”, which is one of the member societies
    of ABET. This society has primary responsibility for defining discipline-specific
    accreditation criteria, as well as for selecting, training, and evaluating program
    evaluators. Initially, the lead society for software engineering was the Institute
    of Electrical and Electronic Engineers (IEEE), which prepared the original version
    of the software engineering program criteria (Engineering Accreditation Commission,
    1999, p. 47), discussed later in this chapter.


    With the integration of ABET and the Computing Sciences Accreditation Board (CSAB)
    in November 2001, CSAB took over the role of lead society for software engineering,
    and the IEEE became a “cooperating society.” Unlike the IEEE and most other member
    societies of ABET, CSAB is not itself a membership society. Instead, the current
    members of CSAB are three other professional societies: the Association for Computing
    Machinery (ACM), the IEEE Computer Society (IEEE-CS), and the Association for
    Information Systems (AIS).


    From the point of view of a software engineering program seeking initial accreditation,
    the process begins with a request for evaluation,'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'which must be submitted by January of the year in which an evaluation visit
    is being requested. Since ABET policies require that a program have at least one
    graduate at the time of the evaluation visit, the request for evaluation is generally
    submitted in the year when the first graduates are anticipated.


    Of course, the work of program and curriculum definition must begin much earlier.
    It is common for program faculty to attend ABET faculty workshops and to send
    representatives to training sessions for ABET program evaluators, in order to
    gain familiarity with the accreditation criteria, process, and practices. The
    program must also define its educational objectives and outcomes, discussed in
    more detail below.


    Once the request for evaluation has been submitted, the next task is to complete
    the self-study report, which provides detailed data and evidence to show that
    the program meets the applicable accreditation criteria. The self-study report
    is based on an ABET-provided template (Engineering Accreditation Commission, 2007a)
    and must be submitted by the end of June during the year in which the request
    was made.


    The evaluation visit takes place in the fall. The visiting team consists of a
    team chair (usually a member of the EAC) and at least one program evaluator (PEV)
    for each program to be evaluated. The minimum team size is three members (ABET,
    2006, p. 8), so it is possible that two program evaluators may be assigned to
    a single program if no other program is being evaluated during the same visit.
    Prior to the visit, the program evaluator examines the self-study report and related
    materials such as student transcripts. Ongoing communication with the program
    leadership helps to resolve as many issues as possible before the team arrives
    on campus. During the visit, the evaluator interviews faculty members and students,
    examines additional materials such as examples of student work, evaluates facilities,
    and gathers any other necessary information.


    During an exit session at the end of the visit, the accreditation team provides
    the institution with a summary of its evaluation. After the visit, the program
    has the opportunity to submit additional evidence, primarily to address any shortcomings
    that were identified during the visit. The team chair and program evaluators then
    prepare a draft statement of their findings, which is sent to the institution
    for comment. The final version of the statement incorporates any changes resulting
    from the institution’s “due process” response and is sent to the EAC for final
    action during the summer after the visit. If accreditation is granted, it is common
    practice to extend accreditation retroactively to the prior year graduates, since
    it was their work and curriculum that were examined during the accreditation review.


    # CRITERIA FOR ACCREDITATION


    The current engineering accreditation criteria (Engineering Accreditation Commission,
    2007) are based on a major revision originally known as Engineering Criteria 2000
    (often abbreviated as “EC2000” or “EC2K”). Prior versions of the criteria focused
    on detailed prescriptions and, in the view of many engineering educators, limited
    opportunities for flexibility and innovation. The revised criteria adopted an
    approach of setting general goals and assigning to individual programs the responsibility
    for demonstrating achievement of those goals through appropriate assessment and
    evaluation.


    Each of the ABET criteria for accrediting baccalaureate-level engineering programs
    addresses a specific area of concern. During 2007, changes to the numbering and
    organization of the criteria were proposed, as indicated in Table 1; these changes
    will take effect for the 2008-2009 accreditation cycle.


    Despite the change in organization, the content of each of the areas of concern
    has remained fairly'
