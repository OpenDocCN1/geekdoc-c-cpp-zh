- pgno: 291
  md: 'decided to encourage faculty member participation in workshops related to ABET
    accreditation and assessment.


    To meet the Program Criteria requirements for curricular breadth and depth, a
    number of programs have modified their courses and their curricula to insure that
    adequate coverage of topics such as verification, validation and maintenance.
    Some have developed completely new courses to address missing content or to provide
    additional depth in certain areas.


    While few of the programs from which data were collected reported unexpected benefits,
    those who have made improvements uniformly reported that the improvements made
    were beneficial and should have been made, with or without an accreditation process.
    In several cases program leaders agreed that the results of the accreditation
    review gave them leverage with both members of their faculty and with their institutions’
    administration to make appropriate improvements. And, finally, all agreed that
    having ABET accreditation gives credibility to their programs by certifying that
    their software engineering program is a real engineering program.


    # FUTURE DIRECTIONs


    At the time this chapter was being written, there were 35 undergraduate software
    engineering programs being offered by colleges and universities in the United
    States. Fifteen of them have been accredited by ABET. It appears likely that most
    of the remaining programs, which are not yet accredited, will be seeking initial
    accreditation within the next few years.


    Finally, the National Academy of Engineering has made a recommendation that the
    master’s degree should become the first professional degree accepted for entry
    into the engineering profession. Currently, ABET allows only one degree level
    at each institution in each field of engineering to be accredited. If the master’s
    degree becomes


    the entry point into the engineering profession, that would imply a policy or
    practice change for ABET to allow accreditation at both the masters and bachelors
    level or to award accreditation primarily at the masters level. There are several
    good arguments for and against each of these proposals. Only time will tell if
    any change will be made and what form that change is likely to take.


