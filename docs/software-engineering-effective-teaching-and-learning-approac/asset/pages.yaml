- pgno: 49
  md: 'learning. The result of the decoding process is a model of the skills identified
    as necessary within a discipline.


    Disciplines differ in the strategies and the ‘ways of thinking’ practitioners
    apply. However, although these are essential for both understanding the discipline
    and acting within it, they are not usually presented to students explicitly. Parnas
    and Clements (1986) suggest that, given an irrational design process (ie all design
    processes), the documentation should make it appear as though it were rational.
    They justify this faking of the appearance of rationality through the need to
    make the eventual maintenance task easier, as well as enabling new members of
    the design team to absorb knowledge about the project more easily. However, as
    some research (eg., Nguyen & Swatman, 2000) suggests, the process to such simplification
    is hidden and leads to unreal expectations in novice undertakings. According to
    Middendorf and Pace (1986), this dichotomy has led to a gap between strategies
    for learning and the skills necessary in specific disciplines.


    Therefore, although practitioner studies agree that the base case of content knowledge
    is covered in models used in university programmes, a closer look reveals the
    depth of the mismatch between practitioner needs and formal education for software
    development.


    # Practitioner Perspectives


    In his Point/Counterpoint discussion, Bach (1997) stated that one reason SE is
    not more seriously studied is the common industry belief that most of the books
    and classes that teach it are impractical An overview of the studies undertaken
    to gain a practitioner perspective indicates that such an indictment is not too
    far from the mark.


    Most of the studies noted below address the requirements for software development
    activities by examining the general importance of specific topics, as perceived
    by different stakeholders. Since different approaches are taken in gaining


    this knowledge from different target groups: surveys, focus groups, fora or interviews
    applied to experienced practitioners, managers, recruitment staff, students and
    recent graduates, as well as examination of job advertisements over the disciplines
    of IS, CS and Engineering, some insight into the practitioner perspective is possible.


    In IS practitioner studies since the early 1990s (eg., Trauth et al., 1993; Parker
    et al., 1999; Lee, 2004) a long term shift from programming and other technical
    subjects to business analysis and people-oriented skills is significant – a change
    in emphasis to both generic attributes and managerial knowledge. From the student
    perspective, awareness of the need for ‘career resilience’ has surfaced (Waterman,
    Waterman, & Collard, 1994), while a technology-relevant degree is less necessary.
    Lee (1999) concluded that academic programmes should emphasise information searching
    and problem formulation (as opposed to problem solving alone) so that students
    can deal more effectively with the challenges of industry. He noted that interpersonal
    communication accounts for the most important means of knowledge transfer in technological
    work, with team members as the most utilised inter-personal information source.


    From a later study Lee found that one of the reality shocks involved in the socialisation
    of new graduates to work was the onus of teaching themselves what they needed
    to know in order to perform the task successfully. He concludes


    > ...educators should also help students to develop their initiatives and abilities
    to deal with ill-structured problems. This would require approaches which emphasize
    independent learning and collaborative teamwork. (Lee, 2004, p 135)


    Fewer studies address the skills and knowledge needed in SE and CS. Turley and
    Bieman (1995) examined professional Software Engineers in an attempt to identify
    the competencies and demographics that contribute to ‘excellence’ in performance.
    They provide a set of thirty eight'
