    questions; stakeholders frequently change requirements, new technologies are announced
    daily, and computing facilities become unavailable. These unfortunate events that
    befall our students should be seen as learning opportunities in leveraging their
    process to work through these issues.


    The Enterprise approach is simple to implement: deal with it. Successful teams
    find ways to work though issues, not use them as excuses and beg for mercy from
    their stakeholders. To that end not only is there a healthy dose of “tough love,”
    but we often intentionally introduce disruptive events during projects and force
    students to solve


    them on-the-fly. Some examples of these events include:


    +   - *Rotate team members.* Teams may exchange members once each semester. This
    exchange is made unannounced, and teams are typically given a short time (a few
    days) to transfer knowledge and tasks to other team members.

    +   - *Cancel projects.* Projects that fall significantly behind or are judged
    to be on an unsuccessful track are cancelled. Team members are distributed to
    other projects.'
