  md: '# Closing Though Ts


    This chapter is far from exhaustive. For every idea we have shared, there are
    many more variants that we and others have tried. From the student’s point of
    view, taking an RPRCC can run the range from fun and stimulating to difficult
    and frustrating. In response to students’ laments about the workload and challenges,
    we often point out the value of using “war stories” from RPRCC experiences during
    employment interviews. A student’s explanation of how they or their team overcame
    adversity on their project is far more likely to impress an interviewer than is
    a story about an individual programming or database assignment.


    From the instructor’s point of view, teaching RPRCCs can be challenging, exhausting,
    frustrating, rewarding, time-consuming … and exactly the type of experience students
    need to prepare them for their futures. The glowing feedback, experienced by all
    of us, that “This was the most useful course I took as an undergraduate” gives
    anecdotal evidence of the importance of RPRCCs.


    As we continue to develop the RPRCC taxonomy, we plan to contribute to a repository
    of instructor-related, student-related, and client-related materials, each with
    variants appropriate to different educational goals and available resources. We
    hope that this chapter is a useful beginning.


