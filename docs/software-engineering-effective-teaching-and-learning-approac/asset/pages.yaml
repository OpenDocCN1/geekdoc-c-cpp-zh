  md: '+   6. **Skill coverage in the group:** An ideal team assignment balances success-critical
    skills, including management, programming/technical, writing, SE and testing experience,
    and industry experience.


    +   7. **Interview/travel plans:** No team should be composed of members who are
    all interviewing for jobs during the semester.


    +   8. **Nearness to graduation:** Minimize the potential effect of “senioritis”.


    Is it essential to balance all teams according to all of these factors? For some
    of us, the results have been mixed. Some teams run into difficulties even though
    on paper there is a balance of strengths in each of the areas. Other teams seem
    weak from the start, but manage to dig up the skills and shine, even though the
    indicators would have predicted otherwise. Pre-planning can go only so far – the
    rest is up to the team.


    # Team Formation by students


    Students often prefer to form their own teams. One risk is that individuals who
    know few of the other students or are perceived to have weaker skills can end
    up feeling slighted. In one author’s experience, allowing students to select their
    own teams is more successful among graduate students than undergraduates.


    To support the self-selection process, students must first understand the roles
    needed to make a team successful as well as the responsibilities associated with
    each role. Among many others, these roles might include: team manager; client
    contact; documentation manager; programmer; configuration manager; and tester.
    Students should also learn about the risks associated with forming a team that
    lacks members able and willing to serve in one or more of the required roles.
    Students must receive sufficient information about other class members to be able
    to consider relevant factors such as skills and compatibility of weekly schedules.
    This information can be


    posted in an easily accessible spot, for example in the protected area of a course
    management tool such as Blackboard or WebCT.


    To prepare for self-selection of teams, one of us provides students with a two-hour
    lecture on issues relating to roles and skill sets. Immediately after the lecture,
    students attend a half-hour “mixer” where they stand under a banner that identifies
    their preferred role. During the mixer, students begin to talk with others whom
    they have not previously met. Over the next week or so students form their own
    teams and inform the course staff of their decisions, with no fine-tuning by instructional
    staff.


    Regardless of how strongly an instructor stresses the skills required for the
    different roles, some groups of students will still form teams based purely on
    friendship or compatibility of another sort. In one case, a group of students
    with English as a second language, all very recently arrived in the United States,
    decided to form a team because they preferred to communicate in their native language.
    While they all had strong technical skills, the team failed miserably in their
    project because none of them could communicate with the client well enough to
    perform essential requirements engineering activities.


    # Teaching Teamwork


    Teamwork skills can be conveyed though lectures, readings, talks given by guest
    speakers, and collected reflections and examples (also referred to as organizational
    memory) from earlier offerings of the RPRCC. Some of us provide students with
    instruction on teamwork and other software development-related issues on an ongoing,
    or “just in time,” basis. This subsection discusses a few of the topics that we
    cover.


    Among the important team skills students can learn are how to be an effective
    facilitator for team meetings or team-client meetings, how to divide work among
    team members, and how to deal with problems such as conflict between team'
