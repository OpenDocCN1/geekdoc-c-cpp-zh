    In this section we discuss categories of projects, from custom development at
    one end of the spectrum to research-oriented projects at the other. We also explore
    considerations for vetting projects, including project demands, academic challenges,
    and post-delivery considerations.


    # Project Categories


    Our collective experience includes a broad variety of project types: custom software
    designed and implemented from scratch; projects to enhance results from earlier
    offerings; applications that tie together multiple open-source or Commercial-Off-The-Shelf
    (COTS) products with “glue code;” tailoring open-source or COTS products that
    approximate the client’s needs; and projects that contribute to independent research
    and development (IRAD).


    In a custom development project, the team begins by developing requirements based
    on what might be a fairly vague problem statement. For weaker students enrolled
    in a one-semester RPRCC, this type of project may be too demanding. In a two-semester
    sequence, the work can be split, for example with the first semester devoted to
    requirements engineering and design and the second to implementation and testing.
    Another approach when working with weaker students is to accept only smaller projects,
    while a third is to allow larger projects that can be partitioned into easily
    integrated modules or packages. While the latter approach makes it possible for
    multiple teams to work on different modules in parallel with one another, the
    instructor must consider client capacity for working with multiple teams and may
    have to guide the process of partitioning the project and planning for incremental
    integration.


    Having teams enhance software produced by others can be an especially valuable
    experience. Studies have shown that in industry an average 60% of the work is
    maintenance and enhancement (Hanna, 1993; Glass, 2001), with initial job assignments
    for many software developers focused on these tasks. Enhancement projects arise
    for a variety of reasons: perhaps an earlier team had to scale back from the original
    requirements; it may be the next step in an iterative development plan for a project
    too large for a one-semester course; or the client may have gained insights for
    how to expand a product or make it more useful. In a later RPRCC, possibly one
    devoted to learning maintenance and enhancement skills, such a project can be
    continued by a different team. In any case, the new team must use the documentation
    and other artifacts produced by the original development team, so the experience
    is likely to teach them the importance of readable project artifacts and well-documented
    code. In getting started on an enhancement project, the team must review the artifacts
    from the existing version(s) of the application to understand the requirements
    and possible solutions that were tried. Generally, the team’s task will include
    updating and extending the artifacts, although some teams decide to start over
    from scratch rather than modifying earlier work. In the latter case, the team
    should be required to justify starting over with a reason other than NIH (Not
    Invented Here). In one enhancement project, a team worked for a humanities professor
    to modify a database with the full corpus of the medieval French poet who was
    this professor’s research focus. Two earlier teams had worked on this project
    in the context of a DB RPRCC. After the first class presentation by the latest
    team, the instructor realized that the software, including the DB schema, was
    poorly documented. The task for the newest team then became to document the schema
    in an acceptable fashion, rather than trying to correct all the'
