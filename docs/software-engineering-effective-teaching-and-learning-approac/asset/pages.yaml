    1 are revisited for greater conceptual depth later in the sequence.


    Course 2 covers topics typically not included in traditional computing programs,
    but ones we believe essential to becoming a better programmer. The foundation
    of most topics in Course 2 comes from the Agile community, where code-level quality
    best practices are emphasized more than in other process models. Lectures in Course
    2 cover conceptual foundations, while lab sessions put the concepts into practice.
    For example, the Configuration Management topic includes concepts like codeline
    quality thresholds, codeline branching patterns, and connections to release management;
    the lab has students create sandboxes, perform checkouts, updates, and merges.
    Course 2 students play the role of software developer, configuration manager,
