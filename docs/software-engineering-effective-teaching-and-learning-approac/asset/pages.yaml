  md: '# Chapter XV


    Continuous Curriculum Restructuring in a Graduate Software Engineering Program................................
    278


    Daniela Rosca, Monmouth University, USA

    William Tepfenhart, Monmouth University, USA

    Jiacun Wang, Monmouth University, USA

    Allen Milewski, Monmouth University, USA


    The development, maintenance and delivery of a software engineering curriculum
    present special challenges not found in other engineering disciplines. The continuous
    advances of the field of software engineering imposes a high frequency of changes
    reflected in the curriculum and course content. This chapter describes the challenges
    of delivering a program meeting the needs of industry and students. It presents
    the lessons learned during 21 years of offering such a program, and dealing with
    issues pertaining to continuous curriculum and course content restructuring, and
    the influence of the student body on the curriculum and course content. The chapter
    concludes with the authors’ recommendations for those who are seeking to create
    a graduate program in software engineering, with a special note on the situations
    where an undergraduate and graduate program will need to coexist in the same department.


    # Chapter XVI


    How to Create a Credible Software Engineering Bachelor’s Program: Navigating the
    Waters of Program Development................................................................................................................
    298


    Stephen Frezza, Gannon University, USA

    Mei-Huei Tang, Gannon University, USA

    Barry J. Brinkman, Gannon University, USA


    This chapter presents a case study in the development of a Software Engineering
    (SE) Bachelor’s Degree program. It outlines issues in SE program development,
    various means to address those issues, and explains how the issues were addressed
    in the initial and ongoing development of an undergraduate SE program. By using
    SEEK and SWEBOK as requirements sources to define what an undergraduate software
    engineer needs to know, the authors walk through the creation of a sample curriculum
    at a small, comprehensive university in the United States. Both the current and
    initial curricula are presented. The chapter discusses many items to consider
    in the process of planning and launching a new BSSE program, such as accreditation,
    curriculum guidelines, sources of information, and potential problems.


    # Section VII

    Professional Practice


    # Chapter XVII


    Ensuring Students Engage with Ethical and Professional Practice Concepts...............................................
    327


    J. Barrie Thompson, University of Sunderland, UK


    The teaching and learning of aspects related to ethics and professional practice
    present significant challenges to both staff and students as these topics are
    much more abstract than say software design and testing. The core of this chapter
    is an in-depth examination of how ethics and professional practice can'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'be addressed in a very practical manner. To set the scene and provide contextual
    information the chapter commences with information on an international model of
    professionalism, a code of ethics for Software Engineers, and different teaching
    and learning approaches that can be employed when addressing ethical issues. The
    major part of the chapter is then devoted to detailing a particular teaching and
    leaning approach, which has been developed at the University of Sunderland in
    the UK. Finally conclusions, views on the present situation and future developments,
    and details of outstanding challenges are presented.


    # Chapter XVIII


    An International Perspective on Professional Software Engineering Credentials...................................
    351


    Stephen B. Seidman, University of Central Arkansas, USA


    This chapter provides an international perspective on professional software engineering
    credentials. It distinguishes between professional licensing, certification, and
    other forms of credentials. It compares and contrasts several major approaches
    to professional credentials: broad-based certifications, national examinations,
    and job frameworks. Examples of credentials in each category are discussed in
    detail. The chapter also discusses efforts to develop international standards
    for these credentials. The chapter concludes with a brief description of the current
    landscape of professional software engineering credentials.


