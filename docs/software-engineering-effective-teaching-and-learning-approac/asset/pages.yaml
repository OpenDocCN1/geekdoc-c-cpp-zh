  md: 'semester-long project. During this course the students attend lectures on the
    various phases of the software development life cycle, and develop, deliver and
    orally present and demonstrate milestones including a rapid prototype, specification/analysis,
    design, and testing. The final delivery milestone includes a presentation that
    demonstrates the degree to which each team meets the acceptance test plan given
    at the start of the course. The Naval Academy’s capstone course is similar to
    UConn’s CSE293 which is described in the following discussion.


    The content of the UConn’s CSE293 capstone course is reflected in its description:


    This course is the second semester of the required major design experience. In
    one semester-long team project, students will propose, design, produce, and evaluate
    a software and/or hardware system. The project will culminate in the delivery
    of a working system, a formal public presentation, and written documentation.
    Oral and written progress reports are required.


    In CSE293, the students organize their own teams, choose the project topic, determine
    team responsibilities, plan the prototyping schedule, and so on; the instructor
    is the project manager


    with the role of insuring that the project deadlines are met and that disputes
    among team members are resolved in a timely fashion. CSE293 is intended to demonstrate
    the ability of the students to work as a team with limited or minimal guidance.
    The course is offered in a section of up to 18 students organized into teams.
    Our one-semester capstone design course is consistent with other approaches (Ellis
    & Mitchell, 2004; Flener 2006).


    In CSE293, the first half of the semester involves identifying the project topic
    (further discussed in the following sections), developing a comprehensive specification,
    performing a comprehensive and detailed design, and establishing milestones for
    prototyping deliverables and allocating work among teammates. Throughout each
    of these milestones, the instructor provides comments in different media (oral,
    email, written) to guide each team in a positive direction. The second half of
    the semester is for prototyping and assessment with multiple deliverables.


    In terms of the course assignments, complete CSE293 details are available at http://www.engr.uconn.edu/~steve/Cse293/cse293.html
    and the specific course assignments are summarized in Table 2 and briefly reviewed
    below.


    CSE293 meets formally once a week for a 2 hour block for a total of 14 weeks;
    the entire class


    # Table 2. CSE293 assignment description and timeline


    | Assignment | Due | Title | Description |

    |---|---|---|---|

    | 1-Part I | Week 1 | Establish Teams | Students are organized into teams of size
    four to six and informally discuss possible project topics. |

    | 1-Part II | Week 2 | Preliminary Project Idea | Each team submits a 1-2 page
    project topic proposal for instructor critique. Team responds to critique, prepares
    a five page proposed project description, and presents their proposal. All presentations
    in the course are made to the instructor and the rest of the class. |

    | 2 | Week 3 | Specification and Software Quality Analyses | Teams submit a 10-12
    page specification of their proposed project topic. Required sections are delineated
    by the instructor, and each student must identify the sections that they have
    written. In addition, each student selects two software characteristics (performance,
    reliability, reusability, etc.) and discusses the relevance/importance of the
    quality to their project topic and the way that it will be attained in their project
    topic. |'
