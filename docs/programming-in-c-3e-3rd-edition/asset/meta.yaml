  - 2. **间接算法**：在此类算法中，会执行重复性步骤。具体需要重复多少次是未知的。
- - '######'
  - 1. **确定性**：确定性算法基于根据条件遵循“是”路径或“否”路径。在这一类算法中，当控制流遇到决策逻辑时，会显示“是”和“否”两条路径。程序控制根据条件遵循其中一条路线。
- - '######'
  - 2. **非确定性**：在此类算法中，为了得到解决方案，我们有多条路径中的一条。
- - '######'
  - 3. **随机算法**：在执行几个步骤后，程序的控制会随机转移到另一个步骤，这被称为随机算法。
- - '######'
  - '**无限算法**：这种算法基于对结果的更好估算。所需的步骤数无法预先知晓。过程将持续直到出现最佳结果。为了最终的收敛，还需要更多的迭代。'
