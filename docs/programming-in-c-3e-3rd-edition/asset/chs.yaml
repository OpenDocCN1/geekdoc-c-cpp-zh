  \n### 15.7 鼠标编程\n\n![image](img/aero.png) 15.20 编写一个程序显示鼠标点击的状态并将鼠标限制在屏幕上指定的坐标之间。使用\
  \ `int86()` 函数调用不同的 ROM-BIOS 服务。\n\n```c\n# include <process.h>\n# include <dos.h>\n\
  # include <graphics.h>\n\nunion REGS i,o;\nint initmouse(void);\nvoid showarrow(void);\n\
  void mousearea(int, int, int);\n\nvoid main()\n{\nint gd=DETECT, gm,maxx,maxy,button,x,y;\n\
  initgraph(&gd,&gm,“C:\\\\tc”);\nmaxx=getmaxx();\nmaxy=getmaxy();\nrectangle(0,56,maxx,maxy);\n\
  setviewport(1,57,maxx-1,maxy-1,1);\ngotoxy(26,1);\nprintf(“\\n Mouse pressed”);\n\
  if(initmouse()==0)\n{\nclosegraph();\nrestorecrtmode();\nprintf(“\\n Mouse driver\
  \ not found”);\nexit(1);\n}\nmousearea(0,100,maxx-50,maxy-10);\nshowarrow();\ngotoxy(52,3);\n\
  printf(“\\n Press any key to exit”);\nwhile(!kbhit())\n{\n  m_pointerat(&button,&x,&y);\n\
  \  gotoxy(5,3);\n  (button & 1)==1 ? printf(“LEFT”) : printf(“****”);\n  gotoxy(20,3);\n\
  \  (button & 2)==2 ? printf(“RIGHT”) : printf(“*****”);\n  gotoxy(65,2);\n  printf(“Cursor\
  \ Position”);\n  gotoxy(65,3);\n  printf(“X=%03d y= %03d”,x,y);\n}\n}\ngetche();\n\
  closegraph();\nrestorecrtmode();\n}\n```\n\n\n\n\n\n```\nvoid mousearea(int x1,int\
  \ y1,int x2,int y2)\n{\n    i.x.ax=7;\n    i.x.cx=x1;\n    i.x.dx=x2;\n    int86(0x33,&i,&o);\n\
  \    i.x.ax=8;\n    i.x.cx=y1;\n    i.x.dx=y2;\n    int86(0x33,&i,&o);\n}\n\nvoid\
  \ m_pointerat(int *button, int *x,int *y)\n{\n    i.x.ax=3;\n    int86(0x33,&i,&o);\n\
  \    *button=o.x.bx;\n    *x=o.x.cx;\n    *y=o.x.dx;\n}\n```\n\n**解释：**\n\n在上述程序中，`initgraph()`\
  \ 函数将模式从文本切换到图形模式。`DETECT` 是一个宏，请求 `initgraph()` 设置图形驱动程序。`getmaxx()` 和 `getmaxy()`\
  \ 函数获取屏幕上可用的最大行和列数。`setviewport()` 函数定义视口区域，将绘制操作限制在该区域内。\n\n`initmouse()` 函数检查鼠标驱动程序是否已加载。如果鼠标未初始化，`closegraph()`\
