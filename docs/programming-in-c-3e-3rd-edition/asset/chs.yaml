  am Indian\n\n### 解释\n\n在上述示例中，输入了 `text1[]` 和 `text2[]`。`strcat()` 函数连接了两个字符串。\n\
  \n![image](img/aero.png) 8.27 编写一个程序，不使用函数连接两个字符串。\n\n```c\n# include <string.h>\n\
