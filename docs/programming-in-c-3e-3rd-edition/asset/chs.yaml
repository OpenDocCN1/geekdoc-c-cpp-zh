  \n\n\n\n        \n\n\n\n位域为存储值提供了所需的精确位数。如果一个变量值为 1 或 0，那么我们需要一个位来存储它。同样，如果变量的范围在\
  \ 0 到 3 之间，那么两个位就足够存储这些值。类似地，如果一个变量取值在 0 到 7 之间，那么三个位就足够包含该变量，依此类推。变量所需的位数由非负整数后跟冒号来指定。\n\
  \n为了存储信息，我们使用变量。`char` 至少占用一个字节，`int` 占用两个字节。如果使用位域而不是完整的整数，就可以节省内存。例如，为了了解有关车辆的信息，必须在内存中存储以下信息：\n\
  \n1. 汽油车\n2. 柴油车\n3. 两轮车\n4. 四轮车\n5. 老款\n6. 新款款\n\n为了存储上述信息的状态，我们可能对于燃料类型需要两个位，以判断车辆是汽油型还是柴油型。对于车辆类型需要三位，以判断车辆是两轮车还是四轮车。同样，车辆型号需要三位。存储这些信息所需的总位数为\
  \ 8 位，即 1 字节。这意味着所有信息可以封装进单个字节中。最终，位域被用于节省内存。从上面可以证明，使用位域节省的内存将是巨大的。\n\n然而，位域在使用数组时存在限制。不允许使用位域数组。此外，不能直接使用指针对位域进行寻址，尽管使用成员访问运算符\
  \ `->` 是被允许的。匿名位域可以用于填充，也可以用于对齐目的。上述问题的结构如下：\n\n```c\nstruct vehicle\n{\nunsigned\
  \ type: 3;\nunsigned fuel: 2;\nunsigned model: 3;\n};\n```\n\n上述声明中的冒号 `:` 告诉编译器结构体中使用使用了位域，后面的数字表示为该字段分配的位数![img](img/aero.png)\
  \ 13.21 写一个程序来存储车辆信息。使用位域存储信息状态。\n\n```c\n#define PETROL 1\n#define DISEL 2\n#define\
  \ TWO_WH 3\n#define FOUR_WH 4\n#define OLD 5\n#define NEW 6\n\nvoid main()\n{\n\
  struct vehicle\n{\nunsigned type: 3;\nunsigned fuel: 2;\nunsigned model: 3;\n};\n\
  struct vehicle v;\nv.type=FOUR_WH;\nv.fuel=DISEL;\nv.model=OLD;\nclrscr();\nprintf(\"\
  \\n Type of Vehicle : %d\",v.type);\nprintf(\"\\n Fuel : %d\",v.fuel);\nprintf(\"\
  \\n Model : %d\",v.model);\n}\n```\n**输出：**\nType of Vehicle: 4\nFuel: 2\nModel:\
  \ 5\n\n**解释：**\n在上述程序中，声明了 `#define` 宏。车辆信息由整数 1 到 6 之间表示。声明了带有位域的结构体 `vehicle`。初始化了每个成员所需的位数。根据程序，车辆类型需要\
  \ 3 位，燃料需要 2 位，模型（model）需要 3 位。声明了一个对象 `v`。使用对象对位域进行了数据初始化。程序的输出显示了存储在位域中的整数值，这可以通过程序开始的宏定义进行验证![img](img/aero.png)\
