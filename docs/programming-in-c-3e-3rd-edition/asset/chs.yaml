  \n在开始任何绘图操作之前，我们需要初始化图形模式。`initgraph()` 函数会寻找最佳图形模式并将相应的数值设置在变量 `gm` 中。通过 `gm` 的值，我们可以找到显示器的详细信息，如类型、分辨率、视频页数和支持的颜色。\n\
  \n变量 `gd` 用于图形驱动程序。图形驱动程序是设备驱动程序的子集，仅在图形模式下使用。图形驱动程序文件的扩展名为 `.bgi`。根据适配器的类型，会选择其中一个支持的设备驱动程序文件。在图形模式下，光标会消失，控制台的左上角\
  \ `(0,0)` 被视为起点。\n\n上述程序根据给定的值绘制圆、圆弧、椭圆和直线。用户可以为不同的形状设置不同的值。\n\n###### 15.4.1 移动月亮的程序\n\
