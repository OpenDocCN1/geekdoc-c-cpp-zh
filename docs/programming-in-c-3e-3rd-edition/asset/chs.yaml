  \n```c\nvoid main()\n{\nint i,j,sum=0,a[10];\nclrscr();\nprintf(“Enter ten numbers\
  \ :”);\nfor(i=0;i<10;i++)\n{\n  scanf(“%d”,&a[i]);\n  sum=sum+a[i];\n}\nprintf(“Numbers\
  \ In Ascending Order :”);\nfor(i=0;i<=sum;i++)\n{\n  for(j=0;j<10;j++)\n  {\n  \
  \  if(i==a[j])\n      printf(“%3d”,a[j]);\n  }\n}\nprintf(“\\nNumbers In Descending\
  \ Order :”);\nfor(i=sum;i>=0;i--)\n{\n  for(j=0;j<10;j++)\n  {\n    if(i==a[j])\n\
