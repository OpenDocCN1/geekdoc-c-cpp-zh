  \ 编写一个程序将二进制数转换为等值的十进制数。\n\n```c\n# include <math.h>\n# include <process.h>\nvoid\
  \ main()\n{\nlong n;\nint x,y=0,p=0;\nclrscr();\nprintf(“\\n Enter a Binary Number\
  \ :”);\nscanf(“%ld”,&n);\nwhile(n!=0)\n{\n  x=n%10;\n  if(x>1 || x<0)\n  {\n   \
  \ printf(“\\n Invalid Digit.”);\n    exit(1);\n  }\n  y=y+x*pow(2,p);\n  n=n/10;\n\
  \  p++;\n}\nprintf(“\\n Equivalent Decimal Number is %d.”,y);\ngetche();\n}\n```\n\
  **OUTPUT:**\nEnter a Binary Number : 1111\nEquivalent Decimal Number is 15\nEnter\
  \ a Binary Number : 120\nInvalid Digit.\n\nExplanation:\n在上述程序中，输入二进制数。在每次迭代中使用了方程\
  \ `y=y+x*pow (2,p)`，其中 `y` 初始化为 0。变量 `x` 通过取模运算获得，这分离了输入数字的每一位，变量 `p` 作为基数 2 的指数。它初始为\
  \ 0，并在每次迭代中加 1，`p` 的范围从 0 变为位数减 1。乘积 `(x*pow (2,p))` 加到 `y` 的之前值上。\n\n![img](img/aero.png)\
