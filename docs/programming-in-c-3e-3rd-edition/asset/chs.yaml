  \    closegraph();\n    restorecrtmode();\n}\n```\n\n***Explanation:***\n\n执行程序后，将显示字符串“AMOL”。这是通过给\
  \ `settextstyle()` 函数传递不同的值实现的。另一个新函数是 `settextjustify()`，它负责文本的对齐。该函数在下面的程序中解释。\n\
