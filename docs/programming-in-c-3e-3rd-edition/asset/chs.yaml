  ch=name;\n/*字符串的基地址 */\nwhile (*ch!=’0’)\n{\n  printf(“%c”,*ch);\n  ch++;\n}\n}\n\
  ```\n\n**输出：**\n\nEnter Your Name : KUMAR\nKUMAR\n\n**解释：**\n\n在这里，指针 `ch` 被赋值为字符串的基地址。`while`\
  \ 循环在遇到空字符（'0'）之前不断打印字符并移动指针。当指针遇到空字符时，循环终止程序。\n\n![img](img/aero.png) 9.35 写一个程序，使用指针查找给定字符串包含和不包含空格的长度。\n\
  \n```c\nvoid main()\n{\nchar str[20],*s;\nint p=0,q=0;\nclrscr();\nprintf(“Enter\
  \ String :”);\ngets(str);\ns=str;\nwhile(*s!=‘0’)\n{\n  printf(“%c”,*s);\n  p++;\n\
  \  s++;\n  if(*s==32) /*空格的 ASCII 值为 32*/\n  q++;\n}\nprintf(“\\nLength of String\
  \ including spaces : %d”,p);\nprintf(“\\nLength of String excluding spaces : %d”,p-q);\n\
  }\n```\n\n**输出：**\n\nEnter String : POINTERS ARE EASY\nPOINTERS ARE EASY\nLength\
  \ of String including spaces : 17\nLength of String excluding spaces : 15\n\n**解释：**\n\
  \n上述程序与上一个相似。在这里，计数变量 `*p` 和 `*q` 通过递增来计算字符串中字符和空格的数量。空格的 ASCII 值为 32。因此，在程序结束时打印这两个长度。\n\
  \n![img](img/aero.png) 9.36 写一个程序，使用指针交换字符数组元素。\n\n```c\nvoid main()\n{\nchar *names[]=\n\
  {\n  “kapil”,\n  “manoj”,\n  “amit”,\n  “amol”,\n  “pavan”,\n  “mahesh”\n} ;\nchar\
  \ *tmp;\nclrscr();\nprintf(“Original : %s %s”,names[3],names[4]);\ntmp=names[3];\n\
  names[3]=names[4];\nnames[4]=tmp;\nprintf(“\\nNew : %s %s”,names[3],names[4]);\n\
  }\n```\n\n**输出：**\n\nOriginal : amol pavan\nNew : pavan amol\n\n**解释：**\n\n在上述程序中，字符数组\
  \ `*names[]` 被声明并初始化。声明了另一个字符指针 `*tmp`。将要替换的目标名称赋值给变量 `*tmp`。目标名称被源名称替换，源名称被 `*tmp`\
  \ 变量替换。因此，通过简单的赋值语句就可以交换两个名称。\n\n\n\n\n```c\nint c=0, l=0;\n\nclrscr();\n\nprintf(“\\\
  n Enter First String :”);\n\ngets(str1);\n\nprintf(“\\n Enter Second String :”);\n\
  \ngets(str2);\n\na=str1;\n\nb=str2;\n\nprintf(“\\n Similar Characters Found in Both\
  \ String.”);\n\nwhile(*a!=‘\\0’)\n\n{\n  if(stricmp(*a,*b)==0)\n  {\n    printf(“\\\
  n\\t%c \\t%c”,*a,*b);\n    l++;\n  }\n  else\n  c++;\n\n  a++;\n\n  b++;\n}\n\n\
  if(c==0)\nprintf(“\\n The String are Identical.”);\nelse\nprintf(“nThe Strings are\
  \ different at %d places.”,c);\nprintf(“\\n The Characters are similar at %d places.”,l);\n\
  ```\n\n**OUTPUT:**\n\nEnter First String : SU\nEnter Second String : MONDAY\nSimilar\
  \ Characters Found in Both String.\n\n| N | N |\n| D | D |\n| A | A |\n| Y | Y |\n\
