  \n![image](img/aero.png) 15.17 编写一个程序使用 `setfillstyle()` 恰当地填充矩形并显示其在 VDU 上的效果。\n\
  \n```c\n# include <graphics.h>\n# include <stdlib.h>\n\nvoid main()\n{\nint gd =DETECT,gm,x,y;\n\
