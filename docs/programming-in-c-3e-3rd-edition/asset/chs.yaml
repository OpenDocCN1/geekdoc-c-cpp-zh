  在上述程序中，`sqrt()` 函数返回 `9` 的平方根。`Log()` 输出结果 `1.60944`。`ceil()` 将 `10.3` 向上取整为 `11`，`pow()`\
  \ 计算 `3⁴`。以上函数均定义在 `math.h` 头文件中。\n\n![img](img/aero.png)\n\n**10.60 编写一个程序演示 `rand()`\
