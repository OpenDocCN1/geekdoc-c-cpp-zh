  \ String”,line2);\n}\n```\n\n**输出：**\n\nEnter Line1 : INDIA\n\nEnter Line2 : MY\
  \ COUNTRY.\n\nINDIA IS COUNTRY.\n\n### strcat() 函数\n\n此函数将目标字符串附加到源字符串。两个字符串的拼接将使用此函数完成。该函数的语法为\
