  \n### 章节目录\n\n- 7.1 引言\n- 7.2 数组声明\n- 7.3 数组初始化\n- 7.4 数组术语\n- 7.5 数组的特性\n- 7.6\
  \ 一维数组\n- 7.7 一维数组及操作\n- 7.8 数组操作\n- 7.9 预定义流\n- 7.10 二维数组及操作\n- 7.11 三维或多维数组\n\
  - 7.12 `sscanf()` 和 `sprintf()` 函数\n- 7.13 线性数组的缺点\n\n##### 7.1 引言\n数组是一种非常流行且实用的数据结构，用于在连续位置中存储数据元素。序列中存储了多个元素，因此也被称为复合数据结构。数组是一种线性数据结构。数组允许同质数据。这意味着相同类型的元素在内存中连续存储，并且位于同一个变量名下。它可以与非同质结构结合，创建出复杂的数据结构。我们知道对象数组也是很有用的。数组可以声明为任何标准类型或自定义类型。字符数组（字符串）的工作方式与整数数组、浮点数数组不同。考虑以下示例。一个整数类型的变量\
  \ `a` 初始被赋予某个值，随后更改了该值。\n\n```c\nvoid main()\n{\n    int a=2;\n    a=4;\n    printf(\"\
  %d\",a);\n}\n```\n**输出：**\n4\n\n在上面的示例中，打印的 `a` 的值是 4。在赋值 4 之前，a 被赋值了 2。当我们给 `a`\
  \ 赋值 4 时，`a` 中存储的值被替换。因此，普通变量一次只能存储一个值。这一事实对于所有数据类型都是相同的。但在许多应用程序中，变量必须被赋予多个值。这可以通过数组来实现。数组变量允许同时存储相同数据类型的元素/值。\n\
  \n##### 7.2 数组声明\n一维数组的声明可以先写数据类型，然后是变量名，最后用方括号括起数组大小。数组大小应该是整数常量且必须大于 0，数据类型应该是有效数据类型。例如，一维数组的声明如下：\n\
  \n```c\nint a[5];\n```\n它告诉编译器 `a` 是一个整数类型的数组，其大小为五个整数。编译器为每个整数元素留出 2 字节内存，即为存储五个整数留了\
  \ 10 字节。同样，数组的声明如下：\n\n```c\nint a[5];\n```\n它告诉编译器 `a` 是一个整数类型的数组，其大小为五个整数。编译器为每个整数元素留出\
  \ 2 字节内存，即为存储五个整数留了 10 字节。同样，不同类型的数组声明如下：\n\n```c\nchar ch[10];\nfloat real[10];\n\
  long num[5];\n```\n当我们声明变量时，例如：\n\n```c\nint x;\n```\n变量 `x` 被声明，并如图 7.1 所示分配了内存。\n\
  \n```c\nx=4;\n```\n**图 7.1 变量机制**\n每个变量都有一个名称，被赋值并存储在内存位置。因此，从上述可以看出，只给它赋值了一个值。这种方式，我们可以声明一维数组，也可以声明二维数组。二维数组是包含行和列的表格。例如，`int\
  \ a[3][3];` 通知编译器 `a` 是整数类型的数组，其大小为三个整数。该数组是一个三 3 矩阵。同样，我们可以这样声明多维数组：`类型数组名[size1][size2][size3]--------[sizeN]`。例如，以下数组声明了三维数组：`int\
  \ a[3][3][3];`。其细节在本章“三维或多维数组”节给出。\n\n##### 7.3 数组初始化\n数组初始化可以如下所示进行：\n\n```c\n\
  int a[5]={1,2,3,4,5};\n```\n在这里，五个元素存储在数组 `a` 中。元素列表在大括号内初始化。数组元素顺序存储在单独的位置。那么，问题在于如何从这组整数元素中单独调用每个元素。元素的读取从“0”开始。通过指示元素的位置，可以检索数组的任何元素。元素通过数组名加上元素编号来调用。\n\
  \n**表 7.1 调用元素**\n| a[0] 指第 1 个元素，即 1 |\n| a[1] 指第 2 个元素，即 2 |\n| a[2] 指第 3 个元素，即\
  \ 3 |\n| a[3] 指第 4 个元素，即 4 |\n| a[4] 指第 5 个元素，即 5 |\n\n**示例：**\n为了存储多个值，编程语言有一种名为数组的内置数据结构。\n\
  \n1. `int num[5];`\n在上面的声明中，声明了一个包含五个元素的整数数组。为五个整数（即连续的 10 字节）为 `num` 数组留了内存。要初始化\
  \ `num` 数组，可以使用以下语法。\n\n2. `int num[5] = {1,2,4,2,5};`\n在上述语句中，所有元素都已初始化。也可以通过数组名后的方括号中指定下标来初始化单个元素。\n\
  \n访问元素的方式如下：\n\n```c\nnum[0]=1;\nnum[1]=2;\n```\n\n\n\n\n```\nnum[2]=4;\nnum[3]=2;\n\
  num[4]=5;\n```\n\n初始化可以在编译时完成，也可以在运行时动态完成。上述是编译时初始化的示例。在语句 `(2)` 中，声明和初始化是同时完成；在此类声明中，不需要在方括号\
  \ `[]` 中说明元素的数量（五个）。编译器会自动计算初始化的值的个数，并将初始化的元素个数假设为数组的大小。\n\n在上述数组中，元素 `num[0]` 即\
  \ `1` 是下界，而 `num[4]` 即 `5` 是最后一个元素。在 `C` 和 `C++` 中，没有边界检查。因此，程序员必须在访问或存储元素时进行检查。一旦数组声明，其下界就无法更改，但上界可以扩展。数组名本身是一个常量指针，因此我们无法修改它。通过在连续的内存位置中存储元素可以扩展上界。\n\
  \n数组名本身是一个指针。数组 `num` 是指向第一个元素的指针，即 `num` 包含元素 `1` 存储的内存地址。存储在数组名中的地址称为基地址。`图 7.2`\
  \ 显示了图示表示。要访问单个元素，使用以下语法。\n\n![image](img/page223_1.png)\n\n**图 7.2** *整数数组*\n\n\
  `num[0]` 指 `1`\n`num[1]` 指 `2`\n`num[2]` 指 `4`\n`num[3]` 指 `2`\n`num[4]` 指 `5`\n\
  \n因此，数组是相同数据类型元素的集合，存储在唯一且连续的内存位置中。\n\n##### 7.4 数组术语\n\n**大小 (Size):** 数组中元素的数量或存储元素的容量称为其大小。它始终在方括号\
  \ `[]` 中注明。\n\n**类型 (Type):** 类型指的是数据类型。它决定了数组中存储什么类型的元素。它还指示编译器根据数据类型预留内存。\n\n\
  **基 (Base):** 第一个元素（第 0 个）的地址是基地址。数组名本身存储第一个元素的地址。\n\n**索引 (Index):** 数组名用于引用数组元素。例如，`num[x]`\
  \ 中，`num` 是数组名，`x` 是索引。`x` 的值从 `0` 开始，取决于数组的大小。索引值始终是一个整数值。\n\n**范围 (Range):** 数组的索引（即\
  \ `x` 的值）在从数组写入或读取元素时，从下界变化到上界。例如，在 `num[100]` 中，索引范围是从 `0` 到 `99`。\n\n**字长 (Word):**\
  \ 它表示元素所需的空间。在每个内存位置上，计算机可以存储一个数据单元。空间占用随机器而异。如果元素的大小大于 `word`（一个字节），则它占用两个连续的内存位置。数据类型\
  \ `int`、`float`、`long` 的变量在内存中需要的超过一个字节。\n\n### 7.5 数组的特征\n\n1. 声明 `int a[5]` 无非是在内存中创建了五个整数类型的变量。与其为五个值声明五个变量，不如程序员可以在数组中定义它们。\n\
  2. 数组的所有元素共享相同的名称，通过元素编号来相互区分。\n3. 数组中的元素编号对于调用每个元素起着主要作用。\n4. 数组的任何特定元素都可以单独修改，而不影响其他元素。\n\
  \n```\nint a[5]={1,2,3,4,8};\n```\n\n如果程序员需要将 `8` 替换为 `10`，则不需要更改 `8` 以外的所有数字。为了完成这项任务，可以使用语句\
  \ `a[4]=10`。在这里，其他四个数字保持不变。\n\n\n\n\n```c\nint num[5]={0},j;\n\nclrscr();\n\nfor(j=0;j<5;j++)\n\
  \    printf(“\\nnum[%d]=%d”,j,num[j]);\n\ngetche();\n}\n```\n\n**OUTPUT:**\n\nnum[0]=0\n\
  num[1]=0\nnum[2]=0\nnum[3]=0\nnum[4]=0\n\n**Explanation:**\n\n在上面的程序中，声明了一个数组 `num[5]`，并将第一个元素初始化为零。编译器会自动将所有元素初始化为零。使用\
  \ `for` 循环显示数组的内容，我们可以看到所有元素的值均为零。\n\n##### 7.6 一维数组\n\n数组元素以连续的顺序一个接一个地存储。数组的元素仅被排列在一个维维度上。它们可以用行或列的形式显示。一维数组使用单个下标来表示其元素。\n\
  \n数组初始化的示例：`− int a[5];` 在此处完成了数组的初始化。变量类型是整型；其变量名为 `a`，`5` 是数组的大小。\n\n整数数组 `a[5]`\
  \ 的元素存储在连续的内存位置中。假设起始内存位置为 `2000`。每个整数元素需要 `2` 字节。因此，后续元素在两个位置的间隔之后出现。[表 7.2] 显示了整数数组元素的位置。\n\
  \n**表 7.2** 整数数据类型及其内存位置\n\n![image](img/page227_1.png)\n\n同样，任何数据类型的数组元素都存储在连续的内存位置中。唯一的区别是不同数据类型的位置数量不同。\n\
  \n基于这一点，在下方说明了一个示例。\n\n![image](img/aero.png) 7.4 写一个程序，使用数组打印为各种数据类型预留的字节以及在内存中存储它们所需的空间。\n\
  \n```c\nvoid main()\n{\nint i[10];\nchar c[10];\nlong l[10];\nclrscr();\nprintf(“The\
  \ type ‘int’ requires %d Bytes”,sizeof(int));\nprintf(“\\nThe type ‘char’ requires\
  \ %d Bytes”,sizeof(char));\nprintf(“\\nThe type ‘long’ requires %d Bytes”,sizeof(long));\n\
  printf(“\\n %d memory locations are reserved for ten ‘int’ elements”,sizeof(i));\n\
  printf(“\\n %d memory locations are reserved for ten ‘char’ elements”,sizeof(c));\n\
  printf(“\\n %d memory locations are reserved for ten ‘long’ elements”,sizeof(l));\n\
  }\n```\n\n**OUTPUT:**\n\nThe type ‘int’ requires 2 Bytes\nThe type ‘char’ requires\
  \ 1 Bytes\nThe type ‘long’ requires 4 Bytes\n20 memory locations are reserved for\
  \ ten ‘int’ elements\n10 memory locations are reserved for ten ‘char’ elements\n\
  40 memory locations are reserved for ten ‘long’ elements\n\n**Explanation:**\n\n\
  `sizeof()` 函数提供数据类型以字节为单位的大小。在上面的示例中，`int`、`char` 和 `long` 类型的数据变量被传递给此函数，分别得到 `2`、`1`\
  \ 和 `4` 字节。`int`、`char` 和 `long` 需要的内存位置分别是 `2`、`1` 和 `4`。数组所需的内存位置 = 数组参数 × `sizeof(data\
  \ type)`。在上面的示例中，数组 `int i[10]` 需要 `20` 个内存位置，因为每个元素需要两个内存位置。各种数据类型的内存需求如 [表 7.3]\
  \ 所示。\n\n**表 7.3** 数据类型及其所需的字节\n\n| Data Type | Memory Requirement |\n| --- | ---\
  \ |\n| char | 1 bytes |\n| int | 2 bytes |\n| float | 4 bytes |\n| long | 4 bytes\
  \ |\n| double | 8 bytes |\n\n字符数组被称为字符串。整数数组和字符数组之间存在细微区别。在字符数组中，末尾会自动添加 `NULL`（`‘0’）字符，而在整数或其他类型的数组中，末尾不放置空字符/字符。\n\
  \n`NULL` 字符充当字符数组的结束。通过使用这个 `NULL` 字符，编译器可以检测字符数组的结束。当编译器读取到 `NULL` 字符 `‘0’` 时，字符数组结束。\n\
  \n*注意：* 关于字符串（字符数组）的详细信息见另一章节“字符串与标准函数”。本章简要说明了字符串的解释。\n\n下面是一个字符串的示例。\n\n![image](img/aero.png)\
  \ 7.5 写一个程序，显示带有地址的字符数组。\n\n```c\nvoid main()\n{\nchar name[10]={‘A’,’R’,’R’,’A’,’Y’};\n\
  int i=0;\nclrscr();\nprintf (“\\n Character Memory Location \\n”);\nwhile(name[i]!=‘\\\
  0’)\n{\n  printf (“\\n [%c]\\t\\t [%u]”,name[i],&name[i]);\n    i++;\n}\n}\n```\n\
  \n**OUTPUT:**\n\n| Character | Memory Location |\n| --- | --- |\n| [A] | 4054 |\n\
  | [R] | 4055 |\n| [R] | 4056 |\n| [A] | 4057 |\n| [Y] | 4058 |\n\n**Explanation:**\n\
  \n数组元素以连续的顺序一个接一个地存储。数组的元素仅被排列在一个维维度上。它们可以用行或列的形式显示。一维数组使用单个下标来表示其元素。\n\n\n\n\n\n\
  ![image](img/aero.png) # 7.8 编写一个程序检测字符在给定字符串中出现的次数。\n\n```c\nvoid main()\n{\n \
  \ static char s[15];\n  int i,c=0;\n  char f;\n  clrscr();\n  puts(“Enter a String\
  \ :”);\n  gets(s);\n  puts(“Enter a Character to Find :”);\n  f=getchar();\n  for(i=0;i<=15;i++)\n\
  \  {\n  if(s[i]==f)\n    c++;\n  }\n  printf(“The Character (%c) in a String (%s)\
  \ occurs %d times.”,f,s,c);\n}\n```\n**输出：**\nEnter a String : programmer\nEnter\
  \ a Character to Find : r\nThe Character (r) in a String (programmer) occurs (3)\
  \ times.\n\n**解释：**\n在该程序中，通过键盘输入字符串和单个字符。在`for`循环内部，用`if`语句检查字符串的每个元素是否等于输入的单个字符。如果找到了字符`‘r’`，则计数器`c`加\
  \ 1，否则不加计数，循环持续直到`i`达到 15。最后，`c`的值即为给定字符的总出现次数。\n\n![image](img/aero.png) # 7.9\
  \ 编写一个程序，将两个数组的元素显示在两个独立的列中并将对应的元素相加。将相加的结果显示在第三列。\n\n```c\nvoid main()\n{\n  int\
