  \ 9 3\n\n升序数字：1 2 3 4 5 7 9 9 10 12\n降序数字：12 10 9 9 7 5 4 3 2 1\n\n***解释：***\n\n\
  在上面的程序中，10 个数字通过键盘输入到数组 `a[10]` 中。在同一个循环中完成了它们的和。外层循环从 0 执行到变量 `sum`。这里，`sum` 变量包含所有\
  \ 10 个输入数字之和。内层循环将数组 `a[10]` 的所有值与外层循环的当前值进行检查。`if` 语句检查外层循环的值与整个数组，当找到匹配数字时打印该数字。外层循环持续到达到变量\
  \ `sum` 的值。外层循环是升序的。因此，数组 `a[10]` 的元素按升序打印。对于降序，外层 `for` 循环被设置为降序。或者\n\n![image](img/aero.png)\
  \ 7.277�� 编写一个程序，通过比较法将数字按升序排序。\n\n```c\nvoid main()\n{\nint i,j,n,num[10],temp;\n\
  clrscr();\nprintf(“Enter how many numbers to sort :”);\nscanf(“%d”,&n);\nfor(i=0;i<n;i++)\n\
  {\n  printf(“Enter numbers # %2d:”,i+1);\n  scanf(“%d”,&num[i]);\n}\nprintf(“The\
  \ Numbers Entered through keyboard \\n”);\nfor(i=0;i<n;i++)\nprintf(“%4d”,num[i]);\n\
  for(i=0;i<n-1;i++)\n{\n  for(j=i+1;j<n;j++)\n  {\n    if(num[i]>num[j])\n    {\n\
  \      temp=num[i];\n      num[i]=num[j];\n      num[j]=temp;\n    }\n  }\n}\nprintf(“\\\
  n The Numbers in ascending order \\n”);\nfor(i=0;i<n;i++)\nprintf(“%4d”,num[i]);\n\
  getch();\n}\n```\n\n**输出：**\n\n输入要排序的数字个数：5\n输入数字 # 1: 8\n输入数字 # 2: 3\n输入数字 # 3:\
  \ 2\n输入数字 # 4: 1\n输入数字 # 5: 9\n通过键盘输入的数字 8 3 2 1 9\n升序数字 1 2 3 8 9\n\n***解释：***\n\
  \n在这里，数字排序是通过交换方法完成的。数组 `num[10]` 外层 `for` 循环给出的元素编号与同一数组中的所有其他元素进行比较。如果第一个元素大于后续元素，则将较大的值赋给变量\
  \ `temp` (`temp=num[i]`)，并在较大值处替换较小的值 (`num[i]=num[j]`）。在较小值处替换 `temp` 的值（即较大的值）（`num[j]=temp`）。因此，通过上述程序获得了升序排列的数组元素。\n\
