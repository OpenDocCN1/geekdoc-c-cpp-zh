  \ 函数来打印正值（绝对值）。while 循环检查条件 `for(i!=k)`。变量 `k` 被打印并增加，直到它的值变为 `n+1`。通过这种方式，按照题目要求打印数字。\n\
  \n![img](img/aero.png) 6.58 编写一个程序通过键盘输入一个数字并找到其各位数字之和。\n\n```c\nvoid main ( )\n\
