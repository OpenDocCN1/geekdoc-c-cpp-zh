  \ 400 进行除法。满足条件，因此 2012 年是闰年。\n\n##### 5.9 `switch` 语句\n\n`switch` 语句是一种多分支语句。在程序中，如果可能从许多选项中进行选择，这种结构化选择是有用的。`switch`\
  \ 语句只需要任意数据类型的一个参数，该参数与 case 选项进行匹配。`switch` 语句评估表达式然后在 case 常量中查找值。如果值与 case 常量匹配，则执行特定的\
  \ case 语句。否则，执行 `default`。\n\n![image](img/aero.png) 5.17 编写一个程序通过选择来打印行。\n\n```c\n\
  void main()\n{\nint ch;\nclrscr();\nprintf(“\\n[1] .........”);\nprintf(“\\n[2]\
  \ _________”);\nprintf(“\\n[3] *********”);\nprintf(“\\n[4] ==========”);\nprintf(“\\\
  n[5] EXIT”);\nprintf(“\\n\\n ENTER CHOICE :”);\nscanf(“%d”,ch);\nswitch(ch)\n{\n\
  case 1 :\nprintf(“\\n ............................................”);\nbreak;\n\
  case 2 :\nprintf(“\\n ___________________________________________”);\nbreak;\ncase\
  \ 3 :\nprintf(“\\n ****************************”);\nbreak;\ncase 4 :\nprintf(“\\\
  n ============================================”);\nbreak;\ncase 5 :\nprintf(“\\\
  n Terminated by choice”);\nexit();\nbreak;\ndefault :\nprintf(“\\n Invalid Choice”);\n\
  }\ngetch();\n}\n```\n\n**输出：**\n\n[1] .........\n[2] _________\n[3] *********\n\
  [4] ==========\n[5] EXIT\n\nENTER CHOICE : 1\n...........................\n\n![image](img/page134_1.png)\n\
