  Model Name, Average, Prize : HONDA 80 45000.00\nModel Name, Average, Prize : SUZUKI\
  \ 65 43000.00\nModel Name, Average, Prize : YAMAHA 55 48000.00\n\n**解释：**\n在上述程序中，记录以二进制模式写入磁盘上的\
  \ “bk.txt” 文件中。在用户按 ‘N’ 后，记录写入将结束。\n\n以只读模式打开同一个文件。`fread()` 函数从磁盘读取记录，并将其置于 `printf()`\
  \ 语句中显示在屏幕上。在检测到文件末尾后，`fread()` 函数将不再读取任何内容。它返回 ‘0’。\n\n`fread()` 和 `fwrite()` 函数更高效地存储数字，且结构体的读写操作非常简单。\n\
  \n### 14.7 其他文件函数\n\n1. `fseek()` 函数：`fseek()` 可以用于访问文件的部分。文件指针可以移动到文件中的任何位置。它在流上定位文件指针的位置。\n\
  \n`fseek()` 的格式如下：\n`fseek(filepointer,offset,position)`\n\n因此，需要通过此函数传递三个参数。它们是：\n\
  1. 文件指针。\n2. 偏移量 (offset)：偏移量可以是正数（从当前位置向前移动）也可以是负数（向后移动）。偏移量是一个类型为 `long` 的变量。\n\
  3. 文件指针的当前位置。\n\n表 14.2 显示文件指针位置的不同值。\n\n**表 14.2 文件指针的位置**\n\n| 整数值 | 常量 | 文件中的位置\
  \ |\n| --- | --- | --- |\n| 0 | SEEK_SET | 文件开头。 |\n| 1 | SEEK_CUR | 文件指针的当前位置。\
  \ |\n| 2 | SEEK_END | 文件末尾 |\n\n**示例：**\n`fseek(fp,10,0)` 或 `fseek(fp,10,SEEK_SET)`\n\
  文件指针向前重新定位了 10 字节。\n\n![img](img/aero.png) 14.21 编写一个程序读取包含某些句子的文本文件。使用 `fseek()`\
  \ 在跳过文件开始的 `n` 个字符后读取文本。\n\n```c\n# include <stdio.h>\n# include <conio.h>\n\nvoid\
  \ main()\n{\nFILE *fp;\nint n,ch;\nclrscr();\nfp=fopen(“text.txt”,“r”);\nprintf(“\\\
  nContents of file\\n”);\nwhile((ch=getc(fp))!=EOF)\nprintf(“%c”,ch);\nprintf(“\\\
  nHow many characters including spaces would you like skip :”);\nscanf(“%d”,&n);\n\
  fseek(fp,n,SEEK_SET);\nprintf(“\\n Information after %d bytes\\n”,n);\nwhile((ch=getc(fp))!=EOF)\n\
  printf(“%c”,ch);\nfclose(fp);\n}\n```\n\n**输出：**\nContents of file:\nTHE PROGRAMMING\
  \ INVENTED BY DENNIS RICHE\nHow many characters including spaces would you like\
  \ skip : 18\nInformation after 15 bytes\nLANGUAGE INVENTED BY DENNIS RICHE\n\n**解释：**\n\
  在上述程序中，`while` 语句用于检查文件末尾。文件指针最初位于文件开头并打印整个内容。为了重新定位文件指针，使用了 `fseek` 语句。在文件末尾可以使用\
  \ `fseek(fp,-n,SEEK_END)` 来替代 `fseek(fp,n,SEEK_SET)`，从而从文件末尾反向读取。\n\n![image](img/aero.png)\
  \ 14.22 编写一个程序，使用 `fseek()` 语句读取文件的最后几个字符。\n\n```c\n# include <dos.h>\n# include\
  \ <stdio.h>\n# include <conio.h>\n\nvoid main()\n{\nFILE *fp;\nint n,ch;\nclrscr();\n\
  fp=fopen(“text.txt”,“r”);\nprintf(“\\nContents of file\\n”);\nwhile((ch=getc(fp))!=EOF)\n\
  printf(“%c”,ch);\nprintf(“\\nHow many characters including spaces would you like\
  \ skip :”);\nscanf(“%d”,&n);\nfseek(fp,-n-2,SEEK_END);\nprintf(“\\nLast %d characters\
  \ of a file\\n”,n-2);\nwhile((ch=getc(fp))!=EOF)\nprintf(“%c”,ch);\nfclose(fp);\n\
  }\n```\n\n**输出：**\nHow many characters including spaces would you like skip : 4\n\
  Last 5 characters of a file\nWORLD\n\n**解释：**\n`fseek(fp,-n-2,SEEK_END)` 语句将文件指针从文件末尾反向移动\
  \ `n-2` 字节。通过这种方式，可以打印文件末尾的字符。在此例中，输入的 `n` 值为 4，`n-2` 的结果为 6，因此显示了最后六个字符。\n\n![image](img/aero.png)\
  \ 14.23 编写一个程序显示当前目录下的 C 程序文件。用户应选择其中的文件。将文件内容转换为大写并显示在屏幕上。同时计算总字符数行数。\n\n```c\n\
  # include <ctype.h>\n# include <stdio.h>\n# include <conio.h>\n# include <process.h>\n\
  \nvoid main()\n{\nFILE *fp;\nint l=0,c=0,ch;\nstatic char file [12];\nclrscr();\n\
  system(“dir *.c/w”);\nprintf(“\\n Enter a file name :”);\nscanf(“%s”,file);\nfp=fopen(file,“r”);\n\
  clrscr();\nprintf(“\\nContents of ‘c’ program File in capital case \\n”);\nprintf(“===============================================\\\
  n”);\nwhile((ch=getc(fp))!=EOF)\n{\n  c++;\n  if(ch==‘\\n’)\n  l++;\n  printf(“%c”,toupper(ch));\n\
  }\nprintf(“\\n Total Characters : %d”,c);\nprintf(“\\n Total Lines : %d”,l);\n}\n\
  ```\n\n**输出：**\nEnter a file name : IO10.C\nContents of ‘c’ program File in capital\
  \ case\ncase main()\n{\n\n\n\n\n\n```c\nprintf(“HELLO WORLD”);\n}\n```\n\n总字符数：31\n\
  总行数：4\n\n##### 解释：\n在上述程序中，`system()` 语句用于调用 MS-DOS 命令。`dir *.c/w` 显示当前目录的内容。`fgetc()`\
  \ 函数逐字符地读取输入文件的文本，直到文件末尾。在 `while` 循环中，统计了 `total` 个字符和 `lines` 行。换行符通过 `‘n’` 来识别。因此，使用\
  \ `if` 语句来识别行的结束。同样，`‘t’` 可用于统计制表符。还使用 `toupper()` 函数将文本转换为大写并显示。\n\n### 2. `feof()`：宏\
  \ `feof()` 用于检测文件指针是否已在文件末尾。如果文件指针在文件末尾，它返回非零值，否则返回零。\n\n![image](img/aero.png)\
  \ 14.24 编写一个程序，使用函数 `feof()` 来检测文件末尾。显示检测文件末尾的文件指针位置。\n\n```c\n# include <conio.h>\n\
  # include <stdio.h>\n\nvoid main()\n{\n    FILE *fp;\n    char c;\n    fp=fopen(“text.txt”,\
  \ “r”);\n    c=feof(fp);\n    clrscr();\n    printf(“File pointer at the beginning\
  \ of the file : %d\\n”,c);\n    while(!feof(fp))\n    {\n      printf(“%c”,c);\n\
  \      c=getc(fp);\n    }\n    c=feof(fp);\n    printf(“File pointer at the end\
  \ of file : %d ”,c);\n}\n```\n\n文件指针在文件开头的位置： 0\n技术专家领军世界（原文）\n文件指针在文件末尾的位置： 32\n\
  \n##### 解释：\n开始时，`feof()` 函数返回 0（零），因为文件指针在文件开头。读取文件内容后，文件指针到达文件末尾。在此阶段，`feof()`\
  \ 函数返回非零值，在本程序中为 32。\n\n### 14.8 在读/写文件时搜索错误\n在执行多次读取或写入操作时，我们可能无法成功获得结果。原因可能是读取或写入操作尝试不正确。必须在执行读/写操作时提供搜索错误的机制。\n\
  \nC 语言提供了标准库函数 `ferror()`。该函数用于检测文件读/写操作过程中可能发生的任何错误。如果尝试成功，它返回 ‘0’，失败则返回非零值。\n\n\
  ### 3. `ferror()`：`ferror()` 用于执行文件读/写操作时发现错误。\n\n![image](img/aero.png) 14.25 编写一个程序，检测文件读/写操作中的错误。\n\
  \n```c\n# include <stdio.h>\n# include <conio.h>\n# include <process.h>\n\nvoid\
  \ main()\n{\n    FILE *fp;\n    char next=‘Y’;\n    char name[25];\n    int marks;\n\
  \    float p;\n    fp=fopen(“marks.dat”,“r”);\n    if(fp==NULL)\n    {\n      puts(“Can\
  \ not open file”);\n      exit(1);\n    }\n    clrscr();\n    while(next==‘Y’)\n\
  \    {\n      printf(“\\n Enter Name, Marks, Percentage”);\n      scanf(“%s %d %f”,name,&marks,&p);\n\
  \      p=marks/7;\n      fprintf(fp,“%s %d %f”,name,&marks,&p);\n      if(ferror(fp))\n\
  \      {\n        printf(“\\n Unable to write data ? ”);\n        printf(“\\n File\
  \ opening mode is incorrect.”);\n        fclose(fp);\n        exit(1);\n      }\n\
  \      printf(“Continue(Y/N”);\n      fflush(stdin);\n      next=getche();\n   \
  \ }\n    fclose(fp);\n}\n```\n\n**输出：**\n输入姓名、分数、百分比\nKAMAL 540\n无法写入数据？\n文件打开模式错误\n\
  \n##### 解释：\n在上述程序中，`fprintf()` 函数未能将输入的数据写入文件，因为文件是以读模式打开的。因此，无法执行写入操作。产生的错误被 `ferror()`\
  \ 函数捕获，程序终止。\n\n![image](img/aero.png) 14.26 编写一个程序，使用 `ferror()` 函数捕获文件读取操作时发生的错误。\n\
  \n```c\n# include <stdio.h>\n# include <process.h>\n# include <conio.h>\n\nvoid\
  \ main()\n{\n    FILE *f;\n    char c;\n    clrscr();\n    f=fopen(“io8.c”,“w”);\n\
  \    if(f==NULL)\n    {\n      printf(“\\nCannot open file”);\n      exit(1);\n\
  \    }\n    while((c=fgetc(f))!=EOF)\n    {\n      if(ferror(f))\n      {\n    \
  \    printf(“\\nCan’t read file.”);\n        fclose(f);\n        exit(1);\n    \
  \  }\n      printf(“%c”,c);\n    }\n    fclose(f);\n}\n```\n\n**输出：**\n无法读取文件\n\n\
  **解释：\n在上述程序中，`io8.c` 是写模式打开的。\n\n### 4. `perror()`：它是一个标准函数，用于打印错误。\n\n![image](img/aero.png)\
  \ 14.27 编写一个程序，使用 `perror()` 检测错误。\n\n```c\n# include <stdio.h>\n# include <conio.h>\n\
  # include <process.h>\n\nvoid main()\n{\n    FILE *fp;\n    char c;\n    char file=\"\
  lines.txt\";\n    fp=fopen(file);\n    if(fp==NULL)\n    {\n      printf(“\\nCannot\
  \ open file”);\n      exit(1);\n    }\n    if(ferror(fp))\n    {\n      perror(file);\n\
  \    }\n    fclose(fp);\n}\n```\n\n**输出：**\nlines.txt: 拒绝访问\n\n解释：\n在上述程序中，`perror()`\
  \ 函数打印由 `errno` 变量指定的错误信息。\n\n### 5. `ftell()`：它是一个文件函数。它返回指针的位置。\n\n![image](img/aero.png)\
  \ 14.28 编写一个程序，使用 `ftell()` 输出文件指针的位置。\n\n```c\n# include <stdio.h>\n# include <conio.h>\n\
  \nvoid main()\n{\n    FILE *fp;\n    char ch;\n    fp=fopen(“text.txt”,“r”);\n \
  \   fseek(fp,21,SEEK_SET);\n    ch=getc(fp);\n    clrscr();\n    while(!feof(fp))\n\
  \    {\n      printf(“%c\\t”,ch);\n      printf(“%d\\n”,ftell(fp));\n      ch=getc(fp);\n\
  \    }\n    fclose(fp);\n}\n```\n\n**输出：**\nW 22\nO 23\nR 24\nL 25\nD 26\n27\n\n\
  解释：\n在上述程序中，`fseek()` 将位置设置在第 21 字节。`fgetc()` 读取第 21 个字符之后的字符。`ftell()` 输出文件中的当前位置。\n\
  \n### 6. `rewind()`：此函数将文件指针重置到文件开头。\n\n![image](img/aero.png) 14.29 编写一个程序显示 `rewind()`\
  \ 函数如何工作。\n\n```c\n# include <stdio.h>\n# include <conio.h>\n\nvoid main()\n{\n\
  \    FILE *fp;\n    char c;\n    fp=fopen(“text.txt”,“r”);\n    clrscr();\n    fseek(fp,12,SEEK_SET);\n\
  \    printf(“Pointer is at %d\\n”, ftell(fp));\n    printf(“Before rewind() : ”);\n\
  \    while(!feof(fp))\n    {\n      c=fgetc(fp);\n      printf(“%c”,c);\n    }\n\
  \    printf(“\\bAfter rewind() : ”);\n    rewind(fp);\n    while(!feof(fp))\n  \
  \  {\n      c=fgetc(fp);\n      printf(“%c”,c);\n    }\n    fclose(fp);\n}\n```\n\
  \n**输出：**\nPointer is at 12\nBefore rewind() : LEAD THE WORLD\nAfter rewind() :\
  \ TECHNOCRATS LEAD THE WORLD\n\n\n\n\n\n在上述程序中，`fseek()` 函数将指针位置设置为第 12 个字符处。第一个\
  \ `while` 循环从当前位置读取并打印文件到末尾，因此文件的前 12 个字符不会被显示。在开始第二个 `while` 循环之前，`rewind()` 函数将指针位置设置在文件开头，即第\
  \ 1 个字符处。`while` 循环从头到尾读取文件的所有字符。简而言之，`rewind()` 函数将文件指针重置于文件的开头。\n\n### 7. `unlink()`\
  \ 或 `remove()`：这些函数删除目录中的指定文件。它类似于 DOS 中的 `del` 命令。\n\n![image](img/aero.png) 14.30\
  \ 编写一个程序，使用 `remove()` 或 `unlink()` 函数从磁盘删除指定的文件。\n\n```c\n#include <dos.h>\n#include\
  \ <stdio.h>\n#include <conio.h>\n#include <process.h>\n\nvoid main()\n{\n    FILE\
  \ *fp;\n    char file[15];\n    clrscr();\n    system(\"dir *.txt\");\n    printf(\"\
  \ Enter The File Name :\");\n    scanf(\"%s\",file);\n    fp=fopen(file,\"r\");\n\
  \    if(fp==NULL)\n    {\n        printf(\"\\nFile dose not exist\");\n        exit(1);\n\
  \    }\n    else\n    {\n        remove(file);\n        printf(\"\\n File (%s) has\
  \ been deleted !\",file);\n    }\n}\n```\n\n**输出：**\nEnter The File Name : TEXT.TXT\n\
  File (TEXT.TXT) has been deleted !\n\n**解释：**\n在上述程序中，输入了要删除的文件。输入的文件以读取模式打开。如果\
  \ `fopen()` 无法打开文件，它将向指针 `*fp` 返回 `NULL`，即文件不存在且程序终止。通过使用 `unlink()` 或 `remove()`\
  \ 函数可以删除输入的临时。\n\n### 8. `rename()`：此函数更改指定文件的名称。它类似于 DOS 命令 `rename`。\n\n![image](img/aero.png)\
