  \n### II 判断对错：\n\n1. `else` 与 `if` 关联。\n2. 当条件为假时，执行 `else` 块。\n3. `if` 语句可以有多个\
  \ `else` 语句。\n4. 语句 `if (1)` 执行块块。\n5. 一个 `switch` 语句可以有多个 `case` 语句，但只有一个 `default`\
  \ 语句。\n6. `default` 语句可以写在 `switch` 块的任何位置。\n7. `break` 语句用于分隔两个 `case` 语句。\n8.\
  \ `case` 语句始终以分号结束。\n9. `switch` 语句只接受常数作为参数。\n10. 像 `if-else` 一样，`switch` 语句也可以嵌套。\n\
  11. `default` 语句对于 `switch` 语句是强制性的。\n12. `switch` 语句仅测试等价性。\n13. `if` 语句可以评估关系和逻辑表达式。\n\
  14. `if` 语句既可以处理表达式也可以处理常数。\n15. `default` 是一个关键字。\n16. `default` 语句可以放在 `switch`\
  \ 的开头，其块内无需任何语句。\n17. `switch` 块应该用分号结束。\n\n### III 从下面的多选题中选择合适的选项：\n\n1. `switch`\
