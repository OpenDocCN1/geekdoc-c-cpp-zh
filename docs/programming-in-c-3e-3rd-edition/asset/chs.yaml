  \ 和 `*n`，其中 `text2[]` 的 `*n` 个字符被追加到 `text1[]` 字符串中。在此程序中，输入了字符串‘MAY I’、‘COME IN’以及\
  \ `n=4`。`strncat()` 函数返回‘MAI I COME’。\n\n## strrev() 函数\n\n该函数简单地反转给定字符串。该函数的语法为\
