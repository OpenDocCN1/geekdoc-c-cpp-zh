  \n**解释：**\n\n在上面的程序中，声明了五个字符数组。使用 `strcpy()` 函数将城市名称复制到数组中。使用 `strcmp()` 函数对字符串进行比较。`strcmp()`\
  \ 返回两个字符串的 ASCII 差。比较时考虑两个字符串第一个字符的 ASCII 值。其余元素不考虑 ASCII 差。从第二个字符串第一个字符的 ASCII\
  \ 值中减去第一个字符串第一个字符的 ASCII 值。表 8.4 阐了计算过程。\n\n**表 8.4** ASCII 差\n\n| ASCII 值 | ASCII\
  \ Value | 差 |\n| --- | --- | --- |\n| 78 (N) | 78 (N) | 0 |\n| 80 (P) | 75 (K) |\
  \ 5 |\n| 65 (A) | 72 (H) | −7 |\n\n![image](img/aero.png) 8.48/8.49  编写一个程序，输入城市名称并按字母顺序显示所有输入的名称。\n\
  \n```c\nvoid main()\n{\n\nchar city[5][20];\nint i,j;\n\nclrscr();\nprintf(“Enter\
  \ Names of Cities.\\n\\n”);\nfor(i=0;i<5;i++)\nscanf(“%s”,city[i]);\n\nprintf(“Sorted\
  \ List of Cities.\\n\\n”);\nfor(i=65;i<=122;i++)\n{\n  for(j=0;j<5;j++)\n  {\n \
  \   if(city[j][0]==i)\n      printf (“\\n%s”,city[j]);\n  }\n}\n}\n```\n\n**输出：**\n\
  \nEnter Names of Cities.\nMUMBAI\nNANDED\nBANGLORE\nKANPUR\nINDORE\nSorted List\
  \ of cities.\nBANGLORE\nINDORE\nKANPUR\nMUMBAI\nNANDED\n\n**解释：**\n\n在上面的程序中，第一个\
  \ `for` 循环用于输入城市名称。城市名称可以用大写也可以用小写输入。因此，第二个 `for` 循环从 65 初始化到 122，其中 65 是 ‘A’ 的\
  \ ASCII 值，122 是 ‘z’ 的 ASCII 值。第三 `for` 循环内部的 `if` 语句进行比较。如果匹配，将显示城市名称，否则循环继续。这样，`city[][]`\
  \ 数组的元素将按排序顺序显示。\n\n**或者**\n\n```c\n# include <string.h>\n\nvoid main()\n{\n\nchar\
  \ city[5][20],temp[20];\nint i,j;\n\nclrscr();\nprintf(“Enter Names of Cities\\\
  n”);\nfor(i=0;i<5;i++)\nscanf(“%s”,city[i]);\n\nprintf (“\\nSorted List of Cities”);\n\
  for(i=1;i<5;i++)\n{\n  for(j=1;j<5;j++)\n  {\n    if(strcmp(city[j−1],city[j])>0)\n\
  \    {\n      strcpy(temp,city[j−1]);\n      strcpy(city[j−1],city[j]);\n      strcpy(city[j],temp);\n\
  \    }\n  }\n}\nfor(i=0;i<5;i++)\nprintf(“\\n%s”,city[i]);\n```\n\n**输出：**\n\nEnter\
  \ Names of Cities.\nMUMBAI\nNANDED\nBANGLORE\nKANPUR\nINDORE\nSorted List of Cities.\n\
  BANGLORE\nINDORE\nKANPUR\nMUMBAI\nNANDED\n\n**解释：**\n\n在上面的程序中使用了标准字符串函数 `strcmp()`\
  \ 和 `strcpy()`。`strcmp()` 函数比较两个城市名称。如果它们的 ASCII 差大于零，则交换名称。这是通过 `if` 语句体实现的。因此，执行后显示城市。\n\
  \n![image](img/aero.png) 8.50/51  编写一个程序查找给定语句中的单词数。排除它们之间的空格。\n\n```c\nvoid main()\n\
  {\n\nchar text[30];\nint count=0,i=0;\n\nclrscr();\nprintf(“Enter The Line of Text\
  \ \\n”);\nprintf(“Give One After word\\n”);\ngets(text);\nwhile(text[i++]!=‘0’)\n\
  if(text[i]==32 || text[i]==‘0’)\ncount++;\n\nprintf(“The Number of words in line\
  \ = %d\\n”,count);\n```\n\n**输出：**\n\nEnter The Line of Text\nGive One After word\n\
  Books\nThe Number of words in line = 2\n\n**解释：**\n\n在上面的程序中，输入了一个字符串。已知空格分隔两个单词。查找单词数的逻辑是检测空格和空字符。例如，在语句\
  \ ‘C PROGRAM LANGUAGE’ 中四个空格和一个空字符当字符串结束，总字符数为五个 (4+1)。`if` 语句统计字符串中的空格和空字符。\n\n\
  **或者**\n\n```c\nvoid main()\n{\n\nchar text[30];\nint count=0,i=0;\n\nclrscr();\n\
  printf(“Enter Text :”);\ngets(text);\nwhile(text[i]!=‘0’)\n{\n  if(((text[i]>=97)\
  \ && (text[i]<=122)) || ((text[i]>=65) && (text[i]<=90)))\n  {\n    i++;\n    if(text[i]==32)\n\
  \    {\n      count++;\n      i++;\n    }\n  }\n}\nif(text[i]==‘0’)\ncount++;\n\
  printf(“The Number of words in line = %d\\n”,count);\n}\n```\n\n**输出：**\n\nEnter\
  \ Text : Reading is a good Habit\nThe Number of words in line = 5\n\n**解释：**\n\n\
  在上面的程序中，输入了一个字符串。`while` 循环中的第一个 `if` 语句检查字符串的每个元素是字符还是空格。如果是字符，变量 `i` 递增并用第二个 `if`\
  \ 语句检查。如果是空格，计数变量 `i` 和 `count` 递增。这样，通过统计空格和空字符计算出单词数。\n\n![image](img/aero.png)\
