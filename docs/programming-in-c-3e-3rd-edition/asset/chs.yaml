  \ `*p`。在赋值二维数组基地址时，需要在数组名前后加上 `&` 运算符，否则编译器会报错。在此上下文中使用了语句 `p=&a[0][0]`。指针 `*p`\
  \ 在 for 循环中打印并递增直到打印整个数组。if 语句在每行打印三个元素时进行换行。\n\nOR\n\n![img](img/aero.png) 9.27\
