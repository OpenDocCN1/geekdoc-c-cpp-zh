  Result: 1\nGrade: 2\n\n**解释：**\n上述程序与上一个相同。仅成员变量和分配的位数不同。\n\n##### 13.10 枚举数据类型\n\
  \n`enum` 是一个关键字。它用于声明枚举类型。程序员可以创建自己的数据类型，并定义这些数据类型的变量可以持有的值。这种枚举类型有助于阅读程序。考虑一年中\
  \ 12 个月的例子。\n\n```c\nenum month {Jan, Feb, Mar, Apr, May, Jun, Jul, Sep, Oct, Nov,\
  \ Dec};\n```\n\n该语句创建了用户定义的数据类型。关键字 `enum` 后面跟着标签名 `month`。枚举成员是标识符 `Jan`、`Feb`、`Mar`、`Apr`\
  \ 等。它们的值是常量整数并从 0 开始。标识符 `Jan` 指向 0，`Feb` 指向 1，此类推。标识符不需要用引号括起来。请注意，也不允许使用整数常量![img](img/aero.png)\
  \ 13.23 写一个程序为 12 个月创建枚举类型。以整数常量显示它们的值。\n\n```c\nvoid main()\n{\nenum month {Jan,\
  \ Feb, Mar, Apr, May, June, July, Sep, Oct, Nov, Dec};\nclrscr();\nprintf(\"\\nJan\
  \ = %d\",Jan);\nprintf(\"\\nFeb = %d\",Feb);\nprintf(\"\\nJune = %d\",June);\nprintf(\"\
  \\nDec = %d\",Dec);\n}\n```\n**输出：**\nJan = 0\nFeb = 1\nJune = 5\nDec = 11\n\n**解释：**\n\
  在上述程序中，编译器从 0 开始为每个标识符赋值。标识符 `Jan` 指向 0，`Feb` 指向 1，依此类推。标识符不需要用引号。使用 `printf()`\
  \ 语句显示不同的标识符。默认从 0 开始，程序员可以为每个标识符初始化自己的常量。下面的程序说明了这一概念![img](img/aero.png) 13.24\
  \ 写一个程序为 12 个月创建枚举类型。将第一个标识符初始化为 1。\n\n```c\nvoid main()\n{\nenum month {Jan=1,\
  \ Feb, Mar, Apr, May, June, July, Sep, Oct, Nov, Dec};\nclrscr();\nprintf(\"\\nJan\
