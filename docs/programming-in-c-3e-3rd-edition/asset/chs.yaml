  \ enum 数据类型时使用的变量数量而变化。*\n\n##### 2.12 整数与浮点数的表示\n\n###### 2.12.1 整数表示\n\n回想，带有符号的整数被称为符号整数。符号整数有正或负符号。符号在计算机中以二进制格式表示，`-`（减）为\
  \ 1，`+`（加）为 0，反之亦然。符号位始终编码为最左位。在存储符号数时，系统保留最左侧位用于表示数的符号。\n\n例如，正符号数以“符号位值”（signed\
  \ magnitude）的形式表示。在这种形式中，符号位始终是最左侧位。整数可以用以下任何一种形式表示：\n\n1. 符号位值\n2. 反码 (1’s complement)\n\
  3. 补码 (2’s complement)\n\n在符号位值形式中，数的符号由最左位指示，其余位表示二进制绝对值。在反码形式中，数的符号由最左位指示，其余位表示该数值的反码。在补码形式中，数的符号由最左位指示，其余位表示该数值的补码。\n\
  \n###### 2.12.2 浮点表示\n\n大多数计算机使用浮点表示法。这些数字表示为尾数和指数的组合。尾数表示数字的小数部分，指数表示基数（通常为 10）的幂。这通常写为：\n\
  \n$m \\times 10^e$\n\n其中 $m$ 是尾数，$e$ 是指数。\n\n##### 2.13 变量声明\n\n变量的声明应该在程序的声明部分完成。变量必须在程序中使用之前声明。声明确保了以下两点：(i)\
  \ 编译器获取变量名 (ii) 它告知所声明变量的数据类型并有助于分配内存。变量也可以在 `main()`之前声明，这样的变量被称为外部变量。声明变量的语法如下：\n\
  \n```\nData_type variable_name;\n```\n\n示例：\n\n```c\nint age;\nchar m;\nfloat s;\n\
  double k;\nint a,b,c;\n```\n\n##### 2.14 变量初始化\n\n声明的变量可以使用赋值运算符 `=` 进行赋值或初始化。声明和初始化也可以同一行完成。\n\
  \n```\nvariable_name = constant;\n```\n\n或者\n\n```c\ndata_type variable_name= constant;\n\
  ```\n\n示例：\n\n```c\nx=5; // 其中 x 是整数变量\n```\n\n示例：\n\n```c\nint y=4;\n```\n\n\n\n\
  \n\n上述引用的变量声明第三个示例也是有效的语句。变量初始化的说明请见图 2.6 和 2.7。\n\n![image](img/page46_1.png)\n\
  \n**图 2.6** *值赋值*\n\n![image](img/page46_2.png)\n\n**图 2.7** *多次赋值*\n\n在图 2.7 中，变量\
  \ `z` 被赋值为值 `1`，然后 `z` 将其值赋给 `y`，再次将 `y` 赋给 `x`。因此，链式初始化完成。但请注意以下声明是无效的：\n\n```c\n\
  int x=y=z=3; /* invalid statement */\n```\n\n##### 2.15 动态初始化\n\n运行时变量的初始化被称为动态初始化。动态指的是执行期间的过程。在\
  \ C 中，初始化可以在程序的任何地方进行；但声明应该只在声明部分完成。考虑以下程序。\n\n![image](img/aero.png) 2.4 写一个程序演示动态初始化。\n\
  \n```c\nvoid main()\n{\n    int r=2;\n    float area=3.14*r*r;\n    clrscr();\n\
  \    printf(“Area=%g”,area);\n}\n```\n\n**输出：**\nArea=12.56\n\n**解释：**\n\n在上述程序中，`area`\
  \ 被计算并赋值给变量 `area`。该表达式在运行时求解并在运行时赋值给 `area`。因此，它被称为动态初始化。\n\n##### 2.16 类型修饰符\n\
  \n关键字 `signed`、`unsigned`、`short` 和 `long` 是类型修饰符。类型修饰符改变基本数据类型的含义并产生新的数据类型。这些类型修饰符中的每一个都适用于基本类型\
  \ `int`。`signed` 和 `unsigned` 也适用于类型 `char`。`long` 类型修饰符可以适用于 `double` 类型。\n\n**示例：**\n\
  \n```c\nlong l;            /* int data type is applied */\nint s;             /*\
  \ signed is default */\nunsigned long int; /* int keyword is optional */\n```\n\n\
  ![image](img/aero.png) 2.5 写一个程序使用类型修饰符声明不同的变量并显示它们。\n\n```c\nvoid main()\n{\n \
  \   short t=1;\n    long k=54111;\n    unsigned u=10;\n    signed j=-10;\n    clrscr();\n\
  \    printf(“\\n t=%d”,t);\n    printf(“\\n k=%ld”,k);\n    printf(“\\n u=%u”,u);\n\
  \    printf(“\\n j=%d”,j);\n}\n```\n\n**输出：**\nt=1\nk=54111\nu=10\nj=-10\n\n**解释：**\n\
  \n在上面的上面的程序中，所有变量都是整数类型。变量 `t` 和 `k` 是 `short` 和 `long` 类型，而 `u` 和 `j` 分别是 `unsigned`\
  \ 和 `signed` 整数。\n\n##### 2.17 类型转换\n\n在 C 中，可以将一种数据类型转换为另一种类型。这个过程可以通过显式或隐式完成。本节描述显式类型转换。\n\
  \n1. **显式类型转换**\n   - 有时程序员需要特定数据类型的结果，例如 `5` 除以 `2` 的除法应该返回 `float` 值。在实际上，编译器总是返回整数值，因为两个操作数都是整数数据类型。\n\
  \n2. **隐式类型转换**\n   在 C 中，系统会自动将“低位”数据类型提升为“高位”数据类型。例如，数据类型 `char` 或 `short` 被转换为\
  \ `int`。这种转换被称为自动一元转换。即使二元运算符具有不同的数据类型，“低位”数据类型也会转换为“高位”数据类型。\n\n   如果表达式包含的操作数之一是\
  \ `unsigned` 操作数，另一个是非无符号数，则后者操作数被转换为 `unsigned`。\n\n   同样地，如果表达式包含的操作数之一是 `float`\
  \ 操作数，另一个非浮点数，则后者操作数被转换为 `float`。\n\n   同样地，如果表达式包含的操作数之一是 `double` 操作数，另一个非双精度数，则后者操作数被转换为\
  \ `double`。\n\n   同样地，如果表达式包含的操作数之一是 `long int`，另一个是 `unsigned int` 操作数，则后者操作数被转换为\
  \ `long int`。\n\n   为了便于理解，下表描述了在求值表达式时从一种数据类型到另一种数据类型的自动类型转换。\n\n![image](img/page48_1.png)\n\
  \n![image](img/aero.png) 2.6 以下程序解释了上述概念。\n\n```c\n#include <stdio.h>\n#include\
  \ <conio.h>\nint main()\n{\n    short a=5;\n    long int b=123456;\n    float c=234.56;\n\
  \    double d=234567.78695;\n    clrscr();\n    printf(“%lf”,((a+b)*c)/d);\n   \
  \ return 0;\n}\n```\n\n**输出：**\n123.456900\n\n**解释：**\n\n在上面的程序中，使用了 `a`、`b`、`c`\
  \ 和 `d`。表达式 `((a+b)*c)/d` 被求值，其中 `a` 是 `short`，`b` 是 `long int`，`c` 是 `float`，`d`\
  \ 是 `double`。\n\n##### 2.18 回绕\n\n当变量的值超出其限制时，编译器不会标记任何错误。它只是对的值进行回绕。例如，`unsigned`\
  \ 整数的范围是 0 到 65535。在这种类型中，负值和大于 `65535` 的值都是兼容的。\n\n`unsigned int x=65536;`\n\n\
  赋值的值比范围大了 1。在这里，编译器到达范围末端后会重新开始。考虑以下示例。\n\n![image](img/aero.png) 2.8 写一个程序演示回绕。\n\
  \n```c\nvoid main()\n{\n    unsigned u=65537;\n    clrscr();\n    printf(“\\n u=%u”,u);\n\
  }\n```\n\n**输出：**\nu=1\n\n**解释：**\n\n在这个程序中，无符号整数 `u = 65537`；在达到最后一个范围 `65535`\
  \ 后，编译器从头开始。因此，显示为 1。值 `65536` 指向 0，`65537` 指向 1。\n\n##### 2.19 常量和 volatile 变量\n\
  \n###### 2.19.1 常量变量\n\n如果我们希望变量的值在程序执行期间保持不变，可以通过将变量声明为常量来实现。只需在声明前前缀 `const` 关键字即可。它告诉编译器该变量是一个常量。因此，声明的常量变量免受修改保护。\n\
  \n\n\n\n\n```c\nconst int m=10;\n```\n\n其中 `const` 是一个关键字，`m` 是变量名，`10` 是常量。\n\n\
  编译器保护 `m` 的值不被修改。用户不能给 `m` 赋值任何值，但使用指针可以更改该值。当用户尝试修改常量变量的值时，将显示“cannot modify the\
  \ constant object”（无法修改常量对象）。\n\n```c\nvoid main()\n{\n    const int num=12;\n \
  \   ++num;\n}\n```\n\n上述程序代码将不会执行，并以错误消息结束。在这里，常量变量尝试修改其值。\n\n##### 2.19.2 volatile\
  \ 变量 (volatile Variable)\n\nvolatile 变量是指可以被其他外部程序或同一程序随时改变的变量。语法如下：\n\n```c\nvolatile\
  \ int d;\n```\n\n下面是一个关于上述概念的程序。\n\n![image](img/aero.png) 2.9  写一个程序演示溢回（wrapping\
  \ around）。\n\n```c\nvoid main()\n{\n    volatile int x;\n    volatile const int\
  \ y=10;\n    clrscr();\n    printf(“Enter an integer:”);\n    scanf(\"%d”,&x);\n\
  \    printf(“Entered integer is :%d”,x);\n    x=3;\n    printf(\"\\nChanged value\
  \ of x is :%d”,x);\n    printf(\"\\nValue of y:%d”,y);\n    /* y=8;*/\n    getche();\n\
  }\n```\n\n**输出：**\nEnter an integer:5\nEntered integer is :5\nChanged value of x\
  \ is :3\nValue of y:10\n\n**解释：**\n\n在上面的示例中，变量 `x` 使用关键字 `volatile` 初始化，`y` 使用\
  \ `volatile const` 初始化。`x` 的值可以改变，但 `volatile const` 不能改变。尝试在程序中包含注释语句并查看编译器的响应。编译器将抛出错误，屏幕上显示的消息为“cannot\
  \ modify a const value”（无法修改 const 值）。\n\n### 总结 (SUMMARY)\n\n在学习了第一章的基础之后，读者现在第二章中接触到了\
  \ C 语言的其他基础知识。这些概念对于编写程序至关重要。建议读者深入学习本章，因为它包含了基础和核心。读者将了解到以下几点：\n\n1. 不同类型的字符，如字母、数字、空白和特殊字符。用于\
