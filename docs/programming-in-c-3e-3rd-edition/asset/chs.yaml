  };\nstruct bike e;\nfp=fopen(“bk.txt”,“wb”);\nif(fp==NULL)\n{\n  puts(“Cannot open\
  \ file”);\n  exit(1);\n}\nclrscr();\nwhile (next==Y’)\n{\n  printf(“\\nModel Name,\
  \ Average, Prize : ”);\n  scanf(“%s %d %f”,e.name,&e.avg,&e.cost);\n  fwrite(&e,sizeof(e),1,fp);\n\
  \  printf(“\\nAdd Another (Y/N :”);\n  fflush(stdin);\n  next=getche();\n}\nfclose(fp);\n\
  }\n```\n\n**输出：**\nModel Name, Average, Prize : HONDA 80 45000\nAdd Another (Y/N\
