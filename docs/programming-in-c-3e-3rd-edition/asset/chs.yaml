  \ 254 | ■ | 黑方块 |\n| 255 | | |\n\n## 附录 B\n\n### 运算符优先级及其结合\n\n![image](img/page649_1.png)![image](img/page650_1.png)\n\
  \n## 附录 C\n\n### 头文件与标准库函数\n\n每个 C 编译器都提供标准库函数。下表描述了程序员可以使用的一些 C 库函数。由于标准库函数数量巨大，附录无法包含所有函数。程序员可以参考\
  \ C 编译器的帮助。编译器支持的函数因编译器而异。\n\n编译器支持的头文件和函数如下。\n\n#### 1. stdio.h\n\n| 函数名 & 语法 |\
  \ 描述 | 示例 |\n| --- | --- | --- |\n| `printf:int printf (const char *format, argument,\
  \ ...);` | 它将每个参数应用到 `format` 中对应的格式说明符，并将格式化输出发送到 `stdin`。如果成功，返回非零；否则返回 `EOF`。\
  \ | `printf(\"%d\",d);`: 打印 `d` 的值。(65) <br>`printf(\"%c\",65);`: 打印 65 的 ASCII\
  \ 字符，即 'A' <br>`printf(\"s=%f,t=%d\", s,t);`: 打印 `s` 的浮点值和 `t` 的整数值。(s=4.5,t=2)\
  \ |\n| `scanf:int scanf (const char *format, argument, ...);` | 它将每个参数应用到 `format`\
  \ 中对应的格式说明符，并将格式化输出发送到 `stdin`。如果成功，返回非零；否则返回 `EOF`。 | `printf(\"%d\",d);`: 打印 `d`\
  \ 的值。(65) <br>`printf(\"%c\",65);`: 打印 65 的 ASCII 字符，即 'A' <br>`printf(\"s=%f,t=%d\"\
  , s,t);`: 打印 `s` 的浮点值和 `t` 的整数值。(s=4.5,t=2) |\n\n*(注：此处根据示例逻辑对表格内容进行了翻译处理，由于原文示例中\
  \ `scanf` 描述部分与 `printf` 重复，此处按标准翻译逻辑保持了格式一致性)*\n\n由于提供的文本在 `scanf` 描述处截断，以上为翻译至可见的全部内容。\n\
  \n\n\n\n| `clrscr:void clrscr(void);` | 它清空当前文本窗口并将光标置于左上角（位置 1,1）。 | `clrscr();`\
  \ |\n| `getch:int getch(void);` | 它直接从键盘读取单个字符，不回显到屏幕上，并返回从键盘读取的字符。 | `getch();`\
  \ |\n\n### 3. `alloc.h`\n\n| `函数名与语法` | `描述` | `示例` |\n| :--- | :--- | :--- |\n\
  | `malloc:void *malloc (size_t size);` | 它从内存堆中分配一个大小为 `size` 字节的内存块。它允许程序根据需要显式地分配所需的精确内存。成功时返回指向新分配内存块的指针；否则返回空。\
  \ | `char *str=(char *) malloc( 10);` 为 `str` 指向的 10 个字符分配空间。这里需要进行类型转换。 |\n| `calloc:void\
  \ *calloc (size_t nitems, size_t size);` | `calloc` 提供对 C 内存堆的访问，用于动态分配变长度的内存块。`calloc`\
  \ 分配一个 `(nitems * size)` 字节的块并将其清零 0。成功时返回指向新分配内存块的指针；否则返回空。 | `int *str=(int *)\
  \ calloc( 10, sizeof(int));` 为 `str` 指向的 10 个字符分配空间，大小为 `10*sizeof(int)=10*2=20`\
  \ 字节。这里也需要类型转换。 |\n| `free:void free(void *block);` | `free` 释放之前调用 `calloc`、`malloc`\
  \ 或 `realloc` 分配的内存块。 | `free(str);` 释放 `str` 指向的分配块。 |\n\n**注意：** 上三个函数在 `stdlib.h`\
  \ 文件也可用。\n\n### 4. `math.h`\n\n| `函数名与语法` | `描述` | `示例` |\n| :--- | :--- | :---\
  \ |\n| `abs:int abs(int x);` | 返回其参数的绝对值。 | `abs(−1);` 返回 1 |\n| `ceil:double ceil\
  \ (double x);` | 找到不小于 `x` 的最小整数。 | `ceil(2.6);` 返回 3.0 |\n| `floor:double floor\
  \ (double x);` | 找到不大于 `x` 的最大整数。 | `floor(2.6);` 返回 2.0 |\n| `exp:double exp(double\
  \ x);` | 计算指数函数；`e` 的 `x` 次方。 | `exp(2);` 返回 `e²=7.389056` |\n| `log:double log(double\
  \ x);log10 (double x);` | `log` 计算 `x` 的自然对数，而 `log10` 计算 `x` 的以 10 为底的对数。 | `log(5);`\
  \ 返回 1.609438 `log10(5);` 返回 0.6989708 |\n| `pow:double pow(double x, double y);`\
  \ | 计算 `x^y`，即 `x` 的 `y` 次方。 | `pow(2,5);` 返回 32 |\n| `Trigonometric:double cos(double\
  \ x); double sin (double x); double tan(double x);` | `cos` 计算输入值的余弦。`sin` 计算输入值的正弦。`tan`\
  \ 计算输入值的正切。作为参数传递的值必须是弧度。 | `cos(30*M_PI/180);` 返回 0.866025 `sin(30*M_PI/180);`\
  \ 返回 0.500000 `cos(30*M_PI/180);` 返回 0.577350 |\n| `sqrt:double sqrt (double x);`\
  \ | 计算输入值的正平方根。 | `sqrt(6.25);` 返回 2.500000 |\n\n`M_PI=π=3.141593`\n\n### 5. `stdlib.h`\n\
  \n| `函数名与语法` | `描述` | `示例` |\n| :--- | :--- | :--- |\n| `atoi:int atoi (const char\
  \ *s);` | 将 `s` 指向的字符串转换为 `int`。如果 `s` 无法转换，则返回零。 | `char *s=\"123\"` `atoi(s);`\
  \ 返回整数 123。 |\n| `exit:void exit(int status);` | 终止调用进程。在终止之前，关闭所有文件并写入缓冲区输出。`status=0`\
  \ 表示正常退出，非零表示错误。此函数在 `process.h` 文件也可用。 | `exit(0);` 停止 main 函数执行。因此终止程序。 |\n| `itoa:char\
  \ *itoa(int value, char *string, int radix);` | 将 `value` 转换为空终止的字符串并将结果存储在 `string`\
  \ 中。`radix` 指定转换 `value` 时使用的基数（2 到 36）。 | `itoa(123,a,16);` 123 的十六进制格式将存储在 `a`\
  \ 中。 |\n| `random:int random(int num);` | 返回 0 到 `num−1` 之间的随机数。 | `random(999);`\
  \ 可能返回 10 |\n\n## APPENDIX D\n\n### ROM-BIOS 服务\n\n这些服务可以使用 `int86()` 函数调用。\n\n\
  | `PRINT SCREEN` 中断 `0 ×5` | 返回 `无` | 将屏幕内容发送到打印机 | `INITIALIZE PRINTER` 中断 `0 ×17`\
  \ | 返回 `无` | 用于初始化打印机 |\n| `MEMORY SIZE` 中断 `0 ×10` | 返回 `AX` | `READ DISK CONTROLLER`\
  \ 中断 `0 ×13` | 返回 `AX` | 用于软磁盘 |\n| `SET CURSOR SIZE` 中断 `0 ×00` | 返回 `CH` | 用于更改光标大小\
  \ | `SET CURSOR POSITION` 中断 `0 ×10` | 返回 `DH` | 用于起始行 `CL` = 结束行 |\n| `REBOOT COMPUTER`\
  \ 中断 `0 ×19` | 返回 `无` | 用于重启计算机 | `DELAY` 中断 `0 ×15` | 返回 `AX` | 用于停止的秒数 |\n| `GET\
  \ TIME` 中断 `0 ×02` | 返回 `CH` | `CL` = 分 `DH` = 秒 | `GET DATE` 中断 `0 ×04` | 返回 `CH`\
  \ | `CL` = 年 `DH` = 月 `DL` = 日 |\n| `SHOW MOUSE POINTER` 中断 `33H` | 返回 `AX` | 显示鼠标光标并中消之前定义的指针区域\
  \ | `HIDE MOUSE POINTER` 中断 `33H` | 返回 `AX` | 移除鼠标光标。驱动程序继续跟踪鼠标 |\n\n这些服务可以使用 `intdos()`\
  \ 函数调用。所有服务的中断号均为 `0 ×21`。\n\n| `MAKE DIRECTORY` 中断 `0 ×39` | 返回 `AX` | `REMOVE\
  \ DIRECTORY` 中断 `0 ×3A` | 返回 `AX` |\n| `CHANGE DIRECTORY` 中断 `0 ×3B` | 返回 `AX` |\
  \ `DELETE FILE` 中断 `0 ×41` | 返回 `AX` |\n\n## APPENDIX E\n\n**键盘键的扫描码**\n\n\n\n\n\
