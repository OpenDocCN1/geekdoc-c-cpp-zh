  \ Symbol for Replacement: Y\nBefore strset() : LEARN C\nAfter strset() : YYYYYYY\n\
  ```\n\n***Explanation:***\n`strset()` 函数需要两个参数。第一个是字符串，另一个是替换字符串的字符。这两个参数在程序执行时都需要输入。`strset()`\
  \ 函数将第一个字符串的每个字符替换为给定的字符/符号，即字符串的每个字符都被替换为输入的字符。\n\n## strnset() 函数\n\n该函数与 `strset()`\
  \ 相同。这里提供了指定的长度。该函数的语法为 `strnset(char *string,char symbol,int n)`，其中 `*n` 是要替换的字符数。\n\
  \n![image](img/aero.png) 8.32 编写一个程序，根据指定的参数个数用给定的符号替换（设置）给定字符串。使用 `strnset()` 函数。\n\
