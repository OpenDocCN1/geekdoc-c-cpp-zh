  在上述程序中，定义了 `enum` 数据类型 `capital` 并用三个标识符进行初始化。它们分别是 `Mumbai`、`Hyderabad` 和 `Bangalore`。结构体\
  \ `state` 被声明包含两个成员，如 `name` 和 `capital`。结构体变量被赋值值 `Andhara Pradesh` 和 `Hyderabad`。`printf()`\
  \ 语句显示结构体变量的内容。如果结构体变量 `s.c` 包含值 `Hyderabad`，则显示消息，否则不显示。\n\n![img](img/aero.png)\
  \ 13.27 编写一个程序识别输入的字符类型，判断其是字母、数字或其他符号。使用枚举数据类型。\n\n```c\n#include <ctype.h>\n\n\
