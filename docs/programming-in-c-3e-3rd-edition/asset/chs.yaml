  \ String : SACHIN\n\n**解释：**\n在上面的程序中声明了两个字符数组。输入源字符串。使用 `for` 循环和赋值运算符将源数组 `ori[]`\
  \ 的每个字符分配给目标数组 `dup[]`。在执行 `for` 循环后，在目标字符串中追加 NULL 字符以标记字符串的结束。使用 `printf()` 函数显示两个字符串。\n\
  \n![image](img/aero.png) 8.46 编写一个程序判断输入的字符字符串是否为回文。（回文从左到右和从右到左是一样的。）例：DAD, ABBA,\
  \ MUM）\n\n```c\n# include <string.h>\n# include <process.h>\nvoid main()\n{\nchar\
