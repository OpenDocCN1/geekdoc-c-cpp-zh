  \ 第 8 章 字符串与标准函数\n\n**章节目录**\n\n- [8.1] 引言\n- [8.2] 字符串的声明与初始化\n- [8.3] 以不同格式显示字符串\n\
  - [8.4] 字符串标准函数\n- [8.5] 字符串转换函数\n- [8.6] 内存函数\n- [8.7] 字符串的应用\n\n##### 8.1 引言\n\
  \n字符是任何程序的基础要求。程序包含具有编译器可理解的特定含义的语句。在 C 语言中，双引号内的字符、数字和符号序列被称为字符串。字符串始终被声明为字符数组，其元素存储在连续的内存位置。\n\
  \n换句话说，在 C 中，通常使用字符串来处理文本如单词和句子。每个字符串都以 `\\0`（空字符）结束。空字符是一个所有位均为零的字节。因此，它的值为零。指针可以访问字符串。字符串的值是它的基地址，即第一个字符的地址。当创建字符串时，某些编译器会将字符串放在不可修改的内存中。\n\
  \n字符串的一个示例如下：\n\n```\nchar name[]={'I','N','D','I','\\0'};\n```\n\n字符串的每个字符占用 1\
  \ 字节内存。最后一个字符总是 `\\0`。在字符串中并非强制写入 `\\0`。编译器会自动在字符数组或字符串的末尾加上 `\\0`。字符串的字符存储在连续（相邻）的内存位置。在上面的示例中，编译器会自动确定数组的大小。表\
  \ 8.1 字符串的内存映射\n\n![image](img/page28_1.png)\n\n在字符串数组中存储字符时，应确认数组长度是否足够存储给定字符串。此外，双引号可用于存储\
  \ `char` 类型的单词或常量。\"MAHARHTRA\" 的字符长度为 8，但在 C 中，字符数组长度应为 9。字符串末尾还需要一个字符，称为空字符。声明如下：\n\
  \n```\nchar name[9]=\"MAHARHTRA\"\n```\n或\n```\nchar name[10]={'M','A','H','A','R','T','A','A\\\
  0'};\n```\n\nC 允许存储任意长度的字符串。然而，如果字符串超过了字符数组的限制，它将覆盖数组之外的数据。\n\n#### 8.2 字符串的声明与初始化\n\
  \n初始化字符串的语法如下：\n\n```\nchar name[]=\"INDIA\";\n```\n\nC 编译器会自动在字符串末尾插入空字符 (\\0)。因此，初始化空字符并不是必要的。即使在字符串末尾添加了空字符，编译器也不会抛出任何错误。通过以下方式初始化字符数组，程序员可以查看输出：\n\
  \n1. `char name[6]={'S','A','N','J','A','Y'};`\n2. `char name[7]={'S','A','N','J','A','Y'};`\n\
  \n在情况 (a) 下，输出将不是 'SANJAY'因为它在 SANJAY 的末尾有一些垃圾值。此示例中的数组索引/大小初始化为 6，这恰好等于括号内的字符数量。字符串末尾必须包含空字符，因此，数组索引/大小必须是\
  \ 7，而不是语句 (b) 给出的 6。\n\n![image](img/aero.png)\n\n#### 写一个程序，在不考虑空字符的情况下显示输出。\n\n\
  ```c\nvoid main() {\n    char name[6]={'S','A','N','J','A','Y'};\n    clrscr();\n\
  \    printf(\"Name1 = %s\",name1);\n}\n```\n\n**输出：**\nName1 = SANJAY\n\n**解释：**\n\
  由于 SANJAY 的末尾包含垃圾值，输出将是 SANJAY。\n\n#### 写一个在字符串没有以空字符结束的情况下显示连续字符串的程序。\n\n```c\n\
  void main() {\n    char name1[6]={'S','A','N','J','A','Y'};\n    char name2[7]={'S','A','N','J','A','Y'};\n\
  \    clrscr();\n    printf(\"Name1 = %s\",name1);\n    printf(\"\\nName2 = %s\"\
  ,name2);\n}\n```\n\n**输出：**\nName1 = SANJAYSANJAY\nName2 = SANJAY\n\n**解释：\n在第一个语句中没有考虑空字符。编译器会紧接着读取第二个字符串，因为第一个字符串的结尾没有被识别。因此，打印出的第二个字符串紧跟第一个字符串。为了得到正确的结果，必须将大小从\
  \ 6 改为 7。如上述程序所示，输出为 7。\n\n#### 使用不同的数组初始化语法写一个程序打印 'WELCOME'。\n\n```c\nvoid main()\
  \ {\n    char arr1[9]={'W','E','L',' ','C','O','M','E','\\0'};\n    char arr2[9]=\"\
  WELCOME\";\n    char arr3[9]= {{'W'},{'E'},{'L'},{' '},{'C'},{'O'},{'M'},{'E'}};\n\
  \    clrscr();\n    printf(\"\\nArray1 = %s\",arr1);\n    printf(\"\\nArray2 = %s\"\
  ,arr2);\n    printf(\"\\nArray3 = %s\",arr3);\n}\n```\n\n**输出：**\nArray1 = WEL COME\n\
  Array2 = WELCOME\nArray3 = WEL COME\n\n**解释：**\n字符串元素可以使用封装在单引号和大括号中单独初始化。大括号是可选的。在初始化单个元素时，必须用逗号分隔。这在第一和第三条语句中都是。也可以使用双引号初始化，这在第二条语句中所示。\n\
  \n\n\n\n\n`printf()` 函数用于显示各种数据类型。带有 `%s` 格式的 `printf()` 函数用于在屏幕上显示字符串。各种 `printf()`\
  \ 格式如表 8.2 所示，当 `char text[15]=“PRABHAKAR”` 时：\n\n**表 8.2 不同精度的字符串格式**\n\n| 序号 |\
  \ 语句 | 输出 |\n| --- | --- | --- |\n| 1. | `printf (“%s\\n”,text);` | PRABHAKAR |\n\
  | 2. | `printf (“%.5s\\n”,text);` | PRABH |\n| 3. | `printf (“%.8s\\n”,text);` |\
  \ PRABHAKA |\n| 4. | `printf (“%.15s\\n”,text);` | PRABHAKAR |\n| 5. | `Printf (“%−10.4s\\\
  n”,text);` | PRAB |\n| 6. | `Printf (“%11s”,text);` | PRABHAKAR |\n\n1.  第 1 条语句显示输出‘PRABHAKAR’。第一个语句显示了整个字符串。\n\
  2.  我们也可以为要显示的字符字符串指定精度。精度是小数点后提供的数字（要显示的字符数）。例如，在表 8.2 的第 2 条语句中，显示了前五个字符。这里，小数点右侧的整数值\
