  ## 第 4 章\n## C 语言语言中的输入与输出\n\n### 章节大纲\n- 4.1 引言 `int year=2005;`\n\n（注：原文中后续重复的相同段落已在翻译中剔除）\n\
  \n\n\n\n\n##### 4.2 格式化函数\n\n1. `printf()` 语句：根据程序员要求的格式化输出将通过 `printf()` 显示在屏幕上。可以在\
  \ `printf()` 中指定变量列表。变量的值按照 `printf()` 中提到的顺序打印。`printf()` 函数将所有类型的数据值打印到控制台。它将内部值转换为字符。它需要格式转换符号或格式字符串以及变量名来打印数据。格式字符串符号和变量名在数量和类型上应该一致。`printf()`\
  \ 语句的语法如下：\n\n```c\nprintf(“Control string”,variable1,variable2,. . .variable n);\n\
  ```\n\n控制字符串指定字段格式，例如 `%d`、`%s`、`%g`、`%f` 以及程序员指定的变量。\n\n以下是 `printf()` 函数的一些示例。\n\
  \n**示例：**\n\n```c\nvoid main()\n{\nint x=2;\nfloat y=2.2;\nchar z='C’;\nprintf(“%d\
  \ %f %c”,x,y,z);\n}\n```\n\n**输出：**\n2 2.2000 C\n\n在上述程序中，`%d` 对应变量 `x`，`%f` 对应\
  \ `y`，`%c` 对应 `z`。用户提供的转换符号帮助 `printf()` 识别给定变量的数据类型。如果发生不匹配，变量的值将根据提供的转换符号进行转换。\n\
  \n**示例：**\n\n```c\nint main()\n{\nint y=65;\nclrscr();\nprintf(“%c %d”,y,y );\n\
  return 0;\n}\n```\n\n**输出：**\nA 65\n\n在上面的示例中，整数变量 `y` 包含值 65。变量 `y` 使用两个转换符号（整数和字符）打印。如输出所示，`%c`\
  \ 将数值 65 转换为其对应的字符 A。`%d` 原样打印值 65，因为该变量是整数类型。有时，如果两个数据类型之间无法进行转换，则会打印某些垃圾值。\n\n\
  **示例：**\n\n```c\nint main()\n{\nint y=7;\nclrscr();\nprintf(“%f”,y );\nreturn 0;\n\
  }\n```\n\n在上面的示例中，尝试在 `printf()` 语句中提供 `%f` 作为转换符号将整数值作为浮点数值打印。这不是正确的方法。编译时不会发生错误，但在执行后\
  \ `printf()` 函数将产生错误信息‘floating points formats not linked’（浮点格式未链接）。\n\n格式字符串无非以双引号开头和结尾的字符串。`printf()`\
  \ 语句用于将数据显示在控制台或 `stdout`（标准输出设备）上。格式字符串是两种字符对象的组合。它们是普通字符和转换规范。\n\n##### 4.3 格式字符串中的标志、宽度和精度\n\
  \n普通字符是直观的，用于在屏幕上写入数据。另一方面，转换规范从参数列表中检索参数并对它们应用不同的格式化。所有的格式规范都以 `%` 开头，在该符号后跟一个格式规范字母。它表示数据类型和其格式。如果格式字符串与相应的变量不匹配，结果将不正确。\n\
  \n**标志 (Flags)**：标志用于输出对齐、数值正负、小数点、尾随零。标志 `(−)` 使结果左对齐。如果没有给出，默认是右对齐。加号 `(+)` 符号转换结果始终以加号\
  \ `(+)` 或减号 `(−)` 符号开头。\n\n**宽度指定符 (Width specifier)**：它为输出值设置最小字段宽度。宽度可以通过小数点或使用星号\
  \ `*` 来指定。\n\n提供了一些关于宽度要求的程序。\n\n![img](img/aero.png) 4.1 编写一个程序来演示宽度指定符的使用。\n\n\
  ```c\nvoid main()\n{\nclrscr();\nprintf(“\\n%.2s”,“abcdef”);\nprintf(“\\n%.3s”,“abcdef”);\n\
  printf(“\\n%.4s”,“abcdef”);\n}\n```\n\n**输出：**\nab\n abc\n abcd\n\n**解释：**\n仔细观察上面的程序，并观察转换规范字符\
  \ `%s` 一起指定的宽度。虽然实际字符串长度为六个字符，但根据 `printf()` 语句打印的字符数分别为 2、3 和 4。\n\n![img](img/aero.png)\
  \ 4.2 编写一个程序来演示宽度指定符的使用。\n\n```c\nvoid main()\n{\nint x=55,y=33;\nclrscr();\nprintf(“\\\
  n %3d”,x−y);\nprintf(“\\n %6d”,x−y);\n}\n```\n\n**输出：**\n22\n   22\n\n**解释：**\n\
  在这个程序中，第一个 `printf()` 语句给出的宽度为 3，第二个指定的宽度为 6。因此，结果显示在屏幕上的不同位置。\n\n![img](img/aero.png)\
  \ 4.3 编写一个程序来演示使用 `*` 进行格式化。\n\n```c\nvoid main()\n{\nint x=55,y=33;\nclrscr();\n\
  printf(“\\n %*d”,15,x−y);\nprintf(“\\n %*d”,5,x−y);\n}\n```\n\n**输出：**\n     22\n\
  22\n\n**解释：**\n在这个程序中，`*` 与格式字符串或转换规范 `%d` 一起使用。这里 15 和 5 作为参数传递。`printf()` 语句在格式字符串中需要这些参数。这指定了从哪里开始打印的值。\n\
  \n**精度指定符 (Precision specifiers)**：精度指定符始终以点（.）开头，并与宽度指定符隔开以获取精确结果。\n\n考虑以下程序：\n\
  \n![img](img/aero.png) 4.4 编写一个程序来演示精度指定符的使用。\n\n```c\nvoid main()\n{\nfloat g=123.456789;\n\
  clrscr();\nprintf(“\\n%.1f”,g);\nprintf(\"\\n%.2f”,g);\nprintf(“\\n%.3f”,g);\nprintf(“\\\
  n%.4f”,g);\n}\n```\n\n**输出：**\n123.5\n123.46\n123.457\n123.4568\n\n**解释：**\n在上面的示例中，`printf()`\
  \ 语句尝试提供 `%f` 作为转换符号将整数值作为浮点值打印（注：原文此处为 integer 可能是误指 float）。精度指定符控制了小数点后的数字位数。\n\
  \n\n\n\n\n- `%d`: 数据被视为整数。\n- `%c`: 数据被视为字符。\n- `%s`: 字符串。\n- `%f`: 数据被视为浮点数。\n\n\
  ```\nscanf(“%d %f %c”,&a,&b,&c);\n```\n\n`scanf()` 语句需要称为地址操作符的 `&` 算符。地址操作符打印变量的内存位置。在这里，在\
  \ `scanf()` 语句中，`&` 操作符的作用是指示变量的内存位置，以便将读取到的值放置在该位置。\n\n`scanf()` 语句还会返回结果。返回值完全等于于正确读取的值个数。如果发生任何不匹配，将抛出错误。否则，如果读取到的值可以转换为给定的格式，则进行转换。以下程序展示了此类不匹配情况的示例。\n\
  \n![img](img/aero.png) 4.6 写一个程序显示数据类型不匹配的影响。\n\n```c\nvoid main()\n{\nint a;\n\
  clrscr();\nprintf(“Enter value of ‘A’ : ”);\nscanf(“%c”,&a);\nprintf(“A=%c”,a);\n\
  }\n```\n\n**OUTPUT：**\nEnter value of ‘A’ : 8\nA=8\n\n**Explanation:**\n在上述程序中，虽然变量\
  \ `a` 的类型是 `int`，但它与字符转换符号完美工作，即字符和整数数据类型是相互兼容的。当两个数据类型相互兼容时，其兼容范围等于这两种数据类型中最低的范围。上面的示例说明了这一点。\n\
  \n![img](img/aero.png) 4.7 写一个程序使用字符变量读取并打印整数值。\n\n```c\nvoid main()\n{\nchar a;\n\
  clrscr();\nprintf(“Enter value of ‘A’ : ”);\nscanf(“%d”,&a);\nprintf(“A=%d”,a);\n\
  }\n```\n\n**OUTPUT:**\nEnter value of ‘A’ : 255\nA=255\nEnter value of ‘A’ : 256\n\
  A=0\n\n**Explanation:**\n在上述程序中，变量 `a` 是字符类型，即其有效范围是 0 到 255。变量 `a` 被与整数数据类型的转换符号一起，即在\
  \ `printf()` 和 `scanf()` 语句中变量 `a` 被视为整数类型。第一次执行时读取的值是有效的。因此，它按原样打印。在第二次执行中，读取的值超过了字符类型的范围。在这种情况下，多出的范围再次被视为起始或起始点。在这里，多出的值为\
  \ 1。这就是为什么打印了 0。\n\n考虑以下 `scanf()` 语句，其中 `a`、`b` 和 `c` 是整数变量。\n\n**Examples:**\n\
  1. `scanf(“%d %d %d”,a,b,c);`\n2. `scanf(“%d,%d,%d”,a,b,c);`\n\n在第一个语句中，格式字符串（`%d`）由空格分隔。这表示在为这些变量输入值时，值应该用空格分隔。同样，在第二个语句中，格式字符串（`%d`）由逗号分隔；因此，在输入时，值应该用逗号分隔。以下程序说明了这一点。\n\
  \n![img](img/aero.png) 4.8 写一个程序演示在 scanf() 语句中使用逗号。\n\n```c\nvoid main()\n{\nint\
  \ a,b,c;\nclrscr();\nprintf(“\\nEnter values :”);\nscanf(“%d, %d,%d”,&a,&b,&c);\n\
  printf(“a=%d b=%d c=%d”,a,b,c);\n}\n```\n\n**OUTPUT：**\nEnter values: 4,5,8\na=4\
  \ b=5 c=8\n\n**Explanation:**\n从上面的程序可以清楚看出，如果格式字符串由逗号分隔，输入也应该用逗号分隔。建议读者通过编写更多程序来尝试。表\
  \ 4.2 描述了各种输入对应的格式。\n\n**表 4.2 各种输入的格式**\n![img](img/page93_1.png)\n\n以下是一个说明一些格式化格式的示例。\n\
