  \ <ctype.h>\nvoid main()\n{\n    int a();\n    int x=5;\n    clrscr();\n    switch(a())\n\
  \    {\n      case ‘s’ :\n      printf(\"\\n Square of %d is %d”,x,pow(x,2));\n\
  \      break;\n      case ‘c’ :\n      printf(\"\\n Cube of %d is %d”,x,pow(x,3));\n\
  \      break;\n      case ‘d’ :\n      printf(\"\\n Double of %d is %d”,x,x*2);\n\
  \      break;\n      default :\n      printf(\"\\n Unexpected Choice printed as\
  \ it is : %d”, x);\n    }\n}\n\nint a()\n{\n    char c=‘’;\n    printf(\"Enter Your\
  \ Choice Square(s),Cube(c),Double(d) : ”);\n    c=getche();\n    c=tolower(c);\n\
  \    return(c);\n}\n```\n\n**输出:**\nEnter Your Choice Square(s),Cube(c),Double(d)\
  \ : D\nDouble of 5 is 10\n\n***解释:***\n在上述示例中，值 ‘5’ 被赋值给变量 `x`。在这里，函数是从 `switch()`\
  \ 语句调用的。它提示用户输入选择。用户输入的选择返回给 `switch()` 语句。根据这个值，执行匹配的 `case` 语句。在所示输出中，用户按了 ‘D’。`switch()`\
  \ case 执行了双倍操作。\n\n##### 10.11 函数和循环语句\n\n循环语句用于根据给定的次数或某些条件重复执行程序代码。\n\n1. for\
