  | 5 | 24 |\n| 6 | 24 12 |\n| 7 | Result of function is= 13 |\n| 8 | Result of function\
  \ is= 125 |\n\n\n\n\n\n##### 11.1.1 变量的生命周期\n\n每个变量都有其生命周期，即它在程序中处于激活状态的时间持续。我们也可以说变量的生命周期是其声明和清理之间的时间间隔。生命周期取决于存储类型。例如，`auto`\
  \ 变量在函数执行结束时立即被销毁，而 `static` 变量则留在内存中。\n\n##### 11.1.2 变量的可见性\n\n变量的可见性是另一个属性。它定义了变量的作用域。作用域有两种，即局部和全局。全局在整个程序中可识别，而局部变量的作用域局限于声明块。\n\
  \n##### 11.2 自动变量 (AUTOMATIC VARIABLES)\n\n`auto` 变量定义在函数内部。在函数内部声明且没有存储类型名称的变量默认是\
  \ `auto` 变量。这些函数声明在栈（stack）上。栈提供了临时存储。变量的作用域局限于其定义的块。这些变量仅对当前块或程序可用。一旦函数执行并返回关闭函数，`auto`\
  \ 变量或局部变量的内容和存在就会消失。每当执行函数时，所有 `auto` 变量都会分配内存，并在函数执行结束时释放。`auto` 变量是安全的，即它们不能被其他函数直接访问。\n\
  \n关键字 `auto` 用于声明自动变量。默认情况下，每个变量都属于 `auto` 存储类型。\n\n这里给出关于 `auto` 存储类型的程序示例。\n\n\
  ![img](img/aero.png) 11.1 写一个程序来显示 auto 变量的工作原理。\n\n```c\nvoid main()\n{\n    auto\
  \ int v=10;\n    clrscr();\n    call2();\n    printf(\"\\nV=%d\",v);\n}\n\nvoid\
  \ call1()\n{\n    auto int v=20;\n    printf(\"\\nV=%d\",v);\n}\n\nvoid call2()\n\
  {\n    auto int v=30;\n    call1();\n    printf(\"\\nV=%d\",v);\n}\n```\n\n**输出：**\n\
  V=20\nV=30\nV=10\n\n**解释：**\n\n在上述程序中，变量 `v` 在三个不同的函数中被声明并初始化。每个函数在调用时都会打印变量 `v`\
  \ 的局部值，这些值显示在输出中。当函数被调用时，它会声明自己的变量 `v`，当函数终止时，局部变量 `v` 会被销毁。在这里，每个函数都有自己具有不同值的变量\
  \ `v`。这三个变量 `v` 拥有各自独特的内存地址。即使从程序中删掉 `auto` 单词，编译器也不会抛出任何错误。读者可以验证这一事实。\n\n![img](img/aero.png)\
  \ 11.2 写一个程序来显示 auto 变量在不同块中的工作。\n\n```c\nvoid main()\n{\n    int x=10;\n    clrscr();\n\
  \    printf(\"\\n X=%d\",x);\n    {\n        int x=20;\n        printf(\"\\n X=%d\"\
  ,x);\n    }\n    printf(\"\\n X=%d\",x);\n}\n```\n\n**输出：**\nX=10\nX=20\nX=10\n\n\
  **解释：**\n\n在上述程序中，`x` 的声明执行了两次，且值不同。在第二个块之前，`x` 的值为 10。控制权传递到第二个块，`x` 再次被声明并赋值为新值\
  \ 20。当控制权退出第二个块时，第二个 `x` 的值消失，并打印当前块的值（即 10）。在第二个变量声明中，`int x=20` 意味着我们声明了另一个与第一个变量\
  \ `x` 变量 `x`。如果我们只声明 `x=20`（即更改第一个 `x` 的值），则不会创建第二个变量 `x`。因此，`int` 告诉编译器创建一个新变量并在内存中为其分配两个字节。\n\
  \n![img](img/aero.png) 11.3 写一个程序，在不同块中使用不同数据类型使用同一个变量。\n\n```c\nvoid main()\n{\n\
  \    int x=10;\n    clrscr();\n    printf(\"\\n X=%d\",x);\n    {\n        float\
  \ x=2.22;\n        printf(\"\\n X=%g\",x);\n    }\n    {\n        char *x=\"Auto\
  \ Storage Class\";\n        printf(\"\\n X=%s\",x);\n    }\n    printf(\"\\n X=%d\"\
  ,x);\n}\n```\n\n**输出：**\nX=10\nX=2.22\nX=Auto Storage Class\nX=10\n\n**解释：**\n\n\
  上述程序与上一个相同。在这里，在每个块中变量都是使用不同的数据类型定义的。\n\n##### 11.3 外部变量 (EXTERNAL VARIABLES)\n\n\
  外部存储类型表示变量已定义在声明处以外的其他地方。它可以在另一个源文件中声明。变量声明通常出现在 `main()` 之前，使用 `extern` 表示该变量在其他处定义。（注：原文此处有重复描述，已按意译整合）。\n\
  \n```c\nextern j;\nvoid main()\n{\n    printf(\"%d\", j);\n}\n```\n\n11.4 写一个程序演示外部变量的使用。\n\
  \n```c\nint j=10;\nvoid main()\n{\n    printf(\"%d\", j);\n}\n```\n\n11.5 写一个在多个文件中使用外部变量的程序。\n\
  \n```c\nint j=10;\nvoid main()\n{\n    printf(\"%d\", j);\n}\n```\n\n11.6 写一个程序显示外部变量的工作原理。\n\
  \n```c\nint v=10;\nvoid main()\n{\n    printf(\"%d\", v);\n}\n```\n\n11.7 写一个程序显示同名自动变量和全局变量的工作原理。\n\
  \n```c\nint v=10;\nvoid main()\n{\n    clrscr();\n    call1();\n    call2();\n \
  \   printf(\"\\n In main() V=%d\",v);\n}\n\nvoid call1()\n{\n    int v=20;\n   \
  \ printf(\"\\n In Call1() V=%d\",v);\n}\n\nvoid call2()\n{\n    printf(\"\\nIn call2()\
  \ V=%d\",v);\n}\n```\n\n**输出：**\nIn Call1() V= 20\nIn call2() V= 10\nIn main() V=\
  \ 10\n\n**解释：**\n\n在上述程序中，外部变量和全局变量使用了相同的名称。在这种情况下，当调用 `call1()` 函数时，`call1()` 的局部变量\
  \ `v` 隐藏了全局变量 `v`。一旦控制权从 `call1()` 函数返回，局部变量 `v` 将被销毁，全局变量 `v` 出现。\n\n\n\n\n\n![img](img/aero.png)\
  \ 11.8 写一个程序使用 `extern` 关键字声明外部变量。\n\n```c\nint m=10;\n\nvoid main()\n{\n\nextern\
  \ int m;\n\nclrscr();\n\nprintf(“\\n m=%d”,m);\n}\n```\n\n**输出：**\n\nm = 10\n\n\
  **解释：**\n\n在上述程序中，变量‘m’ 在 `main()` 函数之前被声明并初始化为 10。变量‘m’ 再次使用 `extern` 关键字重新定义。`extern`\
  \ 关键字是可选的。\n\n##### 11.4 静态变量 (STATIC VARIABLES)\n\n静态变量可以是内部类型或外部类型，取决于它的声明位置。如果在函数体外声明，它将是静态全局变量。如果在函数体或块内声明，它将是一个自动变量（auto\
  \ variable）。当一个变量被声明为静态时，它的垃圾值会被移除并初始化为 `NULL` 值。存储在这些变量中的内容在整个程序执行过程中保持不变。静态变量只初始化一次；永远不会重新初始化。静态变量的值在每次调用时都会存在，且静态变量值的最后一次更改将贯穿程序执行。利用静态变量的这一属性，我们可以统计函数被调用的次数。\n\
  \n以下程序说明了静态变量的工作原理。\n\n![img](img/aero.png) 11.9 写一个程序展示静态变量的使用。\n\n```c\nvoid main()\n\
  {\n\nclrscr();\n\nfor(;;)\n\nprint();\n\n}\n\nprint()\n{\n\nint static m;\n\nm++;\
  \ printf(“\\nm=%d”,m);\n\nif(m==3)\n\nexit(1);\n}\n```\n\n**输出：**\n\nm=1\n\nm=2\n\
  \nm=3\n\n**解释：**\n\n在上述程序中，调用了 `print()` 函数。`print()` 函数的变量‘m’是静态变量。它在每次调用时增加并打印。它的内容在每次调用时都持续。在第一次调用时，它的值从\
  \ 0 变为 1，第二次调用从 1 变为 2，第三次调用从 2 变为 3。\n\n![img](img/aero.png) 11.0 写一个程序展示未初始化时自动类变量和静态类变量之间的区别。\n\
  \n```c\nvoid main()\n{\n\nint x;\n\nstatic int y;\n\nclrscr();\n\nprintf(“\\nx=%d\
  \ & y=%d”,x,y);\n}\n```\n\n**输出：**\n\nx=1026 & y =0\n\n**解释：**\n\n在上述程序中，变量‘x’和‘y’被声明为整数变量。变量‘y’是一个静态变量。两个变量都被打印出来。打印的‘x’的值是垃圾值，即\
  \ 1026，而‘y’是 0。当我们把一个变量声明为静态时，它会自动初始化为零，否则会在其空闲位置分配某些垃圾值。\n\n##### 11.5 静态外部变量 (STATIC\
  \ EXTERNAL VARIABLES)\n\n静态外部变量只有在定义它的文件中才能作为外部变量访问。其他文件无法访问在另一个文件中定义的静态外部变量。\n\n\
  ![img](img/aero.png) 11.11 静态外部变量使用的程序。\n\n```c\n#include <stdio.h>\n\n#include\
  \ <conio.h>\n\nstatic int i;\n\nint main()\n{\n\ni=20;\n\nclrscr();\n\nprintf(“\\\
  n The value of I is : %d”,i);\n\ngetch();\n\nreturn 0;\n}\n```\n\n**输出：**\n\nThe\
  \ value of i is : 20\n\n**解释：**\n\n在上述程序中，外部变量‘i’仅在该程序的范围内被访问。其他文件无法访问在另一个文件中定义的静态外部变量。\n\
  \n**注意：** 普通外部变量与静态外部变量的区别在于作用域。普通外部变量对文件中所有函数可见，并可以被其他文件的函数使用。静态外部变量仅对其所在文件中的定义点及之后的函数可见。\n\
  \n##### 11.6 寄存器变量 (REGISTER VARIABLES)\n\n我们也可以将某些变量放在 CPU 寄存器而不是内存中。`register`\
  \ 关键字告诉编译器其后的变量列表将保留在 CPU 寄存器中，因为寄存器访问比内存访问快。如果 CPU 无法将变量保留在 寄存器中，则这些变量被视为自动变量并存储在内存中。CPU\
  \ 寄存器的数量是的。因此，我们不能使用寄存器变量声明更多变量。然而，一旦达到限制，编译器会将寄存器变量转换为非寄存器变量。用户无法确定寄存器变量的成功或失败。我们不能对所有类型的变量使用寄存器类。微型计算机中的\
  \ 8086 CPU 寄存器是 16 位的寄存器。`float`和`double`数据类型需要超过 16 位的空间。如果我们用寄存器类定义这些数据类型的变量，不会显示错误。编译器会将其视为自动类变量。\n\
  \n**语法：**\n\n```c\nregister int k;\n```\n\n![img](img/aero.png) 11.12 写一个程序声明并使用寄存器类变量。\n\
  \n```c\nvoid main()\n{\n\nregister int m=1;\n\nclrscr();\n\nfor(;m<=5;m++)\n\nprintf：“\\\
  t%d”,m);\n\n}\n```\n\n**输出：**\n\n1\n2\n3\n4\n5\n\n**解释：**\n\n在上述程序中，变量‘m’被声明并初始化为\
  \ 1。\n\n### 总结 (SUMMARY)\n\n学习本章后，你对变量的理解是完美的。你学习了存储类。建议读者执行程序以理解概念。\n\n### 练习 (EXERCISES)\n\
