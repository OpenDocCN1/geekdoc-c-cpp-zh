  \n| 3. | 它停止循环的执行。 | 它终止程序。 |\n\n##### 5.7 `continue` 语句\n\n`continue` 语句与 `break`\
  \ 语句完全相反。`continue` 语句用于继续循环语句的下次迭代。当它在循环中出现时，它不会终止循环，而是跳过该语句之后的语句。当我们想在不执行程序任何部分的情况下继续程序运行时，它是非常有用的。表\
  \ 5.2 给出了 `break` 和 `continue` 之间的差异。\n\n**表 5.2 `break` 与 `continue` 的区别**\n\n\
  | break | continue |\n| --- | --- |\n| 退出当前块或循环。 | 循环进入下一次迭代。 |\n| 控制权传递到下一个语句。\
  \ | 控制权传递到循环开头。 |\n| 终止循环。 | 永远不会终止程序。 |\n\n##### 5.8 `goto` 语句\n\n语句不需要任何条件。这是一个无条件的控制跳转。该语句将控制传递到程序的任何地方，即在不测试任何条件的情况下将控制转移到程序的另一部分。用户必须按照如下方式定义\
  \ `goto` 语句：\n\n```c\ngoto label;\n```\n\n其中，标签名必须以任何字符开头。\n\n这里，`label` 是控制要转移的位置。为了方便理解，描述了几个例子。\n\
  \n![image](img/aero.png) 5.14 编写一个程序来检测输入的数字是偶数还是奇数。使用 `goto` 语句。\n\n```c\n# include\
  \ <stdlib.h>\n\nvoid main()\n{\nint x;\nclrscr();\nprintf(“Enter a Number :”);\n\
  scanf(“%d”,&x);\nif(x%2==0)\ngoto even;\nelse\ngoto odd;\neven :\nprintf(“\\n %d\
  \ is Even Number.”,x);\nreturn;\nodd:\nprintf(“\\n %d is Odd Number.”,x);\n}\n```\n\
  \n**输出：**\n\nEnter a Number : 5\n5 is Odd Number.\n\n**解释：**\n\n在上面的程序中输入了一个数字。使用取模运算符检查该数字是偶数还是奇数。当数字为偶数时，`goto`\
  \ 语句将控制转移到标签 `even`。同样，当数字为奇数时，`goto` 语句将控制转移到标签 `odd` 并显示相应的信息。\n\n![image](img/aero.png)\
