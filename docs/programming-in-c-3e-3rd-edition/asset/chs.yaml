  在程序程序中，输入了一个字符串。该字符串被传递给函数 `strupr()`。此函数将字符串转换为大写字母。\n\n### strdup() 函数\n\n此函数用于在指针变量指向的分配内存中复制给定的字符串。该函数的语法为\
  \ `text2=strdup(text1)`。\n\n其中 `text1` 是字符串，`text2` 是一个指针。\n\n![image](img/aero.png)\
  \ 8.22 编写一个程序，输入字符串并获取其副本。使用 `strdup()` 函数。\n\n```c\n# include <string.h>\n\nvoid\
  \ main()\n{\n    char text1[20],*text2;\n    clrscr();\n    printf(“Enter Text :”);\n\
  \    gets(text1);\n    text2=strdup(text1);\n    /* 指针 *text2 通过 strdup() 函数初始化为\
  \ text1 的地址。 */\n    printf(“Original String = %s\\nDuplicate String = %s”,text1,text2);\n\
  }\n```\n\n**输出：**\n\nEnter Text : Today is a Good Day.\n\nOriginal String = Today\
  \ is a Good Day.\n\nDuplicate String = Today is a Good Day.\n\n### 解释\n\n在上述程序中声明了字符数组\
  \ `text1[]` 和指针变量 `*text2`。在字符数组 `text1[]` 中输入一个字符串。`strdup()` 函数将 `text1[]` 数组的内容复制到指针变量\
  \ `*text2`。`printf()` 函数显示两个变量的内容，它们是相同的。\n\n### strchr() 函数\n\n此函数返回字符在给定字符串中第一次出现的指针位置。该函数的格式为\
  \ `chp=strchr(string,ch)`。\n\n其中 `string` 是字符数组，`ch` 是字符变量，`chp` 是用于收集 `strchr()`\
  \ 函数返回地址的指针。该函数的语法为 `strchr(char*string, char character)`。\n\n![image](img/aero.png)\
  \ 8.23 编写一个程序，在给定字符串中查找给定字符第一次出现的位置。使用 `strchr()` 函数。\n\n```c\n# include <string.h>\n\
  \nvoid main()\n{\n    char string[30],ch,*chp;\n    clrscr();\n    printf(“Enter\
  \ Text Below :”);\n    gets(string);\n    printf(“\\nCharacter to find :”);\n  \
  \  ch=getchar();\n    /* 返回给定字符在第一次出现位置的指针 */\n    /* 指针 chp，如果没有找到给定字符，strchr()\
  \ 返回空。*/\n    chp=strchr(string,ch);\n    if(chp)\n    printf(“Character %c found\
  \ in string.”,ch);\n    else\n    printf(“Character %c not found in string.”,ch);\n\
  }\n```\n\n**输出：**\n\nEnter Text Below: Hello Beginners.\n\nCharacter to find : r\n\
  \nCharacter r found in string.\n\n或\n\n![image](img/aero.png) 8.24 编写一个程序，在给定字符串中查找给定字符第一次出现的位置。找到字符出现的内存位置。使用\
  \ `strchr()` 函数。\n\n```c\n# include <string.h>\n\nvoid main()\n{\n    char line1[30],line2,*chp;\n\
  \    int i;\n    clrscr();\n    puts(“Enter Text :”);\n    gets(line1);\n    puts(“Enter\
  \ Character to find from the text :”);\n    line2=getche();\n    for(i=0;i<strlen(line1);i++)\n\
  \    printf(“\\n%c %u”,line1[i],&line1[i]);\n    *chp=strchr(line1,line2);\n   \
  \ if(chp)\n    {\n        printf (“\\nAddress of first %c returned by strchr() is\
  \ %u“,line2,chp);\n    }\n    else\n    printf(“%c character is not present in Given\
  \ String”,line2);\n}\n```\n\n**输出：**\n\nEnter Text : HELLO\n\nEnter Character to\
  \ find from the text : L\n\nH 4032\n\nE 4033\n\nL 4034\n\nL 4035\n\nO 4036\n\nAddress\
  \ of first L returned by strchr() is 4034.\n\n### 解释\n\n此函数在给定字符串中找到给定字符第一次出现的内存位置。当找到该字符时，程序终止，`strchr()`\
  \ 函数提供该字符的地址。`strchr()` 函数返回第一次出现的字符的内存地址，即它返回由指针变量收集的内存地址。\n\n**注意：** 在 `strchr()`\
  \ 的位置可以使用 `strrchr()`。它们之间的区别在于，`strchr()` 从字符串开始搜索字符的出现位置，而 `strrchr()` 从字符串末尾（反向）搜索字符的出现位置。\n\
  \n### strstr() 函数\n\n此函数在第一个字符串中寻找第二个字符串。它返回第二个字符串在第一个字符串中开始的指针位置。如果在字符串中没有观察到第一次出现，函数返回\
  \ NULL 字符。\n\n该函数的语法为 `strstr (char *string1,char *sring2)`。\n\n![image](img/aero.png)\
  \ 8.25 编写一个程序使用 `strstr()` 函数查找第二个字符串在第一个字符串中的出现。\n\n```c\n# include <string.h>\n\
  \nvoid main()\n{\n    char line1[30],line2[30],*chp;\n    clrscr();\n    puts(“Enter\
