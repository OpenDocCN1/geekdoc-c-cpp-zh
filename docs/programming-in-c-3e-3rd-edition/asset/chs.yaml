  \ 循环\n\nC 语言中的另一种循环结构是 `while` 循环。`while` 循环经常用于程序中重复执行循环中的语句。直到满足特定条件，循环语句将一直执行。\n\
  \n`while` 循环的语法如下：\n\n```c\nwhile(test condition)\n{\n    body of the loop\n}\n\
  ```\n\n`test condition` 位于顶部，在处理循环体之前测试表达式的值。`test condition` 可以是任何表达式。循环语句将一直执行到条件为真，即：`test\
  \ condition` 被求值，如果条件为真，则执行循环体。当条件变为假时，执行将跳出循环。\n\n循环的执行可以参考图 6.5 中提供的流程图。\n\n![image](img/page194_1.png)\n\
  \n**图 6.5 显示循环执行的流程图**\n\n在这里，循环块可以包含单个语句或多个语句。同一个块可以重复执行。\n\n只有当循环体包含多个语句时才需要大括号。但即使循环体只包含一个语句，使用大括号也是良好的习惯。\n\
  \n![img](img/aero.png) 6.50 写一个程序使用 while 循环打印九次字符串“You have learnt C program”。\n\
  \n```c\nvoid main()\n{\n    int x=1;\n    while(x<10)\n    {\n        printf(\"\\\
  n You have learnt C program\");\n        x++;\n    }\n}\n```\n\n**输出:**\n```text\n\
  You have learnt C program\nYou have learnt C program\nYou have learnt C program\n\
  You have learnt C program\nYou have learnt C program\nYou have learnt C program\n\
  You have learnt C program\nYou have learnt C program\nYou have learnt C program\n\
  ```\n\n**解释：**\n`while` 之后的括号内包含一个条件。只要该条件保持为真，循环体内的所有语句就会被重复执行。变量 `x` 初始化为 `1`。编译器检查条件，在满足条件后执行循环体。然后控制权回到\
  \ `while` 循环。下一次，`x` 的值加 `1`。现在如果 `x` 再次为 `2`，它将满足条件并执行循环体。这个过程一直持续到 `x` 的值达到 `9`。当条件变为假（在\
  \ 9 之后），控制权传递到 `while` 循环体之后的第一个语句，程序此时终止。程序的输出如所示。\n\n![img](img/aero.png) 6.51\
  \ 写一个程序，从 1 开始加 10 个连续数字。使用 while 循环。\n\n```c\nvoid main()\n{\n    int a=1,sum=0;\n\
  \    clrscr();\n    while(a<=10)\n    {\n        printf(\"%d\",a);\n        a++;\n\
  \    }\n    printf(\"\\n Sum of 10 consecutive numbers is %d\",sum);\n}\n```\n*(注：由于原文中\
  \ 6.51 的文本较为破碎，此处根据提供的片段进行了逻辑重构)*\n\n\n\n\n![img](img/aero.png) 6.55 编写一个程序将十进制数转换为用户定义的进制。该进制的基数可以高达\
