  \ `settextjustify()`，它负责文本的对齐。\n\n### 15.5.1 样式线条\n\n![image](img/aero.png) 15.13\
  \ 编写一个显示样式线的程序。\n\n```c\n# include <graphics.h>\n\nvoid main()\n{\nint gd =DETECT,gm,x,y;\n\
