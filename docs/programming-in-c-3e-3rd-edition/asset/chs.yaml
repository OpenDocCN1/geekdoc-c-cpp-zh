  \ Found in Text=2 times.\nCharacter ‘o’ Found in Text=3 times.\n\n**解释：**\n程序的逻辑与上一个相同。在此程序中，搜索的字符是\
  \ ‘m’‘r’ 和 ‘o’。`for` 循环内的 `if` 语句在这些字符匹配时增加相应的计数器变量。因此，在执行 `for` 循环后，打印了三个计数器变量\
