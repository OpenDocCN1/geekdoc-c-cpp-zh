  \ 插入一个换行。\n\n### 总结\n\n本章重点关注函数。你已经学习了在编写 C 语言程序时如何初始化和使用函数。还通过示例解释了函数之间如何相互作用。同时也描述了如何将函数作为参数。读者应该知道，函数始终返回一个整数值。可以按照本章所示执行程序。此外，在函数原型中指定非整数数据类型也可以返回数值。还通过合适的示例解释了函数的递归性质。通过编程示例解释了直接递归函数和间接递归函数。\n\
