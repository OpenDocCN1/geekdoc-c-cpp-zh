  \n##### 15.5 处理文本\n有多个函数可以以不同的字体、大小和方向显示文本。考虑以下函数：\n\n1. `outtextxy(int, int, char\
  \ far *)：用于在图形模式下显示文本。\n2. `settextstyle(int,int,int)`：该函数有三个整数参数。第一个参数是字体，第二个是方向，第三个是大小。\n\
