  }```\n\n**输出：**\nEASY\n\n**解释：**\n在上面的程序中，`memchr()` 函数搜索 ‘E’ 的第一次出现。获取结果后，显示剩余的字符串。\n\
  \n##### 8.7 字符串的应用\n\n![image](img/aero.png) 8.42 编写一个程序，使用 while 循环统计字符在给定文本中出现的次数。\n\
  \n```c\nvoid main()\n{\nchar text[20];\nchar find;\nint i=0,count=0;\nclrscr();\n\
  printf(“Type Text Below.\\n”);\ngets(text);\nprintf(“Type a character to count :”);\n\
  find=getche();\nwhile(text[i]!=‘\\0’)\n{\n  if(text[i]==find)\n  count++;\n  i++;\n\
  }\nprintf(“\\nCharacter (%c) found in String = %d Times.\",find,count);\n}\n```\n\
  \n**输出：**\nType Text Below.\nProgramming\nType a character to count : m\nCharacter\
  \ (m) found in String = 2 Times.\n\n**解释：**\n在上面的程序中，输入了一个字符串。输入了要搜索的单个字符。`while`\
  \ 循环中的 `if` 条件检查字符串的每个字符。如果匹配，计数器 `count` 递增。\n\n![image](img/aero.png) 8.43 编写一个程序，使用\
  \ for 循环统计 ‘m’ 在给定字符串中出现的次数。\n\n```c\nvoid main()\n{\nchar text[25];\nint i,count=0;\n\
  clrscr();\nprintf(“\\nEnter the string:\");\nfor(i=0;i<25;++i)\n{\nscanf(“%c”,&text[i]);\n\
  if(text[i]==‘n’)\nbreak;\nelse\nif(text[i]==‘m’)\n++count;\n}\nprintf(“Character\
  \ ‘m’ Found in Text=%d times.\\n”,count);\ngetche();\n}\n```\n\n**输出：**\nEnter the\
  \ string:\nProgramming is a skill.\nCharacter ‘m’ Found in Text=2 times.\n\n**解释：**\n\
  程序的逻辑与上一个相同。在此程序中搜索的字符是默认字符 ‘m’。`for` 循环内的第一个 `if` 语句在用户按下 ‘\\n’ 键终止终止。第二个 `if`\
  \ 语句检查字符串的每个字符。如果匹配，计数器 `count` 递增。因此，变量给出了字符串中 ‘m’ 出现的次数。\n\n![image](img/aero.png)\
