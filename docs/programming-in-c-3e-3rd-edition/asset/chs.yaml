  \ 动态内存分配\n\n对于程序的执行，将程序载入主内存是至关重要的。当程序无法完全放入主内存时，它的部分会被逐一载入主内存，最终执行整个程序。当然，当前不在主内存中的程序部分位于次级内存（如软磁盘或硬盘）或其他任何磁磁盘中。当程序的新段需要移动到全主内存时，它必须替换已在主内存中的另一个段。存在内存替换策略，其描述超出了本书的范畴。因此，程序员不应该担心程序从次级内存到主内存的传输方法或内存替换策略。\n\
  \n有两种技术用于在主内存中存储 C 程序的信息。第一种技术涉及存储全局变量和局部变量，这些变量在编译期间是固定，并在程序运行期间保持不变。在这里，即使是结构和数组的变量在编译期间也会存储在主内存中。局部变量的空间在变量每次产生时从栈中分配。全局和局部变量在\
  \ C 中被高效地存储。但程序员必须知道每个程序所需的空间大小。\n\n程序在主内存中获取内存空间的第二种技术是动态分配。C 语言提供的特性之一是在程序执行时分配内存。在程序执行期间分配内存的方法称为动态内存分配。程序获取主内存并释放内存通过\
  \ C 提供的某些库函数完成。内存分配技术在本章中描述。这些函数将在接下来的节中介绍。\n\n内存的空闲区域称为堆（heap）。对于所有程序，堆的大小并不是恒不变的。它的大小在程序执行过程中不断变化。这是由于函数和块中局部变量的创建和销毁。\n\
  \n从概念上讲，C 程序如图 16.1 所示。堆根据所使用的内存模型而变化。本章描述了 8086 内存模型。内存需求取决于程序如何设计。例如，如果程序是使用许多递归函数开发的，那么它是通过栈实现的。\n\
  \n![image](img/page613_1.png)\n\n**图 16.1 C 程序使用内存的视图**\n\n## 16.2 内存模型\n\n1. **TINY（微型）：**\
  \ 所有段寄存器初始化为相同的值，所有寻址都使用 16 位完成。这意味着代码、数据和栈都必须限在一个 64-KB 的段内。在这种情况下，程序执行速度快。\n2.\
  \ **SMALL（小型）：** 所有代码应限在单个 64-KB 段内，所有数据应限在第二个 64-KB 段内。所有指针的长度均为 16 位。执行速度与 tiny\
  \ 模型相同。\n3. **MEDIUM（中型）：** 所有数据应限在单个 64-KB 段内；然而，代码允许使用多个段。所有指向数据的指针都是 16 位，但所有的跳转和调用都需要\
  \ 32 位地址。观察到对数据的快速访问，但这种模型也注意到程序执行速度较慢。\n4. **COMPACT（紧凑型）：** 所有代码应限在 64 KB 段内，但数据可以使用多个段。然而，没有任何数据项可以超过\
  \ 64 KB。所有指向数据的指针均为 32 位，但跳转和调用可以使用 16 位地址。数据访问较慢，而代码执行快。\n5. **LARGE（大型）：** 代码和数据都允许使用多个段。所有指针长度均为\
  \ 32 位。然而，没有单一数据项可以超过 64 KB。代码执行较慢。\n6. **HUGE（巨型）：** 代码和数据都允许使用多个段。每个指针长度均为 32\
  \ 位。单个数据项可以超过 64 KB。代码执行最慢。\n\n## 16.3 内存分配函数\n\n变量允许使用内存来存储其值。但内存不会被变量永久使用。现代编程语言允许在需要时为存储变量分配内存空间。它们在不需要时也会释放变量的内存。动态内存分配允许在运行时通过内存分配函数为变量使用内存。在本节及随后的节中，我们将共同讨论各种内存分配和释放函数以及它们在程序中的实现。\n\
  \n1. `malloc()`：使用名为 `malloc()` 的函数分配内存块。换句话说，`malloc()` 函数用于为不同数据类型的变量分配字节单位的内存空间。\n\
  \n```c\n#include <alloc.h>\n#include <stdlib.h>\n\nvoid main() {\n    int k,*p,j=0,sum=0;\n\
  \    float avg;\n    clrscr();\n    puts(\"\\n How many subjects to be entered :\
  \ \");\n    scanf(\"%d\",&k);\n    p=(int *) malloc(k * sizeof(int));\n    while(j!=k)\
  \ {\n        printf(\"Subject %d marks=\",j+1);\n        scanf(\"%d\",p+j);\n  \
  \      j++;\n    }\n    j=0;\n    printf(\"\\n Sum of marks : \");\n    while(j!=k)\
  \ {\n        sum=*(p+j++)+sum;\n    }\n    printf(\"%d\",sum);\n    avg=sum/k;\n\
  \    printf(\"\\n Average marks =%f: \",avg);\n    getche();\n}\n```\n\n**输出：**\n\
  ```\nHow many subjects to be entered : 5\nSubject 1 marks=88\nSubject 2 marks=89\n\
  Subject 3 marks=90\nSubject 4 marks=87\nSubject 5 marks=91\nSum of marks : 445\n\
  Average marks =89.000000:\n```\n\n***解释：**\n在上述程序中，程序提示用户输入科目数量。`sizeof` 函数确定了存储该类型单个值所需的大小。`sizeof`\
  \ 函数确的大小与输入的数量（`k`）相乘得到的结果就是要分配的字节数。指针 `p` 包含基地址。第一个 while 循环通过键盘读取科目分数。每次输入分数时，变量\
  \ `j` 的值加到指针 `p` 上，这指示了其类型的连续地址，输入的科目分数被存储在连续的位置中。这一过程持续到 `j` 的值达到 `k`。因此，通过分配内存，程序员可以在单个变量中存储多个科目分数。在第二个\
  \ while 循环中，计算总分和平均分。\n\n![image](img/aero.png) 16.2 写一个程序，根据项目数量为指针变量分配内存。显示项目的值。\n\
  \n```c\nvoid main() {\n    int *ptr;\n    int i, item;\n    clrscr();\n    printf(\"\
  How many items you want?”);\n}\n```\n\n\n\n\n```c\nscanf(\"%d\",&item);\nptr = (int*)malloc(sizeof(int)*item);\n\
  printf(\"\\nEnter the values of items in Rs:\");\nfor(i=0;i<item;i++)\nscanf(\"\
  %d\",(ptr+i));\nprintf(\"You have entered the values :\\n\");\nfor(i=0;i<item;i++)\n\
  printf(\"\\n%d\",*(ptr+i));\n```\n\n**OUTPUT:**\nHow many items you want?3\nEnter\
  \ the values of items in Rs:111\n233\n100\nYou have entered the values :\n111\n\
  233\n100\n\n**Explanation:**\n请参考示例 16.1 的解释。\n\n### 2. `calloc()`\n`calloc()` 函数非常用于分配多个内存块。它带有两个参数进行声明。其原型在\
  \ `alloc.h` 和 `stdlib.h` 中声明。`calloc()` 函数的格式如下：\n\n```c\npnt= (int *)calloc(4,2);\n\
  ```\n\n上述声明分配了四个内存块；每个块包含两个字节。基地址存储在整数指针中。该函数通常用于为数组和结构体分配内存。`calloc()` 可以替代 `malloc()`\
  \ 函数。使用 `malloc()` 函数演示的程序可以使用 `calloc()` 函数执行。\n\n![image](img/aero.png) 16.3 编写一个程序，使用\
  \ `calloc()` 函数根据书籍数量的要求为指针变量分配内存。\n\n```c\n# include <alloc.h>\n\nvoid main()\n\
  {\nint k,j=0,sum=0;\nint *p;\nclrscr();\nputs(\"\\n How many books to be purchased?”);\n\
  scanf(\"%d\",&k);\np=(int *) calloc(k,2);\nwhile(j!=k)\n{\n  printf(\"Cost of the\
  \ book(%d)=\",j+1);\n  scanf(\"%d\",p+j);\n  sum=sum+*(p+j);\n  j++;\n}\nprintf(\"\
  \\n Total cost of the books: \");\nprintf(\"%d\",sum);\n}\n```\n\n**OUTPUT:**\n\
  How many books to be purchased?\n4\nCost of the book(1)=100\nCost of the book(2)=200\n\
  Cost of the book(3)=400\nCost of the book(4)=500\nTotal cost of the books: 1200\n\
  \n**Explanation:**\n上述程序的逻辑与上一个相同。这里，使用 `calloc()` 函数来分配内存，而不是 `malloc()`。\n\n###\
  \ 3. `free()`\n`free()` 函数用于在不需要时释放内存。因此，使用此函数可以防止内存浪费。该函数的声明如下：\n\n```c\nfree(pnt);\n\
  ```\n\n在上述声明中，`pnt` 是一个指针。`free()` 函数释放指针变量 `pnt` 占据的内存。你可以在第一个 `while` 循环之后放置 `free(p)`，并通过执行程序查看其响应。\n\
