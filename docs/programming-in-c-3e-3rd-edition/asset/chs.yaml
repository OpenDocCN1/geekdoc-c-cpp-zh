  \n## 答案部分：\n\n1. 什么是格式化函数和非格式化函数？\n2. 字符 I/O 和字符串 I/O 有什么区别？\n3. 什么是转义序列？列出并说明转义序列的功能。\n\
  4. 列出任意三个转义序列及其用途。\n5. （后续问题略）\n\n（注：由于原始文本在答案部分不完整，此处仅根据要求翻译了已给出的题目部分）\n\n\n\n\n\
  \n此外，C 语言还支持其他控制语句，如 `continue` 和 `break`。\n\n决策语句检查给定条件，然后执行其子块。决策语句根据给定条件的成功或失败来决定执行哪条语句。\n\
  \n条件语句使用关系运算符，这些运算符已在第 3 章中进行了解释。关系运算符对于比较两个值非常有用。它们可以用于检查这两个值是否相等、不相等，或者其中一个小于/大于另一个。\n\
  \n读者或程序员应该理解上述这些概念。预计程序员需要了解与决策语句相关的以下点：\n\n- **顺序执行：** 程序中的语句按照顺序方式一个接一个地执行。这被称为顺序执行。\n\
  - **控制转移：** 诸如 `if`、`goto`、`break`、`continue`、`switch` 等 C 语句允许程序在程序的不同位置转移控制。这是通过跳过顺序执行流中出现的一个或多个语句来实现的。这种控制跳转被称为控制转移。\n\
  \n在 20 世纪 60 年代，程序员在使用了 `goto` 语句的程序中面临着各种困难，`goto` 语句允许程序员将控制转移到程序的任何地方。Bohm 和\
  \ Jacopini 报告说，程序员不应该在程序中使用 `goto` 语句。Bohm 和 Jacopini 证明，通过仅使用三种控制结构（即顺序结构、选择结构和重复结构）并消除\
  \ `goto` 语句，就可以编写所有的程序。\n\n##### 5.2 if 语句\n\nC 语言使用关键字 `if` 在逻辑条件为真时执行一组命令行或单条命令行。它只有一个选项。只有当逻辑条件为真时，才会执行这组命令行（参见图\
  \ 5.1）。\n\n最简单的 `if` 语句语法如下：\n\n```c\nif (condition) /* 无需分号 */ statement;\n```\n\
  \n![image](img/page114_1.png)\n\n**图 5.1 if 语句**\n\n`if` 语句包含一个被求值的表达式。如果该表达式为真，则返回\
  \ 1，否则返回 0。当条件为真时，执行该语句。如果条件为假，编译器将跳过 `if` 块内的行。条件始终包含在一对括号中。条件语句不应以分号（`;`）结束。`if`\
  \ 语句后的语句通常括在大括号中。大括号表示 `if` 语句的作用范围。默认范围是一条语句。即使在 `if` 条件后只使用一条语句，使用大括号也是良好的做法。\n\
  \n下面是演示 `if` 语句用法的简单程序。\n\n![image](img/aero.png) 5.1 编写一个程序来检查输入的数字是否小于 10。如果是，则显示该数字。\n\
  \n```c\nvoid main()\n{\n    int v;\n    clrscr();\n    printf(“Enter the number\
  \ :”);\n    scanf(“%d”, &v);\n    if(v<10)\n        printf(“\\nNumber entered is\
  \ less than 10”);\n    sleep(2); /* 程序根据给定的秒数停止 */\n}\n```\n\n**输出：**\nEnter the\
  \ number : 9\nNumber entered is less than 10\n\n**解释：**\n在上述程序中，用户可以输入数字。使用 `if`\
  \ 语句检查输入的数字。如果小于 10，则显示消息“Number entered is less than 10”。为了方便理解，为上述程序提供了图 5.2。\n\
  \n![image](img/page115_1.png)\n\n**图 5.2 if 语句（控制流）**\n\n![image](img/aero.png)\
  \ 5.2 编写一个程序来检查候选人的年龄是否大于 17 岁。如果是，则显示消息“Eligible for Voting”。\n\n```c\nvoid main()\n\
  {\n    int age;\n    clrscr();\n    printf(“\\n Enter age in the years :”);\n  \
  \  scanf(“%d\",&age);\n    if(age>17)\n        printf(“\\n Eligible for Voting.”);\n\
  \    getch();\n}\n```\n\n**输出：**\nEnter age in the years : 20\nEligible for Voting.\n\
  \n**解释：**\n在上述程序中，通过键盘输入年龄。如果年龄大于 17 岁，将显示如输出所示的消息。\n\n![image](img/aero.png) 5.3\
  \ 编写一个在 if 块中使用大括号的程序。仅输入三个数字，并计算它们的和和乘积。\n\n```c\nvoid main()\n{\n    int a,b,c,x;\n\
  \    clrscr();\n    printf(“\\nEnter Three Numbers:”);\n    x=scanf(“%d %d %d”,&a,&b,&c);\n\
  \    if(x==3)\n    {\n        printf(“\\n Addition : %d”,a+b+c);\n        printf(“\\\
  n Multiplication : %d”, a*b*c);\n    }\n}\n```\n\n**输出：**\nEnter Three Numbers:\
  \ 1 2 4\nAddition : 7\nMultiplication : 8\n第二次执行后\nEnter Three Numbers: 5 v 8\n\n\
  **解释：**\n变量 `x` 包含了输入的数量。\n\n##### 5.3 if-else 语句\n\n变量 `x` 包含了输入的数量。如果 `x` 是 3，则执行乘法。\n\
  \n`if` 语句包含一个被求值的表达式。如果该表达式为真，则返回 1，否则返回 0。当条件为真时，执行该语句。如果条件为假，编译器将跳过 `if` 块内的行。条件始终包含在一对括号中。条件语句不应以分号（`;`）结束。`if`\
  \ 语句后的语句通常括在大括号中。大括号表示 `if` 语句的作用范围。默认范围是一条语句。即使在 `if` 条件后只使用一条语句，使用大括号也是良好的做法。\n\
  \n下面是演示 `if-else` 语句用法的简单程序（此处原文逻辑衔接）。\n\n`if-else` 的语法如下：\n\n```c\nif (condition)\n\
  {\n    statement1;\n}\nelse\n{\n    statement2;\n}\n```\n\n`if-else` 语句用于有两条执行路径的情况。如果条件为真，则执行\
  \ `if` 块；如果条件为假，则执行 `else` 块。\n\n##### 5.4 嵌套 if 语句\n\n嵌套 `if` 语句是另一个 `if` 语句中的\
  \ `if` 语句。用于顺序测试多个条件。\n\n```c\nif (condition1)\n{\n    if (condition2)\n    {\n\
  \        statement1;\n    }\n}\n```\n\n##### 5.5 switch 语句\n\n`switch` 语句是多个嵌套 `if-else`\
  \ 语句的替代。它将变量与一组常量值进行测试。\n\n```c\nswitch (expression)\n{\n    case value1:\n    \
  \    statement1;\n        break;\n    case value2:\n        statement2;\n      \
  \  break;\n    default:\n        statement3;\n}\n```\n\n## 5.6 循环语句\n\n循环用于多次执行代码块。C\
  \ 中的主要循环有 `while`、`do-while` 和 `for`。\n\n##### `while` 循环\n\n`while` 循环在执行块之前检查条件。\n\
  \n```c\nwhile (condition)\n{\n    statement;\n}\n```\n\n##### `do-while` 循环\n\n\
  `do-while` 循环至少执行一次，然后检查条件。\n\n```c\ndo\n{\n    statement;\n} while (condition);\n\
  ```\n\n##### `for` 循环\n\n`for` 循环用于预知迭代次数的情况。\n\n```c\nfor (initialization; condition;\
  \ increment)\n{\n    statement;\n}\n```\n\n\n\n\n在上述程序中，输入一个需要计算平方的数字。通过取模运算，分离出最后一位数字以确认其是否为\
  \ 5。如果是，则执行 `if` 循环体，用 10 除以输入的数字得到一个商。将该商与其连续的数字相乘并显示。随后，计算并显示 5 的平方。在 `printf()`\
  \ 语句中注意显示两个结果：(i) 商与其连续数字的乘积以及 (ii) 5 的平方。这样就显示了该数字的平方。\n\n![image](img/aero.png)\n\
  \n## 5.6 编写一个程序根据销售额计算医药代表的工资\n\n提供的奖金和激励将基于总销售额。如果销售额大于或等于 1,00,000 卢，遵循表 1 的规定，否则遵循表\
  \ 2。\n\n### 1. 表格\n- `Basic`=3000 卢。\n- `Hra`=`basic` 的 20%。\n- `Da`=`basic` 的 110%。\n\
  - `Conveyance`=500 卢。\n- `Incentive`=`sales` 的 10%。\n- `Bonus`=500 卢。\n\n##### 2.\
  \ 表格\n- `Basic`=3000 卢。\n- `Hra`=`basic` 的 20%。\n- `Da`=`basic` 的 110%。\n- `Conveyance`=500\
  \ 卢。\n- `Incentive`=`sales` 的 5%。\n- `Bonus`=200 卢。\n\n```c\nvoid main()\n{\nfloat\
  \ bs,hra,da,cv,incentive,bonus,sale,ts;\nclrscr();\nprintf(“\\n Enter Total Sales\
  \ in Rs.:”);\nscanf(“%f”, &sale);\nif(sale>=100000)\n{\n    bs=3000;\n    hra=20\
  \ * bs/100;\n    da=110 * bs/100;\n    cv=500;\n    incentive=sale*10/100;\n   \
  \ bonus=500;\n}\nelse\n{\n    bs=3000;\n    hra=20 * bs/100;\n    da=110 * bs/100;\n\
  \    cv=500;\n    incentive=sale*5/100;\n    bonus=200;\n}\nts=bs+hra+da+cv+incentive+bonus;\n\
  printf(“\\nTotal Sales : %.2f”,sale);\nprintf(“\\nBasic Salary : %.2f”’,bs)\nprintf(“\\\
  nHra : %.2f”,hra);\nprintf(“\\nDa : %.2f”,da);\nprintf(“\\nConveyance : %.2f”,cv);\n\
  printf(“\\nIncentive : %.2f”,incentive);\nprintf(“\\nBonus : %.2f”,bonus);\nprintf(“\\\
  nGross Salary : %.2f”,ts);\ngetch();\n}\n```\n\n**输出：**\nEnter Total Sales in Rs.\
  \ 100000\nTotal Sales: 100000.00\nBasic Salary: 3000.00\nHra: 600.00\nDa: 3300.00\n\
  Conveyance: 500.00\nIncentive: 10000.00\nBonus: 500.00\nGross Salary: 17900.00\n\
  \n**解释：**\n该程序根据销售额计算医药代表的工资。基本工资相同，但其他津贴和激励根据销售额而变化。如果销售额大于 1,00,000 卢，津贴和激励的比例按照表\
  \ 1，否则按照表 2。`if` 条件检查给定的销售额数字。如果销售额大于 1,00,000 卢，则执行 `if` 语句后的第一个块，否则执行 `else` 块。在两个块中，都执行了简单的算术运算来计算津贴和总工资。\n\
  \n##### 5.4 嵌套 if–else 语句\n\n在此类语句中，会检查多个逻辑条件以执行不同的语句。在这里，如果任何逻辑条件为真，编译器将执行跟随 `if`\
  \ 条件的块，否则将跳过并执行 `else` 块。在 `if–else` 语句中，在条件失败后默认执行 `else` 块。为了根据特定条件执行 `else` 块，我们可以在\
  \ `else` 块中重复添加 `if` 语句。这种嵌套是无限的。图 5.5 描述了嵌套的 `if–else–if` 块。\n\n![image](img/page120_1.png)\n\
  \n**图 5.5 嵌套 if–else 语句**\n嵌套 `if-else` 语句的语法如下：\n```c\nif(condition)\n{\n/*Inside\
  \ block*/\nif(condition)\n{\nstatement 1; /*if block*/\nstatement 2;\n}\nelse\n\
  {\nstatement 3; /*else block*/\nstatement 4;\n}\n}\nelse\n{\n/*Inside block*/\n\
  if(condition)\n{\nstatement 5; /*if block*/\nstatement 6;\n}\nelse\n{\nstatement\
  \ 7; /*else block*/\nstatement 8;\n}\n```\n从上述块可以描述应用于嵌套 `if-else` 语句的规则：\n1. 嵌套\
  \ `if-else` 可以相互链接。\n2. 如果条件为真，控制传递到跟随 `if` 的块。在这种情况下，可能有一个额外的 `if` 语句再次检查。直到最后一个\
  \ `if` 块中没有 `if` 语句。\n3. 如果条件为假，控制传递到 `else` 块。在这种情况下，可能有一个额外的 `if` 语句再次检查。直到最后一个\
  \ `else` 块中没有 `if` 语句。\n\n##### 5.5 if-else-if 链\n\n在这种语句中，检查多个逻辑条件以执行各种语句。在这里，如果第一个逻辑条件为真，编译器执行跟随第一个\
  \ `if` 的块，否则跳过该块并检查下一个逻辑条件 `else-if`；如果条件为真，则执行跟随 `else-if` 的块。该过程持续直到最后一个 `else`\
  \ 块中没有 `if` 语句。如果所有 `if` 条件变为假，则执行 `else` 块。在 `if-else-if` 链语句中，`else` 块可能不存在。在\
  \ `if-else-if` 链语句中，我们不需要像嵌套 `if-else` 那样记住 `if` 语句与 `else` 语句的括号对，因此代码比嵌套 `if-else`\
  \ 更简单，且效果与 `if-else` 相同。因为它形成了如图 5.6 所示的阶梯结构。\n\n![image](img/page122_1)\n\n**图\
  \ 5.6 if–else–if 链语句**\n`if-else-if` 语句的语法如下：\n```c\nif(condition)\n{\nstatement\
  \ 1; /*if block*/\nstatement 2;\n}\nelse if(condition)\n{\nstatement 3; /*second\
  \ if block*/\nstatement 4;\n}\nelse if(condition)\n{\nstatement 5; /*third if block*/\n\
  statement 6;\n}\nelse\n{\nstatement 7; /*else block*/\nstatement 8;\n}\n```\n从上述块可以描述应用于\
  \ `if-else-if` 语句的规则：\n1. 嵌套 `if-else` 可以相互链接。\n2. 如果第一个 `if` 条件为假，控制传递到 `else-if`\
  \ 块，用下一个 `if` 语句再次检查。该过程持续直到最后一个 `else` 块中没有 `if` 语句。\n3. 如果其中一个 `if` 语句满足条件，其他\
  \ `else-if` 语句将不会执行。\n\n提供的程序基于嵌套 `if-else` 和 `if-else-if` 链语句。\n\n![image](img/aero.png)\n\
