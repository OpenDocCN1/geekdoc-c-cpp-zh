  \ of series :0.5000\n\n## 6.37 写一个程序检测 100 到 999 之间的阿姆斯特数。如果每个数字的立方之和等于该数字本身，则该数字被称为阿姆斯特数（例如\
  \ 153 = 1³+5³+3³）。\n\n```c\n# include <math.h>\nvoid main()\n{\n  int n,d,x,k,i,cube=0;\n\
