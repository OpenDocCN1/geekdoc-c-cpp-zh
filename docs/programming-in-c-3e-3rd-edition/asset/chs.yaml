  \ 为什么要用计算机？\n\n计算机在国家社会经济进步中起着至关重要的作用。每个国家都非常重视计算机素养。个人、周边地区、国家乃至世界的进步只有通过引入和使用计算机才能确保。在生活的各个领域，计算机的使用日益频繁。在世界范围内，计算机正被雇用于提高整体生产力。\n\
  \n\n\n\n\n随着世界各国采用自由化、私有化和全球化政策，在市场中具有竞争力变得至关重要。奢侈的生存不再像古代那样容易。凭借土地、劳动力、体力和资本，经济经济确实可以在一定程度上得到推动，但智力远高于所有这些资产。通过一些窍门（对于普通用户而言）和大量的技术创新（对于开发者而言），数值问题、业务交易和科学应用几乎可以在瞬间完成计算。计算机在程序的基础上执行各种任务。智能计算机无疑是一个强大的工具，但人类的智力能力远高于计算机。因此，计算机没有自己的大脑。计算机的脑力是有限的。因此，通过在日常生活中频繁使用计算机，人类的智力得到了进一步加强。通过学习编程语言、开发软件软件包和使用计算机硬件，个人可以使自己和国家繁荣。\n\
  \n#### 1.2 计算机基础\n\n计算机要处理的数据以不同的形式出现，例如数字、大写或小写的字母、特殊字符和多媒体。大学和学院的研究型应用经常使用大规模的数值数据，而商人和企业部门的人员则同时使用数值和字符数据。然而，在动画中使用的是多媒体，包括文本、视频和音频。\n\
  \n计算机是一种可编程的电子设备，它通过输入设备接受指令和数据，根据指令处理数据，并向输出设备提供结果。结果可以存储在内存中或发送到输出设备。图 1.1 显示了传统计算机的传统框图。\n\
  \n![image](img/page3_1.png)\n\n图 1.1 传统计算机的框图\n\n图 1.2 显示了一个包含显示器、键盘以及带有带有主板上 CPU\
  \ 的矩形盒的计算机系统。\n\n![image](img/page4_1.png)\n\n图 1.2 计算机系统\n\n简而言，计算机的各个部分描述如下。\n\
  \n**输入设备：** 输入设备用于向计算机接受数据和指令。通过输入设备（即`i.e. keyboard`），指令和数据被存储在计算机的内存中。计算机进一步从内存中读取存储的指令，从而根据指令操纵数据。计算机中可以使用的各种输入设备有键盘、鼠标、模拟数字转换器、光笔、轨迹球、光学字符识别器和扫描仪。图\
  \ 1.3 显示了计算机的输入设备。软盘、光盘等可以作为输入或输出设备。\n\n![image](img/page4_2.png)\n\n图 1.3 计算机的输入设备\n\
  \n**中央处理单元：** `CPU` 是中央处理单元（central processor unit）的缩写。它是计算机系统的脏。它是计算机中的硬件设备，通常被称为微处理器芯片。由于它是一个微小的芯片，因此被称为微处理器芯片。这种芯片由硅蒸气制成，其上通过现代制造技术安装了数百万晶体管。\n\
  \n计算机的大脑是`CPU`。这个芯片负责解释和执行指令。它由算术逻辑单元、寄存器和控制单元组成。算术逻辑单元根据指令对数据执行各种算术和逻辑运算。控制单元为执行处理器内部的操作产生定时和控制信号。寄存器用于持有指令并临时存储结果。指令存储在内存中，由处理器逐个提取并执行。\n\
  \n**输出设备：** 输出设备用于在屏幕上显示结果或将数据发送到输出设备。计算机最终将处理后的数据发送到输出设备。输出设备可以是显示器、打印机、LED、七段显示器、D\
  \ 到 A 转换器、绘图仪等。图 1.4 显示了计算机的不同的输出设备。\n\n![image](img/page4_3.png)\n\n图 1.4 计算机的输出设备\n\
  \n**内存：** 内存用于存储程序。有两种半导体内存。它们如下：\n\n* `RAM`（随机存取存储器）\n* `ROM`（只读存储器）\n\n半导体内存用于以\
  \ 1 和 0 的形式存储指令和数据。内存可以被称为用户内存或读写内存。处理器首先从主存（半导体内存）中读取指令和数据。然后，它执行这些指令。\n\n计算机使用的另一种内存设备称为只读存储器（`ROM`）。它包含一个固定的软件程序，用于提供某些操作。这是非易失性内存。当电源关闭时，它的内容不会消失。基本输入输出系统（`BIOS`）是一种用于控制各种外围设备的软件，如键盘、显示器、打印机、鼠标以及包括串口和并行端口在内的端口。事实上，这是一种操作系统。可以访问用户编写的程序，即通过加载文件、保存它并在稍后对其进行修改。一旦个人计算机开启，软件就会从`ROM`中引导。因此，各种功能被分配给中央处理单元（`CPU`）的所有辅助外围设备，`BIOS`在启动时为用户提供方便的交互。\n\
  \n为了存储海量数据，可以使用辅助存储设备。它们是光盘、磁带、磁带等。\n\n#### 1.3 最新的计算机\n\n关于市场上各种类型计算机的讨论超出了本书的范围。市面上最新的计算机有各种形状和尺寸。这些计算机就像笔记本电脑，甚至需要的空间更小。由于这些原因，许多计算机用户现在旅行时携带笔记本电脑。预计未来几年内，每个学生都会使用笔记本电脑或掌上电脑，这些设备将在市场上像热手山包一样畅销。国外和印度的大学、学院和工业领域正在进行关于缩小计算机尺寸、低成本构建更多功能以及使其在没有交流电源的情况下长时间运行的电池的研究工作。几年后，笔记本电脑和掌上电脑将充斥市场。这些笔记本形状的电脑和台式机一样强大。换句话说，笔记本电脑的计算能力将进步到台式机和微型计算机。它们用于文本处理、网页浏览、多媒体操作和图像处理等。这些计算机的性能不断提高，成本正在大幅下降。通过蓝牙技术，笔记本电脑可以轻松形成无线网络。无线网络现在非常流行，我们经常使用这些计算机。\n\
  \n笔记本计算机的典型规格如下：\n\n* `Processor`: `Intel Core i7` ( 8M cache,2.80GHz) 或 `AMD`\n\
  * `RAM`: 最小 2 GB 到最大 16 GB\n* `Hard disk`: 最小 320 GB 到 1 TB 或更高\n* `CD/DVD Drive`:\
  \ 双层 `DVD+/-RW Drive`、`SuperDrive`、`Bluetooth` 和摄像头\n* `Screen Size`: 15.6 英寸到 23\
  \ 英寸 LCD/LED 平屏\n* `Ethernet`: 10/100/1000 Mbps 以太网\n\n\n\n\n\n*   端口：`USB 3.0`\n\
  *   显卡：520 MB 或更高\n*   带有可充电电池备用\n*   操作系统，如 `windows XP`/`windows 7`/`Linux`\n\n\
  为了更简单的应用，可以选择基于赛龙的笔记本电脑，其处理器产生的热量较小。奔腾处理器仅用于专用应用程序。这类笔记本电脑产生的热量较大，电池需要频繁充电（图 1.5）。\n\
  \n![image](img/page5_1.png)\n\n**图 1.5** 笔记本电脑\n\n#### 1.4 C 语言简介\n\nC 是最流行的通用编程语言之一。C\
  \ 语言是由丹尼斯·里奇（Dennis Ritchie）于 1972 年在美国贝尔实验室设计和开发的。C 语言的几个重要概念源自“组合编程语言”和“B”语言。图\
  \ 1.6 展示了 C 语言从这两种语言演变而来的过程。Martin Richards 在 1967 年开发了 BCPL。BCPL 对 C 的影响通过 B 语言间接观察到，B\
  \ 语言是由 Ken Thompson 在 1970 年开发的。C 也称为 BCPL 的后代。表 1.1 阐述了编程语言及其发明者的演变。\n\n![image](img/page6_1.png)\n\
  \n**图 1.6** C 的演变\n\n**表 1.1** 语言及其发明者\n\n![image](img/page6_2.png)\n\nC 语言不依赖于任何特定的操作系统。它可以用于开发新的操作系统。参考图\
  \ 1.7，图中显示 C 语言与各种操作系统相关。C 语言与 UNIX 操作系统密切相关。UNIX 操作系统的源代码是用 C 编写的。C 运行在包括 `MS-DOS`\
  \ 在内的许多操作系统下。C 程序高效、快速且高度可移植，也就是说在一台电脑上编写的 C 程序只需或几乎无需修改即可在另一台电脑上运行。\n\n![image](img/page6_3.png)\n\
  \n**图 1.7** C 与操作系统\n\nC 编程语言包含了称为函数的模块。C 函数是基础构建模块，大多数程序员都从中获益。程序员从 C 标准库中将这些函数包含在他们的程序中。\n\
  \nC 语言是一种中间级计算机语言。这并不意味着 C 不像 Fortran 和 Pascal 编写程序那样强大和健壮。它也不意味着它像汇编语言那样麻烦。它结合了高级语言的特征和汇编语言的功能。在\
  \ C 语言中，人们可以快速开发程序并快速执行。它缩小了高低语言之间的差距；这就是它被称为中间级语言的原因。它非常适合编写应用程序和系统软件。\n\nC 是一种结构化语言。它与\
  \ Pascal 和 Fortran 等其他结构化语言有很多相似之处。结构化语言有助于在小模块或块中开发各种程序。长程序可以分成更短的程序。用户需要从功能块的角度考虑问题。通过对不同模块进行组合，程序员可以制作一个完整的程序。\n\
  \n使用结构化编程便于编写、测试、调试和维护。如果需要对程序进行某些更改，程序员可以使用编辑器参考先编写的模块并纳入相应的更改。因此，结构化语言更容易使用，大多数开发者倾向于使用这些语言，而不是像\
  \ `BASIC` 和 `COBOL` 这样的非结构化语言。与结构化语言相比，使用非结构化语言编程非常困难。\n\nC 也被称为系统编程语言，因为它对于编写操作系统、解释器、编辑器、编译器、数据库程序和网络驱动程序非常有帮助。\n\
  \nBCPL 和 B 是没有类型的语言。然而，C 语言具有多种数据类型。C 中的标准数据类型是整数、浮点型、字符。还可以创建派生数据类型，如指针、数组、结构体和联合体。表达式由操作数和运算符构建。任何表达式、赋值或函数调用都可以是一个语句。指针提供了与机器无关的地址运算。\n\
  \nC 还提供了控制流语句，如决策语句（`if-else`）和（switch-case`）多分支语句。C 支持 `for`、`while` 和 `do-while`\
  \ 循环语句。\n\nC 没有任何对复合对象执行操作的运算符。不存在可以处理整个数组或字符串的函数或运算符。例如，仅通过单个赋值语句将一个数组的元素赋值给另一个数组是不够的，必须进行元素间的赋值。然而，结构体对象可以作为一个单元进行拷贝。\n\
  \nC 不是强类型语言。但类型语句会受到 C 编译器的彻底检查。当违反语法规则时，编译器将发出错误和警告信息。不兼容的数据类型之间没有自动转换。程序员必须执行显式类型转换。\n\
  \n**UNIX：** UNIX 是一种交互式操作系统。它在微型计算机、小型计算机和主机非常有用。该操作系统具有良好的可移植性，并支持多用户处理、多任务和网络。多个用户可以同时使用\
  \ UNIX 执行相同的任务。该操作系统的开发是为了将各种机器连接在一起。UNIX 主要用于工作站和小型计算机。\n\n#### 1.5 关于 ANSI C 标准\n\
  \n多年来，C 语言没有标准版本，遵循参考手册中提供的定义。由于这个原因，C 语言的可移植性特征无法从一台电脑转移到另一台电脑。为了解决这一差异，一个委员会于\
  \ 1983 年夏天成立，旨在创建一个为人知的美国国家标准（ANSI）标准的 C 版本。\n\n该委员会一劳永逸地定义了标准 C 语言。定义 C 语言花费了大约六的时间。ANSI\
  \ C 标准在 1989 年被采用，其第一个 C 语言版本于 1990 年进入市场。\n\n因此，ANSI C 在国际上被认为是标准 C 语言。该标准的目的是增强\
  \ C 语言程序在不同计算机上的可移植性和执行效率。今天，所有的 C 编译器都支持 ANSI 标准。也就是说，市场上几乎所有的 C 编译器都设计为遵循 ANSI\
  \ C 标准。ANSI C 以及其他 C 编译器（如 `turbo-C` 版本 2）支持本书中开发的程序。\n\n#### 1.6 机器语言、汇编语言和高级语言\n\
  \n它是计算机的自然语言，可以被系统直接理解。这种语言依赖于机器，也就是说它是不可移植的。用 1 和 0 编写的程序称为机器语言。机器语言中使用二进制代码执行特定操作。每台计算机都与一组二进制模式指令相关。用\
  \ 1 和 0 与计算机进行通信很困难。因此，用机器语言编写程序非常困难。此外，机器语言的编写、测试和调试速度非常慢。这种语言中难免会粗心错误。机器语言由该硬件平台的设计定义。机器语言是枯燥且耗时的。\n\
  \n##### 1.6.1 汇编语言\n\n\n\n\n\n程序员不再使用机器语言中的二进制位串，而是开始使用类似于英语的单词作为命令，以便程序员易于解释。换句话说，计算机制造商开始提供类似于英语的单词，缩写为助记符，助记符与机器语言中的二进制指令相似。程序由字母数字组成，而不是`1`和`0`。设计者选择便于记忆的符号，以便程序员能够轻松地用汇编语言开发程序。这些字母数字被称为`汇编语言中的助记符`。`ADD`、`SUB`、`MUL`、`DIV`、`RLC`和`RAL`是一些被称为助记符的符号。\n\
  \n用机器语言以外的程序需要转换为机器语言。从一种语言转换为另一种语言需要翻译器。`Assemblers`用于将汇编语言程序转换为机器语言。每个处理器都有自己的汇编语言。例如，`8085\
  \ CPU`有自己的汇编语言。`8086`、`80186`、`80286`等 CPU 都有它们自己的汇编语言。\n\n汇编语言存在以下缺点：\n\n1. 使用汇编器编写并测试程序非常耗时。\n\
  2. 汇编语言程序不具移植性。\n3. 程序员必须记住`CPU`的寄存器和助记符指令。\n4. 用汇编语言编写所需的助记符指令比高级语言的单行多。因此，汇编语言程序比高级语言程序长。\n\
  \n##### 1.6.2 高级语言\n\n面向过程的语言是高级语言。这些语言用于快速方便地开发程序。汇编语言的缺点被高级语言所克服。程序员开发程序时不需要记住`CPU`的体系和寄存器。`compilers`用于将高级语言程序翻译成机器语言。高级语言（HLL）的示例有`COBOL`、`FORTRAN`、`BASIC`、`C`和`C++。高级语言具有以下优点：\n\
  \n1. 程序开发速度快。\n2. 测试和调试程序比汇编语言更容易。\n3. 程序在不同机器之间的移植性。\n\n#### 1.7 汇编器、编译器和解释器\n\n\
  程序是执行特定任务的指令集。这些指令就像英语单词。计算机将这些指令解释为`1`和`0`。程序可以用汇编语言编写，也可以用高级语言编写。编写好的程序被称为`source\
  \ program`。`source program`需要转换为机器语言，即`object program`。这种翻译需要一个翻译器。\n\n程序翻译器将编程语言源代码翻译成机器语言指令代码。通常，计算机程序是用`COBOL`、`C`、`BASIC`和`ASSEMBLY\
  \ LANGUAGE`等语言编写的，在执行之前应转换为机器语言。编程语言翻译器分类如下。翻译器列表见图 1.8。\n\n![image](img/page9_1.png)\n\
  \n**图 1.8 *翻译器***\n\n翻译器如下：\n\n1. 汇编器 (Assembler)\n2. 编译器 (Compiler)\n3. 解释器 (Interpreter)\n\
  \n**汇编器：** `assembler`将汇编语言程序的符号代码转换为机器语言指令（图 1.9）。符号语言翻译成机器码的比例是一个助记符指令对应一个机器码指令。这种类型的语言被称为低级语言。`assembler\
  \ programs`将低级语言翻译成机器码。翻译工作可以手动完成，也可以通过名为`assembler`的程序完成。在手工汇编中，程序员使用制造商提供的一组指令。在这种情况下，需要从代码表中查找助记符指令的十六进制代码。这个过程枯燥又耗时。此问题的替代方案是使用`assemblers`。名为`assembler`的程序提供`mnemonics`的代码。这个过程很快，并便于用户快速开发程序。\n\
  \n![image](img/page9_2.png)\n\n**图 1.9 *汇编器***\n\n**编译器：** `Compilers`是翻译器，它们将程序的所有指令翻译成机器码，这些码可以反复使用（见图\
  \ 1.10）。需要翻译的程序被称为`source program`，翻译后生成`object code`。`source program`输入到`compiler`中。`object\
  \ code`输出到辅助存储设备。整个程序首先由`compiler`读取并生成目标码。然而，在解释器中，每行都会被执行并提供目标码。`M-BASIC`是一个解释器的示例。`C`、`C++`和`Java`等高级语言使用了编译器。`compiler`会显示违反语言语法规则的语句的错误列表和警告列表。`Compilers`还具有链接程序子程序的能力。\n\
  \n![image](img/page9_3.png)\n\n**图 1.10 *编译器/解释器***\n\n**解释器：** `Interpreters`也属于翻译器组。它帮助用户执行`source\
  \ program`，与编译器相比有几点不同。在解释器和编译器中，`source program`都像英语语句一样。`interpreter`为`source\
  \ program`生成目标码。解释器逐行读取程序，而编译器是读取整个程序后生成目标码。`interpreter`直接从源代码执行程序。由于这一点，每次都需要将源代码输入解释器。换句话说，每行都被转换为目标码。执行很快，因为不需要生成目标码。\n\
  \n**链接：** C 语言提供了一个巨大的库，包含了许多函数。在某些应用程序中，库可能是一个很大的文件。`Linker`是一个组合源代码和库代码的程序。`Linking`是将程序与库代码结合的过程。库函数是可重定位的。各种机器码地址是绝对定义的，只保留偏移量。当源程序与标准库链接时，使用内存地址的偏移量创建实际地址。\n\
  \n#### 1.8 C 程序的结构\n\n每个 C 程序都包含许多称为函数的构建块。每个函数独立地执行特定任务。C 程序由图 1.11 所示的部分组成。\n\n\
  ![image](img/page10_1.png)\n\n**图 1.11 *C 程序的结构***\n\n1. **包含头文件部分：** C 程序依赖某些用于函数定义的头文件。每个头文件的扩展名为`.h`。头文件包含在\
  \ C 语言程序的开头。这些文件应该使用如下所示的`include`指令进行包含。\n\n   ***示例：***\n\n   `# include <stdio.h>`\
  \ 或\n\n   `# include \"stdio.h\"`\n\n   在这个示例中，包含了`<stdio.h>`文件，即该文件中所有函数的定义和原型在当前程序均可用。该文件也会与原始程序一起编译。程序员在执行书中给出的求解或未求解编程示例时，可以包含相应的头文件。\n\
  \n2. **全局声明：** 该部分声明了在多个函数中使用的变量。这些变量被称为全局变量。该部分必须在所有函数之外声明。\n\n\n\n\n\n##### 3.\
  \ Function main()\n每一个用 `C` 编写的程序必须包含 `main()`，且其执行从该函数的开始开始。在 ASCII C 标准中，C 程序执行开始的第一行写法如下：\n\
  \n```c\nint main(void)\n```\n\n这是 `main()` 的函数定义。`main` 后面的括号是为了再次告知用户 `main()`\
  \ 是一个函数。`int main(void)` 是一个不接受参数并返回 `int` 类型值的函数。在这一行中，`int` 和 `void` 是关键字，它们具有由编译器分配的特殊含义。如果在上述语句中没有提到\
  \ `int`，则默认情况下函数返回一个整数。\n\n另一种，人们也可以按如下方式编写 C 程序执行开始的第一行：\n\n```c\nvoid main(void)\n\
  ```\n\n在这里，该函数不接受参数且不返回任何值。此外，也可以按如下方式编写相同的函数：\n\n```c\nvoid main()\n```\n该函数不返回任何值且不接受参数。\n\
  \n在所有章节中，大多数编程示例中的 `main` 函数都被写为 `void main()`。本书遵循这一程序仅是为了避免在每个程序的末尾编写返回语句。这一步骤有助于减少源代码的行数。在本书的几处中，`main`\
  \ 函数被初始化为 `int main(void)`。在这种情况下，程序末尾（右括号之前）会使用返回语句。程序员既可以用 `int main(void)` 编写函数\
  \ `main`，也可以用 `void main()`。只有在正式情况下，才应该在函数结束前使用返回语句来终止 `main` 函数的执行。\n\n程序包含包含在大括号内的语句。`C`\
  \ 语言使用左大括号（`{`）和右大括号（`}`）。这两个括号之间程序应该声明部分和执行部分。左大括号指定了 `main` 函数定义的开始。右大括号指定了 `main`\
  \ 函数代码的结束。\n\n##### 4. 声明部分 (Declaration Part)\n声明部分声明可执行部分使用的所有局部变量。局部变量的作用域限于声明局部变量的函数。变量的初始化也可以在此部分完成。初始化意味着为变量提供初始值。\n\
  \n##### 5. 可执行部分 (Executable Part)\n该部分包含变量声明之后的语句。该部分包含一组语句或单个语句。\n\n##### 6. 函数调用\
  \ (Function Call)\n用户可以根据需要/应用，从 `main()`  {用户定义的函数。\n\n##### 7. 用户定义函数 (User-defined\
  \ Function)\n由用户定义的函数称为用户定义函数。这些函数定义在 `main()` 函数之外。\n\n##### 8. 函数体 (Body of the\
  \ Function)\n包含在函数体内（左、右大括号之间）的语句称为函数体。\n\n##### 9. 注释 (Comments)\n程序中并不是必须注释。然而，为了理解程序的流程，程序员可以在程序中插入注释。注释由程序员插入。它对于文档记录很有用。如果程序有良好的文档记录，就可以遵循程序的清晰度。\n\
  \n注释是提供我们关于程序信息的语句，应放置在分隔符 `/*` 和 `*/` 之间。程序员在程序中经常使用注释来增强明晰性。编译器不执行注释。因此，我们可以说注释不是可执行程序的一部分。\n\
  \n用户可以频繁使用任意数量的注释，并可以放在程序的任何地方。请注意，注释语句是可以嵌套的。用户应该选择编辑器的 `OPTION MENU` 并选择 `COMPILER-SOURCE\
  \ - NESTED COMMENTS ON/OFF`。注释可以以单个语句插入，也可以在嵌套语句中插入。\n\n**示例：**\n\n```c\n/* 这是单行注释\
  \ */\n\n/* 这是一个 /*嵌套注释 */ 的示例 */\n\n/* 这是一个\n多行\n注释示例 */ /* 它可以被嵌套 */\n```\n\n####\
  \ 1.9 编程规则 (PROGRAMMING RULES)\n程序员在编写程序时应遵循以下规则：\n\n1. 每个程序都应该有一个 `main()` 函数。\n\
  2. `C` 语句应以分号结束。在某些地方，允许使用逗号操作符。如果只放置分号，它被视为一个语句。例如：\n```c\nwhile(condition)\n;\n\
  ```\n上述语句将产生无限循环。如果没有分号，循环将不会执行。\n3. 如果程序员放置了不必要的分号，会被视为空语句。\n4. 所有语句都应该用小写字母编写。通常，大写字母仅用于符号常量。\n\
  5. 在单词之间可以插入空格。这有助于提高语句的可读性。然而，这在声明变量、关键字、常量和函数时并不适用。\n6. 无需固定语句在程序中的位置；即，程序员可以在声明部分之后的两个大括号之间的任何地方编写语句。用户也可以在一行中编写一个或多个语句，用分号（`;`）将它们分隔。因此，它通常被称为自由语言。以下语句是有效的：\n\
  ```c\na=b+c;\nd=b*c;\n```\n或\n```c\na=b+c; d=b*c;\n```\n7. 左大括号和右大括号应该是平衡的，即：如果有四个左大括号，右大括号也应该是四个。\n\
  \n#### 1.10 执行 C 程序 (EXECUTING THE C PROGRAM)\n一个 `C` 程序必须经过各个阶段，如用编辑器创建程序、执行预处理器程序、编译、链接和执行程序。在\
  \ MS-DOS 模式下执行程序时，以下步骤是必须的：\n\n1. **创建程序**：程序应在 C 编辑器中编写。文件名并不一定包含扩展名。默认扩展名是 `.C`。用户也可以指定自己的扩展名。`C`\
  \ 程序包含了预处理器指令。\n2. **执行预处理器程序**：用 C 编辑编写程序后，程序员必须使用命令 `Alt-C` 编译程序。预处理器程序在程序编译之前先执行。程序员可以在当前文件中包含其他文件。其他文件的包含最初在预处理器部分完成。\n\
  3. **编译与链接**：源程序包含要翻译成目标代码的语句。这些目标代码适用于计算机执行。如果程序包含错误，程序员应该修正。如果程序没有错误，编译继续，翻译后的程序存储在另一个同名扩展名为\
  \ `.obj` 的文件中。该目标文件存储在辅助存储设备（如磁盘）上。\n\n链接也是一个重要的过程。它将程序所需的所有其他程序文件和函数结合。例如，如果程序员使用\
  \ `pow()` 函数，那么该函数的目标代码应该从系统的 `math.h` 库中引入并链接到 `main()` 程序。\n4. **执行程序**：编译后，可执行的目标代码将加载到计算机主内存并执行程序。加载器执行此功能。上述\
  \ C 程序的所有步骤/阶段都可以通过编辑器的菜单选项完成。\n\n\n\n\n\n如图 1.12 所示，预处理器`directories/program`在主程序编译之前执行。编译器检查程序，如果发现任何语法错误，将显示出来。用户被强制回到编辑窗口。在删除错误后，编译器编译程序。在此阶段，会生成目标代码。在程序执行期间，如果用户在输入数据时出错，结果将不正确。因此，用户必须重新输入数据。当程序无错误时将生成输出。\n\
  \n![image](img/page13_1.png)\n\n**图 1.12 C 程序的流程图**\n\n使用编辑器编辑、编译和执行程序文件（图 1.13）：\n\
  \n![image](img/page14_1.png)\n\n**图 1.13 Turbo C 编辑窗口**\n\n程序员可以使用 Turbo C 编辑器/编译器。Turbo\
  \ C 编辑器是一个软件，程序员可以在其中用 C 源代码编写程序。当我们调用放置在桌面上的`shortcut to TC` 图标时，会出现 Turbo C 编辑器窗口。该窗口用于编辑、编译和运行程序。\n\
  \n它的菜单栏包含八个菜单：File、Edit、Run、Compile、Project、Options、Debug 和 Break/watch。\n\n**File：**\
  \ 此菜单用于创建新程序文件、加载现有 C 文件、以适当路径写入文件、调用`DOS`（操作系统壳）、更改目录以及退出程序。\n\n**Edit：** Edit\
  \ 菜单提供编辑选项。\n\n**Run：** Run 菜单提供如 Run、Program reset、Go to cursor、Trace into、Step\
  \ over 和 User screen 等选项。\n\n按下 `Alt+F` 键后，可以进入 `File` 菜单并选择 `New`（新建）创建新文件，或者如果文件已存在则使用\
  \ `Load`（加载）选项并通过提供适当路径加载文件。编辑器会自动提供 `.c` 的文件扩展名。程序员可以手动输入 `.c` 后缀，也可以由编辑器默认提供 `.c`\
  \ 后缀。程序员现在可以使用 C 语法编写程序了。\n\n最好在磁盘的主目录中单独建立一个文件夹/子目录来创建和保存程序。该文件夹/子目录就是工作目录。这是由于程序文件与编译和运行期间创建的多个文件相关联。创建的文件是你自己的文件（源代码文件和数据文件），此外，编译和运行程序后还会创建一些其他文件。\n\
  \n例如，如果 `C:\\Turboc2` 是主目录，可以使用`Command prompt`创建一个子目录。假设创建的子目录为 `Vishal`，则工作目录路径为\
  \ `C:\\Turboc2\\Vishal`。因此，在工作目录 `Vishal` 中创建并保存所有程序（图 1.14）。\n\n![image](img/page15_1.png)\n\
  \n**图 1.14 打开新文件**\n\n编辑程序文件后，应通过按下 `F2` 键或从 `File` 菜单选择 `Alt+F & Save` 保存，并从 `compile`\
  \ 菜单进行编译。现在程序员可以在编辑器中使用 `Alt+C` 键，如下所示（图 1.15）。\n\n![image](img/page15_2.png)\n\n\
  **图 1.15 程序的编译**\n\n编译后，需按下 `Alt+R` 键运行同一程序。屏幕显示所示。当然，这一步仅在编译后没有错误时才会执行。运行程序后，另一个屏幕上会显示答案。程序员可以在窗口中尝试下方引用的简单程序。运行程序文件后会创建一个可执行文件。可以观察生成的\
  \ `.exe` 文件（图 1.16）。\n\n![image](img/page15_3.png)\n\n**图 1.16 运行程序**\n\n预计用户将在\
  \ C 编辑器中编辑、编译并运行上述快照中的程序。\n\n#### 1.11 标准目录\n\nturbo-C 有三个标准目录：`include`、`sys` 和\
  \ `lib`。`Sys` 是 `include` 的子目录。`include` 目录包含所有的头文件，`lib` 包含所有的库文件。在执行程序之前应完成路径设置。在\
  \ turbo-c edit 中，选择 `Option` 菜单下的 `Directories` 选项。在这里设置 `include`、`library` 和 `turbo-c-directories`\
  \ 的路径。\n\n#### 1.12 第一个 C 程序\n\n![img](img/aero.png) 1.1 写一个程序显示消息“Hello! C Programmers”。\n\
  \n```c\nvoid main()\n{\nprintf(\"Hello! C Programmers\");\n}\n```\n\n**输出：**\nHello!\
  \ C Programme\n\n**解释：**\n此程序使用 `printf()`语句显示消息‘Hello! C Programmers’。按照以下步骤通过\
  \ Turbo-c 编辑器执行程序。\n\n按下 `F2` 输入程序后，可以保存程序。如果是第一次保存，系统会要求输入名称。输入文件名后会自动添加扩展名（`.c`）。\n\
  \n按下 `ALT+C` 可以进入编译选项。同样通过按下 `F9` 也可以编译程序。执行程序可以按下 `CTRL + F`。查看输出可以按下 `F5`。\n\n\
  ![img](img/aero.png) 1.2 写一个程序了解注释。\n\n```c\nvoid main()\n{\nclrscr();\nprintf(\"\
  This program explains comments\");\n}\n```\n\n**输出：**\nThis program explains comments\n\
  \n**解释：**\n此程序解释了注释。上述程序打印输出中所示的内容。`clrscr()` 函数清除屏幕，定义在 `<conio.h>` 中。某些编译器允许错误信息。\n\
  \n![img](img/aero.png) 1.3 写一个程序从 main() 返回值。\n\n```c\nmain()\n{\nreturn 0;\n}\n\
  ```\n\n**解释：**\n上述程序产生输出。`main()` 应返回 `0` 或 `1`。如果 `main()` 返回 `0`，即程序执行；否则相反。如果用户未放置返回语句，编译器将报错。\n\
  \n#### 1.13 C 语言的优点\n\n1. 它包含了强大的数据定义。支持的数据类型有字符、整数、长整数、浮点和双精度。它还支持字符数组形式的字符串。\n\
  2. C 支持强大的运算符集合。\n3. 它支持强大的图形编程并直接与硬件操作。程序运行速度快。\n4. C 程序中插入汇编代码。\n5. C 程序在任何类型的操作系统平台上都有良好的移植性。\n\
  6. 编译器、操作系统等系统程序可以用 C 开发。例如，流行的操作系统 UNIX 就是 C 开发的。\n7. C 语言有 32 个关键字、约 145 个库函数以及近\
  \ 30 个头文件。\n8. C 与机器紧密结合，在许多方面与汇编语言匹配。\n\n#### 1.14 头文件\n\n**stdio.h：** 标准输入输出。所有格式化和非格式化函数包含此文件中定义的文件操作。常用的格式化函数\
  \ `printf()` 和 `scanf()` 定义在此文件中。该文件必须包含在程序顶部。该头文件中最常用的函数有 `printf()`、`scanf()`、`getchar()`、`gets()`、`putc()`\
  \ 和 `putchar()`。\n\n**conio.h：** 控制台输入输出。此文件包含输入输出函数以及一些图形支持函数。`getch()`、`getche()`\
  \ 和 `clrscr()` 函数定义在此文件中。\n\n**math.h：** 此文件包含了所有的数学和其他实用函数。该文件中常用的函数有 `floor()`、`abs()`、`ceil()`、`pow()`、`sin()`、`cos()`\
  \ 和 `tan()`。\n\n\n\n\n\n# 表 1.2 常用头文件\n\n![image](img/page18_1.png)\n\n表示寻找给定问题解决方案逻辑步骤的方法有多种。如下：\n\
  \n1. 算法 (Algorithm)\n2. 流程图 (Flowchart)\n3. 伪代码 (Pseudo-code)\n\n在算法中，提供了解决给定问题的步骤描述。在这里，重点在于文本。流程图以图形形式表示给定问题的解决方案。逻辑步骤的图化表示就是流程图。表示给定问题解决方案的另一种方法是伪代码。\n\
  \n#### 1.15 算法 (ALGORITHM)\n\n算法用于获取给定问题问题的流行技术。算法被定义为“一组有限的步骤，为解决特定性质的问题提供一系列动作链”。算法中的每一步都应该是定义良好的。这一步将使读者能够将每一步翻译成程序。本节说明了解决问题的渐进程序。\n\
  \n算法是一个组织良好、预先安排且定义的文本计算模块，它接收某些值或一组值作为输入，并提供单个值或一组值作为输出。这些定义良好的计算步骤按顺序排列，将给定的输入处理成输出。使用简单语言对算法进行精确描述是理解算法最关键的。只有当算法提供了确所需的输出时，算法才说是准确且真实的。冗长的过程被划分为小部分，从而使得解决给定问题变得容易。每一步被称为一条指令。\n\
  \n在日常生活中，我们遇到许多解决问题的算法。我们执行多项例行任务，例如骑自行车、拿起手机、拨打电话、打开电视等。\n\n例如，为了在两个订阅者之间建立电话通信，需要遵循以下步骤：\n\
  \n1. 拨打电话号码\n2. 被叫方处电话响起\n3. 拨号者等待响应\n4. 被叫方接听电话\n5. 他们之间开始对话\n6. 对话结束后，双方都断开通话\n\
  \n另一个现实生活中的例子是通过带有拨号上网功能的互联网服务提供商 (ISP) 访问互联网。要登录互联网，需要遵循以下步骤：\n\n1. 选择用于访问互联网的互联网服务提供商。\n\
  2. 从服务提供商处获取拨号上网号码。\n3. 获取服务提供商的 IP 地址。\n4. 获取登录 ID 和密码。\n5. 运行互联网浏览器软件。\n\n在编写算法时，知道如何分析算法至关重要。分析算法是指计算或猜测算法所需的资源。资源意味着计算机内存、处理时间和逻辑门。在以上所有因素中，时间是最重要的因素，因为开发的开发的程序在处理时应该更快。分析也可以通过阅读算法以检查逻辑准确性、跟踪算法、实现它，并结合某些数据和数学技术进行检查以确认其准确性。\n\
  \n算法也可以用简单的方法表示。这将有助于用户于地操作。然而，这种方法有几个缺点。它需要更多的空间和时间。考虑算法的时间和空间等因素是非常关重要的。在系统资源最少（如\
  \ CPU 时间和内存）的情况下，必须开发出高效的算法。\n\n实践中，通过对算法进行简单分析来得出其执行时间是不可能的。执行时间取决于机器和实现方式。时序分析取决于所需的输入。为了准确执行时间分析，确切知道硬件执行的指令以及每个语句所经过的执行时间也是至关重要的。\n\
  \n![img](img/aero.png) 1.4 写一个程序使用第三个变量交换两个数字。\n\n**交换两个数字的算法：**\n\n**步骤 1:** 开始。\n\
  **步骤 2:** 声明变量 `a`、`b` 和 `c`。\n**步骤 3:** 读取 `a` 和 `b` 的值。\n**步骤 4:** 将 `a` 的值复制到\
  \ `c`；将 `b` 复制到 `a`；将 `c` 复制到 `b`。\n**步骤 5:** 打印 `a` 和 `b` 交换后的值。\n**步骤 6:** 退出。\n\
  \n**程序：**\n\n```c\nvoid main()\n{\nint a,b,c;\nclrscr();\nprintf(\"\\nEnter two\
  \ numbers for A & B:\");\nscanf(\"%d %d\",&a,&b);\nc=a;\na=b;\nb=c; printf(\"\\\
  nAfter swaping the values are:A=%d & B=%d.\",a,b);\ngetch();\n}\n```\n\n![image](img/page19_1.png)\n\
  \n**提示：** 将 `a` 的值复制到第三个变量 `c`，`b` 的值复制到 `a`，以及 `c` 的值复制到 `b`。\n\n**解释：**\n\n在上述程序中，首先声明了两个变量\
  \ `a`、`b` 和 `c`。程序从用户处调用 `a` 和 `b` 的两个值。用户为变量 `a` 和 `b` 赋值。\n\n现在将 `a` 的值复制到第三个变量\
  \ `c`，`b` 的值复制到 `a`，`c` 的值复制到 `b`。\n\n在这里，当我们把 `a` 的值赋给 `c` (`c=a`) 时，`a` 的值被复制到变量\
  \ `c`。当我们赋值 (`a = b`) 时，`b` 的值被复制到变量 `a` 并替换掉原来的值。现在，在语句 (`b = c`) 中，`b` 保存了变量 `c`\
  \ 的值。\n\n`printf()` 语句打印值。\n\n![img](img/aero.png) 1.5 写一个程序不使用第三个变量交换两个数字。\n\n\
  **算法：**\n\n**步骤 1:** 开始。\n**步骤 2:** 声明变量 `a`、`b`。\n**步骤 3:** `a` 和 `b` 相加赋给 `a`。\n\
  **步骤 4:** `a` 的值减去 `b` 的值赋给 `b`。\n**步骤 5:** `a` 的值减去新的 `b`赋给 `a`。\n**步骤 6:** 打印\
  \ `a` 和 `b` 的值。\n**步骤 7:** 结束。\n\n**程序：**\n\n```c\nvoid main()\n{\nint a=4,b=6;\n\
  clrscr();\na=a+b;\nb=a-b;\na=a-b;\nprintf(\"\\nthe value of a=%d & b=%d\",a,b);\n\
  getch();\n}\n```\n\n**输出：**\n\n![image](img/page20_1.png)\n\n**解释：**\n\n在上述程序中，首先声明并初始化了两个变量\
  \ `a` 和 `b`。\n\n在语句 `a=a+b` 中将 `a` 和 `b` 相加。在下一个语句中，从 `a` 中减去 `b`。最后，通过从 `a` 中减去\
  \ `b` 得到 `a` 的值。\n\n`printf()` 语句打印 `a` 和 `b` 的值。\n\n#### 1.16 算法分类 (CLASSIFICATION\
  \ OF ALGORITHMS)\n\n算法的分类基于重复步骤以及语句之间的控制传递。图 1.17 显示了算法的分类。\n\n![image](img/page21_1.png)\n\
  \n**图 1.17 算法分类**\n\n根据重复步骤，算法可以进一步分为两种类型。\n\n1. **直接算法：** 在这种类型的算法中，迭代次数是预知的。例如，对于显示\
  \ 1 到 10 的数字，循环变量应该从 1 初始化到 10。语句如下：\n\n```c\nfor (j=1;j<=10;j++)\n```\n\n\n\n\n\
  \n在上述陈述中，预测循环将迭代 10 次。\n\n##### 2. **间接算法**：在此类算法中，会执行重复性步骤。具体需要重复多少次是未知的。\n\n例如，重复步骤如下：\n\
  \n*   从 1 到 `n` 寻找前五个阿姆斯特斯特数，其中 `n` 是第五个阿姆斯特斯特数。\n*   寻找前三个回文数。\n\n根据控制转移的情况，算法分为以下三种类型。\n\
  \n###### 1. **确定性**：确定性算法基于根据条件遵循“是”路径或“否”路径。在这一类算法中，当控制流遇到决策逻辑时，会显示“是”和“否”两条路径。程序控制根据条件遵循其中一条路线。\n\
  \n***示例：***\n\n测试一个数字是否为偶数或奇数。测试一个数字是否为正数或负数。\n\n###### 2. **非确定性**：在此类算法中，为了得到解决方案，我们有多条路径中的一条。\n\
  \n***示例：***\n\n寻找一周中的某一天。\n\n###### 3. **随机算法**：在执行几个步骤后，程序的控制会随机转移到另一个步骤，这被称为随机算法。\n\
  \n***示例：***\n\n随机搜索\n\n另一种类型的算法是无限算法。\n\n###### **无限算法**：这种算法基于对结果的更好估算。所需的步骤数无法预先知晓。过程将持续直到出现最佳结果。为了最终的收敛，还需要更多的迭代。\n\
  \n***示例：***\n\n寻找网络中从给定源到所有目的地的最短路径。\n\n#### 1.17 流程图\n\n流程图是解决问题步骤序列的可视化表示。它阐明了先第一、第二、第三等执行顺序。一个完整的流程图能够让你将问题组织成一个行动计划。即使在设计产品时，设计师通常也需要多次绘制流程图。它是最终产品的运行地图。这是解决复杂设计问题的一种简便方法。读者可以从流程图中快速遵循流程，而不是通过阅读文本。\n\
  \n流程图是解决问题的替代技术。我们不再使用描述性步骤，而是使用图示表示来描述每一个步骤。它展示了操作序列。流程图是一组符号，指示程序中的各种操作。对于每一个过程，流程图中都有对应的符号。一旦写好了算法，就可以使用流程图符号完成其图示表示。换句话说，文本算法的图示表示是通过流程图完成的。\n\
  \n我们在下方给出了流程图中常用的符号。\n\n**开始和结束**：开始和结束符号表示流程图的开始和结束。该符号看起来像一个扁平的椭圆或蛋形。图 1.18 显示开始/停止符号。只有一条流线与这种符号结合。我们在此类符号中写入\
  \ `START`、`STOP` 或 `END`。通常这个符号在流程未使用两次，即在开头和结尾。\n\n![image](img/page22_1.png)\n\
  \n**图 1.18 *开始/停止***\n\n**决策或测试**：决策符号是菱形。该符号用于测试备选方案之一。一旦写好了算法，就可以使用流程图符号完成其图示表示。换句话说，文本算法的图示表示是通过流程图完成的。\n\
  \n**单分支**：决策符号是菱形。该符号用于测试备选方案之一。一旦写好了算法，就可以使用流程图符号完成其图示表示。换句话说，文本算法的图示表示是通过流程图完成的。\n\
  \n**双分支**：决策符号是菱形。该符号用于测试备选方案之一。一旦写好了算法，就可以使用流程图符号完成其图示表示。换句话说，文本算法的图示表示是通过流程图完成的。\n\
  \n**多分支**：决策符号是菱形。该符号用于测试备选方案之一。一旦写好了算法，就可以使用流程图符号完成其图示表示。换句话说，文本算法的图示表示是通过流程图完成的。\n\
  \n**连接符**：连接符必须以圆形的形式显示。它用于建立两个部分之间的连接。图 1.22 显示连接符。\n\n**处理符号**：处理框符号应用矩形表示。它通常用于数据处理。图\
  \ 1.23 显示处理符号。\n\n**循环符号**：该符号看起来像一个六边形。该符号用于实现 for 循环。图 1.24 阐释了 for 循环的工作原理。\n\
  \n\n\n\n\n**延迟符号：** 延迟符号就像“与”门。它用于为过程添加延迟。它与两条线相关。一条是输入，另一条是输出，如图图 1.26 所示。\n\n\
  ![image](img/page26_1.png)\n\n**图 1.27 手动输入符号**\n\n**手动输入符号：** 用于通过键盘分配变量值，而在数据符号中，值直接赋值而无需人工干预。图\
  \ 1.27 表示了手动输入符号。\n\n此外，以下符号（图 1.28）可以使用流程图中，它们是流程图的一部分。\n\n![image](img/page26_2.png)\n\
  \n**图 1.28 流程图中使用的其他一些符号**\n\n#### 1.18 伪代码\n\n在伪代码中，使用类似英语的单词来表示各种逻辑步骤。这是一种前缀表示法。在这里，逻辑上描述了每一步的解决方案。伪代码只是关于问题的原始想法。通过使用这个技巧，人们可以尝试解决问题。伪代码的意思是“假代码”。任何编程语言的语法规则都不能适用于伪代码。\n\
  \n**示例(a)：** 假设 `a` 和 `b` 是两个数字，并找到其中较大的一个。在这种情况下，对它们进行比较。\n\n这可以表示如下。\n\n| 算法 |\
  \ 伪代码 |\n| :--- | :--- |\n| 输入 a 和 b | get numbers a & b |\n| a>b 吗？ | Compare a\
  \ & b |\n| 如果是，a 比 b 大 | if a is large max=a |\n| 如果否，b 比 a 大 | if b is large max=b\
  \ |\n| 打印较大的数 | Larger number is max |\n\n少数熟练的程序员倾向于通过编写伪代码来绘制流程图。这是因为使用伪代码类似于在编程语言中编写最终代码。很少有程序员倾向于在算法中写步骤。很少有程序员青于使用流程图来表示逻辑流，因为通过可视化，编写程序语句时会变得清晰。对于初学者来说，流程图是编写程序的直接工具。\n\
  \n**示例 (b)：** 示例 (b) 说明了如何使用伪代码绘制计算数字平方的流程图。\n\n1. 接受数字\n2. 计算数字的平方\n3. 显示数字\n\n\
  程序的所有步骤都按步骤写下来。某些程序遵循伪代码来绘制流程图。使用伪代码，可以编写最终程序。大多数程序具有共同的任务，如输入、处理和输出。这些是任何程序的的基础任务。使用伪代码，可以按照以下步骤绘制流程图。\n\
  \n对于“接受数字”这一语句，流程图符号如图图 1.29 所示。\n\n![image](img/page27_1.png)\n\n**图 1.29 输入符号**\n\
  \n包括算术运算的语句是处理语句的示例。第二个语句“计算数字的平方”的表示可以如图 1.30 所示。\n\n![image](img/page27_2.png)\n\
  \n**图 1.30 处理符号**\n\n输出语句，即“显示数字”，可以按照图 1.31 所示表示。\n\n![image](img/page27_3.png)\n\
  \n**图 1.31 输出符号**\n\n此外，流程图还有两个符号用于指示程序的开始和结束，如图图 1.32 所示。标准的终止符号是跑道形（racetrack）。\n\
  \n![image](img/page28_1.png)\n\n**图 1.32 程序的伪代码和流程图**\n\n### 总结\n\n本章介绍了 C 语言的演变和基础。C`\
  \ 是一种结构化语言。它与 Pascal 和 Fortran 等其他结构化语言有很多相似之处。`C` 也称为系统编程语言。ANSI C 标准于 1989 年 12\
  \ 月通过，第一份 `C` 语言副本于 1990 年引入市场。\n\n读者接触到了汇编器，它将汇编语言程序的符号代码翻译成机器语言指令。同样，编译器是翻译器，它们将程序的所有指令翻译成机器码，并可以反复使用。解释器属于翻译器组。它帮助用户执行源程序，与编译器相比只有细微差别。\n\
  \n在本章中，提供了算法概述。算法被定义为“一组有限的步骤，这些步骤为解决特定性质的问题提供一系列动作”。算法分为两种：直接算法和间接算法。\n\n### 练习题\n\
