  \ switch 语句。在 switch 语句中，值与所有 case 常量进行匹配。匹配的 case 语句被执行，打印用户选择对应的行。如果用户输入了未列出的值，则不会发生匹配并执行\
  \ default。default 使用消息“Invalid Choice”警告用户。\n\n\n\n\n\n![image](img/aero.png) #\
