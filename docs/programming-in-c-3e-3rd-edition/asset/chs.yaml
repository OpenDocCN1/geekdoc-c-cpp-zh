  \n此处使用的逻辑与按字母顺序排序城市名称程序的逻辑相同。\n\n\n\n\n本章侧重于字符串。在本章中，你学习了如何声明和初始化字符串。识别字符串的末尾也非常重要。字符串后面跟着一个\
