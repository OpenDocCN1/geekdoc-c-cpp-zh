  \n### 7.12 sscanf() 和 sprintf() 函数\n\n#### 1. `sscanf()`\n`sscanf()` 函数允许从字符数组中读取字符并将其写入另一个数组。该函数与\
  \ `scanf()` 相似，但它不是从标准输入而是从数组中读取数据。\n\n![image](img/aero.png) 7.49 编写一个程序从字符数组中读取字符串。\n\
  \n```c\nvoid main()\n{\nchar in[10],out[10];\nclrscr();\ngets(in);\nsscanf(in,“%s”,out);\n\
  printf(\"%s\\n”,out);\n}\n```\n**OUTPUT:**\n```\nHELLO\nHELLO\n```\n\n### 解析\n在上面的程序中，声明了两个字符数组\
  \ `in[10]` 和 `out[10]`。`gets()` 函数通过终端读取字符串并将其存储在数组 `in[]` 中。此时，`out[]` 数组是空的。`sscanf()`\
  \ 函数从数组 `in[]` 读取字符并将其分配给数组 `out[]`。因此，两个数组包含相同的字符串。最后，`printf()` 函数显示数组 `out[]`\
  \ 的内容。\n\n![image](img/aero.png) 7.50 编写一个程序在字符数组中读取整数，使用 `sscanf()` 函数转换并赋值给整数变量。\n\
  \n```c\nvoid main()\n{\nint *x;\nchar in[10];\nclrscr();\nprintf(\"\\n Enter Integers\
  \ :”);\ngets(in);\nsscanf(in,“%d”,x);\nprintf(\"\\n Value of int x : %d”,*x);\n\
  getche();\n}\n```\n**OUTPUT:**\n```\nEnter Integers :\n123\nValue of int x :123\n\
  ```### 解析\n在上面的程序中，整数被读取并存储在字符数组 `in[]` 中。变量 `x` 被声明为整数指针。`sscanf()` 函数将数组 `in[]`\
  \ 的基地址分配给 `x`。使用指针符号显示指针 `x` 的内容。\n\n#### 2. `sprintf()`\n`sprintf()` 函数与 `printf()`\
  \ 相似，区别在于：`printf()` 函数将输出发送到屏幕，而 `sprintf()` 函数将任何数据类型的值写入字符数组。以下是关于 `sprintf()`\
  \ 的程序。\n\n![image](img/aero.png) 7.51 编写一个程序解释 `sprintf()` 的用法。\n\n```c\nvoid main()\n\
  {\nint a=10;\nchar c=C;\nfloat p=3.14;\nchar spf[20];\nclrscr();\nsprintf(spf,“%d\
  \ %c %.f”,a,c,p);\nprintf(\"\\n%s”,spf);\ngetche();\n}\n```\n**OUTPUT:**\n### 解析\n\
  在上面的程序中，`sprintf()` 将变量的值存储在字符数组 `spf[]` 中。使用 `printf()` 函数显示数组 `spf` 的内容。\n\n![image](img/aero.png)\
  \ 7.52 编写一个程序通过填充字符来完成字符串。\n\n```c\nvoid main()\n{\nchar name[]“Mas er C”;\nint\
  \ x=0;\nclrscr();\nprintf(“Mastering C\\n”);\nwhile(name[x]!=0)\n{\n  if(name[x]==32)\n\
  \  name[x]=getche();\n  else\n  putch(name[x]);\n  x++;\n}\ngetche();\n}\n```\n\
  **OUTPUT:**\n```\n### 解析\n在上面的程序中，用数组 `name[]` 初始化了字符串。字符串不完整且包含空格。`while()` 循环检查字符串的每个字符。如果发现空格，则执行\
  \ `if` 块，否则显示后续字符。\n\n### 7.13 数组的缺点\n1. 首先需要知道存储在数组中的元素数量。\n2. 当声明数组时，会为其分配内存。如果数组没有完全填充，空白也会占用内存。\n\
