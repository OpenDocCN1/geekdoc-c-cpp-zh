  # 第 10 章\n## 函数\n\n### 章节目录\n\n- 10.1 引言\n- 10.2 函数基础\n- 10.3 函数定义\n- 10.4 return\
  \ 语句\n- 10.5 函数类型\n- 10.6 值传递与引用传递\n- 10.7 函数返回多个值\n- 10.8 函数作为参数\n- 10.9 带有运算符的函数\n\
  - 10.10 函数与决策语句\n- 10.11 函数与循环语句\n- 10.12 数组和指针的函数\n- 10.13 将数组传递给函数\n- 10.14 嵌套函数\n\
  - 10.15 递归\n- 10.16 递归类型\n- 10.17 递归函数的规则\n- 10.18 直接递归\n- 10.19 间接递归\n- 10.20 递归与迭代\n\
  - 10.21 汉诺塔\n- 10.22 递归的优缺点\n- 10.23 递归的效率\n- 10.24 库函数\n\n##### 10.1 引言\n\n编写和维护一个大型程序是非常困难的。此外，数据流的识别也很难理解。编写程序应用程序的最佳方法是将大程序拆分成小的部分或模块，并在需要时从\
  \ `main()` 函数中反复调用这些模块。这些小型模块或子程序易于管理。这种方法被称为分治法。在 C 语言中，这些小型模块被称为函数。\n\n![image](img/page379_1.png)\n\
  \n**图 10.1 划分为多个函数的程序**\n\n用 C 语言编写的程序高度依赖于函数。C 程序无非是一个或多个函数的组合。每个 C 程序都从用户定义的函数\
  \ `main()` 开始。每当启动新程序时，必须定义 `main()` 函数。`main()` 函数调用其他函数来分担工作。主程序可以向函数提供数据。对数据执行特定的操作，并将一个值返回给调用函数。\n\
  \nC 语言支持两种函数：(1) 库函数和 (2) 用户定义函数。库函数是预定义的函数集合，其功能是的。用户不需要担心其内部工作。用户可以使用这些函数但不能修改它们。例如，`sqrt(81)`\
  \ 结果为 9。在这里，用户不需要关心源代码，但结果应由函数提供。\n\n用户定义函数完全不同。根据用户需求定义的函数被称为用户定义函数。用户可以根据要求修改函数。用户完全理解函数的内部工作。用户可以在函数中充分实现自己的想法。因此，这种用户定义函数集合对其他程序员是有用的。调用函数时包含存储用户定义函数的文件。例如，`square(9)`\
  \ 是一个返回 81 的用户定义函数。在这里，用户知道内部工作，因为源代码是可见的。这是两种类型的主要区别。\n\n##### 10.2 函数基础\n\n函数是一个自包含的块或子程序，在调用时执行一个特殊任务。\n\
  \n#### 10.2.1 为什么要用函数？\n\n1. 如果我们需要反复执行某项任务，就没有必要反复编写特定的代码块。将特定的语句块移动到用户定义函数中。定义的函数可以调用多次来执行任务。\n\
  \n2. 使用函数可以将大程序简化为小程序。这更容易调试和发现错误。它也增加了可读性。\n\n###### 10.2.2 函数是如何工作的？\n\n1. 一旦函数被定义并调用，它从调用函数获取某些数据并向调用函数返回一个值。\n\
  \n2. 函数内部工作的细节对程序的其余部分是未知的。当调用函数时，控制权传递到调用函数，调用函数的执行暂停。当调用函数执行完毕，控制权返回调用函数并执行下一语句。\n\
  \n3. 调用函数传递的实际参数值由调用函数的形式参数接收。实际参数和形式参数的数量应该是相同的。多余参数会被丢弃。如果形式参数多于实际参数，则多余参数将显示垃圾值。\n\
  \n4. 函数对形式参数进行操作并将结果传回调用函数。`return()` 语句执行此任务。\n\n\n\n\n\n```\nreturn_type function_name\
  \ (argument/parameter list)\n\n{\n\n![image](img/page380_1.png)\n}\n```\n\n以下代码说明了函数及其必要组件的工作原理(表\
  \ 10.1）。\n\n**表 10.1** *函数的运行*\n\n| int abc (int, int, int); |\n| void main( ) |\n\
  | { |\n| int x, y, z; |\n| -------------------- |\n| -------------------- |\n| ![image](img/page380_2.png)\
  \ |\n| -------------------- |\n| -------------------- |\n| } |\n| ![image](img/page381_1.png)\
  \ |\n| -------------------- |\n| -------------------- |\n| return(); return value\
  \ |\n| } |\n\n1. 函数的返回可以是 `int`、`float`、`double`、`char`、`void` 等，取决于被调用函数返回给调用函数的内容。在\
  \ ANSI C 中，如果未指定返回类型，函数默认返回 `int`。\n\n2. 实参：调用函数的参数称为实际形参数。在表 10.1 中，变量 `x`、`y`\
  \ 和 `z` 是实参。\n\n3. 形参：被调用函数的参数称为形式形参数。在表 10.1 中，变量 `l`、`k` 和 `j` 是形式形参数。\n\n4. 函数名：函数名的命名规则与变量的命名规则相同。\n\
  \n   ***示例：***\n\n   `sum (int a, int b);`\n\n   其中 `sum()` 是一个用户定义的函数。这是一个函数调用，`a`\
  \ 和 `b` 是整数参数。函数调用必须以分号（`;`）结束。\n\n6. 参数/参数列表：参数列表是指括号内的变量名。它们必须用逗号（`,`）隔开。这些形参（收件方）接收来自实参的值，以便在执行发件者函数和收件者函数之间的通信。\n\
  \n6. 函数调用：当分号（`;`）后紧跟函数名时，编译器会执行该函数。可以像其他 C 语句一样直接使用函数名调用函数，并以分号（`;`）结束。\n\n考虑以下示例。\n\
  \n![img](img/aero.png) 10.1 编写一个程序显示如何调用用户定义的函数。\n\n```\nint add(int,int); /* 函数原型\
  \ */\nvoid main ( )\n{\nint x=1,y=2,z;\nz=add(x,y); /* 函数调用/\nprintf(“z=%d”,z);\n\
  }\n\n/* 函数定义 */\nint add(int a, int b)\n{\nreturn(a+b);\n}\n```\n\n**输出：**\nz=3\n\
  \n***解释：***\n\n在上述程序中，`x` 和 `y` 的值被传递给函数 `add()`。形参 `a` 和 `b` 接收这些值。函数 `add()` 计算两个变量之和并返回结果。结果由\
  \ `main()` 函数的变量 `z` 收集，并通过 `printf()` 语句打印出来。\n\n![img](img/aero.png) 10.2 编写一个程序定义一个用户定义的函数。在不同的地方调用它们。\n\
  \n```\nvoid y();\nvoid y()\n{printf(“Y”);\n}\nvoid main()\n{\nvoid a(),b(),c(),d();\n\
  clrscr();\ny();\na();\nb();\nc();\nd();\n}\nvoid a()\n{\nprintf(“A”);\ny();\n}\n\
  void b()\n{\nprintf(“B”);\na();\n}\nvoid c()\n{\na();\nb();\nprintf(“C”);\n}\nvoid\
  \ d()\n{\nprintf(“D”);\nc();\nb();\na();\n}\n```\n\n**输出：**\nY A Y B A Y A Y B A\
  \ Y C D A Y B A Y C B A Y A Y\n\n***解释：***\n\n从上述程序中我们可以得出结论：\n\n1. `main()` 函数可以调用定义在\
  \ `main()` 函数之前或之后的任何函数。\n2. 任何其他用户定义的函数都可以调用 `main()` 函数。\n3. 用户定义的函数只能调用定义在它之前的用户定义函数，即函数\
  \ `a()` 只能调用 `y()`，而不能调用 `b()`、`c()` 和 `d()`。函数 `b()` 不能调用函数 `c()` 和 `d()`。函数 `d()`\
  \ 可以调用所有函数，因为它是最后一个函数。\n\n(f)局部变量和全局变量：变量有两种类型：(i)局部变量和(ii)全局变量。\n\n(i)局部变量：局部变量定义在函数体或块内部。定义的变量仅对该函数或块可见。其他函数无法访问这些变量。如果其他函数尝试访问这些变量，编译器将显示错误。\n\
  \n***示例：***\n\n```\nvalue(int k, int m)\n{\nint r,t;\n}\n```\n\n在这里 `r` 和 `t` 是局部变量，定义在\
  \ `value()` 函数体内部。在不同的函数中可以定义相同的变量名。它们仅属于特定的函数。\n\n下面演示了关于局部和全局变量的程序。\n\n![img](img/aero.png)\
  \ 10.3 编写一个程序显示如何使用局部和全局变量。\n\n```\nvoid func();\nvoid main()\n{\nint x=10;\nfunc();\n\
  printf(\"%d\",x);\n}\nvoid func()\n{\nint x=20;\nprintf(\"%d\",x);\n}\n```\n**输出：**\n\
  10\n20\n\n(ii)全局变量：全局变量定义在主函数之外。任何函数都可以访问它们。\n\n![img](img/aero.png) 10.4 编写一个程序显示全局变量的影响。\n\
  \n```\nint x=10;\nvoid func();\nvoid main()\n{\nprintf(\"%d\",x);\nfunc();\nprintf(\"\
  %d\",x);\n}\nvoid func()\n{\nx=x+10;\n}\n```\n**输出：**\n10\n20\n\n(g)返回值：它是函数的执行。函数获得的结果通过返回语句传回调用函数。返回语句每次调用返回一个值。\n\
  \n##### 10.4 return 语句\n\n用户定义的函数使用返回语句将值返回给调用函数。从被调用函数到调用函数的退出是通过返回语句实现的。当执行没有参数的返回语句时，它总是返回\
  \ 1。\n\n![img](img/aero.png) 10.5 编写一个程序以不同方式使用返回语句。\n\n```\nint pass(int);\nvoid\
  \ main()\n{\nint x,y;\nclrscr();\nprintf(“Enter value of x :”);\nscanf(“%d”,&x);\n\
  if(x==1 || x<0)\nreturn 0;\ny=pass(x);\nswitch(y)\n{\ncase 1:\nprintf(“The value\
  \ returned is %d”,y);\nbreak;\ndefault :\nprintf(“The Cube of %d is : %d”,x,y);\n\
  }\n\nreturn 0;\n}\n\nint pass(a)\n{\nif(a==0)\nreturn 0;\nelse\nreturn(a*a*a);\n\
  }\n```\n\n**输出：**\nEnter value of x : 5\nThe Cube of 5 is :125\n\n1. `return 0`：如果用户输入的值为\
  \ 1 或负数，该语句向操作系统返回 0。\n\n2. `return`：将 `x` 的值传递给函数 `pass()`。\n\n\n\n\n\n### 3. `return\
  \ (a*a*a)`: 在函数 `pass()` 中，当 `if` 语句发现 `x` 的值为非零时，将执行 `else` 块，并且 `return` 语句返回输入数字的立方方。\n\
  \n`return` 语句可以用以下方式使用。\n\n#### 1. `return(expression);`\n\n**示例：**\n```\nreturn(a+b+c);\n\
  ```\n如果执行了此类语句，将首先求解括号内的表达式，并返回获得的结果。\n\n#### 2. 一个函数可以使用一个或多个 `return` 语句。当我们想要根据某些条件返回返回值时，就会使用它。\n\
  \n**示例：**\n\n| `if` 语句 | | |\n| --- | --- | --- |\n| `if(a>b)` | `switch()` 语句 |\
  \ |\n| `return(a);` | `switch(x)` | |\n| `else` | ` {` | |\n| `return(b);` | `case\
  \ 1 :` | |\n| | `return(1);` | |\n| | `break;` | |\n| | `case 2` | |\n| | `return(1*2);`\
  \ | |\n| | `break;` | |\n| | `default :` | |\n| | `return(0);` | |\n| | ` }` | |\n\
  \n#### 3. `return(&p)`\n如果使用上述语法，它返回变量的地址。\n\n#### 4. `return(*p)`\n上述语句通过指针返回变量的值。\n\
  \n#### 5. `return(sqrt(r))`\n如果使用这种格式，当控制权到达 `return` 语句时，控制权再次传递给函数 `sqrt()`。`return`\
  \ 语句收集 `sqrt()` 函数获得的结果并将其返回给调用函数。在这里，`return` 语句调用了 `sqrt()` 函数。\n\n#### 6. `return(float(square(2.8));`\n\
  所有函数默认返回整数值。要强制函数返回其他类型的值，请指定要使用的数据类型。当返回值时，它会自动转换为函数的数据类型。在上述示例中，返回值将转换为 `float`\
  \ 类型。\n\n从上述讨论中我们可以得出以下结论：\n\n1. 当在函数中遇到 `return` 语句时，控制权返回到调用函数，`return` 语句后面的语句（如果有）将不会被执行。\n\
  2. 无 `return` 语句表示没有返回值。此类函数被称为 `void`（空）。\n\n##### 10.5 函数的类型\n\n根据参数是否存在，返回值将结果传回调用函数。基于此，函数分为四类。\n\
  \n#### 1. 无参数且无返回值（参见表 10.2）。\n\n**表 10.2：无参数和无返回值的函数**\n\n| 调用函数 | 分析 | 被调用函数 |\n\
  | --- | --- | --- |\n| `void main()` | | `abc()` |\n| `{` | | `{` |\n| ----------------------\
  \ | | ---------------------- |\n| ---------------------- | | ----------------------\
  \ |\n| `abc();` | 未传递参数 | ---------------------- |\n| ---------------------- | 没有返回任何值。\
  \ | `}` |\n| ---------------------- | | |\n| `}` | | |\n\n1. 数据既不通过调用函数传递，也不从被调用函数返回。\n\
  2. 调用函数和被调用函数之间没有数据传输。\n3. 函数仅执行且不获取任何结果。\n4. 如果使用此类函数执行任何操作，它们是独立运行的。它们在同一个块中读取数据值并打印结果。\n\
  5. 此类函数可能用于打印某些消息、画线或分割线条。\n\n**示例：**\n![img](img/aero.png) 10.6 编写一个使用自定义函数显示消息的程序。\n\
  \n```\nvoid main()\n{\n    void message();\n    message();\n}\n\nvoid message()\n\
  {\n    puts(“Have a nice day”);\n}\n```\n**输出：**\nHave a nice day\n\n**解释：**\n该程序包含一个名为\
  \ `message()` 的用户定义函数。它不需要参数且没有返回值。被调用时仅显示一条消息。\n\n![img](img/aero.png) 10.7 编写一个使用函数显示字母\
  \ ‘A’、‘B’ 和 ‘C’ 的程序。\n\n```\nvoid main()\n{\n    void a(), b(),c();\n    a();\n\
  \    b();\n    c();\n}\n\nvoid a()\n{\n    printf(“\\nA”);\n}\n\nvoid b()\n{\n \
  \   printf(“B”);\n}\n\nvoid c()\n{\n    printf(“C”);\n}\n```\n**输出：**\nABC\n\n**解释：**\n\
  在上述示例中，定义了三个自定义函数 `a()`、`b()` 和 `c()`。`main()` 函数调用这三个函数。这些函数按照调用顺序被调用并显示消息。\n\n\
  #### 2. 有参数但无返回值（参见表 10.3）。**\n\n**表 10.3：有参数但无返回值的函数**\n\n| 调用函数 | 分析 | 被调用函数 |\n\
  | --- | --- | --- |\n| `void main()` | | `abc(y)` |\n| `{` | | `{` |\n| ----------------------\
  \ | | ---------------------- |\n| ---------------------- | | ----------------------\
  \ |\n| `abc(x);` | 传递了参数。 | ---------------------- |\n| ---------------------- |\
  \ 没有返回任何值。 | `}` |\n| ---------------------- | | |\n| `}` | | |\n\n1. 在上述函数中，参数通过调用函数传递。被调用函数对这些值进行操作，但没有返回结果。\n\
  2. 此类函数部分依赖于调用函数。获得的结果被被调用函数利用，对 `main()` 没有收益。\n\n**示例：**\n![img](img/aero.png)\
  \ 10.8 编写一个程序，将日期、月份和年份作为参数传递给自定义函数，并以 dd/mm/yy 的格式显示日期。\n\n```c\n# include<stdio.h>\n\
  # include<conio.h>\n\nvoid main()\n{\n    int d,m,y;\n    clrscr();\n    printf(“Enter\
  \ Date: dd/mm/yy”);\n    scanf(\"%d %d %d\",&d,&m,&y);\n    dat(d,m,y);\n}\n\nint\
  \ dat(int x, int y, int z)\n{\n    printf(\"\\nDate = %d/%d/%d\",x,y,z);\n    return\
  \ 0;\n}\n```\n**输出：**\nEnter Date: dd/mm/yy\n09 09 14\nDate = 9/9/14\n\n**解释：**\n\
  在该程序中，三个值被传递给 `dat()`。`dat()` 函数接收并显示日期，但它没有返回值。\n\n![img](img/aero.png) 10.9 编写一个使用自定义函数计算数字平方的程序。\n\
  \n```c\nvoid main()\n{\n    int j=0;\n    void sqr(int);\n    clrscr();\n    for(j=1;j<5;j++)\n\
  \    {\n        sqr(j);\n    }\n    getch();\n}\n\nvoid sqr(int k)\n{\n    printf(\"\
  \\n%d\", k*k);\n}\n```\n**输出：**\n1\n4\n9\n16\n\n**解释：**\n在此处程序中，`main()` 函数每次调用\
  \ `sqr()` 都会传递一个参数。`sqr()` 收集该参数并打印其平方。函数 `sqr()` 是 `void` 类型。\n\n![img](img/aero.png)\
  \ 10.10 编写一个将值传递给 main() 函数的程序。\n\n```c\nvoid main(int j)\n{\n    clrscr();\n  \
  \  printf(\"\\n Number of command line arguments = %d”,j);\n}\n```\n**解释：**\n要执行此程序，首先创建可执行文件并在命令行提示符运行运行。上述示例说明了命令行参数。\n\
  `C:\\> main.exe 1 2 3`\n`Number of command line arguments = 4`\n\n#### 3. 有参数且有返回值（参见表\
  \ 10.4）。**\n\n**表 10.4：有参数且有返回值的函数**\n\n| 调用函数 | 分析 | 被调用函数 |\n| --- | --- | ---\
  \ |\n| `void main()` | | `abc(y)` |\n| `{` | | `{` |\n| `int z;` | | `-----------`\
  \ |\n| `-----------` | | `y++` |\n| `z=abc(x);` | 传递了参数。 | `-----------` |\n| `-----------`\
  \ | | `-----------` |\n| `-----------` | 返回了值。 | `-----------` |\n| `}` | | `return(y);`\
  \ |\n| | | `}` |\n\n\n\n\n1. 在上面的示例中，实际参数的副本被传递给形式参数，即 `*x*` 的值被赋值给 `*y*`。\n\n2.\
  \ `return` 语句返回 `*y*` 加后的值。返回的值由 `*z*` 收集。\n\n3. 这里，数据在调用函数和被调用函数之间传输，即实现了函数之间的通信。\n\
  \n![img](img/aero.png) 10.11 编写一个程序，将值传递给自定义函数并显示日、月、年。\n\n```c\n# include <stdio.h>\n\
  # include <conio.h>\n\nvoid main()\n{\n    int dat(int ,int ,int );\n    int d,m,y,t;\n\
  \    clrscr();\n    printf(“Enter Date dd/mm/yy : “);\n    scanf(“%d %d %d”,&d,&m,&y);\n\
  \    t=dat(d,m,y);\n    printf(“\\nTomorrow = %d/%d/%d”,t,m,y);\n    getch();\n\
  }\n\nint dat(int x, int y, int z)\n{\n    printf(“\\nToday= %d/%d/%d”,x,y,z);\n\
  \    return(++x);\n}\n```\n\n**OUTPUT:**\nEnter Date dd/mm/yy : 09 09 2014\nToday=\
  \ 9/9/2014\nTomorrow = 10/9/2014\n\n**Explanation:**\n在上面的程序中，日、月、年三个值被传递给函数 `dat()`。该函数显示日期。函数\
  \ `dat()` 返回下一个日期。下一个日期在 `main()` 函数中打印。这里，函数 `dat()` 接收了参数并返回值。\n\n![img](img/aero.png)\
  \ 10.12 编写一个程序，将值发送给自定义函数并接收且显示返回值。\n\n```c\nint main()\n{\n    int sum(int,int,int),\
  \ a,b,c,s;\n    clrscr();\n    printf(“Enter Three Numbers :”);\n    scanf(“%d %d\
  \ %d”, &a,&b,&c);\n    s=sum(a,b,c);\n    printf(“Sum = %d”,s);\n    return 0;\n\
  }\n\nint sum(int x, int y, int z)\n{\n    return(x+y+z);\n}\n```\n\n**OUTPUT:**\n\
  Enter Three Numbers : 7 5 4\nSum = 16\n\n**Explanation:**\n在上面的程序中，函数 `sum()` 从\
  \ `main()` 函数接收三个值。`sum()` 计算三个数的和并将其返回给 `main()`。\n\n## 4. 无参数但有返回值 ([表 10.5])\n\
  \n**表 10.5** 无参数但有返回值的函数\n\n| main() | | abc() |\n| :--- | :--- | :--- |\n| { |\
  \ | { |\n| int z; | | int y=5; |\n| ----------- | | ----------- |\n| z=abc(); |\
  \ 没有传递参数。 | ----------- |\n| ----------- | | ----------- |\n| ----------- | 值被传回。\
  \ | return(y); |\n| } | | } |\n\n1. 在上述类型的函数中，没有参数通过 `main()` 函数传递。但被调用的函数返回值。\n\
  \n2. 被调用的函数是独立的。它从键盘读取值或通过初始化生成值并返回这些值。\n\n3. 这里，调用函数和被调用函数部分相互通信。\n\n![img](img/aero.png)\
  \ 10.13 编写一个程序，在不通过 main() 传递任何值的情况下，从自定义函数接收值。\n\n```c\nint main()\n{\n    int\
  \ sum(),a,s;\n    clrscr();\n    s=sum();\n    printf(“Sum = %d”,s);\n    return\
  \ 0;\n}\n\nint sum()\n{\n    int x,y,z;\n    printf(“\\n Enter Three Values :”);\n\
  \    scanf(“%d %d %d”,&x,&y,&z);\n    return(x+y+z);\n}\n```\n\n**OUTPUT:**\nEnter\
  \ Three Values : 3 5 4\nSum = 12\n\n**Explanation:**\n自定义函数 `sum()` 是一个独立的函数。函数\
  \ `sum()` 通过键盘读取三个值并将它们的和返回给函数 `main()`。`main()` 只打印和。\n\n![img](img/aero.png) 10.14\
