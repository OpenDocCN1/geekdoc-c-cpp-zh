  \ 6.72 写一个程序求诸如 1+2+3+. . . i 的序列。使用 do-while 循环。其中 i 可以是一个有限值。其值应通过键盘读取。\n\n```c\n\
  void main()\n{\n  int i,a=1;\n  int s=0;\n  clrscr();\n  printf(\"\\n Enter a number:\"\
