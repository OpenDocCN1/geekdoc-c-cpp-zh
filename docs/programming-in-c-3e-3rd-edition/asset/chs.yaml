  \ `bar()` 函数绘制框。并用不同的设计填充框。\n\n```c\n#include <graphics.h>\n# include <stdlib.h>\n\
  \nvoid main( )\n{\nint gd=DETECT,gm,a=40,b=40,ptr,k;\nchar txt[10];\nchar *design[]\n\
  {“EMPTY_FILL”, “SOLID_FILL”, “LINE_FILL”,\n“LLAH_FILL”, “SLASH_FILL”, “BK_FILL”,\n\
  “LTBKSLASH_FILL”, “HATCH_FILL”, “XHATCH_FILL”,\n“INTERLEAVE_FILL”, “WIDE_DOT_FILL”,\n\
  “CLOSE_DOT_FILL”, “USER_FILL”};\ninitgraph(&gd,&gm,“c:\\\\tc”);\nsetcolor(RED);\n\
  settextstyle(0,0,2);\nouttextxy(100,1,“User-defined Styles”);\nsettextstyle(0,0,0);\n\
  setcolor(WHITE);\nfor (ptr=0;ptr<12;ptr++)\n{\nsetfillstyle(ptr,ptr);\nbar(a,b,a+70,b+70);\n\
  rectangle(a,b,a+70,b+70);\nk=1+ptr;\nitoa(k,txt,10);\nouttextxy(a,b+100,txt);\n\
  setcolor(ptr+1);\nouttextxy(a,b+110,design[ptr]);\na=a+150;\nif (a>490)\n{\nb=b+150;\n\
  a=40;\n}\n}\ngetche();\nclosegraph();\nrestorecrtmode();\n}\n```\n\n**解释：**\n在上面的程序中，`settextstyle()`\
  \ 设置了字体大小、文本方向（水平或垂直）和大小。‘user-defined styles’以较大的字体和红色显示。再次将文本属性设置为 0，以免影响文本输出。字符指针用预定义的图案（设计）初始化。`setfillstyle()`\
  \ 函数有两个参数：图案和填充颜色。`bar()` 函数使用 `setfillstyle()` 的属性绘制矩形。`rectangle()` 函数为 `bar()`\
  \ 创建的各种矩形绘制边界。`itoa()` 函数将整数转换为字符串。每个矩形下方显示的数字 1 到 12 归功于此函数。\n\n![image](img/aero.png)\
