  }\n```\n\n**解释：**\n这个程序与上一个所解释的相同。在这个程序中，使用了文本的额外函数。程序员可以运行程序并看到其效果。\n\n### 15.6\
  \ 用不同颜色和样式填充图案\n\n现在，我们将使用一个函数通过不同的样式用不同的颜色填充不同的图案。在接下来的程序中，使用 `setfillstyle()`\
