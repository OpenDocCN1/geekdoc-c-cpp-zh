  May\nJune\nJuly\nAugust\nSeptember\nOctober\nNovember\nDecember\n\n**解释：**\n在上述程序中，枚举数据类型被定义并用月份名称初始化。在声明中，枚举\
  \ `month` 被初始化为常量 1，因此枚举常数的计数从 1 开始。常量被用于 `for` 循环。`switch()` 用于执行相应的分支并显示月份名称。\n\
  \n\n\n\n```c\n#include <string.h>\n\nvoid main()\n{\n  enum capital\n  {\n    Mumbai,\
