  \ 函数从文件中读取整数。\n\n### 结构体的读写\n\n了解如何通过 `fprintf()` 将结构写入磁盘是非常重要的。结构数据在内存中占据多个字节。为了克服这个问题，应该以二进制模式写入文件，因此使用\
  \ `fwrite()`。\n\n#### `fwrite()` & `fread()`\n\n1. `fwrite()`：此函数用于向给定文件写入整个结构块。\n\
  2. `fread()`：此函数用于从给定文件读取整个结构块。\n\n![img](img/aero.png) 14.17 编写一个程序，使用 `fwrite()`\
  \ 向文件写入结构元素。\n\n```c\n# include <stdio.h>\n# include <conio.h>\n# include <process.h>\n\
  \nstruct\n{\n  char name[20];\n  int age;\n}\nstud[5];\nFILE *fp;\nint i,j=0,n;\n\
  char str[15];\n\nvoid main()\n{\n  printf(“Enter file name :”);\n  scanf(“%s”,str);\n\
  \  fp=fopen(str,”rb”);\n  if(fp==NULL)\n  {\n    printf(“File dose exist \\n”);\n\
  \    exit(1);\n  }\n  else\n  {\n    printf(“How Many Records :”);\n    scanf(“%d”,&n);\n\
  \    for(i=0;i<n;i++)\n    {\n      printf(“Name :”);\n      scanf(“%s”,&stud[i].name);\n\
  \      printf(“Age :”);\n      scanf(“%d”,&stud[i].age);\n    }\n    while(j<n)\n\
  \    {\n      fread(&stud[j],sizeof(stud),1,fp);\n      j++;\n    }\n  }\n  fclose(fp);\n\
  }\n```\n\n**输出：**\nEnter file name : data.dat\nHow Many Records : 2\nName : SANTOSH\n\
  Age : 22\nName : AMIT\nAge : 14\n\n***解释：***\n在上述程序中，以写模式打开了文件。成功打开文件后，要求输入记录数。使用\
  \ `for` 循环输入记录。使用 `while` 循环和 `fwrite()` 语句将记录写入文件。\n\n![img](img/aero.png) 14.18\
  \ 编写一个程序，写入并读取包含球员姓名、年龄和得分的信息。使用 `fread()` 和 `fwrite()` 函数。\n\n```c\n# include <stdio.h>\n\
  # include <conio.h>\n# include <process.h>\nstruct record\n{\n  char player[20];\n\
  \  int age;\n  int runs;\n};\nvoid main()\n{\nFILE *fp;\nstruct record emp;\nfp=fopen(“record.dat”,“w”);\n\
