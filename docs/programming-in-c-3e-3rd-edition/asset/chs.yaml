  指针（Pointer）是 C 语言中一种特殊的数据类型，被程序员广泛使用。大多数计算机语言学习者都认为指针是一个令人困惑的话题，非常难以理解。然而，指针能够实现程序快速且直接的执行。通过指针，内存可以得到最高效利用。C\
  \ 语言对指针给予了重视。因此，了解指针的操作和应用至关重要。指针在 C 语言中被用作工具，如果你无法理解它，你将会失去 C 语言的威力。\n\n在 C 语言中，变量被用于在程序执行期间存储数据值。每个变量在声明时都会占用特定的内存位置。例如，整型变量占用两个字节内存，字符类型占用一个字节，浮点类型占用四个字节。通过指针，人们可以操作内存地址。使用\
  \ `&` 运算符可以访问并显示变量内存位置的地址。内存由一系列字节组成。这些字节从零开始编号。分配给单元的数字被称为内存地址。指针变量存储任何类型变量的内存地址。指针变量和普通变量应该是相同类型。指针用星号\
  \ `*` 符号表示。\n\n字节（Byte）无非八个位（bits）的组合，如图 9.1 和图 9.2 所示。二进制数字 0 和 1 被称为位。内存中的每个字节都有一个唯一的内存地址。内存地址是一个从零开始到微处理器最高寻址容量的无符号整数。指针所指向的内存位置数量取决于指针的类型。程序员不应该操心变量的寻址过程。编译器知道并执行指针的操作。指针的长度为\
  \ 16 位或 32 位。\n\n![image](img/page337_1.png)\n\n**图 9.1** *内存图*\n\n程序运行期间的内存分配被称为动态内存分配。这种类型的内存分配对于数据结构至关重要，并可以使用指针高效地处理。使用指针的另一个原因是数组。数组被用于存储更多值。实际上，数组的名字就是一个指针。使用指针的另一个原因是命令行参数。命令行参数传递给程序并存储在指针数组\
  \ `argv[]` 中。\n\n**指针：** 指针是一种特殊变量，用于存储另一个变量的地址。指针可以拥有任何与其他变量合法的名称，其声明方式与其他变量相同，但始终由星号\
  \ `*` 运算符表示。\n\n##### 9.2 指针的特性\n\n1. 指针是 C 语言代码开发中的基础工具。\n2. 指针节省内存空间。\n3. 使用指针可以高效地访问内存。指针分配内存空间并释放内存。指针用于动态分配内存。\n\
  4. 指针用于数据结构。它们对于表示二维数组和多维数组非常有用。\n5. 无论下标范围如何，都可以访问任何数据类型数组的元素。\n6. 指针用于文件处理。\n\
  7. 它们允许我们创建链表和其他面向算法的数据结构。\n8. 使用指针的执行速度更快，因为数据是通过地址进行的。\n\n##### 9.3 指针与地址\n\n\
  指针的理论并不复杂。计算机内存由半导体技术制造。内存由二进制单元组成。每个单元都有存储位（0 或 1）的能力。字节意味着 8 位的单位。每个这样的字节都有唯一的内存地址，如图\
  \ 9.2 所示。\n\n![image](img/page338_1.png)\n\n**图 9.2** *内存地址*\n\n当声明任何数据类型的变量时，会根据其数据类型预留内存。例如：\n\
  \n```c\nint x,y;\nchar c;\n```\n\n![image](img/page338_2.png)\n\n**图 9.3** *已分配内存*\n\
  \n如图 9.3 所示，为变量 `x`、`y` 和 `c` 预留了内存位置。整型变量每个预留两个字节，字符变量预留一个字节。位置 65550 和 65551 用于存储\
  \ `x`，65552 和 65553 用于存储 `y`，依此类推。`x` 的起始地址是 65550，`y` 是 65552。字符只需要一个字节，图 9.3 中所示的位置是\
  \ 65554。\n\n##### 9.4 指针声明\n\n指针变量可以如下进行声明。\n\n**示例：**\n\n```c\nint *x;\nfloat *f;\n\
  char *y;\n```\n\n1. 在第一个语句中，`*x` 是一个整数指针，告诉编译器它持有任何整数变量的地址。同样，`f` 是浮点型指针，存储任何浮点变量的地址，`y`\
  \ 是字符指针，存储任何字符变量的地址。\n2. 间接运算符 `*` 也称为解引用运算符（dereferencing operator）。当指针被解引用时，将获取指针所存储的该地址的值。\n\
  3. 普通变量提供对其自身的直接访问，而指针提供对值的间接访问。\n4. 当声明指针时，`*` 表示它是一个指针。\n5. 当指针被解引用时，将获取指针所存储的该地址的值。\n\
  6. 指针有两种用法方式：声明和解引用。\n7. 编译器根据上下文调用何种运算符。`*` 运算符。\n8. `&` 用于获取变量的地址。\n\n![img](img/aero.png)\
  \ 9.1 写一个程序显示变量的地址。\n\n```c\nvoid main()\n{\nint num;\nclrscr();\nprintf(\"Enter\
  \ a Number = \");\nscanf(\"%d\",&num);\nprintf(\"Value of num =%d\\n\",num);\nprintf(\"\
  Address of num=%u\\n\",&num);\ngetche();\n}\n```\n\n**输出：**\n\nEnter a Number =\
  \ 20\nValue of num = 20\nAddress of num = 4066\n\n***解释：***\n\n变量的物理内存位置取决于系统；因此，变量的地址无法立即预测。在上面的示例中，在下方的图\
  \ 9.4 中，显示了三个与上述程序相关的块。第一个块包含变量名。第二个块表示变量的值。第三个块是变量 `num` 的地址，20 存储在此处。4066 是内存地址。\n\
  \n![image](img/page340_1.png)\n\n**图 9.4** *变量值及其地址*\n\n![img](img/aero.png) 9.2\
  \ 写一个程序显示不同变量的值及其地址。\n\n```c\nvoid main()\n{\nchar c;\nint i;\nfloat f;\nclrscr();\n\
  printf(\"Enter alphabet, number, float=\");\nscanf(\"%c %d %f\",&c,&i,&f);\nprintf(\"\
  Value of c=%c i=%d f=%f\\n\",c,i,f);\nprintf(\"\\nAddress of(c)%c =%u\",c,&c);\n\
  printf(\"\\nAddress of(i)%d =%u\",i,&i);\nprintf(\"\\nAddress of(f)%.2f =%u\",f,&f);\n\
  getche();\n}\n```\n\n**输出：**\n\nEnter alphabet, number, float = C 20 2.5\nValue\
  \ of c=C i=20 f=2.5\nAddress of(c)C = 4061\nAddress of(i)20 = 4062\nAddress of(f)2.50\
  \ = 4064\n\n\n\n\n\n上述程序声明了三个不同数据类型的变量。它们的值与其相应的地址一起显示。内存地址是无符号整数。从上面的示例中，程序员可以理解，由于数据类型的不同，两个连续地址之间的差是不固定的。\n\
  \n![img](img/aero.png) 9.3 写一个程序，显示任何数据类型的占用相同空间的指针。\n\n```c\nvoid main()\n{\n \
  \   clrscr();\n    printf(\"\\t char %d byte & its pointer %d bytes\\ n\",sizeof(char),sizeof(char*));\n\
  \    printf(\"\\t int %d byte & its pointer %d bytes\\ n\",sizeof(int),sizeof(int*));\n\
  \    printf(\"\\t float %d byte & its pointer %d bytes\\ n\",sizeof(float),sizeof(float*));\n\
  }\n```\n\n**输出：**\nchar 1 byte & its pointer 2 bytes\nint 2 byte & its pointer 2\
  \ bytes\nfloat 4 byte & its pointer 2 bytes\n\n***解释：***\n\n在上述程序中，使用 `sizeof()`\
  \ 运算符计算并显示了数据类型及其指针的大小。从上面的程序可以观察到，数据类型需要不同字节数来存储，而任何数据类型的指针都需要两个字节。在 Linux 平台上，指针的大小为四个字节。\n\
  \n![img](img/aero.png) 9.4 写一个程序，使用指针显示变量的值及其位置。\n\n```c\nvoid main()\n{\n    int\
  \ v=10,*p;\n    clrscr();\n    p=&v;\n    printf(\"\\n Address of v = %u\",p);\n\
  \    printf(\"\\n Value of v = %d\",*p);\n    printf(\"\\n Address of p= %u\",&p);\n\
  }\n```\n\n**输出：**\nAddress of v = 4060\nValue of v = 10\nAddress of p = 4062\n\n\
  ***解释：***\n\n在上述程序中，`*v` 是一个整数变量，其值为 10。变量 `*p` 被声明为指向变量的指针。语句 `p = &v` 将 `*v` 的地址赋值给\
  \ `*p`，即 `*p` 是指向变量 `*v` 的指针。为了访问 `*v` 的地址和值，可以使用指针 `*p`。`*p` 的值无非变量 `*v` 的地址。为了显示存储在该位置的值，使用了\
  \ `p`。指针变量也有地址，并使用 `&` 运算符显示。在本例中，用于查找指针地址的语句是 `printf(\"\\n Address of p = %u\"\
  ,&p);`（参见图 9.5）。\n\n![image](img/page342_1.png)\n\n**图 9.5** 变量\n\n`*v` 的值为 10，存储在位置\
  \ 4060 。`*v` 的地址 4060 被赋值给变量 `*p`。指针变量 `*p` 的地址是 4062。在这里，`*p` 是指针类型变量，它指向变量 `*v`。因此，它必须声明为\
  \ `int v = 10;`，指针变量声明为 `int*p;`。\n\n![img](img/aero.png) 9.5 写一个程序，以不同的方式打印变量的值。你将如何使用\
  \ `*` 和 `&` 运算符来访问值：\n\n```c\nvoid main()\n{\n    int a,*pa;\n    float b,*pb;\n\
  \    clrscr();\n    printf(\"Enter Integer & float Value :\");\n    scanf(\"%d %f\"\
  ,&a,&b);\n    pa=&a;\n    pb=&b;\n    printf(\"\\n Address of a=%u\",pa);\n    printf(\"\
  \\n Value of a=%d\",a);\n    printf(\"\\n Value of a=%d\",*(&a));\n    printf(\"\
  \\n Value of a=%d\",*pa);\n    printf(\"\\nAddress of b=%u\",pb);\n    printf(\"\
  \\n Value of b=%.2f\",b);\n    printf(\"\\n Value of b=%.2f\",*(&b));\n    printf(\"\
  \\n Value of b=%.2f\",*pb);\n}\n```\n\n**输出：**\nEnter Integer & float Value : 4\
  \ 2.2\nAddress of a=4054\nValue of a=4\nValue of a=4\nValue of a=4\nAddress of b=4060\n\
  Value of b=2.20\nValue of b=2.20\nValue of b=2.20\n\n***解释：***\n\n程序的输出如上所示。程序说明了如何使用指针访问变量\
  \ `*a` 和 `*b` 的值。`*pa` 的地址是 4054，它指向 4。`*pb` 的地址是 4060，它指向 2.2。\n\n因此，从上面的示例中，我们注意到下面的等价关系。\n\
  \n`.a=*(&a)=*pa`\n\n**`*(&a)` 的解释：** 在这里，使用 `&a` 来获取变量 `*a` 的地址。存储在此位置的内容通过 `*`\
  \ 访问。声明 `(*a)` 的作用相当于 `*pa`。\n\n给出了一个简单的示例来理解上述概念。\n\n![img](img/aero.png) 9.6 写一个程序，使用不同的指针符号打印变量的值。\n\
  \n```c\nvoid main()\n{\n    int v=10,*p;\n    clrscr();\n    p=&v;\n    printf(\"\
  \\n v = %d v = %d v = %d\",v,*(&v),*p);\n}\n```\n\n**输出：**\nv = 10 v = 10 v = 10\n\
  \n***解释：***\n\n在上述程序中，为了显示变量 `*v` 的值，`printf()` 语句中使用了三种不同的语法。\n\n![img](img/aero.png)\
  \ 9.7 写一个程序，使用指针打印一个元素及其地址。\n\n```c\nvoid main()\n{\n    int i,*k;\n    clrscr();\n\
  \    printf(\"Enter a number : \");\n    scanf(\"%d\",&i);\n    k=&i;\n    printf(\"\
  \\nAddress of i is %u\",k);\n    printf(\"\\nValue of i is %d\",*k);\n}\n```\n\n\
  **输出：**\nEnter a number : 15\nAddress of i is 4062\nValue of i is 15\n\n***解释：***\n\
  \n在上述程序中，变量 `*i` 的地址被赋值给指针 `k`。因此，`k` 是指向变量 `*i` 的指针。\n\n![img](img/aero.png) 9.8\
  \ 写一个程序，通过指针计算两个数字。\n\n```c\nvoid main()\n{\n    int a,b,c,*ap,*bp;\n    clrscr();\n\
  \    printf(\"Enter Numbers :\");\n    scanf(\"%d %d\",&a,&b);\n    ap=&a;\n   \
  \ bp=&b;\n    c=*ap+bp;\n    printf(\"\\nSum of numbers = %d\",c);\n}\n```\n\n**输出：**\n\
  Enter Numbers: 8 4\nSum of numbers = 12\n\n***解释：***\n\n在上述程序中，变量 `*a` 和 `*b` 的地址赋值给了指针\
  \ `ap` 和 `bp`。通过 `c=*ap+bp` 计算和。\n\n![img](img/aero.png) 9.9 写一个程序，将指针值赋值另一个变量。\n\
  \n```c\nvoid main()\n{\n    int a=5,b,*c;\n    clrscr();\n    c=&a;\n    b=*c;\n\
  \    printf(\"Memory location of ‘a’=%u\",c);\n    printf(\"\\n of b=%d\",b);\n\
  }\n```\n\n**输出：**\nMemory location of ‘a’=4062\nof b=5\n\n***解释：***\n\n在上述程序中，指针变量\
  \ `c` 被赋值为 `a` 的地址。存储在此位置的值通过指针赋值给 `b`。\n\n![img](img/aero.png) 9.10 写一个程序，通过指针将\
  \ '*b*' 的值赋值给 '*a*'。\n\n```c\nvoid main()\n{\n    int a,b,*pa,*pb;\n    clrscr();\n\
  \    printf(\"Enter Value of ‘a’ & ‘b’. :\");\n    scanf(\"%d %d\",&a,&b);\n   \
  \ pa=&a;\n    pb=&b;\n    printf(\"\\nValue of a=%d & b=%d\",a,b);\n    printf(\"\
  \\nAddress of a=%u\",pa);\n    printf(\"\\nAddress of b=%u\",pb);\n    printf(\"\
  \\n\\nAddition of ‘a’ & ‘b’ : %d\",*pa+*pb);\n    pa=pb;\n    printf(\"\\n*pa=%d\
  \ *pb=%d\",*pa,*pb);\n    printf(\"\\npa =%u pb=%u\",pa,pb);\n    printf(\"\\nAddition\
  \ of *pa +*pb : %d\",*pa+*pb);\n    getche();\n}\n```\n\n**输出：**\nEnter Value of\
  \ ‘a’ & ‘b’. : 8 4\nValue of a=8 & b=4\nAddress of a=4056\nAddress of b=4058\n\n\
  Addition of ‘a’ & ‘b’ : 12\n*pa=4 *pb=4\npa =24350 pb=24350\nAddition of *pa + *pb\
  \ : 8\n\n***解释：***\n\n在上述程序中，变量 `*a` 和 `*b` 的地址赋值给了指针 `*pa` 和 `*pb`。语句 `pa = pb;`\
  \ 意味着指针 `*pb` 的值赋值给指针 `*pa`。现在，两个指针具有相同的值，并且它们指向同一个变量 `*b`。因此，加法的结果是 8。\n\n\n\n\n\
  指针也可以声明为 `void` 类型。在没有显式类型转换的情况下，`void` 指针不能被解引用。这是因为由于是 `void`，编译器无法确定指针所指向对象的大小。虽然可以声明\
  \ `void` 指针，但不允许声明 `void` 变量。因此，声明 `void *p` 在编译后将显示错误信息“Size of ‘p’ is unknown\
  \ or zero”（‘p’的大小未知或零）。\n\n指针指向一个存在的实体。通过适当类型转换，`void` 指针可以指向任何类型的变量。`void` 指针的大小为二。当指针声明为\
  \ `void` 时，会为它分配两个字节。稍后通过类型转换，可以分配或释放若干字节的内存。不能声明 `void` 变量，因为没有为它们分配内存，也没有地方存储地址。因此，`void`\
  \ 变量无法完成它们本应的工作。\n\n![img](img/aero.png) 9.11 编写一个程序声明 `void` 指针。使用类型转换方法将 `int`、`float`\
  \ 和 `char` 变量的地址赋给 `void` 指针。显示各种变量的内容。\n\n```\nint p;\nfloat d;\nchar c;\nvoid\
  \ *pt = &p;\nvoid main\n{\n    clrscr();\n    *(int *) pt = 12;\n    printf(“\\\
  n p= %d”,p);\n    pt=&d;\n    *(float *)pt = 5.4;\n    printf(“\\n r=%g”,d);\n \
  \   pt=&c;\n    *(char*)pt='S’;\n    printf(“\\n c=%c”,c);\n}\n```\n\n**OUTPUT:**\n\
  p=12\nr=5.4\nc=s\n\n**Explanation:**\n在上面的示例中，变量 `p`、`d` 和 `c` 分别是 `int`、`float`\
  \ 和 `char` 类型的变量。指针 `pt` 是 `void` 类型的指针。这些变量在 `main()` 之前声明。指针用整数变量 `p` 的地址初始化，即指针\
  \ `pt` 指向变量 `p`。语句 `*(int *) pt = 12` 将整数值 `12` 赋值给指针 `pt`，即赋值给变量 `p`。使用后续语句显示变量\
  \ `p` 的内容。声明 `*(int *)` 告诉编译器赋值的值是整数类型。因此执行了 `float` 和 `char` 类型的赋值。语句 `*(int *)\
  \ pt = 12`、`*(float *)pt=5.4` 和 `*(char*) pt='S'` 帮助编译器精确确定数据类型的大小。\n\n##### 9.6\
  \ 野指针 (WILD POINTERS)\n\n指针用于存储内存地址。不恰当使用指针会导致程序产生许多错误。因此，应该谨慎处理指针。当指针指向一个未分配的内存位置或内存已释放的数据值时，这种指针被称为野指针。野指针会产生垃圾内存位置和依赖性引用。指针由于以下原因变成野指针：\n\
  \n1. 指针已声明但未初始化\n2. 指针交替\n3. 访问已销毁的数据\n\n当指针被声明且未初始化时，它持有一个未经定义的地址。操纵此类指针非常困难。\n\
  \n![img](img/aero.png) 9.12 编写一个程序显示野指针及其输出。\n\n```\nvoid main()\n{\n    int k,*x;\n\
  \    /*clrscr();*/\n    for(k=0;k<=3;k++)\n    printf(“%u”,x[k]);\n}\n```\n\n**OUTPUT:**\n\
  7272 24330 30559 27753\n\n**Explanation:**\n在此程序中，指针 `x` 未初始化。显示了连续的位置。\n\n1. 在指针中忘记分配新的内存位置被称为指针交替（pointer\
  \ alternation）。这发生在野指针访问另一个野指针的位置时。野指针将合法指针转换为野指针。\n2. 有时指针会尝试访问已经没有寿命的数据。\n\n#####\
  \ 9.7 常量指针 (CONSTANT POINTERS)\n\n常量指针的地址不能被修改。\n\n```\nchar* const str=\"Constant\"\
  ;\n```\n\n在上面的示例中，无法修改指针 `str` 的地址。以下操作将产生错误信息：\n\n```\nstr='san' /* 不能修改常量对象 */\n\
  ++str /* 不能修改常量对象 */\n```\n\n如果常量指针指向的是一个变量，我们可以更改实际变量的值，但不能通过常量指针来更改。以下是有效和无效的操作：\n\
  \n```\nk=5 /* 可能 */\n*pm=5 /* 无效 */\npm++ /* 可能 */\n*pm++ /* 无效 */\n*pm=5 /* 无效\
  \ */\n```\n\n![img](img/aero.png) 9.13 编写一个程序声明常量指针并修改其值。\n\n```\nvoid main()\n\
  {\n    int k=10;\n    int const *pm=&k;\n    clrscr();\n    k=40;\n    /* *pm=50;\
  \ 无效操作 */\n    printf：“k=%d”,k);\n}\n```\n\n**OUTPUT:**\nk=40\n\n**Explanation:**\n\
  在上面的程序中，变量 `k` 是整数，`pm` 是相同类型的常量指针。不能通过指针 `pm`  `k` 的值，因为 `pm` 是常量指针。值只能通过自身更改。任何实体都不允许修改。\n\
  \n##### 9.8 指针的算术运算 (ARITHMETIC OPERATIONS WITH POINTERS)\n\n对指针变量进行算术运算。对指针变量进行算术运算是可能的。递增、递减、前置和后置操作可以使用指针进行。指针的大小由它所指向的数据类型决定。例如，如果指针指向\
  \ `int`，递增它将移动一个 `int` 大。\n\n![img](img/aero.png) 9.1 编写一个程序显示对指针变量进行算术运算的效果。\n\n\
  ```\nvoid main()\n{\n    int p;\n    float d;\n    char c;\n    void *pt = &p;\n\
  \    clrscr();\n    *(int *) pt = 12;\n    printf(“\\n p= %d”,p);\n    pt=&d;\n\
  \    *(float *)pt = 5.4;\n    printf(“\\n r=%g”,d);\n    pt=&c;\n    *(char*)pt='S’;\n\
  \    printf(“\\n c=%c”,c);\n}\n```\n\n**OUTPUT:**\np=12\nr=5.4\nc=s\n\n**Explanation:**\n\
  在上面的示例中，`p`、`d` 和 `c` 分别是 `int`、`float` 和 `char` 类型的变量。指针 `pt` 是 `void` 类型的指针。这些变量在\
  \ `main()` 之前声明。指针用整数变量 `p` 的地址初始化，即指针 `pt` 指向变量 `p`。语句 `*(int *) pt = 12` 将整数值\
  \ `12` 赋值给指针 `pt`，即赋值给变量 `p`。使用后续语句显示变量 `p` 的内容。声明 `*(int *)` 告诉编译器赋值的值是整数类型。因此执行了\
  \ `float` 和 `char` 类型的赋值。\n\n\n\n2. 第二个 `printf()` 语句的前缀递增是通过指针变量 `ii` 完成的；因此在打印之前对其进行了递增。因此，指针是一个整数类型，而整数在内存中需要两个字节。因此，`*i*=4062`\
  \ 的地址是。\n\n3. 第三个 `printf()` 语句与第二个相反。在这里，首先打印地址值，然后对其递增。因此，它打印 `*i*=4062`，在打印后递增的地址变为\
  \ 4064。\n\n4. 在第四个 `printf()` 语句中，首先对 `*i*` 的地址进行递减，然后打印。因此，`i` 的地址是 4062。\n\n5.\
  \ 在第五个 `printf()` 语句中，首先打印 `*i*` 的地址，然后进行递减。递减后 i 的地址变为 4060。\n\n6. 最后一个 `printf()`\
  \ 语句打印 `i` 的初始地址。\n\n![img](img/aero.png) 9.16 编写一个程序使用指针执行不同的算术操作。\n\n```\nvoid\
  \ main()\n{\nint a=25,b=10,*p,*j;\np=&a;\nj=&b;\nclrscr();\nprintf(\"\\n Addition\
  \ a+b = %d\", *p+b);\nprintf(\"\\n Subtraction a−b = %d\", *p-b);\nprintf(\"\\n\
  \ Product a*b = %d\", *p**j);\nprintf(\"\\n Division a/b = %d\", *p / *j);\nprintf(\"\
  \\n a Mod b = %d\", *p % *j);\n}\n```\n\n**OUTPUT:**\nAddition a+b = 35\nSubtraction\
  \ a−b = 15\nProduct a*b = 250\nDivision a/b = 2\na mod b = 5\n\n***Explanation:***\n\
  \n在指针上可以执行各种算术操作，如加法、减法、乘法、除法和取模。在这里，操作考虑的是地址处存储的值，而不是地址本身。对地址进行算术操作是不可能的。例如，两个地址位置是不可能相加的。上述程序执行的各种算术操作详细说明如下：\n\
  \n1. 加法：可以将一个数字加到指针，也可以通过指针对两个变量相加。在第一个 `printf()` 语句中，通过指针 `p` 将 `*b*` 的值加到 `*a*`。加法的结果是\
  \ 35。\n\n2. 减法：可以从指针中减去一个数字。也可以通过指针对两个变量相减。在第二个 `printf()` 语句中，通过指针 `p` 从 `*a*`\
  \ 中减去 `*b*`。减法的结果是 15。\n\n3. 乘法：可以对两个指针相乘，也可以将一个数字与指针变量相乘。在第三个 `printf()` 语句中，通过它们的指针\
  \ `*p*` 和 `*j*` 对变量 `*a*` 和 `*b*` 进行乘法。\n\n同样，可以执行上述程序所示。请注意，以下对地址的操作是不可能的：\n\n\
  1. 两个地址（指针）的相加\n2. 地址的乘法或地址与常数的乘法\n3. 地址与常数的除法\n\n![img](img/aero.png) 9.17 编写一个程序比较两个指针。显示消息“两个指针具有相同的地址”或“两个指针的地址不同”。\n\
  \n```\nvoid main()\n{\nint a=2,*j,*k;\nj=&a;\nk=&a;\nclrscr();\nif(j==k)\nprintf(\"\
  \\n The Two Pointers have the same address.\");\nelse\nprintf(\"\\n The Pointers\
  \ have the different address.\");\nprintf(\"\\n Address of a(j)=%u\",j);\nprintf(\"\
  \\n Address of a(k)=%u\",k);\n}\n```\n\n**OUTPUT:**\nThe Two Pointers have the same\
  \ address. Address of a(j)= 4056\nAddress of a(k)= 4056\n\n***Explanation:***\n\n\
  上述程序执行了两个指针之间的比较。在进行比较时，指针变量应该是相同的数据类型。指针的比较可以测试任一地址是否相同。在这里，此程序中指针 `*j*` 和 `*k*`\
  \ 是整数数据类型，并且指向同一个整数变量 `*a*`。因此，它们包含相同的地址。\n\n##### 9.9 指针与数组\n\n1. 数组名本身就是一个地址或指针。它指向第一个元素（数组的第\
