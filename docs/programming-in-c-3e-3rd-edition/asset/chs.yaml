  \ 9.11 指针与多维数组\n\n数组是存储多个值的连续内存块，元素一个接一个存储。数组名本身是一个指针（地址），存储数组的第一个值。通过递增数组名存储后续值。在这个多维数组中，其元素的地址也是连续存储的。通过下面的程序可以观察到相同的效果。\n\
  \n通常，二维数组可以用以下方式表示：\n`data-type name_of_array[row_size][col_size]`\n示例：`int a[2][2];`\n\
  \n使用指针法的二维数组如下：\n`data_type (*name_of_array)[col_size]`\n示例：`int (*a)[2];`\n\n这表示一个二维指针\
  \ `*a`，每行包含两个元素。`*a` 指数组的前两个元素，即 `a[2]` 的第一行。同样，`(a+1)` 指向包含两个元素的第二行。在二维数组中，第 `i`\
  \ 行第 `j` 列的值通过以下表达式获得：`*(*(a+i)+j)`\n\n以下是关于指针和多维数组的示例。\n\n![img](img/aero.png)\
  \ 9.28 显示三维数组元素相加的程序。\n\n```c\n#include <stdio.h>\n#include <conio.h>\nvoid main()\n\
  {\nint a[2][2][2]={1,2,3,4,5,6,7,8};\nint i,j,k,b[2][2][2]={1,2,3,4,5,6,7,8};\n\
  int c[2][2][2];\nclrscr();\nprintf(“\\n Addition of Three Dimensional arrays as:”);\
  \ for(i=0;i<2;i++)\n{\n  for(j=0;j<2;j++)\n  {\n    for(k=0;k<2;k++)\n    {\n  \
  \    *(*(c+i)+j)+k)=*(*(a+i)+j)+k)+*(*(b+i)+j)+k;\n    }\n  }\n}\nfor(i=0;i<2;i++)\n\
  {\n  for(j=0;j<2;j++)\n  {\n    for(k=0;k<2;k++)\n    {\n      printf(“%d”,*(*(c+i)+j)+k));\n\
  \    }\n  }\n}\ngetch();\n}\n```\n\n**OUTPUT:**\n\nAddition of Three Dimensional\
  \ arrays as follows: 2 4 6 8 10 12 14 16\n\n![img](img/aero.png) 9.29 显示多维数组地址并计算其元素之和的程序。\n\
  \n```c\nint main()\n{\nint a[2][2][2]={1,2,3,4,5,6,7,8},i,j,k,sum=0;\nclrscr();\n\
  printf(“Addresses of elements of an array are as follows:\\n”);\nfor(i=0;i<2;i++)\n\
  for(j=0;j<2;j++)\n  for(k=0;k<2;k++)\n  {\n    printf(“%u ”,&a[i][j][k]);\n    sum=sum+*(*(*(a+i)+j)+k);\n\
  \  }\nprintf(“\\n Sum of all the elements of array = %d”,sum);\nreturn 0;\n}\n```\n\
  \n\n\n\n通过指针（数组名）引用第一个元素，可以很容易地识别多维数组的其他元素。逐个访问连续的元素，并将其累加到求和变量中。上述程序完成了数组中所有元素的相加。\n\
  \n##### 9.12 指针数组 (ARRAY OF POINTERS)\n\n到目前为止，我们学习了不同标准数据类型的数组，如 `int`、`float`、`char`。同样地，“C”语言也支持指针数组。它无非是一组地址的集合。在这里，我们存储那些需要声明为指针数组的变量的地址。\n\
  \n![img](img/aero.png) 9.30 写一个程序，使用指针数组存储数组中不同元素的地址。\n\n```c\nvoid main()\n{\n\
  int *arrp[3];\nint arr[3]={5,10,15},k;\nfor(k=0;k<3;k++)\narrp[k]=arr+k;\nclrscr();\n\
  printf(“\\n\\tAddress Element\\n”);\nfor(k=0;k<3;k++)\n{\n  printf(“\\t%u”,arrp[k]);\n\
  \  printf(“\\t%d \\n”,*(arrp[k]));\n}\n}\n```\n\n**输出：**\n\n| 地址 | 元素 |\n| :---\
  \ | :--- |\n| 4060 | 5 |\n| 4062 | 10 |\n| 4064 | 15 |\n\n**解释：**\n\n在上述程序中，`arrp[3]`\
  \ 被声明为指针数组。通过第一个 `for` 循环，将数组 `arr[]` 各种元素的地址赋值给 `*arrp[]`。第二个 `for` 循环从 `*arrp[]`\
  \ 获取地址并显示该位置处的值。在这里，`*arrp[]` 的每个元素都指向数组 `arr[]` 相应的元素（参见 表 9.2）。\n\n**表 9.2** 内存中的指针数组\n\
  \n![image](img/page361_1.png)\n\n![img](img/aero.png) 9.31 写一个程序，显示元素的地址和指针。\n\n\
  ```c\nvoid main()\n{\nint a[5]={0,1,2,3,4};\nint *p[5],i;\nfor(i=0;i<5;i++)\np[i]=a+i;\n\
  clrscr();\nfor(i=0;i<5;i++)\n{\n  printf(“\\n\\t%d at location”,*(*p+i));\n  printf(“\\\
  t%u at location”,*(p+i));\n  printf(“%u”,p+i);\n}\nprintf(“\\n\\n Integer requires\
