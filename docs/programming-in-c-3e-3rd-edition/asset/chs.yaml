  \n##### 10.9 带运算符的函数\n\n下面的程序说明了运算符与函数的用法。\n\n1. **赋值运算符 (=)：** 该运算符的作用是给变量赋一个值。要给函数的返回值赋值，使用以下语法：\n\
  \   *语法：*\n   `x=sqr(2);`\n   其中 `*x` 是一个变量，`sqr()` 是一个用户定义的函数。`sqr()` 函数返回的值赋值给变量\
  \ `*x`。\n\n![img](img/aero.png) 10.23 编写一个将函数的返回值赋值给另一个变量的程序。\n\n```c\nvoid main()\n\
  \n{\n\nint input(int);\n\nint x;\n\nclrscr();\n\nx=input(x);\n\nprintf(“\\nx=%d”,x);\n\
  \n}\n\nint input(int k)\n\n{\n\nprintf(“\\nEnter Value of x =”);\n\nscanf(“%d”,&k);\n\
  \nreturn(k);\n\n}\n```\n\n**OUTPUT:**\nEnter Value of x = 5\nx = 5\n\n2. **加法和减法\
  \ (+ & −)：** 编写一个程序用函数的返回值对数字进行加减运算。\n   *语法：*\n   `x=(1−fun()+1);`\n   其中 `*x`\
  \ 是一个整数，`fun()` 是一个用户定义的函数。\n\n```c\n# include <math.h>\n\nvoid main()\n\n{\n\n\
  int input(int);\n\nint sqr(int);\n\nint x;\n\nclrscr();\n\nx=sqr(1−input(x)+1);\n\
  \nprintf(“\\nSquare = %d”,x);\n\n}\n```\n\n\n\n\n\n```c\nscanf(\"%d\",&k);\nreturn(k);\n\
  }\n\nint sqr(int m)\n{\n    return(pow(m,2));\n}\n```\n\n**输出:**\n输入 x 的值 = 5\n\
  平方 = 9\n\n**解释：**\n在上面的程序中定义了两个自定义函数。`input()` 函数通过键盘读取数字。`sqr()` 函数计算该数字的平方。`input()`\
  \ 函数是 `sqr()` 函数的参数。\n\n`input()` 返回的值被减了 2。虽然我们只使用了一次‘−’运算符；但构建的方程是 `1−5+1`。数字\
  \ 5 是 `input()` 的返回值。减法执行了两次。因此，1 被减了两次，`sqr()` 函数接收到的数字是 `-3` 而不是 5。因此，`-3` 的平方是\
  \ 9。\n\n### 3. 乘法和除法运算符 (& / /): \n\n![img](img/aero.png) 10.25 编写一个程序来执行数字的乘法和除法，并返回函数的返回值。\n\
  \n```c\n#include <math.h>\n\nvoid main()\n{\n    int input(int);\n    int sqr(int);\n\
  \    int x;\n    clrscr();\n    x=sqr(5*input(x)/2);\n    printf(\"\\nSquare = %d\"\
  ,x);\n}\n\nint input(int k)\n{\n    printf(\"\\nEnter Value of x =\");\n    scanf(\"\
  %d\",&k);\n    return(k);\n}\n\nint sqr(int m)\n{\n    return(pow(m,2));\n}\n```\n\
  \n**输出:**\n输入 x 的值 = 5\n平方 = 144\n\n**解释：**\n上面的程序与上一个相同。执行的是乘法和除法操作，而不是加法和减法操作。\n\
  \n### 4. 增和自减运算符 (++ & −−): 这些运算符的作用是增加或减少变量的值。在这里，它们与函数的返回值执行相同的工作。\n\n*语法：*\n\
  `x=fun1(++(y=(fun2 (x))));`\n其中 `x` 和 `y` 是整数，`fun1()` 和 `fun2()` 是函数。\n\n考虑以下示例。\n\
  \n![img](img/aero.png) 10.26 编写一个程序，使用 (++) 运算符配合函数的返回值。\n\n```c\n#include <math.h>\n\
  \nvoid main()\n{\n    int input(int);\n    int sqr(int);\n    int x,y=0;\n    clrscr();\n\
  \    x=sqr(++(y=(input(x))));\n    printf(\"\\n Square = %d\",x);\n}\n\nint input(int\
  \ k)\n{\n    printf(\"\\n Enter Value of x =\");\n    scanf(\"%d\",&k);\n    return(k);\n\
  }\n\nint sqr(int m)\n{\n    return(pow(m,2));\n}\n```\n\n**输出:**\n输入 x 的值 = 7\n\
  平方 = 64\n\n**解释：**\n在上面的示例中，`input()` 函数的返回值首先被增加，然后传递给函数 `sqr()`。`sqr()` 函数给出增加后值的平方。我们不能直接对函数应用这些运算符（`++`\
  \ 和 `−`）。我们使用了一个额外的变量 `y`。返回值被收集在变量 `y` 中，然后对 `y` 进行增加。\n\n**注意：** 自减（`−−`）运算符的工作方式相同。它会减少值。\n\
