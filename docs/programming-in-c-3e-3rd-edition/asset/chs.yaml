  \ C 语言中最有趣且实用的主题之一。本章的目标是探索图形相关信息。在处处，信息都以图片的形式传递，这需要对计算机图形有理解。换句话说，可以通过图形实现视觉展示。我们可以使用计算机图形绘制各种形状的图形。可以使用计算机图形绘制各种形状的直线、圆、椭圆、矩形和三角形。此外，如今我们处理主要使用图形的动画和多媒体。介绍本章的目的是使用\
  \ C 语言方便地与图形交互。通过示例解释了图形的基本概念。在本章中，还将简要介绍计算机图形。\n\n视频显示器（VDU）是计算机系统最有用的输出组件之一。视频显示系统包含以下组件：\n\
  \n1. 视频屏幕，可以在其中显示文本和图像。\n2. 视频显示适配卡，插入到主板提供的扩展插槽之一。\n\n显示适配器允许程序员以不同的分辨率在屏幕上显示各种图形和文本。分辨率由屏幕上可用像素（小点）的数量决定。显示分辨率是从顶部到底部行数与每条扫描线从左到右的像素数的组合。分辨率越高，图像越清晰。像素数量越多，图像越清晰。常用的显示适配器有视频显示适配器、彩色图形适配器和超视频图形适配器。所有这些适配器都可以在文本和图形模式下运行。VGA、SVGA\
  \ 等图像清晰度和质量优于 CGA 和单色适配器。\n\n显示适配器充当处理器和显示器之间的中介。显示适配器分为两个部分：(i) VDU 内存和 (ii) 将\
  \ VDU 内存内容传递到屏幕的电路。微处理器将信息写入 VDU 内存。显示适配器将处理器写入的信息传输到屏幕。VDU 内存的每一个地址都对应于显示器屏幕的特定位置。\n\
  \n##### 15.2 图形初始化\n\n程序开头需要包含头文件 `graphics.h`。该头文件包含了所有图形函数的定义和解释。本章中描述的函数定义在 `graphics.h`\
  \ 文件中，每个图形程序应该包含该文件。\n\n要切换到图形模式，必须调用函数 `initgraph()`。它会选择最佳分辨率并将对应的数值放入 `gm` 中，其中\
  \ `gm` 是图形模式。\n\n##### 15.3 常用图形函数\n\n1. `initgraph();`\n此函数初始化图形系统。原型定义在 ‘graphics.h’中。声明如下：\n\
  ```c\nvoid far initgraph(int far *gd,int far *gm,char far *pathtodriver);\n```\n\
  其中 `gd` 是图形驱动程序，`gm` 是图形模式。\n在实际应用中，使用 `DETECT` 宏来检测图形驱动。\n\n2. `closegraph();`\n\
  此函数关闭图形系统。声明如下。原型定义在 ‘graphics.h’中。\n```c\nvoid far closegraph(void);\n```\n\n3.\
  \ `restorecrtmode();`\n此函数将屏幕模式恢复到 initgraph 之前的设置。原型定义在 ‘graphics.h’中。\n```c\n\
  void far restorecrtmode(void);\n```\n\n4. `graphresult();`\n此函数返回上次失败图形操作的错误代码。该函数定义如下：\n\
  ```c\nint far graphresult(void);\n```\n它返回报告错误的上次图形执行的错误代码，并将错误级别重置为 `grOK`，其中 `grOK`\
  \ 是枚举错误代码。\n\n5. `getmaxx();` 和 `getmaxy();`\n`getmaxx()` 返回最大的 `x` 屏幕坐标，`getmaxy()`\
  \ 返回最大的 `y` 屏幕坐标。原型定义在 ‘graphics.h’中。这些函数可以声明如下：\n```c\nint far getmaxx(void);\n\
  int far getmaxy(void);\n```\n\n6. `line();`\n在两个指定点之间画一条线。该函数声明如下：\n```c\nvoid far\
  \ line(int x1, int y1, int x2, int y2);\n```\n使用当前的颜色、线型和厚度从 `(x1, y1)` 到 `(x2,\
  \ y2)` 绘制一条线。\n\n7. `circle();`\n此函数在给定半径的 `(x, y)` 处画一个圆。该函数声明如下：\n```c\nvoid far\
  \ circle(int x, int y, int radius);\n```\n\n8. `arc();`\n此函数画一条弧。该函数声明如下：\n```c\n\
  void far arc(int x, int y, int sa, int ea, int r);\n```\n其中 `(x, y)` 是中心点。变量 `sa`\
  \ 和 `ea` 是以度为单位的起始和结束角度，变量 `r` 是半径。\n\n9. `ellipse();`\n此函数画一个椭圆。该函数声明如下：\n```c\n\
  void far ellipse(int x, int y, int sa, int ea, int xr, int yr);\n```\n其中 `(x, y)`\
  \ 是中心点。变量 `sa` 和 `ea` 分别是以度为单位的起始和结束角度。变量 `xr` 和 `yr` 是水平和垂直半径。\n\n10. `bar();`\n\
  此函数使用给定坐标画矩形。可以声明如下：\n```c\nvoid far bar(int left, int top, int right, int bottom);\n\
  ```\n\n11. `setcolor();`\n此函数设置当前的绘制颜色。声明如下：\n```c\nvoid far setcolor(int color);\n\
  ```\n\n12. `outtextxy();`\n在指定位置（图形模式）显示字符串。该函数声明如下：\n```c\nvoid far outtextxy(int\
  \ x, int y, char far *text);\n```\n\n13. `settextstyle();`\n此函数设置当前的文本属性。该函数声明如下：\n\
  ```c\nvoid far settextstyle(int font, int direction, int fontsize);\n```\n\n14.\
  \ `settextjustify();`\n此函数设置图形模式的文本对齐方式。该函数声明如下：\n```c\nvoid far settextjustify(int\
  \ horiz, int vert);\n```\n它影响 `outtext()` 函数的文本输出。文本进行水平和垂直对齐。\n\n15. `getcolor();`\n\
  它返回当前的绘制颜色。该函数声明如下：\n```c\nvoid far getcolor(void);\n```\n\n##### 15.4 使用库函数的程序\n\
  \n1. `arc();`\n此函数用于画弧。需要五个参数。语法如下：\n```c\narc(int x, int y, int a, int b, int c);\n\
