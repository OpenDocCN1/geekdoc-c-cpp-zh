  \nMeasure of unused memory = 56936\n\n***Explanation:***\n\n在上述程序中，调用了函数 `coreleft()`\
  \ 但没有传递任何参数。该函数显示未使用的内存，即 56936。\n\n# ## 16.4 列表 (LIST)\n\n列表是元素的顺序排列。程序员可以在列表中添加、删除或搜索单个元素。创建列表有两种技术。列表是通过使用数组或链表创建的。\n\
  \n第一种方法是取取一个数组并存储元素。数组有许多缺点。从数组中删除元素或向数组中插入元素需要很多操作。列表中所需的元素数量可能多于或少于数组声明的尺寸。可以在数组上执行删除、插入、搜索元素等操作。\n\
  \n使用数组实现的列表称为静态列表（static list）。列表是一系列具有相同数据类型的线性排列的数字。列表可以是基本数据类型，也可以是自定义数据类型。元素一个接一个定位，其位置编号按顺序出现。列表的第一个元素称为\
  \ `HEAD`，最后一个元素称为 `TAIL`。\n\n请参考图 16.2，其中值为 1 的元素位于 `HEAD` 位置（第 0 个），元素 2 位于 `TAIL`\
  \ 位置（第 5 个）。元素 5 是元素 8 的*前驱*，4 是*后继*。除了第一个元素外，每个元素都可以作为*后继*，因为它是列表的首元素。列表具有以下属性：\n\
  \n![image](img/page621_1.png)\n\n**图 16.2** 列表的元素\n\n1. 列表可以从末尾扩大或缩小。\n2. 列表的 `TAIL`（结束）位置取决于用户扩展列表长度。\n\
  3. 可以在列表上执行遍历、插入和删除等各种操作。\n4. 可以实现静态（数组）或动态（指针）列表。\n\n# ## 16.5 列表的遍历 (TRAVERSAL\
  \ OF A LIST)\n\n可以使用数组创建简单的列表。在其中，元素存储在连续的内存位置中。考虑以下程序。\n\n![image](img/aero.png)\
  \ 16.8 编写一个程序创建一个元素的简单列表。按原始顺序和反序显示列表。\n\n```c\nvoid main()\n{\n    int arr[5],j;\n\
  \    clrscr();\n    printf(\"\\nEnter five integers : \");\n    for(j=0;j<5;j++)\n\
  \        scanf(\"%d\",&arr[j]);\n    printf(\"\\n Elements of List are: \");\n \
  \   for(j=0;j<5;j++)\n        printf(\" %d \",arr[j]);\n    printf(\"\\n Elements\
  \ of List in reverse :\");\n    for(j=4;j>=0;j--)\n        printf(\" %d\",arr[j]);\n\
  }\n```\n\n**OUTPUT:**\n\nEnter five integers : 4 5 6 7 8\nElements of List are:\
  \ 4 5 6 7 8\nElements of List in reverse : 8 7 6 5 4\n\n***Explanation:***\n\n使用数组简单声明可以实现列表。使用\
  \ `for` 循环和 `scanf()` 语句输入五个整数。可以使用 `printf()` 语句显示列表。一旦创建了列表，就可以应用排序、搜索等各种操作。建议用户查看章节***数据结构：数组***以获取关于数组的更多信息。\n\
  \n# ## 16.6 元素的搜索与检索 (SEARCHING AND RETRIEVING AN ELEMENT)\n\n一旦创建了列表，我们就可以访问并对元素进行操作。在列表中，所有元素都显示。可以指定某些条件，如在特定数字后显示列表、删除列表或合并列表等。如果列表包含特定元素，则很难找到特定的元素或后继。考虑以下程序来搜索特定元素。\n\
  \n![image](img/aero.png) 16.9 编写一个程序创建一个元素的简单列表。搜索列表中的元素。\n\n```c\nvoid main()\n\
  {\n    int arr[5],j;\n    clrscr();\n    printf(\"\\nEnter five integers : \");\n\
  \    for(j=0;j<5;j++)\n        scanf(\"%d\",&arr[j]);\n    printf(\"\\n Elements\
  \ of List are: \");\n    for(j=0;j<5;j++)\n        printf(\" %d \",arr[j]);\n  \
  \  printf(\"\\n Elements of List in reverse :\");\n    for(j=4;j>=0;j--)\n     \
  \   printf(\" %d\",arr[j]);\n}\n```\n\n**OUTPUT:**\n\nEnter five integers : 4 5\
  \ 6 7 8\nElements of List are: 4 5 6 7 8\nElements of List in reverse : 8 7 6 5\
  \ 4\n\n***Explanation:***\n\n使用数组简单声明可以实现列表。使用 `for` 循环和 `scanf()` 语句输入五个整数。可以使用\
  \ `printf()` 语句显示列表。一旦创建了列表，就可以应用排序、搜索等各种操作。建议用户查看章节***数据结构：数组***以获取关于数组的更多信息。\n\
  \n# ## 16.7 前驱与后继 (PREDECESSOR AND SUCCESSOR)\n\n在列表中任何位置 `n` 的 `n-1` 是前驱，`n+1`\
  \ 是后继。也就是说，列表中的元素具有前驱和后继。第一个元素没有前驱，最后一个元素没有后继。16.3 显示元素的前驱和后继。\n\n![image](img/page623_1.png)\n\
  \n**图 16.3** 前驱与后继\n\n以下程序显示元素的前驱和后继。\n\n![image](img/aero.png) 10 编写一个程序找到元素的前驱和后继。\n\
  \n```c\nvoid main()\n{\n    int num[8],j,n,k=0,f=0;\n    clrscr();\n    printf(\"\
  \\n eight elements : \");\n    for(j=0;j<8;j++)\n        scanf(\"%d\",&num[j]);\n\
  \    printf(\"\\nEnter an element : \");\n    scanf(\"%d\",&n);\n    for(j=0;j<8;j++)\n\
  \    {\n        if(num[j]==n)\n        {\n            f=1;\n            if(j>0)\n\
  \                printf(\"\\n Predecessor of %d is %d \", n,num[j-1]);\n       \
  \     if(j<7)\n                printf(\"\\n Successor of %d is %d \", n,num[j+1]);\n\
  \            break;\n        }\n    }\n    if(f==0)\n        printf(\"\\n Element\
  \ not found ! \");\n}\n```\n\n**OUTPUT:**\n\neight elements : 1 2 5 4 6 7 8 9\n\
  Enter an element : 5\nPredecessor of 5 is 2\nSuccessor of 5 is 4\n\n***Explanation:***\n\
  \n在此程序中，输入了八个元素。用户必须输入一个元素以确定其前驱和后继。数组中的所有元素都经过了检查。当找到匹配项时，显示其前驱和后继。第一个元素没有前驱，最后一个没有后继。上述条件使用条件运算符\
  \ `?:` 进行检查。\n\n# ## 16.8 插入 (INSERTION)\n\n追加是添加新元素的过程。然而，也可以在列表中进行插入。插入意味着在两个元素之间添加元素。插入可以在列表的开头、中间或任何地方进行。\n\
  \n为了成功插入元素，数组列表应至少有一个空位置。如果数组已满，则无法插入。要插入元素的位置通过向下移动元素来空出来，并将新插入的元素放置在该位置。考虑图 16.4。\n\
  \n![image](img/page624_1.png)\n\n(a)\n\n如上所示，有两个空位。假设我们要在 7 和 9 之间插入 3。7 之后的所有元素必须向数组末尾移动。结果数组将为\n\
  \n![image](img/page624_2.png)\n\n(b)\n\n可以将输入的数字 3 分配给该内存位置，数组将所示。图 16.4 描述了元素的插入。\n\
  \n![image](img/page624_3.png)\n\n(c)\n\n**图 16.4** 插入\n\n\n\n\n\n![image](img/aero.png)\
  \ 16.11 编写一个程序创建一个列表并在指定位置插入某些元素。\n\n```c\n# include <process.h>\n\nvoid main()\n\
  {\n  int num[8]={0},j,k=0,p,n;\n  clrscr();\n  printf(“\\n Enter elements ( 0 to\
  \ exit ) : ” );\n  for(j=0;j<8;j++)\n  {\n    scanf(“%d”,&num[j]);\n    if( num[j]==0)\n\
  \    break;\n  }\n  if(j<8)\n  {\n    printf(“\\n Enter Position number and element\
  \ : ”);\n    scanf(“%d %d”,&p,&n);\n    --p;\n  }\n  else\n  while(num[ k]!=0)\n\
  \    k++;\n  k--;\n  for(j=k;j>=p;j--)\n    num[ j+1]=num[j];\n  num[p]=n;\n  for(j=0;j<8;j++)\n\
  \    printf (“ %d ”, num[ j]);\n}\n```\n\n**输出:**\nEnter elements (0 to exit) :\
  \ 1 2 3 4 5 6 0\nEnter Position number and element: 5 10\n1 2 3 4 10 5 6 0\n\n***说明：***\n\
  在上述程序中，声明了一个数组 `num[8]`。用户必须连续输入元素。用户可以输入 0 来退出连续输入程序。如果输入了 0，`break` 语句将控制权从 `for`\
  \ 循环。因此，列表包含几个空内存位置，这足够执行插入操作。当用户输入八个元素时，程序结束。在这种情况下，由于缺少空间，无法进行插入操作。\n\n程序会提示要插入元素的位置号。在用户输入这些值后，使用\
  \ `while` 循环确定第一个空闲位置的位置。从用户指定的位置号开始，后续所有连续元素都向数组的下方移动一个内存位置。通过移动一个内存单元，产生了空间，并将输入的元素放置在该位置上。\n\
  \n读者可以对列表执行其他操作，如删除元素、元素排序和合并两个列表。\n\n##### 16.9 链表\n\n链表是用指针实现的。这种方法被称为动态实现，因为对列表执行的上述描述的所有操作都可以在不复杂的情况下实现。通过应用递增操作，可以访问内存中连续位置的指针，并在该位置存储一个元素。因此，元素序列可以持续到任意数量的元素。程序员必须保留存储第一个元素的指针的起始地址。以这种方式，可以查看或更改这些数字。这里有一个简单的示例。\n\
  \n#### 单链表\n在此类链表中，链表的两个连续节点以顺序线性方式相互链接，图 16.5](#Chapter016.xhtml_img-018) 描述了单链表。它像一列火车，其中两个连续的车厢连接在一起。火车是单链表的例子。\n\
  \n![image](img/page626_1.png)\n\n**图 16.5** *单链表*\n\n链表是一种动态数据结构，能够根据程序要求扩展和收缩。与其他结构相比，单链表是一种简单且直接的数据结构。通过改变链接位置，可以形成其他类型的链表，如循环链表、双向链表。创建链表时，结构定义如下：\n\
  \n```c\nstruct node\n{\n  int number;\n  struct node *p;\n};\n```\n\n上述结构用于实现链表。在其中，`number,`\
  \ 变量存储了输入的数字。第二个成员是指向相同结构的指针。指针 `p` 指向相同的结构。在这里，尽管 `struct node` 的声明尚未完成，但编译器允许同相同结构类型的指针声明。然而，不允许进行变量声明。这是因为指针在本质上是动态的，而变量是通过早期绑定形成的。在\
  \ `struct` 内部对对象的声明会导致非常复杂的数据结构的准备。这种概念被称为对象组合，其详细讨论超出了本书的范围。\n\n我们熟悉数组，并且知道基地址的重要性。一旦获取了基地址，就可以访问随后的连续元素。在链表中，也可以带或不带\
  \ `header node`（头节点）来创建一个列表。`head` 持有起始地址。\n\n![image](img/aero.png) 16.12 编写一个程序创建一个简单的链表。\n\
  \n```c\nstruct list\n{\n  int n;\n  struct list *p;\n};\n\nvoid main()\n{\n  struct\
  \ list item0,item1, item2;\n  item2.n=3;\n  item2.p=NULL;\n  item1.n=5;\n  item1.p=&item2.n;\n\
  \  item0.n=7;\n  item0.p=&item1.n;\n  clrscr();\n  printf(“\\n Linked list elements\
  \ are :”);\n  printf (“ %d ”,item0.n);\n  printf (“ %d ”,*item0.p);\n  printf (“\
  \ %d ”,*item1.p);\n}\n```\n\n**输出:**\nLinked list elements are : 7 5 3\n\n***说明：***\n\
  在上述程序中，`number,` 变量存储输入的数字。第二个成员是指向相同结构的指针。指针 `p` 指向相同的结构。在这里，尽管 `struct node` 的声明尚未完成，但编译器允许同相同结构类型的指针声明。然而，不允许进行变量声明。这是因为指针在本质上是动态的，而变量是通过早期绑定形成的。在\
  \ `struct` 内部对对象的声明会导致非常复杂的数据结构的准备。这种概念被称为对象组合，其详细讨论超出了本书的范围。\n\n##### 16.10 有无头节点的链表\n\
  #### 带头节点的链表\n使用以下步骤创建：\n1. `header` 和 `rear` 被声明。`header` 初始化为 `NULL`。这种列表是空的。\n\
  2. 在第二步中，为第一个节点分配内存。`header` 被分配给第一个节点。\n3. `header` 和 `rear` 指向第一个。\n4. 再次创建一个内存位置，假设是连续的\
  \ 1890。\n5. 通过赋值 `rear->next` 连接元素，移动 `rear` 指针到最后一个节点。\n\n#### 不带头节点的链表\n使用以下步骤创建：\n\
  1. `first` 和 `rear` 被声明。`first` 初始化为 `NULL`。\n2. 在第二步中，为第一个节点分配内存。`first` 被分配给第一个节点。\n\
  3. `first` 和 `rear` 指向第一个。\n4. 再次创建一个内存位置，假设是连续的 1890。\n5. 通过赋值 `rear->next` 连接元素，移动\
  \ `rear` 指针到最后一个节点。\n\n```c\n# include <malloc.h>\n\nstruct num\n{\n  int num;\n\
  \  struct num *next;\n}\n*header,*first,*rear;\n\nvoid main()\n{\n  void form(void);\n\
  \  form();\n  clrscr();\n  printf(“\\n Linked list elements are :”);\n  while (header!=NULL)\n\
  \  {\n    printf (“ %d ”,header->num);\n    header=header->next;\n  }\n}\n\nvoid\
  \ form(void)\n{\n  struct num *node;\n  printf(“\\n Enter number : ”);\n  if(header==NULL)\n\
  \  {\n    first=(struct num*)malloc(size of(struct num));\n    scanf(“%d”,&first->num);\n\
  \    first->next=header;\n    header=first;\n    rear=first;\n  }\n  while(1)\n\
  \  {\n    node=(struct num*) malloc(sizeof(struct num));\n    scanf(“%d”,&node->num);\n\
  \    if(node->num==0) break;\n    node->next=NULL;\n    rear->next=node;\n    rear=node;\n\
  \  }\n}\n```\n\n\n\n上述程序是一个带头部的链表示例。在结构定义之后，声明了三个结构指针 `header`、`*first` 和 `*rear`。由于它们被声明为全局变量，因此初始值都为\
  \ `NULL`。`form` 函数用于创建链表节点。在 `form()` 函数内部，定义了另一个结构指针 `*node`，其作用域仅限于该函数。创建第一个节点和后续连续节点的步骤是不同的。`if()`\
  \ 语句检查 `header` 的值。`header` 的值为 `NULL`。`malloc()` 函数为指针 `first` 分配内存，并将输入的数字存储在节点的变量\
  \ `num` 中。在同一个 `if()` 块中，指针的 `header` 和 `rear` 都被赋值为 `first` 的值。一旦创建了第一个节点，下一次执行就不再需要进入\
  \ `if()` 块。`while` 循环持续迭代，并通过为指针 `node` 分配内存来创建后续节点。考虑以下语句：\n\n1. `node->next=NULL;`\n\
  上述语句将 `NULL` 赋值给当前节点的 `next` 指针。如果用户不再需要创建更多节点，链表可以在此处结束。\n\n2. `rear->next=node;`\n\
  `rear` 指针跟踪最后一个节点，当前节点（`node`）的地址被赋值给上一个节点的 `link` 字段。\n\n3. `rear=node;`\n在创建下一个节点之前，将上一个节点的地址赋值给指针\
  \ `*rear`，它用于语句 (2)。在 `main()` 函数中，使用 `while` 循环显示链表的元素。\n\n#### 头节点 (Header)\n\
  指针 `*header` 在链表的形成过程中非常有用。第一个节点的地址（1888）存储在指针 `*header` 中。在 `header` 变为 `NULL`\
  \ 之前，它的值保持不变。指针 `*header` 只能确定链表的起始位置。\n\n```c\nwhile(header!=NULL)\n{\n    printf(“\
  \ %d ” ,header->num);\n    header=header->next;\n}\n```\n\n我们可以对链表执行不同的操作，具体如下：\n\
  \n#### 1. 遍历（链表遍历\n![image](img/page630_1.png)\n**图 16.9** *链表*\n\n在上述链表中，数据是结构的信息部分（参见图\
  \ 16.9）。链接是下一个元素的地址。`BEGIN` 是第一个元素的地址。我们声明 `P` 为一个指针变量。首先 `*p` 指向 `BEGIN` 的地址，指向链表的第一个元素。为了访问下一个元素，我们将下一个元素的地址赋给\
  \ `P`：\n\n```c\np=p->LINK\n```\n\n现在，`P` 拥有了下一个元素的地址。我们可以遍历整个链表，直到 `P` 变为 `NULL`\
  \ 地址为止。\n\n#### 2. 搜索（链表搜索）\n搜索是指在链表中查找元素。为了搜索某个元素，我们首先**遍历**链表，在遍历过程中，我们将每个元素的\
  \ `data` 部分与给定的元素进行比较。\n\n#### 3. 插入（链表插入）\n向链表中插入元素有两种方法（参见图 16.10）：\n\n1. 在头部插入\n\
  2. 在中间插入\n\n![image](img/page630_2.png)\n**图 16.10** *在链表头部插入元素*\n\n`*P` 是 `BEGIN`\
  \ 的地址。为了在 `P` 的头部地址插入，将 `P` 赋给 `link` 部分。\n\n![image](img/page631_1.png)\n**图 16.11**\
  \ *在链表中间插入元素*\n\n我们首先**遍历**链表找到节点。之后插入元素。要在特定节点之后插入元素，我们将插入节点的地址赋给前一个节点的 `link`\
  \ 部分（参见图 16.11）。\n\n#### (a) 删除（链表删除）\n![image](img/page631_2.png)\n**图 16.12**\
  \ *删除链表头部元素*\n\n从链表中删除节点，我们首先**遍历**链表并比较每个元素（参见图 16.12）。如果该元素是第一个元素，我们将节点的 `link`\
  \ 部分赋给 `pt`。这里，`pt` 是另一个指向 `BEGIN` 地址的指针。\n\n```c\npt=p-> LINK\n```\n\n如果元素不是第一个元素，我们将被删除节点的\
  \ `link` 部分赋给前一个节点的 `link` 部分（参见图 16.13）。\n\n![image](img/page631_3.png)\n**图 16.13**\
  \ *删除链表中间元素*\n\n![image](img/aero.png) 16.14 编写一个程序创建链表。添加、删除和插入链元素。显示并统计链表的元素。\n\
  \n```c\n#include <alloc.h>\n\nstruct node\n{\n    int data;\n    struct node *next;\n\
