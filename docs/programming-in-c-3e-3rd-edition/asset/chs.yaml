  printf(\"\\n May\");\nbreak;\ncase June :\nprintf(\"\\n June\");\nbreak;\ncase July\
  \ :\nprintf(\"\\n July\");\nbreak;\ncase Aug :\nprintf(\"\\n August\");\nbreak;\n\
  case Sep :\nprintf(\"\\n September\");\nbreak;\ncase Oct :\nprintf(\"\\n October\"\
  );\nbreak;\ncase Nov :\nprintf(\"\\n November\");\nbreak;\ncase Dec :\nprintf(\"\
