  \n程序应该支持这些数据类型以获取所需的信息。程序是一组语句，按顺序形式执行特定的任务。\n\n##### 2.2 字符集\n\n字符是单词、句子或段落的一部分。根据需要可以使用不同的字符创建单词、表达式和语句。这取决于运行程序的计算机。\n\
