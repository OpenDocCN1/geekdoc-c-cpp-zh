  \    test=0;\n    break;\n  }\n  i++;\n  j--;\n}\nif(test==1)\nprintf(“Word is palindrome.\\\
  n”);\nelse\nprintf(“\\n Word is not Palindrome.\\n”);\n}\n```\n\n\n\n\n在上面的程序中，输入一个字符串用于测试是否为“回文”。字符串的长度被计算并赋值给变量\
  \ `j`。`j` 的值比原始字符串长度减一，因为数组元素是从零（0）开始数的。\n\n`while` 循环内部的 `if` 语句检查字符串第一个和最后一个字符是否相等。计数变量\
  \ `i` 和 `j` 分别表示第一个和最后一个字符。为了获取两端的连续字符，变量 `i` 递增而 `j` 递减。只要匹配成功，变量 `test` 置为 1 循环继续，否则\
  \ `test` 置为 0（0）并通过 `break` 语句终止循环。\n\n![image](img/aero.png) 8.47  编写一个程序，使用 `strcmp()`\
