  \ 解释\n\n此程序以日历形式打印给定年份（2015 年）某月份的天数。这将在不借助系统资源的情况下完成。月份号由用户输入。该号被传递给第一个 `switch`\
  \ 结构。该结构以数字形式找到该月份的第一天以及该月份包含的天数。这些值分别赋值给 `a` 和 `j`。在这里，周日到周一分别对应 1 到 7 的值。`printf()`\
  \ 函数和第二个 `switch` 结构以列列的方式打印日期。变量 `i`、`b` 初始化为 1。\n\n第二个 `switch` 结构定义了起始列并打印 `i`\
  \ 的值（该值始终为 1）。`h` 的值（8 减去 `a`）决定了第一行要打印的天数。此任务由第一个 `for` 循环完成。在第二个 `for` 循环中，`h`\
  \ 加 1，循环持续到天数，即 `j`。为了按行拆分日期，`if` 语句将变量 `b` 的值与 8 进行比较。如果 `b=8` 则换行且 `b` 重新初始化为\
  \ 1。每当 `b=8` 时，换行并将月份的所有日期以日历形式排列。\n\n![image](img/aero.png)\n\n### 5.23 编写一个程序将十进制转换为十六进制数。\n\
  \n```c\n# include <process.>\n\nvoid main()\n\n{\n\nint x,y=30,z;\n\nclrscr();\n\
  \nprintf(“\\nEnter a number :”);\n\nscanf(“%d”,&x);\n\nprintf(“\\n Conversion of\
  \ Decimal to Hexadecimal Number \\n”);\n\nfor( ;; )\n{\n   if(x==0)\n   exit(1);\n\
  \   z=x%16;\n   x=x/16;\n   gotoxy(y--,5);\n   switch(z)\n   {\n      case 10 :\n\
  \      printf(“A”);\n      break;\n      case 11 :\n      printf(“%c”,‘B’);\n  \
  \    break;\n      case 12 :\n      printf(“%c”,“C”);\n      break;\n      case\
  \ 13 :\n      printf(“D”);\n      break;\n      case 14 :\n      printf(“E”);\n\
  \      break;\n      case 15 :\n      printf(“F”);\n      break;\n      default\
  \ :\n      printf(“%d”,z);\n   }\n}\n}\n```\n\n**输出：**\n\nEnter a number : 31\n\
  Conversion of Decimal to Hexadecimal Number\n1F\n\n### 解释\n\n在上述程序中，使用了无限 `for`\
  \ 循环。在 `for` 循环中，使用 `switch case` 语句打印字母 A 到 F。如果输入的数字在 1 到 9 之间，将显示相同的数字。但如果得到的余数大于\
  \ 9，则在 `for` 循环中将执行相应的 `case` 语句来显示十六进制符号 A 到 F。\n\n##### 5.10 嵌套 switch case\n\n\
  C 语言支持嵌套 `switch` 语句。内部的 `switch` 可以是外部 `switch` 的一部分。内部和外部的 `switch case` 常数可以是相同的。即使相同也不会产生冲突。下面给出了嵌套\
  \ `switch` 语句的几个示例。\n\n![image](img/aero.png)\n\n### 5.24 编写一个程序检测输入的数字是偶数还是奇数。使用嵌套\
  \ switch case 语句。\n\n```c\nvoid main()\n\n{\nint x,y;\n\nclrscr();\n\nprintf(“\\\
  n Enter a Number :”);\n\nscanf(“%d”,&x);\n\nswitch(x);\n{\n   case 0 :\n   printf(“\\\
  n Number is Even.”);\n   break;\n   case 1 :\n   printf(“\\n Number is Odd .”);\n\
  \   break;\n   default :\n   y=x%2;\n   switch(y)\n   {\n      case 0:\n      printf(“\\\
  n Number is Even.”);\n      break;\n      default :\n      printf(“\\n Number is\
  \ Odd.”);\n   }\n}\ngetche();\n}\n```\n\n**输出：**\n\nEnter a Number : 5\nNumber is\
  \ Odd.\n\n### 解释\n\n在上述程序中，第一个 `switch` 语句用于在输入数字为 0 和 1 时显示偶数或奇数的消息。当输入的数字不是 0\
  \ 或 1 时，使用取模运算符计算余数并存储在变量 `y` 中。变量 `y` 用于内部 `switch` 语句。如果余数为 `0`，则消息将为 `Number\
  \ Even`，否则对于非零则为 `Number Odd`。在这里，用于内部和外部 `switch` 语句的常数是相同的。\n\n![image](img/aero.png)\n\
