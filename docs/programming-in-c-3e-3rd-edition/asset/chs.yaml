  \ 语句\n\n`switch...case` 语句同样程序运行时做出决策。它有多个选择。`switch()` 需要一个参数，其体包含了各种类似于分支的 `case`\
  \ 语句。根据 `switch` 参数的值，匹配的 `case` 语句将被执行。带函数和不带函数的 `switch` 语法请见 表 10.7。\n\n### 语法：\n\
  \n### 表 10.7 函数和 switch() 语句\n\n| 不带函数 | 有函数 |\n| --- | --- |\n| `switch(x)` | `switch(b())`\
  \ |\n| `{` | `{` |\n| case 1: | case 1: |\n| ----- | ----- |\n| `break;` | `break;`\
  \ |\n| case 2: | case 2: |\n| ------ | ------ |\n| `break;` | `break;` |\n| default:\
  \ | default: |\n| `}` | `}` |\n| 其中 ‘x’ 是任意数据类型的参数。 | 其中 `b()` 是一个函数 |\n\n![img](img/aero.png)\
