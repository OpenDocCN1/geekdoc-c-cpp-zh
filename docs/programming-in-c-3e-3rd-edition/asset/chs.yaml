  \ node *q,int num)\n{\n    if(q==NULL)\n    {\n        p=(struct node *)malloc(struct\
  \ node));\n        p->data=num;\n        p->next=NULL;\n    }\n    else\n    {\n\
  \        while(q->next!=NULL)\n            q=q->next;\n        q->next=(struct node\
