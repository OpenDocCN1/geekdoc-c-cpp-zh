  \ . 答案为 90 |\n\n## 第 3 章：运算符与表达式\n\n**章节大纲**\n* 3.1 引言\n* 3.2 优先级\n* 3.3 结合性\n*\
  \ 3.4 逗号与条件运算符\n* 3.5 算术运算符\n* 3.6 关系运算符\n* 3.7 赋值运算符与表达式\n* 3.8 逻辑运算符\n* 3.9 位运算符\n\
  \n##### 3.1 引言\n\n在日常生活中，我们使用不同的运算符对数据进行许多操作。为了执行不同类型的操作，C 使用不同的运算符。运算符指示对数据执行的操作并产生新值。通过在\
  \ C 中使用各种运算符，可以将变量和常量连接起来。C 提供了四类运算符：(i) 算术、（ii) 关系、（iii) 逻辑和 (iv) 位。除了这些基本运算符外，C\
  \ 还支持额外的运算符。基本运算符及其符号表示所示表 3.1。\n\n**表 3.1 运算符类型**\n\n| 运算符类型 | 符号表示 |\n| --- |\
  \ --- |\n| 算术运算符 | `+`、`−`、`*`、`/` 和 `%` |\n| 关系运算符 | `>`, `<`, `>=`, `<=` 和 `!=`\
  \ |\n| 逻辑运算符 | `&&`、`||` 和 `!` |\n| 递增和递减运算符 | `++` 和 `--` |\n| 赋值运算符 | `=`、`*=`、`/=`、`%=`、`+=`、`-=`、`&=`、`^=`、`|=`、`<<=`、`>>=`\
  \ |\n| 位运算符 | `&`、`|`、`^`、`>>`、`<<` |\n| 逗号运算符 | `,` |\n| 条件运算符 | `?:` |\n\n#####\
  \ 3.2 优先级\n\n优先级意味着顺序。C 中的每个运算符都有分配优先级。表达式可能包含很多运算符。操作根据运算符的优先级执行。优先级较高的运算符先求值，然后是优先级较低的。\n\
  \n1. 例如，在算术运算符中，`*`、`/` 和 `%` 被分配了最高优先级且优先级相似。与上述运算符相比，`+` 和 `−` 的优先级最低。\n\n**示例：**\n\
  `8+9*2−10`\n\n运算符 `*` 优先级最高。因此，首先执行乘法操作。上述表达式变为\n`8+18−10`\n\n在上述表达式中，`+` 和 `−`\
  \ 的优先级相同。在这种情况下，首先计算最左侧的操作。这使得上述表达式变为\n`26−10`\n\n最后执行减法操作，表达式的答案如下：\n16\n\n2. 当在表达式中找到优先级相同的运算符时，优先考虑左侧的运算符。\n\
  \n**示例：**\n![image](img/page60_1.png)\n\n在这里，`5*4` 先求值，尽管 `*` 和 `/` 的优先级相同。运算符 `*`\
  \ 出现在 `/` 之前，因此计算从左侧开始。上述方程在求值后的答案为 24。\n\n\n\n\n3.  如果表达式中的括号数量较多，将先计算最内层的括号，然后是第二层，最后是最外层的括号。\n\
  \n***示例：***\n\n![image](img/page60_2.png)\n\n在这里，\n\n1. 首先计算最内层括号（即 `2*2=4`）。\n\
  2. 接着计算第二层内层括号。`2` 与最内层括号的结果相乘。结果为 `2*4=8`。\n3. 最后计算最外层的括号表达式。`8` 除以 `8` 得到结果 `1`。\n\
  \n***示例：***\n\n显示以下等式的求值步骤。\n\n![image](img/page60_3.png)\n\n上述等式的执行过程是不言自明的。\n\n\
  提供以下程序以帮助理解运算符优先级的概念。\n\n![image](img/aero.png) 3.1 编写一个程序来演示运算符的优先级。\n\n```c\n\
  # include <stdio.h>\n# include <conio.h>\n\nmain ()\n{\nint a=1,b=2,c=3,j;\nclrscr();\n\
  j=a+b*c;\nprintf (“\\n j=%d”,j);\nj=(a+b)*c;\nprintf (“\\n j=%d”,j);\n}\n```\n\n\
  **输出：**\n\nj=7\nj=9\n\n***解释：***\n\n在此程序中，在表达式 `j = a + b * c` 中，首先执行乘法，然后执行加法；因此，`j`\
  \ 的值为 7。在第二个表达式中，括号赋予了加法更高的优先级。因此，先执行 `a` 和 `b` 的加法，然后执行乘法。\n\n根据优先级（层次）列出的运算符见表\
  \ 3.2\n\n**表 3.2** 运算符优先级优先级列表*\n\n![image](img/page61_1.png)\n\n##### 3.3 结合性 (ASSOCIATIVITY)\n\
  \n当一个表达式包含优先级相同的运算符时，结合性属性决定了先执行哪种操作。结合性意味着执行的方向。结合性有两种类型。\n\n1. **从左到右：** 在这种类型中，表达式的求值从左到右方向开始。\n\
  \n***示例：***\n\n`12 * 4 / 8 % 2`\n\n在上面的表达式中，所有运算符的优先级相同，因此遵循结合性规则（即执行方向为从左到右）。\n\
  \n`= 48 / 8 % 2`\n`= 6 % 2`\n`= 0` （上述取模运算提供了余数 0）\n\n2. **从右到左：** 在这种类型中，表达式的求值从右到左方向开始。\n\
  \n***示例：***\n\n`a=b=c`\n\n在上面的示例中，使用了赋值运算符。`c` 的值被赋值给 `b`，然后赋值给 `a`。因此，求值是从右到左。\n\
  \n##### 3.4 逗号运算符和条件运算符\n\n1. **逗号运算符 (,)：** 逗号运算符用于分隔两个或多个表达式。逗号运算符在所有运算符中优先级最低。在括号内使用逗号运算符包含表达式并非是所必须的。例如，以下语句是有效的。\n\
  \n***示例：**\n\n`a=2,b=4,c=a+b;`\n`(a=2,b=4,c=a+b;)`\n\n![image](img/aero.png) 3.2\
  \ 编写一个程序来演示逗号（,)运算符的使用。\n\n```c\nvoid main()\n{\nclrscr();\nprintf(“Addition = %d\\\
  nSubtraction = %d”,2+3,5−4);\n}\n```\n\n**输出：**\n\nAddition = 5\nSubtraction = 1\n\
  \n***解释：***\n\n在此程序中，逗号运算符用于分隔多个表达式。\n\n2. **条件运算符 (?)：** 条件运算符也称为三元运算符，因为它包含三个参数。如果条件为真，则执行表达式\
  \ 1；否则执行表达式 2。条件运算符的语法如下：\n\n***语法：***\n\n`Condition ? expression1 : expression2;`\n\
  \n条件运算符包含两个表达式。以下程序演示了条件运算符的使用。\n\n![image](img/aero.png) 3.3 编写一个程序来演示条件运算符。\n\n\
  ```c\nvoid main()\n{\nclrscr();\nprintf(“Result = %d”,2==3 ? 4 : 5);\n}\n```\n\n\
  **输出：**\n\nResult = 5\n\n***解释：***\n\n在上述程序中，`2==3` 为假。因此，输出 5。\n\n##### 3.5 算术运算符\
  \ (ARITHMETIC OPERATORS)\n\n算术运算符有两种类型。这些是 (i) 二元运算符 (ii) 一元运算符。\n\n如图 3.1 所示，定义了一元和二元运算符。\n\
  \n![image](img/page64_1.png)\n\n**图 3.1** 运算符*\n\n1. **二元运算符：** 表 3.3 显示需要两个操作数的运算符。它们称为二元运算符。C\
  \ 执行算术运算如下：\n\n- 先执行除法、乘法和余数运算。当一个表达式包含乘法、除法和余数运算时，求值从左到右。乘法、除法和余数的优先级相同。\n- 加法和减法运算在除法、乘法和余数运算之后执行。表\
  \ 3.3 中，取模运算符不能应用于浮点型和双精度型。\n\n**表 3.3** 算术运算符*\n\n| *算术运算符* | *解释* | *示例* |\n|\
  \ --- | --- | --- |\n| + | 加法 | 2+2=4 |\n| − | 减法 | 5−3=2 |\n| * | 乘法 | 2*5=10 |\n\
  | / | 除法 | 10/2=5 |\n| % | 取模 | 11%3=2 (余数 2) |\n\n2. **一元运算符：** 需要一个操作数的运算符被称为一元运算符。一元运算符包括递增(++)递减(--−)\
  \ 和负号(−)。这些运算符及其描述见表 3.4。\n\n**表 3.4** 一元算术运算符*\n\n| *运算符* | *描述或操作* |\n| --- |\
  \ --- |\n| − | 负号 |\n| ++ | 递增 |\n| −− | 递减 |\n| & | 地址运算符 |\n| sizeof | 给出运算符的大小\
  \ |\n\n1. **负号 (−)：** 一元负号用于指示或改变数值的代数符号。\n\n***示例：***\n\n`int x=−50;`\n`int y=−x;`\n\
  \n通过 x 将 −50 赋值给 x，将 −50 赋值给 y。这种方式使用的负号(−) 被称为一元运算符，因为它只需要一个操作数。\n\n\n\n\n#####\
  \ 2. 递增 (++) 和 递减 (−−) 运算符\n\nC 编译器为递增和递减操作产生非常快速且高效的目标代码。这段代码比使用等效赋值语句生成的代码更好。因此，应尽可能使用递增和递减运算符。\n\
  \n`++` 运算符对其操作数加 1，而 `−−` 运算符则从其操作数中减 1。为了证明，`x=x+1` 可以写成 `x++;`，而 `x=x−1;` 可以写成\
  \ `x--;`。这两个运算符都可以出现在操作数之后，也可以出现在之前。也就是说 `x=x+1;` 可以表示为 `x++;` 或 `++x;`。\n\n如果 `++`\
  \ 或 `−−` 作为变量名的后缀使用，则将执行后递增/递减操作。请考虑以下示例来理解作为变量后缀的 `++` 运算符。\n\n```c\nx=20;\ny=10;\n\
  z=x*y++;\n```\n\n在上述方程中，`y` 的当前值用于乘法。结果为 200，赋值给 `z`。乘法之后，`y` 的值加 1。\n\n如果 `++`\
  \ 或 `−−` 作为变量名前缀使用，则将执行前递增/递减操作。请考虑以下示例来理解作为变量前缀的 `++` 运算符。\n\n```c\nx=20;\ny=10;\n\
  z=x*++y;\n```\n\n在上述方程中，`y` 的值先加 1 然后进行乘法。结果为 220，赋值给 `z`。可以执行以下程序来验证递增和递减操作。\n\n\
  ![image](img/aero.png) 3.5 写一个程序显示递增运算符作为后缀的效果。\n\n```c\nvoid main()\n{\n    int\
  \ a,z,x=10,y=20;\n    clrscr();\n    z=x*y++;\n    a=x*y;\n    printf(“\\n%d %d”,z,a);\n\
  }\n```\n\n**输出：**\n200 210\n\n**解释：**\n在上述程序中，方程 `z=x*y++` 结果为 200，因为 `y` 没有被递增。乘法之后，`y`\
  \ 递增到 21。第二个方程给出结果，即 210。可以通过执行上述程序进行验证。\n\n![image](img/aero.png) 3.6 写一个程序显示递增运算符作为前缀的效果。\n\
  \n```c\nvoid main()\n{\n    int a,z,x=10,y=20;\n    clrscr();\n    z=x*++y;\n  \
  \  a=x*y;\n    printf(“\\n%d %d”,z,a);\n}\n```\n\n**输出：**\n210 210\n\n**解释：**\n\
  在上述程序中，`y` 先递增然后求解方程。在这里，两个方程给出了相同的结果，即 210。\n\n##### 3. sizeof 和 ‘&’ 运算符\n\n`sizeof`\
  \ 运算符给出变量所占的字节数，即在内存中存储该值所需的字节数。所占字节数根据数据类型的不同而异。\n\n`&` 运算符打印变量在内存中的地址。下面的示例说明了这些运算符的使用。\n\
  \n![image](img/aero.png) 3.7 写一个程序使用 ‘&` 和 `sizeof` 运算符并确定整数和浮点变量的大小。\n\n```c\n\
  void main()\n{\n    int x=2;\n    float y=2;\n    clrscr();\n    printf(“\\n sizeof(x)=%d\
  \ bytes”,sizeof(x));\n    printf(“\\n sizeof(y)=%d bytes”,sizeof(y));\n    printf(“\\\
  n Address of x=%u and y=%u”,&x,&y);\n}\n```\n\n**输出：**\nsizeof(x)=2\nsizeof(y)=4\n\
  Address of x=4066 and y=25096\n\n**解释：**\n在上述示例中，声明并初始化了变量 `x` 和 `y`。变量 `x` 是整数，`y`\
  \ 是浮点数类型。使用 `sizeof()` 和 `&` 运算符可以显示它们的大小和地址。\n\n##### 3.6 关系运算符\n\n这些运算符用于根据它们之间的关系区分两个值。这些运算符提供了两个表达式之间的关系。如果关系为真，则返回值\
  \ 1，否则返回 0 表示假。关系运算符及其描述、示例和返回值在表 3.5 中。\n\n**表 3.5 关系运算符**\n\n![image](img/page68_1.png)\n\
  \n关系运算符的符号很容易理解。它们是自解释其明的。然而，为了读者的方便，下面展示了一个程序。\n\n![image](img/aero.png) 3.8 写一个程序使用各种关系运算符并显示它们的返回值。\n\
  \n```c\nvoid main()\n{\n    clrscr();\n    printf(“\\nCondition : Return Values\\\
  n” );\n    printf(“\\n10!=10 : %5d”,10!=10);\n    printf(“\\n10==10 : %5d”,10==10);\n\
  \    printf(“\\n10>=10 : %5d”,10>=10);\n    printf(“\\n10<=10 : %5d”,10<=10);\n\
  \    printf(“\\n10>10 : %5d”,10>10);\n    printf(“\\n10<10 : %5d”,10<10);\n}\n```\n\
  *(注：原文文本在示例块中缺少 printf 行，已根据关系运算符的上下文重构了标准逻辑)*\n\n**输出：**\n| 条件 : 返回值 |\n10!=10\
  \ : 0\n10==10 : 1\n10>=10 : 1\n10<=10 : 1\n10>10 : 0\n10<10 : 0 |\n\n**解释：**\n在上述程序中，使用\
  \ `a` 的值来检查条件。如果条件为真，则返回 1，否则返回 0 表示假。这是关系运算符的行为。\n\n##### 3.7 赋值运算符和表达式\n\n给变量赋值是简单的。例如，`int\
  \ x=5;` 这里 5 被赋值给 `x`。赋值运算符在表 3.6 中。\n\n**表 3.6 赋值运算符**\n\n![image](img/page69_1.png)\n\
  \n赋值运算符用于给变量赋值。赋值运算符需要两个操作数。例如，`k+=3;` 等于 `k=k+3;`。\n\n```c\nk=5;\nk+=3; // k 变为\
  \ 8\nk-=2; // k 变为 6\nk*=2; // k 变为 12\nk/=3; // k 变为 4\n```\n\n##### 3.8 条件运算符\n\
  \n条件运算符用于根据条件确定值。它也被称为三元运算符。它的语法为：`condition ? expression_if_true : expression_if_false`。\n\
  \n![image](img/aero.png) 3.9 写一个程序使用条件运算符确定 ‘b’ 的。\n\n```c\nvoid main()\n{\n   \
  \ int a,b;\n    clrscr();\n    printf(“Enter Any Integer above 5 or below 5 :−”);\n\
  \    scanf(“%d”, &a);\n    b=(a>5 ? 3 : 4);\n    printf(“Calculated Value of b is\
  \ :− %d”,b);\n}\n```\n\n**输出：**\nEnter Any Integer above 5 or below 5 :-6\nCalculated\
  \ Value of b is :-3\n\n**解释：**\n在执行上述程序时，如果 `a` 的值大于 5，则 `b` 的值为 3；否则，对于小于 5 的任何数字，它为\
  \ 4。\n\n##### 3.10 使用条件语句确定 ‘b’ 的值\n\n```c\nvoid main()\n{\n    int a,b;\n    clrscr();\n\
  \    printf(“Enter Any Integer whose value is 5 or any other:−”);\n    scanf(“%d”,\
  \ &a);\n    b=(a==5 ? 3: 4);\n    printf(“Calculated Value of b is :− %d\\n”,b);\n\
  }\n```\n\n**输出：**\nEnter Any Integer whose value is 5 or any other:-3\nCalculated\
  \ Value of b is :-4\n\n**解释：**\n在上述给定程序中，输入了变量 `a` 的值。该值与 5 进行比较。如果 a 等于 5，则将 3\
  \ 赋值给 b，否则为 4。在这个示例中，输入了 3，它不等于五。因此，4 被赋值给 b。\n\n##### 3.11 写一个读取三个变量 x, y 和 z 的程序\n\
  \n```c\nvoid main()\n{\n    int x,y,z,a,b,c,m,n;\n    clrscr();\n    printf(“Enter\
  \ Values of x, y, z :-”);\n}\n```\n\n\n\n\n\n```c\nscanf(“%d %d %d”, &x,&y,&z);\n\
  a=(x>=5 ? 3 : 4);\nprintf(“\\n Calculated value of a is :- %d”, a);\nb=(y<=8 ? 10\
  \ : 9);\nprintf(“\\n Calculated value of b is :- %d”, b);\nc=(z==10 ? 20 : 30);\n\
  printf(“\\n Calculated value of c is :- %d”, c);\nm=x+y+z;\nn=a+b+c;\nprintf(“\\\
  nAddition of x,y,z is %d (m)”, m);\nprintf(“\\nAddition of a,b,c is %d (n)”, n);\n\
  printf(“\\n%s”, m!=n ? “m & n NOT EQUAL” : “m & n ARE EQUAL”);\n}\n```\n\n**输出：**\n\
  输入 x, y, z 的值:- 5 2 7\n计算出的 a 值为:- 3\n计算出的 b 值为:- 10\n计算出的 c 值为:- 30\nx,y,z 的和为\
  \ 14 (m)\na,b,c 的和为 43 (n)\nm & n NOT EQUAL\n\n**解释：**\n在上述程序中，通过键盘输入三个整数（`x`、`y`\
  \ 和 `z`）。使用条件语句获取 `a`、`b` 和 `c` 的值。`x`、`y` 和 `z` 的和存储在 `m` 中，`a`、`b` 和 `c` 的和存储在\
  \ `n` 中。比较变量 `m` 和 `n` 并显示相应的消息。\n\n##### 3.8 逻辑运算符\n\n使用逻辑运算符测试两个表达式之间的逻辑关系。使用这些运算符可以将两个表达式连接起来。在检查条件后，它提供逻辑真(1)或假(0)状态。操作数可以是常量、变量和表达式。表\
  \ 3.7 描述了三个逻辑运算符以及示例及其返回值。\n\n**表 3.7 逻辑运算符**\n\n![image](img/page71_1.png)\n\n\
  根据表 3.7，逻辑运算符可以遵循以下规则：\n\n1. 逻辑与 (`&&`)运算符在两个表达式都为真时提供真结果，否则为 0。\n2. 逻辑或 (`||`)运算符在其中一个表达式为真时提供真结果，否则为\
  \ 0。\n3. 逻辑非运算符 (`!`) 如果条件为真，则提供 0，否则提供 1。\n\n![image](img/aero.png) 3.12 阐述逻辑运算符的使用。\n\
  \n```c\nvoid main()\n{\nclrscr();\nprintf(“\\nCondition : Return Values\\n” );\n\
  printf(“\\n5>3 && 5<10 : %5d”,5>3 && 5<10);\nprintf(“\\n 8>5 || 8<2 : %5d”,8>5 ||\
  \ 8<2);\nprintf(“\\n !(8==8) : %5d”,!(8==8));\n}\n```\n\n**输出：**\n条件 : 返回值\n5>3\
  \ && 5<10 : 1\n8>5 || 8<2 : 1\n!(8==8) : 0\n\n**解释：**\n在上述示例中，第一个和第二个条件都是真的。在第一个条件中，5\
  \ 大于 3 且小于 10；因此输出为 1。在第二个条件中，8 大于 5，由于或操作，其输出为 1。第三个条件是错误的。因此，返回的结果将是 0。\n\n![image](img/aero.png)\
  \ 3.13 写一个程序，如果输入字符是大写字母则打印逻辑 1，否则打印 0。\n\n```c\nvoid main()\n{\nchar x;\nint y;\n\
  clrscr();\nprintf(“\\nEnter a Character :”);\nscanf(“%c”, &x);\ny=(x>=65 && x<=90\
  \ ? 1 : 0);\nprintf(“Y :%d”,y);\n}\n```\n\n**输出：**\n输入一个字符： A\nY: 1\n输入一个字符： a\n\
  Y: 0\n\n**解释：**\n在上述程序中，输入了一个字符。使用逻辑运算符 AND 检查输入字符的 ASCII 值。如果它在 65 和 90 之间，显示的结果将是\
  \ 1，否则为 0。AND 运算符连接两个条件。如果条件为真，则将 1 赋值给 `y`，否则为 0。\n\n![image](img/aero.png) 3.14\
  \ 写一个程序，如果通过键盘读取字符则显示逻辑 0，否则显示 1。（0 到 9 的 ASCII 值值别为 48 到 57。）\n\n```c\nvoid main()\n\
  {\nint y;\nchar x;\nclrscr();\nprintf(“\\n Enter The Character or Integer :”);\n\
