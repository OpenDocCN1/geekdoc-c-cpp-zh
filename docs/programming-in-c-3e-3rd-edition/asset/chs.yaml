  \ %d symbol \", ch, Other);\n  }\n}\n```\n\n**OUTPUT:**\nEnter any character\n=\
  \ is type 2 symbol\n\n***Explanation:***\n在上述程序中，声明了 `enum` 数据类型 `ctype` 及其标识符 `letter`、`digit`\
  \ 和其他。通过键盘输入一个字符。宏 `isalpha()` 和 `isdigit()` 检查该字符是否为字母、数字或其他。根据输入的字符类型，显示相应的标识符。在输出中，输入了\
  \ `=`。它既不是字母也不是数字。因此，它属于其他类型，其枚举值为 `2`。因此，我们得到了输入字符的类型及其值。\n\n##### 13.11 union\n\
  \n联合体（Union）是一种变量，与结构体相似。它包含与结构体相同数量的成员，但它一次只存储一个对象。在结构体中，每个成员都有自己的内存位置，而联合体的成员具有相同的内存位置。它可以在单个存储区域中一次容纳一个成员。`union`\
  \ 也包含 `int`、`float`、`long`、`arrays`、`pointers` 等类型的成员。无论数据类型类型，它都会为访问数据类型分配固定特定的字节内存。\n\
  \n联合体所需的字节数等于最大成员所需的字节数。例如，如果联合体包含 `char`、整数和长整数，则内存中为联合体保留的字节数为 4 字节。为了方便理解，下面给出一个示例。\n\
  \n![img](img/aero.png) 13.28 编写一个程序查找联合体的大小以及为其预留的字节数。\n\n```c\nvoid main()\n{\n\
  \  union result\n  {\n    int marks;\n    char grade;\n  };\n  struct res\n  {\n\
  \    char name[15];\n    int age;\n    union result perf;\n  }\n  data;\n\n  clrscr();\n\
  \  printf(\"Size of union : %d\\n\", sizeof(data.perf));\n  printf(\"Size of Structure\
  \ : %d\\n\", sizeof(data));\n}\n```\n\n**OUTPUT:**\nSize of union : 2\nSize of Structure\
  \ : 19\n\n***Explanation:***\n联合体包含两个数据类型为 `int` 和 `char` 的变量。`int` 和 `char` 分别需要\
  \ 2 字节和 1 字节存储。根据理论，联合体预留了两个字节，因为 `int` 占据的空间比 `char` 数据类型大。\n\n结构体 `res` 在联合体之后定义，包含数据类型\
  \ `char`、`int` 和联合体变量。打印结构体的大小，这实际上是 15 字节 `char` 数组、2 字节 `int` 和 2 字节联合体变量 `perf`\
  \ 之和。因此，结构体的总大小为 19。\n\n### 13.12 调用 BIOS 和 DOS 服务\n\n我们可以通过 C 语言访问 BIOS 和 DOS 服务。通过使用\
  \ BIOS 和 DOS 服务展示了一些简单的示例。程序员无法直接访问 CPU 寄存器。然而，C 语言提供了一个接口，允许程序员访问任何 BIOS 或 DOS\
  \ 服务。C 语言在辅助 C 编译器的 `DOS.H` 文件定义了名为 `REGS` 的联合类型和名为 `SREGS` 的结构类型。这些数据类型用于将参数传递给\
  \ CPU 寄存器。为了访问这些定义，程序员必须包含 `dos.h` 头文件。\n\n联合类型 `REGS` 包含 CPU 寄存器。这些寄存器用于临时存储数据。微处理器\
  \ `8086`、`8088`、`80186`、`80286`...（根据逻辑截断文本）。\n\n![img](img/aero.png) 13.29 编写一个程序查找计算机的内存大小。\n\
  \n```c\n#include <dos.h>\n\n/* Finding Memory Size */\nvoid main()\n{\n  union REGS\
  \ in,out;\n  int86(18, &in, &out);\n  clrscr();\n  printf(\"\\n Total Memory = %d\
  \ KB\", out.ax);\n}\n```\n\n**OUTPUT:**\nTotal Memory = 640 KB\n\n***Explanation:***\n\
  在上述程序中，`in` 和 `out` 是 `REGS` 类型对象。在此例中，我们不需要向 ROM-BIOS 函数发送任何值。因此，在调用 `int86()`\
  \ 之前，无需向任何寄存器传递内容。这里，第一个参数 `18` 是中断号，后面跟着两个 `REGS` 的参数。在这里获得的结果是通过调用 `ax` 寄存器显示的内存大小。这里显示了\
  \ PC 的扩展内存。\n\n![img](img/aero.png) 13.30 编写一个程序在指定的光标位置显示系统时间。\n\n```c\n#include\
  \ <dos.h>\n\n/* Positioning Cursor on the console */\nvoid main()\n{\n  union REGS\
  \ in,out;\n  in.h.ah=2;\n  in.h.dh=20;\n  in.h.dl=15;\n  int86(16,&in,&out);\n \
  \ printf(\"%s\",--TIME--);\n}\n```\n\n**OUTPUT:**\n19:42:49\n\n***Explanation:***\n\
  在上述程序中，寄存器 `ah` 包含服务号，`dh` 包含行号，`dl` 包含列号。这里中断号为 `16`，配合两个联合体变量放在 `int86()` 函数中。因此，系统时间显示在指定位置。\n\
  \n\n\n\n\n![img](img/aero.png) 13.31 编写一个程序来更改不同尺寸的光标。\n\n```c\n# include <dos.h>\n\
  \n/* 光标大小 */\n\nvoid main()\n\n{\n  union REGS in,out;\n  in.h.ah=0x01;\n  in.h.ch=0;\n\
  \  in.h.cl=10;\n  int86(0x10,&in,&out);\n  getche()\n}\n```\n\n**解释：***\n\n在上述程序中，`0x01`\
  \ 是中断号 `0x10` 下的服务号。`CH` 寄存器包含起始扫描行，`CL` 包含结束扫描行。执行函数后，光标会被修改。程序员可以在运行程序后进行验证。\n\
  \n![img](img/aero.png) 13.32 编写一个程序使用 DOS 中断创建一个目录。\n\n```c\n# include <dos.h>\n\
  \nvoid main()\n\n{\n\n  union REGS in,out;\n  char dir[11];\n  clrscr();\n  puts(“\\\
  n Enter Directory Name : ”);\n  scanf(“%s”,dir);\n  in.x.dx=(int) &dir;\n  in.h.ah=0x39;\n\
  \  intdos(&in,&out);\n  if(out.x.cflag!=0)\n  printf(“Directory %s not created”,dir);\n\
  \  else\n  printf(“\\n Directory %s created”,dir);\n}\n```\n\n**输出：**\n\nEnter Directory\
  \ Name : XYZ\n\nDirectory XYZ created\n\n**解释：***\n\n程序提示输入要创建的目录名称。输入的名称存储在变量 `dir`\
  \ 中。`dir` 的地址赋值给寄存器 `DX`。现在，`DX` 寄存器指向目录名称。调用 DOS 服务号 `0x39` 创建目录。如果进位标志（carry flag）为零，则表示操作成功，否则会发生错误。屏幕上会显示相应的消息。\n\
  \n![img](img/aero.png) 13.33 编写一个程序在屏幕上显示指定的字符。\n\n```c\n# include <dos.h>\n\n/*\
  \ 显示指定的字符 */\n\nvoid main()\n\n{\n\n  union REGS in,out;\n  in.h.ah=02;\n  in.h.dl=67;\n\
  \  intdos(&in,&out);\n}\n```\n\n**输出：**\n\nC\n\n**解释：***\n\n在上述程序中，寄存器变量 `ah` 初始化为服务号\
