  A is stored at location 4056\n```\n\n***Explanation:***\n在上述程序中，输入字符串并将其传递给 `strrev()`\
  \ 函数。在执行函数时，给定字符串以反向顺序出现。`strrev()` 函数在物理上反转了字符的序列。第二个程序的输出显示了字符的序列及其位置。\n\n## strset()\
  \ 函数\n\n该函数将字符串的每个字符替换为程序员给出的符号，即字符串的元素被程序员给出的参数替换。该函数的语法为 `strset(char *string,char\
  \ symbol)`。\n\n![image](img/aero.png) 8.31 编写一个程序，用给定的符号替换（设置）给定字符串。使用 `strset()`\
  \ 函数。\n\n```c\n# include <string.h>\n\nvoid main()\n{\n    char string[15];\n  \
