  \ 6.7 BOHM AND JACOPIN’S THEORY \n结构化编程提供了简单性。Bohm 和 Jacopini 展示了以下形式的控制：\n1. 顺序\n\
  2. 选择\n3. 重复\n\n顺序意味着语句按顺序出现。在本章中，我们学习了如何使用 `if`、`if-else` 和 `switch` 语句来实现选择。\n\
  \n`goto` 语句可以跳转到程序的任何地方，但在结构化编程中不推荐使用。`for`、`while` 和 `do-while` 循环用于重复。在本章中，我们学习了如何嵌套这些循环。嵌套循环允许处理更复杂的逻辑。因此，结构化编程支持这种复杂性。\n\
