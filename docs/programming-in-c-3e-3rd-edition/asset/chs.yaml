  Integer requires 2 bytes, pointer require 2 bytes\n\n**解释：**\n\n在上述程序中，第一个 `for`\
  \ 循环将整数数组元素的地址分配给指针数组。第一个 `printf()` 语句打印元素，第二个显示元素的地址，第三个显示地址的地址（即指针的地址）。因此，从上面的示例可以清楚地看到整数需要两个字节，而指针也需要两个字节。\n\
  \n##### 9.13 指针的指针 (POINTERS TO POINTERS)\n\n指针被称为包含另一个变量地址的变量。指针变量本身也有地址。包含另一个指针变量地址的指针变量被称为指针的指针。这种链链可以一直持续到任意程度。下面的程序说明了指针的指针的概念。\n\
  \n![img](img/aero.png) 9.32 写一个程序，通过指针和指针的指针打印变量的值。\n\n```c\nvoid main()\n{\nint\
  \ a=2,*p,**q;\np=&a;\nq=&p;\nclrscr();\nprintf(“\\n Value of a=%d Address of a=%u”,a,&a);\n\
  printf(“\\n Through *p Value of a=%d Address of a=%u”,*p,p);\nprintf(“\\n Through\
  \ **q Value of a=%d Address of a=%d”,**q,*q);\n}\n```\n\n**输出：**\n\nValue of a=2\
  \ Address of a=4056\nThrough *p Value of a=2 Address of a=4056\nThrough **q Value\
  \ of a=2 Address of a=4056\n\n**解释：**\n\n在上述程序中，变量 `*p` 被声明为指针。变量 `*q` 被声明为指向另一个指针的指针。因此，它们分别被声明为\
  \ `**p` 和 `***q`（注：原文代码逻辑与描述有出，此处按原意翻译）。变量 `*a` 的地址被赋值给指针 `*p`。指针 `*p` 的地址赋值给 `*q`。变量\
  \ `*q` 包含指针的地址。因此，`*q` 是指针的指针。程序使用变量本身以及指针 `*p` 和 `*q` 显示变量 `*a` 的值和地址。表 9.3 展示了程序中不同变量的内容。\n\
