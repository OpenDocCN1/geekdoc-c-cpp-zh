  \ `a` 包含了 `a−b`。\n\n---\n\n##### I/O 函数\n\nC 有三种 I/O 类型：\n1. 字符 I/O\n2. 字符串 I/O\n\
  3. 文件 I/O\n\n`getchar()` - 该函数从标准输入读取字符直到用户按下回车键。语法为：\n\n```c\ngetchar();\n```\n\
  \n![img](img/aero.png) 4.19 写一个程序，使用 `getchar()` 接收字符。\n\n```c\nvoid main()\n{\n\
  \    char c;\n    clrscr();\n    printf(“Enter String :”);\n    c=getchar();\n \
  \   printf(“\\n % is %d\nc);\n}\n```\n\n**输出：**\n\nEnter String :\n\n\n\n***：\n\n\
  \n\n***\n\n在上述程序中，()`从从键盘读取字符并赋值给 `c`。`printf()` 语句显示了字符。\n\n`putchar()` - 该函数在屏幕上打印任何字符。语法为：\n\
  \n```c\nputchar(c);\n```\n\n![img](img/aero.png) 4.20 写一个程序，使用 `putchar()` 显示字符。\n\
  \n```c\nvoid main()\n{\n    char c;\n    clrscr();\n    c='C';\n    putchar(c);\n\
  }\n```\n\n**输出：**\n\nC\n\n***解释：***\n\n在上述程序中，`c` 被赋值为 ‘C’。`putchar()` 语句显示了字符。\n\
  \n`getch()` & `getche()` - 这些函数从标准输入读取字符。`getch()` 语法为：\n\n```c\ngetch();\n```\n\
  \n![img](img/aero.png) 4.21 写一个程序，显示 `getche()` 和 `getch()` 的效果。\n\n```c\nvoid main()\n\
  {\n    clrscr();\n    printf(“Enter any alphabetic”);\n    getche();\n    getch();\n\
  }\n```\n\n**输出：**\n\nEnter any alphabetic\n\n***解释：***\n\n在上述程序中，尽管输入了两个字符，但在屏幕上只能看到一个。`getch()`\
  \ 接收但不显示字符。\n\n`putch()` - 该函数打印标准输入设备获取的任何字符。语法为：\n\n```c\nputch(ch);\n```\n\n\
  ![img](img/aero.png) 4.22 写一个程序，使用 `getch()` 和 `putch()` 读取并显示字符。\n\n```c\nvoid\
  \ main()\n{\n    char ch;\n    clrscr();\n    printf(“Press any key to continue”);\n\
  \    ch=getch();\n    printf(“\\n You Pressed :”);\n    putch(ch);\n}\n```\n\n**输出：**\n\
  \nPress any key to continue\nYou Pressed : 9\n\n***解释：***\n\n`getch()` 函数读取按键并赋值给\
  \ `ch`。`putch()` 显示了按下的字符。\n\n##### 2. 字符串 I/O\n\n`gets()` - 该函数用于从 stdin（键盘）接受任何字符串直到按下回车键。实现上述函数需要\
  \ `stdio.h` 头文件。格式为：\n\n```c\nchar str[length of string in number];\ngets(str);\n\
  ```\n\n![img](img/aero.png) 4.23 写一个程序，使用 `gets()` 函数从键盘接受字符串。\n\n```c\nvoid main()\n\
  {\n    char ch[30];\n    clrscr();\n    printf(“Enter the String :”);\n    gets(ch);\n\
  \    printf(“\\n Entered String : %s”, ch);\n}\n```\n\n**输出：**\n\nEnter the String\
  \ : USE OF GETS()\nEntered String : USE OF GETS()\n\n***解释：***\n\n在上述程序中，`gets()`\
  \ 从键盘读取字符串并存储在字符数组 `ch[30]` 中。`printf()` 函数在控制台上显示该字符串。\n\n`puts()` - 该函数打印字符串或字符数组。它是\
  \ `gets()` 的相反。\n\n```c\nchar str[length of string in number];\ngets(str);\nputs(str);\n\
  ```\n\n\n\n\n\n![img](img/aero.png) 4.24 编写一个程序使用 `puts()` 函数打印接收到的字符。\n\n```c\n\
  void main()\n{\n    char ch[30];\n    clrscr();\n    printf(“Enter the String :”);\n\
  \    gets(ch);\n    puts(“Entered String :”);\n    puts(ch);\n}\n```\n\n**输出:**\n\
  Enter the String: puts is in use.\nEntered String:\nputs is in use.\n\n**解释：**\n\
  此程序与上一个相同。在这里使用了 `puts()` 函数来显示字符串。\n\n### 3. `cgets()` :\n此函数从控制台读取字符串。语法如下。\n\n\
  **语法：**\n```c\ncgets(char *st);\n```\n它需要一个字符指针作为参数。字符串从 `st[2]` 开始。\n\n### 4. `cputs()`\
  \ :\n此函数在控制台上显示字符串。语法如下。\n\n**语法：**\n```c\ncputs(char *st);\n```\n\n![img](img/aero.png)\
  \ 4.25 编写一个程序使用 `cgets()` 读取字符串并使用 `cputs()` 显示它。\n\n```c\nvoid main()\n{\n    static\
  \ char *t;\n    clrscr();\n    printf(“\\n Enter Text Here :”);\n    cgets(t);\n\
  \    t+=2;\n    printf(“\\n Your Entered Text :”);\n    cputs(t);\n    getche();\n\
  }\n```\n\n**输出:**\nEnter Text Here: How are you?\nYour Entered Text: How are you?\n\
  \n**解释：**\n在这个示例中，声明了字符指针 `t`。`cgets()` 函数通过键盘读取字符串，`cputs()` 函数在控制台上显示字符串。\n\n\
  ##### 4.5 常用库函数\n\n###### 1. `clrscr()`\n此函数用于清除屏幕。它清除屏幕上之前的输出，并从屏幕的第一行开始显示当前程序的输出。它定义在\
  \ `conio.h` 头文件中。语法如下。\n\n**语法：**\n```c\nclrscr();\n```\n\n###### 2. `exit()`\n\
  此函数用于终止程序。它定义在 `process.h` 头文件中。语法如下。\n\n**语法：**\n```c\nexit();\n```\n\n#### 3.\
  \ `sleep()`\n此函数用于暂停程序执行指定的秒数。秒数需要放在括号内。它定义在 `dos.h` 头文件中。语法如下。\n\n**语法：**\n```c\n\
  sleep(1);\n```\n下面是一个关于 `sleep()` 的示例。\n\n![img](img/aero.png) 4.26 编写一个程序显示 `sleep()`\
  \ 函数的效果。\n\n```c\nvoid main()\n{\n    static char t[10];\n    clrscr();\n    printf(“\\\
  n Enter Text Here :”);\n    gets(t);\n    printf(“\\n Your Entered Text :”);\n \
  \   sleep(5);\n    puts(t);\n    getche();\n}\n```\n\n**输出:**\nEnter Text Here:\
  \ ashok\nYour Entered Text: ashok\n\n**解释：**\n该解释非常直观且自言其明。查看 `sleep(5)` 的效果。显示在暂停后才出现。\n\
  \n###### 3. `system()`\n此函数对于执行不同的 DOS 命令很有帮助。成功时返回 0，失败时返回 –1。语法如下。\n\n**语法：**\n\
  ```c\nsystem (“dir”);\n```\n命令应该包含在双引号内。在我们使用 C 运行此命令后，将显示目录。程序员可以验证此命令。\n\n#####\
  \ 4.6 提高可读性的要点\n计算机产生的输出对用户很有用。因此，结果的清晰度和整洁度应该体现在输出中。以下是产生整洁输出可以遵循的几个步骤：\n\n1. 在数字之间留空格。\n\
  2. 提供适当与问题相关的变量名和标题。\n3. 提供用户提示，使用户了解需要做什么。\n4. 在两行之间留空隙，使文本具有可读性。\n5. 提醒用户可以做什么和不能做什么。\n\
  6. 使用格式化输入和输出来精确输入数据和输出结果。\n7. 建议使用转义序列字符，如 `\\t`、`\\b`、`\\n`。\n\n### 总结\n本章讲解了格式化函数，如\
  \ `printf()` 和 `scanf()` 语句。通过适当示例说明了非格式化函数，如 `putchar()`、`getche()`、`gets()`。还详细阐述了\
  \ C 程序中使用的不同数据类型和转换符号。讨论了转义序列等特殊符号及其应用。本章描述了程序中常用的某些函数，如 `clrscr()`、`exit()`。通过编程示例叙述了输入和输出函数及其示例。最后，为读者提供了理解程序的要点，以便他们遵循。\n\
  \n### 练习题\n\n**I 填空题：**\n\n1. _______ 函数提供转换符号以识别识别数据类型。\n    1. 格式化\n    2. 非格式化\n\
  \    3. 库\n    4. 用户定义\n2. ______ 函数不转换数据。\n    1. 格式化\n    2. 非格式化\n    3. 库\n\
  \    4. 用户定义\n3. ________ 语句打印所有类型。\n    1. `printf()`\n    2. `scanf()`\n    3.\
