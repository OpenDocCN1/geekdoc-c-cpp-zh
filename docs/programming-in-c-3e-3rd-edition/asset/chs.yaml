  \n## 第 13 章\n\n## 结构与联合体\n\n### 章节大纲\n- **13.1 引言**\n- **13.2 结构的特征**\n- **13.3\
  \ 结构的声明与初始化**\n- **13.4 结构嵌套结构**\n- **13.5 结构数组**\n- **13.6 结构指针**\n- **13.7 结构与函数**\n\
  - **13.8 typedef**\n- **13.9 位域变量**\n- **13.10 举型数据类型**\n- **13.11 联合体**\n- **13.12\
  \ 调用 BIOS 和 DOS 服务**\n- **13.13 结构联合体**\n\n##### 13.1 引言\n你已经知道变量存储一个数据类型的单一值。数组可以存储许多相似数据类型的值。从类型的角度来看，数组中的数据在本质上具有相同的组成。在生活中，我们需要不同的数据类型；例如，为了维护员工信息，我们应该拥有姓名、年龄、学历、薪资等信息。在这里，为了维护员工信息，需要不同类型的数据。员工的姓名和学历是\
  \ `char` 类型，年龄是 `int`，薪资是 `float`。所有这些数据类型都无法在一个数组中表示。人们可能会考虑为每种数据类型声明不同的数组。但会导致源代码大幅增加。因此，数组变得不可用。为了解决此类混合数据类型问题，C\
  \ 语言提供了一种特殊特性，被称为结构（structure）。`structure` 是一个或多个不同数据类型变量的集合，它们被组合在一个名称下。它是一种派生数据类型，因为用户可以决定结构体中包含的数据类型。通过使用结构，我们可以对变量、数组、指针进行分组\n\
  \n### 13.2 结构的特征\n为了将数组的元素复制到另一个数组中，必须逐一复制相同数据类型的元素。无法一次性复制所有元素。然而，在结构中，可以使用 `=`\
  \ 运算符将所有不同类型的结构元素复制到另一个变量中。这是可能的，因为结构元素存储在连续的内存位置上。表 13.1 显示了数组与结构之间的比较。\n\n**表\
  \ 13.1 数组与结构的比较**\n![img](img/page491.png)\n\n结构的嵌套是可能的，即可以在结构内部创建结构。使用这一特性，人们可以处理复杂的数据类型。还可以将结构元素传递给函数。这与将普通变量传递给函数相似。人们可以通过值或地址传递单个结构元素或整个结构。也可以创建结构指针。在指针中，我们学习过指向\
  \ `int`、指向 `float` 和指向 `char`。以此类推，我们可以创建一个指向结构元素的指针。这需要使用 `->` 运算符。\n\n### 13.3\
  \ 结构的声明与初始化\n结构可以如下所示声明：\n```c\nstruct struct_type {\nvariable1;\nvariable2;\n};\n\
  ```\n结构声明总是以 `struct` 关键字开始。这里，`struct_type`被称为标签（tag）。结构声明被括在对括号中。右括号以分号结束。使用 `struct`\
  \ 和标签，用户可以声明如 `variable1`、`variable2` 等结构变量。这些是结构的成员。定义结构后，我们可以创建如下变量：\n```c\nstruct\
  \ struct_type v1, v2;\n```\n这里定义了结构变量。上述代码定义了结构但并没有分配内存。只有在声明变量时才会分配内存。\n```c\n\
  struct book1 {\n    char book[30];\n    int pages;\n    float price;\n};\nstruct\
  \ book1 bk1;\n```\n在上面的示例中，创建了一个类型为 `book1` 的结构。它包含三个成员：`book[30]`（char 类型）、`pages`（int\
  \ 类型）和 `price`（float 类型）。上图 13.1 解释了结构的各种成员。通过 `bk1` 可以访问结构的所有成员。可以参考程序 13.1 来理解结构元素的内存需求。共占用\
  \ 36 字节（`book[30]` 占用 30 字节，`int` 占用 2 字节，`float` 占用 4 字节）。为了用特定值初始化结构元素，使用以下语句：\n\
  ```c\nstruct book1 bk1 = {\"shrinivas\", 500, 385.00};\n```\n结构的所有成员都与变量 `bk1.member`\
  \ 或 `bk1.book` 相关。点（`.`）符号用于访问结构成员。我们可以直接为成员赋值如下：\n```c\nbk1.book = \"shrinivas\"\
  ;\nbk1.pages = 500;\nbk1.price = 385.00;\n```\n![img](img/aero.png) 13.1 写一个程序来显示结构元素的大小。使用\
  \ `sizeof()` 运算符。\n```c\nvoid main() {\n    struct book1 {\n        char book[30];\n\
  \        int pages;\n        float price;\n    };\n    struct book1 bk1;\n    clrscr();\n\
  \    printf(\"\\n Size of Structure Elements\");\n    printf(\"\\n Book : %d\",\
  \ sizeof(bk1.book));\n    printf(\"\\n Pages : %d\", sizeof(bk1.pages));\n    printf(\"\
  \\n Price : %d\", sizeof(bk1.price));\n    printf(\"\\n Total Bytes : %d\", sizeof(bk1));\n\
  }\n```\n**输出:**\n```\nSize of Structure Elements\nBook : 30\nPages : 2\nPrice :\
  \ 4\nTotal Bytes : 36\n```\n\n\n\n\n在上面的程序中，结构 `book1` 定义了三个成员变量，分别为 `char book[30]`、`int\
  \ pages` 和 `float price`。`bk1` 是结构 `book1` 的一个对象。使用 `sizeof()` 运算符显示了它们的大小。显示的内存大小（字节（bytes）分别为\
  \ 30、2 和 4。单条记录的总大小为 36，即上述结构所有成员变量的大小之和。\n\n下面展示了几个示例以理解结构体的工作原理。\n\n![img](img/aero.png)\
  \ 13.2 编写一个程序定义一个结构并初始化其成员变量。\n\n```c\nvoid main()\n{\nstruct book1\n{\n  char book[30];\n\
  \  int pages;\n  float price;\n};\nstruct book1 bk1={\"Programming in C \",600,185};\n\
  clrscr();\nprintf(\"\\n Book Name : %s\",bk1.book);\nprintf(\"\\n No. of Pages :\
  \ %d\",bk1.pages);\nprintf(\"\\n Book Price : %.2f\",bk1.price);\ngetche();\n}\n\
  ```\n\n**OUTPUT：**\nBook Name : Programming in C\nNo. of Pages : 600\nBook Price\
  \ : 185.00\n\n**Explanation：**\n在上面的程序中，定义了结构 `book1` 及其成员变量 `char book[30]`、`int\
  \ pages` 和 `float price`。`bk1` 是结构 `book1` 的对象。语句 `struct book1 bk1={\"Programming\
  \ in C \"} 300,285}` 定义了对象 `bk1` 并用括号中的值分别初始化变量。使用 `printf()` 语句显示各个字段的内容。\n\n可以将结构变量逐个复制到另一个结构变量，也可以一次性全部复制。*下面的示例展示了这一概念。*\n\
  \n![img](img/aero.png) 13.3 编写一个程序，将结构体元素从一个对象拷贝到另一个对象。\n\n```c\n# include <string.h>\n\
  \nvoid main()\n{\nstruct disk\n{\n  char co[15];\n  float type;\n  int price;\n\
  };\nstruct disk d1={\"SONY\",1.44,20};\nstruct disk d2,d3;\nstrcpy(d2.co,d1.co);\n\
  d2.type=d1.type;\nd2.price=d1.price;\nd3=d2=d1;\nclrscr();\nprintf(\"\\n %s %g %d\"\
  ,d1.co,d1.type,d1.price);\nprintf(\"\\n %s %g %d\",d2.co,d2.type,d2.price);\nprintf(\"\
  \\n %s %g %d\",d3.co,d3.type,d3.price);\ngetche();\n}\n```\n\n**OUTPUT：**\nSONY\
  \ 1.44 20\nSONY 1.44 20\nSONY 1.44 20\n\n**Explanation：**\n在上面的程序中，`d1`、`d2` 和 `d3`\
  \ 是基于结构 `disk` 定义的对象。对象 `d1` 被初始化。`d1` 的内容被拷贝到 `d2` 和 `d3`。在第一种方法中，使用赋值语句拷贝了 `d1`\
  \ 对象的各个单独元素。因为结构的第一个元素是字符串，所以使用了 `strcpy()` 函数。在第二种方法中，`d1` 的所有内容都被拷贝到 `d2` 和 `d3`。在这里，语句\
  \ `d3=d2=d1` 完成了此任务。因此，在结构中，元素是可以拷贝的（或者可以将元素拷贝到相同类型的另一个对象）。\n\n![img](img/aero.png)\
  \ 13.4 编写一个程序使用 `scanf()` 读取值并将其赋值给结构变量。\n\n```c\nvoid main()\n{\nstruct book1\n\
  {\n  char book[30];\n  int pages;\n  float price;\n};\nstruct book1 bk1;\nclrscr();\n\
  printf(\"Enter Book name, pages :\");\nscanf(\"%s\",bk1.book);\nscanf(\"%d\", &bk1.pages);\n\
  scanf(\"%f\", &bk1.price);\nprintf(\"\\n Book Name : %s\",bk1.book);\nprintf(\"\\\
  n No. of Pages : %d\",bk1.pages);\nprintf(\"\\n Book Price : %.2f\",bk1.price);\n\
  getche();\n}\n```\n\n**OUTPUT：**\nEnter Book name, pages :C 500 450\nBook Name :\
  \ C\nNo. of Pages : 500\nBook Price : 450.00\n\n**Explanation：**\n此程序与之前的相同。它不是初始化值，而是使用\
  \ `scanf()` 语句和结构变量读取值。`printf()` 语句显示了结构的内容。\n\n##### 13.4 结构嵌套结构\n我们可以为声明结构成员选取任何数据类型，如\
  \ `int`、`float`、`char`。同样，我们也可以将一个结构的对象作为另一个结构中的成员。因此，结构中的结构可以用于创建复杂的数据应用（见图 1）。结构中的结构语法如下：\n\
  \n![img](img/page.png) **13.2 结构嵌套结构**\n```c\nstruct time\n{\nint second;\nint minute;\n\
  };\nstruct t\n{\nint carno;\nstruct time st;\n};\n```\n\n![img](img/aero.png) 13.5\
  \ 编写一个程序读取值并将其赋值给结构。使用嵌套结构。\n\n```c\nvoid main()\n{\nstruct time\n{\nint second;\n\
  int minute;\n};\nstruct t\n{\nint carno;\nstruct time st;\n};\nstruct t r1;\nclrscr();\n\
  printf(\"Enter car number, seconds minutes:\");\nscanf(\"%d\", &r1.carno);\nscanf(\"\
  %d\", &r1.st.second);\nscanf(\"%d\", &r1.st.minute);\nprintf(\"\\n Car No : %d\"\
  ,r1.carno);\nprintf(\"\\n Seconds : %d\",r1.st.second);\nprintf(\"\\n Minutes :\
  \ %d\",r1.st.minute);\ngetche();\n}\n```\n\n**OUTPUT：**\nEnter car number, seconds\
  \ minutes:1 30 20\nCar No : 1\nSeconds : 30\nMinutes : 20\n\n**Explanation：**\n\
  在上面的程序中，定义了两个结构。`time` 结构包含了 `int second` 和 `int minute`。`t` 结构包含了 `int carno` 和一个\
  \ `struct time` 类型的成员 `st`。`r1` 是 `t` 结构的一个对象。使用 `scanf()` 语句读取 `r1.carno`、`r1.st.second`\
  \ 和 `r1.st.minute` 的值。使用 `printf()` 语句显示结构的内容。\n\n\n\n\n\n```c\n  int second;\n\
  \  int minute;\n  int hour;\n};\n\nstruct t\n{\n  int carno;\n  struct time st;\n\
  \  struct time rt;\n};\n\nstruct t r1[3];\n\nclrscr();\n\nprintf(\"\\nCar No. Starting\
  \ Time Reaching Time :\\n\\n\");\nprintf(\"\\t hh:mm:ss\\t hh:mm:ss \\n\");\nfor\
  \ (k=0;k<3;k++)\n{\n  scanf(\"%d\", &r1[k].carno);\n  scanf(\"%d %d %d\", &r1[k].st.hour,\
  \ &r1[k].st.minute, &r1[k]. st.second);\n  scanf(\"%d %d %d\", &r1[k].rt.hour, &r1[k].rt.minute,\
  \ &r1[k]. rt.second);\n}\nprintf(\"\\n\\tCar No. \\tStarting Time \\tReaching Time\\\
  n\");\nfor (k=0;k<3;k++)\n{\n  printf(\"\\n\\t%d\\t\",r1[k].carno);\n  printf(\"\
  \\t%d:%d:%d\\t\\t\",r1[k].st.hour, r1[k].st.minute, r1[k]. st.second);\n  printf(\"\
  \\t%d:%d:%d\",r1[k].rt.hour, r1[k].rt.minute, r1[k].rt.second);\n}\ngetche();\n\
  }\n```\n\n**输出：**\n\n| 车号 | 开始时间 | 到达时间 : |\n| | hh:mm:ss | hh:mm:ss |\n| 120 |\
  \ 2 20 25 | 3 25 58 |\n| 121 | 3 25 40 | 4 40 25 |\n| 122 | 4 30 52 | 5 40 10 |\n\
  | 车号 | 开始时间 | 到达时间 : |\n| 120 | 2 :20: 25 | 3 :25:58 |\n| 121 | 3 :25: 40 | 4 :40:25\
  \ |\n| 122 | 4 :30: 52 | 5 :40:10 |\n\n**解释：**\n\n在上述程序中，声明了两个结构体 `time` 和 `t`。定义了一个包含三个元素的数组\
  \ `r1[3]`。第一个 `for` 循环执行三次，`scanf()` 语句通过键盘为对象的每个元素读取数据。第二个 `for` 循环及其内部的 `printf()`\
  \ 语句显示对象数组的内容及其对应的元素。\n\n![img](img/aero.png) 13.8 编写一个程序，显示三名参加考试的学生的姓名、学号和成绩。声明姓名、学号和成绩的结构。创建一个结构对象数组。读取并显示数组的内容。\n\
  \n```c\nvoid main()\n{\nint k=0;\nstruct stud\n{\n  char name[12];\n  int rollno;\n\
  \  char grade[2];\n};\nstruct stud st[3];\nwhile(k<3)\n{\nclrscr();\ngotoxy(2,4);\n\
  printf(\"Name : \");\nscanf(\"%s\",st[k].name);\ngotoxy(2,5);\nprintf(\"Roll No.\
  \ : \");\nscanf(\"%d\",st[k].rollno);\ngotoxy(2,6);\nprintf(\"Grade :\");\ngotoxy(7,6);\n\
  scanf(\"%s\",st[k].grade);\nst[k].grade[1]='\\0';\nputs(\" press any key..\");\n\
  getch();\nk++;\n}\nk=0;\nclrscr();\nprintf(\"\\nName\\t Rollno\\t Grade\\n\");\n\
  while(k<3)\n{\nprintf(\"\\n%s\\t %d\\t%s\", st[k].name,st[k].rollno,st[k].grade);\n\
  k++;\n}\n}\n```\n\n**输出：**\n\n| 姓名 | 学号. | 成绩 |\n| :--- | :--- | :--- |\n| Sanjay\
  \ | 25 | A |\n| Rajesh | 26 | A |\n| Srinivas | 27 | A |\n\n注：在输入三名学生的数据后显示此输出。\n\
  \n**解释：**\n\n在上述程序中，声明了结构体 `stud` 及其成员 `name`、`rollno` 和 `grade`。声明了结构体数组 `st[3]`。第一个\
  \ `while` 循环和 `scanf()` 语句用于重复读取数据。第二个 `while` 循环和 `printf()` 语句显示内容。\n\n##### 13.6\
  \ 结构体指针\n\n我们知道指针是一个存储变量地址的变量。变量可以是 `int`、`float` 或 `double` 类型。同样，我们可以定义结构体指针。在这里，可以访问成员地址。这种指针被称为结构体指针。\n\
  \n**示例：**\n\n```c\nstruct book\n{\nchar name[25];\nchar author[25];\nint pages;\n\
  };\nstruct book *ptr;\n```\n\n在上述示例中，`ptr` 是结构体 `book` 的指针。使用指针成员的语法如下：\n(1) `ptr->name`\n\
  (2) `ptr->author`\n(3) `ptr->pages`\n\n通过执行这三个语句，可以获取每个成员的起始地址。\n\n![img](img/aero.png)\
  \ 13.9 编写一个程序，声明结构体指针并显示结构体的内容。\n\n```c\nvoid main()\n{\nstruct book\n{\nchar name[25];\n\
  char author[25];\nint pages;\n};\nstruct book b1={\"COMPLETE REFERENCE\", \"P.NAUGHTON\"\
  , 886};\nstruct book *ptr;\nptr=&b1;\nclrscr();\nprintf(\"\\n %s by %s of %d pages\"\
  ,b1.name,b1.author,b1.pages);\nprintf(\"\\n %s by %s of %d pages\", ptr->name,ptr->author,ptr->pages);\n\
  }\n```\n\n**输出：**\n\nCOMPLETE REFERENCE by P.NAUGHTON of 886\nCOMPLETE REFERENCE\
  \ by P.NAUGHTON of 886\n\n**解释：**\n\n在上述程序中，`printf()` 语句通过通常方式打印结构体元素。在第二个 `printf()`\
  \ 语句中，使用指针打印结构体元素使用了箭头运算符 `->` 而不是点运算符 `.`。原原因是 `ptr` 不是结构体变量，而是结构体的指针。\n\n![img](img/aero.png)\
  \ 13.10 编写一个程序，在结构体中声明指针并显示结构体的内容。\n\n```c\nvoid main()\n{\nstruct boy\n{\nchar\
  \ *name;\nint *age;\nfloat *height;\n};\nstatic struct boy *sp;\nchar nm[10]=\"\
  Mahesh\";\nint ag=20;\nfloat ht=5.40;\nsp->name=nm;\nsp->age=&ag;\nsp->height=&ht;\n\
  clrscr();\nprintf(\"\\n Name = %s\",sp->name);\nprintf(\"\\n Age = %d\",*sp->age);\n\
  printf(\"\\n Height = %.2f\",*sp->height);\n}\n```\n\n**输出：**\n\nName = Mahesh\n\
  Age = 20\nHeight = 5.40\n\n**解释：**\n\n在上述程序中，声明了结构体 `boy`。`boy` 的成员是指针。指针 `*sp`\
  \ 是结构体 `boy` 的指针。另外声明并初始化了三个普通变量 `char nm [10]=\"Mahesh\"`、`int ag=20` 和 `float\
  \ ht=5.40`。使用箭头运算符将这些普通变量的地址赋值给结构体变量。使用 `printf()` 语句显示结构体变量的内容。\n\n![img](img/aero.png)\
  \ 13.11 编写一个程序，在结构体中声明指针并使用箭头运算符显示结构的内容。\n\n```c\n# include <string.h>\nvoid main()\n\
  {\nstruct boy\n{\nchar *name;\nint *age;\nfloat *height;\n};\nstruct boy b;\nchar\
  \ nm[10]=\"Somesh\";\nint ag=20;\nfloat ht=5.40;\nstrcpy(b.name,nm);\nb.age=&ag;\n\
  b.height=&ht;\nclrscr();\nprintf(\"\\n Name = %s\",b.name);\nprintf(\"\\n Age =\
  \ %d\",b.age);\nprintf(\"\\n Height = %g\",b.height);\n}\n```\n\n**输出：**\n\nName\
  \ = Somesh\nAge = 20\nHeight = 5.4\n\n**解释：**\n\n该程序与上一个相同。在这里，结构中没有声明指针。因此，使用点运算符可以显示内容。\n\
  \n![img](img/aero.png) 13.12 编写一个程序，使用普通指针显示结构的内容。\n\n```c\nvoid main()\n{\nint\
  \ *p;\nstruct num\n{{int a;\nint b;\nint c;\n};\nstruct num d;\nd.a=2;\nd.b=3;\n\
  d.c=4;\np=&d.a;\nclrscr();\nprintf(\"\\n a=%d\",*p);\nprintf(\"\\n b=%d\",*(++p));\n\
  printf(\"\\n c=%d\",*(++p));\n}\n```\n\n\n\n\n\n```c\n/* 结构体变量的地址 */\n\nstruct book\n\
  {\n    char name[35];\n    char author[35];\n    int pages;\n};\n\nvoid main()\n\
  {\n    struct book b1= {“JAVA COMPLETE REFERENCE”,”P.NAUGHTON”,886};\n    show(&b1);\n\
  }\n\nshow(struct book *b2)\n{\n    clrscr();\n    printf(“\\n %s by %s of %d pages”,b2->name,b2->author,b2->pages);\n\
  }\n```\n\n**输出:**\nJAVA COMPLETE REFERENCE by P.NAUGHTON of 886 pages\n\n解释：\n在上面的程序中，结构体\
  \ `book` 在 `main()`之前定义。在 `main()` 函数中，`b1` 是一个声明并初始的结构体对象。对象 `b1` 的地址被传递给函数 `show()`。在函数\
  \ `show()` 中，该地址赋值给指针 `*b2`，它是指向结构体 `book` 的指针。因此，使用 `→` 运算符显示结构元素的内容。\n\n![img](img/aero.png)\
  \ 13.14 编写一个程序将结构元素传递给函数 `print()` 并打印这些元素。\n\n```c\nvoid main()\n{\n    struct\
  \ boy\n    {\n        char name[25];\n        int age;\n        int wt;\n    };\n\
  \    struct boy b1={“Amit”,20,25};\n    print(b1.name,b1.age,b1.wt);\n}\n\nprint(char\
  \ *s, int t, int n)\n{\n    clrscr();\n    printf(“\\n %s %d %d”,s,t,n);\n}\n```\n\
  \n**输出:**\nAmit 20 25\n\n解释：\n在上面的示例中，结构体包含成员变量，如字符数组 `name[25]` 以及整数类型的 `age` 和\
  \ `wt`。我们通过引用传递将 `name` 的基地址传递给函数，并通过值传递将 `age` 和 `wt` 传递进去。因此，这里使用了引用传递和值传递的方法来传递值。除了传递每个元素外，也可以将整个结构体传递给函数。下文所示程序展示了这一点。\n\
  \n![img](img/aero.png) 13.15 编写一个程序将整个结构体传递给用户定义的函数。\n\n```c\n/* 将整个结构体传递给函数 */\n\
  struct boy\n{\n    char name[25];\n    int age;\n    int wt;\n};\n\nvoid main()\n\
  {\n    struct boy b1={“Amit”,20,25};\n    print(b1);\n}\n\nprint(struct boy b)\n\
  {\n    clrscr();\n    printf(“\\n %s %d %d”,b.name,b.age,b.wt);\n    return 0;\n\
  }\n```\n\n**输出:**\nAmit 20 25\n\n解释：\n在上面的程序中，结构体 `boy` 定义在 `main()` 之外。因此它是全局的，每个函数都可以访问它。在结构体\
  \ `boy b1` 上定义的对象被传递给函数 `print()`。函数 `print()` 的形式参数（对象）接收了对象 `b1` 的内容。因此，使用点运算符显示了各个元素的内容。\n\
  \n##### 13.8 TYPEDEF\n\n我们可以使用 `typedef` 创建新的数据类型。在定义新数据类型时使用 `typedef` 语句。语法如下：\n\
  \n`typedef type dataname;`\n\n在这里，`type` 是数据类型，`dataname` 是该类型的用户定义名称。\n\n`typedef\
  \ int hours;`\n\n在这里，`hours` 是 `int` 的另一个名称，现在我们可以在程序中所示使用 `hours` 代替 `int`：\n\n\
  `hours hrs;`\n\n![img](img/aero.png) 13.16 编写一个程序在 `int` 数据类型上创建用户定义的数据类型 `hours`\
  \ 并在程序中使用。\n\n```c\n#define H 60\n\nvoid main()\n{\n    typedef int hours;\n   \
  \ hours hrs;\n    clrscr();\n    printf(“Enter Hours: ”);\n    scanf(“%d”, &hrs);\n\
  \    printf(“\\nMinutes = %d”,hrs*H);\n    printf(“\\nSeconds = %d”,hrs*H*H);\n\
  }\n```\n\n**输出:**\nEnter Hours:  2\nMinutes =  120\nSeconds = 7200\n\n解释：\n在上面的示例中，通过\
  \ `typedef` 我们将 `hours` 声明为整数数据类型。紧接 `typedef` 语句之后，`hrs` 是一个 `hours` 数据类型的变量，类似于\
  \ `int`。后续程序使用 `hrs` 变量计算分钟和秒。\n\n![img](img/aero.png) 13.17 编写一个程序创建字符串数据类型。\n\n\
  ```c\nvoid main()\n{\n    typedef char string[20];\n    string a=” Hello ”,b;\n\
  \    clrscr();\n    puts(“Enter Your Name :”);\n    gets(b);\n    printf(“%s %s”,a,b);\n\
  }\n```\n\n**输出:**\nEnter Your Name : KAMAL\nHello KAMAL\n\n解释：\n在上面的程序中，`string[20]`\
  \ 是一个用户定义的字符数据类型。它定义了两个变量，每个变量都有 20 个字符的空间。同样，我们也可以使用 `typedef` 来定义结构体。其中一个示例如下所示。\n\
