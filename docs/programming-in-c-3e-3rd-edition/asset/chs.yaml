  在上述程序中，枚举类型 `month` 在大括号内声明了 12 个月份名称。编译器从 1 开始为标识符赋值，因为第一个标识符被初始化为常量 1，最后一个标识符为\
  \ 12。使用 `printf()` 语句显示不同的标识符![img](img/aero.png) 13.25 写一个程序使用枚举类型显示月份名称。用用户定义的常量初始化枚举数据。\n\
