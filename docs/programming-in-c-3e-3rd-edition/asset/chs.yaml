  line(40,9,40,60);\nsetlinestyle(2,1,1);\nline(60,9,60,70);\ngetch();\nclosegraph();\n\
  restorecrtmode();\n}\n```\n\n**解释：**\n在这个程序中，使用 `setlinestyle()` 函数可以以不同的样式显示绘制的线条。它需要三个整数参数。第一个表示线条样式，第二个表示模式，第三个表示粗细。\n\
  \n![image](img/aero.png) 15.14 绘制长度增加的不同样式线条并显示文本的程序。\n\n```c\n# include <graphics.h>\n\
  \nvoid main()\n{\nint gd =DETECT,gm,x,y,i,k=20,j=200;\ninitgraph(&gd,&gm,“d:\\turboc2\\\
