  \ 14.1 文件的介绍\n\n文件无非是记录的集合。记录是相关数据项的组。与学生、员工、客户相关的所有数据项无非都是记录。换句话说，文件是存储在硬盘、U 盘、光盘等二级设备上的数字、符号和文本。文件永久地存储在磁盘上，需要时可以对其进行访问。\n\
  \n##### 14.2 文件的定义\n\n文件可以被看作字符流。文件是一组可以通过库函数访问的记录。这些函数在 `stdio.h` 中。数据可以存储在二级存储设备中，如软盘或硬盘。图\
  \ 14.1 显示了键盘、内存和二级设备之间的通信。\n\n如图所示，从键盘读取的数据存储在变量中。变量在内存（主内存类型）中创建。变量在程序中临时持有数据。执行程序和处理数据时，原始数据可能会丢失。需要将数据永久地存储在二级设备上。通过磁盘\
  \ I/O 操作，所有在内存中创建的变量都可以存储到硬盘或软盘等二级存储设备中。\n\n\n\n\n图 14.2 *输入和输出流*\n\n##### 14.3\
  \ 流与文件类型\n\n从程序到文件或反之的数据流是通过流完成的，流是一系列字节。为了对文件执行 I/O 操作，读取或写入文件都是通过流来完成的。数据的读取和写入是通过流实现的。流的设计是为了允许用户高效地访问文件。流是一个文件，通过使用键盘等物理设备，信息存储在文件中。`FILE`\
  \ 对象使用了这些键盘、打印机和显示器。\n\n`FILE` 对象包含了关于流的所有信息，如当前位置、指向任何缓冲区指针、错误和文件结束 (EOF)。利用这些对象信息，C\
  \ 程序使用指针，该指针是由流函数 `fopen()` 返回的。函数 `fopen()` 用于打开文件。\n\n##### 14.3.1 文件类型\n\n文件有两种类型：(1)\
  \ 顺序文件和(2) 随机访问文件。\n\n1. **顺序文件：** 在此类文件中，数据是按顺序存储的。如果我们想读取文件的最后一条记录，预计需要读取其之前的所有记录。访问这些记录需要更多时间。或者，如果我们想访问第\
  \ 10 条记录，则必须按顺序读取前 9 条记录才能到达第 10 条记录。\n\n2. **随机访问文件：** 在此类文件中，可以随机读取和修改数据。如果用户想读取文件的最后几条记录，可以直接读取这些记录。由于数据的随机访问，其访问时间比顺序文件要短。\n\
  \n##### 14.4 文件操作步骤\n\n大多数编译器都支持文件处理函数。C 语言也支持标准库中提供的许多文件处理函数。其中一些函数列在表 14.1 中。C\
  \ 支持的所有文件处理的函数并未全部列出。C 支持的库函数非常详尽，因此并没有提供所有函数。在使用它们之前，应该检查 `C` 库函数。\n\n**表 14.1\
  \ *文件函数***\n\n| 函数 | 操作 |\n| --- | --- |\n| `fopen()` | 为读/写操作创建一个新文件。 |\n| `fclose()`\
  \ | 关闭与文件指针关联的文件。 |\n| `closeall()` | 关闭所有通过 `fopen()` 打开的文件。 |\n| `fgetc()` | 从当前指针位置读取字符并将指针移动到下一个字符。\
  \ |\n| `getc()` | 与 `fgetc()` 相同。 |\n| `fprintf()` | 将所有类型的数据值写入文件。 |\n| `fscanf()`\
  \ | 从文件中读取所有类型的数据值。 |\n| `putc()` | 将字符一个接一个写入文件。 |\n| `fputc()` | 与 `putc()` 相同。\
  \ |\n| `gets()` | 从文件中读取一个字符串。 |\n| `puts()` | 向文件写入字符串。 |\n| `putw()` | 向文件写入一个整数。\
  \ |\n| `getw()` | 从文件中读取一个整数。 |\n| `fread()` | 读取由 `fwrite()` 函数写入的结构化数据。 |\n| `fwrite()`\
  \ | 将块结构化数据写入文件。 |\n| `fseek()` | 设置指针到文件中的任意位置。 |\n| `feof()` | 检测文件是否已结束。 |\n\
  | `ferror()` | 报告读写操作期间发生的错误。 |\n| `perror()` | 打印编译器的错误信息以及用户定义的消息。 |\n| `ftell()`\
  \ | 返回当前指针位置。 |\n| `rewind()` | 将记录指针置于文件开头。 |\n| `unlink()` | 从磁盘上删除指定的文件。 |\n\
  | `rename()` | 修改文件名。 |\n\n###### 14.4.1 文件的打开\n\n在进行读写操作之前，必须打开文件。打开文件会在操作系统和文件函数之间建立一种链接。文件名及其操作模式需要指示给操作系统。这项重要任务是由定义在\
  \ `stdio.h` 头文件中 `FILE` 结构完成的。因此，必须包含该头文件。\n\n当向操作系统请求打开文件时，它会通过授予请求来执行。如果请求被授予，操作系统将指向\
  \ `FILE` 结构。如果请求未授予，它返回 `NULL`。这就是为什么在打开文件之前要进行如下声明：\n\n```\nFILE *fp\n```\n\n其中\
  \ `fp` 是文件指针。\n\n我们打开的每个文件都有自己的 `FILE` 结构。文件中的信息可能是其当前大小，以及它在内存中的位置。打开文件的唯一函数是 `fopen()`。\n\
  \n***语法：***\n\n```c\nFILE *fp;\nfp=fopen(\"data.txt\",\"r\");\n```\n\n在这里，`fp` 是一个指针变量，包含了在头文件\
  \ `stdio.h` 中定义的 `FILE` 结构地址。有必要写大写的 `FILE`。函数 `fopen()` 将以只读模式打开“data.txt”文件。C\
  \ 编译器读取文件内容，因为它找到了读模式（`\"r\"`）。在这里，`\"r\"` 是一个字符串而不是字符。因此，它被双引号括起来，而不是单引号。\n\n`fopen()`\
  \ 执行了以下重要任务：\n\n1. 它在磁盘上搜索以打开文件。\n2. 如果文件存在，它将文件加载到内存。如果文件不存在，该函数返回 `NULL`。`NULL`\
  \ 是 `stdio.h` 中定义的宏。这表示无法打开文件。`fopen()` 失败的原因：(A) 文件处于保护模式 (B) 文件正被另一个程序使用。\n3.\
  \ 它将指针指向文件的第一个字符。当文件被打开时，指针指向第一个字符。\n\n###### 14.4.2 读取文件\n\n一旦使用 `fopen()` 打开了文件，其内容就会加载到内存中（部分或全部）。指针指向第一个字符。`fgetc()`\
  \ 函数用于读取文件内容。`fgetc()` 的语法如下：\n\n```\nch=fgetc(fp);\n```\n\n其中 `fp` 是文件指针。`fgetc()`\
  \ 从当前指针位置读取字符并将指针移动。变量 `ch` 包含了 `fgetc()` 读取的字符。还有其他读取文件内容的函数，将在下解释。\n\n###### 14.4.3\
  \ 关闭文件\n\n通过 `fopen()` 打开的文件在工作完成后应该关闭。也就是说，我们在读写操作之后关闭文件。此外，如果以其他模式重新打开已打开的文件，必须先关闭。关闭文件可以清除缓冲区中的所有内容，并断开链接。\n\
  \n***示例：***\n\n关闭文件的函数是\n\n```\nfclose(fp);\n```\n\n该语句关闭与文件指针 `fp` 关联的文件。该函数一次关闭一个文件。为了关闭所有文件使用的函数如下：\n\
  \n```\ncloseall();\n```\n\n该函数关闭所有已打开的文件并返回关闭的文件数。它不需要任何参数。\n\n###### 14.4.4 文本模式\n\
  \n1. w(写)：此模式在磁盘上创建一个新文件用于写入。如果文件已存在，其内容将被覆盖而无需确认。如果未找到相关文件，则创建一个新文件。\n\n***语法：***\n\
  \n```c\nfp=fopen(\"data.txt\",\"w\");\n```\n\n在这里 `data.txt` 是文件名，`\"w\"` 是模式。\n\
  \n2. r(读)：此模式搜索文件，如果找到，则将其加载到内存中，从第一个字符开始读取。文件指针指向第一个字符并开始读取操作。如果文件不存在，编译器向文件指针返回\
  \ `NULL`。通过 `if` 语句配合指针，我们可以提示用户操作失败。读模式的语法如下：\n\n```c\nfp=fopen(\"data.txt\",\"\
  r\");\nif(fp==NULL)\n    printf(\"文件不存在\");\n```\n\n\n\n\n\n```\nif(fp=(fopen(“data.txt”,“r”))==NULL)\n\
  printf(“File does not exist”);\n```\n\n这里 `data.txt` 以只读模式打开。如果文件不存在，`fopen()` 将向文件指针\
  \ `fp` 返回 `NULL`。通过在 `if` 语句中使用 `fp` 的 `NULL` 值，我们可以提示用户 `fopen()` 函数失败。下面给出的程序示例，展示了\
  \ `\"w\"` 和 `\"r\"` 模式的使用。\n\n![img](img/aero.png) 14.1  写一个向文本文件写入数据并读取它的程序。\n\n\
  ```c\n# include <stdio.h>\n# include <conio.h>\n# include <process.h>\n\nvoid main()\n\
  {\nFILE *fp;\nchar c=‘ ’;\nclrscr();\nfp=fopen(“data.txt”,“w”);\nif(fp==NULL)\n\
  {\n  printf(“Can not open file”);\n  exit(1);\n}\nprintf(“Write data & to stop press\
  \ ‘.’ :”);\nwhile(c!=‘.’)\n{\n  c=getche();\n  fputc(c,fp);\n}\nfclose(fp);\nprintf(“\\\
  n Contents read :”);\nfp=fopen(“data.txt”,”r”);\nwhile(!feof(fp))\nprintf(“%c”,getc(fp));\n\
  }\n```\n\n**输出：**\nWrite data & to stop press ‘.’: ABCDEFGHIJK.\nContents read:\
  \ ABCDEFGHIJK.\n\n***解释：***\n\n在上面的程序中，名为 `\"data.txt\"` 的文件以写入模式打开。字符从键盘读取并存储在变量\
  \ `c` 中。使用 `fputc()` 将字符写入文件，直到按下 `‘.’`（点）。该文件被关闭，然后以只读模式重新打开。在重新打开文件时，字符指针指向文件的开头。文件内容将使用\
  \ `getc()` 在屏幕上显示。\n\n### 3. a(追加)\n\n此模式以追加模式打开已存在文件以添加数据。数据追加过程从打开文件的末尾开始。文件指针指向文件的最后一个字符。如果文件不存在，则打开一个新文件，也就是说，如果文件不存在，则\
  \ `\"a\"` 模式与 `\"w\"` 模式相同。由于某些原因，如果在这种情况下未打开文件，则返回 `NULL`。由于磁盘空间不足或其他原因，可能无法打开文件。使用追加模式打开文件的语法如下：\n\
  \n***语法：***\n\n```\nfp=fopen(“data.txt”,“a”);\n```\n\n在这里，如果 `data.txt` 文件已存在，则将打开它。否则，将打开一个同名的新文件。\n\
  \n![img](img/aero.png) 14.2  写一个打开已存在的文件并在文件末尾添加信息的程序。显示追加前后的文件内容。\n\n```c\n# include\
  \ <stdio.h>\n# include <conio.h>\n# include <process.h>\n\nvoid main()\n{\nFILE\
  \ *fp;\nchar c;\nclrscr();\nprintf(“Contents of file before appending :\\n”);\n\
  fp=fopen(“data.txt”,“r”);\nwhile(!feof(fp))\n{\n  c=fgetc(fp);\n  printf(“%c”,c);\n\
  }\nfp=fopen(“data.txt”,“a”);\nif(fp==NULL)\n{\n  printf(“File can not appended”);\n\
  \  exit(1);\n}\nprintf(“\\n Enter string to append :”);\nwhile(c!=‘.’)\n{\n  c=getche();\n\
  \  fputc(c,fp);\n}\nfclose(fp);\nprintf(“\\n Contents of file After appending :\\\
  n”);\nfp=fopen(“data.txt”,“r”);\nwhile(!feof(fp))\n{\n  c=fgetc(fp);\n  printf(“%c”,c);\n\
  }\n}\n```\n\n**输出：**\nContents of file before appending :\nString is terminated\
  \ with ‘\\0’.\nEnter string to append :\nThis character is called as NULL character.\n\
  Contents of file After appending :\nString is terminated with ‘\\0’.\nThis character\
  \ is called as NULL character.\n\n### 4. w+ (写+读)\n\n此模式开始在磁盘上进行文件搜索操作。如果找到了文件，其内容将被破坏。如果没有找到文件，则会创建一个新文件。如果打开文件失败，则返回\
  \ `NULL`。在此文件模式下，可以写入新内容，随后可以进行读取操作。\n\n***示例：***\n\n```\nfp=fopen(“data.txt”,“w+”);\n\
  ```\n\n在上面的示例中，`data.txt` 文件以读写操作模式打开。\n\n![img](img/aero.png) 14.3  写一个使用 w+ 模式对文件进行读写的程序。\n\
  \n```c\n# include <stdio.h>\n# include <conio.h>\n# include <process.h>\n\nvoid\
  \ main()\n{\nFILE *fp;\nchar c=’ ‘;\nclrscr();\nfp=fopen(“data.txt”,“w+”);\nif(fp==NULL)\n\
  {\n  printf(“Can not open file”);\n  exit(1);\n}\nprintf(“Write data & to stop press\
  \ ‘.’ :”);\nwhile(c!=‘.’)\n{\n  c=getche();\n  fputc(c,fp);\n}\nrewind(fp);\nprintf(“\\\
  n Contents read :”);\nwhile(!feof(fp))\nprintf(“%c”,getc(fp));\n}\n```\n\n**输出：**\n\
  Write data & to stop press ‘.’: ABCDEFGHIJK.\nContents read: ABCDEFGHIJK.\n\n***解释：***\n\
  \n与其使用单独的读写模式，可以使用 `w+` 模式执行这两种操作。因此，在上面的程序使用了 `w+`。首先执行写入操作。读取文件内容不需要关闭文件。我们需要将字符指针设置为开头。因此使用了\
  \ `rewind()` 函数。使用 `w+` 的优点是减少语句的数量。\n\n### 5. a+ (追加+读)\n\n在此文件操作模式下，可以读取文件内容并向文件末尾添加记录。如果相关文件不存在，则创建一个新文件。\n\
  \n***示例：***\n\n```\nfp=fopen(“data.txt”,“a+”);\n```\n\n在这里 `data.txt` 被打开并在文件末尾添加记录。\n\
  \n![img](img/aero.png) 14.4  写一个追加模式打开文件的程序。\n\n```c\n# include <stdio.h>\n# include\
  \ <conio.h>\n# include <process.h>\n\nvoid main()\n{\nFILE *fp;\nchar c=' ’;\nclrscr();\n\
  fp=fopen(“data.txt”,“a+”);\nif(fp==NULL)\n{\n  printf(“Can not open file”);\n  exit(1);\n\
  }\nprintf(“Write data & to stop press ‘.’ :”);\nwhile(c!=‘.’)\n{\n  c=getche();\n\
  \  fputc(c,fp);\n}\nrewind(fp);\nprintf(“\\n Contents read :”);\nwhile(!feof(fp))\n\
  printf(“%c”,getc(fp));\n}\n```\n\n**输出：**\nWrite data & to stop press ‘.’: ABC.\n\
  read: ABC.\n\n***解释：***\n\n在上面的程序中，`\"data.txt\"` 以追加模式打开。如果文件不存在，则创建一个新文件。首先执行写入操作然后进行内容。\n\
  \n### 6. r+ (读+写)\n\n此模式用于读写操作。我们可以在文件中读取和写入记录。如果文件不存在，编译器返回 `NULL`。\n\n***示例：***\n\
  \n```\nfp=fopen(“data.txt”,“r+”);\n```\n\n在上面的示例中，`data.txt` 以读写操作模式打开。如果 `fopen()`\
  \ 打开文件失败，则返回 `NULL`。\n\n![img](img/aero.png) 14.5  写一个在文件中以读写模式打开文件的程序。\n\n```c\n\
  # include <stdio.h>\n# include <conio.h>\n# include <process.h>\n\nvoid main()\n\
  {\nFILE *fp;\nchar c=‘ ’;\nclrscr();\nfp=fopen(“data.txt”,“r+”);\nif(fp==NULL)\n\
  {\n  printf(“Can not open file”);\n  exit(1);\n}\nprintf(“\\n Contents read :”);\n\
  while(!feof(fp))\nprintf(“%c”,getc(fp));\nprintf(“Write data & to stop press ‘.’\
  \ :”);\nwhile(c!=‘.’)\n{\n  c=getche();\n  fputc(c,fp);\n}\n}\n```\n\n**输出：**\n\
  Contents read: Help me.\nWrite data & to stop press ‘.’: I am in trouble.\n\n***解释：***\n\
  \n在上面的示例中，文件以读写模式打开 (`r+`）。`getc()` 函数读取文件内容并通过 `printf()` 函数打印。`getche()` 函数从键盘读取字符，读取到的字符使用\
  \ `fputc()` 函数写入文件。\n\n\n\n\n当数值数据从内存（RAM）传输到磁盘时，数据在磁盘上占用的内存空间更大。例如，数字 `234567`\
  \ 在内存中需要 3 字节内存空间，传输到磁盘时则需要 6 字节内存空间。每个数字都需要 1 字节的空间。因此，数字 `234567` 的总需求为 6 字节。因此，文本模式在存储大量数值数据时效率很低，因为它占用空间很大。解决这种低效内存使用的唯一方法是以二进制模式打开文件，它占用的空间比文本模式更少。下面描述了几种二进制模式。\n\
  \n### 1. `wb(write)`\n此模式以写模式打开二进制文件。\n\n**示例：**\n```c\nfp=fopen(“data.dat”,“wb”);\n\
  ```\n这里，`data.dat` 文件以二进制模式打开用于写入。\n\n### 2. `rb(read)`\n此模式以读模式打开二进制文件。\n\n**示例：**\n\
  ```c\nfp=fopen(“data.dat”,“rb”);\n```\n这里，`data.dat` 文件以二进制模式打开用于读取。\n\n![img](img/aero.png)\
  \ 14.6 写一个程序以二进制模式打开文件进行读/写操作。在文件中读取和写入新信息。\n\n```c\n#include <stdio.h>\n#include\
  \ <conio.h>\n#include <process.h>\nvoid main()\n{\n    FILE *fp;\n    char c=‘ ’;\n\
  \    clrscr();\n    fp=fopen(“data.dat”,“wb”);\n    if (fp==NULL)\n    {\n     \
  \ printf(“Can not open file”);\n      exit(1);\n    }\n    printf(“Write data &\
  \ to stop press ‘.’ :”);\n    while(c!=’.')\n    {\n      c=getche();\n      fputc(c,fp);\n\
  \    }\n    fclose(fp);\n    fp=fopen(“data.dat”,“rb”);\n    printf(“\\n Contents\
  \ read :”);\n    while(!feof(fp))\n    printf(“%c”,getc(fp));\n}\n```\n\n**解释：**\n\
  该程序与之前解释的相同。唯一的区别是文件打开模式是二进制。\n\n### 3. `ab(append)`\n此模式以追加模式打开二进制文件，即数据可以添加到文件的末尾。\n\
  \n**示例：**\n```c\nfp=fopen(“data.dat”,“ab”);\n```\n这里，`data.dat` 文件以追加模式打开。\n\n###\
  \ 4. `r+b(read + write)`\n此模式以读/写模式打开一个已存在的文件，即文件可以被读取也可以被写入。\n\n**示例：**\n```c\n\
  fp=fopen(“data.dat”,“r+b”);\n```\n这里，文件 `data.dat` 以二进制模式打开用于读取和写入。\n\n### 5. `w+b(read\
  \ + write)`\n此模式以读/写模式创建一个新文件。\n\n**示例：**\n```c\nfp=fopen(“data.dat”,“w+b”);\n```\n\
  这里，创建了用于二进制模式读取和写入的文件 `data.dat`。\n\n### 6. `a+b(append+ write)`\n此模式以追加模式打开文件，即数据可以写在文件的末尾。如果文件不存在，则创建一个新文件。\n\
  \n**示例：**\n```c\nfp=fopen(“data.dat”,”a+b”);\n```\n这里，文件 `data.dat` 以追加模式打开，数据可以写在文件的末尾。\n\
  \n##### 14.5 文件 I/O\n\n### 1. `fprintf()`\n该函数用于向文件写入字符、字符串、整数、浮点数等。`fprint()` 函数用于以各种格式写入字符。因此，该函数被称为格式化函数。它包含多一个参数，即文件指针，指向已打开的文件。\n\
  \n`fprintf()` 和 `fscanf()` 函数的操作与 `printf()` 和 `scanf()` 相同，不同在于前者是与文件操作的。\n\n`fprintf()`\
  \ 的格式如下：\n```c\nfprintf() (fp,“control string”,text);\n```\n其中 `fp` 是与以写模式打开的文件关联的文件指针。`text`\
  \ 可以是变量、常量或字符串。\n\n关于该函数的编程示例如下。\n\n![img](img/aero.png) 14.7 写一个程序打开一个文本文件并使用 `fprintf()`\
  \ 函数写入一些文本。打开文件并验证内容。\n\n```c\n#include <stdio.h>\n#include <conio.h>\nvoid main()\n\
  {\n    FILE *fp;\n    char text[30];\n    fp=fopen(“Text.txt”,“w”);\n    clrscr();\n\
  \    printf(“Enter Text Here :”);\n    gets(text);\n    fprintf(fp,“%s”,text);\n\
  \    fclose(fp);\n}\n```\n**输出：**\nEnter Text Here: Have a nice day.\n\n**解释：**\n\
  在上述程序中，`fprintf()` 函数将字符串写入 `fp` 指向的文件。字符串通过 `gets()` 函数收集到字符数组 `name[30]` 中。\n\n\
  ### 2. `fscanf()`\n该函数从文件指针指向的文件中读取字符、字符串、整数、浮点数等。这也是一个格式化函数。下面是一个基于该函数的程序。\n\n\
  该函数的语法如下：\n```c\nfscanf(fp,“control string\");\n```\n通过此语句对文件进行操作。\n\n![img](img/aero.png)\
  \ 14.8 写一个程序以二进制模式打开文件进行读/写。在文件中读取并写入新信息。\n\n```c\n#include <stdio.h>\n#include\
  \ <conio.h>\n#include <process.h>\nvoid main()\n{\n    FILE *fp;\n    char c=‘ ’;\n\
  \    clrscr();\n    fp=fopen(“data.dat”,“wb”);\n    if (fp==NULL)\n    {\n     \
  \ printf(“Can not open file”);\n      exit(1);\n    }\n    printf(“Write data &\
