  \ `for` 循环中，以读取模式打开了三个文件。每个文件指针指向字符数组中的对应元素。`while` 循环中的 `fgetc()` 函数逐个读取每个文件的内容。数字也写入整数数组。最后通过比较整数数组中的值检测出字节数最大的文件并显示其文件名。\n\
