  3. 如果答案错误（不是 Earlang），显示“Try again!”（重试！）并继续回答。\n4. 否则，如果答案正确“Earlang”，显示消息“Answer\
  \ is correct”（答案正确）。\n5. 如果用户在前两次尝试中给出正确答案，程序将终止。\n6. 如果用户在三次尝试中未能提供正确答案，程序将给出答案。\n\
  \n```c\n#include <process.h>\n\nvoid main()\n{\n    char ans[8];\n    int i;\n \
  \   clrscr();\n    for(i=1;i<=3;i++)\n    {\n        printf(“\\nWhat is the Unit\
  \ of Traffic?”);\n        scanf(“%s”,ans);\n        fflush(stdin);\n        if(stricmp(ans,”Earlang”)==0)\n\
  \        {\n            printf(“\\nAnswer is Correct.”);\n            exit(1);\n\
  \        }\n        else\n        if(i<3)\n        printf(“\\n Try Again !\\n”);\n\
  \    }\n    clrscr();\n    printf(“\\nunit of Traffic is Earlang.”);\n}\n```\n\n\
  **OUTPUT：**\nWhat is the Unit of Traffic ? Earlan\nTry Again !\nWhat is the Unit\
  \ of Traffic ? Earlam\nTry Again !\nWhat is the Unit of Traffic ? Earlang\nAnswer\
  \ is Correct.\n\n**解释：**\n在上面的程序中，`stricmp()` 函数用于比较字符数组 `ans[]` 和 ‘Earlang’。如果函数返回\
  \ `0`（零），显示的消息将是‘Answer is Correct’。如果答案错误，显示的消息将是‘Try again!’。通过 `for` 循环提供了三次回答问题的机会。`fflush()`\
  \ 函数用于清除缓冲区。\n\n### `strcmp()` 函数\n\n`strcmp()`：人们也可以使用 `strcmp()` 函数代替 `stricmp()`。它们之间唯一的区别是，前者区分字母的大小写，而后者不区分。在上面的程序中，用\
  \ `strcmp()` 代替 `stricmp()` 后的输出将如下：\n\nEnter String(1) : HELLO\nEnter String(2)\
  \ : hello\nThe Two Strings are Different.\n\n上面的函数通过比较两个字符串来判断它们是相同还是不同。这些字符串的字符逐一进行比较。如果发生不匹配，函数返回非零值，否则返回零，即当两个字符串相同时，`strcmp()`\
  \ 返回值零。如果它们不同，它返回不匹配字符的 ASCII 值之间的数值差异。\n\n### `strncmp()` 函数\n\n对两个字符串的比较可以在指定的长度内进行。用于此函数是\
  \ `strncmp()`。该函数与 `strcmp()`相同，但它只到指定的长度比较字符串的字符。\n\n函数的语法如下：\n\n`strncmp(char\
  \ *source, char *target, int argument);`\n\n其中 `argument` 是进行比较的字符数。\n\n![image](img/aero.png)\
