  setfillstyle(SOLID_FILL,RED);\nbar(20,30,200,40);\nmoveto(250,50);\nbar(200,50,250,60);\n\
  getch();\nclosegraph();\nrestorecrtmode();\n}\n```\n\n**解释：**\n这个程序使用 `setfillstyle()`\
