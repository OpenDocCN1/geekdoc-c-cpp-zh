  \ 函数将指定文件的更改更改为名称。其含义类似于 DOS 命令‘rename’。\n\n![![image](img/aero.png) 14.32 编写一个程序将一个文件的内容复制到另一个文件。\n\
  \n```c\n/* File copy program */\n#include <stdio.h>\n#include \"process.h\"\n\n\
