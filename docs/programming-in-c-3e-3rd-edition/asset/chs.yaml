  \ ASCII 符号。符号可以是任何字符，包括特殊符号和数字。如果我们输入 65，则显示 Capital A。\n\n### 5.11 switch case\
  \ 与嵌套 if\n\nswitch case 与嵌套 if 的区别如表 表 5.3。\n\n**表 5.3 switch case 与嵌套 if 的区别**\n\
  \n| switch case | nested ifs |\n| --- | --- |\n| switch 只能测试相等性，即仅适用于常量值。 | if 可以评估关系表达式或逻辑表达式。\
  \ |\n| 同一个 switch 中没有两个 case 语句具有相同的常数。 | 相同的条件可以根据需要重复。 |\n| 字符常量会自动转换为整数。 | 字符常量会自动转换为整数。\
  \ |\n| 在 switch case 语句可以使用嵌套 if。 | 在嵌套 if 语句可以使用 switch case。 |\n\n\n\n\n读者将了解到\
  \ C 语言编程中的决策语句，如 `if` 和 `if–else` 语句。此外，还讨论了多分支决策语句 `switch case`。文中还以简单易懂的方式说明了如何在程序中使用嵌套的\
  \ `if–else` 和 `switch case` 语句。针对决策语句，解释了大量的简单示例。为了改变程序的执行流，程序员可以使用 `break`、`continue`\
  \ 和 `goto` 等语句。希望读者执行本章给出的所有程序，以获得处理程序中决策语句的专业知识。通过编写程序解决更多现实生活的问题，程序员将受益匪浅。\n\n\
