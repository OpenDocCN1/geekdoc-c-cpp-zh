  \ 48 到 57 的 ASCII 范围。如果输入的数字在 0 到 9 之间，编译器返回 1。\n\n![image](img/aero.png) 3.15 写一个程序，如果输入的数字在\
  \ 1 和 100 之间则显示逻辑 1。使用逻辑与 (`&&`) 运算符。\n\n```c\nvoid main()\n{\nint x,z;\nclrscr();\n\
