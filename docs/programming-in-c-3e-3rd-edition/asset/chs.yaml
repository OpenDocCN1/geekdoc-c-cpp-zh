  ### 解释\n\n在上述程序中，输入了三个字符串。第一个 循环使用简单赋值将 `fname[]` 复制到 `name[]`。循环后的语句在字符串后添加空格。接下来的两个循环遵循相同的步骤将\
  \ `sname[]` 和 `lname[]` 连接到 `name[]`。因此，我们在 `name[]` 中得到了三个字符串的拼接。\n\n### strncat()\
  \ 函数\n\n此函数与 `strcat()` 相同。它们之间的区别在于，前者在指定的长度内将字符串与另一个拼接。该函数的语法为 `strncat (text1,text2,n)`\
  \ 其中 *n* 是要附加的字符数。\n\n![image](img/aero.png) 8.28 编写一个程序使用 `strncat()` 函数将指定的 (*n*)\
  \ 数量字符附加到第一个字符串的末尾。\n\n```c\n# include <string.h>\n\nvoid main()\n{\n    char text1[30],\
  \ text2[10],n;\n    puts(“Enter Text1 :”);\n    gets(text1);\n    puts(“Enter Text2\
  \ :”);\n    gets(text2);\n    printf(“Enter Number of Characters to Add :”);\n \
  \   gets(n);\n    strcat(text1,“ ”);\n    strncat(text1,text2,n);\n    clrscr();\n\
  \    printf(“%s\\n”, text1);\n}\n```\n\n**输出：**\n\nEnter Text1 : MAY I\n\nEnter\
  \ Text2 : COME IN ?\n\nEnter Number of Characters to Add : 4\n\nMAY I COME\n\n\n\
