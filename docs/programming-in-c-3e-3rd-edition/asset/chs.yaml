  printf(“\\n Enter Player Name, Age & Runs Scored \\n”);\nprintf(“ ==== ===== ====\
  \ === = ==== ======\\n”);\nscanf(“%s %d %d”,emp.player, &emp.age,&emp.runs);\nfwrite(&emp,sizeof(emp),1,fp);\n\
  fclose(fp);\nif((fp=fopen(“record.dat”, “r”))==NULL)\n{\n  printf(“\\n Error in\
  \ opening file”);\n  exit(1);\n}\nprintf(“\\n Record Entered is \\n”);\nfread(&emp,sizeof(emp),1,fp);\n\
  printf(“\\n%s %d %d”, emp.player, emp.age, emp.runs);\nfclose(fp);\n}\n```\n\n\n\
  \n在上述程序中，用户使用 `fwrite` 函数写入玩家信息。首先使用 `fwrite()` 函数将包含结构体中给定信息的整个玩家记录写入文件。\n\n同样，可以使用\
  \ `fread()` 函数读取文件中写入的信息。因此，该程序通过单个 `fread()` 读取整个数据文件，并通过单个 `fwrite()` 函数写入数据。与\
  \ `fscanf()` 和 `fprintf()` 相比，这两个函数在处理 I/O 文件时使用更加高效。\n\n![img](img/aero.png) 14.19\
  \ 编写一个程序，使用 `fwrite()` 函数向给定文件写入一个结构体元素块。用户应按 ‘Y’ 继续，按 ‘N’ 终止。\n\n```c\n# include\
  \ <stdio.h>\n# include <conio.h>\n# include <process.h>\n\nvoid main()\n{\nFILE\
