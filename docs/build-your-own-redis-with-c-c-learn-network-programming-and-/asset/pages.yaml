  md: "# 12. The Event Loop and Timers\n\nThere is one major thing missing in our\
    \ server: timeouts. Every networked application needs to handle timeouts since\
    \ the other side of the network can just disappear. Not only do ongoing IO operations\
    \ like read/write need timeouts, but it is also a good idea to kick idle TCP connections.\
    \ To implement timeouts, the event loop must be modified so the poll is the only\
    \ thing that is blocking.\n\nLooking at our event loop code:\n\n```\nint rv =\
    \ poll(poll_args.data(), (nfds_t)poll_args.size(), 1000);\n```\n\nThe poll syscall\
    \ takes a timeout argument, which imposes an upper bound of time on the poll syscall.\
    \ The timeout value is currently an arbitrary value of 1000 ms. If we set the\
    \ timeout value according to the timer, poll should wake up at the time it expires,\
    \ or before that; then we have a chance to fire the timer in due time.\n\nThe\
    \ problem is that we have more than one timer, the timeout value of poll should\
    \ be the value of the nearest timer. Some data structure is needed for finding\
    \ the nearest timer. The heap data structure is a popular choice for finding the\
    \ min/max value and is often used for such purpose. Also, any data structure for\
    \ sorting can be used. For example, we can use the AVL tree to order timers and\
    \ possibly augment the tree to keep track of the minimum value.\n\nLet's start\
    \ by adding timers to kick idle TCP connections. For each connection there is\
    \ a timer, set to a fixed timeout in the future, every time there are IO activities\
    \ on the connection, the timer is renewed to a fixed timeout. Notice that we renew\
    \ a timer, it becomes the most distant one; therefore, we can exploit this to\
    \ simplify the data structure; a simple linked list is sufficient to keep the\
    \ order of timers: the new or updated timer simply goes to the end of the list,\
    \ and the list maintains sorted order. Also, operations on linked lists are O(1),\
    \ which is better than sorting data structures.\n\nDefining the linked list is\
    \ a trivial task:\n\n```\nstruct DList {\n    DList *prev = NULL;\n    DList *next\
    \ = NULL;\n```"
