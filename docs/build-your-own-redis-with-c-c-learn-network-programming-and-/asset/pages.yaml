  md: "# 05. The Event Loop and Nonblocking IO\n\nThere are 3 ways to deal with concurrent\
    \ connections in server-side network programming. They are: forking, multi-threading,\
    \ and event loops. Forking creates new processes for each client connection to\
    \ achieve concurrency. Multi-threading uses threads instead of processes. An event\
    \ loop uses polling and nonblocking IO and usually runs on a single thread. Due\
    \ to the overhead of processes and threads, most modern production-grade software\
    \ use event loops for networking.\n\nThe simplified pseudo-code for the event\
    \ loop of our server is:\n\n```\nall_fds = [...]\nwhile True:\n    active_fds\
    \ = poll(all_fds)\n    for fd in active_fds:\n        do_something_with(fd)\n\n\
    def do_something_with(fd):\n    if fd is a listening socket:\n        add_new.client(fd)\n\
    \    elif fd is a client connection:\n        while work_not_done(fd):\n     \
    \       do_something_to_client(fd)\n\ndef do_something_to_client(fd):\n    if\
    \ should_read_from(fd):\n        data = read_until_EAGAIN(fd)\n        process_incoming_data(data)\n\
    \    while should_write_to(fd):\n        write_until_EAGAIN(fd)\n    if should_close(fd):\n\
    \        destroy_client(fd)\n```\n\nInstead of just doing things (reading, writing,\
    \ or accepting) we use the poll operation to tell us which fd can be operated\
    \ immediately without blocking. When we perform an IO operation on an fd, the\
    \ operation should be performed in the nonblocking mode."
  merge: -1
  pgno: 19
- img_proc: true
  md: "2023-01-31\n\n05. The Event Loop and Nonblocking IO\n\nIn blocking mode, `read`\
    \ blocks the caller when there are no data in the kernel, `write` blocks when\
    \ the write buffer is full, `accept` blocks when there are no new connections\
    \ in the kernel queue. In nonblocking mode, those operations either succeed without\
    \ blocking, or fail with the errno ` EAGAIN`, which means “not ready”. Nonblocking\
    \ operations that fail with `EAGAIN` must be retried after the notification was\
    \ notified by the poll.\n\nThe `poll` is the sole blocking operation in an event\
    \ loop, everything else must be nonblocking; a single thread can handle multiple\
    \ concurrent connections. All networking IO APIs, such as `read`, `write`, and\
    \ `accept`, have a nonblocking mode. APIs that do not have a nonblocking mode,\
    \ such as `gethostname`, and disk IO, should be performed in thread pools, which\
    \ will be covered in later layers. Also, timers must be implemented within the\
    \ event loop since we can't `sleep` inside the event loop.\n\nThe syscall for\
    \ setting `fd_set_nb(int fd)`\n\n```\nstatic void fd_set_nb(int fd) {\nnerno =\
    \ 0;\nint flags = fcntl(fd, F_GETFL, 0);\nif (errno) {\n  die(\"fcntl error\"\
    );\n  return;\n}\n\nflags |= 0_NONBLOCK;\n\nerno = 0;\n(void) fcntl(fd, F_SETFL,\
    \ flags);\nif (errno) {\n  die(\"fcntl error\");\n}\n}\n```\n\nOn Linux, besides\
    \ the `poll` syscall, there are also `select` and `epoll`. The ancient `select`\
    \ syscall is basically the same as the `poll`, except that the maximum fd number\
    \ is limited to a small number, which makes it obsolete in modern applications.\
    \ The `epoll` API consists of 3 syscalls: `epoll_create`, `epoll_wait`, and `epoll_ctl`.\
    \ The `epoll` API is Stateful, instead of supplying a set of fds as a syscall\
    \ argument, `epoll_ctl` was used to manipulate an fd created by `epoll_create`,\
    \ which the `epoll_wait` is operating on.\n\nbuild-your-own.org\n\n18"
