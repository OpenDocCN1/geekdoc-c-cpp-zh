  md: '# 08. Data Structure: Hashtables


    This chapter fills the placeholder code in the last chapter''s server. We''ll
    start by implementing a hashtable. Hashtables are often the obvious data structure
    for holding an unknown amount of key-value data that does not require ordering.


    There are two kinds of hashtables: chaining and open addressing. Their primary
    difference is collision resolution. Open addressing seeks another free slot in
    the event of a collision while simply chaining conflicts with a linked list. There
    are many variants of open addressing due to the need to find free slots, while
    the hashtable is pretty much a fixed design. The hashtable used in our server
    is a chaining one. A chaining hashtable is easy to code; it does not require much
    choice-making.


    The definition of our data types:


    ```

    // hashtable node, should be embedded into the payload

    struct HNode {

    HNode *next = NULL;

    uint64_t hcode = 0;

    };

    ```


    ```

    // a simple fixed-sized hashtable

    struct HTab {

    HNode **tab = NULL;

    size_t mask = 0;

    size_t size = 0;

    };

    ```


    When the size of the hashtable is the power of two, the indexing operation is
    a simple bit mask with the hash code.


    ```

    // n must be a power of 2

    static void h_init(HTab *htab, size_t n) {

    assert(n > 0 && ((n - 1) & n) == 0);

    ab->tab = (HNode **)calloc(sizeof(HNode *), n);\htab->mask = n - 1;

    }

    ```'
