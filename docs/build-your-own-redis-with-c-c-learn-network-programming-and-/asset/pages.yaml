  md: '# A1: Hints to Exercises


    # 08. Data Structure: Hashtables


    > Q: Our hasht triggers resizing when the load factor is too high, should we also
    shrink the hashtable when the load factor is too low? Can the shrinking be performed
    automatically?


    Hints:


    Hashtable shrinking is not done automatically in practice. Many real-world usage
    patterns are periodic, shrinking is not always clearly beneficial. Besides, shrinking
    does not always return the memory to OS, this is dependent on many factors such
    as the malloc implementation and the level of memory fragmentation; the outcome
    of shrinking is not easily predictable.


