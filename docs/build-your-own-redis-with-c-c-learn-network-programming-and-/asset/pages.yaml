  md: "# 06. The Event Loop Implementation\n\nThis chapter walks through the real\
    \ C++ code of an echo server.\n\nThe definition of struct Conn:\n\n```\nenum {\n\
    \    STATE_REQ = 0,\n    STATE_RES = 1,\n    STATE_END = 2,    // mark the connection\
    \ for deletion\n}\n\nstruct Conn {\n    int fd = -1;\n    uint32_t state = 0;\
    \    // either STATE_REQ or STATE_RES\n    // buffer for reading\n    size_t rbuf_size\
    \ = 0;\n    uint8_t rbuf[4 + k_max_msg];\n    // buffer for writing\n    size_t\
