    \ rhs) {\n  return lhs < rhs ? rhs : lhs;\n}\n```\n\n```\n// maintaining the depth\
    \ and cnt field\nstatic void avl_update(AVLNode +node) {\n  node->depth = 1 +\
    \ max(avl_depth(node->left), avl_depth(node->right));\n  node->cnt = 1 + avl_cnt(node->left)\
    \ + avl_cnt(node->right);\n}\n```\n\nThe node rotation code:\n\n```\nstatic AVLNode\
