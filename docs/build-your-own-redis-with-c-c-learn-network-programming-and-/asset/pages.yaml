  md: "Adding two helper functions before listing the one_request function:\n\n```\n\
    static int32_t read_full(int fd, char *buf, size_t n) {\n    while (n > 0) {\n\
    \        size_t rv = read(fd, buf, n);\n        if (rv <= 0) {\n            return\
    \ -1; // error, or unexpected EOF\n        }\n        assert((size_t)rv <= n);\n\
    \        n -= (size_t)rv;\n        buf += rv;\n    }\n    return 0;\n}\n```\n\n\
