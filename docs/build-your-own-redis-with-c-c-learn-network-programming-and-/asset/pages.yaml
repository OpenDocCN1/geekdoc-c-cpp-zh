  md: 'Taking the idea that keys don''t need to be expired at the exact time, read
    Redis samples

    t key space at random to find dead keys. The higher ratio of dead keys, the easier
    to

    find and eliminate them.


    The pros of this approach are:


    +   1. It doesn''t require extra space.

    2. The concept is simple, and the implementation is easy.


    The cons:


    +   1. It requires keys with a TTL should not be mixed with keys without a TTL,

    otherwise, the non-TTL keys interfere with the sampling, making it harder to find

    dead keys. This can be a source of surprise for operators.

    2. While the concept is simple, the implementation uses some heuristics to determine

    t rate of the sampling. If the heuristic is not tuned properly, in a worse-case,
    the

    server might not be removing dead keys fast enough, leading to excessive memory

    usage, which may frustrate the operator.


