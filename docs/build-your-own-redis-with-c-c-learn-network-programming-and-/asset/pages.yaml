  md: "# 02. Introduction to Sockets\n\nThis chapter is an introduction to socket\
    \ programming. Readers are assumed to have basic knowledge of computer networking\
    \ but no experience in network programming. This book does not contain every detail\
    \ on how to use socket APIs, you are advised to read manages and other network\
    \ programming guides while learning from this book. (https://beej.us/ is a good\
    \ source for socket APIs.)\n\nRedis is an example of the server/client system.\
    \ Multiple clients connect to a single server, and the server receives requests\
    \ from TCP connections and sends responses back. There are several Linux system\
    \ calls we need to learn before we can start socket programming.\n\nThe socket()\
    \ syscall returns an fd. \"fd\" if you are unfamiliar with Unix systems: An fd\
    \ is an integer that refers to something in the Linux kernel, like a TCP connection,\
    \ a disk file, a listening port, or other resources, etc.\n\nThe bind() and listen()\
    \ syscall: the bind() associates an address to a socket fd, and the listen() enables\
    \ us to accept connections to that address.\n\nThe accept() takes a listening\
    \ fd, when a client makes a connection to the listening address, the accept()\
    \ returns an fd that represents the connection socket. Here is the pseudo-code\
    \ that explains the typical workflow of a server:\n\n```\nfd = socket()\nbind(fd,\
    \ address)\nlisten(fd)\nwhile True:\n  conn.fd = accept(fd)\n  do_something.with(conn_fd)\n\
    close(conn.fd)\n```\n\nThe read() syscall receives data from a TCP connection.\
    \ The write() syscall sends data. The close() destroys the resource reserved by\
    \ the fd and recycles the fd number.\n\nWe have introduced the syscalls needed\
    \ for server-side network programming. For the client side, the connect() syscall\
    \ takes a socket fd and address and makes a TCP connection to that address. Here\
    \ is the pseudo-code for the client:"
