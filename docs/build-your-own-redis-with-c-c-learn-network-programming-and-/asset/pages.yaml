    # 13. The Heap Data Structure and the TTL


    > Q: The heap–based timer adds O(log(n)) operations to the server, which might
    be a

    bottleneck for a sufficiently large number of keys. Can you think of optimizations
    for

    a large number of timers?


    Hints:


    We can make the heap cache friendly by using the n-ary tree instead of the binary

    tree. Some real-world project uses the quadtree which fits in the 64-byte cache
    line.

    Also, in our case, the TTL timers don''t have to be fired at the exact time. We
    can use a

    very coarse timestamp (such as round up to 1min resolution) for TTL timers, and
    keys

