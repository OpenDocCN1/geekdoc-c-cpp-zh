  md: "# 10. The AVL Tree: Implementation & Testing\n\nWhile Redis is often referred\
    \ to as a key-value store, the “value” part of Redis is not restricted to plain\
    \ strings, lists, hashmaps, and sorted sets are quite nice things to have. Redis\
    \ is also referred to as the “data server” due to its rich set of data structures.\
    \ Redis is often used as an in-memory cache, and when storing in memory, there\
    \ is an advantage of freely using data structures. The sorted set data structure\
    \ in Redis is quite a unique and useful thing. Not only it offers the ability\
    \ to sort your data in order, but also has the feature of querying ordered by\
    \ rank. If you put 20M records into a sorted set, you can get the record ranked\
    \ at 10M, without going through the first 10M records, this is a feat that cannot\
    \ be emulated by current SQL databases.\n\nAs the name “sorted set” implies, it’s\
    \ a data structure for sorting. Trees, balanced binary trees, are popular data\
    \ structures for storing sorted data. Among various data structures, the author\
    \ found the AVL tree particularly simple and easy to code, which will be used\
    \ in this book to implement sorted set. The real Redis project usesplist which\
    \ is also considered easy to code.\n\nThe idea of AVL tree is to restrict the\
    \ height difference between the left subtree and the right subtree. The height\
    \ difference between subtrees is restricted to be at most one, when inserting/removing\
    \ nodes from an AVL tree, the height difference can temporarily reach two, which\
    \ is then fixed by the node rotations. The rotation operation is the basis of\
    \ balanced binary trees, which is also used by other balanced trees like the RB\
    \ tree. After the rotation, a node with a subtree height difference of two is\
    \ reduced back to at most one.\n\nLet’s start with the tree node:\n\n```\nstruct\
    \ AVLNode {\n  uint32_t depth = 0;\n  uint32_t cnt = 0;\n  AVLNode *left = NULL;\n\
    \  AVLNode *right = NULL;\n  AVLNode *parent = NULL;\n};\n\nstatic void avl_init(AVLNode\
    \ *node) {\n```"
