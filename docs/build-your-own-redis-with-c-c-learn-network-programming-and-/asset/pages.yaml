  md: "# 2023-01-31 11. The AVL Tree and the Sorted Set\n\nWith the size information\
    \ embedded in the node, we can determine whether the offset target is inside a\
    \ subtree or not. The offset operation runs in two phases: firstly, it walks up\
    \ along the tree if the target is not in a subtree, it walks down the tree, narrowing\
    \ the distance until the target is met. The worst-case is O(logn)) regardless\
    \ of how long the offset is, which is better than offsetting by walking to the\
    \ succeeding node one by one (best-case of O(offset)). The real Redis project\
    \ uses a similar technique for skip lists.\nIt is a good idea to implement and\
    \ test the new avl_offset function now.\n\n```\nstatic void test_case(uint32_t\
    \ sz) {\n  Container c;\n  for (uint32_t i = 0; i < sz; ++i) {\n    add(c, i);\n\
    \  }\n\n  AVLNode *min = c.root;\n  while (min->left) {\n    min = min->left;\n\
    \  }\n  for (uint32_t i = 0; i < sz; ++i) {\n    AVLNode *node = avl_offset(min,\
    \ (int64_t)i);\n    assert(container_of(node, Data, node)->val == i);\n\n    for\
    \ (uint32_t j = 0; j < sz; ++j) {\n      int64_t offset = (int64_t)j - (int64_t)i;\n\
    \      AVLNode *n2 = avl_offset(node, offset);\n      assert(container_of(n2,\
    \ Data, node)->val == j);\n    }\n    assert(!avl_offset(node, -(int64_t)i - 1));\n\
    \    assert(!avl_offset(node, sz - i));\n  }\n\n  dispose(c.root);\n}\n```\n\n\
    For now, we have implemented major functionalities of the sorted set. Let’s add\
    \ the sorted type to our server."
