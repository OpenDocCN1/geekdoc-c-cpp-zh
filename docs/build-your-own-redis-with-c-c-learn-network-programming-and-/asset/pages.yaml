  md: "```\n};\n\ninline void dlist_init(DList *node) {\n    node->prev = node->next\
    \ = node;\n}\n```\n\n```\ninline bool dlist_empty(DList *node) {\n    return node->next\
    \ = node;\n}\n```\n\n```\ninline void dlist_detach(DList *node) {\n    DList *prev\
    \ = node->prev;\n    DList *next = node->next;\n    prev->next = next;\n    next->prev\
    \ = prev;\n}\n```\n\n```\ninline void dlist_insert_before(DList *target, DList\
    \ *rookie) {\n    DList *prev = target->prev;\n    prev->next = rookie;\n    rookie->prev\
    \ = prev;\n    rookie->next = target;\n    target->prev = rookie;\n}\n```\n\n\
    get_monotonic_usec is the function for getting the time. Note that the timestamp\
    \ is monotonic. Timestamp jumping backward can cause all sorts of troubles in\
    \ computer systems.\n\n```\nstatic uint64_t get_monotonic_usec() {\n    timespec\
    \ tv = {0, 0};\n    clock_gettime(CLOCK_MONOTONIC, &tv);\n    return uint64_t(tv.tv_sec)\
    \ * 1000000 + tv.tv_nsec / 1000;\nn\n```\n\nThe next step is adding the list to\
    \ the server and the connection struct."
