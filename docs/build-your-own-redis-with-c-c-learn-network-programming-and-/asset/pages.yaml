  md: "# 04. Protocol Parsing\n\nOur server will be able to process multiple requests\
    \ from a client, to do that we need to implement some sort of \"protocol\", at\
    \ least is split requests apart from the TCP byte stream. The easiest way to split\
    \ requests apart is by declaring how long the request is at the beginning of the\
    \ request. Let's use the following scheme.\n\n```\n------+--------------------------------------+\n\
    | len | msg1 | len | msg2 | more...|\n------+--------------------------------------+\n\
    ```\n\nThe protocol consists of 2 parts: a 4-byte little-endian integer indicating\
    \ the length of the following request, and a variable length request.\n\nStarts\
    \ from the code from the last chapter, the loop of the server is modified to handle\
    \ multiple requests:\n\n```\nwhile (true) {\n    // accept\n    struct sockaddr_client_addr\
    \ = {};\n    socklen_t socklen = sizeof(client_addr);\n    int connfd = accept(fd,\
    \ (struct sockaddr*)client_addr, &socklen);\n    if (connfd < 0) {\n        continue;\
    \ // error\n    }\n\n    // only serves one client connection at once\n    while\
    \ (true) {\n        int32_t err = one_request(connfd);\n        if (err) {\n \
    \           break;\n        }\n    }\n    close(connfd);\n}\n```\n\nThe one_request\
    \ function only parses one request and replies, until something bad happens or\
    \ the client connection is gone. Our server can only handle one connection at\
    \ once until we introduce the event loop in later chapters."
