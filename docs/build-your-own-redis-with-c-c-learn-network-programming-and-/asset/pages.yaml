    \ (n > 0) {\n        size_t rv = write(fd, buf, n);\n        if (rv <= 0) {\n\
    \            return -1; // error\n        }\n        assert((size_t)rv <= n);\n\
    \        n -= (size_t)rv;\n        buf += rv;\n    }\n    return 0;\n}\n```\n\n\
