  md: "If the right subtree is too deep, a left rotation will fix it. Before the left\
    \ rotation, we may need a right rotation on the right subtree to ensure the right\
    \ subtree is leaning in the correct direction. Here is the visualization:\n\n\
    ```\nb      b      d\n / \\/    / \\/\n c  ==> a d ==> b c\n /      / /\n d  \
    \    c a\n```\n\nThe avl_fix function fixes everything after an insertion/deletion\
    \ operation. It goes from the initially affected node to the root. Since the rotation\
    \ may change the root of the tree, the node is returned. This is the core of the\
    \ AVL tree implementation.\n\n```\n// fix imbalanced nodes and maintain invariants\
    \ until the root is reached\nstatic AVLNode *avl_fix(AVLNode +node) {\n    while\
    \ (true) {\n        avl_update(node);\n        uint32_t l = avl_depth(node->left);\n\
    \        uint32_t r = avl_depth(node->right);\n        AVLNode **from = NULL;\n\
    \        if (node->parent->left == node) {\n            from = (node->parent)->left\
    \ ? &node->parent->left : &node->parent->right;\n        }\n        if (l == r\
    \ + 2) {\n            node = avl_fix_left(node);\n        } else if (l == r ==\
    \ 2) {\n            node = avl_fix_right(node);\n        }\n        if (!from)\
    \ {\n            return node;\n        }\n        *from = node;\n        node\
    \ = node->parent;\n    }\n}\n```\n\nInsertion for binary trees is easy, just walk\
    \ down from the root until you find an empty subtree and place the new node here,\
    \ then call up avl_fix for maintenance."
