  md: "2023-01-31\n\n10. The AVL Tree: Implementation & Testing\n\nDeletion is more\
    \ complicated. If the target node has no subtree, just remove it straight, if\
    \ it has one subtree, replace the node with that subtree. The problem arises when\
    \ the node has both subtrees, we can't remove it straight, instead, we remove\
    \ its sibling in the right subtree, and swap it with the detached sibling. Here\
    \ is the function for removing a node:\n\n```\n// detach a node and returns the\
    \ new root of the tree\nstatic AVLNode *avl_del(AVLNode *node) {\n  if (node->right\
