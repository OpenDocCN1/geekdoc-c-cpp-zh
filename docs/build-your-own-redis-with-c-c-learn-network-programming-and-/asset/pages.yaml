    \ is for initialization and starting threads. `thread` types are initialized by\
    \ `thread_xxx_init` functions and the `pthread_create` starts a thread with the\
    \ target function `worker`.\n\n```\nvoid thread_pool_init(ThreadPool *tp, size_t\
    \ num_threads) {\n    assert(num_threads > 0);\n\n    int rv = pthread_mutex_init(&tp->mu,\
    \ NULL);\n    assert(rv == 0);\n    rv = pthread_cond_init(&tp->not_empty, NULL);\n\
