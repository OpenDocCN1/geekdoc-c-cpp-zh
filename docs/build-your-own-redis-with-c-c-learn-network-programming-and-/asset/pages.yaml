  md: "# 14. The Thread Pool & Asynchronous Tasks\n\nThere is a flaw in our server\
    \ since the introduction of the sorted set data type: the deletion of keys. If\
    \ the size of a sorted set is huge, it can take a long time to free its nodes\
    \ and the server is stalled during the destruction of the key. This can be easily\
    \ fixed by using multi-threading to move the destructor away from the main thread.\n\
    \nFirstly, we introduce the \"thread pool\", which is literally a pool of threads.\
    \ The thread from the pool consumes tasks from a queue and executes them. It is\
    \ trivial to code a multi-producer multi-consumer queue using pthread APIs. (Although\
    \ there is only a single producer in our case.)\n\nThe relevant thread primitives\
    \ are pthread_mutex_t and pthread_cond_t; they are called the mutex and the condition\
    \ variable respectively. If you are unfamiliar with them, it is advised to get\
    \ some education on multi-threading after reading this chapter. (Such as manpages\
    \ of the pthread APIs, textbooks on operating systems, online courses, etc.)\n\
    \n+   * The queue is accessed by multiple threads (both the producer and consumers),\
    \ so it needs the protection of a mutex, obviously.\n\n+   * The consumer threads\
    \ should be sleeping when idle, and only be woken up when the queue is not empty,\
    \ this is the job of the condition variable.\n\nThe thread pool data type is defined\
    \ as follows:\n\n```\nstruct Work {\n    void (*f)(void *) = NULL;\n    void *arg\
    \ = NULL;\n};\n\nstruct ThreadPool {\n    std::vector<pthread> threads;\n    std::deque<Work>\
    \ queue;\n    pthread_mutex_t mu;\n    pthread_cond_t not_empty;\n};\n```"
