    \ says: 1 cmd\n\n- 07_client.cpp\n- 07_server.cpp\n\n# 第2部分：核心主题\n\n学习更多网络编程和数据结构。\n\
    \n# 08 数据结构：哈希表\n\n本章填充了上一章的占位符。我们开始实现哈希表。哈希表通常用于存储未知数量的键值数据，不需要排序。哈希表有两种类型：链法和开放寻址。它们的主要区别在于冲突解决。开放寻址在冲突时寻找另一个空位，而链法通过链表冲突。我们使用的哈希表是固定设计的。链法哈希表很容易实现，不需要很多。\n\
    \n我们的数据类型定义：\n\n```cpp\n// 哈希表节点，嵌入负载中\nstruct HNode {\n    HNode *next = NULL;\n\
    \    uint64_t hash = 0;\n};\n```\n\n```cpp\n// 固定大小的哈希表\nstruct HTab {\n    HNode\
    \ **tab = NULL;\n    size_t mask = 0;\n    size_t size = 0;\n};\n```\n\n当哈希表的大小是2的幂时，索引操作是位掩码。\n\
    \n```cpp\n// n 必须是2的幂\nstatic void h_init(HTab *htab, size_t n) {\n    assert(n\
    \ > 0 && ((n - 1) & n) == 0);\n    htab->tab = (HNode **)malloc(sizeof(HNode *),\
    \ n);\n    htab->mask = n - 1;\n    htab->size = 0;\n}\n```\n\n```cpp\n// 哈希表插入\n\
    static void insert(HTab *htab, HNode *node) {\n    size_t pos = node->hash & htab->mask;\n\
    \    HNode *next = htab->tab[pos];\n    node->next = next;\n    htab->tab[pos]\
    \ = node;\n    htab->size++;\n}\n```\n\n查找子程序仅仅是列表遍历：\n\n```cpp\n// 哈希表查找子程序\n\
    // 注意返回值。它返回拥有目标节点的指针，可以用于删除目标节点。\nstatic HNode *lookup(HTab *htab, bool key,\
    \ bool (*cmp)(HNode *, HNode *)) {\n  if (!htab->tab) {\n    size_t pos = key\
    \ & htab->mask;\n    HNode *from = &htab->tab[pos];\n    while (*from) {\n   \
    \   if (cmp(*from, key)) {\n        return from;\n      }\n      from = &(*from)->next;\n\
    \    }\n    return NULL;\n  }\n}\n```\n\n删除很容易。注意指针使得代码可以是数组项或节点，但它不区分。\n\n```cpp\n\
    // 从链中移除节点\nstatic HNode *detach(HTab *htab, HNode **from) {\n    HNode *node\
    \ = *from;\n    *from = (*from)->next;\n    htab->size--;\n    return node;\n\
    }\n```\n\n我们的哈希表是固定大小的，当负载因子过高时我们需要迁移到更大的表。在 Redis 中使用哈希表时有一个额外的考虑。调整大型哈希表需要移动大量节点到新表，这会导致服务器阻塞一段时间。通过不一次性移动所有内容可以避免，而是保留两个哈希表并在它们之间逐渐移动。这是最终的哈希表接口：\n\
    \n```cpp\n// 真正的哈希表接口\n// 使用两个哈希表进行渐进式扩容。\nstruct HMap {\n    HTab ht1;\n    HTab\
    \ ht2;\n    size_t resizing_pos = 0;\n};\n```\n\n查找子程序现在有助于扩容：\n\n```cpp\nHNode\
    \ *hm_lookup(HMap *hmap, HNode *key, bool (*cmp)(HNode *, HNode *)) {\n    hm_help_resizing(hmap);\n\
    \    HNode *from = h_lookup(hmap->ht1, key, cmp);\n    if (!from) {\n        from\
    \ = h_lookup(hmap->ht2, key, cmp);\n    }\n    return from ? *from : NULL;\n}\n\
    ```\n\nhm_help_resizing 函数是逐渐移动节点的子程序：\n\n```cpp\nconst size_t k_resizing_work\
    \ = 128;\n\nstatic void hm_help_resizing(HMap *umap) {\n    if (umap->ht2.tab\
    \ == NULL) {\n        return;\n    }\n\n    size_t nwork = 0;\n    while (nwork\
    \ < k_resizing_work && umap->ht2.size > 0) {\n        // 从 ht2 扫描节点并移动到 ht1\n\
    \        HNode *from = &umap->ht2.tab[umap->resizing_pos];\n        if (!from)\
    \ {\n            umap->resizing_pos++;\n            continue;\n        }\n\n \
    \       h_insert(&umap->ht1, h_detach(&umap->ht2, from));\n        nwork++;\n\
    \    }\n\n    if (umap->ht2.size == 0) {\n        // 完成\n        free(umap->ht2.tab);\n\
    \        umap->ht2 = HTab();\n    }\n}\n```\n\n插入子程序会在表格变得太满时触发扩容：\n\n```cpp\n\
