    \ be bigger than its kids, and if so, swap it with the smallest kid so that the\
    \ parent–child constraint is satisfied. Now that one of the kids is bigger than\
    \ before, continue this process until reaching leaf.\n    - Its value is smaller:\
    \ likewise, swap it with its parent until reaching the root.\n4. New elements\
    \ are added to the end of the array as leaves. Maintain the constraint as above.\n\
    5. When removing an element from a heap, replace it with the last element in the\
    \ array, then maintain the constraint as its value was updated.\n\nThe code begins:\n\
