    \ And the rank of the root is obvious.\n\n> Q: Another sorted set application:\
    \ count the number of elements within a range. (also with a worst-case of O(log(n)).\n\
    \nHints:\n\nUse the rank of the node.\n\n## 13. The Heap Data Structure and the\
    \ TTL\n\n> Q: The heap-based timer adds O(log(n)) operations to the server, which\
    \ might be a bottleneck for a sufficiently large number of keys. Can you think\
    \ of optimizations for a large number of timers?\n\nHints:\n\nWe can make the\
    \ heap cache friendly by using the n-ary tree instead of the binary tree. Some\
    \ real-world project uses the quadtree which fits in 64-byte cache line. Also,\
    \ in our case, the TTL timers don't have to be fired at the exact time. We can\
    \ use a very coarse timestamp (such as round up to 1min resolution) for TTL timers,\
    \ and keys with the same timestamp can share the same timer. This reduces the\
    \ number of timers, but the timers are delayed so we need to check the expiration\
    \ time when accessing key\n\n> Q: The real Redis does not use sorting for expiration,\
    \ find out how it is done, and list pros and cons of both approaches.\n\nHints:\n\
    \nTaking the idea that keys don't need to be expired at the exact time, Redis\
    \ samples key space at random to find dead keys. The higher ratio of dead keys,\
    \ the easier to find and eliminate them.\n\nThe pros of this approach are:\n\n\
    - 1. It doesn't require extra space.\n- 2. The concept is simple, and the implementation\
    \ is easy.\n\nThe cons:\n\n- 1. It requires keys with a TTL should not be mixed\
    \ with keys without a TTL, otherwise, the non-TTL keys interfere with the sampling,\
    \ making it harder to find dead keys. This can be a source of surprise for operators.\n\
    - 2. While the concept is simple, the implementation uses some heuristics to determine\
    \ the rate of the sampling. If the heuristic is not tuned properly, in a worse-case,\
    \ the server might not be removing dead keys fast enough, leading to excessive\
    \ memory usage, which may frustrate the operator.\n\n## 14. The Thread Pool &\
    \ Asynchronous Tasks\n\n> Q: Implement the condition variable using only mutexes.\
