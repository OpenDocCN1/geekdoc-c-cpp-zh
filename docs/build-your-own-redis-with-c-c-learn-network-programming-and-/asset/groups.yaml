    - zset.cpp\n- zset.h\n\n# 14. The Thread Pool & Asynchronous Tasks\n\nThere is\
    \ a flaw in our server since the introduction of the sorted set data type: the\
    \ deletion of keys. If the size of a sorted set is huge, it can take a long time\
    \ to free its nodes and the server is stalled during the destruction of the key.\
    \ This can be easily fixed by using multi-threading to move the destructor away\
    \ from the main thread.\n\nFirstly, we introduce the \"thread pool\", which is\
    \ literally a pool of threads. The thread from the pool consumes tasks from a\
    \ queue and executes them. It is trivial to code a multi-producer multi-consumer\
    \ queue using pthread APIs. (Although there is only a single producer in our case.)\n\
    \nThe relevant thread primitives are pthread_mutex_t and pthread_cond_t; they\
    \ are called the mutex and the condition variable respectively. If you are unfamiliar\
    \ with them, it is advised to get some education on multi-threading after reading\
    \ this chapter. (Such as manpages of the pthread APIs, textbooks on operating\
    \ systems, online courses, etc.)\n\n- The queue is accessed by multiple threads\
    \ (both the producer and consumers), so it needs the protection of a mutex, obviously.\n\
    - The consumer threads should be sleeping when idle, and only be woken up when\
    \ the queue is not empty, this is the job of the condition variable.\n\nThe thread\
    \ pool data type is defined as follows:\n\n```cpp\nstruct Work {\n  void (*f)(void\
    \ *) = NULL;\n  void *arg = NULL;\n};\n\nstruct ThreadPool {\n  std::vector<pthread_t>\
    \ threads;\n  std::deque<Work> queue;\n  pthread_mutex_t mu;\n  pthread_cond_t\
    \ not_empty;\n};\n```\n\n14. The Thread Pool & Asynchronous Tasks\n\nThe `thread_pool_init`\
    \ is for initialization and starting threads.\n\n```cpp\nvoid thread_pool_init(ThreadPool\
    \ *tp, size_t num_threads) {\n  pthread_mutex_init(&tp->mu, NULL);\n  pthread_cond_init(&tp->not_empty,\
    \ NULL);\n\n  tp->threads.resize(num_threads);\n  for (size_t i = 0; i < num_threads;\
    \ ++i) {\n    pthread_create(&tp->threads[i], NULL, worker, tp);\n  }\n}\n```\n\
    \nThe consumer code:\n\n```cpp\nstatic void *worker(void *arg) {\n  ThreadPool\
    \ *tp = (ThreadPool *)arg;\n  while (true) {\n    pthread_mutex_lock(&tp->mu);\n\
    \    // wait for the condition: a non-empty queue\n    while (tp->queue.empty())\
    \ {\n      pthread_cond_wait(&tp->not_empty, &tp->mu);\n    }\n\n    // got the\
    \ job\n    Work w = tp->queue.front();\n    tp->queue.pop_front();\n    pthread_mutex_unlock(&tp->mu);\n\
    \n    // do the work\n    w.f(arg);\n  }\n  return NULL;\n}\n```\n\nThe producer\
    \ code:\n\n```cpp\nvoid thread_pool_push(ThreadPool *tp, Work w) {\n  pthread_mutex_lock(&tp->mu);\n\
    \  tp->queue.push_back(w);\n  pthread_cond_signal(&tp->not_empty);\n  pthread_mutex_unlock(&tp->mu);\n\
    }\n```\n\nThe explanation:\n\n1. For both the producer and consumers, the queue\
    \ access code is surrounded by the pthread_mutex_lock and the thread_mutex_unlock.\n\
    2. After a consumer acquired the mutex, check the queue:\n    * If the queue is\
    \ not empty, grab a job from the queue, release the mutex and do the work.\n \
    \   * Otherwise, release the mutex and go to sleep, the sleep can be awakened\
    \ later by the condition variable.\n3. After the producer puts a job into the\
    \ queue, the producer calls the pthread_cond_signal to wake up a potentially sleeping\
    \ consumer.\n"
