    \ Redis is as cache servers, and one way to manage the size of the cache is through\
    \ explicitly setting TTLs (time to live). TTLs can be implemented using timers.\
    \ Unfortunately, timers in the last chapter are of fixed value (using linked lists);\
    \ thus, a sorting data structure is needed for implementing arbitrary and mutable\
    \ timeouts; and the heap data structure is a popular choice. Compared with the\
    \ AVL tree we used before, the heap data structure has the advantage of using\
    \ less space.\n\nA quick review of the heap data structure:\n\n+   1. A heap is\
    \ a binary tree, packed into an array; and the layout of the tree is fixed. The\
    \ parent–child relationship is implicit, pointers are not included in heap elements.\n\
    2. The only constraint on the tree is that parents are no bigger than their kids.\n\
    3. The value of an element can be updated. If the value changes:\n    * Its value\
    \ is bigger than before: it may be bigger than its kids, and if so, swap it with\
    \ the smallest kid, so that the parent–child constraint is satisfied again. Now\
    \ that one of the kids is bigger than before, continue this process until reaching\
    \ a leaf.\n    * Its value is smaller: likewise, swap it with its parent until\
    \ reaching the root.\n4. New elements are added to the end of the array as leaves.\
    \ Maintain the constraint as above.\n5. When removing an element from a heap,\
    \ replace it with the last element in the array, then maintain the constraint\
    \ as its value was updated.\n\nThe code listing begins:\n\n```\nstruct HeapItem\
    \ {\n    uint64_t val = 0;\n    size_t *ref = NULL;\n};\n// the structure for\
    \ the key\nstruct Entry {\n    struct HNode node;\n    std::string key;\n```"
