    # 03. Hello 服务器/客户端


    本章继续 socket 编程的介绍。我们将 2 个简单的程序来演示这些系统调用。


    首先，我们需要获取一个 socket fd：`int fd = socket(AF_INET, SOCK_STREAM, 0);`


    `AF_INET` 用于 IPv4，`AF_INET6` 用于 IPv6 或双栈 socket。为了简单，我们在书中将一直使用 `AF_INET`。


    `SOCK_STREAM` 用于 TCP。我们在书中不会使用除 TCP 以外的任何东西。`socket()` 用的三个参数在书中是固定的。


    接下来，我们将引入一个新的调用：


    ```c

    int val = 1;

    setsockopt(fd, SOL_SOCKET, SO_REUSEADDR, &val, sizeof(val));

    ```


    `setsockopt()` 用于配置 socket 的各种方面。这个特定的调用开启了 `SO_REUSEADDR` 。如果没有这个选项，服务器重启将无法绑定同一个地址。练习题：找出到底什么是
    `SO_REUSEADDR` 以及为什么需要它。


