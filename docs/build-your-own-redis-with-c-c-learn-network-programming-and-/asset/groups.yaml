  - "[PAGE 98]\n\n# 2023-01-31 14. The Thread Pool & Asynchronous Tasks\n\ncould be\
    \ changed by other consumers before the awakening consumer grabs the mutex, the\
    \ mutex is not transferred from the signaler to the to-be-waked consumer! It is\
    \ probably a mistake if you see a condition variable used without a loop.\n\n\
    A concrete sequence to help you understand the use of condition variables:\n\n\
    +   1. The producer signals.\n2. The producer releases the mutex.\n3. Some consumer\
    \ grabs the mutex and empties the queue.\n4. A consumer wakes up from the producer's\
    \ signal and grabs the mutex, but the queue is empty!\n\nNote that the `pthread_cond_signal`\
    \ doesn't need to be protected by the mutex, signaling after releasing the mutex\
    \ is also correct.\n\nThe thread pool is done. Let's add that to our server:\n\
    \n```\n// global variables\nstatic struct {\n    HMap db;\n    // a map of all\
    \ client connections, keyed by fd\n    std::vector<Conn *> fd2conn;\n    // timers\
    \ for idle connections\n    DList id_list;\n    // timers for TTLs\n    std::vector<HeapItem>\
    \ heap;\n    // the thread pool\n    ThreadPool tp;\n} g_data;\n```\n\nInside\
    \ the `main` function:\n\n```\n// some initializations\ndlist_init(&g.data.id_list);\n\
    thread_pool_init(&g.data.tp, 4);\n```\n\nThe `entry_del` function is modified:\
    \ It will put the destruction of large sorted sets into the thread pool. The thread\
    \ pool is only for the large ones since multi-threading has some overheads too.\n\
