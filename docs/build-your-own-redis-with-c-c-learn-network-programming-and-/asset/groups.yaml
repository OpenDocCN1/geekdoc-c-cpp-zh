    \ // 线程池\n         tp;\n} g_data;\n```\n\n在 `main` 函数内部：\n\n```cpp\n// 一些初始化\n\
    dlist_init(&g.data.id_list);\nthread_pool_init(&g.data.tp, 4);\n```\n\n`entry_del`\
    \ 函数被修改了：它会将大型有序集合的销毁放入线程池。线程池仅用于大型集合，因为多线程本身也有一些开销。\n\n```cpp\n// 立即释放内存\nstatic\
