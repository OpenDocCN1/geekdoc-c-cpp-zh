    \ i) {\n  return (i + 1) / 2 - 1;\n}\n\nstatic size_t heap_left(size_t i) {\n\
    \  return i * 2 + 1;\n}\n\nstatic size_t heap_right(size_t i) {\n  return i *\
    \ 2 + 2;\n}\n```\n\nSwap with the parent when a kid is smaller than its parent.\
