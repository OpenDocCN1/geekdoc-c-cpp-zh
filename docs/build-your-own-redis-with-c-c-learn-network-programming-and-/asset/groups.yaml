- md: "\n# 11. The AVL Tree and the Sorted Set\n\n```cpp\nreturn zl->len < len;\n\n\
    static bool zless(AVLNode *lhs, AVLNode *rhs) {\n  ZNode *zr = container_of(rhs,\
    \ ZNode, tree);\n  return zless(lhs, zr->score, zr->name, zr->len);\n}\n```\n\n\
    The insertion/update subroutines:\n\n```cpp\n// update the score of an existing\
    \ node (AVL tree reinsertion)\nstatic void zset_update(ZSet *zset, ZNode *node,\
    \ double score) {\n  if (node->score == score) {\n    return;\n  }\n  zset->tree\
    \ = avl_del(&node->tree);\n  node->score = score;\n  avl_init(&node->tree);\n\
    \  tree_add(zset, node);\n}\n```\n\n```cpp\n// add a new (score, name) tuple,\
    \ or update the score of the existing node\nbool zset_add(ZSet *zset, const char\
    \ *name, size_t len, double score) {\n  ZNode *node = zset_lookup(zset, name,\
    \ len);\n  if (node) {\n    zset_update(zset, node, score);\n    return false;\n\
    \  } else {\n    node = znode_new(name, len, score);\n    hm_insert(&zset->hmap,\
    \ &node->hmap);\n    tree_add(zset, node);\n    return true;\n  }\n}\n```\n\n\
    ```cpp\n// lookup by name\nZNode zset_lookup(ZSet *zset, const char *name, size_t\
    \ len) {\n// just a hashtable look up\n// code omitted...\n}\n```\n\nHere is the\
    \ primacy case of sorted sets: the range query.\n\n```cpp\n// find the (score,\
    \ name) tuple that is greater or equal to the argument,\n// then offset relative\
    \ to it.\nNode* zset_query(ZSet *zset, double score, const char *name, size_t\
    \ len, int64_t offset) {\n  AVLNode *found = NULL;\n  AVLNode *cur = zset->tree;\n\
    \  while (cur) {\n    if (zless(cur, score, len)) {\n      cur = cur->right;\n\
    \    } else {\n      found = cur; // candidate\n      cur = cur->left;\n    }\n\
    \  }\n  if (found) {\n    found = avl_offset(found, offset);\n  }\n  return found\
    \ ? container_of(found, ZNode) : NULL;\n}\n```\n\nThe range query is just a regular\
    \ tree lookup, followed by an offset operation. The offset operation is what makes\
    \ the sorted set special, it is not a regular binary tree walk. Let's review AVLNode:\n\
    \n```cpp\nstruct AVLNode {\n    uint32_t depth = 0;\n    uint32_t cnt = 0;\n \
    \   AVLNode *left = NULL;\n    AVLNode *right = NULL;\n    AVLNode *parent = NULL;\n\
    };\n```\n\nIt has an extra `cnt` field (the size of the subtree), which was explained\
    \ in the previous chapter. It is used by the `avl_offset` function:\n\n```cpp\n\
    // offset into the succeeding or preceding node.\n// note: the worst-case is O(log\
    \ n) regardless of how long the offset is.\nAVLNode* avl_offset(AVLNode *node,\
    \ int64_t offset) {\n    int64_t pos = 0; // relative to the starting node\n \
    \   while (offset != 0) {\n        if (pos < offset && node->right->cnt >= offset)\
    \ {\n            // the target is inside the right subtree\n            node =\
    \ node->right;\n            pos += node->left->cnt + 1;\n        } else if (pos\
    \ > offset && node->left->cnt <= offset) {\n            // the target is inside\
    \ the left subtree\n            node = node->left;\n            pos += node->right->cnt\
    \ + 1;\n        } else {\n            // go to the parent\n            AVLNode\
    \ *parent = node->parent;\n            if (!parent) {\n                return\
    \ NULL;\n            }\n            if (parent->right == node) {\n           \
    \     pos -= node->left->cnt + 1;\n            }\n            node = parent;\n\
    \        }\n    }\n    return node;\n}\n```\n\nWith the size information embedded\
    \ in the node, we can determine whether the offset is inside a subtree or not.\
    \ The offset operation runs in two phases: firstly, it walks up the tree if the\
    \ target is not in a subtree, it walks down the tree until the target is met.\
    \ The worst-case is O(log n) regardless of how long the offset is, which is better\
    \ than offsetting by walking to the succeeding node by one. Redis uses a similar\
    \ technique for skip lists. It is a good idea to implement and test the new `avl_offset`\
    \ function now.\n\n```cpp\nstatic void test_case(uint32_t sz) {\n  Container c;\n\
    \  for (uint32_t i = 0; i < sz; ++i) {\n    add(c, i);\n  }\n\n  AVLNode *min\
    \ = c.root;\n  while (min->left) {\n    min = min->left;\n  }\n  for (uint32_t\
    \ i = 0; i < sz; ++i) {\n    AVLNode *node = avl_offset(min, (int64_t)i);\n  \
    \  assert(container_of(node, Data)->val == i);\n\n    for (uint32_t j = 0; j <\
    \ sz; ++j) {\n      int64_t offset = (int64_t)j - (int64_t)i;\n      AVLNode *n2\
    \ = avl_offset(node, offset);\n      assert(container_of(n2, Data)->val == j);\n\
    \    }\n    assert(!avl_offset(node, (int64_t)i - 1));\n    assert(!avl_offset(node,\
    \ sz - i));\n  }\n\n  dispose(c.root);\n}\n```\n\nFor now, we have implemented\
    \ major functionalities of the sorted set. Let’s add the sorted type to our server.\n\
    \n```cpp\nenum {\n    T_STR = 0,\n    T_ZSET = 1,\n};\n\n// the structure for\
    \ the key\nstruct Entry {\n    struct HNode node;\n    std::string key;\n    std::string\
    \ val;\n    uint32_t type = 0;\n    ZSet *zset = NULL;\n};\n```\n\nThe rest of\
    \ the code is considered trivial, which will be omitted in the code listing. Adding\
    \ a Python script for testing new commands:\n\n```python\nCASES = r'''\n$ ./client\
    \ zscore asdf nil\n(nil)\n$ ./client zquery xxx 1 asdf 1 10\n(arr) len=0\n(arr)\
    \ end\n# more cases...\n...\n\nimport shlex\nimport subprocess\n\ncmds = []\n\
    outputs = []\nlines = CASES.splitlines()\nfor x in lines:\n    x = x.strip()\n\
    \    if not x:\n        continue\n    if x.startswith('$ '):\n        cmds.append(x[2:])\n\
    \        outputs.append('')\n    else:\n        outputs[-1] = outputs[-1] + x\
    \ + '\\n'\n'''\n\nassert len(cmds) == len(outputs)\nfor cmd, expect in zip(cmds,\
    \ outputs):\n    out = subprocess.check_output(shlex.split(cmd)).decode('utf-8')\n\
    \    assert out == expect, f'cmd:{cmd} out:{expect}'\n```\n\nExercises:\n\n1.\
    \ The `avl_offset` function gives the ability to query sorted set by rank, reverse\
    \ a node in an AVL tree, find its rank, with a worst-case of **O(log(n))**. (This\
    \ is the zcommand).\n2. Another sorted set application: count the number of elements\
    \ within a range. (also with a worst-case of **O(log(n))**).\n3. The **11_server.cpp**\
    \ file already contains some shlex commands, trying adding more.\n\n# 12. The\
    \ Event Loop and Timers\n\nThere is one major thing missing in our server: timeouts.\
    \ Every networked application needs to handle timeouts since the other side of\
    \ network can just disappear. Not only do ongoing operations like read/write need\
    \ timeouts, but it is also a good idea to kick idle connections. Looking at our\
    \ event loop code:\n\n```cpp\nint rv = poll(poll_args.data(), (nfds_t)poll_args.size(),\
    \ 1000);\n```\n\nThe `poll` syscall takes a timeout argument, which imposes an\
    \ upper bound of time on the poll. The timeout value is currently an arbitrary\
    \ value of 1000 ms. If we set the timeout value according to the timer, poll should\
    \ wake up at the time it expires, or before that we have a chance to fire the\
    \ timer.\n\nThe problem is that we have more than one timer, the timeout value\
    \ of poll should be the value of the nearest timer. Some data structure is needed\
    \ for finding the nearest timer. The heap data structure is a popular choice for\
    \ finding the min/max value and is often used for such purpose. Also, any data\
    \ structure for sorting can be used. For example, we can use the AVL tree to order\
    \ timers and possibly augment the tree to keep track of the minimum value.\n"
