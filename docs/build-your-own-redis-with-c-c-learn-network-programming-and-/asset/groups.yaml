    首先，我们需要获取一个 socket fd：`int fd = socket(AF_INET, SOCK_STREAM, 0);` Redis 是服务器/客户端系统的示例。多个客户端连接到一个服务器，服务器接收来自
    TCP 连接的请求并发送响应。在开始 socket 编程之前，我们需要学习几个 Linux 系统调用。


