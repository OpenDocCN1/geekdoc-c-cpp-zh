    - 07_server.cpp\n\n# PART 2. ESSENTIAL TOPICS\n\nLearn more network programming\
    \ and data structures.\n\n# 08. Data Structure: Hashtables\n\nThis chapter fills\
    \ the placeholder in the last chapter. We start by implementing hashtable. Hashtables\
    \ are often the obvious data structure for holding unknown amount of key-value\
    \ data that does not require ordering. There are two kinds of hashtables: chaining\
    \ and open addressing. Their primary difference is collision resolution. Open\
    \ addressing seeks another free slot in the event of collision while chaining\
    \ conflicts with a linked list. There are many variants of open addressing due\
    \ to the need to find free slots, while the hashtable used in our server is a\
    \ fixed design. A chaining hashtable is easy; it does not require much.\n\nThe\
    \ definition of our data types:\n\n```cpp\n// hashtable node, should be embedded\
    \ into the payload\nstruct HNode {\n    HNode *next = NULL;\n    uint64_t hash\
    \ = 0;\n};\n```\n\n```cpp\n// a fixed-sized hashtable\nstruct HTab {\n    HNode\
    \ **tab = NULL;\n    size_t mask = 0;\n    size_t size = 0;\n};\n```\n\nWhen the\
    \ size of hashtable is the power of two, the indexing operation is a simple bit\
    \ mask.\n\n```cpp\n// n must be power of 2\nstatic void h_init(HTab *htab, size_t\
    \ n) {\n    assert(n > 0 && ((n - 1) & n) == 0);\n    htab->tab = (HNode **)malloc(sizeof(HNode\
    \ *), n);\n    htab->mask = n - 1;\n    htab->size = 0;\n}\n```\n\n```cpp\n//\
    \ hashtable insertion\nstatic void insert(HTab *htab, HNode *node) {\n    size_t\
    \ pos = node->hash & htab->mask;\n    HNode *next = htab->tab[pos];\n    node->next\
    \ = next;\n    htab->tab[pos] = node;\n    htab->size++;\n}\n```\n\nThe lookup\
    \ subroutine is simply a list traversal:\n\n```cpp\n// hashtable lookup subroutine.\n\
    // Pay attention to the return value. It returns the address of\n// the pointer\
    \ that owns the target node, which can be used to delete the target node.\nstatic\
    \ HNode *lookup(HTab *htab, bool key, bool (*cmp)(HNode *, HNode *)) {\n  if (!htab->tab)\
    \ {\n    size_t pos = key & htab->mask;\n    HNode *from = &htab->tab[pos];\n\
    \    while (*from) {\n      if (cmp(*from, key)) {\n        return from;\n   \
    \   }\n      from = &(*from)->next;\n    }\n    return NULL;\n  }\n}\n```\n\n\
    Deleting is easy. Notice how the use of pointers enables the code to be either\
    \ an item of the array or a node, yet it doesn't differentiate.\n\n```cpp\n//\
    \ remove a node from the chain\nstatic HNode *detach(HTab *htab, HNode **from)\
    \ {\n    HNode *node = *from;\n    *from = (*from)->next;\n    htab->size--;\n\
    \    return node;\n}\n```\n\nOur hashtable is fixed in size, we need to migrate\
    \ to a bigger one when the load factor is too high. There is an extra consideration\
    \ when using hashtables in Redis. Resizing a large hashtable requires moving a\
    \ lot of nodes to a new table, which can stall the server for some time. This\
    \ shall be avoided by not moving everything at once, instead, we keep two hashtables\
    \ and gradually move them between them. Here is the final hashtable interface:\n\
    \n```cpp\n// the real hashtable interface.\n// it uses two hashtables for progressive\
    \ resizing.\nstruct HMap {\n    HTab ht1;\n    HTab ht2;\n    size_t resizing_pos\
    \ = 0;\n};\n```\n\nThe lookup subroutine now helps with resizing:\n\n```cpp\n\
    HNode *hm_lookup(HMap *hmap, HNode *key, bool (*cmp)(HNode *, HNode *)) {\n  \
    \  hm_help_resizing(hmap);\n    HNode *from = h_lookup(hmap->ht1, key, cmp);\n\
    \    if (!from) {\n        from = h_lookup(hmap->ht2, key, cmp);\n    }\n    return\
    \ from ? *from : NULL;\n}\n```\n\nThe hm_help_resizing function is the subroutine\
    \ for gradually moving nodes:\n\n```cpp\nconst size_t k_resizing_work = 128;\n\
    \nstatic void hm_help_resizing(HMap *umap) {\n    if (umap->ht2.tab == NULL) {\n\
    \        return;\n    }\n\n    size_t nwork = 0;\n    while (nwork < k_resizing_work\
    \ && umap->ht2.size > 0) {\n        // scan for nodes from ht2 and move them to\
    \ ht1\n        HNode *from = &umap->ht2.tab[umap->resizing_pos];\n        if (!from)\
    \ {\n            umap->resizing_pos++;\n            continue;\n        }\n\n \
    \       h_insert(&umap->ht1, h_detach(&umap->ht2, from));\n        nwork++;\n\
    \    }\n\n    if (umap->ht2.size == 0) {\n        // done\n        free(umap->ht2.tab);\n\
    \        umap->ht2 = HTab();\n    }\n}\n```\n\nThe insertion subroutine will trigger\
