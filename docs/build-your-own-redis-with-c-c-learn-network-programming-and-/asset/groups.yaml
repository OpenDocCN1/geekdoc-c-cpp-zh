    - hashtable.h\n\n# 10. AVL树：实现与测试\n\n虽然 Redis 通常被认为是一个键值存储器，但 Redis 的“值”部分不仅限于纯字符串、列表、哈希表，而有序集合（sorted\
    \ sets）是非常有用的东西。由于其丰富的数据结构，Redis 也被称为“数据服务器”。Redis 经常用作内存缓存，当存储在内存中时，具有自由使用数据结构的优势。Redis\
    \ 中的有序集合数据结构是非常独特且实用的。它不仅提供了对数据进行顺序排序的能力，还具有按排名查询的特性。如果你将 2000 万条记录放入有序集合，你可以获取排名第\
    \ 1000 万的记录，而无需遍历前 1000 万条记录，这是当前 SQL 数据库无法实现的壮举。\n\n正如“有序集合”的名称所示，它是一种用于排序的数据结构。树、平衡二叉树是存储已排序数据的流行数据结构。在各种数据结构中，作者发现\
    \ AVL 树特别简单且易于编码，它将在本书书中用于实现有序集合。真实的 Redis 项目使用了 skiplist，它也被认为是易于编码的。\n\nAVL树的思想是限制左子树和右子树之间的高度差。子树的高度差被限制为最多一个；从\
    \ AVL 树中插入/删除节点时，高度差可能会暂时达到二，然后通过节点旋转来修复。旋转操作是平衡二叉树的基础，也用于红黑树（RB tree）等其他平衡树。旋转后，子树高度差为二的节点将回减到最多一。\n\
    \n让我们从树节点开始：\n\n```c\nstruct AVLNode {\n  uint32_t depth = 0;\n  uint32_t cnt\
    \ = 0;\n  AVLNode *left = NULL;\n  AVLNode *right = NULL;\n  AVLNode *parent =\
    \ NULL;\n};\n\nstatic void avl_init(AVLNode *node) {\n```\n\n```c\nnode->depth\
    \ = 1;\nnode->cnt = 1;\nnode->left = node->right = node->parent = NULL;\n}\n```\n\
    \n这是一个带有额外字段普通二叉树。`depth` 字段是树的高度。`cnt` 字段是树的大小，这个字段并不是 AVL 树特有的，它用于实现基于排名的查询，将在下一章中解释。\n\
    \n列出一些辅助函数：\n\n```c\nstatic uint32_t avl_depth(AVLNode *node) {\n  return node\
    \ ? node->depth : 0;\n}\n```\n\n```c\nstatic uint32_t avl_cnt(AVLNode *node) {\n\
    \  return node ? node->cnt : 0;\n}\n```\n\n```c\nstatic uint32_t max(uint32_t\
    \ lhs, uint32_t rhs) {\n  return lhs < rhs ? rhs : lhs;\n}\n```\n\n```c\n// 更新深度\
    \ 和 cnt 字段\nstatic void avl_update(AVLNode *node) {\n  node->depth = 1 + max(avl_depth(node->left),\
    \ avl_depth(node->right));\n  node->cnt = 1 + avl_cnt(node->left) + avl_cnt(node->right);\n\
    }\n```\n\n节点旋转代码：\n\n```c\nstatic AVLNode *rot_left(AVLNode *node) {\n  AVLNode\
    \ *new_node = node->right;\n  if (new_node->left) {\n    new_node->left->parent\
    \ = node;\n  }\n  node->right = new_node->left;\n}\n```\n\n```c\nnew_node->left\
    \ = node;\nnew_node->parent = node->parent;\nnode->right = new_node->left;\navl_update(node);\n\
    avl_update(new_node);\nreturn new_node;\n}\n```\n\n```c\nstatic AVLNode *rot_right(AVLNode\
    \ *node) {\n  AVLNode *new_node = node->left;\n  if (new_node->right) {\n    new_node->right->parent\
    \ = node;\n  }\n  node->left = new_node->right;\n}\n```\n\n```c\nnew_node->right\
    \ = node;\nnew_node->parent = node->parent;\nnode->left = new_node->right;\navl_update(node);\n\
    avl_update(new_node);\nreturn new_node;\n}\n```\n\n修复子树高度差为二的节点 `avl_left` 和 `avl_right`\
    \ 函数用于：\n\n```c\n// 左子树过深\nstatic AVLNode *avl_left(AVLNode *root) {\n  if (avl_depth(root->left->right)\
    \ > avl_depth(root->left->left)) {\n    root->left = rot_left(root->left);\n \
    \ }\n  return rot_right(root);\n}\n```\n\n```c\n// 右子树过深\nstatic AVLNode *avl_right(AVLNode\
    \ *root) {\n  if (avl_depth(root->right->left) > avl_depth(root->right->right))\
    \ {\n    root->right = rot_right(root->right);\n  }\n  return rot_left(root);\n\
    }\n```\n\nAVL  函数在插入/删除操作后修复不平衡：\n\n```c\n// 修复不平衡节点直到到达根节点\nstatic AVLNode *avl_fix(AVLNode\
    \ *node) {\n    while (node) {\n        avl_update(node);\n        uint32_t l\
    \ = avl_depth(node->left);\n        uint32_t r = avl_depth(node->right);\n   \
    \     if (l > r + 1) {\n            if (avl_depth(node->left->right) > avl_depth(node->left->left))\
    \ {\n                node->left = rot_left(node->left);\n            }\n     \
    \       node = avl_right(node);\n        } else if (r > l + 1) {\n           \
    \ if (avl_depth(node->right->left) > avl_depth(node->right->right)) {\n      \
    \          node->right = rot_right(node->right);\n            }\n            node\
    \ = avl_left(node);\n        }\n        if (!node->parent) {\n            return\
    \ node;\n        }\n        node = node->parent;\n    }\n    return NULL;\n}\n\
    ```\n"
