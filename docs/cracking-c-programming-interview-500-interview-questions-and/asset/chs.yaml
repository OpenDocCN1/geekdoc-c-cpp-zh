  13. 编写一个 C 程序获取任何文件的大小。\n14. 编写一个 C 程序获取文件的类型。\n15. 编写一个 C 程序获取任何文件的权限。\n\n## 组\
  \ 2 解释\n\n1. **d**\n\n**解释：**\n\n![](img/Figure-3.1.jpg)\n\n**图 3.1：** 栈区中二维数组的表示\n\
  \n**二维数组：** 二维数组是 1 维数组的集合。数组的元素存储在内存中连续的地址上。在标准 C 编译器中，二维数组按行优先顺序存储（第 1 行，第 2 行，依此类推）。`a[1][2]`\
  \ 也可以写为 `*(*(a+1)+2)`。这里，`1` 表示跳过一行，`2` 表示跳过两列。第一个 `*`（配合 `a+1`）意味着选择特定的行，第二个 `*`\
  \ 意味着选择特定的列。`a+1` 的地址是 `1012`（跳过一行），`a+2` 的地址是 `1024`（跳过两行），依此类推。\n\n例如：获取 `a[1][2]`\
  \ 或 `*(*(a+1)+2)`？\n\n`(a+1)` 意味着我们跳过了第一行，并选择了地址为 `1012` 的第二行。`*(a+1)+2` 意味着我们在所选行中跳过了\
  \ 2 个元素。`(*(a+1)+2)` 的地址为 `1020`。`*(*(a+1)+2)` 是在跳过一行和一列中的两个元素后选择一个元素。它得到了 `a[1][2]`\
  \ 的一个特定元素，值为 9。\n\n2. **c**\n\n**解释：** 这是一个函数指针的概念。C 允许创建能够存储函数地址的指针。在给定的程序中，`p`\
  \ 是指向函数 `f()` 的指针。需要注意的是，`p` 的类型必须与函数 `f()` 的类型相同。一旦指针开始指向函数，我们就可以使用该指针调用函数，并像第\
  \ 2 行所示那样传递参数。因此，程序没有错误。\n\n3. **d**\n\n**解释：** 这是一个简单的递归程序，不需要解释。\n\n4. **a**\n\
  \n**解释：** 函数指针可以用两种方式应用（第 4 行和第 5 行）。参见问题 2 的解释。\n\n5. **无**\n\n**解释：** `extern`\
  \ 也用于使变量/函数变为全局的。函数默认始终是全局的。在函数前加上 `extern` 没有任何区别。\n\n6. **无**\n\n**解释：** `static`\
  \ 意味着函数不能从其他 C 文件访问。它不能与其他 C 程序共享。对 静态函数/变量的访问限制在声明它们的文件中。在 C 中，`static` 提供了文件级封装。静态变量/函数的作用域在一个文件内。如果变量在某个函数内部声明为\
  \ `static`，则该变量的作用域仅在函数内部，但通过该静态变量的地址，我们也可以在程序中的其他函数中访问它，但限于同一个程序内。静态变量/函数的生命周期持续到\
  \ `main()` 退出。\n\n7. **d**\n\n**解释：** 该程序正在计算一个数字各位数字的和。`fun(number, &var);` 将数字各位数字存储在\
  \ `main()` 中声明的变量 `var` 中。\n\n8. **c**\n\n**解释：** 在函数 `fun()` 中，变量 `count` 是静态的，`count`\
  \ 的内存在一个数据区分配一次。`main()` 多次调用 `fun()`，`fun()` 在每次调用时更新 `count`。`count` 值的变化发生在相同的地址。此程序返回\
  \ 4 的和。\n\n9. **c**\n\n**解释：** 这是一个简单的递归程序，只需追踪即可。不需要解释。\n\n*提示*：在给定的函数 `fun()`\
  \ 中，`\"return 5;\"` 语句永远不会执行。\n\n10. **c**\n\n**解释：** 在给程序中，`else` 与第 3 行的 `if`\
  \ 语句关联，而不是第 2 行的 `if` 语句。\n\n11. **b**\n\n**解释：** 在 C 中，`sizeof()` 运算符返回无符号整数值。在第\
  \ 1 行，无符号整数和默认整数（符号）值正在进行比较。关系运算符只允许在相同数据类型之间进行比较。因此，标准 C 编译器将符号整数提升为无符号整数。无符号整数中的\
