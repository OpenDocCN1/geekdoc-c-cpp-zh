  像 Intel 和 AMD 的常用机器使用小序。这意味着低位字节存储在高内存地址，高位字节存储在低内存地址。整数 258 的二进制形式可以表示为（MSB）00000001\
  \ 00000010（LSB），在小序机器中，存储如下：\n\nMSB 存储在低地址\n\n| 00000000 | 00000000 | 00000001 |\
  \ 00000010 |\n| :--- | :--- | :--- | :--- |\n| 1000 | 1001 | 1002 | 1003 |\n\nLSB\
  \ 存储在高地址\n\n**图 3.3：** 小序模式下的整数表示\n\n**大序（Big-Endian）：** 与小序相反，这里低位字节存储在低地址，高位字节存储在高地址。258\
  \ 在大序机器中的表示如下：\n\nLSB 存储在低地址地址\n\n| 00000010 | 00000001 | 00000000 | 00000000 |\n\
  | :--- | :--- | :--- | :--- |\n| 1000 | 1001 | 1002 | 1003 |\n\nMSB 存储在高地址\n\n**图\
  \ 3.4：** 大序模式下的整数表示\n\n几乎所有用于编程的机器 Intel、 AMD 都遵循小序。在这里我们担心的是概念误解。实际上，这些机器是小小序，但如果我们想通过\
  \ C 程序追踪数组、结构体等地址，将会困难。但如果考虑大序，通过 C 程序追踪内存地址总是很容易的。`int a[3] = {5, 6, 7};` 在遵循小序的机器中存储如下：\n\
