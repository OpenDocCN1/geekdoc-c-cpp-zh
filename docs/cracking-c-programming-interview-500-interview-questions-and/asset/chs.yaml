  \ **以下程序的输出结果是什么？**\n\n```c\n#include<stdio.h>\nint a;\nvoid q(int c);\nvoid p(int\
  \ *b);\n...\n{\n    c-=a;\n    printf(\"%d, \", c);\n}\n...\n```\n\n\n\n\n\n- 因此，变量\
  \ `b` 的地址在 `fun()` 执行完成后就不再有效。如果我们尝试访问 `b`，无法保证赋值给 `b` 的值是否仍然存在。有时它可能还在那里，有时它可能会被其他函数调用覆盖。这取决于编译器的实现。\n\
  - 就像在 Turbo C 中一样，它会报错；而在 gcc 编译器中，它只会给出一个警告。\n\n### 2. 解释：使用静态内存分配\n`b` 的内存被分配在数据区（data\
  \ area）中，现在 `fun()` 返回该地址，该地址在 `fun()` 执行完成后仍然可用。它不会抛出任何错误。\n\n正如我们在“C 语言简介”章节中所讨论的，数据区域在所有函数之间共享共享。\n\
  \n```c\nint *fun()\n{\n    static int b = 10;\n    return &b;\n}\n```\n\n**使用动态内存分配**\
  \ 这里，`b` 的内存是动态分配的，位于堆区域（heap area）中。现在变量 `b` 持有堆内存的地址。\n\n正如我们已经讨论过的，堆区域在所有函数之间也是共享的。\n\
  \n```c\nint *fun()\n{\n    int *b = (int *)malloc(sizeof(int));\n    return b;\n\
  }\n```\n\n![](img/Figure-2.2.jpg)\n\n**图 2.2：** C 程序的内存布局\n\n### 3. b\n**解释：** `void`\
  \ 指针是一种通用指针类型。它可以持有所有数据类型的地址。它在指针的实际数据类型暂时未知时使用，之后可能会被确定。在给定的代码中，我们正在使用 `void` 指针，它持有整数类型和字符类型的地址。\n\
  \n### 4. c\n**解释：** 不允许 `void` 数据类型，因为 `void` 数据类型的大小是的。它不能用作通用数据类型。\n\n### 5. b\n\
  **解释：** `malloc` 的内存是通过 `brk`（关键字）系统调用在堆区域中动态分配的。正如图 (i) 所示，`brk` 指向空闲（未分配）内存池。当我们调用\
  \ `malloc()` 函数时，`brk` 指针为 `p` 分配了 4B 的内存，其本身向右移动，并且 (ii) 也为分配的空间赋值了值 10。\n\n现在我们执行\
  \ `free(p)`，(iii) 由 `malloc` 分配的内存被释放，其内容变为零或 NULL，`brk` 返回到其之前的位置。我们可以注意到 `p` 仍然指向相同的地址（图\
  \ iii）。我们再次执行 `malloc()` 为 `q` 分配内存（图 iv）。如果我们尝试访问指针 `q` 的内容，它如预期地返回 15。假设我们访问指针\
  \ `p` 的内容，它也会返回与 `q` 相同的内容。这对于 `p` 来说是不符合预期的，因为我们已经释放了 `p`，但实际发生的情况是我们释放了堆区域的内存，但\
  \ `p` 仍然指向一个内存位置/地址，由于 `p` 只是一个指针变量，这个 `p` 被称为悬指针（dangling pointer）。\n\n通过在 `free(p)`\
  \ 语句之后令 `p = NULL` 可以避免程序中的悬空指针。\n\n![](img/Figure-2.3.jpg)\n\n**图 2.3：** 在堆区域分配动态内存期间演示的\
  \ brk 系统调用。\n\n### 6. b\n**解释：** `p` 的内是在 `main()` 中通过 `malloc()` 分配的，该内存对其他函数也可用，在这里在\
  \ `fun()` 中，我们正在修改由指针 `p` 指向的共享内存值，该值被更新为 20。（看下图）\n\n![](img/Figure-2.4.jpg)\n\n\
  **图 2.4：** 堆区和栈区指针与变量分配的演示\n\n### 7. d\n**解释：**\n**野指针（Wild Pointer）：** 这些指针未初始化并指向某个随机位置，例如\
  \ `p`。\n\n**悬指针（Dangling Pointer）：** 检查问题 5 的解释，给定程序中没有悬指针。\n\n**空指针（NULL Pointer）：**\
  \ 这些指针被初始化为 NULL 值，不指向任何位置，例如 `r`。\n\n**内存泄漏（Memory Leak）：** 当在某个函数中使用 `malloc()`\
  \ 动态分配内存，且该内存没有被程序中的任何其他函数使用。此外，该函数没有使用 `free()` 释放内存。执行该函数后，无法访问该内存，因为我们丢失了存储分配内存地址的指针变量（`q`），该内存保持未使用的状态。这种未使用的内存被称为内存泄漏，`fun()`\
  \ 正在导致内存泄漏。\n\n### 8. c\n**解释：** 当字符指针赋值为一个字符串时。字符串存储在文本区（text area）或代码区中，该区域是只读的。在给定程序的第\
  \ 3 行，我们尝试更新只读区域。因此，发生了运行时错误。看图。\n\n![](img/Figure-2.5.jpg)\n\n**图 2.5：** 字符串在文本区和栈区内存分配的表示\n\
  \n`p` 指向的 \"hello\"存储在代码/文本区（只读）。它无法更新。变量 `p` 本身存在于栈区。`q` 指向的 \"hello\"存储在栈区。\n\n\
