  \n*想象比知识更有力量。*\n\n![](img/Top-Image.jpg)\n\n# 历史视角\n\nC 语言是由 Dennis Ritchie 在 1969\
  \ 年至 1973 年间在贝尔实验室开发的。美国国家标准协会（ANSI）于 1989 年签署了 ANSI C 标准。Kernighan 和 Ritchie 在他们的书中描述了\
  \ ANSI C，该书被亲切地称为“K&R”。\n\n**C 与 Unix：** C 语言从一开始就被开发为 Unix 操作系统的系统编程语言。Unix 内核几乎所有的组件和库都是用\
  \ C 语言实现的。它可以轻松地移植到新机器（具有不同的架构），仅需编译几个 C 文件即可在新机器上运行 Unix。\n\n**C 是一种简单的语言：** C\
  \ 是一种高级编程语言，允许程序员编写独立于特定类型机器的程序。C 语言完全遵循*编写一次，随处编译*。这类语言被认为是高级的，因为它们更接近人类语言，而远离机器语言。相反，汇编语言被认为是低级的，因为它们非常接近机器语言。高级语言最大的优点是它们对程序员来说易于理解。但在计算机系统中运行程序，程序必须翻译成机器语言（低级语言）。编译器或解释器执行这种翻译。\n\
  \n# 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 目标\n* C 程序简介\n* C 程序的执行\n* C 程序的内存管理与组织结构\n* C 语言中的错误类型\n\
  * 假设\n* 其他 C 语言编程的重要要方面\n* 结论\n* 关键术语\n* 尝试一试\n\n# 目标\n\n本章的意图是让读者理解 C 程序的构造，有助于有助于揭\
  \ C 程序的抽象（隐藏的细节）。它将帮助读者可视化 C 程序的运行，这在操作系统术中被称为“进程”（Process）。本章还解释了对于初学者/中级程序员来说通常不清楚的错误类型。\n\
  \n# C 程序简介\n\n它是按照 Brian Kernighan、Dennis Ritchie 以及后来的 ANSI 引入的语法编写的一种类英语语言代码。\n\
  \n**一个简单的 C 代码**\n\n| `#include<stdio.h>` | 头文件 / 预处理器指令 |\n| :--- | :--- |\n| `int\
  \ main()` | 起点 |\n| `{` | C 程序块体开始 |\n| `printf(\"hello India\");` | C 程序正文 |\n\
  | `return 0;` | 返回语句 |\n| `}` | C 程序块结束 |\n\n**表 1.1：** C 程序的概述\n\n**头文件/预处理器指令：**\
  \ 这些应该插入在 C 程序的开头，帮助我们包含在 C 程序中使用的额外常用 C 代码声明。\n\n**起点：** `main()` 被认为是每个 C 程序的起点。\n\
  \n**大括号：** 大括号（`{`, `}`）表示特定块的开始和结束。\n\n**正文：** 这些是位于大括号内的一系列逻辑指令，它们赋予了 C 程序实际的意义。\n\
  \n**返回语句：** 这个 `return 0` 语句应该包含在任何 C 函数的最后一行，向 shell/编译器（执行该程序的程序）返回 0。\n\n# C\
  \ 程序的执行\n\n执行是指使用系统资源（如 CPU、内存、I/O 设备）来完成特定的任务。对于 `hello.c` 程序的执行，它需要使用所有资源，例如用于处理的\
  \ CPU、用于显示结果“hello India”的 I/O 设备——显示器等。\n\n\n\n\n\n问题在于我们编写的源程序 `hello.c` 是机器无法理解的。它需要更多的处理。给定的程序是以人类可读的形式（高级语言）编写的，机器无法理解这种形式。因此，`hello.c`\
  \ 需要从高级形式翻译为低级形式（机器可理解的形式）。这种翻译可以通过编译器或解释器来完成。\n\n编译过程取决于我们所使用的编译器，某些编译器如 `Turbo\
  \ C`、`Dev-C`、`GCC` 等。它们的翻译过程完全不同。编译后的文件被称为可执行对象文件。在 Unix 系统上，可以使用 `GCC` 编译器按照如下方式执行\
  \ C 程序：\n\n```bash\nunix> gcc -o hello hello.c\n```\n\n源文件 `hello.c` 被 `GCC` 编译器驱动程序读取，并翻译成可执行对象文件。\n\
  \n```bash\nunix> ./hello\n```\n\n加载器（loader）将此可执行文件加载到主内存中，随后 CPU 开始处理。\n\n使用 `GCC`\
  \ 进行翻译并不是单一阶段的。`GCC` 将源程序传递给它的四个组件：(i) 预处理器、(ii) 编译器、(iii) 汇编器和 (iv) 链接器。它们统称为编译系统`图\
  \ 1.2` 将让你更好地了解编译系统，如下所示：\n\n![](img/Figure-1.2.jpg)\n\n**图 1.2:** 编译系统\n\n**预处理器：**\
  \ 预处理器 (`cpp`) 直接替换原始 C 程序文本中从以 `#` 字符开头的宏和指令。它产生另一个后缀为 `.i` 的 C 程序。\n\n**编译器：**\
  \ 它涉及许多子阶段，如词法分析、语法分析等。它获取的是一个汇编语言程序，该程序以文本形式（也称为助记符）描述机器指令。编译阶段的输出文件后缀为 `.s`。\n\
  \n**汇编器：** 它将文本文件 `hello.s` 翻译成机器级指令，并封装成可重定位对象程序的形式，将输出存储在文件 `hello.o` 中。\n\n**链接器：**\
  \ 正如我们观察调用的 `printf()` 函数程序所示，我们的源程序中并没有 `printf()` 函数。`printf()` 函数是每个 C 编译器提供的标准\
  \ C 库的一部分。`printf` 函数已经以编译文件的形式存在，并作为 `printf.o` 文件存在于 C 库中。链接器管理这些新编译（源程序）和预编译（`printf.o`）文件的合并。合并后，链接器获得可执行文件，由加载器加载到内存中，并由\
  \ CPU 执行。\n\n这只是所有阶段的概述。我们可以通过向 `gcc` 命令传递不同的参数，查看所有这些中间文件（`hello.i`、`hello.s`、`hello.o`）的内容。关于此的更多细节将超出本文讨论范围。\n\
  \n任何编程语言最重要的问题就是内存管理，我们将在下一节介绍 C 程序的内存管理和内存组织。\n\n# C 程序的内存管理与组织](#toc.xhtml_s6a)\n\
  \nC 程序的内存组织取决于变量在可重定位对象文件（`hello.o`）中的组织方式。对象文件的内存表示可以分为 10 多个区域。但为了更好地理解，我们将关注四个区域（`图\
  \ 1.3`），它们如下：\n\n* 文本区 (Text Area)\n* 数据区 (Data Area)\n    * 初始化数据段\n    * 未初始化数据段\
  \ (bss)\n* 堆区 (Heap Area)\n* 栈区 (Stack Area)\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3:**\
  \ C 程序的内存组织\n\n1. **文本区：** 它包含编译后程序的机器代码。它也被称为 `code area`（代码区）。它是只读的，防止机器指令被意外修改。文本区在程序的所有函数之间是共享的。该区域的存在持续到\
  \ `main()` 退出。\n\n2. **数据区：** 全局 C 变量和静态变量的内存在此区域维护。该区域既可读又可写。它在程序的所有函数之间也是共享的。它的寿命也持续到程序结束。它被进一步分为两个段：\n\
  \    1. **初始化数据段：** 所有初始化了某些值的全局和静态变量都会在此区域分配内存。\n    2. **未初始化数据段：** 所有未初始化的全局和静态变量都位于此区域，并在此区域分配内存。该区域也被称为符号起始段\
  \ (bss)。\n\n3. **堆区：** 动态内存分配在此区域进行。该区域的大小不是固定的，它会增长到最大的可用地址。在 C 中，它由 `malloc`、`calloc`、`realloc`\
  \ 和 `free` 库函数管理，这些函数使用 `brk` 和 `sbrk` 系统调用来调节大小。该区域也被程序的所有函数共享。它的存在持续到程序结束。\n\n\
  4. **栈区：** 它位于堆区旁边，栈区堆区的内存地址不是固定的，而数据区和文本区是固定的。堆和栈互相生长。所有的局部变量（自动变量）都存储在栈区。当程序开始执行时，首先\
  \ `main()` 被推入栈，然后其他函数在被调用时被推入栈。当调用任何函数时，机器状态会发生很多变化。程序计数器更新为新地址。\n\nC 内存组织的示例见\
  \ `图 1.4`。\n\n![](img/Figure-1.4.jpg)\n\n**图 1.4:** 程序内存组织的示例\n\n# C 语言中的错误类型](#toc.xhtml_s7a)\n\
  \n通常，程序中发生四种错误，如下：\n\n**逻辑错误：** 在编写程序时，程序中存在一些逻辑错误。它会导致输出异常。编译器无法检查，因此程序员需要扫描代码。\n\
  \n**编译时错误：** 当程序员不遵守特定语言的规则时发生。因此，编译器抛出错误。有很多编译时错误，如语法错误、语义错误。\n\n**链接时错误：** 它发生在链接阶段，这意味着我们的代码没有问题，编译正常，但缺少要链接的函数或库模块。链接器不允许生成最终的可执行文件。许多编译器将编译和链接结合。在\
  \ GCC 编译器中，链接时错误仅在编译阶段发生。\n\n**运行时错误：** 这些错误在程序执行期间发生。假设在程序中，我们正在除以零，这是一个运行时错误。假设我们的程序试图访问一个不允许访问或不存在的内存地址，导致段错误。\n\
  \n\n\n\n\n**字长：** 32 位\n\n**模式：** 小端序（我们将在 G-2 的问题 25 中进行讨论）\n\n### 数据类型的大小：\n\n\
