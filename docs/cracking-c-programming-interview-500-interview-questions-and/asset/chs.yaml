  \ 43. **c**\n\n**解释：** 这遵循了*结构体填充*（structure padding）的概念。假设有一台 32 位的机器。结构的所有成员存储在内存位置上，使得所需的内存访问次数最少。在\
  \ 32 位机器中，总线每次传输 4 字节。考虑 `struct student1`，字符变量 `a` 存储在 `student1` 的第一个字节，如果我们把整数变量\
  \ `b` 放在第 2, 3, 4 和 5 字节，那么读取变量 `b` 时机器需要两次内存访问：第一次访问是读取第 2 到 4 字节，第二次访问是读取第 5 字节。这是不可行的，因此从第\
  \ 2 到 4 字节的内存将用 `NULL` 填充，变量 `b` 将存储从第 5 到第 8 字节。变量 `c` 将存储在第 9 字节，第 10, 11, 12\
  \ 字节将用 `NULL` 填充。变量 `d` 将存储在第 13 到第 20 字节。因此，对象 `s1` 的大小变为 20B。\n\n![](img/c08-2.jpg)\n\
  \n### 44. **b**\n\n**解释：** 在给定的程序中，赋值运算符会将字符串 `name` 从对象 `s1` 复制到 `s2`，它不会报错。由于我们创建了两个不同的\
  \ `std` 结构体对象，它们存储在不同的内存位置，`s1` 和 `s2` 中 `name` 的地址是不同的。\n\n### 45. **b**\n\n**解释：**\
  \ 不需要。\n\n### 46. **a**\n\n**解释：** 在给定的程序中，我们在结构体中使用了位域字段（bit fields）。考虑一种情况：你需要存储班级中所有学生的学号和分数，班级有\
  \ 14 名学生，最高分为 30 分。现在定义一个占用内存最小的结构体 `student`。众所知，班级有 14 名学生，如果使用 `integer` 数据类型来存储他们的学号，将浪费内存，因为\
