  \ 语句，匹配后所有的 case 都会执行。然后，`case 3` 再次使 `x` 为 `7`。\n\n3. **c**\n\n   **解释：** 这是异或操作交换两个数字的应用之一。变量\
  \ `x` 和 `y` 分别可以写为二进制形式 `0010` 和 `0101`。第一个表达式 `x = x^y` 的求值为 → `x = 0010 ^ 0101`\
  \ → `x = 0111`。第二个表达式 `y = x^y`（将考虑更新后的 `x`）的求值为 `y = 0111⁰¹⁰¹` → `y = 0010 = 2`。第三个表达式\
  \ `x = x^y` 的求值为 `x = 0111⁰⁰¹⁰` → `x = 0101 = 5`。因此，`x` 和 `y` 更新为交换交换的初始值。\n\n4.\
