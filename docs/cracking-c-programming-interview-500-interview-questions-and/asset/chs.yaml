  **解释：** 第 3 行的表达式等同于 `a = *(arr + 1 + 5) → *(arr + 6)`。`printf()` 将打印存储在 `*(arr+6)`\
  \ 处的值，即 9\n\n### 18. c\n**解释：** 不需要。\n\n### 19. d\n**解释：** 在给定的程序中，第 1 行我们是在声明变量\
  \ `i`，而不是定义。当变量被声明时，编译器只知道变量的类型但没有为变量分配内存；当变量被定义时，才会为变量分配内存。编译器将定义 `i` 和 `j` 的工作推到了链接阶段。编译器认为这些变量的定义可能存在于其他程序或标准库中。对于变量\
  \ `i` 和 `j` 来说并非如此，它们只是被声明了，在任何地方都没有定义。因此，编译器产生链接时错误。第 2 行中，我们试图将值 10 存储在变量 `i`\
  \ 中，而变量 `i` 尚未绑定内存。因此编译器产生链接时错误。\n\n### 20. b\n**解释：** 不需要。\n\n### 21. a\n**解释：**\
  \ 不需要。*提示：* `extern` 存储类用于引用全局变量或定义在其他文件变量。\n\n### 22. d\n**解释：** 第 1 行不会产生任何错误，因为编译器从全局作用域获取了\
  \ `extern` 变量 `i` 的定义。编译器在第 2 行由于变量 `i` 重复定义产生错误。\n\n### 23. a\n**解释：** 给定的程序不会报告任何错误。在\
  \ `one.c` 文件中，变量 `p` 是一个 `extern` 变量，可以引用其他文件的变量；而在 `two.c` 中我们有了 `p` 的定义。\n\n###\
  \ 24. c\n**解释：** 如我们所讨论，程序中的所有函数默认都是 `extern` 的。在链接给定的 C 文件后，我们将有两个 `main()` 函数的实例，而不能有两个同名的函数。因此，编译器报告错误。\n\
  \n### 25. b\n**解释：** 语句 (i) 只是变量 `i` 的声明，还没有为 `i` 分配内存。语句 (ii) 是 `i` 的定义，为 `i` 分配了内存并初始化为\
  \ 10。语句 (iii) 也是 `i` 的定义，我们初始化一个 `extern` 变量时，该变量会获得内存，而不需要等到链接阶段。\n\n### 26. a\n\
