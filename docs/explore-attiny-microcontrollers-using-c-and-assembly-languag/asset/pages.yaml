  md: 'In the dummy ISR code, a breakpoint could be put on the NOP instruction during
    program testing to see if execution ever arrived at the dummy ISR. As can be seen
    in the dummy ISR, the code simply loops and never returns. If the watchdog timer
    were enabled on the microcontroller, then this would cause the watchdog timer
