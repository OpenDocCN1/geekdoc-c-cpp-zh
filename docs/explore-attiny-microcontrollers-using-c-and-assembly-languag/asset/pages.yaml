  md: '# Chapter 11 • The AVR Instruction Set


    Now that many of the AVR instructions from the AVR instruction set have been used
    in preceding chapters, and the AVR architecture has been covered, it is time to
    look at the remaining AVR instructions.


    This chapter summarizes instructions from the AVR instruction set that have already
    been used, and looks at the remainder of the instructions that have not yet been
    covered.


    # In this Chapter


    +   - AVR instruction set overview and categories

    +   - A guided tour through the ATtiny AVR instruction set

    +   - Implement an LED chaser or “Knight Rider” display using shift instructions

    +   - A look at AVR instructions that are not available in ATtiny parts'
