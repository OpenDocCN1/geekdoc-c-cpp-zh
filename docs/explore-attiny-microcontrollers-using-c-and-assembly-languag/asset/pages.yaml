    circuit is with the USB connector of the Arduino Uno on the left.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_361_0.png)


    Figure B.5: 28-Pin ATtiny48/88 Circuit and Programmer Connections


    # B.5 Alternate Programs


    Two alternate programs that are equivalent programs to the led_blink.asm and led_blink_c
    programs from Chapter 2, section 2.3.2 and section 2.4.2 respectively. Whereas
    the programs from Chapter 2 flash or blink an LED attached to pin PB4 of an ATtiny
    microcontroller, the programs in this section flash or blink an LED attached to
    pin PB0 of an ATtiny microcontroller.


    In this appendix, all circuits have an LED attached to pin PB4 of an ATtiny, except
    for the 14-pin ATtiny24/44/84 range in section B.2, and the 28-pin ATtiny48/88
    range in section'
  merge: -1
  img_proc: true
- pgno: 362
  md: "B.4, which have an LED attached to pin PB0. All circuits can therefore be programmed\
    \ with the assembly and C LED blink programs from Chapter 2, except for the ATtiny24/44/84\
    \ and ATtiny48/88 range that must be programmed with the two alternate LED blink\
    \ programs that follow.\n\n# B.5.1 Alternate LED Blink Assembly Program\n\nThe\
    \ following assembly language program blinks an LED on pin PB0 of an ATtiny microcontroller\
    \ instead of pin PB4, as the led_blink_asm program in Chapter 2 does (section\
    \ 2.3.2).\n\n```\nled_blink_asm-alt : main.asm\n\nstart:\n    sbi     DDRB, DDB0\
    \        ; Set pin PB0 as output\n\nloop:\n    sbi     PORTB, PORTB0     ; Set\
    \ LED pin high\n    rcall   delay             ; LED on delay\n    cbi     PORTB,\
    \ PORTB0     ; Clear LED pin low\n    rcall   delay             ; LED off delay\n\
    \    rjmp    loop\n\n; Delay subroutine\ndelay:\n    ldi     r16, 0xff\ndelloop1:\n\
    \    ldi     r17, 0xff\ndelloop2:\n    dec     r17               ; Delay by decrementing\n\
    \    brbc    SREG_Z, delloop2  ; Delay by decrementing\n    dec     r16\n    brbc\
    \    SREG_Z, delloop1  ; Delay by decrementing\n    ret\n```\n\n# B.5.2 Alternate\
    \ LED Blink C Program\n\nThe following C program blinks an LED on pin PB0 of an\
    \ ATtiny microcontroller, instead of on pin PB4, as the led_blink_c program in\
    \ Chapter 2 does (section 2.4.2)."
  merge: -1
  img_proc: true
- pgno: 363
  md: "```\nled_blink_c_alt : main.c\n\n#define F_CPU 1000000UL         // 1MHz default\
    \ clock\n#include <avr/io.h>\n#include <util/delay.h>\n\nint main(void)\n{\n \
    \   DDRB |= (1 << DDB0);        // Set up pin PB0 as an output\n\n    while (1)\
    \ {\n        PORTB |= (1 << PORTB0); // Set pin high (LED on)\n        _delay_ms(1000);\n\
    \        PORTB &= ~(1 << PORTB0); // Set pin low (LED off)\n        _delay_ms(1000);\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
