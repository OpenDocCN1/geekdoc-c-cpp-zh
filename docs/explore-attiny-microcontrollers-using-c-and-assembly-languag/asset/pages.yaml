    is because the 16-bit return address of the line of code after the subroutine
    call was automatically pushed onto the stack. The full 16-bit return address 0x0002
    was pushed onto the stack – LSB first with 0x02 at address 0x015F, then MSB with
    0x00 at address 0x015E. In the Memory window, 0x02 can be seen at address 0x015F
    and 0x00 at address 0x015E.


    The first line of code in the subroutine pushes R16 onto the stack:


    ```

    ```asm

    push r16 ; Preserve R16

    ```

    ```


    Registers that are used in a subroutine are typically pushed onto the stack to
    preserve them and popped from the stack before the subroutine returns so that
    these registers remain unaltered for the main program. It can get very difficult
    to keep track of the usage of every register in a big program, so preserving the
    registers used in a subroutine can prevent unexpected behavior of the main program
    that may rely on a value in a register being unaltered after a subroutine call.
    Step over the PUSH instruction at the beginning of the subroutine and note that
    the value in R16 (0x55) now appears at address 0x015D in the memory window. The
    Stack Pointer decrements to 0x015C and the stack is now storing a 16-bit subroutine
    return address and an 8-bit register value.


    Step through the subroutine code which loads 0x03 to R16, then decrements R16
    until it contains zero. When R16 contains 0x00, the POP instruction is executed
    followed by the RET instruction, as the following code shows.


    ```

    ```asm

    pop r16 ; Restore R16

    ret

    ```

    ```'
