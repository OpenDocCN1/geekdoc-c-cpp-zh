    Notice that the result of the OR operation is 0b1001_1111. The upper nibble of
    the result is the same as the upper nibble of the top number. This is because
    it was ORed with the upper nibble of the mask value which contains only zeros,
    and therefore leaves the upper nibble of the first number unchanged.


    The lower nibble of the result contains only ones because the mask value contains
    only ones. This is because anything ORed with 1 is always 1. A mask value used
    in combination with the OR operation is frequently used to set one or more bits
    while leaving others unchanged.'
