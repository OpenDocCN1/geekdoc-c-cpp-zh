- pgno: 42
  md: 'Single strand wire, or Dupont wires with a pin on each end, can be used to
    connect from the bottom of the 6-pin connector of the Atmel-ICE, or other programmer
    with 6-pin ISP/SPI header, to the breadboard circuit.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_42_0.png)


    Figure 2.3: ATtiny Circuit Built on Breadboard with Atmel-ICE Connected


    To connect the programmer to the breadboard circuit, turn the 6-pin header over
    so that it is facing you – so that you can see the holes in the connector. Make
    sure that the raised plastic key on the connector is at the left when looking
    at Figure 2.1 and Figure 2.2. Find pin 1 using Figure 2.2 or the inset in Figure
    2.1. Insert a wire into the pin 1 hole of the connector. Look at Figure 2.1 to
    see where pin 1 connects to – as can be seen, pin 1 from the connector goes to
    pin 6 of the 8-pin ATtiny, and is named MISO. Make the connection.


    Pin 2 of the connector connects to +5V from the 5V power supply. When using a
    Microchip Studio compatible programmer, connect pin 2 of the connector to +5V
    of the power supply, which is usually connected to one of the horizontal rails
    of the breadboard. This means that pin 2 can be connected to the 5V rail of the
    breadboard. Pin 2 is used by the USB'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'programmer to detect the voltage that the circuit is powered from. Hobby programmers
    usually supply 5V on this pin, rather than detect the voltage that the circuit
    is powered from. This pin can therefore be used to power the circuit from 5V when
    using a hobby programmer. If using a hobby programmer and an external power supply,
    then leave this pin disconnected, otherwise it will result in 5V from the computer
    USB being connected to 5V of the external power supply.


    Continue wiring the remaining pins of the 6-pin ISP/SPI connector as shown in
    Figure 2.1. Pin 6 is the final pin that needs to be connected, which connects
    to GND or 0V of the power supply, which is usually connected to one of the horizontal
    breadboard rails.


    # 2.2.1 Circuit Power Supply


    Any power supply that provides stable and smooth 5V DC can be used to power the
    circuit. A breadboard power supply is used in Figure 2.3. The breadboard power
    supply shown in the figure has a 5V regulator and is powered by an external 6V
    to 12V DC power supply via a barrel connector. This particular breadboard power
    supply can also supply the circuit with 3.3V by using jumpers to set the voltage
    on the board. The Power Supply section of the introduction chapter of this book
    already describes this power supply. Refer back to Figure 0.4 in the introduction
    for an image of the breadboard power supply powered from an external mains to
    DC power supply unit. Figure 0.5 in the introduction shows the same circuit as
    seen in Figure 2.3, but with the Atmel-ICE connected using Dupont wires. Breadboard
    power supplies connect +5V (or +3.3V) to the horizontal breadboard rails marked
    with a red line and + sign. These rails are found on both sides of the breadboard.
    0V or GND of a breadboard power supply connects to the horizontal rails that have
    a blue line next to them and are marked with a – sign.


    It is a good idea to attach a new breadboard power supply to an unused breadboard,
    and use a multimeter to check that the voltages that it is producing are at the
    correct levels before connecting the power supply to a circuit. Also make sure
    that the jumpers on the breadboard power supply are set correctly for the voltage
    that is to be used in a circuit.


    As already mentioned, if a hobby programmer is used, it can usually supply 5V
    to the circuit from the USB 5V of the host computer. All of the hobby programmers
    shown in Figure A.1 of Appendix A are able to supply 5V to power the target ATtiny.
    This includes the Arduino Uno when set up as an ISP programmer, where a connection
    can be made'
  merge: -1
  img_proc: true
