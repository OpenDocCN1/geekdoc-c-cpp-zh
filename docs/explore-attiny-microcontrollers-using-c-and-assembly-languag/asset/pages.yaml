  md: 'causes the program to jump over the rest of the vector table entries and start
    running the C code from the beginning. The other vector table entries also cause
    the program to jump to the reset vector, but by first jumping to another jump
    instruction. The code listing shows the first two sections of the disassembly.
    Note that this code has been built for the ATtiny13(A), which has a smaller interrupt
    vector table of 10 entries from address 0 to address 9. If you build the same
    code for the ATtiny25/45/85, you will notice that the vector table has 15 entries,
    from address 0 to 14 (0x000E). At the left of each assembly language instruction
    is the address in Flash program memory of the instruction. Looking at the first
    entry in the disassembly, we have the reset vector at address 0 and an RJMP instruction
    next to it as follows.


    ```

    00000000 RJMP PC+0x000A Relative jump

    ```


    It can be seen that this relative jump instruction jumps to the address at PC
    + 0x000A, which is the current program counter (PC) value plus 0x000A. At reset,
    the PC contains zero and therefore this first jump instruction jumps to the address
    0x000A. In the disassembly listing, CLR R1 is found at address 0x000A in the grc1.S
    section. The remainder of the interrupt vector table from address 0x0001 to 0x0009
    also contain relative jump instructions that all jump to address 0x0010. At address
    0x0010 is yet another RJMP instruction that jumps back 0x10 addresses, indicated
    by the negative sign next to the address as follows.


    ```

    00000010 RJMP PC-0x0010 Relative jump

    ```


    0x10 is 16 in decimal, and 16 addresses back from the current address of 0x10
    is 0, or the reset vector at address 0 of the vector table. This means that if
    any interrupt were triggered, program execution would simply restart at address
    0. In the previous disassembly listing, the second section in the code is from
    grc1.S, as indicated in the listing. This code is automatically linked in by the
    C tools. In the name grc1.S, crt stands for C Runtime, which is code that performs
    initialization required before calling the C main() function. The C runtime code
    starts by clearing the status register by first clearing R1 and then loading R1
    to address 0x3F (which is the status register) as follows.


    ```

    0000000A CLR R1 Clear Register

    00000008 OUT 0x3F,R1 Out to I/O location

    ```


