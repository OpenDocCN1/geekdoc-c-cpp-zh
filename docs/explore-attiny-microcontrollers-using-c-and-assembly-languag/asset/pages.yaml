- pgno: 225
  md: "# 10.2.2 A Better Software Delay Subroutine\n\nAn improved software delay subroutine\
    \ is included in the listing below as part of the led_blink_asm code. This new\
    \ program is now called wait_1s_asm and includes a subroutine called wait_1s that\
    \ delays for exactly one second. At the top of the listing, the frequency of the\
    \ AVR that the code is to run on must be assigned to F_CPU. As can be seen, two\
    \ frequencies have been provided, with one commented out. These are of course\
    \ for the ATtiny25/45/85 and ATtiny13(A) default frequencies of 1MHz and 1.2MHz\
    \ respectively. When the frequency is correctly set at the top of the code, the\
    \ LED attached to pin PB4 stays on for 1 second as the code in the main loop runs.\n\
    \n```\nwait_1s.asm : main.asm\n\n; .equ F_CPU = 1000000\n.equ F_CPU = 1200000\n\
    \nstart:\n    sbi DDRB, DDB4    ; Set pin PB4 as output\n\nloop:\n    sbi PORTB,\
    \ PORTB4 ; Set LED pin high\n    rcall wait_1s     ; LED on delay\n    cbi PORTB,\
    \ PORTB4 ; Clear LED pin low\n    rcall wait_1s     ; LED off delay\n    rjmp\
    \ loop\n\n; 1 second delay subroutine\nwait_1s:\n    ldi R16, Low ((F_CPU - 10)\
    \ / 10) ; Load number of loop cycles\n    ldi R17, byte2((F_CPU - 10) / 10) ;\
    \ to registers R16 to R19\n    ldi R18, byte3((F_CPU - 10) / 10)\n    ldi R19,\
    \ byte4((F_CPU - 10) / 10)\n\nwait_1s_loop:\n    subi R16, 1    ; Perform decrement\
    \ on 32-bit\n    sbci R17, 0    ; number in R16 to R19\n    sbci R18, 0\n    sbci\
    \ R19, 0\n    mov R20, R16   ; Determine if 32-bit number is\n    or R20, R17\
    \    ; zero using OR and BRBC\n    or R20, R18\n    or R20, R19\n    brbc SREG_Z,\
    \ wait_1s_loop ; Balance BRBC to 2 clock cycles\n    nop            ; Balance\
    \ instructions outside of\n    nop            ; loop to 10 clock cycles\n    ret\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 10.2.2.1 Principle of Operation


    The principle of operation of the wait_1s subroutine is to decrement a 32-bit
    number until it is zero in order to waste enough time to cause the desired delay
    of 1 second. If the frequency that the microcontroller is running at is 1MHz,
    then the subroutine must use up one million clock cycles to create a 1s time delay.
    This is because 1MHz is 1 million cycles per second, meaning that at this frequency,
    1 million cycles take one second to complete.


    Some of the ATtiny microcontrollers used in this book can operate up to a maximum
    clock frequency of 20MHz. Because frequency is measured in Hertz (Hz), which is
    clock cycles per second, and the wait_1s subroutine is to delay for 1 second,
    the number of clock cycles to use up for a 1s delay equals the frequency that
    the microcontroller is operating at. For the maximum frequency of 20MHz, 20 million
    clock cycles must complete to use up 1s. If the microcontroller is operating at
    1.2MHz, then 1.2 million cycles must complete to use up one second, and so on
    for whichever frequency is being used. F_CPU at the top of the code must be changed
    to the frequency that the microcontroller is operating at in order for the wait_1s
    subroutine to correctly delay for 1s.


    # 10.2.2.2 32-bit Subtraction with 8-bit Registers


    In order to perform subtraction from a 32-bit number on an 8-bit processor, four
    8-bit registers are needed to hold the 32-bit number. In the wait_1s subroutine,
    registers R16, R17, R18 and R19 are used to hold the 32-bit number to subtract
    from. If the subtraction process took only one clock cycle, then we would only
    need to load the value of the frequency that the microcontroller is operating
    at to these registers, as follows.


    ```

    ldi   R16, low (F_CPU)

    ldi   R17, byte2(F_CPU)

    ldi   R18, byte3(F_CPU)

    ldi   R19, byte4(F_CPU)

    ```


    In the above code, we have the familiar low() assembler function that gets the
    lower byte of the F_CPU value. New in this code is byte2(), byte3() and byte4()
    which operate in the same way as low(), but get the second, third and fourth bytes
    of a 32-bit number. These functions are found in the AVR Assembler document. What
    the above code therefore does is load the value of F_CPU to R16, R17, R18 and
    R19, byte by byte in order, starting from the least significant byte up to the
    most significant byte. As it turns out, the subtraction process takes more than
    one clock cycle. The code in the wait_1s.asm listing therefore does not directly
    load the value of F_CPU to the registers, but does some mathematical compensation,
    that is explained in the next section.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The actual subtraction is performed by one SUBI (Subtract Immediate) instruction
    and three SBCI (Subtract Immediate with Carry) instructions as shown in the following
    code.


    ```

    subi R16, 1    ; Perform decrement on 32-bit

    sbci R17, 0    ; number in R16 to R19

    sbci R18, 0

    sbci R19, 0

    ```


    The above code is the counterpart to the addition from section 7.2.2 in Chapter
    7, where one ADD (Add without Carry) instruction and one ADC (Add with Carry)
    instruction are used to add two 16-bit numbers and take into consideration the
    carry. In the negative version of this code as shown above, the subtraction is
    simply expanded to operate on four registers. In this code, the SUBI instruction
    subtracts 1 from R16, the LSB. The SBCI instruction is then used to subtract 0
    from R17, R18 and R19. Because this instruction takes into consideration any carry
    that is generated by the subtraction, R17, R18 and R19 are decremented only when
    a carry occurs. This effectively allows a 32-bit number spread over four registers
    to be decremented by one each pass through the loop.


    The final part of the code in a loop determines whether the 32-bit number in R16
    to R19 is zero. This is done by using a logic OR operation that ORs R16, R17,
    R18 and R19 together, as shown in the following listing. If any of these registers
    contains a number other than zero, then the result of the OR operations is not
    zero, which causes the BRBC instruction to jump back to the top of the loop and
    do another decrement.


    ```

    mov R20, R16    ; Determine if 32-bit number is

    or R20, R17     ; zero using OR and BRBC

    or R20, R18

    or R20, R19

    brbc SREG_Z, wait_is_loop

    ```


    Because the AVR OR instruction is destructive, in that it puts the result of the
    OR operation into the first register overwriting its contents, an additional register
    is needed to hold the result of the OR operations. R20 is the register used in
    the above code to store the result of the OR operations. Firstly, the value in
    R16 is copied to R20 using the MOV (Copy Register) instruction. After this, R17,
    R18 and R19 are consecutively ORed with R20, which holds the running result of
    the OR operations. As R20 is used to store each result, the values in R16 to R19
    are never modified or overwritten. After the series of OR operations have completed,
    the Zero bit in the status register is set only if R16 to R19 all contain zero.
    This causes program execution to continue below the BRBC instruction. If any of
    these registers does not contains zero, BRBC jumps to the top of the loop.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 10.2.2.3 Timing of the Code


    Now that we understand the basic working of the wait_1s subroutine, we can examine
    the timing of the instructions used in this subroutine. The code is repeated below,
    showing the number of clock cycles used by each instruction


    ```

    wait_1s:

    ldi    R16, low  ((F_CPU - 10) / 10)   ; 1 clock cycle

    ldi    R17, byte2((F_CPU - 10) / 10)   ; 1 clock cycle

    ldi    R18, byte3((F_CPU - 10) / 10)   ; 1 clock cycle

    ldi    R19, byte4((F_CPU - 10) / 10)   ; 1 clock cycle


    wait_is_loop:

    subi   R16, 1                          ; 1 clock cycle

    sbci   R17, 0                          ; 1 clock cycle

    sbci   R18, 0                          ; 1 clock cycle

    sbci   R19, 0                          ; 1 clock cycle

    mov    R20, R16                        ; 1 clock cycle

    or     R20, R17                        ; 1 clock cycle

    or     R20, R18                        ; 1 clock cycle

    or     R20, R19                        ; 1 clock cycle

    brbc   SREG_Z, wait_is_loop            ; 1 clock cycles

    nop                                  ; 1 clock cycle

    nop                                  ; 1 clock cycle

    nop                                  ; 1 clock cycle

    ret                                  ; 4 clock cycles

    ```


    As can be seen in the code, every instruction takes only one clock cycle, except
    for the BRBC instruction and the RET instruction. As we know, the BRBC instruction
    takes two clock cycles when it branches to the top of the loop, and one clock
    cycle when it does not branch. In order to effectively make this instruction always
    use up two clock cycles, a single NOP instruction is placed below it. This means
    that when BRBC does not branch, it executes the NOP instruction below it effectively
    using up two clock cycles instead of one.


    Instructions in the loop, shown in bold in the above listing, add up to 10 clock
    cycles. The NOP instruction directly below BRBC is included in this total, as
    it effectively causes the final execution of BRBC to still use up two clock cycles.
    F_CPU must be divided by these 10 clock cycles before being loaded into R16 to
    R19 at the top of the subroutine. This is because the subtraction process in the
    loop uses up these 10 clock cycles and the subroutine would therefore take 10
    times longer if we did not compensate for these 10 clock cycles.


    Besides the clock cycles used in the loop, there are clock cycles used before
    and after the loop. Four clock cycles are used by the LDI instructions at the
    beginning of the wait_1s'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'subroutine. Ignoring the NOP instructions, the RET instruction adds four more
    clock cycles to the subroutine. This totals eight clock cycles used out side of
    the loop. These additional clock cycles must be subtracted from F_CPU before it
    is divided by 10, so that the subroutine delays for exactly the right number of
    clock cycles. A problem occurs when subtracting 8 from an F_CPU value that is
    a multiple of 10, and then dividing the result by 10. For example when using 1MHz
    for F_CPU, we get (1,000,000 - 8) / 10 = 99,999.2 which has a fractional value.
    In order to get the wait_1s subroutine to use up the exact number of clock cycles
    that we require when F_CPU is a multiple of 10, two extra clock cycles are added
    before the RET instruction by adding two NOP instructions. This causes the total
    number of clock cycles before and after the loop to add up to 10. We therefore
    must subtract 10 from F_CPU before dividing it by 10. For a frequency of 1MHz,
    we now have (1,000,000 - 10) + 10 = 99,999 which is a whole number. When this
    number is loaded to R16 to R19, then the wait_1s subroutine uses up exactly 1
    million clock cycles.


    # 10.2.2.4 Testing the Code in Microchip Studio


    Microchip Studio and the AVR simulator can be used to test the wait_1s subroutine
    to verify that it uses up the correct number of clock cycles for the given frequency.
    Use the wait_1s.asm code in a Microchip Studio project with the simulator for
    testing purposes. After entering the code, be sure to set the desired value for
    F_CPU at the top of the code, for example set it to 1000000 for an AVR running
    at 1MHz. Build the code and select the simulator as the tool to use, as we have
    done previously. Place a breakpoint on the first instruction in the wait_1s subroutine,
    and on the RET instruction at the end. Use Start Debugging (F5) to start the code
    running, which will then stop at the first breakpoint.


    When the simulator stops at the first breakpoint, set the Cycle Counter in the
    Processor Status window to 1 to compensate for the bug, as previously discussed.
    Set the Frequency field in the Processor Status window to the frequency that F_CPU
    was set to. Run the code again so that execution stops on the second breakpoint
    on the RET instruction. Because the RET instruction has not executed yet, the
    Cycle Counter is now at the correct value minus four, for example a 1MHz frequency,
    the counter is at 999996. Step over the RET instruction using the Step Over icon
    or F10. The cycle counter now contains the correct value for the chosen frequency,
    1000000 for 1MHz. This means that on a real ATtiny device, 1 second of time is
    used up. This is cycle accurate, but may not be time accurate on devices that
    are using the internal RC oscillator because this oscillator is not very accurate.
    Note also that the AVR simulator does not run in real time, so will actually use
    more time to execute wait_1s when using a higher F_CPU.'
  merge: -1
  img_proc: true
- pgno: 230
  md: "# 10.2.3 A Changeable Software Time Delay Subroutine\n\nNow that we have a\
    \ software time delay subroutine that compensates for the frequency that the microcontroller\
    \ is running at, it does not take too much effort to modify the time delay subroutine\
    \ to make its delay time changeable. In addition to modifying the previous time\
    \ delay subroutine, the next project splits the code up into two files, putting\
    \ the new time delay subroutine into its own file. The code listings for the two\
    \ files follow.\n\n```\nwait_ms.asm : main.asm\n\n.equ  F_CPU     = 1000000  \
    \ ; Frequency of CPU\n.equ  MS_TIME_DEL = 500     ; Time delay in milliseconds\n\
    \nstart:  sbi   DDRB, DDB4      ; Set pin PB4 as output\nloop:   sbi   PORTB,\
    \ PORTB4   ; Set LED pin high\n        rcall wait_ms         ; LED on delay\n\
    \        cbi   PORTB, PORTB4   ; clear LED pin low\n        rcall wait_ms    \
    \     ; LED off delay\n        rjmp  loop\n\n.include \"wait_ms.asm\"\n    ; Must\
    \ put newline here\n```\n\n```\nwait_ms.asm : wait_ms.asm\n\n; Millisecond delay\
    \ subroutine - time set by MS_TIME_DEL\nwait_ms:\n    ldi   R16, low ((((F_CPU\
    \ * MS_TIME_DEL) / 1000) - 10) / 10)\n    ldi   R17, byte2((((F_CPU * MS_TIME_DEL)\
    \ / 1000) - 10) / 10)\n    ldi   R18, byte3((((F_CPU * MS_TIME_DEL) / 1000) -\
    \ 10) / 10)\n    ldi   R19, byte4((((F_CPU * MS_TIME_DEL) / 1000) - 10) / 10)\n\
    wait_ms_loop:\n    subi  R16, 1\n    sbci  R17, 0\n    sbci  R18, 0\n    sbci\
    \  R19, 0\n    mov   R20, R16\n    or    R20, R17\n    or    R20, R18\n    or\
    \    R20, R19\n    brbc  SREG_Z, wait_ms_loop\n    nop\n    nop\n    ret\n```"
  merge: -1
  img_proc: true
- pgno: 231
  md: 'To create an AVR assembly language project in Microchip Studio that consists
    of more than one file, first create a new AVR Assembler Project as usual. Create
    a new AVR Assembler Project in Microchip Studio now, and call it wait_ms.asm.


    Enter the code from the previous wait_ms.asm : main.asm listing into the main.asm
    file that is automatically created with the new project, replacing the skeleton
    code in this file.


    To add a second assembly language file to the project, right-click the wait_ms.asm
    project name at the top right of the Solution Explorer pane in Microchip Studio.
    On the menu that opens, select Add > New Item... as shown in Figure 10.4. to open
    the Add New Item dialog box. This dialog box is used to add multiple files to
    any project.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_231_0.png)


    In the Add New Item dialog box, click the Assembler File item and then enter wait_ms.asm
    in the bottom Name: field of the dialog box, as shown in Figure 10.5. Click the
    Add button at the bottom right of the dialog box to add the new assembly language
    file to the project.'
