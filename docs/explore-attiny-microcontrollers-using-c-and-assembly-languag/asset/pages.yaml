- pgno: 30
  md: '# Chapter 1 • Overview of ATtiny Microcontrollers


    This chapter takes a look at ATtiny microcontrollers that are available in DIP
    packages and can be programmed using an ISP programmer. ISP programming can be
    done using any of the Microchip AVR USB programmers as well as most hobby programmers
    built for 8-bit AVRs.


    Basics of 8-pin, 14-pin, 20-pin and 28-pin ATtiny microcontrollers are covered.


    # In this Chapter


    +   - An overview of DIP packaged ATtiny AVR microcontrollers that can be programmed
    in-circuit

    +   - A parametric table for easily comparing different ATtiny parts'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 1.1 ATtiny Microcontrollers


    Before we start programming, it is best to get a general understanding of what
    exactly we will be programming. Various ATtiny devices are listed under the sub-headings
    that follow. Each sub-heading lists ATtiny devices by number of pins. These sections
    are followed by a table of all of the devices discussed, to help assimilate the
    information. All devices listed are available as Dual-Inline Package (DIP) chips.
    In the Microchip/Atmel documentation for ATtiny devices, DIP ICs are known as
    Plastic Dual-Inline Package, or PDIP devices. Although the text uses 8-pin ATtiny
    devices, it is possible to use devices that have more pins. Devices with more
    pins are discussed for readers who may be interested in them.


    The motivation for specifying DIP or PDIP ATtiny microcontrollers is that they
    are much easier to use on an electronic breadboard, and programming is supported
    by many different USB programming devices via the ISP/SPI programming interface.
    ATtiny surface mount device (SMD) parts can also be used with a breadboard, but
    need to be mounted on a breakout board, or similar printed circuit board (PCB).
    Each PDIP device is also available in a surface mount package, so using a breakout
    board with an SMD equivalent of a DIP ATtiny is fine too.


    Basic pinout diagrams of various ATtiny microcontrollers are shown in the figures
    in each subsection that follows. ATtiny and ATmega microcontrollers all have one
    or more internal 8-bit ports that are attached to the pins of each microcontroller,
    one port bit per pin. These ports are named Port A, Port B, Port C and so on,
    or with a shorter notation PA, PB, PC, etc. Ports allow microcontroller pins to
    be configured and manipulated in software. On devices that have few pins, only
    a certain number of port bits are available on the pins of the devices, and not
    the full 8-bits of a port.


    When looking at the figures that follow, notice that the pins for a port are labeled
    with the shorter notation. For example, pins labeled PB0, PB1, PB2, etc. are pins
    from port B or PB of the microcontroller. These pins are input/output (I/O) pins
    that can be individually configured as either inputs or outputs in software. Port
    pins are also multiplexed with various internal peripherals, such as analog to
    digital converters (ADCs), or timer outputs. This means that a pin can be configured
    as either an input, or an output, or as a special function pin connected to an
    internal peripheral. The actual function of the pin is configurable in software.
    In the figures that follow, only the basic port pin numbers are shown, and not
    the alternate functionality.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 1.1.1 8-Pin Devices


    There are two ranges of 8-pin ATtiny microcontrollers available in DIP packages,
    namely ATtiny13 and ATtiny25/45/85. These two ranges are pin compatible (Figure
    1.1), but additional peripherals and memory are available in the ATtiny25/45/85
    range.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_32_0.png)


    Figure 1.1: Basic Pinout of 8-pin DIP ATtiny Devices


    # 1.1.1.1 ATtiny13 and ATtiny13A


    ATtiny13 and ATtiny13A microcontrollers have only 1K byte of Flash memory, 64
    bytes of SRAM and 64 bytes of EEPROM. ATtiny13A devices are a low power version
    of the original ATtiny13, and are a newer device. For this reason ATtiny13A devices
    are preferred, given a choice between the two. ATtiny13(A) refers to both devices.


    ATtiny13 and ATtiny13V devices share a datasheet. ATtiny13 devices operate from
    a voltage of between 2.7V to 5.5V, while ATtiny13V devices operate from 1.8V to
    5.5V, but at a lower clock speed. ATtiny13A devices have their own datasheet,
    separate from the ATtiny13, and operate from a voltage of between 1.8V and 5.5V.


    # 1.1.1.2 ATtiny25, ATtiny45 and ATtiny85


    ATtiny25, ATtiny45 and ATtiny85 microcontrollers are basically the same device,
    but with each one in the series having more memory than the previous. These three
    devices all share the same datasheet, and also have a ''V'' version in the same
    datasheet – the ATtiny25V, ATtiny45V and ATtiny85V. Parts with the V suffix operate
    at voltages between 1.8V and 5.5V, but at lower clock speeds, while parts without
    the V suffix operate at voltages between 2.7V and 5.5V, but at higher clock speeds.
    ATtiny25, ATtiny45 and ATtiny85 devices are collectively referred to as ATtiny25/45/85.


    ATtiny25 devices have 2K bytes of Flash program memory, 128 bytes of SRAM and
    128 bytes of EEPROM. The ''2'' in ATtiny25 indicates 2K bytes of Flash memory.
    ATtiny45 devices have 4K bytes of Flash memory and ATtiny85 devices have 8K bytes
    of Flash memory. Flash, SRAM and EEPROM sizes double for each device in the series.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.1.2 14-Pin ATtiny24, ATtiny44 and ATtiny84


    ATtiny24, ATtiny44 and ATtiny84 devices are 14-pin microcontrollers, as shown
    in Figure 1.2. and all share the same datasheet which includes the ‘V’ variants
    of these devices – the ATtiny24V, ATtiny44V and ATtiny84V. As seen with the 8-pin
    devices, parts with a V suffix can operate at lower voltages, but also operate
    at lower clock frequencies than the parts without the V suffix.


    Newer devices that feature low power operation are now available in this group
    of microcontrollers. These newer devices have an ‘A’ suffix – the ATtiny24A, ATtiny44A
    and ATtiny84A, and share their own datasheet separate from the older devices.
    It is preferable to use these newer ‘A’ devices than the older devices.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_33_0.png)


    Figure 1.2: Basic 14-pin DIP ATtiny Devices


    Memory sizes of 14-pin ATtiny24, ATtiny44 and ATtiny84 devices are the same as
    for 8-pin ATtiny25, ATtiny45 and ATtiny85 devices, with the first number in the
    part name specifying the Flash memory size in kilobytes.


    # 1.1.3 20-Pin Devices


    In 20-pin DIP packages, there are two main ATtiny groups, the ATtiny26/261/461/861
    and ATtiny2313/4313. As can be seen in Figure 1.3 and Figure 1.4, the two groups
    have different pinouts.


    # 1.1.3.1 ATtiny26


    The ATtiny26 has really been replaced by the ATtiny261A, although the ATtiny26
    is still in production at the time of writing. ATtiny26 and ATtiny261 devices
    share a datasheet. The ATtiny26 operates from a voltage between 4.5V and 5.5V
    and up to 16MHz, while the ATtiny26L operates from 2.7V to 5.5V and up to 8MHz.
    ATtiny26 microcontrollers have 2K bytes of Flash program memory, 128 bytes of
    SRAM and 128 bytes of EEPROM. It is preferable to use the newer ATtiny261A rather
    than the ATtiny26 if possible.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 1.1.3.2 ATtiny261, ATtiny461 and ATtiny861


    ATtiny261, ATtiny461 and ATtiny861 share a datasheet with their lower voltage,
    and lower clock speed ''V'' variants (ATtiny261V, ATtiny461V and ATtiny861V).
    In this datasheet the ATtiny261 and ATtiny261V are marked as mature devices, so
    are not recommended for new designs. The ATtiny261A is the replacement for these
    two parts.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_34_0.png)


    Figure 1.3: Basic Pinout of 20-pin DIP ATtiny261/461/861 Devices


    It is preferable to use the newer low power ATtiny261A, ATtiny461A1 and ATtiny861A
    devices, which share a separate datasheet from the older devices. As with the
    previous 8-bit and 14-pin devices, the first number in the part name of these
    devices denotes the size of Flash memory in kilobytes. Memory sizes for Flash,
    SRAM and EEPROM are the same for the ATtiny261/461/861 20-pin devices, as for
    the ATtiny25/45/85 8-pin devices and ATtiny24/44/84 14-pin devices. Each member
    of these groups has double the memory capacity of the preceding device.


    # 1.1.3.3 ATtiny2313 and ATtiny4313


    The main feature of ATtiny2313 and ATtiny4313 devices is that they have a hardware
    USART peripheral. ATtiny4313 devices have double the memory capacity of the 2K
    bytes of Flash, 128 bytes of SRAM and 128 bytes of EEPROM of ATtiny2313 devices.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_34_1.png)


    Figure 1.4: Basic Pinout of 20-pin DIP ATtiny2313/4313 Devices


    ATtiny2313 and ATtiny2313V devices share a datasheet. It is preferable to use
    the newer ATtiny2313A instead of these older devices. ATtiny2313A and ATtiny4313
    devices share a datasheet and are both low power devices. These devices have basic
    pin compatibility with the older AT90S2313 8-bit AVR, and older AT89C2051 and
    AT89C4051 microcontrollers that have an 8-bit MCS51 architecture. MCS51 is a completely
    different 8-bit architecture to AVR.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 1.1.4 28-Pin Devices


    There are two groups of 28-pin DIP ATtiny microcontrollers available. The ATtiny48/88
    and ATtiny28. Of these two ranges it is practical to only use the ATtiny48/88
    devices as they, like all of the previous devices discussed, are in-system programmable.


    # 1.1.4.1 ATtiny48 and ATtiny88


    ATtiny48 and ATtiny88 devices share a datasheet and are both low power 28-pin
    devices. The ATtiny48 has 4K bytes of Flash, 256 bytes of SRAM and 64 bytes of
    EEPROM, while the ATtiny88 has 8K bytes of Flash, 512 bytes of SRAM and also 64
    bytes of EEPROM.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_35_0.png)


    # 1.1.4.2 ATtiny28L and ATtiny28V


    ATtiny28L and ATtiny28V devices are not recommended for most applications, primarily
    because they are not in-system programmable. High voltage programming must be
    used to program these devices, such as HVPP, or High Voltage Parallel Programming.
    These devices also have no SRAM or EEPROM. Because these devices require high
    voltage programming, they won''t be considered further in this book.


    # 1.2 Which ATtiny to Use


    Any of the 8-pin devices discussed in this chapter are good choices to have available
    when following this book. Having a few 8-pin ATtiny devices from the ATtiny25/45/85
    range is a good start, this includes the ''V'' variants. It is also fine to use
    an ATtiny13, ATtiny13A, or ATtiny13V which are also 8-pin devices. Although specific
    ATtiny devices have been chosen for this book, assembly and C programs in this
    book apply to all ATtiny devices and even devices from the ATmega range, although
    some changes to programs may be needed in certain cases. Circuits and software
    presented for 8-pin devices can easily be adapted to run on higher pin count devices.'
  merge: -1
  img_proc: true
