- pgno: 340
  md: '![](img/83ef13a6c66cc7882b2f357e97f451dc_340_0.png)


    # Figure A.7: Select the USBTinyISP Driver


    To test the driver installation, plug the USBTinyISP into a USB port of the host
    computer. Right-click the Windows Start button, and then click Device Manager
    on the menu that pops up. Expand the Atmel USB Devices item in the Device Manager
    dialog box by clicking the arrow next to this item. USBTiny should be seen under
    Atmel USB Devices. If the USBTinyISP is disconnected from the USB port, it will
