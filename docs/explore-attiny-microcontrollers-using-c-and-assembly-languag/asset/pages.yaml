    After connecting all of the ISP/SPI wires between the programmer and the target
    ATtiny, plug the programmer/debugger into a USB port of the host computer, start
    Microchip Studio and then power up the circuit. In order to take the ATtiny out
    of debugWIRE mode, a debugging session must be started using any project that
