    dec   r16

    brbc SRGE_Z, delloop1

    ret

    ```


    After writing 0b0001_1111 to R18, R18 is written to DDRB to set up pins PB0 to
    PB4 as outputs, as we have done before. R18 is then used in the main loop to send
    the same value to the PINB register in order to toggle all 5 LEDs at the same
    time. Every time through the loop, the same value is written to PINB, toggling
    the LEDs each time. This program uses only three lines of code in the loop and
    is therefore the most efficient way to toggle LEDs of the three methods shown.


    Note that writing 0 to any bit in the PINB register that corresponds to an output
    pin will not affect the state of the output pin. In the above program, if we set
    pins PB0 to PB4 as output pins as before, and wrote 0b0001_1110 to PINB in the
    main loop so that the LSB was written 0 every time, then only pins PB1 to PB4
    would toggle. Pin PB0 would not be affected at all because it would be written
    with 0 each time through the loop.


    A program equivalent to led_pin_toggle_asm can easily be written in C. This is
    shown in the led_pin_toggle_c project code listing that follows. In the same way
    that we have done many times before, DDRB is used to set up pins PB0 to PB4 as
    outputs, to be used with the circuit of Figure 8.2. In the while(1) loop, the
    delay function is called. It does not matter whether this function is called at
    the top or bottom of the loop. PINB is written with 0x1F to toggle all of the
    LEDs on pins PB0 to PB4 at the same time.'
