- pgno: 302
  md: "Bits that are found in the status register or SREG are defined in the header\
    \ file for the AVR being used. These names can be used with the BRBS and BRBC\
    \ instructions, and are shown as they appear in the header file below.\n\n```\n\
    ; SREG - Status Register\n.equ SREG_C = 0 ; Carry Flag\n.equ SREG_Z = 1 ; Zero\
    \ Flag\n.equ SREG_N = 2 ; Negative Flag\n.equ SREG_V = 3 ; Two's Complement Overflow\
    \ Flag\n.equ SREG_S = 4 ; Sign Bit\n.equ SREG_H = 5 ; Half Carry Flag\n.equ SREG_T\
    \ = 6 ; Bit Copy Storage\n.equ SREG_I = 7 ; Global Interrupt Enable\n```\n\nBRBS\
    \ is the counterpart to BRBC. While BRBC checks if a status register bit is clear,\
    \ BRBS checks if a status register bit is set. The other branch instructions that\
    \ follow are synonyms for BRBS and BRBC, and are typically used after one of the\
    \ compare instructions.\n\n# Branch if Equal or Not Equal – SREG Z Flag\n\n+ \
    \  **BREQ (Branch if Equal)**\n+   Equivalent to BRBS SREG_Z,k where k is the\
    \ constant relative address to branch to.\n+   \n+   **BRNE (Branch If Not Equal)**\n\
    +   Equivalent to BRBC SREG_Z,k where k is the constant relative address to branch\
    \ to.\n\n# Branch if Carry Set or Cleared – SREG C Flag\n\n+   **BRCS (Branch\
    \ if Carry Set)**\n+   Equivalent to BRBS SREG_C,k where k is the constant relative\
    \ address to branch to.\n+   \n+   **BRCC (Branch if Carry Cleared)**\n+   Equivalent\
    \ to BRBC SREG_C,k where k is the constant relative address to branch to.\n\n\
    # Branch if Same or Higher, or Lower – SREG C Flag\n\n+   **BRSH (Branch if Same\
    \ or Higher (Unsigned))**\n+   Equivalent to BRCC SREG_C,k where k is the constant\
    \ relative address to branch to.\n+   \n+   **BRLO (Branch if Lower (Unsigned))**\n\
    +   Equivalent to BRBS SREG_C,k where k is the constant relative address to branch\
    \ to."
