    # 10.3.1.2 How the wait_ms_C Project Code Works


    Code in main.c should be self explanatory and the description already given should
    suffice. Most important is the inclusion of wait_ms.h in main.c. This file allows
    the wait_ms subroutine to be called and the WAIT_MS_TIME_C macro to be used.


    In wait_ms.h is the WAIT_MS_TIME_C macro definition. This macro is used to calculate
    the number used by the wait_ms subroutine to generate the correct number of delay
    cycles for the given millisecond delay. This macro is passed the number of milliseconds
    and uses this value together with F_CPU to calculate the number for wait_ms to
    use. This is the same calculation as we have used before, but it now subtracts
    20 because the number of clock cycles used before and after the loop in wait_ms
    has changed.


    The wait_ms subroutine is declared external by using the extern C keyword placed
    before the wait_ms subroutine function prototype in wait_ms.h. This declaration
    together with the .global directive in the wait_ms.S file makes the wait_ms subroutine
    available and visible to any C file that includes the wait_ms.h header file.


    The wait_ms.S file contains the code for the wait_ms subroutine. This code is
    basically the same code that we have been using to generate software time delays
    in the previous few projects, but does have some modifications. It is still decrementing
    a 32-bit number in the loop, but this time uses different registers to hold the
    32-bit number. The reason for'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'this is that these registers are the registers that the C code automatically
    uses to pass the 32-bit number to the subroutine. The uint32_t value that can
    be seen in the function prototype in wait_ms.h is passed to the wait_ms subroutine
    using a certain register convention. This value is the value that is passed to
    wait_ms() in the code in main.c using the macro WAIT_MS_TIME(). Section 6 of the
    Atmel AT1886: Mixing Assembly and C with AVRGCC document is called Parameter passing
    and contains the information about which registers are used to pass parameters
    to a function. The following is stated in this section:


    > " Arguments in a fixed argument list are assigned, from left to right, to registers
    r25 through r8. "


    This means that when a 32-bit number is passed to a function or subroutine, the
    left-most byte of the number, or byte 3, is assigned to R25. Byte 2, or the byte
    to the right of byte 3 is assigned to R24. Byte 1 is assigned to R23. Finally
    Byte 0, or the right-most byte of the 32-bit number is assigned to R22. These
    registers therefore replace R19 down to R16 that were used in previous versions
    of the delay loop in the wait_ms subroutine. The only register still used by the
    subroutine is R20, which holds the result of the OR operations.


    At the start of the wait_ms subroutine, R20 is pushed onto the stack to preserve
    its value. After the BRBC instruction at the bottom of the loop, R20 is popped
    from the stack to restore its original value. In order to balance the number of
    clock cycles that are used up outside the loop in wait_ms, the value in R20 is
    pushed back onto the stack and then popped from the stack again. This uses up
    four clock cycles, which could have been done using four NOP instructions.


    To get the total number of clock cycles used outside the loop to 20, two NOP instructions
    are run before the RET instruction. The PUSH instruction at the start of wait_ms,
    together with the instructions below BRBC add up to 13 clock cycles, if we subtract
    1 to compensate for BRBC being 1 clock cycle instead of 2 the last time that it
    is run. Add to this the 4 clock cycles from the four LDI instruction added by
    the C code to pass the 32-bit value to the subroutine, and the 4 clock cycles
    added by the C code to call the subroutine, and we have a total of 20 clock cycles
    outside the loop of the wait_ms subroutine. Take a look at the disassembled code
    in the Disassembly window of the project when run in the simulator to see the
    code that was added to pass the 32-bit value to the subroutine and to call the
    subroutine.'
  merge: -1
  img_proc: true
- pgno: 265
  md: "# 10.3.2 Returning a Value from an Assembly Subroutine in C\n\nOnce again we\
    \ refer to section 6 of the Atmel AT1886: Mixing Assembly and C with AVRGCC document\
    \ called Parameter passing in order to find information on how to return a value\
    \ from an assembly language subroutine that is called from a C program. The document\
    \ says the following about returning a value: \" Return values use the registers\
    \ r25 through r18, depending on the size of the return value. \" It also says\
    \ the following about passing char arguments to a subroutine: \" All arguments\
    \ use an even number of registers. This results in char arguments consuming two\
    \ registers. \" In the next project called asm_add_c, two char arguments are passed\
    \ to an assembly language subroutine from C code, added together by the subroutine,\
    \ and a char result returned from the subroutine. Create the project in Microchip\
    \ Studio and add the add8bit.S and add8bit.h files to the project, in the same\
    \ way that extra files were added to the previous project. Enter the code from\
    \ the following listings in the project files.\n\n```\nasm_add.c : main.c\n#include\
    \ <avr/io.h>\n#include \"add8bit.h\"\n\nint main(void)\n{\n  volatile char sum;\n\
    \  sum = add8bit(34, 91);\n}\n```\n\n```\nasm_add.c : add8bit.h\n#ifndef ADD8BIT_H_\n\
    #define ADD8BIT_H_\n\nextern char add8bit(char, char);\n#endif /* ADD8BIT_H_ */\n\
    ```\n\n```\nasm_add.c : add8bit.S\n.global add8bit\n\nadd8bit:\n  add  r24, r22\
    \  ; arg1: r25 and r24, arg2: r23 and r22\n  ret          ; return registers are\
    \ r25 and r24\n```"
  merge: -1
  img_proc: true
- pgno: 266
  md: "Although this project does not cover timers or timing, the subject of this\
    \ chapter, we look at it here while on the subject of calling subroutines from\
    \ C. As can be seen in the add8bit.S file, R24 and R22 are used as the two char\
    \ arguments of the add8bit subroutine. The C prototype for the subroutine can\
    \ be seen in add8bit.h. Because char arguments are allocated in pairs by the GCC\
    \ C compiler, R25 and R24 represent the first char argument, but only R24 is used.\
    \ For the second argument, R23 and R22 are allocated, but only R22 is used. R25\
    \ and R24 are allocated to hold the return value by the C compiler, but only R24\
    \ is used. In main.c the sum variable is declared volatile so that the C compiler\
    \ does not optimize it away. It is necessary to look at the disassembly of the\
    \ code to see what is really happening. The following disassembly listing was\
    \ taken from the project built for an ATtiny45.\n\n```\nasm_add.c : disassembly\n\
    \n--- add8bit.S ----\n        add   r24, r22        ; arg1: r25 and r24, arg2:\
    \ r23 and r22\n00000018  ADD R24,R22         Add without carry\n        ret  \
    \                 ; return registers are r25 and r24\n00000019  RET          \
    \       Subroutine return\n--- main.c ----\n{\n0000001A  PUSH R28            Push\
    \ register on stack\n0000001B  PUSH R29            Push register on stack\n0000001C\
    \  PUSH R1             Push register on stack\n0000001D  IN R28,0x3D         In\
    \ from I/O location\n--- main.c ----\n0000001E  IN R29,0x3E         In from I/O\
    \ location\n        sum\n0000001F  LDI R24,0x5B        ; 91\n        sum     \
    \              LDI R22,0x5B\n00000020  LDI R24,0x22        Load immediate\n00000021\
    \  RCALL PC-0x0009     Relative call subroutine\n00000022  STD Y+1,R24       \
    \  Store indirect with displacement\n}\n00000023  LDI R24,0x80        Load immediate\n\
    00000024  LDI R25,0x80        Load immediate\n00000025  POP R0              Pop\
    \ register from stack\n00000026  POP R29             Pop register from stack\n\
    00000027  POP R28             Pop register from stack\n00000028  RET         \
    \        Subroutine return\n--- No source file ----\n00000029  CLI           \
    \      Global Interrupt Disable\n0000002A  RJMP PC-0x8000      Relative jump\n\
    ```\n\nIn the above disassembly, the interrupt vector table and C runtime code\
    \ is not displayed. Values are passed to the add8bit subroutine at address 0000001F\
    \ and 00000020. These value are 0x5B or 91 loaded to R22, and 0x22 or 34 loaded\
    \ to R24. After this, is a call to"
  merge: -1
