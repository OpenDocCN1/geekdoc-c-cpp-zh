- pgno: 99
  md: '# 6.1 Clock Pulses and Program Counter


    At the most basic level, the core of a microcontroller is driven by a clock pulse.
    One of the things that the clock pulse drives in a microcontroller is the program
    counter.


    # 6.1.1 Clock Pulses


    A clock pulse is a square wave either generated by internal microcontroller circuitry,
    or fed to the microcontroller from an external oscillator. A square wave is basically
    a one bit binary counter as shown in the middle of Figure 6.1.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_99_0.png)


    Figure 6.1 shows a square wave at the top of the figure which is a voltage changing
    from 0V to 5V and back to 0V continuously over time. The voltage remains at either
    0V or 5V for a period of time, giving the pulse its square shape. In the middle
    of the figure is the same clock pulse shown at the top of the figure, but this
    time the clock pulse is shown in logic levels of zero and one. The logic levels
    continuously change from 0 to 1 and back to 0 over time. This is the same as the
    least significant bit of a binary number that is continually being incremented.


    Both the top clock pulses of Figure 6.1 are ideal clock pulses and have perfectly
    square vertical lines or edges. A real clock pulse is shown at the bottom of the
    figure. The voltage of a clock pulse does not rise instantaneously from 0V to
    5V in reality, but instead takes a'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'short time to rise to 5V, called rise time, as shown in the figure. In the
    same way the voltage of a clock pulse does not instantaneously drop from 5V to
    0V, but takes a short time to drop, called fall time. Both the rise and fall times
    give the clock pulse vertical lines or edges that are angled.


    In datasheets and other documents, clock pulses are frequently drawn as real clock
    pulses with sloping edges. Note that the way that real clock pulses are illustrated,
    as shown in the figure, is an exaggeration. The time taken for the clock pulse
    to rise or fall is very small in comparison to the overall size of each pulse.
    It is necessary to exaggerate the rise and fall times in drawings and illustrations,
    otherwise the fact that rise and fall times are present would not be visible.


    # 6.1.2 Clock Pulse Period and Frequency


    The period of a clock pulse is the time taken for the clock pulse to complete
    one cycle from 0V to 5V and back to 0V that includes one full on time (5V or logic
    1) and one full off time (0V or logic 0) of the pulse as shown in Figure 6.2.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_100_0.png)


    The frequency of a clock pulse is the number of cycles per second of the clock
    pulse. A 1MHz clock pulse oscillates at one million clock cycles per second.


    # 6.1.2.1 ATtiny13(A) Default Clock Frequency


    ATtiny13 and ATtiny13A microcontrollers derive their main clock from an internal
    9.6MHz RC (resistor capacitor) oscillator which is divided by 8 internally to
    give 1.2MHz by default, so the default main clock of a new ATtiny13(A) is a 1.2MHz
    set by its default fuse settings.


    # 6.1.2.2 ATtiny25/45/85 Default Clock Frequency


    ATtiny25/45/85 devices derive their main clock from an internal 8MHz RC oscillator
    which is divided by 8 to give a 1MHz default clock frequency, so the default main
    clock of a new ATtiny25/45/85 is 1MHz set by the default value of the internal
    fuse settings.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 6.1.2.3 RC Oscillator Accuracy


    Because the default clock for the AVR is derived from an RC oscillator it is not
    as accurate as a clock from a quartz crystal oscillator. An accuracy of ±10% is
    given in the datasheet for the RC oscillator. This accuracy is specified when
    operating the AVR from 3V at a temperature of 25°C.


    # 6.1.2.4 Clock Sources and Improving Accuracy


    An external quartz crystal can be used on the ATtiny25/45/85 to produce a more
    accurate clock source, but this uses up two pins of the microcontroller. This
    is one of the ways where ATtiny25/45/85 devices differ from ATtiny13(A) devices
    – ATtiny13(A) devices only have three clock sources to choose from, namely, an
    external clock input, internal RC oscillator, and internal 128kHz oscillator.
    This means that ATtiny13(A) devices do not have a crystal oscillator circuit,
    so can''t use an external crystal or ceramic resonator directly on two pins. ATtiny25/45/85
    devices on the other hand, have all of the clock sources that ATtiny13(A) devices
    have as well as a high frequency PLL clock, an additional internal RC oscillator
    source, a low-frequency crystal oscillator (uses an external 32.768kHz watch crystal),
    and a crystal oscillator / ceramic resonator derived clock (uses and external
    quartz crystal or ceramic resonator).


    Another way of improving the accuracy of the oscillator is to follow a calibration
    procedure for the RC oscillator that uses a calibration register in the AVR. Alternatively
    an external clock source can be used that will use only one extra pin of the microcontroller.


    # 6.1.2.5 Calculating Clock Period from Frequency


    If an AVR is operating at 1MHz, then the period of its clock or clock pulse is
    1µs (one microsecond). This means that an instruction that takes one clock cycle
    to run will be executed in 1µs. To convert from frequency to period, use the formula:


    $t = \frac{1}{f}$ Where t is the time period and f is the frequency.


    It is easy to convert between clock frequency and period using a calculator as
    follows. For a 1MHz frequency we divide one by one million and get 0.000001 or
    1µs. To do this on the Windows calculator, first put the calculator into scientific
    mode using the top left menu icon. Click 1, +, 1, exp, 6, and then = which displays
    a result of 0.000001. Click the F-E button on the calculator and the result now
    displays as 1.e-6.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'When entering this calculation, we are using exponential notation where the
    key presses 1, exp, 6 (one exponent six) is a way of writing one million which
    is 1 followed by 6 zeros. The result of the calculation is 0.000001 which is easier
    to read after pressing the F-E button which changes the number to 1.e-6 or one
    exponent minus six. Minus six lets us know that this is microseconds. Click the
    F-E button again to change back to normal notation.


    # 6.1.2.6 Calculating Clock Frequency from Period


    To convert from period to frequency, use the formula:


    f = 1/t Where t is the time period and f is the frequency.


    To find the frequency of a clock source with a 1µs period on the Windows 10 calculator
    in scientific mode, enter 1, +, 1, exp, 6, ±, then click = followed by the F-E
    key. The key presses 1, exp, 6, ± is the same as one exponent minus six which
    is 0.000001 where –6 represents size in decimal places to the right of the decimal
    point. The ± key simply changes the sign of 6 from + (positive) to – (negative).
    The result of the calculation is 1.e+6 which is 1,000,000 or one million (1MHz).
    Pressing the F-E key converts the number to exponential notation which is easier
    to read as we can see that it is one with six zeros and know that it is therefore
    1MHz or one megahertz.


    To summarize, on the calculator, 1.e+6 is 1 exponent 6, or 1 x 10^6 or 1,000,000.
    Ten to the power of 6, or 1 followed by six zeros is mega, or megahertz if we
    are dealing with frequency. 1.e-6 is 1 Exponent -6, or 1 x 10^-6, or 0.000,001
    and is micro, or microseconds when dealing with period.


    # 6.1.3 The Program Counter


    A program counter (PC) is a register in a microcontroller that contains the address
    of an instruction to execute. When an AVR microcontroller is powered on or reset,
    the program counter is reset to zero so that it addresses the first instruction
    in Flash memory at address 0x0000. This allows microcontroller to fetch the instruction
    at address 0, and execute it. The program counter is then incremented by one so
    that it points to the next instruction in Flash program memory at address 0x0001.
    The microcontroller then fetches the instruction at 0x0011 and executes it. Again
    the program counter is incremented so that it points to the instruction at 0x0002,
    which is fetched and executed.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'The program counter or PC continues to be incremented by one and the instruction
    that it points to is fetched and executed each time. Instructions are fetched
    and executed sequentially until a branch or jump instruction is executed that
    causes a non-sequential address to be loaded to the program counter. Once the
    jump has occurred, the instruction at the new address is fetched and executed,
    then the program counter continues to increment by one causing the microcontroller
    to fetch and execute sequential instructions after the new address that it jumped
    to. Calling a subroutine and returning from a subroutine also causes the address
    in the program counter to be altered so that the subroutine can be run. The above
    explanation assumes 16-bit wide instructions.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_103_0.png)


    Figure 6.3: Program Counter Increments after Each Instruction Executes


    Open the test_asm project in Microchip Studio. If the main.asm file does not open
    when starting Microchip Studio and opening the test_asm project then double-click
    the main.asm file in the Solution Explorer pane at the right of Microchip Studio.
    Start the debugger/simulator using the Start Debugging and Break icon or F10 key.
    Make sure that the Processor Status window is open. Step over the assembly instructions
    and look at how the Program Counter at the top of the Processor Status window
    increments, as can be seen in Figure 6.3. Most AVR instructions are 16-bits wide
    and execute in a single clock cycle. The program counter will increment by one
    each time an instruction is stepped over in the debugger. Instructions like STS
    and LDS from the previous chapter are 32-bit wide instructions and so must be
    fetched and executed in two clock cycles. When a 32-bit wide instruction is executed,
    the program counter will be seen to increment by two in the debugger. This occurs
    because the microcontroller fetches the first half of'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'the instruction, then increments the PC and fetches the second half of the
    instruction before executing it. This is done in one step of the debugger, so
    we see the PC increment by two after stepping over a 32-bit instruction.


    Opening the led_blink.asm project from Chapter 2 and running it in the debugger
    shows that the instructions in the main program are all single cycle instructions.
    After stepping over each instruction, the program counter increments by one. When
    the RJMP instruction is executed at the bottom of the main loop, the program counter
    is loaded with the address of the SBI instruction under the loop label and execution
    starts at the top of the loop again.


    The program counter can be thought of as a binary counter that is driven by the
    main clock of the microcontroller and continues to count up with each clock pulse.
    A new count value is loaded to the PC when a jump or branch instruction is executed
    or a subroutine is called or returned from. The count value, of course, is used
    to address memory which causes the microcontroller to fetch an instruction from
    that memory address and execute it.


    The ATtiny13(A) program counter is 9 bits wide so that it can address 2^9 or 512
    16-bit wide instructions, which of course is 1024 bytes, or 1K. In the ATtiny25,
    the program counter is 10 bits wide because it only needs to address 2^10 instructions
    (1K or 1024 instructions) which is 2^10 x 2 bytes (2K or 2048 bytes because the
    program memory is 16-bits wide). In the ATtiny45, the program counter is 11 bits
    wide so that it can address its 2^11 or 2K 16-bit wide instruction memory (4K
    bytes). The ATtiny85 has a 12 bit wide PC for its 2^12 or 4K 16-bit wide instructions
    (8K bytes).


    # 6.2 Microcontroller Buses


    A bus on a microcontroller or microprocessor is a group of wires. An 8-bit bus
    is a group of 8 wires. Figure 6.4 shows a block diagram of a general microcontroller
    that has an address bus, data bus and control bus represented by wide lines. The
    address bus could be 16 bits wide, depending on the microcontroller, and would
    then consist of 16 wires. An 8-bit microcontroller would have an 8-bit wide data
    bus consisting of 8 wires. The number of wires on the control bus varies between
    architectures, but usually has some chip select lines as well as read and write
    control lines. Microcontroller buses are used to get data from, and send data
    to memory and I/O devices. Depending on the microcontroller, the buses may be
    internal only, or extend to pins on the microcontroller allowing external memory
    and peripherals to be interfaced to the microcontroller buses.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'The way that microcontrollers and microprocessors generally work when fetching
    a machine code instruction from memory, is that the address in the program counter
    is placed on the address bus. A chip select line that is part of the control bus
    is then asserted to select the correct memory chip. The control bus read line
    is asserted to ensure that the instruction is read from memory. At this stage
    the correct instruction from memory is placed on the data bus from the memory
    location that is addressed. The data that is fetched from memory is a machine
    code instruction that will be decoded and executed by the microcontroller core
    or CPU (Central Processing Unit).


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_105_0.png)


    # 6.3 Harvard and von Neumann Architectures


    Figure 6.4 shows a von Neumann architecture where the program memory, data memory
    and I/O address space share common address, data and control buses. AVR microcontrollers
    use a Harvard architecture which has separate buses for program memory and data
    memory as shown in Figure 6.5.


    The AVR with its Harvard architecture increases performance with its parallel
    data and program buses. While an instruction is being fetched from program memory,
    data can be transferred between I/O or data memory space on the separate bus.
    On a von Neumann architecture, an instruction would first be fetched and executed.
    If the instruction was an instruction that accesses data memory, the address of
    the data memory would then be placed on the common address bus and the memory
    accessed via the data bus. The next instruction would only be fetched after the
    transfer from the data memory.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'A Harvard architecture allows program memory and data memory spaces to both
    start at address 0 as they are separate address spaces. Although the EEPROM on
    AVR microcontrollers shares the data bus of the data memory or SRAM, it also starts
    at address 0 because it is accessed as a separate address space using its own
    set of registers and access protocol.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_106_0.png)


    # 6.4 Fetching and Executing Instructions


    All microcontrollers fetch program instructions from memory and execute them.
    Figure 6.6 shows a simplified block diagram of an AVR microcontroller. Machine
    language instructions are fetched from Flash program memory into an instruction
    register and decoded by an instruction decoder. An Arithmetic and Logic Unit (ALU)
    does mathematical and logic calculations on values in the general purpose registers.
    All events that occur on a microcontroller are driven by the clock pulse of the
    microcontroller. If the clock is stopped, the microcontroller no longer fetches
    and executes instructions.


    AVR microcontrollers have an enhancement that improves performance when compared
    to general microcontrollers discussed so far. A single level pipeline allows the
    next instruction to be pre-fetched while the current instruction is being executed.
    By pre-fetching the next instruction while the current instruction is executing,
    an instruction can be executed in one clock cycle. Figure 6.7 shows how the pipeline
    improves AVR performance. In a microcontroller without an instruction pipeline
    the first instruction would be fetched in the first'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'clock cycle and then executed in the second clock cycle. The second instruction
    would be fetched in the third clock cycle and executed in the fourth clock cycle.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_107_0.png)


    Figure 6.6: Simplified Block Diagram of an AVR


    | Clock Cycle 1 | Clock Cycle 2 | Clock Cycle 3 | Clock Cycle 4 |

    | :--- | :--- | :--- | :--- |

    | 1st Instruction Fetch | 2nd Instruction Fetch | 3rd Instruction Fetch | 4th
    Instruction Fetch |

    | 1st Instruction Execute | 2nd Instruction Execute | 3rd Instruction Execute
    | |


    Figure 6.7: AVR Instruction Fetch and Execute Pipeline


    Older microcontrollers would in fact typically fetch and execute an instruction
    in four clock cycles, or more if the address bus is multiplexed. Four steps in
    executing a machine code instruction are 1) fetch the instruction from memory,
    2) decode the instruction, 3) execute the instruction in the ALU and 4) store
    the result of the operation back in a register.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'In AVR microcontrollers the instruction has already been pre-fetched in the
    previous clock cycle. Instruction decoding, execution and storing of the result
    are done in a single clock cycle – shown in the instruction execute blocks of
    Figure 6.7. In a single clock cycle, the AVR fetches the register operands, performs
    an ALU operation on the operands and stores the result in the destination register.


    # 6.5 Status Register


    The Status Register is updated with information about the result of the most recently
    executed arithmetic instruction. It also contains a global interrupt enable bit.
    Figure 6.8 shows the 8-bit status register and the meaning of each bit. In this
    section we look at how some of the bits in the status register are used in an
    assembly language program. Other bits in the status register are explained as
    they are used in programs throughout the book.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_108_0.png)


    # 6.5.1 Zero Flag


    Bit 1 in the status register is called the zero flag. A flag is a bit that signals
    when a certain state occurs. The zero flag signals when the result of an arithmetic
    operation is zero. A branch instruction can be used to test the state of the zero
    flag and branch if the zero flag indicates that the result of a decrement operation
    is not zero, as the next example program shows.'
  merge: -1
  img_proc: true
