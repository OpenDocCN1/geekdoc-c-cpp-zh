    ![](img/83ef13a6c66cc7882b2f357e97f451dc_41_0.png)


    # Figure 2.1: 8-Pin ATtiny LED Circuit and ISP/SPI Header Pinout


    Figure 2.2 shows the pinout of the Atmel-ICE programming cable. Be sure to plug
    the small 10-pin connector at the end of this cable into the port marked AVR on
    the Atmel-ICE, as shown in Figure 2.3. The pinout of the 6-pin connector also
