  md: '# 7.4.3 Logical Exclusive OR


    Figure 7.3 shows the truth table for the exclusive OR (EOR) logical operation
    and an example of its use on two 8-bit registers. As with the AND and OR logical
    operations, the EOR performs a bitwise logical operation of each bit in the number
    in a register with the corresponding bit of a number in a second register. Exclusive
    ORing two input bits that have the same value always results in 0 as can be seen
    in the truth table. Exclusive ORing two bits of different values results in 1.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_146_0.png)


    The AVR instruction set contains one exclusive OR instruction, EOR (Logical Exclusive
    OR), that exclusive ORs the values in two registers with each other. The following
    code demonstrates the use of the EOR instruction.


    ```

    test_asm : main.asm – EOR example


