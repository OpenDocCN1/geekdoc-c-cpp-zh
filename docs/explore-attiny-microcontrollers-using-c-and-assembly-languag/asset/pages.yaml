    \ In the status register, the first bit on the left, or bit number 7, is the Global\
    \ Interrupt Enable bit, or I bit. Once this bit is set, any individual interrupts\
    \ that are enabled, such as the timer/counter 0 compare match A interrupt, will\
    \ work when triggered. Finally the timer is started as done previously by selecting\
