    \ 2,147,483 milliseconds with our wait_ms subroutine, but if a value of 20MHz\
    \ and 2,147,484 or bigger is used, our wait_ms subroutine will fail.\n\n# Posing\
    \ Value Limits in Assembly Language\n\nA common way of posing limits on fixed\
    \ values used in assembly language code is to use assembler directives to detect\
    \ the limits and generate an error or warning, should the limits be out of range.\
    \ The following code added to the top of the wait_ms.asm file from the wait_ms_asm\
    \ project shows how this is done.\n\n```\nwait_ms.asm : wait_ms.asm - top part\
    \ of code\n; Millisecond delay subroutine - time set by MS_TIME_DEL\n.equ WAIT_MS_CYCLES\
    \ = (((f_CPU * MS_TIME_DEL) / 1000) - 10) / 10\n.if (WAIT_MS_CYCLES > (exp(32))\
    \ - 1))\n    error \"F_CPU MS_TIME_DEL combination out of range in wait_ms subroutine.\"\
    \n.endif\nwait_ms:\nldi R16, low (WAIT_MS_CYCLES)\nldi R17, byte2(WAIT_MS_CYCLES)\n\
    ldi R18, byte3(WAIT_MS_CYCLES)\nldi R19, byte4(WAIT_MS_CYCLES)\n...\n...\n```\n\
    \nThe first modification made at the top of the wait_ms.asm code was to give a\
    \ name to the formula that calculates the number of cycles for the wait_ms function\
    \ to generate. This name is WAIT_MS_CYCLES and is equated at the top of the code\
    \ as shown below.\n\n```\n.equ WAIT_MS_CYCLES = (((f_CPU * MS_TIME_DEL) / 1000)\
    \ - 10) / 10\n```\n\nThis simply means that whenever WAIT_MS_CYCLES is used, the\
    \ result of the formula is substituted. Because of this, WAIT_MS_CYCLES is put\
    \ at the top of the wait_ms subroutine in every place that the formula was previously\
    \ placed, as follows.\n\n```\nwait_ms:\nldi R16, low (WAIT_MS_CYCLES)\nldi R17,\
    \ byte2(WAIT_MS_CYCLES)\nldi R18, byte3(WAIT_MS_CYCLES)\nldi R19, byte4(WAIT_MS_CYCLES)\n\
