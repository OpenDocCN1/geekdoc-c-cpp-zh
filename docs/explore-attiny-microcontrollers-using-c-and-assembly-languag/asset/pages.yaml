- pgno: 326
  md: '# 12.1.1.3 AVRASM2 Options in Microchip Studio


    Some of the command line options passed to AVRASM2 can be changed from within
    Microchip Studio, for example whether or not to generate a list file. These options
    can be found by selecting Project ▶ test_asm Properties... from the top menu,
    or by using the Alt + F7 keyboard shortcut, and then clicking the Toolchain item
    on the left of the page that opens. With the Toolchain item selected, click General
    under AVR Assembler to display the options for the AVRASM2 assembly language program,
    as shown in Figure 12.1.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_326_0.png)


    Figure 12.1: AVR Assembler Toolchain Options


    Checkboxes that are checked by default, as shown in Figure 12.1, correspond to
    options that are passed to AVRASM2 in the Output pane listing. For example unchecking
    Generate MAP file removes the -m switch from the options passed to AVRASM2. Generate
    Hex file corresponds to the -o switch that comes after -f1, and Generate LSS file
    corresponds to the -l switch. Unchecking any of these items removes them from
    the options passed to AVRASM2 that we looked at in section 12.1.1.1. Generate
    EEP file corresponds to the -e switch, and Wrap Relative Jumps corresponds to
    the lowercase -w switch, both of which can be found in the AVR Assembler document
    from Microchip. The top drop-down list called Hex Output Format changes the option
    next to the -f switch, depending on which format is selected. The second drop-down
    list called Unsupported Instructions changes the option used with the uppercase
    -W switch to flag unsupported instructions as either warnings or errors. The other
    optimization flags box is used to pass other command line options to AVRASM2 when
    it is run by Microchip Studio, for example placing the -v6 switch in this box
    stops AVRASM2 from printing additional information in the Output window.'
  merge: -1
  img_proc: true
- pgno: 327
  md: "# 12.1.1.4 List File Options\n\nThe list file generated by AVRASM2 can be useful\
    \ during software development as it shows the final instructions and machine code\
    \ in hexadecimal format that the input assembly language files were converted\
    \ to, as well as resource usage. When the list file is generated it includes the\
    \ entire contents of the .inc file that is automatically included in a Microchip\
    \ Studio assembly language project, placed at the top of the list file. This makes\
    \ it necessary to scroll through the first long section of the list file to find\
    \ the main program code. The normal solution to stop the contents of the .inc\
    \ file being placed in the list file is to use the .nolist assembler directive\
    \ before the file is included, and then use the .list assembler directive to enable\
    \ listing again after the line that includes the .inc file. Because the .inc file\
    \ is included automatically in a Microchip Studio project, the .nolist and .list\
    \ directives can't be used without making a change to the project settings first.\n\
    \nIn order to be able to use the .list and .nolist directives with the automatically\
    \ included file in a Microchip Studio assembly language project, first go to the\
    \ Toolchain General page, as shown in Figure 12.1 on the previous page. Cut (keys\
    \ Ctrl + X) the file name out of the Include File box at the bottom of this page\
    \ so that this box is empty, but the text that was in it is on the Windows clipboard.\
    \ Add the .include directive to the top of the main.asm file of the project and\
    \ paste the .inc file name next to it between angle brackets. Place a .nolist\
    \ directive above the .include directive and a .list directive after it, as shown\
    \ in the following code listing. The .inc file is tn85def.inc for an ATtiny85\
    \ selected for the project.\n\n```\n.nolist\n.include <tn85def.inc>\n.list\n\n\
    start:\n    sbi   DDRB, DDB4        ; Set pin PB4 as output\n    sbi   PORTB,\
    \ PORTB4     ; Set LED pin high\nloop:\n    rjmp  loop\n```\n\nAfter saving the\
    \ changes and building the project, the contents of the .inc file are no longer\
    \ found in the list file. Take note that if the AVR part is changed in the project,\
    \ then the new .inc file for the new part is automatically placed in the Include\
    \ File field of the Toolchain General page. It must be cut from this field again\
    \ and used to replace the previous .inc file next to the .include directive at\
    \ the top of the main.asm file."
  merge: -1
  img_proc: true
- pgno: 328
  md: '# ## 12.1.2 The AVR-AS Assembler


    Back in section 10.3 of Chapter 10 an assembly language subroutine was called
    from a C language program. What wasn''t mentioned there is that the assembler
    program used to assemble the assembly language code file was not the AVRASM2 assembler
    program that is used with Microchip Studio assembly language projects. The GNU
    avr-as assembler program is used when including assembly language files in a C
    program that is built using the AVR GNU toolchain used with Microchip Studio C
    projects.


    Although the avr-as program is the GNU AVR assembler program, assembly language
    code files ending with a .S extension are passed to the avr-gcc.exe program, along
    with other options. This avr-gcc program automatically invokes avr-as when it
    is passed an assembly language file. The avr-as program and AVRASM2 have some
    differences between them and it is necessary to refer to the avr-as documentation
    when mixing C and assembly language using the AVR GNU toolchain. The code examples
    in Chapter 10 were simple enough that it was not necessary to refer to the avr-as
    documentation.


    # ## 12.1.3 The AVRA Assembler


    An open-source assembler program called AVRA that is almost compatible with the
    Microchip assembler for AVR microcontrollers is available. This assembler is most
    useful for users wanting to use an AVR assembler program on other operating systems
    such as Linux. Linux distributions such as Linux Mint include AVRA in their repositories,
    making it easy to install. The source code for the AVRA project is available on
    GitHub at: github.com/Ro5bert/avra


    # ## 12.2 The GNU C Toolchain


    The open-source GNU C toolchain is the default C toolchain used with Microchip
    Studio, and the various versions of Atmel Studio that came before it. As with
    a Microchip Studio assembly language project, a GCC C project has toolchain settings
    that can be found by selecting Project ▶ <project name> Settings... from the top
    menu, or by using the Alt + F7 keyboard shortcut, and then clicking the Toolchain
    item at the left of the page that opens. On this page, settings are found for
    the AVR GNU C compiler, linker and assembler. One of the main settings that changes
    the generated machine code is the Optimization setting found under AVR/GNU C Compiler.
    The Optimization Level field on this page is used to change the optimization of
    C code, and therefore the generated assembly and machine'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'code. Optimization can be set to one of several levels, or switched completely
    off. After following this book you now have the skills to examine the code generated
    by the C compiler by examining the disassembled code in the Disassembly window
    of a C code project being debugged. By default, a Microchip Studio GNU C project
    also generates a listing file that shows the assembly language code that was generated
    from the C code. This file is found in the Solution Explorer pane by expanding
    the Output Files item, and has a .lss file extension. Double-click this file to
    open it in Microchip Studio.


    The GNU C toolchain for AVR microcontrollers is available for various operating
    systems, which means that code written in AVR GNU C projects using Microchip Studio
    can be built on other operating systems, such as Linux. Many Linux distributions
    have the GNU C tools for AVR microcontrollers available in their repositories.
    Microchip also supply the same version of the GNU C toolchain for AVR microcontrollers
    used in Microchip Studio for various operating systems. These toolchains can be
    downloaded from: www.microchip.com/en-us/development-tools-tools-and-software/gcc-compilers-avr-and-arm


    # 12.3 Where to from Here?


    I hope that you have enjoyed this adventure exploring the inner workings of 8-bit
    AVR microcontrollers using ATtiny devices from Microchip. In this section we look
    at what we have achieved, and look at some ideas of where to proceed from here.


    # 12.3.1 Objectives Achieved


    In the introduction chapter a number of reasons were given for learning assembly
    language. The primary reason of properly understanding the architecture of a microcontroller
    has been achieved in this book. We have covered the internal working registers,
    memory map, instruction set, and special registers such as the status register,
    as well as the program counter, stack and stack pointer. Other parts of the AVR
    architecture such as instruction encoding, how to control on-chip peripherals,
    and the interrupt system were also covered.


    With an understanding of the architecture of AVR microcontrollers and assembly
    language to program them, two other objectives have been achieved. It is now possible
    to write smaller more efficient code than a compiler can generate (and to mix
    optimized assembly language code with C code), as well as to target small AVRs
    with limited resources.'
  merge: -1
  img_proc: true
- pgno: 330
  md: 'C programmers can now debug optimized C programs by looking at and understanding
    the disassembly of the code when debugging in Microchip Studio. Lines of code
    that previously mysteriously disappeared when C compiler optimization was enabled
    can now be understood by looking at the generated assembly code in the list file,
    and disassembly code during debugging. Readers also have the skills to evaluate
    different C tools for AVR microcontrollers by looking at the assembly language
    code that they generate.


    Those readers who end up studying microcontroller architecture in schools or universities
    will already benefit from reading this book, even if a different microcontroller
    architecture is studied. By studying one microcontroller architecture, many fundamentals
    are learned that apply to other microcontrollers as well. It takes much less effort
    learning a second or third architecture after one has been learned.


    Anyone interested in the more specialized field of developing programming tools
    or simulators for AVR microcontrollers have to understand the architecture of
    the AVR, and have all of the understanding needed, such as instruction operation
    and encoding covered in this book, to start to develop software tools for AVR
    microcontrollers.


    The final reason for learning assembly language was for understanding application
    notes and other documentation for AVR microcontrollers that contain assembly language.
    A number of Microchip/Atmel application notes, as well as datasheets for AVRs
    have assembly language examples. Take a look at these documents and you will be
    amazed at how much you now understand. It should now be easy to understand the
    assembly language code used in these documents and also any AVR assembly language
    code found on the internet. Any instruction found in code that you can''t remember
    can easily be looked up in the AVR instruction set manual.


    In addition to all of the advantages of learning assembly language for AVR microcontrollers
    you now have a better understanding of Microchip Studio. Using the Disassembly
    window when debugging is one example of a feature of Microchip Studio that makes
    no sense to anyone who has not studied the AVR architecture and instruction set.


    Finally, C programmers can further study assembly language by writing C programs
    and looking at the assembly language code that they generate. If you are curious
    about how certain C code works, or what assembly language it converts to, look
    at it in the disassembly window when debugging, or in the list file generated
    when the project is built.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 12.3.2 What was Not Covered


    This book concentrated on the AVR architecture mainly from a programmer''s perspective.
    One aspect of the architecture that was not covered was the implementation of
    the AVR in hardware. This information is actually proprietary to Microchip. Although
    they give a programmer''s view of the architecture, they do not give away how
    the AVR core is implemented in hardware. Even if they did, studying the actual
    hardware implementation would take another whole book.


    This book did not cover all of the on-chip peripherals and features of the ATtiny
    microcontrollers used. It was considered sufficient to cover how some of the peripherals
    are accessed using assembly instructions. A detailed study of AVR on-chip peripherals
    and other features is the subject for another book.


    # 12.3.3 Other AVR Microcontrollers


    Although we studied ATtiny AVR microcontrollers in this book, the core of other
    AVR microcontrollers is the same. It is easy to transition onto other ATtiny parts,
    as well as parts from the ATmega range, now that the fundamentals of the AVR architecture
    have been covered. As we saw, other AVR devices may implement additional, or fewer
    instructions. On devices with more on-chip peripherals with control registers
    that fall outside the address range of instructions such as IN and OUT, alternate
    instructions must be used. You now have the skills to study these other microcontrollers
    on your own. Refer to the datasheets of other AVR microcontrollers and use the
    debugger and simulator to analyze any additional features, such as memory and
    on-chip peripherals.


    # 12.3.4 Assembly Language Resources


    To continue studying AVR assembly language, refer to application notes and datasheets
    that use assembly language. Look at the assembly language that the C tools generate.
    Write your own programs and test them using the debugger. Of course the internet
    is another source to find AVR assembly language code to study. One site worth
    looking at is www.avrfreaks.net which is a forum for AVR enthusiasts. Use the
    search box to search for topics beginning with [ASM] to find articles and discussions
    about various aspects of AVR assembly language.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Appendix A • External Programmer Setup


    Hobbyist programmers, such as the USBasp and USBtinyISP, can be used to program
    some of the ATtiny range of microcontrollers. These hobby programmers are cheaper
    alternatives to the Atmel-ICE programmer/debugger. They do have limitations in
    the ATtiny parts that they can program, which depends on which programming interface
    the specific ATtiny microcontroller parts have available. The USBasp and USBtinyISP
    are both “program only” USB devices that do not have any debugging capabilities.
    Both of these programmers are open-source designs and widely available from various
    suppliers. They are also available as slightly different designs, where the manufacturers
    may supply their own version of these programmers that are slightly different
    from the originally released open-source design.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_332_0.png)


    Figure: A.1: Hobby Programmers and Accessories Including an Arduino Uno used for
    ISP Programming of ATtiny Microcontrollers'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'An Arduino board, such as an Arduino Uno, can also be used to program ATtiny
    microcontrollers, simply by loading an example sketch to turn the Arduino into
    an ISP programmer. This appendix shows how to set up a USBasp, USBtinyISP and
    an Arduino Uno, shown in Figure A.1, as AVR ISP programmers in Microchip Studio.
    Figure A.1 shows from left to right, a USBtinyISP compatible programmer, a version
    of the USBasp that is widely available, optional adapter for the USBasp, optional
    cable for the USBasp and an Arduino Uno.


    # A.1 Hobby USB Programmer Capabilities


    Before using a hobby USB programmer, it is important to understand how it compares
    to the Atmel-ICE, and what the limitations of these programmers are. The subsections
    that follow discuss these issues. In addition to a programmer, the correct USB
    cable and leads, such as Dupont wires, are needed to connect the programmer to
    a circuit.


    # A.1.1 Differences Between Hobby Programmers and the Atmel-ICE


    An Atmel-ICE is the official USB programmer/debugger from Microchip for 8-bit
    AVR microcontrollers. It also supports 32-bit ARM microcontrollers from the Microchip
    Cortex-M SAM range, that were originally from Atmel, as well as 32-bit AVR microcontrollers.
    The Atmel-ICE can not only be used to program in-circuit programmable ATtiny AVR
    microcontrollers, but can also be used for debugging these devices (and other
    supported microcontrollers from the Cortex-M, AVR 32-bit, XMEGA and megaAVR ranges).


    Hobby programmers are all “program only” devices, that do not support debugging,
    and mostly only support 8-bit AVR microcontrollers through the ISP/SPI interface.
    The main differences between the Atmel-ICE and hobby programmers, is 1) that the
    Atmel-ICE supports many more programming interfaces than hobby programmers (discussed
    in the next section), 2) the Atmel-ICE supports debugging, and 3) the Atmel-ICE
    does not supply voltage to a circuit, whereas hobby programmers usually do or
    can.


    To elaborate on hobby programmers supplying power to a circuit – most hobby programmers
    supply power through the ISP header. This is usually 5V, but in some cases 3.3V
    can be selected by changing a jumper on the programmer. The ISP interface on an
    Atmel-ICE has a VTG pin which is used to sense what voltage the circuit is powered
    from, instead of supplying voltage to the circuit from this pin. An Atmel-ICE
    must therefore always be used to program an AVR in a circuit that has an external
    power supply. Hobby'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'programmers can be used to both power an AVR circuit and program it, deriving
    power from the USB port of the host computer. Finally, an Atmel-ICE is ready to
    use with Microchip Studio after plugging it into the USB port of the host computer.
    Hobby programmers initially need a bit of extra work to set them up in Microchip
    Studio, which is explained in this appendix.


    # A.1.2 Programming Interfaces


    Most of the hobby programmers support the ISP/SPI programming interface, but usually
    not many of the other interfaces found on newer AVRs. ISP/SPI programming covers
    all of the ATtiny microcontrollers shown in Table 1.1 of section 1.3 in Chapter
    1. Supported interfaces depend on the firmware in these programmers as well as
    the programming software that runs on the host computer. Firmware and programming
    software updates may be available, or become available in the future, that allow
    programming through other interfaces. This appendix covers three hobby programmers
    that are widely available. There may be different programmers available that do
    support other AVR programming interfaces. At the time of writing there were none
    that were widely available.


    USBasp programmers can have their firmware updated to support the TPI interface
    for programming ATtiny4/5/9/10 microcontrollers, but this update stops the ISP/SPI
    interface from working on the USBasp shown in Figure A.1. The USBasp must then
    be programmed with an older version of firmware to get ISP/SPI programming working
    again. A second programmer is needed to load different versions of firmware to
    a USBasp. At the time of writing there were no widely available hobby programmers
    that support the TPI interface, and the UPDI interface found on more modern AVR
    microcontrollers. This is not a problem when using this book as none of these
    other interfaces are used.


    # A.1.3 Using Hobby USB Programmers with this Book


    This book has been designed to use ATtiny microcontrollers that have the ISP/SPI
    interface and are available in DIP packages. In this way, readers can build all
    of the circuits in this book and use a cheap hobby programmer to load the software.
    Readers who want to experiment with the ATtiny4/5/9/10 range that use the TPI
    interface will probably need to get an additional hobby programmer that supports
    TPI, or use an Atmel-ICE. ATtiny4/5/9/10 microcontrollers are surface mount devices
    that need to be soldered to breakout boards in order to be used in breadboard
    circuits. Modern ATtiny microcontrollers that use the UPDI interface are also
    all surface mount devices and are not covered in this book, so a UPDI programmer
    is not needed.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# A.2 Overview of External Programmer Setup


    The following list contains all the basic steps needed to set up an external USB
    hobby programmer in Microchip Studio. Setup details for each step can be found
    in the section that follows.


    +   1) Install a driver for the programmer.

    +   2) Download the programming software (a program called avrdude).

    +   3) Build an AVR circuit and attach the programmer for testing purposes.

    +   4) Work out the arguments that must be passed to avrdude for the particular
    programmer and AVR microcontroller.

    +   5) Open Microchip Studio and set up the external tool and a button for it.

    +   6) Test the setup by programming the target AVR microcontroller.

    +   7) Fix any programming problems.


    # A.3 External Programmer Setup


    Steps in the subsections that follow cover all of the steps from the list in the
    previous section for setting up a USB hobby programmer in Microchip Studio.


    # A.3.1 Install a Driver


    A driver must be installed for each programmer for it to work on a Windows computer.
    An Arduino Uno does not need to have a driver installed, but does need the ArduinoISP
    sketch to be loaded to it to turn it into an ISP programmer. Follow the driver
    installation procedure under the correct heading that follows for the programmer
    that you are using – either the USBasp, USBtinyISP, or Arduino Uno.


    # A.3.1.1 USBasp Driver


    Links to firmware, drivers, and other information on the USBasp can be found on
    the web page of the designer of this device, Thomas Fischl, at www.fischl.de/usbasp/


