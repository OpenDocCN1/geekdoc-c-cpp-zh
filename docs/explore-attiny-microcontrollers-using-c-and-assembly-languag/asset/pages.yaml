- pgno: 134
  md: '# Chapter 7 · Arithmetic and Logic Instructions


    Arithmetic and logic instructions are processed in the arithmetic and logic unit,
    or ALU, of the microcontroller core.


    ATtiny13(A) and ATtiny25/45/85 microcontrollers have addition and subtraction
    arithmetic instructions, as well as AND, OR and exclusive OR logical instructions.


    This chapter looks at examples of each of the basic mathematical and logical operations,
    but first looks at how negative numbers are represented in binary.


    # In this Chapter


    +   - Positive and negative numbers in binary

    +   - Binary addition and subtraction

