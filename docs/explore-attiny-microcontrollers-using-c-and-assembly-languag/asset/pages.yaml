  md: '# Chapter 6 · AVR Internal Architecture


    An understanding of the internal architecture of the AVR core or CPU is essential
    to properly understand what happens when a machine instruction is executed inside
    an AVR microcontroller.


    This chapter explains concepts necessary to understand the internal workings of
    a microcontroller in general, and shows how an AVR works internally.


    # In this Chapter


    +   - Clock pulses and the program counter register

    +   - Clock pulse period and frequency

    +   - Microcontroller buses

    +   - Harvard and von Neumann Architectures

    +   - How instructions are fetched and executed in an AVR

    +   - The status register, stack and stack pointer

    +   - AVR instruction encoding

    +   - Addressing modes'
  merge: -1
