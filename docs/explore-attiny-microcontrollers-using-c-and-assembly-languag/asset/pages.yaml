- pgno: 16
  md: '# Introduction


    This book provides an in-depth look at the 8-bit AVR architecture found in ATtiny
    and ATmega microcontrollers, mainly from a software and programming point of view.
    It explores the AVR architecture using Microchip Studio (formerly Atmel Studio)
    and ATtiny microcontrollers with a hardware programmer/debugger and/or using the
    AVR simulator found in Microchip Studio. By initially targeting the simpler smaller
    ATtiny range of microcontrollers, such as those at the left and middle of Figure
    0.1, learning the AVR architecture is made easy. Going on to learn ATmega devices
    after this, for example the microcontroller found on the Arduino Uno seen at the
    right of Figure 0.1, is simplified as these devices add enhancements to, and are
    basically extensions of the ATtiny range. ATtiny microcontrollers are very useful
    devices that can be used in many small electronics projects.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_16_0.png)


    Figure 0.1: Microcontrollers in the Form of DIP ATtiny Devices (left), Boards
    with SMD ATtiny Devices (middle) and an ATmega Device on an Arduino Uno (right)
    all Contain the 8-bit AVR Architecture'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'As this is a practical book, it is filled with examples that can be run on
    real hardware and/or the AVR simulator. It includes circuits that can be built
    and tested on an electronic breadboard. The rest of this introductory chapter
    has more information on the contents of this book, the intended audience, as well
    as software and hardware requirements.


    # ## Broad Overview of this Book


    By studying the AVR architecture, we learn how machine code instructions are executed.
    In order to properly understand the AVR architecture, assembly language programming
    is taught. By the end of the book, you will be able to program AVR microcontrollers
    using assembly language, understand how assembly language converts to machine
    code understood by microcontrollers, as well as how the C programming language
    eventually ends up as machine code instructions. Programming examples are given
    in both assembly language, and in the C programming language where applicable.


    # ## About the Targeted AVR Microcontrollers


    Low pin count ATtiny microcontrollers are the primary devices used in this book,
    with the 8-pin ATtiny13, ATtiny13A, ATtiny25, ATtiny45 and ATtiny85 microcontrollers
    being the primary devices used. The reason for this is that these devices are
    cheap, and are simpler with fewer built-in peripherals, which simplifies learning.
    They are also more likely to benefit from assembly language programming because
    of their small program memory sizes.


    Principles learned on the simpler ATtiny AVR devices also apply to higher end
    AVR devices, for example the ATmega AVR microcontroller range, which are just
    extensions of the simpler devices that add more functionality and resources. These
    differences are extensions of the basic AVR architecture and instruction set,
    increased memory sizes, and the inclusion of more advanced peripherals.


    ATtiny microcontrollers that are available in DIP packages are used in the book
    as these devices are easy to use with an electronic breadboard. These are the
    8-pin devices already mentioned. Appendix B includes alternate circuits that use
    DIP packaged ATtiny microcontrollers that have 14 pins, 20 pins and 28 pins. These
    devices can be used instead of the 8-pin devices if desired, but anyone using
    these alternate devices must be prepared to make changes to the code where necessary
    to run on these devices.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Primary Programming Software


    Microchip Studio, formerly known as Atmel Studio, for Windows is the primary software
    package used in this text, but programming principles and techniques taught using
    this software can be adapted for use with other programming tools, software, and
    operating systems. Microchip Studio is a full-featured Integrated Development
    Environment (IDE) for AVR C and assembly language software development, and is
    available for download free of charge and unrestricted.


    # Why Learn Assembly Language?


    As pointed out in the previous paragraphs of this chapter, studying the AVR architecture
    automatically exposes us to the instruction set of the AVR. It also exposes us
    to the internal registers and memory areas of the AVR. The instruction set consists
    of every binary machine code instruction that the AVR can run or execute. This
    instruction set acts on the internal registers and various memories of the AVR.
    The primary reason for learning assembly language in this book is to properly
    understand how the AVR works internally. By writing assembly language programs,
    we can see how instructions operate and affect internal registers and memory.


    # The Many Reasons for Learning Assembly Language


    There are several advantages to learning assembly language programming. A list
    of these reasons follows, with the primary reason already explained at the top
    of the list, to make the list complete.


    +   1. To properly understand the architecture of a microcontroller

    +   2. To write smaller and more efficient code than a compiler can generate

    +   3. For targeting very small microcontrollers with limited memory resources

    +   4. For debugging optimized C programs

    +   5. To evaluate compiler code generation quality

    +   6. For academic purposes in schools and universities

    +   7. For programming tool development such as compilers and simulators

    +   8. For understanding application notes and other documentation that contains
    assembly language'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'The previous list of points requires additional explanation which follows for
    each point in the list. **Point number 1**, to properly understand the architecture
    of a microcontroller, has previously been discussed.


    **Point number 2** – to write smaller and more efficient code than a compiler
    can generate: This is possible to do once the internal architecture and instruction
    set of a microcontroller are properly understood, and after a lot of assembly
    language programming practice. Assembly language programming is more suited to
    smaller programs, and therefore smaller microcontrollers. This is one of the reasons
    that ATtiny devices have been chosen as the primary devices for use with this
    text. As assembly language programs get bigger, they tend to get more difficult
    to comprehend and maintain than programs written using a higher level language
    such as C. Assembly language and C can also be mixed, where critical parts of
    a program that require precise timing can be written in assembly language, while
    the remainder of the program is written in C.


    **Point number 3** – for targeting very small microcontrollers with limited memory
    resources: This goes hand-in-hand with point number 2. Very small microcontrollers
    can benefit from assembly language, as exact control can be maintained over all
    of the resources in the device. This book covers a number of microcontrollers
    from the ATtiny range, including some of the smaller devices that are available.


    **Point number 4** – for debugging optimized C programs: When C programs are compiled
    with optimization enabled, some lines of code can’t be stepped over using a debugger,
    because they are optimized away or combined with other lines of code. Optimization
    can be switched off during debugging, but this changes the underlying machine
    code generated by the compiler and also uses more program memory. The only way
    to properly debug an optimized C program is to look at the disassembly – which
    means looking at and understanding assembly language instructions generated by
    the C compiler.


    **Point number 5** – to evaluate compiler code generation quality: when choosing
    a compiler for use with a particular microcontroller architecture, the only way
    to truly evaluate the compiler is to look at the assembly language code that it
    generates. When choosing between different compilers, the output of the compilers
    can be compared as part of the evaluation process.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Point number 6 – for academic purposes in schools and universities: any academic
    course that teaches microcontrollers in-depth needs to teach assembly language
    to show how instructions on a microcontroller or microprocessor are executed internally.


    Point number 7 – for programming tool development such as compilers and simulators:
    an understanding of the architecture and assembly language of a particular microcontroller
    is needed when developing any code generation, debugging or simulation tools.


    Point number 8 – for understanding application notes and other documentation that
    contains assembly language: Assembly language frequently appears in application
    notes, data sheets and other microcontroller documentation.


    # C Programming


    Although this book includes code in the C programming language, it does not teach
    the C programming language. Despite including C code, it is not necessary to understand
    the C language to benefit from this book. Programs appear in assembly language
    first, and the assembly language code is taught and explained. Those readers who
    have not yet learned the C programming language can still type the C programs,
    compile and run them to see what they do. Of course readers who have learned the
    C language will obtain extra benefits from this book.


    # Intended Audience


    This book has been written for anyone interested in AVR microcontrollers who wants
    to learn assembly language, how microcontrollers work internally, the internal
    architecture of 8-bit AVR microcontrollers, as well as get an advanced understanding
    of programming tools and software. The intended audience includes students, hobbyists,
    makers, hackers and engineers.


    # Prerequisites


    To follow this book it is necessary to be able to use a Windows computer and be
    able to download and install the necessary software tools. Although the use of
    physical hardware is encouraged, most of the book can be followed using an AVR
    simulator without the need for any physical hardware. To get the most out of the
    programs that manipulate hardware'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'devices such as LEDs and switches connected to a microcontroller, it is necessary
    to be able to read a circuit diagram and build circuits on an electronic breadboard.
    That being said, some of the programs that do access external hardware can still
    be run in the simulator.


    Assembly language programming is taught from scratch, so no programming experience
    is needed. Readers who have experience with other programming languages such as
    C will progress through the book quicker. C programmers will benefit from the
    included C code examples.


    # Software Requirements


    As already mentioned, Microchip Studio (formerly Atmel Studio) running on a Windows
    PC is used as the development platform. It includes an assembler program and AVR
    simulator. Microchip Studio also includes C programming tools – the GCC tools
    for AVR. AVR microcontrollers on physical hardware, such as a breadboard circuit
    or development board, can be programmed from Microchip Studio by using an external
    USB programming device such as an Atmel-ICE, or cheaper hobby USB programming
    devices.


    # Hardware Requirements


    Although this book can be followed using the AVR simulator in Microchip Studio,
    the simulator has its limitations. Building the microcontroller circuits on breadboard
    results in a more enhanced learning experience. A list of parts required for building
    the circuits follows, with an explanation for each item in the subsections following
    the list.


    +   1. A DIP packaged ATtiny13(A) or ATtiny25/45/85 or one of several other ATtiny
    devices discussed in more detail in Chapter 1

    +   2. An electronic breadboard

    +   3. Programmer / debugger, for example an Atmel-ICE

    +   4. 5V DC power supply

    +   5. Jumper links and wires for building breadboard circuits

    +   6. Electronic components such as resistors, LEDs and switches

    +   7. Optional test equipment such as a multimeter and oscilloscope'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# A DIP Packaged ATtiny


    It is highly recommended to have some 8-pin DIP packaged ATtiny devices available
    when working through this book. These 8-pin DIP devices are the ATtiny13, ATtiny13A,
    ATtiny25, ATtiny45 and ATtiny85. The ATtiny25/45/85 range are really just enhanced
    versions of the ATtiny13(A). It would be better to have more than one of these
    devices, in case one gets damaged. Three or four of any of these devices are fine
    to get you through the book. Other ATtiny microcontrollers with more pins can
    be used instead of 8-pin devices if desired.


    # An Electronic Breadboard


    A 400 tie point breadboard, is sufficient for all of the circuits built in this
    book. These breadboards are sometimes called half-size breadboards. It is not
    necessary to buy a half-size breadboard if you already have a full-size breadboard,
    which can be used instead.


    # Programmer/Debugger


    In order to load a program to an ATtiny or other AVR microcontroller, a USB programmer
    is needed. This allows in-system programming where the programmer is connected
    to an AVR microcontroller while it is in a circuit. Microchip Studio or other
    programming software is then used to load a program to the microcontroller using
    the USB programmer.


    A USB programmer that has debugging capabilities is preferable to a plain “program-only”
    programmer. The recommended USB programmer/debugger for use with this book is
    the Microchip Atmel-ICE which comes in two main kits, namely, the basic kit as
    shown in Figure 0.2 on the next page, and the full kit. This programmer/debugger
    can be used to program and debug both 8-bit AVR microcontrollers as well as ARM
    Cortex-M based SAM microcontrollers. For 8-bit AVR microcontrollers, the Atmel-ICE
    can program using the ISP/SPI interface and debugWIRE interface, both found on
    ATtiny25/45/85 and ATtiny13(A) ranges of microcontrollers.


    A USB programmer/debugger has debugging capabilities that allows single-step debugging
    when used with Microchip Studio. Internal registers and memory of the target AVR
    device can be examined, breakpoints inserted and register/memory values changed
    for a better debugging and learning experience when using a USB programmer/debugger.


    It is still possible to follow this book using a USB programmer that does not
    have debugging capabilities. In this case the simulator can be used to examine
    internal memories and registers.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/83ef13a6c66cc7882b2f357e97f451dc_23_0.png)


    # Figure 0.2: Atmel-ICE USB Programmer/Debugger Basic Kit


    With a programmer/debugger, AVRs from the ATtiny25/45/85 and ATtiny13(A) ranges
    of microcontrollers can be put into debugWIRE mode. Once in debugWIRE mode, a
    single pin of the AVR is used for programming and debugging, which is great for
    these low pin count devices, as it frees up the other pins of the microcontroller.


    A description of various USB programmer/debugger and programmer only devices follows.
    In short, get an Atmel-ICE programmer/debugger, but if you can''t justify the
    expense use one of the older Atmel tools (AVR Dragon or AVRISP mkII), alternatively
    use a hobbyist programmer such as a USBasp, USBTinyISP or even an Arduino Uno.


    # Atmel-ICE Basic Kit


    The Atmel-ICE basic kit, shown in Figure 0.2, is ideal for use with this book
    and has the part number ATAMEL-ICE-BASIC. It has programming and debugging capabilities
    and comes with a single flat adapter cable as well as a USB cable. This kit is
    cheaper than the full kit.


    # Atmel-ICE Full Kit


    The Atmel-ICE full kit is exactly the same as the basic kit, but includes extra
    cables and adapters including a 10-lead squid cable. This kit has the part number
    ATAMEL-ICE. It is more expensive than the basic kit.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# AVR Dragon


    Those readers who already have an AVR Dragon can use it for programming and debugging
    instead of an Atmel-ICE. At the time of writing, the AVR Dragon has a status of
    "No Longer Available" on the Microchip website. The AVR Dragon supports the ISP/SPI
    and debugWIRE interfaces for ATtiny25/45/85 and ATtiny13(A) microcontrollers.


    # AVRISP mkII


    The Microchip AVRISP mkII is a "program-only" USB device that does not have any
    debugging capabilities and is now no longer available from Microchip. Microchip
    recommend the Atmel-ICE as a replacement. Those readers who already have an AVRISP
    mkII can still use it to program AVR microcontrollers in-circuit. This type of
    program-only USB programmer uses up four pins of the target AVR microcontroller
    to program it in ISP mode.


    # Hobbyist USB Programmers


    USB AVR hobby programmers, such as the USBasp shown in Figure 0.3, and others
    such as the USBtinyISP and even Arduino boards, can be used to program some AVR
    devices. Appendix A shows how to set up a USBasp, USBtinyISP, and Arduino Uno
    as an Arduino AVR ISP programmer in Microchip Studio. Hobby programmers can usually
    only program AVR microcontrollers that use the ISP/SPI interface. This means that
    they can be used with the ATtiny25/45/85 and ATtiny13(A) ranges of 8-bit AVR microcontrollers.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_24_0.png)


    **Figure 0.3: Although a USBasp can Program an AVR, it can''t be used for Debugging**


    As with other program-only programmers, the USBasp can''t put an AVR into debugWIRE
    mode and then be used to program the AVR using one wire, but rather uses up four
    pins in ISP/SPI mode. The circuits in this book work just fine with external hardware
    and a programmer connected to the same pins. With no debugging capabilities on
    the USBasp, USBtinyISP and Arduino Uno as a programmer, the AVR simulator can
    be used for single-stepping through code and to examine registers and memory instead
    of hardware debugging. Of course not having the physical external hardware attached
    to the simulator does present some limitations.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Power Supply


    A 5V DC (Direct Current) power supply capable of delivering 100mA or more is needed
    to power AVR breadboard circuits. Many different power supplies are available,
    such as the breadboard power supply shown in Figure 0.4. An external power supply
    may not be needed if using a hobby programmer, as they usually supply 5V from
    USB.


    There are many different breadboard power supplies available. The one shown in
    Figure 0.4 is just one example and is manufactured by RobotDyn. It can supply
    1A of current at 5V and 800mA of current at 3.3V. The two voltages are individually
    selectable by jumpers on the board. This means that one rail can be set to 5V
    and the other to 3.3V for circuits that use both 5V and 3.3V, but only 5V is needed
    with this book. This breadboard power supply requires an external DC supply of
    6V to 12V supplied on the barrel connector. A mains voltage to 12V DC power supply
    is shown in Figure 0.4 supplying 12V DC to the breadboard power supply via a 2.1mm
    centre positive barrel connector. If you are using a different make or model of
    breadboard power supply, be sure to check its specifications and configuration
    from the manufacturer.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_25_0.png)


    Figure 0.4: 5V/3.3V Breadboard Power Supply Powered by an External DC Supply


    On most of these breadboard power supplies, the USB connector is intended as a
    5V output for USB powered devices. Some of them allow 5V to be fed into this connector
    to'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'supply 5V to the breadboard. This, however, is not intended by design – it
    just so happens that they work this way without being destroyed. The type of USB
    connector seen in the figure is a USB host connector and intended to supply 5V,
    rather than be supplied with 5V. It is better to always use an external power
    supply attached to the barrel connector.


    # Jumper Links and Wires


    Jumper wires are needed to connect from a USB programmer/debugger to the AVR microcontroller
    in a breadboard circuit, as can be seen in Figure 0.5 that follows. Jumper wires
    with single pin male connectors on each end are an excellent choice for this purpose.
    These wires are usually sold as a ribbon cable of wires that can individually
    be peeled off. They are typically called “Dupon” cables, for example “10cm male
    to male Dupon jumper cable”.


    Other single core jumper wires are useful for building circuits on a breadboard.
    DuPont cables with one male and one female connector can be used to connect from
    some hobby programmers to a breadboard circuit.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_26_0.png)


    Figure 0.5: An Atmel-ICE Connected to an ATtiny Breadboard Circuit'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Electronic Components


    Basic electronic components, such as LEDs, resistors and switches are needed for
    interfacing with ATtiny microcontrollers when following along with this book.
    For example, LEDs with series resistors are the most basic requirement when using
    pins as outputs, as they show when a pin is switched high or low. Other components
    such as 100n decoupling capacitors may be needed in the circuits. As this book
    deals mostly with the internal architecture of ATtiny AVR microcontrollers, only
    a minimum of components are needed. 5 through-hole LEDs with series resistors
    of around 470Ω each, a push-button switch and an optional 100n ceramic capacitor
    are all the components needed.


    # Optional Test Equipment


    A multimeter is very useful for verifying voltages of power supplies before connecting
    them to circuits, as well as for general fault finding on circuits. Although not
    essential, an oscilloscope may be needed for testing of circuits and fault finding.


    # Microchip, Atmel, Microchip Studio and Atmel Studio


    There can be some confusion when dealing with AVR microcontrollers if one does
    not know the history of Atmel and Microchip, so an explanation is in order. Originally
    a company called Atmel was the designer and manufacturer of AVR microcontrollers
    including the ATtiny and ATmega ranges. In 2016, Microchip (www.microchip.com)
    bought Atmel and is now the owner and manufacturer of AVR microcontrollers. At
    the time of writing, some of the AVR documentation still has the Atmel name on
    it. Many AVR microcontrollers still bear the Atmel name and have not been changed
    to Microchip yet.


    Microchip Studio is the free development software used with this book to program
    ATtiny AVR microcontrollers using assembly language and C. Microchip Studio is
    the same as the previously available Atmel Studio, it is simply a brand name change.
    Although Microchip acquired Atmel back in 2016, Atmel Studio was only rebranded
    to Microchip Studio in 2020. The first release of Microchip Studio was available
    in November 2020, and continued with the version numbering left by Atmel Studio.
    Thus the first release of Microchip Studio is version 7.0.2542, rather than version
    1.0. It follows on from the last release of Atmel Studio which was version 7.0.2389.
    Everything in Microchip Studio is identical to Atmel Studio, so those readers
    who have previously used Atmel Studio will immediately be able to use Microchip
    Studio.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Accompanying Resources


    Accompanying resources, such as the source code from this book, is available for
    download from the publisher''s website www.elektor.com where the book can be searched
    for by name or ISBN number to find its web page containing the downloadable resources.
    Additional resources can be found on the author''s website at wspublishing.net
    where the book name can be clicked to find its page and resources.


    # Let''s Get Started


    I hope that you enjoy this fantastic adventure as we look at the 8-bit AVR architecture
    and how to program AVR microcontrollers in assembly language and C.'
  merge: -1
  img_proc: true
