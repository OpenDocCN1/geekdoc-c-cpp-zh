    | - | - | - | - | OCF0B | OCF0A | TOV0 | - |


    Figure 10.6: Timer/Counter0 Registers


    # 10.4.1.1 Timer/Counter0 Register Addresses


    The first thing to notice in Figure 10.6 is that some of the addresses of the
    registers are different for the ATtiny25/45/85 and ATtiny13(A). This is indicated
    at the Address items in the figure that have the ATtiny25/45/85 register address
    first, followed by the ATtiny13(A) address in brackets. For example, the register
    at the top of Figure 10.6 is the TCCR0A register that has an address of 0x2A on
    the ATtiny25/45/85, but is 0x2F on the ATtiny13(A) – check this in the Register
    Summary section of the datasheets. Address differences like these do not matter
    too much because registers names are defined in a header file which'
  merge: -1
