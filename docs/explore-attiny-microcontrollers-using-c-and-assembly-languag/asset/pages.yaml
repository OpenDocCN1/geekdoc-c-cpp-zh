- pgno: 51
  md: "start of a comment, but is used to terminate C statements. It is therefore\
    \ important not to leave off any semicolons, or the C compiler will report errors\
    \ when it is run during the build process.\n\n```\nled_blink c : main.c\n\n//#define\
    \ F_CPU 1000000UL // 1MHz default clock for ATtiny25/45/85\n#define F_CPU 1200000UL\
    \ // 1.2MHz default clock for ATtiny13(A)\n#include <avr/io.h>\n#include <util/delay.h>\n\
    \nint main(void)\n{\n    DDRB = (1 << DDB4); // Set up pin PB4 as an output\n\n\
    \    while (1) {\n    PORTB |= (1 << PORTB4); // Set pin high (LED on)\n    _delay_ms(1000);\
    \ // 1 second delay\n    PORTB &= ~(1 << PORTB4); // Set pin low (LED off)\n \
    \   _delay_ms(1000); // 1 second delay\n    }\n}\n```\n\nAs can be seen in the\
    \ code listing, there are two definitions for F_CPU at the top of the file. F_CPU\
    \ is used to tell the code what the initial clock speed of the microcontroller\
    \ is set to. This is used by the _delay_ms() function to accurately set the time\
    \ delay that it produces. The reason that there are two functions for F_CPU is\
    \ because ATtiny13 devices have a different default clock frequency to ATtiny25/45/85\
    \ microcontrollers. The first definition is commented out using two forward slashes\
    \ (//) which means that the second definition takes effect and is set up for ATtiny13\
    \ devices. If using one of the ATtiny25/45/85 devices, uncomment the top definition\
    \ and comment out the second definition as shown in the following code snippet.\n\
    \n```\n#define F_CPU 1000000UL // 1MHz default clock for ATtiny25/45/85\n//#define\
    \ F_CPU 1200000UL // 1.2MHz default clock for ATtiny13(A)\n```\n\nThese two default\
    \ clock frequencies are close enough so that the program will still work on any\
    \ of the devices if the changes described above are not made, but to create more\
    \ accurate timing, the changes can be made."
  merge: -1
  img_proc: true
