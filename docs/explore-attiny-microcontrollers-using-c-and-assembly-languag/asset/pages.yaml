- pgno: 162
  md: '# 8.2.2.2 How the LED Count C Code Works


    As with the led_blink_c code from section 2.4.2 of Chapter 2, the led_count_c
    code defines the value of F_CPU to make the _delay_ms() function delay time more
    accurate. An unsigned 8-bit integer variable called count is created to hold the
    incrementing count value of the program. It is initialized to zero at the start
    of main().


    DDRB is written with the same binary value that was used in the assembly language
    program, but without the underscore character in the middle, as this is not supported
    by the GCC compiler. Alternatively the equivalent hexadecimal value 0x1F could
    be used instead of the binary number. It is possible to use the bits defined in
    the header file instead of a binary number, but this becomes a bit long winded.
    If using the defined bits from the header file for bits in an I/O register, they
    must each left shift the value 1 individually and then be bitwise ORed together
    as the following line of code shows.


    ```

    DDRB = ( 1 << DDB4) | ( 1 << DDB3) | ( 1 << DDB2) | ( 1 << DDB1) | ( 1 << DDB0);

    ```


    In the while(1) loop, count is assigned to PORTB, which writes the count value
    to the LEDs. The delay function is then called so that the count value on the
    LEDs is visible to the eye. count is then incremented by one and bitwise ANDed
    with the same binary mask number as was used in the assembler program. Again,
    this is to clear the top 3 bits of the number. Back at the top of the while(1)
    loop, the new count value is written to the LEDs.


    # 8.2.2.3 Running the LED Count C Code


    Select the correct debug tool, build the project and load it to the hardware using
    the Start Without Debugging icon on the top toolbar or the Ctrl + Alt + F5 key
    combination if using a Microchip Studio supported programmer. Use the button that
    you set up in Appendix A to load the program to the target AVR if you are using
    a hobby USB programmer. This loads the program and starts it running, as we did
    with the assembly language program. The LEDs will start counting up in binary,
    but at a slower rate than the assembly program as the delay routine uses a longer
    delay time.


    # 8.2.2.4 LED Count C Code Disassembly


    Programs written for AVR microcontrollers in the C programming language are converted
    to assembly language before finally being converted to machine code. As an example
    the following line of C code sets bit DDB4 in register DDRB:


    ```

    DDRB |= ( 1 << DDB4);

    ```'
