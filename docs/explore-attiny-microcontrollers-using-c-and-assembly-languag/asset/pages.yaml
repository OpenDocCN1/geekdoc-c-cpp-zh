  md: '# 7.1 Positive and Negative Numbers


    A positive 8-bit binary number uses all eight bits to represent a positive number
    with each bit weighted as already explained. This means that a positive 8-bit
    number can have a value from 0b0000_0000 (0 decimal) to 0b1111_1111 (255 decimal).


    A “signed” 8-bit number uses the MSB (left most bit, or bit number 7) as the sign
    bit which is set to logic 1 to represent a negative number, and cleared to logic
    0 to represent a positive number. This means that an 8-bit signed number can have
    a maximum positive value of 0b0111_1111 (127) and maximum negative number of 0b1111_1111
    (-127) when using the MSB for the sign.


    An example of a negative 8-bit number is 0b1001_0111 (-23 decimal) where the first
    digit on the left denotes that the number is negative. The remainder of bits represent
    the size of the number using the weighted binary numbering system. Positive 23
    is represented by changing the sign bit to 0: 0b0001_0111. Microcontrollers usually
    represent numbers in 2’s compliment (two’s compliment) format, but before we look
    at 2’s compliment format, we must look at 1’s compliment (one’s compliment) format.


    # 7.1.1 1’s Compliment Numbers


    A signed 1’s compliment 8-bit number can be either positive or negative. When
    it is positive, it is simply a binary number with the left most bit (MSB), or
    sign bit, with a value of 0 as already explained. When a 1’s compliment number
    is negative it is the same as the positive version of the number, but with every
    bit inverted. Inverted means that each 0 in the number is changed to 1 and each
    1 is changed to 0. To use the example of +23 and -23 again, 0b0001_0111 is +23
    as before. After inverting each bit to represent -23 in 1’s compliment format
    the number is 0b1110_1000.


    # 7.1.2 2’s Compliment Numbers


    Positive numbers in 2’s compliment are the same as 1’s compliment positive numbers
    and normal binary numbers. Because the maximum value that an 8-bit positive signed
    number can have is 0b0111_1111 or 127 decimal, incrementing this number by 1 will
    set the MSB making it a negative number, not 128.


    Negative 2’s compliment numbers are the 1’s compliment representation of the number
    plus one. To convert -23 to 2’s compliment, we first convert the positive version
    of the'
