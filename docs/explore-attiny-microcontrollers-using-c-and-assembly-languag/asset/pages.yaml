    # 12.1.1.2 AVRASM2 on the Command Line


    When Microchip Studio is installed on a computer, an item called Microchip Studio
    Command Prompt is also installed. This item can be found by opening the main Windows
    menu by clicking the Windows “Start” icon at the bottom left of the desktop. Scroll
    down this menu to find the Microchip Studio folder, which must be expanded by
    clicking it. After expanding the menu folder, click the Microchip Studio Command
    Prompt item. This opens a command prompt window that has the Microchip Studio
    tools in its path. AVRASM2 can be invoked from this command prompt window. Entering
    just the name of AVRASM2 at the command prompt, as shown below, prints the version,
    build and copyright information.


    ```

    avrasm2

    ```


    Invoking AVRASM2 and passing it the -h option or switch, as shown below, causes
    it to print out all of the command line options.


    ```

