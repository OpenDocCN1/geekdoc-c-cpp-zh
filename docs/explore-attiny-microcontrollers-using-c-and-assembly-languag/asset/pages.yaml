  img_proc: true
- pgno: 243
  md: 'operator in the code works as it does in C, and tests whether the value on
    the left is equal to the value on the right, and if they are equal, prints the
    warning message.


    In addition to the above, integer (whole number) values are truncated to 32-bits
    when using the .equ or #define directives, as the following code proves.


    ```

    .equ NUM1 = 0x0000000F    ; 32-bit number (15)

    .equ NUM2 = 0x100000000   ; 33-bit number (4,294,967,296)


    .if (NUM1 > NUM2)

    .warning "NUM1 is greater than NUM2."

    .endif

    ```


    In the above code, a small value is assigned to NUM1 using .equ, and a very big
    value is assigned to NUM2 in the same way, with the decimal values shown in the
    comments. The comparison at the .if directive should never evaluate to true because
    NUM2 is greater than NUM1, rather than the other way around. The reason that the
    comparison does evaluate to true is because NUM2 is truncated to a 32-bit number,
    which means that it loses its most significant bit. This causes it to have a value
    of 0 (zero). 15 is bigger than 0, and this is why the expression evaluates to
    true. We can prove that NUM2 was truncated to 0 using the following code.


    ```

    .if (NUM2 == 0)

    .warning "NUM2 is equal to 0."

    .endif

    ```


    In the code above, with NUM2 assigned the same value as in the code before it,
    the expression at the .if directive evaluates to true, causing the warning message
    to be printed when the project is built. This proves that NUM2 was truncated to
    32-bits and the resulting value equal to 0.


    Using the same values as in the previous code, but putting the values directly
    in the comparison, instead of assigning a name using .equ or #define, the comparison
    works as expected. Comparing the values that were assigned to NUM1 and NUM2 directly
    in the following code results in a false result as expected, and the warning message
    does not get triggered.


    ```

    .if (0x0000000F > 0x100000000)

    .warning "0x0000000F is greater than 0x100000000."

    .endif

    ```'
