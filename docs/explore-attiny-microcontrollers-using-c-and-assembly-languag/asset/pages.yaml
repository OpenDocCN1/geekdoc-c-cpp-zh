- pgno: 89
  md: 'As indicated in Figure 5.1, the LDI instruction can only be used to load a
    data value to registers R16 to R31. This is indicated by a line dividing the general
    purpose register file in half in the figure. For this reason registers R16 and
    R17 were used in the add registers code example instead of registers R0 and R1.
    If you try to use the LDI instruction with R0 to R15, an error will be flagged
    when building the project in Microchip Studio. The same applies to the SER instruction
    which is used to set all bits to logic 1 in a register. SER can only be used on
    registers R16 to R31. This also applies to the ANDI and ORI instructions seen
    in the figure, which are covered in a later chapter. These are just four examples
    of instructions that can only operate on R16 to R31, there are others. Also shown
    in the figure is the bit numbering of a register at the top right of the figure.
    Bits in a byte are numbered from 0 to 7, right to left whether they occur in registers
    or memory.


    # 5.2.2 Incrementing a Register


    In this example of register usage, we clear a register and then increment it.
    Incrementing a register means adding one to the register. Use the same test project
    from the previous example – replace the code with the following, but leave the
    infinite loop at the bottom which is not shown in the code below. Before replacing
    the code, stop the debugger if it is still running from the previous example.


    ```

    test_asm : main.asm - increment register


    clr   r0

    inc   r0

    inc   r0

    inc   r0

    ```


    Build the project and then start the debugger as before (start debugging and break).
    The Processor Status window should automatically open in Microchip Studio when
    debugging is started, as it was used in the previous example. Scroll up in the
    Processor Status window so that register R0 (R00) is visible.


    The first instruction, CLR (Clear Register), clears register R0, which sets its
    value to zero. By default the register already has a value of zero when using
    the simulator. No change will be seen if the instruction is executed when R0 already
    contains 0x00. The value in this register can be changed in the debugger by double-clicking
    the value next to R00 in the Processor Status window before stepping over the
    CLR instruction, so that it is possible to see what this instruction does. For
    example, double click 0x00 next to R00 in the Processor Status window, type 45
    and then press the Enter key. This number will'
