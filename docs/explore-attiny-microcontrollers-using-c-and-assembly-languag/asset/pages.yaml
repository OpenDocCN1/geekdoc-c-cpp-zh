    words built with no errors. We previously opened this file in section 8.1.1 of
    Chapter 8 to look at the register and bit definitions that it contains.


    # 9.3 Assembler Directives


    Several directives are available for use in assembly language programs. Preprocessor
    directives start with #, and assembler directives start with a dot (.), as we
    saw with the example of the include directive in the previous section. This section
    looks at the most useful of these assembler directives. Preprocessor directives
    (starting with #) and macros are case sensitive. Assembler directives (starting
    with .) are not case sensitive.


    Assembler directives have the following basic format:


    ```

    [label:] directive [operands] [comment]

    ```


    At a minimum, an assembler directive can consist of a single directive, as the
    following example illustrates with the CSEG directive.


    ```

    .CSEG

    ```


    Optionally an assembler directive can have a label and an operand or operands,
    followed by a comment. An example of an assembler directive with one operand is
    the ORG directive shown in the line of code that follows, that we cover in the
    next section.'
