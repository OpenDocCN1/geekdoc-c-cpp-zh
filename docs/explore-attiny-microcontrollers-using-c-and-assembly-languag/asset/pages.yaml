    # 8.3 Summary


    +   - AVR on-chip peripherals are controlled through I/O registers that are mapped
    in data memory space.


    +   - Information on AVR on-chip peripherals and their registers can be found
    in the datasheet for the particular AVR part.


    +   - The IN and OUT instructions can be used to copy data between the I/O registers
    and registers in the register file (R0 to R31). These instructions can only operate
    on I/O registers in the address range 0 to 63 (0x00 to 0x3F).


    +   - SBI, CBI, SBIS and SBIC are instructions that can be used to directly write
    and read bits in the I/O registers.


    +   - SBI and CBI can only set and clear bits in I/O registers from address 0
    to 31 (0x00 to 0x1F).


    +   - SBIS and SBIC can only test if a bit is set or clear in an I/O register
    between address 0 and 31 (0x00 to 0x1F).


    +   - Load and store instructions are available for copying data between the register
    file working registers and any address location in data memory which includes
    the I/O registers.'
