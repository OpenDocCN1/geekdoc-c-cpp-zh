  md: '# 7.2 Addition


    We look at two basic addition instructions in the AVR in the subsections that
    follow. These are the ADD (Add without Carry) and ADC (ADD with Carry) instructions.
    There is a third add instruction (ADIW) that we won''t look at here.


    # 7.2.1 ADD – Add without Carry


    We have already seen the basic ADD (Add without Carry) instruction being used
    to add two register values. We now look at how the ADD instruction changes the
    flags in the status register. Open Microchip Studio and use the test project with
    the simulator again. Enter the following code into main.asm of the test project,
    replacing the previous code.


    ```

    test_asm : main.asm – ADD with no carry generated

    ldi r16, 5

    ldi r17, 9

    add r16, r17

    ```


    Step over the above code in the simulator and notice that there is no change in
    the flags of the status register. Change the second operand of the first instruction
    from 5 to 15, so the program looks as follows. Don''t forget to stop the debugger
    first and to save and build the project again after making the change.


    ```

    test_asm : main.asm – ADD with half carry generated

    ldi r16, 15

    ldi r17, 9

    add r16, r17

    ```


    Step over the above code in the debugger and notice that the H (half carry) flag
    is set in the status register. The half carry flag is set if there is an overflow
    or carry from bit 3 to bit 4 of the result of the numbers being added. In the
    example code, adding 15 or 0b0000_1111 to 9 or 0b0000_1001 results in a number
    that is bigger than four bits, in other words the number overflows or generates
    a carry that is put into bit 4 of the number. The result of the addition is 0b0001_1000.
    Starting at the right of the number and counting from 0, bits 0 to 3 are a four
    bit number or the lower nibble of the 8-bit number. The addition resulted in bit
    four being set which is a half carry from the addition of the lower'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'two nibbles. The half carry flag is mainly used with a number format called
    Binary Coded Decimal (BCD) and is needed for BCD arithmetic operations. For those
    who are interested in how the half carry flag is used, refer to the article: en.wikipedia.org/wiki/Half-carry_flag


    Modify the previous code example to add 100 to 200 as follows.


    ```

    test_asm : main.asm - ADD with carry generated

    ld1 r16, 100

    ld1 r17, 200

    add r16, r17

    ```


    When the result of an addition is greater than 255, which is the highest value
    that an 8-bit number can hold, the carry flag (C flag) is set as can be seen when
    the above code is stepped over in the debugger.


    Use the debugger and simulator to experiment with adding of numbers to get a better
    understanding of what the status register flags are doing. Some examples are 255
    + 1 which sets the H (half carry) flag, the C (carry) flag and the Z (zero) flag.
    The carry flag represents a ninth bit which has a value of 256, which is the result
    of 255 + 1. The destination register therefore contains zero, and so the zero
    flag is set in this example.


    If the result of an addition operation is a number that has the MSB set, the N
    (negative) flag will be set in the status register. The programmer can choose
    to treat the number as negative, if needed, or ignore the negative flag if working
    with positive numbers only. As an example, try 128 + 1.


    # 7.2.2 ADC – Add with Carry


    ADC (ADD with Carry) adds the values in two registers and the carry bit where
    the carry bit is added as the least significant bit of an 8-bit number. This instruction
    can be used when adding two 16-bit numbers that are split across four registers
    – two 8-bit registers per 16-bit number. The procedure to add two 16-bit numbers
    together would be to first add the least significant bytes using the ADD instruction,
    then add the most significant bytes using the ADC instruction so that the carry
    from the previous addition is included. An example of adding 9045 (0x2355) to
    511 (0x01FF) works as seen in the paragraphs that follow using four registers
    R16 to R19. The addition looks as follows.'
  merge: -1
