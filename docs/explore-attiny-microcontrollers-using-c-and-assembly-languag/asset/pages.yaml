- pgno: 199
  md: '# 9.3.3 Defining Names for Registers with DEF


    DEF is a directive that can be used to give a register a human readable name.
    In the example that follows, R16 is given the name count. After being given the
    name count at the beginning of the code using DEF, R16 is referred to as count
    in the rest of the program. Enter this code into the test_asm project and run
    it in the simulator to see that when count is cleared, R16 is cleared, and when
    count is incremented using the INC instruction, R16 is incremented.


    ```

    .DEF count = R16

    ldi count, 0x00 ; Clear count register

    loop:

    inc count ; Increment count register

    rjmp loop

    ```


    # 9.3.4 Equating Names to Expressions using EQU and SET


    EQU is used to set a human readable name equal to an expression. The expression
    can be a simple number, as the following example code shows.


    ```

    .DEF count = R16

    .EQU count_start = 5

    ldi count, count_start ; Value to start counting from

    loop:

    inc count ; Increment count register

    rjmp loop

    ```


    The above code shows that EQU is used to make count_start equal to 5. Wherever
    count_start is used in the code, 5 is substituted. In this example code, count_start
    is used to load a value of 5 to R16, by using R16 defined as count using DEF,
    and making count_start equal to 5 using EQU. This causes the value in R16 to start
    incrementing from 5 instead of 0. Enter this code into the test_asm project and
    run it in the simulator.


    SET assigns a value to a label in the same way as EQU, but unlike EQU, a label
    assigned to a value by SET can be changed or redefined later in a program. In
    the previous code example, SET can directly be substituted in place of EQU.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 9.3.5 Conditional Assembly


    Conditional assembly includes the IF, IFDEF, IFNDEF, ELIF, ELSE, and ENDIF assembly
    directives. Conditional assembly directives run at assembly time, and not at run-time
    when the code is running on the AVR. An example follows that uses just two of
    the above mentioned conditional assembly commands, IFDEF and ENDIF. This code
    is a modified version of the code from the push and pop example of section 6.6.2
    in Chapter 6.


    ```

    ; Initialize the stack pointer

    ldi r16, low(RAMEND)

    out spl, r16

    .IFDEF SPH

    ldi r16, high(RAMEND) ; Remove for ATtiny13(A) and ATtiny25

    out sph, r16 ; Remove for ATtiny13(A) and ATtiny25

    .ENDIF

    ldi r16, 0x5A ; Load a value to R16

    push R16 ; Save R16 to the stack

    clr R16 ; R16 gets modified

    pop r16 ; Restore R16 from the stack

    loop:

    rjmp loop

    ```


    In the original version of the above code, two lines of code had to be removed
    if the code was to be run on an ATtiny13(A) or ATtiny25. This code has to do with
    loading a value to the high byte of the stack pointer, or SPH. On the ATtiny13(A)
    and ATtiny25, SPH does not exist because there is not enough SRAM on these devices
    for the SPH to be needed. The above code takes advantage of this fact and uses
    IFDEF (if defined) to check if SPH is defined. In this way it makes the code universal,
    allowing it to be built for any ATtiny AVR device without the need to delete certain
    lines of code. It effectively automates the removal of the code that initializes
    the SPH for certain devices, while leaving these lines of code for other devices.
    For an ATtiny45 or ATtiny85, SPH is defined in the tn45def.inc, or tn85def.inc
    file found under Dependencies in the Solution Explorer pane of Microchip Studio.
    We have already looked at this file – refer back to Figure 8.1 in section 8.1.1
    of Chapter 8, or Figure 9.1 in section 9.2 of the current chapter for a reminder.
    SPH is not defined in the include files for ATtiny13(A) and ATtiny25 devices.
    When the assembler program is run and it finds .IFDEF SPH in the file, it checks
    to see if SPH is defined. If SPH is defined, it includes the two lines of code
    between IFDEF and ENDIF. If SPH is not defined, the code between IFDEF and ENDIF
    is not included in the assembly process, and does not appear in the final machine
    code instructions.'
  merge: -1
  img_proc: true
- pgno: 201
