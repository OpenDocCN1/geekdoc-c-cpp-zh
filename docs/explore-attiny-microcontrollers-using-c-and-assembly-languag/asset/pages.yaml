- pgno: 233
  md: "At the top of main.asm, the value assigned to MS_TIME_DEL sets the time delay\
    \ for the wait_ms subroutine in milliseconds, and is set to 500ms in the example\
    \ code.\n\n# 10.2.3.1 Splitting an Assembly Language Project into Files\n\nAs\
    \ the previous code listings show, an AVR assembly language project can be split\
    \ up into more than one file by adding a new file to the project. The new file\
    \ is then included in the project using the .include directive in the main assembly\
    \ language file. Because the AVRASM2 assembler program that comes with Microchip\
    \ Studio does not have a linker, assembly language projects have to use this simple\
    \ method of including additional assembly language files. As can be seen in the\
    \ previous code listing, the wait_ms.asm file that was added to the project is\
    \ included at the bottom of the main.asm file.\n\nIncluding files using the .include\
    \ directive effectively pastes the contents of the included file at the position\
    \ in the file that uses the .include directive. In our example code, the file\
    \ containing the wait_ms subroutine was included at the end of main.asm, effectively\
    \ pasting this code below the code in main.asm. If wait_ms.asm were included at\
    \ the top of the main.asm file, then the wait_ms subroutine would be placed in\
    \ Flash program memory starting at address 0, where the start of the code from\
    \ main.asm should be. If .org 0 were used at the start of the code in main.asm\
    \ to force it to start at address 0, the project would give build errors because\
    \ the first code found is placed at address 0. With wait_ms.asm included at the\
    \ top of main.asm, the delay subroutine is the first code and is assigned to start\
    \ at address 0 before the AVRASM2 assembler program finds .org 0 in the main assembly\
    \ language file. This means that we are asking the assembler program to put two\
    \ different pieces of code into memory starting at address 0. The result is that\
    \ the assembler program flags overlap errors during the build process. The solution\
    \ to including the external assembler file at the top of the main assembler file\
    \ is to use a jump instruction as follows.\n\n```\n.rjmp start\n.include \"wait_ms.asm\"\
    \n\nstart:\n    sbi   DDRB, DDB4    ; Set pin PB4 as output\n...\n```\n\nIn the\
    \ above code, an RJMP instruction is placed at the top of the main.asm file, which\
    \ means that it is at address 0 and is the first instruction to run on the microcontroller.\
    \ This instruction jumps to the start label, and over any code that is included\
    \ between it and the start label."
  merge: -1
  img_proc: true
- pgno: 234
  md: "# 10.2.3.2 How the wait_ms Subroutine Works\n\nThe new wait_ms millisecond\
    \ delay subroutine is based on the previous wait_1s fixed 1s delay subroutine\
    \ code. The only difference between these two subroutines is the number fed into\
    \ registers R16 to R19 at the start of these subroutines. Code from the start\
    \ of the wait_1s subroutine is shown below.\n\n```\nwait_1s:\n ldi   R16, low\
    \  ((F_CPU - 10) / 10)\n ldi   R17, byte2((F_CPU - 10) / 10)\n ldi   R18, byte3((F_CPU\
    \ - 10) / 10)\n ldi   R19, byte4((F_CPU - 10) / 10)\n```\n\nBecause the wait_1s\
    \ subroutine is fixed to delay for 1s, the number of clock cycles that the subroutine\
    \ must use up is equal to the frequency that the AVR CPU is clocked at. Some mathematics\
    \ compensates for the clock cycles used up before and after the loop in the subroutine\
    \ ( - 10 above), as well as for the cycles used in the loop ( / 10 above).\n\n\
    How the above code is modified for the wait_ms subroutine explains how wait_ms\
    \ works, and is described in the following paragraphs. In order to modify the\
    \ above code to be able to use different millisecond delay values, we can start\
    \ by asking how to generate a 1ms delay using this code. The code simply uses\
    \ up a certain number of clock cycles, and we must just work out how many clock\
    \ cycles are needed for 1ms. We know that the time period of one clock cycle is\
    \ 1 / frequency, written mathematically as shown below, where f is the frequency\
    \ of the AVR CPU.\n\n![](img/83ef13a6c66cc7882b2f357e97f451dc_234_0.png)\n\nOnce\
    \ we know how long one clock cycle takes, we can ask how many of these time periods\
    \ are needed to make up 1ms. The answer to this question is to divide 1ms by the\
    \ time period of one clock cycle to find out how many of these clock cycle periods\
    \ make up 1ms. Mathematically this is written as follows, where C_T is total clock\
    \ cycles.\n\n![](img/83ef13a6c66cc7882b2f357e97f451dc_234_1.png)"
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Substituting the formula for the time period of one clock cycle (1 + f) into
    the previous formula in place of t, and using the rules of mathematics, we can
    invert and multiply 1 + f, giving us the following.


    $C_T = 1 ms \times \frac{f}{1}$


    One millisecond, or 1ms, is one-one-thousandth of a second, or 1 + 1000, which
    we can substitute into the above formula to get the following.


    $C_T = \frac{1}{1000} \times \frac{f}{1} = \frac{f}{1000}$


    From the above calculation, we see that in order for our subroutine to delay for
    1ms, we must divide the CPU frequency by 1000. Thus the formula in the following
    line of code is modified as shown in the line of code after it.


    ```

    ldi R16, low ((F_CPU - 10) / 10)

    ```


    The above becomes the following for a 1ms delay.


    ```

    ldi R16, low ((((F_CPU / 1000) - 10) / 10)

    ```


    Of course, as the number generated by this formula is to be a 32-bit number loaded
    to four registers, the formula must be applied to each register as before, but
    it is pointless repeating the code for the other registers here.


    Now that we know how to calculate the number of clock cycles to generate a 1ms
    delay, we can work out how to generate a delay for a specific number of milliseconds.
    This is done by simply multiplying the number of clock cycles for 1ms by the number
    of milliseconds which will be called tms. Our formula thus becomes the following.


    $C_T = \frac{f}{1000} \times t_{ms} = \frac{f \times t_{ms}}{1000}$'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'In the code, the number of milliseconds (t_ms in the formula) is called MS_TIME_DEL.
    Thus with the formula applied to the code, the code now becomes the following.


    ```

    ldi R16, low (((F_CPU * MS_TIME_DEL) / 1000) - 10) / 10)

    ```


    F_CPU sets the AVR CPU frequency in use, and MS_TIME_DEL sets the time delay to
    generate in milliseconds. These values are set at the start of the code as follows,
    using a 1MHz CPU frequency and 500ms delay as an example.


    ```

    .equ F_CPU = 1000000 ; Frequency of CPU

    .equ MS_TIME_DEL = 500 ; Time delay in milliseconds

    ```


    The fully modified part of code from the wait_1s subroutine now becomes the following
    when the new calculation is applied to it for the wait_ms subroutine.


    ```

    wait_ms:

    ldi R16, low (((F_CPU * MS_TIME_DEL) / 1000) - 10) / 10)

    ldi R17, byte2(((F_CPU * MS_TIME_DEL) / 1000) - 10) / 10)

    ldi R18, byte3(((F_CPU * MS_TIME_DEL) / 1000) - 10) / 10)

    ldi R19, byte4(((F_CPU * MS_TIME_DEL) / 1000) - 10) / 10)

    ```


    Remember that the mathematical operators in the above expressions are performed
    by the AVRASM2 assembler program when it finds them in the source code file during
    the build process. The result is that the assembler program generates a number
    based on the values of F_CPU, MS_TIME_DELAY and the mathematical expressions.
    This calculated number is then split into four parts using the functions low(),
    byte2() byte3() and byte4(). These functions are also run by the assembler program
    during the build process, which finally results in four numbers that are loaded
    into R16 to R19 in the generated machine code. In effect these numbers are “hard
    coded” into the final machine code, and the wait_ms subroutine always generates
    the same time delay set by F_CPU and MS_TIME_DEL. This value can’t be changed
    at run time when the code is executing on the target AVR. It can only be changed
    at build time in the source code and set to a new value. The mathematical operators
    and functions used in the above code are found in the Expressions section of the
    AVR Assembler document from Microchip.


    # 10.2.3.3 Limits of the wait_ms Subroutine


    The wait_ms subroutine has certain upper and lower limits to the CPU frequency
    and millisecond time delay that it can be supplied with. If the number of cycles
    that the calculation generates and places in the 32-bit number stored in R16 to
    R19, is too high or too low, then the generated time delay will be incorrect.
    It is best to calculate these limits so that anyone using this wait_ms subroutine
    will supply it with in-bounds parameters.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Simplifying the Formula


    The formula in the code from the wait_ms subroutine, shown in the following code
    snippet, can be simplified. It is easy to see the 10 cycles that are used in the
    loop and the ten cycles used before and after the loop as it appears unimplified
    in this code snippet. For the purposes of calculating the upper and lower limits
    of the wait_ms subroutine it is better to first simplify the formula. Start by
    taking the formula from the code shown below and write it in normal mathematical
    notation.


    ```

    ldi R16, low ((((f_CPU * MS_TIME_DEL) / 1000) - 10) / 10)

    ```


    In normal mathematical notation the formula becomes:


    \(C_T = \left( \frac{f_{CPU} \times t_{ms}}{1000} - 10 \right) \div 10\)


    Instead of dividing by 10 at the end of the formula, we can invert and multiply,
    which gives us:


    \(C_T = \left( \frac{f_{CPU} \times t_{ms}}{1000} - 10 \right) \times \frac{1}{10}\)


    Doing the multiplication, we get:


    \(C_T = \frac{f_{CPU} \times t_{ms}}{1000 \times 10} - \frac{10}{10} = \frac{f_{CPU}
    \times t_{ms}}{10000} - 1\)


    In the above simplified formula, we can see that the f_CPU t_ms Combination must
    have a maximum value that causes C_T to be too big to fit into a 32-bit number,
    which is ultimately stored in R16 to R19 in the code.


    # Calculating the Maximum Delay Time of the Subroutine


    Because the f_CPU t_ms combination consists of two unknown values, it is reasonable
    to set one of these values to a known quantity so that we are left with only one
    unknown value. Setting f_CPU to the maximum clock frequency of the ATtiny devices
    that we are using leaves t_ms as the only unknown value that we want to calculate.
    This maximum frequency is 20MHz. The maximum value for C_T is calculated using
    2^32 - 1 because C_T is a 32-bit number and this calculation gives the biggest
