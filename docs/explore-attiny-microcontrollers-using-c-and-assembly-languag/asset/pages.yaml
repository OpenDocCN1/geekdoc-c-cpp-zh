    Notice in the memory window at the bottom right of Microchip Studio, with prog
    FLASH selected in the Memory drop-down list, at that the very right column of
    this window, the text from the DB constant data lines can be seen (the words "Hello",
    "Hi", and the letters ABC). This is because this column contains the ASCII representation
