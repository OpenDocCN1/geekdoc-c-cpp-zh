  md: '# 6.9.1 Register Direct Addressing


    AVR register direct addressing has two variants, namely single register and two
    register direct addressing. Figure 6.16 shows two register direct addressing taken
    from the AVR Instruction Set Manual.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_129_0.png)


    Take special note that the diagrams of addressing modes in the AVR instruction
    set manual are simplifications and do not show exact bit positions of the address
    bits of instructions.


    An example of single register direct addressing is the CLR (Clear Register) instruction.
    The full address of the destination register is encoded in the instruction allowing
    the instruction to directly address the register. Figure 6.17 shows how the address
    of a register file register is encoded in the CLR instruction – it is actually
    encoded twice because the source and destination are the same register.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_129_1.png)'
