    ldi r16, 9

    ldi r17, 20

    sub r16, r17


    loop:

    rjmp loop

    ```


    Start debugging and break. Now step over each line of code and examine the Status
    Register in the Processor Status window. The program loads 9 into R16 and 20 into
    R17 and then executes the SUB (Subtract Without Carry) instruction which subtracts
    R17 from'
