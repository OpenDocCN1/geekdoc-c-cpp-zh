- pgno: 289
  md: '# 11.1 AVR Instruction Set Overview and Categories


    There are two important things to note with regards to the AVR instruction set.
    Firstly, not all instructions are included in the instruction set of all devices
    because not all devices have the same memory, hardware, and built-in peripherals.
    Secondly, the AVR CPU has been updated several times since its inception, which
    means that there are several different versions of the AVR 8-bit CPU, as was covered
    in the previous chapter. This means that there are additional instructions in
    some of the newer CPU versions.


    In the Instruction Set Summary section of the datasheets for AVR microcontrollers,
    instructions are categorized into five section, namely 1) arithmetic and logic
    instructions, 2) branch instructions, 3) bit and bit test instructions, 4) data
    transfer instructions, and 5) MCU control instructions. In the guided tour through
    the entire instruction set that follows in the next section, instructions are
    covered in the same categories as the datasheet and using the same category headings
    for easy cross reference. Each main category has been further subdivided where
    appropriate.


    # 11.2 A Guided Tour through the ATtiny AVR Instruction Set


    This section looks at the part of the AVR instruction set implemented on ATtiny
    devices with a summary of the instructions that were used so far in the book,
    and commentary on instructions that were not used. Example code is included where
    appropriate.


    # 11.2.1 Arithmetic and Logic Instructions


    The arithmetic and logic instructions category includes addition, subtraction
    and the logic instructions AND, OR and EOR. It also includes increment, decrement,
    sign change, bit set, bit clear, register set, register clear and register test
    instructions. Arithmetic and logic instructions have been further divided down
    into more precise subcategories in the subsections that follow.


    # 11.2.1.1 Add and Subtract Instructions


    ATtiny25/45/85 and ATtiny13(A) microcontrollers implement three addition instructions
    and five subtraction instructions summarized in the following sections.


    # Addition Instructions


    +   ADD (Add without Carry)


    +   ADC (Add with Carry)'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'ADD and ADC have already been sufficiently covered in the main text. Refer
    to section 7.2.1 for ADD examples and section 7.2.2 for an ADC example.


    # ADIW (Add Immediate to Word)


    ADIW adds an immediate value that can only be between 0 and 63, to one of four
    register pairs. The result of the addition is placed in the chosen register pair.
    In the instruction encoding of ADIW, 6 bits are available to represent immediate
    data encoded in the instruction, which means that 2^6 = 64 different values can
    be used: 0 to 63. Two bits are available to represent the chosen register pair,
    giving 2^2 = 4 possible register pairs.


    ADIW can be used to perform an increment on a 16-bit number in a single line of
    code. Because ADIW operates on the register pairs, it can be used to increment
    a pointer when one of the register pairs is used as a pointer.


    The following code shows how to use the ADIW instruction to increment the Z register.


    ```

    .equ NUM = 2048 ; Number > 8 bits

    ldi ZL, low(NUM) ; Load number to Z register

    ldi ZH, high(NUM)

    loop:

    adiw ZH:ZL, 1 ; Increment 16-bit number by 1

    rjmp loop

    ```


    In the above code, a number that uses up more than 8 bits is equated to the name
    NUM. NUM is then loaded to the Z register in two parts, 8 bits at a time. In the
    loop, the value of NUM, which is 2048 and stored in the Z register, is incremented
    by 1 using ADIW. The notation ZH:ZL refers to the Z register upper and lower bytes.
    This notation makes it easier to read the code, but actually disassembles to the
    following:


    ```

    adiw ZH:ZL, 1 ; Increment 16-bit number by 1

    00000002 ADIW R30,0x01 Add immediate to word

    ```


    As can be seen in the above code, the first operand of the ADIW instruction, which
    is the register pair, disassembled to R30 for ZH:ZL. The second operand is the
    value to add to the selected register pair and is simply displayed in hexadecimal
    in the disassembly. R30 is ZL, and represents the Z register when used with ADIW.
    This makes it possible to specify the Z register in four different ways. ZH:ZL
    can be used, as the example code did or R31:R30. ZL could be used instead of ZH:ZL.
    Alternatively, R30 could be used. Of the four, ZH:ZL probably gives the clearest
    meaning when used with ADIW.'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Although there are two bits in the ADIW instruction that represent the four
    possible register pairs, it is not possible to directly use these bits when writing
    assembly language. If it were so, then the following would be possible.


    ```

    adiw 3, 1 ; Not valid code!

    ```


    The above line of code is meant to increment the Z register by 1, but causes an
    invalid register error. Although 3, or 11 binary, is encoded in the instruction
    to represent the Z register, it can''t be used this way in assembly language code.


    The four register pairs that can be used with ADIW are as follows.


    | Register Pair Encoding | Register Pair | Alternate Notation | Single Register
    Notation | Register Pair Name |

    |---|---|---|---|---|

    | 0 | R25:R24 | none | R24 | none |

    | 1 | R27:R26 | XH:XL | R26 or XL | X register |

    | 2 | R29:R28 | YH:YL | R28 or YL | Y register |

    | 3 | R31:R30 | ZH:ZL | R30 or ZL | Z register |


    In the above table, Register Pair Encoding shows the value that is encoded in
    the ADIW instruction to represent a register pair. The Register Pair column shows
    the notation that can be used with ADIW to represent the register pair in the
    MSB:LSB order. Alternate Notation shows an alternate to the Register Pair notation.
    The first register pair does not have a register pair name, so has none in the
    Alternate Notation column. The LSB of the register pair can be used with ADIW,
    as shown in the Single Register Notation column, instead of the register pair
    or alternate notation to represent the register pair. The last column shows the
    register pair names when used in combination as 16-bit registers. Again, the first
    register pair does not have a name.


    From the above table, it can be seen that all of the following lines of code do
    the same thing and increment the Z register by 1.


    ```

    adiw R31:R30, 1 ; Increment Z register by 1

    adiw ZH:ZL, 1 ; Increment Z register by 1

    adiw R30, 1 ; Increment Z register by 1

    adiw ZL, 1 ; Increment Z register by 1

    ```


    Each of the above lines of code disassemble to the following line of code.


    ```

    ADIW R30,0x01

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Subtraction Instructions


    # SUB (Subtract Without Carry)


    SUB is covered in section 7.3 of Chapter 7.


    # SUBI (Subtract Immediate)


    We first came across SUBI when looking at disassembled code in section 8.2.2.4
    of Chapter 8, it was also used in section 9.3.2.2 of Chapter 9 to force the status
    register to update.


    # SBCI (Subtract Immediate with Carry)


    SBCI was used in combination with SUBI to decrement a 32-bit number in section
    10.2.2 of Chapter 10, and was subsequently used throughout Chapter 10. It also
    appeared in the disassembled code in section 8.2.2.4 of Chapter 8.


    # SBC (Subtract with Carry)


    SBC is like SBCI, but instead of using an immediate value as the second operand,
    it uses a second register. In other words, it subtracts two registers and takes
    into consideration the carry flag in the status register. SBC is simple enough
    to understand, so will not be explained further. Refer to the AVR Instruction
    Set Manual for more information on SBC.


    # SBIW (Subtract Immediate from Word)


    SBIW is the subtraction counterpart to ADIW. It works exactly the same way as
    ADIW, but instead of adding a value between 0 and 63 to a register pair, it subtracts
    the value. The same four register pairs are operated on. An example is shown in
    the following code.


    ```

    .equ    NUM = 2048        ; Number > 8 bits

    ldi     ZL, low(NUM)      ; Load number to Z register

    ldi     ZH, high(NUM)

    loop:

    sbcw    R31:R30, 1        ; Decrement Z register by 1

    sbcw    ZH:ZL, 1          ; Decrement Z register by 1

    sbcw    R30, 1            ; Decrement Z register by 1

    sbcw    ZL, 1             ; Decrement Z register by 1

    rjmp    loop

    ```


    As can be seen in the above code, the same different notations can be used to
    access the register pair for SBIW as was done for ADIW. The same register pairs
    from the table under the ADIW section can also be used with SBIW. In the above
    code, 1 is subtracted from the Z register at each SBIW instruction.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 11.2.1.2 Logical Instructions


    The five logical instructions implemented in the ATtiny25/45/85 and ATtiny13(A)
    are well covered in Chapter 7, so they are cross referenced here to easily find
    them in Chapter 7.


    # Logical AND


    +   AND (Logical AND)

    +   ANDI (Logical AND with Immediate)


    AND and ANDI are covered in section 7.4.1 of Chapter 7.


    # Logical OR


    +   OR (Logical OR)

    +   ORI (Logical OR with Immediate)


    OR and ORI are covered in section 7.4.2 of Chapter 7.


    # Logical Exclusive OR


    +   EOR (Exclusive OR)


    EOR is covered in section 7.4.3 of Chapter 7. In section 8.2.4.2 of Chapter 8,
    EOR is used to toggle an LED.


    # 11.2.1.3 Increment and Decrement Instructions


    # INC (Increment)


    The INC instruction simply increments a register by 1 and is demonstrated in section
    5.2.2 of Chapter 5. It is also used in section 8.2.1.4 of Chapter 8, and in section
    9.3.3 and 9.3.4 of Chapter 9.


    # DEC (Decrement)


    DEC decrements a register by 1 and was first used in the LED blink assembly code
    of section 2.3.2 in Chapter 2 to decrement registers in the software time delay
    subroutine. DEC was also used to demonstrate the use of the Z flag in section
    6.5.1 of Chapter 6.


    # 11.2.1.4 Sign Change Instructions


    # COM (One''s Complement)


    COM converts the number in a register to one''s compliment, in other words it
    inverts each bit in the register, as the following code demonstrates by converting
    the binary number 1001_0011 to its 1''s compliment value 0110_1100.


    ```

    ldi R16, 0b1001_0011 ; Load 0x93 to R16

    com R16 ; R16 now contains 0b110_1100 (0x6C)

    ```'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# NEG (Two''s Complement)


    NEG converts the number in a register to the two''s compliment form of the number.
    In the following code, 1 is loaded to R16, then converted to -1 in 2''s compliment
    format, which is a value of 0xFF. The negative flag and other flags in the status
    register are affected by the operation.


    ```

    ldi   R16, 1    ; Load +1 to R16

    neg   R16       ; Change value in R16 to -1 in 2''s compliment format

    ```


    # 11.2.1.5 Bit Set and Clear Instructions


    # SBR (Set Bits in Register)


    SBR performs an OR operation between immediate data and a register in order to
    set bits in the register. SBR is the same as using ORI and has the same instruction
    encoding. In the following code example, the SBR and ORI instructions do exactly
    the same thing, setting the upper four bits in R16, while leaving the lower four
    bits unchanged.


    ```

    ldi   R16, 0x02

    sbr   R16, 0xF0


    ldi   R16, 0x02

    ori   R16, 0xF0

    ```


    It is interesting to note in the disassembly of the above code that both the SBR
    and ORI instructions disassemble to the same code, as shown below.


    ```

    ldi   R16, 0x02

    0000000 LDI R16, 0x02     Load immediate

    sbr   R16, 0xF0

    0000001 ORI R16, 0xF0     Logical OR with immediate

    ldi   R16, 0x02

    0000002 LDI R16, 0x02     Load immediate

    ori   R16, 0xF0

    0000003 ORI R16, 0xF0     Logical OR with immediate

    ```


    Both instructions disassemble to ORI R16,0xF0 as can be seen above. Looking at
    both instructions in the AVR Instruction Set Manual shows that they both have
    the same encoding, shown below.


    ```

    0110 KKKK dddd KKKK

    ```


    This means that SBR is a synonym for, or another name for ORI.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# CBR (Clear Bits in Register)


    CBR clears bits in a register by performing a logical AND between the register
    and the compliment of immediate data. This means that all bits in the immediate
    data that are set, result in the same bits in the destination register being cleared,
    as the first two lines of the following code show.


    ```

    ldi    R16, 0xA5

    cbr    R16, 0xF0    ; Mask is 0x0F


    ldi    R16, 0xA5

    andi   R16, 0xF0    ; Compliment the mask value: 0xF0

    ```


    In the first line of code above, 0xA5 is loaded to R16. In the second line of
    code, CBR is used on R16 with a mask value of 0x0F. This is not the equivalent
    of ANDI R16, 0x0F because the compliment of the mask value is used, meaning that
    all bits in the mask value of 0x0F are inverted, causing the mask value to become
    0xF0 before performing the ANDI. The result is that the value left in R16 after
    the CBR instruction has executed in the above example is 0xA0.


    The second two lines of code above show the equivalent code using ANDI. 0xF0 is
    used with ANDI, which is the compliment of 0x0F. Both CBR and ANDI in the above
    code disassemble to ANDI R16,0xF0 which means that the assembler program must
    be inverting the mask value when it comes across the CBR instruction and then
    changes CBR to ANDI.


    # 11.2.1.6 Register Set, Clear and Test Instructions


    # TST (Test for Zero or Minus)


    TST tests if a register contains zero or a negative value by performing a logical
    AND on the register and itself. This causes the status register flags S, V, N
    and Z to update according to what the register contains. In the code that demonstrates
    the use of constant data in Flash memory in section 9.3.2.2 of Chapter 9, we used
    a trick to update the status register Z flag by subtracting 0 from R16 to find
    out if R16 contained zero. In this code we could have used the TST instruction
    instead, as follows.


    ```

    check_0:

    lpm    r16, Z+    ; Load byte from program memory

    tst    r16        ; Loop if result not zero

    brbc   SREG_Z, check_0

    ```


    This code was taken from the example code in section 9.3.2.2, near the bottom
    of the listing. TST causes the Z flag to update, just as subi r16, 0 did in the
    original code.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'TST is another example of an instruction that is a synonym of another instruction,
    as are CLR and SER that follow. The encoding below shows that TST is the equivalent
    of doing an AND operation using the same register as source and destination. This
    operation does not modify the contents of the target register.


    ```

    TST 0b 0010 000d dddd dddd TST Rd

    AND 0b 0010 00rd dddd dddd AND Rd, Rr

    ```


    In the following code it can be seen that an AND instruction with the same source
    and destination register disassembled to a TST instruction, while a TST instruction
    disassembled to the same TST instruction.


    ```

    tst r16

    0000 0000 TST R16 Test for Zero or Minus

    and r16, r16 Test for Zero or Minus

    0000 000E TST R16

    ```


    # CLR (Clear Register)


    CLR clears a register by doing an exclusive OR between the register and itself.
    CLR Rd is the same as EOR Rd,Rd.


    # SER (Set all Bits in Register)


    SER sets all bits in a register. SER Rd is the same as LDI Rd,0xFF.


    # 11.2.2 Branch Instructions


    Included in the branch instructions section are jump instructions, subroutine
    call instructions, return from subroutine, return from interrupt, compare instructions,
    skip instructions and finally instructions that are named starting with the word
    branch. Each of these types of branch instructions follow in their own subsections.


    # 11.2.2.1 Jump Instructions


    RJMP (Relative Jump)

    RJMP can jump in the address range PC - 2K +1 and PC + 2K words. Note that this
    address range is in 16-bit words. In Table 1.1 from section 1.3 in Chapter 1,
    the biggest Flash memory size of the microcontrollers listed there is 8KB. Remember
    that these values are in bytes, so must be divided by 2 to get the number of words.
    An 8K byte memory is 4K words. Even with a 4K word memory, it looks like the RJMP
    instruction can only jump to the start and end of memory if the PC is pointing
    to the middle of memory. How can RJMP jump to the end of a 4K word memory if it
    can only jump to PC + 2K words and the PC is at'
  merge: -1
