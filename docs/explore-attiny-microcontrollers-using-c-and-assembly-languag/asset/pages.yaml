    # A.3.1.3 Arduino Uno Sketch


    To use an Arduino Uno as a programmer, a sketch must be loaded to the Arduino.
    Although other Arduino boards besides the Arduino Uno could be used, only the
    Uno is covered in this book as it is the most popular Arduino model. These instructions
    were tested on a genuine Arduino Uno R3 board from www.arduino.cc. Download the
    Arduino IDE from www.arduino.cc/en/software and install it to the host computer.
    Find installation instructions at www.arduino.cc/en/Guide for installing the IDE.
    After installing the Arduino IDE, run the Arduino IDE application and plug the
    Arduino Uno into a USB port of the host computer. Windows 10 computers will automatically
    install a driver for a genuine Arduino Uno R3.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'In the Arduino IDE, open the ArduinoISP example sketch by selecting File ▶
    Examples ▶ 11.ArduinoISP ▶ ArduinoISP from the top menu. Select the Arduino Uno
    as the target board by selecting Tools ▶ Board ▶ Arduino AVR Boards ▶ Arduino
    Uno from the top menu of the IDE. Select the correct port for the Arduino Uno
    under Tools ▶ Port from the top menu. The Arduino Uno must be plugged into a USB
    port for it to appear on the Port menu. Finally, with the ArduinoISP sketch window
    selected, click the Upload button, or select Sketch ▶ Upload using the top menu.
    The Arduino IDE will compile and upload the sketch to the target Arduino Uno,
    making it into a ISP programmer. Close the Arduino IDE application. Unplug the
    Arduino from the USB port before connecting it to a circuit.


    At this stage, the Arduino Uno is ready to be used as a ISP/SPI programmer. In
    the next section, section A.3.2, the avrdude programming software is installed.


    # A.3.2 Download and Install avrdude


    Programming software, called avrdude, must be downloaded, unzipped and manually
    installed. This is done by simply copying it, and an accompanying configuration
    file, to a folder on the host computer.


    Visit download.savannah.gnu.org/releases/avrdude/ and scroll down the page to
    find the newest version of avrdude. At the time of writing, the newest version
    of avrdude was version 6.3. Click the link called avrdude-6.3-mingw32.zip to download
    the zipped file that has this same name.


    If you have 7-Zip (from www.7-zip.org) installed on your computer, simply right-click
    the downloaded file and then select 7-Zip ▶ Extract to "avrdude-6.3-mingw32" on
    the menu that pops up. This creates a folder called avrdude-6.3-mingw32 and extracts
    the two files from the zip file to it.


    If you are not using 7-Zip, you will need to manually make a folder called avrdude-6.3-mingw32
    in one instance of Windows File Explorer, and then double-click the avrdude-6.3-mingw32.zip
    zip file in another instance of File Explorer. Drag the two files from the opened
    zip file to the newly created folder.


    To install avrdude, simply move the newly created folder containing avrdude to
    the root of the C: drive. It does not have to be placed there, but this makes
    finding it a lot easier, and'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'referencing its path a lot shorter. Open a second instance of Windows File
    Explorer, and navigate directly to Local Disk (C:), or via This PC ▸ Local Disk
    (C:). Now drag and drop the avrdude-6.3-mingw32 folder to this location. Figure
    A.8 shows the folder copied to the C: drive. It should contain two files that
    were extracted from the zip file, namely avrdude.conf, and avrdude.exe.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_342_0.png)


    Figure A.8: Location of the Folder Containing the avrdude Files


    This concludes the installation of avrdude. There is no need to add it to the
    windows path or make any other changes. We will access it in the installation
    folder from Microchip Studio. In the next section we build a ATtiny test circuit
    for testing the programmer and programming software.


    # A.3.3 Build an AVR Circuit and Connect a Programmer


    Refer to Appendix B for circuits that use PDIP packaged ATtiny microcontrollers
    and show connections to the different USB hobby programmer headers. Select one
    of these circuits and a programmer, depending on which ATtiny part and programmer
    you have. Build the circuit and attach a programmer as shown.


    The subsections that follow contain notes and more details on how to attach a
    programmer to an 8-pin PDIP packaged ATtiny microcontroller, as shown in Figure
    B.1 of Appendix B. If you are using one of the other ATtiny microcontrollers from
    one of the other circuits, building the circuit will be very similar, with only
    the pin numbers for power and programming changing.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# A.3.3.1 Connecting a USBasp


    The 10-pin header of the USBasp is included in all of the circuits of Appendix
    B, and has the reference designator J2. This is actually an older AVR programming
    header that was replaced by the now common 6-pin ISP/SPI header that has the reference
    designator J1 in each of the circuits in the figures of Appendix B. The actual
    original 10-pin header has GND connections where the USBasp in the figures has
    n.c., indicating not connected pins. In the original USBasp design from Thomas
    Fischl, pin 4 and 6 of the 10-pin header are connected to pins on the microcontroller
    on the USBasp. On the version of the USBasp shown in Figure A.1. at the beginning
    of this chapter, these pins are not connected, as indicated in the Figures of
    Appendix B.


    Before connecting a USBasp to an AVR microcontroller, it is important to decide
    if the AVR circuit is to be powered from the USBasp, or if an external power supply
    is to be used. If the circuit is to be powered by the USBasp, then connect the
    +5V pin from the USBasp connector to +5V of the circuit, which connects to the
    AVR VCC pin. If the AVR circuit is to be powered from an external power supply,
    then do not connect the +5V pin of the USBasp to the circuit – leave it disconnected.


    There are three different ways to connect a USBasp to an ATtiny microcontroller,
    namely, 1) directly from the 10-pin header on the board, 2) from a 10-pin female
    connector at the end of a ribbon cable plugged into the header on the USBasp,
    and 3) from a 10-pin to 6-pin adapter connected to the USBasp via a ribbon cable.
    These connections are each described under the headings that follow.


    # 10-pin Male Header


    Dupont wires with a female connector on one end and a male connector on the other
    end can be used to connect directly from the 10-pin male header on the USBasp
    to an ATtiny microcontroller on a breadboard. If using this method, the connections
    shown on the USBasp connector, J2, in each of the figures of Appendix B must be
    used. J2 is a top view of the 10-pin male header on the USBasp.


    # 10-pin Female Connector on Ribbon Cable


    Plugging a ribbon cable, with a 10-pin female connector at each end, into the
    male connector on the USBasp allows Dupont wires with a male connector on each
    end, or single-strand wires, to connect from the female connector to a breadboard
    circuit. If using this connection method, then use the inset image with the 10-pin
    female connector, found'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'next to J2 in each of the figures from Appendix B, to make the connections
    from the USBasp to the breadboard circuit. This image has the same pinout as J2,
    but it is flipped over, and is a view facing the holes of the female connector
    at the end of the ribbon cable. Using this image makes it easy to connect the
    USBasp to the AVR circuit by using the image as a map of the female connector.


    # 6-pin Adapter (ISP/SPI)


    If using a 10-pin to 6-pin adapter with the USBasp, use the inset image above
    the SPI header J1 in each of the figures in Appendix B to connect the USBasp to
    the circuit. Use either Dupont wires with a male connector on each end, or single
    strand wires, to connect from the 6-pin female connector of the USBasp adapter
    to the AVR circuit. The inset image has the same pinout as J1, except that it
    is flipped over and is a view facing the holes of the 6-pin female connector on
    the adapter. Use this image as a map to connect from the USBasp to the AVR circuit.


    # A.3.3.2 Connecting a USBtinyISP


    USBtinyISP programmers, and variations of the original USBtinyISP design, usually
    have a 6-pin ISP/SPI connector. This could be in the form of a male header and/or
    a 6-pin female connector at the end of a ribbon cable. Connections to both a male
    header and female ribbon cable connector are described under the headings that
    follow.


    # 6-pin Male Header


    Connections can be made directly from a 6-pin male header on a USBtinyISP to an
    AVR circuit using Dupont wires with a female connector on one end and a male connector
    on the other. When making this connection, use connector J1, the SPI header, from
    the circuits in Appendix B to make the connections to the AVR circuit.


    # 6-pin Female Connector on Ribbon Cable


    Use either Dupont wires with a male pin on each end, or single strand wires, to
    connect from the 6-pin female connector of the USBtinyISP to the AVR circuit.
    If making this connection, use the inset image of the 6-pin female connector found
    above J1 in the circuits of Appendix B. The image is a view facing the holes of
    the female connector.


    # A.3.3.3 Connecting an Arduino Uno ArduinoISP


    Each circuit in Appendix B shows the connections needed to connect an Arduino
    Uno to an ATtiny microcontroller, when using the Arduino as an ISP programmer.
    The sketch called ArduinoISP must be loaded to the Arduino, as already described
    in this Appendix.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'In the inset image of each circuit in Appendix B containing the Arduino Uno
    connections, the connections of just one of the Arduino Uno edge connectors and
    its ICSP header are shown. These connectors are for an Arduino Uno that has the
    top of the board facing up, and the USB connector at the left. All of the programming
    connections can be taken off the top left Arduino header at the edge of the board,
    which has all of the ISP/SPI pins available – GND, SCK, MISO, MOSI, and RESET.
    If using this connector to connect to the AVR circuit, either Dupont connectors
    with a male pin on each end, or single-strand wires, can be used to make the connections.
    To power the circuit from the Arduino Uno, use the 5V connection from the POWER
    connector of the Arduino on the opposite side of the board, or 5V from the Arduino
    Uno ICSP header.


    As an alternative to using the edge connector to connect to the target AVR circuit,
    wires can be connected from the ICSP header to the AVR circuit. In this case,
    Dupont wires with a female connector on one end and a male connector on the other
    can be used. Note that RESET must still be taken from pin 10 of the edge connector,
    and not from the ICSP header. RESET on the ICSP header is a reset input to the
    Arduino.


    # A.3.4 Programming Parameters


    Programming parameters, or command line options (also called arguments), to be
    passed to avrdude must be worked out for each combination of ATtiny part and the
    programmer being used. These parameters will be set up in Microchip Studio, which
    will then pass them to avrdude when it is called.


    # A.3.4.1 Documentation for avrdude


    Documentation in the form of a PDF file for avrdude that contains more information
    on using avrdude can be found at download.savannah.gnu.org/releases/avrdude/ which
    contains PDF files for each version of avrdude. A file called avrdude-doc-6.3.pdf
    is the documentation for version 6.3 of avrdude, which was the current version
    at the time of writing. This is the official avrdude documentation that can be
    consulted for information on avrdude. It contains programming parameters that
    avrdude understands.


    # A.3.4.2 Parameters for avrdude Explained


    Parameters that must be passed to avrdude for different programmers is explained
    here. This section is just an overview to get a better understanding of how avrdude
    works. Specific parameters for the three hobby programmers covered in this book
    follow. As a first example, look at the following.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '```

    avrdude -p t85 -c usbasp -P usb -U flash:w:"file.hex"

    ```


    The above line of code shows how avrdude would be called from the command line
    to load a program from a file to the Flash memory of an AVR microcontroller. Although
    we won''t be calling avrdude directly from the command line, avrdude is a command-line
    program, and we need to understand how to use it when setting it up in Microchip
    Studio.


    The first item in the above line is avrdude, which invokes the avrdude executable
    program – in other words it calls or runs the avrdude program that we downloaded,
    named avrdude.exe. Items following the call to avrdude are command-line options
    that are passed to avrdude from the command line, simply by typing them in after
    avrdude.


    The first option is the -p switch, specifying which part is to be programmed,
    followed by the code for the specific part. In this example, -p is followed by
    t85, which is the code for the ATtiny85 part. Part codes for PDIP packaged ATtiny
    microcontrollers from Table 1.1 in section 1.3 of Chapter 1 are shown in Table
    A.1. Table A.1 only includes a small number of AVR parts that avrdude can program.
    The many other supported parts can be found in the avrdude PDF document.


    # Table A.1: Part Codes for ATtiny Microcontrollers in avrdude


    | 8-Pin PDIP | | 20-Pin PDIP | |

    |---|---|---|---|

    | ATtiny13 | t13 | ATtiny26 | t26 |

    | ATtiny13A | t13 | ATtiny261A | t261 |

    | | | ATtiny461 | t461 |

    | ATtiny25 | t25 | ATtiny461A | t461 |

    | ATtiny45 | t45 | ATtiny861 | t861 |

    | ATtiny85 | t85 | ATtiny861A | t861 |

    | | | | |

    | **14-Pin PDIP** | | ATtiny2313 | t2313 |

    | ATtiny24 | t24 | ATtiny2313A | t2313 |

    | ATtiny24A | t24 | ATtiny4313 | t4313 |

    | ATtiny44 | t44 | | |

    | ATtiny44A | t44 | **28-Pin PDIP** | |

    | ATtiny84 | t84 | ATtiny48 | t48 * |

    | ATtiny84A | t84 | ATtiny88 | t88 |'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'In Table A.1, the ATtiny48 part is marked with an asterisk because it is not
    included in the list of supported parts in the avrdude documentation and is not
    supported by avrdude version 6.3. Support for the ATtiny48 can be added by modifying
    the avrdude.conf file that came with avrdude. This text file can be edited using
    any text or code editor, and the entry from lists.nongnu.org/archive/html/avrdude-dev/2009-08/msg00005.html
    added to it. It is just a matter of opening this file in a text editor and searching
    for “ATtiny88” in order to place the entry of the above above ATtiny88. If you
    don’t feel confident to edit the file, or want a quick solution, find the modified
    avrdude.conf file with the accompanying files for this book. Simply copy the modified
    file and replace the currently existing one that is in the folder that we installed
    avrdude to, which is found in C:\avrdude-6.3-mingw32 if you followed the instructions
    in this appendix.


    Back to the avrdude command line parameters example, we now have the -c switch
    followed by a programmer name, as can be seen in bold below.


    ```

    avrdude -p t85 -c usbasp -P usb -U flash:w:"file.hex"

    ```


    The -c switch must be followed by a programmer ID. In the example above, the programmer
    specified is the USBasp. Table A.2 shows the three programmers that are covered
    in this appendix with their avrdude programmer IDs.


    | Programmer | ID |

    | :--- | :--- |

    | USBasp | usbasp |

    | USBasp Clone | usbasp-clone |

    | USBTinyISP | usbtiny |

    | ArduinoISP | avrisp |


    For the USBasp pictured in this book, the usbasp ID works. If you are having trouble
    programming with your USBasp, you can try usbasp-clone instead. As can be seen
    in Table A.2, the programmer ID for a USBTinyISP is usbtiny. When an Arduino Uno
    has been loaded with the ArduinoISP sketch, it has effectively become an ISP programmer,
    so the ID avrisp must be used with it. Many more programmers are supported by
    avrdude, but as mentioned, only three programmers are covered in this appendix.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'Parameters passed to avrdude are case-sensitive. We saw that a lowercase -p
    switch is used to specify the part. An uppercase -P switch is used to specify
    the port used by the programmer, which is a USB port in our example, as can be
    seen in bold below.


    ```

    avrdude -p t85 -c usbasp -P usb -U flash:w:"file.hex"

    ```


    Both the USBasp and USBtinyISP must be passed usb after -P. For the ArduinoISP
    which appears as a virtual COM port, the COM port number must be specified after
    -P, for example COM3, if this is the port number that the Arduino is assigned
    when plugged into a USB port. For the ArduinoISP only, a baud rate must be specified
    using -b, which can be placed after the -P switch and the port type. This must
    be -b 19200.


    Finally we get to the -U switch which specifies that a memory operation is to
    be performed. Note that this is an uppercase U. The -U switch is followed by the
    memory type, operation to perform, and the file name, all separated by colons.
    In our example the memory type is Flash program memory and the operation is a
    write operation. An example file called file.hex is shown. These options are passed
    to avrdude after the -U switch as flash:w:"file.hex", where flash specifies Flash
    memory, w specifies a write operation and file.hex is the name of the file that
    contains the program to load. The file name does not need to be placed between
    quotes, but when a path to the file is included that has one or more space characters
    in it, the quotes are necessary. The file is generated in Microchip Studio as
    part of the build process and is in hexadecimal format.


    Now that we have an understanding of what must be passed to avrdude in order to
    specify the target AVR to be programmed, the programmer being used, and the operation
    for it to perform, we can look at parameters for the specific programmers covered
    in this appendix. The three sections that follow show the command-line parameters,
    or arguments, needed by avrdude for a USBasp, USBtinyISP, and an Arduino Uno with
    the ArduinoISP sketch loaded. These parameters are then used in section A.3.5
    that follows to set up the external programmers in Microchip Studio.


    # A.3.4.3 Parameters for a USBasp


    Parameters passed to avrdude for a USBasp are the same as the example that was
    used in the previous section, and are shown again below.


    ```

    avrdude -p t85 -c usbasp -P usb -U flash:w:"file.hex"

    ```'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'Be sure to change the part to the part that you are going to program. Use Table
    A.1 to find the correct part code. Remember that if you experience any problems
    with your USBasp, you may need to follow the -c option with usbasp-clone instead
    of usbasp.


    # A.3.4.4 Parameters for a USBtinyISP


    For a USBtinyISP, use the following parameters.


    ```

    avrdude -p t85 -c usbtiny -P usb -U flash:w:"file.hex"

    ```


    Remember to select the correct part that you are using from Table A.1 and place
    it after the -p switch.


    # A.3.4.5 Parameters for an ArduinoISP


    For an Arduino Uno loaded with the ArduinoISP sketch, use the following parameters.


    ```

    avrdude -p t85 -c avrisp -P COM3 -b 19200 -U flash:w:"file.hex"

    ```


    Change the part after the -p switch to the ATtiny being used, as per Table A.1.
    Find and specify the correct COM port after the -P switch. This can be found either
    using the Device Manager in Windows, or using the Arduino IDE.


    In the next section, the avrdude parameters that we just worked out for each programmer
    are used to set up the programmers in Microchip Studio.


    # A.3.5 Microchip Studio External Tool Setup


    Microchip Studio has an option for setting up external programming tools which
    allows avrdude to be run from within Microchip Studio. Command-line options for
    avrdude are included as part of the setup, which allows Microchip Studio to pass
    these options to avrdude when it is called. The correct program file is also automatically
    passed to avrdude so that it is loaded to the Flash program memory of the target
    AVR.


    At this stage it is assumed that you have followed each part of this appendix
    from the beginning, and have an AVR circuit built on breadboard with one of the
    supported hobby programmers correctly connected. To set up one of the hobby programmers
    as an external programming tool in Microchip Studio, complete each step in the
    subsections that follow.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# A.3.5.1 Open an Assembly or C Project


    Start Microchip Studio and open either the led_blink_asm or led_blink_c projects
    that were created in Chapter 2 in section 2.3.2 and section 2.4.2 respectively.
    If you are using one of the alternative circuits from Appendix B that has the
    LED and series resistor connected to pin PB0, then use one of the alternative
    programs from section B.5 of Appendix B.


    # A.3.5.2 Add an External Tool in Microchip Studio


    In Microchip Studio, select Tools ▶ External Tools... from the top menu. This
    opens the External Tools dialog box. If no other tools have been set up in this
    dialog box, you can start entering information into the various fields to set
    up an external tool. If one or more external tools have already been set up, you
    will need to click the Add button first. Figure A.9 follows showing the External
    Tools dialog box. Fill in the fields as follows.


    # Title: USBasp ATtiny85


    This can be any text you want. A good idea is to include the programmer name and
    target device being used, for example: USBasp ATtiny85


    # Command: C:\avrdude-6.3-mingw32\avrdude.exe


    Assuming that you installed avrdude to a folder called avrdude-6.3-mingw32 in
    the root of the C: drive, then the command field must contain the text as shown
    above. To avoid having to type this line in manually, click the button marked
    ... at the end of the Command field to open up the Open File dialog box. Use this
    dialog box no navigate to the folder containing avrdude. Once in the folder, click
    the avrdude.exe file to select it and then click the Open button in the dialog
    box.


    # Arguments: Programmer and part specific, see below.


    Programming parameters for avrdude that we looked at in section A.3.4 must be
    placed in the Arguments field. These are the command-line options that must be
    passed to avrdude. Because we have already specified the avrdude executable file
    in the Command field, we must leave it off the beginning of the avrdude parameters.


    We also need to add macros to the parameters so that the path to the hexadecimal
    file to be loaded to Flash memory is passed to avrdude. The parameters to place
    in the Arguments field are as follows for the three hobby programmers.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# USBasp


    ```

    -p t85 -c usbasp -P usb -U flash:w:"$(OutDir)Debug\$(TargetName).hex"

    ```


    # USBtinyISP


    ```

    -p t85 -c usbtiny -P usb -U flash:w:"$(OutDir)Debug\$(TargetName).hex"

    ```


    # ArduinoISP (Arduino Uno with ArduinoISP sketch loaded)


    ```

    -p t85 -c avrsp -P COM3 -b 19200 -U flash:w:"$(OutDir)Debug\$(TargetName).hex"

    ```


    The part number after the `-p` switch must be changed to the correct code for
    the ATtiny being used in each of the lines above. Refer back to Table A.1 in section
    A.3.4.2 in this appendix to find the codes for ATtiny parts. Change the ArduinoISP
    COM port to the correct number. Copy the line to the Arguments field of the External
    Tools dialog box.


    In the above lines, two macros are used: one to find the path to the hexadecimal
    file, and the other to get the name of the hexadecimal program file. The macro
    `$(OutDir)` resolves to the path to the current project. This is followed by `Debug`
    to add the Debug folder to the end of the path. The hexadecimal file is found
    in the Debug folder of a Microchip Studio project. The macro `$(TargetName)` resolves
    to the name of the current project, which is also the name of the hexadecimal
    program file. It is followed by `.hex` in the above lines, because the hexadecimal
    ends with a `.hex` file extension.


    # Initial directory: $(ProjectDir)


    Placing the $(ProjectDir) macro in this field allows Microchip Studio to automatically
    find the path to the current project folder and start avrdude from this folder.


    # Use Output window


    This field is a checkbox. Click the box so that a check mark appears in it.


    Figure A.9 shows the External Tools dialog box after it has been filled in for
    the USBasp programmer. In the figure, the part code has been changed to t45 for
    an ATtiny45, and the Title field has been changed to show that the programmer
    is set up for an ATtiny45. The Arguments field in Figure A.9 is obscured, but
    contains the following line.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '```

    -p t45 -c usbasp -P usb -U flash:w:"$(OutDir)Debug\$(TargetName).hex"

    ```


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_352_0.png)


    Figure A.9: The External Tools Dialog Box in Microchip Studio


    After filling in the fields of the External Tools dialog box, click the OK button
    to save the changes and close the dialog box. The tool, or programmer, that was
    set up using the External Tools dialog box can now be found on the top Tools menu
    in Microchip Studio, above the External Tools... item.


    # A.3.5.3 Add a Toolbar Button for the External Tool


    It is much easier to click a toolbar button to load a program to the target AVR
    than having to select the external programmer using the top Tools menu. We now
    set up a toolbar button for the external tool that we just added to Microchip
    Studio.


    In Microchip Studio, select Tools ▶ Customize... from the top menu. In the Customize
    dialog box, click the Commands tab. Now click the Toolbar radio button. In the
    drop-down list next to the Toolbar radio button, select Device and Debugger –
    this selects a toolbar'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'called Device and Debugger that we will add our programming button to. Click
    the Add Command... button. In the left pane of the Add Command dialog box, click
    Tools. In the right pane of the Add Command dialog box, scroll down to find External
    Command 1 and click it to select it. Click the OK button in the Add Command dialog
    box. The Customize dialog box should now look like Figure A.10. Click the Close
    button in the Customize dialog box. A button with the same name given to the external
    tool in the Title field of the External Tools dialog box will be seen on one of
    the toolbars in Microchip Studio – next to the part number for the currently open
    project.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_353_0.png)


    Figure A.10: Adding a Toolbar Button in the Customize Dialog Box


    In the above procedure, External Command 1 corresponds to the first external tool
    added. If additional external tools are to be added, they will correspond to External
    Command 2, and so on. In this way a button can be added for each external tool.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# A.3.6 Testing the Programmer


    After setting up a hobby programmer as an external tool in Microchip Studio, we
    are now ready to test the programmer. At this stage the programmer should be connected
    to an AVR circuit on a breadboard, as already described in this appendix. Check
    that the programmer is wired to the circuit correctly. If the programmer is to
    be used to power the circuit, make sure that 5V from the programmer is connected
    to the circuit. If the circuit is to be powered from an external power supply,
    disconnect the 5V or VCC connection from the programmer. Plug the programmer into
    a USB port of the host computer. If using an external power supply, switch it
    on.


    With the ATtiny circuit connected to the programmer and powered up, and with one
    of the LED blink projects open in Microchip Studio, make sure that the project
    is built by clicking the Build toolbar button. Click the program button that we
    set up in the previous step to load the program to the target ATtiny microcontroller.
    Alternatively, click Tools on the top menu and then click the programmer on the
    menu that opens to load the program to the target ATtiny.


    If all goes well during programming, the LED connected to the target ATtiny will
    start flashing or blinking. Output messages from avrdude appear at the bottom
    of Microchip Studio and shows success with a message that should look similar
    to the following.


    ```

    avrdude.exe: verifying ...

    avrdude.exe: 26 bytes of flash verified

    ```


    # A.3.7 Programming Problems and Solutions


    If there were problems programming the target AVR microcontroller, then first
    look at the output from avrdude that pops up at the bottom of Microchip Studio.
    Scroll through this text to try and find out what is wrong. If power was not connected,
    or the wrong part code was passed to avrdude, that can usually be found in the
    avrdude output text.


    Check for the obvious, such as if the programmer is connected to the target AVR
    correctly, and that the programmer can be found in the Device Manager in Windows.
    If a USB cable is used to connect the programmer to the host computer, then check
    if the USB cable is faulty. Some USB cables are for charging only and have power
    connected, but not data.'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'Programmers usually have a power LED that lights up when they are connected
    to a USB port – check that the LED lights up.


    Go back and check that the parameters passed to avrdude are correct and everything
    in the fields of the External Tools dialog box is correct for the programmer and
    target AVR microcontroller used.


    If the program loads to the target ATtiny, but the LED does not blink, then check
    that the LED and series resistor are wired correctly, and that the LED blink program
    code is exactly as found in this book.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Appendix B • Alternate Circuits and Programs


    This appendix contains circuits for all of the PDIP packaged ATtiny microcontrollers
    from Table 1.1 in Chapter 1. It also has connections for USB programmers that
    use ISP, the USBasp 10-pin header, and the Arduino Uno used as an ISP programmer,
    as discussed in Appendix A.


    The circuits in this appendix after Figure B.1 use alternate ATtiny PDIP microcontrollers
    to the circuit of Figure 2.1 in section 2.2 of Chapter 2. These circuits are for
    readers who want to use different ATtiny devices, and for those readers who are
    using the ISP/SPI programming interface only (not using debugWIRE) — using ATtiny
    devices with higher pin counts leaves more pins free when using ISP programming.


    When the LED in a circuit is interfaced to a different I/O pin to that of Figure
    2.1, an equivalent program to that of the led_blink_asm program from section 2.3.2
    and the led_blink_c program of section 2.4.2, both from Chapter 2, is included.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# B.1 8-Pin PDIP ATtiny13/25/45/85


    Figure B.1 is the same circuit as Figure 2.1 of Chapter 2, except the connections
    to the programmers are not drawn in as connecting wires, and it includes connections
    to the USBasp, and Arduino Uno as a programmer.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_357_0.png)


    # Figure B.1: 8-Pin ATtiny13/25/45/85 Circuit and Programmer Connections


    To make the connections to a programmer, match up the labels on the header of
    the programmer being used with the same labels on the ATtiny pins. If using a
    10-pin to 6-pin adapter with the USBasp, then wire it according to the ISP/SPI
    connection. If using a USBtinyISP programmer, use the ISP/SPI wiring.


    When using an Arduino Uno as an ISP programmer, reset from digital pin 10 must
    be used, but the other connections can be taken from the socket connector at the
    edge of the board, or from the Arduino Uno ICSP header. Don''t take reset from
    the ICSP header, which is marked with an X. Orientation of the Arduino Uno headers
    in the circuit is with the USB connector of the Arduino Uno on the left. Use the
    led_blink_asm and led_blink_c programs from Chapter 2 with this circuit.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# B.2 14-Pin PDIP ATtiny24/44/84


    Figure B.2 shows how to connect a programmer to a 14-Pin PDIP ATtiny from the
    ATtiny24/44/84 range. It includes connections to a 10-pin USBasp connector, ISP/SPI
    connector and Arduino Uno set up as an ISP programmer.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_358_0.png)


    There is no PB4 on this range of microcontrollers, so the LED is attached to PB0
    instead. This means that the led_blink_asm and led_blink_c programs from Chapter
    2 must be changed to use pin PB0 instead of pin PB4. Refer to section B.5 of this
    appendix for alternatives to the assembler and C programs that blink the LED attached
    to pin PB0.


    If using a 10-pin to 6-pin adapter with the USBasp, then wire it according to
    the ISP/SPI connection. If using a USBtinyISP programmer, use the ISP/SPI wiring.
    When using an Arduino Uno as an ISP programmer, reset from digital pin 10 must
    be used, but the other connections can be taken from the socket connector at the
    edge of the board, or from the Arduino Uno ICSP header. Don''t take reset from
    the Arduino Uno ICSP header, which is marked with an X. Orientation of the Arduino
    Uno headers in the circuit is with the USB connector of the Arduino Uno on the
    left.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# B.3 20-Pin PDIP ATtiny26/261/461/861 and ATtiny2313/4313


    The two ranges of 20-pin ATtiny microcontrollers in PDIP packages are the ATtiny26/261/461/861
    and ATtiny2313/4313. Although these two ranges are available in 20-pin PDIP packages,
    each range has a different pinout from the other.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_359_0.png)


    Figure B.3: 20-Pin ATtiny26/261/461/861 Circuit and Programmer Connections


    Figure B.3 shows an ATtiny26/261/461/861 circuit and pinout for various programmers
    set up in Appendix A. Figure B.4 shows a circuit for the ATtiny2313/4313 range
    of microcontrollers with pinouts for the programmers set up in Appendix A.


    Both circuits from Figure B.3 and Figure B.4 have the LED and series resistor
    connected to pin PB4, the same as Figure 2.1 of Chapter 2. This means that the
    led_blink_asm and led_blink_c programs from Chapter 2 can be used with both of
    these circuits.


    If using a 10-pin to 6-pin adapter with the USBasp, then wire it according to
    the ISP/SPI connection. If using a USBtinyISP programmer, use the ISP/SPI wiring.
    When using an Arduino Uno as an ISP programmer, reset from digital pin 10 must
    be used, but the other connections can be taken from the socket connector at the
    edge of the board, or from the'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'Arduino Uno ICSP header. Don''t reset from the Arduino Uno ICSP header, which
    is marked with an X. Orientation of the Arduino Uno headers in the circuit is
    with the USB connector of the Arduino Uno on the left.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_360_0.png)


    # Figure B.4: 20-Pin ATtiny2313/4313 Circuit and Programmer Connections


    # B.4 28-Pin PDIP ATtiny48/88


    Figure B.5 shows a circuit that uses the ATtiny48/88 range of 28-pin ATtiny microcontrollers
    and includes connections to the various programmers set up in Appendix A.


    The ATtiny48/88 of Figure B.5 does have a PB4 pin, but this is used as the MISO
    pin for programming. An LED and series resistor is connected to pin PB0, which
    means that the led_blink_asm and led_blink_c programs must be changed to use this
    pin instead of PB4. Use the modified programs from the next section, section B.5,
    with this circuit.


    If using a 10-pin to 6-pin adapter with the USBasp, then wire it according to
    the ISP/SPI connection. If using a USBtinyISP programmer, use the ISP/SPI wiring.
    When using an Arduino Uno as an ISP programmer, reset from digital pin 10 must
    be used, but the other'
