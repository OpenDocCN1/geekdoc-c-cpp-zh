- pgno: 49
  md: '# 2.3.6 Fault Finding


    If the program does not load, check for the obvious, such as the programmer not
    plugged in, or if the power supply is not on. Also check the wiring of the programmer
    ISP header to the microcontroller. If the LED does not start blinking, but the
    program loaded successfully, then there could be an error in the program that
    does not trigger an error message when the program is built. In this case check
    each line of the program against the code listing to make sure that everything
    is correct. Check that the LED and series resistor are wired correctly. If there
    is still a problem, copy and paste the code from the accompanying files into your
    project as there may be an error that you have not located. Rebuild the project
    and load the program to the microcontroller again.


    # 2.4 A First C Program


    As this book includes C programming in addition to assembly language programming,
    a C program is created in this section that blinks or flashes an LED on and off.
    The objective of this exercise is to show readers how to create a C project for
    ATtiny microcontrollers in Microchip Studio. For those readers who have not learned
    the C programming language yet, it is still possible to follow these steps and
    create a C program without the need to know the C programming language. As explained
    in the introduction, this book does not teach the C programming language, but
    can be used by anyone to learn AVR assembly language and the architecture of AVR
    microcontrollers. Readers wishing to learn the C programming language on microcontrollers
    may enjoy the book C Programming with Arduino by the same author and published
    by Elektor – ISBN: 978-1-907920-46-2. The subsections that follow show how to
    start a new C project in Microchip Studio, write code to blink the LED of Figure
    2.1, build the C project and load the program to an ATtiny device. Use the same
    circuit of Figure 2.1, with the programmer connected the same way, or the same
    alternate circuit from Appendix B.


    # 2.4.1 Start a New GCC C Executable Project in Microchip Studio


    Open Microchip Studio and start a new project in the same way that was used in
    section 2.3.1 for the assembler project. This opens the New Project dialog box.
    Because the previous project created was an assembler project, Assembler is still
    selected in the left pane of the dialog box. It is necessary to first click the
    C/C++ item in the left pane of the dialog box. In the middle pane of the dialog
