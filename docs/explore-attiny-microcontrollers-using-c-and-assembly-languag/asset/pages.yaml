    # 9.3.2.3 DW – Define Constant Word


    DW, or define constant word, is like DB, or define constant byte, except that
    it reserves 16-bit spaces in either Flash program memory or EEPROM, rather than
    8-bit spaces.


    # 9.3.2.4 DD – Define Constant Double-word


    DD, or define constant double word reserves 32-bit data spaces in program memory
    or EEPROM.


    # 9.3.2.5 DQ – Define Constant Quad-word


    DQ, or define constant quad-word, reserves one or more 64-bit space in program
    memory or EEPROM.'
