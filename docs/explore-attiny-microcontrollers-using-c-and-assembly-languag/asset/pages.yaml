    The second OUT instruction writes the value in R18 to the TIFR register. The value
    in R18

    is (1 << OCF0A) which was written to R18 before entering the main loop. This writes
    a

    value of 1 to bit OCF0A which is necessary to clear this bit, as specified in
    the datasheet.


    Finally the RJMP instruction at the bottom of the loop executes, causing program

    execution to start at the top of the loop again. This causes the code to poll
    the OCF0A flag

    in the TIFR register again to test for the next timer timeout. Note that the SBRS
    instruction

    that tests if the OCF0A flag is set is the counterpart to the SBRC instruction
    that we used

    before. The difference is that the SBRC instruction tests if a bit in a register
