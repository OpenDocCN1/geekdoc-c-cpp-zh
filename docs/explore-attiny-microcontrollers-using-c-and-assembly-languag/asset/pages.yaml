    \ true (2)\n dec  r16          ; 1 clock cycle\n brbc SREG_Z, delloop1 ; 1 or\
    \ 2 clock cycles, if false (1), if true (2)\n ret             ; 4 clock cycles\n\
    ```\n```\n\nTwo methods of calculating the total number of clock cycles for this\
    \ delay subroutine are 1) debug the code with the simulator selected in Microchip\
    \ Studio and use the cycle counter to find the number of clock cycles used by\
    \ the code, and 2) work out a mathematical formula to calculate the number of\
    \ clock cycles the code uses. Once the number of clock cycles for the code is\
    \ known, the time delay that it generates can be calculated by multiplying the\
    \ number of clock cycles by the clock period, as we have already seen in some\
