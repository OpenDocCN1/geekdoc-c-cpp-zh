- pgno: 48
  md: '# 2.3.4 Fix Any Build Errors


    If any errors occurred when building, a red circle with an X inside it appears
    in the bottom pane of Microchip Studio with a description of the error. If a build
    error does occur in your program, double-click the red circle to move the cursor
    to the position in the assembler file that contains the error. Check the line
    of code against the led_blink_asm code listing to find the error. Any problem
    with this program can only be a typing error. Make sure that your code is exactly
    the same as the code listing. All source code for this book is available for download
    from Elektor. If there are still problems, download the code and compare with
    your code, or copy and paste the source code to main.asm, save and build again.


    # 2.3.5 Load the Program to the AVR Microcontroller


    At this stage, it is assumed that the programmer, such as the Atmel-ICE being
    used is connected to the AVR microcontroller as already described in this chapter
    and that the microcontroller circuit is powered from 5V. It is also assumed that
    the microcontroller is new and therefore has the internal fuses set to factory
    default values. Those readers who are using a USB hobby programmer must follow
    the instructions in Appendix A now. These instructions show how to set up and
    program the target AVR microcontroller using a hobby programmer. Hobby programmer
    users can then continue at section 2.3.6.


    To load the program that has just been built in Microchip Studio to the AVR chip
    using a USB programmer that is directly supported in Microchip Studio, such as
    the Atmel-ICE, AVR Dragon, or AVRISP mkII, first select the programming tool that
    you are using. In Microchip Studio, click the hammer icon named “None on” or “No
    tool” on the second horizontal toolbar, or select Project ▶ led_blink_asm Properties…
    from the top menu (keyboard shortcut Alt + F7) and then Tool in the left column
    of the page that opens. Click the box under Selected debugger/programmer and then
    click the tool that you are using in the list that opens — the tool must be plugged
    into the USB port for it to appear in the list. Under Interface:, select ISP for
    a new ATtiny13 or ATtiny25/45/85 device which use the ISP setting as the default.
    Save the changes using the keyboard shortcut Ctrl + S.


    Switch power to the ATtiny circuit on. Click the “Start Without Debugging” icon
    (the top green triangle icon) on the top toolbar in Microchip Studio to load the
    program to the microcontroller. Alternatively use the keyboard shortcut Ctrl +
    Alt + F5 or Debug ▶ Start Without Debugging from the top menu. If the program
    loads successfully, the LED will start blinking.'
