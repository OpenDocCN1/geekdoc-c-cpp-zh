- pgno: 118
  md: 'As with the LED blink program led_blink.asm from section 2.3.2 in Chapter 2,
    the delay subroutine is found below the main code and starts with the label delay:.
    This delay subroutine is much simpler than the delay subroutine from the LED blink
    program. The code should look familiar as it is the same code used to demonstrate
    the use of the zero flag in the status register, only it has been packaged into
    a subroutine in this example with a few extra lines of code.


    A subroutine starts with a label which is a name followed by a colon. A subroutine
    ends with the RET (Return from Subroutine) instruction. RCALL (Relative Call to
    Subroutine) is used to call or execute a subroutine from anywhere in the main
    program, or from another subroutine. A subroutine is a block of functional code
    that can be called any number of times. The code of a subroutine only has to be
    written once in a program, but can be called and executed multiple times. This
    saves program memory and is also convenient because certain tasks or functions
    that need to be repeated can be put into a subroutine, and called when needed.
    Program instructions that occur after a subroutine call in a program need to be
    executed when the subroutine returns. For this reason the address of the instruction
    that follows a subroutine call is pushed onto the stack automatically. This return
    address is automatically popped from the stack when the subroutine returns. The
    subroutine itself can be anywhere in program memory.


    Calling the subroutine with the RCALL instruction loads the address of the subroutine
    to the program counter so that the code of the subroutine starts to run after
    the RCALL instruction has executed. When stepping through the example project
    in the debugger and simulator in Microchip Studio, we will see the pushing and
    popping of the return address during the subroutine happening automatically.


    Before continuing, bring the end of the stack into view using the Memory window
    at the bottom right of Microchip Studio, so that we can see the stack being used.
    To do this, select data IRAM in the Memory: box of the Memory window. Use the
    small double arrow at the right of the memory window to pop out the selection
    box if necessary, and change the Columns: item to 1. Refer back to Figure 6.10
    if needed. Scroll down so that address 0x015F is in view in the memory window
    for the ATtiny45.


    In Microchip Studio, step over the first line of code in the program. Note that
    the Program Counter value in the Processor Status window is now 1, which is the
    address that the RCALL instruction is at – the first instruction, LDI, is at address
    0. This means that the'
