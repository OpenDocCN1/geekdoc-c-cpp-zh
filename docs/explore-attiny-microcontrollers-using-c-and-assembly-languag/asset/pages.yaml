    \ the same as the first, but this time 12 decimal is loaded to register R17, as\
    \ shown below. Step over this instruction in Microchip Studio and note that the\
    \ value changes in the Processor Status window next to the R17 item.\n\n```\n\
    ldi r17, 12\n```\n\nThe third instruction, shown below, is ADD (Add without Carry),\
    \ which adds the value in R16 to the value in R17 and stores the result back in\
    \ R16.\n\n```\nadd r16, r17\n```\n\nStep over the ADD instruction and the result\
    \ of adding 34 to 12 is seen in R16, that is 46 appears in register R16. The format\
    \ of the ADD instruction is similar to the shorthand C notation R16 += R17, where\
    \ R17 is added to R16 and the result saved back into R16. This can be written\
    \ out in full as R16 = R16 + R17. We will never use C in this way to directly\
    \ access these registers by name. C notation is used here just to explain what\
    \ the assembly language instruction is doing.\n\nThe last instruction in the code\
    \ listing creates an infinite loop to stop the microcontroller from trying to\
    \ run instructions beyond the end of the program. This code is shown below.\n\n\
    ```\nloop:\n    rjmp loop\n```\n\nRJMP (Relative Jump) is used to jump to the\
    \ loop label, which causes the RJMP instruction to run again infinitely. Without\
    \ the infinite loop at the end of the program, the microcontroller will automatically\
    \ fetch and execute the next instruction in memory after our program. The next\
    \ instruction is undefined and will be whatever happens to be in memory after\
    \ our program. This can result in undefined and unwanted behavior of the microcontroller.\
    \ For this reason, a program that does not have a main loop, should always end\
    \ with an infinite loop."
