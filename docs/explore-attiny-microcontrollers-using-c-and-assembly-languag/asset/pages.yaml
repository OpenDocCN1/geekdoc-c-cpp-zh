- pgno: 242
  md: 'The main.asm code has been set to use a value of 20MHz for F_CPU and the maximum
    value for MS_TIME_DEL is set to the maximum value that we calculated as 2,147,483.
    When these values are used, we expect the .if directive in the wait_ms.asm file
