  md: 'When the final instruction is stepped over (LDS), the value stored in SRAM
    at address 0x60 now appears in register R1 as can be seen in the Processor Status
    window. This very simple program has introduced the STS (Store Direct to Data
    Space) instruction for copying data from a register to an SRAM location in data
    space. It has also introduced the LDS (Load Direct from Data Space) instruction
    for loading a value from a byte of SRAM in data space to a register. These two
    32-bit instructions use up two 16-bit wide program memory locations each.


    # 5.4.3 SRAM Start Addresses


    In the previous example, we accessed the first location in SRAM of an ATtiny45
    using the simulator. The address of this first location in SRAM is 0x60, and is
    the same for all of the microcontrollers in Table 1.1 of section 1.3 in Chapter
    1, except for the ATtiny48/88 devices. If an ATtiny48 or ATtiny88 were to be used
    with the previous example, it would need to be modified as shown in the following
    listing.


    ```

    test_asm : main.asm - SRAM direct store and load

    ldi   r16, 0xAA    ; Data to store to SRAM

    sts   0x100, r16   ; Store data from register to SRAM

    lds   r1, 0x100    ; Load data from SRAM to register

    ```


    In the above code, it can be seen that the first location in SRAM is changed to
    0x100 for ATtiny48/88 devices. These devices have the general purpose register
    file from 0x0000 to 0x001F, and the I/O register file from 0x0020 to 0x005F, just
    like the other devices from Table 1.1. After the I/O register file, ATtiny48/88
    devices have an extended I/O register file from 0x0060 to 0x0OFF. This is followed
    by SRAM, starting at address 0x0100.


    Microchip Studio assembly language projects each include a file that has definitions
    for the selected AVR microcontroller. One of these definitions is for the start
    address of SRAM, and is called SRAM_START. This definition can be used in order
    to make programs work across different AVR devices with different memory maps
    because it is defined with the correct SRAM start address for the selected AVR
    part. The previous code looks as follows when using the definition. This code
    now works across all the devices from Table 1.1 and writes to the correct address
    of the first location in SRAM.


    ```

    test_asm : main.asm - SRAM direct store and load

    ldi   r16, 0xAA    ; Data to store to SRAM

    sts   SRAM_START, r16 ; Store data from register to SRAM

    ```'
