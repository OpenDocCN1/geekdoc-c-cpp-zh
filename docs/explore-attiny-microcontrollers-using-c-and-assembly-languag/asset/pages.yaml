- pgno: 338
  md: '# A.3.1.2 USBtinyISP Driver


    The USBtinyISP is based on the USBtiny software implementation of the USB low-speed
    protocol. The USBtinyISP was developed by Adafruit where the documentation and
    more information on the programmer can be found at learn.adafruit.com/usbtinyisp
    Adafruit provide all the information for anyone to build their own USBtinyISP
    programmer, and also supply a kit of parts to make building the programmer easier.
    There are variations of the USBtinyISP available, like the one shown at the left
    of Figure A.1 at the beginning of this chapter.


    A link to the Adafruit driver for the USBtinyISP can be found on the USBtinyISP
    drivers page at learn.adafruit.com/usbtinysp/drivers Clicking the Download Adafruit
    Driver Installer button on this page opens up a page on GitHub. A link to the
    executable driver installer can be found on the GitHub page. At the time of writing
    the installer was version 2.5.0.0 and the executable file was named adafruit_drivers_2.5.0.0.exe
    Click the link to download this file.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_338_0.png)


    Figure A.5: Microsoft Defender SmartScreen Dialog Box


    After downloading the Adafruit drivers executable file, navigate to it using the
    Windows File Explorer and double-click the file to run it. Because the driver
    installer and drivers are'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'no longer signed, Windows will pop up a Microsoft Defender SmartScreen dialog
