- pgno: 149
  md: '# 8.1 Instructions for Accessing I/O Registers


    Several instructions from the AVR instruction set can be used to access (read
    and write) the 64 I/O registers. Instructions such as IN and OUT can be used to
    read and write between registers R0 to R31 and any of the 64 I/O registers. Because
    the I/O registers are mapped into data space, they can also be accessed by instructions
    such as LDS (Load Direct from Data Space) and STS (Store Direct to Data Space).
    Instructions for setting and clearing bits, and for testing the state of bits
    are also available.


    # 8.1.1 Reading and Writing I/O Registers with IN and OUT


    The IN instruction is used to read a value from an I/O register and the OUT instruction
    is used to write a value to an I/O register.


    # 8.1.1.1 The IN Instruction


    The IN (Load An I/O Location to Register) instruction is used to read an I/O register
    and place its contents into register R0 to R31. For example, to read the PINB
    I/O register into R16, the following code can be used.


    ```

    in r16, 0x16

    ```


    Refer to the Register Summary section of the ATtiny13(A) or ATtiny25/45/85 data
    sheet to find the PINB register and its address at 0x16. Fortunately Microchip
    Studio assembly language projects automatically include a file that has definitions
    for the I/O registers. This means that the registers can be accessed by using
    their names rather than their addresses in assembly language programs. The above
    line of code can be written as follows using the register name instead of its
    address.


    ```

    in r16, PINB

    ```


    To access the file that contains register definitions, open a project in Microchip
    Studio, such as the test_asm project that we have been using to test code snippets.
    In Microchip Studio, expand Dependencies in the Solution Explorer pane at the
    top right of Microchip Studio by clicking the small triangle at the left of it.
    The triangle will only be visible if the project has been successfully built.
    Double-click the file under Dependencies that ends with a .inc extension. For
    example, if an ATtiny45 is selected in a project, the name of the file is tn45def.inc
    as shown in Figure 8.1. After opening the definition file, scroll through it to
    see all of the registers and other definitions. Some of the register definitions
    can be seen in Figure 8.1, including the definition for the PINB register at address
    0x16.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/83ef13a6c66cc7882b2f357e97f451dc_150_0.png)


    Figure 8.1: Opening a Definition File in a Microchip Studio Project


    # 8.1.1.2 The OUT Instruction


    OUT (Store Register to I/O Location) writes data to an I/O register from register
    R0 to R31. To write a value to an I/O location using the OUT instruction, a value
    must first be loaded to a working register (R0 to R31) and then the register written
    to the I/O register using OUT. To load a constant value to an I/O register, the
    value first needs to be loaded to a register using the LDI instruction. Remember
    that the LDI instruction only operates on registers R16 to R31. The following
    code shows how to write a constant value to an I/O register using OUT.


    ```

    ldi r16, 0x1A

    out DDRB, r16

    ```


    In the above code, the constant value 0x1A is loaded to R16. The contents of R16,
    which is now 0x1A, is written to the DDRB register using the OUT instruction.
    As can be seen in Figure 8.1, DDRB is defined as 0x17. Once again, using the name
    DDRB makes the code easier to read, rather than directly using the address of
    DDRB which is 0x17.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 8.1.2 I/O Register Bit Manipulation and Testing


    Two instructions can set and clear bits directly in I/O registers, but can only
    operate on registers at addresses 0x00 to 0x1F (0 to 31). These instructions are
    SBI (Set Bit in I/O Register) and CBI (Clear Bit in I/O Register). Both of these
    instructions were used in the LED blink program at the beginning of this book
    to set and clear a bit in the PORTB I/O register. By setting and clearing a bit
    in this register, the LED connected to the corresponding pin was switched on and
    off. The following code is from the LED blink program and sets and clears bit
    PORTB4, which is bit 4 in the PORTB register, using the SBI and CBI instructions.


    ```

    sbi    PORTB, PORTB4

    rcall  delay

    cbi    PORTB, PORTB4

    rcall  delay

    ```


    Once again, the register and bit definitions used in the above code can be found
    in the definition file, such as tn45def.inc. As an example, the first line of
    code in the above snippet uses PORTB which has an address of 0x18, and bit definition
    PORTB4, which has a value of 4 in the .inc file. The first line of code could
    therefore be written as follows.


    ```

    sbi    0x18, 4

    ```


    Two instructions are available for testing the state of a bit in a register. These
    instructions only operate on I/O registers at addresses 0x00 to 0x1F (0 to 31).
    SBIS (Skip if Bit in I/O Register is Set) tests a bit in an I/O register and skips
    the next instruction if the bit is set. SBIC (Skip if Bit in I/O Register is Cleared)
    tests a bit in an I/O register and skips the next instruction if the bit is cleared.
    These instructions can be used to make decisions in a program, depending on the
    state of a particular bit. We will use these instructions later in this chapter
    to read the state of a switch connected to one of the microcontroller pins.


    # 8.1.3 Accessing I/O Registers as Data Space


    Three “Load” instructions are available for loading data from any I/O register
    to the register file R0 to R31 by using their addresses in data space. These instructions
    are LD, LDS and LLD which can be used to read any of the I/O registers. In fact
    these instructions can read from any address in the data space including the register
    file (R0 to R31), I/O registers and SRAM, ST, STS and STD are “Store” instructions
    used to store a byte from register R0 to R31 to any address in data space which
    includes the register file (R0 to R31), I/O registers and SRAM.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'When using the above load and store instructions, it is necessary to add 0x20
    to the address of the I/O register being accessed. Refer back to the AVR memory
    map in Chapter 5, Figure 5.3 in section 5.3 and notice that the 64 I/O registers
    in the data memory space start at address 0x0020. Now refer to the same registers
    in the Register Summary of the ATtiny13(A) or ATtiny25/45/85 datasheet and notice
    that these same registers start at address 0x00 (0x00 is found at the bottom of
    the Register Summary table). When used with IN and OUT, these I/O registers use
    addresses starting at 0x00. Because these registers are also mapped into data
    memory space, they must be accessed using the data memory addresses when using
    load and store instructions which start at address 0x0020. This is the reason
    that 0x20 must be added to these addresses. We can assume that inside the AVR
    there are separate control lines that are activated depending on the instruction
    being executed. When IN or OUT are executed, the I/O registers are accessed at
    0x00 to 0x3F. When load and store instructions are executed, different control
    lines allow I/O registers to be accessed in the data memory space. Datasheets
    for some of the ATtiny parts include the two different addresses of I/O registers
    in the Register Summary section, with the addresses starting at 0x0020 in brackets.
    An I/O register addresses in the 0x00 to 0x3F range is known as a short address
    or direct I/O address. For the entire data memory space with I/O registers starting
    at 0x0020 in this space, an address is referred to as a long address or data address.


    In the register summary in the datasheet, the registers are shown with address
    0x00 at the bottom and addresses increasing in size from bottom to top, while
    in the memory map the I/O registers start at address 0x0020 and addresses increase
    from top to bottom. It does not make any difference whether the addresses are
    illustrated going from top to bottom or bottom to top, only the actual address
    of a register matters.


    # 8.2 I/O Ports


    I/O ports control the pins of an AVR microcontroller and allow the pins to be
    individually configured as input pins or output pins. I/O ports are controlled
    and controlled using a set of four registers in the ATtiny13(A) and ATtiny25/45/85.
    When a pin is configured as an input pin, a program running on the AVR can read
    the logic level on the pin. If a switch is attached to the pin, the logic level
    on the pin can be read to see if the switch is open or closed. When a pin is configured
    as an output pin, it can be used to switch the logic level of the pin high (to
    logic level 1) or low (to logic level 0). An output pin can be used to drive an
    LED as was done in the LED blink project.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# # 8.2.1 Configuring I/O Pins as Outputs in Assembler


    In this section we look at how to configure more than one pin as an output using
    an 8-pin ATtiny with five LEDs attached to pins with series resistors. Code is
    used to configure the LEDs as a 5-bit binary counter that counts up from zero.


    # ## 8.2.1.1 Five LED 8-pin ATtiny Circuit


    Figure 8.2 shows a circuit diagram of an ATtiny13(A) or ATtiny25/45/85 AVR microcontroller
    with five LEDs attached to I/O pins PB0 to PB4.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_153_0.png)


    Figure 8.2: Five LED Counter Circuit Diagram


    # ## 8.2.1.2 Using debugWIRE or ISP/SPI to Program an ATtiny AVR


    Pin PB5 of the ATtiny microcontroller in the circuit of Figure 8.2 is used as
    the debugWIRE pin for programming and debugging the microcontroller. Remember
    that to use this configuration a programmer/debugger, such as an Atmel-ICE, or
    AVR Dragon must be used.


    A program-only USB programmer will not work in debugWIRE mode, and can not perform
    debugging. Reminder: Do not set the DWEN fuse with a program-only USB programmer
    because it will not be able to take the AVR back out of debugWIRE mode. The idea
    of using debugWIRE mode with this example circuit is to free up the other pins
    of the AVR that are normally used in ISP/SPI programming mode.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Program-only Programmers


    USB programmers with program-only capabilities can be used with the circuit of
    Figure 8.2 to load the example program that follows, and see the count value displayed
    on the LEDs. Refer to Appendix B, Figure B.1 for connecting a USBasp, USBtinyISP
    or Arduino Uno as an ArduinoISP programmer to the circuit, and then wire the LEDs
    as shown in Figure 8.2 and Figure 8.3. The original USBasp design and the original
    USBtinyISP design both have protection resistors on the lines that drive out from
    these programmers, protecting the programmer, and the target AVR chip. The Arduino
    Uno programmed as an ArduinoISP does not have any protection resistors, but these
    can be added on the Arduino Uno MOSI line and SCK line which drive into the target
    AVR. 270Ω protection resistors are used in the original USBasp design, and are
    placed on the MOSI, SCK and RESET lines. 1K5 resistors are used on the MOSI and
    RESET lines of the original USBtinyISP design. Protection resistors prevent a
    short, should one of the target AVR pins drive an output voltage at the same time
    that the programmer drives an output voltage of opposite polarity.


    # Peripheral Hardware Devices Interfering with Programming


    Although the circuit of Figure 8.2 can be programmed using the ISP/SPI interface
    with the LEDs and series resistors attached, other circuits may have hardware
    attached that interferes with programming. If any peripheral hardware attached
    to pins of an AVR to be programmed will interfere with programming the AVR, there
    are some solutions to this problem. Of course, those readers who have a debugWIRE
    capable USB programmer/debugger, such as the Atmel-ICE, can simply put the target
    AVR into debugWIRE mode, and thereby use only one pin for programming. Another
    solution, is to program the AVR on another breadboard using ISP/SPI, and then
    plug it into the target circuit afterwards.


    Alternatively, an AVR with more pins can be used, but the free port pins don''t
    always match the same pins from the same port of an 8-pin PDIP ATtiny. For example,
    if using port pins PB0 to PB4 like the circuit of Figure 8.2 does, there are not
    five consecutive free pins available on the 14-pin ATtiny24/44/84 range of AVRs,
    because the ISP/SPI pins use up pins from both port A and port B. On the 20-pin
    ATtiny261/461/861 range, the whole of port A is free with an ISP/SPI programmer
    connected, but this means that the software needs to be changed to use port A
    instead of port B. The 20-pin ATtiny2313/4313 range does have pins PB0 to PB4
    free with an ISP/SPI programmer connected. Refer to the circuits in Appendix B
    to see which pins are free on the various PDIP ATtiny microcontrollers when an
    ISP/SPI programmer is connected.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Putting the AVR into debugWIRE Mode


    In order for the microcontroller to be programmed using a single debugWIRE line
    as shown in Figure 8.2, it is necessary to first connect all of the ISP header
    lines to the microcontroller from the USB programmer/debugger and then set the
    DWEN fuse of the AVR to put it into debugWIRE mode. If you have been following
    this book in order, then your AVR will be in debugWIRE mode. If not, attach your
    programmer/debugger, such as an Atmel-ICE or AVR Dragon, to the AVR as shown in
    Figure 2.1 to Figure 2.3 of Chapter 2. Follow the instructions of section 3.6.2
    in Chapter 3 to set the DWEN fuse. Once DWEN fuse is programmed, all of the ISP
    header connections can be removed from the circuit except RESET, +5V (Vcc) and
    GND as Figure 8.2 shows.


    # 8.2.1.3 Build the 5 LED ATtiny Circuit on Breadboard


    If you have the hardware, then build the circuit of Figure 8.2 on an electronic
    breadboard. Make sure that the five LEDs are connected in a row on the breadboard
    with pins PB0 to PB4 connected in order starting at PB0 on the right. LED D1 will
    be on the right of the row and D5 on the left. In other words we want a single
    row of LEDs with PB0 connected to the LED on the right, PB1 connected to the LED
    next to it on the left, PB2 connected to the LED third from the right, and so
    on, as can be seen in the breadboard layout of Figure 8.3. The figure shows just
    the outlines of the LEDs so that they do not block the view of the wire connections
    and resistors. If you do not have the hardware, then follow the programs using
    the simulator as we have been doing in the previous chapters.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_155_0.png)


    Figure 8.3: Five LED Count Circuit Breadboard Layout'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 8.2.1.4 Assembly Code for the 5 LED Count Circuit


    Start a new Microchip Studio AVR Assembler Project called led_count.asm. Refer
    back to section 2.3.1 of Chapter 2 if you need a reminder on how to start a new
    assembly language project in Microchip Studio. Type the code that follows in the
    led_count.asm listing into main.asm of the project, replacing the skeleton code
    of this file.


    ```

    led_count_asm : main.asm

    ; Set up pins PB0 to PB4 as output pins

    ldi r16, 0b0001_1111

    out DDRB, r16

    clr r18 ; Clear count register

    loop:

    out PORTB, r18 ; Display count on LEDs

    rcall delay

    inc r18 ; Increment count

    andi r18, 0b0001_1111 ; Clear unused bits

    rjmp loop

    ; Delay subroutine

    delay:

    ldi r16, 0xff

    delloop1:

    ldi r17, 0xff

    delloop2:

    dec r17

    brbc SREG_Z, delloop2

    dec r16

    brbc SREG_Z, delloop1

    ret

    ```


    # 8.2.1.5 Select the Debugger or Simulator


    If you are using the hardware of Figure 8.2, then select the hardware tool (your
    debugger), such as the Atmel-ICE, in Microchip Studio with debugWIRE as the interface
    by clicking the hammer icon on the second top toolbar. If you are using the simulator,
    select Simulator as the tool instead. If using a hobby programmer read on to be
    prompted to load the program to the target ATtiny.


    # 8.2.1.6 What the LED Count Assembler Code Does


    The led_count_asm program configures pins PB0 to PB4 as output pins so that the
    LEDs attached to these pins can be driven on and off by the program. The program
    displays an incrementing binary number, or count, on the LEDs starting at 0 (represented
    by all LEDs off). When the count reaches its maximum value (all LEDs on) it wraps
    around to zero and'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'starts counting up again. This count value is the same as the binary count
    in Table 4.1 of section 4.1.1 from Chapter 4, except that the circuit displays
    a 5-bit count instead of a 4-bit count shown in the table. Each off LED represents
    a binary zero digit or logic 0 level, and each on LED represents a binary one
    digit, or logic 1 level. It is important to lay out the LEDs as shown in Figure
    8.3 so that the count displays correctly with PB0/D1 as the LSB and PB4/D5 as
    the MSB of the count value.


    # 8.2.1.7 Build and Run the Program


    Build the program and load it to the AVR If you are using the physical hardware
    of Figure 8.2 and Figure 8.3. If using an Atmel-ICE or AVR Dragon, use the Start
    Without Debugging icon on the top toolbar of Microchip Studio or keyboard shortcut
    Ctrl + Alt + F5 to load the program to the AVR. If the debugger interface is set
    up correctly and the chip is in debugWIRE mode, the program will load and start
    running. The incrementing binary count will be seen on the LEDs. If using a program-only
    USB programmer such as a hobby programmer, then load the program to the target
    AVR using the button that you set up in Appendix A. If the program was typed correctly,
    the circuit wired correctly, and the program was saved and built after typing
    it in, you will see the binary count value counting up on the LEDs, and you can
    use the simulator with the rest of the text that follows.


    If you don''t have the physical hardware, you can still see the count value by
    using the simulator in Microchip Studio. The program can be stepped through by
    using the Start Debugging and Break icon as we have been doing in previous simulator
    examples. With the simulator started, open the I/O window from the top menu using
    Debug ▶ Windows ▶ I/O, and then click on the I/O Port (PORTB) item. Refer back
    to section 3.6.1 and Figure 3.3 of Chapter 3 if you need a reminder on how to
    use the simulator and I/O window. Step over the program using the Step Over icon
    or F10 keyboard key. Look at the PORTB item at the bottom of the I/O window to
    see the count value that would be displayed on the LEDs if they were attached.
    The count is updated in PORTB each time that the OUT instruction is stepped over
    in the main loop.


    # 8.2.1.8 How the LED Count Assembler Program Works


    Half of the led_count_asm program code consists of the same delay subroutine that
    was used in the LED blink program from section 2.3.2 of Chapter 2. This subroutine
    is called once in the main loop of the program so that the count on the LEDs is
    visible to the eye without flashing past too fast. Have the led_count_asm project
    open in Microchip Studio, with the code from main.asm open while following the
    explanation of the code that follows.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'This makes it easy to see the code while turning pages in this book. The first
    two instructions of the program are used to set pins PB0 to PB4 as output pins
    to drive the LEDs by setting bits in the DDRB register. Figure 8.4 shows the DDRB
    register at the top of the figure. Each bit in this register corresponds to a
    pin on the microcontroller, for example bit DDB0 corresponds to pin PB0, DDB1
    corresponds to pin PB1, and so on. When a bit in DDRB is set to logic 1, the corresponding
    pin becomes an output pin. If a bit in DDRB is cleared to logic 0, the corresponding
    pin becomes an input pin which is the default of all pins at power-up or reset.
    At the top of the program, ob00001_1111 is first written to register R16, and
    then written from R16 to the DDRB register using the OUT instruction. It is necessary
    to first load the constant value to R16 because there is no instruction to directly
    write a constant value to an I/O register such as DDRB. Writing ob00001_1111 to
    DDRB sets bits DDB0 to DDB4 making pins PB0 to PB4 output pins.


    ```

    DDRB : Port B Data Direction Register. Configures pin direction: 0 = 1, Output.

    Address: 0x17 Initial Value: 0b0000_0000 Bits 5 to 0: Read/Write (R/W)


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|

    | - | - | DDB5 | DDB4 | DDB3 | DDB2 | DDB1 | DDB0 |

    ```


    ```

    PORTB : Port B Data Register. Drives output pins. Enables input pin pull-ups with
    logic 1.

    Address: 0x18 Initial Value: 0b0000_0000 Bits 5 to 0: Read/Write (R/W)


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|

    | - | - | PORTB5 | PORTB4 | PORTB3 | PORTB2 | PORTB1 | PORTB0 |

    ```


    ```

    PINB : Port B Input Pins Register. Read input pin state. Write logic 1 to toggle
    output pin.

    Address: 0x16 Initial Value: Depends on level on pin. Bits 5 to 0: Read/Write
    (R/W)


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|

    | - | - | PINB5 | PINB4 | PINB3 | PINB2 | PINB1 | PINB0 |

    ```


    # Figure 8.4: ATtiny13(A) and ATtiny25/45/85 I/O Port Registers


    Although there are four registers for controlling I/O port B, only three are shown
    in Figure 8.4. The fourth register, MCUCR has only one bit that applies to port
    B. This bit is a global pull-up disable bit that we do not use in this chapter.
    Refer to the Register Description part of the datasheet in the I/O Ports section
    to see this register – use either the datasheet for the ATtiny13, ATtiny13A, or
    ATtiny25/45/85.


    R16 is used in the program to hold an incrementing count value that is displayed
    on the LEDs. R16 is cleared to 0 using CLR before the main loop so that the count
    starts from 0. In the main loop, the contents of R18 are sent to the PORTB register
    using the OUT instruction. The PORTB register can be seen in the middle of Figure
    8.4. Again, each bit in this register corresponds to a pin on the microcontroller.
    For pins that were set up as'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'output pins using DDRB, the logic levels written to the PORTB register appear
    on these pins. For pins that are set up as input pins, a logic 1 in PORTB enables
    an internal pull-up resistor on these pins. A logic 0 disables the pull-up resistor
    on the corresponding pin. Because pins PBO to PB4 are set up as output pins, the
    count value written to PORTB appears on these pins as logic levels that switch
    the LEDs on and off. A logic 1 in the count value switches the corresponding LED
    on, and a logic 0 level in the count value switches the corresponding LED off.


    After the count value is written to PORTB using the OUT instruction, the delay
    subroutine is called to leave the count value on the LEDs for a while. Register
    R18 is then incremented by one using the INC instruction so that the count value
    that it is holding increments. ANDI is used to clear the top three bits of the
    count value in R18, by using a mask value of 0b0001_1111. This ensures that these
    top bits are always zero. Back at the top of the loop when R18 is written to PORTB
    again, zero is always written to the top three bits, because they were cleared
    using ANDI. When the end of the loop is reached at the RJMP instruction, program
    execution starts at the top of the loop again, with the new count value written
    to PORTB, and displayed on the LEDs.


    Some things to note about this program: When compared to the LED blink program
    from Chapter 2, I/O registers DDRB and PORTB are both used to set up and control
    port B of the microcontroller in both programs. The LED blink program only needs
    to control a single pin, so uses the SBI and CBI instructions to set and clear
    a single bit in the I/O registers directly – none of the working registers R0
    to R31 are needed for this. The LED count program needs to access 5 LEDs or pins
    at the same time so uses the OUT instruction to write to multiple bits in a register
    at the same time.


    Register usage is important to keep track of in an assembly language program.
    For example, an immediate value is loaded to R16 at the beginning of the program.
    R16 is only used temporarily in this instance, so can be used later in the program
    without the need to first save its value. It is used again in the delay subroutine.
    Because R16 and R17 are used in the delay subroutine, R18 was chosen to hold the
    count value and is not used for anything else. This ensures that the count value
    is never overwritten. If a program gets very big and there are no spare registers
    to use for dedicated purposes, then PUSH and POP instructions can be used at the
    start and end of a subroutine to preserve the values in registers that are used.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 8.2.1.9 Using a Breakpoint in the Debugger


    With the simulator, or the physical hardware and a hardware debugger such as the
    Atmel-ICE, use the debugger to step through the program by clicking Start Debugging
    and Break as we have done before. View the I/O port registers by opening the I/O
    window in Microchip Studio. With the debugger running, select Debug > Windows
    > I/O and then click I/O Port (PORTB) in the I/O window.


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_160_0.png)


    When program execution enters the main loop it is convenient to place a breakpoint
    on the RJMP instruction and execute the entire loop by clicking the Continue toolbar
    button (grey key key F5). A breakpoint can be placed on the RJMP instruction by
    clicking the gray area at the very left of the instruction and on the Microchip
    Studio window. This places a red dot in this area indicating that a breakpoint
    has been set on the instruction, as can be seen on Figure 8.5. Alternatively,
    click the instruction that you want to place a breakpoint on so that the cursor
    is placed on it, and then select Debug > Toggle Breakpoint from the top menu,
    or use the F9 keyboard key. Once the breakpoint is set, use the Continue toolbar
    button or press F5 to step though the entire loop and only break at the bottom.
    In this way the count can be seen incrementing by 1 in both PORTB in the I/O window,
    and register R18 in the Processor Status window, without having to individually
    step over each instruction in the loop.'
  merge: -1
  img_proc: true
- pgno: 161
  md: "Remove the breakpoint from the RJMP instruction by clicking the red dot at\
    \ the left of the instruction, or use the menu or F9 to toggle the breakpoint\
    \ off, assuming that the cursor is on the RJMP instruction line. Put a breakpoint\
    \ on the INC R18 instruction. Now use F5 to step through the loop. The new breakpoint\
    \ ensures that the PORTB register and R18 contain the same value when program\
    \ execution stops. If program execution stops on RJMP, then R18 is incremented\
    \ before writing its new value to PORTB, thus they are unsynchronized when observing\
    \ these values in the debugger windows in Microchip Studio.\n\n# 8.2.2 Configuring\
    \ I/O Pins as Outputs in C\n\nWe now create a C code equivalent program to the\
    \ led_count_asm project and look at the assembly language that it produces. The\
    \ code is very simple and uses a delay library function instead of a custom delay\
    \ function, just as the LED blink C project from Chapter 2 uses.\n\n# 8.2.2.1\
    \ LED Count C Code\n\nIn Microchip Studio, start a new GCC C Executable Project\
    \ called led_count.c. Refer back to section 2.4.1 in Chapter 2 if you need a reminder\
    \ on how to start a new C project. Replace the skeleton code in main.c of the\
    \ new project with the following code.\n\n```\nled_count.c : main.c\n//define\
    \ F_CPU 10000000UL // 1MHz default clock for ATtiny25/45/85\n#define F_CPU 1200000UL\
    \ // 1.2MHz default clock for ATtiny13(A)\n#include <avr/io.h>\n#include <util/delay.h>\n\
    \nint main(void)\n{\n    uint8_t count = 0; // Clear count\n\n    // Set up pins\
    \ PB0 to PB4 as output pins\n    DDRB = 0b00011111;\n\n    while (1)\n    {\n\
    \        PORTB = count; // Display count on LEDs\n        _delay_ms(1000);\n \
