- pgno: 267
  md: 'the add8bit subroutine in the form of RCALL PC-0x8009. This subroutine is located
    at the top of the listing at address 00000018. RCALL simply calls the subroutine
    which then performs the addition of R24 and R22, putting the result in R24. We
    know that R24 is one of the registers that holds the return value, and as this
    is a single byte or char return value, the other register (R25) is ignored. When
    the subroutine returns, execution continues at address 00000022. At this stage,
    R24 contains the result of the addition which is 0x7D, or 125. The next instruction
    which is STD Y+1,R24 assigns the return value found in R24 to the sum variable
    which is in SRAM. STD is a store indirect with displacement instruction that stores
    a register to an SRAM location, but using the Y register as an index or pointer
    into SRAM. The Y register currently contains a value of 0x015A on an ATtiny45,
    but the STD instruction specifies Y+1, so the value in R24 is saved to 0x015A+1
    which is SRAM address 0x015B. Thus the result of the addition, 0x7D, is now found
    at address 0x015B of SRAM, which is the sum variable.


    # 10.4 Polled Timer Delay


    Both ATtiny13(A) and ATtiny25/45/85 microcontrollers have an 8-bit timer/counter
    0. These timer/counter peripherals are highly configurable for many purposes.
    In this section we look at how to use these timers to generate a simple time delay,
    with a view to using them to generate an interrupt in the next section. For now
    a timer is set up to start timing, and code is used to continually check whether
    the timer has timed out. This continual checking of the timer in code is called
    polling the timer.


    ATtiny25/45/85 microcontrollers actually have two 8-bit timer/counter modules
    or units, namely, Timer/Counter0 and Timer/Counter1. Because ATtiny13(A) microcontrollers
    have only Timer/Counter0, we use this timer/counter as it is common between the
    two 8-pin microcontroller ranges.


    # 10.4.1 Timer/Counter0 Registers


    I/O registers for controlling timer and counter modules all fall in the address
    range above 0x1F (31) which means that direct bit manipulation instructions SBI
    and CBI can''t be used on these registers. Instructions for directly testing the
    states of bits in I/O registers, namely SBIS and SBIC, also only operate on addresses
    0x00 to 0x1F, so can''t be used with timer/counter registers. This means that
    to be able to use any register of a timer/counter, the register must first be
    read into a general purpose register R0 to R31. Figure 10.6 shows the registers
    used to control Timer/Counter0.'
  merge: -1
  img_proc: true
- pgno: 268
