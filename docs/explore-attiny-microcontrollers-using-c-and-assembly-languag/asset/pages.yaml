- pgno: 277
  md: '# 10.5.1 How Interrupts Work


    AVR microcontrollers all have a number of interrupt sources, such as a timer compare
    match, external interrupt, timer/counter overflow, and others. Each interrupt
    source has its own enable bit found in one of the interrupt source peripheral
    registers. For example, the Timer/Counter0 peripheral has a timer/counter interrupt
    mask register called TIMSK that has interrupt enable bits for the timer overflow
    and compare matches. To enable one of the compare match interrupts, the corresponding
    bit in TIMSK is set. In addition to enabling an individual interrupt, the global
    interrupt enable bit in the status register must be set in order for any individual
    interrupt to be able to work.


    When an interrupt does occur, for example there is a timer compare match, the
    global interrupt enable bit is automatically cleared, disabling interrupts. The
    interrupt service routine for the particular interrupt is then called. An interrupt
    service routine is just like a subroutine, except that to return from it the RETI
    (Return from Interrupt) instruction must be used instead of the RET instruction.
    When the RETI instruction is executed at the end of an ISR, the return address
    is loaded from the stack and the global interrupt enable bit is set, enabling
    interrupts again.


    # 10.5.2 The Interrupt Vector Table


    An interrupt vector table allows the correct interrupt service routine, or ISR,
    to be called when an interrupt occurs. For example, the ISR that was written for
    a particular timer compare match must be called when the compare match interrupt
    occurs.


    Interrupts are assigned to jump to fixed program memory address locations starting
    at address 0, when they occur. The interrupt vector table is placed at these fixed
    program memory locations and consists of jump instructions to jump to the correct
    ISR code. Interrupt vector tables can be found in section or chapter 9 of the
    datasheet for ATtiny13(A) and ATtiny25/45/85 devices.


    The interrupt vector tables for the ATtiny13(A) and ATtiny25/45/85 are different,
    so two different code examples follow in the next sub-section. Two examples are
    included for learning purposes as this makes the code easier to read and understand.
    Having two separate projects for the two different interrupt vector tables shows
    what the interrupt vector tables consist of and how they differ. A third project
    shows how to write the same code so that it can be used on both the ATtiny13(A)
    and ATtiny25/45/85 ranges.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 10.5.3 Assembly Program Timer Interrupt


    Two assembly language programs that toggle an LED on pin PB4 using an interrupt
    follow. The first program is for an ATtiny13(A) and the second is for a ATtiny25/45/85.


    # 10.5.3.1 ATtiny13(A) Timer Interrupt Project


    Create a new AVR assembly language program called timer0_interrupt13.asm in Microchip
    Studio for the ATtiny13 or ATtiny13A and add the following code to main.asm.


    ```

    timer0_interrupt13.asm : main.asm


    .org 0

    rjmp    main            ; 0 - Reset vector

    rjmp    ISR_unused      ; 1 - External interrupt 0 vector

    rjmp    ISR_unused      ; 2 - Pin change interrupt 0 vector

    rjmp    ISR_unused      ; 3 - Timer 0 overflow interrupt vector

    rjmp    ISR_unused      ; 4 - EEPRROM ready interrupt vector

    rjmp    ISR_unused      ; 5 - Analog comparator interrupt vector

    rjmp    ISR_tim0_compA  ; 6 - Timer 0 compare match A interrupt vector

    rjmp    ISR_unused      ; 7 - Timer 0 compare match B interrupt vector

    rjmp    ISR_unused      ; 8 - Watchdog timer timeout interrupt vector

    rjmp    ISR_unused      ; 9 - ADC conversion complete interrupt vector


    main:

    sbi     DDRB, DDB4      ; Pin PB4 as output pin

    ldi     r16, ( 1 << WGM01)  ; CTC mode for timer

    out     TCCR0A, r16

    ldi     r16, 0x7F       ; Output compare value

    out     OCR0A, r16

    ldi     r16, ( 1 << OCIE0A) ; Enable T0A compare match interrupt

    out     TIMSK0, r16

    sei                   ; Set global interrupt enable bit

    ldi     r16, ( 1 << CS02) | ( 1 << CS00) ; Prescaler CLK/1024 and start timer

    out     TCCR0B, r16


    loop:

    rjmp    loop


    ; Timer 0 compare match A interrupt service routine or handler

    ISR_tim0_compA:

    sbi     PINB, PINB4     ; Toggle LED

    reti


    ; Dummy interrupt handler to catch all unused interrupts

    ISR_unused:

    nop

    rjmp    ISR_unused

    ```'
  merge: -1
  img_proc: true
