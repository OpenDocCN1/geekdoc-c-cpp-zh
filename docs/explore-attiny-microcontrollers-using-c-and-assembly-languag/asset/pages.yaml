- pgno: 171
  md: '```

    led_count_limit.asm : main.asm


    ; Set up pins PB0 to PB4 as output pins

    ldi r16, 0b0001_1111

    out DDRB, r16

    clr r0 ; Count register


    loop:

    out PORTB, r0 ; Display count on LEDs

    rcall delay

    inc r0 ; Increment count

    sbrc r0, 5 ; Reset count if R0 = 0x20

    clr r0

    rjmp loop


    ; Delay subroutine

    delay:

    ldi r16, 0xff

    delloop1:

    ldi r17, 0xff

    delloop2:

    dec r17

    brbc SREG_Z, delloop2

    dec r16

    brbc SREG_Z, delloop1

    ret

    ```


    The entire program in the above listing works the same way as the led_count.asm
    program, except for use of the SBRC instruction and the CLR instruction that follows
    it, as shown below.


    ```

    sbrc r0, 5

    clr r0 ; Reset count if R0 = 0x20

    ```


    These instructions limit the value that is written to the LEDs to 0x1F or 0b0001_1111.

    SBRC means Skip if Bit in Register is Cleared. In the above code, SBRC checks
    if bit 5 in register R0 is skipped, and if it is, skips over the next instruction
    (the CLR instruction that follows it). Bit 5 is always clear up to and including
    when the count value in R0 reaches 0b0001_1111. When R0 contains this value and
    the next increment occurs, the value becomes 0b0010_0000, or 0x20, which means
    that bit 5 in this value is now set for the first time. Remember that bit numbering
    starts at 0 at the right most bit, so bit number 5 is the 6th bit from the right
    of the number. Now that bit 5 is set in R0, when the SBRC instruction is next
    run, the CLR instruction below it is no longer skipped over, but is run. This
    instruction clears R0 before it is written to the LEDs, or PORTB register, so
    0b0010_0000 is never written to PORTB, but rather 0b0000_0000 instead.'
  merge: -1
  img_proc: true
