    # 10.6 Summary


    This chapter has been rather long, but has covered a lot of important and interesting
    information to do with instruction timing, timers and interrupts. The following
    list summarizes what we have covered.


    +   - 8-bit AVR microcontrollers have different CPU versions with the ATtiny13(A)
    and ATtiny25/45/85 CPU version being the AVRe.

    +   - Instruction timing may be different for the same instruction, depending
    on the AVR CPU version. Refer to the AVR Instruction Set Manual for the actual
    instruction execution time in clock cycles.

    +   - A software time delay can be accurately generated by writing a subroutine
    that uses an exact number of clock cycles.

    +   - Assembly language programs can be split into more than one file by including
    external files in a main file.

    +   - Assembly language subroutines can be called from within C code.

    +   - Hardware timers on AVR microcontroller can be polled or interrupt driven.

    +   - Each different AVR microcontroller has its own interrupt vector table that
    depends on how many interrupt sources the device has built into it.

    +   - An interrupt service routine or ISR is a type of subroutine written to handle
    an interrupt. The RETI instruction must be used to return from an ISR.'
