    as the flag was set, the BRBC instruction did not cause a branch, but rather caused
    the instruction below BRBC to be executed.


    # ## 6.5.2 Negative Flag


    A simple subtraction operation that results in a negative number will cause the
    N flag, or Negative Flag to be set in the Status register. Stop the debugger and
