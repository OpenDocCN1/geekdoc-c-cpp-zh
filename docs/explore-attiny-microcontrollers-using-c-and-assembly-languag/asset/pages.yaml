- pgno: 183
  md: "# 9.1 Instructions and Labels\n\nA line of assembly language code has the following\
    \ basic format:\n\n```\n[label:] instruction [operands] [comment]\n```\n\nAt a\
    \ minimum, a line of assembly language consists of a single instruction. An instruction\
    \ may require one or more operands, depending on which instruction it is. A label\
    \ and comment are optional.\n\nA label represents the address of an instruction\
    \ or the address of the data that follows it. Labels can be written to the left\
    \ of instructions or above them as shown in the following example code.\n\n```\n\
    loop: rjmp loop ; Infinite loop\n```\n\nThe following code does exactly the same\
    \ thing as the above code, the position of the label makes no difference.\n\n\
    ```\nloop:\n    rjmp loop ; Infinite loop\n```\n\nEach line of assembly language\
    \ is divided into columns separated by tab characters or spaces. Labels appear\
    \ at the very left, followed by an instruction mnemonic. If there are operands,\
    \ they appear in the next column, followed by an optional comment.\n\nThere is\
    \ a limit of 120 characters per line of code for the AVRASM2 assembler program.\
    \ We have already seen that comments start with a semicolon, but C and C++ style\
    \ comments can also be used – refer back to section 3.4 of Chapter 3 for a reminder.\n\
    \nLabels can consist of any alphanumeric characters, that is A to Z, a to z and\
    \ 0 to 9. The underscore can also be used in label names (_). Labels may not start\
    \ with a number (0 to 9), but must start with an alphabetic letter or an underscore."
  merge: -1
  img_proc: true
- pgno: 184
  md: '# ## 9.2 The Preprocessor and Include Files


    A preprocessor can be a separate program, or a process performed by a software
    tool such as a compiler or assembler before the main compilation or assembly.
    The preprocessor performs tasks such as including code and data from other files,
    substituting values in place of text, and macro expansion.


    The AVRASM2 AVR assembler program supports C-like preprocessor directives that
    start with the hash (#) symbol, as well as assembler directives that start with
    a period or dot (.). For example, to include an external file in an assembly language
    program, the following can be used.


    ```

    ```

    #include <tn25def.inc>

    ```

    ```


    With the above line of code, the preprocessor does not search for the file to
    include in the current directory but expects the file to be in the path, indicated
    by angle brackets. The variation below using "" causes a search for the file in
    the current directory first. Both of these include preprocessor directives work
    in the same way as they do in a C program.


    ```

    ```

    #include "tn25def.inc"

    ```

    ```


    In assembly notation, there are also two forms of the include directive. With
    the first, shown below, the assembler program does not search the current directory
    for the file to include, but expects it to be in the path.


    ```

    ```

    .include <tn25def.inc>

    ```

    ```


    With the following directive the assembler program does search the current directory
    for the file to include.


    ```

    ```

    .include "tn25def.inc"

    ```

    ```


    When including a file with the include directive, the contents of the included
    file are effectively substituted into the file that contains the include directive.'
  merge: -1
  img_proc: true
