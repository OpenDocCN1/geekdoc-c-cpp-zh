- pgno: 323
  md: '# 12.1 AVR Assembler Programs


    This section takes a look at assembler programs for 8-bit AVR microcontrollers
    and their settings, starting with the AVRASM2 assembler program that is the default
    assembler used when creating an AVR assembly language program in Microchip Studio.


    # 12.1.1 The AVRASM2 Assembler


    Chapter 9 looked at the AVRASM2 assembler program from the point of view of its
    features used when writing programs, such as assembler directives, the preprocessor
    and expressions. This section looks at the AVRASM2 command line options and output
    during the build process.


    # 12.1.1.1 Building a Project with AVRASM2


    When an AVR assembly language program is built in Microchip Studio, the AVRASM2
    command line program is invoked by Microchip Studio and passed various options
    or parameters. These parameters can be seen in the Output pane that opens at the
    bottom of Microchip Studio during the build process. The actual call to AVRASM2
    with the various options passed to it is a long line, shown below as it appears
    in the Output pane, but with the program name and command line option switches
    highlighted in bold.


    ```

    C:\Program Files\Atmel\Studio\7.0\toolchain\avr8\avrasm2\avrasm2.exe

    -fi -o "test_asm.hex" = "test_asm.map" -l "test_asm.lss" -S "test_asm.tmp"

    -w+Ie -I"C:/Program Files\Atmel\Studio\7.0\Packs\atmel\ATtiny_DFP\1.8.332\avrasm\inc"

    avrasm\inc" -lfn5def.inc -d "C:\Users\user\Documents\AVR_test_code\test_asm\test_asm\Debug\test_asm.obj"

    -C "C:\Users\user\Documents\AVR_test_code\test_asm\test_asm\main.asm"

    -I "C:\Program Files\Atmel\Studio\7.0\toolchain\avr8\avrasm2\include"

    avrasm2\include"

    ```


    The various command line options or switches and their meanings can be found in
    the AVR Assembler document from Microchip. The options from above can be included
    below with descriptions. The above line is from the test_asm project built for
    an ATtiny85.


    avrasm2.exe : The name of the AVRASM2 executable program. In the above listing
    it is preceded by the full path to its location on the host computer. Options
    are passed to this program by placing the options, each starting with a dash,
    after avrasm2.exe.


    -fi -o "test_asm.hex" : Specifies the output file format as Intel Hex, and the
    output file name as test_asm.hex. This file in Intel Hex format is what is used
    to program the target AVR device as it contains a representation of the machine
    code of the program.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '-m "test_asm.map" : Generate a map file called test_asm.map. The map file contains
    all of the names with their assigned values from the included .inc file, as well
    as definitions from the assembly language files of a project, such as label names
    and addresses.


    -l "test_asm.lss" : Generate a list file called test_asm.lss. The list file contains
    the entire assembly language program, with the contents of any include files.
    Code from the program is included with the address of each instruction and the
    machine code that each instruction converted to in hexadecimal format. After the
    code, a section in the list file shows a summary of resources used by the program,
    such as registers used, instructions used, and memory used.


    -S "test_asm.tmp" : Generate a include/label info file called test_asm.tmp. This
    is an XML file that contains assembler information, such as the AVR device used,
    paths to the working directory, include files, source code and other files of
    the project, as well as labels used in the project. Most of the items from this
    file are represented in the Solution Explorer pane of Microchip Studio when the
    project is successfully built.


    -W : If an instruction is used that is not supported by the chosen AVR device,
    then generate an error.


    -I : Add a directory to the include file search path. The first use of the -I
    switch in the listing on the previous page includes the path to the .inc files
    for AVR microcontrollers.


    -itn85def.inc : The lowercase -i switch is used in place of #include or .include
    to include the tn85def.inc file for the ATtiny85 in this example. This is why
    none of the Microchip Studio assembly language projects needed to have the definition
    files included at the top of the source code files.


    -d : Generate a debug info file. In the listing on the previous page, the -d option
    is followed by the path to the debug file with a name specified as test_asm.obj.
    This file is used for debugging a program in Microchip Studio.


    -I : Add a directory to the include file search path. This option was previously
    used, and is used here again which is perfectly acceptable. It seems that this
    second included directory does not exist, as the Include directory at the end
    of the path from the listing is not found in the avrassembler directory, as specified
    at this second -I option in the listing.'
  merge: -1
  img_proc: true
