- pgno: 88
  md: "Now step over the first instruction, using the F10 keyboard key, which moves\
    \ 34 into R16 and note that this value is now displayed in R16 in the Processor\
    \ Status window. If you did not change the value to display in decimal, the value\
    \ will be displayed as 0x22. The number system that the value is displayed in\
