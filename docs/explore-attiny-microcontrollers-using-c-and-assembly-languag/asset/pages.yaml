- pgno: 130
  md: '# 6.9.2 I/O Direct Addressing


    I/O direct addressing moves data between a register and I/O location. Both the
    register address and I/O register address are encoded in the instruction, making
    it a direct addressing instruction. Figure 6.18 shows a diagram of I/O Direct
    addressing from the AVR Instruction Set Manual. An example of I/O direct addressing
    is the OUT instruction as shown in Figure 6.19.


    # 3.3 I/O Direct


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_130_0.png)


    Figure 6.18: I/O Direct Addressing from the AVR Manual


    | 1011 | 1AAr | rrrr | AAAA |

    |---|---|---|---|

    | 1011 | 1011 | 0000 | 0110 |


    Figure 6.19: Encoding of the OUT Instruction with Example


    So far we have only used the OUT instruction in examples that initialize the stack
    pointer. In the example in Figure 6.19, OUT is used to move the contents of R16
    to the PINB register. The PINB register is one of the 64 I/O registers mapped
    in data memory space and is one of the registers used to control the I/O pins
    of the AVR. In the line of code shown in Figure 6.19, PINB resolves to the address
    0x16 (not to be confused with register R16 used in this example). To see the addresses
    of I/O registers, refer to the Register'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Summary section of the datasheet for the ATtiny part being used. In the *Register
    Summary* section of the ATtiny25/45/85 datasheet, it can be seen that there are
    64 I/O registers from 0x00 at the bottom of the table to 0x3F at the top of the
    table. Find address 0x16 in the table and note that it has the name PINB shown
    in the next column of the table.


    Again, the values in the instruction are interleaved. Below the instruction encoding
    blocks in Figure 6.19 are the values for the I/O location address and source register
    after they have been extracted from the instruction and assembled as consecutive
    bits. The I/O location address has 6 bits represented by 6 ''A'' characters. From
    this we can deduce that it can address 2^6 = 64 locations from 0 to 63, or 0x00
    to 0x3F in hexadecimal. In other words it can be used to address the 64 I/O registers
    mapped in data memory. There are 5 bits in the instruction in the figure that
    are labeled ''r'' that represent the registers from the register file. We now
    know that 2^5 = 32, therefore 32 registers from the register file can be addressed
    by this instruction – in other words all of the registers from R0 to R31.


    # 6.9.3 Other Addressing Modes


    Refer to the *AVR Instruction Set Manual* for other addressing modes. The other
    addressing modes will be better understood as we look at more instructions throughout
    the book. Indirect addressing modes do not have the address of the target register
    or memory location encoded in the instruction, but rather rely on the target address
    to be loaded to a register or registers before calling the indirect addressing
    instruction.


    # 6.10 Summary


    +   - Clock pulses drive the internal circuitry of a microcontroller and cause
    it to fetch and execute instructions.

    +   - It is easy to calculate the period of a clock pulse if given the frequency,
    or calculate the frequency of a clock pulse if given the period.

    +   - The program counter (PC) continually increments, addressing each consecutive
    instruction in program memory until a jump or branch instruction is executed which
    loads the PC with a new address.

    +   - Microcontrollers have an address bus for addressing program and data memory,
    a data bus for moving data between the microcontroller and memory or I/O'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'devices, and a control bus with control lines such as chip select and read
    and write lines.


    +   - AVR microcontrollers have a Harvard architecture with separate buses for
    program memory and data memory to enhance performance.

    +   - The basic function of a microcontroller core is to fetch and execute instructions
    from program memory.

    +   - The status register of a microcontroller contains information on the result
    of the most recent arithmetic operation.

    +   - A stack is used to store temporary data, preserve register values and store
    the return address of subroutines and interrupt handlers.

    +   - The stack is set up by loading a RAM address to the stack pointer register.

    +   - Microcontroller machine language instructions are encoded in binary format.
    Encoding details can be found in the instruction set manual.

    +   - Addressing modes refer to how an instruction addresses registers or memory
    locations.


    This has been a fairly long chapter that has covered many details about the internal
    architecture of AVR microcontrollers. Concepts included in this chapter may be
    new to many readers and the volume of information may be a bit overwhelming at
    this stage. If you have had trouble understanding everything in this chapter,
    or it has just been too much information in one go, then either go over the chapter
    again, or come back to it again later. Remember that if you have never studied
    the internal workings of any microcontroller or microprocessor before, and this
    is the first time looking at this kind of material, it will take time to get to
    understand and remember everything. There is nothing wrong with going over this
    book two or three times until you understand everything properly.


    In the next chapter we look at arithmetic instructions including how positive
    and negative numbers are stored in memory. Logic instructions are also covered
    that are essential when manipulating bits in registers which can be used to control
    internal and external hardware on the microcontroller. This prepares us for many
    of the chapters that follow that set up and use hardware in the AVR, such as I/O
    ports and timers.'
