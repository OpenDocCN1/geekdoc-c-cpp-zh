- pgno: 273
  md: 'WGM01 and clearing all other bits. This also clears WGM00, which in any case
    also defaulted to 0. In fact all of the other bits in this register have a default
    value of 0, so in this case we don''t need to do a read-modify-write. Because
    WGM01 is set and WGM00 is cleared, and WGM02 is already cleared or 0 in TCCR0B,
    Timer0 is now in CTC mode, but has not yet been started.


    ```

    ldi   r16, 0x7F

    out   OCR0A, r16    ; Output compare value

    ```


    The value written to OCR0A plus 1 is the number of timer clock cycles that will
    elapse before the timer flags a compare match. 1 must be added because the timer
    takes an extra clock cycles to transition from the number that it counts up to,
    back to 0 when it is automatically reset.


    In the next two lines of code, bits CS00 and CS02 are set, while bit CS01 is cleared.
    This selects the clock for the timer as the system clock divided by 1024. Selecting
    this clock also starts the timer.


    ```

    ldi   r16, (1 << CS02) | (1 << CS00) ; Prescaler CLK/1024 and start timer

    out   TCCR0B, r16

    ```


    A value is written to TCCR0B, overwriting all bits in the register again. In this
    case, the two bits that are set using the left shift operator are effectively
    joined together using the bitwise OR operator. (1 << CS02) evaluates to (1 <<
    2) which results in a binary value of 0b0000_0100 because CS02 is equated to 2
    in the header file. This causes 1 to be left shifted by 2. In the case of (1 <<
    CS00), CS00 is equated to 0. The result is that we have (1 << 0) which means ''left
    shift 1 by 0 bit positions'', resulting in 0b0000_0001. When these two values
    are ORed together using the bitwise OR operator |, the following results:


    ```

    0b0000_0100

    OR  0b0000_0001

    =   0b0000_0101

    ```


    When the resulting value of 0b0000_0101 is written to TCCR0B, it sets CS00 (bit
    0) and CS02 (bit 2), while clearing all other bits, selecting the clock source
    of Timer0 as the system clock divided by 1024 through the prescaler.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Before entering the infinite loop of the program, a value is written to R18,
    as shown below.


    ```

    ldi r18, (1 << OCF0A) ; For clearing OCF0A flag

    ```


    This value sets bit OCF0A in R18, which is later written to the TIFR register
    to clear this flag after each timer compare match. The reason that this works
    on both ATtiny25/45/85 and ATtiny13(A) microcontrollers despite the fact that
    this bit is found at different locations in the TIFR register is because the name
    OCF0A is used in the above code. This name is defined correctly for the chosen
    microcontroller in the .inc include file of the Microchip Studio project. In the
    ATtiny13 include file called tn13def.inc, OCF0A is defined as follows.


    ```

    .equ OCF0A = 2 ; Timer/Counter0 Output Compare Flag 0A

    ```


    In the ATtiny45 include file called tn45def.inc, OCF0A is defined as follows.


    ```

    .equ OCF0A = 4 ; Timer/Counter0 Output Compare Flag 0A

    ```


    # 10.4.2.5 Polling Timer 0


    Finally we get to the main loop of the program, shown below.


    ```

    loop:

    in r16, TIFR ; Read the TIFR register

    sbrs r16, OCF0A ; Skip next instruction if timeout

    rjmp loop ; Loop if not timed out

    out PINB, r17 ; Toggle LED

    out TIFR, r18 ; Clear OCF0A flag

    rjmp loop

    ```


    At the start of the main loop, the value from the TIFR register is read into R16
    for the purpose of checking the OCF0A flag in this register. SBRS (Skip if Bit
    in Register is Set) checks to see if the OCF0A bit is set. This bit is only set
    if the timer has timed out, in other words there was a compare match between the
    TCNT0 register and the OCR0A register. If the timer has not timed out, then OCF0A
    is not set and SBRS does not skip the next instruction. The next instruction is
    an RJMP instruction that jumps back to the top of the main loop. This means that
    the TIFR register is read again and the OCF0A bit checked again.


    When the timer does time out, it sets OCF0A. SBRS now detects that OCF0A is set
    and it skips the next instruction which is the RJMP instruction. The next instruction
    that is executed is therefore the OUT instruction below the RJMP instruction.
    This instruction writes R17 to the PINB register, which causes the LED on pin
    PB4 to toggle. This is'
