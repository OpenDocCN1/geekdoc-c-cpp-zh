    # Number Size Limits in the Assembler Program


    With the previous explanation, and in an ideal world, the mechanism used to flag
    an error in the code for out of limits values appears to be intuitive and solid.
    In the real world values are subject to limits, and therefore it is important
    to thoroughly test all real code using values that exceed basic test values that
    we have thus far used. Further testing of the previous code reveals that when
    certain values are assigned to MS_TIME_DEL, the error message at the .if directive
    does not trigger when it should. For example giving WAIT_MS_CYCLES a value of
    3221225, causes the error message to trigger as expected. Assigning 3221226 to
    WAIT_MS_CYCLES, which is 1 greater than the previous value, results in the error
    message not being triggered when the code is built. It turns out that the cause
    of this problem is due to integer size limits in the AVRASM2 assembler program.
    There is more than one limit that causes the above described problem. Firstly
    the exp2() function does not work properly if passed a value of 32. We expect
    exp2(32), which is 2^32, to result in 0x100000000, but it results in 1 instead,
    as the following code proves.


    ```

    .if (1 == exp2(32))

    .warning "Numbers are equal: 1 == exp2(32)."

    .endif

    ```


    Adding the above code into the source code of the project causes the warning message
    to be generated when the project is built, proving that exp2(32) evaluates to
    1. The =='
