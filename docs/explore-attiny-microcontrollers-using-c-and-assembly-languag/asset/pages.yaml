- pgno: 311
  md: '# Set or Clear Sign Flag – SREG S Bit


    # SES (Set Sign Flag)


    Sets the S flag in the status register. Equivalent to BSET SREG_S.


    # CLS (Clear Sign Flag)


    Clears the S flag in the status register. Equivalent to BCLR SREG_S.


    # Set or Clear Two''s Compliment Overflow Flag – SREG V Bit


    # SEV (Set Overflow Flag)


    Sets the V flag in the status register. Equivalent to BSET SREG_V.


    # CLV (Clear Overflow Flag)


    Clears the V flag in the status register. Equivalent to BCLR SREG_V.


    # Set or Clear T Bit in SREG – SREG T Bit


    # SET (Set T Bit)


    Sets the T flag in the status register. Equivalent to BSET SREG_T.


    # CLT (Clear T Bit)


    Clears the T flag in the status register. Equivalent to BCLR SREG_T.


    # Set and Clear Half Carry Flag – SREG H bit


    # SEH (Set Half Carry Flag)


    Sets the H flag in the status register. Equivalent to BSET SREG_H.


    # CLH (Clear Half Carry Flag)


    Clears the H flag in the status register. Equivalent to BCLR SREG_H.


    # 11.2.4 Data Transfer Instructions


    # 11.2.4.1 Move/Copy Instructions


    # MOV (Copy Register)


    MOV has the form MOV Rd, Rr where Rd is the destination register that the contents
    of the source register Rr are copied to. Rd and Rr can be any of the registers
    from R0 to R31. MOV was first used in the wait_1s_asm project from section 10.2.2
    in Chapter 10 to copy a register so that its contents would not be overwritten.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# MOVW (Copy Register Word)


    MOVW copies one register pair to another register pair. Register pairs are not
    just the named registers X, Y and Z. All registers from R0 to R31 can be used
    as pairs. The following code demonstrates the use of register pairs, and the notation
    used.


    ```

    ldi    r17, 0x12

    ldi    r16, 0x34

    movw   r1:r0, r17:r16  ; Copy register pair r17:r16 to r1:r0

    movw   r3:r2, r17:r16  ; Copy register pair r17:r16 to r3:r2

    ...

    ...

    movw   r29:r28, r17:r16 ; Copy register pair r17:r16 to r29:r28

    movw   r31:r30, r17:r16 ; Copy register pair r17:r16 to r31:r30

    ```


    # 11.2.4.2 Load Immediate Instruction


    # LDI (Load Immediate)


    LDI is an instruction that has been used many times throughout the book so requires
    no further explanation. Remember that LDI only operates on registers R16 to R31.
    The reason why this is so is explained in section 6.8 of Chapter 6 where the encoding
    of the LDI instruction is shown.


    # 11.2.4.3 Load Indirect Instructions


    Load indirect (LD) instructions load a value from data space to a register R0
    to R31, using either register X, Y or Z as an address pointer into the data space.
    This means that LD instructions have three different variants because of the three
    different named register pairs X, Y and Z. Within each of these three variants
    are three possibilities: 1) the named register pair simply points to the address
    in data space, 2) the named register pair points to the address in data space
    and is incremented after the load operation (post-increment), and 3) the address
    in the named register pair is decremented before executing the load operation
    (pre-decrement). Each of the three LD instruction variants for each of the three
    named register pairs X, Y and Z are listed below.


    # LD (Load Indirect from Data Space to Register using X)


    +   - LD Rd, X     X points to the address in data space to load from

    +   - LD Rd, X+    X points to data space address and is post-incremented

    +   - LD Rd, -X    X points to data space address and is pre-decremented'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# LD (Load Indirect from Data Space to Register using Y)


    +   LD Rd, Y   Y points to the address in data space to load from

    +   LD Rd, Y+   Y points to data space address and is post-incremented

    +   LD Rd, -Y   Y points to data space address and is pre-decremented


    The LLD instruction that uses the Y register is included with the above LD instructions
    in the AVR Instruction Set Manual. LDD is treated separately in this chapter and
    follows the ST instructions from the next subsection.


    # LD (Load Indirect From Data Space to Register using Z)


    +   LD Rd, Z   Z points to the address in data space to load from

    +   LD Rd, Z+   Z points to data space address and is post-incremented

    +   LD Rd, -Z   Z points to data space address and is pre-decremented


    The LDD instruction that uses the Z register is included with the above LD instructions
    in the AVR Instruction Set Manual. LDD is treated separately in this chapter and
    follows the ST instructions from the next subsection.


    # 11.2.4.4 Store Indirect Instructions


    Store indirect (ST) instructions are the counterparts to the LD instructions.
    Whereas LD instructions load or copy data pointed to by a named register pair
    to register R0 to R31, ST instructions store or copy data from a register to data
    space using a named register pair as a pointer to the address in data space. These
    instructions have the same variants as the LD versions and are listed below.


    # ST (Store Indirect From Register to Data Space using Index X)


    +   ST X, Rr   X points to the address in data space to store to

    +   ST X+, Rr   X points to data space address and is post-incremented

    +   ST - X, Rr   X points to data space address and is pre-decremented


    # ST (Store Indirect From Register to Data Space using Index Z)


    +   ST Y, Rr   Y points to the address in data space to store to

    +   ST Y+, Rr   Y points to data space address and is post-incremented

    +   ST - Y, Rr   Y points to data space address and is pre-decremented


    The STD instruction that uses the Y register is included with the above ST instructions
    in the AVR Instruction Set Manual. STD is treated separately in this chapter and
    follows the LDD instructions from the next subsection.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# ST (Store Indirect From Register to Data Space using Index Z)


    +   ST Z, Rr    Z points to the address in data space to store to

    +   ST Z+, Rr   Z points to data space address and is post-incremented

    +   ST -Z, Rr   Z points to data space address and is pre-decremented


    The STD instruction that uses the Z register is included with the above ST instructions
    in the AVR Instruction Set Manual. STD is treated separately in this chapter and
    follows the LDD instructions from the next subsection.


    # 11.2.4.5 Load Indirect with Displacement


    The two variants of the LDD instruction load data from data space to a register
    R0 to R31 by using the address in either the Y register or the Z register plus
    a displacement value that can be between 0 an 63. The two variants are listed
    below, where q is the displacement value that gets added to the address in either
    the Y or Z register.


    +   LDD

    +   LDD Rd,Y+q

    +   LDD Rd,Z+q


    # 11.2.4.6 Store Indirect with Displacement


    STD instructions are the counterparts to the LDD instructions that store data
    to a location in data space from a register R0 to R31. The register value is stored
    to the address that either the Y or Z register is pointing to plus the q displacement
    value. As with the LDD instruction, q can be in the range 0 to 63.


    +   STD

    +   STD Y+q, Rr

    +   STD Z+q, Rr


    # 11.2.4.7 Load Direct from SRAM


    # LDS (Load Direct from Data Space)


    LDS has the form LDS Rd,k and loads the contents of data space at address k to
    the destination register Rd. k can be between 0 and 65535, while Rd can be R0
    to R31. LDS is demonstrated in section 5.4.1 of Chapter 5.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# 11.2.4.8 Store Direct to SRAM


    STS (Store Direct to Data Space)

    STS has the form STS k, rr and stores a value from a register to data space address
    k. k can be between 0 and 65535, while Rd can be R0 to R31. STS is demonstrated
    in section 5.4.1 in Chapter 5 along with LDS.


    # 11.2.4.9 Load Program Memory Instructions


    LPM (Load Program Memory)

    LPM

    LPM Rd, Z

    LPM Rd, Z+


    LPM has three variants, as shown above, and loads one byte from Flash program
    memory pointed to by the Z register to the destination register. The first variant
    above that consists of the LPM instruction on its own with no operands loads one
    byte from Flash program memory pointed to by the Z register to register R0. The
    use of LPM is demonstrated and explained in section 9.3.2.2 of Chapter 9.


    # 11.2.4.10 Store Program Memory


    SPM (Store Program Memory)

    SPM is used to erase and write to Flash program memory. For more information on
    SPM see the AVR Instruction Set Manual, and also the Self-Programming the Flash
    section of the datasheet for the part being used.


    # 11.2.4.11 Port IN and OUT Instructions


    IN (Load an I/O Location to Register)

    OUT (Store Register to I/O Location)


    IN and OUT have been used many times throughout the text of this book. Remember
    that IN and OUT move data from I/O space to a register, and to I/O space from
    a register respectively. Both instructions are limited to operating on I/O register
    addresses 0 to 63, but can access general purpose working register R0 to R31.
    Refer to section 8.1.1 in Chapter 8 for information on using IN and OUT.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 11.2.4.12 PUSH and POP Instructions


    # PUSH (Push Register on Stack)


    # POP (Pop Register from Stack)


    Push is used to place the contents of any register from R0 to R31 onto the stack.
    POP is used to retrieve a byte from the stack and place it into a register between
    R0 and R31. The stack and stack pointer are explained in section 6.6, and how
    to use PUSH and POP is explained in section 6.6.2, both from Chapter 6.


    # 11.2.5 MCU Control Instructions


    # NOP (No Operation)


    NOP does nothing except use up one clock cycle. NOP is explained and demonstrated
    in section 10.1.2.1 of Chapter 10.


    # SLEEP (Sleep)


    AVR microcontrollers can be put into one of several sleep modes in order to save
    power. Sleep modes are selected in the MCUC register and then initiated by running
    the SLEEP instruction. See the Power Management and Sleep Modes section of the
    datasheet for the AVR being used for more information on the sleep modes.


    # WDR (Watchdog Reset)


    If the watchdog timer is enabled on an AVR microcontroller, then it must be periodically
    reset. WDR must be run before the watchdog timer times out in order to prevent
    it from resetting the microcontroller. The idea of using the watchdog timer is
    to start it and then periodically reset it so that it does not reset the microcontroller.
    If the software running on the microcontroller should hang or lock up the microcontroller,
    then it can no longer reset the watchdog timer. This causes the watchdog timer
    to time out and reset the microcontroller, bringing it out of its hung up or locked
    up state. For more information on the watchdog timer, refer to the System Control
    and Reset section of the datasheet for the AVR being used.


    # BREAK (Breakpoint)


    When a breakpoint is inserted into a program using Microchip Studio and a debugger,
    such as the Atmel-ICE, the instruction that the breakpoint is placed on is replaced
    by the BREAK instruction. The instruction replaced by the breakpoint is stored.
    BREAK is used by the debugging system only and is not intended for use by the
    application software.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 11.3 Entire AVR Instruction Set


    In the previous section, section 11.2, all of the instructions implemented in
    the ATtiny microcontrollers used in this book are covered. Not all of the possible
    AVR instructions are implemented in these devices. In this section we look at
    the total number of AVR instructions and list the instructions not implemented
    in the ATtiny devices that we are using.


    # 11.3.1 Number of AVR Instructions


    The following subsections summarize the number of AVR instructions in the entire
    instruction set, the number of instructions implemented on ATtiny devices, and
    some discrepancies found in the AVR documentation.


    # 11.3.1.1 Total Number of AVR Instructions


    Adding up all of the instructions for the entire AVR instruction set found in
    the Instruction Set Summary section of the AVR Instruction Set manual, the total
    is 142 instructions.


    # 11.3.1.2 Number of ATtiny AVR Instructions


    Adding up all of the implemented instructions for all ATtiny devices from Table
    1.1 in section 1.3 of Chapter 1, the total comes to 123 instructions, except for
    the ATtiny26 that implements 119 instructions. These implemented instructions
    are found in the Instruction Set Summary sections of the datasheets for each of
    the different ATtiny devices.


    ATtiny26 devices don''t implement the following instructions: BREAK, MOVW, LPM
    Rd, Z+, and SPM. These devices don''t have debug capabilities because they do
    not implement the BREAK instruction.


    # 11.3.1.3 Discrepancies in Documentation


    Counting the number of implemented instructions for ATtiny microcontrollers by
    adding up the instructions in the Instruction Set Summary section of the datasheets
    totals 123 instructions except for the ATtiny26 which totals 119 instructions.
    In most datasheets at the time of writing, these counted totals differ from the
    number of instructions mentioned in the Features list at the beginning of the
    datasheets. For example, the ATtiny26 just mentioned quotes 118 instructions in
    the features section instead of 119. All other datasheets, except for two, quote
    120 instructions instead of 123. Only the datasheets for the ATtiny261/461/861
    and ATtiny48/88 quote 123 instructions.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# ## 11.3.2 Other AVR Instructions


    Of the 142 possible AVR instructions, the ATtiny microcontrollers covered in this
    book implement up to 123 instructions. This leaves 19 instructions that are not
    implemented. These remaining instructions are summarized in the following subsections.


    # ## 11.3.2.1 Arithmetic and Logic Instructions


    The full AVR instruction set implements an additional six multiply instructions
    and a data encryption instruction, listed below.


    +   - MUL (Multiply Unsigned) : 8-bit by 8-bit unsigned multiply with a 16-bit
    result.

    +   - MULS (Multiply Signed) : 8-bit by 8-bit signed multiply with a 16-bit result.

    +   - MULSU (Multiply Signed with Unsigned) : multiply of 8-bit signed and unsigned
    numbers.

    +   - FMUL (Fractional Multiply Unsigned) : same as MUL, but left shits result
    by one bit.

    +   - FMULS (Fractional Multiply Signed) : same as MULS, but left shits result
    by one bit.

    +   - FMULSU (Fractional Multiply Signed with Unsigned) : MULSU with left shift
    by one bit.

    +   - DES (Data Encryption Standard) : implements data encryption DES algorithm.


    Of the above instructions DES is only implemented in the AVRxm version of the
    AVR CPU. The six multiply instructions are implemented in the AVRe+, AVRxm and
    AVRxt CPU versions. Remember that the ATtiny microcontrollers used in this book
    have the AVRe CPU.


    # ## 11.3.2.2 Branch Instructions


    Two additional jump instructions and two additional subroutine call instructions
    are available in the full AVR instructions set.


    +   - JUMP (Jump) : Jumps to an address between 0 and 4M words (22-bit address).

    +   - EIJUMP (Extended Indirect Jump) : Indirect jump to an address between 0
    and 4M words (22-bit address). Uses Z register and EIND register in I/O space
    as an address pointer.


    ATtiny microcontrollers used in this book only implement the relative jump instruction
    RJMP and indirect jump instruction IJMP because of their small memory sizes. JMP
    and EIJMP are implemented on AVR microcontrollers that have bigger memories.


    CALL (Long Call to a Subroutine) : Calls a subroutine within the entire program
    memory. The size of the return address pushed on the stack and the number of clock
    cycles used to execute this instruction depends on the size of the memory implemented
    on the AVR and therefore the size of its program counter or PC.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'EICALL (Extended Indirect Call to Subroutine) : Indirect call to a subroutine
    at an address between 0 and 4M words (22-bit address). Uses Z register and EIND
    register in I/O space as an address pointer.


    ATtiny microcontrollers use the RCALL and ICALL instructions to call subroutines
    within their small memory ranges. CALL and EICALL instructions are used in AVRs
    that have bigger memories.


    Although both JMP and CALL are part of the AVR CPU instruction set, they are not
    implemented on the ATtiny devices that we have been using. EIJMP and EICALL are
    only available on AVRe+, AVRxm and AVRxt AVR cores.


    # 11.3.2.3 Data Transfer Instructions


    ELPM (Extended Load Program Memory)

    ELPM Rd, Z

    ELPM Rd, Z+


    There are three variations of the ELPM instruction, as shown above. These instructions
    work the same way as the LPM instructions, but extend the addressing range by
    using the Z register, and the RAMPZ register from I/O space, as a pointer into
    program memory. This instruction and its variants are available on AVRe+, AVRxm
    and AVRxt CPU cores.


    SPM Z+ (Store Program Memory) : Although ATtiny microcontrollers implement the
    SPM instruction, this variation uses the Z register and RAMPZ with post increment.
    This instruction is only available on AVRxm and AVRxt CPU versions.


    XCH (Exchange) : Exchanges one byte between a register R0 to R31 and a byte from
    data space pointed to by the Z register. Found on the AVRxm CPU only.


    LAS (Load and Set) : Loads a byte from I/O space pointed to by the Z register,
    to a register R0 to R31, and sets bits in the data space specified by the register.


    LAC (Load and Clear) : Loads a byte from I/O space pointed to by the Z register,
    to a register R0 to R31, and clears bits in the data space specified by the register.


    LAT (Load and Toggle) : Loads a byte from I/O space pointed to by the Z register,
    to a register R0 to R31, and toggles bits in the data space specified by the register.


    LAS, LAC and LAT are only implemented in the AVRxm version of the CPU.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# 11.3.3 Putting Instructions into Perspective


    This section gives a better understanding of where the various AVR CPU versions
    and instructions are used across different AVR microcontroller ranges.


    # 11.3.3.1 The Full AVR Instruction Set


    Of the additional 19 instructions covered in the previous section, five are implemented
    on the AVRxm CPU only. These are DES, LAC, LAS, LAT, and XCH. This means that
    the AVRxm CPU is the only CPU version to implement all 142 instructions, however
    as with other AVR microcontrollers, not all parts that have the AVRxm CPU implement
    all instructions available in the AVRxm CPU, although some do.


    # 11.3.3.2 The Plain AVR CPU


    In the ATtiny range, some of the older devices have the plain AVR CPU and are
    no longer manufactured or not recommended for new designs. For example, the 8-pin
    ATtiny11, ATtiny12, and ATtiny15 have been replaced with the ATtiny13(A) and ATtiny25/45/85.
    Only the 20-pin ATtiny26 that is listed as having the plain AVR core in the AVR
    Instruction Set Manual is still in production at the time of writing.


    # 11.3.3.3 Reduced AVRrc Core


    The only AVR microcontrollers to use the AVRrc version of the CPU are in the ATtiny
    range of parts, and are only available in surface mount packages. ATtiny4/5/9/10
    parts have the AVRrc core, and are available in 6-pin SOT-23 and 8-pin UDFN packages.
    ATtiny102/104, ATtiny20 and ATtiny40 are the only other AVR microcontrollers available
    with the AVRrc CPU version at the time of writing. AVRrc CPU cores only have registers
    R16 to R31 implemented and have fewer instructions from the full AVR instruction
    set available.


    # 11.3.3.4 AVRe and AVRxt Cores


    All other ATtiny microcontrollers not mentioned above have either the AVRe or
    AVRxt CPU. ATtiny devices that have more than 8K bytes (or 4K words) of program
    memory have to use a CPU that has instructions available to address the additional
    memory. These devices use either the AVRe CPU with all of the AVRe instructions
    implemented, or the AVRxt CPU version, as both CPU versions include instructions
    such as JMP and CALL. The AVRe CPU implemented in devices such as the ATtiny13(A)
    and ATtiny25/45/85 does not implement JMP and CALL, although they are part of
    the AVRe CPU specification. This is because these devices have small memories
    so only need RJMP and RCALL. Only very few members of the ATmega microcontroller
    range use the AVRxt core.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 11.3.3.5 AVR+ CPU


    Besides the few ATmega microcontrollers that use the AVRxt core, all other ATmega
    devices use the AVRe+ core. ATmega microcontrollers found on boards that are probably
    familiar to many readers, such as the Arduino Uno and Arduino MEGA 2560, use the
    AVRe+ CPU. This is the ATmega328 found on Arduino Uno boards and the ATmega2560
    found on Arduino MEGA 2560 boards. AVRe+ CPU cores implement the following instructions
    that are not found on the AVR CPU core version: EICALL, EIJMP, ELPM, FMUL, FMULS,
    FMULSU, MUL, MULS and MULSU.


    The AVR+ and AVRxt instruction sets are identical, except that the AVRxt instruction
    set includes the SPM Z+ instruction.


    # 11.3.3.6 AVRxm CPU


    The AVRxm CPU version is used exclusively in ATxmega (XMEGA devices) and the AVR
    DA range of microcontrollers. Although the AVRxm CPU specification includes all
    available AVR instructions, not every instruction is implemented in every part
    that has the AVRxm CPU.'
