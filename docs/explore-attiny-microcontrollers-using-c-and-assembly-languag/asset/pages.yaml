  md: '```

    loop:       r16, 5      0xE0E5      0b 1110 0000 0000 0101

    ldi       r17, 12     0xE01C      0b 1110 0000 0000 1100

    add       r16, r17    0x0F01      0b 0000 1111 0000 0001

    rjmp      loop        0xCFFF      0b 1100 1111 1111 1000

    ```


    ![](img/83ef13a6c66cc7882b2f357e97f451dc_125_0.png)


    Figure 6.13: Hexadecimal Values of Instructions Shown in Flash Memory


    Figure 6.14 shows how the two LDI instructions are encoded. The first four bits
    of an LDI instruction are always be 1110 binary, as shown in Figure 6.14 and Figure
    6.12. LDI has a constant operand value that gets loaded to the selected register
    – in the example code this value is 5 for the first LDI instruction and 12 for
    the second. This constant value is split into two four bit parts as shown by KKKK
    in the figure when it is encoded into binary. When the two four bit parts are
    put together they form the 8-bit constant number that is loaded to the register.
    The constant number can be a value between 0 and 255, or 0b00000000 and 0b11111111.
    This value range appears in the instruction set manual in the LDI description
    section shown in Figure 6.12 as 0 ≤ K ≤ 255, which means that the constant value
    can be greater than or equal to 0, and less than or equal to 255.


    The destination register is a four bit value dddd in Figure 6.14 and Figure 6.12.
    This value can be between 0b0000 and 0b1111, but because the instruction operates
    only on R16 to R31, it is offset by a value of 16. This means that 16 must be
    added to the binary encoded register value to get the actual register that is
    encoded in the instruction. 0b0000 therefore references R16 (0 + 16) and 0b0001
    references R17 (1 + 16). Register R31 is encoded as 0b1111 (15) + 16 = 31. It
    should now make sense why some instructions are'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'limited in the number of registers that they can operate on as follows. LDI
    instructions are 16 bits wide. The first four bits are always 0b1110. Eight bits
    are used to encode the constant data value in the instruction. This leaves only
    four bits to address the destination register. The maximum number of address values
    that a four bit number can have is 2^4 = 16 (with addresses 0 to 15). The instruction
    is only capable of addressing 16 registers which have been chosen as R16 to R31
    by using an internal offset of 16 on the encoded address.


    ```

    1110 KKKK dddd KKKK

    1110 0000 0000 0101 ldi r16, 5

    ```


    ```

    1110 KKKK dddd KKKK

    1110 0000 0001 1100 ldi r17, 12

    ```


    Figure 6.14: Two Examples of Encoding LDI Instructions


    Various letters or combinations of letters are used to represent registers, operands
    and bits used in the AVR instruction set manual. The meaning of each of these
    letters can be found in the fist section of the AVR Instruction Set Manual, called
    Instruction Set Nomenclature. It is necessary to refer to the meanings of these
    letters when reading about any instruction in the manual. For example, under the
    LDI instruction description, the operation of the instruction is given as: Rd
    <- K


    From the Instruction Set Nomenclature section of the manual, K is constant data
    and Rd is the destination register. The operation therefore means that constant
    data (K) is loaded into the destination register (Rd).


    Changes to the program counter are also included with the instruction description
    in the manual. Program counter operation for the LDI instruction is given as:
    PC <- PC + 1'
