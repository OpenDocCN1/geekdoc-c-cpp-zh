- pgno: 37
  md: '# 1.4 Summary


    Any DIP ATtiny AVR microcontroller from 8-pin to 28-pin that are in-system programmable
    are fine to use when following this book, although 8-pin devices are mainly targeted.
    Be sure to read the introduction chapter, to get an overview of this book and
    information on the hardware and software needed when reading this book. In Chapter
    2 we install Microchip Studio and use it to program an ATtiny microcontroller
    in order to get the necessary tools and hardware set up for use in the chapters
    that follow.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Chapter 2 • Hardware and Software Setup


    The objective of this chapter is to install Microchip Studio, build a circuit
    using an ATtiny25/45/85 or ATtiny13(A), then write a program and load it to the
    microcontroller.


    Microchip Studio is used to write assembly language and C programs when following
    this book. Those readers who do not have hardware yet can still install Microchip
    Studio, read through the rest of this chapter and create the first assembly language
    and C language programs. Chapter 3 shows how to use the simulator found in Microchip
    Studio.


    # In this Chapter


    +   - Install Microchip Studio

    +   - Build an ATtiny microcontroller circuit

    +   - Write a simple assembly language program and load it to an ATtiny

    +   - Write a simple C program for an ATtiny microcontroller'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 2.1 Install Microchip Studio


    Microchip Studio (formerly Atmel Studio) can be downloaded as a web installer,
    or as an offline installer. Downloading the offline installer allows Microchip
    Studio to be installed on many computers without the need to download the software
    from the internet with each installation as the web installer does. For a single
    computer it does not matter which installation method is used.


    # 2.1.1 Download Page and Software Version


    A brief description of the installation using the offline installer follows. If
    you are using the web installer, the steps are basically the same but you must
    be connected to the internet when doing the installation. Download Microchip Studio
    from: www.microchip.com/en-us/development-tools-tools-and-software/microchip-studio-for-avr-and-sam-devices


    The exact version of Microchip Studio used at the time of writing was: Microchip
    Studio for AVR and SAM Devices 7.0.2542 Offline Installer 934 MB, date published
    November 2020


    # 2.1.2 Newest Software Version


    There should be no problem using the newest version of Microchip Studio when it
    becomes available, but if there are any issues or incompatibilities, the above
    version of Microchip Studio can be used. After the above version of Microchip
    Studio is replaced by a newer version, it will be available from the Downloads
    Archive for AVR and SAM: www.microchip.com/en-us/development-tools-tools-and-software/avr-and-sam-downloads-archive


    # 2.1.3 Start the Installation


    Navigate to the folder that the Microchip Studio file was downloaded to and double-click
    the file to run it and start the installation, for example the file as-installer-7.0.2542-full.exe.
    A basic default installation is all that is needed. Some of the components of
    the installation are optional, but no harm is done by installing them.


    # 2.1.4 Installation Steps


    You will need to agree to the license terms and conditions in the first installation
    dialog box. Click Next to continue. All of the architectures can be left at their
    default in the next dialog box, unless you need to conserve disk space (or download
    data if doing the web'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'install), in which case only AVR need be selected. Click Next to continue,
    Advanced Software Framework and Example Projects in the next dialog box are not
    needed for assembly language programming, so installing it is optional again.
    Click Next to continue. A list of items that must be valid for installation to
    proceed are displayed in the next dialog box. In some cases the installer may
    report that a video card driver needs to be upgraded, although the newest driver
    is already installed. It is usually possible to continue with the installation
    even if this is the case. Continue with the installation by clicking the Next
    button. Click Install to start the installation in the Release Notes dialog box.
    When Windows asks if you would like the application to make changes to the computer,
    click Yes to continue. After installation starts, a dialog box opens for setting
    up the MPLAB XC8 compiler. This optional compiler can be set up by clicking the
    Next button, or skipped by clicking the Cancel button. It is not necessary to
    set up this compiler.


    It will take some time for the installation to complete, depending on the speed
    of the host computer. During installation you will be prompted several times with
    dialog boxes asking if you would like to install device driver software. Click
    the Install button in the dialog box each time. The installation will continue
    and then complete.


    # ## 2.2 8-Pin ATtiny Microcontroller LED Circuit


    An initial circuit is used to blink a single LED on and off, and is shown in Figure
    2.1. If you have a Microchip Studio compatible programmer, such as the Atmel-ICE,
    AVR Dragon, or AVRISP mkII, build this circuit on a breadboard and connect the
    programmer as shown in Figure 2.1, Figure 2.2 and Figure 2.3. Read the end of
    section 2.2.2 for details on connecting the programmer and then come back and
    build the circuit. Appendix B has alternate circuits that use 14-pin, 20-pin,
    and 28-pin ATtiny devices. Build a circuit from this appendix if you are using
    an alternate ATtiny. Although the Atmel-ICE is specified in two of the figures
    that follow, any USB programming device that has ISP/SPI programming capabilities
    can be used. Readers using hobby programmers do not need to build the circuit
    now, but must continue reading and create the first assembly language program
    in section 2.3. It is only necessary to build the circuit and connect the hobby
    programmer when prompted to in section 2.3.5, but do read all of the following
    paragraphs and sections as they contain some information on connecting hobby programmers.
    Information on connecting power is important. For those using a programmer that
    is directly supported in Microchip Studio, such as the Atmel-ICE, AVR Dragon and
    AVRISP mkII, connect the programmer to the USB port of the PC. When the programmer
    is plugged into a USB port'
  merge: -1
