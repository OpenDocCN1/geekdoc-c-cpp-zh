    after three increments. Unlike the LDI instruction, the CLR and INC instructions
    can be used on any of the general purpose registers from R0 to R31. As already
    mentioned the counterpart to the CLR instruction, SER, sets all bits in a register,
    but only works on R16 to R31 and not on R0 to R15 – refer back to Figure 5.1.
    Experiment with these instructions in Microchip Studio. Try building a project
    that uses LDI or SER on registers R0 to R15 to see the error displayed in Microchip
    Studio. Remember to save and build the program each time after making changes
    to the code. Quick Tip: After building the project, hit the F10 key immediately
    to start the debugger and break instead of having to click the toolbar button.
    Continue pressing the F10 key to step over each line of code after this.


    The previous two examples show some of the ways that the general purpose working
    registers are used in assembly language programs. Registers can be used to store
    values to be used in mathematical calculations and to store the results of calculations.
    The same applies to Boolean, or logical operations which are still to be covered.
    Usage of registers will become clearer as you progress through this book and see
    more code examples, and how other assembly language instructions operate on registers.


    # 5.3 AVR Memory Map


    A memory map is an illustration that shows the size and addresses of the memories
    of a microcontroller or system, as can be seen in Figure 5.3 for the 8-pin PDIP
    ATtiny AVRs. Every memory location has a unique address at which it can be accessed.
    This concept is explained when we look at the internal architecture of the AVR
    in the next chapter. For now we just look at the different types of memory on
    AVR devices, as well as their sizes and addresses. Figure 5.3 specifies ATtiny
    8-pin PDIP AVRs, but also true for the 14-pin and 20-pin PDIP AVRs (except the
    ATtiny26) from Table 1.1 in section 1.3 of Chapter 1, for devices with 2K, 4K
    and 8K of Flash, but not for the 28-pin ATtiny48/88.'
