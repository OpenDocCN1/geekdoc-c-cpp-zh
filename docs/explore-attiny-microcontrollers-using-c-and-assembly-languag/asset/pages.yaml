    and so require more I/O registers for controlling these peripherals.


    # 5.5 Summary


    +   - AVR microcontrollers have 32 general purpose working registers named R0
    to R31 grouped together in a register file, except for the ATtiny4/5/9/10 series
    that has 16 registers – R16 to R31.

    +   - AVR microcontrollers have 64 I/O registers, called the I/O register file,
    that include a stack pointer, status register and register for controlling on-chip
    peripheral devices such as timers, ADC, etc.

    +   - Some of the bigger devices in the AVR range have an extended I/O register
    file – this includes the 28-pin ATtiny48/88 devices.

    +   - A memory map shows all of the available memory and address spaces available
    on a microcontroller or system.

    +   - ATtiny13(A) and ATtiny25/45/85 microcontrollers have Flash program memory
    for storing programs that run on the microcontroller, SRAM for storing volatile
    data and EEPROM for storing non-volatile data.

    +   - The register file and I/O registers are mapped to the same address area
    as the SRAM on AVR microcontrollers.

    +   - The STS and LDS instructions can be used to store a value to SRAM or load
    a value from SRAM respectively. These instructions can also be used to access
    any register that is mapped to the data space of the AVR.'
