- pgno: 297
  md: "0? Jumping to PC + 2K words is easy enough to understand. If the PC contains\
    \ the address 0 and an RJMP instruction jumps to address 2048, which is 2K words\
    \ ahead, there is no problem – the instruction has the following format: RJMP\
    \ PC+0x8800.\n\nWhat happens if the PC contains zero and the instruction at address\
    \ 0 jumps to 2K + 1, or 2049 (0x801)? In this case the instruction ends up as:\
    \ RJMP PC-0x87FF When this instruction is executed, the PC is loaded with 0x801,\
    \ or 2049. The reason that the PC is loaded with 0x801 is because -0x07FF ends\
    \ up as a negative 2’s compliment number. To convert minus 0x07FF to its 2’s compliment\
    \ representation, first invert all bits making the number 0xF800, which is the\
    \ 1’s compliment of the number. Add 1 to make it the 2’s complement and we get\
    \ 0xF801. Because an ATtiny with 4K words of memory has a 12-bit PC, the number\
    \ gets truncated to 0x801 which is the address that we want to jump to.\n\nTake\
    \ note that PC - 2K + 1 and PC + 2K words describes the range of memory that RJMP\
    \ can operate on. The actual operation of RJMP is PC <- PC + k + 1, which means\
    \ that the instruction jumps to the address that is the sum of the current value\
    \ in the PC and the constant address k encoded into the instruction plus 1.\n\n\
    The following code demonstrates how to jump from address 0 to 2049, and back to\
    \ 0 again.\n\n```\n.org 0\nmain:\n    rjmp  loop\n\n.org 2049\n\nloop:\n    rjmp\
    \  main\n```\n\nThe above code disassembles to the following.\n\n```\nrjmp  loop\n\
    00000000 RJMP PC-0x87FF             Relative jump\n00000001 NOP     Undefined\n\
    ...\n000007FF NOP     Undefined\n00000800 NOP     Undefined\nrjmp  main\n00000801\
    \ RJMP PC+0x87FF             Relative jump\n```"
  merge: -1
  img_proc: true
- pgno: 298
  md: 'The actual encoding of the two RJMP instructions is as follows.


    ```

    RJMP PC-0x07FF is encoded as 0xC800

    RJMP PC+0x07FF is encoded as 0xC7FE

    ```


    The first four bits of an RJMP instruction are always 1100 binary, or C hexadecimal.
    Thus the first address to jump to is encoded as 0x800, but is shown as -0x07FF
    in the disassembly. The first RJMP instruction therefore jumps to PC + k + 1 which
    is 0 + 0x800 + 1 = 0x801.


    When the second RJMP instruction jumps back to 0 from address 0x801, it uses the
    address 0x7FE encoded in the instruction. PC + k + 1 is now 0x801 + 0x7FE + 1
    = 0x1000. Again, because ATtiny microcontrollers with 8K bytes of Flash memory
    (4K words) have a 12-bit PC, the result is truncated to 0x000, and the second
    RJMP instruction jumps back to address 0.


    To jump from address 0 to the last word in a 4K word memory, RJMP PC-0x0801 is
    used. This is encoded as 0xCFFE, so ends up as 0 + 0xFFE + 1 = 0xFFF. 0xFFF or
    4095 is the last address in a 4K memory. To jump back from the last address in
    a 4K word memory to address 0, RJMP PC+0x0801 is used. This is encoded as 0xC000,
    so ends up as 0xFFF + 0 + 1 = 0x1000, truncated to 0x000.


    # IJMP (Indirect Jump)


    The Z register is used as a pointer register when using the IJMP instruction.
    IJMP jumps to the address that the Z register contains or points to. This means
    that the address to jump to must be loaded to the Z register before calling IJMP,
    and IJMP has no operands.


    # 11.2.2.2 Subroutine Call Instructions


    # RCALL (Relative Call to Subroutine)


    RCALL has the same address range and operation on the PC as the RJMP instruction,
    except that it pushes the address of the next instruction onto the stack before
    jumping to or calling the subroutine. RCALL has been used many times in code examples
    in this book, so no further examples are included here. It was first used to call
    the delay subroutine in section 2.3.2 of Chapter 2 in the LED blink program. Calling
    a subroutine using RCALL is demonstrated in section 6.6.3 of Chapter 6 where it
    is shown how RCALL pushes the return address onto the stack. The stack and stack
    pointer are explained in section 6.6.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# ICALL (Indirect Call to Subroutine)


    ICALL works the same way as IJMP, using the Z register as a pointer, except that
    ICALL pushes the next program memory address onto the stack. ICALL is used to
    call a subroutine at the address that the Z register is holding.


    # 11.2.2.3 Return from Subroutine and Interrupt Instructions


    # RET (Return from Subroutine)


    RET must be used to return from a subroutine that was called using RCALL or ICALL.
    The return address is loaded from the stack when RET is executed at the end of
    a subroutine.


    # RETI (Return from Interrupt)


    RETI must be the last instruction run in an interrupt service routine so that
    program execution continues where the main code was interrupted and so that the
    global interrupt enable bit in the status register is automatically set again.
    The use of the RETI instruction is explained in Chapter 10, starting from section
    10.5.1.


    # 11.2.2.4 Compare Instructions


    Of the four compare instructions that follow, only CPSE branches. The other compare
    instructions don''t branch, but are typically used in combination with branch
    instructions.


    # CPSE (Compare Skip if Equal)


    CPSE compares two registers and skips the next instruction if the values in the
    registers are equal. It has the format CPSE Rd,Rr where Rd and Rr can be any registers
    from R0 to R31. This instruction does not alter the status register.


    # CP (Compare)


    CP compares two registers in the range R0 to R31, which means that it affects
    flags in the status register. It has the form CP Rd,Rr where Rd and Rr can be
    any of the registers R0 to R31. The following example demonstrates the use of
    CP.


    ```

    ldi   R16, 0x05

    ldi   R17, 0x05

    cp    R16, R17

    breq  equal

    nop   ; Values are not equal

    equal:

    nop   ; Values are equal

    ```'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'In the code example, values in register R16 and R17 are compared using CP.
    The BREQ (Branch if Equal) instruction is used after CP to determine if the compared
    values were equal or not. If the values are equal, then program execution branches
    to the next NOP instruction at the equal label. If the values are not equal, program
    execution continues at the first NOP instruction below BREQ. Other conditional
    branch instructions can be used after CP to determine the outcome of the comparison.
    Conditional branch instructions are found in section 11.2.2.6 that follows after
    the next section.


    # CPC (Compare with Carry)


    CPC is like the CP instruction, but also takes into consideration the carry flag
    in the status register. As with CP, CPC is usually followed by a conditional branch
    instruction.


    # CPI (Compare with Immediate)


    CPI is like the CP instruction, but instead of comparing two registers, it compares
    one register with an immediate value. It has the form CPI Rd,K where K is an 8-bit
    immediate value.


    # 11.2.2.5 Skip Instructions


    # SBRC (Skip if Bit in Register is Cleared)


    SBRC tests a bit (0 to 7) in a register (R0 to R31) to see if it is clear. If
    the bit is clear, it skips the next instruction. It has the form SBRC Rr,b where
    Rr is the register to test, and b is the bit in the register to test. SBRC was
    used in section 8.2.3 of Chapter 8 to limit a count value. Any I/O register read
    into a general purpose register can have its bits tested using SBRC.


    # SBRS (Skip if Bit in Register is Set)


    SBRS works the same way as SBRC, but tests if a bit is set in a register rather
    than cleared. If the bit is set, the next instruction is skipped. SBRS was used
    in the timer polling code from section 10.4.2 of Chapter 10 to test the OCF0A
    bit in the TIFR register. The TIFR register was first read into a general purpose
    register before testing the OCF0A bit.


    # SBIC (Skip if Bit in I/O Register is Cleared)


    # SBIS (Skip if Bit in I/O Register is Set)


    SBIC and SBIS work in the same way as SBRC and SBIS, but operate on I/O registers
    0 to 31, rather than the general purpose registers. Both instructions have the
    form SBIC A,b'
  merge: -1
  img_proc: true
- pgno: 301
  md: "where A is the address of the I/O register, and b is the bit to test. SBIC\
    \ and SBIS were both used in section 8.2.5 of Chapter 8 to test the state of a\
    \ switch connected to a pin. To test the bit in an I/O register that has an address\
    \ greater than 31, it is necessary to first read the value into the I/O register\
    \ into a general purpose register, and then use SBRC or SBRS to test the bit in\
    \ the general purpose register.\n\n# 11.2.2.6 Branch Instructions\n\nBranch instructions\
    \ branch depending on if a bit is set or clear in the status register or SREG.\
    \ BRBS and BRBC that immediately follow check for a specified bit in the status\
    \ register. All other branch instructions are synonyms for BRBS and BRBC that\
    \ check specific status register bits. BRBS and BRBC take two operands – the bit\
    \ number in the status register to check and the address to branch to. All other\
    \ branch instructions take only one operand – the address to branch to, because\
    \ the bit to check in the status register is fixed with these instructions. All\
    \ of the branch instructions are limited to branching to a relative address that\
    \ can be between -64 and +63 relative to the PC.\n\nAfter BRBS and BRBC, there\
    \ are 9 pairs of branch instructions that test the 8 flags in the status register\
    \ to see whether they are set or clear. The reason that there are 9 pairs of instructions\
    \ instead of 8 is because two of the pairs check the status of the C flag.\n\n\
    # Branch if Bit in SREG Set or Cleared\n\n+   BRBS (Branch if Bit in SREG is Set)\n\
    +   BRBC (Branch if Bit in SREG is Cleared)\n\nOf the two instructions BRBS and\
    \ BRBC, BRBC was used to check the status of the Z flag in the status register\
    \ for the basic delay subroutine, starting in the code of section 2.3.2 of Chapter\
    \ 2. BRBC was used to check if the Z bit was cleared, in other words if the contents\
    \ of a register was not zero. BRBC branched to a DEC instruction that decremented\
    \ the register. So long as the register did not contain zero, BRBC branched to\
    \ DEC. When DEC finally decrements the register to zero, then the Z flag is automatically\
    \ set to indicate that the last arithmetic operation resulted in zero. BRBC then\
    \ does not branch, but rather runs the instruction directly below it. This part\
    \ of the delay subroutine code is as follows.\n\n```\n...\ndelloop2:\n    dec\
    \ r17\n    brbc SREG_Z, delloop2\n...\n```"
  merge: -1
