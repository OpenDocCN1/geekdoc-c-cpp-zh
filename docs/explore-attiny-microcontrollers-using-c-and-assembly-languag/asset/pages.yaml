    of 0 results in an error in both cases, as expected. Using an F_CPU value above
    20MHz or below 210kHz also flags an error. Using one plus the maximum MS_TIME_DEL
    for 20Mhz with an F_CPU of 20MHz results in an error, but using the same MS_TIME_DEL
    value with an F_CPU of 20kHz does not result in an error because at lower the
    time delay can be much bigger. You will notice the upper MS_TIME_DEL test values
    in the code that we calculated, as well as values that become negative once above
    0x7FFFFFFF.'
  merge: -1
  img_proc: true
- pgno: 250
  md: "# ## 10.2.4 Passing a Value to a Subroutine\n\nThe wait_ms subroutine that\
    \ we developed in the previous section is more useful than the fixed 1 second\
    \ subroutine before it, but it still has limitations. The time delay that it is\
    \ set at is fixed in the code once set. Every time that it is used in the code,\
    \ it delays for the same period.\n\nIt does not take too much effort to modify\
    \ the wait_ms subroutine code so that it can be passed a millisecond delay value,\
    \ that it will then delay for. Each time that it is used in the code, it can be\
    \ passed a different value and will then delay for that time.\n\n# ### 10.2.4.1\
    \ Simplest Way to Pass a Value\n\nThe mechanism for passing a value to a subroutine\
    \ is to put the value to pass to it in a known location, either in memory or in\
    \ a register. A modified version of the wait_ms_asm project called wait_pass_val.asm\
    \ follows, that shows the simplest method of passing a value to a subroutine.\n\
    \n```\nwait_pass_val.asm : wait_pass_val.asm\n\nwait_pass_val:\n  subi  R16, 1\n\
    \  sbci  R17, 0\n  sbci  R18, 0\n  sbci  R19, 0\n  mov   R20, R16\n  or    R20,\
    \ R17\n  or    R20, R18\n  or    R20, R19\n  brbc  SREG_Z, wait_pass_val\n  nop\n\
    \  nop\n  nop\n  ret\n```\n\nIn the above code, the wait_ms subroutine has been\
    \ modified. Firstly, it has been renamed to wait_pass_val. The code that was added\
    \ to test the limits of values used with the subroutine have been removed simply\
    \ for clarity, as we are looking at the method used for passing a value to this\
    \ subroutine. Where previously the registers that contained the number of cycles\
    \ to use up in the subroutine were loaded with values at the top of the subroutine,\
    \ they have now been removed. By removing the registers, a single label is needed\
    \ to jump to, which also happens to be the entry point of the subroutine. The\
    \ idea of removing the register loading from the subroutine is to load the values\
    \ in the code before"
  merge: -1
  img_proc: true
- pgno: 251
  md: "the subroutine is called. In this way, a new value can be passed to the subroutine\
    \ each time that it is called. This is shown in the main.asm listing of the wait_pass_val_asm\
    \ project below.\n\n```\nwait_pass_val.asm : main.asm\n\n.equ\tF_CPU\t\t = 1000000\n\
    .equ\tMS_DELAY_1\t = (((F_CPU * 200) / 1000) - 10) / 10) ; 200ms\n.equ\tMS_DELAY_2\t\
    \ = (((F_CPU * 500) / 1000) - 10) / 10) ; 500ms\n\nstart:\tsbi\tDDRB, DDB4\t\t\
    \ ; Set pin PB4 as output\n\nloop:\tsbi\tPORTB, PORTB4\t\t ; Set LED pin high\n\
    \tldi\tR16, low (MS_DELAY_1)\t ; Pass 32-bit value\n\tldi\tR17, byte2(MS_DELAY_1)\t\
    \ ; to the wait_pass_val\n\tldi\tR18, byte3(MS_DELAY_1)\t ; subroutine\n\tldi\t\
    R19, byte4(MS_DELAY_1)\t ;\n\trcall\twait_pass_val\t\t ; LED on delay\n\tcbi\t\
    PORTB, PORTB4\t\t ; Clear LED pin low\n\tldi\tR16, low (MS_DELAY_2)\t ; Pass 32-bit\
    \ value\n\tldi\tR17, byte2(MS_DELAY_2)\t ; to the wait_pass_val\n\tldi\tR18, byte3(MS_DELAY_2)\t\
    \ ; subroutine\n\tldi\tR19, byte4(MS_DELAY_2)\t ;\n\trcall\twait_pass_val\t\t\
    \ ; LED off delay\n\trjmp\tloop\n\n.include \"wait_pass_val.asm\"\n```\n\nAt the\
    \ top of the code, two names are equated with values that are worked out using\
    \ the formula that we are now familiar with. The first value works out the number\
    \ of cycles for the subroutine to delay for to generate a 200ms delay, and the\
    \ second for a 500ms delay. These values are then loaded to registers R16 to R19\
    \ before wait_pass_val is called. In this way, the values have been passed to\
    \ the wait_pass_val subroutine because the subroutine uses these values to generate\
    \ the time delays.\n\nNote that in the above code, if measuring the number of\
    \ cycles used by the subroutine in the simulator, the cycles must be measured\
    \ starting from where the first part of the 32-bit number is loaded to R16. The\
    \ reason for this is that the formula for calculating the number of cycles to\
    \ generate has not been modified to remove the cycles used to pass the value to\
    \ the subroutine. In any case, this may be the behavior we prefer, as these instructions\
    \ still use up cycles that can be considered part of the delay that we are generating.\
    \ Note that 3 extra cycles are added to the total because of the RCALL instruction\
    \ which is now"
  merge: -1
  img_proc: true
- pgno: 252
  md: "part of the measurement. Note also that RCALL uses a different number of cycles,\
    \ depending on the CPU type and also the number of bits that the program counter\
    \ or PC consists of. Refer to RCALL in the AVR Instruction Set Manual for these\
    \ details. For the ATtiny13(A) and ATtiny25/45/85, the RCALL instruction uses\
    \ up three clock cycles.\n\n# 10.2.4.2 Improved Way to Pass a Value\n\nIn the\
    \ previous listing it can be seen that the code is rather messy and bulky, mainly\
    \ because we are passing a 32-bit value to a subroutine, so have to load up four\
    \ 8-bit registers to hold the 32-bit value before every subroutine call. A way\
    \ to improve the readability of the code is to use a macro. Information on macros\
    \ for the AVRASM2 assembler program is found in the AVR Assembler document from\
    \ Microchip.\n\nCreate a new AVR Assembler Project in Microchip Studio called\
    \ wait_ms_macro.asm. Add a new Assembler File to the project called wait_ms_macro.asm.\
    \ Refer back to section 10.2.3, Figure 10.4 and Figure 10.5 for a reminder on\
    \ how to add a new assembler source code file to a Microchip Studio project. Add\
    \ a new include file (.inc file) to the project using the same method used to\
    \ add a new assembler file, except click Include File in the dialog box in Figure\
    \ 10.5 of section 10.2.3. Name the new file wait_ms_macro.inc. Add the code to\
    \ the three files from the listings that follow.\n\n```\nwait_ms_macro.asm : main.asm\n\
    \n.Include \"wait_ms_macro.inc\"\n.equ    F_CPU     = 1000000\n\nstart:\n    \
    \    sbi     DDRB, DDB4        ; Set pin PB4 as output\nloop:   sbi     PORTB,\
    \ PORTB4     ; Set LED pin high\n        M_WAIT_MS 200             ; LED on delay\n\
    \        cbi     PORTB, PORTB4     ; Clear LED pin low\n        M_WAIT_MS 500\
    \             ; LED off delay\n        rjmp    loop\n\n.Include \"wait_ms_macro.asm\"\
    \n```\n\nIn the above code, the frequency that the microcontroller is operating\
    \ at must be equated to F_CPU as before. Once again, the LED attached to pin PB4\
    \ via a series resistor is blinked on and off. The difference in the above code\
    \ is that first a .inc file is included at the top of the code and the macro implemented\
    \ in this file, called M_WAIT_MS is called to implement the two time delays in\
    \ the code. This macro is passed a value of 200 the first time it is used, and\
    \ 500 the second time it is used to generate 200ms and 500ms delays."
  merge: -1
  img_proc: true
- pgno: 253
  md: "# wait_ms_macro.asm: wait_ms_macro.asm\n\n```\nwait_ms_macro:\n    subi  R16,\
    \ 1\n    sbci  R17, 0\n    sbci  R18, 0\n    sbci  R19, 0\n    mov   R20, R16\n\
    \    or    R20, R17\n    or    R20, R18\n    or    R20, R19\n    brbc  SREG_Z,\
    \ wait_ms_macro\n    ret\n```\n\n# wait_ms_macro.asm: wait_ms_macro.inc\n\n```\n\
    ; The M_WAIT_MS macro generates a millisecond delay time\n;macro M_WAIT_MS\n;\
    \ Do limit checks on F_CPU and millisecond delay value passed to macro\n.if  \
    \ (F_CPU > 20000000)\n    .error \"F_CPU too high for M_WAIT_MS macro. Maximum\
    \ 20MHz\"\n.elif (F_CPU < 4100000)\n    .error \"F_CPU too low for M_WAIT_MS macro.\
    \ Minimum 410kHz\"\n.elif (@0 < 1)\n    .error \"Delay time too low for M_WAIT_MS\
    \ macro. Minimum 1ms\"\n.elif (((((F_CPU * @0) / 1000) - 30) / 10) > 0xFFFFFFF)\n\
    \    .error \"Time delay too big for M_WAIT_MS macro.\"\n.endif\n\n; Save the\
    \ registers that are to be used by the delay subroutine\n    push  R16\n    push\
    \  R17\n    push  R18\n    push  R19\n    push  R20\n\n; Pass calculated cycle\
    \ value to wait_ms_macro subroutine\n    ldi   R16, low ((((F_CPU * @0) / 1000)\
    \ - 30) / 10))\n    ldi   R17, byte2((((F_CPU * @0) / 1000) - 30) / 10))\n   \
    \ ldi   R18, byte3((((F_CPU * @0) / 1000) - 30) / 10))\n    ldi   R19, byte4((((F_CPU\
    \ * @0) / 1000) - 30) / 10))\n\n; Now call the wait_ms_macro subroutine\n    rcall\
    \ wait_ms_macro\n\n; Restore the registers used by the subroutine\n    pop   R20\n\
    \    pop   R19\n    pop   R18\n    pop   R17\n    pop   R16\n\n.endmacro\n```"
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The only difference between the wait_ms_macro.asm code and the same code from
    the previous project is that the NOP instructions have been removed and the name
    of the subroutine has been changed to match the project name. The NOP instructions
    were removed to change the timing, as is explained shortly.


    In the wait_ms_macro.inc file is the code for the macro used in this project.
    As can be seen in the code, the macro starts with the .macro directive, followed
    by the name chosen for the macro, which is M_WAIT_MS. The .endmacro directive
    at the very end of the code marks the end of the macro.


    Immediately after the macro name at the top of the file is the code that we previously
    used to check the limits of F_CPU and the limits of the time delay in milliseconds.
    Some of the wording of the error messages in this code has been changed to refer
    to the M_WAIT_MS macro, so that the user will know where the error messages are
    coming from, should they be triggered. The expression next to the last .elif directive
    has been modified to subtract a value of 30, instead of 10 as was done in the
    previous code. This has to do with the changed timing of the code, as is explained
    later. The final change to this part of the code is that @0 has been substituted
    into two places that previously contained MS_TIME_DEL. As the AVR Assembler document
    explains, a macro can be passed up to 10 parameters, named @0 to @9. As we are
    only passing one parameter to the macro we use @0, which represents the first
    parameter passed to the macro. When the macro is used in the code from main.asm,
    as shown below, it is passed a value of 200 and then 500. In the macro, @0 takes
    on a value of 200 the first time and takes on a value of 500 the second time.
    This value represents the desired delay time in milliseconds.


    ```

    sbi     PORTB, PORTB4    ; Set LED pin high

    M_WAIT_MS 200            ; LED on delay

    cbi     PORTB, PORTB4    ; Clear LED pin low

    M_WAIT_MS 500            ; LED off delay

    rjmp    loop

    ```


    In the macro from wait_ms_macro.inc, after the directives that check the frequency
    and delay time limits, the registers used by the delay subroutine that the macro
    calls are pushed onto the stack. These are registers R16 to R20. The same registers
    are popped off the stack in reverse order before the end of the macro. This is
    done so that when the macro is used, there is no need to keep track of whether
    some value crucial to the main code will be wiped out because the macro and subroutine
    it calls use the same register that the crucial value is stored in.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'After pushing the registers onto the stack, registers R16 to R19 are loaded
    with the 32-bit value calculated to generate the correct number of cycles for
    the desired time delay. The code to do this is the same as for the previous project,
    except that the calculation part takes into consideration the changed number of
    clock cycles used by the new code, so subtracts 30 instead of 10 that was subtracted
    in the previous code. After loading the calculated value to R16 to R19, the wait_ms_macro
    subroutine is called, effectively passing the calculated value to this subroutine.


    The wait_ms_macro subroutine works in the same way that the equivalent subroutine
    worked in the previous project. The only difference is that the NOP instructions
    were removed to make the additional clock cycles generated by the code before
    and after the main loop of the subroutine into a multiple of 10.


    In the following line of code, it can be seen that 30 is subtracted instead of
    10, as was done in the previous code.


    ```

    ldi R16, low ((((F_CPU * 80) / 1000) - 30) / 10)

    ```


    The 30 that is subtracted above is worked out as follows and includes all instructions
    used by the macro and subroutine that it calls.


    ```

    ; Save the registers that are to be used by the delay subroutine

    push R16 ; 2 clock cycles

    push R17 ; 2 clock cycles

    push R18 ; 2 clock cycles

    push R19 ; 2 clock cycles

    push R20 ; 2 clock cycles

    push R29 ; 2 clock cycles

    ; Pass calculated value to wait_ms_macro subroutine

    ldi R16, low ((((F_CPU * 80) / 1000) - 30) / 10) ; 1 clock cycle

    ldi R17, byte2((((F_CPU * 80) / 1000) - 30) / 10)) ; 1 clock cycle

    ldi R18, byte3((((F_CPU * 80) / 1000) - 30) / 10)) ; 1 clock cycle

    ldi R19, byte4((((F_CPU * 80) / 1000) - 30) / 10)) ; 1 clock cycle

    ; Now call the wait_ms_macro subroutine

    rcall wait_ms_macro ; 3 clock cycles

    ; Restore the registers used by the subroutine

    pop R20 ; 2 clock cycles

    pop R19 ; 2 clock cycles

    pop R18 ; 2 clock cycles

    pop R17 ; 2 clock cycles

    pop R16 ; 2 clock cycles

    ```


    In the above code, the PUSH and POP instructions take up 20 clock cycles together
    and the LDI and RCALL instructions take up 7 clock cycles. This totals 27 clock
    cycles. We must now look at the clock cycles in the wait_ms_macro subroutine,
    as follows.'
  merge: -1
  img_proc: true
- pgno: 256
  md: "```\nwait_ms_macro:\n    subi    R16, 1\n    sbci    R17, 0\n    sbci    R18,\
    \ 0\n    sbci    R19, 0\n    mov     R20, R16\n    or      R20, R17\n    or  \
    \    R20, R18\n    or      R20, R19\n    breq    SERG_Z, wait_ms_macro\n    ret\
    \     ; 4 clock cycles, but is effectively 3 clock cycles\n```\n\nIn the above\
    \ code, the only instruction that falls outside of the loop is the RET instruction.\
    \ This instruction executes in 4 clock cycles on an AVR CPU that has a PC that\
    \ is less than 22 bits wide. BRBC uses up 2 clock cycles, except for the last\
    \ time it is executed, when it uses up 1 clock cycle. Because of this, one clock\
    \ cycle is borrowed from the clock cycles used up outside the loop to effectively\
    \ make the last time that BRBC is executed also use up 2 clock cycles. For this\
    \ reason, we subtract 1 clock cycle from RET, which then effectively uses up 3\
    \ clock cycles instead of 4. Add these 3 clock cycles to the 27 clock cycles added\
    \ up from the body of the macro, and we get a total of 30 clock cycles used up\
    \ outside the loop of wait_ms_macro. In the previous project code, only 10 clock\
    \ cycles were used up outside the loop of the delay subroutine. Because we did\
    \ not simplify the equation that calculates the number of loops through the delay\
    \ subroutine, we can directly replace the 10 cycles in the calculation with 30,\
    \ as shown in the following code.\n\n```\nldi    R16, low (((((F_CPU * (@0) /\
    \ 1000) - 30) / 10))\n```\n\nAs the clock cycles outside the loop work out to\
    \ 30, which is a multiple of 10, there is no need to keep the NOP instructions\
    \ in the code that we previously added. These NOP instructions were previously\
    \ added to make the clock cycles outside the loop add up to a value of 10.\n\n\
    Because a value in the above calculation changed, we need to recalculate the minimum\
    \ CPU frequency that our time delay macro and subroutine will work with. We use\
    \ the formula below, as was previously used.\n\n![](img/83ef13a6c66cc7882b2f357e97f451dc_256_0.png)\n\
    \nWe know that the minimum value that t_ms can be is 1ms. The minimum value that\
    \ C_T can be is if we make one pass through the delay subroutine. This value is\
    \ now 40 clock cycles"
  merge: -1
  img_proc: true
- pgno: 257
  md: "made up of 30 cycles outside the subroutine loop plus 10 cycles from 1 pass\
    \ through the loop. Substituting these values into the formula gives us the following.\n\
    \nf_{CPU} = \\frac{10000(40+1)}{1}\n= 410000\n\nThe value from the calculation\
    \ works out to 410kHz, which is used in the code at the top of the macro that\
    \ tests for F_CPU limits, as follows.\n\n```\n...\n.elif (F_CPU < 410000)\n  \
    \  .error \"F_CPU too low for M_WAIT_MS macro. Minimum 410kHz\"\n.elif (@0 < 1)\n\
    \    .error \"Time delay too low for M_WAIT_MS macro. Minimum 1ms\"\n...\n```\n\
    \nLooking back at main.asm, repeated below, we can see that wait_ms_macro.inc\
    \ is included at the top of the code in which the macro is used. This makes the\
    \ macro available to us in the main.asm file. Although F_CPU is used in wait_ms_macro.inc,\
    \ it is defined below where wait_ms_macro.inc is included. The reason that this\
    \ does not cause an error is because the assembler is a multi-pass assembler.\
    \ This means that on the first pass through the file, the assembler builds up\
    \ a symbol table. In this way it knows about F_CPU when it passes through the\
    \ source code again. This is usually referred to as forward referencing.\n\n```\n\
    wait_ms_macro.asm : main.asm\n\n.include \"wait_ms_macro.inc\"\n.equ    F_CPU\
    \    = 1000000\n\nstart:\n    sbi     DDRB, DDB4        ; Set pin PB4 as output\n\
    \nloop:\n    sbi     PORTB, PORTB4    ; Set LED pin high\n    mWAIT_MS 200   \
    \          ; LED on delay\n    cbi     PORTB, PORTB4    ; Clear LED pin low\n\
    \    mWAIT_MS 500             ; LED off delay\n    rjmp    loop\n\n.include \"\
    wait_ms_macro.asm\"\n```\n\nBecause our M_WAIT_MS macro calls the wait_ms_macro\
    \ subroutine, the file that this subroutine is found must be included at the bottom\
    \ of the file that the M_WAIT_MS macro is used in."
  merge: -1
  img_proc: true
- pgno: 258
  md: 'When a macro is used in a program, the macro is expanded in the code where
    it is used. Macro expansion means that the code that makes up the macro is effectively
    pasted into the place where the macro is used. The following code shows how the
    macros used in the previous code were expanded.


    ```

    00000000 sbi DDRB, DDB4 ; Set pin PB4 as output

    loop:

    00000001 sbi PORTB, PORTB4 ; Set LED pin high

    M_WAIT_MS 200 ; LED on delay

    00000002 push R16

    00000003 push R17

    00000004 push R18

    00000005 push R19

    00000006 push R20

    00000007 ldi R16, 0x1D

    00000008 ldi R17, 0x4E

    00000009 ldi R18, 0x00

    0000000A ldi R19, 0x00

    0000000B rcall wait_ms_macro

    0000000C pop R20

    0000000D pop R19

    0000000E pop R18

    0000000F pop R17

    00000010 pop R16

    00000011 cbi PORTB, PORTB4 ; Clear LED pin low

    M_WAIT_MS 500 ; LED off delay

    00000012 push R16

    00000013 push R17

    00000014 push R18

    00000015 push R19

    00000016 push R20

    00000017 ldi R16, 0x4D

    00000018 ldi R17, 0xC3

    00000019 ldi R18, 0x00

    0000001A ldi R19, 0x00

    0000001B rcall wait_ms_macro

    0000001C pop R20

    0000001D pop R19

    0000001E pop R18

    0000001F pop R17

    00000020 pop R16

    00000021 rjmp loop

    ```


    As can be seen in the above listing, the macros were expanded in the two places
    that they were used. The code from the macro is essentially pasted into the two
    places that the'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'macro was used. This code includes the pushing and popping of the registers
    used, the LDI instructions used to load the delay count value to the registers,
    and the call to the wait_ms_macro subroutine. Each time that the macro is used,
    the full macro code is substituted into its place. Only one instance of the wait_ms_macro
    subroutine exists which is called by both expanded macros. The code for the wait_ms_macro
    subroutine is shown in the following listing. By making a call to wait_ms_macro,
    instead of including this code directly in the macro, we save some space in memory.
    If the wait_ms_macro code were placed in the macro, rather than calling it as
    a subroutine, it would be expanded fully each time that it is used. This would
    use up extra memory.


    ```

    wait_ms_macro:

    00000022 subl R16, 1

    00000023 sbci R17, 0

    00000024 sbci R18, 0

    00000025 sbci R19, 0

    00000026 brcc R20, R16

    00000027 or R28, R17

    00000028 or R28, R18

    00000029 or R20, R19

    0000002A brbc SREG_Z, wait_ms_macro

    0000002B ret

    ```


    The reason that we can''t put the PUSH and POP instructions in the wait_ms_macro
    subroutine is because the pushed registers must be loaded with values in the macro,
    otherwise we would just have another fixed time subroutine. This means that these
    registers are modified in the macro, so must be pushed before modifying.


    It may look like the POP instructions could be put into the subroutine instead
    of leaving them in the macro, however this is not possible. What happens is the
    registers are first pushed onto the stack, then modified by loading the value
    to pass to the subroutine. When the subroutine is called after this, the return
    address for the subroutine is automatically pushed onto the stack. If we then
    tried to pop the registers before returning from the subroutine, we would actually
    pop the return address of the subroutine first because it is the last thing pushed
    onto the stack. When the subroutine returns and automatically pops its return
    address from the stack, it would actually be popping the values from the first
    two registers that were pushed. Obviously this would cause the subroutine to return
    to the wrong address, causing the program to malfunction.


    Finally note that the M_WAIT_MS macro produces a cycle accurate delay for values
    that are multiples of 10. This can again be checked using the simulator in Microchip
    Studio.'
  merge: -1
  img_proc: true
- pgno: 260
  md: "# 10.3 Calling an Assembly Subroutine from C Code\n\nIt is easy to call an\
    \ assembly language subroutine from a C code program. The most important information\
    \ to have when calling a subroutine from C code is the registers used to pass\
    \ values to a subroutine and registers used to return values from a subroutine.\
    \ Register usage by C compilers may be different for different compilers, even\
    \ for the same microcontroller. This information is available for the avr-gcc\
    \ compiler in an application note called Atmel AT1886: Mixing Assembly and C with\
    \ AVRGCC available from: ww1.microchip.com/downloads/en/Appnotes/doc4255.pdf\n\
    \nIn the example that follows in the next section, an assembly language subroutine\
    \ is called from C code and passed a 32-bit value. In the section after the next\
    \ section, an assembly language subroutine called from C code returns a value.\n\
    \n# 10.3.1 Passing a Value to an Assembly Subroutine from C\n\nThe following subroutine\
    \ code is taken from the wait_ms_macro_asm project in section 10.2.4.2 of this\
    \ chapter. Some modifications have been done to the code to make a C program able\
    \ to call the assembly language subroutine. The subroutine is the code that we\
    \ put into a macro and generates a variable millisecond time delay. In the modified\
    \ code the subroutine is called wait_ms because this name is short and descriptive.\
    \ Don’t confuse this subroutine with an earlier subroutine that had the same name.\
    \ The project consists of three files. Create a new GCC C Executable Project in\
    \ Microchip Studio called wait_ms.c. Replace the code in main.c of the project\
    \ with the following code.\n\n```\nwait_ms_c : main.c\n\n#define F_CPU 12000000\n\
    \n#include <avr/io.h>\n#include \"wait_ms.h\"\n\nint main(void)\n{\n    DDRB |=\
    \ (1 << DDB4);    // Set up pin PB4 as an output\n\n    while (1)\n    {\n   \
    \     PORTB |= (1 << PORTB4);    // Set pin high (LED on)\n        wait_ms(WAIT_MS_TIME(200));\
    \    // LED on delay\n        PORTB &= ~(1 << PORTB4);    // Set pin low (LED\
    \ off)\n        wait_ms(WAIT_MS_TIME(1000));    // LED off delay\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 261
  md: "In the main.c listing, change the value of F_CPU to the frequency that your\
