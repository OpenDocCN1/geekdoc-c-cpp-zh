  mdcn: "\n\n## 注释\n\n注释是指不会被执行或作为程序的一部分被读取的行。它们的唯一目的是供可能需要额外信息的用户阅读。如果你想让其他人更好地理解你的程序，或者你想提醒自己曾经做过什么，你可以在你的程序中包含注释。如果你决定在几年后回来看你的程序，你的注释将会非常有帮助。它们可以提醒你编写代码期间时的想法。\n\
    \n请考虑以下示例：\n\n```php\n<?php\n# 这是一个单行注释\n//This is a single line comment\n/*\n\
    这是一个多\n行行\n注释\n*/\n// 这是一个省略了部分代码行的注释\n$w = 2 /* * + 10 */ + 3;\necho $w;\n?>\n\
    ```\n\n如果你运行这段代码，你将得到如下输出：\n\n5\n\n## 大小写敏感\n\n在 PHP 中，函数、关键字和类是不区分大小写的。\n\n请考虑这个示例：\n\
    \n```php\n<?php\necho \"Testing code\";\nECHO \"Testing code\";\nEcHo \"Testing\
    \ code\";\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\nTesting code Testing code Testing code\n\
    \n然而，PHP 中的变量名是区分大小写的。\n请看这个示例：\n\n```php\n<?php\n$color = \"blue\";\necho \"\
    The sky is \" . $color . \"\\n\";\necho \"The sky is \" . $coLoR . \"\\n\";\n\
    echo \"The sky is \" . $COLOR . \"\\n\";\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\nThe\
    \ sky is blue\n\nThe sky is \n\nThe sky is\n\n你会发现，第一条语句是唯一一个显示变量 $color 值的语句。这是因为\
    \ `$color`、`$coLoR` 和 `$COLOR` 被视为不同的变量。\n\n## 换行\n\n要创建一个新行，你只需要在语句后放置 `\\n`\
    \ 即可。\n\n请看这个示例：\n\n```php\n<?php\necho \"The sky is blue. \\n\";\necho \"The\
    \ rose is red. \\n\";\n?>\n```\n\n如果你运行这段代码，你将得到输出：\n\n```\nThe sky is blue.\n\
    The rose is red.\n```\n\n## 处理表单\n\nPHP 的最大优点之一是它可以处理 HTML 表单。请注意，表单元素在 PHP 脚本中是自动可用的。\n\
    \n## 第 4 章：数组\n\n数组是一种特殊的变量，可以一次存储多个值。它本质上是一个项目列表。例如，如果你想存储一个名称列表，你可以将它们存储在单独变量中例如：\n\
    \n```php\n$name1 = \"Wendy\";\n$name2 = \"Dawn\";\n$name3 = \"David\";\n```\n\n\
    然而，如果你想对这些名称进行循环，你需要一个数组。数组可以在一个名称中存储许多值，并允许你在引用索引数字时访问这些值。\n\n从更简单的角度来看，数组就像一张购物清单。它允许你在一个变量中存储多个项目。当你创建购物清单时，可以为每种必须购买的物品使用单独的纸张。这些物品就像是你存储的变量。\n\
    \n不过，为你的购物物品使用单独的纸张是不必要的。这样太麻烦了，完全是浪费纸张。所以，与其这样做，你只需要在一张纸上写下你需要买的所有东西。这张纸就就像一个数组。\n\
    \n## 如何创建数组\n\nPHP 中的 `array()` 函数用于创建数组。可以使用任意数量用逗号分隔的 `key => value` 键作为参数。例如，\n\
    \n```php\narray (\n    key1 => value1,\n    key2 => value2,\n...\n)\n```\n\n最后一个数组可能有也可能没有逗号。单行数组实际上带有逗号更好。所以，与其写\
    \ `array (1, 2, )`，你应该写 `array (1, 2)`。然而，多行数组倾向于带有末尾逗号，因为这使得添加新元素变得更容易。\n\n实际上有三种类型的数组：关联数组、索引数组和多维数组。关联数组是具有命名键的数组。索引数组是具有数字索引的数组。多维数组是包含一个或多个数组的数组。\n\
    \n关联数组的语法为：\n\n```php\narray (key => value, key => value, etc.);\n```\n\n例如：\n\
    \n```php\n<?php\n$price = array(\"cantaloupes\" => \"2\", \"grapes\" => \"3\"\
    , \"strawberries\" => \"4\");\necho \"Cantaloupes cost \" . $price['oranges']\
    \ . \".dollars each.\";\n?>\n```\n\n索引数组的语法为：\n\n```php\narray(value1, value2,\
    \ etc.);\n```\n\n编写索引数组有两种方法。你可以允许索引自动分配，也可以手动分配。\n\n请看这个自动分配索引的示例：\n\n```php\n\
    $fruits = array(\"apples\", \"bananas\", \"kiwis\");\n```\n\n这是一个手动分配索引的示例：\n\n\
    ```php\n$fruits[0] = \"apples\";\n$fruits[1] = \"bananas\";\n$fruits[2] = \"kiwis\"\
    ;\n```\n\n至于多维数组，这里有一个示例：\n\n```php\n$arr = array (\n  array(\"John\", \"Doe\"\
    , \"22\"),\n  array(\"Jane\", \"Doe\", \"23\"),\n  array(\"Billy\", \"Gates\"\
    , \"45\")\n);\n```\n\n多维数组的语法为：\n\n```php\narray(array(...), array(...), etc.);\n\
    ```\n\n这是一个带有关联键的多维数组示例：\n\n```php\n$users = array(\n  \"john\" => array(\"name\"\
    \ => \"John\", \"age\" => 22),\n  \"jane\" => array(\"name\" => \"Jane\", \"age\"\
    \ => 23)\n);\n```\n\n"
