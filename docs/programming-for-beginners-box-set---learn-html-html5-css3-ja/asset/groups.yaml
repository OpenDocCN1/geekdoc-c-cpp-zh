    ## Chapter 1


    ## What is HTML?


    HTML is an abbreviation of Hyper Text Markup Language. It was originally designed
    to easily share scientific research papers, which is why professionals typically
    use terms like web page to describe their creations.


    The term Hyper Text means any kind of text that can be displayed on a computer
    screen but often times the definition includes a notion of linked documents. This
    is how the web works. It''s a network of information connected via Hyper Links.


    Now let''s talk about the other part of HTML – the term Markup language comes
    from the idea of computer code that describes the content. Imagine that you are
    creating a newspaper and you need to organize it. First you need to title the
    newspaper then you need to add a few sections for different topics. Each of these
    sections needs a large headline followed by a few smaller headlines then we need
    to add a few paragraphs and photos.


    You''ll find that building the structure of a web page is very similar. When you''re
    creating content you''ll need to use HTML to break it up into sections, paragraphs
    and so on.


    All web browsers use the HTML to interpret and compose text, images and other
    materials.


    Now let''s get to the tools we need in order to write our HTML code.


    ## Chapter 2

    Text Editors and How to Use Them?


    For coding for HTML and pretty much any other programming language we need some
    kind of a text editor. For the purpose of this book we''re going to use either
    Windows Note Pad or the free to download “Note Pad++ which you can get from here
    : http://bit.ly/1Bm4IZm


    I''ll be using the Note Pad ++ software for all the examples in the book.


    The installation is pretty basic so I won''t be explaining how to do it. Assuming
    that you''ve already downloaded and installed the text editor here''s couple of
    things you need to do before we get into coding.


    When you open the text editor, press CTRL+ N to open a new work window. While
    we write our first lines of code we''ll want to check how it looks. In order to
    do that you have to go to the top left corner and press File. Click on the Save
    As... and chose a destination where you want to save the file. Before saving


    | File name | Save as |

    | :--- | :--- |

    | .html | Hyper Text |


    Now it''s time to start with the basics.


    ## Chapter 3

    HTML Basics


    ## Chapter 4

    HTML Elements


    As you saw in the previous chapter the HTML elements are written with a start
    tag, with end tag and with the content in between. HTML element is everything
    from the start tag to the end tag.


    Using the same example from the previous chapter:


    ```

    <!DOCTYPE html>

    <html>

    <body>


    <h1>My First Heading</h1>

    <p>My first paragraph.</p>


    </body>

    </html>

    ```


    ## My First Heading


    My first paragraph.


    This is our first and basic HTML webpage. On the next chapter we’ll bout HTML
    elements.

