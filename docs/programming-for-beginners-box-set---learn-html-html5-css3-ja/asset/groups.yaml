    # MySQL 到底是什么？


    要理解 MySQL 是什么，你必须先知道什么是计算机数据库。本质上，计算机数据库是数据的集合。MySQL 和其他专门的数据库软件只是允许用户高效存储和检索数据的程序。


    使用专门的数据库软件是为了避免在存储和检索数据时遇到问题。例如，如果你使用不直观的文件名来保存文件（如 a.doc、b.doc 和 c.doc），当你需要这些文件时，你将很难找到它们。你需要一种更高效的数据存储方法。


    数据库是一种用于存储大量数据的计算机软件程序。它基本上是一个结构化的数据集合，可以包含从图片画廊到购物列表再到公司网络信息等任何内容。通过数据库软件，你可以维护包含重要信息的列表。


    例如，如果你在经营一家商店，使用数据库将帮助你保持一切井井有条。你可以创建一个客户及其地址的列表。如果你需要从特定客户那里获取信息，就不再需要逐个检查你的数据了。


    为了访问、处理和添加存储在数据库中的数据，你需要一个像 MySQL Server 这样的数据库管理系统。由于计算机在处理大量数据方面非常高效，你将从数据库管理系统中大获益浅。它们作为应用程序的一部分或独立单元都是理想的的。


    MySQL 数据库也是关系性的。它们将数据存储在单独表中，而不是将所有数据存储在一个单一存储器中。具有表、行、列、视图和数据库等对象的逻辑模型提供了灵活的编程环境。作为用户，你可以根据数据字段之间的关系创建自己的规则，包括一对多、一对一、唯一、可选、必填以及表与之间的指针。你的数据库会执行这些规则，因此你的应用程序不会产生重复、不一致、缺失、孤立或过时的数据。


    SQL 实际上代表结构化查询语言 (Structured Query Language)。它由 ANSI/ISO SQL 标准定义，该标准自 1986 年以来一直存在。它是访问数据库著名的标准化语言。你可以直接输入
    SQL 来执行某些操作，例如生成报告；将嵌入式 SQL 语句嵌入到使用其他语言创建的代码中；或者使用隐藏了 SQL 的特定语言编程接口 (APIs)。


    MySQL 数据库服务器是快速、可扩展且可靠的。它们也非常易用，这就是为什么初学者可以使用它们。它们可以在桌面电脑或笔记本电脑上运行，并与其他 Web 服务器和应用程序共同工作。它们不需要太多关注，因此易于维护。如果你专门用一台机器运行
    MySQL，你还可以调整设置以充分利用可用内存、I/O 能力和 CPU 功率。


    # MySQL vs PostgreSQL


    在开源关系型数据库管理系统方面，许多人在选择 MySQL 和 PostgreSQL 之间会遇到困难。MySQL 是最知名名和最常用的 RDBMS，而 PostgreSQL
    是最先进的开源目标 RDBMS。两者都是可以与专有数据库软件比拟的优秀解决方案。


    PostgreSQL 也称为 Postgres，是一种对象关系数据库管理系统 (ORDBMS)，它侧重于标准合规性和可扩展性。它存储数据、支持最佳实践并允许检索。它还可以处理工作负载，包括单机应用程序和面向互联网的应用程序。


    许多用户认为 MySQL 比 PostgreSQL 功能更少但速度更快。相反，他们认为 PostgreSQL 功能丰富且与 Oracle 相似。开发者由于其易用性和速度而偏好在软件项目中使用
    PostgreSQL，许多具有 SQL Server 和 Oracle 背景的开发者也使用 PostgreSQL。


    MySQL 有几层结构：一个用于多种存储引擎的层和一个上层。另一方面，PostgreSQL 只有一个存储引擎。记住，存储引擎之间的区别主要在于性能和功能。取决于你的数据库系统运行在什么，你是否可以对其进行优化。


    PostgreSQL 的一些最重要的特性包括 TOAST 数据压缩、参数化和静态 SQL 执行器、大规模可扩展性、异步提交和先进的基于成本的优化器。PostgreSQL
    能够使用快速压缩方案对数据进行解压缩和压缩，使其能够适应特定的磁盘空间。压缩数据是非常棒的，因为它节省了磁盘空间且读取数据更快。


    MySQL 的一些核心特性包括 ANSI SQL 99 子集及扩展、通过 LIST、SET、HASH 和 RANGE 分区、网络压缩、内置复制事件或语句、触发器、SQL
    支持、游标、存储过程、可更新视图以及 Unicode 支持。


    如果你是一个不为网站编写程序的管理员，你可能不会发现 MySQL 和 PostgreSQL 之间的差异很大。你关注的主要是主机是否拥有你需要的数据库。通常情况下，如果你使用
    CMS 或任何流行的博客软件，你可以预期它是基于 MySQL 的。几乎商业主机在其托管包中都包含了 MySQL。


    # 你需要学习 MySQL 吗？


    普通的管理员不需要学习 SQL 或 MySQL，因为他们使用的软件很可能完成了数据的存储和检索。他们只需要学习如何使用这些软件。将 MySQL 和类似的数据库想象成汽车引擎。为了开车，你真的不需要学习如何设计汽车引擎。同样，为了使用博客软件，你不需要学习直接读写
    MySQL 数据库。


    另一方面，如果你是一个程序员，你需要学习 SQL 才能编写访问 MySQL 和其他 SQL 数据库的程序。当然，你还需要学习一种合适的编程语言。如果你在想成为管理员是否必须成为程序员，答案是否定的。你完全可以在不会编程的情况下成为管理员。你可以通过手动编写
    HTML 代码创建一个网站。


    # 第 3 章：语法、注释、大小写敏感、换行和表单


    # 语法


    你可以将 PHP 脚本放在文档的任何位置。它们通常以 <?php 开始并以 ?> 结束。它们的文件扩展名为 .php，通常包含 PHP 脚本代码和 HTML
    标签。不要忘记使用分号 (;) 结束一个 PHP 语句。


    考虑以下 PHP 代码示例：


    ```php

    <?php

    echo "Testing code";

    ?>

    ```


    如果你运行此代码，你将得到输出：


    Testing code


