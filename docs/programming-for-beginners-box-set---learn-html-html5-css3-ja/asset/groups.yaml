  mdcn: '

    在退出之前按下任何键之前进行等待。注意对于像 MonoDevelop 等 IDE，用户会看到诸如“按任意键继续”的消息提示。当按下按键时，该字符将自动打印在控制台应用程序窗口中。


    在 C# 开发中，告诉程序等待用户输入仅仅是冰山一角。下一步是学习如何将用户输入存储到变量中，并以某种方式利用这些信息。但在之前，你应该先学习如何声明变量。


    ## 声明变量


    正如第一章提到的，变量基本上是任何包含特定数据类型的名称。变量被用于存储用户输入。但在使用变量之前，必须先进行声明。同样的规则适用于存在的每种编程语言。


    要声明一个变量，你需要使用以下语法：


    ```csharp

    <Data type> MyVar;

    ```


    请记住 `MyVar` 可以替换为任何你想为变量命名的名称。只需记住 C# 是区分大小写的，因此在命名变量时最好注意大写字母。命名类和方法也是如此。


    接下来是基础赋值运算符 (`=`)，它允许你为变量设置值。请注意，如果你使用 `var` 函数声明变量，则不需要指定数据类型。相反，数据类型将根据你在声明变量时关联的数据类型自动确定。这就是为什么你不能使用这种方法声明一个未定义的变量。


    然而，你不需要在程序启动时立即为变量赋值。尽管如此，你可以只需通过省略赋值运算符并缩短声明来声明变量：


    ```csharp

    <类型> MyVar;

    ```


    但在之前，数据类型究竟是什么？它们之间有何区别？首先，有三类涵盖了不同的数据类型：值类型、引用类型和指针类型。在本书的剩余部分中，大部分重点将放在值数据类型上。这些是通常作为值嵌入变量中的数据类型。


    ## 数据类型列表


    有 13 种数据类型。但我们在本书中只会阐述和使用其中几种。请记住，这些数据类型有默认值，当你在声明变量时没有自己设置值，就会使用这些值：


    - 布尔型 (bool) – 布尔数据类型只有两个可能的值：`true` 或 `false`。它对于创建条件非常方便。该数据类型的默认值是 `false`。注意，与
    C++ 不同，C# 中的布尔值没有数值。这意味着 `true` 不等于 1，而 `false` 不等于 0。


    - 字符 (char) – 字符 `char` 数据类型由单个 Unicode 字符或简单的文本表示。记住这种特定数据类型只使用单个字符，与 `string`
    数据类型不同。该数据类型的默认值是 `''\0''`。


    - 整数 (int) – 出基础编程目的，在处理数字时你将主要依赖整数或 `int` 数据类型。`int` 数据类型被认为是有符号整数，计算机使用补码对其进行识别。`int`
    数据类型的默认值是 `0`。


    - 字符串 (string) – 字符串数据类型基本上是字符序列。字符串也可以包含数字。在存储诸如名称、密码、单词以及基本任何其他使用字母数字的序列时，这是理想的。


    - 小数 (decimal) – 记住其他数据类型（即 `float` 和 `double`）可以与具有精确小数值的整数一起使用。然而，对于人类语言中的大多数数值概念（货币、测量等），使用
    `decimal` 数据类型总是更简单。对于伪影或仅用于程序内计算目的的制品，有时 `float` 或 `double` 更合适。`decimal` 类型的默认值是
    `0.0`。


    本书中不会详细阐述的数据类型如下：


    - 浮点型 (float) – `float` 数据类型包含 32 位浮点值。它基本上是 "floating point" 的缩写，指的是数字中某处的小数点。`float`
    数据类型最多可以有 7 位数字。


    - 双精度型 (double) – `double` 类型与 `float` 类型相同，主要区别在于可以存储多达 16 位数字。与 `float` 类型不同，`double`
    表示 64 位双精度浮点数。


    - 长整型 (long) – `long` 是一种整数数据类型（没有小数点），可以包含从 -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807
    的数字。这是 64 位有符号整数的范围。注意，对于表示 32 位有符号整数的 `int`，范围是 -2,147,483,648 到 2,147,483,647。


    - 短整型 (short) – 与 `int` 和 `long` 数据类型相比，`short` 数据类型表示 16 位有符号整数类型，范围从 -32,768
    到 32,767。


    - sbyte – `sbyte` 代表这组中最小的；表示 8 位有符号整数，包含从 -128 到 127 的数字。


    - Byte, Uint, Ulong, Ushort – 这些是 `sbyte`、`int`、`long` 和 `short` 值类型的无符号对应项。它们不包含小于
    0 的数字，因此它们的整个范围都扩展到了正数。对于 `byte`，范围从 0 到 255。对于 `int`，范围从 0 到 4,294,967,295（注：原文此处为
    4,294,967,296 对应 uint 范围）。


    '
