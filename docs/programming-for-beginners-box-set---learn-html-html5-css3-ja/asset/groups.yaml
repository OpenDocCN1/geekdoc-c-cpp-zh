    # CSS Specificity


    The term “specificity” refers to each rule’ relative weight. This means that this
    is needed to determine which style will be applied to the element in question,
    when more than a single rule may apply.


    Based on the rules of specificity, a regular selector (like “h1”) has a specificity
    of 1. A class selector has a specificity of 1,0, while ID selectors are given
    a specificity of 1,0,0. Unlike the decimal system, specificity values do not carry
    over as commas are used to separate the digits. This means that a CSS rule that
    has 11 elements with 11 classes will have a specificity of 11,11, instead of 121.


    Let us consider the following block of HTML code to demonstrate the rules of specificity.


    ```

    <DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <style>

    #abc { color: green; }

    </style>

    </head>

    <body>

    <p id="abc" style="color: red> This demonstrates specificity </p>

    </body>

    </html>

    ```


    In this example, the declaration inside the “style” attribute (e.g. id="abc" style="color:
    red") will override the style element (e.g. “<style> #abc { color:green>'
