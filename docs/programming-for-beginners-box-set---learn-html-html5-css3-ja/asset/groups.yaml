    # Introduction


    Today’s applications are becoming increasingly powerful, especially with computers,
    smartphones, and tablets getting more processing power and memory every year.
    However, all of these devices are nothing without the operating system and programs
    they contain.


    You might already be familiar with Java, whether it’s from an introductory course
    in programming or a platform you have had to install to make certain programs
    work on your computer, and that’s not surprising at all since Java remains one
    of the most popular and in-demand programming languages in the world!


