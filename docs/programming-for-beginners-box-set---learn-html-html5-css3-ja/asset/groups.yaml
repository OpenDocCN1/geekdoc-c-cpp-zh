    # Priority Scheme (from Highest to Lowest)


    Earlier, we mentioned that CSS follows a “cascading” priority scheme that follows
    a sort of hierarchy. Here is the scheme of CSS priority, arranged from highest
    to lowest.


    Importance - Anything marked with the “!important” annotation will overwrite the
    previous priorities.


    Inline - A style that is applied to part of an HTML document that is annotated
    with the “style” attribute.


    Media Type - This is a property definition applying to all types of media, unless
    something media-specific is defined.


    User-defined - This is available in most browsers, as almost all modern browsers
    have an accessibility feature for the end-user (a user-defined CSS document).


    Selector specificity - This is a specific contextual selector which works to overwrite
    genetic definitions.


    Rule order - The last rule declaration will have a higher priority.


    Parent inheritance - If no property is described, then the parent element’s property
    will be inherited.


    CSS property definition within the HTML - The CSS rule or inline style will overwrite
    the default browser value.


    Browser default - This is the lowest priority, and the browser default value is
    always'
