    programming books and courses use Java to illustrate different concepts in programming
    because of its ease, flexibility, and wide range of applications.


    Two other programming languages that also come to mind when learning programming
    for the first time: C and Python. However, C lies on the more difficult side of
    the spectrum whereas Python lies on the easier side of the spectrum. Java are
    fundamentally different – C is a procedural, function-oriented language, which
    means that it''s good for programs that need new functions or operations added
    easily, and Python can be procedural, object-oriented, but may give the beginner
    a scaffolding too high to learn the basics of programming.


    # Conclusion


    You''ve been given a rather quick overview on the concept of programming, the
    concepts of object-oriented programming, and Java. While this chapter is by no
    means a thorough discourse in these three important topics, it should be enough
    to help you understand majority of the stuff we''re going to be talking about
    throughout this book. The next chapter is going to talk about getting your computer
    ready for writing, compiling, and running Java code, so take a break and come
    back when you''re ready to dive deeper into the world of Java.'
  - '[PAGE 112]


    # Chapter 2: Setting Up Your Computer for Java


    Welcome back. Recall that in Chapter 1 you''ve been given an introduction to Java
    from the ground up. In this chapter, we''re going to set your computer up for
    Java so that you can write, compile, and run Java code without problems unrelated
    to the creation of code itself. At the end of this chapter, you should have all
    the tools you need to create your first Hello World program, hang in there and
    do not skip this chapter unless you''re sure that you already have all the tools
    you need!


    # The Set-Up


    In any programming language, there are three things you need to have:


    +   1. Something that lets you write code

    2. Something that converts what you wrote into something the computer understands

    3. Something that runs your program


    So let''s go through them one by one:


    **Something that lets you write code.** Basically we''re talking about some sort
    of text editor. The default one installed on your computer can definitely write
    Java code, but to date, only Linux operating systems have text editors that can
    syntaxhighlighting capabilities while being easy to use. Syntax highlighting basically
    means variables, class names, etc. are colored differently to making a code easier
    on the eyes. That being said, here are some of the best text editors for writing
    Java code:


    +   a. Notepad++ - Notepad++ is one of the most well known text editors for Windows
    because it''s free and it could run from flash drives or even from Dropbox. It
    supports a wide variety of programming languages, and as name suggests, it can
    completely replace the preinstalled notepad application. In a nutshell, it''s
    free, fast to use, and flexible, if you have a Windows system, there is no reason
    not to have this program installed.

    b. Atom - Atom is one of the most powerful text editors created for programmers,
    by programmers. A lot of programmers love this text editor because it''s highly
    customizable not only in how it looks, but also how it behaves. Atom definitely
    takes longer to load Notepad++, but once it''s running, you definitely won''t
    feel a hiccup in performance. Atom runs in Windows, Mac, and Linux, so if you''re
    up for a more advanced text editor packed with lots of customization options and
    neat features, try it out for yourself.

    c. Vim - Vim is known as a simpler version of Vi. A lot of advanced'
  - '[PAGE 113]


    programmers prefer this text editor because the interface is highly customizable.


    +   d. Eclipse – technically not a text editor, but an Integrated Development
    Environment (IDE). In Eclipse, you just type in your Java code while it helps
    you remember variable, function, and class names and check for errors. With a
    single click, Eclipse compiles your code and runs it. In this book it''s recommended
    that you stick to using text editors so you''ll learn not to depend too much on
    Eclipse to complete and correct your code for you.


    # Something that converts what you wrote into the computer understands.


    We''d need a compiler, which converts your Java source code into something that
    the Java Virtual Machine understands (bytecode) so that it can do what''s supposed
    to do. You''ll need to get the latest Java Development Kit (JDK) from oracle.com.
    The kit is free and contains a straightforward, foolproof installation scheme
    (for Windows users, you''ll need to update your PATH variable. Don''t worry though;
    instructions for doing this are also straightforward), but remember to download
    the Java Standard Edition that corresponds to your operating system.


    # Something that Runs Your Program.


    In programming, a platform is a bunch of programs that help run programs in the
    Java programming language. Java contains an execution engine commonly referred
    to as a virtual machine, and a compiler that makes sure that the programs you
    write will work the same way for computers with different operating systems and
    hardware. In nutshell, Java programs don''t run directly from the operating system
    even though it appears so; they run on top of a platform that makes sure the programs
    don''t end up crashing because a user changed their processor or upgraded their
    operating system.


    # The Three Java Platforms


    There are different kinds of platforms in Java to choose from depending on the
    type of device:


    +   Java Card – this platform is new again, and it applies to applets, which are
    tiny Java-based programs, to run on devices with limited memory like smart cards.


    +   Java Standard Edition (Java SE) – this platform is used for creating standard
    Java applications that can run on desktop computers and web browsers.


    +   Java Enterprise Edition (Java EE) – this platform is built on top of Java
    SE. From its name, it''s useful if you''re running a server, as it allows you
    to create server applications.


    +   Java Micro Edition (Java ME) – this platform built on top of Java SE as well.
    From its name, it''s useful if you need to create Java applications for embedded
    devices (Xlets), for mobile information devices (MIDlets), and basically any other
    devices that have limited display, storage, and power.'
- md: "\nThroughout this book we shall be using Java SE simply because you'll be programming\
    \ on your computer anyway, so there'll be no need for additional devices just\
    \ to run your programs. Also, because Java SE is the most widely used Java platform,\
    \ it makes sense to run your programs on this platform.\n\n## The Java Skeleton\n\
    \nBefore going into your first Java program, let's see the minimal implementation\
    \ of a Java application:\n\n```\nclass Classname\n{\n    public static void main(String[]\
    \ args)\n    {\n}\n}\n```\n\nA class is basically a container for methods and\
    \ variables. If you remember the analogies with cellular phones, dumb-phones,\
    \ and smartphones back in chapter 1, a class is basically a blueprint that contains\
    \ what a specific object is and what it can do. In this code snippet, Classname\
    \ is basically just a placeholder and can be changed to any other name, as long\
    \ as the filename changes to match it.\n\nThe block of code inside Classname is\
    \ referred to as a method. Methods are basically blocks of code that take in some\
    \ input, process them, and respond with an output (optional). In the code segment,\
    \ main is the name of the method; void is the return value (which means it won't\
    \ return anything). main() receives a group of strings describing its inputs and\
    \ stores it in an array called args.\n\nNow that you have all the tools you need,\
    \ as well as a quick overview of the Java program template, you're ready to create\
    \ your first Java program! The next chapter is rather short, so feel free to jump\
    \ right in and see your first Java code greet the world!\n\n## Chapter 3: Your\
    \ First World Program\n\nTradition has it when you’re learning a programming language\
    \ for the first time, your first program outputs “Hello World” to the screen.\
    \ That being said, here’s the Java code for your first hello world program:\n\n\
    ```\nclass MyFirstProgram {\n    public static void main(String[] args) {\n  \
    \      System.out.println(\"Hello, World!\");\n    }\n}\n```\n\nRemember to save\
    \ this file as “MyFirstProgram.java” since Java considers the name of the source\
    \ code to be the name of the main class of the program.\n\nBefore running the\
    \ program, let’s talk a little about the source code. MyFirstProgram is the program’s\
    \ class, where main() is a method it contains. The inside(main) method lies the\
    \ System.out.println() function, which basically gets whatever text you put inside\
    \ and gives it to the command line or terminal to display.\n\nNow that you know\
    \ bit about the source code, compile the Java source code using this command (If\
    \ you’re using an IDE, however, you may just need to press the “run” button for\
    \ your program to compile and run):\n\n```\njavac MyFirstProgram.java\n```\n\n\
    This code should not generate any errors, but if it does, go back to the source\
    \ code and check for any misspelled names, missing semicolons, and other mistyped\
    \ commands.\n\n```\njava MyFirstProgram\n```\n\nThis should result in “Hello,\
    \ World!” shown on the screen.\n\nCongratulations! You’ve created your first program\
    \ in Java! This mini chapter, while letting you create your first program, also\
    \ serves to give you a break after all the concepts we’ve flown through in the\
    \ previous chapters. At this point, it’s a good idea to take a break, and then\
    \ skim through the previous chapters before proceeding to the next chapter, as\
    \ the next chapter is going to be the longest chapter of this book.\n\n## Chapter\
    \ 4: Programming Basics\n\nWe've talked about Java being an object-oriented programming\
    \ language, but before we can use objects, classes, and other stuff strongly tied\
    \ with java, we have to first master the features that Java has in common with\
    \ other languages, that way you don't end up getting confused and overwhelmed.\n\
    \nIn this chapter, we're going to talk about:\n\n- Comments\n- Literals\n- Identifiers\n\
    - Data Types\n- Variables\n- Arrays\n- Operators\n- If-Else Statements\n- Switch\
    \ Statements\n- While and For Loops\n\nThese features are considered essential\
    \ in pretty much every programming language, but even if you've already taken\
    \ up a programming course and see the similarities, remember that every programming\
    \ language will have variations in the most fundamental data types and naming\
    \ conventions. Make sure you least skim through this chapter if you're sure that\
    \ you're familiar with most of the concepts in order to avoid confusion in the\
    \ next chapters.\n\n## Comments\n\nThe comments feature is probably one of the\
    \ most important yet seriously underrated features of the Java programming language.\
    \ Basically, the comments feature allows you to type in stuff that the compiler\
    \ won't run. Two of the most common uses of comments would be:\n\n- “Turning off”\
    \ and “turning on” segments of code by simply uncommenting or commenting the parts\
    \ you want the compiler to run and the parts you want the compiler to ignore,\
    \ respectively.\n- Giving other people, or even your future self a rather thorough\
    \ explanation of how your code works\n\nNumber 1 is useful for debugging and tinkering\
    \ with the flow of your program. By seeing what turning off and turning off specific\
    \ parts of your program does, you can easily pinpoint errors and other handy stuff.\n\
    \nNumber 2 is especially useful if you're working with more than a thousand lines\
    \ of Java code (yes, you can have many lines of code even on a simple Java application)\
    \ and plenty of people who contribute to that code. Imagine how hard it would\
    \ be if there turned out to be an error buried in those lines of code that contain\
    \ no comments, and you were tasked to sniff this bug and eradicate it. With no\
    \ comments to tell you most of the cryptic code snippets were meant to accomplish,\
    \ it could take months, or even years of. Now that you know the common uses of\
    \ comments and why they are important, see how you use them:\n\n### Single liners,\
    \ known as single line\n\nA single line comment, as the name suggests, is a comment\
    \ that spans one line. It starts with the // until the end of the line. Here's\
    \ an example using a slightly modified MyFirstProgram.java:\n\n```\nclass MyFirstProgram\
    \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
    Hello, World!\");\n        //Outputs the \"Hello, World!\"\n    }\n}\n```\n\n\
    ### Multiple, known as multiline\n\nIf you needed to create length descriptions\
    \ of your code, it can be tedious to add double slash at every line. Luckily,\
    \ multiple liners exist to make multiline commenting alot easier. It starts with\
    \ the /* and ends with the */ with everything inbetween ignored by the compiler.\
    \ Here's an example further modifying MyFirstProgram.java:\n\n```\n/*\nThis program\
    \ does five things:\n1. It outputs \"Hello, World\" to the screen.\n2. It creates\
    \ a variable named A and assigns it a value of 1.\n3. It creates a variable named\
    \ B and assigns it a value of 2.\n4. It creates a variable named C and assigns\
    \ it a value of 3.\n5. It adds A, B, and C and outputs the result to the screen.\n\
    */\nclass MyFirstProgram {\n    public static void main(String[] args) {\n   \
    \     System.out.println(\"Hello, World!\");\n        int A = 1;\n        int\
    \ B = 2;\n        int C = 3;\n        A + B + C;\n    }\n}\n```\n\nAfter running\
    \ this program, do check if the code really does what the multiline comment says\
    \ it will. As an exercise, find out which one of the five things it doesn't do\
    \ and see how you can fix the program.\n\nComments are a great way to make sure\
    \ that your program remains readable and bug-free, which is why it was discussed\
    \ in quite a lot of detail. The next few section should be fairly fast, so buckle\
    \ up, as it's going to be a bumpy and speedy ride!\n\n## Literals\n\nNowadays\
    \ its is quite acceptable to say, “I literally died when I saw this really funny\
    \ video of a cat,” but back then, the word, “literally” purely that something\
    \ was meant to be taken as it is. In the world of Java, that meaning has retained\
    \ its purity, as literals are basicallyally taken as they are and not representations\
    \ of different values. For example:\n\n```\nint a = 1; // 1 is a literal, but\
    \ a isn't.\nint b = a + 2; // 2 is a literal, but a and b aren't.\nint c = 1 +\
    \ 2; // 1 and 2 are literals, but c nor 1+2 aren't.\n```\n"
  mdcn: "\n在本书中，我们将一直使用 Java SE，这是因为你反正要在自己的计算机上编程，所以不需要为了运行程序而使用额外的设备。此外，由于 Java\
    \ SE 是最广泛使用的 Java 平台，在这一平台上运行你的程序是有合逻辑的。\n\n## Java 骨架\n\n在编写第一个 Java 程序之前，让我们来看一个\
    \ Java 程序的最小实现：\n\n```\nclass Classname\n{\n    public static void main(String[]\
    \ args)\n    {\n}\n}\n```\n\n类本质上是方法和变量的容器。如果你还记得第 1 章中与手机、功能手机和智能手机的类比，那么类基本上就是一个蓝图，包含了特定对象是什么以及它能做什么。在这一段代码中，`Classname`\
    \ 只是一个占位符，只要文件名随之更改，就可以更改为任何其他名称。\n\n`Classname` 内部的代码块被称为方法。方法基本上是接收某些输入、处理它们并返回输出（可选）的代码块。在代码段中，`main`\
    \ 是方法的名称；`void` 是返回值（意味着它不会返回任何内容）。`main()` 接收一组描述其输入的字符串，并将其存储在名为 `args` 的数组中。\n\
    \n现在你已经有了所需的所有工具，并对 Java 程序模板有了快速了解，你准备好创建你的第一个 Java 程序了！下一章相当短，所以请尽管直接开始，看看你的第一个\
    \ Java 代码迎接世界吧！\n\n## 第 3 章：你的第一个世界程序\n\n按照传统，当你第一次学习一种编程语言时，你的第一个程序会在屏幕上输出“Hello\
    \ World”。尽管如此，这里是你的第一个 hello world 程序的 Java 代码：\n\n```\nclass MyFirstProgram {\n\
    \    public static void main(String[] args) {\n        System.out.println(\"Hello,\
    \ World!\");\n    }\n}\n```\n\n记得将此文件保存为“MyFirstProgram.java”，因为 Java 认为源代码的名称就是程序主类的名称。\n\
    \n在运行程序之前，让我们简单谈一下源代码。`MyFirstProgram` 是程序的类，而 `main()` 是它包含的一个方法。`(main)` 方法内部是\
    \ `System.out.println()` 函数，它基本上会获取你放在内部的任何文本，并将其交给命令行或终端显示。\n\n现在你已经对源代码有一了一定的了解，请使用以下命令编译\
    \ Java 源代码（不过，如果你使用的是 IDE，可能只需要点击程序的“运行”按钮即可让程序编译并运行）：\n\n```\njavac MyFirstProgram.java\n\
    ```\n\n这段代码不应该产生任何错误，但如果产生了错误，请返回源代码检查是否有任何拼写错误的名称、缺失的分号或其他输入错误的命令。\n\n```\njava\
    \ MyFirstProgram\n```\n\n这应该会在屏幕上显示“Hello, World!”。\n\n恭喜你！你创建了你的第一个 Java 程序！这个微章节在让你创建第一个程序的同时，也起到了在我们在之前的章节中学习完所有概念后让你休息一下的作用。此时，最好先休息一下，在继续学习下一章之前快速浏览一下之前的章节，因为下一章将是本书中最长的一章。\n\
    \n## 第 4 章：编程基础\n\n我们已经讨论过 Java 是一种面向对象的编程语言，但在使用对象、类以及其他与 Java 紧密相关的特性之前，我们必须首先掌握\
    \ Java 与其他语言共有的特征，这样你才不会感到困惑和不知所措。\n\n在本章中，我们将讨论：\n\n-   注释 (Comments)\n-   字面量\
    \ (Literals)\n-   标识符 (Identifiers)\n-   数据类型 (Data Types)\n-   变量 (Variables)\n\
    -   数组 (Arrays)\n-   运算符 (Operators)\n-   If-Else 语句\n-   Switch 语句\n-   While\
    \ 和 For 循环 (Loops)\n\n这些特性在几乎每种编程语言中都被认为是必不可少的，但即使你已经上过编程课程并看到了相似之处，请记住，每种编程语言在最基础的数据类型和命名规范上会有差异。如果你确定自己熟悉大多数概念，请确保至少浏览一下本章，以避免在后续章节中产生困惑。\n\
    \n## 注释\n\n注释功能可能是 Java 编程语言中最重要但被严重低估的特征之一。基本上，注释功能允许你输入编译器不会运行的内容。注释的两个最常用用途是：\n\
    \n-   通过取消注释或注释你想要编译器运行的部分以及想要编译器忽略的部分，来“关闭”和“开启”代码段。\n-   向他人（甚至是你未来的自己）对你的代码如何工作提供详细的解释。\n\
    \n用途 1 对于调试和调整程序流程非常有用。通过观察关闭和开启程序的特定部分产生的结果，你可以轻松地定位错误和其他方便的功能。\n\n用途 2 如果你处理超过一千行的\
    \ Java 代码（是的，即使是简单的 Java 也可以有很多行代码）并且有许多人贡献这些代码，则特别有用。想象一下，如果错误隐藏在那些没有注释的代码行中，而你被要求嗅出并消除这个\
    \ bug，将会有多困难。如果没有注释来告诉你大多数晦涩代码段本打算实现什么，可能需要几个月甚至几年时间。现在你已经知道了注释的常见用途以及它们为什么重要，请看看你是如何使用它们的：\n\
    \n### 单行注释，称为 single line\n\n单行注释顾如其名，是指跨越一行的注释。它以 `//` 开始，直到行结束。这里有一个使用稍稍修改过的\
    \ `MyFirstProgram.java` 的示例：\n\n```\nclass MyFirstProgram {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n\
    \        //Outputs the \"Hello, World!\"\n    }\n}\n```\n\n### 多行注释，称为 multiline\n\
    \n如果你需要为代码创建详细的描述，在每行都添加双斜杠会很麻烦。幸运的是，有多行注释可以使多行注释变得简单得多。它以 `/*` 开始，以 `*/` 结束，中间的所有内容都被编译器忽略。这里有一个进一步修改\
    \ `MyFirstProgram.java` 的示例：\n\n```\n/*\n这个程序做了五件事：\n1. 它在屏幕上输出 \"Hello, World\"\
    。\n2. 它创建了一个名为 A 的变量并赋值为 1。\n3. 它创建了一个名为 B 的变量并赋值为 2。\n4. 它创建了一个名为 C 的变量并赋值为 3。\n\
    5. 它将 A、B 和 C 相加并将结果输出到屏幕。\n*/\nclass MyFirstProgram {\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    \
    \    int A = 1;\n        int B = 2;\n        int C = 3;\n        A + B + C;\n\
    \    }\n}\n```\n\n运行此程序后，检查代码是否真的如多行注释说的那样执行。作为一个练习，找出五件事中哪一件没有执行，看看你可以如何修复程序。\n\
    \n注释是确保你的程序保持可读且无错误的好方法，这就是为什么它被如此详细地讨论的原因。接下来的几个章节将会很快，所以请系好带，这将是一段颠簸且快速的旅程！\n\
    \n## 字面量\n\n现在说“当我看到那个非常搞笑的猫视频时，我简直死了”是完全可以的，但在那时，“literally”这个词完全是指某事应该被如实对待。在\
    \ Java 的世界里，这种含义保留了它的纯洁，因为字面量基本上是按原样处理的，而不是不同值的表示形式。例如：\n\n```\nint a = 1; //\
    \ 1 是字面量，但 a 不是。\nint b = a + 2; // 2 是字面量，但 a 和 b 不是。\nint c = 1 + 2; // 1 和\
    \ 2 是字面量，但 c 或 1+2 都不是。\n```\n"
