    HTML 语法的声明始终为“<!DOCTYPE html>”。请记住，这是不区分大小的。来自旧版本的 doctypes 不再使用，因为它们是基于 SGML
    的。


    对于尚无法支持缩短 doctype 的旧版标记生成器仍然可以使用 "<!DOCTYPE html SYSTEM "about:legacy-compat">”。此外，允许使用针对
    HTML4.01、HTML4、XHTML1.1 和 XHTML1 的 doctypes，但不建议这样做。


    对于那些使用 XML 媒体类型的文档，它们始终以标准模式处理，因此可以使用任何 doctype 声明。


    ## SVG 和 MathML


    HTML 语法还支持在文档内使用 SVG 和 MathML 元素。“svg”或“math”起始标签将导致解析器切换到一种特殊的插入模式，将元素和属性放入相应的命名空间中。这还能在元素和属性采用混合大小写的情况下进行修复。它还支持像
    XML 一样使用空元素语法。与之前一样，该语法是不区分大小的。人们也可以省略命名空间声明。


    某些元素会导致解析器切换回 HTML 模式，例如“mtext”和“foreignObject”。当使用这些元素时，程序员可以使用不同的 HTML 元素，或新的“svg”或“math”元素。


    ## 语法中的其他变化


    - 命名为 &lang; 和 &rang; 的字符现在扩展为数学左或右角括号，而不是普通的左或右指向角括号。

    - 空元素现在可以有一个尾随斜杠（这在 HTML4 中被称为“EMPTY”）。

    - 与之前的 HTML4 相比，& 符号（和符号）在更多情况下可以保持不转义。

    - 不同的属性之间需要至少用一个空白字符分隔。

    - 值的空属性必须重写为仅保留名称，不带等号和值。这甚至适用于非布尔属性。

    - 值的省略省略引号的属性允许使用的字符集比之前的 HTML 版本更大。

    - 解析器不会对属性值内的空白字符进行归一化。例如，“id”属性中的前导和尾空格不会被忽略（因此现在被视为无效），而换行符可以在“input”元素的“value”属性中使用，而无需使用字符实体引用。

    - 结束标签“optgroup”现在是可选的。

    - 起始标签“colgroup”也是可选的，可以由 HTML 解析器推断。


    ## 第 2 章：HTML5 中的语言变化


    为了提供更好的结构，HTML5 引入了以下元素：


    - Section - 代表一个通用的应用程序部分或文档。为了指示文档结构，应将其与标题元素（“h1”、“h2”、“h3”等）配合使用。

    - Article - 代表文档内容的独立部分。这可能是一个博客或一篇报纸文章。

    - Main - 代表文档或应用程序主体的主要内容。

    - Aside - 代表与页面其余内容仅部分相关的内容。

    - Header - 代表导航辅助或引言部分。

    - Footer - 代表页面底部的部分，可以包含关于作者的信息、版权许可信息等。

    - Nav - 代表文档中用于导航的区域。

    - Figure - 代表一个自包含的区域，通常包含流式内容。这通常被视为单一单元引用，与主文档不同。

    - Figcaption - 可以作为图片的说明，尽管它是完全可选的。

    - **Template（模板）** - 可声明不同的 HTML 片段，这些片段可以通过脚本克隆并插入主文档中。

    - **Video and Audio（视频和音频）** - 如前所述，用于多媒体内容。它们还允许开发者通过 API 编写自己的界面。如果存在多个类型的不同流，则与“source”元素一起使用。

    - **Track（轨道）** - 提供视频元素中的轨道。

    - **Embed（嵌入）** - 用于插件内容。

    - **Mark（标记）** - 代表被高亮或标记的文本，由于其相关性。

    - **Progress（进度）** - 代表任务的完成情况，在不同的上下文。

    - **Meter（测量值）** - 代表一种测量，例如。

    - **Time（时间）** - 代表时间。

    - **Ruby / Rt / Rp** - 允许 Ruby 注释。

    - **Bdi（双向隔离）** - 代表与周围环境隔离的文本组。

    - **Wbr** - 代表强制换行。

    - **Canvas（画布）** - 用于动态图形的即时渲染，例如。

    - **Datalist（数据列表）** - 与输入结合使用，组合框。

    - **Keygen（密钥生成）** - 代表密钥生成。

    - **Output（输出）** - 代表输出类型，例如计算完成时。


    Input 元素的 Type 属性还有以下新值：

    - Search

    - Tel

    - URL

    - Email

    - Date

    - Range

    - Number

    - Color


    这些新类型的工作原理是，用户代理（即浏览器）可以提供所需的界面。这种界面可能是日历选择器或地址簿。用户代理还应该与服务器通信。这将为用户提供更好的体验。


    ## 第二部分：CSS3


    ## 第 3 章：什么是 CSS3？


    之前我们提到过，无论 HTML 多么先进，如果不使用其他元素，无法创建一个全面的网站或应用程序。其中之一就是 CSS，即级联样式表。


    “级联样式表”本质上是一种用于描述以前用标记语言（如 HTML 或 XHTML）编写的文档格式的语言。CSS 通常用于修改上述语言的网页和其他界面，它实际上可以应用于任何类型的
    XML 文档——甚至是 SVG、XUL 和纯 XML。JavaScript 和 HTML 被认为是许多网站用于制作视觉吸引人的网页、Web 应用用户界面甚至许多移动应用程序的技术基石。


    CSS 的设计初衷是实现文档内容与其样式的分离。这意味着元素（例如颜色、布局和字体）可以放在完全不同的文件中，提高了可访问性并为它们的特性提供了更多的控制和灵活性。这还允许多个
    HTML 页面通过指定相关的 .css 文件来具有相同的格式。


    内容与格式的分离还允许程序员为不同的渲染方法显示相同的标记页面——在打印、屏幕显示、盲文触觉设备上以及通过语音浏览器读取时。程序员还可以根据屏幕大小或设备（无论是手机、平板电脑、笔记本电脑还是台式电脑）显示不同的页面样式。

