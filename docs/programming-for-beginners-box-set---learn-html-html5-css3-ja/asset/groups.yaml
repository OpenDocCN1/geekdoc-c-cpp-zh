    <h4>Heading 4</h4>

    <h5>Heading 5</h5>

    <h6>Heading 6</h6>

    ```


    This is how the headings look like. You can also use the <hr> tag to make a horizontal
    line to make your heading stand out.


    # Heading 1


    ```

    <h1>Heading 1</h1>

    <hr>

    ```


    Note that the <hr> tag does not have a closing tag. The horizontal tag can be
    use not only to your headlines but to paragraphs too.


    Also note that the <head> element is different than the <h1> element. The <head>
    element has nothing to do with the HTML headings. <head> elements are used to
    display meta data which is not displayed to the user.'
