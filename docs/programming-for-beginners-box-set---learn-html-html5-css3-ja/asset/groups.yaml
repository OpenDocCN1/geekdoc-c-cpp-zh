  mdcn: "\n其他几个用于逻辑和条件表达式。\n\n- **变量（Variables）** – 变量本质上是特定数据的容器，它们可以有不同的类型，例如*整数、浮点数、小数、布尔、可空和文本*。记住，特定的数据类型只允许特定的值。\n\
    \n- **表达式（Expressions）** – 表达式可以包括运算符、变量、方法调用和值。根据表达式的组成部分，它可以被分类为*调用表达式、查询表达式、字面量表达式*和*简单名称表达式*。还有一种被称为\
