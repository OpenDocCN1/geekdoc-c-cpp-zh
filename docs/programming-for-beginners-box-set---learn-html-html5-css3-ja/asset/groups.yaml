    22\"),\n  array(\"Jane\", \"Doe\", \"23\"),\n  array(\"Billy\", \"Gates\", \"\
    45\")\n);\n```\n\nThe syntax for multidimensional arrays is:\n\n```php\narray(array(...),\
    \ array(...), etc.);\n```\n\nAnd here is an example of a multidimensional array\
    \ with associative keys:\n\n```php\n$users = array(\n  \"john\" => array(\"name\"\
