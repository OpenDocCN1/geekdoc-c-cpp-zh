    ## 第1章


    ## 什么是 HTML？


    HTML 是 Hyper Text Markup Language（超文本标记语言）的缩写。它最初设计用于方便共享科学研究论文，这就是为什么专业人士通常使用“网页”来描述他们的作品。


    “超文本”（Hyper Text）一词是指可以在计算机屏幕上显示的任何文本，但通常定义包含了链接文档的概念。这就是网页的工作原理。通过超链接（Hyper Links）连接的信息网络。


    现在让我们谈谈 HTML 的另一个部分——“标记语言”（Markup language）术语源于描述内容的计算机代码概念。想象你正在创建一份报纸并需要对其进行组织。首先，你需要给报纸起一个标题，然后你需要为不同的主题添加几个章节。每个章节都需要一个大标题，后面跟着几个较小的小标题，然后我们需要添加几个段落和照片。


    你会发现，构建网页的结构与此非常相似。当你创建内容时，你将需要使用 HTML 将其分为章节、段落等。


    所有的网络浏览器都使用 HTML 来解释和组合文本、图像和其他材料。


    现在让我们来看看编写 HTML 代码所需要的工具。


    ## 第2章

    文本编辑器以及如何使用它们？


    对于为 HTML 以及几乎任何其他编程语言进行编码，我们需要某种文本编辑器。为了本书的目的，我们将使用 Windows 记事本（Note Pad）或可以免费下载的“Note
    Pad ++”，你可以从这里获取它：[http://bit.ly/1Bm4IZm


    我将在书中的所有示例中使用 Note Pad ++ 软件。


    安装过程非常基础，所以我不会解释如何操作。假设你已经下载并安装了文本编辑器，在我们开始编码之前，这里有你需要做的几件事。


    当你打开文本编辑器时，按下 CTRL+ N 打开一个新的工作窗口。在我们写下第一行代码时，我们将检查它的看起来如何。为了做到这一点，你必须去左上角点击“文件”（File）。点击“另存为...”（Save
    As...），选择你想保存文件的位置。在保存之前


    | 文件名 | 另存为 |

    | :--- | :--- |

    | .html | Hyper Text |


    现在是开始基础知识了。


    ## 第3章

    HTML 基础


    ## 第4章

    HTML 元素


    正如你在上一章中看到的，HTML 元素是用起始标签、结束标签以及中间的内容编写的。HTML 元素是指从起始标签到结束标签的所有内容。


    使用与上一章相同的示例：


    ```

    <!DOCTYPE html>

    <html>

    <body>


    <h1>我的第一个标题</h1>

    <p>我的第一个段落。</p>


    </body>

    </html>

    ```


    ## 我的第一个标题


    我的第一个段落。


    这是我们第一个且基础的 HTML 网页。在下一章中，我们将讨论 HTML 元素。


