    \ `alt` 属性的值。\n\n注意，我们始终为图片的宽度和高度设置 `style`。这可以防止其他样式表更改图片的原始尺寸（除非你想加入的话）。样式表用于\
    \ CSS 样式设置，我们将在该系列的第二本书中详细讨论它们。\n\n通常，浏览器期望图片与网页位于同一个文件夹中。然而，如果你想使用来自另一个文件夹的图片，你必须在\
    \ `src` 属性中包含文件夹名称，如下所示：\n\n```\n<img src=\"images/facebookloggo.jpg\" alt=\"\
    Oops image is missing!\" style=\"width:128px; height:128px\">\n```\n\n我已经在上一章向你展示了如何将图片作为链接。你只需要将图片标签嵌套在链接标签内部。\n\
    \n```\n<a href=\"www.facebook.com\">\n<img src=\"facebookloggo.jpg\" style=\"\
    width:50px; height:50px; border:0\">\n</a>\n```\n\n## 第 12 章\n### HTML 表格\n\n\
    表格在 HTML 中非常常用。它们用 `<table>` 标签定义，并通过 `<tr>` 标签分为表格行。表格行通过 `<td>` 标签分为表格单元格，也可以通过\
    \ `<th>` 标签分为表格表头。\n\n这里有一个示例：\n\n```\n<table style=\"width:100%\">\n  <tr>\n\
    \    <td> John</td>\n    <td> Peter </td>\n  </tr>\n  <tr>\n    <td> Fema </td>\n\
    \    <td> Nikol </td>\n  </tr>\n</table>\n```\n\n我们有一个表格，包含两行，每行都包含两个表格数据（`<td>`）。\n\
    \n通过将宽度设置为 100%，我们确保它将始终占据浏览器窗口的 100%。但目前，它看起来并不像我们熟悉的表格。\n\n我们需要添加一些边框。我们通过在\
    \ `<table>` 标签内定义 `border` 值来实现。\n\n```\n<table border=\"1\" style=\"width:100%\"\
    >\n```\n\n如果你不指定边框，表格将不带边框显示。使用 CSS 边框属性会更好且更受推荐，因为 HTML 的边框属性正在过时。你可以在我即将出版的关于\
    \ CSS 样书中学习关于它们的所有知识。\n\nHTML 表格表头默认显示为粗体并居中。它们的语法如下：\n\n```\n<table border=\"\
