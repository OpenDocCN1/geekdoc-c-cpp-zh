    Notice the HTML5 elements in the markup:


    +   - There is just one doctype.

    - The tag “header” has been wrapped around all intro elements, including logos
    and page titles. In other applications, this can also include a table of contents,
    or even search forms.

    - The nav tag, which is meant to contain different navigational elements (including
    but not limited to specialized navigation such as previous/next links).

    - The section tag, which is meant to denote different sections within the document.
    This can contain different markup types, and different sections can also nested
    against each other.

    - The aside tag is used to wrap contents that are related to its main body may
    also stand on their own. This is why we are using this as for the blog''s side
    bar.

    - The footer tag, which can contain more information regarding the blog''s main
    content (including but not limited to the author of the site, related document
    links, copyright information, etc.)


    Unlike previous HTML versions, we are no longer using div tags to contain the
    different sections. Semantic tags are now being used, making the page more visible
    to search engines as well as making theme more accessible on screen readers.'
