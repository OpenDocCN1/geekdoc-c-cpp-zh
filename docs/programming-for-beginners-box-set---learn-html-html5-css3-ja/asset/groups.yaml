    \n## 第 9 章\n### HTML 格式\n\nHTML 还使用特殊元素来定义具有特殊含义文本。HTML 格式如下：\n\n-   **粗体**：用\
    \ `<b>` 元素定义粗体。没有结束标签。\n-   **强**：用 `<strong>` 元素定义具有语义重要性的强文本。没有结束标签。\n-   *斜体*：用\
    \ `<i>` 元素定义没有重要性的斜体文本。没有结束标签。\n-   强调：用 `<em>` 元素定义具有额外语义的强调文本。没有结束标签。\n-   **标记**：用\
    \ `<mark>` 元素定义标记或高亮文本。没有结束标签。\n-   **小字**：用 `<small>` 元素定义小文本。没有结束标签。\n-   **删除文本**：用\
    \ `<del>` 元素定义被删除的文本。没有结束标签。\n-   **插入文本**：用 `<ins>` 元素定义插入的文本。没有结束标签。\n-   **下标**：用\
    \ `<sub>` 元素定义下标文本。没有结束标签。\n-   **上标**\n\n我们都知道链接是什么，并且我们几乎在每一个网页上都见过它们。\n\nHTML\
