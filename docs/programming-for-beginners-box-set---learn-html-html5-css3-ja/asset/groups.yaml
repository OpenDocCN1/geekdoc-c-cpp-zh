    - 3. 功能手机的通用功能是什么


    这引出了“继承”的概念，这是面向对象编程中的一个重要概念。注意智能手机和功能手机都具有手机的功能，并且具有一些额外的功能，这值得创建一个新的子类，该子类继承手机的所有功能，同时仍然能够包含它们特有的额外功能。


    **多态。** 关于智能手机和功能手机继承的手机通用功能，请注意，在可用的表情符号、多媒体能力等方面，智能手机发送短信的方式与功能手机有所不同。这是因为智能手机和功能手机上短信应用程序的实现发生了，覆盖了原始手机的默认实现。然而，如果有人向你借用手机发短信，你可以给他一部智能手机或功能手机，尽管它们在短信功能的实现上有所不同，但这两者都是可以接受的。这种现象在
    Java 世界中被称为多态；如果你的代码中某个部分请求某个特定类的对象，它将接受来自该类子类的对象。


    哇！这要吸收的内容真多！现在我们已经讨论了面向对象编程中最两个困难但又重要的概念，我们可以在进入“类”和“对象”的概念时稍微放松一下了：


    **类。** 你列出的手机、功能手机和智能手机的功能基本上告诉你，任何以被视为手机、功能手机或智能手机为目标而制造的对象都必须包含所有列出的功能。类充当蓝图的角色，基本上告诉你当你从它们中创建对象时应该期待什么。


    **对象。** 对象是 Java 的构建块。当制造手机、功能手机或智能手机时，它们有自己的内存，并随着人们使用频率的增加，最终会产生划痕和凹痕。这意味着尽管制造了成百上万部手机、功能手机或智能手机，每一部都会随着持续的使用而变得更加独特。简而言之，对象是从蓝图（类）制造出来的。


    **什么是 Java？**


    就像人类语言一样，编程语言也有许多不同的种类，其中一种就是 Java。作为一种面向对象的的编程语言，对象、类、继承和多态的概念也适用于 Java。


    Java 是迄为止最流行的编程语言之一。大多数入门编程书籍和课程都使用 Java 来说明编程中的不同概念，因为它易于使用、灵活且应用广泛。


    在初次学习编程时也会想到的另外两种编程语言：C 和 Python。然而，C 处于光谱中较困难的一侧，而 Python 处于较容易的一侧。Java 从根本上是不同的——C
    是一种过程化的、面向函数的语言，这意味着它适合需要易于添加新函数或操作的程序；而 Python 可以是过程化的，也可以是面向对象的，但可能会给初学者一个过高难以学习编程基础的脚手架。


    # 结论


    你已经对编程概念、面向对象编程概念以及 Java 有了一个快速的概述。虽然这一章并不是对这三个重要主题进行彻底论述，但它应该足够帮助你理解我们本书中将讨论的大部分内容。下一章将讨论如何准备你的计算机以编写、编译和运行
    Java 代码，所以请休息一下，在你准备好深入探索 Java 世界时再回来。


    # 第 2 章：为 Java 配置你的计算机


    欢迎回来。记得在第 1 章中你已经从零开始了 Java 的介绍。在本章中，我们将为你的计算机配置 Java，这样你就可以编写、编译和运行 Java 代码，而不会遇到与代码创建无关的问题。在本章结束时，你应该拥有创建第一个
    Hello World 程序所需的所有工具，坚持住，除非你确定已经拥有所需的所有工具，否则不要跳过这一章！


    # 设置


    在任何编程语言中，你都需要三样东西：


    - 1. 能够让你编写代码的东西

    - 2. 能够将你编写的内容转换为计算机能理解的东西

    - 3. 能够运行你的程序的东西


    让我们一个一个地过一遍它们：


    **能够让你编写代码的东西。** 基本上我们说的是某种文本编辑器。计算机上默认安装的编辑器绝对可以编写 Java 代码，但到目前为止，只有 Linux 操作系统拥有语法高亮功能且易于使用的文本编辑器。语法高亮基本上意味着变量、类名等以不同的颜色显示，使代码看起来更顺目。尽管如此，以下是编写
    Java 代码的一些最佳文本编辑器：


    - a. Notepad++ - Notepad++ 是 Windows 上最广为人知的文本编辑器之一，因为它是免费的，并且可以从闪存盘甚至 Dropbox
    运行。它支持多种编程语言，正如其名所示，它可以完全取代预装的记事本应用程序。简而言之，它是免费的、使用快速且灵活的，如果你有 Windows 系统，没有理由不安装这个程序。

    - b. Atom - Atom 是由程序员为程序员创建的最强大的文本编辑器之一。许多程序员喜欢这个文本编辑器，因为它不仅在外观上高度可定制，在行为上也是如此。Atom
    的加载时间确实比 Notepad++ 长，但一旦运行起来，你绝对不会感到任何卡顿。Atom 运行在 Windows、Mac 和 Linux 上。

    - c. Vim - Vim 被称为 Vi 的简化版。许多程序员喜欢这个文本编辑器，因为它的界面是高度自定义的。

    - d. Eclipse - 技术上不是文本编辑器，而是一个集成开发环境 (IDE)。在本书中建议你坚持使用文本编辑器，以免过度依赖 Eclipse。只需点击一下，Eclipse
    就能编译并运行你的代码。


    # 将你编写的内容转换为计算机理解的东西


    我们需要一个编译器，它将你的 Java 源代码转换为虚拟机理解的内容（字节码），以便其运行。你需要从 oracle.com 获取最新的 Java 开发包 (JDK)。该工具包是免费的，并包含简单的安装方案（对于
    Windows 用户，你需要更新 PATH 变量。别担心，这样做的方法也很简单），但请下载与你的操作系统对应的 Java 标准版。


    # 运行程序


    在编程中，平台是一组帮助运行 Java 语言程序的程序。Java 包含一个通常称为虚拟机的执行引擎和一个编译器，它们确保你编写的程序在不同的操作系统和硬件上以相同的方式运行。简而言之，Java
    程序并不直接从操作系统运行，尽管看起来是那样；它们运行在一个平台上，确保程序不会因为用户更改了处理器或升级操作系统而崩溃。


    # Java 的三个平台


    根据设备类型，有不同的 Java 平台可以选择：


    - Java Card - 这个平台是新的，它适用于运行程序（微型 Java 程序）在内存有限的智能卡等设备上。

    - Java 标准版 (Java SE) - 该平台用于创建可以在桌面计算机和网络浏览器上运行的标准 Java 应用程序。

    - Java 企业版 (Java EE) - 该平台构建在 Java SE 之上。从名称来看，如果你运行服务器，它是非常有用的，因为它允许你创建服务器应用程序。

    - Java 微型 (Java ME) - 该平台同样构建在 Java SE 之上。从名称来看，如果你需要为嵌入式设备 (Xlets)、移动信息设备 (MIDlets)
    以及任何其他显示、存储和功率有限的设备创建 Java 应用程序，它是非常有用的。


