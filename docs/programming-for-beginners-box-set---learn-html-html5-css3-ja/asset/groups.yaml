    Because search engines use your headings to index the structure and content of
    your page it is very important to use them as intended. In other words... don’t
    use them to make your text big or bold.


    HTML headings are defined with the <h1> to <h6> tags. The <h1> is the bigger one,
    and going down to <h6> which is the smallest.


    ![](img/f1f3317e3c574b724055b1c9e128d700_15_0.png)


    ```

