    # CSS Browser Support


    Not all browsers can correctly parse all CSS codes. Because of this, coding techniques
    known as “CSS hacks” can either filter or target (or both) specific browsers.
    These are generally known as CSS filters, and can be used to show or hide certain
    parts of the CSS to certain browsers -- achieved by exploiting the CSS handling
    bugs in each browser (or taking advantage of the lack of support for a few parts
    of the many CSS specifications.


    Through these filters, some programmers have gone as far as delivering different
    style sheets to certain browsers. This technique will ensure that the design will
    render as the programmer expects.


    Some programmers also use CSS filters in order to prevent old browsers from seeing
    the CSS completely. This is because such old browsers are in the first place incapable
    of rendering CSS properly.


    Despite the availability of many CSS-compliant browsers, there are still a lot
    of programmers who struggle with those that do not. This turns what would have
    been a viable technology into something that is more costly and complex than is
    originally intended.


