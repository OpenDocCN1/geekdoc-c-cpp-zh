    # Performing Mathematical Operations


    Writing the methods and expressions that will perform operations is pretty selfexplanatory.
    For example, if you want to add the values of variables x and y, you will be using
    the following syntax after the variables are declared and assigned values. You
    can print the resulting number directly using the Console.Write function with
    the following syntax:


    ```

    Console.Write("The sum is " + (x + y));

    ```


    Remember that you need to enclose the arithmetic operation you want to perform
    in parentheses. Otherwise, the Console.Write function will understand the values
    of x and merely as extensions of the line to be written. For example, if x = 1
    and y = 2 , these will be the results:


    ```

    Console.Write("The sum is " + x + y)); /* **The ensuing output will be The sum
    is 12** */

    ```


    ```

    Console.Write("The sum is " + (x + y)); /* **The ensuing output will be The sum
    is 3** */

    ```


    Alternatively, you can store the resulting number into another variable. This
    way, you can prevent having to add + (x + y); every time you want to print the
    sum of the two variables. Storing it to a separate variable will also allow you
    to use its value to perform further operations.'
