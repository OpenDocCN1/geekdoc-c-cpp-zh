    - natcasesort – it sorts arrays though a natural order algorithm that is not case\
    \ sensitive\n- next – it advances internal array pointers\n- prev – it rewinds\
    \ internal array pointers\n- pos – it is another term for current\n- range – it\
    \ creates arrays that contain a wide variety of elements\n- rsort – it sorts arrays\
