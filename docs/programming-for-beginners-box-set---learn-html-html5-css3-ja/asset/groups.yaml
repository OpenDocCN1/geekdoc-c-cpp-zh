    # Chapter 6: Numbers and Mathematical Operations


    The data types integer and float are numbers and can be stored in variables.


    For example:


    ```

    $int = 5;

    $float = 11.4;

    ```


    In PHP, values are automatically stored as the appropriate data types. You can
    also perform mathematical operations. You simply have to indicate the mathematical
    operations by using a mathematical operator and two numbers.


    For example, you can use the plus (+) sign operator.


    ```

    2 + 3

    ```


    You can also use variables.


    ```

    $var2 + $var3;

    ```


    If you want to use numbers in your mathematical operations, however, you should
    not enclose them in quotes when you assign them to variables. If you use quotes,
    you will set the numbers as character strings and you will not be able to perform
    mathematical operations on these character strings. Unlike other languages, PHP
    automatically converts strings to numbers.


    Consider the following example:


    ```

    $var1 = "2";

    $var2 = 4;

    $total = $var1 + $var2;

    ```


    It is obviously not possible to add the two given numbers because $var1 is a character
    string. Nevertheless, because string is automatically converted to a number in
    PHP, the numbers are added upon reaching the third statement. If you use these
    statements, the strings will be converted and the numbers will be added.


    ```

    $var1 = "y";

    $var2 = 4;

    $total = $var1 + $var2;

    ```


    Since y is not a number that can be converted in PHP, 0 is used in the addition
    process. Hence, the result of $total becomes 4. More than not, such conversion
    is not what programmers expect. You should still be careful when you depend on
    the automatic conversion feature in PHP because there are times when you will
    not get the result that you expect, such as in the example given above.


    In addition, you can get unexpected results because PHP does not understand human
    notation. If you use the following example, you can get an incorrect result:


    ```

    $var1 = "3,000";

    $var2 = 3;

    $total = $var1 + $var2;

    ```


    You may understand commas and their function, but PHP does not. If you use a comma
    in your code, PHP will automatically stop reading at the comma. So if you execute
    the code given above, your $Total will be read as 3 and not 3,000.


    # Mathematical Operators


    - + represents the addition process. It is used to add numbers.

    - - represents the subtraction process. It is used to subtract the second number
    from the first one.

    - * represents the multiplication process. It is used to multiply numbers.

    - / represents the division process. It is used to divide the first number by
    the second number.

    - % is called the modulus. It identifies the remainder when you do the division
    process.


    # The Order of Operations


    It is possible to perform multiple mathematical operations all at once. Take a
    look at the following example:


    ```

    $total = 2 + 3 * 4 + 2;

    ```


    Keep in mind that the order of your mathematical statement is crucial. You may
    get a different output. Hence, you have to be careful when you use mathematical
    operators in your code. In PHP, division and multiplication are performed first.
    Then, subtraction and addition are done. Also, PHP can start from the left towards
    the right if all other considerations are equal.


    If you run the code above, you will get an output of:

    16


    You get because PHP performs the multiplication process first. In $total = 2 +
    3 * 4 + 2, 3 is done first. So multiplying 3 by 4, you get 12. Since the other
    operators for addition, PHP reads the code from the left. It adds 2 to 12, which
    is the result of 3 * 4. Finally, it performs the last addition process. 2 + 12
    is 14, and that is added to 2, so you get 16.


    If you want to change the order of operations, you can use parentheses. When you
    use a parenthesis, whatever is inside it will be performed first. Take a look
    at the following example:


    ```

    $total = (2 + 3) * 4 + 2;

    ```


    If you run this code, you will get an output of:

    22


    You get 22 because 2 + 3 is performed first since they are within the parenthesis.
    Adding 2 and 3 results in 5, which is then multiplied by 4. Your code practically
    becomes (5) * 4 + 2. As mentioned earlier, the multiplication and division processes
    are performed first by default. However, it is also possible to use a set of parenthesis
    within another set of parenthesis. You can do this if you want to change the order
    of operations within that set of parenthesis. Ideally, if your mathematical statement
    has more than one answer, you should use parentheses where they are necessary.


    # Increments and Decrements


    In PHP, you can use a shortcut to add 1 to a variable. Consider the following
    example:


    ```

    $counter = $counter + 1;

    ```


    Likewise, you can write a shorter code that performs exactly the same operation:


    ```

    $counter++;

    ```


    Take a look at this example:


    ```

    $counter = 0;

    $counter++;

    echo $counter;

    ```


    If you run the above code, you will get an output of:


    ```

    1

    ```


    If you run the above code, you will get an output of:

    1


    This is because $++ adds 1 to the value. Similarly, you can subtract 1 from a
    variable using --.


    ```

    $counter = $counter - 1;

    ```


    $counter--;

    ```


    Likewise, you can write a shorter code that performs exactly the same operation:


    ```

    $counter--;

    ```


    Take a look at this example:


    ```

    $counter = 10;

    $counter--;

    echo $counter;

    ```


    If you run the above code, you will get an output of:


    ```

    9

    ```


    This is because $-- subtracts 1 from the value. Similarly, you can add a number
    to a variable using +=.


    ```

    $counter = $counter + 5;

    ```


    Likewise, you can write a shorter code that performs exactly the same operation:


    ```

    $counter += 5;

    ```


    Take a look at this example:


    ```

    $counter = 10;

    $counter += 5;

    echo $counter;

    ```


    If you run the above code, you will get an output of:


    ```

    15

    ```


    This is because += adds the specified value to the variable. Similarly, you can
    multiply a variable by a number using *=.


    ```

    $counter = $counter * 2;

    ```


    Likewise, you can write a shorter code that performs exactly the same operation:


    ```

    $counter *= 2;

    ```


    Take a look at this example:


    ```

    $counter = 10;

    $counter *= 2;

    echo $counter;

    ```


    If you run the above code, you will get an output of:


    ```

    20

    ```


    This is because *= multiplies the variable by the specified value. Similarly,
    you can divide a variable by a number using /=.


    ```

    $counter = $counter / 2;

    ```


    Likewise, you can write a shorter code that performs exactly the same operation:


    ```

    $counter /= 2;

    ```


    Take a look at this example:


    ```

    $counter = 10;

    $counter /= 2;

    echo $counter;

    ```


    If you run the above code, you will get an output of:


    ```

    5

    ```


    This is because /= divides the variable by the specified value.


    # Built-In Mathematical Functions


    In PHP, there are many built-in functions to perform various mathematical operations.
    Here are some of the most commonly ones:


    - abs() : Returns the absolute value of a number.

    - ceil() : Rounds a number up to the nearest integer.

    - floor() : Rounds a number down to the nearest integer.

    - round() : Rounds a number to the nearest integer.

    - pow() : Returns the value of a number raised to a power.

    - sqrt() : Returns the square root of a number.

    - rand() : Returns a random integer between a specified range.

    - max() : Returns the highest value in an array of numbers.

    - min() : Returns the lowest value in an array of numbers.

    - array_sum() : Returns the sum of values in an array.

    - pi() : Returns the value of the constant PI.

    - log() : Returns the natural logarithm of a number.

    - log10() : Returns the base-10 logarithm of a number.

    - exp() : Returns the value of e raised to the power of a number.


    For example:


    ```php

    echo abs(-5); // Output: 5

    echo ceil(3.1); // Output: 4

    echo floor(3.9); // Output: 3

    echo round(3.5); // Output: 4

    echo pow(2, 3); // Output: 8

    echo sqrt(16); // Output: 4

    echo rand(1, 10); // Output: a random number between 1 and 10

    echo max(1, 5, 2, 9); // Output: 9

    echo min(1, 5, 2, 9); // Output: 1

    echo array_sum([1, 2, 3, 4]); // Output: 10

    echo pi(); // Output: 3.141592653589793

    echo log(10); // Output: 2.302585092994046

    echo log10(100); // Output: 2

    echo exp(2); // Output: 7.38905609893065

    ```

