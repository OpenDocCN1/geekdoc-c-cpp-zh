    # Chapter 1: A First Look at Java


    Java is an object-oriented programming language that has a wide range of applications.
    However, if this is the first time you''ve come across Java or even programming,
    you may not be able to appreciate this definition. With that in mind, in this
    chapter we''re going to tackle programming terminologies and definitions so that
    you don''t end getting overwhelmed by the succeeding chapters.


    # What is a Programming Language?


    Language, at its very core, is a way for humans to communicate. With the limited
    power of computers we can''t easily learn how to interpret human language, especially
    with tone, facial expressions, and colloquialisms having the ability to give different
    meanings to a single statement. With that in mind, programming languages were
    born, with the complexities of the human language stripped leaving you with structured,
    rigid statements that leave no room for misunderstanding.


    Basically, a programming language is a way for humans to communicate with computers.


    # What is Object-Oriented Programming?


    Inheritance. One of the best ways to learn programming concepts is to connect
    them to real world examples, let''s start our discussion with inheritance using
    three simple questions:


    How would you describe a cellular phone?


    Typical answers would include: “It makes calls,” ”It can send text messages,”
    ”It has a battery.”


    How would you describe a smartphone?


    Typical answers would include: “It makes calls, ”It can send text messages, ”It
    can take pictures, ”It can run Facebook, Instagram, Twitter, and other apps, ”It
    has a short battery life.”


    How would you describe a dumb-phone?


    Typical answers would include: “It can make calls, ”It can send text messages,”
    ”It has a long battery life, ”It has an alphanumeric keypad, ”It has a small screen.”


    After answering these questions, you should now have a general idea of the following:'
- md: '

    - 1. What a cellular phone''s general features are

    - 2. What a smartphone''s general features are

    - 3. What a dumb-phone''s general features are


    Which brings us to the idea of inheritance, an important concept in object-oriented
    programming. Notice how both smartphones and dumb-phones have the features of
    a cellular phone, with some additional features that merit creating a new subcategory
    that inherits all the features of a cellular phone while still being able to contain
    additional features exclusive to them.


    **Polymorphism.** As for the general features of a cellular phone that the smartphones
    and dumb-phones inherit, notice how smartphones can send text messages in a different
    manner compared to dumb-phones in terms of the available emoticons, multimedia
    capabilities, etc. This is because the changes in the implementation of the text
    messaging applications on the smartphone and dumb-phone override the default implementation
    in the original cellular phone. However, if a person asks to borrow a cellular
    phone for text messaging, you could give him a smartphone or a dumb-phone, both
    of which are acceptable despite containing somewhat differing implementations
    of the text-messaging feature. This phenomenon is known as polymorphism in the
    Java world; if something in your code asks for an object from a certain class,
    it''ll accept the one even from its subclass.


    Wow! That''s quite a lot to take in! Now that we have talked about two of the
    most difficult yet important concepts in object-oriented programming, we can afford
    to relax a bit as we cruise into the concept of classes and objects:


    **Classes.** The features you''ve listed for the cellular phone, dumb-phone, and
    smartphone basically tell you that any object manufactured with the aim of being
    considered a cellular phone, a dumb-phone, or a smartphone must contain all of
    those listed features. Classes serve as blueprints and basically tell you what
    to expect when you create an object from them.


    **Objects.** The objects are the building blocks of Java. When cellular phones,
    dumb-phones, or smartphones are manufactured, they have their own memory and eventually
    earn scratches and dents as people use them more frequently. This means that despite
    a hundred or even a million cellular phones, dumb-phones, or smartphones being
    manufactured, each one will be more unique with continued usage. In short, objects
    are the products manufactured from the blueprint (class).


    **What is Java?**


    Like human languages, programming languages come in many different flavors, or
    we of which is Java. Being an object-oriented programming language, the concepts
    of objects, classes, inheritance, and polymorphism apply to Java as well.


    Java is one of the most popular programming languages to date. Most introductory
    programming books and courses use Java to illustrate different concepts in programming
    because of its ease, flexibility, and wide range of applications.


    Two other programming languages that also come to mind when learning programming
    for the first time: C and Python. However, C lies on the more difficult side of
    the spectrum whereas Python lies on the easier side of the spectrum. Java are
    fundamentally different – C is a procedural, function-oriented language, which
    means that it''s good for programs that need new functions or operations added
    easily, and Python can be procedural, object-oriented, but may give the beginner
    a scaffolding too high to learn the basics of programming.


    # Conclusion


    You''ve been given a rather quick overview on the concept of programming, the
    concepts of object-oriented programming, and Java. While this chapter is by no
    means a thorough discourse in these three important topics, it should be enough
    to help you understand majority of the stuff we''re going to be talking about
    throughout this book. The next chapter is going to talk about getting your computer
    ready for writing, compiling, and running Java code, so take a break and come
    back when you''re ready to dive deeper into the world of Java.


    # Chapter 2: Setting Up Your Computer for Java


    Welcome back. Recall that in Chapter 1 you''ve been given an introduction to Java
    from the ground up. In this chapter, we''re going to set your computer up for
    Java so that you can write, compile, and run Java code without problems unrelated
    to the creation of code itself. At the end of this chapter, you should have all
    the tools you need to create your first Hello World program, hang in there and
    do not skip this chapter unless you''re sure that you already have all the tools
    you need!


    # The Set-Up


    In any programming language, there are three things you need to have:


    - 1. Something that lets you write code

    - 2. Something that converts what you wrote into something the computer understands

    - 3. Something that runs your program


    So let''s go through them one by one:


    **Something that lets you write code.** Basically we''re talking about some sort
    of text editor. The default one installed on your computer can definitely write
    Java code, but to date, only Linux operating systems have text editors that can
    syntax highlighting capabilities while being easy to use. Syntax highlighting
    basically means variables, class names, etc. are colored differently to making
    a code easier on the eyes. That being said, here are some of the best text editors
    for writing Java code:


    - a. Notepad++ - Notepad++ is one of the most well known text editors for Windows
    because it''s free and it could run from flash drives or even from Dropbox. It
    supports a wide variety of programming languages, and as name suggests, it can
    completely replace the preinstalled notepad application. In a nutshell, it''s
    free, fast to use, and flexible, if you have a Windows system, there is no reason
    not to have this program installed.

    - b. Atom - Atom is one of the most powerful text editors created for programmers,
    by programmers. A lot of programmers love this text editor because it''s highly
    customizable not only in how it looks, but also how it behaves. Atom definitely
    takes longer to load Notepad++, but once it''s running, you definitely won''t
    feel a hiccup. Atom runs in Windows, Mac, and Linux.

    - c. Vim - Vim is known as a simpler version of Vi. A lot of programmers prefer
    this text editor because the interface is highly customizable.

    - d. Eclipse - technically not a text editor, but an Integrated Development Environment
    (IDE). In this book it''s recommended that you stick to using text editors so
    you''ll learn not to depend too much on Eclipse. With a single click, Eclipse
    compiles your code and runs it.


    # Something that converts what you wrote into the computer understands


    We need a compiler, which converts your Java source code into something the Java
    Virtual Machine understands (bytecode) so that it can. You''ll need to get the
    latest Java Development Kit (JDK) from oracle.com. The kit is free and contains
    a straightforward installation scheme (for Windows users, you''ll need to update
    PATH variable. Don''t worry though; instructions for doing this are also straightforward),
    but remember to download the Java Standard Edition that corresponds to your operating
    system.


    # Something that Runs Program


    In programming, a platform is a bunch of programs that help run programs in the
    Java programming language. Java contains an execution engine commonly referred
    to as a virtual machine, and a compiler that makes sure that the programs you
    write will work the same way for computers with different operating systems and
    hardware. In nutshell, Java programs don''t run directly from the operating system
    even though it appears so; they run on top of a platform that makes sure the programs
    don''t end up crashing because a user changed their processor or upgraded their
    operating system.


    # The Three Java Platforms


    There are different kinds of platforms in Java to choose from depending on the
    type of device:


    - Java Card – this platform is new again, and it applies to applets, which are
    tiny Java-based programs, to run on devices with limited memory like smart cards.

    - Java Standard Edition (Java SE) – this platform is used for creating standard
    Java applications that can run on desktop computers and web browsers.

    - Java Enterprise Edition (Java EE) – this platform is built on top of Java SE.
    From its name, it''s useful if you''re running a server, as it allows you to create
    server applications.

    - Java Micro Edition (Java ME) – this platform built on top of Java SE as well.
    From its name, it''s useful if you need to create Java applications for embedded
    devices (Xlets), for mobile information devices (MIDlets), and basically any other
    devices that have limited display, storage, and power.

