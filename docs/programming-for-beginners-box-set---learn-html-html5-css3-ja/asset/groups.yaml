    # Chapter 4: A Blog Page


    In this section, we will use the HTML and CSS concepts to create a hands-on project,
    using advanced techniques. The project will be the creation of a blog page. The
    instructions aim to show how a programmer can build websites with HTML5 and CSS3
    specs are used (assuming, of course, that the web browser used to view the project
    has implemented these specifications).


    Before marking up using HTML, it is important to get the overall structure of
    the blog page straight. Do you want the title to be on the center of flushed to
    the left? Should the sidebar be on the left, or right? Such decisions are important.


    Let us take a look at a sample markup:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Insert Blog Title Here</title>

    </head>

    <body>

    <header>

    <h1>Insert Page Title Here</h1>

    </header>

    <nav>

    <!-- This contains your navigation bar -->

    </nav>

    <section id="Introduction">

    <!-- This contains your introduction -->

    ```'
