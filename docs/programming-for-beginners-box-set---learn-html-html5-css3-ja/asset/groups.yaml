- md: '

    The declaration for the HTML syntax is always “<!DOCTYPE html>”. Always remember
    that this is case-insensitive. Doctypes coming from previous versions are no longer
    used, since the languages are SGML-based.


    For the legacy markup generators that are of yet unable to support the shortened
    doctype, a "<!DOCTYPE html SYSTEM "about:legacy-compat">" can still be used. In
    addition, doctypes meant for HTML4.01, HTML4, XHTML1.1 and XHTML1 are allowed
    but discouraged.


    For those documents using the XML media type, they are always handled in standard
    mode so any doctype declaration can be used.


    ## SVG and MathML


    The HTML syntax also supports SVG and MathML elements to be used within the document.
    An "svg" or "math" start tag will cause the parser to change to a special mode
    of insertion, putting the elements and the attributes within the appropriate namespaces.
    This also does the fixups in case elements and attributes have a mixed case. This
    also supports empty-element syntax like XML. Like before, the syntax is case-insensitive.
    One can also omit the namespace declarations.


    There are certain elements that will cause the parser to switch back to HTML mode,
    such as "mtext" and "foreignObject". When these are used, the programmer can use
    different HTML elements, or new "svg" or "math" element.


    ## Other changes in the syntax


    - The characters named "&lang;" and "&rang;" now expand to mathematical left or
    right angle brackets instead of the usual left or right pointing angle brackets.

    - Void elements can now have a trailing slash (this is known as “EMPTY” in HTML4).

    - The & sign (ampersand) can be left unescaped in more instances, compared to
    preceding HTML4.

    - The different attributes need to be separated by at least one whitespace character.

    - The different attributes with an empty value must be rewritten as just the name,
    without the equals sign and value. This applies even to attributes that are not
    boolean attributes.

    - Attributes that omit quotes for the values are allowed to use a larger character
    set compared to the preceding HTML versions.

    - The parser does not do normalization of whitespace within attribute values.
    For example, leading and trailing whitespaces in the “id” attribute are not ignored
    (and therefore now considered invalid) while newline characters may be used in
    the “input” element’s “value” attribute without the character references.

    - The end tag “optgroup” is now optional.

    - The start tag “colgroup” is also optional, and may be inferred by the HTML parser.


    ## Chapter 2: Language Changes in HTML5


    The following elements have been introduced in HTML5, in order to provide better
    structure:


    - Section - This represents a generic application section or document. To indicate
    the document structure, this should be used with the header elements (“h1”, “h2”,
    “h3”, etc.).

    - Article - This represents an independent part of the document’s content. This
    may be a blog, or a newspaper article.

    - Main - This represents the main content of the document’s or application’s body.

    - Aside - This represents a part of the content that is only a bit related to
    the rest of the page’s content.

    - Header - This represents navigational aids or an introductory section.

    - Footer - This represents a section of the page at the bottom, that can contain
    information about the author, information on copyright permissions, etc.

    - Nav - This represents a section of the document meant for navigation.

    - Figure - This represents a section that is self-contained, and usually contains
    flow contents. This is usually referenced as a single unit, different from the
    main document.

    - Figcaption - This can be used as a caption for the figure, though it is completely
    optional.

    - **Template** - This can be used to declare different HTML fragments, which can
    be clones and inserted by script into the main document.

    - **Video and Audio** - As mentioned earlier, this is meant for multimedia content.
    They also allow developers to script their own interface, through APIs. Used together
    with "source" elements if there are different streams available of multiple types.

    - **Track** - This provides tracks of text for the video elements within the page.

    - **Embed** - This is used for plugin contents.

    - **Mark** - This represents the run of text within one document that is highlighted
    or marked for reference purposes. This is usually due to its relevance in another
    context within a different context.

    - **Progress** - This will represent a task''s completion. This includes tasks
    such as downloading, or when doing.

    - **Meter** - This represents a measurement, such as.

    - **Time** - This represents any time.

    - **Ruby / Rt / Rp** - This allows for Ruby annotations.

    - **Bdi** - This represents a group of text that is isolated from the surroundings.

    - **Wbr** - This stands for a line break.

    - **Canvas** - This is used for on-the-fly rendering of dynamic graphics, such
    as.

    - **Datalist** - This, in combination with input, can be used in comboboxes.

    - **Keygen** - This represents the key generation.

    - **Output** - This will represent a type of output, such as when calculation
    has been completed.


    The Type attribute of Input element also has the following new values:

    - Search

    - Tel

    - URL

    - Email

    - Date

    - Range

    - Number

    - Color


    These new types work under the idea that user agents (i.e., the browsers) can
    provide the required interface. This interface may range from a calendar picker,
    or an address book. The user agent is also supposed to communicate to the server.
    This will give the user better experience.


    ## PART 2: CSS3


    ## Chapter 3: What is CSS3?


    Earlier, we have mentioned that no matter how advanced HTML is, it cannot create
    a comprehensive and holistic website or application without the use of other elements.
