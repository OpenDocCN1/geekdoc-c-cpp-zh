  mdcn: "\n级别和状态。具有“正式推荐状态”的具有最高的稳定性，而被认为是“候选推荐”（CR）状态的则被认为具有中等稳定性。\n\n由于这种方法，某些模块已经“升级”到了\
    \ 4 级（CSS4）标准。这些模块非常有限，包括选择器（Selectors）、背景（Backgrounds）和边框（Borders）以及图像值（Image\
    \ Values）。还有一些新功能，例如“flexbox”，它仍被视为“1 级”。\n\n## CSS 浏览器支持\n\n并不是所有浏览器都能正确解析所有的\
    \ CSS 代码。由于这种情况，被称为“CSS 骇客”（CSS hacks）的编码技术可以过滤或针对（或两者兼有）特定的浏览器。这些通常被称为 CSS 过滤器，用于向某些浏览器显示或隐藏\
    \ CSS 的某些部分——通过利用每个浏览器的 CSS 处理漏洞（或利用对许多 CSS 规范中某些部分支持的）来实现。\n\n通过这些过滤器，一些程序员甚至能够为某些浏览器交付不同的样式表。这种技术将确保设计按照程序员预期的方式进行渲染。\n\
    \n一些程序员还使用 CSS 过滤器来防止旧浏览器看到完整的 CSS。这是因为这些旧浏览器本身就无法正确渲染 CSS。\n\n尽管有许多符合 CSS 的浏览器，但仍有许多程序员在与不符合标准的浏览器作斗争。这使得原本可行的技术变得比最初预期的更昂贵、更复杂。\n\
    \n## 第三部分：创建一个 HTML5/CSS3 项目\n\n## 第 4 章：博客页面\n\n在本节中，我们将使用 HTML 和 CSS 概念创建一个实操项目，并使用高级技术。该项目将创建一个博客页面。这些指令旨在展示程序员如何使用\
    \ HTML5 和 CSS3 规范构建网站（当然，假设查看项目的 Web 浏览器已经实现了这些规范）。\n\n在使用 HTML 进行标记之前，理清博客页面的整体结构是非常重要的。你希望标题是居中还是左对齐？侧边栏应该在左边还是右边？这些决策是非常重要的。\n\
    \n让我们来看一个标记示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>在此处插入博客标题</title>\n\
    </head>\n<body>\n<header>\n<h1>在此处插入页面标题</h1>\n</header>\n<nav>\n<!-- 这包含你的导航栏\
    \ -->\n</nav>\n<section id=\"Introduction\">\n<!-- 这包含你的介绍 -->\n```\n\n```html\n\
    </section>\n<section>\n<!-- 这包含博客的主要内容 -->\n</section>\n<aside>\n<!-- 这包含你的侧边栏\
    \ -->\n</aside>\n<footer>\n<!-- 这包含你博客的页脚 -->\n</footer>\n</body>\n</html>\n```\n\
    \n注意标记中的 HTML5 元素：\n\n- 只有一个 `doct-type`（文档类型声明）。\n- “header”标签包裹了所有介绍性元素，包括 Logo\
    \ 和页面标题。在其他应用程序中，它也可以包含目录，甚至是搜索表单。\n- `nav` 标签用于包含不同的导航元素（包括但不限于专门的导航，如上一页/下一页链接）。\n\
    - `section` 标签用于表示文档中的不同章节。它可以包含不同的标记类型，并且不同的章节也可以相互嵌套。\n- `aside` 标签用于包裹与主体内容相关但也可以独立存在的内容。这就是为什么我们用它来做博客的侧边栏。\n\
    - `footer` 标签可以包含有关博客主要内容的更多信息（包括但不限于网站作者、相关文档链接、版权信息等）。\n\n与之前的 HTML 版本不同，我们不再使用\
    \ `div` 标签来包含不同的部分。现在正在使用语义化标签，这使得页面对搜索引擎更加可见，并使主题在屏幕阅读器上更具可访问性。\n\n## 标记导航栏\n\
    \n现在，是为页面的导航部分标记了。这与 HTML4 或 XHTML 中的方法完全相同，通过无序列表来实现。唯一记住的是代码块需要放在适当的 `nav` 标签内：\n\
