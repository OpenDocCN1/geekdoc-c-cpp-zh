    # 第 1 章：什么是 HTML5？


    与互联网上的其他核心技术一样，HTML 也在不断演进。HTML5 的主要目的是改进运行 Web 的基础语言，在增加对最新多媒体支持的同时，保持语言对人类易于阅读。它还旨在让读取它的机器（即解析器、网络浏览器等）对它有更一致的理解。HTML5
    的创建是为了能够包含（涵盖）DOM Level 2 HTML、XHTML 1 及其其直接前身 HTML 4。


    该语言的新版本也是为了响应一个事实：XHTML 和 HTML 在 Web 上都在广泛使用，并且两者都包含了由各种规范共同发起的以及由专有软件（如浏览器本身）甚至常见实践引入的特性的混合。HTML5
    也被视为尝试定义一种标记语言，程序员可以将其作为 HTML 或其表兄弟 XHTML 来编写。它可以包含能够鼓励更具互操作性的实现的处理模型，还引入了用于更复杂的
    Web 应用的标记和 API（应用程序编程接口）。


    HTML5 还被认为是跨平台移动应用的良好候选者。许多 HTML5 特性的构建都考虑到了，它们应该能够在功率相对较低的设备上运行，如智能手机和平板电脑。


    # 谁创建了 HTML5？


    回到 2004 年，一个被称为 WHATWG（Web 超文本应用技术工作组）的团体开始了这项新标准的工作。此时，HTML4.01 仍在在使用，并且自千禧年交之际以来未曾更新。同时，W3C（世界维网联盟）正专注于
    XHTML 2.0 的开发。


    许多人将 HTML5 的开发比作 Adobe Flash 技术，尽管两者非常不同。这两种技术可以使用缩放矢量图形，并在网页上查看音频和视频，但 Flash
    拥许多功能在 HTML5 中没有直接的对应物。例如，HTML5 本身无法支持动画或交互性——它应该始终用 JavaScript 或 CSS3 进行补充。


    # 新 HTML 有什么新内容？


    新的 HTML5 添加了不同的语法特征。其中最显著的是以下几个：


    - <video> -- 该元素的创建目的是视频流媒体传输，部分替代了另一个元素 <object>。创建者的意图是通过在不使用插件的情况下在网站上显示视频来成为新标准。这被许多人视为此前使用
    Adobe Flash（一种专有插件）作为标准的替代方案。然而，由于权威机构对于网络浏览器应该支持哪些视频格式尚未达成完全共识，该元素的使用受到了阻碍。


    - <audio> -- 该元素表示音频流（基本上是任何声音）。它最常见的用途是在页面上播放单个音频文件，并带有一个显示播放、暂停和音量控制的小部件。音频元素本身包含了不同的属性，如
    `global`、`autoplay`、`preload`、`controls`、`loop`、`mediagroup`、`muted` 和 `src`。与视频元素一样，HTML5
    的支持者在免费格式和更广泛使用的专利格式之间纠结。


    - <canvas> -- 系统的这部分允许对位图以及 2D 形状和图像进行脚本化的渲染。这种过程化模型将更新位图，并且不会具有内置的场景图。


    HTML5 还具有 MathML，这是一种用于数学公式的语言。这是一种应用 XML 的数学标记语言，用于描述符号并捕获其内容和结构。该功能的总目标是将数学公式集成到世界维网中。API
    和 DOM（文档对象模型）也是该语言不可或缺的一部分。


    HTML5 还具有新的页面结构元素：`<section>`、`<main>`、`<article>`、`<header>`、`<aside>`、`<footer>`、`<figure>`
    和 `<nav>`。该语言的规范还定义了针对无效文档的处理，，以便浏览器可以统一处理错误。


    HTML5 中的某些元素被删除了，例如 `<cite>`、`<menu>`：


    - <acronym>

    - <applet>

    - <base>

    - <big>

    - <center>

    - <dir>

    - <font>

    - <strike>

    - <tt>

    - <frame>

    - <frameset>

    - <noframes>


    # 浏览器支持


    所有现代浏览器都支持 HTML5。除此之外，旧浏览器可以自动处理。由于这一点，用户代理可以识别以前版本的元素。


    HTML5 规范将 Web 开发者（作者）和浏览器隔离开来。例如，作者不应该使用 `<plaintext>` 和 `<isindex>` 元素，但用户代理将支持它们。


    # HTML 语法


    在 HTML 中，程序员必须定义一种“语法”，称为“HTML 语法”。选择与现有 HTML4 和 XHTML1 最兼容的语法，尽管它无法与 SGML 特性（如简写标记和处理指令）兼容，因为这些通常不受浏览器支持。“text/html”媒体类型用于提供
    HTML 语法的文档。


    在 HTML 中，人们还定义了详细的解析规则（带有错误处理），这些规则同样与 HTML4 兼容。用户代理作为浏览器必须依赖这些规则。同样，XML 也可以作为
    HTML 语法。XML 媒体类型（如“application/xml”或“application/xhtml+xml”）用于提供此类语法的文档。


    # 字符编码


    在 HTML 中，Web 开发者还声明了字符编码。有三种方法可以实现：


    可以在传输层通过使用 HTTP `content-type` 头来实现。


    可以在文件开头使用 Unicode BOM（字节顺序标记）。该字符将提供编码的签名。


    使用 `<meta>` 元素配合 `charset` 属性，在文档的前 1024 字节期间指定编码。例如，可以通过输入 `<meta charset="UTF-8">`
    来指定 UTF-8 编码。这将取代更长的 `<meta http-equiv="Content-Type" content=:text/html; charset="UTF-8">`，尽管后期语法仍然被允许。


    # Doctype


    必须指定“Doctype”以确保浏览器在标准模式下渲染页面。doctype 没有其他用途。


