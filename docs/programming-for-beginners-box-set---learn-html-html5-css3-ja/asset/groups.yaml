    # # Chapter 4

    HTML Elements


    As you saw in the previous chapter the HTML elements are written with a start
    tag, with end tag and with the content in between. HTML element is everything
    from the start tag to the end tag.


    Using the same example from the previous chapter:


    <h1> is our starting tag. The element content is “My First Heading” and the end
    tag is </h1>.


    Nesting HTML Elements.


    HTML elements can be nested. By nested we mean that elements can contain other
    elements inside them. All HTML documents consist of nested HTML elements. Let’s
    check out our example again:


    ```

    <DOCTYPE html>

    <html>

    <body>


    <h1>My First Heading</h1>

    <p>My first paragraph.</p>


    </body>

    </html>

    ```


    Try to guess how many nested elements we have in the example above? Yes 4.

    Explanation:


    The <html> element defines the whole HTML document. It has a start tag and an
    end tag </html>. The content of <html> element is the <body> element. Said otherwise,
    we have our first nested element.


    The <body> element defines the HTML document. Just like the <html> before it has
    a start and end tag </body>. The <body> element content is two other HTML elements
    (<h1> and <p>).


    The <h1> element defines a heading and of course it has a start and end tag. The'
