    ### HTML 列表\n\nHTML 语言可以拥有无序列表、有序列表或描述列表：\n\n| 无序列表 | 有序列表 | 描述列表 |\n| --- | ---\
    \ | --- |\n| - 第一个项目 | 1. 第一个项目 | 第一个项目 |\n| - 第二个项目 | 2. 第二个项目 | 项目的描述 |\n| -\
    \ 第三个项目 | 3. 第三个项目 | 第二个项目 |\n| - 第四个项目 | 4. 第四个项目 | 项目的描述 |\n\n**无序** 列表以 `<ul>`\
    \ 标签开始，每个列表项目以 `<li>` 标签开始。\n\n```\n<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>Java\
    \ Script</li>\n</ul>\n```\n\n你可以通过在 `<ul>` 标签内部嵌套 `style` 属性来更改列表样式。\n\n无序列表有四种样式类型：\n\
    \n- list-style-type:disc：列表项目将用圆点标记（默认）。\n\n语法如下：\n\n```\n<ul style=\"list-style-type:disc\"\
    >\n```\n\n你只需要在结尾更改类型。\n\n**有序** HTML 列表以 `<ol>` 标签开始。列表项目与之前一样，以 `<li>` 标签开始。\n\
    \n```\n<ol>\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>Java Script</li>\n</ol>\n\
    ```\n\n这里有五种有序列表。\n\n- Type=\"1\"：列表项目将用数字编号（默认）。\n- Type=\"A\"：列表项目将用大写字母编号。\n\
    - Type=\"a\"：列表项目将用小写字母编号。\n- Type=\"I\"：列表项目将用大写罗马数字编号。\n- Type=\"i\"：列表项目将用小写罗马数字编号。\n\
    \n语法如下：\n\n```\n<ol type=\"1\">\n```\n\n描述列表以 `<dl>` 标签开始。术用 `<dt>` 标签开始，描述用 `<dd>`\
    \ 标签开始。\n\n语法如下：\n\n```\n<dl>\n  <dt>Term1</dt>\n  <dd>Description of term1</dd>\n\
    </dl>\n```\n\n"
