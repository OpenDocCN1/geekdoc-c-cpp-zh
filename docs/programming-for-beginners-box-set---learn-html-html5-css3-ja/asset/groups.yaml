    \ instruct them how to do it until CSS3 standards are universal.\n\n# Styling\
    \ Introductions\n\nThe markup we did for our introduction is quite simple, but\
    \ we can make it more appealing with some use of CSS3. Check out the following\
    \ code:\n\n```css\n#intro {\n  Margin-top: 64px;\n  Padding: 40px;\n  Background:\
    \ #467612 url(\"background_for_intro.png\") repeat-x;\n  Background-size: 100%;\n\
    \  Border-radius: 22px;\n}\n```\n\nAs you may have noticed, a couple of new properties\
    \ are used: the background-size (allows the programmer to scale the image in the\
    \ background) and the border-radius, that applies rounded corners to our element.\
    \ For the latter, individual corners may have different values. As well, the programmer\
    \ can choose to round out only specific corners.\n\n# Styling the Content Area\n\
    \nStyling the content area is very easy with CSS3. There will be no more need\
    \ for floating, faux column images for the background as well as clearing or collapsing\
    \ the margins. Elements now behave like a table, making layouting easier. Check\
    \ out the simple code below:\n\n```css\n#content {\n  Display: table;\n}\n#mainContent\
    \ {\n  Display: table-cell;\n  Width: 600px;\n  Padding-right: 20px;\n}\nAside\
    \ {\n  Display: table-cell;\n  Width: 320px;\n}\n```\n\nThe CSS3 techniques we\
    \ have used so far can then be used to style the rest of the sections of the blog\
    \ page. This means we can finish an entire project in a fraction of a time it\
