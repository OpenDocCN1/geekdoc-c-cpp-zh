    );\n    }\n```\n\n```csharp\n/* 可以编辑括号和引号之间的文本 */\n}\n```\n\n在进行任何操作之前，请记住，在 '/*/*'\
    \ 和 '*/' 之间的任何内容都会被编译器视为注释。它们不会对程序产生任何影响，仅供开发者为了组织结构而包含，因此你可以编写任何你喜欢的内容。请注意书中所有代码示例中的注释，因为它们会标记一些有用的信息。\n\
    \n记住，Hello World 程序是一个控制台应用程序，\n\n## # 命名空间声明 (Namespace Declaration)\n\n在程序的开头，注意命名空间系统是如何声明的（使用\
    \ System）。System 本质上是一组被 Hello World 程序调用的代码。使用命名空间通常被认为是开发者的良好习惯，因为它可以防止程序内部出现命名冲突等问题。\n\
    \n注意，如果在此程序未使用 System 命名空间，那么 `Console.WriteLine` 一行必须写成 `System.Console.WriteLine`。但如果你使用了\
    \ System 的命名空间声明，那么每次编写 `Console.WriteLine` 函数时就不需要包含 System。\n\n声明 System 命名空间后，程序声明了一个名为\
    \ Test 的新命名空间（namespace Test）。记住 Test 可以描述你程序的任何单词。你可以使用像 MyProgram 或 HelloWorld\
