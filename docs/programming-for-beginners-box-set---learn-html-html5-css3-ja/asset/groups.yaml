    # CSS Inheritance


    This is a key feature in CSS, relying on ancestor-descendant relationship in order
    to operate. Inheritance serves as the mechanism by which the properties are applied
    not just to a specified element, but also to the descendants. In general, the
    descendant elements inherit the document tree -- the hierarchy of HTML/XHTML elements
    within a page, based on the nesting of these elements.


    The descendant elements may inherit their property values from any of the ancestor
    elements that enclose them. the descendant elements inherit the properties relates
    to text, though box-related properties are not usually inherited. Inheritable
    properties include font, color, letter-spacing, list-style, line-height, text-transform,
    text-indent, white-spacing, word-spacing, and visibility. Those that cannot be
    inherited include border, border, display, background, height, width, float and
    clear, margin, min-height, max height, overflow, outline, position, padding, vertical-align,
    text-decoration, and z-index.


    The inheritance will prevent a few properties from being declared repetitively
    in a style sheet, allowing the programmer to write less code. It can also enhance
    the faster loading of pages, enabling the client to save on bandwidth and costs
    of development.


