    \n专业程序员还遵循几条其他指南，这些指南与 C# 的几乎每一个方面都相关。对于初学者来说，以下是在你学习 C# 编程艺术时应该始终记住的至上实践：\n\n\
    - 不要在与花括号相同的行内编写任何内容\n- 不要在与注释相同的行内编写任何内容\n- 关注 1:1 规则；单行内只写一个声明\n- 始终使用缩进\n-\
