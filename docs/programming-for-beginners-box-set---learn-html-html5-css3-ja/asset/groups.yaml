    user hovers “points to” the visible document with the mouse cursor. It is connected
    to one selector, such as in “a:hover” or “#element:hover”.


    The selectors can be merged in different ways to achieve a high level of flexibility
    and accuracy. There are multiple selectors that may be combined in a group to
