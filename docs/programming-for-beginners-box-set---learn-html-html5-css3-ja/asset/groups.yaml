    \ is smaller than int but bigger than that. The range of allowed values is -32768\
    \ to 32767. Usually used when dealing with large arrays that can potentially consume\
    \ large amounts of memory, but also need a wider range to know what you're doing.\n\
    - long – this data type is larger than int, having a range of allowed values from\
    \ -9,223,372,036,854,775,808 to 9,223,0,4,5,807! The default value, unlike the\
    \ previous data types, is 0L.As you can see, you'll rarely need this range of\
    \ values in a regular Java application, so stick with the int data type unless\
    \ you know what you're doing.\n- float – this data type lets you store numbers\
    \ with decimal points. The default value is 0.0f.\n- double – this data type is\
    \ like float, but with double the precision. The default value is 0.0d. In most\
    \ cases, double is preferred when dealing with decimal values, so stick with this\
    \ instead of float.\n- boolean– this is the smallest data type, with only two\
    \ possible values, 0 or 1, but can also be written as true or false.\n- char –\
    \ this data type allows you to store one Unicode character, from ‘u0000’ to \f\
    fff’. Basically this means you can put one number, or any other symbol that’s\
    \ considered a 16 bit Unicode character.\n\n# **Non-primitive data types.** Since\
    \ primitive data types are data types that Java already made, non-primitive data\
    \ types are types that Java didn’t make; rather, programmers made them for a specific\
    \ Java application. This would include classes, arrays, and interfaces."
  - '[PAGE 121]


    # Variables


    Variables allow programs to store values and manipulate them. Basically, when
    variables, you get a chunk of memory, give it a name, and store certain type of
    values inside. Since all variables need to be assigned a data type before they''re
    used, you have to declare them by giving a data type, followed by an open and
    close bracket pair (for arrays), followed by an identifier, and ended by a semicolon.
    Here are examples of variable declarations:


    ```

    char[] sentence;


    int num;

    String alsoASentence;

    float[][] twoDimensionalArray;

    ```


    While some data types have default values, remember that it''s always good to
    give the variables a value to start with. For example:


    ```

    char[] sentence = {''r'', ''a'', ''w'', ''r'', ''r''};


    int num = 7;


    String alsoASentence = "Raaawawr."


    float[][] twoDimensionalArray = {{10.5, 11.5},{13.5, 14.5}};

    ```


    For object creation, the syntax is a bit different. For example, this code snippet:


    ```

    Phone awesomePhone;

    ```


    Delares awesomePhone as an object of class Phone. On the other hand, this code
    snippet:


    ```

    Phone awesomePhone = new Phone();

    ```


    Delares awesomePhone as an object of class Phone AND initializes it by giving
    it an instance of the Phone class.


    Don''t worry if you''re still a bit confused about this; we''ll cover this in
    more detail on chapter 5.'
  - '[PAGE 122]


    # Arrays


    Arrays are a special reference type that allows you to store a bunch of items
    with the same data type. These items are referred to as *elements*. In the previous
    section you may have noticed square brackets coming after some of the data types
    – this means that array is being declared. The number of brackets tells you how
    many dimensions the array has, e.g., one pair of brackets would mean a one-dimensional
    array.


    # Operators


    Operators allow you to do interesting things with the data you already have. In
    a sense, operators are verbs of the programming language. However, unlike verbs,
    operators have an order of precedence so that when combined you’ll know what to
    expect. Here’s a quick guide for the most common operators, and their order of
    precedence from highest to lowest.


    | Operator | What it does | |

    | --- | --- | --- |

    | a++ or a--, where a is a variable name | Returns the value inside the variable,
    and then increments or decrements that value by one | |

    | ++b or --b, where b is a variable name | Increments or decrements the value
    inside the variable before returning its value. | |

    | *, /, or % | Let’s you multiply, divide, or get the module of two numbers, respectively.
    | |

    | + or - | Let’s you add or subtract two numbers | |

    | >, >=, <, <=, or instance of | Except for instance of, the operators here allow
    you to compare two numbers. Instance of, on the other hand, lets you check whether
    or not an object came from a specified class. | |

    | == or != | Let’s you check whether or not two numbers are equal. | |'
