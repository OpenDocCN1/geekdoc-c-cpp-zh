    尝试对目前为止显示的内容进行一些实验。\n\n## 第 6 章\n### HTML 标题\n\n由于搜索引擎使用你的标题来索引页面的结构和内容，因此按照预期目的使用它们非常重要。换句话说……不要用它们来让文字变大或加粗。\n\
    \nHTML 标题用 `<h1>` 到 `<h6>` 标签定义。`<h1>` 是最大的，到 `<h6>` 最小。\n\n![](img/f1f3317e3c574b724055b1c9e128d700_15_0.png)\n\
