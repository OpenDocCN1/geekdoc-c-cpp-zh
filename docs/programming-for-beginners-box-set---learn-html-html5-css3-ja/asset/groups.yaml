    # 第 6 章：数字与数学运算


    整数（integer）和浮点数（float）类型是数字，可以存储在变量中。


    例如：


    ```

    $int = 5;

    $float = 11.4;

    ```


    在 PHP 中，值会自动存储为相应的数据类型。你也可以执行数学运算。你只需要通过使用数学运算符和两个数字来指示数学运算即可。


    例如，你可以使用加号 (+) 运算符。


    ```

    2 + 3

    ```


    你也可以使用变量。


    ```

    $var2 + $var3;

    ```


    然而，如果你想在数学运算中使用数字，在将它们赋值给变量时不，应该将它们括在引号中。如果你使用引号，你会将数字设为字符字符串，并且将无法对这些字符字符串执行数学运算。与其他语言不同，PHP
    会自动将字符串转换为数字。


    考虑以下示例：


    ```

    $var1 = "2";

    $var2 = 4;

    $total = $var1 + $var2;

    ```


    显然是不可能的将这两个数字相加，因为 $var1 是字符字符串。尽管如此，因为 PHP 会自动将字符串转换为数字，数字在执行第三条语句时会被相加。如果你使用这些语句，字符串将通过转换，数字将相加。


    ```

    $var1 = "y";

    $var2 = 4;

    $total = $var1 + $var2;

    ```


    由于 y 不是 PHP 中可以转换的数字，因此在加法过程中使用了 0。因此，$total 的结果变为 4。在大多数情况下，这种转换并不是程序员所预期的。当你依赖
    PHP 的自动转换功能时，你仍然应该小心，因为有时你不会得到预期的结果，例如上面的示例所示。


    此外，你可能会得到意想不到的结果，因为 PHP 不理解人类的计数法。如果你使用以下示例，可能会得到一个错误的结果：


    ```

    $var1 = "3,000";

    $var2 = 3;

    $total = $var1 + $var2;

    ```


    你可能理解逗号及其功能，但 PHP 不理解。如果你在代码中使用逗号，PHP 会自动在逗号处停止读取。因此，如果你执行上面的代码，你的 $Total 将读取为
    3 而不是 3,000。


    # 数学运算符


    - + 代表加法过程。它用于数字相加。

    - - 代表减法过程。它用于从第一个数字减去第二个数字。

    - * 代表乘法过程。它用于数字相乘。

    - / 代表除法过程。它用于将第一个数字除以第二个数字。

    - % 称为模。它识别执行除法过程时的余数。


    # 运算顺序


    可以一次性执行多个数学运算。看以下示例：


    ```

    $total = 2 + 3 * 4 + 2;

    ```


    记住，你的数学语句的顺序至关重要。你可能会得到不同的输出。因此，当你在代码中使用数学运算符时必须小心。在 PHP 中，先执行除法和乘法。然后执行减法和加法。此外，如果所有其他考虑因素都相等，PHP
    可以从左到右开始。


    如果你运行上面的代码，你将得到输出：

    16


    你得到是因为 PHP 先执行了乘法过程。在 $total = 2 + 3 * 4 + 2 中，先处理 3。所以通过将 3 乘以 4，你得到了 12。由于其他加法运算符，PHP
    从左侧读取代码。它将 2 加上 12，这是 3 * 4 的结果。最后，它执行最后的加法过程。2 + 12 等于 14。


    如果你想改变运算顺序，可以使用括号。使用括号时，里面的内容先执行。看以下示例：


    ```

    $total = (2 + 3) * 4;

    ```


    运行此代码，你将得到输出：

    22


    你得到 22 是因为 2 + 3 先执行，因为它们在括号内。将 2 和 3 相加得到5，然后乘以 4。如之前所述，默认先执行乘法和除法。然而，也可以在另一组括号内。如果你的数学语句有多个答案，你应该在必要的地方使用括号。


    # 自增与自减


    在 PHP 中，你可以使用快捷方法给变量加 1。考虑以下示例：


    ```

    $counter = $counter + 1;

    ```


    同样，你可以编写执行相同操作更短的代码：


    ```

    $counter++;

    ```


    看这个示例：


    ```

    $counter = 0;

    $counter++;

    echo $counter;

    ```


    运行上述代码，你将得到输出：

    1


    这是因为 ++ 给值加了 1。同样，你可以使用 -- 从变量减去 1。


    ```

    $counter = $counter - 1;

    ```


    同样，你可以编写执行相同操作更短的代码：


    ```

    $counter--;

    ```


    看这个示例：


    ```

    $counter = 10;

    $counter--;

    echo $counter;

    ```


    运行上述代码，你将得到输出：

    9


    这是因为 -- 从值减去了 1。同样，你可以使用 += 给变量加一个数字。


    ```

    $counter = $counter + 5;

    ```


    同样，你可以编写执行相同操作更短的代码：


    ```

    $counter += 5;

    ```


    看这个示例：


    ```

    $counter = 10;

    $counter += 5;

    echo $counter;

    ```


    运行上述代码，你将得到输出：

    15


    这是因为 += 给变量加了指定值。同样，你可以使用 *= 将变量乘以一个数字。


    ```

    $counter = $counter * 2;

    ```


    同样，你可以编写执行相同操作更短的代码：


    ```

    $counter *= 2;

    ```


    看这个示例：


    ```

    $counter = 10;

    $counter *= 2;

    echo $counter;

    ```


    运行上述代码，你将得到输出：

    20


    这是因为 *= 将变量乘以了指定值。同样，你可以使用 /= 将变量除以一个数字。


    ```

    $counter = $counter / 2;

    ```


    同样，你可以编写执行相同操作更短的代码：


    ```

    $counter /= 2;

    ```


    看这个示例：


    ```

    $counter = 10;

    $counter /= 2;

    echo $counter;

    ```


    运行上述代码，你将得到输出：

    5


    这是因为 /= 将变量除以指定值。


    # 内置数学函数


    在 PHP 中，有很多内置函数可以执行各种数学运算。以下是一些常用的：


    - abs() : 返回数字的绝对值。

    - ceil() : 将数字向上取整到最接近的整数。

    - floor() : 将数字向下取整到最接近的整数。

    - round() : 将数字四舍五入到最接近的整数。

    - pow() : 返回数字的幂值。

    - sqrt() : 返回数字的平方根。

    - rand() : 返回指定范围内的随机整数。

    - max() : 返回数字数组中的最大值。

    - min() : 返回数字数组中的最小值。

    - array_sum() : 返回数组的值之和。

    - pi() : 返回常量 PI 的值。

    - log() : 返回数字的自然对数。

    - log10() : 返回数字以 10 为底的对数。

    - exp() : 返回 e 的数字幂。


    例如：


    ```php

    echo abs(-5); // 输出: 5

    echo ceil(3.1); // 输出: 4

    echo floor(3.9); // 输出: 3

    echo round(3.5); // 输出: 4

    echo pow(2, 3); // 输出: 8

    echo sqrt(16); // 输出: 4

    echo rand(1, 10); // 输出: 1 到 10 之间的随机数

    echo max(1, 5, 2, 9); // 输出: 9

    echo min(1, 5, 2, 9); // 输出: 1

    echo array_sum([1, 2, 3, 4]); // 输出: 10

    echo pi(); // 输出: 3.141592653589793

    echo log(10); // 输出: 2.302585092994046

    echo log10(100); // 输出: 2

    echo exp(2); // 输出: 7.38905609893065

    ```


    '
