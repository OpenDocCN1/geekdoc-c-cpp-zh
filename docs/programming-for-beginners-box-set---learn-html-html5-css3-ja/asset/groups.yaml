    >关于网站</a></li>\n  <li><a href=\"#\">存档</a></li>\n  <li><a href=\"#\">联系我们</a></li>\n\
    \  <li><a href=\"#\">订阅</a></li>\n</ul>\n</nav>\n```\n\n## 标记介绍部分\n\n现在，是为页面的介绍部分标记了。这与\
    \ HTML4 或 XHTML 中的方法完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的 `nav` 标签内（注：此处原文可能误为 nav，实际代码中应为\
    \ section）：\n\n```html\n<section id=\"Introduction\">\n  <header>\n    <h2>你了解\
    \ HTML5 和 CSS3 吗？</h2>\n  </header>\n  <p>这是博客的介绍。</p>\n</section>\n```\n\n##\
    \ 标记主内容\n\n现在，是为页面的主内容部分标记了。这与 HTML4 或 XHTML 中的方法完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的\
    \ `nav` 标签内（注：此处原文可能误为 nav，实际代码中应为 section）：\n\n```html\n<section>\n  <header>\n\
    \    <h3>插入文章标题</h3>\n  </header>\n  <p>这篇文章发布于 <time datetime=\"2015-06-28T15:40:00\"\
    >2015年6月28日</time></p>\n</section>\n```\n\n## 标记正文\n\n现在，是为页面的正文部分标记了。这与 HTML4\
    \ 或 XHTML 中的方法完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的 `nav` 标签内（注：此处原文可能误为 nav，实际代码中应为\
    \ article）：\n\n```html\n<article>\n  <header>\n    <h3>插入文章标题</h3>\n  </header>\n\
    \  <p>这篇文章发布于 <time datetime=\"2015-06-28T15:40:00\">2015年6月28日</time></p>\n</article>\n\
    ```\n\n## 标记评论\n\n现在，是为页面的评论部分标记了。这与 HTML4 或 XHTML 中的方法完全相同，通过无序列表来实现。唯一需要记住的是代码块需要放在适当的\
    \ `nav` 标签内（注：此处原文可能误为 nav，实际代码中应为 section）：\n\n```html\n<section id=\"comment\"\
    >\n  <header>\n    <h4>评论区域</h4>\n  </header>\n  <article>\n    <header>\n   \
    \   <a href=\"#\">评论者1</a>/<time datetime=\"2015-06-28T15:40:00\">2015年6月28日</time>\n\
    \    </header>\n    <p>Lorem ipsum 之后，在此处插入评论。</p>\n  </article>\n</section>\n\
    ```\n\n## 标记评论表单\n\nHTML5 引入了表单的许多增强。不再需要手动进行所需字段的客户端验证，因为现在浏览器会为你完成。\n\n然而，还有两个新的输入类型——URL\
    \ 和 email。这些用于收集发布者的网站和电子邮件地址。如果这些标记了 `required` 属性，用户将无法提交空表单。“required” 也是 HTML5\
    \ 的新布尔属性。\n\n让我们看一下代码示例（它指定了一个需要填充的字段）：\n\n```html\n<form action=\"#\" method=\"\
