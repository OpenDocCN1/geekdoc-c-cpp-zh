- md: '

    In addition to the above-features, the users of a page containing CSS may also
    opt to override the CSS file inside the page and use one that is stored in their
    device. If both the readers and authors do not have any CSS files specified, then
    the browser''s default style will be used. Like how CSS can influence these files
    immediately, CSS can also alter the design of hundreds of documents easily, by
    simply altering a few blocks or lines of code.


    The term "cascading" in CSS''s name was obtained from its behavior. The specification
    means a certain scheme that identifies priorities, determining which style rule
    will apply if more than a single rule is matched against a certain element. This
    "cascade" or weight of the rule is computed and assigned, so that its results
    become predictable.


    The specifications of CSS are also brought about by the W3C, just like in HTML.
    The Consortium even operates a CSS validation service for documents, which offers
    its services for free.


    ## CSS Selectors


    Selectors, in CSS parlance, are used to name which portion on the markup the specific
    style will apply to. This is done by matching the files and tags within the markup.
    The selectors may be applied to the following:


    - All elements of each certain type, such as the first-level headers or h1.

    - Elements that are identified by specific attributes, such as "id" (the identifier
    that is unique to the document), and "class" (the identifier that brings different
    elements within a document).

    - Elements in general, which still depends on how they are placed in relation
    to the others within the document tree.


    In the above areas where selectors apply, it must be remembered that IDs and classes
    are case-sensitive. These start with alphabet characters, and may include any
    alphanumeric characters as well as underscores. IDs, in particular, is only applied
    to a single instance of a single element.


    There are also pseudo-classes that CSS selectors use in order to allow formatting
    depending on the information which is not within the document tree. An example
    of a pseudo-class is “hover”, that serves to identify the content only once the
    user hovers “points to” the visible document with the mouse cursor. It is connected
    to one selector, such as in “a:hover” or "#element:hover”.


    The selectors can be merged in different ways to achieve a high level of flexibility
    and accuracy. There are multiple selectors that may be combined in a group to
    specify the elements by element type, location, class, ID, or a combination of
    these. The selectors’ order is also important. Consider the following:


    ```

    div.thisClass{color:green}

    ```


    In this case, the expression applied to each element of the class “thisClass”
    that are within the div elements. On the contrary,


    ```

    .myClass div{color:red};

    ```


    Can apply to all div elements which are the elements of the class “myClass”.


    ## CSS Declaration Blocks


    The “declaration block” is an item composed of a group of “declarations” within
    braces. The declarations themselves are made of a property and a colon, as well
    as value. If there is more than one declaration within a block, then a semi-colon
    must be used so each declaration is separated.


    The properties are always specified in the language’s standard. All properties
    contain a group of possible values, and some properties which affect any element
    (while some are restricted to only limited groups of elements).


    The values may in turn be keywords, including "inherit" or "center". They may
    also be numerical values like "80%" or "200px". The color values may be specified
    using keywords (such as "green"), or through their equivalent hexadecimal value.
    Other values that may be used for color include RGB values (within a 0 to 255)
    scale, RGBA values (those that point out both the color and the opacity), as well
    as HSLA or HSL values.


    ## Priority Scheme (from Highest to Lowest)


    Earlier, we mentioned that CSS follows a “cascading” priority scheme that follows
    a sort of hierarchy. Here is the scheme of CSS priority, arranged from highest
    to lowest.


    - Importance - Anything marked with the “!important” annotation will overwrite
    the previous priorities.

    - Inline - A style that is applied to part of an HTML document that is annotated
    with the “style” attribute.

    - Media Type - This is a property definition applying to all types of media, unless
    something media-specific is defined.

    - User-defined - This is available in most browsers, as almost all modern browsers
    have an accessibility feature for the end-user (a user-defined CSS document).

    - Selector specificity - This is a specific contextual selector which works to
    overwrite generic definitions.

    - Rule order - The last rule declaration will have a higher priority.

    - Parent inheritance - If no property is described, then the parent element’s
    property will be inherited.

    - CSS property definition within the HTML - The CSS rule or inline style will
    overwrite the default browser value.

    - Browser default - This is the lowest priority, and the browser default value
    is always determined by the initial value specifications of W3C.


    ## CSS Specificity


    The term “specificity” refers to each rule'' relative weight. This means that
    this is needed to determine which style will be applied to the element in question,
    when more than a single rule may apply.


    Based on the rules of specificity, a regular selector (like “h1”) has a specificity
    of 1. A class selector has a specificity of 1,0, while ID selectors are given
    a specificity of 1,0,0. Unlike the decimal system, specificity values do not carry
    over as commas are used to separate the digits. This means that a CSS rule that
    has 11 elements with 11 classes will have a specificity of 11,11, instead of 121.


    Let us consider the following block of HTML code to demonstrate the rules of specificity.


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8">

    <style>

    #abc { color: green; }

    </style>

    </head>

    <body>

    <p id="abc" style="color: red"> This demonstrates specificity </p>

    </body>

    </html>

    ```


    In this example, the declaration inside the “style” attribute (e.g. id="abc" style="color:
    red") will override the style element (e.g. “<style> #abc { color:green></style>")
    since it has a higher specificity.


    ## CSS Inheritance


    This is a key feature in CSS, relying on ancestor-descendant relationship in order
    to operate. Inheritance serves as the mechanism by which the properties are applied
    not just to a specified element, but also to the descendants. In general, the
    descendant elements inherit the document tree -- the hierarchy of HTML/XHTML elements
    within a page, based on the nesting of these elements.


    The descendant elements may inherit their property values from any of the ancestor
    that enclose them. the relates to text, though box-related properties are not
    usually inherited. Inheritable properties include font, color, letter-spacing,
    line-height, text-transform, text-indent, white-spacing, and visibility. Those
    that cannot be inherited include border, display, background, height, width, float
    and clear, margin, min-height, max height, overflow, outline, position, padding,
    vertical-align, text-decoration, and z-index.


    The inheritance will prevent a few properties from being declared repetitively
    in a style sheet, allowing the programmer to write less code. It can also enhance
    the faster loading of pages, enabling the client to save on bandwidth and costs
    of development.


    Below is an example of a style sheet:


    ```

    H2 {

    Color: green;

    }

    ```


    Let’s say that this secondary header element has an emphasizing (em) element within:


    This is to <em>show</em>


    As shown above, there is no color assigned to the em element. In this case, the
    emphasized word (show) will inherit the color of its parent element (h2).


    ## CSS Whitespace


    In CSS, the whitespaces between the properties selectors are ignored. Consider
    the following code snippet:


    ```

    Body{overflow:hidden;background:#000000;}

    ```


    This is functionally equivalent to a similar snippet with spaces in between. Many
    programmers format CSS in such as way to give each property its own line, but
    this is only to aid in the code’s human readability (also allows faster troubleshooting
    when there is a bug on the code). When fed to a computer, all these spaces will
    be ignored.


    ## Meaning of “CSS3”


    In previous CSS specifications, the structure was such that a large single specification
    that defines various features defines. CSS3 deviates from this norm in that it
    is split into several documents, called “modules”. Each of these modules add new
    capabilities, or extend the existing features defines in CSS2. CSS3 also preserves
    backward compatibility.


    Due to the modular approach, the different modules of CSS3 have different stability

