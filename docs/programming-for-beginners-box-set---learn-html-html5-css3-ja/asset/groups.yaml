    - shuffle – it shuffles arrays\n- sort – it sorts arrays\n- sizeof – it is another\
    \ term for count\n- usort – it sorts arrays using user-defined comparison functions\
    \ as well as maintains index associations\n- usort – it sorts arrays by keys with\
    \ user-defined comparison functions\n- usort – it sorts arrays by values with\
    \ user-defined comparison functions\n\n# Chapter 5: Conditional Statements Used\n\
    \nConditional statements are used for performing various actions for various conditions.\
    \ Often, when you write a code, you aim to perform actions for specific purposes.\
    \ In PHP, you can use these conditional statements:\n\n- Switch statement – it\
    \ lets you choose a block of code to execute\n- If statement – it lets you execute\
    \ a code if the condition is true\n- If... Else If... Else statement – it lets\
    \ you specify a new condition for testing if the previous condition is false\n\
    - If... Else statement – it lets you execute a code if the condition is true,\
    \ and another one if it is false\n\n# The If Statement\n\nAs mentioned above,\
    \ the if statement lets you execute a code if your condition is found to be true.\
    \ Its syntax is:\n\n```\nif (condition)\n{\n    block of code;\n}\n```\n\nTake\
    \ a look at the following example:\n\n```php\n<?php\n$time = date(\"Hour\");\n\
    if ($time < \"10\")\n{\n    echo \"Good morning!\";\n}\n?>\n```\n\nIf you run\
    \ this code, you will get an output of:\n\nGood morning!\n\nif and only if the\
    \ hour or time is less than 10.\n\n# The If... Else Statement\n\nYou can use the\
    \ if... else statement to execute a code when the condition is found to be true,\
    \ and then another code when the condition is found to be false. Its syntax is:\n\
    \n```php\nif (condition)\n{\n    block of code to execute if the condition is\
    \ true;\n}\nelse\n{\n    block of code to execute if the condition is false;\n\
    }\n```\n\nConsider the following example:\n\n```php\n<?php\n$time = date(\"Hour\"\
    );\nif ($time < \"10\")\n{\n    echo \"Good morning!\";\n}\nelse\n{\n    echo\
    \ \"Good afternoon!\";\n}\n?>\n```\n\n# The If... Else Statement\n\nThis statement\
    \ is used to specify a new condition for testing if the previous condition is\
    \ false. Its syntax is:\n\n```php\nif (condition)\n{\n    block of code to execute\
    \ if the condition is true;\n}\nelse if (condition)\n{\n    block of code to execute\
    \ if the condition is false;\n}\n```\n\nTake a look at the following example:\n\
    \n```php\n<?php\n$time = date(\"Hour\");\nif ($time < \"10\")\n{\n    echo \"\
    Good morning!\";\n} else if ($time < \"20\")\n{\n    echo \"Good afternoon!\"\
    ;\n} else\n{\n    echo \"Good night!\";\n}\n?>\n```\n\nIf you run this code, you\
    \ will get an output of:\n\nGood morning!\n\nif and only if the hour or time is\
    \ less than 10.\n\n# The If... Else Statement\n\nThis statement is used to execute\
    \ a code when the condition is found to be true, and then another code when the\
    \ condition is found to be false. Its syntax is:\n\n```php\nif (condition)\n{\n\
    \    block of code to execute if the condition is true;\n}\nelse\n{\n    block\
    \ of code to execute if the condition is false;\n}\n```\n\nConsider the following\
    \ example:\n\n```php\n<?php\n$time = date(\"Hour\");\nif ($time < \"10\")\n{\n\
    \    echo \"Good morning!\";\n} else\n{\n    echo \"Good afternoon!\";\n}\n?>\n\
    ```\n\nIf you run this code, you will get an output of:\n\nGood morning!\n\nif\
    \ and only if the hour or time is less than 10.\n\n# The If... Else If Statement\n\
    \nThis statement is used to specify a new condition for testing if the previous\
    \ condition is false. Its syntax is:\n\n```php\nif (condition)\n{\n    block of\
    \ code to execute if the condition is true;\n}\nelse if (condition)\n{\n    block\
    \ of code to execute if the condition is false;\n}\nelse\n{\n    block of code\
    \ to execute if all conditions are false;\n}\n```\n\nTake a look at the following\
    \ example:\n\n```php\n<?php\n$time = date(\"Hour\");\nif ($time < \"10\")\n{\n\
    \    echo \"Good morning!\";\n} else if ($time < \"20\")\n{\n    echo \"Good afternoon!\"\
    ;\n} else\n{\n    echo \"Good night!\";\n}\n?>\n```\n\nIf you run this code, you\
    \ will get an output of:\n\nGood morning!\n\nif and only if the hour or time is\
    \ less than 10.\n\n# The Switch Statement\n\nIt is used to perform actions depending\
    \ on the given conditions. In PHP, there are many blocks of code but you can use\
