    # Other Operators


    For the remaining chapters of this book, you will also be introduced to the other
    basic operators in C#. This includes the conditional, relational, and unary operators
    which can be used for creating loops. First, let us take a look at some of the
    useful operators:


    Note: The variable x is only used as an example to represent the operand and is
    not included in the operators itself.


    +   * ++x – This operator will increase the numeric value of the operand by an
    increment of 1.

    * --x – This operator will decrease the numeric value of the operand by a decrement
    of 1.

    * +x – This operator simply denotes the value of the operand.

    * -x – This operator will take the negative value of the operand.


    Unary operators are named as such because they only affect the single operand
    they are attached to. These operators are useful for writing conditional statements
    and setting parameters for loops.


    Another category of useful operators is the relational operators, which have the
    primary purpose of comparing two operators:


    +   * == - This operator checks if the values of two operands equal each other.

    * != - As opposed to the == operator, this operator checks if the values of two
    operands are NOT equal.

    * > - This operator checks if the value of the operand to the left is greater
    than the one on the right.

    * < - This operator checks if the value of the operand to the left is less than
    the one on the right

    * >= - This operator checks if the operand to the left is greater or equal to'
