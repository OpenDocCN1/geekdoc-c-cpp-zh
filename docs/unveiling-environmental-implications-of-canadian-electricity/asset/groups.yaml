    # 揭示加拿大电力系统低碳转型的环境影响：多区域随机优化驱动投入产出模型


    Leian Chan a, Guobe Huang b,c, Bin Lin c, Lirong Lu b


    +   * a 里贾纳大学环境系统工程专业，萨斯喀彻温省 S4P 0A2，加拿大

    * b 萨里大学环境与可持续发展中心，格尔福德 G3V 9X1，英国


    # 文章信息


    # 摘要


    处理编辑：Zhi Mi


    关键词：

    - 能源系统优化模型

    - 环境扩展投入产出分析

    - 因子分析

    - 机会约束规划

    - 碳税

    - 温室气体排放减排


    电力系统的低碳转型对于实现温室气体（GHG）减排目标至关重要。然而，这种转型涉及多种复杂性，且对不同部门的环境影响仍待探索。在本研究中，开发了一个多区域随机优化驱动投入产出模型（STIO），旨在从特定视角揭示不同场景下低碳转型的环境影响，并对加拿大进行评估。STIO
    可以(1) 探索不同政策场景下电力部门的间接排放，并与政策生成技术导向的投入产出模型建立联系以检查环境影响；(2) 通过交互分析模型反映多种政策因素对系统响应的影响；(3)
    定量了 2050 年电力部门排放量减少了 38.9% 和 33.1%。具体而言，研究强调了阿尔伯塔省天然气发电部门（加拿大经济最大的 GDP 贡献者）间接排放的显著性，分别为
    15.9% 和 16.1%。进一步分析显示，高水平碳税和天然气发电技术成本的增加将导致电力部门间接排放增加。这些发现有助于决策者深入了解各种脱碳路径对整个经济的环境影响。


    # 1. 引言


    从化石燃料向低碳和可再生能源转型被认为是实现《巴黎协定》下温室气体（GHG）减排的关键策略（10.1016/j.jclepro.2023.138363）。虽然电力设施促进了燃料燃烧产生的温室气体排放，但很大一部分排放是嵌入在电力部门中的，这被称为间接温室气体排放。未能考虑到间接排放可能会导致碳泄漏，即在减少电力系统温室气体排放的同时，却增加了其他部门的排放。碳泄漏将削弱环境政策缓解电力系统问题的有效性。深入研究电力系统低碳转型的直接排放和间接排放至关重要，这可以为决策者制定有效的脱碳策略提供重要见解。


    电力系统转型是一个复杂的过程，受到各种社会经济和环境因素的加速。自下而上的电力/能源系统优化模型（ESOMs）是一种广泛认可的模型，能够全面反映技术和环境因素的趋势，并在国家和区域尺度上扩展应用（Lehtveer
    and Farid, 2020; Lennox and Kaplan, 2016; Welder et al., 2018）。在 ESOMs 中，由于对输入参数（例如能源价格和可再生资源可用性）的数值了解不足，会产生不确定性（Ilgin,
    2022; Senthil Kumar, 2020a）。解决这些不确定性，建模可能缺乏稳健性，并对决策过程产生重大影响。各种随机方法被引入 ESOM 框架，以处理建模中的确定性和随机性特征，例如线性规划（Luo,
    2021; Xiao, 2022）、模糊规划（Wang, 2021）和随机规划（Liao, 2022）。例如，Wang 等人 (2018) 将机会约束规划法引入优化框架，利用概率分布处理此类不确定性以帮助确定省级的最优决策；Day
    等人 (2014) 采用基于场景的方法来捕捉电力需求的不确定性，并以成本最小化为目标评估州级供应。


    许多研究将 ESOMs 与环境扩展投入产出模型（EIO）相结合。部署的 ESOM 是针对加拿大的。加拿大最近更新了其国家贡献（NDC）目标，是在 2030
    年前温室气体排放减少 40%，并在 2050 年实现净零排放。


    ## 2. 方法与结果


    ## 2.1 多区域随机优化驱动投入产出模型（STIO）的发展


    作为以往工作的延伸，本研究重点是通过整合三个模块——SEOM、PITO 和交互分析来开发多区域随机优化驱动投入产出模型（STIO）。建模框架如图 1 所示。在
    STIO 中，发电计划由 SEOM调节。然后，SEOM 的输出（即发电计划和直接排放）作为 PITO 的输入以构建模型。


    ### 2.1.1. 随机优化模块（SEOM）


    开发可再生电力技术是电力系统脱碳的优先策略，但可再生资源的可用性具有内在特性，其灵活性取决于自然事件（例如风速、太阳光）。机会约束规划 CCP 有助于处理具有随机特征（以概率分布表示）的约束违反风险（Charnes
    and Cooper, 1959）。因此，引入 SE 来处理可再生能源（风能和太阳能）的随机特征。此外，引入混合整数规划 MILP 来处理整数变量问题，例如发电技术的扩展方案。通过结合
    SE 和 MILP，通用的 SEOM 可以公式化：


    目标：最小化 $f = \sum_{i,j} c_{ij}x_{ij} + \sum_{i} d_i$


    约束条件：

    $(1b) \sum_{j} (a_{ij}x_{ij} + b_{ij}y_j) \le p_i, i = 1, 2, ...$

    $(1c) \sum_{j} (a_{ij}x_{ij} + b_{ij}y_j) \le b_i^{max}, i = 1, 2, ...$

    $(1d) x_{ij} \ge 0$

    $(1e) y_j \ge 0 \text{ 或 } y_j = 1$


    (4) 每个区域规定了初始容量、电力需求和成本；但系统模型规定了温室气体排放目标：

    (5) 风能太阳能的参数以概率分布表示以处理此类不确定性。有四种资源可用性类型：$p_i = 0.01, 0.05, 0.10,$ 和 $0.25$。$P$
    水平代表允许的风能和太阳能量，如表 1 所示。较低的 $p$ 水平表示违反约束的风险较低。


    ### 2.1.2. 以发电技术为核心的投入产出模型（PEM）


    电力系统的转型对其他区域部门具有重要影响。 NEM 模型用于捕捉独立市场下多个区域发电结构变化的溢出效应（Miller and Blair, 2009）。此外，采用生态网络分析（ENA）通过市场转型、多个区域与其他经济部门之间的电力流动反映部门间的环境交互。在列昂迪投入产出框架（Leontief,
    1986; Miller and Blair, 2009）下，PEM 公式如下：


    | 变量 | 说明 |

    | :--- | :--- |

    | XS | 各部门的总需求 |

    | A | 系数矩阵 |

    | I-A | 列昂迪逆 |

    | FD | 最终需求 |

    | E | 隐含温室气体强度 |

    | G^g | 各部门排放的对角矩阵 |

    | IE | 直接排放 |

    | ME | 间接流 |

    | TE | 总排放 |


    $(2a) XS = (I - A)D$

    $(2b) e = [XS]$

    $(2c) E = \sum_{j} TE_{ij}$

    $(2d) G^g = \frac{IE}{TE}$

    $(2f) N = (I - A)$

    $(2g) ID = ME$


    其中 $x_{ij}$ 是决策变量，$a_{ij}$ 和 $c_{ij}$ 是输入参数。对于交互分析模型中的因子，具有 $m$ 和 $n$ 个层级的因子由不确定参数
    $a_{ij}^q, a_{ij}^n, b_{ij}^q,$ 和 $b_{ij}^n$ 定义。


    方程 (18) 可以公式化为：

    $b^i = F(b_i)$，其中违反约束 $b_i$ 概率的累积分布函数（CDF）；此处为概率分布的不确定参数（Charnes and Cooper, 1959）。


    该模型提供了能源供应投资、电力扩展方案、容量扩展效率、跨区域发电和长期等选项。SEOM 的目标是最小化系统运行的总成本，包括投资、运行、输配电、进出口以及碳；约束条件包括初级平衡、容量扩展、需求满足、温室气体排放目标和非技术约束。SEOM
    的主要特征包括：


    - 1) 国家拥有 13 个地区，包括安大略（ON）、魁北克（QC）、阿尔伯塔（AB）、萨斯喀彻温（SK）、马尼托巴（MB）、不列颠哥比亚（BC）、新不伦瑞克（NB）、新斯科舍（NS）、爱德华王子岛（PE）、纽芬兰和拉布拉多（NL）以及西北地区（NT）、育空地区（YT）。

    - 2) 2020 年代表 2010 年到 2020 年的十年，规划周期为十年。

    - 3) 包含一系列已并网或计划中的发电技术，如燃煤发电、天然气风电、燃油发电以及碳捕集和


