    However, it is noteworthy that the rapid development of low-carbon renewable energy
    may increase GHG emissions from electricity generation due to the production of
    power generation (e.g., manufacturing). Although such increases would be minimal
    compared to other sectors, the results highlight the importance of considering
    both direct and indirect emissions in forming the sector''s GHG reduction policies,
    especially under low-carbon scenarios.


    # 5. Conclusions


    In this study, an integrated model (STIO) has been developed through incorporating
    a SEOM, a PGTO, and integrated environmental analysis to explore direct and indirect
    environmental impacts of the electricity sector''s low-carbon transitions. STIO
    has following (a) tackling stochastic features of renewable availability expressed
    as probability distributions and constraint-variation risks; (b) linking the outputs
    to decarbonization policies under different risk levels; (c) handling the variations
    in electricity sectors induced by the changes in power generation schemes as a
    conceptual result.


    # 4.2. Contributions of STIO to integrated modeling frameworks


    The developed STIO has two main contributions to the existing integrated modeling
    frameworks in electricity system management. Firstly, electricity systems are
    all with uncertainties,


    quantifying the contribution of each environmental and economic policy at multiple
    levels (risk levels) and their effects on the system. The developed STIO has also
    provided important implications for Canada; other regions/countries with variations
    in energy sectors and carbon emission trends can benefit from it.


    Future research directions are also discussed as follows. Firstly, for input-output
    analysis, as electricity is a source of uncertainty, with GHG emissions which
    are aggregated, more data and methods are needed. In STIO, the disaggregation
    of electricity sectors in CA-ELOT has been developed which adequately represents
    the technical-detail of SEOM, which represents the production structures and emission
    profiles of regional electricity sectors.


    Secondly, as renewable energy technologies become available and for other sectors
    (e.g., heavy industry) to demand the usage of electricity, technology efficiency
    factors, and impacts of prices, electricity could be introduced into the multi-sector
    analysis to


    To discuss the implications of an environmental perspective, the study provides
    additional insights into the interactive effects of environmental and economic
    factors and their interactions on the electricity sector. In comparison, the results
    were mainly focused on a single factor on the electricity''s direct effects, but
    as shown by Carroll and Speight, 2021; Khan, 2018; Martelelli, 2020), renewable
    energy generation may increase indirect GHG emissions at the cost of others (Jayslade,
    2021; Shen, 2020). The study results indicate that the interactive effects of
    different levels of carbon taxes and capital cost of power generation technologies
    would lead to various results. For example, increasing the carbon tax from mid-level
    to high-level, the lower the capital cost of natural gas-fuel power generation
    would lead to reduce direct emissions, whilst, causing the negative impacts on
    other sectors.


    It is important to examine the interaction among multiple policies when determining
    effective mitigation strategies for electricity sectors to avoid misleading consequences.


