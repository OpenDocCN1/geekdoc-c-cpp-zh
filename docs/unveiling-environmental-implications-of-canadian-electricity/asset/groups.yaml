    ## 5. 结论


    在本研究中，通过结合 SEOM、PGTO 和集成环境分析，开发了一个集成模型（STIO），以探索电力部门低碳转型对环境的直接和间接影响。STIO 具有以下功能：(a)
    处理可再生能源可用性的随机特征和约束变化风险；(b) 将输出与不同风险水平下的脱碳政策挂钩；(c) 将发电方案变化引起的电力部门变化作为概念性结果进行处理。


    ## 4.2. STIO 对集成建模框架的贡献


    开发的 STIO 对电力系统管理中的现有集成建模框架有两个主要贡献。首先，电力系统均具有不确定性，STIO 量化了每项环境和经济政策在多个水平（风险水平）上的贡献及其对系统的影响。开发的
    STIO 也为加拿大提供了重要启示；其他能源部门和碳排放趋势存在变化的地区/国家也可以从中受益。


    文中还讨论了未来的研究方向。首先，对于产出分析，由于电力是不确定性的来源，且温室气体排放是聚合的，因此需要更多的数据和方法。在 STIO 中，开发了 CA-ELOT
    中电力部门的拆分，这充分代表了 SEOM 的技术细节，而 SEOM 代表了区域电力部门的生产结构和排放特征。


    其次，随着可再生能源技术的普及以及其他部门（例如重工业）对电力的需求，技术效率因素和价格的影响可以将电力引入多部门分析中，以检查其对电力系统的环境筛选。此外，可以进行因素筛选，以帮助识别消除排放的因素（Wang
    and Huang, 2015）。最后，可以整合其他编程方法来解决动态决策问题（例如多阶段规划）和不同形式的不确定性（例如模糊集、区间线性规划）。


    为了讨论环境视角的影响，本研究对环境和经济因素的相互作用及其对电力部门的影响提供了额外见解。相比之下，以往结果主要关注电力直接影响的单一因素，但正如 Carroll
    和 Speight（2021）、Khan（2018）；Martelelli（2020）所示，可再生能源发电可能以其他领域为代价增加间接温室气体排放。研究结果表明，不同水平碳税和发电技术资本成本的相互作用会导致各种结果。例如，将碳税从中水平提高到高水平，天然气发电的资本成本越低会导致直接排放减少，同时会对其他部门产生负面影响。


    在确定电力部门的有效减排策略时，检查多种政策之间的相互作用是重要的，以避免误导性后果。


