    ## Decision variables


    - $P_{ikt}$ supply of energy resource i in period t in region k, GJ

    - $Y_{ijt}$ total electricity generation of technology j in period t in region
    k, MWh

    - $YEX_{ikt}$ electricity exported to the US in period t, region k, MWh

    - $YIM_{ikt}$ electricity imported from the US in period t, region k, MWh

    - $YCE_{ikt}$ interprovincial outflows in period t in region k, MWh

    - $YC_{ikt}$ interprovincial inflows in period t in region k, MWh


    ## Parameters


    - $C_{ikt}$ cost of energy resource i in period t in region k, GJ$

    - $CAP_{ijt}$ investment costs of technology j in period t in region k, \$MW

    - $OPVR_{ijt}$ variable costs of technology j in period t in region k, $/MW

    - $OPFX_{ijt}$ fixed operational costs of technology j in period t in region k,
    $/MW

    - $TOC_{ijt}$ costs of emission and distribution for technology j in period t
    in region k, $/MW

    - $CIM_{ikt}$ cost of electricity imported in period t in region k, \$MW

    - $BEN_{ijt}$ benefit of electricity exports in period t in region k, \$MW

    - $CTAX_{ijmt}$ amount of carbon tax with option m in period t in region k, \$MW

    - $EXP_{ijt}$ existing electricity capacity of technology j in period t in region
    k, MWh

    - $EMF_{ijt}$ emission factor of technology j in period t in region k, CO2/MWh

    - $AVE_{ikt}$ availability of energy resource i in period t in region k, GJ

    - $AV_{ijt}$ maximum resource availability for technology j in period t in region
    k, MW

    - $WJ_{ijt}$ capacity requirement for technology j in period t in region k, MW

    - $ETAR_{ijt}$ gas emission factor of technology j in period t in region k, CO2

    - $EFI_{ijt}$ conversion efficiency of technology j in period t in region k, GJ/MW

    - $DE_{ikt}$ electricity demand for demand j in period t in region k, hours

    - $CF_{ijt}$ capacity factor of technology j in period t in region k, %%

    - $PEX_{ikt}$ proportion of electricity exports in period t in region k, %

    - $PCEX_{ikt}$ proportion of interprovincial electricity exports in period t in
    region k, %

    - $PCM_{ikt}$ proportion of interprovincial electricity imports in period t in
