    ## Appendix A. Formulation of SEOM


    The stochastic electricity system optimization model (SEOM) has developed for
    supporting electricity system management in a multi-regional context. The objective
    of SEOM is to minimize total costs, which can be formulated as:


    Objective = $f_1 + f_2 + f_3 + f_4 + f_5 + f_6$


    (1) Primary energy costs: $f_1 = \sum_{j=1}^{10} \sum_{m=1}^{3} CPE_{jm} \cdot
    P_{it}$


    (2) Investment costs: $f_2 = \sum_{j=1}^{10} \sum_{m=1}^{3} CAP_{jmk} \cdot Z_{mk}$


    (3) Operation and maintenance costs: $f_3 = \sum_{j=1}^{10} \sum_{m=1}^{3} OPR_{jmk}
    \cdot Y_{jk}$


    (4) Transmission and distribution costs: $f_4 = \sum_{j=1}^{10} \sum_{m=1}^{3}
    TDC_{jmk} \cdot Y_{jk}$


    (5) Carbon tax: $f_5 = \sum_{j=1}^{10} \sum_{m=1}^{3} CTAX_t \cdot EMF_{jk}$


    (6) Electricity imports and exports: $f_6 = \sum_{j=1}^{10} \sum_{m=1}^{3} BEX_{jk}
    \cdot Y_{jk}$


    Subject to six types of constraints:


    (1) Mass balance: $\sum_{j=1}^{10} Y_{jk} (1 - LOSS) + YIM_{it} - YEX_{it} = EFI_{it}$


    (2) Capacity constraints: $Y_{jk} \leq EFI_{it}, \forall i, j, t$


    (3) $RCG_{jk} + \sum_{m=1}^{3} EXP_{jmk} \cdot Z_{mk} - W_{mj} \leq AV_{jk}, \forall
    j = 1$ to $6, 9, 10, t, k$


    (4) $PrRCG_{jk} + \sum_{m=1}^{3} EXP_{jmk} \cdot Z_{mk} - W_{mj} \geq 1 - p_j,
    \forall j=7, 8, t, k$


    (5) $\sum_{m=1}^{3} Z_{mk} \leq 1, \forall j, t, k$


    (6) Electricity demand: $\sum_{j=1}^{10} Y_{jk} \geq \sum_{d=1}^{5} DE_{jdk},
    \forall t, k$


    (7) GHG emission target: $\sum_{j=1}^{10} \sum_{t=1}^{15} EMF_{jk} - Ysk_{jk}
    \leq ETAR_{t}, \forall t, k$


    (8) Non-negativity: $P_{it}, Z_{mk}, YEX_{it}, YIM_{it}, YCEX_{it}, YCIM_{it}
    \geq 0, \forall i, j, t, m$


