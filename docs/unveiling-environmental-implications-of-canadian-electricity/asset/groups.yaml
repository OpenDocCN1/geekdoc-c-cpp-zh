    # Unveiling environmental implications of Canadian electricity system''s low-carbon
    transitions: A multi-regional stochastic optimization-driven input-output model


    Leian Chan a, Guobe Huang b,c, Bin Lin c, Lirong Lu b


    +   * a Environmental Systems Engineering Program, University of Regina, Regina,
    Saskatchewan S4P 0A2, Canada

    * b Centre for Environment & Sustainability, University of Surrey, Guildford G3V
    9X1, United Kingdom


    # ARTICLE INFO


    # ABSTRACT


    Handling Editor: Zhi Mi


    Keywords:

    - Energy system optimization model

    - Environmentally-extended input-output analysis

    - Factorial analysis

    - Chance-constrained programming

    - Carbon tax

    - GHG emission mitigation


    Low-carbon transition of the electricity system is essential for achieving greenhouse
    gas (GHG) emission mitigation goals. Nevertheless, such a transition involves
    various complexities and the environmental implications on various sectors to
    be explored. In this study, a multi-regional stochastic optimization-driven input-output
    model (STIO) has been developed to unveil the environmental implications of the
    low-carbon transitions under various scenarios from a selective perspective and
    to assess Canada. STIO can explore indirect emissions in the electricity sector
    under different policy scenarios and provide links to a policy generation technology-focused
    input-output model to examine environmental impacts; (3) reflect the effects of
    multiple policy factors on system response through interaction analysis models;
    (4) quantify changes in emissions of the electricity sector by 38.9% and 33.1%,
    in 2050. Specifically, the significance of indirect emissions from the natural-gas-powered
    sector in Alberta (the highest GDP contributor to Canada''s economy) is highlighted
    by 15.9% and 16.1%. Further analysis shows that a high-level carbon tax and increasing
    cost of natural-gas powered technology would contribute to the electricity sector''s
    indirect emissions. The findings help policymakers gain insights into the environmental
    impacts of various decarbonization pathways on the whole economy.


    # 1. Introduction


    Transitioning from fossil-fuel to low-carbon and renewable energy has been acknowledged
    as a pivotal strategy for mitigating the greenhouse gas (GHG) emission reductions
    under the Paris Agreement (10.1016/j.jclepro.2023.138363). While the electricity
    facilities facilitate GHG emissions from fuel combustion, also a significant fraction
    of emissions is embedded along the electricity sector which are referred to as
    indirect GHG emissions. Failing to account for indirect emissions may result in
    carbon leakage, which in reductions in the electricity system''s GHG emissions
    may increase other sectors'' emissions. Carbon leakage would undermine the effectiveness
    of environmental policies to mitigate the electricity system. It is vital to delve
    into both direct and indirect emissions of electricity system''s low-carbon transitions
    to provide important insights for decision-makers to plan effective decarbonization
    strategies.


    Electricity system transition is a complex process which is accelerated by various
    socioeconomic and environmental effects. Bottom-up electricity/energy system optimization
    models (ESOMs) are a well-recognized model for comprehensively reflecting trends
    among technological and environmental factors; scaling optimal cost-least decarbonization
    pathways under national and regional scales (Lehtveer and Farid, 2020; Lennox
    and Kaplan, 2016; Welder et al., 2018). In ESOMs, the uncertainties in input parameters
    (e.g., energy price and renewable resource availability) will arise due to lack
    of knowledge about their values (Ilgin, 2022; Senthil Kumar, 2020a). Addressing
    such uncertainties, the modeling may lack robustness and have significant influence
    on the decision-making process. Various stochastic methods have been introduced
    to the ESOM framework to address certain and stochastic features of the modeling,
    such as linear programming (Luo, 2021; Xiao, 2022), fuzzy programming (Wang, 2021),
    and stochastic programming (Liao, 2022; Zhang, 2022). For instance, Wang et al.
    (2018) incorporated the chance-constrained programming method into the optimization
    framework to address such uncertainties using probability distributions to help
    identify optimal decisions at provincial level. Day et al. (2014) adopted a scenario-based
    approach to capture uncertainty in power demand and evaluate hydro supply at state
    level with the objective of minimizing the total costs.


    Several studies have integrated ESOMs with an environmentally-extended input-output
    model (EIO). The deployed ESOM was built for Canada. Canada recently updated its
    nationally determined contribution (NDC) targets to reduce GHG emissions by 40%
    below 2030 and net zero by 2050. In general


    ## 2. Methods and results


    ## 2.1. Development of the multi-regional stochastic optimization-driven input-output
    model (STIO)


    As an extension of previous efforts, the focus of this study is to develop a multi-regional
    stochastic optimization-driven input-output model (STIO) through integrating three
    modules, namely SEOM, PITO, and interaction analysis. The modeling framework is
    presented in Fig. 1. In STIO, the electricity generation schedules are regulated
    by development of SEOM. Then, the outputs of SEOM (i.e., power generation schedules
    and direct emissions) are used as input for PITO to construct analysis model.


    ### 2.1.1. Stochastic optimization module (SEOM)


    Developing renewable power technology is a priority strategy to decarbonize the
    electricity system, while the renewable resource availability have inherent characteristics
    and their flexibility is highly dependent on natural events (e.g., wind speed,
    radiant light and heat from the sun). Chance-constrained programming method (CCP)
    is helpful to tackle uncertain parameters with stochastic features (expressed
    as probability distributions) and such constraint violation risk (Charnes and
    Cooper, 1959). Therefore, SE is introduced to address stochastic features of renewable
    energy (wind and solar power). In addition, mixed-integer programming method (MILP)
    is introduced to deal with problems with integer variables, such as capacity expansion
    options for power generation technologies. By incorporating both SE and MILP,
    a general SEOM can be formulated as:


    Objective: Minimize $f = \sum_{i,j} c_{ij}x_{ij} + \sum_{i} d_i y_i$


    subject to:

    $(1b) \quad \sum_{j} (a_{ij}x_{ij} + b_{ij}y_j) \le p_i, i = 1, 2, ... v$

    $(1c) \sum_{j} (a_{ij}x_{ij} + b_{ij}y_j) \le b_i^{max}, i = 1, 2, ... v$

    $(1d) x_{ij} \ge 0$

    $(1e) y_j \ge 0 \text{ or } y_j = 1$


    (4) Initial generation capacity, electricity demand and cost are specified for
    each region; however, the GHG emission target is specified for the system model:

    (5) The parameters of wind and solar energy are expressed as probability distributions
    to tackle such uncertainties. There are four types of energy resource availability:
    $p_i = 0.01, 0.05, 0.10,$ and $0.25$. $P$ levels represent to limit the allowable
    amount of wind and solar energy available as shown in Table 1. A lower $p$ level
    indicates a lower level of risk of violating the constraints.


    ### 2.1.2. Power generation technology-focused input-output model (PEM)


    Transformation in electricity systems have significant implications for other
    regions/sectors. NEM models are adopted to capture the spill-over effects of changes
    in energy generation structure across multiple regions under independent markets
    (Miller and Blair, 2009). Furthermore, ecological network analysis (ENA) has been
    adopted to reflect the environmental interactions among sectors through the transformation
    of markets, the flow of electricity between multiple regions and other economic
    sectors. Under the Leontief''s input-output framework (Leontief, 1986; Miller
    and Blair, 2009), PEM is formulated as:


    | Variable | Description |

    | :--- | :--- |

    | XS | Total demand of each sector |

    | A | Coefficient matrix |

    | I-A | Leontief inverse |

    | FD | Final demand |

    | E | Embodied GHG intensity |

    | G^g | Diagonal matrix of each sector''s emissions |

    | IE | Direct emissions |

    | ME | Indirect flows |

    | TE | Total emission |


    $(2a) XS = (I - A)D$

    $(2b) e = [XS]$

    $(2c) E = \sum_{j} TE_{ij}$

    $(2d) G^g = \frac{IE}{TE}$

    $(2f) N = (I - A)$

    $(2g) ID = ME$


    where $x_{ij}$ are decision variables, $a_{ij}$ and $c_{ij}$ are input parameters.
    For factor in the interaction analysis model, factors with $m$ and $n$ levels
    are defined from uncertain parameters $a_{ij}^q, a_{ij}^n, b_{ij}^q,$ and $b_{ij}^n$.


    Equation (18) can be formulated

    $b^i = F(b_i)$, with the cumulative distribution function (CDF) of the probability
    of violating the constraint $b_i$; here is an uncertain parameter defined as probability
    distributions (Charnes and Cooper, 1959).


    The model provides options of energy supply investment, electricity expansion
    scenarios, capacity expansion efficiency, inter-regional electricity generation,
    and long-term horizon. The objective of SEOM is to minimize the total cost of
    system operations, including investment, operation, transmission and distribution
    electricity, imports and exports, and carbon; the constraints include balance
    of primary energy, capacity expansion, demand meeting, GHG emission target, and
    non-technical constraints. The main features of SEOM include:


    - 1) The nation has 13 regions including Ontario (ON), Quebec (QC), Alberta (AB),
    Saskatchewan (SK), Manitoba (MB), British Columbia (BC), New Brunswick (NB), Nova
    Scotia (NS), Prince Edward Island (PE), Newfoundland and Labrador (NL), and Northern
    Territories (NT), Yukon (YT).

    - 2) The year 2020 is representing ten years from 2010 to 2020, with planning
    horizon ten years.

    - 3) A range of energy generation technologies that are on-grid or in planning
