    # ARTICLE INFO


    # ABSTRACT


    Handling Editor: Zhi Mi


    Keywords:

    Energy system optimization model

    Environmentally-extended input-output analysis

    Factorial analysis

    Chance-constrained programming

    Carbon tax

    GHG emission mitigation


    Low-carbon transition of the electricity system is essential for achieving greenhouse
    gas (GHG) emission mitigation goals. Nevertheless, such a transition involves
    various complexities and the environmental implications on various sectors to
    be explored. In this study, a multi-regional stochastic optimization-driven input-output
    model (STIO) has been developed to unveil the environmental implications of the
    low-carbon transitions under various scenarios from a selective perspective and
    to assess Canada. STIO can explore indirect emissions in the electricity sector
    under different policy scenarios and provide links to a policy generation technology-focused
    input-output model to examine environmental impacts; (3) reflect the effects of
    multiple policy factors on system response through interaction analysis models;
    (4) quantify changes in emissions of the electricity sector by 38.9% and 33.1%,
    in 2050. Specifically, the significance of indirect emissions from the natural-gas-powered
    sector in Alberta is highlighted (the highest GDP contributor to Canada''s economy)
    by 15.9% and 16.1%. Further analysis shows that a high-level carbon tax and increasing
    cost of natural-gas powered technology would contribute to the electricity sector''s
    indirect emissions. The findings help policymakers gain insights into the environmental
    impacts of various decarbonization pathways on the whole economy.


    # 1. Introduction


    Transitioning from fossil-fuel to low-carbon and renewable energy has been acknowledged
    as a pivotal strategy for mitigating the greenhouse gas (GHG) emission reductions
    under the Paris Agreement (10.1016/j.jclepro.2023.138363). While the electricity
    facilities facilitate GHG emissions from fuel combustion, also a significant fraction
    of emissions is embedded along the electricity sector which are referred to as
    indirect GHG emissions. Failing to account indirect emissions may result in carbon
    leakage, which in reductions in the electricity system''s GHG emissions may increase
    other sectors''


    emissions. Carbon leakage would undermine the effectiveness of environmental policies
    to mitigate the electricity system. It is vital to delve into both direct and
    indirect emissions of electricity system''s low-carbon transitions to provide
    important insights for decision-makers to plan effective decarbonization strategies.


    Electricity system transition is a complex process which is accelerated by various
    socioeconomic and environmental effects. Bottom-up electricity/energy system optimization
    models (ESOMs) are a well-recognized model for comprehensively reflecting trends
    among technological and environmental factors; scaling optimal cost-least decarbonization
    pathways under national and regional scales (Lehtveer and Farid, 2020; Lennox
    and Kaplan, 2016; Welder et al., 2018). In ESOMs,


