    # Appendix A. Formulation of SEOM


    The stochastic electricity system optimization model (SEOM) has developed for
    supporting electricity system management in Canada in a multi-regional context.
    The objective of SEOM is to minimize total system costs, which can be formulated
    as:


    ```

    Objective = Minimize = f₁ + f₂ + f₃ + f₄ + f₅

    ```


    +   (1) Primary energy costs


    ```

    f₁ = Σ_{j=1}^{10} Σ_{m=1}^{3} Σ_{k=1}^{11} CPE_{jmk} · P_{jmk}

    ```


    +   (2) Investment costs


    ```

    f₂ = Σ_{j=1}^{10} Σ_{m=1}^{3} Σ_{k=1}^{11} CAP_{jmk} · Z_{jmk}

    ```


    +   (3) Operation and maintenance costs


    ```

    f₃ = Σ_{j=1}^{10} Σ_{m=1}^{3} Σ_{k=1}^{11} OPR_{jmk} · F_{jmk} + Σ_{j=1}^{10}
    Σ_{m=1}^{3} Σ_{k=1}^{11} OPF_{jmk} · (RCG_{jmk} + Σ_{m=1}^{3} Z_{jmk} - Z_{jmk})

    ```


    +   (4) Transmission and distribution costs


    ```

    f₄ = Σ_{j=1}^{10} Σ_{m=1}^{3} Σ_{k=1}^{11} TDC_{jmk} · Y_{jmk}

    ```


    +   (5) Carbon tax


    ```

    f₅ = Σ_{j=1}^{10} Σ_{m=1}^{3} Σ_{k=1}^{11} EMF_{jmk} · Y_{jmk} · CTAX_t

    ```


    +   (6) Electricity imports and exports


    ```

    f₆ = Σ_{j=1}^{10} Σ_{m=1}^{3} Σ_{k=1}^{11} [(CIM_{jmk} · YIM_{jmk}) - (BEX_{jmk}
    · YEX_{jmk})]

    ```


