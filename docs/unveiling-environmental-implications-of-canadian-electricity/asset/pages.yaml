    # 5. Conclusions


    In this study, an integrated model (STIO) has been developed through incorporating
    a SEOM, a PGTO, and integrated environmental analysis to explore direct and indirect
    environmental impacts of the electricity sector''s low-carbon transitions. STIO
    has following (a) tackling stochastic features of renewable availability expressed
    as probability distributions and constraint-variation risks; (b) linking the outputs
    to decarbonization policies under different risk levels; (c) handling the variations
    in electricity sectors induced by the changes in power generation schemes as a
    conceptual result.


    # 4.2. Contributions of STIO to integrated modeling frameworks


    The developed STIO has two main contributions to the existing integrated modeling
    frameworks in electricity system management. Firstly, electricity systems are
    all with uncertainties,


    quantifying the contribution of each environmental and economic policy at multiple
    levels (risk levels) and their effects on the system. The developed STIO has also
    provided important implications for Canada; other regions/countries with variations
    in energy sectors and carbon emission trends can benefit from it.


    Future research directions are also discussed as follows. Firstly, for input-output
    analysis, as electricity is a source of uncertainty, with GHG emissions which
    are aggregated, more data and methods are needed. In STIO, the disaggregation
    of electricity sectors in CA-ELOT has been developed which adequately represents
    the technical-detail of SEOM, which represents the production structures and emission
    profiles of regional electricity sectors.


    Secondly, as renewable energy technologies become available and for other sectors
