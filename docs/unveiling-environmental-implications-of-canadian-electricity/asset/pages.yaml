    # Unveiling environmental implications of Canadian electricity system''s

    low-carbon transitions: A multi-regional stochastic optimization-driven

    input-output model


    Leian Chan a, Guobe Huang b,c, Bin Lin c, Lirong Lu b


    +   * a Environmental Systems Engineering Program, University of Regina, Regina,
    Saskatchewan S4P 0A2, Canada

