    analysis to


    To discuss the implications of an environmental perspective, the study provides
    additional insights into the interactive effects of environmental and economic
    factors and their interactions on the electricity sector. In comparison, the results
    were mainly focused on a single factor on the electricity''s direct effects, but
    as shown by Carroll and Speight, 2021; Khan, 2018; Martelelli, 2020), renewable
    energy generation may increase indirect GHG emissions at the cost of others (Jayslade,
    2021; Shen, 2020). The study results indicate that the interactive effects of
    different levels of carbon taxes and capital cost of power generation technologies
    would lead to various results. For example, increasing the carbon tax from mid-level
    to high-level, the lower the capital cost of natural gas-fuel power generation
    would lead to reduce direct emissions, whilst, causing the negative impacts on
    other sectors.


    It is important to examine the interaction among multiple policies when determining
    effective mitigation strategies for electricity sectors to avoid misleading consequences.


