  \n\n\n\n\n## 补充笔记\n\n![image](img/common.jpg)\n\n在第 16 章中，我们实现了光线追踪并将其应用于一些简单的形状。现在，我们将扩展光线追踪的实现，并将其应用于更复杂的模型。我们的目标是使用光线追踪渲染存储在\
  \ `OBJ` 文件中的三角形模型，例如我们的 Studio 522 海豚和其他模型。\n\n回想一下，我们的 `OBJ` 模型加载器虽然简单，但可以输入由三角形组成的模型。这意味着我们首先将制定一种用于检测射线与三角形相交的方法，然后将其应用于模型中的所有三角形。尽管这在概念上很简单，但模型通常由数千计的三角形组成，这会导致严重的性能挑战。幸运的是，通过使用名为边界体积层次结构（`BVH`）的技术，可以减少需要与给定射线进行交测试的三角形数量。在本章中，我们将研究并实现以下：\n\
  \n1. 单个三角形的射线-三角形相交\n2. `OBJ` 文件中所有三角形的射线-三角形相交\n3. 渲染包含多个 `OBJ` 模型的场景\n4. 用于提高性能的\
  \ `BVH`\n\n## 17.1 射线-三角形相交\n\n寻找射线与三角形交点的算法有许多种。例如，我们可以调整第 16 章中的射线-平面算法，来确定射线是否交于由三角形定义的平面，如果是，则执行额外的步骤来确定该交点是否发生在三角形内部。\n\
  \n相反，我们使用一种更高效的技术，称为 Möller-Trumbore 算法，该算法由 Tomas Möller 和 Ben Trumbore 开发 [MT97]。他们的方法利用了重心坐标，该坐标由两个值\
  \ `u` 和 `v` 表示，使得 `u ≥ 0`、`v ≥ 0` 且 `u+v ≤ 1`。重心坐标可以被看作使用两个参考值 `u` 和 `v` 来唯一标识三角形内部点的方法。正如我们所看到的，它们提供了一种方便的方法来识别射线与三角形交的点，并用于插值相应的纹理坐标和法向量。在\
  \ Scratchapixel [S23] 上提供了关于重心坐标的优秀且详细的描述。我们在这里总结了相关的公式。\n\n### 17.1.1 射线-三角形相交的数学\n\
  \n我们现在讨论由 Möller 和 Trumbore [MT97] 推导的公式。正如我们在第 16 章中所做的那样，我们首先将射线起点标记为 ![](img/Image7190.jpg)，方向标记为\
  \ ![](img/Image7199.jpg)。如果沿着射线遍历给定距离 `t`，我们到达点：\n\n![](img/Image7207.jpg)[1]\n\n\
  三角形的三个顶点标记为 ![](img/Image7214.jpg)、![](img/Image7223.jpg) 和 ![](img/Image7238.jpg)[2]\n\
  \n其中 `u` 和 `v` 是三角形内部点 `P` 的重心坐标。如果射线与三角形相交，它将在两个点 `P(t)` 和 `P(u,v)` 相等的地方发生，即：\n\
  \n![](img/Image7248.jpg)[3]\n\nMöller 和 Trumbore 求解出 `t`、`u` 和 `v`（我们在此省略推导过程），产生：\n\
  \n![](img/Image7256.jpg)[4]\n\n其中 ![](img/Image7263.jpg)、![](img/Image7270.jpg)、![](img/Image7278.jpg)\
  \ 以及符号 ![](img/Image7285.jpg) ![](img/Image7294.jpg)。后者被称为行列式，在任何情况下，元素 `x`、`y`\
  \ 和 `z` 都是 3 元素列，导致一个 3x3 的方阵。\n\n一旦我们确定了 `t`、`u` 和 `v`，那么如果 `t > 0`、`u ≥ 0`、`v\
  \ ≥ 0` 且 `u+v ≤ 1`，则射线与三角形相交。如果满足这些条件，则交点即为 ![](img/Image7302.jpg)。\n\n### 17.1.2\
  \ 实现射线-三角形相交\n\n我们从程序 16.13 的通用对象计算着色器开始，并添加定义三角形的功能。C++ 程序不需要修改。由于我们的最终目标是渲染由许多三角形组成的模型，我们需要一个框架，允许我们以\
  \ `OBJ` 文件中指定的方式定义三角形（具体为其顶点、纹理坐标和法向量）。回想顶点和法向量被定义为 `vec3`，而纹理坐标被定义为 `vec2`。\n\n\
  程序 17.1 首先定义了一个框架，该框架包含了名为 `TriV3`、`TriT2` 和 `TriN3` 的结构体，分别用于定义三角形的顶点、纹理坐标和法向量。它们这样命名是因为顶点和法向量需要\
  \ `vec3s`，而纹理坐标需要 `vec2s`。用于定义每个对象的结构体（命名为 `Object`）被扩展以容纳三角形对象。由于我们的计算着色器正在变得复杂，我们定义定义了一个框架，包含了名为\
  \ `TriV3`、`TriT2` 和 `TriN3` 的结构体，分别用于定义三角形的顶点、纹理坐标和法向量。它们这样命名是因为顶点和法向量需要 `vec3s`，而纹理坐标需要\
  \ `vec2s`。用于定义每个对象的结构体（命名为 `Object`）被扩展以容纳三角形对象。由于我们的计算着色器正在变得复杂，我们还添加了一些预定义常量以提高可读性。我们为非三角形的对象（如球体或箱体）填充零。对于这个第一个示例，我们包含了两个对象：一个箱体和一个三角形。三角形的顶点、纹理坐标和法向量的指定在本示例中是手动完成的并用黄色突出显示。\n\
  \n![image](img/pg466.jpg)\n\n![image](img/pg467.jpg)\n\n添加了函数使用之前在 17.1 中描述的方法来计算射线-三角形相交。当检测到相交时，交点通过\
  \ [1] 确定，插值的纹理坐标和法向量通过 [2] 确定。计算相交发生在三角形“内部”还是“外部”对于单个三角形来说重要的，因为像平面一样，它是平面的且没有体积。通常，射线从同一个点进入并退出。然而，以后我们将渲染由三角形组成的\
  \ 3D 对象，在这些情况下，我们需要知道相交是否发生在“内部”（正如球体那样）。当射线源于三角形组成的实体对象外部时，第一个交点的法线与射线的总体方向相反，而如果射线源于实体对象内部，第一个交点的法线将与射线的总体方向相同。计算此点的简单方法是它们的点积大于\
  \ 0，这意味着它们之间的角度小于 90°。程序 17.1 的其余部分与程序 16.13 相同，其输出如图 17.1 所示。\n\n箱中的单个三角形进行光线追踪\n\
  \n### 17.1.3 多个三角形的光线追踪\n\n扩展程序 17.1 以渲染多个三角形是直接的，因为之前为程序 16.13 开发的光线追踪框架（程序 17.1\
  \ 基于此框架）已经处理了处理任意数量的对象。我们只需要定义三角形及其属性即可。\n\n程序 17.2 渲染了一个六三角形金字塔，类似于之前在图 6.15 中定义的那个。添加了纹理和透明度，还包含了反射球体和棋盘平面。我们还扩展了\
  \ `intersect_triangle_object()` 函数，以应用程序员指定的任何旋转和平移，使用了与之前处理箱体相同的函数（构建平移和旋转矩阵）。\n\
  \n\n\n\n\n程序 17.2 的输出如图 17.2 所示，使用了在第 5 章中首次引入的冰纹理。\n\n![image](img/pg471.jpg)\n\
  ![image](img/pg472.jpg)\n![image](img/pg473.jpg)\n![](img/Fig17_2.jpg)\n\n图 17.2：\n\
  \n对形成金字形的多个三角形进行射线追踪。\n\n当然，手动指定大量的三角形是非常麻烦的。这也说明了我们框架的一个缺点，特别是需要重复指定对于金字塔中所有三角形都相同的参数值，例如位置、透明度和旋转值。我们需要在下一节中读取从\
  \ OBJ 文件中指定的大数量三角形时来解决这些问题。\n\n# 17.2 对 OBJ 模型进行射线追踪\n\n在第 6.3 节中，我们实现了一个名为 `ImportedModel`\
  \ 的类，用于将 OBJ 文件加载到三角形数据数组中。我们现在使用该类，并将加载的三角形发送到我们的计算着色器进行射线追踪。我们在 C++ 端的策略是将数据加载到三个着色器存储缓冲区对象（SSBO）：一个用于顶点，一个用于纹理坐标，一个用于法线向量。然后于\
  \ GLSL 侧，我们创建一个名为 `mesh` 的新对象类型，它引用这三个 SSBO。\n\n## 17.2.1 C++ 侧用于射线追踪的 OBJ 加载\n\n\
  在 C++ 侧，我们在 `init()` 中生成三个 SSBO 并存储它们的 ID。（记住，OpenGL 缓冲区是通过 OpenGL 在创建时分配的整数 ID\
  \ 引用的，这些 ID 被放置在一个 `int` 数组中。）我们创建了一个新函数 `loadModel()`，它使用 `ImportedModel` 类从磁盘加载\
  \ OBJ 模型。它将顶点、纹理坐标和法线向量放入名为 `mdata` 的结构体的三个 `vector<float>` 字段中，该结构体类型为 `ModelData`。`loadModel()`\
  \ 函数通过从导入的模型中获取顶点、纹理坐标和法线向量，然后将各个浮点值推入 `mdata` 中对应的浮点向量中（此组织的用处在稍后我们将多个 OBJ 模型导入到单个场景时将变得明显）。该函数还向命令行窗口显示三角形的数量，这在稍后实现计算着色器时将非常有用。\n\
  \n`loadModel()` 函数从 `init()` 中调用，然后将加载的三角形数据放入三个 SSBO 中。它利用了 C++ 的内置函数 `data()`，该函数将\
  \ `vector` 转换为原始浮点数数组。\n\n最后，`display()` 函数使用相应的索引绑定三个缓冲区，计算着色器将使用这些索引（带有 layout\
  \ 修饰符）来引用它们。由于值 0 和 1 已经被使用（分别用于输出图像和纹理采样器变量），我们使用索引值 2、3 和 4 用于这三个新缓冲区。\n\n上述描述的额外\
  \ C++ 代码在程序 17.3 中。\n\n![image](img/pg474.jpg)\n![image](img/pg475.jpg)\n![image](img/pg476.jpg)\n\
  \n## 17.2.2 GLSL 侧用于射线追踪的 OBJ 加载\n\n在 GLSL 侧，我们首先在着色器中声明三个缓冲区。在这里，我们使用 layout 修饰符分别为引用顶点、纹理坐标和法线向量分配值\
  \ 2、3 和 4，以与前述在 `display()` 函数中分配的值相对应。我们将这些定义为 `float` 数组。（尽管将这些声明为 `vec3` 数组很有具吸引力，但由于缓冲区对齐规则和不同厂商实现的不一致，OpenGL\
  \ Wiki 不建议这样做 [OW22]。）\n\n接下来，我们定义了一个名为 `mesh` 的新对象类型，用于指示形成单个模型的三角形集合。`mesh` 对象类型的添加需要修改\
  \ `get_closest_collision()` 以处理这种新类型。我们还向 `Object` 结构体添加了两个新字段：一个名为 `triCount` 用于存储\
  \ mesh 中三角形的数量，另一个名为 `firstTriIdx` 用于指示起始 mesh 的三角形索引。如果只有一个 mesh，则 `firstTriIdx`\
  \ 始终为 0；稍后我们会在渲染多个 mesh 时使用使用它。如果特定 mesh 中的三角形数量未知，确定它的方法之一是运行程序；虽然它不会正确渲染，但它会在命令行窗口中报告三角形的数量。\n\
  \n![image](img/pg477.jpg)\n\n我们通过实现函数 `intersect_mesh_object()` 来继续构建程序 17.3，该函数使用了之前开发的\
  \ `intersect_triangle_object()`，并检查与 mesh 对象中所有三角形的射线碰撞。从 `Object.firstTriIdx` 定义的三角形开始，测试射线与\
  \ mesh 中每个三角形的碰撞，遍历所有的 `Object.triCount` 三角形。保存最近的碰撞（沿射线距离最短的碰撞）。顶点旋转和平移的计算再次使用与之前为处理箱体和单个三角形对象时相同的函数完成。\n\
  \n从缓冲区中提取和测试三角形在 `intersect_triangle_from_buffer()` 中处理。该函数根据 `intersect_mesh_object()`\
  \ 提供的索引从缓冲区中提取一个三角形，应用为 mesh 对象指定的旋转和平移，并调用 `intersect_triangle()`。\n\n这些对计算着色器的添加在程序\
  \ 17.3 中递归深度。\n\n![image](img/pg478.jpg)\n![image](img/pg479.jpg)\n![image](img/pg480.jpg)\n\
  \n这些对计算着色器的添加以及一个 mesh 对象的定义在程序 17.3 中。递归深度设置为 8。\n\n# 17.3 对多个 OBJ 模型进行射线追踪\n\n\
  扩展程序 17.3 以能够加载多个 OBJ 模型是简单的，因为我们的代码已经支持多个 mesh。程序 17.4 用一个简单的示例说明了这一点。\n\n在 C++\
  \ 侧，我们创建一个新函数 `loadModels()`，它接收文件名数组，并为每个 OBJ 文件调用我们之前的 `loadModel()` 函数。`loadModel()`\
  \ 函数如之前所述，会将所有数据添加到现有的 `mdata` 结构体中。注意 `init()` 被修改以使用新的 `loadModels()` 函数，向其传递文件名数组。\n\
  \n在 GLSL 侧，我们按照 17.2 节的方法为每个 OBJ 模型定义一个 mesh 对象。在程序 17.4 中，我们使用了两个 OBJ 文件：(1) 图\
  \ 6.15 所示的 6 三角形金字形模型，(2)之前使用的二十面体模型。注意在定义 mesh 对象时，金字形排在第一个，因此其 `firstTriIdx` 值被设置为\
  \ 0，且 `triCount` 设置为 6（因为它有 6 个三角形）。二十面体排在后面，其 `firstTriIdx` 值被设置为 6，因为它在缓冲区中的位置紧邻金字形的六个三角形。\n\
  \n![image](img/pg481.jpg)\n![image](img/pg482.jpg)\n\n程序 17.4 的输出如图 17.4 和 17.5\
  \ 所示。图 17.4 显示了 C++ 命令行窗口的输出，提供了插入计算着色器中的 OBJ 模型细节（见上）。图 17.5 显示了渲染输出。\n\n![](img/Fig17_4.jpg)\n\
  \n图 17.4：确认 OBJ 模型细节的命令行窗口输出。\n\n![](img/Fig17_5.jpg)\n\n图 17.5：对两个 OBJ 模型进行射线追踪。\n\
  \n\n\n\n前几节介绍的技术对于非常小的 OBJ 模型是足够的的，但对于包含一百多个三角形的模型，它就变得不再实用了。即使是 Studio 522 海豚的低模版本（5664\
  \ 个三角形），在我们的机器上渲染也需要几分钟。高细节模型，如我们在第 7 章和第 14 章中看到的斯坦福龙，可能包含数十万个三角形。我们希望能够使用光线追踪来渲染此类模型，但我们目前采用的方法无法扩展到这种规模的模型。这是因为每条射线都会与每个三角形进行相交测试，即使这些三角形离射线非常远。我们需要减少每条射线需要考虑的三角形数量。\n\
  \n复杂场景的光线追踪有许多优化技术。一种常用的方法为每个包含大量三角形的模型构建一个“加速结构”。最常用的之一被称为包围体层次结构，或 `BVH`。\n\n\
  `BVH` 是一个递归构建的树，由构成模型的三角形组的包围体组成。树顶层是整个模型的单个包围体。较小的三角形组被分组在较大包围体内部的较小包围体中，而在其中还有更小的组，对整个模型进行递归。因此，模型中的三角形集合被细分为越来越小的集合。\n\
  \n完全构建的 `BVH` 然后提供了一种非常高效的识别光线相交的方法。与其测试射线与模型中每个三角形的相交情况，我们不如测试射线与顶层包围体的相交情况。如果没有相交，我们就知道射线没有与模型中的任何三角形相交，然后结束了。然而，如果它与顶层包围体相交，我们就会递归地测试该子树中较小的包围体，重复此过程，直到识别出最近的三角形，或者确定没有相交。\n\
  \n定义包围体有许多方法。一种简单的方法是使用轴对齐包围盒（或“AABB”），它本质上与我们在 16.2.4 节中开发的形状相同。还开发了其他形状，可以更紧密地包围三角形组，因此效率更高，例如\
  \ Kay 和 Kajiya [KK86] 开发的 8 面平行六体。我们将使用 `AABBs`。\n\n同样，还有许多算法用于划分模型中的三角形集合以创建 `BVH`。我们将使用最简单的方法之一，称为中切（median\
  \ cut）。\n\n### 17.4.1 实现 BVH – C++ 端\n\n我们首先创建一个名为 `BoundingVolume` 的 `struct`，它存储指定\
  \ `AABB` 所需的六个值——X、Y、Z 轴的最小坐标坐标。其中包括四个实用函数：一个用于显式初始化 `BoundingVolume` 中的六个值，一个用于复制现有的\
  \ `AABB`，一个用于计算给定三角形的 `AABB`，以及用于形成两个已存在的 `AABB` 的并。\n\n![image](img/pg484.jpg)\n\
  \n![image](img/pg485.jpg)\n\n接下来，我们构建一个 `BoundingVolume` 对象的二叉树来形成 `BVH`。树中的每个节点都是\
  \ `struct BVHNode` 类型的对象，它包含对其 `BoundingVolume` 对象的引用、对三角形的引用（如果它是叶节点），以及对左、右子节点的引用（如果它是内部树节点）。添加了一个实用函数来初始化给定的\
  \ `BVHNode` 及其 `BoundingVolume`。\n\n树的构建在函数 `constructBVH()` 中完成，该函数实现了中切算法。“中切”的工作原理是沿\
  \ X 轴将三角形集合一分为二，然后这些三角形组分别沿 Y 轴一分为二，然后再次沿 Z 轴，然后循环回到 X 轴，依此类推，这类似于将一块奶酪切成半，然后将每半旋转\
  \ 90 度并再次切成半（尽管对于我们的应用程序，我们是按数量平分，而不是按空间）。\n\n`constructBVH()` 首先收集对象中每个三角形的质心，这是通过调用函数\
  \ `getCentroidsWithIndices()` 完成的。质心存储在 `glm` 类型 `vec4` 的 `vector` 中，其中 x、y、z 分量持有质心的位置，w\
  \ 分量持有其引用三角形的索引。然后通过调用递归函数 `constructBVHRecursively()` 构建 `BVH`。该函数输入的参数为：用于构建 `BVH`\
  \ 的顶点、这些顶点的数量、一个排序轴（X、Y 或 Z——编码为整数 0、1 或 2），以及由本次迭代构建的 `BVH` 部分在质心数组中的索引最小和最大范围。然后通过执行以下步骤构建\
  \ `BVH`：\n\n1. 计算本次迭代中最小到最大索引范围内的三角形数量。\n2. 如果该数量恰好为 1，则构建叶节点及其包围体对象。\n3. 如果该数量为\
  \ 2 或更多，按如下方式构建 `BVH` 内部节点：\n    a. 在指定的最小-最大范围内，根据沿指定轴的位置对索引排序。\n    b. 对这些排序后的三角形的前半部分进行递归，指定下一个排序轴。\n\
  \    c. 以相同的方式对后半部分进行递归。\n    d. 通过取左右子树的包围体的并来计算该节点的 BV。\n\n对于步骤 3a，我们利用了 `<algorithm>`\
  \ 库中的 `sort()` 函数。\n\n![image](img/pg486.jpg)\n\n![image](img/pg487.jpg)\n\n![image](img/pg488.jpg)\n\
  \n### 17.4.2 将 BVH 传输到着色器\n\n我们使用第四个 SSBO 将 BVH 传输到着色器。为了实现这一点，我们必须将 BVH 从其现有形式——结构体树——转换为一系列浮点数。我们首先注意到树中的每个节点包含九个浮点数——三角形的引用、一个\
  \ `BoundingVolume` 对象（包含包围体的六个浮点值）以及指向左右子树根节点的索引。然后，整个树必须转换为浮点数的 `Vector`。\n\n将\
  \ BVH（树）转换为浮点数向量的函数是 `serializeBVHRecursively()`。该过程是递归的，但很直观。它首先获取定义 BVH 根节点的九个浮点数中的七个（除去左右子树引用），并添加到向量中。由于两个子树引用的值未知，因此为它们插入了占位符。\n\
  \n接下来，如果节点有左子节点，则进行插入（通过递归调用 `serializeBVHRecursively()`），这将紧随占位符之后。左子树的占位符被设置为该位置（即占位符之后的数组索引）。如果有右子节点，则在处理完整个左子树后插入，其占位符值将设置为左子树之后的位置。\n\
  \n包含这些值的向量被称为 `serialBVHs`。在 `ModelData` 类中添加了一个定义相同的字段，名为 `bvhValues`。对于每个加载的 OBJ\
  \ 模型，其 BVH 被序列化到 `serialBVHs` 中，然后附加到 `mdata` 的 `bvhValues` 字段上。然后，在加载所有 OBJ 模型后，`mdata`\
  \ 的 `bvhValues` 字段包含了所有 BVH 的序列化值。\n\n\n\n\n构建 BVH 的两个函数 `constructBVH()` 和 `serializeBVH()`\
  \ 在读取每个 OBJ 模型时会从 `loadModel()` 调用。`loadModel()` 函数还负责将来自 `serialBVHs` 的序列化 BVH\
  \ 数据添加到 `mdata` 的 `bvhValues` 字段中。`loadModels()` 函数通过为每个模型调用 `loadModel()`，也经过微调，以便在加载每个模型之前清空\
  \ `serialBVHs` 向量，并显示每个对象的 BVH 在 `bvhValues` 字段中的起始索引（这对于稍后编写计算着色器非常有用）。SSBO 在 `init()`\
  \ 中生成，这里也是序列化浮点数向量（`bvhValues`）被拷贝到 SSBO 的地方。随后，`display()` 函数简单地指定了 SSBO 的绑定索引\
  \ 5。\n\n![image](img/pg489.jpg)\n![image](img/pg490.jpg)\n![image](img/pg491.jpg)\n\
  \n我们可以看到，为每个模型构建 BVH 经历了许多步骤，并将它们作为浮点数序列加载到 SSBO 中。相比之下，在计算着色器（GLSL 侧）中，没有必要“解包”SSBO。在搜索可能的射线碰撞时，我们可以直接在\
  \ SSBO 中按需遍历 BVH 。在实现该过程之前，我们需要在计算着色器中设置引用 SSBO 其包含的 BVH 的结构。\n\n我们使用 C++ `display()`\
  \ 函数中定义的绑定值 5 来指定包含 SSBO 的缓冲区。我们还引入了一个新的 BVH 对象类型，标记为 `TYPE_BVH`，值为 6。这需要在向 `get_closest_collision()`\
  \ 函数中添加一个条目，以便我们能够测试与 BVH 之间是否存在射线碰撞。\n\n![image](img/pg492.jpg)\n\n### 17.4.3 射线-BVH\
  \ 碰撞测试\n\n如前所述（在第 17.4 节开头），为了识别与模型中三角形的碰撞，我们将识别与模型 BVH 树中边界体积的碰撞，从顶部节点开始。这可能导致探索该节点的两个子节点，继续遍历树，直到确定最近的碰撞（如果有的话）。因此，BVH\
  \ 树被遍历，当到达边界体积与射线不碰撞的节点时，树的整个分支（因此是该分支的三角形）被排除，不需要测试，从而显著提高了性能。\n\n这个过程在读者听起来像是递归的。然而，请记住，GLSL\
  \ 不支持递归。幸运的是，存在一种不需要递归的遍历 BVH 的简单方法。相反，我们使用队列。队列包含了我们想要测试射线碰撞的 BVH 节点。当我们测试一个节点时，如果存在射线碰撞，则将其子节点添加到队列中。该过程重复进行，直到队列为空。没有必要将整个节点放入队列。相反，我们简单地将指向\
  \ SSBO 中节点起始位置的整数引用放入队列中。\n\n我们将队列实现为整数数组。BVH 根节点的引用被放在队列开头。当我们遍历 BVH 时，在适当的时机将子节点放在队列末尾。下一个要测试的节点始终是队列头部的。因此，我们需要两个整数变量来跟踪队列头部和尾尾的索引。对于二叉树，一个相对较小的队列就足够了——我们的队列大小为\
  \ 256，这可能比需要的得多。为了方便起见，我们包含了清空队列、向队列添加节点、从队列移除头部元素以及测试队列是否为空的函数（当队列头部和尾部的索引相同时即为空，意味着没有更多节点需要测试）。如果我们越过了队列末尾，我们通过对每个引用取\
  \ `mod 256` 将其视为“循环”数组。\n\n测试 BVH 与射线碰撞是在 `intersect_bvh_object()` 中完成的，其组织方式与我们之前的交叉函数类似。然而，它必须利用队列并遍历\
  \ BVH。它首先将 BVH 的根节点入队。然后开始迭代队列中的节点。请注意，SSBO 可能包含多个模型的 BVH，因此对 SSBO 中节点的每个引用必须根据当前对象的索引偏移进行偏移，该偏移位于对象的\
  \ `bvhRootIdx` 中（该索引已在上一段代码中添加到 `Object` 结构体中）。\n\n在从 SSBO 获取 BVH 节点后，我们测试它是内部节点还是叶子节点。如果是叶子节点，我们测试关联三角形的射线相交。如果是内部节点，我们测试射线与节点的边界体积。如果射线相交边界体积，且没有比目前找到的最近三角形更远，那么我们将该节点的子节点添加到队列，因为其中一个可能包含更近的交点（尽管我们还不知道）。\n\
  \n与边界体积的碰撞检查是在函数 `intersect_bounding_volume()` 中完成的，这与我们之前实现的 `intersect_box_object()`\
  \ 非常相似。主要区别如下：(1) 它需要从 SSBO 获取尺寸，(2) 它有几个项目是不计算计算，例如纹理坐标、法线向量以及碰撞发生的面。\n\n![image](img/pg494.jpg)\n\
  ![image](img/pg495.jpg)\n![image](img/pg496.jpg)\n\n### 17.4.4 性能比较\n\n使用 BVH 的性能提升是巨大的。之前在程序\
  \ 17.3 中提供的“网”方法没有使用 BVH 直接测试交叉，包含了三个简单对象和一个 20 三角形的正八体，递归深度设置为 4。它非常慢，在作者的笔记本电脑上运行了\
  \ 38 秒。在该示例中，如果我们把正八体替换为低精度海豚模型（5664 个三角形），则需要 4 分钟完成。将低精度海豚替换为高精度海豚模型（32976 个三角形），则需要\
  \ 20 分钟。\n\n相比之下，程序 17.5 给出的示例使用了 BVH，渲染了一个要求得更高的场景。它包含了六个对象，包括正八体和高精度海豚，并且递归深度为\
  \ 8，但它仅需 30 秒即可完成，速度提高了 20 多倍。\n\n## 补充说明\n\n对本章介绍的代码可以进行大量清理，使其更易于指定任意场景。例如，它目前仅针对一个纹理对象设置。指定多个对象将需要修改代码，使每个对象定义包含一个引用一组纹理的方法。\n\
  \n虽然这里实现的加速结构效果良好并导致了显著的速度提升，但性能仍有改进的空间。存在划分三角形或渲染空间本身的其他方法。构建 BVH 也有更复杂的算法。关于现有算法的几种综述可用\
  \ [AB06, MO21]。另一个改进可以是对用于遍历 BVH 的队列，通过优先考虑距离射线源最近的节点。\n\n\n\n\n可视化 BVH 结构本身应该是相当直观的，但其范围和复杂性可能不会显而易见。根结底，每个模型三角形都有自己的边界盒，而这些框是一个更大的边界盒二叉树的一部分。因此，对于像高多形海鱼这样的复杂模型，生成的\
  \ BVH 边界盒数量比三角形多（例如，海鱼的边界盒远超过 30,000 个）。为了让大家了解这些框的分布情况，我们使用边界盒本身生成了一个 OBJ 文件，并在\
  \ Blender 中打开了它。结果所示图 17.7。\n\n本章的大部分代码最初是由 Robin O’Connell 用 Java 开发的，他是加州州立大学萨克拉门分校的校友。他的贡献极大地促进了我们的解释，我们感谢他以如此清晰的方式实现\
  \ BVH 的卓越工作，并感谢他将其完美地集成到上一章开发的框架中。他还开发了本章后半部分使用的二十面体 OBJ 模型，并生成了包含图 17.7 中所示 BVH\
  \ 可视化的 OBJ 文件。\n\n![](img/Image7359.jpg)\n\n图 17.7\n\n高多形海鱼的 BVH 可视化。\n\n## 练习\n\
  \n17.1 对程序 17.5 进行以下更改：\n\n(i) 将房间盒替换为天空盒，\n(ii) 添加第二个透明的海鱼，以及\n(iii) 添加第三个反光的海鱼。你可以按照你喜欢的任何配置排列海鱼，也可以移动（或删除）金字塔和二十面体。\n\
  \n17.2 修改程序 17.5，使海鱼拥有纹理，并且金字塔使用砖块纹理。这需要对程序关联纹理与对象的方式进行一些更改。\n\n## 参考文献\n\n[AB06]\
