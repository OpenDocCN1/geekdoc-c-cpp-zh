  \n[TU18] J. Turberville, Studio 52\n\n\n\n\n\n投影阴影（projective shadow casting）的优点是高效且实现简单。然而，它仅适用于平面——该方法不能用于在曲面或其他物体上投射阴影。对于涉及户外场景的性能密集型应用（例如许多视频游戏），它仍然有用。\n\
  \n投影阴影变换矩阵的发展在 [BL88], [AS14] 和 [KS16] 中讨论过。\n\n![image](img/fig8_3.jpg)\n\n图 8.3\n\
  投影阴影。\n\n## 8.3 阴影体积 (SHADOW VOLUMES)\n\n另一种重要方法是由 Crow 在 1977 年提出的，即识别物体遮挡的空间，并降低阴影体积与可视体交区域内多形的颜色强度\
  \ [CR77]。图 8.4 显示了阴影体积中的立方体，因此立方体会被绘制得更暗。\n\n阴影体积的优点是高度精确，比其他方法的伪影更少。然而，即使在现代 GPU\
  \ 硬件上，寻找阴影体积并计算每个多形是否在其内部的开销也是巨大的。可以使用几何着色器来生成阴影体积，并可以使用 `stencil buffer`^(1) 来确定像素是否在体积内。某些显卡包含有用于优化某些阴影体积操作的硬件支持。\n\
  \n![image](img/fig8_4.jpg)\n\n图 8.4\n阴影体积。\n\n## 8.4 阴影映射 (SHADOW MAPPING)\n\n投射阴影最实用且流行的方法之一被称为\
  \ `shadow mapping`（阴影映射）。尽管它并不总是像阴影体积那样准确（并且经常伴随着恼人的伪影），但阴影映射更容易实现，可以用于各种情况，并拥有强大的硬件支持。\n\
  \n如果我们未能澄清我们在上一段落中对“更容易”一词的用法，将是失职的。尽管阴影映射比阴影体积简单（无论从概念还是实践上都是），但它绝非“容易”！学生通常发现阴影映射是\
  \ 3D 图形课程中最难实现的技巧之一。着色器程序本质上就很难调试，而阴影映射需要多个组件和着色器模块之间的完美配合。*请注意，大量使用 Section 2.2\
  \ 中描述的调试工具将极大有助于成功实现阴影映射。*\n\n阴影映射基于一个非常简单且巧妙的想法：即任何光线看不见的地方都在阴影中。也就是说，如果物体 `#1`\
  \ 挡住了光到达物体 `#2`，就等同于光无法“看到”物体 `#2`。\n\n这个想法之所以如此强大，是因为我们已经有一种方法来判断某物是否可以被“看到”——使用\
  \ Z-buffer 的隐藏表面移除算法（HSR），如 Section 2.1.7 所示。因此，寻找阴影的策略是将相机临时移动到光源位置，应用 Z-buffer\
  \ HSR 算法，然后使用生成的深度信息来寻找阴影。\n\n渲染我们的场景需要两个阶段：第一阶段从光点的视角渲染场景（但实际上不将其绘制到屏幕上），第二阶段是从摄像机的视角渲染它。第一阶段的目的是从光点的视角生成\
  \ Z-buffer。完成第一阶段后，我们需要保留 Z-buffer 并使用它来帮助我们在第二阶段生成阴影。第二阶段实际上是绘制场景。\n\n我们的策略现在变得更加精炼：\n\
  \n*   （阶段 1）从光源位置渲染场景。深度缓冲区随后包含每个像素的光源到其最近物体之间的距离。\n*   将深度缓冲区拷贝到单独的“阴影缓冲区”（shadow\
  \ buffer）中。\n*   （阶段 2）正常渲染场景。对于每个像素，在阴影缓冲区中查找对应的位置。如果到正在渲染的点的距离大于从阴影缓冲区检索的值，那么在该像素处绘制的物体比距离光源最近的物体更远，因此该像素处于阴影中。\n\
  \n当发现某个像素处于阴影中时，我们需要让它变暗。此点的一种简单有效的方法是只渲染它的环境光，忽略它的漫漫反射和高光分量。\n\n上述方法通常被称为“阴影缓冲”（shadow\
  \ buffering）。当我们在第二步中将深度缓冲区拷贝到 `texture`（纹理）时，就产生了“阴影映射”这一术语。当这样使用纹理对象时，我们将其称为 `shadow\
  \ texture`（阴影纹理），OpenGL 以 `sampler2DShadow` 类型的形式支持阴影纹理（下文讨论）。这允许我们利用片段着色器中纹理单元和采样器变量的硬件支持（即“纹理映射”），在阶段\
  \ 2 中快速执行深度查找。我们修订后的策略是：\n\n*   （阶段 1）如之前所示。\n*   将深度缓冲区拷贝到纹理中。\n*   （阶段 2）如之前所示，但阴影缓冲区现在是阴影纹理。\n\
  \n现在让我们实现这些步骤。\n\n### 8.4.1 阴影映射（第一阶段）——从光源位置“绘制”物体\n\n在第一步中，我们首先将相机移动到光源位置，然后渲染场景。我们这里的目标*不是*实际上在显示器上绘制场景，而是完成足够的渲染过程以使深度缓冲区被正确填充。因此，没有必要为像素生成颜色。\n\
  \n当然，移动相机涉及构建合适的 `view` 矩阵。根据场景的内容，我们需要决定一个观察场景的 `direction`（方向）。通常，我们希望这个方向来自光源。\n\
  \n在第一阶段需要处理几个重要的细节：\n\n*   配置缓冲区和阴影纹理。\n*   禁用颜色输出。\n*   构建一个从光指向物体的 look-at 矩阵。\n\
  *   启用 GLSL 第一阶段着色器程序，其中仅包含顶点着色器。\n\n由于从光点的视图并没有实际显示，因此第一阶段着色器程序的片段着色器什么都不做。\n\n\
  对于每个物体，创建 shadowMVP 矩阵并调用 `glDrawArrays()`。第一阶段没有必要包含纹理或光照，因为物体没有渲染到屏幕上。\n\n![image](img/fig8_5.jpg)\n\
  \n图 8.5\n阴影映射阶段 1 的顶点着色器和片段着色器。\n\n### 8.4.2 阴影映射（中间步骤）——将 Z-buffer 拷贝到纹理\n\nOpenGL\
  \ 提供了两种方法将 Z-buffer 深度放入纹理单元。第一种方法是生成空阴影纹理，然后使用 `glCopyTexImage2D()` 命令将活动深度缓冲区拷贝到阴影纹理中。\n\
  \n第二种方法是在第一阶段构建“自定义帧缓冲区”（而不是使用默认 Z-buffer），并使用 `glFrameBufferTexture()` 命令将阴影纹理附加到其上。该命令是在\
  \ OpenGL 3.0 版本中引入的，以进一步支持阴影映射。使用这种方法时，不需要将 Z-buffer “拷贝”到纹理，因为缓冲区已经附加了纹理，因此 OpenGL\
  \ 会自动将深度信息放入纹理中。这是我们在实现中使用的方法。\n\n\n\n\n\n# 8.4.3 阴影映射（第二阶段）——渲染带阴影的场景\n\n第二阶段的大部分内容与我们在第\
  \ 7 章中看到的内容相似。具体来说，在这里我们渲染整个场景以及其中所有的物品，连同光照、材质以及装饰场景中对象的任何纹理。我们还需要添加必要的代码，以确定每个像素是否处于阴影中。\n\
  \n第二阶段的一个重要特性是它利用了两个 MVP 矩阵。一个是标准的 MVP 矩阵，用于将对象坐标转换到屏幕坐标（正如我们之前的大多数示例所示）。另一个是在第一阶段中生成的\
  \ `shadowMVP` 矩阵，用于从光点的视角进行渲染——现在，它将在第二阶段中使用，以便从阴影纹理中查找深度信息。\n\n当我们尝试在纹理图中查找像素时，第二阶段会出现一个复杂问题。OpenGL\
  \ 相机使用 `[-1..+1]` 坐标空间，而纹理图使用的是 `[0..1]` 空间。常见的解决方案是构建一个额外的矩阵变换，通常称为 `B`，它将坐标从相机空间转换为纹理空间（因此有了“偏置/bias”这个名字）。推导出\
  \ `B` 非常简单——先缩放一半，然后平移一半。\n\n`B` 矩阵如下：\n\n![image](img/pg195.jpg)\n\n然后将 `B` 矩阵连接到\
  \ `shadowMVP` 矩阵上并在第二阶段中使用，如下：\n\n```\nshadowMVP2 = [B] [shadowMVP[(pass1)]]\n```\n\
  \n假设我们使用了将阴影纹理附加到自定义帧缓冲区的方法，OpenGL 提供了一了一些相对简单的工具，用于在绘制对象时确定每个像素是否处于阴影中。以下是第二阶段中处理的细节摘要：\n\
  \n* 构建用于从光照点空间转换到纹理空间的“B”变换矩阵（实际上，这更适合在 `init()` 中完成）。\n* 启用阴影纹理用于查找。\n* 启用颜色输出。\n\
  * 启用 GLSL 第二阶段渲染程序，包含顶点着色器和片段着色器。\n* 根据相机位置为正在绘制的对象构建 MVP 矩阵（常常）。\n* 构建 `shadowMVP2`\
  \ 矩阵（包含前述的 `B` 矩阵)—着色器需要它来在阴影纹理中查找像素坐标。\n* 将矩阵变换发送到着色器统一变量。\n* 像通常一样启用包含顶点、法向量和纹理坐标（如果使用了）的缓冲区。\n\
  * 调用 `glDrawArrays()`。\n\n除了渲染职责，顶点着色器和片段着色器还有额外任务：\n\n* 顶点着色器将顶点位置从相机空间转换为光照空间，并将结果坐标作为顶点属性发送给片段着色器以便进行插值。这使得从阴影纹理中检索正确值成为可能。\n\
  * 片段着色器调用 `textureProj()` 函数，该函数返回 0 或 1，表示像素是否处于阴影中（该机制稍后解释）。如果处于阴影，着色器通过不包含其漫反射和高光贡献输出输出较暗的像素。\n\
  \n阴影映射是一个非常常见的任务，GLSL 提供了一种特殊类型的采样变量，称为 `sampler2DShadow`（如前所述），它可以附加到 C++/OpenGL\
  \ 应用程序中的阴影纹理。`textureProj()` 函数用于从阴影纹理中查找值，与我们之前在第 5 章中看到的 `texture()` 类似，只是它使用\
  \ `vec3` 索引纹理而不是通常 `vec2`。由于像素坐标是 `vec4`，有必要将其投影到 2D 纹理空间，以便在阴影纹图中查找深度值。正如我们将在看到的，`textureProj()`\
  \ 为我们完成了这一切。\n\n剩余的顶点和片段着色器代码实现了 Blinn-Phong 着色。这些着色器显示在图 8.6 和 8.7 中，并高亮了新增的阴影映射代码。\n\
  \n让我们仔细检查如何使用 OpenGL 执行正在渲染的像素与阴影纹理中的值之间的深度比较。我们在顶点着色器开始，使用模型空间中的顶点坐标，将其乘以 `shadowMVP2`\
  \ 以产生阴影纹理坐标，这些坐标对应于投影到光空间的顶点坐标（之前已从光点视角生成）。插值的（3D）光空间坐标 `(x,y,z)` 在片段着色器中使用如下。`z`\
  \ 分量代表从光到像素的距离。`(x,y)` 分量用于检索存储在（2D）阴影纹理中的深度信息。检索到的值（距离光最近的物体距离）与 `z` 进行比较。这种比较产生一个“二进制”结果，告诉我们正在渲染的像素是否比距离光最近的物体更远（即像素是否处于阴影中）。\n\
  \n![image](img/fig8_6.jpg)\n\n图 8.6\n阴影映射第二阶段顶点着色器。\n\n![image](img/fig8_7.jpg)\n\
  \n图 8.7\n阴影映射第二阶段片段着色器。\n\n如果在 OpenGL 中如之前所述样使用 `glFrameBufferTexture()`，并启用*深度测试*，那么在片段着色器中所示使用\
  \ `sampler2DShadow` 和 `textureProj()`（图 8.7）将完全符合我们的需求。也就是说，`textureProj()` 将输出\
  \ 0.0 或 1.0，取决于深度比较。根据这个值，片段着色器在像素比距离光最近的物体更远时省略其漫反射和高光贡献。\n\n![image](img/fig8_8.jpg)\n\
  \n图 8.8\n深度比较。\n\n## 8.5 阴影映射示例\n\n考虑图 8.9 中的场景，其中包含环面和一个金字塔。一个位置光放置在左侧（注意高光）。\n\
  \n金字塔应该在环面上投下阴影。\n\n![image](img/fig8_9.jpg)\n\n图 8.9\n无阴影的光照场景。\n\n为了开发此示例，第一步是渲染第一阶段以确保其运行正常。为此，我们将临时为第一阶段添加一个简单的片段着色器（最终版本将不包含它），仅输出固定颜色（例如红色）；如下：\n\
  \n```glsl\n#version 430\n\nout vec4 fragColor;\n\nvoid main()\n{ fragColor = vec4(1.0,\
  \ 0.0, 0.0, 1.0);\n}\n```\n\n假设之前场景的原点位于中心，金字塔和环面之间。在第一阶段中，我们将相机放置在光的位置（图 8.10 的左侧），并指向\
  \ (0,0,0)。如果然后将对象绘制成红色，将产生图 8.10 右侧所示的输出。注意顶部的环面——从这个角度看，它被金字塔挡住了。\n\n![image](img/fig8_10.jpg)\n\
  \n图 8.10\n第一阶段：场景（左）从光点视角（右）。\n\n带有光照和阴影映射的完整两阶段 C++/OpenGL 代码如程序 8.1 所示。\n\n***程序\
  \ 8.1 阴影映射***\n\n![image](img/prog8_1.jpg)\n![image](img/prog8_1-1.jpg)\n![image](img/prog8_1-2.jpg)\n\
  ![image](img/prog8_1-3.jpg)\n![image](img/prog8_1-4.jpg)\n![image](img/prog8_1-5.jpg)\n\
  \n\n\n\n程序 8.1 显示了 C++/OpenGL 应用中与之前详细介绍的 `pass one` 和 `pass two` 着色器交互的相关部分。未显示的是读取和编译着色器的常规模块、构建模型及其相关缓冲区、在着色器中安装位置点光的\
  \ ADS 特性，以及执行透视矩阵和视点矩阵的计算。这些内容与之前的示例中保持不变。\n\n## 8.6 阴影映射伪影\n\n尽管我们已经实现了为场景添加阴影的所有基本要求，但运行程序\
  \ 8.1 产生的结果参差不齐，如图图 8.11 所示。\n\n![image](img/fig8_11.jpg)\n\n图 8.11\n\n阴影“痤”。\n\n\
  好消息是，我们的金字塔现在向圆环面上投下了阴影！遗憾的是，这种成功伴随着严重的伪影。许多波状线覆盖了场景中的很多表面。这是阴影映射常见的副产品，被称为`阴影痤`（shadow\
  \ acne）或“错误的自阴影”。\n\n`阴影痤` 是深度测试过程中的舍入误差引起的。在查找阴影纹理深度信息时计算出的纹理坐标往往与实际坐标不完全匹配。因此，查找可能会返回相邻像素的深度，而不是正在渲染像素的深度。如果到相邻像素的距离更远，即使我们的像素不在阴影中，看起来也像是在阴影中。\n\
  \n`阴影痤` 也由于纹理图与深度计算之间的精度差异引起的。这同样会导致舍入误差，以及后续对像素是否处于阴影中的错误判断。\n\n幸运的是，修复`阴影痤`相当容易。由于`阴影痤`通常发生在不在阴影中的表面上，一个简单的技巧是在\
  \ `pass one` 期间将每个像素稍微向光源移动，然后在 `pass two` 期间将它们移回正常位置。这通常足以补偿任何类型的舍入误差。一种简单的方法是在\
  \ `display()` 函数中调用 `glPolygonOffset()`，如图图 8.12 所示（高亮部分）。\n\n在我们的 `display()` 函数中添加这几行代码将显著提高程序的输出质量，如图图\
  \ 8.13 所示。同样注意到，随着伪影的消失，我们现在可以看到圆环内圆在其身上投射了一个小小的正确阴影。\n\n![image](img/fig8_12.jpg)\n\
  \n图 8.12\n\n对抗阴影痤。\n\n![image](img/fig8_13.jpg)\n\n图 8.13\n\n带有阴影的渲染场景。\n\n![image](img/fig8_14.jpg)\n\
  \n图 8.14\n\n“彼得潘”。\n\n虽然修复`阴影痤`很容易，但有时修复会导致产生新的伪影。在 `pass one` 之前移动对象的“技巧”有时会导致物体阴影内部出现间隙。这种示例如图图\
  \ 8.14 所示。这种伪影通常被称为“彼得潘”（Peter Panning），因为有时它会导致静止物体的阴影不恰地与物体基座分离（从而导致物体阴影的部分与其余阴影脱离，让人联想起\
  \ J. M. Barrie 的角色彼得·潘 [PP23]）。修复这种伪影需要调整 `glPolygonOffset()` 参数。如果它们太小，可能会出现`阴影痤`；如果太大，则会发生彼得潘现象。\n\
  \n在阴影映射过程中可能会发生许多其他伪影。例如，阴影可能会重复，这是因为在 `pass one` 中渲染的场景区域（到阴影缓冲区中）与 `pass two`\
  \ 中渲染的场景区域不同（它们来自不同的观察点）。由于这种差异，场景中那些在 `pass two` 中渲染的但落在 `pass one` 渲染区域之外的部分，将尝试使用范围\
  \ [0..1] 之外的纹理坐标来访问阴影纹理。记住，这种情况下的默认行为是 `GL_REPEAT`，这可能导致错误的阴影重复。\n\n一种解决方案是在 `setupShadowBuffers()`\
  \ 中添加以下代码，将纹理包装模式设置为“限制到边缘”（clamp to edge）：\n\n```\nglTexParameteri(GL_TEXTURE_2D,\
  \ GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T,\
  \ GL_CLAMP_TO_EDGE);\n```\n\n这会导致纹理边缘之外的值被限制为边缘的值（而不是重复）。注意，这种方法可能会引入它自己的伪影，即当阴影纹理边缘存在阴影时，限制到边缘可能会产生一个延伸到场景边缘的“阴影条”。\n\
  \n另一个常见错误是`锯齿阴影边缘`（jagged shadow edges）。当投射的阴影明显大于阴影缓冲区能够准确表示范围时就会发生这种情况。这通常取决于场景中物体和光源的位置。特别是，当光源距离相关物体较远时，经常发生。示例如图图\
  \ 8.15 所示。\n\n![image](img/fig8_15.jpg)\n\n图 8.15\n\n锯齿阴影边缘。\n\n消除锯齿阴影边缘不像处理之前的伪影那么简单。一种技术是在\
  \ `pass one` 期间将光源位置移近场景，然后在 `pass two` 中将其返回到正确位置。另一种有效的方法是使用我们将讨论的“软阴影”方法。\n\n\
  ## 8.7 软阴影\n\n到目前介绍的方法仅限于产生硬阴影。这些是边缘清晰的阴影。然而，现实世界发生的大多数阴影都是软阴影。也就是说，它们的边缘变得不同模糊。在本节中，我们将探索真实世界中软阴影的外，然后描述一种常用的算法。\n\
  \n### 8.7.1 现实世界的软阴影\n\n软阴影有很多原因，软阴影也有很多类型。自然界软阴影的一个常见原因是光源很少是点——它们通常占据一定的面积。另一个原因是材料和表面的缺陷，以及物体本身通过反射属性产生环境光的作用。\n\
  \n![image](img/fig8_16.jpg)\n\n图 8.16\n\n软阴影真实世界示例。\n\n图 8.16 显示了一个物体在桌面上投下软阴影的照片。注意这不是\
  \ 3D 计算机渲染，而是一张真实的照片，拍摄于一位作者的家中。\n\n图 8.16 中的阴影有两个方面需要注意：\n\n- 阴影离物体越远，越“软”，离物体越近，越“硬”。在比较物体腿附近的阴影与图像右侧较宽阴影部分时，这一点显而易见。\n\
  - 阴影离物体越近，看起来越越深。\n\n光源本身的维度性会导致软阴影。如图图 8.17 所示，跨光源的各个区域投下了略有不同的阴影。阴影边缘的较亮区域——只有部分光被物体阻挡——被统称为半影（penumbra）。\n\
  \n### 8.7.2 生成软阴影 – 百分比深度过滤 (PCF)\n\n\n\n在软件中有多种方法模拟半影效果（penumbra effect）以生成软阴影。最简单且常用的方法之一被称为百分比深度过滤（`Percentage\
  \ Closer Filtering`，简称 `PCF`）。在 `PCF` 中（由 Reeves 等人在 1987 年提出 [RS87]），我们在周围的几个位置对阴影纹理进行采样，以估计附近有多少百分比的位置处于阴中。根据周围阴影的数量，我们增加或减少正在渲染像素的光照贡献。整个计算可以在片元着色器（fragment\
  \ shader）中完成，这也是唯一我们需要修改代码的地方。`PCF` 也可减少锯齿边缘 get。\n\n![image](img/fig8_18.jpg)\n\
  图 8.18\n硬边缘渲染。\n\n### PCF 的目标\n\n在学习实际的 `PCF` 算法之前，让我们先来看一个简单的启发性示例，以说明 `PCF` 的目标。考虑图\
  \ 8.18 所示的输出片段（像素）集合，其颜色由片元着色器计算。\n\n假设变暗的像素是使用阴影映射（shadow mapping）计算出的阴影部分。与其简单地如图所示渲染像素（即包含或不包含漫反射和高光分量），假设我们可以获取相邻像素的信息，这样我们看到有多少相邻像素处于阴影中。例如，考虑图\
  \ 8.19 中黄色高亮的特定像素，根据图 8.18，它不在阴影中。\n\n![image](img/fig8_19.jpg)\n图 8.19\n特定像素的 PCF\
  \ 采样。\n\n在高亮像素的九像素邻域中，有三个像素处于阴影中，六个不在。因此，渲染像素的颜色可以计算为该像素环境光贡献之和加上漫反射与高光贡献的九之六，从而得到一个相当亮（但不是完全亮）的像素。在整个网格中重复此过程将产生大致如图\
  \ 8.20 所示的像素颜色。注意，对于那些邻域完全处于阴影中（或不在阴影中）的像素，得到的颜色与标准阴影映射相同。\n\n### PCF 的工作原理\n\n\
  与刚才的示例不同，`PCF` 的实现并没有对渲染像素周围范围内的每个像素进行采样。原因有两个：(a)我们希望在片元着色器中执行此计算，但片元着色器无法访问其他像素；(b)为了获得足够宽的半影效果（例如，十到二十像素宽），需要对每个渲染像素采样数百个邻近的像素。\n\
  \n![image](img/fig8_20.jpg)\n图 8.20\n软阴影渲染。\n\n`PCF` 通过以下方式解决这两个问题。首先，我们并不尝试访问相邻像素，而是采样阴影映射中邻近的*纹理元素*（texels）。片元着色器可以做到这一点，因为尽管它无法访问相邻的像素值，但它可以访问整个阴影映射。其次，为了获得足够宽的半影效果，会采样一定数量的相邻阴影映射纹理元素，每个采样点与渲染像素对应的纹理元素之间有一定的适中距离。\n\
  \n![image](img/fig8_21.jpg)\n图 8.21\n软阴影渲染 – 每个像素 64 次采样。\n\n半影的宽度和采样点的数量根据场景和性能要求进行调整。例如，图\
  \ 8.21 所示的图像是使用 `PCF` 生成的，每个像素的亮度通过采样距离像素纹理元素不同距离的 64 个相邻阴影映射纹理元素决定。\n\n软阴影的准确性或平滑取决于采样的相邻纹理元素数量。因此，性能和质量之间存在权衡——采样点越多，结果越好，但计算开销也越大。根据场景的复杂性和应用程序所需的帧率，可实现的质量通常有一个相应的实际限制。每个像素采样\
  \ 64 个点（如图 8.21 所示）通常是不切行的。\n\n### 实现 PCF\n\n实现 `PCF` 的常用算法是每个像素采样四个相邻的纹理元素，采样点选择在与像素对应的纹理元素的指定偏移距离处。当我们处理每个像素时，我们会更改用于确定采样哪四个纹理元素的偏移量。以交错方式更改偏移有时被称为*抖动*（*dithering*），旨在使软阴影边界看起来比在采样点较少的情况下通常不那么“块状”。\n\
  \n一种常用方法是假设有四种不同的偏移模式——我们可以通过计算像素的 `glFragCoord mod 2` 来选择为给定像素使用哪种模式。记得 `glFragCoord`\
  \ 的类型为 `vec2`，包含像素位置的 x 和 y 坐标；`mod` 计算的结果是四个值之一：`(0,0)`、`(0,1)`、`(1,0)` 或 `(1,1)`。我们使用此结果在纹理元素空间（即阴影映射中）选择我们的四种不同偏移模式之一。\n\
  \n偏移模式通常在 x 和 y 方向上指定，具有 `-1.5`、`-0.5`、`+0.5` 和 `+1.5` 的不同组合（这些也可以需要进行缩放）。\n\n![image](img/pg21.jpg)\n\
  \n`S[x]` 和 `S[y]` 指阴影映射中对应于渲染像素的 `(S[x], S[y])` 位置（在书中称为 `shadow_coord`）。这些偏移模式在图\
  \ 8.22 中所示，每种情况用不同的颜色显示。在每种情况下，对应于渲染像素的纹理元素位于该图的中心点。注意，当在图 8.23 中一起显示时，偏移的交错/抖动是可见的。\n\
  \n![image](img/fig8_22.jpg)\n图 8.22\n抖动的四像素 PCF 采样。\n\n让我们遍历特定像素的整个计算过程。假设渲染的像素位于\
  \ `glFragCoord = (48,13)`。我们首先确定该像素的四个阴影点。为了这一点，我们会计算 `vec2(48,13) mod 2`结果为 `(0,1)`。从这里我们选择图\
  \ 8.22 中用绿色所示的 `(0,1)` 情况的偏移，阴影映射中具体的采样点（假设未对偏移进行缩放）将是：\n`shadow_coord.x–1.5, shadow_coord.y+0.5`\n\
  - `shadow_coord.x–1.5, shadow_coord.y–1.5`\n- `shadow_coord.x+0.5, shadow_coord.y+0.5`\n\
  - `shadow_coord.x+0.5, shadow_coord.y–1.5`\n\n（记得 `shadow_coord` 是阴影映射中对应于渲染像素的纹理元素的位置——在图\
  \ 8.22 和 8.23 中以白色圆圈表示。）\n\n![image](img/fig8_23.jpg)\n图 8.23\n抖动的四像素 PCF 采样（四种情况一起显示）。\n\
  \n接下来，我们对这四个点中的每一个调用 `textureProj()`，在每种情况下，根据该采样点是否处于阴中返回 `0.0` 或 `1.0`。我们将这四个结果相加并除以\
  \ `4.0`，以确定处于阴中的采样点的百分比。然后，该百分比被用作乘因子，用于确定渲染当前像素时应用漫反射和高光照明的量。\n\n\n\n尽管采样尺寸很小——每个像素只有四个样本——但这种抖动方法通常能产生令人惊讶的良好软阴影。图\
  \ 8.24 是使用四点抖动 PCF 生成的。虽然效果不如之前在图 8.21 中所示的 64 点采样版本，但它的渲染速度快得多。\n\n![image](img/fig8_24.jpg)\n\
  \n图 8.24\n\n软阴影渲染 – 每个像素四个样本，抖动处理。\n\n在下一节中，我们将开发 GLSL 片元着色器，用于生成这种四样本抖动 PCF 软阴影以及之前显示的\
  \ 64 样本 PCF 软阴影。\n\n### 8.7.3 软阴影/PCF 程序\n\n如前所述，软阴影计算完全可以在片元着色器中完成。程序 8.2 显示了替换图\
  \ 8.7 中着色器的片元着色器。PCF 添加部分已高亮显示。\n\n#### 程序 8.2 百分比深度过滤 (PCF)\n\n![image](img/prog8_2.jpg)\n\
  \n![image](img/prog8_2-1.jpg)\n\n程序 8.2 显示的片元着色器包含了四样本和 64 样本 PCF 软阴影的代码。首先，定义了一个函数\
  \ `lookup()` 以使采样过程更加方便。它调用 GLSL 函数 `textureProj()`，该函数在阴影贴图中中进行查找，但带有指定量（`ox,oy`）的偏移。偏移乘以\
  \ `1/windowsize`，在这里我们将其硬编码为 `.001`，假设窗口大小为 1000×1000 像素。²\n\n四样本抖动计算在 `main()`\
  \ 中被高亮显示，它遵循了上一节描述的算法。添加了一个缩放因子 `swidth`，可用于调整阴影边缘“软”区域的大小。\n\n64 样本代码紧随其后并被注释掉。通过取消其注释并改为注释四样本代码，可以使用它替代四样本计算。64\
  \ 样本代码中的 `swidth` 缩放因子在嵌套循环中用作步长，该循环对距离渲染像素不同距离的点进行采样。例如，使用所示的 `swidth` 值 (2.5)，将沿每个轴在两个方向分别为\
  \ 1.25、3.75、6.25 和 8.25 的距离进行采样——然后根据窗口大小（如前所述）进行缩放，并作为阴影贴图的纹理坐标。有了如此多的样本，通常不需要抖动即可获得良好结果。\n\
  \n图 8.25 展示了我们运行的圆环/金字塔阴影映射示例，结合了来自程序 8.2 的片元着色器的 PCF 软阴影，涵盖了四样本和 64 样本两种方法。`swidth`\
  \ 的值取决于场景；对于圆环/金字塔示例，它被设置为 2.5，而之前在图 8.21 中显示的海豚示例，`swidth` 被设置为 8.0。\n\n![image](img/fig8_25.jpg)\n\
  \n图 8.25\n\nPCF 软阴影渲染——每像素 4 样本，抖动处理（左），以及每像素 64 样本，不抖动（右）。\n\n## 补充说明\n\n在本章中，我们仅对\
  \ 3D 图形中的阴影世界进行了最基本的介绍。即使使用这里介绍的最基础阴影映射方法，如果用于更复杂的场景，也可能需要进一步学习。\n\n例如，当为带有纹理的物体场景添加阴影时，必须确保片元着色器能够正确区分阴影贴图与其他纹理。实现此点的简单方法是将它们绑定到不同的纹理单元，例如：\n\
  \n```cpp\nlayout (binding = 0) uniform sampler2DShadow shTex;\nlayout (binding =\
  \ 1) uniform sampler2D otherTexture;\n```\n\n然后，C++/OpenGL 应用可以通过绑定值引用这两个采样器。\n\n\
  当场景使用多个光源时，需要多个阴影贴图——每个光源一个。此外，每个光源都需要执行一次*第一阶段*（pass one），并在第二阶段（pass two）中混合结果。\n\
  \n尽管我们在阴影映射的每个阶段都使用了投影投影，但值得注意的是，当光源是远距离且方向性的，通常更倾向于使用*正交*投影，而不是我们所使用的位置光源。\n\n\
  生成真实的阴影是计算机图形学一个丰富且复杂的领域，许多可用技术超出了本文的范围。鼓励感兴趣的读者研究更专业的资源，如 [ES12]、[GP10] 和 [MI20]。\n\
  \n程序 8.2 的第二个片元着色器包含了一个 GLSL 函数 `lookup()` 的示例。与 C 语言一样，函数必须在调用之前（或“上方”）定义，否则必须提供前向声明。在示例中，不需要前向声明，因为函数已定义在调用上方。\n\
