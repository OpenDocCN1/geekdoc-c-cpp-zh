  # * 补充笔记\n\n![image](img/common.jpg)\n\n在本章中，我们将探索利用整本书中学到的工具来实现的各种技术。其中一些我们将进行完整开发，而另一些则只提供较为简要的描述。图形编程是一个巨大的领域，本章绝非详尽，而是对多年年来开发的一些创意效果的简单介绍。\n\
  \n## 14.1 雾 (FOG)\n\n通常当人们想到雾时，他们想到的是能见度很低的清晨薄雾。事实上，大气雾霾（如雾）比我们大多数人想象的要常见。大部分时候，空气中都有某种程度的雾霾，尽管我们已经习惯了看到它，但通常并不会意识到它的存在。因此，我们可以通过引入雾来增强户外场景的真实感——即使只有少量的。\n\
  \n雾还可以增强深度感。当近处的物体的清晰度高于远处的物体时，这是大脑可以用来解析 3D 场景地形的另一个视觉线索。\n\n![image](img/fig14_1.jpg)\n\
  \n图 14.1\n\n雾：基于距离的混合。\n\n模拟雾的方法有很多，从非常简单的方法到包含光散射效应的复杂模型。然而，是非常简单的方法也是有效的。其中一种方法是根据物体距离眼睛的远，将实际像素颜色与另一种颜色（“雾”颜色，通常为灰蓝色——也用于背景颜色）进行混合。\n\
  \n[图 14.1] 展示了这一概念。左侧显示眼睛（相机），视锥体内放置了两个红色物体。圆柱体靠近眼睛，所以它大部分是原始颜色（红色）；立方体离眼睛较远，所以大部分是雾色。对于这种简单的实现，几乎所有的计算都可以在片段着色器（fragment\
  \ shader）中完成。\n\n程序 14.1 显示了用于非常简单的雾算法的相关代码，该算法根据相机到像素的距离，从物体颜色到雾颜色使用线性混合。具体而言，这个示例为程序\
  \ 10.4 中的高度映射示例添加了雾。\n\n***程序 14.1 简单的雾的生成***\n\n```\n![image](img/prog14_1.jpg)\n\
  ![image](img/prog14_1-1.jpg)\n```\n\n变量 `fogColor` 指定了雾的颜色。变量 `fogStart` 和 `fogEnd`\
  \ 指定了输出颜色从物体颜色过渡到雾颜色的范围（在眼球空间中），并可以进行调整以满足场景需求。与物体颜色混合的雾的百分比在变量 `fogFactor` 中计算，它是顶点距离\
  \ `fogEnd` 的程度与过渡区域总长度的比例。GLSL 的 `clamp()` 函数用于将此比例限制在 0.0 到 1.0 之间。然后 GLSL 的 `mix()`\
  \ 函数根据 `fogFactor` 的值返回雾颜色和物体颜色的加权平均值。[图 14.2] 显示了在具有高度映射地形的场景中添加雾。（还应用了来自 [LU16]\
  \ 的岩石纹理。）\n\n![image](img/fig14_2.jpg)\n\n图 14.2\n\n雾示例。\n\n## 14.2 合成 / 混合 / 透明度\n\
  \n我们已经看到了一些混合的例子——在第 7 章的补充笔记中，以及之前我们在雾中的实现。然而，我们还没有看到如何利用像素操作中位于片段着色器之后的混合（或合成）能力（回想\
  \ [图 2.2] 所示的流水线顺序）。透明度就是在那里处理的，我们现在来看这里。\n\n在整本书中，我们频繁使用 `vec4` 数据类型来表示齐次坐标系中的\
  \ 3D 点和向量。你可能已经注意到我们也经常使用 `vec4` 来存储颜色信息，其中前三个值由红、绿、蓝组成，第四个元素是什么？\n\n颜色中的第四个元素称为\
  \ alpha 通道（alpha channel），指定了颜色的不透明度。不透明度是像素透明的程度。Alpha 值 0 表示不透明。Alpha 值 1 表示完全不透明。回想第\
  \ 2 章，alpha 通道用于帧缓冲区中的透明度。\n\n合成过程工作如下：\n1. 源像素和目标像素分别乘以源因子和目标因子。[图 14.3] 显示了合成过程的概述。\n\
  2. 然后使用指定的 `blendEquation` 组合修改后的源像素和目标像素以产生新的目标颜色。\n\n![image](img/fig14_3.jpg)\n\
  \n图 14.3\n\nOpenGL 合成。\n\n`glBlendFunc()` 最常用的选项（即 srcFactor 和 destFactor）如下表所示：\n\
  \n| glBlendFunc() 参数 | 产生的 srcFactor 或 destFactor |\n| :--- | :--- |\n| GL_ZERO\
  \ | (0,0,0,0) |\n| GL_ONE | (1,1,1,1) |\n| GL_SRC_COLOR | (R[src],G[src],B[src],A[src])\
  \ |\n| GL_ONE_MINUS_SRC_COLOR | (1,1,1,1) - (R[src],G[src],B[src],A[src]) |\n| GL_DST_COLOR\
  \ | (R[dest],G[dest],B[dest],A[dest]) |\n| GL_ONE_MINUS_DST_COLOR | (1,1,1,1) -\
  \ (R[dest],G[dest],B[dest],A[dest]) |\n| GL_SRC_ALPHA | (A[src],A[src],A[src],A[src])\
  \ |\n| GL_ONE_MINUS_SRC_ALPHA | (1,1,1,1) - (A[src],A[src],A[src],A[src]) |\n| GL_DST_ALPHA\
  \ | (A[dest],A[dest],A[dest],A[dest]) |\n| GL_ONE_MINUS_DST_ALPHA | (1,1,1,1) -\
  \ (A[dest],A[dest],A[dest],A[dest]) |\n| GL_CONSTANT_COLOR | (R[blendColor],G[blendColor],B[blendColor],A[blendColor])\
  \ |\n| GL_ONE_MINUS_CONSTANT_COLOR | (1,1,1,1) - (R[blendColor],G[blendColor],B[blendColor],A[blendColor])\
  \ |\n| GL_CONSTANT_ALPHA | (A[blendColor],A[blendColor],A[blendColor],A[blendColor])\
  \ |\n| GL_ONE_MINUS_CONSTANT_ALPHA | (1,1,1,1) - (A[blendColor],A[blendColor],A[blendColor],A[blendColor])\
  \ |\n| GL_ALPHA_SATURATE | (f, f, f, 1) 其中 f = min(A[src], 1) |\n\n\n\n\n\n那些指示“blendColor”（`GL_CONSTANT_COLOR`\
  \ 等）的选项需要额外调用 `glBlendColor()` 来指定一个用于计算混合函数结果的常数颜色。还有几个未在之前的列表中列出的额外混合函数。\n\n`glBlendEquation()`\
  \ 参数（即模式）的可能选项如下：\n\n| mode | 混合颜色 |\n| :--- | :--- |\n| `GL_FUNC_ADD` | `result\
  \ = source[RGBA] + destination[RGBA]` |\n| `GL_FUNC_SUBTRACT` | `result = source[RGBA]\
  \ – destination[RGBA]` |\n| `GL_FUNC_REVERSE_SUBTRACT` | `result = destination[RGBA]\
  \ – source[RGBA]` |\n| `GL_MIN` | `result = min(source[RGBA], destination[RGBA])`\
  \ |\n| `GL_MAX` | `result = max(source[RGBA], destination[RGBA])` |\n\n`glBlendFunc()`\
  \ 的默认值对于 `srcFactor` 为 `GL_ONE` (1.0)，对于 `destFactor` 为 `GL_ZERO` (0.0)。`glBlendEquation()`\
  \ 的默认值是 `GL_FUNC_ADD`。因此，默认情况下，源像素保持不变（乘以 1），目标像素被缩放为 0，然后两者相加——这意味着源像素变成了帧缓冲区颜色。\n\
  \n还有命令 `glEnable(GL_BLEND)` 和 `glDisable(GL_BLEND)`，它们可以用于告诉 OpenGL 应用指定的混合，或者忽略它。\n\
  \n我们在这里不会阐说明所有选项的效果，但我们将通过过一些说明性示例。假设我们在 C++/OpenGL 应用中指定了以下设置：\n\n```\n•glBlendFunc(GL_SRC_ALPHA,\
  \ GL_ONE_MINUS_SRC_ALPHA)\n•glBlendEquation(GL_FUNC_ADD)\n```\n\n合成过程将按如下方式进行：\n\
  \n1. 源像素按其 alpha 值进行缩放。\n2. 目标像素按 `1-srcAlpha`（*源透明度*）进行缩放。\n3. 像素值相加。\n\n例如，如果源像素是红色的，不度为\
  \ 75%：`[1, 0, 0, 0.75]`，而目标像素包含完全不透明的绿色：`[0, 1, 0, 1]`，那么放置在帧缓冲区中的结果将是\n\n```\n\
  srcPixel * srcAlpha = [0.75, 0, 0, 0.5625]\ndestPixel * (1-srcAlpha) = [0, 0.25,\
  \ 0, 0.25]\nresulting pixel = [0.75, 0.25, 0, 0.8125]\n```\n\n也就是说，结果以红色为主，带有一些绿色，并且大部分是不透明的。这些设置的整体效果是让目标根据源像素透明度对应的量显示。在这个示例中，帧缓冲区中的像素是绿色的，进入的像素是红色的且带有\
  \ 25% 的透明度（75% 的不透明）。因此允许一些绿色透过红色显示。\n\n事实证明，这些混合函数和混合方程的设置在很多情况下运行良好。让我们将其应用到一个包含两个\
  \ 3D 模型的实际示例中：一个圆环和一个位于圆环前面的金字塔。图 14.4 显示了这样一个场景，左侧是一个不透明的金字塔，右侧的金字塔的 alpha 值被设置为\
  \ 0.8。已经添加了光照。\n\n![image](img/fig14_4.jpg)\n\n**图 14.4**\n`alpha=1.0` 的金字塔（左）和\
  \ `alpha=0.8` 的（右）。\n\n对于许多应用程序——例如作为房屋模型的一部分创建一个平面的“窗口”——这种简单的透明实现可能足够了。然而，在图 14.4\
  \ 所示的示例中，存在相当明显的缺陷。尽管金字塔模型现在实际上是透明的，但一个真正的透明金字塔不仅应该显示它后面的物体，还应该显示*它自己的背面*。\n\n实际上，金字塔背面没有出现的原因是因为我们开启了背面剔除。一个合理的想法是在绘制金字塔时禁用背面剔除。然而，这通常会产生其他伪影，如图\
  \ 14.5 所示（左侧）。禁用背面剔除的问题在于，混合效果取决于表面渲染的顺序（因为那决定了源像素和目标像素），我们并不总是能控制渲染顺序。通常情况下，先渲染不透明物体以及在任何透明物体之前渲染后面的物体（如圆环）是有益的。对于金字塔的表面也是如此，在这种情况下，组成金字塔底部的两个三角形显示不同的原因是，其中一个在金字塔正面之前渲染，另一个在之后渲染。像这样的伪影有时被称为“顺序”伪影，它们可能会出现在透明模型中，因为我们不能总是预测其三角形被渲染的顺序。\n\
  \n我们可以通过手动分离渲染正面和背面（从背面开始）来解决金字塔示例中的问题。程序 14.2 显示了执行此操作的代码。\n\n```\n程序 14.2 双通道混合\n\
  ```\n![image](img/fig14_2.jpg)\n\n通过分别渲染正面和背面来解决问题。我们将指定的 alpha 值传递给顶点着色器。注意，我们需要在顶点着色器中定义它。\n\
  \n这种双通道方案的结果在图 14.5 所示（右侧）。尽管这里可以有效，但 `gl_ClipDistance[]` 数组并不总是足够的\n\n![image](img/fig14_5.jpg)\n\
  \n**图 14.5**\n透明度和顺序（左）和双通道（右）。\n\n## 14.3 用户定义的裁剪平面\n\nOpenGL 包含了指定视锥体之外的裁剪平面的功能。这使得通过从简单模型开始切割部分来创建复杂的形状成为可能。\n\
  \n平面根据标准的数学定义为：\n\n`ax + by + cz + d = 0`\n\n其中 `a, b, c` 是平面的法向量 `(a,b,c)`，`d`\
  \ 是原点到平面的距离。这种平面可以在顶点着色器中使用 `vec4` 指定：\n\n```\nvec4 clip_plane = vec4(0.0, 0.0,\
  \ -1.0, 0.2);\n```\n\n这将对应于平面：`(0.0) x + (0.0) y + (-1.0) z + 0.2 = 0`。裁剪随后也可以通过使用内置的\
  \ GLSL 变量 `gl_ClipDistance[]` 来实现，如下例所示：\n\n```\ngl_ClipDistance[0] = dot(clip_plane.xyz,\
  \ vertPos) + clip_plane.w;\n```\n\n在这个示例中，`vertPos` 指向进入顶点着色器的顶点位置（例如来自 VBO）；`clip_plane`\
  \ 在上面定义。我们计算计算裁剪平面到进入顶的符号距离，在平面上则为 0，取决于顶点位于平面的哪侧决定正负。`gl_ClipDistance` 数组的下标允许定义多个裁剪距离（即多个平面）。\n\
  \n用户定义的裁剪需要在 C++/OpenGL 应用中启用。存在内置的 OpenGL 标识符 `GL_CLIP_DISTANCE0`、`GL_CLIP_DISTANCE1`\
  \ 等，对应于每个 `gl_ClipDistance[]` 数组元素。可以如下启用第 0 个用户定义的裁剪平面：\n\n```\nglEnable(GL_CLIP_DISTANCE0);\n\
  ```\n\n\n\n\n\n# 使用背面进行裁剪。\n\n将之前的步骤应用于我们的受光圆环体，将得到输出如 图 14.6 所示，其中圆环的前半部分已被裁剪。（同时也应用了旋转以提供更清晰的视图。）\n\
  \n看起来圆环的底部部分似乎也被裁剪了，但那是因为没有渲染圆环的内部面。当裁剪显示出形状的内部表面时，有必要对它们也进行渲染，否则模型将看起来不完整（如 图 14.6\
  \ 所示）。\n\n渲染内部表面需要再次调用 `gl_DrawArrays()`，并反转绕向顺序。此外，在渲染背向的三角形时，需要反转表面法线向量（正如在前一节中所做的那样）。C++\
  \ 应用程序和顶点着色器的相关修改如程序 14.3 所示，输出如 图 14.7 所示。\n\n***程序 14.3 使用背面进行裁剪***\n\n```\n![image](img/prog14_3.jpg)\n\
  ![image](img/prog14_3-1.jpg)\n```\n\n## 14.4 3D 纹理\n\n2D 纹理包含由两个变量索引的图像数据，而 3D 纹理包含相同类型的图像数据，但处于由三个变量索引的\
  \ 3D 结构中。前两个维度仍然代表纹理图中的 `width` 和 `height`；第三个维度代表 `depth`。\n\n由于 3D 纹理中的数据存储方式与\
  \ 2D 纹理相似，人们往往容易将 3D 纹理视为某种 3D “图像”。然而，我们通常不将 3D 纹理源数据称为 3D 图像，因为没有用于这种结构的常用图像文件格式（即：没有类似于\
  \ 3D JPEG 的东西，至少不是真正的三维 JPEG）。相反，我们建议将 3D 纹理视为某种“物质”，我们将待纹理化的对象浸入（或“蘸入”）这种物质中，使得对象的表面点从纹理的相应位置获取颜色。或者，想象对象正从\
  \ 3D 纹理“立方体”中被“刻”出来，就像雕塑家从单块大理石中刻出一个像一样。\n\nOpenGL 支持 3D 纹理对象。为了使用它们，我们需要学习如何构建\
  \ 3D 纹理以及如何使用它为对象进行纹理化。\n\n与从标准图像文件构建的 2D 纹理不同，3D 纹理通常是 `procedurally`（过程化）生成的。正如之前处理\
  \ 2D 纹理那样，我们决定一个分辨率——即每个维度中纹素（texels）的数量。根据纹理中的颜色，我们可以构建一个包含这些颜色的三维数组。或者，如果纹理包含可以使用多种颜色的“模式”，我们可能会构建一个存储该模式的数组，例如使用\
  \ 0 和 1。\n\n例如，我们可以通过用填充与所需条纹模式对应的 0 和 1 数组，来构建一个表示水平条纹的 3D 纹理。假设纹理的目标辨率为 200x200x200\
  \ 纹素，且纹理由交替的条纹组成，每个条纹高度为 10 纹素。使用嵌套循环在数组中填充适当的 0 和 1 来构建此类结构的简单函数（假设在这种情况下 `width`、`height`\
  \ 和 `depth` 变量均设置为 200）如下：\n\n```\n![image](img/pg341.jpg)\n```\n\n存储在 `tex3Dpattern`\
  \ 数组中的模式如 图 14.8 所示，其中 0 渲染为蓝色，1 渲染为黄色。\n\n使用如 图 14.8 所示的条纹模式对对象进行纹理化需要以下步骤：\n\n\
  ```\n![image](img/fig14_8.jpg)\n```\n\n图 14.8\n\n条纹状 3D 纹理模式。\n\n1. 如前文所示生成模式\n\
  2. 使用模式填充具有所需颜色的字节数组\n3. 将字节数组加载到纹理对象中\n4. 为对象顶点确定合适的 3D 纹理坐标\n5. 使用适当的采样器在片元着色器中对对象进行纹理化\n\
  \n3D 纹理坐标范围从 0 到 1，与 2D 纹理相同。\n\n有趣的是，步骤 #4（确定 3D 纹理坐标）通常比最初想象的要简单得多。事实上，它通常比 2D\
  \ 纹理更简单！这是因为（在 2D 纹理的情况下）由于是用 2D 图像对 3D 对象进行纹理化，我们需要决定如何“展平”3D 对象的顶点（例如通过 UV 映射）来创建纹理坐标。但在进行\
  \ 纹 D 化时，对象和纹理具有相同的维度（三维）。在大多数情况下，我们希望对象反映纹理模式，就像它是从中被“刻”出来（或浸入其中）。因此，顶点位置本身就充当了纹理坐标。通常只需要应用\
  \ `loadDtexture()` 函数。\n\n```\n![image](img/prog14_4.jpg)\n![image](img/prog14_4-1.jpg)\n\
  ![image](img/prog14_4-2.jpg)\n```\n\n***程序 14.4 3D 纹理：条纹模式***\n\n在 C++ 应用程序中，`loadDtexture()`\
  \ 函数将生成的数据加载到 3D。它没有使用 SOIL2 来加载纹理，而是调用相关的 OpenGL 调用，类似于之前在 5.12 节 中解释的方法。预计图像数据为\
  \ RGBA 组件序列。`fillData()` 函数执行此操作，应用了由 `generate3Dpattern()` 构建并存储在 `tex3Dpattern`\
  \ 数组中的 RGB 值。注意 `display()` 函数中指定的纹理类型 `GL_TEXTURE_3D`。由于我们希望使用顶点作为纹理坐标，我们将其从顶点着色器传递到片元着色器。片元着色器随后对其进行缩放，使其映射到\
  \ [0..1] 范围内，这是纹理坐标的标准。最后，3D 纹理通过 `sampler3D` 均匀访问，它接收三个参数而不是两个。我们使用顶点原始 X、Y、Z 坐标（缩放到正确范围）来访问纹理。结果如\
  \ 图 14.9 所示。\n\n```\n![image](img/fig14_9.jpg)\n```\n\n图 14.9\n\n带有 3D 条纹纹理的龙。\n\
  \n通过修改 `generate3Dpattern()` 可以生成更复杂的模式。图 14.10 显示了一个简单的更改，将条纹模式转换为 3D 棋盘格。产生的效果随后如\
  \ 图 14.11 所示。值得注意的是，如果龙的表面是用 2D 棋盘格纹理模式进行纹理化的，效果将大不同。（见练习 14.3。）\n\n```\n![image](img/fig14_10.jpg)\n\
  ```\n\n\n\n\n\n# 图 14.10\n生成棋盘状 3D 纹理图案。\n\n## 14.5 噪声 (NOISE)\n\n许多自然现象可以使用随机性或`noise`\
  \ 来模拟。一种常用技术 `Perlin Noise` [PE85] 以 Ken Perlin 的名字命名，他在 1997 年因开发了一种生成和使用 2D 及\
  \ 3D 噪声的实用方法而获得了奥斯卡奖¹。这里描述的过程基于 Perlin 的方法。\n\n![image](img/fig14_11.jpg)\n\n###\
  \ 图 14.11\n具有 3D 棋盘纹理的巨龙。\n\n噪声在图形场景中有许多应用。常见的例子包括云层、地形、木纹、矿物（如大理石中的纹理）、烟雾、火、火焰、行星表面以及随机运动。在本节中，我们关注生成包含噪声的\
  \ 3D 纹理，随后的章节将说明如何使用噪声数据生成如大理石和木材等复杂材料，并模拟用于立方体贴图或天穹顶的动画云纹理。包含噪声的空间数据集合（例如 2D 或\
  \ 3D）有时被称为 `noise map`（噪声图）。\n\n我们从使用随机数据构建一个 3D 纹理图开始。这可以使用上一节所示的函数并经过一些修改来完成。首先，我们将程序\
  \ 14.4 中的 `generate3Dpattern()` 函数替换为以下更简洁的 `generateNoise()` 函数：\n\n![image](img/pg346.jpg)\n\
  \n接下来，修改程序 14.4 中的 `fillDataArray()` 函数，将噪声数据复制到字节数组中，以便准备加载到纹理对象，如下所示：\n\n![image](img/pg347.jpg)\n\
  \n程序 14.4 中用于将数据加载到纹理对象并将其应用于模型的其余部分保持不变。我们可以通过将其应用到简单的立方体模型来查看此 3D 噪声图，如图 14.12\
  \ 所示。在本示例中，`noiseHeight = noiseWidth = noiseDepth = 256`。\n\n这是一个 3D 噪声图，尽管它并不 Practical\
  \ 有用。就目前而言，它的噪声*太*大了，无法产生许多实际应用。为了创建更实用的、可调的噪声图案，我们将用不同的噪声产生过程替换 `fillDataArray()`\
  \ 函数。\n\n![image](img/fig14_12.jpg)\n\n### 图 14.12\n贴有 3D 噪声数据的立方体。\n\n假设我们通过使用整数除法使索引变，从而“缩放”到图\
  \ 14.12 所示的噪声图的一个较小子集来填充数据数组。`fillDataArray()` 函数的修改如下所示。生成的 3D 纹理可以根据用于除以索引的“缩放”因子呈现出不同程度的“块状”。在图\
  \ 14.13 中，这些纹理显示了通过将索引除以 8、16 和 32 缩放因子进行缩放的结果（从左到右分别）。\n\n![image](img/fig14_13.jpg)\n\
  \n### 图 14.13\n具有各种“缩放”因子的“块状” 3D 噪声图。\n\n![image](img/pg348.jpg)\n\n给定噪声图中的“块状”可以通过从每个离散灰度颜色值插值到下一个值来被`smoothed`（平滑）。也就是说，对于给定\
  \ 3D 纹理中的每个小“块”，我们通过从其颜色到相邻块的颜色进行插值，设置该块内的每个纹素颜色。插值代码在函数 `smoothNoise()` 中所示，同时还有修改后的\
  \ `fillDataArray()` 函数。生成的“平滑”纹理（缩放因子为 2, 4, 8, 16, 32 和 64——从左到右，从上到下）随后出现在图 14.14\
  \ 中。注意，现在缩放因子是一个双精度浮点数，因为因为我们需要小数部分来确定每个纹素的插值灰度值。\n\n![image](img/pg348-1.jpg)\n\
  \n![image](img/pg349.jpg)\n\n`smoothNoise()` 函数通过计算相应原始“块状”噪声图中环绕纹素的八个灰度值的加权平均值，计算给定噪声图平滑版本中每个纹素的灰度值。也就是说，它对纹素所在小“块”八个顶点的颜色值取平均。这些“邻居”颜色的权重基于纹素到每个邻居的距离，并归一化到\
  \ `[0..1]` 范围。末端的值平滑衔接以便于平铺。\n\n接下来，将各种缩放因子的平滑噪声图进行`combined`（合并）。创建一个新的噪声图，其中每个纹素由另一个加权平均值形成，这次是基于每个“平滑”噪声图中相同位置纹素之和，并以缩放因子作为权重。这种效果被\
  \ Perlin [PE85] 称为“turbulence”（湍流），尽管它实际上与通过求和各种波形产生的谐波更为密切相关。新的 `turbulence()`\
  \ 函数以及指定缩放级别为 1 到 32 噪声图的修改版 `fillDataArray()` 如下所示，以及一个贴有结果结果的立方体图像。\n\n![image](img/fig14_14.jpg)\n\
  \n### 图 14.14\n不同层级的 3D 纹理平滑处理。\n\n![image](img/pg350.jpg)\n\n![image](img/pg351.jpg)\n\
  \n正如我们在接下来的章节中看到的，3D 噪声图可以用于各种应用。要注意，由于我们使用了连续的 2 的幂，只有当维度也是 2 的幂时，它才能平滑衔接。在我们展示的所有示例中，维度都是\
  \ 256。\n\n### 图 14.15\n带有合并“湍流”噪声的 3D 纹理图。\n\n---\n\n## 14.6 噪声应用——大理石\n\n通过修改噪声图并添加之前在图\
  \ 7.3 中描述的适当材质 光，可以让巨龙模型看起来是由大理石制成的。\n\n我们首先生成一种与本章前面的“条纹”示例相似的条纹图案——新的条纹与之前的不同，首先是因为它们是斜的，其次是因为它们是由正弦波产生的，因此边缘模糊。我们然后使用噪声图来扰动这些线条，将其存储为灰度值。`fillDataArray()`\
  \ 函数的更改如下：\n\n![image](img/pg351-1.jpg)\n\n![image](img/pg352.jpg)\n\n变量 `veinFrequency`\
  \ 用于调整条纹数量，`turbSize` 生成湍流时使用的缩放因子，`turbPower` 条纹的扰动量（设置为零条纹不受扰动）。由于所有三个 (RGB) 颜色组件使用相同的正弦波值，存储在图像数据数组中的最终颜色是灰度的。图\
  \ 14.16 显示了不同 `turbPower` 值（0.0、0.5、1.0 和 1.5，从左到右）生成的纹理图。\n\n我们可以通过修改 `turbulence()`\
  \ 函数使其使用 `logistic` 函数来进一步控制大理石纹理的定义和厚度。逻辑（或“sigmoid”）函数具有具有两端渐近线的 S 型曲线。常见的例子是双曲正切和\
  \ `f(x) = 1/(1+e^(-x))`。程序 14.5 包含一个 `logistic()` 函数，它实现了 `1/(1+e^(-kx))`，其中 `k`\
  \ 用于调整输出推向 0.0 或 255.0 的程度——在这种情况下，用于调整大理石纹理边缘的锐利度。\n\n\n\n\n\n由于我们预期大理石具有光泽的外观，因此引入了\
  \ Phong 光照（Phong shading）来使“大理石”纹理物体看起来更真实。程序 14.5 总结了生成大理石龙的代码。顶点着色器和片段着色器与用于 Phong\
  \ 光光的相同，不同在于我们还传递了原始顶点坐标作为 3D 纹理坐标（如前所述）。ADS 光照值与之前第 7.1 节中指定的相同，光泽（shininess）设置为\
  \ 0.75。片段着色器将噪声结果与光照结果结合，如之前第 7.6 节中所示。\n\n![image](img/fig14_16.jpg)\n\n图 14.16\n\
  \n构建 3D “大理石”噪声图。\n\n***程序 14.5 构建大理石龙***\n\n![image](img/prog14_5.jpg)\n\n![image](img/prog14_5-1.jpg)\n\
  \n有多种方法模拟不同颜色的大理石（或其他石材）。改变大理石中“纹路”颜色的一种方法是通过修改 `fillDataArray()` 函数中 `Color` 变量的定义；例如，通过增加绿色分量：\n\
  \n```\nfloat redPortion = 255.0f * (float)sineValue;\n\nfloat greenPortion = 255.0f\
  \ * (float)min(sineValue*1.5 - 0.25, 1.0);\n\nfloat bluePortion = 255.0f * (float)sineValue;\n\
  ```\n\n我们还可以引入 ADS 材质值（在 `init()` 中指定）来模拟完全不同类型的石材，例如“玉”。\n\n图 14.17 显示了四个示例，前三个使用程序\
  \ 14.5 所示设置，第四个包含了之前在图 7.3 中所示的“玉”ADS 材质值。\n\n![image](img/fig14_17.jpg)\n\n图 14.17\n\
  \n使用 3D 噪声图纹理化的龙——三个大理石和一个玉石。\n\n## 14.7 噪声应用 – 木纹\n\n创建“木纹”纹理可以采用与之前的“大理石”示例类似的方法。树木生长成*年轮*，正是这些年轮产生了我们在木制制品上看到的纹理。随着树木的生长，环境压力会导致年轮产生变化，我们在纹理中也能看到这些变化。\n\
  \n我们首先构建一个过程化的“年轮”3D 纹理图，类似于本章之前提到的“棋盘格”纹。然后我们使用噪声图来扰动这些年轮，将深棕色和浅棕色插入年轮纹理图中。通过调整年轮的数量以及扰动年轮的程度，我们可以模拟具有各种类型纹理的木材。通过结合相似的红色和绿色并配合较少的蓝色，可以产生棕色的色调。然后我们应用具有低水平“光泽”的\
  \ Phong 光照。\n\n我们可以通过修改 `fillDataArray()` 函数，使用三角函数指定距离 Z 轴等距的 `X` 和 `Y` 值，从而在 3D\
  \ 纹理图中生成环绕 Z 轴的年轮。我们使用正弦波循环地重复此过程，根据此正弦波等量的降低红色和绿色分量。变量 `sineValue` 持有精确的色调，可以通过稍微偏移其中一个来调整（在本例中红色增加\
  \ 80，绿色增加 30）。我们可以通过调整 `xyPeriod` 的值创建更多（或更少）的年轮。生成的纹理如图图 14.18](#20_chapter14.html_fig14-18)所示。\n\
  \n![image](img/pg355.jpg)\n\n图 14.18 中的木纹是一个很好的起点，但它们看起来并不真实真实——它们太完美了。为了改进这一点，我们使用噪声图（更具体说是湍流）来扰动\
  \ `distanceFromZ` 变量，使年轮产生细微变化。计算修改如下：\n\n![image](img/pg338.jpg)\n\n![image](img/fig14_18.jpg)\n\
  \n图 14.18\n\n为 3D 木纹纹理创建年轮。\n\n再次，变量 `turbPower` 调整了应用的湍流量（设置为 0.0 会产生图 14.18 所示的未扰动版本），而\
  \ `maxZoom` 指定了缩放值（此例中 32）。图 14.19 显示了 `turbPower` 为 0.05、1.0 和 2.0 时生成的木纹纹理（从左到右）。\n\
  \n现在我们可以将 3D 木纹纹理图应用于模型上。通过对用于纹理坐标的 `originalPosition` 顶点位置应用旋转，可以进一步增强纹理的真实性；这是因为大多数木刻物品与年轮的方向并不完美对齐。为了实现这一点，我们向着色器发送一个额外的旋转矩阵来旋转纹理坐标。我们还添加了\
  \ Phong 光照，带有适当的木色 ADS 值和适度的光泽水平。纹理化的完整内容在程序 14.6。\n\n![image](img/fig14_19.jpg)\n\
  \n图 14.19\n\n使用 3D 纹理图的木纹。\n\n***程序 14.6 创建龙***\n\n![image](img/prog14_6.jpg)\n\n\
  ![image](img/prog14_6-1.jpg)\n\n![image](img/fig14_20.jpg)\n\n图 14.20\n\n使用 3D 噪声图纹理化的龙。\n\
  \n生成的 3D 龙如图 14.20](#20_chapter14.html_fig14-20)所示。片段着色器中有一个值得注意的细节。由于我们正在旋转模型，有时可能会超出\
  \ 0..1 的范围。如果发生这种情况，我们可以通过将顶点除以一个较大的数字（如 4.0），然后加上一个较大的数字（如 0.6）使其在纹理空间中居。\n\n##\
  \ 14.8 噪声应用 – 云\n\n之前在图 14.15 中构建的“湍流”噪声图看起来已经像云了。当然，它的颜色不对，因此我们首先将其从灰度变为浅蓝色和白色的混合。一种简单的方法是将蓝色分量分配最大值\
  \ 1.0，而红色和绿色在 0.0 到 1.0 之间变化，取决于噪声图中的值。新的 `fillDataArray()` 函数如下：\n\n![image](img/pg359.jpg)\n\
  \n噪声图的现在现在可以用于天穹（skydome）。记得天穹是一个纹理化的球体或半球，在禁用深度测试的情况下渲染，并包围相机（类似于天空盒）。\n\n构建天穹的一种方法是像处理其他\
  \ 3D 纹理一样对其进行纹理化，使用顶点坐标作为纹理坐标。然而在这种情况下，使用天穹的 2D 纹理坐标产生的图案更像云，因为球面畸曲略微水平地拉伸了噪声图。我们可以通过将\
  \ GLSL `texture()` 调用中的第三维度设置为常数，从噪声图中提取一个 2D 切片。假设天穹的纹理坐标已以标准方式作为顶点属性发送到 OpenGL\
  \ 流水线，以下片段着色器使用噪声图的 2D 切片对其纹理化：\n\n![image](img/pg359-1.jpg)\n\n![image](img/fig14_21.jpg)\n\
  \n图 14.21\n\n带有雾云纹理的天穹。\n\n生成的纹理化天穹如图 14.21 所示。虽然相机通常放置在天穹内部，但我们在这里将其放在外部进行渲染，以便可以看到穹顶本身的效果。目前的噪声图导致了“雾蒙蒙”的云。\n\
  \n\n\n\n\n尽管我们的云雾看起来很漂亮，但我们希望能够塑造它们——也就是说，让它们变得不同程度的模糊。在这里，我们可以再次像模拟大理石时那样利用逻辑函数（logistic\
  \ function）。修改后的 `turbulence()` 函数在程序 14.7 中所示，以及一个相关的 `logistic()` 函数。完整的程序 14.7\
  \ 还包含了之前描述的 `smooth()`、`fillDataArray()` 和 `generateNoise()` 函数。\n\n###  程序 14.7\
  \ 云层纹理生成\n\n![image](img/prog14_7.jpg)\n\n![image](img/prog14_7-1.jpg)\n\n逻辑函数使得颜色更倾向于白色或蓝色，而不是中间值，从而产生云层边界更加清晰的视觉效果。变量\
  \ `cloudQuant` 调整了噪声图中白色（相对于蓝色）的相对量，这反过来会导致应用逻辑函数时产生更多（或更少）的白色区域（即更清晰的云）。生成的球穹顶（现在具有更清晰的云层形成）如图图\
  \ 14.22 所示。\n\n![image](img/fig14_22.jpg)\n\n图 14.22\n\n带有逻辑云纹理的球穹顶\n\n最后，真实的云不是静态的。为了增强云的真实性，我们应该通过\
  \ (a) 让它们随时间移动或漂移，以及 (b) 在漂移过程中逐渐改变形状来使其动画。\n\n让云漂移的一种简单方法是缓慢旋转球穹顶。这不是一个完美的解决方案，因为真实的云倾向于沿直线漂移，而不是围绕观察者旋转。然而，如果旋转很慢且云仅用于装饰场景，那么这种效果可能足够了。\n\
  \n让云在漂移时逐渐改变形状似乎很困难。然而，考虑到我们用于为云制作纹理的 3D 噪声图，实际上有一种非常简单且巧妙的方法来实现这种效果。记得，尽管我们为云构建了\
  \ 3D 纹理噪声图，但到目前为止只使用了它的一个“切片”，并结合球穹顶的 2D 纹理坐标（我们将纹理查找的“Z”坐标设置为常量值）。3D 纹理的其余部分到目前一直未使用。\n\
  \n我们的技巧是将纹理查找的常量“Z”坐标替换为一个随时间逐渐变化的变量。也就是说，当我们旋转球穹顶时，我们逐渐增加深度变量，导致纹理查找使用不同的切片。记得，当我们构建\
  \ 3D 纹理图时，我们对沿三个轴的颜色变化应用平滑处理。因此，纹理图中相邻的切片非常相似，但略有不同。因此，通过逐渐改变 `texture()` 调用中的“Z”值，云的外观将逐渐改变。\n\
  \n导致云层随时间缓慢移动和变化的代码更改在程序 14.8 中所示。\n\n### 程序 14.8 云纹理动画化\n\n![image](img/prog14_8.jpg)\n\
  \n![image](img/prog14_8-1.jpg)\n\n配套文件中的完整实现包含了对 `turbulence()` 函数的一些额外细微更改，以增强漂移云的效果。虽然我们无法在单张静态图像中显示逐渐变化的漂移和动画云的效果，但图\
  \ 14.23 通过一系列 3D 生成云的快照，展示了它们从右向左跨过球穹顶并在漂移过程中缓慢改变形状的变化。\n\n![image](img/fig14_23.jpg)\n\
  \n图 14.23\n\n漂移时不断变化的 3D 云。\n\n## 14.9 噪声应用 – 特殊特效\n\n噪声纹理可以用于各种特殊特效。事实上，它的可能用途非常多，其适用性仅限于人的想象力。\n\
  \n我们在这里演示的一个非常简单的特殊特效是*溶解效果*（dissolve effect）。这是我们让一个物体看起来逐渐溶解成微小粒子，直到它最终消失。给定一个\
  \ 3D 噪声纹理，只需极少的额外代码即可这种效果。\n\n为了实现溶解效果，我们引入了 GLSL 的 `discard` 命令。该命令仅在片元着色器中合法，执行时它会导致片元着色器丢弃当前片元（即不渲染它）。\n\
  \n我们的策略非常简单。在 C++/OpenGL 应用中，我们创建一个与之前图 14.12 所示相同的细粒噪声图，以及一个随时间逐渐增加的浮点变量计数器。该变量通过\
  \ uniform 变量发送到着色器流水中，噪声图也放置在带有关联采样器的纹理图中。片元着色器然后使用采样器访问噪声纹理——在这种情况下，我们使用返回的噪声值来决定是否丢弃该片元。我们通过将灰度噪声值与计数器（作为某种“阈值”值）比较来实现这一点。由于阈值随时间逐渐变化，我们可以设置它让越来越多的片元被丢弃。结果是物体看起来在逐渐溶解。程序\
  \ 14.9 显示了相关的代码部分，这些代码被添加到来自程序 6.1 的渲染地球的球体中。生成的输出如图图 14.24 所示。\n\n### 程序 14.9 使用\
  \ discard 实现溶解效果\n\n![image](img/prog14_9.jpg)\n\n![image](img/prog14_9-1.jpg)\n\
  \n![image](img/fig14_24.jpg)\n\n图 14.24\n\n使用 discard 着色器的溶解效果。\n\n`discard` 命令应尽可能少地使用，因为可能会产生性能影响。这是因为它的存在使得\
  \ OpenGL 更难优化 Z 缓冲器测试。\n\n## 补充说明\n\n在为平面 `ax + by + cz + d = 0` 指定用户定义的裁剪平面时，该平面应该被“归一化”，如\
  \ `eqn349.jpg` 所示。我们在第 14.3 节示例中使用的平面已经以这种方式进行了归一化。或者，距离 `d` 可以除以 `eqn349-1.jpg`。\n\
  \n在本章中，我们使用 Perlin 噪声来生成云，并模拟了用于渲染龙的木纹和大理石纹的石材。人们发现了 Perlin 噪声的许多其他用途。例如，它可以用于创建火和烟雾\
  \ [CC16, AF14] 以及构建真实的凹凸图 [GR05]；它被用于在游戏 Minecraft 中生成地形 [PE11]。\n\n本章生成的噪声图是基于\
  \ Lode Vandevenne [VA04] 的概述。我们的 3D 云生成仍存在一些缺陷。偶尔会出现看起来不像云的细小水平和垂直结构（配套文件中增强的 `turbulence()`\
  \ 函数在动画示例中修正了大部分此类）。另一个问题是在球穹顶的北极，球面畸变会导致针尖效应（pinch effect）。\n\n我们在本章中实现的云未能模拟真实云的一些重要特征，例如云散射阳光的方式。真实的云通常顶部更白，底部更灰。我们的云也没有实现许多实际云所具有的\
  \ 3D “蓬松”感。\n\n同样，在查阅 OpenGL 文档时，读者可能会注意到 GLSL 包含了名为 `noise1()`、`noise2()`、`noise3()`\
  \ 和 `noise4()` 的噪声函数，这些函数被描述为接收一个输入种子并产生类高斯的随机输出。我们在本章中没有使用这些函数，因为在编写本文时，大多数厂商尚未实现它们。例如，许多\
  \ NVIDIA 显卡目前无论输入种子如何，这些函数都返回 0。\n\n练习\n\n\n\n\n\n## 14.1\n修改程序 14.2，逐渐减少对象的 alpha\
  \ 值，使其逐渐淡出并最终消失。\n\n## 14.2\n修改程序 14.3，沿水平方向对圆环进行剪裁，创建一个圆形的“槽”。\n\n## 14.3\n修改程序\
  \ 14.4（即包含图 14.10 中所示生成 3D 立方纹理修改的版本），使其改为为 Studio 522 海豚制作纹理。然后观察结果。许多人在第一次观察结果时（例如在龙身上显示的如所示，但即使在更简单的物体上也是如此），认为程序中存在某些错误。即使在简单的情况下，从\
  \ 3D 纹理中“雕刻”物体也可能导致意想不到的表面图案。\n\n## 14.4\n用于定义木纹“环”的简单正弦波（所示在图 14.18 中）生成的环，其明亮区域和黑暗区域的宽度相等。尝试修改相关的\
  \ `fillDataArray()` 函数，目标是使深色环的宽度比亮色环窄。然后观察对生成的木纹理物体的影响。\n\n## 14.5（项目）\n将逻辑回归函数（来自程序\
  \ 14.7）整合到程序 14.5 的大理石龙中，并实验各种设置以创建更明显的纹理。\n\n## 14.6\n修改程序 14.9，结合之前章节中描述的缩放、平滑、湍流和逻辑步骤。观察生成的溶解效果的变化。\n\
