  \n[LU16] F. Luna, *Introduction to 3D Game Programming with DirectX 12*, 2nd ed.\
  \ (Mercury Learning, 2016).\n\n[MI20] *Common Techniques to Improve Shadow Depth\
  \ Maps* (Microsoft Corp., 2018), accessed November 2023, [`learn.microsoft.com/en-us/windows/win32/dxtecharts/common-techniques-to-improve-shadow-depth-maps`](https://learn.microsoft.com/en-us/windows/win32/dxtecharts/common-techniques-to-improve-shadow-depth-maps).\n\
  \n[PP23] Peter Pan, Wikipedia, accessed November 2023, [`en.wikipedia.org/wiki/Peter_Pan`](https://en.wikipedia.org/wiki/Peter_Pan).\n\
  \n[RS87] Rendering Antialiased Shadows with Depth Maps, *Computer Graphics*, Volume\
  \ 21, Number 4, July 1987.\n\n\n\n\n`stencil buffer`（模板缓冲区）是与颜色缓冲区和 z 缓冲区并列可以通过\
  \ OpenGL 访问的第三种缓冲区。本书未介绍 `stencil buffer`。\n\n我们还将偏移量乘以阴影坐标的 `w` 分量，因为 OpenGL 在纹理查找期间会自动将输入坐标除以\
  \ `w`。这种操作被称为 `perspective divide`（透视除法），我们此为止一直忽略了。它必须被考虑在内。关于 `perspective divide`\
  \ 的更多信息，请参见 LO12。\n\n# 第 9 章天空与背景\n\n## 9.1 天空盒\n## 9.2 天穹\n## 9.3 实现天空盒\n## 9.4\
  \ 环境映射\n\n## 补充说明\n\n![image](img/common.jpg)\n\n3D 场景的真实性可以通过在远处的平线上生成真实的效果来提高。当我们望向附近的建筑和树木之外，我们习惯于看到远处的巨大物体，如云朵、山脉或太阳（夜晚则是月亮和星辰）。然而，将这些物体作为单独的模型添加到场景中可能会带来不可接受的性能代价。`skybox`（天空盒）或\
  \ `skydome`（天穹）提供了一种高效生成平线的相对简单的方法。\n\n## 9.1 天空盒 (SKYBOXES)\n`skybox` 的概念非常巧妙且简单：\n\
  \n1. 实例化立方体对象。\n2. 使用所需的环境对立方体进行纹图中。\n3. 调整立方体的位置使其环绕相机。\n\n我们已经知道如何执行所有这些步骤。然而，还有一些细节。\n\
  \n### 如何为我们的平线制作纹理？\n立方体有六面，我们需要对所有面进行纹图中。一种方法是使用六个图像文件和六个纹理单元。另一种常见（且高效）的方法是使用包含所有六面纹理的单张图像，如图\
  \ 9.1 所示。\n\n![image](img/fig_1.jpg)\n\n图 9.1 六面天空盒纹理立方体映射。\n\n使用单个纹理单元为立方体的六面纹理的图像是\
  \ `texture cube map`（纹理立方体映射）的一个示例。立方体映射的六部分对应于立方体的顶、底、前、后和两个侧。当它“包裹”在立方体周围时，它充当位于立方体内部相机的平线，如图\
  \ 9.2 所示。\n\n![image](img/fig_2.jpg)\n\n图 9.2 纹理立方体映射环绕相机。\n\n使用 `texture cube map`\
  \ 为立方体纹图中需要指定适当的纹理坐标。图 9.3 显示了分配给每个立方体顶的纹理坐标分布。\n\n![image](img/fig_3.jpg)\n\n图\
  \ 9.3 立方映射纹理坐标。\n\n### 如何让天空盒看起来“很远”？\n构建天空盒的另一个重要因素是确保纹理看起来像遥远的平线。起初，人们可能认为这需要让天空盒非常大。事实证明这并不是理想的，因为会导致纹理拉伸和失真。相反，可以通过使用以下两部分技巧让天空盒\
  \ `看起来` 非常大（从而显得很远）：\n\n![image](img/circle.jpg) 禁用深度测试并优先渲染天空盒（在渲染场景中的其他物体时重新启用深度测试）。\n\
  \n![image](img/circle.jpg) 随相机移动天空盒（如果相机移动了）。\n\n通过在禁用深度测试的情况下先绘制天空盒，深度缓冲区仍将完全填充为\
  \ 1.0（即最远距离）。因此，场景中的所有其他物体将被完全渲染；也就是说，其他任何物体都不会被天空盒遮。这导致天空盒的墙看起来比其他任何物体都要远，无论天空盒的实际大小如何。天空盒立方体本身可以很小，只要在相机移动时随之移动即可。图\
  \ 9.4 显示了从天空盒内部查看简单场景（实际上只是砖块纹理的圆环）。\n\n![image](img/fig_4.jpg)\n\n图 9.4 从天空盒内部查看场景。\n\
  \n结合之前的图 9.2 和 9.3，仔细检查图 9.4 是很有启发意义的。注意场景中可见的天空盒部分是立方体映射的最右侧部分。这是因为相机被放置在默认方向，面向负\
  \ Z 方向，因此看向天空盒立方体的背面（并在图 9.3 中如此标记）。还要注意，立方体映射的背面部分在场景中渲染时会呈现水平反转，因为是从立方体内部观察立方体映射的。例如，查看“背面”是什么样的。\n\
  \n### 如何构建立方体映射？\n从艺术作品构建纹理映射图像需要小心，以避免立方体连接处的接缝，并创建适当的透视，使天空盒看起来真实且无失真。有很多工具可以提供帮助：Terragen、3ds\
  \ Max、Blender 和 Photoshop 都有处理立方体映射的工具。还有许多网站提供现成的立方体映射，有些收费，有些免费。\n\n## 9.2 天穹\
  \ (SKYDOMES)\n构建平线效果的另一种方法是使用 `skydome`。基本思想与天空盒相同，只是我们不使用纹理立方体，而是使用纹理球体（或半球体）。我们已经完成了天空盒。（图\
  \ 9.5 中的天穹纹理是使用 Terragen [TE22] 制作的。）\n\n![image](img/fig_5.jpg)\n\n图 9.5 内部的天穹。\n\
  \n天穹相比天空盒有一些优势。例如，它们不容易受到失真和接缝的影响（尽管纹理图像中必须考虑极点的球面失真）。天穹的一个缺点是球体或穹顶比立方体模型更复杂，具有更多的顶点，并且根据所需的精度顶点数量可能有所不同。\n\
  \n当使用天穹表示户外场景时，它通常与地面或某种地形相结合。当使用天穹表示空间场景（如星场）时，使用球体通常更实用，如图 9.6 所示（为了清晰可视化球体，添加了一条虚线）。\n\
  \n![image](img/fig_6.jpg)\n\n图 9.6 使用球体的星穹（星场来自 [BO11]）。\n\n## 9.3 实现天空盒\n尽管天穹有优势，但天空盒仍然常见。它们在\
  \ OpenGL 中的支持也更好，这在进行*环境映射*（在本章后面介绍）时是有利的。由于这些原因，我们将专注于天空盒的实现。\n\n实现天空盒有两种方法：从头构建一个简单的，以及使用\
  \ OpenGL 的立方体映射功能。每种方法都有其优势，因此我们将涵盖两者。\n\n### 9.3.1 从头构建天空盒\n\n\n\n\n我们已经涵盖了构建简单天空盒（skybox）所需的所有内容。在第\
  \ 4 章中介绍了一个立方体模型；我们可以像本章图 9.3 所示分配纹理坐标。我们学习了如何使用 `SOIL2` 库读取纹理，以及如何在 3D 空间中定位物体。我们将看到如何轻松地启用和禁用深度测试（只需一行代码）。\n\
  \n程序 9.1 显示了我们简单天空盒的代码结构，场景由单个带纹理的圆环体组成。纹理坐标分配以及启用/禁用深度测试的调用被突出显示。\n\n***程序 9.1\
  \ 简单天空盒***\n\n![image](img/prog9_1.jpg)\n\n![image](img/prog9_1-1.jpg)\n\n***标准纹理着色器现在用于场景中的所有物体，包括立方体贴：***\n\
  \n![image](img/prog9_1-2.jpg)\n\n程序 9.1 的输出如图 9.7 所示，对应两种不同的立方体贴图纹理。\n\n如前所述，天空盒容易受到图像失真和*缝隙*的影响。缝隙是两个纹理图像相遇处可见的线条，例如沿立方体的边缘。图\
  \ 9.8 显示了图像上部分的缝隙示例，这是运行程序 9.1 产生的伪影。避免缝隙需要仔细构建立方体贴图图像并分配精确的纹理坐标。存在工具可以减少图像边缘的缝隙（例如\
  \ [GI23]）；这个主题超出了本书的范围。\n\n![image](img/fig9_7.jpg)\n\n图 9.7\n\n简单天空盒结果。\n\n###\
  \ 9.3.2 使用 OpenGL 立方体贴图\n\n构建天空盒的另一种方法是使用 OpenGL 纹理立方体贴图（texture cube map）。OpenGL\
  \ 立方体贴图比上一节看到的简单方法稍微复杂。然而，使用 OpenGL 立方体贴图也有优点，例如减少缝隙和对环境映射的支持。\n\n![image](img/fig9_8.jpg)\n\
  \n图 9.8\n\n天空盒“缝隙”伪影。\n\nOpenGL 纹理立方体贴图与我们稍后将学习的*3D 理*类似，它们使用三个纹理坐标——通常标记为 `(s,t,r)`——来访问，而不是我们目前为止所使用的两个。OpenGL\
  \ 纹理立方体贴图的另一个独特特征是，其图像在纹理坐标 `(0,0,0)` 处位于左上角（而不是通常的左下角）；这通常是困惑的来源。\n\n程序 9.1 所示的方法读取单张图像作为立方体贴图纹理，而程序\
  \ 9.2 所示的 `loadCubeMap()` 函数读取六个独立的立方体面图像文件。正如我们在第 5 章中所学到的，读取纹理图像有许多方法；我们选择使用 `SOIL2`\
  \ 库。在这里，`SOIL2` 对于实例化和加载 OpenGL 立方体贴图也非常方便。我们识别出要读取的文件，然后调用 `SOIL_load_OGL_cubemap()`。参数包括六个图像文件以及与我们在第\
  \ 5 章中看到的 `SOIL_load_OGL_texture()` 类似的额外参数。对于 OpenGL 立方体贴图，没有垂直翻转纹理，因为 OpenGL 会自动完成。注意，我们将\
  \ `loadCubeMap()` 放置在了 `Utils.cpp` 文件中。\n\n`init()` 函数现在包含一个启用 `GL_TEXTURE_CUBE_MAP_SEAMLESS`\
  \ 的调用，它告诉 OpenGL 尝试混合立方体的相邻边缘，以减少或消除缝隙。在 `display()` 中，立方体的顶点像以前一样发送到流水线，但此时没有必要发送立方体的纹理坐标。正如我们将看到的，这是因为\
  \ OpenGL 纹理立方体贴图通常使用立方体的顶点位置作为其纹理坐标。禁用深度测试后，绘制立方体。然后为场景的其他部分重新深度测试。\n\n完成的 OpenGL\
  \ 纹理立方体贴图通过 `int` 标识符引用。类似于阴影映射，通过将纹理包裹模式设置为“边缘限制”（clamp to edge），可以减少边界的伪影。在这种情况下，它可以帮助进一步减少缝隙。注意，这针对三个纹理坐标都设置：`s`、`t`\
  \ 和 `r`。\n\n在片元着色器中使用一种特殊的采样器类型 `samplerCube` 来访问纹理。在纹理立方体贴图中，采样器返回的值是沿着方向向量 `(s,t,r)`\
  \ 从原点“看到”的纹素。因此，我们通常可以直接使用传入的插值顶点位置作为纹理坐标。在顶点着色器中，我们将立方体顶点位置分配到输出纹理坐标属性中，以便在到达片元着色器时进行插值。同样注意在顶点着色器中，我们将传入视图矩阵转换为\
  \ `3x3`，然后转换回 `4x4`。这个“技巧”有效地移除了平移分量，同时保留了旋转（记住平移值位于变换矩阵的第四列）。这把立方体贴固定在相机位置，同时允许虚拟相机“环顾”。程序\
  \ 9.2 的输出与程序 9.1 相同。\n\n***程序 9.2 立方体贴图天空盒***\n\n![image](img/prog9_2.jpg)\n\n![image](img/prog9_2-1.jpg)\n\
  \n![image](img/prog9_2-2.jpg)\n\n## 9.4 环境映射\n\n当我们研究光照和材料时，考虑了物体的“光泽度”。然而，我们从未建模过*非常*亮的物体，例如镜子或铬材质。这些物体不仅有高光，它们还反射周围环境。当我们观察它们时，可以看到房间里的东西，甚至是我们自己的反射。ADS\
  \ 光照模型没有提供模拟这种效果的方法。\n\n然而，纹理立方体贴图提供了一种简单的方法来模拟反射表面——至少是部分。技巧是*使用贴图对反射物体进行纹理化*¹\
  \ 为了使其看起来真实，需要找到对应于我们从观察点看到的反射环境部分的纹理坐标。\n\n图 9.9 说明了这种策略：使用视图向量和法向量的组合计算*反射向量*，然后使用它从立方体贴图中查找纹素。因此，反射向量可以用于访问纹理立方体贴图。\n\
  \n我们在学习 Blinn-Phong 光照时曾计算过反射向量。这里的概念类似，只是现在我们使用反射向量从纹理图中查找值。这种技术被称为*环境映射*或*反射映射*。如果立方体贴图使用我们描述的第二种方法（在节\
  \ 9.3.2 中实现；即作为 OpenGL `GL_TEXTURE_CUBE_MAP`），那么 OpenGL 就可以以与立方体贴图本身纹理的方式执行环境映射查找。\n\
  \n\n\n\n该实现仅需少量的额外代码。程序 9.3 显示了对 `display()` 和 `init()` 函数以及用于使用环境映射渲染“反射”环面体的相关着色器所做的更改。这些更改已通过高亮显示。值得注意的是，如果存在\
  \ Blinn-Phong 光照，那么这些新增内容很可能已经存在了。唯一真正新的代码段位于片段着色器中（在 `main()` 方法中）。\n\n事实上，程序 9.3\
  \ 中高亮的代码（即黄色部分）起初看起来并不完全是新的。确实，我们在学习光照时，已经看到过几乎完全相同的代码。然而，在当前情况下，法线向量和反射向量被用于完全不同的目的。之前它们被用于实现\
  \ ADS 光照模型；而这里，它们被用于计算环境映射的纹理坐标。我们高亮了这些代码行，以便读者更容易追踪为了这一新目的而对法线计算和反射计算的使用。\n\n结果显示了一个经过环境映射的“铬金属”环面体，见图\
  \ 9.10。\n\n![image](img/fig9_10.jpg)\n\n图 9.10\n\n使用环境映射创建反射环面体的示例。\n\n***程序 9.3\
  \ 环境映射***\n\n![image](img/prog9_3.jpg)\n\n![image](img/prog9_3-1.jpg)\n\n![image](img/prog9_3-2.jpg)\n\
  \n虽然此场景需要两组着色器——一组用于立方体映射，另一组用于环面体——但程序 9.3 只显示了用于绘制环面体的着色器。这是因为用于渲染立方体映射的着色器与程序\
  \ 9.2 相比没有更改。程序 9.2 变为程序 9.3 的更改总结如下：\n\n#### 在 `init()` 中：\n* 创建环面体的法线缓冲区（实际上在\
  \ `setupVertices()` 中完成，由 `init()` 调用）。\n* 不再需要环面体的纹理坐标缓冲区。\n\n#### 在 `display()`\
  \ 中：\n* 创建变换法线的矩阵（在第 7 章 中称为 `norm_matrix`）并将其与相关的 uniform 变量绑定。\n* 激活环面体法线缓冲区。\n\
  * 将纹理立方体映射激活为环面体的纹理（而不是“砖”纹理）。\n\n#### 在顶点着色器中：\n* 添加法线向量和 `norm_matrix`。\n* 输出变换后的顶点和法线向量，准备计算反射向量，类似于之前处理光照和阴影的操作。\n\
  \n#### 在片段着色器中：\n* 以类似于处理光照的方式计算反射向量。\n* 从纹理（现在是立方体映射）中获取输出颜色，此时查找纹理坐标变为反射向量。\n\n\
  图 9.10 所示的渲染结果是说明如何通过简单技巧实现强大幻的绝佳示例。通过简单地在物体上绘制背景，我们让物体看起来具有“金属感”，而完全没有进行此类 ADS\
  \ 材质建模。它还产生了光线从物体上反射的视觉效果，尽管场景中没有包含任何 ADS 光照。在这个示例中，环面体的左下角甚至似乎有一个高光，因为立方体映射包含了太阳在水面上的反射。\n\
  \n## 补充说明\n\n正如我们在第 5 章 首次学习纹理时，虽然使用 SOIL2 使构建和纹化立方体映射变得简单，但可能会无意中屏蔽掉一些有助于学习的 OpenGL\
  \ 细节。当然，在没有 SOIL2 的情况下，实例化并加载 OpenGL 立方体映射也是可能的。仍然建议使用图像处理库，例如 `stb_image.h` [SB23]。基本步骤在\
  \ [dV14] 中详细说明并总结如下：\n\n1. 将 `stb_image.h` 头文件拷贝到项目目录。\n2. 使用 `glGenTextures()`\
  \ 为立方体映射创建一个纹理及其整数引用。\n3. 调用 `glBindTexture()`，指定纹理 ID 和 `GL_TEXTURE_CUBE_MAP`。\n\
  4. 使用 `stbi_load()` 读取六个图像文件。\n5. 使用 `glTexImage2D()` 将图像分配到立方体面。\n\n`stb_image.h`\
  \ 头文件已包含在 SOIL2 中，也可以单独安装。更多细节请参阅 [dV14] 或 [GE16]。\n\n本章介绍的环境映射的一个主要局限性是，它只能构造反射立方体映射的物体。场景中渲染的其他物体不会反射在反射映射物体中。根据场景的性质，这可能是可以的，也可能不是。如果存在必须反射在镜子或铬物体物体，则必须使用其他方法。一种方法是利用模板缓冲区（在第\
  \ 8 章 之前提到），并在各种网络教程中有描述（例如 [OV12], [NE14] 和 [GR97]），但这超出了本书的范畴。\n\n我们没有包含天空穹（skydomes）的实现，尽管在某些方面可以认为它们比天空盒（skyboxes）更简单，且不易受到失真的影响。即使环境映射更简单——至少在数学上如此——但\
  \ OpenGL 对立方体映射的支持使得天空盒更具实用性。我们略过了可用立方体映射图像的生成。有很多工具可以实现这一点，最流行的之一是 Terragen。本章所有的立方体映射（图\
  \ 9.6 的星场外）都是使用 Terragen 制作的。\n\n### 习题\n\n**9.1 (项目)**：在程序 9.2 中，添加使用鼠标或键盘移动摄像机的功能。为了实现这一点，你需要利用之前在习题\
