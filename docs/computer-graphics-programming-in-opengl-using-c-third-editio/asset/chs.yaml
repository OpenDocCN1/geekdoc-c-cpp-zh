  [GF23] Graphics Library Framework (GLFW)，访问于 2023 年 11 月，[`www.glfw.org/`](http://www.glfw.org/)\n\
  [GM23] OpenGL Mathematics (GLM)，访问于 2023 年 11 月，[`github.com/g-truc/glm`](https://github.com/g-truc/glm)\n\
  [GV23] GLview, realtechVR，访问于 2023 年 11 月，[`www.realtech-vr.com/home/glview`](http://www.realtech-vr.com/home/glview)\n\
  [PM23] Premake 首页，访问于 2023 年 11 月，[`premake.org`](https://premake.org)\n\n\n\n\n\
  \n2. 请遵循 Homebrew 页面上的安装说明。具体来说，复制页面中间提供的代码行，在 Mac 上打开终端窗口，将复制的命令粘贴进去，并按“回车”键。你可能需要输入你的\
  \ Mac 密码。安装可能需要几分钟才能完成。\n\n3. 在通知的末尾是将 Homebrew 添加到你的 `PATH` 中的说明。按照这些说明，将给定的两行复制并粘贴到命令提示符中执行。\n\
  \n4. 保持终端窗口打开；你将在接下来的步骤中再次使用它。\n\n接下来，使用新安装的 Homebrew 工具安装 GLEW 和 `GLFW`，如下所示：\n\
  \n1. 在终端提示符处，输入以下命令：`arch -arm64 brew install glfw`。如果你的 Mac 是旧的 Intel 芯片版本，请改为输入：`brew\
  \ install glfw`\n\n2. 仍然在终端提示符处，输入命令：`arch -arm64 brew install glew`。如果你的 Mac 是旧的\
  \ Intel 芯片版本，请输入 `brew install glew`\n\n3. 注意，现在 `/opt/homebrew/include` 下有两个文件夹，分别命名为\
  \ `GL` 和 `GLFW`。\n\n接下来，我们安装数学库 `GLM`。在四个库中，这是最简单的。由于 `GLM` 是一个仅头文件的库，只需 (a) 按照前面\
  \ A.1.5 节中的描述下载并解压库，然后 (b) 将生成的“glm”文件夹及其内容复制到 `/opt/homebrew/include`。\n\n安装 `SOIL2`\
  \ 可能是这四个库中最具棘手性的。我们成功使用的步骤如下：\n\n1. 按照附录 A 中的描述下载并解压 `SOIL2`。\n\n2. 按照附录 A 中的描述下载\
  \ Mac  `premake`（版本 5）。\n\n3. 解压 `premake`。在解压后的文件夹中是 `premake5` 可执行文件。\n\n4. 将\
  \ `premake5` 可执行文件复制到 `SOIL2` 文件夹。将 `SOIL2` 文件夹移动到你有管理员权限的位置，例如“文档”文件夹。\n\n5. 在终端窗口中，导航到\
  \ `SOIL2` 文件夹并输入以下内容：\n\n   `./premake5 gmake`\n\n6. 仍在 `SOIL2` 文件夹中，输入 `cd make/macosx`\
  \ 进入“make”文件夹，然后输入：\n\n   `make`\n\n7. `SOIL2` 应该能够成功构建（你可能会收到测试文件未构建成功的错误消息——没关系，因为测试文件对我们并不重要）。构建应该生成一个“src/SOIL2”文件夹，其中包含几个\
  \ `.h` 文件，以及一个“lib/macosx”文件夹，包含两个名为 `libsoil2-debug.a` 和 `libsoil2-debug.dylib`\
  \ 的库文件。\n\n完成这些步骤后，文件结构应与图 B.1 所示。\n\n![](img/figB_01.jpg)\n\n图 B.1\nMac OpenGL\
  \ C++ 库的目录结构\n\n## B.1.2 准备开发环境\n\n我们使用了 Mac 上流行的 IDE —— `Xcode`。如果你的 Mac 还没有包含\
  \ `Xcode`，安装它是一个简单（尽管相当慢）的操作 [XC23]。你可能需要更新操作系统以安装最新版本的 `Xcode`。\n\n安装 `Xcode` 后，你需要配置它以适用于\
  \ OpenGL 以及我们正在使用的库。以下是我们成功为 C++/OpenGL 应用程序设置 `Xcode` 的步骤：\n\n1. 运行 `Xcode`，并让它创建一个类型为\
  \ macOS ►command line tool 的项目。将语言设置为 C++。\n\n2. 会创建一个默认的 `main.cpp`，其中包含一个简单的“hello\
  \ world”程序。在 `Xcode` 编辑器中，用我们某个 C++/OpenGL 应用程序中所需的 `main.cpp` 代码覆盖该代码。代码中可能会标记出几个错误——暂时忽略它们即可。\n\
  \n3. 如下设置头文件搜索路径：\n\n   a. 在左面板顶部，点击最左侧的图标打开项目导航器（Project Navigator）（如果它尚未打开）。\n\
  \   b. 点击项目名称（位于左面板顶部）。\n   c. 在主面板顶部中央选择“Build Settings”（构建设置）和“all levels”（所有级别）选项卡。\n\
  \   d. 滚动到“Search Paths”（搜索路径）部分。\n   e. 在“Header Search Paths”（头文件搜索路径）下，添加以下路径：`/opt/homebrew/include`\n\
  \   f. 同样在“Header Search Paths”下，添加 `SOIL2-master/src` 的路径（其中包含 `SOIL2/SOIL2.h`）。\n\
  \n4. 将包含你的 `libsoil2-debug.a` 文件的文件夹路径添加到库搜索路径。这同样在“Build Settings”中，位于上一步使用的头文件路径部分附近。确保它被添加到“release”（发布）和“debug”（调试）类别中。\n\
  \n5. 如下设置链接阶段的二进制文件：\n\n   a. 必要时点击项目名称（位于左面板顶部，蓝色）。\n   b. 选择主面板顶部的“Build Phases”（构建阶段）选项卡。\n\
  \   c. 点击“Link Binary with Libraries”（链接二进制文件到库）旁边的小三角形打开该部分。\n   d. 在“drag to reorder\
  \ linked binaries”（拖拽重排已链接二进制文件）旁边应该有一个“+”号。点击“+”。\n   e. 应该弹出一个搜索框。搜索“opengl”。出现“OpenGL\
  \ Framework”。选择它并点击“Add”。\n   f. 再次弹出搜索框。搜索“core”。出现“CoreFoundation Framework”。选择它并点击“Add”（该框架已存在于\
  \ Mac 中）。\n   g. 再次点击“+”，这次点击左下角的“Other”。\n   h. 当浏览器打开时，输入 `CMD-SHIFT-G`。打开跳转文件夹；输入\
  \ `/opt/homebrew` 并回车。\n   i. 在显示的目录结构中，导航到 `Cellar`，然后是 `glew`，然后是版本号。会出现一些以 `.dylib`\
  \ 结尾的文件。\n   j. 选择相应的 `.dylib` 文件。它的文件名类似于 `libGLEW.2.2.0.dylib`。\n   k. 重复步骤 [g]\
  \ 到 [j] 用于 `glfw` 库。它同样位于 `/opt/homebrew/Cellar`，然后是 `glfw`，以及版本号。文件名类似于 `libglfw.3.3.dylib`。\n\
  \   l. 为两个 `SOIL2` 库文件重复此过程（我们在之前创建的那些）。即：点击“+”，点击“Other”，然后导航到放置 `libsoil2-debug.a`\
  \ 和 `libsoil2-debug.dylib` 文件的文件夹。选择并插入这两个文件。\n   m. 选择主面板顶部的“General”（通用）选项卡。\n\
  \   n. 点击“Frameworks and Libraries”（框架与库）旁边的小三角形打开该部分（如果尚未打开）。之前步骤安装的所有库都列在其中。\n\
  \   o. `libsoil2-debug.dylib` 库的右侧有一个下拉菜单。从该菜单中选择“Embed Without Signing”（无签名嵌入）。\n\
  \n6. 如下设置工作目录：在“Product”菜单下，选择“Scheme”-“Edit Scheme”，在“options”选项卡下，勾选“use custom\
  \ working directory”（使用自定义工作目录）框。在相邻的字段中，复制项目源代码文件夹的路径。\n\n\n\n\n在大多数情况下，本教科书中描述的\
  \ C++ 程序可以直接原样运行。然而，仍有少数修改必须进行。大部分修改针对 `main.cpp` 内部的 `main()` 函数。你可以对其进行一次编译，然后将修改后的\
  \ `main()` 版本复制到其他每个项目中。剩余的修改较较小，可以根据需要进行。\n\n在学习了正书中相应的编程章节之前，这些修改中的某些可能并没有太大的意义。读者可以选择先跳过本节的部分内容，在学习了相关材料后再回来查看。虽然我们承认这存在引入困惑的风险，但我们决定将所有针对\
  \ Macintosh 的代码更改都放在这里，以便将它们集中在一个处处理。\n\n### B.2.1 修改 C++ 代码\n\n让我们从对 `main.cpp`\
  \ 文件必须进行的修改开始：\n\n*   Xcode 有时会生成大量的“文档”警告信息。这些信息可能会导致查找更有实质性的错误信息变得不便。有几种方法停止这些信息；最简单的方法是在\
  \ `main.cpp` 顶部添加以下两行：\n\n```cpp\n#pragma clang diagnostic push\n#pragma clang diagnostic\
  \ ignored \"-Wdocumentation\"\n```\n\n*   Homebrew 在 Mac 上将 GLEW 安装为静态库，因此你需要在程序顶部、紧接在\
  \ `#include <GL/glew.h>` 命令上方添加：\n\n```cpp\n#define GLEW_STATIC\n```\n\n*   在 `glfwWindowHint`\
  \ 命令中，将“主（major）”上下文版本设置为 4，将“次（minor）”版本设置为 1。\n\n你还需要在现有的两个命令之后立即添加两个额外的 `glfwWindowHint`\
  \ 命令。它们如下：\n\n```cpp\nglfwWindowHint(GLFW_OPENGL_PROFILE, GLFW_OPENGL_CORE_PROFILE);\n\
  glfwWindowHint(GLFW_OPENGL_FORWARD_COMPAT, GL_TRUE);\n```\n\n这些行是必要的，因为它们强制 Mac\
  \ 使用该硬件上可用的最新版本的 OpenGL（许多 Mac 默认使用要早得多的 OpenGL 版本）。\n\n*   对于某些 Mac（例如带有 Retina\
  \ 显示器的 Mac），在设置 GLFW 渲染窗口分辨率时会稍微复杂一些。在使用 `glfwCreateWindow()` 创建窗口后，你需要从帧缓冲区获取实际的屏幕尺寸，如下：\n\
  \n```cpp\nint actualScreenWidth, actualScreenHeight;\nglfwGetFramebufferSize(window,\
  \ &actualScreenWidth, &actualScreenHeight);\n```\n\n然后，在 `glfwMakeContextCurrent(window)`\
  \ 命令之后，添加以下行：\n\n```cpp\nglViewport(0, 0, actualScreenWidth, actualScreenHeight);\n\
  ```\n\n这将确保绘制到帧缓冲区的内容与 GLFW 窗口中显示的内容匹配。\n\n*   最后，在用 `glewInit()` 初始化 GLEW 之前，添加以下行：\n\
  \n```cpp\nglewExperimental = GL_TRUE;\n```\n\n### B.2.2 修改 GLSL 代码\n\n由于 Mac 中使用的\
  \ OpenGL 版本稍旧（具体为 4.1），需要在我们的 GLSL 着色器代码的多个位置（以及一些相关的 C++/OpenGL 代码）进行一些更改：\n\n\
  *   着色器中指定的版本号必须更改。假设你的 Mac 支持 4.1 版本，在每个着色器的顶部找到如下行：\n\n```glsl\n#version 430\n\
  ```\n\n此行代码必须更改为如下：\n\n```glsl\n#version 410\n```\n\n*   版本 4.1 不支持为纹理采样器变量（texture\
  \ sampler variables）使用布局绑定限定符（layout binding qualifiers）。这影响了从第 5 章开始的材质。你需要移除布局绑定限定符，并用另一个实现相同功能的命令替换它们。具体来说，寻找着色器中具有以下格式的行：\n\
  \n```glsl\nlayout (binding=0) uniform sampler2D samp;\n```\n\n绑定子句中指定的纹理单元号可能不同（这里是“0”），采样器变量名称也可能不同（这里是“samp”）。在任何情况下，你都需要移除布局子句，并简化命令，使其仅显示如下内容：\n\
  \n```glsl\nuniform sampler2D samp;\n```\n\n然后，对于每个启用的纹理，你需要在 C++ 程序中添加以下命令：\n\n\
  ```cpp\nglUniform1i(glGetUniformLocation(renderingProgram, \"samp\"), 0);\n```\n\
  \n紧接在 C++ `display()` 函数中的 `glBindTexture()` 命令之后，其中“samp”是 uniform 采样器变量的名称，而上一个示例中的“0”是之前删除的绑定命令中指定的纹理单元。\n\
  \n### B.2.3 额外说明\n\n第 16 章中展示的光线追踪程序不会在 Macintosh 上运行，因为它们使用了计算着色器（compute shaders），而计算着色器直到\
  \ OpenGL 4.3 版本才引入。\n\n在某些使用 Retina 显示器的 Mac 上，像素计数可能不一致。例如，在第 2.1.6 节描述的代码中（结果如图\
  \ 2.13 所示），`gl_FragCoord.x` 返回的值可能是基于 `main()` 中指定的窗口尺寸的倍倍。在示例中，将测试值 295 改为 590\
  \ 即可得到预期的结果。\n\n## 参考文献\n\n[AP19] 使用 OpenCL 和 OpenGL 图形的 Mac 计算机，访问 2023 年 11 月，[`support.apple.com/en-us/HT202823`](https://support.apple.com/en-us/HT202823)\n\
  \n[XC23] Xcode 开发者网站，访问 2023 年 11 月，[`developer.apple.com/xcode`](https://developer.apple.com/xcode)\n\
  \n# 附录 C\n\n## 使用 NSIGHT GRAPH\n\n## C.1 关于 Nsight\n\n调试 GLSL 着色器代码是非常困难的。与 C++\
  \ 或 Java 等典型语言不同，通常无法确定着色器何处出错。通常，着色器错误表现为白屏，没有任何线索。更令人沮丧的是，无法像通常这样做的那样在运行时打印着色器变量的值。\n\
  \n出于这些原因，显卡制造商有时提供了硬件功能来从着色器中提取信息，并构建了工具的形式访问这些信息。每个制造商的调试工具只有在存在该制造商显卡的情况下才能工作。NVIDIA\
  \ 的图形调试器是 Nsight 工具套件的一部分，AMD 也有类似的工具，称为 CodeXL。\n\n## C.2 设置 Nsight\n\nNsight 有适用于\
  \ Windows 和 Linux 的版本，包括在 Microsoft Visual Studio 和 Eclipse IDE 下运行的版本。我们将讨论范围限制在\
  \ Windows 上的独立版 Nsight Graphics 应用程序。（在我们的“姊妹”书籍《Computer Graphics Programming in\
  \ OpenGL with Java》中，我们描述了如何使用 Nsight 调试 Java 程序。）\n\n## C.3 在 Nsight 中运行 C++/OpenGL\
  \ \n\n![image](img/common.jpg)\n\nNsight 仅适用于兼容的 NVIDIA 显卡；它不支持 Intel 或 AMD 显卡。支持显卡的完整列表可在\
  \ NVIDIA 网站上找到 [NS23]。\n\n\n\n\nNsight 的变化非常快，我们本教材上一版本（第二版）中的描述已经过时了。读者应该将这段简要介绍仅视为起点，因为在不久的将来，Nsight\
  \ 可能会有更多令人兴奋的变化和发展。\n\n## C.2 设置 NSIGHT\n\n设置 Nsight 有多种方法。在之前的版本中，我们描述了如何将 Nsight\
  \ 集成到 Visual Studio 中。现在已不再有必要，因为现在有一个名为 `Nsight Graphics` 的独立图形调试工具，它允许我们在运行应用程序编译后的\
  \ `.exe` 文件时直接使用着色器调试器。\n\n首先，下载并安装 Nsight Graphics，你可以在 Nsight Graphics 网站 [NG23]（选择“Download\
  \ for Windows”）上获取。我们安装的是 2023.2.1 版本。\n\n## C.3 在 NSIGHT 中运行 C++/OPENGL 应用程序\n\n\
  1. 在“Release”模式下编译你的 C++/OpenGL 应用程序，并整理一个包含运行所需文件的文件夹。这些步骤在 附录 A 第 A.3 节中有所描述。\n\
  \n2. 运行 `Nsight Graphics`。弹出一个菜单，如下所示。选择“Start Activity”（启动活动）。\n\n![](img/decorative_C_01.jpg)\n\
  \n3. 应该出现一个“Target Platform”（目标平台）窗口。在这里我们指定想要使用 Nsight 调试的应用程序。在顶部“Windows”下方，确保选中了“Launch”（启动）选项。下方有两个条目需要修改：\n\
  \n首先，有一行显示为“Application Executable（应用程序执行文件）”。在其右侧的框中，将原有内容替换为在步骤 #1 中创建的 `.exe`\
  \ 可执行文件的路径。你可以通过点击字段右侧的“三个点”来浏览此文件。我们的可执行文件在这里：\n\n`C:/Users/gordonvs/Documents/graphics/cubes.exe`\n\
  \n其次，在同一面板中有一行显示为“Working directory（工作目录）”。在其右侧的框中，将原有内容替换为包含应用程序的目录路径。对于我们的示例，路径如下：\n\
  \n`C:/Users/gordonvs/Documents/graphics/`\n\n这是一张显示这两个条目的示例截图：\n\n![](img/decorative_C_02.jpg)\n\
  \n4. 点击右下角的“Launch Frame Debugger”（启动帧调试器）。你的 C++/OpenGL 程序现在应该开始执行。根据你的安装情况，你的运行程序旁边可能会出现各种窗口。Nsight\
  \ 还可能在你正在运行的程序上叠加一些信息，如下所示：\n\n![](img/decorative_C_03.jpg)\n\n5. 一旦程序运行，你可以在任何想要检查的区域与它进行交互。此时，你需要按下\
  \ `F-11` 暂停执行。你应该看到程序的动画停止，并在窗口底部出现一个滑块。移动滑块可以显示构建当前显示帧的 OpenGL 事件的进度，例如对于这个特定的示例，可能存在多次对\
  \ `glDrawArrays()` 调用。\n\n![](img/decorative_C_04.jpg)\n\n6. 帧调试器（Frame debugger）也应该出现，包含几个面板：\n\
  \n• 左侧的面板显示 OpenGL 事件，取决于滑块的位置。\n• 顶部有一个标记为“scrubber”（滚动条）的滑块，也可以用来滚动查看事件。\n• 中间是一个左侧栏，为每个着色器阶段提供按钮。例如，你可以突出“VS”来查看关于“顶点着色器”（Vertex\
  \ Shader）中变量的信息。\n• 在右侧的大型中心框中，你可以向下滚动查看 uniform 变量（统一变量）的内容（假设你在上方选中了“API inspector”）。在接后的截图，`mv_matrix`\
  \ 和 `proj_matrix` 左侧的小三角形已被展开，显示了 4x4 模型-视图矩阵和投影矩阵的内容。\n\n![](img/decorative_C_05.jpg)\n\
  \n请参阅 Nsight 文档获取有关如何充分利用 Nsight 工具的细节。\n\n### References\n\n[NG23] Nsight Graphics,\
  \ 访问于 2023 年 11 月，[`developer.nvidia.com/nsight-graphics`](https://developer.nvidia.com/nsight-graphics)\n\
  \n[NS23] Nsight Graphics GPUs (完整列表), 访问于 2023 年 11 月，[`developer.nvidia.com/nsight-graphics-gpus-full-list`](https://developer.nvidia.com/nsight-graphics-gpus-full-list)\n\
  \n## 附录 D\n\n## 构建简单的相机控制器\n\n### D.1 *相机控制器的元素*](#28_app-d.html_d1)\n\n### D.2\
  \ *更多关于相机控制器*](#28_app-d.html_d2)\n\n![image](img/common.jpg)\n\n在整本书中，我们在原点附近构建图形场景，并将相机放置在世界\
  \ Z 轴正方向某处的固定位置，朝世界负 Z 轴方向看向原点。由于内置的 OpenGL 相机已经指向负 Z 轴，而且我们从未旋转过相机，因此我们能够（如 第 3\
  \ 章 和 第 4 章 所述）构建一个非常简单的视图矩阵，该矩阵仅考虑相机的位置，而不必担心相机的朝向。我们用于构建这个简单视图矩阵的命令通常如下：\n\n```\n\
  vMat = glm::translate(glm::mat4(1.0f), glm::vec3(-cameraX, -cameraY, -cameraZ));\n\
  ```\n\n[/content] (抱歉，由于提供的待翻译文本在部分出现了逻辑重复和混乱，上述译文已根据上下文进行了对齐和优化，以确保通顺)\n\n**纠正：**\
  \ 您提供的“需要翻译的文本”在后半部分（Appendix D 部分）似乎出现了与前半部分内容重合或逻辑混乱的重复（例如 D.1 之后在重复描述 Nsight\
  \ 的操作）。我已根据 Markdown 工程师的逻辑进行了重新翻译。\n\n以下是针对 **Appendix D** 部分的正确翻译：\n\n[content]\n\
  ## 附录 D\n\n## 构建简单的相机控制器\n\n### D.1 *相机控制器的元素](#28_app-d.html_d1)\n\n### D.2 *更多关于相机控制器](#28_app-d.html_d2)\n\
  \n（此处省略图片翻译，保持格式）... 存储位置和方向向量\n\n相机位置 C 是 3D 世界空间中的一个指定点，因此只需要三个浮点值 C[x], C[y]\
  \ 和 C[z]。这些值可以存储在单独的变量中，也可以在单个 `glm vec3` 中。我们一直使用浮点变量存储它们，并可以继续这样做：\n\n```\nfloat\
  \ cameraX, cameraY, cameraZ;\n\n// 默认相机位置在 Z 轴\ncameraX = 0.0f; cameraY = 0.0f;\
  \ cameraZ = 8.0f;\n```\n\n\n\n方向向量 `U`、`V` 和 `N` 也可以存储在浮点变量中（每个三个），或者存储在 `glm vec3s`\
  \ 中。在这里我们选择了后者，并利用 `vec3` 构造函数来初始化它们：\n\n```\nglm::vec3 cameraU(1.0f, 0.0f, 0.0f);\n\
  glm::vec3 cameraV(0.0f, 1.0f, 0.0f);\nglm::vec3 cameraN(0.0f, 0.0f, -1.0f);\n```\n\
  \n请注意，我们对方向向量进行了特意初始化，以满足以下三个要求（图 3.13 中的视图矩阵计算依赖于它们）：\n\n- 它们必须是单位长度。\n- 它们必须相互正交。\n\
  - 它们必须排列为左手坐标系。\n\n具体在上面的示例中，向右的 `U` 向量初始化为指向正 X 轴方向，朝上的 `V` 向量指向正 Y 轴方向，而朝前的 `N`\
  \ 轴指向负 Z 轴方向。这与 第 3 章 中所示的默认 OpenGL 相机方向（图 3.11）一致。只要符合上述三个要求，也可以其他的初始方向。\n\n当相机移动和旋转时，保持向量\
  \ `U`、`V` 和 `N` 的单位长度和相互正交是非常重要的。我们将很快描述如何实现这一点。\n\n### D.1.2 移动相机函数\n\n移动相机是指改变其位置\
  \ `C`，而不改变其方向向量 `U`、`V` 和 `N`。最常见的相机移动是向前和向后，也可以其他移动。向前移动意味着相机沿着其朝前的方向向量 `N` 移动。也就是说，无论相机当前朝向哪个方向，“向前”移动意味着将位置\
  \ `C` 改变到该 `N` 轴上的另一个位置。请注意，在此过程中，`C` 发生了变化，但 `N` 没有。\n\n初学者犯的一个常见错误是认为相机向前移动意味着沿着世界\
  \ Z 轴移动。虽然对于之前示例中的初始相机朝向是正确的，但在旋转相机后，它就不再正确了。相反，我们需要让相机沿着自己的 `N` 方向向量移动。\n\n向前移动相机需要简单的向量算术。如果我们将相机位置\
  \ `C` 视为一个向量（记住空间中的位置可以被视为从原点到该位置的向量），那么只需将 `N` 加到 `C` 上即可让相机向前移动，如图 D.1 所示。当然，我们通常对向前移动的距离有更精细的控制，因此完整的公式如下：\n\
  \n`C´ = C + (a*N)`\n\n其中 `C` 是当前的相机位置，`N` 是朝前的相机方向向量，`a` 是表示所需移动量的浮点标量，`C´` 是得到的新相机位置。向后移动相机几乎相同；我们只需向\
  \ `C` 加上 `-N`，公式就变为 `C´ = C – (a*N)`。`glm` 数学库提供了两个向量相加以及向量乘以标量的函数。\n\n![](img/FigD_01.jpg)\n\
  \n图 D.1\n\n向前移动相机。\n\n相机向右和向左移动使用相同的过程，不同之处在于使用了向右的相机方向向量 `U`。向右向左移动的公式分别为 `C´ =\
  \ C + (a*U)` 和 `C´ = C - (a*U)`。理解向右移动与向右旋转的区别非常重要。向右移动意味着相机向其右侧滑动，沿着其向右的 `U` 向量的方向，而不改变它的朝向。向右旋转意味着旋转相机，改变其朝向，使其面向不同的方向（我们将很快学习如何这样做）。\n\
  \n同样，相机向上和向下移动将通过公式 `C´ = C + (a*V)` 和 `C´ = C - (a*V)` 分别实现。\n\n允许最终用户移动相机（例如在视频游戏中）需要捕获用户输入然后调用所需的函数。例如，视频游戏允许玩家通过按下“W”键向前移动是常见的。幸运的是，我们正在使用的\
  \ `GLFW` 库可以很方便地捕获用户键，关于此操作的用户指南可以在 [GL22] 中找到。因此，我们可以使用 `GLFW` 捕获相应的按键，并调用上述描述的相关函数来按需移动相机。\n\
  \n### D.1.3 旋转相机函数\n\n旋转相机是指改变其方向向量 `U`、`V` 和 `N`，而不改变其位置 `C`。最常见的相机旋转是向右和向左，也可以其他旋转。向“右”或“左”旋转意味着相机绕其朝上的方向向量\
  \ `V` 旋转。也就是说，无论相机当前朝向哪个方向，“向右”旋转意味着其向右的 `U` 和朝前的 `N` 方向向量，使相机指向不同的方向。请注意，在此过程中，`U`\
  \ 和 `N` 发生了变化，但 `V`（以及 `C`）没有。还要注意，此操作必须确保方向向量 `U`、`V` 和 `N` 保持相互正交，且每个保持单位长度。\n\
  \n初学者犯的一个常见错误是认为向右旋转相机意味着绕世界 Y 轴旋转。虽然对于之前示例中的初始相机朝向是正确的，但对于其他朝向就不再正确了。相反，我们需要绕其\
  \ `V` 方向向量旋转相机。\n\n旋转相机需要绕其三个轴中的两个进行旋转。例如，向右和向左旋转（也称为偏航 yaw）需要绕 `V` 旋转 `U` 和 `N`。这在图\
  \ D.2 中所示。同样，向上和向下旋转（也称为俯仰 pitch）需要绕 `U` 旋转 `V` 和 `N`，而翻滚 roll 则通过绕 `N` 旋转 `U` 和\
  \ `V` 实现。在每种情况下，我们都需要指定旋转的角度（弧度）。\n\n`glm` 数学库提供了绕轴（即绕另一个向量）旋转向量的函数。请注意，只要我们以相同的量绕第三个向量旋转两个向量（U\
  \ 和 N），这三个相机向量将保持相互正交。还要注意，仅仅旋转向量不会改变其长度，因此它们也保持单位长度。\n\n![](img/FigD_02.jpg)\n\n\
  图 D.2\n\n向左旋转\n\n正如之前移动相机一样，视频游戏允许玩家通过按下箭头键等操作“向左转”或“向右转”。我们可以使用 `GLFW` 捕获所需的按键\
  \ [GL22]，然后调用相应的旋转函数从不同方向观察并查看场景。\n\n### D.1.4 构建视图矩阵\n\n现在我们看到了 `C`、`U`、`V` 和 `N`\
  \ 向量在控制相机位置和朝向方面的作用，构建关联视图矩阵只需应用图 3.13 中的公式（在附录开头已复制）。执行此操作的步骤如下：\n\n1. 通过将 `C[x]`、`C[y]`\
  \ 和 `C[z]` 的负值插入单位矩阵的最右列来构建 `T` 矩阵（从而形成 `-C` 的平移矩阵）。\n2. 通过将 `U[x]`、`U[y]`、`U[z]`、`V[x]`、`V[y]`、`V[z]`\
  \ 以及 `N[x]`、`N[y]`、`N[z]` 的负值插入图 3.13 所示的位置构建 `R` 矩阵。\n3. 拼接（相乘）矩阵 `R` 和 `T`，形成视图矩阵\
  \ `V`。\n\n这些步骤的每个函数在 `glm` 数学库中可用。\n\n\n\n\n初学者经常犯的一个错误是在构建 R 矩阵时对其进行了转置。通过使用 `glm`\
  \ 中的平移矩阵构造函数可以最方便地构建 `T` 矩阵，这可以确保其构建正确。然而，在构建 `R` 矩阵时，很容易混淆行和列。另一个非常常见的错误是按错误的顺序连接\
  \ `R` 和 `T`。它们必须从左到右相乘为 `R*T`（注意矩阵乘法不结合律）。虽然移动和旋转相机通常与用户控制相关，但视图矩阵的构建应该自动发生，通常在每一帧进行。因此，构建视图矩阵的函数应该从\
  \ `display()` 中调用¹\n\n## D.2 关于相机控制器的更多\n\n第 D.1 节描述的控制器可能适用于从不同视角观察 3D 场景的任务，它有时被称为“飞行摄像”。例如，一个允许用户设计汽车零件的\
  \ CAD 工具需要设计师能够从各个角度查看零件，以确保其符合预期规格。它可能适用于离线渲染（例如电影），因为那里不需要人工交互。\n\n然而，视频游戏（以及视频游戏引擎）通常提供更复杂的相机控制器。一个重要原因是视频游戏通常涉及玩家“化身”，这增加了相机预期视角的复杂性。例如，将化身包含在玩家视野中通常很有用，例如从化身的肩膀后看。或者，他们可能希望从化身的视角观察世界。游戏中常用的两种相机控制器如下：\n\
  \n*   **轨道或目标相机控制器（Orbit or Targeted Camera Controller）** – 在这里，相机始终看向化身的位置，随着化身的移动和旋转，相机也相应地移动和旋转。终端用户拥有相对于化身定位相机的控制权，例如距离化身的距离、仰角和视角。实现上通常使用球坐标（极坐标）。\n\
  *   **追逐或跟踪相机控制器（Chase or Tracking Camera Controller）** – 在这里，相机始终位于化身后方稍上方，例如适用于赛车游戏。随着化身的移动，相机“追逐”它，允许终端用户观察化身以及化身前方和侧面的区域以及其他附近的竞争者。追踪相机通常还采用“弹簧”系统，这样化身的急转弯会导致相机位置发生更平缓的变化，从而避免玩家产生晕动症。\n\
  \n关于如何实现各种相机控制器，有很多在线教程。例如，Megabyte Softworks 在线提供了一个使用 `glm` 在 C++ 中构建轨道控制器的良好教程\
  \ [MB09]。\n\n## 参考文献\n\n[GL22] GLFW 输入指南，访问于 2023 年 11 月，[`www.glfw.org/docs/3.3/input_guide.html`](https://www.glfw.org/docs/3.3/input_guide.html)\n\
