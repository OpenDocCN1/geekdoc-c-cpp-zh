  \ 10.1 凹凸贴图\n## 10.2 法线贴图\n## 10.3 高度贴图\n## 补充说明\n\n![image](img/common.jpg)\n\n\
  假设我们想要模拟一个具有不规则表面物体——例如橙子凹凸不平的表面、葡萄皱皱的表面，或者月球布满陨石的表面。我们该如何做呢？到目前，我们已经学习了两种方法：(a)\
  \ 我们可以建模整个不规则表面，这通常是不行的（多坑的表面需要大量的顶点）；或者 (b) 将不规则表面的纹理贴应用到物体的光滑版本。第二种方案通常有效。然而，如果场景中包含光源，且光源（或相机角度）移动，很快就能看出物体是静态纹理的（且是光滑的），因为纹理上的明暗区域不会像物体实际凹凸不平那样发生变化。\n\
  \n在本章中，我们将探索几种相关方法，利用光照效果使物体看起来具有真实的表面纹理，即使底层物体模型是平滑的。我们将首先研究凹凸贴图和法线贴图，当在物体模型中包含微小表面细节计算开销太大时，这些技术可以为场景中的物体增加大量的真实性。我们还将查看通过高度贴图实际上扰动平滑表面顶点的方法，这对于生成地形（以及其他用途）非常有用。\n\
  \n### 10.1 凹凸贴图\n\n在第 7 章中，我们看到表面法线对于创建可信的光照效果至关重要。像素处的光强在很大程度上取决于反射角，考虑了光源位置、相机位置以及像素处的法向量。因此，如果我们能找到生成相应法线的方法，就可以避免生成与凹凸或皱皱表面对应的详细顶点。\n\
  \n![image](img/fig10_1.jpg)\n\n图 10.1\n\n用于凹凸贴图的扰动法线向量。\n\n![image](img/fig10_2.jpg)\n\
  \n图 10.2\n\n程序化凹凸贴图示例。\n\n图 10.1 展示了对应单个“凸起”的修改法线的概念。\n\n因此，如果我们想让物体看起来像有凹凸，一种方法是计算法线。这最早由\
  \ Blinn 在 1978 年提出，并随着片段着色器（fragment shader）的出现而变得实用。示例见图 10.2。注意，顶点着色器现在需要将这些未变换的顶点传递下去。\n\
  \n以这种方式通过数学函数改变法线被称为程序化凹凸贴图。\n\n```\n程序 10.1 程序化凹凸贴图\n```\n\n![image](img/prog10_1.jpg)\n\
  \n### 10.2 法线贴图\n\n凹凸贴图的替代方案是使用查找表替换法线。这允许我们构建没有数学函数的凹凸，例如月球上的陨石坑。实现此点的常用方法是法线贴图。\n\
  \n为了理解其工作原理，我们首先注意到可以用三个字节合理地存储向量，每个字节对应 X、Y 和 Z。这使得将法线存储在颜色图像成为可能，R、G、B 分量分别对应\
  \ X、Y、Z。图像中的 RGB 值以字节存储，并且通常被解释为 [0..1] 范围内的值，而向量可以有正负分量值。如果我们将法线向量分量限制在 [-1..1]\
  \ 范围内，将法线向量 N 转换为图像像素的简单方法是：\n\n![image](img/pg662.jpg)\n\n法线贴图利用一个图像文件（称为法线图），其中包含了在光照下产生所需所需的法线。在法线图中，向量相对于任意\
  \ X-Y 平面表示，其 X 和 Y 分量代表相对于垂直方向的偏移，Z 分量设置为 1。垂直于 X-Y 平面的向量（即无偏移）将表示为 (0,0,1)，而非垂直的向量将具有非零的\
  \ X 或 Y 分量。我们使用上述公式转换为 RGB 空间；例如，0,0,1) 将存储为 (.5,.5,1)，因为实际偏移范围是 [-1..1]。我们可以通过纹理单元的另一种巧妙应用利用这种法线图：不再在纹理单元中存储颜色，而是存储所需的法线向量。我们可以使用采样器查找给定片段的法线图值，然后不是将返回的值应用于输出像素颜色（正如我们在纹理贴图中做的那样），而是将其作为法线向量。\n\
  \n![image](img/fig10_3.jpg)\n\n图 10.3\n\n法线图图像文件示例 [LU16]。\n\n\n\n\n\n# 法线映射 (Normal\
  \ Mapping)\n\n这种法线图图像文件的一个示例如图 10.3 所示。它是通过对来自 Luna 的纹理 `[LU16` 应用 GIMP 法线映射插件 `[GN12]`\
  \ 生成的。法线映射图像文件并不是为了查看而设计的；我们展示这张图是为了指出此类图像很大程度上呈现蓝色。这是因为图像文件中的每个条目的 `B` 值均为 `1`（最大蓝色值），使得图像在查看时看起来是“蓝色的”。\n\
  \n![image](img/fig10_4.jpg)\n\n图 10.4\n\n法线映射示例。图 10.4 显示了两个不同的法线图图像文件（它们都是由来自 Luna\
  \ 的纹理 `LU16 构建的），以及在 Blinn-Phong 照光存在的情况下将它们应用于球体上的结果。\n\n从法线图中检索的法线向量无法直接使用，因为正如前所述，它们是相对于任意的\
  \ `X-Y` 平面定义的，而没有考虑到它们在物体上的位置以及在世界空间中的朝向。我们解决此问题的策略是构建一个变换矩阵，将法线转换为世界空间，如下所示。\n\n\
  在物体的每个顶点上，我们考虑一个切于物体的平面。该顶点处的物体法线垂直于该平面。我们在平面内定义两个相互垂直的向量，这两个向量也垂直于法线，称为 `tangent`（切线）和\
  \ `bitangent`（副切线，有时称为 `binormal` 副法线）。构建我们所需的变换矩阵要求我们的模型为每个顶点包含一个 `tangent` 向量（`bitangent`\
  \ 可以通过计算 `tangent` 和 `normal` 的叉积来构建）。如果模型本身没有定义切线向量，则可以对它们进行计算。在球体的情况下，可以精确地计算它们，如对程序\
  \ 6.1 的如下修改所示：\n\n![image\n\n对于不便于对切线进行精确解析推导的模型，可以对切线进行近似，例如通过在构建（或加载）每个顶点时，从每个顶点指向下一个顶点绘制向量。注意，这种近似可能会导致切线向量与对应的顶点法线并不严格垂直。因此，实现适用于各种模型的法线映射需要考虑这种可能性（我们的解决方案将考虑这一点）。\n\
  \n切线向量从缓冲区（`VBO`）发送到顶点着色器中的顶点属性，就像处理顶点、纹理坐标和法线的方式一样。顶点着色器然后以处理法线向量相同的方式处理它们，即应用\
  \ `M` 矩阵的逆转置并将结果向下传递流水线，以便由光栅化器进行插值并最终传递到片元着色器。逆转置的应用将法线和切线向量转换为世界空间，之后我们使用叉积构建副切线。\n\
  \n一旦我们在世界空间中拥有 `normal`、`tangent` 和 `bitangent` 向量，我们就可以使用它们来构建一个矩阵（根据其组件命名为“TBN”矩阵），该矩阵将从法线图中检索的法线转换为它们相对于物体表面的、在世界空间中的相应朝向。\n\
  \n在片元着色器中，新法线的计算在 `calcNewNormal()` 函数中完成。函数第三行的计算（包含 `dot(tangent, normal)` 的那行）确保切线向量垂直于法线向量。新切线和法线之间的叉积产生副切线。\n\
  \n然后我们将 TBN 创建为 3×3 的 `mat3` 矩阵。`mat3` 构造函数接受三个向量并生成一个矩阵，其中第一个向量位于第一行，第二个向量位于中间行，第三个向量位于最后行（类似于从相机位置构建视图矩阵——参见图\
  \ 3.13）。\n\n着色器使用片元的纹理坐标来提取于当前片元的法线图条目。采样变量 `normMap` 用于此，在这种情况下它被绑定到纹理单元 `0`（注意：`C++/OpenGL`\
  \ 应用程序必须将法线图图像附加到纹理单元 `0`）。为了将颜色组件从存储范围 `[0..1]` 转换为其原始范围 `[-1..+1]`，我们需要乘以 `2.0`\
  \ 并减去 `1.0`。\n\n然后将 TBN 矩阵应用于生成的法线，以产生当前像素的最终法线。着色器的其余与用于 Phong 照光的片元着色器相同。片元着色器显示在程序\
  \ 10.2 中，基于 Etay Meiri `[ME11` 的版本。\n\n存在多种工具用于开发法线图图像。某些图像编辑工具，如 GIMP `[GI23]`\
  \ 和 Photoshop `[PH23]`，具有此类功能。这些工具分析图像中的边缘，推断波峰和波谷，并产生相应的法线图。\n\n图 10.5 显示了 Hastings-Trew\
  \ `HT23` 基于 NASA 卫星数据创建的月球表面纹理图。相应的法线图是通过对同样由 Hastings-Trew 创建的黑白图应用 GIMP 法线映射插件\
  \ `[GN12` 生成的。\n\n![image 图 10.5 月球、纹理和法线图。***程序 10.2 法线映射片元着色器***![image](img/prog10_2.jpg)\n\
  \n![image](img/fig10_6.jpg)\n\n图 10.6\n\n带月球纹理（左侧）和法线图（右侧）的球体。图 10.6 显示了以两种方式纹理化的球体。左侧简单地使用了纹理；右侧使用了法线图（作为参考）。两种情况下都没有应用法线映射。尽管纹理化的“月球”看起来很真实，但仔细观察发现该图像是从左侧光光时拍摄的，因为阴影投在右侧（底部附近的陨坑最为明显）。如果我们在这个场景中添加\
  \ Phong 渲染，然后通过移动月球、相机或物体来制作动画，这些阴影不会像我们预期那样变化。\n\n此外，随着光源移动（或相机或物体移动），我们预计脊线上会出现许多高光。但图\
  \ 10.6 左侧的普通纹理球体只会产生一个高光，对应于光滑球体上出现的光，这看起来非常不真实。引入法线图可以提高此类物体照明的真实性。\n\n如果在球体上使用法线映射（而不是应用纹理），我们得到图\
  \ 10.7 所示的结果。虽然还没有标准纹理那样真实（目前），但它现在*会*对光照变化做出响应。第一张图像从左侧光照，第二张从右侧光照。注意蓝色和黄色箭头，它们显示了脊线周围漫反射的变化以及高光的移动。\n\
  \n图 10.8 显示了在 Phong 照光存在将法线映射与标准纹理结合的效果。月球图像通过漫反射光区域和高光得到了增强，这些高光会对光源移动（或相机或物体移动）做出响应。图中图像的光照分别来自左侧和右侧。\n\
  \n![image](img/fig10_7.jpg)\n\n图 10.7\n\n法线映射在月球上的照明效果。\n\n![image](img/fig10_8.jpg)\n\
  \n图 10.8\n\n纹理加法线映射，光照来自左侧和右侧。\n\n\n\n\n我们的程序现在需要两个纹理——一个用于月球表面图像，另一个用于法线贴——因此需要两个采样器。片元着色器将纹理颜色与光照计算产生的颜色混合，如程序\
  \ 10.3 所示，使用了之前在第 7.6 节中描述的技术。\n\n### 程序 10.3 纹理化结合法线贴\n\n![image](img/prog10_3.jpg)\n\
  \n有趣的是，法线映射可以从 `mipmapping`（多级映射）中受益，因为我们在第 5 章中处理纹理时看到的相同“锯齿”伪影，在使用纹理图像进行法线映射时也会发生。图\
  \ 10.9 显示了开启和未开启 mipmapping 的法线映射月球。虽然在静态图中并不明显，但左侧的球体（`not` mipmapped）在其边缘周围有闪烁的伪影。\n\
  \n各异性过滤（AF）的效果更好，在保留细节的同时减少了闪烁伪影，如图 10.10 所示（比较右下角边缘的细节）。一个将纹理、光照与法线映射及 AF 相结合的版本在图\
  \ 10.11 所示。\n\n结果并不完美。原始纹理图像中出现的阴影仍然会渲染结果上，无论光照如何。此外，虽然法线映射可以影响漫反射和高光效果，但它不能产生阴影。因此，这种方法在表面特征较小时最为适用用。\n\
  \n![image](img/fig10_9.jpg)\n\n图 10.9\n\n通过 mipmapping 修正的法线映射伪影。\n\n![image](img/fig10_10.jpg)\n\
  \n图 10.10\n\n带有 AF 的法线映射。\n\n![image](img/fig10_11.jpg)\n\n图 10.11\n\n带有 AF 的纹理化结合法线映射。\n\
  \n### 10.3 高度映射 (HEIGHT MAPPING)\n\n我们现在将法线映射的概念——即使用纹理图像来扰动法线——扩展为`扰动顶点位置本身`。这种方式实际修改对象的几何结构具有某些优点，例如使表面特征沿对象的边缘可见，并使特征对阴影映射做出响应。它也有助于构建`terrain`（地形）。\n\
  \n实际的方法是使用纹理图像存储 `height` 值，然后可以使用这些值来抬高（或降低）顶点位置。包含高度信息的图像称为 `height map`（高度图），使用高度图改变对象的顶点被称为\
  \ `height mapping`（高度映射）。高度图通常将高度信息编码为灰度颜色：`(0,0,0)`（黑色）= `low` 高度，`(1,1,1)`（白色）=\
  \ `high` 高度。这使得通过算法或使用“绘画”程序创建高度图变得容易。图像对比度越高，贴图表示的高度变化就越大。这些概念在图 10.12（显示随机生成的贴图）和图\
  \ 10.13（显示具有组织模式的贴图）中说明。\n\n改变顶点位置的有用性取决于被修改的模型。顶点操作在顶点着色器中可以很容易完成，当模型顶点具有高水平细节时（例如精度足够高的球体），这种方法效果良好。然而，当底层的顶点数量较少时（例如立方体的角），渲染对象的表面就依赖于光栅化器中的顶点插值来填充细节。当顶点着色器中可用的用于扰动的顶点非常少时，许多像素的高度将是通过插值得到，而不是从高度图中检索，导致表面细节糟糕。当然，在片元着色器中进行顶点操作是不可能的，因为到那时顶点已经光栅化为像素位置了。\n\
  \n![image](img/fig10_12.jpg)\n\n图 10.12\n\n高度图示例。\n\n![image](img/fig10_13.jpg)\n\
  \n图 10.13\n\n高度图解释。\n\n程序 10.4 显示了一个顶点着色器，它通过将顶点法线乘以从高度图中检索的值，然后将该积加到顶点位置，从而移动顶点“向外”（即朝表面法线方向）。\n\
  \n### 程序 10.4 顶点着色器中的高度映射\n\n![image](img/prog10_4.jpg)\n\n图 10.14 显示了一个在绘画程序中涂鸦创建的简单高度图（左上）。高度图图中还画了一个白色正方形。绿色的高度图版本（左下）被用作纹理。当使用程序\
  \ 10.4 所示的着色器将高度图应用于 100x100 的矩形网格模型时，它产生了一种“地形”（右所示）。注意白色正方形如何导致右侧的悬崖。\n\n图 10.15\
  \ 显示了在顶点着色器中进行高度映射的另一个示例。这次高度图是世界大陆的轮廓。球体精度增加到 500 以确保有足够的顶点。注意升起的边缘如何影响轮廓。\n\n\
  ![image](img/fig10_14.jpg)\n\n图 10.14\n\n在顶点着色器中高度映射的地形。\n\n![image](img/fig10_15.jpg)\n\
  \n图 10.15\n\n应用于球体的顶点着色器高度映射。\n\n图 10.14 和图 10.15 所示的渲染结果是可以接受的，因为这两个模型（网格和球体）具有足够的顶点来采样高度图。也就是说，它们的顶点相当多，且高度图采样充分。然而，仔细观察仍然会发现分辨率伪影的存在，例如沿边。底层网格的\
  \ 100x100 分辨率无法完美对齐高度图中的白色框，纹理坐标的光栅化产生了伪影。\n\n尝试使用更高要求的高度图时，在顶点着色器中进行高度映射的局限性被进一步暴露。考虑回到图\
  \ 10.5 所示的月球图像。法线映射在捕捉图像细节方面表现出色（如之前的图 10.9 讨论在 `tessellation shader`（细分着色器）中生成更多数量顶点的方法时再次回到高度映射。\n\
  \n**补充说明**\n\n\n\n\n凸映射（bump mapping）或法线映射（normal mapping）的一个基本局限性是，虽然它们能够提供渲染对象内部的表面细节，但轮廓（外边界）并没有显示任何此类细节（它保持平滑）。高度映射（height\
  \ mapping）如果用于实际修改顶点位置，可以修复这一缺陷，但它也有自己的局限性。正如我们在书中后面将看到的，有时可以使用几何着色器或细分着色器来增加顶点数量，使得高度映射更具实用且更有效。\n\
  \n我们简化了一些凸映射和法线映射的计算。对于关键应用，有更准确和/或高效的解决方案 [BN12]。\n\n## 练习\n\n- **10.1** 通过修改片段着色器中的设置和/或计算，对程序\
  \ 10.1 进行实验并观察结果。\n- **10.2** 使用绘图程序生成你自己的高度图，并将其用于程序 10.4 中。尝试识别出由于顶点着色器无法充分采样高度图而导致细节缺失的位置。你可能会发现，使用你的高度图图像文件对地形进行纹理化（如图\
  \ 10.14 所示，或使用某种暴露表面结构的图案，如网格）非常有用，这样你就能看到生成地形的山丘和山谷。\n- **10.3 (项目)** 在程序 10.4\
  \ 中添加光照，以进一步暴露高度映射地形的表面结构。\n- **10.4 (项目)** 在练习 10.3 的代码中添加阴影映射，使你的高度映射地形产生阴影。\n\
