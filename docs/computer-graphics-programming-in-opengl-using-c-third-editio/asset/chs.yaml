  \n# 第 3 章\n## 数学基础\n\n3.1 *3D 坐标系*\n\n3.2 *点*\n\n3.3 *矩阵*\n\n3.4 *变换矩阵*\n\n3.5 *向量*\n\
  \n3.6 *局部空间与世界空间*\n\n3.7 *观察空间与相机*\n\n3.8 *投影矩阵*\n\n3.9 *看向目标矩阵*\n\n3.10 *构建矩阵的\
  \ GLSL 函数*\n\n*补充说明*\n\n![image](img/common.jpg)\n\n计算机图形学大量使用数学，特别是矩阵代数。尽管我们倾向于认为\
  \ 3D 图形学是最现代的领域之一（事实如此），但许多使用的技术可以追溯到数百年前。几乎 3D 图形学的每个方面——移动、缩放、透视、纹理、光影等——都是通过数学实现的。因此，本章奠定了基础。假设读者具有矩阵的基础知识；如果在任何一点不熟悉，可能需要进行补充阅读。\n\
  \n### 3D 坐标系\n\n3D 空间通常由三个轴表示：X、Y 和 Z。这三个轴可以排列成两种配置：*右手系*或*左手系*。（名称源于左右手的拇指和前两个手指的方向，彼此直交。）\n\
  \n![image](img/fig3_1.jpg)\n\n图 3.13D 坐标系。\n\n知道你的图形编程环境使用哪种坐标系很重要。例如，`OpenGL` 中的大多数坐标系是右手系，而在\
  \ `Direct3D` 中大多数是左手系。在本本书中，除非另有说明，否则我们假设使用右手系。\n\n### 点\n\n3D 空间中的点可以通过列出 X、Y、Z\
  \ 值来指定。然而，使用*齐次坐标*（homogeneous notation）来指定点被证明有用得多，这种表示法在 19 世纪早期就被描述。齐次坐标的点包含四个值。前三个对应\
  \ X、Y 和 Z，第四个值 W 是一个固定的非零值，通常为 1。因此，我们将该点表示为 (2, 8, -3, 1)。正如我们很快看到的，齐次坐标将使我们的许多图形计算更高效。\n\
  \n存储齐次 3D 点的 GLSL 数据类型是 `vec4`（“vec”指的是*vector*，也可以用于点）。`GLM` 库包含了在 C++/`OpenGL`\
  \ 应用中创建和存储 3 元素和 4 元素（齐次）点的相应类，分别称为 `vec3` 和 `vec4`。\n\n### 矩阵\n\n\n\n\n\n`matrix`（矩阵）是一个数值矩形数组，其元素通常通过下标来访问。第一个下标表示行数，第二个下标表示列数，下标从\
  \ 0 开始。我们用于 3D 图形计算的大多数矩阵都是 4x4 大小的，如图 3.2 所示：\n\n![image](img/fig3_2.jpg)\n\n图\
  \ 3.2\n\n4x4 矩阵。\n\nGLSL 语言包含一种名为 `mat4` 的数据类型，用于存储 4x4 矩阵。同样，`GLM` 包含一个名为 `mat4`\
  \ 的 `class` 用于实例化和存储 4x4 矩阵。\n\n`identity matrix`（单位矩阵）包含全零元素，对角线线上为 1：\n\n![image](img/fig3_2_1.jpg)\n\
  \n任何点或矩阵乘以单位矩阵都会保持不变。在 `GLM` 中，通过构造函数调用 `glm::mat4 m(1.0f)` 变量 `m` 中构建单位矩阵。\n\n\
  矩阵的 `transpose`（转置）是通过交换其行和列计算的。例如：\n\n![image](img/fig3_2_2.jpg)\n\n`GLM` 库和 `GLSL`\
  \ 都有转置函数：分别为 `glm::transpose(mat4)` 和 `transpose(mat4)`。\n\n`Matrix addition`（矩阵加法）是非常直观的：\n\
  \n![image](img/fig3_2_3.jpg)\n\n在 `GLSL` 中，`+`运算符在 `mat4` 上被重载以支持矩阵加法。\n\n矩阵之间可以进行各种乘法操作，这些操作在\
  \ 3D 图形中非常有用。矩阵乘法通常可以从`left to right`或`right to left`进行（注意，由于这些操作不同，因此矩阵乘法不满足交换律）。大多数时候我们使用从右到左的乘法。\n\
  \n`在 3D 图形中，将点乘以矩阵` 在大多数情况下是从右到左完成的，并产生一个点，如下：\n\n![image](img/fig3_2_4.jpg)\n\n\
  注意，我们用齐次坐标法将点 (X,Y,Z) 表示为 1 列矩阵。\n\n`GLSL` 和 `GLM` 都支持使用 `*` 运算符将点（准确说是一个 `vec4`）乘以矩阵。\n\
  \n`将一个 4x4 矩阵乘以另一个 4x4 矩阵` 的方法如下：\n\n![image](img/fig3_2_5.jpg)\n\n矩阵乘法经常被称为 `concatenation`（级联），因为正如我们将看到的，它被用于将一组矩阵变换合并为一个矩阵。这种组合矩阵变换的能力之所以是因为矩阵乘法的\
  \ `associative`（结合律）属性。考虑以下操作序列：\n\n`New Point = Matrix[1] * (Matrix[2] * (Matrix[3]\
  \ * Point))`\n\n在这里，我们将一个点乘以 `Matrix[3]`，然后将该结果乘以 `Matrix[2]`，最后将该结果乘以 `Matrix[1]`。结果是一个新点。结合律确保了之前的计算等同于：\n\
  \n`New Point = (Matrix[1] * Matrix[2] * Matrix[3]) * Point`\n\n在这里，我们首先将三个矩阵相乘，形成\
  \ `Matrix[1]`、`Matrix[2]` 和 `Matrix[3]` 的 `concatenation`（其本身也是一个 4x4 矩阵）。如果我们将这种级联称为\
  \ `Matrix[C]`，可以将之前的操作重写为：\n\n`New Point = Matrix[C] * Point`\n\n这里的优势，正如我们在第 4\
  \ 章中将看到的，我们经常需要对场景中的每个点应用相同的矩阵变换序列。通过预先计算所有这些矩阵的级联，我们可以倍倍减少所需的矩阵矩阵操作次数。\n\n`GLSL`\
  \ 和 `GLM` 都支持通过重载的 `*` 运算符进行矩阵乘法。\n\n4x4 矩阵 `M` 的 `inverse`（逆）是另一个 4x4 矩阵，表示为 `M^(-1)`，它在矩阵乘法具有以下属性：\n\
  \n`M*(M^(-1)) = (M^(-1))*M = identity matrix`\n\n我们在这里不会介绍求逆的细节。然而，值得知道的是确定矩阵的逆在计算上可能是昂贵的；幸运的是，我们很少需要它。在极少数需要的情况下，可以通过\
  \ `GLSL` 和 `GLM` 中的 `mat4.inverse()` 函数获得。\n\n## 3.4 TRANSFORMATION MATRICES 变换矩阵\n\
  \n在图形学中，矩阵通常用于对对象执行 `transformations`（变换）。例如，矩阵可以将点从一个位置移动到另一个位置。在本章中，我们将学习几种常用的变换矩阵：\n\
  \n- `Translation`（平移）\n- `Rotation`（旋转）\n- `Scale`（缩放）\n- `Projection`（投影）\n- `Look-At`（视点）\n\
  \n我们的变换矩阵的一个重要属性是它们都是 4x4 大小的。这是通过我们决定使用 `homogeneous`（齐次）实现的，，某些变换将具有不同且不兼容的维度。正如我们看到的，确保它们的大小相同不仅是为了方便；还使得能够任意组合它们，并预计算变换组以提高性能。\n\
  \n### 3.4.1 Translation 平移\n\n`translation`（平移）矩阵用于将项目从一个位置移动到另一个。它由一个单位矩阵组成，X、Y\
  \ 和 Z 的移动量位于 `A[03]`、`A[13]`、`A[23]`。图 3.3 显示了平移矩阵的形式及其乘以齐次点时的效果；结果是一个由平移值修改的新点。\n\
  \n![image](img/fig3_3.jpg)\n\n图 3.3\n\n平移矩阵变换。\n\n注意 (X,Y,Z) 是从`right to left`平移的。例如，如果我们想将一组点沿\
  \ Y 轴向上移动 5 个单位，我们可以通过取单位矩阵并将值 5 置于 `T[y]` 来构建平移矩阵。然后我们只需将想要移动的每个点乘以该矩阵即可。\n\n`GLM`\
  \ 中有很多函数用于构建平移矩阵并将点乘以矩阵。一些相关操作如下：\n\n`glm::translate(Tx,Ty,Tz)`\n\n`mat4`\n\n###\
  \ 3.4.2 Scaling 缩放\n\n缩放矩阵（scale matrix）用于改变对象的大小或让点靠近或远离原点。虽然缩放一个点看起来很奇怪，但 OpenGL\
  \ 中的对象是由点集定义的。因此，缩放对象涉及扩展或收缩其点集。\n\n缩放矩阵由单位矩阵组成，X、Y 和 Z 的缩放因子位于 `A[00]`、`A[11]`、`A[22]`。图\
  \ 3.4 显示了缩放矩阵的形式及其乘以齐次点时的效果；结果是一个新点。\n\n![image](img/fig3_4.jpg)\n\n图 3.4\n\n缩放矩阵变换。\n\
  \n`GLM` 中有很多函数用于构建缩放矩阵并将点乘以缩放矩阵变换。一些相关操作如下：\n\n`glm::scale(Sx,Sy,Sz)`\n\n`mat4`\n\
  \n缩放可以切换坐标系。例如，我们可以使用缩放来确定在给定右手坐标的情况下，左手坐标应该是。根据图 3.1，我们看到反转 Z 坐标会在右手和左手系之间切换，因此实现此目的的缩放矩阵变换为：\n\
  \n![image](img/fig3_4_1.jpg)\n\n### 3.4.3 Rotation 旋转\n\n旋转稍微复杂一点，因为在 3D 空间中旋转项目需要指定\
  \ (a) 旋转轴和 (b) 以度或弧度为单位的旋转量。\n\n在 188 世纪中叶，数学家莱昂哈德·欧拉证明绕任何所需轴的旋转都可以被替换为绕 X、Y、Z 轴旋转的组合\
  \ [EU76]。这三个绕相应轴的旋转角被称为 `Euler angles`（欧拉角）。这一发现被称为`欧拉定理`，对我们非常有用，因为绕每个轴的旋转都可以使用矩阵变换来指定。\n\
  \n\n\n\n分别绕 X、Y、Z 轴旋转的三个旋转变换如图图 3.5 所示。`GLM` 中也有若干几个用于构建和使用旋转矩阵的函数：\n\n![image](img/pg42.jpg)\n\
  \n![image](img/fig3_5.jpg)\n\n图 3.5\n\n旋转变换矩阵。\n\n在实践中，当使用欧拉角将物体绕 3D 空间中的任意直线旋转时，如果该直线不通过原点，则需要几个额外的步骤。通常情况下：\n\
  \n1. 平移旋转轴，使其通过原点。\n2. 绕 X、Y 和 Z 轴按适当的欧拉角进行旋转。\n3. 撤销第 1 步的平移（反向）。\n\n图 3.5 所示的三个旋转变换都有一个有趣的属性：逆旋转恰好等于矩阵的转置。这可以通过检查之前的矩阵来验证，并记住\
  \ `cos(-θ) = cos(θ)` 和 `sin(-θ) = -sin(θ)`。这一属性以后将非常有用。\n\n欧拉角在某些 3D 图形应用中会导致某些伪影。因此，通常建议使用\
  \ `quaternions`（四元数）来计算旋转。对于感兴趣探索四元数的读者，有很多资源可用（例如 [KU02]）。对于我们的大多数需求，欧拉角足够了。\n\n\
  ## 3.5 向量\n\n向量指定了 `magnitude`（长度）和 `direction`（方向）。它们不绑定到特定位置；向量可以被“移动”而不改变其代表的内容。\n\
  \n表示向量有多种方法，例如带带箭头的线段，或者表示为 `(magnitude, direction)`，或者是两点之间的差。在 3D 图形中，向量经常表示为空间中的一个点，其中向量是从原点到该点的距离和方向。在图\
  \ 3.6 中，向量 `V`（红色所示）可以表示为点 `P1` 和 `P2` 之间的差，也可以表示从原点到 `P3` 的等效距离。在我们所有的应用程序中，我们将\
  \ `V` 简单地指定为 `(x,y,z)`，与指定点 `P3` 使用相同的表示法。\n\n![image](img/fig3_6.jpg)\n\n图 3.6\n\
  \n向量 `V` 的两种表示方法。\n\n将向量表示得与点相同非常方便，因为我们可以交替地在点或向量上使用矩阵变换。然而，这可能导致混淆。出于这个原因，我们有时会在向量上方标注一个小箭头（例如\
  \ ![image](img/v-arrow.jpg)）。许多图形系统完全不区分点和向量，例如 `GLSL` 和 `GLM`，它们提供了 `vec3/vec4`\
  \ 数据类型，可以用于存储点或向量。某些系统（如本书较早基于 Java 的版本中使用的 `graphicslib3D` 库）具有单独的点类和向量类，并根据正在进行的操作强制要求使用其中之一。关于使用同一种数据类型处理两者，还是使用分离的数据类型更清晰，仍然是一个开放的话题。\n\
  \n3D 图形中经常使用以下几种向量操作，`GLM` 和 `GLSL` 中提供了相应的函数。例如，假设向量 `A(u,v,w)` 和 `B(x,y,z)`：\n\
  \n**加法和减法：**\n\n`A ± B = (u ± x, v ± y, w ± z)`\n\n`glm: vec3 ± vec3`\n\n`GLSL:\
  \ vec3 ± vec3`\n\n**归一化（变为长度=1）：**\n\n`Â = A/|A| = A/sqrt(u²+v²+w²)` 其中 `|A| ≡ 向量\
  \ A 的长度`\n\n`glm: normalize(vec3)` 或 `normalize(vec4)`\n\n`GLSL: normalize(vec3)`\
  \ 或 `normalize(vec4)`\n\n**点积：**\n\n`A ● B = ux + vy + wz`\n\n`glm: dot(vec3,vec3)`\
  \ 或 `dot(vec4,vec4)`\n\n`GLSL: dot(vec3,vec3)` 或 `dot(vec4,vec4)`\n\n**叉积：**\n\n\
  `A x B = (vz-wy, wx-uz, uy-vx)`\n\n`glm: cross(vec3,vec3)`\n\n`GLSL: cross(vec3,vec3)`\n\
  \n其他有用的向量函数是 `magnitude`（在 `GLSL` 和 `GLM` 中均作为 `length()` 提供），以及 `reflection`（反射）和\
  \ `refraction`（折射）（两者在 `GLSL` 和 `GLM` 中可用）。\n\n现在我们来仔细查看点积和叉积函数。\n\n### 3.5.1 点积的用途\n\
  \n在整书中，我们的程序大量使用了点积。最重要且基本的用途是寻找`两个向量之间的角度`。考虑两个向量 ![image](img/v-arrow.jpg) 和 ![image](img/w-arrow.jpg)，假设我们要找到它们之间的角\
  \ `θ`。\n\n![image](img/pg45_1.jpg)\n\n因此，如果 ![image](img/v-arrow.jpg) 和 ![image](img/w-arrow.jpg)\
  \ 是归一化的（即单位长度——这里我们使用“^”符号表示归一化），那么 ![image](img/pg45.jpg)\n\n有趣的是，我们以后发现通常我们需要\
  \ `cos(θ)` 而不是 `θ`。点积也有很多用途：\n\n- 找到向量的长度：![image](img/pg45.jpg)\n- 找到两个向量是否垂直：![image](img/pg45.jpg)\n\
  - 找到两个向量是否平行：![image](img/pg45.jpg)\n- 找到两个向量方向是否相反：![image](img/pg45.jpg)\n- 找到角度在\
  \ -90°到 90° 之间：![image](img/pg45.jpg)\n- 首先，找到 `S` 的法向量：![image](img/pg45.jpg)\n\
  - 然后，`P` 到 `S` 的距离正负决定了它位于平面的哪侧。\n\n### 3.5.2 叉积的用途\n\n两个向量叉积的一个重要属性（我们在书中将大量使用）是产生一个与原始向量定义的平面垂直的向量。\n\
  \n任何两个不共线的向量都定义一个平面。例如，考虑两个向量 ![image](img/v-arrow.jpg) 和 ![image](img/w-arrow.jpg)。图\
  \ 3.8 显示了由 ![image](img/v-arrow.jpg) 和 ![image](img/w-arrow.jpg) 定义的平面以及由叉积产生的法向量。结果法向量的方向遵循*右手定则*，即右手从\
  \ ![image](img/v-arrow.jpg) 向 ![image](img/w-arrow.jpg) 弯曲，大拇指指向法向量 ![image](img/r-arrow.jpg)\
  \ 的方向。\n\n![image](img/fig3_7.jpg)\n\n图 3.7\n\n叉积产生法向量。\n\n注意顺序很重要；![image](img/w-arrow.jpg)×![image](img/v-arrow.jpg)\
  \ 产生的向量与 ![image](img/r-arrow.jpg) 方向相反。\n\n利用叉积寻找法向量的能力以后学习*光照*时将变得极其有用。为了确定光照效果，我们需要与正在渲染的模型相关的*外法线*。图\
  \ 3.8 显示了一个由六个点（顶点）组成的简单模型示例，以及利用叉积确定其一个一个面的外法线的计算。\n\n![image](img/fig3_8.jpg)\n\
  \n图 3.8\n\n计算外法线。\n\n### 3.6 局部空间与世界空间\n\n3D 图形（使用 OpenGL 或任何其他框架）常见的用途是模拟一个三维世界，在其中放置物体并在显示器上查看该模拟世界。放置在\
  \ 3D 世界中的物体通常由三角形集合建模。以后在第 6 章 中，我们将深入探讨建模。但现在可以开始查看整个流程了。\n\n\n\n\n\n在构建对象的 3D\
  \ 模型时，我们通常会以最便于描述对象的方式来对齐模型。例如，在建模球体时，我们可能会将球体中心对齐到坐标原点 `(0,0,0)`，并赋予它一个方便的半径，例如\
  \ `1`。定义模型的空间称为其`local space`（局部空间）或 `model space`（模型空间）。OpenGL 文档使用 `object space`（对象空间）一术。\n\
  \n随后，该球体可能会作为更大模型的一部分，例如成为机器人的头部。当然，机器人会在它自己的局部/模型空间中定义。将球体模型置于机器人模型空间中可以通过缩放、旋转和平移的矩阵变换来实现，如图图\
  \ 3.9\n\n图 3.9\n\n球体和机器人的模型空间。\n\n## 3.7 EYE SPACE（眼点空间）与合成相机\n\n到目前为止，我们看到的变换矩阵都在\
  \ 3D 空间中运行。然而，最终我们希望将 3D 空间——或其部分显示在 2D 显示器上。为了实现这一点，我们需要确定一个观察点。就像我们从特定方向的一点通过眼睛观察现实世界一样，我们也必须建立一个通往虚拟世界的窗口位置和方向。这个观察点被称为“view”（视图）空间或“eye”（眼点）空间，又称为“synthetic\
  \ camera”（合成相机）。\n\n![image](img/fig3_10.jpg)\n\n图 3.10\n\n在 3D 世界中安置相机。\n\n如图图\
  \ 3.11 和 3.12 所示，观察涉及：(a) 将相机置于世界的某个位置；(b) 对齐相机，这通常需要维护其自身的一组正交轴 ![image](img/pg48.jpg)；(c)\
  \ 定义一个`view volume`（视体）；以及 (d) 将视体内的对象投影到`projection plane`（投影平面）。\n\nOpenGL 包含一个永久固定在原点\
  \ `(0,0,0)` 并面向负 Z 轴的相机，如图图 3.11 所示。\n\n![image](img/fig3_11.jpg)\n\n图 3.11\n\n\
  OpenGL 固定相机。\n\n为了使用 OpenGL 相机，我们需要做的事情之一是*模拟*将其移动到某些所需的位置和方向。这是通过确定世界中的对象相对于所需相机位置的位置来实现的（即确定它们在“camera\
  \ space”（相机空间）中的位置，该空间由相机的 `U`、`V` 和 `N` 轴定义，如图图 3.12 所示）。给定世界空间位置为 `P[W]` 的点，我们需要一个变换将其转换为相机空间中的等效点，使其*看起来*像是我们正从所需的相机位置\
  \ `C[w]` 观察它。我们通过计算其相机空间位置 `P[C]` 来实现这一点。已知 OpenGL 相机位置始终在固定位置 `(0,0,0)`，什么样的变换可以实现这一目标呢？\n\
  \n![image](img/fig3_12.jpg)\n\n图 3.12\n\n相机方向。\n\n必要的变换确定如下：\n\n1. 通过所需相机位置的负值来平移\
  \ `P[W]`。\n2. 通过所需相机方向的欧拉角的负值来旋转 `P[W]`。\n\n我们可以构建一个在矩阵中同时完成旋转和平移的单一变换，将该矩阵称为`viewing\
  \ transform`（视图变换）矩阵或 `V`。矩阵 `V` 是通过级联两个矩阵 `T`（一个包含所需相机位置负值的平移矩阵）和 `R`（一个包含所需相机方向负值的旋转矩阵）产生的。在这种情况下，从右到左的操作顺序，我们首先平移世界点\
  \ `P`，然后旋转它：\n\n```\nP[C] = R * ( T * P[W] )\n```\n\n正如我们之前看到的，结合律允许我们如下所示对操作进行分组：\n\
  \n```\nP[C] = ( R * T ) * P[W]\n```\n\n如果我们将级联的 `R*T` 保存在矩阵 `V` 中，现在操作看起来像这样：\n\n\
  ```\nP[C] = V * P[W]\n```\n\n完整的计算过程以及矩阵 `T` 和 `R` 的精确内容如图图 3.13 所示（我们省略了矩阵 `R`\
  \ 的推导——推导可以在 [FV95] 中找到）。\n\n![image](img/fig3_13.jpg)\n\n图 3.13\n\n推导视图矩阵。\n\n\
  更常见的情况是将 `V` 矩阵与模型矩阵 `M` 级联形成单一的`model-view`（模型-视图）矩阵：\n\n```\nMV = V * M\n```\n\
  \n然后，模型空间中的点 `P[M]` 被变换。\n\n## 3.8 PROJECTION MATRICES（投影矩阵）\n\n现在建立了相机，我们可以检查`projection\
  \ matrices`（投影矩阵）。我们将检查的两个重要矩阵是 (a) `perspective`（透视）和 (b) `orthographic`（正交）。\n\
  \n### 3.8.1 Perspective Matrix（透视矩阵）\n\n透视投影利用透视概念模仿我们看到的世界使 2D 图片看起来像 3D。近的对象看起来比远的对象大。透视是文艺复兴时期伟大发现之一，1400-1500\
  \ 年，艺术家开始以比他们更写实的方式绘画。\n\n在图 3.14 中可以看到一个绝佳例子，卡洛·克里韦利（Carlo Crivelli）1486 年的作品《告知》（现藏于国家美术馆\
  \ [CR86]）。透视的使用显而易见——右侧建筑的退线相互倾斜。这创造了深度和 3D 空间的幻觉，在这个过程中，现实中平行的线在图片中并不平行。此外，前景的人比背景的人大。\n\
  \n我们通过使用一种将平行线转换为适当非平行线的变换矩阵来实现这种效果。这种矩阵称为`perspective matrix`（透视矩阵）或 `perspective\
  \ transform`（透视变换），通过定义`view volume`（视体）的四个参数构建。这些参数是 (a) `aspect ratio`（宽高比）、(b)\
  \ `field of view`（视野）、(c) `projection plane`（投影平面或 `near clipping plane`近裁剪平面）以及\
  \ (d) `far clipping plane`远裁剪平面）。\n\n只有位于近、远裁剪平面之间的对象会被渲染。近裁剪平面还作为对象*投影*的平面，通常靠近眼睛或相机（如图图\
  \ 3.15 左侧所示）。远裁剪平面值的选择将在第 4 章](#10_chapter04.html)中讨论。*field of view* 是可见空间的垂直角度。*aspect\
  \ ratio* 是近远裁剪平面的宽高比。由这些元素形成并如图图 3.15 所示的形状被称为`frustum`（椎台体）。\n\n![image](img/fig3_15.jpg)\n\
  \n图 3.15\n\n透视视体或椎台体。\n\n\n\n\n\n透视矩阵用于将 3D 空间中的点变换到近裁剪平面上的适当位置，它是通过首先计算值 `q`、`A`、`B`\
  \ 和 `C`，然后使用这些值构建矩阵的，如图 3.16 所示（并在 [FV95] 中推导）。\n\n![image](img/fig3_16.jpg)\n\n\
  图 3.16\n\n构建透视矩阵。\n\n生成透视变换矩阵是一件简单的事，只需将描述的公式插入 4x4 矩阵的单元格中。GLM 库还包含一个用于构建透视矩阵的函数\
  \ `glm::perspective()`。\n\n### 3.8.2 正交投影矩阵\n\n在正交（orthographic）投影中，平行线保持平行；也就是说，没有使用透视。相反，视体范围内的物体被直接投影，而不会根据它们距离相机的远近调整其大小。\n\
  \n正交投影是一种平行投影，其中所有投影都与投影面垂直。正交矩阵通过定义以下参数来构建：(a) 相机到投影面的距离 `Z[near]`，(b) 相机到远裁剪面的距离\
  \ `Z[far]`，以及 (c) `L`、`R`、`T` 和 `B` 的值，其中 `L` 和 `R` 分别对应于投影面上左右边界的 X 坐标，`T` 和 `B`\
  \ 分别对应于投影面上上下边界的 Y 坐标。 [WB15] 中推导的正交投影矩阵如图 3.18 所示。\n\n![image](img/fig3_17.jpg)\n\
  \n图 3.17\n\n正交投影。\n\n![image](img/fig3_18.jpg)\n\n图 3.18\n\n正交投影矩阵。\n\n并不是所有的平行投影都是正交投影，但其他的出了本教科书的范围。\n\
  \n平行投影与眼睛观察真实世界时看到的并不符。但它们在许多情况下非常有用，例如投影阴影、执行 3D 裁剪以及 CAD（计算机辅助设计）中——后者是因为无论物体如何放置，它们都能保持测量比例。然而，书中的大部分示例都使用透视投影。\n\
  \n## 3.9 LOOK-AT 矩阵\n\n我们将检查的最后一个变换是 `look-at` 矩阵。当你希望将相机放置在某处并看向另一个特定位置时，这个矩阵非常方便，如图\
  \ 3.19 所示。当然，可以使用我们已经看到的方法来实现，但由于这是一个非常常见的操作，因此构建一个矩阵变换来完成它通常是有用的。\n\n![image](img/fig3_19.jpg)\n\
  \n图 3.19\n\nlook-at 的元素。\n\nlook-at 变换仍然需要确定相机的方向。我们通过指定一个近似所需通用方向的向量（例如世界 ![image](img/y-arrow.jpg)\
  \ 轴）来这样做。通常，可以使用一系列叉积来为所需的相机方向生成一组合适的前向、侧向和向上向量向量。图 3.20 显示了计算过程，从相机位置（眼点）、目标位置和初始向上向量\
  \ ![image](img/y-arrow.jpg) 开始，以构建 [FV95] 中推导的 look-at 矩阵。\n\n![image](img/fig3_20.jpg)\n\
  \n图 3.20\n\nLook-At 矩阵。\n\n我们可以将其编码为一个简单的 C++/OpenGL 实用函数，在给定相机位置、目标位置和初始“向上”向量\
  \ ![image](img/y-arrow.jpg) 值的情况下来构建 look-at 矩阵。由于 GLM 包含了用于构建 look-at 矩阵的函数 `glm::lookAt()`，我们将直接使用它。这个函数在本书的后续部分将非常有用，特别是在第\
  \ 8 章 我们生成阴影时。\n\n## 3.10 用于构建矩阵变换的 GLSL 函数\n\n尽管 GLM 包含了执行本章涵盖的许多 3D 变换（如平移、旋转和放）的定义函数，但\
  \ GLSL 只包含基本的矩阵操作，如加法、合并等。因此，当我们需要在着色器中执行某些 3D 计算时，有时需要编写自己的 GLSL 实用函数来构建 3D 变换矩阵。GLSL\
  \ 中存储此类矩阵的适当数据类型是 `mat4`。\n\nGLSL 中初始化 `mat4` 矩阵的语法按列加载值。前四个值放入第一列，接下来的四个放入下一列，依此类推，如下例所示：\n\
  \n![image](img/pg56.jpg)\n\n它构建了图 3.3 中之前描述的平移矩阵。\n\n程序 3.1 包含了五个用于构建 4x4 平移、旋转和缩放矩阵的\
  \ GLSL 函数，每个函数对应本章之前给出的公式。我们将在书的后部分使用其中一些函数。\n\n***程序 3.1 在 GLSL 中构建变换矩阵***\n\n\
  ![image](img/prog3_1.jpg)\n\n## 补充说明\n\n在本章中，我们看到了将矩阵变换应用于点的示例。稍后，我们还希望将这些相同的变换应用于向量。为了对向量完成等同于应用矩阵\
  \ $M$ 的变换，通常情况下需要计算 $M$ 的*逆转置*，记为 $(M^{-1})^T$，并用它乘以向量。在某些情况下，$M=(M^{-1})^T$，在这些情况下可以使用\
  \ $M$。例如，我们在本章中看到的旋转矩阵与其逆转置相等，可以直接应用于。\n\n我们在本章还没有讨论过平滑移动相机的技术。这非常有用，特别是对于游戏和 CG\
  \ 电影，用于虚拟现实和 3D 建模。执行此操作的代码被称为相机控制器，实现简单控制器的细节在附录 D 中描述。关于该主题也有许多在线资源 [15]。\n\n\
  我们没有包含所介绍矩阵变换的完整推导（可以在 [FV95] 等资源中找到），而是对进行 3D 图形编程所需的点、向量和矩阵操作进行了简洁总结。随着内容的进行，我们将遇到这些方法的实际应用。\n\
