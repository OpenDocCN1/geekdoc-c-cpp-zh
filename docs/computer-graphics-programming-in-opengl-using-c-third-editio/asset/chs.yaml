  \n# 第 18 章\n\n## 针对 3D 眼和 VR 头显设备的立体视觉\n\n18.1 双眼的视图与投影矩阵\n\n18.2 眼色渲染\n\n18.3 并排渲染\n\
  \n18.4 修正头显透镜畸变\n\n18.5 简单的测试硬件配置\n\n*补充注释\n\n![image](img/common.jpg)\n\n整本教科都是关于\
  \ 3D 渲染的。然而，“3D”是一个多义术。我们一直用它来表示使用 3D 透视来显示场景，以便我们能够真实地感知物体在所在位置及其相对大小。然而，“3D” 也可以意味着通过双目机制查看场景，这种机制创造了更完整的深度幻觉，通常被称为立体视觉（stereoscopy）。例如，你可能在电影院见过这种技术，观众被分发了特殊的眼镜来观看“3D”电影。\n\
  \n（注：原文中存在大量重复的段落，根据要求已进行去重，仅翻译一次。）\n\n\n\n\n在本章中，我们将介绍使用两种技术在 `OpenGL` 中生成 3D 立体图像的基础知识：(1)\
  \ 扫蓝法（anaglyph），以及 (2) 并排显示（side-by-side）。在这两种情况下，我们首先都需要学习一些关于视图矩阵和投影矩阵的基础知识，以便正确地为每只眼睛生成独立的图像。\n\
  \n## 18.1 双眼的视图矩阵和投影矩阵\n\n人类双眼如何汇聚在特定物体上并让我们感知其与我们之间的距离（“立体视觉”或“深度感知”）的科学是非常复杂的\
  \ [WSS]，且完整的讨论超出了本书的范畴。我们的实现将仅限于包含最基本的元素。\n\n让我们考虑每只眼睛的视点。虽然我们的眼睛靠得很近，但它们处于空间中不同的点。一种常用方法是确定一个合适的瞳距（“IOD”），即双眼瞳孔之间的距离。测量这个距离（例如毫米或英寸）是一件简单的事，但这种现实距离测量值（如毫米）与我们渲染场景中使用的轴单位（即\
  \ `X`、`Y` 和 `Z` 轴上“1”、“2”等的含义）之间的关系完全取决于应用程序。商业应用（如视频游戏或电影）需要确保为应用领域选择的 `IOD` 值正确对应于人类的平均\
  \ `IOD`（约 65 毫米），甚至可能需要允许用户调整自己的 `IOD`。在我们的应用程序中，我们将定义一个名为 `IOD` 的变量，并简单地通过尝试决定一个产生良好结果的值。\n\
  \n我们将每只眼睛的位置确定为相机位置偏移半个瞳距后的位置。偏移计算还包括应用到相机上的任何旋转。在本章的示例中，相机固定在位置 (cameraX, cameraY,\
  \ cameraZ) 并面向负 `Z` 轴。因此，在这些情况下，在忽略旋转的情况下，眼睛的位置简单地为 `(cameraX ± IOD/2.0, cameraY,\
  \ cameraZ)`，计算每只眼睛相应视图矩阵的其余计算保持不变。\n\n推导出准确的透视投影矩阵是复杂的 [N10]，尽管实现它们非常简单。虽然仅使用用于相机的标准透视矩阵就可以获得不错的结果，但这可能在边缘产生不理想的效果，即只有一只眼睛能看到的远端区域。图\
  \ 18.3 显示了应用于双眼的视锥体，首先使用标准透视变换，然后使用略微修改的透视变换，允许两只眼睛在面向前方的同时具有相同的距离视野。第二种方法产生更好的结果，但需要为非对称视锥体创建透视矩阵。`GLM`\
  \ 提供了一个名为 `glm::frustum()` 的函数，可以给定投影平面的上、下、左、右边界来构建此类矩阵。各种此类矩阵的推导可以在 [S16] 中找到。\n\
  \n![](img/Fig18_03.jpg)\n\n图 18.3\n\n用于立体透视矩阵的标准和非对称视锥体。\n\n在给定已使用的视场角、横横比以及近远裁剪面的情况下，可以通过一些几何知识来完成非对称情况下的投影平面边界查找。图\
  \ 18.4 定义了一个执行此操作的 `OpenGL/C++` 函数 `computePerspectiveMatrix()`。参数 `leftRight` 对左眼设置为\
  \ `-1`，对右眼设置为 `+1`。出于效率考虑，所有其他变量都是全局分配的（如前）。结果位于变量 `pMat` 中。\n\n![](img/Fig18_04.jpg)\n\
  \n图 18.4\n\n用于计算非对称透视矩阵的 C++/OpenGL 函数。\n\n## 18.2 扫蓝法渲染\n\n渲染一个用于红蓝或红青眼镜观看的场景扫蓝法“3D”版本，基本上与我们一直所做的相同，区别在于我们需要渲染两次场景，一次针对左眼，一次针对右眼。这些渲染中的一个使用\
  \ RGB 调色板的红色部分（“红色通道”），另一个则渲染绿色和蓝色通道（在 RGB 色彩空间中组合绿色和蓝色产生青色）。两次渲染还各自采用自己的视图矩阵和透视矩阵。通过红青眼镜观看时，大脑会将这两幅图像融合成单个\
  \ 3D 场景。步骤概述如下：\n\n1. 清除深度和颜色缓冲区。\n2. 设置 `OpenGL` 颜色掩码以仅启用红色通道。\n3. 调用 `display()`\
  \ 渲染场景，使用左眼的视图矩阵和透视矩阵。\n4. 清除深度缓冲区（但不清除颜色缓冲区）。5. 设置 `OpenGL` 颜色掩码以仅启用绿色和蓝色通道。\n\
  6. 调用 `display()` 渲染场景，使用右眼的视图矩阵和透视矩阵。\n\n上述步骤在 `main()` 的渲染循环中发生，方式与我们贯穿本书的做法类似。注意步骤\
  \ #2 和 #5 —— `OpenGL` 提供了 `glColorMask()` 命令，这非常方便，它可用于限制写入颜色缓冲区的颜色通道。\n\n我们使用第\
  \ 14.1 节中的“雾”示例来说明扫蓝法渲染（场景持续旋转，此特定图像捕捉的时间点与图 14.2 中之前显示的不同）。虽然可以使用之前章节中的任何示例，但我们选择了一个包含雾的场景，因为引入遮挡物体的方法可以进一步增强\
  \ 3D 体验。程序 18.1 显示了 14.1 的更改和添加。解释位于代码之后。\n\n![](img/pg506.jpg)\n\n![](img/pg507.jpg)\n\
  \n对程序 14.1 的修改非常少。瞳距设置为 0.01，这是根据 18.1 节所述通过尝试得出的。注意 `main()` 中的渲染循环现在调用两次 `display()`，并带有一个额外参数\
  \ `leftRight`，其设置为 -1 和 +1，分别对应左眼和右眼。`display()` 函数随后使用此值将构建视图矩阵的相机位置向左或向右偏移半个瞳距。\n\
  \n程序 18.1 的输出所示图 18.5。注意输出包含了“雾”示例的两次渲染，一个是红色的，另一个是青色的，在水平方向略有偏移。通过红青眼镜查看此图可以看到生成的\
  \ 3D 立体效果。\n\n![](img/Fig18_05.jpg)\n\n图 18.5\n\n程序 18.1 的扫蓝法渲染，雾示例。\n\n（通过红青 3D\
  \ 眼镜效果）。\n\n## 18.3 并排渲染\n\n现在我们已经知道了如何使用非对称透视矩阵渲染合适的左右眼图像，让我们调整这些技术，为“雾”示例生成并排立体对。\n\
  \n如果我们需要的只是用于立体视镜或 View-Master® 等设备的矩形图像，那么解决方案是直观的。我们只需使用 `OpenGL` 的 `glViewport()`\
  \ 函数为每个图像指定屏幕的不同区域（视口），然后调用两次 `display()`，每个视口一次。程序 18.2 显示了对程序 14.1 的更改。解释位于代码之后。\n\
  \n![](img/pg509.jpg)\n\n\n\n\n`glViewport()` 函数用于指定用于渲染的屏幕区域（或“视口”）。它接受四个参数；前两个参数指定视口左下角的屏幕\
  \ `X` 和 `Y` 坐标，后两个参数指定视口区域的宽度和高度（单位为像素）。我们定义了变量 `sizeX` 和 `sizeY`，其值是现代笔记本电脑屏幕的常用尺寸。它们应该设置为与所使用的机器相匹配。然后，我们使用这些值将屏幕一分为二，每只眼睛占据一边。输出结果显示在图\
  \ 18.6 中。在这个示例中，我们还将清色颜色设置为迷雾的颜色，就像我们在程序 18.1 中做的那样。\n\n对比图 18.5 和图 18.6，可以明显看出\
  \ 18.6 中的图像被水平压缩了。由于每个图像的渲染空间只有屏幕宽度的一半，应用程序需要考虑到这一点，通过改变视野或纵横比来实现。我们在在这个简单的示例中忽略了这一点。\n\
  \n![](img/Fig18_06.jpg)\n\n图 18.6\n\n程序 18.2 迷雾示例的并排渲染（通过立体头显查看效果最佳）。\n\n## 18.4\
  \ 修正头戴设备中的镜片畸变\n\n查看并排图像的头戴设备使用大视野镜片，这些镜片通常存在镜片畸变。镜片中两种重要的畸变是桶形畸变（直线向外凸起）和枕形畸变（直线向内收缩）。图\
  \ 18.7 显示了一个简单的网格，然后是同一个网格经过枕形畸变和桶形畸变后的效果。\n\n![](img/Fig18_07.jpg)\n\n图 18.7\n\n\
  简单网格（左侧），以及具有枕形（中间）和桶形（右侧）畸变的相同网格。\n\n绝大多数头戴设备使用存在枕形畸变的大视野镜片。例如，考虑流行的立体头戴设备 Google\
  \ Cardboard® [GC23]，用户将手机放入一个包含了一对镜片的纸板框内。如果手机显示的是并排立体图像，则可以通过 Google Cardboard\
  \ 以 3D 效果查看。图 18.8 显示了一个 Google Cardboard 头戴设备，以及来自图 18.7 中最左侧的网格，但实际上是透过 Google\
  \ Cardboard 的其中一个镜片拍摄的。可以可以清楚地观察到枕形畸变。\n\n由于头戴设备倾向于使用产生枕形畸变的镜片，针对虚拟现实头戴设备的应用程序通常会尝试预测枕形畸变，并通过应用反向畸变（具体为桶形畸变）来修正它。由于不同的头戴设备镜片具有不同的属性，这种畸变修正理想情况下应该是针对不同设备可调优的。\n\
  \n![](img/Fig18_08.jpg)\n\n图 18.8\n\nGoogle Cardboard® 头戴设备，以及通过其其中一个镜片看到的简单网格，呈现出枕形畸变。\n\
  \n测量和修正镜片畸变是复杂的，完全的研究超出了本书的范围。相反，我们将讨论一个典型示例的步骤。具体来说，我们对迷雾示例应用了桶形畸变修正，并针对 Google\
  \ Cardboard 头戴设备进行了粗略调整。在此过程中，我们指出了一些可调优的参数。更彻底的内容可以在网上找到，例如 [BS16]。\n\n对渲染的场景应用畸变修正可以通过多种方式实现。最有效的方法之一称为顶点位移，其中场景中的每个元素在渲染时都会在其顶点上应用所需的畸变修正\
  \ [BS16]。为了简单起见，我们使用了一种更容易但效率较低的基于片段着色器的方法。步骤如下：\n\n1. 从左眼的视角将整个场景渲染到帧缓冲区纹理。\n2.\
  \ 使用该纹理将矩形区域渲染到屏幕的左半（片段着色器在此步骤中应用桶形畸变）。\n3. 对右眼重复此过程到屏幕右半。\n\n我们已经研究过如何将场景渲染到帧缓冲区纹理，例如在学习阴影时。我们刚刚学会了如何使用\
  \ `glViewport()` 渲染到屏幕的左右半部分。现在我们需要学习如何获取一个帧缓冲区纹理并在渲染时扭曲其包含的图像。\n\n渲染（并纹理化）一个矩形对象应该是件简单的事，使用由两个三角形组成的六个顶点即可。应用相应的纹理通常会在片段着色器中使用\
  \ `texture()` 函数完成，该函数需要 `X` 和 `Y` 纹理坐标参数。由于我们的矩形填充了整个视口，只需通过将纹理坐标缩放到视口尺寸，即可实现无畸变的渲染，例如：\n\
  \n```\nfragColor = texture(gl_FragCoord.x / (sizeX/2), gl_FragCoord.y / sizeY);\n\
  ```\n\n相反，我们需要修改 `X` 和 `Y` 纹理查找值，以便它们访问不同的像素元素（texel），具体来说就是如果纹理是桶形畸变的，那么位于位置 (X,Y)\
  \ 处的那个像素元素。桶形畸变的数学推导可以追溯到 100 多年前（最初由 Conrady [C19] 提出，并由 Brown [B66] 进一步完善）。一个\
  \ VR 系统中常用的简化模型（来自 [W20]）如下：\n\n![](img/Image856.jpg)\n\n![](img/Image165.jpg)\n\
  \n其中 `(d,d)` 是原始（畸变的）纹理位置，`(u,u)` 是无畸变（修正后的）场景对应的纹理坐标，`r` 是从 `(d,d)` 到中心的直线距离，`K1`\
  \ 和 `K2` 是取决于查看设备的调节常量。Google Cardboard 的常用值为 `K1=-0.55`，`K2=0.34`。对于 `r`，我们使用勾股定理计算距离，然后通过尝试得到有效的结果。从现在开始，我们将这种桶形畸变称为镜片修正。\n\
  \n程序 18.3 显示了对程序 18.2 的修改，以便针对 Google Cardboard 粗略调整并渲染每个半屏幕。注意，现有的着色器（未更改）现在渲染到帧缓冲区，并添加了新的第二组着色器来对这些帧缓冲区进行最终的镜片修正。代码之后有额外的讨论。输出结果随后显示在图\
  \ 18.9 中。\n\n![](img/pg513.jpg)\n\n![](img/pg514.jpg)\n\n![](img/pg515.jpg)\n\n\
  ![](img/pg516.jpg)\n\n![](img/pg517.jpg)\n\n在程序 18.3 中，特别是 C++/OpenGL 应用程序，帧缓冲区纹理的设置（即设置\
  \ `leftRightBuffer` 及其名为 `leftRightTexture` 的关联纹理）与程序 15.3 中的“水”示例相同。在那里，缓冲区被用于存储反射（后来使用了另一个来存储折射）。在这里，它被用于存储整个场景，尺寸与半屏幕窗口视口相同。其余的大部分\
  \ C++ 代码保持不变，包括渲染场景的 `display()` 函数。`main()` 函数进行了扩展，以管理启用两个帧缓冲区（屏幕缓冲区或 `leftRightBuffer`）的激活状态。\n\
  \n\n\n实际的畸变校正发生在 `distCorrectionProgram` 的片段色器中。GLSL 着色器代码实现了：（1) 渲染位置到半视口中心距离的计算，(2)\
  \ 镜头畸变校正计算以及 (3) 在 `leftRightTexture` 中最终的纹理查找。\n\n![](img/Fig18_09.jpg)\n\n图 18.9\n\
  \n`Program 18.3` 带有镜头畸变校正的左右分渲染（通过立体头设备查看效果最佳）。\n\n## 18.5 一种简单的测试硬件配置\n\n如今有许多方法可以查看如\
  \ `Program 18.3` 渲染的左右分场景。虽然现代头设备可能很贵，但作者在准备本章示例时使用的一种简单方法是利用以下技术组合：\n\n• 一部连接到电脑的现代手机（如\
  \ Android 或 iPhone）\n• `WiredXDisplay` [WX20]（手机应用），它可以将电脑屏幕镜像到手机上\n• `Google Cardboard`\
  \ [GC20]，用于分屏格式查看手机显示内容\n\n对于已经拥有智能手机的读者，上述方案的总成本低于 20 美元。手机可以通过 USB 线连接到电脑。`WiredXDisplay`\
  \ 应用程序将电脑屏幕的内容传输到手机，本质上是将手机变成了电脑显示器。然后将手机放入 `Google Cardboard` 头设备中，该设备假设屏幕的左半用于左眼，右半用于右眼。图\
  \ 18.10 显示了用于 `Program 18.3` 的这种配置。\n\n![](img/Fig18_10.jpg)\n\n图 18.10\n\n使用 `Google\
  \ Cardboard` 的 `Program 18.3` 左右分输出。\n\n测试红蓝示例（如 `Program 18.1` 中的示例）的硬件要简单得多。我们只需要使用网上购买的廉价红蓝眼镜即可。\n\
  \n## 补充说明\n\n本章描述的立体技术仅是一个非常基础的介绍。电影院及 VR 游戏应用的专业系统通常使用更复杂的模型，并针对使用的硬件进行了更精细的调。我们还忽略了一些重要的相关主题，例如用于深度渲染的视网膜模糊，这些在完全专业的部署中会被包含进去的。尽管如此，使用这里展示的简单方法来体验书中各个示例的完整\
  \ 3D 深度感知，仍然是非常有趣的。\n\n在少数情况下，存在一些障碍。书中的某些示例为了各种目的使用了自定义帧缓冲区或渲染到纹理（例如构建阴影、生成水效果或进行光线追踪）。在这种情况下，需要进一步修改\
  \ C++ 代码来管理缓冲区。这在 第 15 章 的水示例中尤为复杂，因为反射和折射缓冲区很大程度上是估计的，在不修改的情况下无法在双眼之间进行准确分割。\n\n\
  我们选择“雾”示例进行渲染，是因为“雾”进一步增强了立体效果，而且是因为该示例没有受到红蓝立体法查看色彩限制的太大影响。书中其他一些示例的颜色在红蓝立体法下查看效果可能没那么好。\n\
  \n读者可能注意到我们的左右分渲染在水平方向上被“压缩”了。为了保持代码尽可能简单，我们没有进行校正。更完整的解决方案还会校正视锥体，使得横比不至于发生剧烈变化。因此，左右分查看的一个缺点是渲染场景时损失了一半的屏幕“可用空间”。\n\
  \n关于校正镜头畸变的顶点偏移方法的细节（该方法的性能优于本章介绍的简单基于片段色器的方法），可以在 [K16] 中找到。\n\n尽管我们展示了应用于虚拟现实系统的基础立体渲染（及查看）方法，但仍有大量的\
  \ VR 主题是我们未讨论过的。一个完整的 VR 系统不仅以立体 3D 显示，还包含了使用户能够更自然地移动和交互的传感器，例如通过转头或伸手。我们只关注图形部分。\n\
  \n本章也没有讨论如何为偏振或快门技术进行渲染（尽管在章开头简要提过）。那些技术需要更专业的硬件，其解决方案超出了本介绍的范围。\n\n## 练习\n\n18.1\
  \ 修改 `Program 18.1` 以尝试 `IOD` 的多种不同值。你认为什么范围的值对此场景效果最好？如果 `IOD` 设置得太小会发生什么？随着 `IOD`\
  \ 增加你观察到了什么，当 `IOD` 设置得太大时又发生了什么？\n\n18.2 将 `Program 4.2`（特别是带有 100,000 个立方体的修改版本）转换为红蓝立体和左右分立体渲染。\n\
  \n18.3 将 `Program 12.5`（细分化的月球表面）转换为红蓝立体和左右分立体渲染。制作相机动画，使其紧贴并掠过月球表面。\n\n## 参考文献\n\
  \n- [B66] D. Brown (1966), Decentering Distortion of Lenses, Photogrammetric Engineering\
  \ 32 (3).\n- [BS16] B. Smus (2016), Three Approaches to VR Lens Distortion. Blog\
  \ entry, access 于 2016 年 11 月。\n\n\n\n红蓝法和偏振技术被称为“被动”技术，因为眼镜除了过滤颜色等操作外，不需要进行任何物理操作。相比之下，快门眼镜需要与投影图像同步地动态打开和关闭，因此被称为“主动”技术。\n\
  \n# 附录 A：PC (Windows) 的安装与设置\n\n## A.1 安装库和开发环境\n## A.2 在 Visual Studio 中开发和部署 OpenGL\
  \ 项目\n## A.3 部署独立应用程序\n\n![image](img/common.jpg)\n\n如[第 1 章]所述，为了在你的机器上使用 OpenGL\
  \ 和 C++，必须完成许多安装和设置步骤。这些步骤取决于你想要使用的平台。书中的代码示例设计为在 PC (Windows) 上按原样运行。本附录为 Windows\
  \ 平台提供了设置说明。由于库和工具更新频繁，这些步骤可能会过时。\n\n## A.1 安装库和开发环境\n\n### A.1.1 安装开发环境\n\n由于我们在整本书中将实现多个项目，且\
  \ OpenGL 中有许多库需要协调，因此以这种方式设置你的 C++ 开发环境，以尽可能地减少每个新项目所需的配置步骤，将是非常有用的。在这里，我们假设正在使用\
  \ Visual Studio Community 2022 [VS22]。其他 IDE 也可以采用类似的步骤。如果你是第一次安装 Visual Studio，请选择“使用\
  \ C++ 的桌面开发”选项。\n\n第一步是在你的机器上下载并安装 Visual Studio 2022。完成后，我们的方法是尽可能在同一个共享位置安装尽可能多的必要库，然后创建一个\
  \ Visual Studio 自定义模板，这样你创建的每个新项目都将包含所需的库和依赖项，而无需每次都重新定义。我们将在 A.2.1 节中描述如何创建此类模板。\n\
  \n提个警告——Visual Studio 非常庞大。标准安装可能接近 10 Gb。\n\n### A.1.2 安装 OpenGL / GLSL\n\n没有必要“安装”OpenGL\
  \ 或 GLSL，但有必要确保你的显卡至少支持 OpenGL 4.3 版本。如果你不知道你的机器支持什么种版本的 OpenGL，可以使用各种免费应用程序（如 GLview\
  \ [GV23]）之一来查询。\n\n### A.1.3 准备 GLFW\n\n[第 1 章]提供了窗口管理库 GLFW 的概述。如该章节所示，GLFW 需要为运行它的机器进行编译。（注意，虽然\
  \ GLFW 网站包含了下载预编译二进制文件的选项，但这些文件通常无法正常工作。）编译 GLFW 需要先下载并安装 `CMAKE`（可在 https://cmake.org\
  \ [CM23] 获取）。编译 GLFW 的步骤相对简单：\n\n1. 下载 GLFW 源代码 (www.glfw.org) [GF20]。解压并将文件夹移动到合适的位置。我们在“Documents”文件夹下创建了一个名为“OpenGL_library_installation”的文件夹（如果你喜欢，也可以选择不同的位置）。我们还创建了“download”和“build”子文件夹。我们将解压后的\
  \ GLFW 文件夹复制到“Download”文件夹中。\n2. 下载并安装 `CMAKE` (https://cmake.org) [CM23]。安装过程中，勾选“add\
  \ to system path”复选框。\n3. 运行 `CMAKE` 并输入 GLFW 源码位置和所需的构建文件夹。\n    - 指定源码为下载的 GLFW\
  \ 文件夹。\n    - 指定构建文件夹为你在第 1 步中创建的“build”文件夹。\n4. 点击“configure”。如果你正确安装了 Visual Studio，它应该默认使用它。如果某些选项显示为红色，再次点击“configure”。\n\
  5. 点击“generate”。\n\n`CMAKE` 在“build”文件夹中生成多个文件。该文件夹中的一个文件名为 `GLFW.sln`。这是一个 Visual\
  \ Studio 项目文件。打开它（使用 Visual Studio），并编译（生成）GLFW 为 64 位应用程序。如果这是首次在该台机器上运行 Visual\
  \ Studio，可能需要选择“C++”配置。顶部的框应显示 `x64`。然后从“Build”菜单下选择“Build Solution”。\n\n生成的构建产产生你需要的两个项目：\n\
  - `glfw3.lib` 文件，位于 src ► debug 文件夹中。\n- `GLFW` 文件夹，位于原始下载的 GLFW 源码的“include”文件夹下。它包含了两个你将使用的头文件。\n\
  \n### A.1.4 准备 GLEW\n\n在[第 1 章]提供了 GLEW “扩展装配器”库的概述。从 glew.sourceforge.net [GE17]\
  \ 下载 64 位二进制文件。你特别需要获取的项目如下：\n- `glew32.lib`（在 lib ► release ► x64 文件夹中）——名称包含“32”，但目前这些仍然是\
  \ 64 位安装的正确文件。\n- `glew32.dll`（在 bin ► release ► x64 文件夹中）\n- `GLFW` 文件夹，位于“include”文件夹中。\n\
  \n### A.1.5 准备 GLM\n\n在[第 1 章]提供了数学库 GLM 的概述。访问 github.com/truc/glm [GM23] 并下载最新版本。解压后的文件夹包含一个名为\
  \ `glm` 的文件夹。在该文件夹内部是另一个名为 `glm` 的文件夹。这个文件夹就是你需要的。\n\n### A.1.6 准备 SOIL2\n\n[第 1\
  \ 章]提供了图像加载库 SOIL2 的概述。安装 SOIL2 [23] 需要利用位于 premake.io [PM23] 的 `premake` 工具。虽然过程涉及多个步骤，但它们相对简单：\n\
  \n1. 下载并解压 `premake`。我们将使用的文件是 `premake.exe`。\n2. 从 github.com/SpartanJ 下载 SOIL2\
  \ 源码包并解压。\n3. 将 `premake.exe` 文件复制到 SOIL2 文件夹中。\n4. 打开命令行窗口，导航到 SOIL2 文件夹，并输入：\n\
  ```premake vs2022\n```\n它应该显示生成的文件。\n5. 在 SOIL2 文件夹中，打开“make”文件夹，然后进入“windows”文件夹。双击\
  \ `SOIL2.sln`。\n6. 确认顶部下拉框显示为 `x64`（而不是 `x86`）；然后在左侧面板中右键点击 `soil2-static` 并选择“build。”\n\
  7. 关闭 Visual Studio 并回到 SOIL2 文件夹。你会注意到两个新文件夹：`lib` 和 `obj`。\n\n### A.1.7 准备共享“lib”和“include”文件夹\n\
  \n选择你想存放库文件的位置。可以是你喜欢的任何地方；例如，你可以创建一个 `C:\\OpenGLlibraries` 文件夹。在该文件夹内部创建名为 `lib`\
  \ 和 `include` 的子文件夹。\n\n- 在 `lib` 文件夹中放置 `glew32.lib` 和 `glfw3.lib`。\n- 在 `include`\
  \ 文件夹中放置之前提到的 GL、GLFW 和 glm 文件夹。\n- 回到 SOIL2 文件夹，进入其内部的 `lib►windows` 文件夹。将 `soil2-debug.lib`\
  \ 文件复制到 `lib` 文件夹（`glew32.lib` 和 `glfw3.lib` 所在）。\n- 回到 SOIL2 文件夹，进入 `src` 文件夹。将\
  \ `SOIL2` 文件夹复制到 `include` 文件夹中（GL、GLFW 和 glm 所在）。此 `SOIL2` 文件夹包含了 SOIL2 的 `.c`\
  \ 和 `.h` 文件。\n\n![](img/figA_01.jpg)\n\n图 A.1\n建议的库文件夹结构\n\n\n\n\n• 你可能发现将 `glew32.dll`\
  \ 文件也放在此 `OpenGLtemplate` 文件夹中很有用，这样你就能知道在哪里找到它了，尽管这并不是严格必要的。\n\n完整的文件夹结构如图 A.1\
  \ 所示。\n\n# A.2 在 VISUAL STUDIO 中开发和部署 OpenGL 项目\n\n## A.2.1 创建 Visual Studio 自定义项目模板\n\
  \n由于我们在 C++/OpenGL 程序中使用了许多特殊用途的库，创建一个 Visual Studio 模板将使启动新的 OpenGL 项目变得简单易许多。本节将描述创建和使用该模板的步骤。\n\
  \n 启动 Visual Studio（我们假设它是 2022 的“Community”版）。创建一个新的空 C++ 项目（该项目的名称和位置并不重要——使用默认位置即可）。在顶部正中央，菜单栏下方，有两个并列的下拉菜单：\n\
  \n• 右侧的菜单允许你指定 `x86` 或 `x64` —— 请选择 `x64`。\n• 左侧的菜单允许你指定是在 `debug` 模式还是 `release`\
  \ 模式下进行编译。**两种**模式都需要执行以下几个步骤。也就是说，应该先在 `debug` 模式下完成，然后在 `release` 模式下重复一遍。\n\n\
  在 `debug` 模式下（以及随后的 `release` 模式下），进入 `project properties`（项目属性）并进行以下更改：\n\n• 在\
  \ `VC++ Directories`（可能显示为 `C/C++`）下，进入 `General`，然后在 `Include Directories` 下，添加你之前创建的\
  \ `include` 文件夹。\n• 在 `linker` 下有两个更改需要进行：\n    o 点击 `General`，然后在 `Additional Library\
  \ Directories` 下，添加你之前创建的 `lib` 文件夹。\n    o 点击 `Input`，然后在 `Additional Dependencies`\
  \ 下，添加以下文件名：`glfw3.lib`、`glew32.lib`、`soil2-debug.lib` 和 `opengl32.lib`（最后一个应该作为标准\
  \ Windows SDK 的一部分已可用）。用分号将这四个文件名分开。\n\n在对项目属性完成上述更改后，针对 `debug` 和 `release` 两种模式，你都准备好创建模板。这通过进入\
  \ `Project` 菜单并选择 `Export template`（导出模板）完成。选择这是一个 `project` 模板，并给模板一个实用的名称，例如 `OpenGL\
  \ project`。完成后后，你可以关闭 Visual Studio。\n\n## A.2.2 使用自定义项目模板\n\n一旦安装了库并准备好了自定义模板，创建一个新的\
  \ OpenGL C++ 项目就很简单：\n\n1. 启动 Visual Studio，点击“Create a new project”（创建新项目）。\n2.\
  \ 选择你的 OpenGL 模板，然后点击“Next”（下一步）。注意 ——当你第一次尝试使用该模板时，可能需要使用提供的搜索工具搜索它。\n3. 为你的项目命名，选择项目位置，然后点击“Create”（创建）。\n\
  4. 使用顶部的下拉框从 `x86` 切换到 `x64`（如有必要）。\n5. 回 Windows，导航到 Visual Studio 创建的与你新建项目名称匹配的文件夹。\n\
  6. 将组成应用程序的所有文件复制到子文件夹中。这包括应用程序使用的任何 `.cpp` 源文件、`.h` 头文件、`.glsl` 着色器文件、纹理图像文件以及\
  \ `.obj` 3D 模型文件。没有必要指定已构建到模板中的头文件。\n7. 同样将 `glew32.dll` 文件复制到同一个子文件夹中。\n8. 在解决方案管理器中（可能在左侧或右侧），右键点击\
  \ `Source Files` 并选择 `Add►Existing item` 以加载你的 `main.cpp` 文件。对其他 `.cpp` 文件重复此过程。\n\
  9. 同样在解决方案管理器中，右键点击 `Header Files` 并选择 `Add►Existing item` 以加载应用程序中的任何头文件（`.h` 文件）。\n\
  10. 你现在已准备好构建并执行你的程序了。\n\n# A.3 部署独立应用程序\n\n在对应用程序进行开发、测试和调试后，可以通过在 `Release` 模式下构建项目，并将以下文件放在同一个文件夹中，将其部署为独立执行文件：\n\
  \n•构建项目生成的 `.exe` 文件\n•应用程序使用的所有着色器文件\n•应用程序使用的所有纹理图像和模型文件\n• `glew32.dll`\n\n构建文件夹后，通过双击\
  \ `.exe` 文件即可运行应用程序。\n\n## 参考文献\n\n[CM23] CMake 首页，访问于 2023 年 11 月，[`cmake.org`](https://cmake.org)\n\
