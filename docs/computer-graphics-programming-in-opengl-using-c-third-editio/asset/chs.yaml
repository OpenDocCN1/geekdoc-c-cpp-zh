  5.1 加载纹理图像\n\n5.2 纹理坐标\n\n5.3 创建纹理对象\n\n5.4 构造纹理坐标\n\n5.5 将纹理坐标加载到缓冲区\n\n5.6 在着色器中使用纹理：采样器与纹理单元\n\
  \n5.7 纹理映射：示例程序\n\n5.8 多级纹理图\n\n5.9 各向异性过滤\n\n5.10 环绕与平铺\n\n5.11 透视畸变\n\n5.12 纹理——额外的\
  \ OpenGL 细节\n\n## 5.1 加载纹理图像\n\n为了在 OpenGL 中高效完成纹理映射，需要协调多个数据集和机制：\n\n•一个存储纹理图像的`texture\
  \ object`（在本章中我们考虑 2D 图像）\n\n•一个特殊的统一 `sampler` 变量，以便顶点着色器可以访问纹理\n\n•一个存储`纹理坐标`的缓冲区\n\
  \n•一个用于向下游传递纹理坐标的顶点属性\n\n•一个显卡上的`texture unit`\n\n\n\n\n纹理图像可以是任何图像。它可以是人造或自然存在的物体，如布料、草地或行星表面；或者，它可以是一个几何图案，例如图\
  \ 5.1 中的棋盘格。在视频游戏和动画电影中，纹理图像通常用于为角色绘制面部和衣服，或为图 5.1 中的海豚等生物绘制皮肤。\n\n图像通常存储在图像文件中，例如\
  \ `.jpg`、`.png`、`.gif` 或 `.tiff`。为了让 OpenGL 流线中的着色器能够使用纹理图像，我们需要从图像中提取颜色并将它们放入 OpenGL\
  \ `texture object`（纹理对象，一种用于存储纹理图像的 OpenGL 内置结构）。\n\n有很多 C++ 库可用于读取和处理图像文件。流行的选择包括\
  \ `Cimg`、`Boost GIL` 和 `Magick++`。我们选择使用专门为 OpenGL 设计的库 `SOIL2` [SO23]，它基于非常流行但现在已过时的库\
  \ `SOIL`。`SOIL2` 的安装步骤见附录 A 和 B。\n\n我们用于将纹理加载到 OpenGL 应用程序的通用步骤为：(a) 使用 `SOIL2`\
  \ 实例化 OpenGL 纹理对象并将从图像文件读取数据到其中；(b) 调用 `glBindTexture()` 使新创建的纹理对象变为激活；(c) 使用 `glTexParameter()`\
  \ 函数调整纹理设置。结果是当前可用的 OpenGL 纹理对象的整数 ID。\n\n对对象进行纹理化从声明 `GLuint` 类型的变量开始。正如我们所看到的，这是用于持有引用\
  \ OpenGL 对象的整数 ID 的 OpenGL 类型。接下来，我们调用 `SOIL_load_OGL_texture()` 来实际生成纹理对象。`SOIL_load_OGL_texture()`\
  \ 函数接受图像文件名作为其参数之一（其他某些参数将在后文中描述）。这些步骤在以下函数实现：\n\n![image](img/pg105.jpg)\n\n我们将经常使用此函数，因此我们将其添加到\
  \ `Utils.cpp` 工具类中。然后，C++ 应用程序只需调用上述的 `loadTexture()` 函数即可创建 OpenGL 纹理对象，如下所示：\n\
  \n```\nGLuint myTexture = Utils::loadTexture(\"image.jpg\");\n```\n\n其中 `image.jpg`\
  \ 是纹理图像文件，`myTexture` 是生成的 OpenGL 纹理对象的整数 ID。支持多种图像文件类型，包括之前列出的类型。\n\n## 5.2 纹理坐标\n\
  \n现在我们有了将纹理图像加载到 OpenGL 的方法，我们需要指定如何将纹理应用到对象的渲染表面。我们通过为模型中的每个顶点指定 `texture coordinates`（纹理坐标）来实现。\n\
  \n纹理坐标是对（通常是 2D）纹理图像中像素的引用。纹理图像中的像素被称为 `texels`（纹素），以区别于在屏幕上渲染的像素。纹理坐标用于将 3D 模型上的点映射到纹理中的位置。模型表面的每个点除了具有置于\
  \ 3D 空间中的 `(x,y,z)` 坐标外，还有纹理坐标 `(s,t)`，用于指定纹理图像中的哪个纹素提供其颜色。因此，对象的表面被纹理图像“绘制”。纹理跨对象表面的方向由纹理坐标到对象顶点的赋值来决定。\n\
  \n为了使用纹理映射，必须为要纹理化的对象的每个顶点提供纹理坐标。OpenGL 将使用这些纹理坐标，通过查找存储在纹理图像引用纹素中的颜色，确定模型中每个光栅化像素的颜色。为了确保渲染模型中的每个像素都用纹理图像中适当纹素绘制，纹理坐标被放入顶点属性中，以便它们也能被光栅化器进行插值。这样，纹理图像就会随着模型顶点一起进行插值或填充。\n\
  \n对于通过顶点着色器的每组顶点坐标 `(x,y,z)`，都将有一组相应的纹理坐标 `(s,t)`。因此，我们将设置两个缓冲区，一个用于顶点（每项包含三个组件\
  \ `x`、`y` 和 `z`），另一个用于相应的纹理坐标（每项包含两个组件 `s` 和 `t`）。因此，每次调用顶点着色器时都会接收一个顶点，该顶点现在包含它的空间坐标和相应的纹理坐标。\n\
  \n纹理坐标通常是 2D 的（OpenGL 支持某些其他维度，但我们不会在本章中介绍它们）。假设图像是矩形的，位置 `(0,0)` 在左下角，`(1,1)` 在右上角。¹因此，纹理坐标的理想值在\
  \ `[0..1]` 范围内。\n\n考虑图 5.2 所示的示例。记住，立方体模型是由三角形构建的。立方体一侧的四个角被突出显示，但请记住需要两个三角形来指定每个方形面。指定这一个立方体面的*六个*顶点中的每一个纹理坐标与四个角列在一起，其中左上角和右下角各由一对顶点组成。图中还显示了纹理图像。纹理坐标（由\
  \ `s` 和 `t` 索引）将图像的部分（纹素）映射到模型正面的光栅化像素上。\n\n![image](img/fig5_2.jpg)\n\n图 5.2 纹理坐标。\n\
  \n## 5.3 创建纹理对象\n\n假设这里的图像存储在名为“brick1.jpg”的文件中 [LU16]。\n\n![image](img/fig108.jpg)\n\
  \n如前，我们可以通过调用我们的 `loadTexture()` 函数来加载此图像，如下所示：\n\n```\nGLuint brickTexture = Utils::loadTexture(\"\
  brick1.jpg\");\n```\n\n记住纹理对象通过整数 ID 标识，因此 `brickTexture` 的类型为 `GLuint`。\n\n## 5.4\
  \ 构建纹理坐标\n\n\n\n\n\n我们的金字塔有四个三角形面和一个正方形底。虽然从几何角度上看，这只需要五个（5）点，但我们一直使用三角形来渲染它。这意味着侧面需要四个三角形，方形底需要两个三角形，总共六个三角形。每个三角形有三个顶点，因此模型中必须指定总共\
  \ `6x3=18` 个顶点。\n\n我们已经在程序 4.3 的浮点数组 `pyramidPositions[]` 中列出了金字塔的几何顶点。我们有许多方法可以设置纹理坐标，以便将砖纹绘制在金字塔上。一种简单（尽管并不完美）的方法是将图像顶部中心对应金字塔的顶点，如下所示：\n\
  \n![image](img/fig109_1.jpg)\n\n我们可以对四个三角形侧面都执行此操作。我们还需要绘制金字塔底部的正方形，它由两个三角形组成。一个简单合理的方法是使用图片中的整个区域对其进行纹理化（金字塔已向后倾斜并侧卧在侧面上）：\n\
  \n![image](img/fig109_2.jpg)\n\n对程序 4.3 中的前九个顶点使用这种简单的策略，相应的顶点和纹理坐标集如图 5.3 所示。\n\
  \n![image](img/fig5_3.jpg)\n\n图 5.3\n\n金字塔的纹理坐标（部分列表）。\n\n## 5.5 将纹理坐标加载到缓冲区\n\n\
  我们可以用与之前加载顶点类似的方式，将纹理坐标加载到 VBO 中。在 `setupVertices()` 中，我们添加了纹理坐标值的如下声明：\n\n![image](img/pg110_1.jpg)\n\
  \n然后，在创建了至少两个 VBO（一个用于顶点，一个用于纹理坐标）之后，我们添加以下代码行将纹理坐标加载到 VBO #1：\n\n```\nglBindBuffer(GL_ARRAY_BUFFER,\
  \ vbo[1]);\nglBufferData(GL_ARRAY_BUFFER, sizeof(pyrTexCoords), pyrTexCoords, GL_STATIC_DRAW);\n\
  ```\n\n## 5.6 在着色器中使用纹理：采样器变量和纹理单元\n\n为了最大化性能，我们希望在硬件中执行纹理化。这意味着我们的片段着色器需要一种方法访问我们在\
  \ C++/OpenGL 应用程序中创建的纹理对象。实现这一点的机制是通过使用一种特殊的 GLSL 工具，称为 `uniform sampler variable`（均匀采样器变量）。这种变量用于指示显卡上的纹理单元从加载的纹理对象中提取或“采样”哪个像素。\n\
  \n在着色器中声明采样器变量很容易——只需将其添加到你的 uniforms 集合中：\n\n```\nlayout (binding=0) uniform sampler2D\
  \ samp;\n```\n\n我们的变量命名为 `samp`。声明中的 `layout (binding=0)` 部分指定该采样器与纹理单元 0 关联。\n\n\
  纹理单元（以及关联的采样器）可以用于采样你想要的任何纹理对象，且这可以在运行时更改。你的 `display()` 函数需要指定在当前帧中让纹理单元采样哪个纹理对象。因此，每当你绘制一个对象时，都需要激活一个纹理单元并将其绑定到特定的纹理对象，例如：\n\
  \n```\nglActiveTexture(GL_TEXTURE0);\nglBindTexture(GL_TEXTURE_2D, brickTexture);\n\
  ```\n\n可用的纹理单元数量取决于显卡提供了多少个。根据 OpenGL API 文档，OpenGL 4.5 版本要求每个着色阶段至少有 16 个单元，所有阶段总计至少\
  \ 80 个单元 [OP23]。在本示例中，我们通过在 `glActiveTexture()` 调用中指定 `GL_TEXTURE0` 激活了第 0 个纹理单元。\n\
  \n要执行纹理化，我们需要修改片段着色器输出颜色的方式。之前，我们的片段着色器要么输出固定颜色，要么从顶点属性获取颜色。这一次，我们需要使用从顶点着色器（通过光栅化器）接收的插值纹理坐标，通过如下调用\
  \ `texture()` 函数来采样纹理对象：\n\n```\nin vec2 tc; //纹理坐标\n// ...\ncolor = texture(samp,\
  \ tc);\n```\n\n## 5.7 纹理映射：示例程序\n\n程序 5.1 将之前的步骤合并到一个程序中。结果显示了带有砖块图像纹理的金字塔，如图 5.4\
  \ 所示。金字塔的模型矩阵中添加了两次旋转（代码列表中未显示），以露出金字塔的底部。\n\n![image](img/fig5_4.jpg)\n\n图 5.4\n\
  \n映射了砖块图像纹理的金字塔。\n\n现在只需通过更改 `loadTexture()` 调用中的文件名，即可按需要将砖纹理替换替换其他纹理图像。例如，如果我们将“brick1.jpg”替换为图像文件“ice.jpg”\
  \ [LU16]，就会得到图 5.5 所示的结果。\n\n![image](img/fig5_5.jpg)\n\n图 5.5\n\n映射了“冰”图像纹理的金字塔。\n\
  \n***程序 5.1 带有砖纹理的金字塔***\n\n![image](img/prog5_1.jpg)\n\n![image](img/prog5_1_1.jpg)\n\
  \n![image](img/prog5_1_2.jpg)\n\n## 5.8 多级映射 (MIPMAPPING)\n\n纹理映射通常会产生各种不良的伪影。这是因为图像分辨率很少与被纹理化的区域匹配。当图像分辨率小于绘制区域时，会出现非常常见的伪影。在这种情况下，图像需要拉伸，导致变得模糊。取决于纹理的性质，有时可以通过不同的分配纹理坐标以减少纹拉伸来解决这个问题。\n\
  \n相反的情况是图像纹理的分辨率大于绘制区域。可能并不清楚为什么这会产生问题，但事实如此！在这种情况下，会出现明显的混叠伪影，产生奇怪的虚假图案。\n\n混叠是由采样错误引起的。它通常与信号处理有关，其中采样不足的信号在重构时显示的属性（如波长）与其实际属性不同。如图\
  \ 5.6 所示的示例。\n\n同样显示了一个带有高分辨率棋盘格图像纹理的立方体顶部的倾斜渲染。\n\n图 5.7 显示了一个带有高分辨率棋盘格图像纹理的立方体顶部的倾斜渲染。\n\
  \n混叠在图像顶部清晰可见，那里对棋盘格的欠采样产生了“条纹状”效果。虽然我们在这里的静态图中无法展示它，但如果这是一个动画场景，这些图案可能会在各种错误的图案（如此所示）之间波动。\n\
  \n\n\n\n另一个示例出现在图 5.8 中，其中立方体使用了月球表面图像进行纹理化[HT23]。一眼看去，这张图像看起来非常清晰且细节丰富。然而，图像右上角的某些细节是错误的，当立方体对象（或相机）移动时，会产生“闪烁”现象。（不幸的是，我们无法在静态图像中清晰地展示闪烁效果。）\n\
  \n![image](img/fig5_8.jpg)\n\n图 5.8\n\n纹理贴中的“闪烁”。\n\n这些以及类似的采样误差伪真可以通过一种称为 `mipmapping`（多级映射）的技术在很大程度上纠正，该技术在不同分辨率下创建不同版本的纹理图像。然后，OpenGL\
  \ 使用与被纹理点分辨率最匹配的纹理图像。更好的是，可以在与被纹理区域分辨率最近的图像之间进行颜色平均。对图 5.7 和图 5.8 中的图像应用多级映射的结果如图\
  \ 5.9 所示。\n\n![image](img/fig5_9.jpg)\n\n图 5.9\n\n多级映射结果。\n\n多级映射的工作原理是通过巧妙的机制，在一个比原始图像大出三分之一的纹理图像中存储一系列逐级降低分辨率的相同图像副本。这是通过将图像的\
  \ R、G、B 分量分别存储在纹理图像空间的四分之一区域来实现的，然后在剩余的四分之一空间内对分辨率为原始分辨率四分之一的相同图像重复该过程。这种细分一直重复，直到剩余的象限小到无法包含任何有用的图像数据为止。示例图像以及生成的\
  \ mipmap 可视化图如图 5.10 所示。\n\n![image](img/fig5_10.jpg)\n\n图 5.10\n\n对图像进行多级映射。\n\n\
  这种将几幅图像挤入很小空间（嗯，只是比存储原始图像所需的空间大一点）的方法就是多级映射（mipmapping）名称的由来。MIP 代表 `Multum In Parvo`\
  \ [WI83]，拉丁语意为“小空间内的大容量”。\n\n在实际对对象进行纹理化时，可以用多种方式对 mipmapmap。在 OpenGL 中，可以通过将 `GL_TEXTURE_MIN_FILTER`\
  \ 参数设置为所需的 `minification`（缩小）技术来选择采样 mipmap 的方式，选项如下：\n\n• `GL_NEAREST_MIPMAP_NEAREST`\n\
  选择与被纹理像素区域分辨率最相似的 mipmap。然后获取离目标纹理坐标最近的纹理元素（texel）。\n\n• `GL_LINEAR_MIPMAP_NEAREST`\n\
  选择与被纹理像素区域分辨率最相似的 mipmap。然后对离纹理坐标最近的四个纹理元素进行插值。这被称为“线性过滤”。\n\n• `GL_NEAREST_MIPMAP_LINEAR`\n\
  选择分辨率与被纹理像素区域最近的两个 mipmap。然后从每个 mipmap 中获取离纹理坐标最近的纹理元素并对其进行插值。这被称为“双线性过滤”。\n\n•\
  \ `GL_LINEAR_MIPMAP_LINEAR`\n选择分辨率与被纹理像素区域最近的两个 mipmap。然后对每个 mipmap 中最近的四个纹理元素进行插值，再对这两个结果进行插值。这被称为“三线性过滤”，并如图\
  \ 5.11 所示。\n\n![image](img/fig5_11.jpg)\n\n图 5.11\n\n三线性过滤。\n\n三线性过滤通常是更好的，因为较低层级的混合往往会产生伪真，例如\
  \ mipmap 级别之间可见的分离。图 5.12 显示了仅开启线性过滤使用多级映射的棋盘格特写。注意圆圈出的伪真处，垂直线在 mipmap 边界处突然从粗变为变细。相比之下，图\
  \ 5.9 中的示例使用了三线性过滤。\n\n![image](img/fig5_12.jpg)\n\n图 5.12\n\n线性过滤伪真。\n\nOpenGL\
  \ 对多级映射提供了非常丰富的支持。提供了机制用于构建自己的 mipmap 级别，或让 OpenGL 为你构建。在大多数情况下，OpenGL 自动构建的 mipmaps\
  \ 就足够了。这是通过在 `Utils::loadTexture()` 函数（在第 5.1 节中描述）中 `getTextureObject()` 函数调用之后添加以下代码行实现的：\n\
  \n```\nglBindTexture(GL_TEXTURE_2D, textureID);\nglTexParameteri(GL_TEXTURE_2D,\
  \ GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);\nglGenerateMipmap(GL_TEXTURE_2D);\n\
  ```\n\n这告诉 OpenGL 生成 mipmaps。通过 `glBindTexture()` 调用激活砖块纹理，然后通过 `glTexParameteri()`\
  \ 函数调用启用之前列出的缩小因子之一，例如上述调用中的 `GL_LINEAR_MIPMAP_LINEAR`，它启用了三线性过滤。\n\n一旦构建了 mipmap，可以用多种方式对其进行采样。在\
  \ OpenGL 中，可以通过将 `GL_TEXTURE_MIN_FILTER` 参数设置为所需的 `minification` 技术来选择采样 mipmap\
  \ 的方式，选项如下：\n\n（此处由于原文逻辑重复，翻译保持一致并省略重复的列表内容）\n\n对于关键应用，可以使用任何偏好的图像软件自行构建 mipmaps，然后在使用\
  \ OpenGL 的 `glTexImage2D()` 创建纹理对象时将其作为 mipmap 级别添加。对这种方法的进一步讨论不在本文范围范围内。\n\n![image](img/pg120.jpg)\n\
  \n`glewIsSupported()` 调用测试显卡是否支持 AF。如果支持，我们使用 `glGetFloatv()` 获取显示的值将其设置为最大采样次数。然后通过\
  \ `glTexParameterf()` 应用于激活的纹理对象。结果如图 5.13 所示。注意图 5.8 中丢失的大部分细节已经恢复，同时仍消除了闪烁伪真。\n\
  \n**5.9 各异性过滤**\n\n多级映射纹理有时看起来比非多级映射纹理更模糊，特别是当纹理对象以倾斜角度渲染时。我们在图 5.9 中看到过这种例子，其中表面倾斜观察者。当\
  \ OpenGL 对多边形进行纹理化时，它选择适用于较小轴（即宽度与高度）的 mipmap，其分辨率对于其宽度来说可能低于要求。\n\n各异性过滤的计算开销比标准多级映射更大，不是\
  \ OpenGL 的必要部分。然而，大多数显卡都支持 AF（这被称为 OpenGL 扩展），并且 OpenGL 确实提供了查询显卡是否支持 AF 的方法，以及在支持时访问\
  \ AF 的方法。\n\n\n\n到目前为止，我们假设纹理坐标都落在 [0..1] 范围内。然而，OpenGL 实际上支持任意值的纹理坐标。对于纹理坐标超出 [0..1]\
  \ 范围时发生的情况，有几种可选方案。可以使用 `glTexParameteri()` 设置所需的行为，其中一些选项如下：\n\n- `GL_REPEAT`：忽略纹理坐标的整数部分，生成重复的或“平铺”图案。这是默认行为。\n\
  - `GL_MIRRORED_REPEAT`：忽略整数部分，不同之处在于当整数部分为奇数时坐标会发生反转，因此重复的图案会在正常和镜像之间交替出现。\n- `GL_CLAMP_TO_EDGE`：小于\
  \ 0 和大于 1 的坐标分别设置为 0 和 1。\n- `GL_CLAMP_TO_BORDER`：[0..1] 之外的纹素元素将被分配某些指定的边界颜色。\n\
  \n例如，考虑一个金字塔，其纹理坐标定义在 [0..5] 范围内，而不是 [0..1] 范围。使用默认行为（`GL_REPEAT`）以及之前图 5.2 中显示的纹理图像，会导致纹理在表面重复五次（有时称为“平铺”），如图\
  \ 5.14 所示：\n\n![image](img/fig5_14.jpg)\n图 5.14\n使用 `GL_REPEAT` 的纹理坐标封装。\n\n为了让瓦的外观在正常和镜像之间交替，我们可以指定如下：\n\
  \n```cpp\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_MIRRORED_REPEAT);\n\
  glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_MIRRORED_REPEAT);\n```\n\n\
  通过将 `GL_MIRRORED_REPEAT` 替换为 `GL_CLAMP_TO_EDGE`可以将小于 0 和大于 1 的值设置为 0 和 1。\n\n指定小于\
  \ 0 和大于 1 的值导致“边界”颜色的方法如下所示：\n\n```cpp\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S,\
  \ GL_CLAMP_TO_BORDER);\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_BORDER);\n\
  float redColor[4] = { 1.0f, 0.0f, 0.0f, 1.0f };\nglTexParameterfv(GL_TEXTURE_2D,\
  \ GL_TEXTURE_BORDER_COLOR, redColor);\n```\n\n这些选项（镜像重复、固定到边缘和固定到边界）在纹理坐标范围从 -2\
  \ 到 +3 时的效果，分别从左到右所示于图 5.15 中。\n\n![image](img/fig5_15.jpg)\n图 5.15\n具有各种封装选项的纹纹金字塔。\n\
  \n在中间的示例（固定到边缘）中，纹理图像边缘的像素向外复制。请注意，作为副作用，金字塔面的左下角和右下角区域分别从纹理图像的左下像素和右下像素获取颜色。\n\n\
  ## 5.11 透视畸变\n\n我们已经看到当纹理坐标从顶点着色器传递到片段着色器时，它们在通过光栅化器时会被插值。我们也看到这是对顶点属性始终执行的自动线性插值的结果。\n\
  \n然而，在纹理坐标的情况下，线性插值会导致具有透视投影的 3D 场景出现明显的畸变。\n\n考虑一个由两个三角形组成、带有棋盘纹理的矩形，面向相机。当矩形绕\
  \ X 轴旋转时，矩形的上半部分远离相机，而下半部分移近相机。因此，我们预计顶部的正方形会变小，底的正方形会变大。然而，纹理坐标的线性插值反而会导致*所有*正方形的高度相等。畸变在定义组成矩形的两个三角形的对角线处被加剧。产生的畸变如图\
  \ 5.16 所示。\n\n幸运的是，有算法可以修正透视畸变，默认情况下，OpenGL 在光栅化期间应用*透视修正*算法 [OP14, SP16]。图 5.17\
  \ 显示了由 OpenGL 正确渲染的相同旋转棋盘。\n\n![image](img/fig5_16.jpg)\n图 5.16\n纹理透视畸变。\n\n![image](img/fig5_17.jpg)\n\
  图 5.17\nOpenGL 透视修正。\n\n虽然并不常见，但在包含纹理坐标的顶点属性声明中添加关键字“noperspective”可以禁用 OpenGL 的透视修正。这必须在顶点和片段着色器中都进行。例如，程序\
  \ 5.1 顶点着色器中的顶点属性声明如下：\n\n```cpp\nnoperspective out vec2 tc;\n```\n\n片段着色器中相应的属性声明为：\n\
  \n```cpp\nnoperspective in vec2 tc;\n```\n\n这种语法实际上被用于生成图 5.16 中的畸变棋盘格。\n\n## 5.12\
  \ 纹理——额外的 OpenGL 细节\n\n我们贯穿本书使用的 SOIL 纹理图像库的优点是使用起来相对简单直观。然而，在学习 OpenGL 时，使用 SOIL2\
  \ 会屏蔽掉用户需要的一些重要的 OpenGL 细节。在本节中，我们将描述在没有纹理加载库的情况下加载和使用纹理所需的某些细节。\n\n可以使用 C++ 和 OpenGL\
  \ 函数直接加载纹理文件数据。虽然这复杂得多，但很常见。通用步骤如下：\n\n1. 使用 C++ 读取图像文件。\n2. 生成 OpenGL 纹理对象。\n3.\
  \ 将图像文件数据拷贝到纹理对象中。\n\n我们不详细描述第一步——有很多方法。一种方法在 [opengl-tutorials.org](http://opengl-tutorials.org)（具体教程页面见\
  \ [OT18]）上有很好的描述，并使用 C++ 函数 `fopen()` 和 `fread()` 将 .bmp 文件读取到 unsigned char 数组中。步骤\
  \ 2 和 3 是通用的，涉及 OpenGL 调用。在步骤 2 中，我们使用 OpenGL `glGenTextures()` 命令创建一个多个纹理对象。例如，生成单个\
  \ OpenGL 纹理对象（带有整数引用 ID）可以如下所示：\n\n![image](img/fig124_1.jpg)\n\n在步骤 3 中，我们使用 OpenGL\
  \ `glTexImage2D()` 命令将步骤 1 中的图像数据与步骤 2 创建的纹理对象相关联。\n\n![image](img/fig124_2.jpg)\n\
  \n此时，在本章早些时候描述的各种 `glTexParameteri()` 调用（用于设置多级滤波等）可以应用于该纹理对象。我们现在也以贯穿章节的方式使用整数引用（`textureID`）。\n\
  \n\n\n\nMipmaps（多纹）和向异性过滤并不是减少纹理锯齿的唯一工具。例如，全场景抗锯齿 `(FSAA)` 和其他采样方法也可以改善 3D 场景中纹理的外观。尽管它们不是\
  \ OpenGL 核心的一部分，但通过 OpenGL 的扩展机制 [OE22]，许多显卡都支持它们。\n\n还有另一种配置和管理纹理及采样器的机制。OpenGL\
  \ 3.3 版本引入了 `sampler objects`（有时称为 `sampler states`——不要与采样器变量混淆），它可以用于存储一组独立于实际纹理对象的纹理设置。采样器对象附加到纹理单元上，允许方便且高效地更改纹理设置。本书所示的示例足够简单，因此我们决定省略对采样器对象的介绍。对于感兴趣的读者，采样器对象的使用很容易学习，并且有许多优秀的在线教程（例如\
  \ [GE11]）。\n\n## 练习\n\n**5.1** 修改 `Program 5.1`，在纹理坐标顶点属性中添加 `noperspective` 声明，如第\
  \ 5.11 节所示。然后重新运行程序并将输出与原始输出进行比较。是否存在明显的透视畸变？\n\n**5.2** 使用简单的“画图”程序（如 Windows“画图”或\
  \ GIMP [GI23]）画一张你自己设计的随手画。然后使用你的图像为 `Program 5.1` 中的金字塔贴上纹理。\n\n**5.3** *(项目)*\
  \ 修改 `Program 4.4`，使“太阳”、“行星”和“月球”具有纹理。你可以继续使用已有的形状，可以使用任何你喜欢的纹理。这将要求你为立方体构建纹理坐标。\n\
