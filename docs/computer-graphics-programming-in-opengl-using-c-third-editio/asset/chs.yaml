  \n# 第 11 章：参数化表面\n\n- 11.1 二次贝塞尔曲线\n- 11.2 三次贝塞尔曲线\n- 11.3 二次贝塞尔曲面\n- 11.4 三次贝塞尔曲面\n\
  - 补充笔记\n\n![image](img/common.jpg)\n\n在 20 世纪 50 年代和 60 年代于雷诺公司工作期间，皮埃尔·贝塞尔（Pierre\
  \ Bézier）开发了用于设计汽车身的软件系统。他的程序使用了由竞争对手雪铁龙汽车制造商保罗·德·卡斯特留（Paul de Casteljau）早期开发的方程组\
  \ [BE72, DC63]。de Casteljau 方程仅使用少数标量参数即可描述曲线，并配有一种被称为“de Casteljau 算法”的巧妙递归算法，用于生成具有任意精度的曲线。这些方法现在被称为“贝塞尔曲线”和“贝塞尔曲面”，通常被用于高效地对各种弯曲\
  \ 3D 对象进行建模。\n\n## 11.1 二次贝塞尔曲线\n\n二次贝塞尔曲线由一组参数方程定义，这些方程使用三个控制点指定了一个特定的曲线形状，每个控制点都是\
  \ 2D 空间中的一个点。¹例如，考虑图 11.1 所示的三个点集合 [p[0], p[1], p[2]]。\n\n*（注：提示中提供的源文本在第 11.1 节包含大量的重复/损坏片段。我已根据您的要求清理了冗余循环，以保持核心内容的完整性。）*\n\
  \n\n\n\n渲染贝塞尔曲线（Bézier curves）有许多不同的技术。一种方法是使用固定的增量迭代 `t` 的连续值，从 0.0 开始到 1.0 结束。例如，如果增量为\
  \ 0.1，我们可以使用一个 `t` 值为 0.0、0.1、0.2、0.3 等的循环。对于 `t` 的每一个值，都将计算贝塞尔曲线上对应的点，并画出连接连续点的一系列线段，如图\
  \ 11.5 中的算法所示。\n\n另一种方法是使用德·卡特留算法（de Casteljau’s algorithm）将曲线`递归细分`两半，在每个递归步骤中\
  \ `t`=½。图 11.6 显示了左侧细分为新的立方控制点（图中用绿色所示的 `q[0]`、`q[1]`、`q[2]`、`q[3]`），这些点是由 de Casteljau\
  \ 推导出的（完整推导可以在 [AS14] 中找到）。\n\n该算法如图图 11.7 所示。它反复地细分曲线段，直到每个曲线段都足够直，至于进一步的细分不再产生任何实际收益。在极限情况下（当控制点生成得越来越近），曲线段本身实际上等同于连接第一个和最后一个控制点（`q[0]`\
  \ 和 `q[3]`）之间的直线。因此，判断一个曲线段是否“足够直”可以通过比较从第一个控制点到最后一个控制点之间的距离，与连接四个控制点的三条线段的长度之和来实现：\n\
  \n![image](img/fig11_5.jpg)\n\n图 11.5\n\n用于渲染贝塞尔曲线的迭代算法。\n\n```\nD[1] = | p[0]-p[1]\
  \ | + | p[1]-p[2] | + | p[2]-p[3] |\n\nD[2] = | p[0]-p[3] |\n```\n\n那么，如果 `D[1]-D[2]`\
  \ 小于一个足够小的容差，则没有必要进一步细分。\n\n![image](img/fig11_6.jpg)\n\n图 11.6\n\n细分立方贝塞尔曲线。\n\n\
  德·卡特留算法的一个有趣特性是，可以在不实际使用前述混合函数的情况下，生成曲线上所有的点点。此外，请注意 `p(½)` 处的中心点是“共享”的；也就是说，它既是左侧细分中最右侧的控制点，也是右侧细分中最左侧的控制点。可以使用\
  \ `t`=½ 处的混合函数进行计算，也可以使用 de Casteljau 推导的公式 `(q[2] + r[1])/2` 进行计算。\n\n![image](img/fig11_7.jpg)\n\
  \n图 11.7\n\n用于贝塞尔曲线的递归细分算法。\n\n顺带提一下，我们指出图 11.7 所示的 `subdivide()` 函数假设输入的参数 `p`、`q`\
  \ 和 `r` 是“引用”参数，因此函数中的计算会修改来自上方列出的 `drawBezierCurve()` 函数调用中的实际参数。\n\n## 11.3 二次贝塞尔表面\n\
  \n贝塞尔曲线定义了弯曲的*线条*（在 2D 或 3D 空间中），而贝塞尔*表面*定义了*3D 空间*中的*弯曲表面*。将曲线中看到的概念扩展到表面需要将我们的参数方程系统从一个参数扩展到两个参数。对于贝塞尔曲线，我们将该参数称为\
  \ `t`。对于贝塞尔表面，我们将参数称为 `u` 和 `v`。我们的曲线是由点 `P(t)` 组成的，而我们的表面将由点 `P(u,v)` 组成，如图 11.8\
  \ 所示。\n\n![image](img/fig11_8.jpg)\n\n图 11.8\n\n参数化表面。\n\n对于二次贝塞尔表面，在每个轴 `u` 和 `v`\
  \ 上都有三个控制点，总共有*九个*控制点。图 11.9 显示了一组九个控制点（通常称为*控制点“网格”*）的蓝色示例，以及对应的弯曲表面（红色）。\n\n![image](img/fig11_9.jpg)\n\
  \n图 11.9\n\n二次贝塞尔控制网格及相应的表面。\n\n网格中的九个控制点标记为 `p[ij]`，其中 `i` 和 `j` 分别代表 `u` 方向和 `v`\
  \ 方向的索引。每组三个相邻的控制点（例如 `(p[00]`,`p[01]`,`p[02])`）定义了一条贝塞尔曲线。表面上的点 `P(u,v)` 然后被定义为两个混合函数之和，一个在\
  \ `u` 方向，一个在 `v` 方向。用于构建贝塞尔表面的两个混合函数的形式遵循了之前为贝塞尔曲线提供的方法论：\n\n![image](img/pg283-1.jpg)\n\
  \n通过结合前述为贝塞尔曲线提供的方法，在 `u` 和 `v` 处求值的混合函数，生成组成贝塞尔表面的点 `P(u,v)`：\n\n![image](img/pg283.jpg)\n\
  \n组成贝塞尔表面的点有时被称为 *patch*（补丁）。当我们稍后研究加密着色器（tessellation shaders）时，“patch”这个术语可能会令人困惑，因为在那些地方，由\
  \ `p[ij]` 生成的 `i`^(th) 和 `j`^(th`点网格通常被称为“patch”。\n\n## 11.4 立方贝塞尔表面\n\n从二次扩展到立方表面需要使用更大的网格——4x4\
  \ 而非 3x3。图 11.10 显示了一组控制点的示例（蓝色），以及对应的弯曲表面（红色）。\n\n![image](img/fig11_10.jpg)\n\n\
  图 11.10\n\n立方贝塞尔控制网格及相应的表面。\n\n与之前一样，我们可以通过结合贝塞尔曲线的相关混合函数推导出表面点 `P(u,v)` 的公式：\n\n\
  ![image](img/pg284.jpg)\n\n其中：\n\n![image](img/pg284-1.jpg)\n\n渲染贝塞尔表面也可以通过递归细分\
  \ [AS14] 完成，通过沿着每个维度交替平分表面，如图 11.11 所示。每次细分产生四个新的控制点网格，每个网格定义了表面的一个区域。\n\n![image](img/fig11_11.jpg)\n\
  \n图 11.11\n\n贝塞尔表面的递归细分。\n\n在渲染贝塞尔*曲线*时，当*曲线*足够直时我们就停止细分。对于贝塞尔表面，当*表面*足够平坦时我们就停止递归。实现这一点的一种方法是确保递归生成的子区域控制网格中的所有点都在其四个角点定义的平面内的一个足够小的允许距离内。点\
  \ `(x,y,z)` 到平面 `(A,B,C,D)` 的距离 `d` 为：\n\n![image](img/pg285.jpg)\n\n如果 `d` 小于一个足够小的容差，则没有必要进一步细分，只需使用子区域网格的四个角控制点来绘制两个三角形。\n\
  \nOpenGL 管线中的*加密*（tessellation）阶段为渲染贝塞尔表面提供了一种极具吸引力的方法，基于图 11.5](#17_chapter11.html_fig11-5)中的贝塞尔曲线迭代算法。策略是让加密器生成一个大的顶点网格，然后使用混合函数将这些顶点重新定位到立方控制点指定的贝塞尔表面上。我们在第\
  \ 12 章中实现它。\n\n\n\n贝塞尔曲线除了计算机图形和汽车领域外，在现实世界上有很多应用。它们也可以出现在桥梁设计中，例如耶路撒冷的弦弦桥 [RG12]。相似的技术也用于构建\
  \ TrueType 字体，因此这些字体可以缩放到任何任意大小，或者放大到任何密近程度，同时始终保持边缘光滑。\n\n## 练习题\n\n**11.1** 二次贝塞尔曲线仅限于定义完全“凹”或“凸”的曲线。请描述（或画出）一个弯曲方式既不完全凹也不完全凸的曲线示例，这种曲线无法被`quadratic`\
  \ 二次贝塞尔曲线近似。\n\n**11.2** 使用笔或铅笔在纸上任画一组四个点，按任意顺序将它们编号为 1 到 4，然后尝试画出由这四个有序控制点定义的三次贝塞尔曲线的近似图。然后，重新排列控制点的编号（即改变它们的顺序，但不改变它们的位置），并重新绘制生成的新的三次贝塞尔曲线。有许多在线工具可以绘制贝塞尔曲线，你可以用它们检查你的近似结果。\n\
  \n## 参考文献\n\n- [AS14] E. Angel and D. Shreiner, *Interactive Computer Graphics:\
  \ A Top-Down Approach with WebGL*, 7th ed. (Pearson, 2014).\n- [BE23] S. Bernstein,\
  \ Wikipedia, accessed November 2023, [`en.wikipedia.org/wiki/Sergei_Bernstein`](https://en.wikipedia.org/wiki/Sergei_Bernstein)\n\
  - [BE72] P. Bézier, *Numerical Control: Mathematics and Applications* (John Wiley\
  \ & Sons, 1972).\n- [DC63] P. de Casteljau, *Courbes et surfaces à pôles*, technical\
  \ report (A. Citroën, 1963).\n- [RG12] R. Gross, “Bridges, String Art, and Bézier\
  \ Curves”, Plus Magazine, accessed November 2023, [`plus.maths.org/content/bridges-string-art-and-bezier-curves`](https://plus.maths.org/content/bridges-string-art-and-bezier-curves)\n\
  \n***\n\n当然，曲线可以存在于 3D 空间中。然而，二次曲线完全位于一个 2D 平面内。\n\n# 第 12 章：细分 (TESSELLATION)\n\
  \n### 12.1 OpenGL 中的细分化\n### 12.2 贝塞尔曲面的细分化\n### 12.3 地形/高度图的细分化\n## 12.4 控制细节水平\
  \ (LOD)\n## 补充笔记\n\n![image](img/common.jpg)\n\n英语术语“tessellation”（细分）指的是一大类设计活动，其中各种几何形状的瓷砖被相邻排列以形成图案，通常在平面上进行。其目的可以是艺术性的，也可以是实用的，例子可以追溯到数千年前\
  \ [TS23]。\n\n在 3D 图形中，`tessellation` 指的是稍有不同的东西，但无疑受到了其经典对应物的启发。在这里，细分指的是为了生成和处理大量三角形，以渲染复杂的形状和表面，最好在硬件中完成。细分是\
  \ OpenGL 核心中较晚添加的特性，直到 2010 年的 4.0 版本才出现。\n\n## 12.1 OpenGL 中的细分化\n\nOpenGL 对硬件细分的支持通过三个流水线阶段提供：\n\
  \n1. `tessellation control shader`（细分控制着色器）\n2. `tessellator`（细分器）\n3. `tessellation\
  \ evaluation shader`（细分评估着色器）\n\n第一和第三阶段是可编程的；中间第二阶段不可编程。为了使用细分，程序员通常需要提供控制着色器和评估着色器。\n\
  \n`tessellator`（全名是 `tessellation primitive generator`，或 `TPG`）是一个硬件支持的引擎，产生固定三角形网格。控制着色器允许我们配置细分器要构建什么种三角形网格。评估着色器则让我们能够以各种方式处理网格。处理后的三角形网格随后成为进入流水线的顶点源。回想\
  \ [图 2.2]，细分位于流水线中顶点着色器和几何着色器阶段之间。\n\n让我们从一个简单使用细分器创建顶点三角形网格并在不进行任何处理的情况下显示它的应用程序开始。为此，我们需要以下模块：\n\
  \n1. **C++/OpenGL 应用：**\n   创建相机和相关的 `mvp` 矩阵。视图 (`v`) 和投影 (`p`) 矩阵用于调整相机方向；模型 (`m`)\
  \ 矩阵可用于修改网格的位置和朝向。\n\n2. **顶点着色器 (Vertex Shader)：**\n   在本例中基本上什么都没做；顶点将在细分器中生成。\n\
  \n3. **细分控制着色器 (TCS)：**\n   指定细分器要构建的网格。\n\n4. **细分评估着色器 (TES)：**\n   将 `mvp` 矩阵应用于顶点。\n\
  \n5. **片元着色器 (Fragment Shader)：**\n   简单地为每个像素输出颜色。\n\n```\n// Example of tessellator\
  \ mesh\n```\n\n![image](img/prog12_1.jpg)\n\n![image](img/prog12_1-1.jpg)\n\n细分器产生由两个参数定义的网格：`inner\
  \ level` 和 `outer level`。在这种情况下，外部边缘被分为 6 份，而内部被分为 12 份。\n\n\n\n现在让我们逐一处理这四个着色器。如前所述，顶点着色器几乎没有，因为\
  \ `C++/OpenGL` 应用程序并没有提供任何顶点。它只包含一个与其他着色器匹配的 `uniform` 声明和一个空的 `main()` 函数。无论如何，所有着色器程序都包含一个顶点着色器是一项要求。\n\
  \n细分控制着色器（Tessellation Control Shader）指定了细分器要生成的三角形网格的拓扑结构。通过给命名为 `gl_TessLevel*xxx`\
  \ 的保留字赋值，设置了六个“级别”参数——两个“内部”级别四个“外部”级别。这是为了细分一个大的 `rectangular` 三角形网格，称为 `quad`。这些级别告诉细分器在形成三角形时如何细分网格，其布局如图\
  \ 12.3 所示。\n\n注意控制着色器中的这一行：\n\n```\nlayout (vertices=1) out;\n```\n\n这与之前的 `GL_PATCHES`\
  \ 讨论有关，并指定了从顶点着色器传递到控制着色器（以及通过“out”传递到评估着色器）的每个“补丁”的顶点数量。在这个特定的程序中没有，但我们仍然必须至少指定一个，因为这也影响了控制着色器的执行次数。稍后此值将反映控制点的数量，并且必须与\
  \ `C++/OpenGL` 应用程序中 `glPatchParameteri()` 调用中的值匹配。\n\n![image](img/fig12_3.jpg)\n\
  \n图 12.3：细分级别。\n\n接下来让我们看看细分评估着色器（Tessellation Evaluation Shader）。它从这样一行代码开始：\n\n\
  ```\nlayout (quads, equal_spacing, ccw) in;\n```\n\n这初看起来看起来可能与控制着色器中的 “out” 布局语句有关，但实际上它们是无关的。相反，这一行代码是用来指示细分器生成顶点的地方，使它们排列成一个大的矩形（一个“quad”）。它还指定了细分部分（内部和外部）的长度是等长的（稍后我们将看到不等长度细分的用途）。`ccw`\
  \ 参数指定了细分网格顶点生成的绕行顺序（在本例中为逆时针）。\n\n细分器生成的顶点随后被发送到评估着色器。因此，评估着色器可能会同时从控制着色器（通常作为控制点）和从细分器（细分网格）接收顶点。在程序\
  \ 12.1 中，顶点仅从细分器接收。\n\n评估着色器为细分器产生的每个顶点执行一次。可以使用内置变量 `gl_TessCoord` 访问顶点位置。细分网格的取向使其位于\
  \ X-Z 平面内，因此 `gl_TessCoord` 的 `X` 和 `Y` 分量被应用于网格的 X 和 Z 坐标。网格坐标以及即 `gl_TessCoord`\
  \ 的值范围从 `0.0` 到 `1.0`（这在稍后计算纹理坐标时将非常有用）。评估着色器然后使用 `mvp` 矩阵来确定每个顶点的方向（这在之前章节的示例是在顶点着色器中完成的）。\n\
  \n最后，片段着色器简单地为每个像素输出常量黄色。当然，我们也可以像在之前的章节看到的那样，用它为我们的场景应用纹理或光照。\n\n## 12.2 BÉZIER\
  \ 曲面的细分\n\n现在让我们扩展程序，使其将我们的简单矩形网格转换为 Bézier 曲面。细分后的网格应该为我们采样表面提供足够的顶点（如果我们需要更多，可以增加内部/外部细分级别）。我们现在需要的是通过流水线发送控制点，然后使用这些控制点进行计算，将细分后的网格转换为所需的\
  \ Bézier 曲面。\n\n![image](img/fig12_4.jpg)\n\n图 12.4：Bézier 曲面细分概述。\n\n假设我们想要构建一个\
  \ `cubic` Bézier 曲面，我们需要 16 个控制点。我们可以从 `C++` 侧通过 `VBO` 发送它们，也可以在顶点着色器中对它们硬编码。图 12.4\
  \ 显示了控制点从 `C++` 侧传输的流程概述。\n\n现在是更精确地解释细分控制着色器（TCS）如何工作的好时候了。与顶点着色器类似，TCS 为每个输入的顶点执行一次。此外回想第\
  \ 2 章，OpenGL 提供了一个名为 `gl_VertexID` 的内置变量，它包含一个计数器，指示当前正在执行哪一次顶点着色器调用。细分控制着色器存在一个名为\
  \ `gl_InvocationID` 的类似内置变量。\n\n细分的一项强大功能是 TCS（以及 TES）着色器可以同时以数组的形式访问所有控制点顶点顶点。起初，当\
  \ TCS 为每个顶点执行一次，而每次调用都可以访问所有顶点时，这似乎可能令人困惑。此外，细分级别是在赋值语句中指定的，而这些语句在每次 TCS 调用中都被冗余地设置，这也很违背直觉。尽管所有这些看起来可能很奇怪，但之所以这样做是因为细分架构的设计使得\
  \ TCS 调用可以并行运行。\n\nOpenGL 为 TCS 和 TES 着色器提供了几个内置变量。我们已经提到的有 `gl_InvocationID`，以及当然还有\
  \ `gl_TessLevelInner` 和 `gl_TessLevelOuter`。这里是关于一些最实用的内置变量的更多细节和描述：\n\n### 细分控制着色器\
  \ (TCS) 内置变量：\n\n- `gl_in[]`：包含每个输入控制点的数组——每个输入顶点一个元素。可以使用索引法访问特定的顶点属性。一个内置属性是 `gl_Position`；因此，输入顶点\
  \ `i` 的位置是 `gl_in[i].gl_Position`。\n- `gl_out[]`：向 TES 发送输出控制点的数组——每个输出顶点一个元素。可以使用索引法访问特定的顶点属性。一个内置属性是\
  \ `gl_Position`；因此，输出顶点 `i` 的位置是 `gl_out[i].gl_Position`。\n- `gl_InvocationID`：指示当前执行哪一次\
  \ TCS 调用的整数计数器。常见的用途是传递顶点属性；例如，将当前用的顶点位置从 TCS 传递到 TES 如下：`gl_out[gl_InvocationID].gl_Position\
  \ = gl_in[gl_InvocationID].gl_Position;`。\n\n### 细分评估着色器 (TES) 内置变量：\n\n- `gl_in[]`：包含每个输入控制点的数组——每个输入顶点一个元素。可以使用索引法访问特定的顶点属性。内置属性是\
  \ `gl_Position`；因此，通过 `gl_in[xxx].gl_Position` 访问输入顶点位置。\n- `gl_Position`：细分网格顶点的输出位置，可能会在\
  \ TES 中进行修改。重要的是 `gl_Position` 和 `gl_in[xxx].gl_Position` 是不同的——`gl_Position` 是源自细分器的输出顶点位置，而\
  \ `gl_in[xxx].gl_Position` 是进入 TES 的控制点顶点。\n\n\n\n我们的曲面控制着色器（tessellation control\
  \ shader）现在有两个任务：指定曲分级别，以及将控制点从顶点着色器传递到评估着色器。评估着色器随后可以根据贝塞尔曲线控制点修改网格点（即 `gl_TessCoords`）的位置。\n\
  \n程序 12.2 显示了所有四个着色器——顶点着色器、TCS、TES 和片元着色器——用于指定控制点补片、生成一个平坦的曲分顶点网格、将这些顶点重新定位到由控制点指定的曲面上，并用纹理图像绘制生成的表面。它还展示了\
  \ C++/OpenGL 应用程序的相关部分，特别是在 `display()` 函数中。在这个示例中，控制点源于顶点着色器（它们在那里是硬编码的），而不是从 C++/OpenGL\
  \ 应用进入 OpenGL 流水线。更多细节见代码列表后的说明。\n\n### 程序 12.2 用于贝塞尔曲面的曲面细分\n\n![image](img/prog12_2.jpg)\n\
  \n![image](img/prog12_2-1.jpg)\n\n![image](img/prog12_2-2.jpg)\n\n顶点着色器现在指定十六个控制点（“补片”顶点），代表一个特定的贝塞尔曲面。在这个示例中，它们都被归一化到\
  \ [-1..+1] 范围。顶点着色器还使用控制点来确定适用于曲分网格的纹理坐标，其值范围在 [0..1] 之间。需要重申的是，从顶点着色器输出的顶点 `不是`\
  \ 将光栅化的顶点，而是贝塞尔控制点。在使用曲面细分时，补片顶点 `从不` 被光栅化——只有曲分后的顶点才会进入光栅化。\n\n控制着色器仍然指定内部和外部曲面细分级别。它现在承担了将控制点和纹理坐标转发给评估着色器的额外责任。注意，曲分级别只需要指定一次，因此该步骤仅在第\
  \ 0 次调用时执行（回 TCS 为每个顶点运行一次——因此在这个示例中有 16 次调用）。为了方便起见，我们为每个曲分级别指定了 32 次细分。\n\n接下来，评估着色器执行所有的贝塞尔曲面计算。`main()`\
  \ 开头的大段赋值语句从每个输入 `gl_in` 的 `gl_Position` 中提取控制点（注意这些对应于控制着色器的 `gl_out` 变量）。然后使用来自曲面细分器的网格点计算混合函数的权重，生成一个新的\
  \ `outputPosition`，对其应用模型-视图-投影矩阵，为每个网格点生成输出 `gl_Position` 并形成贝塞尔曲面。\n\n也有必要创建纹理坐标。顶点着色器只为每个控制点位置提供了一个。但渲染的并不是控制点——我们最终需要大量的曲分网格点的纹理坐标。实现此有多种方法——我们使用\
  \ GLSL 提供的 `mix` 函数进行线性插值。`mix()` 函数期望三个参数：(a) 起点，(b) 终点，以及 (c) 插值（范围从 0 到 1）。它返回对应于插值的在起始点和终点之间的值。由于曲分网格坐标的范围也是\
  \ 0 到 1，因此可以直接用于此目的。\n\n这次在片元着色器中，不再输出单一颜色，而是应用了标准纹理化。属性 `texCoord_TESout` 中的纹理坐标是在评估着色器中产生的。C++\
  \ 程序的更改同样简单——注意现在指定了补片大小为 16。生成的输出显示在 图 12.5 中（应用了来自 [LU16] 的瓦片纹理）。\n\n![image](img/fig12_5.jpg)\n\
  \n图 12.5：曲分的贝塞尔曲面。\n\n### 12.3 用于地形/高度图的曲面细分\n\n回想，在顶点着色器中执行高度映射可能会遇到顶点数量不足以渲染所需细节的问题。现在我们有了一种生成大量顶点的方法，让我们回到\
  \ Hastings-Trew 的月球表面纹理图（来自 [HT23]），并将其作为`高度 map`，通过提升`曲分`顶点来产生月球表面细节。正如我们将看到的，这样做具有优点：可以获得与月球图像更好地匹配的顶点几何，并改善轮廓（边缘）细节。\n\
  \n我们的策略是修改程序 12.1，在 X-Z 平面上放置一个曲分网格，并使用高度映射设置每个曲分网格点的 Y 坐标。为了做到这一点不需要补片，因为我们可以硬编码曲分网格的位置。因此，我们将像程序\
  \ 12.1 那样，在 `glDrawArrays()` 和 `glPatchParameteri()` 中指定每个补片所需的最小 1 个顶点。Hastings-Trew\
  \ 的月球纹理图像同时用于颜色和高度图。\n\n我们在评估着色器中通过将曲分网格的 `gl_TessCoord` 值映射到顶点和纹理的相应范围来生成顶点和纹理坐标。高度映射的执行的地方，是将月球纹理颜色分量的一部分添加到输出顶点的\
  \ Y 分量。着色器的更改如程序 12.3 显示。\n\n### 程序 12.3 简单曲分地形\n\n![image](img/prog12_3.jpg)\n\n\
  ![image](img/prog12_3-1.jpg)\n\n片元着色器与 12.2 中的类似，仅基于纹理输出颜色。C++/OpenGL 应用程序基本没有变化——它加载纹理（同时作为纹理和高度图）并为其启用采样器。图\
  \ 12.6 显示了纹理图像（左侧）和第一次尝试的最终输出，遗憾的是它还没有实现正确的高度映射。\n\n第一次的结果缺陷很大。虽然我们现在可以看到远处地平线的轮廓细节，但那里的起伏与纹理中的实际细节并不对应。回想在高度图中，白色应该表示“高”，黑色应该表示“低”。特别是右上角的区域，显示出的巨大山丘与图像中的深浅颜色没有任何关系。\n\
  \n![image](img/fig12_6.jpg)\n\n图 12.6：曲分地形——第一次尝试失败，顶点数量不足。\n\n这个问题的原因是曲分网格的分辨率。曲面细分器能生成的顶点最大数量取决于硬件，而符合\
  \ OpenGL 标准只需要每个曲分级别的最大值至少为 64 即可。我们的程序指定了一个内部和外部曲分级别都为 32 的单个曲分网格，因此我们生成了大约 32*32\
  \ 或略超过 1000 个顶点，这不足以准确反映图像中的细节。即使我们将曲分值增加到 64，总共 64*64 或略超过 4000 个顶点对于使用月球图像进行高度映射仍然是远远不够的。\n\
  \n\n\n\n增加顶点数量的一种良好方法是使用`instancing`（实例化），我们在第 4 章中见过它。我们的策略是让细分器生成网格，并使用实例化来重复多次。在顶点着色器中，我们构建了一个由四个顶点定义的补片（patch），每个顶点对应细分网格的一个角点。在我们的\
  \ C++/OpenGL 应用程序中，我们将 `glDrawArrays()` 调用更改为 `glDrawArraysInstanced()`。在那里，我们指定了一个\
  \ 64x64 的补片网格，每个补片包含一个尺寸为 32 级的细分网格。这将为我们提供总计 `64*64*32*32` 个，即超过四百万个顶点。\n\n顶点着色器首先指定四个纹理坐标\
  \ (0,0)、(1,0)、(0,1) 和 (1,1)。使用实例化时，请记住顶点着色器可以访问整数变量 `gl_InstanceID`，它持有对应当前正在处理的\
  \ `glDrawArraysInstanced()` 用的计数器。我们使用这个 ID 值来分配单个补片在较大网格中的位置。补片按行和列定位，第一个补片位于位置\
  \ (0,0)，第二个在 (1,0)，下一个在 (2,0)，依此类推，第一列的最后一个补片在 (63,0)。下一列的补片在 (0,1)、(1,1) 等，一直持续到\
  \ (63,1)。最后一列的补片在 (0,63)、(1,63) 等，一直持续到 (63,63)。给定补片的 X 坐标是实例 ID 模 64，而 Y 坐标是实例\
  \ ID 除以 64（取整除）。然后着色器将坐标缩放回 [0..1] 范围。\n\n控制着色器保持不变，只是它透传了顶点和纹理坐标。\n\n接下来，评估着色器获取输入的细分网格顶点（由\
  \ `gl_TessCoord` 指定），并将它们移动到输入补片指定的坐标范围内。它对纹理坐标执行相同的操作。它还以程序 12.3 中的方式应用了高度贴图。片元着色器保持不变。\n\
  \n每个组件的更改如程序 12.4 所示。结果如图 12.7。注意，现在高低部分现在更紧密地对应图像的明暗部分。\n\n***程序 12.4 实例化细分的地形***\n\
  \n![image](img/prog12_4.jpg)\n\n![image](img/prog12_4-1.jpg)\n\n现在我们已经实现了高度贴图，可以着改进它并结合光照。一个挑战是我们的顶点还没有关联法线向量。另一个挑战是，仅使用纹理图像作为高度贴图产生了过于“锯齿”的结果——在这种情况下，是因为纹理图像中所有的灰度变化并不都是由于高度引起的。对于这张特定的纹图，恰好\
  \ Hastings-Trew 已经产生了一个我们可以使用的改进高度图 [HT23]。它显示在图 12.8（左侧）。\n\n为了创建法线，我们可以通过生成相邻顶点（或高度图中的相邻纹理素）的高度来实时计算它们，构建连接它们的向量，并使用叉积找到法线。这需要根据场景的精度（和/或高度图图像）进行一些调整。在这里，我们而是使用了\
  \ GIMP 的“normalmap”插件 [GN12] 根据 Hastings-Trew 的高度图生成法线图，显示在图 12.8（右侧）。\n\n![image](img/fig12_7.jpg)\n\
  \n图 12.7\n\n细分地形 – 第二尝试，使用了实例化。\n\n![image](img/fig12_8.jpg)\n\n图 12.8\n\n月球表面：高度图\
  \ [HT23] 和法线图。\n\n我们代码的大部分更改现在仅仅是为了实现 Phong 光照的标准方法：\n\n### C++/OpenGL 应用程序\n我们加载并激活了一个额外的纹理来存储法线图。我们还添加了代码，像我们在之前的应用程序中所样指定光照和材质。\n\
  \n### 顶点着色器\n唯一的添加是光照均匀变量（uniforms）和法线图采样器的声明。通常在顶点着色器中完成的光照代码移动到了细分评估着色器中，因为顶点在细分阶段之前还没有生成。\n\
  \n### 控制着色器\n唯一的添加是光照均匀变量和法线图采样器的声明。\n\n### 细分评估着色器\nPhong 光照的准备代码现在放置在评估着色器中：\n\
  \n```\nvaryingVertPos = (m_matrix * tessellatedPoint).xyz;\nvaryingLightDir = light.position\
  \ - varyingVertPos;\n```\n\n### 片元着色器\n之前描述的用于计算 Phong（或 Blinn-Phong）光照的典型代码段在此完成，以及从法线图中提取法线的代码。光照结果然后通过加权和与纹理图像结合。\n\
  \n![image](img/fig12_9.jpg)\n\n图 12.9\n\n带有法线图和光照的细分地形（光源分别置于左侧和右侧）。\n\n带有高度和法线贴图的最终结果如图\
  \ 12.9 所示。现在对光照有响应。结果仍然不完美，因为从静态图片很难看出对光照移动的响应，这在相机移动时显然更为明显。\n\n## 12.4 控制细节层次\
  \ (LOD)\n\n使用实例化实时生成数百万顶点（如程序 12.4 所示）可能会给即使配置良好的计算机带来负载。幸运的是，将地形划分补片的策略（正如我们增加顶点数量时所做的）也为我们提供了减少这种负载的良好机制。\n\
  \n在生成的数百万顶点中，许多并不是必要的。靠近相机的补片顶点是重要的，因为我们预期看到附近的细节。然而，补片距离相机越远，光栅化越不太会有足够的像素来支持其顶点数量\n\
  \n根据距离更改补片中的顶点数量的技术被称为*细节层次*，或 *LOD*。Sellers 等人描述了一种在实例化细分中控制 LOD 方法 [SW15]，通过修改控制着色器。程序\
  \ 12.5 显示了 Sellers 等方法的简化版本。该策略是使用补片的感知大小来确定细分级别。步骤如下：\n\n1. 应用 MVP 矩阵计算四个控制点的屏幕位置。\n\
  2. 计算由控制点定义的正方形边长（即宽度和高度）（在屏幕空间内）。注意，尽管四个控制点形成一个正方形，但这些边长可能不同，因为应用了投影矩阵。\n3. 根据可调常数缩放长度值，取决于细分级别所需的精度（基于高度图的细节程度）。\n\
  4. 将缩放后的长度加 1，以避免指定 0 细分级别（这将导致不生成顶点）。\n\n\n\n\n\n## 5. 将细分级别设置为相应的计算出的宽度和高度值。\n\
  \n请记住，在我们的实例化示例中，我们并不是只创建了一个网格，而是 64*64 个。因此，之前列表中的五个步骤会对每个补丁（patch）执行。因此，细节层次（LOD）在不同补丁之间变化。\n\
  \n所有的更改都在控制着色器中，并显示程序 12.5 中，生成的输出见图 12.10。注意，变量 `gl_InvocationID` 指的是正在处理补丁中的哪个顶点（而不是正在处理哪个补丁）。因此，告诉细分器需要生成多少个顶点的\
  \ LOD 计算是在处理每个补丁的第 0 个顶点时进行的。\n\n### 程序 12.5 细分细节层次 (LOD)\n\n![image](img/prog12_5.jpg)\n\
  \n将这些控制着色器的更改应用于我们在图 12.7 中实例化（但未光照）的场景版本，并将高度图替换为图 12.8 所示的 Hastings-Trew 更精细的版本，即可产生改进后的场景，具有更真实的地平线细节，见图\
  \ 12.10。\n\n![image](img/fig12_10.jpg)\n\n**图 12.10** - 带有细节层次 (LOD) 的细分月球。\n\n\
  在此示例，将评估着色器中的布局限定从：\n\n```glsl\nlayout (quads, equal_spacing, ccw) in\n```\n\n改为：\n\
  \n```glsl\nlayout (quads, fractional_even_spacing, ccw) in\n```\n\n这种修改的原因很难通过静态图像说明。在动画场景中，当细分物体穿过\
  \ 3D 空间时，如果使用了 LOD，有时可以看到物体表面细分层级的变化，产生被称为“闪烁”（popping）的抖动伪影。从 `equal spacing` 更改到\
  \ `fractional spacing` 可以通过使相邻补丁实例的网格几何更加相似来减少这种效果，即使它们的细节层次不同。（参见练习题 12.2 和 12.3。）\n\
  \n使用 LOD 可以显著减少系统负载。例如，在动画处理时，与不控制 LOD 相比，场景较可能出现卡顿或延迟。\n\n将这种简单的 LOD 技术应用于包含 Phong\
  \ 着色的版本（即程序 12.4）要稍微复杂一些。这是因为相邻补丁实例之间 LOD 的变化反过来会导致关联法向量的发生突变，从而在光照中产生闪烁伪影！一如既往，在构建复杂的\
  \ 3D 场景时，需要考虑权衡和折中。\n\n## 补充说明\n\n将细分与 LOD 结合起来在实时虚拟现实应用中特别有用，这些应用既需要用于真实性的复杂细节，需要频繁的物体移动和/或相机位置变化，例如计算机游戏。在本章中，我们说明了细分和\
  \ LOD 用于实时地形生成，尽管它们也可以应用于其他领域，例如 3D 模型的位移映射（其中在模型表面添加细分顶点，然后对其进行移动以添加细节）。它们在计算机辅助设计应用中也有用。\n\
  \nSellers 等人对程序 12.5 所示的 LOD 技术进行了比我们展示的进一步的扩展，还消除了相机后补丁中的顶点（他们通过将内部和外部级别设置为零来实现这一点）[SW15]。这是剔除技术的一个示例，它是非常有用的，因为实例化细分仍然会给系统带来负载。\n\
  \n程序 12.1 中使用的四参数版本 `createShaderProgram()` 已添加到 `Utils.cpp` 文件中。稍后，我们将添加额外的版本以适应几何着色器阶段。\n\
  \n## 练习题\n\n**12.1** 修改程序 12.1，对不同的内部和外部细分级别值进行实验，并观察生成的渲染网格。\n\n**12.2** 测试程序 12.5，将评估着色器中的布局限定符设置为\
  \ `equal_spacing`，然后设置为 `fractional_even_spacing`，如第 12.4 节所述。观察相机移动时对渲染表面的影响。你应该能够在第一种情况下观察到闪烁伪影，这些伪影在第二种情况下得到了很好的缓解。\n\
  \n**12.3 (项目)** 修改程序 12.4 以利用你自己的设计的高度图（你可以使用之前在练习 10.2 中构建的那个）。然后添加光照和阴影映射，使你的细分地形能够投射阴影。这是一个复杂的练习，因为第一次和第二次阴影映射中的某些代码需要移动到评估着色器中。\n\
  \n## 参考文献\n\n- [GN12] GIMP Plugin Registry, *normalmap plugin*, 访问于 2023 年 11 月,\
  \ [`code.google.com/archive/p/gimp-normalmap`](https://code.google.com/archive/p/gimp-normalmap)\n\
  - [HT23] J. Hastings-Trew, *JHT’s Planetary Pixel Emporium*, 访问于 2023 年 11 月, [`planetpixelemporium.com/`](http://planetpixelemporium.com/)\n\
  - [LU16] F. Luna, *Introduction to 3D Game Programming with DirectX*, 2nd ed. (Mercury\
  \ Learning, 2016).\n- [SW15] G. Sellers, R. Wright Jr., and N. Haemel, *OpenGL SuperBible:\
  \ Comprehensive Tutorial and Reference*, 7th ed. (Addison-Wesley, 2015).\n- [TS23]\
  \ Tessellation, Wikipedia, 访问于 2023, [`en.wikipedia.org/wiki/Tessellation`](https://en.wikipedia.org/wiki/Tessellation)\n\
  \n\n\n\n\n回想一下图元（primitives）是 OpenGL 中绘制对象的构建构建单元。只有几种类型的图元是可用；我们将主要关注处理三角形的几何着色器（geometry\
  \ shaders）。因此，当我们说几何着色器一次可以处理一个图元时，通常是指该着色器一次可以访问`三角形的所有三个顶点`。几何着色器允许你：\n\n• 一次访问图元中的所有顶点，然后\n\
  • 输出保持不变的相同图元，或者\n• 输出修改了顶点位置的相同图元，或者\n• 输出不同类型的图元，或者\n• 输出额外的图元，或者\n• 删除该图元（完全不输出）。\n\
  \n与曲面化评估着色器类似，输入的顶点属性在几何着色器中以`arrays`（数组）的形式访问。然而，在几何着色器中，输入的属性数组索引仅能达到图元的大小。例如，如果图元是三角形，那么可用索引为\
  \ `0`、`1` 和 `2`。访问顶点本身是通过预定义的数组 `gl_in` 完成的，如下所示：\n\n```cpp\ngl_in[2].gl_Position\
  \ // 第 3 个顶点的位置\n```\n\n同样与曲面化评估着色器类似，几何着色器的输出顶点属性全都是`scalars`（标量）。也就是说，输出是一个单个顶点流（它们的位置和其他属性变量，如果有的话），这些顶点构成了图元。\n\
  \n使用一个布局限定符（layout qualifier）来设置图元的输入/输出类型以及输出尺寸。\n\n特殊的 GLSL 命令 `EmitVertex()`\
  \ 指定要输出一个顶点。特殊的 GLSL 命令 `EndPrimitive()` 表示完成一个特定图元的构建。\n\n内置变量 `gl_PrimitiveIDIn`\
  \ 是可用的，它持有当前图元的 ID。ID 从 `0` 开始计数，一直到图元总数减 `1`。\n\n我们将探索四类常见的操作：\n\n• 修改图元\n• 删除图元\n\
  • 添加图元\n• 更改图元类型\n\n## 13.2 修改图元 (ALTERING PRIMITIVES)\n\n当对象的形状变化可以通过对图元（通常是三角形）的孤立更改来实现时，几何着色器非常便于改变对象的形状。\n\
  \n例如，考虑我们之前在 图 7.12 中渲染的圆环（torus）。假设该圆环代表一个内胎（例如轮胎用），我们想要“充气”它。仅在 C++/OpenGL 代码中应用缩放因子是无法实现这一点的，因为基本形状没有改变。要让它看起来被“充气”了，还需要在圆环拉伸到中心空区域时让内部空洞变小。\n\
  \n实现此点的方法之一是对每个顶点添加表面法线向量。虽然这可以在顶点着色器中完成，但为了练习，我们在几何着色器中实现。程序 13.1 显示了 GLSL 几何着色器代码。其他模块与程序\
  \ 7.3 相同，仅有少量变化：片段着色器的输入名称现在需要反映几何着色器的输出（例如，`varyingNormal` 变为 `varyingNormalG`），并且\
  \ C++/OpenGL 应用需要在链接之前编译并附加几何着色器。新的着色器被指定为几何着色器，如下：\n\n```cpp\nGLuint gShader =\
  \ glCreateShader(GL_GEOMETRY_SHADER);\n```\n\n***程序 13.1 几何着色器：修改顶点***\n\n![image](img/prog13_1.jpg)\n\
  \n![image](img/prog13_1-1.jpg)\n\n注意程序 13.1 中，与顶点着色器输出变量对应的输入变量被声明为`arrays`。这为程序员提供了一种机制，可以使用索引\
  \ `0`、`1` 和 `2` 访问三角形图元中的每个顶点及其属性。我们希望沿着它们的表面法线向外移动这些顶点。顶点和法线已经在顶点着色器中转换到了世界空间。我们在每个输入的顶点位置（`gl_in[i].gl_Position`）中加上法线的比例，然后对结果应用投影矩阵，生成每个输出的\
  \ `gl_Position`。\n\n注意 GLSL 调用 `EmitVertex()` 的使用，它指定了我们在何时完成输出 `gl_Position` 及其相关顶点属性的计算并准备好输出一个顶点。`EndPrimitive()`\
  \ 调用指定我们已经完成了一组构成图元（在本例中为三角形）的顶点的定义。结果如图图 13.1](#19_chapter13.html_fig13-1) 所示。\n\
  \n![image](img/fig13_1.jpg)\n\n图 13.1\n\n通过几何着色器修改顶点后的“充气”圆环。\n\n几何着色器包含两个布局限定符。第一个指定输入图元类型，并且与\
  \ C++ 侧 `glDrawArrays()` 或 `glDrawElements()` 调用中的图元类型兼容。选项如下：\n\n| 几何着色器输入图元 |\
  \ 从 glDrawArrays() 发出的兼容 OpenGL 图元 | 每次调用的顶点数 |\n| :--- | :--- | :--- |\n| points\
  \ | GL_POINTS | 1 |\n| lines | GL_LINES, GL_LINE_STRIP, GL_LINE_LOOP | 2 |\n| lines_adjacency\
  \ | GL_LINES_ADJACENCY, GL_LINE_STRIP_ADJACENCY | 4 |\n| triangles | GL_TRIANGLES,\
  \ GL_TRIANGLE_STRIP, GL_TRIANGLE_FAN | 3 |\n| triangles_adjacency | GL_TRIANGLES_ADJACENCY,\
  \ GL_TRIANGLE_STRIP_ADJACENCY | 6 |\n\n各种 OpenGL 图元类型（包括“strip”和“fan”类型）已在 第 4 章\
  \ 中描述。“邻接”（adjacency）类型是为了配合几何着色器引入的，它们允许访问相邻图元的顶点。我们在书中没有使用它们，但为了完整性列出了。输出图元类型必须是\
  \ `points`、`line_strip` 或 `triangle_strip`。注意输出布局限定符还指定了调用时的顶点数。\n\n这种特定的圆环修改可以在顶点着色器中更容易地完成。然而，假设我们不是让每个顶点沿着自身的表面法线向外移动，而是让每个三角形沿着它的法线向外移动，从而“爆炸”圆环。顶点着色器无法做到，因为计算三角形的法线需要平均三个顶点的法线，而顶点着色器一次只能访问一个顶点。然而，我们可以在几何着色器中这样做，因为几何着色器可以访问每个三角形的所有三个顶点。我们对它们的法线取平均以计算三角形的表面法线，然后将该平均法线加到三角形的每个顶点。图\
  \ 13.2、13.3 和 13.4 分别显示了法线的平均处理、修改后的几何着色器 `main()` 代码以及结果。\n\n![image](img/fig13_2.jpg)\n\
  \n图 13.2 将平均三角形法线应用到三角形顶点。\n\n![image](img/fig13_3.jpg)\n\n图 13.3 用于“爆炸”圆环的修改几何着色器\n\
  \n![image](img/fig13_4.jpg)\n\n图 13.4 “爆炸”的圆环\n\n通过确保圆环内部也可见，可以改进“爆炸”圆环的外观（通常这些三角形因为是背面朝而被\
  \ OpenGL 剔除）。实现这一点的方法之一是渲染两次圆环，一次以正常方式，另一次反转绕向顺序（反转绕向有效地切换了哪些面是正面，哪些是背面）。我们还向着色器发送一个标志（在\
  \ uniform 中）以禁用背面三角形的漫反射和高光光照，使其不那么明显。代码的变化如下。\n\n![image](img/pg301.jpg)\n\n![image](img/pg303.jpg)\n\
  \n包含背面的结果性“爆炸”圆环如图图 13.5](#19_chapter13.html_fig13-5) 所示。\n\n\n\n\n\n包含背面的“爆炸式”环面。\n\
  \n## 13.3 删除图元\n\n几何着色器的一个常见用途是通过明智地删除某些图元，从简单对象构建出装饰丰富的物体。例如，从我们的环面中移除一些三角形，可以将其转换为某种复杂的网格结构，这种结构从头开始建模会变得困难得多。实现此功能的几何着色器如程序\
  \ 13.2 所示，输出结果见图 13.6。\n\n***程序 13.2 几何：删除图元***\n\n![image](img/prog13_2.jpg)\n\n\
  ![image](img/fig13_6.jpg)\n\n图 13.6\n\n几何着色器：图元删除。\n\n![image](img/fig13_7.jpg)\n\
  \n图 13.7\n\n显示背面的图元删除。\n\n代码不需要进行其他更改。注意 `mod` 函数的使用——所有顶点都通过了，除了每三个图元中的第一个顶点，该顶点会被忽略。在这里，渲染背向三角形也可以提高真实感，如图\
  \ 13.7 所示。\n\n## 13.4 添加图元\n\n几何着色器最有趣且强大的用途可能是为正在渲染的模型添加额外的顶点和/或图元。这使得诸如下操作成为可能，例如增加对象的细节以改进高度映射，或完全改变对象的形状。\n\
  \n考虑以下示例，我们将环面中的每个三角形更改为微小的三角形金字塔。\n\n我们的策略与之前的“爆炸式”环面示例类似，如图 13.8](#19_chapter13.html_fig13-8)\
  \ 所示。传入的三角形图元的顶点用于定义金字塔的底部。金字塔的壁由这些顶点以及一个通过原始顶点法线平均值计算的新点（称为“尖点”）组成。然后，通过对从尖点到底部的两个向量取叉积，为金字塔的三个“侧”计算新的法线向量。\n\
  \n![image](img/fig13_8.jpg)\n\n图 13.8\n\n将三角形转换为金字塔。\n\n程序 13.3 中的几何着色器对环面中的每个三角形图元执行此操作。对于每个输入的三角形，它输出三个三角形图元，总共九个顶点。每个新三角形都在函数\
  \ `makeNewTriangle()` 中构建，该函数被调用三次。它计算指定三角形的法线，然后调用函数 `setOutputValues()` 为发射的每个顶点分配相应的输出属性。发射所有三个顶点后，它调用\
  \ `EndPrimitive()`。为了确保照明准确，为每个新创建的顶点计算光方向向量的新值。\n\n***程序 13.3 几何：添加图元***\n\n![image](img/prog13_3.jpg)\n\
  \n![image](img/prog13_3-1.jpg)\n\n![image](img/fig13_9.jpg)\n\n图 13.9\n\n几何着色器：图元添加。\n\
  \n结果输出见图 13.9。如果增加尖峰长度的变量 `sLen`，添加的表面“金字塔”将会更高。然而，在没有阴影的情况下，它们可能看起来不真实。在程序 13.3\
  \ 中添加阴影映射留给读者作为练习。\n\n仔细应用这种技术可以模拟尖刺、刺和其他精细的表面凸起，也可以反之，例如凹陷和陨石 ([DV23], [KS16])。\n\
  \n## 13.5 更改图元类型\n\nOpenGL 允许在几何着色器中切换图元类型。该功能的常见用途是将输入的三角形转换为一个或多个输出线段，模拟毛发或头发。虽然头发仍然是现实世界上难以真实生成的项目之一，但几何着色器可以帮助在许多情况下实现实时渲染。\n\
  \n![image](img/fig13_10.jpg)\n\n图 13.10\n\n将三角形图元转换为线段图元。\n\n程序 13.4 显示了一个几何着色器，它将每个输入的三个顶点三角形转换为向向外的双顶点线段。它首先通过平均三角形顶点的位置来计算发束的起点，从而生成三角形的质心。然后它使用与程序\
  \ 13.3 相同的“尖点”作为头发的终点。输出图元指定为具有两个顶点的线线带（line strip），第一个顶点是起点，第二个顶点是终点。结果见图 13.10，对应一个实例化为\
  \ 72 个切片的环面。\n\n当然，这仅仅是生成完全真实头发的起点。让头发弯曲或移动需要几处修改，例如为线带生成更多顶点，并沿曲线计算它们的位置，和/或引入随机性。由于线段缺乏明显的表面法线，照明变得复杂；在示例中，我们简单地将法线赋值为原始三角形的表面法线。\n\
  \n***程序 13.4 几何：更改图元类型***\n\n![image](img/prog13_4.jpg)\n\n![image](img/prog13_4-1.jpg)\n\
  \n### 补充注释\n\n几何着色器的吸引之一是它们相对容易使用。虽然许多用于几何着色器的应用可以通过曲分化（tessellation）来实现，但几何着色器与曲分化的适用性取决于具体的应用。\n\
