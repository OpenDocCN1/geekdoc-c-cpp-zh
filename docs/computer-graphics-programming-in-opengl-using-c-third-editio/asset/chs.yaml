  \ 1983.\n\n\n\n\n\n### 4. 纹理坐标\n\n4. 根据纹理图像的性质选择纹理坐标。在球体的情况下，存在许多拓扑纹理图像，例如图 6.4\
  \ [VE23] 所示的地球图像。如果我们假设了这种纹理图像，那么通过想象图像如图 6.5 所示“包裹”在球面上，我们可以根据图像中纹理素（texels）对应的相应位置为每个顶点分配纹理坐标。\n\
  \n![image](img/fig6_4.jpg)\n\n图 6.4\n拓扑纹理图像 [VE16]。\n\n![image](img/fig6_5.jpg)\n\
  \n图 6.5\n球体纹理坐标。\n\n### 5. 法线向量与索引\n\n通常也希望为每个顶点生成`法线向量`（normal vectors）——即**垂直于模型表面**的向量。我们很快就会第\
  \ 7 章 中将它们用于`光照`（lighting）。\n\n确定法线向量可能是很复杂的，但在球体的情况下，从球心指向顶点的向量恰好等于该顶点的法线向量！图 6.6\
  \ 阐明了这一属性（球心用“星号”标出）。\n\n![image](img/fig6_6.jpg)\n\n图 6.6\n球体顶点法线向量。\n\n某些模型使用`indices`（索引）来定义三角形。注意图\
  \ 6.3 中每个顶点出现在多个三角形中，这会导致每个顶点被多次指定。与其这样做，我们不如每个顶点只存储一次，然后为三角形的每个角指定索引，以引用所需的顶点。由于我们需要存储顶点的位置、纹理坐标和法线向量，这可以有助于节省大型模型的内存。\n\
  \n顶点存储在一个一维数组中，从最底部的水平切片顶点开始。当使用索引时，关联的索引数组包含每个三角形角的条目。其内容是指向顶点数组的整数引用（具体为下标）。假设每个切片包含\
  \ `n` 个顶点，则顶点数组将如图 6.7 所示，以及相应索引数组的示例部分。\n\n我们可以从球体底部开始，绕每个水平切片循环地遍历顶点。当我们访问每个顶点时，我们构建两个三角形，在其上方和右侧形成一个正方形区域，如之前的图\
  \ 6.3 所示。因此处理过程组织为嵌套循环，如下：\n\n![image](img/fig6_7.jpg)\n\n图 6.7\n顶点数组及相应的索引数组。\n\
  \n![image](img/pg133.jpg)\n\n例如，考虑图 6.3 中的“红色”顶点（在图 6.8 中重复）。该顶点位于图 6.8 所示黄色三角形的左下角，根据刚才描述的循环，其索引将为\
  \ `i*n+j`，其中 `i` 是当前处理的切片（外层循环），`j` 是该切片内当前处理的顶点（内层循环），`n` 是每个切片的顶点数。图 6.8 显示了该顶点（红色）以及它的三个相关的相邻顶点，每个顶点都有显示它们如何被索引的公式。\n\
  \n![image](img/fig6_8.jpg)\n\n图 6.8\n为 `ith` 切片中的 `jth` 顶点生成的索引（`n = 每个切片的顶点数`）。\n\
  \n这四个顶点随后被用于构建为该（红色）顶点生成的两个三角形（用黄色所示）。索引表中用于这两个三角形的六个条目如图所示，按数字 1 到 6 的顺序排列。注意，条目\
  \ 3 和 6 都指向同一个顶点，条目 2 和 4 也是如此。当我们到达高亮显示的红色顶点（即 `vertex[i*n+j]`）时，定义的两个三角形由这六个顶点构建而成——一个由标记为\
  \ 1, 2, 3 的条目引用 `vertex[i*n+j]`、`vertex[i*n+j+1]` 和 `vertex[(i+1)*n+j]` 组成；另一个由标记为\
  \ 4, 5, 6 的条目引用三个顶点 `vertex[i*n+j+1]`、`vertex[(i+1)*n+j+1]` 和 `vertex[(i+1)*n+j]`\
  \ 组成。\n\n程序 6.1 显示了我们作为名为 `Sphere` 的类的球体模型实现。生成的球体中心位于原点。还显示了使用 `Sphere` 的代码。注意，每个顶点都存储在包含\
  \ `glm` 类 `vec2` 和 `vec3` 实例的 C++ `vector` 中（这与之前的示例不同，之前顶点存储在 float 数组中）。`vec2`\
  \ 和 `vec3` 包含了获取所需的 float 类型的 x, y, z 分量的方法。由于纹理完全包裹球体，我们需要在每个切片边界处（如图 6.8 所示在 `Sphere`\
  \ 类中定义的）放置一个额外的顶点。因此，顶点的总数为 `(prec+1)*(prec+1)`。由于每个顶点生成六个三角形索引，总数为 `prec*6`。\n\n\
  ```\n程序 6.1 程序化生成球体\n```\n\n![image](img/fig6_1.jpg)\n\n![image](img/fig6_2.jpg)\n\
  \n![image](img/fig6_3.jpg)\n\n![image](img/fig6_4.jpg)\n\n使用 Sphere 时，每个顶点需要三个位置值和一个法向量值，但每个纹理坐标只需要两个值。这反映在\
  \ `Sphere.h` 头文件中 `vertices`、`texCoords` 和 `normals` 的声明中，数据从那里加载到缓冲区。\n\n重要的是，尽管在构建球体过程中使用了索引，但存储在\
  \ VBO 中的最终球体数据并没有利用索引。相反，当 `setupVertices()` 遍历球体索引时，它为每个索引条目在 VBO 中生成了独立的（通常是冗余的）顶点项。OpenGL\
  \ 确实有索引机制，我们在这个示例中没有使用，但在下一个示例中使用。\n\n图 6.9 显示了程序 6.1 的输出，精度为 48。为了清晰，视图经过了旋转。图\
  \ 6.5 中的纹理已如第 5 章 所示加载。\n\n![image](img/fig6_9.jpg)\n\n图 6.9\n纹理球体模型。\n\n许多其他模型可以通过程序化创建，从几何形状到现实物体。最著名的之一是“Utah\
  \ 茶壶”[CH23]，它是由 Martin Newell 在 1975 年开发的，使用了多种贝塞尔曲线和表面。*OpenGL 工具包*（或“GLUT”）[GL23]\
  \ 甚至包含了绘制茶壶的程序（参见图 6.10）。我们在这书中没有介绍 GLUT，但贝塞尔表面在第 11 章 中会有介绍。\n\n![image](img/fig6_10.jpg)\n\
  \n图 6.10\nOpenGL GLUT 茶壶\n\n### 6.2 OpenGL 索引 – 构建圆环\n\n### 6.2.1 圆环\n\n产生圆环的算法可以在各种网站上找到。Paul\
  \ Baker 在他的 OpenGL 凹凸映射教程 [PP07] 中详细描述了如何定义一个圆形切片，然后让该切片绕圆周旋转以形成甜甜圈。图 6.11 显示了两个视图，从侧面和从上方。\n\
  \n\n\n\n圆环（torus）顶点位置的生成方法与构建球面的方法不同。对于圆环，算法将一个顶点放置在原点的右侧，然后通过绕 Z 轴旋转使该顶点在 XY 平面上沿圆周运动，形成一个“环”。然后，将该环沿“内半径”距离向外移动。在构建这些顶点时，会为每个顶点计算纹理坐标和法线向量。每个顶点还会生成一个与圆环表面切的额外向量（称为\
  \ `tangent vector`，切线向量）。\n\n![image](img/fig6_11.jpg)\n\n图 6.11 构建圆环。\n\n额外的圆环顶点通过将原始环绕\
  \ Y 轴旋转形成。每个结果顶点的切线向量和法线向量通过将原始环的切线和法线向量同样绕 Y 轴旋转计算得出。顶点创建后，按环的顺序对其进行遍历，并为每个顶点生成两个三角形。包含这两个三角形的六个索引表项的生成方法与我们构建球体的方法类似。\n\
  \n我们为剩余环选择纹理坐标的策略是：通过排列它们，使得纹理图像的 S 轴环绕圆环水平周长的一半，然后在另一半重复。当我们绕 Y 轴旋转生成圆环时，我们指定一个从\
  \ 1 开始并增加到指定精度（再次称为“prec”）的变量 `ring`。然后，我们将 S 纹理坐标值设置为 `ring*2.0/prec`，使 S 的范围处于\
  \ 0.0 到 2.0 之间，然后按照第 5.10 节所述将纹理填充模式设置为 `GL_REPEAT`。这种方法的动机是为了避免纹理图像在水平方向上显得过度“拉伸”。如果我们确实想要纹理完全环绕圆环拉伸，只需从纹理坐标计算中移除\
  \ `*2.0` 乘因子即可。\n\n在 C++/OpenGL 中构建圆环类的方法与构建 `Sphere` 类几乎完全相同。然而，我们有机会利用 OpenGL\
  \ 对顶点索引的支持，来利用我们在构建圆环时创建的索引（我们之前构建球体时也可以这样做，但当时没有做）。对于具有数千个顶点的非常大的模型，使用 OpenGL 索引可以提高性能，因此我们接下来将描述如何实现。\n\
  \n### 6.2.2 OpenGL 中的索引\n\n在我们的球面和圆环模型中，我们都生成了一个引用到顶点数组的整数索引数组。在球体的情况下，我们使用索引列表来构建一组完整的独立顶点，并像前面章节中的示例那样将它们加载到\
  \ `VBO` 中。实例化圆环并将其顶点、法线等加载到缓冲区中，可以采用与程序 6.1 类似的方法，但这次我们将使用 OpenGL 的索引。\n\n当使用 OpenGL\
  \ 索引时，我们还将索引本身加载到 `VBO` 中。我们额外生成一个 `VBO` 来存储索引。由于每个索引值仅仅是一个整数引用，我们首先将索引数组复制到 C++\
  \ 的整数类型 `vector` 中，然后使用 `glBufferData()` 将该 vector 加载到新增的 `VBO` 中，并指定 `VBO` 的类型为\
  \ `GL_ELEMENT_ARRAY_BUFFER`（这告诉 OpenGL 该 `VBO` 包含索引）。实现此操作的代码可以添加到 `setupVertices()`\
  \ 中：\n\n![image](img/pg140.jpg)\n\n在 `display()` 方法中，我们将 `glDrawArrays()` 调用替换为\
  \ `glDrawElements()` 调用，这告诉 OpenGL 利用索引 `VBO` 来查找要绘制的顶点。我们还通过 `glBindBuffer()` 启用包含索引的\
  \ `VBO`，指定哪个 `VBO` 包含索引以及它是一个 `GL_ELEMENT_ARRAY_BUFFER`。代码如下：\n\n```\nnumTorusIndices\
  \ = myTorus.getNumIndices();\n\nglBindBuffer(GL_ELEMENT_ARRAY_BUFFER, vbo[3]);\n\
  glDrawElements(GL_TRIANGLES, numTorusIndices, GL_UNSIGNED_INT, 0);\n```\n\n有趣的是，用于绘制球面的着色器对于圆环仍然有效且无需更改，即使我们在\
  \ C++/OpenGL 应用中为了实现索引做了更改。OpenGL 能够识别出 `GL_ELEMENT_ARRAY_BUFFER` 的存在并利用它来访问顶点属性。\n\
  \n程序 6.2 显示了一个基于 Baker 实现的 `Torus` 类。`inner` 和 `outer` 变量引用图 6.11 中对应的内半径和外半径。`prec`（“精度”）变量的作用与球体类似，对顶点数量和索引的计算也是类似的。相比之下，确定法线向量比球体时要复杂得多。我们使用了\
  \ Baker 描述中提供的策略，即计算两个切线向量（被 Baker 称为 `sTangent` 和 `tTangent`，但更常被称为“切线”和“副切线”），它们的叉积形成法线。\n\
  \n我们将在教科书剩余部分的许多示例中使用此 `torus` 类（以及早些描述的 `sphere` 类）。\n\n**程序 6.2 过程化生成的圆环**\n\n\
  ![image](img/prog6_2.jpg)\n\n![image](img/prog6_2_1.jpg)\n\n![image](img/prog6_2_2.jpg)\n\
  \n![image](img/prog6_2_3.jpg)\n\n![image](img/prog6_2_4.jpg)\n\n注意代码中的 `Torus` 类在\
  \ `setupVertices()` 中存储数据，而不是每个索引存储一次（正如球体示例所示）。这种差异也反映在 `VBOs` 的大小上。由于 `VBO` 被指定为\
  \ `GL_ELEMENT_ARRAY_BUFFER`，OpenGL 知道该 `VBO` 包含索引。图 6.12 显示了实例化圆环并使用砖块纹理渲染的结果。\n\
  \n![image](img/fig6_12.jpg)\n\n图 6.12 过程化生成的圆环。\n\n### 6.3 加载外部制作的模型\n\n为了在 OpenGL\
  \ 场景中使用我们创建的模型，该模型需要保存（导出）为我们能够读取（导入）的格式。有多种标准的 3D 模型文件格式；再次，多到列不完，但一些示例包括 Wavefront\
  \ (.obj)、3D Studio Max (.3ds)、Stanford Scanning Repository (.ply)、Ogre3D (.mesh)\
  \ 等。最简单的是 Wavefront（通常称为 OBJ），因此我们将研究这一个。\n\nOBJ 文件足够简单，我们可以相对容易地开发一个基础导入器。在 OBJ\
  \ 文件中，文本行指定顶点、纹理坐标、法线和其他信息。它也有一些局限性——例如，OBJ 文件无法指定模型动画。\n\n\n\n其他标签使得存储对象名称、所用材料、曲线、阴影以及许多细节成为可能。我们将讨论限制在上述出的四个标签上，这些标签足以导入各种复杂模型。\n\
  \n假设我们使用 Blender 构建一个简单的金字塔，就像我们在程序 4.3 中开发的那一个。图 6.14 是在 Blender 中创建的类似金字塔的截图：\n\
  \n![image](img/fig6_14.jpg)\n\n图 6.14\n在 Blender 中构建的金字塔。\n\n在 Blender 中，如果我们现在导出金字塔模型，指定格式为\
  \ `.obj`，并让 Blender 输出纹理坐标和顶点法线（normals），就会创建一个包含所有这些信息的 OBJ 文件。生成的 OBJ 文件如图 6.15\
  \ 所示。（纹理坐标的实际值可能会取决于模型的构建方式。）\n\n为了方便参考，我们对 OBJ 文件的重要部分进行了颜色标记。文件开头以 `#` 开头的行是 Blender\
  \ 放置的注释，我们的导入器会忽略它们。紧接着是一行以 `o` 开头，给出对象的名称。我们的导入器也可以忽略此行。随后有一行以 `s` 开头，指定面不应进行平滑处理。我们的代码也会忽略以\
  \ `s` 开头的行。\n\nOBJ 文件中的第一组实质性行是以 `v` 开头的行，标记为蓝色。它们指定了我们的金字塔模型的五个顶点相对于原点的 `X`、`Y`\
  \ 和 `Z` 局部空间坐标，在这种情况下，原点位于金字塔的中心。\n\n![image](img/fig6_15.jpg)\n\n图 6.15\n导出的金字塔\
  \ OBJ 文件。\n\n标记为红色的值（以 `vt` 开头）是各种纹理坐标。纹理坐标列表比顶点长是因为某些顶点参与了多个三角形，在这些情况下可能会使用不同的纹理坐标。\n\
  \n标记为绿色的值（以 `vn` 开头）是各种法向量。这个列表通常也比顶点列表长（尽管在本例中不是），同样是因为某些顶点参与了多个三角形，在这些情况下可能会使用不同的法向量。\n\
  \n文件底部标记为紫色的值（以 `f` 开头）指定了三角形（即“面”）。在本例中，每个面（三角形）有三个元素，每个元素有三个由 `/` 分隔的值（OBJ 也允许其他格式）。每个元素的值分别是指向顶点列表、纹理坐标列表和法向量列表的索引。例如，第三个面是：\n\
  \n```\nf 2 / 7 / 3 5 / 8 / 3 3 / 9 / 3\n```\n\n这表示顶点列表（蓝色）中的第二个、第五个和第三个顶点组成了一个三角形（注意\
  \ OBJ 索引从 1 开始）。相应的纹理坐标是红色部分纹理坐标列表中的第七、第八和第九个。所有三个顶点具有相同的法向量，即绿色部分法向量列表中的第三个。\n\n\
  OBJ 格式的模型并不要求具有法向量，甚至可以不具有纹理坐标。如果模型没有纹理坐标或法线，则面值将仅指定顶点索引：\n\n```\nf 2 5 3\n```\n\
  \n如果模型有纹理坐标但没有法向量，格式如下：\n\n```\nf 2 / 7 5 / 8 3 / 9\n```\n\n而且，如果模型有法线但没有纹理坐标，格式为：\n\
  \n```\nf 2 / / 3 5 / / 3 3 / / 3\n```\n\n模型拥有数万个顶点并不稀见。互联网上有数百种这样的模型可供下载，几乎涵盖每可以想象得到的应用，包括动物、建筑、汽车、飞机、神话生物、人类等模型。\n\
  \n互联网上有各种复杂程度的程序可以导入 OBJ 模型。或者，编写一个非常简单的 OBJ 加载函数相对容易，它可以处理我们过的基础标签（`v`、`vt`、`vn`\
  \ 和 `f`）。程序 6.3 显示了这样一个加载器，尽管它的功能非常有限。它包含一个用于持有任意导入模型的类，该类反过来调用导入器。\n\n在描述我们简单的\
  \ OBJ 导入器中的代码之前，我们必须警告读者其局限性：\n\n- 它只支持包含三个面属性字段的模型。也就是说，顶点位置、纹理坐标和法线必须全部存在且格式为：`f\
  \ #/#/# #/#/# #/#/#`。\n- 经常用于指定纹理文件的材料标签被忽略了——纹理化必须使用第 5 章中描述的方法进行。\n- 只支持由单个三角形网格组成的\
  \ OBJ 模型（OBJ 格式支持由多个网格组成的模型，但我们简单的导入器不支持）。\n- 它假设每行上的元素恰好用一个空格分隔。\n\n如果你有一个不满足上述所有标准的\
  \ OBJ 模型，并且你希望使用程序 6.3 中的简单加载器来导入它，那么这样做可能是可行的。通常可以将此类模型加载到 Blender 中，然后将其导出另一个适应加载器局限性的\
  \ OBJ 文件。例如，如果模型不包含法向量，可以让 Blender 在导出修改后的 OBJ 文件时生成法向量。\n\n我们 OBJ 加载器的另一个局限性与索引有关。观察之前的描述可知，“面”标签允许顶点位置、纹理坐标和法线的混合。例如，两个不同的“面”行可能包含指向相同\
  \ `v` 但不同 `vt` 条目的索引。不幸的是，OpenGL 的索引机制不支持这种灵活性——OpenGL 的索引只能指向特定的顶点及其属性。这使得编写加载器变得有些复杂，因为我们不能简单地将面中的引用复制到索引数组中。相反，使用\
  \ OpenGL 索引需要确保面条目的整个 `v`、`vt` 和 `vn` 值组合在索引数组中都有自己的引用。另一种简单但效率较低的方案是为每个三角形面创建一个新顶点。为了清晰起见，我们在这里选择了这种简单的方法，尽管\
  \ OpenGL 索引具有节省空间的优势。\n\n`ModelImporter` 类包含一个 `parseOBJ()` 函数，它逐行读取 OBJ 文件的每一行，分别处理\
  \ `v`、`vt`、`vn` 和 `f` 四种情况。在每种情况下，提取行中后续数字的方法是使用 `erase()` 跳过初始的 `v`、`vt`、`vn` 或\
  \ `f` 字符，然后使用 `stringstream` 类中的 `>>` 运算符提取每个后续参数值，将其存储在 `float` 向量中。当处理面（`f`）条目时，会根据\
  \ `float` 向量中的相应条目构建顶点。\n\n\n\n\n图 6.16 显示了航天飞机梭的渲染模型，该模型从 NASA 网站 [NA23] 下载为 `OBJ`\
  \ 文件，使用程序 6.3 中的代码导入，并使用程序 5.1 中的代码结合相关的 NASA 纹理图像文件通过向异性过滤进行纹理化。这张纹理图像是`UV-mapping`使用的示例，其中模型中的纹理坐标被仔细地映射到纹理图像的特定区域。（如第\
  \ 5 章所示，`UV-mapping`的细节超出了本书的范围。）\n\n![image](img/fig6_16.jpg)\n\n图 6.16\n\n带有纹理的\
  \ NASA 航天飞机梭模型。\n\n***程序 6.3 简单（有限）OBJ 加载器***\n\n![image](img/prog6_3.jpg)\n\n![image](img/prog6_3_1.jpg)\n\
  \n![image](img/prog6_3_2.jpg)\n\n![image](img/prog6_3_3.jpg)\n\n## 补充说明\n\n尽管我们讨论了使用\
  \ DCC 工具创建 3D 模型，但我们没有讨论如何使用这些工具。虽然此类指令超出了本书的范围，但对于诸如 `Blender` 和 `Maya` 等所有流行工具，都有大量的教程视频材料文档。\n\
  \n3D 建模主题本身就是一个丰富的研究领域。我们在本章中的涵盖仅仅是初步介绍，并重点讨论了它与 `OpenGL` 的关系。许多大学提供完整的 3D 建模课程，鼓励感兴趣学习更多知识的读者查阅一些提供更详细信息的流行资源（例如：[BL23],\
  \ [CH11], [VA12]）。\n\n我们重申，在本章中介绍的 `OBJ` 导入器是有限的，只能处理 `OBJ` 格式支持的部分特征。虽然对于我们的需求足够，但它在处理某些\
  \ `OBJ` 文件时会失败。在这种情况下，必须先将模型加载到 `Blender`（或 `Maya` 等），并将其重新导出为符合本章稍早描述的导入器局限性的 `OBJ`\
  \ 文件。\n\n## 练习题\n\n**6.1** 修改 `Program 4.4`，使得“太阳”、“行星”和“月球”变为带有纹理的 `spheres`，如图\
  \ 4.11 所示。\n\n**6.2** *(项目)* 修改你在练习 6.1 中的程序，使得从图 6.16 导入的 NASA 航天飞机对象也绕着“太阳”运行。你需要尝试应用于航天飞机的缩放和旋转，使其看起来真实。\n\
  \n**6.3** *(研究与项目)* 学习使用 `Blender` 创建自己的 3D 对象的知识。为了在你的 `OpenGL` 应用中充分利用 `Blender`，你需要学习如何使用\
  \ `Blender` 的 `UV-unwrapping` 工具生成纹理坐标和相关的纹理图像。然后你可以将对象导出为 `OBJ` 文件，并使用程序 6.3 中的代码加载它。\n\
