  \n# 第 7 章\n\n## 光照\n\n7.1 *光照模型*\n\n7.2 *光源*\n\n7.3 *材质*\n\n7.4 *ADS 光照计算*\n\n7.5\
  \ *实现 ADS 光照*\n\n7.6 *结合光照与纹理*\n\n*补充说明\n\n*历史说明\n\n![image](img/common.jpg)\n\n\
  光影响物体的外观。当手电筒照向物体时，我们预期面向太阳的一侧会更亮。物体对光的反应也不同。考虑两个物体，一个是钢制的——后者看起来更“亮”。\n\n## 7.1\
  \ 光照模型\n\n光是能量源发射的光子经过多次反弹的结果，直到部分光子进入我们的眼睛。遗憾的是，在计算上模拟这一点是不可行的，因此我们需要光照模型。光照模型有时被称为着色模型，尽管在有着色器的情况下这可能会引起混乱。今天最常用的光照模型被称为“ADS”模型，因为它们基于三种反射类型：\n\
  \n- **A**mbient（环境反射）模拟对所有对象的低水平照明。\n- **D**iffuse（漫反射）根据光线角度以不同程度照亮物体。\n- **S**pecular（高光反射）通过在光反射到我们眼睛的地方放置合适大小的高光来传递物体的光泽。\n\
  \n我们将尽量坚持使用简单的术语。\n\n## 7.2 光源\n\n许多许多光源，每种都有不同的特性，并需要不同的步骤来模拟其效果。类型包括：\n\n- 全局（通常称为“全局环境”，因为它只包含环境组件）\n\
  - 方向光（或“远光”）\n- 位置光（或“点光源”）\n- 聚光灯\n\n***全局*** ***环境***光是最简单的光源类型。全局环境光没有光源位置——在场景中每个物体的每个像素处光都是相等的，无论物体在哪里。全局环境光照模拟了现实世界中的现象：光反弹多次，以至于其来源和方向无法确定。全局环境光只有一个环境组件，指定为\
  \ RGBA 值；它没有漫反射或高光组件。例如，全局环境光可以定义如下：\n\n\n\n\n\n```cpp\nfloat globalAmbient[4] =\
  \ { 0.6f, 0.6f, 0.6f, 1.0f };\n```\n\n`RGBA` 值的范围从 0 到 1，因此全局环境光通常被建模为弱白光，其中每个 `RGB`\
  \ 值被设置为 0 到 1 之间的相同分数，而 alpha 值被设置为 1。\n\n`Directional`（定向光）或 `distant`（远光）也没有光源位置，但它们有一个\
  \ `direction`（方向）。适用于光源非常远以光线实际上平行的的情况，例如来自太阳的光。在许多此类情况下，我们可能只对光建模感兴趣，而不对产生光的物体感兴趣。定向光对物体的影响取决于光线的入射角；面向定向光的一侧物体比切线侧或对侧更亮。建模定向光需要指定它的方向（作为向量）以及它的环境、漫反射和反射特性（作为\
  \ `RGBA` 值）。一个指向 Z 轴负方向的红色定向光可以如下所示指定：\n\n```cpp\nfloat dirLightAmbient[4] = { 0.1f,\
  \ 0.0f, 0.0f, 1.0f };\nfloat dirLightDiffuse[4] = { 1.0f, 0.0f, 0.0f, 1.0f };\n\
  float dirLightSpecular[4] = { 1.0f, 0.0f, 0.0f, 1.0f };\nfloat dirLightDirection[3]\
  \ = { 0.0f, 0.0f, -1.0f };\n```\n\n当我们已经有了全局环境光时，为光包含一个环境光贡献似乎是多余的。然而，这两者的分离是有意为之的，并且当光“开启”或“关闭”时非常明显。当光“开启”时，总的环境贡献将如预期的那样会增加。在上面的示例中，我们只为光包含了一小部分环境贡献。根据场景需要平衡这两种贡献是非常重要的。\n\
  \n`Positional`（点位置）光在 3D 场景中有一个特定的位置。靠近场景的光源，如灯、蜡烛等都是例子。和定向光一样，点位置光的影响取决于入射角；但是，它的方向没有指定，因为我们场景中每个顶点的方向都是不同的。点位置光还可能包含\
  \ `attenuation factors`（衰减因子），以建模其强度随距离增加而减小。与我们看到的其他类型的光一样，点位置光具有指定为 `RGBA` 值的环境、漫反射和反射属性。例如，位于\
  \ (5, 2, -3) 的红色点位置光可以如下所示指定：\n\n```cpp\nfloat posLightAmbient[4] = { 0.1f, 0.0f,\
  \ 0.0f, 1.0f };\nfloat posLightDiffuse[4] = { 1.0f, 0.0f, 0.0f, 1.0f };\nfloat posLightSpecular[4]\
  \ = { 1.0f, 0.0f, 0.0f, 1.0f };\nfloat posLightLocation[3] = { 5.0f, 2.0f, -3.0f\
  \ };\n```\n\n衰减因子可以通过多种方式建模。一种方法是包含可调的非负参数，分别对应 `constant`（常数）、`linear`（线性）和 `quadratic`（二次）衰减（`k[c]`、`k[l]`\
  \ 和 `k[q]`）。这些参数随后被结合，并考虑到与光源的距离 (`d`）：\n\n![image](img/pg162.jpg)\n\n将此因子乘以光强，会导致距离光源的距离越远，强度就越小。注意，`k[c]`\
  \ 应该始终设置为大于或等于 1.0，且其他参数中至少有一个大于 0.0，这样衰减因子始终处于 [0..1] 范围内，并随着距离 `d` 的增加而趋于 0。\n\
  \n`Spotlights`（聚光灯）既有位置也有方向。聚光灯“锥体”的效果可以使用 0° 到 90° 之间的 `cutoff angle`（截止角）θ 来模拟，指定光束的半宽度，并使用\
  \ `falloff exponent`（衰减指数）来建模强度跨光束角度的变化。如图 7.2 所示，我们确定聚光灯方向与从聚光灯到像素点的向量之间的角 ϕ。然后，当\
  \ ϕ 小于 θ 时，通过将 ϕ 的余弦的衰减指数幂来计算 `intensity factor`（强度因子）（当 ϕ 大于 θ 时，强度因子设置为 0）。结果是一个从\
  \ 0 到 1 的强度因子。衰减指数调整了强度因子随角 ϕ 增加而趋于 0 的速率。然后将强度因子乘以光强以模拟锥体效果。\n\n位于 (5,2,-3) 指向\
  \ Z 轴负方向的红色聚光灯可以指定为：\n\n```cpp\nfloat spotLightAmbient[4] = { 0.1f, 0.0f, 0.0f,\
  \ 1.0f };\nfloat spotLightDiffuse[4] = { 1.0f, 0.0f, 0.0f, 1.0f };\nfloat spotLightSpecular[4]\
  \ = { 1.0f,0.0f, 0.0f, 1.0f };\nfloat spotLightLocation[3] = { 5.0f, 2.0f, -3.0f\
  \ };\nfloat spotLightCutoff = 20.0f;\nfloat spotLightExponent = 10.0f;\n```\n\n\
  ### 7.3 材料\n\n场景中物体的“外观”到目前完全由颜色和纹理处理。光亮的引入允许我们还考虑表面的 `reflectance`（反射率）特性。这意味着物体如何与其相互作用。\n\
  \n在 ADS 光照模型中，可以通过指定四个值来模拟材料，其中三个我们已经熟悉——环境色、*diffuse*（漫反射）和 *specular*（高光）颜色。第四种是\
  \ *shininess*（光泽度），正如我们将看到的，它被用于为目标材料构建合适的高光。ADS 和光泽度值已针对许多不同的材料进行了开发。例如，“锡”（pewter）可以如下指定：\n\
  \n```cpp\nfloat pewterMatAmbient[4] = { 0.11f, 0.06f, 0.11f, 1.0f };\nfloat pewterMatDiffuse[4]\
  \ = { 0.43f, 0.47f, 0.54f, 1.0f };\nfloat pewterMatSpecular[4] = { 0.33f, 0.33f,\
  \ 0.52f, 1.0f };\nfloat pewterMatShininess = 9.85f;\n```\n\n有时其他属性包含在材料属性中。*Transparency*（透明度）通过\
  \ RGBA 规范中的第四通道（或“alpha”）通道处理，该通道指定不透明度；1.0 表示完全不透明，0.0 表示完全透明。大多数材料设置为 1.0，但对于某些材料，微小的透明度起作用。例如，在图\
  \ 7.3 中，注意“玉”和“珍珠”材料包含少量透明度（小于 1.0 的值）。\n\n*Emission*（发射）有时也包含在 ADS 材料规格中。这对于模拟发光材料（例如荧光材料）非常有用。\n\
  \n![image](img/fig7_3.jpg)\n\n图 7.3 材料 ADS 和光泽度系数。\n\n当渲染没有纹理的物体时，通常指定材料特性是理想的。因此，如果能有一些预定义的材料供我们使用将非常方便。因此，我们在“Utils.cpp”文件中添加了以下代码：\n\
  \n```cpp\n// GOLD material - 环境、漫反射、反射和光泽度\n```\n\n\n\n\n\n```cpp\nfloat* Utils::goldAmbient()\
  \ { static float a[4] = { 0.2473f, 0.1995f, 0.0745f, 1 }; return (float*)a; }\n\
  float* Utils::goldDiffuse() { static float a[4] = { 0.7516f, 0.6065f, 0.2265f, 1\
  \ }; return (float*)a; }\nfloat* Utils::goldSpecular() { static float a[4] = { 0.6283f,\
  \ 0.5558f, 0.3661f, 1 }; return (float*)a; }\nfloat Utils::goldShininess() { return\
  \ 51.2f; }\n\n// 银材质 - 环境光, 漫反射, 高光反射和光泽度\nfloat* Utils::silverAmbient() { static\
  \ float a[4] = { 0.1923f, 0.1923f, 0.1923f, 1 }; return (float*)a; }\nfloat* Utils::silverDiffuse()\
  \ { static float a[4] = { 0.5075f, 0.5075f, 0.5075f, 1 }; return (float*)a; }\n\
  float* Utils::silverSpecular() { static float a[4] = { 0.5083f, 0.5083f, 0.5083f,\
  \ 1 }; return (float*)a; }\nfloat Utils::silverShininess() { return 51.2f; }\n\n\
  // 青铜材质 - 环境光, 漫反射, 高光反射和光泽度\nfloat* Utils::bronzeAmbient() { static float a[4]\
  \ = { 0.2125f, 0.1275f, 0.0540f, 1 }; return (float*)a; }\nfloat* Utils::bronzeDiffuse()\
  \ { static float a[4] = { 0.7140f, 0.4284f, 0.1814f, 1 }; return (float*)a; }\n\
  float* Utils::bronzeSpecular() { static float a[4] = { 0.3935f, 0.2719f, 0.1667f,\
  \ 1 }; return (float*)a; }\nfloat Utils::bronzeShininess() { return 25.6f; }\n```\n\
  \n这使得在 `init()` 函数或顶层声明中指定对象具有某种材质（例如“金色”）变得非常容易，如下：\n\n```cpp\nfloat* matAmbient\
  \ = Utils::goldAmbient();\nfloat* matDiffuse = Util::goldDiffuse();\nfloat* matSpecular\
  \ = util.goldSpecular();\nfloat matShininess = util.goldShininess();\n```\n\n请注意，到目前这些章节中我们描述的光照和材质属性的代码*并没有实际执行光照计算*。它仅仅提供了一种指定和存储场景中元素所需的光照和材质属性的方法。我们仍然需要自己实际计算光照。这将在着色器代码中进行一些复杂的数学处理。现在，让我们深入研究在\
  \ C++/OpenGL 和 GLSL 图形程序中实现 ADS 光照的细节。\n\n## 7.4 ADS 光照计算\n\n当我们绘制场景时，请记住每个顶点都经过变换，以便在\
  \ 2D 屏幕上模拟 3D 世界。像素颜色是光栅化以及纹理和插值的结果。我们现在必须引入一个额外的步骤，即调整这些光栅化的像素颜色，以影响场景中的光照和材质。我们需要执行的基本\
  \ ADS 计算是确定每个像素的反射强度 *(I)*。该计算采用如下形式：\n\n![image](img/pg166.jpg)\n\n也就是说，我们需要为每个像素、每个每个光源，计算并累加环境光、漫反射和高光反射的贡献。这自然取决于场景中光源的类型以及与渲染模型关联的材质类型。\n\
  \n### **环境（Ambient）** 贡献是最简单的。它是指定的环境光与材质指定的环境系数的乘积：\n\n![image](img/pg166-1.jpg)\n\
  \n考虑到光照和材质强度是通过 RGB 值指定的，更精确的计算方式为：\n\n![image](img/pg167.jpg)\n\n### **漫反射（Diffuse）**\
  \ 贡献更为复杂，因为它取决于光源与表面之间的入射角。朗伯余弦定律（发表于 1760 年）规定，从表面反射的光量与光入射角的余弦成正比。这可以建模如下：\n\n\
  ![image](img/pg167-1.jpg)\n\n与一样，实际计算涉及红、绿、蓝分量。\n\n确定入射角 θ 需要我们 (a) 找到一个从绘制像素到光源的向量（或者类似的，与光方向相反的向量），以及\
  \ (b) 找到一个与渲染对象表面法（垂直）的向量。让我们分别将这些标记为 ![image](img/l-arrow.jpg) 和 ![image](img/n-arrow.jpg)，如图图\
  \ 7.4 所示：\n\n![image](img/fig7_4.jpg)\n\n图 7.4 光的入射角。\n\n取决于场景中光的性质，![image](img/l-arrow.jpg)\
  \ 可以通过取光方向向量的反方向或计算从像素位置到光源位置的向量来获得。确定向量 ![image](img/n-arrow.jpg) 可能更为——渲染模型的顶点可能可用法线，但如果模型不包含法线，则\
  \ ![image](img/n-arrow.jpg) 需要根据相邻顶点的位置进行几何估计。在本章的剩余部分中，我们假设渲染的模型包含每个顶点的法线（这在用 Maya\
  \ 或 Blender 等建模工具构建的模型中很常见）。\n\n事实证明，在这种情况下，没有必要计算 θ 本体。我们真正想要的是 `cos(θ)`，回想 第 3\
  \ 章，这可以通过*点积*找到。因此，漫反射贡献可以如下进行计算：\n\n![image](img/pg168.jpg)\n\n漫反射贡献仅在表面暴露于光下时才有效，即发生在\
  \ -90 ≤ θ ≤ 90 时。\n\n### **高光（Specular）** 贡献\n\n高光贡献决定了渲染像素是否应该变亮。它不仅涉及光源的入射角，还涉及反射方向与视角（“眼睛”）之间的角度。\n\
  \n![image](img/fig7_5.jpg)\n\n图 7.5 视角。\n\n在 图 7.5 中，![image](img/l-arrow.jpg) 代表光的反射方向，而\
  \ ![image](img/r-arrow.jpg) 和 ![image](img/v-arrow.jpg) 之间的角度 φ 越小，眼睛越对齐或“看向”反射，该像素对高光的贡献就越大（因此看起来也越亮）。\n\
  \n光泽度通常用一个随角度 φ 增加而快速减到零的衰减函数来建模。可以使用衰减，并通过使用余弦函数的幂次增加或减少光泽度，例如 `cos(φ)`、`cos²(φ)`、`cos³(φ)`、`cos¹⁰(φ)`、`cos⁵⁰(φ)`\
  \ 等，如图 7.6](#13_chapter07.html_fig7-6) 所示。\n\n![image](img/fig7_6.jpg)\n\n图 7.6\
  \ 使用余弦指数建模的光泽度。\n\n注意，指数值越高，衰减越快，因此偏离视角轴的光反射像素的高光贡献就越小。我们将指数 `n`（如在 `cos^n(φ)` 衰减函数中所使用的）称为指定材质的*光泽因子*。回想图\
  \ 7.3](#13_chapter07.html_fig7-3)，列出的每个材质的光泽因子都在最右侧列出。\n\n我们现在可以指定完整的高光计算：\n\n![image](img/pg169.jpg)\n\
  ```\n\n\n\n\n\n注意，我们使用 `max()` 函数的方式与之前处理扩散计算时类似。在这种情况下，我们需要确保高光贡献绝不会利用 `cos(φ)`\
  \ 的负值，否则可能会产生奇异的伪影，例如“变暗”的高光高亮点。\n\n当然，和之前一样，实际计算涉及红、绿、蓝分量。\n\n## 7.5 实现 ADS 光照\n\
  \n第 7.4 节中描述的计算到目前为止大多是理论性的，因为它们假设我们可以对每个像素执行这些计算。但由于法线 (![image](img/n-arrow.jpg))\
  \ 向量通常只对定义模型的顶点可用，而对每个像素无效，这使得问题变得复杂。因此，我们要么需要为每个像素计算法线（这可能非常耗时），要么找到某种方法来估计所需的值以达到足够的效果。\n\
  \n一种方法被称为“分面着色”（faceted shading）或“平直着色”（flat shading）。在这里，我们假设每个渲染原型（即多边形或三角形）中的每个像素都具有相同的光照值。因此，我们只需对模型中每个多边形的一个顶点进行光照计算，然后以每个多边形或三角形为单位将这些光照值复制到附近的渲染像素上。\n\
  \n分面着色在今天很少使用，因为生成的图像往往看起来不那么真实，而且现代硬件使得更准确的计算成为可能。一个分面着色环面的示例（其中每个三角形都表现为平坦的反射表面）所示于图\
  \ 7.7。\n\n![image](img/fig7_7.jpg)\n\n图 7.7\n\n带有分面着色的环面。\n\n尽管分面着色在某些情况下是可以的（或作为一种故意的效果），但通常更好的方法是“平滑着色”（smooth\
  \ shading），即为每个像素计算光照强度。平滑着色之所以可行，是因为现代显卡上的并行处理能力，以及 OpenGL 图形流水线中发生的插值渲染。\n\n我们将检查两种流行的平滑着色方法：*高罗德着色*（Gouraud\
  \ shading）和*冯光着色*（Phong shading）。\n\n### 7.5.1 高罗德着色\n\n法国计算机科学家 Henri Gouraud 在\
  \ 1971 年发表了一种平滑着色算法，这种算法被称为*高罗德着色*（Gouraud shading）[GO71]。它特别适用于现代显卡，因为它利用了 OpenGL\
  \ 等 3D 图形流水线中提供的自动插值渲染。高罗德着色的过程如下：\n\n1. 确定每个*顶点*的颜色，结合光照计算。\n2. 允许这些颜色通过法线光栅化过程插值到中间像素中（这在实际上也插值了光照贡献）。\n\
  \n在 OpenGL 中，这意味着大部分光照计算将在顶点着色器中完成。片段着色器（fragment shader）将仅仅作为一个透传，以便显示自动插值的光照颜色。\n\
  \n图 7.8 概述了我们在具有一个环面和一个位置光源的场景中，使用 OpenGL 实现高罗德着色器的策略。该策略在程序 7.1 中实现。\n\n![image](img/fig7_8.jpg)\n\
  \n图 7.8\n\n实现高罗德着色。\n\n***程序 7.1 带有位置光源和高罗德着色的环面***\n\n![image](img/prog7_1.jpg)\n\
  \n![image](img/prog7_1-1.jpg)\n\n![image](img/prog7_1-2.jpg)\n\n![image](img/prog7_1-3.jpg)\n\
  \n程序 7.1 的大部分元素应该是熟悉的。定义了环面、光源和材质属性。环面顶点和相关的法线被加载到缓冲区。`display()` 函数与之前的程序类似，不同之处在于还向顶点着色器发送了光和材质信息。为了做到，它调用了\
  \ `installLights()`，该函数将光源位置以及光和材质的 ADS 特性加载到相应的 uniform 变量（uniform variables）中，以便着色器可以使用。请注意，出于性能考虑，我们提前声明了这些\
  \ uniform  位置变量。\n\n一个重要的细节是，用于将顶点位置移动到世界空间的变换矩阵 `M` 并不总是能正确地将*法线向量*调整到世界空间。简单地将\
  \ `M` 矩阵应用于法线并不能保证它们保持与物体表面垂直。正确的变换是 `M` 的*逆转置*（inverse transpose），正如之前第 3 章 补充笔记中所述。在程序\
  \ 7.1 中，这个名为 `invTrMat` 的额外矩阵通过 uniform 变量发送到着色器。\n\n变量 `lightPos` 包含光源的位置，但它是浮点数组形式。这便于将光源的世界位置作为\
  \ uniform 发送到顶点着色器中。\n\n着色器显示在程序 7.1 的后续部分。顶点着色器使用了一些我们尚未见过的符号。例如注意顶点着色器末尾进行的向量加法——向量加法在第\
  \ 3 章 中描述过，并像此处 GLSL 所示的形式可用。在介绍着色器后，我们将讨论其他一些符号。\n\n***（程序 7.1，继续）***\n\n![image](img/prog7_1-4.jpg)\n\
  \n![image](img/prog7_1-5.jpg)\n\n程序 7.1 的输出如图 7.9 所示。\n\n程序 7.1 的输出如图 7.9 所示。\n\n\
  程序 7.1 的输出如图 7.9 所示。\n\n程序 7.1 的输出如图 7.9 所示。\n\n顶点着色器包含了我们第一次使用结构体（struct）符号的示例。GLSL\
  \ 结构就像数据类型；它有一个名称和一组字段。当使用结构体声明变量时，此后可以引用它的字段 `light.ambient`、`light.diffuse` 等。\n\
  \n![image](img/fig7_9.jpg)\n\n图 7.9\n\n带有分面着色的环面。\n\n还要注意顶点着色器多处的字段选择器 `.xyz`。这是将\
  \ vec4 转换为仅包含其三个元素的 vec3 的快捷方法。\n\n顶点着色器是执行大部分光照计算的地方。对于每个顶点，相应的变换应用于顶点位置和相关的法线，并计算光方向\
  \ (![image](img/l-arrow.jpg)) 和反射向量 (![image](img/r-arrow.jpg))。然后执行第 7.4 节中描述的\
  \ ADS 计算，为每个顶点得到一个颜色（代码中称为 `varyingColor`）。颜色作为法线光栅化过程的一部分进行插值。片段着色器只是一个简单的透传。大量的\
  \ uniform 变量声明也出现在片段着色器中（原因在之前的第 4 章 中描述），但它们都没有被实际使用。\n\n注意 GLSL 函数 `normalize()`（将向量转换为单位长度，这对于正确应用点积是必要的）和\
  \ `reflect()`（计算一个向量关于另一个向量的反射）。\n\n伪影在图 7.9 所示的输出环面上显而易见。高光呈现出块状的、分面的外观。这种伪影在物体运动时会更加明显（我们在这里无法说明这一点）。\n\
  \n高罗德着色容易受到其他伪影的影响。如果高光完全包含在模型的任意三角形内——也就是说它不包含模型的至少一个顶点——那么它可能会完全消失。\n\n\n\n\n\n\
  Bui Tuong Phong 在犹他大学攻读研究生期间开发了一种平滑着色算法，并在他 1973 年的论文 [PH73] 中描述了它，并在 [PH75] 中发表。该算法的结构与\
  \ Gouraud 着色算法相似，不同之处在于光照计算是逐像素（per-pixel）而非逐顶点。由于光照计算需要法向量 `![image](img/n-arrow.jpg)`\
  \ 和光向量 `![image](img/l-arrow.jpg)`，而这些在模型中仅以逐顶点的形式存在，因此 Phong 着色通常使用一种巧妙的“技巧”来实现，即\
  \ `![image](img/n-arrow.jpg)` 和 `![image](img/l-arrow.jpg)` 在顶点着色器中计算，并在栅化过程中进行插值（interpolated）。图\
  \ 7.10 概述了该策略：\n\n![image](img/fig7_10.jpg)\n\n图 7.10\n\n实现 Phong 着色。\n\nC++/OpenGL\
  \ 代码完全保持不变。之前在顶点着色器中进行的一些计算现在移动到了片元着色器中。插值法向量的效果如图 7.11 所示：\n\n![image](img/fig7_11.jpg)\n\
  \n图 7.11\n\n法向量的插值。\n\n我们现在准备好使用 Phong 着色实现带有位置光照的圆环。大部分代码与用于 Gouraud 着色的代码相同。由于\
  \ C++/OpenGL 代码未更改，我们仅展示修改后的顶点和片元着色器，如程序 7.2 所示。观察程序 7.2 的输出（如图 7.12 所示），Phong 着色修正了\
  \ Gouraud 着色中存在的伪影。\n\n![image](img/fig7_12.jpg)\n\n图 7.12\n\n带有 Phong 着色的圆环。\n\n\
  ***程序 7.2 带有 Phong 着色的圆环***\n\n```\n![image](img/prog7_2.jpg)\n![image](img/prog7_2-1.jpg)\n\
  ```\n\n尽管 Phong 着色比 Gouraud 着色具有更好的真实感，但它会带来性能开销。James Blinn 在 1977 年提出了一种对 Phong\
  \ 着色的优化方案 [BL77]，被称为 `Blinn-Phong` 反射模型。它是基于这样一种观察：Phong 着色中最昂贵的计算之一是确定反射向量 `![image](img/r-arrow.jpg)`。\n\
  \nBlinn 观察到向量 `![image](img/r-arrow.jpg)` 本身并不需要的——`![image](img/r-arrow.jpg)` 仅作为确定角度\
  \ `φ` 的手段而产生。事实证明不需要计算 `![image](img/r-arrow.jpg)` 找到 `φ`，而是通过计算一个位于 `![image](img/l-arrow.jpg)`\
  \ 和 `![image](img/v-arrow.jpg)` 之间的中间向量 `![image](img/h-arrow.jpg)`。如图 7.13 所示，`![image](img/h-arrow.jpg)`\
  \ 和 `![image](img/n-arrow.jpg)` 之间的角度 `α` 通常接近 `½(φ)`。虽然 `α` 等同于 `φ`，但 Blinn 表明使用\
  \ `α` 代替 `φ` 可以获得良好的结果。\n\n![image](img/fig7_13.jpg)\n\n图 7.13\n\nBlinn-Phong 反射。\n\
  \n“半角”向量 `![image](img/h-arrow.jpg)` 最简单的确定方法是找到 `![image](img/l-arrow.jpg)` `![image](img/v-arrow.jpg)`（见\
  \ 图 7.14），之后可以使用点积 `![image](img/pg180.jpg)` 找到 `cos(α)`。\n\n![image](img/fig7_14.jpg)\n\
  \n图 7.14\n\nBlinn-Phong 计算。\n\n![image](img/fig7_15.jpg)\n\n图 7.15\n\n带有 Blinn-Phong\
  \ 着色的圆环。\n\n这些计算可以在片元着色器中完成，如果为了性能需要，甚至可以在顶点着色器中（经过一些微调）完成。图 7.15 显示了使用 Blinn-Phong\
  \ 着色渲染的圆环；其质量与 Phong 着色基本无异，但节省了大量的性能成本。\n\n程序 7.3 显示了修改后的顶点和片元着色器，用于将程序 7.2 所示的\
  \ Phong 着色示例转换为 Blinn-Phong 着色。与之前一样，C++/OpenGL 代码没有更改。\n\n***程序 7.3 带有 Blinn-Phong\
  \ 着色的圆环***\n\n```\n![image](img/prog7_3.jpg)\n![image](img/fig7_16.jpg)\n```\n\n\
  图 7.16\n\n带有 Phong 着色的外部模型。\n\n图 7.16 显示了 Phong 着色对复杂的外部生成模型效果的两个示例。上面的图像显示了由 Jay\
  \ Turberville 在 Studio 522 Productions 中 [TU18] 创建的海豚 OBJ 模型渲染图。下面的图像是著名的“斯坦福龙”渲染图，它是\
  \ 1996 年对真实模型进行的 3D 扫描结果 [TU18]。\n\n## 7.6 光照与纹理的结合\n\n到为止，我们的光照模型假设使用的是 ADS 值。但某些对象的表面是由纹理定义的。我们结合光照和纹理的方式取决于对象的性质及其纹理的目的。有几种场景，包括：\n\
  \n- 纹理图像反映对象的真实外观。\n- 对象既有材质又有纹理。\n- 纹理包含阴影或反射信息。\n- 涉及多个光源和/或纹理。\n\n让我们考虑第一种情况，有一个带纹理的对象，并希望为其添加光照。在片元着色器中实现此点的一种简单方法是完全移除材质规格，并使用从纹理返回的颜色代替材质值。以下是这种策略的伪代码表示：\n\
  \n```\nfragColor = textureColor * ( ambientLight + diffuseLight )\n```\n\n在这里，纹理颜色有助于环境光和漫反射计算，而反射光完全由光照决定。对于金属或“发光”表面，通常仅根据光照设置反射贡献。然而，某些发光表面（如织物或未上漆的木材，甚至某些金属如黄金）包含物体颜色的反射光。在这些情况下，合适的修改策略是：\n\
  \n```\nfragColor = textureColor * ( ambientLight + diffuseLight + specularLight\
  \ )\n```\n\n还有一些情况是对象具有纹理补充的 ADS 材质，例如一个银制物体，其纹理为表面增加了污斑。在这些情况下，之前章节描述的带有光和材质的标准\
  \ ADS 模型可以通过加权和与纹理颜色结合。例如：\n\n```\ntextureColor = texture(sampler, texCoord)\nlightColor\
  \ = (ambLight * ambMaterial) + (diffLight * diffMaterial) + specLight\nfragColor\
  \ = 0.5 * textureColor + 0.5 * lightColor\n```这种结合光照、材质和纹理的策略可以扩展到涉及多个光源和/或多个纹理的场景。例如：\n\
  \n![image](img/pg184.jpg)\n\n图 7.17 显示了带有 UV 映射纹理图像的 Studio 522 海豚（由 Jay Turberville\
  \ 创建 [TU18]），以及我们在第 6 章 中看到的 NASA 航天器模型。这两个纹理模型都使用了 Blinn-Phong 光照增强，不包含材质，反射光仅利用光照。\n\
  \n\n\n\n请注意，确定 `fragColor` 的计算可能会产生大于 1.0 的值。发生这种情况时，OpenGL 会将计算值限制为 1.0。\n\n##\
  \ 补充说明\n\n在图 7.7 中所示的分面着色环面是通过在顶点着色器和片元着色器相应的法向量顶点属性声明中添加“flat”插值修符创建的。这指示光栅化器*不*对指定的变量进行插值，而是为每个片元分配相同的值（默认选择与三角形中第一个顶点关联的值）。在\
  \ Phong 着色示例中，可以像这样实现：\n\n![image](img/fig7_17.jpg)\n\n图 7.17\n\n光照与纹理的结合。\n\n![image](img/pg185.jpg)\n\
  \n我们还没有讨论的一种重要光源是*漫射光*或*面积光*，其特征是光源占据一个区域而不是单个点位置。现实世界的例子是办公室或教室中常见的荧光灯管。感兴趣的读者可以在\
  \ [MH18] 中了解此类照明细节。\n\n### 历史说明\n\n我们冒昧对本章中关于 Gouraud 和 Phong 贡献的一些术语进行了简化。Gouraud\
  \ 被归功 *Gouraud 着色*——即通过计算顶点处的光照强度并允许光栅化器插值这些值，从而生成平滑曲面表面外观的概念（有时称为“平滑着色”）。Phong\
  \ 被归功 *Phong 着色*，这是另一种平滑着色形式，它插值法线并按每个像素计算光照。Phong 还被誉为成功地将高光引入平滑着色的先驱。由于这个原因，ADS\
  \ 光照模型在应用于计算机图形学时，通常被称为 *Phong 反射模型*。因此，我们的 Gouraud 着色示例，更准确地说，是带有 Phong 反射模型的 Gouraud\
  \ 着色。由于 Phong 反射模型在 3D 图形编程中已变得无处不在，在存在 Phong 反射的情况下演示 Gouraud 着色是很常见的，尽管这有一点误导性，因为\
  \ Gouraud 1971 年的原作例如并没有包含任何高光分量。\n\n### 习题\n\n**7.1***(项目)* 修改程序 7.1，使得可以通过移动鼠标来调整光照位置。完成后，移动鼠标并观察高光的移动以及\
  \ Gouraud 着色伪影的出现。你可能会发现光光源位置渲染一个点（或小对象）很方便。\n\n**7.2** 重复习题 7.1，但应用于程序 7.2。这只需要将用于\
  \ Phong 着色的着色器替换到习题 7.1 的解决方案中。当光照在移动时，从 Gouraud 到 Phong 着色的改进应该更加明显。\n\n**7.3***(项目)*\
  \ 修改程序 7.2，使其包含放置在不同位置的两个位置光。片元着色器需要混合每个光源的漫反射贡献和高光贡献。尝试使用加权和，类似于第 7.6 节中所示的方法。你也可以简单地将它们相加，并限制结果以使其不超过最大光照值。\n\
  \n**7.4***(研究与项目)* 将程序 7.2 中的位置光替换为第 7.2 节中描述的“聚光灯”。尝试*截止角*和*衰减指数*的设置并观察效果。\n\n\
