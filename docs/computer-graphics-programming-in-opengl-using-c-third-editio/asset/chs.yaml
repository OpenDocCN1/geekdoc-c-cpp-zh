  \n# 第 4 章\n\n## 管理 3D 图形数据\n\n- 4.1 缓冲区与顶点属性\n- 4.2 Uniform 变量\n- 4.3 顶点属性的插值\n\
  - 4.4 模型视图矩阵与透视矩阵\n- 4.5 我们的第一个 3D 程序 – 3D 立立方体\n- 4.6 渲染物体的多个副本\n- 4.7 在场景中渲染多个不同的模型\n\
  - 4.8 矩阵栈\n- 4.9 解决“Z-fighting”伪影问题\n- 4.10 原始图的其他选项\n- 4.11 性能优化编码\n- *补充笔记\n\n\
  ![image](img/common.jpg)\n\n使用 OpenGL 渲染 3D 图像通常涉及通过 OpenGL 着色器流水线发送多个数据集。例如，若要绘制一个简单的\
  \ 3D 物体（如立方体），你至少需要发送以下项：\n\n- 立方体模型的顶点\n- 控制立方体在 3D 空间中朝向的一些变换矩阵\n\n为了让情况稍微复杂一点，通过\
  \ OpenGL 流水线发送数据有两种方式：\n\n- 通过 `buffer` 发送到 `vertex attribute`，或\n- 直接发送到 `uniform\
  \ variable`。\n\n准确理解这两种机制的工作原理至关重要，以便对我们发送的每个项使用适当的方法。\n\n让我们从渲染一个简单的立方体开始。\n\n\
  ## 4.1 缓冲区与顶点属性\n\n要绘制一个物体，其顶点必须发送到顶点着色器。顶点通常是通过将它们放在 C++ 端的 `buffer` 中，并将该缓冲区与着色器中声明的\
  \ `vertex attribute` 关联来实现。完成这一目标有几个步骤，其中一些只需要执行一次，而另一些（如果场景是动画的）必须每帧都执行：\n\n执行一次——通常在\
  \ `init()` 中：\n\n1. 创建缓冲区\n2. 将顶点拷贝到缓冲区\n\n每帧执行——通常在 `display()` 中：\n\n1. 启用包含顶点的缓冲区\n\
  2. 将缓冲区与顶点属性关联\n3. 启用顶点属性\n4. 使用 `glDrawArrays(…)` 绘制物体\n\n缓冲区通常在程序开始时一次性创建，要么在\
  \ `init()` 中，要么在由 `init()` 调用的函数中。在 OpenGL 中，缓冲区包含在 `Vertex Buffer Object`（顶点缓冲区对象，简称\
  \ `VBO`）中，它是在 C++/OpenGL 应用中声明并实例化的。场景可能需要许多 VBO，因此惯例是在 `init()` 中生成并填充几个缓冲区，以便当程序需要绘制其中一个或多个缓冲区时它们随时可用。\n\
  \n![image](img/fig4_1.jpg)\n\n图 4.1\n\nVBO 与顶点属性之间的数据传输。\n\n缓冲区以特定方式与顶点属性交互。当执行\
  \ `glDrawArrays()` 时，缓冲区中的数据开始从缓冲区的开始顺序流向顶点着色器。如第 2 章 所述，顶点着色器为每个顶点执行一次。3D 空间中的一个顶点需要三个值，因此着色器中用于接收这三个值的适当顶点属性类型应为\
  \ `vec3`。然后，对于缓冲区中的每三个值，着色器就会被调用一次，如图图 4.1 所示。\n\nOpenGL 中一个相关的结构是 `Vertex Array\
  \ Object`（顶点数组对象，简称 `VAO`）。VAO 是在 OpenGL 3.0 版本中引入的，是一种组织缓冲区的方法。例如，假设我们想要绘制一个立方体，并假设立方体的顶点硬编码在\
  \ C++/OpenGL 应用的数组中。在这种情况下，我们需要将这些值拷贝到我们之前生成的两个缓冲区之一。为了实现这一点，我们需要 a) 使用 `glBindBuffer()`\
  \ 命令使该缓冲区（例如第 0 个缓冲区）变为“激活”，b) 使用 `glBufferData()` 命令将包含顶点的数组拷贝到激活缓冲区（在本例中为第 0 个\
  \ VBO）。\n\n```cpp\nglBindBuffer(GL_ARRAY_BUFFER, vbo[0]);\nglBufferData(GL_ARRAY_BUFFER,\
  \ sizeof(vPositions), vPositions, GL_STATIC_DRAW);\n```\n\n\n\n\n接下来，我们向 `display()`\
  \ 中添加代码，将缓冲区中的值发送到着色器的顶点属性（vertex attribute）。我们通过以下三个步骤来实现此：(a) 像上面一样使用 `glBindBuffer()`\
  \ 命令使该缓冲区变为“激活”状态；(b) 将激活的缓冲区与着色器中的顶点属性关联；(c) 启用该顶点属性。以下代码完成了这些步骤：\n\n![image](img/pg64.jpg)\n\
  \n现在，当我们执行 `glDrawArrays()` 时，第 0 个 VBO 中的数据将传输到具有 `location 0` 布局修饰符的顶点属性。这会将立方体的顶点发送到着色器。\n\
  \n## 4.2 统一变量（UNIFORM VARIABLES）\n\n渲染一个场景以显示为 3D 效果需要构建适当的变换矩阵，例如第 3 章 中描述的，并将它们应用于每个模型的每个顶点。在顶点着色器中执行所需的矩阵运算效率最高，而且通常的做法是将这些矩阵从\
  \ C++/OpenGL 应用通过 `uniform variable` 发送到着色器中。\n\n统一变量在着色器中通过“uniform”关键字进行声明。下面的示例声明了用于存储模型-视图和投影矩阵的变量，适用于我们的立方体程序：\n\
  \n```\nuniform mat4 mv_matrix;\nuniform mat4 p_matrix;\n```\n\n关键字 `mat4` 表示这些是\
  \ 4x4 矩阵。在这里我们将变量命名为 `mv_matrix` 以存储模型-视图矩阵，并将 `p_matrix` 以存储投影矩阵。由于 3D 变换是 4x4\
  \ 的，`mat4` 是 GLSL 着色器统一变量常用的数据类型。\n\n从 C++/OpenGL 应用向统一变量发送数据需要以下步骤：(a) 获取统一变量的引用；(b)\
  \ 将指向所需值的指针与获取的统一引用关联。假设链接后的渲染程序保存在名为 `renderingProgram` 的变量中，以下代码将指定我们将模型-视图和投影矩阵发送到立方体示例中的两个统一变量\
  \ `mv_matrix` 和 `p_matrix`：\n\n![image](img/pg65.jpg)\n\n上面的示例假设我们已经利用 GLM 工具构建了模型-视图和投影矩阵变换\
  \ `mvMat` 和 `pMat`，稍后我们将进行详细讨论。它们的类型为 `mat4`（一个 GLM 类）。GLM 函数调用 `value_ptr()` 返回矩阵数据的引用，`glUniformMatrix4fv()`\
  \ 需要该引用将这些矩阵值传输到统一变量中。\n\n## 4.3 顶点属性的插值\n\n理解 `vertex attributes` 在 OpenGL 流线中如何被处理，与\
  \ `uniform variables` 如何被处理相比是非常重要的。请记住，在片元着色器之前是 `光栅化`（rasterization），此时由顶点定义的原始图形（例如三角形）会被转换为片元（fragments）。光栅化对\
  \ `vertex attribute` 值进行`线性插值`，使得使得的像素能够无缝地连接建模的表面。\n\n相比之下，`uniform` 变量的行为类似于初始化的常量，并且在每次调用顶点着色器时都保持不变（即对于从缓冲区发送的每个顶点）。统一变量不会被插值；无论顶点数量多少，它始终包含相同的值。\n\
  \n光栅化对顶点属性执行的插值在许多方面都有用。稍后，我们将使用光栅化来插值颜色、纹理坐标和表面法线。重要的一点是理解，`所有通过缓冲区发送到顶点属性的值都将在流线的下游被进一步插值`。\n\
  \n我们已经见过在顶点着色器中的顶点属性，它们被声明为“in”，以表示它们接收来自缓冲区的值。顶点属性也可以被声明为“out”，这意味着它们将其值向后传递到流线的下一个阶段。例如，顶点着色器中的以下声明指定了一个名为“color”的顶点属性，该属性输出一个\
  \ `vec4`：\n\n```\nout vec4 color;\n```\n\n没有必要为顶点位置声明“out”变量，因为 OpenGL 有一个名为 `gl_Position`\
  \ 的内置 `out vec4` 变量用于此目的。在顶点着色器中，我们对传入的顶点（早早之前声明为 `position`）应用矩阵变换，并将结果赋值给 `gl_Position`：\n\
  \n```\ngl_Position = p_matrix * mv_matrix * position;\n```\n\n变换后的顶点将自动输出到光栅化器，相应的像素位置最终会被发送到片元着色器。\n\
  \n光栅化过程如图图 4.2 所示。在 `glDrawArrays()` 函数中指定 `GL_TRIANGLES` 时，光栅化是每个三角形进行的。插值从连接顶点的线开始，其精度水平与像素显示密度相对应。三角形内部区域的像素随后通过沿连接边缘像素的水平线进行插值来填充。\n\
  \n![image](img/fig4_2.jpg)\n\n图 4.2\n顶点的光栅化。\n\n## 4.4 模型-视图和投影矩阵\n\n在 3D 中渲染对象的基本步骤是创建适当的变换矩阵并将它们发送到统一变量，正如我们在第\
  \ 4.2 节 中做的那样。我们首先定义三个矩阵：\n\n1. `Model` 模型矩阵\n2. `View` 视图矩阵\n3. `Perspective (Projection)`\
  \ 透视投影矩阵\n\n`Model` 矩阵在世界坐标空间中定位并对齐对象。每个模型都有自己的模型矩阵，如果模型移动，则该矩阵需要不断重建。\n\n`View`\
  \ 矩阵移动并旋转模型，以模拟位于某处的的相机。从第 3 章 回忆，OpenGL 相机存在于 (0,0,0) 并面向负 Z 轴。为了模拟相机特定移动的效果，我们需要向相反方向移动物体。例如，将相机向右移动会导致场景中的物体向左移动；尽管\
  \ OpenGL 相机是固定的，但我们可以通过向左移动物体使其看起来像是我们向右移动了相机。\n\n`Perspective` 矩阵根据所需的视锥提供 3D 效果的变换，正如之前在第\
  \ 3 章 中描述的。\n\n何时计算每种矩阵也很重要。不变化的矩阵可以在 `init()` 中构建，但那些变化的矩阵需要在 `display()` 中构建，以便每帧都重建。让我们假设模型是动态的且相机是可移动的，那么：\n\
  \n- 模型矩阵需要`每个模型`在`每帧`创建一个。\n- 视图矩阵需要`每帧创建一次（因为相机可以移动），但它对于该帧渲染的所有对象都是相同的。\n- 透视矩阵创建一次（在\
  \ `init()` 中），使用屏幕窗口的宽度和高度（以及所需的视锥参数），除非窗口调整大小，否则它通常保持不变。\n\n模型和视图变换矩阵的生成随后发生在 `display()`\
  \ 函数中，如下：\n\n1. 根据所需的相机位置和朝向构建视图矩阵。\n2. 对于每个模型，执行以下操作：\n   i. 根据模型的位置和朝向构建模型矩阵。\n\
  \   ii. 将模型和视图矩阵合并为单一的“MV”矩阵。\n   iii. 将 `MV` 和 `P` 矩阵发送到相应的着色器统一变量。\n\n\n\n从技术上讲，没有将模型矩阵（model\
  \ matrix）和视图矩阵（view matrix）合并为一个矩阵。也就是说，可以将它们独立的矩阵发送到顶点着色器。然而，将它们合并而保持投影矩阵（perspective\
  \ matrix）分开具有某些优势。例如，在顶点着色器中，模型中的每个顶点都要乘以这些矩阵。由于复杂模型可能有数百甚至数千个顶点，通过在将它们发送到顶点着色器之前先对模型和视图矩阵进行预乘，可以提高性能。稍后我们将看到为了光照目的，需要保持投影矩阵分开。\n\
  \n## 4.5 我们的第一个 3D 程序——3D 立方体\n\n是时候把所有部分组合在一起了！为了构建一个完整的 C++/OpenGL/GLSL 系统来在 3D“世界”中渲染我们的立方体，目前描述的所有机制都需要整合并完美地协调。我们可以复用之前在第\
  \ 2 章中看到的一些代码。具体来说，我们不再重复编写以下读取包含着色器代码的文件、编译并链接它们以及检测 GLSL 错误的函数；事实上，请记住我们已经将它们移动到了\
  \ `Utils.cpp` 文件中：\n\n* `createShaderProgram()`\n* `readShaderSource()`\n* `checkOpenGLError()`\n\
  * `printProgramLog()`\n* `printShaderLog()`\n\n我们还需要一个实用函数来构建投影矩阵，该函数根据指定的 Y 轴视场角、屏幕宽高比例以及所需的近、远裁剪平面（选择近远裁剪平面的合适值将在第\
  \ 4.9 节;`\n\n现在我们构建完整的 3D 立方体程序，如程序 4.1 所示：\n\n***程序 4.1 纯红色立方体***\n\n![image](img/prog4_1.jpg)\n\
  \n![image](img/prog4_1_1.jpg)\n\n![image](img/prog4_1_2.jpg)\n\n![image](img/prog4_1_3.jpg)\n\
  \n让我们仔细观察程序 4.1 中的代码。理解*所有*部分是如何工作的，*以及它们是如何协同工作的*至关重要。\n\n![image](img/fig4_3.jpg)\n\
  \n图 4.3\n\n程序 4.1 的输出。红色立方体位于 (0,-2,0)，从 (0,0,8) 观察。\n\n首先检查由 `init()` 调用的 `setupVertices()`\
  \ 函数。在函数的开始处，声明了一个名为 `vertexPositions` 的数组，它包含了组成立方体的 36 个顶点。起初你可能会奇怪，为什么这个立方体有\
  \ 36 个顶点，而逻辑上讲一个立方体只需要 8 个。答案是我们需要用三角形来构建立方体，因此立方体的六个每个面都需要由两个三角形组成，总共 6x2=12 个三角形（参见图\
  \ 4.4）。由于每个三角形由三个顶点指定，因此总共有 36 个顶点。由于每个顶点有三个值（`x,y,z`），数组中总共有 36x3=108 个值。虽然每个顶点参与了多个三角形，但我们仍然单独指定每个顶点，因为目前我们是单独将每个三角形的顶点发送到管道中的。\n\
  \n![image](img/fig4_4.jpg)\n\n图 4.4\n\n三角形组成的立方体。\n\n立方体定义在自身的坐标系中，中心在 (0,0,0)，角在\
  \ `x`、`y` 和 `z` 轴上从 -1.0 到 +1.0。`setupVertices()` 函数的其余部分设置了 VAO 和两个 VBO（尽管只使用），并将立方体顶点加载到第\
  \ 0 个 VBO 缓冲区。\n\n注意 `init()` 函数执行只需要执行一次的任务：读取着色器代码并构建渲染程序，并将立方体顶点加载到 VBO（通过调用\
  \ `setupVertices()`）。注意，它还设置了立方体和相机在世界中的位置。稍后我们将制作立方体的动画，并查看如何移动相机，届时我们可能需要移除这种硬编码定位。\n\
  \n现在让我们来看 `display()` 函数。记得 `display()` 可能被重复调用，其调用的频率被称为*帧率*。也就是说，动画通过非常快速地连续绘制和重绘场景（或帧）来实现。通常在渲染一帧之前需要清除深度缓冲区，以便隐藏表面移除能够正确进行（不清除深度缓冲区有时会导致每个表面都被移除，导致屏幕完全变黑）。默认情况下，OpenGL\
  \ 中的深度值范围从 0.0 到 1.0。通过调用 `glClear(GL_DEPTH_BUFFER_BIT)` 清除深度缓冲区，这将用默认值填充深度缓冲区（通常为\
  \ 1.0）。\n\n接下来，`display()` 通过调用 `glUseProgram()`启用着色器，将 GLSL 代码安装到 GPU 上。记得这并没有运行着色器程序，但它确实允许随后的\
  \ OpenGL 调用来确定着色器的*顶点属性*和*统一变量（uniform）*位置。`display()` 函数接下来获取统一变量的位置，构建投影、视图和模型矩阵³，并将投影和视图矩阵赋值给相应的\
  \ uniform。这里值得注意的是 GLM 用的形式：\n\n```cpp\nvMat = glm::translate(glm::mat4(1.0f), glm::vec3(cameraX,cameraY,cameraZ));\n\
  ```\n\n```\n\n这个看起来有点奇怪的调用通过以下方式构建变换矩阵：(a) 从一个单位矩阵（使用 `mat4(1.0f)`）开始，(b) 指定向量形式的值（使用\
  \ `vec3(x,y,z)`）。许多 GLM 变换操作都采用这种方法。接下来，`display()` 启用包含立方体顶点的缓冲区并将其附加到属性，以准备发送到着色器。`display()`\
  \ 做的最后一件事是通过调用 `glDrawArrays()` 绘制模型，指定由三角形组成并有 36 个顶点。`glDrawArrays()` 调用之前通常会有调整渲染设置的额外命令。⁴\
  \ 在此示例中有这样的命令，都与深度测试有关。回顾第 2 章，深度测试被 OpenGL 用于执行隐藏表面移除。在这里，我们启用深度测试并指定我们使用的特定深度测试。\n\
  \n注意顶点着色器中输入顶点属性位置上的 layout 修饰符。由于位置指定为“0”，`display()` 函数可以通过在 `glVertexAttribPointer()`\
  \ 函数调用的第一个参数中使用 0 以及在 `glEnableVertexAttribArray()` 函数调用中使用 0 来引用该变量。此外注意位置顶点属性被声明为\
  \ `vec3`，因此它需要转换为 `vec4` 以便与其相乘的 4x4 矩阵兼容。这种转换通过 `vec4(position,1.0)` 完成，它从名为“position”的变量构建了一个\
  \ `vec4`，在新添加的第 4 个位置放入 1.0。\n\n顶点着色器中的乘法将矩阵变换应用于顶点，将其转换为相机空间（注意这种从右到左的连接顺序）。这些值被放入内置\
  \ OpenGL 输出变量 `gl_Position` 中，然后通过管道并由栅化器进行插值。\n\n\n\n插值后的像素位置（称为 `fragments`）随后会被发送到\
  \ `fragment shader`（片元着色器）。记住，片元着色器的主要目的是设置输出像素的颜色。与顶点着色器类似，片元着色器逐个处理像素，每个像素都有独立的调用。在这种情况下，它输出一个对应红色的硬编码值。由于前述原因，尽管在这个示例中没有使用它们，但统一变量（uniform\
  \ variables）仍已包含在片元着色器中。\n\n从 C++/OpenGL 应用开始通过流水线的数据流概览见图 4.5。\n\n![image](img/fig4_5.jpg)\n\
  \n图 4.5\n\n通过程序 4.1 的数据流。\n\n让我们对着色器进行细微修改。特别是，我们将根据每个顶点的位置为每个顶点分配一种颜色，并将该颜色放入输出的顶点属性\
  \ `varyingColor` 中。片元着色器也同样进行了修订，以接收传入的颜色（由光栅化器插值）并使用它来设置输出像素的颜色。注意，代码还将位置乘以 1/2，然后加上\
  \ 1/2，以将值范围从 [-1..+1] 转换为 [0..1]。同样注意使用常用惯例，将包含“varying”字样的变量命名为程序员定义的插值顶点属性。每个着色器中的更改已突出显示，结果输出如下。\n\
  \n***修订后的顶点着色器：***\n\n![image](img/pg75.jpg)\n\n***修订后的片元着色器：***\n\n![image](img/pg76.jpg)\n\
  \n![image](img/fig4_6.jpg)\n\n图 4.6\n\n带有插值颜色的立方体。\n\n注意，由于颜色是通过顶点属性（`varyingColor`）从顶点着色器发送的，它们也被光栅化器插值！这种效果可以在图\
  \ 4.6 所示，从角到角的颜色在整个立方体上平滑地插值。\n\n同样注意，顶点着色器中的“out”变量 `varyingColor` 也是片元着色器中的“in”变量。两个着色器知道顶点着色器中的哪个变量供给片元着色器中的哪个变量，因为它们在两个着色器中具有相同的名称“varyingColor”。\n\
  \n由于我们的 `main()` 包含了渲染循环，我们可以像在程序 2.6 中做的那样，通过使用基于时间的动态和平移和旋转构建模型矩阵来制作立方体。例如，程序\
  \ 4.1 中 `display()` 函数的代码可以修改如下（更改已突出显示）：\n\n![image](img/pg77.jpg)\n\n在模型矩阵中使用当前时间（以及各种三角函数）使得立方体看起来在空间中翻滚。注意，添加此动画说明了每次通过\
  \ `display()` 调用时都清除深度缓冲区（depth buffer）的重要性，以确保正确的隐藏表面消除。它还需要如所示的清除颜色缓冲区（color buffer）；否则立方体会在移动时留下痕迹。\n\
  \n`translate()` 和 `rotate()` 函数是 GLM 库的一部分。此外，注意最后一行中的矩阵乘法——`tMat` 和 `rMat` 在操作中列出的顺序至关重要。它计算了两个变换的连接，平移在左，旋转在右。当顶点随后乘以此矩阵时，计算是从右到左的，这意味着先进行旋转，然后是平移。变换的应用顺序至关重要，改变顺序会导致不同的行为。图\
  \ 4.7 显示了动画化立方体后显示的一些帧。\n\n![image](img/fig4_7.jpg)\n\n图 4.7\n\n动画化的（“翻滚的”）3D 立方体。\n\
  \n## 4.6 渲染对象的多个副本\n\n我们现在将所学习的知识扩展到渲染多个对象。在处理在单个场景中渲染各种模型的通用情况之前，让我们先考虑相同模型多次出现的简单情况。例如，假设我们希望扩展之前的示例，使其渲染一个由\
  \ 24 个翻滚立方体组成的“群落”。我们可以通过将 `display()` 中构建 MV 矩阵和绘制立方体的代码部分（如下文蓝色所示，此处省略）移动到执行 24\
  \ 次的循环中来实现。我们将循环变量整合到立方体的旋转和平移中，以便每当绘制立方体时，都会构建一个不同的模型矩阵。（我们还将相机移动到正 Z 轴更远的地方，以便我们看到所有的立方体。）生成的动画场景的一帧见图\
  \ 4.8。\n\n![image](img/pg78.jpg)\n\n![image](img/fig4_8.jpg)\n\n图 4.8\n\n多个翻滚的立方体。\n\
  \n### 4.6.1 实例化（Instancing）\n\n实例化提供了一种机制，告诉显卡仅使用单个 C++/OpenGL 调用渲染对象的多个副本。这可以带来显著的性能收益，特别是当绘制成千上万或数百万个对象副本时——例如渲染田中的许多花，或军队中的许多僵尸。\n\
  \n我们首先将 C++/OpenGL 应用中的 `glDrawArrays()` 调用更改为 `glDrawArraysInstanced()`。现在，我们可以要求\
  \ OpenGL 绘制任意数量的副本。我们可以如下所示指定绘制 24 个立方体：\n\n```\nglDrawArraysInstanced(GL_TRIANGLES,\
  \ 0, 36, 24);\n```\n\n使用实例化时，顶点着色器可以访问内置变量 `gl_InstanceID`，这是一个指向当前处理的对象实例的整数。\n\
  \n为了使用实例化复制之前的立方体示例，我们需要将构建不同模型矩阵的计算（之前在 `display()` 循环中）移动到顶点着色器中。由于 GLSL 没有 `translate`\
  \ 或 `rotate` 函数，且我们无法在着色器内部调用 GLM，我们需要使用程序 3.1 中的实用函数。我们还需要将“时间因子”从 C++/OpenGL 应用传递到顶点着色器。我们还需要通过统一变量传递视图矩阵，因为旋转计算已移动到顶点着色器。修订内容包括\
  \ C++/OpenGL 应用中的以及新顶点着色器中的更改，见程序 4.2。\n\n***程序 4.2 实例化——24 个动画立方体\n\n![image](img/prog4_2.jpg)\n\
  \n![image](img/prog4_2_1.jpg)\n\n程序 4.2 的生成输出与之前的示例相同，可以在图 4.8 所示。\n\n实例化使得大幅增加对象的副本成为可能；在本示例中，即使对于中等\
  \ GPU，动画 100,000 个立方体仍然是行的。代码的更改——主要只是修改了几个常量以将大量立方体隔得更开——如下：\n\n![image](img/prog4_2_2.jpg)\n\
  \n生成的输出见图 4.9。\n\n![image](img/fig4_9.jpg)\n\n图 4.9\n\n实例化：100,000 个动画立方体。\n\n##\
  \ 4.7 在场景中读取多个不同的模型\n\n要在单个场景中渲染多个模型，一种简单的方法是为每个模型使用独立的缓冲区。每个模型都需要它自己的模型矩阵，因此为渲染的每个模型将生成一个新的模型-视图矩阵。每个模型还需要单独调用\
  \ `glDrawArrays()`。因此，`init()` 和 `display()` 中都需要更改。\n\n\n\n\n另一个考虑因素是，我们是否需要为绘制的每个对象准备不同的着色器——或不同的渲染程序。事实证明，在许多情况下，我们可以为绘制的各种对象使用相同的着色器（以及相同的渲染程序）。通常只有当这些对象由不同的图元（例如，使用线条而不是三角形）组成，或者涉及复杂的光照或其他效果时，我们才需要为不同对象采用不同的渲染程序。目前情况并非如此，因此我们可以重用顶点和片元着色器，只需修改我们的\
  \ C++/OpenGL 应用，在调用 `display()` 时将每个模型发送到流水线中。\n\n让我们通过添加一个简单的金字塔来继续，这样我们的场景就包含了一个立方体和一个金字塔。代码相关的修改显示在程序\
  \ 4.3 中。我们突出了几个关键细节，例如我们在哪里指定一个或另一个缓冲区，以及在哪里指定模型中包含的顶点数量。注意，金字塔由六个三角形组成——四个在侧面，两个在底部，总共\
  \ 6×3=18 个顶点。\n\n包含立方体和金字塔的最终场景将在图 4.10 中显示。\n\n***程序 4.3 立方体与金字塔***\n\n![image](img/prog4_3.jpg)\n\
  \n![image](img/prog4_3_1.jpg)\n\n![image](img/fig4_10.jpg)\n\n图 4.10\n\n3D 立方体和金字塔。\n\
  \n关于程序 4.3 的其他一些要细节：\n\n- 变量 `pyrLocX`、`pyrLocY` 和 `pyrLocZ` 需要在 `init()` 中声明并初始化所需的金字塔位置，就像立方体的位置。\n\
  - 视图矩阵 `vMat` 在 `display()` 顶部构建，然后同时用于立方体和金字塔的模型视图矩阵。\n- 这里的显示顶点和片元着色器——它们与第 4.5\
  \ 节 保持不变。\n\n## 4.8 矩阵栈\n\n到为止，我们渲染的模型每个都是由一组顶点构建的。然而，通常希望通过组合较小的、简单的模型来构建复杂的模型。例如，可以通过分别绘制头部、身体、腿部和手臂来创建一个“机器人”模型，其中每一个部分都是独立的模型。以这种方式构建的对象通常被称为层次模型。构建层次模型的困难之处在于要跟踪所有的模型视图矩阵，并确保它们保持完美协调——否则机器人可能会散成碎片！\n\
  \n层次模型不仅对于构建复杂对象很有用——它们还可以用于生成复杂的场景。例如，考虑我们的地球是如何绕太阳运行的，反之月球又是绕地球运行的。这样的场景在图 4.11\
  \ 中所示。⁵ 计算月球在空间中的实际路径可能是复杂的。然而，如果我们能够合并代表两个简单圆形路径的变换——月球绕地球的路径和地球绕太阳的路径——我们就可以避免显式地计算月球的轨迹。\n\
  \n![image](img/fig4_11.jpg)\n\n图 4.11\n\n动画行星系统（太阳和地球纹理来自 [HT23]，月球纹理来自 [NA23]）。\n\
  \n事实证明，我们可以通过矩阵栈相当容易地做到。矩阵栈正如其名，是一个变换矩阵的栈。正如我们将看到的，矩阵栈使得创建和管理复杂的层次对象和场景变得简单，其中变换可以构建在其他变换之上（并从其中移除）。\n\
  \nOpenGL 有一个内置的矩阵栈，但作为较旧的固定功能（非可编程）流水线的一部分，它很早就被弃用了 [OL16]。然而，C++ 标准模板库 (STL) 有一个名为\
  \ `stack` 的类，它相对容易适配为矩阵栈，通过使用它来构建 `mat4` 栈。正如我们将看到的，在复杂场景中通常需要的许多模型、视图和模型视图矩阵可以被单个\
  \ `stack<glm::mat4>` 实例所取代。\n\n我们将首先检查实例化和使用 C++ 栈的基本命令，然后使用一个栈来构建一个复杂的动画场景。我们将以以下方式使用\
  \ C++ 栈类：\n\n- `push()` – 在栈顶创建一个新的可用用条目。我们通常通过推送当前栈顶矩阵的副本来使用此命令，意图是在副本上连接额外的变换。\n\
  - `pop()` – 移除（并返回）栈矩阵。\n- `top()` – 返回栈顶矩阵的引用，而不将其移除。\n\n![image](img/pg86.jpg)\n\
  \n如前面的列表所示，`mat4` 重载了 `*=` 运算符，以便它可以用于连接矩阵。因此，我们通常使用所示的形式之一，向矩阵栈顶的矩阵添加平移、旋转等。\n\n\
  现在，我们不再通过创建 `mat4` 实例来构建变换，而是使用 `push()` 命令在栈顶创建新矩阵。然后根据需要将所需的变换应用于栈顶新创建的矩阵上。\n\n\
  推入栈的第一个矩阵通常是视图（VIEW）矩阵。在在其上面的矩阵具有增加的复杂性；也就是说，它们应用了增加的模型变换。这些变换可以直接应用，也可以通过首先连接其他矩阵来实现。在我们的行星系统示例中，紧邻\
  \ VIEW 矩阵的矩阵将是太阳的 MV 矩阵。在其之上的是地球的 MV 矩阵，包含了地球的模型变换。同样，月球的 MV 矩阵位于地球 MV 矩阵之上，并通过应用月球的模型变换来构建。在渲染完月球后，可以通过从栈中“弹出”第一个月球矩阵来渲染第二个月球”（将栈顶恢复为地球的模型视图矩阵），然后对第二个月球重复该过程。\n\
  \n基本方法如下：\n\n1. 我们声明我们的栈，并命名为 `mvStack`。\n2. 当相对于父对象创建一个新对象时，调用 `mvStack.push(mvStack.top())`。\n\
  3. 应用新对象所需的变换；即对其乘以所需的变换。\n4. 当对象或子对象完成绘制后，调用 `mvStack.pop()` 从栈顶移除模型视图矩阵。\n\n在后面的章节中，我们将学习创建球体并让它们看起来像行星和月球。现在，为了保持简单，我们将使用我们的金字塔和几个立方体来构建“行星系统”。\n\
  \n以下是使用矩阵栈的 `display()` 函数通常组织的概述：\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| **设置** | 实例化矩阵栈。\
  \ |\n| **相机** | 向栈中推入新矩阵（这将实例化空的 VIEW 矩阵）。对栈顶的视图矩阵应用变换。 |\n| **父对象** | 向栈中推入新矩阵（这将是父对象的\
  \ MV 矩阵——对于第一个父对象，它复制了视图矩阵）。通过将父对象的 M 矩阵合并到复制的视图矩阵中来应用变换。将栈顶矩阵（例如使用 `glm::value_ptr()`）发送到顶点着色器中的\
  \ MV 统一变量。绘制父对象。 |\n| **子对象** | 向栈中推入新矩阵（这将是子对象的 MV 矩阵，复制了父对象的 MV 矩阵）。通过将子对象的 M\
  \ 矩阵合并到复制的父 MV 矩阵中来应用变换。将栈顶矩阵（例如使用 `glm::value_ptr()`）发送到顶点着色器中的 MV 统一变量。绘制子对象。\
  \ |\n\n\n\n\n\n| **清理** | •从栈中弹出子对象的 MV 矩阵•从栈中弹出父对象的 MV 矩阵•从栈中弹出 VIEW 矩阵。 |\n\n\
  请注意，金字塔（“太阳”）绕其轴的旋转是在自身的局部坐标系中进行的，不应允许它影响“子物体”（在本例中为行星和月球）。因此，太阳的旋转（如下所示）被推入栈中，但在绘制太阳之后，必须将其从栈中移除（弹出）。\n\
  \n![image](img/fig89_1.jpg)\n\n大立方体（行星）绕太阳的公转（下方的左图）会影响月球的运动，因此它被推入栈中，并在绘制月球时也保留在栈中。相比之下，行星绕其轴的旋转（下方的右图）是局部的，不会影响月球，因此在绘制月球之前会将其从栈中弹出。\n\
  \n![image](img/fig89_2.jpg)\n\n同样，我们还会为月球的旋转（绕行星旋转以及绕其轴旋转）将变换推入栈中，后续图像所示。\n\n![image](img/fig89_3.jpg)\n\
  \n以下是“行星”的步骤序列：\n\n• `push()`：这将是行星 MV 矩阵的一部分，该部分将也会影响子物体。\n\n• `translate(…)`：将行星绕太阳的运动整合到行星的\
  \ MV 矩阵中。在本例中，我们使用三角函数将行星的运动计算为平移。\n\n• `push()`：这将行星完整的 MV 矩阵，也包括它的绕轴旋转。\n\n• `rotate(...)`：整合行星的绕轴旋转（这稍后会被弹出且不会影响子物体）。\n\
  \n• `glm::value_ptr(mvStack.top())`：获取 MV 矩阵然后将其发送到 MV 统一变量（uniform）。\n\n• 绘制行星。\n\
  \n• `pop()`：这会将行星 MV 矩阵从栈中移除，暴露其下方的较早的行星 MV 矩阵副本，该副本不包含行星的绕轴旋转（这样只有行星的平移会影响月球）。\n\
  \n现在我们就可以编写完整的 `display()` 例，如程序 4.4 所示。\n\n***程序 4.4 使用矩阵栈的简单太阳系统***\n\n![image](img/prog4_4.jpg)\n\
  \n![image](img/prog4_4_1.jpg)\n\n矩阵栈操作已高亮显示。有几个值得注意的细节：\n\n• 我们在模型矩阵中引入了 `scale`（缩放）操作。我们希望月球是行星更小的立方体，因此在构建月球的\
  \ MV 矩阵时调用了 `scale()`。\n\n• 在此例中，我们使用三角函数操作 `sin()` 和 `cos()` 来计算行星绕太阳的旋转（作为平移），以及月球绕行星的旋转。\n\
  \n• 两个缓冲区 `#0` 和 `#1` 分别包含立方体和金字塔顶点。\n\n• 注意在 `glUniformMatrix()` 命令中使用了 `glm::value_ptr(mvMatrix.top())`\
  \ 函数调用。该调用检索栈顶矩阵的值，然后将这些值发送到统一变量（在本例中，分别为太阳、行星以及月球的 MV 矩阵）。\n\n未显示顶点着色器和片段着色器——它们与上一个示例相同。我们还移动了金字塔（太阳）的初始位置和相机，以使场景位于屏幕中心。\n\
  \n## 4.9 消除“Z-fighting”（深度抖动）伪影\n\n回想一下，在渲染多个对象时， OpenGL 使用*Z 缓冲区算法*（之前在图 2.14 中所示）来进行隐藏表面移除。通常情况下，通过将像素颜色设置为距离相机最近的片段颜色，来解决哪些对象表面可见并渲染到屏幕，而哪些表面位于其他对象之后因此不应渲染。\n\
  \n然而，有时会出现场景中两个对象表面重叠并位于相同平面的情况，这使得 Z 缓冲区算法难以确定两个表面中应该渲染哪一个（因为没有哪一个离相机“最近”）。当这种情况发生时，浮点舍入误差会导致渲染表面的某些部分使用一个对象的颜色，而其他部分使用另一个对象的颜色。这种伪影被称为\
  \ *Z-fighting*（深度冲突）或 *depth-fighting*（深度冲突），因为这种效果是渲染片段在 Z 缓冲区中相互对应的像素条目上“争斗”的结果。图\
  \ 4.12 展示了两个具有重叠相同（顶部）面的盒子之间的 Z-fighting 示例。\n\n![image](img/fig4_12.jpg)\n\n图 4.12\n\
  \nZ-fighting 示例。\n\n这种情况在创建地形或阴影时经常发生。在这些情况下，有时可以预测 Z-fighting，修正此类问题的常用方法是稍微移动一个对象，使表面不再共面。我们将在第\
  \ 8 章中看到一个示例。\n\nZ-fighting 也可能由于深度缓冲区中值的精度限制而发生。对于 Z 缓冲区算法处理的每个像素，其深度信息的准确性受限于存储在深度缓冲区中的可用位数。用于构建透视矩阵的近裁剪平面和远裁剪平面之间的范围越大，两个具有相似（但不相等）实际深度的对象点就越可能被表示为相同的深度数值。因此，避免选择距离眼睛太近的近裁剪平面。本书之前的示例简单使用了\
  \ 0.1 和 1000（在我们的 `perspective()` 调用中）。\n\n## 4.10 图形的其他选项\n\nOpenGL 支持多种图形类型——目前为止我们两种：`GL_TRIANGLES`\
  \ 和 `GL_POINTS`。事实上，还有其他类型。所有支持的图形类型都分为*三角形*、*线*、*点*和*补片*。以下是完整列表：\n\n***三角形图形***\n\
  \n![image](img/pg93.jpg)\n\n***线图形***\n\n![image](img/pg94.jpg)\n\n***点图形***\n\n\
  | GL_POINTS | 通过流水线的每个顶点都是一个点。 |\n\n***补片图形***\n\n| GL_PATCHES | 仅用于细分着色器。指示一组顶点从顶点着色器传递到细分控制着色器，在那里通常用于将细分网格塑成曲面表面。\
  \ |\n\n## 4.11 性能优化\n\n随着我们 3D 场景复杂性的增加，我们将越来越关注性能。我们已经看到了一些为了速度而做的编码决策，例如当我们使用实例化时，以及我们将昂贵的计算移动到着色器中时。\n\
  \n实际上，我们提供的代码已经包含了一些未讨论过的额外优化。现在我们探讨这些其他重要的技术。\n\n### 4.11.1 最小化动态内存分配\n\n就性能而言，我们\
  \ C++ 代码的关键部分显然是 `display()` 函数。该函数在任何动画或实时渲染期间都会被反复调用，因此在 във函数（或它调用的任何函数）中，我们必须努力提高效率。\n\
  \n保持 `display()` 函数开销降至最低的一种重要方法是避免任何需要内存分配的步骤。因此要避免的明显例子包括：\n\n•实例化对象\n\n•声明变量[/content]\
  \ -> 修正输出：[/content] \n\n*(注：由于原文文本在结尾处截断，译文也相应地翻译了最后一段。)*\n\n抱歉，由于你提供的原始文本在 `declaring\
  \ variables` 处突然结束了，我无法看到更完整的后文内容。我仅翻译了你提供的部分。\n\n[content]\n...\n•实例化对象\n•声明变量\n\
  \n\n\n鼓励读者回顾我们目前为止开发的程序，并观察到在`display()` 函数中使用的几乎每个变量在实际调用 `display()` 函数*之前*都经过了声明并分配了空间。声明或实例化几乎不会出现在\
  \ `display()` 中。例如，程序 4.1 在其代码列表的早期包含了以下代码块：\n\n```cpp\n// allocate variables used\
  \ in display() function, so that they won’t need to be allocated during rendering\n\
  GLuint mvLoc, pLoc;\nint width, height;\nfloat aspect;\nglm::mat4 pMat, vMat, mMat,\
  \ mvMat;\n```\n\n注意，我们特意在代码块顶部放置了一行注释，表明这些变量是为了稍后在 `display()` 函数中使用而预先分配的（尽管我们现在才显式地指出这一点）。\n\
  \n一个未预分配的变量案例出现在我们的矩阵栈示例中。通过使用 C++ 栈类，每个“push”操作都会导致动态内存分配。有趣的是，在 `Java` 中，JOML\
  \ 库提供了一个专为 OpenGL 设计的 `MatrixStack` 类，允许用户为矩阵栈预分配空间！我们在基于 Java 的“姊妹”书 *Computer\
  \ Graphics Programming in OpenGL with Java, Second Edition* 中使用了它。\n\n还有其他更微妙的例子。例如，将数据从一种类型转换为另一种类型的函数调用在某些情况下可能会实例化并返回新转换的数据。因此，理解从\
  \ `display()` 用的任何库函数的行为至关重要。数学库 `GLM` 并非专门为了速度而设计。结果是，某些操作会导致动态分配。我们已尽可能尝试使用直接操作已分配空间变量（或进入变量内部）的\
  \ `GLM` 函数。当性能至关重要时，鼓励读者探索替代方法。\n\n### 4.11.2 预计算透视矩阵\n\n可以减少 `display()` 函数中开销的另一种优化方法是将透视矩阵的计算移动到\
  \ `init()` 函数中。我们之前在第 4.5 节 中提到过这种可能性（实际上是在脚注中提到的）。虽然这很容易做到，但有一点小复杂性。虽然通常不需要重新计算透视矩阵，但如果运行应用程序的用户*调整*了窗口（例如通过拖动窗口角的缩放句柄），这*是*必要的。\n\
  \n幸运的是，`GLFW` 可以配置为每当窗口大小发生变化时自动回调指定的函数。我们在 `main()` 中、在调用 `init()` 之前添加了以下内容：\n\
  \n```cpp\nglfwSetWindowSizeCallback(window, window_reshape_callback);\n```\n\n第一个参数是\
  \ `GLFW` 窗口，第二个参数是 `GLFW` 在窗口大小发生变化时调用的函数名。然后我们将计算透视矩阵的代码移动到 `init()` 中，并将其复制到名为\
  \ `window_reshape_callback()` 的新函数中。\n\n以程序 4.1 为例。如果我们重新组织代码以从 `display()` 中移除透视矩阵的计算，那么修改后的\
  \ `main()`、`init()`、`display()` 以及新函数 `window_reshape_callback()` 的版本将如下：\n\n![image](img/pg97.jpg)\n\
  \n![image](img/pg98.jpg)\n\n本书附带文件的程序实现在透视矩阵计算方面都是按照这种方式组织的，从程序 4.1 的单体翻转立方体版本开始。\n\
  \n### 4.11.3 背面剔除\n\n提高渲染效率的另一种方法是利用 `OpenGL` 执行*背面剔除*（back-face culling）的能力。当一个\
  \ 3D 模型是完全“封闭”的时（意味着内部永远不可见，例如立方体和金字塔），事实证明，外表面背向观察者的部分始终会被同一模型的其他部分遮挡。也就是说，那些背向观察者的三角形是不可能被看到的（无论如何它们会被隐藏表面移除算法覆盖），因此没有理由对它们进行光栅化或渲染。\n\
  \n我们可以使用命令 `glEnable(GL_CULL_FACE)` 要求 `OpenGL` 识别并“剔除”（不渲染）背向的三角形。我们也可以通过 `glDisable(GL_CULL_FACE)`\
  \ 关闭面剔除。默认情况下，面剔除是禁用的，因此如果你想让 `OpenGL` 剔除背面三角形，你必须启用它。\n\n当启用面剔除时，默认只有当三角形是*正面*（front-facing）时才会被渲染。默认情况下，如果从\
  \ OpenGL 相机观察，三角形的三个顶点按*逆时针*方向推进（基于它们在缓冲区中定义的顺序），则该三角形被视为正面。从 OpenGL 相机观察，顶点按顺时针方向推进的三角形是*背面*的，且不渲染。这种“正面”的逆时针定义有时被称为*绕向顺序*（winding\
  \ order），可以使用函数调用 `glFrontFace(GL_CCW)` 显式设置为逆时针（默认），或使用 `glFrontFace(GL_CW)` 设置为顺时针。同样，渲染正面三角形还是背面三角形也可以显式设置。实际上，为了这个目的，我们指定哪些是*不*要渲染的——即哪些被“剔除”了。我们可以通过调用\
  \ `glCullFace(GL_BACK)` 指定剔除背面三角形（尽管这是必要的，因为是默认设置）。同样，我们可以通过将参数 `GL_BACK` 替换为 `GL_FRONT`\
  \ 或 `GL_FRONT_BACK` 来指定剔除正面三角形，甚至剔除所有三角形。\n\n正如我们在第 6 章](#12_chapter06.html) 中所示，3D\
  \ 模型通常设计为外表面具有相同的绕向顺序（最常见逆时针），这样如果启用了剔除，默认情况下面向相机的模型表面将被渲染。由于 OpenGL 默认假设绕向顺序是逆时针，如果模型设计为以*顺时针*绕向显示，则由程序员调用\
  \ `glFrontFace(GL_CW)` 来考虑。\n\n效率不是进行面剔除的唯一原因。背面剔除通过确保 OpenGL 不花费时间光栅化和渲染永远不会看到的表面来提高性能。我们在本章中看到的大多数示例都很小，因此开启面剔除的动力不足（例外是图\
  \ 4.9](#10_chapter04.html_fig4-9) 所示的示例，包含 1 万个实例化动画立方体，这在某些系统上带来性能挑战）。在实践中，大多数\
  \ 3D 模型都是“封闭”的，因此习惯上启用背面剔除。例如，我们可以通过如下修改 `display()` 函数为程序 4.3 添加背面剔除：\n\n![image](img/pg99.jpg)\n\
  \n注意，在 `GL_TRIANGLE_STRIP` 的情况下，每个三角形的绕向顺序是交替的。OpenGL 通过在构建连续三角形时“翻转”顶点序列来补偿，如下：0-1-2，然后是\
  \ 2-1-3、2-3-4、4-3-5、4-5-6。\n\n**补充说明**\n\n\n\n\n在 OpenGL/GLSL 中，还有许多用于管理和利用数据的其他能力和结构，本章仅触及一角。例如，我们还没有描述\
  \ `uniform block`（统一体块），这是一种类似于 C 语言中 `struct` 的组织统一变量的机制。统一体块甚至可以配置为接收来自缓冲区（buffer）的数据。另一种强大的机制是\
  \ `shader storage block`（着色器存储块），它本质上是一个着色器可以写入的缓冲区。\n\n关于数据管理选项的优秀参考文献是《OpenGL\
  \ 圣经》（OpenGL SuperBible）[SW15]，特别是名为“Data”的章节（第 7 版的第 5 章）。它还描述了我们涵盖的各种命令的许多细节和选项。本章的前两个示例程序——程序\
  \ 4.1 和程序 4.2，其灵感源自《圣经》中类似的示例。\n\n我们还需要学习如何管理以及如何将发送到 OpenGL 流水线的其他类型的数据。其中之一是 `texture`（纹理），它包含了颜色图像数据（如照片），可以用于“绘制”我们场景中的物体。我们将在\
  \ 第 5 章 中学习纹理图像。我们将进一步研究的另一个重要缓冲区是 `depth buffer`（深度缓冲区或 Z 缓冲区）。当我们在 第 8 章 中学习阴影时，这将变得重要。关于管理\
  \ OpenGL 中的图形数据，我们还有很多要学习！\n\n## 练习\n\n### 4.1 (项目) 修改程序 4.1，将立方体替换为你设计的其他简单 3D\
