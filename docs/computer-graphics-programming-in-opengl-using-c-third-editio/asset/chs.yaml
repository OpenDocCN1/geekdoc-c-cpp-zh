  \n***\n\n## 15 模拟水\n\n模拟水是一个复杂的话，因为水有许多形式。在这一章中，我们关注其中一个场景：游泳池。\n\n### 15.1 表面与地面几何结构\n\
  \n我们首先设置一个非常简单的场景，包括一个平面和一个天空盒（skybox）。该平面由两个三角形组成，并使用一个与第 14 章类似但更简单的函数进行纹理化。\n\
  \n程序 15.1 显示了代码的组织结构。对之前章节已介绍过的代码的解释不再重复。图 15.1 显示了执行后的结果。\n\nC++/OpenGL 应用指定平面高度为\
  \ 0.0，这意味着它与 XZ 面平齐。相机位于平面上方 2.0 个单位，俯仰角为 -15° 并面向平面。指定平面需要 18 个浮点值（2 个三角形 x 每个三角形\
  \ 3 个顶点 x 每个顶点 3 个坐标）。计算其过程化的“棋盘格”图案的方法与之前在第 14.4 节所示 3D 示例类似。每边所需的方格数在变量 `tileScale`\
  \ 中指定，然后通过将纹理坐标放大 `tileScale` 倍并对结果取模 2 来生成图案。返回 0 或 1 的结果作为颜色 (0,0,0) 或 (1,1,1)\
  \ —— 即黑色或白色。\n\n### 15.2 水\n\n现在我们在场景中添加第二个平面并构建一个游泳池，使用相同的平面模型（`PLANE_POSITIONS`\
  \ 和 `PLANE_TEXCOORDS`）作为池的顶表面和底部地面。我们将棋盘格图案放在下层平面（地面），对于顶表面平面，我们从纯蓝色开始。我们还添加了 Phong\
  \ 光照（在第 7 章中已介绍过）。这些新增内容的 C++/OpenGL 应用组织结构见程序 15.2。\n\n\n\n\n\n我们现在已经扩展了之前的程序，包含了两个平面段：一个用于顶表面，另一个用于底部。我们包含了法线（normals），以便在在两个表面上都使用\
  \ ADS 光照模型。我们有两个渲染程序，因为在这个版本中，顶表面是在不使用纹理的情况下渲染的，而底部是使用棋盘纹理渲染的。此外，顶表面的绕向顺序（winding\
  \ order）设置取决于相机在水面以上还是以下（因为那时需要渲染该平面的一侧或另一侧）。图 15.2 显示了相机在水面以上和水面下的结果。在两种情况下都有明显的镜面高光。在水下情况下，远处的浅色条带是透过顶表面平面可见的天空盒（skybox）。这个问题将在稍后我们添加“雾”效果时得到解决。\n\
  \n![](img/fig15_02.jpg)\n\n图 15.2\n\n水面顶部和底部的几何结构，相机位于表面上方（左）和表面正下方（右）\n\n## 15.2\
  \ 添加表面反射与折射\n\n水是复杂的，要创建一个完全真实的模拟，需要添加在水体中可见的许多反射和折射。进一步的复杂之处在于，取决于相机在水面以上还是以下，需要不同的效果。\n\
  \n我们将从关注第一种情况开始：相机在水面以上。在图 15.2（左图）中，我们可以看到到目前我们已经有了(1) 一个实心蓝色表面，(2) 水面上方的天空盒，以及\
  \ (3) 表面上的光照。为了开始让它看起来更像水，程序 15.3 添加了以下两个项目：\n\n* 反射（reflection），使得水面上的物体（如天空盒）反射在水面上\n\
  * 透过顶表面到底部的视线折射（refraction），使得从水面上方向下看时，水下的物体（如棋盘地板）是可见的\n\n我们将通过从不同的视角将场景渲染到多个帧缓冲区（frame\
  \ buffers）来实现这些目标，然后将生成的帧缓冲区作为纹理应用到经过 ADS 光照的蓝色水面上。这相当复杂，因此我们分部分介绍程序 15.3。在第一部分，我们首先将\
  \ `display()` 中的代码重新组织为单独的函数：(1) 用于准备渲染天空盒的函数，(2) 一个用于准备渲染顶表面的函数，(3) 一个用于准备渲染地板的函数。然后我们像以前一样渲染每一个项目。稍后，在第二部分中，我们将这些项目渲染到名为\
  \ `reflection` 和 `refraction` 的纹理纹理中，并将它们都应用到顶表面——但目前，我们只是重新组织代码以有助于未来的这一步骤。\n\n\
  （这些相同的函数在相机位于水面以下时也将有用。但目前，我们将仅集中于相机在水面以上的情况。）\n\n`display()` 函数的划分以及创建（但尚未填充）的\
  \ `reflection` 和 `refraction` 帧缓冲区如程序 15.3 所示。请注意，这两个帧缓冲区还包含深度附件（depth attachments）（我们之前在第\
  \ 8 章学习阴影映射时见过），这在稍后将很有用。\n\n### 程序 15.3 – 反射与折射（部分 1：准备）\n\n![image](img/prog15_3-1.jpg)\n\
  \n![image](img/prog15_3-2.jpg)\n\n![image](img/prog15_3-3.jpg)\n\n![image](img/prog15_3-4.jpg)\n\
  \n如前提到的，程序 15.3 的代码分布在三个部分，从上面列出的第一部分开始。到为止，程序 15.3 实际上并没有产生任何与程序 15.2 不同的渲染输出。然而，它重新组织代码的方式，这种方式在我们继续进行时将非常有用，因为我们\
  \ (1) 创建了两个用于存储 `reflection` 和 `refraction` 信息的自定义帧缓冲区，并且 (2) 隔离了 `display()` 中那些为渲染场景特定部分（天空盒、地板和表面）做准备的区域，便于多次渲染。\n\
  \n现在在第二部分（程序 15.3 的第二部分），我们构建 `reflection` 和 `refraction` 纹理。我们通过重复 `display()`\
  \ 中的某些操作来实现这一点，但使用了不同的视图矩阵（view matrices）。该策略在图 15.3 中所示。相机位于水面以上并略微向下看。在相机正下方且表面下是另一个略微向上的相机，它被称为“反射相机（reflection\
  \ camera）”。它被用于渲染表面以上的物体（如天空盒）以构建 `reflection` 纹理。它的位置深度等于相机在水面以上的高度，即 `surfacePlaneHeight\
  \ - cameraHeight`。我们的相机旋转实现仅包含俯角（pitch，绕 X 轴的旋转），因此对于反射相机，我们只需对俯角值取反即可。\n\n由于反射相机的目的是生成一个包含从表面反射的项目的纹理，当从反射相机的视角渲染时，我们只渲染那些水面以上的物体。因此，在这个示例中，我们会渲染天空盒，但不会渲染地板、表面或水中的任何物体。\n\
  \n折射纹理由第三个相机生成，被称为“折射相机（refraction camera）”。它利用与主相机相同的视图矩阵。折射应该渲染透过水看到的一切。也就是说，当主相机在表面上方向下看时，折射应该显示水面下的物体（例如鱼，在示例中是棋盘地板）。\n\
  \n![](img/fig15_03.jpg)\n\n图 15.3\n\n反射和折射相机的位置\n\n程序 15.3（第二部分）添加了将场景渲染到 `reflection`\
  \ 和 `refraction` 缓冲器的代码。这里有两个 `display()` 调用，一个用于填充 `reflection` 缓冲区，另一个用于填充 `refraction`\
  \ 缓冲区。（稍后，在第三部分中，我们将添加第三次 `display()` 调用，从实际相机渲染最终场景。请注意，这里在第二部分显示的两个 `display()`\
  \ 函数是将场景渲染到 `reflection` 和 `refraction` 场景，为第三部分的组装做准备。）在每个情况下，我们在渲染场景相关的元素之前都会绑定相应的缓冲区。请注意，我们现在已经在每个情况下增加了构建适当视图矩阵的代码，并根据上述对反射相机调整了俯角。我们在组装完整场景之前包含了后续的缓冲区绑定（这些步骤在第三部分给出）。\n\
  \n### 程序 15.3 – 部分 2：填充反射与折射缓冲区\n\n![image](img/prog15_3-p2-1.jpg)\n\n![image](img/prog15_3-p2-2.jpg)\n\
  \n最后，在第三部分中，我们通过将 `reflection` 和 `refraction` 纹理（在第二部分构建的）引入水表面来完成程序 15.3。然而，我们有一个小问题……\n\
  \n当我们渲染反射和折射纹理时，我们是以标准的带有 3D 透视的方式进行的，就像它们将要展示给观众看一样。例如，棋盘图案是在水平平面上渲染的，使得离相机近的格子更大，远处的格子更小。但我们习惯于应用“平坦”的\
  \ 2D 图像（即不具有透视的）。因此，我们无法通过顶表面的纹理坐标标准地使用这些反射和折射纹理。\n\n\n\n\n幸运的是，纠正这些问题出意想不到地简单。考虑位于水面之方的相机的情况。图\
  \ 15.4 显示了渲染到折射缓冲区（左侧）的场景，它仅包含水面以下的物体（其他地方全为黑色）；反射缓冲区（右侧），它仅包含水面以上的物体（其他地方全为黑色）；以及来自图\
  \ 15.2 的原始场景（在图 15.4 的中心重复出现），该场景包含了我们希望在其组装最终渲染场景的无纹理顶表面。\n\n![](img/fig15_04.jpg)\n\
  \n图 15.4\n\n折射和反射缓冲区（左侧/右侧）以及渲染场景（中间）\n\n图 15.4 说明了反射和折射缓冲区中的纹理已经处于所需的屏幕位置。因此，我们所做的仅仅是使用被纹理化对象的屏幕坐标（在此情况下为顶端水面），作为访问反射和折射缓冲区中纹理的坐标。屏幕坐标已经在顶点着色器中计算完毕，并位于变量\
  \ `gl_Position` 的 `(x,y)` 部分。我们只需要从顶点着色器将 `gl_Position` 的拷贝传递到片元着色器（作为一个变动顶点属性），并使用该部分的\
  \ `.xy` 部分作为纹理坐标。\n\n这种技术是投影纹理映射 [WP23] 的简单案例，可以用于场景某部分出现在物体上的情况。一个常见的例子是制作一个镜子（在某种意义上，我们在处理反射缓冲区时正在做这件事）。它被称为“投影”的，因为它类似于将场景投影到诸如投影屏幕之类的物体上。\n\
  \n我们现在准备好完成程序 15.3 了。在第三部分，反射和折射纹理被整合到水的顶表面。为了做到，C++/OpenGL 应用需要为着色器提供反射和折射缓冲区，以渲染顶表面。水面顶部的片元着色器是应用反射和折射纹理的地方。顶点着色器将\
  \ `gl_Position` 拷贝到名为 `glp` 的新顶点属性中并将其传递给片元着色器，后者将其作为纹理坐标用于应用反射和折射纹理。注意，坐标已从屏幕坐标范围转换为纹理坐标的适当\
  \ `[0..1]` 范围。还要注意，在反射的情况下，Y 纹理坐标从 1 中减去，因为在这种情况下，水水面的反射需要进行垂直翻转。\n\n第三部分还包含了处理主相机位于水面以下（即在水下观察场景）的情况的代码，我们现在可以讨论这种情况了。事实证明，这只需要少数少小的添加和修改：\n\
  \n- 如果相机在水面以下，我们可以忽略反射。\n- 当相机在表面下方向上透过顶表面观察时，折射缓冲区（和纹理）应该包含天空盒（以及鸟类和飞机等物体）。\n-\
  \ 在 `prepForTopSurfaceRender()` 和 `prepForFloorRender()` 函数中增加了代码，告知着色器相机是在水面以上还是以下。这是必要的，因为片元着色器需要知道是否要在顶表面包含反射纹理。\n\
  \n因此，在第三部分中，只有当相机在水面以上时，我们才计算反射。\n\n在水顶部的片元着色器中，反射和折射的混合取决于相机是在水面以上还是以下。如果相机在表面以上，则包含两个纹理。如果相机在水下，则折射纹理与蓝色水色混合。无论相机在水面以上还是以下，输出紧随代码之后显示，在图\
  \ 15.5 中。\n\n程序 15.3 – 部分 3：应用反射/折射纹理\n\n![image](img/prog15_3-p3-1.jpg)\n\n![image](img/prog15_3-p3-2.jpg)\n\
  \n![image](img/prog15_3-p3-3.jpg)\n\n![](img/fig15_05.jpg)\n\n图 15.5\n\n反射与折射 -\
  \ 相机在水面以上（左）和在水面以下（右）\n\n## 15.3 添加表面波\n\n到为止，我们模拟的水一直是完全静止的。现在我们为水面添加运动。有很多方法可以做到这一点，取决于我们想要模拟微小的波纹、风的随机影响、水流还是海浪。在我们的示例中，我们通过结合之前在第\
  \ 10 章介绍过的法线映射技术与噪声图，模拟了如微风时可能出现的适度波浪。由于波浪并非完全随机，我们为水面构建的噪声图将是我们之前在第 14 章中生成的噪声与正弦波规律的结合。噪声图将作为一种高度图，但请注意，我们并不会像通常的高度映射中那样实际修改水面几何结构。\n\
  \n噪声图是使用 14.5 节中的代码构建的，并对 `turbulence()` 函数进行了细微修改。具体而言，我们添加了一个跨越 XZ 平面的对角线正弦波：\n\
  \n![image](img/pg369.jpg)\n\n对角线正弦波通过 `sin(x+z)` 实现，带有额外的比例因子（`1/512`，假设噪声图沿 X 和\
  \ Z 维度的大小为 256），确保 `x+z` 的值范围是 `PI` 的倍数，以便正弦波在边界平滑循环，加 1 将正弦波从 `-1..+1` 转换为 `0..2`，然后将其缩放到所需的数值（在此情况下为因子\
  \ 8）。注意，由于我们一直在大量平铺，在此应用程序中使用 2 的幂作为噪声图维度尤为重要，这样噪声也能在边界循环。\n\n然后我们将噪声图传递给片元着色器，在其中使用它通过极小的偏移来改变法线。代码的添加显示在程序\
  \ 15.4 中。结果输出在图 15.6 中。\n\n程序 15.4 – 添加表面波\n\n![image](img/prog15_4-1.jpg)\n\n![image](img/prog15_4-2.jpg)\n\
  \n![](img/fig15_06.jpg)\n\n图 15.6\n\n通过正弦波和噪声图添加表面波 - 相机在水面以上（左）和在水面以下（右）\n\n##\
  \ 15.4 额外的修正\n\n观察图 15.6 中的图像并观察其中的以下“缺陷”：\n\n- 当相机在水以上（左图）时，我们预期地板上可见的棋盘格线条会根据水面的扭变而扭曲——但它们是直的。\n\
  - 当相机在表面以下（右图）时，我们预期地板上的光照也会发生类似的扭变，但高光是完美的圆形的。\n- 光在水下衰减更快，但地板无论近远亮度都相同。\n\n\n\n\
  \n# 菲涅尔效应 (Fresnel Effect)\n\n缺少菲涅尔效应。这种现象是指：从透明介质（如水）垂直向下观察时，折射占主导，而斜向观察表面时反射占主导\
  \ [B01]。相反，在左侧的图像中，反射和折射在整个顶部表面同样明显。\n\n当相机位于水面以上时，扭变棋格线的操作可以在渲染棋格的片段着色器部分完成。该着色器需要噪声图，因此我们在构建折射缓冲的\
  \ C++/OpenGL 应用程序部分添加以下代码，以向其发送噪声纹理：\n\n```\nglActiveTexture(GL_TEXTURE0);\nglBindTexture(GL_TEXTURE_3D,\
  \ noiseTexture);\n```\n\n用于渲染地板的修改后的片段着色器如程序 15.5 所示。\n\n### 15.5 – 水下物体扭变\n\n![image](img/prog15_5-1.jpg)\n\
  ![image](img/prog15_5-2.jpg)\n\n在程序 15.5 中，我们使用高度和畸变强度的小比例因子来扰动棋格地板上的法线。尝试不同的 `distortionStrength`\
  \ 值表明，只需在棋格颜色查找中引入极微小的畸变，就能在棋格线条中产生巨大的视觉畸变效果。另外注意，测试 `(isAbove!=1)` 确保了我们仅在相机位于表面以上时才包含畸变因子。\n\
  \n当相机位于水面以下时，扭变水下光照也可以在渲染棋格的片段着色器中完成。我们只需根据噪声图的估计法线来修改地板的法向量。在这种情况下，实验表明，与之前扭变棋格线条本身所需的数值相比，这种情况下需要更大的高度和畸变强度值。用于渲染地板的修改后的片段着色器见程序\
  \ 15.5 的延续。\n\n包含程序 15.5 所示所有更改的输出见图 15.7。\n\n### 15.5（续）– 水下光照扭变\n\n![image](img/prog15_5-3.jpg)\n\
  ![](img/fig15_07.jpg)\n\n**图 15.7**\n为地板图案及其光照添加畸变——相机在水面以上（左侧，地板图案扭变）和水面以下（右侧，光照扭变）\n\
  \n让远处的物体可见度降低在第 14.1 节（“雾”）中讨论过。那里提供的代码在这里几乎可以逐字使用，且仅在相机位于水面以下时使用。\n\n当相机位于顶部表面时，简单的菲涅尔效应可以显著增强真实感，这可以通过片段着色器实现：通过计算水面法线与观察方向之间的角度，然后根据角度的大小混合反射和折射分量。我们实验了不同的偏移量和缩放因子，发现对于此场景，将菲涅尔因子移向较小值（以增加折射贡献），将范围限制在\
  \ `[0..1]`（供后续 `mix()` 函数使用）并对其进行 3 次方（使效果变为非线性并锐化折射与反射主导之间的过渡），产生了令人愉悦的结果。其他场景可能需要不同的调整。我们还观察到，如果使用原始表面法线（即法线未被噪声和波浪扰动），效果最清晰。\n\
  \n两种效应的添加内容位于程序 15.6 中，结果见图 15.8。\n\n### 15.6 – 添加“雾”和“菲涅尔”效应\n\n![image](img/prog15_6-1.jpg)\n\
  ![image](img/prog15_6-2.jpg)\n![](img/fig15_08.jpg)\n\n**图 15.8**\n菲涅尔效应（左侧，水面以上）和雾效应（右侧，水面以下）\n\
  \n# 15.5 水体运动的动画化\n\n水面的动画化可以采用与处理云类似的方式，即利用噪声图中的第三维度（目前尚未未使用）。回想第 14.8 节中的技巧：将第三维度中的纹理查找常量替换为随时间改变的变量。随着检索得的噪声图“切片”发生变化，噪声细节也随之变化。我们在此处可以使用同样的技巧，在查找要应用哪一个噪声图“切片”时，随时间调整沿第三轴的位置来移动正弦波。\n\
  \n该修改见程序 15.7。虽然我们无法在此充分展示动画，但某些显示随时间推移的表面和光照变化的帧已给出图 15.9，并分别从水面以上和以下进行观察。（或者，若要查看实际运动，请运行辅助文件中提供的代码。）\n\
  \n### 15.7 – 水面的动画化\n\n![image](img/prog15_7-1.jpg)\n![image](img/prog15_7-2.jpg)\n\
  \n在图 15.9 中，当相机位于顶部表面以上时，注意每一帧随时间变化的。\n\n![](img/fig15_09.jpg)\n\n**图 15.9**\n动画水效果，位于水面以上和以下。在上方三张图像中，相机在表面以上，在下方三张图像中，相机在表面以下\n\
  \n## 15.6 水下焦散 (UNDERWATER CAUSTICS)\n\n在水下地板上观察弯曲的光带是常见现象，因为来自上方的光传输到了地板。这些带有时被称为焦散\
  \ [WC23]，添加它们可以使水下场景明显像在水中。在本节中，我们仅在相机位于水面以下时向场景添加它们（水面以上的情况见练习 15.4）。\n\n模拟水下焦散有多种方法。可以使用光线追踪较为准确地实现，尽管这非常复杂且计算量大\
  \ [G07]。然而，大多数情况下，焦散不需要完全准确，即使是粗略模拟也足以传达水中效果。大多数情况下，生成与水面波浪一致的白色线条即可。\n\n我们可以在片段着色器中直接从噪声图生成某种焦散模式，如下：首先计算噪声值的正弦；噪声值（范围从\
  \ 0 到 1）首先乘以 `2π`，以便正弦值能够平滑循环。这产生了一个在 `-1.0` 到 `1.0` 之间循环的值。该值的绝对值在 `0.0` 到 `1.0`\
  \ 之间循环，但在 `0.0` 附近斜率陡，在 `1.0` 附近斜率较缓。从 `1.0` 减去该绝对值反反转结果，在 `0.0` 附近产生长平坦区域，在 `1.0`\
  \ 附近产生尖峰。通过对其进行可调整的幂可以放大这种效果，使用名为 `strength` 的可调变量。结果是一个通常输出接近 0 的函数，但偶尔会有输出接近 1\
  \ 的小区域。当将其应用于给定世界坐标的顶部表面颜色值时，它会产生随顶部表面波浪的周期性图案，我们可以将其整合到底部颜色中。程序 15.8 显示了添加到片段着色器中的代码，并将计算出的值加到渲染地板的颜色中。输出见图\
  \ 15.10。\n\n\n\n\n请注意，添加光散后，地板的颜色元素会被限制在 `[0..1]` 范围内，以确保它们处于 RGB 值的有效范围内。\n\n##\
  \ 程序 15.8 – 添加水下光散\n\n![image](img/prog15_8-1.jpg)\n\n![image](img/prog15_8-2.jpg)\n\
  \n![](img/fig15_10.jpg)\n\n图 15.10\n\n当相机位于水面以下时添加的光散\n\n## 补充说明\n\n在实时图形应用中模拟水体是一个复杂的话题，我们仅触及一角。此外，我们只关注了一种水体。要模拟从花园软管喷出的水或酒杯中溅出的酒水，需要完全不同的技术。\n\
  \n即使是我们对游泳池或湖水面的模拟也是局限的。例如，使用所描述的方法只能在水面上产生微小的波纹。更大的波浪需要修改表面几何结构。实现这一点的一种方法是使用细分阶段（tessellation\
  \ stage）增加顶点数量，然后使用高度贴图（height mapping）根据噪声图中的值来移动它们。\n\n我们对地板上可见畸变的模拟存在一个根本性的缺陷，即它们是基于对应地板位置正上方表面位置的噪声值。实际上，给定地板位置的畸变应该基于相机与地板位置之间表面位置的噪声值。然而，这对于感知的真实性可能不会产生影响。在我们的实现过程中，有许多类似的简化处理。\n\
  \n“Fresnel”的读音是“Fre-nel” —— “s”是不发音的。\n\n对于想要深入研究水体和其他流体模拟主题的读者，有大量的论文和资源。甚至有关于该主题的完整书籍\
  \ [B15]。\n\n本章描述的技术很大参考了 Chris Swenson（来自 Havalo, LLC）的实现，这是加利福尼亚州立大学萨克拉门分校的一个特殊项目。他的贡献极大地促进了我们的讲解，我们感谢他生成这种逻辑清晰、循序渐进的方法所做的优秀工作。\n\
  \n## 练习题\n\n**15.1** 添加一个飞行物体，如鸟类或飞机（甚至是 NASA 航天器模型），在水面上方飞行。然后，当相机位于水面以上时，将其包含在水面顶部的反射中；当相机位于水面以下时，将其包含在通过水面顶部的折射中。\n\
  \n**15.2** 添加一个在水下移动的物体，如鱼或潜艇（甚至是 Studio 522 海豚），位于水面下方。然后，当相机位于水面以下时，将其包含在场景中；当相机位于水面以上时，将其包含在折射中。\n\
  \n**15.3** 在练习 15.2（上述）中，如果你还没有，请为水下物体添加水光散。\n\n**15.4** 修改程序 15.8 中的片段着色器，使得当相机位于水面以上时也渲染水光散。你认为在包含光散的情况下，场景看起来是显得更真实还是更不真实？如果是后者，尝试寻找一种调整光散的方法，使其增加真实性而非削减真实性。\n\
