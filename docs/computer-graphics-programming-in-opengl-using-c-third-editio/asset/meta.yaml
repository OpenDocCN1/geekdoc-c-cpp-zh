- - '###'
  - 4.1 (项目) 修改程序 4.1，将立方体替换为你设计的其他简单 3D 形状。确保在 `glDrawArrays()` 命令中正确指定顶点数量。
- - '###'
  - 4.2 (项目) 在程序 4.1 中，“视图”矩阵在 `display()` 函数中简单地定义为相机位置的负值。
- - '###'
  - 4.3 (项目) 修改程序 4.4 包含第二个“行星”，即你在练习 4.1 中创建的自定义 3D 形状。确保你的新“行星”与现有行星在不同的轨道上，这样它们就不会发生碰撞。
- - '###'
  - 4.4 (项目) 修改程序 4.4，使用“look-at”函数来构造“视图”矩阵（如第 3.9 节中描述）。然后尝试将“look-at”参数设置为不同的位置，例如看向太阳（在这种情况下场景看起来应该是正常的）、看向行星或看向月球。
- - '###'
  - 4.5 (研究) 为 `glCullFace(GL_FRONT_AND_BACK)` 提出一个实际用途。
