    A readonly field is a variable that can only be assigned once, and only in the
    following places:


    +   - At declaration, like `public readonly int x = 5;`

    +   - Inside a constructor of the class in which it''s defined

    +   - Once set, its value cannot be changed elsewhere, even inside other methods
    of the same class.

    +   - Trying to modify it outside the constructor causes a compile-time error:

    +   - "A readonly field cannot be assigned to (except in a constructor or a variable
    initializer)"

    +   - This makes readonly great for values that are determined when the object
    is created and should not change afterward, like configuration values or identifiers.

    +   - Unlike const, readonly allows setting the value at runtime using constructor
    parameters.


    # [Supplement]


    If you have a value that can’t be known until runtime (like user input), but still
    should not change after being set, readonly is the correct choice.'
