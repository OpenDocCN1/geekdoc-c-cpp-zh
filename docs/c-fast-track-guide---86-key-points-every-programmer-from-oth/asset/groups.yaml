    ```\n\n中间件通过以下方式添加：\n\n```csharp\napp.UseAuthentication();\napp.UseAuthorization();\n\
    ```\n\n### [补充]\n\n- Identity 在底层使用 Entity Framework Core。\n- 你可以扩展 IdentityUser\
