    - ASP.NET Core 应用程序运行在 Kestrel 上，这是一个跨平台 Web 服务器。\n- 它们可以处理动态页面、REST API 并连接数据库。\n\
    \n该框架高度模块化，意味着你只需添加所需的部分（例如路由、MVC、Razor 等）。它速度快，适用于云原生应用程序、微服务和传统网站。\n\n---\n\n\
