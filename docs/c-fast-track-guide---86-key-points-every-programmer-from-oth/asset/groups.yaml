    A switch expression is an expression (returns a value), not a statement.


    That means it can directly be used to assign values, like in:


    ```

    string result = input switch { ... };

    ```


    This differs from the classic switch statement which requires case blocks and
    break keywords, often making the code longer and more error-prone.


    Also note:


    +   - The _ symbol means "any other case", i.e., the default.

    +   - You can use pattern matching (e.g., ranges, types) inside switch expressions.

    +   - The or keyword allows combining multiple conditions for one result.

    +   - This is great for data mapping, UI logic, or simplifying if-else chains
    into a single expression.


    # [Supplement]


    switch expressions were introduced in C# 8.0. They support advanced patterns like
    type checks, relational patterns (e.g., <, >=), tuple patterns, and more. They
    encourage functional-style programming where functions return values directly
    from expressions.'
