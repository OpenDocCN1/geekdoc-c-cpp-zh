    \ Age: 30\n\nAnonymous types are defined using the `new { }` syntax. They are\
    \ mostly used when:\n\n- You need a simple data structure for temporary use.\n\
    - You don’t want to create a full class for holding just a few pieces of data.\n\
    \nThe compiler automatically infers the type and generates a class with read-only\
