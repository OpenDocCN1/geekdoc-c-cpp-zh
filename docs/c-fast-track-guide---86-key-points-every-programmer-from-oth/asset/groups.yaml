    \    {\n        Console.WriteLine(\"Hello from reflection!\");\n    }\n}\n\nclass\
    \ Program\n{\n    static void Main()\n    {\n        // Get the type info of the\
    \ HelloWorld class\n        Type type = typeof(HelloWorld);\n\n        // Create\
    \ an instance of HelloWorld dynamically\n        object instance = Activator.CreateInstance(type);\n\
    \n        // Get the method info for SayHello\n        MethodInfo method = type.GetMethod(\"\
    SayHello\");\n\n        // Invoke the SayHello method on the instance\n      \
    \  method.Invoke(instance, null);\n    }\n}\n```\n\n### [Execution Result]\n\n\
    Hello from reflection!\n\n### Step-by-step explanation:\n\n- `typeof(HelloWorld)`\
    \ gets the `Type` object for the `HelloWorld` class. This object contains metadata\
    \ about the class.\n- `Activator.CreateInstance(type)` dynamically creates an\
    \ instance of `HelloWorld`. You don’t need to use `new HelloWorld()` directly.\n\
    - `type.GetMethod(\"SayHello\")` retrieves metadata about the method named `\"\
    SayHello\"`.\n- `method.Invoke(instance, null)` actually calls the method on the\
    \ created instance.\n\n### Why is this powerful?\n\n- You can build flexible systems,\
    \ like plugin loaders, object mappers, or test frameworks.\n- Useful when you\
    \ don’t know the exact types at compile-time.\n\n### Common pitfalls:\n\n- Reflection\
    \ is slower than direct calls.\n- You lose compile-time checking — misspelled\
    \ method names won’t be caught until runtime.\n\n### [Supplement]\n\n- Reflection\
    \ is part of the `System.Reflection` namespace.\n- You can inspect fields, properties,\
    \ constructors, interfaces, and more — not just methods.\n- ASP.NET Core uses\
    \ reflection internally for dependency injection and routing.\n- You can combine\
    \ reflection with custom attributes for powerful behaviors.\n\n## 32. USING ATTRIBUTES\
    \ AS METADATA TAGS\n\nAttributes are like special tags added to your code. They\
    \ add extra information (metadata) that tools or reflection-based code can read.\n\
    \nHere’s an example of defining and reading a custom attribute using reflection.\n\
    \n### [Code Example]\n\n```csharp\nusing System;\nusing System.Reflection;\n\n\
    // Define a custom attribute\n[AttributeUsage(AttributeTargets.Class)]\npublic\
    \ class InfoAttribute : Attribute\n{\n    public string Message { get; }\n   \
    \ public InfoAttribute(string message)\n    {\n        Message = message;\n  \
    \  }\n}\n\n// Apply the custom attribute to a class\n[Info(\"This class does something\
    \ important.\")]\npublic class ImportantClass\n{\n}\n\nclass Program\n{\n    static\
    \ void Main()\n    {\n        // Get type information\n        Type type = typeof(ImportantClass);\n\
    \        // Check if the attribute is applied\n        if (Attribute.IsDefined(type,\
    \ typeof(InfoAttribute)))\n        {\n            // Get the attribute instance\n\
    \            InfoAttribute attr = (InfoAttribute)Attribute.GetCustomAttribute(type,\
    \ typeof(InfoAttribute));\n            Console.WriteLine(\"Attribute message:\
    \ \" + attr.Message);\n        }\n    }\n}\n```\n\n### [Execution Result]\n\n\
    Attribute message: This class does something important.\n\n### Step-by-step explanation:\n\
    \n- `[AttributeUsage(AttributeTargets.Class)]` specifies where the attribute can\
    \ be used (e.g., on classes).\n- `InfoAttribute` is a custom attribute class that\
