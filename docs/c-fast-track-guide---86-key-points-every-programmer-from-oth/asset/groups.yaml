    # 85. SELF-CONTAINED VS. FRAMEWORK-DEPENDENT DEPLOYMENT IN C#


    C# applications can be deployed either by including everything they need (self-contained)
    or relying on a pre-installed .NET runtime (framework-dependent).


    Here’s how to create both types of deployment using the .NET CLI.


    [Code Example]


    ```

    # Framework-dependent deployment

    dotnet publish -c Release -r win-x64—self-contained false


    # Self-contained deployment

    dotnet publish -c Release -r win-x64—self-contained true

    ```


    [Execution Result]


    Creates a /publish folder with either a lightweight app (framework-dependent)
    or a complete, standalone app (self-contained).


    Self-contained deployment means all the required .NET runtime and libraries are
    included in the published files. The app can run on a machine without .NET installed.


    The downside: the output folder is larger because it includes the runtime.


    Framework-dependent deployment assumes the target machine already has the correct
    .NET runtime installed. The output is smaller, but portability depends on external
    factors.'
  - '[PAGE 248]


    In both cases:


    +   - -c Release: compiles in release mode (optimized).

    +   - -r win-x64: specifies the runtime identifier (here for 64-bit Windows).

    +   - —self-contained true/false: switches between the two deployment modes.


    Choose self-contained for maximum portability (e.g., distributing apps to users).
    Choose framework-dependent for controlled environments (e.g., enterprise servers).


    [Supplement]


    .NET apps use Runtime Identifiers (RIDs) to specify the target OS/platform. Examples
    include win-x64, linux-x64, and osx-arm64.


    To list supported RIDs, see the RuntimeIdentifierGraph.json in the .NET SDK folder
    or visit the official .NET RID catalog.'
  - '[PAGE 249]


    # 86. BOOSTING PERFORMANCE WITH AOT COMPILATION


    C# now supports ahead-of-time (AOT) compilation to turn code into native machine
    instructions before runtime, speeding up startup and reducing memory usage.


    Let’s use .NET''s native AOT publishing to compile a simple app into a native
    executable.


    [Code Example]


    ```

    # First, create a basic console app

    dotnet new console -o HelloAOT

    cd HelloAOT


    # Then publish it using Native AOT

    dotnet publish -c Release -r win-x64 /p:PublishAot=true

    ```


    [Execution Result]


    Produces a native .exe (or platform-specific binary) in the bin\Release\net8.0\win-x64\publish
    directory.


    AOT (Ahead-of-Time) compilation transforms C# code into platform-specific machine
    code at build time, rather than at runtime (like traditional JIT compilation).


    Benefits:


    +   - Faster startup

    +   - Reduced memory footprint'
