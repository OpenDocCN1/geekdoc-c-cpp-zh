  md: "\nIn C#, implicit and explicit conversions let you define how objects are cast\
    \ between types:\n\n- implicit: No cast is needed in code. This is safe and should\
    \ not lose information or throw exceptions.\n- explicit: Requires a cast in code\
    \ using (Type), often used when there's potential for data loss or the conversion\
    \ is not always valid.\n\nIn the example:\n\nCelsius can be created directly from\
    \ a double with no cast, thanks to the implicit operator.\n\nA Celsius object\
    \ can be explicitly cast to Fahrenheit using the defined conversion logic.\n\n\
    These operators make the API cleaner and allow safer, controlled type conversions.\n\
    \nWhy this matters:\n\nIt’s extremely useful in APIs, data transfer, or mathematical\
    \ classes where natural type interactions matter.\n\nThese custom conversions\
    \ are more readable than having methods like .ToFahrenheit() or constructors everywhere.\n\
    \n### [Supplement]\n\n- Always define conversions symmetrically where possible\
    \ (e.g., if Celsius → Fahrenheit exists, consider Fahrenheit → Celsius).\n- Be\
    \ cautious with implicit conversions; they can cause unexpected bugs if they do\
    \ something non-obvious.\n\nThis feature can also be used to convert between enums,\
    \ structs, and even interfaces, as long as conversions are meaningful.\n\n## 39.\
    \ AVOIDING NULL ERRORS WITH NULLABLE REFERENCE TYPES\n\nC#'s nullable reference\
    \ types help prevent null-related runtime errors by letting you explicitly declare\
    \ whether a reference can be null or not.\n\nHere’s a simple example demonstrating\
    \ how enabling nullable reference types can help you catch potential null issues\
    \ at compile time.\n\n[Code Example]\n\n```\n#nullable enable // Enables nullable\
    \ reference types\nclass Person\n{\npublic string Name { get; set; } // Warning:\
    \ May be null if not initialized\n}\nclass Program\n{\nstatic void Main()\n{\n\
    Person person = new Person();\nConsole.WriteLine(person.Name.Length); // Possible\
    \ NullReferenceException warning\n}\n}\n```\n\n[Execution Result]\n\nWarning:\
    \ Dereference of a possibly null reference.\n\nIn C# 8.0 and later, the #nullable\
    \ enable directive tells the compiler to treat reference types (string, object,\
    \ etc.) as non-nullable by default. This means if you write string Name;, the\
    \ compiler will assume Name should never be null and will warn you if it thinks\
    \ it might be.\n\nIf a reference can be null, you must declare it explicitly using\
    \ ?, like this:\n\n```\npublic string? Name { get; set; } // nullable string\n\
    ```\n\nThis makes the code safer and easier to understand. You’ll be warned at\
    \ compile time if you try to use a variable that might be null, instead of encountering\
    \ a crash at runtime.\n\nThis feature is compile-time only — it doesn't stop nulls\
    \ at runtime, but helps developers catch issues early.\n\nEnabling this feature\
    \ across your whole project is done via project settings (<Nullable>enable</Nullable>\
    \ in the .csproj file).\n\n### [Supplement]\n\nNullable reference types were introduced\
    \ in C# 8.0.\n\nThey only work if explicitly enabled (either per file with #nullable\
    \ enable or globally via project settings).\n\nIt’s about warnings — no runtime\
    \ performance hit.\n\nYou still need null checks or the null-coalescing operator\
    \ ?? to handle values safely at runtime.\n\nWith person?.Name, the expression\
    \ evaluates to null instead of crashing.\n\nThis is especially useful when chaining\
    \ multiple property accesses.\n\nExample:\n\n```\nstring name = person?.Name ??\
    \ \"Unknown\"; // Returns \"Unknown\" if person is null\n```\n\nThis operator\
    \ is a concise and readable way to handle potential null values without verbose\
    \ if statements.\n\nNote: It only short-circuits the current access. If you write\
    \ person?.Name.Length, it will throw an exception if Name is null, so use it wisely.\n\
    \n### [Supplement]\n\n- Introduced in C# 6.0.\n- It's one of the most effective\
    \ tools to reduce if (x != null) clutter.\n- Works with methods too: person?.ToString()\n\
    - Can be used with indexers: array?[index]\n- Cannot be used in assignment targets\
    \ (person?.Name = \"John\"; is invalid).\n\n## 41. PROVIDING FALLBACK VALUES WITH\
    \ ??\n\nThe null-coalescing operator ?? helps you safely assign fallback (default)\
    \ values when a variable might be null.\n\nHere’s how you can avoid null values\
    \ by using ?? to supply a default value.\n\n[Code Example]\n\n```csharp\n// This\
    \ variable might be null\nstring? userInput = null;\n\n// Use ?? to provide a\
    \ fallback value if userInput is null\nstring result = userInput ?? \"Default\
    \ Value\";\n\n// Print the result\nConsole.WriteLine(result);\n```\n\n[Execution\
    \ Result]\n\nDefault Value\n\nIn C#, a variable of a reference type (like string)\
    \ can hold null, meaning \"no value\".\n\nThis can be risky—if you try to use\
    \ a null value without checking, it can cause runtime errors (e.g., NullReferenceException).\n\
    \nThe ?? operator solves this problem by letting you specify a \"backup\" value.\n\
    \nA ?? B means: if A is not null, use A; otherwise, use B.\n\nThis is extremely\
    \ useful when you're dealing with user input, optional data, or data from uncertain\
    \ sources.\n\nIn the code example:\n\nuserInput is null.\n\nresult = userInput\
    \ ?? \"Default Value\" assigns \"Default Value\" to result since userInput was\
    \ null.\n\nYou can also chain ?? to try multiple fallback options:\n\n```csharp\n\
    string? input = null;\nstring? backup = null;\nstring final = input ?? backup\
    \ ?? \"Nothing available\";\n```\n\n### [Supplement]\n\nThe null-coalescing operator\
    \ works great with nullable types.\n\nIt’s especially helpful in APIs or databases\
    \ where some values may be missing.\n\nIn C# 8.0 and later, there's also ??= which\
    \ assigns a default only if the value is null:\n\n```csharp\nstring? name = null;\n\
    name ??= \"Guest\";  // name becomes \"Guest\"\n```\n\nUse ?? often to write safer\
    \ and cleaner code when dealing with uncertain data.\n\n## 42. EASIER STRING FORMATTING\
    \ WITH INTERPOLATED STRINGS\n\nInterpolated strings make it easier to build strings\
    \ with variables, replacing the older and harder-to-read string formatting methods.\n\
    \nHere's how you can combine variables and text in a clean and readable way using\
    \ $\"...\".\n\n[Code Example]\n\n```\nstring name = \"Alice\";\nint age = 30;\n\
    // Interpolated string using variables inside the string\nstring message = $\"\
    Hello, my name is {name} and I am {age} years old.\";\nConsole.WriteLine(message);\n\
    ```\n\n[Execution Result]\n\nHello, my name is Alice and I am 30 years old.\n\n\
    Traditionally, C# developers used methods like string.Format() or concatenation\
    \ (+) to combine strings and variables, which can be hard to read:\n\n```\nstring\
    \ msg = \"Hello, my name is \" + name + \" and I am \" + age + \" years old.\"\
    ;\n```\n\nBut interpolated strings—introduced in C# 6—make this much cleaner and\
    \ more readable.\n\n- Use the $ symbol before a string literal to start interpolation.\n\
    - Place variables or expressions inside {} directly in the string.\n\nYou can\
    \ even perform calculations inside {}:\n\n```\nstring summary = $\"In 5 years,\
    \ {name} will be {age + 5} years old.\";\n```\n\nThis makes your code more expressive\
    \ and reduces the chance of mistakes.\n\nIt’s also very useful for debugging,\
    \ logging, UI text, and anywhere you display dynamic information.\n\n### [Supplement]\n\
    \nYou can format values directly inside interpolated strings:\n\n```csharp\ndouble\
    \ price = 12.5;\nConsole.WriteLine($\"Total: {price:C}\");  // Output: Total:\
    \ $12.50 (depending on locale)\n```\n\nUse escape sequences like {{ or }} to print\
    \ braces literally:\n\n```\nConsole.WriteLine($\"Value in braces: {{{123}}}\"\
    );  // Output: Value in braces: {123}\n```\n\nInterpolated strings support everything\
    \ expressions can do—math, method calls, even ternary operators. They're a powerful\
    \ tool in writing readable, maintainable C# code.\n\n## 43. CONCISE PATTERN MATCHING\
    \ WITH SWITCH EXPRESSIONS\n\nswitch expressions in C# allow for more compact and\
    \ readable code compared to traditional switch statements, especially when matching\
    \ multiple patterns or returning values.\n\nHere's a short example demonstrating\
    \ how switch expressions can simplify decision logic in C#.\n\n[Code Example]\n\
    \n```\nusing System;\n\nclass Program\n{\n    static void Main()\n    {\n    \
    \    // Input: day of the week\n        string day = \"Saturday\";\n\n       \
    \ // Using switch expression to get the type of the day\n        string dayType\
    \ = day switch\n        {\n            \"Saturday\" or \"Sunday\" => \"Weekend\"\
    ,  // matches either Saturday or Sunday\n            \"Monday\" => \"Start of\
    \ work week\",  // single match\n            \"Friday\" => \"Almost weekend\"\
    ,  // single match\n            _ => \"Weekday\"  // default case\n        };\n\
    \n        Console.WriteLine(dayType);\n    }\n}\n```\n\n[Execution Result]\n"
  mdcn: "\n在 C# 中，隐式和显式转换让你可以定义对象如何在类型之间进行转换：\n\n- 隐式转换：代码中无需强制转换。它是安全的，不应丢失信息或抛出异常。\n\
    - 显式转换：需要使用 (Type) 在代码中进行强制转换，通常用于可能出现数据丢失或转换并非总是有效的情况。\n\n在示例中：\n\n由于隐式运算符，可以直接从\
    \ double 创建 Celsius，无需强制转换。\n\n可以使用定义的转换逻辑，将 Celsius 对象显式转换为 Fahrenheit。\n\n这些运算符使\
    \ API 更简洁，并允许更安全、可控的类型转换。\n\n为什么这很重要：\n\n在需要自然类型交互的 API、数据传输或数学类中，这极其有用。\n\n这些自定义转换比到处使用\
    \ .ToFahrenheit() 之类的方法或构造函数更具可读性。\n\n### [补充]\n\n- 尽可能对称地定义转换（例如，如果存在 Celsius\
    \ → Fahrenheit，也应考虑 Fahrenheit → Celsius）。\n- 对隐式转换要谨慎；如果它们执行了不明显的操作，可能会导致意外的\
    \ bug。\n\n此功能也可用于在枚举、结构体甚至接口之间进行转换，只要转换是有意义的。\n\n## 39. 使用可空引用类型避免空引用错误\n\nC#\
    \ 的可空引用类型通过让你显式声明引用是否可以为 null，帮助防止与 null 相关的运行时错误。\n\n下面是一个简单示例，演示启用可空引用类型如何帮助你在编译时发现潜在的\
    \ null 问题。\n\n[代码示例]\n\n```\n#nullable enable // Enables nullable reference types\n\
    class Person\n{\npublic string Name { get; set; } // Warning: May be null if not\
    \ initialized\n}\nclass Program\n{\nstatic void Main()\n{\nPerson person = new\
    \ Person();\nConsole.WriteLine(person.Name.Length); // Possible NullReferenceException\
    \ warning\n}\n}\n```\n\n[执行结果]\n\n警告：可能对 null 引用进行解引用。\n\n在 C# 8.0 及更高版本中，#nullable\
    \ enable 指令告诉编译器默认将引用类型（string、object 等）视为不可空类型。这意味着如果你编写 string Name;，编译器会假定\
    \ Name 永远不应该为 null，并且如果它认为可能为 null 时会发出警告。\n\n如果引用可以为 null，你必须使用 ? 显式声明它，如下所示：\n\
    \n```\npublic string? Name { get; set; } // nullable string\n```\n\n这使代码更安全且更易于理解。如果你试图使用可能为\
    \ null 的变量，你会在编译时收到警告，而不是在运行时遇到崩溃。\n\n此功能仅存在于编译时——它不会在运行时阻止 null，但能帮助开发者尽早发现问题。\n\
    \n在整个项目中启用此功能是通过项目设置完成的（在 .csproj 文件中的 <Nullable>enable</Nullable>）。\n\n### [补充]\n\
    \n可空引用类型是在 C# 8.0 中引入的。\n\n它们只有在显式启用时才有效（要么在每个文件上使用 #nullable enable，要么通过项目设置全局启用）。\n\
    \n这仅涉及警告——没有运行时性能影响。\n\n你仍然需要 null 检查或空合并运算符 ?? 来在运行时安全地处理值。\n\n使用 person?.Name\
    \ 时，表达式会求值为 null，而不会崩溃。\n\n这在链式访问多个属性时尤其有用。\n\n示例：\n\n```\nstring name = person?.Name\
    \ ?? \"Unknown\"; // Returns \"Unknown\" if person is null\n```\n\n这个运算符是处理潜在\
    \ null 值的一种简洁且可读的方式，无需冗长的 if 语句。\n\n注意：它只会短路当前的访问。如果你编写 person?.Name.Length，当\
    \ Name 为 null 时会抛出异常，所以要明智地使用它。\n\n### [补充]\n\n- 在 C# 6.0 中引入。\n- 它是减少 if (x !=\
    \ null) 这种杂乱代码的最有效工具之一。\n- 也适用于方法：person?.ToString()\n- 可用于索引器：array?[index]\n\
    - 不能用于赋值目标（person?.Name = \"John\"; 是无效的）。\n\n## 41. 使用 ?? 提供回退值\n\n空合并运算符 ??\
    \ 帮助你在变量可能为 null 时安全地分配回退（默认）值。\n\n下面介绍如何通过使用 ?? 提供默认值来避免 null 值。\n\n[代码示例]\n\n\
    ```csharp\n// This variable might be null\nstring? userInput = null;\n\n// Use\
    \ ?? to provide a fallback value if userInput is null\nstring result = userInput\
    \ ?? \"Default Value\";\n\n// Print the result\nConsole.WriteLine(result);\n```\n\
    \n[执行结果]\n\n默认值\n\n在 C# 中，引用类型（如 string）的变量可以保存 null，意思是“没有值”。\n\n这可能很危险——如果你不检查就试图使用\
    \ null 值，它可能会导致运行时错误（例如 NullReferenceException）。\n\n?? 运算符通过让你指定一个“备用”值来解决此问题。\n\
    \nA ?? B 的意思是：如果 A 不为 null，则使用 A；否则使用 B。\n\n当你处理用户输入、可选数据或来自不确定来源的数据时，这极其有用。\n\
    \n在代码示例中：\n\nuserInput 为 null。\n\nresult = userInput ?? \"Default Value\" 将 \"\
    Default Value\" 赋给 result，因为 userInput 为 null。\n\n你还可以链式使用 ?? 来尝试多个回退选项：\n\n```csharp\n\
    string? input = null;\nstring? backup = null;\nstring final = input ?? backup\
    \ ?? \"Nothing available\";\n```\n\n### [补充]\n\n空合并运算符与可空类型配合得很好。\n\n在可能存在某些值缺失的\
    \ API 或数据库中，它尤其有用。\n\n在 C# 8.0 及更高版本中，还有 ??=，它仅在值为 null 时分配默认值：\n\n```csharp\n\
    string? name = null;\nname ??= \"Guest\";  // name becomes \"Guest\"\n```\n\n\
    在处理不确定数据时，经常使用 ?? 来编写更安全、更简洁的代码。\n\n## 42. 使用内插字符串简化字符串格式化\n\n内插字符串使你可以更轻松地使用变量构建字符串，取代了更旧且更难阅读的字符串格式化方法。\n\
    \n下面介绍如何使用 $\"...\" 以简洁且可读的方式组合变量和文本。\n\n[代码示例]\n\n```\nstring name = \"Alice\"\
    ;\nint age = 30;\n// Interpolated string using variables inside the string\nstring\
    \ message = $\"Hello, my name is {name} and I am {age} years old.\";\nConsole.WriteLine(message);\n\
    ```\n\n[执行结果]\n\n你好，我的名字是 Alice，我今年 30 岁。\n\n传统上，C# 开发人员使用 string.Format() 或连接符\
    \ + 等方法来组合字符串和变量，这可能难以阅读：\n\n```\nstring msg = \"Hello, my name is \" + name +\
    \ \" and I am \" + age + \" years old.\";\n```\n\n但内插字符串（在 C# 6 中引入）使这一操作更加简洁和易读。\n\
    \n- 在字符串字面量前使用 $ 符号来开始内插。\n- 直接将变量或表达式放在字符串中的 {} 内。\n\n你甚至可以在 {} 内执行计算：\n\n```\n\
    string summary = $\"In 5 years, {name} will be {age + 5} years old.\";\n```\n\n\
    这使你的代码更具表现力，并减少出错的机会。\n\n它对于调试、日志记录、UI 文本以及任何显示动态信息的地方也非常有用。\n\n### [补充]\n\n你可以直接在内插字符串中格式化值：\n\
    \n```csharp\ndouble price = 12.5;\nConsole.WriteLine($\"Total: {price:C}\"); \
    \ // Output: Total: $12.50 (depending on locale)\n```\n\n使用像 {{ 或 }} 这样的转义序列来原样打印花括号：\n\
    \n```\nConsole.WriteLine($\"Value in braces: {{{123}}}\");  // Output: Value in\
    \ braces: {123}\n```\n\n内插字符串支持表达式所能做的一切——数学运算、方法调用、甚至三元运算符。它们是编写可读、可维护的 C# 代码的强大工具。\n\
    \n## 43. 使用 switch 表达式进行简洁模式匹配\n\n与传统的 switch 语句相比，C# 中的 switch 表达式允许更紧凑和可读的代码，尤其是在匹配多个模式或返回值时。\n\
    \n下面是一个简短示例，演示 switch 表达式如何简化 C# 中的决策逻辑。\n\n[代码示例]\n\n```\nusing System;\n\nclass\
    \ Program\n{\n    static void Main()\n    {\n        // Input: day of the week\n\
    \        string day = \"Saturday\";\n\n        // Using switch expression to get\
    \ the type of the day\n        string dayType = day switch\n        {\n      \
    \      \"Saturday\" or \"Sunday\" => \"Weekend\",  // matches either Saturday\
    \ or Sunday\n            \"Monday\" => \"Start of work week\",  // single match\n\
    \            \"Friday\" => \"Almost weekend\",  // single match\n            _\
