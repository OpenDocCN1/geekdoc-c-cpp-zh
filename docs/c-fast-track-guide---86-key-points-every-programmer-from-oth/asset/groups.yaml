    # 12. UNDERSTANDING VAR: IMPLICIT TYPING WITH STRONG TYPING


    var lets you declare a variable without explicitly writing the type, but C# still
    figures it out during compilation — so the type is fixed and strongly typed.


    Here’s how var can simplify code while keeping strong typing intact.


    [Code Example]


    ```

    using System;

    class Program

    {

    static void Main()

    {

    var name = "Alice"; // Compiler sees this as string

    var age = 25; // Compiler sees this as int

