    # 58. ORGANIZING CODE WITH NAMESPACES


    Namespaces are used to group related classes, avoid name clashes, and keep code
    organized.


    The following example shows how two classes with the same name can coexist in
    different namespaces.


    [Code Example]


    ```

    using System;

    namespace MyApp.Utilities {

    class Logger {

    public static void Log() {

    Console.WriteLine("Logging from Utilities namespace");

    }

    }

    }

    namespace MyApp.DebugTools {

    class Logger {

    public static void Log() {

    Console.WriteLine("Logging from DebugTools namespace");

    }

    }

    }

    class Program {

    static void Main() {

    // Fully qualify to avoid ambiguity

    MyApp.Utilities.Logger.Log();

    MyApp.DebugTools.Logger.Log();

    }

    }

    ```'
  - '[PAGE 171]


    # [Execution Result]


    +   - Logging from Utilities namespace

    +   - Logging from DebugTools namespace


    Namespaces in C# are like folders for your code. They prevent name conflicts when
    different parts of your application (or different libraries) use the same class
    names.


    In the example, both Logger classes are valid because they are in different namespaces.
    You can access either by specifying the full path (MyApp.Utilities.Logger) or
    by using a using directive.


    This is especially important in large projects or when integrating third-party
    libraries — without namespaces, identical class names would cause compile-time
    errors.


    Also, Visual Studio automatically places files in a namespace that matches the
    folder structure, encouraging logical organization.


    # [Supplement]


    +   - The using directive can simplify access to types in a namespace.

    +   - C# allows nested namespaces: namespace A.B.C is valid.

    +   - The .NET Framework uses namespaces extensively (e.g., System.IO, System.Net,
    etc.) to group functionality.

    +   - Namespaces are purely organizational — they don’t affect runtime behavior.'
