    If a reference can be null, you must declare it explicitly using ?, like this:


    ```

    public string? Name { get; set; } // nullable string

    ```


    This makes the code safer and easier to understand. You’ll be warned at compile
    time if you try to use a variable that might be null, instead of encountering
    a crash at runtime.


    This feature is compile-time only — it doesn''t stop nulls at runtime, but helps
    developers catch issues early.


    Enabling this feature across your whole project is done via project settings (<Nullable>enable</Nullable>
    in the .csproj file).


