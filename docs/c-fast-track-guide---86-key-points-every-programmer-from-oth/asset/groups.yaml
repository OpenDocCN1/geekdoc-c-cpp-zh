    {\n    static void Main()\n    {\n        CreateAndForget();\n\n        // Force\
    \ garbage collection\n        GC.Collect();\n        GC.WaitForPendingFinalizers();\n\
    \        Console.WriteLine(\"GC forced manually.\");\n    }\n\n    static void\
    \ CreateAndForget()\n    {\n        Test t = new Test();\n        // 't' goes\
    \ out of scope here, eligible for GC\n    }\n}\n```\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_193_0.png)\n\
