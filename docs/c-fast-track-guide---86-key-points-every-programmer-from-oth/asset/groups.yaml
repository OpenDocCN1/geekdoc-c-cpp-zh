    - OnPost() is automatically called when the form is submitted via POST.\n- BindProperty\
    \ binds the form field to the property.\n- This structure avoids needing a separate\
    \ controller, making Razor Pages less complex than MVC for smaller applications\
    \ or beginners.\n\n### [Supplement]\n\n- Razor Pages were introduced in ASP.NET\
    \ Core 2.0.\n- They follow the MVVM (Model-View-ViewModel) pattern, making them\
