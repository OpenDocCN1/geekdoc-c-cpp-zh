    \n## 65. 事件处理程序和循环引用导致的内存泄漏\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_188_3.png)\n\
    \nC# 中仍然可能发生内存泄漏，尤其是在事件处理程序未正确取消订阅时，或循环引用阻止垃圾回收器释放对象时。\n\n此示例演示了如果对象订阅了事件但从未取消订阅，即使在不再需要后也会发生内存泄漏的情况。\n\
    \n### [代码示例]\n\n```csharp\nusing System;\n\nclass Publisher\n{\n    public event\
    \ EventHandler SomethingHappened;\n\n    public void TriggerEvent() => SomethingHappened?.Invoke(this,\
    \ EventArgs.Empty);\n}\n\nclass Subscriber\n{\n    public Subscriber(Publisher\
    \ publisher)\n    {\n        // This subscription causes the publisher to hold\
