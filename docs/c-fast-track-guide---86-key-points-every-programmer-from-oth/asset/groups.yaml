    \ string Name { get; set; } // Non-nullable\n    public string? Nickname { get;\
    \ set; } // Nullable\n}\n\nclass Program\n{\n    static void Main()\n    {\n \
    \       var user = new User();\n        user.Name = \"Alice\";\n        user.Nickname\
    \ = null;\n\n        // Accessing without null check causes a warning\n      \
    \  Console.WriteLine(user.Nickname.Length); // △ Possible null reference warning\n\
    \    }\n}\n```\n```\n\n[Execution Result]\n\nCompiler warning: Dereference of\
    \ a possibly null reference.\n\n## 85. SELF-CONTAINED VS. FRAMEWORK-DEPENDENT\
    \ DEPLOYMENT IN C#\n\nC# applications can be deployed either by including everything\
    \ they need (self-contained) or relying on a pre-installed .NET runtime (framework-dependent).\n\
    \nHere’s how to create both types of deployment using the .NET CLI.\n\n[Code Example]\n\
    \n```\n# Framework-dependent deployment\ndotnet publish -c Release -r win-x64\
    \ --self-contained false\n\n# Self-contained deployment\ndotnet publish -c Release\
    \ -r win-x64 --self-contained true\n```\n\n[Execution Result]\n\nCreates a /publish\
    \ folder with either a lightweight app (framework-dependent) or a complete, standalone\
    \ app (self-contained).\n\nSelf-contained deployment means all the required .NET\
    \ runtime and libraries are included in the published files. The app can run on\
    \ a machine without .NET installed.\n\nThe downside: the output folder is larger\
    \ because it includes the runtime.\n\nFramework-dependent deployment assumes the\
    \ target machine already has the correct .NET runtime installed. The output is\
    \ smaller, but portability depends on external factors.\n\nIn both cases:\n\n\
    - -c Release: compiles in release mode (optimized).\n- -r win-x64: specifies the\
    \ runtime identifier (here for 64-bit Windows).\n- --self-contained true/false:\
    \ switches between the two deployment modes.\n\nChoose self-contained for maximum\
    \ portability (e.g., distributing apps to users). Choose framework-dependent for\
    \ controlled environments (e.g., enterprise servers).\n\n[Supplement]\n\n.NET\
    \ apps use Runtime Identifiers (RIDs) to specify the target OS/platform. Examples\
    \ include win-x64, linux-x64, and osx-arm64.\n\nTo list supported RIDs, see the\
    \ RuntimeIdentifierGraph.json in the .NET SDK folder or visit the official .NET\
    \ RID catalog.\n\n## 86. BOOSTING PERFORMANCE WITH AOT COMPILATION\n\nC# now supports\
    \ ahead-of-time (AOT) compilation to turn code into native machine instructions\
    \ before runtime, speeding up startup and reducing memory usage.\n\nLet’s use\
    \ .NET's native AOT publishing to compile a simple app into a native executable.\n\
    \n[Code Example]\n\n```\n# First, create a basic console app\ndotnet new console\
    \ -o HelloAOT\ncd HelloAOT\n\n# Then publish it using Native AOT\ndotnet publish\
    \ -c Release -r win-x64 /p:PublishAot=true\n```\n\n[Execution Result]\n\nProduces\
    \ a native .exe (or platform-specific binary) in the bin\\Release\\net8.0\\win-x64\\\
    publish directory.\n\nAOT (Ahead-of-Time) compilation transforms C# code into\
    \ platform-specific machine code at build time, rather than at runtime (like traditional\
    \ JIT compilation).\n\nBenefits:\n\n- Faster startup\n- Reduced memory footprint\n\
    \n## 87. LIVE CODE UPDATES WITH HOT RELOAD\n\nHot Reload allows you to apply code\
