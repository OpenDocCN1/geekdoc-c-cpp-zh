    \ 中，属性用于提供对类中字段的受控访问。属性可用于定义私有字段的值如何设置或获取。通过使用 getter（访问器）和 setter（修改器），属性允许你隐藏字段的实现细节，同时为外部代码提供与该字段交互的接口。\n\
