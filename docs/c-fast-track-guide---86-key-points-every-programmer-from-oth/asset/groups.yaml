    \ JSON or XML where types are not known at compile time.\n\nBut it’s dangerous:\n\
    \nIf you call a method that doesn’t exist, the program will compile successfully,\
    \ but crash at runtime with a `RuntimeBinderException`.\n\nUsing `dynamic` trades\
    \ safety for flexibility. Use it only when absolutely necessary and when you're\
