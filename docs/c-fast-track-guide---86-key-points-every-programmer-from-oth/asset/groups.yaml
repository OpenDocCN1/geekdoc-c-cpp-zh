    - `app.Run()` starts the HTTP server.\n\nMinimal APIs are great for quick prototyping\
    \ or learning HTTP routes without boilerplate. However, they are also powerful\
    \ enough to handle complex tasks, including middleware, dependency injection,\
    \ and routing.\n\nA beginner coming from another language should compare this\
    \ with how endpoints are built in frameworks like Flask (Python) or Express (JavaScript)\
    \ to see how concise and readable it is.\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_232_2.png)\n\
    \n### [Supplement]\n\n- Minimal APIs were introduced in .NET 6.\n- They reduce\
    \ startup time and memory usage.\n- Ideal for microservices or lightweight HTTP\
    \ services.\n- Can still use middleware, DI, and filters like full MVC.\n- Great\
    \ entry point for understanding HTTP methods in C#.\n\n## 80. SERVERLESS COMPUTING\
    \ WITH AZURE FUNCTIONS\n\nAzure Functions allow you to run small units of code\
    \ without managing infrastructure. You only pay for execution time.\n\nLet’s write\
    \ a simple Azure Function in C# that responds to an HTTP request.\n\n### [Code\
    \ Example]\n\n```csharp\n// Function1.cs\nusing System.Net;\nusing Microsoft.Azure.Functions.Worker;\n\
    using Microsoft.Azure.Functions.Worker.Http;\nusing Microsoft.Extensions.Logging;\n\
    public class Function1\n{\n    private readonly ILogger _logger;\n    public Function1(ILoggerFactory\
    \ loggerFactory)\n    {\n        _logger = loggerFactory.CreateLogger<Function1>();\n\
    \    }\n    [Function(\"Function1\")]\n    public HttpResponseData Run(\n    \
    \    [HttpTrigger(AuthorizationLevel.Anonymous, \"get\", \"post\")] HttpRequestData\
    \ req)\n    {\n        _logger.LogInformation(\"HTTP trigger function processed\
    \ a request.\");\n        var response = req.CreateResponse(HttpStatusCode.OK);\n\
    \        response.WriteString(\"Hello from Azure Function!\");\n        return\
    \ response;\n    }\n}\n```\n\n### [Execution Result]\n\nWhen this Azure Function\
    \ is deployed and accessed, it returns: Hello from Azure Function!\n\nAzure Functions\
    \ use the serverless model. That means:\n\n- You don’t manage any server or host.\n\
    - Your function is triggered by events (like HTTP requests, timers, queues).\n\
    - It automatically scales based on demand.\n\nThis example uses:\n\n- `[Function(\"\
    Function1\")]` to mark it as an Azure Function.\n- `[HttpTrigger(...)]` to declare\
    \ that it responds to HTTP requests.\n- `HttpRequestData` and `HttpResponseData`\
    \ to work with the request and response.\n\nWhile powerful, setting up Azure Functions\
    \ requires understanding Azure’s ecosystem and tools like Azure CLI, Visual Studio\
    \ Code, or the Azure Portal.\n\n### [Supplement]\n\n- Azure Functions support\
    \ multiple languages: C#, JavaScript, Python, Java, and more.\n- They're perfect\
    \ for short-lived tasks like data transformation, webhooks, or automation.\n-\
    \ Pay-per-use: you’re billed only while your code runs.\n- Functions can be deployed\
    \ from Visual Studio or GitHub Actions.\n- You can bind to many Azure services:\
    \ Blob storage, Cosmos DB, Event Grid, etc.\n\n## 81. SECURE API ACCESS WITH JWT\
    \ IN C#\n\nJWT (JSON Web Token) is a standard way to securely transmit information\
    \ between parties, often used for authenticating users in APIs.\n\nHere is a simple\
    \ example of how to generate and validate a JWT in C# using the `System.IdentityModel.Tokens.Jwt`\
    \ package.\n\n### [Code Example]\n\n```csharp\n// Install the following NuGet\
    \ packages first:\n// - System.IdentityModel.Tokens.Jwt\n// - Microsoft.IdentityModel.Tokens\n\
    \nusing System;\nusing System.Text;\nusing System.IdentityModel.Tokens.Jwt;\n\
    using Microsoft.IdentityModel.Tokens;\nusing System.Security.Claims;\nclass Program\n\
    {\n    static void Main()\n    {\n        // Secret key (keep this safe in real\
    \ apps!)\n        var secretKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(\"\
    SuperSecretKey12345\"));\n        // Sign credentials using HMAC SHA256\n    \
    \    var signingCredentials = new SigningCredentials(secretKey, SecurityAlgorithms.HmacSha256);\n\
    \        // Define the token content (claims)\n        var tokenDescriptor = new\
    \ JwtSecurityToken(\n            issuer: \"myApp\",\n            audience: \"\
    myUsers\",\n            claims: new[] { new Claim(ClaimTypes.Name, \"JohnDoe\"\
    ) },\n            expires: DateTime.UtcNow.AddMinutes(30),\n            signingCredentials:\
    \ signingCredentials\n        );\n\n        // Create the token\n        var tokenHandler\
    \ = new JwtSecurityTokenHandler();\n        var tokenString = tokenHandler.WriteToken(tokenDescriptor);\n\
    \        Console.WriteLine(\"Generated JWT:\");\n        Console.WriteLine(tokenString);\n\
    \n        // ===== VALIDATION =====\n        var tokenValidationParams = new TokenValidationParameters\n\
    \        {\n            ValidateIssuer = true,\n            ValidateAudience =\
    \ true,\n            ValidIssuer = \"myApp\",\n            ValidAudience = \"\
    myUsers\",\n            IssuerSigningKey = secretKey\n        };\n        try\n\
    \        {\n            var principal = tokenHandler.ValidateToken(tokenString,\
    \ tokenValidationParams, out var validatedToken);\n            Console.WriteLine(\"\
    Token is valid. User: \" + principal.Identity.Name);\n        }\n        catch\
    \ (Exception ex)\n        {\n            Console.WriteLine(\"Invalid token: \"\
    \ + ex.Message);\n        }\n    }\n}\n```\n\n### [Execution Result]\n\nGenerated\
    \ JWT:\n\n```\neyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\n```\n\nToken is valid.\
    \ User: JohnDoe\n\nJWTs contain 3 parts: Header, Payload, and Signature.\n\n-\
    \ The Header includes the signing algorithm (e.g., HS256).\n- The Payload holds\
    \ claims (user info, expiration time).\n- The Signature ensures the token hasn't\
    \ been tampered with.\n- JWTs are usually passed in HTTP headers as: `Authorization:\
    \ Bearer <token>`.\n- Validating a JWT checks its signature, expiration, and other\
    \ claims.\n- Do NOT hard-code secrets in production apps—use secure vaults or\
    \ environment variables.\n\n### [Supplement]\n\n- JWTs are stateless: no session\
    \ storage needed on server.\n- The payload is Base64-encoded, not encrypted—never\
    \ store sensitive data inside.\n- You can decode JWTs using tools like jwt.io\
    \ to inspect them manually.\n"
