    \n### 补充说明\n\n在 C# 中，属性是面向对象编程的重要组成部分，因为它们允许封装。它们阻止对字段的直接访问，同时仍然提供一种与其交互的方式。通过确保字段仅以受控方式修改，使用属性可以使代码更易维护、更安全。\n\
    \n## 8. 自动实现属性简化代码\n\n当 getter 或 setter 中不需要额外逻辑时，C# 中的自动实现属性是创建属性的一种简写方式。它通过自动为属性生成一个私有匿名的支持字段来简化代码，从而无需手动定义该字段以及\
    \ getter/setter 方法。\n\n让我们看看如何使用自动实现属性简化前面的代码：\n\n[代码示例]\n\n```csharp\nusing System;\n\
