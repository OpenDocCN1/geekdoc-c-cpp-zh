  mdcn: "\n\n## 周末\n\nswitch 表达式是一种表达式（返回一个值），而不是语句。\n\n这意味着它可以直接用于赋值，例如：\n\n```csharp\n\
    string result = input switch { ... };\n```\n\n这与传统的 switch 语句不同，后者需要 case 代码块和\
    \ break 关键字，常常使代码更长且更容易出错。\n\n另请注意：\n\n- `_` 符号表示“任何其他情况”，即默认情况。\n- 你可以在 switch\
    \ 表达式内部使用模式匹配（例如范围、类型）。\n- `or` 关键字允许将多个条件合并为一个结果。\n- 这对于数据映射、UI 逻辑或将 if-else\
    \ 链简化为单个表达式非常有用。\n\n### [补充]\n\nswitch 表达式是在 C# 8.0 中引入的。它们支持高级模式，如类型检查、关系模式（例如\
    \ <、>=）、元组模式等。它们鼓励函数式编程风格，使函数直接从表达式返回值。\n\n```csharp\n}\n}\n}\n```\n\n### 执行结果\n\
    \nWoof!\n\n在较旧的 C# 版本中，你必须这样写：\n\n```csharp\nif (pet is Dog)\n{\n    Dog d = (Dog)pet;\n\
    \    d.Bark();\n}\n```\n\n但使用 `is` 加变量声明（`is Dog d`），你可以同时进行类型检查和转换。这样可以：\n\n\
    - 更简洁：代码行数更少。\n- 更安全：不会发生意外的无效转换。\n- 作用域受限：变量 `d` 仅存在于 `if` 代码块内。\n\n这种模式称为类型模式匹配，它是在\
    \ C# 中处理多态的一种简洁、现代的方式。\n\n在支持嵌套模式和 switch 表达式的较新 C# 版本中，这种模式变得更加强大。\n\n### [补充]\n\
    \n这种模式是 C# 自 7.0 版本以来向模式匹配功能更广泛迈进的一部分。\n\n你也可以在 switch 表达式中使用类似的 `is` 表达式，将两种技术结合起来，实现优雅的基于类型的逻辑。\n\
    \n## 45. 使用 nameof 获取变量和成员的字符串名称\n\n`nameof` 运算符以字符串形式返回变量、方法或属性的名称。\n\n此示例演示了如何使用\
    \ `nameof` 获取成员的名称，而无需硬编码字符串。\n\n### 代码示例\n\n```csharp\nusing System;\nclass Person\n\
    {\n    public string FirstName { get; set; }\n    public void SayHello()\n   \
    \ {\n        Console.WriteLine(\"Hello!\");\n    }\n}\nclass Program\n{\n    static\
    \ void Main()\n    {\n        // Get the name of the property\n        string\
    \ propertyName = nameof(Person.FirstName);\n        // Get the name of the method\n\
    \        string methodName = nameof(Person.SayHello);\n        // Get the name\
    \ of a variable\n        int age = 30;\n        string variableName = nameof(age);\n\
    \        Console.WriteLine(propertyName); // Output: FirstName\n        Console.WriteLine(methodName);\
    \ // Output: SayHello\n        Console.WriteLine(variableName); // Output: age\n\
    \    }\n}\n```\n\n### 执行结果\n\nFirstName\nSayHello\nage\n\n`nameof` 运算符对于避免代码中的硬编码字符串非常有用，尤其是在处理日志记录、调试、数据绑定或实现\
    \ `INotifyPropertyChanged` 等场景时。\n\n例如，如果你重命名 `FirstName`，编译器会自动更新 `nameof(Person.FirstName)`，但不会更新硬编码字符串\
    \ `\"FirstName\"`。\n\n这可以在重构期间减少 bug，并有助于维护更干净、更安全的代码。\n\n它在编译时求值，因此不会增加任何运行时开销。\n\
    \n你可以将 `nameof` 用于：\n\n- 局部变量\n- 类成员（方法、属性、字段）\n- 参数\n- 类型（类、结构体等）\n\n### [补充]\n\
    \n- 在 C# 6.0 中引入\n- `nameof` 可用于属性、日志记录、异常等\n- 它不会计算表达式——它只是返回名称。\n- 比使用魔法字符串表示字段/属性名称更安全。\n\
    \n## 46. 使用 init 将属性赋值限制在初始化阶段\n\n`init` 属性只允许在对象初始化期间设置值，从而使对象更加不可变。\n\n此代码演示了如何使用\
    \ `init` 创建一个只能在对象首次创建时设置的属性。\n\n### 代码示例\n\n```csharp\nusing System;\n\nclass\
    \ Person\n{\n    // The 'init' accessor allows this property to be set only during\
    \ object creation\n    public string Name { get; init; }\n    // Regular property\
    \ can be changed anytime\n    public int Age { get; set; }\n}\n\nclass Program\n\
    {\n    static void Main()\n    {\n        // Initializing with object initializer\n\
    \        var person = new Person\n        {\n            Name = \"Alice\",\n \
    \           Age = 30\n        };\n        Console.WriteLine($\"{person.Name},\
    \ {person.Age}\");\n        // person.Name = \"Bob\"; // Compile-time error: 'init'\
    \ property cannot be modified after initialization\n        person.Age = 31; //\
    \ \U0001F512 Allowed\n    }\n}\n```\n\n### 执行结果\n\nAlice, 30\n\n`init` 访问器是在 C#\
    \ 9.0 中引入的，是向更不可变数据结构迈进的一部分。\n\n与 `set` 不同，`init` 只允许在对象创建时设置属性——无论是通过对象初始化器还是构造函数。\n\
    \n这使你的对象更加可预测和安全，特别适用于：\n\n- 领域驱动设计（值对象）\n- 配置对象\n- 数据传输对象（DTO）\n\n它还可以与记录完美配合，记录通常在设计上就是不可变的。\n\
    \n通过限制可变性，`init` 有助于防止初始化后对属性的意外或未经授权的更改。\n\n### [补充]\n\n- 它可以与私有 setter 结合使用：`public\
    \ string Name { get; init; }`\n- 支持对象初始化器，但禁止在构造后修改。\n- 与 C# 9 中引入的不可变记录类型配合良好。\n\
    \n尝试在构造后设置 `init` 属性会导致编译时错误，而不是运行时异常。\n\n## 47. 使用 sealed 防止继承\n\nC# 中的 `sealed`\
    \ 关键字可防止其他类继承某个类。它确保一个类不能用作基类。\n\n以下是一个基本示例，演示如何使用 `sealed` 关键字，以及当有人试图继承密封类时会发生什么。\n\
    \n### 代码示例\n\n```csharp\n// This is a sealed class. It cannot be inherited.\n\
    sealed class Animal {\n    public void Speak() {\n        Console.WriteLine(\"\
    The animal makes a sound.\");\n    }\n}\n\n// Trying to inherit from Animal will\
    \ cause a compile-time error.\n// Uncommenting the line below will produce a CS0509\
    \ error:\n// class Dog : Animal { } // ERROR: cannot derive from sealed type 'Animal'\n\
    class Program {\n    static void Main() {\n        Animal a = new Animal();\n\
    \        a.Speak(); // Works fine\n    }\n}\n```\n\n### 执行结果\n\nThe animal makes\
    \ a sound.\n\n在 C# 中，继承允许你基于现有类创建新类。然而，有时你想要阻止这种做法——可能是出于安全、性能优化或强制架构规则的需要。这就是\
    \ `sealed` 关键字的用武之地。\n\n将类声明为 `sealed` 就是告诉编译器：“此类已经完整。任何人都不能扩展它。”\n\n如果有人试图继承密封类，编译器会抛出类似如下的错误：\n\
    \n\"CS0509：'Dog'：无法从密封类型 'Animal' 派生\"\n\n你可以单独使用 `sealed`，也可以在派生类中密封方法以防止进一步重写。例如：\n\
    \n```csharp\npublic sealed override void SomeMethod() { }\n```\n\n这在框架代码中尤其常见，以防止通过继承造成的误用或意外行为。\n\
    \n### [补充]\n\n- `sealed` 常用于像 `System.String` 这样的类，该类被密封以防止破坏不可变性。\n- 如果一个类是密封的，它就不能同时是抽象的，因为抽象需要继承。\n\
    - 将类标记为密封可以让 JIT 编译器优化调用（去虚拟化），从而提高性能。\n\n## 48. 使用 unsafe 处理指针\n\nC# 通常会保护你免受低级内存访问的影响。但使用\
    \ `unsafe` 可以像 C 或 C++ 那样使用指针进行高级内存操作。\n\n以下是一个简单、安全的演示，展示如何使用 `unsafe` 代码通过指针直接操作变量的内存。\n\
    \n### 代码示例\n\n```csharp\nusing System;\n\nclass Program {\n    static void Main()\
    \ {\n        int num = 10;\n\n        // unsafe block to work with pointers\n\
    \        unsafe {\n            int* p = &num; // Get the address of num\n    \
    \        *p = 20; // Modify the value at the address\n        }\n\n        Console.WriteLine(num);\
    \ // Output will be 20\n    }\n}\n```\n\n要编译此代码，你必须启用不安全代码：\n\n在 Visual Studio\
    \ 中：项目属性 → 生成 → 允许不安全代码\n\n或者使用命令行：\n\n```text\ncsc /unsafe Program.cs\n```\n\n\
    ### 执行结果\n\n20\n\n"
