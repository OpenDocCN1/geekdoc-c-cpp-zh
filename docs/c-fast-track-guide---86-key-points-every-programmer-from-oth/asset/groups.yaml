  mdcn: "\n- 当赋值给另一个变量时，复制的是**引用**（而非实际数据）。\n- 因为变量指向同一个对象，所以对一个变量的更改会**影响**另一个变量。\n\
    - 示例：`class`、`string`、`array`、`interface`、`delegate`。\n\n### 栈与堆\n\n- **栈**：访问更快，离开作用域时自动清理内存。\n\
    - **堆**：速度较慢，但可以存储更大、更复杂的数据结构。\n\n### 常见错误\n\n- 1. **混淆结构体和类**\n  - 结构体（`struct`）是**值类型**（存储在栈中）。\n\
    \  - 类（`class`）是**引用类型**（存储在堆中）。\n  - 使用结构体处理小型不可变数据；使用类处理复杂对象。\n- 2. **无意中的引用共享**\n\
    \  - 将引用类型传递给方法时，方法内部的更改会影响原始对象。\n  - 如果明确要对值类型使用引用行为，请使用 `ref` 或 `out` 关键字。\n\
    - 3. **可空类型**\n  - 值类型默认**不能**为 null。请使用 `Nullable<T>` 或 `?`（例如 `int? myInt =\
    \ null;`）。\n  - 引用类型**可以**为 null，这可能导致潜在的 `NullReferenceException`。\n\n### [补充]\n\
    \n- C# 中的字符串是**引用类型**，但行为**类似于值类型**（不可变）。\n- 应使用 `struct` 存储**小型不可变数据**，以提高性能。\n\
    - 数组是**引用类型**，即使它们存储的是值类型。\n- 如果某个类包含值类型，该值类型**仍位于堆中**，因为它是引用类型的一部分。\n- 当值类型存储为对象时，会发生装箱和拆箱（`object\
    \ o = 10;`）。\n\n## 3. 结构体与类：值类型与引用类型\n\n在 C# 中，结构体和类的用途不同。结构体是值类型，这意味着它们直接存储在内存中，并在赋值或传递时被复制。而类是引用类型，意味着它们存储在堆中并通过引用传递。理解这一区别对于编写高效且无错误的代码至关重要。\n\
    \n下面是一个简单示例，演示结构体和类在赋值给新变量时的不同行为。\n\n[代码示例]\n\n```csharp\nusing System;\nstruct\
    \ MyStruct\n{\n    public int Value;\n}\nclass MyClass\n{\n    public int Value;\n\
    }\nclass Program\n{\n    static void Main()\n    {\n        // Struct Example\
    \ (Value Type)\n        MyStruct struct1 = new MyStruct { Value = 10 };\n    \
    \    MyStruct struct2 = struct1;\n        struct2.Value = 20;\n        Console.WriteLine($\"\
    Struct1 Value: {struct1.Value}\"); // Remains 10\n        Console.WriteLine($\"\
    Struct2 Value: {struct2.Value}\"); // Changes to 20\n        // Class Example\
    \ (Reference Type)\n        MyClass class1 = new MyClass { Value = 10 };\n   \
    \     MyClass class2 = class1;\n        class2.Value = 20;\n        Console.WriteLine($\"\
    Class1 Value: {class1.Value}\"); // Changes to 20\n        Console.WriteLine($\"\
    Class2 Value: {class2.Value}\"); // Changes to 20\n    }\n}\n```\n\n[执行结果]\n\n\
    - Struct1 的值：10\n- Struct2 的值：20\n- Class1 的值：20\n- Class2 的值：20\n\n结构体存储在栈上，这使得它们非常适合小型简单的数据类型。类存储在堆上，更加灵活，但由于垃圾回收而稍微慢一些。将结构体赋值给另一个变量时，会进行复制，因此一个变量的更改不会影响另一个变量。将类实例赋值给另一个变量时，仅复制引用，这意味着一个变量的更改会反映到另一个变量中。对于轻量级数据结构（如坐标、颜色或小型不可变对象），请使用结构体。当需要复杂行为、继承或不应频繁复制的大型对象时，请使用类。\n\
    \n- 轻量级数据结构\n- 赋值时值复制\n- 栈存储效率\n- 结构体\n- 复杂行为支持\n- 赋值时引用复制\n- 堆存储灵活性\n- 类\n\n\
    ![](img/bb6e93ece31f33afd31e933e9dd494be_27_0.png)\n\n选择结构体以追求效率；选择类以处理复杂性。\n\n\
    ### [补充]\n\n结构体不能继承自其他结构体或类，但可以实现接口。类支持多态和继承，而结构体不支持。结构体不允许定义默认构造函数（它们始终具有隐式的无参数构造函数）。\n\
    \n## 4. 理解枚举：强类型常量\n\nC# 中的枚举提供了一种定义一组命名常量值的方式，这些常量值具有强类型，并映射到基础整数类型（默认：int）。这使代码更易读，并防止使用无效值。\n\
    \n下面是一个定义并使用枚举来表示系统中不同用户角色的示例。\n\n```csharp\nusing System;\n\nenum UserRole\n\
    {\n    Admin = 1,\n    Moderator = 2,\n    User = 3\n}\n\nclass Program\n{\n \
    \   static void Main()\n    {\n        UserRole role = UserRole.Moderator;\n \
    \       Console.WriteLine($\"Role: {role}\"); // Output: Moderator\n        Console.WriteLine($\"\
    Role Value: {(int)role}\"); // Output: 2\n\n        // Checking an enum value\n\
    \        if (role == UserRole.Admin)\n        {\n            Console.WriteLine(\"\
    You have admin privileges.\");\n        }\n        else\n        {\n         \
    \   Console.WriteLine(\"You do not have admin privileges.\");\n        }\n   \
    \ }\n}\n```\n\n[执行结果]\n\n```\nRole: Moderator\nRole Value: 2\nYou do not have\
    \ admin privileges.\n```\n\n默认情况下，枚举从 0 开始，但你可以显式指定值。枚举通过用有意义的名称替换魔法数字来提高代码可读性。你可以将枚举与整数互相转换，从而与外部数据源（如数据库）保持兼容。当标记了\
    \ `[Flags]` 时，枚举可以通过位运算进行组合（对权限系统很有用）。始终显式定义默认值，以防止出现非预期值。\n\n### 在 C# 中使用枚举\n\
    \n| 优点 | 缺点 |\n|---|---|\n| 改进的可读性 | 需要显式默认值 |\n| 显式值赋值 |  |\n| 与外部数据的兼容性 |  |\n\
    | 位运算 |  |\n\n### [补充]\n\n枚举的默认基础类型是 int，但可以改为其他整数类型（byte、short、long 等）。`Enum.Parse()`\
    \ 可用于将字符串转换为枚举值。枚举不能包含方法，但可以使用扩展方法为它们添加行为。\n\n## 5. C# 中的字符串是不可变的\n\n在 C# 中，字符串是不可变的，这意味着对字符串的任何修改实际上都会在内存中创建新的字符串实例，而不是改变现有实例。\n\
    \n如果你更改一个字符串，就会发生新的内存分配，旧值保持不变。下面是一个简单示例：\n\n[代码示例]\n\n```csharp\nusing System;\n\
    class Program\n{\n    static void Main()\n    {\n        string original = \"\
    Hello\";\n        string modified = original + \" World\"; // This creates a new\
    \ string instance\n        Console.WriteLine(\"Original: \" + original); // \"\
    Hello\"\n        Console.WriteLine(\"Modified: \" + modified); // \"Hello World\"\
    \n    }\n}\n```\n\n[执行结果]\n\n```\nOriginal: Hello\nModified: Hello World\n```\n\
    \n### 为什么字符串是不可变的？\n\n- **内存效率：** 不可变字符串可以在程序的多个部分安全共享。\n- **线程安全：** 由于字符串在创建后无法更改，因此多线程应用中不存在意外修改的风险。\n\
    \n### C# 字符串不可变性与性能\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_33_0.png)\n\n\
    ### [补充]\n\n- C# 中的字符串是**引用类型**，但由于不可变性，它们的行为类似于**值类型**。\n- `string` 是 `System.String`\
    \ 的别名。\n- 对于字符串，`==` 运算符检查的是**值相等**，而不是引用相等。\n- 字符串不可变性在其他语言（如 Java 和 Python）中也是类似的。\n\
    - 建议使用 `string.Empty` 而不是 `\"\"`，因为它可以避免不必要的分配。\n\n## 6. 使用 StringBuilder 高效处理字符串\n\
    \n`StringBuilder` 是 `string` 的可变替代品，允许高效地进行字符串拼接和修改，而无需创建多个新实例。\n\n在循环或频繁修改中，不要使用\
    \ `+=` 或 `string.Concat`，而应使用 `StringBuilder` 来提高性能。\n\n[代码示例]\n\n```csharp\n\
    using System;\nusing System.Text;\nclass Program\n{\n    static void Main()\n\
    \    {\n        StringBuilder sb = new StringBuilder(\"Hello\");\n        sb.Append(\"\
    \ World\"); // Modifies the existing instance instead of creating a new one\n\
    \        Console.WriteLine(sb.ToString()); // \"Hello World\"\n    }\n}\n```\n\
    \n[执行结果]\n\n```\nHello World\n```\n\n### 为什么使用 `StringBuilder`？\n\n- **避免过多的内存分配：**\
    \ `StringBuilder` 修改现有缓冲区，而不是每次创建新字符串。\n- **提高性能：** 在多次字符串拼接的循环中尤其有用。\n\n"
