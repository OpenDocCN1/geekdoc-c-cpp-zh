    - `Attribute.IsDefined(...)` checks if the attribute is present.\n- `Attribute.GetCustomAttribute(...)`\
    \ retrieves the actual instance, so you can read the `Message` property.\n\n###\
    \ Why use attributes?\n\n- They add structured, retrievable metadata.\n- Common\
