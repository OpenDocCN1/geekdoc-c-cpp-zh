    # 5. STRINGS IN C# ARE IMMUTABLE


    In C#, strings are immutable, meaning any modification to a string actually creates
    a new string instance in memory instead of altering the existing one.


    If you change a string, a new memory allocation occurs, and the old value remains
    unchanged. Here’s a simple example:


    [Code Example]


    ```

    using System;

    class Program

    {

    static void Main()

    {

    string original = "Hello";

    string modified = original + " World"; // This creates a new string instance

    Console.WriteLine("Original: " + original); // "Hello"

    Console.WriteLine("Modified: " + modified); // "Hello World"

    }

    }

    ```


    [Execution Result]


    Original: Hello

    Modified: Hello World


    # ### Why Are Strings Immutable?


    +   - **Memory Efficiency:** Immutable strings can be safely shared across multiple
    parts of a program.

    +   - **Thread Safety:** Since strings can''t change after creation, there''s
    no risk of unexpected modifications in multi-threaded applications.'
