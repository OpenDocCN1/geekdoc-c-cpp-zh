    \ means a method taking one string and returning void\n        Action<string>\
    \ printMessage = message => Console.WriteLine($\"Message: {message}\");\n\n  \
    \      int result = add(10, 20); // Calling the Func delegate\n        printMessage($\"\
    The result is {result}\"); // Using the Action delegate\n    }\n}\n```\n\n###\
    \ [Execution Result]\n\nMessage: The result is 30\n\n`Func<T1, T2, TResult>` is\
    \ a generic delegate that takes parameters `T1`, `T2`, and returns a value of\
    \ type `TResult`.\n"
