    \ (e.g., unreachable code)\n- Code style preferences (like spacing, parentheses,\
    \ or curly braces)\n- Performance suggestions\n\nFor beginners, it’s important\
    \ to pay attention to IDE warnings—these are often generated by Roslyn analyzers\
    \ and help you learn cleaner, safer C# coding habits.\n\nYou can also install\
    \ custom analyzers or create your own using the Roslyn SDK to enforce your team’s\
    \ rules.\n\n### Supplement\n\nRoslyn analyzers work during both design time (in\
    \ the editor) and compile time. They're part of what makes modern C# development\
    \ environments so intelligent. Popular tools like StyleCop Analyzers, SonarAnalyzer.CSharp,\
    \ and Microsoft.CodeAnalysis.FxCopAnalyzers are all built on Roslyn.\n\n## 84.\
