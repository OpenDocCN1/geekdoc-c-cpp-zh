    An interface in C# is like a blueprint. It tells what methods or properties a
    class must implement but not how they should do it.


    In the example:


    IAnimal is the interface.


    It requires any implementing class to define a Speak() method.


    Dog implements IAnimal, and provides a concrete version of Speak().


    Why is this powerful?


    You can treat many different classes (like Dog, Cat, Bird) as IAnimal and call
    Speak() on all of them—even though they implement it differently.


    This is called polymorphism, and it allows flexible, extensible, and testable
    code.


    Key Points:


    +   - Interfaces promote clean design and separation of concerns.

    +   - Interfaces do not contain logic.

    +   - A class can implement multiple interfaces but only inherit from one class.


    From C# 8.0, interfaces can also contain default implementations (similar to Java),
    but in most beginner-friendly designs, you’ll focus on basic method declarations.'
