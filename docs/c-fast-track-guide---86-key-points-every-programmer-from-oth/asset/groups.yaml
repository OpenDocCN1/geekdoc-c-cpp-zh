    \ `GC.Collect()` 手动触发垃圾回收，但在非常特定和高级的场景下除外，这样做是不推荐的。\n\n此示例展示了如何手动触发垃圾回收以及强制执行时会发生什么——以及为什么通常是不好的做法。\n\
    \n### [代码示例]\n\n```csharp\nusing System;\n\nclass Test\n{\n    ~Test()\n    {\n\
