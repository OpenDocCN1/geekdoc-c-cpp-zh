    \ under 'unusedVariable', and a warning like:\nIDE0059: Unnecessary assignment\
    \ of a value to 'unusedVariable'\n\nRoslyn is the .NET Compiler Platform, which\
    \ not only compiles code but also exposes powerful APIs to analyze and refactor\
    \ code. Visual Studio uses Roslyn analyzers internally to give developers real-time\
    \ feedback on coding issues.\n\nThese analyzers detect things like:\n\n- Unused\
