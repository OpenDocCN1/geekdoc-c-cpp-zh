    \ same namespace, and they must all use the partial keyword.\n\nWhen compiled,\
    \ the compiler merges all partial class parts into a single class. It's important\
    \ to avoid naming conflicts (e.g., two methods with the same name) across the\
    \ partial definitions.\n\nAlso, partial classes can be used with structs and interfaces,\
