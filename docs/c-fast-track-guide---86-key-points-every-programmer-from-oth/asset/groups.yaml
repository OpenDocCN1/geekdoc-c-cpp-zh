    \n## 60. Using Lambda Expressions for Short Function Definitions\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_175_3.png)\n\
    \nLambda expressions allow you to write functions in a short and expressive way.\n\
    \nThey are especially useful in LINQ, event handling, or anywhere a quick function\
    \ is needed inline.\n\n### [Code Example]\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\n\nclass Program\n{\n    static void Main()\n    {\n      \
    \  List<int> numbers = new List<int> { 1, 2, 3, 4, 5 };\n\n        // Lambda expression\
    \ to filter even numbers\n        var evens = numbers.Where(n => n % 2 == 0);\n\
    \n        foreach (var n in evens)\n        {\n            Console.WriteLine(n);\n\
    \        }\n    }\n}\n```\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_176_0.png)\n\
    \n### [Execution Result]\n\n2\n\n4\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_176_1.png)\n\
    \nThe line `numbers.Where(n => n % 2 == 0)` uses a lambda expression. Here's how\
    \ to understand it:\n\n`n => n % 2 == 0` means:\n\n- `n` is the input parameter\
    \ (each element of the list).\n- `=>` separates the parameter from the body of\
    \ the expression.\n- `n % 2 == 0` is the condition being tested — only even numbers\
    \ pass.\n\nLambdas can be:\n\n- Single-expression: `x => x * x`\n- Block-style:\
    \ `x => { return x * x; }`\n\nThey're especially powerful when used with LINQ,\
    \ event handlers, and anonymous methods.\n\nYou can assign them to delegates or\
    \ use them inline. Their syntax can be tricky at first, but they drastically simplify\
    \ your code once you get used to them.\n\n![](img/bb6e93ece31f33afd31e933e9dd494be_177_0.png)\n\
    \n### [Supplement]\n\nC# lambdas are converted to delegates behind the scenes.\
    \ They can close over variables in their surrounding scope — this is called a\
    \ closure. This means the lambda \"remembers\" variables from where it was defined,\
    \ which is very useful in functional-style programming.\n\n## 61. Defining Helper\
    \ Methods Inside Methods (Local Functions)\n\nLocal functions in C# are methods\
    \ declared inside another method. They're useful for isolating helper logic that\
    \ doesn't need to be exposed outside the containing method.\n\nHere’s a simple\
    \ example showing how a local function is defined and used inside another method.\n\
    \n### [Code Example]\n\n```csharp\nusing System;\n\nclass Program\n{\n    static\
    \ void Main()\n    {\n        int number = 5;\n\n        // Call the method that\
    \ uses a local function\n        int result = CalculateFactorial(number);\n  \
    \      Console.WriteLine($\"Factorial of {number} is {result}\");\n    }\n\n \
    \   static int CalculateFactorial(int n)\n    {\n        // Local function defined\
    \ inside the method\n\n        int Factorial(int x)\n        {\n            if\
    \ (x <= 1) return 1;\n            return x * Factorial(x - 1); // Recursive call\n\
    \        }\n\n        return Factorial(n); // Calling the local function\n   \
    \ }\n}\n```\n\n### [Execution Result]\n\nFactorial of 5 is 120\n\nIn this example,\
    \ Factorial is a local function defined inside the CalculateFactorial method.\n\
    \nIt cannot be accessed from outside CalculateFactorial, which helps keep the\
    \ code clean and encapsulated.\n\n### Why use local functions?\n\n- Encapsulation:\
    \ Keeps helper logic close to where it's used.\n- Readability: Prevents polluting\
    \ the class with methods used only in one place.\n- Access to variables: Local\
    \ functions have access to the outer method's variables (n in this case).\n\n\
    Note: You can also define local functions as static inside static methods if they\
    \ don’t need outer scope access.\n\n### [Supplement]\n\nLocal functions were introduced\
    \ in C# 7.0.\n\nYou can nest multiple levels of local functions if needed (though\
    \ it’s rare and can reduce readability).\n\nThey are different from lambda expressions\
    \ and anonymous methods, which are inline delegates rather than named functions.\n\
    \n## 62. Using Func<> and Action<> for Functional Programming\n\n`Func<>` and\
    \ `Action<>` are built-in generic delegates in C#. They let you store methods\
    \ in variables, pass them as parameters, and build flexible, reusable code using\
    \ functional programming techniques.\n\nThis example shows how to use `Func<>`\
    \ and `Action<>` to assign and use methods as first-class citizens.\n\n### [Code\
    \ Example]\n\n```csharp\nusing System;\n\nclass Program\n{\n    static void Main()\n\
