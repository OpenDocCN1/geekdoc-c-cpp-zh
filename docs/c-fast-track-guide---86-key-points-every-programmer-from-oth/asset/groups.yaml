    \ new web` 创建一个基础 Web 应用程序。\n\n## 76. 使用 Identity 进行身份验证和授权\n\nASP.NET Core 中的\
    \ Identity 框架处理用户登录、注册、角色管理和访问控制。\n\n这是一个基本设置，展示如何使用 .NET CLI 在 Razor Pages 项目中脚手架\
    \ Identity。\n\n### [代码示例]\n\n```bash\n# Create a new ASP.NET Core Razor Pages\
    \ project\ndotnet new webapp -o IdentityDemo\ncd IdentityDemo\n\n# Add Identity\
    \ UI scaffolding\ndotnet add package Microsoft.AspNetCore.Identity.UI\n\n# Enable\
    \ Identity in Program.cs (automatically configured with template)\n# Run the app\n\
    dotnet run\n```\n\n之后，访问 /Identity/Account/Register 注册新用户。\n\n访问 /Identity/Account/Login\
    \ 登录。\n\n### [执行结果]\n\n一个可工作的 Web 应用程序，包含：\n\n- 注册\n- 登录\n- 注销\n- 账户管理页面\n- 全部由\
    \ ASP.NET Core Identity 提供支持。\n\nASP.NET Core Identity 是一个成员系统，添加了：\n\n- 用户存储（通过\
    \ EF Core 和 SQL Server 等数据库）\n- 密码哈希和安全机制\n- 基于角色的授权\n\nIdentity 使用 cookie 进行会话管理，并支持：\n\
    \n- 2FA（双因素身份验证）\n- 外部登录（Google、Facebook 等）\n- 电子邮件确认\n- 登录失败时锁定账户\n\n默认的 Identity\
    \ 页面可以完全自定义。Scaffold-Identity 工具（在 Visual Studio 或 CLI 中）允许你生成可随后修改的 Razor Pages。\n\
    \nProgram.cs 通常包含：\n\n```csharp\nbuilder.Services.AddDefaultIdentity<IdentityUser>(options\
