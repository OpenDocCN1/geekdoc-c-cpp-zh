    # # 20. PREVENTING RACE CONDITIONS WITH LOCK IN C#


    The lock keyword in C# is used to ensure that only one thread accesses a block
    of code at a time, preventing race conditions.


    Below is an example that safely increments a counter from multiple threads using
    a lock.


    [Code Example]


    ```

    ```csharp

    using System;

    using System.Threading;

    class Program

    {

    static int counter = 0; // Shared data

    static object locker = new object(); // Lock object

    static void Main()

    {

    Thread[] threads = new Thread[10];

    // Create and start 10 threads

    for (int i = 0; i < 10; i++)

    {

    threads[i] = new Thread(IncrementCounter);

    threads[i].Start();

    }

    // Wait for all threads to finish

    foreach (var thread in threads)

    {

    thread.Join();

    }

    Console.WriteLine("Final counter value: " + counter);

    }

    ```

