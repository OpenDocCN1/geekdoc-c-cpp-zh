    # 39. AVOIDING NULL ERRORS WITH NULLABLE REFERENCE TYPES


    C#''s nullable reference types help prevent null-related runtime errors by letting
    you explicitly declare whether a reference can be null or not.


    Here’s a simple example demonstrating how enabling nullable reference types can
    help you catch potential null issues at compile time.


    [Code Example]


    ```

    #nullable enable // Enables nullable reference types

    class Person

    {

    public string Name { get; set; } // Warning: May be null if not initialized

    }

    class Program

    {

    static void Main()

    {

    Person person = new Person();

    Console.WriteLine(person.Name.Length); // Possible NullReferenceException warning

    }

    }

    ```


    [Execution Result]


    Warning: Dereference of a possibly null reference.


    In C# 8.0 and later, the #nullable enable directive tells the compiler to treat
    reference types (string, object, etc.) as non-nullable by default.'
