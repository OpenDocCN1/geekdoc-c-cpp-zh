    \ 字段可以使用仅在运行时才知道的值，例如系统时间或用户输入。\n\n这就是为什么 DateTime.Now 可用于 readonly，但不能用于 const。\n\
    \nconst 隐式是 static 的，这意味着它在类的所有实例之间共享。readonly 则是每个实例独立的，除非显式标记为 static。\n\n尝试为\
    \ const 字段赋予运行时值会导致编译时错误：\n\n> “分配给 'const' 的表达式必须是常量”\n\n### 补充说明\n"
