    \ GetDataAsync()\n    {\n        using HttpClient client = new HttpClient();\n\
    \        // Await a non-blocking network call\n        string result = await client.GetStringAsync(\"\
    https://example.com\");\n        return result;\n    }\n}\n```\n\n[Execution Result]\n\
    \nStarting async operation...\n\nData received:\n\n```\n<!doctype html><html>...<body>Example\
    \ Domain...</body></html>\n```\n\nasync marks a method as asynchronous.\n\nawait\
    \ pauses execution until the awaited task finishes——without blocking the thread.\n\
    \nHttpClient.GetStringAsync() is non-blocking and returns a Task<string>.\n\n\
    This pattern allows you to keep the application responsive (e.g., UI stays smooth\
    \ or backend doesn't freeze).\n\nYou must return Task or Task<T> from async methods\
    \ (except for event handlers that return void).\n\nMain() in modern C# can now\
    \ be async Task Main() (as shown above).\n\n### [Supplement]\n\nTAP replaced older\
    \ models like APM (Asynchronous Programming Model) and EAP (Event-based Asynchronous\
    \ Pattern).\n\nYou can chain multiple async calls, and error handling with try-catch\
    \ works naturally with await.\n\nYou should avoid .Result or .Wait() on Tasks\
    \ unless absolutely necessary, as they may cause deadlocks.\n\n## 20. PREVENTING\
    \ RACE CONDITIONS WITH LOCK IN C#\n\nThe lock keyword in C# is used to ensure\
    \ that only one thread accesses a block of code at a time, preventing race conditions.\n\
    \nBelow is an example that safely increments a counter from multiple threads using\
    \ a lock.\n\n[Code Example]\n\n```csharp\nusing System;\nusing System.Threading;\n\
    class Program\n{\nstatic int counter = 0; // Shared data\nstatic object locker\
    \ = new object(); // Lock object\nstatic void Main()\n{\nThread[] threads = new\
    \ Thread[10];\n// Create and start 10 threads\nfor (int i = 0; i < 10; i++)\n\
    {\nthreads[i] = new Thread(IncrementCounter);\nthreads[i].Start();\n}\n// Wait\
    \ for all threads to finish\nforeach (var thread in threads)\n{\nthread.Join();\n\
    }\nConsole.WriteLine(\"Final counter value: \" + counter);\n}\nstatic void IncrementCounter()\n\
    {\n    for (int i = 0; i < 1000; i++)\n    {\n        lock (locker)\n        {\n\
    \            // Only one thread can access this at a time\n            counter++;\n\
    \        }\n    }\n}\n}\n```\n\n[Execution Result]\n\nFinal counter value: 10000\n\
    \nWithout lock, multiple threads could read and write counter at the same time,\
    \ leading to incorrect results (race condition).\n\nlock (locker) ensures that\
    \ only one thread can execute the code inside at any moment.\n\nlocker must be\
    \ a private, non-null reference type object. It should not be a value type or\
    \ a publicly accessible object.\n\nJoin() is used to wait for threads to finish\
    \ before printing the result.\n\n### [Supplement]\n\nlock is syntactic sugar for\
    \ Monitor.Enter() and Monitor.Exit().\n"
  mdcn: "\n\n## 16. 委托：像变量一样传递函数\n\nC# 中的委托是指向方法的类型安全指针。它们允许你将方法作为参数传递，或将方法存储在变量中。\n\
    \n下面是一个基本示例，说明如何定义委托、将其关联到方法并调用它。\n\n[代码示例]\n\n```\nusing System;\n\nclass Program\n\
    {\n    // Define a delegate type that takes two integers and returns an integer\n\
    \    delegate int Operation(int x, int y);\n\n    // Method to add two numbers\n\
    \    static int Add(int a, int b)\n    {\n        return a + b;\n    }\n\n   \
    \ static void Main()\n    {\n        // Create a delegate instance and point it\
    \ to the Add method\n        Operation op = Add;\n\n        // Call the method\
    \ via the delegate\n        int result = op(5, 3);\n        Console.WriteLine(result);\
    \ // Output: 8\n    }\n}\n```\n\n[执行结果]\n\ndelegate int Operation(int x, int y);\
    \ 声明一个委托类型，该类型期望一个具有两个 int 参数并返回 int 的方法。\n\nOperation op = Add; 将委托绑定到 Add 方法。\n\
    \nop(5, 3) 通过委托间接调用 Add(5, 3)。\n\n这在功能上类似于 C++ 中的函数指针，但具有类型安全性且更安全。\n\n实际用例包括：\n\
    \n- 将逻辑传入方法（例如用于排序的比较规则）。\n- 实现事件系统（委托是 C# 事件的核心）。\n- 在运行时动态接入不同的行为。\n\n### [补充]\n\
    \n委托是 C# 中事件的基础。\n\nAction<>、Func<> 和 Predicate<> 是内置泛型委托，可简化委托的使用。\n\n匿名方法和 lambda\
    \ 表达式也可以分配给委托。\n\n委托支持解耦——你的代码变得更灵活、更易于测试。\n\n## 17. 使用委托和事件实现观察者模式\n\n在 C# 中，事件使用委托实现观察者模式，该模式允许对象在发生某事时通知多个订阅者。\n\
    \n下面是一个基本示例，说明事件和委托如何工作以通知多个监听器有关更改。\n\n[代码示例]\n\n```csharp\nusing System;\n\n\
    // Define a delegate type\npublic delegate void NotificationHandler(string message);\n\
    \n// Publisher class\nclass Publisher\n{\n    // Declare an event using the delegate\n\
    \    public event NotificationHandler OnNotify;\n    public void DoSomething()\n\
    \    {\n        Console.WriteLine(\"Publisher is doing something important...\"\
    );\n        // Notify all subscribers\n        OnNotify?.Invoke(\"Something happened\
    \ in Publisher!\");\n    }\n}\n\n// Subscriber class\nclass Subscriber\n{\n  \
    \  private string _name;\n    public Subscriber(string name)\n    {\n        _name\
    \ = name;\n    }\n    // Method that matches the delegate signature\n    public\
    \ void Respond(string message)\n    {\n        Console.WriteLine($\"{_name} received:\
    \ {message}\");\n    }\n}\n\n// Main execution\nclass Program\n{\n    static void\
    \ Main()\n    {\n        Publisher pub = new Publisher();\n        Subscriber\
    \ sub1 = new Subscriber(\"Alice\");\n        Subscriber sub2 = new Subscriber(\"\
    Bob\");\n        // Subscribe to the event\n        pub.OnNotify += sub1.Respond;\n\
    \        pub.OnNotify += sub2.Respond;\n        // Trigger the event\n       \
    \ pub.DoSomething();\n    }\n}\n```\n\n[执行结果]\n\nPublisher is doing something\
    \ important...\nAlice received: Something happened in Publisher!\nBob received:\
    \ Something happened in Publisher!\n\n## 18. 使用 async 和 await 实现非阻塞代码\n\nC# 支持使用\
    \ async 和 await 进行异步编程，以避免阻塞主线程，尤其是在 Web 请求或文件访问等 I/O 操作期间。\n\n下面是一个简单示例，模拟异步等待任务完成而不会冻结应用。\n\
    \n[代码示例]\n\n```\nusing System;\nusing System.Threading.Tasks;\nclass Program\n\
    {\nstatic async Task Main()\n{\nConsole.WriteLine(\"Starting...\");\n// Call an\
    \ async method and await its completion\nstring result = await DoWorkAsync();\n\
    Console.WriteLine($\"Result: {result}\");\nConsole.WriteLine(\"Done.\");\n}\n\
    // Asynchronous method\nstatic async Task<string> DoWorkAsync()\n{\nConsole.WriteLine(\"\
    Working...\");\n// Simulate delay (e.g., downloading, processing)\nawait Task.Delay(2000);\
    \ // 2 seconds\nreturn \"Work complete!\";\n}\n}\n```\n\n[执行结果]\n\nStarting...\n\
    Working...\n（2 秒后出现结果）\nResult: Work complete!\nDone.\n\n使用 async 和 await 时，代码看起来是同步的，但在底层异步运行：\n\
    \n- 方法前面的 async 告诉编译器此方法可能会异步运行。\n- await 会暂停执行，直到等待的任务完成，但不会阻塞主线程。\n- Task.Delay()\
    \ 类似于 Thread.Sleep()，但不会阻塞——它在等待时将控制权交还给运行时。\n- 这在 UI 应用或服务器中尤其有用，因为阻塞主线程会导致应用冻结或造成延迟。\n\
    - 关键优势：可读且易于维护的异步代码。\n\n### [补充]\n\nasync 方法必须返回 Task、Task<T> 或 void（仅限事件处理程序）。\n\
    \n## 19. 在 C# 中使用任务进行异步编程\n\nTAP（基于任务的异步模式）是在 C# 中编写异步代码的标准方式。它使用 async 和 await\
    \ 简化并发。\n\n下面是一个简单示例，它异步获取数据，并使用 Task 和 await 等待结果。\n\n[代码示例]\n\n```csharp\nusing\
    \ System;\nusing System.Net.Http;\nusing System.Threading.Tasks;\nclass Program\n\
    {\n    // Main method must return Task if marked async\n    static async Task\
    \ Main()\n    {\n        Console.WriteLine(\"Starting async operation...\");\n\
    \        // Call an asynchronous method\n        string data = await GetDataAsync();\n\
    \        Console.WriteLine(\"Data received:\");\n        Console.WriteLine(data);\n\
    \    }\n    // Async method that returns a Task<string>\n    static async Task<string>\
    \ GetDataAsync()\n    {\n        using HttpClient client = new HttpClient();\n\
    \        // Await a non-blocking network call\n        string result = await client.GetStringAsync(\"\
    https://example.com\");\n        return result;\n    }\n}\n```\n\n[执行结果]\n\nStarting\
    \ async operation...\n\nData received:\n\n```\n<!doctype html><html>...<body>Example\
    \ Domain...</body></html>\n```\n\nasync 将方法标记为异步。\n\nawait 会暂停执行，直到等待的任务完成——而不会阻塞线程。\n\
    \nHttpClient.GetStringAsync() 是非阻塞的，并返回一个 Task<string>。\n\n此模式可让你保持应用响应性（例如，UI\
    \ 保持流畅，或后端不会冻结）。\n\nasync 方法必须返回 Task 或 Task<T>（返回 void 的事件处理程序除外）。\n\n现代 C# 中的\
    \ Main() 现在可以是 async Task Main()（如上所示）。\n\n### [补充]\n\nTAP 取代了 APM（异步编程模型）和 EAP（基于事件的异步模式）等较旧模型。\n\
    \n你可以串联多个 async 调用，并且使用 try-catch 进行错误处理可与 await 自然配合。\n\n应避免在 Task 上使用 .Result\
    \ 或 .Wait()，除非绝对必要，因为它们可能导致死锁。\n\n## 20. 在 C# 中使用 lock 防止竞态条件\n\nC# 中的 lock 关键字用于确保一次只有一个线程访问某个代码块，从而防止竞态条件。\n\
    \n下面是一个示例，它使用 lock 从多个线程安全地递增计数器。\n\n[代码示例]\n\n```csharp\nusing System;\nusing\
    \ System.Threading;\nclass Program\n{\nstatic int counter = 0; // Shared data\n\
    static object locker = new object(); // Lock object\nstatic void Main()\n{\nThread[]\
    \ threads = new Thread[10];\n// Create and start 10 threads\nfor (int i = 0; i\
    \ < 10; i++)\n{\nthreads[i] = new Thread(IncrementCounter);\nthreads[i].Start();\n\
    }\n// Wait for all threads to finish\nforeach (var thread in threads)\n{\nthread.Join();\n\
    }\nConsole.WriteLine(\"Final counter value: \" + counter);\n}\nstatic void IncrementCounter()\n\
    {\n    for (int i = 0; i < 1000; i++)\n    {\n        lock (locker)\n        {\n\
    \            // Only one thread can access this at a time\n            counter++;\n\
    \        }\n    }\n}\n}\n```\n\n[执行结果]\n\nFinal counter value: 10000\n\n如果不使用\
    \ lock，多个线程可能同时读取和写入 counter，导致结果不正确（竞态条件）。\n\nlock (locker) 确保任意时刻只有一个线程可以执行其中的代码。\n\
    \nlocker 必须是私有的、非空引用类型对象。它不应是值类型或可公开访问的对象。\n\nJoin() 用于在打印结果之前等待线程完成。\n\n### [补充]\n\
    \nlock 是 Monitor.Enter() 和 Monitor.Exit() 的语法糖。\n\n"
