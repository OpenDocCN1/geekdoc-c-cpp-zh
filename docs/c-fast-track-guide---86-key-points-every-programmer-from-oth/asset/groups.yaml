    \ C# 编译器会自动处理幕后实现。\n\n当你不需要向 getter 或 setter 添加额外逻辑时，自动实现属性非常有用，可使代码更简单、更简洁。它们是减少样板代码并提高可读性的好方法，尤其适用于简单类。\n\
    \n### 补充说明\n\n自动实现属性是在 C# 3.0 中引入的，它使得无需手动定义私有字段即可更轻松地创建简单属性。但是，如果你需要在 getter\
    \ 或 setter 中添加验证、日志记录或其他逻辑，则需要手动定义属性（如第一个示例所示）。你还可以向自动实现属性添加访问修饰符（例如 private set），以便更好地控制谁可以修改该属性。\n\
    \n## 9. readonly 字段必须在构造函数中设置\n\n在 C# 中，readonly 字段只能在声明时或类的构造函数内赋值。\n\n以下代码展示了如何在构造函数中设置\
