  - '[PAGE 34]


    # 6. USE STRINGBUILDER FOR EFFICIENT STRING MANIPULATION


    `StringBuilder` is a mutable alternative to `string`, allowing efficient string
    concatenation and modification without creating multiple new instances.


    Instead of using `+=` or `string.Concat`, use `StringBuilder` for performance
    improvements in loops or frequent modifications.


    [Code Example]


    ```

    using System;

    using System.Text;

    class Program

    {

    static void Main()

    {

    StringBuilder sb = new StringBuilder("Hello");

    sb.Append(" World"); // Modifies the existing instance instead of creating a new
    one

    Console.WriteLine(sb.ToString()); // "Hello World"

    }

    }

    ```


    [Execution Result]


    Hello World


    # ### Why Use `StringBuilder`?


    +   - **Avoids Excessive Memory Allocation:** Instead of creating a new string
    every time, `StringBuilder` modifies the existing buffer.

    +   - **Improves Performance:** Particularly useful in loops where multiple string
    concatenations occur.'
