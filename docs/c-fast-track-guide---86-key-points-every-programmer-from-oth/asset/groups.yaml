    - 内置了诸如加盐密码哈希等安全实践。\n\n## 77. 使用 Razor Pages 简化 Web 开发\n\nRazor Pages 是 ASP.NET\
    \ Core 中的一个以页面为中心的框架，通过将控制器和视图逻辑合并到单个 .cshtml 文件中，使 Web 应用程序开发变得更容易。\n\n下面是一个基本的\
    \ Razor Page 示例，用于处理简单的表单提交。\n\n### [代码示例]\n\n```\n// Pages/Hello.cshtml\n@page\n\
    @model HelloModel\n<h2>Hello Razor Page</h2>\n<form method=\"post\">\n<input type=\"\
    text\" name=\"UserName\" />\n<button type=\"submit\">Submit</button>\n</form>\n\
    @if (!string.IsNullOrEmpty(Model.Message))\n{\n<p>@Model.Message</p>\n}\n\n//\
    \ Pages/Hello.cshtml.cs\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.AspNetCore.Mvc.RazorPages;\n\
    public class HelloModel : PageModel\n{\n[BindProperty]\npublic string UserName\
    \ { get; set; }\npublic string Message { get; set; }\npublic void OnPost()\n{\n\
    \  Message = $\"Hello, {UserName}!\";\n}\n}\n```\n\n### [执行结果]\n\n当用户在输入框中提交姓名并点击\
    \ \"Submit\" 时，页面刷新并显示：\n\nHello, [UserName]!\n\nRazor Pages 是 ASP.NET Core 的一部分，适用于每个页面包含自身逻辑的场景，尤其适用于基于表单的页面。\n\
