  - "[PAGE 178]\n\n# 61. DEFINING HELPER METHODS INSIDE METHODS (LOCAL FUNCTIONS)\n\
    \nLocal functions in C# are methods declared inside another method. They're useful\
    \ for isolating helper logic that doesn't need to be exposed outside the containing\
    \ method.\n\nHere’s a simple example showing how a local function is defined and\
    \ used inside another method.\n\n[Code Example]\n\n```\nusing System;\n\nclass\
    \ Program\n{\n    static void Main()\n    {\n        int number = 5;\n\n     \
    \   // Call the method that uses a local function\n        int result = CalculateFactorial(number);\n\
    \        Console.WriteLine($\"Factorial of {number} is {result}\");\n    }\n\n\
    \    static int CalculateFactorial(int n)\n    {\n        // Local function defined\
    \ inside the method\n\n        int Factorial(int x)\n        {\n            if\
    \ (x <= 1) return 1;\n            return x * Factorial(x - 1); // Recursive call\n\
    \        }\n\n        return Factorial(n); // Calling the local function\n   \
    \ }\n}\n```"
  - '[PAGE 179]


    }


    # [Execution Result]


    Factorial of 5 is 120


    In this example, Factorial is a local function defined inside the CalculateFactorial
    method.


    It cannot be accessed from outside CalculateFactorial, which helps keep the code
    clean and encapsulated.


    # Why use local functions?


    +   - Encapsulation: Keeps helper logic close to where it''s used.

    +   - Readability: Prevents polluting the class with methods used only in one
    place.


    Access to variables: Local functions have access to the outer method''s variables
    (n in this case).


    Note: You can also define local functions as static inside static methods if they
    don’t need outer scope access.


    # [Supplement]


    Local functions were introduced in C# 7.0.


    You can nest multiple levels of local functions if needed (though it’s rare and
    can reduce readability).


    They are different from lambda expressions and anonymous methods, which are inline
    delegates rather than named functions.'
