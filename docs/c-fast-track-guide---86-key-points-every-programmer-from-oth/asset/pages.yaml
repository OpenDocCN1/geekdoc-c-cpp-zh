  md: '# 69. SIMPLIFIED NAMESPACE DECLARATION WITH FILE-SCOPED SYNTAX


    File-scoped namespaces let you write cleaner, less indented code by removing the
    need for extra braces when declaring a namespace.


    Here''s a comparison between the traditional namespace syntax and the newer file-scoped
    syntax.


    [Code Example]


    ```

    // Traditional namespace syntax

    namespace MyApp

    {

    class Program

    {

    static void Main()

    {

    Console.WriteLine("Hello from traditional namespace!");

    }

    }

    }


    // File-scoped namespace syntax (C# 10 or later)

    namespace MyApp;

    class Program

    {

    static void Main()

    {

    Console.WriteLine("Hello from file-scoped namespace!");

    }

    }

    ```'
  merge: -1
