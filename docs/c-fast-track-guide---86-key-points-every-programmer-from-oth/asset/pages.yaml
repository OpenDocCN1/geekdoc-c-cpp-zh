    \ (int i = 0; i < slice.Length; i++)\n        {\n            slice[i] *= 10; //\
    \ Modify values in-place\n        }\n        Console.WriteLine(string.Join(\"\
    , \", numbers)); // Original array is changed\n    }\n}\n```\n```\n\n[Execution\
    \ Result]\n\n1, 20, 30, 40, 5"
