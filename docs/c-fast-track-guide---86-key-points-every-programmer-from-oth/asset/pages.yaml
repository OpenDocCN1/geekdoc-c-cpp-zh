  md: '# # 50. CALLING NATIVE CODE WITH DLLIMPORT AND P/INVOKE


    C# supports calling functions from native DLLs (e.g., Windows API) using Platform
    Invocation Services (P/Invoke) via the DllImport attribute. This allows direct
    access to OS-level functions or legacy C/C++ libraries.


    This example shows how to call the native Windows function MessageBox from user32.dll.


    [Code Example]


    ```

    ```csharp

    using System;

    using System.Runtime.InteropServices;

    class Program

    {

    // Declare external function from user32.dll

    [DllImport("user32.dll", CharSet = CharSet.Auto)]

    public static extern int MessageBox(IntPtr hWnd, String text, String caption,
    uint type);

    static void Main()

    {

    // Call the native MessageBox function

    MessageBox(IntPtr.Zero, "Hello from native code!", "P/Invoke Example", 0);

    }

    }

    ```

    ```


    [Execution Result]


    A native Windows message box appears with the text:


    Title: P/Invoke Example


    Message: Hello from native code!'
