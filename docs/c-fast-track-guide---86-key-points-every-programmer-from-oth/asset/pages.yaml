  md: '# 58. ORGANIZING CODE WITH NAMESPACES


    Namespaces are used to group related classes, avoid name clashes, and keep code
    organized.


    The following example shows how two classes with the same name can coexist in
    different namespaces.


    [Code Example]


    ```

    using System;

    namespace MyApp.Utilities {

    class Logger {

    public static void Log() {

    Console.WriteLine("Logging from Utilities namespace");

    }

    }

    }

    namespace MyApp.DebugTools {

    class Logger {

    public static void Log() {

    Console.WriteLine("Logging from DebugTools namespace");

    }

    }

    }

    class Program {

    static void Main() {

    // Fully qualify to avoid ambiguity

    MyApp.Utilities.Logger.Log();

    MyApp.DebugTools.Logger.Log();

    }

    }

    ```'
