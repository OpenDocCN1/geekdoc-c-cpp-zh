    (is Circle c) to check the type and extract the instance into a new variable of
    that type (c). This avoids manual casting and null checks.


    This mechanism is especially powerful in switch expressions and with newer features
    like relational patterns and recursive patterns (e.g., checking values inside
    properties).


    For beginners, understanding this requires some knowledge of classes and type
    checking, so it''s slightly advanced but very valuable for writing clean, safe
    code.


    [Supplement]


    Pattern matching became significantly more powerful starting from C# 7.0 and has
    been extended in later versions.'
