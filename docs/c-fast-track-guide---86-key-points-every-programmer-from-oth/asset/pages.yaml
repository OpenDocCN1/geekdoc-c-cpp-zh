  md: '# # 38. CUSTOM TYPE CONVERSION USING EXPLICIT AND IMPLICIT OPERATORS


    Explicit and implicit conversion operators allow developers to define how one
    custom type can be converted to another type, or vice versa.


    The following code demonstrates both explicit and implicit conversions between
    a Celsius class and a Fahrenheit class.


    [Code Example]


    ```

    using System;

    class Celsius

    {

    public double Degrees;

    public Celsius(double degrees)

    {

    Degrees = degrees;

    }

    // Implicit conversion from double to Celsius

    public static implicit operator Celsius(double d)

    {

    return new Celsius(d);

    }

    // Explicit conversion from Celsius to Fahrenheit

    public static explicit operator Fahrenheit(Celsius c)

    {

    return new Fahrenheit(c.Degrees * 9 / 5 + 32);

    }

    public override string ToString()

    {

    return $"{Degrees} °C";

    ```'
