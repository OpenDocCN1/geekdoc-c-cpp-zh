- pgno: 18
  md: "# 1. AUTOMATIC MEMORY\nMANAGEMENT WITH GARBAGE\nCOLLECTOR\n\nC# uses a Garbage\
    \ Collector (GC) to automatically manage memory, preventing memory leaks and reducing\
    \ manual deallocation errors.\n\nIn C#, memory is allocated dynamically when objects\
    \ are created. The Garbage Collector (GC) automatically reclaims memory that is\
    \ no longer in use, freeing developers from manually releasing objects. Below\
    \ is a simple example showing how garbage collection works.\n\n[Code Example]\n\
    \n```\n```csharp\nusing System;\nclass Program\n{\n    class Sample\n    {\n \
    \       // Destructor (finalizer) to show when the object is collected\n     \
    \   ~Sample()\n        {\n            Console.WriteLine(\"Sample object is being\
    \ collected!\");\n        }\n    }\n\n    static void Main()\n    {\n        //\
    \ Creating and releasing objects\n        Sample obj = new Sample();\n       \
    \ obj = null; // Make object eligible for garbage collection\n\n        // Force\
    \ garbage collection (not recommended in real applications)\n        GC.Collect();\n\
    \        GC.WaitForPendingFinalizers();\n```\n```"
  merge: -1
  img_proc: true
- pgno: 19
  md: '```

