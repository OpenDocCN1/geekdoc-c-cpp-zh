    In a multithreaded context, using standard collections like Dictionary can lead
    to exceptions or corrupted data if multiple threads access it simultaneously.


    ConcurrentDictionary ensures that operations like Add, Update, and Get are thread-safe
    by handling internal locking mechanisms.


    Here, TryAdd is used to safely insert a new key-value pair without risking race
    conditions.


    The Parallel.For ensures that multiple threads are trying to add values at the
    same time — a perfect way to demonstrate thread safety.


    For beginners:


    +   - You don''t need to write manual lock statements.

    +   - Thread-safe collections help avoid bugs that are hard to find and fix.

    +   - Ideal for producer-consumer patterns and real-time data processing.


    # [Supplement]


    Other thread-safe collections include: ConcurrentQueue<T>, ConcurrentStack<T>,
    ConcurrentBag<T>, and BlockingCollection<T>.'
