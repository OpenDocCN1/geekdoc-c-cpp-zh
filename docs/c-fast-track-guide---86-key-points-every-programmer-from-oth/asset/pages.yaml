  md: '# 57. STRONG NAMING AND ASSEMBLY VERSIONING FOR SAFE EXECUTION


    Assembly versioning allows multiple versions of a library (DLL) to coexist, while
    strong naming ensures assemblies are uniquely identified and tamper-proof.


    The following example demonstrates how to apply a strong name and understand versioning
    in C#.


    [Code Example]


    ```

    ```csharp

    // AssemblyInfo.cs

    // Set assembly version explicitly

    [assembly: AssemblyVersion("1.0.0.0")]

    // Set strong name by signing with a key

    // (You must generate a key file using ''sn.exe -k MyKey.snk'' first)

    [assembly: AssemblyKeyFile("MyKey.snk")]

    // To generate the key file, use this command in Developer Command Prompt:

    // sn.exe -k MyKey.snk

    // To compile with the strong name:

    //

    // csc /keyfile:MyKey.snk /target:library MyLibrary.cs

    ```

    ```


    [Execution Result]


    Generates a strongly-named DLL with version 1.0.0.0 — e.g., MyLibrary.dll'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Can be installed in Global Assembly Cache (GAC) for shared use.


    Assemblies in .NET are compiled code (DLLs or EXEs). Without versioning, newer
    versions can overwrite old ones and break existing apps.


    Strong naming solves this by combining the assembly''s name, version, culture,
    and a public key into a unique identity.


    Side-by-side execution allows different versions of the same library to run simultaneously,
    preventing "DLL Hell" — a common issue in older Windows development.


    To enable strong naming:


    +   - Use sn.exe to generate a key pair.

    +   - Add [assembly: AssemblyKeyFile("...")] to your AssemblyInfo.cs.

    +   - Compile with the /keyfile: option.


    This results in a cryptographic signature. The CLR can now verify the integrity
    and origin of the assembly.


    # [Supplement]


