- pgno: 25
  md: '# 3. STRUCTS VS. CLASSES: VALUE TYPES VS. REFERENCE TYPES


    In C#, structs and classes serve different purposes. Structs are value types,
    which means they are stored directly in memory and copied when assigned or passed.
    Classes, on the other hand, are reference types, meaning they are stored in the
    heap and passed by reference. Understanding this difference is crucial for writing
    efficient and bug-free code.


    Below is a simple example demonstrating how structs and classes behave differently
    when assigned to a new variable.


    [Code Example]


    ```

    ```csharp

    using System;

    struct MyStruct

    {

    public int Value;

    }

    class MyClass

    {

    public int Value;

    }

    class Program

    {

    static void Main()

    {

    // Struct Example (Value Type)

    MyStruct struct1 = new MyStruct { Value = 10 };

    MyStruct struct2 = struct1;

    struct2.Value = 20;

    Console.WriteLine($"Struct1 Value: {struct1.Value}"); // Remains 10

    Console.WriteLine($"Struct2 Value: {struct2.Value}"); // Changes to 20

    // Class Example (Reference Type)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 26
  md: '```

    MyClass class1 = new MyClass { Value = 10 };

    MyClass class2 = class1;

    class2.Value = 20;

    Console.WriteLine($"Class1 Value: {class1.Value}"); // Changes to 20

    Console.WriteLine($"Class2 Value: {class2.Value}"); // Changes to 20

    }

    }

    ```


    # [Execution Result]


    +   - Struct1 Value: 10

    +   - Struct2 Value: 20

    +   - Class1 Value: 20

    +   - Class2 Value: 20


    Structs are stored on the stack, making them efficient for small, simple data
    types. Classes are stored on the heap, making them more flexible but slightly
    slower due to garbage collection. When assigning a struct to another variable,
    a copy is made, so changes in one do not affect the other. When assigning a class
    instance to another variable, only the reference is copied, meaning changes in
    one will reflect in the other. Use structs for lightweight data structures, such
    as coordinates, colors, or small immutable objects. Use classes when you need
    complex behavior, inheritance, or large objects that should not be frequently
    copied.'
  merge: -1
  img_proc: true
