- pgno: 48
  md: 'Age is unknown.

    Updated age: 30


    In C#, value types (like int, float, bool) normally cannot be null. This makes
    sense because they are designed to hold actual values (e.g., a number). But sometimes,
    especially when dealing with databases, APIs, or user input, you may want to represent
    "no data" or "unknown" — and for that, int? (read as "nullable int") is your friend.


    When you declare int?, C# is actually creating a shorthand for Nullable<int>.
    This structure has properties like .HasValue (true if it holds a value) and .Value
    (the value itself).


    This concept is crucial in real-world applications — imagine a user hasn''t filled
    in their birthday yet. Instead of using a fake number like -1, nullable types
    let you say "this has no value, and that''s okay."


    Be very careful not to access .Value unless you''re sure .HasValue is true — otherwise,
    your code will crash.


    [Supplement]


    Nullable types are structs under the hood (Nullable<T>), not reference types.


    You can also use the null-coalescing operator (??) to provide a default value:


    ```

    ```csharp

    int displayedAge = age ?? 0; // use 0 if age is null

    ```

    ```


    Useful when mapping between database fields (which are often nullable) and C#
    types.'
