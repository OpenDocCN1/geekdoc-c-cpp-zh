    The key difference between **value types** and **reference types** is how they
    are stored and copied in memory:


    # ### **Value Types (Stack)**


    +   - Stored in the **stack** (a small, fast memory area).

    +   - When assigned to another variable, a **copy** is created.

    +   - Changes in one variable **do not** affect the other.

    +   - Examples: `int`, `double`, `char`, `bool`, `struct`, `enum`.


    # ### **Reference Types (Heap)**


    +   - Stored in the **heap** (a dynamically allocated memory area).'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   - When assigned to another variable, the **reference** (not the actual
    data) is copied.

    +   - Changes in one variable **affect** the other because they point to the same
    object.

    +   - Examples: `class`, `string`, `array`, `interface`, `delegate`.


    # ### **Stack vs Heap**


    +   - **Stack**: Faster access, automatic memory cleanup when out of scope.

    +   - **Heap**: Slower but can store larger, more complex data structures.


    # ### **Common Mistakes**


    +   1. **Confusing Structs and Classes**

    +      - Structs (`struct`) are **value types** (stored in stack).

    +      - Classes (`class`) are **reference types** (stored in heap).

    +      - Use structs for small, immutable data; use classes for complex objects.

    +   2. **Unintended Reference Sharing**

    +      - When passing a reference type to a method, changes inside the method
    affect the original object.

    +      - Use `ref` or `out` keywords if explicitly intending reference behavior
    with value types.

    +   3. **Nullable Types**

    +      - Value types **cannot** be null by default. Use `Nullable<T>` or `?` (e.g.,
    `int? myInt = null;`).

    +      - Reference types **can** be null, leading to potential `NullReferenceException`.'
  merge: -1
  img_proc: true
