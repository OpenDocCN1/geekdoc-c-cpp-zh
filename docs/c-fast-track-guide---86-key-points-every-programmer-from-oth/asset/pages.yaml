  md: '# 35. UNDERSTANDING C# RECORDS FOR IMMUTABLE DATA STRUCTURES


    Records in C# are a type of reference object meant to store data immutably. Once
    created, their data cannot be changed.


    Here’s a basic example of using a C# record to represent a person, showing how
    the data stays fixed after creation.


    [Code Example]


    ```

    // Define a record type with two properties

    public record Person(string FirstName, string LastName);

    class Program

    {

    static void Main()

    {

    // Create a new record instance

    var person1 = new Person("Alice", "Smith");

    // Use ''with'' expression to create a new record with one changed property

    var person2 = person1 with { LastName = "Johnson" };

    Console.WriteLine(person1); // Output: Person { FirstName = Alice, LastName =
    Smith }

    Console.WriteLine(person2); // Output: Person { FirstName = Alice, LastName =
    Johnson }

    }

    }

    ```


    [Execution Result]


    Person { FirstName = Alice, LastName = Smith }


    Person { FirstName = Alice, LastName = Johnson }


    record types in C# were introduced in C# 9.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'They are immutable by default, meaning their values can''t be changed after
    creation.


    You can use the with expression to create a copy with modified values.


    Unlike class, records provide value-based equality — two records with the same
    data are considered equal.


    This is great for scenarios like DTOs (Data Transfer Objects), configurations,
    or event data.


    Comparison vs. class:


    class: reference equality — same object in memory.


    record: value equality — same data content.


    Why immutability matters:


    Avoids bugs caused by unexpected changes to data.


    Easier to reason about in multithreaded environments.


    [Supplement]


    Records can also have methods, constructors, and inheritance.


    You can define records with property declarations (record Person { string FirstName;
    string LastName; }), but using positional syntax (like above) is more concise.


    A record is still a reference type under the hood, even though it behaves like
    a value type in many ways.'
