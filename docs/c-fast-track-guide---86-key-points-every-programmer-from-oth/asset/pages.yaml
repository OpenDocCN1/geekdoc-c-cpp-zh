  md: '# 7. PROPERTIES CONTROL ACCESS TO FIELDS IN C#


    In C#, properties are used to provide controlled access to fields in a class.
    Properties can be used to define how the values of private fields are set or retrieved.
    By using getters (accessors) and setters (mutators), properties allow you to hide
    the implementation details of the field while providing an interface for external
    code to interact with the field.


    Let''s look at a simple example of using properties to control access to a field:


    [Code Example]


    ```

    using System;

    public class Person

    {

    private string name; // Private field

    // Property to access the private field

    public string Name

    {

    get { return name; } // Getter

    set { name = value; } // Setter

    }

    }

    public class Program

    {

    public static void Main()

    {

    Person person = new Person();

    person.Name = "John Doe"; // Set the value using the setter

    Console.WriteLine(person.Name); // Get the value using the getter

    }

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 38
  md: '```

    }

    ```


    # [Execution Result]


    John Doe


    In the example above, we have a private field name, and we use the property Name
    to access and modify its value. The get accessor retrieves the value of the name
    field, and the set accessor assigns a value to it. The value keyword represents
    the value passed to the setter. By using properties, we can easily add logic to
    the getter or setter in the future if needed, without affecting external code
    that uses the property.


    Properties are very useful for implementing validation or modifying data before
    storing it. You can even use properties to encapsulate more complex logic, such
    as lazy loading or calculations.


    # [Supplement]


    In C#, properties are an essential part of object-oriented programming because
    they allow encapsulation. They prevent direct access to a field while still providing
    a way to interact with it. The use of properties can make your code more maintainable
    and safer by ensuring that fields are only modified in a controlled manner.'
