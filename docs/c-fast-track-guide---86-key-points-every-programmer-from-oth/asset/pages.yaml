    The global using directive allows you to import namespaces across all files in
    a project, reducing redundancy and improving consistency.


    Here’s how global using removes the need to repeat the same using statements in
    every C# file.


    [Code Example]


    ```

    ```csharp

    // File: GlobalUsings.cs


    global using System;


    global using System.Collections.Generic;


    // File: Program.cs


    class Program

    {

    static void Main()

    {

    List<string> names = new List<string> { "Alice", "Bob" };

    Console.WriteLine(string.Join(", ", names));

    }

    }

    ```

