    When using async and await, the code looks synchronous but runs asynchronously
    under the hood:


    +   - async before the method tells the compiler this method may run asynchronously.

    +   - await pauses execution until the awaited task finishes, but does not block
    the main thread.

    +   - Task.Delay() is like Thread.Sleep() but non-blocking—it gives control back
    to the runtime while waiting.

    +   - This is especially useful in UI apps or servers where blocking the main
    thread would freeze the app or cause delays.

    +   - The key benefit: readable asynchronous code that’s easy to maintain.


    [Supplement]

    async methods must return Task, Task<T>, or void (only in event handlers).'
