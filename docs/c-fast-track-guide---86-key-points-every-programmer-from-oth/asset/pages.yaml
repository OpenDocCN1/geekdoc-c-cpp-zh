  md: '# 87. LIVE CODE UPDATES WITH HOT RELOAD


    Hot Reload allows you to apply code changes instantly while debugging, without
    stopping and restarting your application.


    Here’s a simple example using a console app to demonstrate Hot Reload during runtime.


    [Code Example]


    ```

    // Program.cs

    using System;

    class Program

    {

    static void Main(string[] args)

    {

    // This line will be updated during runtime using Hot Reload

    Console.WriteLine("Hello, C#!");

    }

    }

    // After starting the app with debugging and applying a change using Hot Reload:

    // Modified during runtime

    Console.WriteLine("Hello, world! (Hot Reloaded)");

    ```


    [Execution Result]


    Initially prints:


    Hello, C#!


    After Hot Reload change, prints:


    Hello, world! (Hot Reloaded)'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'Hot Reload is a feature introduced in .NET 6 and improved in .NET 7 and beyond.


    It allows you to change your code while the application is running, especially
    when debugging.


    This is useful because:


    +   - You don’t have to stop and rebuild the app.

    +   - You can test small tweaks in real-time.

    +   - You stay in the "flow" of debugging.


    How to use it:


    +   - Open your project in Visual Studio or run from CLI with dotnet watch.

    +   - Start the app in debug mode.

    +   - Make changes in your code (like editing a message or logic).

    +   - If Hot Reload supports it, it will automatically apply your changes.


    Important Notes:


    +   - Works best with ASP.NET Core, WPF, WinForms, Console Apps.

    +   - Not all changes are reloadable (e.g., changing class/struct definitions
    sometimes requires a rebuild).

    +   - Visual Studio usually shows a lightning bolt [] icon when Hot Reload applies
    your code.


    # ## [Supplement]


    Hot Reload internally uses the Edit and Continue (EnC) feature of the .NET runtime.'
  merge: -1
  img_proc: true
