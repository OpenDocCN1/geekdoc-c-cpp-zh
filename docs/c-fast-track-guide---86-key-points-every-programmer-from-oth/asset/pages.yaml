  md: "# 4. UNDERSTANDING ENUMS:  \nSTRONGLY-TYPED CONSTANTS\n\nEnums in C# provide\
    \ a way to define a set of named constant values, which are strongly typed and\
    \ mapped to an underlying integral type (default: int). This makes code more readable\
    \ and prevents invalid values from being used.\n\nBelow is an example of defining\
    \ and using an enum to represent different user roles in a system.\n\n```\n```csharp\n\
    using System;\n\nenum UserRole\n{\n    Admin = 1,\n    Moderator = 2,\n    User\
    \ = 3\n}\n\nclass Program\n{\n    static void Main()\n    {\n        UserRole\
    \ role = UserRole.Moderator;\n        Console.WriteLine($\"Role: {role}\"); //\
    \ Output: Moderator\n        Console.WriteLine($\"Role Value: {(int)role}\");\
    \ // Output: 2\n\n        // Checking an enum value\n        if (role == UserRole.Admin)\n\
    \        {\n            Console.WriteLine(\"You have admin privileges.\");\n \
    \       }\n        else\n```\n```"
