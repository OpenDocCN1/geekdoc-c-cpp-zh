  md: '# 15. LINQ: QUERY DATA LIKE SQL IN C#


    LINQ (Language Integrated Query) lets you query collections and databases using
    readable, SQL-like syntax directly in C# code.


    Here''s a simple example of using LINQ to filter a list of numbers and select
    only the even ones.


    [Code Example]


    ```

    ```csharp

    using System;

    using System.Linq; // Required to use LINQ

    class Program

    {

    static void Main()

    {

    int[] numbers = { 1, 2, 3, 4, 5, 6 };


    // LINQ query to select even numbers

    var evenNumbers = numbers.Where(n => n % 2 == 0);


    // Display the results

    foreach (int num in evenNumbers)

    {

    Console.WriteLine(num); // Output each even number

    }

    }

    }

    ```

    ```


    [Execution Result]


    2

    4

    6'
