- pgno: 21
  md: "# 2. UNDERSTANDING VALUE TYPES AND REFERENCE TYPES\n\nC# supports two fundamental\
    \ types of data storage: **Value Types** (stored in the stack) and **Reference\
    \ Types** (stored in the heap). This affects how data is managed in memory.\n\n\
    Understanding the difference between value types and reference types is crucial\
    \ in C# programming. Below is an example demonstrating how assigning values works\
    \ differently between them.\n\n[Code Example]\n\n```\n```csharp\nusing System;\n\
    \nclass Program\n{\n    struct ValueTypeExample\n    {\n        public int number;\n\
    \    }\n\n    class ReferenceTypeExample\n    {\n        public int number;\n\
    \    }\n\n    static void Main()\n    {\n        // Value type (struct) - stored\
    \ in the stack\n        ValueTypeExample v1 = new ValueTypeExample();\n      \
    \  v1.number = 10;\n        ValueTypeExample v2 = v1; // Copying value (new copy\
    \ in stack)\n        v2.number = 20;\n        Console.WriteLine(\"Value Type -\
    \ v1: \" + v1.number); // Outputs 10\n        Console.WriteLine(\"Value Type -\
    \ v2: \" + v2.number); // Outputs 20\n```\n```"
  merge: -1
  img_proc: true
