  md: "# 61. DEFINING HELPER METHODS INSIDE METHODS (LOCAL FUNCTIONS)\n\nLocal functions\
    \ in C# are methods declared inside another method. They're useful for isolating\
    \ helper logic that doesn't need to be exposed outside the containing method.\n\
    \nHere’s a simple example showing how a local function is defined and used inside\
    \ another method.\n\n[Code Example]\n\n```\nusing System;\n\nclass Program\n{\n\
    \    static void Main()\n    {\n        int number = 5;\n\n        // Call the\
    \ method that uses a local function\n        int result = CalculateFactorial(number);\n\
    \        Console.WriteLine($\"Factorial of {number} is {result}\");\n    }\n\n\
    \    static int CalculateFactorial(int n)\n    {\n        // Local function defined\
    \ inside the method\n\n        int Factorial(int x)\n        {\n            if\
    \ (x <= 1) return 1;\n            return x * Factorial(x - 1); // Recursive call\n\
    \        }\n\n        return Factorial(n); // Calling the local function\n   \
    \ }\n}\n```"
