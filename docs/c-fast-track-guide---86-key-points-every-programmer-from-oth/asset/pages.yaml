    [Supplement]


    +   - The garbage collector does **not** immediately reclaim memory when an object
    becomes unreachable; it works based on an internal scheduling mechanism.

    +   - The `using` statement is used for proper disposal of unmanaged resources
    like files and database connections.

    +   - C# does not support explicit deallocation (`delete` like in C++); the GC
    handles it automatically.

    +   - Large objects (LOH - Large Object Heap) are handled differently by the GC
    and may take longer to collect.

    +   - Calling `GC.Collect()` frequently can degrade performance rather than improve
    it.'
