    ![](img/bb6e93ece31f33afd31e933e9dd494be_200_0.png)


    In C#, structs are value types. Making them readonly prevents unintended changes
    after creation. When a struct is marked as readonly, all its fields and properties
    must also be immutable — this is enforced at compile time.


    If you try to assign to any field or property of a readonly struct outside its
    constructor, you''ll get a compiler error. This is great for modeling pure data
    structures like vectors, dates, or 2D points where immutability is preferred.


    One major benefit is that the compiler can optimize readonly structs for performance,
    especially in scenarios involving passing data around in memory or across threads.


    Also, readonly struct helps avoid defensive copies. Normally, when calling methods
    on a non-readonly struct, the compiler might copy it to avoid mutation. With readonly
    struct, the compiler knows no mutation occurs, so copying is skipped — leading
