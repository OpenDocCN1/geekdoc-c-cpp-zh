  md: "# # 74. HIGH-PERFORMANCE INTER-SERVICE COMMUNICATION WITH GRPC\n\ngRPC is a\
    \ modern Remote Procedure Call (RPC) framework that enables fast communication\
    \ between microservices. In .NET, gRPC is fully supported and optimized for high\
    \ throughput and low latency.\n\nHere's how a basic gRPC server and client are\
    \ set up in C#. We'll show just the minimal core parts.\n\n[Code Example]\n\n\
    ```\n```\n// file: greet.proto\nsyntax = \"proto3\";\n\nservice Greeter {\n  rpc\
    \ SayHello (HelloRequest) returns (HelloReply);\n}\n\nmessage HelloRequest {\n\
    \  string name = 1;\n}\n\nmessage HelloReply {\n  string message = 1;\n}\n\n//\
    \ Server-side implementation\npublic class GreeterService : Greeter.GreeterBase\n\
    {\n    public override Task<HelloReply> SayHello(HelloRequest request, ServerCallContext\
    \ context)\n    {\n        return Task.FromResult(new HelloReply { Message = $\"\
    Hello, {request.Name}\" });\n    }\n}\n\n// Client-side usage\n```\n```"
