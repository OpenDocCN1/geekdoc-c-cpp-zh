    # Matrix-Matrix and Vector-Matrix Multiplication


    The most important methods of the Matrix class are the multiplication methods;
    these are used to combine matrices and transform on vertex positions. Matrix multiplication
    can only be performed if the width of the first matrix equals the height of the
    second. Matrix-matrix and vector-matrix multiplication is performed using the
    same algorithm.


    Here is the definition.


    > $C_{i,k} = A_{ij}B_{j,k}$


    C is the result of the multiplication, i is the length of the rows in matrix A,
    and k is the length of the columns in matrix B. The j is the number of possible
    summations of i and k. In matrix multiplication, different-shaped matrices can
    result from the original shapes of the matrices that are multiplied. Again, don''t
    worry if the math seems a little intimidating; knowing how and when to use a matrix
    is the most important lesson to take away.


