    \ end, time, Tween.Linear);\n```\n\nThe Construct method records the start value\
    \ of the tween, the end value, and the time in which the tween can perform this\
    \ operation. A tween function can also be passed in to determine how the value\
    \ will be changed over time. The Construct method records these values and works\
    \ out the distance from the start to the end value. This distance is passed on\
    \ to the relevant tween function.\n\nThe Tween object is updated every frame and\
    \ the time elapsed is summed each Update call. This way the Tween object knows\
    \ how far through the tween it is. The function delegate modifies the current\
    \ value of the tween. Finally, the Update method checks if the tween has finished,\
