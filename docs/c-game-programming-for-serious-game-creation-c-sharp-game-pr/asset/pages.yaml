    # Summary


    OpenGL and DirectX3D are the two major industrial graphics libraries in use today.
    These graphics libraries are a standardized way to talk to the underlying graphics
    hardware. Graphics hardware is usually made from several standard pieces and is
    extremely efficient at transforming 3D vertex information to a 2D frame on the
    screen. This transformation from 3D vertices to a 2D frame is known as the graphics
    pipeline. There are two types of graphics pipeline; the fixed pipeline, which
    cannot be programmed, and the programmable pipeline, which allows certain stages
    of the pipeline to be programmed using shaders.


    The Tao Framework is a collection of useful libraries including OpenGL. C# can
    make use of the Tao Framework to write games using OpenGL. The Tao Framework also
    includes several other libraries useful for game development. OpenAL, Devil, and
    SDL will all be used in this book to develop a simple side-scrolling shooter game.'
