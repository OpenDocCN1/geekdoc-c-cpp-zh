  md: "# Color Modulating Sprites\n\nThe current sprite code is quite comprehensive.\
    \ It's easy to set the sprite texture, U, V mapping, position, width, and height.\
    \ The final operation that is quite common with sprites is to alter the color.\
    \ In many games, text can change color and images may flash yellow to attract\
    \ the attention of the user. This is normally done through color modulation.\n\
    \nThe basics of this technique have already been covered when the spinning triangle\
    \ was created. Each vertex is given a color. It's easier if the sprite has one\
    \ single color and all vertices share it.\n\nThe color only needs to be set once,\
    \ and then all the vertices will be that color.\n\n```\nfloat red = 1;\nfloat\
    \ green = 0;\nfloat blue = 0;\nfloat alpha = 1;\n\nGl1Begin(Gl.GL_TRIANGLES);\n\
    {\n  GlColor4f(red, green, blue, alpha);\n```\n\nThis code will turn the sprite\
    \ red. Altering the alpha will affect the entire sprite's transparency. Using\
    \ this code, it's very easy to imagine how to fade something by changing the alpha\
    \ from 0 to 1 over time.\n\nIn cases it may be desirable to give a sprite a gradient\
    \ rather than a solid color. This can be achieved by setting the bottom vertices\
    \ one color and the top vertices a second color. The color will be interpolated\
    \ by OpenGL and will create a gradient automatically.\n\n# A Sprite and Renderer\
    \ Class\n\nThe basics of a sprite have been demonstrated, but it's all quite untidy\
    \ at the moment, and very hard to reuse. The code needs to be wrapped up into\
    \ classes. The color, position, and U,V point data need to be separated into their\
    \ own classes. It would be ideal to use pre-existing C# classes for these data\
    \ structures, but it's better to make our own as they will need to be tailored\
    \ to work correctly with OpenGL."
