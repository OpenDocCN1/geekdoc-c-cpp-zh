  md: "# Chapter 10 = A Simple Side-Scrolling Shooting Game\n\nThe OnDestroyed function\
    \ is a placeholder for now; we'll worry about the enemy is destroyed a little\
    \ later. In the OnCollision function, the first statement checks if the ship is\
    \ already at 0 health. In this case, any additional damage is ignored; the player\
    \ has already killed the enemy and the game doesn't need to acknowledge any more\
    \ shots. Next the Health is reduced by 25, arbitrary damage number, to represent\
    \ the damage of a single bullet. Math Max is used to ensure that the health never\
    \ falls below 0. The ship should flash yellow when hit. The countdown is set to\
    \ represent how long the flash should take. The ship sprite is set to a yellow\
    \ color, which in RGBA is 1,1,0,1. Finally, the health is checked, and if it equals\
    \ 0, then the placeholder OnDestroyed method is called. This is the function where\
    \ the explosion will be triggered.\n\nTo cause the ship to flash, the Update loop\
    \ also needs to be modified. It needs to count down the flash and change the color\
    \ from yellow to white.\n\n```\npublic void Update(double elapsedTime)\n{\nif\
    \ (_hitFlashCount != 0)\n    _hitFlashCount = Math.Max(0, _hitFlashCount - elapsedTime);\n\
    \    double scaledTime = 1 - (_hitFlashCount / FlashTime);\n    _sprite.SetColor(new\
    \ Engine.Color(1, 1, 0, (float) scaledTime));\n}\n```\n\nThe Update loop modifies\
    \ the flash color of the enemy spaceship. If the countdown has already dropped\
    \ to 0, then the flash has finished and doesn't need to be updated. If the _hitFlashCount\
    \ doesn't equal 0, then it is reduced by the amount of time that has passed the\
    \ last frame. Math.Max is used again to ensure the count doesn't fall below 0.\
    \ The countdown is then scaled to get a value from 0 to 1, indicating how far\
    \ the flash we currently are; 0 indicates the flash has just started and 1 indicates\
    \ it's finished. This number is inverted by subtracting it from 1 so that 1 indicates\
    \ that the flash has just started and 0 indicates that it's finished. This scaled\
    \ number is used to move the blue channel of the color from 0 to 1. This will\
    \ flash the ship from yellow to white.\n\nRun the program and shoot the enemy\
    \ ship a few times; it will flash yellow a few times and stop responding because\
    \ it's destroyed. Enemy ships shouldn't just stop; they should explode!"
