    The GetIndexFromFrame method takes an index as shown in Figure 10.10 and returns
    an X,Y coordinate of the index position. For example, index 0 would return 0,0
    and index 15 would return 3,3. The index number is broken into an X and Y coordinate
    by dividing the index by the row length; this gives the number of rows and therefore
    the Y coordinate of the index. The X coordinate is whatever is left of the index
    when the Y rows are removed. This function is very useful when translating, calculating
    the U,Vs for a certain frame.


