- img_proc: true
  md: '# Chapter 2 = Introducing OpenGL


    The CPU sends instructions and data to the GPU, describing how each frame should
    appear on the screen. The texture memory is usually a large store of memory that
    is used for storing the vast amount of texture data that games require. The frame
    buffer is an area of memory that stores the image that will be displayed on the
    screen in the next frame. Modern cards may have more than one GPU, and on each
    GPU are many shader processing units for doing parallel shader operations. This
    has been exploited by distributed applications as Folding@home, which runs folding
    simulations, and on hundreds of thousands of computers over the world.


    The first 3D graphics card was the 3gfx Voodoo 1. This was one of the very early
    cards; it had 2 megabytes of texture memory and 2 megabytes for the frame buffer,
    and it used the PCI bus and a clock speed of 135MHz. It accelerated games such
    as Tomb Raider, Descent II, Quake, and the demo of Quake II, allowing games to
    run much smoother and with greater detail. The Voodoo 1 used a standard PCI bus
    that allows the CPU to send data to the graphics card at an upper limit of 533MB/s.
    Modern cards have moved from the PCI bus to the AGP (Accelerated Graphics Port),
    which achieved a maximum of 2GB/s and then on to the Express. Current generations
    of the PCI Express card can send up to 8GB/s.


    New graphics cards seem to come monthly, each faster than the last. At the time
    of this writing, the fastest card is probably the ATI Radeon 5970. It has two
    GPUs and each GPU has 1,600 shader processors. It has a clock speed of 725MHz
    and a total computing performance of 4.64 teraflops.


    Most modern cards have unique specialized hardware for new operations. Hardware
    is exposed to OpenGL through the use of extensions. OpenGL is capable of exposing
    new functionality present in the driver and graphics cards when given a string
    identifying the new extension. For example, the ATI Radeon HD 5970 has two GPUs;
    this is rather unusual, and to make use of both GPUs, there are some new extension
    methods such as AMD_gpu_association. This extension allows the user to split tasks
    between the two GPUs. If a number of vendors implement the same extension, then
    it has the letters “EXT” somewhere in the extension string. In some cases, it
    is possible that the architecture review board that controls the OpenGL specification
    will elevate an extension to official status. In that, the OpenGL specification
    gets the letters “ARB” included in the string and all vendors are required to
    support it.'
