  md: '+   - Large boss enemies at the end of the level are also a staple of the side-scrolling
    shooter. You could make the boss enemy an aggregate of several different types
    of enemies. Then parts of the boss can be destroyed, but the PlayerCharacter only
    wins when all the boss parts are destroyed.


    +   - The scrolling space backgrounds are quite dull and could be made more lively
    with animated space debris, far away supernova, and planets. The scrolling background
