    but if there are any research tasks that the game relies on they need to be done
    first; this might be as simple as a quick Google search or it may require asking
    people who are better informed by reading books and articles on the subject. Small
    toy programs are a great place to try out different research ideas, which if successful
    can be cleaned up and incorporated into the final project.


