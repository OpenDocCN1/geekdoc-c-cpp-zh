    # Continuing Iterations


    After two basic iterations of development, we have a wonderful but side-scrolling
    shooter. There is massive scope for developing this project into something totally
    individual. The project is yours now and you can develop it as you want. If you
    feel a little lost, here are some suggestions.


    +   - A very simple step is to introduce a new enemy type; just add an extra else
    if perhaps modify a path or the health. Once you''ve done that, considering a
    new enemy texture and changing the new enemy to use this texture. This will suddenly
    make the game a lot more interesting.


    +   - A score is important in scrolling shooters. The score can be displayed by
    the Text class. The score should increase every time the player destroys an enemy.'
