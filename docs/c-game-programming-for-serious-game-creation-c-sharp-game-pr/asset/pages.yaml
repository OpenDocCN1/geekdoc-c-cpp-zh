  md: '# Chapter 7 ■ Rendering Text


    Run the program and see what your frame-rate is. Frame-rates differ wildly from
    computer to computer. There''s not much going on in the program, so the frame-rate
    is going to be quite high. Figure 7.5 shows the output when running the program.


    Initially the frame-rate displayed on my computer was about 60 frames per second.
