  md: "# Adding Sound Support\n\nThe SoundSource structure stores information about\
    \ the loaded sounds. It will only ever used internally by the sound manager so\
    \ the structure exists inside the SoundManager class. When sound data is loaded\
    \ in OpenAL an integer will be returned; this is used to keep a reference for\
    \ the sound for it needs to be played. The sound identifier maps a sound's name\
    \ to the sound data in memory. The dictionary will be a big table of all the sounds\
    \ available to the game with an easy English string to identify each one.\n\n\
    To load a sound file the using System. IO; statement needs to be added to the\
    \ top of the file. The LoadSound function will fill up the _soundIdentifier dictionary\
    \ with games.\n\n```\npublic void LoadSound(string soundId, string path)\n{\n\
    \    // Generate a buffer.\n    int buffer = -1;\n    Al.alGenBuffers(1, out buffer);\n\
    \n    int errorCode = Al.alGetError();\n    System.Diagnostics.Debug.Assert(errorCode\
    \ == Al.AL_NO_ERROR);\n\n    int format;\n    float frequency;\n    int size;\n\
    \    System.Diagnostics.Debug.Assert(File.Exists(path));\n    IntPtr data = Alut.alLoadMemoryFromFile(path,\
    \ out format, out size, out frequency);\n    System.Diagnostics.Debug.Assert(data\
    \ != IntPtr.Zero);\n    // Load wav data into the generated buffer.\n    Al.alBufferData(buffer,\
    \ format, data, size, (int)frequency);\n    // Everything seems ok, add it to\
    \ the library.\n    _soundIdentifier.Add(soundId, new SoundSource(buffer, path));\n\
    }\n```\n\nThe LoadSound method first generates a buffer. This is an area in memory\
    \ where the sound data from the disk will be stored. The OpenAL utility function\
    \ alLoadFromFile is used to read the data for a .wav memory. The memory containing\
    \ the file data is then put into the buffer along with the format, size, and frequency\
    \ data that was also read. This buffer is put into our dictionary using the soundId\
    \ to identify it later."
