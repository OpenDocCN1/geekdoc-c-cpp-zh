    X and Y axis to determine where the player moves the control stick. The D-pad
    supports basic left, right, up, and down commands. The rest of the controls on
    the face of the controller are made from simple buttons: Back, Start, A, B, X,
    and Y. These are quite simple with only two states, pressed and not pressed, which
    can be represented by a boolean variable. On the top of the controller are four
    shoulder buttons, the buttons nearest the face of the controller are simple buttons,
    but the back two are triggers. The triggers are special because they are not digital
    on/off buttons; they have a range of values from 0 to 1, depending on how hard
    they are pressed. All these controls together make quite a complicated gamepad,
    and many of classes will be needed to describe the different functionality of
    each type of control.


