    programming methodologies and practices try to improve the software development
    process.


    Pragmatic programming is the ability to finish a program satisfactorily within
    a desired timeframe. It is a development method that emphasizes creating a minimal
    version of the program as quickly as possible and iteratively developing this
    program until it starts to resemble the original version. Pragmatic programming
    has two main guidelines known as DRY and “Don’t Repeat Yourself,” and KISS for
    “Keep It Simple Stupid”; together these mean you should avoid duplicating code
    or functionality and you should avoid the temptation to over-complicate your programs.


    Source control is used to keep your code safe and allow multiple developers to
    work on the same project at the same time. Unit testing is the practice of writing
    small tests that confirm your code is working as expected. These small tests help
    document how the code base should be used and are also used to catch any bugs
    that might be introduced when making large changes to the code. These tools and
    guidelines help to make software creation easier and help to make the final product
    more elegant and robust.'
