  md: "# Pragmatic Programming 43\n\nDon't worry if you've noticed a bug; it's there\
    \ on purpose, promise! Run the tests and they should all pass. The code is verified,\
    \ the tests don't exhaustively cover all the code. For instance, there is a TestPlayerIsDead-WhenHasNoHealth\
    \ but not \"the player is not dead when health is greater than 0\". I'll leave\
    \ this one as a reader exercise.\n\nLet's say we are developing in this way and\
    \ get to the stage where we have a full working game. Then testing something strange\
    \ occurs; sometimes, when the player should die, he doesn't, and after that he's\
    \ invincible. This isn't what the game is supposed to work. All the tests are\
    \ passing, so that means the bug isn't being tested for. Doing some clever debugging,\
    \ it's discovered that the bug occurs when the player has low life, perhaps two\
    \ or less units of health, and is then hit a lot of times by a number of enemies.\n\
    \nIn unit testing, the first task is to write a test that reproduces the bug.\
    \ Once this test is written, the code can be fixed and the test can confirm it.\
    \ Here's a test that covers the bug.\n\n```\nclass PlayerTests\n{\n  bool TestPlayerShouldBeDead()\n\
    \  {\n    Player p = new Player();\n    p.Health = 2; // give him low health\n\
    \    // Hit him a lot, to reproduce the bug description\n    p.OnHit();\n    p.OnHit();\n\
    \    p.OnHit();\n    p.OnHit();\n    p.OnHit();\n    if ( p.IsDead())\n    {\n\
    \      return true;\n    }\n    return false;\n  }\n}\n```\n\nThis test is run,\
    \ and it fails. Now we've got a unit test that reproduces the bug. The code must\
    \ now be changed to pass this test. The death function seems a good place to fix\
    \ the bug."
