    # Summary


    Most games have a central loop that checks the player input, updates the game
    world, and then updates the screen. By default, C# does not have a central loop
    so some C functions are needed to be create a fast game loop useful for creating
    games. Additional functions are used to get access to timing information so each
    frame can be timed. This time can be used to ensure the game runs smoothly, on
    computers that run at different speeds.


    The Tao framework has a control SimpleOpenGLControl. This control allows OpenGL
    to be used easily within a Windows Form. A spinning triangle is often used as
    the “Hello World” program for OpenGL. The triangle is made up of three vertices
