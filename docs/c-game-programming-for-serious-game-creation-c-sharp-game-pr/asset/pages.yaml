- img_proc: true
  md: "Dot products are used in back face calling. This is a technique to see if some\
    \ polygon is facing away from the camera. By default, polygons are not double-sided;\
    \ they only have one side indicated by the normal. If the polygons face away from\
    \ the camera, they can't be seen. This means the graphics hardware doesn't need\
    \ to be told about them. The dot product can be used to filter out all the polygons\
    \ that are facing away from the camera.\n\n# The Cross-Product Operation\n\nThe\
    \ last vector operation to be covered is the cross-product. Unlike the previous\
    \ operations, this only works on vectors with three or more elements. This means\
    \ there is no cross-product operation for a simple X,Y vector. The calculation\
    \ is more complicated than previous operations but the results are quite intuitive.\
    \ The cross-product takes two vectors and returns a vector perpendicular to both.\
    \ If you have a table with one side from [0, 0, 0] to [0, 0, 1] and another side\
    \ from [0, 0, 0] to [1, 0, 0], then the resulting dot vector will be a vector\
    \ that is pointing upwards from the table's surface. The operation can be seen\
    \ in Figure 8.16.\n\nHere is the formula for calculating the cross-product.\n\n\
    ```\n$A = B \\cdot C$$\n\n$$A = \\begin{bmatrix} A_x \\ A_y \\ A_z \\end{bmatrix}\
    \ B = \\begin{bmatrix} B_x \\ B_y \\ B_z \\end{bmatrix} C = \\begin{bmatrix} C_x\
    \ \\ C_y \\ C_z \\end{bmatrix}$$\n\n$$A_x = B_yC_z - B_zC_y$$\\n\n$$A_y = B_zC_x\
    \ - B_xC_z$$\n\n$$A_z = B_xC_y - B_yC_x$$\n```\n\nThe formula looks rather intimidating;\
    \ fortunately, once it's converted to code it can pretty much ignored. When this\
    \ formula is used, you won't be thinking about the particular mechanics of the\
    \ code, just that you want a vector that points outwards from two cross-product\
    \ vectors.\n\n```\npublic Vector CrossProduct(Vector v)\n{\n  double nx = Y *\
    \ v.Z - Z * v.Y;\n```"
