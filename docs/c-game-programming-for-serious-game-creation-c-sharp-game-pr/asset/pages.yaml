  md: "```\nclass Player\n{\n  bool IsDead()\n  {\n    return Health <= 0;\n  }\n\
    ...}\n```\n\nIf the player has zero health or less, then he is dead. This causes\
    \ all the unit tests to pass, and we're now sure that this bug won't crop back\
    \ up without us knowing about it.\n\n# Test Driven Development\n\nThe method of\
    \ writing tests, skeleton code, and then making that code pass the test is called\
    \ Test Driven Development. Developing this code reduces bugs and you can have\
    \ faith in what your code actually does. This is very important if you're developing\
    \ a big project. It also encourages classes to be quite modular and self-contained.\
    \ This is because unit tests need to be small; therefore, you want to avoid having\
    \ to make 50 classes and setting them all up to run one simple test. For this\
    \ reason, lots of needless coupling between classes is avoided.\n\nThe other big\
    \ win on unit testing is refactoring. For instance, if the inventory system in\
    \ your game needs to be massively redesigned, then with unit testing you have\
    \ all the tests required to confirm you've replaced the system correctly.\n\n\
    With unit testing, you can confidently say your code is bulletproof. Unfortunately,\
    \ not everything can be tested; graphics are very hard to test and you just have\
    \ to assume the libraries such as OpenGL will work correctly.\n\n# Unit Testing\
    \ in C#\n\nThe best unit-testing software for C# is called NUnit (Figure 3.3).\
    \ It's free and easy to use.\n\nIn the following chapters, we'll download NUnit\
    \ and walk through the setup. All the code in the book is unit tested, but for\
    \ the sake of brevity, most unit-test code is left out of the examples.\n\n# Summary\n\
    \nWriting high quality software can be difficult; it's hard to write bug-free\
    \ software and it's hard to finish projects on time or even finish them at all.\
    \ Modern"
