  md: "The code isn't quite simple as before, but it now allows the engine to support\
    \ sprites with different textures. You might be thinking about the worst case\
    \ situation for this code; every sprite that’s drawn may force a texture change.\
    \ The way to avoid this is to sort out the things being drawn and ensure that\
    \ the maximum numbers of vertices that are using the same texture are sent together.\
    \ There is another way to minimize the number of texture changes. Instead of using\
    \ lots of separate small textures, textures are grouped together and combined\
    \ into a bigger texture; this is often referred to as a texture atlas. Sprites\
    \ can then reference this texture but change the U,V coordinates of their vertices\
    \ only use a small part of it (this is how the font rendering works). Generally,\
    \ if it's not a problem, don't try to fix it!\n\n# Adding Sound Support\n\nSound\
    \ is very easy to ignore, but it can change the feeling of how a game plays. Sound\
    \ is very easy to add using the excellent OpenAL library. Before worrying about\
    \ the details, think how a very simple sound library interface might work using\
    \ a code sketch.\n\n```\nsoundManager = new sound();\nsoundManager.Add(\"zap\"\
    , \"zap.wav\");\nzapSound = soundManager.Play(\"zap\")\nif (soundManager.IsSoundPlaying(\"\
    zap\")\n{\n    soundManager.StopPlaying(zapSound);\n}\n```\n\nThis code indicates\
    \ that a sound library should manage sounds in a similar way to the texture manager.\
    \ When a sound is played, a reference will be returned. The reference can be used\
    \ to control the sound; check if it's playing with the IsSoundPlaying method or\
    \ stop it with the StopPlaying method. It would also be nice to have looping sounds\
    \ and a volume control.\n\n# Creating Sound Files\n\nTo test the new sound code,\
    \ some sounds will be needed. Broadly speaking, games have two categories of sound:\
    \ sound effects like a gun shooting and background music or ambient sound."
