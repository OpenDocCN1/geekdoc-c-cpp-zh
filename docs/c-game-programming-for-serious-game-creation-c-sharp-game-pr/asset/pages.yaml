    off will give a better indication of the frames per second.


    # V-Sync and Frame-Rate


    V-Sync is short for vertical synchronization. The computer screen refreshes a
    certain number of times a second. V-Sync is an option that ensures that the frame
    buffer is filled only as fast as the screen can read it. This prevents artifacts
    like tearing, where the frame buffer changes as the data is being written to the
    screen causing a visual tearing effect.


    On some cards, V-Sync is turned on by default. V-Sync is the refresh rate of the
    monitor (how often the monitor updates its display). If your monitor refreshes
    at 60Hz and V-Sync is on, your fps counter will never exceed 60fps. This is fine
    of time, but when developing a game and profiling the frame-rate, it''s important
    to not have the frame-rate locked. It can usually be turned off


    ![](img/f072278b36284b101899ce4e4679e943_162_0.png)


