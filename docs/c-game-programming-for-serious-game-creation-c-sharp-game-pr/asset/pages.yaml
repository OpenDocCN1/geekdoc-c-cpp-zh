    # The Dot Product Operation


    The dot product is an operation that takes two vectors and returns a number. The
    number returned is related to the angle between the two vectors.


    > $A \cdot B = |A||B|cos(\theta)$


    The dot product used on vector A and B returns the length of A and B multiplied
    by the cosine of the angle between the vectors. This is shown graphically in Figure
    8.13. If vectors B and A are normalized, then their length values are 1 and the
    equation is simplified to $A \cdot B = cos(\theta)$. To retrieve the angle, the
    arccosine operation can be used. In C#, the arccosine function is Math.acos and
    it returns the angle in radians.


    The dot product operation is very good for determining if objects in the game
    are facing each other. It''s also very useful for testing if an object is on one
    side of a plane or the other; this is used in 3D games to ensure the character
    doesn''t walk through walls.


    The operation itself is very simple: all the elements from the first vector are
    multiplied by the second vector, then all these values are added together to


    ![](img/f072278b36284b101899ce4e4679e943_194_0.png)


    Figure 8.13

    The dot product operation.'
