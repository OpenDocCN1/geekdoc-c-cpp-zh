  md: "```\npublic Sound(int channel)\n{\n    Channel = channel;\n}\n```\n\nNow the\
    \ sound wrapper class is properly defined a PlaySound method can be added. A sound\
    \ has to be played on a channel. There are only a limited number of channels so\
    \ it is possible that all the channels are full. In this case the sound won't\
    \ be played. It is a very simple heuristic, but for games with hundreds of sounds\
    \ going off at once, it may be better to give each sound a priority and then the\
    \ sounds of high priority take over the channels of those sounds with a lower\
    \ priority. The priority value would probably be linked to the sound's volume\
    \ and distance from the player.\n\nA method needs to be written that determine\
    \ if a given channel is free or not. An easy way to determine if a channel is\
    \ free is to ask OpenAL if it is currently playing anything on that channel. If\
    \ nothing is played on the channel then it is free. This new IsChannelPlaying\
    \ method should be added to the SoundManager class.\n\n```\nprivate bool IsChannelPlaying(int\
    \ channel)\n{\n    int value = 0;\n    Al.GetSourcei(channel, Al.AL_SOURCE_STATE,\
    \ out value);\n    return (value == Al.AL_PLAYING);\n}\n```\n\nThe OpenAL getSourcei\
    \ queries a particular channel about some property. The property is determined\
    \ by the second argument; in this case we're asking what the current state of\
    \ the source is. The size and degree of the sound on the channel can also be queried\
    \ in this. The IsChannelPlaying function checks to see if the channel's current\
    \ state is playing; if it returns true, otherwise false.\n\nWith the IsChannelPlaying\
    \ function defined we can now use to build up another function that will return\
    \ a free channel. This function will be called GetNextFreeChannel and iterate\
    \ through the list of channels that the function DiscoverSoundChannels made in\
    \ the constructor. If it can't find a sound channel free it will return an error\
    \ flag."
