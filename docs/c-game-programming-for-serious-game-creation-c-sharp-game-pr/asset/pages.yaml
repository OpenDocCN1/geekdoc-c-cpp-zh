- img_proc: true
  md: "Here the game loop callback has been stored in a member variable, _callback,\
    \ for later use. The Application.Idle event has been given a handler, OnApplicationEnterIdle.\
    \ This will be called when the application begins to idle. The next part is a\
    \ bit trickier. The code needs to know if the application is still in the idle\
    \ state, and if it then needs to continuously call the loop callback. Read this\
    \ code to see how the callback will be called.\n\n```\nvoid OnApplicationEnterIdle(object\
    \ sender, EventArgs e)\n{\n    while (IsAppStillIdle())\n    {\n        _callback();\n\
    \    }\n    private bool IsAppStillIdle()\n{\n    Message msg;\n    return PeekMessage(out\
    \ msg, IntPtr.Zero, 0, 0, 0);\nn}\n```\n\nThe code calls the callback continuously\
    \ unless IsAppStillIdle returns false. IsAppStillIdle uses a new PeekMessage function\
    \ to check if the application has any important events that need to be dealt with.\
    \ If there are important messages for the application these need to be handled\
    \ before returning to the game loop.\n\nTo check if the application is idle, we\
    \ need to have a look at the Windows message queue. Windows has a big queue of\
