    \ game: the conversation system, world exploration, inventory management, a leveling\
    \ system, and combat.\n\n# Roguelike Games\n\nRoguelike games get their name from\
    \ their similarity to an early dungeon crawling game Rogue. Roguelikes nearly\
    \ all use the ASCII characters instead of graphics. Like text games, this means\
    \ more of the programmer's time can focused on the game instead of developing\
