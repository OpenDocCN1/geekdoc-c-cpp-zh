    {\n    Position = position;\n    Radius = radius;\n}\n```\n\n```\npublic void\
    \ Draw()\n{\n    // Determines how the circle will appear.\n    int vertexAmount\
    \ = 10;\n    double twoPI = 2.0 * Math.PI;\n```\n\n> // A line connects all the\
