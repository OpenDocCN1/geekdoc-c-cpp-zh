    \ draw calls, the slower the game will run.\n\nThe solution to this problem is\
    \ to draw as much as possible at once. Generally, this is known as batching. Instead\
    \ of the CPU talking to the GPU like “Draw this, now draw sprite, now draw sprite,”\
    \ it instead makes a list of all the sprites and says to the GPU, “Draw all these\
    \ sprites.” There is a lot less waiting so"
