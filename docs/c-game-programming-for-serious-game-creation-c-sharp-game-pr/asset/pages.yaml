  md: "# Chapter 6 = Game Structure\n\nThe DevIL library was written to complement\
    \ OpenGL so it has a very similar interface. An image is generated and then bound.\
    \ Binding an image means all subsequent operations will affect image. ilLoadImage\
    \ is called, which loads the texture data into memory. iluFlipImage is called\
    \ on the image, and flips it over the Y axis; most of the common image formats\
    \ need to be flipped to work correctly with OpenGL. The image is then queried\
    \ for width and height information. Finally, the DevIL utility library is used\
    \ to bind the texture to an OpenGL id. Id, width, and height are all wrapped in\
    \ the texture class, which is then returned. Devstl has the texture data in memory;\
    \ this freed using ilDeleteTextures, as the data has now moved from DevIL to OpenGL.\n\
    \nTesting the TextureManager requires a texture. A TIF image file, called face,\
