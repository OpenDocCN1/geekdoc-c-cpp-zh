    \   }\n    }\n    Gl.glEnd();\n}\n```\n\nThis is the current render code. It is\
    \ executed once for each sprite. The problem with the above code is that every\
    \ time glEnd is called, everything is sent to the graphics card and then the CPU\
    \ stops; does nothing until the graphics card sends back a message saying it received\
