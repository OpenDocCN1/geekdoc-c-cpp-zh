  md: '# CHAPTER 1


    # THE HISTORY OF C#


    C# is a modern object-oriented language developed by a Microsoft team led by Anders
    Hejberg. The Common Language Runtime, or CLR for short, is the virtual machine
    on which C# runs. Many languages run on the CLR and this means they can all be
    compiled and used on Windows PCs, the Xbox 360, and the Zune. The CLR is owned
    and developed by Microsoft, but there is also an open-source version of the CLR
    called Mono. Using Mono, C# programs can be run on Macs, Linux, or any other system
    for which C# can be compiled.


    In the game industry, we use C++, but it''s not because we want to. C++ is a sprawling
    language with lots of areas that can trap an unwary programmer and many areas
    that are simply undefined. C# is much friendlier than C++ and it''s far more fun
    to use for writing games.


    # C# Basics


    C# was first announced in July 2000 at the Microsoft Professional Developers Conference
    in Orlando. At the time it was a little like the Microsoft version of Java, but
    it rapidly developed into something much different. C#''s most recent updates
    are very innovative and exciting.


    Modern languages like C# and Java make programs that run on virtual machines.
    Older language like C++ and C make programs that run directly on the hardware
    of a specific machine. The hardware that runs the program is called the central
    processing unit, or CPU for short. This is the brain of the computer.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Chapter 1 = The History of C#


    Modern Macs and PCs generally have an x86 CPU; the XBox 360 has a Xenon CPU; and
    the PS3 has a Cell CPU. All of these brains are slightly different but share the
    same basic purpose—to run the programmers write. Programs are just lists of instructions.
    The instructions a particular CPU understands are machine code. Machine code for
    one CPU is unlikely to be understood by a different type of CPU.


    Compilers take human-readable source code, written in a language like C++ or C,
    and compile it into machine code. For example, the PlayStation 3 C++ compiler
    compiles source code into machine code that can run on the Cell CPU. To run the
    same C++ code on the Xbox 360 Xenon CPU, it must be compiled again using the Xbox
    360 C++ compiler. C# doesn''t work like this. C# compiles down to an assembly
    language called the common intermediate language or CIL IL then runs on a virtual
    machine that generates the machine code for the particular system. In the PlayStation
    3 case that would mean to run C# on the PlayStation, it would need a virtual machine
    that could CIL code and output machine code that the Cell CPU understands. This
    difference between using virtual machines and languages that compile directly
    to machine code is shown in Figure 1.1.


    C#s virtual machine, the CLR, has many advantages. The biggest advantage is you
    only need to write the code once and it will run on every CPU that supports the


    ![](img/f072278b36284b101899ce4e4679e943_12_0.png)


    Figure 1.1

    Virtual machines and directly compiled code.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# C# Basics


    CLR. It''s very hard to crash the system using C# because the system is insulated
    by this virtual machine. The virtual machine can catch errors before sending them
    to the real hardware. Also you don''t need to worry about allocating and freeing
    memory as this is done automatically. Programming languages can be mixed and matched
    provided they all compile to the CLR; languages as F#, IronLisp, IronRuby, IronPython,
    and IronScheme all be used in a single program. As a game programmer could write
    your AI in a high-level, AI-friendly language and your graphics code in a more
    procedural C-like language.


    # Versions of C#


    C# is regularly updated with new functionality and improvements. Even if you have
    programmed in C# before you may not be aware of all the new features added to
    the language in recent updates.


    # C# 2.0


    C# version 2.0 added generics and anonymous delegates. It''s easiest to explain
    these new features with examples.


    # Generics


    Generics are a way of writing code to use some general object with some general
    properties, rather than a specific object. Generics can be used with classes,
    methods, interfaces, and structs to define what data type they will use. The data
    used with generic code are specified at compile time, which means the programmer
    no longer has to be responsible for writing test code to check that the correct
    data type is being used. In this turn makes the code shorter because test code
    doesn''t need to be written, and because it reduces mismatch errors at run time.
    Generic code also tends to be faster because less casting between data types has
    to be performed.


    The following code is written without use of generics.


    ```

    ArrayList _list = new ArrayList();

    _list.Add(1.3); // boxing converts value type to a reference type

    _list.Add(1.0);


    //Unboxing Converts reference type to a value type.

    object objectAtPositionZero = _list[0];

    double valueOne = (double) objectAtPositionZero;

    double valueTwo = (double) _list[1];

    ```'
  merge: -1
