    # Display Methods


    Games, for the most part, fall neatly into two categories: 2D games like Super
    Mario, Tetris, and Pokémon and 3D games like Quake, Fallout 3, and Grand Theft
    Auto. 2D games tend to be easier to program.


    # 2D Games


    2D games have been covered quite extensively in this book so you should already
    have a good head start if your game is 2D based. 2D games often suggest pixel
    art style graphics, but this doesn’t have to be the case; there is still a lot
    of room for innovation in presenting a 2D game. The graphics could appear like
    cut-out pieces of paper, cartoon drawings, vector graphics (using GL_LINE drawing
    mode), abstract, or silhouette (Silhouette graphics have the great advantage that
    they are much easier to draw). The involved with 2D games tends to be simpler
    than a 3D game, but it really depends on the specific game. Most programmers experiment
    with 2D games before learning about 3D game programming, and a lot of game development
    knowledge is independent of whether the game is developed in 2D or 3D.


    # 3D Games


    One of most important skills for a game programmer is the ability to independently
    research and learn about new programming and development techniques. Sometimes
    a game idea demands a new unfamiliar technology (for instance you may wish to
    have a rope in your game in which case you need to research a way for this to
    be simulated); other times you may learn a new'
