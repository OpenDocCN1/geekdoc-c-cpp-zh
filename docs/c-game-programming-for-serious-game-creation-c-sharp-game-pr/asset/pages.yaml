  md: "# Types of Games 407\n\nlong enough that it gives enough time for the new level\
    \ to be loaded before the player emerges from it. Dog legs don't have to be corridors;\
    \ they can also be mountain passes or a narrow alleyway between tall buildings.\n\
    \nA top-down camera doesn't suffer as much from the world problems as an FPS or\
    \ third-person camera view, because the camera only looks at a small chunk of\
    \ the world. A player with an FPS camera can look to the horizon and see vast\
    \ trails of the land; this is not the case with the top-down camera. There is\
    \ always quite a small fixed area around the player. This makes loading and unloading\
    \ chunks of a level easier. Top-down views also do quite well with tile-based\
    \ approach, but instead of each tile being a sprite, each tile is a 3D mesh that\
    \ matches its surrounding 3D tiles. This makes it much faster to make levels;\
    \ a few chunks can be modeled and then attached together to form a level fairly\
    \ quickly.\n\n# Platform Games\n\nPlatform games are very popular for amateur\
    \ and independent game developers. There is a little math involved, but it tends\
    \ to be quite simple, and there are a lot of different gameplay ideas that can\
    \ be explored in the 2D platformer world. Most platformer games use a tile approach\
    \ similar to the approach discussed in the role-playing section.\n\nPlatform games\
    \ usually require a small degree of physics modeling; gravity never needs modeling.\
    \ The physics can be written using the basic equations of velocity and acceleration,\
    \ or by using a third-party physics library, such as a Box2d (there is a C# port\
    \ called Box2dx). If you decide to code everything by hand, then you can get something\
    \ up and running quickly with the sprite classes and simple rectangle-rectangle\
