  md: "```\nprivate int FindNextFreeChannel()\\n{\n    foreach (int slot in _soundChannels)\\\
    n    {\n        if (!IsChannelPlaying(slot))\n        {\n            return slot;\n\
    \        }\n    }\n    return -1;\n```\n\nThis function finds a free channel for\
    \ our sounds to be played on. This makes it easy to write a robust PlaySound method\
    \ that will be able to deal with a limited number of sound channels.\n\n```\n\
    public Sound PlaySound(string soundId)\\n{\n    // Default play sound doesn't\
    \ loop.\\n    return PlaySound(soundId, false);\n}\npublic Sound PlaySound(string\
    \ soundId, bool loop)\\n{\n    int channel = FindNextFreeChannel();\\n    if (channel\
    \ != -1)\\n    {\n        Al.alSourceStop(channel);\n        Al.alSourcei(channel,\
    \ Al.AL_BUFFER, _soundIdentifier[soundId]);\\n        __bufferId);\n        Al.alSourcei(channel,\
    \ Al.AL_PITCH, 1.0f);\n        Al.alSourcei(channel, Al.AL_GAIN, 1.0f);\n    }\n\
