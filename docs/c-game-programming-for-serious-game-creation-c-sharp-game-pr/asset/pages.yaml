    \ The glDrawArrays method is called; this takes in a type, a stride, and the number\
    \ of vertices to draw. The GL_TRIANGLES, as each sprite is made from two triangles\
    \ and this is how the vertex information should be interpreted. The stride is\
    \ zero. The stride is how memory to skip after each vertex. Sometimes for efficiency\
    \ reasons vertex information is all packed together in one continuous stretch\
    \ of memory. The stride ensures the irrelevant bits can be skipped over. In the\
    \ batch, all the data is relevant no stride is needed. The final argument is how\
