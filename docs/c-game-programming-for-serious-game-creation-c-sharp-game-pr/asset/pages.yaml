  md: "# Chapter 6 = Game Structure\n\n```\nprivate void Setup2DGraphics(double width,\
    \ double height)\n{\n    double halfWidth = width / 2;\n    double halfHeight\
    \ = height / 2;\n    gl.MatrixMode(GL.GL_PROJECTION);\n    glLoadIdentity();\n\
    \    glOrtho(-halfWidth, halfWidth, -halfHeight, halfHeight, -100, 0);\n    gl.MatrixMode(GL.GL_MODELVIEW);\n\
    \    glLoadIdentity();\n}\n```\n\nThis code has a lot of new OpenGL functions,\
    \ but they're all straightforward. OpenGL has a number of matrix modes. The value\
    \ GL_PROJECTION changes the OpenGL state. Once the state is changed, all OpenGL\
    \ commands will affect the projection matrix. This matrix can now be altered to\
    \ set an orthographic projection matrix.\n\nglLoadIdentity clears the current\
    \ projection information. The next command glOrtho sets up an orthographic projection\
    \ matrix. There are six arguments for this function.\n\n```\nvoid glOrtho(GLdouble\
    \ left,\nGLdouble right,\nGLdouble bottom,\nGLdouble top,\nGLdouble nearVal,\n\
    GLdouble farVal);\n```\n\nThe first four arguments describe how big you want the\
    \ view of the world to be. Figure 6.4 shows the orthographic projection and how\
    \ the six arguments affect it. At the moment, the origin is in the center of the\
    \ screen. I've decided to make the origin the top-left, you could write the following.\n\
    \n```\nglOrtho(0, width, -height, 0, -100, 0);\n```\n\nThe final two values are\
    \ the near and far planes. If the z position of a vertex is greater than the far\
    \ plane, the vertex isn't rendered. If it's lower than the near plane, then it\
    \ also isn't rendered. Generally, 2D graphics have the z position set to 0 so\
    \ the near and far planes don't really matter. They're much more important for\
    \ rendering 3D graphics.\n\nThe setup function can be called in the Form.cs constructor."
