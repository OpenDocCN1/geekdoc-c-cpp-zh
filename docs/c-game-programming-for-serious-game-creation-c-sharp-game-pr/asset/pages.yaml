  md: "# Implementing a Fast Game Loop in C#\n\n```\n{\n}\n\n```\n\nIn C#, functions\
    \ can be stored as variables by using a delegate that defines the function signature—what\
    \ the function returns and what parameters it takes. In this case, a delegate\
    \ is used to define a function type with no return value or parameters; it's named\
    \ LoopCallback. FastLoop has one constructor that takes the callback. The callback\
    \ will be called every frame to allow the game to update itself.\n\nAll C# forms\
    \ programs have a static class called Application. This class represents the program\
    \ and its settings. It can also be used to modify a program so that it can be\
    \ used in real-time.\n\nA program can have a large number of events to handle;\
    \ the user might be maximizing the form or Windows may be shutting down. The Application\
    \ is the part of the code that handles all these events. When it has no events\
    \ to handle, it calls a callback Application.Idle. This means it's about to enter\
    \ idle time. This idle time, when the application is busy, when the game logic\
    \ needs to be updated. To use the Application code, using System.Windows.Forms\
    \ need to be added near the top of the file.\n\n```\nusing System.Windows.Forms;\n\
    namespace GameLoop\n{\n    public class FastLoop\n    {\n        public delegate\
    \ void LoopCallback();\n        LoopCallback _callback;\n\n        public FastLoop(LoopCallback\
    \ callback)\n        {\n            _callback = callback;\n            Application.Idle\
    \ += new EventHandler(OnApplicationEnterIdle);\n        }\n        void OnApplicationEnterIdle(object\
    \ sender, EventArgs e)\n        {\n        }\n    }\nn\n```"
