  md: "```\nprivate float MapMinusOneToOne(short value)\n{\n    float output = ((float)value\
    \ / short.MaxValue);\n\n    // Be careful of rounding error\n    output = Math.Min(output,\
    \ 1.0f);\n    output = Math.Max(output, -1.0f);\n\n    if (Math.Abs(output) <\
    \ _deadZone)\n    {\n        output = 0;\n    }\n\n    return output;\n}\n```\n\
    \nSDL represents analog controls using axes that can be polled with SDL_JoystickGetAxis.\
    \ The control sticks are made from two axes. A controller might have a number\
    \ of different axes, so in the constructor, two indices are passed to identify\
    \ which axis we want this control stick to represent. These identifying numbers\
    \ will change for each type of controller. The different controls on the gamepad\
    \ aren't guaranteed to be the same for every type of gamepad. One gamepad's left\
    \ control stick might have the one index, but another type of gamepad might index\
    \ the left control stick with the index five. For this reason, it's a good idea\
    \ to allow the player remap his controls.\n\nThe Update method is called once\
    \ per frame, and it updates the X and Y values from -1 to 1, depending on the\
    \ position of the stick. There's also a little buffer for the dead zone that ignores\
    \ small movements of the control stick.\n\nThe Xbox controller has two control\
    \ sticks so the controller class can now be updated to represent this.\n\n```\n\
    public ControlStick LeftControlStick { get; private set; }\npublic ControlStick\
    \ RightControlStick { get; private set; }\npublic XboxController(int player)\n\
    {\n    _joystick = SDL.SDL_JoystickOpen(player);\n```"
