  md: '# Appendix A ■ Recommended Reading


    It covers how to write tight, clean code that is easy to extend and debug. There
    is a slight C++/C focus, but the vast majority of the book is applicable to C#
    or any other programming language.


    # ## The C# Language and Software Architecture


    Readers of these books are assumed to be familiar with C# or a similar language;
    therefore, their suggested aim is to provide a deeper understanding. Software
    Architecture is a term used to describe the design and structure of computer programs;
    where the code is broken up into parts and how those parts communicate.


    CLR via C#, 3rd Edition (ISBN-13: 978-0375627048) by Jeffrey Richter


    The focus of this book is not C*; rather, the virtual machine that C# runs on.
    Understanding this virtual machine will help greatly when you desire to improve
    the speed and efficiency of your C# programs.


    Head First Design Patterns (ISBN-13: 978-0596007126) by Eric T Freeman, Elisabeth
    Robson, Bert Bates, and Kathy Sierra


    The usual recommended book for design patterns is Design Patterns : Elements of
    Reusable Object-Oriented Software, but it is a very dry book. Head First Patterns
    is much more readable and entertaining. Design patterns are small descriptions
    of how to write code to solve some common challenges in software development.
    It''s worth understanding these patterns to see how other people are approaching
    design problems and also to be able to understand what people are referencing
    when criticizing the overuse of the Singleton pattern or suggesting the use of
    a Decorator pattern. The book uses Java to explain the patterns, but it is quite
    simple to convert the examples to C#.


    # ## Math and Graphics Programming


    If you want to expand your knowledge of mathematics and graphics programming,
    these two books are a good starting point.


    3D Math Primer for Graphics and Game Development (ISBN-13: 978-1556229114) by
    Fletcher Dunn and Ian Parberry


    I''ve worked with and visited quite a number of different game studios, and it''s
    quite common to see this book lying on top of somebody''s desk. The book covers
    all the mathematics needed to understand the fundamentals of 3D games work. It
    is more approachable than nearly any other'
  merge: -1
  pgno: 413
