    \ of the game world, and finally updates all the pixels on the screen.\n\n# A\
    \ Closer Look at the Game Loop\n\nGame code is not just responsible for updating\
    \ the graphics on the screen; it has two other important tasks to do. It must\
    \ take input from the user as “If the user is pressing button B, then make the\
    \ character jump,” and it must update the game world, “If the player has just\
    \ killed the boss, then go to the credits.”\nAll games follow a similar pattern.\n\
