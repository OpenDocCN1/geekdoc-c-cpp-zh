    \ the second spaceship sprite, which has both correct dimensions and the correct\
    \ texture.\n\nThe problem here is that the OpenGL is never being told the texture\
    \ changes. If it doesn't know, it uses whatever texture was set last. In the game\
    \ loop a lot of texture changing per frame can slow things down, but a moderate\
    \ amount of texture changing is nothing to worry about and indeed essential for\
    \ most games.\n\nThe class that needs to be modified is the Renderer class. The\
    \ Renderer class batches all the sprites so they can be sent to the graphics card\
    \ all at once. At the moment the Renderer class doesn't check which texture sprite\
    \ uses. It needs to check if it's drawing something with a new texture. If it\
    \ is, then it can tell OpenGL to draw whatever has been batched so far with the\
    \ old texture and then start a new batch using this new texture.\n\nHere's the\
    \ current Renderer.DrawSprite code.\n\n```\npublic void DrawSprite(Sprite sprite)\n\
    {\n    _batch.AddSprite(sprite);\n}\n```"
