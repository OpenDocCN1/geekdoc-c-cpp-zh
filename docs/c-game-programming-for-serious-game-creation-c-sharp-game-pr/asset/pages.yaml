  md: 'next. An overworld map generally indicates all the levels as linked by paths.
    Such a system has been used in some of the Super Mario games. An overworld map
    makes it very easy to introduce secret paths and levels that are discovered by
    doing particularly well in the previous level.


    +   If the player is hit by an enemy spaceship or bullet, the PlayerCharacter
    dies and it''s game over. It would be preferable to give the player some margin
    for error, perhaps by giving the spaceship some health—allowing it to take damage
    like the enemies. The health could be represented by a health bar on screen that
    goes down each time ship takes a hit. You may also want to introduce the concept
    of lives—the player starts with several lives, allowing each one more go before
    the game is lost.


    +   As levels progress, they tend to get more difficult. To help the player, you
    could give him better weapons and items to repair any damage to his ship. In scrolling
    shooting games, power-ups and other items tend to be dropped by enemies. A new
    item class needs to be created, and it can be added to the scene (possibly via
    the EntityManager) to be picked up by the player. A health pack can repair some
    amount of damage the player has received. New weapons can deal more damage or
    perhaps there can be two bullets every time the player shoots instead of one.


    +   You could also add alternate weapons that are triggered by different buttons.
    Bombs or lasers, for instance, could be secondary weapons that have a limited
    number of shots.


    +   RPG elements are a very popular way to add a greater degree of depth. Enemies
    could drop money (or scrap could later be for money). After each level the player
    could buy new weapons, upgrade existing ones, or even buy a new type of ship.
    You may even want allow players to place weapons at different locations on the
    ship by altering the PlayerCharacter.


    +   The RPG elements could taken even further by adding a layer of narrative to
    the game. This could be done during the level with text boxes and scripted movements
    of enemies and the player. Story elements could also be added to an overworld
    map or after each level.'
