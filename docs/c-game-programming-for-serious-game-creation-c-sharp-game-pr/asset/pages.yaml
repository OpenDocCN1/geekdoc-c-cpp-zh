  md: '# CHAPTER 10


    # A SIMPLE

    SIDE-SCROLLING

    SHOOTING GAME


    This chapter will describe a simple game, develop a basic plan, and then cover
    its implementation. The implementation will be done in a pragmatic iterative style.
    A high-level first pass will get the game structure working. This will then be
    refined until it approaches the original description of the game.


    # A Simple Game


    A simple game will demonstrate all the techniques that have been covered so far.
    We''ll build a 2D scrolling shooter game. This type of game is quite simple to
    make and then extend by adding more features. The pragmatic way to develop this
    game is to create a working game as quickly as possible, but it''s still important
    to plan up what the first stages will be. Figure 10.1 shows a high-level overview
    of the game flow.


    The idea for this game is to create a simple yet complete game. Therefore, there
    will be a start screen, then an inner game, and finally a game over screen. The
    inner game will have a spaceship the player can move. The player should be able
    to press a button to fire a bullet that comes out of the front of the ship. There
    only needs to be one level, but more would be nice. The level will begin when
    the player goes from the start state to the inner game. After a set amount of
    time, the level ends. If the player is still alive at the end of the level, then
    that counts as a win; otherwise, the player loses the game. The level needs a
    number of enemies that advance towards the player and are able to shoot bullets.
    Enemies'
