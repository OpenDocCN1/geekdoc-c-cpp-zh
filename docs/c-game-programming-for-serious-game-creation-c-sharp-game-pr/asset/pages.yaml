  md: "# Chapter 5 = The Game Loop and Graphics\n\nCreate a new class called PreciseTimer.\
    \ It's not a big class, so here's the code all in one go. Have a look through\
    \ it and try to work out what it's doing.\n\n```\nusing System.Runtime.InteropServices;\n\
    namespace GameLoop\n{\n    public class PreciseTimer\n    {\n        [System.Security.SuppressUnmanagedCodeSecurity]\n\
    \        [DllImport(\"kernel32\")\n        private static bool QueryPerformanceFrequency(ref\
    \ long PerformanceFrequency);\n\n        [System.Security.SuppressUnmanagedCodeSecurity]\n\
    \        [DllImport(\"kernel32\")\n        private static bool QueryPerformanceCounter(ref\
    \ long PerformanceCount);\n\n        long _ticksPerSecond = 0;\n        long _previousElapsedTime\
    \ = 0;\n        public PreciseTimer()\n        {\n            QueryPerformanceFrequency(ref\
    \ _ticksPerSecond);\n            GetElapsedTime(); // Get rid of first rubbish\
    \ result\n        }\n\n        public double GetElapsedTime()\n        {\n   \
    \         long time = 0;\n            QueryPerformanceCounter(ref time);\n   \
    \         double elapsedTime = (double)(time - _previousElapsedTime) / (double)_ticksPerSecond;\n\
    \            _previousElapsedTime = time;\n            return elapsedTime;\n \
    \       }\n    }\n}\n```\n\nThe QueryPerformanceFrequency function retrieves the\
    \ frequency of the high-resolution performance counter. Most modern hardware has\
    \ a high-resolution timer; this function is used to get the frequency at which\
    \ the timer increments. The QueryPerformanceCounter function retrieves the value\
    \ of the high-resolution performance counter. These can be used together to time\
    \ how long the last frame took."
