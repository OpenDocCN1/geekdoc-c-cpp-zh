    \ set; }\npublic float Y { get; private set; }\n```\n\n```\npublic ControlStick(IntPtr\
    \ joystick, int axisIDX, int axisIDY)\n{\n    _joystick = joystick;\n    _axisIDX\
    \ = axisIDX;\n    _axisIDY = axisIDY;\n}\n```\n\n```\npublic void Update()\n{\n\
    \    X = MapMinusToOneToOne(SDL.SDL_JoystickGetAxis(_joystick, _axisIDX));\n \
