    \ Files. Select face.tif. The final step is to select the face.tif in the solution\
    \ explorer, right-click, and select Properties, as shown in Figure 6.8.\n\nA number\
    \ of fields are displayed describing the properties of the image file. Change\
    \ the field Copy To Output Directory to Copy If Newer. This will copy the image\
    \ file over the bin directory, and once you run the program, the file will always\
    \ be in the correct place. Adding the image file to the project isn't necessary,\
    \ but it's a simple way to keep track of the assets and to make sure they are\
    \ put in the right places.\n\nThe TextureManager object can be created in the\
