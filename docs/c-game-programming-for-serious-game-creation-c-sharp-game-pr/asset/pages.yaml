    The cross-product is very useful for working out the normal of a surface. For
    instance, you may have a train that you want to move forward in the 3D world.
    The train could be at any angle, so it''s hard to know what forward means. First,
    you really need a normal vector that faces the same way as the train. If you found
    a polygon facing the way you want, the cross-product of two sides of this polygon
    will give you a vector that is facing outward from it along the train, as shown
    in Figure 8.17. This vector can be normalized by some scalar so it is just a direction.
    This direction multiplied by some scalar can be added to the train''s position
    and it will move forward that scalar amount.


    ![](img/f072278b36284b101899ce4e4679e943_198_0.png)


    The vector A x B is perpendicular to the plane A and B lie on.


    The surface normal of the table can be found by taking the cross product of its
    width and length.


    Figure 8.16

    The cross-product operation.'
