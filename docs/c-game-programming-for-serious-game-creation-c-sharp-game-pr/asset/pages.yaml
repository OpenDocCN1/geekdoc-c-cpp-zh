    \n# Improving Input\n\nThe engine has very limited input support at the moment.\
    \ The input class can be queried to find the mouse cursor position, but there\
    \ is no other support. The ideal input for arcade-style games is a gamepad—a purpose-built\
    \ piece of hardware to play games. First-person shooter games, strategy, and simulation\
    \ games tend to work best with mouse and keyboard combination. For this reason\
    \ the mouse should be more fully supported by the engine and the state of keyboard\
    \ should also be queryable.\n\n# Wrapping Game Controllers\n\nFor arcade games\
    \ there is no better controller than a gamepad. PCs have always been behind the\
    \ curve when compared to console controllers, but recent console controllers have\
    \ begun to use USB connections. This makes it very easy to add support for console\
    \ controllers on the PC. These controllers also tend to be the most popular for\
    \ users as they're high quality, widely supported, and very easy to find.\n\n\
    Controller support in the TaoFramework is good but not excellent. There is support\
    \ for control sticks and analog buttons but no support for haptic effects like\
    \ rumble or more exotic controllers like the Wiiemote. External C# libraries for\
    \ these newer controls exist if they tickle your interest but they will require\
    \ some research to use.\n\nThe controller support in this engine will be limited\
    \ to the more standard controllers. For PC gamers the most popular controller\
    \ is likely to be the Xbox 360 controller because it's immediately recognized\
    \ by Windows and has a large selection of buttons and control sticks. The gamepad\
    \ code will be flexible enough that any standard joypad could be used, for testing\
    \ purposes, it's the Xbox 360 pad that will be targeted. It can be seen in Figure\
    \ 9.12."
