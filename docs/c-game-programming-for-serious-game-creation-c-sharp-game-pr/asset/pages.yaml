  md: '# INTRODUCTION


    I want to help you make your game.


    Everyone has a great game idea, but the path from initial idea to finished product
    is not a clear one. There are an intimidating number of programming languages,
    libraries, and production methods. Even experienced game developers often fail
    to realize their vision. Without a good solid architecture, game code may become
    so complicated that a developer drowns in the complexity. The more complex the
    code, the harder the game becomes to change or continue developing.


    This book shows how to write simple, clean, reliable code by developing two basic
    games. These games are built using the C# programming language and OpenGL. C#
    is a modern, high-level programming language, so writing code is faster, with
    fewer programming warts to avoid. OpenGL is as close as the game industry has
    to a standard way to display graphics. When the book is finished, you''ll have
    an excellent code base to develop and grow, pursuing your own ideas.


    In the first part of the book you''ll find a broad overview of the methodologies
    and libraries used to build great games. The second part introduces how to use
    these libraries and how to create your own reusable game library. You''ll learn
    how to develop a simple scrolling shooter game, and then you''ll be provided with
    some suggestions and tips for developing your own game idea. The included CD has
    everything that you will need to start developing games. Every code snippet in
    the book has the full source code and program included on'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'the CD. There are also some simple game assets and a collection of links to
