    responsible for plotting the graph. It uses the sample rate to work out how space
    the vertices so that any line will totally fill the graph length. There are two
    common ways to define angles: degrees and radians. Degrees are commonly known;
    a full circle is 360°, and a half circle is 180°. Radians are measurement of using
    Pi, a full circle is twice Pi, and a half circle is Pi. The C# Sin and Cos functions
    expect to be given an angle in radians; for this reason, the 0-1 value of X is
    scaled by Pi when the Y values are being calculated.


