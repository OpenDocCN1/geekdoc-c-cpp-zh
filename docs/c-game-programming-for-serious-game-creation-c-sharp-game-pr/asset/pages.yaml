    \ as the dead zone and can vary from controller (for this reason it's best to\
    \ be a little generous when specifying your dead zone).\n\nThe control stick is\
    \ treated as two axes—an X axis from left to right and a Y axis from top to bottom.\
    \ SDL returns the axis information as short number value but a more convenient\
    \ representation would be a float from -1 to 1. The -1 value is the control stick\
    \ pushed far to the left (or down) and 1 would be fully pushed in the opposite\
    \ direction.\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Ling;\n\
    using System.Text;\nusing Tao.Sdl;\n```\n\n```\nnamespace Engine\npublic class\
