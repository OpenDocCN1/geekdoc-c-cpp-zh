  md: 'side of t are used in the calculation, as are their two neighbors, as shown
    in Figure 10.16.


    Once some position can be obtained for a value of t (0-1) between two neighboring
    points, then this can be extended so that t (0-1) can be mapped on the entire
    line, not just one section. The calculation to get a position from t and four
    points is as follows:


    ```

    f(t) = 0.5 *[t^3 t^2 t 1] * \begin{bmatrix} -1 & 3 & -3 & -1 \ 2 & -5 & -4 & -1
    \ -1 & 0 & 1 & 0 \ 0 & 2 & 0 & 0 \end{bmatrix} \begin{bmatrix} P0 \ P1 \ P2 \
    P3 \end{bmatrix}

    ```


    This looks a little intimidating; three matrices are multiplied by a scalar that
    weighs all four points and decides how the t value is transformed into a position.
    It’s not important to understand exactly how this works (though you are encouraged
    to investigate!); it’s good enough to know what results will occur when you apply
    it.


    Here is the C# implementation of a Catmull-Rom spline. This class should be added
    to the Engine project as it will be useful for more than this project. The spline
    code works in 3D so it can also be useful for tasks such as manipulating cameras
    or moving 3D entities along a path. The interface for spline class


