  md: "```\n{\n  return false;\n}\npublic void stopSound(Sound sound)\n{}\n```\n\n\
    Sound hardware can only play a limited number of sounds at the same time. The\
    \ number of sounds that can be played is known as the number of channels. Modern\
    \ sound hardware often open up to 256 sounds at the same time. The OpenAL way\
    \ to discover how many sound channels are available to keep requesting channels\
    \ and when the hardware can't give any more, then you have the maximum number.\n\
    \n```\nreadonly int MaxSoundChannels = 256;\nList<int> _soundChannels = new List<int>();\n\
    ```\n\n```\npublic void SoundManager()\n{\n  Alut.alutInit();\n  DiscoverSoundChannels();\n\
    }\n```\n\n```\nprivate void DiscoverSoundChannels()\n{\n  while (_soundChannels.Count\
    \ < MaxSoundChannels)\n{\n    int src;\n    Al.alGenSources(1, out src);\n   \
    \ if (Al.alGetError() == Al.AL_NO_ERROR)\n    {\n      _soundChannels.Add(src);\n\
    \    }\n    else\n    {\n      break; // there's been an error - we've filled\
    \ all the channels.\n    }\n  }\n}\n```"
