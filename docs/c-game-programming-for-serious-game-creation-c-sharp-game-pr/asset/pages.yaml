  md: "# Developing the Inner Game 323\n\nParallax is another one of these cues; simply\
    \ put, objects further from the viewer appear to move slower than those closer\
    \ to the viewer. Think of driving in a car with a large mountain in the distance.\
    \ The mountain appears to move very slowly, but trees next to the road fly past.\
    \ This is a depth cue, and the brain knows that the mountain is far away.\n\n\
    Parallax is easy to fake. A fast scrolling star field appears to have stars close\
    \ to the spaceship; another background moving more slowly appears to have stars\
    \ far away. The background classes merely need to move at different speeds, and\
    \ this gives the background a feeling of depth.\n\nThe background objects need\
    \ to be rendered and updated. This requires more code changes.\n\n```\npublic\
    \ void Update(double elapsedTime)\n{\n  _background.Update((float)elapsedTime);\n\
