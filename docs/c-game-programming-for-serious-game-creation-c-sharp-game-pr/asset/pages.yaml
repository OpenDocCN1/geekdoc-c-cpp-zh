  md: '# Chapter 10 = A Simple Side-Scrolling Shooting Game


    each enemy a predefined path with a number of way points. The enemy will hit all
    the way points and then exit to the left.


    A path can be described easily as a series of points that lead from the right
    of the screen to the left of the screen. Figure 10.13 shows a path made up of
    points that could describe an enemy''s path through the playing area.


    This path can be joined together to produce something like Figure 10.14. This
    shows the path the enemy would use, but the corners are very jagged. It would
    be nice if we could get something smoother. Splines are a nice way of creating
    smooth paths. Figure 10.15 shows a Catmull-Rom spline; this type of spline is
    guaranteed to pass through all the control points. Edwin Catmull who worked at
    Pixar and helped create Toy Story co-invented this type of spline with Raphael
    Rom.


    The spline is obviously smoother, but it does require another class to be created.
    Splines are a mathematical description of a curve.


    Catmull-Rom splines are simply a way to get a position, t, between any two of
    the points that make up the spline. In Catmull-Rom splines, the two points on
    either


