  md: '# CHAPTER 1 1


    # CREATING YOUR\OWN GAME


    It''s very likely you are reading this book because you have some great ideas
    for games and want to learn how to turn those ideas into programs. This chapter
    offers general advice on game creation and covers some challenges that particular
    game genres experience and how to approach them.


    This is a very broad whirlwind tour of game creation, touching on some of the
    more interesting problems you''ll encounter as you start programming. There are
    some suggested steps for writing games, code snippets for algorithms, and on the
    CD, you''ll find a list of resources and further reading for all the game types
    listed here.


    # Project Management


    Writing games is fun and rewarding, but finishing a game project is much harder.
    This section will cover the approach to take when developing a project. It''s
    important to know when to abandon a game project and when to soldier and finish
    it.


    A game can''t start without an idea, so consider carrying a small notebook around
    you and jotting down any sudden bolt of inspiration that strikes during the day.
    A second tip for generating game ideas is to take a critical look at the games
    you enjoy playing; try to break down the games into systems and note any gameplay
    features that you like. If you see a nice GUI, special effect, puzzle, or'
