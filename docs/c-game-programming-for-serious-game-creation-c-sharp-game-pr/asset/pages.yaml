  md: "# 166 Chapter 7 = Rendering Text\n\nThe code is a lot faster. With the way\
    \ it is laid out, only a few changes to be made to get this performance increase.\n\
    \nA new class is needed to collect all the vertex information before sending it\
    \ to the graphics card. A good name for this class is Batch. The Batch will take\
    \ the sprites and pack all the vertex information together in some big arrays.\
    \ It then gives OpenGL pointers to these arrays and sends a draw command. This\
    \ class will use the Tao framework so remember to include the proper using statements.\n\
    \n```\npublic class Batch\n{\n    const int MaxVertexNumber = 1000;\n    Vector[]\
    \ _vertexPositions = new Vector[MaxVertexNumber];\n    Color[] _vertexColors =\
    \ new Color[MaxVertexNumber];\n    Point[] _vertexUVs = new Point[MaxVertexNumber];\n\
    \    int _batchSize = 0;\n    public void AddSprite(Sprite sprite)\n    {\n  \
    \      // If the batch is full, draw it, empty and start again.\n        if (sprite.VertexPositions.Length\
    \ + _batchSize > MaxVertexNumber)\n        {\n            Draw();\n        }\n\
    \        // Add the current vertex vertices to the batch.\n        for (int i\
    \ = 0; i < sprite.VertexPositions.Length; i++)\n        {\n            _vertexPositions[_batchSize\
    \ + i] = sprite.VertexPositions[i];\n            _vertexColors[_batchSize + i]\
    \ = sprite.VertexColors[i];\n            _vertexUVs[_batchSize + i] = sprite.VertexUVs[i];\n\
    \        }\n        _batchSize += sprite.VertexPositions.Length;\n    }\nn\n```\n\
    \nThe max vertex number is how big a batch is allowed to get before it tells OpenGL\
    \ to render all the vertices it has. The next members are the arrays that describe\
    \ all the vertex information: its position, color, and U,V coordinates. _batchSize\
    \ member tracks how big the batch is becoming. This information needs to be passed\
    \ on to OpenGL to draw the arrays. It's also compared with the max vertex number\
    \ to decide when to draw the batch."
