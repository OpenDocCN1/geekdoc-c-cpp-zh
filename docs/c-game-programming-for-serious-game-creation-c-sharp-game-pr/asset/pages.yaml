    # Aspect Ratio


    Humans, as you are no doubt aware, have two eyes. The eyes are set in the face
    horizontally, and this gives us a wider horizontal viewing range than vertical.
    Widescreen TVs and monitors are more natural for us to use square or vertically
    all tales. The relationship between the width and height of a viewing area is
    called the aspect ratio. Certain aspect ratios are more comfortable than others.
    It''s easy to provide a range of different aspect ratios.


    If the ClientSize is set to 800 by 600, its aspect ratio is 1.33—the width is
    1.33 times longer than the height. This ratio is also referred to as 4:3. 4:3
    is a minimum; as widescreens become more popular, aspect ratios of 16:9 become
    more popular. PlayStation 3 has a default resolution of 1280 by 720; the width
    is'
