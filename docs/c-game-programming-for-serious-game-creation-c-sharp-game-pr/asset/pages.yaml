  md: "# Faster Rendering with glDrawArrays\n\nThe batch collects Sprites and the\
    \ function it uses to do this is AddSprite. AddSprite first checks if adding this\
    \ sprite will make the batch too big. If that's the case, it forces the current\
    \ batch to be drawn and emptied. The sprite vertex information is then iterated\
    \ through and added to the batch arrays.\n\nTwo functions handle the drawing of\
    \ the batch.\n\n```\nconst int VertexDimensions = 3;\nconst int ColorDimensions\
    \ = 4;\nconst int UVDimensions = 2;\nvoid SetupPointers()\n{\n    gl_EnableClientState(GL_GL_COLOR_ARRAY);\n\
    \    gl_EnableClientState(GL_GL_VERTEX_ARRAY);\n    gl_EnableClientState(GL_GL_TEXTURE_COORD_ARRAY);\n\
    \    gl_glVertexPointer(VertexDimensions, GL_GL_DOUBLE, 0, _vertexPositions);\n\
    \    gl_ColorPointer(ColorDimensions, GL_GL_FLOAT, 0, _vertexColors);\n    gl_TexCoordPointer(UVDimensions,\
    \ GL_GL_FLOAT, 0, _vertexUVs);\n}\npublic void Draw()\n{\n    if (_batchSize ==\
    \ 0)\n    {\n        return;\n    }\n    SetupPointers();\n    gl_DrawArrays(GL_GL_TRIANGLES,\
    \ 0, _batchSize);\n    _batchSize = 0;\n}\n```\n\nThe Draw function is the more\
    \ important of the two here. The Draw function does nothing. Otherwise, it calls\
    \ the SetupPointers function. SetupPointers first describes the vertex format\
    \ using glEnableClientState. In this case, the vertex described has color, position,\
    \ and U,V information. Once this is done, OpenGL is told where this information\
    \ exists using the glPointer calls.\n\nAll glPointer calls are of the same general\
    \ format. The first argument is the number of elements. The glVertexPointer controls\
    \ the position and has three elements; one for X, Y, and Z. Texture is defined\
    \ with two elements,"
