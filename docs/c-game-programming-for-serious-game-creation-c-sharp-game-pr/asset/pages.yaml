  md: '# CHAPTER 3


    # MODERN METHODS


    Software development has problems—buggy games, blue screens of death, random crashes,
    programs not responding; the problems are numerous. Architects and civil engineers
    do not have these problems. The pyramids are doing pretty well and they are nearly
    3,000 years old. Once a building is put up it tends to stay up, but humans have
    been putting up buildings for a lot longer than they have been writing software.


    In the last few years, lots of interestingly new software development methodologies
    have started to appear. These methodologies are an attempt to improve the way
    software is created and the final quality of the product. In this section, we''ll
    look at some of the more useful methodologies that you can put in your programmer''s
    toolkit.


    # Pragmatic Programming


    Pragmatic programming is the ability to finish a program satisfactorily within
    a desired timeframe. This works by first understanding what is expected of the
    final program, then a basic bare version of the program is written as quickly
    as possible. This barely functional version is changed until it reaches the original
    requirements. Changes may be drastic and require rewriting of entire sections
    of the program. The most important thing is that at all times the program is basically
    functional.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'In the world of game development, it''s always a good idea to have something
    working, because if a deadline is moved forward or a demo is required, something
    can be ready immediately. If you''re working alone, you have something to show
    people to get feedback. Feedback offers a much better idea about what will work
    and what won''t.


    # Game Programming Traps


    Many developers start out wanting to make a game but suddenly find that they''re
    writing a framework or game engine instead, and it will be useful to make any
    sort of game. The developer never does make his game and falls into the framework
    trap, redeveloping his framework over and, adding the latest features but never
    actually getting on to the game creation.


    Pragmatic programming helps you avoid the framework trap. It expressly forbids
    you to start working on a framework; creating a functional game is first and most
    important.


    Pragmatic programming has two coding principles: KISS and DRY. These are two great
    development tools that will improve your coding ability.


    # KISS


    KISS stands for “Keep It Simple Stupid.” Don’t needlessly complicate your game
    programming.


    > Hmm… my space invaders game will be much more efficient if all the enemies and
    bullets are in a quadtree. I start better building that…


    This is the wrong way to think if you want to make a game. It''s a great way to
    think if you want to learn about quadtrees. You have to decide which is more important
    to you and focus only on that. If you want to make a game, get the game functional
    as soon as possible, then decide if the extra complexity is needed.


    # DRY


    DRY stands for “Don’t Repeat Yourself.”


    If you start seeing snippets of code repeated all over the place, then that code
    should be consolidated. The fewer places the code is repeated, the fewer places
    that need to be modified when making a change. Let''s take the space invader example
    again.'
