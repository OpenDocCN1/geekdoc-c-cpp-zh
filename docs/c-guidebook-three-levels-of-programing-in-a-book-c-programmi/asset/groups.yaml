    如果你认为只有函数可以被重载，那么你就错了。构造函数是可以重载的。当构造函数被强制显示不同的输出时，它就会被重载。


    ## 析构函数


    构造函数创建对象，而析构函数删除对象。当程序员没有提供构造函数时，编译器会创建一个。但编译器生成的析构函数对于没有执行动态内存分配的基础类是有效的。


