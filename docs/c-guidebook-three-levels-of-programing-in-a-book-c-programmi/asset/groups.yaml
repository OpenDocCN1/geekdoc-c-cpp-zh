    ## 嵌套循环\n\n当你想要在代码中编写循环时，你可以选择的第三种循环是嵌套另一个循环内部的。两个循环都将同时运行，直到它们的条件都满足，只有那时它们才会结束。这就是你发现嵌套循环的时候。这种循环允许你创建一个连续的循环嵌套，这可能非常容易处理，而且正如你可能会感到困惑的，随着学习\
    \ C++ 的进步和知识的扩展，你可能会发现你使用嵌套循环次数比你想的要多得多。要使用 C++ 编程语言编写嵌套循环，请参考此示例：\n\nwhile (condition):\n\
    \n可能，要使用 C++ 编程语言编写嵌套循环，请参考此示例：\n\n```\nwhile (condition)\n{\n    statement(s)\n\
    }\n```\n\nstatement(s) // 如果你可以放入更多语句\n\n到此为止，你可能好奇为什么这一切对你的编程至关重要。现在，你可能在问自己：“为什么我必须用数组和循环来编写自己的代码？这些东西看起来有点复杂，你可能觉得只想学一些基础知识来为初学者编写良好的代码，而不是进入那些更高级的内容。”\n\
    \n总有一天，你必须决定想要扩展领域并增加你对已经熟悉的某些主题的知识。\n\n## 结语\n\n再次感谢你购买这本书！我希望这本书能够帮助你学习 C++\
