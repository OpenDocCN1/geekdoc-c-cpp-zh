- md: "\nUltimately, the manner in which we're able to talk to computers and get them\
    \ to understand exactly what it is that we want them to do has been a manner of\
    \ immense development and focus in the computer science arena for the last 75\
    \ or so years. C++ is one of many offshoots of this focus, the result of which\
    \ is ultimately the very simple need for computers to understand what we want\
    \ them to do.\n\nC++ is very good at what it does. It's an extremely popular language\
    \ in historical sense and even though it's being overwhelmed by modern programming\
    \ applications since computers are stronger now, and other languages do C++ does\
    \ with a far faster deployment time, it was the first language to combine the\
    \ efficiency and effectiveness of other languages that get deeper down into the\
    \ hardware with the abstractness of other languages. Specifically, it combined\
    \ the raw efficiency of C with the object-oriented capabilities of other languages\
    \ such as Ada.\n\nThere are many applications today where you'll find that C++\
    \ is the language of choice because it allows you to get into the computer's architecture\
    \ and tell of choice because it allows you to get into a very primitive level\
    \ while also offering a solid amount of command and expression to the programmer.\
    \ These applications are like game engines, things with limited hardware, or anything\
    \ else where performance and precision matter.\n\nC++ is also a great first language\
    \ to learn for one reason: you're going to learn a whole lot of programming and\
    \ about what's going on under the hood in terms of all else.\n\nFirst things,\
    \ let's talk about how C++ translates into language the computer can understand.\
    \ Most programming languages will handle this in one of two ways. They will either\
    \ compile the code, which means that it will be translated directly into the code,\
    \ or means that the code will be run within a virtual machine that essentially\
    \ acts as a layer between the operating system and the hardware.\n\nLet's get\
    \ into the meat of all this by discussing how you can ensure things should be\
    \ put together with common groups in order to make them easier to work with throughout\
    \ the program and in order to essentially take some of the stress off of the programmer.\n\
    \nWhat we fail to discuss is how our pseudocode doesn't quite translate into workable\
    \ C++ code. The first thing that we really need to talk about is the idea of access\
    \ modifiers.\n\nAccess modifiers are an idea that will make more sense in a moment,\
    \ but for the purposes of constructing an initial class, we need to work on it.\
    \ So said, what exactly is an access specifier?\n\nIn C++ and generally when you're\
    \ programming, a lot of you tends to intermingle. Things don't exactly stay clear.\
    \ And the thing about object-oriented programming is that it specifically implies\
    \ and endorses more complex and abstract programming structures, which lends itself\
    \ to the fact that sometimes things are going to be where they don't need to be.\n\
    \nThe obvious way to get around this problem is to set boundaries for your data.\
    \ These boundaries in C++ are: private, public, and protected.\n\nPublic data\
    \ implies that the data under the access specifier can be edited from anywhere\
    \ within the program. This means that in your main function or any other function,\
    \ if you create an object, you can change any of the attributes of that object\
    \ without having any sort of protections on its actual value.\n\nPrivate, on the\
    \ other hand, implies the total opposite. Data and functions under the private\
    \ access specifier only alter the data within the class. In other words, the only\
    \ thing that can change the data of an object is a function or something which\
    \ occurs within the class definition. Nothing else is allowed to change the data.\n\
    \nProtected is the last access specifier, and this implies that the only thing\
    \ that can change the value of an object is something from within their class\
    \ derivative definition. That is, only those objects which have the original class\
    \ definition, or a class derived from the original class are able to change these\
    \ values.\n\nProtected is generally considered bad practice much of the time.\
    \ Rather, it's not necessarily bad practice; it's exceptionally difficult to use.\n\
    \nSum = addition(1, 2);\nThe statement above gives the value \"sum=3\". The execution\
    \ resumes once the control of the program switched back to the main function from\
    \ the last point that the control has passed to function. Calling a function several\
    \ times is also possible. However, the output of the function will depend on the\
    \ parameter types that went through it.\n\n# Default Parameters\n\nAssigning a\
    \ default value for arguments is permitted in the C++ language. These parameters\
    \ are useful when there are empty parameters in the called function.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nvoid multiply(int &x, int &y) {\n \
    \   x = y;\n    y = x;\n}\nint main() {\n    // first call to function 'product'\n\
    \    return 0;\n}\n```\n\n```cpp\nint multiply(int x, int y) {\n    return x *\
    \ y;\n}\n\nvoid main() {\n    int product = multiply(5, 6);\n    printf(\"product:\
    \ %d\\n\", product);\n}\n```\n\nThe 'product' in this program has been declared\
    \ twice. In the first call, the argument 'x' has a value of '3' while the default\
    \ value is taken by the argument 'y'. As a result, '10' is specified. Constant\
    \ arguments are not different from default parameters. For example:\n\n```cpp\n\
    float example(int day, int month, const int year = 2005);\n```\n\n![](img/7da88c5734edd9e3794ac84f3c79bd211.png)\n\
    \nComments in C++ are highlighted as shown in the above. In all programming languages,\
    \ comments never get executed. In other words, comments improve the readability\
    \ of your program. Below are two ways in which one can comment on his or her program:\n\
    \n- Multi-line Comment: This starts with /* and ends with */.\n- End-of-line Comment:\
    \ This starts with // and ends where the line finishes.\n\nInclude is a preprocessor\
    \ directive. This type of directive starts with the # symbol. They run before\
    \ compilation. So, this means they run a message to the preprocessor to include\
    \ a header file \"iostream\" which ends the namespace operations. There is a header\
    \ file called \"iostream\". It declares std to be the default statement (\"using\
    \ namespace\").\n\n```cpp\n#include <iostream>\nusing namespace std;\n```\n\n\
    int main() {\n    ...body...\n    return 0;\n}\n```\n\nA function may not return\
    \ more than one value. However, you may define a data structure, and have it return\
    \ that specific data structure. In fact, a function can have much any type that\
    \ a variable can take on. Anything that may be represented as a value may be the\
    \ type of function. Remember, too, that a function doesn't have to take on arguments\
    \ at all. In that case, the parentheses would be there, but they wouldn't contain\
    \ anything.\n\nThis is how we take the function which computes the area of a square.\
    \ If you were to prototype this function, you could do it like so:\n\n```cpp\n\
    int computeAreaOfSquare(int x, int y) {\n    return x * y;\n}\n```\n"
  mdcn: "\n最终，在过去的 75 年左右里，我们与计算机交流并让它们准确理解我们想要它们做什么的方法，一直是计算机科学领域发展和关注的重点。C++ 是这一重点的众多分支之一，其最终结果就是让计算机能够理解我们想要它们做什么这一非常简单的需求。\n\
    \nC++ 在其领域内非常出色。从历史角度来看，它是一门非常受欢迎的语言，尽管由于现在的计算机更强大，它被现代编程应用所淹没，而且其他语言以更快的部署速度完成\
    \ C++ 所做的事情，但它是第一个将深入硬件的其他语言的效率、有效性与其他语言的抽象性结合起来的语言。具体而言，它将 C 的原始效率与 Ada 等其他语言的面向对象能力结合在一起。\n\
    \n在许多应用中，你会发现 C++ 是首选语言，因为它允许你深入计算机架构并进入非常原始的底层，同时又为程序员提供了大量的命令和表达能力。这些应用诸如游戏引擎、硬件受限的设备或任何其他对性能和精度至关重要的领域。\n\
    \nC++ 也是一个非常棒的入门语言，原因在于：你将学到大量的编程知识，以及关于其他一切在底层是如何运作的。\n\n首先，让我们谈谈 C++ 如何翻译成计算机可以理解的语言。大多数编程语言通过两种方式之一处理此问题：它们要么编译代码（这意味着代码被直接翻译成机器代码），要么让代码在虚拟机中运行，虚拟机本质上充当操作系统和硬件之间的中间层。\n\
    \n让我们进入核心内容，讨论你如何确保将事物按共同组组合在一起，以便在整个程序中更易操作，并从根本上减轻程序员的压力。\n\n我们还没有讨论的是伪代码如何无法完全转换为可运行的\
    \ C++ 代码。我们首先真正需要讨论的是访问修饰符（access modifiers）的概念。\n\n访问修饰符是一个稍后就会会有更有意义的概念，但为了构建初始类，我们需要处理它。那么，访问修饰符（access\
    \ specifier）到底是什么？\n\n在 C++ 以及通常的编程中，许多人倾向于混杂。事物并不完全保持清晰。而面向对象编程的特点是，它特别暗示并支持更复杂、更抽象的编程结构，这导致有时事物会出现在不该出现的地方。\n\
    \n解决这个问题的明显方法是为数据设置边界。C++ 中的这些边界是：private（私有）、public（公共）和 protected（受保护）。\n\n\
    public 数据意味着访问修饰符下的数据可以从程序的任何地方进行编辑。这意味着在你的主函数或任何其他函数中，如果你创建了一个对象，你可以更改该对象的任何属性，而无需对其实际值进行任何保护。\n\
    \n另一方面，private 意味着完全相反。private 访问修饰符下的数据和函数只会修改类内部的数据。换句话说，唯一可以更改对象数据的是类定义内部的函数或发生的事情。其他任何都不允许更改数据。\n\
    \nprotected 是最后一个访问修饰符，它意味着唯一可以更改对象值的是其派生类定义内部的内容。也就是说，只有那些拥有原始类定义或派生自原始类的对象才能更改这些值。\n\
    \nprotected 在很多情况下通常被认为是坏习惯。相反地，它并不一定是坏习惯，而是使用极其困难。\n\n```\nSum = addition(1,\
    \ 2);\n```\n上述语句给出值 \"sum=3\"。一旦程序控制权从传递给函数的最后一点切换回主函数，执行就会继续。多次调用几次函数也是可能的。然而，函数的输出将取决于传递它的参数类型。\n\
    \n# 默认参数\n\nC++ 语言允许为参数分配默认值。当被调用函数中存在空参数时，这些参数非常有用。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nvoid multiply(int &x, int &y) {\n    x = y;\n    y = x;\n\
    }\nint main() {\n    // 第一次调用函数 'product'\n    return 0;\n}\n```\n\n```cpp\nint\
    \ multiply(int x, int y) {\n    return x * y;\n}\n\nvoid main() {\n    int product\
    \ = multiply(5, 6);\n    printf(\"product: %d\\n\", product);\n}\n```\n\n这个程序中的\
    \ 'product' 被声明了两次。在第一次调用中，参数 'x' 的值为 '3'，而参数 'y' 取了默认值。结果指定了 '10'。常量参数与默认参数没有区别。例如：\n\
    \n```cpp\nfloat example(int day, int month, const int year = 2005);\n```\n\n![](img/7da88c5734edd9e3794ac84f3c79bd211.png)\n\
    \nC++ 中的注释如上所示被高亮。在所有编程语言中，注释从不会被执行。换句话说，注释提高了程序的可读性。以下是给程序添加注释的两种方式：\n\n- 多行注释：以\
    \ /* 开头，以 */ 结束。\n- 行尾注释：以 // 开始，在行结束处结束。\n\nInclude 是一个预处理器指令。这种类型的指令以 # 符号开头。它们在编译之前运行。因此，这意味着它们向预处理器运行一个消息，包含头文件\
    \ \"iostream\"，这结束了命名空间操作。有一个名为 \"iostream\" 的头文件。它声明 std 为默认语句（\"using namespace\"\
    ）。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    ...正文...\n\
    \    return 0;\n}\n```\n\n函数可能返回多个一个值。然而，你可以定义一个数据结构并让它返回该特定的数据结构。事实上，函数可以可以是变量可以承担的任何类型。任何可以表示为值的内容都可以作为函数的类型。同样记住，函数不需要接受任何参数。在这种情况下，括号会存在，但它们里面不包含任何内容。\n\
    \n这就是我们如何计算正方形面积的函数。如果你对这个函数编写原型，你可以像这样做：\n\n```cpp\nint computeAreaOfSquare(int\
    \ x, int y) {\n    return x * y;\n}\n```\n"
