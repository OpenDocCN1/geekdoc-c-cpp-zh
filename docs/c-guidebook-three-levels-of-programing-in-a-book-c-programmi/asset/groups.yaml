- md: "\n## Step 2: Build Executable Code\n\nOnce you have typed and saved the file,\
    \ the next thing is to run the executable code. In this example, the code is hello.exe.\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    // Print 'Hello, world!'\n\
    \    std::cout << \"Hello, world!\" << std::endl;\n    // End of main function\n\
    \    return 0;\n}\n```\n\n## Step 3: Run the executable code\n\nNext, is to run\
    \ the executable code. If you are working from an IDE such as CodeBlocks, press\
    \ the \"Run\" button. Use commands while you are on Shell or Terminal for Linux.\n\
    \n## Comments\n\n![](img/7da88c5734edd9e379c4ac84f3ca79bd_236_0.png)\n\nIf your\
    \ class will need a destructor, it really needs an overloaded assignment operator\
    \ plus a copy constructor. If your constructor assigns resources such as the heap\
    \ memory, the assignment operator and default copy constructor will not perform\
    \ anything to create problems through producing multiple pointers.\n\nIf one destructor\
    \ for these objects is invoked, it will return the assets. And when the destructor\
    \ for the other copy appears, it spoils up.\n\n## Follow every step in the debugger\n\
    \nBeing a programmer, it is your role to understand whatever your program is doing.\
    \ It is not enough that the program displays the required value. You must understand\
    \ everything that your program does. There is no better way to understand what\
    \ your program is doing than following up by step. Get a good debugger and execute\
    \ your program stepwise.\n\nAgain, while you debug your program, have with you\
    \ some raw data to help figure out any strange behavior that may arise when your\
    \ program runs. There is no better way to do a complete check than monitoring\
    \ each function as it runs.\n\nOnce a function ends and you need to add it to\
    \ the program, you need to track the logical path at least once. When you review\
    \ a function independently, bugs can be identified much earlier than in a collection\
    \ of other functions.\n\ncin >> myCatchphrase;\n\nWhat is your catchphrase?\n\n\
    Say hello to my little friend. [enter]\n\nIf you were to do this, only the word\
    \ Say would be saved as this, because everything after the space would be parsed\
    \ as an additional argument to the console input stream but the compiler and console\
    \ would be unable to find the corresponding variables to save these arguments\
    \ to.\n\nInstead, you must do the following:\n\n```cpp\n#include <string>\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    string myCatchphrase;\n\
    ```\n\n```cpp\n#include <stdio.h>\n#include <string>\nusing namespace std;\nint\
    \ main() {\n    string myCatchphrase;\n    cout << \"What is your catchphrase?\"\
    \ << endl;\n    getline(cin, myCatchphrase);\n    // Then, whatever you entered\
    \ up until Enter would be saved to\n    // string myCatchphrase;\n    return 0;\n\
    }\n```\n\nYou can also output formatted strings. These are more specifically formatted\
    \ strings than those which you can output using the standard console output stream.\
    \ For instance, you can specify how large a text field should be or specifically\
    \ what kind of data will be printed out to the console.\n\nHere is an example\
    \ of an integer PumpkinSize being output using the printf() method, which prints\
    \ formatted text.\n\nThis locks a mutex that is in the scope. Once it is out of\
    \ scope it is removed.\n\n## Two Tasks: One Process\n\n- This displays a single\
    \ thread executed.\n- std::thread\n\nThe producer increases the shared data object\
    \ to 5 while the main thread increases the data object until the 5 is defined\
    \ by the producer thread.\n\nThe most interesting thing is the way in which it\
    \ is to create a thread, most specifically when you want to initialize a std::thread.\
    \ What is done to provide a function for the thread to implement its plus function\
    \ modifications. In addition, the global mutex helps protect data from multiple\
    \ modifications. Lastly, use {...} to define explicit scopes while std::lock_guard\
    \ control access.\n\nWhat if you are writing software that is parallel? The example\
    \ used requires one to build a distinct function in parallel for two separate\
    \ values. This is the case to use a Future object to complete the asynchronous\
    \ computation.\n\n## Two Tasks: One Process\n\nWhat if you are writing software\
    \ that is parallel? The example used requires one to build a function in parallel\
    \ for two separate values. This is the best case to use a Future object to complete\
    \ the synchronous computation.\n\nA future is an object that ensures the right\
    \ value exists depending on the type of computation. This object resembles a placeholder\
    \ value. It helps a programmer to start a computation and confirm a result that\
    \ has been produced.\n\nTo be precise, asynchronous result develops future objects.\
    \ The std::promise, std::async, and std::packaged_tasks represent the interfaces\
    \ that allow the implementation of a get(future) method.\n\nThis is an advanced\
    \ method which provides a value for the future and creates the least flexibility.\
    \ Besides that, it is the easiest way to implement asynchronous computation. You\
    \ need to remember that this method does not resemble other objects.\n\n- std::async\n\
    - std::promise\n- std::packaged_tasks\n\nIt is among the best ways to deliver\
    \ a future.\n\n```cpp\nclass Child : public Parent {\n    public static void main(String[]\
    \ args) {\n        // If integer x and integer y were equal\nChild obj1 = new\
    \ Child();\n        System.out.println(\"Parent \" + obj1.id);\n        System.out.println(\"\
    Child \" + obj1.id);\n        return 0;\n    }\n}\n```\n\nThe above program has\
    \ a class \"Child\" that inherits \"Parent\". This means public members of the\
    \ parent class are inherited by the child class.\n\n## The Different Modes of\
    \ Inheritance\n\n1. **Public mode**: The public base class remains public in the\
    \ subclass from a public class.\n2. **Protected mode**: Selecting a subclass from\
    \ a protected base class results in protected mode.\n3. **Private mode**: Private\
    \ mode happens when a subclass is created from the private base class.\n\nNote:\
    \ Private members in the base class cannot be accessed directly in the derived\
    \ class. However, protected members can be accessed directly.\n\nThe table below\
    \ provides a summary of the three modes.\n\n| Base class access | Public | Protected\
    \ | Private |\n| :--- | :--- | :--- | :--- |\n| Interface | Public | Protected\
    \ | Private |\n| subclass | Public | Not inaccessible (accessible) | Not inaccessible\
    \ (accessible) |\n| subclass | Public | Protected | Not inaccessible (accessible)\
    \ |\n\n## Types of Inheritance\n\n- x==y: X is equal to Y.\n- x<=: X is less than\
    \ or equal to Y.\n- x<: X is less than y.\n- x>=: X is greater than or equal to\
    \ Y.\n- x>: X is greater than Y.\n- x!=: X is not equal to Y.\n\nWith these, we\
    \ can start forming far broader statements. Do note that these statements actually\
    \ have true value themselves. Given an integer x and an integer y, we can start\
    \ to process these logically.\n\nThe first, example, would be true if integer\
    \ x and integer y were equal. It's false otherwise.\n\nYou can chain these logical\
    \ expressions together through what you can call logical operators. These are\
    \ like:\n\nstatement1 && statement2: This is true if both expression 1 and expression\
    \ 2 are true. Otherwise, this can be read as \"and\".\n\nstatement1 || statement2:\
    \ This is true if either expression 1 or expression 2 is true. Both may be true,\
    \ too. However, both may not be false. If either one of them is not true, the\
    \ statement evaluates to false. Can be read as \"or\".\n"
  mdcn: "\n\n## 第 2 步构建可执行代码\n\n一旦你输入并保存了文件，下一步是运行可执行代码。在这个示例中，代码是 hello.exe。\n\n\
    ```cpp\n#include <iostream>\n\nint main() {\n    // Print 'Hello, world!'\n  \
    \  std::cout << \"Hello, world!\" << std::endl;\n    // End of main function\n\
    \    return 0;\n}\n```\n\n## 第 3 步运行可执行代码\n\n接下来是运行可执行代码。如果你在使用 CodeBlocks 等 IDE，请点击“Run”（运行）按钮。在\
    \ Linux 的 Shell 或 Terminal 中请使用命令。\n\n## 注释\n\n![](img/7da88c5734edd9e379c4ac84f3ca79bd_236_0.png)\n\
    \n如果你的类需要析构函数，那么它确实需要一个重载的赋值运算符加上拷贝构造函数。如果你的构造函数分配了堆内存等资源，赋值运算符和默认拷贝构造函数不会执行任何操作，从而导致产生多个指针的问题。\n\
    \n如果调用了这些对象的其中一个析构函数，它将释放资源。当另一个拷贝的析构函数出现时，它就会破坏程序。\n\n## 遵循调试器中的每一步操作\n\n作为一名程序员，你的职责是理解你的程序在做什么。仅仅程序显示出所需的值是不够的。你必须理解程序所做的一切。没有比单步执行（step\
    \ by step）更能理解你的程序在做什么的方法了。获取一个好用的调试器并分步执行你的程序。\n\n再次，在调试程序时，随身准备一些原始数据，以帮助确定程序运行时可能出现的任何奇怪行为。没有比监控每个函数的运行过程更彻底进行完整检查的方法了。\n\
    \n一旦一个函数结束并且你需要将其添加到程序中，你至少需要追踪一次逻辑路径。当你独立审查一个函数时，比在其他函数集合中更早地发现 bug。\n\ncin >>\
    \ myCatchphrase;\n\n你的口号是什么？\n\n向我的小朋友问好。[回车]\n\n如果你这样做，那么只有 `Say` 单词会被保存为这样，因为空格之后的所有内容都将被解析为控制台输入流的额外参数，但编译器和控制台无法找到对应的变量来保存这些参数。\n\
    \n相反，你必须执行以下操作：\n\n```cpp\n#include <string>\n#include <iostream>\nusing namespace\
    \ std;\nint main() {\n    string myCatchphrase;\n```\n\n```cpp\n#include <stdio.h>\n\
    #include <string>\nusing namespace std;\nint main() {\n    string myCatchphrase;\n\
    \    cout << \"What is your catchphrase?\" << endl;\n    getline(cin, myCatchphrase);\n\
    \    // 然后，你在按下回车之前输入的内容都将保存到\n    // string myCatchphrase;\n    return 0;\n}\n\
    ```\n\n你还可以输出格式化字符串。这些比你使用标准控制台输出流输出的字符串具有特定的格式。例如，你可以指定文本字段的大小，或者具体指定将什么类型的数据打印到控制台。\n\
    \n这是一个使用 `printf()` 方法输出整数 `PumpkinSize` 的示例，它可以打印格式化文本。\n\n这锁定了作用范围内的互斥量。一旦超出作用范围，它会被移除。\n\
    \n## 两个任务：一个进程\n\n- 这显示了单线程执行。\n- std::thread\n\n生产者将共享数据对象增加到 5，而主线程增加数据对象，直到生产者线程定义\
    \ 5 为止。\n\n最有趣的是创建线程的方式，特别是当你想要初始化一个 `std::thread` 时。这样做是为了提供一个函数供线程实现其加法函数修改。此外，全局互斥量有助于保护数据免受多次修改。最后，使用\
    \ {...}` 定义显式作用范围，同时使用 `std::lock_guard` 控制访问。\n\n如果你正在编写并行软件怎么办？所使用的示例需要为两个单独的值并行构建一个不同的函数。这种情况需要使用\
    \ `Future` 对象来完成异步计算。\n\n## 两个任务：一个进程\n\n如果你正在编写并行软件怎么办？所使用的示例需要为两个单独的值并行构建一个函数。这是使用\
    \ `Future` 对象完成同步计算的最佳用例。\n\n`future` 是一种对象，它确保根据计算类型存在正确的值。这个对象类似于一个占位值。它帮助程序员开始计算并确认已产生的结果。\n\
    \n准确来说，异步结果会产生 `future` 对象。`std::promise`、`std::async` 和 `std::packaged_tasks`\
    \ 代表了允许实现 `get(future)` 方法的接口。\n\n这是一种高级方法，为 `future` 提供值并产生最小的灵活性。此外，它是实现异步计算最简单的方法。你需要记住这种方法与其他对象并不相似。\n\
    \n- std::async\n- std::promise\n- std::packaged_tasks\n\n它是交付 `future` 的最佳方式之一。\n\
    \n```cpp\nclass Child : public Parent {\n    public static void main(String[]\
    \ args) {\n        // 如果整数 x 和整数 y 相等\nobj1 = new Child();\n        System.out.println(\"\
    Parent \" + obj1.id);\n        System.out.println(\"Child \" + obj1.id);\n   \
    \     return 0;\n    }\n}\n```\n\n上面的程序有一个继承自 \"Parent\" 的类 \"Child\"。这意味着基类的公共成员被子类继承。\n\
    \n## 继承的不同模式\n\n1. **公共模式**：从公共基类继承时，公共基类保持保持公开的。\n2. **保护模式**：从保护基类选择子类会产生保护模式。\n\
    3. **私有模式**：当从私有基类创建子类时发生私有模式。\n\n注意：基类中的私有成员在派生类中无法直接访问。然而，保护成员可以直接访问。\n\n下表提供了这三种模式的总结。\n\
    \n| 基类访问 | 公共 | 保护 | 私有 |\n| :--- | :--- | :--- | :--- |\n| 接口 | 公共 | 保护 | 私有\
    \ |\n| 子类 | 公共 | 不可用（可访问） | 不可用（可访问） |\n| 子类 | 公共 | 保护 | 不可用（可访问） |\n\n## 继承类型\n\
    \n- x==y: X 等于 Y。\n- x<=: X 小于等于 Y。\n- x<: X 小于 y。\n- x>=: X 大于等于 Y。\n- x>: X大于\
    \ Y。\n- x!=: X等于 Y。\n\n通过这些，我们可以形成更宽泛的语句。请注意这些语句本身具有真值。给定一个整数 x 和一个整数 y，我们可以开始逻辑上处理这些内容。\n\
    \n第一个示例，如果整数 x 和整数 y 相等，则为真。否则为假。\n\n你可以通过所谓的逻辑运算符将这些逻辑表达式组合在一起。这些类似于：\n\nstatement1\
    \ && statement2 只有当表达式 1 和表达式 2 都为真时，它才为真。否则，这可以读为“与”。\n\nstatement1 || statement2\
    \ 只要当表达式 1 或表达式 2 为真时，它才为真。两者也可以都为真。然而，两者不能都为假。如果其中一个不为真，语句求值为假。可以读为“或”。\n\n"
