  mdcn: "\n\n# C++ 指南\n\n![](img/7da88c5734edd9e379c4ac84f3ca79bd_0_0.png)\n\n书中的三个编程层级\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    long\
    \ dividend, divisor;\n    int ch;\n    //start of do-loop\n    do {\n        cin\
    \ >> dividend >> divisor;\n        cout << \"dividend: \" << dividend << endl;\n\
    \        cout << \"divisor: \" << divisor << endl;\n        cout << \"quotient:\
    \ \" << (dividend / divisor) << endl;\n        cout << \"remainder: \" << (dividend\
    \ % divisor) << \" do it again?\" << endl;\n        cin >> ch;\n    } while (ch\
    \ == 1);\n    return 0;\n}\n```\n\nwhile 循环在循环开始处被高亮并结束循环。你应该注意到该语句与 `while` 循环看起来相似。\n\
    \n# 你知道该使用哪种循环吗？\n\n当你已经知道循环应该执行多少次时，使用 'while' 关键字。`while` 语句看起来与 `while` 循环相似。\n\
    \n# 你知道该使用哪种循环吗？\n\n当你已经知道循环应该运行多少次时，`for` 循环效果最好。对于 `while` 和 `do` 循环，当你不知道循环应该运行的次数时，它们是最佳选择。此外，当你想要至少执行一次循环体时，请使用该循环。另一方面，当你不想至少执行一次循环体时，可以使用\
    \ `do` 循环。虽然这是你如何熟练地使用这些循环，但你可以根据手头的情况使用任何循环。循环的类型主要取决于你的偏好和风格。\n\n# 决策\n\n循环中的决策决定了是否应该在循环体中执行给定操作。在所有程序中，决策会导致程序跳转并执行程序的某部分。C++\
    \ 程序有几种决策语句。最常见的是 `if-else` 语句。其他的包括 `Switch` 语句。让我们简要学习每种决策语句。\n\n# If语句\n\n\
    这是决策语句中最简单、直接的形式。它包含一个布尔表达式和一些语句。下面是 `if` 语句的语法。\n\n当 `isPregnant` 为真时，将创建一个 `Mammal`\
    \ 对象。`Mammal(false)` 会产生相反的结果。\n\n说完这些，我们可以谈谈面向对象编程如何应用于“抽象”概念，这是我们需要触到的第二个大支柱。显而易见，面向对象编程允许程序员让事物变得更加抽象，但这实际上是面向对象编程的核心关注之一。虽然它在远离计算机核心的语言中更为明显，但它仍然很重要，因为你同样可以使用\
    \ C++ 抽象概念，将其转化为非常标准的想法，并在其基础上进行构建。\n\nC++ 面向对象编程范式在模块化方面提供了很多支持，这种理念认为你的程序是高度扩展的。人们可以进去添加或移除组件而不会破坏整艘船。你还可以编辑一部分并让整个程序受到影响，而无需遍历并重构整个内容。面向对象编程为此提供了一个主要的途径。\n\
    \n人们可以进去添加或移除组件而不会破坏整艘船。你还可以编辑一部分并让整个程序立即受到影响，而无需遍历并重构整个内容。面向对象编程为此提供了一个主要的途径。\n\
    \n到此，我们涵盖了面向对象编程的三个主要思想。继承和多态比此本书允许的复杂得多，所以我们必须在此停止。\n\n实例化的基本概念。你可以随心所欲创建一个类的实例，这个实例将拥有你为类泛定义的所有属性。这意味着，你不仅仅有硬编码或重新定义代码的选项，你实际上可以随心所欲地创建给定属性的新实例。\n\
    \n这些实例被定义为对象。因此，面向对象编程是围绕对象的概念展开的。让我们回想一下哺乳例子。如果我们想推这些这些概念以在伪代码中形成 `mammal` 类，我们会这样做：\n\
    \n```cpp\nclass mammal {\n  attribute numberOFLimbs;\n  attribute backbone;\n\
    \  mammal giveBirth() {\n  }\n}\n```\n\n虽然这是定义类基本外壳的好方法，但它未能涵盖一些关键概念。然而，在我们进入这些内容之前，我们需要涵盖一个更广泛的概念：封装。这是面向对象哲学的第一个关键原则，它讨论了这一切的要点；其核心思想是你能够将面向对象编程的关键思想整合到这一本小小的书中。这使得你以后不需要再引用它们。\n\
    \n封装与实例化的思想紧密相成。因为我们已经定义了所有这些特性，现在我们可以创建一个 `mammal` 类的的新实例。例如，狗：\n\n如你所看到的，它的工作方式与定义变量非常相似；这实际上是定义对象的\
    \ C++ 代码的工作方式，不仅仅是伪代码。\n\n因此，我们发现了所有面向对象编程中最纯粹、最相关的思想之一的结晶：封装和...\n\nnew mammal();\n\
    \n可能的处理\n\n一旦有一个指针变量指向某些内容，下一步要做的就是对指针进行解引用，以便获取它所指向内容的值。\n\n# 修饰符类型\n\nC++ 语言也不允许直接将整数赋值给指针。\n\
    \n整数可以存储地址。如果你尝试运行此字面量，它没有内存地址。编译器将发送警告，说明无法将 `int` 转换为整数指针。\n\n整数可以存储地址。如果你尝试运行此字面量，它没有内存地址。编译器将发送警告，说明无法将\
    \ `int` 转换为整数指针。\n\n这是因为指针可以存储。\n\n"
