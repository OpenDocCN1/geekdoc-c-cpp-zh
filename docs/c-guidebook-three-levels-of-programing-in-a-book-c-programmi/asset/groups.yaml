    - 为什么要以及何时使用继承？\n- 继承中存在的模式\n- 继承的类型\n\n准备好学习很多有趣的内容。\n\n让我们一组车辆作为示例。你应该为每种车辆创建不同的类，如巴士、卡车和汽车。这些类的方法包括\
    \ `capacity()`、`applyBrakes()` 和 `accelerate()`。这些方法对于所有类都是相似的。假设假设创建这些类并避免使用继承。如果是这样，这意味着每个类都必须拥有所有函数。\n\
    \n这在编程中是一个非常糟糕的局面，因为会导致相同代码出现三次的情况。代码的多次重复会导致数据冗余而产生更高的错误风险。为了消除这类问题，通过继承将这三个函数分配给\
