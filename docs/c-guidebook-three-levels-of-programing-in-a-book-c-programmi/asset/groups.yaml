  mdcn: "\n\n# 第3 章\n\n# 用户输入与输出\n\n在上一章中，我们主要讨论了数据的读取和处理，至少只是停留在非常浅的层次。在本章中，我们将讨论如何从用户获取信息，以及更深层次的向控制台输出信息的方法。目前为止，我们只讨论了使用控制台输出流来实现这一点，但我们需要讨论更多方法，允许你以更细致的方式打印信息。\n\
    \n我们首先想要谈论的是用户输入。用户输入以多种形式体现。第一种也是最简单的是控制台输入方法。这允许你通过控制台中的输入流获取整体数据。\n\n我们首先想要谈论的是用户输入。用户输入以多种形式体现。第一种也是最简单的是控制台输入方法。这允许你通过输入流获取整体数据并将其存储起来。让我用一个整数来举例说明。\n\
    \n例如，使用控制台输入流，你可以获取整数或浮点数，然后使用整数类型将它们存储。\n\n```\nint my_var;\ncout << \"You entered:\
    \ \" << my_var;\ncin >> my_var;\n```\n\n在大多数情况下，这是一种向控制台输入信息非常简单且直接的方式。然而，它确实有一个陷阱。我们还没有深入讨论过字符串，或许现在还不是最好的时机，但理解字符串最好的方法是：字符字符串在这一语境下是可以解析的。这意味着，以此此类推，它们并不是以标准方式读取到控制台的。\n\
    \n通过包含 `string` 头文件，你可以访问所谓的标准模板库（STL）。然后你可以创建 `string` 类型的变量。然而，\n\n![](img/7da88c5734edd9e379c4ac84f3ca79bd_101_0.png)\n\
    \n如你所见，当你使用继承时，你只需要编写函数，而不是写三次，因为这三个类都继承自基类。\n\n# 如何在 C++ 中实现继承\n\n要创建一个被基类继承的子类，请使用以下语法：\n\
    \n```cpp\nclass subclass_name : access_mode base_class_name\n{\n    // 子类体\n}\n\
    ```\n\n在此时句语法中，子类的名称是 `subclass_name`。\n\n```cpp\nclass subclass_name : access_name\
    \ base_class_name\n    // 子类体\n```\n\n在此时句语法中，子类的名称是 `subclass_name`。`access_mode`\
    \ 是想要继承子类的方法。它可以是 `public`（公共）或 `private`（私有）。要继承子类的基类名称是 `base_class_name`。\n\
    \n# 注意\n\n保护成员不能被派生类访问。然而，它继承了一个完整的父类对象，该对象包含了由类声明的私有成员。\n\n```cpp\n// 继承的实现示例\n\
    // https://cppreference.com/w/cpp/inheritance\n\nclass BaseClass {\npublic:\n\
    \    int x;\n};\n\n// 子类继承自 BaseClass(父类)\nclass subclass : BaseClass {\npublic:\n\
    \    int y;\n};\n```\n\n它由名称、参数列表和函数返回类型组成。函数原型的基本语法类似于函数头的语法。它应该以分号结束。\n\n函数原型告诉编译器函数定义在程序中的给定位置。一旦函数被调用，编译器会立即跳转到该位置。下面显示了如何编写上一个程序的函数头示例。\n\
    \n```cpp\nint mult(int a, int b);\n```\n\n正如我们之前所说的，函数原型描述了“名称”、参数和“返回类型”。作为格式化使用的风格的一部分，函数头应该在常量、全局变量和预处理指令之后声明。许多内置的\
    \ C++ 函数包含函数原型。然而，开发者和程序员在定义自己的函数时应该包含他们自己的函数原型。\n\n# 如何访问函数？\n\n使用函数名和所有参数来调用函数。\n\
    \n然而，开发者和程序员在定义自己的函数时应该包含他们自己的函数原型。\n\n# 如何访问函数？\n\n当你想要调用某个函数时，使用函数名及其参数。这些参数应该括在括号中。提供的程序将帮助你理解它的函数。示例程序使用“addition”函数确定了通过它的参数值总数。\n\
    \n从这个程序中，主函数启动了执行模式。`sum`（也是 `int` 类型）被声明。接下来，使用语句对函数“addition”进行调用：\n\n# 第 5\
    \ 章\n\n# C++ 函数\n\n在本章中，你将学习更多关于函数的知识。\n\n你非常清楚，如果你有一个只有少量指令要处理的大型程序，很难去理解、管理和维护它。很好，C++\
    \ 程序中的函数帮助人们完成给定的任务，并促进了模块化编程的设计。为了帮助你理解函数在程序中的重要性，请阅读示例：\n\n假设你有一个程序提示用户输入两个值的平均值。首先，你如何通过程序计算这两个值的平均值呢？下面的截图有这个问题？为它开发一个解决方案，你的代码解决方案可能会出现。\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    float number1, number2;\n \
    \   std::cout << \"Enter first number: \";\n    std::cin >> number1;\n    std::cout\
    \ << \"Enter second number: \";\n    std::cin >> number2;\n    float average =\
    \ (number1 + number2) / 2;\n    std::cout << \"Average is: \" << average << std::endl;\n\
    \    return 0;\n}\n```\n\n该程序提示用户输入两个值的平均值。首先，你如何通过程序计算这两个值的平均值呢？下面的截图有这个问题？为它开发一个解决方案，你的代码解决方案可能会出现。\n\
    \n另一个问题是你你想计算每个数字的百分比。根据我们拥有的知识，我们会编写如下代码：\n\n```cpp\n    int numbers[] = {10,\
    \ 20, 30, 40, 50};\n    int sum = 0;\n    for (int i = 0; i < 5; i++) {\n    \
    \    sum += numbers[i];\n    }\n    for (int i = 0; i < 5; i++) {\n        int\
    \ percentage = (numbers[i] * 100) / sum;\n        System::println(numbers[i] +\
    \ \" is \" + percentage + \"%\");\n    }\n```\n\n# for 循环的变化\n\nfor 循环仍然允许你在初始化部分添加多个表达式，只要你用逗号分隔表达式。此外，你还可以包含另一个增加表达式。但测试表达式只能有一个。这是一个检查的示例：\n\
    \n```cpp\nfor (int i = 38; i < 100; i += 5) {\n    // 循环体\n}\n```\n\n在这个示例中，有一个循环变量\
    \ `j`。还有变量 `alpha` 的初始化和变量 `beta` 的递减。注意它们是如何用逗号分隔的。\n\n# while 循环\n\nfor 循环以固定次数执行操作。与此同时，你永远不知道循环执行了多少次。查看下面的示例：\n\
    \n![](img/7da88c5734edd9e379c4ac84f3ca79bd_107_0.png)\n\n```cpp\nint counter =\
    \ 0; // 如果计数器没有初始化为 0\nwhile (counter < 10) {\n    System.println(\"counter =\
    \ \" + counter);\n    counter++;\n}\n```\n\n这个程序提示用户输入一组数字，但一旦输入 0，循环就会结束。你应该看到程序无法得知用户在输入\
    \ 0 之前会输入多少数字。\n\nwhile 循环就像 for 循环的简单版本。它有测试表达式，但没有初始化增加表达式。\n\n# do 循环\n\n测试表达式在循环开始时建立。如果测试表达式为假，循环体将不会执行。有时这是你预期的。然而，当你想要至少执行一次循环体，无论测试表达式结果是真是假时，就会出现这种情况。do\
    \ 循环是这种情况下最佳选择。查看示例你就能理解 do 循环是如何运行的。\n\n"
