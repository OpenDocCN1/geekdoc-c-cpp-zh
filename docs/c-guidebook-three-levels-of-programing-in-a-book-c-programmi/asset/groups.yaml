    \ C++ 或其他语言中结束代码而你将每一行拆分出来，而不是全部写出来。\n\n考虑一下：\n\n```\ncout << endl; << Try();>>\
    \ endl; << 6-(7-1)>> endl;\nMath>> endl;\ntoday()>> endl;\n{\n  return 0\n}\n\
    ```\n\n但出于空间和实用主义的考虑，我们将特意避免这样做。）\n\n这将定义在公共访问说明符（public）中，以便我们可以在代码的主体内部调用它。初看起来看起来可能像这样：\n\
    \n```\nMammal giveBirth() {\n    isPregnant = false;\n    return new Mammal;\n\
    }\n```\n\n然而，这实际上是错误的。至少在理论上，这将试图修改整个类以及所有派自它的对象的私有值。相反，你可以通过这个关键字声明你想要更改给定特定实例的值，如下：\n\
    \n```\nMammal giveBirth() {\n    this->isPregnant = false;\n}\n```\n\n从它。相反，你可以通过这个关键字声明你想要更改给定实例的值，如下：\n\
    \n```\nMammal giveBirth() {\n    this->isPregnant = false;\n    return Mammal;\n\
    }\n```\n\n这将更改哺乳动物类特定实例的变量 `isPregnant`。继续将此代码添加到你的代码中。现在我们假设在章节剩余部分，我们开发了一个包含这个特定\
    \ `giveBirth` 函数的类。\n\n在进入继承概念之前，我们还需要讨论构造函数的概念。构造函数允许你在获取-设置时定义私有成员变量。有时，你可以在创建新对象时定义这些值，通过要求使用特定数据作为构造构造函数的参数来初始化对象。如果这看起来有点奇怪，不要担心，它很快就会完全清晰。\n\
    \n回顾我们对 `Mammal` 类的定义，你会注意到，在我们当前的迭代中，我们定义了哺乳动物是否怀孕。\n\n苏格拉底著名格言中逻辑推理的一个常见例子：\n\
    \n![](img/7da88c5734edd9e379c4ac84f3ca79bd_199_0.png)\n\n人皆有死。\n\n苏格拉底是人。\n\n\
    因此，苏格拉底是死的。\n\n这种逻辑公式允许我们根据先的更结晶的东西观察概念之间，并使用这些信息——首先人皆死，其次苏格拉底是人。\n\n因此，苏格拉底是死的。\n\
    \n这种逻辑公式允许我们朝着更结晶的东西观察概念，并根据先验信息（首先人皆死，其次苏格拉底是人）来得出苏格拉底是死的结论。\n\n逻辑的基础是寻找真理。那么，什么是真理？真理终究是某物为真或非真的状态。所有逻辑都归于此，因为逻辑是应用陈述的真理，以得出结论。\n\
    \n通过给定的语句寻找真理时使用的所有事物都可以被视为逻辑。这些陈述的最终结果可以被视为陈述的真理——真或假。\n\n正是从这一基本公理开始，我们实际上开始开发“表达式”的概念。通过表达式，我们实际上既能够定义陈述，也能定义该陈述的真理。连接两个语句及其关系的整个逻辑可以称为一个表达式。\n\
    \n你可以通过所谓的比较运算符（或对比运算符）来关联两个事物。（取决于谁在说话）\n\nC++ 中的比较运算符如下：\n\n完成此操作后，剩余的是函数体以及参数列表。查看问题的陈述，此函数接受两个\
    \ `integer` 类型的参数。因此，为这两个参数分配任何名称。然而，使用与上下文相关的名称很好。例如，整数 `a` 和 `b`。\n\n# 函数体\n\
    \n```\nInt multiply(int a, int b)\n{\n// 在程序的规范中，必须确定并解决整数的乘积。在返回存储函数结果的乘积变量之前进行声明可以实现这一点。如下文所示。\n\
    Int multiply(int a, int b);\n```\n\n在这个示例中，`int` 和 `b` 都可以以相同的方式在函数中使用。\n\n对于程序，必须确定并解决整数的乘积。在返回存储函数结果的乘积变量之前进行声明可以实现这一点。如下所示：\n\
    \n```\nInt multiply(int a, int b) {\n  Int product;\n  product = a * b;\n  return\
    \ product;\n}\n```\n\n返回类型和 `product` 变量被观察为具有相同类型。当函数没有要返回的数据类型时，不需要编写 `return`\
    \ 语句。在这种情况下，`void` 关键字作为函数名的前缀。`void` 表示函数为空。\n\n# 函数原型\n\n如果你想在另一个函数中使用函数，确保该函数在调用之前已声明是非常重要的。函数原型在这方面提供了优势。\n\
    \n# 结论\n\n感谢你读到《C++ 2 示例代码与 C++ 编程课程》的最后。希望这本书是有启发性的，并为你提供了实现目标所需的所有工具。\n\n你已经学了很多东西。C++\
