  mdcn: "\n一如既常，这些使用你类的程序总是希望与其交互，以便获取其内部的数据。在这种情况下，程序员提供了“getter（获取器）”和“setter（设置）”方法，以便该类的任何用户都能继续使用并与其交互。\n\
    \n大多数时候，setter 方法和 getter 方法将帮助你理解它们的作用。例如，你可以拥有 `GetName`、`SetName` 以及许多其他方法。\n\
    \n## 对象作为参数\n\n对象与任何其他数据类型相似，因此它们可以作为参数传递。按值调用和按引用调用都可以调用函数。当按值调用函数时，没有办法修改数据的原始副本。另一方面，按引用调用是有风险的，因为对数据的任何更改都是永久的。\n\
    \n## 多态与函数重载\n\n面向对象编程支持多态。多态允许人们对不同的输入类型使用同一个函数来达到不同的目的。多态的一个例子是函数重载。它是指单个函数支持不同类型的参数以实现各种功能的过程。请学习下面的示例。\n\
    \n如果语句内的内容为假，则该命题成立。这被称为否定操作符。它可以被读作“非”。\n\n你可以在所谓的 if 语句中使用这些内容。这是控制流的一个基本方面，实际上为你的程序提供了可以执行的操作。例如，你可以检查一个表达式是否为真，然后根据此采取行动，如下：\n\
    \n```cpp\nif (statement) {\n  // 代码位于内部\n}\n```\n\n然而，有时这并不足够。偶尔，你可能需要定义某种全捕获（catch-all），如果语句没有正常执行或者语句的条件不成立则执行。在这些情况下，你可以使用\
    \ `else` 语句。如果 if 语句的条件为假，这些将会启动。\n\n在这些情况下，你可以使用 `else` 语句。如果 if 语句的条件为假，这些将会启动。\n\
    \n如果语句为假。\n\n```cpp\n// 如果语句为真则运行\nif (statement) {\n    // 全捕获\n} else {\n  \
    \  // 全捕获\n}\n```\n\n当然，你可能还需要测试多个条件。在这些情况下，你实际上可以定义所谓的 `else if` 语句。这些语句位于语句和\
    \ `else` 语句之间。这些条件语句顺序测试条件，所以如果第一个语句不成立，那么如果 `else if` 真，则将测试 `else` 语句。如果两者都不成立，你可以根据需要创建多个\
    \ `else if` 语句来测试所有条件。\n\n如果语句为真\n\n```cpp\n// 如果 (statement2) 则运行\nif (statement)\
    \ {\n} else if (statement2) {\n} 以便测试所有条件。\n```\n\n## 适用于许多项目\n\n大多数其他编程语言只能专注于某一个或两个项目。例如，使用\
    \ JavaScript 意味着你将只是在网站上工作。但通过 C++，你可以使用它来帮助许多不同的项目。无论你是想开发网站，还是用编程做其他事情，你都可以在\
    \ C++ 的帮助下完成这一切。\n\n- 快速且可靠\n\n如果你用过过去流行的一些其他编程语言，你会发现它们有时并不最可靠。信息可能会泄露，或者它们不会按照你想要的方式工作。如果你想要一种第一次运行就能正常工作且可靠的东西，那么选择\
    \ C++ 是一个好主意。\n\n- 提供强大的力量\n\n那些喜欢编程工作并希望在创建项目时拥有巨大力量的人会发现 C++ 是他们选择的正确选项。它比你知道的所有其他编程语言提供了更多的力量。\n\
