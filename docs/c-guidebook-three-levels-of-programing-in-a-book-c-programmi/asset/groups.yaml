    \n你已经看到 C++ 程序支持面向对象。类用于定义对象。你学习了 C++ 程序的通用格式从一个或多个头文件开始，这些文件包含了定义的函数和类。通过 `#include`\
    \ 关键字，你可以使用这些文件并允许程序访问它们定义的类和函数。在头文件之后，接下来是在定义 (main) 函数之前声明全局变量。\n\n到目前，你已经阅读并尝试涵盖了内容，至少有些主题没有被涵盖。但这不应该是你阅读\
    \ C++ 语言的本书。要成为任何语言的专家，你需要阅读大量的书籍。因此，你的挑战是寻找高级 C++ 书籍并深化你的编程知识。\n\n"
