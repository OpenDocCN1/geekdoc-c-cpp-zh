  mdcn: "\n此前，我们还将学习如何使用文件输入流来打开和操作文件。\n\n![](img/7da88c5734edd9e379c4ac84f3ca79bd_120_0.png)\n\
    \n所以，让我们简要讨论一下这一点——输入流和输出流。我们已经在基础章节中涵盖了输入，但我们并没有真正进入到逻辑意义上可以认为是“无限”的程度；我们讨论的是与控制台相关的输入输出流。\n\
    \n然而，输入流和输出流只是一个模糊的概念；与其说是数据流的体现，不如说是符号。例如，输入流表示数据正在被程序接收。相反，输出流仅表示数据正在流出程序。这就是输入和输出流的全部含义。\n\
    \n## 第 2 章\n\n## C++ 表达式与变量作用域\n\n在上一节中，你已经看到表达式被定义为变量、操作符和常量的集合，表示一种计算。根据表达式中使用的操作数类型，表达式有不同的类别。这些表达式不仅存在于\
    \ C++ 程序中，也存在于 Java、Python 等其他语言中。\n\n## 常数表达式\n\n这些是只有常量值的表达式。常数表达式的示例包括 40、\"\
    b\" 和 4/2 + 8。\n\n## 整数表达式\n\n这些是在完成每次转换后，最终结果为整数的表达式。\n\n## 浮点数表达式\n\n这些表达式在完成每次转换后，产生浮点作为最终值。\n\
    \n## 布尔表达式\n\n这些表达式将产生 bool 类型。布尔表达式可以是假（False）或真（True）。它也被称为关系操作。\n\n## 逻辑表达式\n\
    \n逻辑表达式在整合两个或多个关系操作后输出一个 bool 类型。例如，y=4&&x=7 就是一个逻辑表达式。\n\n## 位运算表达式\n\n通过任何一系列事件被损坏。这始终是一个良好的实践习惯。你可以在\
    \ `if` 语句中这样做，如下所示：\n\n```\nif (my_file.is_open()) {\n\t// my_file.close();\n\
    }\n```\n\n```\nif (my_file.is_open()) {\n\t// 代码在此处\n}\n```\n\n现在，我们想要做的最后件事是非常基础的异常处理。让我们为这个函数定义一个\
    \ `else` 语句，如果 `my_file` 未打开，它将告诉用户打开文件出现问题。我们实际上可以处理得更细致一些，检查文件是否存在，但考虑到所有因素，这是一个非常好的起点。\n\
    \nmy_file.close();\n\n```\nif (my_file.is_open()) {\n    // 代码在此处\n    my_file.close();\n\
    } else {\n    cout << \"File could not be opened!\" << endl;\n}\n```\n\n```\n\
    目前，我们的代码看起来像这样：\n#include <iostream>\n#include <string>\n// 因为我们要处理字符串，所以必须定义一个字符串\n\
    using namespace std;\nint main() {\n    ofstream my_file(\"numbers.txt\");\n \
    \   if (my_file.is_open()) {\n```\n\n指针的声明方式与普通变量相同。唯一的区别是星号应该出现在数据类型和变量名之间。\n\
    \n```\nint *ptr; // 指向整数值的指针\ndouble *ptr; // 指向双精度浮数的指针\nchar *ptr; // 指向字符数组的指针\n\
    int **ptr; // 声明两个指向整数变量的指针\n```\n\nC++ 要求星号靠近变量名或位于中间。然而，你应该记住，这个星号并不是解引用符号。相反，它属于指针声明的语法。\n\
    \n而且，当你声明多个指针变量时，每个变量中都应该存在星号。如果你习惯将星号与类型而非变量名相关联，很容易忘记这一点。\n\n因此，建议将星号放在声明的变量旁边。然而，从函数返回的指针其星号应该靠近返回类型。\n\
    \n这让程序员知道函数将返回 *int* 而不是其他。\n\n## Int* disassembling()\n\n与普通变量一样，指针在声明时不会初始化。由于这个原因，它们包含垃圾值。关于指针命名的重要说明：“X\
    \ 指针”是“指针 X”的缩写。因此，当程序员说“一个整数指针”时，他或她基本上指的是指向整数的指针。\n\n## 给指针赋值\n\n由于指针具有地址，每当你给指针分配一个值时，该值都应该是一个地址。指针的一种常用做法是让它们存储另一个变量的地址。使用\
    \ `&` 操作符获取变量的地址。例如：\n\n```\nint var = 10; int *ptr = &var;\n```\n\n在下面演示这一点：\n\
    \n## 第 6 章\n\n## 使用指针\n\n到目前，你已经学习了如何编写和输入 C++ 语言。由于指针具有地址，每当你给指针分配一个值时，该值都应该是一个地址。指针的一种常用做法是让它们存储另一个变量的地址。使用\
    \ `&` 操作符获取变量的地址。例如：\n\nint var = 10; int *ptr = &var;\n\n在下面演示这一点：\n\n## 输出\n\
    \n在这个例子中，g 是一个全局变量。它不同于仅对 main 函数可见的局部变量 'a'。变量 'g' 可以在程序中的所有函数中使用。\n"
