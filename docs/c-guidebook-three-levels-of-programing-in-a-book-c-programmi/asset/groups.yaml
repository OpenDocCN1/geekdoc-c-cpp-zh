  mdcn: "\n然而，如果你想禁用警告，可以使用静默警告。\n\n## 提示\n\n禁用警告是一个非常糟糕的主意。这就像拔掉汽车上的检查引擎指示灯一样。记住：忽略问题并不是解决办法。\n\
    \n## 代码注释\n\n在对代码进行注释时，可以防止错误。养成在编写代码时就注释的习惯，而不是等写完之后再回来注释。注释是帮助你理解自己正在尝试做的事情的极佳方法。在修改程序时，简短的注释更好。\n\
    \n## 限制可见性\n\n减少类内部成员对外部世界的可访问性是面向对象编程的关键部分。类必须被视为成员来考虑。如果类中出现任何问题，那是程序员的错。\n\n\
    限制可见性要求数据成员以保护超出类范围的访问权限。简而言之，数据成员应该被保护。此外，应用程序软件不应该感知的成员函数也必须被保护。\n\n受保护的推测良好/\
    \ 如果你尝试使用它，你可能只会导致你的代码比实际需要的复杂得多。\n\n通用的做法是在私有（private）标记下定义你所有的属性，然后通过称为 `get;`\
    \ 和 `set;` 的函数进行修改。不过，在我们进入这些之前，让我们尝试修改我们的类，以便我们获得有效的 C++ 代码。\n\n```cpp\nclass\
    \ Mammal (\n    private:\n        int limbs = 4;\n        bool backbone = true;\n\
    \        bool isPregnant;\n\n    public:\n        // get; set; 方法可以放在这里\n);\n\
    ```\n\n```cpp\n// public:\n    // get; set; 方法可以放在这里\n    :();\n\n```\n\n有时，在方法中，你将需要以某种方式引用给定实例的特定类成员。你可以通过\
    \ `this->` 关键字和指针操作符来实现。例如：\n```\n\n借此，我们有了一个非常基础的 C++ 类定义，旨在定义哺乳动物。从这里开始，我们实际上可以开始讨论其他想法了。让我们谈谈实例引用的想法。\n\
    \n这在类定义中指的是 `limbs` 的定义，你可以专门针对给定的类对其进行更改。这意味着一个类的给定实例的值，实际上不需要在你的代码主体中进行操作。你可以在类的定义内部手动编写函数和语句，以更改类中数据成员的值。\n\
    \n所以，假设我们有一个名为 `giveBirth()` 的函数。在这里，我们需要假设给定的动物是怀孕的，并且此函数只有在动物怀孕时才会被调用。当然，你也可以专门检查这种情况，这就是明智程序员的\n\
    \n# 如果布尔表达式为真，则将执行 #语句(s)\n\n# 如果布尔表达式为假，则将执行 #语句(s)\n\n然后你可以根据意愿在 `if` 语句中添加尽可能多的此类点。如果你想尝试创建一个自己的程序，能够将人们分为五或六个不同的年龄，你可以在这些\
    \ `if-else` 语句的帮助下完成。你只需要额外添加一些 `else` 关键字来实现这一点。\n所以，让我们看看这一切是如何运作的，并保持非常简单。\n\
    假设你正在编写一个程序，要求用户求解方程 `2 + 2`。如果某人猜中了正确答案并输入了 `4`，你可以设置让第一部分为真语句，然后显示消息\n\n```cpp\n\
    {\n}\nElse\n{}\n```\n\n所以，让我们看看这一切是如何运作的，并保持简单。\n假设你正在编写一个程序，要求用户求解方程 `2 - 2`。如果某人猜中了正确答案并输入了\
    \ `4`，你可以设置让第一部分为真语句并出现在屏幕上。但是，如果你的用户想要告知用户是正确的，或者输入了除4以外的任何内容，那么程序将根据你设置的条件将答案赋值为假。与其留白，你可以添加另一个选项并获得另一个语句，如“抱歉，是正确的”，这样就会出现。\n\
    \n正如你所见，这为你操作程序提供了很大的自由度。你可以像上面做的示例那样让它保持简单，也可以添加其他内容使其变得更复杂，并确保它的兼容性，使其能与你编写的代码协同工作。\n\
    \n在处理语句时需要记住的另一点是，如果有需要，你可以添加更多的 `if-else` 语句，甚至将其中一些语句放在其他语句内部也是可能的。这对于初学者来说很复杂，但只要稍加练习并耐心学习如何使用语法，你会发现它将为这个过程增加大量的力量和灵活性，并使某些各种操作变得容易得多。\n\
    \n```cpp\n// 如果语句为真则运行\n// if (statement) {\n    // else if (statement) {\n  \
    \      // 如果语句为真则运行 ..\n    } else if (statement) {\n        // 如果语句为真则运行\n  \
    \  }\n    // 如果语句为真则运行\n} else {\n    // 捕获所有\n}\n```\n\n这是逻辑的首要用途。通过此，我们成功地将大量的离散数学浓缩成一节正洁的课程，并讨论了入门编程的主要支柱之一。在接下来的章节中，我们将构建……离散数学浓缩成一节正洁的课程，以及讨论了入门编程的主要支柱之一。在接下来的章节中，我们将构建……这对控制流是重要的。\n\
    \n## 缓冲错误流\n\n这是另一个 `istream` 类的实例，用于显示错误。然而，它与 `cerr` 不同，错误首先被插入缓冲区中，直到填满。错误消息也会出现在屏幕上。\n\
    \n仔细思考并尝试拆解它，你开始看到它是如何运作的。所有数据根据这些地址连接，并可以通过这些地址访问。\n\n你可以通过引用和引用的组合看到这些。这些理解起来有点复杂，但并不困难。\n\
    \n理解引用运算符指向变量的地址。该运算符就是符号符号 (&)。\n\n所以，假设我们有一个名为 `amountCats` 的变量。变量本身 `amountCats`\
    \ 在被引用时将引用 `amountCats` 空间中包含的显式拷贝。\n\n`&amountCats` 反之将专门指向变量的地址。你可以将其看作一个给定的位置。你可以引用特定位置的地址。当你引用某个特定位置时，你指的是类定义中\
    \ `limbs` 的定义——即，该处那个特定的 `Wendy's` 的地址。当你引用地址时，你指的是 `Wendy's` 当前所在空间中的任何内容，这仅仅是获取该地址的方法——它是在说，“嘿，给我\
    \ `Wendy's` 的地址。”\n\n`Wendy's` 在某个特定位置。当你引用餐厅 `Wendy's` 时，你指的是地址的概念——即，该处那个东西。当你引用地址时，你指的是\
    \ `Wendy's` 当前所在空间中的任何内容，这仅仅是获取该地址的方法。你可以通过解引用操作符来实现，该操作符是一个星号 (*)。\n\n现在，假设你想更改引用的地址，然后更改该特定地址的值。所以，例如，在一个闭合函数中，这些功能上具有相同的含义。\n\
    \n```cpp\nint myCats = 3;\nmyCats = 4;\n```\n\n```cpp\nint myCats = 3;\nint *myPtr\
    \ = myCats; // 创建一个名为 myPtr 的指针\nmyPtr = &myCats;\n```\n\n"
