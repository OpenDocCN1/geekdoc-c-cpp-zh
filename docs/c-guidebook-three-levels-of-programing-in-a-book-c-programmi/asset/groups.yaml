    \n但不要误解；无论是在 C++ 还是任何其他语言工作，总会有新东西供你学习，或者有新的范式供你尝试掌握。编程不是、也将永远关于知道底层的逻辑；相反，需要知道的是你能学到的所有东西。\n\
    \n总会有让你想要抓狂头发的时候，但重要的是无论发生什么你都要坚持下去，并不断尝试改进。即使你遇到那些无论如何都似乎无法解决的烦人 Bug，你也必须硬挺过去。\n\
