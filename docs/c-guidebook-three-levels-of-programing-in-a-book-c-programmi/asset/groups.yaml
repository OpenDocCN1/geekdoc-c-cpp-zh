    \n一旦你学会了如何使用 C++ 编程，这些只是你可以享受的优点……某些其他语言（如 Python）可能看起来这样，但它拥有你需要的很多力量，而且还可以与其他所有编程语言一起工作。通过练习，你将通过做很多事情掌握这门编程语言的所有基础，并真正享受以前从未想过的东西。\n\
