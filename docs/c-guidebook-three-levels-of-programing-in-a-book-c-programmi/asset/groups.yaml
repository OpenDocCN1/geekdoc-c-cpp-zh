  mdcn: "\n这是一条关于 C 语言的常用指令。C++ 语句是语言中最小的独立单元。编写 C++ 语句是为了向编译器发送消息，让其执行特定任务。C++ 语句以分号结尾，尽管并非每次都如此。随着学习的深入，你会遇到许多不同类型的\
    \ C++ 语句。目前，这里将不会涵盖这些内容。\n\n编译器在 C++ 程序的执行中至关重要。编译器会执行源代码。表达式描述了必须执行的计算。例如，当你小时候，你被教导\
    \ 3+2 等于 5。因此，在编程时，`3 * 2` 就是一个表达式，其结果为 5。\n\n## 表达式\n\n在 C++ 语言中，你会发现语句被分组为称为函数的特定单元。函数是按顺序方式定义的。每个\
    \ C++ 程序都应该有一个 `main` 函数。C++ 程序的执行从 `main` 函数后的第一个语句开始。创建函数是为了能够执行特定的工作。你将在后面的章节中学习到这些。\n\
    \n可以使用基本结构编写 C++ 程序。不过，本节使用了数学中的函数概念。首先，在编程中，函数不需要有参数。它们可以完成内部的所有事情并完全自成体系。然而，如果你愿意，也可以发送一个参数，供它们计算某些值。\n\
    \n给定的值可能是返回值。返回值也可以称为函数最终返回的值。在数学中，这就是你的 y 值。注意，在表达式 `(f(x)) = y` 中，我们实际上是在说这是你的\
    \ y 值，但我们将 `f(x)` 的值赋给 `f(x)`，这可能与 `y` 相同，而 `y` 是我们定义的变量——不是——我们将该值赋给 `y`，它是我们定义的变量。\n\
    \n同样地，在编程中创建函数时，你为它指定了要返回的值。这是函数本身的总值。同样，它也可以被用作值使用。它可以被存储在变量中，或在原始方程中使用。例如，假设我们想计算一个值然后加\
    \ 3。我们可以这样操作：\n\n```\ncomputeAreaOfSquare(3, 5) + 3;\n```\n\n这将得到最终值 18。（3 * 5\
    \ = 15 + 3 = 18）\n\n例如，假设我们想计算一个面积然后加 3。我们可以这样做：\n\n```\ncomputeAreaOfSquare(3,\
    \ 5) + 3;\n```\n\n这将得到最终值 18。（3 * 5 + 3 = 18）\n\n你也可以调用一个函数。调用函数等同于使用它。上面就是调用函数的示例。然而，由于\
    \ C++ 是以线性方式处理程序的，你必须在调用函数之前定义它，或者进行所谓的“原型声明”（然后在调用它之后再定义它）。\n\n在定义函数时，你必须说明返回类型。返回类型是函数返回的值的类型。`Void`\
    \ 意味着什么都不返回。这对于为你的程序增加模块化并将某些内容封装成较小的部分非常有用，这样你的函数就不会只是一长块代码。\n\n函数的定义如下：\n\n\
    ```\n// 在此处代码\ntype function(argumentX, argumentY, ...) {\n  return value;\n}\n\
    ```\n\n## C++\nC++ 编程基础与概念中级课程指南\n\n## 让我们进入类声明\n\n被称为成员函数。如果某个类的变量没有定义该类，则无法使用它们。然而，你仍然可以通过描述它持有的任何成员数据来声明一个类，并为其提供一个可用函数列表以及函数接受的参数类型。通常，这发生在以\
    \ `.h` 后缀结尾头文件中。此外，人们可以在单独的类中定义函数。\n\n假设你想监控某门课程的学生。细节将包括学生的姓名、期中成绩和该课程的项目成绩。当你想要计算课程总分时，这些成绩将非常有用。\n\
    \n对象是类的实例。没有对象的类类型被称为抽象类。另一方面，具体类是包含对象的类。每个对象都有自己的行为、身份和状态。对象的身份指的是它的唯一属性。对象的函数是类的实例。没有对象的类类型被称为抽象类。另一方面，具体类是包含对象的类。每个对象都有自己的行为、身份和状态。对象指的是它的唯一属性。对象可以具有静态身份或动态属性。对象的函数暗示了对象的行为。以下是你想声明类时需要使用的语法：\n\
    \n```cpp\n// 写 private 访问修饰符是可选的\nclass Class {\n    protected data_members;\n\
    \    private data_members;\n    protected member_function;\n    public member_function;\n\
    \    private member_function;\n}\n```\n\n## 公有与私有\n\n声明为“公有”的数据成员和函数只能由类外部的代码访问。然而，声明为“私有”的函数只能由已声明的代码使用。作为一名程序员，你需要了解私有属性\n\
    \n## 网页\n\n有很多网页依赖于 C++ 语言，因为这种语言很容易操作，你可以用它快速制作任何网站。像 eBay 这样流行的网站就使用了这种语言。\n\
    \n## 手机应用\n\n如果你喜欢使用智能手机并尝试各种应用程序，你可能会发现使用 C++ 可以让它们变得更好。这种编程语言可以帮助你快速创建手机应用。\n\
    \n## C++ 的历史\n\nC++ 是一门历史悠久的编程语言，因为它实际上是编程语言的起点。它在计算机……\n\n## C++ 的历史\n\nC++ 是一门历史悠久的编程语言，因为它实际上是编程语言的起点。它在计算机编程还未成为一种事物之前就已经存在。在人们开始以此为生之前，它一直追溯到\
    \ 1979 年的网络黑客时代。这就是计算机历史可以追溯的远度。没有没有其他编程语言可以追溯到这么远。\n\nBjar Stroustrup 正在写他的博士论文，他决定使用一种名为\
    \ Simula 的编程语言。Simula 是计算机时代最早的编程语言之一。然而，它非常缓慢且充满了 Bug。\n\nStroustrup 提出了“带类的\
    \ C语言”的想法。一种比 Simula 更快的编程语言，“带类的 C语言”后来变成了 `Cfront`，它加速了编程语言的创建，因为它为语言增加了编译器，使其比任何\
    \ C 语言都更容易、更快，甚至比当时的任何其他编程语言都更容易使用。从那以后，出现了注释参考指南和语言更新，使其变得更好、更快，也更容易使用。《C++ For\
    \ Dummies》是该编程语言的一本流行指南。\n"
