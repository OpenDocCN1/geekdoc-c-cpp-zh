  mdcn: "\n现在几乎不知道如何创建一个带有行文本的控制台窗口吗？\n\n嗯，此外，我可以告诉你，这并不像它看起来那么困难。在本章中，我们将学习两个重要概念——值和变量的定义，学习你如何操作这些东西，以及你如何将它们结合起来使你的程序既活跃又具有交互性。\n\
