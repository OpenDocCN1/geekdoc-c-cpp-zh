    \ \"addition\" using the statement:\n\n# Chapter 5\n\n# C++ Functions\n\nIn this\
    \ Chapter, you will learn more about functions.\n\nYou know very well that if\
    \ you have a large program that has few instructions to process, it is difficult\
    \ for one to understand, manage and maintain it. Well, functions in the C++ program\
    \ help one achieve a given task and it facilitates the concept of modular programming\
    \ design. To help you see the importance of functions in a program, read the example:\n\
    \nAssume you have a program that prompts users to enter two values' average. First,\
    \ how can you program then computes the two values'? average? The screenshot below\
    \ has this problem? develop a solution to it your code solution may appear.\n\n\
    ```cpp\n#include <iostream>\n\nint main() {\n    float number1, number2;\n   \
    \ std::cout << \"Enter first number: \";\n    std::cin >> number1;\n    std::cout\
