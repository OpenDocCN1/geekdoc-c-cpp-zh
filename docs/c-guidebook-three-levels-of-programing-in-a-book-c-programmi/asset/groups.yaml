    \n“if”语句。在涉及条件语句时，你可以创建的最基本的东西之一就是语句。这些是基于真（true）或假（false）语句的。如果系统判断输入匹配你设置的条件，程序将运行你添加它的部分。例如，如果你将其设置为\
    \ 2+，用户输入了正确答案 4，那么这将被视为真，并且你选择的消息，类似于“正确！”将显示在屏幕上。\n\n每当你让用户输入某些信息时，并且如果添加的信息符合或其他事情符合你的条件，那么它就会继续显示语句。或者，如果用户输入了错误答案会发生什么呢？但如果用户输入问题“2+2\
    \ 等于？”会发生什么？如果用户输入 5 作为答案，代码将无法满足你设置的条件，程序将认为此为假。\n\n由于 if 语句是条件语句最基本的形式之一，你会发现它不能很好地处理错误答案。如果用户输入任何非\
    \ 4 的数字作为答案，程序将认为这是假。然后我们放置的问题，\n\n由于 if 语句是条件语句最基本的形式之一，你会发现它不能很好地处理错误答案。如果用户对我们放置的问题输入任何非数字的答案，那么语句将是为假的，因为它会留空屏幕，没有其他事情会发生。这是因为你想写代码，而这就是为什么你不会总是发现自己一直在和\
    \ if 语句工作。\n\n# 'if' 语句\n\n正如我们在前面的部分讨论的那样，使用 if 语句会让你在过程中遇到一些局限性。如果用户最终输入了错误答案，并且程序根据代码中设置的条件认为此为假语句，你会有各种问题需要修复的问题。这就是\
    \ 'else' 语句派上用场的地方。\n\nif 语句可以用于各种情况。它不仅能帮助满足你的条件，而且有时你可能想让用户开始从几个不同的选项中进行选择。if\
    \ 语句可以帮助你完成这一切，而且它的语法非常简单。为了创建一个语法的示例：\n\n```cpp\nif(boolean_expression)\n```\n\
