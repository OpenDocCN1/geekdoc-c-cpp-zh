    \nAs you can see, when you use inheritance, you only write the functions rather\
    \ than three times because the three classes have inherited from the base class.\n\
    \n# How to Implement Inheritance in C++\n\nTo create a subclass inherited by the\
    \ base class, use this syntax:\n\n```cpp\nclass subclass_name : access_mode base_class_name\n\
    {\n    // body of subclass\n}\n```\n\nIn this syntax, the name of the subclass\
    \ is subclass_name.\n\n```cpp\nclass subclass_name : access_name base_class_name\n\
    \    // body of subclass\n```\n\nIn this syntax, the name of the subclass is subclass_name.\
    \ Access_mode is the method one would want to inherit the subclass. This can either\
    \ be public or private. The name of the base class to inherit the subclass is\
    \ base_class_name.\n\n# Note\n\nA protected member cannot be accessed by a derived\
    \ class. However, it inherits a complete parent object that has private members\
    \ declared by the class.\n\n```cpp\n// Example implementation \n// of Inheritance\n\
    // https://cppreference.com/w/cpp/inheritance\n\nclass BaseClass {\npublic:\n\
    \    int x;\n};\n\n// Subclass Inheriting from BaseClass(Parent)\nclass subclass\
    \ : BaseClass {\npublic:\n    int y;\n};\n```\n\nIt is composed of the name, parameter\
    \ list, and function return type. The basic syntax of a function prototype resembles\
    \ the syntax of a function header. It should end with a semicolon.\n\nThe prototype\
    \ of a function tells the compiler that a function is defined at a given location\
    \ in the program. The compiler immediately goes to that location once the function\
    \ is called. Shown below an example of how to write the previous program's function\
    \ header.\n\n```cpp\nint mult(int a, int b);\n```\n\nAs we had said earlier, a\
    \ function prototype describes the 'name', parameters and 'return type'. As part\
    \ of the style used in formatting, function header should be declared after constant\
    \ and global variables and preprocessor directives. Many built-in C++ functions\
