    \ (number1 + number2) / 2;\n    std::cout << \"Average is: \" << average << std::endl;\n\
    \    return 0;\n}\n```\n\nIf you have a program that prompts users to enter two\
    \ values' average. First, how can you program then computes the two values'? average?\
    \ The screenshot below has this problem? develop a solution to it your code solution\
    \ may appear.\n\nAnother good question is what do you when you want to calculate\
    \ the percentages of each number? To develop a solution based on the knowledge\
    \ we have, we would write a code similar to:\n\n```cpp\n    int numbers[] = {10,\
    \ 20, 30, 40, 50};\n    int sum = 0;\n    for (int i = 0; i < 5; i++) {\n    \
    \    sum += numbers[i];\n    }\n    for (int i = 0; i < 5; i++) {\n        int\
    \ percentage = (numbers[i] * 100) / sum;\n        System.out.println(numbers[i]\
    \ + \" is \" + percentage + \"%\");\n    }\n```\n\n# For loop Variations\n\nThe\
    \ for loop still allows you to add more than one expression in the initialization\
    \ section as long as you separate the expressions using commas. Also, you can\
    \ include another increment expression. But the test expression can only be one.\
    \ Here's an example to check out:\n\n```cpp\nfor (int i = 38; i < 100; i += 5)\
    \ {\n    // body of loop\n}\n```\n\nIn this example, there is a normal loop variable\
    \ j. There is also another initialization of variable alpha and decrement of variable\
    \ beta. Note how they are separated by commas.\n\n# While Loop\n\nThe for loop\
    \ will perform an action in a fixed number of times. The meantime, you will never\
    \ know how many times the loop performs an action. Look at the example below:\n\
    \n![](img/7da88c5734edd9e379c4ac84f3ca79bd_107_0.png)\n\n```cpp\nint counter =\
    \ 0; // if counter isn't initialized to 0\nwhile (counter < 10) {\n    System.out.println(\"\
    counter = \" + counter);\n    counter++;\n}\n```\n\nThis program prompts the user\
    \ to enter a sequence of numbers, but once 0 is entered, the loop ends. You should\
    \ see that the program has no way to tell the number of times the user will enter\
    \ the numbers before finally entering 0.\n\nThe while loop is like a simple version\
    \ of the for loop. It has test expression but without initialization and increment\
    \ expressions.\n\n# The do loop\n\nThe test expression is established at the beginning\
    \ of the loop. The body of the loop will not be executed if it has a false test\
