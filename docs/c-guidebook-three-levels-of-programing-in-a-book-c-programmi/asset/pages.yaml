    implies is there is a specific type of data which is not privy to a class and
    cannot access it outside the class. This is often seen as a good thing because
    if a different programmer comes in and changes data in the class, there could
    be dire consequences. So by providing an option for other programmers to look
    at the interface that you provide, minimize chances of such things happening.


