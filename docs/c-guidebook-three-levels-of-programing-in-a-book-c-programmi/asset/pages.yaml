    This is also referred to as automatic type conversion because the conversion happens
    automatically. The compiler does the conversion by itself. Therefore, anytime
    a compiler comes across an expression that has different types, it will first
    convert the data types into one type. For example, char and short int are automatically
    converted into int.'
