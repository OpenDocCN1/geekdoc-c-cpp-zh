  md: '# Type Conversion


    An expression can have both variables and constants of different or similar data
    types. However, when an expression has different data types, the data types must
    first be converted into one form.


    One of the major reasons why expressions with different data types should be converted
    into one type is to eliminate compatibility issues. This is usually done through
    type conversion. Type conversion involves changing a predefined data type into
    another form. Type conversions include implicit conversion and explicit conversion.
    Let''s look at each conversion type separately.


