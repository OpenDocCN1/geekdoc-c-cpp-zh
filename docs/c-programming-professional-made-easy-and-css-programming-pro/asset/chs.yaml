  \n要修复这个问题，编辑你看到的错误所在行并将其改为：\n\n```ruby\n@article = Article.new(params.require(:article).permit(:title,\
  \ :text))\n```\n\n## 显示你的成果\n\n为了让页面显示文章，你可以通过 `app/controllers/articles_controller.rb`\
  \ 添加 `show` 动作：\n\n```ruby\nclass ArticlesController < ApplicationController\n \
  \ def show\n    @article = Article.find(params[:id])\n  end\n\n  def new\nend\n\
  ```\n\n现在添加一些样式。创建一个名为 `app/views/articles/show.html.erb` 的文件并放入以下内容：\n\n```ererb\n\
  <p>\n  <strong>Title:</strong>\n  <%= @article.title %>\n</p>\n\n<p>\n  <strong>Text:</strong>\n\
  \  <%= @article.text %>\n</p>\n```\n\n刷新 `http://localhost:3000/articles/new`，你就会可以创建并显示文章了！\n\
  \n# 第 9 章 让你的文章整洁\n\n找到一种方法列出你要创建的所有文章，以便数据库井井。为此，打开 `app/controllers/articles_controller.rb`\
  \ 并添加以下内容进行控制：\n\n```ruby\nclass ArticlesController < ApplicationController\n  def\
  \ index\n    @articles = Article.all\n  end\n\n  def show\n    @article = Article.find(params[:id])\n\
  \  end\n\n  def new\nend\n```\n\n现在，为了添加视图，打开 `app/views/articles/index.html.erb`\
  \ 并添加以下内容：\n\n```ererb\n<h1>Article List</h1>\n<table>\n  <tr>\n    <th>Title</th>\n\
  \    <th>Text</th>\n  </tr>\n  <% @articles.each do |article| %>\n    <tr>\n   \
  \   <td><%= article.title %></td>\n      <td><%= article.text %></td>\n    </tr>\n\
  \  <% end %>\n</table>\n```\n\n访问 `http://localhost:3000/articles`，你会看到你目前创建的所有文章。\n\
  \n## 使用链接进一步整理\n\n你确实需要为已创建的文章创建链接，以便读者可以轻松查看。要添加链接，打开 `app/views/welcome/index.html.erb`\
  \ 并将其改为：\n\n```ererb\n<h1>Hello, Rails!</h1>\n<%= link_to 'My Blog', controller:\
  \ 'articles' %>\n```\n\n现在，如果你想添加一个可以立即编写新文章的链接怎么办？你只需要在 `app/views/articles/index.html.erb`\
  \ 中添加以下内容来获得 New Article 链接：\n\n```ererb\n<%= link_to 'New article', new_article_path\
  \ %>\n```\n\n如果你想创建一个返回之前的链接，在同一个文件中添加以下内容：\n\n```ererb\n<%= form_for :article,\
  \ url: articles_path do |f| %>\n  ...\n<% end %>\n\n<%= link_to 'Back', articles_path\
  \ %>\n```\n\n# 第 10 章创建规则\n\n创建博客程序时，你不希望用户意外提交空白页面，然后直接回到原来而不知道他们做了什么。`Rails` 可以通过编辑\
  \ `app/models/article.rb` 文件来帮助确保这种情况不会发生：\n\n```ruby\nclass Article < ActiveRecord::Base\n\
  \  validates :title, presence: true,\n             length: { minimum: 5 }\nend\n\
  ```\n\n这意味着标题至少要有 5 个字符，文章才能通过，否则它不会被保存。现在博客的规则已经就绪，你需要向博客用户显示发生了错误，并且表单应该正确填写。为此，调整\
  \ `app/controllers/articles_controller.rb` 中的 `create` 和 `new` 动作如下所示：\n\n```ruby\n\
  def new\n  @article = Article.new\nend\n\ndef create\n  @article = Article.new(article_params)\n\
  \  if @article.save\n    redirect_to @article\n  else\n    render 'new'\n  end\n\
  end\n\nprivate\n\n  def article_params\n    params.require(:article).permit(:title,\
  \ :text)\n  end\n```\n\n为了向用户展示这个，在 `app/views/index.html.erb` 中添加以下内容：\n\n```ererb\n\
  <table>\n  <tr>\n    <th>Title</th>\n    <th>Text</th>\n    <th></th>\n  </tr>\n\
  \  <% @articles.each do |article| %>\n    <tr>\n      <td><%= article.title %></td>\n\
  \      <td><%= article.text %></td>\n      <td><%= link_to 'Show', article_path(article)\
  \ %></td>\n      <td><%= link_to 'Edit', article_path(article) %></td>\n    </tr>\n\
  \  <% end %>\n</table>\n```\n\n# 第 11 章 更新文章\n\n你希望用户对他们刚刚写的文章改变主意。这涉及 `update`\
  \ 动作，提示你在 `ArticlesController` 中添加：\n\n```ruby\ndef new\n  @article = Article.new\n\
  end\n\ndef edit\n  @article = Article.find(params[:id])\nend\n```\n\n为了允许此视图，创建一个文件并命名为\
  \ `app/views/articles/edit.html.erb`，然后放入：\n\n```ererb\n<h1>Editing article</h1>\n\
  <%= form_for :article, url: article_path(@article), method: :patch do |f| %>\n \
  \ <% if @article.errors.any? %>\n    <div id=\"error_explanation\">\n      <h2><%=\
  \ pluralize(@article.errors.count, \"error\") %> prohibited this article from being\
  \ saved:</h2>\n      <ul>\n        <% @article.errors.full_messages.each do |msg|\
  \ %>\n          <li><%= msg %></li>\n        <% end %>\n      </ul>\n    </div>\n\
  \  <% end %>\n\n  <p>\n    <%= f.label :title %><br>\n    <%= f.text_field :title\
  \ %>\n  </p>\n\n  <p>\n    <%= f.label :text %><br>\n    <%= f.text_area :text %>\n\
  \  </p>\n\n  <p>\n    <%= f.submit %>\n  </p>\n<% end %>\n\n<%= link_to 'Back',\
  \ articles_path %>\n```\n\n现在，你需要在 `app/controllers/articles_controller.rb` 中创建\
  \ `update` 动作：\n\n```ruby\ndef update\n  @article = Article.find(params[:id])\n\
  \  if @article.update(article_params)\n    redirect_to @article\n  else\n    render\
  \ 'edit'\n  end\nend\n```\n\n\n\n\n\n```ruby\ndef update\n  @article = Article.find(params[:id])\n\
  \  if @article.update(article_params)\n    redirect_to @article\n  else\n    render\
  \ 'edit'\n  end\nend\n\nprivate\n\n  def article_params\n    params.require(:article).permit(:title,\
  \ :text)\n  end\nend\n```\n\n为了显示“编辑”（Edit）链接，你可以修改 `app/views/articles/index.html.erb`，让该链接出现在“显示”（Show）链接之后。\n\
  \n```html\n<table>\n  <tr>\n    <th>Title（标题）</th>\n    <th>Text（正文）</th>\n    <th\
  \ colspan=\"2\"></th\n  </tr>\n  <% @articles.each do |article| %>\n    <tr>\n \
  \     <td><%= article.title %></td>\n      <td><%= article.text %></td>\n      <td><%=\
  \ link_to 'Show（显示）', article_path(article) %></td>\n      <td><%= link_to 'Edit（编辑）',\
  \ edit_article_path(article) %></td>\n    </tr>\n  <% end %>\n</table>\n```\n\n\
  现在，为了让用户有机会编辑他的作品，请在模板 `app/views/articles/show.html.erb` 中添加这些行：\n\n...\n\n```html\n\
  <%= link_to 'Back（返回）', articles_path %> |\n<%= link_to 'Edit（编辑）', edit_article_path(@article)\
  \ %>\n```\n\n# 第 12 章 删除某些数据\n\n不，这并不意味着你要毁掉构建的整个程序。在这个阶段，你需要为用户提供删除其所写的某些文章的功能。由于你正在创建一个\
  \ RESTful 程序，你将需要使用以下路由：\n\n`DELETE /articles/:id(.:format) articles#destroy`\n\n\
  此路由使得 Rails 能够轻松删除资源，你需要确保它被放置在保护方法或私有方法之前。让我们在 `app/controllers/articles_controller.rb`\
  \ 文件中添加这个 action：\n\n```ruby\ndef destroy\n  @article = Article.find(params[:id])\n\
  \  @article.destroy\n  redirect_to articles_path\nend\n```\n\n执行此操作后，你会发现 `app/controllers/articles_controller.rb`\
  \ 中的 `ArticlesController` 现在如下所示：\n\n```ruby\nclass ArticlesController < ApplicationController\n\
  \  def index\n    @articles = Article.all\n  end\n  def show\n    @article = Article.find(params[:id])\n\
  \  end\n  def new\n    @article = Article.new\n  end\n  def edit\n    @article =\
  \ Article.find(params[:id])\n  end\n  def create\n    @article = Article.new(article_params)\n\
  \    if @article.save\n      redirect_to @article\n    else\n      render 'new'\n\
  \    end\n  end\n  def update\n    @article = Article.find(params[:id])\n    if\
  \ @article.update(article_params)\n      redirect_to @article\n    else\n      render\
  \ 'edit'\n    end\n  end\n  def destroy\n    @article = Article.find(params[:id])\n\
  \    @article.destroy\n    redirect_to articles_path\n  end\n  private\n    def\
  \ article_params\n      params.require(:article).permit(:title, :text)\n    end\n\
  end\n```\n\n现在，是时候让用户知道他们有这个选项了。打开 `app/views/articles/index.html.erb` 文件并添加以下行：\n\
  \n```html\n<h1>Listing Articles（文章列表）</h1>\n<%= link_to 'New article（新建文章）', new_article_path\
  \ %>\n\n<table>\n  <tr>\n    <th>Title（标题）</th>\n    <th>Text（正文）</th>\n    <th\
  \ colspan=\"3\"></th\n  </tr>\n  <% @articles.each do |article| %>\n    <tr>\n \
  \     <td><%= article.title %></td>\n      <td><%= article.text %></td>\n      <td><%=\
  \ link_to 'Show（显示）', article_path(article) %></td>\n      <td><%= link_to 'Edit（编辑）',\
  \ edit_article_path(article) %></td>\n      <td><%= link_to 'Delete（删除）', article_path(article),\n\
  \              method: :delete,\n              data: { confirm: 'Are you sure?（你确定吗？’)\
  \ } %></td>\n    </tr>\n  <% end %>\n</table>\n```\n\n你会注意到你还添加了一个功能，让用户确认他是否真的想要删除提交的文章。现在，为了让确认框出现，你需要确保你的机器中拥有\
  \ `jquery_ujs` 文件。\n\n# 结语\n\n再次感谢你下载这本书！\n\n希望这本书能够帮助你掌握 Ruby on Rails 的基础知识，并让你能够根据书中讨论的代码和流程创建一个网页。\n\
