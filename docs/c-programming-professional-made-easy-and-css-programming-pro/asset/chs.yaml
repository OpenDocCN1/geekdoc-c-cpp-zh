  * 第 10 章 创建一些规则\n* 第 11 章更新文章\n* 第 12 章 删除某些数据\n\n## 《一天学会 C 编程》预览\n\n### 引言\n\n\
  我想感谢并祝贺你下载《专业编程：轻松入门：针对任何电脑用户的专家 Rails 编程一日成功！》\n\n本书包含了学习 Ruby on Rails 的证明步骤。Rails\
  \ 是最新且流行的平台之一。由于互联网的增长，该平台一直针对对设计感兴趣的受众。\n\n# 第 1 章 为什么 Rails 很重要\n\n如果你是一名程序员，`Ruby\
  \ on Rails` 平台可能是你需要学习的下一个程序。如果你的工作主要基于设计，并且你想尝试一些让网站易于操作且漂亮的东西，那么它值得关注。它也可能是开启你职业或在办公室里创造筹码的平台。是的，这个平台可能是你晋升的王牌，或者是你想要的那个网站。\n\
  \n### Rails 能为你做什么\n\n如果你好奇这个程序对大多数电脑用户能做什么，这里是你可以从中获得的优点。\n\n#### 1. 编写代码\n\n编码并不是火箭科学，如果你使用\
  \ `Ruby`，你可能甚至感觉不到在使用在使用编程语言。你会想要学习编码以记住你在平台上的体验，所以还是花时间学习吧。\n\n如果你开始学习 `Rails`，你不需要计算机科学专业。如果你是一个对\
  \ Web 应用非常有意的商人，并想自己尝试编写，那么这个平台可能是你的最佳选择。\n\n#### 2. 编写更好的代码\n\n有时并不是争论哪个平台是最好的，并在\
  \ `Python`、`Java`、`PHP` 或 `Ruby` 之间争得不可开。如果你已经熟悉了其他编程语言，你仍然需要跟上时潮流并学习新技巧。`Ruby on\
  \ Rails` 提供了这种机会。\n\n#### 3. 编写更快的代码\n\n`RoR` 是一个美丽的平台，允许你编写更短的代码，并且拥有一套很棒的异常处理功能，使其非常容易发现和处理可能的错误。你不再需要维护扩展库中常见的引用计数。你还可以从\
  \ `C` 使用 `Ruby` 的优秀支持，这让你在想要编写 `C` 扩展时拥有更好的控制。\n\n\n\n\nRoR 让任何程序员都变得高效，因为它具有主见性（opinionated），并且会对你如何以最可能的方式编写代码给出建议。RoR\
  \ 的“不要重复自己”（DRY）原则还让你跳过那些反复编写代码的常规编码过程，这些过程通常会导致代码冗长、复杂且难以调试。这意味着在项目结束时，你可以查看代码，并更好地理解那里发生了什么。\n\
  \n## 4. 了解 Twitter 是如何运作的\n\n是的，Twitter 是使用 RoR 创建的。如果你是一个 SEO 专家、网页设计师或仅仅是一个技术极客，了解这个社交媒体平台是如何构建的绝对对你有所帮助。你还会发现，今天许多热门的新网站都是在这个平台上构建的。\n\
  \n## 5. 学习一个拥有优秀社区的平台\n\n与其他编程语言相比，RoR 相对年轻，正因如此，它拥有一个非常活跃且协作紧密的社区。你绝对能与其他几个开发者交流，并可能一起构建某些东西。这对你的简历总是有益的。\n\
  \n## 6. 它支持所有的操作系统，并提供独立于操作系统的线程。这意味着它具有非常良好的移植性，甚至可以在运行 Windows 95 的计算机上运行。\n\n\
  如果这些优点听起来很棒，那么是时候开始你的 Rails 项目了！\n\n# 第 2 章 入门\n\n如果你想学习如何使用 Rails，你首先需要准备以下内容：\n\
  \n1\\. `Ruby` – 选择 `1.9.3` 或更高版本的语言。你可以通过访问 `ruby-lang.org` 下载它。\n\n2\\. `RubyGems`\
  \ 打包系统 – 它通常随着版本为 `1.9` 或更高的 `Ruby` 一起安装。\n\n3\\. 安装 `SQLite3` 数据库\n\n正如你可能猜到的那样，Rails\
  \ 是一个用 `Ruby` 语言编写的、专注于 Web 应用程序开发的框架。这意味着你需要学习一点 `Ruby` 编码，以消除进入 `Rails` 时的任何困难。如果你打开了浏览器，可以通过登录\
  \ `tryruby.org` 在练习 `Ruby` 代码方面获得极大的帮助，那里提供了一个非常棒交互交互式教程。先尝试一下，掌握使用 `Ruby` 编码的感觉。\n\
  \n如果你还没有任何可用的 `SQLite 3`，可以在 `sqlite.org` 找到它。你也可以在那里获取安装说明。\n\n### 安装 Rails\n\n\
  1\\. 运行 `Rails` 安装程序（适用于 Windows 和 Mac 用户）或 `Tokaido`（Mac OS X 用户）\n\n2\\. 通过在开始菜单上运行\
  \ `Run` 命令，然后在提示符中输入 `cmd`（Windows）来检查电脑上安装的 `Ruby` 版本。如果你在 Mac OS X 上运行，启动 `Terminal.app`。\n\
  \n输入 `$ ruby –v`（无说明文字）。按下回车后，你将看到已安装的 `Ruby` 版本。\n\n3\\. 输入 `$ sqlite3 –version`\
  \ 检查安装的 `SQLite3` 版本。\n\n4\\. 安装 `Rails` 后，在 `Terminal.app` 或命令行提示符中输入 `$ rails\
  \ –version`。如果显示类似 `Rails 4.2.0` 的内容，那么你就可以准备了。\n\n### 关于 $ 符号的说明\n\n在本书中使用 `$`\
  \ 符号是为了看起来像终端提示符，你可以在其后输入代码。如果你在 Windows 上使用 `Rails` 平台，你会看到类似这样的内容：`c:\\source_code>`。\n\
  \n# 第 3 章 创建你的第一个项目\n\n这是大多数 Web 开发者都在推崇 `Rails` 的点之一：它带有生成器（generators），或者说是为了让开发变得简单得多的脚本，它们提供了启动特定项目所需的所有内容。在这些脚本中，有一个新的应用生成器，它为你的新\
  \ `Rails` 应用提供了所需的结构，这样你不需要自己写一个了。现在这让你可以直接进入代码编写！\n\n由于你极可能要构建一个网站或 API（应用程序接口），你可能想开始编写一个博客应用程序。要开始，启动终端并进入任何你可以创建文件的目录。在提示符上输入\
  \ `$ rails new blog`。\n\n按下回车后，`Rails` 将开始在目录中创建一个名为 `Blog` 的应用程序。它还会开始创建你已经在 `Gemfile`\
  \ 中列出的 gem 依赖，并执行 `bundle install`。\n\n现在，输入 `$ cd blog` 进入你的博客应用所在目录。\n\n### 里面有什么？\n\
  \n一旦你进入该目录，你会发现 `Rails` 默认已经安装了许多文件。如果你不太确定这些文件的用途，这里是这些文件或文件夹功能的简要介绍：\n\n1\\. `app/`\
  \ - 包含你刚刚创建的应用的模型（models）、助手（helpers）、邮件发送器（mailers）、资源（assets）和控制器（controllers）。你以后会更多地关注这个文件夹。\n\
  \n2\\. `bin/` - 包含你将用于运行应用的脚本。还包含了你将用于部署、设置或运行你将创建的应用的其他脚本。\n\n3\\. `config/` -\
  \ 允许你调整应用的数据库、路由等。\n\n4\\. `config.ru` - 这是基于 `Rack` 的服务器用于运行运行的配置。\n\n5\\. `db/`\
  \ - 包含你的数据库和数据库迁移（migrations）。\n\n6\\. `Gemfile`, `Gemfile.lock` - 这些允许你告诉程序你正在构建的应用需要什么种的\
  \ gem 依赖。\n\n7\\. `lib/` - 包含应用所需的扩展模块。\n\n8\\. `log` - 包含应用的日志文件。\n\n9\\. `public/`\
  \ - 这是唯一一个其他人能看到的文件夹。它包含了你所有编译后的资源和创建的静态文件。\n\n10\\. `Rakefile` - 该文件将用于定位并加载可以从命令行运行的任务。你可以在\
  \ `lib` 目录中添加你偏好的任务。\n\n11\\. `README.rdoc` - 就像 readme 一样，这是一个简要文档，告诉其他人它是如何运作的、如何设置等。\n\
  \n12\\. `test/` - 包含你所有的单元测试和测试所需的所有内容。\n\n13\\. `tmp/` - 存放所有的临时文件。\n\n14\\. `vendor/`\
  \ - 包含所有供应商（vendored）gems。\n\n### 启动 Web 服务器\n\n由于你已经有了应用程序的骨架，你可能想设置应用如何在互联网上启动。要启动\
  \ Web 服务器，请进入 `blog` 所在的目录，然后输入 `$ bin/rails server`。\n\n**重要提示：**\n\n如果你想使用 JavaScript\
  \ 资源压缩或编译 CoffeeScript，你的电脑上需要可用的 JavaScript 运行时。否则，当你尝试编译这些资源时，会看到 `execjs` 错误。如果你想查看所有支持的运行时，可以访问\
  \ `github.com/sstephenson/execjs#readme`。\n\n\n\n控制器的目的是允许你的程序接收任何请求。当你进行路由（route）时，你实际上是让\
  \ Rails 决定你设置的哪些控制器将接收何种类型的请求。这可能意味着会有不同的路由指向该控制器，并由特定的动作（action）触发。需要一个 `action`\
  \ 来收集发送到视图（view）所需的任何信息。\n\n## 2. 视图 (View)\n\n这个东西的主要目的是让 Rails 能够显示提供给动作的信息，并以其他人可以阅读的格式进行显示。已经提供了不同的视图模板，它们是用\
  \ eRuby 编写的，可以在信息发送给任何想要查看这些信息的人之前在请求循环中使用。\n\n懂了吗？很好。现在，为了设置你的欢迎页，你需要生成一个控制器，将其命名为“welcome”，并使用名为“index”的动作。你的代码看起来如下：\n\
  \n```\n$ bin/rails generate controller welcome index\n```\n\n现在，Rails 将为你创建一组文件以及路由供你使用。当\
  \ Rails 完成这些操作后，你将看到：\n\n```\ncreate  app/controllers/welcome_controller.rb\nroute\
  \  get 'welcome/index'\ninvoke  erb\ncreate    app/views/welcome\ncreate    app/views/welcome/index.html.erb\n\
  invoke  test_unit\ncreate    test/controllers/welcome_controller_test.rb\ninvoke\
  \  helper\ncreate    app/helpers/welcome_helper.rb\ninvoke  assets\ninvoke     coffee\n\
  create      app/assets/javascripts/welcome.js.coffee\ninvoke     scss\ncreate  \
  \    app/assets/stylesheets/welcome.css.scss\n```\n\n如果你想查看控制器的代码路径，请前往 `app/controllers/welcome_controller.rb`。如果你想查看视图，可以在\
  \ `app/views/welcome/index.html.erb` 找到它。\n\n有趣的部分来了。调出文本编辑器并打开 `app/views/welcome/index.html.erb`。清除你看到的所有代码，并将其替换为以下内容：\n\
  \n```html\n<h1>Hello Rails!</h1>\n```\n\n执行此操作后，你已经成功地告知了 Rails 你希望显示“Hello Rails!”。这意味着当你访问\
  \ `http://localhost:3000` 时，这也是你想看到的问候语，而那里仍在显示“Welcome aboard”。\n\n### 创建应用主页\n\
  \n你需要的下一件事是告诉 Rails 主页在哪里。为此，再次调出文本编辑器并打开 `config/routes.rb`。你应该会看到类似的内容：\n\n```ruby\n\
  Rails.application.routes.draw do\n  get 'welcome/index'\n  # 优先级基于创建顺序：\n  # 先创建的\
  \ -> 优先级最高。\n  #\n  # 你可以使用 \"root\" 为你的网站根目录设置路由\n  # root 'welcome#index'\n  #\n\
  \  # ...\nend\n```\n\n这些行代表了路由文件，它告诉 Rails 如何将请求链接到特定的动作和控制器。现在，找到 `root 'welcome#index'`\
  \ 这一行并取消注释。当你回到 `http://localhost:3000` 时，你会发现它现在显示的是 Hello Rails!\n\n# 第 5 章 让我们做些更多事情\n\
  \n现在你已经学会了如何创建控制器、视图和动作，现在是时候创建一个新的资源（resource）了。资源是将相似对象组合在一起的东西，就像你对人、植物和动物分组一样。为了资源创建项目，你使用\
  \ `CRUD` 方法（创建、读取、更新、删除）。\n\nRails 让构建网站变得简单，因为它已经带有一个用于资源的方法，可以用于创建 REST 资源。REST，或表述状态转换（Representational\
  \ State Transfer），被认为是 Web 的架构结构，用于设计所有使用网络的应用程序，而不是使用相当复杂的操作来连接两台机器，你可以使用 HTTP\
