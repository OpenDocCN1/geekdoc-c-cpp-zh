  \n[点击此处在 amazon.com 上留下评论](https://www.amazon.com)\n\n# C 语言编程成功入门预览\n\n## 第 1 章：Hello\
  \ World\n\n在 C 语言编程中，当你编写程序时，必须有一个 `main` 函数。为了让你了解 C 代码看起来像什么样，请看示例：\n\n```c\n\
  #include <stdio.h>\n\nint main() {\n    printf(\"Hello World!\\n\");\n    return\
  \ 0;\n}\n```\n\n正如你在第一行看到的，代码使用了 `#include` 指令来包含 `stdio.h`。在 C 语言中，你需要包含某些头文件才能使用特定的函数。`stdio.h`\
  \ 是标准输入输出头文件，它包含了 `printf` 的定义。\n\n`int main()` 表明 `main` 函数将返回一个整数（integer）。\n\n\
  `{ ... }` 大括号定义了函数的体开始和结束。\n\n`printf(\"Hello World!\\n\");` 是 `printf` 函数，它的作用是将文本打印到程序窗口中。`Hello\
  \ World!\\n` 是你想打印的字符串，`\\n` 是换行符。\n\n`return 0;` 这行代码表示 `main` 函数成功返回整数 0。\n\n\
  ## 变量\n\n在 C 语言中，你可以使用变量来存储数据。每个变量都必须声明一个类型。例如：\n\n```c\nint age = 25;\nfloat score\
  \ = 95.5;\nchar grade = 'A';\n```\n\n在上面的例子中，`int` 用于整数，`float` 用于浮点数（小数），`char`\
  \ 用于单个字符。\n\n## 运算符\n\n运算符用于对对值执行操作。常用的运算符包括：\n\n- `+` (加法）\n- `-` (减法）\n- `*` (乘法）\n\
  - `/` (除法）\n- `%` (取模/取余）\n\n例如：\n\n```c\nint sum = 10 + 5; // sum 为 15\n```\n\n\
  ## 条件语句\n\n`if` 语句允许程序根据条件执行代码：\n\n```c\nif (age >= 18) {\n    printf(\"成年\");\n\
  } else {\n    printf(\"未成年\");\n}\n```\n\n## 循环\n\n循环允许重复执行代码块。`for` 循环非常常用：\n\n\
  ```c\nfor (int i = 0; i < 5; i++) {\n    printf(\"%d\\n\", i);\n}\n```\n\n`while`\
  \ 循环也是常用的：\n\n```c\nint i = 0;\nwhile (i < 5) {\n    printf(\"%d\\n\", i);\n   \
  \ i++;\n}\n```\n\n## 函数\n\n函数是可重用的代码块。你可以定义并调用它们：\n\n```c\nvoid greet() {\n    printf(\"\
  你好！\");\n}\n\nint main() {\n    greet();\n    return 0;\n}\n```\n\n## 数组\n\n数组是存储相同类型多个值的列表：\n\
  \n```c\nint numbers[5] = {1, 2, 3, 4, 5};\n```\n\n## 结构体\n\n结构体允许你将不同类型的数据组合在一起：\n\
  \n```c\nstruct Student {\n    char name[50];\n    int age;\n};\n\nstruct Student\
  \ s1 = {\"Alice\", 20};\n```\n\n通过学习这些基础，你已经开启了 C 语言编程之旅。继续练习并探索更多高级的概念！\n\n\n\n\
