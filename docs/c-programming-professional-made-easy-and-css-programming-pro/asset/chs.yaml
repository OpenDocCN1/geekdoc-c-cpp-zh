  \ Android `SDK` 文件大小约为 350mb。你将花费 15 到 30 分钟来下载它。如果你解压 Android `SDK` 文件，它将占用你计算机约\
  \ 450mb 的磁盘空间。下载页链接为：http://developer.android.com/sdk/index.html\n\n`SDK` 可以运行在\
  \ Windows XP、Windows 7、Mac OSX 10.8.5（或更高）以及可以运行 32 位应用并带有 `glibc`（GNU C 库）`2.11`\
  \ 或更高版本的 Linux 发行版上。\n\n一旦解解了下载的文件，打开 `SDK Manager`。该程序是开发包的更新工具。为了确保你拥有包组件的最新版本，请定期运行管理器并下载这些更新。此外，你还可以使用\
  \ `SDK Manager` 下载旧版本的 `SDK`。如果你想为带有旧 Android 操作系统的设备编写程序，就必须这样做。\n\n[点击此处在 Amazon\
