  \ 时，这也是你想看到的问候语，而那里仍在显示“Welcome aboard”。\n\n## 创建表单 (Form)\n\n调出 `app/views/articles/new.html.erb`\
  \ 并添加以下内容：\n\n```erb\n<%= form_for :article do |f| %>\n  <p>\n    <%= f.label :title\
  \ %><br>\n    <%= f.text_field :title %>\n  </p>\n  <p>\n    <%= f.label :text %><br>\n\
  \    <%= f.text_area :text %>\n  </p>\n  <p>\n    <%= f.submit %>\n  </p>\n<% end\
  \ %>\n```\n\n你会发现你刚刚创建了一个表单，它有一个文章标题的空间、提交按钮，而且还带框！这就是 `form_for` 代码的功能。你会意识到，当你提交要创建的文章时，它需要在另一个\
  \ URL 中完成，然后整个文本都应该去哪里。编辑 `app/views/articles/new.html.erb`，找到 `form_for` 这一行并让它看起来像这样：\n\
  \n```erb\n<%= form_for :article, url: articles_path do |f| %>\n```\n\n在 Rails 中，`create`\
  \ 动作负责为提交创建新的表单，因此你的表单应该是朝着这个动作工作的。\n\n## 创建模型 (Model)\n\nRails 已经提供了一个生成器，你的项目可以使用它启动模型。为了让\
