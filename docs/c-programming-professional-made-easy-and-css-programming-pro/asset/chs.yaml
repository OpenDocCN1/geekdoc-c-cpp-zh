- "# C++ 编程高级指南与 CSS 编程高级指南\n\n\n\n![](img/00002.jpeg)\n\n\n\n\n\n\n## 目录\n- 引言\n\
  - 第 1 章 - C++ 简介\n- 第 2 章 - C++ 变量与运算符\n- 第 3 章 - 关于用户输入的一切\n- 第 4 章 - 使用流程语句\n\
  - 结论\n\n### 引言\n感谢你的下载，并祝贺你下载《C++ 编程专业精通》这本书。\n\n本书包含了关于如何学习 `C++` 编程语言及其应用经过的步骤和策略。\n\
  \n你不需要成为专业开发者也可以编写快速且简单的 `C++` 程序。通过这本书，任何具有基础计算机知识的人都可以探索并享受 `C++` 编程语言的威力。书中包含了以下任何初学者今天即可开始编码的基础主题：\n\
  \n* 基础 `C++` 术语\n* 理解 `C++` 程序结构\n* 变量 `Variables`、表达式 `Expressions` 和运算符 `Operators`\n\
  * 使用输入输出流进行用户交互\n* 创建逻辑比较\n* 创建循环并使用条件语句\n* 以及更多！\n\n再次感谢下载本书，希望你读得愉快！\n\n# 第 1\
  \ 章 – C++ 简介\n### 你将学到：\n* `C++` 语言的简史\n* `C++` 基础术语\n* `C++` 程序结构\n\n`C++` 是今天人们使用的流行的编程语言之一。更具体地说，`C++`\
  \ 是一个由“命令”组成的库，告诉你的计算机要做什么以及如何做。这些命令构成了 `C++` 源代码。\n\n请注意，`C++` 与之前的 `C` 语言语言不同。事实上，当\
  \ `Bjarne Stroustrup` 在 1983 年创建它时，它被认为是 `C` 语言的更好版本。\n\n即使在今天，`C++` 语言仍然是世界上许多编程专家的“起点”。尽管它特别容易学习和应用，但精通\
  \ `C++` 的天花板非常高。\n\n### `C++` 基础术语\n当然，学习 `C++` 编程语言的第一步是理解基础术语。为了防止你在阅读本书时在任何时候产生不必要的困惑，本节解释了\
  \ `C++` 程序语法中最常用的术语。就像整个编程语言本身一样，C++` 中的大多数术语都易于记忆和理解。\n\n#### 编译器 (Compiler)\n\
  在进行任何操作之前，请注意，运行你用 `C++` 编写的代码需要一个`compiler`。将编译器想象成“翻译器”，它们将编程语言转换为机器语言——计算机能理解的语言。机器语言由两个字符（1\
  \ 和 0）组成，这就是它也被称为二进制语言。如果你在学校学习 `C++`，那么你不必担心为 `C++` 寻找编译器或集成开发环境。\n\n#### 集成开发环境\
  \ (Integrated Development Environment)\n集成开发环境 (`IDE`) 本质上是你用来编写 `C++` 程序的软件。IDE\
  \ 附带运行你代码所需的编译器是有意义的。如果你没有 `C++` 编程经验并尝试自学，你可以选择免费的 `C++ IDE`，如 `Code::Blocks`。对于完全初学者来说，一个好的选择是选择简单的\
  \ `C++ IDE`，如 `Quincy 2005`，因为它需要的设置非常少。\n\n#### 变量与参数 (Variables and Parameters)\n\
  `Variables` 是程序内存中的独立区块，包含一个给定的值。一个值可以设置为常量，通过运算符由其他变量的值确定，或者通过用户输入设置/更改。`Variables`\
  \ 由变量名或标识符表示。在 `C++` 编程中，只要所有字符有效，你就可以使用任何所需的变量名。记住，标识符中只能字母数字和“下划线” (`_`)。不允许使用标点符号和其他符号。\n\
  \n记住，变量在使用之前总是需要先声明。声明变量与决定它们的实际值不同；这意味着这两个过程是在两个不同的代码中完成的。这些将在下一章中解释。\n\n“参数”（Parameters）的工作方式与普通变量相同。事实上，它们的写法甚至完全相同。然而，参数和变量的初始化方式不同。参数专门包含在函数中，允许将参数传递到调用函数的另一个独立位置。\n\
  \n#### 语句 (Statements)\n每个用 `C++` 编写的程序由不同的代码行组成，执行设置变量、调用函数和其他表达式等任务。这些行就是语句。每个单独的语句始终以分号\
  \ (`;`) 结束。更重要的是，函数中的语句是根据先后顺序顺序执行的。当然，这种顺序可以使用流程语句（如“if 语句”和“循环”）来改变。\n\n#### 函数\
  \ (Functions)\n`Functions` 是 `C++` 程序中的块，结构用于完成单个任务。你可以在程序运行的任何点调用函数。大括号或花括号 (`{}`)\
  \ 包围着函数中的语句或“体”。除了函数名，函数还通过相应的“类型”设置返回值的形式。你还可以在函数的开头使用并设置参数。它们封装在括号 `()` 中，并使用逗号\
  \ (`,`) 分隔。\n\n在 `C++` 中，以下是创建函数最常用的语法：\n\n```\n\"type\" \"name\" ( 参数 1, 参数 2,\
  \ 参数 3, …)\n{\n    \"语句\";\n}\n```\n\n#### 注释 (Comments)\n在处理特别大的项目时，大多数资深程序员使用“注释”，作为\
  \ `C++` 程序特定部分的描述。注释被编译器完全忽略，因此可以忽略正确的代码语法。注释以双斜杠 (`//`) 或斜杠星号 (`/*`) 开头。你将在本书的示例中发现注释以帮助你理解。一个快速的例子就是下面的“Hello\
  \ World!”程序。当然，你也可以在未来的项目中使用注释以便参考和调试。\n\n### `C++` 程序结构\n`C++` 的程序结构非常容易理解。编译器从上到下读取每一行代码。这就是为什么\
  \ `C++` 程序的开头通常从预处理器指令以及变量及其值的声明开始。说明这种结构最好的方法是使用 `C++` 世界中最著名的例子——“Hello World!”程序。注意下面的代码行以及注释：\n\
  \n```cpp\n#include <iostream> // 这是一个预处理器指令\n\nint main() // 这一行启动名为 main 的函数，每个\
  \ C++ 程序中都应该找到它\n\n{\n    std::cout << “Hello World!\"; // 大括号之间的语句构成了 main 函数体\n\
  \n    return 0; // return 0; 语句用于告诉程序函数运行正常。然而，某些编译器在 main 函数中不需要这一行\n}\n```\n\n\
  \n\n\n\n第一行（`#include <iostream>`）是一个预处理器指令，它定义了标准 C++ 编程库的一个部分，称为输入/输出流（Input/Output\
  \ Stream），或简称为 `iostream`。该部分处理 C++ 程序中的输入和输出操作。记住，如果你想在主函数体中使用 `std::cout`，这一点是非常重要的。\n\
  \n第一行 `int main ()` 初始化了主函数。记住 `int` 指的是整数数据类型，`main` 指的是函数的名称。除了 `int` 之外还有其他数据类型，但目前你应该关注整数数据类型。由于\
  \ `Hello World!` 程序不需要参数，因此在函数名后的括号之间留了空白。此外，请记住，在初始化函数后**不应该**放置分号（`;`）。\n\n接下来是函数体，由左大括号表示。程序的这一特定部分（`std::cout`）指的是标准字符输出设备，即计算机的显示设备。接着是来自输入/输出流的插入运算符（`<<`），这意味着该行的其余部分（不包括引号）将被输出。最后，用分号（`;`）结束语句。\n\
  \n函数体的最后一行是返回语句（`return = 0;`）。记住，返回表达式（在本例中为 `0`）取决于初始化函数时指定的数据类型。然而，可以使用 `void`\
  \ 函数类型创建不需要返回语句的函数。例如；`void main ()`。\n\n实现此点的另一种方法是在预处理器行下方包含 `using namespace\
  \ std;` 行，这样你就不需要每次使用时都编写 `std::` 了。如果你选择这种方法，代码看起来如下：\n\n```cpp\n#include <iostream>\n\
  \nusing namespace std;\n\nint main()\n{\n    cout << \"Hello World!\";\n    return\
  \ 0;\n}\n```\n\n# 第 2 章 – C++ 变量与运算符\n\n### 你将学到：\n- C++ 运算符介绍及如何使用\n- 变量的声明与值的确定\n\
  - 在程序输出中创建新行\n\n在 C++ 程序中，变量和常量是通过运算符进行控制或“操作”的。注意，C++ 编程语言中的基础运算符与算术运算符相同。这包括用于赋值表达式的等号（`=`）、用于加法的加号（`+`）、用于减法的减号（`-`）、用于乘法的星号（`*`）、用于除法的正斜杠（`/`）以及用于获取任何表达式余数的百分号（`%`）。\n\
  \nC++ 还使用其他运算符来完成基础算术运算以外的额外任务。如上一章所述，`iostream` 头文件允许你使用插入运算符（`<<`）来处理输出。即使没有 `#include`\
  \ 指令，也可以访问不同的运算符。这些“基础”运算符可以归类为增/减运算符、比较运算符、复合赋值运算符和逻辑运算符。\n\n## 声明变量\n在 C++ 操作中使用变量之前，你必须首先声明它们并确定它们的值。再次，声明变量和赋予值是两个独立的过程。声明变量的语法如下：\n\
  \n`\"type\" \"variable\";`\n\n就像初始化函数一样，你需要为给定的指定要使用的数据类型。例如；假设你想将 `x` 声明为整数变量。初始化应该像这样：\n\
  \n`int x;`\n\n在声明 `x` 后，你可以使用赋值运算符（`=`）给它赋值。例如；要将值 `99` 赋值给变量 `x`，请使用以下行：\n\n`x\
  \ = 99;`\n\n确保在给变量赋值之前先声明它。或者，你可以使用单行声明变量并赋值。这可以通过以下方式实现：\n\n`int x = 99;`\n\n除了在编写程序时设置这些表达式外，你还可以使用操作和用户输入在程序运行时确定它们的值。但首先，你需要学习\
  \ C++ 中的其他运算符。\n\n## 增/减运算符\n递增运算符由两个加号（`++`）组成，而递减运算符由两个减号（`--`）组成。增/减运算符的主要目的是缩短对任何给定变量加或减\
  \ 1 的表达式。例如；如果 `x = 2`，那么 `++x` 应该等于 `3`，而 `--x` 应该等于 `1`。\n\n如果用于确定两个或多个变量的值，增/减运算符可以作为前缀或后缀包含。当作为后缀使用（`x++`\
  \ 或 `x--`）时，它表示 `x` 在加或减 1 之前的原始值。当单独运行时，`++x` 和 `x++` 的含义相同。但在设置其他变量时，区别就显而易见了。这里有一个简单的示例来说明这种区别：\n\
  \n```cpp\nX = 5;\nY = ++x;\n```\n\n在这个示例中，`y` 的值是在增加 `x` 的值之后确定的。换句话说，示例中 `y` 的值等于\
  \ `6`。\n\n```cpp\nX = 5;\nY = x++;\n```\n\n在这个示例中，`y` 的值是在增加 `x` 的值之前确定的。换句话说，示例中\
  \ `y` 的值等于 `6`。（注：此处原文逻辑可能有误，通常 x++ 赋值后应为 5）\n\n## 复合赋值运算符\n除了基础算术运算符和标准赋值运算符（`=`）外，还可以使用复合赋值运算符在赋值之前执行操作。复合赋值运算符基本上是使用基础算术运算符的普通表达式的简写版本。\n\
  \n以下是复合赋值运算符的示例：\n\n```cpp\nx -= 1;          // 等同于 x = x - 1;\nx *= y;        \
  \  // 等同于 x = x * y;\nx += 1;          // 等同于 x = x + 1;\nx /= y;          // 等同于\
  \ x = x / y;\n```\n\n## 比较运算符\n变量和其他表达式可以使用关系运算符或比较运算符进行比较。这些运算符用于检查一个值是否大于、小于或等于另一个值。以下是\
  \ C++ 中的比较运算符及其描述：\n\n- `==` : 检查值是否相等\n- `<` : 检查第一个值是否小于第二个\n- `>` : 检查第一个值是否大于第二个\n\
  - `<=` : 检查第一个值是否小于等于第二个\n- `>=` : 检查第一个值是否大于等于第二个\n- `!=` : 检查值是否不等\n\n比较运算符常用于条件语句。它们还可以用于评估表达式并返回布尔值（`true`\
  \ 或 `false`）。使用上述比较运算符；这里是一些示例表达式及其对应的布尔值：\n\n`(8 == 1)` // 此行结果为 `false`\n`(8 >\
  \ 1)` // 此行结果为 `true`\n`(8 != 1)` // 此行结果为 `true`\n`(8 <= 1)` // 此行结果为 `false`\n\
  \n还要注意，布尔值 `false` 等于 `0`，而 `true` 等于其他非零整数。除了数值外，在使用比较运算符时还可以检查变量的值。在创建表达式时只需使用变量的标识符即可。当然，在进行有效比较之前，必须声明变量并赋予标识值。这里有一个示例场景：\n\
  \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n    int\
  \ a = 3; // 先设置 a 和 b 的值\n    int b = 4;\n    cout << \"Comparison a < b = \" <<\
  \ (a < b);\n    return 0;\n}\n```\n\n此代码的输出如下：\n\nComparison a < b = true\n\n\n\n\
  \n请注意，插入运算符 (`<<`) 用于在输出语句中插入表达式 `a < b` 的值，这在第 7 行中表示（`cout << “Comparison a <\
  \ b = “…)`）。不要忘记你需要一个输出语句来检查代码是否正常工作。以下代码不会产生错误，但也不会产生输出：\n\n```cpp\n#include <iostream>\n\
  \nint main (\n{\n    int a = 3;\n    int b = 4;\n    (a < b);\n    return 0;\n}\n\
  ```\n\n在这段代码中，`a < b` 也是正确的。然而，由于省略了程序输出所需的行，因此不会产生任何输出。\n\n## 逻辑运算符\n\nC++ 中还有其他逻辑运算符可以确定布尔数据的值。它们是非逻辑\
  \ (`!`)、与逻辑 (`&&`) 和或逻辑 (`||`) 运算符。以下是它们如何使用的具体示例：\n\n`!(6 > 2)` // 非逻辑运算符 (`!`)\
  \ 会完全反转任何关系表达式并产生相反的结果。这个表达式为假，因为 `6 > 2` 是正确的\n\n`(6 > 2 && 5 < 10)` // 与运算符 (`&&`)\
  \ 仅在两个表达式都正确时才产生真。这个表达式为真，因为 `6 > 2` 和 `5 < 10` 都是正确的\n\n`(6 = 2 || 5 < 10)` //\
  \ 或运算符 (`||`) 只要其中一个表达式正确就会产生真。这个表达式为真，因为尽管 `6 = 2` 是假的，但 `5 < 10` 是正确的。\n\n你还可以在这两个逻辑运算符之外使用非逻辑运算符。例如：\n\
  \n`!(6 = 2 || 5 < 10)` // 这个表达式为假\n\n`!(6 > 2 && 5 < 10)` // 这个表达式也是假\n\n`!(6 <\
  \ 2 && 5 < 10)` // 这个表达式为真\n\n## 创建新行\n\n从本书的这里开始，你将学习生成多行输出的简单 C++ 程序。若要在生成输出时创建新行，你只需要使用换行符\
  \ (`\\n`)。或者，你在使用 `cout` 代码时可以使用 `endl;` 操纵符来创建新行。主要区别在于，每当你配合 `cout` 使用 `endl;`\
  \ 操纵符时，输出流的内部缓冲区会被“刷新”。以下是使用这两者的示例：\n\n```cpp\ncout << “Sentence number one \\nSentence\
  \ number two”;\n```\n\n上面的示例使用了换行符。\n\n```cpp\ncout << “Sentence number one” <<\
  \ endl;\ncout << “Sentence number two”;\n```\n\n上面的示例使用了 `endl;`。\n\n当然，第一种代码（使用\
  \ `\\n`）相对简单，更适用于一般的输出目的。两者都会产生以下输出：\n\nSentence number one\nSentence number two\n\
  \n# 第 3 章 – 关于用户输入\n\n### 你将学到：\n* 利用输入流\n* 使用输入来确定或修改值\n* 如何输入和输出字符串\n\n到目前，你已经学习了如何编写一个可以执行算术运算、比较并产生输出的\
  \ C++ 程序。这次，你将学习如何编写计算机程序最重要的方面之一——用户输入。\n\n如前所述，用户输入可以被用于确定或修改某些变量的值。C++ 程序使用称为“流”（streams）的抽象来处理输入和输出。由于你已经了解输出\
  \ (`cout`) 的语法，现在是时候学习输入 (`cin`) 的语法了。\n\n### 提取运算符\n\n输入语法 `cin` 配合提取运算符 (`>>`)\
  \ 用于格式化输入。这种组合结合键盘是大多数程序环境的标准输入。记住，在进行输入之前，你仍然需要先声明变量。这是一个简单的示例：\n\n```cpp\nint\
  \ x; // 此行声明了变量标识符 x。注意数据类型 “int”，它意味着只接受整数值\ncin >> x; // 这一行从 cin 语法中提取输入并存储到\
  \ x 中\n```\n\n也可以在一行内请求多个变量的用户输入。例如；假设你想为变量 `x` 和 `y` 存储整数值。它看起来应该是这样的：\n\n```cpp\n\
  int x, y; // 这一行声明了两个变量\ncin >> x >> y; // 这一行为变量 x 和 y 提取用户输入\n```\n\n注意，程序会自动要求用户为两个变量输入两个值。先输入哪个取决于变量在行中的顺序（在这种情况下，会先请求变量\
  \ `x` 的输入）。\n\n这是一个提取用户输入并产生输出的程序示例：\n\n```cpp\n#include <iostream> // 再次，这对于输入输出至关重要\n\
  using namespace std;\n\nint main ()\n{\n    int x;\n    cin >> x;\n    cout << “You\
  \ inserted: ” << x;\n    return 0;\n}\n```\n\n\n\n\n```cpp\nif (age >= 18)\n   \
  \ cout << “You are allowed to drink.”;\nelse\n    cout << “You are not yet allowed\
  \ to drink.”;\n```\n\n记住，条件只能使用比较运算符和逻辑运算符来设置（请参考第 2 章）。注意，你也可以通过用大括号括起来行使用 `if/else`\
  \ 条件执行多条语句。还可以使用逻辑运算符（如与 `&&` 和 或 `||`）来使用复合条件。\n\n最后，你可以在 `else` 语句之后使用另一个 `if`\
  \ 语句来提供更多可能性。当然，你也需要为你使用的每个 `if` 语句指定条件。以下是一个很好的示例，展示了在使用用户输入的同时，通过 `if` 和 `else`\
  \ 语句可以做什么：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
  {\n    int number;\n    cout << “Enter a number from 1-3\\n”;\n    cin >> number;\n\
  \    if (number == 1 || number == 2)\n        cout << “You have entered either 1\
  \ or 2.”;\n    else if (number == 3)\n        cout << “You have entered 3.”;\n \
  \   else\n    {\n        cout << “Please follow the instructions\\n”;\n        cout\
  \ << “Please Try Again.”;\n    }\n    return 0;\n}\n```\n\n上面的程序有 3 种可能的结果。如果用户输入\
  \ `1` 或 `2` 中的任何数字，就会得到第一个结果。如果用户输入数字 `3`，就会得到第二个结果。最后，如果用户输入了指定之外的其他数字，就会得到第三个结果。\n\
  \n## 创建选择（是或否）\n\n利用 `if/else` 语句的另一种方法是创建“是否”选择。为此，你需要使用变量类型 `char`，它可以存储来自 8 位字符集的字符字符（你可以使用\
  \ `char16_t`、`char32_t` 或 `wchar_t` 来处理更大的字符集；但通常没有必要）。和其他所有变量一样，`char` 变量在使用之前需要声明。\n\
  \n当然，你希望用户来做选择，这就是为什么你需要使用 `cin` 函数来提取用户输入。这是一个询问用户性别的简单程序：\n\n```cpp\n#include\
  \ <iostream>\n\nusing namespace std;\n\nint main()\n{\nchar gender; // this is the\
  \ char variable declaration\n    cout << “Male or Female? (M/F)”;\n    cin >> gender;\
  \ // user input is stored to gender\n    if (gender == ‘m’ || gender == ‘M’)\n \
  \       cout << “You have selected Male.”;\n    else if (gender == ‘f’ || gender\
  \ == ‘F’)\n        cout << “You have selected Female.”;\n    else\n    {\n     \
  \   cout << “Please follow the instructions\\n”;\n        cout << “Please Try Again.”;\n\
  \    }\n    return 0;\n}\n```\n（注：提供的文本在第二个示例中包含一些不一致的格式和缺失括号，为了可读性已进行了清理，同时保留了逻辑）。\n\
  \n\n\n\n\n首先，你需要一台高端电脑。通常情况下，其他的编程开发工具包并不需要强大的电脑来创建应用程序。然而，为 Android 编写程序略有不同。你需要更多的计算能力来运行\
  \ Android 模拟器，模拟器是那些允许你在计算机上测试程序的程序。\n\n使用一台没有优良处理器和足够内存（RAM）的低性能电脑，只会让你运行那些模拟器变得变得困难。如果你能够运行它，它的运行速度也会很慢。\n\
  \n其次，你需要一台 Android 设备。该设备将成为你的测试设备。通过它，你将知道你的程序在 Android 设备上的表现如何。在选择测试设备时，确保它与你应用目标市场的设备水平相当。如果你目标是平板电脑用户，请使用平板电脑。如果你目标是智能手机用户，请使用智能手机。\n\
