  trans: "\n\n```ruby\ndef update\n  @article = Article.find(params[:id])\n  if @article.update(article_params)\n\
    \    redirect_to @article\n  else\n    render 'edit'\n  end\nend\n\nprivate\n\n\
    \  def article_params\n    params.require(:article).permit(:title, :text)\n  end\n\
    end\n```\n\n为了显示“编辑”（Edit）链接，你可以修改 `app/views/articles/index.html.erb`，让该链接出现在“显示”（Show）链接之后。\n\
    \n```html\n<table>\n  <tr>\n    <th>Title（标题）</th>\n    <th>Text（正文）</th>\n  \
    \  <th colspan=\"2\"></th\n  </tr>\n  <% @articles.each do |article| %>\n    <tr>\n\
    \      <td><%= article.title %></td>\n      <td><%= article.text %></td>\n   \
    \   <td><%= link_to 'Show（显示）', article_path(article) %></td>\n      <td><%= link_to\
    \ 'Edit（编辑）', edit_article_path(article) %></td>\n    </tr>\n  <% end %>\n</table>\n\
    ```\n\n现在，为了让用户有机会编辑他的作品，请在模板 `app/views/articles/show.html.erb` 中添加这些行：\n\n...\n\
    \n```html\n<%= link_to 'Back（返回）', articles_path %> |\n<%= link_to 'Edit（编辑）',\
    \ edit_article_path(@article) %>\n```\n\n# 第 12 章 删除某些数据\n\n不，这并不意味着你要毁掉构建的整个程序。在这个阶段，你需要为用户提供删除其所写的某些文章的功能。由于你正在创建一个\
    \ RESTful 程序，你将需要使用以下路由：\n\n`DELETE /articles/:id(.:format) articles#destroy`\n\
    \n此路由使得 Rails 能够轻松删除资源，你需要确保它被放置在保护方法或私有方法之前。让我们在 `app/controllers/articles_controller.rb`\
    \ 文件中添加这个 action：\n\n```ruby\ndef destroy\n  @article = Article.find(params[:id])\n\
    \  @article.destroy\n  redirect_to articles_path\nend\n```\n\n执行此操作后，你会发现 `app/controllers/articles_controller.rb`\
    \ 中的 `ArticlesController` 现在如下所示：\n\n```ruby\nclass ArticlesController < ApplicationController\n\
    \  def index\n    @articles = Article.all\n  end\n  def show\n    @article = Article.find(params[:id])\n\
    \  end\n  def new\n    @article = Article.new\n  end\n  def edit\n    @article\
    \ = Article.find(params[:id])\n  end\n  def create\n    @article = Article.new(article_params)\n\
    \    if @article.save\n      redirect_to @article\n    else\n      render 'new'\n\
    \    end\n  end\n  def update\n    @article = Article.find(params[:id])\n    if\
    \ @article.update(article_params)\n      redirect_to @article\n    else\n    \
    \  render 'edit'\n    end\n  end\n  def destroy\n    @article = Article.find(params[:id])\n\
    \    @article.destroy\n    redirect_to articles_path\n  end\n  private\n    def\
    \ article_params\n      params.require(:article).permit(:title, :text)\n    end\n\
    end\n```\n\n现在，是时候让用户知道他们有这个选项了。打开 `app/views/articles/index.html.erb` 文件并添加以下行：\n\
    \n```html\n<h1>Listing Articles（文章列表）</h1>\n<%= link_to 'New article（新建文章）', new_article_path\
    \ %>\n\n<table>\n  <tr>\n    <th>Title（标题）</th>\n    <th>Text（正文）</th>\n    <th\
    \ colspan=\"3\"></th\n  </tr>\n  <% @articles.each do |article| %>\n    <tr>\n\
    \      <td><%= article.title %></td>\n      <td><%= article.text %></td>\n   \
    \   <td><%= link_to 'Show（显示）', article_path(article) %></td>\n      <td><%= link_to\
    \ 'Edit（编辑）', edit_article_path(article) %></td>\n      <td><%= link_to 'Delete（删除）',\
    \ article_path(article),\n              method: :delete,\n              data:\
    \ { confirm: 'Are you sure?（你确定吗？’) } %></td>\n    </tr>\n  <% end %>\n</table>\n\
    ```\n\n你会注意到你还添加了一个功能，让用户确认他是否真的想要删除提交的文章。现在，为了让确认框出现，你需要确保你的机器中拥有 `jquery_ujs`\
    \ 文件。\n\n# 结语\n\n再次感谢你下载这本书！\n\n希望这本书能够帮助你掌握 Ruby on Rails 的基础知识，并让你能够根据书中讨论的代码和流程创建一个网页。\n\
    \n下一步是探索该平台的其他应用，并学习其他的 Rails 技术，这些技术将改进你的程序设计和集成。\n\n最后，如果你喜欢这本书，请花时间分享你的想法并在\
    \ Amazon 上发表评论。我们尽力接触读者并提供我们能提供的最佳价值。你的好评将帮助我们实现这一目标。我们将不胜感激！\n\n感谢并祝你好运！\n\n\
    ![thank-you](img/00001.jpeg)\n\n[点击此处在 amazon.com 上留下评论](https://www.amazon.com)\n\
    \n# C 语言编程成功入门预览\n\n## 第 1 章：Hello World\n\n在 C 语言编程中，当你编写程序时，必须有一个 `main` 函数。为了让你了解\
    \ C 代码看起来像什么样，请看示例：\n\n```c\n#include <stdio.h>\n\nint main() {\n    printf(\"\
    Hello World!\\n\");\n    return 0;\n}\n```\n\n正如你在第一行看到的，代码使用了 `#include` 指令来包含\
    \ `stdio.h`。在 C 语言中，你需要包含某些头文件才能使用特定的函数。`stdio.h` 是标准输入输出头文件，它包含了 `printf` 的定义。\n\
    \n`int main()` 表明 `main` 函数将返回一个整数（integer）。\n\n`{ ... }` 大括号定义了函数的体开始和结束。\n\n\
    `printf(\"Hello World!\\n\");` 是 `printf` 函数，它的作用是将文本打印到程序窗口中。`Hello World!\\\
    n` 是你想打印的字符串，`\\n` 是换行符。\n\n`return 0;` 这行代码表示 `main` 函数成功返回整数 0。\n\n## 变量\n\n\
    在 C 语言中，你可以使用变量来存储数据。每个变量都必须声明一个类型。例如：\n\n```c\nint age = 25;\nfloat score = 95.5;\n\
    char grade = 'A';\n```\n\n在上面的例子中，`int` 用于整数，`float` 用于浮点数（小数），`char` 用于单个字符。\n\
    \n## 运算符\n\n运算符用于对对值执行操作。常用的运算符包括：\n\n- `+` (加法）\n- `-` (减法）\n- `*` (乘法）\n- `/`\
    \ (除法）\n- `%` (取模/取余）\n\n例如：\n\n```c\nint sum = 10 + 5; // sum 为 15\n```\n\n##\
    \ 条件语句\n\n`if` 语句允许程序根据条件执行代码：\n\n```c\nif (age >= 18) {\n    printf(\"成年\");\n\
    } else {\n    printf(\"未成年\");\n}\n```\n\n## 循环\n\n循环允许重复执行代码块。`for` 循环非常常用：\n\
    \n```c\nfor (int i = 0; i < 5; i++) {\n    printf(\"%d\\n\", i);\n}\n```\n\n`while`\
    \ 循环也是常用的：\n\n```c\nint i = 0;\nwhile (i < 5) {\n    printf(\"%d\\n\", i);\n \
    \   i++;\n}\n```\n\n## 函数\n\n函数是可重用的代码块。你可以定义并调用它们：\n\n```c\nvoid greet() {\n\
    \    printf(\"你好！\");\n}\n\nint main() {\n    greet();\n    return 0;\n}\n```\n\
    \n## 数组\n\n数组是存储相同类型多个值的列表：\n\n```c\nint numbers[5] = {1, 2, 3, 4, 5};\n```\n\n\
    ## 结构体\n\n结构体允许你将不同类型的数据组合在一起：\n\n```c\nstruct Student {\n    char name[50];\n\
    \    int age;\n};\n\nstruct Student s1 = {\"Alice\", 20};\n```\n\n通过学习这些基础，你已经开启了\
    \ C 语言编程之旅。继续练习并探索更多高级的概念！"
