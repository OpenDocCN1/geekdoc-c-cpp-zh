    Bear in mind that the value extracted from the input stream overwrites any initial
    value of a variable. For example, if the variable was declared as “int x = 2;”
    but was later followed by the statement “cin >> x;”, the new value will then replace
    the original value until the program/function restarts or if an assignment statement
    is introduced.


    Strings


    Keep in mind that there are other types you can assign to variables in C++. Aside
    from integers, another fundamental type is the string. A string is basically a
    variable type that can store sets of characters in a specific sequence. In other
    words, this is how you can assign words or sentences as values for certain variables.


    First of all, you need to add the preprocessor directive “#include <string>” before
    you can use strings in your program. Next, you need to declare a string before
    it can receive assignments. For example; if you want to declare a string for “Name”
    and assign a value for it, you can use the code:


    #include <string>


    using namespace std;


    int main ()


    {


