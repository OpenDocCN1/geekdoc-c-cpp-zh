- fmt: "\nThe purpose of a controller is to allow your program to receive any requests.\
    \ When you route, you enable Rails to decide which of the controllers you set\
    \ up will receive which types of requests. That may also mean that there would\
    \ be different routes leading to the controller, which would be triggered by specific\
    \ actions. An `action` is required in order to collect any information needed\
    \ in order to send it to a view.\n\n## 2. A view\n\nThis thing’s main purpose\
    \ is to enable Rails to display the information made available to the action and\
    \ display it in a format that other people can read. There are different view\
    \ templates that are already available and coded using eRuby, which can be used\
    \ in request cycles before it the information is sent to anyone who wants to look\
    \ at this information.\n\nGot it? Good. Now, to setup your welcome page, you need\
    \ to generate a controller and then name it “welcome” using an action named “index”.\
    \ Your code will look like this:\n\n```\n$ bin/rails generate controller welcome\
    \ index\n```\n\nNow, Rails will be creating a bunch of files plus a route for\
    \ you to use. When Rails is done with that, you will see this:\n\n```\ncreate\
    \  app/controllers/welcome_controller.rb\nroute  get 'welcome/index'\ninvoke \
    \ erb\ncreate    app/views/welcome\ncreate    app/views/welcome/index.html.erb\n\
    invoke  test_unit\ncreate    test/controllers/welcome_controller_test.rb\ninvoke\
    \  helper\ncreate    app/helpers/welcome_helper.rb\ninvoke  assets\ninvoke   \
    \  coffee\ncreate      app/assets/javascripts/welcome.js.coffee\ninvoke     scss\n\
    create      app/assets/stylesheets/welcome.css.scss\n```\n\nIf you want to view\
    \ where the course of your controller is, go to `app/controllers/welcome_controller.rb`.\
    \ If you want to look at the view, you can find it at `app/views/welcome/index.html.erb`.\n\
    \nHere comes the fun part. Pull up a text editor and open `app/views/welcome/index.html.erb`\
    \ there. Clear all the codes you see there, and replace it with this:\n\n```html\n\
    <h1>Hello Rails!</h1>\n```\n\nAfter doing so, you have successfully informed Rails\
    \ that you want “Hello Rails!” to appear. That means that it is also the greeting\
    \ that you want to see when you go to `http://localhost:3000`, which is still\
    \ displaying “Welcome aboard”.\n\n### Create the App’s Home Page\n\nThe next thing\
    \ that you need to do is to tell Rails where the home page is. To do that, pull\
    \ up your text editor again and open `config/routes.rb`. You should see something\
    \ like this:\n\n```ruby\nRails.application.routes.draw do\n  get 'welcome/index'\n\
    \  # The priority is based upon order of creation:\n  # first created -> highest\
    \ priority.\n  #\n  # You can have the root of your site routed with \"root\"\n\
    \  # root 'welcome#index'\n  #\n  # ...\nend\n```\n\nThose lines represent the\
    \ routing file which tells Rails how to link requests to specific actions and\
    \ controllers. Now, find the line `root 'welcome#index'` and uncomment it. When\
    \ you get back to `http://localhost:3000`, you will see that it now displays Hello\
    \ Rails!\n\n# Chapter 5 Let’s Do Something More\n\nNow that you have figured out\
    \ how to make a controller, a view, and an action, it’s time to create a new resource.\
    \ A resource is something that groups together similar objects the same way you\
    \ group people, plants, and animals. To make items for resources, you use the\
    \ `CRUD` method (create, read, update, destroy).\n\nRails make it easy for you\
    \ to build websites because it already comes with a method for resources that\
    \ it can use for making a REST resource. REST, or Representational State Transfer\
    \ is known as the web’s architectural structure which is used to design all applications\
    \ that use a network, and instead of using rather complex operations to link two\
    \ machines, you can use HTTP to make machines communicate. That means that in\
    \ a lot of ways, the Internet is based on a RESTful design.\n\nNow, following\
    \ the project you are creating, pull up `config/routes.rb` and make sure it’s\
    \ going to look like this:\n\n```ruby\nRails.application.routes.draw do\n  resources\
    \ :articles\n  root 'welcome#index'\nend\n```\n\nIf you are going to look at the\
    \ rake routes, you will notice that Rails has already made routes for all actions\
    \ involving REST. It is going to look like this:\n\n```\n$ bin/rake routes\n \
    \   Prefix Verb   URI Pattern                  Controller#Action\n    articles\
    \ GET    /articles(.:format)         articles#index\n               POST   /articles(.:format)\
    \         articles#create\n    new_article GET    /articles/new              \
    \ articles#new\n    edit_article GET    /articles/:id/edit         articles#edit\n\
    \    articles  GET    /articles/:id(.:format)     articles#show\n            \
    \   PATCH  /articles/:id(.:format)     articles#update\n               PUT   \
    \ /articles/:id(.:format)     articles#update\n               DELETE /articles/:id(.:format)\
    \     articles#destroy\n```\n\n# Chaper 6 Creating Article\n\nNow that you have\
    \ figured out how to make a controller, a view, and an action, it’s time to create\
    \ a new resource. A resource is something that groups together similar objects\
    \ the same way you group people, plants, and animals. To make items for resources,\
    \ you use the `CRUD` method (create, read, update, destroy).\n\nRails make it\
    \ easy for you to build websites because it already comes with a method for resources\
    \ that it can use for making a REST resource. REST, or Representational State\
    \ Transfer is known as the web’s architectural structure which is used to design\
    \ all applications that use a network, and instead of using rather complex operations\
    \ to link two machines, you can use HTTP to make machines communicate. That means\
    \ that in a lot of ways, the Internet is based on a RESTful design.\n\n## Creating\
    \ Title\n\nThis part would be the creating and reading part. Now, you will need\
    \ to do so, create a controller by running this:\n\n```\n$ bin/rails g controller\
    \ articles\n```\n\nNow, Rails will be creating a bunch of files plus a route for\
    \ you to use. When Rails is done with that, you will see this:\n\n```\ncreate\
    \  app/controllers/articles_controller.rb\nroute  get 'articles/index'\ninvoke\
    \  erb\ncreate    app/views/articles\ncreate    app/views/articles/index.html.erb\n\
    invoke  test_unit\ncreate    test/controllers/articles_controller_test.rb\ninvoke\
    \  helper\ncreate    app/helpers/articles_helper.rb\ninvoke  assets\ninvoke  \
    \   coffee\ncreate      app/assets/javascripts/articles.js.coffee\ninvoke    \
    \ scss\ncreate      app/assets/stylesheets/articles.css.scss\n```\n\nIf you want\
    \ to view where the course of your controller is, go to `app/controllers/articles_controller.rb`.\
    \ If you want to look at the view, you can find it at `app/views/articles/index.html.erb`.\n\
    \n## Creating the Article\n\nIn order to make it work, you need to create the\
    \ `ArticlesController` class class. It should look like this:\n\n```ruby\nclass\
    \ ArticlesController < ApplicationController\n  def new\n  end\nend\n```\n\nOnce\
    \ that is done, the controller should now be able to save the article to the database.\
    \ Now, you would need to set the parameters of actions done by controllers. Now,\
    \ make the ending of the above lines to look like this instead:\n\n```ruby\ndef\
    \ create\n  render plain: params[:article].inspect\nend\n```\n\n# Chapter 7 Creating\
    \ the Form\n\nPull up `app/views/articles/new.html.erb` and then add this:\n\n\
    ```html\n<h1>New Article</h1>\n```\n\nAfter doing so, you have successfully informed\
    \ Rails that you want “Hello Rails!” to appear. That means that it is also the\
    \ greeting that you want to see when you go to `http://localhost:3000`, which\
    \ is still displaying “Welcome aboard”.\n\n## Creating the Form\n\nPull up `app/views/articles/new.html.erb`\
    \ and then add this:\n\n```erb\n<%= form_for :article do |f| %>\n  <p>\n    <%=\
    \ f.label :title %><br>\n    <%= f.text_field :title %>\n  </p>\n  <p>\n    <%=\
    \ f.label :text %><br>\n    <%= f.text_area :text %>\n  </p>\n  <p>\n    <%= f.submit\
    \ %>\n  </p>\n<% end %>\n```\n\nYou will see that you have just created a form\
    \ that has a space for the article title, submit button, and it comes with boxes\
    \ too! That is the function of the code `form_for`. You will realize that when\
    \ you submit an article you are going to create, it needs to be done in another\
    \ URL and then the entire text should then go else. Edit `app/views/articles/new.html.erb`\
    \ by finding the `form_for` line and make it look like this:\n\n```erb\n<%= form_for\
    \ :article, url: articles_path do |f| %>\n```\n\nIn Rails, the action `create`\
    \ does the job of making new forms for submissions, and therefore, your form should\
    \ be working towards this action.\n\n## Make the Model\n\nRails already provide\
    \ a generator that would be used by your project to launch a model. To order Rails\
    \ to start generating one, run this on the terminal:\n\n```\n$ bin/rails generate\
    \ model Article title:string text:text\n```\n"
