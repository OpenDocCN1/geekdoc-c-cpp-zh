    work on a computer that runs on Windows 95.


    If these perks sound great, then it’s time to get started with a Rails project!


    # Chapter 2 Getting Started


    If you want to learn how to use Rails, then you would need to first have the following:


    1\. Ruby – choose the language version that is 1.9.3, or later. You can download
    it by visiting ruby-lang.org.


    2\. RubyGems packaging system – it is typically installed with Ruby that has versions
    1.9 or newer.


    3\. Installed SQLite3 Database


    Rails, as you probably figured out, is a framework dedicated to web application
    development written in the language of Ruby. That means that you would want to
    learn a little bit of Ruby coding in order to eliminate any difficulty in jumping
    into Rails. If you have a browser open, you can get great help in practicing Ruby
    codes by logging in to tryruby.org, which features a great interactive web tutorial.
    Try it out first to get the hang out of coding with Ruby.


    If you do not have any working SQLite 3 yet, you can find it at sqlite.org. You
    can also get installation instructions there.


    Installing Rails


    1\. Run the Rails installer (for Windows and Mac users) or the Tokaido (Mac OS
    X users)


    2\. Check out the version of the installed Ruby on your computer by running the
    Run command on Start menu and then typing cmd on the prompt (Windows). If you
    are running on Mac OS X, launch Terminal.app.


    Key in “$ ruby –v” (no captions). After you hit Enter, you will see the Ruby version
    installed


    3\. Check out the version of SQLite3 installed by typing “$ sqlite3 –version”.


    4\. After Rails installation, type in “$ rails –version” on Terminal.app or at
    the command prompt. If it says something similar to Rails 4.2.0, then you are
    good to go.


    A Note on the $ sign


    The $ sign would be used here in this book to look like the terminal prompt where
    you would type your code after. If you are using Windows for the Rails platform,
    you would see something like this: c:\source_code> .


    Chapter 3 Create Your First Project


    Here’s something that most web developers are raving about Rails: it comes with
    generators, or scripts that are made to make development a lot easier by making
    all things that you need to get started on a particular project. Among these scripts
    is the new application generator, which gives you the foundation you need for
    a new Rails app so you do not have to write one yourself. Now that allows you
    to jump right into your code!


    Since you are most likely to build a website or an API (application program interface),
    you would want to start coding a blog application. To start, launch a terminal
    and go to any directory where you can create files. On the prompt, type “$ rails
    new blog.”


    After you hit Enter, Rails will start making an application called Blog in the
    directory. It will also start making gem dependencies that you already have in
    your Gemfile bundle install.


    Now, go to where your blog app is by typing in “$ cd blog”.


    What’s in There?


    Once you get into the directory, you will find a number of files that Rails have
    already installed by default. If you are not quite sure about what these files
    are for, here’s a quick rundown of the file or folder functions:


    1\. app/ - this has the models, helpers, mailers, assets, and controllers for
    the app you just created. You’ll be looking more at this folder later.


    2\. bin/ - this has the script that you will use to run the app. Also, this has
    other scripts that you will be using to deploy, setup, or run the application
    you are going to create.


    3\. config/ - this allows you to tweak the app’s database, routes, etc.


    4\. config.ru – this is the configuration that will be used by Rack-based servers
    to run the app.


    5\. db/ - this would contain your database and database migrations


    6\. Gemfile, Gemfile.lock – these would allow you to tell the program what sort
    of gem dependencies you are going to need for the app you’re building.


    7\. lib/ - contains the extended modules needed for the app


    8\. lib – contains the app’s log files


    9\. public/ – this would be the sole folder that other people could see. It would
    be containing all your compiled assets and created static files.


    10\. Rakefile – this would be the one file that would locate and load tasks that
    can be set to run from the command line. You can add tasks that you would prefer
    to use later on by adding the files needed to the lib/tasks directory


    11\. README.rdoc – just like readme’s function, this would be a brief document
    that would tell other people how your app works, how to set it up, etc.


    12\. test/ - these would contain all your unit tests and all the things that you
    are going to need for testing.


    13\. tmp/ - this would hold all temporary files


    14\. vendor/ - this would contain all your third-party codes and would also contain
    all vendored gems.


    Now, if you are seeing all these in the app directory you just made, then you
    are ready to create little bits and pieces that you would be adding up later to
    make a real blog app!


    Firing Up the Web Server


    Since you already have the barebones of your blog application, you would want
    to set up how the app is going to be launched on the internet. To start a web
    server go to the directory where blog is located, and then type “$ bin/rails server”.


    Important note:


    You would need to have a JavaScript runtime available in your computer if you
    want to use asset compression for JavaScript or if you want to compile a CoffeeScript.
    Otherwise, you would expect to see an execjs error when you attempt to compile
    these assets. If you want to look at all the supported runtimes, you can go to
    github.com/sstephenson/execjs#readme.


    If you are successful, what you just did would launch WEBrick, which is the server
    that Ruby apps use by default. You can see what’s happening so far in your app
    by firing up a web browser and typing http://localhost:3000\. Now, since you have
    done nothing much, you would be seeing the Rails default page. It will tell you
    that you are currently in development mode. You also do not need to constantly
    require the server to look at the changes that you have made – any changes will
    be automatically picked up and seen. Also keep in mind that if you managed to
    see this “Welcome Aboard” thing, you are sure that you created an app that is
    configured correctly. If you want to find out the app’s environment, click on
    “About your application’s environment” link.


    Got everything right so far? Let’s move on to making something other people can
    read.


    # Chapter 4 Say “Hello There!”


    If you want to make Rails learn how to say Hi to other people, you would need
    the following:


    1\. A controller'
