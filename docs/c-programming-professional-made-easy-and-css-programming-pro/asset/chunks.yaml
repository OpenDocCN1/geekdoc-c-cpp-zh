    The Extraction Operator


    The input syntax “cin” is used with the extraction operator (>>) for formatted
    input.  This combination along with the keyboard is the standard input for most
    program environments. Remember that you still need to declare a variable first
    before input can be made. Here is a simple example:


    int x; // this line declares the variable identifier x. Take note of the data
