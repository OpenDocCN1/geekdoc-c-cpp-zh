  trans: "\n\n刚刚发生的情况是，你告诉 `Rails` 你需要一个 `Article` 模型，该模型包含 `title` 和 `text` 属性，它们分别对应不同的字符串。你会发现平台创建了很多文件，但你最感兴趣的是\
    \ `db/migrate/20140120191729_create_articles.rb`，它包含了你博客的数据库。\n\n现在，你想运行一次迁移（migration），只需一行代码即可完成：\n\
    \n```bash\n$ bin/rake db:migrate\n```\n\n`Rails` 会执行的是执行此命令，这意味着它创建了 `Articles`\
    \ 表：\n\n```\n== CreateArticles: migrating =================================================\n\
    -- create_table(:articles)\n   -> 19s\n== CreateArticles: migrated (20s) ========================================\n\
    ```\n\n# 第 8 章 保存你的数据\n\n打开 `app/controllers/articles_controller.rb` 将 `create`\
    \ 动作修改为：\n\n```ruby\ndef create\n  @article = Article.new(params[:article])\n\
    \  @article.save\n  redirect_to @article\nend\n```\n\n你几乎可以创建文章了！但是，当你刷新页面时，会看到\
    \ Forbidden Attributes（禁止属性）错误，并指向 `Article.new(params[:article])` 这一行。`Rails`\
    \ 之所以让你感到困难，是因为它要求你在控制器中指定哪些参数，否则可能会导致程序崩溃。\n\n要修复这个问题，编辑你看到的错误所在行并将其改为：\n\n```ruby\n\
    @article = Article.new(params.require(:article).permit(:title, :text))\n```\n\n\
    ## 显示你的成果\n\n为了让页面显示文章，你可以通过 `app/controllers/articles_controller.rb` 添加 `show`\
    \ 动作：\n\n```ruby\nclass ArticlesController < ApplicationController\n  def show\n\
    \    @article = Article.find(params[:id])\n  end\n\n  def new\nend\n```\n\n现在添加一些样式。创建一个名为\
    \ `app/views/articles/show.html.erb` 的文件并放入以下内容：\n\n```ererb\n<p>\n  <strong>Title:</strong>\n\
    \  <%= @article.title %>\n</p>\n\n<p>\n  <strong>Text:</strong>\n  <%= @article.text\
    \ %>\n</p>\n```\n\n刷新 `http://localhost:3000/articles/new`，你就会可以创建并显示文章了！\n\n\
    # 第 9 章 让你的文章整洁\n\n找到一种方法列出你要创建的所有文章，以便数据库井井。为此，打开 `app/controllers/articles_controller.rb`\
    \ 并添加以下内容进行控制：\n\n```ruby\nclass ArticlesController < ApplicationController\n\
    \  def index\n    @articles = Article.all\n  end\n\n  def show\n    @article =\
    \ Article.find(params[:id])\n  end\n\n  def new\nend\n```\n\n现在，为了添加视图，打开 `app/views/articles/index.html.erb`\
    \ 并添加以下内容：\n\n```ererb\n<h1>Article List</h1>\n<table>\n  <tr>\n    <th>Title</th>\n\
    \    <th>Text</th>\n  </tr>\n  <% @articles.each do |article| %>\n    <tr>\n \
    \     <td><%= article.title %></td>\n      <td><%= article.text %></td>\n    </tr>\n\
    \  <% end %>\n</table>\n```\n\n访问 `http://localhost:3000/articles`，你会看到你目前创建的所有文章。\n\
    \n## 使用链接进一步整理\n\n你确实需要为已创建的文章创建链接，以便读者可以轻松查看。要添加链接，打开 `app/views/welcome/index.html.erb`\
    \ 并将其改为：\n\n```ererb\n<h1>Hello, Rails!</h1>\n<%= link_to 'My Blog', controller:\
    \ 'articles' %>\n```\n\n现在，如果你想添加一个可以立即编写新文章的链接怎么办？你只需要在 `app/views/articles/index.html.erb`\
    \ 中添加以下内容来获得 New Article 链接：\n\n```ererb\n<%= link_to 'New article', new_article_path\
    \ %>\n```\n\n如果你想创建一个返回之前的链接，在同一个文件中添加以下内容：\n\n```ererb\n<%= form_for :article,\
    \ url: articles_path do |f| %>\n  ...\n<% end %>\n\n<%= link_to 'Back', articles_path\
    \ %>\n```\n\n# 第 10 章创建规则\n\n创建博客程序时，你不希望用户意外提交空白页面，然后直接回到原来而不知道他们做了什么。`Rails`\
    \ 可以通过编辑 `app/models/article.rb` 文件来帮助确保这种情况不会发生：\n\n```ruby\nclass Article <\
    \ ActiveRecord::Base\n  validates :title, presence: true,\n             length:\
    \ { minimum: 5 }\nend\n```\n\n这意味着标题至少要有 5 个字符，文章才能通过，否则它不会被保存。现在博客的规则已经就绪，你需要向博客用户显示发生了错误，并且表单应该正确填写。为此，调整\
    \ `app/controllers/articles_controller.rb` 中的 `create` 和 `new` 动作如下所示：\n\n```ruby\n\
    def new\n  @article = Article.new\nend\n\ndef create\n  @article = Article.new(article_params)\n\
    \  if @article.save\n    redirect_to @article\n  else\n    render 'new'\n  end\n\
    end\n\nprivate\n\n  def article_params\n    params.require(:article).permit(:title,\
    \ :text)\n  end\n```\n\n为了向用户展示这个，在 `app/views/index.html.erb` 中添加以下内容：\n\n```ererb\n\
    <table>\n  <tr>\n    <th>Title</th>\n    <th>Text</th>\n    <th></th>\n  </tr>\n\
    \  <% @articles.each do |article| %>\n    <tr>\n      <td><%= article.title %></td>\n\
    \      <td><%= article.text %></td>\n      <td><%= link_to 'Show', article_path(article)\
    \ %></td>\n      <td><%= link_to 'Edit', article_path(article) %></td>\n    </tr>\n\
    \  <% end %>\n</table>\n```\n\n# 第 11 章 更新文章\n\n你希望用户对他们刚刚写的文章改变主意。这涉及 `update`\
    \ 动作，提示你在 `ArticlesController` 中添加：\n\n```ruby\ndef new\n  @article = Article.new\n\
    end\n\ndef edit\n  @article = Article.find(params[:id])\nend\n```\n\n为了允许此视图，创建一个文件并命名为\
    \ `app/views/articles/edit.html.erb`，然后放入：\n\n```ererb\n<h1>Editing article</h1>\n\
    <%= form_for :article, url: article_path(@article), method: :patch do |f| %>\n\
    \  <% if @article.errors.any? %>\n    <div id=\"error_explanation\">\n      <h2><%=\
    \ pluralize(@article.errors.count, \"error\") %> prohibited this article from\
    \ being saved:</h2>\n      <ul>\n        <% @article.errors.full_messages.each\
    \ do |msg| %>\n          <li><%= msg %></li>\n        <% end %>\n      </ul>\n\
    \    </div>\n  <% end %>\n\n  <p>\n    <%= f.label :title %><br>\n    <%= f.text_field\
    \ :title %>\n  </p>\n\n  <p>\n    <%= f.label :text %><br>\n    <%= f.text_area\
    \ :text %>\n  </p>\n\n  <p>\n    <%= f.submit %>\n  </p>\n<% end %>\n\n<%= link_to\
    \ 'Back', articles_path %>\n```\n\n现在，你需要在 `app/controllers/articles_controller.rb`\
    \ 中创建 `update` 动作：\n\n```ruby\ndef update\n  @article = Article.find(params[:id])\n\
    \  if @article.update(article_params)\n    redirect_to @article\n  else\n    render\
    \ 'edit'\n  end\nend\n```\n\n"
