  raw: 'if (age >= 18)


                  cout << “You are allowed to drink.”;


    else


                  cout << “You are not yet allowed to drink.”;


    Remember that conditions can only be set using comparison operators and logical
    operators (refer to Chapter 2). Take note that you can also execute multiple statements
    using if/else conditions by enclosing the lines in curly braces. It is also possible
    to use composite conditions using logical operators such as AND (&&) and OR (||).


    Finally, you can use another “if” statement after an “else” statement for even
    more possibilities. Of course, you also need to specify conditions for every “if”
    statement you use. Here is a good example that demonstrates what you can do using
    “if” and “else” statements in addition to user input:


    #include <iostream>


    using namespace std;


    int main()


    {


                  int number;


                  cout << “Enter a number from 1-3\n”;


                  cin >> number;


                  if (number == 1 || number == 2)


                                cout << “You have entered either 1 or 2.”;


                  else if (number == 3)


                                cout << “You have entered 3.”;


                  else


                  {


                                cout << “Please follow the instructions\n”;


                                cout << “Please Try Again.”;


                  }


                  return 0;


    }


    There are 3 possible outcomes in the program above. The first outcome is achieved
    if the user entered any of the numbers 1 or 2\. The second outcome is achieved
    if the user entered the number 3\. Lastly, the third outcome is achieved if the
    user entered a different number other the ones specified.


    Creating Choices (Yes or No)


    Another way to utilize if/else statements is to create “Yes or No” choices. For
    this, you need to make use of the variable type “char” which can hold a character
    from the 8-bit character set (you can use char16_t, char32_t, or wchar_t for larger
    character sets; but this is not usually necessary). Just like all other variables,
    a “char” variable needs to be declared before it can be used.


    Of course, you want the user to make the choice, which is why you need to use
    the “cin” function to extract user input. Here is a simple program that asks for
    the user’s gender:


    #include <iostream>


    using namespace std;


    int main()


    {


    char gender; // this is the char variable declaration


                  cout << “Male or Female? (M/F)”;


    cin >> gender; // user input is stored to gender


                  if (gender == ‘m’ || gender == ‘M’)


                                cout << “You have selected Male.”;


                  else if (gender == ‘f’ || gender == ‘F’)


                                cout << “You have selected Female.”;


                  else


                                cout << “Please follow the instructions.”;


                  return 0;


    }


    Take note that you should use single quotation marks (‘) when pinpointing “char”
    values. In C++, “char” values are always called inside single quotation marks.
    Additionally, remember that “char” values are case-sensitive, which is why the
    example above used the OR (||) operator in the conditions to accept both lowercase
    and uppercase answers. You can see that the program above checked if the user
    entered ‘m’, ‘M’, ‘f’, or ‘F’.


    Looping Statements


    Lastly, using “loops” allow statements to be executed for a set number of times
    or until a condition is met. By incorporating other statements in loops, you can
    do far more than just create pointless repetitions. But first, you need to be
    familiar with the different types of loops.


    There are 3 types of loops in C++ -- while, do, and for.


    While Loop


    The “while loop” is regarded as the simplest form of loop in the C++. Basically,
    it repeats the statement(s) as long as the given condition is true. Keep in mind
    that your code should be structured to eventually fulfill the condition; otherwise
    you might create an “infinite loop”.


    Here is an example of a while loop:


    int x = 100;


    while (x >= 0) // the condition for the loop is set


                  {


                  cout << x;


    --x; // the value of x is decreased


                  }


    In this example, the loop executes as long as the value of x is greater than or
    equal to 0\. Take note of the decrement operator (--) in the statement “--x;”.
    This makes sure that the value of x is continually decreased until the condition
    is met and the loop ends.


    Do-While Loop


    The next type of loop is the “do-while loop”. The do-while loop is essentially
    the same as the while loop. The main difference is that the do-while loop allows
    the execution of the statement(s) at least once before the condition is checked.
    Whereas in the while loop, the condition is checked first.


    Here is an example of a do-while loop:


    int x = 100;


    int y;


    do


                  {


                  cout << “The value is “ << x << “\n”;


                  cout << “Enter a value to subtract.”;


                  cin >> y;


                  x -= y;


                  }


    while (x > 0); // in the do-while loop, the condition is checked last


    In the example above, the statements are executed at least once before the value
    of x is checked. Whereas in a while loop, there is a possibility that the statement(s)
    will not be executed at all.


    For Loop


    The third type of loop is the “for loop” which has specific areas for the initialization,
    condition, and increase. These three sections are sequentially executed throughout
    the life cycle of the loop. By structure, for loops are created to run a certain
    number of times because increment or decrement operators are usually used in the
    “increase” section.


    Here is the syntax for this loop to help you understand it better:


    for (int x = 10; x > 0; x--)


    Notice the three expressions inside the parentheses (int x = 10; x > 0; x--) are
    separated in semicolons. These parameters denote the three sections of the loop.
    You may also use multiple expressions for each section using a comma (,). Here
    is the syntax for this:


    for ( int x = 10, y = 0; x != y; --x, ++y )


                  {


                  cout << “X and Y is different\n”;


                  }


    In this example, the loop is executed as long as x is not equal to y. And in order
    for the loop to end, the values of x and y are adjusted until the value of x equals
    the value of y. Based on the parameters above, the statement “X and Y is different”
    will run a total of 5 times before the loop is ended.


    Conclusion


    Thank you again for downloading this book! 


    I hope this book was able to help you to learn and understand the C++ programming
    language!


    The next step is to start from where you are now and try to learn something new.
    Keep in mind that you’ve only scratched the surface of all the things you can
    do in the world of C++!


    Finally, if you enjoyed this book, please take the time to share your thoughts
    and post a review on Amazon. We do our best to reach out to readers and provide
    the best value we can. Your positive review will help us achieve that.  It’d be
    greatly appreciated!


    Thank you and good luck!


