  trans: "\n\n第一行（`#include <iostream>`）是一个预处理器指令，它定义了标准 C++ 编程库的一个部分，称为输入/输出流（Input/Output\
    \ Stream），或简称为 `iostream`。该部分处理 C++ 程序中的输入和输出操作。记住，如果你想在主函数体中使用 `std::cout`，这一点是非常重要的。\n\
    \n第一行 `int main ()` 初始化了主函数。记住 `int` 指的是整数数据类型，`main` 指的是函数的名称。除了 `int` 之外还有其他数据类型，但目前你应该关注整数数据类型。由于\
    \ `Hello World!` 程序不需要参数，因此在函数名后的括号之间留了空白。此外，请记住，在初始化函数后**不应该**放置分号（`;`）。\n\n\
    接下来是函数体，由左大括号表示。程序的这一特定部分（`std::cout`）指的是标准字符输出设备，即计算机的显示设备。接着是来自输入/输出流的插入运算符（`<<`），这意味着该行的其余部分（不包括引号）将被输出。最后，用分号（`;`）结束语句。\n\
    \n函数体的最后一行是返回语句（`return = 0;`）。记住，返回表达式（在本例中为 `0`）取决于初始化函数时指定的数据类型。然而，可以使用 `void`\
    \ 函数类型创建不需要返回语句的函数。例如；`void main ()`。\n\n实现此点的另一种方法是在预处理器行下方包含 `using namespace\
    \ std;` 行，这样你就不需要每次使用时都编写 `std::` 了。如果你选择这种方法，代码看起来如下：\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main()\n{\n    cout << \"Hello World!\";\n    return\
    \ 0;\n}\n```\n\n# 第 2 章 – C++ 变量与运算符\n\n## 你将学到：\n- C++ 运算符介绍及如何使用\n- 变量的声明与值的确定\n\
    - 在程序输出中创建新行\n\n在 C++ 程序中，变量和常量是通过运算符进行控制或“操作”的。注意，C++ 编程语言中的基础运算符与算术运算符相同。这包括用于赋值表达式的等号（`=`）、用于加法的加号（`+`）、用于减法的减号（`-`）、用于乘法的星号（`*`）、用于除法的正斜杠（`/`）以及用于获取任何表达式余数的百分号（`%`）。\n\
    \nC++ 还使用其他运算符来完成基础算术运算以外的额外任务。如上一章所述，`iostream` 头文件允许你使用插入运算符（`<<`）来处理输出。即使没有\
    \ `#include` 指令，也可以访问不同的运算符。这些“基础”运算符可以归类为增/减运算符、比较运算符、复合赋值运算符和逻辑运算符。\n\n## 声明变量\n\
    在 C++ 操作中使用变量之前，你必须首先声明它们并确定它们的值。再次，声明变量和赋予值是两个独立的过程。声明变量的语法如下：\n\n`\"type\" \"\
    variable\";`\n\n就像初始化函数一样，你需要为给定的指定要使用的数据类型。例如；假设你想将 `x` 声明为整数变量。初始化应该像这样：\n\n\
    `int x;`\n\n在声明 `x` 后，你可以使用赋值运算符（`=`）给它赋值。例如；要将值 `99` 赋值给变量 `x`，请使用以下行：\n\n`x\
    \ = 99;`\n\n确保在给变量赋值之前先声明它。或者，你可以使用单行声明变量并赋值。这可以通过以下方式实现：\n\n`int x = 99;`\n\n\
    除了在编写程序时设置这些表达式外，你还可以使用操作和用户输入在程序运行时确定它们的值。但首先，你需要学习 C++ 中的其他运算符。\n\n## 增/减运算符\n\
    递增运算符由两个加号（`++`）组成，而递减运算符由两个减号（`--`）组成。增/减运算符的主要目的是缩短对任何给定变量加或减 1 的表达式。例如；如果 `x\
    \ = 2`，那么 `++x` 应该等于 `3`，而 `--x` 应该等于 `1`。\n\n如果用于确定两个或多个变量的值，增/减运算符可以作为前缀或后缀包含。当作为后缀使用（`x++`\
    \ 或 `x--`）时，它表示 `x` 在加或减 1 之前的原始值。当单独运行时，`++x` 和 `x++` 的含义相同。但在设置其他变量时，区别就显而易见了。这里有一个简单的示例来说明这种区别：\n\
    \n```cpp\nX = 5;\nY = ++x;\n```\n\n在这个示例中，`y` 的值是在增加 `x` 的值之后确定的。换句话说，示例中 `y`\
    \ 的值等于 `6`。\n\n```cpp\nX = 5;\nY = x++;\n```\n\n在这个示例中，`y` 的值是在增加 `x` 的值之前确定的。换句话说，示例中\
    \ `y` 的值等于 `6`。（注：此处原文逻辑可能有误，通常 x++ 赋值后应为 5）\n\n## 复合赋值运算符\n除了基础算术运算符和标准赋值运算符（`=`）外，还可以使用复合赋值运算符在赋值之前执行操作。复合赋值运算符基本上是使用基础算术运算符的普通表达式的简写版本。\n\
    \n以下是复合赋值运算符的示例：\n\n```cpp\nx -= 1;          // 等同于 x = x - 1;\nx *= y;      \
    \    // 等同于 x = x * y;\nx += 1;          // 等同于 x = x + 1;\nx /= y;          //\
    \ 等同于 x = x / y;\n```\n\n## 比较运算符\n变量和其他表达式可以使用关系运算符或比较运算符进行比较。这些运算符用于检查一个值是否大于、小于或等于另一个值。以下是\
    \ C++ 中的比较运算符及其描述：\n\n- `==` : 检查值是否相等\n- `<` : 检查第一个值是否小于第二个\n- `>` : 检查第一个值是否大于第二个\n\
    - `<=` : 检查第一个值是否小于等于第二个\n- `>=` : 检查第一个值是否大于等于第二个\n- `!=` : 检查值是否不等\n\n比较运算符常用于条件语句。它们还可以用于评估表达式并返回布尔值（`true`\
    \ 或 `false`）。使用上述比较运算符；这里是一些示例表达式及其对应的布尔值：\n\n`(8 == 1)` // 此行结果为 `false`\n`(8\
    \ > 1)` // 此行结果为 `true`\n`(8 != 1)` // 此行结果为 `true`\n`(8 <= 1)` // 此行结果为 `false`\n\
    \n还要注意，布尔值 `false` 等于 `0`，而 `true` 等于其他非零整数。除了数值外，在使用比较运算符时还可以检查变量的值。在创建表达式时只需使用变量的标识符即可。当然，在进行有效比较之前，必须声明变量并赋予标识值。这里有一个示例场景：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main ()\n{\n    int\
    \ a = 3; // 先设置 a 和 b 的值\n    int b = 4;\n    cout << \"Comparison a < b = \"\
    \ << (a < b);\n    return 0;\n}\n```\n\n此代码的输出如下：\n\nComparison a < b = true\n\
    \n"
- fmt: "\nTake note that the insertion operator (`<<`) is used to insert the value\
    \ of the expression `a < b` in the output statement, which is denoted in the 7th\
    \ line (`cout << “Comparison a < b = “…)`). Don’t forget that you need an output\
    \ statement in order to see if your code works. The following code will produce\
    \ no errors, but it won’t produce an output either:\n\n```cpp\n#include <iostream>\n\
    \nint main (\n{\n    int a = 3;\n    int b = 4;\n    (a < b);\n    return 0;\n\
    }\n```\n\nIn this code, it is also true that `a < b`. However, no output will\
    \ be produced since the lines necessary for the program output are omitted.\n\n\
    ## Logical Operators\n\nThere are also other logical operators in C++ that can\
    \ determine the values of Boolean data. They are the NOT (`!`), AND (`&&`), and\
    \ OR (`||`) operators. Here are specific examples on how they are used:\n\n`!(6\
    \ > 2)` // the NOT operator (`!`) completely reverses any relational expressions\
    \ and produces the opposite result. This expression is false because `6 > 2` is\
    \ correct\n\n`(6 > 2 && 5 < 10)` // the AND (`&&`) operator only produces true\
    \ if both expressions correct. This expression is true because both `6 > 2` &&\
    \ `5 < 10` are correct\n\n`(6 = 2 || 5 < 10)` // the OR (`||`) operator produces\
    \ true if one of the expressions are correct. This expression is true because\
    \ the `5 < 10` is correct although `6 = 2` is false.\n\nYou can also use the NOT\
    \ operator in addition to the other two logical operators. For example:\n\n`!(6\
    \ = 2 || 5 < 10)` // this expression is false\n\n`!(6 > 2 && 5 < 10)` // this\
    \ expression is also false\n\n`!(6 < 2 && 5 < 10)` // this expression is true\n\
    \n## Creating New Lines\n\nFrom this point on in this book, you will be introduced\
    \ to simple C++ programs that produce output with multiple lines. To create new\
    \ lines when producing output, all you need to do is to use the new line character\
    \ (`\\n`). Alternatively, you can use the `endl;` manipulator to create new lines\
    \ when using the `cout` code. The main difference is that the internal buffer\
    \ for the output stream is “flushed” whenever you use the `endl;` manipulator\
    \ with `cout`. Here are examples on how to use both:\n\n```cpp\ncout << “Sentence\
    \ number one \\nSentence number two”;\n```\n\nThe example above uses the new line\
    \ character.\n\n```cpp\ncout << “Sentence number one” << endl;\ncout << “Sentence\
    \ number two”;\n```\n\nThe example above uses `endl;`.\n\nOf course, the first\
    \ code (using `\\n`) is relatively simpler and easier for general output purposes.\
    \ Both will produce the following output:\n\nSentence number one\nSentence number\
    \ two\n\n## Chapter 3 – All About User Input\n\n### What You Will Learn:\n* Utilizing\
    \ the Input Stream\n* Using Input to Determine or Modify Values\n* How to Input\
    \ and Output Strings\n\nUp to this point, you’ve learned how to make a C++ program\
    \ that can perform arithmetic operations, comparisons, and can produce output\
    \ as well. This time, you will learn how to code one of the most important aspects\
    \ of computer programs – user input.\n\nAs stated earlier, user input can be utilized\
    \ to determine or modify the values of certain variables. C++ programs use abstractions\
