    Create the App’s Home Page


    The next thing that you need to do is to tell Rails where the home page is. To
    do that, pull up your text editor again and open config/routes.rb. You should
    see something like this:


                  Rails.application.routes.draw do


      get ''welcome/index''


      # The priority is based upon order of creation:


      # first created -> highest priority.


      #


      # You can have the root of your site routed with "root"


      # root ''welcome#index''


      #


      # ...


    Those lines represent the routing file which tells Rails how to link requests
    to specific actions and controllers. Now, find the line “root ''welcome#index''”
    and uncomment it. When you get back to [http://localhost:3000](http://localhost:3000),
    you will see that it now displays Hello Rails!


    # Chapter 5 Let’s Do Something More


    Now that you have figured out how to make a controller, a view, and an action,
    it’s time to create a new resource. A resource is something that groups together
    similar objects the same way you group people, plants, and animals. To make items
    for resources, you use the CRUD method (create, read, update, destroy).


    Rails make it easy for you to build websites because it already comes with a method
    for resources that it can use for making a REST resource. REST, or Representational
    State Transfer is known as the web’s architectural structure which is used to
    design all applications that use a network, and instead of using rather complex
    operations to link two machines, you can use HTTP to make machines communicate.
    That means that in a lot of ways, the Internet is based on a RESTful design.


    Now, following the project you are creating, pull up config/routes.rb and make
    sure it’s going to look like this:


    Rails.application.routes.draw do


      resources :articles


      root ''welcome#index''


    end


    If you are going to look at the rake routes, you will notice that Rails has already
    made routes for all actions involving REST. It is going to look like this:


    $ bin/rake routes


          Prefix Verb   URI Pattern                  Controller#Action


        articles GET    /articles(.:format)          articles#index


                 POST   /articles(.:format)          articles#create


    new_article GET    /articles/new(.:format)      articles#new


    edit_article GET    /articles/:id/edit(.:format) articles#edit


         article GET    /articles/:id(.:format)      articles#show


                 PATCH  /articles/:id(.:format)      articles#update


                 PUT    /articles/:id(.:format)      articles#update


                 DELETE /articles/:id(.:format)      articles#destroy


            root GET    /                            welcome#index


    #  Chaper 6 Creating Article Title


    This part would be the creating and reading part of CRUD, where you would put
    in a location where you would be placing articles for the blog you’re building.
    In order to do so, you can create an ArticlesController by running this code:


    $ bin/rails g controller articles


    Now, you need to manually place an action inside the controller that you just
    created. Go to app/controllers/articles_controller.rb and pull up the class ArticlesController.
    Edit it to look like this:


    class ArticlesController < ApplicationController


      def new


      end


    end


    You now have to create a template that Rails would be able to view. In order to
    create a title for the article that you want to display, pull up app/views/articles/new.html.erb
    and make a new file there. Type the following:


    <h1>New Article</h1>


    What did just happen? Check out http://localhost:3000/articles/new and you will
    see that the page now has a title! You will now want to create a template that
    will look like a form that you can fill up to write your articles in online.


    #  Chapter 7 Creating the Form


    Pull up app/views/articles/new.html.erb and then add this code:


                  <%= form_for :article do |f| %>


      <p>


        <%= f.label :title %><br>


        <%= f.text_field :title %>


      </p>


      <p>


        <%= f.label :text %><br>


        <%= f.text_area :text %>


      </p>


      <p>


        <%= f.submit %>


      </p>


    <% end %>


    You will see that you have just created a form that has a space for the article
    title text, submit button, and it comes with boxes too! That is the function of
    the code form_for. You will realize that when you submit an article you are going
    to create, it needs to be done in another URL and then the entire text should
    then go somewhere else. Edit app/views/articles/new.html.erb by finding the form_for
    line and make it look like this:


    <%= form_for :article, url: articles_path do |f| %>


    In Rails, the action “create” does the job of making new forms for submissions,
    and therefore, your form should be working towards this action. You would notice
    that when you try to submit an article, you would see an error there. In order
    to make it work, you need to make a “create action” within the ArticlesController.


    Create the Article


    In order to get rid of this error, you need to edit the ArticlesController class
    found in app/controllers/articles_controller.rb. It should look like this:


    class ArticlesController < ApplicationController


    def new


    end


    def create


    end


    end


    Once that is done, the controller should now be able to save the article to the
    database. Now, you would need to set the parameters of actions done by controllers.
    Now, make the ending of the above lines to look like this instead:


    def create


      render plain: params[:article].inspect


    end


    Now that should make the error go away. Try refreshing the page to see what happened.


    Make the Model


    Rails already provide a generator that would be used by your project to launch
    a model. To order Rails to start generating one, run this on the terminal:


    $ bin/rails generate model Article title:string text:text'
