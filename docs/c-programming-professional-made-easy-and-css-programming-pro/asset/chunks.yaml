    作者：SAM KEY\n\n# C++ 编程专业精通\n## 让任何计算机用户都能在一天内掌握专家级 C++ 程序！\n\n版权所有 2015 Sam Key\
    \ - 保留所有权利。\n\n以任何方式通过电子手段或打印格式复制、复制或传输本文的任何部分都是不法的。严禁录制本出版物，未经出版者书面许可，不允许对本文进行任何存储。保留所有权利。\n\
    \n## 目录\n- 引言\n- 第 1 章 - C++ 简介\n- 第 2 章 - C++ 变量与运算符\n- 第 3 章 - 关于用户输入的一切\n-\
    \ 第 4 章 - 使用流程语句\n- 结论\n\n## 引言\n感谢你的下载，并祝贺你下载《C++ 编程专业精通》这本书。\n\n本书包含了关于如何学习\
    \ `C++` 编程语言及其应用经过的步骤和策略。\n\n你不需要成为专业开发者也可以编写快速且简单的 `C++` 程序。通过这本书，任何具有基础计算机知识的人都可以探索并享受\
    \ `C++` 编程语言的威力。书中包含了以下任何初学者今天即可开始编码的基础主题：\n\n* 基础 `C++` 术语\n* 理解 `C++` 程序结构\n\
    * 变量 `Variables`、表达式 `Expressions` 和运算符 `Operators`\n* 使用输入输出流进行用户交互\n* 创建逻辑比较\n\
    * 创建循环并使用条件语句\n* 以及更多！\n\n再次感谢下载本书，希望你读得愉快！\n\n## 第 1 章 – C++ 简介\n### 你将学到：\n\
    * `C++` 语言的简史\n* `C++` 基础术语\n* `C++` 程序结构\n\n`C++` 是今天人们使用的流行的编程语言之一。更具体地说，`C++`\
    \ 是一个由“命令”组成的库，告诉你的计算机要做什么以及如何做。这些命令构成了 `C++` 源代码。\n\n请注意，`C++` 与之前的 `C` 语言语言不同。事实上，当\
    \ `Bjarne Stroustrup` 在 1983 年创建它时，它被认为是 `C` 语言的更好版本。\n\n即使在今天，`C++` 语言仍然是世界上许多编程专家的“起点”。尽管它特别容易学习和应用，但精通\
    \ `C++` 的天花板非常高。\n\n### `C++` 基础术语\n当然，学习 `C++` 编程语言的第一步是理解基础术语。为了防止你在阅读本书时在任何时候产生不必要的困惑，本节解释了\
    \ `C++` 程序语法中最常用的术语。就像整个编程语言本身一样，C++` 中的大多数术语都易于记忆和理解。\n\n#### 编译器 (Compiler)\n\
    在进行任何操作之前，请注意，运行你用 `C++` 编写的代码需要一个`compiler`。将编译器想象成“翻译器”，它们将编程语言转换为机器语言——计算机能理解的语言。机器语言由两个字符（1\
    \ 和 0）组成，这就是它也被称为二进制语言。如果你在学校学习 `C++`，那么你不必担心为 `C++` 寻找编译器或集成开发环境。\n\n#### 集成开发环境\
    \ (Integrated Development Environment)\n集成开发环境 (`IDE`) 本质上是你用来编写 `C++` 程序的软件。IDE\
    \ 附带运行你代码所需的编译器是有意义的。如果你没有 `C++` 编程经验并尝试自学，你可以选择免费的 `C++ IDE`，如 `Code::Blocks`。对于完全初学者来说，一个好的选择是选择简单的\
    \ `C++ IDE`，如 `Quincy 2005`，因为它需要的设置非常少。\n\n#### 变量与参数 (Variables and Parameters)\n\
    `Variables` 是程序内存中的独立区块，包含一个给定的值。一个值可以设置为常量，通过运算符由其他变量的值确定，或者通过用户输入设置/更改。`Variables`\
    \ 由变量名或标识符表示。在 `C++` 编程中，只要所有字符有效，你就可以使用任何所需的变量名。记住，标识符中只能字母数字和“下划线” (`_`)。不允许使用标点符号和其他符号。\n\
    \n记住，变量在使用之前总是需要先声明。声明变量与决定它们的实际值不同；这意味着这两个过程是在两个不同的代码中完成的。这些将在下一章中解释。\n\n“参数”（Parameters）的工作方式与普通变量相同。事实上，它们的写法甚至完全相同。然而，参数和变量的初始化方式不同。参数专门包含在函数中，允许将参数传递到调用函数的另一个独立位置。\n\
    \n#### 语句 (Statements)\n每个用 `C++` 编写的程序由不同的代码行组成，执行设置变量、调用函数和其他表达式等任务。这些行就是语句。每个单独的语句始终以分号\
    \ (`;`) 结束。更重要的是，函数中的语句是根据先后顺序顺序执行的。当然，这种顺序可以使用流程语句（如“if 语句”和“循环”）来改变。\n\n####\
    \ 函数 (Functions)\n`Functions` 是 `C++` 程序中的块，结构用于完成单个任务。你可以在程序运行的任何点调用函数。大括号或花括号\
    \ (`{}`) 包围着函数中的语句或“体”。除了函数名，函数还通过相应的“类型”设置返回值的形式。你还可以在函数的开头使用并设置参数。它们封装在括号 `()`\
    \ 中，并使用逗号 (`,`) 分隔。\n\n在 `C++` 中，以下是创建函数最常用的语法：\n\n```\n\"type\" \"name\" ( 参数\
    \ 1, 参数 2, 参数 3, …)\n{\n    \"语句\";\n}\n```\n\n#### 注释 (Comments)\n在处理特别大的项目时，大多数资深程序员使用“注释”，作为\
    \ `C++` 程序特定部分的描述。注释被编译器完全忽略，因此可以忽略正确的代码语法。注释以双斜杠 (`//`) 或斜杠星号 (`/*`) 开头。你将在本书的示例中发现注释以帮助你理解。一个快速的例子就是下面的“Hello\
    \ World!”程序。当然，你也可以在未来的项目中使用注释以便参考和调试。\n\n### `C++` 程序结构\n`C++` 的程序结构非常容易理解。编译器从上到下读取每一行代码。这就是为什么\
    \ `C++` 程序的开头通常从预处理器指令以及变量及其值的声明开始。说明这种结构最好的方法是使用 `C++` 世界中最著名的例子——“Hello World!”程序。注意下面的代码行以及注释：\n\
    \n```cpp\n#include <iostream> // 这是一个预处理器指令\n\nint main() // 这一行启动名为 main 的函数，每个\
    \ C++ 程序中都应该找到它\n\n{\n    std::cout << “Hello World!\"; // 大括号之间的语句构成了 main 函数体\n\
    \n    return 0; // return 0; 语句用于告诉程序函数运行正常。然而，某些编译器在 main 函数中不需要这一行\n}\n```\n\
    \n"
- fmt: "\nThe topmost line (`#include <iostream>`) is a preprocessor directive that\
    \ defines a section of the standard C++ programming library known as the Input/Output\
    \ Stream or simply `iostream`. This section handles the input and output operations\
    \ in C++ programs. Remember that this is important if you wish to use `std::cout`\
    \ in the main function’s body.\n\nThe first line `int main ()` initializes the\
    \ main function. Remember that the `int` refers to the integer data type and the\
    \ `main` refers to the function’s name. There are other data types aside from\
    \ `int`. But you should focus on the integer data type for now. Since the `Hello\
    \ World!` program does not need a parameter, it leaves the space between the parentheses\
    \ succeeding the function name blank. Also, bear in mind that you should NOT place\
    \ a semicolon (`;`) after initializing functions.\n\nNext is the function’s body,\
    \ denoted by the open curly brace. This particular part (`std::cout`) of the program\
    \ refers to the standard character output device, which is the computer’s display\
    \ device. Next comes the insertion operator (`<<`) from the input/output stream\
    \ which means the rest of the line is to be outputted (excluding quotations).\
    \ Lastly, the statement is closed with a semicolon (`;`).\n\nThe last line in\
    \ the function’s body is the return statement (`return = 0;`). Remember that the\
    \ return expression (in this example, `0`) depends on the data type specified\
    \ upon initialization of the function. However, it is possible to create functions\
    \ without the need for return statements using the `void` function type. For example;\
    \ `void main ()`.\n\nAn alternate way to do this is to include the line `using\
    \ namespace std;` under the preprocessor line so you no longer need to write `std::`\
    \ each time you use it. If you opt for this method, the code would look like:\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    cout\
    \ << \"Hello World!\";\n    return 0;\n}\n```\n\n# Chapter 2 – C++ Variables and\
    \ Operators\n\n## What You Will Learn:\n- Introduction to C++ Operators and How\
    \ to Use Them\n- Declaring and Determining the Value of Variables\n- Creating\
    \ New Lines in the Program Output\n\nIn a C++ program, variables and constants\
    \ are controlled or “operated” using Operators. Take note that the basic operators\
    \ in the C++ programming language are essentially the same as arithmetic operator.\
    \ This includes the equal sign (`=`) for assigning expressions, the plus sign\
    \ (`+`) for addition, the minus sign (`-`) for subtraction, the asterisk (`*`)\
    \ for multiplication, the forward slash (`/`) for division, and the percentage\
    \ sign (`%`) for obtaining the remainder from any expression.\n\nC++ also uses\
    \ other operators to fulfill additional tasks other than basic arithmetic operations.\
    \ As mentioned in the previous chapter, the `iostream` header allowed you to use\
    \ the insertion operator (`<<`) for processing output. There are also different\
    \ operators accessible even without the `#include` directive. These “basic” operators\
    \ can be categorized under increment/decrement operators, comparison operators,\
    \ compound assignment operators, and logical operators.\n\n## Declaring Variables\n\
    Before using variables in C++ operations, you must first declare them and determine\
    \ their values. Again, declaring variables and giving their values are two separate\
    \ processes. The syntax for declaring variables are as follows:\n\n`\"type\" \"\
    variable\";`\n\nJust like when initializing functions, you need to specify the\
    \ data type to be used for a given variable. For example; say you want to declare\
    \ `x` as an integer variable. The initialization should look like this:\n\n`int\
    \ x;`\n\nAfter the declaration of `x`, you can give it a value using the assign\
    \ operator (`=`). For example; to assign the value `99` to variable `x`, use the\
    \ following line:\n\n`x = 99;`\n\nMake sure to declare a variable first before\
    \ you assign a value to it. Alternatively, you can declare a variable and assign\
    \ a value to it using a single line. This can be done using:\n\n`int x = 99;`\n\
    \nAside from setting these expressions as you write the program, you can also\
    \ use operations and user input to determine their values as the program runs.\
    \ But first, you need to learn about the other operators in C++.\n\n## Increment\
    \ and Decrement Operators\nThe increment operator consists of two plus signs (`++`)\
    \ while the decrement operator consists of two minus signs (`--`). The main purpose\
    \ of increment and decrement operators is to shorten the expression of adding\
    \ and subtracting 1 from any given variable. For example; if `x = 2`, then `++x`\
    \ should equal `3` while `--x` should equal `1`.\n\nIf being used to determine\
    \ the values of two or more variables, increment and decrement operators can be\
    \ included as either a prefix or suffix. When used as a suffix (`x++` or `x--`),\
    \ it denotes the original value of `x` before adding or subtracting 1. When run\
    \ on their own, both `++x` and `x++` have the same meaning. But when used in setting\
    \ other variables, the difference is made obvious. Here is a simple example to\
    \ illustrate the difference:\n\n```cpp\nX = 5;\nY = ++x;\n```\n\nIn this example,\
    \ the value of `y` is determined after increasing the value of `x`. In other words,\
    \ the value of `y` in this example is equal to `6`.\n\n```cpp\nX = 5;\nY = x++;\n\
    ```\n\nIn this example, the value of `y` is determined before increasing the value\
    \ of `x`. In other words, the value of `y` in this example is equal to `6`.\n\n\
    ## Compound Assignment Operators\nAside from basic arithmetic operators and the\
    \ standard assignment operator (`=`), compound assignment operators can also be\
    \ used to perform an operation before a value is assigned. Compound assignment\
    \ operators are basically shortened versions of normal expressions that use basic\
    \ arithmetic operators.\n\nHere are some examples of compound assignment operators:\n\
    \n```cpp\nx -= 1;          // this is the same as the expression x = x - 1;\n\
    x *= y;          // this is the same as the expression x = x * y;\nx += 1;   \
    \       // this is the same as the expression x = x + 1;\nx /= y;          //\
    \ this is the same as the expression x = x / y;\n```\n\n## Comparison Operators\n\
    Variables and other expressions can be compared using relational or comparison\
    \ operators. These operators are used to check whether a value is greater than,\
    \ less than, or equal to another. Here are the comparison operators used in C++\
    \ and their description:\n\n- `==` : checks if the values are equal\n- `<` : checks\
    \ if the first value is less than the second\n- `>` : checks if the first value\
    \ is greater than the second\n- `<=` : checks if the first value is less than\
    \ or equal to the second\n- `>=` : checks if the first value is greater than or\
    \ equal to the second\n- `!=` : checks if the values are NOT equal\n\nComparison\
    \ operators are commonly used in creating condition statements. They can also\
    \ be used to evaluate an expression and return a Boolean value (`true` or `false`).\
    \ Using the comparison operators listed above; here are some example expressions\
    \ and their corresponding Boolean value:\n\n`(8 == 1)` // this line evaluates\
    \ to `false`\n`(8 > 1)` // this line evaluates to `true`\n`(8 != 1)` // this line\
    \ evaluates to `true`\n`(8 <= 1)` // this line evaluates to `false`\n\nAlso take\
    \ note that the Boolean value `false` is equivalent to `0` while `true` is equivalent\
    \ to other non-zero integers. Aside from numerical values, the value of variables\
    \ can also be checked when using comparison operators. Simply use a variable’s\
    \ identifier when creating the expression. Of course, the variable must be declared\
    \ and given an identified value before a valid comparison can be made. Here is\
    \ an example scenario:\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main ()\n{\n    int a = 3; // the values of a and b are set first\n    int\
    \ b = 4;\n    cout << \"Comparison a < b = \" << (a < b);\n    return 0;\n}\n\
    ```\n\nThe output for this code is as follows:\n\nComparison a < b = true\n"
