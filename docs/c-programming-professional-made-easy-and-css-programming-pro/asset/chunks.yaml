    \n现在你已经学会了如何创建控制器、视图和动作，现在是时候创建一个新的资源了。资源是将相似对象组合在一起的东西，就像你对人、植物和动物分组一样。为了资源创建项目，你使用\
    \ `CRUD` 方法（创建、读取、更新、删除）。\n\nRails 让构建网站变得简单，因为它已经带有一个用于资源的方法，可以用于创建 REST 资源。REST，或表述状态转换（Representational\
    \ State Transfer），被认为是 Web 的架构结构，用于设计所有使用网络的应用程序，而不是使用相当复杂的操作来连接两台机器，你可以使用 HTTP\
    \ 让机器之间进行通信。这意味着在很多方面，互联网是基于 RESTful 设计的。\n\n控制器的目的是允许你的程序接收任何请求。当你进行路由（route）时，你实际上是让\
    \ Rails 决定你设置的哪些控制器将接收何种类型的请求。这可能意味着会有不同的路由指向该控制器，并由特定的动作（action）触发。需要一个 `action`\
    \ 来收集发送到视图（view）所需的任何信息。\n\n## 视图 (View)\n\n这个东西的主要目的是让 Rails 能够显示提供给动作的信息，并以其他人可以阅读的格式进行显示。已经提供了不同的视图模板，它们是用\
    \ eRuby 编写的，可以在信息发送给任何想要查看这些信息的人之前在请求循环中使用。\n\n懂了吗？很好。现在，为了设置你的欢迎页，你需要生成一个控制器，将其命名为“welcome”，并使用一个名为“index”的动作。你的代码看起来如下：\n\
    \n```\n$ bin/rails generate controller welcome index\n```\n\n现在，Rails 将为你创建一组文件以及路由供你使用。当\
    \ Rails 完成这些操作后，你将看到：\n\n```\ncreate  app/controllers/welcome_controller.rb\n\
    route  get 'welcome/index'\ninvoke  erb\ncreate    app/views/welcome\ncreate \
    \   app/views/welcome/index.html.erb\ninvoke  test_unit\ncreate    test/controllers/welcome_controller_test.rb\n\
    invoke  helper\ncreate    app/helpers/welcome_helper.rb\ninvoke  assets\ninvoke\
    \     coffee\ncreate      app/assets/javascripts/welcome.js.coffee\ninvoke   \
    \  scss\ncreate      app/assets/stylesheets/welcome.css.scss\n```\n\n如果你想查看控制器的代码路径，请前往\
    \ `app/controllers/welcome_controller.rb`。如果你想查看视图，可以在 `app/views/welcome/index.html.erb`\
    \ 找到它。\n\n有趣的部分来了。调出文本编辑器并打开 `app/views/welcome/index.html.erb`。清除你看到的所有代码，并将其替换为以下内容：\n\
    \n```html\n<h1>Hello Rails!</h1>\n```\n\n执行此操作后，你已经成功地告知了 Rails 你希望显示“Hello Rails!”。这意味着当你访问\
    \ `http://localhost:3000` 时，这也是你想看到的问候语，而那里仍在显示“Welcome aboard”。\n\n### 创建应用主页\n\
    \n你需要的下一件事是告诉 Rails 主页在哪里。为此，再次调出文本编辑器并打开 `config/routes.rb`。你应该会看到类似的内容：\n\n\
    ```ruby\nRails.application.routes.draw do\n  get 'welcome/index'\n  # 优先级基于创建顺序：\n\
    \  # 先创建的 -> 优先级最高。\n  #\n  # 你可以使用 \"root\" 为你的网站根目录设置路由\n  # root 'welcome#index'\n\
    \  #\n  # ...\nend\n```\n\n这些行代表了路由文件，它告诉 Rails 如何将请求链接到特定的动作和控制器。现在，找到 `root\
    \ 'welcome#index'` 这一行并取消注释。当你回到 `http://localhost:3000` 时，你会发现它现在显示的是 Hello Rails!\n\
    \n# 第 7 章 创建表单\n\n调出 `app/views/articles/new.html.erb` 并添加以下内容：\n\n```html\n<h1>New\
    \ Article</h1>\n```\n\n执行此操作后，你已经成功地告知了 Rails 你希望显示“New Article”。这意味着当你访问 `http://localhost:3000`\
    \ 时，这也是你想看到的问候语，而那里仍在显示“Welcome aboard”。\n\n## 创建表单 (Form)\n\n调出 `app/views/articles/new.html.erb`\
    \ 并添加以下内容：\n\n```erb\n<%= form_for :article do |f| %>\n  <p>\n    <%= f.label\
    \ :title %><br>\n    <%= f.text_field :title %>\n  </p>\n  <p>\n    <%= f.label\
    \ :text %><br>\n    <%= f.text_area :text %>\n  </p>\n  <p>\n    <%= f.submit\
    \ %>\n  </p>\n<% end %>\n```\n\n你会发现你刚刚创建了一个表单，它有一个文章标题的空间、提交按钮，而且还带框！这就是 `form_for`\
    \ 代码的功能。你会意识到，当你提交要创建的文章时，它需要在另一个 URL 中完成，然后整个文本都应该去哪里。编辑 `app/views/articles/new.html.erb`，找到\
    \ `form_for` 这一行并让它看起来像这样：\n\n```erb\n<%= form_for :article, url: articles_path\
    \ do |f| %>\n```\n\n在 Rails 中，`create` 动作负责为提交创建新的表单，因此你的表单应该是朝着这个动作工作的。\n\n##\
    \ 创建模型 (Model)\n\nRails 已经提供了一个生成器，你的项目可以使用它启动模型。为了让 Rails 开始生成模型，请在终端上运行以下命令：\n\
    \n```\n$ bin/rails generate model Article title:string text:text\n```\n"
