    Your Name Here


    Inputting Strings


    To allow user input values for strings, you need to use the function “getline”
    in addition to the standard input stream “cin”. The syntax for this is “getline
    (cin, [string]);”. Below is an example program that puts string input into application.


    #include <iostream>


    #include <string>


    using namespace std;


    int main ()


    {


                  string name;


                  cout << “Greetings! What is your name?\n”;


    getline (cin, name); // this is the extraction syntax


                  cout << “Welcome “ << name;


                  return 0;


    }


    Take note that strings have “blank” values by default. This means nothing will
    be printed if no value is assigned or if there is no user input.


    Chapter 4 – Using Flow Control Statements


    What You Will Learn:


    **If and Else Selection Statements


    **Creating Choices


    **Creating Iterating/Looping Statements


    Remember that statements are the basic building blocks of a program written using
    C++. Each and every line that contains expressions such as a variable declaration,
    an operation, or an input extraction is a statement.


    However, these statements are linear without some form of flow control that can
    establish the “sense” or “logic” behind a C++ program. This is why you should
    learn how to utilize flow control statements such as selection statements and
    looping statements. 


    If and Else Statements


    If and else statements are the most basic form of logic in a C++ program. Basically,
    the main purpose of an “if” statement is to allow the execution of a specific
    line or “block” of multiple statements only if a specified condition is fulfilled.


    Next is the “else” statement which allows you to specify what would occur in case
    the conditions aren’t met. Without an “else” statement, everything inside the
    “if” statement will be completely ignored. Here the syntax for an “if” and “else”
    statement:'
