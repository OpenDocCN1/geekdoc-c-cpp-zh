- fmt: "\n![](images/00002.jpeg)\n\n# Book 1: C++ Programming Professional Made Easy\n\
    BY SAM KEY\n\n# Book 2: Rails Programming Professional Made Easy\nBY SAM KEY\n\
    \n# C++ Programming Professional Made Easy\n## Expert C++ Programming Language\
    \ Success in a Day for Any Computer User! \n\nCopyright 2015 by Sam Key - All\
    \ rights reserved.\n\nIn no way is it legal to reproduce, duplicate, or transmit\
    \ any part of this document in either electronic means or in printed format. Recording\
    \ of this publication is strictly prohibited and any storage of this document\
    \ is not allowed unless with written permission from the publisher. All rights\
    \ reserved.\n\n## Table Of Contents\n- Introduction\n- Chapter 1 - Introduction\
    \ to C++\n- Chapter 2 - C++ Variables and Operators\n- Chapter 3 - All About User\
    \ Input\n- Chapter 4 - Using Flow Control Statements\n- Conclusion\n\n## Introduction\n\
    I want to thank you and congratulate you for downloading the book, “Professional\
    \ C++ Programming Made Easy”.\n\nThis book contains proven steps and strategies\
    \ on how to learn the `C++` programming language as well as its applications.\n\
    \nThere’s no need to be a professional developer to code quick and simple `C++`\
    \ programs. With this book, anyone with basic computer knowledge can explore and\
    \ enjoy the power of the `C++` Programming Language. Included are the following\
    \ fundamental topics for any beginner to start coding today:\n\n* The basic `C++`\
    \ terms\n* Understanding the `C++` Program Structure\n* Working with `Variables`,\
    \ `Expressions`, and `Operators`\n* Using the Input and Output Stream for User\
    \ Interaction\n* Creating Logical Comparisons\n* Creating Loops and Using Condition\
    \ Statements\n* And Many More!\n\nThanks again for downloading this book, I hope\
    \ you enjoy it!\n\n## Chapter 1 – Introduction to C++\n### What You Will Learn:\n\
    * A Brief History of the `C++` Language\n* `C++` Basic Terminology\n* `C++` Program\
    \ Structure\n\n`C++` is one of the most popular programming languages that people\
    \ are using today. More specifically, `C++` is a library of “commands” that tell\
    \ your computer what to do and how to do it. These commands make up the `C++`\
    \ source code.\n\nTake note that `C++` is different from the `C` programming language\
    \ that came before it. In fact, it is supposedly better version of the `C` language\
    \ when `Bjarne Stroustrup` created it back in 1983.\n\nEven today, the `C++` language\
    \ serves as the “starting point” for many experts in the world of programming.\
    \ Although it is particularly easy to learn and apply, the ceiling for `C++` mastery\
    \ is incredibly high.\n\n### `C++` Basic Terminology\nOf course, the first step\
    \ in learning the `C++` programming language is to understand the basic terms.\
    \ To prevent any unnecessary confusion at any point as you read this book, this\
    \ section explains the most commonly used terms in the `C++` program syntax. Just\
    \ like the entire programming language itself, most terms in `C++` are easy to\
    \ remember and understand.\n\n#### Compiler\nBefore anything else, take note that\
    \ a `compiler` is needed to run the codes you’ve written with `C++`. Think of\
    \ compilers as “translators” that convert programming language into machine language\
    \ – the language that a computer understands. The machine language consists of\
    \ only two characters (1s and 0s), which is why it is also called as binary language.\
    \ If you’re learning `C++` at school, then you shouldn’t worry about getting a\
    \ compiler for `C++` or an Integrated Development Environment for that matter.\n\
    \n#### Integrated Development Environment\nAn Integrated Development Environment\
    \ (`IDE`) is essentially the software you’re using to write `C++` programs. It\
    \ only makes sense for IDEs to come with compilers needed to run your codes. If\
    \ you have no experience with `C++` programming and attempting to learn it on\
    \ your own, you can opt for a free `C++ IDE` such as `Code::Blocks`. A good choice\
    \ for complete beginners is to opt for a simple `C++ IDE` such as `Quincy 2005`\
    \ since there is very little setup required.\n\n#### Variables and Parameters\n\
    `Variables` are individual blocks in the program’s memory that contains a given\
    \ value. A value may be set as a constant, determined by the value of other variables\
    \ using operators, or set/changed through user input. `Variables` are denoted\
    \ by variable names or identifiers. In programming with `C++`, you can use any\
    \ variable name you desire as long as all characters are valid. Remember that\
    \ only alphanumeric characters and “underscores” (`_`) can be used in identifiers.\
    \ Punctuation marks and other symbols are not allowed.\n\nKeep in mind that variables\
    \ always need to be declared first before they can be used. Declaring variables\
    \ are different from deciding their actual values; meaning both processes are\
    \ done in two different codes. These processes will be explained in the next chapter.\n\
    \n“Parameters” work the same way as regular variables. In fact, they are even\
    \ written in the same syntax. However, parameters and variables are initialized\
    \ in different ways. Parameters are specifically included in functions to allow\
    \ arguments to be passed to a separate location from which the functions are called.\n\
    \n#### Statements\nEvery program written with `C++` consists of different lines\
    \ of code that performs tasks such as setting variables, calling functions, and\
    \ other expressions. These lines are statements. Each individual statement always\
    \ ends with a semicolon (`;`). More importantly, statements in a function are\
    \ executed chronologically based on which comes first. Of course, this order can\
    \ be altered using flow control statements such as “if statements” and “loops”.\n\
    \n#### Functions\n`Functions` are blocks in a `C++` program structured to complete\
    \ a single task. You can call upon functions at any point whilst the program is\
    \ running. Curly brackets or braces (`{}`) enclose the statements or “body” in\
    \ each function. Aside from a function name, functions are also set with corresponding\
    \ “types” which refer to the requested form of returned value. You can also use\
    \ and set parameters at the beginning of each function. They are enclosed in parentheses\
    \ (`()`) and separated using commas (`,`).\n\nIn `C++`, the following is the most\
    \ used syntax when creating functions:\n\n```\n\"type\" \"name\" ( parameter 1,\
    \ parameter 2, parameter 3, …)\n{\n    \"statements\";\n}\n```\n\n#### Comments\n\
    When working on particularly bigger projects, most experienced programmers use\
    \ “comments” that can be used as descriptions for specific sections in a `C++`\
    \ program. Comments are completely ignored by a compiler and can therefore ignore\
    \ proper coding syntax. Comments are preceded either by a two slashes (`//`) or\
    \ a slash-asterisk (`/*`). You will find comments in the examples throughout this\
    \ book to help you understand them. A quick example would be the “Hello World!”\
    \ program below. Of course, you can also use comments in your future projects\
    \ for reference and debugging purposes.\n\n### The `C++` Program Structure\nThe\
    \ program structure of `C++` is very easy to understand. The compiler reads every\
    \ line of code from top to bottom. This is why the first part of a `C++` program\
    \ usually starts with preprocessor directives and the declaration of variables\
    \ and their values. The best way to illustrate this structure is to use the most\
    \ popular example in the world of `C++` -- the “Hello World!” program. Take note\
    \ of the lines of code as well as the comments below:\n\n```cpp\n#include <iostream>\
    \ // this is a preprocessor directive\n\nint main() // this line initiates the\
    \ function named main, which should be found in every C++ program\n\n{\n    std::cout\
    \ << “Hello World!\"; // the statements found between the curly braces make up\
    \ the main function’s body\n\n    return 0; // the return 0; statement is required\
    \ to tell the program that the function ran correctly. However, some compilers\
    \ do not require this line in the main function\n}\n```\n"
