    ## 逻辑运算符\n\nC++ 中还有其他逻辑运算符可以确定布尔数据的值。它们是非逻辑 (`!`)、与逻辑 (`&&`) 和或逻辑 (`||`) 运算符。以下是它们如何使用的具体示例：\n\
    \n`!(6 > 2)` // 非逻辑运算符 (`!`) 会完全反转任何关系表达式并产生相反的结果。这个表达式为假，因为 `6 > 2` 是正确的\n\n\
    `(6 > 2 && 5 < 10)` // 与运算符 (`&&`) 仅在两个表达式都正确时才产生真。这个表达式为真，因为 `6 > 2` 和 `5 < 10`\
    \ 都是正确的\n\n`(6 = 2 || 5 < 10)` // 或运算符 (`||`) 只要其中一个表达式正确就会产生真。这个表达式为真，因为尽管 `6\
    \ = 2` 是假的，但 `5 < 10` 是正确的。\n\n你还可以在这两个逻辑运算符之外使用非逻辑运算符。例如：\n\n`!(6 = 2 || 5 <\
    \ 10)` // 这个表达式为假\n\n`!(6 > 2 && 5 < 10)` // 这个表达式也是假\n\n`!(6 < 2 && 5 < 10)`\
    \ // 这个表达式为真\n\n## 创建新行\n\n从本书的这里开始，你将学习生成多行输出的简单 C++ 程序。若要在生成输出时创建新行，你只需要使用换行符\
    \ (`\\n`)。或者，你在使用 `cout` 代码时可以使用 `endl;` 操纵符来创建新行。主要区别在于，每当你配合 `cout` 使用 `endl;`\
    \ 操纵符时，输出流的内部缓冲区会被“刷新”。以下是使用这两者的示例：\n\n```cpp\ncout << “Sentence number one \\\
    nSentence number two”;\n```\n\n上面的示例使用了换行符。\n\n```cpp\ncout << “Sentence number\
    \ one” << endl;\ncout << “Sentence number two”;\n```\n\n上面的示例使用了 `endl;`。\n\n\
    当然，第一种代码（使用 `\\n`）相对简单，更适用于一般的输出目的。两者都会产生以下输出：\n\nSentence number one\nSentence\
    \ number two\n\n## 第 3 章 – 关于用户输入\n\n### 你将学到：\n* 利用输入流\n* 使用输入来确定或修改值\n* 如何输入和输出字符串\n\
    \n到目前，你已经学习了如何编写一个可以执行算术运算、比较并产生输出的 C++ 程序。这次，你将学习如何编写计算机程序最重要的方面之一——用户输入。\n\n\
    如前所述，用户输入可以被用于确定或修改某些变量的值。C++ 程序使用称为“流”（streams）的抽象来处理输入和输出。由于你已经了解输出 (`cout`)\
    \ 的语法，现在是时候学习输入 (`cin`) 的语法了。\n\n### 提取运算符\n\n输入语法 `cin` 配合提取运算符 (`>>`) 用于格式化输入。这种组合结合键盘是大多数程序环境的标准输入。记住，在进行输入之前，你仍然需要先声明变量。这是一个简单的示例：\n\
    \n```cpp\nint x; // 此行声明了变量标识符 x。注意数据类型 “int”，它意味着只接受整数值\ncin >> x; // 这一行从 cin\
    \ 语法中提取输入并存储到 x 中\n```\n\n也可以在一行内请求多个变量的用户输入。例如；假设你想为变量 `x` 和 `y` 存储整数值。它看起来应该是这样的：\n\
    \n```cpp\nint x, y; // 这一行声明了两个变量\ncin >> x >> y; // 这一行为变量 x 和 y 提取用户输入\n```\n\
    \n注意，程序会自动要求用户为两个变量输入两个值。先输入哪个取决于变量在行中的顺序（在这种情况下，会先请求变量 `x` 的输入）。\n\n这是一个提取用户输入并产生输出的程序示例：\n\
    \n```cpp\n#include <iostream> // 再次，这对于输入输出至关重要\nusing namespace std;\n\nint main\
    \ ()\n{\n    int x;\n    cin >> x;\n    cout << “You inserted: ” << x;\n    return\
    \ 0;\n}\n```\n"
