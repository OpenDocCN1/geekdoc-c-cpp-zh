  \nDescription\n\n# 图 14.3 修改后的示例代码段结果\n\n在下一节中，我们将查看指针在另一种列表实现形式中的用法。\n\n## 14.2\
  \ 顺序结构与链式结构\n\n正如我们在 第 13 章 中指出的，计算中的许多问题都涉及项目列表。在这一章中，我们使用数组实现了 `List` ADT。数组的大小是固定的，但列表中的项目数量是变化的。\n\
  \n如果我们正在实现的列表是排序列表，那么使用数组表示法可以更高效地执行某些操作。例如，搜索特定值可以使用二分查找。然而，使用数组表示法在排序列表中插入和删除项目是低效的。要插入新项目，我们必须移动数组元素以腾出空间（参见**图\
  \ 14.4**）。同样，从排序列表中删除项目需要移动元素以填补差距。\n\n当插入和删除频繁发生时，有一种更好的表示方法：`链表`（linked list）。链表是节点的集合，每个节点都与其后继节点有显式的连接。由于由于，节点不必位于连续的位置。每个节点通常由于：\n\
  \n*   一个包含数据的组件\n*   一个链接成员（link member），它提供下一个节点的地址\n\n![A code fragment with comment\
