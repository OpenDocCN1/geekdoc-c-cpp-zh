  \n## 11.5 将二维数组作为参数传递\n\n之前我们提到，当一维数组声明为函数参数时，数组的大小通常会被省略：\n\n![An expression. void\
  \ some Func, left parenthesis, float, alpha, left square bracket, right square bracket,\
  \ int, size, right parenthesis.](img/9781284166033_CH11_P628-1.jpg)\n\n如果你在括号中包含大小，编译器会忽略它。\n\
  \n与一维数组一样，当将二维数组作为参数传递时，调用者数组的基地址会被发送到函数。然而，你不能省略两个维度的大小。你可以省略第一个维度的大小（行数），但不能省略第二个维度（列数）。原因如下。\n\
  \n在计算机内存中，C++ 按行顺序存储二维数组。如果我们把内存看作一排长长的内存单元，那么数组的第一行紧接着第二行，紧接着是第三行，依此类推（参见图 11.12）。\n\
  \n要定位 `beta[i][j]`，在图 11.12 中必须指定列数。`beta[i][j]` 的地址计算如下：\n```cpp\nbase_address\
  \ + (i * num_columns + j) * sizeof(element_type)\n```\n如果你在括号中包含大小，编译器会忽略它。与一维数组一样，当将二维数组作为参数传递时，调用者数组的基地址会被发送到函数。然而，你不能省略两个维度的大小。你可以省略第一个维度的大小（行数），但不能省略第二个维度（列数）。原因如下。\n\
  \n```cpp\nvoid someFunc(float array[][10], int size)\n```\n\n## 11.6 处理二维数组\n\n\
  处理二维数组通常意味着按照四模式访问数组：按位置、按行、按列或遍历。这些方法都可能涉及子数组处理。\n\n访问组件的最简单方法是直接查找位置。例如，用户可能会输入纬度和经度坐标，我们将其作为索引来查找数组中的名称。这种过程有时被称为随机访问，因为输入数据可以是任意一组坐标。\n\
  \n在许多情况下，我们需要处理特定行或列的所有元素。考虑之前定义的 `hiTemp` 数组，其中行代表周，列代表天。如果我们想找到某周的平均最高温度，将对该行求和并除以\
  \ 7。如果我们想找到某日的平均最高温度，将对该列求和并除以 52。前者的情况是按行访问；后者是按列访问。\n\n现在假设我们想要确定全年的平均最高温度。我们访问数组中的每个元素，将它们的值求和并除以\
  \ 364。在这种情况下，访问顺序（按行或按列）并不重要。（当我们初始化数组的每个元素时也是如此。）\n\n然而，有时顺序是重要的。例如，如果我们想要每周的平均最高温度，我们需要轮流处理每一行。但是，如果我们想要每天的平均值，我们需要按列处理整个数组。\n\
