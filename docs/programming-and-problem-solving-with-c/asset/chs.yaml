  \n## 11.3 特殊数组处理\n\n有两种数组处理发生特别频繁：仅使用已声明数组的一部分（子数组）以及使用在问题中具有意义的索引值（具有语义内容的索引）。我们在这里简要描述这两种方法，并在以后给出更多示例。\n\
  \n### 子数组处理\n\n数组的*大小*——即声明的数组组件数量——是在编译时确定的。我们声明一个数组的大小等于它可能需要的最大。然而，由于放入数组的值数量通常取决于数据本身，因此我们可能不会填充所有组件。为了避免处理数组中的空位置，我们必须跟踪实际填充了多少组件。\n\
  \n当值被放入数组时，我们对它们进行计数。然后我们使用该计数只处理那些包含值的组件；剩余的位置则不被处理。例如，如果一个班有 250 名学生，分析测试成绩的程序将为成绩留出\
  \ 250 个位置。但是，某些学生可能缺席考试。因此，必须统计成绩的数量，并用这个数字（而不是 250）来控制数组的处理。\n\n当数组中存储的值少于其声明的大小时，我们传递给数组的函数也必须接收值的数量作为参数。例如，在\
  \ `ZeroOut` 函数中，我们将数组和值的数量作为参数传递。然而，有种更好的方法：数组及其值的计数可以绑定在一个记录中。\n\n例如，考虑学生记录的集合。我们可以稍微修改问题，说明实际学生记录的数量是未知的。读取循环将是一个\
  \ eof 循环而不是 `For` 循环。让我们扩展 `ReadValues` 和 `PrintValues`，使其接收包含数组和项目数量的记录。循环将位于函数内部，而不是\
  \ `main` 中。\n\n这里是带有这些更改的完整程序。数据结构的定义和函数原型已高亮显示。\n\n![一段程序段落。](img/9781284166033_CH11_P622-1.jpg)![程序段落的延续。](img/9781284166033_CH11_P623-1.jpg)\n\
  \n描述\n\n![一段程序段落。](img/9781284166033_CH11_P624-1.jpg)\n\n描述\n\n### 语义内容的索引\n\n在某些问题中，索引具有超出位置之外的意义；即索引具有*语义内容*。例如，`salesAmt`\
  \ 是饮料种类。\n\n## 11.4 二维数组\n\n一维数组可以用于表示列表。然而，在许多问题中，项目之间的关系更为复杂。二维数组可以表示表格。\n\n二维数组的声明方式与一维数组相同，但必须为两个维度指定大小。这里是多维数组的声明语法：\n\
  \n```\nData Type ArrayName[Const Expression][Const Expression];\n```\n\n![多维数组声明](img/9781284166033_P625-1)\n\
  \n以下示例声明 `alpha` 为二维数组，其所有组件都是 `float` 类型。该声明创建了如图 11.9 所示的数组。\n\n![代码片段。](img/9781284166033_CH11_P625-2.jpg)\n\
