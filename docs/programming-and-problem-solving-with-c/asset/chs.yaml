  ### 比较\n\n比较是我们经常在枚举类型值上执行的操作。当你比较值时，它们的顺序是由它们在类型声明中列出的顺序决定的。例如，表达式\n\n![一个布尔表达式。](img/9781284166033_CH10_561.jpg)\n\
  \nDescription\n\n如果 `inPatient` 包含值 `RODENT`、`CAT`、`DOG` 或 `BIRD`，则值为 `true`。\n\n\
  你也可以在 Switch 语句中使用枚举类型的值。因为 `RODENT`、`CAT` 等是字面量，它们可以出现在 case 标签中：\n\n![一个 switch\
  \ 语句。](img/9781284166033_CH10_561a.jpg)\n\nDescription\n\n### 输入和输出\n\n流 I/O 仅为基本内置类型（`int`、`float`\
  \ 等）定义，而不适用于用户定义的枚举类型。枚举类型的值必须间接地输入或输出。\n\n为了输入值，一种策略是读取字符串，并通过查看尽可能多的字母来确定字符串的内容，将其翻译为枚举类型中的一个字面量。\n\
  \n例如，兽医诊所程序可以读取字符串类型的动物种类，然后将 `Animals` 类型的一个值赋值给该患者。`Cat`、`dog`、`horse` 和 `sheep`\
  \ 可以通过它们的首字母确定。`Bovine`、`bird`、`rodent` 和 `reptile` 直在检查第二个字母后才能确定。以下程序片段读取代表动物名称的字符串，并将其转换为\
  \ `Animals` 类型中的值之一：\n\n![一个程序片段。](img/9781284166033_CH10_561b.jpg)![一个程序片段。](img/9781284166033_CH10_562.jpg)\n\
