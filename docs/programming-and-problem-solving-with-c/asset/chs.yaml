  \ `main` 之前，作为所谓的全局声明的示例（这将在第 9 章中介绍）。\n\n4 在 C 语言和前标准 C++ 中，标准头文件以 `.h` 后缀结尾（例如\
  \ `iostream.h`），其中 `h` 表示“头文件”。在 ISO/ANSI C++ 中，标准头文件不再使用 `.h` 后缀。\n\n## 2.3 关于输出的更多\n\
  \n我们可以控制输出的水平和垂直间距，使其更具吸引力（且更易于理解）。让我们先看看垂直间距。\n\n### 创建空行\n\n我们通过在输出语句中使用 `endl`\
  \ 操符来控制垂直间距。你已经看到，一系列输出语句会继续跨当前行写入字符，直到 `endl` 终止该行。这里是一些示例：\n\n| 语句 | 产生的输出^(5)\
  \ |\n| --- | --- |\n| `cout << \"Hi there,\"; cout << \"Lois Lane.\" << endl;` |\
  \ Hi there, Lois Lane. |\n| `cout << \"Have you seen\"; cout << \"Clark Kent?\"\
  \ << endl;` | Have you seen Clark Kent? |\n| `cout << \"Hi there,\" << endl; cout\
  \ << \"Lois Lane.\" << endl;` | Hi there, Lois Lane. |\n| `cout << \"Have you seen\"\
  \ << endl; cout << \"Clark Kent?\" << endl;` | Have you seen Clark Kent? |\n| `cout\
  \ << \"Hi there,\" << endl; cout << \"Lois Lane.\"; cout << \"Have you seen\" <<\
  \ endl; cout << \"Clark Kent?\" << endl;` | Hi there, Lois Lane. Have you seen Clark\
  \ Kent? |\n\n你认为接下来的语句会输出什么？\n\n![读者必须说出语句的输出](img/9781284166033_CH02_PRE77.jpg)\n\
  描述\n\n第一个输出语句导致输出 `Hi there,`；`endl` 使控制台窗口光标到下一行。下一条语句没有输出内容，但移动到了下一行。第三条语句输出 `Lois\
  \ Lane.` 并终止该行。最终输出是三行：\n\n![之前语句的输出](img/9781284166033_CH02_PRE78.jpg)\n描述\n\n\
  每当你在 `endl` 之后立即使用 `endl` 时，就会产生一个空行。正如你猜的，，连续使用三次 `endl` 会产生两个空行，连续使用四次会产生三个空行，以此此类推。\n\
  \n注意，我们在 C++ 中编写输出语句有很大的灵活性。我们可以写如下内容：\n\n![之前的语句合并为两行](img/9781284166033_CH02_PRE79.jpg)\n\
  描述\n\n事实上，我们可以这样做：\n\n![两条语句合并为一行](img/9781284166033_CH02_PRE80.jpg)\n描述\n\n还有这样：\n\
  \n![三条语句合并为一行](img/9781284166033_CH02_PRE81.jpg)\n描述\n\n### 在行内插入空格\n\n为了控制输出的水平间距，我们使用\
  \ `tab` 操纵符。例如，为了输出这个：\n\n![显示三行的输出](img/9781284166033_CH02_PRE82.jpg)\n描述\n\n你会使用这些：\n\
  \n![显示两行的输出](img/9781284166033_CH02_PRE83.jpg)\n描述\n\n还有这个：\n\n![显示一行的输出](img/9781284166033_CH02_PRE84.jpg)\n\
  描述\n\n### 特殊字符\n\n我们已经提到，要在字符串中包含双引号，前面必须有一个反斜杠（\\\"`）。C++ 使用反斜杠定义了一些额外的字符。在这里我们讨论三个特别有用的字符。\n\
  \n我们在输出流中使用 `endl` 操纵符来换行。你也可以使用换行符 `\\n` 直接在字符串中放置换行。以下两个语句产生相同的输出：\n\n![使用 endl\
  \ 运算符使输出流转到下一行](img/9781284166033_CH02_PRE85.jpg)\n描述\n\n它们各自显示：\n\n![前两个语句的输出](img/9781284166033_CH02_PRE86.jpg)\n\
  描述\n\n当然，第二条语句显然更易读。从第 8 章开始，我们将遇到在字符串中嵌入 `\\n` 是合理的情况。现在我们建议始终使用 `endl`。\n\n如果你想在输出流中包含单引号，它前面也必须有一个反斜杠：`\\\
  '`。注意，在字符串中包含单引号或将双引号作为字符常量写入是没有问题的。例如，为了输出一个双引号后跟一个单引号，我们可以写：\n\n```cpp\ncout <<\
  \ \"\\\"'\";\n```\n\n\n\n\n![打印双引号和单引号。](img/9781284166033_CH02_PRE88.jpg)\n\n描述\n\
  \n或者\n\n![打印双引号和单引号。](img/9781284166033_CH02_PRE89.jpg)\n\n描述\n\n考虑到反斜杠有这些特殊用途，自然会好奇如何输出反斜杠。答案是，我们必须连续写两个反斜杠：\n\
