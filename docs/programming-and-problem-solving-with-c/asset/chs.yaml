  \ 语言符号在你阅读了本文更多内容后才能理解其含义。\n\n### 空函数\n\n到为止，我们只查看了返回值的函数。事实上，C++ 提供了另一种函数。看下面函数\
  \ `CalcPay` 的定义。注意它是如何以 `void` 单词开头而不是 `int` 或 `float` 等数据类型的：\n\n![空函数的格式](img/9781284166033_CH03_PRE57.jpg)\n\
  \n描述\n\n`CalcPay` 是一个不返回值的函数示例。相反，它只是执行某些操作然后退出。我们将这样的函数称为非返回值函数、空返回函数，或者最简短地称为\
  \ `void function`。在某些编程语言中，`void function` 被称为过程（procedure）。\n\n空函数的调用方式与返回值函数不同。对于返回值函数，函数调用出现在表达式中。对于空函数，函数调用是一个独立的、单一的语句。在\
  \ `LeapYear` 程序中，`main` 使用如下所示表达式调用 `IsLeapYear` 函数：\n\n![在表达式中调用的返回值函数](img/9781284166033_CH03_PRE58.jpg)\n\
  \n描述\n\n相比之下，对空函数的调用具有命令或内置指令的味道：\n\n![对空函数的调用](img/9781284166033_CH03_PRE59.jpg)\n\
  \n描述\n\n在接下来的几章中，我们不会编写编写自己的函数（`main` 除外）。相反，我们将集中于如何使用现有的函数，包括用于流输入输出的函数。其中一些函数是返回值函数；另一些是空函数。再次，我们强调了调用这两种函数的区别：对返回值函数的调用发生在表达式中，而对空函数的调用是作为一个独立的语句发生的。\n\
  \n## 3.7 输出格式化\n\n格式化程序的输出意味着控制它在屏幕上的视觉显示。在第 2 章中，我们考虑了两种输出格式化：使用 `endl` 操作符创建额外的输出格式化。在本节中，我们将检查如何格式化输出。\n\
  \n控制输出水平间距的另一种方法是使用操作符（manipulators）。一段时间以来，我们一直使用 `endl` 操作符来结束输出行。在 C++ 中，操作符是一种相当奇怪的东西，它的行为像函数，但以数据对象的伪装出现。像函数一样，操作符会导致某些发生。但像数据对象一样，操作符可以出现在一系列插入操作之中：\n\
  \n![操作符的使用](img/9781284166033_CH03_PRE66.jpg)\n\n### 整数和字符串\n\n默认情况下，连续的整数输出没有间距。如果变量\
  \ `i`、`j` 和 `k` 分别包含值 `15`、`2` 和 `6`，那么此输出将难以解释。为了分隔输出，你可以在数字之间打印单个空格（作为字符常量）：\n\
  \n![数字之间的单个空格](img/9781284166033_CH03_PRE62.jpg)\n\n如果你想在项目之间留更大的间距，可以使用包含空格的字面量字符串：\n\
  \n![数字之间的字面量字符串](img/9781284166033_CH03_PRE64.jpg)\n\n结果输出所示：\n\n![上述语句的输出](img/9781284166033_CH03_PRE65.jpg)\n\
  \n### 输出格式\n\n操作符仅用于输入输出语句。这里是输出语句的修订语法模板，显示不仅允许算术和字符串表达式，还允许操作符：\n\n![输出语句的语法模板](img/9781284166033_CH03_UFIG118-1.jpg)\n\
  \nC++ 标准库提供了许多操作符，但现在我们只看其中的五个：`endl`、`setw`、`fixed`、`showpoint` 和 `setprecision`。`endl`、`fixed`\
  \ 和 `showpoint` 操作符在我们 #include `iostream` 头文件执行 I/O 时是“免费”提供的。另外两个操作符 `setw` 和\
  \ `setprecision` 要求我们还要 #include 头文件 `iomanip`：\n\n![set w 操作符的使用](img/9781284166033_CH03_PRE67.jpg)\n\
  \n\n\n\n操纵符 `setw`——意思是“设置宽度”——让我们能够控制下一个数据项在输出时占据多少个字符位置。（`setw` 通常用于格式化数字和字符串，而不是\
  \ `char` 数据。）`setw` 的参数是一个称为 `fieldwidth`（字段宽）规范的整数表达式；这组字符位置被称为 `field`（字段）。下一个要输出的数据项将右对齐打印（左侧用空格填充以填\
  \ `field`）。\n\n让我们来看一个例子。假设两个 `int` 变量被赋值如下：\n\n![两个被了赋值的 int 变量。](img/9781284166033_CH03_PRE68.jpg)\n\
  \nDescription\n\n那么，以下输出语句产生了右侧所示的输出：\n\n![表格详细列出了某些输出语句及其产生的输出。](img/9781284166033_CH03_UTAB118-1.jpg)![表格详细列出了某些输出语句及其产生的输出。](img/9781284166033_CH03_UTAB119-1.jpg)\n\
  \nDescription\n\n在示例 1 中，每个值都被指定占据足够的位置，以便它们之间至少有一个空格分隔。在示例 2 中，所有值都连在一起，因为为每个值指定的\
  \ `fieldwidth` 仅恰好容纳该值。这种输出显然不易读。最好将 `fieldwidth` 设置得比所需的最小尺寸大，以便在值之间留出空间。示例 3 为了可读性包含了额外的空格；示例\
  \ 4 则没有。在示例 5 中，`fieldwidth` 对于 `ans` 中的值来说不够大，因此它会自动扩展以为所有数字留出空间。\n\n设置 `fieldwidth`\
