  ### C.3 头文件 `cfloat`\n\n该头文件提供了命名的常量，用于定义你特定机器上浮点数的特性。这些常量包括：\n\n| `FLT_DIG` | 你机器上\
  \ `float` 值的近似有效数字个数 |\n| `FLT_MAX` | 你机器上最大的正 `float` 值 |\n| `FLT_MIN` | 你机器上最小的正\
  \ `float` 值 |\n| `DBL_DIG` | 你机器上 `double` 值的近似有效数字个数 |\n| `DBL_MAX` | 你机器上最大的正\
  \ `double` 值 |\n| `DBL_MIN` | 你机器上最小的正 `double` 值 |\n| `LDBL_DIG` | 你机器上 `long double`\
  \ 值的近似有效数字个数 |\n| `LDBL_MAX` | 你机器上最大的正 `long double` 值 |\n| `LDBL_MIN` | 你机器上最小的正\
  \ `long double` 值 |\n\n### C.4 头文件 `climits`\n\n该头文件提供了命名的常量，用于定义你特定机器上整数值的范围。这些常量包括：\n\
  \n| `CHAR_BITS` | 你机器上字节的比特数（例如，8 位） |\n| `CHAR_MAX` | 你机器上 `char` 的最大值 |\n| `CHAR_MIN`\
  \ | 你机器上 `char` 的极值 |\n| `SHRT_MAX` | 你机器上 `short` 的最大值 |\n| `SHRT_MIN` | 你机器上 `short`\
  \ 的最小值 |\n| `INT_MAX` | 你机器上 `int` 的最大值 |\n| `INT_MIN` | 你机器上 `int` 的最小值 |\n| `LONG_MAX`\
  \ | 你机器上 `long` 的最大值 |\n| `LONG_MIN` | 你机器上 `long` 的最小值 |\n| `UCHAR_MAX` | 你机器上\
  \ `unsigned char` 的最大值 |\n| `USHRT_MAX` | 你机器上 `unsigned short` 的最大值 |\n| `UINT_MAX`\
  \ | 你机器上 `unsigned int` 的最大值 |\n| `ULONG_MAX` | 你机器上 `unsigned long` 的最大值 |\n\n\
