  \ = 36.4；0 标记为行号，5 标记为列号](images/9781284166033_CH11_P625-3.jpg)\n\n访问数组组件的语法模板为\n\
  \n```\nArrayName[index Expression][index Expression];\n```\n\n![数组组件访问语法](img/9781284166033_CH11_P626-1.jpg)\n\
