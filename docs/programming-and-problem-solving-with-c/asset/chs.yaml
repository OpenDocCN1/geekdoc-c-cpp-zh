  \ 运算符的是 `max_size`：\n\n![一个语句。](img/9781284166033_CH17_p1075-2.jpg)\n\n描述\n\n传统的\
  \ C++ 数组不支持聚合操作。回想一下，在第 11 章中，我们提到需要使用 For 循环将一个数组复制到另一个数组，并逐元素地对两个数组进行比较。在程度上，这是因为\
  \ C++ 数组不跟踪自己的大小，因此它们不知道要复制或比较多少。但由于 STL `array` 容器知道它们包含多少个元素，我们可以使用它们重载的赋值和关系运算符来复制和比较数组：\n\
  \n![一段代码段。](img/9781284166033_CH17_p1075-3.jpg)\n\n描述\n\n为了与 STL 中的其他容器兼容，`array`\
  \ 还支持迭代器，具有 `begin`、`rbegin` 和 `rend` 构造函数以及移动迭代器的常用运算符。这些只是 `array` 模板最常用的功能，你应该咨询\
  \ STL 参考文档以获取完整指南。\n\n### list 模板\n\n现在我们已经看到了 `vector` 和 `array` 是如何工作的，我们可以快速介绍剩余的容器。它们的许多操作具有相似的功能。例如，`list`\
  \ 也定义了 `back`、`begin`、`clear`、`empty`、`end`、`erase`、`front`、`insert`、`push_back`、`rbegin`、`rend`\
  \ 和 `size`，其含义与 `vector` 基本相同。由于它是链式实现，`list` 没有定义 `capacity`、`max_size` 或 `reserve`。此外，由于它不支持随机访问，`[]`\
  \ 运算符没有重载，也不支持 `at` 操作。\n\n`list` 也有构造形式。我们可以创建一个零元素的 `list`、创建一个具有特定数量且初始化为默认值的\
  \ `list`、创建一个从数组或其他容器初始化的 `list`，或者通过拷贝构造函数创建一个 `list`。下表描述了 `list` 支持的一些额外运算符。\n\
  \n![列出 list 支持的额外运算符的表格。](img/9781284166033_CH17_p1075-4.jpg)\n\n描述\n\n![列出 list\
  \ 支持的额外运算符的表格。](img/9781284166033_CH17_p1076-1.jpg)\n\n描述\n\n为了查看 `list` 是如何工作的，我们展示了以下无意义示例程序，它从用户输入创建一个\
  \ `list`，以不同的方式显示其内容，应用各种修改器操作，并与另一个 `list` 合并。代码如下：\n\n```\n![演示各种 list 方法的程序。](img/9781284166033_CH17_p1075-5.jpg)\n\
  ```\n\n描述\n\n\n\n`priority_queue`（优先级队列）是队列的一种变体，同时也与 `stack`（栈）某些相似之处。主要的区别在于结构中的元素是按顺序存储的。因此，`push`\
  \ 使用插入排序插入元素，使它们直接进入排序中的正确位置。在其中一端，`top` 观察值最大的元素，而 `pop` 则将其移除。优先级队列的一个例子是医院急诊室的情况：病例按紧急程度排列，最紧急的排在等待队列的最前面，然后按照顺序处理病例。随着后续病例的到达，它们会根据紧急程度插入到等待队列中。\n\
  \n下表包含了 `priority_queue` 操作的摘要。\n\n![一个总结优先级队列操作的表格。](img/9781284166033_CH17_p1082-1.jpg)\n\
  \n描述\n\nSTL 组织的一个特点是，`priority_queue` 并没有存储在自己的头文件中。相反，它与 `queue` 共享同一个文件；因此我们包含\
  \ `<queue>` 而不是 `<priority_queue>`。这种类型支持空构造函数，并且更像 `list` 一类容器，它提供了第二个构造函数，允许我们从另一个容器初始化值。与\
  \ `stack` 和 `queue` 不同，它没有直接的拷贝构造函数。\n\n这里是我们示例 `stack` 程序的修订版本，已适配为 `priority_queue`，以便我们体会这种结构行为的差异。请注意，队列按字母倒序输出其内容。\n\
