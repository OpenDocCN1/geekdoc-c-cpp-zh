  \nDescription\n\n## 常量与动态数据\n\n还有另一种避免不可访问对象的方法。正如 C++ 允许我们定义其他简单类型的常量一样，指针也可以被制为常量。在下面的声明中，`patientPtr`\
  \ 是一个常量指针，初始化为代表类型为 `PatientRec` 的结构体实例的动态内存位置的地址：\n\n![A declaration statement.\
  \ Patient R e c asterisk, const, patient P t r, equals, new Patient R e c, semicolon.\
  \ 2 forward slashes. patient P t r is constant.](img/9781284166033_CH14_P825-2.jpg)\n\
  \n一旦执行此代码，`patientPtr` 将始终指向相同的位置。我们可以通过对 `patientPtr` 解引用来更改存储在该位置的值，但不能为 `patientPtr`\
  \ 本身分配新值；也就是说，我们不能让它指向内存中的另一个地方。结果是它所指向的位置永远不会变得不可访问。当我们对常量指针应用 `delete` 时，我们可以确信删除的精确是原始分配的内容，从而防止内存泄漏。\n\
