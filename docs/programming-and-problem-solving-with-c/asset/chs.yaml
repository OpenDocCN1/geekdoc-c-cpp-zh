  \ 方法返回一个可以用于访问或赋值的引用；也就是说，我们还可以写：\n\n![一条语句。 dccupants dot at, left 括号, 3, right\
  \ 括号,](img/9781284166033_CH17_p1070-2.jpg)\n\n\n\n\n\n既然 `vector` 如此轻易地取代了数组，你可能会疑惑为什么还有一个\
  \ `array` 模板。答案是，在 STL 流行之后，程序员希望有一种固定大小的数组类型，它能与其他 STL 容器兼容，并提供它们的一些额外功能。正如你预期的，它的构造函数要求我们同时指定元素类型和大小。与\
  \ `vector` 不同，我们还可以对其使用初始化列表。例如：\n\n![一个语句。](img/9781284166033_CH17_p1074-3.jpg)\n\
