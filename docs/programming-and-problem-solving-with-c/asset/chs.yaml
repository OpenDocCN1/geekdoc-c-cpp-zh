  \ ADT 操作。\n\n## 13.3 List ADT 的实现\n\n### 基本操作\n\n正如我们在第 12 章 中讨论过的，ADT 应该通过规范文件和实现文件在\
  \ C++ 中实现。以下是实现文件 `List.cpp` 的开头：\n\n![部分程序代码。](img/9781284166033_CH13_P766-1.jpg)\n\
  \nDescription\n\n现在让我们来看基本列表操作的实现。\n\n#### 创建空列表\n\n正如我们在图 13.4 中所示，列表项存储在数组元素 `data[0]`\
  \ 到 `data[length-1]` 中。创建一个空列表，只需将 `length` 成员设置为 0 即可。我们不需要向 `data` 数组存储任何特殊值来使列表为空，因为列表算法只处理\
  \ `data[0]` 到 `data[length-1]` 元素。我们还需要将 `currentPos` 设置为 0 以为迭代初始化列表。我们将在查看 `GetNextItem`\
  \ 的实现时再次考虑这一初始化选择。\n\n![创建空列表的程序代码。](img/9781284166033_CH13_P767-1.jpg)\n\nDescription\n\
  \n#### IsEmpty 操作\n\n该操作在列表为空时返回 `true`，否则返回 `false`。根据我们列表为空时 `length` 等于 0 的约定，实现是非常直观的。\n\
  \n![Is Empty 操作的程序代码。](img/9781284166033_CH13_P767-2.jpg)\n\nDescription\n\n####\
  \ IsFull 操作\n\n如果数组中没有空间，列表即为满——即列表长度等于 `MAX_LENGTH`。\n\n![Is Full 操作的程序代码。](img/9781284166033_CH13_P767-3.jpg)\n\
  \nDescription\n\n#### GetLength 操作\n\n该操作简单返回列表的当前长度。\n\n![Get Length 操作的程序代码。](img/9781284166033_CH13_P767-4.jpg)\n\
  \nDescription\n\n### 插入与删除\n\n为了设计一个插入新项的算法，我们首先观察到它是无序的。规范中并没有要求值必须是有序的。为了插入新项，我们首先递增\
  \ `length`。这引出了两个问题：列表是否有空间存储该项？在尝试存储它之前，我们是否需要确保它不在列表中？为了理解这一点，请回看规范中的 `Insert`\
  \ 原型：\n\n![函数标题及注释。](img/9781284166033_CH13_P768-1.jpg)\n\nDescription\n\n为了查看 `while`\
  \ 循环和后续 `if` 语句是如何工作的，让我们来看两种可能性：项在列表中。如果项在列表中，循环在 `index < length` 为 `true` 且 `item\
  \ != data[index]` 为 `false` 时终止。循环结束后，`if` 找到 `index < length` 为 `true` 并移除项。相反，如果项不在列表中，循环在\
  \ `index < length` 为 `false` 时终止——即当 `index` 等于 `length` 时。随后 `if` 条件为 `false`，函数不做任何更改返回。\n\
  \n从列表中删除组件包括两个步骤：找到组件并移除它。在我们之前讨论删除操作时，我们选择将最后一个项放在被删除的位置，然后递减 `length`。\n\n![函数标题及注释。](img/9781284166033_CH13_P768-2.jpg)\n\
  \nDescription\n\n我们从列表开始并向前搜索。我们也可以很容易地从最后一个项反向搜索。为了修改算法从末尾开始，我们将 `index` 初始化为 `length-1`\
  \ 并在每次循环中递减 `index`，直到找到我们项或 `index` 变为 -1。\n\n在 `Delete` 函数中，我们用于搜索删除项的算法被称为无序列表中的顺序搜索或线性搜索。我们使用相同的算法来实现\
  \ `List` 类的 `IsThere` 函数。\n\n![部分程序代码。](img/9781284166033_CH13_P769-1.jpg)\n\nDescription\n\
  \n这种算法被称为顺序搜索，因为它按顺序查看每个项。我们在找到项（或到达列表末尾未找到）时停止搜索。\n\n任何需要列表搜索的程序都可以这种算法。在所示的形式中，它搜索\
  \ `ItemType` 组件列表，前提是 `ItemType` 是整数类型或 `string` 类；即 `ItemType` 的值可以使用关系运算符进行比较。然而，在浮点值之间使用关系运算符可能会产生意料的结果。也许应该在规范文件中添加一条注释给出此警告。\n\
  \n\n\n\n![部分程序代码。](img/9781284166033_CH13_P769-2.jpg)\n\n描述\n\n在离开线性搜索算法之前，让我们来介绍一种让程序更高效的变体，尽管它稍微复杂一些。While\
  \ 循环包含一个复合条件：它在找到 `item` 或者或到达列表末尾时停止。我们可以将 `item` 的副本插入到 `data[length]` 中——即插入列表末尾之外的数组组件——作为“哨兵”。通过这种方式，我们就能保证能够在列表中找到\
  \ `item`。然后，我们就可以消除检查列表末尾的条件（`index < length`）。\n\n![部分程序代码。](img/9781284166033_CH13_P770-1.jpg)\n\
  \n描述\n\n这个算法更好吗？消除一个条件为计算机节省了测试它的时间。在这种情况下，循环的每次迭代都会节省时间，因此节省的效果会累积。然而，注意，我们是以空间为代价获得了效率的。我们必须将数组的大小声明为用户的限制大一，以便在列表满时存储哨兵值。也就是说，我们必须将数组的声明更改为\n\
  \n![数组声明语句。元素类型，data，左方括号，MAX，下划线，LENGTH，加号，1，右方括号，分号。](img/9781284166033_CH13_P770-2.jpg)\n\
  \n注释描述了该循环的处理过程。请记住，原型（规范）文档是面向用户的，不包含任何实现细节。如果代码使用了不寻常的算法，这一事实应该在函数的定义文档中注明，该文档是面向代码的维护者的。\n\
  \n### 迭代器 (Iterators)\n\n迭代器与复合类型配合，允许用户按组件处理整个结构。为了让用户按顺序访问每个项目，我们提供了三个操作：一个用于初始化迭代（类似于打开文件的\
  \ `Open` 过程），一个用于判断是否有更多项目，以及一个在每次调用时返回“下一个组件”副本的操作。用户随后可以建立一个循环来处理每个组件。我们将这些操作称为\
  \ `ResetList`、`HasNext` 和 `GetNextItem`。注意，`ResetList` 和 `HasNext` 本身并不是迭代器，而是支持迭代的辅助函数。另一种类型的迭代器接收一个操作并将其应用于列表每一个元素。\n\
  \n`ResetList` 函数仅将 `currentPos` 设置为 0。由于构造函数为第一次迭代准备了列表，`ResetList` 只在后续迭代中被调用。然而，如果在第一次迭代时调用它，也没有损坏：`currentPos`\
  \ 只被设置了两次。\n\n`GetNextItem` 操作访问下一个项目（`currentPos` 处的项目），增加 `currentPos` 并返回它访问的项目。如果最后一个项目已经被访问会发生什么？`HasNext`\
  \ 将返回 false。`HasNext` 如何识别最后一个项目是否已被访问？通过测试 `currentPos` 是否等于 `length`。\n\n![代码片段。](img/9781284166033_CH13_P771-1.jpg)\n\
  \n描述\n\n`Reset` 和 `GetNextItem` 设计用于客户端程序中的循环中，该循环遍历列表中的所有项目。`GetNextItem` 规范中的前置条件防止了尝试访问不在列表中的数组元素。回想\
  \ `Temperature` 程序。`HasNext` 和 `GetNextItem` 使用了一次输出原始列表；`ResetList`、`HasNext` 和\
  \ `GetNextItem` 使用了一次输出修正后的列表。\n\n## 13.4 排序列表 (Sorted Lists)\n\n在 `List` 类中，搜索算法假设列表是无序的。搜索无序列表的缺点是，我们必须扫描整个列表才能发现搜索项不存在。想一下，如果你的手机联系人列表中的姓名是随机顺序排列的，而不是字母顺序，会是什么样。为了查找\
  \ Mary Anthony 的电话号码，你必须顺序扫描，一页一页地找，直到找到。在最坏的情况下，你可能必须检查数百个名字，结果发现 Mary 的名字不在你的联系人中。\n\
  \n当然，联系人列表是按字母排序的，字母顺序使得搜索变得更容易。如果 Mary Anthony 的名字不在列表中，你通过从 A 开始，并在一旦越过她名字本应出现的位置就停止搜索，就能很快地发现这一事实。\n\
  \n让我们定义一个排序列表 ADT，其中无论应用何种操作，组件始终按值保持顺序。以下是 `SortedList.h` 文件，它包含了 `SortedList`\
  \ 类的声明。\n\n![程序段。](img/9781284166033_CH13_P775-1.jpg)\n\n描述\n\n![段的延续。](img/9781284166033_CH13_P776-1.jpg)\n\
  \n描述\n\n`SortedList` 的声明与 `List` 类有何不同？除了注释的几处更改外，只有两个区别：\n\n1. `SortedList` 类不需要排序操作，因为列表始终保持有序。\n\
  2. `SortedList` 类有一个额外的成员：`BinarySearch` 函数。这是一个辅助（帮助）函数，供类函数调用，对客户端不可见。我们在检查类实现时讨论它的用途。\n\
  \n考虑到我们现在处理的是排序列表而不是无序列表，ADT 的算法需要哪些更改。\n\n### 基础操作 (Basic Operations)\n\n构造函数、`IsEmpty`、`IsFull`、`GetLength`、`ResetList`、`HasNext`\
  \ 和 `GetNextItem` 的算法与 `List` 类相同。构造函数将 `length` 设置为 0，`IsEmpty`  `length` 是否等于\
  \ 0，`IsFull`  `length` 是否等于 `MAX_LENGTH`，`GetLength` 返回 `length` 的值，三个迭代相关的函数准备后续迭代。\n\
  \n### 插入 (Insertion)\n\n要在已排序列表中添加新值，我们可以将新值存储在 `data[length]`，增加 `length` 并排序数组。如果要手动在排序列表中插入一个值，我们会把新值写在侧，并画线显示它所在的位置。为了找到这个位置，我们会扫描列表直到找到一个比我们要插入的值大的。新值放在该点之前。\n\
  \n我们可以在 `Insert` 函数中使用类似的过程。我们使用手动算法在列表中找到的位置。我们不是将值写在侧，而是将所有比新值大的向下移动一位，为它留出空间。主算法表示如下，其中\
  \ `item` 是要插入的值：\n\n```\n![插入算法。](img/9781284166033_CH13_P777-1.jpg)\n描述\n```\n\n\
  假设 `index` 是 `item` 要插入的地方，向下移动列表的算法为\n\n```\n向下移动列表的算法。](images/9781284166033_CH13_P777-2.jpg)\n\
  描述\n```\n\n![一个图表显示一个包含 5 个随机值的数组按升序一个一个插入 5 个值。](img/9781284166033_CH13_FIGF13_7.jpg)\n\
  \n描述\n\n图 13.7 向排序列表中插入项目\n\n\n\n\n\n该算法在`图 13.7`中所示。它是基于我们如何通过手工完成这项任务。通常，这种调整方法是解决问题的最佳方式；但在这种情况下，进一步的思考揭示了一种稍微更好的方法。注意，我们是从列表开头开始搜索（人们总是这样做），并从列表末尾开始向上移动。我们可以通过从列表末尾开始来将搜索和移动合并。\n\
  \n如果 `item` 是要插入的新条目，我们可以将 `item` 与 `data[length-1]` 中的值进行比较。如果 `item` 小于该值，我们将\
  \ `data[length-1]` 放入 `data[length]` 中，并将 `item` 与 `data[length-2]` 中的值进行比较。这个过程一直持续下去，直到我们找到\
  \ `item` 大于或等于列表中元素的位置。然后我们将 `item` 直接存储在它下方。以下是该算法：\n\n```\n![用于排序的算法。](img/9781284166033_CH13_P778-1.jpg)\n\
  ```\n\n描述\n\n```\n![代码片段。](img/9781284166033_CH13_P779-1.jpg)\n```\n\n描述\n\n注意，即使列表为空，该算法仍然有效。当列表为空时，`length`\
  \ 为 0，且不会进入 `While` 循环体体。因此，`item` 被存储在 `data[0]` 中，`length` 增加到 1。如果 `item` 是最小的，算法还能工作吗？如果是最大的呢？让我们来看看：如果\
  \ `item` 是最小的，循环体将执行 `length` 次，`index` 为 –1。因此 `item` 被存储在位置 0，这正是它所属的位置。如果 `item`\
  \ 是最大的，则不进入循环体。`index` 的值仍然是 `length-1`，因此 `item` 被存储在 `data[length]` 中，这也是它所属的位置。\n\
  \n你对一般情况也处理了特殊情况感到惊讶吗？这种情况并非总是发生，但它发生的频率足够高，因此从一般情况开始是一个良好的编程习惯。如果我们从特殊情况开始，我们可能意识不到不需要单独处理它们。所以，先从一般情况开始，然后只将一般情况无法正确处理的情况视为特殊情况。\n\
  \n该算法是另一种通用排序算法的基础——插入排序，在插入排序中，值被一个接一个插入到最初为空的列表中。当输入数据必须排序时，通常会使用插入排序；每个值在被读取时都会放在其正确的位置。我们在本章末尾的问题解决案例研究中使用了这种技术。\n\
  \n### 顺序搜索\n\n当我们在无序列表中搜索某个项时，在到达列表末尾之前，我们无法发现该项缺失。如果列表已经排序，当我们通过该项本应在列表的位置时，就知道该项缺失了。例如，假设列表包含这些值：\n\
  \n7\n11\n13\n76\n98\n102\n\n如果我们正在寻找 12，只需要将 12 与 7、11 和 13 进行比较，即可知道 12 不在列表中。\n\
  \n如果搜索项大于当前列表组件，我们就移动到下一个组件。如果该项等于当前组件，我们就找到了正在找的内容。如果该项小于当前组件，那么我们就知道它不在列表中。在后两种情况下，我们都停止查找。我们可以用以下代码以算法化的重新表述这个过程，在代码中，如果找到了搜索项，则将\
  \ `found` 设置为 true：\n\n```\n![代码片段。](img/9781284166033_CH13_P780-1.jpg)\n```\n\n\
  描述\n\n平均而言，以这种方式搜索排序列表找到一个项所需的迭代次数与搜索无序列表相同。这种新算法的优势在于，如果某个项缺失，我们可以更早地发现。因此它的效率略高一些。然而，在排序列表中进行搜索还有更更好的方法。\n\
  \n### 二分查找\n\n在排序列表上进行的第二种搜索算法无论是查找项还是发现项缺失，都比顺序搜索快得多。这种算法被称为二分查找。二分查找将列表一分为二（除以\
  \ 2——这就是为什么它被称为二分查找），并决定下一步在哪个一半查找。对所选列表部分进行重复划分，直到找到该项或确定该项不在列表中。\n\n这种方法类似于我们在字典中查单词。我们从字典的中间打开，并将要找的单词与在那里找到的单词进行比较。如果我们要找的单词在这个词之前，我们就在字典的左侧部分继续搜索。否则，我们在字典的右侧部分继续搜索。\n\
  \n二分查找的算法如下。在该算法中，列表是 `data`，正在查找的值是 `item`（参见`图 13.8`）。\n\n1.  `item` 与 `data[middle]`。如果\
  \ `item = data[middle]`，则我们找到了。如果 `item < data[middle]`，则我们在前半部分查找。如果 `item > data[middle]`，则我们在后半部分查找。\n\
  2. 将 `data` 重新定义为搜索的那一半，并重复步骤 1。\n3. 当我们找到 `item` 或知道它缺失时停止。\n\n我们需要跟踪第一个查找的位置（`first`）和最后一个查找的位置（`last`）。在任何时刻，我们只在\
  \ `data[first]` 到 `data[last]` 之间查找。当函数开始时，`first` 设置为 0，`last` 设置为 `length-1`，包含整个列表。\n\
  \n```\n![显示了一个标记为 data 的数组，左括号, first, 右括号, 左括号, middle, 右括号, 左括号, last, 右括号，数组组件。标记为\
  \ item 的组件画在 data 数组下方。3 个双向箭头指向 data 数组。两边的双向箭头带有问号。](img/9781284166033_CH13_FIG13_8.jpg)\n\
  ```\n图 13.8 二分查找\n\n之前的三个搜索算法都是布尔操作。它们只回答一个简单的问题：这个项在列表中吗？让我们把二分查找编码为一个 void 函数，它不仅询问该项是否在列表中，还询问它是哪一个（如果该项在那里）。为了这样做，我们需要在参数列表中添加两个参数：一个布尔标记\
  \ `found`（告诉我们该项是否在列表中）和一个整数变量 `position`（告诉我们它是哪一个项）。如果 `found` 为 false，`position`\
