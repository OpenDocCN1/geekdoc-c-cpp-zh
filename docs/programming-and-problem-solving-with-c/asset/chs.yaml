  \ 分号。](img/9781284166033_CH10_574b.jpg)\n\n将 `struct` 变量 `student` 的整个内容逐个成员拷贝到变量\
  \ `anotherStudent`。\n\n相比之下，不支持聚合算术操作和比较（主要是因为这些操作没有意义）：\n\n![两行不支持的算术操作和比较的代码。](img/9781284166033_CH10_574c.jpg)\n\
  \n描述\n\n此外，不支持聚合 I/O：\n\n![一行不支持的代码。左尖括号内的 c student, 分号，两个正斜杠，不允许。](img/9781284166033_CH10_574d.jpg)\n\
  \n我们必须一个一个一个地输入或输出 `struct` 变量：\n\n![一段代码片段。](img/9781284166033_CH10_574e.jpg)\n\
  \n描述\n\n注意，整个 `struct` 可以作为参数传递，如函数示例所示。我们对参数 `aStudent` 使用了按值传递，因为我们不需要更改参数中的任何字段。如果我们需要这样做，就会将其作为引用参数传递。`struct`\
  \ 也可以由返回值的函数返回。\n\n让我们定义另一个接收 `StudentRec` 变量作为参数的函数。该函数将判断学生某门课程的成绩是否与其总 GPA 一致。我们定义\
