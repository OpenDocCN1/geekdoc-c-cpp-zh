  \n描述\n\n## 4.2 交互式输入/输出\n\n交互式程序是指用户直接与计算机通信的程序。你熟悉的多数程序可能都是交互式的。\n\n为了让数据进入交互式程序，我们从输入提示（input\
  \ prompts）开始——即解释用户应该输入内容的消息。没有这些消息，用户将不知道应该输入什么值。程序还可以显示已输入的值，以便用户验证其正确性。显示输入值被称为回显打印（echo\
  \ printing）。\n\n这是一个展示正确使用提示的程序：\n\n![演示正确使用提示的程序。](img/9781284166033_CH04_UFIG158-1.jpg)\n\
  \n描述\n\n这是输出结果，用户输入已被亮显示：\n\n![演示正确使用提示的程序的输出。](img/9781284166033_CH04_UFIG159-1.jpg)\n\
  \n描述\n\n回到上一节的程序看。它是同一个程序，只是没有提示。如果你是输入信息的人，你会更倾向于使用哪一个程序？\n\n提示中包含的信息量取决于谁将使用该程序。对于初学者使用的程序，提示应该更详细。例如，提示可能会是：“输入一个四位部件号，然后按回车键。”如果同一批人会频繁使用该程序，你可以缩短提示：“输入\
  \ PN”和“输入 Qty”。\n\n程序是否应该进行回显打印也取决于用户对输入性质的熟悉程度。如果用户经验丰富且提示清晰，则可能不需要回显打印。\n\n##\
  \ 4.3 非交互式输入/输出\n\n![一个不直观的消息。](img/9781284166033_CH04_UFIG156-2.jpg)\n\n描述\n\n\
  ![一个不直观的消息。](img/9781284166033_CH04_UFIG156-3.jpg)\n\n描述\n\n![一个更好的消息。](img/9781284166033_CH04_UFIG157-2.jpg)\n\
  \n描述\n\n## 4.4 文件输入与输出\n\n在目前为止我们所的一切中，我们假设程序的输入来自键盘，输出到屏幕。现在我们查看文件的输入/输出。\n\n###\
  \ 文件\n\n文件是次级存储中一个命名的区域，存储一组信息（例如，我们在编辑器中输入的程序代码）。文件中的信息通常存储在辅助存储设备上，如固态硬盘。程序从文件中读取数据的方式与从键盘读取数据相同，向文件写入输出的方式与向屏幕写入输出相同。\n\
  \n\n\n\n假设我们想让第 3 章中的抵押程序从文件中读取数据并将其输出写入文件。我们必须做的第一件事是添加以下预处理器指令：\n\n![用于从文件读取数据并写入文件的预处理器指令。](img/9781284166033_CH04_PRE22.jpg)\n\
  \n描述\n\n通过头文件 `fstream`，C++ 标准库定义了两个数据类型：`ifstream` 和 `ofstream`（分别代表输入文件流和输出文件流）。与\
  \ C++ 中流的通用理念一致，`ifstream` 数据类型表示来自自输入文件的字符流，而 `ofstream` 则表示流向输出文件的字符流。\n\n你已经学过的所有\
  \ `istream` 操作——提取运算符（`>>`）、`get()` 函数和 `ignore()` 函数——对于 `ifstream` 类型也是有效的。同样地，所有的\
  \ `ostream` 操作，如插入运算符（`<<`）以及 `endl`、`setw` 和 `setprecision` 操符，也适用于 `ofstream`\
  \ 类型。在这些基本操作的基础上，`ifstream` 和 `ofstream` 类型增加了专门的文件 I/O 操作。\n\n### 声明文件流\n\n声明流对象变量的方法与声明任何变量相同——指定类型和名称：\n\
  \n![一个输入和输出文件流对象。](img/9781284166033_CH04_PRE23.jpg)\n\n描述\n\n我们不需要声明 `cin` 和 `cout`\
  \ 流，因为头文件 `iostream` 自动完成了这一点。）\n\n对于我们与抵押贷款相关的程序，让我们把输入输出文件流对象命名为 `inData` 和 `outData`。我们这样声明它们：\n\
  \n![一个输入和输出文件流对象。](img/9781284166033_CH04_PRE24.jpg)\n\n描述\n\n注意，`ifstream` 类型仅用于输入文件，而\
  \ `ofstream` 类型仅用于输出文件。使用这些数据类型时，你无法对同一个文件进行读写。\n\n### 打开文件\n\n我们要做的第三件事是通过打开文件来为每个文件的读写做好准备。打开文件会导致操作系统使文件进入就绪状态。\n\
  \n在我们的示例中，我们想从 `inData` 读取并写入到 `outData`。我们可以这样打开文件：\n\n![打开文件的代码。](img/9781284166033_CH04_PRE25.jpg)\n\
  \n描述\n\n这两个语句都是函数调用。在每次函数调用中，参数都是字符串。第一条语句调用了名为 `open` 的函数，它与 `inData` 相关。第二条语句调用了另一个函数（也名为\
  \ `open`），它与 `outData` 相关。正如我们之前看到的，我们使用点符号法来调用与对象相关的函数。\n\n`open` 函数具体做什么？首先，它将程序中的流变量与计算机上的一个文件关联。我们的第一次函数调用在流对象\
  \ `inData` 和名为 `loan.in` 的实际文件之间建立了连接。流的必须是标识符；它们是程序中的变量。但操作系统对文件名使用不同的语法。例如，许多系统允许甚至要求在文件名中包含点。）同样地，第二次函数调用将流对象\
  \ `outData` 与文件 `loan.out` 关联。\n\n`open` 函数的下一项工作取决于该文件是用于输入还是输出。对于输入文件，`open` 将文件的读取标记设置为文件中的第一部分数据。（每个输入文件都有自己的自己的读取标记。）\n\
  \n对于输出文件，`open` 会检查文件是否已存在。如果文件不存在，`open` 会创建一个新的空文件。如果文件已存在，`open` 会擦除文件的旧内容。然后，写入标记被设置在空文件的开头（参见图\
  \ 4.2）。\n\n![打开文件的效果。](img/9781284166033_CH04_FIGF02.jpg)\n\n图 4.2 打开文件的效果\n\n描述\n\
  \n因为我们打开文件是为了为读写做准备，所以我们必须在使用任何针对文件的输入或输出语句之前打开它们。在程序开始时就打开文件是一个好主意，以确保在尝试执行文件 I/O\
  \ 之前文件已经就绪。\n\n![打开文件的代码。](img/9781284166033_CH04_PRE26.jpg)\n\n描述\n\n除了 `open`\
  \ 函数外，`ifstream` 和 `ofstream` 类型都有一个 `close` 函数。该函数没有参数，可以如下使用：\n\n![关闭文件的代码。](img/9781284166033_CH04_PRE27.jpg)\n\
  \n描述\n\n关闭文件会导致操作系统断开流变量与文件之间的连接。在某些编程语言中，关闭文件是重要的。但在 C++ 中，当控制离开第 8 章)块时，文件会自动关闭。）\n\
  \n### 在输入输出语句中指定文件流\n\n正如我们之前所说，所有的 `istream` 操作对 `ifstream` 类型有效，所有的 `ostream`\
  \ 操作对 `ofstream` 类型有效。因此，文件 I/O 的区别在于，对于每次操作，我们用相应的文件变量代替 `cin` 或 `cout`。在我们的抵押程序中，我们将使用\
  \ `inData` 来读取：\n\n![程序代码](img/9781284166033_CH04_PRE28.jpg)\n\n描述\n\n同样，输出语句将指定\
  \ `outData` 而不是 `cout` 作为目标：\n\n![程序代码](img/9781284166033_CH04_PRE29.jpg)\n![程序代码](img/9781284166033_CH04_PRE30.jpg)\n\
  \n描述\n\nC++ 流 I/O 的优之处在于，无论我们是与键盘屏幕、文件或其他 I/O 设备工作，都有统一的 I/O 操作语法。\n\n### 文件名的运行时输入\n\
  \n为止，我们打开输入文件的示例都包含类似代码：\n\n![打开输入文件的代码](img/9781284166033_CH04_PRE37.jpg)\n\n描述\n\
  \n`open` 函数需要一个指定文件名的参数。当它是字面量字符串时，文件名在编译时就固定了，因此程序只适用于这个特定的文件。\n\n我们通常希望程序能够在运行时选择文件名。例如，我们可以提示用户文件名，将响应读入变量中，并将该变量传递给\
  \ `open` 函数。原则上讲，以下代码应该工作，但编译器不允许这样做：\n\n![从用户处接受打开打开的文件名会导致编译错误的代码](img/9781284166033_CH04_PRE38.jpg)\n\
  \n描述\n\n\n\n\n问题在于 `open` 不接受 `string` 类型的参数。相反，它期望的是一个 C 字符串，之所以这样命名是因为它源于 C 语言（C++\
  \ 的前身）。C 字符串是字符串的一种特殊形式。字面量字符串恰好是一个 C 字符串，因此可以作为 `open` 的参数。\n\n为了让这段代码正常工作，我们需要将字符串变量的值转换为\
  \ C 字符串。`string` 类型提供了一个名为 `c_str` 的返回值的函数，可以通过点表示法应用于字符串对象：\n\n![将字符串变量的值转换为 C\
  \ 字符串的代码。](img/9781284166033_CH04_PRE39.jpg)\n\n描述\n\n该函数返回一个与 `fileName` 变量内容等价的\
  \ C 字符串。（函数调用不会改变 `fileName` 中包含的原始字符串。）`c_str` 函数的主要目的是允许程序员调用期望 C 字符串而不是字符串对象作为参数的库函数。\n\
  \n以下程序读取文件名并将文件的第一行存储在文件中。程序后面显示文件和输出。\n\n![读取文件名并输出文件第一行的程序。](img/9781284166033_CH04_UFIG168-1.jpg)\n\
  \n描述\n\n文件 `testData.in`：\n\n![文件 testData. in 的内容。](img/9781284166033_CH04_UFIG168-2.jpg)\n\
  \n描述\n\n输出：\n\n![演示输入文件名的程序输出。](img/9781284166033_CH04_UFIG168-3.jpg)\n\n描述\n\n\
  1 C++ 提供了另一种方法来声明文件变量并与其文件名关联，这些都在一条语句完成。你可以写成：\n\n```\nifstream inData(\"loan.in\"\
  ); ofstream outData(\"loan.out\");\n```\n\n![images/9781284166033_CH04_PRE82.jpg)这些语句是\
  \ C++ 所称为参数化构造函数的示例。这个术语与 C++ 的面向对象方面有关。## 4.5 输入失败当程序输入数据时，可能会出现问题。假设程序提示我们输入一个整数，但我们输入了一些字母。由于数据无效，输入操作失败。在\
  \ C++ 术语中，`cin` 流已进入失败状态（fail state）。一旦流进入失败状态，使用该流的任何后续 I/O 操作都会变成空操作——也就是说，它们不会产生影响。对我们不利的是，计算机并没有停止程序或显示任何错误信息。它只是继续执行程序，静静地忽略每次使用该流的额外尝试。无效数据是输入失败最常见的原因。当你的程序接受\
  \ `int` 值作为输入时，它期望在输入流中只找到数字，数字前面可能有加号或减号。如果数字中间某个地方有一个小数点，输入操作会失败吗？不一定。让我们来看一个例子。假设程序有\
  \ `int` 变量 `i`、`j` 和 `k`，它们的内容当前分别为 10、20 和 30。程序执行以下两条语句：![读者必须找到程序中的错误。](img/9781284166033_CH04_PRE41.jpg)\n\
  \n描述\n\n如果我们为输入数据输入这些字符：\n\n![被打印的某些变量。](img/9781284166033_CH04_PRE42.jpg)\n\n描述\n\
  \n那么程序将产生此输出：\n\n![作为输入的三个值。](img/9781284166033_CH04_PRE43.jpg)\n\n描述\n\n让我们看看为什么。\n\
  \n记住，在读取 `int` 或 `float` 数据时，提取运算符 `>>` 在遇到第一个不适当字符时停止读取。在我们的示例中，`i` 的输入操作成功了。计算机从输入流中提取了前四个字符，并将整数值\
  \ 1234 存储到 `i` 中。读取标记现在小数点上：\n\n![输入的值和读取标记的位置。](img/9781284166033_CH04_PRE44.jpg)\n\
  \n描述\n\n一旦流进入失败状态，使用该流的任何后续 I/O 操作都会变成空操作——也就是说，它们不会产生影响。对我们不利的是，计算机并没有停止程序或显示任何错误信息。它只是继续执行程序，静静地忽略每次使用该流的额外尝试。\n\
  \n另一种让流进入失败的方法是尝试打开一个不存在的文件。假设你有一个文件 `myfile.dat`。程序包含了以下语句：\n\n![程序的代码。](img/9781284166033_CH04_PRE45.jpg)\n\
  \n描述\n\n在调用 `open` 时，文件名拼写错误。在运行时，打开文件的尝试失败，因此 `j` 和 `k` 的输入操作变成了空操作。\n\n这种讨论的重点不是让你对\
  \ I/O 紧张，而是让你意识到它的局限性。本章末尾的“测试与调试”部分提供了避免输入失败的建议。\n\n## 4.6 设计方法\n\n在过去的两个章以及本章的第一部分，我们介绍了用于输入数据、执行计算和输出结果的\
  \ C++ 语言元素。我们目前为止编写的程序都很短，因为要解决的问题很简单。我们现在准备好编写复杂问题的程序了——但首先我们需要回头审视整个过程。\n\n编程过程包括问题解决阶段和实现阶段。问题解决阶段包括分析（理解问题）和设计（解决问题）。对于一个复杂的问题——例如产生\
  \ 10,000 行行的程序——跳过设计阶段直接编写 C++ 代码是不有效的。\n\n在本章的剩余部分中，我们将描述用于解决复杂问题的两种方法：功能分解和面向对象设计。\n\
  \n一种广泛使用的软件设计方法被称为面向对象设计 (OOD)。C++ 从 C 语言演变主要是为了方便使用 OOD 方法。在本章中我们介绍了 OOD 的核心概念；我们将在以后对该方法进行扩展。OOD\
  \ 通常与我们在本章讨论的另一种方法功能分解结合使用。\n\n\n\n选择何种方法取决于你所处理的问题。例如，一个大问题可能涉及几个顺序处理阶段，如收集数据并验证其正确性、分析数据，以及在分析结束时生成报告。这个过程具有天然的功能分解特性。然而，每个阶段可能最适合通过一组对象来解决，这些对象代表了数据以及可以应用于数据上的操作。某些对象或操作可能足够复杂，以至于需要进一步分解为额外的对象或操作。\n\
  \n如果自然地将问题视为一组组件的集合来思考它，那么你就可以使用面向对象的设计（OOD）来解决它。例如，一个银行问题可能需要一个 `checkingAccount`\
  \ 对象，以及关联的操作 `OpenAccount`、`WriteCheck`、`MakeDeposit` 和 `IsOverdrawn`。`checkingAccount`\
  \ 对象将由数据（例如账户号码和当前余额）以及这些操作组成，并被绑定成一个单元。\n\n相比之下，如果你发现将问题的解决方案视为一系列步骤更符合直觉，那么你应该使用功能分解。例如，在对大型数据集上计算某些统计指标时，自然的方法是将问题分解为读取一个值、执行计算、然后重复该过程的步骤。C++\
  \ 语言和标准库提供了我们需要的操作，我们只需编写这些操作的序列来解决问题。\n\n总结来说，功能分解关注于将输入转换为输出的过程，产生一组任务。面向对象的设计关注于要转换的数据对象，产生一组对象。在现实中，这些设计方法通常会结合使用，用功能分解来描述与面向对象设计中的对象相关的操作。\n\
  \n## 4.7 功能分解\n\n在功能分解（也称为结构化设计、自顶向下设计、步进式细化和模块化编程）中，我们从解决方案主要步骤的抽象列表开始，转变为可以直接翻译为\
  \ C++ 的具体算法指令。你也可以将这种方法想为从高层算法开始（留出实现细节不指定），直到落实完全详细的算法。\n\n解决问题最简单的方法是把它交给别人并说：“解决这个。”问题解决方案最抽象的层次涵盖了整个问题，而不规定具体的实现细节。正是在这一点上，我们这些程序员上登场了。我们的工作是将抽象解决方案转换为具体的解决方案，即一个程序。\n\
  \n如果解决方案显然涉及一系列主要步骤，我们就将其拆分（分解）为这些部分。在这个过程中，我们移动到了较低的抽象层次——也就是说，现在指定了一些实现细节。每个主要步骤都变成一个需要单独解决的子问题。在一个大型项目中，首席架构师（或团队负责人）将子问题交给团队成员，说：“解决这个问题。”对于小型项目，我们将子问题交给自己，一次选择一个来解决。我们可能会将一个子问题分解为另一系列步骤，这些步骤反过来又会变成更小的子问题。或者，我们可能会识别出自然表示为对象的组件。这个过程一直持续，直到每个子问题无法进一步划分或有了显而易见的解决方案。\n\
  \n我们为什么要这样工作？为什么不直接开始写细节呢？因为一次关注一个问题更容易集中。例如，假设你正在编写一个程序，发现你需要一个复杂的公式来为输出语句计算合适的\
  \ `fieldwidth`。计算 `fieldwidth` 不是你现在的关注重点。如果你将注意力转移到那里，可能会忘记你正在处理的某些细节。所以你做个标记——“计算\
  \ `fieldwidth`”——然后继续。在解决完当前的子问题后，你就可以返回到计算上。\n\n通过细分问题，你创建了一个被称为“树形结构”的分层结构。树的每一层都是问题的完整解决方案，并且比上面的一层更具体。FIGURE\
  \ 4.3 显示了一个问题的通用解决方案树。绿色阴影部分的步骤有足够的细节可以直接翻译成 C++；这些是具体步骤。紫色阴影部分是抽象步骤；它们在下一层中作为子问题重新出现。图中的每个框都代表一个模块。模块是功能分解中的基本构建块。图\
  \ 4.3 中的图也被称为模块结构图。\n\n![分层解决方案树。](img/9781284166033_CH04_FIGF03.jpg)\n\nFIGURE\
  \ 4.3 分层解决方案树\n\n描述\n\n功能分解使用分治法来解决问题；换句话说，它将大问题分解成更容易处理的小型单元。OOD 也是这样做，但在 OOD 中单元是对象，而功能分解中的单元是模块。\n\
  \n### 模块\n\n模块源于更高一层次的抽象步骤。当它指定了与高层抽象步骤相同的系列步骤时，它在解决方案树中就是功能等价。（不要混淆我们这里 function\
  \ 的用法与 C++ 函数。在这里我们使用该术语是指代模块或步骤。）\n\n在编写良好的模块中，它的具体步骤直接解决给定的子问题；新的子问题作为抽象步骤编写。这被称为功能内聚。\n\
  \n功能内聚的核心思想是每个模块应该只做一件事，并做好它。功能内聚并不是一个精确定义的属性；没有定量的衡量标准。相反，它基于我们判断何时清晰易懂的能力。将哪些细节具体化将哪些留抽象取决于经验。例如，如果其他部分非常简单，你可能会将\
  \ `fieldwidth` 计算包含在输出模块中。相反，如果计算被执行多次，那么将其编写为单独模块并在需要时引用它是合理的。\n\n#### 编写内聚模块\n\
  \n以下是编写内聚模块的一种方法：\n\n1. 思考你会如何手动解决子问题。\n2. 写下主要步骤。\n3. 如果你能看到如何直接用 C++ 实现一个步骤，它就处于具体层次；不需要进一步细化。\n\
  4. 如果你认为实现一个步骤需要多个 C++ 语句，它仍然处于抽象层次。\n5. 如果你试图编写一系列步骤并开始被细节淹没，你可能跳过了一个或多个抽象层次。退后一步看，寻找可以写成抽象步骤的片段。\n\
  \n\n\n当你沿着解决方案树向下工作时，你会做出一系列设计决策。如果某个决策被证明是笨拙或错误的（很多情况下确实如此！），你可以回到树上方的更高层级模块，并尝试其他方法。你不需要放弃整个设计——只需要放弃你正在处理的小部分即可。在达到最终设计之前，你可能会探索许多中间步骤和尝试性解决方案。\n\
  \n### 伪代码\n\n如果你用伪代码写下步骤，你会发现实现设计会变得更容易。伪代码是英语语句和类似于 `C++` 的控制结构的混合体，可以很容易地翻译成 `C++`。（在“解决问题案例研究”的算法中，我们一直在使用伪代码。）当用伪代码编写具体步骤时，应该能够直接将其重写为程序中的一条\
  \ `C++` 语句。\n\n### 实现设计\n\n功能分解的产物是针对具有多个抽象级问题的层次层次解决方案。图 4.4 显示了修订后的贷款程序（Mortgage\
  \ program）的功能分解。这种解决方案构成了编程实现阶段的基础。\n\n![贷款程序的解决方案树。](img/9781284166033_CH04_FIGF04.jpg)\n\
  \n图 4.4 贷款程序的解决方案树\n\n描述\n\n我们如何将功能分解翻译成 `C++` 程序？如果你仔细观察图 4.4，你可以看到具体步骤（用绿色阴影标记）可以组合成一个解决问题的完整算法。它们组合的顺序由它们在树中的位置决定。我们从树的顶部即第\
  \ `0` 层开始，执行第一步“打开文件”。因为它是抽象的，我们必须进入下一层，即第 `1` 层。在那里，我们找到一系列与该步骤对应的具体步骤；这一系列步骤成为我们算法的第一部分。因为现在转换过程变得具体的了，我们可以回到第\
  \ `0` 层，并进行下一步“输入值”。因为它是抽象的，我们进入第 `1` 层，并找到一系列与该步骤对应的具体步骤；这一系列步骤成为我们算法的下一个部分。回到第\
  \ `0` 层，我们继续下一步“计算值”。最后我们再次回到第 `0` 层并完成最后的步骤“输出结果”和“关闭文件”。\n\n![贷款程序中的步骤。](img/9781284166033_CH04_UFIG175-1.jpg)\n\
  \n描述\n\n根据这个算法，我们可以构建一个所需的变量表，然后编写程序的声明和可执行语句。\n\n在实践中，你编写设计不是作为树形图，而是作为一系列按抽象级分组的模块。\n\
  \n![按两个抽象级分组的模块化贷款程序。](img/9781284166033_CH04_UFIG175-2.jpg)![按两个抽象级分组的模块化贷款程序。](img/9781284166033_CH04_UFIG176-1.jpg)\n\
  \n描述\n\n如果你查看 `Mortgage` 的 `C++` 程序，你可以看到它与这种解决方案非常相似。模块的名称也以注释的形式写在代码中。\n\n我们在这里引入的实现类型被称为扁平实现或内联实现。我们通过将所有步骤写成一个长序列，将解决方案的二维层次结构扁平化。当解决方案很短且只有几个抽象级时，这种实现是足够的。假设有适当的注释和良好的风格，生成的程序是清晰易于理解的。\n\
  \n抽象级更多的程序很难以扁平实现的方式处理。对于这类程序，最好使用层次实现来实现层次解决方案，在层次实现中，我们通过将许多模块编写为单独的 `C++` 函数，然后将设计中的抽象步骤替换为对这些函数的调用。\n\
  \n将模块实现为函数的优势之一是它们可以从程序的不同地方被调用。例如，如果问题要求在多个地方计算圆柱体积，我们可以写一个函数来执行计算，并在每个地方简单地调用它。这给了我们一个半层次的实现。这种实现并没有保持纯粹的层次结构，因为解决方案树上不同层级的抽象步骤共享同一个模块的实现（参见图\
  \ 4.5）。共享模块实际上落在了层次结构之外，因为它并不真正属于任何一个层级。\n\n![带有共享模块的半层次模块结构图。](img/9781284166033_CH04_FIGF05.jpg)\n\
  \n图 4.5 带有共享模块的半层次模块结构图\n\n描述\n\n模块实现函数的另一个优势是你可以在其他程序中重用它们。随着时间的推移，你将建立自己的函数库来补充\
  \ `C++` 标准库。\n\n我们将层次实现的讨论推迟到第 8 章。目前我们的程序足够短，可以使用扁平实现。\n\n从现在起，我们在案例研究中的功能分解中使用以下大纲，并建议你在解决自己的问题时采用类似的大纲：\n\
  \n> 问题描述\n> 输入描述\n> 输出描述\n> 假设（如有）\n> 主模块\n> 按层级划分的模块\n\n在我们的某些案例中，这个大纲经过了重新组织，使输入输出描述位于讨论之后。我们可能对其进行扩展。不要把这个大纲看作僵化的处方——它更像是一个“待办事项”。我们要确保完成清单上的所有事项，但问题的具体情况会指导我们使用的步骤和执行顺序。\n\
  \n### 设计视角\n\n我们查看了两种设计方法：面向对象设计和功能分解。在我们学习支持 OOD 的更多 `C++` 语言特性之前，我们将使用功能分解来开发解决方案。\n\
  \n记住，功能分解和 OOD 并不是相互孤立的技术。OOD 将问题分解为对象。对象包含数据和关联的操作。这些操作需要算法。有时必须使用功能分解来处理算法。经验丰富的程序员熟悉这两种方法，并知道何时使用其中一种或两者结合。\n\
  \n记住，编程过程中的问题解决阶段需要时间。如果你花费大部分时间分析和设计解决方案，那么实现程序的时间就会相对减少。\n\n现在让我们来看一个演示功能分解的案例研究。\n\
  \n### 图形用户界面 (GUI)\n\n虽然流式输入为程序从用户那里接收输入提供了一种简单的机制，但大多数现代程序通过图形用户界面 (GUI) 与人类交互。例如，之前我们使用如下代码让用户输入文件名：\n\
  \n![输入文件名的代码。](img/9781284166033_CH04_PRE46.jpg)\n\n描述\n\n\n\n\n但对于人类来说，点击按钮和从列表中选择文件比根据提示输入输入内容要愉快得多。这还避免了用户误输入现有文件名称的问题。让我们重新编写“问题解决案例研究”中的格式化名称（Format\
  \ Names）程序，允许用户输入文件名，就像我们在“软件维护案例研究”中对抵押贷款程序做的那样。不过，我们不再使用 `cin` 和 `cout`，而是使用一种更现代、更熟悉的\
  \ GUI 界面。\n\nQt GUI 库提供了我们这类交互所需的组件。这些组件被称为对话框（dialogs）。我们通过以下包含语句访问 Qt 对话框库：\n\n\
  ![访问 Qt 对话框库的包含语句。](img/9781284166033_CH04_PRE47.jpg)\n\n描述\n\nQt 为不同类型的交互提供了不同的对话框。其中一种被称为\
  \ `TextDialog`，它仅允许用户输入一个字符串，就像我们之前使用 `cin` 做的那样。另一种是 `OutputDialog`，它将字符串显示为消息，类似于写入\
  \ `cout`。区别在于，它们不是使用标准的 I/O 窗口，而是每个对话框都显示自己的专用窗口，并带有一个按钮，允许用户在操作完成后指示。\n\n就像我们在使用流（stream）之前必须声明流变量一样，每个对话框对象在使用之前也必须先声明。例如，我们可以如下使用\
  \ `TextDialog` 从用户处获取输出文件名：\n\n![用于创建对话框以获取输出文件名的代码。](img/9781284166033_CH04_PRE48.jpg)\n\
  \n描述\n\n`TextDialog` 对象 `getOutputName` 的声明指定了它将显示的提示内容。然后，我们调用对话框对象的 `display`\
  \ 函数（使用点表示法）：\n\n![调用对话框对象 display 函数的代码。](img/9781284166033_CH04_PRE49.jpg)\n\n\
  描述\n\n显示出一个如下所示的窗口：\n\n![用于从用户处获取输出文件名的对话框。](img/9781284166033_CH04_UFIG184-1.jpg)\n\
  \n经 Apple Inc. 许可转载的截图。\n\n描述\n\n当用户点击 OK 按钮时，他们输入的值将被返回并存储在字符串 `outputFile` 中。输出文件名是以字符串形式输入的，因为它还不存在（程序将要创建它）。但为了获取已存在的文件的文件名，我们可以使用另一种类型的对话框，称为\
  \ `FileDialog`。注意，它的用法遵循相同的模式。\n\n![文件对话框的代码。](img/9781284166033_CH04_PRE50.jpg)\n\
  \n描述\n\n然而，当这个对话框显示时，它提供的不是文本输入框，而是文件系统的视图，并让我们选择一个文件。\n\n![执行上述代码时显示的文件对话框。](img/9781284166033_CH04_UFIG184-2.jpg)\n\
  \n经 Apple Inc. 许可转载的截图。\n\n描述\n\n返回并赋值给 `inputFilePath` 的字符串不仅包含文件名，还包含它所在的目录。目录和文件名的完整组合被称为文件路径（file\
  \ path）。然而，`outputFile` 中的值只是文件名。为了保持一致，我们确实应该为输出文件指定目录。Qt 赋予我们使用 `DirectoryDialog`\
  \ 选择目录的能力。再次，它使用了与其他对话框相同的模式。\n\n![目录对话框的代码。](img/9781284166033_CH04_PRE51.jpg)\n\
  \n描述\n\n但它显示了第三种风格的对话框：\n\n![通过上述代码选择目录的对话框。](img/9781284166033_CH04_UFIG185-1.jpg)\n\
  \n经 Apple Inc. 许可转载的截图。\n\n在此窗口中，用户可以选择目录并点击 Open 按钮。因此，包含目录完整位置和名称的字符串被存储在 `outputDirectory`\
  \ 中。然而，存储在 `outputDirectory` 中的仅是目录的路径。为了获取我们想要打开的文件完整路径，我们必须将输出文件名附加输出目录路径的末尾。为了让这一点更简单，我们引入了一个工具库函数（来自\
  \ `utils`）`pathAppend`。\n\n![路径函数。](img/9781284166033_CH04_PRE52.jpg)\n\n描述\n\n\
  虽然我们不需要显示路径，但这样做让我们有机会看到另一种对话框，称为 `OutputDialog`。\n\n![对话框的代码。](img/9781284166033_CH04_PRE53.jpg)\n\
  \n描述\n\n![显示的文本字段对话框。](img/9781284166033_CH04_UFIG186-1.jpg)\n\n我们可以使用 `OutputDialog`\
  \ 显示任何我们想让用户看到的文本。当他们点击 OK 时，窗口消失。在这里，格式化程序使用 GUI 界面来获取文件。与 GUI 的部分除了 GUI 代码外，唯一的更改是\
  \ `inputFilePath` 和 `outputFilePath` 替换了我们之前使用的字面量。\n\n![格式化并打印名称的程序。](img/9781284166033_CH04_UFIG186-2.jpg)![路径框。](img/9781284166033_CH04_UFIG187-1.jpg)\n\
  \n描述\n\n注意使用 Qt 组件的模式。每个所需的 GUI 组件在使用它们与用户交互之前都已创建。每个 GUI 组件都提供了一个在屏幕上显示组件的 `display()`\
  \ 方法。一旦组件创建，我们随时可以显示它。例如，如果我们需要用户输入一系列值，我们可以为该交互创建一个 `TextDialog` 并根据需要显示它。\n\n\
  如果 GUI 组件是输入组件，它还会返回一个可以字符串结果。对于所有应用程序，测试任何方法的返回值都是重要的。这对于 GUI 组件特别重要，因为用户可以点击取消按钮而不是输入值或进行选择。在这种情况下，返回的是空字符串。\n\
