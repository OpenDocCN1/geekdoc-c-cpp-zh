  ### 在链表中插入\n\n用于向链表插入组件的函数将要插入的项作为参数。“向链表中插入”这一短语可能意味着将组件作为第一个节点插入、作为最后一个节点插入，或者根据某种顺序（如排序列表所示）将组件插入到其适当位置。列表规范没有提到顺序，因此前两种含义中的任何一种都是可以接受的。在基于数组的列表情况下，我们在末尾插入，因为在列表开头插入的效率较低。在链式实现中，插入项的逻辑位置是列表开头，因为这个位置可以通过外部指针直接访问。如果我们想在链表末尾插入项，我们要么保留一个指向最后一个节点的额外指针，要么必须在每次插入时遍历整个列表。\n\
  \n由于我们正在构建一个现有类的替代实现，我们希望两种实现之间的遍历是完全相同的。因此，我们将新项插入到列表末尾。\n\n正如我们所注意的，管理链表末尾插入有两种方法。我们选择保留指向列表最后一项指针的方法，因为它比每次插入都遍历列表要快。因此，我们将数据字段\
  \ `lastPtr` 添加到类的私有数据中。我们的列表现在具有以下通用形式：\n\n\n\n\n如果 `item` 在列表中，此时 `currPtr->component`\
  \ 等于 `item`。要删除该节点，我们将其前一个节点的 `link` 组件设置为该节点的 `link` 字段。\n\n![3 个矩形被包含在一个矩形框内。](img/9781284166033_CH14_P840-2.jpg)\n\
  \nDescription\n\n但是我们无法访问 `currPtr` 前一个结的 `link` 字段！因此，我们必须在这个循环中跟踪两个节点：`currPtr`\
  \ 和它的前一个节点。我们称之为 `prevPtr`。我们将 `prevPtr` 初始化为 `NULL`。以下是修改后的算法：\n\n![修改后的节点删除算法。](img/9781284166033_CH14_P840-3.jpg)\n\
  \nDescription\n\n我们是否遗漏了结束条件？如果要删除的节点是第一个节点，必须更新 `dataPtr`。如果要删除的节点是最后一个节点，必须更新\
  \ `lastPtr`。如果要删除的节点是列表中唯一的节点，则必须更新 `dataPtr` 和 `lastPtr`。这些测试必须在执行删除之前完成。\n\n![修改后的节点删除算法。](img/9781284166033_CH14_P841-1.jpg)\n\
  \nDescription\n\n![代码片段。](img/9781284166033_CH14_P841-2.jpg)\n\nDescription\n\n\
