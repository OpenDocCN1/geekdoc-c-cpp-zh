  \ 变量中的层级记录\n\n描述\n\n## 10.6 联合 (Unions)\n\n在图 10.3 中，我们展示了一个显示 C++ 中可用的四种结构类型的图。我们已经讨论了\
  \ `struct` 类型，现在简要查看 `union` 类型。\n\n在 C++ 中，`union` 被定义为一种在程序执行期间只持有其成员之一的 `struct`。以下是一个\
  \ `union` 类型和 `union` 变量的声明：\n\n![一个 union 类型和一个 union 变量的声明。](img/9781284166033_CH10_581.jpg)\n\
  \n描述\n\n声明 `union` 类型的语法与我们之前展示的 `struct` 类型语法相同，仅是将 `struct` 一词替换为 `union`。\n\n\
  在运行时，分配给变量 `weight` 的内存并不包含三个组件的空间。相反，`weight` 只能包含以下之一：要么是一个 `long` 值，要么是一个 `int`\
  \ 值，要么是一个 `float` 值。这种联合对于一个存储以盎司、磅或吨为单位的重量值的程序非常有用，因为每种单位都需要不同的数据类型。`union` 的目的是通过允许不同类型的值在不同时间共享内存空间来节省内存。以下代码显示了\
  \ `weight` 可能如何被使用：\n\n```\n![关于 weight 如何使用的代码。](img/9781284166033_CH10_582.jpg)\n\
  ```\n（注：图像包含代码）。在最后一条赋值语句之后，之前的 `float` 值 4.83 消失了，并被 `int` 值 35 取代。\n\n有人可能会认为\
  \ `union` 并不是一种数据结构。它不代表值的集合；它代表的是几个潜在值中的一个值。尽管如此，由于与 `struct` 的相似性，联合在 C++ 中仍被归类在结构类型中。\n\
  \n关于 `union` 还有很多可以说的，包括与它们的声明和用法相关的微妙问题。然而，这些问题更适合在数据结构和系统编程的高级学习中使用。我们引入 `union`\
  \ 仅仅是为了完善 C++ 结构类型的全景，并让你熟悉这一通用概念，以防你在其他 C++ 程序中遇到 `union`。\n\n在之前的章节中，我们查看了 C++\
  \ 中可用的简单类型和结构类型。现在我们只剩下两种内置数据类型需要涵盖：`pointer types`（指针类型）和 `reference types`（引用类型）（参见图\
  \ 10.7）。这些是简单数据类型，但在图 10.7 中我们与其他简单类型分开列出，因为它们的目的非常特殊。我们将指针类型和引用类型称为 `address types`（地址类型）。\n\
  \n![列出 C++ 中数据类型的树图。](img/9781284166033_CH10_FIGF07.jpg)\n\n图 10.7 C++ 数据类型\n\n\
  描述\n\n这些类型之一的变量不包含数据值；它包含另一个变量或结构的内存地址。地址类型有两个主要目的：它们可以使程序更高效——无论是在速度还是内存使用方面——并且它们可以用于构建复杂的数据结构。我们在这里强调的是者的用法。\n\
  \n## 10.7 指针 (Pointers)\n\n指针正如其名所示：告诉你在哪里寻找某东西的变量。也就是说，指针包含其他变量的地址或位置。从技术上讲，`pointer\
  \ type` 是一种简单数据类型。让我们通过观察 C++ 中如何声明指针变量开始这段讨论。\n\n### 指针变量\n\n惊讶的是，声明时并没有使用“pointer”一词；取而使用的是符号\
  \ `*`。根据语法模板，如果你在一个语句中声明多个变量，必须在每个变量前加上星号。否则，为了避免意外错误，最安全的方法是在单独的语句中声明每个指针变量。\n\n\
  给定声明：\n```\nint beta;\nint *intPtr;\n```\n![images/9781284166033_CH10_584 我们可以通过单元运算符\
  \ `&`（称为地址运算符）让 `intPtr` 指向 `beta`。在运行时，赋值语句获取 `beta` 的内存地址并将其存入 `intPtr`。```intPtr\
  \ = &beta;```![images/9781284166033_CH10_584a 或者，我们也可以在声明时初始化 `intPtr`：```int beta;int\
  \ *intPtr = &beta;```![images/9781284166033_CH10_584c 假设 `intPtr` 和 `beta` 恰好位于内存地址\
  \ 5000 和 5008。那么将 `beta` 的地址存入 `intPtr` 将导致如图 10.8 所示的关系。![将 beta 的地址存入 intPtr 的视觉表示。](img/9781284166033_CH10_FIGF08.jpg)\n\
  \n图 10.8 指针变量的机器级视图\n\n描述\n\n![指针的图形表示。](img/9781284166033_CH10_FIGF09.jpg)\n\n\n\
  \n\n\n# 图 10.9 指针的图形化表示\n\n描述\n\n在随后的讨论中，我们不再使用虚拟的数值地址来说明指针与它们指向的对象之间的关系，而是使用通惯例，用矩形和箭头来绘制它们，如图图\
  \ 10.9 所示。然而，请记住，每当我们画一个带有指向箭头的框时，它代表一个包含内存地址的变量。而箭头头部指向其外部的框则代表一个被指向的值。\n\n要访问指针所指向的变量，我们使用单目运算符\
  \ `*`——即解引用运算符或间接引用运算符。表达式 `*intPtr` 表示 `intPtr` 所指向的变量。在示例中，`intPtr` 目前指向 `beta`，因此语句\n\
  \n![一条语句。星号 int p t r，等号，28，分号。](img/9781284166033_CH10_585.jpg)\n\n使用 `intPtr`\
  \ 中的地址找到 `beta`，然后将值 28 存储到 `beta`。从 `intPtr` 获取地址并使用其定位 `beta` 的步骤被称为解引用 `intPtr`。这条语句也可以被描述为对\
  \ `beta` 进行**间接寻址**：机器首先访问 `intPtr`，然后使用其内容定位 `beta`。相比之下，语句\n\n![一条语句。beta，等号，28，分号。](img/9781284166033_CH10_585a.jpg)\n\
  \n代表对 `beta` 进行**直接寻址**。直接寻址就像打开一个邮箱（例如第 15 号邮箱）并找到一个包裹，而间接寻址就像打开 23 号邮箱，发现一张便条，上面写着你的包裹在\
  \ 15 号邮箱里。\n\n明确这些术语至关重要。解引用（Dereferencing）指的是指针本身以及我们如何使用其中包含的地址来找到它指向的对象。间接寻址（Indirect\
  \ addressing）指的是被指向的值以及我们如何使用指针的地址来访问它。*直接寻址*（direct addressing）这个术语只是我们为目前为止所熟悉的、访问值的方式所起的一个新名称，以便将其与新的间接寻址技术区分开来。\n\
  \n继续我们的示例，如果执行以下语句\n\n![一段代码片段。](img/9781284166033_CH10_585b.jpg)\n\n描述\n\n那么输出是\n\
  \n![输出内容。第 1 行：5008。第 2 行：28。](img/9781284166033_CH10_585c.jpg)\n\n第一条输出语句显示 `intPtr`\
