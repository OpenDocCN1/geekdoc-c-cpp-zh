  \n相反，你必须编写一个循环并逐个打印数组元素。然而，空终止字符串是有效的。字符串可以是一个![![语句。](img/9781284166033_APP_P1249-1.jpg)\n\
  \n或者是一个变量：\n\n![一个代码片段。](img/9781284166033_APP_P1249-2.jpg)\n\n在这两种情况下，插入运算符 `<<`\
  \ 都会输出数组中的每个字符，直到找到空字符。要输入 C 字符串，我们有几种选择。第一种是使用提取运算符 `>>`，它会跳过领先空白字符，然后将字符读入数组，并在第一个空白字符处停止。例如，假设输入流最初如下\n\
  \n![三条语句。](img/9781284166033_APP_P1249-5.jpg)\n\n那么我们的输入语句会将 `J`、`o`、`h`、`n` 和 `\\\
