  描述\n\n注意索引在输出之前必须转换回字符。这种转换是原始操作的反向：在索引上加上字母 'A'，并将结果强制转换回字符。\n\n### 将数组作为参数\n\n\
  在第 8 章 中，我们说除非函数需要更改参数，否则应该按值向函数传递变量而不是按引用。我们特别将流变量（如文件）排除在这一规则之外，并提到稍后会讨论另一个例外。现在揭示数组就是例外。\n\
  \n默认情况下，C++ 简单变量总是按值传递。要按引用传递简单变量，必须在函数参数列表中数据类型名称后面加上取地址符 `&`：\n\n![引用传递变量的声明](img/9781284166033_CH11_P605-1.jpg)\n\
  描述\n\n在 C++ 中，数组*总是*按引用传递。(2) 因此，在声明数组作为参数时，你永远不应该使用 `&`。当数组作为参数传递时，它的**基地址**——数组第一个元素的内存地址会被发送给函数。然后函数就知道了调用者实际数组的位置，并可以访问数组的任何元素。\n\
  \n这是一个 C++ 函数，它可以将任何大小的一维 `int` 数组清零：\n\n![代码片段](img/9781284166033_CH11_P605-2.jpg)\n\
  描述\n\n在参数列表中，`intArray` 的声明没有包含大小。如果指定了，编译器会忽略它。记住 C++ 不进行边界检查，所以它不在乎大小。因此，我们需要包含第二个参数——元素数量，以为\
  \ For 循环提供终止条件。\n\n\n\n\n调用代码可以调用 `ZeroOut` 来处理任意大小的 `int` 数组。以下代码段将两个不同大小的数组清零。注意在函数原型中是如何声明数组参数的。\n\
  \n![代码片段。](img/9781284166033_CH11_P605-3.jpg)\n\n描述\n\n![代码片段的延续。](img/9781284166033_CH11_P606-1.jpg)\n\
  \n描述\n\n请记住，在函数内部，数组参数仅仅是一个持有参数数组第一个元素地址的变量。调用中的数组参数将其地址传递给数组参数，导致其引用该数组。调用并没有复制数组的元素。忘记这种区别是一个常见的错误。\n\
  \n对于简单变量，我们使用按值传递（pass-by-value）来防止函数修改调用者的参数。虽然 C++ 中的数组不是按值传递的，但你仍然可以实现相同的效果。为此，你在参数声明中使用保留关键字\
  \ `const`。以下是一个一个 `int` 数组复制到另一个数组的函数。第一个参数——目标数组——预期会被修改；而第二个数组则不会。\n\n![函数片段。](img/9781284166033_CH11_P606-2.jpg)\n\
  \n描述\n\n使用 `const` 可以确保 `Copy` 函数任何修改 `source` 数组的尝试导致编译错误。下表总结了简单变量和一维数组的参数传递方式：\n\
  \n| 参数 | 按值传递的参数声明 | 按引用传递的参数声明 |\n| --- | --- | --- |\n| 简单变量 | `int cost` | `int&\
  \ price` |\n| 数组 | 不允许* | `int table[]` |\n\n*在数组声明前加上 `const` 单词可以防止函数修改参数。\n\n\
  一个常见的错误是在想要传递数组时，却向函数传递了数组*元素*。例如，我们的 `ZeroOut` 函数期望一个 `int` 数组作为第一个参数。在下面的代码中，调用是错误的：\n\
  \n![程序代码。](img/9781284166033_CH11_P606-4.jpg)\n\n描述\n\n问题在于 `counters[26]` 表示的是单个数组元素——一个\
  \ `int` 数字——而不是一个数组。此外，不存在索引为 26 的数组元素。`counters` 的索引从 0 到 25。\n\n### 数组注释\n\n在注释中，我们经常需要引用一段数组元素范围：\n\
  \n![注释。两个正斜杠，字母，左方括号，i，右方括号，通过，字母，左方括号，j，右方括号，已输出。](img/9781284166033_CH11_P607-1.jpg)\n\
  \n描述\n\n为了指定此类范围，使用由两个点组成的省略表示法更为方便：\n\n![注释。两个正斜杠，字母，左方括号，i，右方括号，点，点，字母，左方括号，j，右方括号，已输出。](img/9781284166033_CH11_P607-2.jpg)\n\
  \n或者更简洁地：\n\n![注释。两个正斜杠，字母，左方括号，i，点，点，j，右方括号，已输出。](img/9781284166033_CH11_P607-3.jpg)\n\
  \n注意，这种双点表示法在 C++ 中*不是*有效语法。我们只在注释中使用。\n\n例如，这里是我们如何为 `ZeroOut` 函数编写前置条件和后条件的：\n\
  \n![示例函数。](img/9781284166033_CH11_P607-4.jpg)\n\n描述\n\n#### 在数组上使用 Typedef\n\n在第\
  \ 10 章中，我们讨论了 `Typedef` 语句作为为现有数据类型提供额外名称的方法。我们可以使用 `Typedef` 给数组类型命名。这里有一个例子：\n\
  \n![一个带有 type def 的语句。type def，float，float 数组，左方括号，100，右方括号，分号。](img/9781284166033_CH11_P613-1.jpg)\n\
  \n\n\n在第 3 章中，我们引入了 C++ 字符串类型以及相关函数，例如 `length()`。在本节中，我们将介绍一种基于数组的替代字符串表示，以及针对该实现的特定操作。\n\
  \n## 作为数组的字符串\n\n正如我们在第 1 章中提到的，C++ 编程语言是早期 C 编程语言的超集。C 只有一种表示字符串的原始机制：即字符数组。C++\
  \ 继承了 C 对数组风格字符串表示的所有支持。\n\n从抽象的角度来说说，*字符串*可以被看是一个字符数组。例如，字符串“dogs”可以被视为字符‘d’、‘o’、‘g’、‘s’的序列。以下\
  \ C++ 代码是设置该序列数组的一种方法：\n\n![作为字符数组的字符串。](img/9781284166033_CH11_P615-1.jpg)\n\n\
  描述\n\n我们声明了一个包含四个 `chars` 的数组，并为每个元素分配字符串“dogs”的字符。虽然这种方法可行，但非常繁琐。幸运的是，也可以使用字面量符号声明\
  \ C 风格字符串：\n\n![使用字符串字面量符号声明字符串。char, my string,左中括号,右中括号,等于,双引号,dogs,双引号,分号。](img/9781284166033_CH11_P615-2.jpg)\n\
  \n然而，这个版本与之前的方法之间有一个重要的区别。数组的长度不是 4，而是 5。额外的元素持有一个*空字符*，用来指示字符串的结束。空字符由特殊序列 `'\\\
  0'` 表示。因此，为了*真正*在不使用字符串字面量符号的情况下声明 C 风格字符串，我们会写：\n\n![未使用字符串字面量符号的字符串。](img/9781284166033_CH11_P615-3.jpg)\n\
  \n描述\n\n此数组声明与使用字符串字面量符号创建数组完全对应。\n\nC 没有提供字符串处理的内置设施（除了初始化 `char` 数组）。相比之下，C++\
  \ `string` 数据类型提供了丰富的操作 set，例如 `substr()`。\n\n## C 字符串操作\n\n虽然 C 风格字符串不如其 C++ 对应物丰富，但在\
  \ `string.h` 头文件中有很多实用的操作。下表显示了一些提供的函数示例：\n\n| 函数 | 描述 |\n| --- | --- |\n| `size_t\
  \ strlen(const char *s);` | 计算字符串 `s` 的长度。 |\n| `int strcmp(const char *s1, const\
  \ char *s2);` | 字典顺序比较字符串 `s1` 和 `s2`，并返回大于、等于或小于 0 的整数。 |\n| `char* strncat(char\
  \ *s1, const char *s2, size_t n);` | 将字符串 `s2` 的前 `n` 个字符的拷贝追加到字符串 `s1` 的末尾。字符串\
  \ `s1` 必须足够长以容纳结果。返回指向新字符串的指针。 |\n| `char* strncpy(char *s1, const char *s2, size_t\
  \ n);` | 将字符串 `s2` 的 `n` 个字符拷贝到字符串 `s1`。返回指向新字符串的指针。 |\n| `char* strchr(const char\
  \ *s, int c);` | 在字符串 `s` 中定位字符 `c` 第一次出现的位置。返回字符串中字符位置的指针。 |\n| `char* strstr(const\
  \ char *s1, const char *s2);` | 在字符串 `s1` 中定位字符串 `s2` 第一次出现的位置，并返回该字符串起始位置的指针。 |\n\
  \n注意的是，C 风格字符串是*可变的*。例如，向字符串的任何位置分配一个字符将*覆盖*该字符以你指定的字符。同样，表中的许多字符串操作都会覆盖其参数。例如，`strncpy`\
  \ 覆盖了它的第一个参数。此外，由于 C 风格字符串仅仅是指针，在使用 `strncat` 等函数时必须非常小心。`strncat` 函数要求其第一个参数*必须足够长*以容纳追加第二个参数后的结果。记住\
  \ C++ 不检查数组边界，所以如果数组太短，结果将覆盖字符串结束之外的内存，可能导致崩溃。\n\n## 将 C 字符串转换为 C++ 字符串\n\n在 C++\
  \ 中编程最终会导致使用需要 C 风格字符串的库。我们可能需要调用一个需要 C 风格字符串参数的函数，或者返回 C 风格字符串的函数。从 C 风格字符串转换为\
  \ C++ 字符串很容易。有一个构造函数可以从 C 字符串创建 C++ 字符串：\n\n![一段代码片段。第 1 行: char,星号, c dog,等于,双引号,dog,双引号,分号。第\
  \ 2 行: string,左括号,右括号,分号。](img/9781284166033_CH11_P616-1.jpg)\n\n## 使用哪种表示\n\n鉴于我们有两种字符串表示，哪种最好？在大多数情况下，你应该选择\
  \ C++ 字符串，因为它更安全。C 风格字符串是一个例外：当你必须与需要 C 风格字符串的库进行交互时。\n\n## 11.2 记录数组\n\n许多应用程序涉及记录的集合；例如，业务需要记录列表，而老师需要学生列表。数组对于这些应用程序是理想的。我们只需定义一个组件为记录的数组。\n\
  \n### 记录数组\n\n在第 10 章中，我们使用 `struct` 定义了一个学生记录。假设我们现在需要这些记录的集合。我们如何实现“集合”？我们可以声明一个记录数组。为了让事情更有趣，让我们添加一个自定义类型\
  \ `GradeType` 和一个成绩数组。这是一个程序的开头，所以我们以代码形式显示结构：\n\n![一个程序。](img/9781284166033_CH11_P617-1.jpg)\n\
  \n例如，为了访问第三个学生的课程成绩，我们使用以下表达式：\n\n![一个表达式。](img/9781284166033_CH11_P618-1.jpg)\n\
  \n\n\n记录组件 `gradeBook[2].examScore` 是一个数组。我们可以访问该组件中的单个元素，就像访问任何其他数组的元素一样：给出数组的名称，后面跟上括括号内的索引。\n\
  \n![一个表达式。](img/9781284166033_CH11_P618-2.jpg)\n\n描述\n\n下一步是编写一个函数，将值从文件中读取到记录的字段中。文件名和记录是该函数的参数。这两个者都必须是引用参数：文件总是通过引用传递的，而我们正在通过记录向调用代码返回值。\n\
  \n![一段程序段落。](img/9781284166033_CH11_P619-1.jpg)\n\n描述\n\n唯一棘手在于跳过每个学生条目末尾的换行符（eoln）。这个换行符紧跟在作为字符输入的字母等级之后。我们不能使用普通的字符读取操作，因为它会返回下一个学生名字的字母。相反，我们必须使用\
