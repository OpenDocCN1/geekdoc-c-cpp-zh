  \ |\n| * | 乘法 | 整数、浮点 |\n| / | 浮点除法（浮点数结果），或整数除法（无小数部分） | 浮点, 整数 |\n| % | 取模（整数除法的余数）\
  \ | 整数 |\n\n前两个运算符是一元运算符——它们只需要一个操作数。其余五个是二元运算符，需要两个操作数。一元加减的使用如下：\n\n![列出算术运算符的表格。](img/9781284166033_CH03_PRE14.jpg)\n\
