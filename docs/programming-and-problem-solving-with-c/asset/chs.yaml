  \ switch 语句。](img/9781284166033_CH10_562a.jpg)\n\nDescription\n\n以下程序读取一个枚举类型的值并输出对应的字符串：\n\
  \n![程序演示了枚举类型的输入和输出。](img/9781284166033_CH10_562b.jpg)![程序演示了枚举类型的输入和输出。](img/9781284166033_CH10_563.jpg)\n\
  \nDescription\n\n这是该程序的示例输出：\n\n![一个示例输出。](img/9781284166033_CH10_564.jpg)\n\nDescription\n\
  \n你可能会问，为什么不直接用一对字母或一个整数作为代码来表示程序中的每种动物？答案是，我们使用枚举类型来使程序更具可读性。\n\n### 返回值\n\n到目前为止，我们一直使用返回值的函数来计算内置类型。现在让我们写一个返回\
  \ `Animals`：\n\n![一个 switch 函数。](img/9781284166033_CH10_564.jpg)\n\nDescription\n\
  \n你可能奇怪为什么我们在 case 后面没有包含 `Break`。当一个分支执行时，控制会退出函数，因此不会“穿透”到下一个分支。\n\n这是之前程序的 `main`\
  \ 函数，它调用 `StrToAnimal` 将字符串转换为 `Animals` 类型的值：\n\n![之前程序的 main 函数。](img/9781284166033_CH10_565a.jpg)![之前程序的\
