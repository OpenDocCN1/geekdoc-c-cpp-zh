  int main()\n```\n![images/9781284166033_CH02_PRE60.jpg)这里是语句的语法模板，仅限于本章讨论的 C++ 语句：![语句的语法模板。](img/9781284166033_CH02_UFIG69-2.jpg)\n\
  \n描述\n\n语句可以是空的（空语句）。空语句只是一个分号，看起来像：\n\n```cpp\n;\n```\n![images/9781284166033_CH02_PRE61.jpg)它在执行时什么都不做；执行将继续到下一条语句。空语句很少使用。正如语法模板所示，语句也可以是一个声明、一个可执行语句，甚至是一个块。最后一个术语意味着在任何允许使用单个语句的地方你都可以使用整个块。当我们引入分支和循环结构的语法时，我们会发现这非常重要。我们经常使用块，特别是作为其他语句的一部分。漏掉一对\
  \ `{ }` 可能会剧烈改变程序的含义以及执行过程。这就是为什么我们总是对块内部的语句进行缩进——缩进使得块在长段代码中易于识别。注意在块和语句的语法模板中，没有提到分号——然而\
  \ `PrintName` 程序包含了许多分号。如果你回看常量声明、变量声明、赋值语句和输出语句的模板，你可以看到每种语句的末尾都需要一个分号。然而，块的语法模板在右大括号后没有显示分号。因此，在\
  \ C++ 中使用分号的规则非常简单：除了复合语句（块）外，每条语句都用用分号结束。关于块和语句的另一点：根据语句的语法模板，声明在正式上被认为是一个语句。因此，声明可以出现在任何可以使用可执行语句的地方。在块中，我们可以根据需要混合声明和可执行语句：![带有声明和可执行语句的代码块。](img/9781284166033_CH02_PRE62.jpg)\n\
