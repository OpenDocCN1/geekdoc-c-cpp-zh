  \n假设我们想写一个返回键值的函数，该函数接收链表的外部指针（`listPtr`），创建链表的克隆，并将新链表的外部指针作为函数返回值返回。该函数的典型调用如下：\n\
  \n![对一个复制链表的函数的调用。](img/9781284166033_CH18_p1166-1.jpg)\n\n描述\n\n使用迭代来复制链表相当复杂。以下算法与\
