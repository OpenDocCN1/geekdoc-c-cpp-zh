  \ `GList` 的声明：\n\n![一个实例化。](img/9781284166033_CH16_P984-4.jpg)\n\n描述\n\n练习要求你对代码进行这些更改并进行测试。\n\
  \n### 注意事项\n\n如果你在集成开发环境（IDE）中开发程序，在该环境中的编辑器、编译器和链接器被捆绑成一个应用程序，那么在使用模板时必须非常小心。在\
  \ IDE 中，你通常被要求定义一个“项目”——即构成程序的各个单独文件列表。由于第 13 章 中的 `List` 类由两个文件（`list.h` 和 `list.cpp`）组成，且你的客户端代码位于文件\
  \ `myprog.cpp`，你需要在项目中指定 `myprog.cpp` 和 `list.cpp`。核心思想是这两个文件是分别编译的，然后它们的对象代码文件被（通过链接器）链接形成一个可执行文件。\n\
  \n使用模板，这种情况可能会发生变化。我们不想单独编译 `myprog.cpp` 和 `glist.h`（如果我们正在使用第二种组织代码的方法，则为 `glist.cpp`）。在这种情况下，解决方案是在项目中仅指定\
  \ `myprog.cpp`。因为 `myprog.cpp` 指明要包含 `glist.h`，而 `glist.h` 要么包含实现代码，要么说明包含 `glist.cpp`，编译器会接收所有的源代码并一次编译。\n\
  \n1 一旦定义了模板函数，就可以编写一个额外的定义（称为显式特化），为特定类型重新定义该函数。这种重定义以 `template <>` 开头，并且函数头部包含了函数名后角括号中出现的类型。C++\
  \ 社区对显式特化的使用存在争议，它们的定义在语言的未来版本中可能会发生。因此，我们在此不再进一步讨论它们。尽管如此，你应该意识到看到 `template` 后面跟着空括号的含义的，以防你在其他地方遇到此类代码。\n\
  \n## 16.2 泛型函数\n\n有时当我们设计或测试软件时，会发现需要一个单一算法，该算法可以在不同时间应用于不同数据类型的对象。我们希望能够描述这种算法，而无需指定所处理条目的数据类型。这种算法通常被称为泛型算法。C++\
  \ 通过提供两种机制来支持泛型算法：函数重载和模板函数。\n\n### 函数重载\n\n函数重载是对不同的函数使用相同的名称，只要它们的参数类型足够不同，以便编译器能够区分它们。为了查看它是如何工作的，让我们来看一个例子。\n\
  \n假设我们正在调试一个程序，并通过在程序执行时输出某些变量的值来追踪其执行。我们想要追踪的变量具有以下六种数据类型：`int`、`char`、`float`、`double`、`short`\
  \ 和 `long`。我们可以创建六个名称不同的函数。然而，C++ 并没有强迫我们发明不同的名称。相反，C++ 允许我们使用相同的名称来调用它们，例如 `PrintInt`、`PrintFloat`\
  \ 等（此处，此处处应为 Print）。](9781284166033_CH16_P986）这些函数的调用如下：\n\n![代码片段。](img/9781284166033_CH16_P986.jpg)\n\
  \n描述\n\n我们可以认为 `Print` 是一个泛型算法，因为算法本身（输出“Debug”字符串以及变量的值）与变量的数据类型无关。\n\n函数重载是如何工作的？当编译器遇到函数调用\n\
  \n```\nPrint(someVar);\n```\n\n![三个调用。](img/9781284166033_CH16_P987.jpg)\n\n它会将实际参数的类型与六个函数的正式参数进行比较。如果\
  \ `someVar` 是 `int` 类型，编译器将生成调用具有 `int` 参数的 `Print` 函数的代码。如果 `someVar` 是 `float`\
  \ 类型，编译器将生成调用具有 `float` 参数的 `Print` 函数的代码，以此此类推。\n\n可见，函数重载通过消除为相同任务的任务命名不同名称的需求惠了程序员。尽管函数重载有好处，但在我们的\
  \ `Print` 函数示例中，我们仍然必须提供不同的函数定义。这在编辑器中意味着了大量的复制粘贴工作，并且结果代码充斥着几乎相同的函数定义。\n\n### 在类外定义函数模板\n\
  \n解决此问题的更好方法是使用模板函数。我们已经看到这种方法可以实现模板类的成员函数；然而，C++ 并不将模板函数限制在类中。它们可以在任何可以定义普通函数的地方定义。在这里我们将备用关键字\
  \ `typename`，以强调 `Print` 不必须是类的一部分。\n\n![函数模板。](img/9781284166033_CH16_P987-1.jpg)\n\
  \n描述\n\n### 实例化函数模板\n\n给定此 `Print` 函数模板，我们可以如下所示进行函数调用：\n\n![三个调用。](img/9781284166033_CH16_P987-2.jpg)\n\
  \n描述\n\n\n\n在此段代码中，尖括号括内的类型名称是模板参数。在编译时，编译器会生成（实例化）三个不同的函数，每个函数都针对特定的模板参数进行了特化处理。\n\
  \n当编译器实例化一个模板时，它会字面上地在整个函数模板中用模板参数替换模板参数，就像你在编辑器中执行“查找并替换”操作一样。例如，当编译器在调用代码中第一次遇到\
  \ `Print<float>` 时，它通过用 `float` 替换函数模板中所有出现的 `SomeType` 来生成新函数：\n\n![一段代码片段。](img/9781284166033_CH16_P988.jpg)\n\
  \n描述\n\n以下是调用模板函数的语法模板：\n\n![一个模板函数调用。](img/9781284166033_CH16_P988-1.jpg)\n\n描述\n\
  \n如你所示，尖括号中的模板参数列表是可选的。事实上，大多数程序员都会省略它。在这种情况下，编译器通过通过检查函数参数列表来推导出模板参数。\n\n例如，我们之前那个使用显式模板参数的调用代码示例，更有可能写成如下形式：\n\
  \n![三次函数调用。](img/9781284166033_CH16_P988-2.jpg)\n\n描述\n\n在这段代码中，当编译器遇到 `Print(sum)`\
  \ 时，它查看函数参数 `sum` 的数据类型（为 `int`），并推导出模板参数必须是 `int`。因此，该函数调用是对模板的 `Print<int>` 特化版本。\n\
  \n然而，在某些情况下，编译器无法推导出函数的适当特化版本。例如，如果参数是一个多态类的对象，编译器不知道在运行时将哪个子类传递给函数。请记住，编译器必须能够在编译时完成实例化泛型函数的所有工作。如果它无法从代码中推导出特化版本，你必须明确指定类型。\n\
  \n## 16.3 运算符重载\n\n在第 14 章中，我们创建了一个包含 `Entry` 类元素的排序链表。为了完成这项任务，我们必须使用 `ComparedTo`\
  \ 函数而不是关系运算符来重写列表算法。我们可以通过 C++ 的另一个高级特性：运算符重载来避免这一步。\n\n以下是上一章 `Date` 类，增加了重载关系运算符\
  \ `<`、`>` 和 `==` 的函数。函数原型经过阴影处理。\n\n![Date 抽象数据类型的规范文件。](img/9781284166033_CH16_P989.jpg)\n\
  \n描述\n\n重载符号的语法是单词 `operator` 后面跟要重载的符号。当我们使用这些运算符时，它们每个都有两个操作数，但参数列表中只显示了一个参数。另一个操作数在哪里？第一个操作数是应用该运算符的对象，第二个操作数是参数。此类函数在\
  \ C++ 中被称为运算符函数。以下是它们的实现：\n\n![重载 Date 运算符的代码。](img/9781284166033_CH16_P990.jpg)\n\
  \n描述\n\n这是一个测试驱动程序，用于展示我们如何使用这些函数。在练习题中，你被要求为 `Date` 类编写测试计划，并重载剩余的关系运算符。\n\n![Date\
  \ 类的测试驱动程序。](img/9781284166033_CH16_P990-1.jpg)\n\n描述\n\n![Date 类测试驱动程序的延续。](img/9781284166033_CH16_P991.jpg)\n\
  \n描述\n\n输出：\n\n![测试驱动程序的输出。](img/9781284166033_CH16_P991-1.jpg)\n\n描述\n\n如你所示，`Date`\
  \ 类的对象现在可以使用关系运算符 `<`、`>` 和 `==` 进行比较了。在这些示例中，运算符左侧的操作数作为参数传递给函数的第一个操作数；也就是说，它是函数所应用的对象。运算符右侧的操作数作为函数参数列表中参数的参数传递。\n\
  \n以下是重载运算符的一些指南：\n\n1. 所有的 C++ 运算符都可以重载，除了 `::`、`.`、`sizeof` 和 `?:`。\n2. 运算符的操作数之一必须是类实例。\n\
  3. 你不能更改标准的运算符优先级、定义新的运算符符号、更改运算符的操作数或更改运算符的结合性。\n4. 重载一元运算符：如果 `data` 类型为 `SomeClass`，且你想重载（例如）负运算符，则将运算符函数头写为\
  \ `data.operator()`。空的参数列表告诉编译器你指的是一元运算符的版本。当你调用一元运算符时，运算符右侧的操作数是被应用的对象。\n5. 重载二元运算符：如果\
  \ `data` 类型为 `SomeClass` 且你重载了（例如）加运算符 (`+`)，那么 `data + otherData` 等同于 `data.operator+(otherData)`。\n\
  \n正如我们在指南 1 中提到的，几乎所有的 C++ 运算符都可以重载，包括赋值、数组索引 `[]`、函数调用 `()`、指针解引用 `->` 以及流运算符 `<<`、`>>`。在尝试重载这些运算符之前，你应该咨询\
  \ C++ 参考，因为运算符涉及到一些额外的考虑。\n\n### 使用 *this*\n\n在前面的示例中，`>` 函数与 `<` 函数基本相同，只是我们在所有语句中都使用了\
  \ `>` 关系运算符。一旦为 `Date` 定义了 `<`，如果我们能避免检查 `Date` 的每个成员并直接如下编写 `>` 函数体就太好了：\n\n![一条语句。\
  \ 这样很好，逗号，但不行通。](img/9781284166033_CH16_P992.jpg)\n\n这条语句的问题是 `thisDate` 在任何地方都没有定义。我们如何在类内部引用整个对象？C++\
  \ 通过提供一个保留字 `this` 来解决这个问题，它代表指向当前对象的指针。为了访问对象，我们必须使用 `*` 运算符对 `this` 进行解引用。然后 `>`\
  \ 函数可以重写如下：\n\n![重载 > 运算符的代码。](img/9781284166033_CH16_P992-1.jpg)\n\n描述\n\n\n\n\
  对于递增和递减运算符，这种语法重载了它们的前缀形式（例如 `++x`）。早期的 C++ 编译器不允许重载 `++` 和 `--` 的后置形式（即 `x++`）。然而，较新的编译器支持形如\
  \ `data.operator++(int dummy)` 的后置重载。实际上，没有任何内容被传递给参数 `dummy`，它的值自动为 `0`。参数名称并不非得是\
  \ `dummy`；任何标识符都可以。这个未使用的 `int` 参数的存在仅仅是一种语法技巧，用于向编译器信号该函数应该被应用于运算符左侧的对象。\n\n##\
  \ 16.4 异常\n\n假设我们正在编写一个程序，在程序中我们需要经常除两个整数并得到商数。在每情况下，我们都需要检查是否除以了 0，因此我们写了一个名为 `Quotient`\
  \ 的函数，除非分母为 0，否则它返回任意两个整数的商数：\n\n![Quotient 函数定义。](img/9781284166033_CH16_P993.jpg)\n\
  \n描述\n\n我们面临一个问题：如果分母为 0，这个函数应该做什么？这不是一个容易回答的问题。这里有几种可能性，但没有一个是完全令人意的：\n\n1. 不执行除法，并静默返回给调用代码。\n\
  2. 打印错误信息并返回一个任意整数值。\n3. 向调用者返回一个特殊值（如 -9999）作为发生错误的信号。\n4. 使用第三个参数重写函数，该参数是一个布尔标志指示成功或失败。\n\
  5. 打印错误信息并停止程序。\n\n选择 1 显然是不负责任的。选择 2 通过错误信息告知用户，但不会通知调用代码发生了任何错误。选择 3 在某些情况下是可以接受的，但总的来说不是一个好的解决方案。如果允许分子和分母为任何整数，那么\
  \ -9999 就是一个完全有效的商，无法与特殊信号值区分开来。选择 4 是一种合理的方法，并且程序员经常使用。在我们的案例中，它的缺点是，我们应该将返回值的函数（只返回一个值）改为\
  \ void 函数，以便通过参数列表作为引用参数返回两个值：商数和布尔标志。选择 5 几乎从不令人满意。调用代码——而不是被调用的函数——应该被允许在发生错误时决定该做什么。也许调用者希望采取措施从错误中恢复并继续执行程序，而不是终止它。\n\
  \n解决我们困境的一种方法是消除困境！使用如下函数先条件：\n\n![Quotient 函数定义。](img/9781284166033_CH16_P993-1.jpg)\n\
  \n描述\n\n在这里，调用者必须在调用函数之前确保先条件为真；结果是函数不需要进行任何错误检测。相反，通过这种方法，调用者负责错误检测和错误处理。在本文中，我们一直这种策略从被调用的函数中消除错误检测。但在某些情况下，错误只有在尝试执行操作之后才能检测，而不是在之前。\n\
  \n例如，本应输入整数值的函数 `ReadInt` 可能会发现用户错误地输入了一些字母（在这种情况下，输入变量不会改变，且 `cin` 流进入失败状态）。在这种情况下，我们无法为\
  \ `ReadInt` 设置“下一个输入值是有效整数”的先条件，因为调用者没有办法预测输入是什么。为了处理这类错误（以及对于那些倾向于不使用先条件方法的程序员），C++\
  \ 语言提供了异常处理机制。\n\n在软件世界中，`exception`（异常）是一种需要特殊处理的异常，通常是错误。提供必要的特殊处理的程序段被称为 `exception\
  \ handler`（异常处理器）。当一段代码宣布发生了异常时，被称为 `throw`（抛出）或 `raise` 一个异常，希望另一段代码（异常处理器）能 `catch`（捕获）异常并处理它。如果该特定异常不存在异常处理器，整个程序将带有错误消息终止。\n\
  \n现在让我们来看 C++ 提供的抛出和捕捉异常的机制。\n\n### `throw` 语句\n\n在 C++ 中，“异常”一词不仅具有异常事件的一含义，还具有更具体的含义：代表此类事件的变量或类对象。要抛出（引发）异常，程序员使用\
  \ `throw` 语句，其语法如下：\n\n![语句。throw 5，分号。](img/9781284166033_CH16_P994.jpg)\n\n在 `throw`\
  \ 语句中，`Expression`可以是任意数据类型的值或变量，无论是内置的还是用户定义的。让我们来看 `throw` 语句的三个示例。\n\n这里是示例 1：\n\
  \n```\nthrow 5;\n```\n\n在这个示例中，我们抛出一个类型为 `int` 的异常，期望一个或多个异常处理器捕获该异常。在示例 2 中，我们抛出一个类型为\
  \ `string` 的异常，即标准库：\n\n```\nthrow s;\n```\n\n![两个语句。第 1 行：string t，双引号。](img/9781284166033_CH16_P994.jpg)\n\
  \n示例 3 抛出一个我们自定义类的异常：\n\n![代码段。](img/9781284166033_P995)\n\n在在这段代码中，观察我们首先声明一个名为\
  \ `sal` 的类对象，然后抛出它。更常见的是，C++ 程序员会这样做：\n\n```\nSalaryError sal;\nthrow SalaryError();\n\
  ```\n\n![代码段。](img/9781284166033_P995-1.jpg)\n\n原因是 `throw` 语句需要一个表达式，而不是数据类型。\n\
  \n最后，注意语法模板中的 `Expression` 是可选的。我们稍后会讨论如果没有 `throw` 表达式会发生什么。\n\n### `try-catch`\
  \ 语句\n\n如果程序的某部分抛出了异常，程序的另一部分如何捕捉并处理异常？答案是使用 `try-catch` 语句，它的形式如下：\n\n![Try Catch\
  \ 语句的语法。](img/9781284166033_CH16_P995-3.jpg)\n\n描述\n\n`FormalParameter` 的语法如下：\n\
  \n![形式参数的语法。](img/9781284166033_CH16_P995-4.jpg)\n\n描述\n\n（在后一个语法模板中，三个点是字面上的输入的三个点。）\n\
  \n如第一个语法模板所示，`try-catch` 语句由一个 try-子句跟随一个或多个 catch-子句组成。try-子句由关键字 `try` 和一个块（包含任意数量语句的一对大括号\
  \ `{ }`）组成。每个 catch-子句由关键字 `catch`、一个位于圆括号内的单个参数声明和一个块组成。每个 catch-子句实际上都是异常处理器。\n\
  \n\n\n\n当程序中的某个语句或一组语句可能会导致异常时，我们将它们封装在 `try` 句（try-clause）中。对于语句可能产生的每种异常，我们编写一个\
  \ `catch` 句（异常处理器）。这里有一个 `try-catch` 语句的示例，它包含了之前在使用 `throw` 语句讨论的三种异常类型（`int`、`string`\
  \ 和 `SalaryError`）：\n\n![代码片段。](img/9781284166033_CH16_P996.jpg)\n\n描述\n\n`try-catch`\
  \ 语句的含义听起来就像教练在对体操运动员说：“尽管试着做这个翻转吧，如果你摔倒了我会接住你。”在我们的情况下，我们告诉计算机尝试执行某些可能会失败的操作，然后提供代码来捕获潜在的异常。\n\
  \n### try-catch 的执行\n\n上述 `try-catch` 语句的执行方式如下：如果 `try` 子句中的任何语句都没有抛出异常，控制权将转移到整个\
  \ `try-catch` 语句之后的语句；也就是说，我们尝试执行一些语句，如果一切按计划进行，我们就继续执行后续语句。然而，如果 `try` 子句中的某个语句抛出了异常，控制权会立即转移到相应的异常处理器（`catch`\
  \ 句）。注意，控制权会直接从引发异常的语句跳转到异常处理器。如果 `try` 子句中在引发异常的语句之后还有其他语句，它们将被跳过。当控制权到达异常处理器时，将执行处理异常的语句。如果这些语句没有引起任何新异常，也没有将控制权转移到其他地方（如\
  \ `return` 语句），那么控制权将传递到整个 `try-catch` 结构之后的语句。\n\n### 异常处理器中的形式参数\n\n当异常被抛出时，计算机如何知道多个异常处理器中的哪一个是合适的？它会查看在每个处理器中声明的形式参数的数据类型，并选择第一个数据类型与抛出的异常类型匹配的处理器。仅由省略号（三个点或句号）组成的形式参数（如前文\
  \ `FormalParameter` 语法模板所示）是一个“通配符”——它可以匹配任何异常类型。因为计算机按顺序搜索异常处理器以寻找匹配的参数，所以带有省略号参数的最后一个异常处理器可以作为任何未列出类型异常的“全捕”（catch-all）处理器：\n\
  \n![代码片段。](img/9781284166033_CH16_P997.jpg)\n\n描述\n\n注意，对匹配参数类型的顺序搜索要求我们将“全捕”处理器放在最后。如果我们将其放在结构的开头，它将捕获每种异常，导致剩余的处理器被忽略。\n\
  \n与异常处理器中的形式参数相关的另一个问题是：：参数声明是否应该包含参数的名称？（如果你查看 `FormalParameter` 的语法模板，你会发现参数的数据类型是强制的，但其名称是可选的。）事实上，只有当异常处理器体内的语句\
  \ 使用了该变量时，才需要该参数的名称。在我们稍早捕获 `int`、`string` 和 `SalaryError` 异常的示例中，第一个和第三个异常处理器的参数列表仅包含数据类型名称。相比之下，第二个处理器的参数列表指定了\
  \ `string s`，因为该处理器的体使用了以下语句\n\n![一个语句。c out，两个左尖括号，s，两个左尖括号，结束 l，分号。两个正斜杠。输出双引号，无效的客户年龄，双引号。](img/9781284166033_CH16_P997-1.jpg)\n\
  \n用用来输出 `s` 中包含的消息。\n\n最后，我们必须解决异常编程中一个非常重要的问题：异常本身的数据类型。在我们的 `int`、`string` 和 `SalaryError`\
  \ 示例中，我们使用所有三种异常类型仅仅是为了演示可能性并展示如何编写异常处理器。在实践中，内置类型（`int`、`float` 等）甚至类 `string`\
  \ 异常的用处有限。如果一个 `try` 子句抛出了多个具有不同整数值的 `int` 类型的异常，那么接收 `int` 值的异常处理器就会变得复杂。它必须包含逻辑来测试该整数，以确定具体发生了哪种错误。此外，像如下的语句：\n\
  \n```\nthrow 23;\n```\n\n![images/9781284166033_CH16_P998.jpg) 相比如下语句，可读性和自文档性低得多：```throw\
  \ SalaryError();```![images/9781284166033_CH16_P998-1.jpg)因此，更好的想法是仅使用自定义类（或结构体）作为异常类型，为每种异常定义一种类型，并使用描述性的标识符：![代码片段。](img/9781284166033_CH16_P998-2.jpg)\n\
  \n描述\n\n在我们所有的示例异常处理器中，参数都是按值传递的。这种方法对于任何标准类型都是足够的。然而，可能会开发相当复杂的异常类，按引用传递将更有效，并且可以避免子类传递给父类时可能发生的切割（slicing）问题。\n\
  \n### 非局部异常处理器\n\n在之前的讨论中，我们假设 `throw` 语句物理位于旨在捕获异常的 `try` 子句内。在这种情况下，如果抛出异常，控制权转移到对应数据类型的\
  \ `catch` 句。\n\n![展示异常被调用代码捕获的两个代码片段。](img/9781284166033_CH16_FIG01.jpg)\n\n图 16.1\
  \ 被调用代码捕获异常\n\n描述\n\n在 C++ 程序中，throw 发生在发生在 try 子句内调用的函数内部实际上更为常见，如图 16.1 中函数 `Func3`\
  \ 和 `Func4` 所示](9781284166033_CH16_04.xhtml_c16-fig001)。运行时，计算机首先在 `Func4` 内部查找\
  \ `catch`。当未找到时，会导致 `Func4` 立即返回并将异常传回给调用者 `Func3`。然后计算机在调用 `Func4` 的地方查找，找到一个合适的\
  \ `catch` 句并执行它。如你在图 16.1 中所示，异常是在 `Func4` 中抛出的，但异常处理器是非局部的。（它在调用函数 `Func3` 中被找到。）\n\
  \n假设图 16.1 中的 `Func3` 中没有匹配的 `catch` 句。那么 `Func3` 将立即返回并将异常传回给它的调用者，可能是 `Func2`。每个不知道如何处理该问题的函数都会将异常传回上一个函数。这种返回序列会沿着函数调用链一直回溯，直到找到匹配的异常处理器或控制权到达\
  \ `main`。如果 `main` 未能捕获异常（这种情况被称为未捕获异常），系统将终止程序并显示一条相对无用的信息，如“程序异常终止。”图 16.2 阐述了这一过程。\n\
  \n\n\n\n即使 `throw` 语句物理上存在 `try-catch` 的 `try` 子句中，如果该 `try-catch` 语句中没有匹配的异常处理器，结果与我们刚刚描述的相同——即封装的函数立即返回，并将异常向上传递给调用链。\n\
  \n你可能会奇怪，为什么 C++ 程序通常使用非局部异常处理器。原因在于异常处理的核心，无论使用哪种编程语言都是如此。异常的基本目的是允许程序的一个部分在错误无法在本地处理时，向程序的另一部分报告错误。\n\
  \n![两张说明了在多级函数调用中进行异常处理的图表。](img/9781284166033_CH16_FIGF02.jpg)\n\n图 16.2 跨多级函数调用的异常处理\n\
  \n描述 (注：此处原文为链接，已保留格式)\n\n### 重新抛出异常\n\n我们一直在使用以下形式的 `throw` 语句：\n\n![一条语句。throw\
  \ Salary Error，左括号，右括号，分号。](img/9781284166033_CH16_P1001.jpg)\n\n本章之前介绍的 `throw`\
  \ 语句语法模板显示，我们使用 `throw` 单词，后面可选跟一个表达式。因此，`throw` 表达式可以省略，如下：\n\n![一条语句。throw，分号。](img/9781284166033_CH16_P1001-1.jpg)\n\
  \n该语句用于已捕获异常并执行某些操作的异常处理器，然后希望将异常传递给其调用者（重新抛出异常）以便进一步处理。这是一个示例：\n\n```\n![一个代码片段。](img/9781284166033_CH16_P1001-2.jpg)\n\
  ```\n\n描述\n\n重新抛出异常是 C++ 允许部分异常处理的方式。在前面的代码中，`catch` 子句部分处理了 `BadData` 异常（通过向文件写入错误消息并关闭它），然后返回，重新抛出异常沿函数调用链向上传递，直到被捕获。\n\
  \n如果我们删掉 `throw` 语句，这段代码会发生什么？如果我们把 `throw` 改为 `return` 会发生什么？本章末尾的一个“考试准备”练习要求你考虑这些问题。\n\
  \n### 标准异常\n\n并不是所有异常都由你作为 C++ 程序员定义。C++ 标准库预定义了几个异常类，它们由 C++ 操作或标准库例程中提供的代码抛出。\n\
  \n#### 语言抛出的异常\n\n某些 C++ 操作在执行过程中发生错误时会抛出异常。这些操作包括 `new`、`dynamic_cast`、`typeid`\
  \ 以及被称为异常规格的项。后三个在本文中没有涵盖；相反，我们在这里只讨论 `new` 运算符。\n\n在第 14 章 中，我们提到 `new` 运算符从空闲存储（堆）获取一块内存，并返回指向该块内存起始位置（地址）的指针。例如，代码：\n\
  \n```\n![两条语句。第 1 行：int asterisk int P t r，分号。第 2 行：int P t r equals new int，左方括号，1000，右方括号，分号。](img/9781284166033_CH16_P1002.jpg)\n\
  ```\n\n在空闲存储上创建一个包含 1000 个元素的 `int` 数组，并将数组的基地址赋值给 `intPtr`。我们还提到，如果系统空闲存储空间耗尽，执行\
  \ `new` 将导致程序带有错误消息并终止。现在我们已经了解了异常，就可以更完整地描述所发生的情况。如果 `new` 运算符发现空闲存储已耗尽，它会抛出一个类型为\
  \ `bad_alloc` 的异常，这是标准库中预定义的 C++ 类。如果该异常没有被任何异常处理器捕获，那么——与任何未被捕获的异常一样——程序将带有“程序异常终止”等通用消息并停止。或者，我们的程序可以捕获该异常并采取某些纠正措施（或至少显示更具体的错误消息）。例如，我们可能会在\
  \ `main` 函数中编写以下代码：\n\n```\n![一个代码片段。](img/9781284166033_CH16_P1002-1.jpg)\n```\n\
  \n描述\n\n注意此异常处理器中的 `return` 语句。该语句只有在位于 `main` 函数中才会终止程序。如果我们希望前面的代码位于其他函数中，我们必须将\
  \ `return` 语句更改为其他。例如，我们可以重新抛出 `bad_alloc` 异常给更高层级的函数，或者抛出一个新异常（例如命名为 `OutOfMem`）供更高层级函数捕获。\n\
  \n#### 标准库例程抛出的异常\n\nC++ 标准库实际上是两个库：继承自 C 语言的设施（称为 C 库）和专门为 C++ 设计的设施。通常，以字母“c”开头的头文件（例如\
  \ `cmath` 和 `cctype`）位于 C 库，而其他头文件则是专门为 C++ 设计的。C 库并不抛出异常；相反，当发生错误时，它使用一个非零整数 `errno`。如果你想检查错误，可以将\
  \ `errno` 设置为 0，调用例程，然后检查 `errno` 是否非零。\n\n专门为 C++ 设计的库定义了异常类并抛出异常。例如，异常类包括 `out_of_range`\
  \ 和 `length_error`，它们在处理字符串时都可能被抛出。让我们看看如何处理这些。\n\n在第 3 章 中，我们检查了子函数 `str.substr(pos,\
  \ len)`。我们当时说，如果 `pos` 太大，程序将带有错误消息终止。实际发生的情况是抛出了 `out_of_range` 异常；如果未被捕获，程序将带有错误消息终止。如果你尝试构造一个长度大于\
  \ `string::npos` 的字符串，则抛出 `length_error` 异常。\n\n```\n![命名为 Some Func 的函数定义。](img/9781284166033_CH16_P1003.jpg)\n\
  ```\n\n描述\n\n这两个异常都定义在头文件 `<stdexcept>` 中，使用它们的程序必须包含它。我们只看了两个库异常类以让你了解它们的工作原理。库的完整描述可以写满一本书，因此我们在这里不涵盖其他异常。当你扩展对其功能的使用时，需要在库文档中查找有关异常的信息。\n\
  \n异常类的层次结构也会影响我们排列 `catch` 子句。`catch` 子句中的异常父类会匹配它的子类以及自身。因此，当使用 `try-catch` 捕获异常类层次结构不同级别的异常时，`catch`\
  \ 子句的排序应该使得低层子类排在前面，顶层类放在最后。\n\n\n\n\n在本节中，我们将介绍如何使用面向对象的技术来组织代码结构，使其更具可维护性。我们将创建继承自\
  \ Qt 框架类的自定义小控件，这些控件将代表 GUI 中的主要组件。GUI 以及实现它的这些类将取代“飞机重量与平衡”案例研究中的 `UserInterface`\
  \ 类。\n\n与之前的控制台应用程序一样，我们仍然计算飞机的总重量和重心。我们需要通过记录乘客和机组成员的信息来构建一份飞行清单单，并据此判断飞机载荷是否符合飞行条件。我们将记录乘客的姓名、体重、行李重量以及他们在飞行期间乘坐的座位号。此外，我们还将记录每位机组成员的名字和重量、储物室的重量以及燃料的总加仑数。所有信息都需要\
  \ GUI 控件，以便机组人员方便地办理乘客和人员的手续。我们还希望充分利用 GUI 的功能，在系统记录乘客时，显示乘客、机组成员以及飞机总重量和重心的运行总值。\n\
  \n在图 16.3 中，我们可以看到主要 GUI 组件的基本草图。我们在顶部使用一个输入表单用于录入乘客和机组信息。随后是两个显示乘客和机组清单的表格。下方是一个较小的表单，用于输入储物室重量和燃料加仑数。底部是显示总重量和重心的消息。图中的每个组件将由一个自定义控件实现，该控件包含标签、文本框、表格和按钮等其他控件。这些自定义控件将通过布局组合在一个窗口中渲染到屏幕上。\n\
  \n![主要 GUI 组件的草图。](img/9781284166033_CH16_FIGF03.jpg)\n\n图 16.3 主要 GUI 组件\n\n描述\n\
  \n## 乘客和机组清单表格\n\n我们从乘客和机组清单表格开始，因为它们是最容易实现的控件。乘客清单由 `PassengerManifestWidget` 实现。以下是它的类规范：\n\
  \n![乘客清单控件类的定义。](img/9781284166033_CH16_P1026.jpg)\n\n描述\n\nQt 框架中有多种基类可以用于实现控件。我们使用\
  \ `QWidget` 是因为它是最通用的类，也是你在其他基于 Qt 的应用程序中经常遇到的类。要使用 `QWidget`，我们需要包含 `QtWidgets`\
  \ 头文件。虽然我们可以只包含 `QWidget`，但 `QtWidgets` 头文件非常方便，因为它让我们能够访问所有的 Qt 控件，而无需为需要的每个控件都编写一个\
  \ `#include`。它还让我们能够使用 `Q_OBJECT` 宏。\n\n`PassengerManifestWidget` 类有一个公共构造函数和一个方法。当我们实例化此类时，会向构造函数传递一个指向\
  \ `QWidget` 对象的指针，该对象代表父级控件。由于由于 `QWidget` 基类的构造函数需要此参数，因此子类也必须提供。设置父级控件指针的原因超出了本文的范围。然而，值得提到的是这对于正确渲染\
  \ GUI 以及处理事件分发给已注册的事件处理器是必要的。该构造函数参数的默认值为 `nullptr`，表示它没有父级控件。\n\n该类还定义了 `AddPassenger`\
  \ 方法，其参数包含了乘客所需的信息，包括姓、名、座位行、体重和行李重量。这些参数将用于填充表格中的新行并渲染到屏幕上。表格是使用 Qt 提供的名为 `QTableWidget`\
  \ 的控件实现的。我们还声明了一个名为 `rowCount` 的整数，用于跟踪下一个表格行的索引。\n\n该类的实现始于包含规范头文件。接下来是构造函数：\n\n\
  ![乘客清单控件的定义。](img/9781284166033_CH16_P1027.jpg)\n\n描述\n\n构造函数创建一个标签以在主窗口中标识此控件。`rowCount`\
  \ 被设置为 0，因为新构建的清单是空的。然后我们创建一个名为 `table` 的新 `QTableWidget` 对象。我们将表格的列数设置为四，以便它可以显示乘客的姓名、行号、体重和行李重量。然后我们将表格的行数设置为当前的\
  \ `rowCount`。为了解释表格数据，我们在列上方包含了表头标签。`QStringList` 仅仅是 `QString` 对象的列表，某些 Qt 控件用它维护字符串列表。\n\
  \n完成后，我们将控件在垂直布局中排列以便渲染。这就是在 Qt 中组合一个自定义控件所需要的全部工作。我们不仅可以在此应用程序中使用该控件，还可以将其用于需要乘客清单组件的其他控件/窗口中。例如，我们可以为飞机到达时的场景（作为下机流程的一部分）编写类似的应用程序。此类应用程序可能在用户界面中需要飞行清单，但在其他方面完全不同。\n\
  \n在放置好内部控件后，我们可以添加乘客数据：\n\n![Add Passenger 方法的定义。](img/9781284166033_CH16_P1027-1.jpg)\n\
  \n描述\n\n![Add Passenger 方法的延续。](img/9781284166033_CH16_P1028.jpg)\n\n描述\n\n`AddPassenger`\
  \ 方法使用静态类方法将 C++ 字符串和浮点数转换为 `QString` 对象，从而从每个参数创建 `QString`。正如我们在第 15 章中所示，`QString`\
  \ 在 Qt 框架中无处不在。向表格添加新行需要我们为每个数据项创建一个 `QTableWidgetItem`。接下来，我们在 `rowCount` 指定的位置向表格插入一个新空行，并将每个表格项添加到相应的列中。最后，我们增加行数计数。机组清单由\
  \ `CrewManifestWidget` 定义并实现，其性质非常相似，因此我们在这里展示代码即可。\n\n![机组清单的定义。](img/9781284166033_CH16_P1028-1.jpg)\n\
  \n描述\n\n![机组清单的延续。](img/9781284166033_CH16_P1029.jpg)\n\n描述\n\n## 重量与重心\n\n另一个容易定义和实现的控件是用于显示总重量和重心的组件。以下是它的定义：\n\
  \n![Weight And C o f Widget 类的定义。](img/9781284166033_CH16_P1029-1.jpg)\n\n描述\n\n\
  ![Weight And C o f Widget 类的延续。](img/9781284166033_CH16_P1030.jpg)\n\n描述\n\n构造函数类似于\
  \ `PassengerManifestWidget`，接受一个指向 `QWidget` 的指针作为唯一参数。该类有两个私有变量，分别用于显示总重量和重心。两个名称对应的公共方法用于设置这些变量。该类的实现并不意外：\n\
