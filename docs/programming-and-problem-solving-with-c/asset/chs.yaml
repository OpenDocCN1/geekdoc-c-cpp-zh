  \n描述\n\n我们将其他情况的演练留作练习题。我们可以使用相同的技术来提高 `IsThere` 的效率。我们将它的重新实现留作练习题。\n\n### 图形用户界面\
  \ (GUI)\n\n上一节中的驱动程序是一个测试 `SortedList` 类中某些操作的简单程序。我们如何创建一个图形界面来执行类似的操作呢？与现有版本一样，我们想要创建\
  \ `Entry` 对象，将它们添加到 `SortedList` 中，从 `SortedList` 中删除它们，并显示列表中存储的 `Entry` 对象。然而，我们需要一个允许用户交互式输入信息的\
  \ GUI，例如通过输入名称和时间来构造 `Entry` 对象，以及在按下按钮时在 `SortedList` 中插入或删除这些条目。此外，我们希望 GUI 显示更新后的列表，以便我们看到这些操作的结果。\n\
  \n基于控制台的应用程序从 `main` 中的第一个语句开始执行，并逐语句继续，直到返回。GUI 应用程序的运行机制完全不同。它在 `main` 中开始执行，创建一个新的\
  \ GUI 对象，将其渲染到屏幕上，然后等待事件（用户操作）的发生。当用户与 GUI 交互时可能会发生多种类型的事件；例如按下按钮、在键盘上打字、触摸屏幕、向左或右滑动、拖动窗口以及许多其他让与计算机程序交互变得有用方便的事件。在某些情况下，某些事件可能是没用的甚至是可能的；例如，我们无法在不支持触摸屏的电脑上检测触摸。\n\
  \nGUI 程序等待事件发生的机制被称为事件循环（event loop）。程序首先在每个感兴趣的事件与相应的事件处理器（event handler）之间建立连接。事件处理器通常被写为一个函数或类方法。\n\
  \n例如，按钮对象可能有一个“按钮按下”事件。程序员编写一个方法（事件处理器）来执行按下按钮时应该采取的动作。然后，通过调用它的任一个方法，将事件处理器方法的内存地址传递给按钮对象。一旦有了事件处理器方法的地址，每次按下按钮时，它只需调用该方法。\n\
  \n在为不同类型的事件设置好处理器后，GUI 代码进入一个等待事件的循环。当事件发生时，连接到该事件的事件处理器会被调用以执行操作；例如，当用户按下按钮时，按钮会调用给定的事件处理器方法。\n\
  \n\n\n`EventHandlers` 类的构造函数有一个参数，该参数是指向 `SortedList` 的引用。`insertButtonPushed()`\
  \ 方法不需要返回任何内容，因此被指定为返回 `void`。`deleteButtonPushed()` 方法返回一个布尔值（Boolean），表示是否找到了要删除的条目。这将用于\
  \ GUI 向用户显示一条信息消息，以指示删除是否成功。`fill-TextBox()` 方法返回条目列表的字符串表示。条目的排序列表是私有的，因为在类外部不需要使用它。以下是构造函数和方法的实现：\n\
  \n![一个程序段。](img/9781284166033_CH14_P866-2.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH14_P867-1.jpg)\n\
  \n描述\n\n我们包含了 `EventHandlers.h` 头文件，以便为我们需要实现的每个方法提供定义。`fillTextBox()` 方法使用 `ostringstream`\
  \ 来创建条目列表的字符串表示，因此我们包含了 `sstream`，因为它包含了 `ostringstream` 类的定义。\n\n`EventHandlers`\
  \ 构造函数引入了一个我们之前未见过的新语法，称为初始化列表（initializer list）：\n\n![两条语句。](img/9781284166033_CH14_P867-2.jpg)\n\
  \n描述\n\n初始化列表出现在参数列表和花括号之间，由一个冒号后跟一个用逗号分隔的表达式列表组成。在这种情况下，列表中只有一个表达式，它使用类函数的表示法通过通过\
  \ `entriesInit` 传递的地址来初始化私有成员 `entries`：\n\n![一条语句。冒号、entries、左括号、entries Init、右括号。](img/9781284166033_CH14_P867-3.jpg)\n\
  \n初始化列表用于初始化在花括号内的代码执行之前必须初始化的构造结构。引用类型的类成员就是此类构造之一，因为 C++ 不允许在构造函数代码开始执行后对其重新初始化，而且它在声明时没有被初始化。因此，初始化列表为初始化提供了一个时间窗口，在构造函数执行之前、接收到参数值之后进行初始化。在这里，它允许我们使用一个从\
  \ `main` 传递到 GUI 的 `SortedList` 指针来初始化成员。\n\n尽管到目前为止我们一直将花括号之间的代码称为构造函数的体，但需要注意的是，C++\
  \ 正式将体定义为初始化列表。其余方法都是直观的。\n\n`insertButtonPushed()` 方法构造一个 `Entry` 对象并将其插入 `entries`\
  \ 列表。`deleteButtonPushed()` 方法构造一个新的 `Entry` 对象，然后检查该条目是否存在。如果不存在，它返回 `false`，表示没有找到具有相同小时、分、秒的条目进行删除；否则，它删除该条目并返回\
  \ `true`。最后，`fillTextBox()` 方法遍历条目列表并将其写入 `ostring-stream` 对象。在调用 `ostringstream\
  \ str()` 方法获取刚刚创建的字符串后，`fillTextBox` 返回该字符串。\n\nGUI 本身由 `EntriesWindow` 类实现。我们推迟了对自定义\
  \ GUI 实现细节的解释，直到第 15 章。在本章中，我们只是检查事件处理器的概念以及它们是如何提供给自定义 GUI 的。\n\n当创建 `EntriesWindow`\
  \ 对象时，我们向它传递一个 `EventHandlers` 对象。随后 GUI 使用该 `EventHandlers` 对象将 GUI 生成的事件连接到由 `EventHandlers`\
  \ 类提供的事件处理方法。\n\n正如我们在前面的章节中看到的，为了使用 GUI 框架，我们必须创建一个 `QApplication` 对象，并向它传递来自 `main()`\
  \ 函数的参数。\n\n![一条语句。Q Applications、pp、左括号、argc、逗号、argv、右括号、分号。](img/9781284166033_CH14_P868-1.jpg)\n\
  \n接下来，我们创建一个新的 `SortedList`，将其传递到 `EventHandlers` 类的构造函数中。然后，我们将生成的 `EventHandlers`\
  \ 对象传递到 `EntriesWindow` 类的构造函数中。\n\n![三条语句。](img/9781284166033_CH14_P868-2.jpg)\n\
