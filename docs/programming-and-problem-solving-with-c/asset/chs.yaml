  \n创建一个运行程序只需要声明和可执行语句的正确组合。编译器会忽略注释，但它们对任何必须阅读你代码的人都有巨大的帮助。注释可以出现在程序中的任何地方，除了标识符、保留字或字面量常量中间。\n\
  \nC++ 注释有两种形式。第一种是出现在 `/*` 和 `*/` 之间的任何字符序列。编译器忽略它们之间的任何内容，即使跨越多行。这是一个例子：\n\n![一行\
  \ C++ 注释。(images/9781284166033_CH02_PRE52.jpg)\n\n描述\n\n第二种也是更常见的形式以两个斜杠（`//`）开头。\n\
  \n![一行 C++ 注释。(images/9781284166033_CH02_PRE53.jpg)\n\n描述\n\n编写带有完整注释的程序是。注释应该出现在程序的开头，解释它的作用。\n\
  \n![一行 C++ 注释。(images/9781284166033_CH02_PRE54.jpg)\n\n描述\n\n### 2.2 程序构造\n\n我们已经查看了\
  \ C++ 的基本元素：标识符、声明、变量、语句和注释。我们也看了一个完整的程序示例。现在让我们看看如何构造一个程序。如你所知，C++ 程序由函数组成，其中必须有一个\
  \ `main`。程序还有位于任何函数之外的声明。程序的语法模板如下：\n\n![程序的语法模板。(images/9781284166033_CH02_UFIG67-1.jpg)\n\
