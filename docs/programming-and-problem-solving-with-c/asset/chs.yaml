  ```\n\nOutput whiteRows\n```\nSet loopCount2 to 0\nWHILE loopCount2 < 5\n  Output\
  \ whiteRow\n  Increment loopCount2\n```\n\nOutput blackRows\n```\nSet loopCount2\
