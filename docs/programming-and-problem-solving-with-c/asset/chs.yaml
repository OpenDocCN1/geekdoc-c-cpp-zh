  \ C++ 特性。我们并不是建议你这样编写自己的程序！\n\n![一个包含声明、赋值语句和输出语句的程序。(images/9781284166033_CH02_UFIG64-1.jpg)![一个包含声明、赋值语句和输出语句的程序。(images/9781284166033_CH02_UFIG65-1.jpg)\n\
