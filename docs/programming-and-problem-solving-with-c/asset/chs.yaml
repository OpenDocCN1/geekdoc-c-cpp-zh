  \n![一个结构体声明。](img/9781284166033_CH10_576a.jpg)\n\n描述\n\n### 绑定项\n\n当数据明显相关时，它们应该收集到一个记录中。例如，一个名字由名、中间名姓组成。与其将这些值作为独立的变量，不如将它们收集到一个记录中。\n\
