  \n## 3.4 简单算术表达式\n\n现在我们已经查看了声明和赋值，让我们考虑如何对数值类型进行计算。计算是通过表达式进行的。在这里，我们查看最多只有一个运算符的简单表达式，以便详细检查每个运算符。稍后我们将转向结合了多个操作的表达式。\n\
  \n### 算术运算符\n\n表达式可以包含常量、变量和运算符。以下是五个有效表达式的示例：\n\n![有效表达式的示例。](img/9781284166033_CH03_PRE13.jpg)\n\
