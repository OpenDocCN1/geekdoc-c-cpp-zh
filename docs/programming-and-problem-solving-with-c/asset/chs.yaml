  | RS | 记录分隔符 |\n| US | 单位分隔符 |\n| DEL | 删除 |\n\n## 附录 F 程序风格、格式与文档\n\n本文，我们鼓励使用良好的编程风格和文档。尽管您为作业编写的程序可能除了评分的人之外没人会看，但在教室之外，您将编写供他人使用的程序。\n\
  \n实用的程序寿命很长，期间必须进行修改和更新。当需要进行维护工作时，由您或另一个程序员来完成。良好的风格和文档对于另一个程序员理解和处理您的程序至关重要。您也会发现，在没有处理自己的程序几个月后，您会对自己遗忘了多少细节感到惊讶。\n\
  \n### F.1 通用指南\n\n本文程序和片段使用的风格为您开发自己的风格提供了一个良好的起点。我们创建这种风格的目标是使其简单、一致且易读。\n\n风格仅对您的程序的人类读者有用——风格的差异对计算机没有影响。良好的风格包括使用有意义的变量名、注释以及控制结构的缩进，这些都能帮助他人理解和处理您的程序。程序风格最重要的方面可能是一致性。如果程序内部的风格不一致，它就会产生误导性并令人困惑。\n\
  \n\n\n\n\n有时候，你的导师或你工作的公司会为你指定一种特定的风格。当你修改他人的代码时，应该使用他的风格以保持程序内部的一致性。然而，你也会根据所学知识、自己的经验以及个人喜好，形成你自己的、个性化的编程风格。\n\
  \n## F.2 注释\n\n注释是为了让程序更易于理解而包含的额外信息。在代码难以理解的地方，你应该添加注释。但是，不要过度注释。程序中过多的注释会掩盖代码并分散注意力。\n\
  \n在我们的风格中，注释有四种基本类型：头部注释（headers）、声明注释（declarations）、行内注释（in-line）和侧边注释（sidebar）。头部注释出现在程序的顶部，应该包含你的名字、程序的编写日期以及目的。包含描述输入、输出和假设的部分也是很有用的。将头部注释看作读者对你程序的介绍。这里是一个示例：\n\
  \n![一个头部注释块示例。](img/9781284166033_APP_P1232.jpg)\n\n描述\n\n所有用户定义的函数也应该包含头部注释（参见第\
  \ 8 章和第 9 章）。\n\n声明注释伴随着程序中的常量和变量声明。在任何声明标识符的地方，添加一个解释其目的的注释是有帮助的。在本文的程序中，声明注释出现在被声明标识符的右侧。例如：\n\
  \n![一段代码片段。](img/9781284166033_APP_P1232-1.jpg)\n\n描述\n\n注意，对齐注释会让代码看起来更整洁，且不那么分散注意力。\n\
  \n行内注释用于将长段代码拆分成更短、更易理解的片段。这些通常是你的算法设计中的模块名称，尽管你偶尔可能选择包含其他信息。通常情况下，在行内注释周围留空行使其脱出来是一个好主意；例如：\n\
