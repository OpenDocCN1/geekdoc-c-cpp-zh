  \ `prevPtr` 指向上一个节点。\n\n特殊情况有哪些？当列表为空时、当要插入的值小于第一个值，以及当要插入的值大于最后一个值。在进入循环之前检查列表是否为空。当循环退出时，有两种情况：如果当前指针为\
