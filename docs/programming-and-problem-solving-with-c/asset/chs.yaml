  \ `component` 值设置为 58。\n\n\n\n\n考虑本章早些讨论的阶阶和幂算法。在这两种情况下，迭代解决方案都是显而易见且易于设计的。我们对这些问题施加递归解决方案，仅仅是为了演示递归是如何工作的。根据经验法则，如果迭代解决方案更显而易见或更容易理解，请使用它；它的效率更高。在其他一些问题中，递归解决方案更显而易见或更容易设计，例如汉诺塔问题。（事实证明，汉诺塔问题用迭代法解决出奇地困难。）计算机科学的学生应该意识到递归的`power`。如果一个问题的定义本质上是递归的，那么理应考虑递归解决方案。\n\
  \n### 测试与调试\n\n递归在正确使用时是一项强大的技术。然而，当使用不当时，递归可能会导致难以诊断的错误。调试递归算法的最佳方法是从一开始就正确地构建它。为了务实起见，我们在发生错误时提供了一些关于查找方向的提示。\n\
  \n### 测试与调试提示\n\n1. 确保有一个基例（base case）。如果没有基例，算法将继续发出递归调用，直到耗尽所有内存。每调用一次函数（无论是递归还是非递归），系统都会为参数和自动局部变量分配栈空间。如果没有结束递归调用的基例，运行时栈最终会溢出。类似“Stack\
  \ overflow”（栈溢出）的错误消息表示缺少基例。\n\n2. 确保你没有使用 `While` 结构。递归算法的基本结构是 `If` 语句。必须至少情况：递归情况和基例。如果基例什么都不做，则省略\
  \ `else` 子句。然而，选择结构必须存在。如果在递归算法中使用 `While` 语句，通常 `While` 语句内部不应包含递归调用。\n\n3. 与非递归函数一样，除非有理由，否则不要在递归函数内部直接引用全局变量。\n\
  \n4. 与问题大小相关的参数必须是值参数（value parameters），而不是引用参数（reference parameters）。与大小相关的参数通常是表达式。任意表达式只能传递给值参数。\n\
  \n5. 使用你系统的调试器程序（或使用调试输出语句）来跟踪一系列递归调用。检查参数和局部变量的值通常有助于定位递归算法中的错误位置。\n\n![森林中树木的照片。](img/Chapter-opener.jpg)\n\
