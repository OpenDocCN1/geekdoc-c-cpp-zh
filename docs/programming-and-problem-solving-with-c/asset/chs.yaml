  \nDescription\n\n## 14.5 析构函数和拷贝构造函数\n\n操作自由存储中动态数据的类应该提供三个特殊操作：构造函数、析构函数和拷贝构造函数。你熟悉构造函数；现在我们看另外两个。\n\
  \n### 析构函数\n\n析构函数的目的是在 `List` 类对象被销毁时释放动态链表中的节点。如果没有析构函数，链表将被留在那里，已分配但无法访问。析构函数的代码很容易编写。我们只需要遍历列表并删除每个节点。注意，析构函数的定义与构造函数完全一样，只是在类名之前有一个波浪号\
  \ `~`。\n\n![代码片段。](img/9781284166033_CH14_P848-1.jpg)\n\nDescription\n\n### 浅拷贝与深拷贝\n\
  \n当我们引入数组时，说可以将一个数组赋值给另一个，但并不会预期的结果。因为你只是将一个数组的地址复制到另一个，而不是数组的内容。链表也是如此。在执行以下操作后：\n\
  \n![4 条语句。](img/9781284166033_CH14_P848-2.jpg)\n\nDescription\n\n`listOne` 仅仅指向\
  \ `listTwo` 的第一个节点。使用内置的赋值运算符 `=`，将一个类对象赋值给另一个对象只拷贝类成员；它不拷贝类成员指向的任何数据。参见图 14.6。\n\
  \n这种结果被称为**浅拷贝**操作：指针被复制了，但指向的数据没有被复制。如果类成员都不是指针，那么浅拷贝是可以没问题的。在前面的示例中，`length`、`currentPos`\
  \ 和 `lastPtr` 都如你预期的那样被复制。但如果一个或多个成员是动态数据的指针，那么浅拷贝就不会包含它们。指向列表的外部指针（`dataPtr`）被复制到\
  \ `listOne`，而不是它所指向的列表。此外，原本由 `listOne` 对象指向的动态数据已变得无法访问。参见图 14.6。\n\n![一个解释浅拷贝初始状态的图。一组矩形被包含在一个正方形内。](img/9781284166033_CH14_FIGF14_6.jpg)\n\
  \nDescription\n\n图 14.6 浅拷贝（初始状态）\n\n我们需要的是**深拷贝**操作——一种既复制类成员复制指向的数据的操作。\n\n###\
  \ 拷贝构造函数\n```\n\n\n\n\n深拷贝与浅拷贝的问题也出现在另一个上下文中：通过一个类对象初始化另一个类对象。C++ 将初始化定义为以下几种：\n\
  \n1. 变量声明中的初始化：\n   ![2 statements.](img/9781284166033_CH14_P850-1.jpg)\n   Description\n\
  \n2. 将参数的拷贝传递给参数（即按值传递）\n\n3. 将对象作为函数的返回值返回：\n   ![A statement. return, some Object,\
  \ semicolon.](img/9781284166033_CH14_P850-2.jpg)\n\n默认情况下，C++ 使用浅拷贝语义执行此类初始化；换句话说，新创建的类对象是通过对旧对象的逐成员拷贝来初始化的，而没有对类成员所指向的数据进行复制。`name1`\
  \ 和 `name2` 最终都指向相同的三个字符串；它们并没有分别指向字符串的副本。\n\n为了处理这种情况，C++ 支持一种特殊的构造函数，称为拷贝构造函数。在类声明中，它的原型形式如下：\n\
  \   ![A code fragment.](img/9781284166033_CH14_P850-3.jpg)\n   Description\n\n注意，函数原型没有使用任何特殊单词来表示它是拷贝构造函数。你只需要识别这种符号模式：类名后跟一个参数列表，列表中包含一个其自身类型的\
  \ `const` 引用参数：\n   ![A statement. const, Some Class ampersand.](img/9781284166033_CH14_P850-4.jpg)\n\
  \n拷贝构造函数的编写比析构函数更有挑战性。在我们考虑这项任务之前，必须强调每当我们提供析构函数时，提供拷贝构造函数的重要性。假设 `List` 没有拷贝构造函数，并且客户端使用按值传递将一个类对象传递给函数。（记住，按值传递会将参数值的拷贝发送给函数）。在函数内部，参数获得了调用者类对象的拷贝，包括指向列表的私有外部指针。此时，参数和参数都指向同一个列表。当客户端函数返回时，参数的类析构函数被调用，销毁了链表的唯一拷贝。从函数返回后，调用者的链表就消失了！\n\
  \n通过提供拷贝构造函数，我们确保每当发生按值传递时，参数到参数的拷贝都能执行深拷贝。接下来所示拷贝构造函数的实现使用了一种常用的算法来创建一个新链表作为另一个的拷贝：我们设置新列表的外部指针并复制第一个节点。然后我们使用\
  \ `While` 循环遍历原始列表，复制每个节点并将拷贝链接到新列表中。\n   ![A partial program code.](img/9781284166033_CH14_P851-1.jpg)\n\
  \   Description\n\n如果存在拷贝构造函数，默认的初始化方法（逐成员拷贝）就会跳过。相反，每当一个对象通过另一个对象初始化时，拷贝构造函数就会被调用。\n\
  \n而言之，当对象指向自由存储上的动态数据时，默认的赋值和初始化操作可能是危险的。逐成员赋值和初始化只会拷贝指针，而不拷贝所指向的数据。如果一个类分配并释放了动态数据，那么它几乎需要以下系列成员函数来确保动态数据的深拷贝：\n\
  \   ![A code fragment.](img/9781284166033_CH14_P852-1.jpg)\n   Description\n\n##\
  \ 14.6 排序链表\n\n正如我们在基于数组的列表实现看到的，无序列表和排序列表之间唯一的操作是插入和删除操作。链表实现中也是如此。\n\n为了将组件插入到排序列表的正确位置，我们遍历节点直到找到组件所在的位置。由于\
