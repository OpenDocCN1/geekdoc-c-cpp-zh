  \n![在记录内绑定项的代码片段。](img/9781284166033_CH10_57c.jpg)\n\n描述\n\n## 10.5 嵌套记录\n\n我们见过记录组件是简单变量和字符串的示例。记录的组件也可以是另一个记录。组件也是记录的记录被称为`嵌套记录`。\n\
  \n让我们看一个适用于嵌套结构的示例。假设一家小型机械厂维护其每台机器的信息。这些数据包括描述性信息，如编号、机器描述、购买日期和成本。它们还包括统计信息，如停机天、故障率和最后维修日期。表示所有信息的合理方法是什么？首先，让我们观察这种信息的扁平（非嵌套）记录结构。\n\
  \n![带有扁平记录结构的程序代码。](img/9781284166033_CH10_579.jpg)\n\n描述\n\n`MachineRec` 类型有 11\
  \ 个成员。这里的信息如此详细，很难快速感觉到该记录代表什么。我们可以将其重新组织为更合理的层次结构。让我们将信息分为两组：变化的信息和不变化的信息。这里还有两个日期：购买日期和最后维修日期。这些观察建议使用描述日期的记录、描述统计数据的记录，以及一个包含另外两个作为组件的整体记录。以下类型声明反映了这种结构。\n\
