  ## 附录 C 标准库例的选择\n\nC++ 标准库提供了丰富的数据类型、函数和命名常量。本附录仅详细列出了一些较广泛使用的库设施。查看你特定系统的手册是一个好主意，以了解标准库提供了哪些其他类型、函数和常量。\n\
  \n本附录根据程序在访问列表项目之前必须 `#include` 的头文件按字母顺序组织。例如，要使用如 `sqrt` 之类的数学程序，你需要如下所示 `#include`\
  \ 头文件 `cmath`：\n\n![代码片段。](img/9781284166033_APP_P1218.jpg)\n\n描述\n\n### C. cassert\n\
  \n`assert(booleanExpr)`\n\n如果 `booleanExpr` 的值为 `true`，程序继续执行。如果 `booleanExpr` 的值为\
  \ `false`，执行立即终止并显示布尔表达式、所在文件名和行号。如果在 `#include <assert>` 之前定义了 `DEBUG`，所有的 `assert`\
  \ 语句都会被忽略。\n\n### C. cctype\n\n`isalnum(ch)`\n\n如果 `ch` 的值为 `true`，则 `ch` 是字母或数字（`A`–`Z`,\
  \ `a`–`z`, `0`–`9`）。\n\n`isalpha(ch)`\n\n如果 `ch` 的值为 `true`，则 `ch` 是字母（`A`–`Z`,\
  \ `a`–`z`）。\n\n`iscntrl(ch)`\n\n如果 `ch` 的值为 `true`，则 `ch` 是控制字符（ASCII 中中值为 0–31\
  \ 或 127 的字符）。\n\n`isdigit(ch)`\n\n如果 `ch` 的值为 `true`，则 `ch` 是数字字符（`0`–`9`）。\n\n\
  `isgraph(ch)`\n\n如果 `ch` 的值为 `true`，则 `ch` 是非空白打印字符（ASCII 中从 `!` 到 `~`）。\n\n`islower(ch)`\n\
  \n如果 `ch` 的值为 `true`，则 `ch` 是小写字母（`a`–`z`）。\n\n`isprint(ch)`\n\n如果 `ch` 的值为 `true`，则\
  \ `ch` 是可打印字符，包括空格（ASCII 中从 ` ` 到 `~`）。\n\n`ispunct(ch)`\n\n如果 `ch` 的值为 `true`，则\
  \ `ch` 是标点符号。\n\n\n\n\n\n*   非零 (`true`)，如果 `ch` 是标点符号字符（等于 `isgraph(ch) && !isalnum(ch)`）\n\
  *   0 (`false`)，否则\n\n| `isspace(ch)` | |\n| :--- | :--- |\n| 参数: | 一个 `char` 类型的值\
  \ `ch` |\n| 函数返回值: | 一个 `int` 类型的值，其值为： |\n\n*   非零 (`true`)，如果 `ch` 是空白字符（空格、换行、制表符、回车、分页符）\n\
  *   0 (`false`)，否则\n\n| `isupper(ch)` | |\n| :--- | :--- |\n| 参数: | 一个 `char` 类型的值\
  \ `ch` |\n| 函数返回值: | 一个 `int` 类型的值，其值为： |\n\n*   非零 (`true`)，如果 `ch` 是大写字母（‘A’–‘Z’）\n\
  *   0 (`false`)，否则\n\n| `isxdigit(ch)` | |\n| :--- | :--- |\n| 参数: | 一个 `char` 类型的值\
  \ `ch` |\n| 函数返回值: | 一个 `int` 类型的值，其值为： |\n\n*   非零 (`true`)，如果 `ch` 是十六进制数字（‘0’–‘9’,‘A’–‘F’,‘a’–‘f’）\n\
  *   0 (`false`)，否则\n\n| `tolower(ch)` | |\n| :--- | :--- |\n| 参数: | 一个 `char` 类型的值\
