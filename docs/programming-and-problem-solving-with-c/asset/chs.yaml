  \n解决此问题的递归方案要简单得多，但它要求我们进行递归。为了复制原始链表的第一个节点，我们可以分配一个新的动态节点，并将原始节点中的 `component`\
  \ 值拷贝到新节点中。然而，我们还无法填充新节点的 `link` 成员：我们必须等待复制完第二个节点，以便将它的地址存储在第一个节点的 `link` 成员中。同样，在完成第三个节点的拷贝之前，第二个节点的拷贝也无法完成。最后，我们复制原始链表的最后一个节点，并将拷贝节点的\
  \ `link` 成员设置为 `NULL`。此时，最后一个节点将自己的地址返回给倒数第二个节点，由后者将该地址存储在它的 `link` 成员中。倒数第二个节点再将自己的地址返回给它前一个节点，依此类推。当第一个节点将其地址返回给第一个（非递归）调用时，过程完成，产生一个指向新链表的外部指针。\n\
