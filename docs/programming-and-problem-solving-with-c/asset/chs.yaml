  \ Images。\n\n## 第 14 章：动态数据与链表\n\n在第 10 章中，我们查看了指针类型和引用类型。其中一种类型的变量并不包含数据值；它包含一个值的内存地址。我们重点关注了如何创建和操作指向\
  \ C++ 程序中定义的静态数据的指针。然而，指针的真正威力在引入动态数据后变得显而易见。动态数据允许程序对没有规定大小和生命周期的数据结构进行操作。动态数据结构可以在程序执行过程中增长和缩小，为时间和空间上的高效提供了灵活性。我们在这里通过学习链表动态数据结构，强调了动态数据的创建和操作。\n\
  \n## 14.1 动态数据\n\n在第 9 章中，我们描述了 C++ 中的两类程序数据：静态数据和自动数据。任何全局变量都是静态的，显式声明为 `static`\
  \ 的局部变量也是如此。静态变量的生命周期是整个程序的生命周期。相比之下，自动变量（未声明为 `static` 的局部变量）在控制到达其声明处时分配（创建），在控制退出变量声明所在的块时释放（销毁）。\n\
  \n在指针的帮助下，C++ 提供了第三类：`动态数据`。动态变量不是通过普通声明声明的；相反，它们通过两个特殊运算符 `new` 和 `delete` 在执行时被显式分配和释放。当程序需要额外的变量时，它使用\
  \ `new` 来分配该变量。当程序不再需要该变量时，它使用 `delete` 来释放它。因此，动态变量的生命周期是执行 `new` 和执行 `delete`\
  \ 之间的时间。能够在执行时创建新变量的优势是显而易见的：当数据结构的性质允许其增长和缩小时，我们可以根据其需求完美地匹配内存分配。\n\n### 分配动态数据\n\
  \n`new` 操作有两种形式，一种用于分配单个变量，另一种用于分配数组。以下是语法模板：\n\n![标记为分配表达式的语法。](img/9781284166033_CH14_P820-1.jpg)\n\
  \n描述\n\n第一种形式用于创建一个类型为 `DataType` 的单个变量。第二种形式创建一个元素类型为 `DataType` 的数组；所需的数组元素数量由\
  \ `IntExpression` 给出。\n\n这是一个展示了 `new` 操作两种形式的示例：\n\n![带有解释的代码集。](img/9781284166033_CH14_P821-1.jpg)\n\
  \n描述\n\n通常情况下，`new` 运算符做两件事：它创建一个指定类型的未初始化变量（或数组），并返回该变量的地址（或数组的基地址）。正是这个地址被存储在指针变量中。然而，如果计算机系统没有了存储动态数据的空间，程序将带有一个错误消息终止。在第\
  \ 16 章中，我们展示了如何测试这种状况并防止程序终止。\n\n由 `new` 创建的变量被认为存在于`free store`（或 `heap` 堆）上，这是为动态变量预留的内存区域。`new`\
  \ 运算符从空存储中获取一块内存，正如我们将看到的，`delete` 运算符将其返回空空存储。\n\n动态变量是无名的，不能直接寻址。相反，它必须通过 `new`\
  \ 运算符返回的指针间接寻址。以下是创建动态数据然后通过指针访问数据的示例：\n\n![代码片段。](img/9781284166033_CH14_P821-2.jpg)\n\
  \n描述\n\n**图 14.1** 显示了执行此代码段后的内存情况。注意 `patientPtr` 指向的结构体的内容。\n\n```\npatientPtr\
  \ = new Patient;\npatientPtr->name = \"Smith\";\npatientPtr->age = 45;\ndelete patientPtr;\n\
  patientPtr = NULL;\n```\n\n### 删除动态数据\n\n动态数据在不再需要时应该被销毁。内置运算符 `delete` 用于销毁。`delete`\
  \ 操作有两种形式：一种用于变量，另一种用于数组。\n\n![标记为释放的语法。](img/9781284166033_CH14_P822-1.jpg)\n\n\
  描述\n\n使用之前的示例，我们可以通过以下语句释放 `intPtr`、`patientPtr` 和 `patientArray` 指向的动态数据：\n\n![带有解释的代码集。](img/9781284166033_CH14_P822-2.jpg)\n\
  \n描述\n\n执行这些语句后，`intPtr`、`patientPtr` 和 `patientArray` 指向的值是未定义的；也就是说它们可能包含已释放的数据。在再次使用这些指针之前，必须为它们分配新值（即向它们存储新地址）。\n\
  \n```\ndelete intPtr;\ndelete patientPtr;\ndelete[] patientArray;\n```\n\n在使用 `delete`\
  \ 运算符时，应该记住两个规则：\n\n1.  对 `NULL` 指针应用 `delete` 没有害；该操作没有任何效果。\n2.  除了规则 1 外，`delete`\
  \ 运算符只能应用于之前从 `new` 运算符获得的指针值。\n\n记住第二个规则非常重要。如果你将 `delete` 应用于一个不在空存储中的任意内存地址，结果是未定义的，并且可能变得非常糟糕。\n\
  \n`new` 运算符让你仅在需要时创建变量。当你完成对动态变量的使用时，应该 `delete` 它。在不再需要时保留动态变量适得其反的——这种情况被称为 `内存泄漏`。如果允许内存泄漏频繁发生，你可能会耗尽内存。\n\
  \n让我们另一个另一个动态数据的示例。\n\n![代码片段。](img/9781284166033_CH14_P823-2.jpg)\n\n描述\n\n以下是对每条语句影响的更详细描述：\n\
