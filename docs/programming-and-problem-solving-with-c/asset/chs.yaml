  \n![书的第一章，标题为“编程与问题解决概述”。背景图显示森林中的树。](img/Chapter-opener.jpg)\n\n章节开启：© Joost Lagerweij/EyeEm/Getty\
  \ Images.\n\n## 第 1 章\n编程与问题解决概述\n\n## 1.1 编程概述\n\ncom•put•er ![inline](img/i22-1.jpg)\
  \ n. 通常被归于 (1646)：进行计算的；特指一种可以存储、检索和处理数据的可电子设备。^(1)\n\n对于一个在几十年内改变了生活方式的事物来说，定义如此简洁！计算机影响了生活的各个领域。这是一本教你如何编程的书。\n\
  \n### 什么是编程？\n人类的行为和思想大部分以逻辑序列为特征。从婴儿时期起，你就在学习如何行动、如何做事。\n\n你每天做的很多事情都是自动完成的。幸运的是，你不需要意识地思考每一个步骤，即使是手翻页这样简单的过程：\n\
  \n1. 抬手。\n2. 将手移到书的右侧。\n3. 抓住页面的右上角。\n4. 手从右向左移动，直到页面处于你可以阅读另一面内容的位置。\n5. 松开页面。\n\
  \n你很多时候在无意识的情况下做的事情，曾经都必须逐步学习。在更广泛的尺度上，数学通常依赖逻辑步骤序列来解决问题。大规模生产涉及按特定顺序进行的操作。我们的整个文明建立在事物和行为的顺序之上。\n\
  \n我们通过一个称为编程的过程来创建这种顺序。此本书关注的是计算机的编程。\n\n就像音乐会节目列出演奏者表演曲目的顺序一样，计算机程序 也列出了计算机执行的步骤序列。从现在开始，当我们使用“编程”和“程序”这两个词时，指的是计算机编程和计算机程序。\n\
  \n计算机允许我们比手工更快、更准确地完成任务——如果我们能手工完成的话。要使用这个强大的工具，我们必须指定想要做什么以及完成这些任务的顺序。我们通过编程来实现这一点。\n\
  \n### 我们如何编写程序？\n\n\n\n\n\n计算机并不智能。它不能自己分析问题并提出解决方案。相反，必须由人类（程序员）来分析问题，制定解决问题的指令，然后将其传达给计算机。一旦我们为计算机写好了解决方案，它就能非常快速且一致地重复该解决方案。计算机将人们从重复且无聊的任务中解放出来。\n\
  \n为了编写供计算机遵循的指令，我们必须经过两个阶段的过程：解决问题和实现（参见图 1.1）。\n\n![编程过程中的各个阶段。](img/9781284166033_CH01_FIGF01.jpg)\n\
  \n图 1.1 编程过程\n\n描述\n\n## 问题解决阶段\n\n1.  分析与规范：理解（定义）问题以及解决方案必须完成的任务。\n2.  通用解决方案（算法）：使用人类语言（如英语）和数学符号的组合来制定解决问题的指令。\n\
  3.  验证：严格按照指令执行，查看解决方案是否真的解决了问题。\n\n## 实现阶段\n\n1.  具体解决方案（程序）：将算法翻译成编程语言。\n2.  测试：让计算机遵循指令，然后手动检查结果。如果发现错误，分析程序和算法以确定错误根源，然后进行修正。\n\
  \n一旦写好程序，它就会进入第三个阶段：维护。\n\n## 维护阶段\n\n1.  使用：使用该程序。\n2.  维护：修改程序以满足不断变化的需求，或修正在使用过程中出现的任何错误。\n\
  \n这一系列阶段被称为软件开发的瀑布型模型。还存在其他开发模型，适用于不同的情况。例如，螺旋模型的通用解决方案开启编程过程。理解和分析问题所花费的时间比图 1.1\
  \ 所示的要得多。这些步骤是编程过程的核心。\n\n如果我们对计算机程序和算法的定义看起来相似，是因为所有的程序都是算法。程序仅仅是为计算机编写的算法。\n\n\
  算法是对解决问题必须采取的动作的口头或书面描述。我们每天都在使用算法。食谱、说明和方向指南都是非程序的算法示例。\n\n当你启动汽车时，你遵循一个分步骤的程序。算法可能看起来像这样：\n\
  \n1.  踩刹车踏板。\n2.  确保变速箱在 P（驻档）。\n3.  按下启动按钮。\n4.  如果引擎没有启动，等待五秒并重复步骤 1 到 3，但重复不超过五次。\n\
  5.  如果汽车没有启动，拨打修理店。\n\n如果没有步骤 4 中的“但重复不超过五次”这个短语，你可能会尝试启动汽车。为什么呢？因为如果汽车出了问题，重复步骤\
  \ 1 到 3 并不会让它启动。这种无休止的情况被称为无限循环。如果我们从步骤 4 中漏掉“但重复不超过五次”这个短语，我们拥有的就不是算法。算法必须在所有可能的情况下在有限的时间内终止。\n\
  \n假设程序员需要一种算法来确定员工的周薪，在该企业中加班费率是普通薪资率的 1.5 倍。该算法反映了手动操作的过程：\n\n1.  查询员工的薪率。\n2.\
  \  确定本周的工作小时数。\n3.  如果工作小时数小于或等于 40 小时，薪资为 `hours × pay rate`。\n4.  如果工作小时数大于 40\
  \ 小时，薪资为 `40 × pay rate + (hours – 40) × pay rate × 1.5`。\n\n计算机遵循的步骤通常与你手动计算时使用的步骤相同。\n\
  \n在开发出通用解决方案后，程序员会测试算法，手动执行每一步。如果算法不起作用，程序员就会重复解决问题的过程，提出另一个算法。通常第二个算法只是第一个算法的变体。当算法正确后，程序员将其翻译成编程语言。本书使用的是\
  \ C++ 编程语言。\n\n## 什么是编程语言？\n\n编程语言是遵循严格语法规则的简化英语形式（带有数学符号）。英语具有歧义性，意味着同一句话可能有多种含义。计算机程序必须有唯一的含义，因为计算机并不“懂”我们的意思。编程语言由于限制了词汇和语法，是不歧义的。编程语言的简单性可能要求你编写极其详细的指令。将算法翻译成编程语言被称为编码。翻译的产物——程序通过在计算机上运行（执行）来进行测试。如果程序未能产生预期的结果，程序员必须对其调试——即确定问题所在，然后修改程序甚至是算法进行修复。编码和测试算法的结合被称为实现。\n\
  \n实现算法没有单一的方法。例如，一种算法可以被翻译成多种编程语言。当两个人将同一个算法翻译成同一种编程语言时，他们可能会产生不同的实现，因为编程语言允许算法编码具有灵活性（参见图\
  \ 1.2）。由于这种灵活性，人们形成了自己的编码风格。在本书中提供了良好编程风格的建议。\n\n![算法实现的差异](img/9781284166033_CH01_FIGF02.jpg)\n\
  \n图 1.2 实现的差异\n\n描述\n\n尝试直接从问题定义跳到程序编码是很有吸引力的（参见图 1.3）。然而，这种捷径实际上会花费更多的时间和精力。在开始编码之前开发算法有助于管理问题、保持思路清醒并避免错误。如果你不先想清楚算法，你将花费大量的额外时间来调试和修改程序。\n\
  \n![编程过程中的捷径](img/9781284166033_CH01_FIGF03.jpg)\n\n图 1.3 编程捷径？\n\n描述\n\n\n\n\n\
  一旦程序投入使用，就可能需要修复在使用过程中发现的错误，或者根据新的用户需求对程序进行更改。每当修改程序时，都必须针对程序的这些部分重复解决问题和实现阶段。编程过程中的这一阶段被称为**维护**，它占据了大多数程序工作的大部分。一个程序可能在几个月内就能实现，但随后会被维护多年。因此，仔细地开发初始问题的解决方案和程序实现是一项具有成本效益的时间投资。\n\
  \n由于维护通常涉及并非编写首次实现的程序的程序员，因此 `documentation`（文档）是编程过程中的重要组成部分。文档包括对所解决问题的书面说明和解决方案的组织、嵌入程序内部的注释，以及描述如何使用程序的用户手册。维护者必须能够阅读并理解代码。\n\
  \n在运行程序时，你必须给计算机提供的数据。`Information`（信息）是任何可以交流的知识，包括抽象的想法和概念，如“地球是圆的”。`Data`（数据）是以计算机可以使用的形式的信息——例如，构成地球半径与其体积及表面积关系公式的数字和字母。编程过程的一部分涉及决定如何将问题中的信息表示为数据。\n\
  \n快速检查题的答案在本章末尾。\n\n[1] 摘自 Merriam-Webster. 1994. “Merriam-Webster’s Collegiate\
  \ Dictionary, tenth edition.” Merriam-Webster Inc.\n\n[2] 较的编程语言使用美国信息交换标准代码 (ASCII)\
  \ 来表示英语字母和其他符号。每个 ASCII 字符存储在单个字节中。较新的语言使用名为 Unicode 的标准，它包含了许多其他语言的字母表。单个 Unicode\
  \ 字符在计算机内存中占用两个字节。通过程序员的一些额外工作，`C++` 也可以处理 `Unicode`。\n\n## 1.2 计算机是如何运行程序的？\n\n\
  在计算机中，程序所有的指令和数据都是以二进制代码存储和使用的——即以 1 和 0 的字符串形式。这种方案使得计算机能够将其自身的指令作为一种数据进行处理。\n\n\
  当计算机最初开发时，唯一的编程语言是构建在每台机器中的原始指令集，即 `machine language`（机器语言），或机器码。\n\n尽管大多数计算机执行相同类型的操作，但它们的设计者为指令选择了不同的二进制代码。因此，一台计算机的机器码与另一台计算机的不同。\n\
  \n当程序员使用 `machine language` 进行编程时，他们必须输入各种指令的二进制代码，这是一个枯燥且容易出错的过程。此外，程序难以阅读和修改。随着时间的推移，开发了\
  \ `assembly languages`（汇编语言）来减轻程序员的工作。\n\n汇编语言中的指令以一种易于记忆的形式存在，称为助记符（读作 nee-MAHN-ik）。加法和减法的典型指令可能像所示：\n\
  \n![汇编语言及其含义示例。](img/9781284166033_CH01_EQ1.jpg)\n\n[Description]\n\n虽然汇编语言更便于人类操作，但计算机无法直接执行它。计算机科学的根本发现之一是，由于计算机可以将其自身的指令作为数据处理，因此可以编写一个程序将汇编语言指令翻译成机器码。\n\
  \n这样的程序被称为 `assembler`（汇编器）。该名称来源于汇编器所做的大部分工作是在表中查找指令片段，以找到对应的二进制代码（例如 `ADD = 1001`、`R1\
  \ = 001`、`R3 = 011`、`R5 = 101`），然后将这些指令的二进制片段组合成一条完整的机器语言指令（`1001 001 011 101`）。汇编器还按照指定的顺序将指令组合在一起，创建一个完整的程序。\n\
  \n汇编语言是向正确方向迈的一步，但它仍然让我们从机器指令的角度思考。最终，计算机科学家开发了高级编程语言。这些语言比汇编语言更容易使用，因为它们更接近英语和其他自然语言（见图\
  \ 1.4）。\n\n![抽象层次级。](img/9781284166033_CH01_EQ1.jpg)\n\n图 1.4 抽象层次级\n\n[Description]\n\
  \n一种名为 `compiler`（编译器）的程序将高级语言（如 `C++`）翻译成机器语言。用高级语言编写的程序被称为 `source program`（源程序）。对于\
  \ `compiler` 来说，`source program` 只是输入数据。它将 `source program` 翻译成名为 `object program`（目标机器）程序。如果程序存在错误，编译器会生成指示错误性质和位置的消息。\n\
  \n![用高级语言编写的程序可以在不同的系统上编译。](img/9781284166033_CH01_EQ1.jpg)\n\n图 1.5 高级语言允许在不同系统上编译程序\n\
  \n[Description]\n\n使用标准化高级语言的优点是它们允许你编写可移植（与机器无关）的代码。正如图 1.5 强调的，同一个 `C++` 程序可以在不同的机器上使用，而为\
  \ Intel 计算机编写的汇编程序无法在 Arm 计算机上运行。\n\n理解编译和执行是两个不同的过程很重要。编译期间，计算机运行 `compiler` 程序。执行期间，`object\
  \ program` 被加载到计算机内存单元中，替换 `compiler` 程序。计算机随后运行 `object program`，执行程序指示的操作。\n\n\
  ![程序的编译和执行过程。](img/9781284166033_CH01_EQ1.jpg)\n\n图 1.6 编译与执行\n\n[Description]\n\
  \n### 编程语言可以编写什么种指令？\n\n编程语言中的指令反映了计算机可以执行的操作：\n\n*   可以将数据从一个地方传输到另一个地方。\n*   计算机可以从输入设备（例如键盘或鼠标）输入数据，并向输出设备（例如屏幕）输出数据。\n\
  *   计算机可以将数据存储到内存和辅助存储中并从中检索数据（我们将在下一节讨论这些部分）。\n*   计算机可以比较两个数据值的相等性或不等性。\n\n\n\n\
  \n*   计算机可以非常快速地执行算术运算（例如加法和减法）。\n\n编程语言要求使用特定的控制结构将算法表示为程序。在大多数编程语言中，结构化语句（指令）有五种基本方式：顺序执行、条件选择、循环、子程序和并发（参见图\
  \ 1.7）。\n\n![编程语言中的各种控制结构。](img/9781284166033_CH01_FIGF07a.jpg) ![编程语言中的各种控制结构。](img/9781284166033_CH01_FIGF07b.jpg)\n\
  \n描述\n\n图 1.7 编程的基本控制结构\n\n*   `sequence`（顺序）是一系列连续执行的语句。\n*   `selection`（选择）是条件控制结构，根据某些条件执行不同的语句。\n\
  *   `repetitive`（重复）控制结构被称为 `loop`（循环），在满足某些条件时重复执行语句。\n*   `subprogram`（子程序）允许我们通过将程序分解为更小的单元来构建。\n\
  *   `concurrency`（并发）允许多个操作同时发生。\n\n这些结构化语句的每种方式都控制计算机执行语句的顺序，这就是为什么它们被称为控制结构的原因。\n\
  \n想象你正在开车。在笔直道路上行驶就像遵循一系列 `sequence`（顺序）指令。当你来到一个路口时，你必须决定走哪条路，然后选择路口的其中一个分支。这就是计算机在程序中遇到\
  \ `selection` 控制结构（也称为 `branch` 分支）时所做的。有时你必须绕几圈街才能找到停车位。计算机在程序中遇到 `loop`（循环）时也会做类似的事情。\n\
  \n`subprogram`（子程序）是由多个步骤组成的过程。例如，每天你都会按照某个程序从家去公司。那么，如果有人给你提供会议指路，说“去办公室，然后向西走四个街”，而没有指定去办公室的所有步骤，这也就是合逻辑。子程序简化了编写大型程序的任务。\n\
  \n`concurrency`（并发）就像是你派某去面包店买生日蛋糕，而你去派对商店买装饰品。今天大多数计算机实际上由多个处理器（称为 `cores` 核）组成，这意味着程序可以将问题的独立部分分开同时运行，从而更快地完成。\n\
  \n### 什么是软件维护？\n\n在程序的生命周期中，维护阶段占据了典型程序存在的大部分。程序员会开发程序来满足一组规范，但无法预见它将来如何被使用。如果初始实现不足以支持某些未来的用途，则需要新的程序员团队来修改程序。在许多这样的修改后，代码可能会变得非常复杂，导致难以识别某些原始指令的目的。\n\
  \n不断尝试扩展程序往往会产生错误，因为程序员未能理解程序的早期更改与新更改之间将如何相互作用。在某些情况下，测试未能修改修改程序发布之前发现这些错误，而是由用户发现了。这时，修复\
  \ bug 变成了一项新的维护任务，通常执行得非常匆忙，因为用户急切要求软件正常工作。结果是代码更难理解。随着时间的推移，情况可能变得糟糕到以至于每次修复错误的尝试都会产生新的错误。尽管最好的解决方案可能是从头开始，但对于大型软件包来说，完全重写的成本可能巨大到让公司无法负担，即使用户正在转向竞争对手。\n\
  \n3\n\n## 1.3 计算机内部结构？\n\n你可以在不了解计算机的情况下学习编写和运行程序。但如果你了解计算机的组成部分，就能更好地理解指令的影响。\n\
  \n大多数计算机具有五个组件：`memory unit`（存储单元）、`arithmetic/logic unit`（算术单元）、`control unit`（控制单元）、`input\
  \ devices`和 `output devices`。FIGURE 1.8 是计算机组件的示意图。\n\n![计算机的组件。](img/9781284166033_CH01_FIGF08.jpg)\n\
  \n图 1.8 计算机的基本组件\n\n描述\n\n`memory unit`（存储单元）由存储单元组成，每个单元都可以保存数据。每个单元都有一个 `address`（地址），程序向其存储数据或从中检索数据时会引用。这些存储单元被称为\
  \ `memory locations`（内存单元）。FIGURE 1.9 存储单元持有数据和指令。\n\n计算机执行指令的部分被称为 `central processing\
  \ unit` (`CPU`)。`CPU` 通常具有两个组件。`arithmetic/logic unit` (`ALU`) 执行算术运算（加、减、乘、除）和逻辑运算（比较两个值）。`control\
  \ unit` 指导其他组件的操作，以便按正确的顺序执行。\n\n![内存的视觉表示。](img/9781284166033_CH01_FIGF09.jpg)\n\
  \n图 1.9 内存\n\n描述\n\n为了使计算机有用，必须有将数据输入和输出的方法。输入输出设备 (I/O devices) 处理这些操作。键盘和触摸板是常见的输入设备。显示屏是常见的输出设备，打印机也是。\n\
  \n在大多数情况下，计算机只是在内存中移动和组合数据。许多类型的计算机主要区别在于其内存的大小、检索数据的速度、移动或组合数据的效率，以及 I/O 设备的限制。\n\
  \n当程序执行时，计算机对每条指令执行一系列步骤，称为取指-执行周期：\n\n1.  `control unit` 从内存中检索下一条机器指令 (`fetch`)。\n\
  2.  指令被翻译成控制信号 (`decode`)。\n3.  控制信号告诉相应的单元（`arithmetic/logic unit`、`memory`、`I/O\
  \ device`）执行指令 (`execute`)。\n4.  根据需要保存计算结果 (`write`)。\n5.  从第 1 步开始重复序列。\n\n\n\n\
  \n\n计算机可以连接各种`peripheral devices`。`auxiliary storage device`（或称为辅助存储设备）在计算机的主内存之外存储数据和程序。典型的辅助存储设备是`disk\
  \ drives`和`flash memory`。硬盘驱动器使用由磁性材料制成的薄盘片。包含电磁铁的读/写头在旋转的盘片上移动，以盘片表面磁化点的形式检索或记录数据。闪存内存是一个包含电子开关的硅基芯片，这些开关可以被锁定在开启或关闭状态，分别代表二进制的\
  \ 1 或 0。与普通内存不同，硬盘和闪存内存在断电后仍能保留其内容。\n\n外围设备的其他示例还包括：\n\n*   扫描仪，将纸上的图像转换为数据\n* \
  \  DVD（数字多功能光盘），为存储视频而开发\n*   WiFi 射电，将计算机连接到无线网络\n*   音频扬声器和耳机（有线和无线式）\n*   麦克风和电子乐器\n\
  *   游戏控制器\n*   数码相机\n\n所有这些物理组件合称为`hardware`。控制硬件的程序被称为`software`。硬件的设计通常是固定的；软件则很容易改变。事实上，软件易于操作的特性正是计算机成为如此多功能、强大工具的原因。\n\
  \n除了我们编写或运行的程序外，某些软件对于使计算机可用至关重要。`operating system`简化了`user/computer interface`，使人类更容易操作机器并高效地管理计算机资源的使用。它执行程序、管理屏幕上的窗口、优化辅助存储、保护计算机免受授权的使用，并控制与网络的连接。\n\
  \n![用户和计算机界面。](img/9781284166033_CH01_FIGF10.jpg)\n\n图 1.10 用户/计算机界面\n\n虽然有时会使用单机（独立式）计算机，但大多数计算机都连接到网络上。在局域网（LAN）中，计算机通过有线或无线路由器连接，并且必须距离较近，例如在同一建筑内。在广域网（WAN）中，计算机在地理上可以相远。最著名的广域网是互联网，它最初用于大学、企业和政府机构交换研究信息。随着万维网（一个访问网页的链接系统）的建立，互联网的普及呈爆炸式增长。\n\
  \n内存单元也被称为`RAM`，是随机存取存储器的缩写（之所以是因为我们可以随机访问任何位置）。\n\n## 1.4 计算专业职业中的伦理与责任\n\n每个职业都根据一套伦理规范运行，这有助于定义从业人员的责任。例如，医疗专业人员有伦理责任对患者信息保密。工程师必须保护公众和环境免受其工作可能造成的伤害。作家在伦理上负有不抄袭的义务。\n\
  \n计算机会以戏剧的方式影响人类和环境。因此，它在伦理问题上挑战着社会。一些现有的伦理实践适用于计算机，而其他情况则需要新的规则。在某些情况下，决定什么符合伦理将取决于你。\n\
  \n### 数据盗版\n\n数字数据很容易复制。但就像物理书籍一样，数据通常受版权保护——未经创作者许可复制数据是非法的。这种复制行为被称为`data piracy`。\n\
  \n版权法的存在是为了保护书籍和艺术的创作者，以便他们获利。一部大型电影或电脑游戏的开发可能花费数百万美元，这反映在购买价格中。录制良好的音乐制作成本也很高。如果人们制作未经授权的副本，创作者就得不到补偿。\n\
  \n数据盗版者有时会以他们只是为了自己使用复制了一份为借口为盗窃行为合理化。毕竟，他们并不是在销售大量的盗版拷贝。尽管如此，他们剥夺了创作者对其工作的报酬。\n\
  \n计算专业人员有伦理义务不参与数据盗版，并努力阻止其发生。你绝不要在未经许可复制受保护的内容，这通常只涉及一小笔费用。\n\n这条规则不仅限于复制受版权的内容；它还包括对他人全部或部分代码的抄袭。如果有人允许你复制他们的代码，那么你应该像任何负责任的作家一样，通过引用对该人员表示感谢。\n\
  \n### 数据隐私\n\n计算机能够编译包含人员、公司等有用信息的数据库。这些数据库允许雇主发放工资支票、允许银行在任何分行兑换客户支票、允许政府征税以及允许大众零售商发送垃圾邮件。尽管我们可能并不关心数据库的每种用途，它们通常具有积极益处。然而，它们也可以被用于负面途径。\n\
  \n例如，获得某州机动数据库权限的汽车贼可以打印一份带有所有者地址的昂贵车型“购物清单”。工业间谍可能会从一家公司偷取数据并卖给竞争对手。尽管这些显然是违法行为，但计算专业人员还面临其他不那么明确的情况。\n\
  \n假设你的工作包括管理公司的工资数据库。你可能会忍不住想查看它看看自己的薪水与其他人的对比——但这是对同事隐私的不伦理侵犯。任何关于个人的、不属于明确公开的信息都应被视为机密。公共信息的例子是公司网页上的电话号码。私有信息是指在提供时已理解其将仅用于特定用途的数据，例如贷款申请表上的数据。\n\
  \n计算专业人员有责任避免利用他们对机密数据的特殊访问权限。专业人员还有责任保护这些数据免受未经授权的访问。保护数据可以涉及简单的措施，如使用难以猜测的密码或实施更复杂的措施如文件加密。\n\
  \n### 计算机资源的使用\n\n计算机是一种特殊的资源，因为工作中的计算机和空闲的计算机之间没有显著的物理差异。相比之下，汽车在工作时是运动的。因此，未经许可使用汽车需要物理夺取——即偷窃。然而，人们可以在不物理夺取的情况下通过使用其时间和资源未经授权使用计算机，这通常被称为黑客行为。\n\
  \n\n\n\n\n黑客可能带有恶意意，例如窃取数据或使用被入侵的计算机来隐藏身份以实施其他犯罪。一种具有破坏性的程序是病毒——一种能够自我复制的程序，其目标是传播到其他计算机，通常通过电子邮件或共享文件进行。某些病毒具有很强的破坏性。已经发生过病毒导致数百万美元数据损失的事件。与通过用户之间的接触传播的病毒不同，蠕虫会利用计算机安全中的漏洞，劫持该计算机并在互联网上搜索具有相同漏洞的其他计算机。当一台计算机被接管并用于其他用途（例如发送虚假的社交媒体帖子）时，它就被称为僵尸。\n\
  \n像这类有害程序统称为恶意软件。由于垃圾邮件已占全球电子邮件流量的大部分，某些病毒已从受害者那里勒索钱财，僵尸也被用于关闭互联网的部分区域，恶意软件对计算行业的影响是巨大的。\n\
  \n计算专业人员绝不应该参与黑客活动。我们也有责任通过观察异常活动迹象、在不引入安全漏洞的情况下编写应用程序、在发布安全更新时安装更新、检查文件是否有病毒等，来帮助保护我们使用的计算机。\n\
  \n## 软件工程\n\n人类在生活的许多方面已经极度依赖计算机。这种依赖源于对计算机运行可靠的认知；即它们在大多数时间里都能运行正常。然而，计算机的可靠性取决于编写其软件时所付出的精力。\n\
  \n程序中的错误可能会导致严重的后果，如下几个涉及软件错误的真实案例所示所示：\n\n*   F-18 战斗机控制软件中的一个错误导致其在第一次飞越赤道时发生了翻转。\n\
  *   一次火箭发射失去控制，火箭不得不爆炸，因为在它的控制软件中将点号写成了逗号。\n*   一台放射治疗机器害死了几名患者，因为软件错误导致操作员在过快输入某些命令时，机器以全功率运行。\n\
  \n即使软件被用于不那么关键的情况下，错误也会产生重大影响。此类错误的示例包括：\n\n*   你的文字处理程序中的错误导致你的期末论文在截止前几小时丢失。\n\
  *   统计程序中的错误导致科学家得出错误的结论，并发表了一篇后来必须撤回的论文。\n*   报税程序中的错误产生了错误的纳税申报表，导致纳税人被罚款。\n\n\
  程序员有责任开发无错误的软件。用于开发正确软件的过程被称为软件工程。\n\n软件工程有许多方面。本章开头描述的软件生命周期概述了软件开发的阶段。每个阶段都使用不同的技术，我们在本文中讨论了其中许多内容。在第\
  \ 4 章中，我们介绍了开发正确算法的方法论。我们在每一章中都会讨论测试和验证程序的策略。我们使用一种能够让我们编写可读的、组织良好的程序的编程语言，等等。软件工程的某些方面（如为程序开发形式的、数学规范）超出了本文的范范围。\n\
  \n## 1.5 解决问题的技巧\n\n你每天都在解决问题，但通常没有意识到你正在经历的过程。在学习环境中，你通常会获得所需的大部分信息：清晰的问题陈述、必要的输入和要求的输出。在现实生活中，这个过程并不总是那么简单。你经常需要自己定义问题，然后决定你需要哪些信息来处理以及结果应该是怎样的。\n\
  \n在理解并分析问题之后，你必须想出一个解决方案——算法。早些我们把算法定义为有限时间内解决问题的程序。尽管你一直在与算法打交道，但大部分经验是在遵循它们。你遵循食谱、玩游戏、组装玩具、吃药。相反，在编程的问题解决阶段，你将设计算法。这要求你意识到自己用来解决问题的策略。\n\
  \n### 提问\n\n如果你口头接到一项任务，你会提问——什么时候？为什么？在哪里？——直到你清楚自己需要做什么。如果你的指令是书面的，你可能会在页边空白写下问题，或以其他方式指示任务尚不明确。你的问题可能会在后面的段落中得到解答，或者你可能必须与给你任务的人讨论。\n\
  \n以下是你在编程背景下可能会问的一些问题：\n\n*   我需要处理什么——也就是说，我的数据是什么？\n*   数据项是什么样子的？\n*   有多少数据？\n\
  *   我将如何知道我已经处理了所有数据？\n*   我的输出应该是什么样子的？\n*   过程将重复多少次？\n*   可能会出现什么特殊情况？\n\n# 寻找熟悉的事物\n\
  \n永远不要发明轮子。如果你以前解决过类似的问题，只需重复它。人们擅长识别相似的情况。在编程中，某些问题会以不同的形式反复出现。优秀的程序员会识别出他们解决过的子任务并直接使用。例如，寻找每日最高和最低温度与寻找考试的最高和最低分是同一个问题（参见图\
  \ 1.11）。\n\n![寻找熟悉的事物](img/9781284166033_CH01_FIGF11.jpg)\n\n# 寻找熟悉的事物\n\nDescription\n\
  \n### 通过类比解决\n\n通常一个问题会让你想起以前见过的类似问题。如果你记得如何解决另一个问题，你可能会发现解决手头的问题变得更容易。换说，在两个问题之间建立类比。例如，艺术课上透视投影问题的解决方案可能帮助你计算映射程序中点与点之间的距离。当你处理新问题时可能会可能会与旧问题不同之处，但这些通常是你可以逐一处理的。\n\
  \n类比实际上是寻找熟悉事物策略更广泛的应用。当你尝试为解决问题寻找算法时，不要把自己局限于面向计算机的解决方案。退一步，尝试获得问题的全局视图。不要担心你的类比并不完全匹配——使用类比的唯一理由是它给你了一个起点（参见图\
  \ 1.12）。最好的程序员是那些在解决各种问题方面经验丰富的人。\n\n![基于其他事物的类比](img/9781284166033_CH01_FIGF12.jpg)\n\
  \n### 类比\n\nDescription\n\n### 手段-目标分析\n\n\n\n\n通常，起始状态和结束状态是给定的；问题在于识别能够让你从一个状态到达另一个状态的动作。假设你想从马萨诸塞州的波士顿去往德克萨斯州的奥斯汀。你知道起始状态（波士顿）和结束状态（奥斯汀）。哪些动作可以让你从一个地方到达另一个？你可以飞行、开车、坐公交等。你的选择取决于具体情况。如果你赶时间，可能会选择飞行。\n\
  \n一旦你确定了整体策略，就必须处理细节。建立中间目标可能会有所帮助。假设从芝加哥飞奥斯汀有一个非常便宜的直航班。你可能决定将旅程分为几段：波士顿到芝加哥，然后从芝加哥到奥斯汀。你的中间目标是从波士顿到达芝加哥。现在你只需要检查实现这一中间目标的手段（参见图\
  \ 1.13）。\n\n![手段分析分析的示例。](img/9781284166033_CH01_FIGF13.jpg)\n\n图 1.13 手段分析\n\n\
  描述\n\n手段分析的整体策略是定义目标，然后分析你在这些目标之间移动的手段。这个过程很容易转化为编程。你首先写下输入是什么，输出应该是什么。然后，你考虑计算机可以执行的动作，并识别将数据转换为结果的动作。\n\
  \n# 分治法\n\n我们经常将大问题分解成更容易处理的小单元。打扫整个房子看起来可能难以负担；但一个接一个地扫房间似乎要容易应对得多。如果我们有朋友帮助我们，分工合作会让整个任务进展快得多（并行处理）。同样的原理也适用于编程：我们可以将一个大问题分解成可以单独解决的小块部分（参见图\
  \ 1.14）。第 4 章中描述的函数分解和面向对象的编程方法论基于分治原理。\n\n![分治策略。](img/9781284166033_CH01_FIGF14.jpg)\n\
  \n图 1.14 分治法\n\n描述\n\n# 积木法\n\n处理大问题的另一种方法是看是否存在针对问题较小部分的解决方案。可能可以通过组合这些解决方案来解决大部分大问题。这种策略是“寻找熟悉事物”和“分治法”的结合。你观察大问题，发现它可以被分解为已经有解决方案的小问题。解决大问题只需将现有的解决方案组合在一起，就像用砂浆将积木组合成墙一样（参见图\
  \ 1.15）。\n\n![解决问题的积木法。](img/9781284166033_CH01_FIGF15.jpg)\n\n图 1.15 积木法\n\n描述\n\
  \n# 合并解决方案\n\n合并现有解决方案的另一种方法是逐步合并它们。例如，为了计算数值列表的平均值，我们必须对这些数值求和并计数。如果我们已经有了数值求和数值计数的独立解决方案，可以将它们合并。但如果我们先求和再计数，就必须读取两次列表。如果我们合并这两个解决方案，就可以节省步骤：读取一个值，将其累加到运行总和中，并在处理下一个值之前将计数器加\
  \ 1。每当子问题的解决方案出现重复步骤时，考虑合并它们而不是首尾相接地连接（参见图 1.16）。\n\n![解决问题的合并解决方案策略。](img/9781284166033_CH01_FIGF16.jpg)\n\
  \n图 1.16 合并解决方案\n\n描述\n\n# 心理障碍：对开始的恐惧\n\n作家对盯着空白页不知从何下手的经历再熟悉不过了。程序员第一次面对问题时也有同样的困难。我们该如何开始？\n\
  \n记住，你总有一种开始解决任何问题的方法：用自己的语言把它写在纸上，以便你理解它。一旦你转述了问题，就可以单独关注每个子部分，而不是试图一次性解决所有问题。这个过程帮助你看到看起来熟悉或与你解决过的其他问题类似的问题片段，并指出不明确的地方。\n\
  \n当你写下问题时，倾向于将这些内容分组为易理解的小块——以便分治。大多数心理障碍源于没有真正理解问题。用你自己的语言转述问题是打破僵局的好方法。解决任何问题通常不是一蹴永逸的。事实上，它涉及尝试和改进。测试每次尝试，如果那就太好了。每次失败都会让你更聪明。\n\
  \n程序员第一次面对问题时也有同样的困难。我们该如何开始？\n\n记住，你总有一种开始解决任何问题的方法：用你自己的语言把它写在纸上，以便你理解它。一旦你转述了问题，就可以单独关注每个子部分，而不是试图一次性解决所有问题。这个过程帮助你看到看起来熟悉或与你解决过的其他问题类似的问题片段，并指出不明确的地方。\n\
  \n当你写下问题时，倾向于将这些内容分组为易理解的小块——以便分治。大多数心理障碍源于没有真正理解问题。\n\n### 算法解决\n\n制定解决问题的程序并不总是一蹴永逸的。事实上，它涉及尝试和改进。测试每次尝试，如果那就太好了。如果不是，就重新尝试。每次失败都会让你更聪明。解决任何非平凡问题通常需要我们描述的技术。\n\
  \n在接下来的问题解决案例中，我们将开发一个判断年份是否为闰年的程序。这个案例研究说明了编写算法并将其编码为程序的思考过程。\n\n![第 2 章，标题为语法、语义与程序开发。背景图片是森林中的树。](img/Chapter-opener.jpg)\n\
  \n章节封面：© Joost Lagerij/EyeEm/Getty Images.\n\n## 第 2 章 C++ 语法、语义与程序开发\n\n## 2.1\
  \ C++ 程序的元素\n\n在本章中，我们开始研究构成 C++ 语言的规则和符号。我们还回顾了创建和运行程序的步骤。\n\n### C++ 程序结构\n\n\
  在第 1 章中，我们讨论了表达动作的五种基本结构：序列、选择、循环、子程序和并发。我们说子程序允许我们单独编写程序的一部分，然后将其组合成一个整体。在 C++\
  \ 中，子程序被称为函数，C++ 程序是一个或多个函数的集合。\n\n![C++ 程序的结构。](img/9781284166033_CH02_UFIG46-1.jpg)\n\
  \n描述\n\n每个 C++ 程序必须有一个名为 `main` 的函数。程序的执行从 `main` 函数开始。你可以将 `main` 视为协调其他函数的角色。例如，当\
  \ `main` 需要名为 `Square` 的函数执行某任务时，`main` 调用 `Square`。当 `Square` 函数执行完毕后，它会将控制权返回给\
  \ `main`，以便它可以继续执行。\n\n\n\n让我们来看一个包含三个函数的 C++ 程序示例：`main`、`Square` 和 `Cube`。不要过于担心程序中的细节——只需观察它的整体外观和结构即可。\n\
  \n![包含三个函数 main、Square 和 Cube 的 C++ 程序列举。](img/9781284166033_CH02_UFIG47-1.jpg)\n\
  \n描述\n\n在三个函数中的每一个中，左大括号 `{` 和右大括号 `}` 分标记要执行语句的开始和结束。出现在大括号之间的语句被称为函数体。\n\n程序的执行始终从\
  \ `main` 函数的第一条语句开始。在我们的程序中，第一条语句是：\n\n![程序代码第 1 行：cout，双左角括号，双引号，“27 的平方是，”双引号，双左角括号，Square(27)，双左角括号，结束\
  \ l，分号。](img/9781284166033_CH02_PRE1.jpg)\n\n该输出语句会导致信息出现在计算机屏幕上。你将在本章后续部分学习如何构造输出语句。简之，这条语句显示了两个项。第一个是消息\n\
  \n![程序输出：27 的平方是。](img/9781284166033_CH02_PRE2.jpg)\n\n第二个要显示的项是通过调用 `Square` 获取的值，以\
  \ `27` 作为要平方的数字。`Square` 函数计算该数字的平方，并将计算结果（`729`）返回给它的调用者 `main`。现在 `main` 可以显示值\
  \ `729` 并继续执行下一条语句。\n\n类似地，`main` 中的第二条语句输出消息\n\n![程序输出：和 27 的立方是。](img/9781284166033_CH02_PRE3.jpg)\n\
  \n然后调用 `Cube` 并显示结果 `19683`。因此，该程序的完整输出为：\n\n![程序输出。第 1 行：27 的平方是 729。第 2 行：和 27\
  \ 的立方是 19683。](img/9781284166033_CH02_PRE4.jpg)\n\n`Square` 和 `Cube` 都是返回值函数的示例。返回值函数向其调用者返回一个单一值。`Square`\
  \ 函数第一行开头的单词 `int` \n\n![程序代码第 1 行：int Square(int n)。](img/9781284166033_CH02_PRE5.jpg)\n\
  \n表示该函数返回一个整数值。\n\n现在再次看 `main` 函数。你会发现函数的第一行是：\n\n![程序代码第 1 行：int main()。](img/9781284166033_CH02_PRE6.jpg)\n\
  \n单词 `int` 表示 `main` 是一个返回整数值的返回值函数。如你所见，`main` 的最后一行是：\n\n![程序代码第 1 行：return 0;\
  \ 分号。](img/9781284166033_CH02_PRE7.jpg)\n\n它向调用者返回值 `0`。但是谁调用了 `main` 函数呢？操作系统。\n\
  \n在 C++ 程序中，操作系统被认为是 `main` 的调用者。操作系统期望 `main` 在执行完毕后返回一个值。按照惯例，返回 `0` 表示一切正常。返回其他任何值（通常是\
  \ `1`、`2`、. . . ）意味着出现了某些错误。我们通常通过返回 `0` 来结束 `main` 的执行。\n\n我们现在已经看到了 C++ 程序的样子——一个或多个函数的集合，包括\
  \ `main`。我们看到 `main` 是一个必须的函数，是执行开始的地方，并且它向操作系统返回一个值。接下来，我们将介绍一些有助于我们精确定义 C++ 语言组件的符号。\n\
  \n### 语法与语义\n\n编程语言由一组规则定义，这些规则规定了如何编写有效语句以及这些语句在执行时会做什么。特别是，对于语法（语法）和语义都有相应的规则。\n\
  \n语法是一套正式的规则，精确地定义了字母、数字和符号的组合如何在编程语言中使用。正如我们在第 1 章中看到的，编程语言中没有歧义的空间，因为计算机并“不知道我们的意思”。为了避免歧义，语法规则本身必须用一种非常简单、精确、正式的语言编写，称为元语言。\n\
  \n\n\n正如你可能猜到的那样，这个程序什么都不做，然后返回操作系统。为了让它变得有用，我们必须在 `return` 语句之前插入其他的 C++ 语句。但在讨论编写语句之前，我们必须先查看\
  \ C++ 中名称是如何书写的，以及程序的一些元素。\n\n### 程序的元素命名：标识符（Identifiers）\n\n在 C++ 中，`标识符` 被用于命名事物——例如子程序和计算机内存中的位置。正如我们刚刚看到的，标识符由字母（A–Z，a–z）、数字（0–9）和下划线字符（`_`）组成，但必须以字母或下划线开头。\n\
  \n记住标识符必须以字母或下划线开头：\n\n![标识符的模板是 C+](img/9781284166033_CH02_UFIG51-1.jpg)\n\n描述\n\
  \n以下划线开头的标识符在某些 C++ 系统具有特殊含义，因此最好以字母开头。这里是一些有效标识符的示例：\n\n![C++ 中标识符的示例](img/9781284166033_CH02_PRE9.jpg)\n\
  \n描述\n\n这里是一些无效标识符的示例以及无效的原因：\n\n| 无效标识符 | 解释 |\n| --- | --- |\n| 40Hours | 标识符不能以数字开头。\
  \ |\n| Get Data | 标识符中不允许空格。 |\n| box - 22 | 连字符 (`-`) 在 C++ 中是数学符号（减号）。 |\n| cost_in_$\
  \ | 不允许使用 `$` 等符号。 |\n| int | 单词 `int` 在 C++ 语言中是预定义的。 |\n\n表格中的最后一个标识符 `int` 是保留字的一个示例。保留字在\
  \ C++ 中有特定的用途；你不能将它们作为程序员定义的标识符。附录 A 列出了 C++ 中所有的保留字。\n\n第 1 章介绍的 `LeapYear` 程序使用了下列表中的程序员定义标识符。（程序中的其他大多数单词都是保留字。）注意，我们选择这些名称是为了传达它们是如何使用的。\n\
  \n| 标识符 | 它是如何被使用的 |\n| --- | --- |\n| year | 待测试的年份 |\n| IsLeapYear | 份是否为闰年 |\n\
  \n现在我们已经知道了如何编写标识符，让我们来看看 C++ 允许我们命名的某些东西。\n\n### 数据和数据类型\n\n计算机程序在数据上运行并产生输出。在\
  \ C++ 中，每部分数据都必须是特定的数据类型。数据类型决定了数据在计算机中的表示方式，以及计算机可以对其执行的处理类型。\n\n某些类型的数据被使用得如此频繁，以至于\
  \ C++ 为我们定义它们。这些标准（或内置）类型的示例包括 `int`（用于处理整数）、`float`（用于带有小数点的实数）和 `char`（用于处理字符数据）。\n\
  \n此外，C++ 允许程序员定义自己的数据类型——称为程序员定义（或用户定义）类型。从第 10 章开始，我们将向你展示如何定义自己的数据类型。\n\n在本章中，我们关注两种数据类型——一种用于表示由单个字符组成的数据，另一个用于表示字符字符串。在第\
  \ 3 章中，我们将详细检查数值类型。\n\n### char 数据类型\n\n内置类型 `char` 描述由一个字符组成的数据——一个字母、一个数字或一个特殊符号：\n\
  \n![char 数据类型的一些示例](img/9781284166033_CH02_PRE11.jpg)\n\n描述\n\n每台机器都使用特定的字符集，即它可以表示的字符集。注意每个字符都包含在单引号（'）中。C++\
  \ 编译器需要引号来区分，例如字符数据 `'8'` 和整数值 `8`，因为它们在机器内部的存储方式不同。同样注意，空格 `' '` 是一个有效字符。(1)\n\n\
  你可能不想将字符 `' A'` 加到字符 `' B'` 或从字符 `'8'` 减去字符 `'3'`，但你可能想要比较的值。字符集有一个排序序列，即所有字符的预定义顺序。例如，在\
  \ ASCII 中，`' A'` 小于 `' B'`。`LeapYear` 程序中没有标识符是 `char` 类型。\n\n#### string 数据类型\n\
  \n虽然 `char` 类型仅限于单个字符，但字符串是字符的序列，例如一个单词、句子，并用双引号包含。例如，以下是字符串：\n\n![字符串的示例](img/9781284166033_CH02_PRE11.jpg)\n\
  \n描述\n\n字符串必须完全在一行。在这种情况下，C++ 编译器会发出类似未终止字符串的错误信息。引号并不被认为是字符串的一部分，而只是区分字符串。例如，`\"\
  amount\"`（引号）是由字母 a, m, o, n, t 组成的字符串。相比之下，`amount`（无引号）是一个标识符，可能是内存位置的名字。`\"1245\"\
  ` 代表由字符 1, 2, 3, 4, 5 组成的字符串。如果我们写 `12345`，它就是一个整数。\n\n不包含字符的字符串被称为空字符串（null string）。我们使用两个双引号（之间没有空格）来编写空字符串：\n\
  \n![字符串的示例](img/9781284166033_CH02_PRE12.jpg)\n\n描述\n\n不是一个空格的字符串。为了处理字符串数据，我们使用名为\
  \ `string` 的类型。`string` 类型不是 C++ 语言的内置类型之一；相反，`string` 是由 C++ 标准库提供的程序员定义类型，任何程序员都可以使用的预写函数和类型集合。对字符串数据的操作包括比较字符串的值、在字符串中搜索特定字符以及连接另一个字符串。我们将在本章中查看其中一些操作，并在第\
  \ 3 章中介绍更多。\n\n### 元素命名：声明（Declarations）\n\n标识符可以用于命名常量和变量。换句话说，标识符可以是不允许更改内容的内存位置的名字，也可以是内容可以更改的位置的名字。\n\
  \n我们如何告诉计算机标识符代表什么？通过使用声明（declarations），声明是一种将名称（标识符）与 C++ 程序中元素的描述关联起来的语句（就像字典定义将名称与被命名事物的描述关联一样）。在声明中，我们命名一个标识符并指示它代表什么。例如，`LeapYear`\
  \ 程序使用了声明：\n\n```cpp\nint year;\n```\n\n\n\n宣布 `year` 是一个变量名，其内容类型为 `int`。当我们声明一个变量时，编译器会在内存中选择一个位置与该标识符相关联。\n\
  \n假设我们在寄信时，只需要在信封上写上一个人的名字，邮局就会查找地址。当然，这个世界上每一个人都需要一个不同的名字；否则，邮局将无法找到正确的地址。C++ 语言情况也是如此。每个标识符只能代表一个东西（特殊情况除外，我们将在第\
  \ 7 章和第 8 章中讨论）。程序中的每个标识符都必须与其他所有标识符不同。\n\n常量和变量统称为数据对象。数据对象和程序中的实际指令都存储在各种内存位置中。你已经看到，一组指令——一个函数——可以被命名。一个名称也可以与程序员定义的数据类型相关联。\n\
  \n在 C++ 中，你必须在使用每个标识符之前对其进行声明。这种做法允许编译器验证标识符的使用是否与其声明的一致。如果你将一个标识符声明为常量并在稍后尝试更改它的值，例如，编译器会检测到这种不一致性并发出错误信息。\n\
  \nC++ 中对于每种数据对象、函数或数据类型都有不同形式的声明语句。这里介绍了变量和常量的声明形式，额外的声明语句形式将是第 8 章到第 12 章的重点。\n\
  \n## 变量\n\n在程序执行期间，不同的数据值可能会在不同的存储在同一个内存位置。这种内存位置被称为变量，其内容是变量值。我们与内存位置关联的符号名称是变量名或变量标识符（参见图\
  \ 2.1）。在实践中，我们通常简短地将变量名称为变量。\n\n![一张显示如何声明变量的图。](img/9781284166033_CH02_FIGF01.jpg)\n\
  \n图 2.1 变量\n\n描述\n\n声明变量意味着同时指定变量名及其数据类型。声明告诉编译器将一个名称与内容为特定类型（例如 `char` 或 `string`）的内存位置相关联。以下语句声明标识符\
  \ `myChar` 将被用于引用 `char` 类型的变量：\n\n![char myChar;](img/9781284166033_CH02_PRE16.jpg)\n\
  \n在 C++ 中，变量只能包含其声明中指定类型的数据值。由于先前的声明，变量 `myChar` 只能包含一个 `char` 值。如果 C++ 编译器遇到试图将\
  \ `float` 值存储到 `myChar` 中的指令，它会生成额外的指令将 `float` 值转换为适当的类型。在第 3 章中，我们将研究此类类型转换是如何发生\
  \ true。\n\n这里是变量声明的语法模板：\n\n![变量声明的语法模板。](img/9781284166033_CH02_UFIG56-1.jpg)\n\
  \n描述\n\n其中 `DataType` 是数据类型的名称，如 `char` 或 `string`。注意变量声明始终以分号结束。\n\n从语法模板可以看出，你可以在一条语句中声明多个变量：\n\
  \n![在一个语句中声明的几个变量。](img/9781284166033_CH02_PRE17.jpg)\n\n描述\n\n在这里，所有三个变量都被声明为 `char`\
  \ 变量。然而，我们倾向于用单独语句声明每个变量：\n\n![在多个语句中声明的变量。](img/9781284166033_CH02_PRE18.jpg)\n\
  \n描述\n\n这种形式在修改程序时更容易向列表添加新变量或删除你不再需要的变量。\n\n用单独语句声明每个变量还允许你在每个声明的右侧附加注释，如下所示：\n\
  \n![在变量声明旁添加注释。](img/9781284166033_CH02_PRE19.jpg)\n\n描述\n\n这些声明告诉编译器创建三个 `float`\
  \ 变量——`payRate`、`hours` 和 `wages`以及一个 `int` 变量 `empNum`。注释告诉阅读程序的人每个变量代表什么。\n\n\
  现在我们已经知道了如何声明变量，让我们看看如何声明常量。\n\n## 常量\n\n单引号内的字符和双引号内的字符串都是常量。\n\n![常量示例。](img/9781284166033_CH02_PRE19.jpg)\n\
  \n在 C++ 中，正如在数学中一样，常量是不变的。当我们使用字面值时，我们给它一个名字。使用字面值是声明常量的另一种方式。例如，我们可以声明一个常量。\n\n\
  描述\n\n使用字面值似乎比命名常量并引用它更简单。但实际上，命名常量让程序更易读。\n\n这里是常量声明的语法模板：\n\n![常量声明的语法模板。](img/9781284166033_CH02_UFIG57-1.jpg)\n\
  \n描述\n\n注意关键字 `const` 开始声明，并且等号 (= 出现在标识符和字面值之间。\n\n以下是常量声明的示例：\n\n![常量声明的示例。](img/9781284166033_CH02_PRE23.jpg)\n\
  \n描述\n\n正如上面所示，许多 C++ 程序员会将常量的标识符全部大写，并用下划线分隔单词。这种想法是让读者在程序中间部分能够快速区分变量名和常量名。\n\n\
  正如变量声明一样，给常量声明添加注释也是好主意。我们在注释中描述每个常量代表什么：\n\n![添加了注释的常量声明。](img/9781284166033_CH02_PRE24.jpg)\n\
  \n这是一个只包含声明的程序：\n\n![仅包含声明的 C 加加程序列表。](img/9781284166033_CH02_UFIG58-1.jpg)\n\n\
  描述\n\n### 执行操作：可执行语句\n\n到目前为止，我们查看了在程序中声明数据对象的方法。现在我们转向对数据进行操作的方法。\n\n#### 赋值\n\n\
  \n\n\n\n# 赋值语句\n\n变量的值可以通过赋值语句进行设置或更改。例如，\n\n![一条赋值语句。](img/9781284166033_CH02_PRE29.jpg)\n\
  \n`lastName` 将字符串值 \"Lincoln\" 赋值给变量 `lastName`；也就是说，它将字符序列 \"Lincoln\" 存储在与变量 `lastName`\
  \ 相关内存中。\n\n以下是赋值语句的语法模板：\n\n![赋值语句的语法模板。](img/9781284166033_CH02_UFIG60-1.jpg)\n\
  \n赋值运算符 `=` 的语义（含义）是“存储”；表达式的值被存储在变量中。变量中之前的任何值都会被销毁，并被表达式的值取代。\n\n赋值语句的左侧只能有一个变量。赋值语句不像数学方程（`x\
  \ + y = z + 4`）；表达式（即赋值运算符右侧的内容）会被求值，结果被存储在赋值运算符左侧的单个变量中。变量会保持其赋值值，直到另一个语句向其存储一个新值。\n\
  \n给定以下声明：\n\n![一些声明语句。](img/9781284166033_CH02_PRE30.jpg)\n\n以下赋值语句是有效的：\n\n![一些有效的赋值语句。](img/9781284166033_CH02_PRE31.jpg)\n\
  \n然而，这些赋值是的：\n\n| 无效的赋值语句 | 原因 |\n| --- | --- |\n| `middleInitial =\"A.\";` | `middleInitial`\
  \ 是 `char` 类型；\"A.\" 是 `string` 类型。 |\n| `letter = firstName;` | `letter` 是 `char`\
  \ 类型；`firstName` 是 `string` 类型。 |\n| `firstName = Thomas;` | `Thomas` 是一个未声明的标识符。\
  \ |\n| `\"Edison\" = lastName;` | `=` 左侧只能出现变量。 |\n| `lastName = ;` | `=` 右侧缺少了表达式。\
  \ |\n\n## 字符串表达式\n\n虽然我们不能对字符串进行算术运算，但字符串数据类型提供了一种特殊的字符串操作，称为拼接，它使用 `+` 运算符。拼接（连接）两个字符串的结果是一个包含两个字符串中字符的新字符串。例如，给定以下语句\n\
  \n![声明了一些字符串变量。](img/9781284166033_CH02_PRE32.jpg)\n\n我们可以写：\n\n![字符串拼接。](img/9781284166033_CH02_PRE33.jpg)\n\
  \n该语句从内存中获取 `phrase 1` 的值，并拼接 `phrase 2` 的值，形成一个新的临时字符串，其中包含字符：\n\n![字符串拼接的结果。](img/9781284166033_CH02_PRE34.jpg)\n\
  \n该临时字符串（类型为 `string`）随后被赋值给（存储在）`bookTitle`。\n\n表达式中字符串顺序决定了它们在结果字符串中的出现方式。如果我们写：\n\
  \n![字符串拼接。](img/9781284166033_CH02_PRE35.jpg)\n\n那么 `bookTitle` 包含\n\n![字符串拼接的结果。](img/9781284166033_CH02_PRE36.jpg)\n\
  \n拼接可以用于具名字符串常量、字面量字符串和字符数据，也可以用于字符串变量。唯一的限制是 `+` 运算符的操作数中至少有一个是字符串变量或具名常量（因此你不能使用如\
  \ `\"Hi\" +\"there\"` 或 `'A' + 'B'` 的表达式）。例如，如果我们声明了以下常量：\n\n![一些常量声明。](img/9781284166033_CH02_PRE37.jpg)\n\
  \n那么我们可以写以下赋值语句来存储 `bookTitle` 的标题：\n\n![字符串拼接。](img/9781284166033_CH02_PRE38.jpg)\n\
  \n```cpp\nbookTitle = phrase1 + phrase2;\n```\n\n结果，`bookTitle` 包含\n\n![变量的内容。](img/9781284166033_CH02_PRE39.jpg)\n\
  \n```cpp\nbookTitle = \"Hello \" + \"World\";\n```\n\n如果 `bookTitle` 包含 \"American\
  \ History\"，则 `bookTitle = bookTitle + \" is fascinating\";`\n\n偶尔，我们可能会遇到想要向现有变量添加一些字符的情况。假设\
  \ `bookTitle` 已经包含了 \"Programming\"，现在我们想完成该标题：\n\n![字符串拼接。](img/9781284166033_CH02_PRE40.jpg)\n\
  \n```cpp\nbookTitle = bookTitle + \" Solving\";\n```\n\n结果是 `bookTitle` 包含 \"Programming\
  \ Solving\"。\n\n## 输出\n\n你现在已经掌握足够的 C++ 语法来给变量赋值并拼接字符串，但在你告诉计算机写出来之前，它不会给你结果。\n\n\
  在 C++ 中，我们可以使用一个特殊变量 `cout`（读作“see-out”）并配合插入运算符 `<<` 来输出信息：\n\n![打印控制台的代码。](img/9781284166033_CH02_PRE41.jpg)\n\
  \n```cpp\ncout << \"Hello World\";\n```\n\n变量 `cout` 在 C++ 系统中预定义用于表示一个输出流。你可以将输出流变量想象成一扇门，通过它向输出设备发送字符序列。\n\
  \n插入运算符 `<<`（通常读作“put to”）接受两个操作数。它的左侧操作数是流表达式（最简单的情况下就是流变量如 `cout`）。它的右侧操作数是一个表达式，如下例：\n\
  \n![输出信息的代码。](img/9781284166033_CH02_PRE42.jpg)\n\n```cpp\ncout << \"Age: \" <<\
  \ age << \"\\n\";\n```\n\n插入运算符 `<<` 将其右侧操作数转换为字符序列，并通过流变量将它们发送到输出设备。注意 `<<` 运算符指向数据的方向——从右侧编写的表达式指向左侧的输出流。\n\
  \n你可以在单个输出语句中使用多次 `<<` 运算符。每次出现都会将下一个数据项追加到输出流中。例如，我们可以将之前的两个输出语句写为：\n\n![合并的输出语句。](img/9781284166033_CH02_PRE43.jpg)\n\
  \n```cpp\ncout << \"Age: \" << age << \"\\n\";\ncout << \"Name: \" << name << \"\
  \\n\";\n```\n\n这两个版本产生的输出相同：\n\n\n\n\n\n![标题为《美国历史》，第 7 版](img/9781284166033_CH02_PRE45.jpg)\n\
  \n输出语句具有以下形式：\n\n![语句的输出。](img/9781284166033_CH02_UFIG63-1.jpg)\n\n描述\n\n以下输出语句会产生所示的输出。这些示例假设\
  \ `char` 变量 `ch` 包含 `'2'`，字符串变量 `firstName` 包含 `\"Marie\"`，字符串变量 `lastName` 包含 `\"\
  Curie\"`。\n\n| 语句 | 输出是什么（ 表示空白） |\n| --- | --- |\n| `cout << ch;` | 2 |\n| `cout\
  \ <<\"ch =\" << ch;` | ch=2 |\n| `cout << firstName +\"\" + lastName;` | MarieCurie\
  \ |\n| `cout << firstName << lastName;` | MarieCurie |\n| `cout << firstName <<\
  \ ' ' << lastName;` | MarieCurie |\n| `cout <<\"ERROR MESSAGE\";` | ERRORMESSAGE\
