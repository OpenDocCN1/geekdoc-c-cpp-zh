  \n\n\n\n第 9 章 引入了控制抽象的概念，即将函数的外部操作与其内部实现分离来。在本章中，我们引入了类似的概念——`数据抽象`，即将数据类型的逻辑属性与其实现分离来。数据抽象和控制抽象共同构成了`抽象数据类型`（ADT）的概念。我们首先回顾抽象数据类型，然后介绍我们可以用于实现它们的\
  \ C++ 语法：`class`（类）。类将数据和动作结合在一起，形成称为“对象”的自包含实体——对象是面向对象编程的基础。\n\n## 12.1 抽象数据类型\n\
  \n我们生活在一个复杂的世界里。为了应对复杂性，人类大脑会进行`抽象`——即将一个思想或对象的本质特征从其细节中分离出来的行为。\n\n通过`抽象`，我们关注的是*是什么*（what），而不是*怎么做*（how）。例如，对于汽车，我们大多数人都知道引擎*做什么*，但少少的人确确切引擎是*如何*工作的。抽象让我们能够开车，而无需成为汽车工程师。\n\
  \n在软件世界中，抽象对于管理巨大且复杂的项目至关重要。在计算机科学课程中，程序通常是可以完全被理解的。相比之下，基于数百万代码的大型软件产品只能通过抽象来开发和维护。为了管理复杂性，软件工程师经常使用两种重要技术：控制抽象和数据抽象。\n\
  \n在第 9 章中，我们把`控制抽象`定义为动作的逻辑属性与其实现分离。每当我们把算法简化为由函数调用执行的动作时，我们就在使用控制抽象。通过调用库函数，如下表达式所示：\n\
  \n```\n![An expression. 4 point 6, plus, s q r t, left parenthesis, x, right parenthesis.](img/9781284166033_CH12_P680-1.jpg)\n\
  ```\n\n我们仅依赖函数的`规范`（specification），它告诉我们它是做什么的。我们可以使用该函数而无需知道它的`实现`（产生结果的算法）。`sqrt`\
  \ 函数简化了我们的程序，因为计算平方根的细节被隐藏了。\n\n抽象技术也适用于数据。每个数据类型都由一组值（定义域）和对这些值允许的操作组成。数据抽象是将数据类型的逻辑属性与其实现细节分离来。当我们创建一个不是编程语言内置的数据类型时，我们就是在进行数据抽象。这种新类型最初被设计为一种`抽象数据类型\
  \ (ADT)`，它指定了逻辑属性，并推迟了其实现的细节。\n\n与控制抽象一样，抽象数据类型既有规范（*是什么*），也有实现（*怎么做*）。ADT 的规范描述了数据值的特征以及其操作的行为。ADT\
  \ 的用户在使用它时，只需要看到规范，而不需要实现。\n\n这里是一个包含整数的列表 ADT 的非常非正式的规范：\n\n**类型**\n`IntList`\n\
  \n**定义域**\n每个 `IntList` 值都是一个包含多达 100 个独立整数的集合。\n\n**操作**\n- 创建一个列表。\n- 向列表中插入一个项。\n\
  - 从列表中删除一个项。\n- 在列表中搜索某项。\n- 返回列表的当前长度。\n- 将列表按升序排序。\n- 输出列表。\n\n注意，这里没有实现细节。我们没有指定数据是如何存储的（它们可以存储在数组、文件或\
  \ `struct` 中），也没有指定操作的算法。隐藏实现可以防止用户编写依赖于它的代码，并允许实现者稍后对实现进行重构以改进。\n\n以下是另一个 ADT 的规范，它可能用于程序中表示一天的时间（TimeOfDay）。\n\
  \n**类型**\n`TimeOfDay`\n\n**定义域**\n每个 `TimeOfDay` 值都是以小时、分钟、秒形式表示一天的时间。\n\n**操作**\n\
  - 创建一个时间对象。\n- 输出时间。\n- 返回一个包含增加了一秒时间的对象。\n- 比较两个时间是否相等。\n- 判断一个时间是否“小于”另一个时间（即早于另一个时间）。\n\
  \n尽管我们在操作列表中提到了“时间”，但我们谨慎地将此 ADT 命名为 `TimeOfDay`，以区分于流逝的时间（后者可能也是一个有用的 ADT）。\n\n\
  ADT 的规范以抽象的形式定义数据值和操作，这种形式可以作为文档提供给用户和程序员。最终，ADT 必须在代码中实现。当然要实现一个 ADT，程序员必须做两件事：\n\
  \n1. 使用现有的数据类型选择抽象数据的具体`数据表示`（data representation）。\n2. 用程序指令实现每种允许的操作。\n\n为了实现\
  \ `IntList` ADT，我们可以选择一个包含两个项的记录的具体数据表示：一个用于存储项目的 100 元素数组，以及一个跟踪列表项数量的 `int` 变量。为了实现\
  \ `IntList` 操作，我们必须基于所选的数据表示创建算法。\n\n为了实现 `TimeOfDay` ADT，我们可能会使用三个 `int` 变量——一个用于小时，一个用于分钟，一个用于秒。或者，我们可能会使用三个字符串。又或者我们可能将\
  \ `TimeOfDay` 保为秒，并在需要时转换为小时、分钟和秒。规范并没有将我们限制在任何特定的表示上。只要我们满足规范，我们就可以在替代表示及其相关算法之间进行选择。我们的选择可能基于时间效率（执行速度）、空间效率（内存量）或算法的简单性和可读性。\n\
  \n## 12.2 C++ 类\n\n到目前为止，我们一直通过参数向函数和从函数传递值，并在这些值上执行某些操作。我们在定义新数据类型（如 `struct`时时也采取相同的方法；即，我们将数据值视为被动量，将操作视为独立的动作（参见**图\
  \ 12.1**）。\n\n然而，ADT 既包含数据值，也包含对它们的操作。因此，我们这种被动数据和分离函数的方法对于 ADT 来说是不恰当的。将 ADT 视为一个*活跃*的数据结构——一个在单一、统一单元内同时包含数据和操作的结构（参见**图\
  \ 12.2**）。C++ 通过名为 `class` 的结构化类型支持这种观点。\n\n```\n![A diagram shows 3 operation blocks\
  \ labeled operation 1, operation 2, and operation 3 and a data block. Data are passed\
  \ to 3 operational blocks. 3 Operations are passed to data block.](img/9781284166033_CH12_FIGF12_1.jpg)\n\
  ```\n图 12.1 数据与操作分离\n\n```\nBlocks labeled data, operation 1, operation 2, and operation\
  \ 3 are bounded in a circle.](images/9781284166033_CH12_FIGF12_2.jpg)\n```\n图 12.2\
  \ 数据与操作统一\n\n在图 10.3 中，在第 10 章中，我们列出了 C++ 中提供的四种结构化类型：数组、`struct`、`union` 和 `class`。类拥有组件（类成员），这些包含数据和操作这些数据的函数[1)\n\
  \n访问修饰符（AccessModifier）定义为两个关键字之一，`public` 或 `private`：\n\n\n\n\n\n![语法模板。](img/9781284166033_CH12_P684-2.jpg)\n\
  \n描述\n\n稍后，我们将添加另一个修饰符 `protected`。MemberList 是一个或多个字段或函数的声明：\n\n![语法模板。](img/9781284166033_CH12_P684-3.jpg)\n\
  \n描述\n\n这里是与我们在上一节中定义的 `TimeOfDay` ADT 对应的 C++ 类声明：\n\n![代码片段。](img/9781284166033_CH12_P684-4.jpg)\n\
  \n描述\n\n![代码片段的延续。](img/9781284166033_CH12_P685-1.jpg)\n\n描述\n\n(目前，忽略函数原型中的 `const`\
  \ 单词。我们将在本章稍后解释 `const` 的这种用法。)\n\n`TimeOfDay` 类有九个成员——四个成员函数（`Increment`、`Write`、`Equal`、`LessThan`）、三个成员变量（`hours`、`minutes`、`seconds`）以及两个类似于函数但没有返回值的构造。后者是一种称为类构造函数的特殊函数。构造函数是在类对象声明（创建）时隐式调用的成员函数。构造函数的名称始终与类本身相同。它的前面没有返回类型或\
  \ `void` 关键字。\n\n我们的类声明包含两个构造函数，通过参数列表进行区分。第一个构造函数是没有参数的，它在声明 `TimeOfDay` 对象时将其初始化为某些默认值（例如\
  \ 00:00:00）。这种构造函数在 C++ 中被称为默认构造函数。第二个构造函数有三个 `int` 参数，在这种情况下，它们用于在声明 `TimeOfDay`\
  \ 对象时初始化私有数据成员。\n\n![两个声明代码。](img/9781284166033_CH12_P685-2.jpg)\n\n描述\n\n正如你可能猜到的，三个数据成员变量（`hours`、`minutes`\
  \ 和 `seconds`）形成了 `TimeOfDay` ADT 的具体数据表示。成员函数对应于我们为 `TimeOfDay` ADT 列出的操作：返回一个增加了一秒的\
  \ `TimeOfDay` 对象、输出时间、比较两个时间的相等性，以及判断一个 `TimeOfDay` 对象是否小于另一个。虽然 `Equal` 和 `LessThan`\
  \ 函数比较的是两个 `TimeOfDay` 变量，但它们的参数列表只有一个参数——一个 `TimeOfDay` 变量。我们将在查看类的实现时看到其原因。\n\n\
  `TimeOfDay` 类的声明定义了一个数据类型，但并没有创建该类型的变量。如前所示，类变量（通常称为类对象或类实例）是使用普通的变量声明单独创建的。任何声明和操作\
  \ `TimeOfDay` 对象的软件都是该类的客户端。\n\n查看 `TimeOfDay` 类，你将看到保留字 `public` 和 `private`，每个字后面跟着一个冒号。在\
  \ `public` 之后、`private` 之前声明的类成员构成公共接口；客户端可以直接访问这些成员。在 `private` 单词之后声明的类成员客户端无法直接访问。如果客户端代码尝试访问私有成员，编译器会给出错误信息。\n\
  \n私有成员只能通过类的成员函数访问。在 `TimeOfDay` 类中，私有变量 `hours`、`minutes` 和 `seconds` 只能在 `Increment`、`Write`、`Equal`\
  \ 和 `LessThan` 中访问，而不能被客户端代码访问。将类成员分为私有和公共是 ADT 设计的标志。为了保持 ADT 的控制数据抽象，ADT 的实例应该通过公共接口进行操作。我们将在本章稍后讨论这个问题。\n\
  \nC++ 不要求公共私有成员按特定顺序出现。默认情况下，类成员是私有的；`public` 开启后续声明的公共访问。要切换回声明私有成员，请使用 `private`\
  \ 保留字，如前面的示例所示。一个类可以有多个公共和私有部分。\n\n我们现在可以解释 C++ 结构体和类的区别：在结构体，成员默认是公共的；在类中，它们默认是私有的。在\
  \ C 语言中，结构体不允许函数作为组件。因此，在 C++ 中，大多数程序员像在 C 中那样使用结构体来表示仅包含数据成员的记录结构，然后只用类来实现 ADT。\n\
  \n### 实现成员函数\n\n让我们来看看我们如何实现 `TimeOfDay` 类。还有一些我们尚未正式涵盖的细节，我们将在过程中指出。稍后，我们将回到相关的\
  \ C++ 规则。现在，我们想看一些具体的代码，以便你能够看到类是如何实现的。\n\n### 构造函数\n\n`TimeOfDay` 的构造函数非常直观。在默认构造函数中，每个数据成员都存储了\
  \ 0。\n\n![构造函数声明的程序代码。](img/9781284166033_CH12_P687-2.jpg)\n\n描述\n\n在带参数的构造函数中，参数存储在相应的成员中。\n\
  \n![带参数构造函数声明的程序代码。](img/9781284166033_CH12_P687-3.jpg)\n\n描述\n\n注意类名位于每个函数名之前，并使用\
  \ `::` 作用域解析运算符来指定函数所属的类。\n\n### Increment\n\n在这个函数中，我们返回一个新对象，它与当前对象相同，但增加了一秒。在\
  \ C++ 中，我们也将当前对象称为实例，即应用于它的对象。成员函数定义在类内部；因此，当你调用其中一个时，它的运行环境与 `main` 不同。\n\n`Increment`\
  \ 的第一步是创建所应用的 `TimeOfDay` 对象的副本。为此，我们调用带参数的构造函数，并将当前实例的数据成员传递给它。\n\n![代码片段。](img/9781284166033_CH12_P688-1.jpg)\n\
  \n描述\n\n注意我们没有向 `Increment` 传递任何内容。因为它在当前实例的范围内执行，因此自动访问实例的数据成员。\n\n接下来，副本的 `seconds`\
  \ 数据成员被增加。如果此操作使得值大于 59，则 `seconds` 必须设置为 0，并增加 `minutes` 数据成员。如果这使得 `minutes` 大于\
  \ 59，则将其设置为 0，并增加 `hours` 数据成员。如果 `hours` 数据成员超过了 23，它会被设置为 0。\n\n![部分程序代码。](img/9781284166033_CH12_P688-2.jpg)\n\
  \n描述\n\n注意我们访问实例成员的方式与访问 `result` 对象成员的方式对比。我们直接引用当前实例的成员（`hours`、`minutes`、`seconds`）。然而，访问任何其他对象的成员都需要使用点符号（`result.hours`、`result.minutes`、`result.seconds`）。\n\
  \n\n\n\n\n等一下——我们如何访问 `result` 对象的成员呢？它们不是私有（private）的吗？是的，但在 C++ 中，`private` 仅限制客户端代码的访问。在类的实现内部，我们可以访问同一类型类对象的私有成员。\n\
  \n## Write\n\n为了使时间格式统一，我们希望每个字段输出两个数字，因此我们必须检查一个值是否为单数字。如果是，我们就在前面输出一个 0。再次注意，`Write`\
  \ 函数中没有向其传递任何参数——它内部可以自动访问实例的成员。\n\n![一个使用逻辑运算符表示的算法。](img/9781284166033_CH12_P689-1.jpg)\n\
  \n描述\n\n## LessThan\n\n这个布尔操作比较了两个 `TimeOfDay` 类的对象：第一个是实例，第二个是通过参数传递的。正如我们在 `Increment`\
  \ 中看到的，另一个对象的成员必须通过点操作符（dot notation）来访问。\n\n我们如何比较时间？首先检查小时。如果小时相同，我们再检查分钟。如果分钟相同，我们检查秒。让我们以算法的形式来看这个过程。\n\
  \n`LessThan(In: otherTime)`\n\n**返回值：Boolean**\n\n```\nIF (hours < otherTime.hours)\n\
  Return True\nELSE IF (hours > otherTime.hours)\nReturn False\nELSE IF (minutes <\
  \ otherTime.minutes)\nReturn True\nELSE IF (minutes > otherTime.minutes)\nReturn\
  \ False\nELSE IF (seconds < otherTime.seconds)\nReturn True\nELSE\nReturn False\n\
  ```\n\n这个算法也可以用逻辑运算符表示，如下所示：\n\n```\nhours < otherTime.hours || hours == otherTime.hours\n\
  && minutes < otherTime.minutes || hours == otherTime.hours\n&& minutes == otherTime.minutes\
  \ &&\nseconds < otherTime.seconds)\n```\n\n哪种表示方式更好？这纯粹是风格问题。第一个版本更易读，因此也更容易调试。第二个版本更优雅。在这种情况下，我们选择了优雅。\n\
  \n![部分程序代码。](img/9781284166033_CH12_P690-1.jpg)\n\n描述\n\n## Equal\n\n被 `Equal` 比较的两个对象是当前实例和参数。只有当三对数据字段都匹配时，`Equal`\
  \ 才会返回 `true`。\n\n![部分程序代码。](img/9781284166033_CH12_P690-2.jpg)\n\n### 类、对象与成员\n\
  \n始终记住，类定义了一个类型。和任何类型一样，类是创建该类型值的模式。通过类，这些值就是对象。我们说*实例化*（instantiate）类来创建一个对象。对象是其类的实例（具体示例）。将类比为饼干模具，将该类的对象类比为饼干。\n\
  \n![声明代码。第一行：Time of Day, time 1, 分号。第二行：Time of Day, time 2, 左括号, 17, 58, 2, 右括号,\
  \ 分号。](img/9781284166033_CH12_P690-3.jpg)\n\n描述\n\n创建两个 `TimeOfDay` 类的实例对象：`time1`\
  \ 和 `time2`。\n\n类指定的模式是，每个 `TimeOfDay` 类型的对象都有名为 `hours`、`minutes` 和 `seconds` 的成员变量。因此，`time1`\
  \ 拥有它自己的 `hours`、`minutes` 和 `seconds` 变量，而 `time2` 拥有另一组独立的 `hours`、`minutes` 和\
  \ `seconds` 变量。`time1` 的 `hours`、`minutes` 和 `seconds` 包含值 0、0 和 0，而 `time2` 的变量包含值\
  \ 17、58 和 2。图 12.3 展示了对象 `time1` 和 `time2`。\n\n事实上，C++ 编译器并没有通过在 `time1` 和 `time2`\
  \ 中都放置重复的成员函数副本（例如 `Increment`）来浪费内存。相反，编译器只生成一份 `Increment` 副本，每当从任何类实例调用它时，它都会执行。尽管如此，图\
  \ 12.3 的图是两个不同类对象的很好的心理模型。\n\n请务必清楚*对象*（object）和*成员*（member）术语之间的区别。图 12.3 展示了两个\
  \ `TimeOfDay` 类对象，每个对象都有九个成员。\n\n![图显示了两个垂直的椭圆对象，标记为 time 1 和 time 2。](img/9781284166033_CH12_FIGF12_3.jpg)\n\
  \nFIGURE 12.3 两个对象的概念视图\n\n## 对象上的内置操作\n\n程序员定义的类与内置类型有许多相似之处。例如，你可以根据需要声明任意数量的类对象。你可以将对象传递给函数并作为函数值返回。像任何变量一样，对象可以是自动的（每当控制到达其声明处时创建，当控制离开时销毁）。\n\
  \n然而，对象与内置类型也有不同之处。C++ 允许对内置类型执行某些操作，例如你可以使用 `++` 或 `--` 运算符对整数操作，但你不能对类对象这样做，除非你重载了这些运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `=` 运算符将一个对象赋值给另一个，或者使用 `==` 运算符比较两个对象是否相等，除非你重载了这些运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用点操作符（`.`）来访问对象的成员，除非你重载了该操作符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `->` 运算符来通过指针访问对象的成员，除非你重载了该操作符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `*` 运算符通过指针解引用访问对象，除非你重载了该运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `&` 运算符来获取对象的引用，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `[]` 运算符来访问数组中的元素，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `()` 运算符来像调用函数一样调用一个对象，除非你重载了该运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `<<` 运算符将对象输出到流，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `>>` 运算符从流输入到对象，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `+` 运算符连接两个对象，除非你重载了该运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `-` 运算符相减两个对象，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `*`\
  \ 运算符乘两个对象，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `/` 运算符除以两个对象，除非你重载了该运算符。\n\n\
  C++ 允许对对象执行某些操作，例如你可以使用 `%` 运算符对两个对象取模，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `+=`、`-=`、`*=`、`/=`\
  \ 和 `%=` 复合赋值运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `<<=` 和 `>>=` 复合赋值运算符，除非你重载了这些运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `&`、`|` 和 `^` 位逻辑运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `&=`、`|=` 和 `^=` 位逻辑复合赋值运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `&&` 和 `||`\
  \ 逻辑与运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `&&=` 和 `||=` 复合赋值运算符，除非你重载了这些运算符。\n\
  \n总之，这些操作都是通过运算符重载来定义行为的。\n\n创建两个 `TimeOfDay` 类的实例对象：`time1` 和 `time2`。\n\n类指定的模式是，每个\
  \ `TimeOfDay` 类型的对象都有名为 `hours`、`minutes` 和 `seconds` 的成员变量。因此，`time1` 拥有它自己的 `hours`、`minutes`\
  \ 和 `seconds` 变量，而 `time2` 拥有另一组独立的 `hours`、`minutes` 和 `seconds` 变量。`time1` 的 `hours`、`minutes`\
  \ 和 `seconds` 包含值 0、0 和 0，而 `time2` 的变量包含值 17、58 和 2。图 12.3 展示了对象 `time1` 和 `time2`。\n\
  \n事实上，C++ 编译器并没有通过在 `time1` 和 `time2` 中都放置重复的成员函数副本（例如 `Increment`）来浪费内存。相反，编译器只生成一份\
  \ `Increment` 副本，每当从任何类实例调用它时，它都会执行。尽管如此，图 12.3 的图是两个不同类对象的很好的心理模型。\n\n请务必清楚*对象*（object）和*成员*（member）术语之间的区别。图\
  \ 12.3 展示了两个 `TimeOfDay` 类对象，每个对象都有九个成员。\n\n![图显示了两个垂直的椭圆对象，标记为 time 1 和 time 2。](img/9781284166033_CH12_FIGF12_3.jpg)\n\
  \nFIGURE 12.3 两个对象的概念视图\n\n## 对象上的内置操作\n\n程序员定义的类与内置类型有许多相似之处。例如，你可以根据需要声明任意数量的类对象。你可以将对象传递给函数并作为函数值返回。像任何变量一样，对象可以是自动的（每当控制到达其声明处时创建，当控制离开时销毁）。\n\
  \n然而，对象与内置类型也有不同之处。C++ 允许对内置类型执行某些操作，例如你可以使用 `++` 或 `--` 运算符对整数操作，但你不能对类对象这样做，除非你重载了这些运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `=` 运算符将一个对象赋值给另一个，或者使用 `==` 运算符比较两个对象是否相等，除非你重载了这些运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用点操作符（`.`）来访问对象的成员，除非你重载了该操作符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `->` 运算符来通过指针访问对象的成员，除非你重载了该操作符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `*` 运算符通过指针解引用访问对象，除非你重载了该运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `&` 运算符来获取对象的引用，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `[]` 运算符来访问数组中的元素，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `()` 运算符来像调用函数一样调用一个对象，除非你重载了该运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `<<` 运算符将对象输出到流，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `>>` 运算符从流输入到对象，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `+` 运算符连接两个对象，除非你重载了该运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `-` 运算符相减两个对象，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `*`\
  \ 运算符乘两个对象，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `/` 运算符除以两个对象，除非你重载了该运算符。\n\n\
  C++ 允许对对象执行某些操作，例如你可以使用 `%` 运算符对两个对象取模，除非你重载了该运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `+=`、`-=`、`*=`、`/=`\
  \ 和 `%=` 复合赋值运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `<<=` 和 `>>=` 复合赋值运算符，除非你重载了这些运算符。\n\
  \nC++ 允许对对象执行某些操作，例如你可以使用 `&`、`|` 和 `^` 位逻辑运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用\
  \ `&=`、`|=` 和 `^=` 位逻辑复合赋值运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `&&` 和 `||`\
  \ 逻辑与运算符，除非你重载了这些运算符。\n\nC++ 允许对对象执行某些操作，例如你可以使用 `&&=` 和 `||=` 复合赋值运算符，除非你重载了这些运算符。\n\
  \n总之，这些操作都是通过运算符重载来定义行为的。\n\n创建两个 `TimeOfDay` 类的实例对象：`time1` 和 `time2`。\n\n类指定的模式是，每个\
  \ `TimeOfDay` 类型的对象都有名为 `hours`、`minutes` 和 `seconds` 的成员变量。因此，`time1` 拥有它自己的 `hours`、`minutes`\
  \ 和 `seconds` 变量，而 `time2` 拥有另一组独立的 `hours`、`minutes` 和 `seconds` 变量。`time1` 的 `hours`、`minutes`\
  \ 和 `seconds` 包含值 0、0 和 0，而 `time2` 的变量包含值 17、58 和 2。图 12.3 展示了对象 `time1` 和 `time2`。\n\
  \n事实上，C++ 编译器并没有通过在 `time1` 和 `time2` 中都放置重复的成员函数副本（例如 `Increment`）来浪费内存。相反，编译器只生成一份\
  \ `Increment` 副本，每当从任何类实例调用它时，它都会执行。尽管如此，图 12.3 的图是两个不同类对象的很好的心理模型。\n\n### 类作用域\n\
  \n在第 9 章中我们提到了四种 C++ 作用域：局部、全局、命名空间和*类*作用域。类作用域适用于结构体、联合体类内部的成员名称。说一个成员具有类作用域，意味着它的名称绑定到该类（或结构体或联合体）。如果在类外部声明了相同的标识符，这两个标识符是不同的。\n\
  \n\n\n\n让我们来看一个例子。`TimeOfDay` 有一个名为 `Write` 的成员函数。在同一个程序中，另一个类（例如 `SomeClass`）也可能有一个名为\
  \ `Write` 的成员函数。此外，程序可能还有一个全局的 `Write` 函数。如果程序包含如下语句：\n\n![2 条语句。第 1 行：TimeOfDay，检查\
  \ In Time，分号。第 2 行：Some Class，某个对象，分号。](img/9781284166033_CH12_P692-5.jpg)\n\n描述\n\
  \n![程序语句。](img/9781284166033_CH12_P693-1.jpg)\n\n那么 C++ 编译器就可以区分这三个 `Write` 函数。在前两个语句中，点符号表示对特定对象进行成员选择。第一条语句调用了\
  \ `checkInTime` 对象的 `TimeOfDay` 类的 `Write` 函数。第二条语句调用了该类实例 `someObject` 的 `SomeClass`\
  \ 类 `Write` 函数。由于最后一条语句没有使用点符号，因此调用了全局 `Write` 函数。\n\n1 在 C++ 中，`struct` 几乎与 `class`\
  \ 相同；然而，由于继承自 C 结构体构造，大多数程序员使用 `class` 来实现 ADT，并将对 `struct` 的使用限制在不需要关联操作的记录类型应用中。\n\
  \n## 12.3 信息隐藏\n\n从概念上讲，对象周围有一道看不见的墙，称为“抽象屏”（abstraction barrier），它保护私有数据和函数不被客户端代码访问。该屏还防止对象直接访问对象外部的数据和函数。这种屏是类和抽象数据类型的关键特征。\n\
  \n为了让对象与客户端代码共享信息，抽象屏需要一个开口：公共接口——其成员被声明为 `public`。如果唯一的公共成员是函数和常量，且所有成员变量都是私有的，那么客户端只能间接操作操作对象的内部值——通过调用公共接口中的函数。\n\
  \n电气工程师使用一个类似的概念，称为“黑盒”（black box），这是一个内部工作原理保持隐藏的模块。用户从面说明书中知道盒子*做了什么*，但不知道它是*如何*做的。如果用户根据说明书向盒子连接电线，它就能正常工作（参见**图\
  \ 12.4**）。\n\n在软件设计中，同样的概念被称为“信息隐藏”（information hiding）。信息隐藏允许客户端代码在不了解任何实现细节的情况下使用类。信息隐藏还确保客户端不会以破坏实现正确性的方式访问私有代码或数据。\n\
  \n![图示显示了一个带有接口的盒子，输入和输出各有 2 个插座。四根不同颜色的电线作为输入和输出插入。](img/9781284166033_CH12_FIGF12_4.jpg)\n\
  \n图 12.4 黑盒\n\n我们之前已经讨论过封装和信息隐藏。在第 8 章中，我们提到过将函数实现隐藏在单独文件中可能性。现在我们来看通过将类成员函数的实现放在与客户端代码分离的文件中来实现这种隐藏。\n\
  \nC++ 类的创建者选择哪些成员是私有的，哪些是公共的。由于信息隐藏对数据抽象至关重要，大多数类都表现出一种典型的模式：数据变量是私有的，操作它们的函数是公共的。将变量设为公共将允许客户端直接检查并修改它们的值，这将破坏抽象。\n\
  \n`TimeOfDay` 类体现了这种组织方式。它的变量是私有的，因此客户端无法访问它们。结果，以下客户端语句将导致编译错误：\n\n![2 条语句。第 1\
  \ 行：TimeOfDay，Check In Time，分号。第 2 行：Check In Time，点，hours，等号，9，分号。两个正斜杠。在客户端代码中被禁止。](img/9781284166033_CH12_P694-1.jpg)\n\
  \n描述\n\n因为只有类的成员函数可以访问私有数据，所以类的创建者对客户端如何使用它具有完全控制权。如果允许客户端*检查*私有数据，那么类可以提供观察函数。`TimeOfDay`\
  \ 类有四个观察者：`Write`、`Increment`、`Equal` 和 `LessThan`。由于这些函数不应该修改私有数据，因此它们在参数列表后声明为\
  \ `const`：\n\n![声明语句。](img/9781284166033_CH12_P694-2.jpg)\n\n描述\n\nC++ 将这些称为 `const`\
  \ *成员函数*。在 `const` 成员函数的体内，如果语句尝试修改任何私有数据，就会发生编译错误。\n\n### **用户编写的头文件**\n\n当你创建自己的\
  \ ADT 时，通常会发现它们可以在多个程序中复用。例如，考虑一年中的月份。与其在每个使用该类型的程序开头都输入这些内容，不如将此声明放在名为 `months.h`\
  \ 的文件中。\n\n在 C++ 中，习惯上（但不是必须）将类声明和类实现放在不同的文件中。一个文件是*规范文件*——是一个头（**.h ）文件，只包含类声明。第二个文件是*实现文件*——包含函数定义。让我们先来看规范文件。\n\
  \n#### **规范文件与实现文件**\n\nADT 由两部分组成：规范和实现。规范充分描述了数据类型的行为，以便客户端能够使用它。实现包含了具体的数据表示和操作代码，它是隐藏的。\n\
  \n`TimeOfDay` 类的声明作为它的规范，以函数原型的形式向用户展示公共接口。为了实现 `TimeOfDay`，我们为其成员函数提供函数定义。\n\n\n\
  \n\n以下是 `TimeOfDay` 的规范文件。这与我们之前看到的相同，但包含了前置条件（preconditions）和后置条件（postconditions），以尽可能无义地指定成员函数的语义。\n\
  \n![程序代码段。](img/9781284166033_CH12_P696-1.jpg)\n\n描述\n\n原则上说，规范文件不应向类的用户暴露任何实现细节。该文件应该指定每个成员函数执行了*什么*，而不揭露它是*如何*实现的。然而，正如你在上文的类声明中看到的，某些实现细节是可见的：具体的数据表示列在\
  \ `private`（私有）部分。尽管如此，数据表示仍被视为隐藏信息，因为编译器禁止客户端代码直接访问这些数据。\n\n这里有一个操作两个 `TimeOfDay`\
  \ 类对象的客户端程序。该程序是在不知道类如何实现的情况下编写的。\n\n![程序代码段。](img/9781284166033_CH12_P697-1.jpg)\n\
  \n描述\n\n![程序代码段的延续。](img/9781284166033_CH12_P698-1.jpg)\n\n描述\n\n![程序代码段的输出。](img/9781284166033_CH12_P698-2.jpg)\n\
  \n描述\n\n### 实现文件\n\n`TimeOfDay` 的规范（`.h`）文件只包含类声明。实现文件提供了所有类成员函数的函数定义。在下方实现文件的开头注释中，我们将文件名记录为\
  \ `TimeOfDay.cpp`。你的系统可能对源文件使用不同的文件名后缀——也许 `.c`、`.C` 或 `.cxx`。\n\n这里是之前显示的代码。我们没有重复规范文件中函数原型中的文档。但我们确实为将维护代码的程序员添加了文档。在程序代码之后，我们解释了新功能。\n\
  \n![程序代码段。](img/9781284166033_CH12_P698-3.jpg)\n\n描述\n\n![程序代码段的延续。](img/9781284166033_CH12_P699-1.jpg)\n\
  \n描述\n\n![程序代码段的延续。](img/9781284166033_CH12_P700-1.jpg)\n\n该实现文件展示了几个重要要点：\n\n1.\
  \ 文件以预处理器指令开始\n\n    ![预处理器指令。哈希，包含，双引号，Time of Day 点 h，双引号。](img/9781284166033_CH12_P700-2.jpg)\n\
  \n    描述\n\n    实现文件和客户端代码都必须 `#include` 规范文件。图 12.6 展示了这种对规范文件的共享访问，这保证了与抽象相关的所有声明是一致的。也就是说，`client.cpp`\
  \ 和 `TimeOfDay.cpp` 引用了位于 `TimeOfDay.h` 中相同的 `TimeOfDay` 类的声明。\n\n2. 在每个函数定义的头部，成员函数的名称带有带有类名（`TimeOfDay`）和\
  \ C++ 作用域解析运算符（`::`）。正如之前讨论的，几个不同的类可能都具有相同名的成员函数——例如，`Write`。此外，可能存在一个不属于任何类的全局\
  \ `Write` 函数。作用域解析运算符消除了关于正在定义哪个特定函数的任何不确定性。\n\n    ![图解释了对规范文件的共享访问。](img/9781284166033_CH12_FIGF12_6.jpg)\n\
  \n    图 12.6 规范文件的共享访问\n\n3. 尽管类的客户端必须使用点运算符来引用类成员（例如，`startTime.Write()`），但类的成员之间直接相互引用，而不使用点表示法。查看\
  \ `Increment` 函数的体，你可以看到语句直接引用了成员变量 `hours`、`minutes` 和 `seconds`，而没有使用点运算符。\n\n\
  \    当成员函数操作两个或多个类对象时，会出现该规则的例外。考虑 `Equal` 函数。假设客户端代码有两个类对象 `startTime` 和 `endTime`，并使用语句\n\
  \n    ![语句。第 1 行：if，左括号，start time，点，equal，左括号。](img/9781284166033_CH12_P701-1.jpg)\n\
  \n    在执行时，`Equal` 函数被应用于 `startTime` 对象。在 `Equal` 函数体中，表达式 `startTime.Equal(endTime)`\
  \ 指向两个不同对象的成员。未修饰的标识符 `hours` 指向 `endTime` 对象的成员。\n\n4. `Increment`、`Write`、`Equal`\
  \ 和 `LessThan` 是观察者函数；它们不修改数据。因为我们将它们声明为 `const`，编译器阻止这些函数向数据赋值。注意 `const` 词必须出现在函数原型（类声明中）和函数定义的头部中。\n\
  \n### 编译和链接多文件程序\n\n现在我们已经为 `TimeOfDay` 类创建了规范文件和实现文件，我们（或任何程序员）如何使用这些文件？让我们通过查看源文件的*独立编译*概念来开始探索这一问题。\n\
  \n在前面的章节中，我们提到了多文件程序的概念——分成多个包含源代码文件的程序。在 C++ 中，这些文件每个可以单独编译并在不同时间编译。在这个过程中，编译器将每个源代码文件翻译成对象代码文件。图\
  \ 12.7 展示了一个由 `myprog.cpp`、`file2.cpp` 和 `file3.cpp` 源代码文件组成的多文件程序。我们可以独立地编译每个文件，产生对象代码文件\
  \ `myprog.obj`、`file2.obj` 和 `file3.obj`。虽然每个 `.obj` 文件都包含机器语言，但它们还不是可执行形式。系统的链接程序将对象代码结合在一起形成一个可执行程序文件。（在图\
  \ 12.7 中，我们使用了 `.cpp`、`.obj` 和 `.exe` 文件名后缀。你的 C++ 系统可能使用不同的命名约定。）\n\n\n\n\n回到我们的\
  \ `TimeOfDay` 类，假设我们已经创建了 `TimeOfDay.h` 和 `TimeOfDay.cpp` 文件。现在我们可以将 `TimeOfDay.cpp`\
  \ 编译成目标代码。你可能正在使用一个提供*集成环境*的 C++ 系统——该程序将编辑器、编译器和链接器封装成一个包。当发生编译时错误或链接时错误时，集成环境会将你带回编辑器，并指出错误的位置。某些集成环境还管理项目文件。项目文件包含关于多文件程序中所有组成文件的信息。通过项目文件，系统会自动重新编译或重新链接任何由于程序其他文件发生更改而过时的文件。\n\
  \n如果你使用的是命令行系统，你将向操作系统编写单行命令，告诉它编译或链接某些文件。无论你使用哪种环境——集成环境还是命令行——其整体效果都是相同的：源代码文件被编译成目标代码文件，然后这些文件被链接成一个可执行程序，最后执行该程序。\n\
  \n![一个流程图解释了编译和链接。](img/9781284166033_CH12_FIGF12_7.jpg)\n\n描述\n\n图 12.7 分离编译与链接\n\
  \n在离开多文件主题之前，我们必须强调一个重要点。在图 12.6 的示例中，`TimeOfDay.h` 和 `TimeOfDay.obj` 文件对 `TimeOfDay`\
  \ 类的用户必须可用。用户需要检查 `TimeOfDay.h` 以查看 `TimeOfDay` 对象的功能以及如何使用它们。用户还能够将他们的程序与 `TimeOfDay.obj`\
  \ 链接以生成一个可执行程序。然而，用户*不需要*看到 `TimeOfDay.cpp`。用之前引入的术语来说，`TimeOfDay` 的实现应该被视为一个黑盒。\n\
  \n抽象的主要目的是通过减少复杂性来简化程序员的工作。抽象的使用者不应该通过查看其实现来学习如何使用它，也不应该编写依赖于实现细节的程序。在后一种情况下，实现的任何更改都可能“破坏”用户的程序。在第\
  \ 8 章中，标题为“函数实现的概念性与物理性隐藏”的软件工程提示框讨论了编写依赖实现细节代码的风险。\n\n## 12.4 什么是对象？\n\n我们本章从讨论抽象和抽象数据类型开始。接着，我们检查了类构造结构，这是\
  \ C++ 实现 ADT 的机制。我们已经讨论了如何通过公共接口的设计以及通过拥有规范文件和实现文件来实现信息隐藏。现在让我们退后一步，从更广阔的视角来看对象及其用途。\n\
  \n在面向对象编程（OOP）中，*对象*（object）一词有特定的含义：它是一个封装了数据和对数据进行操作的自包含实体。换句话说，对象代表一个 ADT 的实例。对象具有一个*内部状态*（其数据的当前值，称为`attributes`属性），它拥有一*方法集*（操作，在\
  \ C++ 中通过函数实现）。如果一个类设计得当，方法是另一个对象修改该对象状态的唯一手段。为了检查对象的状态，也会使用方法；此外，某些对象提供了可以检查的公共常量。例如，`string`\
  \ 类将 `npos` 常数设为公共，因此我们可以确定字符串的最大长度。\n\n一个面向对象的程序由一组通过*消息传递*相互通信的对象组成。如果对象 A 想让对象\
  \ B 执行某些任务，对象 A 会发送一个消息，包含对象的名称（在此例中为 B）和要执行的方法名称。对象 B 通过以自己的方式执行此方法做出响应，可能会改变其状态并向其他对象发送消息。\n\
  \n正如你所看到的，对象在概念上与传统的数据结构大不同。`C struct` 是一个被动的数据结构，只包含数据并由程序对其操作。相比之下，对象是一个活跃的数据结构；数据和操作数据的代码绑定在对象内部。在\
  \ OOP 术语中，对象知道如何操作自己的状态。\n\nSmalltalk 编程语言开创了许多与面向对象编程相关的思想，它的词汇影响了 OOP 的词汇。OOP\
  \ 文献充斥着“方法”、“属性”和“发送消息”等短语。以下是一些 OOP 术语及其对应的 C++ 术语：\n\n| **OOP** | **C++** |\n\
  | --- | --- |\n| Object | 对象或类实例 |\n| Attribute | 数据成员变量 |\n| Method | 成员函数 |\n\
  | Message passing | 函数调用（公共成员函数的调用） |\n\n让我们复习 `TimeOfDay` 类，尽管它稍作修改以反映面向对象的术语和原则。它有六个公共方法（在面向对象的术语中称为“职责”）：`Increment`、`Write`、`Equal`、`LessThan`\
  \ 以及两个构造函数。一个构造函数接受小时、分钟和秒作为参数，另一个将 `TimeOfDay` 设置为零。\n\n在面向对象的术语中，存在两种类型的职责（操作）：*动作职责*（action\
  \ responsibilities）和*知识职责*（knowledge responsibilities）。`TimeOfDay` 的所有公共方法要么是构造函数，要么是知识职责。它们都没有执行动作（改变对象的状态）。\n\
  \n## 12.5 类设计原则\n\n由于类是面向对象编程的基础性构建块，我们现在考虑在大型问题背景下设计良好的类的原则。\n\n### 封装\n\n类设计的一个首要原则是封装（encapsulation）。字典告诉我们，胶囊是一个密封的容器，保护其内容免受外部污染或恶劣环境的影响。封装某物就是将其放入胶囊。在面向对象编程中，胶囊是类，其属性是我们要保护的内容。类构造本身并不保护其属性。相反，我们必须通过定义一个限制其他类访问的`正式接口`来自觉地提供这种保护。\n\
  \n什么是正式接口？在类设计中，它是对类与其他类交互的所有方式的描述。职责和非私有属性的集合定义了正式接口。\n\n\n\n\n如果一个对象的状态只能通过设计良好的接口来更改，那么应用程序其他部分的错误就无法以意料之外的方式影响它。只要我们设计该类，使其对象能够处理任何与接口一致的数据，我们就知道它是一个可靠的软件单元。\n\
  \n这里有一个类比，说明了经过封装的类与未封装的类之间的区别。假设你是一个建筑师，在一个新的开发区内盖房子。其他建筑师也在同一个开发区内工作。如果每个建筑师都将自己的设备和材料保留在他们正在建造的房屋物业边界内，并且仅通过自己的车道进出工地，那么施工就能顺利进行。物业边界封装了各个施工工地，而车道是人员、设备和材料进出工地的唯一接口。现在想象一下，如果建筑师在不通知对方的情况下开始将材料和设备放在其他人的工地，会发生怎样的混乱？如果他们开始开着重型设备穿过其他工地回到自己的工地，又会发生什么？材料会被用到错误的房子，工具会丢失或被误入的车辆压坏，整个过程将会崩溃。**图\
  \ 12.8** 展示了这种情况。\n\n![一个真实示例解释了封装的概念。](img/9781284166033_CH12_FIGF12_8.jpg)\n\n\
  描述\n\n图 12.8 封装为类划分了清晰的边界；未封装类会导致混乱\n\n让我们通过查看同一个 `Date` 类的两种接口设计，在 C++ 中将这个类比具体化——一个是封装的，另一个未封装的。\n\
  \n![一个包含 2 列代码的表格。](img/9781284166033_CH12_P709-1.jpg)\n\n描述\n\n右侧的接口允许客户端代码直接更改\
  \ `Date` 对象的字段。因此，如果客户端代码为这些字段赋值 14、206 和 83629，你将得到一个荒谬的日期：83629 年 14 月第 206 天。左侧的封装实现将这些字段设为\
  \ `private`。它提供了一个 `public` 方法，接受日期值作为参数，并在更改对象内部字段之前检查日期是否有效。\n\n这个示例表明，C++ 并没有用于封装的特殊语法。相反，我们通过仔细设计接口来实现封装，以确保对象对进出其信息具有完全的控制权。\n\
  \n封装极大地简化了编程团队的工作，因为每个类可以由不同的团队成员开发，而无需担心其他类是如何实现的。在一个大型项目中，封装允许程序员独立地处理不同的部分。只要每个类都符合其设计规范，这些独立的类就可以安全地相互作用。\n\
  \n我们所说的设计规范是什么？给定一个类的正式接口，设计规范是额外的书面文档，描述了该类在通过接口进行每种可能的交互时的行为。我们在这里必须非常明确，我们指的是解决问题的阶段。设计规范是陈述问题的一部分。它于实现阶段的规范文件（后者定义了类的接口）。取决于上下文，我们可能简单地将设计规范称为规范。\n\
  \n正式接口是我们定义如何调用方法的地方，而设计规范则是我们描述该方法将做什么的地方。你可以将正式接口视为类的语法，将规范视为其语义。根据定义，规范包含了正式接口。我们已经看到这些信息如何被写入前置条件和后置条件。\n\
  \n### 抽象\n\n封装是编程中抽象的基础。我们已经看到有两种类型的抽象：数据抽象和控制抽象。作为数据抽象的例子，考虑日期的外部表示可能是天和年的整数值，以及一个指定指定月份名称的字符串。但我们可以在类内部使用日历制作者者称为“儒略日”的标准值来实现日期，儒略日是自公元\
  \ 4713 年 1 月 1 日以来的天数。\n\n使用儒略日的优点是它简化了日期的算术，例如计算两个日期之间的天数。处理闰年和各月份不同天数的所有复杂性都包含在在传统日期表示和儒略日之间转换的公式中。然而，从用户的角度来看，`Date`\
  \ 对象的方法接收和返回日期时使用的是两个整数和一个字符串。**图 12.9** 显示了这两种实现，它们具有相同的外部抽象。\n\n在许多情况下，外部表示和内部表示是相同的。然而，我们不会告诉用户，因为我们可能希望在未来更改实现。例如，我们最初可能使用月、日、年的变量来开发\
  \ `Date` 类。以后，如果我们决定儒略日表示更高效，我们就可以重写实现。因为封装提供了数据抽象，这种更改不会影响客户端代码。\n\n这个示例也说明了控制抽象。假设\
  \ `Date` 类的规范说明它处理闰年规则。在儒略日实现中，只有转换公式处理这些规则；其他职责仅是对儒略日数字进行算术运算。\n\n用户可能会认为每个 `Date`\
  \ 职责都单独处理闰年。控制抽象让我们编写更高效的实现，然后向用户隐藏这些细节。\n\n![插图描述了日期类的两种实现的相同外部抽象。](img/9781284166033_CH12_FIGF12_9.jpg)\n\
  \n描述\n\n图 12.9 数据抽象允许相同的抽象具有不同的内部表示\n\n### 为可修改性和复用性进行设计\n\n应用抽象原则有两个额外好处：可修改性和复用性。\n\
  \n封装允许我们在初始开发之后修改类的实现。也许我们为了赶上截止日期，创建了一个简单但效率低下的实现。在维护阶段，我们用一个更高效的版本替换它。这种修改是检测不到，除了应用程序运行更快且所需内存更少之外。\n\
  \n封装类是自包含的，这意味着我们可以在其他应用程序中导入并使用它。复用也意味着类可以被扩展以形成新的相关类。例如，一家公用事业公司有一个管理其车队的软件。如**图\
  \ 12.10** 所示，描述 `Vehicle` 的类可以在多个应用程序中使用。每个应用程序都可以根据特定需求扩展 `Vehicle` 类。复用确保了对象在被使用的地方都具有一致的行为，这有助于避免错误。\n\
  \n当然，准备一个适用于更广泛复用的类需要我们跳出当前的情况。此类类应该提供某些基本服务，以便能够更通用地使用；例如，它应该拥有观察者，允许客户端代码从对象中检索我们认为可能有用的任何信息。\n\
  \n\n\n\n\n并不是所有的类都需要设计为通用复用而设计。在某些情况下，我们只需要一个针对当前问题具有特定属性且不会在其他地方使用的类。然而，如果你正在设计一个可能在其他情况下使用的类，那么让它变得更具通用性是一个好主意。\n\
  \n请记住，尽管 C++ 的类结构提供了一种 `support`（支持）封装的机制，但如何使用这种能力来实现真正的封装取决于程序员。C++ 中并没有某种关键字或结构可以将一个类标记为已封装的。相反，程序员必须以某种方式在类周围划定边界，将其他代码排除在之外。\n\
  \n![名为 Vehicle 的类例中的复用概念。](img/9781284166033_CH12_FIGF12_10.jpg)\n\n描述\n\n图 12.10\
  \ 复用\n\n我们可以划分两种边界：物理边界和视觉边界。我们可以通过将成员声明为 `private` 来从物理上阻止用户访问类的成员，也可以通过恰当使用头文件和实现文件，使类的实现对用户不可见。\n\
  \n### 可变性\n\n`immutable`（不可变）对象在实例化后无法被更改；`mutable`（可变）对象至少有一个函数（方法）允许客户端更改对象中数据成员的值。`Mutability`（可变性）是对象接口的一个关键特征。尽管不可变对象由于对更改具有免疫而天然是封装的，但我们必须特别注意以确保可变对象保持封装。\n\
  \n我们的 `TimeOfDay` 类是不可变的，因为它没有一个方法允许客户端更改它的任何一个值。如果 `Increment` 函数实际上更改了它所作用的实例，那么该类将是可变的。\n\
  \n让我们来看一个可变对象的示例。假设我们正在为一家医院创建一个出生记录数据库。出生记录是一个包含以下信息的对象：\n\n**出生记录**\n\n- 出生日期\n\
  - 出生时间\n- 母亲姓名\n- 父亲姓名\n- 婴儿姓名\n- 婴儿体重\n- 婴儿长度\n- 婴儿性别\n\n护士在婴儿出生后不久会将这些信息输入数据库。在某些情况下，父母可能还没有为婴儿起好名字。为了不让护士等待，数据库允许输入所有其他信息，并创建一个姓名为空字符串的\
  \ `Birth Record` 对象。稍后，当名字选好后，护士会在数据库中更改姓名。\n\n更改此数据库记录有两种方法。一种是调用一个直接更改婴儿姓名字段值的方法。例如，我们可以这样写该函数：\n\
  \n![一个函数。](img/9781284166033_CH12_P712-1.jpg)\n\n给定一个名为 `newBaby` 的 `BirthRecord`\
  \ 类实例，我们可以通过以下语句调用此方法：\n\n![一个语句。new Baby，点，Set Baby Name，左括号，Some Name，右括号，分号。两个正斜杠。更改婴儿姓名字段。](img/9781284166033_CH12_P712-2.jpg)\n\
  \n描述\n\n这种方法被称为转换器（transformer）或变动器（mutator）。拥有转换器使 `Birth-Record` 成为一个可变类。注意，没有特殊的\
  \ C++ 语法来表示 `SetBabyName` 是一个转换器。相反，一个方法之所以是转换器，仅仅是因为它的功能：它更改了存储在现有对象中的信息。我们只有通过在头部中使用\
  \ `const` 才能确保一个方法`不是`转换器。\n\n直接将 `babysName` 字段设为 `public` 并在不调用方法的情况下为其分配新值不是更简单吗？是的，但那样会破坏\
  \ `BirthRecord` 类的封装。通过转换器进行更改保留了封装，因为它允许我们使用数据和控制抽象。例如，我们以后可以增强这个转换器，以检查新名字是否只包含字母。\n\
  \n或者，我们可以让 `BirthRecord` 成为一个不可变类。对于这种设计，我们使用信息、旧记录和新名字来创建一个新记录。例如，我们使用信息、旧记录和新名字创建一个新记录。\n\
  \n```cpp\nnewBaby.setName(\"Some Name\");\n```\n\n## 12.6 姓名 ADT\n\n我们已经展示了 `TimeOfDay`\
  \ 并将其实现为 C++ 类。现在，让我们来看另一个将有用的 ADT：姓名（Name）。\n\n在第 4 章中，我们以不同的格式显示了姓名。在第 9 章中，我们使用了姓名。让我们停止这种重复并一劳永逸地解决它——作为一个抽象数据类型。这里给出了\
  \ ADT 的非正式规范：\n\n**TYPE** Name\n\n**DOMAIN** 每个姓名包含名、中间名和姓。\n\n**OPERATIONS**\n\
  - 构造一个姓名\n- 检查名\n- 检查中间名\n- 检查姓\n- 检查中间名首字母\n- 比较两个姓名的“之前”、“相同”和“之后”\n\n注意，没有输出姓名的操作。由于我们允许用户检查姓名的部分，他们可以根据需要组合这些部分。\n\
  \n我们分两个阶段创建 Name ADT：规范和实现。第一阶段的结果是 C++ 规范文件（.h），包含了 `Name` 类的声明。该文件必须描述每个 ADT 操作的语义。\n\
  \n第二阶段——实现——要求我们 (1) 为姓名选择具体的数据表示，以及 (2) 将每个操作实现为 C++ 函数。其结果是 C++ 实现文件（.cpp）。\n\n\
  ### ADT 规范\n\n`Name` ADT。我们的 ADT 域是所有由名、中间名和姓组成的姓名集合。为了将 Name ADT 表示为程序代码，我们使用名为\
  \ `Name` 的 C++ 类。ADT 操作变为类的公共成员函数。现在让我们更仔细地指定这些操作。\n\n#### **构造姓名实例**\n\n我们使用 C++\
  \ 默认构造函数来创建 ADT 的实例。`TimeOfDay` 的默认构造函数将小时、秒和分钟设置为零。空白对于 `Name` 类来说是逻辑等价。\n\n参数化构造函数必须为此操作提供三个参数：名、中间名和姓。虽然我们尚未确定姓名的具体数据表示，但必须决定客户端应该对这些参数使用什么数据类型。逻辑选择是每个值都由字符串表示。但如果我们想在构造后更改姓名呢？让我们不允许用户这样做；也就是说，让\
  \ `Name` 成为一个不可变类。\n\n#### **检查姓名的名、中间名和姓**\n\n这三个操作都是观察者操作。它们允许客户端间接访问私有数据。在 `Name`\
  \ 类中，我们将这些操作表示为具有以下原型的返回值的成员函数：\n\n\n\n\n\n![3 个原型声明。第 1 行：string, Get First Name,\
  \ 左括号, 右括号, 分号。第 2 行：string, Get Middle Name, 左括号, 右括号, 分号。第 3 行：string, Get Last\
  \ Name, 左括号, 右括号, 分号。](img/9781284166033_CH12_P720-1.jpg)\n\n### 检查中间首字母\n\n此操作返回中间名的首字母。我们应该将其作为\
  \ `string` 还是 `char` 变量返回？这并不重要，只要我们在代码和文档中保持一致即可。让我们把它成为一个 `char` 函数。\n\n### 比较两个名字\n\
  \n此操作比较两个名字，并确定第一个名字在第二个名字之前、两个名字相同，还是第一个名字在第二个名字之后。为了表示比较的结果，我们使用了在 `TimeOfDay`\
  \ 类中用过的枚举类型：\n\n![一个语句。enum, Relation Type, 左大括号, BEFORE, 逗号, SAME, 逗号, AFTER, 右大括号,\
  \ 分号。](img/9781284166033_CH12_P720-2.jpg)\n\n然后我们可以将比较操作编码为成员函数，返回一个 `RelationType`\
  \ 类型的值。以下是该函数原型：\n\n![一个函数原型。Relation Type, Compared To, 左括号, Name, other Name,\
  \ 右括号, const, 分号。](img/9781284166033_CH12_P720-3.jpg)\n\n描述\n\n注意，与 `otherName`\
  \ 进行比较的名字是调用该成员函数的对象（实例）。例如，以下客户端代码测试了 `name1` 是否在 `name2` 之前：\n\n![一段代码片段。](img/9781284166033_CH12_P720-4.jpg)\n\
  \n描述\n\n![一段代码片段。](img/9781284166033_CH12_P721-1.jpg)\n\n描述\n\n我们现在几乎准备好为 `Name`\
  \ 类编写 C++ 规范文件了。然而，类声明我们需要包含私有部分——即作为 ADT 具体数据表示的私有变量。正确选择具体的数据表示属于 ADT 的实现阶段，而不是规范阶段。但是，为了满足\
  \ C++ 类声明的要求，我们现在选择了一种数据表示。名字最简单的表示方法是三个 `string` 值——每个名、中间名和姓各一个。这里是包含 `Name` 类声明的规范文件。\n\
  \n![一段程序段。](img/9781284166033_CH12_P721-2.jpg)\n\n描述\n\n![一段程序段的延续。](img/9781284166033_CH12_P722-1.jpg)\n\
  \n描述\n\n注意，我们在观察者函数名称使用了“Get”一词。我们在 `TimeOfDay` 类中也是这样做的。将“Get”作为字段名的的前缀是许多程序员使用的面向对象的约定。对于改变字段值的转换器，相应的名称是在字段名前面加上“Set”。事实上，许多程序员通泛地将这类操作称为\
  \ *getters*（访问器）和 *setters*（存器）。\n\n### 实现文件\n\n我们已经为名字选择了具体的数据表示，在规范文件中显示为字符串变量\
  \ `first`、`middle` 和 `last`。现在我们实现每个类成员函数，将定义存放在名为 `Name.cpp` 的 C++ 实现文件中。除了 `ComparedTo`\
  \ 函数外，所有函数的实现都非常直观，因此不需要讨论。\n\n要比较两个名字，我们首先看姓氏。如果姓氏不同，我们就决定哪个名字在字母顺序上靠前。如果姓相同，我们接着看名字。如果名字也相同，我们就必须看中间名。正如经常发生的那样，我们可以直接在函数中使用这种算法。\n\
