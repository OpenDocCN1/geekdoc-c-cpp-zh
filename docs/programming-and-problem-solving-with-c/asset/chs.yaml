  描述\n\n## 11.7 定义二维数组的另一种方法\n\n我们之前注意到，二维数组可以看作数组的数组。C++ 支持这种观点，意义在于一维数组的组件并不必须是原子的。组件本身可以是结构化的——结构体（structs）、类对象（我们将在第\
  \ 12 章中引入），甚至是数组。例如，我们的 `hiTemp` 数组可以如下声明：\n\n![数组声明的两个语句。](img/9781284166033_CH11_P638-3.jpg)\n\
