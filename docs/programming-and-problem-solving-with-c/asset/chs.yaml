  \n描述\n\n从技术上讲，表格中标记为 `float` 的项都应该应该是 `double`。这些库函数使用 `double` 精度浮点值执行工作。然而，由于类型强制转换，当你向它们传递\
  \ `float` 值时，这些函数也能正常工作。\n\n使用库函数非常简单。首先，你在程序顶部附近放置一个 `#include` 指令，并指定相应的头文件。该指令会导致\
  \ C++ 预处理器在程序中插入声明，为编译器提供有关该函数的一些信息。然后，每当你想要使用该函数时，只需进行函数调用即可。这是一个调用函数的示例程序及其输出：\n\
