  \ 0, 4) 的执行\n\n## 18.5 使用指针变量的递归\n\n输出一维数组的递归算法可以通过迭代更容易更容易实现。现在我们来看两个无法通过迭代更简单处理的算法：逆序打印链表和创建链表的重复副本。我们将链表的外部指针命名为\
  \ `listPtr`。\n\n### 逆序打印动态链表\n\n![显示链表中元素的图表。](img/9781284166033_CH18_p164-1.jpg)\n\
