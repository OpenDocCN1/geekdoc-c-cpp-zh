  \n描述\n\n章节开启页：© Joost Lagerweij/EyeEm/Getty Images。\n\n## 前言\n\n## 第七版简介\n\n《C C++\
  \ 编程与问题解决》（Programming and Problem Solving with C++）的前六版一直是美国最畅销的计算机科学教材之一。这些版本被广泛接受为\
  \ ACM/IEEE 推荐的入门计算机科学课程的模范教材。\n\n在本书的连续几个版本中，有一点没有改变：我们对学生的承诺。一如既往，我们的努力致力于让计算机科学中有时困难的概念对所有学生来说更易理解。本版《C\
  \ C++ 编程与问题解决》继续反映了我们的理念：教材应该像一本指南，开辟一条道路，引导读者穿过最初看起来可能难以导航的领域。\n\n## 第七版的改进\n\n\
  《C C++ 编程与问题解决》第七版继续提供涵盖内容适用于跨两个学期的教学，从而为学生提供更大的价值。\n\n我们意识到，自第六版出版以来，八年来发生了许多变化。智能手机和应用程序使用的增长在全球范围内引起了巨大的文化变革，并使许多技术过时或不再常见，因此我们审阅了全文，更新了语言以反映现代计算格局。因此，许多示例和类比都经过了调整或替换，以保持相关性。由于学生更多地接触小屏幕，阅读习惯也发生了变化，我们调整了每一章的写作风格，使其更加直接简洁。尽管文本发生了巨大变化，但教师会很高兴地知道，我们没有更改演示顺序，除了一些新的特殊特性。\n\
  \n新特性中最显著的是在每个章节的末尾引入了图形用户界面（GUI）作为可选部分，从关于程序输入的章节开始。大多数现代学生在进入我们的课程时，从未见过控制台输入/输出，那是\
  \ 20 世纪系统（互联网之前）的遗留。\n\nGUI I/O 不仅让当前学生更熟悉，其更高级的形式为引入事件处理提供了一种自然手段。当学生看到 GUI 小部件如何触发事件处理器时，它为处理多线程工作奠定了概念框架，而在多核处理器的世界里，多线程正成为解决计算问题中不可或缺的元素。通过这种方式，我们还预见到正在开发中的\
  \ ACM/IEEE 202X 课程标准中，对并行和分布式计算的早期重视将会增加。\n\n这些章节中的每一个都探讨了如何将一个问题解决案例研究程序从使用控制台\
  \ I/O 转换为使用 GUI 完成相同的任务。入门课程中教授的许多编程模式都是基于对自由格式控制台输入进行错误检查——而现代系统通过使用特殊的 GUI 小部件来防止错误输入，从而避免了这种错误检查。在我们可以借此简化案例研究代码或使用\
  \ GUI 增强其健壮性的地方，我们会特别指出这些改进。\n\n我们的 GUI 涵盖使用了流行的 `Qt` 系统，它适用于所有主流操作系统，并已针对多种语言进行了实现。我们在每个章节的源代码文件中提供了一个\
  \ C++ 头文件，该文件使用必要的默认值和一些基础小部件初始化环境，以便学生可以轻松编写最初仅依赖于简单函数调用的 GUI 程序。他们的程序随后能够显示看起来熟悉的输入对话框（用于是/否响应、数字、文本和文件选择器）以及显示文本输出的各种方式，所有这些都使用简单直观的调用。源代码可在\
  \ go.jblearning.com/PPS7e 获取。\n\n稍后，在涵盖了类和对象之后，我们通过循序渐进的过程，引入了创建自定义 GUI 的工具，包括用于触发事件的按钮。这些更高级的小部件和组件的使用说明了面向对象编程的力量。学生还将领略现代软件工程的风范，这在很大程度上依赖于创建一个类型转换链，以便一种类型的对象能够与存储在其他类型对象的信息协作。\n\
  \n我们希望教师会发现这些可选章节是有用的，作为将其课程转向更完全拥抱现代 GUI 模型的一步。\n\n在这一版中，我们还更新了涵盖内容，包含了自上一版出版以来出现的\
  \ C++ 标准特性，适用于编程的第一门课程。\n\n## 教学方法\n\n我们的方法一如既往，是提供概念的渐进分层，而不是堆砌可能让人目应从心的细节和相关的替代方案。例如，许多教材从介绍数值类型开始。相反，我们在第\
  \ 2 章中从 `char` 和 `string` 类型开始，这样学生就可以专注于构建执行基本输出的 C++ 程序的机制，并快速地获得一个可以运行的演示。一旦他们熟悉了基础知识，我们在第\
  \ 3 章中添加数值类型。通过将语句和程序语法的概念性障碍与涉及数值精度、符号位、类型转换的类型复杂性分开，我们让更多学生能够在课程早期取得成功。\n\n根据\
  \ Elliot Solay 对初级编程者的研究，我们继续最初仅使用 `If` 语句涵盖选择，并仅使用 `While` 语句涵盖循环。然而，由于许多教师喜欢将所有的选择控制结构和所有的循环控制结构放在一起，因此额外控制结构的章节紧随选择和循环章节之后。\n\
  \n同样，学生发现理解 `struct` 类型（具有可以混合类型的命名字段）比具有通常涉及算术表达式访问的索引的数组类型更容易。因此，第 10 章引入了 `struct`\
  \ 和 `union` 类型，而数组被推迟到第 11 章。我们还将在第 10 章中介绍指针和引用类型的简单用法，并推迟在第 11 章中使用指针处理动态数组，以便学生在处理堆上的值之前熟悉间接访问。\n\
  \n我们意识到许多学生是通过模仿现有解决方案来学习编程的，因此我们在每个章节中都包含了许多短示例程序。这些程序在比代码段更完整的上下文中展示了章节概念，并在介绍新概念后立即出现。我们还组织了章节，使得讨论在章节早期就能更快地从概念移动到实际应用，然后再进入相关概念。因此，章节提供了一系列具体的示例，作为通往主要案例研究路径上的中间站点。\n\
  \n## C++ 与面向对象编程\n\n\n\n\n一些教育者拒绝使用 `C` 和 `C++`，认为它们过于宽松，且太容易编写出晦涩、不可读的程序。我们的经验并不支持这一观点，只要对语言特征的使用模式恰当。`C`\
  \ 族允许简练、紧凑的编程风格，这一事实不能简单地归为“好”或“坏”。几乎任何编程语言都可以用来编写一种过于简练和聪明而导致难以理解的风格。虽然 `C` 族可能比其他语言更多地以此方式使用，但我们发现，通过对软件工程的细致指导，并使用直截、严谨且无复杂语言特征的编程风格，学生可以学会使用\
  \ `C++` 来产生清晰、可读的代码。\n\n必须强调的是，尽管我们使用 `C++` 作为教授计算机科学概念的工具，但本书并不是一本语言手册：它并没有试图涵盖\
  \ `C++` 语言的全部。相反，语言结构是与相应的理论同步引入的，以展示其实际应用。\n\n关于何时引入面向对象编程（`OOP`）主题，存在不同的观点。一些教育者主张从一开始就沉浸在\
  \ `OOP` 中，而另一些人（本书的预期读者）则倾向于一种更异化的方法，将函数化分解和面向对象设计都作为设计工具引入。《C++ 编程与问题解决》（第七版）的章节结构反映了向\
  \ `OOP` 的过渡方法。类和面向对象的术语在第 12 章中介绍，但继承、多态和面向对象设计被推到了第 15 章。中间的章节为学生提供了充足的时间和经验，让他们熟悉使用类的实践。\n\
  \n## 章节概要\n\n第 1 章旨在让学生与学科之间建立良好的良好关系。书中介绍了硬件和软件的基础知识，提出了计算机伦理问题，在“软件维护案例研究”中首次接触\
  \ `C++` 语法，并在“问题解决案例研究”中引入并强化了解决问题的技巧。\n\n第 2 章并没有立即用 `C++` 中提供的各种数值类型淹没学生，而是集中在两种类型上：`char`\
  \ 和 `string`。由于需要跟踪的数据类型较少，学生可以专注于整体程序结构，并更早地开始创建和运行简单的程序。第 3 章紧接着讨论了 `C++` 数值类型，然后开始涵盖算术表达式、函数调用和输出。与许多一次详细介绍所有\
  \ `C++` 数据类型和所有 `C++` 运算符的书不同，这两个章节仅关注 `int`、`float`、`char` 和 `string` 类型，以及基础算术运算符。对其他数据类型的讨论被推到了第\
  \ 10 章。\n\n输入和编程方法论是第 4 章的主要课题。书中解释了面向对象设计（`OOD`）与函数化分解之间的区别，然后更深入地介绍了函数化分解方法。因此，学生早早就获得了一个观点：广泛使用的有两种设计方法——而不只有一种——而且每种方法都有特定的用途。第\
  \ 4 章还涵盖了文件 I/O。对文件的早期引入允许分配需要样例数据文件的编程作业。这里首次引入了图形用户界面（`GUI`），带有用于文本输入和输出的对话框，以及用于文件和目录的选择器。选择器既避免了可能导致流失败的情况，又允许使用文件的完整路径，而不是控制台方法依赖于文件与可执行文件处于同一目录的方式。\n\
  \n第 5 章从控制流和分支的概念开始，然后进入关系和布尔运算。使用 `If-Then` 和 `If-Then-Else` 结构进行选择，展示了语句的物理顺序与逻辑顺序之间的区别。我们还开发了嵌套控制结构的概念。第\
  \ 5 章以一个长长的“测试与调试”部分结束，通过引入前置条件和后置条件扩展了模块化设计的讨论。算法走查和代码走查被引入为防止错误的手段，执行轨迹用于发现可能进入代码的错误。我们在这一部分还详尽地涵盖了数据验证和测试策略。在\
  \ `GUI` 部分，引入了用于输入数值的对话框，学生可以看到在小部件内设置范围限制如何避免了用自己的代码对输入进行范围检查的需求。我们还引入了一个返回 `Boolean`\
  \ 结果的是/否对话框。\n\n第 6 章致力于循环控制策略和使用 `While` 语句语法的循环操作。我们的方法不是引入多种语法结构，而是只使用 `While`\
  \ 语句来教授循环概念。在 `GUI` 部分，我们专注于进一步获得第 5 章中引入的控件经验。第 7 章随后涵盖了 `C++` 中剩余的“甜点类”控制结构（`Switch`、`Do-While`\
  \ 和 `For`），以及 `Break` 和 `Continue` 语句。就像它们的对应物，这些结构是锦上添花的。关于其他 `C++` 运算符的讨论也在本章，因为这些运算符有用但并非不可或。在\
  \ `GUI` 部分，我们看到文件选择器如何避免了检查文件是否存在。\n\n到第 8 章，学生已经习惯于将问题分解为模块并使用库函数，并且对编写自己的函数表示感兴趣。第\
  \ 8 章重点关注按值传递参数，并涵盖了函数调用中的控制流、参数、局部变量以及接口设计。接口设计的涵盖包含了接口文档中的前置条件和后置条件、控制抽象、封装以及实现的物理与概念隐藏。`GUI`\
  \ 部分引入了“新建文件”对话框，让用户创建输出文件。第 9 章扩展了第 8 章对函数的涵盖，包含了返回值函数、引用参数、作用域和生命周期、存根和驱动，以及关于接口设计的更多内容，包括副作用。由于第\
  \ 9 章到 11 章包含大量的编程概念，它们的 `GUI` 部分没有引入新控件；而是专注于使用已涵盖的组件重构案例研究。\n\n\n\n\n在第 11 章中，引入了数组这一同质数据结构，其组件通过位置而非名称访问。深入探讨了一维数组，包括结构体数组。关于\
  \ `C` 字符串、二维数组、三维数组和多维数组的内容完善了对数组类型的讨论。本章以在数组中使用指针以及数据的动态分配作为结束。\n\n第 12 章通过形式化抽象数据类型概念，为讨论\
  \ `class` 结构铺垫了基础。介绍了面向对象的编程术语，并强调了 `class`（类）与 `object`（对象）之间的区别。强调了良好的 `class`\
  \ 设计原则。介绍了规范文件和实现文件的使用，将其作为信息隐藏的一种形式。虽然在简短的示例中讨论并说明了可变性，但本章开发的所有`classes` 刻意设计为`immutable`的：在这个阶段，学生有足够的新软件设计概念需要消化，无需再加入这一维度。在\
  \ GUI 部分，我们看到了使用文件对话框的另一个示例，并介绍了时间选择器以及开发自定义控件的基础知识。然而，在下一章中，我们将反复演示可变的 `classes`。\n\
  \n第 13 章通过将 `list` 定义为一种抽象数据类型（ADT），整合了第 11 章和第 12 章的内容，该类型由一个包含 `array` 的 `class`\
  \ 实现。由于我们已经引入了 `classes` 和 `arrays`，从讨论的开始我们就可以清晰地区分 `arrays` 和 `lists`。`array`\
  \ 是内置的、固定大小的数据结构。`list` 是用户定义的、变长度结构，在本章中表示为一个 `length` 变量和一个绑定在 `class` 对象中的项的\
  \ `array`。在第 13 章中，我们为无序和已排序的 `list` ADT 设计了 `C++` `classes`，并将 `list` 算法编码为 `class`\
  \ 成员函数。GUI 部分说明了如何将常用组件组合到 `custom widget` 中，该控件可在书的在线代码文件中找到。我们的目标让学生看到他们在第 14\
  \ 到 16 章将努力的目标。第 14 章考察了数据的动态分配和释放。随后使用 `Pointers` 为来自第 13 章的无序和已排序 `list` ADT 提供动态链实现。现在学生已经有了一些使用\
  \ `objects` 的经验，GUI 部分能够引入事件和事件处理器。\n\n第 15 章将数据抽象和 `C++` `classes` 的概念扩展到面向对象软件开发的探索。引入了继承的概念，学生学习区分继承与组合。本章还引入了\
  \ `C++` `virtual functions`，它们支持以操作运行时绑定的形式实现多态。在第 4 章中简要介绍并在第 12 章中进一步发展的面向对象设计，在这里也进行了更深入的回顾。我们展示了从问题陈述到软件解决方案设计阶段的路线概述。随后我们在案例研究中遵循这一大纲，实现设计，并讨论测试策略。在\
  \ GUI 部分，学生将看到 `custom GUI` 是一个 `container object`，其他 `widget objects` 按特定布局添加到其中并连接到事件处理器上。通过这一章节，我们正在进入一个具有重要意义的新新领域，该领域展示了面向对象编程的威力。\n\
  \n第 16 章引入了 `C++` `templates`、`operator overloading`运算符重载）和异常处理。GUI 部分展示了 `custom\
  \ UI` 如何超越控制台输入，以用户自然的方式增强程序能力。第 17 章讨论了经典数据结构，并引入了它们的 `STL` 等效实现。使用了几个 `STL` 容器\
  \ `classes` 来重新实现之前章节中的程序。我们的最后一个 GUI 部分再次通过重构扑牌案例研究，展示了 `custom UI` 的优越性，当用户点击生成的\
  \ `list` 时显示卡片图像。\n\n第 18 章通过引入递归概念结束了全书。本章分为三部分：带有简单 `variables` 的递归、带有 `arrays`\
  \ 的递归以及带有 `pointers` 的递归。其组织方式允许教师根据喜好将所有递归作为一个独立主题涵盖，或者在介绍返回值函数、`arrays` 和 `pointers`\
  \ 的过程中逐一讲解。\n\n## 附加特性\n\n### 特殊章节\n\n五类功能与正文区别开来：\n\n*   `Theoretical Foundations`\
  \ 章节介绍了与计算机科学各个分支基础理论相关的材料。\n*   `Software Engineering Tips` 讨论了使程序更可靠、更健壮更高效的方法。\n\
  *   `Matters of Style` 解决了编码风格问题。\n*   `Background Information` 章节探索了增强学生通用知识的旁类问题。\n\
  *   `May We Introduce` 章节包含了布莱斯·帕斯卡、查尔斯·巴贝、埃达·洛夫莱斯、凯瑟·约翰、托尼·霍尔、凯瑟琳·麦纳尔蒂和格蕾斯·霍的传传。\n\
  \n每章开头列出学生的目标，分为两类：`knowledge goals` 和 `skill goals`。这些目标都在章末练习中得到强化和测试。\n\n###\
  \ 演示程序\n\n`demonstration programs` 比案例研究示例短且简单，为语法概念与应用之间提供了桥梁。每章现在包含了完整的 `demonstration\
  \ programs`，并穿插在新的语言主题中。所有这些程序可通过 `go.jble.com/PPS7e` 获取，以便学生实验并在项目中复用代码。\n\n###\
  \ 软件维护案例研究\n\n现代软件工程工作大部分涉及维护旧代码。鉴于这一事实，学生学习阅读、理解、扩展和修复现有程序的技能至关重要。这类技能在介绍课程中很少教授，因为重点往往是根据问题规范编写新程序。事实证明，这些维护技能实际上是成功编写新程序的重要方面：一旦编写了一定数量的代码，让其正确运行的过程在本质上等同于维护。这些案例研究旨在培养阅读、分解、修改和测试现有代码的技能。\n\
  \n### 问题解决案例研究\n\n问题解决通过案例研究演示效果。在每个 `Problem-Solving Case Studies` 中，我们提出一个问题并使用解决问题的技术开发手动解决方案。接下来，我们使用功能分解、面向对象设计或两者将解决方案扩展为算法；然后用\
  \ `C++` 编写该算法。我们展示了示例测试数据和输出，随后对彻底测试程序涉及的内容进行讨论。\n\n### 测试与调试\n\n`Testing and Debugging`\
  \ 章节位于每章案例研究之后，深入思考章节内容对于彻底测试程序的意义。这些章节以测试和调试提示列表结束。\n\n### 快速检查\n\n\n\n\n每个章节的末尾都有问题，用于测试学生对与章节目标相关的要点的记忆情况。学生在读到每个问题时，应该立即知道答案，然后通过查看章节末尾的答案进行验证。\n\
  \n### 考试准备习题\n考试准备习题旨在帮助学生准备考试。问题通常有客观答案，设计为仅需几分钟即可完成。\n\n### 编程热身练习\n编程热身练习为学生提供了编写\
  \ `C++` 代码段的经验。学生可以练习每个章节中的语法结构，而无须承担编写完整程序的负担。\n\n### 编程题\n编程题源自广泛的学科，要求学生设计解决方案并编写完整的程序。有些问题跨越多个章节，后续章节的`编程题`会要求学生使用新的结构或技术重新实现解决方案，以说明一个问题可以通过许多不同的方法来解决。\n\
  \n### 案例研究后续\n案例研究后续练习让学生有机会阅读案例研究代码或对其进行修改来回答问题，从而加强其软件维护技能。\n\n## 补充材料\n\n###\
