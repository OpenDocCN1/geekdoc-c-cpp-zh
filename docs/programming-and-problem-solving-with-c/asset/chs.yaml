  \ 4.85 需要四个输出位置，而不是三个。如果 `x` 包含值 4.85，则语句\n\n![上一个代码语句的输出。](img/9781284166033_CH03_PRE71.jpg)\n\
  \nDescription\n\n产生以下输出：\n\n![大浮点值的输出。](img/9781284166033_CH03_PRE72.jpg)\n\nDescription\n\
  \n在第三行中，`fieldwidth` 为 3 是不够的，字段会自动扩展以适应该数字。\n\n当我们处理浮点数的输出时，还会出现其他几个问题。首先，大的浮点值以科学\
  \ (E) 计数法输出。值 123456789.5 在某些系统上可能输出为\n\n![fixed 操纵符。](img/9781284166033_CH03_PRE73.jpg)\n\
  \nDescription\n\n你可以使用名为 `fixed` 的操纵符，强制所有后续的浮点输出以十进制形式而非科学计数法出现：\n\n![整数是如何打印的。](img/9781284166033_CH03_PRE119.jpg)\n\
  \n\n\n\nDescription\n\n输出：\n\n![上一个程序的输出。](img/9781284166033_CH03_UFIG122-2.jpg)\n\
  \nDescription\n\n## 3.8 额外的字符串操作\n\n现在我们已经引入了数值类型和函数调用，可以利用字符串数据类型的额外功能。在本节中，我们引入了四个操作字符串的函数：`length`、`size`、`find`\
  \ 和 `substr`。\n\n### length 和 size 函数\n\n`length` 函数应用于字符串变量时，会返回一个无符号整数值，该值等于字符串中当前的字符数量。如果\
  \ `myName` 是一个字符串变量，那么调用 `length` 函数的形式如下：\n\n![length 函数。](img/9781284166033_CH03_PRE80.jpg)\n\
  \nDescription\n\n你写下字符串变量的名字（这里是 `myName`），然后是一个点（句号），接着是函数名和参数列表。`length` 函数不需要参数，但你必须使用括号来表示空参数列表。此外，`length`\
  \ 是一个返回值的函数，因此函数调用必须出现在表达式中：\n\n![在表达式中调用 length 函数的代码。](img/9781284166033_CH03_PRE81.jpg)\n\
  \nDescription\n\n你可能在对如下函数调用中的语法感到好奇\n\n![length 函数。](img/9781284166033_CH03_PRE82.jpg)\n\
  \nDescription\n\n这个表达式使用了 C++ 中的一种记法“点表示法”（dot notation）。在变量名 `firstName` 和函数名 `length`\
  \ 之间有一个点（句号）。正如我们在第 1 章](#9781284166033_CH01.xhtml) 中提到的，C++ 是一种面向对象的语言。字符串类型是 C++\
  \ 对象类型示例，在调用与对象关联的函数时需要点表示法。假设你忘记使用点表示法，将函数调用写为\n\n```\n![length 函数。程序代码。第 1 行。length，左括号，右括号。](img/9781284166033_CH03_PRE83.jpg)\n\
  ```\n\n你将得到一个编译错误信息，类似于 `UNDECLARED IDENTIFIER`。编译器认为你正在尝试调用名为 `length` 的普通函数，而不是与字符串对象关联的\
  \ `length` 函数。在第 4 章](#9781284166033_CH04.xhtml) 中，我们将讨论 C++ 对象。目前只需要知道它们的函数调用使用点表示法即可。\n\
  \n有些人将字符串的长度称为 size。为了兼顾这两个术语，字符串类型提供了一个名为 `size` 的函数。`firstName.size()` 和 `firstName.length()`\
  \ 返回相同的值。\n\n`length` 和 `size` 函数返回类型为 `string::size_type` 的无符号整数值。然而，大多数 C++ 编译器允许你将结果赋值给类型为\
  \ `int` 的变量。^(4)\n\n![length 函数。](img/9781284166033_CH03_PRE84.jpg)\n\nDescription\n\
  \n在离开 `length` 和 `size` 函数之前，我们应该说明标识符的大小写规范。在第 2 章](#9781284166033_CH02.xhtml)\
  \ 提供的指南中，我们说本文程序员定义的函数和数据类型的名称以大写字母开头。在后面的章节中编写自己的函数和数据类型时，我们遵循这一约定。然而，我们无法控制 C++\
  \ 标准库提供的项目的大小写。标准库中的标识符通常使用全小写字母。\n\n### find 函数\n\n`find` 函数搜索字符串以找到特定子字符串的首次出现，并返回一个无符号整数值（类型为\
  \ `string::size_type`），表示搜索结果。作为参数传递给函数的子字符串可以是字面量字符串或字符串表达式。如果 `str1` 和 `str2`\
  \ 类型为 `string`，则以下所有调用都是有效的：\n\n![一些有效的 find 函数调用。](img/9781284166033_CH03_PRE85.jpg)\n\
  \nDescription\n\n在每种情况下，都会对 `str1` 进行搜索，查看其中是否可以找到指定的子字符串。如果是，函数将返回匹配在 `str1` 中开始的位置。（位置从\
  \ 0 开始编号，因此字符串中的第一个字符在位置 0，第二个字符在位置 1）。\n\n\n\n\n\n| 函数调用 | 函数返回值包含的字符串 |\n| ---\
  \ | --- |\n| `myString.substr(0, 7)` | \"Program\" |\n| `myString.substr(7, 8)`\
  \ | \"ming and\" |\n| `myString.substr(10, 0)` | \"\" |\n| `myString.substr(24,\
  \ 40)` | \"Solving\" |\n| `myString.substr(40, 24)` | 无；程序带有执行错误消息终止 |\n\n在第三个示例中，指定长度为\
  \ `0` 会产生空字符串作为结果。第四个示例显示了如果第二个参数指定的字符数多于起始位置之后的字符数会发生什么：`substr` 返回从起始位置到字符串末尾的字符。最后一个示例说明了第一个参数（位置）不能超出字符串的末尾。\n\
  \n由于 `substr` 返回一个 `string` 类型的值，你可以使用连接运算符（`+`）来复制字符串片段并将它们连接在一起形成新字符串。`find` 和\
  \ `length` 函数在确定字符串片段的位置和结束位置时非常有用，可以作为参数传递给 `substr`。\n\n这是一个使用 `find` 和 `substr`\
  \ 将字符串拆分为若干部分的程序。\n\n![一个使用 find 和 substr 将字符串拆分为部分的程序。](img/9781284166033_CH03_UFIG129-1.jpg)\n\
  \n描述\n\n输出：\n\n![使用 find 和 substr 将字符串拆分为部分的程序的输出。](img/9781284166033_CH03_UFIG129-2.jpg)\n\
  \n描述\n\n该程序使用 `find` 定位第一个空格，并使用 `substr` 提取从第一个字符开始到紧邻第一个空格之前的子字符串。该子字符串存储在 `firstName`\
  \ 中。原始字符串被重新定义为包含从第一个空格之后到末尾的字符串。重复此过程以提取中间名。剩余字符串存储在 `lastName` 中。这个过程似乎很微不足道——毕竟，我们完全可以直接创建三个独立的字符串。然而，在第\
  \ 4 章中，当我们研究如何从键盘读取字符串时，这种通用算法将证明对于将输入字符串拆分为不同的部分非常有用。\n\n### 访问字符串内部字符：at 函数\n\n\
  有时，直接通过位置访问字符会非常有用。C++ 允许我们使用 `at` 函数来实现。这里是该函数的一个示例调用：\n\n![调用 at 函数的代码。](img/9781284166033_CH03_PRE92.jpg)\n\
  \n描述\n\n请记住，在字符串内部，第一个字符位于位置 `0`。因此，`somePosition` 的值必须大于或等于 `0` 且小于或等于字符串长度减 `1`。例如，如果\
  \ `inputStr` 是一个字符串对象，而 `letter` 是一个 `char` 变量，该语句\n\n![调用 at 函数的代码。](img/9781284166033_CH03_PRE93.jpg)\n\
  \n描述\n\n访问字符串位置 `2` 处的字符（第三个字符）并将其复制到 `letter` 中。调用 `at` 时如果传入允许范围之外的值将产生错误消息。\n\
  \n### 转换为小写和大写字母\n\n在处理字符数据时，你有时可能会发现需要将小写字母转换为大写字母，反之亦然。幸运的是，这种转换很容易——只需调用库函数即可。通过头文件\
  \ `<cctype>`，标准库提供了两个名为 `toupper` 和 `tolower` 的返回值的函数。以下是它们的描述：\n\n![详细列出转换为小写和大写字母函数的表格。](img/9781284166033_CH03_UTAB130-1.jpg)\n\
  \n描述\n\n如果不符合条件，每个函数返回的值只是原始字符。例如，`tolower('M')` 返回字符 `'m'`，而 `tolower('+')` 返回\
