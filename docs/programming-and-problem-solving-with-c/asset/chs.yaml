  \n描述\n\n在我们介绍该程序时，说这三个函数都是有返回函数。`Square` 向调用者返回一个值——传入数字的平方。（此处省略后续重复段落）\n\n\n\n\
  \n\n![包含函数调用的函数参数](img/9781284166033_CH03_PRE56.jpg)\n\n描述\n\n### 库函数\n\n某些计算（如平方根和绝对值）在程序中非常常见。如果每个程序员都必须从头开始创建此类函数，将浪费时间。为了让我们的生活更轻松，每个\
  \ C++ 系统都包含一个标准库——这是一个预写函数、数据类型和其他项目的巨大集合，我们可以直接使用。库中的函数被分成独立的文件，称为头文件。这里是一些标准库函数的一个微小示例：\n\
