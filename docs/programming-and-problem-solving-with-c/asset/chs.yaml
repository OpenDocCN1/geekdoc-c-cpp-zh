  \n描述\n\n### 结构体的聚合操作\n\n除了访问 `struct` 变量的各个组件外，在某些情况下我们还可以使用`聚合操作`。聚合操作是将整个 `struct`\
  \ 视为一个整体并进行处理的操作。\n\n下表总结了 C++ 对 `struct` 变量支持的聚合操作：\n\n| 聚合操作 | 结构体支持？ |\n| :---\
  \ | :--- |\n| I/O | 否 |\n| 赋值 | 是 |\n| 算术 | 否 |\n| 比较 | 否 |\n| 参数传递 | 是，按值或按引用传递\
  \ |\n| 作为函数的返回值 | 是 |\n\n根据该表，一个 `struct` 变量可以赋值给另一个。然而，要这样做，两个变量都必须声明为相同类型。例如，给定以下声明\n\
