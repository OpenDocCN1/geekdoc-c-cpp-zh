  \ 类中方法的描述。(images/9781284166033_CH17_p1132-1.jpg)\n\n描述\n\n![Card Deck Main Window\
  \ 类中方法的延续。(images/9781284166033_CH17_p1133-1.jpg)\n\n描述\n\n### 测试与调试\n\n使用 STL 的优势之一是它提供的类和算法已经经过了详尽的测试。然而，很容易让这一事实给你一种虚假的安全感。在本章中，我们仅触及了\
  \ STL 的要部分；还有许多我们未见过的特性。例如，许多操作和构造函数被其他版本重载了，或者具有默认参数。编写调用时的错误可能不会触发编译器错误，而是调用了你不熟悉的某个操作版本。如果你将大量使用\
  \ STL，那么获取完整的 STL 参考文档，并花时间理解模板化函数和参数有时晦涩的表示法是非常关重要的。\n\n在测试使用容器的程序时，我们必须注意一些特殊情况。显然，尝试对空容器进行操作以及超出容器边界属于这些情况。还要注意每一步移动方向错误或跨距离错误的迭代器。在循环开始时从栈或队列中弹出第一个元素会导致等同于差一错误（off-by-one\
  \ error），因为容器的第一个元素永远不会被处理。请注意你正在使用的每种容器相关的特殊属性和边界条件，并花时间设计测试以确保你的代码没有无意中违反这些条件。\n\
  \n### 测试与调试提示\n\n1. 访问容器时，记住 `end` 和 `rend` 返回的值指向结构外部。\n2. 迭代器必须被解引用以获取它指向的值。\n\
  3. 声明迭代器时，记住它必须由它将指向的类型进行限定——例如，`list<string>::iterator`。\n4. 前向迭代器通过递增来前进，通过递减向后移动。反向迭代器在递增时向后移动。\n\
  5. 每当容器的底层结构发生变化时，其迭代器就会失效。在插入或删除操作后访问无效迭代器会导致错误。\n6. 每当你从容器中删除元素时，确保检查了它是否为空。\n\
  7. 请记住并非所有算法都适用于所有容器。请仔细检查文档。\n8. 在弹出栈或队列的顶部元素之前，记得先复制它。\n9. 选择一个具有你所需功能的容器。额外的能力通常会以性能为代价。\n\
  10. 许多容器要求用户定义的元素类型支持关系操作符的子集。确保你的类提供了这种支持。\n\n![书的第 18 章，标题为递归。背景图像显示了森林中的树。(images/Chapter-opener.jpg)\n\
  \n章节开启：© Joost Lagerweij/EyeEm/Getty Images。\n\n## 第 18 章：递归\n\n在 C++ 中，任何函数都可以调用另一个函数。函数甚至可以调用自己！当一个函数调用自己时，它正在进行一次**递归调用**。*recursive*（递归）一词意味着“具有再次出现或重复的特征”。在这种情况下，函数调用正被函数本身重复。递归是一种强大的技术，可以用来代替迭代（循环）。\n\
  \n递归解决方案通常比解决相同问题的迭代解决方案效率低。然而，某些问题非常适合简单、优雅的递归解决方案，而用迭代来解决则极其繁琐。某些编程语言（如早期版本的 Fortran、Basic\
  \ 和 COBOL）不允许递归。其他语言特别倾向于递归算法——LISP 就是其中之一。C++ 让我们自行选择：我们既可以实现迭代算法也可以实现递归算法。\n\n\
  我们的示例分为两组：仅使用简单变量的问题和使用结构化变量的问题。如果你在阅读第 11-16 章关于结构化数据类型之前学习递归，请只涵盖第一组示例，将其余部分留到完成结构化数据类型章节之后。\n\
  \n## 18.1 什么是递归？\n\n你可能见过一组相互套在一起的、色彩鲜艳的俄罗斯套娃。第一个俄罗斯娃娃里面是一个较小的俄罗斯娃娃，里面是一个更小的俄罗斯娃娃，里面又是一个更小的娃娃，依此类推。递归算法就像这样一组俄罗斯套娃。它通过越来越小的自身示例来复制自己，直到找到解决方案——也就是说，直到没有更多的套娃为止。递归算法通过使用一个对自己进行递归调用的函数来实现。\n\
  \n在第 9 章中，我们写了一个名为 `Power` 的函数，用于计算整数的正幂结果。如果 `X` 是整数且 `N` 是正整数，则 `X^N` 的公式为：\n\n\
  ![X 的 N 次幂的公式。(images/9781284166033_CH17_p1132-1.jpg)\n\n描述\n\n\n\n让我们追踪这个递归函数的执行过程，假设\
  \ `number` 等于 2，`exponent` 等于 3。我们使用一种新格式来追踪递归程序：对调用进行编号，然后以段落的形式讨论过程。\n\n*   调用\
  \ 1：`Power` 由 `main` 调用，`number` 等于 2，`exponent` 等于 3。在 `Power` 内部，参数 `x` 和 `n`\
  \ 分别初始化为 2 和 3。由于 `n` 不等于 1，递归调用 `Power` 并将 `x` 和 `n - 1` 作为参数。调用 1 的执行暂停，直到该递归调用返回答案。\n\
  *   调用 2：`x` 等于 2，`n` 等于 2。由于 `n` 不等于 1，再次调用函数 `Power`，这次将 `x` 和 `n - 1` 作为参数。调用\
  \ 2 的执行暂停，直到该递归调用返回答案。\n*   调用 3：`x` 等于 2，`n` 等于 1。由于 `n` 等于 1，将返回 `x` 的值。该函数调用执行完毕，函数返回值（为\
  \ 2）传回语句中调用发生的地方。\n*   调用 2：现在该函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用 3 的返回值（为 2）乘以 `x`。该函数调用执行完毕，函数返回值（为\
  \ 4）传回语句中调用发生的地方。\n*   调用 1：现在该函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用 2 的返回值（为 4）乘以 `x`。该函数调用执行完毕，函数返回值（为\
  \ 8）传回语句中调用发生的地方。由于第一次调用（`main` 中的非递归调用）现在已完成，这就是函数 `Power` 的最终值。\n\n此追踪追踪过程在图 18.1\
  \ 中进行了总结。每个框代表对 `Power` 函数的调用。该调用的参数值显示在每个框中。\n\n![一张描述函数 2 的 3 次幂如何执行的图。](img/9781284166033_CH18_FIGF18-1.jpg)\n\
  \n**图 18.1 Power(2,3) 的执行**\n\n描述\n\n## 如果没有边界情况会发生什么？\n\n我们将无限递归，即无限循环的递归等。例如，如果条件\n\
  \n![一个条件语句。](img/9781284166033_CH18_p1148-1.jpg)\n\n描述\n\n被省略，`Power` 将被反复调用。如果调用\
  \ `Power` 时 `n` 小于或等于 0，也会发生无限递归。\n\n实际上，递归调用不能永远进行。原因如下：当函数被调用时（无论是递归还是非递归），计算机系统都会为参数和函数的（自动）局部变量创建临时存储。这种临时存储是一个称为运行时栈（run-time\
  \ stack）的内存区域。当函数返回时，它的参数和局部变量从运行时栈中释放。在无限递归中，递归函数调用永远返回。函数每次调用自己，都会使用更多的运行时栈来存储变量的新副本。\n\
  \n最终，栈上的所有内存空间都会被用尽。此时，程序将崩溃并显示类似“运行时栈溢出”（Run-time stack overflow）的错误信息（或计算机直接死机）。\n\
  \n## 18.2 使用简单变量的递归算法\n\n让我们另一个例子：计算阶乘。数字 *N* 的阶乘（写作 *N*!）是 *N* 乘以 *N* − 1、*N* −\
  \ 2、*N* − 3 等等。阶乘的另一种表达方式是\n\n![一个计算数字阶乘的递归算法。](img/9781284166033_CH18_p1149-1.jpg)\n\
  \n描述\n\n这个表达式看起来像是一个递归定义。(*N* − 1)! 是 *N*! 的一个较小实例——也就是说，计算 (*N* − 1)! 所的乘法次数比计算\
  \ *N*! 少。如果我们能找到边界情况，就可以编写递归算法。幸运的是，我们不需要找太远：数学上定义 0! 为 1。\n\n![一个计算数字阶乘的递归算法。](img/9781284166033_CH18_p1149-2.jpg)\n\
  \n描述\n\n该算法可以直接编码如下：\n\n![递归阶乘函数的代码。](img/9781284166033_CH18_p1150-1.jpg)\n\n描述\n\
  \n让我们追踪原始 `n` 为 4 的函数：\n\n*   调用 1：`n` 等于 4。由于 `n` 不等于 0，执行 `else` 分支。在递归调用 `Factorial(n\
  \ - 1)` 完成之前，`Return` 语句无法完成。\n*   调用 2：`n` 等于 3。由于 `n` 不等于 0，执行 `else` 分支。在递归调用\
  \ `Factorial(n - 1)` 完成之前，`Return` 语句无法完成。\n*   调用 3：`n` 等于 2。由于 `n` 不等于 0，执行 `else`\
  \ 分支。在递归调用 `Factorial(n - 1)` 完成之前，`Return` 语句无法完成。\n*   调用 4：`n` 等于 1。由于 `n` 不等于\
  \ 0，执行 `else` 分支。在递归调用 `Factorial(n - 1)` 完成之前，`Return` 语句无法完成。\n*   调用 5：`n` 等于\
  \ 0。由于 `n` 等于 0，返回 1。\n*   调用 4：现在该函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用 5 的返回值（为 1）乘以\
  \ `n`。该函数调用执行完毕，函数返回值（为 2）传回语句中调用发生的地方。\n*   调用 3：现在该函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用\
  \ 4 的返回值（为 2）乘以 `n`。该函数调用执行完毕，函数返回值（为 6）传回语句中调用发生的地方。\n*   调用 2：现在该函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用\
  \ 3 的返回值（为 6）乘以 `n`。该函数调用执行完毕，函数返回值（为 24）传回语句中调用发生的地方。\n*   调用 1：现在该函数调用可以完成包含该递归调用的语句，因为递归调用已经返回。调用\
  \ 2 的返回值（为 24）乘以 `n`。该函数调用执行完毕，函数返回值（为 24）传回语句中调用发生的地方。由于第一次调用（`main` 中的非递归调用）现在已完成，这就是函数\
  \ `Factorial` 的最终值。\n\n\n\n\n![阶乘函数的递归解。](img/9781284166033_CH18_p1151-2.jpg)\n\n\
  描述\n\n迭代版本有两个局部变量，而递归版本没有。通常，递归程序中的局部变量比迭代程序要少。此外，迭代版本总是包含循环，而递归版本总是包含选择语句——要么是\
  \ `If` 要是 `Switch`。分支结构是递归程序中的主要控制结构。循环结构是迭代程序中的主要控制结构。\n\n在下一节中，我们将研究一个更复杂的问题——一个递归解决方案并不显而易见的问题。\n\
  \n## 18.3 汉诺塔\n\n你最早拥有的玩具之一可能是三个带有不同直径的彩色圆圈的木桩。如果是这样，你可能花费了无数小时将圆从一个木桩移动到另一个木桩。如果我们对圆或圆盘的移动设定一些限制，就有了一个名为汉诺塔的成人游戏。游戏开始时，所有的圆按大小从小到大排列在第一个木桩上，最小的在最上方。游戏的目标是一个次移动一个圆到第三个木桩。难之处在于，圆不能放在直径比它小的圆上面。中间的木桩可以作为辅助木桩，但它在游戏开始和结束时必须是空的。\n\
  \n为了感受一下如何实现这一点，让我们看看在存在解决方案的情况下，某些时刻必须的配置草图。我们使用四个圆圈或圆盘。这是初始配置：\n\n![汉诺塔游戏的初始配置。](img/9781284166033_CH18_p1152-1.jpg)\n\
  \n描述\n\n为了将最大的圆（4 号圆）移动到木桩 3，我们必须将三个较小的圆移动到木桩 2。然后 4 号圆就可以移动到它的最终位置：\n\n![汉诺塔游戏所需的第一步。](img/9781284166033_CH18_p1152-2.jpg)\n\
  \n描述\n\n假设我们可以做到这一点。现在，为了将下一个大圆（3 号圆）移到位，我们必须将它上面的两个圆移动到辅助木桩（在这种情况下是木桩 1）：\n\n![汉诺塔游戏的下一步。](img/9781284166033_CH18_p1152-3.jpg)\n\
  \n描述\n\n为了让 2 号圆移动到位，我们必须将 1 号圆移动到另一个木桩，从而释放 2 号圆使其移动到木桩 3 的位置：\n\n![汉诺塔游戏的下一步。](img/9781284166033_CH18_p1153-1.jpg)\n\
  \n描述\n\n现在最后一个圆（1 号圆）可以移动到它的最终位置，我们完成了：\n\n![汉诺塔游戏的最后一步。](img/9781284166033_CH18_p1153-2.jpg)\n\
  \n描述\n\n注意，为了释放 4 号圆，我们需要将三个圆移动到另一个木桩。为了释放 3 号圆，我们必须将两个圆移动到另一个木桩。为了释放 2 号圆，我们必须将一个圆移动到另一个木桩。这听起来像是一个递归算法：为了释放第\
  \ *n* 个圆，我们必须移动 *n - 1* 个圆。每个阶段都可以被看作是从三个木桩重新开始，但每次都少一个圆。让我们看看是否能用 *n* 代替具体的数字来总结这个过程。\n\
  \n### 将 *n* 个圆从木桩 1 移动到木桩 3\n\n1. 将 *n–1* 个圆从 `peg1` 移动到 `peg2`\n2. 将第 *n* 个圆从 `peg1`\
  \ 移动到 `peg3`\n3. 将 *n–1* 个圆从 `peg2` 移动到 `peg3`\n\n这个算法听起来确实非常简单；肯定还有更多内容。但这实际上就是全部了。\n\
  \n让我们写一个实现该算法的递归函数。当然，我们实际上无法移动圆盘，但我们可以显示一条消息来这样做。注意，在算法过程中，起始木桩、结束木桩和辅助木桩一直在变化。为了让算法更容易理解，我们将木桩标记为\
  \ `beginPeg`、`endPeg` 和 `auxPeg`。这三个木桩加上起始木桩上圆的数量，就是该函数的参数。\n\n我们有递归情况（或一般情况），但基准情况（base\
  \ case）呢？我们如何知道何时停止递归过程？线索在“移动 *n* 个圆”这句话中。如果 *n* 为 0，我们就停止。\n\n注意，为了释放 4 号圆，我们需要将三个圆移动到另一个木桩。为了释放\
  \ 3 号圆，我们必须将两个圆移动到另一个木桩。为了释放 2 号圆，我们必须将一个圆移动到另一个木桩。这听起来像是一个递归算法：为了释放第 *n* 个圆，我们必须移动\
  \ *n - 1* 个圆。每个阶段都可以被看作是从三个木桩重新开始，但每次都少一个圆。让我们看看是否能用 *n* 代替具体的数字来总结这个过程。\n\n![汉诺塔的输出。](img/9781284166033_CH18_p1154-2.jpg)\n\
