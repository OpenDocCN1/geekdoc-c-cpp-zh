  此声明创建了一个名为 `value` 的数组，包含 1000 个组件，类型均为 `int`。第一个组件的索引为 0，第二个组件的索引为 1，最后一个组件的索引为\
  \ 999。\n\n这里是使用数组表示法的 `ReverseNumbers` 程序。它显然比我们的第一个版本短得多。\n\n![程序段。](img/9781284166033_CH11_P591-3.jpg)\n\
  \n描述\n\n为了节省空间，这里是数组大小为 10 的程序版本的输入和输出：\n\n![一个具有 2 列的表格。](img/9781284166033_CH11_P592-1.jpg)\n\
  \n描述\n\n作为数据结构，数组与结构体（struct）有两个根本不同之处：\n\n1. 数组是*同质*数据结构（它的所有组件都是相同的数据类型），而结构体是异质的（它的组件可以是不同的类型）。\n\
  2. 数组组件通过*位置*访问，而结构体组件通过成员名称访问。\n\n现在让我们正式地定义数组，并查看访问单个组件的规则。\n\n### 声明数组\n\n**一维数组**是组件的结构化集合（通常称为*数组元素*），通过指定组件的索引值（位置）来单独访问它们。\n\
  \n下面是描述一维数组声明简单形式的语法模板：\n\n![数组声明的语法。数据类型, 数组名称, 左方括号, 常量整数表达式, 右方括号, 分号。](img/9781284166033_CH11_P592-2.jpg)\n\
  \n在语法模板中，`DataType` 描述了数组每个组件中存储的内容。数组组件可以是几乎任何类型，但目前我们将讨论限制在原子组件。\n\n![带有 4 个数组组件堆的\
  \ angle 数组和带有 10 个数组组件堆的 testScore 数组。](img/9781284166033_CH11_FIGF11_1.jpg)\n\n\
  描述\n\n图 11.1 angle 和 testScore 数组\n\n在语法模板中，`ConstIntExpression` 是仅由字面量或命名常量组成的整数表达式。该表达式指定数组组件的数量，其值必须大于\
  \ 0。如果值为 `n`，则索引值的范围是从 0 到 `n` − 1，而不是从 1 到 `n`。例如，以下声明：\n\n![程序代码。第 1 行: float,\
  \ angle, 左方括号, 4, 右方括号, 分号。第 2 行: int, testScore, 左方括号, 10, 右方括号, 分号。](img/9781284166033_CH11_P593-1.jpg)\n\
  \n创建了**图 11.1**所示的数组。`angle` 数组有四个组件，每个都可以存储一个 `float` 值。`testScore` 数组总共有 10 个组件，类型均为\
  \ `int`。\n\n### 访问数组的单个组件\n\n正如我们所看到的，要访问数组组件，我们在数组名称后写一个方括号内的表达式。该表达式指定了要访问的组件。\n\
  \n![标记为数组组件访问的表达式。数组名称, 左方括号, 索引表达式, 右方括号。](img/9781284166033_CH11_P593-2.jpg)\n\
  \n索引表达式可以简单的常量，也可以是变量、运算符和函数调用的组合，只要它的结果是一个整数值即可。索引表达式的类型可以是 `char`、`short`、`int`、`long`\
  \ 或 `bool`，因为这些都是整数类型。此外，枚举类型的值也可以用索引表达式，枚举值会被隐式地转换为整数。\n\n![带有四个值堆的 angle 数组。](img/9781284166033_CH11_FIGF11_2.jpg)\n\
  \n图 11.2 带有值的 angle 数组\n\n描述\n\n最简单的索引表达式是常量。使用我们的 `angle` 数组，赋值语句的序列如下：\n\n![angle\
  \ 数组的赋值语句。](img/9781284166033_CH11_P594-1.jpg)\n\n描述\n\n\n\n当 `i` 小于 0 或大于 99 时会怎样？会访问数组外部的内存位置。C++\
  \ 不检查无效的（越界）数组索引。如果前一条语句中的 `i` 恰好是 100，计算机会将 62.4 放入数组末尾之后的下一个内存位置，破坏该处原有的任何内容。确保索引表达式保持在数组范围内是你的责任。越界访问可能会产生极难调试的错误，还可能为在线系统的漏洞提供机会。\n\
  \n数组处理算法通常使用 `For` 循环来逐个遍历元素。这里有一个将我们的包含 100 个元素的 `alpha` 数组置零循环（`i` 是一个 `int` 变量）：\n\
  \n![一个 for 循环语句。](img/9781284166033_CH11_P596-1.jpg)\n\n描述\n\n我们也可以将第一行写为：\n\n![一个\
  \ for 循环语句。for, 左括号, i 等于 0, 分号, i, 左尖角等于, 99, 分号, i ++,, 右括号。](img/9781284166033_CH11_P596-2.jpg)\n\
  \n然而，C++ 程序员通常更倾向于使用第一个版本，以便循环测试中的数字（100）与数组大小相同。使用这种模式时，请始终记住测试的是*小于*，而不是小于等于。\n\
