  \n描述\n\n那么，根据 C++ 运算符优先级，`x` 没有被赋值 `y` 的值。相反，它被赋值为 1 或 0（关系表达式 `y < z` 布尔结果的强制转换值）。\n\
  \n2. 如果你的程序增加了正整数的值而结果突然变成了负数，你应该怀疑发生了整数溢出。在大多数计算机上，对 `INT_MAX` 加 1 会产生 `INT_MIN`，这是一个负数。\n\
  \n3. 考虑使用枚举类型使你的程序更具可读性、易理解性和可修改性。\n\n\n\n一维数组变量的声明指定了数组中数值的数据类型、变量名称以及数组的大小——即它能容纳的值的数量。例如：\n\
