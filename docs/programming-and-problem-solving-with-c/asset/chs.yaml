  \n\n\n\n你会注意到，我们在这个小部件使用了网格布局（grid layout），这样我们就可以将标识标签放置在显示总重量和重心的标签旁边。用于设置成员变量的方法会将每个\
  \ `float` 参数转换为 `QString`，并设置相应标签的文本以便渲染到屏幕上。\n\n剩下的两个部件并不那么简单。你可能已经注意到，我们还没有处理过任何应用程序状态（人员列表）或事件（点击按钮）。这是因为这些都由表单部件（form\
  \ widgets）处理了。我们需要一个表单来输入乘客和机组员信息，另一个用来输入行李舱重量和燃料。我们将首先通过绘制表单外观的草图来开始研究前者。图 16.4\
  \ 展示了一个基础设计，其中每个表单部件都大致位于我们计划添加到乘客/机组员输入表中的位置。\n\n除了底部的按钮外，所有的表单部件在左侧都有标签，用于标识其右侧部件的用途。前四个是文本框。接两个是下拉框，允许用户从图中列出的选项中选择。最后，我们有一个按钮，用于将表单中的信息添加到应用程序状态以及乘客或机组员的舱单表中。\n\
  \n我们还希望根据乘客类型禁用某些表单元素。乘客需要向表单中填写所有信息。然而，机组员有预先分配的座位，如果他们有行李，行李将放在行李舱内。因此，如果乘客类型的下拉框设置为“Crew（机组员）”，我们需要禁用那些表单输入部件。最后，除非所有必填字段都不为空，否则无法提交表单。\n\
  \n乘客表单（Passenger form）必须与此应用程序中的其他对象进行通信。为了向飞机添加乘客，它必须访问 `Aircraft` 对象。它还需要将乘客或机组员信息添加到舱单表中，这需要与\
  \ `PassengerManifestWidget` 和 `CrewManifestWidget` 进行通信。最后，在乘客或机组员被添加到飞机后，`Aircraft`\
  \ 对象中的总重量和重心将更新，并需要传递给 `WeightAndCofGWidget` 进行显示。这些组件之间的数据连接所示图 16.5。\n\n![乘客或机组员表单设计。](img/9781284166033_CH16_FIGF04.jpg)\n\
  \n图 16.4 乘客/机组员表单设计\n\n![乘客或机组员输入表单连接插图。](img/9781284166033_CH16_FIGF05.jpg)\n\n\
  图 16.5 乘客/机组员输入表单连接\n\n描述\n\n### PassengerFormWidget\n\nPassengerFormWidget 的规范在此所示：\n\
  \n![乘客表单部件规范的代码。](img/9781284166033_CH16_P1032.jpg)\n\n描述\n\n![乘客表单部件规范的延续。](img/9781284166033_CH16_P1033.jpg)\n\
  \n描述\n\nPassengerFormWidget 的成员变量包含了我们将要使用的所有小部件组件的指针。我们之前见过过 `QLineEdit` 和 `QLabel`。`QComboBox`\
  \ 是 Qt 提供的一个用于构建下拉框的部件。在这里我们用它处理座位和乘客类型。因为我们需要在表单不完整时警告用户，所以我们使用 `QLabel` 来显示信息消息。指向我们已经讨论过的每个自定义部件的指针，以及对\
  \ `Aircraft` 对象的引用。我们从这里获取信息或向其添加信息的所有组件都作为参数传递给构造函数并在其体中初始化。\n\n我们还定义了几个私有方法来帮助处理“Add（添加）”按钮的点击。有两个用于添加乘客或机组员，两个用于验证每个人的表单，还有两个用于将重量和重心值通信给\
  \ `WeightAndCofGWidget`。最后两个方法定义是 Qt 槽（slot）方法，当点击 Add 按钮或更改乘客类型组合框时将调用它们。首先，让我们看看该类构造函数的实现：\n\
  \n![乘客表单部件方法的定义。](img/9781284166033_CH16_P1033-1.jpg)\n\n描述\n\n![乘客表单部件方法的延续。](img/9781284166033_CH16_P1034.jpg)\n\
  \n描述\n\n![乘客表单部件规范的延续。](img/9781284166033_CH16_P1035.jpg)\n\n描述\n\n虽然构造函数很长，但它非常直接，没有包含我们没见过的内容。传入的参数在初始化列表中用于初始化成员变量。然后它创建表单中的标签，随后是相应的文本框（QLineEdit）、下拉框（QComboBox）以及\
  \ Add 按钮（QPushButton）。\n\n用于组合框的项使用 `addItem` 方法添加。接下来，我们使用网格布局根据我们的设计草图将每个组件放置在正确的行和列。我们使用额外的\
  \ span 参数让按钮跨两列。然后设置 `PassengerFormWidget` 的布局。最后，当组合框中选择新项时触发的 `textActivated`\
  \ 事件连接到 `HandleComboBoxActivated` 事件处理器，并将 `clicked` 事件连接到 `HandleAddButtonClicked`\
  \ 事件处理器。\n\n### 事件处理器（Handlers）\n\n我们将检查的第一个事件处理器是响应乘客类型组合框的变化。当它被设置为“Crew”时，UI\
  \ 必须禁用行李重量和座位部分。更改组合框会触发 `textActivated` 事件，它会调用连接的事件处理器，并传递一个与选中内容对应的 `QString`。在我们的\
  \ `HandleComboBoxActivated` 事件处理器中，我们将字符串与 Crew 进行比较，如果匹配，我们就禁用行李重量文本框和座位下拉框；否则，确保它们是启用的。\n\
  \n要禁用部件，我们调用其 `setEnabled` 方法并将 `false` 作为参数。我们还可以使用 `setStyleSheet` 方法将背景颜色更改为\
  \ `lightgrey`，从视觉上告诉用户这些按钮不再可用。Qt 样式表（style sheets）自定义部件外观的选择过多，我们无法在文中涵盖所有。我们在这里仅仅给出一个简单的示例，激发你学习\
  \ Qt 文档的兴趣。如果选中的项不是 Crew，我们就启用两个部件并将它们的背景颜色设置为白色，表示它们已启用并接受输入。这里是该事件处理器的代码：\n\n\
  ![Handle Combo Box Activated 方法定义。](img/9781284166033_CH16_P1036.jpg)\n\n描述\n\n\n\
  \n\n\n在我们讨论“添加”（Add）按钮的事件处理之前，我们将快速介绍一组作为其实现部分的工具方法。由于我们必须确保用户填写了所需的表单条目，我们创建了两个验证方法：`IsValidPassenger`\
  \ 和 `IsValidCrew`。如果表单对于特定的乘客类型有效，这两个方法返回 `true`，否则返回 `false`。只有当它们返回 `true` 时，才记录表单中的信息。还应该进行其他检查，例如处理格式不正确或超出范围的重量值。我们将这些留给读者练习，并指出重新设计表单以使用\
  \ `QSpinBox` 选择器可以简单地避免错误输入的可能性。\n\n另外两个工具方法检查当前乘客和机组人员清单的重量和重心是否有效。`CheckWeightOfAircraft`\
  \ 方法在飞机重量大于 14,440 时会向用户显示一条消息。`CheckCofGOfAircraft` 方法在重心超出安全飞行的接受范围时会通知用户。如果这两个方法中任一个为\
  \ `true`，它们将禁用整个乘客输入表单。一个功能全的应用程序允许用户撤销对乘客或机组人员的添加。目前的设计需要用户重启应用程序。这四个工具方法的实现所示：\n\
