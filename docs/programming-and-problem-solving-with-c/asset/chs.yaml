  描述\n\n### 增和减运算符\n\n除了算术运算符外，C++ 还提供了增和减运算符：\n\n`++`（加 1）\n`--`（减 1）\n\n这些一元运算符接受单个变量名为操作数。对于整数和浮点操作数，效果是对操作数加\
  \ 1（或减 1）。如果 `num` 当前包含值 8，语句![自增语句。](img/9781284166033_CH03_PRE23.jpg)\n描述 会导致\
  \ `num` 包含 9。你可以通过此赋值语句相同的效果：![另一种编写自增语句的方式。](img/9781284166033_CH03_PRE24.jpg)\n\
  描述 回想第 1 章 C++ 语言是如何命名的：C++ 是 C 语言的“自增”版本。\n\n`++` 和 `--` 运算符可以是前缀运算符：![作为前缀运算符的增减运算符。](img/9781284166033_CH03_PRE25.jpg)\n\
  描述\n\n或者是后缀运算符：![作为后缀运算符的增减运算符。](img/9781284166033_CH03_PRE26.jpg)\n描述\n\n当作为独立语句使用时，两种形式的行为相同。通常，C++\
  \ 程序员使用后缀版本。\n\nC++ 允许在较大的表达式中使用 `++` 和 `--`：![在较大表达式中使用自增运算符。](img/9781284166033_CH03_PRE27.jpg)\n\
  描述\n\n\n\n在这种情况下，后置形式得到的结果与前置形式不同。我们将在第 7 章中解释这种差异。目前，你应该只将 `++` 和 `--` 运算符作为独立的单独语句来递增或递减变量：\n\
  \n![递增语句和递减语句的语法模板。](img/9781284166033_CH03_UFIG105-1.jpg)\n\n描述\n\n2 编译器之间的这种不一致性可能会在程序移动到不同的计算机系统时导致细微的错误。我们建议避免对负整数使用取余运算。`abs`\
  \ 函数（在“函数调用和库函数”节中描述）可以用于在使用 `%` 之前获取 `int` 的绝对值。在第 5 章中，我们将看到如何检查负值并跳过本会使用它们的计算。\n\
  \n## 3.5 复合算术表达式\n\n到目前，我们使用的表达式最多包含一个算术运算符。我们一直很小心没有在同一个表达式中混合整数和浮点值。现在我们来看更复杂的表达式——即由多个运算符组成的表达式以及包含混合数据类型的表达式。\n\
  \n### 优先级规则\n\n算术表达式可以由许多常量、变量、运算符和括号组成。操作执行的顺序是怎样的？例如，在赋值语句中\n\n![一条赋值语句。](img/9781284166033_CH03_PRE28.jpg)\n\
  \n描述\n\n是先计算 `FREEZE_PT + BOIL_PT`还是先计算 `BOIL_PT / 2.0`？\n\n基本算术运算符（一元 `+`、一元 `–`、用于加法的\
  \ `+`、用于减法的 `–`、用于乘法的 `*`、用于除法的 `/` 以及用于取模的 `%`）的排序方式与数学运算符根据优先级规则相同：\n\n| 优先级级别\
  \ | 运算符 |\n| --- | --- |\n| 最高优先级： | 一元 `+` 一元 `-` |\n| 中级： | `* / %` |\n| 最低级：\
  \ | `+ -` |\n\n由于除法的优先级高于加法，之前示例中的表达式被隐式地加上了括号\n\n![一个带括号的表达式。](img/9781284166033_CH03_PRE29.jpg)\n\
  \n描述\n\n也就是说，我们先将 `BOIL_PT` 除以 `2.0`，然后将 `FREEZE_PT` 加上结果。\n\n你可以通过括号改变求值顺序。在语句\n\
  \n![使用括号改变了表达式中的求值顺序。](img/9781284166033_CH03_PRE30.jpg)\n\n描述\n\n`FREEZE_PT` 和\
  \ `BOIL_PT` 先相加，然后它们的和除以 `2.0`。我们先求值括号中的子表达式，然后遵循运算符的优先级。\n\n当一个算术表达式具有多个相同优先级的二元运算符时，它们的分组顺序（或结合性）是从左到右的。表达式\n\
  \n![具有相同优先级的二元运算符，优先级是从左到右。](img/9781284166033_CH03_PRE31.jpg)\n\n描述\n\n意味着 `(int1\
  \ – int2) + int3`，而不是 `int1 – (int2 + int3)`。另一个例子，我们将使用表达式\n\n![(float1 + float2)\
  \ / float1 * 3.0](img/9781284166033_CH03_PRE32.jpg)\n\n来先求值括号中的表达式，然后将和除以 `float1`，最后将结果乘以\
  \ `3.0`。下面是更多一些例子。\n\n| 表达式 | 值 |\n| --- | --- |\n| `10 / 2 * 3` | 15 |\n| `10 %\
  \ 3 – 4 / 2` | –1 |\n| `5.0 * 2.0 / 4.0 * 2.0` | 5.0 |\n| `5.0 * 2.0 / ( 4.0 * 2.0\
  \ )` | 1.25 |\n| `5.0 + 2.0 / ( 4.0 * 2.0 )` | 5.25 |\n\n在 C++ 中，所有一元运算符（如一元 `+`\
  \ 和一元 `-`）都有从右到左的结合性。虽然这个事实初看起来很奇怪，但事实证明它是自然的分组顺序。\n\n### 强制转换与类型转换\n\n整数值和浮点值在内存中的存储方式不同。浮点值的位表示看起来并不像常量\
  \ `2`。如果在赋值语句或算术表达式中混合整数和浮点值会发生什么？让我们先看赋值。\n\n#### 赋值语句\n\n![声明。](img/9781284166033_CH03_PRE33.jpg)\n\
  \n描述那么 `someInt` 只能存储整数值，而 `someFloat` 只能存储浮点值。![赋值语句。](img/9781284166033_CH03_PRE34.jpg)\n\
  \n描述编译器插入额外的指令将 `12` 转换为 `someFloat`。这种从一种类型到另一种类型的自动转换被称为类型转换。当将浮点值赋值给 `int` 变量时，小数部分会被截断（丢弃）。结果，`someInt`\
  \ 被赋值为 `4`。这种自动转换也会导致类型转换。![类型转换。](img/9781284166033_CH03_PRE35.jpg)\n\n描述整个表达式都可能涉及类型转换。在两种情况下，如果我们避免混合类型，程序读起来将不那么困惑。![类型转换。](img/9781284166033_CH03_PRE36.jpg)\n\
  \n描述这两个赋值语句都导致了类型转换。![赋值：someFloat = someInt + 2; someInt = 5.2 / someFloat;](img/9781284166033_CH03_PRE37.jpg)\n\
  \n用纸和笔，自己看看当 `someFloat` 包含 `4.7` 时 `someInt` 存储了什么。\n\n将 `int` 表达式的结果赋值给 `float`\
  \ 变量通常不会导致信息丢失；看看当 `someFloat` 包含 `4.2` 时存储了什么。（这种技术假设 `someFloat` 是一个正数。）\n\n为了让我们的程序尽可能清晰（且没有错误），可以使用显式的强制转换）。一个\
  \ C++ 转换操作由一个数据类型名称和括号内的待转换表达式组成：\n\n![类型转换的示例。](img/9781284166033_CH03_PRE38.jpg)\n\
  \n描述![语句：someFloat = (float)(someInt + 2); someInt = (int)(5.2 / someFloat);](img/9781284166033_CH03_PRE39.jpg)\n\
  \n描述这两个语句产生相同的结果，但通过强制转换操作，可以清楚地看出混合类型是故意的，而不是疏忽。无数错误是由无意混合类型造成的。\n\n这里是在将浮点值存储到\
  \ `int` 变量之前，进行舍入而不是截断的方法：\n\n![舍入的示例。](img/9781284166033_CH03_PRE40.jpg)\n\n描述用纸和笔，自己看看当\
  \ `someFloat` 包含 `4.7` 时 `someInt` 存储了什么。现在再次尝试，假设 `someFloat` 包含 `4.2`。（这种技术假设\
  \ `someFloat` 是一个正数。）\n\n#### 算术表达式\n\n我们一直都在讨论跨越赋值运算符（=）的混合类型。在表达式内部混合类型也是可能的：\n\
  \n\n\n\n\n![包含混合数据类型的算术表达式。](img/9781284166033_CH03_PRE41.jpg)\n\n描述\n\n此类表达式被称为混合类型（或混合模式）表达式](#9781284166033_CH03_05.xhtml_c3-sid0005)。\n\
  \n每当整数值和浮点值被运算符连接时，就会发生隐式类型强制转换：\n\n1. 整数值被强制转换以创建一个临时的浮点值。\n2. 使用该临时值执行操作。\n3.\
  \ 结果是一个浮点值。\n\n让我们看看机器是如何评估表达式 `4.8 + someInt – 3` 的，其中 `someInt` 包含值 `2`。首先，`+`\
  \ 运算符的操作数具有混合类型，因此 `someInt` 的值被强制转换为 `2.0`。（此转换创建了一个独立的临时值；它不会影响存储在 `someInt` 中的值。）进行加法运算，得到值\
  \ `6.8`。接下来，减法运算符（`-`）连接了一个浮点值（`6.8`）和一个整数值（`3`）。值 `3` 被强制转换为 `3.0`，执行减法，结果为浮点值\
  \ `3.8`。\n\n与赋值语句一样，你可以在表达式中使用显式类型转换来降低错误的风险。编写如下表达式：\n\n![显式类型转换的示例。](img/9781284166033_CH03_PRE42.jpg)\n\
  \n描述\n\n会让你的意图清晰明了。\n\n显式类型转换不仅对于程序的清晰性很有价值，在某些情况下为了为了正确计算也是必要的。给定以下声明：\n\n![某些声明](img/9781284166033_CH03_PRE43.jpg)\n\
  \n描述\n\n假设 `sum` 和 `count` 当前分别包含 `60` 和 `80`。如果 `sum` 代表一组整数值的和，而 `count` 代表值的个数，让我们找到平均值：\n\
  \n![一个给出错误错误的示例](img/9781284166033_CH03_PRE44.jpg)\n\n描述\n\n遗憾的是，这条语句将值 `0.0` 存储到\
  \ `average` 中。原因如下：该表达式并没有混合类型。`/` 运算符两个操作数都是 `int` 类型，因此执行了整数除法。当 `60` 除以 `80`\
  \ 时，得到整数值 `0`。接下来，值 `0` 在存储到 `average` 之前被强制转换为 `0.0`。\n\n这里是正确且清晰找到平均值的方法：\n\n\
  ```\naverage = float(sum) / float(count);\n```\n![images/9781284166033_CH03_PRE45.jpg)这条语句执行的是浮点除法而不是整数除法。结果是值\
  \ `0.75` 被存储到 `average` 中。关于类型强制转换和类型转换的最后说明，你可能已经注意到我们专注于 `int` 和 `float` 类型上。也可以将\
  \ `char`、`short` 和 `double` 值混合其中。结果可能会令人困惑且出乎之外。在第 10 章中，我们将通过更详细的讨论回到这个主题。在此之前，你应该避免在表达式中混合这些类型的值。3\
  \ 在 C++ 中编写转换操作还有另外两种方法，它们比这种语法具有某些优势。我们将等到第 7 章来介绍并解释它们。在此之前，这种简单的表示法将满足你的编程需求。##\
