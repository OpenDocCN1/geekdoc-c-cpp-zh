  描述\n\n### 测试与调试\n\n测试是计算机编程中问题解决和实现阶段不可或缺的一部分。在这里，我们对开发 BMI 程序的流程中的两个阶段进行测试。问题解决阶段的测试是在解决方案开发之后、实现之前进行的。在实现阶段，我们在算法被编码为程序后，以及在程序成功编译后再次进行测试。编译本身构成了另一个自动执行的测试阶段。\n\
  \n### 问题解决阶段的测试：算法走读\n\n#### 确定前提和后置条件\n\n在问题解决阶段进行测试，我们对算法进行*走读*（walk-through）。对于功能分解中的每个模块，我们都建立一个称为“前提”（precondition）的断言和另一个称为“后置条件”（postcondition）的断言。`precondition`是在模块执行之前必须为真的断言，以便模块能够正确执行。`postcondition`是在模块执行后（如果它工作正常的话）应该为真的断言。要测试一个模块，我们“走读”算法步骤，以确认在给定前提的情况下，这些步骤是否产生了所需的后置条件。\n\
  \n#### 执行算法走读\n\n现在我们已经建立了前提和后置条件，我们来走读 **main** 模块。此时，我们只关注 **main** 模块中的步骤，因此我们假设每个低级模块都是正确的。在每一步中，我们都确定当前条件。如果该步骤是对另一个模块的引用，我们检查当前条件是否满足该模块的前提。\n\
  \n**main** 模块中的第一个语句 Get Data 没有前提，我们假设 Get Data 正确地将两个实数值输入到 **weight** 和 **height**。\n\
  \n\n\n\n模块 `Test Data` 的前置条件是 `weight` 和 `height` 已赋值，这与 `Get Data` 的后置条件一致。同样，由于我们只关注\
  \ Level 0 发生的情况，我们假设 `Test Data` 满足它的后置条件，即 `dataAreOK` 包含 `true` 或 `false`。\n\n\
  接下来，`If` 语句检查 `dataAreOK` 是否为 `true`。如果是，算法执行 then 句（执行部分）。假设 `Calculate BMI` 和\
  \ `Display Message Indicating Status` 正常工作，那么 `If` 语句的 then 句就是正确的。如果 `dataAreOK`\
  \ 的值为 `false`，算法将执行 else 句（否则部分）并显示错误信息。\n\n现在我们已经验证了在 Level 1 模块正确的假设下，`main`（Level\
  \ 0）模块是正确的。下一步是检查 Level 1 的每个模块，看它们是否执行了应该执行的功能，假设 Level 2 模块（如果有）是正确的。我们只需对每个模块重复走演过程，从其特定的前置条件开始。在本例中，没有\
  \ Level 2 模块，因此 Level 1 模块必须是完整的。\n\n`Get Data` 正确读取了两个值——`weight` 和 `height`——从而满足了它的后置条件。（下一步细化是用\
  \ C++ 编写此指令。代码是否正确在这一阶段并不是问题；我们会在实现阶段进行测试时处理代码。）\n\n`Test Data` 检查两个变量是否都包含非负值。`If`\
  \ 条件正确地使用 OR 运算符来组合关系表达式，使得只要其中一个为 `true`，就会执行 then 句。因此，如果任一数字为负，它将给 `dataAreOK`\
  \ 赋值为 `false`；否则赋值为 `true`。因此，该模块了它的后置条件。\n\n`Calculate BMI` 计算 BMI 公式：`weight *\
  \ 703 / (height * height)`。因此，所需的后置条件为真。但如果 `height` 的值为 0 将会怎样？噢，天哪！我们检查了输入是非负的，但忘记了\
  \ `height` 被用除数，因此不能为 0。在发布此程序供通用使用之前，我们需要修复这个问题。\n\n`Display Message Indicating\
  \ Status` 输出带有适当文档的 `bodyMassIndex` 值。然后它将结果与标准进行比较并输出相应的解释。因此，该模块满足了它的后置条件。\n\n\
  一旦完成了算法走演，我们就必须纠正任何差异并重复该过程。当我们确定模块执行了它们应该执行的功能时，就开始将算法翻译成我们的编程语言。\n\n任何程序的标准后置条件是用户已被通知无效数据。你应当对每个适用任何限制的输入值进行验证。数据验证的\
  \ `If` 语句会测试输入值，并如果该值不可接受，则输出错误信息。（我们在测试 BMI 程序的负分值时验证了数据。）验证数据的最佳位置是紧跟在输入之后。为了满足数据验证后置条件，算法还应该测试输入值，以确保它们既不是太大也不太小。\n\
  \n### 实现阶段的测试\n\n既然我们已经讨论了问题解决阶段的测试，现在我们转向实现阶段的测试。在这个阶段，你需要在几个点进行测试。\n\n#### 代码走演\
  \ (Code Walk-Through)\n代码编写完成后后，你应该逐行检查它，以确保你忠实地重实现了算法——这一过程被称为代码走演。在团队编程的情况下，你会要求其他团队成员与你一起走演算法和代码，以双检设计和代码。\n\
  \n#### 执行跟踪 (Execution Trace)\n你还应该取一些实际值，通过执行执行跟踪（或手工跟踪）来手动计算输出应该是多少。当程序执行时，可以使用这些相同的值作为输入并检查结果。\n\
  \n计算机是一个非常死板的设备——它完全按照我们告诉它的指令去做，而这可能正是我们希望它做的事。我们试图通过跟踪语句的执行来确保程序执行了我们想要的功能。\n\n\
  我们在下面使用一个无意义的程序来演示这种技术。我们跟踪右侧程序变量的值。未定义值的变量用破折号表示。当变量被赋值时，该值将列列在相应的列中。\n\n![一个表格，逐行列出了程序中的语句，以及在语句执行时变量\
  \ a、b 和 c 的值。](img/9781284166033_CH05_275.jpg)\n\n描述\n\n现在你已经看到了这项技术是如何工作的，让我们将其应用于\
  \ BMI 程序。我们在这里只列出可执行的语句部分。输入值为 124 和 63.5。\n\n对于这些输入数据，第一个 `If` 语句的 then 句没有执行，因此我们不填充其右侧任何变量列。第二个\
  \ `If` 语句的 then 句被执行；因此 else 句没有执行。第三个 `If` 语句的 else 句被执行，它是另一个 `If` 语句。在这里执行 then\
  \ 句，其余代码未执行。\n\n我们总是为所有变量创建列，即使我们知道某些将保持为空。为什么？因为以后我们可能会遇到对空变量的错误引用；为变量留一列可以提醒我们去检查此类错误。\n\
  \n![一个表格，逐行列出了程序中的语句，以及在语句执行时变量 a、b 和 c 的值。](img/9781284166033_CH05_276.jpg)\n\n\
  描述\n\n当程序包含分支时，使用不同的输入数据重新跟踪其执行过程是一个好主意，这样每个分支至少被跟踪一次。在下一节中，我们将描述如何开发能够测试所有分支的数据集。\n\
  \n#### 测试选择结构\n\n要测试带有分支的程序，我们需要至少执行每个分支一次并验证结果。例如，BMI 程序包含五个 `If-Then-Else` 语句（见图\
  \ 5.6）。我们需要一组数据集来测试这些分支。例如，以下 `weight` 和 `height` 的输入值集合会导致所有分支被执行：\n\n![一个表格，列出了重量和高度的输入值集合，这些值会导致\
  \ BMI 程序中所有分支被执行。](img/9781284166033_CH05_277.jpg)\n\n描述\n\n图 5.7 显示了在每组数据下，BMI\
  \ 程序分支结构中的控制流。通过这一系列测试运行，程序中的每个分支至少被执行一次；消除任何一组测试数据将导致至少一个分支未被测试。系列数据集提供了所谓的程序分支结构的最小完整覆盖。每当你测试带有分支的程序时，都应该设计一系列覆盖所有分支的测试。绘制像图\
  \ 5.7 这样的图可能会有所帮助，让你看到哪些分支正在执行。\n\n由于程序一个分支中的操作通常会影响后续分支的处理，因此尽可能地测试程序中分支的组合（或路径）至关重要。通过这样做，我们可以确保没有导致问题的相互依赖关系。当然，某些分支组合是不可能的。例如，如果\
  \ BMI 程序第一个分支执行了 else 句，那么第二个分支的 else 句就无法执行。我们不应该尝试所有可能的路径吗？是的，理论上我们应该。然而，即使在一个很小的程序中，路径的数量也可能巨大。\n\
  \n\n\n我们在这里使用的测试方法被称为`代码覆盖率`（code coverage），因为测试数据是通过查看程序代码来设计的。代码覆盖率也称为`白盒测试`（white-box\
  \ 或 `clear-box testing`），因为我们在设计测试时被允许查看程序代码。另一种测试方法称为`数据覆盖率`（data coverage），它尝试在不考虑程序代码的情况下，尽可能测试所有允许的数据值。因为在这种形式的测试中不需要查看代码，它也被称为`黑盒测试`——即使代码被隐藏在黑子里，我们也会设计相同的测试用例。\n\
  \n对于许多程序来说，完全的数据覆盖和完全的代码覆盖率一样是不现实的。例如，如果一个程序有四个 `int` 输入值，那么大约有 `(2 × INT_MAX)⁴`\
  \ 种可能的输入。（`INT_MAX` 和 `INT_MIN` 是在头文件 `<climits>` 中声明的常量。它们分别代表你特定计算机和 C++ 编译器上最大和最小的\
  \ `int` 值。）\n\n通常，测试涉及这两种策略的结合。我们不是尝试每一个可能的数据值（数据覆盖率），而是检查代码（代码覆盖率），并寻找处理方式相同的数值范围。然后，我们测试边界处的值，有时还会测试每个范围中间的一个值。例如，一个简单的条件如：\n\
  \n![BMI 程序的分支结构。](img/9781284166033_CH05_FIGF06.jpg)\n\n图 5.6 BMI 程序的分支结构\n\nDescription\n\
  \n![一组图图，显示了五个数据集通过 BMI 程序的控制流。](img/9781284166033_CH05_FIGF07.jpg)\n\n图 5.7 五个数据集各通过\
  \ BMI 程序的控制流\n\nDescription\n\n![程序代码。](img/9781284166033_CH05_279.jpg)\n\nDescription\n\
  \n将整数分为两个范围：\n\n1. `INT_MIN` 到 `-1`\n2. `0` 到 `INT_MAX`\n\n因此，我们应该测试 `INT_MIN`、`-1`、`0`\
  \ 和 `INT_MAX` 这四个值。一个复合条件如：\n\n![程序代码。](img/9781284166033_CH05_279a.jpg)\n\nDescription\n\
  \n将整数分为三个范围：\n\n1. `INT_MIN` 到 `-1`\n2. `0` 到 `100`\n3. `101` 到 `INT_MAX`\n\n因此我们有六个值需要测试。此外，为了验证关系运算符是否正确，我们应该测试值\
  \ `1`（`> 0`）和 `99`（`< 100`）。\n\n条件分支只是开发测试策略的因素之一。我们将在随后的章节中考虑更多这些因素。\n\n### 测试计划\n\
  \n每当我们编写程序时，都必须设计一个`测试计划`（test plan）——一份指定了应该尝试的测试用例、每个测试用例的原因以及预期输出的文档。`测试计划实施`涉及使用测试用例指定的数据运行程序并检查结果。\n\
  \n测试计划应与功能分解一起制定。当你创建每个模块时，写出它的前置条件（precondition）和后置条件（postcondition），并记录验证这些条件所需的测试数据。考虑代码覆盖率和数据覆盖率，以看看你是否遗漏了程序任何方面的测试。（如果你忘记了某些内容，可能表明前置条件或后置条件是不完整的。）\n\
  \n下表显示了 BMI 程序的部分测试计划。它包含六个测试用例。前四个用例测试了有效数据在程序中的不同路径。另外两个测试用例通过分别输入一个无效分数，检查 `weight`\
  \ 和 `height` 是否得到了适当验证。\n\n我们应该对边界情况下的程序进行测试——即 BMI 正好为 20、25 和 30 的情况。由于 BMI 是计算出来的而不是输入的，我们必须从所需的答案反推适当的输入值。案例研究后续练习题要求你思考这个问题，完成此测试计划并实现它。\n\
  \n![详细列出 BMI 程序测试计划的表格。](img/9781284166033_CH05_280.jpg)\n\nDescription\n\n实施测试计划并不能保证程序完全正确。（记住，BMI\
  \ 程序仍然无法检测到高度为零的无效输入。）它仅意味着系统性测试没有发现任何错误。\n\n## 在编译和执行期间自动执行的测试\n\n一旦完成编码并准备好测试数据，就可以进行编译了。编译器有两个责任：报告任何错误，以及（如果没有错误）将程序翻译成目标代码。\n\
  \n错误可以是语法的或语义的。编译器会发现语法错误；例如，当保留字拼写错误、标识符未声明以及缺少分号时。但它无法发现所有的输入错误。例如，如果你输入 `>` 而不是\
  \ `<`，你不会得到错误信息；而是在测试程序时得到错误的结果。语义错误（也称为 `logic errors`）是导致错误答案的错误。它们比语法错误更难定位，通常在程序执行时出现。C++\
  \ 只能检测出除以零等最明显的语义错误。通过梳理算法和代码，并制定详细的测试策略，你应该避免或至少快速定位程序中的语义错误。\n\n5.8 展示了我们讨论的测试过程。该图显示了语法和语义错误发生的位置以及在哪个阶段被修正。\n\
  \n![列出测试过程以及语法和语义错误发生位置及被修正阶段的图表。](img/9781284166033_CH05_FIGF08.jpg)\n\n图 5.8 测试过程\n\
  \nDescription\n\n### 测试与调试提示\n\n1. C++ 有三对外观相似但效果完全不同的运算符：`==` 和 `=`、`&&` 和 `&`、以及\
  \ `||` 和 `|`。双击你所有的逻辑表达式，确保你使用的是“等于”、“与”和“或”运算符。\n2. 如果为了清晰起见使用了额外的括号，请确保左右括号匹配。要验证括号是否配对，从最内层对开始并画线连接它们。对其他括号执行同样的操作，一直到最外层对。例如，\n\
  \n![表达式中匹配的左、右括号已被标记。](img/9781284166033_CH05_282.jpg)\n\nDescription\n\n这里有一种快速判断左左右括号数量是否相等的方法。该方案使用单个数字（“魔数”），其初始值为\
  \ 0。从左到右扫描表达式。在每个左括号处，给魔数加 1；在每个右括号处减去 1。在最后一个右括号处，魔数应为 0。例如，\n\n![使用魔数匹配表达式中的左右括号。](img/9781284166033_CH05_282a.jpg)\n\
  \nDescription\n\n\n\n1. 3. 不要使用 `=` 来表示“小于等于”；只有 `<=` 符号可用于此目的。同样，`=>` 对于“大于等于”是无效的；你必须使用\
  \ `>=` 进行此操作。\n\n2. 4. 在 `If` 语句中，如果 `then` 分句或 `else` 分句是一系列语句，请记住使用一对 `{ }`。此外，确保不要在右括号后放置分号。\n\
  \n3. 5. 打印（Echo）所有输入数据。通过这样做，你可以知道你的输入值是预期的值。\n\n4. 6. 测试错误数据。如果一个数据值必须为正数，请使用 `If`\
  \ 语句测试该值。如果值为负数或 0，则应该显示错误信息；否则应继续处理。例如，以下代码段测试了三个测试分数是否小于 0 或大于 100：\n\n![测试与调试提示中第\
  \ 6 点下的代码。](img/9781284166033_CH05_282b.jpg)\n\n描述\n\n这些 `If` 语句测试了合理分数的极限；只有当数据值合理时，程序才会继续。\n\
  \n1. 7. 当 `If` 语句无意中应用于一个 `int` 值时，如果该值非零则返回 `true`，否则返回 `false`。编译器不会将此结果报告为错误。\n\
  \n2. 8. 取一些示例值并像我们处理 BMI 程序时那样进行手动测试。（关于这种方法的更多信息请见第 6 章）\n\n3. 9. 如果你的程序从输入文件读取数据，应该验证文件是否成功打开。在调用\
  \ `open` 函数后，应立即使用 `If` 语句测试文件流的状态。\n\n4. 10. 如果你的程序产生的答案与你手动计算的值不符，请尝试这些建议：\n\n\
  \    - a. 重新进行算术计算。\n    - b. 重新检查你的输入数据。\n    - c. 仔细检查执行计算的代码段。如果你对操作执行的顺序有疑问，请插入澄清说明的括号。\n\
  \    - d. 检查整数溢出。`int` 变量的值在计算过程中可能超过 `INT_MAX`。某些系统在发生这种情况时会给出错误信息，但大多数系统不会。\n\
  \    - e. 检查分支语句中的条件，以确保在所有情况下都采取正确的分支。\n\n![书中标题为“循环”的章节首页。背景图显示了森林中的树。](img/Chapter-opener.jpg)\n\
  \n章节扉页：© Joost Lagerweij/EyeEm/Getty Images.\n\n# 第 6 章\n## 循环\n\n在第 5 章中，我们看到程序的控制流可能与语句的编写顺序不同。我们希望语句执行的顺序可以合情合理地被称为*执行顺序*。\n\
  \n`If` 语句是改变执行顺序的一种方法。循环控制结构是另一种。`loop` 只要满足条件，就会反复执行相同的语句（简单语句或复合语句）。\n\n在本章中，我们将了不同类型的循环，并探索了如何使用\
  \ `While` 语句来构建它们。我们还讨论了*嵌套循环*（包含其他循环的循环），并引入了比较不同算法所做工作量的表示法。\n\n![道路上的交叉口，有一段环形路，上面有一些汽车在行驶。](img/9781284166033_CH06_296.jpg)\n\
  \n## 6.1 While 语句\n\n`While` 语句像 `If` 语句一样会测试条件。以下是 `While` 语句的语法模板：\n\n![while\
  \ 语句的语法模板。(images/9781284166033_CH06_296a.jpg)\n\n描述\n\n这里是一个示例：\n\n![代码中的 while\
  \ 循环示例。(images/9781284166033_CH06_296b.jpg)\n\n描述\n\n`While` 语句是一种循环控制结构。语法模板中的“Statement”被称为循环的*体*或*循环体*。在前面的示例中，体是输入语句。这个\
  \ `While` 语句表示只要输入值不等于 25，就反复执行体。当 `inputVal` 等于 25 时，`While` 循环停止。该循环的作用是消耗并忽略输入流中的所有值，直到输入\
  \ 25。\n\n就像 `If` 语句中的条件一样，`While` 语句中的可以是任何简单数据类型的表达式。通常是一个逻辑（布尔）表达式；如果不是，它的值会被隐式地强制\
  \ `bool` 类型。\n\n![解释 while 语句中控制流的图表。(images/9781284166033_CH06_296a.jpg)\n\n\n\n\
  循环的概念是编程的基础。在本章中，我们将花费一些时间查看循环的典型算法示例，以及如何使用 `While` 语句来实现它们。当你在分析问题和设计算法时，这些循环情况会反复出现。\n\
  \n## 6.3 使用 While 语句的循环\n\n在解决问题时，你会遇到循环的两种算法用法：**计数控制循环**（count-controlled loops），它们重复指定的次数；以及**事件控制循环**（event-controlled\
  \ loops），它们不断重复直到循环内部发生某些事件。\n\n如果你正在制作天使食品蛋糕，食谱上写着“搅拌混合物 300 次”，你正在执行一个计数控制循环。如果你正在制作饼皮，食谱上写着“用面粉刀切，直到混合物看起来像粗面粉”，你正在执行一个事件控制循环；你无法提前知道循环的具体迭代次数。\n\
  \n### 计数控制循环\n\n计数控制循环在循环测试中使用一个我们称为`loop control variable`（循环控制变量）的变量。在进入计数控制循环之前，我们必须对循环控制变量进行`initialize`（设置初始值）并对其进行测试。然后，作为循环每次迭代的一部分，我们必须对循环控制变量进行`increment`（加\
  \ 1）。注意，循环控制变量除了我们的使用方式外，并没有特殊之处。我们简单地这样称呼它，是为了将其与循环内部可能使用的其他变量区分开来。这里有一个程序示例，它在屏幕上反复输出“Hello!”：\n\
  \n![一个在屏幕上反复输出“Hello!”的程序。](img/9781284166033_CH06_299.jpg)\n\nDescription\n\n在\
  \ Hello 程序中，`loopCount` 是我们的循环控制变量。它在进入循环之前它被设置为 1。`While` 语句测试表达式：\n\n![带有测试表达式的\
  \ While 语句。](img/9781284166033_CH06_300.jpg)\n\nDescription\n\n只要表达式为 `true`，它就会执行循环体。在循环体内，我们想要重复的主要操作是输出语句。循环体中的最后一个语句通过给\
  \ `loopCount` 加 1 来使其递增。\n\n注意我们增加循环控制变量的语句形式：\n\n![增加循环控制变量的代码。](img/9781284166033_CH06_300a.jpg)\n\
  \nDescription\n\n该语句将变量的当前值加 1，并将结果替换旧值。以这种方式使用的变量被称为 `counters`（计数器）。在 Hello 程序中，`loopCount`\
  \ 在循环的每次迭代中都会递增——我们用它来计算迭代次数。计数控制循环的循环控制变量始终计数器。\n\n当然，我们已经在 C++ 中遇到过另一种增加变量的方法。递增运算符\
  \ `++` 会使其操作数对应的变量递增。该语句：\n\n![使用递增运算符的代码。](img/9781284166033_CH06_300b.jpg)\n\n\
  Description\n\n与赋值语句的效果完全相同：\n\n![增加循环计数器的另一种方法。](img/9781284166033_CH06_300c.jpg)\n\
  \nDescription\n\n从现在起，我们通常会使用 `++` 运算符，大多数 C++ 程序员也是这么做的。\n\n在设计循环时，程序员有责任确保待测试的条件在\
  \ `While` 语句开始之前已被正确设置（初始化）。程序员还必须确保条件在循环内部发生变化，以便其最终变为 `false`；否则：\n\n![演示循环计数器如何在\
  \ while 循环中工作的代码。](img/9781284166033_CH06_300d.jpg)\n\nDescription\n\n永不退出的循环被称为\
  \ `infinite loop`（死循环），因为在理论上它会永远执行。在前面的代码中，省略了对 `loopCount` 的递增会导致死循环；`While` 表达式始终为\
  \ `true`，因为 `loopCount` 的值永远是 1。如果你的程序运行时间比你预期的长得多，很可能是你创建了一个死循环。你可能需要发出操作系统命令来停止程序。\n\
  \n我们 Hello 程序中的循环执行了多少次——9 次还是 10 次？为了回答这个问题，我们查看循环控制变量的初始化和退出测试。因为 `loopCount`\
  \ 从 1 开始运行到 10，循环体执行了 10 次。如果我们想让循环执行 11 次，要么将 `loopCount` 初始化为 0，要么将测试改为：\n\n![使\
  \ while 循环执行 11 次的测试表达式。](img/9781284166033_CH06_301.jpg)\n\n### 事件控制循环\n\n在解决问题时，你会遇到循环的两种主要算法用法：**计数控制循环**，它们重复指定的次数；以及**事件控制循环**，它们不断重复直到循环内部发生某些事件。\n\
  \n如果你正在制作天使食品蛋糕，食谱上写着“搅拌混合物 300 次”，你正在执行一个计数控制循环。如果你正在制作饼皮，食谱上写着“用面粉刀切，直到混合物看起来像粗面粉”，你正在执行一个事件控制循环；你无法提前知道循环的具体迭代次数。\n\
  \n### 哨兵控制循环\n\n循环通常用于读取和处理长列表。循环体每次执行一次，都会读取新的数据。通常使用一个特殊数据值被称为 `sentinel`（哨兵）或\
  \ `trailer value`（尾值），来指示程序没有剩余数据。只要数据值不是哨兵，循环就会继续；换句话说，读取哨兵值是控制过程的事件。\n\n哨兵值必须是正常输入中不会出现的值。例如，如果一个程序读取日期，可以使用\
  \ 2 月 31 日作为哨兵：\n\n![错误的代码块。](img/9781284166033_CH06_302.jpg)\n\nDescription\n\n\
  但这个循环有一个问题：在进入循环之前，`month` 和 `day` 的值没有定义。我们必须以某种方式初始化这些变量。我们可以为它们赋值以确保进入循环，但如果第一个值是哨兵值怎么办？它们会被作为数据处理，尽管它们是无效的。此外，使用从不使用的值进行初始化效率效率。\n\
  \n我们可以通过在进入循环之前读取第一组数据值来解决这个问题。这种做法被称为 `priming read`（预读）（这种想法类似于在启动泵之前向机制注入一桶水。）让我们为循环添加预读：\n\
  \n![错误的代码块。](img/9781284166033_CH06_302b.jpg)\n\nDescription\n\n有了预读，如果第一个输入值是哨兵值，那么循环正确地不处理它们。我们解决了一个问题，但现在当第一个输入值是有效数据时出现了一个问题。程序在循环内部执行的第一件事是获取日期，这替换了通过预读获得的值。因此，输入的第一个日期永远不会被处理。考虑到预读，循环体*第一*应该做的是处理已经读取的数据。但我们随后何时读取下一组数据呢？我们在循环的*最后*这样做。这样，`While`\
  \ 条件就会在处理下一个数据集之前应用到它上。它看起来是这样的：\n\n\n\n![正确编码的 while 块。](img/9781284166033_CH06_303.jpg)\n\
  \n描述\n\n这段代码可以正常工作。首先读取数据集；如果它不是哨兵值，就会会被处理。在循环结束时，读取下一个数据集，然后回到循环开头。如果新数据集不是哨兵值，它将像第一个数据集一样被处理。当读取到哨兵值时，`While`\
  \ 表达式变为 `false`，循环退出（*而不处理*哨兵值）。\n\n通常，问题决定了哨兵值的值。例如，如果问题不允许数据值为 `0`，那么哨兵值就应该是 `0`。有时某些值的组合是无效的。将\
  \ `February` 和 `31` 组合作为日期就是这样的情况。有时，一个值范围（例如负数）就是哨兵值。\n\n当你逐行处理 `char` 数据时，换行符（`'\\\
  n'`）经常用作哨兵值。这里有一个程序，可以读取并显示输入文件中的行的所有字符：\n\n![读取并显示输入文件中一行所有字符的程序。](img/9781284166033_CH06_303a.jpg)![读取并显示输入文件中一行所有字符的程序。](img/9781284166033_CH06_304.jpg)\n\
  \n描述\n\n注意，对于特定任务，我们使用 `get` 函数而不是 `>>` 运算符来输入字符。记住，`>>` 运算符会跳过空白字符（包括空格和换行符）以找到输入流中的下一个数据值。在这个程序中，我们想要输入*每一个*字符，即使是空格，尤其是换行符。\n\
  \n如果没有可以作为哨兵的无效数据值怎么办？那么你可能需要在每次迭代中输入一个额外的值，该值的唯一目的是为了标示数据的结束。例如，在每次迭代中，你可以询问用户是否还有更多数据需要输入，并让他们输入\
  \ `Y` 表示是，输入 `N` 表示否。\n\n如果你忘记输入哨兵值会发生什么？在交互式程序中，循环会再次执行并提示输入。此时，你可以输入哨兵值。如果程序的输入来自文件，一旦读取所有数据，循环体就会再次执行。然而，由于计算机已到达文件末尾，文件流进入失败状态（fail\
  \ state）。在下一节中，我们将看到如何使用文件结束作为循环的终止条件。\n\n在继续之前，回想在 `If` 条件中用赋值运算符 `=` 代替相等运算符 `==`\
  \ 的错误。同样的错误也会发生在 `While` 语句中。看看在上一个示例中使用错误的运算符会发生什么：\n\n![使用了错误运算符的 While 块。](img/9781284166033_CH06_304a.jpg)\n\
  \n描述\n\n这个错误会导致无限循环。终止条件现在是一个赋值表达式，而不是关系表达式。表达式的值为 `1`（在循环测试中被解释为 `true`，因为是非零），它的副作用是将值\
  \ `1` 存储到 `sentinel` 中，替换掉刚刚读取的值。因为 `While` 表达式始终为 `true`，循环永远不会停止。\n\n### 文件结束控制的循环\n\
  \n你已经学习过，输入流（如 `cin` 或输入文件流）在遇到不可接受的输入数据时进入失败状态（`1`），(2) 程序尝试打开一个不存在的输入文件，或 (3)\
  \ 程序尝试读取输入文件末尾之后。让我们来看这三种情况的第三种。\n\n当程序从输入文件读取最后一段数据后，计算机就到达了文件末尾（简称 EOF）。此时，流状态处于成功状态。但如果我们尝试再输入一个值，流就会进入失败状态。我们可以利用这一事实为我们所用：为了编写一个输入未知数量数据项的循环，我们可以输入流的失败作为一种哨兵形式。\n\
  \n回想在第 5 章中，我们是如何介绍测试流的状态的。在逻辑表达式中测试流的状态，我们像使用布尔变量一样使用流的名字：\n\n![像布尔变量一样使用的流名。](img/9781284166033_CH06_305.jpg)\n\
  \n描述\n\n在这样的测试中，如果最近的 I/O 操作成功，结果为 `true`；如果失败，则为 `false`。在 `While` 语句中，测试流状态的方法相同。假设我们有一个包含整数的数据文件。如果\
  \ `in` 为 `true`，则进行处理。\n\n![像布尔变量一样使用的流名。](img/9781284166033_CH06_305.jpg)\n\n描述\n\
  \n\n\n你不必将标志位初始化为 `true`；你可以将它们初始化为 `false`。如果你这样做这样做，则必须在 `While` 表达式中使用非操作符（`!`），并在事件发生时将标志位重置为\
  \ `true`。下面的程序计算输入值的平方根，并使用了这种方法。它计算出平方根的初始值（`guess`），将 `goodEnough` 设置为 `false`，并持续重新计算\
  \ `guess`，直到 `guess*guess` 的绝对值与原始值的差在 `0.001` 以内。`<cmath>` 中的函数 `fabs` 用于计算绝对值。\n\
  \n![使用近似法计算平方根的程序。](img/9781284166033_CH06_307.jpg)\n\n描述\n\n以下是示例运行的输出：\n\n![使用近似法计算平方根的程序的输出。](img/9781284166033_CH06_307a.jpg)\n\
  \n描述\n\n### 循环子任务\n\n我们一直在研究使用循环来影响程序控制流的方法。事实上，循环本身没有任何作用。循环体必须执行某项任务，循环才能完成目标。在本节中，我们将查看三项经常在循环中执行的任务：计数、计数和跟踪上一个值。\n\
  \n#### 计数\n\n循环中一个常见的任务是跟踪循环执行的次数。例如，下面的代码片段读取并计算输入字符，直到遇到句号。（`inChar` 类型为 `char`；`count`\
  \ 类型为 `int`。））此示例中的循环有一个计数器变量，但该循环不是计数控制循环，因为该变量并没有被用作循环控制变量。\n\n![代码片段读取并计算输入字符直到遇到句号。](img/9781284166033_CH06_308.jpg)\n\
  \n描述\n\n循环将持续到读取到句号为止。循环结束后，`count` 包含读取字符数减一的值；也就是说，它计算的是直到但不包括哨兵值（句号）之前的字符。注意，如果句号是第一个字符，则不会进入循环体，`count`\
  \ 将包含 0，这是符合逻辑的。在这里我们使用了“引导读取”（priming read），因为该循环是由哨兵控制的。\n\n此示例中的计数器变量被称为**迭代计数器**，因为它的值等于循环迭代的次数。\n\
  \n根据我们的定义，计数控制循环的循环控制变量就是迭代计数器。然而，正如你所看到的，并不是所有的计数器都是循环控制变量。\n\n#### 求和\n\n另一个常见的循环任务是对一组数据值求和。注意接下来的示例，无论循环如何控制，求和操作的写法都是相同的。\n\
  \n![使用循环求和一组数据值的代码。](img/9781284166033_CH06_308a.jpg)\n\n描述\n\n我们在循环开始前将 `sum` 初始化为\
  \ 0，这样在循环体第一次执行时，语句\n\n![代码将 sum 的当前值加上 number 以产生 sum 的新值。](img/9781284166033_CH06_308b.jpg)\n\
  \n描述\n\n会将 `sum` 的当前值（0）加上 `number` 以产生 `sum` 的新值。在整个代码段执行完毕后，`sum` 包含读取的 10 个值的总和，`count`\
  \ 包含 11，`number` 包含最后读取的值。\n\n在前面的示例中，`count` 在每次迭代中递增。对于 `count` 的每一个新值，`number`都有一个新的值。这意味着我们可以让\
  \ `count` 减 1 并检查 `number` 的上一个值吗？不能。一旦新值被读取到 `number`，旧值就永远消失了——除非我们将其保存在另一个变量中。我们将在下一节介绍如何这样做。\n\
  \n让我们来看另一个例子。我们想要统计并求和数据集中前 10 个奇数。我们需要测试每个数字以判断它是偶数还是奇数。（我们可以使用取模运算符来判断：如果 `number\
  \ % 2` 等于 1，则 `number` 是奇数；否则是偶数。）如果输入值是偶数，我们什么都不做。如果是奇数，我们就增加计数器并将该值加入总和。我们使用一个标志位来控制循环，因为这不是普通的计数控制循环。这里是程序列表及其输出。\n\
  \n![一个读取并求和 10 个奇数的程序。](img/9781284166033_CH06_309.jpg)\n\n描述\n\n示例输出：\n\n![读取并求和\
  \ 10 个奇数的程序的输出。](img/9781284166033_CH06_310.jpg)\n\n描述\n\n在这个示例中，变量的值与循环执行次数之间没有关系。我们可以这样写\
  \ While 表达式：\n\n![编写 while 表达式的一种方式。](img/9781284166033_CH06_310.jpg)\n\n描述\n\n\
  但这可能会误导读者认为循环是计数控制的。相反，我们使用标志 `lessTen` 来控制循环，以强调 `count` 只在事件发生时递增。此示例中的计数器是**事件计数器**；它初始化为\
  \ 0，仅在事件发生时递增。上一个示例中的计数器是迭代计数器；它在每次迭代期间递增。\n\n在离开这个示例之前，我们需要指出代码中使用使用的快捷方法。看以下两个语句：\n\
  \n![初始化。](img/9781284166033_CH06_310a.jpg)\n\n描述\n\n我们在同一个语句中声明并初始化了这两个变量。这种做法是完全合。事实上，我们在之前的程序中使用过这种快捷方法。在第\
  \ 9 章中，我们将更深入地研究这种结构。\n\n#### 跟踪上一个值\n\n有时我们需要记住上一个值。假设我们想写一个程序来统计 C++ 程序文件中不等运算符（`!=`）的数量。我们可以通过统计感叹号（`!`）后面等号\
  \ `=` 出现的次数来实现。完成这一任务的方法是每次读取一个输入字符，跟踪最近的两个——即当前值和上一个值。在循环的每次迭代中，读取一个新的当前值并将旧的当前值变为上一个值。到达\
  \ EOF 时，循环结束。这是一个以此方式统计不等运算符的程序：\n\n![在文件中统计不等运算符的程序。](img/9781284166033_CH06_310b.jpg)![在文件中统计不等运算符的程序。](img/9781284166033_CH06_311.jpg)\n\
  \n描述\n\n![文件内容，my file.dat。](img/9781284166033_CH06_311aa.jpg)\n\n描述\n\n输出：\n\n\
  ![在 dat 文件中统计不等运算符的程序的输出。](img/9781284166033_CH06_311a.jpg)\n\n描述\n\n利息金额看起来那么高，以至于你为了确定而手算计算了一下。然而，它是正确的。\n\
  \n\n\n理解循环是如何运作的是一回事，而设计一个能解决特定问题的循环则是另一回事。在本节中，我们将考虑设计循环的过程。我们可以将这一过程分为两个任务：设计控制流和设计循环内部的处理逻辑。反之，我们可以将每个任务进一步细分为三个阶段：任务本身、初始化和更新。此外，指定程序退出循环时的状态也是重要的，因为一个让变量和文件处于一团糟状态的循环并不是良好的设计。\n\
  \n设计循环时有七个点需要考虑：\n\n1. 结束循环的条件是什么？\n2. 条件应该如何初始化？\n3. 条件应该如何更新？\n4. 被重复的执行过程是什么？\n\
  5. 该处理过程应该如何初始化？\n6. 该处理过程应该如何更新？\n7. 退出循环时程序的状态是什么？\n\n我们把这些问题作为一份检查清单。前三个问题帮助我们设计控制循环执行的各个。接下来的三个问题帮助我们设计循环内部的处理逻辑。最后一个问题则提醒我们，要确保循环以适当的方式退出。\n\
  \n### 设计控制流\n\n循环设计中最重要的一步是决定什么让循环停止。如果终止条件没有经过周全考虑，我们的程序可能会包含无限循环或其他错误。所以，这是我们的第一个问题：\n\
  \n* 结束循环的条件是什么？\n\n这个问题通常可以通过仔细检查问题陈述来回答。下表列出了一些示例：\n\n| 问题陈述中的关键短语 | 终止条件 |\n|\
  \ :--- | :--- |\n| “累加 365 个温度值” | 当计数器达到 365 时循环结束（计数控制循环）。 |\n| “处理文件中的所有数据” |\
  \ 当发生 `EOF` 时循环结束（EOF 控制循环）。 |\n| “处理到读入 10 个奇数为止” | 当输入了 10 个奇数时循环结束（事件计数器）。 |\n\
  | “用负数测试分数表示数据结束” | 当遇到负数输入值时循环结束（哨兵值控制循环）。 |\n\n现在，我们需要确保循环正确启动的语句，以及允许循环到达终止条件的语句。此时此，我们提出接下来的两个问题：\n\
  \n* 条件应该如何初始化？\n* 条件应该如何更新？\n\n这些问题的答案取决于终止条件的类型。\n\n### 计数控制循环\n\n如果循环是由计数控制的，我们通过给循环控制变量一个初始值来初始化条件。对于循环控制变量也是迭代计数器的计数控制循环，初始值通常是\
  \ 1。如果处理过程要求计数器遍历一个特定范围的值，则初始值应该是该范围内的最小值。\n\n条件通过在每次迭代中将计数器加 1 来更新。（偶尔，你可能会遇到需要计数器从某个值*向下*计数到较低值的问题。在这种情况下，初始值是较大的值，计数器每次迭代减\
  \ 1。）因此，对于使用迭代计数器的计数控制循环，这些是关键问题的答案：\n\n* 将迭代计数器初始化为 1。\n* 在每次迭代结束时增加迭代计数器。\n\n\
  如果循环是由一个计算循环内事件的变量控制的，则控制变量通常初始化为 0，并在每次事件发生时加 1。对于使用事件计数器的计数控制循环，这些是关键问题的答案：\n\n\
  * 将事件计数器初始化为 0。\n* 每当事件发生时增加事件计数器。\n\n#### 哨兵值控制循环\n\n在哨兵值控制循环中，一次预读（priming read）可能是唯一必要的初始化。如果输入源是文件而不是键盘，可能还需要打开文件以准备读取。为了更新条件，在每次迭代结束时读取一个新值。因此，对于哨兵值控制循环，我们这样回答关键问题：\n\
  \n* 如果需要，打开文件，并在进入循环之前输入一个值（预读）。\n* 在每次迭代结束时输入一个新值进行处理。\n\n#### EOF 控制循环\n\nEOF\
  \ 控制循环需要与哨兵值控制循环相同的初始化。如果有需要，必须打开文件并执行预读。循环条件的更新是隐式发生的；每当输入一个值时，流状态都会更新以反映成功或失败。然而，如果循环没有读取数据，它永远无法到达\
  \ EOF；因此，更新循环条件意味着循环必须持续读取数据。\n\n#### 标志控制循环\n\n在标志控制循环中，布尔标志变量必须初始化为 `true` 或 `false`，然后在条件改变时进行更新。\n\
  \n* 根据实际情况将标志变量初始化为 `true` 或 `false`。\n* 在条件改变时立即更新标志变量。\n\n在标志控制循环中，在循环结束之前，标志变量基本上保持不变。然后代码检测到某些条件并改变标志的值。由于更新取决于处理过程执行了了操作，有时我们可能必须在决定如何更新条件之前先设计处理过程。\n\
  \n### 设计循环内部的处理过程\n\n一旦我们选择了循环结构的类型，就可以填充处理过程的细节。在设计处理过程时，我们首先决定我们希望单次迭代做什么。假设该处理过程只执行一次。处理过程必须执行哪些任务？\n\
  \n* 被重复的执行过程是什么？\n\n为了回答这个问题，我们必须再次查看问题陈述。问题的定义可能要求处理过程累加数据值或对满足某些条件的数据进行计数。例如：\n\
  \n统计文件中整数个数 `howMany`。\n\n这条语句告诉我们，被重复的过程是一个计数操作。\n\n这是另一个例子：\n\n读取每周每个交易日的股票价格并计算平均价格。\n\
  \n在这种情况下，过程的一部分涉及读取数据值。根据我们对如何计算平均值的知识，我们推断该过程还涉及累加数据。\n\n除了计数和累加，另一种常见的循环过程是读取数据、计算并输出结果。许多操作可以出现在循环过程中。我们在这里只提到了最简单的；稍后我们会查看其他过程。\n\
  \n在确定了执行一次时需要的操作后，我们设计为了正确重复所需的处理部分。我们通常需要添加一些步骤来考虑循环执行多次的事实，这部分设计通常涉及在循环之前初始化某些变量，然后在之后的每次迭代之前重新初始化或更新它们，并引出了我们的后续两个问题：\n\
  \n* 处理过程应该如何初始化？\n* 处理过程应该如何更新？\n\n例如，如果循环内部的处理过程需要执行多个不同的计数和累加，每个操作都必须有自己的语句来初始化变量、增加计数变量或将值加到和中。单独处理每个计数或累加操作——也就是说，先写初始化语句，然后写增加或累加语句。\n\
  \n\n\n当终止条件发生且控制流传递到循环后的语句时，循环中使用的变量仍然包含值。如果 `cin` 流已被使用，读取标记器也留在了流中的某个位置。或者，输出文件可能有了新内容。如果这些变量或文件在程序的稍后部分被使用，则循环必须将它们留在适当的状态。因此，设计循环的最后一步是回答这个问题：\n\
  \n*   *退出循环时，程序的状态是什么？*\n\n为了回答这个问题，我们必须考虑设计的后果，并双重检查其有效性。例如，假设我们使用了一个事件计数器，并且随后的处理依赖于事件的数量。重要的是要（通过算法演练）确保计数器中留下的值是事件的准确数量——而不是差了\
  \ 1。差一错误（Off-by-one bugs）有时被称为 OBOBs。\n\n看这段代码段：\n\n![代码段。](img/9781284166033_CH06_319.jpg)\n\
  \n描述\n\n此循环从输入行中读取字符并统计该行中逗号的数量。然而，当循环终止时，`commaCount` 等于实际逗号数加 1，因为循环在任何事件发生之前将事件计数器初始化为\
  \ 1。通过确定循环退出时 `commaCount` 的状态，我们发现了初始化中的一个缺陷。`commaCount` 应该初始化为 0。\n\n设计正确的循环既取决于经验，也取决于对设计方法的应用。在此时，你可能想阅读章节末尾的“问题解决案例研究”，看看循环设计过程是如何应用到实际问题中的。\n\
  \n## 6.5 嵌套逻辑\n\n正如我们可以嵌套 If 语句一样，我们也可以嵌套 While 语句。通过嵌套，我们可以创建更强大的控制结构。\n\n假设我们想扩展代码来统计单行中的逗号，并对文件中所有行重复此操作。我们只需要将其嵌套在一个由\
  \ EOF 控制的循环内部：\n\n![包含嵌套逻辑的代码。](img/9781284166033_CH06_320.jpg)\n\n描述\n\n由于这两个循环都从同一个文件读取并需要一次引导读取（priming\
  \ read），我们将引导读取从内层（计数逗号）循环的之前移动到了外层（EOF 控制）循环的之前。这样，通过一次读取就能为两个循环都进行引导。在内层循环之前再次包含另一个引导读取将是错误的，因为外部引导读取读取的字符会在我们测试它之前被破坏。\n\
  \n让我们检查简单嵌套循环的通用模式。点号表示外部循环中可能进行处理和更新的地方。\n\n![简单嵌套循环的通用模式。点号表示外部循环中可能进行处理和更新的地方。](img/9781284166033_CH06_320a.jpg)\n\
  \n描述\n\n注意，每个循环都有自己的初始化、测试和更新操作。外部循环可能除了重复执行内层循环外不进行任何处理。相反，内层循环可能只是外层循环所处理工作的一小部分；内层循环之前或之后可能有许多语句。\n\
  \n让我们看另一个例子。对于嵌套的计数控制循环，模式如下（其中 `outCount` 是外层循环的计数器，`inCount` 是内层循环的计数器，`limit1`\
  \ 和 `limit2` 是每个循环执行的次数）：\n\n![嵌套计数控制循环的代码。](img/9781284166033_CH06_321.jpg)\n\n\
  描述\n\n在这里，两个循环都是计数控制循环，但该模式可以用于任何循环组合。\n\n下面的程序显示嵌套在事件控制循环中的计数控制循环。外层循环输入一个整数值，告知在屏幕行上显示多少星号。\n\
  \n![读取一个数字并显示相应数量星号的程序。](img/9781284166033_CH06_321a.jpg)![读取一个数字并显示相应数量星号的程序。](img/9781284166033_CH06_322.jpg)\n\
  \n描述\n\n输出：\n\n![读取数字并显示相应数量星号的程序的输出。](img/9781284166033_CH06_322a.jpg)\n\n描述\n\n\
  为了查看此代码如何工作，让我们根据示例会话显示的数据值跟踪其执行。注意，当 `cin` 处于失败状态时，控制循环的事件是输入一个字母。`starCount` 和\
  \ `loopCount` 是变量。\n\n### 设计嵌套循环\n\n要设计嵌套循环，我们从外层循环开始。其体内的过程要求我们设计内层循环，因此我们对相应的低级模块重复该方法。\n\
  \n例如，上述代码的设计过程如下\n\n1.  *循环结束的条件是什么？* 输入 `'Q'`。\n2.  *应该如何初始化条件？* 在循环开始前应执行引导读取。\n\
  3.  *应该如何更新条件？* 在每次迭代的结束时应该有一个输入语句。\n4.  *重复的过程是什么？* 使用当前输入的值，代码应在某一行上显示相应数量星号。\n\
  \n从这些问题的回答中，我们可以写出大部分算法：\n\n```\nRead starCount\nWHILE Stream okay\n    Output starCount\
  \ asterisks\n    Output newline\n    Prompt\n    Read starCount\nOutput “Goodbye”\n\
  ```\n\n在设计外层循环后，显然其体内的过程要求我们设计内层循环，因此我们对相应的低级模块重复该方法：\n\n1.  *循环结束的条件是什么？* 迭代计数器超过了\
  \ `starCount` 的值。\n2.  *应该如何初始化条件？* 迭代计数器应该初始化为 1。\n3.  *应该如何更新条件？* 在每次迭代结束时迭代计数器加\
  \ 1。\n4.  *重复的过程是什么？* 在标准输出设备上输出单个星号。\n\n\n\n\n\n### 5. *过程应该如何初始化？* 不需要初始化。\n\n\
  6. *过程应该如何更新？* 不需要更新。\n\n7. *退出循环后，程序的状态是怎样的？* 显示了一行星号，写入标记物位于当前行末尾，且 `loopCount`\
  \ 比 `starCount` 的当前值大 1。\n\n现在我们可以写出算法了：\n\n```\nRead starCount\nWHILE Stream okay\n\
  \  Set loopCount = 1\n  WHILE loopCount <= starCount\n    Output '*'\n    Increment\
  \ loopCount\n  Output newline\n  Read starCount\nOutput “Goodbye”\n```\n\n当然，嵌套循环本身可以包含嵌套循环（称为*双层嵌套循环*），它们也可以包含嵌套循环（*三层嵌套循环*），依此类推。你可以将这种设计过程应用于任何任意层数的嵌套。技巧在于通过使用函数化分解方法来推迟细节——即，先关注外层循环，并将每个新层级的嵌套循环视为包含它的循环中的一个模块。\n\
