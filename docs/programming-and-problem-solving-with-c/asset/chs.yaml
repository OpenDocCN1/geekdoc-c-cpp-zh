  \n## 比较字符串\n\n在 C++ 中，`string` 类型是类示例——你从该类型中声明称为对象的变量。记住 C++ 是一种面向对象的语言。在每个 `string`\
  \ 对象内部都是一个字符字符串，你可以使用关系运算符对其进行比较。在语法上，关系运算符的两个数可以是两个 `string` 对象，如下：\n\n![比较两个字符串变量的表达式。](img/9781284166033_CH05_232.jpg)\n\
  \n描述\n\n也可以是一个 `string` 对象和一个 C 字符串，如下：\n\n![一个 string 对象和一个 C 字符串。](img/9781284166033_CH05_232a.jpg)\n\
  \n描述\n\n然而，两个操作数不能都为 C 字符串。\n\n字符串的比较遵循机器字符集的排序顺序（例如 ASCII）。当计算机测试两个字符串之间的关系时，它会从每个字符串的第一个字符开始，根据排序顺序比较这些字符；如果它们相同，则对每个字符串中的下一个字符重复比较。这种逐字符的测试一直进行，直到发现不匹配项或最终字符已比较完毕且相等。如果它们的所有字符都相等，则这两个字符串相等。如果发现不匹配项，则字符在另一个之前的那个即为“较小”的字符串。\n\
  \n例如，给定语句：\n\n![某些字符串赋值。](img/9781284166033_CH05_232b.jpg)\n\n描述\n\n下表中的关系表达式具有指示的值。\n\
  \n| 表达式 | 值 | 原因 |\n| :--- | :--- | :--- |\n| `word1 == word2` | `false` | 它们在第一个字符上不相等。\
  \ |\n| `word1 < word2` | `true` | 在排序顺序中，`‘T’`在`‘S’`之后。 |\n| `word1 < “Tremble”`\
  \ | `false` | 第五个字符不匹配，且`‘b’`在`‘e’`之前。 |\n| `word2 == “Small”` | `true` | 它们相等。\
  \ |\n| `“cat“ < “dog”` | 不可预测 | 操作数不能都为 C 字符串。² |\n\n在大多数情况下，字符串的排序对应于字母顺序；然而，当字符串包含混合大小写字母时，可能会得到非字母顺序的结果。例如，在联系人列表中，我们期望看到\
  \ Macauley 排在 MacPherson 之前，但在 ASCII 排序顺序中，所有大写字母都在小写字母之前，因此字符串 `\"MacPherson\"\
  ` 的比较结果小于 `\"Macauley\"`，因为 `\"P\"` 小于 `\"c\"`。为了按照严格的字母顺序比较字符串，所有字符必须处于相同的大小写状态。一旦我们在第\
  \ 6 章中引入循环，`toupper` 和 `tolower` 函数将提供将字符串转换为相同大小的方法。\n\n如果比较两个长度不同的字符串，且比较在短字符串结束之前是相等的，那么短字符串的比较结果小于长字符串。例如，如果\
  \ `word2` 包含 `\"Small\"`，则表达式\n\n![一个比较语句。](img/9781284166033_CH05_233.jpg)\n\n\
  描述\n\n产生 `true`，因为字符串直到第五个字符位置（左侧字符串的结尾）为止相等，且右侧字符串更长。\n\n*Boolean*（布尔）一词是对乔治·布尔（George\
  \ Boole）的纪念，他是一位十九世纪的英国数学家，使用仅有两个取值的变量——真和假描述了一个逻辑系统。（参见“May”...\n\n## 5.3 If 语句\n\
  \n现在让我们看看如何使用逻辑表达式来改变执行流。`if` 语句是一种控制结构，允许我们提出问题并根据表达式的结果选择行动方案。\n\n### If-Then-Else\
  \ 形式\n\n在 C++ 中，`if` 语句有两种形式：`if-then-else` 和 `if-then`。让我们先看 `if-then-else`。\n\n\
  ![if-else 的语法。](img/9781284166033_CH05_234.jpg)\n\n描述\n\n括号中的表达式可以是任何简单类型；几乎无例外，它将是一个逻辑（布尔）表达式。在运行时，计算机评估表达式。如果值为\
  \ `true`，则执行语句后的两个语句中的第一个。第一个被称为 `then` 子句；第二个被称为 `else` 子句。\n\n注意 C++ 使用 `if` 和\
  \ `else` 关键字，但不包含 `then`。我们使用 `if-then-else` 术语是因为它符合我们的英语习惯：“如果*某事是真的，*那么*这样做，*否则*做那样。”以下是程序中的一个\
  \ If 语句。观察 then 子句和 else 子句的缩进，这使得语句更容易阅读。注意跟后面的语句。\n\n![使用 if 结构的代码。](img/9781284166033_CH05_234a.jpg)\n\
  \n描述\n\n**图 5.3** 显示了语句的控制流。\n\n![If-Then-Else 结构的控制流。](img/9781284166033_CH05_FIGF03.jpg)\n\
  \n图 5.3 If-Then-Else 控制流\n\n![计算薪资的控制流。](img/9781284166033_CH05_FIGF04.jpg)\n\n\
  图 5.4 计算薪资的控制流\n\n这段代码实际上表示：“如果小时小于或等于 40.0，则计算常规工资，然后执行输出语句。但如果小时大于 40，则计算常规工资和加班薪资，然后执行输出语句。”\n\
  \n如果我们想检查输入的有效性，`if-then-else` 是一个自然的选择。例如，在要求计算机除以一个数据值之前，我们应该确保该值不为零。如果除数为零，我们的程序应该显示错误信息。代码如下：\n\
  \n![当除数为零时显示消息的代码。](img/9781284166033_CH05_235.jpg)\n\n描述\n\n\n\n\n作为 If-Then-Else\
  \ 的另一个示例，假设我们想要确定字符串变量中字母 `A` 第一次出现（如果有的话）的位置，以及字母 `B` 第一次出现（如果有的话）的位置。`string`\
  \ 类有一个名为 `find` 的成员函数，它返回找到该项所在的位置（如果未找到该项，则返回命名常量 `string::npos`）。以下程序输出了此类搜索的结果，包括一个成功的和一个失败的。\n\
  \n![一个输出项目位置的程序。](img/9781284166033_CH05_235a.jpg)\n描述\n\n![一个输出项目位置的程序。](img/9781284166033_CH05_236.jpg)\n\
  \n以下是程序的运行结果：\n\n![打印项目位置的程序输出。](img/9781284166033_CH05_236a.jpg)\n描述\n\n注意，根据 If-Then-Else\
  \ 的语法模板，If 语句并不以分号结束。然而，在目前为止我们看到的程序片段中，每个 If 语句的末尾似乎都有分号。实际上，这些分号属于 `else` 子句中的语句。如果\
  \ If 语句本身需要一个分号，我们往往会被迫连续写两个分号。\n\n### 块（复合语句）\n\n在我们的除以零的示例中，假设当除数为 0 时，我们既想显示错误信息，*又*想将名为\
  \ `result` 的变量设为像 9999 这样的特殊值。我们需要在同一个分支中使用两个语句，但语法模板似乎限制我们只能使用一条。\n\n我们真正想做的是将\
  \ `else` 子句变成语句的*序列*。这很容易实现。编译器将块（复合语句）\n\n![一个代码块。](img/9781284166033_CH05_236b.jpg)\n\
  描述\n\n视为单一的语句。如果你在 If 语句的分支中在你想要的语句序列周围加上一对 `{ }`，那么该语句序列就变成了一个单一的块。例如：\n\n![一个包含语句块的程序。](img/9781284166033_CH05_236c.jpg)\n\
  描述\n\n如果 `divisor` 的值为 0，计算机会既显示错误信息，又将 `result` 的值设为 9999，然后继续执行 If 语句之后的任何语句。\n\
  \n块可以同时用于 If-Then-Else 的两个分支，如下所示的程序所示。\n\n![一个除以一个数并在除数为 0 时显示错误信息的程序。](img/9781284166033_CH05_237.jpg)\n\
  描述\n\n这是一个成功的示例：\n\n![成功除法数字的程序结果。](img/9781284166033_CH05_237a.jpg)\n描述\n\n这是一个除法失败的示例：\n\
  \n![除法失败的程序结果。](img/9781284166033_CH05_237b.jpg)\n描述\n\nIf 语句不分号结束，块也不以分号结束，所以记住：*永远不要在块的右括号之后使用分号*。分号只终止赋值、输入和输出语句等简单语句。\n\
  \n### If-Then 形式\n\n有时你会遇到这样的情况：你想说：“*如果*存在某个条件，*那么*就执行某些操作；否则，什么都不做。”换句话说，你希望计算机在不满足特定条件时跳过一系列指令。你可以通过留空\
  \ `else` 分支并只使用空语句来实现这一点：\n\n![if-then 结构。L497+L497](img/9781284166033_CH05_238b.jpg)\n\
  描述\n\n更好的办法是，你可以直接省略 `else` 部分。生成的语句就是 If 语句的 If-Then 形式。这是它的语法模板：\n\n![if 语句的语法模板。if-then\
  \ 形式。](img/9781284166033_CH05_239.jpg)\n\n这是一个 If-Then 的示例。注意随后的语句的缩进。\n\n![If-Then\
  \ 示例。](img/9781284166033_CH05_239.jpg)\n\n\n\n\n我们的意图并不是关注赋值表达式。现在重要的是，要让你看到在本该使用\
  \ `==` 的地方误用了 `=` 会产生的结果。程序可以正确编译，但运行结果是错误的。在调试故障程序时，务必检查你的 If 语句，看看你是否犯了这种特定的错误。\n\
  \n## 5.4 嵌套 If 语句\n\nIf 语句内部的语句内容没有任何限制。因此，在一个 If 内部嵌套一个 If 是可以的。事实上，在一个 If 内部嵌套一个\
  \ If 再嵌套一个 If 也是合法的。这里唯一的局限是，过于复杂的结构很难追踪，而可读性是衡量程序优坏的一个标准。\n\n![使用嵌套 if 语句的代码。](img/9781284166033_CH05_244a.jpg)\n\
  \n描述\n\n当我们把一个 If 嵌套在另一个 If 内部时，我们创建了一个*嵌套控制结构*。控制结构的嵌套就像混合碗一样，较小的嵌套在较大的碗里面。这是一个伪代码示例：\n\
  \n当涉及*多路分支*（有两个以上可选的方案）的问题时，可以使用嵌套 If 语句进行编码。例如，给定月份数字输出月份名称，我们可以使用一系列 If 语句（非嵌套的）：\n\
  \n![使用 if 语句序列根据月份数字输出月份的代码块。](img/9781284166033_CH05_245.jpg)\n\n描述\n\n但等效的嵌套 If\
  \ 结构\n\n![使用嵌套 if 语句根据月份数字输出月份的代码块。](img/9781284166033_CH05_245a.jpg)\n\n描述\n\n\
  效率更高，因为它执行的比较次数更少。第一个版本总是测试所有的 12 个月份数字，即使月份是一月。相比之下，嵌套 If 在选定其中一个后就会跳过剩余的测试。尽管现代计算机速度很快，但许多应用程序需要大量的计算，低效的算法会浪费数小时的计算机时间。只要不让程序变得难以理解，请始终寻找让程序更高效的方法。通常，牺牲一点效率换换可读性会更好。\n\
  \n在最后一个示例中，注意 then 子句和 else 子句的缩进导致语句不断向右移动。或者，我们可以对嵌套 If-Then-Else 语句使用特殊的缩进样式，以指示该结构只是从一组备选项中选择一个。这种通用的多路分支被称为*If-Then-Else-If*控制结构：\n\
  \n![使用 If-Then-Else-If 控制结构根据月份数字输出月份的代码块。](img/9781284166033_CH05_245b.jpg)\n\n\
  描述\n\n这种风格防止了缩进持续向右移动，并且在视觉上传达了我们正在根据变量 `month` 使用一个 12 路分支。\n\nIf 语句序列和嵌套 If 之间有一个重要的区别：If\
  \ 语句序列可以采取多个备选方案，但嵌套 If 只能选择一个选项。为了理解这种区别，请考虑填写在线表单的类比。有些问题就像 If 语句序列，要求你点击列表中所有符合你情况的项目（例如，你的爱好）。其他问题让你在列表中选择一个项目（例如，你的年龄段），因此类似于嵌套\
  \ If 结构。这两种类型的问题在编程问题中都会出现。能够识别这些不同的情况有助于你选择合适的控制结构。\n\n嵌套 If 的另一个用途是从系列连续的数值范围中选择。例如，假设我们根据以下信息，根据室外温度显示相应的活动：\n\
  \n| 活动 | 温度 |\n| :--- | :--- |\n| 游泳 | `temperature > 85` |\n| 网球 | `70 < temperature\
  \ <= 85` |\n| 高尔夫球 | `32 < temperature <= 70` |\n| 滑雪 | `0 < temperature <= 32`\
  \ |\n| 舞蹈 | `indoors temperature <= 0` |\n\n初看之下，你可能想想为每个温度范围编写一个独立的 If 语句。然而，仔细观察发现，如果执行了其中一个\
  \ If 语句，其余部分就可以跳过。我们实际上是从一组可能性中选择一个备选方案——这正是可以使用嵌套 If 结构的情况。这个问题与我们之前的示例唯一的区别在于，我们在分支的\
  \ If 表达式中检查数字范围。\n\n当范围是连续的，我们可以利用这一事实让代码更高效。我们按照范围按连续顺序排列分支。那么，如果到达某个分支，我们就知道之前的范围已经被排除在考虑之外了。因此，If\
  \ 表达式只需要将温度与每个范围的最低值进行比较。要查看它是如何工作的，请看下面的 `Activity` 程序。\n\n![根据室外温度显示相应活动的程序。](img/9781284166033_CH05_246a.jpg)\n\
  \n描述\n\n![根据室外温度显示活动。](img/9781284166033_CH05_247)\n\n要理解 If-Then-Else 结构是如何工作的，考虑测试\
  \ `temperature` 大于 70 的分支。如果进入该分支，我们就知道 `temperature` 必须小于 85，因为这导致了该特定的 `else`\
  \ 分支被执行。因此我们只需要测试是否大于该范围的底部（70）。如果该测试失败，我们进入下一个 else，知道 `temperature` 小于或等于 70。每个连续的分支检查其范围底部，直到到达最后的\
  \ `else`，它处理了所有剩余的可能性。\n\n然而，如果范围不是连续的，我们必须对每个范围的最高值最小值测试数据值。我们仍然使用 If-Then-Else-If，因为这是从多种可能性中选择分支的最佳结构，并且我们可以按顺序排列范围以便人类阅读。在这种情况下，如果范围之间有间隙，无法减少比较次数。\n\
  \n### 悬空 else\n\n当 If 语句嵌套时，你可能会对 `if-else` 配对感到困惑；即 `else` 属于哪个 `if`？例如，假设如果学生的平均分低于\
  \ 60，我们想输出“不及格”；如果至少 60 但小于 70，我们想输出“通过但边缘”；如果是 70 或更高，我们不想输出任何内容。我们使用嵌套在 If 内部的\
  \ If-Then-Else 来编码这些信息：\n\n![嵌套在 If 内部的 If-Then-Else 代码。](img/9781284166033_CH05_247a.jpg)\n\
  \n描述\n\n![嵌套在 If 内部的 If-Then-Else 代码。](img/9781284166033_CH05_248.jpg)\n\n我们如何知道\
  \ `else` 属于哪个 `if`？这里是 C++ 编译器遵循的规则：在没有括号的情况下，`else` 总是与最近的、还没有配对 `else` 的 `if`\
  \ 配对。我们缩进了代码以反映这种配对。\n\n假设我们像这样写片段：\n\n![else 与最近的前一个 if 配对的代码。](img/9781284166033_CH05_248a.jpg)\n\
  \n描述\n\n\n\n\n在这里我们希望 `else` 分支连接到外部的 If 语句，而不是内部的 If，因此我们如你看到的那样对代码进行了缩进。当然，缩进不会影响代码的执行。尽管\
  \ `else` 与第一个 `if` 对齐，但编译器会将其与第二个 `if` 配对。跟在嵌套 If-Then 结构后面的 `else` 被称为*悬空*（dangling）`else`。它在逻辑上不属于嵌套的\
  \ If，但被编译器附加在它上面。\n\n为了将 `else` 链接到第一个 `if` 而不是第二个 `if`，你可以将外部的 then 子句转换为一个块：\n\
  \n![在嵌套 If-Then-Else 代码中将 else 链接到第一个 if 的正确代码版本。](img/9781284166033_CH05_248b.jpg)\n\
  \nDescription\n\n`{ }` 对表示内部的 If 语句已完成，因此 `else` 必须属于外部的 `if`。\n\n## 5.5 逻辑运算符\n\
  \n在数学中，*逻辑*（或*布尔*）*运算符* AND、OR 和 NOT 以逻辑表达式作为操作数。C++ 使用特殊符号表示逻辑运算符：`&&`（用于 AND）、`||`（用于\
  \ OR）和 `!`（用于 NOT）。通过将关系运算符与逻辑运算符结合，我们可以构造出更复杂的断言。例如，在上一节中，我们使用了两个 If 语句来判断平均分是否大于\
  \ 60.0 但小于 70.0。在 C++ 中，我们应该这样写该表达式：\n\n![一个比较语句。](img/9781284166033_CH05_249.jpg)\n\
  \nDescription\n\nAND 运算 `&&` 要求两个关系都为真，整体结果才为真。如果关系中的其中一个或两个为假，则整个结果为假。\n\nOR 运算\
  \ `||` 取两个逻辑表达式并将它们合并。如果*其中一个*或*两者*都为真，结果即为真。只有*两个*值都为假时，结果才为假。例如，我们可以判断期中成绩是否为\
  \ A 或者期末成绩是否为 A。如果任一成绩等于 A，该断言为真。在 C++ 中，我们这样写该表达式：\n\n![一个比较语句。](img/9781284166033_CH05_249a.jpg)\n\
  \nDescription\n\n`&&` 和 `||` 运算符总是出现在两个表达式之间；它们是二元（两个操作数）运算符。NOT 运算符 `!` 是一元（一个操作数）运算符。它位于单个逻辑表达式之前，并给出其相反的结果的结果。如果\
  \ `(grade == 'A')` 为假，那么 `!(grade == 'A')` 为真。NOT 为我们提供了反转断言含义的方便方法。例如，\n\n![一个比较语句。](img/9781284166033_CH05_249b.jpg)\n\
  \nDescription\n\n等同于\n\n![一个比较语句。](img/9781284166033_CH05_249c.jpg)\n\nDescription\n\
  \n在某些上下文中，第一种形式更清晰；在另一些情况下，第二种更有意义。\n\n以下表达式对是等价的：\n\n| 表达式 | 等价表达式 |\n| :--- |\
  \ :--- |\n| `!(a == b)` | `a != b` |\n| `!(a == b \\| a == c)` | `a != b && a !=\
  \ c` |\n| `!(a == b && c > d)` | `a != b || c <= d` |\n\n仔细观察这些表达式，以确保你理解它们为何等价。尝试使用\
  \ `a`、`b`、`c` 和 `d` 的某些值进行求值。注意这个模式：左侧的表达式在其右侧表达式的基础上添加 `!` 并反转关系运算符和逻辑运算符（例如，用\
  \ `==` 代替 `!=`，用 `||` 代替 `&&`）。记住这个模式。它允许你将表达式重写为简单形式。\n\n逻辑运算符可以应用于比较的结果。它们也可以直接应用于\
  \ `bool` 类型的变量。例如，与其写\n\n![一个逻辑语句。](img/9781284166033_CH05_250.jpg)\n\nDescription\n\
  \n来给布尔变量 `isElector` 赋值，可以使用两个中间布尔变量 `isVoter` 和 `isConstituent`：\n\n![一些布尔赋值。](img/9781284166033_CH05_250a.jpg)\n\
  \nDescription\n\n下表总结了对一对逻辑表达式 `x` 和 `y` 应用 `&&` 和 `||` 的结果：\n\n| x | y | x && y\
  \ | x || y |\n| :--- | :--- | :--- | :--- |\n| true | true | true | true |\n| true\
  \ | false | false | true |\n| false | true | false | true |\n| false | false | false\
  \ | false |\n\n下表总结了对布尔变量 `x` 应用 `!` 的结果：\n\n| x | !x |\n| :--- | :--- |\n| true\
  \ | false |\n| false | true |\n\n在全文中，我们将逻辑运算符*仅*应用于逻辑表达式，而不应用于算术运算。*注意：*很容易将逻辑运算符\
  \ `&&` 和 `||` 与另外两个 C++ 运算符 `&` 和 `|` 混淆。我们这里不讨论 `&` 和 `|` 运算符，但我们会告诉你它们被用于操作内存单元中的位——这一角色与逻辑运算符的作用不同。如果你不小心用\
  \ `&` 代替 `&&`，或用 `|` 代替 `||`，你不会收到编译错误信息，但你的程序可能会算出错误的答案。一些程序员将 `&&` 读作 \"and-and\"\
  ，将 `||` 读作 \"or-or\"以避免出错。\n\n前述赋值语句也可以通过 If 语句实现；即\n\n![代码。](img/9781284166033_CH05_251b.jpg)\n\
  \nDescription\n\n可以实现\n\n![代码。](img/9781284166033_CH05_251c.jpg)\n\nDescription\n\
  \n如你所示，第一种形式编写更简单，而且通过练习更容易阅读。\n\n以下应用根据温度和是否下雨将布尔变量 `walk`、`movie` 和 `book` 设置为\
  \ `true` 或 `false`。然后使用 If 语句输出结果。\n\n![根据给定温度输出适当活动的程序。](img/9781284166033_CH05_251d.jpg)\n\
  \nDescription\n\n![根据给定温度输出适当活动的程序。](img/9781284166033_CH05_252.jpg)\n\n以下是针对四组不同输入运行该程序的结果：\n\
  \n![针对四组不同输入，根据给定温度输出适当活动的程序的输出。](img/9781284166033_CH05_252a.jpg)\n\nDescription\n\
  \n\n\n\n\n![针对四组不同输入为给定温度输出适当活动的程序输出。](img/9781284166033_CH05_253.jpg)\n\n### 短路求值\n\
  \n考虑以下逻辑表达式\n\n![一个逻辑表达式。](img/9781284166033_CH05_253a.jpg)\n\n描述\n\n某些编程语言对逻辑表达式使用*全求值*。在全求值的情况下，计算机在应用\
  \ `&&` 运算符产生最终结果之前，会先评估两个子表达式（`i == 1` 和 `j > 2` 都会被评估）。\n\n相比之下，C++ 对逻辑表达式使用`短路`（或条件）求值。评估从左到右进行，计算机一旦知道整个表达式的布尔值，就会尽快停止评估子表达式。如果不检查所有的子表达式，计算机如何知道一个长长的逻辑表达式产生\
  \ `true` 还是 `false` 呢？让我们先看 AND 操作。\n\n只有当两个操作数均为 `true` 时，AND 操作才会产生值 `true`。在前面的表达式中，假设\
  \ `i` 的值恰好是 95。第一个子表达式产生 `false`，因此没有必要看第二个子表达式。计算机停止评估并产生最终结果 `false`。\n\n对于 OR\
  \ 操作，一旦发现产生 `true` 的子表达式，从左到右的评估就会停止。记住，只要两个操作数中的一个或两个为 `true`，OR 就会产生结果 `true`。假设我们有这个表达式：\n\
  \n![一个逻辑表达式。](img/9781284166033_CH05_253b.jpg)\n\n描述\n\n如果第一个子表达式为 `true`，评估停止，整个结果为\
  \ `true`。计算机不会浪费时间对第二个子表达式进行不必要的评估。\n\n### 运算符的优先级\n\n在第 3 章中，我们讨论了优先级规则——即控制复杂算术表达式评估的规则。C++\
  \ 的优先级规则不仅适用于复杂的算术表达式，还适用于关系运算符和逻辑运算符。以下是算术运算符、关系运算符和逻辑运算符的优先级列表（包含了赋值运算符）：\n\n\
  ![运算符的优先级。](img/9781284166033_CH05_255.jpg)\n\n描述\n\n同一行的运算符具有相同的优先级。如果一个表达式包含多个具有相同优先级的运算符，大多数运算符将从左到右分组（或*结合*）。例如，表达式\n\
  \n![一个数学表达式。](img/9781284166033_CH05_255a.jpg)\n\n描述\n\n意味着 `(a / b) * c`，而不是 `a\
  \ / (b * c)`。然而，一元运算符（`!`、一元 `+`、一元 `-`）从右到左分组。虽然你永远不会想使用这个表达式，\n\n![一个数学表达式。](img/9781284166033_CH05_255b.jpg)\n\
  \n描述\n\n它的含义是 `(!badData)` 而不是毫无意义的 `!!badData`。附录 B“运算符优先级”列出了 C++ 中所有运算符的优先级。在附录中，你还可以看到几个从右到左结合的运算符（出于类似原因）。\n\
  \n括号在评估表达式时可以覆盖优先级。如果你不确定是否需要括号，也请务必使用它们。编译器会忽略不必要的括号。因此，如果它们能澄清表达式，就使用它们吧。有些程序员喜欢在将关系表达式赋值给布尔变量时使用括号：\n\
  \n![一个表达式。](img/9781284166033_CH05_256.jpg)\n\n描述\n\n这里不需要括号；因为赋值的优先级低于 `==`。但由于\
  \ `if` 语句要求逻辑表达式包含在括号内，因此带括号的版本是一个信号，表示该表达式给出了逻辑结果。关于括号的最后一点：C++ 要求括号成对使用。每当你写一个复杂的表达式时，花一点时间检查所有的左括号是否有对应的右括号。\n\
  \n### 浮点数类型的关系运算符\n\n到目前为止，我们讨论了 `int`、`char` 和 `string` 值的比较。这里我们来看 `float` 值。*不要对浮点数进行等值比较。*因为在对浮点数进行计算时，右侧几位小数可能会产生微小误差，两个\
  \ `float` 值很少完全相等。例如，考虑以下代码，它使用了两个名为 `oneThird` 和 `x` 的 `float` 变量：\n\n![程序代码。](img/9781284166033_CH05_257.jpg)\n\
  \n描述\n\n我们期望 `x` 是 1.0，但 `oneThird` 可能是 0.333333。第一个赋值语句将 0.333333 赋值给 `oneThird`，第二个赋值语句将\
  \ 0.999999 赋值给 `x`。与其对浮点数进行等值比较，不如测试它们是否*接近*。为了这样做，我们计算两个数的差。例如，我们经常使用这样的比较：\n\n\
  ![比较语句。](img/9781284166033_CH05_257d.jpg)\n\n描述\n\n`fabs` 是 标准库中的绝对值函数。如果 `fabs(r\
  \ - s)` 的结果小于 0.0001，则这两个数就足够相等。这种模式在布尔代数中由德·根定律的形式化。\n\n## 5.6 测试 I/O 流的状态\n\n\
  在第 4 章中，我们讨论了 C++ 中的输入和输出流。该讨论引入了 `istream`、`ostream`、`ifstream` 和 `ofstream` 类。记住，任何情况可能导致输入流进入失败状态：\n\
  \n*   无效输入数据\n*   尝试读取文件末尾\n*   尝试打开不存在的文件\n\nC++ 提供检查流是否处于失败状态的方法。在逻辑表达式中，你可以直接将流对象（如\
  \ `cin`）像布尔变量一样使用：\n\n![程序代码。](img/9781284166033_CH05_258a.jpg)\n\n描述\n\n这被称为**测试状态**。测试的结果为\
  \ `true`（表示对流的操作成功）或 `false`（表示之前的操作导致流进入了失败状态）。将逻辑表达式中的流对象想象成值为 `true`（状态正常）或 `false`（状态异常）的布尔变量。\n\
  \n在 `if` 语句中，你组织逻辑表达式的方式取决于你想让执行语句做什么。\n\n![程序代码。](img/9781284166033_CH05_258b.jpg)\n\
  \n描述\n\n如果对 `inFile` 的最后 I/O 操作成功，则执行该语句。\n\n![程序代码。](img/9781284166033_CH05_259.jpg)\n\
  \n描述\n\n如果 `inFile` 处于失败状态，则执行该语句。\n\n这是一个示例展示了如何检查输入文件是否成功打开：\n\n![一个检查输入文件是否成功打开的程序。](img/9781284166033_CH05_259a.jpg)\n\
  \n\n\n\n\n![Description](img/9781284166033_Alt.xhtml_fig560)\n\n在该程序中，我们首先尝试打开文件\
  \ `measures.dat` 进行输入。紧接着，我们检查该操作是否成功。如果成功，则 `If` 语句中表达式 `!inFile` 的值为 `false`，并跳过\
  \ `then` 子句。程序继续从文件中读取数据，然后进行计算。最后，程序执行该语句并结束：\n\n![Program code.](img/9781284166033_CH05_259b.jpg)\n\
  \n![Description](img/9781284166033_Alt.xhtml_fig561)\n\n通过该语句，`main` 函数将控制权交回操作系统。请记住，`main`\
  \ 返回的值被称为退出状态。值 `0` 表示程序正常完成。任何其他值（通常为 `1`、`2`、`3`、. . .）都意味着发生了错误。\n\n让我们再次追踪程序，假设我们无法打开输入文件。从\
  \ `open` 函数返回后，流 `inFile` 处于失败状态（fail state）。在 `If` 语句中，表达式 `!inFile` 的值为 `true`。因此，执行\
  \ `then` 子句。程序向用户显示错误消息然后终止，返回退出状态 `1` 以通知操作系统发生了异常终止。（我们选择值 `1` 作为退出状态完全是随机的。程序员有时会在程序中使用多个不同的值来表示程序终止的各种原因，但大多数人只使用值\
  \ `1`。）\n\n每当你打开一个数据文件进行输入操作时，请务必在继续操作之前测试流的状态。如果你忘记这样做，且计算机无法打开该文件，你的程序将静默地继续执行，并忽略对该文件的任何输入操作。\n\
