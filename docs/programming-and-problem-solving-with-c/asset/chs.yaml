  \ GUI。\n\n![一个标记为 Calendar Appointments A p p 的 G U I 窗口。](img/9781284166033_CH15_P944.jpg)\n\
  \n描述\n\n### **添加应用程序状态**\n\n现在 GUI 已到位，我们将其与应用程序的状态（存储的信息）连接起来——即日历数据。`AppointmentCalendar`\
  \ 类包含 `EntryWithDate` 对象的列表。我们需要提供一种访问这些数据的方法。将在 `AppointmentCalendar` 中添加迭代器方法，以便我们可以遍历条目。\n\
  \n```cpp\nclass AppointmentCalendar {\n    // ...\n    class Iterator {\n    public:\n\
  \        Iterator(const List<EntryWithDate*>& list) : m_it(list.begin()) {}\n  \
  \      EntryWithDate* operator*() { return *m_it; }\n        Iterator& operator++()\
  \ { ++m_it; return *this; }\n        bool operator!=(const Iterator& other) const\
  \ { return m_it != other.m_it; }\n    private:\n        List<EntryWithDate*>::const\
  \ m_it;\n    };\n    Iterator begin() { return Iterator(m_entries); }\n    Iterator\
  \ end() { return Iterator(m_entries.end()); }\n    // ...\n};\n```\n\n有了这些迭代器，我们可以实现以下逻辑：\n\
  \n```cpp\nfor (AppointmentCalendar::Iterator it = calendar.begin(); it != calendar.end();\
  \ ++it) {\n    EntryWithDate* entry = *it;\n    // ...\n}\n```\n\n\n\n\n在上一章中，我们讨论了\
  \ `EventHandlers` 类，它用于处理 GUI 中按钮被按下时发生的事件。该类的目的是是将事件处理逻辑与 GUI 接口本身的实现隔离开。在这个应用程序中，我们将事件处理代码包含在\
  \ `AppointmentCalendarWindow` 类的实现内部。我们有许多方法可以实现事件处理器，以及将它们连接到由 GUI 组件生成的事件。在这种情况下，我们选择遵循\
  \ Qt 开发人员建议的方法，这对于本应用程序来说是最直观的。\n\n编写事件处理接口有三个方面：知道会发生哪些事件，知道当每个事件发生时应用程序需要做什么，以及知道为了响应事件必须更改程序状态的哪个部分（如果有的话）。此应用程序有三个我们关心的事件，每个每个事件都将触发一个操作。我们将使用以下列表来指导实现工作：\n\
  \n1. 当点击预约条目列表中的某一项（事件）时，应用程序将表单条目设置为对应的预约数据（操作）。应用程序将记录点击了列表中的哪一项，以及用于将数据加载到表单的预约日历条目（状态更改）。\n\
  2. 当点击保存 按钮（事件）时，应用程序将从表单获取可能经过编辑的数据，并执行验证检查以确保所有表单字段都不空。如果任何字段为空，它将显示错误消息并返回。如果数据有效，它将检查这些数据与当前存储的数据是否有所不同。如果没有差异，它将显示相应的消息并返回（操作）。如果数据发生了变化，它将从预约日历中删除现有条目，使用表单中的数据在预约日历中创建一个新条目，并更新\
  \ GUI 中的列表部件（状态更改）。\n3. 当点击退出 按钮（事件）时，应用程序将关闭（操作，无显式状态更改）。\n\n我们将首先通过扩展 `AppointmentCalendarWindow`\
  \ 类的定义，为上述列表中的每个事件处理器添加方法原型。Qt 框架将事件处理器称为“槽”（slots），并扩展了 C++ 语言以指定特定方法为槽方法（事件处理器方法），这些方法用于处理事件。以下是我们需要添加到\
  \ `AppointmentCalendarWindow` 类中的代码：\n\n![代码片段。](img/9781284166033_CH15_P947.jpg)\n\
  \n描述\n\n这些方法对于该类是私有的，并用“slots”语法标识。最后两个方法原型没有参数，因为我们稍后会在代码中将特定按钮连接到适当的处理器上。然而，由于我们不知道预约条目列表中会被点击哪一项，`HandleEntryItemClickedEvent`\
  \ 方法将接收被点击的特定项作为参数。正如我们的清单所提醒的那样，我们还添加了两个成员变量，用于记录被点击的当前部件项及其对应的预约条目。这些变量的使用将在我们讨论处理器方法的实现时变得显而易见：\n\
  \n![两个语句。](img/9781284166033_CH15_P947-1.jpg)\n\n描述\n\n最容易实现的事件处理器是 `HandleExitButtonClickedEvent`\
  \ 方法，因为它只需要做一件事：关闭应用程序。以下是它的实现：\n\n![程序代码。](img/9781284166033_CH15_P947-2.jpg)\n\
  \n描述\n\n该方法非常直观——它简单地调用此 `AppointmentCalendarWindow` 对象的 `close` 方法，由 Qt 框架处理 GUI\
  \ 应用程序的退出。一旦我们实现了每个处理器，就可以看到如何将处理器连接到事件。\n\n我们考虑的下一个处理器是 `HandleEntryItemClickedEvent`\
  \ 方法及其要求。该处理器的目标是为表单加载与在列表中点击的名称相关的预约数据。如果你还记得，我们之前通过创建 `QListWidgetItem` 并将其显示文本设置为预约条目中人的姓和名，从而在\
  \ GUI 中创建了每个列表条目。然而，我们并没有将其他预约数据与它一并保存。我们可以在 GUI 列表中显示每个条目的的所有预约数据，但那样会很混乱，并且重复了表单将显示的内容。\n\
  \n`QListWidgetItem` 类确实提供了将其他数据与其关联的支持。遗憾的是，我们只能将 Qt 对象与列表项关联。因此，我们的解决方案是将预约条目转换为一个\
  \ Qt 对象，并将其存储在 `QListWidgetItem` 中。当用户点击它时，我们就可以在 `HandleEntryItemClicked-Event`\
  \ 处理器中访问预约数据。\n\n在查看事件处理器的实现之前，我们需要重构代码将剩余的预约数据添加到 GUI 列表中。以下是 `LoadList-Widget`\
  \ 方法的新实现，高亮了更改部分：\n\n![代码片段。](img/9781284166033_CH15_P948.jpg)\n\n描述\n\n对于日历中的每个条目，我们都创建一个新的\
  \ `QListWidgetItem`。在之前的实现中，我们将显示的字符串传递给构造函数。在这里，我们从条目获取名称以构造列表部件将渲染的字符串。我们调用 `QListWidgetItem`\
  \ 的 `setText` 方法设置文本。\n\n接下来，我们希望将预约数据与 `ListWidgetItem` 关联，以便在 `HandleEntryItem`\
  \ 事件方法中检索它们。我们无法使用 `EntryWithDate` 对象，因为 `WidgetItem` 只允许我们给它提供 Qt 对象。然而，Qt 确实提供了自己的字符串类型\
  \ `QString`，我们可以从内置的 C++ 字符串轻松实例化它。\n\n我们唯一需要的是能够将预约表示为字符串。我们通过扩展 `EntryWithDate`\
  \ 类来实现一个 `ToString` 方法来返回预约的字符串表示。返回的字符串仅仅是 `EntryWithDate` 中包含的每个数据项（例如，姓、名、日、小时等）用空格分隔。我们还添加了一个名为\
  \ `FromString` 的静态类方法，它将预约条目的字符串表示转换为 `EntryWithDate` 对象。这些方法的实现非常直观，所以我们在这里不显示它们，但它们包含在本节末尾的代码列表中。一旦我们将预约条目转换为标准\
  \ C++ 字符串，就会使用 Qt 的静态类方法 `fromStdString` 将其再次转换为 `QString`。这就是前面代码中那两行所实现的：\n\n\
  ![两个语句。](img/9781284166033_CH15_P949.jpg)\n\n描述\n\n现在我们解释接下来的两行，它们负责将此字符串放入列表项。列表部件中的项可以有许多不同的属性，例如显示字体、背景颜色等。Qt\
  \ 将这些属性中的每一个视为项行为的一个“角色”（role）。它还提供了一个通用的角色，称为 `Qt::UserRole`，让我们可以使用 `setData`\
  \ 方法在项中存储关联的数据值。然而，在调用 `setData` 之前，我们的 `QString` 值还需要进行一次类型转换。\n\n\n\nQt 需要能够灵活地将不同类型的值传递给方法，因此设计者开发了一种可以持有许多不同数据类型的联合体（union）类型。回想一下联合体类似于结构体（struct），带有一个成员列表，但在任何给定时刻，它只能持有各种可能类型值中的一种。因此，Qt\
  \ 的设计者将他们的联合体类型称为 `QVariant`。而它可以包含的许多 Qt 类型之一就是 `QString`。正如你可能已经猜到的那样，`setData`\
  \ 方法期望接收一个 `QVariant` 类型的参数。\n\n因此，我们只需通过向其构造函数传递条目的 `QString` 表示形式来构造一个新的 `QVariant`。然后，我们最终就可以使用\
  \ `setData` 将条目数据存储在列表中项，指定数据的角色为 `Qt::UserRole` 并提供该 `QVariant` 对象。\n\n![2 条语句。](img/9781284166033_CH15_P949-1.jpg)\n\
  描述\n\n最后，我们将该项添加到列表小部件中。我\n\n![一条语句。名称列表小部件，减号，右直角，添加项，左括号，项，右括号，分号。](img/9781284166033_CH15_P949-2.jpg)\n\
  \n现在我们已经在每个列表项内部拥有了预约数据，我们可以将注意力回到 `HandleEntryItemClicked` 事件处理程序的实现上。回想一下，当用户点击某一项时，处理程序通过在表单形式中显示条目数据，并记住表单中加载了哪一个项以及该条目包含的内容。这里是它的代码：\n\
  \n![代码片段。](img/9781284166033_CH15_P949-3.jpg)\n描述\n![代码片段的延续。](img/9781284166033_CH15_P950.jpg)\n\
  描述\n\n所有的脚手架已就绪，此方法的实现变得显而易见。首先，如果由于之前的操作在 GUI 上显示了任何消息，我们希望清除它。当我们查看保存按钮的事件处理程序时，将看到可能是如何发生的。接下来，我们获取与项小部件关联的预约条目。我们通过调用它的\
  \ `data` 方法并传递 `Qt::UserRole` 值来实现此，以便它返回我们与该项关联的数据。返回值的类型是 `QVariant`，我们需要将其转换为\
  \ `QString`，然后我们可以使用 `toStdString` 将其转换为 C++ 字符串。该字符串随后被传递给 `EntryWithDate` 类的静态方法\
  \ `FromString`，该方法会将其转换回 `EntryWithDate` 对象。我们通过将条目传递给 `SetFormFromEntry` 方法来填充表单，我们将在接下来展示该方法的定义。最后，我们将\
  \ `currentItemLoaded` 变量设置为我们刚刚点击的项，并将 `currentEntry` 设置为从列表项中提取的条目。我们需要记住这两个值，以防表单字段被修改并点击了保存按钮。\n\
  \n正如你从前文中预期的那样样，从我们的条目获取数据到表单将涉及每个条目成员转换为对应的 Qt 类型，然后设置表单中的字段以显示这些转换后的值。由于其中几个转换是到\
  \ `QString` 的，我们将仅定义一个该类型的变量 `qs`，用于临时持有每个进入表单路径的值。这里是 `SetFormFromEntry` 方法的实现：\n\
  \n![部分程序代码。](img/9781284166033_CH15_P950-1.jpg)\n描述\n\n方法的第一个部分是直观的。我们从条目中提取 `Name`、`Date`\
  \ 和 `TimeOfDay` 对象。然后将名称的部分转换为 `QString` 对象，并用于设置表单中每个对应字段的显示文本。\n\n日期和时间小部件需要一些额外的类型转换。它期望一个包含日期时间的\
  \ `QDateTime` 对象。然而，Qt 并没有提供直接构建 `QDateTime` 的构造函数。相反，我们需要使用来自 `Date` 对象的年、月、日来创建一个\
  \ `QDate` 对象，并使用从我们的 `TimeOfDay` 对象获得的小、分、秒创建一个 `QTime` 对象。然后，我们最终可以从这些 `QDate`\
  \ 和 `QTime` 对象创建一个 `QDateTime` 对象。这种对象类型的分层是面向对象设计中的一种常用方法，其目标是让每个对象都具有非常特定的职责。\n\
  \n我们需要的最后一个事件处理程序是 `HandleSaveButtonClickedEvent`。该处理程序的动作是验证没有空表单字段，如果有则显示错误消息；如果没有需要保存的更改，则警告用户；将预约的任何更改保存到显示给用户的列表小部件；将更改保存到日历预约列表中；并将新的日历预约列表写回日历文件。幸运的是，到目前我们已经涵盖了许多细节，因此此方法的实现应该是显而易见的。\n\
  \n![程序片段。](img/9781284166033_CH15_P951.jpg)\n描述\n\n![程序片段的延续。](img/9781284166033_CH15_P952.jpg)\n\
  描述\n\n\n\n现在我们已经看到了事件处理方法的实现，接下来需要将它们与调用这些方法的事件连接起来。Qt 框架提供了特殊的函数，允许我们将一个事件连接到事件处理程序。在\
  \ Qt 术语中，事件被称为信号（signal），正如我们之前提到的，事件处理器占据一个槽（slot），事件循环通过该槽来查找特定信号的事件处理器。这种设置是通过一个\
  \ `connect` 方法完成的，我们将在 `InitializeEventHandlers` 方法中调用它，而该方法是由 `AppointmentCalendarWindow`\
  \ 构造函数调用的：\n\n![代码片段。](img/9781284166033_CH15_P953.jpg)\n\n描述\n\n`connect` 方法有四个参数。第一个是产生信号（事件）的控件，第二个是信号类型，第三个是处理信号的对象，第四个是要调用的事件处理器。控件项可以生成的信号类型在与控件相关的\
  \ Qt 文档中有所说明。\n\n`QListWidget` GUI 组件可以产生 `itemClicked` 信号，该信号提供指向被点击的 `QListWidgetItem`\
  \ 指针。我们通过将该信号与我们的 `HandleEntryItemClickedEvent` 处理器关联，让 Qt 监听该信号，它接收被点击的 `QListWidgetItem`\
  \ 指针。`QPushButton` 控件可以产生 `clicked` 信号，因此我们让 Qt 监听它并在按钮被点击时调用我们的 `HandleSaveButtonClickedEvent`\
  \ 事件处理器。最后，如果退出按钮产生 `clicked` 信号，我们的 `HandleExitButtonClickedEvent` 处理器就会被调用。Qt\
  \ 在后台做了大量工作来将信号与槽关联，其目的是让我们使用 `connect`、`SIGNAL` 和 `SLOT` 函数变得非常简单。\n\n我们在下方列出了\
  \ `EntryWithDate`（高亮显示）的更改，以及 `AppointmentCalendarWindow` 的规范和实现。\n\n![程序段。](img/9781284166033_CH15_P954.jpg)\n\
