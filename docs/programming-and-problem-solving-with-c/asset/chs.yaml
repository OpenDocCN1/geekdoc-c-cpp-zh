  \n描述\n\n如果你在 Qt Creator IDE 中编译并运行程序，你将看到一系列对话框，让你指定格式化名称程序使用的文件，然后它将从一个文件读取输入并将输出写入另一个文件。\n\
  \n### 测试与调试\n\n实现程序的一个重要部分对其进行测试（检查结果）。在通过手动验证足够答案以确保程序运行正常之前，不要信任计算机会给你正确的答案。\n\
  \n\n\n\n\n从这里开始，这些“测试与调试”章节将提供关于如何测试你的程序以及当程序运行不符合预期时该怎么办的提示。但不要等发现了 bug 后才去读“测试与调试”章节——预防\
  \ bug 比修复它们要容易得多。\n\n在测试接收文件数据值作为输入的程序时，输入操作可能会导致文件流进入失败状态（fail state）。输入失败的两个最常见原因是数据无效和文件结束（end-of-file）错误。\n\
  \n当程序已经读取了整个文件，但仍需要更多数据来填充其输入语句中的变量时，就会发生文件结束错误。这可能是因为数据文件根本没有准备好。也许它包含的数据项少于程序所需的数量。或者可能是输入数据的格式不正确。例如，在数值之间漏掉空格就会导致这种问题。\n\
  \n例如，假设我们希望数据文件包含三个整数值：25、16 和 42。看看这些数据会发生什么：\n\n![文件中的数据。](img/9781284166033_CH04_PRE54.jpg)\n\
  \n描述\n\n以及这段代码：\n\n![程序代码。](img/9781284166033_CH04_PRE55.jpg)\n\n描述\n\n前两个输入操作消耗了文件中的数据，导致第三次操作没有数据可读。流\
  \ `inFile` 进入失败状态，因此 `k` 没有被赋予新值，计算机跳到下一条语句而没有发出错误消息。\n\n如果数据文件准备正确但仍然发生文件结束错误，那么问题就出在程序逻辑上。出于某种原因，程序尝试了过多的输入操作。错误可能是一些简单问题，例如在输入语句中指定了过多的变量。也可能是误用了\
  \ `ignore` 函数，导致值被无意中跳过。又可能是算法中的严重缺陷。你应该检查所有的可能性。\n\n输入失败的另一个大源——数据无效——有几种可能的原因。最常见的是数据准备过程中的错误。不恰当地混合数值和字符数据会导致输入流失败；例如，当读取标记位于非数值字符时，它却尝试读取一个数值。另一个原因是使用了错误的变量名（恰好其数据类型也不对）。将变量声明为错误的数据类型是该问题的变体。最后，在输入语句中漏掉了一个变量（或包含了一个额外的变量）会导致读取标记最终位于错误类型的数据上。\n\
  \n另一个疏忽是在 I/O 语句中本该指定文件流时，却使用了 `cin` 或 `cout`。如果你误用 `cin` 而不是输入文件流，程序将等待键盘输入。如果你误用\
  \ `cout` 而不是输出文件流，你会在屏幕上得到意外的输出。\n\n通过提供一个可以帮助你组织并保持程序易于管理的框架\n\n通过提供一个可以帮助你组织并保持程序易于管理的框架，你可以使用功能分解，这意味着将程序分解为更小的、独立的模块。这使得测试和调试每个模块变得更容易。\n\
  \n### 测试与调试提示\n\n1. 前两个输入操作消耗了文件中的数据，导致第三次操作没有数据可读。流 `inFile` 进入失败状态，因此 `k` 没有被赋予新值，计算机跳到下一条语句而没有发出错误消息。\n\
  2. 如果数据文件准备正确但仍然发生文件结束错误，那么问题就出在程序逻辑上。出于某种原因，程序尝试了过多的输入操作。\n\n\n\n\n\n第 1 章中的 `LeapYear`\
  \ 程序展示了选择过程的工作原理。计算机必须判断某一年是否为闰年。它通过询问该年份是否不能被 4 整除来判断。如果答案为真，计算机返回一个表示该年份不是闰年的值。如果答案为假，计算机将继续检查通用规则的例外情况。在第\
  \ 1 章中，我们提到过这种结构就像路上的分叉口。\n\n![路上的分叉口。](img/9781284166033_CH05_227.jpg)\n\n在检查选择控制结构之前，让我们来看看如何让计算机做出决策。\n\
  \n## 5.2 条件与逻辑表达式\n\n要提问一个真/假问题，我们并不以提问的形式表述，而是将其陈述为一个断言。例如，在 true 真假判断测试题中，你不会看到“2\
  \ 等于多少？”这个问题。相反，你会看到断言“2 + 2 等于 4”，你可以检查它是真还是假。在 C++ 中，提问变成了做出一个为真或为假的断言。计算机评估该断言，将其与某些内部条件（例如存储在特定变量中的值）进行比对，以判断它是真是假。\n\
  \n### bool 数据类型\n\n在 C++ 中，`bool` 数据类型是一种内置类型，由两个值组成：`true` 和 `false`。保留字 `bool`\
  \ 是 Boolean 的缩写（读音为“BOOL”）。布尔数据用于测试程序中的条件，以便计算机能够做出决策（通过选择控制）。我们声明 `bool` 类型变量的方法与其他类型相同——即通过编写数据类型的名称和标识符：\n\
  \n![类型为 bool 的某些变量。(images/9781284166033_CH05_228.jpg) 描述每个 `bool` 类型的变量都可以包含 `true`\
  \ 或 `false`。从一开始就理解这一点很重要：`true` 和 `false` 不是变量名，也不是字符串。它们是 C++ 中的特殊常量，实际上它们是保留字。###\
  \ 逻辑表达式在编程语言中，断言以逻辑表达式（也称为布尔表达式）的形式存在。正如算术表达式由数值和运算符组成一样，逻辑表达式由逻辑值和运算符组成。每个逻辑表达式的求值均为\
  \ `true` 或 `false`。以下是一些逻辑表达式的示例：*   布尔变量或常量*   一个表达式后跟一个关系运算符，再跟一个表达式*   一个逻辑表达式后跟一个逻辑运算符，再跟一个逻辑表达式让我们详细查看每一个。####\
  \ 布尔变量与常量正如我们所见，布尔变量是声明为 `bool` 类型的变量，它可以包含值 `true` 或值 `false`。例如，如果 `dataOK` 是一个布尔变量，那么![一个\
  \ bool 赋值语句。(images/9781284166033_CH05_229.jpg) 描述是一个有效的赋值语句。#### 关系运算符我们也可以将布尔变量设置为使用关系运算符比较两个表达式的结果。关系运算符测试两个值之间的关系，例如小于、等于或大于。让我们来看一个例子。在后续中，`lessThan`\
  \ 是布尔变量，而 `i` 和 `j` 是 `int` 变量：![比较 int 变量并将产生的布尔值赋值给布尔变量。(images/9781284166033_CH05_229.jpg)\
  \ 描述通过比较两个值，我们断言它们之间存在某种关系（例如“小于”）。如果关系确实存在，则断言为 `true`；否则，则为 `false`。我们可以在 C++\
  \ 中测试以下关系：| 运算符 | 测试的关系 || :--- | :--- || `==` | 等于 || `!=` | 不等于 || `>` | 大于 ||\
  \ `<` | 小于 || `>=` | 大于等于 || `<=` | 小于等于 |一个表达式后跟一个关系运算符，再跟一个表达式，被称为关系表达式。关系表达式的结果类型为\
  \ `bool`。例如，如果 `x` 是 5 且 `y` 是 10，以下表达式的值均为 `true`：![某些关系表达式。(images/9781284166033_CH05_229b.jpg)\
