  \n![两条语句。](img/9781284166033_APP_P1251-5.jpg)\n\n描述\n\n![一条语句。](img/9781284166033_APP_P1252.jpg)\n\
  \n描述\n\n最后一条语句中的值 100 是任意的。任何“足够大”的数字都可以。\n\n下表总结了在读取 C 字符串时，`>>` 操作符与 `get` 函数之间的区别：\n\
  \n![总结流提取操作符与 get 函数之间区别的表格。](img/9781284166033_APP_P1252-1.jpg)\n\n描述\n\n某些库函数和系统提供类的成员函数需要\
  \ C 字符串作为参数。例如名为 `open` 的 `ifstream` 类成员函数。为了打开文件，我们以 C 字符串的形式传递文件名，可以是常量也可以是变量：\n\
  \n![一个代码片段。](img/9781284166033_APP_P1252-2.jpg)\n\n描述\n\n如果我们的文件名包含在 `string` 类对象中，我们仍然可以使用\
  \ `open` 函数，前提是使用名为 `c_str` 的 `string` 类成员函数将字符串转换为 C 字符串：\n\n![一个代码片段。](img/9781284166033_APP_P1252-3.jpg)\n\
  \n描述\n\n对比这两个代码段，你可以观察到 `string` 类相对于 C 字符串的一个主要优势：`string` 类对象中的字符串具有无界长度，而 C 字符串的长度受数组大小限制，该大小在编译时是固定的。\n\
  \n### H.3 C 字符串库例程\n\n通过头文件 `cstring`，C++ 标准库提供了大量的 C 字符串操作。在本节中，我们讨论了其中的三个库函数：`strlen`\
  \ 返回字符串的长度；`strcmp` 使用小于、等于和大于关系比较两个字符串；以及 `strcpy` 将一个字符串拷贝到另一个。以下是 `strlen`、`strcmp`\
  \ 和 `strcpy` 的总结：\n\n![总结 c string 库中几个函数作用的表格。](img/9781284166033_APP_P1253.jpg)\n\
  \n描述\n\n`strlen` 函数与我们之前编写的 `StrLength` 函数类似。它返回 C 字符串中终止符 `'\\0’` 之前的字符数。这里是该函数的调用示例：\n\
  \n![一个代码片段。](img/9781284166033_APP_P1253-1.jpg)\n\n描述\n\n`strcpy` 例程非常重要，因为 C 字符串不允许使用\
  \ `=` 操作符进行聚合赋值。在接下来的代码片段中，我们展示了执行字符串拷贝的错误和正确方法。\n\n![一个代码片段。](img/9781284166033_APP_P1253-2.jpg)\n\
  \n描述\n\n在 `strcpy` 的参数列表中，目标字符串位于左侧，赋值从右侧传递数据。调用者有责任确保目标数组足够大。`strcpy` 函数在技术上是一个返回值的函数；它不仅将一个字符串拷贝到另一个，还会返回目标数组的基地址。调用者想要使用此返回值的理由并不明显，我们在这里不讨论它。程序员几乎总是像认为它是\
  \ `void` 函数一样地忽略它的返回值。\n\n`strcmp` 函数用于比较两个字符串。它接收两个 C 字符串作为参数，并按照字典顺序（`string`\
  \ 对象使用的排序）进行比较。给定函数调用 `strcmp(str1, str2)`，返回以下值之一：如果 `str1 < str2` 返回负整数；如果 `str1\
  \ = str2` 返回 0；如果 `str1 > str2` 返回正整数。负整数和正整数的具体值未指定。这是一个示例：\n\n![一条语句。](img/9781284166033_APP_P1254.jpg)\n\
  \n描述\n\n### H.4 字符串类还是 C 字符串\n\n在处理字符串数据时，你应该使用像 `string` 这样的类还是使用 C 字符串？从清晰、通用和易用的角度来看，没有悬念。使用\
  \ `string` 类。标准库 `string` 类提供了无界长度、聚合赋值、聚合比较、使用 `+` 操作符拼接等功能。\n\n然而，熟悉 C 字符串仍然很有用。在目前使用的数千用\
  \ C 和 C++ 编写的软件中，大多数（尽管比例正在减少）使用 C 字符串表示字符串数据。在你的下一个工作中，如果你被要求修改或升级此类软件，理解 C 字符串至关重要。\n\
  \n## 附录 I C++ char 常量\n\n在 `C++` 中，`char` 常数有两种形式。第一种形式是用单引号括起来的单个打印字符：\n\n![几个字符常量。](img/9781284166033_APP_P1255.jpg)\n\
  \n描述\n\n注意我们说的是可打印字符。字符集包括可打印字符和控制字符（不可打印字符）。控制字符不是用来打印的。在计算早期，包括 C 语言首次开发的时期，计算机的主要接口通常是一个非常简单的打印机或显示器。控制字符被用于引导屏幕、打印机和其他硬件设备的操作。随着现代图形用户界面的出现，控制机制变得复杂（如本文的\
  \ GUI 章节所示）。然而，C++（和 C）仍然保留了更简单的接口，形式为对控制窗口或终端程序进行输入输出，该程序模拟了旧硬件。\n\n\n\n\n\n如果你查看附录\
  \ E 中的 ASCII 字符列表，你会发现可打印字符是整数值为 32–126 的字符。其余字符（值为 0–31 和 127 的字符）是非打印的控制字符。\n\n\
  为了适应控制字符，C++ 提供了 `char` 常量的第二形式：转义序列。转义序列是以反斜杠（`\\`）开头的的一个或多个字符；例如，转义序列 `\\n` 表示换行符。以下是\
  \ C++ 中两种形式 `char` 常量的完整描述：\n\n1. 用单引号括围的单个可打印字符——单引号（`'`）或反斜杠（`\\`）除外。\n\n2. 用单引号括围的以下转义序列之一：\n\
  \n| 序列 | 描述 |\n| :--- | :--- |\n| `\\n` | 换行符 |\n| `\\t` | 水平制表 |\n| `\\v` | 垂直制表\
  \ |\n| `\\b` | 退格 |\n| `\\r` | 回车 |\n| `\\f` | 换页 |\n| `\\a` | 警报（铃声或哔哔声） |\n| `\\\
  \\` | 反斜杠 |\n| `\\'` | 单引号（撇号） |\n| `\\\"` | 双引号（引号） |\n| `\\0` | 空字符（所有位均为 0） |\n\
  | `\\ddd` | 八进制等效值（一个、二或三个八进制数字，指定所需字符的整数值） |\n| `\\xddd` | 十进制等效值（一个或多个十六进制数字，指定所需字符的整数值）\
  \ |\n\n尽管转义序列写为两个或多个字符，但每个转义序列代表字符集中的单个字符。警报字符（`\\a`）与 ASCII 中的 BEL 字符相同。在旧的机械打印机上，它实际上会摇响铃声。如今，它会让终端程序发出哔哔声。你可以这样输出警报字符：\n\
  \n```\n![A statement. c out, 2 left angled brackets, single quote, back slash, a,\
  \ single quote, semicolon.](img/9781284166033_APP_P1255-1.jpg)\n```\n\n在上面的转义序列列表中，标记为八进制等效值和十六进制等效值的项允许你通过指定八进制（8\
  \ 位）或十六进制（16 位）整数来引用机器字符集中的任何字符。使用这些看似奇怪的进制的原因是，它们作为 2 的幂，可以更直接地转换为二进制。\n\n注意，你可以像在字符串中使用任何可打印字符一样，在字符串中使用转义序列。该语句\n\
  \n```\n![A statement.](img/9781284166033_APP_P1256.jpg)\n```\nDescription\n\n会发出蜂鸣声，显示\
  \ Whoops! 并终止输出行。该语句\n\n```\n![A statement.](img/9781284166033_APP_P1256-1.jpg)\n\
  ```\nDescription\n\n输出\n\n```\n![Output of a statement.](img/9781284166033_APP_P1256-2.jpg)\n\
  ```\nDescription\n\n并且不终止输出行。\n\n1. 注意：本附录假设你已经读过第 11 章中的数组。\n2. `C string` 不是 C++\
