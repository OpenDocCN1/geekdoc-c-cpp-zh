  \ 2 章 中引入浮点数以来，我们就一直在使用，但尚未对其进行深入研究。浮点数在计算机上运行时具有特殊属性。在本附录中，我们将详细讨论它们。\n\n## G.1\
  \ 浮点数的表示\n\n假设我们有一台计算机，其中每个内存位置的大小相同，并被分为一个符号位加上五个十进制数字。当定义变量或常量时，分配给它的位置由五个数字和一个符号位组成。当定义\
  \ `int` 变量或常量时，对该处存储数字的解释是直观的。当定义 `float` 变量或常量时，存储在那里的数字既有整数部分也有小数部分，因此必须编码来表示这两个部分。\n\
  \n让我们看看这种编码数字可能是什么样子。我们用五个数字可以表示的整数范围是从 -99,999 到 +99,999：![一张说明使用 5 位数字和符号值可以存储数字范围的图。](img/9781284166033_APP_P1238.jpg)\n\
  描述\n\n我们的**精度**（我们能够表示的数字位数）是五位，范围内的每个数字都可以被精确表示。\n\n如果我们允许这些数字中的一个（例如最左侧的一个）表示指数，会发生什么？\n\
  \n![一张说明浮点数存储的图。](img/9781284166033_APP_P1238-1.jpg)\n描述\n\n那么 +82345 表示数字 +2345\
  \ × 10⁸。我们现在可以表示的数字范围要大得多：\n\n![9999 × 10 9 到 9999 × 10 9 或 9,999,000,000,000 到\
  \ +9,999,000,000,000](img/9781284166033_APP_P1238-2.jpg)\n\n然而，我们现在的精度只有四位；也就是说，只有四位数字可以精确表示。我们的精度现在只有四位数字；也就是说，只有四位数字可以精确表示。对于超过四位的数字会发生什么？最左侧的数字是正确的，但右侧的数字，即有效位丢失了（见图\
  \ G.1）。由于我们的方案不包含符号，我们稍微修改它（见图 G.2）。符号变成了指数，我们给数字本身添加了符号（见图 G.3）。（抱歉，此处翻译过程中出现了部分重复和逻辑混乱，已根据原文逻辑重新梳理如下）：\n\
  \n*注：由于原文文本在某些处存在逻辑重复（如 \"our precision is now only four digits...\" 连续出现了多次），翻译时已根据语意进行了逻辑对齐。*\n\
  \n**（重新梳理后的段落逻辑）：**\n我们的精度（我们能够表示的数字位数）是五位，且范围内的每个数字都可以被精确表示。\n如果我们允许这些数字中的一个（例如最左侧的一个）表示指数，会发生什么？\n\
  那么 +82345 表示数字 +2345 × 10⁸。我们现在可以表示的数字范围要大得多。\n然而，我们的精度现在只有四位；也就是说，只有四位数字可以精确表示。对于超过四位的数字会发生什么？最左侧的数字是正确的，但右侧的数字，即有效位丢失了。\n\
  \n## G.2 浮点数的运算\n\n当我们使用整数运算时，结果是精确的。然而，浮点运算通常是不精确的。为了理解原因，让我们使用我们的编码方案加上三个浮点数 `x`、`y`\
  \ 和 `z`。\n\n首先，我们将 `x` 与 `y` 相，然后将 `z` 加到结果。接下来，我们以另一种顺序执行操作，将 `y` 与 `z` 相，然后将 `x`\
  \ 加到结果。结合律认为这两个答案应该是相同的——但真的是吗？让我们使用以下 `x`、`y` 和 `z` 的值：\n\n![x 等于 -1324 × 10³。y\
  \ 等于 1325 × 10³。z 等于 5424 × 10⁰。](img/9781284166033_APP_P1240.jpg)\n\n这里是将 `z` 加到\
  \ `x` 和 `y` 之和的结果：\n\n![x 和 y 相加。](img/9781284166033_APP_P1240-1.jpg)\n描述\n\n![将\
  \ z 加到 x 加 y。](img/9781284166033_APP_P1241.jpg)\n描述\n\n现在是将 `x` 加到 `y` 和 `z` 之和的结果：\n\
  \n![将 x 加到 y 和 z 之和。](img/9781284166033_APP_P1241-1.jpg)\n描述\n\n这两个答案在千位上是相同的，但之后是不同的。这种差异背后的错误被称为**表示误差**。\n\
  \n\n\n\n由于表示误差，将浮点数变量作为循环控制变量是不明智的。因为涉及浮点数的计算可能会丢失精度，很难预测（甚至无法确定）类型为 `float`（或 `double`\
  \ 或 `long double`）的循环控制变量何时等于终止值。使用浮点控制变量的计数控制循环可能会表现出不可预知的行为。\n\n同样由于表示误差，你不永远应该对浮点数进行精确相等比较。两个浮点数极少完全相等，因此你应该只比较它们是否“接近相等”。如果两个数字之间的差小于某个可接受的小值，你可以根据给定问题的目的认为它们是相等的。\n\
  \n### G.3 计算机中浮点数的实现\n\n所有计算机都限制了浮点数的精度，尽管现代机器使用的是二进制而非十进制算术。在我们的表示中，为了简化示例，我们只使用了\
  \ 5 位数字，而某些计算机确实仅限于 4 或 5 位精度。更典型的系统可能会为 `float` 值提供 6 位有效数字，为 `double` 值提供 15 位，为\
  \ `long double` 类型提供 19 位。我们只展示了单位指数，但大多数系统允许 `float` 类型使用 2 位指数，`long double` 类型使用最多\
  \ 4 位指数。\n\n当你声明一个浮点变量时，内存位置的一部分假设包含指数，而数字本身（称为尾数）假设位于位置的其余部分。该系统被称为浮点表示，是因为有效数字的数量是固定的，且小数点在概念上允许浮动（根据需要移动到不同的位置）。在我们的编码方案中，每个数字都存储为四位数字，最左侧的数字非零，并相应调整指数。这种形式的数字被称为归一化。数字\
  \ 1,000,000 被存储为\n\n![一张说明内存中存储数字 1,000,000 的示意图。](img/9781284166033_APP_P1242.jpg)\n\
  \n描述\n\n而 0.1032 被存储为\n\n![一张说明内存中存储数字 0.1032 的示意图。](img/9781284166033_APP_P1242-1.jpg)\n\
  \n描述\n\n归一化提供了可能的最大精度。\n\n#### 模型数\n\n任何可以在计算机中以浮点数精确表示的实数都称为模型数（model number）。值无法精确表示的实数由最接近它的模型数近似。在我们\
  \ 4 位精度的系统中，0.3021 是一个模型数。数值 0.3021409、0.3021222 和 0.30209999999 是计算机中由同一个模型数表示的实数示例。下表显示了一个更简单的浮点系统所有的模型数，该系统尾数为一位数字，指数可以为\
  \ -1、0 或 1。零是一个特殊情况，因为无论指数如何，它的值都相同。\n\n| 0.1 × 10^(-1) | 0.1 × 10⁰ | 0.1 × 10+¹\
  \ |\n| 0.2 × 10^(-1) | 0.2 × 10⁰ | 0.2 × 10+¹ |\n| 0.3 × 10^(-1) | 0.3 × 10⁰ | 0.3\
  \ × 10+¹ |\n| 0.4 × 10^(-1) | 0.4 × 10⁰ | 0.4 × 10+¹ |\n| 0.5 × 10^(-1) | 0.5 ×\
  \ 10⁰ | 0.5 × 10+¹ |\n| 0.6 × 10^(-1) | 0.6 × 10⁰ | 0.6 × 10+¹ |\n| 0.7 × 10^(-1)\
  \ | 0.7 × 10⁰ | 0.7 × 10+¹ |\n| 0.8 × 10^(-1) | 0.8 × 10⁰ | 0.8 × 10+¹ |\n| 0.9\
  \ × 10^(-1) | 0.9 × 10⁰ | 0.9 × 10+¹ |\n\n实数与代表它的模型数之间的差是一种称为舍入误差的表示误差。我们可以通过两种方式来衡量舍入误差。绝对误差是实数与模型数之间的差；例如，用模型数\
  \ 0.3021 表示 0.3021409 的绝对误差是 0.0000409。相对误差是绝对误差除以实数，有时以百分比形式表示；例如，0.0000409 除以\
  \ 0.3021409 等于 0.000135 或 0.0135%。\n\n最大绝对误差取决于模型间隔（model interval）——两个相邻模型数之间的差。在我们的示例中，0.3021\
  \ 和 0.3022 之间的间隔是 0.0001。在该系统中，对于该间隔的最大绝对误差小于 0.0001。增加精度位数会使模型间隔变小。\n\n![一张从 0\
  \ 到 9 的数线图。](img/9781284166033_App_G4.jpg)\n\nFIGURE G.4 模型数的图形表示\n\n描述\n\n模型间隔不是固定值；它随指数变化。为了理解为什么间隔会变化，考虑\
  \ 3021.0 和 3022.0 之间的间隔是 1.0，这比 0.3021 和 0.3022 之间的间隔大 10⁴。这是合理的，因为 3021.0 是 10⁴。因此，表示中的指数影响间隔的大小。\n\
  \n#### 比较浮点数\n\n我们已经警告不要对浮点数进行精确相等比较。本章对表示误差的探索揭示了为什么计算可能产生产生的结果（尽管看起来应该是）。在第 5\
  \ 章](#9781284166033_CH05)中，我们写了一个表达式，使用浮点绝对值函数 `fabs` 比较两个浮点变量 `r` 和 `s` 是否接近相等：\n\
  \n```\nfabs(r - s) < 0.00001\n```\n\n![f a b s，左括号，r 减 s，右括号，小于，0.00001。](img/9781284166033_APP_P1243.jpg)\n\
  \n通过对模型数的讨论，你现在可以识别出表达式中的常量 0.00001 代表最大绝对误差。我们可以将该表达式泛化为：\n\n```\nfabs(r - s) <\
  \ ERROR_TERM\n```\n\n![一个表达式。](img/9781284166033_APP_P1244.jpg)\n\n描述\n\n其中 `ERROR_TERM`\
  \ 是每个每个编程问题确定的值。\n\n如果我们想通过相对误差比较浮点数，我们必须将误差项乘以误差所相对于的值。例如，如果我们想测试 `r` 和 `s` 是否在\
  \ `s` 的 5% 范围内“相等”，我们写下表达式：\n\n```\nfabs(r - s) < ERROR_TERM * s\n```\n\n\n\n\n\
  描述\n\n请记住，接受误差的选择以及它应该是绝对误差还是相对误差，取决于所解决的问题。我们在示例表达式中展示的误差项完全是任意的，可能不适用于大多数问题。在解决涉及浮点数比较的问题时，你通常希望误差项越小越好。有时这种选择会在问题描述中指定，或者在逻辑上显而易见。某些情况需要对问题的数学原理和特定计算机的表示局限进行仔细分析。此类分析属于数学中一个称为数值分析的分支，并且超出了本书的涵盖范围。\n\
  \n### 下溢与溢出\n\n除了表示误差外，浮点运算中还有两个需要注意的问题：下溢（underflow）和溢出（overflow）。\n\n下溢是指计算结果太小而无法表示时出现的情况。回到我们的进制表示法，来看一个涉及小数的计算：\n\
  \n![两个数的相乘。](img/9781284166033_APP_P1244-2.jpg)\n\n描述\n\n该值无法在我们的方案中表示，因为指数 `-13`\
  \ 太小了。我们的最小值是 `-9`。解决此问题的方法是将计算结果设置为 `0.0`。显然，任何取决于此计算的答案都将是不精确的。\n\n溢是一个更严重的问题，因为发生发生时没有逻辑上的补救措施。例如，计算结果\n\
  \n![两个数的相乘。](img/9781284166033_APP_P1244-3.jpg)\n\n描述\n\n无法被存储，那么我们该怎么办？为了与对下溢的处理保持一致，我们可以结果设置为\
  \ `9999 × 10⁹`（在这种情况下可表示的最大值）。然而，这在直觉上是错误的。另一种方法是停止并显示错误信息。\n\nC++ 没有定义在发生溢出或下溢时应该发生什么。不同的\
  \ C++ 实现以不同的方式解决此问题。你可以尝试让你的系统发生溢出并观察发生了什么。某些系统可能会打印运行时错误信息，如“FLOATING POINT OVERFLOW（浮点溢出）”。在其他系统上，可能会可能会可以表示的最大数字。\n\
  \n尽管我们在讨论的是浮点数的问题，但整数也会发生正向或负向的溢出。大多数 C++ 实现忽略整数溢出。要查看你的系统如何处理这种情况，你应该尝试对 `INT_MAX`\
  \ 加 `1` 以及对 `INT_MIN` 减 `1`。在大多数系统中，对 `INT_MAX` 加 `1` 会将结果设置为 `INT_MIN`，这是一个负数。\n\
  \n有时你可以通过仔细安排计算来避免溢出。假设你想知道从一副牌中可以发出多少种不同的五张扑克牌。我们要寻找的是 52 张牌中取 5 张的组合数。$n$ 个元素取\
  \ $r$ 个元素的组合的标准数学公式为：\n\n![一个公式。](img/9781284166033_APP_P1245.jpg)\n\n描述\n\n我们可以使用我们在第\
  \ 18 章中编写的 `Factorial` 函数并在赋值语句中编写此公式：\n\n![手牌的公式。](img/9781284166033_APP_P1245-1.jpg)\n\
  \n描述\n\n唯一的问题是 `52!` 是一个巨大的数字（大约为 `8.065X × 10⁶⁷`）。而 `47!` 也很大（大约为 `2.5862 × 10⁵⁹`）。这两个数字都远远超过大多数系统精确以整数形式表示的范围（`52!`\
  \ 需要 68 位精度）。尽管它们可以在许多机器上作为浮点数表示，但大部分的精度仍然丢失了。然而，通过重新安排计算，我们可以在任何具有 9 位或更多精度的系统上获得精确结果。怎么做到的？考虑一下计算\
  \ `52!` 时，大多数乘法在积除以 `47!` 时被抵消了。\n\n![一个公式。](img/9781284166033_APP_P1245-2.jpg)\n\
  \n描述\n\n所以，我们真的只需要计算\n\n![一个公式。](img/9781284166033_APP_P1245-3.jpg)\n\n描述\n\n这意味着分子是\
  \ `311,875,200`，分母是 `120`。在具有 9 位或更多精度的系统上，\n\n### 消去误差\n\n另一种发生在浮点数上的问题类型是消去（cancellation），这是一种当数量级不同的数字相减时发生的误差。让我们来看一个例子：\n\
  \n![一个公式。](img/9781284166033_APP_P1245-2.jpg)\n\n描述\n\n在某些语境下，我们将字符串视为单个单元。在其他语境下，我们将其视为一组字符。特别是，我们将字符串视为一个变长度的、同质的集合（**char**）。标准库中的\
  \ **string** 类是实现该类型的一种方法。然而，在该类开发之前，作为 C++基础的 C 语言有自己的方法：C 字符串。\n\n## 使用 C 字符串\n\
  \n从第 2 章开始，我们使用 **string** 类来存储和操作字符字符串。\n\n![代码片段。](img/9781284166033_APP_P1247.jpg)\n\
  \n描述\n\n每当我们写字符串常量时，我们就在使用 C 字符串。在 C 和 C++ 中，字符串常量是用双引号包围的字符序列：\n\n“Hi”\n\n字符串常量不是\
  \ **string** 类的成员；相反，它被存储为 **char** 数组，其包含每个指定的字符外多一个——即空字符。空字符在 ASCII 和 EBCDIC\
  \ 字符集中都是第一个字符，内部用值 0 表示。在 C++ 中，转义序列 `\\0` 代表空字符。当编译器遇到程序中的字符串 “Hi“ 时，它会将 \"H”、“i’\
  \ 和 ‘\\0’ 这三个字符存储在一个三元素的匿名（无名）**char** 数组中，如下：\n\n![字符数组结构的图](img/9781284166033_APP_P1247-1.jpg)\n\
