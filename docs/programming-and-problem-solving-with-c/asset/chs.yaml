  \ 读取当前输入行的剩余部分，包括其中所有的空格。注意，使用 `getline` 时，换行符会被消耗（但不会存入字符串变量）。给定代码段\n\n![一个示例代码段。](img/9781284166033_CH04_PRE18.jpg)\n\
