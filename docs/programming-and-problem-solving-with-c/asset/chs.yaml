  \nC++ 标准最近修订了一个新关键字，称为 `nullptr`，它将最终取代 `NULL`。由于 `nullptr` 是一个关键字，因此不需要包含头文件即可使用。\n\
  \n## 10.8 引用类型\n\n根据图 10.7 所示，仅剩余一种内置类型：`引用类型`。就像指针变量一样，引用变量包含其他变量的地址。该语句\n\n```\n\
  ![一条语句。Int，取地址符，int r e f，分号。](img/9781284166033_CH10_588aa.jpg)\n```\n\n声明 `intRef`\
  \ 是一个包含 `int` 变量地址的变量。以下是声明引用变量的语法模板：\n\n![声明引用变量的语法模板。](img/9781284166033_CH10_588c.jpg)\n\
  \n描述\n\n虽然引用变量和指针变量都包含数据对象的地址，但它们之间有两个根本区别。首先，解引用运算符和取地址运算符（`*` 和 `&`）不用于解引用变量。在声明引用变量后，编译器会无形中对该引用变量的每一次出现解引用。如果你对引用变量使用\
  \ `*` 或 `&`，它将应用于该变量所引用的对象。\n\n![一个具有 2 列的表格。](img/9781284166033_CH10_589.jpg)\n\
  \n描述\n\n有些程序员喜欢将引用变量视为另一个变量的别名。在前面的代码中，我们可以将 `intRef` 视为 `gamma` 的别名。在声明中对 `intRef`\
  \ 初始化后，我们对 `intRef` 执行的所有操作实际上都发生在 `gamma` 上。\n\n引用变量和指针变量之间的第二个区别是，引用变量的值在初始化后不能重新赋值；这意味着我们无法让\
  \ `intRef` 指向另一个变量。在这种情况下，它将始终指向 `gamma`。任何更改 `intRef` 的尝试都只是给 `gamma` 分配新值。还应该注意，引用变量不能初始化为\
  \ 0 或 `NULL`；引用必须指向一个实际存在的东西。相比之下，指针可以设置为 `NULL` 以表示它指向空。\n\n到目前为止，你可能已经注意到和符号（`&`）在\
  \ C++ 语言中有多种含义。为了避免错误，识别这些不同的含义至关重要。下表总结了 `&` 的不同用法。请注意，前缀运算符位于操作数之前，中缀运算符位于操作数之间，而后缀运算符位于操作数之后。\n\
  \n| 位置 | 用法 | 含义 |\n| :--- | :--- | :--- |\n| 前缀 | `&`Variable | 取地址操作 |\n| 中缀 |\
  \ 表达式 `&` 表达式 | 位与操作（参见附录 B） |\n| 中缀 | 表达式 `&&` 表达式 | 逻辑与操作 |\n| 后缀 | DataType`&`\
  \ | 数据类型（具体来说是引用类型）*异常：*为了声明两个引用类型的变量，`&` 必须附加到每个变量名上：`int & var1, &var2;` |\n\n\
  ### 图形用户界面 (GUI)\n\n为了引入 GUI，我们需要对分析程序进行的修改很小。原始程序要求用户输入一个文件。同样，它将该输入文件的分析作为文本输出到屏幕上。因此，重构此程序以使用图形界面需要我们替换控制输入输出。幸运的是，我们已经看到了允许我们这些更改的\
  \ GUI 控件。特别是，我们可以使用 `FileDialog` 选择文件，并使用 `OutputDialog` 显示分析。\n\n正如我们在之前章节的 GUI\
  \ 程序中所做的那样，我们首先包含必要的头文件：\n\n```\n![2 条包含语句。](img/9781284166033_CH10_598.jpg)\n```\n\
  \n描述\n\n`dialog.h` 头文件包含了我们所有 GUI 控件的定义，而 `sstream` 允许我们创建 `ostringstream` 对象。如果你还记得之前的章节，我们使用\
  \ `ostringstream` 对象通过与标准 `cout` 输出流对象相同的接口记录 GUI 组件的输出。\n\n为了捕获 GUI 的输出，我们需要更改原始程序中任何产生输出的函数头，使其接收一个\
  \ `ostringstream` 引用作为参数。这包括 `OpenFile` 和 `PrintTable` 的原型声明和函数定义。除了将 `cout` 替换为字符串输出流外，我们还更改\
  \ `OpenFile` 使用 `FileDialog` 代替 `cin`。以下是这些更改的总结：\n\n```\n![部分程序代码。](img/9781284166033_CH10_589.jpg)\n\
  ```\n\n\n\n\n这些关于处理错误数据的建议假设程序能够识别错误数据值。错误检测有两种方法：被动检测和主动检测。**被动错误检测**将错误检测交给系统。这看起来似乎更容易，但当发生错误时，程序员放弃了对处理过程的控制。被动错误检测的一个示例是系统的除零错误。\n\
  \n**主动错误检测**意味着程序检查可能的错误，并在发生错误时确定适当的操作。主动错误检测的一个示例是读取一个值，并在使用 `If` 语句将其除以另一个数字之前检查该值是否为\
  \ 0。\n\n### 使用指针调试\n\n使用指针的程序比不使用指针的程序难以编写和调试。当你想获取变量的内容时，间接寻址似乎永远没有直接寻址那样“正常”。\n\
  \n与使用指针变量通常常见的两种错误如下：\n\n1. 将指针变量与它所指向的变量混淆\n2. 尝试解引用 `NULL` 指针或未初始化的指针\n\n让我们逐一查看这些潜在问题。\n\
  \n如果 `ptr` 是一个指针变量，必须注意不要混淆表达式 `ptr` 和 `*ptr`。\n\n表达式\n\n![一行代码列出了包含内存地址的指针变量。第\
  \ 1 行，p t r。](img/9781284166033_CH10_604.jpg)\n\n访问变量 `ptr`（包含一个内存地址）。表达式 `*ptr`\n\
  \n![一行代码列出了指针访问的变量。第 1 行，星号 p t r。](img/9781284166033_CH10_604a.jpg)\n\n访问 `ptr`\
  \ 所指向的变量。\n\n| `ptr1 = ptr2` | 将 `ptr2` 的内容拷贝到 `ptr1` 中。 |\n| :--- | :--- |\n| `*ptr1\
  \ = *ptr2` | 将 `ptr2` 指向变量的内容拷贝到 `ptr1` 指向变量中。 |\n| `*ptr1 = ptr2` | 非法——一个是指针，另一个是被指向的变量。\
  \ |\n| `ptr1 = *ptr2` | 非法——一个是指针，另一个是被指向的变量。 |\n\n第二个常见错误是解引用 `NULL` 或未初始化的指针。在某些系统上，尝试解引用\
  \ `NULL` 指针会产生类似于 `NULL POINTER DEREFERENCE` 的运行时错误消息，随后程序终止。当此事件发生时，你至少对哪里出了问题有所了解。然而，如果你的程序解引用未初始化的指针，情况会更糟。在代码段中\n\
  \n![两行列出了部分代码。](img/9781284166033_CH10_604b.jpg)\n\n描述\n\n![代码段的一行。](img/9781284166033_CH10_604c.jpg)\n\
  \n描述\n\n在我们解引用之前，变量 `intPtr` 没有分配任何值。最初，它包含某些无意义的值，例如 315988，但计算机并不知道它是无意义的。机器只是访问内存位置\
  \ 315988 并将其找到任何内容拷贝到 `num` 中。没有方法可以测试指针变量是否包含未定义的值。我们能提供的避免此类问题的建议是仔细检查代码，确保每个指针变量在被解引用之前都分配了值。\n\
  \n### 测试与调试提示\n\n1. 避免在表达式中使用不必要的副作用。测试\n\n![一个问题列出了部分代码。](img/9781284166033_CH10_605.jpg)\n\
