  \ GUI 程序](img/9781284166033_CH06_352.jpg)\n\n描述\n\n### 测试与调试\n\n### 循环测试策略\n\n即使循环已经经过了适当的设计和验证，对其进行严格测试仍然至关重要：错误总会在实施过程中出现。由于循环允许我们在一次运行中输入许多数据集，而且由于每次迭代都可能受到之前迭代的影响，因此循环循环程序的测试数据通常更为详尽。要彻底测试循环，我们必须检查单次迭代和多次迭代的执行是否正确。\n\
  \n记住，一个循环有七部分（对应我们清单中的七个问题）。测试策略必须测试每个部分。虽然并不是每个循环都单独实现这全部七部分，但清单提醒我们，由于某些循环操作具有多个用途，每种用途都应该被测试。例如，计数控制循环中的递增语句可能同时更新处理过程和结束条件，因此，验证它相对于循环的其他部分是否都正确地执行了这两项操作是非常重要的。\n\
  \n为了测试循环，我们尝试设计可能导致变量超出范围，或使文件处于不当状态（这种不当状态违反了循环后置条件，即循环退出后必须为真的的断言）的数据集。\n\n###\
  \ 涉及循环的测试计划\n\n在第 5 章中，我们引入了正式测试计划并讨论了分支测试。这些指南适用于带有循环的程序，但在这里我们提供了一些针对循环的额外指南。\n\
  \n遗憾的是，当循环嵌入较大的程序中时，仅通过测试数据和输出很难控制和观察循环执行的条件。在某些情况下，我们必须使用间接测试。例如，如果循环从文件中读取浮点值并输出它们的平均值，而不回显打印它们，你无法直接判断循环是否处理了所有数据——如果所有数据值都相同，只要处理了其中任何一个，平均值看起来就是正确的。你必须构造输入文件，使得平均值是一个只有通过处理所有数据才能得到的唯一值。\n\
  \n\n\n\n当循环受计数控制时，你应该包含一个测试用例，指定所有迭代的输出。在测试计划中增加额外的一列来列出迭代次数，可能会有所帮助。如果循环读取数据并输出结果，那么每个输入值都应该产生不同的输出，以便更容易发现错误。例如，在一个本\
  \ supposed（supposed）读取并显示 100 个数据值的循环中，当数值为 1, 2, 3, . . . , 100 时，比所有数值都相同时更容易判断循环是否执行了正确的迭代次数。\n\
  \n如果程序通过输入循环的迭代次数，你需要测试以下情况：输入了无效计数（例如负数，此时应输出错误信息并跳过循环）、输入计数为 0（循环应跳过）、输入计数为 1（循环应执行一次）以及输入了某个典型的迭代次数（循环应执行指定的次数）。\n\
  \n### 事件驱动循环\n\n在事件驱动循环中，你应该测试在循环开始之前、第一次迭代中以及典型迭代次数内发生事件的情况。例如，如果事件是发生 EOF（文件结束），则尝试测试由空文件、包含一个数据集的文件以及另一个包含多个数据集的文件组成的测试数据。如果你的测试涉及从测试文件中读取，你应该将文件的副本附加到测试计划中，并以某种方式标识它们，以便计划可以引用它们。这对于识别测试计划中“输入”和“预期输出”列中每次迭代的开始位置也有帮助。\n\
  \n当事件是输入一个哨值时，你需要以下测试用例：哨值是唯一的数据集、哨值跟在一个数据集之后、哨值跟在一个典型数量数据集之后。对于文件输入，你还应该尝试文件漏掉哨值的情况。鉴于哨值控制的循环涉及“初次读取”（priming\
  \ read），验证第一个和最后一个数据集是否被正确处理尤为重要。\n\n### 测试与调试提示\n\n1. 仔细规划你的测试数据，以测试程序的所有部分。\n\
  2. 警惕无限循环，即 `While` 语句中的表达式永远变为 `false`。症状是：程序没有停止。\n\n如果你创建了无限循环，请检查你的逻辑和循环的语法。确保没有在\
  \ `While` 条件的右括号后紧跟一个分号：\n\n```\n![Wrong usage of the while loop.](img/9781284166033_CH06_354.jpg)\n\
  Description\n```\n\n这个分号在大多数情况下会导致无限循环；对于编译器来说，循环体是一个空语句。在计数控制的循环中，确保循环控制变量在循环内部递增。在标志控制的循环中，确保标志最终会发生变化。\n\
  \n一如既往，注意 `While` 条件以及 `If` 条件中的 `=` 与 `==` 的问题。这一行：\n\n```\n![Wrong usage of the\
  \ while loop.](img/9781284166033_CH06_354a.jpg)\nDescription\n```\n\n会产生无限循环。赋值表达式（而非关系表达式）的值始终为\
  \ 5，它被解释为 `true`。\n\n1. 仔细检查循环终止条件，并确保循环中的某些内容导致了该条件的满足。密切关注会导致迭代多一次或少一次的值（即“差一错误”综合征）。\n\
  2. 在由检测换行符控制的循环中，记得使用 `get` 函数而不是 `>>` 运算符。\n3. 执行算法走演，以验证所有适当的前置条件和后置条件是否出现在正确的位置。\n\
  4. 通过代码走演手动跟踪循环的执行。非常仔细地模拟前几次和最后几次，观察循环的真实行为。\n5. 如果你的系统提供了调试器（调试器），请使用它。调试器是一个以“慢动作”运行你程序的程序，允许你一次执行一条指令，并在变量变化时检查其内容。如果你还没有这样做，请检查你的系统是否有可用调试器。\n\
  6. 如果其他方法都失败了，使用`调试输出语句`——即插入程序中以帮助调试的输出语句。它们输出指示程序执行流的消息，或报告程序中某些位点变量的值。\n\n例如，如果你想知道程序中某一点变量\
  \ `beta` 的值，可以插入这条语句：\n\n```\n![An output statement.](img/9781284166033_CH06_355.jpg)\n\
  Description\n```\n\n如果这条输出语句出现在循环中，你得到的 `beta` 输出次数将与循环体执行的次数相同。\n\n在你调试完程序后，可以移除调试输出语句，或者直接在它们前面加上\
  \ `//` 以便它们被视为注释。（这种做法被称为“注释掉代码”）。如果你需要再次使用这些语句，可以删除双斜杠。\n\n9. 预防胜于治疗。使用检查清单来正确设计你的循环。\n\
  \n```\n![A photograph of trees.](img/Chapter-opener.jpg)\n```\n\n 第 7 章：附加控制结构\n\
  \n在某些情况下，有多种方法实现 C++ 选择结构。例如，可以使用 `If-Then` 或 `If-Then-Else` 实现选择。`If-Then` 语句可以实现选择，但\
  \ C++ 提供了 `If-Then-Else` 因为双分支很常见。\n\n本章引入五个新语句。一个是简化多分支的 `Switch` 语句。两个新的循环语句 `For`\
  \ 和 `Do-While` 使某些循环变得更容易。最后两个 `Break` 和 `Continue` 与循环结合使用。\n\n## 7.1 Switch 语句\n\
  \n`Switch` 语句允许我们轻松编写多分支，类似于嵌套的 `If` 语句。`switch 表达式`的值决定了执行哪个分支。例如，查看以下内容：\n\n```\n\
  ![An switch statement.](img/9781284166033_CH07_368.jpg)\nDescription\n```\n\n在这个示例中，`letter`\
  \ 是 switch 表达式。语句的意思是：“如果 `letter` 是 'X'，执行 Statement1，跳出 `Switch` 语句并继续执行 Statement5。如果\
  \ `letter` 是 'L' 或 'M'，执行 Statement2 并跳出到 Statement5。如果 `letter` 是 'S'，执行 Statement3\
  \ 并跳出到 Statement5。如果 `letter` 不是上述任何字符，执行 Statement4 并退出（此处应为进入 Statement5）。”`Break`\
  \ 语句会导致立即退出 `Switch` 语句。我们很快就会看到省略 `Break` 语句会发生什么。\n\n`Switch` 语句的语法模板为\n\n```\n\
  ![SwitchStatement](img/9781284166033_CH07_368a.jpg)\n```\n\n`IntegralOrEnumExpression`\
  \ 是整型（`char`、`short`、`int`、`long`、`bool`）或 `enum` 表达式。（我们在第 10 章中讨论 `enum`）。可选的\
  \ `SwitchLabel` 是 `case` 标签或 `default` 标签：\n\n```\n![SwitchLabel](img/9781284166033_CH07_369h.jpg)\n\
  ```\n\n在 `case` 标签中，`ConstantExpression` 是整数或 `enum` 表达式，其操作数必须是字面量或命名常量，以便编译器能在编译时计算分支标签的值。以下是常量整数表达式的示例（其中\
  \ `CLASS_SIZE` 是类型为 `int` 的命名常量）：\n\n```\n![Examples of constant integral expressions.](img/9781284166033_CH07_369.jpg)\n\
  ```\n\n\n\n\n描述\n\n`ConstantExpression` 的数据类型在需要会被强制转换，以匹配 `switch` 表达式的类型。\n\n\
  在我们测试 `letter` 值的开头示例中，`case` 标签具有如下形式：\n\n![case 标签的示例。](img/9781284166033_CH07_369a.jpg)\n\
  \n描述\n\n如该示例所示，一个语句之前可以跟有多个 `case` 标签。每个 `case` 值在给定的 `Switch` 语句中只能出现一次。如果一个值出现多次，则会为语法错误。此外，一个\
  \ `Switch` 语句中只能有一个 `default` 标签。\n\n`Switch` 语句的控制流如下：首先，求值 `switch` 表达式。如果该值与\
  \ `case` 标签中的某个值匹配，控制将跳转到该 `case` 标签后的语句。从那里开始，控制按顺序执行，直到遇到 `Break` 语句或 `Switch`\
  \ 语句的结束。如果 `switch` 表达式的值不匹配任何 `case` 值，则会发生两种情况之一：如果存在 `default` 标签，控制跳转到其后的语句；如果没有\
  \ `default` 标签，则 `Switch` 内部的所有语句都会被跳过，控制跳转到整个 `Switch` 语句之后的语句。\n\n下面的 `Switch`\
  \ 语句根据学生的成绩（`grade` 类型为 `char` 类型）输出相应的注释：\n\n![部分程序代码。](img/9781284166033_CH07_369b.jpg)\n\
  \n描述\n\n![部分程序代码。](img/9781284166033_CH07_370.jpg)\n\n描述\n\n注意，最后的 `Break` 语句是不必要的。程序员通常还是会包含它，因为如果已经存在\
  \ `Break` 语句，在末尾插入另一个 `case` 标签会更方便。\n\n如果 `grade` 不包含 'A'、'B'、'C'、'D' 或 'F'则 `Switch`\
  \ 中的任何语句都不会执行。除非 `Switch` 语句的前置条件说明 `grade` 始终包含这些字母之一，否则它应该包含一个 `default` 分支：\n\
  \n![示例 switch 语句。](img/9781284166033_CH07_370a.jpg)\n\n描述\n\n在每个 case 之后带有 `Break`\
  \ 的 `Switch` 语句的行为与 `If-Then-Else-If` 结构完全相同。我们的 `Switch` 语句等同于以下代码：\n\n![部分程序代码。](img/9781284166033_CH07_370b.jpg)\n\
  \n描述\n\n这两种方法是否有优劣？对于这个特定的示例，`Switch` 更容易理解。但如果多路分支包含值的范围，那么将它们全部列为 `case` 标签将非常繁琐。在编写多路分支之前，考虑这两种方案的形式如何，并选择最易于理解的那一个。请记住，C++\
  \ 提供 `Switch` 是为了方便，但它并不总是每个多路分支的最佳选择。\n\n最后，我们说过将看看如果省略 `Break` 语句会发生什么。这里是我们没有\
  \ `Break` 的字母成绩示例：\n\n![示例 switch 语句。](img/9781284166033_CH07_371.jpg)\n\n描述\n\n\
  如果 `grade` 恰好是 ‘H’，控制跳转到 `default` 标签处的语句，输出为：\n\n![示例输出。第 1 行：大写的 h 不是有效的字母成绩。](img/9781284166033_CH07_371a.jpg)\n\
  \n遗憾的是，这是唯一正常工作的分支。如果 `grade` 是 'A'，输出是：\n\n![示例输出。第 1 行：优秀 良好 不及 A 不是有效的字母成绩，句号。](img/9781284166033_CH07_371b.jpg)\n\
  \n记住——在分支跳转到特定的 `case` 标签后，控制按顺序执行，直到遇到 `Break` 或 `Switch` 的结束。在 `case` 中遗忘 `Break`\
  \ 是 C++ 程序中常见的错误来源。\n\n在第 5 章中，我们看到过一个根据温度和是否下雨显示不同消息的程序。这里是使用 `Switch` 而非 `If 语句`\
  \ 的相同程序。\n\n![显示与不同温度对应的消息的程序代码的前半部分。](img/9781284166033_CH07_371.jpg)\n\n描述\n\n\
  ![显示与不同温度对应的消息的程序代码的前半部分。](img/9781284166033_CH07_371.jpg)\n\n描述\n\n![显示与不同温度对应的消息的程序代码的后半部分。](img/9781284166033_CH07_372.jpg)\n\
  \n描述\n\n![显示与不同温度对应的消息的程序代码的后半部分。](img/9781284166033_CH07_373.jpg)\n\n描述\n\n![显示与不同温度对应的消息的程序代码的后半部分。](img/9781284166033_CH07_374.jpg)\n\
  \n描述\n\n## 7.2 Do-While 语句\n\nDo-While 语句是一种在末尾进行测试的循环结构。这样做保证了循环体至少执行一次。这里是 Do-While\
  \ 的语法：\n\n```\ndo {\n    Statement\n} while (Expression);\n```\n\n与通常一样，`Statement`\
  \ 是单个语句或一个块。`Do-While` 语句以分号结束。\n\n![do while 的语法。](img/9781284166033_CH07_375.jpg)\n\
  \n描述\n\n意味着“只要 `Expression` 为 `true`，就执行 `do` 和 `while` 之间的语句。”\n\n让我们比较执行相同任务的\
  \ While 循环和 Do-While 循环：假设文件中至少。\n\n![while solution 和 do while 代码。](img/9781284166033_CH07_375b.jpg)\n\
  \n描述\n\nWhile Solution 需要一个引导读取（priming read），以便 `input` 在进入循环前有值。Do-While 不需要，因为循环内的语句在评估条件之前执行。\n\
  \n让我们看另一个示例。假设程序需要交互式读取一个人的年龄。程序要求年龄为正数。以下循环确保输入值为正数。\n\n![列出 while solution 第一部分的代码。](img/9781284166033_CH07_375c.jpg)\n\
  \n描述\n\n**Do-While Solution**\n\n![while solution 之后是 do while solution。](img/9781284166033_CH07_376a.jpg)\n\
  \n描述\n\n注意，在 Do-While Solution 中，提示和输入步骤只出现一次——但它必须测试两次输入值。\n\n我们也可以使用 Do-While\
  \ 来实现计数控制循环，如果我们知道循环体至少应该执行一次。以下是求 1 到 **n** 整数和的两个版本。\n\n如果 **n** 是正数，两个版本是价的。但如果\
  \ **n** 是 **0** 或负数，循环产生不同的结果。在 While 版本中，**sum** 的最终值为 **0**，因为跳过了循环体。在 Do-While\
  \ 版本中，**sum** 的最终值为 **1**，因为循环体在退出前执行了一次。\n\n\n\n\n由于 `While` 语句在执行循环体之前会测试条件，因此被称为预测试循环。`Do-While`\
  \ 语句的操作则相反，因此被称为后测试循环。`图 7.1` 比较了 `While` 循环和 `Do-While` 循环的控制流。\n\n![while 和 do\
  \ while 语句的流程图](img/9781284166033_CH07_FIGF01.jpg)\n\n图 7.1 While 和 Do-While 循环\n\
  \n描述\n\n以下是一个将活动消息代码封装在 `Do-While` 语句中的程序：\n\n![根据给定温度输出适当活动的程序代码](img/9781284166033_CH07_377a.jpg)\n\
  \n描述\n\n![根据给定温度输出适当活动的程序代码后续](img/9781284166033_CH07_378.jpg)\n\n描述\n\n以下是该程序的示例运行：\n\
  \n![显示给定温度下适当活动的程序输出](img/9781284166033_CH07_378a.jpg)\n\n描述\n\n你可能会奇怪，为什么我们想要重复这个特定的过程，因为天气并不经常变化。上述内容是一个被称为“测试平台”（或“驱动程序”）的示例——这是一个非常简单的程序，它用于封装一个模块，以便我们可以直接输入一系列测试数据值。在许多情况下，一个模块的实现可能会被放置在复杂程序的深处，在那里很难进行彻底测试。通过单独将其封装在测试驱动程序中，我们获得了对其执行环境的完全控制，并可以直接提供模块的输入并检查其输出以确保其正确性。一旦测试完成，代码就可以移植到实际程序中的最终位置，在那里我们可以确信它运行正常。\n\
  \n## 7.3 For 语句\n\n`For` 语句的设计旨在简化计数控制循环的编写。以下语句输出从 1 到 `n` 的整数：\n\n![一个 for 循环示例](img/9781284166033_CH07_379a.jpg)\n\
  \n描述\n\n该 `For` 语句的意思是：“将循环变量 `count` 初始化为 1。当 `count` 小于或等于 `n` 时，执行输出语句并将 `count`\
  \ 增 1。当 `count` 增加到 `n`+1 后停止循环。”\n\n在 C++ 中，一个 `For` 语句仅仅是 `While` 循环的紧凑表示法。事实上，编译器本质是将\
  \ `For` 语句翻译为等效的 `While` 循环，如下：\n\n![将 for 循环转换为等效的 while 循环](img/9781284166033_CH07_379b.jpg)\n\
  \n描述\n\n`For` 语句的语法模板所示：\n\n![ForStatement for (InitStatement Expression1 ; Expression2\
  \ ) Statement](img/9781284166033_CH07_380.jpg)\n\n为什么语法模板在 `InitStatement` 和 `Expression1`\
  \ 之间没有显示分号（像上一个例子那样）？因为 `InitStatement` 总是以它自己的分号结束。`InitStatement` 可以是以下任一种：空语句（仅一个分号）、声明语句（以分号结尾）或表达式语句（以分号结尾的表达式）。这就是为什么在\
  \ `Expression1` 之前总是会出现一个分号。`Expression1` 是退出条件。`Expression2` 在每次循环迭代结束时求值。\n\n\
  `For` 语句的写法通常是：`InitStatement` 初始化循环控制变量，而 `Expression2` 递或递减该变量。这里是两个执行次数相同（50\
  \ 次）的循环：\n\n![两个 for 循环](img/9781284166033_CH07_380a.jpg)\n\n描述\n\n与 `While` 循环一样，`Do-While`\
  \ 和 `For` 循环可以嵌套。例如，这个嵌套的 `For` 结构\n\n![嵌套的 for 循环](img/9781284166033_CH07_380b.jpg)\n\
  \n描述\n\n显示如下数字三角形：\n\n![显示数字三角形的程序输出](img/9781284166033_CH07_380c.jpg)\n\n描述\n\n\
  \n\n\n这里的总数看起来很奇怪：它们加起来只有 85 个字符。另外的 15 个在哪里？嗯，数字没有计入总数中，所以现在是 94 个。但这仍然留有 6 个无法解释。对数据进行仔细检查发现，读取在第七行的中间就结束了。啊！输入前\
  \ 6 行的行尾字符占据了其他缺失的字符！\n\n现在我们看到代码实际上是正确的——只是我们对结果的预期有误。正如你所看到的，有时测试计划中的预期输出并没有考虑到所有因素。测试并不总是单向的，即我们预先掌握了所有答案并简单地验证代码。在某些情况下，我们在测试计划中发现错误，反而需要修复它。\n\
  \n## 7.4 Break 和 Continue 语句\n\n我们在介绍 `Switch` 时引入的 `Break` 语句也可以用于循环。`Break` 语句会导致立即退出它所处的最内层\
  \ `Switch`、`While`、`Do-While` 或 `For` 结构。注意*最内层*这个词。如果 `break` 位于嵌套在另一个循环中的循环，控制将退出内部循环而不是外部循环。\n\
  \n在循环中使用 `break` 的一种方法是设置一个无限循环，并使用 `If` 测试来退出循环。假设我们想要输入 10 对整数，进行数据验证并计算每对数字之和的平方根。对于数据验证，假设每对数字的第一个数字必须小于\
  \ 100，第二个数字大于 50。此外，在每次输入后，我们还想测试流的状态是否为 `EOF`。这里是一个使用 `Break` 语句完成该任务的循环：\n\n![带有\
  \ break 语句的 while 循环。](img/9781284166033_CH07_386.jpg)\n\n描述\n\n注意，我们本可以使用 `For`\
  \ 循环从 1 计数到 10，并在需要时跳出。然而，这个循环既是计数控制的也是事件控制的，所以我们更倾向于使用 `While`。当某人阅读代码并看到 `For`\
  \ 循环时，他们期望它是纯粹由计数控制的。\n\n上述循环包含三个不同的退出点。许多程序员在编写循环时遵循*单入口、单出口*的方法。根据这种哲学，控制从循环体的顶部进入循环，并仅在循环体结束时退出，因为多个出口会使程序逻辑更难追踪和调试。其他程序员认为，在逻辑清晰的情况下，在循环内部使用\
  \ `break` 是可以的。如果我们不在在这个循环中使用使用 `break`，它将包含嵌套的 `If` 语句，这可能会使我们更难发现实际的计算部分。\n\n\
  我们的建议是谨慎使用 `break`；过度使用会导致代码混乱。一个良好的原则是：仅在万不得已在循环中使用 `break`。具体来说，仅用于避免复杂的布尔复合表达式和嵌套\
  \ `If` 的组合。\n\n另一个改变 C++ 程序控制流的语句是 `Continue` 语句。该语句仅在循环中有效，用于终止当前的循环迭代（而不是整个循环）。它会导致控制立即跳转到循环底部——跳过循环体中的其余语句——为下一次迭代做准备。这是一个读取循环的示例，我们只想处理输入文件中的正数：\n\
  \n![for 循环示例。](img/9781284166033_CH07_387.jpg)\n\n描述\n\n如果 `inputVal` 小于或等于 `0`，控制跳转到循环底部。然后，像任何\
  \ `For` 循环一样，计算机增加 `dataCount` 并在进入下次迭代之前执行循环测试。\n\n`Continue` 语句并不经常使用，但我们为了完整性而介绍了它（并且你可能在其他人的程序中遇到它）。它的主要目的是避免由于在\
  \ `If` 语句中缩进进程而导致循环主过程变得模糊。例如，之前的代码如果不使用 `Continue` 语句，将如下所示：\n\n![for 循环示例。](img/9781284166033_CH07_387a.jpg)\n\
  \n描述\n\n务必注意 `continue` 和 `break` 之间的区别。`continue` 意味着“放弃当前的循环迭代，进入下一次迭代”。`break`\
  \ 意味着“立即退出整个循环”。\n\n## 7.5 选择循环语句的指南\n\n以下是一些可以帮助你决定何时使用这三种循环语句（`While`、`Do-While`\
  \ 和 `For`）的指南：\n\n1. 如果循环是简单的计数控制循环，`For` 语句是自然的选择。将三个循环控制动作——初始化、测试和递增/递减整合到一个位置（`For`\
  \ 语句的头部），可以减少遗漏其中之一的可能性。\n2. 如果循环体体应至少执行一次的事件控制循环，则 `Do-While` 语句是合适的。\n3. 如果循环是事件控制循环，且对第一次执行一无所知，请使用\
  \ `While` 语句。\n4. 如果不确定，使用 `While` 语句。\n5. 带有 `Break` 语句的无限循环有时比 `Do-While` 或 `For`\
  \ 更加清晰。\n\n## 7.6 附加运算符\n\nC++ 还有许多特殊运算符。这里是这些运算符的表格。在检查表格时，不要恐慌——扫一眼即可。\n\n| **运算符**\
  \ | **备注** |\n| :--- | :--- |\n| *复合赋值运算符* | |\n| `+=` | 加并赋值 |\n| `-=` | 减并赋值 |\n\
  | `*=` | 乘并赋值 |\n| `/=` | 除并赋值 |\n| *递增和递减运算符* | |\n| `++` | 前递增：`++someVar` |\n\
  | `++` | 后递增：`someVar++` |\n| `--` | 前递减：`--someVar` |\n| `--` | 后递减：`someVar--`\
  \ |\n| *位运算符* | *仅限整数操作* |\n| `<<` | 左移 |\n| `>>` | 右移 |\n| `&` | 位与，操作数位之间的逻辑与\
  \ |\n| `|` | 位或，操作数位之间的逻辑或 |\n| `^` | 位异或，操作数位之间的逻辑异或 |\n| `~` | 取反（反转所有位），单操作数\
  \ |\n| *更多复合赋值运算符* | *仅限整数操作* |\n| `%=` | 取模并赋值 |\n| `<<=` | 左移并赋值 |\n| `>>=` |\
  \ 右移并赋值 |\n| `&=` | 位与并赋值 |\n| `|=` | 位或并赋值 |\n| `^=` | 位异或并赋值 |\n| *其他运算符* | |\n\
  | `()` | 强制转换 |\n| `sizeof` | 操作数按字节计算的大小，格式：`sizeof` 表达式或 `sizeof(类型)` |\n\n\n\n\
  \n\n| `?:` | 条件运算符形式：`Expr1 ? Expr2 : Expr3` |  |\n\n表中的运算符连同你已经熟悉的运算符，共同构成了 C++\
  \ 运算符的大部分——但并非全部。根据需要，我们将在后续章节中引入更多几个运算符。\n\n### 赋值运算符与赋值表达式\n\nC++ 有多种赋值运算符。等号\
  \ `=` 是基本的赋值运算符。当它与它的两个操作数结合时，它就形成了一个`赋值表达式`（而不是赋值语句）。每个赋值表达式都有一个值和一个副作用——即该值被存储在左侧所指示的对象中。例如，表达式\n\
  \n![一个表达式。 delta 等于 2 乘以 12。](img/9781284166033_CH07_390a.jpg)\n\n值为 `24`，并具有将此值存储到\
  \ `delta` 中的副作用。\n\n在 C++ 中，任何表达式只要以分号结束，就变成了一个`表达式语句`。以下三个都是都是有效的 C++ 语句，尽管前两个在运行时没有产生影响：\n\
  \n![3 条语句。第 1 行：23，分号。第 2 行：2 乘以，左括号，alpha 加 beta，右括号，分号。第 3 行：delta 等于 2 乘以 12，分号。](img/9781284166033_CH07_390b.jpg)\n\
  \n第三个表达式语句是有用的，因为它具有将 `24` 存储到 `delta` 中的副作用。\n\n由于赋值是一个表达式而不是语句，因此你可以在任何允许表达式的地方使用它。这里有一条语句将值\
  \ `20` 存储到 `firstInt`，将值 `30` 存储到 `secondInt`，将值 `35` 存储到 `thirdInt`：\n\n![一条语句。third\
  \ Int 等于左括号，second Int 等于左括号 first Int 等于 20 右括号 加 10 右括号 加 5 分号。](img/9781284166033_CH07_390c.jpg)\n\
  \n有些人使用这种风格的编码，是因为他们认为这很聪明，但大多数人发现它难以阅读且容易出错。\n\n除了 `=` 运算符外， C++ 还有几种复合赋值运算符 `+=`、`*=`\
  \ 以及前一个表中列出的其他。复合赋值运算符是为了让代码更紧凑的方便，但你也可以轻松地不使用它们。\n\n### 递增与递减运算符\n\n递增和递减运算符 `++`\
  \ 和 `--` 只作用于变量，而非常量或表达式。假设变量 `someInt` 包含值 `3`。表达式 `++someInt` 表示前自增。递增 `someInt`\
  \ 的副作用先发生，因此表达式的结果值为 `4`。相比之下，表达式 `someInt++` 表示后自增。表达式的值为 `3`，然后发生递增 `someInt`\
  \ 的副作用。以下代码说明了前自增和后自增之间的区别：\n\n![4 条语句说明了前自增和后自增之间的区别。](img/9781284166033_CH07_391.jpg)\n\
  \n描述\n\n在较大的表达式中使用副作用总是有点危险。很容易产生语义错误，而且代码读起来可能很困惑。看这个例子：\n\n![一个表达式。a 等于左括号（b 等于\
  \ c 加，加，右括号），乘以，减，减，d，斜杠，左括号（e 等于 f 加，加，右括号），分号。](img/9781284166033_CH07_391a.jpg)\n\
  \n有些人把看用最少按键完成多少操作当作游戏。但他们应该记住，严肃的软件工程需要编写其他程序员可以阅读和理解的代码。副作用的使用碍了这一目标的实现。到目前，`++`\
  \ 和 `--` 最常用的用法作为独立的表达式语句递增或递减变量：\n\n![一个表达式。count 加 加。](img/9781284166033_CH07_391b.jpg)\n\
  \n在这里，表达式的值未被使用，但我们得到了递增 `count` 的预期副作用。在这个例子中，使用前自增还是后自增并不重要。选择权交由你。\n\n### 位运算符\n\
  \n运算符表中列出的位运算符 `<<`、`>>`、`&`、`|` 等，用于操作内存单元中的单个位。我们不会探索它们的用法；位级操作的主题通常在计算机组成和汇编语言编程课程中涵盖。然而，我们指出位运算符两点。\n\
  \n首先，内置运算符 `<<` 和 `>>` 分别是左移和右移运算符。它们的目的是获取内存单元中的位并将它们向左或向右移动。当然，我们一直在使用这些运算符，但在不同的语文中——流输入和输出。头文件\
  \ `iostream` 使用了一种称为运算符重载的先进 C++ 技术，赋予了这两个运算符额外的含义。重载运算符是指具有多种含义的运算符，取决于其操作数的数据类型。在查看\
  \ `<<` 运算符时，编译器根据上下文判断需要的是左移操作还是输出操作。具体来说，如果第一个操作数是流，则执行输出操作。\n\n其次，不要混淆 `&&` 和\
  \ `||` 运算符与 `&` 和 `|` 运算符。语句\n\n![错误的。](img/9781284166033_CH07_392.jpg)\n\n描述\n\n\
  语法上是正确的，因为 `&` 是有效的运算符（位与）。在逻辑表达式中小心使用 `&&` 和 `||`。\n\n### 强制转换操作\n\n你已经看到 C++ 非常允许程序员在表达式、赋值操作、参数传递和函数返回值中混合类型。然而，当不同类型的值混合时，会发生隐式类型转换。与其依赖如下语句的隐式类型转换\n\
  \n![一个表达式。int 等于 float Var。](img/9781284166033_CH07_392a.jpg)\n\n我们建议使用显式类型转换来显示类型转换是有意的：\n\
  \n```\nint Var 等于 int，左括号 float Var 右括号。](images/9781284166033_CH07_392b.jpg)\n\
  ```\n\n在 C++ 中，类型转换有三种形式：\n\n![3 条类型转换语句。](img/9781284166033_CH07_392c.jpg)\n\n\
  描述\n\n第一形式被称为函数表示法，因为它看起来像函数调用。它并不是真正的函数调用（没有名为 `int` 的预定义函数），但它具有函数的语法和外观。在第二形式前缀法中，括号包裹数据类型的名称，而不是被转换的表达式。第三形式使用关键字和角括号来显式指定转换操作。前缀法是\
  \ C 语言使用的形式；C++ 标准定义后包含了关键字表示。\n\n函数表示法在使用上受到限制，因为数据类型名称必须是单个标识符。如果类型名称由多个标识符组成，必须使用前缀或关键字表示；例如\n\
  \n![3 条类型转换语句。](img/9781284166033_CH07_392d.jpg)\n\n关键字转换现在是推荐的风格。一方面，更容易注意到关键字。但\
  \ C++ 还有更高级的方面，涉及面向对象编程，`static_cast` 会导致编译器执行额外的检查，有助于发现错误。\n\n\n\n\nC++ 定义了三种其他形式的\
  \ `cast` 关键字，它们具有特殊的用途。我们不再对它们进行进一步解释，但在这里列出它们以便你有所了解：`const_cast`、`dynamic_cast`\
  \ 和 `reinterpret_cast`。\n\n### `sizeof` 运算符\n\n`sizeof` 运算符是一个一元运算符，用于产生操作数的大小（以字节为单位）。操作数可以是变量名，例如：\n\
  \n![一条语句。关键字中的单词和变量名合并。size of，some Int。](img/9781284166033_CH07_393.jpg)\n\n或者，操作数也可以数据类型的名称，并括在括号内：\n\
  \n![一条语句。关键字中的单词和变量名合并。size of，左括号，float，右括号。](img/9781284166033_CH07_393a.jpg)\n\
  \n你可以使用类似下面的代码来查看你机器上各种数据类型的大小：\n\n![使用 size of 运算符的 3 条语句。](img/9781284166033_CH07_393b.jpg)\n\
  \n描述\n\n### `?:` 运算符\n\n我们运算符表中的最后一个运算符是 `?:` 运算符，有时被称为条件运算符。它是一个三元（三个操作数）运算符，语法如下：\n\
  \n![条件表达式的语法。Expression 1，问号，Expression 2，冒号，Expression 3。](img/9781284166033_CH07_393c.jpg)\n\
  \n它的工作原理如下：首先，计算机计算 `Expression1`。如果值为 `true`，则整个表达式的值为 `Expression2`；否则，其值为 `Expression3`。（`Expression2`\
  \ 和 `Expression3` 中只有一个会被求值，但它们都必须求值为相同的数据类型。）`?:` 运算符用法的一个经典示例是将变量 `max` 设置为两个变量\
  \ `a` 和 `b` 中较大的那一个。使用 `if` 语句，我们会这样做：\n\n![一个 if else 语句。](img/9781284166033_CH07_393d.jpg)\n\
  \n描述\n\n使用 `?:` 运算符，我们可以使用下面的赋值语句：\n\n![使用条件表达式的赋值语句。max 等，左括号，a，大于，b，右括号，问号，a，冒号，b，分号。](img/9781284166033_CH07_393e.jpg)\n\
  \n这是另一个例子。数字 `x` 的绝对值定义为：\n\n![x 的绝对值公式。x 的绝对值等于，如果 x 大于等于 0，如果 x 小于 0 则等于负 x。](img/9781284166033_CH07_393f.jpg)\n\
  \n为了计算变量 `x` 的绝对值并将其存储到 `y` 中，你可以如下使用 `?:` 运算符：\n\n![使用条件表达式的赋值语句。y 等，左括号，x 大于等于\
  \ 0，右括号，问号，x，冒号，负 x，分号。](img/9781284166033_CH07_394.jpg)\n\n在两个示例中，我们都在 `Expression1`\
  \ 周围加上了括号。这些括号是不必要的，因为条件运算符的优先级非常低。尽管如此，为了清晰，习惯上会包含它们。\n\n### 运算符优先级\n\n下表总结了我们目前为止遇到的\
  \ C++ 运算符的优先级，不包括位位运算符。（附录 B 包含完整列表）。在表中，运算符按优先级分组，水平线将每个优先级级别与下一个更低级别隔开。\n\n| 运算符\
  \ | 结合性 | 备注 |\n| :--- | :--- | :--- |\n| `()` | 从左到右 | 函数调用和函数式类型转换 |\n| `++ --`\
  \ | 从右到左 | `++` 和 `--` 作为后置运算符 |\n| `++ -- ! + -` | 从右到左 | `++` 和 `--` 作为前缀运算符 |\n\
  | `(cast) sizeof` | 从右到左 | |\n| `* / %` | 从左到右 | |\n| `+ -` | 从左到右 | |\n| `< <=\
  \ > >=` | 从左到右 | |\n| `== !=` | 从左到右 | |\n| `&&` | 从左到右 | |\n| `\\|\\|` | 从左到右 |\
  \ |\n| `?:` | 从右到左 | |\n| `= += -= *= /=` | 从右到左 | |\n\n标记为 *Associativity*（结合性）的列描述了分组顺序。在同一优先级范围内，大多数运算符从左到右分组。例如：\n\
  \n![一个表达式。a 减 b 加 c。](img/9781284166033_CH07_394b.jpg)\n\n意味着\n\n![一个表达式。左括号，a 减\
  \ b，右括号，加 c。](img/9781284166033_CH07_394b.jpg)\n\n\n\n\n一个简单的例子是表达式 `someFloat+2`。该表达式不包含\
  \ `char`、`short`、`bool` 或枚举值，因此步骤 1 留下了一个混合类型表达式。在步骤 2 中，`int` 的类型比 `float` “低”，因此值\
  \ `2` 被临时强制转换为 `float` 类型的值——例如，`2.0`。然后进行加法运算，结果的类型为 `float`。\n\n这种对类型转换的描述也适用于关系表达式，例如：\n\
  \n![一个关系表达式。变量名中的单词合并了。some Int 小于等于 some Float。](img/9781284166033_CH07_396a.jpg)\n\
  \n在比较之前，`someInt` 的值被临时转换为浮点数。算术表达式和关系表达式的区别在于关系表达式的结果类型始终是 `bool`。\n\n下表描述了在 C++\
  \ 中将值从一种简单类型提升到另一种类型的结果：\n\n| **源** | **目标** | **提升结果** |\n| :--- | :--- | :---\
  \ |\n| `double` | `long double` | 值相同，占用更多内存空间 |\n| `float` | `double` | 值相同，占用更多内存空间\
  \ |\n| 整数类型 | 浮点类型 | 整数值的浮点等效值；小数部分为零 |\n| 整数类型 | 其对应的 `unsigned` 类型 | 如果原始数字为负，则值相同；如果原始数字为负，则变为一个完全不同的正数\
  \ |\n| 有符号整数类型 | 更长的有符号整数类型 | 值相同，占用更多内存空间 |\n| 无符号整数类型 | 更长的整数类型（有符号或无符号） | 相同的非负值，占用更多内存空间\
  \ |\n\n| 注意：将 `char` 提升为 `int` 的结果取决于编译器。某些编译器将 `char` 视为 `unsigned char`，因此提升总是产生非负整数。在其他编译器中，`char`\
  \ 表示有符号 `char`，因此负值的提升产生负整数。 |\n\n表格底部的注释提示，如果你正尝试编写可移植的 C++ 程序，可能会遇到潜在问题。如果你仅使用\
  \ `char` 类型存储字符数据，则没有问题。C++ 保证机器字符集中的每个字符都表示为一个非负值。使用字符数据时，从 `char` 到 `int` 的提升在任何编译器的机器上得到相同的结果。\n\
  \n然而，如果你尝试使用 `char` 类型处理小型有符号整数以节省内存，那么这些值到 `int` 的提升在不同机器上产生不同的结果！一台机器可能会将负 `char`\
  \ 值提升为负 `int` 值，而另一台机器可能会将负 `char` 值提升为正 `int` 值。如果你仅使用 `char` 存储字符数据，就不会有任何问题。\n\
  \n我们给出的类型转换规则是 C++ 语言定义中规则的简化。完整规则对无符号类型有更多说明，我们在文中很少使用它们。\n\n### 图形用户界面 (GUI)\n\
