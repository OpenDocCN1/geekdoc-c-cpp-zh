  \n## 第 10 章\n\n## 自定义数据类型\n\n这一章代表了你编程学习的一个转折。到目前，我们强调的是简单变量和控制结构。在本章中，重点转向了数据的结构化（组织）。为了开始这一转变，我们将更详细地检查数据类型的概念。\n\
  \n到目前，我们主要处理 `int`、`char`、`bool` 和 `float` 数据类型。这四种类型在技术上足以解决任何问题，但有时，仅使用内置类型在程序中表示数据会变得繁琐。C++\
  \ 有几种创建用户定义数据类型的机制；即由我们自己定义的新数据类型。本章引入了其中一种机制：枚举类型。\n\n我们还扩展了数据类型的定义，包含了结构化类型，它表示组件的集合。我们从泛指结构化类型开始，然后查看\
  \ C++ 两个示例：`struct` 和 `union`。\n\n## 10.1 内置简单类型\n\n在第 2 章中，我们将数据类型定义为一组值（称为域）以及对这些值的一组操作。对于\
  \ `int` 类型，域是从 `INT_MIN` 到 `INT_MAX` 的整数集，我们到目前为止看到的操作有 `+`、`–`、`*`、`/`、`%`、`++`、`--`\
  \ 以及关系运算和逻辑运算。`float` 类型的域是特定计算机能够表示的实数集，其操作与 `int` 类型类似，但除了模运算（`%`）。对于 `bool` 类型，域是值\
  \ `true` 和 `false`，操作是逻辑（`!`、`&&`、`||`）和关系运算。`char` 类型虽然主要表示字符，但被归类为整类型，因为它使用整数来代表字符。在章的后面我们将看到它是如何工作的。\n\
  \n`int`、`char`、`bool` 和 `float` 类型有一个共同属性：每个类型的域都由不可分的、或原子的值组成。具有这种属性的数据类型称为`简单`或`原子`数据类型。原子值没有可以单独访问的组成部分；例如，一个\
  \ `char` 类型的单个字符是原子的，但字符串“Good Morning”是由 12 个我们也可以访问的单个字符组成的。\n\n描述简单类型的另一种方法是说，该类型的变量只能关联一个值。相比之下，结构化类型允许整个值集合与一个变量关联。正如我们刚刚注意到的，字符串包含一个字符集合，并且它可以赋值给代表它的变量。\n\
  \n![根节点标记为简单类型。根节点有 3 个子节点，标记为 integral、enum 和 floating。标记为 integral 的节点的子节点如下：char,\
  \ short, int, long 和 bool。前 4 种类型被标记为无符号。标记为 floating 的节点的子节点如下：float, double 和\
  \ long double。](img/9781284166033_CH10.jpg)\n\n### 图 10.1 C++ 简单类型\n\n`int`、`char`、`bool`\
  \ 和 `float` 类型有一个共同属性：每个类型的域都由不可分的、或原子的值组成。具有这种属性的数据类型称为简单或原子数据类型。\n\n### 数值类型\n\
  \n`char`、`short`、`int` 和 `long` 类型表示不同大小的整数。同样，`float`、`double` 和 `long double`\
  \ 指不同大小的浮点数。我们说的大小是指什么\n\n在 C++ 中，大小是以 `char` 大小的倍数来量的。根据定义，`sizeof(char)` 为 1。在大多数（并非所有）计算机上，1\
  \ 表示一个字节。\n\n让我们使用符号 `sizeof(SomeType)` 来表示类型 SomeType 值的大小。那么，根据定义，`sizeof(char)`\
  \ = 1。除了 `char` 之外，C++ 中数据对象的大小取决于机器。在某一台机器上，可能是：\n\n1. `sizeof(char)` = 1\n2. `sizeof(short)`\
  \ = 2\n3. `sizeof(int)` = 4\n4. `sizeof(long)` = 8\n\n在另一台机器上，大小可能如下\n\n1. `sizeof(char)`\
  \ = 1\n2. `sizeof(short)` = 2\n3. `sizeof(int)` = 2\n4. `sizeof(long)` = 4\n\n尽管存在这些差异，C++\
  \ 语言保证以下语句为真：\n\n* 1 = `sizeof(char) <= sizeof(short) <= sizeof(int) <= sizeof(long)`。\n\
  * 1 <= `sizeof(bool) <= sizeof(long)`。\n* `sizeof(float) <= sizeof(double) <= sizeof(long\
  \ double)`。\n* `char` 至少 8 位。\n* `short` 至少 16 位。\n* `long` 至少 32 位。\n\n\n\n请记住，保留字\
  \ `unsigned` 可以出现在某些整数类型名称之前——`unsigned char`、`unsigned short`、`unsigned int` 和\
  \ `unsigned long`。这些类型的值是非负整数，取值范围从 0 到某个取决于机器的最大值。虽然我们在本文书中很少使用无符号类型，但为了严谨起见，我们在这里提到了它们。\n\
  \nC++ 系统提供了 C 头文件 `climits`，你可以通过它确定你机器的最大值和最小值。该头文件定义了常量 `CHAR_MAX`、`CHAR_MIN`、`SHRT_MAX`、`SHRT_MIN`、`INT_MAX`、`INT_MIN`以及`LONG_MAX`\
  \ 和 `LONG_MIN`。无符号类型的最小值为 0，最大值由 `UCHAR_MAX`、`USHRT_MAX`、`UINT_MAX` 和 `ULONG_MAX`\
  \ 定义。要找到特定于你计算机的值，你可以像这样输出它们：\n\n![输出特定计算机数值的代码。](img/9781284166033_CH10_554.jpg)\n\
  \n描述\n\n为可移植性设计的代码应该在程序需要的地方检查这些限制。\n\n同样，标准 C 头文件 `cfloat` 定义了常量 `FLT_MAX`、`FLT_MIN`、`DBL_MAX`、`DBL_MIN`以及`LDBL_MAX`\
  \ 和 `LDBL_MIN`。要确定你机器的值范围，你可以写一个短程序输出这些常量。\n\n注意，C++ 标准增加了名为 `limits.h` 和 `float.h`\
  \ 的头文件，它们也包含这些定义。\n\n### 字符\n\n每台计算机都使用特定的字符集。ASCII 集合由 128 个不同的字符组成，在历史上被大多数计算机使用。ASCII\
  \ 的扩展版本提供了 256 个字符，对于英语足够了但对于国际使用不足。这种局限性导致了 Unicode 字符集的出现。\n\nUnicode 允许更多的字符。它的发明主要是为了适应人类语言字母和符号的多样性，以及最近的表情符号。在\
  \ C++ 中，Unicode 使用的是 `wchar_t` 类型而不是 `char`。在本文书中，为了保持简单，我们将代码限制在 `char` 类型和 ASCII；然而，如果你发现自己在编写用于国际部署的程序，那么学习\
  \ `wchar_t` 的细节是值得的。\n\n使用哪种字符集，每个字符都有一个**外部表示**——它在屏幕等输入输出设备上的外观——以及一个**内部表示**——它在计算机内存中的存储方式。如果你在\
  \ C++ 程序中使用 `char` 常量 `'A'`，它的外部表示是字母 A；也就是说，如果你显示它，你会看到一个 A，正如你预期的那样。然而，它的内部表示是一个存储在整数值中的数据。128\
  \ 个 ASCII 字符的内部表示从 0 到内存单元 127。例如，附录 E 中的 ASCII 表显示字符 `'A'` 的内部表示为 65，字符 `'b'` 的内部表示为\
  \ 98。\n\n让我们再次看看以下语句：\n\n![一个语句。语句中的单词合并在一起。某些字符、等号、单引号、大写 A、单引号、分号。](img/9781284166033_CH10_555.jpg)\n\
  \n编译器将常量 `'A'` 翻译为整数 65。我们也可以按如下编写语句：\n\n![一个语句。语句中的单词合并在一起。某些字符、等号、65、分号。](img/9781284166033_CH10_555a.jpg)\n\
  \n这两个语句的效果相同——将 65 存储到 `someChar` 中。然而，第一个更容易理解。\n\n我们之前提到过，计算机无法区分内存中的字符和整数数据，因为它们都存储为整数。然而，当我们执行\
  \ I/O 操作时，计算机会做正确的事——它使用与输出表达式的数据类型相对应的外部表示。例如，看这段代码：\n\n![一段代码段。](img/9781284166033_CH10_555b.jpg)\n\
  \n描述\n\n当执行这些语句时，输出是\n\n![一个语句的输出。第一行：97。第二行：a。](img/9781284166033_CH10_555c.jpg)\n\
  \n当 `<<` 运算符输出 `someInt` 时，它生成字符 9 和 7 的序列。对于 `someChar`，它输出单个字符 `a`。尽管两个变量内部都包含值\
  \ 97，但每个变量的数据类型决定了它是如何输出的。\n\n你认为以下语句序列会输出什么？\n\n![一系列语句。语句中的单词合并在一起。第一行：char c\
  \ h 等、单引号、大写 d、单引号、分号。第二行：c h++、分号。第三行：c out、左尖括号、c h、分号。](img/9781284166033_CH10_555.jpg)\n\
  \n如果你回答 E，你是正确的。第一个语句声明了 `ch` 并对其进行了初始化。下一个语句增加了 `ch`。第三个是 `cout << ch;`。\n\n```cpp\n\
  char ch = 'd';\nch++;\ncout << ch;\n```\n\n## 10.2 用户定义类型\n\n数据类型的概念是所有编程语言的基础。C++\
  \ 的优势之一是它允许程序员创建类型，以适应程序的需求。本文的剩余部分将涉及用户定义类型。在本节中，我们将学习如何创建自己的类型。\n\n### typedef\
  \ 语句\n\n`typedef` 语句允许为现有类型引入一个新名称。其语法如下\n\n![typedef 语句的语法。语法中的单词合并。typedef、现有类型、新类型、分号。](img/9781284166033_CH10_556.jpg)\n\
  \n在 `bool` 类型成为 C++ 语言的一部分之前，许多程序员使用以下代码模拟布尔类型：\n\n![模拟布尔类型的代码。](img/9781284166033_CH10_556b.jpg)\n\
  \n描述\n\n![模拟布尔类型的代码延续。](img/9781284166033_CH10_557.jpg)\n\n描述\n\n在这段代码中，`typedef`\
  \ 语句导致编译器在程序的其余部分将所有的 `Boolean` 替换为 `int`。\n\n`typedef` 语句提供的定义自定义类型的方法非常有限。实际上，`typedef`\
  \ 并没有创建一个新类型：它仅仅为现有类型创建了一个别名。\n\n尽管 `typedef` 并不能真正创建一个新的数据类型，但它是编写更可读性程序的价值工具。在\
  \ `bool` 是内置类型之前，使用 `Boolean`、`TRUE` 和 `FALSE` 的代码比使用 `int`、`1` 和 `0` 进行布尔操作的代码更具描述性。\n\
  \n用户定义类型的名称遵循与标识符相同的作用域规则。大多数类型（如 `Boolean` 示例）都是全局定义的，尽管如果新类型只在一个子程序中使用，那么在子程序内部定义也是合理的。确定命名常量定义位置指南也适用于数据类型。\n\
  \n在第三章 中，我们提到各种字符串操作作为参数或作为结果返回无符号整数，但我们可以使用 `int`。实际上，这些值应该是 `size_type` 类型，该类型在\
  \ `string` 中定义为\n\n\n\n\n\n![A type defined in a string. typedef, s t d, colon,\
  \ colon, size underscore t, size underscore type, semicolon.](img/9781284166033_CH10_557a.jpg)\n\
  \n但 `size_t` 是什么呢？它是 C `std` 头文件中提供的一种类型，取决于具体实现。这种无符号整数类型定义了针对特定编译器字符串的最大长度。鉴于这一事实，在处理字符串操作时，使用\
  \ `string::size_type` 是更好的代码风格。\n\n`string::npos` 是 `string::size_type` 类型最大的可能值，在许多机器上，这个值是一个类似于\
  \ `4294967295` 的数字。这个值可以被理解为“无效位置”，因为 `string` 操作不会让任何字符串达到这种长度。\n\n## 枚举类型\n\n\
  C++ 允许用户通过列出（枚举）构成类型范围域的字面量值来定义一种新的简单类型。这些字面量值是标识符，用逗号分隔，并将列表包含在大括号中。以这种方式定义的数据类型被称为**枚举类型**。这是一个示例：\n\
  \n![A defined data type. enum days, left brace, uppercase sun, uppercase mon, uppercase\
  \ tue, uppercase wed, uppercase thu, uppercase fri, uppercase sat, right brace,\
  \ semicolon.](img/9781284166033_CH10_557b.jpg)\n\n此声明创建了一个名为 `Days` 的新数据类型。`Typedef`\
  \ 是为现有类型创建别名，而像 `Days` 这样的枚举类型是一个真正的新类型，与任何现有类型都是不同的。\n\n`Days` 类型中的值——`SUN`、`MON`、`TUE`\
  \ 等被称为**枚举常量**。这些枚举常量是有序的，因为在枚举类型的范围域内，`SUN<MON<TUE. . .` 等值是有顺序的。例如 `<FRI<SAT`。对枚举常量应用关系运算符就像对字符应用运算符一样：测试的关系是枚举常量在数据类型的排序中是处于“之前”还是“之后”。\n\
  \n我们之前看到过 `char` 的内部表示是非负整数。枚举类型中的值在内部也表示为整数。默认情况下，第一个枚举常量的值为 0，第二个为 1，依此类推。我们对\
  \ `Days` 枚举类型的声明与以下一组声明相似：\n\n![A set of declarations.](img/9781284166033_CH10_558.jpg)\n\
