  \n描述\n\n`array` 模板还会跟踪 `array` 中的元素数量，可以通过 `size` 观察者方法访问。例如，如果我们通过部分初始化创建了 `intArr`：\n\
  \n![一个语句。](img/9781284166033_CH17_p1074-5.jpg)\n\n描述\n\n我们可以使用 `size` 方法来找出有多少个元素被初始化：\n\
