  \n章节导读：© Joost Lagerweij/EyeEm/Getty Images.\n\n## 第 13 章\n\n### 基于数组的列表\n\n第 11\
  \ 章 引入了数组，这是一种由单一命名的相同类型组件组成的数据结构。通常，使用一维数组来存储项目列表。在本章中，我们将研究将数据表示为列表的数组算法。我们从直觉上都知道什么是“列表”。我们一直使用列表——购物清单、待办事项列表、派对邀请列表。在计算机应用程序中，列表是组织数据的有效方式。\n\
  \n我们的算法将实现为通用函数，这些函数可以轻松修改以处理各种列表。我们以一个使用数组作为主要数据结构的案例研究作为结束。\n\n## 13.1 什么是列表？\n\
  \n从逻辑角度来看，列表是同质的、`线性`的元素集合。这里的线性意味着在逻辑层面上，列表中的每个元素（第一个和最后一个元素除外）都有唯一的先驱者和一个唯一的后继者。^(1)列表中的项目数量（我们称为`长度`）是列表的一个属性。\n\
  \n列表可以是`无序的`——其元素可以按任何特定特定顺序放入列表中——也可以是`已排序的`。例如，数字列表可以按值排序，字符串列表可以按字母顺序排序，地址列表可以按邮政编码排序。当排序列表中的元素是复合类型时，结构中的其中一个成员（称为`键`）决定了它们的逻辑顺序。例如，学生列表可以按名称字母顺序排序，也可以按学生学号数字顺序排序。在第一情况下，名称是键；在第二种情况下，学号是键。（参见**图\
  \ 13.1**。）\n\n如果一个列表不能包含具有重复键的项，我们说它具有唯一键。（参见**图 13.2**。）本章同时处理无序列表和具有唯一键的元素列表（按键值从小到大排序）。列表上的项可以是任何类型，原子的或复合的。在随后的讨论中，“项”、“元素”和“组件”是同义词；它们指的是存储在列表中的内容。\n\
  \n![两个标记的表格，分别按 ID 哈希值排序和按名称排序。每个表有 2 列。两个单独标记的条目，roll 指向两个表的第二列。](img/9781284166033_CH13_FIGF13_1.jpg)\n\
  \n描述\n\n图 13.1 具有两个键的列表\n\n![两个标记的表格，分别按 ID 哈希值排序和按名称排序。每个表有 2 列。两个单独标记的条目，roll\
  \ 指向两个表的第二列。](img/9781284166033_CH13_FIGF13_1.jpg)\n\n描述\n\n图 13.2 具有重复键的列表\n\n\n\
  \n\n![函数标题。](img/9781284166033_CH13_P758-1.jpg)\n\n描述\n\n![带有注释行的函数标题。](img/9781284166033_CH13_P759-1.jpg)\n\
  \n描述\n\n检查某个项是否在列表中的观察者必须将该项作为参数。我们将此方法命名为 `isThere`。\n\n![函数标题。](img/9781284166033_CH13_P759-2.jpg)\n\
  \n描述\n\n在设计转换器时，我们必须做出一些决策。例如，我们是否允许列表中出现重复项？这一选择对删除和添加项目都有影响。如果我们允许重复项，我们所说的“删除项目”是指什么？是删除其中一个副本还是删除所有副本？\n\
  \n目前，我们只做一个决策，并设计符合该决策的算法。我们将在练习中检查其他选择的影响。让我们列表中只允许一个项的一个副本。在这种情况下，删除项目只是移除该副本。但我们是否假设要删除的项在列表中？如果它不在，这算是一个错误吗？还是删除操作的意思是“如果存在，则删除”？对于客户端来说，在删除项目之前检查该项是否在列表中是一项额外工作，所以让我们使用后一种含义。\n\
  \n我们现在将这些决策整合到方法标题的文档中。\n\n![带有注释行的函数标题。](img/9781284166033_CH13_P759-3.jpg)\n\n\
  描述\n\n迭代器允许用户逐个查看列表中的项。实现“获取下一个项”职责的方法将命名为 `GetNextItem`。当调用迭代器时，列表必须跟踪要返回的下一个项。它是通过一个记录要返回的下一个项的位置的数据成员来实现的。构造函数将此位置初始化为\
  \ 0，并在 `GetNextItem` 中递增。\n\n客户端可以使用列表的长度来控制遍历列表的循环。另一种方法是提供一个观察者 `HasNext`，询问列表是否包含另一个未见过的项。让我们使用第二种方法，并在练习中探索第一种方法。由于在\
  \ `HasNext` 为假时调用 `GetNextItem` 会导致错误，我们必须在文档中说明假设：当调用 `GetNextItem` 时有一个可以访问的项。\n\
  \n如果用户在迭代过程中添加或删除了项，会发生什么？取决于插入或删除发生在迭代点之前还是之后，我们的迭代循环可能会导致跳过或重复项。\n\n对于处理这种可能危险危险的情况，我们有几种选择。列表可以在添加或删除项时将当前位置重置为开头，也可以可以在迭代进行期间禁止转换器操作。我们在这里通过文档中的一种假设选择了后者方案。以防用户想要重新开始迭代，让我们提供一个\
  \ `ResetList` 方法来重新初始化当前位置。\n\n![带有注释行的函数标题。](img/9781284166033_CH13_P760-1.jpg)\n\
  \n描述\n\n我们剩下写的就是构造函数了。\n\n![带有注释行的函数。](img/9781284166033_CH13_P760-2.jpg)\n\n描述\n\
  \n### 数据表示\n\n正如第 11 章 中定义的，一维数组由固定数量的同构组件组成。数组的一种用途是存储值列表。那么，列表由一个值数组和一个整数变量 `length`\
  \ 组成，该变量说明数组中存储了多少个列表元素。让我们把数组命名为 `data`。使用类结构来封装长度和值数组。根据我们之前对 `GetNextItem` 的讨论，我们知道列表必须包含一个变量，指示在迭代中下一个项位于列表的什么位置。因为我们正在处理数组，我们假设该变量将是一个整数索引。让我们称之为\
  \ `currentPos`。\n\n在**图 13.3** 中，你可以看到数组从 `data[0]` 到 `data[MAX_LENGTH-1]`，但存储在数组中的列表元素从\
