  \ `SortedList` 类（其中项是数值值或字符串），以及 `SortedList` 类（其中项是对象）。我们对中间大小的算法进行了测试。我们还应该测试包含零组件、一个组件、`MAX_LENGTH-1`\
  \ 个组件和 `MAX_LENGTH` 个组件的列表。\n\n当我们为列表操作编写列表未满的前提条件时，我们指出可以通过另一种方式处理该问题——我们可以在函数的参数列表中包含一个错误标志。函数可以调用\
  \ `IsFull` 并设置错误标志。通过这种方法，如果错误标志被设置为 `true`，则不会发生插入。这两种方案都是处理该问题的可接受方法。重要的是，我们要明确说明是由调用代码还是被调用函数来检查错误条件。然而，当错误条件发生时，必须由调用代码决定。也就是说，如果通过前提条件处理，则用户必须编写代码来保证前提条件；如果通过标志处理，则用户必须编写代码来监控错误标志。\n\
