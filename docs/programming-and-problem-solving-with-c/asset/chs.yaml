  \n章节开启：© Joost Lagerweij/EyeEm/Getty Images.\n\n# 第 8 章\n\n## 函数\n\n![一张从家到办公室的路径图。](img/9781284166033_CH08_418.jpg)\n\
  \n自从我们在第 3 章中引入 `sqrt` 等标准库例程以来，你就一直在使用 C++ 函数了。到目前，你应该已经熟悉调用函数来执行任务的概念了。但我们还没有考虑过\
  \ `main` 之外如何创建自己的函数。这就是本章以及下一章的主题。\n\n你可能会奇怪，为什么我们等到现在才看用户定义的子程序。原因——也是使用函数的主要目的——在于编写它们是为了帮助组织大型程序。到目前为止，我们的程序还较小，但我们正准备编写更大、更复杂的程序，因此现在是时候学习这种组织代码的重要手段了。\n\
  \n## 8.1 使用 void 函数进行功能分解\n\n作为简短的回习，让我们回顾一下 C++ 中的两种子程序：返回值函数和 void 函数（空函数）。返回值函数通过其参数列表接收数据，并向调用代码返回一个值。调用者通过在表达式中使用函数来触发（调用）返回值函数：\n\
  \n![一个表达式。y 等于 3.8 乘以 s q r t，左括号，x，右括号，分号。](img/9781284166033_CH08_418a.jpg)\n\n\
  相比之下，void 函数不返回结果，它的调用是一个独立的语句。例如与 `istream` 和 `ifstream` 类相关的 `get` 函数：\n\n![一个语句。c\
  \ 在点 get，（左括号，input Char，右括号），分号。](img/9781284166033_CH08_418b.jpg)\n\n在本章中，我们将学习如何创建自己的\
  \ void 函数。在第 9 章中，我们将考虑返回值函数。\n\n一直以来，你将程序设计为模块的集合。这些模块许多可以实现为 C++ 中的*用户定义 void\
  \ 函数*。\n\n### 何时使用函数\n\n通常情况下，你可以将任何模块编码为函数，尽管某些模块非常简单，这样做并无帮助。因此，在设计程序时，我们需要根据整个程序是否因此变得更容易理解，决定将哪些模块编码为函数。其他因素可能会影响这一决策，但目前这是最简单的策略。\n\
  \n如果一个模块只有单行，通常最好是将其直接写在程序中。将其转换为函数实际上会增加代码的复杂性，这违背了使用函数的目的。相反，如果一个模块有很多行，它通常是一个很好的函数。\n\
  \n我们将一个短模块实现为函数的另一种情况是：它在程序的多个地方被使用。在一个地方编码模块并在多处调用它会产生更好的设计，原因有两个：首先，如果我们在多个地方直接编码该模块，那么我们犯错的机会就会更多。如果我们只编码一次模块，并在需要的地方调用它，我们引入错误的概率就会更小。其次，如果我们以后必须更改模块算法，我们只需要在函数内部进行一次更改，而不需要像以前那样在代码中搜索每一个我们曾直接过该模块的地方。\n\
  \n请记住，将模块实现为函数应该只影响程序的可读性，并可能让以后修改程序变得更加或更不方便。它不应该改变程序的功能。我们说*应该*是因为这是否真实取决于我们如何实现函数的*接口*。我们还没有检查过模块设计的这一方面，现在我们来考虑这一点。\n\
  \n### 为什么模块需要接口设计？\n\n在查看如何将模块转换为函数之前，我们需要重新回顾如何设计模块。到目前为止，我们的模块仅仅是语句组，并且可以访问程序中的所有值。这对于小问题没问题，但当我们有包含许多模块的大问题时，它就不行了。\n\
  \n为了理解为什么允许每个模块访问每个值是一个坏主意，请考虑一个类比。在家里，人们倾向于敞开门，并分享大部分物品。现在假设你入住了一家遵循相同原则的酒店——所有的房间都没有门。这样既没有隐私也没有安全。（而且每个人都能自由访问别人的东西）。为了让酒店安全，我们需要为每个房间装上可以锁的门。\n\
  \n大型问题中的模块需要设计成带有门。它们不应该直接访问其他的值，信息应该通过一个受控制的路径进入离开。我们将模块设计的这一方面称为接口。对于接口我们有两种视角：外部和内部。在我们的房间类比中，从外部看你只能看到门；从内部你可以看到门和房间的内容。我们从外部视角开始接口设计。\n\
  \n### 设计接口\n\n从现在开始，我们将模块视为设计中的一个独立区块，其实现细节从视图中被“隐藏”了。\n\n我们如何处理这样一个模块？从外部角度来看，只要你知道模块功能什么以及如何调用它，你就可以使用它。例如，你不知道\
  \ `sqrt` 的代码是如何写的（它的实现是从视图中隐藏的），但你仍然可以有效地使用它。\n\n模块的功能及其调用方式的规范定义了它的**接口**（参见图 8.1）。隐藏模块实现被称为**封装**。当模块被封装时，我们不必担心它意外访问其他模块的值，或者其他模块能够更改它的值。\n\
  \n封装的另一个优势是，只要接口不变，我们对模块进行内部更改。例如，你可以使用更高效的算法重写封装模块的体。\n\n![一个模块可见和不可见部分的插图。](img/9781284166033_CH08_FIGF01.jpg)\n\
  \n图 8.1 模块接口（可见）与实现（隐藏）\n\n描述\n\n指定模块接口的一种方法是写下它的目的、前条件和后条件以及它接收和返回的信息。如果规范足够完整，我们可以将其交给其他人，其他人就可以为我们实现该模块。接口和封装是*团队编程*的基础，即一组程序员合作解决一个大问题。\n\
  \n\n\n因此，设计一个模块可以（也应该）分为两个任务：设计外部接口和设计内部实现。对于外部接口，我们关注的是*是什么*（what），而不是*怎么做*（how）。我们定义模块的行为（它做什么）以及与它通信的机制。\n\
  \n为了定义与模块通信的机制，我们列出以下条目：\n\n1. `Incoming values`（输入值）：模块从调用者处接收的值\n2. `Outgoing\
  \ values`（输出值）：模块产生并返回给调用者的值\n3. `Incoming/outgoing values`（输入/输出值）：调用者拥有、但模块对其进行更改（接收并返回）的值\n\
  \n接下来，我们将接口的内部视图作为实现的起点点。我们为模块内部的变量标识符选择名称，每个标识符都对应我们列表中的一个值。这些标识符就成了我们所谓的模块的**参数列表**。\n\
  \n从此以后，我们在模块头部中写出参数。模块需要的任何其他变量都是*局部*的（local），我们在它的函数体内部声明它们。对于任何预计要实现为函数的模块，我们都会这样做。作为模块接口的一部分，我们还记录了每个参数的**数据流**方向。\n\
  \n现在我们已经看到了如何设计一个用于函数实现的模块，我们准备好开始在 C++ 中编写模块了。\n\n### 将模块编写为 void 函数\n\n在 C++ 中，将模块转换为\
  \ void 函数是一件非常简单的事。基本上，void 函数看起来和 **main** 函数相似，只是函数头部使用 `void` 而不是 `int` 作为函数的数据类型。此外，void\
  \ 函数的体*并不*包含像这样的语句：\n\n```cpp\n![return 0;](img/9781284166033_CH08_420.jpg)\n```\n\
  \n正如**main** 函数。这是因为 void 函数不向其调用者返回值。\n\n让我们来看一个使用 void 函数的程序。从一个没有任何参数的非常简单示例开始。你的朋友正从一次长旅行回来，你想写一个程序打印以下信息：\n\
  \n![程序预期输出的列表。](img/9781284166033_CH08_421.jpg)\n\nDescription\n\n这是该程序的设计：\n\n\
  | **Main** | 打印两行星号 打印“Welcome Home!” | **Level 0** |\n| :--- | :--- | :--- |\n\
  | **Print 2 Lines** | 打印“***************” 打印“***************” | **Level 1** |\n\
  | **Print 4 Lines** | 打印“***************” 打印“***************” 打印“***************”\
  \ 打印“***************” | **Level 1** |\n\n如果我们我们将两个第一级模块写为 void 函数，那么 **main** 函数简单如下：\n\
  \n```cpp\n![程序代码。关键字和函数名的单词已合并。代码包含以下关键字：int, main, c out, end](img/9781284166033_CH08_421a.jpg)\n\
  ```\n\nDescription\n\n注意这段代码与我们功能分解中的 **main** 模块是多么相似。它包含了两个函数调用——一个调用名为 `Print2Lines`\
  \ 的函数，另一个调用名为 `Print4Lines` 的函数。这两个函数都有空的参数列表。\n\n接下来的代码对你应该很熟悉，但仔细看函数头部。\n\n```cpp\n\
  ![Print 2 Lines 的程序代码。](img/9781284166033_CH08_421b.jpg)\n```\n\nDescription\n\n\
  这一段是一个*函数定义*。函数定义是从函数头部延伸到块（即函数体）末尾的代码。函数头部以 `void` 单词开头，告知编译器这不是一个返回值的函数。函数体执行一些普通语句，并且*不包含*\
  \ **return** 语句。\n\n现在再次看函数头部。和 C++ 中的任何其他标识符一样，函数名不能包含空格，尽管我们的模块名称包含空格。函数名后面是一个空的参数列表——括号之间什么也没有用。稍后我们将会看到如果函数使用参数，括号内会放什么。\n\
  \n现在让我们把 **main** 和另外两个函数组合在一起，形成一个完整的程序。\n\n```cpp\n![显示消息的程序代码。](img/9781284166033_CH08_422.jpg)\n\
  ```\n\nDescription\n\nC++ 函数定义可以任意顺序出现。我们可以选择将 **main** 函数放在最后而不是第一个，但 C++ 程序员通常将\
  \ **main** 放在第一个，并将任何辅助函数放在它后面。\n\n在 **Welcome** 程序中，**main** 函数之前的两个语句被称为*函数原型*（function\
  \ prototypes）。这些声明是必要的，因为 C++ 要求在你在使用标识符之前对其进行声明。我们的 **main** 函数调用了函数 `Print2Lines`\
  \ 和 `Print4Lines`，但它们的定义直到以后才出现。我们提供函数原型是为了提前告知编译器 `Print2Lines` 和 `Print4Lines`\
  \ 是存在的。\n\n## 8.2 用户定义函数概述\n\n现在我们已经看到了如何用函数编写程序的示例，让我们简要且非正式地查看函数构造的一些重要要点。\n\n\
  ### 函数调用中的控制流\n\n我们说过 C++ 函数定义可以以任何顺序排列。在编译期间，函数按照它们在代码中顺序进行翻译。然而，在程序执行时，控制从 **main**\
  \ 的第一语句开始并按照执行顺序进行。(1)\n\n当遇到函数调用时，控制跳转到该函数体的第一个语句并按照执行顺序遵循剩余语句。在执行最后一个语句后，控制返回到函数调用之后。由于函数调用改变了执行顺序，函数被视为控制结构。**图\
  \ 8.2** 展示了函数的物理顺序与执行顺序的区别。图中，函数 A、B、C 按照 A、B、C 的顺序编码，但按照 C、B、A 的顺序执行。\n\n在 **Welcome**\
  \ 程序中，执行从 **main** 函数中的第一个可执行语句开始（对 `Print2Lines` 的调用）。当 `Print2Lines` 被调用时，控制传递到它的第一个语句及其体内的后续语句。在\
  \ `Print2Lines` 的最后一个语句执行后，控制返回到 **main** 调用之后的位置（打印“Welcome Home!”的语句）。\n\n![C\
  \ plus 加 程序的一部分和一个模块结构图。](img/9781284166033_CH08_FIGF02.jpg)\n\nDescription\n\n\n\
  \n图 8.2 函数的物理顺序与执行顺序对比\n\n### 函数参数\n\n观察 `Welcome` 程序，你可以发现 `Print2Lines` 和 `Print4Lines`\
  \ 是非常相似的函数。它们的区别仅在于打印的行数。我们这个程序中真的需要两个不同的函数吗？也许我们只需要写一个可以打印任意行数的函数，其中“任意行数”由调用者（`main`）作为参数传递。决定只使用一个函数改变了设计。\n\
  \n| `Main` 打印行 (2) 打印“Welcome Home!” 打印行 (4) | `Level 0` |\n| :--- | :--- |\n| `Print\
  \ Lines (In: numLines) Level 1` `FOR count going from 1 to numLines` 打印“***************”\
  \ | `Level 1` |\n\n这是程序的第二个版本，只有一个函数来执行打印操作。我们将其命名为 `NewWelcome`。\n\n![New Welcome\
  \ 程序的代码。](img/9781284166033_CH08_426.jpg)\n\n描述\n\n在 `PrintLines` 的函数头部中，你会看到括号之间有一些看起来像变量声明的代码。这段代码是*参数声明*。\n\
  \n在函数调用列出的项是它的**参数**。在函数头部声明的变量是**形式**。它们在函数内部提供了标识符，我们可以通过这些标识符引用通过参数提供的值。参数是函数接口的内部视图。\n\
  \n在 `NewWelcome` 程序中，两次函数调用中的参数是常量 `2` 和 `4`，而 `PrintLines` 函数中的参数名为 `numLines`。当\
  \ `main` 函数用参数 `2` 调用 `PrintLines` 时，控制权移交给 `PrintLines`，`numLines` 被初始化为 `2`。在\
  \ `PrintLines` 内部，由计数控制的循环执行两次，然后函数返回。第二次调用 `PrintLines` 时，`numLines` 被初始化为参数值 `4`。循环执行四次，函数返回。\n\
  \n这是 `main` 的另一个版本，仅为了说明参数可以是变量而不是常量：\n\n![包含 main 函数的程序段。](img/9781284166033_CH08_427.jpg)\n\
  \n描述\n\n在这个版本中，每次 `main` 调用 `PrintLines` 时，`lineCount` 值的拷贝被传递给函数以初始化参数 `numLines`。如你所见，参数和形式可以有不同的名称。\n\
  \n`NewWelcome` 说明函数可以从 `main` 中的许多地方（或其它函数）被调用。如果一个任务必须在程序的多个地方完成，我们可以通过将其写成函数并在需要的地方调用它来避免重复编码。\n\
  \n如果向函数传递了多个参数，则参数和形式参数将根据它们在两个列表中的相对位置进行匹配。例如，如果你想让 `PrintLines` 打印由任何选定字符组成的行，而不只是星号，你可以重写该函数，使其头部变为：\n\
  \n![函数头部。void Print Lines, 左括号, int num Lines, 逗号, char whichChar, 右括号。](img/9781284166033_CH08_427a.jpg)\n\
  \n对此函数的调用可能如下：\n\n![函数调用。Print Lines, 左括号, 3, 逗号, 单引号, #, 单引号, 右括号, 分号。](img/9781284166033_CH08_427b.jpg)\n\
  \n第一个参数 `3` 与 `numLines` 匹配，因为 `numLines` 是第一个形式参数。同样，第二个参数 `'#'` 与第二个形式 `whichChar`\
  \ 匹配。\n\n1 实际上，C++ 程序的某些部分会在 `main` 之前执行，例如 `cin` 和 `cout` 的初始化。然而，对于我们编写的程序，最简单的想法是将执行视为从\
  \ `main` 开始。\n\n## 8.3 Void 函数的语法和语义\n\n### 函数调用（激活）\n\n正如我们所见，要调用（或激活） void 函数，我们使用其名称作为一条语句，并在括号中带有参数。以下是\
  \ void 函数调用的语法模板：\n\n![函数调用（调用 void 函数）](img/9781284166033_CH08_428.jpg)\n\n注意，参数列表是可选的，但即使列表为空也需要括号。\n\
  \n如果列表包含两个或多个参数，你必须用逗号将它们分隔。以下是 `ArgumentList` 的语法模板：\n\n![ArgumentList 表达式 , Expression\
  \ ...](img/9781284166033_CH08_428a.jpg)\n\n当执行函数调用时，参数被传递给匹配位置的形式参数，然后控制权转移到函数体中的第一条可执行语句。当函数的最后一条语句执行完毕后，控制权返回到函数调用之后的位置。\n\
  \n### 函数声明和定义\n\n在 C++ 中，函数的声明在物理上必须位于它的调用。声明为编译器提供了函数的名称、返回值的形式（`void` 或其他数据类型），以及参数的数据类型。\n\
  \n`NewWelcome` 程序包含了三个函数声明。第一个声明（带有注释 `// Function prototype` 的语句）不包含函数体。其余两个——`main`\
  \ 和 `PrintLines`——包含了函数体。\n\n正如我们已经过的，非正式来说，在 C++ 术语中，省略体的声明被称为**函数原型**，而包含体的声明是函数定义。我们可以使用恩图来说说明所有定义都是声明，但并非所有声明都是定义：\n\
  \n![函数声明 定义（带有体的）](img/9781284166033_CH08_429.jpg)\n\n通常，C++ 通过是否分配内存空间来区分声明和定义。例如，函数原型是一个声明——它只是告诉编译器函数的属性。函数定义更进一步：它导致编译器为函数中的指令分配空间。2)\n\
  \n整个 C++ 的规则是，你可以任意次数声明某项，但只能定义一次。在 `NewWelcome` 程序中，我们可以为 `PrintLines` 包含多个函数原型（尽管没有理由这样做），但只允许一个函数定义。\n\
  \n#### 函数原型\n\n函数原型允许我们在定义之前声明函数，因此我们可以任意顺序安排它们的定义。正如我们指出的，C++ 程序员通常先定义 `main`，然后是所有其他函数。\n\
  \n除了风格之外，在 C++ 中还有一种情况原型至关重要。假设有两个函数 A 和 B 互相调用。如果我们先写 A 的定义再写 B 的定义，那么在 A 内部对 B\
  \ 的调用会产生 B 未声明的消息。当然，反转定义的顺序也不会解决问题。解决方案是在 A 的定义之前编写 B 的原型，这样 B 在 A 使用之前就被声明了。因为\
  \ B 的原型省略了函数体，它不包含对 A 的调用。结果是它避免了在声明 A 之前引用它。注意到当我们采用在 `main` 之前编写所有函数原型的风格时，这种特殊情况会被涵盖。\n\
  \nvoid 函数的原型具有以下语法：\n\n![函数原型（针对 void 函数）](img/9781284166033_CH08_429a.jpg)\n\n\
  如你在模板中所示，函数不包含体，并用分号终止声明。参数列表是可选的，以允许无参数函数。如果参数列表存在，它具有如下形式：\n\n\n\n\n\n![参数列表（函数原型中的）](img/9781284166033_CH08_429b.jpg)\n\
  \n附加在数据类型名称后的取地址符 `&` 是可选的，将在本章稍后部分进行解释。\n\n在函数原型中，参数列表必须指定参数的数据类型，但它们的名称是可选的。你可以写以下一种形式：\n\
  \n![一个函数原型。void Do Something, 左括号, int, 逗号, float, 右括号, 分号。](img/9781284166033_CH08_430.jpg)\n\
  \n或者\n\n![一个函数原型。void Do Something, 左括号, int velocity, 逗号, float angle, 右括号, 分号。](img/9781284166033_CH08_430a.jpg)\n\
  \n为参数提供名称有助于阅读代码，但请注意编译器会忽略它们。\n\n### 函数定义\n\n正如你已经通过编写 `main` 函数所意识到的，一个函数定义由两部分组成：函数的头和它的函数体，在语法上是一个块（复合语句）。这里是\
  \ `void` 函数定义的语法模板：\n\n![参数列表（函数定义中的）](img/9781284166033_CH08_430b.jpg)\n\n注意，函数头*并没有*像函数原型那样以分号结尾。包含分号将产生语法错误。\n\
  \n参数列表的语法与函数原型不同之处在于，你必须指定参数的名称。此外，根据我们的风格偏好（但不是 C++ 语言的要求），我们将每个参数声明在单独的一上：\n\n\
  ![参数列表（函数定义中的）](img/9781284166033_CH08_430c.jpg)\n\n### 局部变量\n\n由于函数体是一个块，因此任何函数——而不只是\
  \ `main`——都可以包含变量声明。这些变量被称为`局部变量`，因为它们仅在声明它们的块内是访问的。对于调用代码来说，它们是不存在的。如果你尝试从另一个函数输出局部变量的内容，将会发生如\
  \ `UNDECLARED IDENTIFIER` 的编译时错误。你在 `NewWelcome` 程序中看到了局部变量的示例——在 `PrintLines` 函数内部声明的\
  \ `count` 变量。\n\n局部变量相反，在程序所有函数之外声明的变量被称为全局变量。我们将在第 9 章返回全局变量话题。\n\n局部变量只在函数执行时占用内存空间。当函数被调用时，会为其局部变量分配内存空间。当函数返回时，局部变量的内存空间会被回收供以后使用。因此，每次调用函数时，其局部变量都从未定义的值开始。这意味着你必须在函数内部初始化局部变量。此外，由于它们的内会在函数返回时被回收，你无法使用局部变量在多次函数调用之间存储值。\n\
  \n以下代码段说明了函数声明和调用机制的每个部分：\n\n![一段代码段。](img/9781284166033_CH08_431.jpg)\n\n描述\n\n\
  ### 返回语句\n\n`main` 函数使用语句\n\n![返回语句。return 0, 分号。](img/9781284166033_CH08_431a.jpg)\n\
  \n将值 `0` 返回给其调用者，即操作系统。\n\n正如我们所看到的，`void` 函数不返回任何值。当函数执行到体末尾时，它会返回到调用处。\n\n正如你在\
  \ `NewWelcome` 程序中看到的，`PrintLines` 函数打印一些星号并返回。\n\n或者，你可以使用第二种返回语句。它看起来如下：\n\n![语句。return,\
  \ 分号。](img/9781284166033_CH08_432.jpg)\n\n该语句*仅适用于* `void` 函数。它可以出现在函数体的任何地方；会导致立即退出函数并返回到调用处。这是一个例子：\n\
  \n![某个函数的定义。](img/9781284166033_CH08_432.jpg)\n\n描述\n\n在这个（无意义）示例中，有两种退出函数的方法。在函数入口处，测试\
  \ `n` 的值。如果 `n` 大于 50，函数打印消息并返回。如果 `n` 小于或等于 50，则跳过 If 语句，继续执行赋值语句。这种函数的另一种写法是使用\
  \ If-Else 结构：\n\n![函数的定义。](img/9781284166033_CH08_432a.jpg)\n\n## 8.4 参数\n\n函数执行时，它使用调用提供的参数。如何实现的？答案取决于参数的性质。C++\
  \ 支持两种参数：`值参数`和`引用参数`。对于值参数，函数接收参数的副本这是我们目前为止使用的参数类型。对于引用参数，函数接收调用者参数的位置（内存地址）。通过在数据类型名称旁添加取地址符\
  \ `&` 来声明引用参数。在详细检查这两种参数的区别之前，让我们看一个带有引用和值参数声明混合的函数头示例：\n\n![函数头。](img/9781284166033_CH08_433b.jpg)\n\
  \n描述\n\n对于简单数据类型——`int`、`char`、`float` 等——值参数是默认（假设的）参数类型。换句话说，如果你不做任何特殊处理（添加取地址符），参数就被假设为值参数。要指定引用参数，你必须做额外工作（附加取地址符）。\n\
  \n### 值参数\n\n在 `NewWelcome` 程序中，`PrintLines` 函数头为\n\n![一个函数头。void PrintLines, 左括号,\
  \ int numLines, 右括号。](img/9781284166033_CH08_434.jpg)\n\n参数 `numLines` 是值参数，因为它的数据类型名称没有以\
  \ `&` 结尾。如果使用参数 `lineCount` 调用函数，\n\n![语句。PrintLines, 左括号, lineCount, 右括号, 分号。](img/9781284166033_CH08_434a.jpg)\n\
  \n\n\n\n随后参数 `numLines` 被初始化为 `lineCount` 值的拷贝。此时，数据在两个不同的内存位置有两份拷贝——一个在参数 `lineCount`\
  \ 中，另一个在参数 `numLines` 中。如果 `PrintLines` 函数内部的语句更改了 `numLines` 的值，该更改不会影响参数 `lineCount`。（记住，`lineCount`\
  \ 和 `numLines` 存储在两个不同的内存位置中。）如你所见，使用值参数有助于我们避免对参数的意外修改。\n\n由于值参数传递的是其参数的拷贝，因此任何具有值的内容都可以传递给值参数。这包括常量、变量，甚至是任意复杂的表达式。（该表达式会被求值，并且其结果的拷贝被发送到对应的值参数。）对于\
  \ `PrintLines` 函数，以下函数调用都是有效的：\n\n![3 个语句。](img/9781284166033_CH08_434b.jpg)\n\n\
  描述\n\n函数调用中的参数数量必须与函数头中的参数数量相同.^(3)此外，每个参数的数据类型应与其相同位置的参数类型相同。注意以下示例中的每个参数是如何与相同位置的参数匹配的（每个参数的数据类型是可以根据其名称推断出的）：\n\
  \n![函数头：void ShowMatch(float num1, int num2, char letter) 函数调用：ShowMatch(floatVariable,\
  \ intVariable, CharVariable);](img/9781284166033_CH08_434c.jpg)\n\n如果匹配项的数据类型不相同，则会发生隐式类型转换。例如，如果参数类型为\
  \ `int`，那么作为 `float` 表达式的参数在传递给函数之前会被强制转换为 `int` 值。像 C++ 中通常的那样，你可以通过使用显式类型转换，或者更好的是完全不要混合数据类型，来避免意外的类型转换。\n\
  \n正如我们所强调的，值参数接收的是参数的拷贝，因此无法直接访问或更改调用者的参数。当函数返回时，其值参数的内容以及局部变量的内容都会被销毁。值参数与局部变量的区别在于，当函数开始执行时，局部变量的值是定义的，而值参数会自动初始化为对应参数的值。\n\
  \n由于值参数的内容在函数返回时会被销毁，因此它们不能用于将信息返回给调用代码。如果我们*确实*想通过修改调用者的参数来返回信息怎么办？我们必须使用引用参数。\n\
  \n## 引用参数\n\n引用参数是在你在数据类型名称后加上取地址符&& 时声明的参数。它之所以被称为引用参数，是因为被调用的函数可以直接引用对应的参数。具体来说，函数允许检查*并修改*调用者的参数。\n\
  \n当使用引用参数调用函数时，传递给函数的是参数的*位置*（内存地址）而不是它的值。信息只存在一份拷贝，并且由调用者和函数共同使用。参数和变量是内存中同一位置的同义词。如果函数给参数分配了一个新值，它也更改了参数。因此，当函数返回时，参数的内容可能已经发生了，这在值参数中是不可能的（参见图\
  \ 8.3）。\n\n![两幅说明使用引用参数访问参数的图。](img/9781284166033_CH08_FIGF03.jpg)\n\n图 8.3 使用引用参数访问参数\n\
  \n描述\n\n在使用引用参数时必须小心，因为对它进行的任何更改都会影响调用代码中的参数。这里有一个函数头和调用的示例：\n\n![函数头参数与函数调用之间参数之间关系的插图。](img/9781284166033_CH08_436.jpg)\n\
  \n描述\n\n对于高亮的参数，`floatVar` 和 `charVar` 的*地址*被分别传递给 `num1` 和 `letter`。由于 `num2` 是值参数，它接收存储在\
  \ `intVar` 中的值。\n\n值参数和引用参数之间的另一个重要区别与参数与参数的匹配有关。对于值参数，我们说过会发生隐式类型转换。（如果可能，参数的值会被强制转换为参数的数据类型。）相比之下，引用参数要求匹配项必须具有*完全相同*的数据类型。由于传递给引用参数的参数是可以更改的，因此它必须是一个变量。与值参数不同，我们不能将常量或表达式传递给引用参数。\n\
  \n在本章的早期部分，我们讨论了模块中数据流方向的文档记录。对应于 Out 和 In/out 模块参数的函数参数必须在其类型后加上&。在将它们转换为 C++ 代码时，我们不加上&。\n\
  \n下表总结了参数的用法。\n\n| 项目 | 用法 |\n| :--- | :--- |\n| 参数 | 出现在函数*调用*中。对应的参数可以是引用参数或值参数。\
  \ |\n| 值参数 | 出现在函数*头*中。接收对应参数的拷贝，必要时进行转换。其参数可以是变量、常量或表达式。 |\n| 引用参数 | 出现在函数*头*中。接收对应参数的*地址*。其对应类型必须附加&。参数类型必须与参数类型完全匹配，且必须是变量。\
  \ |\n\n### 关于参数和参数列表的最后警告\n\n程序员有责任确保参数列表和参数列表在语义上和语法上都是匹配的。例如，假设我们是这样编写 `LoanCalculator`\
  \ 程序的。你能发现错误吗？\n\n![部分程序列表。](img/9781284166033_CH08_443.jpg)\n\n描述\n\n最后一个函数调用的参数列表在数量和类型上与参数列表匹配，因此没有语法错误。然而，输出将是错误的，因为前两个参数交换了。如果一个函数有两个相同数据类型的参数，你必须小心参数的顺序。\n\
  \n在书中后面，你将学习如何编写多文件程序并物理隐藏实现。在此期间，我们自觉避免编写依赖于函数内部机制的代码。\n\n### 将断言作为函数文档\n\n我们一直在非正式地讨论前提条件和后条件，但可以将正式的前提条件和后条件作为注释来记录函数接口。这里有一个示例：\n\
  \n![程序段。](img/9781284166033_CH08_445a.jpg)\n\n描述\n\n前提条件是一个描述函数在调用时必须为真的所有断言。后条件描述了在函数执行结束时已经发生了什么。\n\
  \n\n\n你可以将前条件（precondition）和后条件（postcondition）视为一份合同。该合同规定：如果前条件在函数进入时为真，那么后条件在函数退出时必须为真。`caller`（调用者）负责确保前条件，而\
  \ `function body`（函数体）必须确保后条件的满足。如果调用者未能满足其在合同中的部分（前条件），函数将无法保证后条件为真。\n\n在前面的示例中，前条件警告调用者要确保\
  \ `sum` 已被赋予一个有意义的值，并且 `count` 为正数。如果此前条件为真，函数保证它将满足后条件。如果在调用 `OutputAverage` 时\
  \ `count` 不是正数，则模块的效果是未定义的。（例如，如果 `count` 等于 0，后条件显然无法被满足——模块将会崩溃！）\n\n有时，调用者在调用函数之前不需要满足任何前条件。在这种情况下，可以省略前条件。在接下来的示例中，不需要任何前条件：\n\
  \n![程序代码段。](img/9781284166033_CH08_446.jpg)\n\n描述\n\n3 这一说法并非全部事实。C++ 有一个特殊的语言特性——称为`默认参数`（default\
  \ parameters），它允许你用少于参数数量的来调用函数。本文不涵盖默认参数。\n\n### 图形用户界面 (GUI)\n\n本章介绍函数及其作为软件工程和良好程序设计的一个方面——抽象化——的价值。在案例研究中，我们把问题分解为独立的函数。在本节中，我们将修改之前定义的函数中的代码，以使用\
  \ GUI 组件。正如你所看到的，大多数函数保持不变；只有那些需要用户交互的函数被修改了。函数不仅是将程序分解为各个部分的强大机制，而且对于设计与实现的分离至关重要，这种分离能够实现未来的修改。\n\
  \n在本节中，我们只关注我们修改的函数以及引入的任何新函数。注意使用函数如何让我们能够将 GUI 的讨论集中在应用程序的较小部分。我们需要引入三个新函数来处理用户交互的方面。以下是这些函数的原型：\n\
  \n![3 个函数原型。](img/9781284166033_CH08_458.jpg)\n\n描述\n\n`GetInputFileName` 函数将向用户询问包含账单信息的文件名，`GetOutputFileName`\
  \ 将提示用户生成报告的目标文件，而 `GetHourlyRate` 函数将让用户输入小时率。`GetInput-FileName` 和 `GetOutputFileName`\
  \ 函数都获得了一个 `string` 引用参数，函数将把用户的响应赋值给该参数。让我们先看看原始的 `main` 函数：\n\n![程序代码段。](img/9781284166033_CH08_458a.jpg)\n\
  \n描述\n\n我们首先声明用于小时率、输入和输出文件名的重要变量。接下来，我们调用 `OpenFiles`，将 `inFile` 和 `outFile` 的引用作为参数传递。`OpenFiles`\
  \ 的目标是向用户询问输入和输出文件，并将新文件分配给 `inFile` 和 `outFile`。之前的程序要求用户输入名称。我们的新程序将使用 GUI 组件。这里是我们的新版本的\
  \ `OpenFiles` 函数：\n\n![程序代码段。](img/9781284166033_CH08_459.jpg)\n\n描述\n\n我们修改了此函数，增加了第三个参数以指示打开文件是否成功，这在我们从此函数返回并需要判断是否正确打开了文件时非常有用。我们还包含了对\
  \ `GetInputFileName` 和 `GetOutputFileName` 的调用，这些调用将创建相应的 GUI 组件与用户进行交互。`GetInputFileName`\
  \ 函数非常直观：\n\n![程序代码段。](img/9781284166033_CH08_459a.jpg)\n\n描述\n\n我们创建了一个 `FileDialog`\
  \ 组件，允许用户选择包含草坪维护账单信息的输入文件。`GetOutputFileName` 函数随后向用户询问输出文件：\n\n![程序代码段。](img/9781284166033_CH08_459b.jpg)\n\
  \n描述\n\n![一个标记为“草坪维护账单案例”的文件夹内容的 GUI 组件列表。](img/9781284166033_CH08_460.jpg)\n\n\
  描述\n\n在本节中，我们使用了一个名为 `NewFileDialog` 的 GUI 组件。`NewFileDialog` 类似于允许你选择文件的 `FileDialog`；然而，`NewFileDialog`\
  \ 可以在文件不存在时创建一个新文件。以下是差异：\n\n![程序代码段。](img/9781284166033_CH08_460.jpg)\n\n描述\n\n\
  描述\n\n描述\n\n描述\n\n描述\n\n描述\n\n描述\n\n\n\n\n![一个用于草坪维护服务公司计算并编写账单的程序的 GUI 版本的延续。](img/9781284166033_CH08_463.jpg)\n\
  描述\n![一个用于草坪维护服务公司计算并编写账单的程序的 GUI 版本的延续。](img/9781284166033_CH08_464.jpg)\n描述\n\
  ![一个用于草坪维护服务公司计算并编写账单的程序的 GUI 版本的延续。](img/9781284166033_CH08_465.jpg)\n描述\n![一个用于草坪维护服务公司计算并编写账单的程序的\
  \ GUI 版本的延续。](img/9781284166033_CH08_466.jpg)\n\n### 测试与调试\n\n函数声明的参数与调用者传递给函数的参数必须符合函数的接口。函数中发生的错误通常是因为对接口的使用不当。\n\
  \n错误的一个来源是参数列表与实参数列表不匹配。C++ 编译器会确保这些列表具有相同数量且类型兼容的项目。然而，验证每个参数列表是否包含正确的项目是程序员的责任。我们必须在每次调用函数时，都将参数声明与实参数列表进行比对。如果函数头为每个参数都提供了独特的名称，并在必要时用注释进一步描述其用途，那么这项工作将简单得多。你可以通过使用描述性变量名来准确指示传递给函数的具体信息，从而避免参数列表中的错误。\n\
  \n另一个错误来源是未能确保在调用函数之前已满足该函数的前置条件。例如，如果一个函数假设在调用时输入文件不在文件末尾（EOF），那么调用代码必须在进行调用之前确保该假设成立。如果函数的行为异常，请检查其前置条件，然后追溯程序执行到调用点以验证前置条件。如果错误实际上出现在程序如何设置调用上，而你试图在一个正确的函数中寻找错误，将会浪费大量时间。\n\
  \n如果参数匹配参数且前置条件已正确建立，那么错误来源很可能在函数内部。追溯函数以验证它是否将前置条件转换为后置条件。确定所有局部变量是否已正确初始化。本应向调用者返回数据的参数必须声明为引用参数（在数据类型名称后带有\
  \ `&` 符号）。\n\n调试函数的一个重要技术是使用系统的调试器（如果可用的话），通过调试器单步执行函数的运行。如果没有可用的调试器，你可以插入调试输出语句，在调用函数之前之后立即显示参数的值。在函数内部显示局部变量的值也可能有帮助。这些信息提供了函数的快照（即其在特定时刻的状态快），这对于验证手工追踪（hand\
  \ traces）非常有用。\n\n为了彻底测试一个函数，你必须安排输入值以使前置条件推向极限；然后必须验证后置条件。例如，如果函数要求参数在某个范围内，请尝试使用该范围中间的值和极值来调用该函数。\n\
  \n### `assert` 库函数\n\n我们已经讨论了函数的前置条件和后置条件对于调试和测试有多么有用。为了陈明函数的前置条件和后置条件，我们一直将它们写成注释：\n\
  \n![一个注释。两个正斜杠。Pre、冒号、空格、学生数量 Count 大于 0。](img/9781284166033_CH08_467.jpg)\n\n当然，编译器会忽略注释。它们不是可执行语句；它们是供人类检查的。\n\
  \nC++ 标准库还为我们提供了一种编写可执行断言的方法。通过 `cassert` 头文件，该库提供了一个名为 `assert` 的 void 函数。该函数接受一个逻辑（布尔）表达式作为参数，如果该表达式为\
  \ `false`，则会停止程序。这是一个示例：\n\n```\n![程序代码。](img/9781284166033_CH08_468.jpg)\n```\n\
  \n描述\n\n`assert` 函数的参数必须是一个有效的 C++ 逻辑表达式。如果其值为 `true`，则什么都不会发生；执行继续。。如果其值为 `false`，程序执行将立即终止，并带有一个消息，说明\
  \ (1) 参数列表中出现的断言，(2) 包含程序源代码的文件名，以及 (3) 程序中的行号。在前面的示例中，如果 `studentCount` 的值小于或等于\
  \ 0，程序将在显示如下消息后停止：\n\n![程序停止时显示的消息。断言失败、冒号、student Count 大于 0、逗号、file my p r o g\
  \ dot c p p、逗号、line 48。](img/9781284166033_CH08_466.jpg)\n*注：图片路径引自 466，但上下文是 468)*\n\
  ![程序停止时显示的消息。断言失败、冒号、student Count 大于 0、逗号、file my p r o g dot c p p、逗号、line 48。](img/9781284166033_CH08_466.jpg)\n\
  （此消息并不意味着 `studentCount` 大于 0。事实上，恰恰相反。）\n\n可执行断言与以注释形式表示的断言相比具有巨大的优势：断言的效果是高度可见的。开发中的程序可能会有很多\
  \ `assert` 调用以识别错误发生的位置。\n\n另一种方便的方法是禁用断言而不删除它们。在 `include` 之前插入预处理器指令 `#define\
  \ NDEBUG`，如下：\n\n![两个预处理器指令。第一行：hash define DEBUG。第二行：hash include、左括号、c assert、右括号。第三行：点](img/9781284166033_CH08_468.jpg)\n\
  \n这样当你运行程序时，所有的 `assert` 调用都会被忽略。（`NDEBUG` 的意思是“无调试”，而 `#define` 指令是我们现在不会讨论的预处理器功能。）在程序测试完成后，你可以重新开启检查，只需在\
  \ `#define NDEBUG` 之前加上 `//` 将该行变为注释。\n\n尽管 `assert` 函数非常有用，但它有两个局限性。首先，函数的参数必须表示为\
  \ C++ 逻辑表达式。我们可以将如下注释转换为可执行断言：\n\n![两个注释。第一行：两个正斜杠。文件包含一个金额、逗号。第二行：两个正斜杠。利率、逗号和年数、句。](img/9781284166033_CH08_468.jpg)\n\
  \n通过以下语句转换为可执行断言：\n\n```\nassert(0.0 <= yearlyInterest && numberOfYears <= 30);\n\
  ```\n\n![一个语句。assert、左括号、0.0 小于或等于 yearlyInterest、两个 & 符号、numberOfYears 小于或等于 30、右括号、分号。](img/9781284166033_CH08_468.jpg)\n\
  \n相反，没有简单的方法可以将注释转换为 C++ 逻辑表达式。第二个局限性是，`assert` 函数仅适用于测试开发中的程序。生产环境程序（已向公众发布的程序）必须向用户提供有帮助的错误信息。你可以想象，如果程序突然退出并显示如下错误信息，用户将会有多么困惑：\n\
  \n\n\n\n\n![错误消息。断言失败，冒号，sys Res，小于或等于 res Count，逗，file new p r o j dot c p p，逗，line\
  \ 298。](img/9781284166033_CH08_469.jpg)\n\n尽管有这些局性，你仍应该考虑将 `assert` 作为测试和调试的常用工具。\n\
  \n### 测试与调试\n\n1.  编写函数时，请严格遵循文档指南（参见附录 F）。随着程序变得越来越复杂，遵守文档和格式标准变得越发重要。为函数的先决条件（如果有）、后置条件添加注释，并对所有参数以及作用不直观的局部变量的用途编写注释。\n\
  \n2.  在程序顶端为每个函数提供一个函数原型。确保原型与其对应的函数头完全匹配（原型末尾的分号除外）。\n\n3.  确保每个函数原型都以分号结尾，而每个函数头不以分号结尾。由于经常会在两者互相复制粘贴，很容易在其中一个上出错。\n\
  \n4.  确保参数列表给出了每个参数的数据类型。\n\n5.  除非结果通过参数返回，否则请使用值参数。引用参数可以更改调用者参数的内容；值参数则不能。然而，文件名必须是引用参数。\n\
  \n6.  在参数列表中，确保每个引用参数的数据类型以取地址符（`&`）结尾。如果没有该符号，该参数就是值参数。\n\n7.  确保每个函数调用的参数列表在项的数量和顺序上与参数列表匹配，并非常仔细处理它们的数据类型。编译器会捕获参数数量不匹配的情况。然而，如果数据类型不匹配，编译器可能不会给出错误信息。使用值参数传递时，类型不匹配会导致隐式类型转换，而不是编译时错误。\n\
  \n8.  记住，匹配引用参数的参数必须是一个变量，而值参数的参数可以是任何提供相同数据类型值的表达式（提示 7 中的注释除外）。\n\n9.  在尝试定位错误源时，熟悉你所有可用的工具——算法演练、手工追踪、系统的调试器程序、`assert`\
  \ 函数以及调试输出语句。\n\n![一张森林中树木的照片。](img/Chapter-opener.jpg)\n\n章节引言：© Joost Lagerweij/EyeEm/Getty\
  \ Images.\n\n## 第 9 章\n\n作用域、生命周期以及更多函数\n\n![一张从家到办公室的路径图。](img/9781284166033_CH09_484.jpg)\n\
  \n随着程序的增大，其中标识符的数量随之增加。我们使用了更多的函数、变量和常量标识符。某些标识符声明在块内部；另一些——例如函数名——声明在任何块之外。本章将研究\
  \ C++ 的规则，即函数如何访问在其块之外声明的标识符。利用这些规则，我们将回到第 8 章中开始的接口设计讨论。\n\n## 9.1 标识符的作用域\n\n\
  回想局部标识符是在块内部声明的标识，它们不能在块外部被访问。全局变量和常量是在所有函数之外声明的标识。在下面的示例中，`gamma`是一个全局变量，可以被 `main`\
  \ 中的语句访问：\n\n```cpp\nint gamma = 10;\nvoid someFunc() {\n    int gamma = 5;\n  \
  \  cout << gamma; // 输出 5\n}\nint main() {\n    cout << gamma; // 输出 10\n}\n```\n\
  \nC++ 定义了若干类作用域：\n\n1.  **类作用域**：该术语指声明在类内部的标识符。我们将在第 12 章中讨论。\n2.  **局部作用域**：在块内部声明的标识符的作用域延伸到该块的结束。与任何其他函数体相同。\n\
  3.  **全局作用域**：在所有函数之外声明的标识符的作用域延伸到整个文件。\n\n\n\n\n\n以下是详细的作用域规则，不包括类作用域以及我们尚未讨论的某些语言特性：\n\
  \n1. 函数具有全局作用域。函数定义不能嵌套在函数定义内部。\n2. 函数参数的作用域与在函数体最外层块中声明的局部变量的作用域相同。\n3. 全局变量或常数的作用域从声明处延伸到文件结束，但规则\
  \ 5 除另外。\n4. 局部变量或常数的作用域从声明处延伸到其所在块的结束。此作用域包括任何嵌套块，但规则 5 另有规定。\n5. 标识符的作用域不包括任何包含同名局部声明标识符的嵌套块。（局部标识符具有命名优先级。）\n\
  \n这是一个演示 C++ 作用域规则的示例程序。为了简化示例，只列出了声明和标题。注意位于函数 `Block2` 内部标记为 `Block3` 的 While\
  \ 循环体了自己的局部变量声明。\n\n![演示变量作用域的程序。](img/9781284166033_CH09_487.jpg)\n\n描述\n\n让我们从\
  \ `ScopeRules` 程序定义的块的角度来看这个程序，并看看这些规则的具体含义。**图 9.1** 显示了 `ScopeRules` 程序中的标题和声明，并用框表示可见性作用域。\n\
  \n框内的任何内容都可以引用周围框内的任何内容。不允许从外向内的引用。因此，位于 `Block3` 中的语句可以访问在 `Block2` 中声明的任何标识符或任何全局变量。`Block3`\
  \ 中的语句无法访问在 `Block1` 中声明的标识符，因为它必须从外部进入 `Block1` 框。\n\n注意，函数的参数位于函数的框内，但函数名本身位于框外。如果函数名在框内，那么一个函数将无法调用另一个函数。这一点仅说明函数名具有全局作用域。\n\
  \n将图 9.1 中的框想象成由双面镜子制成的墙隔的房间，反射面面向外，透明面面向内。如果你站在 `Block3` 房间里，你可以穿过周围所有的房间看到全局变量的声明（以及其间的任何内容）。然而，你无法看到任何其他房间（例如\
  \ `Block1`），因为它们的镜面外表面会阻挡你的线。由于这种类比，“可见”一词通常用于描述访问作用域；例如，变量 `a2` 在整个程序中都是可见的，这意味着可以从任何地方访问它。\n\
  \n![作用域图。](img/9781284166033_CH09_FIGF01.jpg)\n\n图 9.1 作用域规则程序的作用域图\n\n描述\n\n图 9.1\
  \ 并没有说明全部；它只代表了作用域规则 1 到 4，而没有规则 5。变量 `a1` 在三个不同的地方声明。由于命名优先级规则，`Block2` 和 `Block3`\
  \ 访问的是在 `Block2` 中声明的 `a1`，而不是全局 `a1`。同样，在 `Block2` 中声明的变量 `b2` 的作用域不包括在 `Block3`\
  \ 中声明变量 `b2` 所产生的“空洞”。\n\n命名优先级规则由编译器按如下方式实现：当表达式引用一个标识符时，编译器首先检查局部声明。如果该标识符不是局部的，编译器将向外逐层检查嵌套层，直到找到同名的标识符。在在该处停止。如果在更外层级声明了同名的标识符，则永远不会被触及。\n\
  \n如果编译器到达全局声明（包括由 `#include` 指令插入的标识符）仍找不到该标识符，则会发出类似于 `UNDECLARED IDENTIFIER`（未定义的标识符）的错误消息。此类消息可能表示拼写错误或大小写错误，或者意味着该标识符在引用之前未声明，或者根本没有声明。它也可能表示块的嵌套方式导致标识符的作用域不包含该引用。\n\
  \n### 变量声明与定义\n\n在第 8 章中，你学习了 C++ 区分函数声明和定义。定义会保留内存空间，而声明不会。\n\nC++ 对变量声明使用相同的术语。如果一个变量声明也为变量保留了内存，那么它就变成了变量定义。我们目前为止看到的所有变量声明都是变量定义。如果一个变量声明不是定义，它会是什么样呢？\n\
  \n在第 8 章中，我们讨论了多文件程序。C++ 有一个保留关键字 `extern`，允许你引用位于另一个文件中的全局变量。如下所示的定义\n\n![一条语句。int\
  \ someInt, 分号。](img/9781284166033_CH09_488.jpg)\n\n会导致编译器为 `someInt` 预留内存位置。相比之下，语句\n\
  \n```\nextern someInt;\n```\n\n被称为*外部声明*。它表示 `someInt` 是位于另一个文件中的全局变量，并且在此不预留存储。在\
  \ C++ 术语中，前述语句是 `someInt` 的声明而非定义。在 C++ 中，你可以多次声明一个变量或函数，但只能有一个定义。\n\n除非区分声明和定义很重要，否则我们将继续使用更通用的短语*变量声明*，而不是具体的*变量定义*。\n\
  \n### 命名空间\n\n一段时间以来，我们一直在程序中包含以下 **using** 指令：\n\n```\nusing namespace std;\n```\n\
  \n在第 2 章中，我们注意到如果没有此指令，我们必须使用限定名来引用 `cout`\n\n`std::cout`\n\n现在我们已经探索了作用域的概念，可以回答这个问题：什么是命名空间？它是一种允许程序员创建具名作用域的机制。例如，标准头文件\
  \ `cstdlib` 包含了几个库函数的原型，其中之一是绝对值函数 `abs`。这些声明包含在如下的*命名空间定义*中：\n\n```cpp\nnamespace\
  \ std {\n    int abs(int);\n}\n```\n\n描述\n\n命名空间定义由 `namespace` 单词、一个由程序员选择的标识符以及括号之间的*命名空间体*组成。在命名空间体内部声明的标识符被认为具有*命名空间作用域*。除了使用三种方法外，这些标识符无法外部访问。\n\
  \n第一种方法是使用限定名：命名空间的名称、作用域解析运算符（`::`），然后是所需的标识符。这里有一个示例：\n\n```cpp\nstd::abs(-5);\n\
  ```\n\n我们告知编译器引用的是 `std` 命名空间中声明的 `abs`，而不是其他的 `abs`（例如我们自己编写的名为 `abs` 的函数）。\n\n\
  第二种方法是使用如下的 **using***声明*语句：\n\n```cpp\nusing std::abs;\n```\n\n\n\n\n![带有 using\
  \ 声明的程序](img/9781284166033_CH09_491.jpg)\n\n描述\n\n这些 `using` 声明允许标识符 `abs` 和 `cout`\
  \ 在整个 `main` 函数体中使用，分别作为较长名称 `std::abs` 和 `std::cout` 的别名。\n\n第三种方法——也就是我们熟悉的那种方法——是\
  \ `using` 指令（它与 `using` 声明不同）：\n\n![带有 using 指令的程序](img/9781284166033_CH09_491a.jpg)\n\
  \n描述\n\n使用 `using` 指令时，来自指定命名空间的*所有*标识符都是可访问的，但仅限于该指令出现的作用域内。在前面的代码段中，`using` 指令位于局部作用域（块级内部），因此来自\
  \ `std` 命名空间的标识符仅在 `main` 内部可用。如果我们将 `using` 指令放在所有函数外部（正如我们一直这样做的那样），如下：\n\n![带有\
  \ using 指令的程序](img/9781284166033_CH09_491b.jpg)\n\n描述\n\n那么 `using` 指令位于全局作用域；使得来自\
  \ `std` 命名空间的标识符在全局可用。\n\n在全局作用域中放置 `using` 指令是为了方便。例如，我们编写的所有函数都可以引用如 `abs`、`cin`\
  \ 和 `cout` 等标识符，而不需要在每个函数中都插入 `using` 指令。\n\n在创建大型多文件程序时，程序员经常会使用多个库，此时创建全局 `using`\
  \ 指令被认为是一个坏主意。两个或多个库可能仅仅由于巧合，为不同的用途使用了相同的标识符。这时，全局 `using` 指令会导致*命名冲突*（同一标识符的多次定义），因为所有库的标识符都在同一个全局作用域中。（C++\
  \ 程序员将这个问题称为“污染全局命名空间”。）\n\n我们继续对 `std` 命名空间使用全局 `using` 指令，是因为我们的程序相对较小，因此不太发生命名冲突。此外，`std`\
  \ 命名空间中的标识符非常常用，大多数 C++ 程序员都会避免重复定义它们。\n\n考虑到命名空间作用域的概念，我们对 C++ 作用域分类的描述如下：\n\n\
  1. **类作用域（Class scope）：** 该术语指的是*类*数据类型，我们在第 12 章中讨论它。\n2. **局部作用域（Local scope）：**\
  \ 在块内部声明的标识符的作用域从声明处延伸到该块的结束。同样，函数参数（形式参数）的作用域从声明处延伸到函数体块结束。\n3. **命名空间作用域（Namespace\
  \ scope）：** 在命名空间定义中声明的标识符的作用域从声明处延伸到命名空间体的结束，*并且*它的作用域包含了任何指定该命名空间的 `using` 指令的作用域。\n\
  4. **全局（或全局命名空间*）作用域（Global or global namespace scope）：** 在所有命名空间、函数和类之外声明的标识符的作用域从声明处延伸到包含程序代码的整个文件。\n\
  \n注意，这些是作用域分类的通用描述，而非作用域规则。这些描述没有考虑到名称隐藏（name hiding）。\n\n1 C++ 提供了绕过名称优先级的语法，即使在局部声明了同名的标识符时，也能访问全局标识符。我们可以在不指定命名空间的情况下使用\
  \ `::` 运算符。例如，如果我们声明了一个名为 `A1` 的局部常量，我们可以写成 `::A1` 来引用名为 `A1` 的全局常量。\n\n2 从通用概念来说，*命名空间*（namespace）是*作用域*（scope）的另一种说法。在这里我们将其视为一种特定的\
  \ C++ 语言特征。\n\n## 9.2 变量的生命周期\n\n作用域规则决定了标识符*何处*可访问，但每个标识符还有一个称为**生命周期**（lifetime）的属性——即在程序执行期间，它实际拥有内存分配的*时期*局部变量的存储空间在函数被调用时创建（分配）。在函数执行期间，变量保持“活跃”状态，当函数退出时，存储空间被回收（释放）。相比之下，全局变量的生命周期是整个程序的执行过程。它的内存在程序开始执行时分配，并在程序终止时释放。注意，作用域是一个*编译时*属性，而生命周期是一个*运行时*属性。\n\
  \n在 C++ 中，**自动变量**（automatic variable）的存储在进入块时分配，退出块时释放。**静态变量**（static variable）的存储在整个程序期间内分配。所有全局变量都是静态的。默认情况下，块内声明的变量是自动的。但是，你可以在声明局部变量时使用关键字\
  \ `static`，这样它的值就会从一个函数调用持续到另一个函数调用。\n\n下一个程序包含一个函数，用于记录它被调用的次数。输出显示在程序之后。\n\n![带有静态变量的程序](img/9781284166033_CH09_493.jpg)\n\
  \n描述\n\n这里是程序的输出：\n\n![静态变量的输出](img/9781284166033_CH09_493a.jpg)\n\n描述\n\n### 声明中的初始化\n\
  \n程序中最常见的操作之一是先声明变量，然后在另一个语句中为其分配初始值。这是一个典型的例子：\n\n```\nint sum;\nsum = 0;\n```\n\
  \n正如我们在第 8 章中所看到的，C++ 允许你将这两个语句合并。结果被称为*声明初始化*（initialization in a declaration）。在这里我们在声明中初始化了\
  \ `sum`：\n\n```cpp\nint sum = 0;\n```\n\n在声明中，指定初始值的表达式被称为*初始化值*（initializer）。在前一个语句中，初始化值为\
  \ `0`。如果初始化值和变量的数据类型不匹配，会发生隐式转换。\n\n自动变量每次进入块时都会初始化为指定的值：\n\n![代码片段](img/9781284166033_CH09_494b.jpg)\n\
  \n描述\n\n相比之下，静态变量（全局变量或声明为静态的局部变量）的初始化发生一次——即控制第一次到达其声明处。这是一个示例，其中局部静态变量在函数第一次被调用时初始化：\n\
  \n![代码片段](img/9781284166033_CH09_494c.jpg)\n\n描述\n\n初始化只是给变量一个初始值；我们可以在执行期间对其赋值另一个值。\n\
  \n## 9.3 接口设计\n\n我们现在回到接口设计问题，我们在第 8 章开始讨论过这个问题（#9781284166033_CH08.xhtml）。回想一下，通过模块接口的数据流可以采取形式：输入（In）、输出（Out）以及输入输出（In/out）。任何纯粹的输入项都应该是值参数。剩余两类项中的项必须是引用参数；函数向调用者发送结果的唯一方法是使用它们的地址。\n\
  \n\n\n\n\n有时，人们很想跳过接口设计步骤，让模块通过全局变量与其他模块进行通信。千万不要这样做！如果没有有意识的接口设计，你实际上是在创建一个结构糟糕且没有文档的接口。除非在理由充分的情况下，否则使用全局变量是一种糟糕的编程习惯，可能会导致程序错误。这些错误极难定位，并且通常表现为不希望出现的**副作用**。\n\
  \n### 副作用\n\n假设你在程序中调用了库函数 `sqrt`：\n\n![一条语句。y 等于 s q r t，左括号，x，右括号)，分号。](img/9781284166033_CH09_499.jpg)\n\
  \n描述\n\n你期望对 `sqrt` 的调用只完成一件事：计算变量 `x` 的平方根。如果 `sqrt` 也改变了变量 `x` 的值，你将会感到惊讶，因为根据定义，`sqrt`\
  \ 不会此类更改。这种结果将是意料之外且不需要的 `副作用` 示例。\n\n副作用可能是引用参数和函数中粗心的编码共同导致的。如果函数代码尝试将引用参数当作普通变量使用，它可能会无意中改变调用代码中参数的值。正如我们所说的，值参数通过防止更改传递到参数，避免了这种副作用。我们在上一个软件维护案例研究中见过这方面的例子。\n\
  \n当函数访问全局变量时，也可能发生副作用。例如，如果你忘记声明局部变量，而恰好有一个同名的全局变量，编译器不会报告错误。但当函数无意中更改该全局变量时，你就会遇到副作用。该错误在函数返回且调用者访问该全局变量之后才会出现。由于\
  \ C++ 中非局部作用域的工作机制，每个函数都具有产生这种副作用的潜力。\n\n副作用错误特别难找，因为问题出现在程序的一个部分，而其产生源在另一个可能完全无关的部分。每位程序员都经历过这样的体验：试图去隔离一个莫名其妙、甚至似乎违反了编程语言规则的\
  \ Bug。当你开始认为一个错误是编译器的 Bug 时，你可能正在处理一个副作用 Bug！\n\n鉴于此类错误的挑战性，避免避免此类错误是最佳策略。模块应该具有的唯一外部影响是通过参数列表的良好结构化接口传递信息（参见**图\
  \ 9.2**）。更明确地说：*模块中使用的所有变量应该是参数或局部变量。* 此外，*输入参数应该是值参数*。这种方法将每个模块与程序的其他部分隔离开，这样就不会发生副作用。当一个模块没有副作用时，我们可以将其视为独立代码并在其他程序中重用。带有副作用的模块几乎是不可重用的。\n\
  \n![一张说明副作用错误的框图。](img/9781284166033_CH09_FIGF02.jpg)\n\n图 9.2 副作用\n\n描述\n\n下方的\
  \ `Trouble` 程序可以运行，但由于全局变量和副作用，产生了错误的结果：\n\n![一个糟糕程序设计的插图。](img/9781284166033_CH09_500.jpg)\n\
  \n描述\n\n![设计糟糕的程序的后续。](img/9781284166033_CH09_501.jpg)\n\n描述\n\n`Trouble` 程序本应该输出每行输入中的整数个数。作为最终输出，它应该显示行数。但每当程序运行时运行时，它报告的行数与最后行的整数个数相同。你的第一反应可能是仔细检查\
  \ `main` 函数中是否存在计算行数的逻辑错误。但 `main` 中的算法是没问题的。Bug 可能会在哪里呢？问题在于 `CountInts` 函数使用全局变量\
  \ `count` 来存储整数个数。程序员可能本想声明一个名为 `count` 的局部变量，但忘记了。\n\n此外，`count` 没有理由成为全局变量。如果已经在\
  \ `main` 中声明了局部变量 `count`，那么编译器就会报告 `CountInts` 使用了未声明的标识符。如果在 `main` 和 `CountInts`\
  \ 中都声明了名为 `count` 的局部变量，程序就能正常工作。这两个变量之间没有冲突，因为每个变量只在自己的块内可见。\n\n这个副作用错误很容易定位，因为我们只有一个另一个函数需要检查。在包含成百上千函数的程序中，要确定是哪一个导致\
  \ `main` 行为异常要困难得多。\n\n`Trouble` 程序还展示了不访问全局变量规则的一个常见例外。从技术上讲，`cin` 和 `cout` 是在头文件\
  \ `iostream` 中声明的全局对象。`CountInts` 函数直接访问它们。为了完全隔离 `CountInts`，应该将 `cin` 和 `cout`\
  \ 作为参数传递。然而，`cin` 和 `cout` 是 C++ 中的基础 I/O 设施，因此根据惯例，函数经常直接访问它们。\n\n### 全局常量\n\n\
  与你可能认为的不同，全局引用常量是可以接受的。因为常量的值不会改变，所以不会产生副作用。全局引用有两个优点：易于更改和一致性。在一个地方更改常量比在每个函数中更改局部声明容易得多。\n\
  \n并不是说你应该全局声明*所有*常量。如果一个常量只在一个函数中使用，就在局部声明。在此，你可能想查看本章末尾的问题解决案例，它进一步说明了接口设计。\n\n\
  ## 9.4 返回值的函数\n\n到目前为止我们专注于编写 void 函数。现在我们转向返回值的函数。你已经在 C++ 标准库中熟悉了此类函数：`sqrt`、`abs`、`fabs`\
  \ 等。从调用者的角度来看，void 函数和返回值函数的主要区别在于如何调用。对 void 的调用是一个完整的语句；而返回值的函数是在表达式内调用的。\n\n\
  从设计的角度来看，当一个模块只有一个结果且该结果直接用于表达式时，就会使用返回值函数。让我们看一个例子。C++ 标准库没有提供 `int` 值的幂函数，所以让我们自己写一个。函数接收两个整数\
  \ `number` 和 `n`（其中 `n` 大于等于 0），并计算 `number^n`。一个简单的解决方案是反复乘以 `number`。由于迭代次数是已知的，计数循环是合适的。循环从\
  \ `n` 的初始值减到 0。在每次迭代中，将之前的积乘以 `number`。\n\n```\n![名为 Power 的函数定义。](img/9781284166033_CH09_504.jpg)\n\
  ```\n\n描述\n\n第一个注意到的是标题是以数据类型 `int` 而不是 `void` 开头的。第二个注意到的是结尾的 `Return` 语句，它包含一个整数表达式。\n\
  \n\n\n\n有返回值的函数返回一个值——不是通过参数，而是通过 `Return` 语句。标题开处的数据类型声明了函数返回的值的类型。这种类型被称为`函数类型`（function\
  \ type），尽管更准确的术语是`函数值类型`（function value type，或函数返回类型 function return type 或 result\
  \ type）。\n\n**图 9.3** 所示的程序调用了函数 `Power`。`Power` 函数中的最后语句将结果作为函数值返回。\n\n你现在已经看到了\
  \ `Return` 语句两种形式。这种形式\n\n![一个语句。return, 分号。](img/9781284166033_CH09_504a.jpg)\n\
  \n*仅*在 void 函数中有效。它导致控制立即返回到调用者。相比之下，这种形式\n\n![一个语句。return, Expression, 分号。](img/9781284166033_CH09_504b.jpg)![函数调用返回的插图。](img/9781284166033_CH09_FIGF03.jpg)\n\
  \n图 9.3 将函数值返回给调用函数的表达式\n\n描述\n\n*仅*在返回值的函数中有效。它将控制返回给调用者，并将 `Expression` 的值作为函数值传。（如果\
  \ `Expression` 的数据类型与函数类型不同，其值将被转换为函数类型。）\n\n在第 8 章中，我们介绍了 void 函数定义的语法模板。现在我们更新该语法模板以涵盖\
  \ void 函数和有返回值的函数：\n\n![函数定义的语法模板。](img/9781284166033_CH09_505.jpg)\n\n描述\n\n如果\
  \ `DataType` 是单词 `void`，则该函数是 void 函数；否则，它是有返回值的函数。注意语法模板中的阴影部分，`DataType` 是可选的。如果你省略函数的数据类型，则假设数据类型为\
  \ `int`。我们提到这一点是因为你有时会遇到缺少 `DataType` 的程序。许多程序员认为这是糟糕的编程风格。\n\n有返回值的函数的参数列表与 void\
  \ 函数的形式相同：一组由逗号分隔的参数声明列表。此外，有返回值的函数的原型看起来和 void 函数的原型完全一样，只是它的开头是一个数据类型而不是 `void`。\n\
  \n还记得你朋友那个满是 bug 的程序吗？`LineCount` 函数使用引用参数来返回文件的行数。它应该是一个有返回值的函数，其中返回值为行数。该更改需要以下步骤：\n\
  \n1. 在函数 `LineCount` 的原型中将单词 `void` 替换为单词 `int`。\n2. 从参数列表中移除 `count`。\n3. 在函数定义中进行相同的更改。\n\
  4. 声明一个局部变量来计算行数。\n5. 返回行数变量的值。\n6. 从主程序中移除 `count` 的声明。\n7. 在输出语句中插入对 `LineCount`\
  \ 的调用。\n8. 修正文档。\n\n这是重写了 `LineCount` 的程序。更改的行已阴影标记。\n\n![读取文件并输出行号和每行字符数的程序。](img/9781284166033_CH09_506.jpg)\n\
  \n描述\n\n### 完整示例\n\n让我们来看另一个问题。假设我们正在编写一个程序，为学期中退学的学生计算按比例退还的学费。退还金额为学费乘以学期的剩余比例（剩余天数除以学期总天数）。用户希望输入学期开始和结束日期以及退学日期。\n\
  \n由于该学校的每个学期都在同一个日历年开始和结束，我们可以通过确定每个日期的天数并将结束天数减去起始天数来计算一段时间内的天数。天数是从年初开始计算的天数，1\
  \ 月 1 日为第 1 天。12 月 31 日是第 365 天，闰年则为第 366 天。例如，如果一个学期于 23/1/3 开始并于 23/5/17 结束，计算过程如下：\n\
  \n`23/1/3` 的天数是 3。\n`23/5/17` 的天数是 137。\n学期的长度为 `137 - 3 + 1 = 135`。\n我们将差值加 1，是因为我们将第一天也计入了该期间。\n\
  \n计算某个日期天数的算法由于闰年和不同长度的月份而变得复杂。让我们看看调用代码的外观，假设我们有一个名为 `Day` 的有返回值函数，它返回某个日期的天数：\n\
  \n![函数定义的语法模板。](img/9781284166033_CH09_505.jpg)\n\n\n\n返回值的模块的接口是非常直观的。我们只需要列出模块需要的内容和它必须返回的内容即可。因为返回值的模块只返回一个值，因此列表中只有一个标记为“Out”（输出）的项目：即返回值。列表中的其他所有内容都标记为“In”（输入），并且没有标记为“In/out”（输入/输出）的项目。\n\
  \n从返回值的模块返回多个值（通过修改调用者的参数）是一种副作用，因此应该避免这样做。如果你的接口设计要求返回多个值，那么你应该使用 `void` 函数，而不是返回值的函数。\n\
  \n一条经验法是：避免在返回值模块的参数列表中使用引用参数，而仅使用传值参数。让我们来看一个演示此规则重要性的函数。假设我们定义了以下函数：\n\n![Side\
  \ Effect 函数定义。](img/9781284166033_CH09_513a.jpg)\n\n描述\n\n该函数返回其输入值的平方，但在返回之前它还会增加调用者的参数。现在，假设我们使用以下语句调用该函数：\n\
  \n![一个语句。y 等于 x 加上 Side Effect(x)，分号。](img/9781284166033_CH09_513b.jpg)\n\n如果 `x`\
  \ 原本为 2，存储在 `y` 中的值是多少？答案取决于编译器生成代码来评估该表达式的顺序。如果编译后的代码先调用函数，那么答案是 7。如果它在准备将 `x`\
  \ 加到函数结果之前先访问 `x`，那么答案是 6。这种不确定性正是为什么你不应该在返回值的函数中使用引用参数的原因。一个产生不可预测结果的函数在良好的程序中没有立足之地。\n\
  \n该规则的一个例外是模块使用 I/O 流对象作为参数。记住，C++ 要求流对象必须作为引用参数传递。请记住，在函数内读取文件或写入文件实际上是一种副作用，应该在后置条件（postcondition）中明确记录。\n\
  \n在返回值的函数定义中仅使用传值参数还有另一个优势：你可以使用常量表达式作为参数。例如，我们可以使用字面量和其他表达式来调用 `IsTriangle` 函数：\n\
  \n![一个 if-else 语句。](img/9781284166033_CH09_513c.jpg)\n\n描述\n\n### 何时使用返回值的函数\n\n\
  没有正式的规定规定何时使用 `void` 函数与返回值的函数，但这里有一些指南：\n\n1. 如果模块必须返回多个值或修改调用者的任何参数，请不要使用返回值的函数。\n\
  2. 避免使用返回值的函数执行 I/O 操作。如果必须使用，请在后置条件中明确记录该副作用。\n3. 如果模块只返回一个值且该值是布尔值，那么返回值的函数是合适的。\n\
  4. 如果只返回一个值且该值被立即用于表达式，那么返回值的函数是合适的。\n5. 如果不确定，使用 `void` 函数。你可以通过添加一个额外的输出参数来携带计算结果，将任何返回值的函数重写为\
  \ `void` 函数。\n6. 如果 `void` 函数和返回值的函数均可以，请使用你觉得实现起来更熟悉的格式。\n\nC++ 引入返回值的函数是为了提供一种模拟数学函数概念的方法。C++\
  \ 标准库通过 `cmath` 头文件提供了一组常用的数学函数。这些函数的列表出现在附录 C。\n\n## 9.5 赋值、参数传递和函数值返回中的类型转换\n\n\
  通常情况下，值从一种类型到另一种类型的提升（promotion）不会导致信息丢失。将提升比比搬进一个更大的房子。你所有的家具都能放得下而且还有富余的空间。相比之下，值的降级（demotion，或窄化\
  \ narrowing）可能会丢失信息。降级就像搬进较小的房子——东西必须被扔掉。\n\n考虑赋值操作\n\n![v = e](img/9781284166033_CH09_514a.jpg)\n\
  \n其中 `v` 是一个变量，`e` 是一个表达式。关于 `v` 和 `e` 的数据类型有三种可能性：\n\n1. 如果 `v` 和 `e` 的类型相同，则不需要类型转换。\n\
  2. 如果 `v` 的类型比 `e` 的类型“高”，则 `e` 的值在存入 `v` 之前会被提升为 `v` 的类型。\n3. 如果 `v` 的类型比 `e` 的类型“低”，则\
  \ `e` 的值在存入 `v` 之前会被降级为 `v` 的类型。\n\n以下是降级如何丢失信息的示例：\n\n* 从较长的整数类型降级到较短的整数类型（例如从\
  \ `long` 到 `int`）会丢弃二进制数中最左侧（最高位）位。结果可能是一个完全不同的数字。\n* 从浮点类型降级到整数类型会导致小数部分的截断。结果在不同机器上有所不同，因为截断负数是一个未定义的结果。\n\
  * 从较长的浮点类型降级到较短的浮点类型（例如从 `double` 到 `float`）可能会导致数字丢失。\n\n我们对赋值中类型转换的描述也适用于参数传递和值的返回。例如，假设你机器上的\
  \ `INT_MAX` 为 32767，并且你有如下函数：\n\n![一个函数。bool Check(float temp).](img/9781284166033_CH09_515.jpg)\n\
  \n描述\n\n如果使用以下语句调用函数：\n\n![一个函数调用。Something(50000);](img/9781284166033_CH09_515a.jpg)\n\
  \n那么值 50000（因为大于 `INT_MAX`，隐含为 `long`）会被降级为较小的 `int` 值，因为 `int` 是返回值的类型。\n\n隐式转换的一个有趣的后果是，声明变量为无符号以防止你犯下错误：\n\
  \n![一个语句。unsigned Var = -5;](img/9781284166033_CH09_515c.jpg)\n\n编译器完全不会报错。它生成代码将\
  \ `int` 值转换为无符号 `int` 值。但如果你现在显示 `unsignedVar`，你会看到奇怪的正整数。正如我们之前提到的，最好避免在普通的数值计算中使用\
  \ `unsigned`。为了安全，尽可能避免隐式转换！\n\n### 测试与调试\n\n模块化设计的优势之一是，在为所有模块编写代码之前就可以开始测试。如果我们单独测试每个模块，就可以更有信心地将模块组合成一个完整的程序。在本节中，我们介绍一种单独测试模块的技术。\n\
  \n### 存桩（Stubs）与驱动程序（Drivers）\n\n假设你被给了一个模块的代码，你的工作是测试它。你如何单独测试一个模块？首先，它必须被某些东西调用（除非它是\
  \ `main`）。其次，它可能会调用其他你无法获取的模块。为了测试该模块，你必须填补这些缺失的链接。\n\n\n\n\n当一个模块包含对其他模块的调用时，我们可以编写称为\
  \ `stubs`（存根）的空函数来实现这些调用。存根通常包含一个输出语句，显示诸如“某某函数被调用了”的消息。尽管存根是空函数，但它允许我们确定该函数是否由\
  \ `main` 或另一个函数在正确的时间被调用。\n\n存根还可以用于显示传递给它的值集合；此类输出可以告诉我们被测模块是否提供了正确的信息。有时，存根会给它的引用参数分配新值，以模拟返回结果，从而为调用模块提供可以继续后续工作的数据。由于我们可以选择存根返回的值，因此我们对测试条件有更好的控制。\n\
  \n这里有一个存根，它通过返回任意名称来模拟 `Profile` 程序中的 `Name` 函数：\n\n![标记为 Name 的函数的存根。](img/9781284166033_CH09_527.jpg)\n\
  \n描述\n\n这个存根比它模拟的函数要简单，这是很常见的，因为我们使用存根是为了为被测模块提供一个可预测的环境。\n\n除了为模块内的每个调用提供存根外，你必须为模块本身提供一个空程序——即\
  \ `driver`（驱动程序）。驱动程序包含了执行调用所需的最少代码。\n\n通过用驱动程序和存根包围模块，你获得了对其执行条件的完全控制。这允许你测试不同的情况和组合，这些组合可能会暴露错误。你为模块编写一个测试计划，然后由驱动程序来实现该测试计划。\n\
  \n这里是 `Profile` 程序中 `EvaluateCholesterol` 函数的测试计划和驱动程序。该测试计划基于编写该函数时使用的解释准则。每个类别都取一次。案例研究后续练习\
  \ 1（Case Study Follow-Up Exercise 1）要求你判断此测试计划是否充分。\n\n### EvaluateCholesterol 函数的测试计划\n\
  \n![列出 Evaluate Cholesterol 函数测试计划的表格。](img/9781284166033_CH09_528.jpg)\n\n描述\n\n\
  ![用于测试 Evaluate Cholesterol 函数的程序。](img/9781284166033_CH09_529.jpg)\n\n描述\n\n![用于测试\
  \ Evaluate Cholesterol 函数的程序的延续。](img/9781284166033_CH09_530.jpg)\n\n描述\n\n驱动程序调用该函数八次，使得\
  \ `If` 语句中的点能够执行。以下是该代码的输入和输出：\n\n#### 输入\n\n![测试 Evaluate Cholesterol 函数程序的输入列表。](img/9781284166033_CH09_530a.jpg)\n\
  \n描述\n\n#### 输出\n\n![测试 Evaluate Cholesterol 函数程序的输出列表。](img/9781284166033_CH09_531.jpg)\n\
  \n描述\n\n存根和驱动程序是团队编程环境中的重要工具。通过这种方法，程序员开发整体设计以及模块之间的接口。然后，每个程序员负责设计并编写一个或多个模块，并使用驱动程序和存根来测试代码。当所有模块都完成编码和测试后，它们被组装成一个可以运行的程序。\n\
  \n为了团队编程的成功，显式定义所有模块接口并让编码后的模块这些遵守这些接口至关重要。显然，在团队编程的情况下，必须仔细避免引用全局变量，因为每个人都不可能知道团队中其他人是如何使用每个变量的\n\
  \n### 图形用户界面 (GUI)\n\n幸运的是，为了利用 GUI 组件来实现健康档案程序，我们需要所做的更改非常简单。特别是，我们只需要关注 `Name`、`EvaluateCholesterol`\
  \ 和 `EvaluateBMI` 函数的用户输入需求的变化。这些函数中的每一个之前都使用控制台从用户处获取名称、体重、身高等输入。此版本将使用我们在之前的章节中见过的\
  \ GUI 组件。特别是，我们将只使用两个 GUI 组件：`TextDialog` 和 `IntDialog`。\n\n我们将修改 `Name` 函数使用 `TextDialog`\
  \ 控件来获取用户的名、姓和中间名缩写。原始程序读取一个字符作为中间名缩写。此版本将使用字符串，以便我们可以使用现有的 `TextDialog` 控件。以下是原始代码：\n\
  \n![标记为 Name 的函数。](img/9781284166033_CH09_532.jpg)\n\n描述\n\n这是带有 GUI 添加内容的修改版本：\n\
  \n![标记为 Name 的函数。](img/9781284166033_CH09_532.jpg)\n\n描述\n\n![标记为 Name 的 GUI 版本延续。](img/9781284166033_CH09_533.jpg)\n\
  \n描述\n\n\n\n\n2. 仔细定义前置条件、后置条件和参数列表以消除副作用。仅在函数内部使用的变量应声明为局部变量。*不要*在你的程序中使用全局变量。（例外：全局引用\
  \ `cin` 和 `cout` 是允许的。）\n\n3. 如果编译器显示诸如 `UNDECLARED IDENTIFIER` 之类的信息，请检查标识符是否拼写错误（并确保它实际上已经声明）、该标识符是否在被引用之前已声明，以及该标识符的作用域是否包含了对它的引用。\n\
  \n4. 如果你打算使用一个与非局部名称相同的局部名称，请注意局部声明中的拼写错误将引发破坏性后果。C++ 编译器不会报错，但会导致对该局部名称的引用都转指向非局部名称。\n\
  \n5. 记住，同一个标识符不能同时用于函数的参数列表和最外层的局部声明中。\n\n6. 对于有值的函数，请确保函数头和原型以函数返回值的正确数据类型开头。\n\
  \n7. 对于有值的函数，不要忘记使用 `return` 语句：\n\n```\nreturn Expression;\n```\n\n确保表达式的类型是正确的，否则将发生隐式类型转换。\n\
  \n8. 记住，对有值的函数的调用是一个表达式的一部分，而对 void 函数的调用是一个独立的语句。（然而，C++ 弱化了这种区别，允许你像调用 void 函数一样调用有值的函数而忽略其返回值。在此要小心。）\n\
  \n9. 通常情况下，不要在有值的函数的参数列表中使用引用参数。但是，当 I/O 流对象作为参数传递时，必须使用引用参数。\n\n10. 必要时，使用系统的调试器（或使用调试输出语句）来确定函数何时被调用以及其执行是否正确。可以在调用函数之前显示参数的值（显示输入值），并在调用完成后立即显示（显示输出值）。你可能还想在函数内部显示局部变量的值，以指示每次被调用时发生了什么。\n\
