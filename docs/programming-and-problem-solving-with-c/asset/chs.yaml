  \ ADDITION`（无效指针相加）。目前，只需记住这样的信息可能指示一个没有包含变量的拼接表达式。\n11. 2.11 确保你的语句以分号结束（块结构在右大括号后没有分号）。\n\
  \n\n\n\n\nC++ 内置数据类型分为简单类型、结构类型和地址类型（参见图 3.1）。不要被图 3.1 中所示的数据类型的数量所困扰。我们的目的仅仅是让你对\
  \ C++ 中可用的类型有一个整体了解。本章重点关注整数类型和浮点类型。其他类型的详细信息将在后后部分介绍。首先我们查看整数类型（主要用于表示整数的类型），然后考虑浮点类型（用于表示包含小数点的实数）。\n\
  \n![C++ 中的数据类型。](img/9781284166033_CH03_FIGF01.jpg)\n\n图 3.1 C++ 数据类型\n\n描述\n\n\
  ## 3.2 数值数据类型\n\n你已经熟悉数学中的整数和实数概念，它们是无限数字集合。然而，在计算机中，由于内存被划分为固定大小的单元，相应的数据类型在取值范围上是有限的。\n\
  \n### 整数类型\n\n数据类型 `char`、`short`、`int` 和 `long` 被称为积分（或整数）类型，因为它们指的是整数值——即没有小数部分的整数数字。（我们将在第\
  \ 5 章中考虑剩余的整数类型 `bool`。）\n\n在 C++ 中，整数值最简单的形式是一个或多个数字的序列：\n\n![一些整数值。](img/9781284166033_CH03_PRE1.jpg)\n\
  \n描述\n\n不允许使用逗号。\n\n整数值前的负号使该整数变为负数：\n\n![一些负整数值。](img/9781284166033_CH03_PRE2.jpg)\n\
  \n描述\n\n在 C++ 中，这里有一个例外，因为该语言也有不允许负值的整数类型版本。例如，有一种类型名为 `unsigned int`。无符号整数值只能是正数或零。无符号类型主要用于特殊情况。我们在本书中很少使用\
  \ `unsigned`。\n\n数据类型 `char`、`short`、`int` 和 `long` 旨在表示不同大小的整数，从较小（位数较少）到较大（位数更多）。这些大小取决于机器；也就是说，它们可能随机器而异。下表显示了示例范围：\n\
  \n![列出 C++ 数据类型示例范围的表格。](img/9781284166033_CH03_UTAB97-1.jpg)\n\n描述\n\n在另一台机器上，`int`\
  \ 的大小可能与 `long` 的大小相同。通常情况下，内存单元中的字节越多，可以在那里存储的整数值就越大。在嵌入式计算机上（例如微波炉的控制器），`int`\
  \ 值的范围可能从 −32,768 到 +32,767。\n\n尽管我们在第 2 章中使用 `char` 类型来存储如 'A' 等字符数据，但 C++ 将 `char`\
  \ 分类为积分类型，因为它也允许 `char` 用于存储范围非常有限的整数值。\n\n在第 1 章的 `LeapYear` 程序中，标识符 `year` 的类型是\
  \ `int`。你几乎总是使用 `int` 处理整数值，但如果程序需要大于最大 int 值的值，有时必须使用 `long`。如果你的程序尝试计算大于机器最大值的值，结果就是整数溢出。某些机器在溢出时会显示错误信息，而另一些则不会。我们在后面的章节中详细讨论溢出。\n\
  \n关于 C++ 中整数值的一个警告：以零开头的字面量常量被视为八进制（基 8）而不是十进制（基 10）。因此，如果你写\n\n![一个八进制数。](img/9781284166033_CH03_PRE3.jpg)\n\
  \n描述\n\nC++ 编译器会将此视为十进制数字 25。如果你不熟悉八进制，不用担心为什么八进制的 31 等于十进制的 25。(1) 要重要的是，你不应该以零开头十进制整数常量（除非你只是想要数字\
  \ 0，它在两种进制中都是相同的）。在第 10 章中详细讨论浮点类型。\n\n### 浮点类型\n\n浮点类型（或浮动类型）用于表示实数。实数有整数部分和小数部分，正如整数有不同的大小（`char`、`short`、`int`），浮点类型也有（`float`、`double`、`long`）。\n\
  \n![浮点值。](img/9781284166033_CH03_PRE4.jpg)\n\n描述\n\n在 C++ 中，有一个例外，因为该语言也有不允许负值的整数类型版本。例如，有一种类型名为\
  \ `unsigned int`。无符号整数值只能是正数或零。无符号类型主要用于特殊情况。\n\n浮点值还可以带有指数，正如科学计数法。与其写 $3.5 \\\
  times 10^{12}$，我们写 `3.5E12`。`E` 表示 10 的幂。\n\n![带有指数的浮点值。](img/9781284166033_CH03_PRE5.jpg)\n\
  \n描述\n\n大多数程序不需要 `double` 和 `long double` 类型。`float` 类型通常提供六到七位精度，最大值约为 3.4E38。我们在本章末尾的案例中使用\
  \ `float` 表示金额和利率。下表显示了浮点类型的示例范围：\n\n![列出 C++ 浮点数据类型示例范围的表格。](img/9781284166033_CH03_UTAB99-1.jpg)\n\
  \n描述\n\n关于浮点数你还需要知道一点：计算机无法精确表示实数。由于精度有限，像三分之一这样的数字会被近似为 0.333333。如果你将三分之一相加三次，在数学上它等于\
  \ 1.0。但在计算机上你会得到 0.999999。大多数情况下，这种误差是预期之中的，而不是程序员的错误。\n\n## 3.3 数值类型的声明\n\n与 `char`\
  \ 和字符串类型一样，我们可以声明 `int` 和 `float` 类型的命名常量和变量。此类声明与之前的语法相同，只是字面量和数据类型的名称不同。\n\n###\
  \ 命名声明\n\n在命名常量声明的情况下，声明中的字面值是数值，而不是引号内的字符。这里是一些 `int` 和 `float` 类型值的示例常量声明。为了对比，还包含了\
