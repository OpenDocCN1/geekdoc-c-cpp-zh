  Description\n\n#### 命名类型和匿名类型\n\n我们看过的枚举类型 `Animals` 和 `Days` 是命名类型，因为它们的声明包含了名称。这些新类型的变量使用标识符\
  \ `Animals` 和 `Days` 分别声明。\n\nC++ 还允许在变量声明中直接引入新类型。与其使用声明\n\n![一组声明。](img/9781284166033_CH10_566a.jpg)\n\
  \nDescription\n\n我们可以直接写\n\n![在变量声明中直接引入新类型的两个示例。](img/9781284166033_CH10_566b.jpg)\n\
  \nDescription\n\n在变量声明中定义的新类型被称为**匿名类型**，因为它没有名称——也就是说，它没有关联的类型标识符。\n\n如果我们可以在变量声明中创建数据类型，为什么要费力单独声明？命名类型像命名常量一样，使程序更易读且更容易修改。此外，声明类型和声明该类型的变量是两个不同的概念；最好将它们分开。\n\
  \n我们现在给出一个完整的枚举类型定义语法模板。该模板显示类型名称是可选的（产生匿名类型），并且可以在声明中可选地包含变量列表。\n\n![枚举类型定义的语法模板。](img/9781284166033_CH10_567.jpg)\n\
  \n\n\n\nC++ 中结构化类型的一个示例是 `string` 类，它用于表示字符串。当你声明一个类型为 `string` 的变量 `myString` 时，`myString`\
  \ 并不仅仅代表一个原子数据值；相反，它代表字符集合。尽管如此，字符串中的每个组件都可以通过像 `myString.at(3)` 这样的表达式单独访问，该表达式访问的是位置\
  \ 3 处的 `char` 值。\n\n简单数据类型（无论是内置的还是用户定义的）都是结构化类型的基础。结构化类型收集了一组组件值，并通常对它们施加某种排列（参见图\
  \ 10.2）。访问结构化类型组件的方法取决于组件是如何排列的。\n\n图 10.3 显示了 C++ 中可用的结构化类型。此图是图 3.1 所示完整图表的一部分。\n\
  \n![C++ 中可用的原子和结构化数据类型的表示。](img/9781284166033_CH10_FIGF02.jpg)\n图 10.2 原子（简单）和结构化数据类型\n\
  \n描述\n\n![列出 C++ 中结构化数据类型的树图。](img/9781284166033_CH10_FIGF03.jpg)\n图 10.3 C++ 结构化类型\n\
  \n描述\n\n本章将讨论 `struct` 和 `union` 数据类型。数组将在第 11 章中介绍；类是第 12 章的主题。\n\n## 10.4 记录 (结构体)\n\
  \n在计算机科学中，`record`（记录）是一种异构结构化数据类型。通过*异构*，我们的意思是记录的各个组件可以是不同的数据类型。每个组件被称为记录的 `field`（字段），每个字段都被赋予一个\
  \ `field name`（字段名）。C++ 在记录方面使用它自己的术语。记录是一种名为 `struct` 的结构，记录的字段被称为 `struct` 的 `members`（成员），每个成员都有一个\
  \ `member name`（成员名）。^(1)\n\n在 C++ 中，记录数据类型通常按照以下语法声明：\n\n![Struct 声明的语法。变量中的单词已合并。第\
  \ 1 行：struct，类型名。第 2 行：左括号。第 3 行：缩进三次，成员列表。第 4 行：右括号，分号。](img/9781284166033_CH10_570.jpg)\n\
  \n其中 `TypeName` 是一个给数据类型命名的标识符，而 `MemberList` 定义为：\n\n![成员列表的语法。变量中的单词已合并。第 1 行：数据类型，成员名，分号。第\
  \ 2 行：数据类型，成员名，分号。第 3 行：点。第 4 行：点。第 5 行：点。](img/9781284166033_CH10_570a.jpg)\n\n\
  关键字 `struct` 是 *structure*（结构）的缩写。因为 *structure* 一词在计算机科学中有许多其他含义，我们将使用 `struct`\
  \ 或 `record` 以避免对我们所指的内容产生混淆。\n\n你可能会注意到成员列表的语法类似于一系列变量声明。请注意：`struct` 声明是在定义一种新的数据类型。类型声明不会分配任何内存。一旦定义了类型，我们就可以声明该类型的变量。每个这样的变量都会为其完整的成员集分配内存。让我们来看一个将邮寄地址部分组合的示例：\n\
  \n![将邮寄地址部分组合的代码](img/9781284166033_CH10_571.jpg)\n\n描述\n\n`MailingAddress` struct\
  \ 体有四个成员，分别代表街道地址、城市、州和邮政编码。注意，每个成员都被赋予了一个类型。此外，成员名在 `struct` 内部必须唯一，就像变量名在块内部必须唯一一样。\n\
  \n`MailingAddress` 类型的声明指定了该类型变量将具有的形式。当我们定义一个类型为 `MailingAddress` 的变量时，C++ 编译器会为其四个成员分配空间。如果我们定义另一个\
  \ `MailingAddress` 变量，它将单独为其其成员分配空间。\n\n注意，在这个示例和语法模板中，`struct` 声明都以分号结束。这似乎与不要在复合语句（块）的右括号后后加分号的规则相冲突。然而，`struct`\
  \ 中的成员列表并不是复合语句；让我们来看另一个例子。\n\n```cpp\nstruct MailingAddress {\n    string street;\n\
  \    string city;\n    string state;\n    int zipCode;\n};\n\nstruct Student {\n\
  \    string firstName;\n    string lastName;\n    float gpa;\n    int programGrade;\n\
  \    int quizGrade;\n    int finalExam;\n    int courseCode;\n};\n```\n\n`Student`\
  \ struct 有七个成员表示数据。`firstName` 和 `lastName` 是 `string` 类型。`gpa` 是 `float` 类型。`programGrade`、`quizGrade`、`finalExam`\
  \ 和 `courseCode` 是 `int` 类型。正如我们在 `MailingAddress` 示例中所看到的，在声明类型变量之前\n\n### 访问组件\n\
  \n要访问 `struct` 变量的单个成员，你需要给出变量名，后面跟一个点（.），然后是成员名。这个表达式被称为 `member selector`（成员选择器）。语法为\n\
