  ### deque 模板\n\n虽然 `stack` 和 `queue` 力求保持简单，但 `deque`（双端队列）的设计采取了相反的方法。通过 `deque`，我们从已经过的容器中获得了大量的特性。\n\
  \n例如，`deque` 复制了 `list` 的大部分操作：`back`、`begin`、`clear`、`empty`、`end`、`erase`、`front`、`insert`、`pop_back`、`pop_front`、`push_back`、`push_front`、`rbegin`、`rend`\
  \ 和 `size`，其含义基本相同。它像 `vector` 一样重载了 `[]` 和 `at` 来提供随机访问。由于是链式结构，它不需要支持 `capacity`\
  \ 或 `reserve` 操作。它也不直接支持 `merge`、`remove`、`reverse`、`sort` 或 `unique`，因为 STL 算法部分定义了同名的等效函数模板，所有这些模板都可以应用于\
  \ `deque`。该模板提供了与 `list` 相同的四种形式的构造函数：我们可以创建一个零元素的 `deque`、创建一个具有特定数量元素并初始化为默认值的\
  \ `deque`、创建一个从数组或另一个容器初始化的 `deque`，以及通过拷贝构造函数创建一个 `deque`。\n\n如果 `deque` 包含了 `list`\
  \ 和 `vector`，为什么我们不总是使用它呢？一如既往，这种能力的增加是以效率为代价的。`vector` 的底层数组实现通常比 `deque` 快得多。我们说“通常”是因为，如果一个大型\
  \ `vector` 必须频繁更改其 `capacity`，`deque` 的链式实现可能会优于它。`deque` 中的随机访问也没有 `vector` 那么高效。`deque`\
  \ 与 `list` 相比如何？由于 `list` 不需要支持随机访问，在端部以外点的删除和插入可以快得多。然而，当你确实需要在一个结构中同时结合 `vector`\
  \ 和 `list` 的特性时，库中有一个 `deque` 是非常有用的。\n\nSTL 中 `list` 和 `deque` 的命名实际上有些误导性，因为在抽象意义上，两者都可以充当列表或\
  \ deque。STL 的 `list` 是一个通用的双向链表，支持 deque 操作。STL 的 `deque` 也是一个双向链表，同时支持 deque 操作和随机访问索引。\n\
  \n由于我们已经在其他容器中见过了 `deque` 的特性，操作摘要表将是多余的。我们将在章节末尾的“问题案例研究”中演示 `deque` 的使用。\n\n##\
  \ 17.5 非线性结构\n\n在章节开头，我们注意到所见的所有结构化类型在本质上都是线性的。事实依然如此：Vectors、lists、stacks、queues、deques\
  \ 和 priority queues 都是一个接一个排列它们的元素。在本节中，我们开启了其他排列的大门。如果你对在线性限制内可以创建多少变体感到惊讶，那么当我们移除这一限制时，数量将呈指数级增长。在这里我们讨论一些非线性排列。\n\
  \n我们从具有分支的情况开始。\n\n### 二叉树\n\n我们可以将链表的概念扩展到包含多个前向字段的结构。这种结构被称为二叉树（图 17.11）。这种树由一个特定的指针引用，称为树的*根*。根有两个指针：指向其*左孩子*和其*右孩子*。每个孩子也有两个指针：指向其左孩子和其右孩子。一个节点的左右孩子被称为*兄弟*。\n\
  \n![一个具有 7 个节点的二叉树。](img/9781284166033_CH17_F17-11.jpg)\n\n**图 17.11 二叉树**\n\n描述\n\
  \n对于树中的任何节点，其左孩子是左子树的根。同样，右孩子是右子树的根。左右孩子均为 `NULL` 的节点被称为*叶子节点*。\n\n尽管图 17.11 显示了一个只有七个节点的二叉树，但树节点数量在理论上没有限制。如果你把这张图倒过来，就能看到为什么它被称为树。\n\
  \n二叉搜索树是二叉树的一种特殊类型，其额外属性是值按特定顺序排列。在二叉搜索树中，任何节点中的组件大于其左孩子及其任何孩子（左子树），小于其右孩子及其任何孩子（右子树）。该定义假设没有重复值。下面的树是二叉搜索树的一个示例。\n\
  \n![一个具有 12 个节点的二叉搜索树。](img/9781284166033_CH17_p1098-1.jpg)\n\n描述\n\n让我们在二叉搜索树中搜索数字\
  \ 50。\n\n\n\n\n\n![在一个包含 12 个节点的二叉搜索树中查找数字 50。](img/9781284166033_CH17_p1098-2.jpg)\n\
  \n描述\n\n现在让我们来查找 18，这是一个不存在的数字。\n\n![在一个包含 12 个节点的二叉搜索树中查找数字 18。](img/9781284166033_CH17_p1098-3.jpg)\n\
  \n描述\n\n19 的左孩子是 `NULL`，所以我们知道 18 不在树中。我们不仅知道 18 不在这里，如果我们想插入 18，我们也正处于正确的插入位置。\n\
  \n总结一下，我们将要查找的值与树中的项进行比较，如果值与项目不相同，则就选择相应的分支。当我们开始进入一个 `NULL` 分支时，我们就知道该值不在树中。正如二叉搜索的算法复杂度为\
  \ `O(log[2]*N*)`，在二叉搜索树中查找也是如此。\n\n如果我们想按顺序输出二叉搜索树中的所有值，可以如下方式进行遍历：\n\n### 树遍历\n\
  \n- 如果左孩子不为空，则遍历左子树。\n- 输出当前项。\n- 如果右孩子不为空，则遍历右子树。\n\n我们从树的根开始。如果它有左孩子，我们就移动到该节点并重复该过程。我们以同样的方式沿树的左侧向下移动，直到到达叶子节点并将其输出。然后我们返回到该叶子的父节点，在遍历其右子树之前将其输出。例如，假设给定了以下二叉搜索树：\n\
  \n![一个包含 7 个节点的二叉搜索树。](img/9781284166033_CH17_p1099-1.jpg)\n\n描述\n\n遍历从根节点 (36)\
  \ 开始，进入它的左孩子 (24)，然后进入 24 的左孩子 12。因为 12 是叶子节点，所以它被输出，我们返回到 24 并将其输出。接着我们遍历它的右子树，即叶子节点\
  \ 30。输出 30 后，我们返回 24。由于我们已经完成了这个子树，我们返回到 36 并将其输出。然后对右子树重复该过程，输出 42、48 和 60。\n\n\
  正如我们在第 18 章中所示，这种通过调用自己来处理问题较小部分的算法被称为`recursive`（递归）。在该章中，我们还将看到栈（stack）是跟踪树位置的自然结构选择。\n\
  \n这种特定形式的遍历（访问左子树，然后根节点，再访问右子树）被称为`中序遍历`（in-order traversal）。树还有另外两种常用的遍历模式。\n\n\
  #### 前序遍历\n- 访问根节点。\n- 访问左子树。\n- 访问右子树。\n\n#### 后序遍历\n- 访问左子树。\n- 访问右子树。\n- 访问根节点。\n\
  \n这些名称源于遍历顺序中访问根节点的位置。如果我们在访问子树之前访问它，它就是`前序遍历`。如果我们在访问子树之后访问它，它就是`后序遍历`。根据二叉树中存储的数据，每种遍历顺序都可能有特定的用途。\n\
  \n树并不限于二叉分支因子。如果我们定义一个节点具有三个链接字段，我们得到一个每个节点有三个分支的树。树也不局限于每个节点具有相同数量的分支。例如，我们可以构建一个表示家族谱的树，其中一个节点的链接数量取决于给定一组父母的孩子数量。为了存储可变数量链接，我们可能会使用\
  \ `list` 作为树节点中的一个字段。\n\n列表、栈、队列和树都具有这种特性：链接是单向流动的（从头到尾、从根到叶等等）。我们可以形成更复杂的结构，称为`图`（graphs），其中链接可以向任何方向流动。我们可能使用图来表示连接一组城市的道路，或连接一组计算机的网络。正如你所看到的，链式结构可以变得非常复杂。\n\
  \n正如我们能够用数组或动态结构实现列表一样，我们也可以用动态结构或数组实现栈、队列、树和图。重要的是，数据结构既有逻辑组织，又有实现结构。二者是不同的，每种选择取决于任何特定问题的需求。\n\
  \nSTL 并没有实际上提供在抽象意义上实现树的容器。然而，我们在 17.6 节中检查的 `set` 容器通常是用二叉树实现的。接下来我们看另一种在特定条件下可以提供快速搜索的逻辑结构。\n\
  \n### 哈希表\n\n我们的字母查找示例是使用哈希（的的完美场景，因为可能的值很少，且我们可以将它们作为索引。不幸的是，大多数数据并不那样理想。例如，如果我们的数据值是表示温度的实数，那么潜在值的数量是巨大的。C++\
  \ 不允许我们创建一个足够数组来将 `float` 值作为索引。\n\n尽管如此，温度的范围可能非常有限，例如华氏 90.0 到 110.0 度。如果我们只感兴趣十分分之一的精度，那么就只有\
  \ 201 个不同的值。我们可以开发一种方法，接收温度并返回一个 0 到 200 范围内的索引；然后我们可以使用哈希存储温度。这种方法被称为`哈希函数`（hash\
  \ function）。假设哈希函数的计算时间很短，使用哈希搜索仍然是非常快速的操作。\n\n之前的示例忽略了数据集中存在重复项的问题。此外，某些数据集的值分布是不均匀的。例如，如果你在对一组名字进行排序，你会发现以“A”、“M”或“S”开头的名字比以“Q”、“X”或“Z”开头的多得多（尽管这些频率随你所在的世界而变化）。因此，我们可能会尝试将多个值存储在数组的同一个位置，这种现象被称为`冲突`（collision）。\n\
  \n\n\n\n可以采取多种方法来处理冲突。例如，当我们尝试将一个值存储到一个已满的位置时，我们可以简单地增加索引，直到找到一个空位置为止。遗憾的是，这种策略往往会产生填充位置的聚集。在坏的情况下，找到一个空槽所需的访问次数可能与数组中的元素数量一样多。另一种方法被称为“重哈希”（rehashing），我们将哈函数的输出重新输入到函数（或另一个函数）中，以选择一个新的索引。\n\
  \n到目前为止，我们一直假设使用简单的线性数组实现，但哈希并不局限于这种结构。例如，我们可以使用链表数组。哈希函数随后可以索引到该数组，并将项添加到该位置的链表中。当给定的数组槽位发生每次冲突时，相关的列表就会简单地增长一个节点。如果哈希函数设计得当，列表将保持在较短范围内（冲突较少），因此搜索仍然只需要几次操作。图\
  \ 17.12 展示了这种结构，被称为链地址哈希表。\n\n![一个链地址哈希表。](img/9781284166033_CH17_FIGF17-12.jpg)\n\
  \n**图 17.12 链地址哈希表**\n\n描述\n\n哈希的效率取决于数组或表是否足够大以容纳数据集，并有足够的额外空间将冲突降到最低。有时这种条件是不切实的；对于许多其他问题，哈希是组织数据的一种非常有效的方法。例如，我们可以使用哈希表来实现一个具有快速插入、删除和访问能力的列表，类似于\
  \ STL 中的 `deque`。哈希表也是我们将在下一节中查看的另一种容器 `map` 的候选实现结构。\n\n开发一个良好的哈希函数可能需要大量的的数据分析。我们在这里的目标不是为了向你展示如何开发此类函数，而仅仅是让你领会哈希的优点和它的局限性。\n\
  \n## 17.6 关联容器\n\nSTL 将其容器分为三组。`vector`、`list` 和 `deque` 被称为序列容器。更简单的 `stack`、`queue`\
  \ 和 `priority_queue` 类型被称为容器适配器，因为它们实际上是构建在序列容器之上的，提供了更简单、更方便的接口。第三组包含了所谓的关联容器。\n\
  \n我们在关联容器中定位值不是通过它们的位置，而是通过它们的值。例如，假设你有一个结构体数组，每个结构体都包含一个名称和一个电话号码。你可以通过对数组进行搜索并将给定名称与每个位置存储的名称进行比较来通过名称访问号码；通过这种方法你可能会找到匹配项。现在，假设你只需要写\n\
  \n```\ncout << phoneArray[\"Sylva Jones”];\n```\n\n(images/9781284166033_CH17_p1102-1.jpg)\n\
  \n来查找号码；也就是说，假设你只需引用其关联值就能找到电话号码。\n\n计算机科学家将这种查找称为关联访问（access by association）、关联查找或内容可寻址访问。用于搜索的值称为键（key），这些值总共必须以允许两个键进行比较的方式进行排序。在许多情况下，键也必须是唯一的。关联查找是许多数据库处理的基础，并具有广泛的其他用途。\n\
  \nSTL 提供了五种不同的关联容器。这里我们只检查两种：`set` 和 `map`。\n\n### set 模板\n\nSTL `set` 模板的名称源于这样一个事实：像数学集合一样，它只存储唯一的值。如果你尝试插入一个已经存在于\
  \ set 中的值，set 将保持不变。不奇的是，STL 对 set 的实现远超数学概念。\n\n在内部，`set` 中的值是从小到大排序的，因此 STL 提供了使用带有\
  \ `begin` 和 `end` 的 `iterator`，或者带有 `rbegin` 和 `rend` 的 `reverse_iterator` 来遍历 set\
  \ 的能力，就像它是一个已排序的列表一样。（大多数实现使用二叉搜索树，如图 17.13 所示。）然而，这比遍历序列容器的效率要低。\n\n![用二叉搜索树实现的\
  \ set。](img/9781284166033_CH17_FIGF17-13.jpg)\n\n**图 17.13 使用二叉搜索树实现的 set**\n\n\
  描述\n\n`set` 擅长的是通过值查找元素。因此，`find` 操作被构建在 set 接口中，而不是被视为一个单独的算法。在 `find` 提供指向 set\
  \ 中值的 `iterator` 后，你可以使用它来 `erase` 元素或检索相邻的元素。这里是一些常用 `set` 操作的表格。\n\n![一些常用 set\
  \ 操作的表格。](img/9781284166033_CH17_p1103-1.jpg)\n\n描述\n\n除了表格中的类方法，17.4 中描述的三个算法也适用于\
  \ `set`：`set_difference`、`set_intersection` 和 `set_union`。记住，使用这些算法必须包含 `<algorithm>`，并且它们是像函数一样被调用的，而不是对象方法。本节后面的示例演示了\
  \ `set_difference` 的用法。所有的 `set` 算法都使用相同的参数排列，所有参数都是迭代器：\n\n![一个语句。](img/9781284166033_CH17_p1104-1.jpg)\n\
  \n描述\n\n前两个迭代器指定第一个 `set` 中的范围，接下来的两个指定第二个 `set` 中的范围，最后一个指向结果 `set` 应该放置的开头。\n\n\
  奇怪的是，`set` 算法并没有设计为直接作为 `set` 类的值输出其结果。相反，它们被编写成更通用地适用于其他容器，因此它们的输出无法直接进入 `set`。（例如，你可以将结果直接写入\
  \ `vector`。）\n\n算法 `<iterator>` 包中的另一个函数模板 `inserter` 必须使用，以强制 `set` 算法以允许 `set`\
  \ 将输出插入自身的方式生成输出。`inserter` 取两个参数：目标容器，随后是一个指向插入发生位置的迭代器。因为 `set` 会选择自己的插入点，所以第二个值是什么并不重要，只要它指向\
  \ set 中的某个地方即可。例如，我们可以使用 `begin` 或 `end`。在考虑了所有因素后，`set_difference` 的调用看起来如下：\n\n\
  ```\nset_difference(s1.begin(), s1.end(), s2.begin(), s2.end(), inserter(s3, s3.begin()));\n\
  ```\n\n\n\n在本示例中，`set3` 包含了 `set1` 中所有在 `set2` 中不存在的元素。我们以空函数调的形式展示了这种行为。实际上，每个\
  \ `set` 算法都会返回一个指向结果末尾的迭代器。由于我们在示例中不需要这个结果，因此我们简单地丢弃了返回值。\n\n这里是一个使用 `set` 的示例程序：\n\
  \n![演示各种 set 方法的程序。](img/9781284166033_CH17_p1105-2.jpg)\n\n描述\n\n![演示各种 set 方法程序的延续。](img/9781284166033_CH17_p1106-1.jpg)\n\
  \n描述\n\n这里是程序的示例运行：\n\n![程序的示例运行。](img/9781284166033_CH17_p1106-2.jpg)\n\n描述\n\n\
  ### map 模板\n\nSTL `map` 类型类似于 `set`，但有一个主要区别：`set` 只存储键值（key values），而 `map` 则为每个键关联了第二个值。因此，`map`\
  \ 是关联容器的标准示例。它允许我们实现在本节开头描述的那种名称索引数组，如图 17.14\n\n**图 17.14 map 的概念插图**\n\n描述\n\n\
  `map` 的操作与 `set` 几乎相同。它的元素是有排序的，并支持 `begin`、`clear`、`count`、`empty`、`end`、`erase`、`find`、`insert`、`lower_bound`、`rbegin`、`rend`、`size`\
  \ 和 `upper_bound`。然而，正如你所预料的，`insert` 操作并不接受一个简单的值作为类型 `pair` 参数。\n\n这里是一个用于电话录的\
  \ `map` 示例定义，以及一个向其中插入条目的 `insert` 操作：\n\n![2 条语句。](img/9781284166033_CH17_p1107-1.jpg)\n\
  \n描述\n\n以下语句\n\n![4 条语句。](img/9781284166033_CH17_p1107-2.jpg)\n\n描述\n\n导致 `find`\
  \ 返回一个指向 `phonedirectory` 中此 `pair` 元素的迭代器。在对迭代器解引用后，我们可以使用 `first` 和 `second` 输出\
  \ `pair` 的两个部分。最后一条语句删除了该元素。\n\n这些都很好，但代码写起来有点繁琐。如果我们能直接使用数组语法不是不是更好吗？这是 `set` 和\
  \ `map` 之间的另一个大区别。在 `map` 中，`[]` 操作符被重载了，允许我们按如下方式编写前面的代码段：\n\n![5 条语句。](img/9781284166033_CH17_p1107-3.jpg)\n\
  \n描述\n\n正如我们在接下来的案例中看到的，`map` 还可以用于将字符串转换为 `enum` 值。\n\n### 图形用户界面 (GUI)\n\n上一节的应用程序旨在演示在扑牌背景下使用\
  \ STL。遗憾的是，界面完全是基于控制台。如果用户能以图形方式看到卡牌不是不是更好吗？在本节中，我们将构建一个应用程序，向用户展示牌组的表格，并允许用户点击表格中的卡牌以视觉方式查看对应的卡牌。应用程序还将包含一个重洗牌组的按钮。这就是\
  \ GUI 最终的样式：\n\n![一个 GUI 的截图。](img/9781284166033_CH17_p1123-2.jpg)\n\n描述\n\n首先，我们需要准确确定此\
  \ GUI 所需的精确控件（widgets）。到目前为止，你应该预料到使用 `QTableWidget` 作为表格，并使用 `QPushButton` 作为洗牌按钮。为了显示图像，我们实际上可以使用熟悉的\
