  \n描述\n\n## 12.7 组合\n\n类通常表现为三种关系之一：独立、通过继承相关、或者通过组合相关。换句话说，一个类包含另一个类。C++ 没有特殊的组合语言；你只需要在另一个类中声明一个对象。\n\
  \n### Entry 类设计\n\n你正在开发一个表示预约表的程序。每个 `Entry` 对象将有一个 `Name` ADT 和 `TimeOfDay` ADT。作为准备，你构建了一个包含两个字段的\
  \ `Entry`：一个 `Name` 对象和一个 `TimeOfDay` 对象。你知道 `Name` 类有两个构造函数：一个接收名字的部分作为参数，另一个将字段设置为空。`TimeOfDay`\
  \ 类也是如此。因此，我们应该为 `Entry` 类准备一个默认构造函数，它调用 `Name` 和 `TimeOfDay` 的默认构造函数，以及一个参数构造函数，它将其参数传递给\
  \ `Name` 和 `Time` 的构造函数。\n\n我们现在有足够的信息编写规范了。\n\n![一段程序段。](img/9781284166033_CH12_P725-1.jpg)\n\
  \n描述\n\n![一段程序段。](img/9781284166033_CH12_P726-1.jpg)\n\n实现默认构造函数只需要调用 `Name` 和 `TimeOfDay`\
  \ 对象的默认构造函数。在 C++ 中，默认构造函数会自动调用（尽管我们在之前的示例中显式地显示了它们）。因此，我们也可以让 `Entry` 的默认构造函数为空，我们在这里这样做是为了让你看到这种编码风格的示例。\n\
  \n参数构造函数必须将其参数传递给 `Name` 和 `Time` 构造函数。为了做到这一点，我们使用 *构造函数初始化器*。这种 C++ 允许你传递构造在另一个类中声明的对象所需的信息。其语法是包含类的构造函数头部，后面跟着一个冒号\
  \ `:`，然后是成员对象的名称，最后是成员对象类参数构造函数对应的参数列表。如果存在多个构造函数初始化器，则用逗号分隔。\n\n![图像](img/9781284166033_CH12_P726-2.jpg)\n\
  \n描述\n\n\n\n\n该函数的体是空的。系统负责构造 `Name` 和 `TimeOfDay` 对象。这里是 `Entry` 类的实现文件：\n\n![程序代码段。](img/9781284166033_CH12_P726-3.jpg)\n\
  \n描述\n\n![程序代码段的延续。](img/9781284166033_CH12_P727-1.jpg)\n\n描述\n\n这是一个简单的驱动程序，用于创建并输出若干几个\
  \ `Entry` 对象：\n\n![程序代码段。](img/9781284166033_CH12_P727-2.jpg)\n\n当我们尝试运行这个简单的程序时，遇到了以下错误：\n\
  \n![图像](img/9781284166033_CH12_P727-3.jpg)\n\n描述\n\n这为什么会呢？`RelationType.h` 文件不是只有一个副本吗？是的，但它同时被\
  \ `TimeOfDay` 和 `Name` 包含了。结果是预处理器认为 `RelationType` 被定义了多次。这种情况经常发生，因此我们必须告诉预处理器，只有在之前没有包含\
  \ `RelationType.h` 的情况下才包含该文件。解决这个问题的广泛使用的方案是这样编写 `RelationType.h` 的：\n\n![4 条语句。](img/9781284166033_CH12_P727-4.jpg)\n\
  \n描述\n\n以 `#` 开头的行是预处理器的指令。`RELATION`（或任何你想使用的标识符）是一个预处理器标识符，而不是 C++ 程序的标识符。实际上，这些指令表示：\n\
  \n如果预处理器标识符 `RELATION` 尚未被定义，那么\n\n1. 将 `RELATION` 定义为预处理器已知的标识符，并且\n2. 让 `enum\
  \ RelationType` 的声明传递给编译器。\n\n如果后续遇到 `#include \"RelationType.h\"`，则测试 `#ifndef\
  \ RELATION` 将失败。该声明将不会再次传递给编译器。\n\n多重定义错误现在已经解决了，但还有另一个错误：\n\n![错误语句。](img/9781284166033_CH12_P728-1.jpg)\n\
  \n描述\n\n这条语句可能什么问题？我们只是用一个字符串、一个整数值、一个冒号和另一个整数值创建了一个字符串。自从第 2 章以来，我们一直在使用拼接来构建字符串。数字被转换为字符串以便输出。这条语句有什么不同之处？C++\
  \ 会自动将整数转换为字符串以便输出，但在输出之外，没有任何地方存在整数到字符串的类型转换。\n\n要创建一个包含整数的字符串，我们可以将其写入文件，然后将其作为字符串读回来。这种方法可行，但速度会非常慢。（文件访问存可能比内存访问慢一百万倍）。幸运的是，有一个名为\
  \ `ostringstream` 的类，它允许我们像写入文件一样将值写入字符串中。因为数据保留在内存中，所以转换非常快。\n\n我们声明一个 `ostringstream`\
  \ 类的对象，并使用插入运算符 `<<` 将整数发送到对象。要将它们作为字符串获取，我们使用 `ostringstream` 类的成员函数 `str`。这里是\
  \ `GetTimeStr` 的修正版本，它使用了 `ostringstream` 类的对象，随后是驱动程序的输出：\n\n![程序代码段。](img/9781284166033_CH12_P728-2.jpg)\n\
  \n一旦插入此函数，驱动程序就会产生此输出：\n\n![程序代码段的输出。第一行：Entry 1，冒号，Sally Smith，12 冒号 20 冒号 0 0。第二行：Entry\
  \ 2，冒号，Mary Jones，10 冒号 30 冒号 0 0。](img/9781284166033_CH12_P729-1.jpg)\n\n描述\n\n\
  ## 12.8 UML 图\n\n仅仅通过阅读书面文档来理解应用程序的操作可能是困难的。当许多类在相互作用时，跟踪它们的关系涉及到构建一个脑海中的图像。很快，我们开始画图以保持一切井井然。也许我们使用方框来表示类，使用它们之间的线表示协作（类调用其他类的方法）。在方框内部，我们对类进行标记。最终，我们得到了一个捕捉了结构信息的图。\n\
  \n### 类图绘制\n\n类在 UML 中由一个分为三个部分的方框表示。顶部是类的名称，中间部分列出属性，底部部分列出职责（方法）。\n\n![类的名称](img/9781284166033_CH12_P730-1.jpg)\n\
  \n描述\n\n如你所见，图列出了属性及其类型。属性前面的负号表示 `private`。UML 使用 `+` 表示 `public`。你可以从加号看出 `TimeOfDay`\
  \ 的函数都是 `public` 的。\n\n### 类组合绘制\n\n当一个类包含另一个类的实例时（例如 `Entry` 类包含 `Name` 类），我们在包含类的旁线末端画一个实心菱形。\n\
  \n![显示两个类之间组合关系的 UML 图](img/9781284166033_CH12_P730-2.jpg)\n\n描述\n\n这就是 UML 文档化组合的方式。带有实心菱形的类包含（除其他之外）箭头另一端类的实例。注意实例\
  \ `name` 的名称在箭头旁边。\n\n## 12.9 图形用户界面 (GUI)\n\n与前一章类似，将此程序重构为使用图形界面涉及替换获取文件名的控制台\
  \ I/O。事实上，它们非常相似，以至于我们只需要显示必要的代码更改，这些更改你现在应该已经熟悉了。当然，我们需要包含对话框组件的头文件：\n\n![头文件。Hash\
  \ include，双引号、对话框、点、h、双引号。](img/9781284166033_CH12_P737-1.jpg)\n\n描述\n\n然后我们将对 `cout`\
  \ 和 `cin` 的替换为对 `FileDialog` 和 `NewFileDialog` 组件的调用。\n\n![部分程序代码。](img/9781284166033_CH12_P737-2.jpg)\n\
  \n描述\n\n当我们运行 GUI 版本时，这两个文件对话框看起来像这样：\n\n\n\n\n![一个列出名为 builds 的文件夹内容的 GUI 组件列表](img/9781284166033_CH12_P737-3.jpg)\n\
  \n描述\n\n![一个标记为“选择输出文件的名称”的窗口](img/9781284166033_CH12_P738-1.jpg)\n\n描述\n\n我们省略了完整的\
  \ GUI 程序列表，因为它与上面显示的代码更改外是完全相同的。\n\n### 测试与调试\n\n对 C++ 类进行测试和调试等同于对类的每个成员函数进行测试和调试。你到目前为止学的所有技术——算法走演、代码走演、手工跟踪、测试驱动程序、前置和后置条件的验证、系统调试器、`assert`\
  \ 函数以及调试输出——都可能派上用场。\n\n考虑我们如何测试本章的 `TimeOfDay` 类。这里是类的声明，通过省略函数的前置和后置条件进行了缩写：\n\
  \n![一段程序代码](img/9781284166033_CH12_P738-2.jpg)\n\n描述\n\n![程序代码的延续](img/9781284166033_CH12_P739-1.jpg)\n\
  \n描述\n\n为了完全测试该类，我们必须测试每个成员函数。让我们逐步完成其中一个函数的测试过程：`Increment` 函数。\n\n在我们实现 `Increment`\
  \ 函数之前，我们从一个伪代码算法开始，执行了算法走演，并将伪代码翻译成以下 C++ 函数：\n\n![一个代码片段](img/9781284166033_CH12_P739-2.jpg)\n\
  \n描述\n\n现在我们执行代码走演，验证 C++ 代码是否忠实地匹配伪代码算法。在这一点（或更早的算法走演期间），我们进行手工跟踪以确认逻辑是正确的。\n\n\
  对于手工跟踪，我们应该选择能够确保代码覆盖率的 `hours`、`minutes` 和 `seconds` 取值。为了执行控制流中的每条路径，我们需要出现以下条件的情况：\n\
  \n1. 第一个 If 条件为假。\n2. 第一个 If 条件为真，第二个为假。\n3. 第一个 If 条件为真，第二个为真，第三个为假。\n4. 第一个 If\
  \ 条件为真，第二个为真，第三个为真。\n\n下表显示了对应这四种情况的 `hours`、`minutes` 和 `seconds` 的值。对于每种情况，我们还写下了执行算法后希望变量的预期值。\n\
  \n![表格有 3 列，标记为“情况”、“初始值”和“预期结果”。初始值和预期结果进一步分为 3 列，每列分别标记为“小时”、“分钟”和“秒”。](img/9781284166033_CH12_P740-1.jpg)\n\
  \n描述\n\n使用每种情况的初始值对代码进行手工跟踪，确认算法产生了预结果。\n\n最后，我们为 `Increment` 函数编写了一个测试驱动程序，以确保我们对算法逻辑的理解与计算机是一致的！这里有一个可能的测试驱动程序：\n\
  \n![程序段](img/9781284166033_CH12_P740-2.jpg)\n\n描述\n\n对于输入数据，我们提供了之前讨论的至少四个测试用例。程序的输出应该与预期结果匹配——事实如此。注意，由于我们对检查来自观察方法的实际值感兴趣，我们没有让驱动程序应用输出格式，以确保当分钟和秒的值小于\
  \ 10 时显示两位数字。\n\n![一组输入数据](img/9781284166033_CH12_P741-1.jpg)\n\n现在我们已经测试了 `Increment`\
  \ 函数，可以将相同的步骤应用于剩余的成员函数。我们可以为每个函数创建一个单独的测试驱动程序，也可以编写一个测试所有函数的驱动程序。只写一个驱动程序的缺点是，设计输入值的组合以同时测试多个函数可能会变得复杂。\n\
  \n在离开类测试的话题之前，我们必须强调一个重要的点：即使类已经经过了彻底测试，仍然可能出现错误。让我们来看使用 `TimeOfDay`类的两个例子。第一个例子是\n\
  \n![一个语句](img/9781284166033_CH12_P741-2.jpg)\n\n描述\n\n程序员想要让 `time1` 为周三 11:00:00，`time2`\
  \ 为周四 1:20:00。（测试结果是 `AFTER`，而不是程序员预期的 `BEFORE`。）`ComparedTo` 的隐式前置条件要求时间在同一天，而不是不同的日期。这个隐式前置条件应该是显式化的。\n\
  \n\n\n基于控制台的程序会提示用户一天的时间，并在小时输入为 0 时终止。你可能会认为，当 GUI 组件将输入限制为有效值时，这样做也消除了使用无效值作为哨兵值（sentinel）来结束循环的可能性。因为我们仍然需要选择运行另一个测试或停止的功能，新版本需要一个组件用于输入一天的时间，另一个独立的组件用于继续或退出程序。消灭对哨兵值的使用，并按范围和类型限制输入值，需要一个更复杂的界面。最后，我们需要一个组件来显示我们输入的时间，以及调用\
  \ `TimeOfDay.Increment()` 方法的结果，以便我们可以验证它是否按设计工作。\n\n当我们继续对图形应用程序的探索时，我们将开始暴露 GUI\
  \ 框架的一部分，这些使我们能够创建更复杂的界面。和之前一样，我们包含了 `YesNoDialog` 和 `OutputDialog` 组件所需的头文件，然后包含一个新的头文件，该文件对图形应用程序的初始化和退出提供了更细粒的控制：\n\
  \n![两个头文件。](img/9781284166033_CH12_P742-1.jpg)\n\n`QApplication` 对象代表一个图形应用程序。它的主要目标是处理与图形组件交互时发生的事件。例如，点击按钮是一个*事件*（event），可能会导致执行某些*动作*（action），例如增加一天的时间。在我们之前的\
  \ GUI 中，这些是隐藏起来的，因为我们使用了具有预定义事件和动作的预构建组件。在本章中，我们开始探索用户定义事件和动作的基础，并在随后的章节中添加更多细节。\n\
  \n我们还包含了指定 `TimeOfDay` 类的头文件：\n\n![语句。第 1 行，# include，双引号，Time of Day 点点 h，双引号。](img/9781284166033_CH12_P742-2.jpg)\n\
  \n应用程序的主函数将从创建 `QApplication` 对象开始：\n\n![语句。Q Application，a p p，左括号，a r g c，逗号，a\
  \ r g v，右括号，分号。](img/9781284166033_CH12_P743-1.jpg)\n\n`QApplication` 构造函数的参数只是传递到\
  \ `main` 函数的参数。到目前为止，我们声明 `main` 时使用的是空参数列表。但 C++ 允许用户在启动程序时输入额外信息，这些信息通过一组参数传递到\
  \ `main`（我们尚未需要使用它）。因为 GUI 工具设计为与此类程序配合，它们假设 `main` 的头部采用那种形式。因此，我们将在 GUI 程序中采用该语法，尽管我们将只是忽略实际传递作为参数的任何内容。我们只需要做这个更改就可以让我们的应用程序准备好定义并处理我们将添加到\
  \ GUI 应用程序中的新形式的用户交互了。\n\n首先，我们使用 `YesNoDialog` 询问用户是否想运行一天的时间测试：\n\n![语句。Yes No\
  \ Dialog，run Test Dialog，左括号，双引号，Run a Time Of Day test，问号，双引号，右括号，分号。](img/9781284166033_CH12_P743-2.jpg)\n\
  \n描述\n\n如果你还记得，`YesNoDialog` 组件有一个 `display()` 方法，它返回一个布尔值：如果用户点击“是”，则返回 *true*，如果用户点击“否”，则返回\
  \ *false*。该组件取代了使用哨兵值来继续或终止测试的方法。现在，我们不是在小时被设置为 0 时终止，而是在 `runTestDialog` 对象的 `display()`\
  \ 方法返回 *false* 时终止。while 循环的骨架如下：\n\n![一个 while 循环。](img/9781284166033_CH12_P743-3.jpg)\n\
  \n描述\n\n当我们运行这段代码时，GUI 看起来如下（暂时忽略循环体）：\n\n![一个对话框。](img/9781284166033_CH12_P743-4.jpg)\n\
  \n描述\n\n在 while 循环体中，我们引入了一个名为 `TimeOfDayWindow` 的自定义组件，用于输入小时、分、秒，然后可以使用它来构建一个新的\
  \ `TimeOfDay` 对象。我们将在后面的章节中再介绍自定义组件的内部实现。幸运的是，该组件的标准形式已经实现了我们的需求，无需自定义。以下是声明并显示此组件的代码：\n\
  \n![两个语句。](img/9781284166033_CH12_P743-5.jpg)\n\n描述\n\n当调用 `display()` 方法时，这个 GUI\
  \ 组件看起来如下：\n\n![一个对话框。](img/9781284166033_CH12_P743-4.jpg)\n\n\n\n3. 关于分号，类成员函数的声明和定义与任何\
  \ C++ 函数的处理相同。位于类声明中的成员函数原型以分号结尾。函数头部——即函数定义中位于函数体之前的部分——不以分号结尾。\n\n4. 在实现类成员函数时，不要忘记在函数名前加上类名和作用域解析运算符\
