  \ |\n| Function return value: | 取决于系统的 `int` 值 |\n| Note: | 程序员经常忽略函数的返回值，使用 void\
  \ 函数调用的语法而非返回值的函数调用的语法。 |\n\n### C.8 头文件 `cstring`\n\n`cstring` 头文件（不要与名为 `string`\
  \ 的头文件混淆）支持对 C 字符串（空结尾的 `char` 数组）的操作。\n\n| `strcat(toStr, fromStr)` |\n| Arguments:\
  \ | C 字符串（空结尾的 `char` 数组）`toStr` 和 `fromStr`，其中 `toStr` 必须足够大以容纳结果 |\n| Effect:\
  \ | `fromStr` 包括空字符 `'\\0'` 被拼接到 `toStr` 的末尾。 |\n| Function return value: | `toStr`\
  \ 的地址 |\n| Note: | 程序员经常忽略函数的返回值，使用 void 函数调用的语法而非返回值的函数调用的语法。 |\n\n| `strcmp(str1,\
  \ str2)` |\n| Arguments: | C 字符串（空结尾的 `char` 数组）`str1` 和 `str2` |\n| Function return\
  \ value: | 若字典序上 `str1 < str2`，返回 `int` 值 < 0；若字典序上 `str1 = str2`，返回 `int` 值 0；若字典序上\
  \ `str1 > str2`，返回 `int` 值 > 0 |\n\n| `strcpy(toStr, fromStr)` |\n| Arguments: |\
  \ `toStr` 是 `char` 数组且 `fromStr` 是 C 字符串（空结尾的 `char` 数组），`toStr` 必须足够大以容纳结果。 |\n\
  | Effect: | `fromStr` 包括空字符 `'\\0'` 被复制到 `toStr`，覆盖原有内容。 |\n| Function return value:\
  \ | `toStr` 的地址 |\n| Note: | 程序员经常忽略函数的返回值，使用 void 函数调用的语法而非返回值的函数调用的语法。 |\n\n|\
  \ `strlen(str)` |\n| Argument: | 一个 C 字符串（空结尾的 `char` 数组）`str` |\n| Function return\
  \ value: | ≥ 0 的 `int` 值，表示 `str` 的长度（不包括 `'\\0'`） |\n\n### C.9 头文件 `string`\n\n\
  此头文件提供了一个由程序员定义的名为 `string` 的数据类型（具体为一个类）。与 `string` 类型相关的是数据类型 `string::size_type`\
  \ 和命名常量 `string::npos`，其定义如下：\n\n| `string::size_type` | 与字符串中字符数量相关的无符号整数类型 |\n\
  | `string::npos` | 类型 `string::size_type` 的最大值 |\n\n有几十个与 `string` 类型相关的函数。以下是其中最重要的几个。在描述中，假设\
  \ `s` 是一个类型为 `string` 的变量（对象）。\n\n| `s.c_str()` |\n| Arguments: | 无 |\n| Function\
  \ return value: | 与 `s` 中存储的字符对应的 C 字符串（空结尾的 `char` 数组）的地址 |\n\n| `s.find(arg)`\
  \ |\n| Argument: | `string` 或 `char` 类型的表达式，或一个 C 字符串（如字面量字符串） |\n| Function return\
  \ value: | `string::size_type` 类型的值，给出 `arg` 在 `s` 中找到的起始位置。如果未找到 `arg`，返回 `string::npos`。\
  \ |\n| Note: | 字符串内字符的位置从 0 开始编号。 |\n\n| `getline(inStream, s)` |\n| Arguments:\
  \ | 一个输入流 `inStream`（`istream` 类型）和一个 `string` 对象 `s` |\n| Effect: | 从 `inStream`\
  \ 读取字符并存入 `s`，直到遇到换行符。（换行符被消耗但不存入 `s`。） |\n| Function return value: | 虽然函数返回一个值（我们不讨论），但通常像调用\
  \ void 函数一样调用它。 |\n\n| `s.length()` |\n| Arguments: | 无 |\n| Function return value:\
  \ | `string::size_type` 类型的值，给出字符串中的字符数量 |\n\n| `s.size()` |\n| Arguments: | 无 |\n\
  | Function return value: | 同 `s.length()` |\n\n| `s.substr(pos, len)` |\n| Arguments:\
  \ | 两个无符号 `pos` 和 `len`，表示位置和长度。`pos` 的值必须小于 `s.length()`。 |\n| Function return\
  \ value: | 一个临时 `string` 对象，包含从 `s` 的位置 `pos` 开始最多 `len` 个字符。如果 `len` 过大，则表示到字符串的末尾。\
  \ |\n| Note: | 字符串内字符的位置从 0 开始编号。 |\n\n### C.10 头文件 `sstream`\n\n此头文件提供了各种派自 `iostream`\
  \ 的类，使用户对字符串进行流操作。在本文中，我们只使用 `ostringstream` 类，它使能够将数值类型转换为格式化的字符串值。我们可以将插入运算符 (`<<`)\
  \ 应用于 `ostringstream` 对象以在其追加值，然后使用 `str` 成员函数以字符串形式读取其内容。在后续，`oss` 是一个 `ostringstream`\
  \ 对象。\n\n| `ostringstream()` |\n| Argument: | 无 |\n| Return value: | 空 `ostringstream`\
  \ 对象 |\n\n| `ostringstream(arg)` |\n| Argument: | 字符串 |\n| Return value: | 初始化为参数字符串的\
  \ `ostringstream` 对象 |\n\n| `oss << arg` |\n| Left argument: | `ostringstream` 对象\
  \ |\n| Right argument: | 可以转换为字符串的表达式，包括输出操作符 |\n| Return value: | `ostringstream`\
  \ 对象 |\n| Evaluated: | 从左到右 |\n\n| `oss.str()` |\n| Argument: | 无 |\n| Return value:\
  \ |  `oss` 所有内容的字符串 |\n\n| `oss.str(arg)` |\n| Argument: | 字符串 |\n| Effect: | 将参数的值赋值\
  \ `oss`。使用空字符串作为参数实际上是将 `ostringstream` 对象的内容置为空。 |\n\n\n\n\n\nQt Creator 4.15.1\
