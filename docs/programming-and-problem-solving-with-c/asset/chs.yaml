  \n## 2.4 程序的输入、修正与执行\n\n在本节中，我们将通览介绍程序的输入过程。你应该查阅你特定计算机的手手册来了解细节。\n\n### 输入程序\n\n\
  输入程序的第一步是告诉计算机运行一个开发环境，其中包含代码编辑器。代码编辑器允许你创建和修改程序的代码，这些代码存储在文件中。\n\n编辑器有许多不同的类型，每种都有不同的功能，我们无法在这里描述所有的它们。但我们可以描述它们的一些通用特征。\n\
  \n代码编辑器非常像文字处理器。它允许你在窗口中输入，并在文件中移动以进行更改。在大多数开发环境中，代码编辑器还会对 C++ 语法的不同部分进行颜色标记，以便更容易区分关键字、变量、注释等。它还会自动对代码行进行缩进。某些代码编辑器会在输入时检查语法，标记代码中可能无法编译的部分。\n\
  \n在许多开发环境中，编译器会自动使用代码编辑器显示它检测到代码中错误的地方。然而，请注意，编译器有时检测到的错误位置并非错误实际发生的地方。例如，编译器会指向第一次使用未声明的变量名的地方，而该错误的根源可能只是漏掉了一个\
  \ `using` 语句。\n\n### 编译与运行程序\n\n一旦输入了程序，你就可以通过发出运行 C++ 编译器的命令来编译它。编译器翻译程序，如果没有错误，它就会将机器语言版本存储到文件中。开发环境可能会在单独的窗口或编辑器中指示代码中的错误。\n\
  \n如果有错误，你必须确定它们的原因，在编辑器中修复它们，然后重新运行编译器。一旦你的程序无错误地编译，你就可以运行它。\n\n某些系统在编译成功后会自动运行程序。在另一些系统中，你必须发出一个单独的命令来运行它。还有一些系统要求在编译和运行程序之间指定一个称为“链接”的额外步骤。无论你的系统使用什么种系列命令，结果都是相同的：你的程序被加载到内存中并由计算机执行。\n\
  \n即使程序在运行，它在设计上可能仍然存在错误。计算机完全按照你告诉它要做的操作操作，即使那并不是你想要它执行的操作。如果你的程序没有按照应该的方式运行（逻辑错误），你必须返回算法并修复它，然后回到编辑器修复程序。最后，你再次编译并运行程序。这个调试过程会重复，直到程序执行了它应该执行的任务（参见图\
  \ 2.3）。\n\n![描述调试过程的流程图。](img/9781284166033_CH02_FIGF03.jpg)\n\n描述\n\n图 2.3 调试过程\n\
