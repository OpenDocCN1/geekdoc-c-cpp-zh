  \nDescription\n\n# 图 14.2A 和 B 示例代码段的结果\n\n在 图 14.2D 中，注意在赋值语句之前 `ptrl` 指向的变量仍然存在。然而，无法访问它，因为没有指针指向它。这个孤立的变量被称为`不可访问对象`（inaccessible\
  \ object）。在自由存储（free store）上留下不可访问对象应该被视为逻辑错误，它是内存泄漏的原因。\n\n同样注意，在 图 14.2EE 中，`ptrl`\
  \ 现在指向一个原则上已不再存在的变量。我们称 `ptrl` 为`悬空指针`（dangling pointer）。如果程序随后对 `ptrl` 进行解引用，结果将是不可的。所指向的值可能是原始值\
  \ (44)，也可能是如果自由存储中的该空间已被重用而存储在那的不同值。\n\n在 图 14.2E 中显示的两种情况——不可访问对象和悬空指针——可以通过在将\
  \ `ptr2` 赋值给 `ptrl` 之前释放 `ptr1` 以及在释放 `ptr2` 后将 `ptrl` 设置为 `NULL` 来避免。\n\n![A code\
  \ fragment.](img/9781284166033_CH14_P824-1.jpg)\n\nDescription\n\n![A diagram explains\
