  \ 的外观：\n\n![一个 GUI 窗口。](img/9781284166033_CH16_P1043-1.jpg)\n\n描述\n\n### 测试与调试\n\
  \n在使用模板时，重要的是记住，生成的模板函数或模板类会变成普通的函数或类，并受所有常规语法和语义规则的限制。\n\n测试模板函数或模板类的一种一种方法是从非模板版本开始，使用特定的数据类型（如\
  \ `int`）。应用我们在前面的章节中为算法和类所概述的常用测试策略。在纠正了所有错误后，将函数或类转换为模板化形式，并通过提供不同的数据类型作为模板参数来继续测试。\n\
  \n另一种方法是从模板化类开始，但最初将其特化（specialize）为你确信正确的类型，例如 `int` 或 `string`。如果你在尝试从模板中查找 bug，而该\
  \ bug 实际上存在于类型参数中指定的类中，这会让你感到非常沮丧。一旦你确认模板对于可靠类型可以正常工作，就可以对你预计将使用的一系列类进行测试。\n\n处理异常的程序必须经过测试，以确保异常被正确生成并被妥善处理。必须包含测试用例来触发异常，并指定处理异常的预期结果。\n\
  \n“问题解决案例研究”程序有三个异常：\n\n1. 一行分配了超过两个个人。\n2. 加载的飞机太重，无法起飞。\n3. 重心在接受范围之外。\n\n测试这三种情况至少需要运行四次：(1)\
  \ 三个人被分配到同一行；(2) 飞机太重；(3) 重心太低；以及 (4) 重心太高。你需要在“案例研究后续”练习中为这四种情况创建测试数据。\n\n### 测试与调试提示\n\
  \n1. 在声明模板参数时，例如：\n\n![一个模板参数声明。template，左尖括号，class Item Type，右尖括号。](img/9781284166033_CH16_P1044.jpg)\n\
  \n    记得使用 `class` 关键字（或 `typename`）。然而，在实例化模板时使用的模板参数并不要求是 C++ 类的名称。任何数据类型（内置的或用户定义的）都是允许的。\n\
  \n2. 在本文讨论的限制形式中，模板参数是数据类型名称，而不是变量名或表达式。\n\n3. 模板函数通常使用隐式模板参数调用，但模板类必须使用显式模板参数。\n\
  \n4. 就像非模板函数一样，如果模板函数的定义物理上放置在调用函数的代码之后，那么函数原型（前向声明）必须在调用代码之前。\n\n5. 对于模板类，成员函数的定义必须与客户端代码一起编译，而不是独立编译。一种策略是将类模板和成员函数定义分组到单个文件中（`.h`\
  \ 文件）。另一种策略是将类模板放在 `.h` 文件中，将成员函数定义放在 `.cpp` 文件中，并让 `.h` 文件包含 `.cpp` 文件。在后一种方法中，如果你使用\
  \ IDE，不要将此 `.cpp` 文件列在“项目”中。只需在项目中包含客户端代码文件。\n\n6. 避免使用内置类型作为异常类型。抛出用户定义的类或结构体对象，其名称反映错误或异常事件的性质。\n\
  \n7. 如果 `BadData` 是异常类的名称，请确保通过编写以下代码抛出该类的对象：\n\n    ![一个语句。throw Bad Data，左括号，右括号，分号。两个正斜杠。抛出一个构造的对象。](img/9781284166033_CH16_P1045.jpg)\n\
  \n    而不是\n\n    ![一个语句。throw Bad Data，分号。两个正斜杠。语法错误。](img/9781284166033_CH16_P1045-1.jpg)\n\
  \n8. 确保捕获了所有异常。未捕获的异常会导致程序带有模糊的错误信息而终止。最佳实践是在尽可能接近异常源的地方捕获异常，以便在那里得到妥善处理。\n\n![森林中树木的照片。](img/Chapter-opener.jpg)\n\
  \n章节导言：© Joost Lagerij/EyeEm.\n\n\n\n\n稍加思考，您应该也能意识到我们可以使用链表来实现数组的抽象概念。在通常情况下，数组的链式实现效率很低。然而，当一个索引范围很大的数组中填充的值非常稀疏时，链式实现可以节省大量的空间。例如，想象一位野生动物学家正在根据从大鹅追踪项圈接收到的\
  \ GPS 坐标，绘制大鹅在湖面上的位置图。这些数据的自然表示方式是一个以坐标为索引的二维数组，每个元素代表该湖面区域内大鹅的数量。当然，当只有几只大鹅时，使用数组实现会浪费内存空间，而这通过切换到链式实现可以节省这些空间，如图\
  \ 17.2 所示。\n\n![稀疏填充的二维数组及其相同的链式实现](img/9781284166033_CH17_FIGF17-2.jpg)\n\n**图\
  \ 17.2 稀疏填充数组的链式实现节省了空间**\n\n描述\n\n核心思想是每个数据结构都有两个方面：它的抽象（概念）形式和它的实现。通过面向对象编程支持的控制和数据抽象，可以将这两个方面完全分离。这样做的好处是，客户端代码可以使用易于理解的表示，同时获得高效底层实现带来的收益。\n\
  \n在我们继续学习本章时，您可能会产生这样的想法：“但栈不就是受限制的列表吗？我们为什么还需要它作为一个单独的类型呢？”我们都掉入过这种将抽象表示与实现混合的陷阱。正如我们在演示栈的使用时所看到的，一个更简单的抽象类型可能比以受限制的方式使用更通用的抽象更容易编写出解决方案的代码。栈的抽象还允许实现者选择基于列表或基于数组的实现。\n\
  \n另外一点需要记住的是，数据结构的任何实现都代表着一个相应的 ADT（抽象数据类型）。例如，一个 `list` 类有一个表示列表 ADT 的接口。正因如此，当我们查看诸如\
  \ STL 这样的实现库时，往往倾向于自动使用提供的 `list` 类型来实现来实现问题中的抽象列表。但如果问题要求列表在程序运行开始时从文件数据构建，随后的删除和添加很少呢？这就支持了使用基于数组的实现。\n\
  \n我们在数据结构中使用的问题解决策略如下：在问题解决阶段，我们设计最自然解决问题的结构和接口。在实现阶段，我们考虑结构将如何被使用，以及哪种结构实际上提供了最高效的解决方案。接下来，我们定义一个类，用抽象类型的接口将实现结构封装起来。最后，我们查看库，看它是否提供了可以在类内部使用的合适数据结构实现。\n\
  \n刚刚阐述了这一策略，我们需要指出，本章的许多目标涉及演示对 STL 的使用。如果不将 STL 类型封装在另一个类型的接口中，要观察 STL 类型是如何运作的会容易得多。因此，提前预警，我们的示例并不一定是为了说明这种方法：这绝对是一个“听我说的，别看我怎么做”的情况！\n\
  \n## 17.2 额外的线性结构\n\n在特定问题的背景之外，很难想象一种在概念上既不是数组不是列表的线性数据结构——所以让我们考虑一个例子。超市里的购物车磨损是均匀的吗？你见过它们整齐地排成一列，人们从后面取走，店员将它们推到到位。但排在前面的购物车真的用过吗？它们是否重新排列得足够频繁，以便让所有购物车获得相同的磨损？除了好奇心，了解购物车是如何被使用的可以帮助超市决定购买多少个，或者是否需要定期重新排列购物车。\n\
  \n解决此类问题涉及模拟。我们可以对列中的购物车以及它们在过道中徘徊的时间进行建模，并记录每个购物车获得的总使用时间。计算机的速度使我们能够在几秒钟内评估多年的使用情况。\n\
  \n我们应该使用哪种数据结构来表示这种情况？根据我们目前所看到的，数组可以对一列购物车建模。当一个模拟客户到达时，我们从列的末尾取出一个购物车。然后我们对它做什么呢？我们可以随机为它分配一个返回时间，并将其放入一个排序列表中。随着每一分钟的过去，我们检查列表，查看列表头的购物车是否准备好返回。然后将其从列表中移除，并放在列数组的末尾。图\
  \ 17.3 展示了这种安排。\n\n![使用数组和排序列表来模拟购物车](img/9781284166033_CH17_FIGF17-3.jpg)\n\n**图\
  \ 17.3 使用数组和排序列表来模拟购物车**\n\n描述\n\n让我们更仔细地考虑这些结构。我们需要它们的所有功能来解决问题吗？并不真的。例如，我们不会对数组进行随机位置索引；相反，我们只是从一端添加和删除。在计算机科学中，这种结构被称为栈。那么列表呢？我们会遍历它或从中间删除元素吗？不，我们只是将元素插入位置并从一端移除。这种结构被称为队列，它是更广泛的数据结构家族的成员。\n\
  \n到这里，您应该开始看到线性结构之间的差异基于它们的访问方式。数组和列表支持通用的访问。然而，如果访问受到某种限制，我们就可以定义具有简单接口的数据结构。此外，在某些情况下，限制允许我们创建更高效的实现。\n\
  \n让我们仔细观察栈和队列。\n\n### 栈\n\n`stack` 是一种从一端访问的数据结构。我们可以在顶部（作为第一个元素）插入元素，并移除顶部（第一个）元素。这种结构模拟了现实生活中常见的属性。会计师称之为\
  \ LIFO，意为“后进先出”。食堂的盘子架具有这种属性。你只能取顶部的盘子。当你取走时，下面的盘子会升到顶部，供下一个人取盘子。非圆形车道上的汽车表现出这种属性：最后进去的汽车必须最先离开。\n\
  \n`push` 用于插入操作，`pop` 用于删除操作。在栈的某些实现中，`pop` 也返回顶部元素。在其他实现中，独立的操作 `top` 获取顶部值，而 `pop`\
  \ 仅删除它。图 17.4 展示了在给定栈上 `push` 一个元素然后 `pop` 栈会发生什么。\n\n栈经常用于系统软件。例如，C++ 在运行时使用栈来跟踪嵌套的方法调用。编译器使用栈来翻译算术表达式。栈可以用于反向回溯一系列对象或操作。这里显示了一个读取包含一系列行的文件并按反顺序输出这些行的、使用字符串栈的算法：\n\
  \n\n\n\n\n# 图 17.4 显示推入、栈顶和弹出操作的栈\n\nDescription\n\n## 反转文件\n\n```\nCreate stack\n\
  Create file in\nwhile in\n    stack.push(in.getline)\nwhile not stack.empty\n  \
  \  output stack.top\n    stack.pop\n```\n\n从这个算法可以看出，除了 `push`、`pop` 和 `top` 之外，我们还需要一种方法来测试栈是否为空。我们可能还需要一种方法来查找栈的大小。即使增加了这些功能，栈接口也只有五种职责，使其成为非常简单的抽象类型。\n\
  \n### 队列\n\n`queue`（队列）是一种线性数据结构，元素从一端进入并从另一端移除。会计师们将这种属性称为 FIFO，代表“先进先出”（first\
  \ in, first out）。银行或超市的等待队以及单行道上的车队都是队列的类型¹。事实上，队列经常用于类似情况的计算机模拟。\n\n虽然栈的插入和删除职责的术语是标准的（`push`、`pop`），但队列并没有这种标准。在队列末尾插入元素的操作在文献中有许多名称：`Insert`、`add`、`push`\
  \ 和 `enqueue` 是最常见的四种。相应地，从队列头部移除元素的操作被各种称为 `delete`、`remove`、`pop` 和 `dequeue`。\n\
  \nC++ 对队列使用了栈的术语，其中 `push` 应用于结构的末尾，而 `pop` 应用于头部。操作 `front` 代替了 `top`，返回队列头部的元素。与栈一样，我们需要操作来检查队列是否为空并确定其大小。C++\
  \ 队列的实现是不寻常的，因为它还多了一个操作 `back`，返回队列末尾的元素。图 17.5 显示了空队列 (a)、向队列中插入 (b) 以及从队列中删除 (c)。\n\
  \n![队列上插入和删除操作的插图。](img/9781284166033_CH17_FIGF17-5.jpg)\n\n### 图 17.5 显示插入和删除操作的队列\n\
  \nDescription\n\n¹ *queue* 一词源于法语，但在全球广泛使用。例如，美国人会要求人们“line up”（排队），而英国人会要求他们“queue\
  \ up”。\n\n1. a. 一个空队列![LL .back](img/9781284166033_CH17_p1062-1.jpg)\n2. b. 向队列中插入![queue\
  \ .front .back](img/9781284166033_CH17_p1062-2.jpg)\n3. c. 从队列中删除\n\n与队列一样，优先级队列的职责没有标准的术语。C++\
  \ 只是简单地使用了栈的术语：`push`、`pop`、`top`、`empty` 和 `size`。因此，在命名栈和优先级队列对象时要小心，以便容易区分每个对象是哪种类型。我们不能依靠操作名称来帮助识别数据类型。\n\
  \n这里我们应该重申第 17.1 节中的一个关键点：数据结构具有概念结构和实现结构，二者可能不同。我们刚刚从概念角度描述了优先级队列。STL 通常使用更复杂、更高效的结构来实现优先级队列。当我们在本章中描述其他数据结构时，请记住我们看的是它们的概念安排。除极少数情况外，我们不描述\
  \ STL 是如何实现它们的。\n\n### 优先级队列\n\n正如我们在购物车问题中所说的那样，`priority queue`（优先级队列）是队列族结构的一员。它的行为像队列，因为数据只从其头部移除。然而，元素不是在末尾插入的，而是以它们处于给定的顺序的方式插入，如\
  \ 图 17.6 所示。例如，登机的乘客可能被要求按照座位分配的顺序排队。准备照相的学生可能被要求按字母顺序排队。在每种情况下，人们以任何能让他们处于正确顺序的点进入队伍，但他们只从队头离开。\n\
  \n![显示优先级队列插入和移除点的图。](img/9781284166033_CH17_FIGF17-6.jpg)\n\n### 图 17.6 显示插入和移除点的优先级队列\
  \ ADT（抽象数据类型）\n\nDescription\n\n## 17.3 双向线性结构\n\n与第 14 章讨论的链表一样，队列是单向的。元素从前向后移动。\n\
  \n### 双向列表\n\n当我们想要一个可以向两个方向遍历的结构时，数组是一个自然选择。但当中间的插入和删除常见且随机访问并不时，数组不再合适。我们需要一种被称为\
  \ `bidirectional list`（双向列表）的结构。\n\n在双向实现中，我们通过指向相反方向的第二个链接来增强列表。我们保留对列表头部和尾部的外部引用，可以通过向前或向后移动节点，如\
  \ 图 17.7 所示。\n\n![双向列表。](img/9781284166033_CH17_FIGF17-7.jpg)\n\n### 图 17.7 双向列表\n\
  \nDescription\n\n使用这种结构，每次插入和删除都需要双倍的指针操作，且节点拥有双倍的空间，因此整体效率会有所损失。因此，尽管双向列表是一个具有许多吸引功能的更通用结构，但应该只在我们需要它的额外功能时才使用。就像你不会用电锯来修剪盆栽一样，在很多地方使用双向列表是过度设计的。尽管如此，请注意\
  \ STL 仅提供了列表的双向实现。对于单向列表，它通过 `set` 类型提供了类似的功能。\n\n### 双端队列\n\n`deque`（读音类似“deck”）是队列的双向等物。通过它，我们可以在任何端插入和删除元素，如\
  \ 图 17.8 所示。事实上，这个名字是计算机科学家发明的，是 double ended queue 的缩写。如果你想模拟一个人们会不耐并从后面离开的等待队，`deque`\
  \ 将是一个很好的选择。它也可以代表调车场中的火车车，可以从火车的两端添加或移除车厢。\n\n![双 que 或双端队列的插图。](img/9781284166033_CH17_FIGF17-8.jpg)\n\
  \n### 图 17.8 双端队列 (Deque)\n\nDescription\n\n对于双端队列操作的命名没有共识。C++ 使用 `push_front`\
  \ 和 `push_back` 进行插入，使用 `pop_front` 和 `pop_back` 进行删除，并使用 `front` 和 `back` 访问头部和尾部值。当我们查看\
  \ STL 实现时可以看到，C++ deque 实际上是一个巨大的类，它结合了抽象双向列表、双端队列和数组的接口。\n\n\n\n\n现在是时候查看 STL（标准模板库）了。我们将关注这些线性抽象数据类型（ADT）的接口——即它们的概念视图是如何工作的。数据和控制抽象允许我们编写任何所需的客户端代码来使用这些结构，而无需担心它们的内部实现。我们将在本章晚些时候回到对抽象数据结构的介绍，届时我们将重点转向数据的非线性组织。\n\
  \n## 17.4 STL 简介\n\n正如“标准模板库”这一名称所示，STL 主要由模板组成。该库分为两个主要部分：`containers`（容器）和 `algorithms`（算法）。容器部分包含\
  \ 16 种通用结构化数据类型的模板。其中 7 种数据类型更为特殊，本文将不再涵盖：`forward_list`、`multiset`、`multimap`、`unordered_set`、`unordered_multiset`、`unordered_map`\
  \ 和 `unordered_multimap`。另外 9 种总结如下表。\n\n![标准模板库中提供的某些数据结构列表。](img/9781284166033_CH17_p1065-1.jpg)\n\
  \n描述\n\n`array` 类与其他类不同，将被单独讨论。要声明和特化其他 8 个模板类中的任何一个，只需使用其名称，后跟尖括号中的类型；例如：\n\n![list\
  \ 和 vector 的声明。](img/9781284166033_CH17_p1065-2.jpg)\n\n描述\n\n当我们单独查看每个类型时，将看到不同形式的构造函数。容器元素的类型可以是内建类型，也可以是类。STL\
  \ 对元素对象施加了一些要求。特别是，它们必须至少支持重载关系运算符的最小子集。对于大多数编译器来说，重载 `<` 和 `==` 就足够了，但有少数编译器需要重载更多的运算符。\n\
  \nSTL 的算法部分包含大量的函数模板，可以在许多不同的语文中使用。在本文中，我们只详细介绍了少数算法。下表总结了一些常用的函数。并非所有这些函数都能应用于每种类型的容器。\n\
  \n![常用函数模板总结表。](img/9781284166033_CH17_p1065-1.jpg)\n\n描述\n\n我们将更详细地查看每个容器类，并引入其中一些算法作为示例。请记住，我们只是在浅尝这些模板的功能，以便你对它们如何工作有个概念。如需更深入的探讨，你应该查阅专门的\
  \ STL 参考书。\n\n### 迭代器\n\n在开始之前，我们必须探索与容器类相关的一个关键概念：迭代器（iterator）。我们过去讨论过迭代器，将其视为类可以承担的一种特定职责。在\
  \ STL 中，迭代器是一个指向容器中某个位置的对象。理解迭代器的一种方法将其看作是封装在类中的指针，以提供额外的功能。它被称为迭代器，是因为额外功能包含了导致它以步进方式在\
  \ STL 容器中移动的操作。\n\nSTL 中的迭代器有两种类型：正向（forward）和反向（reverse）。通常，容器具有名为 `begin` 和 `end`\
  \ 的方法，分别返回指向其开头和末尾的正向迭代器。你可以使用 `++` 运算符让正向迭代器在容器中移动。使用 `--` 则使迭代器向后移动。\n\n名为 `rbegin`\
  \ 和 `rend` 的方法返回反向迭代器。`rbegin` 和 `rend` 返回的迭代器分别指向容器的末尾和开头。对反向迭代器使用 `++` 会使其从后向前移动，而应用\
  \ `--` 则导致向后移动；也就是说，反向迭代器的语义与正向迭代器相反。反向迭代器从容器的末尾开始并“向前”移动。图 17.9\n\n**图 17.9 与 list\
  \ 相关的正向和反向迭代器**\n\n描述\n\n这些迭代器的设计是为了特别方便地使用 For 循环遍历容器。`end` 返回的实际上是一个指向最后一个元素之后位置的迭代器。同样，`rend`\
  \ 返回的迭代器指向容器开始之前的一个位置。正如我们所看到的，这种听起来很奇怪的惯例简化了 For 循环中的终止条件。但请注意，你不能使用 `end` 和 `rend`\
  \ 返回的值直接访问容器的末尾。\n\n对于随机访问容器（如 `deque` 和 `vector`），算术运算符 `+` 和 `-` 可以应用于迭代器，就像使用数组索引一样。这些迭代器的设计是为了特别方便地使用\
  \ For 循环遍历容器。`end` 返回的实际上是一个指向最后一个元素之后位置的迭代器。同样，`rend` 返回的迭代器指向容器开始之前的一个位置。正如我们将看到的，这种听起来很奇怪的惯例简化了\
  \ For 循环中的终止条件。但请注意，你不能使用 `end` 和 `rend` 返回的值直接访问容器的末尾。\n\n迭代器一个非常重要的的一点是，它们在内容不改变时才有效。当元素插入或删除从容器时，迭代器会失效，因为\
  \ C++ 不保证更改后的内容安排。容器类无法跟踪指向它的每一个迭代器，因此没有办法更新这些迭代器。\n\n每个迭代器都必须为其将使用的特定容器类型进行声明；例如，如果我们需要字符串列表的迭代器，我们会如下声明：\n\
  \n![迭代器的两个声明。](img/9781284166033_CH17_p1068-1.jpg)\n\n描述\n\n### vector 模板\n\n我们的\
  \ STL 容器之旅从一个在抽象上非常容易理解的类型开始。`vector` 类模板实现了数组。为什么我们需要另一种定义数组的方法？嗯，关于 `vector` 还有一点——它的大小不是固定的。因此，我们不需要担心子数组处理，也不需要在声明它时决定数组有多大。否则，你几乎可以直接用这种容器替换内建数组。\n\
  \n我们说“几乎”，是因为 `vector` 是一个对象而不是内建结构。因此它必须在运行时通过构造函数实例化。由于这个原因，我们不能使用初始化列表来声明它，就像声明数组那样。这里是\
  \ `vector` 构造的一些简单调用：\n\n![vector 构造函数的两次调用。](img/9781284166033_CH17_p1068-2.jpg)\n\
  \n描述\n\n第一条语句是有意义的——它类似于以下代码：\n\n```\nint array[20];\n```\n\n\n\n但我们为什么要声明一个不包含空间的\
  \ `vector` 呢？原因是 `vector` 会自动扩展，以容纳我们放入其中的所有数据。因此，如果我们完全不知道要向 `noSizeVec` 中放入多少字符串，只需将其声明为不包含任何元素，并让该结构在我们插入值时自动增长。\n\
  \n如果 `vector` 总是调整其大小来容纳数据，那么我们为什么还需要费心去指定大小呢？答案是，这种灵活性是有代价的。每当 `vector` 增长时，都可能花费大量工作。其底层实现是数组，模板会分配一个新的、更大的数组，并将旧内容移动到其中。因此，当我们预先知道最大大时，在构造函数中指定该值是有意义的。\n\
  \n让我们来看一个 `vector` 的运行示例。在第 11 章中，我们写过一个程序，允许用户查询特定公寓的住户数量。这里是程序使用 `vector` 重写后的版本，并高亮显示了更改部分。回想起我们将公寓数量固定为\
  \ 10 个。\n\n![一个允许楼主查询特定公寓住户数量的程序。](img/9781284166033_CH17_p1069-1.jpg)\n\n描述\n\n\
  如你所示，`vector` 几乎直接替换了数组。由于该类重载了 `[]` 运算符，我们可以使用索引法来访问元素，无论是在 `vector` 中存储值还是检索值都是如此。然而，我们的示例并没有完全说明\
  \ `vector` 模板的潜力。让我们重写该程序，让 `vector` 增长到容纳输入文件中的所有公寓数据。\n\n当然，我们必须将循环从 `For` 改为\
  \ `While`，测试 `inFile` 流的状态，并使用导读读入（priming read）。常量 `BUILDING_SIZE` 不再有用，因此我们将其删除。但我们如何确定输出的大小值呢？我们使用\
  \ `vector size` 方法；例如：\n\n![cout “No. of apts. is ” occupants.size() endl](img/9781284166033_CH17_p1070-1.jpg)\n\
  \n嗯，这足够简单。但向 `vector` 中添加元素呢？为此，我们必须调用 `push_back` 方法，它将作为参数传递的元素附加到 `vector` 的末尾，并在必要时增加其大小。\n\
