  \n描述\n\n![程序段的延续。](img/9781284166033_CH15_P957.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH15_P958.jpg)\n\
  \n描述\n\n![程序段的延续。](img/9781284166033_CH15_P959.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH15_P960.jpg)\n\
  \n描述\n\n![程序段的延续。](img/9781284166033_CH15_P961.jpg)\n\n描述\n\n### 测试与调试\n\n面向对象程序的测试和调试在很大程度上是一个测试和调试构建该程序的\
  \ C++ 类的过程。顶层驱动程序也需要进行测试，但这种测试通常是不复杂的——面向对象设计（OOD）往往会产生简单的驱动程序。\n\n要回顾如何测试 C++ 类，请参阅第\
  \ 9 章中的“测试与调试”部分。在那里，我们介绍了测试类中每个成员函数的过程。我们当时观察到，你可以为每个成员函数编写单独的测试驱动程序，也可以只写一个测试所有成员函数的测试驱动程序。后者方法仅推荐用于具有少数简单成员函数的类。\n\
  \n当面向对象程序使用继承和组合时，从某种意义上说，测试类的顺序是预定的。如果类 `X` 派生自类 `Y`，那么在设计并实现 `Y` 之前，你就无法测试 `X`。因此，在测试类\
  \ `X` 之前测试并调试类 `Y`（基类）是有意义的。\n\n当类 `Y` 包含类 `Z` 的对象时，你通常应该先测试 `Z` 再测试 `Y`。\n\n###\
  \ 测试与调试提示\n\n1.  面向对象程序的测试和调试在很大程度上是一个测试和调试构建该程序的 C++ 类的过程。顶层驱动程序也需要进行测试，但这种测试通常是不复杂的——面向对象设计（OOD）往往会产生简单的驱动程序。\n\
  2.  要回顾如何测试 C++ 类，请参阅第 9 章中的“测试与调试”部分。在那里，我们介绍了测试类中每个成员函数的过程。我们当时观察到，你可以为每个成员函数编写单独的测试驱动程序，也可以只写一个测试所有成员函数的测试驱动程序。后者方法仅推荐用于具有少数简单成员函数的类。\n\
  3.  当面向对象程序使用继承和组合时，从某种意义上说，测试类的顺序是预定的。如果类 `X` 派生自类 `Y`，那么在设计并实现 `Y` 之前，你就无法测试 `X`。因此，在测试类\
  \ `X` 之前测试并调试类 `Y`（基类）是有意义的。\n4.  当类 `Y` 包含类 `Z` 的对象时，你通常应该先测试 `Z` 再测试 `Y`。\n\n\n\
  \n本章介绍了对我们软件设计和实现产生强大影响的 C++ 语言特性：模板、运算符重载和异常。顾其名义，模板是一种模式，我们可以通过该模式创建某事物的多个实例。C++\
  \ 模板允许我们创建函数或整个类的特化实例，而无需显式地更改或扩展它们。\n\n运算符重载允许我们重新定义标准的 C++ 运算符。特别是，我们可以重新定义关系运算符，以便它们用于比较类对象。\n\
  \n异常是执行过程中发生的异常事件。C++ 异常处理机制允许程序的一个部分检测到异常的发生，并让程序的另一部分对其响应。执行检测的部分被称为“抛出”异常，而响应的部分（称为异常处理程序）被称为“捕获”异常。\n\
  \n## 16.1 模板类\n\n在第 13 章中，我们定义了一个 `List` 抽象数据类型（ADT），表示一个无序组件的列表，每个组件的类型为 `ItemType`。我们将此\
  \ ADT 编码为名为 `List` 的 C++ 类，头文件 `List.h` 编写如下（此处省略了函数的先置条件和后置条件）：\n\n![一个包含名为 List\
  \ 的类定义的头文件。](img/9781284166033_CH16_P974.jpg)\n\n描述\n\n`typedef` 语句允许我们为 `ItemType`\
  \ 选择特定的类型，只要它是一个简单类型或 `string` 类即可。\n\n`List` 类在某种意义上类似于泛型数据类型`，意义在于如果我们通过更改 `typedef`\
  \ 语句来更改 `ItemType`，我们就可以重新编译该类，而无需更改成员函数中的任何算法。\n\n然而，目前编写的 `List` 类有两个严重的局限性。首先，一旦使用（例如）`int`\
  \ 作为 `ItemType` 编译了该类，客户端程序的 `List` 对象只能是 `int` 列表。客户端无法在同一个程序中同时拥有 `int` 列表和 `float`\
  \ 列表。其次，客户端程序无法指定或更改 `ItemType`；程序员必须手动修改 `list.h`。\n\n为了让像 `List` 这样的类成为真正的通用类型，我们需要一种语言结构，允许\
  \ `ItemType` 成为类声明的参数。幸运的是，C++ 提供了这种结构：类模板`。\n\n### 定义类模板\n\n在 C++ 中，类模板允许你编写一个带有“空白”的类定义，这些空白将由调用代码填充。大多数情况下，这些“空白”是数据类型的名称。\n\
  \n以下是类模板的语法：\n\n![类模板的语法如下。第一行：template，左尖括号，Template Param List，右尖括号。第二行：类定义。](img/9781284166033_CH16_P975.jpg)\n\
  \n其中 `ClassDefinition` 是一个普通的类定义。C++ 中 `TemplateParamList` 的完整语法描述非常复杂，我们根据需要将其简化如下。`TemplateParamList`\
  \ 是由一个或多个由逗号分隔的参数声明序列，其中每个声明的定义如下：\n\n![模板参数声明由类名或类型名后跟一个标识符组成。](img/9781284166033_CH16_P975-1.jpg)\n\
  \n这是我们为 `List` 类设计的类模板，将类名更改为 `GList`：\n\n![template class ItemType class GList\
  \ { public: List();](img/9781284166033_CH16_P975-2.jpg)![List 类的类模板。](img/9781284166033_CH16_P976.jpg)\n\
  \n描述\n\n正如高亮所示，此模板类似于 `List` 类型的声明，不同在于它前面带有 `template<class ItemType>` 且类名已更改。在这里，`ItemType`\
  \ 是模板参数。和以前一样，我们在任何需要引用列表元素类型的地方都使用 `ItemType`。区别在于，该类型不是通过 `typedef` 语句硬编码的，而是在类实例化时指定的。你可以使用任何标识符作为模板参数；我们在这个示例中使用\
  \ `ItemType`是因为是因为我们在之前的 `List` 类中一直使用它。\n\n关于模板参数有两点需要注意。首先，在 `template<class ItemType>`\
  \ 中使用 `class` 仅是语法要求，并不意味着列表项必须是 C++ 类对象。从此模板创建的列表可以包含任何数据类型，包括内置类型或用户定义类型。（由于由于，某些\
  \ C++ 程序员正倾向于使用新的保留关键字 `typename`，尽管 `class` 更传统。）在下一节的示例代码中，我们使用 `int`、`char` 和\
  \ `float` 从此模板中实例化三个特定的类。\n\n其次，模板参数取代了代码中显式类型名的位置。那么我们向这个参数传递什么呢？一个数据类型名称。初看起来这似乎很奇怪，因为当我们向函数传递参数时，传递的是变量名，而不是数据类型名称。向模板传递参数在编译时产生影响——相比之下，向函数传递参数在运行时产生影响。\n\
  \n### 实例化类模板\n\n给定 `GList` 类模板，客户端程序可以使用如下代码创建多个具有不同数据类型的列表：\n\n![创建不同数据类型列表的代码片段。](img/9781284166033_CH16_P976-1.jpg)\n\
  \n描述\n\n![插入数据的代码片段。](img/9781284166033_CH16_P977.jpg)\n\n描述\n\n在 `list1`、`list2`\
  \ 和 `list3` 的声明中，括号内的数据类型是模板参数。当编译器遇到 `list1`、`list2` 和 `list3` 时，它会生成（实例化）三个不同的类型并为每个类型内部命名。你可以想象这些声明内部转换为类似于：\n\
  \n![编译器对声明的可能转换。](img/9781284166033_CH16_P977-1.jpg)\n\n描述\n\n在 C++ 术语中，这三个新类类型被称为模板类或生成类（与创建它们的类模板相对）。单独来说，从模板生成的每个具体类被称为模板的特化。\n\
  \n当编译器实例化模板时，它字面上会将模板参数替换类模板中的模板参数。例如，当编译器第一次在客户端代码中遇到 `GList<int>` 时，它通过用 `int`\
  \ 替换类模板中所有的 `ItemType` 来生成新类：\n\n![代码片段。](img/9781284166033_CH16_P977-2.jpg)\n\n\
  描述\n\n类模板的一个有用视角是：此普通类声明是实例化单个对象的模式，而类模板是实例化单个数据类型的模式。\n\n现在我们已经知道了如何编写类模板的定义，那么类成员函数的定义该如何处理？我们需要将它们写成函数模板，以便编译器可以将每个函数与正确的模板类关联。以下是函数模板的语法图：\n\
  \n![函数模板的语法如下。第一行：template，左尖括号，Template Param List，右尖括号。第二行：函数定义。](img/9781284166033_CH16_P978.jpg)\n\
  \n\n\n\n如你所见，`FunctionTemplate` 与 `ClassTemplate` 非常相似，但有两个例外：在某些特殊情况下，可以省略 `TemplateParamList`，并且模板参数规范后面跟着的是\
  \ `FunctionDefinition` 而不是 `ClassDefinition`。\n\n例如，我们将 `Insert` 函数编写为如下的函数模板：\n\
  \n![Insert 函数的定义。](img/9781284166033_CH16_P978-1.jpg)\n描述\n\n注意我们必须在 `GList` 后面附加\
  \ `<ItemType>`，这样编译器才知道我们正在引用的是 `GList` 的哪一个特化版本。在类内部存在多个特化版本也是可能的（尽管这里没有提供示例），并且每种情况下都需要告诉编译器哪一个是哪一个。\n\
  \n如果客户端声明了一个类型 `GList<float>`，编译器将生成一个类似于下面的函数定义：\n\n![编译器生成的函数定义。](img/9781284166033_CH16_P978-1.jpg)\n\
  描述\n\n### 实现输入参数的另一种方式：常量引用\n\n到目前为止，我们对函数参数使用了一个非常简单的规则：输入参数按值传递，所有其他参数均按引用传递。通过这种方式，我们避免了某些类型的副作用错误。引用参数允许函数直接访问参数，每当必须通过参数传回一个值时，这是必要的的。\n\
  \n对于内置类型和简单、小对象的参数，值参数所发生的复制操作在效率上与引用参数所发生的地址传递是相当的。然而，当我们使用较大的对象时，复制这些对象会消耗更多的时间。模板使得生成大型且复杂的数据结构变得简单——例如，我们可以从同一个实现实例化一个大型对象列表或一个\
  \ `int` 列表。结果，我们可以创建一个对简单类型非常高效，但对复杂类型运行慢得惊人的模板。即使模板在复杂类型上执行的操作很快，复制到值参数的开销也会在处理时间内占据主导。\n\
  \n我们需要一种既像按引用传递一样高效，又像按值传递一样安全的参数传递机制。C++ 通过允许我们将引用参数指定为常量来提供这种机制。因此，将常量引用参数机制应用于我们的模板函数定义是非常重要的。例如，下面的代码显示了我们应该如何实现\
  \ `GList` 插入操作，并突出了更改部分：\n\n![G List Insert 操作的函数定义。](img/9781284166033_CH16_P979.jpg)\n\
  描述\n\n要将值参数转换为常量引用，我们在类型名称之前加上 `const` 之后加上 `&`。值参数和常量引用等价吗？绝对不等！在函数内部，常量引用参数确实是一个常量——你不能给它分配新值。这与值参数形成了对比，后者是函数内部的一个变量。由于值参数包含了其参数的副本，我们可以给它分配新值或修改其内容，而不影响原始参数。\n\
  \n除了不能给常量引用分配新值的限制外，当参数类型为类时，我们还不允许调用它的转换器（mutator）方法。\n\n对于作为常量引用传递的对象，我们只能调用其观察者（observers）。回忆第\
  \ 12 章，我们在不改变对象内值的函数头中附加了 `const`。当对象被传递给常量引用参数时，只有它的 `const` 函数可以应用到它身上。如果我们尝试调用该对象的任何非常量函数，编译器将发出错误信息。\n\
  \n### 程序代码的组织\n\n在处理模板类时，我们必须更改关于存放源代码的文件的基本规则。在此之前，我们将类声明放在名为 `List.h` 的头文件中，将成员函数定义放在名为\
  \ `List.cpp` 的实现文件中。结果，`List.cpp` 可以独立于客户端代码编译成对象代码。这种策略对于模板并不适用。编译器在不知道模板参数的情况下无法实例化模板，而这个参数又位于客户端代码中。\n\
  \n一种通用的解决方案是同时编译客户端代码和类定义。对于我们的 `GList` 模板，一种技术是不使用实现文件 `glist.cpp`，而是将模板类声明和成员函数定义放在同一个文件\
  \ `GList.h` 中。另一种技术是保留两个不同的文件 `GList.h` 和 `GList.cpp`，但在 `GList.h` 文件的末尾放置 `#include\
  \ \"GList.cpp\"` 指令。无论哪种方式，编译器都可以同时获得所有的源代码——包括客户端代码和类。\n\n在接下来的 GList 模板代码中，我们使用了第一种技术——即在单个文件中将实现附加到规范。\n\
  \n![GList 模板。](img/9781284166033_CH16_P980.jpg)\n![GList 模板的延续。](img/9781284166033_CH16_P981.jpg)\n\
  ![GList 模板的延续。](img/9781284166033_CH16_P982.jpg)\n\n这是我们用于 `List` 类相同的驱动程序。运行 `GList`\
  \ 代替 `List` 所需的更改已涂色。（是的，只需要更改两行。）由于输出与第 13 章相同，我们不再重复它。\n\n![从文件读取读取并输出列表的程序。](img/9781284166033_CH16_P982.jpg)\n\
  ![从文件读取读取并输出列表的程序的延续。](img/9781284166033_CH16_P983.jpg)\n\n`#include` 语句中的文件名和列表的声明是唯一的更改。声明是类型名称后面跟着括号中的\
  \ `ItemType` 定义。例如，\n\n![声明。](img/9781284166033_CH16_P983.jpg)\n\n声明了一个名为 `temps`\
  \ 的 `GList`，其列表中的项被特化为 `int`。如果我们希望列表中的项是 `float` 或 `string`，以下语句将声明它们：\n\n![两处声明。](img/9781284166033_CH16_P984.jpg)\n\
  \n尽管使用模板允许我们创建泛型数据类型（如所示），但我们对 `GList` 操作的实现要求列表项可以使用关系运算符进行比较。因此，我们无法定义\n\n![声明。](img/9781284166033_CH16_P984.jpg)\n\
  \n因为 `Name` 类使用的是函数 `ComparedTo` 而不是关系运算符。记录实例化泛型类时对类型的限制是非常重要的。在随后的章节中，我们将讨论重新定义关系运算符的方法，以便将其应用于如\
  \ `Name` 的类。\n\n\n\n\n我们的 `GList` 类型另一个不完全泛泛的方面是其大小固定为 100 个组件。如果客户端代码在实例化 `GList`\
  \ 时能为 `MAX_LENGTH` 指定一个值，将会非常有用。C++ 提供了另一种机制来实现这种行为。\n\n除了在模板参数列表中列出类型名称外，C++ 还允许我们在其中也包含非类型参数。我们可以使用这些参数来初始化特化。非类型模板参数仅限于少数类型：`int`、`enum`（枚举）、指针和引用。在本文中，我们只关注\
  \ `int` 非类型模板参数的使用。另一个限制是，此类参数的参数值必须在编译时确定的。因此，例如，我们不能使用用户在运行时输入的值作为参数值来实例化模板。\n\
  \n以下是我们可以实现对任何大小 `GList` 进行实例化的方法。在模板声明以及每个函数模板中，我们更改了头部，以包含一个名为 `MAX_LENGTH` 的\
  \ `int` 参数，此处高亮：\n\n![实例化的语法。](img/9781284166033_CH16_P984-2.jpg)\n\n描述\n\n在这里，我们将参数设为常量并按照常量的风格编写了标识符。我们并不要求使用\
  \ `const`，但在这种情况下，我们希望确保 `MAX_LENGTH` 不允许更改。在温度程序中，随后我们将 `GList` 类的实例化更改如下：\n\n\
