  \ 指第 2 周的温度数组。我们也可以通过指定两个索引来访问 `hiTemp` 的每个单独组件：例如，`hiTemp[2][0]` 访问第 2 周第一天的温度。\n\
  \n我们以哪种方式声明二维数组重要吗？对 C++ 来说并不重要。选择应该基于可读性和理解性。有时，如果在一个声明中指定两个索引，数据的关系会表现得更好。在其他情况下，如果先将一个维度定义为维数组类型，则更有意义。\n\
