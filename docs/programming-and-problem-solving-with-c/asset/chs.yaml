  T. R.\n\n引用《浮士德》中主要魔鬼和诱惑者之一梅菲斯托费勒的话：\n\n……我的朋友，我将具有教诲性，\n\n说你应该从逻辑学开始……\n\n……将花费时间让你知道，\n\
