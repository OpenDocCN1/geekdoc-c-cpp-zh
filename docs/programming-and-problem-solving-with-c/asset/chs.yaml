  \n下表总结了本章涵盖的字符串和字符操作。\n\n![详细列出转换为小写和大写字母函数的表格。](img/9781284166033_CH03_UTAB130-1.jpg)\n\
  \n描述\n\n下表总结了本章涵盖的字符串和字符操作。\n\n第 4 章\n\n### 测试与调试\n\n1.  3.1. 在...中\n2.  2.. 注意整数除法。\n\
  3.  3.3 使用 `/` 和 `%` 运算符时，记住不允许除零。\n4.  3.4 双击每个表达式，以确保操作按所需的顺序执行。\n5.  3.5 避免在表达式中混合整数和浮点值。如果必须混合，使用显式类型转换以确保清晰和安全。\n\
  6.  3.6 对于每个赋值语句，检查表达式的结果是否与 `=` 左侧变量的数据类型相同。\n7.  3.7 对于你程序中使用的每个库函数，确保 `#include`\
  \ 相应的头文件。\n8.  3.8 检查对库函数的每次调用，确认参数数量正确且参数的数据类型正确。\n9.  3.9 使用 `string` 类型时，字符串内部字符的位置是从\
  \ `0` 开始编号的，而不是 `1`。\n10. 3.10 如果程序错误原因不明显，在花时间理解错误源后再修改你的程序。\n\n## 4.1 将数据输入程序\n\
  \n如果我们想要一个可以使用许多不同数据集的程序，我们必须在执行之前将数据与程序分开。然后程序中的指令将值从数据集复制到程序中的变量中，使程序能够处理这些数据（参见图\
  \ 4.1）。\n\n\n\n\n![将数据与程序分离。](img/9781284166033_CH04_FIGF01.jpg)\n\n描述\n\n# 图 4.1\
  \ 将数据与程序分离\n\n将外部数据集中的值获取到程序的变量中的过程被称为“输入”（input）。我们说计算机将数据读入变量中。数据可以来自输入设备、来自辅助存储设备上的文件，或来自跨网络。我们将在本章稍后部分讨论文件输入；在这里，我们考虑标准输入设备——键盘。由于其复杂性，本书在本文中将不考虑网络输入。\n\
  \n## 输入流与提取运算符 (>>)\n\n除了输出流外，C++ 还支持输入流。你可以将输入流想象成一个门，字符通过它从输入设备进入你的程序。\n\n要使用流输入输出（I/O），我们需要编写预处理器指令：\n\
  \n![用于流输入输出的预处理器指令。](img/9781284166033_CH04_PRE1.jpg)\n\n描述\n\n头文件 `iostream` 包含了两个数据类型的定义：`istream`\
  \ 和 `ostream`。这两个数据类型分别代表输入流和输出流。该头文件还包含如下声明：\n\n![i o stream 头文件中的声明。](img/9781284166033_CH04_PRE2.jpg)\n\
  \n描述\n\n第一个声明表示 `cin`（读作“see-in”）是一个类型为 `istream` 的变量。第二个声明表示我们的老朋友 `cout` 是类型为\
  \ `ostream` 的变量。流 `cin` 与标准输入设备（键盘）相关。\n\n你可以使用插入运算符（`<<`）将值输出到 `cout`，该运算符有时被读作“put\
  \ to”（放入）：\n\n![一个使用插入运算符的 cout 语句。](img/9781284166033_CH04_PRE3.jpg)\n\n描述\n\n\
  类似地，你可以使用提取运算符（`>>`）从 `cin` 输入数据，该运算符有时被读作“get from”（取出）：\n\n![一个使用提取运算符的 cin 语句。](img/9781284166033_CH04_PRE4.jpg)\n\
  \n描述\n\n当计算机执行此条语句时，它会输入你在键盘上输入的下一个数字（例如 425），并将其存储在变量 `cost` 中。\n\n提取运算符 `>>` 需要两个操作数。它的左侧操作数是一个流表达式（在简单的情况下，就是变量\
  \ `cin`）。它的右侧操作数是一个用于存储输入数据的变量。目前，让我们假设变量是简单类型（`char`、`int`、`float` 等）。在本章稍后部分，我们将讨论字符串数据的输入。\n\
  \n你可以在一个语句中多次使用 `>>` 运算符。每次出现都会从流中输入下一个数据项。例如，以下语句之间没有区别：\n\n![在语句中多次使用提取运算符。](img/9781284166033_CH04_PRE5.jpg)\n\
  \n描述\n\n与以下语句对相等：\n\n![编写前述语句的另一种方式。](img/9781284166033_CH04_PRE6.jpg)\n\n描述\n\n\
  在一个语句中编写一系列提取操作只是更方便。\n\n起初，很容易混淆提取运算符（`>>`）和插入运算符（`<<`）。这里有一个记忆它们如何区分的方法：以 `cin`\
  \ 或 `cout` 开始语句，并使用指向数据流向方向的运算符。以下语句\n\n![一个输出语句。](img/9781284166033_CH04_PRE7.jpg)\n\
  \n描述\n\n将数据从变量 `someInt` 发送到输出流。以下语句\n\n![一个输入语句。](img/9781284166033_CH04_PRE8.jpg)\n\
  \n描述\n\n将数据从输入流发送到变量 `someInt`。接下来的程序演示了 `cin` 和 `cout` 的用法。\n\n![演示 cin 和 cout\
  \ 用法的程序。](img/9781284166033_CH04_UFIG148-1.jpg)\n\n描述\n\n这是输出结果，用户输入的数据已高亮显示：\n\n\
  ![前述程序的输出。](img/9781284166033_CH04_UFIG148-2.jpg)\n\n描述\n\n这里是输入语句的语法模板：\n\n![输入语句的语法模板。](img/9781284166033_CH04_UFIG148-3.jpg)\n\
  \n描述\n\n与输出语句中的项（可以是表达式）不同，输入语句中的项可以是变量。为什么？因为输入语句需要一个地方来存储输入的值。只有变量能够在程序运行时获得新值。\n\
  \n在键盘上输入数据时，你必须确保每个值符合其数据类型。\n\n\n\n\n\n# 读取标记与换行符\n\n为了更好地解释流式输入，我们引入了“读取标记”（reading\
  \ marker）的概念，它负责跟踪输入流中计算机应该继续读取的位点——即下一个要读取的字符。提取运算符 `>>` 在执行后后，会将读取标记停留在最后一次输入数据之后的字符上。\n\
  \n每行输入都有一个不可见的行结束符（或称换行符），它告诉计算机某行从哪里结束，下一行从哪里开始。为了找到下一个输入值，`>>` 运算符会在必要时跨越这些行边界。\n\
  \n换行符从哪里来呢？当你通过键盘输入数据时，每按一次 Return 或 Enter 键，就会生成一个换行符。当你的程序在输出流中插入 `endl` 操纵符时，也会生成换行符。你也可以使用\
  \ `\\n` 在输出中插入换行符。`endl` 和 `\\n` 都会告诉屏幕光标移动到下一行。\n\n让我们来看一些使用读取标记和换行符输入的示例。在下表中，`i`\
  \ 是一个 `int` 变量，`ch` 是一个 `char` 变量，而 `x` 是一个 `float` 变量。输入语句产生了所示的结果。用彩色打印的输入流部分是输入语句提取的内容。由阴影块表示的读取标记指示了下一个等待读取的字符。`\\\
  n` 表示换行符。\n\n![列出使用读取标记和换行符输入的示例的表格](img/9781284166033_CH04_UTAB150-1.jpg)![列出使用读取标记和换行符输入的示例的表格](img/9781284166033_CH04_UTAB151-1.jpg)\n\
  \n描述\n\n# 使用 get 函数读取字符数据\n\n正如我们所讨论过的，`>>` 运算符在寻找输入流中的下一个值时，会跳过任何前导空白字符。假设 `ch1`\
  \ 和 `ch2` 是 `char` 变量，且程序执行了以下语句：\n\n![一个输入语句。](img/9781284166033_CH04_PRE9.jpg)\n\
  \n描述\n\n如果输入流包含：\n\n![上一个代码提供的输入。](img/9781284166033_CH04_PRE10.jpg)\n\n描述\n\n那么提取运算符会将\
  \ 'R' 存储在 `ch1` 中，跳过空格并将 '1' 存储在 `ch2` 中。（注意 `char` 值 '1' 等同于 `int` 值 1。二者在计算机内存中以不同的方式表示。提取运算符会根据需要对输入流中的相同字符序列进行不同的解释，以填充不同类型的变量。）\n\
  \n如果我们想从输入行中输入三个字符，其中一个空格，会怎样？使用提取运算符是无法实现的，因为它会跳过空格。\n\n`istream` 数据类型提供了另一种读取字符数据的方法：`get`\
  \ 函数会输入输入流中的紧下一个字符，而不会跳过空白字符。该函数调用如下：\n\n![对 get 的调用。](img/9781284166033_CH04_PRE11.jpg)\n\
  \n描述\n\n`get` 函数与 `cin` 对象相关，因此我们使用点操作符来调用函数。（回想一下我们在第 3 章中使用了点操作符来调用与字符串对象相关的某些函数。在本章稍后的部分，我们将更深入地研究点操作符。）注意\
  \ `get` 使用的是调用 void 函数的语法，而不是返回值的函数。函数调用是一个语句，而不是表达式的一部分。\n\n该函数调用的效果是输入流中等待的下一个字符——即使它是空白字符——并将其存储在变量\
  \ `somechar` 中`get` 函数的参数必须是一个变量，因为它的目的是接收输入字符作为新值。\n\n以下程序演示了如何使用 `get` 函数读取三个字符并将它们存储在三个不同的地方。\n\
