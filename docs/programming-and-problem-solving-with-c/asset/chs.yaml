  \n描述\n\n`#include` 语句指示 C++ 系统将名为 `iostream` 和 `string` 的文件内容插入到程序中的这些位置。`iostream`\
  \ 文件包含了我们向如 `cout` 流输出值所需的 C++ 代码函数和数据对象。第二个文件包含了处理 `string` 类型所需的代码。插入发生在编译器开始翻译之前，因此它会将插入的代码与我们的代码一起进行翻译。我们在本章稍些后进一步讨论这些\
  \ `#include` 行和 `using` 语句。\n\n\n\n\n\n接下来是一个声明部分，我们在其中定义了常量 `FIRST`、`LAST` 和 `MIDDLE`。注释解释了每个标识符的用法。程序的其余部分是主函数\
  \ `main` 的函数定义。第一行是函数头：保留字 `int`、函数名，然后是左括号和右括号。（括号表示 `main` 是一个函数的名称，而不是变量或常量。）函数体包含了两个变量\
  \ `firstLast` 和 `lastFirst` 的声明，随后是一系列可执行语句的列表。\n\n我们的 `main` 函数通过返回 `0` 作为函数值来结束：\n\
