  \ 现在被封装在一个集合中，使用户可以轻松操作它。最后，我们调用 GUI 的 `show()` 方法来渲染界面。因此，我们调用 `exec()` 方法启动事件循环。这里是\
  \ `main` 的完整代码：\n\n![一个程序段。](img/9781284166033_CH14_P868-3.jpg)\n\n描述\n\n![程序段的延续。](img/9781284166033_CH14_P869-1.jpg)\n\
  \n描述\n\n除了 GUI 提供的插入和删除支持外，正确设计它还可以确保我们不会构建缺失数据的条目。我们已经看到时间控件的设计强制我们拥有一个有效的时间。但我们也不希望创建一个没有名字或姓氏的条目。与时间控件不同，名、中间名姓文本框没有默认值，因此我们必须作为自定义\
  \ GUI 设计的一部分来强制这一点。\n\n当点击任何按钮时，自定义 GUI 会检查文本框，以确保在调用 `EventHandlers` 类相应的方法之前每个框中都输入了内容。GUI\
  \ 的自定义验证检查将在下一章介绍。以下是如果任何文本框为空，GUI 显示的消息消息示例：\n\n![一个标记为 Sorted Entries List 的 窗口。](img/9781284166033_CH14_P869-2.jpg)\n\
  \n描述\n\n### 测试与调试\n\n一种常见的错误——在堆上留下不可访问的对象——通常由于浅拷贝操作或对 `new` 运算符的不当使用引起。在图 4.6\
  \ 中，我们展示了内置赋值运算符会导致浅拷贝；原本指向一个指针变量的动态数据对象保持分配状态，但无法访问。误用 `new` 运算符也会导致动态数据无法访问。例如，执行以下代码段\n\
  \n![一个代码段。](img/9781284166033_CH14_P870-1.jpg)\n\n描述\n\n创建了一个不可访问的对象：包含 38.5 的动态变量。问题是我们在最后一条语句中为\
  \ `floatPtr` 赋值了新值，而没有先释放它指向的变量。为了防止此类错误，请检查代码中每个使用 `new` 运算符的地方。如果关联变量当前指向数据，请在执行\
  \ `new` 操作之前删除所指向的数据。\n\n\n\n最后，悬空指针是错误的来源，并且难以检测。悬空指针的一个原因是：释放了被多个指针指向的动态数据对象。图\
  \ 14.2D 和 14.2E 描绘了这种情况。悬空指针的另一个原因是从函数返回指向自动变量的指针。以下函数返回类型 `int` 的函数值，它是错误的：\n\n\
  ![一段代码片段。](img/9781284166033_CH14_P870-2.jpg)\n\n描述\n\n请记住，自动变量在进入块时隐式创建，在退出块时隐式销。前面的函数返回指向局部变量\
  \ `n` 的指针，但一旦控制权离开函数，`n` 就会消失。因此，函数的调用者将接收到一个悬空指针。悬空指针之所以危险，与未初始化指针危险相同：当你的程序引用错误的指针值时，它将访问内容未知的内存位置。\n\
  \n测试和调试链式结构之所以复杂，是因为结构中的每个项不仅包含数据部分，还包含指向下一个的链接。算法必须正确考虑到数据和链接。\n\n### 测试与调试提示\n\
  \n1.  函数不能返回指向自动局部数据的指针；否则会导致悬空指针。\n\n2.  如果 `ptrA` 和 `ptrB` 指向同一个动态数据对象，语句\n\n\
  \    ![一个语句。删除, int p t r A, 逗号。](img/9781284166033_CH14_P870-2.jpg)\n\n    会让 `ptrB`\
  \ 变成一个悬空指针。你现在应该给 `ptrB` 赋值为 `NULL`，而不是让它悬空。\n\n3.  在不再需要时释放动态数据。内存泄漏可能会导致你耗尽内存空间。\n\
  \n4.  不可访问的对象——内存泄漏的另一个原因——是由于：\n\n    1.  对指向动态数据的指针进行浅拷贝。在设计数据成员指向动态数据的 C++ 类时，务必提供深拷贝操作和拷贝构造函数。\n\
  \n    2.  当关联变量已经指向动态数据时，使用 `new` 操作。在执行 `new` 之前，使用 `delete` 释放当前指向的数据。\n\n5. \
  \ 确保动态链表中最后一个节点的 `link` 成员已设置为 `NULL`。\n\n6.  在访问动态链表中的组件时，要以这种方式测试列表的末尾，确保你不会尝试引用\
  \ `NULL` 指针。在许多系统中，引用 `NULL` 指针会导致运行时错误。\n\n7.  确保初始化指向每个动态数据结构的外部指针。\n\n8.  不要使用\n\
  \n    ![一个语句。c u r r P t r, 加 Plus Plus, 逗号。](img/9781284166033_CH14_P871-1.jpg)\n\
  \n    来让 `currPtr` 指向动态链表中的下一个节点。链表节点在堆上并不一定处于连续的内存位置。\n\n9.  密切跟踪指针。过早更改指针值可能会在你尝试访问所指向的变量时引起问题。\n\
  \n10. 如果一个指向动态数据的 C++ 类有类析构函数但没有拷贝构造函数，请勿使用值传递的方式将类对象传递给函数。这将发生浅拷贝，参数和参数将指向同一个动态数据。当函数返回时，参数的析构函数被执行，从而破坏参数的动态数据。\n\
  \n11. `delete` 运算符必须应用于值之前由 `new` 返回的指针。此外，`delete` 操作后，指针变量的值变为未定义；在为其分配新值之前，不要再次使用该变量。\n\
  \n12. 函数不能返回指向自动局部数据的指针；否则会导致悬空指针。\n\n### 总结\n\n指针的一个强大用途是创建动态变量。虽然指针变量可以在编译时声明，但指针指向的数据仅在运行时创建。内置运算符\
  \ `new` 在自由存储区（堆）上创建一个变量，并返回该变量的地址存储在指针变量中。动态变量没有名称，而是通过指针变量进行访问。\n\n使用动态数据可以节省内存空间，因为变量只在运行时需要时才创建。当动态变量不再需要时，可以释放它（使用\
  \ `delete`）并重用内存空间。在排序大型结构时，使用动态数据还可以节省机器（计算）时间。通过这种方法，我们只需要重新排列大型结构的指针，而不是大型结构本身。\n\
  \n当 C++ 类对象指向自由存储区上的数据时，区分浅拷贝和深拷贝操作非常重要。将一个类对象拷贝到另一个对象的浅拷贝只拷贝指针，导致两个类对象指向同一个动态变量。深拷贝则产生被指向数据的两个独立副本。操作动态数据的类通常需要一套完整的支持例程：一个或多个构造函数、一个析构函数（用于清理自由存储区）、一个深拷贝操作和一个拷贝构造函数（用于在一个类对象初始化另一个类对象时进行深拷贝）。\n\
  \n动态数据结构在运行时增长和收缩。它们由包含两种成员的节点组成：(1) 组件和 (2) 指向相同类型的多个指针。指向第一个节点的指针保存在外部指针中。\n\n\
  \n\n正如你现在所了解的，函数式分解是一种将问题分解为多个模块的方法，每个模块解决整个问题的一个部分。实现函数式分解的过程通常被称为`结构化`（或`过程化`）编程。某些模块被直接翻译为\
  \ `C++` 语句，而另一些则被编码为函数。生成的程序是一系列相互作用的集合（参见 [图 15.1**]）。在函数式分解中，数据被视为等待处理的被动实体。\n\
  \n函数式分解对于小型编程来说是满意的（这是我们在第 4 章中讨论过的一个概念），但通常无法扩展到大型程序设计。当我们构建大型软件系统时，这种方法有两个重要的局限性。首先，它产生了一种缺乏性的结构。如果顶层算法需要修改，这些更改可能会强制许多低级算法也进行修改。其次，该技术产生的代码难以在程序的其他部分或其他程序中复用。很难获取一个复杂的\
  \ `C++` 函数并在不同的语文中轻松地复用它。\n\n创建大型软件系统的更好方法是面向对象设计（OOD），我们已经在第 4 章中简要介绍过它。OOD 将问题分解为对象——由数据和对数据的操作组成的自包含实实体。实现面向对象设计的过程被称为`面向对象编程\
  \ (OOP)`。最终结果是一个由相互作用的对象组成的程序（参见 [图 15.2**]）。在 OOD 和 OOP 中，数据起主导作用；算法的主要贡献是实现对象上的操作。在本章中，我们将看到为什么\
  \ OOD 倾向于产生更容易复用的代码。\n\n![3 个为 function 的块被包含在一个标记 program 的块中。](img/9781284166033_CH15_FIGF01.jpg)\n\
  \n图 15.1 函数式分解产生的程序\n\n许多编程语言已经支持 OOD 和 OOP：`C++`、`Java`、`C#`、`Swift`、`Python` 等。这些面向对象的编程语言具有支持以下内容的设施：\n\
  \n* 数据抽象\n* 继承\n* 动态绑定\n\n你已经看到 `C++` 通过类机制支持数据抽象。一些非 OOP 语言也具有数据抽象的设施，但只有 OOP 语言支持继承和动态绑定。\n\
  \n![4 个标记为 object 的圆被包含在一个标记 program 的块中。对象是操作和数据的集合。](img/9781284166033_CH15_FIGF02.jpg)\n\
  \n图 15.2 面向对象编程产生的程序\n\n## 15.2 继承\n\n在现实世界中，通常可以将概念排列成继承层次结构——即一种层次结构，其中每个概念继承其在层次结构中正上方概念的属性。例如，我们可以根据\
  \ [图 15.3**] 所示的继承层次结构对不同类型的车辆进行分类。沿着层次结构向下，每种车辆都比其父类（以及所有祖先）更具专门性，比其子类（以及所有后代）更通用。轮式继承了所有车辆共有的属性（它承载一个或多人并将他们从一个地方运到另一个地方），但还有一个使其更专门的属性（它有轮子）。汽车继承了所有轮车辆共属性，但也具有其他更专门的属性（四个轮子、发动机、车身等）。\n\
  \n继承关系可以看作是一种“是一个”（is-a）的关系。每辆双门汽车都是汽车，每辆汽车都是轮车辆，每辆轮车辆都是车辆。这种概念与组合原则不同，在组合中，一个对象包含在另一个对象内部。组合是一种“拥有一个”（has-a）的关系：包含对象拥有一个作为另一个对象的成员。\n\
  \n为了更好地理解继承的原理，让我们看看建筑师工作与程序员工作之间的类比。建筑师处理大型建筑设计复杂性的方式为我们如何组织自己的编程工作提供了一些启发。这个类比让我们能够考虑相同的概念，但没有\
  \ `C++` 语法的干扰。\n\n![一个层次结构图使用车辆解释了继承的概念。](img/9781284166033_CH15_FIGF03.jpg)\n\n\
  图 15.3 继承层次结构\n\n描述\n\n### 类比\n\n建筑师首先考虑建筑的整体需求：面积、人数、用途等。建筑师面临着任何设计中的一个基本方面：建筑由楼层组成。在许多建筑中，楼层都具有共同特征：相同的尺寸和形状；相同的电梯井、楼梯和公用主干道的位置；等等。建筑师从设计一个带有这些共同元素的空空层开始。一旦她将此计划安装到她的计算机辅助设计\
  \ (`CAD) 程序的库中，她就可以将其作为设计每层楼的起点。\n\n建筑师可能进一步决定建筑有两个主要类型的楼层：办公楼和设备楼。办公楼可能是两种类型：高管办公室和标准办公空间。从空楼开始，建筑师添加了洗手间和走廊等组件来制作一个空办公室。这样，四种类型的楼层中的每种都从空楼派生并添加到库中（参见\
  \ [图 15.4**]）。然后描绘整座建筑就变成了为每一层创建这些楼层设计中的一个实例。\n\n建筑师使用相同的过程来设计组成楼层的组件。她可能会设计一种基础类型的办公室，然后从该设计中派生出几种类型的办公室。从给定的某种类型办公室（例如秘书室），她可能进一步将设计细化为子类型，如普通秘书、秘书/接待员和高管秘书。\n\
  \n为创建设计的层次结构简化了建筑师的工作。她每个层次结构都从建筑组件的最通用形式开始，例如基础空楼，然后通过向更通用的形式添加细节来派生新设计。新设计继承了通用形式的所有特征，使建筑师无需重绘这些共同部分。在某些情况下，她会替换设计中的现有部分，例如当为接待区域换一个比基础秘书办公室显示的更宽门时。替换的部分覆盖了最初在更通用形式中指定的内容。\n\
  \n除了单个楼层的组件外，建筑师还可以指定所有楼层共有的特征，例如颜色方案。每个楼层将继承这些通用属性。有时她会隐藏或删除通用属性的部分，例如当她为一家拥有自己公司颜色的预租特定楼层定制颜色方案时。\n\
  \n![6 个插图解释了楼层类型的层次结构。](img/9781284166033_CH15_FIGF04.jpg)\n\n图 15.4 楼层类型的层次结构\n\
  \n\n\n\n现在，让我们考虑在面向对象的设计过程中类层次结构是如何产生的。在解决问题的阶段，我们发现自己需要一个现有类的变体类。例如，在第 14 章的案例研究中，我们发现第\
  \ 12 章中的`Entry` 类是合适的，但注意到它缺少一个 `ComparedTo` 成员函数。我们还决定该类应该有一个第二个带参数的构造函数，接受一个 `Name`\
  \ 对象和一个 `TimeOfDay` 对象作为参数。\n\n我们通过复制 `Entry` 的代码来解决这个问题，然后使用该副本创建一个具有额外职责的新类。结果是生成了两个名为\
  \ `Entry` 但它们互不相关的类。以后，如果我们在原始的 `Entry` 类中发现了 bug，我们必须记住检查扩展类中是否存在相同的 bug。但是，如果对原始类的修复或改进能够自动传播到任何派生类，那不是很好吗？\n\
  \n我们可以通过将 `Entry` 变为一个`base class`（基类）或 `superclass`（父类），并将另一个类定义为 `Entry` 的`derived\
  \ class`（派生类）或 `subclass`（子类）来实现这一目标。例如，如果我们向 `Entry` 添加一个电子邮件字段和职责，`inheritance`（继承）属性会导致它被自动添加到所有派生类中。\n\
  \n通常，你可以选取一个现有的类 `A` 作为基类，并在此创建一个新类 `B` 作为派生类。派生类 `B` 继承其基类 `A` 的属性。这样做，为 `A` 定义的数据和操作就变成了\
  \ `B` 的预定义。（注意这种 is-a 关系——每个 `B` 也是一个 `A`。）然后你对类 `B` 进行特化，在继承自 `A` 的属性基础上添加属性。为了了解这个过程是如何工作的，让我们来看一个\
  \ C++ 示例。\n\n### 从另一个类派生出一个类\n\n让我们用继承来解决 `Entry` 问题；即，让我们创建一个 `ExpandedEntry` 类，它具有\
  \ `ComparedTo` 函数和额外的带参数构造函数。以下是新类的规范文件：\n\n![一段代码片段。](img/9781284166033_CH15_P889.jpg)\n\
  \n语句\n\n```cpp\nclass ExpandedEntry : public Entry\n```\n\n表示 `ExpandedEntry` 派生自\
  \ `Entry`。保留字 `public` 声明 `Entry` 为 `ExpandedEntry` 的公共基类。结果是，`Entry` 的所有公共成员（构造函数除外）也是\
  \ `ExpandedEntry` 的公共成员。换句话说，`Entry` 的成员函数 `GetNameStr` 和 `GetTimeStr` 也可以为 `ExpandedEntry`\
  \ 对象调用。然而，`ExpandedEntry` 的公共部分通过添加 `ComparedTo` 函数和额外的构造函数对基类进行了特化。这种关系如图图 15.5\n\
  \n图 15.5 `ExpandedEntry 类`的类接口图\n\n图 15.5 显示每个 `ExpandedEntry` 对象都是一个 `Entry` 对象，并且更多。C++\
  \ 使用“base class”和“derived class”来代替“superclass”和“subclass”。“superclass”和“subclass”这些术可能会引起混义，因为“sub”通常意味着更小的东西（例如，数学集合的子集）。相反，子类通常比其父类拥有更多的数据和或函数。\n\
  \n图 15.5 在两个标记为 `GetNameStr` 和 `GetTimeStr` 的椭圆之间有箭头。由于 `Entry` 是 `ExpandedEntry`\
  \ 的基类，并且 `GetNameStr` 和 `GetTimeStr` 没有被 `ExpandedEntry` 重定义，因此 `ExpandedEntry`\
  \ 客户端可两个函数与 `Entry` 中的函数相同。我们使用相应椭圆之间的箭头来指示这一事实。（注意图 15.5，`Entry` 的构造函数是针对 `Entry`\
  \ 的操作，而不是针对 `ExpandedEntry` 的。`ExpandedEntry` 类必须有自己的构造函数。）\n\n### ExpandedEntry\
  \ 类的规范\n\n以下是带有默认构造函数的 `ExpandedEntry` 类的完整文档规范。注意预处理器指令\n\n```cpp\n#include \"\
  Entry.h\"\n```\n\n对于编译器验证派生类与其基类的一致性是必要的。\n\n### ExpandedEntry 类的实现\n\n当 `ExpandedEntry`\
  \ 类初始化时，基类 `Entry` 的构造函数会被调用。为了让 `Entry` 更加可用，我们应该添加 getter 函数：`GetTime` 和 `GetName`。\n\
  \n我们使用 `GetTime` 来访问实例中的时间。为了获取参数中的时间，必须显式地对其应用 `GetTime`。由于我们正在向类中添加 getter 函数，可以移除返回字符串格式名称和时间的函数。这样用户将拥有自己格式化名称和时间的工具。\n\
  \n\n\n\n这种经历说明了为什么面向对象设计中的一个重要方面是为类的重用做提前计划。如果我们最初设计 `Entry` 时能用更通用的术语来考虑它，我们就会包含这些\
  \ getter 函数。继承使得通过扩展类来重用变得如此容易，以至于我们几乎总是对设计进行泛化，以最大化其未来重用的潜力。\n\n现在我们可以为 `ExtendedEntry`\
  \ 编写实现文件了。当你查看此文件时，请注意要用此新功能扩展基类所需的额外代码有多少。这正是面向对象编程中使用继承的意义所在。\n\n![一段程序片段。](img/9781284166033_CH15_P894-1.jpg)\n\
  \nDescription\n\n我们将文件 `ExpandedEntry.cpp` 编译成目标代码文件——例如，`ExpandedEntry.obj`。接下来，我们编写一个测试驱动程序并编译为\
  \ `test.obj`。然后，开发环境通过将这两个文件与现有的 `Entry.obj` 文件链接，来创建一个可执行文件。\n\n我们终于准备好测试生成的程序了。这里是用于测试第\
  \ 13 章中修订后的 `Entry` 类的测试驱动代码，随后是它的输出。\n\n![一段程序片段。](img/9781284166033_CH15_P895.jpg)\n\
  \nDescription\n\n![一段程序片段的延续。](img/9781284166033_CH15_P896.jpg)\n\nDescription\n\
  \n输出：\n\n![一段程序片段的输出。](img/9781284166033_CH15_P896-1.jpg)\n\nDescription\n\n通过继承扩展基类的奇妙之处在于，假设基类已经具备了必要的\
  \ getter 操作，则无需修改基类。如果这些操作已经存在于 `Entry` 类中，我们就可以在不访问 `Entry` 代码的情况下实现 `ExtendedEntry`。C++\
  \ 编译器能够从基类的规范文件中获取其所需的所有信息，而无需重新编译其实现文件。然后，链接器将派生类的目标代码与基类的现有目标代码相结合，从而生成可执行文件。\n\
  \n`Entry` ADT（抽象数据类型）的进一步变体可以以创建者从未考虑过的方式创建。像 `Entry` 这样的类可以在许多不同的上下文中不经修改地使用，也可以通过继承来适应特定的上下文。继承允许我们创建可扩展的数据抽象——派生类通常通过包含额外的私有数据、公共操作或两者都有来扩展基类。\n\
  \n### 构造函数的执行顺序\n\n在讨论了继承和组合之后，我们可以对构造函数的执行顺序给出完整的描述：\n\n给定一个类 `X`，如果 `X` 派自基类 `Y`：\n\
  \n1. 首先执行基类 `(Y)` 构造函数。\n2. 接着执行 `X` 的成员对象（如果有）的构造函数。\n3. 最后执行 `X` 构造函数的体。\n\n例如，当创建一个\
  \ `ExtendedEntry` 对象时，首先调用 `Entry` 类的构造函数。此操作触发了对其 `Name` 和 `TimeOfDay` 成员构造函数的调用。之后，执行\
  \ `Entry` 构造函数的体，该体是空的。然后执行 `ExtendedEntry` 构造函数的体，它恰好也是空的。\n\n1 如果类声明省略了 `public`\
  \ 关键字并起始如下：\n\n```\nclass DerivedClass : BaseClass\n```\n\n或者如果显式地使用了 `private`\
  \ 关键字，\n\n```\nclass DerivedClass : private BaseClass\n```\n\n那么 `BaseClass` 被称为\
  \ `DerivedClass` 的私有基类。`BaseClass` 的公共成员不是 `DerivedClass` 的公共成员；也就是说，`DerivedClass`\
  \ 的客户端不能在 `DerivedClass` 对象上调用 `BaseClass` 操作。本文中不处理私有基类。\n\n## 15.3 动态绑定与虚函数\n\n\
  在本章开头，我们提到面向对象编程语言提供了支持三个概念的语言特性：数据抽象、继承和动态绑定。数据抽象是通过类结构实现的；我们刚刚涵盖了继承。现在我们涵盖动态绑定。\n\
  \n“动态绑定”这一术语更具体地说，是指“操作对对象的动态绑定”。为了解释这个概念，让我们来看一个例子。给定本章描述的 `TimeOfDay` 和 `ExtTime`\
  \ 类，以下代码创建四个类对象并使用 `ComparedTo` 函数对它们进行比较：\n\n![一段代码片段。](img/9781284166033_CH15_P903.jpg)\n\
  \nDescription\n\n这段代码片段调用了两个不同的 `ComparedTo` 函数，尽管它们名称相同。第一次调用的是 `TimeOfDay` 的 `ComparedTo`；第二次调用的是\
  \ `ExtTime` 的 `ComparedTo`。在这个代码片段中，编译器使用静态（编译时）绑定来确定调用哪个 `ComparedTo` 函数。\n\n在某些情况下，编译器无法确定类型，因此操作的绑定必须在运行时发生。一种情况是作为参数传递对象。C++\
  \ 关于传递对象的基本规则是参数和参数类型必须相同。通过继承，C++ 在某种程度上放宽了这一规则。你可以将派生类对象传递给基类参数，但反之则不然——你不能将基类对象作为参数传递给派生类型。更通常，你可以将子类的对象传递给基类的参数。这种规则非常有用：它允许我们编写适用于任何子类的函数，而不是为每个类编写不同的函数。\n\
  \n例如，假设 `TimeOfDay` 和 `ExtTime` 都有 `Write` 函数。我们可以写一个 `Print` 函数，将 `TimeOfDay` 类型或任何派自\
  \ `TimeOfDay` 的类的对象作为参数：\n\n![一段代码片段。](img/9781284166033_CH15_P903-1.jpg)\n\nDescription\n\
  \n![一段代码片段的延续。](img/9781284166033_CH15_P904.jpg)\n\nDescription\n\n![一段代码片段的延续。](img/9781284166033_CH15_P904-1.jpg)\n\
  \nDescription\n\n编译器允许我们将 `TimeOfDay` 对象或 `ExtTime` 对象传递给 `Print` 函数。然而，当输出 `endTime`\
  \ 时，输出中缺少了区 `CST`。让我们看看为什么。\n\n# 切片问题\n\n`Print` 对参数 `time` 使用值传递。当你使用值传递将派生类对象传递给其基类对象时，只会复制它们共同的数据成员。记住，派生类通常比其基类“大”——也就是说，它包含了额外的成员。`TimeOfDay`\
  \ 对象有三个数据成员（`hours`、`minutes` 和 `seconds`），但 `ExtTime` 对象有四个数据成员（`hours`、`minutes`、`seconds`\
  \ 和 `zone`）。当较大的类对象通过值传递复制到较小的参数时，额外的数据成员会被丢弃或“切掉”。这种情况被称为切片问题（参见**图 15.7**）。\n\n\
  切片问题也会发生在赋值操作中。在语句中\n\n\n\n\n\n![一个语句。基类对象，equals，派生类对象，分号。](img/9781284166033_CH15_P904-2.jpg)\n\
  \n只有两个对象共有的数据成员会被拷贝。`derivedClassObject` 中包含的额外数据成员不会被拷贝。\n\n通过引用传递时，不会发生切片（slicing）问题，因为调用者参数的地址会被发送到函数。为了查看这种方法是如何工作的，让我们修改\
  \ `Print` 函数的头部，使 `someEntry` 成为引用参数：\n\n![一个函数头部。Void, Print，左括号，Time of Day，&\
  \ 符号，time，右括号。](img/9781284166033_CH15_P904-3.jpg)\n\n现在当我们把 `endTime` 作为参数传递时，它的地址会被发送到函数。它的\
  \ `ExtTime` 区域成员不会被切片，因为没有发生任何拷贝。但 `Print` 函数仍然只输出 `endTime` 的三个数据成员——`hours`、`minutes`\
  \ 和 `seconds`。让我们来看看为什么。\n\n在 `Print` 函数内部，语句中使用了静态绑定：\n\n![一个语句。Time 点 write，左括号，右括号，分号。](img/9781284166033_CH15_P904-4.jpg)\n\
  \n```\ntime.write();\n```\n\n编译器必须在编译时为 `Print` 生成对象代码，但实际参数的类型（`TimeOfDay` 或 `ExtTime`）直到运行时未知。编译器如何知道应该使用哪一个\
  \ `Write` 函数——`TimeOfDay::Write` 还是 `ExtTime::Write`？编译器无法得知，所以它使用了 `TimeOfDay::Write`，因为参数\
  \ `time` 的类型是 `TimeOfDay`。因此，无论参数类型如何，`Print` 函数始终只输出三个值——`hours`、`minutes` 和 `seconds`。幸运的是，C++\
  \ 为切片问题提供了解决方案：虚函数。\n\n![两个圆形图解释了切片问题。](img/9781284166033_CH15_FIGF07.jpg)\n\n图\
  \ 15.7 按值传递导致的切片问题结果\n\n描述\n\n# 虚函数\n\n要使函数变为虚函数，我们需要对 `TimeOfDay` 类声明进行一个微小的更改：我们在\
  \ `Write` 函数的声明开头加上关键字 `virtual`。\n\n![一个代码片段。](img/9781284166033_CH15_P905.jpg)\n\
  \n描述\n\n将成员函数声明为 `virtual` 会指示编译器生成代码，以确保函数到对象的 `dynamic`（运行时）`binding`；也就是说，调用哪个函数的决定被推迟到运行时。（注意，要使\
  \ `Write` 成为虚函数，`virtual` 词只出现一次——在 `TimeOfDay` 类声明中。它不会出现在位于 `TimeOfDay.cpp` 文件中的\
  \ `Write` 函数定义，也不会出现在任何重定义 `Write` 函数的派生类——例如 `ExtTime`——中。）\n\n虚函数的工作方式如下：如果类对象通过引用传递给某个函数，并且该函数的体包含一个语句：\n\
  \n![一个语句。param 点 Member F u n c，左括号，点、点、点，右括号，分号。](img/9781284166033_CH15_P906.jpg)\n\
  \n```\nparam.MemberFunc();\n```\n\n1. 如果 `MemberFunc` 不是虚函数，则由参数类型决定调用哪个函数。（使用静态绑定。）\n\
  2. 如果 `MemberFunc` 是虚函数，则由参数类型决定调用哪个函数。（使用动态绑定。）\n\n只需增加一个词——`virtual`，我们在 `Print`\
  \ 函数中遇到的困难就完全消失了。如果我们在 `TimeOfDay` 类中将 `Write` 声明为虚函数，那么函数\n\n![一个代码片段。](img/9781284166033_CH15_P906-1.jpg)\n\
  \n```\nvoid Print(TimeOfDay &time) {\n    time.write();\n    // ...\n}\n```\n\n\
  对于 `TimeOfDay` 类型或 `ExtTime` 类型的参数都能正确工作。之所以调用正确的 `Write` 函数（`TimeOfDay::Write`\
  \ 或 `ExtTime::Write`），是因为参数包含了运行时选择适当函数所需的信息。通过这种方法，从 `TimeOfDay` 派生一个全新的、意料之外的类不会产生复杂性。如果新类重定义了\
  \ `Write` 函数，我们的 `Print` 函数仍然可以正常工作。动态绑定确保每个对象都知道如何输出自己，并调用相应的版本。在 OOP 术语中，`Write`\
  \ 是一个`polymorphic operation`多态操作——一种根据运行时遇到的对象类型具有不同含义的操作。\n\n以下是在 C++ 中使用虚函数的一些要点：\n\
  \n1. 为了实现动态绑定，将类对象传递给函数时必须使用引用传递。如果你按值传递，编译器将不使用 `virtual` 机制；相反会发生切片。\n2. 在虚函数的声明中，`virtual`\
  \ 词只出现在基类中，而不出现在任何派生类中。\n3. 如果基类声明了虚函数，它必须实现它，即使体是空的。\n4. 派生类不需要提供虚函数自身的重新实现。在这种情况下，默认使用基类的版本。\n\
  5. 派生类不能重定义虚函数的返回类型。\n\n## 15.4 面向对象设计\n\n现在我们已经看到了实现面向对象设计的语言特性，让我们转向设计阶段本身。\n\n\
  程序通常模拟某种现实世界的活动或概念。例如，银行程序模拟与银行相关的现实活动。电子表格程序模拟真实的电子表格，这是过去会计师使用的大型纸质表格。某些机器人程序模拟人类的感知和动作。\n\
  \n几乎总是，我们建模的世界方面由对象组成——账户、银行柜员、表格行、表格列、机器人手臂、机器人腿。OOD 基于一种哲学：如果代码中的主要对象与问题中的对象对应，那么程序将更容易编写和理解。程序员随后关注如何使用语言提供的数据类型和操作来更好地表示真实世界对象。\n\
  \nOOD 可以遵循不同的路径。不同的软件工程研究人员提倡不同的技术。这里的目的不是教你一种详细的技术，也不是总结所有的技术。相反，我们将向你介绍一个直接的四阶段过程，它捕捉了\
  \ OOD 的本质。这四个阶段是头脑风暴、过滤、场景探索和责任算法设计。\n\n\n\n\n场景探索是确定每个类行为的阶段。因为一个类负责它自己的行为，我们把这些行为称为职责。（你已经见过这种术语的使用了。回想一下，我们曾将\
  \ getter 函数称为“知识职责”。）在这个阶段，我们探索“如果……会怎样”的问题，以确保我们已经检查了所有情况。当每个类的所有职责都确定后，它们会被记录在类的\
  \ CRC 卡片上。我们还会记录该类为了完成每项职责必须协作（交互）的其他任何类的名称。\n\n在最后一个阶段——职责算法设计中，我们为 CRC 卡片上列出的每项职责编写算法。这一阶段与功能分解中发生的情况非常相似。\n\
  \n![一个包含 10 行的表格。](img/9781284166033_CH15_FIGF08.jpg)\n\n图 15.8 一个空白的 CRC 卡片\n\n\
  描述\n\n然而，在许多情况下，职责算法非常简单，没有必要进一步分解，我们可以直接开始编写具体的步骤。请参阅图 15.8 的 CRC 卡片示例。\n\n尽管这些技术最初是为编程团队开发的，但也可以将其应用于我们个人的思考过程。现在你已经对这种\
  \ OOD 技术如何运作有了通俗的概念，我们可以检查每个阶段的细节。\n\n### 脑风暴\n\n脑风暴到底是什么？字典将其定义为一种小组问题解决技术，涉及小组所有成员自发地贡献想法^(2)。脑风暴会联想到一群聪明的广告人，正在为一个最新革命性产品的口号而集思广益。现代软件工程项目同样涉及基于多样化团队的创意协作来开发新的创新解决方案。\n\
  \n在面向对象的问题解决背景下，脑风暴是一项小组活动，旨在产生一个候选类列表，用于解决特定问题。每个参与者都从理解需求文档以及任何与项目技术方面相关的额外信息开始。\n\
  \n这个过程与个人问题解决有什么关系？问题解决过程中的等效步骤是“理解问题”。提问；尝试用你自己的话重写问题陈述。拿一张纸并开始写下可能的类。寻找问题陈述中可能指示问题领域中对象的名词。思考用户将如何与程序交互。检查库中提供的类，看看是否有任何类在解决方案领域中有用（包括通过扩展类中的继承）。\n\
  \n当你有一份可能的类列表时，就可以进入下一个阶段：过滤。\n\n### 过滤\n\n过滤步骤产生一个更小的类列表，我们认为这些类足以解决问题。作为过滤阶段的一部分，我们可能会识别出替代方案，并选择一组对象而不是另一组。\n\
  \n例如，当我们开发高公路交通管理系统时，我们可能会将经理、司机、灯和汽车列为潜在对象。在过滤列表时，我们可能会发现问题可以通过表示经理和司机来解决，也可以通过表示信号灯和汽车来解决——但我们两者都需要。我们可能发现\
  \ C++ 标准模板库（STL）包含了我们可以使用的的对象来实现列表中的项目。\n\n某些类可能并不真正属于问题的解决方案。例如，如果我们正在编写一个计算器程序，我们可能会将用户列为问题领域中的一个对象。然而，用户并不在问题之中；用户是为程序提供输入的实体。另一个问题领域对象是“开启”按钮。稍微思考一下就会发现真实计算器的“开启”按钮实际上并不是解决方案的一部分；它是通过用户已启动应用程序这一事实来表示的。\n\
  \n### 场景探索\n\n场景探索阶段的目标是为每个类分配职责。职责每个类必须执行的任务。正如我们所看到的，职责最终实现为函数。在这个阶段，我们只关心任务是什么，而不关心它们可能如何执行。要谈论一个对象做什么，我们需要确定它的内部状态，称为它的属性。在这个阶段，我们不需要确定这些属性如何表示，只需要知道它们是什么。\n\
  \n例如，我们的 `TimeOfDay` 类有三个属性：`hours`、`seconds` 和 `minutes`。我们将它们表示为三个整数值。事实上，我们可以将时间保持为一个整数值，`seconds`。`GetHours`\
  \ 和 `GetMinutes` 就可以通过从 `seconds` 计算来返回这些值。因此，在逻辑（设计）层面，有三个值；但在实现层面，可能只有一个值。我们正在描述的过程是在设计（逻辑）层面的。\n\
  \n我们区分两种类型的职责：类必须了解关于自身的信息（知识）以及类必须能够做的事情（行为）。类封装它的数据（属性）；一个类中的对象不能直接访问另一个类中的数据。封装是抽象的关键。然而，每个类都有责任提供与其协作的类所需的关于自身信息。\n\
  \n例如，`Student` 类应该“知道”它的名字和地址。这种知识的职责可能被称为 `GetName` 和 `GetAddress`。地址是保存在 `Student`\
  \ 类中，还是 `Student` 类必须请求其他类来访问地址，这在这个阶段是不重要的。重要的事实是 `Student` 类能够访问并返回（获取）它自己的名字和地址。\n\
  \n行为的职责更像我们在功能分解中描述的任务。例如，一个学生对象需要计算它的 GPA（平均分）。在功能分解中，我们会说任务是给定数据计算 GPA。在 OOD 中，我们说学生对象负责计算它自己的\
  \ GPA，可能通过与一个包含学生成绩的对象协作来实现。\n\n这种区别既微妙又深远。计算的最终代码可能相似，但执行方式不同。在过程化设计中，`main` 程序调用计算\
  \ GPA 的函数，并将学生记录作为参数传递。在面向对象的程序中，向学生对象发送消息来计算其 GPA。没有参数，因为接收消息的对象知道它自己的数据。\n\n我们如何确定职责？这个阶段的名称为我们如何向类分配职责提供了线索。对于我们来说，场景探索是描述客户端（用户或对象）与为了实现目标必须协作的任何对象（可能包括\
  \ `main` 应用程序）之间交互的步骤序列。\n\n\n\n以下是该流程的工作原理。团队通过角色扮演来测试不同的场景。在练习过程中，团队的每个成员都扮演一个\
  \ `classes` 的角色。场景是“如果……怎么办”的脚本，允许参与者演绎不同的情况。当一个 `class` 接收到消息时，演员举起 CRC 卡并对消息做出响应，必要时可能还会向其他人发送消息。随着脚本的执行，缺失的职责会被发掘出来，不必要的职责也会被检测到。有时会产生对新\
  \ `classes` 的需求。虽然在“你”处于激活状态时在空中挥动卡片起初可能会感到有些尴尬，但当团队成员看到这种技术的有效性时，他们会很快进入状态。请参阅图\
  \ 15.9。\n\n此阶段的输出是一组 CRC 卡，代表了问题解决方案中的核心 `classes`。每个 `class` 的职责列在卡片上，并列出了每个职责必须协作的\
  \ `classes`。\n\n### 职责算法\n\n最终，必须为这些职责编写算法。因为在面向对象的设计视图中，我们关注的是数据而非动作，所以执行职责的算法通常非常短。例如，知识职责通常只需返回对象中\
  \ `variable` 的内容，或向另一个对象发送消息以检索其属性之一。动作职责则要复杂一些，通常涉及计算。因此，设计算法的功能性分解方法通常适用于行为职责算法。\n\
  \n![一个 5 人团队正在讨论的插图。2 个人坐在对面讨论，每个人手里拿着一张卡片。1 个人在纸上写字。另外 2 个人在听。](img/9781284166033_CH15_FIGF09.jpg)\n\
  \n图 15.9 正在进行的场景演练\n\n### 结语\n\n总结来说，功能分解关注的是将输入转换为输出的过程，从而产生任务的层次结构。相比之下，面向对象的设计关注要被转换的数据对象，从而产生对象的层次结构。问题描述中的名词变成对象；动词变成职责。在自顶向下的设计中，动词是关注重点；在面向对象的设计中，名词是关注重点。\n\
  \n我们描述的这种方法利用了 CRC 卡。这种卡仅仅是一种帮助你组织 `classes` 的符号工具；它的使用本身并不是一种方法。\n\n2 韦斯特新大学词典。\n\
  \n## 15.5 实现设计\n\n在 OOD 中，当我们首次识别出一个对象时，它是一个抽象概念。我们不会立即为它的属性选择精确的数据表示。同样，对象的职责从抽象操作开始，因为最初并没有尝试提供算法。当然，我们最终必须实现它。对于每个抽象对象，我们有两个任务：\n\
  \n* 为其属性选择合适的数据表示。\n* 为其职责创建算法。\n\n为对象选择数据表示，你有三个选择：\n\n1. 使用内置数据类型。\n2. 使用或扩展现有的\
  \ `class`。\n3. 创建新类。\n\n一个经验法则是按照列出的顺序考虑这些选项。内置类型最容易使用。如果内置类型不足以表示对象，你可以查看类库（系统的或你自己的）中可用的\
  \ ADT，看看是否有任何 `classes` 与抽象对象相似。因为我们可以使用继承，所以只要 `class` 的扩展能够涵盖差异，就不非要找到完全匹配。如果没有合适的\
  \ ADT，你必须设计并实现一个新的。\n\n接下来我们实现职责算法。在 OOD 中，许多职责的算法由几个可以直接翻译为 `C++` 的步骤组成。当然，情况并非总是如此。如果一个操作很复杂，最好将其视为一个新问题，并在控制流上使用功能性分解。在这种情况下，结合应用功能性分解和面向对象的方法是合适的。经验丰富的程序员熟悉这两种，并经常独立或结合使用它们。\n\
  \n### 图形用户界面 (GUI)\n\n### 创建空窗口\n\n之前的案例研究展示了面向对象设计的用处，特别是继承作为重用 `base class` 中定义功能的机制。它还展示了一个复杂的基于控制的用户界面，允许用户以各种方式与日历交互，并将日历条目的更改保存到文件中。图形界面如何提高此应用程序的用户体验和交互性？\n\
  \n通过基于控制的版本我们可以得出几个观察结果，这将帮助我们设计有效的 GUI。首先，要从日历中检索条目，我们必须输入姓、名、中间以及日期，以查找是否存在匹配的条目。如果我们忘记了预约日期怎么办？如果你考虑一个包含十几个或更多条目的预约日历，对于普通人来说这很快就会变得不实际！另一个出现的问题是，所有内容必须按照程序的要求精确输入。如果姓和中间名不小心没有加空格，或者日期和月份弄反了顺序，预约数据很容易出错或损坏。设计良好的\
  \ GUI 将使用户更易于交互，同时保护预约数据免受意外错误输入的影响。\n\n为了改进之前的版本，我们想要考虑 GUI 版本的某些更改，例如在视觉列表中显示日历条目、能够在列表中选择日历条目、用预约数据填充表单、验证表单中的预约数据、将预约数据的更改保存回视觉列表，并将这些更改写入底层日历文件。幸运的是，在第\
  \ 14 章中，我们讨论了一种类似的 GUI，它可以显示条目并允许用户插入删除。我们的日历预约应用程序的图形界面在视觉上大部分相同。但我们将允许用户点击列表中的条目，将其加载到表单中。表单将使用组件显示时间和日期，并有一个按钮保存预约数据，另一个按钮退出应用程序。我们将创建的最终\
  \ GUI 看起来像这样：\n\n![一个 GUI 窗口，标记为日历应用程序。](img/9781284166033_CH15_P932.jpg)\n\nDescription\n\
  \n当我们点击左侧的预约条目之一时，与条目相关的数据将加载到右侧的表单中：\n\n![一个 GUI 窗口，标记为日历应用程序。](img/9781284166033_CH15_P933.jpg)\n\
  \nDescription\n\n\n\n\n当我们对表单数据进行任何更改后，点击 `Save` 按钮将把这些更改保存到日历文件中。完成应用程序的使用后，我们可以点击\
  \ `Exit` 按钮。我们最初通过使用现成的组件开始探索图形化应用程序。在随后的章节中，我们开始逐步揭示底层 Qt 图形框架，并展示了自定义设计的界面，但当时推迟了讨论它们的实现。到目前，我们已经掌握了足够的\
  \ C++ 和面向对象编程知识，以使用 `Qt` 探索自定义设计的图形界面。我们将逐步分小部分开发 GUI，以便在移动到下一个部分之前理解每个部分。\n\nQt\
  \ 框架提供了许多不同的图形化组件，我们可以直接使用它们，也可以通过继承进行扩展，以构建我们想要的 GUI。我们将从创建一个新的 C++ 类开始，该类扩展了 Qt\
  \ 框架的 `QMainWindow` 类。`QMainWindow` 提供了一个显示 GUI 的空窗口。以下是我们用作 GUI 容器的 `AppointmentCalendarWindow`\
  \ 类的定义：\n\n![一段代码片段。](img/9781284166033_CH15_P933.jpg)\n\n描述\n\n我们从包含 `QMainWindow`\
  \ 开始，因为我们需要访问基类的定义。接下来是 `AppointmentCalendarWindow` 的定义，它扩展了 `QMainWindow` 以继承其所有功能。我们的新类目前仅指定了一个公共构造函数和析构函数。Qt\
  \ 组织 GUI 组件的方式使得每个图形组件都拥有指向其内部包含的每个组件的指针。这种关系是通过向组件的构造函数传递父对象的指针来创建的。如果我们不向派生类 `AppointmentCalendarWindow`\
  \ 的构造函数传递指针，它将默认为 `nullptr`，这表示没有父组件。默认参数值通过为构造函数参数赋值值来定义，如上面的构造函数所示。\n\n你还会注意到类的第一行由\
  \ `Q_OBJECT` 标识符组成。这是 C++ 所说的“宏”的一个示例。你已经熟悉 C++ 预处理器了，它在代码传递给编译器之前运行我们的代码，处理诸如 `#include`\
  \ 和 `#define` 等指令。预处理器实际上支持一种独立的编程语言，在其中可以拥有整块的指令，在代码添加时动态编辑代码，包括创建代码段的多个副本，每份副本都进行某些更改以用于不同的用途。因此，宏功能是一个远比简单包含库代码强大的工具。编写宏程序超出了本文的范围，`Q_OBJECT`\
  \ 宏的具体作用并不重要。但大致思路是，它设置了 Qt 框架正确指定 GUI 组件（或窗口）所需的大部分代码。我们空窗口的实现非常直观：\n\n![一段代码片段。](img/9781284166033_CH15_P934.jpg)\n\
  \n描述\n\n此时，我们的类只是将构造函数参数传递给 `QMainWindow` 基类的构造函数。如果我们在完整的应用程序中执行此代码，我们将看到一个空窗口：\n\
  \n![空窗口的对话框。](img/9781284166033_CH15_P934-1.jpg)\n\n### 添加按钮组件\n\n现在我们有了一个空窗口，我们想要用特定日历应用程序的\
  \ GUI 组件来填充它。我们将从 `Save` 和 `Exit` 按钮开始，因为它们是最直接的。首先，我们将扩展 `AppointmentCalendarWindow`\
  \ 规范，以包含两个按钮的私有变量声明，以及一个创建按钮并将它们添加到 GUI 中的方法。\n\n![一段代码片段。](img/9781284166033_CH15_P935.jpg)\n\
  \n描述\n\nQt 提供了一个我们可以直接使用的 `QPushButton` 组件。这些被声明为指针类型，因为 Qt 框架在将它们添加到 GUI 组件时使用了组件的指针。我们必须包含\
  \ `QtWidgets` 头文件才能访问 `QPushButton` 的定义。`Build-ButtonsWidget` 方法将创建按钮。该方法返回一个指向\
  \ `QWidget` 的指针，我们稍后会解释。\n\n在讨论实现之前，重要的是，`QMainWindow` 只允许向其添加并渲染单个“中央”（central）组件。如果它只能显示单个组件，那么我们如何向窗口添加多个组件呢？在档应用程序中，我们计划有两个按钮和其他组件。答案是，我们使用布局（layout）将多个组件汇集到单个组件中，布局是一个以特定排列方式显示组件的对象。\n\
  \n这是一个面向对象设计的良好例子。`QMainWindow` 的工作仅仅是显示一个包含某些内容的窗口。我们可以设计具有不同排列方式的各种组件的窗口，如果让 `QMainWindow`\
  \ 也负责管理这些组件的放置将将变得过于复杂。因此，Qt 将该责任委托给另一个对象，该对象将我们的组件以及排列方式的规范汇集到一个组件中，并传递给 `QMainWindow`。\n\
  \nQt 提供了三种不同的布局，我们将在应用程序中看到。第一个是名为 `QHBoxLayout` 的类，它在水平方向上排列组件。我们稍后会讨论其他布局。\n\n\
  布局对象有一个 `addWidget` 方法，我们用它来添加组件，例如我们的两个按钮。因为布局对象不是组件，我们必须创建一个额外的 `QWidget`（我们称之为\
  \ `buttonsWidget`），并将其布局设置为包含按钮的布局（使用其 `setLayout` 方法）。最后，`buttonsWidget` 将渲染布局，这将导致窗口水平显示按钮。上述规范的实现如下代码所示。请注意，由于我们处理的是组件对象的指针，因此我们需要使用箭头运算符来选择它们的成员。\n\
  \n![一段代码片段。](img/9781284166033_CH15_P936.jpg)\n\n描述\n\n`BuildButtonsWidget` 方法首先创建一个\
  \ `buttonsWidget` 的包装组件。然后我们创建一个名为 `buttonsLayout` 的新 `QHBoxLayout`，并在 `buttonsWidget`\
  \ 对象上调用 `setLayout` 方法，传入 `buttonsLayout`。密切关注这种创建组件和布局然后将它们连接的模式。当我们使用 `Qt` 构建界面时会反复看到这种模式。\n\
  \n现在我们已经有一个连接了布局的组件，我们通过实例化两个 `QPushButton` 对象来创建按钮，每个对象都用一个作为按钮标签的字符串初始化。最后，我们将按钮添加到布局中并返回\
  \ `buttonsWidget`。注意，将按钮添加到布局的顺序决定了它们从左到右水平显示的顺序。[图 15.11**] 示了 GUI 组件对象的包含层级结构。\n\
  \n![一个块图解释了 G U I 按钮组件的嵌套。](img/9781284166033_CH15_FIGF11.jpg)\n\n图 15.11 嵌套在通用组件中的布局中的\
  \ GUI 按钮组件\n\n描述\n\n\n\n\n构造函数首先调用 `BuildButtonsWidget`，该函数返回一个包含水平布局按钮的部件。`QMainWindow`\
  \ 类提供了一个名为 `setCentralWidget` 的方法，用于设置由窗口渲染的中心部件。我们调用该方法，并传入包含按钮的该部件。最后，我们使用继承的\
  \ `setWindowTitle` 方法为窗口设置一个合理的标题。测试我们所完成工作的一种良好方法是运行这段代码，查看目前 GUI 的外观。以下是一个驱动程序\
  \ `main` 函数，它实例化了一个 `Appointment-CalendarWindow` 以在屏幕上渲染界面：\n\n![代码片段。](img/9781284166033_CH15_P937.jpg)\n\
  \n描述\n\n`main` 函数只是创建了一个 `AppointmentCalendarWindow` 实例，并调用它的 `show` 和 `exec` 方法，以正如我们的将窗口渲染到屏幕上并启动\
  \ GUI 事件循环，正如我们在第 14 章 中讨论的那样。如果我们执行这段代码，我们将看到窗口包含了我们创建的两个按钮，并按预期方式排列。\n\n![带有两个按钮的窗口。](img/9781284166033_CH15_P937-1.jpg)\n\
