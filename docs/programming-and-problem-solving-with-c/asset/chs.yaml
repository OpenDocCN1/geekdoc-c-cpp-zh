  \n## F.3 标识符\n\n在选择数据项名称时最重要的考虑因素是该名称尽可能尽可能地传递关于该项目的信息。设计标识符的最佳方法是尝试不同的名称，直到达到可以接受的方案。\n\
  \n大小写是选择标识符时的另一个考虑因素。C++ 是一种大小写敏感的语言；也就是说，大写和小字母是不同的。不同的程序员有不同的大小写规范。在本文中，每个变量名以小写字母开头，并对每个单词的首字母大写。每个函数名和数据类型以大写字母开头，同样对每个单词的首字母大写。对于命名常量，我们将整个标识符大写，并用下划线\
  \ (`_`) 分连续单词。但记住，C++ 关键字如 `main`、`if` 和 `while` 始终是小写，如果你将它们大写，编译器将无法识别。\n\n##\
