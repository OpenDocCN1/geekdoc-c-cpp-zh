  \n### 在声明中初始化数组\n\n你在第 8 章中学习过，C++ 允许在声明变量时对其初始化：\n\n![一个变量声明。int, delta, 等于 25,\
  \ 分号。](img/9781284166033_CH11_P597-1.jpg)\n\n你还可以通过使用逗号分隔并用大括号括的值列表在声明时初始化数组：\n\n\
  ![带有大小的数组声明。int, age, 左方括号, 5, 右方括号, 等于, 左大括号, 23, 10, 16, 37, 12, 右大括号, 分号。](img/9781284166033_CH11_P597-2.jpg)\n\
  \n在此声明中，`age[0]` 初始化为 23，`age[1]` 初始化为 10，依此类推。如果你列出的值过多，编译器会输出错误信息。如果你列出的值太少，剩余元素将初始化为零。\n\
  \n数组在初始化发生的时间上与简单变量遵循相同的规则。静态数组（全局的或在块内声明为 `static` 的数组）仅初始化一次，即控制到达其声明处时。自动数组（局部的且未声明为\
  \ `static` 的数组）每次控制到达其声明处时都会重新初始化。\n\n在声明中初始化数组时，允许省略数组的大小：\n\n![没有大小的数组声明。float,\
  \ temperature, 左方括号, 右方括号, 等于, 左大括号, 0 点 0, 112 点 3 7, 98 点 6, 右大括号, 分号。](img/9781284166033_CH11_P597-3.jpg)\n\
  \n编译器根据列出的值确定数组的大小（这里为 3）。\n\n### （缺乏）聚合数组操作\n\n在第 10 章\n\n则不存在将 `two` 聚合赋值给 `one`\
