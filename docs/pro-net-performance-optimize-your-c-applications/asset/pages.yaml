    Finally, the detailed JIT analysis shows how much the JIT compiler requires for
    each of the application''s methods as well as the precise time when they were
    compiled. This information could be useful to determine whether an excessive amount
    of startup time is spent in the JIT compiler, pre-compiling of your binaries (using
    NGen) might be a worthwhile optimization. We will discuss NGen and other strategies
    for reducing startup time in Chapter 10.


    +   Collecting information from multiple high-performance ETW providers can generate
    very large log files. For example, in default mode PerMonitor regularly updates
    5MB of raw data per day. Leaving such a trace for several days is likely to exhaust
    disk space on hard drives. XPerf and PerMonitor support circular logging, where
    only the last N megabytes of logs are retained. In PerMonitor, the /Circular-command
    switch limits the maximum file size (in megabytes) and discards the oldest logs
    when [ is triggered.


    Although PerMonitor is a powerful tool, its HTML reports and abundance of command-line
    options might make it difficult to use. The next tool we will see offers very
    similar functionality to PerMonitor and can be used in the same scenarios, but
    with a much user-friendly interface for collecting and interpreting ETW information
    and will make some performance investigations considerably shorter.


    # The PerView Tool


    PerView is a free tool that unifies ETW data and analysis capabilities available
    in PerMonitor with away features that we will discuss later in conjunction with
    tools as CLR Profiler and ANTS Memory Profiler. You can download PerView from
    the Microsoft download center, at http://www.microsoft.com/download/en/details.aspx?id=28567.
    Note that you will need to run PerView as an administrator, because it requires
    access to the ETW infrastructure.


