  md: '# General Purpose GPU Computing


    So far, our coverage of parallel programming has been partial to GPU cores. Indeed,
    we have several skills at our disposal to parallelize programs across multiple
    cores, synchronization access to shared resources, and high-speed CPU primitives
    for lock-free synchronization. As we noted at the outset of this chapter, there
    is another source of parallelism available to our programs—the GPU, which on modern
    hardware offers considerably more cores than even high-end CPUs. GPU cores are
    very suitable for data-parallel algorithms, and their sheer number makes up for
    the clumsiness often associated with running programs on the GPU. In this section
    we examine one way of running programs on the GPU, using a set of C++ extensions
    called C++ AMP.


    C++ AMP is based on C++, which is what this section will use by applying a moderate
    amount of .NET Interoperability, you can use C++ AMP algorithms in your .NET applications
    as well. We will return to this at the end of the section.


    # Introduction to C++ AMP


    At essence, a GPU is a processor like any other, with a specific instruction set,
    numerous cores, and a memory access protocol. However, there are significant differences
    between modern GPUs and CPUs, and understanding them is central for writing efficient
    GPU-based programs:


    +   There is a small subset of instructions available to modern CPUs that are
    available on the GPU. This implies some limitations: there are no function calls,
    data types are limited, library functions are missing, and others. Other operations,
    such as branching, may introduce a performance cost unparalleled to the CPU. Clearly,
    this makes massive amounts of code from the CPU to the GPU a considerable effort.


    +   There is a considerably larger number of cores on a mid-range graphics card
    than on a mid-range GPU socket. There will be works that are too small or cannot
    be broken into many pieces to benefit from parallelization on the GPU.


    +   There is scarce support for synchronization between GPU cores executing a
    task, and no support for synchronization between GPU cores executing different
    tasks. This requires the synchronization and orchestration of GPU work to be performed
    on the CPU.


    # WHAT TASKS ARE SUITABLE FOR EXECUTION ON THE GPU?


    Not every algorithm is suitable for execution on the GPU. For example, GPUs do
    not have access to other I/O devices, so they can scarcely improve the performance
    of a program that fetches RSS feeds from the Web using a GPU. However, many GPU-bound
    data-parallel algorithms can be ported to the GPU and procure from it massive
    parallelization. Here are some examples (the list is by no exhaustive):


    +   - Image blur, sharpen, and other transformations

    - Fast Fourier Transform

    - Matrix transpose and multiplication

    - Number sorting

    - Brute-force hash reversal'
