    Pipelining is increasingly important, while Internet bandwidth continues to increase
    worldwide, latency improves at a much slower rate because it is capped at physical
    limits imposed by the speed of light.


    An example of pipelining in a real-world protocol is HTTP 1.1, but it is often
    disabled by default on servers and browsers because of compatibility issues. Google
    SPDY, an experimental HTTP-like protocol supported by Chrome and Firefox browsers,
    as well as HTTP servers, and the upcoming HTTP 2.0 protocol mandate pipelining
    support.


    # Streaming


    Streaming is not just for video and audio, but can be used for messaging. With
    streaming, the application begins sending data over the network before it is finished.
    Streaming reduces latency and improves channel utilization.


    For example, if a server fetches data from a database to a request, it can either
    read it in one chunk into a DataSet (which can consume large amounts of memory)
    or it can use a DataReader to retrieve records one at a time. In the former approach,
    the server has to wait until the entire dataset has arrived before it can begin
    sending a response to the client, whereas in the latter approach, the server can
    begin sending a response as soon as the first DB record arrives.


    # Message Chunking


    Sending chunks of data over the network is wasteful. Ethernet, IP, and TCP/UDP
    headers are not smaller, because the payload is smaller, although bandwidth utilization
    can still be high, you end up waiting on headers, not actual data. Additionally,
    Windows has per-call overhead that is independent or weakly dependent on data
    chunk size. A protocol can mitigate this by allowing several requests to be combined.
    For example, the Domain Name Service (DNS) protocol allows a client to resolve
    multiple domain names in one request.


    # Chatty Protocols


    Sometimes the client cannot pipeline requests, even if the protocol allows this,
    because the next requests depend on the content of the previous replies.


    Consider an example of a chatty session. When you browse to a web page, the browser
    connects to the server via TCP, sends HTTP GET request for the URL you are trying
    to visit, and receives an HTML page as a response. The browser parses the HTML
    to figure out which JavaScript, CSS, and image resources it has to retrieve and
    downloads them individually. The JavaScript is then executed, and it can fetch
    further content. In summary, the client does not immediately fetch all the content
    it has to retrieve to render the page. It has to iteratively fetch each content
    until it retrieves and downloads all content.


    To mitigate this problem, the server might hint to the client which URLs it will
    need to retrieve to render the page and might send content without the client
    requesting it.


    # Message Encoding and Redundancy


    Network bandwidth is often a constrained resource, and having a wasteful messaging
    format does not help performance. Here are a few tips to optimize messaging format:


    +   - Do not transmit the same thing over and over, and keep headers small.


    +   - Use smart encoding or representation for data. For example, strings can
    be encoded in UTF-8, instead of UTF-16. A binary protocol can be many times more
    compact than a human-readable protocol. If possible, avoid encapsulations, such
    as Base64 encoding.'
