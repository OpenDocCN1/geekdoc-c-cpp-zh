    One example of reference-counting garbage collection in the Windows ecosystem
    is COM (Component Object Model). COM objects are associated with a reference count
    that affects their lifetime. When a COM object''s reference count reaches 0, it
    is typically the object''s responsibility to reclaim its own memory. The burden
    of managing the reference count is mostly with the developer, with explicit AddRef
    and Release method calls, although most languages have wrappers that call these
    methods automatically when references are created and destroyednThe primary issues
    with reference-counting garbage collection are the:


    +   * **Management cost:** When a reference to an object is created or destroyed,
