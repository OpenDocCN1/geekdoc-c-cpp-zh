    We have already seen that .NET generics implementation is fully type-safe at compile-time.
    It remains to ascertain that there is no boxing cost when using value types with
    generic collections. Indeed, because the JIT compiler compiles a special body
    for each generic type that the generic type arguments are value types, there is
    no need for boxing.


    To summarize, .NET generics offer significant advantages contrasted with Java
    generics or C++ templates. The generic constraints mechanism is somewhat limited
    compared to the Wild West that C affords, but the flexibility gains from sharing
    generic types across assemblies and the performance benefits of generating code
    on demand (and sharing it) are overwhelming.


    # Collections


    The .NET Framework has a large number of collections, and it is not the purpose
    of this chapter to review every one of them — this is a task best left to the
    MSD documentation. However, there are some non-trivial considerations that need
    to be taken into account when choosing a selection, especially for performance-sensitive
    code. It is these that we will explore throughout this section.


