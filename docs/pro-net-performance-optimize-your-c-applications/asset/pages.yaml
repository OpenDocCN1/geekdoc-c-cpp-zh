  md: '# CHAPTER 4 GARBAGE COLLECTION


    The general performance of the sweep phase is linear in the number of objects
    in the graph, and is especially sensitive to the collection efficiency factor.
    If most objects are discovered to be unreferenced, the GC has to move a few objects
    in memory. The same applies to the scenario where most objects are still referenced,
    as there are relatively few holes to fill. On the other hand, if every other object
    in the heap is unreferenced, the GC may have to move almost every line to fill
    the holes.


    > **Note** Contrary to popular belief, the garbage collector does not always move
    objects (i.e., there are some sweep-only objects that do not proceed into the
    compact phase), even if they are not pinned (see below) and even if free space
    is available between objects. There is an implementation-defined heuristic that
    determines whether moving objects to free space is worthwhile during the sweep
    phase. For example, in one test executed on the author''s 32-bit system, the garbage
    collector decided to move objects around if the free space is larger than 16 bytes,
    consists of more than one object, and more than 16KB of allocations have been
    made since the last garbage collection. You cannot rely on these results being
    reproducible, but this demonstrate the existence of the optimization.


    The mark and sweep model described in the preceding sections is subject to one
    significant deficiency that we will address later in this chapter as we approach
    the generational GC model. When a collection occurs, all objects in the heap are
    traversed even if they can be pinned by likelihood of collection efficiency. If
    we had prior knowledge that some objects are more likely to die than others, we
    might be able to tune our collection algorithm accordingly and obtain a lower
    amortized cost.


    # Pinning


    The garbage collection model presented above does not address a common use for
    managed objects. This case revolves around passing managed objects for consumption
    by unmanaged code. Two distinct approaches can be used for solving this problem:


    +   * Every object that should be passed to unmanaged code is marshaled by value
    (copied) when it''s passed to unmanaged code, and marshaled back when it is returned.

    * Instead of copying the code, a pointer to it is passed to unmanaged code.


    Copying memory every time we need to interact with unmanaged code is an unrealistic
    proposition. Consider the case of real-time video processing software that needs
    to propagate high-resolution images from unmanaged code and versa at 30 frames
    per second. Copying multiple megabytes of memory every a minor change will deteriorate
    performance to unacceptable levels.

    nThe .NET memory model provides features for obtaining the address of a managed
    object. However, passing this address to unmanaged code in the presence of the
    garbage collector raises an important concern: What happens if the object is moved
    by the GC while the unmanaged code is still executing and using the pointer?


    This scenario can have disastrous consequences—memory can easily become corrupted.
    One reliable solution to this problem is turning off the garbage collector while
    unmanaged code has a pointer to a managed object. However, this approach is not
    granular enough if objects are frequently passed between managed and unmanaged
    code. It has the potential of deadlock or memory exhaustion if a thread enters
    a long wait from unmanaged code.


    Instead of turning garbage collection off, every managed object whose address
    can be obtained must also be pinned in memory. Pinning an object prevents the
    garbage collector from moving it around during the sweep phase until it is unpinned.


    101'
