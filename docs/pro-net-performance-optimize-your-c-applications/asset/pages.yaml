  md: '# I/O Completion Ports


    Windows provides an efficient asynchronous I/O completion notification mechanism
    called the I/O Completion Port (IOCP). It is exposed to the .NET ThreadPool, BindHandle
    method. Several .NET types dealing with I/O utilize this functionality internally:
    FileStream, Socket, TcpPort, HttpClient, PipeStream, and some .NET Removing channels.


    An IOCP (see Figure 7-2) is associated with zero or more I/O handles (sockets,
    file, and specialized device objects) in overlapped mode and with user-created
    threads. Once an I/O operation of an associated I/O handles completes, Windows
    executes the completion notification to the appropriate IOCP and an associated
    thread handles the completion notification. By having a thread pool that completes
    services and by intelligently controlling thread wakeup, context switches are
    reduced and multi-processor concurrency is maximized. It is no surprise that high-performance
    servers, such as Microsoft SQL Server, use I/O completion ports.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_217_0.png)


    Figure 7-2. Structure and operation of an I/O Completion Port


    A completion port is created by calling the CreateIoCompletionPort Win32 API function,
    passing a maximum concurrency value, and optionally associating it with an I/O-capable
    handle. A completion key is a user-specified value that helps to distinguish between
    different I/O handles. More handles can be associated with the same or a different
    IOCP by calling CreateIoCompletionPort and specifying the existing completion
    port.


    User-created threads then call GetQueuedCompletionStatus to become bound to the
    specified IOCP and wait for completion. GetQueuedCompletionStatus blocks until
    an I/O completion notification available (or a timeout has elapsed), at point
    it returns the I/O operation details, such as the number of bytes transferred,
    the completion key, and the overlapped structure passed during I/O operation.
    It completes when all associated threads are busy (i.e., not blocked on GetQueuedCompletionStatus),
    the IOCP wakes another thread in FIFO order, up to the maximum concurrency. If
    a thread calls GetQueuedCompletionStatus and the notification queue is not empty,
    the call returns immediately, without the blocking in the OS kernel.'
