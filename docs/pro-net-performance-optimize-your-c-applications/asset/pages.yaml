    # Blittable Types


    Most native types share a common-memory representation with managed code. These
    types, called blittable types, do not require conversion, and are passed as-is
    across managed-to-native boundaries, which is significantly faster than marshaling
    non-blable types. In fact, the marshaler stub can optimize this case further by
    pinning a managed object and passing a direct pointer to the managed object to
    native code, avoiding one or two memory copy operations (one for each required
    marshaling direction).'
