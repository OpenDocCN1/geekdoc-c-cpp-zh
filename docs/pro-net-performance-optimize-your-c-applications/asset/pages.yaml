- img_proc: true
  md: 'There are several factors that go into long startup times. Some of them are
    relevant only for cold startup; others are relevant for both types of startup.


    +   - I/O operations—to launch the application, Windows and the CLR must load
    from the disk the application''s assemblies as well as .NET Framework assemblies,
    CLR DLLs, and Windows DLLs. This factor is relevant most for cold startup.


    +   - JIT compilation—every method called for the first time is compiled by the
    JIT compiler. Because code compiled by the JIT is not preserved when the application
    terminates, this factor is relevant for both cold and warm startup.


    +   - GUI initialization—depending on your GUI framework (WPF, Windows Forms,
    etc.), there are GUI-specific initialization steps that must take place for the
    user interface to be displayed. This factor is relevant for both types of startup.


    +   - Loading application-specific data—your application may require information
    from files, databases, or Web services to display its initial screen. This factor
    is relevant for both types of startup, unless your application employs some caching
    for this data.


    We have several measurement tools to diagnose startup times and their likely causes
    (see Chapter 2). Sysinternals Monitor can point to I/O operations performed by
    the application''s process, regardless of whether Windows, the CLR, or the code
    initiated them. PerfMonitor and the .NET Jit performance counter can help diagnose
    excessive JIT compilation during application startup. "standard" profilers (in
    sampling or instrumentation mode) can determine how your application is spending
    its time at startup.


    Additionally, there is a simple experiment that you can perform to tell whether
    I/O is the primary cause of startup times: your application''s cold startup and
    warm startup scenarios (you should use a clean hardware environment and sure there
    are no unnecessary services or other initialization taking place in the cold startup
    test). If the startup is significantly faster than the cold startup, JIT is the
    culprit.


    Improving your application-specific data loading is up to you; every guideline
    we can issue is general in practice (other than providing a splash screen to stretch
    your users'' "patience..."). However, we offer several methods for poor startup
    performance that originates from I/O operations and JIT compilation. Optimizing
    your application''s startup time can cut it down in half, or in some cases.


    # Pre-JIT Compilation with NGen (Native Image Generator)


    While the JIT is very convenient and compiles methods only when they are called,
    there is still a performance cost that your application pays when the JIT runs.
    The .NET Framework offers an optimization, called Native Image Generator (NGen.exe),
    which can compile your assemblies to machine code (native images) before runtime.
    If every application requires pre-compilation in native, there will be no need
    to load the JIT compiler and use it during application startup. The generated
    native image is likely to be larger than the original, so in most cases the overhead
    of I/O on cold startup actually decreases.


    Pre-compilation has another advantageous effect—native images can be shared between
    processes, unlike code that the JIT compiler itself creates at runtime. If several
    processes use the same native image for some assembly, memory consumption is lower
    than in JIT-compiled code. This is especially important in shared-system scenarios,
    when multiple users connect via Terminal Services to a single server, and run
    the same application.


    To pre-compile your application, all you need to do is point the NGen exe tool,
    which resides in the .NET Framework''s directory, to your main assembly (typically
    an .exe file). NGen will locate all the static dependencies your main assembly
    has and pre-compile them all to native images. The resulting native'
