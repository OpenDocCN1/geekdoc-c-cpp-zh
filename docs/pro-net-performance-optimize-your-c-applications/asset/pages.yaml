    # Tracing Garbage Collection


    Tracing garbage collection is the garbage collection mechanism used by .NET CLR,
    the Java VM and various managed environments—these environments do not use counting
    garbage collection in any form. Developers do not use explicit memory deallocation
    requests; this is taken care by the garbage collector. A GC does not associate
    an object with a reference count, and normally doesn''t incur any deallocation
    cost until a memory threshold is reached.


    When a garbage collection occurs, the collector begins with the *mark phase*,
    during which it resolves all objects that are still referenced by the application
    (live objects). By constructing the set of live objects, the collector moves to
    the *sweep phase*, at which time it reclaims the space occupied by unused objects.
    Finally the collector concludes with the *compact phase*, in which it shifts live
    objects so they remain contiguous in memory.


    In this chapter, we will examine in detail the various issues associated with
    tracing garbage collection. A general outline of these issues, can be provided
    right:


    +   * Allocation cost: The allocation cost is comparable to a stack-based allocation,
    because there is no maintenance associated with free objects. An allocation consists
    of incrementing a pointer.

    * Deallocation cost: Incurred when the GC cycle occurs instead of being uniformly
    distributed across the execution profile. This has advantages and disadvantages
    (specifically for low-latency scenarios) that we will discuss later in this chapter.

    * Mark phase: Locating referenced objects requires a great deal of discipline
    from the managed execution environment. References to objects can be stored in
    static variables, local variables on thread stacks, as pointers to unmanaged code,
    etc. Tracing every possible reference path to each object is everything but trivial,
    and often incurs a run-time cost outside the collection cycle.

    * Sweep phase: Moving objects around memory costs time, and might not be applicable
    for large objects. On the other hand, eliminating unused space between objects
    facilitates locality of reference, because objects that were allocated together
    in memory. Additionally, this removes the potential for an additional fragmentation
    mechanism because this means that the allocation code does not need to account
    for “holes” between objects when looking for free space; a simpler pointer-based
    allocation strategy can be used instead.


