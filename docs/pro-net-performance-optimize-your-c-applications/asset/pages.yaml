  md: "# CHAPTER 4 GARBAGE COLLECTION\n\nThe problem with deterministic finalization\
    \ is that the client is responsible for using the object property. This contradicts\
    \ the object-orientation paradigm, where the object is responsible for its own\
    \ state and invariants. This problem cannot be addressed to a full extent because\
    \ automatic finalization is always non-deterministic. However, we can introduce\
    \ a contractual mechanism that will ensure that deterministic finalization occurs,\
    \ and will make it easier to use from the client side. In exceptional scenarios,\
    \ we will have to provide automatic finalization, despite all costs mentioned\
    \ in the previous section.\n\nThe conventional contract established by the IDisposable\
    \ framework defines an object which requires implementing a single Dispose method.\
    \ Method should perform deterministic finalization to release unmanaged resources.\n\
    \nClients of implementing the IDisposable interface are responsible for calling\
    \ Dispose when they have finished it. In C#, this can be achieved with a using\
    \ block, which wraps object usage in a try... finally calls Dispose within the\
    \ finally block.\nThis contractual model is fair enough if we trust our clients\
    \ completely. However, we can't trust our clients to call Dispose deterministically,\
    \ and must provide a backup behavior to prevent a resource leak. It can be done\
    \ using automatic finalization, but setting up backup is a real problem: if the\
    \ client calls Dispose and the finalizer is invoked, we will release the resources\
    \ twice. Additionally, the implementation of deterministic finalization was avoiding\
    \ the pitfalls of automatic finalization!\n\nWhat we need is a mechanism for instructing\
    \ the garbage collector that the unmanaged resources have already been released\
    \ but haven't used the GC.SuppressFinalize method, which disables finalization\
    \ by setting a bit in the object's header word (see Chapter 3 for more details\
    \ about the object header). The object remains in the finalization queue, but\
    \ most of the finalization cost is not incurred because the object's memory is\
    \ reclaimed immediately after the first collection, and it is never seen by the\
    \ finalizer.\n\nFinally, we might want a mechanism to alert our clients of the\
    \ case when a finalizer was called, because it implies they haven't used the (significantly\
    \ more efficient, predictable and reliable) deterministic finalization mechanism.\
    \ This can be done using System.Diagnostics.Debug.Assert or a logging framework\
    \ of some sort.\n\nThe following is a rough draft of a class wrapping an unmanaged\
    \ resource that follows these guidelines (there are more details to consider if\
    \ the class was to derive from another class that also manages unmanaged resources):\n\
    \n```\nclass File3 : IDisposable {\n    Handle handle;\n    public File3(string\
    \ filename) {\n        handle = new Handle(filename);\n    }\n    public byte[]\
    \ Read(int bytes) {\n        Util.InternalRead(handle, bytes);\n    }\n    ~File3()\
    \ {\n        Debug.Assert(false, \"Do not rely on finalization! Use Dispose!\"\
    );\n        handle.Close();\n    }\n    public void Dispose() {\n        handle.Close();\n\
