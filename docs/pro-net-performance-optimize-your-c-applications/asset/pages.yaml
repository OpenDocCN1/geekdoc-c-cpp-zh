  md: "These semantic differences are fundamental to the way we write code in any\
    \ .NET language. However, they are only the tip of the iceberg in terms of how\
    \ reference types and value types differ. their purposes differ. First, let's\
    \ consider the memory locations where objects are stored, and how they are allocated\
    \ and deallocated.\n\n# Storage, Allocation, and Deallocation\n\nReference types\
    \ are allocated exclusively from the managed heap, an area of memory managed by\
    \ the .NET garbage collector, which will be discussed in more detail in Chapter\
    \ 4. Allocating an object from the managed heap involves incrementing a pointer,\
    \ which is a fairly cheap operation in performance. On a multi-processor system,\
    \ if multiple processors are accessing the same heap, since synchronization is\
    \ required, the allocation is still extremely cheap compared to allocators in\
    \ unmanaged environments, such as malloc.\n\nThe garbage collector re memory in\
    \ a non-deterministic fashion and makes no promises regarding its internal operation.\
    \ As we see in Chapter 4, a full garbage collection process is expensive, but\
    \ the average garbage collection cost of a well-behaved application should be\
    \ smaller than that of a similar counterpart.\n\nTo be precise, there is an allocation\
    \ of reference types that can be allocated from the stack. Arrays of certain primitive\
    \ types (such as arrays of integers) can be allocated from the stack using unsafe\
    \ context and the stackalloc keyword, or by embedding a fixed-size array into\
    \ a custom struct, using the fixed keyword (discussed in Chapter 8). However,\
    \ the objects created by the stackalloc and fixed keywords are not \"real\", and\
    \ have a different memory layout than standard arrays from the heap.\n\nStand-alone\
    \ value types are usually allocated on the stack of the executing thread. However,\
    \ value types can be embedded in reference types, in which case they are allocated\
    \ on the heap, and can be boxed, transferring their storage to the heap (we will\
    \ revisit this in later chapter). Allocating a value type from the stack is a\
    \ very cheap operation that involves modifying the stack register (ESP on Intel\
    \ x86), and has the additional advantage of allocating several objects at once.\
    \ In fact, it is common for a method's prologue to use a single CPU instruction\
    \ to allocate stack space for all the local variables in its outermost frame.\n\
    \nReclaiming stack memory is very efficient as well, and requires a modification\
    \ of the stack pointer register. Due to the ways methods are compiled to machine\
