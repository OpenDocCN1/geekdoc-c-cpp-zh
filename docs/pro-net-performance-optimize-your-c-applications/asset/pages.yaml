  md: '# CHAPTER 1 PERFORMANCE METRICS


    When performance goals are well-defined, the performance testing, load testing,
    and subsequent optimization process is laid out trivially. Verifying conjectures,
    such as “1,000 concurrently executing API requests are less than 2 hard page faults
    per second on the application server”, may require access to load testing tools
    and a suitable hardware environment. The next chapter discusses the measurement
    to determine whether it meets or exceeds its performance goals such an environment
    is established.


    Composing well-defined performance goals often requires prior familiarity with
    performance metrics, which we discuss next.


    # Performance Metrics


    Unlike performance goals, performance metrics are a measurable numeric quantity
    that reflects the application''s behavior. You can measure a performance metric
    on any hardware and in any environment, regardless of the number of active users,
    requests, or sessions. During the development lifecycle, you choose the metrics
    to measure and derive from them specific performance goals.


    Some applications have performance metrics specific to their domain. We do not
    attempt to identify these metrics here. Here, we list, in Table 1-2, performance
    metrics often important to many applications, as well as the chapter in which
    optimization of these metrics is discussed. (The CPU utilization and execution
    time metrics are important that they are discussed in each chapter of this book)


    Table 1-2. List of Performance Metrics (Partial)


    | Performance Metric | Units of Measurement | Specific Chapter(s) in This Book
    |

    | --- | --- | --- |

    | CPU Utilization | Percent | All Chapters |

    | Physical/Virtual Memory Usage | Bytes, kilobytes, megabytes, gigabytes | Chapter
    4 - Garbage Collection<br>Chapter 5 - Collections and Generics |

    | Cache Misses | Count, rate/second | Chapter 5 - Collections and Generics<br>Chapter
    6 - Concurrency and Parallelism |

    | Page Faults | Count, rate/second | -- |

    | Database Access Counts/Timing | Count, rate/second, milliseconds | -- |

    | Allocations | Number of bytes, number of objects, rate/second | Chapter 3 -
    Type Internals<br>Chapter 4 - Garbage Collection |

    | Execution Time | Milliseconds | All Chapters |

    | Network Operations | Count, rate/second | Chapter 7 - Networking, I/O, and Serialization<br>Chapter
    11 - Web Applications |

    | Disk Operations | Count, rate/second | Chapter 7 - Networking, I/O, and Serialization
    |

    | Response Time | Milliseconds | Chapter 11 - Web Applications |

    | Garbage Collections | Count, rate/second, duration (milliseconds), % of total
    time | Chapter 4 - Garbage Collection |

    | Exceptions Thrown | Count, rate/second | Chapter 10 - Performance Patterns |

    | Startup Time | Milliseconds | Chapter 10 - Performance Patterns |

    | Contentions | Count, rate/second | Chapter 6 - Concurrency and Parallelism |


    1'
