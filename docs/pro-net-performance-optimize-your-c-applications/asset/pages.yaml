  md: "CHAPTER 3 TYPE INTERNALS\n\n# Virtual Methods on Value Types\n\nWe haven't\
    \ considered the method table pointer yet, and already we have insurmountable\
    \ problems when attempting to treat value types as first-class citizens. Now we\
    \ turn to virtual methods and interface implementations. The CL forbids inheritance\
    \ relationships between value types, making it impossible to define new virtual\
    \ methods on value types. This is formative, but if it were possible to define\
    \ virtual methods on value types, invoking these methods would require a method\
    \ table pointer which is not part of a value type instance. This is not a substantial\
    \ limitation, because the copy-by-value semantics of reference types make them\
    \ ill suited for polymorphism, which requires object references.\nHowever, value\
    \ types come equipped with virtual methods inherited from System.Object. There\
    \ are several of them: Equals, GetHashCode, ToString, and Finalize. We will discuss\
    \ only the first two here, but much of the discussion applies to the other virtual\
    \ methods as well. Let's start by inspecting their:\n\n```\npublic class Object\n\
    {\n    public virtual bool Equals(object obj) ...\n    public virtual int GetHashCode()\
    \ ...\n}\n```\n\nThese virtual methods are implemented by every .NET type, including\
    \ value types. It means that given an instance of a value type, we should be able\
    \ to dispatch the virtual method successfully, even though it doesn't have a method\
    \ table pointer! This third example of how the value type layout affects our ability\
    \ to do even simple operations with value type demands a mechanism that can \"\
    turn\" value type instances into something that can plausibly stand for an \"\
    authentic\" object.\n\n# Boxing\n\nWhenever the compiler detects a situation requiring\
    \ treating a value type instance as a reference, it emits the BOX instruction.\
    \ The JIT compiler, in turn, interprets this instruction and emits a call to a\
    \ method that allocates heap storage, copies the contents of the value type instance\
    \ to the heap, and wraps the value contents with an object header – object header\
    \ word and method table pointer. This is \"box\" that is used whenever an object\
    \ reference is required. Note that the box is detached from the original value\
    \ type instance – changes made to one do not affect the other.\n\n![](img/d3ea56daae375e1d9f44d8bff55d84b7_85_0.png)\n\
    \nFigure 3-9. Original value and boxed copy on the heap. The boxed copy has the\
    \ reference type \"overhead\" (object header word and method table pointer), and\
    \ may require further heap alignment\n\n82"
  merge: -1
