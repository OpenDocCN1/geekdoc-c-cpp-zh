    If these pixels were represented by a reference type, then we would double or
    triple the memory footprint of the application; the practical approach is using
    value types to represent pixels, which can bring down the memory footprint by
    a factor of 2 or 3, and the time spent in GC by several orders of magnitude.


    # Pinning


    We have previously discussed pinning as a correctness measure that must be employed
    to ensure that the address of a managed object can be safely passed to unmanaged
    code. Pinning an object keeps it in the same location in memory, reducing the
    garbage collector''s inherent inability to defrag the heap by sweeping objects
    around.


    With in mind, we can summarize the best practices for pinning in applications
    that require it.


    +   - Pin objects for the shortest time possible. Pinning is cheap if no garbage
    collection occurs while the object is pinned. If calling unmanaged code requires
    a pinned object for an indefinite time (such as an asynchronous call), consider
    copying or using unmanaged memory allocation instead of pinning a managed object.

    - Pin a few large buffers instead of many small ones, even if it means you to
    manage the small buffer sizes yourself. Large objects do not move in memory, thus
    minimizing the fragmentation cost of pinning.

    - Pin and re-use old objects that have been allocated in the application''s startup
    phase instead of allocating new buffers for pinning. Large objects rarely move,
    thus minimizing the fragmentation cost of pinning.

    - Consider allocating unmanaged memory if the application relies heavily on pinning.
    Unmanaged memory can be directly manipulated by unmanaged code without pinning
    or incurring any garbage collection cost. Using unsafe code (C# pointers) it is
    possible to conveniently manipulate unmanaged memory blocks from managed code
    without copying the data to managed data structures. Allocating unmanaged memory
    from managed code is typically performed using the System.Runtime.InteropServices.Marshal
    class. (See Chapter 8 for more details.)


    # Finalization


    The spirit of the finalization section makes it quite clear that the automatic
    non-deterministic finalization feature provided by .NET leaves much to be desired.
    The best piece of advice with regard to finalization is to make it deterministic
    whenever possible, and delegate the exceptional cases to the non-deterministic
    finalizer.'
