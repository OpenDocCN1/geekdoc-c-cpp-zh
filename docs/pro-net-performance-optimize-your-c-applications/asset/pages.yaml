  md: '# CHAPTER 4 GARBAGE COLLECTION


    # GC Heap


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_102_0.png)


    Next Object Pointer


    Figure 4-5. GC heap and the next object pointer


    Satisfying an allocation request is extremely complex in this model: it involves
    the atomic increment of a single pointer. Multi-processor systems are likely to
    experience contention for this pointer (a concern that will be addressed later
    in this chapter).


    If memory were infinite, allocation requests could be satisfied by incrementing
    the new object pointer. However, at some point in time we reach a threshold that
    triggers a garbage collection. The thresholds are dynamic and configurable, and
    we will look into ways of controlling them in this chapter.


    During the compact phase, the garbage collector moves live objects in memory so
    that they occupy a consecutive area in space (see 4-6). This aids locality of
    reference, because objects allocated are also likely to be used together, so it
    is preferable to keep them together in memory. On the other hand, moving objects
    around at least two pain-points:


    +   - Moving objects around copying memory, which is an expensive operation for
    large objects. Even if the copy is optimized, copying several megabytes of memory
    in garbage collection cycle results in unreasonable overhead. (This is why large
    objects are treated differently, as we see later.)

    - When objects are moved, references to them must be updated to reflect their
    new location. For objects that are frequently referenced, this scattered memory
    access (when references are updated) can be costly.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_102_1.png)


    Next Object Pointer


    Figure 4-6. The shaded objects on the left survive garbage collection and are
    shifted around in memory. This means that the reference to A (dashed line) has
    to be updated. (The updated reference is not shown in the diagram).


