  md: '# CHAPTER 8 UNSAFE CODE AND INTEROPERABILITY


    PIA assemblies had an important feature called type equivalence. Since they have
    a strong name and are put into the GAC, managed components can exchange the RCWs,
    and from .NET''s perspective, they would have equivalent type. In contrast, interoper
    assemblies generated by tbimp.exe would not have this feature, each component
    would have its own distinct internal assembly. With NoPIA, since there is a strongly
    assembly is not used. Microsoft could come up with a solution that treats RCWs
    from different assemblies as the same type, as long as the interfaces have the
    same GUID.


    +   To enable NoPIA, set Properties on the interoper assembly under References,
    and set "Embed Interop Types" to True (see Figure 8-7).


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_252_0.png)


    Figure 8-7. Enabling NoPIA in interoper assembly reference properties


    # Exceptions


    Most COM interfaces report success or failure via an HRESULT value. Negative HRESULT
    values (with most significant bit set) indicate failure, while zero (OK) or positive
    values report success. Additionally, a COM object may provide richer information
    by calling the SetErrorInfo function, passing an IErrorInfo object which is created
    by calling CreateErrorInfo. When calling a method via COM Interop, the marshaler
    stub converts the HRESULT into a managed exception according to the HRESULT value
    and the data contained inside the IErrInfo object. Showing exceptions is relatively
    expensive, COM functions that fail frequently with the PreserveSigAttribute. You
    will have to change the managed signature to return an int, and the retval an
    "out" parameter.


    252'
