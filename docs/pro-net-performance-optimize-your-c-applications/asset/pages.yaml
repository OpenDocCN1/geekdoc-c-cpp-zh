  md: '# CHAPTER 2 PERFORMANCE MEASUREMENT


    profile your application. In the directions and screenshots below, we used ANTS
    Profiler 7.3, which was the latest version available at the time of writing.


    You can use the FileExplorer.exe application from this chapter''s source code
    folder to follow this demonstration—to make it leak, navigate the directory tree
