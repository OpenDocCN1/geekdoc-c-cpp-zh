  md: "Note Theoretically, NGen could use a completely different—and larger—set of\
    \ optimizations than what the JIT compiler uses at runtime. After all, NGen is\
    \ not as time-bound as the JIT compiler. However, at the time of writing, NGen\
    \ has no optimizations up its sleeve other than those the JIT compiler employs.\n\
    \nWhen using CLR 4.5 on Windows 8, NGen does not passively wait for your instructions\
    \ to pre-compile application assemblies. Instead, the CLR generates assembly usage\
    \ logs that are processed by NGen's background maintenance task. This task decides,\
    \ periodically, which assemblies would benefit from precompilation, and runs NGen\
    \ to create native images for them. You can still use NGen's \"display\" command\
    \ to review the native cache (or inspect the files from a command prompt), but\
    \ much of the burden of deciding which assemblies would benefit from pre-compilation\
    \ is now at the CLR's discretion.\n\n# Multi-Core Background JIT Compilation\n\
    \nStarting in CLR 4.5, you can instruct the JIT compiler to generate a profile\
    \ of methods executed during application startup, and use that on subsequent application\
    \ launches (including cold startup scenarios) to compile these methods in the\
    \ background. In other words, when your application's main thread is initializing,\
    \ the JIT compiler executes on background threads that methods are already to\
    \ be compiled by the time they are needed. The profile information is updated\
    \ on each run, so it will remain fresh and up to date even if the application\
    \ is launched for hundreds of times with different configurations.\n\nNote This\
    \ feature is enabled by default in ASP.NET and Silverlight 5 applications.\n\n\
    To opt into multi-core background JIT compilation, you can call two methods on\
    \ the System.Runtime.ProfileOptimization class. The first method tells the profiler\
    \ where the profiling information can be stored, and the second method tells the\
    \ profiler which startup scenario is being executed. The purpose of the second\
    \ method is to distinguish between different scenarios, so that the optimization\
    \ is tailored for the specific scenario. For example, an archiving utility may\
    \ be invoked with a \"display files in archive\" parameter, which requires one\
    \ set of methods, and a \"create compressed archive from directory\" parameter,\
    \ which requires a completely different set of methods.\n\n```\npublic static\
    \ void Main(string[] args) {\n    System.Runtime.ProfileOptimization.SetExecutingRoot(\n\
    \        Path.GetDirectoryName(Assembly.GetAssembly()).Location));\n    if (args[0]\
    \ == \"display\") {\n        System.Runtime.ProfileOptimization.StartProfile(\"\
    DisplayArchive.prof\");\n    } else if (args[0] = \"compress\") {\n        System.Runtime.ProfileOptimization.StartProfile(\"\
    CompressDirectory.prof\");\n    }\n    //..More startup scenarios\n//The rest\
    \ of the application's code goes here, after determining the startup scenario\n\
    }\n```"
