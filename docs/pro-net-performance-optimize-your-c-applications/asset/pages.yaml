  md: '# CHAPTER 8 UNSAFE CODE AND INTEROPERABILITY


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_249_0.png)


    **Figure 8-5.** Unmanaged client calling a managed COM object


    COM interop-uses the P/Invoke parameter marshaling infrastructure, with some changes
    in details (e.g., a string is marshaled to BSTR by default, so the advice provided
    in the P/Invoke section of this chapter applies here well.


    COM has its own performance issues arising from COM-specific particularities such
    as the threading model and a mismatch between the reference counter-based nature
    of COM and the .NET garbage collection approach.


    # Lifetime Management


    When you hold a reference to a COM object in .NET, you are actually holding a
    reference to an RCW. The RCW always holds a single reference to the underlying
    COM object and there is only one RCW instance per COM object. The RCW maintains
    its own reference count, separate from the COM reference count. This reference
    count is usually one but can be greater if a number of interface pointers are
    marshaled or if the same interface has been marshaled by multiple threads.


    Normally, when the last reference to the RCW is gone and there is a subsequent
    garbage collection at the generation where the RCW resides, the Release method
    on the IUnknown pointer decrements the COM object''s reference count (which was
    one). The COM object destroys itself and releases its memory.


    Since .NET GC run on non-deterministic times it is not aware of the unmanaged
    memory caused by it holding RCWs and subsequently COM objects alive, it will not
    hasten garbage collections and memory usage may become very high.


    If necessary, you can call the Marshal.ReleaseObject to explicitly release the
    object. Each call will increment the RCW''s reference count and when it reaches
    zero, the underlying COM object''s reference count will be decremented (just like
    in the RCW''s finalizer), releasing it. This ensures that you do not continue
    to use the RCW after Marshal.ReleaseObject. If the RCW reference count is greater
    than zero, you will need to loop until it returns zero. It is a best practice
    to call Marshal.ReleaseObject inside a finally block, to ensure that the release
    occurs even in the case of an exception being thrown between the instantiation
    and the release of the COM object.


    # Apartment Marshaling


    COM implements its own thread synchronization for managing cross-thread calls,
    even for objects not designed for multi-threading. These mechanisms can degrade
    performance if one is not aware of them. While this is not specific for interoperability
    with .NET, it is nonetheless worth discussing as it is a common pitfall, likely
    because developers who are accustomed to .NET synchronization conventions might
    be unaware of what COM is doing behind the scenes.


    249'
