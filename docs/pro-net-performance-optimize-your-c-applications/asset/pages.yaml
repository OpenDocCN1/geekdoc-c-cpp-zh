    In Chapter 3 we will discuss in depth the instruction sequence emitted by the
    JIT compiler to call a non-virtual method and to a virtual method. When calling
    a non-virtual method, the JIT compiler must emit an instruction that makes sure
    we are not making a call on a null reference. The CMP instruction in the second
    loop serves as that. In the first loop, the JIT compiler is smart enough to optimize
    this check away, immediately prior to the call, there is a null reference check
    of the result of the call (if (emp !=null)). In the second loop, the JIT compiler''s
    heuristics are not sufficient to optimize the check away (although it would have
    been safe), and this extra instruction is responsible for the 7-8% of performance
    overhead.


    After adding the virtual modifier, however, the JIT compiler generates the same
    code in both loop bodies.


    ```

    ; Disassembled loop body - both cases

    mov eax,ebx

    mov eax,1A3794h (MT: Employee)

    call clr!JIT_InstanceOfClass (6b2acfaa)

    test eax,eax

    je WRONG_TYPE

    mov eax,eax

    mov eax,dword ptr [ecx]

    mov eax,dword ptr [eax+28h]

    call dword ptr [eax+10h]

    WRONG_TYPE:

    ```


    The reason is that when invoking a virtual method, there''s no need to perform
    a null reference check—it is inherent in the method dispatch sequence (as we will
    see in Chapter 3). When the loop bodies are identical, so are the timing results.


    # Microbenchmarking Guidelines


    For successful microbenchmarks you have to make sure that what you decided to
    measure adheres to the following:


    +   - Your test.code is representative of the real environment for which it is
    being developed. For example, you should not run a method on in-memory data collections
    if it is designed to operate on database tables.


    56'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# CHAPTER 2 PERFORMANCE MEASUREMENT


    +   * Your test code''s inputs are representative of the real input for which
    it is being developed. For example, you should not measure a sorting method fails
    on three-element lists if it is designed to operate on several million elements.


    +   * The supporting code used to set up the environment should be negligible
    compared to the actual code you are measuring. If this is impossible, then the
    setup should happen once and the test code should be repeated many times.


    +   * The test code should run for sufficiently long so as to be considerable
    and reliable in the face of hardware and software fluctuations. For example, if
    you are testing the overhead of a boxing operation on value types, a single boxing
    operation is likely to be too fast to produce significant results, and will require
    many iterations of the same test to become substantial.


    +   * The test code should not be optimized by the language compiler or the JIT
    compiler. This happens in Release mode when trying to measure simple operations.
    (We will return to this point later).


    When you have ascertained that your test code is sufficiently robust and measures
    the precise effect that you intended to measure, you should invest some time in
    setting up the benchmarking environment:


    +   * When the benchmark is running, no other processes should be allowed to run
    on the target system. Networking, file I/O, and other types of external activity
    should be minimized (for example, by disabling the network card and shutting down
    unnecessary services).


    +   * Benchmarks that allocate many objects should be wary of garbage collection
    effects. It''s advisable to force a garbage collection before and after significant
    benchmark iterations to minimize their effects on each other.


    +   * The hardware on the test system should be similar to the hardware used in
    the production environment. For example, benchmarks that involve intensive random
    disk seeks will run much faster on a solid hard drive than a mechanical drive
    with a rotating head. (The same applies to graphics cards, specific processor
    features such as SIMD instructions, memory architecture, and other hardware traits.)


    Finally, you should focus on the measurement itself. These are the things to keep
    in mind when designing benchmarking code:


    +   * Discard the first result—it is often influenced by the JIT compiler and
    application startup costs. Moreover, during the first measurement data and instructions
    are unlikely to be in the processor''s cache. (There are some benchmarks that
    measure cache effects, and should not heed this advice.)


    +   * Repeat measurements many times and use more than the average—the standard
    deviation (which represents the variance of the results) and the fluctuations
    between consecutive measurements are interesting as well.


    +   * Subtract the measurement loop''s overhead from the benchmarked code—this
    requires measuring the overhead of an empty loop, which isn''t trivial because
    the JIT compiler is likely to optimize empty loops. (Writing the loop by hand
    in assembly language is one way of countering this risk.)


    +   * Subtract the measurement overhead from the timing period, and use the least
    expensive and accurate time measurement approach available—this is usually System.Diagnostics.Stopwatch.'
