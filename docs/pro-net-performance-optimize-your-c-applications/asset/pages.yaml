  md: '# CHAPTER 6 CONCURRENCY AND PARALLELISM


    The Windows kernel implements the synchronization mechanisms we are now discussing
    by blocking a thread that attempts to acquire the lock when the lock is not available.
    Blocking a thread removes it from the CPU, marking it as waiting, and scheduling
    another thread for execution. This operation involves a system call, which is
    a user-mode to kernel transition, a context switch between threads, and a small
    set of data structure updates (see Figure 6-9) performed in the kernel to mark
    the thread as waiting and associate it with the synchronization mechanism for
    which it''s waiting.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_202_0.png)


    **Figure 6-9.** The data maintained by the operating system scheduler. Threads
    ready for execution are placed in FIFO queues. Blocked threads recover their synchronization
    mechanism through an internal structure called a wait


    Overall, there are potentially thousands of CPU cycles spent blocking a thread,
    and a number of cycles is required to unlock it when the synchronization mechanism
    becomes available. It is clear, then, that a kernel synchronization mechanism
    is used to protect a long-running operation such as writing a buffer to a file
    or performing a network round-trip, this overhead is negligible, but if a kernel
    synchronization mechanism is used to protect an operation like ++++, this overhead
    introduces an unnecessary cost.

    The synchronization mechanisms Windows and .NET make available to applications
    differ primarily in terms of their acquire and release semantics, also known as
    their signal state. When a synchronization mechanism becomes signaled, it wakes
    up a thread (or a group of threads) waiting for it to become available. Below
    are the signal semantics for some of the synchronization mechanisms currently
    accessible to .NET applications:


    **Table 6-1.** Signal Semantics of Some Synchronization Mechanisms


    | Synchronization Mechanism | When Does It Become Signaled? | Which Threads Are
    Woken? |

    |---|---|---|

    | Mutex | When a thread calls Mutex.Release | One of the threads are waiting for
    the mutex |

    | Semaphore | When a thread calls Semaphore.Release | One of the threads are waiting
    for the semaphore |

    | ManualResetEvent | When a thread calls ManualResetEvent.Set | All of the threads
    are waiting for the event |

    | AutoResetEvent | When a thread calls AutoResetEvent.Set | One of the threads
    are waiting for the event |

    | Monitor | When a thread calls Monitor.Exit | One of the threads are waiting
    for the Monitor |


