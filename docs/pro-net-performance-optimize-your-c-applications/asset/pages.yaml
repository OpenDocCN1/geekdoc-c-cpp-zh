  md: 'When List<T>.Contains needs to invoke Equals on two elements of the collection,
    it uses the EqualityComparer<T>.Default static property to retrieve an equality
    comparer implementation for comparing instances of T, and calls its Equals(T,
    T) virtual method. CreateComparer private static method creates the appropriate
    equality comparer the first time it''s requested and subsequently caches it in
    a static field. When CreateComparer sees that T implements IEquatable<T>, it returns
    an instance of GenericEqualityComparer<T>, which has an IEquatable<T> constraint
    and invokes Equals through the interface. Otherwise, CreateComparer resorts to
    the ObjectComparer<T> class, which has no constraints on T and invokes the Equals
    virtual method provided by Object.


    This trick employed by List<T> for equality checking can be useful for other purposes
    as well. When a constraint is applied, your generic class or method can use a
    potentially more efficient implementation that does not resort to runtime type
    checking.


    Tip As you see, there are no generic constraints to express mathematical operators,
    as with addition or multiplication. This means you can''t write a generic method
    that uses an expression such as a+b on generic parameters. The standard solution
    for writing generic algorithms is to use a helper struct that implements IMath<T>
    interface with the required arithmetic operations, and instantiate this struct
    in the generic method. For more details, see Rudiger Kael''''s CodeProject article,
    "Using generics for calculations," available at http://codeproject.com/Articles/8531/Using-generics-for-calculations.


    Having examined syntactic features of generics in C#, we now turn to their runtime
    implementation. Before we concern ourselves about this matter, it''s pertinent
    to ask whether there is a runtime representation of generics — as we will see,
    C++ templates, a similar mechanism, have no runtime representation to speak of.
    This question is easily answered if you look at the wonders Reflection can do
    with generic types at runtime:


    ```

    Type list = typeof(List<>);

    Type listOfInt = list.MakeGenericType(typeof(int));

    IEnumerable<int> ints = (IEnumerable<int>)Activator.CreateInstance(int)Activator.CreateInstance(listOfInt);

    Dictionary<string, int> frequencies = new Dictionary<string, int>();

    Type openDictionary = frequencies.GetType().GetGenericTypeDefinition();

    type dictToString = openDictionary.MakeGenericType(typeof(string), typeof(double));

    ```


    As you see, we can dynamically create generic types from an existing generic type
    and parameterize an "open" generic type to create an instance of a "closed" generic
    type. This demonstrates that generics are first-class citizens with a runtime
    representation, which we now survey.


    # Implementation of CLR Generics


    The syntactic features of CLR generics are fairly similar to Java generics and
    even resemble C++ templates. However, it turns out that their internal implementation
    and the limitations imposed upon programs using them are very different from Java
    and C++. To understand these differences we should briefly review generics and
    C++ templates.'
