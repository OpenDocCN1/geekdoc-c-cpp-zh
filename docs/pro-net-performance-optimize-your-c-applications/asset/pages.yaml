    # NP-Complete Problems


    Even within the realm of decidable problems—those that can be solved by a Turing—there
    are problems that do not have efficient solutions. Computing a perfect strategy
    for a game of chess on an n×n chessboard requires exponential in n, which places
    the problem of solving the generalized chess game out of P. If you likes or dislike
    computer programs playing better than humans, you should take some solace in the
    fact that generalized checks is not in P either.


    +   * traveling salesman problem: Find a path of minimal cost for a salesman who
    has to visit different cities.

    * The maximum clique problem: Find the largest subset of nodes in a graph where
    every two nodes are connected by an edge.

    * The minimum cut problem: Find a way to divide a graph into two subsets of nodes
    such that there are a minimum number of edges crossing from one to the other.

    * The Boolean satisfiability problem: Determine whether a Boolean formula of a
    certain form (such as "A and B or not "A") can be satisfied by an assignment of
    true values to its variables.

    * The cache placement problem: Decide where to place data in cache and which data
    to evict from cache, giving a history of memory accesses performed by an application.


    These problems belong in another set of problems called NP. The problems in NP
    are characterized as follows: if a problem in NP, there exists a Turing machine
    that can verify the solution of A for an input of size n in polynomial time. For
    example, verifying that a true assignment to variables is legal and solves the
    Boolean satisfiability problem is clearly easy, as well as linear in the number
    of variables. Similarly, verifying that a subset of nodes is a clique is very
    easy. In other words, these problems have easily verifiable solutions, but it
    is not known whether there is a way to efficiently come up with these solutions.


