    The standard code emitted by the JIT in this scenario is:


    ```

    ; ESI has A, EDI has B, ECX has C, EDX the iteration variable

    x edx,edx

    cmp dword ptr [esi+4],0

    le END_LOOP

    NEXT_ITERATION:

    fld dword ptr [esi+edx*4+8]    ; load A[i], no range check

    mp edx,dword ptr [edi+4]      ; range check before B[injnjae OUT_OF_RANGE

    add dword ptr [esi+edx*4+8]   ; add B[i]

    cmp edx,dword ptr [ecx+4]    ; range check before accessing C[i]

    jae OUT_OF_RANGE

    fst dword ptr [ecx+edx*4+8]  ; store in C[i]

    inc edx

    cmp dword ptr [esi+4],edx  ; are we done yet?

    j NEXT_ITERATION

    END_LOOP:

    ```


    Each iteration performs a FADD instruction that adds two 32-bit floating-point
    numbers. However, by using 128-bit SSE instructions, four iterations of the loop
    are issued at a time, as follows (the code below performs range checks and assumes
    that the number of iterations is equally divisible by 4):


    ```

    xor edx, edx

    NEXT_ITERATION:

    movups xmm1, xmmword ptr [edi+edx*4+8] ; copy 16 bytes from B to xmm1

    movups xmm0, xmmword ptr [esi+4] ; copy 16 bytes from A to xmm0

    addps xmm0,xmm1                  ; add xmm0 to xmm1 and store the result in xmm1

    movups xmmword ptr [ecx+edx*4+8], xmm1 ; copy 16 bytes from A to C

    add edx,4

    cmp edx, dword ptr [esi+4]      ; increase loop index by 4

    j NEXT_ITERATION

    ```


    On an AVX processor, we could move more data in each iteration (with the 256-bit
    YMM registers), for even better performance improvement:


    ```

    xor edx, edx

    NEXT_ITERATION:

    movups ymm1, ymmword ptr [edi+edx*4+8] ; copy 32 bytes from B to ymm1

    movups ymm0, ymmword ptr [esi+4]      ; copy 32 bytes from A to ymm0

    vaddps ymm0,ymm1,ym1                ; add ymm0 to ymm1 and store the result in
    ymm1

    movups ymmword ptr [ecx+edx*4+8], ymm1 ; copy 32 bytes from ymm1 to C

    add edx,8

    cmp edx, dword ptr [esi+4]      ; increase loop index by 8

    j NEXT_ITERATION

    ```


