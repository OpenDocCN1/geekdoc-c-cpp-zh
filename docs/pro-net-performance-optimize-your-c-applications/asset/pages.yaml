  md: '# CHAPTER 4 GARBAGE COLLECTION


    +   - Pinning is a necessity whenever managed objects are passed by reference
    to unmanaged code, but can introduce internal fragmentation in the GC heap, including
    the lower generations.


    +   - Segments ensure that virtual memory is allocated in large chunks, but can
    exhibit external fragmentation of virtual memory space.


    +   - Automatic finalization provides disposal of unmanaged resources, but is
    associated with a high performance cost and often leads to mid-life crisis, high-pressure
    memory leaks and race conditions.


    The following is a list of some of the best practices for getting the most of
    the .NET garbage collector:


    +   - Allocate temporary objects so that they die, but keep old objects alive
    for the entire lifetime of your application.


    +   - Pin large arrays at allocation initialization, and break them into small
    buffers as needed.


    +   - Manage memory using pooling or unmanaged allocation where the GC fails.


    +   - Implement deterministic finalization and rely on automatic finalization
    as a backup strategy.


    +   - Tune your application using GC factors to find which one works best on various
    types of hardware and software configurations.


    Some of the tools that can be used to diagnose memory-related issues and to examine
    the behavior of your application from the memory management perspective is the
    following:


    +   - CLR Profiler can be used to diagnose internal fragmentation, the heavy memory
    allocation paths in an application, see which objects are reclaimed at each garbage
    collection and obtain general statistics on the size and age of retained objects.


    +   - SOS.DLL can be used to diagnose memory leaks, analyze external and internal
    fragmentation, obtain garbage collection timing, list the objects in the managed
    heap, inspect the finalize view and the status of the GC threads and the finalizer
    thread.


    +   - CLR performance counters can be used to obtain general statistics on garbage
    collection, including the size of each generation, the allocation rate, finalize
    information, pinned object count and more.


    +   - CLR hosting can be used as a diagnostic utility to analyze segments, garbage
    collection frequencies, causing garbage collections and non-GC memory allocation
    requests originating at the CLR.


    Armed by the theory of garbage collection, the subtleties of all related mechanisms,
    common pitfalls and best performance practices, and diagnostic tools and scenarios,
    you are now ready to begin the quest to optimize memory management in your applications
    and to design them with a proper memory management strategy.'
