  md: '# Configuring Compression


    The first thing that needs to be done to compression is to enable static compression,
    dynamic compression, or both. To enable compression in IIS, use the IIS Manager
    application, select your machine, and select which compression features you wish
    to use, as shown in Figure 11-3:


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_326_0.png)


    # Compression


    Enable this feature to configure settings for compression of response


    +   - Enable dynamic content compression

    - Enable static content compression


    **Figure 11-3.** Enabling dynamic and static compression in the IIS Manager application


    You can also use the Compression dialog to set static compression settings, such
    as the folder where the cached content will be stored, and the minimum file size
    eligible for compression.


    After selecting compression types are active, you can go ahead and select which
    MIME types will be statically compressed and which will be dynamically compressed.
    Unfortunately, IIS doesn''t support changing these settings from the IIS Manager,
    so you will need to change manually in the IIS configuration file, applicationHost.config,
    which is located in the %systemroot%system32\inetrv\config folder and search for
    the `<httpCompression>` section, you should see several MIME types defined for
    static compression and several other types for dynamic compression. In addition
    to the already specified MIME types, you can add additional types which you use
    in your applications. For example, if AJAX calls return JSON responses, you might
    want to add dynamic compression support for those responses. The following configuration
    shows how to dynamic compression support for IIS (existing content was removed
    for brevity):


    ```

    <httpCompression>

    <dynamicMimeTypes>

    <add mimeType="application/json; charset=utf-8" enabled="true" />

    </dynamicMimeTypes>

    </httpCompression>

    ```


    > After adding new MIME types to the list, it is advised that you verify the compression
    is indeed working by checking the responses with HTTP sniffing tools, such as
    Fiddler. Compressed responses should have the Content-Encoding HTTP header, and
    it should be set to gzip or deflate.


    # IIS Compression and Client Applications


    In order for IIS to handle outgoing requests, it needs to know that the client
    application can handle compressed responses. Therefore, when a client application
    sends a request to the server, it needs to add the Accept-Encoding HTTP header
    and set it to gzip or deflate.


    Most known browsers add this header automatically, when using a browser with a
    web application or a Silverlight application, IIS will respond with compressed
    content. However, in .NET applications, when sending HTTP requests with the HttpRequest
    type, the Accept-Encoding header is not automatically added, and you'
