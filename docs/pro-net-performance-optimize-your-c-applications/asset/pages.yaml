  md: '# CHAPTER 8 UNSAFE CODE AND INTEROPERABILITY


    **Note** Passing large value parameters (more than a dozen or so bytes long) by
    value is more expensive than passing them by reference. The same goes for large
    return values, where out parameters are a possible alternative.


    # Code Access Security


    The .NET Code Access Security mechanism enables running partially trusted code
    in a sandbox, with restricted access to runtime capabilities (e.g. P/Invoke) and
    BCL functionality (e.g. file and registry access). When calling native code, CAS
    requires that all assemblies whose method in the call stack have the UnmanagedCode
    permission. The marshaller stub will demand this permission for each call, which
    involves walking the call stack to ensure that all code has permission.


    **Tip** If you fully trusted code or any (other) means to ensure security, you
    can gain a substantial performance increase by placing the SuppressUnmanagedCodeSecurityAttribute
    on the P/Invoke method declaration, a class (in which case it applies to contained
    methods), an interface or a delegate.


    # COM Interoperability


    COM was designed for the very purpose of writing components in any COM-capable
    language/platform and consumption there in any (other). There is no exception,
    and it allows you to easily consume COM objects and .NET types use COM objects.

    With COM interp, the basic idea is the same as in P/Invoke: you declare a representation
    of the COM object and the CLR creates a wrapper object that handles the marshaling.
    There are two kinds of wrappers: Runtime Wrapper (RCW) which enables managed code
    to use COM objects and Callable Wrapper (CCW) which enables COM to call managed
    types (see Figure 8-4). Third party components are often shipped with a Primary
    Interop Assembly, which contains vendor-approved interop definitions and is strongly
    named (signed) and installed in the GAC. Other times, you can use thelb tool,
    which is part of the Windows SDK to auto-generate an interop assembly based on
    the information contained in the type library.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_248_0.png)


    248'
