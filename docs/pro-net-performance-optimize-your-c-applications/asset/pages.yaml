    # Maximum Cut


    We are given a graph and need to find a cut—grouping of its vertices into two
    disjoint sets—such that the number of edges crossing between the sets (crossing
    the cut) is maximal. This is known as the maximum cut problem, and solving it
    is quite useful for planning in many engineering fields.


    We produce a simple and intuitive algorithm that yields a 2-approximation:


    +   1. Divide the vertices into two disjoint sets, A and B.

    2. Find a vertex $v$ in A that has more neighbors in A than in B.

    3. Move $v$ from A to B and go back to step 2.


    First, let $A$ be a subset of the vertices and $v$ a vertex in $A$. We denote
    by $\deg_A(v)$ the number of vertices in $A$ that $v$ has (i.e. the number of
    its neighbors in $A$). Next, we consider two subsets $A$ and $B$ of the vertices,
    we denote by $e(A, B)$ the number of edges between two different sets and by $e(A)$
    the number of edges crossing between vertices in the set A.


    When the algorithm terminates, for each $v \in A$, it holds that $\deg_A(v) \geq
    \deg_B(v)$—otherwise the algorithm would repeat step 2. By summing all the vertices,
    we obtain $e(A, B) \geq \deg_A(v) + \dots + \deg_A(v) = \deg(A) \geq 2e(B)$, because
    every edge on the right hand side is counted twice. Similarly, $e(A, B) \geq 2e(A)$
    and the right hand side is the total number of edges in the graph. Therefore,
    the number of edges crossing the cut is at least half the total number of edges
    in the graph. The number of edges crossing the cut cannot be larger than the total
    number of edges in the graph, so we have a 2-approximation.


    Finally, it is worth noting that the algorithm runs for a number of steps that
    is linear in the number of edges in the graph. Whenever it repeats 2 steps, the
    number of edges crossing the cut increases by at least 1, and it is bounded from
    above by the total number of edges in the graph, so the number of steps is also
    bounded by that number.


    # Probabilistic Algorithms


    When considered approximation algorithms, we were still bound by the requirement
    of producing a deterministic solution. There are some cases, however, in introducing
    a source of randomness into an algorithm can provide probabilistically sound results,
    although it becomes no longer possible to guarantee absolutely the algorithm''s
    correctness or running time.


    # Probabilistic Maximum Cut


    It turns out that a 2-approximation of the maximum cut problem can be obtained
    by randomly selecting the two disjoint sets (specifically flipping a coin for
    each vertex whether it goes into A or B). By probabilistic analysis, the expected
    number of edges crossing the cut is $1/2$ of the total number of edges.


    To show that the expected number of edges crossing the cut is $1/2$ the total
    number of edges, consider the probability that an edge $(u, v)$ is crossing the
    cut. There are four alternatives with equal probability $1/4$: the edge is in
    $A$; the edge is in $B$; $v$ is in $A$, and $u$ is in $B$; $v$ is in $B$, and
    $u$ is in $A$. Therefore, the probability the edge is crossing the cut is $1/2$.


    For an edge $e$, the expected value of the indicator variable $Xe$ (that is 1
    when the edge is crossing the cut) is $1/2$. By linearity of expectation, the
    expected number of edges in the cut is $1/2$ the number of edges in the graph.


