  md: '# CHAPTER 4


    # Garbage Collection


    In this chapter, we will examine the .NET garbage collector (GC), one of the primary
    mechanisms affecting the performance of .NET applications. While freeing developers
    from worrying about memory deallocation, the GC introduces new challenges for
    constructing deterministically well-behaving programs in where performance is
    paramount. First, we will review the types of GC available in the CLR, and see
    how adapting an application to the GC can be very beneficial in terms of overall
    GC performance and pause times. Next, we will see how generations affect GC and
    how to tune applications accordingly. as well as the subtleties involved in using
    non-deterministic finalization.


    Many of the examples to point in this chapter are based on the authors'' personal
    experience with real-world systems. Where possible, we tried to point you to case
    studies and even sample applications that you can work on reading this chapter,
    illustrating the primary performance pain points. The "Best Practices" section
    toward the end of the chapter is full of such case studies and examples. However,
    you should be aware that some of the points are difficult to demonstrate with
    short code snippets or even a sample program because the situations where performance
    differences arise are typically within large projects that have thousands of types
    and millions of objects.


    # Why Garbage Collection?


    Garbage collection is a high-level abstraction that relieves developers of the
    need to care about managing deallocation. In a garbage-collected environment,
    memory allocation is tied to the creation of objects, and when these are no longer
    referenced by the application, the memory can be freed. A garbage collector also
    provides a finalization interface for unmanaged resources that do not reside on
    the managed heap, so that custom cleanup code can be executed when these resources
    are no longer needed. The two primary design goals of .NET garbage collector are:


    +   - Remove the burden of memory management bags and pitfalls

    - Provide memory management performance that matches or exceeds the performance
    of manual native allocators


    Existing programming languages and frameworks use several different memory management
    strategies. We will briefly examine two of them: free list management (that can
    be found in the C standard allocator) and reference counting garbage collection.
    This will provide us with a point of reference when looking at the internals of
    .NET garbage collector.'
