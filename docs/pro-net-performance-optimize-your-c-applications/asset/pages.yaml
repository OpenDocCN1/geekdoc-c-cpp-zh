    # Traveling Salesman


    To perform a formal analysis, we need to normalize somewhat the traveling salesman
    problem referred earlier. We are given a graph with a weight function u that assigns
    the graph''s edges values—you can think of this weight function as the distance
    between vertices. The weight function satisfies the triangle inequality, which
    definitely holds if we keep the adjacency of traveling trees on a Euclidean surface:


    For all vertices x, y, z

    $$w(x, y) + w(y, z) \geq w(x, z)$$


    The task, is, to visit every vertex in the graph (every city on the salesman''s
    map) exactly once and return to the starting vertex (the company headquarters),
    making the sum of edge weights along this path is minimal. Let uOPT be this minimal
    weight. The equivalent decision problem is NP-complete, as we have seen.

    The approximation algorithm proceeds as follows. First, construct a minimum spanning
    tree (MST) for the graph. Let uMST be the subgraph that touches every vertex,
    does not have cycles, and has the minimum total weight. We can assert that uMST
    ≤ uOPT, because uOPT is the total weight of a cyclic path that visits every vertex
    a spanning tree, and uMST is the total weight of the minimum spanning tree. Armed
    with this observation, we produce a 2-approximation to uOPT using the minimum
    spanning tree as follows:


    +   1. Construct an MST. There is a known O(log n) greedy algorithm for this.

    2. Traverse the MST from its root by visiting every node and returning to the
    root. The total weight of this path is 2uOPT.

    3. Fix the resulting path so that no vertex is visited more than once. If the
    situation in Figure 9–4 arises—the vertex y was visited more than once—then fix
    the path by removing the edges (x, y) and (y, z) and replacing them with the edge
    (x, z). This can only decrease the total weight of the path because of triangle
    inequality.


