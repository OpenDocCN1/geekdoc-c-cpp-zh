  md: 'If you have any assumptions about the life span of the dynamic content, you
    can also apply values to the max-age or Expires Headers. For example, if you assume
    that a discontinued product will not be changed, you can set the page returned
    for the product to expire in one year, as follows:


    ```

    if (productIsDiscontinued)

    Response.Cache.SetExpires(DateTime.Now.AddYears(1));

    ```


    You can also do the same with the Cache-Control max-age header:


    ```

    if (productIsDiscontinued)

    Response.Cache.SetMaxAge(TimeSpan.FromDays(365));

    ```


    Instead of setting the response''s expiration in code, you can specify it in the
    .aspx as an output directive. For example, if the product information shown in
    the page can be cached for 10 minutes (600 seconds) in the client, you can set
    the page''s output cache directive to the:


    ```

    <@ Page ... %>

    <% OutputCache Duration="600" Location="Client" %>

    ```


    When using the OutputCache directive, the specified duration is output to the
    response''s HTTP headers as max-age and expires (expires is calculated from the
    current date).


    # Turn on IIS Compression


    With the exception of multimedia files (sound, images, and videos) and binary
    files, such as Silverlight Flash components, most of the content returned from
    our web server is text-based, such as HTML, CSS, JavaScript, XML, and JSON. By
    using IIS compression, these textual responses can be shrunk in size, allowing
    a quicker response with smaller payloads. Payloads can be reduced in size to 50-60
    percent of their original size, and sometimes more than that. IIS supports two
    types of compression, static and dynamic. To use IIS compression, make sure you
    first install the static and dynamic compression IIS components.


    # Static Compression


    When using static compression in IIS, compressed content is stored on disk, so
    for subsequent requests for the resource, the already compressed content will
    be returned without the need to perform the compression again. By only compressing
    the content once, you pay with disk space, but reduce CPU usage and latency that
    is usually the result of using compression.


    Note that compression works for text files (*.htm, *.txt, *.css) and even for
    binary files, such as Microsoft Office documents (*.doc, *.xml), but doesn''t
    work for files which are already compressed, such as image (*.jpg, *.png) and
    compressed Microsoft Office documents (.docx, .xlsx).


    # Dynamic Compression


    When using dynamic compression, IIS performs the compression when a resource is
    requested, without storing the post-compression content. This means every time
    the resource is compressed before being sent to the client, incurring both CPU
    usage and latency due to the compression process. Dynamic compression, therefore,
    is suitable for content that changes often, such as ASP.NET pages.


    Since dynamic compression increases the CPU usage, it is advisable that you check
    your CPU utilization after turning on the compression, to verify it does not put
    too much strain on the CPU.'
