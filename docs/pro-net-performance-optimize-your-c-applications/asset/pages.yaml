  md: "# Poor Microbenchmark Example\n\nWe start with an example of a poorly designed\
    \ microbenchmark and improve it until the results it provides meaningful and correlate\
    \ with factual knowledge about the problem domain. The purpose is to determine\
    \ which is faster—using the Is key and casting to the desired type, or using the\
    \ keyword and relying on the result.\n\n```\n// Test class\nclass Employee {\n\
    \    public void Work() {}\n}\n//Fragment 1 - casting safely and then checking\
    \ for null\nstatic void Fragment1(object obj) {\n    Employee emp=obj as Employee;\n\
    \    if (emp!=null) {\n        emp.Work();\n    }\n}\n//Fragment 2 - first checking\
    \ the type and then casting\nstatic void Fragment2(object obj) {\n    if (obj\
    \ is Employee) {\n        Employee emp=obj as Employee;\n        emp.Work();\n\
    \    }\n}\nA rudimentary rudimentary benchmarking framework might go along the\
    \ following lines:\nstatic void Main() {\n    object obj=new Employee();\n   \
    \ Stopwatch sw=Stopwatch.Start();\n    for (int i=0; i<500; i++) {\n        Fragment1(obj);\n\
    \    }\n    Console.WriteLine(sw.ElapsedTicks());\n    sw=Stopwatch.Start();\n\
    \    for (int i=0; i<500; i++) {\n        Fragment2(obj);\n    }\n    Console.WriteLine(sw.ElapsedTicks());\n\
    }\n```\n\n+   - The loop runs only once and 500 iterations are not enough to reach\
    \ any meaningful conclusions—it takes a negligible amount of time to run the whole\
    \ benchmark, so it can be affected by many environmental factors.\n- No effort\
    \ was made to prevent optimization, so the JIT compiler may have inlined and discarded\
    \ both measurement loops completely."
