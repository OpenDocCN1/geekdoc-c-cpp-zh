  md: "# CHAPTER 3 TYPE INTERNALS\n\nIn some rare cases, it may be desired to customize\
    \ value type layout – one example is for interoperability purposes, when your\
    \ value type is passed to unmanaged code. This customization can be possible through\
    \ the use of two attributes, StructLayout and FieldOffset. The StructLayout attribute\
    \ can be used to specify that the object's fields are to be laid out sequentially\
    \ according to the type's definition (this is the default), or explicitly according\
    \ to the instructions provided by the FieldOffset attribute. This enables the\
    \ creation of C-style unions, where fields may overlap. A clear example of this\
    \ is the following value type, which can \"convert\" a floating-point number to\
    \ the four bytes used by its representation:\n\n```\n[StructLayout(LayoutKind.Explicit)]\n\
    public struct FloatingPointExplorer\n{\n    [FieldOffset(0)] public float F;\n\
    \    [FieldOffset(0)] byte B1;\n    [FieldOffset(1)] byte B2;\n    [FieldOffset(2)]\
    \ byte B3;\n    [FieldOffset(3)] byte B4;\n}\n```\n\nWhen you assign a floating-point\
    \ value to the object's F field, it concurrently modifies the values of B1-B4,\
    \ and vice versa. Effectively, the F field and the B1-B4 fields overlap in memory,\
    \ as demonstrated by Figure 3-8:\n\n| Value Address | | | |\n|---|---|---|---|\n\
    | | Storage for F | +0 byte |\n| | Storage for B2 | +1 byte |\n| | Storage for\
    \ B3 | +2 bytes |\n| | Storage for B4 | +3 bytes |\n\n**Figure 3-8.** Memory layout\
    \ for a FloatingPointExplorer instance. Blocks aligned horizontally overlap in\
    \ memory\n\nBecause value types do not have an object header or a method table\
    \ pointer, they cannot allow the same richness of semantics offered by reference\
    \ types. We will now look at the limitations of their simpler layout introduces,\
    \ and what happens when developers attempt to use value types in settings intended\
    \ for reference types.\n\n# Value Type Limitations\n\nFirst, consider the object\
    \ header word. If a program attempts to use a value type for synchronization,\
