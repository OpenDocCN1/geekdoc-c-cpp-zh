  md: "```\nreturn ++_i;\n}\n}\n```\n\nAs we attempt to verify what happens, we stumble\
    \ upon an unexpected obstacle: the C# compiler would not allow using types with\
    \ the lock keyword. However, we are now seasoned in the inner workings of what\
    \ the lock keyword does, and can attempt to code a workaround:\n\n```\nclass Counter\n\
    {\n    private int _i;\n    public int Increment()\n    {\n        bool acquired=false;\n\
    \        try\n{\n            Monitor.Enter(_i, ref acquired);\n            return\
    \ ++_i;\n        }\n        finally\n{\n            if (acquired) Monitor.Exit(_i);\n\
    \        }\n    }\n}\n```\n\nBy doing so, we introduced a bug it turns out that\
    \ multiple threads will be enter at once, and furthermore the Monitor. Exit call\
    \ will throw an exception (to understand the proper ways of synchronizing access\
    \ to an integer value, refer to Chapter 6). The problem is that the Monitor.Enter\
    \ accepts a System.Object parameter, which is a reference, and we are passing\
    \ it to a value type by value. Even if it were possible to pass the value unmodified\
    \ where a reference is expected, the value passed to the Monitor.Exit method would\
    \ not have the same identity as the value passed to the Monitor.Enter method;\
    \ similarly, the value passed to the Monitor.Enter on another thread does not\
    \ have the same identity as the value passed to it. If we pass around values (by\
    \ value!) references are expected, there is no way to obtain the correct locking\
    \ semantics.\n\nAnother example of why value type semantics are not a good fit\
    \ for object references arises when returning a value type from a method. Consider\
    \ the following code:\n\n```\nobject GetInt()\n{\n    int i = 42;\n    return\
    \ i;\n}\nobject obj = GetInt();\n```\n\nThe GetInt method returns a value type\
    \ - which would typically be returned by. However, the caller expects, from the\
    \ method, to return an object reference. The method could return a direct pointer\
    \ to the stack location where i is stored during the method's execution. Unfortunately,\
    \ it would be a reference to an invalid memory location, because the stack frame\
    \ is cleaned up before it returns. This demonstrates that the copy-by-value semantics\
    \ of value types by default are not a good fit for when an object reference (into\
    \ the managed heap) is expected."
