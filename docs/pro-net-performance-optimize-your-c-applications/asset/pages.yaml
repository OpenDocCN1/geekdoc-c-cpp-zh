    # # Memory Pooling


    If you are using buffers to communicate with native code, you can either allocate
    them from GC heap or from an unmanaged heap. The former approach becomes inefficient
    for high allocation rates and if the buffers aren''t very small. Managed buffers
    will need to be pinned, which causes fragmentation. The latter approach is also
    problematic, because most code expects buffers to be byte arrays (byte[]) rather
    than pointers. You cannot convert a pointer to a managed array without copying,
    which is bad for performance.


    > You can look up the % Time in .NET CLR Memory performance counter to estimate
    the CPU time "wasted" by the GC, but this doesn''t tell you what is responsible.
    Use a profiler (see Chapter 2) before investing optimization effort, and see Chapter
    4 for tips on managing garbage collection performance.


    We propose a solution (see Figure 8-2) which provides a copy-free access from
    both managed and unmanaged code and not stress the GC. The idea is to allocate
    large managed buffers (segments) which reside on the Large Object Heap. There
    is no penalty for pinning these segments because they''re non-relocatable.


    | Pool Allocator | 256KB[] of segment | 8KB | 10KB | 2KB | 236KB | |

    |---|---|---|---|---|---||

    | | Stack of Segments | | | | | |

    | Segment in 0, active Ref<Ptr>(0x20480) PinPtr=0x00000 | in use | | | in use
    | free |

    | Segment 1, in use, Ref<Ptr>(0x26210) PinPtr=0x00000 | | | | | |

    | Segment 2, free Ref<Ptr>(null) PinPtr=0x003000 | Offset=0 Len=8KB | | Offset=18KB
    Len=2KB | | wrappers[] |

    | Segment 3, free Ref<Ptr>(null) PinPtr=0x004000 | | Offset=8KB Len=10KB Disposed
    | |


    **Figure 8-2.** Proposed memory pooling scheme


    A simple allocator, where the allocation (an index actually) of a segment moves
    only forward with each allocation will then allocate buffers of varying sizes
    (up to the segment) and return a wrapper object around those. Once the pointer
    approaches the end and an allocation fails, a new segment is obtained from the
    segment pool and allocation is attempted.


    Segments have a reference count that incremented for every allocation and decremented
    when the wrapper object is disposed. If its reference count reaches zero it can
    be reset, by setting the pointer to zero and optionally zero filling, and returned
    to the segment pool.


    The wrapper object stores the segment''s size [], the offset where its data begins,
    and an unmanaged pointer. In effect, the wrapper is a window into the segment''s
    large buffer. It will also reference the segment in order to decrement the segment-in-count
    once when the wrapper is disposed. The wrapper could provide convenience methods
    such a safe index access which accounts for the offset and verifies that each
    is within bounds.


