  md: '# CONFIGURING PERFORMANCE COUNTER LOGS


    To configure performance counter logs, open Performance Monitor and perform the
    following steps. (We assume that you are using Performance Monitor on Windows
    7 or Windows Server 2008 R2; in prior operating system versions, Performance Monitor
    had a slightly different user interface—if you are using these versions, consult
    the documentation for detailed instructions.)


    +   1. In the tree on the left, expand the Data Collectors Nodes.

    2. Right-click the User Defined node and select New ► Data Collector from the
    context menu.

    3. Name your data collector set, select the "Create manually (Advanced)" radio
    button, and click Next.

    4. Make sure the "Create logs" radio button is selected, check the "Performance
    counter" checkbox, and click Next.

    5. Use the Add button to add performance counters (the Add Counters dialog will
    open). When you''re done, configure a sample interval (the default is to sample
    the counters every 15 seconds) and click Next.

    6. Provide a directory which Performance Monitor will use to store your counter
    logs and then click Next.

    7. Select the "Open properties for this data collector set" radio button and click
    Finish.

    8. Use the various tabs to configure your data collector set—you can define a
    schedule to run automatically, a stop condition (e.g. after collecting than a
    certain amount of data), and a task to run when the data collection stops (e.g.
    to upload the results to a centralized location). When you''re done, click OK.

    9. Click the User Defined node, right-click your data collector set in the main
    pane, and select Start from the context menu.

    10. Your counter log is now running and collecting data to the directory you''ve
    selected. You can stop the counter set at any time by right-clicking it and selecting
    Stop from the context menu.


    When you''re done collecting data and want to inspect it using the Performance
    Monitor, perform the following steps:


    +   1. Select the User Defined node.

    2. Right-click your data collector set and select Latest Report from the context
    menu.

    3. In the resulting window, you can add or delete counters from the list of counters
    in the log, configure a time range and change the data scale by right-clicking
    the graph and select Properties from the context menu.


    Finally, to analyze log data on another machine, you should copy the log directory
    to that machine, open the Performance Monitor node, and click the second toolbar
    button from the left (or Ctrl + L). In the resulting dialog you can select the
    "Log files" checkbox and add log files using the Add button.'
