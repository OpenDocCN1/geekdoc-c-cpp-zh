  md: "# Disable View State\n\nView state is the technique used in ASP.NET HTML output\
    \ (ASP.NET MVC applications do not use this mechanism). View state is used to\
    \ allow ASP.NET to keep the state of a page between postbacks by the user. The\
    \ view state data is stored in the HTML output by serializing the state, encrypting\
    \ it (not by default), encoding it to a Base64 string, and storing it in a hidden\
    \ field. When the user posts back, the content is decoded, and deserialized back\
    \ to the view state dictionary. Many servers use the view state to persist their\
    \ own state, for example storing their properties in the view state.\n\nAlthough\
    \ very useful and powerful, this mechanism generates a payload that, when placed\
    \ in the page as a Base64 string, can increase the size of the page by magnitude.\
    \ For example, a page containing a single GridView with paging, bounded to 800\
    \ customers, will generate an HTML 17 KB in size, out of which 6 KB is the view\
    \ state—this is because GridView controls view state requires serialization and\
    \ deserializing the view state on each request, which adds additional overhead\
    \ to the processing of the page.\n\n+   The payload created by view state is usually\
    \ not noticeable by clients that access a web server in their own local network.\
    \ This is because LANs are very fast and able to transfer very large pages in\
    \ matter of milliseconds (an optical 1Gb LAN can reach a throughput of ~40–100\
    \ MB/s, depending on hardware). However, the payload of the view state is most\
    \ noticeable when using slow wide area networks, like the Internet.\n\nIf you\
    \ do not require the use of the view state, it is advisable to disable it the\
    \ entire application by disabling it in the web.config file:\n\n```\n<system.web>\n\
    \  <pages enableViewState=\"false\"/>\n</system.web>\n```\n\nIf you do not want\
    \ to disable view state for the entire application, it can also be disabled for\
    \ a single page and all of its controls:\n\n```\n<@ Page EnableViewState=\"false\"\
    \ ... %%>\n```\n\nYou can also disable view state per control:\n\n```\n<asp:GridView\
    \ ID=\"gdvCustomers\" runat=\"server\" DataSourceID=\"myDataDataSource\"\n  AllowPaging=\"\
    True\" EnableViewState=\"false\"/>\n```\n\nPrior to ASP.NET 4, disabling the view\
    \ state in the page made it impossible to re-enable it for specific controls in\
    \ the page. As of ASP.NET 4, a new approach was added to allow disabling view\
    \ state on a page, but"
  merge: -1
  pgno: 314
- img_proc: true
  md: "# CHAPTER 11 ■ WEB APPLICATION PERFORMANCE\n\nre-enabling it for specific controls.\
    \ This is achieved in ASP.NET4 by using the ViewState property. For example, the\
    \ following code disables the view state for the entire page, excluding the GridView\
    \ control:\n\n```\n<@ Page EnableViewState=\"ViewStateMode=\"Disabled\" ... %>\n\
    <asp:GridView Id=\"gdvCustomers\" runat=\"server\" DataSourceID=\"mySqlDataSource\
    \ AllowPaging=\"True\" ViewState=\"Enabled\"/>\n```\n\n> Caution Disabling the\
    \ view state by setting the EnableViewState to false will override any setting\
    \ done to the ViewStateMode. Therefore make sure EnableViewState is true or omitted\
    \ (the default value is true).\n\n# Server-Side Output Cache\n\nAlthough ASP.NET\
    \ pages are considered dynamic content, you often end up in scenarios where the\
    \ dynamic content of a page does not necessarily change over time. For example,\
    \ a page can receive the ID of a product and return an HTML content describing\
    \ the product. The page is dynamic, because it can return different HTML content\
    \ for different products, but the product page for a specific product does not\
    \ change that, at least until the product details themselves change in the database.\n\
    \nContinuing our product example, to prevent us from querying the database every\
    \ time a product is requested, we want to cache product in a local cache so we\
    \ can access it faster, but we will still need to render the HTML page every time.\
    \ By caching the data we need, ASP.NET offers a different caching mechanism, output\
    \ caching pages, as well as in ASP.NET MVC for caching controllers.\n\nBy output\
    \ cache, ASP.NET can cache the rendered HTML so subsequent requests will automatically\
    \ return the rendered HTML without executing our code. Output cache is supported\
    \ in ASP.NET Web Forms, and the output cache uses output cache to cache the view\
    \ returned by an ASP.NET MVC controller for 30 seconds.\n\nFor example, the following\
    \ code uses output cache :\n\n```\npublic class ProductController : Controller\
    \ {\n[OutputCache(Duration=30)]\npublic ActionResult Index() {\n    return View();\n\
    }\n}\n```\n\nIf the index in the above example received an ID parameter and returned\
    \ a view displaying specific product information, we would need to cache several\
    \ versions of the output, according to the different IDs of the action receives.\
    \ Output cache, therefore, supports not just a single caching of the output, but\
    \ also supports caching outputs of the same action according to the parameters\
    \ passed to that action. The following code shows how to alter the action to cache\
    \ outputs according to an ID parameter passed to the method:\n\n```\npublic class\
    \ ProductController : Controller {\n[OutputCache(Duration=30, VaryByParam=\"id\"\
    )\npublic ActionResult Index(int id) {\n    //Retrieve the matching product and\
    \ set the model accordingly\n...\n    return View();\n}\n}\n```\n\n316"
  merge: -1
  pgno: 315
- img_proc: true
  md: "Note In addition to varying query string parameters, output cache can also\
    \ vary the cache output by the request's HTTP headers, such as the Accept-Encoding\
    \ and Accept-Language header. For example, if your action returns content in different\
    \ languages according to the Accept-Language HTTP header, you can set the output\
    \ cache to vary by that header, creating a different cached version of the output\
    \ for each requested language.\n\nIf you have the same caching settings for different\
    \ pages or actions, you can create a caching profile, and use that instead of\
    \ repeating the caching settings over and again. Caching profiles are created\
    \ in the web config, using the system.web>caching section. For example, the following\
    \ configuration defines a caching profile which you can use in several:\n\n```\n\
    <system.web>\n<caching>\n  <outputCacheProfiles>\n    <add name=\"CacheFor30Seconds\"\
    \ duration=\"30\" varyByParam=\"id\"/>\n  </outputCacheProfiles>\n</outputCacheSettings>\n\
    </caching>\n</system.web>\n```\n\nNow the profile can be used for your Index action,\
    \ instead of repeating the duration and parameter:\n\n```\npublic class ProductController\
    \ {\n  [OutputCache(\"CacheFor30Seconds\")\n  public ActionResult ActionResult(int\
    \ id) {\n    //Retrieve the matching product and set the\n\n    return View();\n\
    \  }\n}\n```\n\nWe can also use the same caching profile in an ASP.NET web form,\
    \ by using the OutputCache directive:\n@OutputCache CacheProfile=\"CacheEntityFor30Seconds\"\
    \ %>\n\nNote By default, the ASP.NET output cache mechanism keeps the cached content\
    \ in the server's memory. As of ASP.NET 4, you can create your own output cache\
    \ provider to be used instead of the default one. For example, you can write your\
    \ own custom provider which stores the output cache to disk.\n\n# Pre-Compiling\
    \ ASP.NET Applications\n\nWhen compiling an ASP.NET web project, a single assembly\
    \ is created to hold all application's code. Web pages (.aspx) and user controls\
    \ (.ascx) are not compiled, and deployed as-is to the server. The first time the\
    \ application starts (upon first request), ASP.NET dynamically compiles the web\
    \ controls, and places the compiled files in the ASP.NET Temporary folders. This\
    \ dynamic compilation increases the response time of first requests, causing users\
    \ to experience a slow-loading web site.\n\nTo resolve this issue, applications\
    \ can be pre-compiled, all code, pages, and user controls, by using the ASP.NET\
    \ compilation tool (Aspnet-compiler.exe). Running the ASP.NET compilation"
  merge: -1
