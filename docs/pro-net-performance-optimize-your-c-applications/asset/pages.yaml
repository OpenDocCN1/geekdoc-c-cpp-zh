  md: '# CHAPTER 5 COLLECTIONS AND GENERICS


    Note Some developers are wary of using any collection but built-in arrays. Arrays
    are highly flexible, non-resizable, and make it difficult to implement some operations
    efficiently, but they are known for having the minimal overhead of any other collection
    implementation. You should not be afraid of using built-in collections as long
    as you are equipped with good measurement tools, as those considered in Chapter
    2. The internal implementation details of the NET collections, discussed in this
    section, will also facilitate generics. One example of: iterating a List<T> in
    a foreach loop takes significantly longer than in a for loop, because foreachenumeration
    must verify that the underlying collection hasn''t been changed throughout the
    loop.


    First, recall the collection classes classified with .NET 4.5 — excluding the
    concurrent collections, which we discuss separately — and their runtime performance
    characteristics. Comparing the insertion, deletion, and lookup performance of
    collections is a reasonable way to arrive the best candidate for your needs. The
    following table lists only the generic collections (the non-generic counterparts
    were replaced in .NET 2.0):


    Table 5-1. Collections in the .NET Framework


    | Collection | Details | Insertion Time | Deletion Time | Lookup Time | Sorted
    | Index Access |

    |---|---|---|---|---|---|---||

    | List<T> | Automatically resizable array | O(1)* | O(n) | O(n) | No | Yes |

