    # Method Inlining


    This optimization often reduces code size and almost decreases execution time
    by replacing method calls with the caller''s body. As we have seen in Chapter
    3, virtual methods are not inlined by the JIT compiler (unless is sealed on a
    derived type); interface methods undergo partial inlining with speculative execution;
    only static and non-virtual methods can be inlined. For performance critical code,
    such as simple properties and methods on widely commonly accessed infrastructure
    classes, make sure to avoid virtual methods and interface implementations.


    The exact criteria used by the JIT compiler to determine which methods to inline
    are not publicly available. Some heuristics can be discovered by experimentation:


    +   - Methods with call graphs (e.g. loops) are not inlined.

    - Methods with exception handling are not inlined.

    - Recursive methods are not inlined.

    - Methods that have non-primitive value parameters, local variables, or return
    values are not inlined.

    - Methods with bodies larger than32 bytes of IL are not inlined. (The MethodImplOptions.AggressiveInlining
    value of the [MethodImpl] attribute overrides inlining.)


    In recent versions of the CLR, some limitations on inlining were removed. For
    example, as of .NET 3.5 SP1, the 32-bit JIT compiler is able to inline methods
    that accept some non-primitive value parameters, like Chapter 3''s Point2D. The
    changes made in that release replace operations on value types by equivalent


