    # Reflection


    Reflection has a bad reputation for being a performance hog in complex applications.
    Some of this is justified: there are extremely expensive operations that you can
    perform using Reflection, as invoking a method by its name using Type.InvokeMember
    or creating an object using a late-bound parameter list using Activator.CreateInstance.
    The main costs when using methods or setting field values through reflection stem
    from the work that it has to do in the background—instead of strongly-typed code
    that can be compiled by the JIT to make instructions, code that uses Reflection
    is effectively interpreted at runtime through a series of costly methods.


    For example, invoking a method using Type.Invoke requires determining which method
    to invoke using metadata and overload resolution, making sure the specified arguments
    match the method''s parameters, performing copies if necessary, verifying any
    security concerns, and finally executing the method call. Because Reflection is
    heavily based on object parameters and return values, boxing and un may add any
    extra cost.


    > Note For performance tuning .NET APIs from an internal perspective, consider
    Joel''s MSN Magazine article, "Dodge Common Performance Pitfalls to Craft Speedy
    Applications", available online at http://msdn.microsoft.com/en-us/magazine/cc163759.aspx.


    Reflection can be eliminated from performance-critical scenarios by using some
    form of code generation—instead of reflecting over types and invoking methods/properties
    dynamically, you can generate code (for each type) that will do so in a strongly-typed
    fashion.


    # Code Generation


    Code generation is often used by serialization frameworks, Object/Relational Mappers
    (ORMs), dynamic proxies, and other performance-sensitive code that needs to work
    with dynamic, unknown types. There are several ways to dynamically generate code
    in the .NET Framework, and there are many-party code generation frameworks, such
    as LLGen and T4 templates.


    +   Lightweight Code Generation (LCG), a.k.a.-DynamicMethod can be used to generate
    a method without creating a type and assembly. For small chunks of code, this
    is the most efficient code generation mechanism. Emitting code in an LCG requires
    the ILGenerator class, which works directly with IL instructions.


    +   The System.Reflection.Emit namespace contains APIs that can be used to generate
    assemblies, types, and methods—on the IL level.


