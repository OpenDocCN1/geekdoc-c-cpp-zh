    # Miscellaneous Tips for Startup Performance


    There are several additional tips we didn''t mention earlier that might be able
    to save a few seconds off your application''s startup time.


    # Strong Named Assemblies Belong to the GAC


    If your assemblies have strong names, make sure to place them in the global assembly
    cache (GAC). Otherwise, loading the assembly requires touching almost every page
    to verify its digital signature. Verification of strong names when the assembly
    is not placed in the GAC will also diminish any performance gains from NGen.


    # Make Sure Your Native Images Do Not Require Rebasing


    When using NGen, make sure that your native images do not have base collisions,
    which require rebasing. Rebasing is an expensive operation that involves modifying
    code addresses at runtime, and creates copies of otherwise shared code pages.
    To view the native image''s base address, use the dumpbin.exe utility with the
    /headers flag, as follows:'
