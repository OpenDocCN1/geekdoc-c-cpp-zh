    \ to integers. Then, T(n) is O(f(n)), if there exists a constant c that for all\
    \ n, T(n) ≤ cf(n).\n\nIn a nutshell, we can say that an algorithm's runtime complexity\
    \ is O(f(n)), if f(n) is an upper bound on the actual number of steps it takes\
    \ to execute the algorithm on an input size of n. The bound does not have to be\
    \ tight: for example, we can also say List<T> lookup runtime complexity O(n).\
    \ However, using a loose upper bound is not helpful, because it fails to capture\
    \ the fact that it is realistic to search a List<T> for an element if it has 1,000,000\
    \ elements in it. If List<T> had runtime complexity O(n), it would be highly inefficient\
    \ to perform over lists with several thousands of elements.\n\nAdditionally, the\
    \ bound might be tight for some inputs but not others; for example, if we search\
