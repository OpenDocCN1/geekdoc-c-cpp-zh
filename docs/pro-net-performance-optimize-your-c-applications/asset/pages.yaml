    # Server GC


    The server GC flavor is optimized for a completely different type of applications—server
    applications, as its name implies. Server applications in this context require
    high-throughput scenarios (often at the expense of latency for an individual operation).
    Server applications also require easy scaling to multiple processors - memory
    management must be able to scale to multiple processors just well:

    an application that the server GC has the following characteristics:


    +   - There is a separate heap for each processor in the affinity mask of the
    .NET process. Allocation requests by a thread on specific processor are satisfied
    from the managed heap that belongs to that specific processor. The purpose of
    this separation is to minimize contention on the managed heap while allocations
    are made: most of the time, there is no contention on the next object pointer
    and multiple threads perform allocations truly in parallel. The architecture requires
    dynamic adjustment of the heap sizes and GC thresholds to ensure fairness if the
    application scales across threads and assigns them hard CPU affinity. In the typical
    case of server applications, which service requests off a pool worker thread,
    it is likely that all heaps have approximately the same size.

    - The garbage collection does not occur on the thread that triggered garbage collection.
    Instead, garbage collection occurs on a dedicated priority threads that are created
    during startup and are marked THREAD_PRIORITY_HIGHEST. There is a GC thread for
    each processor that is in the affinity mask of the .NET process. This allows each
    to access the managed heap assigned to its processor. Thanks to locality of reference,
    it is likely that GC thread should perform the mark phase exclusively within its
    own heap, parts of which are guaranteed to be in CPU''s cache.

    - During both phases of garbage collection, all allocation threads are suspended.
    This allows GC to collect in a timely fashion and allows applications to continue
    processing requests as soon as possible. This maximizes throughput at the expense
    of latency; some requests may take longer to process while a garbage collection
    is in progress, but the overall allocation can process more requests because less
    switching is introduced when GC is in process.


    When using server GC, the CLR attempts to balance object allocations across the
    processor heaps. Up to CLR 4.0, only the small heap was balanced; with CLR 4.5,
    the large heap (discussed later) is balanced as well. As a result, the allocation
    rate, fill rate, and garbage collection frequency are kept similar for all heaps.

    The limitation of using the server GC is the number of physical processors on
    the machine. If there is just one physical processor on the machine, the only
    available GC is workstation GC. This is a reasonable choice, because if there
    is just a single processor available, there will be a single managed heap and
    a single GC thread, which hinders the effectiveness of the server GC architecture.


