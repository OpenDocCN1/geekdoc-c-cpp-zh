    **Note** On 32-bit systems, objects in the heap are aligned to the nearest byte
    multiple. This implies that an object with only a single byte member would still
    occupy 12 bytes in the heap, due to alignment (in fact, even a class with no fields
    will occupy 12 bytes when instantiated). There are several differences when 64-bit
    systems are introduced. First, the method table pointer field (the pointer to
    it) occupies 8 bytes of memory, and the object header takes 8 bytes by we. Second,
    objects in the heap are aligned to the nearest byte multiple. This implies that
    an object with only a single byte member in a 64-bit heap would occupy 24 bytes
    of memory. This only serves to demonstrate more strongly the memory overhead of
    reference types, in particular where small objects are built in.


    # The Method Table


    The Method Table points to an internal CLR data structure called a method table
    (MT), which points in turn to an internal structure called EEClass (EE stands
    for Execution Engine). Together, the MT and EEClass contain the information required
    to dispatch virtual methods, interface calls, access static variables, determine
    the type of a runtime object, access the base type methods, and serve many additional
    purposes. The method table contains frequently accessed information, which is
    required for the operation of reflection mechanisms such as virtual dispatch,
    whereas the EEClass contains information that is less frequently accessed, but
    still used by runtime mechanisms, as Reflection. We can learn about the contents
    of both data structures using 1DumpMT and 1DumpClass commands and the Router (SNCLI)
    source code, bearing in mind that we are discussing internal implementation details
    that might differ significantly between CLR versions.


    > Son of Strike is a debugger DLL, which facilitates debugging managed applications
    using Windows debuggers. It is most commonly used with WinDbg, but can be loaded
    into Visual Studio using the Immediate Window. Its commands provide insight into
    CLR internals, which is why we are using it often in this chapter. For more information
    about SOS, consult the inline help (the help command after loading the extension)
    and the MSDN documentation. An excellent treatment of SOS features in conjunction
    with debugging applications is in Mario Hewitt''s book, "Advanced .NET Debugging"
    (Addison-Wesley, 2009).


    The location of static fields is determined by the EEClass. Primitive fields (such
    as integers) are stored in dynamically allocated locations on the heap, while
    value types and reference types are stored as indirect to a heap location (through
    an AppDomain-wide object). To access a static field, it not necessary to consult
    the method table or EEClass – the JIT compiler can hard-code the addresses of
    the static fields into the generated machine code. The array of references to
    static fields is pinned so that its address''t change during a garbage collection
    (discussed in more detail in Chapter 4), and the primitive fields reside in the
    method table which is not touched by the garbage collector. This ensures that
    hard-coded addresses can be used to access these fields:


    ```

    public static void SetCompanyPolicy(CompanyPolicy policy)

    _policy = policy;

    mov ecx, dword ptr [ebp+8]    ; parameter to ECX

    mov dword ptr [0x5543320], ecx    ;copy ECX to the static field location in the
    global pinned array

    ```


