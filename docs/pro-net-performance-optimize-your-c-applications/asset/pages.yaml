  md: 'One to the location problem is to spread multiple instances of the web server
    in different locations,

    geographically dispersed, so end-users will be geographically close to one of
    the servers. Of course this

    creates a major issue when you will need to replace and synchronize servers all
    the time, and

    possibly instruct each end-user to use a different URL where they are in.


    That is where Content Delivery Networks (CDNs) come in. A CDN is a collection
    of web servers, placed in

    different locations around the globe, allowing end-users to be always close to
    your web application''s content.

    Using CDNs, you actually use the same address of the CDN all over the world, but
    the local DNS in

    your area translates to the actual CDN server which is closest to your location.
    Various Internet\companies, such as Microsoft, Amazon, and Akamai have their own
    CDNs which you can use for a certain fee.

    The following scenario describes the use of a CDN:


    +   1. You set up your CDN and point it to the original content is.


    +   2. The first time an end-user accesses the content through the CDN, the local
    CDN

    server connects to your web server, pulls the content from, caches it in the CDN

    server, and returns the content to the end-user.


    +   3. For subsequent requests, the CDN server retrieves the cached content without

    contacting your web server, and allowing for quicker response times, and possibly

    faster bandwidth.


    > In addition to serving your end-users faster, use of a CDN also reduces the
    number of requests for

    static content your web server needs to handle, allowing it to dedicate most of
    its resources for handling dynamic content.


    To achieve the first step, you will need to choose the CDN you wish to use, and
    configure your

    CDN as instructed by your provider. Once you have the address of the CDN, simply
    change the links for static

    content (images, styles, scripts) to point to the CDN. For example, if you upload
    your static content to

    Windows Azure blob storage and register your content with Azure CDN, you can change
    the URLs in

    yours to point to the CDN like:


    ```

    <link href="http://az182js3.vo.msecnd.net/static/Content/Site.css" rel="stylesheet"
    type="text/css" />

    ```


    For debugging purposes you can replace the static URL with a variable that will
    allow you to control whether

    use a local address or the CDN''s address. For example, the Razor code constructs
    the URL by

    prefixing it with the CDN address provided by the CdnUrl configuration setting
    from the web.config file:


    ```

    @using System.Web.Configuration

    <script src="WebConfigurationManager.AppSettings["CdnUrl"]/Scripts/jquery-1.6.2.js"

    type="text/javascript"></script>

    ```


    When debugging your web application, change the CdnUrl to an empty string to get
    content from your

    local web server.


    # Scaling ASP.NET Applications


    So you''ve improved the performance of your web application by incorporating everything
    you learned here,

    even applied some other techniques to boost things up, and now your application
    is working great, and

    as optimized as you can be. By putting your application to production, everything
    works for the first couple of

    weeks, but then additional users start using the web site, and more new users
    are joining every day, increasing'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# CHAPTER 11 WEB APPLICATION PERFORMANCE


    the number of requests your server has to handle, and suddenly, your server starts
    to choke. It may begin with requests taking longer than usual, your worker process
    starts to use more memory and more CPU, and eventually requests give to timeouts,
    and HTTP 500 ("Internal Server Error") are logging your files.


    What has gone wrong? Should you try to improve the performance of your application?
    More users will join and you''ll be in the same situation. Should you increase
    the machine''s memory, or add more CPUs? There''s also the amount of scale-up
    you can do on a single machine. It''s time to face the facts—you need to scale
    out more servers.


    Scaling out web applications is a natural process that has to occur at some point
    in the life cycle of web applications. One server can handle dozens or thousands
    of concurrent users, but it cannot handle that kind of stress for that long. Session
    filling up the server''s memory, threads getting starved because there are no
    more threads available, and context-switching that too often will increase the
    latency and throughput of your single server.


    # Scaling Out


    From an architectural point of view, scaling is not just-but add one or two (servers),
    place your servers behind a load balancer, and from then on, all should be OK.
    The problem is that it''s not that easy.


    One of the major issues developers face when having to scale is how to handle
    affinity. For example, when you use a web server, the state of your users is kept
    in-memory. If you add another server, how will you make those sessions available
    to it? How will you synchronize the sessions between servers? Some developers
    tend to solve this by keeping the state in the server and having an affinity between
    the client and server. A client connects to one of the servers through the load
    balancer, the load balancer will then, sending all client requests to that web
    server, this is also referred to as a "sticky" session. Using sticky sessions
    is a workaround, not a solution, since it does not allow you to truly balance
    the work between the servers. It is easy to get to a situation where one of the
    servers is handling too many users, whereas other servers are not handling requests
    at all, because all of their clients are disconnected.


    So the real solution for good scalability is not to rely on your server''s memory,
    however regarding the state you keep for your users, or the cache you store in-memory
    to boost performance. Why does storing cache on a machine become problematic when
    scaling? Just think what will happen when a user sends a request that causes the
    cache to be updated: the server that got it updates its in-memory cache, but other
    servers are turned off by default. Then no change, and if they also have a copy
    of cached object, it will become stale and cause application-wide inconsistencies.
    One of the ways you might choose to solve this issue is by synchronizing cached
    objects between servers. Although, this solution adds another layer of complexity
    to the architecture of your web application, not to mention the amount of chatter
    that your servers are going to have between them.


    # ASP.NET Scaling Mechanisms


    Scaling out to multiple servers requires an out-of-process state management. ASP.NET
    has two built-in out-of-process mechanisms for state management:


    +    Service. The state service is a Windows service that provides state management
    for multiple machines. This service is installed automatically when installing
    the .NET framework, but it is turned off by default. You can simply choose which
    machine will run the state service, and configure all other machines to use the
    same session store. Although state service enables multiple machines to use the
    same session store, it does not provide persistency so if something happens to
    the machine hosting the server, the entire session state of your web farm will
    be lost.


    331'
  merge: -1
  pgno: 330
- img_proc: true
  md: '+   SQL Server. ASP.NET supports storing the state in SQL Server. Storing state
    in SQL Server gives the same sharing abilities as that of the state service, but
    it also enables the persistence of the state, even if your web servers fails,
    and if the SQL Server fails, the state information can be restored.


    For caching, in most cases is to use a distributed cache mechanism, as Microsoft''s
    AppFabric Cache, NCache, or Memcached is an open-source distributed cache. With
    distributed cache, you can take several servers and combine their memory into
    one distributed memory, which is used as a cache for your data. Distributed caches
    offer abstraction of location so you don''t need to know where each piece of data
    is located, notification services so you can know when something has changed,
    and high-availability to make sure that even one of the cache servers fails, the
    data is not lost.


    Some distributed caches, such as AppFabric Cache and Memcached also have Custom
    State and Cache providers for ASPNET.


    # Scaling Out Pitfalls


    Although not relevant to performance, it is a good place to mention some other
    issues you should be aware of when you scale out your web application. Parts in
    web applications require the use of a special keys to generate unique identifiers
    preventing tampering and spoofing the web application. For example, a unique key
    is used when creating Forms Authentication, and when encrypting view state. By
    default, the security keys for a web application are generated each time the application
    pool starts. For a single server this might not be a problem but when you scale
    out your server into multiple servers this will pose a problem, since each server
    will have its own unique key. Consider the following scenario: a client sends
    a request to server A and gets a cookie signed with server A''s unique key, the
    client sends a new request to server B with the cookie received. Since server
    B has a different key, the validation of the cookie''s content will fail and an
    error will be returned.


    You can control how keys are generated in ASP.NET by configuring the machineKey
    in your web.config. When scaling out web applications to multiple servers, you
    need to configure the machine key to use the not pre-generated key in all the
    servers by hard-coding it into the application configuration.


    Another issue relating to scaling out and the use of unique keys is the ability
    to encrypt sections in web.config files. Sensitive information located in the
    web.config file is encrypted when deployed to production servers. For example,
    the connectionString section is encrypted to protect the username and password
    to the database from being exposed. Instead of encrypting the web.config file
    separately in each server after deployment, making the deployment tedious, you
    can generate one encrypted web.config file and deploy it to all the servers. To
    be able to do that, all you need is to create an RSA key container and import
    it in all the web servers.


    Note to learn about generating machine keys and applying them to the application
    configuration, the Microsoft Knowledge Base article KB312906 (http://support.microsoft.com/?id-312906).
    For more information on generating the RSA key container, read the "Importing
    and Exporting Configuration RSA Key Containers" MSDN article (http://msdn.microsoft.com/library/xw286t2).


    # Scaling


    In the beginning of this chapter, we argued that the overall performance of a
    web application is controlled not only by your code, but also by parts of the
    pipeline. We started this by examining some test'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'and analyzing tools that can assist you in locating the bottlenecks in your
    web applications. By using monitoring and analysis tools, you can easily track
    down problems, and significantly improve the performance of your web application.
    From there, we went over the pipeline, identifying different parts of it that
    can be modified to make your application either work faster, smarter, or provide
    smaller payloads so they can be served more quickly. After going over this chapter,
    you are now aware of how small changes, as working properly with client-side caching,
    can help reduce the number of requests your server has to deal with, resolving
    some bottleneck issues many applications are facing.


    Later on the chapter, we realized that a single server will not be able to handle
    all of your client''s requests, so planning ahead for scaling and applying scalable
    solutions beforehand, such as distributed cache and out-of-process state management,
    will enable you to scale easier once you''ve reached the point where one server
    is just not enough. Finally, in this chapter we only explored different techniques
    of improving the server-side of your web application, leaving another side for
    you to explore—the client side.


    This is the last chapter of this book. Throughout its eleven chapters, you have
    seen how to measure and improve application performance, how to parallelize .NET
    code and run your algorithms on the GPU, how to navigate the complexities of the
    .NET type system and garbage collector, how to choose collections wisely and when
    to implement your own, and even how to use the latest-and-greatest processor features
    to squeeze additional performance for your CPU-bound software. Thank you for following
    us on this journey, and best of luck improving the performance of your applications!'
