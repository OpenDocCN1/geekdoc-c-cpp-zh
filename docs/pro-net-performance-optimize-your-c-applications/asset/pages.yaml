  md: '# Registered I/O


    Registered I/O (RIO) is a new extension of WinSock available in Windows Server
    2012 that provides a very efficient buffer registration and notification mechanism.
    RIO eliminates the most significant inefficiencies in Windows I/O:


    +   - User buffering (checking for page access permissions), locking and unlocking
    (ensuring the buffers are registered in RAM).

    - Handle lookups (translating a Win32 HANDLE to a kernel object pointer).

    - System calls make (e.g. to dequeue I/O completion notifications).


    These are "taxes" paid to isolate the application from the operating system and
    from other applications, to the end of ensuring security and reliability. Without
    RIO, you pay the cost of "taxes" only once, until initialization. With high I/O
    rates significant, RIO requires registration of buffers, which locks them in physical
    memory until they are de-registered (when the application or subsystem terminates).
    Since buffers remain allocated and in memory, Windows can skip polling, locking,
    and unlocking per call.

    RIO request and completion queens reside in the ''process'' memory space and are
    accessible to it, meaning a system call is no longer required to poll the queue
    or dequeue completion notifications.

    RIO supports three notification mechanisms:


    +   - Polling: This has the lowest latency but means a logical processor is dedicated
    to polling the network buffers.

    - I/O Completion Ports.

    - Signaling a Windows event.


    At the time of writing, RIO was not exposed by the .NET Framework, but it is accessible
    through the standard .NET interoperability mechanisms (discussed in Chapter 8).


    # Data Serialization and Deserialization


    Serialization is the act of representing an object in a format that can be written
    to disk or sent via a network. De-serialization is the act of reconstructing an
    object from the serialization representation. For example, a hash table can be
    serialized to an array of key-value records.


    # Serializer Benchmarks


    The .NET Framework comes with several generic serializers that can serialize and
    de-serialize user-defined types. This section weighs the advantages and disadvantages
    of each, benchmark serializers in terms serialization throughput and serialized
    message size.

    First, we review the available serializers:


    +   - System.Xml.Serialization.XmlSerializer

    - Serializes to XML, either text or binary.

    - Works on child objects, but does not support circular references.

    - Works only on public fields and properties, except those that are explicitly
    excluded.

    - Uses Reflection only once to code-generate a serialization assembly, for efficient
    operation. You can use the sgen.exe tool to pre-create the serialization assembly.'
