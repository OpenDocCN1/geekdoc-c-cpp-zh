  md: '# CHAPTER 2 PERFORMANCE MEASUREMENT


    Performance Monitor can be used to collect other information that have nothing
    to do with performance counters. You can use it to collect configuration data
    from a system—the values of registry keys, WMI objects properties, and even inserting
    disk files. You can also use it to capture data from ETW providers (which we discuss
    next) for subsequent analysis. By using XML templates, system administrators can
    quickly apply data collectors to a system and generate a useful report with very
    few manual configuration steps.


    Performance counters offer a great amount of interesting information, they cannot
    be used as a high-performance logging and monitoring framework. There are no system
    components that update performance counters more than a few times a second, and
    the Windows Performance Monitor won''t read performance counters more often than
    once a second. If your performance investigation requires thousands of events
    per second, performance counters are not a good fit. We turn our attention to
    Event Tracing for Windows (ETW), which was designed for high-performance data
    collection and richer data types (not just numbers).


    # Event Tracing for Windows (ETW)


    Event Tracing for Windows (ETW) is a high-performance event logging framework
    built into Windows. As was the case with performance counters, many system components
    and application frameworks, including the Windows kernel and the CLR, define providers,
    which report events—information on the component''s inner workings. Unlike performance
    counters, which are always on, ETW providers can be turned on and off at runtime
    when they''re needed for a performance investigation.


    One of the richest sources of ETW information is the kernel provider, which reports
    events on process and thread creation, DLL loading, memory allocation, network
    I/O, and stack accounting (also known as sampling). Table 2-1 shows some of the
    useful information reported by the kernel and CLR providers. You can use to investigate
    system behavior, such as what processes are consuming CPU time, to analyze kernel
    and ETW providers, disk I/O or network I/O bottlenecks, to obtain garbage collection
    statistics and memory usage for managed processes, and other scenarios discussed
    in this section.


    ETW events are labeled with a precise time and can contain custom information,
    as well as an stack trace of where they occurred. These stack traces can be used
    to further identify sources of performance and correctness problems. For example,
    the CLR provider can report events at the start and end of every garbage collection.
    Combined with precise call stacks, these events can be used to determine which
    parts of the program are typically causing garbage collection. (For more information
    about garbage collection and its triggers, see Chapter 4.)


    13'
