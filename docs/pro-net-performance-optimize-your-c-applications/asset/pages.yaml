  md: '# Free List Management


    Free list management is the underlying memory management mechanism in the C run-time
    library, which is also used by default by the C++ memory management APIs such
    as new and delete. This is a deterministic memory manager that relates to developers
    allocating and freeing memory as deem fit. Blocks of memory are stored in a linked
    list, from which allocations are satisfied (see Figure 4-1). Deallocated blocks
    of memory are returned to the free list.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_94_0.png)


    **Figure 4-1.** The free list manager manages a list of unused memory blocks and
    satisfies allocation and deallocation requests. The application is handed out
    blocks of memory that usually contain the block size


    Free list management is not free of strategic and tactical decisions which affect
    the performance of the application using the allocator. Among these decisions:


    +   * An application using a free list management starts with a small pool of
    free blocks of memory organized in a free list. This list can be organized by
    size, by the time of usage, by the arena of allocation determined by the application,
    and so forth.

    * When an allocation request arrives from the application, a matching block is
    located in the free list. The matching block can be located by selecting the first-fit,
    the best-fit, or using more complex alternative strategies.

    * When the free list is exhausted, the memory manager asks the operating system
    for another set of free blocks that are added to the free list. When a deallocation
    request arrives from the application, the free block is added to the free list.
    Optimizations in this phase include joining adjacent blocks together, defragmenting
    and trimming the list, and so on.


    The primary issues associated with a free-list memory manager are the following:


    +   * **Allocation cost:** Finding an appropriate block to satisfy an allocation
    request is time consuming, even if a first-fit approach is used. Additionally,
    blocks are often broken into multiple parts to satisfy allocation requests. In
    the case of multiple processors, contention for synchronization of allocation
    requests is inevitable, unless multiple lists are used. Multiple lists, on the
    other hand, deteriorate the fragmentation of the list.

    * **Deallocation cost:** Returning a free block of memory to the free list is
    time consuming, and again suffers from the need of multi-processor synchronization
    of multiple deallocation requests.

    * **Management cost:** Defragmenting and trimming the free lists is necessary
    to avoid memory exhaustion scenarios, but this work has to take place in a separate
    thread and'
