  md: '# CHAPTER 2 PERFORMANCE MEASUREMENT


    Some profilers offer a remote profiling mode, which allows the main profiler UI
    to run on one machine and the profiling session to take place on another machine
    without copying the performance report manually. For example, JetBrains dotTrace
    profiler supports this mode of operation through a remote agent that runs on the
    machine and communicates with the main profiler UI. This is a good alternative
    to installing the entire profiler on the production machines.


    In Chapter 6 we will leverage the GPU for super-parallel computation, leading
    to considerable (more than 100x!) speedups. Standard profilers are useless unless
    the performance problem is in the code that runs on the GPU. There are some tools
    that can profile and diagnose performance problems in GPU code, including Visual
    Studio 2012. This subject is outside the scope of this chapter, but if you''re
    using the GPU for graphics or plain computation you should research the tools
    applicable to your GPU programming framework (such as C++ API, CUDA, or OpenCL).


    In this section, we have seen in detail how to analyze your application''s execution
    time (overall or CPU only) memory management is another important aspect of managed
    application performance. Through the next two sections, we will discuss allocators
    and memory profilers, which can pinpoint memory-related performance bottlenecks
    in your applications.


    # Allocation Profilers


    Allocation profilers detect memory allocations performed by an application and
    can report which methods allocated most, which types were allocated by method,
    and similar memory-related statistics. Memory-intensive applications can spend
    a significant amount of time in garbage collector, reclaiming memory that was
    previously allocated. As we see in Chapter 4, the CLR makes it easy and expensive
    to allocate memory, recovering it can be quite costly. Therefore the group of
    small methods that allocate memory may not take a considerable amount of CPU time
    to run—and will be almost invisible in a time profiler''s report—but will cause
    a slowdown by inflicting garbage collections and nondeterministic costs in the
    application''s execution. We have seen production applications that were careful
    with memory allocations, and were able to improve their performance—sometimes
    by a factor of 10—by turning their allocations and memory management.


    We will use two tools to profile memory allocations—the ubiquitous Visual Studio
    profiler, which offers an allocation profiling mode, and CLR Profiler, which is
    a free stand-alone tool. Unfortunately, both tools introduce a significant hit
    for memory-intensive applications, because every memory allocation must go through
    the profiler for record-keeping. Nonetheless, the results can be so valuable that
    even a 100x slowdown is worth the wait.


    # Visual Studio Allocation Profiler


    The Visual Studio profiler can collect allocation information and object lifetime
    data (which objects were reclaimed by the garbage collector) in the sampling and
    instrumentation modes. When using this sampling, the profiler collects allocation
    data from the entire process; with instrumentation, the profiler collects only
    data from instrumented modules.


