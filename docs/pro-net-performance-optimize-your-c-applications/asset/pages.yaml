  md: '# Dispatching Non-Virtual Methods


    We can use a similar dispatch sequence to call non-virtual methods as well. However,
    for non-virtual methods, there is no need to use the method table for method dispatch:
    the code address of the invoked method (or at least its-JIT stub) is known when
    the JIT compiles the method dispatch. For example, if the stack location EBP-64
    contains the address of an Employee object, as before, then the instruction sequence
    will call the Takeout method with the parameter 5:


    ```

    mov edx,             ;parameter passing through register - custom calling convention

    mov ecx, dword ptr [ebp-64];still required because ECX contains ''this'' by convention

    call dword ptr [0x00a41260]

    ```


    Unfortunately, the method dispatch sequence suffers from a significant problem.
    It allows methods to be dispatched successfully and possibly remain undetected
    until the instance method attempts to access an instance field or a virtual method,
    which would cause an access violation. In fact, this is the behavior for C++ instance
    methods - the code would execute unharmed in C++ environments, but would certainly
    make C# developers shift uneasily in their chairs:


    ```

    class Employee {

    public: void Work() { } //empty non-virtual method

    };

    Employee* pEmployee = NULL;

    pEmployee->Work();      //runs to completion

    ```


    If you inspect the actual sequence used by the JIT compiler to invoke non-virtual
    instance methods, it would contain an additional instruction:


    ```

    mov edx,             ;parameter passing through register - custom calling convention

    mov ecx, dword ptr [ebp-64];still required because ECX contains ''this''

    cmp ecx, dword ptr [ecx]

    call dword ptr [0x00a41260]

    ```


    Recall that the CMP instruction subtracts its second operand from the first and
    sets CPU flags according to the result of the operation. The code above does not
    use the comparison result in the CPU flags, so how would the CMP instruction help
    prevent calling a method using a null object reference? The CMP instruction to
    access the memory in the ECX register, which contains the object reference is
    null, this memory access would fail with an access violation, because accessing
    the address 0 is always illegal in Windows processes. This access violation is
    converted by the CLR to a NullReferenceException which is thrown at the invocation
    point; a much better choice than emitting a null check inside the method after
    it has already called. Furthermore, the CMP instruction occupies only two bytes
    in memory, and has the advantage of being able to check for invalid addresses
    other than null.'
