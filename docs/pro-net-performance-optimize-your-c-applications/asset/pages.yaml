  md: 'Data access profilers, on the other hand, are well within the domain of application
    developers. These tools instrument the application data access layer (DAL) and
    typically report the following:


    +   - The database queries executed by the application''s DAL, and the precise
    stack trace that initiated each operation.


    +   - The list of application methods that initiated a database operation, and
    the list of queries that each has run.


    +   - Alerts for inefficient database accesses, such as performing queries with
    an unbounded result set, retrieving all columns while using some of them, issuing
    a query with too many joins, or making one query for each entity with N entities
    and then another query for each associated entity (also known as “SELECT N+1 problem”).


    There are several commercial tools that can profile application access patterns.
    Some work with specific database products (as Microsoft SQL Server), while others
    work only with a specific data access framework (as Entity Framework or NHibernate).
    Below are a few examples:


    +   - RedGATS ANTS Performance Profiler can profile application queries to a Microsoft
    SQL Server database.


    +   - Visual Studio “Tier Interactions” feature can profile any synchronous data
    operation from ADO.NET—unfortunately, it does not report call stacks for database
    operations.


    +   - The Hibernating family of profilers (LINQ to SQL Profiler, Entity Framework
    Profiler, and NHibernate Profiler) can profile all operations performed by a specific
    data access framework.


    We will not discuss these profilers in more detail here, but if you are concerned
    about the performance of your data access layer, you should consider running them
    alongside with a time or memory profiler in your performance investigations.


    # Concurrency Profilers


    The rising popularity of parallel programming warrants specialized profilers for
    highly concurrent software that uses multiple threads to run on multiple processors.
    Chapter 6 will examine several scenarios in which easily reap performance gains
    are available from parallelization—and these performance gains are best realized
    with an accurate measurement tool.


    The Visual Studio profiler in its Concurrency and Concurrency Visualizer uses
    ETW to monitor the performance of concurrent applications and report useful views
    that facilitate scalability and performance bottlenecks to highly concurrent software.
    It has two modes of operation below.


    Concurrency (or resource contention profiling) detects resources, such as managed
    locks, on which application threads are waiting. One part of the report focuses
    on the resources themselves, and the threads that were blocked waiting for them—this
    helps find and eliminate scalability bottlenecks (see Figure 2-32).


    Another part of the report displays contention information for a specific thread,
    i.e. the various synchronization mechanisms for which the thread had to wait—this
    helps reduce obstacles in a specific thread''s execution.


    To launch the profiler in this mode of operation, use the Performance Explorer
    pane or Analyze ➤ Launch Performance Wizard item and select the Concurrency mode.'
