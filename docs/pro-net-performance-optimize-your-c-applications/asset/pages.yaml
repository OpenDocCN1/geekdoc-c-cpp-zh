    Fortunately, the Base Class Library (BCL) team at Microsoft has identified this
    deficiency and provided an open source library tool for analyzing CLR ETW traces,
    called PerfMonitor. We discuss this tool.


    # PerfMonitor


    The PerfMonitor.exe command line tool for generator events has been released by
    the BCL team at Microsoft through the CodePlex website. The latest release was
    PerfMonitor 1.5 which can be downloaded from http://bl.codeplex.com/releases/view/49601.
    PerfMonitor’ primary advantage over WPT is that it has intimate knowledge about
    CLR events and provides more than just raw data. PerfMonitor analyzes GC and JIT
    activity time, and can sample stack traces and determine which parts of the application
    are using CPU time.


    For advanced users, PerfMonitor also ships with a library called TraceEvent, which
    enables programmatic access to CLR ETW traces for automatic inspection. You could
    use the TraceEvent library in custom system monitoring software to inspect automatically
    from a production system and decide how to triage.


