    # Content Delivery Networks (CDNs)


    One of the performance issues related to web applications is the latency involved
    in accessing resources over the network. End-users who use the same network as
    the web server usually have good response time, but once your web application
    goes globably gathers users from all the world over the Internet, distant users,
    such as users from other continents, will suffer from longer latencies and slower
    bandwidth due to network problems.'
