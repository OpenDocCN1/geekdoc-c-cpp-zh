    # Fermat Primality Test


    Finding the prime numbers in a range is one we parallelized in Chapter 6, but
    we never got so far as looking for a considerably better algorithm for testing
    a single number for primality. This primacy is important in applied cryptography.
    For example, the RSA asymmetric encryption algorithm used ubiquitously on the
    Internet relies on finding large primes to generate encryption keys.

    A simple result from number theory as Fermat''s little theorem states that, if
    $p$ is prime, then for all numbers $1 \le a \le p$, the number $a^{p-1}$ has remainder
    1 divided by $p$ (denoted $a^{p-1} \equiv 1 \pmod p$). We can use this to devise
    the probabilistic primality test for a candidate $n$:


    +   1. Pick a random number $a$ in the interval $[1, n]$, and see if Fermat''s
    little theorem holds (i.e. if $a^{n-1}$ has remainder 1 divided by $p$).

    2. Reject the number as composite, if the equality does not hold.

    3. Accept the number as prime or repeat step 1 until the desired confidence level
    is reached, if the equality holds.


    For most composites, a small number of iterations by this algorithm detects that
    it is composite and rejects. All prime numbers pass the test for any number of
    repetitions, of.

    Unfortunately, there are infinitely many (Carmichael numbers) that are not prime
    but will pass the test for every value of $a$ and any number of iterations. Although
    Carmichael numbers are quite rare, they are a sufficient cause of concern for
    improving the Fermat primality test with additional tests that can detect Carmichael
    numbers. The Miller-Rabin primality test is one example.

    For composite numbers that are not Carmichael, the probability of selecting a
    number $a$ for which the equality does not hold is more than $1/2$. The probability
    of wrongly identifying a composite number as prime shrinks as the number of iterations
    increases: using a sufficient number of iterations can arbitrarily decrease the
    probability of accepting a composite number.


