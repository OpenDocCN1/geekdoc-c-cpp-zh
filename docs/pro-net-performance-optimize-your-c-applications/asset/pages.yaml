    # Performance Patterns


    This chapter contains a variety of topics we haven''t had the opportunity to discuss
    elsewhere. Although small, they are extremely important for high-performance applications.
    There is no unifying thread to guide you through this chapter but the desire to
    obtain top-notch performance in simple tight loops and complex applications alike.


    We begin the chapter with JIT compiler optimizations, which are vital for good
    performance of CPU-bound applications. Next, we discuss startup performance, which
    can be critical for client applications that exercise the user''s patience. Finally,
    we discuss processor-specific optimizations, including data- and instruction-level
    parallelism, and smaller topics.


    # JIT Compiler Optimizations


    Earlier in this book we have seen the importance of some optimizations performed
    by the JIT compiler. Specifically, in Chapter 3 we have discussed inlining in
    some detail when investigating the method dispatch sequences for virtual and non-virtual
    methods. In this section we summarize the primary optimizations performed by the
    JIT compiler, and how to make sure your code does not thwart the JIT compiler''s
    ability to carry out these optimizations. JIT optimizations mostly affect the
    performance of CPU-bound applications, but are relevant to some extent, to other
    types of programs as well.


    To inspect these you must attach the debugger to a running process—the JIT compiler
    will not perform optimizations when it detects the presence of a debugger. When
    you attach to the process you must make sure the methods you want to insert have
    already been called and compiled.


    If for some reason you want to disable JIT optimizations—for example, to make
    debugging easier in face of inlining and tail calls (detected later)—you don''t
    have to modify the code or use a Debug build. Instead, you can create an .ini
    file that has the same name as your application executable (for example, MyApp.ini)
    and put the following three lines in it. When placed next to your executable on
    the next launch, it will inhibit the JIT compiler from performing any optimizations.


    ```

    .Framework Debugging Control

    GenerateTrackingInfo=1

    AllowOptimize=0

    ```


