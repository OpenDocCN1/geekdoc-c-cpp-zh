    # Using Asynchronous Pages, Modules, and Controllers


    When IIS passes a request to ASP.NET, the request is queued to the thread pool,
    and a worker is assigned to handle the request it is for as a simple HTTP handler,
    a page within an ASP.NET WebForm application, or a controller within an ASP.NET
    MVC application.

    Since the number of threads in the pool is limited (defined by the value set for
    processModelmaxWorkerThreads in the web.config), then implies ASP.NET is also
    limited by the number of requests, it can execute simultaneously.

    The thread limit is usually high enough to support small-to-medium web applications
    that need to handle concurrent requests, you if your application is required to
    handle hundreds of requests constantly, you should keep reading this section.

    The limit on currently executing requests encourages developers to try minimize
    execution time of requests, but what happens when the request depends on some
    other I/O operation, such as calling a web service, or waiting for a database
    operation to complete? In this case the execution of the request highly dependent
    on the remote process, and during that the worker thread attached to the request
    is occupied and cannot be freed for another request.

    Eventually, the number of currently executing requests exceeds the limit of the
    thread pool, new requests will be placed in a waiting queue. When the number of
    queued requests exceeds the limit of the queue, incoming requests will fail, returning
    an HTTP 503 response (“service unavailable”).


    > limit of the thread pool and requests queue is defined for ASP.NET in the processModel
    section of the web.config file, and is controlled partially by the processModelautoConfig
    attribute.


    In modern web applications, where I/O operations are an inevitable part of our
    system''s design (calling web services, querying databases, reading from file
    storages, etc.), this behavior leads to having many running threads and several
    threads actually CPU consuming tasks. This often leads to a low utilization of
    the server''s CPU, which cannot be used by other requests since there are no more
    free threads for the incoming requests.

    in web applications many requests start by fetching data from web services or
    databases, it is common to see low CPU utilization with high load. You can use
    performance counters to check the CPU utilization of your application, by checking
    the Processor% Utilization counter in the ASP.NET ApplicationsRequests/Sec and
    ASP.NET Queued counters.

    If some of your requests are lengthy I/O operations, then there is no need to
    hold the worker thread until complete. With ASP.NET you can write asynchronous
    pages, controllers, handlers, and modules, which enable you to return worker threads
    back to the thread pool while your code is waiting for an I/O operation to complete,
    and once complete, from the end-user''s point of view, the page will still seem
    to take some time to load, since the server is holding the request until the processing
    is complete and the response is ready to be sent back.


    310'
