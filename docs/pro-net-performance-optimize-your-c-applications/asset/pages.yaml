  md: '# Large object Heap


    The large object heap (LOH) is a special area reserved for large objects. Large
    objects are objects that occupy more than 85KB of memory. This threshold applies
    to the object itself, and not to the size of the entire graph rooted at the object,
    so that an array of 1,000 strings (each 100 characters in size) is not a large
    object because that array contains only 4-byte or 8-byte references to the strings,
    but an array of 50,000 integers is a large object.


    Large objects are allocated from the LOH directly, and not pass through generation
    0, 1 or generation 2. This minimizes the cost of promoting them across generations,
    which would mean copying their memory around. However, when a garbage collection
    occurs within the LOH, the sweep phase might have to copy objects around, retaining
    the same performance hit. To avoid this performance cost, objects in the large
    heap are not subject to the standard sweep algorithm.


    Instead of sweeping large objects and copying them, the collector employs a strategy
    of collecting the LOH. A list of all free blocks is maintained, and allocation
    requests can be satisfied from this list. This is similar to the free memory management
    strategy discussed in the beginning of this chapter, as they share the same performance
    cost: allocation cost (finding an appropriate free block, breaking free blocks
    in parts), deallocation cost (returning the memory region into the free list)
    and management cost (joining adjacent blocks together). However, it is cheaper
    to use free list management than it is to copy large objects in memory—and this
    is a typical scenario where purity of implementation is compromised to achieve
    better performance.


    > **Caution** Objects in the LOH do not move, so it might appear that pinning
    is unnecessary. This is wrong and relies on an implementation detail. You cannot
    assume that large objects retain the same memory location throughout their lifetime,
    and the threshold for a large object might change in the future without any notice!
    From a practical perspective, nonetheless, it is reasonable to assume that pinning
    large objects will incur less performance costs than pinning small objects. In
    fact, in the case of pinned arrays, it is often advisable to allocate a large
    array, pin it in memory, and distribute chunks from the array instead of allocating
    a new array for each operation that requires pinning.


    The LOH is collected when the threshold for a collection in generation 2 is reached.
    Similarly, when a threshold for a collection in the LOH is reached, generation
    2 is collected as well. Creating many large temporary objects, therefore, causes
    the same problems as the mid-life crisis—full collections will be performed to
    reclaim these objects. Fragmentation in the large heap is another potential problem,
    because holes between objects are not automatically reclaimed by sweeping and
    defragmenting the heap.


    The LOH model means developers must take care of large memory allocations, often
    bordering on manual memory management. One effective strategy is pooling large
    objects and reusing them instead of releasing them to the GC. The cost of maintaining
    the pool might be smaller than the cost of performing full collections. Another
    possible approach (if arrays of the same type) is allocating a very large object
    and breaking it into chunks as they are needed (see Figure 4-13).'
