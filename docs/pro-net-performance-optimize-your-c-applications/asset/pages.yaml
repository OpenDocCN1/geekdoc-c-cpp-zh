    # Setting Cache Headers for Dynamic Content


    Static files have modification dates that can be used to verify if a cached content
    has changed or not. Dynamic content, however, does not have a modification date,
    because every time a dynamic content is requested it is recreated and its modification
    date is actually the current date, headers such as ETag and Last-Modified are
    not relevant when dealing with dynamic content.


    Having said that, if you look at the content of a dynamic page, you may find a
    way to express the modification date of that, or maybe calculate an ETag for it.
    For example, if a request is sent to retrieve information from the database, the
    product table might hold a last update column that can be used to set the Last-Modified
    header. If the database table does not have last update column, you can try calculating
    the MD5 hash from the entity''s fields and set the ETag to the result. When a
    subsequent request is sent to the server, the server can recalculate the MD5 hash
    for the entity, and if none of the fields changed, the ETags will be identical
    and the server can return an HTTP 304 response.


    For example, the following code sets the Last-Modified cache header in a dynamic
    page to the last update date of a product:


    ```

    Response.Cache.SetLastModified(product.LastUpdateDate);

    ```


    If you do not have the date, you can set the ETag to an MD5 hash calculated by
    the entity''s properties, as demonstrated in the following code:


    ```

    Response.Cache.SetCacheability(HttpCacheability.ServerAndPrivate);

    // MD5 hash

    System.Security.Cryptography.MD5 md5 = MD5.Create();

    string contentForETag=entity.JsonProperty+entity.NumericProperty.ToString();

    byte[] checksum=md5.ComputeHash(System.Text.Encoding.UTF8.GetBytes(contentForETag));

    // Create an ETag from the hash

    // ETag strings must be surrounded with double quotes

    ```


    Note The default cacheability mode of requests in ASP.NET prevents the use of
    ETags. To support ETags, we need to change the cacheability mode to ServerAndPrivate,
    allowing content to be cached on the server-side and on the client-side, but not
    on shared caches, such as proxies.


    When receiving a request containing an ETag, you can compare the ETag with the
    ETag supplied by the browser, and if they match, return a 304 response, as shown
    in the following code:


    ```

    if (Request.Headers["If-None-Match"] == calculatedETag) {

    Response.Cache.Clear();

    Response.StatusCode=(int)System.Net.HttpStatusCode.NotModified;

    Response.End();

    }

    ```'
