- img_proc: true
  md: "# CHAPTER 11 WEB APPLICATION PERFORMANCE\n\ntool in production servers can\
    \ reduce the users experience on first requests. To run the tool, follow\nthese\
    \ steps:\n\n+   - Open a command prompt in your production server.\n- Navigate\
    \ to the %windir%Microsoft.NET folder\n- Navigate to either the Framework or Framework64\
    \ folder, according to the whether\nt web application's operating system is configured\
    \ to support 32-bit applications or\n(for 32-bit operating systems, the Framework\
    \ is the only option).\n- Navigate to the framework version's folder, according\
    \ to the .NET framework version\n used by the application pool (v2.0.50727 or\
    \ v4.0.30319).\n- Entering the following command to start the compilation (replace\
    \ WebApplicationName\n with the virtual path of your application):\\Aspnet-compiler.exe\
    \ -v /WebApplicationName\n\n# Fine-Tuning the ASP.NET Process Model\n\nWhen a\
    \ call is made to an ASPNET application, ASP.NET uses a worker thread to handle\
    \ the request. Sometimes,\nt code in the application itself can create a new thread,\
    \ for example when calling out to a service, reducing\nt number of free threads\
    \ in the thread pool. ASP.NET automatically performs several adjustments to the\
    \ thread\npool, and several limits limit the number of requests that can execute\
    \ at any given by. These settings\nare controlled from three main configuration\
    \ sections-the system.web>processModel section, the\nsystem.web>httpRuntime section,\
    \ and the system.net>connectionManagement section.\n\n> The httpRuntime and connectionManagement\
    \ sections can be set from the application's web.\nconfig file. The processModel\
    \ section, however, can only be changed in the machine.config file.\n\nThe processModel\
    \ section defines thread limits as minimum and maximum number\nof worker threads,\
    \ the httpRuntime section defines limits related to available threads, such as\
    \ the\nminimum number of available threads that must exist in order to keep processing\
    \ incoming requests. The\nconnectionManagement section controls the maximum number\
    \ of output HTTP connections per address.\nAll of the settings have default values,\
    \ however some of these are set a bit low, ASP.NET\nperformance. This includes\
    \ the autoConfig setting, which weakens some of the settings to achieve optimal\n\
    performance. This is part of the processModel configuration exists since ASPNET\
    \ 2.0, and\nis automatically set to true.\n\nThe autoConfig setting controls the\
    \ following settings (the default values were obtained from the\nMicrosoft Knowledge\
    \ article at http://support.microsoft.com/?id=821268):\n\n+   - processModel>maxWorkerThreads.\
    \ Changes the maximum number of worker threads in\nthe thread pool from 20 to\
    \ the number of cores to 100 the number of cores.\n- processModel>maxIOThreads.\
    \ Changes the maximum amount of I/O threads in the\nthread pool from 20 to the\
    \ number of cores to 100 the number of cores.\n- httpRuntime>minFreeThreads. Changes\
    \ the minimum number of available threads that\nare required to allow the execution\
    \ of new requests from 8 to 88x the number of cores.\n\n318"
  merge: -1
  pgno: 317
- img_proc: true
  md: "+   * runtime>minLocalFreeThreads. Changes the minimum number of available\
    \ threads that are required to allow the execution of new requests (from the local\
    \ host) from 4 to 76x the number of cores.\n\n+   * connectionManagement>maxConnections.\
    \ Changes the maximum number of concurrent connections from 10 to 12x the number\
    \ of cores.\n\nAlthough the defaults were set in order to achieve optimized performance,\
    \ there may be cases when you need to change them, in order to achieve better\
    \ performance, depending on the scenario you encounter with your web application.\
    \ For example, if your application calls out to services, you may need the number\
    \ of maximum concurrent connections to allow more requests to connect to backend\
    \ services at the same time. The following configuration shows how to increase\
    \ the number of maximum connection:\n\n```\n<configuration>\n  <system.net>\n\
    \    <connectionManagement>\n      <add address=\"200\" />\n    </connectionManagement>\n\
    \  </system.net>\n</configuration>\n```\n\nIn other scenarios, for example when\
    \ web applications need to get many requests upon starting, or have a burst of\
    \ requests, you may need to decrease the minimum number of worker threads in the\
    \ thread pool (the value you specify at runtime by the number of cores on the\
    \ machine). To perform this, apply the following configuration in the machine.config\
    \ file:\n\n```\n<configuration>\n  <system.web>\n    <processModel autoConfig=\"\
    true\" minWorkerThreads=\"10\"/>\n  </system.web>\n</configuration>\n```\n\nBefore\
    \ you run to increase the size of minimum and maximum threads, consider the effects\
    \ this change may have on your application: if you allow too many requests to\
    \ run concurrently, this may lead to excessive CPU usage and high memory consumption,\
    \ which can eventually crash your web application. Therefore, after changing these\
    \ settings, you must perform load test to verify the machine can sustain many\
    \ requests.\n\n# Configuring IIS\n\nAs our web application's hosting environment,\
    \ IIS has some influence on its overall performance, for example, the smaller\
    \ the IIS pipeline is, less code will be executed on each request. There are mechanisms\
    \ in IIS which can be used to increase our application's performance latency and\
    \ throughput, as well as some mechanisms, which when tuned properly, can improve\
    \ the overall performance of our application.\n\n# Output Caching\n\nWe already\
    \ saw that ASP.NET provides its own mechanism for output caching, so why does\
    \ IIS need yet another mechanism for output caching? The answer is quite simple:\
    \ there are other types we want to cache, not only ASP.NET pages. For example,\
    \ we may want to cache a set of static image files that are frequently requested,\
    \ or the output of a custom HTTP handler. For that purpose, we can use the output\
    \ cached by IIS. IIS has two types of output cache mechanisms: user-mode cache\
    \ and kernel-mode cache."
  merge: -1
  pgno: 318
- img_proc: true
  md: '# User-Mode Cache


    Just like ASP.NET, IIS is capable of caching responses in-memory, disk, or automatically
    from memory without accessing static files from disk, or invoking server-side
    code.


    To configure the output cache for your web application, open the IIS Manager application,
    select your web application, open the Output Caching feature. Once opened, click
    the Add... link from the Actions panel to add a new cache rule, or select an existing
    user-mode cache rule, add a new rule, type the file extension you wish to cache,
    and check the User-mode caching checkbox in the Add Cache Rule dialog, as shown
    in Figure 11-2.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_319_0.png)


    **Figure 11-2.** The Add Cache Rule dialog, you can select when the cached item
    will be removed from memory,


    Once you checked the checkbox, you select when the cached item will be removed
    from memory, such as after the file has been updated or some time has passed since
    the content was first cached. File caching is more suitable for static files,
    whereas time interval is more suitable for dynamic content. By pressing the Advanced
    button you can also control how the cache will store different versions of the
    output (options are according to query string or HTTP headers).'
  merge: -1
  pgno: 319
- img_proc: true
  md: "Once adding a caching rule, its configuration will be stored in your application's\
    \ web.config file, under the system.webServer caching section. For example, setting\
    \ the rule to cache .aspx pages causes them to expire after 30 minutes, and varies\
    \ by the output of the Accept-Language HTTP header will generate the following\
    \ configuration:\n\n```\n<system.webServer>\n  <caching>\n    <profiles>\n   \
    \   <add extension=\".aspx\" policy=\"CacheTimePeriod\" kernelCachePolicy=\"DontCache\n\
    \      duration=\"00:00:30\" byHeaders=\"Accept-Language\" />\n    </profiles>\n\
    \  </caching>\n</system.webServer>\n```\n\n# Kernel-Mode Cache\n\nUnlike user-mode,\
    \ cache-mode stores the cached content in the IIS's worker process memory, kernel-mode\
    \ caching cached content in the HTTP.sys kernel-mode driver. Using kernel-mode\
    \ caching provides faster response time, however it is not always supported. For\
    \ example, kernel-mode caching cannot be used when the request contains a query\
    \ string, or when the request is not an anonymous request.\n\nSetting up a cache\
    \ rule for kernel-mode is done in a similar manner to user-mode. In the rules\
    \ dialog, check the kernel-mode-caching checkbox, and select the caching monitoring\
    \ setting you wish to use. You can use both kernel-mode and user-mode caching\
    \ in the same rule. When both modes are used, kernel-mode caching is attempted.\
    \ For example, when the request contains a query string, the user-mode caching\
    \ is applied.\n\n> Tip When using a time interval for monitoring both kernel-mode\
    \ and user-mode set, make sure the time interval is identical in both settings,\
    \ otherwise the interval for kernel-mode will be used for both.\n\n# Application\
    \ Pool Configuration\n\nApplication pools control how IIS creates and manages\
    \ the worker processes which eventually host our code. When you install IIS and\
    \ ASP.NET application pools are created, according to the .NET framework versions\
    \ installed on the web server, to which you can add new pools as you install more\
    \ web applications on the server. When an application pool is created, it has\
    \ default settings that control its behavior. For example, every application pool,\
    \ when created, has a default setting for the idle timeout after the application\
    \ pool shuts down.\n\nUnderstanding the meaning of some of these settings can\
    \ help configure the way the application pool works, or it will serve your application's\
    \ needs more precisely.\n\n# Recycling\n\nBy recycling the settings you can control\
    \ when the application pool restarts the worker process. For example, you can\
    \ set that the worker process be recycled every few hours, or when it exceeds\
    \ a certain amount of memory. If your web application consumes a lot of memory\
    \ over time (for example due to stored objects), increasing the number of recycles\
    \ can help maintain its overall performance. On the other hand, if web application\
    \ performs normally, reducing the number of recycles will prevent loss of state\
    \ information."
  merge: -1
  pgno: 320
- img_proc: true
  md: '# CHAPTER 11 ■ WEB APPLICATION PERFORMANCE


    > **Tip** You can use the ASP.NET Worker Process Restarts performance counter
    to check the number of times your application recycled itself and the recycling
    frequency. If you see many recycles with no apparent reason, try to correlate
    the results with the application''s memory consumption and CPU usage to verify
    it hasn''t crossed any thresholds defined in the application pool configuration.


    # Idle Timeouts


    The default setting of an application pool shuts down the pool after 20 minutes
    of inactivity. If you expect such idle timeouts, for example when all users go
    out for lunch, you may want to increase the timeout period, or even cancel it.


    # Processor Affinity


    By default, an application pool is configured to use all the cores available in
    the server. If you have any special background process running on the server which
    needs much CPU time as it can get, you can tweak the affinity of the pool to use
    only specific cores, freeing the other cores for the background process. Of course
    this will require you to set the worker process''s affinity so it won''t compete
    with the worker process over the same cores.


    # Web Garden


    The default behavior of an application pool is to start one worker process which
    handles all the requests for the application. If your worker process handles several
    requests at once, and these requests compete for the same resource by locking
    on it, you may end up with contention, causing latency in returning responses.
    For example, if your application is using a proprietary caching mechanism that
    locks prevent concurrent requests from inserting items to the cache, requests
    will start to synchronize one after the other, causing latencies that may be hard
    to detect. Although we can sometimes fix the code to use less locking, it is not
    always possible. Another way of resolving this contention is to spin up multiple
    worker processes, all running the same application, and each handling its own
    set of requests, lowering the contention rate in the application.


    Another scenario when running several processes of the same web application is
    useful, when you have a 64-bit IIS server running a 32-bit web application. 32-bit
    applications can only use up to 2 GB memory, which often leads to frequent GC
    cycles and probably application recycling. By utilizing the server''s available
    memory and two or three worker processes for a 32-bit web application, you can
    utilize.


    In the IIS pool configuration, you can set the maximum number of worker processes
    that are permitted to serve requests. Increasing the value to more than 1 (which
    is the default), will spin more worker processes as requests come in, up to the
    maximum defined. An application pool that has more than one worker process is
    referred to as a "Web Garden." Each time a connection is made from a client, it
    is assigned to a worker process which serves the client from then on, allowing
    requests from multiple users to be balanced between the gardens, hopefully lowering
    contention rate.


    Note that using garden has its disadvantages. Multiple worker processes take up
    more memory, they prevent the use of default in-proc session state, and when multiple
    worker processes are running on the same machine you may find yourself dealing
    with local resource contention, for example if both worker processes try to use
    the same log file.


    322'
