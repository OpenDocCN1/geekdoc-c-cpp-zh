  md: '# CHAPTER 2 PERFORMANCE MEASUREMENT


    +   - Know the resolution, precision, and accuracy of your measurement mechanism—for
    example, Environment. TickCount''s precision is usually 10-15ms, although its
    resolution appears to be 1ms.


    > > Note Resolution is the fineness of the measurement mechanism. If it reports
    results in integer multiples of 100ns, then its resolution is 100ns. However,
    its precision may be far less—for a physical time interval of 500ns it might report
    2x100ns on one occasion and 7x100ns on another. We might be able to place an upper
    bound on the precision at 300ns, in this case. Finally, accuracy is the degree
    of correctness of the measurement mechanism. If it reliably and repeatedly reports
    a 500ns physical time interval as 5400ns with a precision of 100ns, we might say
    its accuracy is +8% of the truth.


    The unfortunate example in the beginning of this section should not dissuade you
    from ever writing your own microbenchmarks. However, you should mind the advice
    given here and design meaningful benchmarks whose results you can trust. The worst
    performance optimization is one that is based on incorrect measurements; unfortunately,
    manual benchmarking often leads into this trap.


    # Summary


    Performance measurement is no simple task, and one of the reasons is the large
    variety of metrics and tools, and the effect of the tools on the measurement accuracy
    and the application''s behavior. We''ve seen a large number of tools in this chapter,
    and you might be feeling a little dizzy if asked to recall precisely which situations
    warrant the use of which tool. Table 2-3 summarizes the important characteristics
    of all the tools demonstrated in this chapter.'
