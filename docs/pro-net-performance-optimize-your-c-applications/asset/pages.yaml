  md: '# CHAPTER 2 PERFORMANCE MEASUREMENT


    The Visual Studio profiler has an API that applications can use to pause and resume
    profiling from code. This can be used to avoid collecting data from uninteresting
    parts of the application, and to decrease the size of the profiler''s data files.
    For more information about the profiler APIs, consult the MSDN documentation at
    http://msdn.microsoft.com/en-us/library/bb514149(v=vs.110).aspx.


    The profiler also collects Windows counters and ETW events (discussed earlier
    in this chapter) during a normal profiling run. To enable these, configure the
    session properties from Performance Explorer, and navigate to the Windows Events
    and Counters tab. ETW trace data can only be viewed from the command line, using
    the VSPerfReport /ETW command line switch, with 32 and 64-bit performance counter
    data will appear in the report''s Marks view in Visual Studio.


    Finally, if Visual Studio takes a long time analyzing with lots of data, you can
    make sure it was a one-time performance hit: after analysis completes, right-click
    the report in Performance Explorer and choose ''Save Analyzed Report''. Serialized
    report files have the .vsfile extension and open instantaneously in Visual Studio.


    # Profiler Guidance


    When opening a report in Visual Studio, you might notice a section called Profiler
    Guidance which contains useful tips that help detect common performance problems
    discussed in the book,:


    +   * "Using StringBuilder for string concatenations”—a useful rule that will
    help lower the amount of garbage your application creates, reducing garbage collection
    times, discussed in Chapter 4.

    * "Many of your objects are being collected in generation 2 garbage collection”—the
    mid-life crisis phenomenon for objects, also discussed in Chapter 4.

    * "Override Equals operator over value types”—an important optimization for commonly-used
    values, discussed in Chapter 3.

    * "You may be using Reflection excessively. This is an expensive operation”—discussed
    in Chapter 10.


    # Advanced Profiling Customization


    Collecting performance information from environments may prevent you if you have
    to install massive tools such as the Visual Studio. Frankly, the Visual Studio
    profiler can be installed and run in production environments without the Entire
    Visual Studio suite. Installation media, in the Standalone Profil directory are
    available for 32 and 64-bit systems. After installing, follow the instructions
    to run the profiler or attach to an existing process using Visual Studio, or use
    the VSPerfReport tool to generate CSV or HTML reports at http://msdn.microsoft.com/en-us/library/ms182402(v=vs.110).aspx.
    When the profiler runs, it will generate a .vsfile file that you can open on another
    machine with Visual Studio, or without needing to Visual Studio.


    For instrumentation profiling, specifically, you can use the instrumentation options
    available from the command line, using the VSInstr.exe tool to start and suspend
    profiling in a specific function, and to include/exclude functions from instrumentation
    based on a pattern in their name. More information about VSInstr.exe is available
    at the MSDN http://msdn.microsoft.com/en-us/library/ms182402.aspx.'
