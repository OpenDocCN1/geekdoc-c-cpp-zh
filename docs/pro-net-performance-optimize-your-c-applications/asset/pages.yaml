    \ content\n    }\n```\n\nIn the example above page is also marked as Async, the\
    \ first example, but there is no need to create the PageAsyncTask object, since\
    \ the page automatically receives notification when the xxAsync method is called,\
    \ and after the xxCompleted event is finished.\n\nWhen setting the page to async,\
    \ ASP.NET changes the page to implement the IHttpAsyncHandler instead of the synchronous\
    \ IHttpHandler. If you wish to create your asynchronous generic HTTP handler,\
    \ create a generic HTTP handler class which implements the IHttpAsyncHandler interface.\n\
    \n# Creating an Asynchronous Controller\n\nController classes in ASP.NET MVC can\
    \ also be created as asynchronous controllers, if they perform lengthy I/O operations.\
    \ To create an asynchronous controller you will need to perform the following\
    \ steps:\n\n+   1. Create a controller class that inherits from the AsyncController\
    \ type.\n2. Implement a set of action methods for each async operation according\
    \ to the following convention, where xx is the name of the action: xxCompleted.\n\
    3. In the xxAsync method, call the AsyncManager.OutstandingOperations.Increment\
    \ method with the number of asynchronous operations you are to perform.\n4. In\
    \ the code that executes during the return of the async operation, call the AsyncManager.OutstandingOperations.Decrement\
    \ method to notify the operation has completed.\n\nFor example, the following\
    \ code shows a controller with an asynchronous action named Index, which calls\
    \ a service that returns the data for the:\n\n```\npublic class MyController :\
    \ AsyncController {\n    public void IndexAsync() {\n        //Notify the AsyncManager\
    \ there is going to be only one Async operation\n        AsyncManager.OutstandingOperations.Increment();\n\
    \        MyService serviceProxy=new MyService();\n        //Register to the completed\
    \ event\n```\n\n312"
