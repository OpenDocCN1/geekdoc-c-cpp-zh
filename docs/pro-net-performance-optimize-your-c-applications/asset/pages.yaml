  md: '# # Introduction


    This book has come to be because we felt there was no authoritative text that
    covered all three areas relevant to .NET application performance:


    +   - Identifying performance metrics and then measuring application performance
    to verify whether it meets or exceeds these metrics.

    - Improving application performance in terms of memory management, networking,
    I/O, concurrency, and other areas.

    - Understanding CL and .NET internals in sufficient detail to design high-performance
    applications and fix performance issues as they arise.


    .NET developers cannot achieve systematically high-performance software solutions
    without thoroughly understanding all three areas. .NET memory management (facilitated
    by the CL garbage collector) is an extremely complex field and the cause of significant
    performance problems, including memory leaks and long GC pauses. Without understanding
    how the CLR garbage collector operates, high-performance memory management in
    .NET is left to nothing but chance. Choosing the proper collection class from
    what the .NET Framework has to offer, or deciding to implement your own, requires
    comprehensive familiarity with CPUs, complexity and synchronization issues.


    This book''s 11 chapters are designed to be read in succession, but you can jump
    back and forth between topics and fill in the blanks when needed. The chapters
    are organized into the following logical parts:


    +   - Chapter 1 and Chapter 2 deal with performance metrics and performance measurement.
    They introduce the tools available to you to measure application performance.

    - Chapter 3 and Chapter 4 dive deep into CLR internals. They focus on internals
    and the implementation of CLR garbage collection—two crucial topics for improving
    application performance where memory management is concerned.

    - Chapter 5, Chapter 6, Chapter 7, and Chapter 11 discuss specific areas of the
    .NET Framework and the CLR that offer performance opportunities—using collections
    correctly, parallelizing code, optimizing I/O and networking operations, interoperability
    solutions efficiently, and improving the performance of Web applications.

    - Chapter 9 is a brief foray into complexity theory and algorithms. It was written
    to give you a taste of what algorithm optimization about.

    - Chapter 10 is the dumping for miscellaneous topics that didn''t fit elsewhere
    in the book, including startup time optimization, exceptions, and .NET Reflection.


    Some of these topics have prerequisites that will help you understand them better.
    Throughout the course of the book we assume substantial experience with the C#
    programming language and the .NET Framework, as well as familiarity with fundamental
    concepts,:'
