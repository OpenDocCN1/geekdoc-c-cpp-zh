    # WHAT''S THE DIFFERENCE BETWEEN STACK AND HEAP?


    Contrary to popular belief, isn''t much of a difference between stacks and heaps
    in a .NET process. Stacks and heaps are nothing more than ranges of addresses
    in virtual memory, and there is no inherent advantage in the range of addresses
    reserved to the stack of a particular thread compared to the range of addresses
    reserved for the managed heap. Accessing a memory location on the heap is neither
    faster slower than accessing a memory location on the stack. There are several
    considerations that might, in certain cases, support the claim that memory access
    to stack locations is faster, over memory access to heap locations: Among


    +   - On the stack, temporal locality (allocations make close together in time)
    implies spatial locality (storage that is close together in space). In turn, when
    temporal locality implies temporal locality (objects allocated together are accessed
    together), the sequential stack storage tends to perform better with respect to
    CPUs and operating system patterns.

    - Memory density on the stack tends to be higher than on the heap because of reference
    type overhead (discussed later in this chapter). Higher memory density often leads
    to better performance, e.g., because more objects fit in the CPU cache.

    - Thread stacks tend to be fairly small – the default maximum stack size on Windows
    is 1MB, and most threads use only a few stack pages. On modern systems, the stacks
    of all application threads can fit into the CPU cache, making typical object access
    extremely fast. (Entire heaps, on the other hand, rarely fit into CPU caches).


    With that said, you should not be moving all your allocations to the stack! Thread
    stacks on Windows are limited, and it is easy to exhaust the stack by applying
    injicious recursion and large stack allocations.


