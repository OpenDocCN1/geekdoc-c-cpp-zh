  md: '# CHAPTER 6


    # Concurrency and Parallelism


    For many years, the processing power of computer systems increased exponentially.
    Processors have been getting faster with every model, and programs designed to
    challenge the hardware resources of an expensive workstation were being ported
    to laptops and handheld devices. This era came to an end years ago, and today
    processors are not exponentially increasing in speed; they are exponentially increasing
    in number. Writing programs to take advantage of multiple processing cores hasn''t
    been easy when multi-processor systems were rare and expensive, and it hasn''t
    turned easy today, even when smartphones ship with dual- and quad-core processors.


    In this chapter, we shall embark on a whirlwind tour through the world of modern
    parallel programming in .NET. Although this chapter cannot begin to describe all
    the APIs, frameworks, tools, pitfalls, design patterns, and architectural models
    that parallel programming is today, no book on performance optimization will be
    complete without discussing one of the apparently ways to improve performance—namely,
    scaling to multiple processors.


    # Challenges and Gains


    Another challenge of harnessing parallelism is the rising heterogeneity of consumer-processor
    systems. CPU manufacturers take pride in delivering reasonably priced consumer-oriented
    systems with four or eight processing cores, and high-end server systems with
    dozens of cores. However, nowadays a mid-range workstation or high-end laptop
    often comes with a powerful processing unit (GPU), with support for hundreds of
    concurrent threads. As if the two kinds of parallelism were not enough, Infrastructure-as-a-Service
    (IaaS) price drops weekly, making thousand-cloud accesses possible in a blink
    of an eye.


    > Herb Sutter gives an excellent overview of the heterogeneous world that awaits
    parallelism frameworks in his article "Welcome to the Jungle" (2011). In another
    article from 2005,"The Free Lunch Is," shaped the resurgence of interest in concurrency
    and parallelism frameworks in everyday programming. If you find yourself hungry
    for more information on parallel programming than this single chapter can provide,
    we recommend the following excellent books on the subject of parallel programming
    in general and .NET parallelism frameworks in particular: Joe Duffy, "Concurrent
    Programming on Windows" (Addison-Wesley, 2008); Joseph Albahari, "Threading in
    C#" (online, 2011). To understand in more detail the operating system''s inner
    workings around thread scheduling and synchronization mechanisms, Mark Russinovich,
    David Solomon, and Alex Ionescu''s "Windows Internals, 5th Edition" (Microsoft
    Press, 2009) is an excellent text. Finally, the MSDN is a good source of information
    on the APIs we will see in this chapter, such as the Task Parallel Library.'
