    public ActionResult IndexCompleted(MyData result) {\n  return View(\"Index\",\
    \ new MyViewModel { TheData=result });\n}\n}\n```\n\n# # Tweaking the ASP.NET\
    \ Environment\n\nIn addition to code, every incoming request and outgoing response\
    \ has to go through ASP.NET's components. Some of ASP.NET's mechanisms were created\
    \ to serve the developer's needs, such as the ViewState mechanism, for performance,\
    \ but when fine-tuning ASP.NET applications it is advisable to change the default\
    \ behavior of these mechanisms, although changing them may sometimes require your\
    \ application code be constructed.\n\n# # Turn Off ASP.NET Tracing and Debugging\n\
    \nASP.NET Tracing enables developers to view diagnostic information for requested\
    \ pages, as execution time and path, session state, and HTTP headers list.\nAlthough\
    \ tracing is a great feature and added value when developing and debugging ASP.NET\
    \ applications, it has some effects on the overall performance of the application,\
    \ due to the tracing mechanism and the collection of data which is performed on\
    \ each request. Therefore, if you enabled tracing during development, turn it\
    \ off before deploying your web application to the production environment, by\
    \ changing the trace settings in the web.config.\n\n```\n<configuration>\n  <system.web>\n\
    \    <trace enabled=\"false\"/>\n  </system.web>\n</configuration>\n```\n\n> Note\
    \ The default value of trace, if not specified otherwise in the web.config, is\
    \ disabled (enabled=\"false”), removing the trace settings from the web.config\
    \ file will also disable it.\n\nWhen creating new ASP.NET web applications, one\
    \ of the things automatically added to the application’s web.config file is the\
    \ system►compilation configuration section with the debug attribute set to true:\n\
    \n```\n<configuration>\n  <system.web>\n    <compilation debug=\"true\" targetFramework=\"\
    4.5\" />\n  </system.web>\n</configuration>\n```"
