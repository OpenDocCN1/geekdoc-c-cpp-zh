    (imposes more constraints), socket-based scatter-gather is more practical, because
    it does not have these limitations. The .NET Framework exposes scatter-gather
    through overloads of Socket''s Send and Receive methods, but the generic scatter-gather
    functions are not exposed.


    An example of scatter-gather usage is via HttpRequest. It combines an HTTP header
    with the payload without constructing a contiguous buffer to hold both.


    # File I/O


    Normally, file I/O goes through the filesystem cache, which has some performance
    benefits: caching of recently accessed data, read-ahead (speculative pre-fetching
    from disk), write-behind (asynchronously writing data to disk), and combining
    of small writes. Windows hints about your expected file access pattern, you can
    gain a bit more performance. If your application overlapped I/O and can intelligently
    handle buffers facing some complexities, then bypassing entirely can be more efficient.


    # Cache Hinting


    When opening or opening a file, you specify flags and attributes to the CreateFile
    Win32 API function, some of which influence caching behavior:


    +   - FILE_FLAG_SEQUENTIAL_SCAN hints to the Cache Manager that the file is accessed
    sequentially, possibly skipping some parts, but is accessed randomly. The cache
    will read further ahead.

    - FILE_FLAG_RANDOM_ACCESS hints that the file is accessed in random order, so
    the Cache Manager reads less ahead, since it is unlikely that this data will be
    requested by the application.

    - FILE_ATTRIBUTE_TEMPORARY hints that the file is temporary, flushing writes to
    disk (to prevent data loss) can be delayed.


    NET exposes these options (except the last one) through a FileStream constructor
    overload that accepts a FileOptions parameter.


    > Caution Random access is for performance, especially on disk media since the
    read/write head has to physically move. Historically, disk throughput has improved
    with increasing aerial storage density, but latency has not. Modern disks can
    intelligently (taking disk rotation into account) re-order-access I/O so the total
    time the head spends travelling is minimized. This is called Native Command Queuing
    (NCQ). For this work effectively, the disk controller must be aware of several
    I/O requests ahead. In other words, if possible, you should have several asynchronous
    I/O requests pending.


