    Weak references do not track object resurrection by default. To enable resurrection,
    use the overloaded constructor that accepts a Boolean parameter and pass true
    to indicate that resurrection should be tracked. Weak references that track resurrection
    are called *long weak references*; weak references that do not track resurrection
    are called *short weak references*.


    # GC HANDLES


    Weak references are a special case of *GC handles*. A GC handle is a special low-level
    value type that provide several facilities for referencing objects:


    +   * Keeping a standard (strong) reference to it from being collected by the
    `GCHandleType.Normal` enumeration value.

    * Keeping a short weak reference to an object. This is represented by the `GCHandleType.Weak`
    enumeration value.

    * Keeping a long weak reference to an object. This is represented by the `GCHandleType.WeakTrackResurrection`
    enumeration value.

    * Keeping a reference to an object, pinning it so that it cannot move in memory
    and obtaining its address if necessary. This is represented by the `GCHandleType.Pinned`
    enumeration value.


    There is rarely any need to use GC handles directly, but they often come up in
    profiling results as another type of root that can retain managed objects.


