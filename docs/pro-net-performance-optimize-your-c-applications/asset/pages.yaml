  md: '# THREAD POOL FIFO AND LIFO SEMANTICS


    The reason behind the apparently eccentric FIFO and LIFO semantics is the following:
    when work is enqueued to the global queue, no particular thread has any preference
    to execution, and fairness is the only criterion by which work is selected for
    execution. This is why FIFO semantics are suitable for the global queue. However,
    when a thread pool queues a work for execution, it is likely to use the same data
    and the same instructions as the currently executing work item; that''s why it
    makes sense to enqueue it in a pool that belongs to the same thread—it will be
    executed shortly after the currently executing work item, and take advantage of
    the CPU data and instruction caches.


    Furthermore, accessing work items on the thread''s local queue requires less synchronization
    and is less likely to encounter contention from threads other than the global
    queue. Similarly, when a thread steals from another thread queue, it steals it
    in FIFO order, so the LIFO optimization with respect to CPU caches on the original
    thread''s processor is maintained. This thread pool structure is friendly towards
    work hierarchies, where a single work item enqueued into the global queue will
    spawn off dozens of additional work items and provide for several thread pools.


    As with abstraction, thread pools take more of the granular control over thread
    lifetime and work item scheduling from the application. While the CLR thread pool
    has control APIs, it has no built-in APIs to control the priority of its tasks
    or threads. More often than not, however, this level of control is not compensated
    by the application''s ability to scale automatically on more powerful systems,
    and the performance from not having to create and destroy threads for short-lived
    tasks


    Work items queued to the thread pool are extremely limited in exception information,
    don''t have support for asynchronous connections and cancellation, and don''t
    feature any mechanism for obtaining a result from a task that has completed. The
    Task Parallel Library in .NET 4 introduces tasks, which are a powerful abstraction
    on top of thread work items. Tasks are the structured alternative to threads and
    thread work items, in the same way that subroutines and functions were the structured
    alternative to get-based assembly programming.


    # Task Parallelism


    Task parallelism is a paradigm and set of APIs for breaking down a large task
    into a set of smaller ones, and executing them on multiple threads. The Task Parallel
    Library (TPL) has first-class APIs for managing millions of tasks simultaneously
    (through the CLR thread pool). At the heart of the TPL is the System.Threading.Tasks.Task
    class, which represents a task. The Task class provides the following capabilities:


    +   - Scheduling for independent execution on an unspecified thread. (The specific
    thread to execute a task is determined by a task scheduler; the default task scheduler
    enqueues the task to the thread pool, but there are schedulers that send tasks
    to a particular thread, such as the UI thread.)

    - Waiting for a task to complete and obtain the result of its execution.

    - Providing a continuation that should run as soon as the task completes. (This
    is often called a callback, but we shall use the term continuation throughout
    this chapter.)

    - Handling exceptions that arise in a single task or even a hierarchy of tasks
    on the original thread that scheduled them for execution, or any other thread
    that is interested in the task results.'
