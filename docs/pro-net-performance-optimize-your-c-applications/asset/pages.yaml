    +   - We are implementing a service that manages a set of physical backup devices.
    There is a set of conveyor belts with intersections and robot arms that manipulate
    backup tapes across the room. The service gets requests, as "transfer a tape X
    from storage cabinet 13 to backup cabinet 89, and make sure to pass through formatting
    station C or D".

    - When the system starts, we calculate all shortest routes to every other cabinet,
    including special requests, as going through a particular computer. This information

    - When the system starts, we calculate all shortest routes to every other cabinet,
    including special requests, as going through a particular computer. This information
    is stored in a hashtable indexed by route descriptions and with values.

    - System path with 1,000 nodes and 250 intersections takes more than 30 minutes,
    and memory consumption reaches a peak of approximately 5GB. This is not acceptable.


    First, we observe that the constraint "make sure to pass through formatting cabinet
    C or D" does not pose significant additional challenge. The shortest path from
    A to B going through C is the shortest path from A to C followed by the shortest
    path from C to B (the proof is almost a tautology).

    The Floyd-Warshall algorithm finds the shortest paths between every pair of vertices
    in the graph and uses decomposition into smaller problems similar. The recursive
    formula, uses the same decomposition above: the shortest path from A to B goes
    through vertex V. Then to find the shortest path from A to B, we need to find
    the shortest path from A to V and then the shortest path from V to B, because
    we do not know what V is, we need to consider all intermediate vertices—one way
    to do so is by numbering them from 1 to n.

    Now, the length of the shortest path (SP) from vertex i to vertex j using only
    the vertices 1,...,k is given by the following recursive formula, assuming there
    is no edge from i to j:


    ```

    SP(i, j, k) = min {SP(i, j, k), SP(i, k, k) + SP(k, j, k)}

    ```


    To see, consider the vertex k. Either the shortest path from i to j uses this
    vertex or it does not. The shortest path does not use the vertex k, then we do
    not have to use this vertex and can rely on the shortest path using only the vertices
    1,...,k. If the shortest path uses the vertex k, then we have our decomposition—the
    shortest path can be sewn together from the shortest path from i to k (that uses
    only the vertices 1,...,k-1) and the shortest path from k to j (that uses only
    the vertices 1,...,k-1). See Figure 9-3 for an example.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_268_0.png)


    **Figure 9-3.** In the upper part of the diagram, the shortest path from i to
    j (through vertices 2 and 5) does not use the vertex k. Hence, we can restrict
    ourselves to the shortest path using vertices 1,...,k-1. In the lower part, the
    shortest path from i to j uses vertex k. Hence, the shortest path from i to j
    is the shortest path from i to k, sewn together with the shortest path from k
    to j


