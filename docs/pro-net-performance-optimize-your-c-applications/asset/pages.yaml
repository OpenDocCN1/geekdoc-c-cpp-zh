  md: '# RUNNING THE SAMPLING PROFILER FROM VISUAL STUDIO


    The easiest way to run the sampling profiler is from Visual Studio itself, (as
    we will see later) it also supports production profiling from a simplified command
    line environment. We recommend that you use one of your own applications for this
    experiment.


    +   1. In Visual Studio, click the Analyze ► Launch Performance menu item.

    2. On the first wizard page, make the “CPU sampling” radio button selected and
    click the Next button. (Later in this chapter we''ll discuss the other profiling
    modes; you can then repeat this experiment)

    3. If the project profile is loaded in the current solution, click the “One or
    more projects” radio button and select the project from the list. Otherwise, click
    the “Executable (.EXE file)” radio button. Click the Next button.

    4. If you selected “An executable (.EXE file)” on the previous screen, direct
    the profiler to your executable and provide any line arguments if necessary, then
    click the Next button. (If you don''t have your application handler, feel free
    to use the JackCompiler.exe sample application from this chapter''s source code
    folder).

    5. Keep the checkbox “Launch profiling after the wizard finishes” checked and
    click the Finish button.

    6. If you are not running Visual Studio as an administrator, you will be prompted
    to upgrade the profiler''s credentials.

    7. When your application finishes, a profiling report will open. “Current View”
    combo box on top to navigate between the different views, showing the samples
    collected in your application''s code.


    For more experimentation, after the profiling session completes make sure to check
    out the Performance Explorer window (e.g. choosing a different event or interval),
    change the target binary, and compare multiple profiler reports from different
    runs.


    2-12 shows a summary window of the profiler''s results, with the most expensive
    call path and the functions in which most exclusive samples have been collected.
    2-13 shows the detail report, in which there are few methods responsible for most
    CPU utilization (have a large number of exclusive samples). Double-clicking a
    method in the list brings up a detailed window, which shows the application''s
    source-coded with the lines in which most samples were collected (see Figure 2-14).'
