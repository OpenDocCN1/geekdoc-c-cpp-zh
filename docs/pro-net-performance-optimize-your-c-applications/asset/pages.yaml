  md: "# CHAPTER 8 UNSAFE CODE AND INTEROPERABILITY\n\nCOM assigns objects and threads\
    \ which are boundaries across which COM will marshal calls.\nCOM has several apartment\
    \ types:\n\n+   - Single-threaded apartment (STA), each hosts a single thread,\
    \ but can host any number of objects. There can be any number of STA apartments\
    \ in a process.\n- Multi-threaded apartment (MTA), hosts any number of threads\
    \ and any number of objects,but there is only one MTA in a process. This is the\
    \ default for .NET threads.\n- Neutral-threaded apartment (NTA), hosts objects\
    \ but not threads. There is only one NTA apartment in a process.\n\nA thread is\
    \ assigned to an apartment when a call is made to CoInitialize or CoInitializeEx\
    \ to initialize COM for that thread. Calling CoInitialize will assign the thread\
    \ to a new STA apartment, while CoInitializeEx allows you to specify either STA\
    \ or an MTA. In .NET, you do not call functions directly, but instead mark thread's\
    \ state with the STAThread or MTAThread attribute. Alternatively, you can call\
    \ Thread.SetApartmentState or the Apartment property before a thread is started.\
    \ If not specified, NET initializes threads (including the main thread) as MTA.\n\
    \ objects are assigned to apartments based on the ThreadingModel registry value,\
    \ which can be:\n\n+   - Single - object resides in the default STA.\n- Apartment\
    \ (STA) – object must reside in the STA, and only STA's thread is allowed to call\
    \ the object directly. Different instances can reside in different STA.\n- Free\
    \ (MTA) – object resides in the MTA. Any number of MTA threads can call it directly\
    \ and concurrently. MTA object must ensure-safety.\n- Both - object resides in\
    \ the creator's (STA or MTA). In essence, it becomes either STA-like or MTA-like\
    \ object created.\n- Neutral – object resides in the neutral apartment and never\
    \ requires marshaling. This is the most efficient mode.\n\nRefer to Figure 8-6\
    \ for a visual representation of apartments, threads and objects.\n\n![](img/d3ea56daae375e1d9f44d8bff55d84b7_250_0.png)\n\
    \nFigure 8-6. Process division into COM apartments\n\n250"
