  md: "# Web Analyzing Tools\n\nAnother set of tools that can be used to identify\
    \ issues with web applications are web analysis tools, such as Yahoo's YSlow and\
    \ Google's Page Speed. Web analyzing tools do more than just analyze the traffic\
    \ itself, for missing caching headers and non-compressed responses. They analyze\
    \ the HTML page itself to detect problems that can affect the performance of loading\
    \ and rendering pages, such as:\n\n+   * Large HTML structures that can cache\
    \ the rendering time.\n* HTML, CSS, and JavaScript content that can be shrunk\
    \ in size by using minifications techniques.\n* Large images that can be scaled\
    \ to reduce their size and change their dimensions in the HTML page.\n* JavaScript\
    \ code that can be executed after the page is loaded instead of during, to allow\
    \ pages to load faster.\n\n# Improving Web Performance on the Server\n\nThere\
    \ are many ways to improve the performance of code in ASPNET applications. Some\
    \ improvements can be made using techniques that are valid for both ASPNET applications\
    \ and desktop applications, such as using threads or Tasks for non-dependent asynchronous\
    \ operations, but there are also improvements that relate to the way you write\
    \ your ASPNET code, whether it is a WebForm-code-behind, or an ASPNET MVC Controller.\
    \ These changes, however, can help utilize your server better, allowing the application\
    \ to run faster, and handle more concurrent requests.\n\n# Cache Commonly Used\
    \ Objects\n\n+   1. If the data is already cached, use it.\n2. Else:\n    a. Fetch\
    \ the data.\n    b. Store it in the cache.\n    c. Use it.\n\n> **Caution** Since\
    \ several requests can access the same cached object at any given time, causing\
    \ the same object be referenced from multiple threads, it is expected that an\
    \ update to a cached object will be done responsibly, by treating whether it is\
    \ immutable (changes to a cached object require cloning it, making the changes\
    \ on the new copy, and then updating the cache with the cloned object), or using\
    \ locking mechanisms to make sure it is not being updated by other threads."
