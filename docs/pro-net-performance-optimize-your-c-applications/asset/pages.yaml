- img_proc: true
  md: '# CHAPTER 3


    # Type Internals


    This chapter concerns the internals of .NET types, how value types and reference
    types are laid out in memory, what the JIT must do to invoke a virtual method,
    the intricacies of implementing a value type properly, and other details. Would
    we trouble ourselves and spend a few dozen pages discussing these inner workings?
    How can these internal details affect our application''s performance? It turns
    out that value types and reference types differ in layout, allocation, equality,
    assignment, storage, and numerous other parameters—which makes type selection
    of paramount importance to application performance.


    # An Example


    Consider a simple type called Point2D represents a point in a small two-dimensional
    space. Each of the two coordinates can be represented by a short, for a total
    of four bytes for the entire object. Suppose that you want to store in memory
    an array of ten points. How much space would be required for them? The answer
    to this question depends on whether Point2D is a reference type or a value type.
    If it is a reference type, an array of million points would store ten million
    references. On a 32-bit system, these million references consume almost 40 MB
    of memory. The objects themselves would consume at least the same amount. In fact,
    as we will shortly, each Point2D instance would occupy at least 12 bytes of memory,
    bringing the total memory usage for an array of ten points to a whopping 160MB!
    On the other hand, if Point2D is a value type, an array of ten points would store
    ten million points – not a single extra wasted, for a total of 40MB, four times
    less than the reference type approach (see Figure 3-1). In memory density is a
    critical reason to prefer value types in certain settings.


    There is another disadvantage of storing references to points instances. If you
    traverse this huge array of points sequentially, it is much easier for the compiler
    and the hardware to access a contiguous array of Point2D instances than it is
    to access references the heap objects, which are not guaranteed to be contiguous
