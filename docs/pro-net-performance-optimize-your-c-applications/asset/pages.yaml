    ASLR, base addresses for images are randomized across runs for security reasons.
    Under this configuration, reassembling to avoid base address collisions is not
    important on Windows Vista and newer platforms.


    # Reduce the Total Number of Assemblies


    Reduce the number of assemblies loaded by your application. Each assembly incurs
    a constant cost, regardless of its size, and inter-assembly references and method
    calls may be more costly at runtime. Large applications that load hundreds of
    assemblies are not uncommon, and their startup times can be reduced by seconds
    if assemblies are merged to only a few binaries.


    # Processor-Specific Optimization


    Theoretically,.NET developers should never be concerned with optimizations tailored
    to a specific processor or instruction set. After all, the purpose of IL and JIT
    compilation is to allow managed applications to run on any hardware that has the
    .NET Framework installed, and to remain indifferent to operating system, processor
    features, and instruction sets. Squeezing the last bits of performance from managed
    applications may require reasoning at the assembly level, as we have seen throughout
    this book. At times, understanding processor specific features is a step for even
    more significant performance gains.


    In this short section we review some examples of optimizations tailored to specific
    processor features, optimization that might work well on one machine and break
    on another. We focus on Intel processors, especially the Nehalem, Sandy Bridge
    and Ivy families, but the guidance will also be relevant to AMD processors. Because
    these optimizations are perilous and somewhat unpredictable, you should not use
    these examples as definitive guidance, but as motivation for reaping more performance
    from your applications.


