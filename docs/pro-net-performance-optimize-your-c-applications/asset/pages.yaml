    # # Summary


    However different, the optimization tips and techniques discussed in this chapter
    are critical for implementing high-performance CPU-bound algorithms and designing
    the architecture of complex systems. By making your code take advantage of the
    built-in JIT optimizations as well as any specific instructions the processor
    has to offer, by reducing as much as possible the startup times of your applications,
    and by steering clear of expensive CLR mechanisms such as Reflection and exceptions,
    you will assuredly squeeze every bit of performance from your managed software.


    In the next final chapter we will discuss the performance characteristics of Web
    applications, primarily in the ASP.NET domain, and introduce specific optimizations
    that are relevant only to Web servers.'
