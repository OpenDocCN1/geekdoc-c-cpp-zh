  md: 'If you create an object with a threading model incompatible with the creator''s
    apartment, you will receive an interface pointer which actually points to a proxy.
    If the object''s interface needs to be passed to a different thread belonging
    to a different apartment, the interface pointer should not be passed directly,
    but instead needs to be marshaled. COM will return a proxy object as appropriate.


    Marshalling involves translating the function (including parameters) to a message
    which will be posted to the recipient STA apartment''s message queue. For STA
    objects, this is implemented as a hidden window procedure receives the messages
    and dispatches calls to the COM object via a stub. In this way, COM objects are
    invoked by the same thread, which is obviously thread-safe.


    When the caller''s apartment is incompatible with the COM object''s apartment,
    thread switch and cross-thread parameter marshaling occurs.


    > Avoid the cross-thread performance penalty by matching the COM object''s apartment
    with the creating''s apartment. Create and use apartment STA objects on STA threads,
    and free-threaded COM objects on MTA threads. COM objects marked as supporting
    both modes can be used from either thread without penalty.


    # CALL STA OBJECTS FROM ASP.NET


    ASP.NET executes pages on MTA threads by default. If you call STA objects, they
    undergo marshaling. If you predominantly STA objects, this will degrade performance.
    You can remedy this by marking pages with the ASPCOMPAT attribute, as follows:


    ```

    <@Page Language="vb" AspCompat="true">

    ```


    Note that page constructors still execute in an MTA thread, so deferring STA objects
    to Page_Load and Page_Init events.


    # TLB Import and Code Access Security


    Code Access Security does the security check as P/Invoke. You can use the /unsafe
    switch with the tlbimp.exe utility which will emit the SuppressUnmanagedCodeSecurity
    attribute on generated types. Use this only in full-trust environments as this
    may introduce security issues.


    # NoPIA


    Prior to .NET Framework 4.0, you had to distribute inter assemblies or Primary
    Interop Assemblies (PIA) alongside your application or add-in. These assemblies
    need to be large (even more compared to the code that they use), and they are
    not typically installed by the vendor of the COM component; instead they are installed
    as redistributable packages, which are not required for the operation of the COM
    component itself. Another reason for not installing the PIA is that they have
    to be installed in the GAC, which imposes a .NET Framework dependency on the installer
    of an completely native application.


    Starting with .NET Framework 4.0, the C# and VB.NET compilers can examine COM
    interfaces and which methods within them are required, and can copy and embed
    only the required interface definitions into the caller assembly, eliminating
    the need to distribute PIA DLLs and reducing code size. Microsoft calls this feature
    NoPIA. It works both for Primary Interop Assemblies and for interop assemblies
    in general.'
