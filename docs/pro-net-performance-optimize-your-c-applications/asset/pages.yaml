    # Mark Phase


    In the *mark phase* of the tracing garbage collection cycle, the GC traverses
    the graph of all objects currently referenced by the application. To successfully
    traverse this graph and prevent *false positives* and *false negatives* (discussed
    in this chapter), the GC needs a set of starting points from which reference traversal
    can ensure. These starting points are termed *roots*, and as their names imply,
    they form the roots of the referenced graph that the GC builds.


    After establishing a set of roots, the garbage collector in the mark phase is
    relatively simple to understand. It considers each internal reference in each
    root, and proceeds to traverse the graph until referenced objects have been visited.
    Because reference cycles are allowed in .NET applications, the GC marks visited
    objects so each object is visited and only once—hence the name of the *mark phase*.


    # Local Roots


    One of the most obvious types of roots is *local variables*; a single local variable
    can form the root of an entire object graph referenced by an application. For
    example, consider the following code fragment within the application''s Main method
    that creates a *System.Xml.XmlDocument* object and proceeds to call its *Load*
    method:


    ```

    static void Main(string[] args) {

    XmlDocument doc = new XmlDocument();

    doc.Load("Data.xml");

    Console.WriteLine(doc.OuterXml);

    ```


    We do not exercise control over the garbage collector''s timing, and therefore
    must assume that a garbage collection might occur during the Load method call.
    If that happens, we would not like the XmlDocument object to be reclaimed—the
    local reference in the Main method is the root of the object graph that must be
    considered by the garbage collector. For every local variable that can potentially
    hold a reference to an object (i.e., every local variable of a reference type)
    can appear to be an active root until its method is on the stack.


    However, we do not need to maintain an active root until the end of its enclosing
    method. For example, after the object was loaded and displayed, we might want
    to introduce additional code within the same method that no longer requires the
    object to be kept in memory. This could take a long time to complete, and if a
    garbage collection occurs in the meantime, we would like the memory to be reclaimed.


    Does the .NET garbage collector provide this eager collection facility? Let''s
    examine the following code fragment, which creates a *System.Threading.Thread*
    and initializes it with a callback that induces a garbage collection by calling
    GC.Collect (we will examine this API later in detail):


    ```

    using System;

    using System.Threading;


    class Program {

    static void Main(string[] args) {

    Timer timer = new Timer(OnTimer, null, 0, 1000);

    Console.ReadLine();

    }

    ```


    95'
