  md: "# C++/CLI Language Extensions\n\nC++/CLI is a set of C++ language extensions,\
    \ which enables creating managed and unmanaged classes or functions even within\
    \ the .cpp file. You can use both managed as native and C++ types, as you would\
    \ in ordinary C++, i.e. by including a header and linking against the library.\
    \ These powerful capabilities can be used to construct wrapper types callable\
    \ from .NET as well as native wrappers and classes (as export, .lib and .h files)\
    \ which are called from native C++ code.\n\nMarshaling in C++/CLI is manual, and\
    \ the developer is in better and more aware of marshaling penalties. C++/CLI can\
    \ be successfully used in scenarios with P/Invoke cannot cope, such as marshaling\
    \ of variable-length structures. Another advantage to C++/CLI is that you can\
    \ simulate a chunky approach even if you do not control the caller's code, by\
    \ calling native methods repeatedly without crossing the managed–to native boundary\
    \ each time.\n\nIn the code listing, we implement a NativeEmployee class and an\
    \ Employee class, wrapping the former. Only the latter is accessible from managed\
    \ code.\nIf you look at the listing, the code demonstrates two techniques of managed\
    \ native conversion: one that allocates GlobalAlloc memory that needs to be explicitly\
    \ freed and one that pins the managed memory and returns a pointer. The latter\
    \ method is faster, but only works if the native code uses a UTF-16 null-terminated\
    \ string, and you can guarantee that no writes occur to the memory pointed to\
    \ by the pointer. Furthermore, pinning managed objects for a long time can lead\
    \ to memory fragmentation (Chapter 4), if such requirements are not satisfied,\
    \ you will have to resort to copying.\n\nEmployee's GetName shows three techniques\
    \ of native managed string conversion: one that uses the System::Interop::Marshal\
    \ class, one that uses the marshal_as template function (that we will discuss\
    \ later) which is defined in mcsr/marshal.h header file and finally one that uses\
    \ System::String's constructor, which is the fastest.\n\nThe DoWork method allocates\
    \ an unmanaged array or managed strings, and converts into an array of wchar_t\
    \ pointers, pointing to a string; in essence it's an array of C-style strings.\
    \ Managed to native conversions are done via the marshal_context* marshal_as.\
    \ In contrast to marshal_as global function, marshal_context is used for conversions\
    \ which require cleanup. Usually these are managed to unmanaged conversions that\
    \ allocate unmanaged memory during the call to marshal_as needs to be released\
    \ when it is no longer required. The marshal_context object contains a linked\
    \ list of cleanup operations that are executed when it is destroyed.\n\n```\n\
    #include <msclr/marshal.h>\n#include <string>\n#include <wchar.h>\n#include <time.h>\n\
