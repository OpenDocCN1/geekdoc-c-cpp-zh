  md: '# # Foreword


    The original Desktop .NET Framework 10 years old left recently (Feb 2012). I have
    been on the team since its inception, and for over half time I have acted as its
    performance architect, so that 10th birthday got me thinking about .NET has been,
    where it is, and what''s the ''right'' to think about .NET performance. The chance
    to write a foreword on a book dedicated to .NET performance gave me the opportunity
    to write these thoughts down.


    Programmer productivity has always been well and will always be the fundamental
    value of the .NET framework. Garbage collection (GC) is the single most important
    feature that boosts productivity, not because it avoids allows class libraries
    to be written without a broad class of nasty bugs (memory corruption), but also
    without "cluttered" with error-prone resource allocation conventions (no more
    passing buffers, or subtle rules who is responsible for deleting memory). Strong
    type safety (which includes Generics) is another important pillar because it captures
    a broad class of programmer intent and allows tools to find many bugs before the
    program is run. It enforces the lack of strong typing in languages like JavaScript
    will always place them at a disadvantage over software scale. On of these two
    pillars we built a class library that was designed for ease of use (very useful,
    simple interfaces, consistent naming conventions, etc.). I am proud of the result;
    we have built a system for building code whose productivity is second to none.


    Programmer productivity alone is not enough, however, especially for a mature
    piece of software like the .NET. We want high performance as well, and here is
    what this comes into


    The bad news is that in the same way that you can''t run your program correctly
    the very first time you run it, you cannot expect high performance to "just happen"
    the very first time your program runs correctly. In the same way that there are
    (GC and type safety) techniques (interfaces, interface contracts) that reduce
    the occurrence of software bugs, there are all (various profiles) and techniques
    (perf planning, hot path prototyping, lazy initialization) that reduce the likelihood
    of performance issues.


    The good news is that performance follows the 90%-10% of your application is not
    performance critical and can be written to master programmer productivity (the
    fewest, simplest, easiest lines of code possible). The other 10%, however, need
    careful attention. It needs a plan, and it needs it before the code is written.
    This is what Chapter 1 is about. To do that planning you need data (how fast are
    various operations, library calls, etc.). This is what Chapter 2 is. All these
    are about. These are the cornerstones of any high-performance software project.
    These chapters work well. If you take them to heart, you will write high-performance
    software.


    The rest of the book covers the details you need to "know your options" when you
    are building your performance plan. There is no substitute for a basic understanding
    of the performance characteristics of the platform you are using, and that is
    what Chapter 3 (types), Chapter 4 (GC), and Chapter 5 (fundamental libraries)
    are about. If your prototyping shows that a simple, straightforward, .NET implementation
    does not give you the performance you need, you should investigate algorithm improvement
    (Chapter 9) or concurrency (Chapter 6) because these are likely to have the biggest
    effect. If you still need perf, some .NET tricks (Chapter 10)'
