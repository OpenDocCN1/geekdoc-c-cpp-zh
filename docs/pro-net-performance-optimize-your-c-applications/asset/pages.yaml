  md: '# Unbuffered I/O


    Unbuffered I/O bypasses the Windows cache entirely. This has both benefits and
    drawbacks. Like with cache hinting, unbuffered I/O is enabled through the "flags
    and attributes" parameter during creation, .NET does not expose this functionality:


    +   - FILE_FLAG_NO_BUFFERING prevents the data read or written from being cached
    but has no effect on hardware caching by the disk controller. This avoids a memory
    copy (from user buffer to cache) and prevents cache pollution (filling the cache
    with useless data at the expense of more important data). However, reads and writes
    must obey alignment requirements. The following parameters must be aligned or
    have a size that is an integer multiple of the disk sector size: 512 byte transfer,
    file offset, and memory buffer address. Typically, the disk sector is 512 bytes
    long. High-capacity disk drives have 4096 bytes (known as "Advanced Format", but
    they can run in a compatibility mode that emulates 512 byte sectors (at the expense
    of performance).


    +   - FILE_FLAG_WRITE_THROUGH instructs the Cache Manager (if FILE_FLAG_NO_BUFFERING
    is not specified) instructs the disk controller to commit to physical media immediately,
    rather than storing in the hardware cache.


    Read-ahead improves performance by keeping the disk utilized, even if the application
    is synchronous, and has delays between reads. This depends on Windows correctly
    predicting what part of the file the application will request next. By buffering,
    you also disable read-ahead and could keep the disk busy by having multiple overlapped
    I/O operations.


    Write-behind also improves performance for applications making synchronous writes
    by giving the illusion that disk-writes finish very quickly. The application can
    better utilize the CPU, but it blocks for longer time. When you disable buffering,
    writes complete in the actual amount of time it takes to write them to disk. Therefore,
    doing asynchronous I/O becomes even more important when using unbuffered I/O.


    # Networking


    Network access is a fundamental capability in modern applications. Server applications
    that process requests strive to maximize scalability and their throughput to serve
    clients faster and to serve more clients per server, whereas clients minimize
    network latencies or to mitigate its effects. This section provides advice and
    tips for maximizing networking performance.


    # Network Protocols


    The way an application network protocol (OSI Layer 7) is constructed can have
    a profound influence on performance. This section explores optimization techniques
    to better utilize the available network capacity and to minimize overhead.


    # Pipelining


    In a non-pipelined protocol, a client sends a request to server and waits for
    the response before it can send the next request. With such a protocol, the network
    is under-utilized, during the network round-trip (i.e. time it takes packets to
    reach the server and back), the network is idle. In a pipelined connection, the
    client can continue to send more requests, even before the server has processed
    the previous requests. Better yet, the server can decide to respond to requests
    out of order, responding to trivial requests first, while deferring processing
    of more computationally-demanding requests.'
