  md: 'On the other hand, in some scenarios executing the garbage collection process
    concurrently with other application threads is of paramount importance. For example,
    consider a GUI application. If the garbage collection process is triggered on
    a background thread, we want to keep the UI responsive while the collection occurs.
    Even though the collection itself might take longer to complete (because the UI
    is competing for CPU resources with the GC), the user is going to be much happier
    because the application is more responsive. There are two categories of problems
    that arise:


    +   - False negatives: An object is considered alive even though it is eligible
    for garbage collection. This is an undesired effect, but if the object is going
    to be collected in the next cycle, you can live with the consequences.

    - False positives: An object is considered dead even though it is still referenced
    by the application. This is a debugging nightmare, and the garbage collector must
    do everything in its power to prevent this situation from happening.


    Let''s consider the two phases of garbage collection and see whether we can afford
    running application threads concurrently with the GC process. Note that whatever
    conclusions we reach, there are scenarios that will require pausing during the
    garbage collection. For example, if the process runs out of memory, it will be
    necessary to suspend threads gracefully while memory is being reclaimed. However,
    we will review exceptional scenarios, which account for the majority of the cases.


    # SUSPENDING THREADS FOR GC


    Suspending threads for garbage collection is performed at safe points. Not every
    set of instructions can be interrupted to perform a collection. The JIT emits
    additional information so that the suspension occurs when it''s safe to perform
    the collection, and the CLR tries to suspend threads gracefully—will not resort
    to a blatant SuspendThreadWin32 API without verifying that the thread is safe
    after suspension.


    In CLR 2.0, it was possible to come with a scenario where a managed thread in
    a very tight CPU-bound loop would pass safe points for a long time, causing delays
    up to 1500 milliseconds in GC startup (which, in turn, delayed any of the threads
    that were already waiting for GC). This problem was fixed in Sasha Goldstein''s
    post, "Garbage Collection Thread Suspension"


    [http://blog.sash.com/archive/2009/07/31/garbage-collection-thread-suspension-delay-250ms-multiples.aspx,2009].


    Note that unmanaged threads are not affected by thread suspension until they return
    to managed code—this is taken care by the P/Invoke transition.


    # Pausing Threads during the Mark Phase


    During the mark phase, the garbage collector''s work is almost read-only. False
    negatives and false positives can occur nonetheless.


    A newly created object can be considered dead by the collector even though it
    is referenced by the application. This is possible if the collector has already
    considered the part of the graph that is updated when the object is created (see
    Figure 4-7). This can be addressed by intercepting the creation of new references
    (and new objects) and making sure to mark them. It requires synchronization and
    increases the allocation cost, but allows other threads to execute concurrently
    with the collection process.'
