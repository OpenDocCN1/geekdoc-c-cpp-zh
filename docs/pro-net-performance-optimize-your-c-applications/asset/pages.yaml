    class (the System.Runtime.InteropServices.SafeHandle is a canonical example).
    This will ensure that only this small wrapping the unmanaged resource will survive
    an extra garbage collection, and the rest of your object can be destroyed when
    the object is no longer referenced.


    # Miscellaneous Tips and Best Practices


    In this section, we will briefly examine best practices and performance tips that
    do not belong to any major section discussed in this chapter.


    # Value Types


    When possible, prefer value types to reference types. We have examined the various
    traits of value types and reference types from a general perspective in Chapter
    3. Additionally, value types have several characteristics that affect garbage
    collection cost in the application:


    +   - Value types have the most negative allocation cost when used as local stack
    variables. This allocation is associated with the extension of the stack frame,
    which is created whenever a method is entered.


    +   - Value types used as local stack variables have no deallocation (garbage
    collection) cost—they are deallocated when the method returns and its stack frame
    is destroyed.


    +   - Value types embedded in reference types minimize the cost of both phases
    of garbage collection: if objects are large, there are fewer objects to mark,
    and if objects are larger, the sweep phase copies more memory at each time, which
    reduces the overhead of copying many small objects around.


    +   - Value types reduce the application''s memory footprint because they occupy
    memory. Additionally, when embedded inside a reference type, they do not require
    a reference in order to access them, eliminating the need to store an additional
    reference. Finally, value types embedded in reference types exhibit locality of
    access—if the object is paged in and hot in cache, this embedded value type fields
    are also likely to be paged and hot in cache.


    +   - Value types reduce references between generations, because fewer references
    are introduced into the object graph.


    # Object Graphs


    Reducing the size of the object graph directly affects the amount of work the
    garbage collector has to perform. A simple graph of large objects is faster to
    mark and sweep than a complex graph of many small objects. We have mentioned a
    specific scenario of this earlier.'
