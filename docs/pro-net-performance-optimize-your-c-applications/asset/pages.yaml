  md: "# CHAPTER 8\n\n# # Unsafe Code\n Interoperability\n\nFew real-world applications\
    \ are composed strictly of managed code. Instead, they frequently make use of\
    \ in-house or 3rd party libraries implemented in native code. The .NET Framework\
    \ offers several mechanisms to operate with native code that is implemented in\
    \ a number of widespread technologies:\n\n+   * P/Invoke: enables interoperability\
    \ with DLLs exporting C-style functions.\n* COM Interop: enables consumption of\
    \ COM objects by managed code as well as exposing NET classes as COM objects to\
    \ be consumed by native code.\n* C++/CLI language: enables interoperability with\
    \ C and C++ via a hybrid programming language.\n\nIn fact, the Base Class Library\
    \ (BCL), which is the set of DLLs shipped with the .NET Framework (mscor.dll being\
    \ the main one) that contain. .NET Framework's built-in types, uses all of the\
    \ aforementioned mechanisms. It can therefore be argued that any non-trivial managed\
    \ application is actually a hybrid application under the covers, in the sense\
    \ that it calls native libraries.\nWhile these mechanisms are very useful, it\
    \ is important to understand the performance implications associated with each\
    \ interp mechanism, and how to minimise their impact.\n\n# # Unsafe Code\n\nManaged\
    \ code offers type safety, memory safety, and security guarantees, which eliminate\
    \ some of the most difficult to diagnose bugs and security vulnerabilities prevalent\
    \ in native code, such as heapions and buffer overflows. This is made possible\
    \ by forbidding direct memory access with pointers, instead working with strongly-typed\
    \ references, checking array boundaries and ensuring only legal access of objects.\n\
    However, in some cases these complicate simple tasks and reduce performance by\
    \ forcing you to use a safe alternative. For example, one might read data from\
    \ a file to a byte[] but would like to interpret this data as an array of double[]\
    \ values. In C/C++, you would simply cast the char pointer to a double pointer.\
    \ In contrast, in .NET code, you could wrap the buffer with a MemoryStream object\
    \ and use a BinaryReader to read each memory location as double values; another\
    \ option is to use the BitConverter class. These solutions would work, but they\
    \ are slower than doing in this unmanaged code. Fortunately, C# and the CLR support\
    \ unsafe memory access with pointers and casting. Other unsafe features support\
    \ memory allocation and embedded arrays within structures. The downside of unsafe\
    \ code is compromised safety, which can lead to memory corruptions and security\
    \ vulnerabilities, so you should be careful when writing unsafe code.\n\n235"
