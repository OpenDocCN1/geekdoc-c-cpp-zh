  md: 'Some metrics are more relevant to certain application types than others. For
    example, database access times are not a metric you can measure on a client system.
    Some common combinations of performance metrics and application types include:


    +   - For client applications, you might focus on startup time, memory usage,
    and CPU utilization.

    - Server applications hosting the system''s algorithms, you usually focus on CPU
    utilization, cache misses, contentions, allocations, and garbage collections.

    - For Web applications, you typically measure memory usage, database access, network
    and disk operations, and response time.


    A first observation about performance metrics is that at the level which they
    are measured often be changed without significantly changing the metric''s meaning.
    For example, allocation and execution time can be measured at the system level,
    the single process level, or even for individuals and methods. Execution time
    within a single method can be a more actionable performance metric than CPU utilization
    or execution time at the process level. Unfortunately, increasing the granularity
    of measurements often incurs a performance overhead, as we illustrate in the next
    chapter by discussing various profiling tools.


    # PERFORMANCE IN THE SOFTWARE DEVELOPMENT LIFECYCLE


    Where do you fit in the software development lifecycle? This innocent question
    carries the baggage of having retrofit performance into an existing process. Although
    it is possible, a healthier approach is to consider every step of the development
    lifecycle an opportunity to understand the application''s performance better:
    first, the performance goals and important metrics; next, whether the application
    meets or exceeds its goals; and finally, maintenance, user loads, and requirement
    introduce any regressions.


    +   - During the requirements gathering phase, start thinking about the performance
    goals you would like to set.

    - During the architecture phase, refine the performance metrics important for
    your application and define concrete performance goals.

    - During the development phase, frequently perform exploratory testing on prototype
    code or partially complete features to verify that you are well within the system''s
    performance goals.

    - During the testing phase, perform significant load testing and testing to validate
    completely your system''s performance goals.

    - During subsequent development and maintenance, perform additional load testing
    and testing with every release (preferably on a daily or weekly basis) to quickly
    identify any regressions introduced into the system.


    Taking the time to develop a suite of automatic load tests and performance tests,
    set up an isolated lab environment in which to run them, and analyze their results
    carefully to make sure no regressions introduced is very time-consuming. Nevertheless,
    the performance benefits gained from systematically measuring and improving performance
    and making sure regressions do not creep slowly into the system is worth the initial
    investment in having a robust performance development process.'
  merge: -1
