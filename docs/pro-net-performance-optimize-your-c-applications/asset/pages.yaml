  md: '# Pausing Threads during the Sweep Phase


    During the sweep phase, not only do references change, but objects move around
    in memory. This poses a set of problems for application threads executing concurrently.
    Among these problems:


    +   - Copying an object is not an atomic operation. This means that after part
    of the object has been copied, the original is still being modified by the application.

    - Updating references to the object is not an atomic operation. This means that
    some parts of the application might be using the old object reference and some
    parts might be using the new.


    Addressing these problems is possible (Azuluseless GC for JVM, http://www.azulsystems.com/zing/pgc,
    one example), but has not been done in the CLR GC. It is simpler to declare that
    the sweep phase does not support application threads concurrently with the garbage
    collector.


    > Tip To determine whether GC can provide any benefit for your application, you
    must first determine how much time it spends performing garbage collection. If
    your application spends 50% of its time reclaiming memory, there remains plenty
    of room for optimization. On the other hand, if you only perform a collection
    in a few minutes, you should probably stick to whatever works for you and pursue
    significant optimizations elsewhere. You can find out how much time you''re spending
    garbage collection through the % Time in GC performance counter in the .NET CLR
    Memory performance category.


    Now that we''ve reviewed how application threads might behave while a garbage
    collection is in progress, we can examine the various GC flavors in greater detail.


    # Workstation GC


    The first GC flavor we will look into is the workstation GC. It is further divided
    into two sub-flavors: concurrent workstation GC and non-concurrent workstation
    GC.


    Under workstation GC, there is a single thread that performs the garbage collection—the
    garbage collection does not run in parallel. Note that there is a difference between
    running the collection process itself in parallel and running the collection process
    concurrently with other application threads.


    # Concurrent Workstation GC


    The concurrent workstation GC flavor is the default flavor. Under concurrent workstation
    GC, there is a separate dedicated GC thread marked with THREAD_PRIORITY_HIGHEST
    that executes the collection from start to finish. Moreover, the CLR can detect
    that it wants some parts of the garbage collection to run concurrently with application
    threads (mark phase we have seen above). Note that the decision is still up to
    the CLR—as we will see later, some collections are fast enough to warrant suspension,
    as generation 0 collections. When the sweep phase is performed, all application
    threads are suspended.


    The responsiveness of using the concurrent workstation GC can be hampered if the
