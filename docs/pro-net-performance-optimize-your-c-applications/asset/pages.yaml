    \ it and requires no boxing for value types). Even the internal storage — the\
    \ items array — adapts itself accordingly to the generic type: when T is Point2D,\
    \ the items array is Point2D[], stores values and no references. We will unfold\
    \ some of this magic later, but for now we have an language-level solution for\
    \ the basic problem of generic programming.\n\nThis solution alone appears to\
    \ be insufficient when we need some additional capabilities from the generic parameters.\
    \ Consider a method that performs a binary search in a sorted array. A completely\
    \ generic version of it would not be capable of doing the search, because System.Object\
    \ is not equipped with any comparison-related facilities:\n\n```\npublic static\
    \ int BinarySearch<T>(T[] array, T element) {\n// At some point in the algorithm,\
    \ we need to compare:\n  if (array[x] < array[y]) {\n    ...\n  }\n}\n```\n\n\
    System.Object does not have a static operator <, which is why this simply fails\
    \ to compile. Indeed, we have to prove to the compiler that for every generic\
    \ type we provide to the method, it will be able to resolve all method calls (including\
    \ operators) on this. This is where generic constraints enter the picture.\n\n\
    # Generic Constraints\n\nGeneric constraints indicate to the compiler that some\
    \ types are allowed as generic type arguments using a generic type. There are\
    \ five types of constraints:\n\n```\n// T must implement an interface:\npublic\
    \ interface T : IFormattable {\npublic string Format(T instance) {\n  return instance.ToString(\"\
    N\", CultureInfo.CurrentUI);\n}\n//OK, T must have IFormattable.ToString(string,\
    \ IProvider)\n```\n\n```\n// T must derive from a base class:\npublic void Display<T>(T\
    \ widget) where T : Widget {\n  widget.Display(0, 0);\n}\n//OK, T derives from\
    \ Widget which has the Display(int, int) method\n```\n\n```\n// T must have a\
    \ parameterless constructor:\npublic T Create<T>() where T : new() {\nreturn new\
    \ T();\n}\n//OK, T has a parameterless constructor\n//The C# compiler compiles\
    \ 'new T()' to a call to Activator.CreateInstance<T>(),\n//which is sub-optimal,\
    \ but there is no IL equivalent for this constraint\n```\n\n```\n// T must be\
    \ a reference type:\npublic void ReferencesOnly<T>(T reference) where T : class\n\
    ```\n\n```\n// T must be a value type:\npublic void ValuesOnly<T>(T value) where\
    \ T : struct\n```\n\nIf we revisit the binary search example, the interface constraint\
    \ proves to be very useful (and, it is the most often used kind of constraint).\
    \ Specifically, we can require T to implement IComparable, and compare array elements\
    \ using the IComparable.CompareTo method. However, IComparable is not a generic\
    \ interface, and\n\n149"
