  md: '+   Use compression for highly compressible data, such as text. Avoid it for
    uncompressible data, such as already-compressed video, images, and audio.


    # # Network Sockets


    The sockets API is the standard for applications to work with network protocols,
    such as TCP and UDP. Originally, the sockets API was introduced in the BSD UNIX
    operating system and became standard in virtually all operating systems, with
    proprietary extensions, such as Microsoft’s WinSock. There are a number of ways
    for doing socket I/o in Windows: blocking, non-blocking with polling, and asynchronous.
    The right I/O model and socket parameters enable higher throughput, lower latency,
    and better scalability. This section outlines performance optimization pertaining
    to Windows Sockets.


    # # Asynchronous Sockets


    .NET supports asynchronous I/O through the Socket class. However, there are two
    families of asynchronous APIs: BegXXX and XXXAsync, where XXX stands for Accept,
    Connect, Receive, Send, and other. The former one uses .NET Thread Pool’s registered
    callback to wait for overlapped I/O completion, whereas the latter use .NET Thread
    Pool’s I/O Completion mechanism, which is more performant and scalable. The later
    APIs were introduced in .NET Framework 2.0 SP1.


    # # Socket Buffers


    Socket objects expose two buffer sizes: ReceiveBufferSize and SendBufferSize,
    which specify buffer sizes allocated by the TCP/IP stack (OS memory space). Both
    are set to 8,192 bytes by default. The receive buffer is used to hold receive
    data not yet read by the application. The send buffer is used to hold data that
    has not yet been acknowledged by the receiver. The receiver needs to retransmit
    data, from the send buffer is retransmitted.


    When the application reads from the socket, it unfills the receive buffer by the
    amount read. When the receive buffer becomes empty, the call either blocks or
    becomes pending, depending if synchronous or asynchronous I/O is used.


    For high-bandwidth, high latency connections, such as satellite links, buffer
    sizes may be too small. Sending quickly fills its send buffer and has to wait
    for acknowledgment, which leads to arrival of high latency. While waiting, the
    pipe is not kept full the endpoints only utilize a fraction of the available bandwidth.


    In a perfectly reliable network, the ideal buffer size is the product of the bandwidth
    and latency. For example, in a 100Mbps connection with a 5 ms round-trip time,
    an ideal buffer window size would be (100,000,000 / 8) = 62,500 bytes. Packet
    loss reduces this value.


    # # Nagle’s Algorithm


    As mentioned before, small packets are wasteful, because packet headers may be
    large compared to the payload. Nagle’s algorithm improves performance of TCP by
    coalescing multiple writes to the application into a whole packet’s worth of data.
    However, this service does not come for free as it introduces delay before data
    sent. A latency sensitive application should disable Nagle’s algorithm by setting
    the Socket.NoDelay property to true. A well-written application would send large
    buffers at a time and would not benefit from Nagle’s algorithm.'
