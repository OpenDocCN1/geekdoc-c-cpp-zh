  md: 'Tip The sample application used to generate Figures 2-12 and 2-15 is not entirely
    CPU-bound; in fact, most of its time is spent blocking for I/O operations to complete.
    This explains the difference between sampling results, which point towards System.String.Concat
    as the CPU head, and the instrumentation results, which point towards JackCompiler.Tokenizer.NextChar
    as the overall performance bottleneck.


    Although instrumentation seems the more accurate method, in practice you should
    try to keep sampling if most of your application''s code is CPU-bound. Instrumentation
    limits flexibility because you must instrument the code prior to launching it
    and cannot attach to a process that is already running. Instrumentation has a
    non-negligible overhead—it increases code size significantly and places a runtime
    overhead as probes are collected whenever a process exits. Method instrumentation
    follows a line-instrumentation mode, where each line is surrounded by instrumentation
    probes, making it even slower.


    As always, the biggest risk is placing too much trust in an instrumentation profile.
    It is reasonable to assume that the number of calls to a particular method does
    not change the behavior of running with instrumentation, but the time collected
    may be significantly skewed because of the profiler''s overhead, despite any the
    profiler to offset the instrumentation costs from the final results. When used
    carefully, sampling and instrumentation can offer great insight into where the
    application is spending time, especially when comparing multiple reports and take
    note whether your optimizations are yielding fruit.


    # Advanced Uses of Time Profilers


    Time profilers have additional tricks up their sleeves that we haven''t examined
    in the previous sections. This chapter is too short to discuss them in considerable
    detail, but they are worth pointing out to make sure you don''t miss them in the
    comforts of Visual Studio''s wizards.


    # Sampling Tips


    As we saw in the Visual Studio Sampling Profiler section, the sampling profiler
    can collect samples from several types of events, including cache misses and page
    faults. In Chapters 5 and 6 we will see examples of applications that can benefit
    from improving their memory access characteristics, primarily minimizing cache
    misses. The profiler will prove valuable in analyzing the number of cache and
    page faults exhibited by these applications and their precise locations in code.
    (When using instrumentation, you can still collect CPU counters such as cache
    misses, instructions retired, and mispredicted branches. To do so, open the performance
    session properties from the Performance Explorer pane, and navigate to the CPU
    Counters. The collected information will be available as additional columns in
    the Functions view.)


    The sampling profiling mode is generally more flexible than instrumentation. For
    example, you can use the Performance Explorer to attach the profiler (in sampling
    mode) to a process that is already running.


    # Collecting Additional Data While Profiling


    In all profiling sessions, you can use the Performance Explorer pane to pause
    and resume the data collection when the profiler is active, and to generate markers
    that will be visible in the final profiler report to discern more easily various
    parts of the application''s execution. These markers will be visible in the report''s
    Marks view.'
