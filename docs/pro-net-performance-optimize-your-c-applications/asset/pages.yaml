  md: '# Table 2-1. Partial List of ETW Events in Windows and the CLR


    | Provider | Flag / Keyword | Description | Events (Partial List) |

    | --- | --- | --- | --- |

    | Kernel | PROC_THREAD | Creation and destruction of processes and threads | --
    |

    | Kernel | LOADER | Load and unload of images (DLLs, drivers, EXEs) | -- |

    | Kernel | SYSCALL | System calls | -- |

    | Kernel | DISK_IO | Disk I/O reads and writes (including head location) | --
    |

    | Kernel | HARD_FAULTS | Page faults resulted in disk I/O (not satisfied from
    memory) | -- |

    | Kernel | PROFILE | Sampling event–a stack trace of all processors collected
    every 1ms | Collection started, collection ended, finalizers, –100KB of memory
    have been allocated |

    | CLR | GCKeyword | Garbage collection statistics and information | -- |

    | CLR | ContentionKeyword | Threads contended for a lock | Contention starts (a
    thread beginning), contention ends |

    | CLR | JITTracingKeyword | Just in time compiler (JIT) information | Method inlining
    succeeded, method inlining failed |

    | CLR | ExceptionKeyword | Exceptions that are thrown | --


    Accessing this detailed information requires an ETW collection tool and an application
    that can read raw events and perform basic analysis. At the time of writing, there
    were two tools capable of both tasks: Windows Performance Toolkit (WPT, also known
    as XPerf), which ships with the Windows SDK, and PerfMonitor (do not confuse with
    Windows Performance Monitor!), which is an open source project by the CLR at Microsoft.


    # Windows Performance Toolkit (WPT)


    Windows Performance Toolkit (WPT) is a set of utilities for controlling ETW sessions,
    capturing ETW events into log files, and processing them for later day. It can
    generate graphs and overlays of ETW events, summary tables including call stack
    information, and CSV files for automated processing. Download the Windows SDK
    installer from http://msdn.microsoft.com/en-us/performance/cc75297.aspx and select
    only Common Utilities Windows Performance Toolkit from the installation options
    screen. After the SDK installer completes, navigate to the Redist\Windows Performance
    Toolkit subdirectory of the SDK installation directory and run the installer for
    your system''s architecture (Xperf_x86.msi for 32-bit systems, Xperf_x64.msi for
    64-bit systems).'
