    +   - CPU Statistics—CPU time consumed was 917ms and the average CPU utilization
    was 56.6%.

    - GC Statistics—the total GC time was 20ms, the maximum GC heap was 4.5MB, the
    maximum allocation rate was 1496MB/s, and the average GC pause was 0.1ms.

    - JIT Compilation Statistics—159 methods were compiled by the JIT compiler, for
    a total of 30493 bytes of machine code.


    Drilling down to the CPU, GC, and JIT reports can provide a wealth of useful information.
    The CPU detailed report information on methods that use a large percentage of
    CPU time (bottom up analysis), a tree of where CPU time is spent (top down analysis),
    and caller-caller views for each method in the trace. To prevent the report from
    growing large, methods that do not exceed a defined relevance threshold (1% for
    the top up analysis and 5% for the top down analysis) are excluded. Figure 2-7
