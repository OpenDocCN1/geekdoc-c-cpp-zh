  md: '# About the Authors


    Sasha Goldsstein is a Microsoft Visual C# MVP, and the CTO of SELA Group. Sasha
    leads the Performance and Debugging team in the SELA Technology Center, and consults
    on various topics including production debugging, application performance troubleshooting,
    and distributed architecture. Most of Sasha’s experience is in C# and C++ application
    development, as well as high-scalability and high-performance system architecture.
    He is a frequent speaker at Microsoft conferences, and the author of multiple
    training courses: "NET Performance", "NET Debugging", "Windows Internals", and
    many others.

