    from multiple threads is unsafe, and will result in data corruption, as taking
    a lock every time we add a number to the collection (which is what the naive solution
    does) will prove to be extremely expensive and throttle our ability to scale the
    algorithm to a further increasing number of processing cores.

    - For a small range of numbers, is it worthwhile to spawn new threads, or perhaps
    it would be a better idea to execute the entire operation synchronously on a single
    thread? (Creating and destroying a thread is cheap on Windows, but not as cheap
    as finding out whether 20 numbers are prime or composite?).

