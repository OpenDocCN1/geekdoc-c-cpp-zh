    # .NET Implementation of Generations


    In the generational model, the garbage collection is partitioned into three regions:
    generation 0, generation 1, and generation 2. These regions reflect the projected
    expectancy of the objects they contain: generation 0 contains the youngest objects,
    and generation 2 contains old objects that have survived for a while.


    # Generation 0


    Generation 0 is the playground for all new objects (later in this section we will
    see that objects are also partitioned by size, which makes this statement only
    partially correct). It is very small, and cannot accommodate all the memory usage
    of the smallest of objects. Generation 0 usually starts with a budget between
    256 KB-4 MB and might slightly tight if it needs.


    > Note from OS, L2 and L3 cache sizes also affect the size of generation 0, because
    the primary objective of this generation is to contain objects that are frequently
    accessed and are accessed, for a short period of time. It is also controlled dynamically
    by the garbage collector at runtime, and can be controlled by application startup
    by a CLR host setting the GC startup limits. The budget for both generation 0
    and generation 1 together cannot exceed the size of a single segment (discussed
    later).


    When a allocation request cannot be satisfied from generation 0 because it is,
    a garbage collection is initiated within generation 0. In this process, the garbage
    collector touches only those objects which belong in generation 0 during the mark
    and sweep phases. This is not trivial to achieve because there is no prior correlation
    between roots and generations, and there is always the possibility of an object
    outside generation 0 referencing an object inside generation 0. We will examine
    this difficulty shortly.


    A garbage collection within generation 0 is a very cheap and efficient process
    for several reasons:


    +   - Generation 0 is very small and does not contain many objects. Traversing
    such a small amount of memory takes very little time. On one of our test machines,
    performing a generation 0 collection with 2% of the objects taking approximately
    70 μs (microseconds).

