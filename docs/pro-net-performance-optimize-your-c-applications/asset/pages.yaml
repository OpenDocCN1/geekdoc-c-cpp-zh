  md: '# CHAPTER 9


    # Algorithm Optimization


    At the heart of some applications lie specialized algorithms designed for a specific
    domain and based on assumptions that do not hold universally. Other applications
    rely on well-tested algorithms that fit many domains and have been relevant for
    decades in the entire field of computer software. We believe that every developer
    can benefit and gain insight from some of the crown jewels of algorithms, as well
    as the algorithm categories on which software frameworks are based. Although some
    parts of this chapter might be difficult if you do not have a strong mathematical
    background, they are well worth the effort.


    This chapter gently brushes against the pillars of computer science and reviews
    several examples of immortal algorithms and their complexity analysis. Supplied
    with these examples, you should feel more comfortable using algorithms, adapting
    them to your needs, and inventing your own.


    > Note This is not a textbook on algorithms research, nor an introductory text
    to the most important algorithms in modern computer science. This chapter is deliberately
    short to make it explicit that you cannot learn from all you need to know. We
    have not delved into formal definitions in any detail. For example, our treatment
    of Turing machines and languages is not at all rigorous. For a textbook introduction
    to algorithms, consider Cormen, Leiserson, Rivest, and Stein’s “Introduction to
    Algorithms” (MIT Press, 2001) and Dasgupta, Papadimitriou, and Vazirani’s “Algorithms”
    (soon to appear, currently available online as a draft).


    # Taxonomy of Complexity


    Chapter 5 had the chance to briefly mention the complexity of some operations
    on the .NET Framework''s collections and some collections of our own implementation.
    This section defines more what Big-Oh complexity means and reviews the main complexity
    classes known in computability and complexity theory.


    # Big-Oh Notation


