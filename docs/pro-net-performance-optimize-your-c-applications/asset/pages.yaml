  md: "# Single Instruction Multiple Data (SIMD)\n\nData-level parallelism, also known\
    \ as Single Instruction Multiple Data (SIMD), is a feature of modern processors\
    \ that enables the execution of a single instruction on a large set of data (larger\
    \ than the machine word). The de-facto standard for SIMD instruction sets is SSE\
    \ (Streaming SIMD Extensions), used by Intel processors since Pentium III. This\
    \ instruction added new 128-bit registers (with the XMM prefix) as well as instructions\
    \ that can operate on them. Intel processors introduced Advanced Vector Extensions\
    \ (AVX), which is an extension of SSE that offers 256-bit registers and even more\
    \ SIMD instructions. Some examples of SSE instructions include:\n\n+   - Integer\
    \ and floating-point arithmetic\n- Comparisons, shuffling, data type conversion\
    \ (integer to floating-point)\n- Bitwise operations\n- Minimum, maximum, conditional\
    \ copies, CRC32, population count (introduced in SSE4 and later)\n\nYou might\
    \ be wondering whether instructions operating on these \"new\" registers are slower\
    \ than their standard counterparts. If that were the case, any performance gains\
    \ would be deceiving. Fortunately, that is not the case. On Intel i7 processors,\
    \ a floating-point addition (FADD) instruction on 32-bit registers has throughput\
    \ of one instruction per cycle and latency of 3 cycles. The equivalent instruction\
    \ ADDPS on 128-bit registers also has throughput of one instruction per cycle\
    \ and latency of 3 cycles.\n\n# LATENCY AND THROUGHPUT\n\nLatency and throughput\
    \ are common terms in general performance measurements, but especially so when\
    \ discussing the \"speed\" of processor instructions:\n\n+   - An instruction's\
    \ latency is the time (usually measured in clock cycles) it takes to execute one\
    \ instance of the instruction from start to finish.\n- An instruction's throughput\
    \ is the number of instructions of the same type that can be executed in a unit\
    \ of time (usually measured in clock cycles).\n\nIf we say that FADD has latency\
    \ of 3 cycles, it means that a single FADD operation will take 3 cycles to complete.\
    \ If we say that FADD has throughput of one instruction per cycle, it means that\
    \ the processor is able to sustain an execution rate of one instruction per cycle,\
    \ which will require three of these instructions to execute concurrently.\n\n\
    Very often, an instruction's throughput is significantly better than its latency\
    \ because processors can issue and execute multiple instructions in parallel (we\
    \ will return to this later).\n\nUsing these instructions in high-performance\
    \ loops can provide up to 8x performance gains compared to naive sequential programs\
    \ that operate on a single floating-point or integer value at a time. For example,\
    \ consider the following (adrivially trivial) code:\n\n```\n// Assume that A,\
    \ B, C are equal-size float arrays\nfor (int i=0; i<A.length; i++) {\n  C[i]=A[i]+B[i];\n\
    }\n```"
