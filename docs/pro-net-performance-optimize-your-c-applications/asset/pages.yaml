    } else {\n    expectedMTP = obj->MTP;\n    goto start;\n}\n```\n\nFor more details\
    \ on interface method dispatch, consider Sasha Goldsteins' article \"JIT Optimizations](http://www.codepject.com/Articles/2581/JIT-Optimizations)\
    \ and Vance Morrison's blog post (http://blogs.msdn.com/b/vancem/archive/2006/03/13/55029.aspx).\
    \ Interface method dispatch is a moving target and ripe for optimization; future\
    \ CLR versions might introduce further optimizations not discussed.\n\n# Sync\
    \ Blocks And The lock keyword\n\nThe second header embedded in each reference\
    \ type instance is the object header (or sync block index). Unlike the method\
    \ table pointer, this is used for a variety of purposes, including synchronization,\
    \ GC book-keeping, finalization, and hash code storage. Several bits of this field\
    \ determine exactly which information is stored in it at any instant time.\n\n\
    The most complex part for which the object header is used is synchronization with\
    \ the CLR monitor mechanism, exposed to C# through the lock keyword. The gist\
    \ is as follows: several threads may attempt to enter a region of code protected\
    \ by the lock statement, but only one thread at a time may enter the region, achieving\
    \ mutual exclusion:\n\n```\nclass Counter\n{\n    private int _i;\n    private\
    \ object _syncObject = new object();\n    public int Increment()\n    {\n    \
    \    lock (_syncObject)\n        {\n            return ++_i; // one thread at\
    \ a time can execute this statement\n        }\n    }\n}\n```\n\nThe lock keyword,\
    \ however, is merely syntactic sugar that wraps the following construct, using\
    \ the Monitor and Monitor. Exit methods:"
