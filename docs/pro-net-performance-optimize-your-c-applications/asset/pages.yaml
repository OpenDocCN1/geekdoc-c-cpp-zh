  md: "# CHAPTER 2 PERFORMANCE MEASUREMENT\n\n# Custom Performance Counters\n\nAlthough\
    \ Performance Monitor is an extremely useful tool, you can read performance counters\
    \ from any .NET application using the System.Diagnostics.PerformanceCounter class.\
    \ Even, you can create your own performance counters and add them to the set of\
    \ data available for performance investigation.\nBelow are some scenarios in which\
    \ you should consider exporting performance counters:\n\n+   - You are developing\
    \ an infrastructure library to be used by large parts of systems. Your library\
    \ can report performance information through performance counters, which is often\
    \ easier on developers and system administrators through log files or debugging\
    \ at the code level.\n\n+   - You are developing a server system which accepts\
    \ counter requests, processes them, and delivers responses (custom Web server,\
    \ Web service, etc.). You should report performance information for the request\
    \ processing rate, errors encountered, and similar statistics. (The ASP.NET performance\
    \ counter categories for some ideas).\n\n+   - You are developing a high-reliability\
    \ Windows service that runs unattended and communicates with custom hardware.\
    \ Your service can report the health of the hardware, the rate of your software's\
    \ interactions with it, and similar statistics.\n\nThe following code is all it\
    \ takes to export a single-instance performance counter from a category and update\
    \ these counters. It assumes the AttendanceClass has information on the number\
    \ of employees currently signed in, and you want to expose this information as\
    \ a performance counter. (You will need to use the System.Diagnostics namespace\
    \ to compile this code fragment).\n\n```\npublic static void CreateCounter() {\n\
    \    if (PerformanceCounterCategory.Exists(\"Attendance\")) {\n        PerformanceCounterCategory.Delete(\"\
    Attendance\");\n    }\nnCounterCreationDataCollection counters=new CounterCreationDataCollection();\n\
    CounterCreationData employeesAtWork=new CounterCreationData(\n    \"Employees\
    \ at Work\", \"The number of employees currently checked in.\",\n    PerformanceCounterType.NumberofItems32);\n\
    PerformanceCounterCategory.Create(\n    \"Attendance\", \"Attendance information\
    \ for Litware, Inc.\",\n    PerformanceCounterCategoryType.SingleInstance, counters);\n\
    }\npublic static void StartUpdatingCounters() {\n    PerformanceCounter employeesAtWork=new\
    \ PerformanceCounter(\n        \"Attendance\", \"Employees at Work\", ReadOnly:false);\n\
    \    updateTimer=new Timer((s, e) => {\n        employeesAtWork.RawValue=AttendanceSystem.Current.EmployeeCount;\n\
    \    }, null, TimeSpan.Zero, TimeSpan.FromSeconds(1));\n}\n```\n\nAs we have seen,\
    \ it takes very little effort to configure custom performance counters, and they\
    \ can be of utmost importance when carrying out a performance investigation. Correlating\
    \ system performance counter data with custom performance counters is often all\
    \ a performance investigator needs to pinpoint the precise cause of a performance\
    \ or configuration issue.\n\n2"
