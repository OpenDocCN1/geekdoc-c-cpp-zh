  md: "# CHAPTER 6 CONCURRENCY AND PARALLELISM\n\nthe sequential version ran (on our\
    \ test system) for -250 ms and the parallelized version took nearly -650 ms to\n\
    complete on average!\n\nThe problem is that parallelism needs to be sufficiently\
    \ coarse-grained; attempting to parallelize the sorting of a three-element array\
    \ is futile, because the overhead introduced by creating Task objects, scheduling\
    \ work\nitems to the thread pool, and waiting for them to complete execution overwhelms\
    \ the handful of\ncomparison operations required.\n\n# Throttling Parallelism\
    \ in Recursive Algorithms\n\nHow do you propose to throttle the parallelism to\
    \ prevent this from diminishing any returns from our\noptimization? There are\
    \ several viable approaches:\n\n+   - Use the parallel version as long as the\
    \ size of the array to be sorted is bigger than a certain  threshold (say, 500\
    \ items), and switch to the sequential version as soon as it is smaller.\n- Use\
    \ the parallel version as long as the recursion depth is smaller than a certain\
    \ threshold,\nand switch to the sequential version as soon as the recursion is\
    \ very deep. (This option is\nsewhat inferior to the previous one, unless the\
    \ pivot is already positioned exactly in\nmiddle of the array).\n- Use the parallel\
    \ version as long as the number of outstanding tasks (which the method\nhave to\
    \ maintain manually) is smaller than a certain threshold, and switch to the\n\
    sequential version otherwise. (This is the only option when there are no other\
    \ criteria for\nlimiting parallelism, such as recursion depth or input size.)\n\
    \nIndeed, in the case above, limiting the parallelism for arrays larger than 500\
    \ elements produces\nexcellent results on the author's Intel i7 processor, yielding\
    \ a 4x improvement in execution time compared to\nt sequential version. The code\
    \ changes are quite simple, although the threshold should not be hardcoded in\
    \ a\nproduction-quality implementation:\n\n```\nprivate static void QuickSort<T>(T[]\
    \ items, int left, int right) where T : IComparable<T> {\n  if (right - left <\
    \ 2) return;\n  int pivot = Partition(items, left, right);\n  if (right - left\
    \ > 500) {\n    Parallel.Invoke(\n      () => QuickSort(items, left, pivot),\n\
    \      () => QuickSort(items, pivot+1, right)\n    );\n  } else {\n    QuickSort(items,\
    \ left, pivot);\n    QuickSort(items, pivot+1, right);\n  }\n}\n```\n\n# More\
    \ Examples of Recursive Decomposition\n\nThere are many additional algorithms\
    \ that can be parallelized by applying similar recursive decomposition. In\nfact,\
