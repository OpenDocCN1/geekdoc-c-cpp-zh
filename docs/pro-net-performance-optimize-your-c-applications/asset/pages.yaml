  md: '# Optimizing the Network


    Even if you write code that runs fast and you have a hosting environment that
    has a high throughput, still one of the most problematic bottlenecks is the bandwidth
    of your connection and the amount of requests that the client passes through the
    network. There are several techniques that can help reduce the number of requests
    and the size of the responses, some of them are configuring IIS, while others
    require some attention to the application''s code.


    # Apply HTTP Caching Headers


    One of the ways to conserve bandwidth is to make sure that all the content that
    is not going to change for some time will be cached in the browser. Static content,
    such as images, scripts, and CSS files are good candidates for browser cache,
    also dynamic content as .aspx and .xlsx files can be cached if the content is
    not updated often.


    # Setting Cache Headers for Static Content


    Static files are usually sent back to the client with two headers:


    +   * ETag. This header is set by IIS with a calculated hash, based on the last
    modification date of the requested content. For static content, such as images
    and CSS files, IIS sets the ETag according to the last modification date of the
    file. When subsequent requests are sent with the previously cached ETag value,
    IIS calculates the ETag for the requested file, and if it does not match the client''s
    ETag, the requested file is sent back. For subsequent requests, the value of the
    cached `ETag` is placed in the If-None-Match HTTP header.

    * Last-Modified. IIS sets this HTTP header to the last modification date of the
    requested file. This is an additional caching header that provides a backup in
    case IIS'' ETag support is disabled. When a subsequent request containing the
    last modification date of the file is sent to the server, IIS verifies the modification
    date and decides whether to respond with the content of the file, if the modification
    date has changed, or with an HTTP 304 response. For subsequent requests, the value
    of Last-Modified is placed in the If-Modified-Since HTTP header.


    These caching headers ensure that content is not sent back to the client if the
    client already has the latest version. If you use static files in your application
    that probably won''t change in the next couple of weeks, or months, such as your
    company''s logo or script files that are not going to be changed until the next
    version of the application, you may want to setting caching headers that allow
    the client to cache and reuse it without verifying the server if the content has
    changed every time that content is requested. This behavior can be achieved by
    either the Cache-Control HTTP header with max-age or the Expires HTTP header.
    The difference between max-age and Expires is that max-age sets an expiration
    time in seconds while Expires specifies a date when the content will expire. For
    example, setting the max-age to 3600 will allow the browser to use the cached
    content for one hour (3600 seconds = 60 minutes = 1 hour) automatically, without
    sending requests to the server to validate it. Once the content expires, either
    by the sliding window expiration or the arrival of the fixed expiration time,
    it marked as stale. When a new request is made to a stale content, the browser
    will send a request to the server asking for newer content.'
