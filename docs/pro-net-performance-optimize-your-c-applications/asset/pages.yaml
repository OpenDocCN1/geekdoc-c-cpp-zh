    # Synchronization


    A treatment of parallel programming warrants a cursory mention of the vast topic
    of synchronization. The simple examples demonstrated throughout this text, we
    have seen numerous cases of multiple threads accessing a shared memory location,
    it is a complex collection or a single integer. Aside from read-only data, every
    access to a shared memory location requires synchronization, but not all synchronization
    mechanisms have the same performance and scalability.


    Before we begin, let''s revisit the need for synchronization when accessing small
    amounts of data. Modern CPUs can issue atomic reads and writes to memory; for
    example, a value of 32 bit always executes atomically. If one processor writes
    the value 0x0ADEEF to a memory location previously initialized with the value
    0, another processor will not observe the memory location with a partial update,
    such as 0x0AD0000. Unfortunately, this is not true for larger memory locations;
    for example, on a 64 bit processor, writing 20 bytes into memory is not an atomic
    operation and cannot be performed atomically.


    However, even when issuing multiple operations, synchronization problems arise.
    For example, the operation ++1 (where 1 is a stack variable of type int) is typically
    translated to a sequence of three instructions


    ```

    mov eax, dword ptr [ebp-4]; copy from stack to register

    inc eax; increment value in register

    m dword ptr [ebp-4], eax; copy from register to stack

    ```


    Each of these instructions executes atomically, but without additional synchronization
    it is possible for two processors to execute parts of the instruction sequence
    concurrently, resulting in lost updates. Suppose that the variable''s initial
    value was 100, and examine the following execution history:


