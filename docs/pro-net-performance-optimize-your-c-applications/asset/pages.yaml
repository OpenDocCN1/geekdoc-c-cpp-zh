    \ this method as:\n\n```\npublic static int GCD(int a, int b) {\nSTART:\n  if\
    \ (b == 0) return a;\n  int temp=a % b;\n  a=b;\n  b=temp;\n  goto START;\n}\n\
    ```\n\nThis rewrite does away with all method invocations—effectively, the recursive-check\
