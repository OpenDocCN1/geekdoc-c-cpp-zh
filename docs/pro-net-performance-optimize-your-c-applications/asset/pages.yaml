    Todd Meister has been working in the IT industry for over fifteen years. He''s
    been a Technical Editor on over 75 titles ranging from SQL Server to the .NET
    Framework. Besides technical editing titles he is the Senior IT Architect at Ball
    State University in Muncie, Indiana. He lives in central Indiana with his wife,
    Kimberly, and their five incisive children.


    Fabio Claudio Ferracchiati is a prolific writer and technical reviewer on cutting-edge
