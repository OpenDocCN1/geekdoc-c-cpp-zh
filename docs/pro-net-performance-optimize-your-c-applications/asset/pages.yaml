    \ is clearly constant (one!) for all lists—this is why we mentioned worst-case\
    \ running time in the preceding paragraphs.\n\nSome examples of how notation makes\
    \ it easier to reason about runtime and compare different algorithms include:\n\
    \n+   If one algorithm has runtime complexity 2n+4 and another algorithm has runtime\
