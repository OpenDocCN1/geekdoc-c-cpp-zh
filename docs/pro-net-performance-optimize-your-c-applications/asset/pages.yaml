  md: '# CHAPTER 1


    # Performance Metrics


    Before we begin our journey into the world of .NET performance, we must understand
    the metrics and goals involved in performance testing and optimization. In Chapter
    2, we explore more than a dozen profilers and monitoring tools; however, to use
    these tools, you need to know which performance metrics you are interested in.
    Different types of applications have a multitude of varying performance goals,
    driven by business and operational needs. At times, the architecture your Web
    server has to serve millions of concurrent users a multi-server distributed system
    with caching and load balancing. At other times, performance measurement results
    may warrant changes in the application''s architecture: we have seen countless
    systems redesigned from the ground after stress tests were run—or, the system
    failed in the production environment.


    In our experience, knowing the system''s performance goals and the limits of its
    environment guides you may have halfway through the process of improving its performance.
    Here are some examples we have been to diagnose and fix over the last few years:


    +   - We discovered a serious problem with a powerful Web server in a hosted data
    center caused by a low-latency 4Mbps link used by the test engineers. Not understanding
    the critical performance metric, the engineers wasted dozens of days tweaking
    the performance of the Web server, which was actually functioning perfectly.

    - We were able to improve performance in a rich UI by tuning the behavior of the
    CLR garbage collector—an apparently unrelated component. Precisely timing allocations
    and tuning the GC removed noticeable UI lags that caused users.

    - We were able to improve compilation times by moving hard disks to SATA ports
    to work around a bug in the Microsoft SCSI driver.

    - We reduced the size of messages exchanged by WCF service by 90 %, considerably
    improving its scalability and CPU utilization, by tuning WCF''s serialization
    mechanism.

    - We reduced startup times from 35 seconds to 12 seconds for a large application
    with 300 assemblies on outdated hardware by compressing the application''s code
    and carefully disentangling some of its dependencies so that were not required
    at load time.


    These examples illustrate every kind of device, from low-power high-end consumer
    workstations with powerful graphics, all the way through multi-server data centers,
    exhibits unique performance characteristics as countless subtle factors. In this
    chapter, we briefly explore the variety of performance metrics and goals in typical
    modern software. In the next chapter, we illustrate how these metrics can be measured
    accurately; the remainder of the book shows how they can be improved systematically.'
  merge: -1
