  md: "# CHAPTER 5 COLLECTIONS AND GENERICS\n\nNote that the add and operator[] methods\
    \ were not expanded — the calling code did not use them, and the compiler generates\
    \ only the parts of the template definition that are used for the particular instantiation.\
    \ Also note that the compiler does not generate anything from the template definition;\
    \ it waits for a instantiation before it produces any.\n\nThis is why there is\
    \ no need for constraints in C++ templates. Returning to our binary search example,\
    \ the following is a reasonably implementation:\n\n```\ntemplate <typename T>\n\
    int BinarySearch(T* array, int size, const T& element) {\n// At some point in\
    \ the algorithm, we need to compare:\n  if (array[x] < array[y]) {\n\n}\n```\n\
    \nThere's no need to prove anything to the C++ compiler. After all, the template\
    \ definition is meaningless; the compiler waits for any instantiations:\n\n```\n\
    int numbers[10];\nBinarySearch(numbers, 10, 42); //Compiles, int has an operator\
    \ <\nclass empty {\nempty {};\nemempties[10];\nBinarySearch(empties, 10, empty());\
    \ //Does not compile, empty does not have an operator <\n```\n\nAlthough this\
    \ design is extremely tempting, C++ templates have unattractive costs and limitations,\
    \ which are undesirable for CLR generics:\n\n+   - Because the template expansion\
    \ occurs at compile-time, there is no way to share template implementations between\
    \ different binaries. Two DLLs loaded into the same process may separate compiled\
    \ versions of list<int>. This consumes a large amount of memory and long compilation\
    \ times, by which C++ is renowned.\n- For the same reason, template instances\
    \ in two different binaries are considered incompatible. There is no clear and\
    \ supported mechanism for exporting templates from DLLs (such as an exported function\
    \ that returns list<int>).\n- There is no way to produce a binary library that\
    \ contains template definitions. Template definitions exist only in source order,\
    \ as header files that must be #included in a C++ file.\n\n# Generics Internals\n\
    \nAfter giving consideration to the design of Java generics C++ templates, CLR\
    \ generics are implemented as follows. Generics — even open ones, like List<int>\
    \ — are first-class citizens. There is a method table and an EEClass (see Chapter\
    \ 3) for each generic type and a System.Type can be passed as well. Generics can\
    \ be exported from assemblies and only a single definition of the generic type\
    \ exists at compile-time. Generics are not expanded at compile-time, but as we\
    \ have seen the compiler makes sure any operation attempted on generic type parameters\
    \ is compatible with the specified generic constraints.\n\nWhen the CLR needs\
    \ to instantiate an instance of a generic type, such as List<int>, it creates\
    \ a method table and pointers, which are compiled on the fly by the JIT compiler.\
    \ However, there is a crucial optimization: compiled method bodies on generic\
    \ types have reference type parameters can be shared. To digest this, let's consider\
    \ the List<T>.Add method and try to compile it to x86 instructions when T is a\
    \ reference type:\n\n154"
