    # # TheGetHashCode Method


    The final method that remains and is important to override is GetHashCode. Before
    we can brush our knowledge on what it is used: Hash codes are used most often
    in conjunction with hash tables, a data structure that (under certain conditions)
    allows constant-time (O(1)) insertion, lookup, and deletion operations on arbitrary
    data. The common hash table classes in .NET Framework include Dictionary<TKey,Value>,
    Hashtable, and HashSet<T>. A typical hash table implementation consists of a dynamic-array
    of buckets, each bucket containing a linked list of items. To place an item in
    the hash table, it calculates a numeric value (using the GetHashCode method),
    and then applies it to a hash function that specifies which bucket is mapped.
    The item is inserted into its bucket''s linked list.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_90_0.png)


    **Figure 3-10.** A hash table, consisting of an array of linked lists (buckets)
    in which items are stored. Some buckets may be empty; buckets may contain a considerable
    number of items


    The performance guarantees of hash tables rely strongly upon the hash function
    used by the hash table implementation, but require also properties from the GetHashCode
    method:


    +   - If two objects are equal, their hash codes are equal.

    - If two objects are not equal, it should be unlikely that their hash codes are
    equal.

    - GetHashCode should be fast (although often it is linear in the size of the object).

    - An object''s hash code should not change.'
