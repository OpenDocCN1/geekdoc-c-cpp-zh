    # Skip List


    A skip list is a data structure that stores a sorted linked list of elements and
    allows lookup in O(log n) time, comparable to a binary search in an array or lookup
    in a balanced binary tree. Clearly, the major problem with performing a binary
    search in a skip list is that linked lists do not allow random access by index.
    Skip lists address this limitation by using a hierarchy of increasingly sparse
    linked lists: the first list links all the nodes; the second linked list links
    nodes 0, 2, 4, ...; the third linked list links nodes 0, 4, 8, ...; the fourth
    list links nodes 0, 8, 16, ... and so forth.


    To perform a lookup for an element in the skip list, the procedure iterates the
    sparsest list first. When an element is encountered that is greater than or equal
    to the desired element, the procedure returns to the previous element and drops
    to the next list in the hierarchy. This repeats until the element is found. Using
    O(log n) lists lookup time can be guaranteed.


    Unfortunately, maintaining the skip list elements is not at all trivial. If the
    entire linked list hierarchy is added or removed, it would offer no advantages
    over a data structure such as SortedList. A common approach is to randomize the
    hierarchy of lists (see Figure 5-7), which results in logarithmic time for insertion,
    deletion, and lookup of elements. The precise details of how to maintain a skip
    list can be found in William Pugh''s paper, "Skip lists: a probabilistic alternative
    to balanced trees" (ACM, 1990).


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_170_1.png)


    **Figure 5-7.** Skip list structure with four randomized lists in the hierarchy
    (Image from Wikipedia): http://upload.wikimedia.org/wikipedia/commons/8/86/Skip_list.svg,
    released to the public domain.)


