    # Summary


    Through the course of this chapter, we reviewed the motivation and implementation
    of the .NET garbage collector, the entity responsible for automatically reclaiming
    unused memory. We examined alternatives to tracing garbage collection, including
    reference counting garbage collection and manual free management. At the heart
    of the .NET garbage collector lie the following coordinating concepts, which we
    examined in detail:


    +   * Roots are the starting point for constructing a graph of all reachable objects.


    +   * Mark is the stage at which the garbage collector constructs a graph of all
    reachable objects and marks them as used. The mark phase can be performed concurrently
    with application execution thread.


    +   * Sweep is the stage at which the garbage collector shifts reachable objects
    around and updates references to them. The sweep phase requires stopping all threads
    before proceeding.


    +   * Pinning is a mechanism that locks an object in place so that the garbage
    collector can''t move it. Used in unmanaged code requiring a pointer to a managed
    object, and can cause fragmentation.


    +   * GC flavors provide static tuning for the behavior of the garbage collector
    in a specific application to better use its memory allocation and deallocation
    patterns.


    +   * The generational model describes the life expectancy of an object based
    on its current age. Young objects are expected to die fast; old objects are expected
    to live longer.


    +   * Generations are conceptual regions of memory that partition objects by their
    expectancy. Generations facilitate frequently performing partial collections with
    higher collection likelihood, and rarely performing full collections which are
    expensive and less efficient.


    +   * Large object heap is an area of memory for large objects. The LOH can become
    fragmented, but do not move around, reducing the cost of the sweep phase.


    +   * Segments are regions of virtual memory allocated by the CLR. Virtual memory
    can become fragmented because segment size is fixed.


    +   * Finalization is a backup mechanism for automatically releasing unused resources
    in a non-deterministic fashion. Prefer deterministic finalization to automatic
    finalization whenever possible, but offer others alternatives.


    The common pitfalls with garbage collection are often related to the virtues of
    its most powerful optimizations:


    +   * The generational model provides performance benefits for well-behaved applications,
    but can exhibit the mid-life crisis phenomenon which directly affects performance.'
