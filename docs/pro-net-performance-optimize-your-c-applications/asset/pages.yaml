  md: "Modern processors have a deep pipeline with several types of execution units,\
    \ such as a unit for accessing memory, a unit for performing arithmetic operations,\
    \ and a unit for decoding instructions. Pipelines enable the execution of multiple\
    \ instructions to overlap as long as they are not competing for the same parts\
    \ of the pipeline and as long as there are no dependencies between them. Data\
    \ dependencies arise when an instruction requires the result of another instruction\
    \ executed before it; for example, when an instruction reads from a memory location\
    \ to which the previous instruction has written.\n\nNote Instruction-level parallelism\
    \ is not related to parallel programming, which we discussed in Chapter 6. When\
    \ using parallel programming APIs the application runs multiple threads on multiple\
    \ processors. Instruction-level parallelism enables a single thread, on a single\
    \ processor, to execute multiple operations at once. Unlike parallel programming,\
    \ ILP is more difficult to control and depends heavily on hardware optimization.\n\
    \nIn addition to pipelining, processors employ so-called superscalar execution,\
    \ which uses multiple redundant units on the same processor to perform multiple\
    \ operations of the same type at once. To minimize the impact of dependencies\
    \ on parallel instruction execution, processors will execute instructions out\
    \ of their original order as long as it does not violate any dependencies. By\
    \ speculative execution (primarily attempting to guess which branch is going to\
    \ be taken, but by other means as well), the processor is very likely to add additional\
    \ instructions even if the next instruction in the original program cannot be\
    \ executed because of a data dependency.\n\nOptimizing compilers are for organizing\
    \ the instruction structure to maximize instruction level parallelism. The JIT\
    \ compiler does not do a particularly good job, but the out-of-order execution\
    \ capabilities of modern processors may affect it. However, poorly-specified programs\
    \ can affect performance considerably by introducing unnecessary dependencies—especially\
    \ into loops limiting instruction-level parallelism.\n\nConsider the following\
    \ loops:\n\n```\nfor (int k=0; k<100; k++) {\n  first[k]=a * second[k]+third[k];\n\
    }\nfor (int k=1; k<100; k++) {\n  first[k]=a * second[k]+first[k - 1];\n}\nfor\
    \ (int k=1; k<100; k++) {\n  first[k]=a * first[k - 1]+third[k];\n}\n```\n\nWe\
    \ executed these on our test machines with arrays of 100 integers, for a million\
    \ iterations every time. The first loop ran for 190ms, the second for 210ms, and\
    \ the third for 270ms. This is a substantial performance difference that stems\
    \ from instruction-level parallelism. The first loop's iterations don't have data\
    \ dependencies—multiple iterations can be issued on the processor and execute\
    \ concurrently in the processor's pipeline. The second loop's iterations introduce\
    \ a data dependency—to assign first[k], the code depends on first[k-1]. However,\
    \ the multiplication (which must complete before the addition) can't be issued\
    \ without data. In the third loop, the situation is as bad as it gets: the multiplication\
    \ can't be issued without waiting for data from previous iteration.\n\nAnother\
    \ example is finding the maximum value in an array of integers. In a trivial implementation,\
    \ each iteration depends on the currently established maximum from the previous\
    \ iteration. Curiously, we can apply the same idea encountered in Chapter 6—aggregation\
    \ and then summation over local results. Specifically, finding the maximum of\
    \ the array is equivalent to finding the maxima over the even and odd elements,\
    \ and then performing one additional operation to find the global maximum. Both\
    \ approaches are shown below:"
