    \ table\ncall dword ptr [eax+16]         ; work is the fifth slot (fourth zero-based)\n\
    ```\n\nThe first instruction dereferences the reference from the stack to the\
    \ ECR register, the second instruction dereferences the ECR register to obtain\
    \ the object's method table, the third instruction fetches the internal pointer\
    \ to the list of methods inside the method table (which is located at the constant\
    \ offset of 40 bytes), and the fourth instruction dereferences the internal method\
    \ at offset 16 to obtain the code address of the Work method and calls it. To\
    \ understand why it is necessary to use the method table for virtual method dispatching,\
    \ we need to consider how runtime binding works - i.e., how polymorphism is implemented\
    \ through virtual methods.\n\nSuppose that an additional class, Manager, were\
    \ to derive from Employee and override its Work virtual method, as well as implement\
    \ another interface:\n\n```\npublic class Manager : Employee, ISerializable{\n\
    \    privateist List<Employee> _reports;\n    public override void Work() {\n\
    \        //...implementation of ISerializable omitted for brevity\n    }\n```\n\
