    One approach to synchronization places the burden on the operating system. After
    all, the operating system provides the facilities for creating and managing threads,
    and assumes full responsibility for scheduling its execution. It is natural to
    expect it to provide a set of synchronization primitives. Although we will discuss
    synchronization mechanisms shortly, this begs the question of how the operating
    system implements these synchronization mechanisms. Surely Windows itself is in
    need of synchronization to its internal structures—the data structures representing
    synchronization mechanisms—and it cannot implement them by deferring to them.
