    # Marshaling Direction, Value and Reference Types


    As mentioned earlier, function parameters can be marshaled by the marshaler stub
    in either or both directions. Which direction parameter gets marshaled by a number
    of factors:


    +   - Whether the parameter is a value or reference type.

    -* Whether the parameter is being passed by value or by reference.

    -* Whether the type is blittable or not.

    -* Whether marshaling direction-modifying attributes (System.RuntimeInterop.InAttribute
    and System.RuntimeInterop.OutAttribute) are applied to the parameter.


    For the purposes of this discussion, we define the "in" direction to be the native
    to marshaling direction; conversely the "out" direction is the native to managed
    direction. Below is a list of default marshaling rules:


    +   - Parameters passed by value, regardless whether they''re value or reference
    types, are marshaled in the "in" direction only.

    -* You do not need to apply the InAttribute manually.

    -* StringBuilder is an exception to this and is always marshaled "in/out".

    -* Parameters passed by reference (via the ref C keyword or the ByRef VB .NET
    keyword), regardless whether they''re value or reference types, are marshaled
    "in/out".


    Specifying the OutAttribute will inhibit the "in" marshaling, so the native callee
    may not see initializations done by the. The C# out behaves like ref keyword but
    adds an OutAttribute.


    > Tip If parameters are not blittable in a P/Invoke call, and requiring marshaling
    in only the "out" direction, can avoid unnecessary marshaling using the out keyword
    instead of the ref keyword.


    Due to the blittable parameter pinning optimization mentioned above, blittable
    reference types will get an effective "in/out" marshaling, even if the above rules
    tell otherwise. You should not rely on this behavior if you need "out" or "in/out"
    marshaling, but you should specify direction attributes explicitly, as this optimization
    will stop working if you add a non-blittable field or if this is a COM call that
    crosses an apartment boundary.


    The difference between marshaling value versus reference types manifests in how
    they are passed on the stack.


    +   - Values passed by value are pushed as copies on the stack, so they are effectively
    marshaled "in", regardless of modifying attributes.

    -* Value passed by reference and reference types passed by value are passed by
    pointer.

    -* Reference types passed by reference are passed as pointer to a pointer.'
