  md: 'Note 64-bit Windows, stack walking requires changing a registry setting that
    disables paging-out-of kernel pages (the Windows kernel itself and any drivers).
    This may increase the system''s working set (RAM utilization) by a few megabytes.
    To change this setting, navigate to the registry key HKLM\System\CurrentControlSet\Control\Session
    Manager\Memory Management, set the DisablePagingExecutable to the DWORD 0x1, and
    restart the system.


    The tools you use for capturing and analyzing ETW traces are XPerf.exe and XPerfView.exe.
    Both tools require administrative privileges to run. The XPerf tool has several
    command line options that control which providers are enabled during trace, the
    size of the buffers used, the file name to which they are flushed, and many additional
    options. The XPerfView.exe tool analyzes and provides a graphical report of what
    the trace contains.


    All traces can be augmented with call stacks, which allow precise zooming on the
    performance issues. However, you don''t have to capture events from a specific
    provider to obtain stack traces of the system is: The SysProfile kernel flag enables
    collection of stack traces from all processors captured at 1ms intervals. This
    is a rudimentary way of understanding what a system is doing at the method level.
    (Return to this mode in more detail when discussing sampling profilers in this
    chapter.)


    # CAPTURING AND ANALYZING KERNEL TRACES WITH XPERF


    In this section, you''ll capture a kernel trace using XPerf.exe and analyze the
    results in the XPerfView.exe graphical tool.(It also requires you to set two system
    variables. To do so, right click Computer, click Properties, click "Advanced system
    settings" and finally click "Environment Variables" at the bottom of the dialog.)


    +   Set the environment variable NT_SYMBOL_PATH to point to the Microsoft symbol
    server and a local symbol cache, e.g.: srvC:\Temp\Symbols*http://msdl.microsoft.com/download/symbols


    +   Set the environment variable NT_SYMCACHE_PATH to a local directory on your
    disk—this should be a different directory from the local symbols cache in the
    previous step.


    +   Open an Administrator Command Prompt and navigate to the installation directory
    where you installed WPT (e.g. C:\Program Files\Windows Kits\8.0\Windows Performance
    Toolkit).


    +   Begin a trace with the Base kernel provider group, which contains the PROC_THREAD,
    LOADER, DISK_IO, HARD_FLAGS, PROFILE, MEMINFO, and MEMINFO_WS kernel flags (see
    Table 2-1). To do this, run the following command: xperf - Base


    +   Initiate system activity: run applications, switch between windows, open files—for
    at least a few seconds. (These are the events that will generate the trace.)


    +   Stop the trace and flush the trace to a log file by running the following
    command: xperf -d KernelTrace.etl'
