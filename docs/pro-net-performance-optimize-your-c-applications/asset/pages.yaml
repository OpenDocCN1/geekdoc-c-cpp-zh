  md: '# Interacting with the Garbage Collector


    So, we viewed our application as a passive participant in the GC story. We delved
    into the implementation of the garbage collector, and reviewed significant optimizations,
    all performed automatically and requiring little or no involvement from our part.
    In this section, we will examine the available means of active interaction with
    the garbage collector in order to tune the performance of our applications and
    receive diagnostic information that is unavailable otherwise.


    # The System.GC Class


    The System.GC class is the primary point of interaction with the .NET garbage
    collector from managed code. It contains a set of methods that control the garbage
    collector''s behavior and obtain diagnostic information regarding its work so
    far.


    # Diagnostic Methods


    The diagnostic methods of System.GC class provide information on the garbage collector''s
    work. They are meant for use in diagnostic or debugging scenarios; do not rely
    on them to make decisions at normal time. The information returned by some of
    these diagnostic methods is available as performance counters, under the .NET
    CLR Memory performance category.


    +   - GC.CollectionCount returns the number of garbage collections of the specified
    generation since application startup. It can be used to determine whether a collection
    of the specified generation occurred between two points in time.

    - GC.GetTotalMemory returns the total memory consumed by the garbage heap, in
    bytes. If its Boolean parameter is true, a full garbage collection is performed
    before returning the result, to ensure that only memory that could not be reclaimed
    is accounted for.

    - GC.GetGeneration returns the generation to which a specific object belongs.
    Note that under the current CLR implementation, objects are not guaranteed to
    be promoted when a garbage collection occurs.


    # Notifications


    Introduced in .NET 3.5 SP1, the GC notifications API provides an opportunity to
    learn in advance that a full garbage collection is imminent. The API is available
    only when non-concurrent GC is, and is aimed at applications that have long GC
    pause times and want to redistribute their work when they see a pause approaching.


    For application interest GC notifications calls the GC.RegisterForFullGCNotification
    method, and passes it to two thresholds (numbers between 1 and 9). These thresholds
    indicate how early the application wants the notification based on thresholds
    in generation 2 and the large object heap. In a nutshell, smaller thresholds make
    sure that you receive a notification but the actual collection may be delayed
    for a while, whereas larger thresholds risk not receiving a notification until
    too close to the notification trigger.


    Next, the application uses the GC.WaitForFullGCApproach method to synchronously
    block until the notification occurs, makes all the preparations for GC, and then
    calls GC.WaitForFullGCComplete to'
