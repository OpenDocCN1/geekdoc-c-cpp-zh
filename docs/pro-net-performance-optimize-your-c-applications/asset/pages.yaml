    # # Other Profilers


    In this chapter, we choose to focus on CPU, time, and memory profilers, because
    these are the metrics on most performance investigations focus. There are several
    other performance metrics that have dedicated measurement tools; in this section
    we will briefly mention some of them.


    # # Database and Data Access Profilers


    Many managed applications are built to spend a significant portion of their time
    waiting for it to return query or complete bulk updates. Database access can be
    profiled at two locations: the application’s side, where the reality of data access
    profilers, and the database’s side, best left to database profilers.


    Database profilers often require vendor-specific expertise, and are typically
    used by database administrators in their performance investigations and routine.
    We will not consider database profilers here; you can read more about the SQL
    Server Profiler, which is a very powerful database profiling tool for Microsoft
    SQL Server, at http://msdn.microsoft.com/en-us/library/ms81091.aspx.


