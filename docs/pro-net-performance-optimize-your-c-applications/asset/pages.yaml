  md: '# CHAPTER 4 GARBAGE COLLECTION


    +   - Unreferenced objects are less costly in this phase, and therefore the performance
    of the mark phase is linear in the collection efficiency factor: the ratio between
    referenced and unreferenced objects in the collection space.

    - The performance of the mark phase additionally depends on the number of objects
    in the graph, and not the memory consumed by these objects. Large objects that
    do not contain many references are easier to traverse and incur less overhead.
    This means that the performance of the mark phase is linear in the number of live
    objects in the graph.


    Once all referenced objects have been marked, the garbage collector has a full
    graph of all referenced objects and their references (see Figure 4–4). It can
    now move on to the sweep phase.


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_101_0.png)


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_101_1.png)


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_101_2.png)


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_101_3.png)


    **Figure 4–4.** An object graph with various types of roots. Cyclic references
    are permitted


    # Sweep and Compact Phases


    In the sweep and compact phases, the garbage collector reclaims memory, by shifting
    live objects around so that they are placed compactly on the heap. To understand
    the mechanics of shifting objects around, we must first examine the allocation
    mechanism which provides the motivation for the work performed in the sweep phase.


    In the simple GC model we are currently examining, an allocation request from
    the application is satisfied by incrementing a single pointer, which always points
    to the next available slot of memory (see Figure 4–5). This pointer is called
    the next object pointer (or new object pointer), and it is initialized when the
    garbage-collected heap is constructed on application startup.'
