  md: '# CHAPTER 6 CONCURRENCY AND PARALLELISM


    As recall from Chapter 5, processor caches are organized in cache lines, and adjacent
    memory locations share the same cache line. When one processor writes to a memory
    location that is in the cache of another processor, the hardware causes a cache
    invalidation that marks the cache line in the other processor''s cache as invalid.
    Accessing an invalid line causes a cache miss. In our example above, it is very
    likely that the entire localSums array fits in a single cache line, and resides
    simultaneously in the caches of all four processors on which the application''s
    threads are executing. Even when performed to any element of the array on any
    of the processors invalidates the cache line on all other processors, causing
    a constant ping-pong of cache invalidations (see Figure 6-10).


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_205_0.png)


    **Figure 6-10.** CPU 1 writes to localSums[1] while CPU 2 writes to localSums[2].
    Because both array elements are adjacent and fit into the same cache line in both
    processor caches, each such write causes a cache invalidation on the other processor


    To make sure that the problem is completely related to cache invalidations, it
    is possible to make the array strides sufficiently larger that cache invalidation
    does not occur, or to replace the direct writes to the array with writes to a
    local variable in each thread that is eventually flushed to the array when the
    thread completes. Either of these optimizations restores sanity to the world,
    and makes the parallel version faster than the sequential one on a sufficiently
    large number of cores.


    Cache invalidation (or cache collision) is a nasty problem that is exceptionally
    difficult to detect in a real application, even when aided by powerful processors.
    Taking it into consideration upfront when designing CPUalgorithms will save you
    a lot of time and aggravation


    > **Note** The authors encountered a similar case of cache invalidation in a production
    scenario with a shared item queue between two threads executing on two different
    processors. When a certain minor change was made to the internal structure of
    the queue class fields, significant performance degradation (approximately 20%)
    was detected in subsequent builds. Upon long and detailed examination, it became
    apparent that reordering fields in the queue class was responsible for the performance
    degradation; two fields that being written by different threads had become too
    close together and were placed on the same cache line. Adding padding between
    the fields restored the queue''s performance to acceptable levels.


