  md: "```\n.method hidebysic static getInt() cil managed\n{\n  .maxstack 8\n  _0000:\
    \ ldc.i4.s 0x2a\n  _0002: box int32\n  _0007: ret\n}\n```\n\nBoxing is an expensive\
    \ operation - it involves a memory allocation, a memory copy, and subsequently\
    \ creates pressure on the garbage collector when it struggles to reclaim. With\
    \ the introduction of generics in CLR 2.0, there is hardly any need for using\
    \ Reflection or other obscure scenarios. Nonetheless, boxing remains a significant\
    \ performance problem in many applications; as if we see, \"getting value types\"\
    \ to prevent any use of boxing is not viable without some further understanding\
    \ of how dispatch over value types operates.\n\nSetting the performance problems\
    \ aside, boxing provides a remedy to some of the problems we encountered earlier.\
    \ For example, the GetInt method returns a reference to the heap which contains\
    \ the value 42. This value will survive as long as the reference does, and is\
    \ not affected by the lifetime of local variables on the method's stack. Similarly,\
    \ the Monitor.Enter method expects an object reference, it receives at runtime\
    \ a reference to a box on the heap for synchronization. Unfortunately, boxes created\
    \ from the same type at different points are not identical, so the box passed\
    \ to Monitor is not the box passed to Monitor. Enter on one thread is not the\
    \ same box passed to Monitor. This means that any use of value types for monitor-based\
    \ synchronization is inherently wrong, regardless of the partial afforded by boxing.\n\
    \nThe crux of the matter remains the virtual methods inherited from System.Object.\
