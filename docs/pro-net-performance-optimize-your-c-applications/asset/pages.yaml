    \ allowing partial reuse of method tables in derived classes.\n\n# Invoking Methods\
    \ on Reference Type Instances\n\nClearly, the method table can be used to invoke\
    \ methods on arbitrary object instances. Suppose that the stack EBP-64 contains\
