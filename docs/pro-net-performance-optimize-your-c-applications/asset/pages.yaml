    When a segment becomes empty as the result of a garbage collection, the CLR releases
    the segment’s memory and returns it to the operating system. This is the desired
    behavior for many applications, especially that exhibit infrequent spikes in memory
    usage. However, it is possible to instruct the CLR to retain empty segments on
    a standby list without returning them to the operating system. This behavior,
    called segment hosting or VM hosting, can be enabled by CLR hosting with the startup
    flags of Cor8ToRuntimeExe function. Segment hosting can improve performance in
    applications that allocate and release segments very frequently (memory-intensive
    applications with frequent spikes in memory usage), and reduce out of memory exceptions
    due to virtual fragmentation (to be discussed). It is used by default. A custom
    CLR can further customize this behavior by segment allocation requests from a
    memory pool or any other using the IHostMemory interface.


    The segmented of managed memory space introduces an extremely serious problem
    which is with external (virtual fragmentation). Because segments are returned
    to the operating system when they are empty, an unmanaged allocation can occur
    in the middle of a memory region that was once a GC segment. This causes fragmentation
    of segments, which wastes memory.


    The most common causes of virtual fragmentation are late-loaded dynamic assemblies
    (as XML serialization assemblies or .NET debug compiled pages), dynamically loaded
    COM objects and unmanaged code performing scattered memory allocations. Virtual
    memory fragmentation can cause out of memory conditions when the perceived memory
    usage of process is now higher than the 2 GB limit. Longrunning processes such
    as web servers that perform memory-intensive work with frequent spikes in memory
    after several hours, days or weeks of execution. In non-critical scenarios where
    a failover is available (such as a load-balanced server farm), this is normally
    addressed by process recycling.


    >  Theoretically speaking, if the segment size is 64MB, the virtual memory allocation
    granularity is 4KB and the 32-bit process address space is 2GB (in which there
    is room for only 32 segments), it is possible to allocate only 4KB × 32 = 128KB
    of unmanaged memory and still fragment the address space that not a single consecutive
    segment can be allocated!


