  md: '# CHAPTER 4 GARBAGE COLLECTION


    The pinning operation is not very expensive—there are multiple mechanisms that
    perform rather cheaply. The most explicit way to pin an object is to create a
    GC handle with the GCHandle.Pinned flag. A GC handle creates a new root in the
    GC handle, which tells the GC that the object should be retained as well as pinned.
    Other alternatives include the memory used by the P/Invoke marshaller, and pinned
    pointers mechanism in C through the fixed keyword (or pin, ptr t in C++/CLI),
    which relies on marking the local variable as a special case for the GC (See Garbage
    Collector 8 for details).


    However, the performance cost becomes apparent when we consider how pinning affects
    the garbage collection. When the garbage collector encounters a pinned object
    during the compact phase, it must work around it to ensure it is not moved. This
    complicates the algorithm, but the direct effect is that fragmentation is introduced
    into the heap. A badly fragmented heap directly violates the assumptions that
    make garbage collection viable: It causes excessive allocations to be fragmented
    in memory (and loss of locality), introduces complexity to the allocation process,
    and causes a waste of memory as fragments cannot be filled.


    +   Note pinning side-effects can be managed with designed tools, including the
    Microsoft Profiler. The CL profiler can display a graph of objects by address,
    showing free (fragmented) areas as unused white space. Alternatively, SOS.DLL
    (the managed debugging extension) can be used to display objects of type "Free",
    which are holes created due to fragmentation. Finally, the # of Pinned Objects
    counter (in the .NET CLR Memory performance counter category) can be used to determine
    how many objects were pinned in the last area examined by the GC.


    Despite the above disadvantages, pinning is a necessity in many applications.
    Oftimes we do not control pinning, unless there is an abstraction layer (like
    P/Invoke) that takes care of the fine details on our behalf. Later in this chapter,
    we will come up with a set of recommendations that will minimize the negative
    effects of pinning.


    We have the basic steps the garbage collector undertakes during a collection cycle.
    We also saw what happens to objects that must be passed to unmanaged code. Throughout
    the previous sections we have seen many areas where optimizations are in place.
    One thing that was mentioned frequently is that on multi-processor machines, contention
    and the need for synchronization might be a very significant factor for the performance
    of memory-intensive applications. In the subsequent sections, we will examine
    multiple optimizations including targeting multi-processor systems.


    # Garbage Collection Flavors


    The .NET garbage collector comes in several flavors, though it might appear to
    the outside as a large and monolithic piece of code with little room for customization.
    These flavors exist to differentiate multiple scenarios: Client-oriented applications,
    high-performance server applications, and so on. To understand how these flavors
    are really different from each other, we must look at the garbage collector''s
    interaction with the other application threads (often called mutator threads).


    # Pausing Threads for Garbage Collection


    When a garbage collection occurs, application threads are normally executing.
    After all, the garbage collection request is typically a result of a new allocation
    being made in the code—it''s certainly to run. The work performed by the GC affects
    the memory locations of objects and the references to these objects. Moving objects
    in memory and changing their references while application is using is prone to
    be problematic.


    102'
