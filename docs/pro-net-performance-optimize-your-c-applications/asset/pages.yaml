  md: '# Table 2-2. Visual Studio Sampling Profiler Events (Partial List)


    | Trigger | Meaning | Reasonable Range | Scenario |

    | --- | --- | --- | --- |

    | Clock cycles | The application used a CPU clock cycle | 1M—1,000M | Find the
    methods that are the heaviest users of CPU time (bottlenecks) |

    | Page faults | The application accessed a page of memory that is currently not
    in RAM and must be fetched from disk (page file) | 1—1,000 | Find the methods
    that are causing page faults, i.e. expensive disk I/O instead of accessing memory
    |

    | System calls | The application used a Win32 API or .NET class that issued a
    call to an operating system service | 1—10,000 | Find the methods that are causing
    user-kernel-mode transitions, which are expensive |

    | Last cache misses | The application accessed a memory location that is not in
    the CPU cache but could be found in main memory (RAM) | 1,000—1M | Find the locations
    in code that are causing cache misses (see also Chapter 5) |

    | Instructions retired | The application executed a CPU | 500K—100M | Similar
    to clock cycles |


    Capturing samples using the Visual profiler is quite cheap, and if the overhead
    on the application''s execution interval is wide enough (the default is 10,000,000
    clock cycles), Moreover, sampling is very flexible and enables attaching to a
    running process, collecting sample events for a while, and disconnecting from
    the process to analyze the data. Because of these traits, sampling is the recommended
    approach to begin a performance investigation for CPU bottlenecks—methods that
    are a significant amount of CPU time.


    When sampling completes, the profiler makes summary tables in which each method
    is associated with two numbers: the number of exclusive samples, which are taken
    while the method was currently executing on the CPU, and the number of inclusive
    samples, which are samples while the method was currently executing or anywhere
    else on the call stack. Methods with many exclusive samples are the ones responsible
    for the application''s CPU utilization; methods with many inclusive samples are
    not directly using the CPU, but call out to other methods to. (For example, in
    single-threaded applications it would make sense for the Main method to have 100%
    of the inclusive samples.)'
