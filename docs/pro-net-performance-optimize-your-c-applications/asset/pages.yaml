    # Startup Performance


    For applications, quick start is a great first impression on the user or the more
    complex the application, the harder it is to maintain acceptable startup times.
    It is important to differentiate between cold start, warm startup, when the application
    is launched for the first time after the system has finished booting, when the
    application is launched (not for the first time) after the system has been used
    for some time. Always-on services or background agents get fast cold startup and
    sequence usage too long. Typical client applications such as email and Web browsers
    get away with slightly longer cold startup times, but users will expect them to
    launch rapidly when the system has been used for a while. Most users will want
    short startup times in both cases.


