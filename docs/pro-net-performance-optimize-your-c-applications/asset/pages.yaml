  md: 'Many developers use ASP.NET Application state collection as a sort of caching
    mechanism, because it provides an in-memory caching store, accessible for all
    users and sessions. The Application collection is quite simple:


    ```

    Application["listOfCountries"]=countries; // Store a value in the collection countries=(IEnumerable<string>)Application["listOfCountries"];
    // Get the value back

    ```


    When using the Application cache, the resources which are stored in memory and
    accumulated over time can fill the server memory, causing the ASP.NET application
    to start using paged memory from disk, even fail due to lack of memory. Therefore,
    ASP.NET provides a special caching mechanism, which provides some sort of management
    over cached items, freeing unused items when memory is lacking. ASP.NET caching,
    accessible through the Cache class provides an extensive caching mechanism, in
    addition to storing resources also allows you to:


    +   - Define an expiration for a cache object, either by specified a TimeSpan
    or a fixed DateTime. Once the allotted life time of the cache expires, the object
    will automatically be removed from the cache.


    +   - Define validity for a cached object by adding dependencies, such as an SQL
    dependency. For example, if the cached object is a result of an SQL query, an
    SQL dependency can be set, so changing the database that affects the results returned
    from the query will invalidate the cache object.


    +   - Attach callbacks to cached objects, so when an object is being removed from
    the cache, the callback is invoked. Using callbacks can assist in retrieving updated
    resource information when the cache is as simple as adding items to a dictionary:


    Adding items to a dictionary:

    Cache["listOfCountries"]=listOfCountries;


    When adding an item to the cache using the above code, the cached item will have
    the default priority of Normal and will not use any expiration or dependency checks.
    For example, to add an item to the cache with a sliding expiration, use the Insert
    method:

    Cache.Insert("products", productslist, Cache.NoAbsoluteExpiration, TimeSpan.FromMinutes(60),
    dependencies: null);


    > Note The Cache class also provides the Add method. Use the Insert method, the
    Add method will throw an exception if the cache already contains an item with
    the same key parameter.


    The cache access paradigm, using ASP.NET''s Cache class is usually implemented
    as follows:

    object retrievedObject=Cache:null;


    ```

    retrievedObject=Cache["theKey"];

    if (retrievedObject == null) {

    //Lookup the data somewhere (database, web service, etc.)

    object originalData=null;

    ...}

    ```'
