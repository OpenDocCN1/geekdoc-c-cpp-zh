    # Generations


    The generational model of the .NET garbage collector optimizes collection performance
    by performing partial garbage collections. Partial garbage collections have a
    higher collection efficiency, and the objects traversed by the collector are those
    with optimal collection likelihood. The primary decision factor for partitioning
    objects by collection likelihood is their age—the model assumes there is an inherent
    correlation between the object''s age and its life expectancy.


    # Generational Model Assumptions


    Contrary to the human and animal world, young .NET objects are expected to die
    quickly, whereas old .NET objects are expected to live longer. These two assumptions
    force the distribution of object life expectancies into the two corners of the
    graph in Figure 4–11.


