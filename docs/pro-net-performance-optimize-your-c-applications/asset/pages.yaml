    # # Best Practices for Using Value Types


    Below are some best practices that should guide you in the right direction when
    considering using a value type for a certain task:


    +   - Use value types if your objects are small and you intend to create a great
    many of them.

    - Use value types if you require high-density memory collections.

    - Override Equals, overload Equals, implement IEquatable<T>, overload operator
    ==, and overload operator != on your value types.

    - Override GetHashCode on your value types.

    - Consider making your value types immutable.


    # # Summary


    In this chapter, we have unveiled the implementation details of reference types
    and value types, and how these details affect application performance. Value types
    exhibit superb memory density, which makes them a great candidate for large collections,
    but are not equipped with features of objects such as polymorphism, synchronization
    support, and reference semantics. The CLR introduces two categories of types to
    provide a high-performance alternative to object orientation where it is required,
    but still demands a formidable effort from developers to implement value types
    correctly.'
