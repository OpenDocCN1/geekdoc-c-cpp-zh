    # Tile and Shared Memory


    Before we conclude this section, there is a very important optimization surfaced
    by C++ AMP that can improve even more the performance of our GPU code. GPUs offer
    a programmable data cache (often called **shared memory**). Values stored in it
    are shared across all threads in the same tile. By using tiled method, C++ AMP
    programs can read data from the GPU’s main memory once into the shared memory,
    and then access it quickly from multiple threads in the same tile without refetching
    from the GPU’s main memory. Accessing shared memory can be ten times faster than
    access memory–in other words, you have a reason to keep reading.


    To execute a tiled version of the parallel loop, the `parallel_for_each` method
    accepts a `tiled extent`, which divides a multi-dimensional extent into multi-dimensional
    tiles, and a `tiled_index` lambda parameter, which specifies the global ID within
    the extent, and the local ID within the tile. For example, a $16 \times 16$ matrix
    can be subdivided into $2 \times 2$ tiles (see Figure 6-12) and then passed into
    `parallel_for_each:`'
