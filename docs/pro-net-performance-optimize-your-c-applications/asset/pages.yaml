  md: '# CHAPTER 6 CONCURRENCY AND PARALLELISM


    # CUSTOMIZING PARALLEL LOOPS AND PLINQ


    Parallel loops (Parallel.For and Parallel.ForEach) and PLINQ have several customization
    APIs, which make them extremely flexible and close in richness and expressiveness
    to the explicit parallelism APIs we have considered previously. The parallel loop
    APIs accept a ParallelOptions object with various properties, whereas PLINQ relies
    on additional methods of ParallelQuery<T>. These options include:


    +   - Limiting the degree of parallelism (the number of tasks that would be allowed
    to execute concurrently)


    +   - Providing a cancellation token for canceling the parallel execution


    +   - Forcing output order of a parallel query


    +   - Controlling output buffering (merge mode) of a parallel query


    With parallel loops, it is most common to limit the degree of parallelism using
    the ParallelOptions class, whereas PLINQ, you would often customize the query''s
    merge order and ordering semantics. For more information on these customization
    options, consider the MSDN documentation.


    # C# 5 Async Methods


    So far, we considered APIs that allow a variety of parallelism solutions to be
    expressed using the classes and methods of the Task Library. However, other programming
    environments sometimes rely on language extensions to obtain better expressiveness
    when APIs are clumsy or insufficiently concise. In this section we will see C#
    5 adapts to the challenges of the concurrent programming world by providing a
    language extension to express continuations more easily. But first, we must consider
    continuations in the asynchronous programming world.


    Often, you would want to associate a continuation (or callback) with a specific
    task; the continuation should be executed when the task completes. If you have
    control of the task—i.e., you schedule it for execution—or you receive it from
    another, an explicit continuation API is desirable. The TPL offers the ContinueWith
    method (self-explanatory) to control continuations in various settings. The continuation
    may be executed only when the task has encountered an exception (e.g.), and may
    be scheduled on a particular thread or thread group using the TaskScheduler API.
    Here are some examples of the various APIs:


    ```

    Task<string> weatherTask = DownloadweatherInfoAsync(...);

    weatherTask.ContinueWith(() => Displayweather(weatherTask.Result), TaskScheduler.Current);

    Task left = ProcessLeftPart(...);

    Task right = ProcessRightPart(...);

    TaskFactory.ContinueWhenAll(

    new Task[] { left, right },

    CleanupResources

    );

    Factory.ContinueWhenAny(

    new Task[] { left, right },

    HandleError,

    TaskContinuationOptions.OnlyFaulted

    ```


