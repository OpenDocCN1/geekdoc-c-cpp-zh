    - WPT can display overlay graphs of different activity types to provide correlation
    between

    /O operations, memory utilization, processor activity, and other captured metrics.
    (See

    Figure 2-4.)

    - WPT can display call stack aggregations in a trace (when the trace is initially
    configured

    with the -stackwalk command line switch)—this provides complete information on
    call

    stacks which created certain events. (See Figure 2-5.)'
