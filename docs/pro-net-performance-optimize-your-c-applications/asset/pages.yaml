    - O(n^2). As in the QuickSort example, practical implementations of Strassen''s
    often fall back to standard when parallelizing Strassen''s algorithm using its
    recursive decomposition, it is more important to have a threshold on parallelization
    for smaller matrices.


    +   Fast Fourier Transform (Cooley-Tukey algorithm, see http://en.wikipedia.org/wiki/Cooley%26%80%93Tukey_FFT_algorithm).
    This algorithm computes the DFT (Discrete Fourier Transform) of a vector of length
    2^n using a recursive decomposition of the vector into two vectors of size 2^{n-1}.
    Parallelizing this computation is fairly easy but it is important to be wary of
    placing a threshold to the parallelization for sufficiently small vectors.


    +   Graph traversal (Depth-First Search or Breadth-First Search). As we have seen
    in Chapter 4, the CLR collector traverses a graph in which vertices are references
    and edges are objects. Graph traversal using DFS or BFS can benefit greatly from
    parallelization but; however, unlike QuickSort when parallelizing branches of
    the graph traversal it is difficult to estimate the amount of work a recursive
    call represents. This difficulty requires heuristics to decide how the search
    space should be partitioned to threads; we have seen that the server GC favors
    this partitioning crudely, based on the separate heaps from each processor allocates
    objects.


    If you are looking for examples to practice your parallel programming skills,
    also consider Karatsuba''s multiplication algorithm that relies on recursive decomposition
    to n-digit numbers - O(n^log2) operations; merge sort relies on recursive decomposition
    for sorting, similarly to QuickSort; and numerous dynamic programming algorithms,
    which often require advanced to employ memoization in different branches of the
    parallel computation (we will examine one example).


    # Exceptions and Cancellation


    We haven''t tapped into the power of the task yet. Suppose we wanted to handle
    exceptions that could arise from the recursive invocations of QuickSort down,
    and provide support for ensuring the entire operation survives if it hasn''t completed.


    The task execution environment provides the infrastructure for marshaling exceptions
    that arise within the task back to they deemed appropriate. Suppose that one of
    the recursive invocations of the QuickSort tasks encountered an exception, perhaps
    because we didn''t consider the bounds carefully and triggered an off-by-one error
    on either side of the array. This exception will rise on a pool thread, a thread
    that is not under our explicit control and does not allow any overarching exception
    handling behavior. Fortunately, the TPL will catch the exception and store it
    in the Task object for later retrieval.


    The exception that arose within a task will be rethrown (wrapped in an AggregateException
    object) when the program attempts to wait for the task (using the Task.Wait method)
    or to retrieve its result (using the Task.Result property). This allows atomic
    and centralized exception handling within the code that created the task, and
    does not require manual propagation of errors to a central location and synchronization
    of error-reporting activities. The following minimal code example demonstrates
    the exception-handling paradigm in the TPL.'
