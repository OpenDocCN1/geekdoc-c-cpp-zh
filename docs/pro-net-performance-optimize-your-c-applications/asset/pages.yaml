  md: "# CHAPTER 3 TYPE INTERNALS\n\nNote There is no need for a similar CMP instruction\
    \ in invoking virtual methods; the check is implicit because the standard virtual\
    \ method invocation accesses the method table pointer, which makes the object\
    \ pointer it valid. For virtual methods you might not always see the CMP instruction\
    \ being emitted; in recent CLR versions, the JIT compiler is smart enough to avoid\
    \ redundant checks. For example, if the program has returned from a virtual method\
    \ invocation on an object — which contains the null check implicitly — then the\
    \ JIT compiler might not emit the instruction.\n\nThe reason why we are concerned\
    \ with the precise implementation of invoking virtual methods versus non-virtual\
    \ methods is not the additional memory access or extra instruction that might\
    \ or might not be required. The primary optimization precluded by virtual methods\
    \ is method inlining, which is critical for modern high-performance applications.\
    \ Inlining is a simple compiler trick that trades code size for speed, whereby\
    \ method calls to small or simple methods are replaced by the method body. For\
    \ example, in the code below, it makes perfect sense to replace the Add method\
    \ by the single operation performed inside it:\n\n```\nint Add(int a, int b)\n\
    {\n    return a + b;\n}\n```csharp // assume c is used later in the code\n```\n\
    \nThe non-optimized call sequence will have almost 10 instructions: three to set\
    \ up parameters and dispatch the method, two to add the numbers together, two\
    \ to tear down the frame, and one to return from the method. The optimized call\
    \ sequence will have only one instruction — can you guess which? One is the Add\
    \ instruction, but in fact another optimization constant-factoring could be used\
    \ to calculate the result of the operation, and assign to the c constant value.\n\
    The performance difference between inlined and non-inlined method calls can be\
    \ vast, especially when compiler-generated automatic properties become even more\
    \ so because they don't contain any logic other than directly accessing a field.\n\
    \n```\npublic class Manager : Employee\n{\n    public override sealed void Work()\
    \ ...\n    Manager manager = ...; //could be an instance of Manager, could be\
    \ a derived type\n    manager.Work(); //direct dispatch should be possible!\n\
    ```\n\nNonetheless, at the time of writing, the sealed keyword has no effect on\
    \ method dispatch on all the CLR versions, even though knowledge that a class\
    \ or method is sealed can be used to effectively remove the need for virtual method\
    \ dispatch.\n\n73"
