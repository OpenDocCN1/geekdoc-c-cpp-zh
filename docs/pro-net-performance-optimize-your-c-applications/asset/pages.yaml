  md: "# Java Generics\n\nA generic class in Java can have generic type parameters,\
    \ and there is even a constraint mechanism quite similar to what .NET has to offer\
    \ (bounded type parameters and wildcards). For example, here's a first attempt\
    \ to convert our List<T> to Java:\n\n```\npublic class List<E> {\n    private\
    \ E[] items;\n    private int size;\n    public List(int initialCapacity) {\n\
    \        items = new E[initialCapacity];\n    }\n    public void add(E item) {\n\
    \        if (size < items.length - 1) {\n            items[size] = item;\n   \
    \         ++size;\n        } else {\n            //Allocate a larger array, copy\
    \ the elements, then place 'item' in it\n        }\n    }\n    public E get(int\
    \ index) {\n        if (index < 0 || index >= size) throw IndexOutOfBoundsException(index);\n\
    \        return items[index];\n    }\n    // other methods omitted for brevity\n\
    }\n```\n\nUnfortunately, this code does not compile. Specifically, the expression\
    \ new E[initialCapacity] is not legal in Java. The reason has to do with Java\
    \ generic code. The compiler removes mentions of the generic type parameter and\
    \ replaces them with java.lang.Object, a process called type erasure. As a result,\
    \ there is only one type at runtime — List, the raw type — and any information\
    \ about the generic type and applications that were created before generics —\
    \ something that .NET 2.0 does not offer for .NET 1.1 code).\n\nNot all is lost,\
    \ though. By using array index, we can reconcile the compiler and still have a\
    \ type-safe class that works at implementation time:\n\n```\npublic class List<E>\
    \ {\n    private Object[] items;\n    private int size;\n    public void list(int\
    \ initialCapacity) {\n        items = new Object[initialCapacity];\n    }\n  \
    \  //The rest of the code is unmodified\n}\n```\n\nList<Employee> employees =\
    \ new List<Employee>(7);\nememployees.add(new Employee(\"Kate\"));\nememployees.add(42);\
    \ // Does not compile!\n\nHowever, adopting this approach in the CLR voices a\
    \ concern: what is to become of value types? One of the reasons for introducing\
    \ generics is that we wanted to avoid boxing and casting. Inserting a value type\
    \ to an array of objects requires boxing which is not acceptable."
