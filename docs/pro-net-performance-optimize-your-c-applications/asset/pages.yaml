  md: '# CHAPTER 2 PERFORMANCE MEASUREMENT


    Note There is another performance monitoring and system health instrumentation
    framework we haven''t considered: Windows Management Instrumentation (WMI). WMI
    is a command-and-control (C&C) infrastructure integrated into Windows, and is
    outside the scope of this chapter. It can be used to obtain information about
    the system''s state (such as the installing operating system, BIOS firmware, or
    free disk space), register for intersecting events (such as process creation and
    termination), and invoke control methods that change the system state (as create
    a network share or unlock a driver). For more information about WMI, consult the
    MSDN documentation at http://msdn.microsoft.com/en-us/library/desktop/aa394582.aspx.
    If you are interested in developing WMI providers, Sasha Goldsteins''s article
    “WMI Provider Extensions in NET 3.5” (http://codeproject.com/Articles/25783/WMI-Provider-Extensions-in-NET-3-5,
    2008) provides a good start.


    # Time Profilers


    Although performance counters ETW events offer a great amount of insight into
    the performance of Windows applications, there''s often a lot to be gained from
    intrusive tools—profilers—that application execution time at the method and line
    level (improving ETW stack trace collection support). In this section we introduce
    some commercial tools and see the benefits they bring to the table, bearing in
    mind that more powerful and accurate tools sustain a bigger measurement overhead.


    Throughout our journey into the profiler world we will encounter numerous commercial
    tools; most of them have several readily available equivalents. We do not endorse
    any specific tool vendor; the products demonstrated in this chapter are simply
    the profilers we use most often and keep in our toolbox for performance investigations.
    As always with software tools, your mileage may vary.


    The first profiler we consider is part of Visual Studio, and has been offered
    by Microsoft since Visual Studio 2005 (Team Suite edition). In this chapter, we''ll
    use the Visual Studio 2012 profiler, which is available in the Premium and Ultimate
    editions of Visual Studio.


    # Visual Studio Sampling Profiler


    The Visual Studio sampling profiler operates similarly to the PROFILE kernel flag
    we''ve seen in the ETW section. It periodically interrupts the application and
    records the call stack information on every processor where the application''s
    threads are currently running. Unlike the kernel ETW, this sampling profiler can
    interrupt processes based on several criteria, some of which are listed in Table
    2-2.


    26'
