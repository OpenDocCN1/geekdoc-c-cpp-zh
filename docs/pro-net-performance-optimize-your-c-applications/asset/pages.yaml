    # Reference-Counting Garbage Collection


    Reference-counting garbage collector associates each object with an integer variable—its
    reference count. When the object is created, its reference count is initialized
    to 1. When the application creates a new reference to the object, its reference
    count is incremented by 1 (see Figure 4-2). When the application removes an reference
    to the object, its reference count is decremented by 1. When the object''s reference
    count reaches 0, the object can be deterministically destroyed and its memory
    can be reclaimed.


