  md: '# Image Packers


    A common approach to minimizing I/O transfer costs is by compressing the original
    data. After all, it would make little sense to download a 15GB uncompressed Windows
    installation if it can fit—in compressed form—on a single DVD. The same idea can
    be used with managed applications stored on disk. Compressing the application
    and decompressing it after loading into memory can significantly decrease startup
    costs by reducing the number of I/O operations performed at startup. Compression
    is a double-edged sword, where CPU time required to decompress the code and data
    in memory, but it can be worth paying the price in CPU time when reducing startup
    costs is critical, as with a kiosk application that has to launch as quickly as
    possible after the system is turned on.


    There are several commercial and open source compression utilities for applications
    (usually called packers). If you use a packer, make sure to compress .NET applications—some
    only work with unmanaged binaries. One example of is MPress, which is freely available
    at http://www.netcode.com/mpress.htm. Another example is the Rigid Packer for
    .NET Executables (RPX), an open source utility published at http://rplex.com/.
    Below is some sample output from RPX when run on a small application:


