  md: "By changing I/O-bound requests to use asynchronous processing instead of synchronous\
    \ processing, you can increase the number of worker threads available for CPU-intensive\
    \ requests, enabling your server to utilize its CPU(s) and prevent requests from\
    \ being queued.\n\n# Creating an Asynchronous Page\n\nIf you have an ASP.NET Web\
    \ Forms application, and you wish to create an async page, you will first need\
    \ to mark the page as async:\n\n```\n<@Page Async=\"true\" ...\n```\n\nOnce marked\
    \ as async, create a new PageAsyncTask object and pass the delegates for the begin,\
    \ end and timeout methods. After creating the PageAsyncTask object, call the .RegisterAsync\
    \ method to start the asynchronous operation.\n\nThe following code shows how\
    \ to start a lengthy SQL query using the PageAsyncTask:\n\n```\npublic partial\
    \ class MyAsyncPage : System.UI.Page {\n    private SqlConnection _sqlConnection;\n\
    \    private SqlCommand _sqlCommand;\n    private SqlDataReader _sqlReader;\n\n\
    \    IAsync BeginAsyncOp(object sender, EventArgs args, AsyncCallback cb, object\
    \ state) {\n        //This part of the code will execute in the original worker\
    \ thread,\n        // do not perform any lengthy operations in this method\n \
    \       _sqlCommand = CreateSqlCommand(_sqlConnection);\n        return _sqlCommand.ExecuteReader(cb,\
    \ state);\n    }\n    void EndAsyncOp(IAsyncResult asyncResult) {\n        _sqlReader\
    \ = _sqlCommand.ExecuteReader(asyncResult);\n        // Read the data and build\
    \ the page's content\n    }\n    void TimeoutAsyncOp(IAsyncResult asyncResult)\
    \ {\n        _sqlReader = _sqlCommand.ExecuteReader(asyncResult);\n        //\
    \ Read the data and build the page's content\n    }\n\n    protected override\
    \ void Dispose() {\n        if (_sqlConnection != null) {\n            _sqlConnection.Close();\n\
    \        }\n        base.Dispose();\n    }\n\n    protected void btnClick_Click(object\
    \ sender, EventArgs args) {\n        PageAsyncTask task = new PageAsyncTask(\n\
    \            new EventHandler(BeginAsyncOp),\n            new EventHandler(EndAsyncOp),\n\
    \            new EventHandler(TimeoutAsyncOp),\n            state:null);\n   \
    \     RegisterAsyncAsyncTask(task);\n    }\n}\n```"
