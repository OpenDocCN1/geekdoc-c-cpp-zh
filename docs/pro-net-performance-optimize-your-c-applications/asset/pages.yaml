  md: '# Dispatching Static and Interface Methods


    For completeness, there are two additional types of methods we need to consider:
    static methods and interface methods. Dispatching static methods is fairly easy:
    there is no need to load an object reference, and simply calling the method (or
    its pre-JIT stub) would suffice; because the invocation does not proceed through
    a method, the JIT compiler uses the same trick as non-virtual instance method:
    the method dispatch is indirect through a special memory location which is updated
    after the JIT is compiled.


    Interface methods, however, are a wholly different matter. It might appear that
    dispatching an interface method is not different from dispatching a virtual instance
    method. Interfaces, indeed enable a form of polymorphism reminiscent of classical
    virtual methods. Unfortunately, there is no guarantee that the interface implementations
    of a particular interface across several classes end up in the same slot in the
    method table. Consider the following code, where two classes implement the IComparable
    interface:


    ```

    class Manager : Employee, Icomparable {

    public override void Work() {

    ...

    public void TakeVacation(int days)

    ...

    public static void SetCompanyPolicy(...)

    ...

    public int CompareTo(object other)

    }

    class BigNumber : Icomparable {

    public long Part1, Part2;

    public int CompareTo(object other)

    }

    ```


    Clearly, the method table for these classes will be very different, and the slot
    number where the CompareTo method ends up will be just as complex. Complex object
    hierarchies and multiple implementations make it evident that an additional dispatch
    step is required to identify where in the method table the interfaces were placed.


    In prior CL versions, this information was stored in a global (AppDomain-level)
    table indexed by an interface ID, generated when the interface is loaded. The
    method table had a special entry (at offset 12) pointing into the proper location
    in the global interface table, and the global interface table entered back into
    the method table, to the sub-table where it the interface method pointers were
    stored. This allowed multi-step method dispatch, along the following lines:


    ```

    mov ecx, dword ptr [ebp-6] ; object reference

    mov eax, dword ptr [ecx] ; method table pointer

    mov eax, dword ptr [ecx+12] ; interface map pointer

    mov eax, dword ptr [ecx+8] ; compile offset for this interface in the method table

    call ptr [eax] ; first method at EAA, second method at EAA+4.

    ```


    This looks complicated - there are four memory accesses to fetch the code address
    of that interface implementation and dispatch it, and for some interfaces this
    may be too high a cost. This is why the JIT uses several tricks to effectively
    inline interface methods, even at least for the common case:


    Hot-path analysis — when the JIT detects that the same interface implementation
    is often used, it replaces the specific call with optimized code that may even
    inline the commonly used interface implementation:


    ```

    mov ecx, dword ptr [ebp-4]

    cmp dword ptr [ecx], 00385670 ; expected method table pointer ; cold path, shown
    below in pseudo-code

    je 000a188c ; hot path, could be inlined body here

    ```'
