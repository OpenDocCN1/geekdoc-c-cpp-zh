  md: 'WinRT is built on top of advanced version of COM. Below are some differences
    between WinRT and COM:


    +   - Objects are created using RoCreateInstance.

    - All objects implement the IInspectable interface which in turn derives from
    the familiar IUnknown.

    - Supports .NET-style properties, delegates and events (instead of sinks).

    - Supports parameterized interfaces ("generics”).

    - Uses the .NET metadata format (.winmd files) instead of TLB and IDL.

    - All types derive from PlatForm: **Object


    Despite borrowing many ideas from .NET, WinRT is implemented entirely in native
    code, so the CLR is not required when calling WinRT from a non-.NET language.

    Microsoft implemented **language projections** that make WinRT connects to language-specific
    contexts, whether the language is C++/CX, C or JavaScript. For example, C++/CX
    is a new language of C++ which manages reference counting atomically, translates
    WinRT object activation (RoActivateInstance) to a C++ constructor, converts HRESULT
    to exceptions, converts "retval" to return values, etc.

    When the caller and callee are both managed, the CLR is smart enough to make the
    call directly and there is no interop involved. For calls that cross a native
    to managed boundary, regular COM interop is involved. When both the caller and
    callee are implemented in C++, the callee''s header files are available to the
    caller, no COM interop is involved. This is very fast, otherwise a COM QueryInterface
    needs to be done.


    # # Best Practices for Interop


    The following is a summary of best practices for high-performance interop:


    +   - Design interfaces to avoid native-managed transitions by chunking (combining)
    work.

    - Reduce round trips with a facade.

    - Implement IDisposable if unmanaged resources are held across calls.

    - Consider using memory pooling or unmanaged memory.

    - Consider using unsafe code for re-interpreting data (e.g. in network protocols).

    - Explicitly name the function you call and use ExactSpelling=true.

    - Use nullable parameters whenever possible.

    - Avoid Unicode conversions where possible.

    - Manually marshal strings to/from IntPtr.

    - Use C++/CLI for better control and performance for C++/CX and COM interop.

    - Specify [In] and [Out] attributes to avoid unnecessary marshalling.

    - Avoid long lifetime for pinned objects.

    - Consider calling ReleaseComObject.'
