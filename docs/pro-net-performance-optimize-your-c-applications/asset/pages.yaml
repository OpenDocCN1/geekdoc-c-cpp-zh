- img_proc: true
  md: '# CHAPTER 7 NETWORKING, I/O, AND SERIALIZATION


    and may create a situation called thrashing in many threads wake up when I/O completes
    and compete with each CPU for time, resulting in many contexts and poor scalability.


    The Windows I/O system (including device drivers) is internally asynchronous -
    execution of program flow can continue while an I/O operation is in progress.
    All modern hardware is asynchronous in nature as well and does not need polling
    to transfer data or determine if an I/O operation is complete. Most devices rely
    on Direct Memory Access (DMA) controllers to transfer data between the device
    and the computer RAM, without requiring the CPU''s attention during the transfer,
    and then raise an interrupt to signal completion the data transfer. It is only
    at the application level that Windows allows synchronous I/O that is actually
    asynchronous.


    In Win32, asynchronous I/O is called overlapped I/O (see Figure 7-1 comparing
    synchronous and overlapped I/O). Once an application uses an overlapped I/O, Windows
    completes the I/O operation immediately or returns a status code indicating the
    I/O operation is still pending. The thread can then issue more I/O operations,
    or it can do some computation. The programmer has several options for receiving
    a notification about the I/O operation''s:


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_216_0.png)


    **Figure 7-1.** Comparison between synchronous and overlapped I/O


    +   - Signaling of a Win32 event: A wait operation on this event will complete
    when the I/O completes.

    - Invocation of a user callback routine via the Asynchronous Procedure Call (APC)
    mechanism: the thread must be in a state of alertable to wait for all APCs.

    - Notification via I/O Completion Ports: This is usually the most efficient mechanism.
    We explore I/O completion ports in detail later in this chapter.


    > Note Some I/O devices (e.g. a file opened in unbuffered mode) benefit (by increasing
    device utilization) if an application can keep a small amount of I/O requests
    pending. A recommended strategy is to pre-issue a certain number of I/O requests
    and, for each request that completes, re-issue another. This ensures the device
    driver can initiate the next I/O as quickly as possible, waiting for the application
    to issue the next I/O in response. Do not exaggerate the amount of pending data,
    as it can consume limited kernel memory resources.


