    > There are literally thousands of performance counters on a Windows system; no
    performance investigator to remember them all. This is where the "Show description"
    checkbox at the bottom of the "Add Counters" dialog comes in handy—can you tell
    that SystemProcessor Queue Length represents the number of threads waiting for
    execution on the system''s processors, or that .NET CLR LocksAndThreads\Contention
    Rate /sec is the number of times (per second) that threads attempted to acquire
    a managed lock unsuccessfully and had to wait for it to become available.


    # Performance Counter Logs and Alerts


    Configuring performance counter is fairly easy, and you can provide an XML template
    to your system administrators to apply performance counters automatically without
    having to specify individual performance counters. You can open the resulting
    logs on any machine and play them back as if they represent live data (There are
    some built-in counters you can use instead of configuring what to log to)


    You can also use Performance Monitor to configure a performance counter alert,
    which will create a task when a certain threshold is breached. You can use performance
    counter alerts to create a rudimentary monitoring infrastructure, which can send
    an email or message to a system administrator when a performance constraint is
    violated. For example, you could configure a performance counter alert that would
    automatically restart your process when it reaches a dangerous amount of memory
    usage, or when the system as a whole runs out of disk space. We strongly recommend
    that you experiment with Performance Monitor and familiarize yourself with the
    various options it has to offer.


    10'
