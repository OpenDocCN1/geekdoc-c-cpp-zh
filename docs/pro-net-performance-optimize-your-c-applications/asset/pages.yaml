  md: "Caution It may appear that sampling is an accurate technique for measuring\
    \ CPU utilization. You might hear claims that go as far as “if this method had\
    \ 65% of the exclusive samples, then it ran for 65% of the time”. Because of the\
    \ statistical nature of sampling, reasoning is treacherous and should be avoided\
    \ in practice. There are several factors that can contribute to the inaccuracy\
    \ of sampling results: CPU clock rates can change hundreds of times every second\
    \ during application execution, that the correlation between the number of samples\
    \ and actual CPU time is skewed; a method can be “missed” (underrepresented) if\
    \ it happens not to be running when samples were taken; a method can be overrepresented\
    \ if it happens to be running when many samples were taken but finished quickly\
    \ time. To summarize, do not consider the results of a sampling profiler to be\
    \ an exact representation of CPU time spent, but rather a general outline of the\
    \ application's main bottlenecks.\n\nThe Visual Studio profiler offers more information\
    \ in the exclusive/inclusive sample tables for every method. We recommend that\
    \ you explore the profiler's windows yourself—the Call Tree shows the hierarchy\
    \ of classes in the application's methods (compare to PerfMonitor's data analysis,\
    \ 2-8), the Line view displays sampling information on the line level, and the\
    \ Modules view groups methods by assembly, which can lead to quick conclusions\
    \ about the general direction in which to look for a performance bottleneck. Because\
    \ all sampling intervals require the application thread that triggers them to\
    \ be executing on the CPU, there is no way to obtain samples from application\
    \ threads that are blocked while waiting for I/O or synchronization mechanisms.\
    \ For CPU-bound applications, sampling is ideal for I/O-bound applications, we’ll\
    \ have to consider other approaches that rely on more intrusive profiling mechanisms.\n\
    \n# Visual Studio Instrumentation Profiler\n\nThe Visual Studio profiler offers\
    \ another mode of operation, instrumentation profiling, which is tailored to measuring\
    \ overall execution time and not just CPU time. This is suitable for profiling\
    \ I/O-bound applications or applications that execute heavily in synchronization\
