  md: '# Garbage Collection Performance Best Practices


    In this section, we will provide a summary of best practices for interacting with
    the .NET garbage collector. We will examine multiple scenarios which demonstrate
    aspects of these best practices, and point out pitfalls that must be avoided.


    # Generational Model


    We reviewed the generational model as the enabler of two significant performance
    optimizations to the naive GC model discussed previously. The generational heap
    partitions managed objects by their life expectancy, enabling the GC to frequently
    collect objects that are short-lived and have high collection likelihood. Additionally,
    the separate large heap solves the problem of copying large objects by employing
    a free list management strategy for reclaimed large memory blocks.


    We can now summarize the best practices for interacting with the generational
    model, and then review a few examples.


    +   * Temporary objects should be short-lived. The greatest risk is temporary
    objects that creep into generation 2, which causes frequent collections.

    * Large objects should be long-lived or pooled. A LOH collection is equivalent
    to a full collection.

    * References between generations should be kept to a minimum.


    The following case study presents the risk of mid-life crisis phenomenon. In a
    monitoring UI application implemented by one of our customers, 20,000 records
    were constantly displayed on the application''s main screen. Each individual record
    contained a severity, a brief description message and (potentially large) contextual
    information. These 20,000 records were continuously replaced as new records would
    flow into the system.


    Because of the large amount of records on display, most log records would survive
    two garbage collections and shortly thereafter they are replaced by new records
    which in turn creep into generation 2, exhibiting the mid-life crisis phenomenon.
    The effect was that the application performed hundreds of full garbage collections
    per minute, spending nearly 50% of its time in GC code.


    After an initial analysis, we had concluded that displaying 20,000 log records
    in the UI is unnecessary. We trimmed the display to show only 1,000 most recent
    records, and implemented pooling to reuse and reinitialize existing record objects
    instead of creating new ones. These measures minimized the memory footprint of
    the application, but even more significantly, minimized the time in GC to 1%,
    with a full collection occurring only once in a while.


    Another example of mid-life crisis is a scenario encountered by one of our servers.
    The web server is partitioned to a set of front-end servers which receive web
    requests. These front-end servers use synchronous web calls to a set of back-end
    servers in order to process the individual requests.


    In the QA environment, the server call between the front-end and back-end layers
    would return within several milliseconds. The GC called the HTTP request to be
    dismissed shortly, so the object and its associated object graph would be short-lived.


    In the production environment, the web server call would take longer to execute,
    due to network conditions, back-end server load and other factors. The request
    returned to the client within a fraction of a second, which was not worth optimizing
    because a being cannot observe the difference. However, with many requests flowing
    into the system each second, the lifetime of each request object and its associated
    object graph was extended such that these objects survived multiple garbage collections
    and creep into generation 2.'
