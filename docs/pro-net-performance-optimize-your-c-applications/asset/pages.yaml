    # Background GC


    The workstation concurrent GC flavor introduced in CLR 1.0 has a major drawback.
    Although a generation 2 concurrent GC threads are allowed to continue allocating,
    they can only allocate as much as would fit into generations 0 and 1. As this
    limit is exceeded, application threads must block and wait for the collection
    to complete.


    Background GC, introduced in CLR 4.0, enables the CLR to perform a background
    collection in generations 0 and 1 even though a full collection was demanded.
    To allow this, the CLR creates two GC threads: a foreground thread and a background
    thread. The background GC executes generation 2 collections in the background,
    and periodically checks for a request to perform a quick collection in generations
    0 and 1. When a request arrives (because the application has exhausted the younger
    generation), the background GC suspends itself and yields to the foreground GC
    thread, which performs the quick collection and unlocks the application threads.


    In CLR 4.0, background GC was offered automatically for any application using
    the concurrent workstation GC. There is no way to opt out of background GC or
    to use background GC with other GC flavors.


    In CLR 4.5, background GC was expanded to the server GC. Moreover, server GC was
    expanded to support concurrent collections as well. When using concurrent GC in
    a process that is using N logical processors, the CLR creates N foreground GC
    threads and N background GC threads. The background GC


