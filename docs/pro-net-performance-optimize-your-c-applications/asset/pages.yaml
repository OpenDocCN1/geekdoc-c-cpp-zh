    # Disjoint-Set (Union-Find)


    The disjoint-set data structure (often called union-find) is a collection which
    partitions elements into disjoint subsets. It differs from all .NET collections
    because you do not store elements in it. Instead, there is a domain of elements
    where each element forms a single set, and consecutive operations on the data
    structure join sets to form larger sets. The data structure is designed to perform
    two operations efficiently:


    +   * Union: Join two subsets together to form a single subset.

    * Find: Determine which subset a particular element belongs. (Most commonly used
    to determine whether two elements belong to the same subset.)


    Typically, sets are manipulated as representative elements, with a single representative
    for each set. The union and find operations, then, receive and return representatives
    instead of entire sets.


