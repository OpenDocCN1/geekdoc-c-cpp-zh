  md: "# CHAPTER 11 WEB APPLICATION PERFORMANCE\n\n**Note** This is the default behavior\
    \ when creating ASP.NET web applications in Visual Studio 2012 or 2010. In previous\
    \ versions of Visual Studio the default behavior was to set the debug setting\
    \ to *false*, and when the developer first tried to debug the application, a dialog\
    \ appeared asking permission to change the setting to *true*.\n\nThe issue with\
    \ this setting is that developers often neglect to change the setting from true\
    \ to false when they deploy the application to production, or even do it intentionally\
    \ to get more detailed exception information. In fact, this setting can lead to\
    \ several performance problems:\n\n+   - Scripts that are downloaded using the\
    \ WebResources.ax handler, for example using validation controls in pages, will\
    \ not be cached by the browser. When setting the debug to false, responses from\
    \ this handler will be returned with caching headers, allowing browsers to cache\
    \ the response for future visits.\n\n+   - Requests will not timeout when debug\
    \ is set to true. Although this is very convenient when debugging the code, this\
    \ behavior is less desired in production environments when such requests can lead\
    \ to the server not able to handle other requests, or even cause increased CPU\
    \ usage, increased memory consumption and other resource allocation.\n\n+   -\
    \ Setting the debug flag to false to enable ASP.NET to define timeouts for requests\
    \ according to the httpRuntime.timeout configuration settings (the default value\
    \ is 100 seconds).\n\n+   - JIT optimizations will be applied to the code when\
    \ using debug= true. JIT optimizations are one of the most important advantages\
    \ of .NET and can efficiently improve the performance of your ASP.NET application\
    \ without changing your code. Setting debug to false will allow the JIT compiler\
    \ to perform its deeds, making your application perform faster and more efficient.\n\
    \n+   - The compilation process does not use batch compilations when using debug=\
    \ true. Without batch compilation an assembly will be created for each page and\
    \ user control, causing the application to load dozens and even hundreds of assemblies\
    \ during runtime; loading that many assemblies may cause memory exceptions due\
    \ to fragmented address space. When the debug mode is set to false, batch compilation\
    \ is used, generating a single assembly for the user controls, and several assemblies\
    \ for the pages (pages are grouped to assemblies according to their use of controls).\n\
    \nChanging this setting is very easy: remove the debug attribute from the configuration,\
    \ or set it to false:\n\n```\n<configuration>\n  <system.web>\n    <compilation\
    \ debug=\"false\" targetFramework=\"4.5\" />\n  </system.web>\n</configuration>\n\
    ```\n\nIn case you forget forgetting to change this setting before deploying applications\
    \ to production servers, you can **force** ASP.NET applications in a server to\
    \ ignore the debug setting by adding the following configuration in the server's\
    \ machine.config file:\n\n314"
  merge: -1
