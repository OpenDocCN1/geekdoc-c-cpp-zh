    # OTHER DIRECTIONS


    Many researchers and programming language designers do not believe the situation
    going shared memory synchronization can be addressed without changing the semantics
    of programming languages, parallelism frameworks, or processor memory models.
    There are several interesting directions in this area:


    +   * Transactional memory in hardware or software suggests an explicit or implicit
    isolation around memory operations and rollback semantics for series of memory
    operations. Currently, the performance cost of such approaches limits their wide
    adoption in mainstream languages and frameworks.


    +   * Agent-based languages use a concurrency model deep into the language and
    require explicit communication between agents (objects) in terms of message-passing
    instead of shared memory access.


    +   * Message-passing processor and memory architectures organize the system using
    a private memory paradigm, where each shared memory location must be explicit
    through message-passing at the hardware level.


    Throughout the rest of this section, we will assume a more pragmatic view and
    attempt to reconcile the problems of shared memory synchronization by offering
    a set of synchronization mechanisms and patterns. However the authors firmly believe
    that synchronization is more difficult than it should be; our shared experience
    demonstrates that a large majority of bugs in software today stems from the simplicity
    of corrupting state by improperly synchronizing parallel programs. We hope that
    in a few years—the community will come up with better alternatives.


