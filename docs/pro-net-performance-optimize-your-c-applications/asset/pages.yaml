    When discussing the complexity of algorithms on a Turing machine, there is no
    need to reason in vague "iterations"—a step of a TM is a single state transition
    (transition from a state to itself). For example, when the TM in 9-1 starts with
    the input "AAAA" on its tape, it performs exactly four computation steps. We can
    generalize this to say that for an input of n a''s with "anⁿ", the machine performs
    exactly n+2 steps, so the definition of O(n) holds, with the constant c=2.

    Implementing real-world computations using a Turing machine is quite difficult—it
    makes for a good exercise in an undergraduate course, but has no theory. The amazing
    result is that every C# program, and fact, every algorithm can be translated—literally—to
    a Turing machine. Roughly speaking, if an algorithm written in C# has runtime
    O(f(n)), then the same algorithm translated to a Turing machine has runtime complexity
    O(f(n)). This has very useful implications on analyzing algorithm complexity:
    if a problem does not have an efficient algorithm for a Turing machine, then it
    does not have an efficient algorithm for a modern computer; or if the problem
    does have an efficient algorithm for a Turing machine, then it, typically, does
    not have an efficient algorithm for a modern computer.


    Although we could call O(n) algorithms efficient and any "slower" algorithms inefficient,
    complexity theory takes a slightly different stance. P is the set of all problems
    a Turing machine can solve in polynomial time—in other words, problems whose desired
    result is within polynomial time (within O(nᵏ) steps for natural number k). In
    many subfields of complexity theory, problems in P are considered easy—and algorithms
    that run in polynomial time are considered efficient, even though k and, therefore
    the time can be very large for some algorithms.


    All of the algorithms considered so far in this book are efficient if we embrace
    this density. Still, some are "very" efficient and others less so, indicating
    that efficiency is not sufficiently subtle. You might even ask whether there are
    problems that are not in P, problems that do not have efficient solutions. The
    answer is a resounding yes—and, in fact, from a theoretical perspective, there
    are more problems that do not have efficient solutions than those that do.


    First, we consider a problem that a Turing machine cannot solve, regardless of
    efficiency. When we see that there are problems a Turing machine can solve, but
    not in polynomial time. Finally, we turn to problems for which we do not know
    whether there is a Turing machine that can solve them in polynomial time, but
    strongly suspect that there is not.


