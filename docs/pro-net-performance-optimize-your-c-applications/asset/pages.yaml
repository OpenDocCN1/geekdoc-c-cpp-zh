- img_proc: true
  md: 'Caution It is advisable that you do not test a public web site, only your own
    sites and web applications. Load testing a public web site may be interpreted
    as a denial-of-service (DOS) attack, causing your machine or your local network
    to be banned from accessing the web site.


    Combining Load Test with the records of the Web Performance test, we can simulate
    dozens and even hundreds of users, concurrently accessing our web application,
    simulating calls to various pages with different parameters in each request.


    To properly simulate hundreds of users, it is advisable that you use test agents.
    Test agents are machines that receive testing instructions from a controller machine,
    perform the required tests, and send the results back to the controller. Use of
    test agents helps in reducing the stress on the testing machine (not the machine
    being tested), because a single machine simulating hundreds of users may suffer
    from performance degradation, causing the test to produce faulty.


    During load test we can monitor performance counters that can point out how application
    behaves under stress, by checking if requests are queued in ASP.NET, if the duration
    of a request is increasing over time, and if requests get timed out because of
    configuration failure.


    By running load tests with various scenarios, such as different number of concurrent
    users or different types of networks (slow/fast), we can learn how our web application
    works under stress, and from the recorded data continue on ways we can improve
    its overall performance.


    # HTTP Monitoring Tools


    Monitoring tools that can sniff HTTP communication, such asing, NetMon, HTTP Analyzer,
    and Fiddler, can assist us in identifying the HTTP requests and responses from
    our web application. With the help of monitoring tools, we can verify various
    issues that can affect the performance of our web application. For example:


    +   **Using your browser''s cache.** By looking at the HTTP traffic, we can identify
    responses that are returned with caching headers, and whether requests are sent
    with the proper "match" headers when the requested content has been cached.


    **Number and size of messages.** Monitoring tools show each request and response,
    the time it took for each message to be received, and the size of each message,
    allowing us to track down requests that are sent too often, large requests and
    responses that are taking too long to process.


    **Applying compression.** By viewing the requests and responses, we can verify
    that requests are being sent with the Accept-Encoding header to handle GZip compression,
    and that your web server returns a compressed response.


    **Synchronized communication.** HTTP monitoring tools can show a timeline of the
    requests and which process generated each request, so we can verify whether our
    client is able to send multiple requests at once, or if requests are synchronized
    due to lack opening connections. For example, you can use this feature to detect
    how many concurrent connections a browser can open to a specific server, or check
    if your .NET application is using the default two connections enforced by System.Net.ServicePointManager.


    Some tools, like Fiddler, can also export the recorded traffic as a Visual Studio
    Web Performance test, so you can use Web Test and Load Test to test web applications
    that are called from client applications and browsers besides Internet Explorer.
    For example, you can monitor HTTP-based WCF calls from a .NET application, export
    them as a Web Test, and use the Load Test to stress your WCF service.'
