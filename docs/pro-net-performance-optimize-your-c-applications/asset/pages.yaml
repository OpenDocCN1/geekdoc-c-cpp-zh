  md: '# CHAPTER 8 UNSAFE CODE AND INTEROPERABILITY


    **Tip** Use the Unicode versions of Win32 functions. Windows NT and beyond are
    natively Unicode (UTF6). If you call the ANSI versions of Win32 functions, strings
    are converted to Unicode which results in a performance penalty; and the Unicode
    version of the function is called. The .NET string representation is natively
    UTF16, so marshaling string parameters is faster if they are already UTF16. Design
    your code and ensure the interface to be Unicode-compatible, which has globalization
    benefits as well. Set ExactSpelling to true, which will speed up initial load
    time by eliminating an unnecessary function search.


    # Marshaler Stubs


    When first call a P/Invoke function, right after loading the native DLL, a P/Invoke
    marshaller stub will be generated on demand, and will be re-used for subsequent
    calls. The marshaller performs the following steps once:


    +   1. Checks for callers'' unmanaged code execution permissions.

    2. Converts managed arguments to their appropriate in-memory representation, possibly
    allocating memory.

    3. Sets thread''s GC to pre-empt, so GC can occur without waiting the thread to
    reach a safe point.

    4. Calls the native function.

    5. Restores GC mode to co-operative.

    6. Optionally writes Win32 error code in Thread Local Storage for retrieval by
    Marshal.GetLastErrorWin32Error.

    7. Optionally converts exception if thrown to a managed exception.

    8. Converts the return value and output parameters back to managed in-memory representations.

    9. Cleans up temporarily allocated memory.


    P/Invoke can also be used to call managed code from native code. A reverse marshaller
    stub can be generated for a delegate (via Marshal.GetFunctionForDelegate) if it
    is reverse as a parameter in a P/Invoke to call the managed method. The function
    returns a function pointer to a dynamically generated stub which in addition to
    parameter marshall, also knowing the object''s address (this pointer).

    In .NET Framework 1, marshaller stub consists of generated assembly code (for
    simple functions) or general MS IL (Intermediate Language code for complex scenarios).
    MS IL is internal byte code and is executed by an internal interpreter. With the
    introduction of AMD64 and Itanium support, in .NET Framework 2.0, Microsoft realized
    implementing a parallel IL infrastructure for every CPU architecture would be
    a burden. For 64-bit versions of .NET Framework 2.0 were implemented more extensively
    in generated code. While the IL stubs were significantly faster than the interpreted
    MLs, they were still slower than the x86 generated assembly stubs, Microsoft opted
    to retain the x86 implementation. In .NET Framework 4.0, the IL stub generation
    infrastructure was significantly optimized, which made IL stubs faster even compared
    to the x86 generation stubs. This allowed Microsoft to remove the x86-specific
    stub implementation entirely and to unify stub generation across all architectures.


