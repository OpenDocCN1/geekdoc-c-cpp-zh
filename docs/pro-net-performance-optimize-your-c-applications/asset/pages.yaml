  md: '# INTRODUCTION


    +   * Windows threads, synchronization, virtual memory


    +   * Common Language Runtime (CLR): Just-In-Time (JIT) compiler, Microsoft Intermediate
    Language (MSIL), garbage collector


    +   * Computer organization: main memory, cache, disk, graphics card, network
    interface


    There are quite a few sample programs, excerpts, and benchmarks throughout the
    book. In the interest of not making this book any longer, we included only a brief
    part—but you can find the full program in the companion source code on the book''s
    website.


    In some chapters we use code in x86 assembly language to illustrate how CLR mechanisms
    operate or to explain more thoroughly a specific performance optimization. Although
    these parts are not crucial to the book''s takeaways, we recommend dedicated readers
    invest some time learning the fundamentals of x86 assembly language. Randall Hyde''s
    freely available book "The Art of Assembly Language Programming" (http://www.artofasm.com/windows/index.html)
    is an excellent resource.


    In conclusion, this book is full of performance measurement tools, small tips
    and tricks for improving minor areas of application performance, theoretical foundations
    for many CLR mechanisms, practical code examples, and several case studies from
    the authors'' experience. For almost ten years we have been optimizing applications
    for our clients and designing high-performance systems from scratch. During these
    years we trained hundreds of developers to think about performance at every stage
    of the software development lifecycle and to actively seek opportunities for improving
    application performance. After reading this book, you will join the ranks of high-performance
    .NET application developers and performance investigators optimizing existing
    applications.


    Sasha Goldsstein

    Dima Zurbalev\Ido Flatow'
