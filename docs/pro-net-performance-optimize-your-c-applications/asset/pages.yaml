  md: "# CHAPTER 3 TYPE INTERNALS\n\nclass Counter\n\n```\n{\n    private int _i;\n\
    \    private object _syncObject = new object();\n    public int Increment() {\n\
    \        bool acquired = false;\n        try {\n            Monitor.Enter(_syncObject,\
    \ ref acquired);\n            return ++_i;\n        }\n        finally {\n   \
    \         if (acquired) Monitor.Exit(_syncObject);\n        }\n    }\n}\n```\n\
    \nTo ensure mutual exclusion, a synchronization mechanism can be associated with\
    \ every object. Because it is expensive to create a synchronization mechanism\
    \ for every object on the outset, this association occurs lazily, when the object\
    \ is used for synchronization for the first time. When required, the CLR allocates\
    \ a structure called sync block from a global array called sync block table. The\
    \ sync block contains a backwards reference to its owning object (although this\
    \ is a weak reference that does not prevent the object from being collected),\
    \ and, among other things, a synchronization mechanism called monitor, is implemented\
    \ internally using a Win32 event. The numeric index of the allocated sync block\
    \ is stored in the object's header word. Subsequent attempts to use the object\
    \ for synchronization recognize the existing sync block index and use the associated\
    \ monitor object for synchronization.\n\n| Sync Block Table |\n| :--- |\n| Sync\
    \ Block #1 |\n| Employee Class Index | Miscellaneous Flags |\n| Method Table Pointer\
    \ | Win32 Event Handle |\n| Storage for_id | Hash Code Storage |\n| Storage for_name\
    \ | Owner Weak Reference |\n| Sync Block #3 |\n\n> **Figure 3-6.** A sync block\
    \ associated with an object instance. The sync block index fields stores only\
    \ the index into the sync block table, allowing the CLR to resize and move the\
    \ table in memory without modifying the sync block index\n\nAfter a sync block\
    \ has been unused for a long period of time, the garbage collector reclaims it\
    \ and detaches its owning object, setting the sync block index to an invalid index.\
    \ Following this reclamation, the sync block can be associated with another object,\
    \ which conserves expensive operating system resources required for synchronization\
    \ mechanisms.\n\n76"
