    - WPT can provide call stacks for all processor activity on the system. It

    aggregates call stacks at the process, module, and function level, and allows
    at-a-glance

    understanding of where the system (or a specific application) is using CPU time.

    Note that managed frames are not supported—we''ll address this later with the

