    # Copying Memory


    Commonly, a data buffer received from a hardware device is copied over and until
    the application finishes processing it. Copying can become a significant source
    of CPU overhead, and thus, should be avoided for high throughput I/O code paths.
    We now survey scenarios in which you copy data and how to avoid it.


    # Unmanaged Memory


    In .NET an unmanaged memory buffer is more cumbersome to work with than a managed[],
    so programmers often take the easy way and just copy the buffer to managed memory.

    If your API or libraries let you own your buffer or have a user-defined allocator,
    manage a buffer and pin it so it can be accessed through a pointer and as a managed
    reference. If the buffer is large (>85,000 bytes) it is allocated in the Large
    Object Heap, to re-use the buffer. re-using is non-trivial due to indeterminate
    object lifetime, memory pooling, as described in Chapter 8.

    In other cases, the API or libraries allow allocating its own (unmanaged) memory
    buffer. You can access it directly with a pointer (requires unsafe) or by wrapper
    classes, such as UnmanagedMemoryStream or UnmanagedMemoryAccessor. However, if
    you need to pass the buffer to code that only works with [] or string objects,
    copying may be unavoidable.

    Even if you avoid copying, if some or most of your data is filtered early on (e.g.
    network packets), it is possible to avoid unnecessary copying by checking if the
    data is useful without copying it.


    # Exposing Part of a Buffer


    As Chapter 8 explains, programmers assume that a byte[] contains only the data
    and it spans from the beginning until the end, forcing the caller to slice the
    buffer (a new byte[] and copy only the desired part). This scenario often comes
    up in parsing a protocol stack. In contrast, unmanaged code would take a pointer,
    will have no knowledge whether it is the beginning of the allocation or not, and
    will have to take a length parameter to tell it where the data ends.

    To avoid unnecessary copying, take an offset and length parameter where you take
    a byte[]. The length parameter is used instead of the array''s Length property,
    and the offset value is added to the index.


    # Scatter–Gather I/O


    Scatter-gather is a Windows I/O capability that enables I/O transfers to or from
    a set of non-contiguous memory locations as if they were contiguous. Win32 exposes
    this capability through ReadFileScatter and WriteToFile. The Windows Sockets library
    also supports scatter-gather through its own functions: WSASend, WSARecv, as well
    as others.'
