  md: "# C++ Templates\n\nCompared to Java generics, C++ templates may appear enticing.\
    \ (They are also extremely powerful; you may have heard that the template resolution\
    \ mechanism in itself is Turing-complete.) The C++ compiler does not perform type\
    \ erasure — quite the opposite — there is no need for constraints, because the\
    \ compiler is happy to compile whatever you throw in its way. Let's start with\
    \ the list example, and then consider what happens with constraints:\n\n```\n\
    template <typename T>\nclass list {\nprivate:\n    T* items;\n    int size;\n\
    \    int capacity;\npublic:\n    list(int initialCapacity) : size(0), capacity(initialCapacity)\
    \ {\n        items = new T[initialCapacity];\n    }\n    void add(const T& item)\
    \ {\n        if (size < capacity) {\n            items[size] = item;\n       \
    \     ++size;\n        } else {\n            //Allocate a larger array, copy the\
    \ elements, then ‘place' it in it\n        }\n    }\n    const T& operator[](int\
    \ index) const {\n        if (index < 0 || index >= size) throw exception(\"Out\
    \ of bounds\");\n        return items[index];\n    }\n    //Many methods omitted\
    \ for brevity\n};\n```\n\nThe list class is completely type-safe: every instantiation\
    \ of the template creates a new class that uses the template definition as a..\
    \ template. Although this happens under the hood, here is an example of what it\
    \ could look like:\n\n```\n//Original C++ code:\nlist<int> listOfInts(14);\n```\n\
    \n```\n//Expanded by the compiler to:\nclass _list_int {\nprivate:\n    int* items;\n\
    \    int size;\n    int capacity;\npublic:\n    _list_int(int initialCapacity)\
    \ : size(0), capacity(initialCapacity) {\n        items = new int[initialCapacity];\n\
    \    }\n};\nlist_int listOfInts(14);\n```"
