  md: '# CHAPTER 11


    # Web Application Performance


    Web applications are designed to handle hundreds and even thousands of requests
    per second. To build such successfully, it is important to identify potential
    performance bottlenecks and to do everything you can prevent them from occurring.
    While handling and preventing bottlenecks in ASP.NET applications is not confined
    to your code alone. A web request reaches the server to then it reaches your application''s
    code, it passes through an HTTP pipeline and then the IIS pipeline, only to reach
    another pipeline, the ASP.NET pipeline, and only then it reaches your code. When
    you finish handling the request, response is sent down those pipelines until it
    is eventually received by the client''s machine. Every one of these pipelines
    is a potential bottleneck, so improving the performance of ASP.NET applications
    actually means both your code and the performance of the pipeline.


    When discussing ways to improve the performance of ASP.NET applications, one has
    to look further than just the application itself, and examine the various parts
    that make a web application affect its overall performance. The overall performance
    of a web application is comprised of the following:


    +   - The application''s code

    - The ASP.NET environment

    - The hosting environment (in most cases, IIS)

    - The network

    - The client-side (not discussed in this book)


    In this chapter we will briefly discuss tools for performance testing of web applications
    and explore various ways, from each of the mentioned methods, which can help us
    improve the overall performance of our application. Toward the end of the chapter,
    we will discuss the need and implications of scaling web applications and how
    to avoid known pitfalls when scaling.


    # Testing the Performance of Web Applications


    Before you start making changes to your web application, you need to know if it
    is performing well or not—up to its requirements in the SLA (service level agreement)?
    Does it behave differently under load? Are there any general issues which can
    be improved? To know this and more we need to use testing and monitoring tools
    that help identify pitfalls and bottlenecks in our web application.


    In Chapter 2 we discussed some general-purpose analysis tools to detect performance
    issues in code, such as the Visual Studio and ANTS profilers, but there are additional
    tools that can assist you in testing, measuring, and investigating the "web" part
    of your application.


    This is a brief introduction to the world of web application performance testing.
    For a more thorough description and guidance on how to plan, execute, and analyze
    web application performance testing, you can refer to the "Performance Testing
    Guidance for Web Applications" MSDN article (http://msdn.microsoft.com/library/bb924375).'
  merge: -1
