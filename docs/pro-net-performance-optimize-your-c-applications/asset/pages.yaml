  md: '# CHAPTER 7


    # Networking, I/O,

    and Serialization


    Most of this book focuses on optimizing computational aspects of application performance.
    We have seen numerous examples, such as tuning garbage collection, parallelizing
    loops and recursive algorithms, and even by coming up with better algorithms to
    reduce runtime costs.

    For some applications, optimizing only the computational aspect (CPU) overhead
    results in limited performance gains, because the performance bottleneck lies
    in I/O work, such as network transfers or disk accesses. In an experience, a considerable
    portion of performance problems encountered in the field is not caused by an unoptimized
    algorithm or excessive CPU utilization, but is due to an inefficient utilization
    of the system''s I/O device. We consider two scenarios in which optimizing I/O
    can result in performance gains:


    +   - An application might incur a significant computational (CPU) overhead due
    to use of I/O, which comes at the expense of useful work. Worse, this overhead
    might be so high that it becomes the limiting factor to realizing the full capacity
    of the I/O device.

    - The I/O device might be under-utilized or its capacity is wasted because of
    inefficient usage patterns, such as making many I/O transfers or by failing to
    keep the channel fully utilized.


    This chapter discusses strategies for improving I/O performance in general and
    network I/O performance in particular. In addition, we cover serialization performance
    and compare several serializers.


    # General I/O Concepts


    This section explores I/O concepts and provides performance guidelines pertaining
    to I/O of any kind. This advice is applicable to networking applications, heavy
    disk-access processes, and even software designed to access a high-bandwidth hardware
    device.


    # Synchronous and Asynchronous I/O


    With synchronous I/O, the I/O transfer function (e.g. ReadFile, WriteFile, or
    DeviceIoControl Win32 API functions) blocks until the I/O operation completes.
    Although this model is convenient to use, it is not very efficient. During the
    time between issuing successive I/O requests, the device may be idle and, therefore,
    is potentially under-utilized. Another problem with synchronous I/O is that a
    thread is "wasted" for each concurrently pending I/O request. For example, in
    a server serving many clients, you may end up creating a thread per session. These
    threads, which are essentially mostly idle, wasting memory


