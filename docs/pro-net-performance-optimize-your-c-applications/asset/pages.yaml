  md: '# CHAPTER 11 | WEB APPLICATION PERFORMANCE


    # Visual Studio Web Performance Test and Load Test


    Among the features available in Visual Studio Ultimate is the Web Performance
    test, which enables you to record the response time and throughput of a web application.
    With the Web Performance test, you can record the HTTP requests and responses
    which are generated by a web application, as shown in Figure 11-1. (This is supported
    in Internet Explorer only.)


    ![](img/d3ea56daae375e1d9f44d8bff55d84b7_305_0.png)


    Figure 11-1. Recording a web application with Web Test Recorder


    Once a recording has taken place, you can use recording to test the performance
    of the web application, as well as its correctness, matching the responses with
    the previously recorded responses.


    Web Performance test allows you to customize the flow of the test. You can change
    the order of requests and add new requests of your own, insert loops and conditions
    to the flow, change the headers and content of requests, add validation rules
    for responses, and ensure the entire test by converting it to code and editing
    the generated code.


    Using the Web Performance test on its own has its benefits, but in order to test
    the performance of your web application under stress, use the Web Performance
    test in conjunction with Visual Studio''s Load Test feature. This Visual Studio
    feature enables you to simulate loads on the system where multiple users are calling
    it concurrently, performing different operations on it, and to test how the system
    behave during that time, collecting various performance information such as performance
    counters and event logs.


    306'
