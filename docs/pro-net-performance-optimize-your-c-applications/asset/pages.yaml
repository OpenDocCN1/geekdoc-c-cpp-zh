  md: "# CHAPTER 3 TYPE INTERNALS\n\nThin locks are also reported by the SOS !DumpObj\
    \ command, which indicates the owner thread whose header contains a thin lock.\
    \ Similarly, the !DumpHeap -thinlock command can output all the locks currently\
    \ present in the managed heap:\n\n```\n0:004> !idumpheap -thinlock\nAddress MT\
    \ Size\n02384390 0423870 12 Thinlock owner 1 (0033ce80) Recursive 0\n02384758\
    \ 05f0f9bc 16 Thinlock owner 1 (0033ce80) Recursive 0\nFound 2 objects.\n0:004>\
    \ !idumpobj 02384390\nName:Employee\nMethodTable:00423870\nEEClass:004213d4\n\
    Size:12(0xc) bytes\nFile:D:\\...\\App.exe\nFields:\n```\n\nWhen another thread\
    \ attempts to lock the object, it will spin for a short time waiting for the lock\
    \ to be released (i.e., the owner thread information to disappear from the object\
    \ header word). If, after a certain threshold, the lock is not released, it is\
    \ converted to a sync block, the sync block index is stored within the object\
    \ header, and from that point, the threads block on the Win32 synchronization\
    \ mechanism as usual.\n\n# Value Type Internals\n\nNow that we have an idea how\
    \ references are laid out in memory and what purpose the object header fields\
    \ serve, Value types have a much simpler layout, but it introduces limitations\
    \ and boxing, an expensive process that compensates for the incompatibility of\
    \ using a value type where a reference is required. The primary reason for using\
    \ value types, as we have seen, is their excellent memory density and lack of\
    \ overhead; every bit of performance matters when you develop your own value types.\n\
    \nFor the purpose of our discussion, let's commit to a simple value type that\
    \ we develop at the onset of our chapter, Point2D, representing a point in two-dimensional\
    \ space:\n\n```\npublic struct Point2D\n{\n    public int X;\n    public int Y;\n\
    }\n```\n\nThe memory layout of a Point2D instance initialized with X=5, Y=7 is\
    \ the following, with no additional \"overhead\" fields clutter:\n\n| Value Address\
    \ | Storage for X | +0 bytes An integer |\n|---|---|-|\n| | Storage for Y | +4\
    \ bytes An integer |\n\n**Figure 3-7.** Memory layout for a Point2D value type\
    \ instance\n\n79"
