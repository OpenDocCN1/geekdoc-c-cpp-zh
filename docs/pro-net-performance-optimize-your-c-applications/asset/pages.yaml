  md: '# CHAPTER 2


    # Performance Measurement


    This book is about improving the performance of .NET applications. You can''t
    improve something that you can''t measure first, which is why our first substantial
    chapter deals with performance measurement tools and techniques. Guessing where
    the application''s bottlenecks are and jumping to premature conclusions on what
    to optimize is the worst a performance-conscious developer can do and often peril.
    As we have seen in Chapter 1, there are many interesting performance metrics that
    can be the central factor to your application''s perceived performance; in this
    chapter we will see how to obtain them.


    # Approaches to Performance Measurement


    There is more than one way to measure performance, and much depends on the context,
    the application''s complexity, the type of information required, and the accuracy
    of the obtained results.


    One approach for testing small programs or library methods is white-box testing:
    inserting source code, analyzing its complexity on the whiteboard, modifying the
    program''s source, and inserting measurement code in it. We will discuss this
    approach—often called microbenchmarking, towards the end of this chapter; it can
    be very valuable—and often where precise results and absolute understanding of
    every CPU instruction is required, but rather time-consuming and inflexible where
    large applications are concerned. If you don''t know in advance which part of
    the program to measure and reason about, isolating the bottleneck can be extremely
    difficult without resorting to automatic tools.


    For larger programs, the more common approach is black-box testing, where a performance
    metric is identified by a human and measured automatically by a tool. When using
    this, the developer doesn''t have to identify the bottleneck in advance, or assume
    that the culprit is in a certain (and small) part of the program. Though this
    chapter will consider numerous tools that analyze the application, performance
    automation presents results in an easily digestible form. Among tools are performance
    counters, Event Tracing for Windows (ETW), and commercial profilers.


    As you read this chapter, in mind that performance measurement tools can dearly
    affect application performance. Few tools can provide accurate information and
    at the same time no overhead when the application is executing. As we move from
    one tool to the next, always remember that the accuracy of the tools is often
    in conflict with the overhead they inflict upon your application.


    # Built-in Windows Tools


    Before we turn to commercial tools that need require installation and intrusively
    measure your application''s performance, it''s paramount to make sure everything
    has out-of-the-box has been used to its fullest extent. Performance counters have
    been part of Windows for nearly two decades, whereas Event Tracing for Windows
    is slightly newer and has become truly useful around the Windows time frame (2006).
    Both are free, present on every edition of Windows, and can be used for performance
    investigations with minimal overhead.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Performance Counters


    Windows performance counters are a built-in mechanism for performance and health
    investigation. Various components, including the Windows kernel, drivers, databases,
    and the CLR provide performance counters that users and administrators can consume
    and understand how well the system is functioning. As added bonus, performance
    counters for the vast majority of system components are turned on by default,
    so you will not be introducing any additional overhead when collecting this information.


    Reading performance counter information from a local or remote system is extremely
    easy. The built-in Performance Monitor tool (perfmon.exe) can display every performance
    counter available on the system, as well as log performance counter data to a
    file for subsequent investigation and provide automatic alerts when performance
    counter readers reach a predefined threshold. Performance Monitor can monitor
    remote systems if you have administrator permissions and connect through a local
    network.


    Performance information is organized in the following hierarchy:


    +   - Performance counter categories (or performance objects) represent a set
    of individual counters related to a certain system. Some examples of categories
    include .NET CLR Memory, Process Information, TCPv4, and PhysicalDisk.


    +   - Performance counters are individual numerical data in a performance counter
    category. It is common to specify the performance counter and category name separated
    by a slash, e.g., Process\Private Bytes. Performance counters have several supported
    types, including numeric information (Process\Thread Count), rate of events (Print
    Bytes Printed/sec), percentages (PhysicalDisk\Idle Time), and averages (Service\Operation3.0.0.Calls).


    +   - Performance counter instances are used to distinguish sets of counters from
    a specific component or there are several instances. For example, because there
    may be multiple instances on a system, there is an instance of the Processor Information
    category for each processor (as well as an aggregated\Total instance). Performance
    counter categories can be multi-instance—and many are single-instance (such as
    the Memory category).


    If you examine the full list of performance counters provided by a typical Windows
    system that runs .NET applications, you will find performance problems can be
    identified without using any other tool. At the very least, performance counters
    can provide a general idea of which direction to pursue when investigating a performance
    problem or inspecting data from a production system to understand if it''s behaving
    normally.


    Below are some scenarios where a system administrator or performance investigator
    can obtain a general idea of where the performance culprit lies before using headers:


    +   - If an application exhibits a memory leak, performance counters can be responsible
    for it. The Process\Private Bytes can be correlated with the .NET CLR Memory\#
    Bytes in All Heaps counter. The former accounts for all private memory allocated
    by the process (including the GC heap) which the latter accounts only for managed
    memory.


    +   - If an ASP.NET application starts exhibiting abnormal behavior, the ASP.NET
    applications can provide more insight into what''s going on. For example, the
    Requests\Sec, Requests Timed Out, Wait Time, and Requests Executing counters can
    identify extreme load conditions, the Errors Total/sec counter suggest whether
    the application is facing an unusual number of exceptions, and the various cache-
    and output cache-related counters indicate whether caching is being applied effectively.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'If a WCF service relies heavily on a database and distributed transactions
    is failing to handle its current load, the ServiceModelService category can pinpoint
