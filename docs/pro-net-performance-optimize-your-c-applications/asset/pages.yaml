    to the GAC, in C:\Windows\Assembly\NativeImages_ by default.


    Because the CLR and NGen manage the native image automatically, you should never
    copy the native images from one machine to another. The only supported way to
    pre-compile managed assemblies on a specific system is to run the NGen tool on
    that system. The ideal time to do this would be during the application''s installation
    NGen even supports a “defer” command, which will queue pre-compilation to a background
