  md: "its CompareTo method accepts a System.Object parameter, incurring a boxing\
    \ cost for value types. It stands to reason that there should be a generic version\
    \ of IComparable, IComparable<T>, which serves here perfectly:\n\n```\npublic\
    \ static int BinarySearch<T>(T[] array, T element) where T : IComparable<T> {\n\
    //At some point in the algorithm, we need to compare:\nif (array[x].CompareTo(array[y])\
    \ < 0) {\n    ...\n}\n```\n\nThis binary search version does not incur boxing\
    \ when comparing value instances, works with any type that implements IComparable<T>\
    \ (including all the built-in primitive types, strings, and many others), and\
    \ is completely type safe in it does not require runtime discovery of comparison\
    \ capabilities.\n\n# INTERFACE CONSTRAINTS AND IEQUABLE<T>\n\nIn Chapter 3 we\
    \ have seen that a critical performance optimization for value types is to override\
    \ the Equals method and implement the IEquable<T> interface. Why is this so important?\
    \ Consider the following code:\n\n```\npublic static void CallEquals<T>(T instance)\n\
    \    instance.Equals(instance);\n```\n\nThe Equals call inside the method defers\
    \ to a virtual call to Object.Equals, which accepts a System Object parameter\
    \ and causes boxing on value types. This is the only alternative the C# compiler\
    \ considers guaranteed to be present on every T we use. If we want to convince\
    \ the compiler that T has an Equals method that accepts T, we need to use an explicit\
    \ constraint:\n\n```\npublic static void CallEquals<T>(T instance) where T : IEquable<T>\n\
    \    instance.Equals(instance);\n```\n\nFinally, you might allow callers to use\
    \ any type as T, but defer to the IEquable<T> implementation if T provides it,\
    \ which does not incur boxing and is more efficient. What List<T> do in this regard\
    \ is fairly interesting. If List<T> required an IEquable<T> constraint on its\
    \ generic parameter, it wouldn't be useful for types that don't implement that.\
    \ List<T> does not have an IEquable<T> constraint. To implement the Contains method\
    \ (and other methods requiring comparison for equality), List<T> relies on an\
    \ equality comparer—a concrete implementation of the abstract EqualityComparer<T>\
    \ class (which, incidentally, implements the IEqualityComparer<T> interface, used\
    \ directly by some collections, including HashSet<T> and Dictionary<K,V>)."
