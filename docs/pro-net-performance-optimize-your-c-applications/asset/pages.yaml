    +   1. Run the application from within the profiler (Similarly to CLR Profiler,
    ANTS supports attaching to a running process, from CLR 4.0).


    +   2. Use the Take Memory Snapshot to capture an initial snapshot after the application
    has finished initializing. This snapshot is the baseline for subsequent performance
    investigations.


    +   3. As the memory leak accumulates, take additional snapshots.


    +   4. After the application terminates, compare snapshots (the baseline snapshot
    to, intermediate snapshots among themselves) to understand what types of objects
    are growing in memory.


    +   5. Focus on specific types using the Instance Categorizer to understand what
    kinds of references are retaining objects of the suspected. (At this phase you
    are inspecting references between types—instances of type A B will be grouped
    by, as if A is referencing B.)


    +   6. Explore individual instances of the suspected types using the Instance
    List. Identify several representative instances and use the Instance Retention
    Graph to determine why they are retained in memory. (At this phase you are inspecting
    references between individual objects, and can see why specific objects are not
    reclaimed by the GC.)


    +   7. Return to the application''s source code and modify it such that the leaking
    objects are no longer referenced by the problematic chain.


    At the end of the analysis process, you should have a good grasp of why the heaviest
    objects in your application are not being reclaimed by the GC. There are many
    causes of memory leaks, and the real art is to quickly discern from the haystack
    that is a million-object heap increasing the representative objects and types
    that will lead to the major leaks.


