    support, such as parameter marshalling and thread transitions (discussed in Chapter
    8). High-performance applications that exhibit a chatty interface with the operating
    system may run slower in .NET due to its interoperability layer.


    David Piegrass''s excellent CodeProject project, "Head-to-head benchmark: C++
    vs. .NET" (available at http://www.codeproject.com/Articles/212856/Head-to-head-Csharp-vs-NET),
    busts many of the misconceptions around code performance. For example, Piegrass
    demonstrates that .NET collections work faster in some cases than their C++ STL
    equivalents; the same applies to reading file line-by-line using ifstream vs.
    StreamReader. On the other hand, his benchmarks emphasize the deficiencies that
    still exist in the 4-bit JIT compiler, and the lack of SIMD intrinsics in C++
    is another contributing factor to C++''s advantage.


    # Exceptions


    Exceptions are not an expensive mechanism if used correctly and sparingly. There
    are simple guidelines that you can follow to steer clear of the risks involved
    with throwing too many exceptions and incurring a significant performance cost:


    +   - Use exceptions for exceptional conditions: if you expect an exception to
    happen frequently, considering programming defensively instead of throwing an
    exception. There are exceptions to this rule (pun intended), but in high-performance
    scenarios, a condition that occurs 10% of the time should not be handled by throwing
    an exception.


    +   - Check for exceptional conditions before invoking a method that can throw
    an exception. Examples of this approach are the Stream.CanRead and the TryParse
    family of static methods on value types (e.g., int.TryParse).


    +   - Do not throw exceptions as a control flow mechanism: do not throw an exception
    to exit a loop, to stop reading from a file, or to return information from a method.


    The biggest performance costs associated with throwing and handling exceptions
    can be categorized into several buckets:


    +   - Constructing an exception requires a stack walk (in the stack trace), which
    gets more expensive the deeper the stack is.


