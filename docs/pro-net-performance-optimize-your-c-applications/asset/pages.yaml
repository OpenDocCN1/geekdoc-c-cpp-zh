    # Managed Profile-Guided Optimization (MPGO)


    Managed profile optimization (MPGO) is a tool introduced in Visual Studio 10 and
    CLR 4.5 that optimizes the on-disk layout of native images produced by Ngen. MPGO
    generates profile information from a specified period of the application''s execution
    and embeds it into the assembly. Subsequently, Ngen uses this information to optimize
    the layout of the generated native image.


    MPGO optimizes native layout in two primary ways. First, MPGO makes sure that
    code and data which are frequently hot are placed together on disk. As a result,
    there will be fewer page faults and hits for hot data, more hits on a single page.
    Second, MPGO places potentially volatile data together. When a data page that
    is shared with other processes, Windows creates a private copy of the page for
    the modifying process to use (this is known as copy-on-write). As a result of
    MPGO''s optimization, shared pages are merged, resulting in fewer copies and lower
    memory utilization.


    To run MPGO on your application, you need to provide the list of assemblies to
    instrument, an output directory in which to place the optimized binaries, and
    a timeout after which profiling should stop. MPGO instruments the application,
    runs it, analyzes the results, and creates optimized native images for the assemblies
    you specified:'
