    // I2C EEOUT function to write to an 8-bit address Microchip\n// EEPROM part (i.e.\
    \ 24LC01) with 8 byte address (2k bit max)\n// ******************************************\n\
    ```\n\nProbably the most common use of I2C is communicating with EEPROM so I wrote\
    \ the I2C_EEOUT () and I2C_EEIN () functions to handle this communication using\
    \ the functions I previously described. You can use these as the format for future\
