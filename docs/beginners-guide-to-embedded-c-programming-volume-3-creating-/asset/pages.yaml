  md: "```\nunsigned char i2c_write( unsigned char i2cWriteData );\nvoid I2C_EEOUT\
    \ (unsigned char address, unsigned char data);\nunsigned char I2C_EKIN(unsigned\
    \ char address);\n```\n\n# simplec1.1.c – How it Works\n\nI've covered the basics\
    \ of the SimpleC library and the guts of the SimpleC.h file. For those that want\
    \ to understand the guts of this library I'll now get into the heart of the code.\
    \ This is where all the functions created in Volume I and Volume 2 of this series\
    \ comes together along with some new ones I wrote for this book. I'll take each\
    \ block and try to explain what I'm doing.\n\nThe first part of the simplec1.1.c\
    \ file is to include the header file.\n\n```\n#include \"simplec1.1.h\"\n// Library\
    \ Functions\n```\n\nThe first function is the init_micro (). The registers are\
    \ set to make the analog pins digital and turn off the comparators. I also included\
    \ the settings for using the internal oscillator but commented that out for now.\
    \ This would require everything adjusted for the slower internal clock. The final\
    \ uncommented step is to disable any interrupts.\n\n```\n//*******************************\n\
    // Initialize Microcontroller Setup\n//*******************************\n\nvoid\
    \ init_micro(void)\n{\n    ANSEL = 0;        //Analog ports set to digital\n \
    \   ANSELH = 0;\n    CM1CON0 = 0;      //Comparators Shut off\n    CM2CON0 = 0;\n\
    \    // IRCPF0 = 0;      // Set internal Oscillator to 4 Mhz\n    // IRCPF1 =\
    \ 1;\n    // IRCPF2 = 1;\n    // SCS = 1;         // Config bits define clock\n\
    \    INTCON=0;          // purpose of disabling the interrupts\n}\n```\n\nThe\
    \ next few functions handle the time delays. I explain the calculations in the\
    \ header. Recognize that the time delays rely on the Timer 0 so this kind of removes\
    \ Timer 0 as an option unless you don't want to use these functions."
