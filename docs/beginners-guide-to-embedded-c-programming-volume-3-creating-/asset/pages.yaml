    \    }\n        putch(0x0D);        // Send ASCII value for\n                \
    \            // carriage return\n        putch(0x0A);        // Send ASCII value\
    \ for new\n                            // line\n        // *********** Send a\
    \ string of characters ***************\n        char txt[] = \"Hello\";\n    \
    \    for (char x = 0; x<5; x++)\n```"
