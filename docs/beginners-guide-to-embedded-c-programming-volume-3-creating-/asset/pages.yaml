- pgno: 171
  md: 'One of the features of the standalone software is the built-in UART tool. This
    is a terminal program that uses the PICkit 2 programmer as a PIC to USB communication
    channel. You launch the software from the tools menu as shown in Figure 11-5.


    ![](img/910b145bee7ca8076318eafbe6d13997_171_0.png)


    # Figure 11-5: UART Tool Selection


    As you can see in Figure 11-5, I ran the standalone software with the MPLAB software
    in place. You could deselect the PICkit 2 from the MPLAB programmer menu to be
    safe but it worked fine for me with it still selected.


    When the UART tool is run you’ll see the screen in Figure 11-6. The upper right
    hand corner shows the baud rate as 9600. The screen shows the software was running
    in the CHIPINO when this was captured as it shows the text sent by the CHIPINO
    to the UART screen through the PICkit 2 connection.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/910b145bee7ca8076318eafbe6d13997_172_0.png)


    # Figure 11-6: UART Screen Capture


    The last thing shown is the CHIPINO asking the user to either press a keyboard
    key or to enter a character in the Send box in the lower middle of the screen.
    That character will be read by the CHIPINO and then sent back demonstrating two-way
    communications. Figure 11-7 shows the results when a capital A is sent to the
    CHIPINO from the Send window.


    This operation will continue until the Disconnect button is pressed in the upper
    left corner of the screen. You can also see in the lower left the connections
    to the PICkit 2, which is helpful if you are using this tool in the future and
    forget the connection scheme.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/910b145bee7ca8076318eafbe6d13997_173_0.png)


    Figure 11-7: UART Response Screen to Letter A


    # Software


    Now I''ll show you the software that created all this and you''ll see how the
    SimpleC library helps make this easier to write.


    ```

    /*******************************

    A simple demonstration of serial communications which

    incorporates the on-board hardware USART of the Microchip

    PIC16F886 device.

    1) The project sends ASCII numbers 1-9 out to the terminal once

    followed by a carriage return and new line command.

    2) Then it sends the ASCII values for A-Z once followed by

    a carriage return and new line command.

    3) Then it will send the word "Hello" out once.

    4) Then it will use the printf command to send phrases and

    ask for you to send it something via the keyboard and it will

    echo it back.

    The program will keep asking for input until power is lost.


    Option 1: Hyperterminal and USB to RS232 module

    ```'
