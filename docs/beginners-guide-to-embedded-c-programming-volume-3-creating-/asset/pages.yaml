- pgno: 72
  md: "# simplec1.1.h – How it Works\n\nThe header file contains the common elements\
    \ every project should have. Let me go through this file in detail. First a description\
    \ of the header and then the include files. The htc.h file is included and required\
    \ for the HI-TECH compiler. The stdio.h file which is a standard input/output\
    \ header file for an internal HI-TECH library. The stdio library handles the printf\
    \ function along with the getch and putch functions.\n\n```\n/*\n * Library of\
    \ common functions\n * For the readers of the Beginner's Guide to Embedded C book\
    \ series\n * by Chuck Hellebuyck\n * Copyright 2010\n * Version 1.1 - Written\
    \ for Chipino with 16F886\n */\n\n#include <htc.h>\n#include <stdio.h>\n```\n\n\
    The configuration settings for the PIC16F886 are included next. These set the\
    \ various features for the CHIPINO module. The CHIPINO uses a 16 Mhz crystal so\
    \ the HS mode is selected. The watchdog timer is off and the external reset is\
    \ enabled on the MCLR pin. The code is unprotected and the low voltage programming\
    \ mode is disabled since the CHIPINO is programmed with a PICkit 2. The PIC16F886\
    \ can have the internal oscillator run if the 16 Mhz crystal should fail but that\
    \ option is turned off with the config settings. The CONFIG1 register section\
    \ of the data sheet is shown below the __CONFIG line for reference.\n\n```\n__CONFIG\
    \ (HS & WDTDIS & MCLREN & UNPROTECT & LVPDIS & IESODIS & FCMDIS);\n```\n\nThe\
    \ configuration settings for the PIC16F886 are listed in the data sheet and that\
    \ is reproduced on the next page. The actual settings used by the compiler come\
    \ from the PIC16F887.h file in the HI-TECH compiler include directory. That header\
    \ file is called from the htc.h file included at the top of the SimpleC1.1.h file."
  merge: -1
  img_proc: true
- pgno: 73
  md: '# REGISTER 14-1: CONFIG1: CONFIGURATION WORD REGISTER 1


    | — | DEBUG | LVP | FCMEN | IESO | BOREN1 | BOREN0 |

    | bit 15 | | | | | | bit 8 |

    | CPD | CP | MCLRE | PWRTE | WDT | FOSC2 | FOSC1 | FOSC0 |

    | bit 7 | | | | | | | bit 0 |


    bit 15-14 Unimplemented: Read as ‘1’

    bit 13 DEBUG: In-Circuit Debugger Mode bit

    1 = In-Circuit Debugger disabled, RB6/ICSPCLK and RB7/ICSPDAT are general purpose
    I/O pins

    0 = In-Circuit Debugger enabled, RB6/ICSPCLK and RB7/ICSPDAT are dedicated to
    the debugger

    bit 12 LVP: Low Voltage Programming Enable bit

    1 = RB3/PGM pin has PGM function, low voltage programming enabled

    0 = RB3 pin is digital I/O, HV on MCLR must be used for programming

    bit 11 FCMEN: Fail-Safe Clock Monitor Enabled bit

    1 = Fail-Safe Clock Monitor is disabled

    0 = Fail-Safe Clock Monitor is enabled

    bit 10 IESO: Internal External Switchover bit

    1 = Internal External Switchover mode is disabled

    0 = Internal External Switchover mode is enabled

    bit 9-8 BOREN1:0 - Brown-Out Reset Selection bits

    11 = BOR enabled during operation and disabled in Sleep

    10 = BOR controlled by SBOREN bit of the PCON register

    01 = BOR disabled

    00 = BOR disabled

    bit 7 CPD: Data Code Protection bit

    1 = Data memory code protection is disabled

    0 = Data memory code protection is enabled

    bit 6 CP: Code Protection bit

    1 = Program memory code protection is disabled

    0 = Program memory code protection is enabled

    bit 5 MCLRE: MCLR Enable bit

    1 = MCLR pin function is MCLR

    0 = RE3 pin is digital input, MCLR internally tied to VDD

    bit 4 PWRTE: Power-up Timer Enable bit

    1 = PWRT disabled

    0 = PWRT enabled

    bit 3 WDT: Watchdog Timer Enable bit

    1 = WDT enabled

    0 = WDT disabled

    bit 2-0 FOSC2:0 - Oscillator Selection bits

    111 = RC oscillator, CLKO function on RA6/OSC2/CLKO pin, RC on RA7/OSC1/CLKI

    110 = RC oscillator, I/O function on RA6/OSC2/CLKO pin, RC on RA7/OSC1/CLKI

    101 = INTOSC oscillator, CLKO function on RA6/OSC2/CLKO pin, I/O function on RA7/OSC1/CLKI

    100 = INTOSC oscillator, I/O function on RA6/OSC2/CLKO pin, I/O function on RA7/OSC1/CLKI

    011 = INTOSC oscillator, I/O function on RA6/OSC2/CLKO pin, I/O function on RA7/OSC1/CLKI

    010 = EC oscillator, CLKO function on RA6/OSC2/CLKO pin, CLKI on RA7/OSC1/CLKI

    001 = HS oscillator, High-speed crystal on RA6/OSC2/CLKO and RA7/OSC1/CLKI

    000 = LP oscillator, Low-power crystal on RA6/OSC2/CLKO and RA7/OSC1/CLKI


