- pgno: 48
  md: '# input(pin)


    Make the specified *pin* an input and return the state of the pin. The function
    must be preceded by a variable to receive the state. *pin* may be a constant;
    0–13, or a variable that contains a number 0–13.


    **Example:**


    ```

    while()\n{\nchar var = input(8);  // Store a 1 (high) or 0 (low) in the variable
    per pin 8 level\n}

    ```


    # pulseout(pin,period)


    pulseout generates a pulse on *pin* of specified *period*. The pulse is generated
    by toggling the pin high, delaying and then low. *pin* is automatically made an
    output. *pin* and *period* may be a constant; 0–13, or a variable that contains
    a number 0–13.


    The resolution of pulseout is 10usec increments. So a *period* value of 25 creates
    a pulse of 250 microseconds long.


    ```

    while()\n{\npulseout(5,100); // Send a pulse 1000 microseconds long (1 msec) on
    pin5\n}

    ```


    # adcin(pin)


    The adcin function converts a voltage sensed on an analog pin to a digital value
    from 0 to 255 (8-bit resolution). The parameter *pin* designates which analog
    pin to sense and convert. SimpleC supports 5 analog pins numbered 0 thru 4. This
    correlates to the AN0 thru AN4 pins of the Microchip PIC. The function is actually
    used in an equation that puts the result in a variable. The voltage can range
    from 0v to 5v but never exceed this range.


    Example


    ```

    while()\n{\nchar var = adcin(1)    // Convert voltage on AN1 pin and store in
    variable var\n}

    ```'
