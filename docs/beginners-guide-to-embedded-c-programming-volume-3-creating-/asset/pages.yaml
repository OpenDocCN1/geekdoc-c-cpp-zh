  md: "```\n// i2c_write - write unsigned char - returns ACK\n//\n//**********************************************************\n\
    void i2c_init()\n{\nTRISC3=1;      // set SCL and SDA pins as inputs\nTRISC4=1;\n\
    SSPCON = 0x38;  // set I2C master mode\nSSPCON2 = 0x00;\n// Formula for SSPADD\
    \ register value: SSPADD = [(Fosc/4)/BitRate] - 1\nSSPADD = 0x27;   // 100K at\
    \ 16Mhz clock\n                 // [(16Mhz/4)/100khz]-1 = 39 or 0x27 hex\n\nSMP=1;\
    \           // disable slew rate control for 100khz operation\nSSPIF=0;      \
    \   // clear SSPIF interrupt flag\nBCLIF=0;         // clear bus collision flag\n\
    }\n```\n\nYou have to make sure the I2C bus is ready for transmit or receive so\
    \ a function to test the status bits is handled with the i2c_waitForIdle routine.\n\
    \n```\n//**********************************************************\nvoid i2c_waitForIdle()\n\
    {\nwhile ((SSPCON2 & 0x1F ) | RW ){}; // wait for idle and not writing\n}\n```\n\
    \nAn I2C start bit is created with the i2c_start( ) function.\n\n```\n//**********************************************************\n\
    void i2c_start()\n{\ni2c_waitForIdle();\nSEN=1;\n}\n```\n\nAn I2C repeat start\
    \ bit is created with the i2c_repstart( ) function.\n\n```\n//**********************************************************\n\
    void i2c_repStart()\n{\ni2c_waitForIdle();\nRSEN=1;\n}\n```"
