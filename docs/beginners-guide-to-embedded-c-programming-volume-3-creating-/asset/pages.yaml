- pgno: 122
  md: '# Chapter 6 – SimpleC LCD Control


    Controlling a 2x16 LCD character module with a single command line would extremely
    useful. I’ve seen this done in BASIC compilers that one command line had numerous
    different parameter options. Rather than have multiple options I decided to create
    a set of simple functions for displaying characters and numbers on a 2x16 LCD.
    This chapter details how to use this feature of the SimpleC library with two separate
    software projects using one common hardware setup.


    # Hardware


    The hardware connections are defined in the simplec1.1.h file using the PORTB
    pins, which are pins 8 thru 13 on the CHIPINO. These six pins control the E, RS
    and DB4-DB7 pins of the LCD module, which is all you need for 4-bit mode operation,
    the most common LCD control. The schematic in Figure 6-1 shows the connections
    and the breadboard layout is shown in Figure 6-2A. Figure 6-2B is for those using
    a CHIPINO module.


    ![](img/910b145bee7ca8076318eafbe6d13997_122_0.png)


    Figure 6-1: LCD Schematic'
  merge: -1
  img_proc: true
- pgno: 123
  md: '![](img/910b145bee7ca8076318eafbe6d13997_123_0.png)


    # Figure 6-2A: LCD Breadboard Setup


    ![](img/910b145bee7ca8076318eafbe6d13997_123_1.png)


    # Figure 6-2B: CHIPINO Module with LCD


    This hardware setup will work for both of the software projects to follow.

    The Vo pin of the LCD is grounded which gives maximum contrast. On some LCD''s
    this makes it tough to read so you may want to add a resistor divider or potentiometer
    output on that pin so you can adjust the voltage and thus the contrast.'
