    \     {                                  // in milliseconds.\n               \
    \ msecbase();                //Jump to millisec delay routine\n        }\n}\n\
    ```\n\nThe high ( ) function and low ( ) are really a way of setting a port pin\
    \ high or low for the true beginner. If you don’t want to learn or haven’t learned\
    \ about setting the TRIS register and then the PORT register, this command handles\
    \ it for you. It sets the individual bits for the pin you want to use. It also\
    \ simplified the definition of the port pin to numbers that match the numbers\
    \ on the CHIPINO board. These are handy but probably a bad habit for when you\
    \ try to control ports outside of the CHIPINO world. Controlling the port directly\
    \ is a preferred programming method.\n\n```\n// *******************************************************\n\
    // High Command to set a port high\n// *******************************************************\n\
    \nvoid high(char pin)\n{\nswitch(pin)\n{\n        case 0:\n                TRISC7\
    \ = 0;              // Make RC7 an Output\n                RC7 = 1;          \
    \       // Set RC7 High\n                break;\n\n        case 1:\n         \
    \       TRISC6 = 0;              // Make RC6 an Output\n                RC6 =\
    \ 1;                 // Set RC6 High\n                break;\n\n        case 2:\n\
    \                TRISC5 = 0;              // Make RC5 an Output\n            \
    \    RC5 = 1;                 // Set RC5 High\n                break;\n```"
