- pgno: 30
  md: "```\n/*\n * I2C External EEPROM example using SimpleC\n * This code will write\
    \ 10 bytes to the EEPROM and\n * then read them back and display binary value\
    \ on LEDs.\n *\n * Connections:\n * Pin 8(B0) - LED Anode - LED Cathode - 1k ohm\
    \ - Ground\n * Pin 9(B1) - LED Anode - LED Cathode - 1k ohm - Ground\n * Pin 10(B2)\
    \ - LED Anode - LED Cathode - 1k ohm - Ground\n * Pin 11(B3) - LED Anode - LED\
    \ Cathode - 1k ohm - Ground\n *\n * Pin 3(C4) - 24LC01B SDA - 10k pullup - 5v\n\
    \ * Pin 4(C3) - 24LC01B SCL - 10k pullup - 5v\n * 24LC01B Vss - Ground\n * 24LC01B\
    \ Vdd - 5v\n */\n\n#include <htc.h>\n#include <stdio.h>\n__CONFIG (HS & WDTDIS\
    \ & MCLREN & UNPROTECT & LVP DIS);\n\n//***********************************************\n\
    // Initialize Microcontroller Setup\n//***********************************************\n\
    \nvoid init_micro(void)\n{\n    ANSEL = 0;          //Analog ports set to digital\n\
    \    ANSELH = 0;\n    CM1CON0 = 0;        //Comparators Shut off\n    CM2CON0\
    \ = 0;\n    INTCON=0;           // purpose of disabling the interrupts\n}\n\n\
    /* *******************************************\n * msecbase - 1 msec pause routine\n\
    \ * The External oscillator is set to 16 Mhz and the\n * internal instruction\
    \ clock is 1/4 of the oscillator.\n * This makes the internal instruction clock\
    \ 4 Mhz or\n * 0.25 usec per clock pulse.\n * Using the 1:16 prescaler on the\
    \ clock input to Timer0\n * slows the Timer0 count increment to 1 count/4 usec.\n\
    \ * Therefore 250 counts of the Timer0 would make a one\n * millisecond delay\
    \ (250 * 4 usec). But there are other\n * instructions in the delay loop so using\
    \ the MPLAB\n * stopwatch we find that we need Timer0 to overflow at\n * 243 clock\
    \ ticks. Preset Timer0 to 13 (0D hex) to make\n * Timer0 overflow at 243 clock\
    \ ticks (256-13 = 243).*********/\n\nvoid msecbase(void)\n{\n    OPTION = 0b00000011;\
    \    //Set prescaler to TMRO 1:16\n    TMRO = 0xD;             //Preset TMRO to\
    \ overflow on 243 counts\n    while(!T0IF);           //Stay until TMRO overflow\
    \ flag equals 1\n    T0IF = 0;               //Clear the TMRO overflow flag\n\
    }\n```"
  merge: -1
