- pgno: 9
  md: 'clone programmer that CHIPAXE.com offers for those that want a second programmer
    at a discount. If you want to use the new PICkit 3 you can use that as well with
    these modules.


    This book will show you how I created what I call the “SimpleC library” of useful
    functions and then show several projects that demonstrate how to use the library.
    I found this library so useful I now use it for most of my HI-TECH C projects.
    I won’t claim this is the best C code out there but I think you’ll see that these
    functions will save you a lot of time and effort when you are developing a quick
    prototype or development project. They form a great library of functions that
    are all open source so you can change them to fit your needs. Using the library
    doesn’t take away from you using the core features of the HI-TECH compiler either.
    All the code I taught you in the first two books can be applied to this setup
    as well.


    This book also covers a topic left out of the previous two and that is I2C communication.
    The PIC16F886 has an improved communication peripheral port that makes I2C much
    easier to control. Chapter 2 will cover this prior to the book diving deep into
    the SimpleC library.


    The software in this book can be downloaded from my website at www.elproducts.com/cbook3files.
    Any error corrections can also be found posted on my website (www.elproducts.com).
    No book is perfect despite all the attempts to edit it multiple times and catch
    the errors but we did our best to reduce it down to a minimum. If you run into
    a problem or just have a question on the content in this book, you can contact
    me at chuck@elproducts.com. I try to answer all email I receive though some does
    get caught in the spam filters. If you don’t hear back from me then send your
    email again because I probably never saw it the first time.


    I hope you gain even more embedded C knowledge from this book and stop by my website
    often to see what I’m working on next. I hope to have more information added to
    it from time to time as it’s dedicated to helping readers learn how to develop
    their own interesting electronic products.


    Chuck Hellebuyck'
