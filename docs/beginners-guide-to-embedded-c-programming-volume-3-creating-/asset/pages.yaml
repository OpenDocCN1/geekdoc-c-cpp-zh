  md: '# Chapter 12 – SimpleC I2C Communication


    We started the projects in this book with an I2C communication project.

    We''ll end it the same way only this time we''ll use the SimpleC library to make
    the software much easier to write. The project hardware and operation will be
    the same as Chapter 2 but will demonstrate how the SimpleC library makes this
    same project much easier to implement in software.


    # Hardware


    If you happen to have the hardware still setup from Chapter 2 then you are ready
    for software. If not, the 24LC01B chip is connected to the CHIPINO pin 3 and 4
    (RC3 and RC3) and the LEDs connected to pins 8 thru 11 (RB0 thru RB3). The rest
    is built into the CHIPINO.


    ![](img/910b145bee7ca8076318eafbe6d13997_180_0.png)


    Figure 12-1: EEPROM Schematic'
