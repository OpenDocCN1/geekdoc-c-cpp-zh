- pgno: 33
  md: "```\n{\n    i2c_start();\n    i2c_write(0xa0);\n    i2c_write(address);\n \
    \   i2c_write(data);\n    i2c_stop();\n    pause(1);\n}\n\n// *******************************************************\n\
    // I2C_EEIN function to read from an 8-bit address Microchip\n// EEPROM part (i.e.\
    \ 24LC01) with 8 byte address (2K bit max)\n// *******************************************************\n\
    \nunsigned char I2C_EEIN(unsigned char address)\n{\n    unsigned char data;\n\n\
    \    i2c_start();\n    i2c_write(0xa0);\n    i2c_write(address);\n    i2c_repStart();\n\
    \    i2c_write(0xa1);\n    data=i2c_read(0);\n    i2c_stop();\n    return(data);\n\
    }\n\n// *******************************************************\n//  Main Program\
    \ Loop\n// *******************************************************\n\nvoid\nmain(void)\n\
    {\n    init_micro();// Initialize I/O\n    i2c_init();        // Initialize I2C\n\
    \    PORTB=0x00;        // All LEDs off\n    TRISB=0x00;        // All PORTB outputs\n\
    \n    unsigned char cnt=0;        // Create variable and initialize to zero\n\n\
    \    while(cnt<=10)  /* write 10 numbers to eeprom */\n    {\n        PORTB=cnt;\
    \              // The cnt value will display on the LEDs\n        I2C_EEOUT(cnt,10-cnt);\
    \  // Store 9 at address 1, 8 at address 2, ...\n        cnt=cnt+1;          \
    \    // Increment cnt variable\n        pause(255);             // Delay 255 milliseconds\n\
    \    }\n\n    cnt=0;\n\n    while(cnt<=10)\n    {\n        PORTB = I2C_EEIN(cnt);\
    \ // Display data read from EEPROM on LEDs in binary\n        pause (1000);  \
    \       // Delay for 1 second to read LEDs\n        cnt=cnt + 1;           //\
    \ Increment cnt variable\n    }\n}\n```"
