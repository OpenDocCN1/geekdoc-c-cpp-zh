    \ to TMR0 1:16\n        TMR0 = 0xD;                 //Preset TMR0 to overflow\
    \ on 243 counts\n        while(!T0IF);               //Stay until TMR0 overflow\
    \ flag equals 1\n        T0IF = 0;                   //Clear the TMR0 overflow\
    \ flag\n}\n\n//*******************************************************\n//pause\
