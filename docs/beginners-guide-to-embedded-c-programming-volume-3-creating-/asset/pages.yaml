  md: '# Chapter 4 – SimpleC Digital Output


    This may seem like we are retracing our steps if you have read through Volume
    1 of this book series but we have to start with the basics to make sure everything
    is working correctly. The best way to do that is with a flash LED project. You
    can easily replace the LED with a transistor driving a relay or any item that
    can be digitally controlled. The point is to show how to drive a port pin with
    the SimpleC library function high(). For those new to MPLAB I’ll step through
    creating a software project in this chapter. You can use this for a reference
    in future project chapters since I won’t bore you with this for every project.
    Once you learn it for one project, it will work for all.


    # Project Creation in MPLAB


    The software is already pre-written and available to download from my website
    at http://www.elproducts.com/ebook3files. To get started creating a project in
    MPLAB we use the project wizard. You should have the MPLAB icon on your desktop
    so double click on it to open MPLAB. You should see the screen below.


    ![](img/910b145bee7ca8076318eafbe6d13997_100_0.png)


    Figure 4-1: MPLAB Initial Screen'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'As you can see, MPLAB doesn''t have much to show but it''s where it all starts.
    I''ll now step you through creating a project in MPLAB. Every time you want to
    start a new software design you will create a project. That project will have
    all your c files and header files included plus any supporting files you might
    include. When the project is fully setup, MPLAB will save two files under the
    suffix “.mcp” and “.mcw” (i.e. project1.mcp).


    The “.mcp” file will link all your software files and the “.mcw” will link all
    the windows you have open in your MPLAB setup. If you open any of the simulator
    windows or any of the many features built into MPLAB, you won’t have to do that
    again because all of it will be saved in the “.mcw” file so you can easily get
    back to where you were if you have to shut down your project.


    To make creating a project easier, MPLAB has a “wizard” feature that will step
    you through creating a project. We’ll do that here with the first project so you
    see how to set a project up using the wizard. Figure 4-2 shows the first step.


    ![](img/910b145bee7ca8076318eafbe6d13997_101_0.png)


    Figure 4-2: MPLAB Project Wizard Selection'
