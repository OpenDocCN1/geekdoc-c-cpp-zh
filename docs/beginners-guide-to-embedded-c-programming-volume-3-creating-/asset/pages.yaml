- pgno: 160
  md: '# Chapter 10 – SimpleC Creating Pulses


    The PWM function is really useful for continuous frequency outputs, but sometimes
    you want to create a pulse or burst of pulses and possibly run much slower than
    the PWM peripheral is capable of. For this reason the pulseout function was created.
    It is really useful for creating the pulses required to drive a robotic servomotor.
    In this chapter I’ll show how to use the SimpleC pulseout command to create two
    pulses that drive a servomotor fully counterclockwise and then fully clockwise.
    If it’s a continuous rotation servo connected to the wheel of a robot, this project
    could be used to drive the wheel forward and then backward. This simple motion
    can be expanded to create a robotic drive routine. Let’s save this for the Next
    Steps section and just look at the hardware setup.


    # Hardware


    The hardware used for this project includes a continuous rotation servomotor.
    Any one will work that can operate at 4.5v. When driving a noisy electrical device
    like a motor it is best to power the microcontroller separate from the motor.
    For this reason we use a 4.5v battery pack made from three AA batteries. The servo
    motor control line is connected to CHIPINO pin 0 (C7 of the PIC16F886). The CHIPINO
    ground and the 4.5v battery pack ground are connected together to maintain a common
    reference. The power pin of the servo connector is then connected to the positive
    lead of the 4.5v battery pack. This is shown in Figure 10-1 as a schematic and
    then the breadboard setup in Figure 10-2A and 10-2B.'
  merge: -1
  img_proc: true
