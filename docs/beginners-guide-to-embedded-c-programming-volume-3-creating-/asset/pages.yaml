- pgno: 34
  md: "# How it Works\n\nThe top of the program has a title block that the compiler\
    \ recognizes as comments. The title block starts with a \"/*\" and much later\
    \ ends with a \"*/\". This indicates that everything in-between is just comments\
    \ and not code.\n\nThe program will send 10 data bytes to external EEPROM at a\
    \ fast rate and display each value stored on four LEDs as a binary value. It will\
    \ then read each byte back from the EEPROM and display the value in binary on\
    \ the four LEDs. The write section will count up in binary from 1 to 9 quickly\
    \ and then the read section will go slower and count down from 9 to 1 in binary\
    \ format.\n\n```\n/*\n * I2C External EEPROM example using SimpleC\n * This code\
    \ will write 10 bytes to the EEPROM and\n * then read them back and display binary\
    \ value on LEDs.\n *\n * Connections:\n * Pin 8(B0) - LED Anode - LED Cathode\
    \ - 1k ohm - Ground\n * Pin 9(B1) - LED Anode - LED Cathode - 1k ohm - Ground\n\
    \ * Pin 10(B2) - LED Anode - LED Cathode - 1k ohm - Ground\n * Pin 11(B3) - LED\
    \ Anode - LED Cathode - 1k ohm - Ground\n *\n * Pin 3(C4) - 24LC01B SDA - 10k\
    \ pullup - 5v\n * Pin 4(C3) - 24LC01B SCL - 10k pullup - 5v\n * 24LC01B Vss -\
    \ Ground\n * 24LC01B Vdd - 5v\n */\n```\n\nThe next section includes the header\
    \ file htc.h required by the HI-TECH compiler. The stdio.h file is optional for\
    \ this project but used for some library functions built into the HI-TECH compiler.\
    \ The configuration settings for the CHIPINO's PIC16F886 are included next. These\
    \ include:\n\n+   - HS – High Speed Oscillator Setting\n+   - WDTDIS – Watchdog\
    \ Timer Disabled\n+   - MCLREN – Master Clear Pin Enabled as a Reset Pin\n+  \
    \ - UNPROTECT – Allow the program to be read from the chip\n+   - LVPDIS – Disable\
    \ low voltage programming\n\n```\n#include <htc.h>\n#include <stdio.h>\n__CONFIG\
    \ (HS & WDTDIS & MCLREN & UNPROTECT & LVPDIS);\n```"
  merge: -1
  img_proc: true
- pgno: 35
  md: "The next section creates a simple function that initializes the ports to digital\
    \ mode with analog and comparators turned off. It also disables interrupts to\
    \ start. I will include this same function in the SimpleC library.\n\n```\n```c\n\
    /************************************************\n// Initialize Microcontroller\
    \ Setup\n/************************************************\n\nvoid init_micro(void)\n\
    {\n        ANSEL = 0;          //Analog ports set to digital\n        ANSELH =\
    \ 0;\n        CM1CON0 = 0;        //Comparators Shut off\n        CM2CON0 = 0;\n\
    \        INTCON=0;           // Disable the interrupts\n}\n```\n```\n\nThe next\
    \ section should be familiar if you’ve read Volume 1 or 2 of this series. It’s\
    \ a millisecond base function and then a pause function to create an easy delay.\
    \ Timer0 is used for this and these functions will also be included in the SimpleC\
    \ library. This version is adjusted for the 16 Mhz crystal on the CHIPINO.\n\n\
    ```\n```c\n/************************************************\n* msecbase = 1 msec\
    \ pause routine\n* The oscillator is set to 16 Mhz and the\n* internal instruction\
    \ clock is 1/4 of the oscillator.\n* This makes the internal instruction clock\
    \ 4 Mhz or\n* 0.25 usec per clock pulse.\n* Using the 1:16 prescaler on the clock\
    \ input to Timer0\n* slows the Timer0 count increment to 4 usec.\n* Therefore\
    \ 250 counts of the Timer0 would make a one\n* millisecond delay (250 * 4 usec).\
    \ But there are other\n* instructions in the delay loop so using the MPLAB\n*\
    \ stopwatch we find that we need Timer0 to overflow at\n* 243 clock ticks. Preset\
    \ Timer0 to 13 (0D hex) to make\n* Timer0 overflow at 243 clock ticks (256-13\
    \ = 243).\n************************************************/\n\nvoid msecbase(void)\n\
    {\n        OPTION = 0b00000011;       //Set prescaler to TMR0 1:16\n        TMR0\
    \ = 0x0d;               //Preset TMR0 to overflow on 243 counts\n        while(!T0IF);\
    \              //Stay until TMR0 overflow flag equals 1\n        T0IF = 0;   \
    \               //Clear the TMR0 overflow flag\n}\n\n/************************************************\n\
    //Pause - millisecond delay routine 1 to 65,535 milliseconds\n/************************************************\n\
    \nvoid pause( unsigned long usvalue )\n{\n```\n```"
