- pgno: 126
  md: "The screen of the LCD is cleared with the lcd_clear function. This clears the\
    \ screen and positions the cursor at the home or first character block position.\n\
    \n```\nlcd_clear();    // Clear LCD screen\n```\n\nNow we enter the main while\
    \ loop that actually displays the count on the LCD. The while-loop contains a\
    \ for-loop that creates and increments an 8-bit variable. When the variable equals\
    \ 10, the for-loop ends.\n\n```\nwhile (1==1)\n{\n    for (char x=0;x<10;x=x+1)\
    \    // Create count of 0 thru 9\n    {\n```\n\nThe first SimpleC function in\
    \ the for-loop is the lcd_goto function. This function has the parameter 0 so\
    \ it positions the cursor at the first position of the LCD. This was already done\
    \ when we cleared the screen but in the loop we need to reposition it each time.\n\
    \n```\nlcd_goto(0);    // Select first line\n```\n\nThe next SimpleC function\
    \ we use is the lcd_symbol function. This sends the ASCII value in the parameter\
    \ section to the LCD. In this case we send the loop variable value (0-9) to the\
    \ LCD but first add the hex value 30 to create the proper ASCII value to send.\
    \ The number 1 has the ASCII value 31 hex, 32 hex is for 2, etc.\n\n```\nlcd_symbol(0x30+x);\
    \    // Display decimal value\n```\n\nThe program then uses the SimpleC pause\
    \ function to delay 1000 milliseconds or 1 second before incrementing the variable.\
    \ This makes the numbers change at a one second rate. From there the while-loop\
    \ ends and so does the main-loop so this code runs over and over again.\n\n```\n\
    pause(1000);    // Delay to read display\n} //End While\n} //End Main\n```"
  merge: -1
  img_proc: true
- pgno: 127
  md: "# Software Project 2\n\nWriting ASCII characters to the LCD is useful but more\
    \ often you'll probably want to display a full message of text. Sending each individual\
    \ ASCII character could do this or you could use the lcd_text function in SimpleC.\
    \ This next project uses that function to display a message on the first and second\
    \ line of the 2x16 LCD.\n\n```\n/*\nThis project creates a message on a 2x16 LCD\
    \ module\nusing the lcd_text() function.\n\nLCD\nPIN 1 - Gnd\nPIN 2 - 5v\nPIN\
    \ 3 - Gnd\nPIN 4 - RB4/CHIPINO Pin 12 (RS)\nPIN 5 - Gnd\nPIN 6 - RB5/CHIPINO Pin\
    \ 13 (EN)\nPIN 7 - NC\nPIN 8 - NC\nPIN 9 - NC\nPIN 10 - NC\nPIN 11 - RB0/CHIPINO\
    \ Pin 8 (DB4)\nPIN 12 - RB1/CHIPINO Pin 9 (DB5)\nPIN 13 - RB2/CHIPINO Pin10 (DB6)\n\
    PIN 14 - RB3/CHIPINO Pin11 (DB7)\n\n*/\n\n#include \"simplec1.1.h\"\n\nvoid main(void)\n\
    {\n    init_micro();    // Initialize I/O\n    lcd_init();      // Initialize\
    \ LCD Display\n    lcd_clear();     // Clear LCD screen\n\n    while (1==1)\n\
    \    {\n        lcd_goto(0);                // Select first line\n        lcd_text(\"\
    Simple C Makes\");    // Display Hello World\n\n        lcd_goto(0x40);      \
    \       // Select second line\n        lcd_text(\"Programming Easy\");\n\n   \
    \     pause (10000);              // Delay for 1 second to read display\n    }\
    \ //End While\n} //End Main\n```"
