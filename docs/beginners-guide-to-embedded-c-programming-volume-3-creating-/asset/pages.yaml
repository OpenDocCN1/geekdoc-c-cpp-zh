    \ 24LC01) with 8 byte address (2k bit max)\n// *******************************************\n\
    unsigned char I2C_EEIN(unsigned char address)\n{\n    unsigned char data;\n\n\
    \    i2c_start();\n    i2c_write(0xA0);\n    i2c_write(address);\n    i2c_repStart();\n\
    \    i2c_write(0xA1);\n    data=i2c_read(0);\n    i2c_stop();\n    return(data);\n\
    }\n```\n\nAll the functions prior will be part of the SimpleC library. The main\
    \ loop of code is where it all comes together for this project. The init_micro()\
