- pgno: 143
  md: '# Project 2 – Inputs from MCP23S08


    The MCP23S08 is a SPI I/O expander and is great for adding up to eight digital
    pins to your project by sacrificing the four SPI pins. This project doesn''t use
    all eight but does use a few to show how to sense a switch with the MCP23S08 and
    then control LEDs based on the state of the switch. The communication between
    the PIC16F886 and the MCP23S08 is through the SPI peripheral. The SimpleC library
    has functions specific for this MCP23S08 chip so the code is easier to write.


    # Hardware


    The schematic is shown in Figure 8-3 and shows all the connections to the PIC
    along with the two LEDs and switch connected to the MCP23S08. The breadboard version
    is shown in Figure 8-4A using the CHIPINO Mini and Figure 8-4B uses the CHIPINO
    module. In this case I only show the CHIPINO Mini version of the breadboard setup.
    Power to the rails is supplied through the CHIPINO Mini module, which gets its
    power from the PICkit 2 programmer (not shown in picture). The upper power rail
    has ground on the outer space while 5v is on the inner rail. The lower power rail
    is the opposite. The two positive rails are connected together at the right side
    of the breadboard. The 10k resistor that connects to the switch appears to share
    the same hole as the wire, which it does in this picture. In reality the resistor
    was one hole higher but the drawing software wouldn''t allow it so I left them
    sharing a hole.'
  merge: -1
  img_proc: true
