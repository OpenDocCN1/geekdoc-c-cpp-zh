- pgno: 178
  md: 'serial communication easier as well. This makes a great debug tool as well
    if you just want to send some status data. The PICkit 2 software can also collect
    and store characters received.


    # Next Steps


    I first suggest you try both the PICkit 2 and a USB to TTL converter module method
    of communication. Even though I didn’t show how to use a USB converter method,
    I did test it and it worked quite well. There are many different USB converter
    boards available so I won’t single one out here.


    Changing the messages sent is an easy next step but getting the PICkit 2 to collect
    data and then opening that file in EXCEL or any spreadsheet program can be a great
    use of this project. You could combine an analog sensor reading program with this
    to create a data logger application. This is very handy and that is why the serial
    port is still popular in the embedded world even though the PC world has decided
    to move on.'
