    \n```\n// *******************************************\n// Main Program Loop\n\
    // *******************************************\n\nvoid main(void)\n{\n    init_micro();\
    \ // Initialize I/O\n    i2c_init();      // Initialize i2c\n    PORTB=0x00; \
    \     // All LEDs off\n    TRISB=0x00;      // All PORTB outputs\n```\n\nA variable\
    \ “cnt” is created that is used as a counter so 10 data values can be sent out\
