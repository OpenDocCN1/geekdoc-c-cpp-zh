- pgno: 121
  md: "Now that we have the state of the switch stored we can test it to perform different\
    \ operations. If the value is 1 or switch is idle, then using the high and low\
    \ functions we turn on one LED and turn off the other. If the switch is pressed\
    \ then the reverse lighting of the LEDs occurs. This runs continuous so we can\
    \ see any press or release of the switch quickly.\n\n```\nif (value == 1)\n{\n\
    \    //*** Switch is idle ***\n    high(11);     // Pin 11 LED on\n    low(10);\
    \      // Pin 10 LED off\n}\nelse\n{\n    //*** Switch is Pressed ***\n    low(11);\
    \      // Pin 11 LED off\n    high(10);     // Pin 10 LED on\n}\n}\n```\n\n# Next\
    \ Steps\n\nAn obvious next step is to change what happens when the switch is pressed.\
    \ As you get more knowledgeable of the SimpleC library you will find it very easy\
    \ to display something on an LCD or to send a SPI or I2C signal when the switch\
    \ is pressed."
