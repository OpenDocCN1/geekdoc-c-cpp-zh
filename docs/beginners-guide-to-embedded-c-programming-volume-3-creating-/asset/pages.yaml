    proper input/output state by controlling the IODIR directory. This label IODIR
    is defined in the simplec1.1.h file. The settings are similar to a PIC in that
    a 1 is an input and a 0 is an output. So the 8 pins on the MCP23S08 are set to
    make the GP0 pin an input and the rest are outputs.


    ```

