    All those functions created were used to run that main loop of code that is only
    about 16 lines of code. Putting all those functions in a library file is how SimpleC
    makes C programming easier.


    # Next Steps


    This project has many options to change. You can change the data being stored
    but depending on the data you select it may be difficult to read with four LEDs
    as binary data. A great addition would be to replace the LEDs with an LCD display.
    That would make it much easier to understand. I used the LEDs to make it simple
    from a hardware perspective. Speaking of simple, SimpleC will make adding an LCD
    to this project quite easy. The last project in this book will show how to do
    this same project using the SimpleC library so why wait any longer. Let’s jump
    into the creation of the SimpleC library and make Embedded C Programming even
    easier for the beginner.'
