    \ function is used to receive data from a Microchip I2C serial EEPROM. It is written\
    \ to specifically read from those parts with an 8-bit address.\n\nExample:\n\n\
    ```\n#include <simplec_1.1.h>\n\nvoid\nmain(void)\n{\n    init_micro();      \
    \  // Initialize I/O\n    i2c_init();          // Initialize i2c\n    PORTB=0x00;\
    \          // All LEDs off\n    TRISB=0x00;          // All PORTB outputs\n\n\
    \    unsigned char cnt=0;\n\n    while(cnt<=10)  /* write 10 numbers to eeprom\
    \ */\n    {\n        PORTB=cnt;        // The cnt value will display on the LEDs\n\
    \        I2C_EEOUT(cnt,10-cnt);  // Store 9 at address 1, 8 at address 2, ...\n\
    \        cnt=cnt+1;        // Increment cnt variable\n        pause(255);    \
    \   // Delay 255 milliseconds\n    }\n\n    cnt=0;\n\n    while(cnt<=10)\n   \
    \ {\n        PORTB=I2C_EEIN(cnt); // Display data read from EEPROM on LEDs in\
    \ binary\n        pause (1000);        // Delay for 1 second to read LEDs\n  \
    \      cnt=cnt + 1;         // Increment cnt variable\n    }\n}\n```"
