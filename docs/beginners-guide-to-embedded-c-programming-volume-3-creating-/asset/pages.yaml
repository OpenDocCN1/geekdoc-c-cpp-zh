- pgno: 157
  md: '# Software


    The full software listing is below. You can see it''s very short. The program
    uses the adcin function along with the pwmout functions in the SimpleC library
    to create this project.


    ```

    /*********************************

    PWM Example

    This program reads the value on a potentiometer and drives

    the PWM1(CHIPINO pin5/C2) with a duty cycle to match.

    It also drives the PWM2(CHIPINO pin6/C1) with a 50% duty cycle

    signal.

    POT

    PIN 1 - Gnd

    PIN 2 - CHIPINO Analog pin 0 (AN0)

    PIN 3 - 5v


    CHIPINO Pin 5 - PWM1 output to 1k resistor

    1k resistor to LED Anode

    LED Cathode to ground


    CHIPINO Pin 6 - PWM1 output to 1k resistor

    1k resistor to LED Anode

    LED Cathode to ground

    *********************************/


    #include "simplec1.1.h"


    void main(void)

    {

    init_micro();       // Initialize I/O

    char dc = (adcin(0)/10) * 4;  // Convert Pot value to 0-100% Duty Cycle


    // **** Both PWM must use the same frequency!******

    pwmout1 (dc, 5000);     //Drive variable duty cycle at fixed 5000hz

    pwmout2 (50, 5000);     //Second PWM output 50% Duty Cycle

    pause(100);                 // Pause 100msec

    }

    ```


    # How it Works


    The program begins with a comment block describing the operation and the connections
    on the breadboard.


    ```

    /*********************************

    PWM Example

    This program reads the value on a potentiometer and drives

    the PWM1(CHIPINO pin5/C2) with a duty cycle to match.

    It also drives the PWM2(CHIPINO pin6/C1) with a 50% duty cycle

    signal.

    ```'
  merge: -1
  img_proc: true
- pgno: 158
  md: "POT\nPIN 1 - Gnd\nPIN 2 - CHIPINO Analog pin 0 (AN0)\nPIN 3 - 5v\n\nCHIPINO\
    \ Pin 5 - PWM1 output to 1k resistor,\n1k resistor to LED Anode\nLED Cathode to\
    \ ground\n\nCHIPINO Pin 6 - PWM2 output to 1k resistor,\n1k resistor to LED Anode\n\
    LED Cathode to ground\n*****************************/\n\nThe first coding step\
    \ is to include the simplec1.1.h file that has all the SimpleC setup such as configuration\
    \ bits and some #defines.\n\n```\n#include \"simplec1.1.h\"\n```\n\nNow we enter\
    \ the main loop which starts off by initializing the comparators to off and all\
    \ the analog pins to digital with the init_micro SimpleC function.\n\n```\nvoid\
    \ main(void)\n{\n    init_micro();            // Initialize I/O\n}\n```\n\nThe\
    \ adcin function is used to read the potentiometer. This function automatically\
    \ sets the selected pin to analog input mode. In this case it’s AN0 (shown as\
    \ 0 in the parameter area). This line also shows that you can do operations on\
    \ the reading prior to storing the result in the variable “dc” which is short\
    \ for duty cycle. The value we read from the potentiometer will be an 8-bit resolution\
    \ value of 0 to 255. We need to scale that to 0 - 100 for the pwmout functions\
    \ so we divide it by 10 (yielding 0 - 25) and then take that result and multiply\
    \ by 4. This will give us a value of 0 – 100 to be stored in the variable “dc”.\n\
    \n```\nchar dc = (adcin(0)/10) * 4;  // Convert Pot value to 0-100% Duty Cycle\n\
    ```\n\nThe pwmout functions are number 1 and 2 to control each PWM channel on\
    \ the CHIPINO module. The PWM peripheral uses the internal Timer 2 clock for controlling\
    \ the PWM peripheral. Therefore the PWMs must operate at the same frequency. The\
    \ pwmout1 function uses the “dc” variable as the duty cycle parameter so that\
    \ variable changes, the duty cycle will change. The frequency is set to 5000 hz\
    \ or 5 khz. The pwmout2 function is set to a"
