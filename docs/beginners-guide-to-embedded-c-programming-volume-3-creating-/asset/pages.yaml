- pgno: 183
  md: "```\n} //End Main\n```\n\n# How it Works\n\nThe familiar header block has a\
    \ description of the program. After the header is the #include for the simplec.1.1.h\
    \ file.\n\n```\n/*\n *  I2C External EEPROM example using SimpleC\n *  This code\
    \ will write 10 bytes to the EEPROM and\n *  then read them back and display binary\
    \ value on LEDs.\n *  Connections:\n *  Pin 8(B0) - LED Anode - LED Cathode -\
    \ 1k ohm - Ground\n *  Pin 9(B1) - LED Anode - LED Cathode - 1k ohm - Ground\n\
    \ *  Pin 10(B2) - LED Anode - LED Cathode - 1k ohm - Ground\n *  Pin 11(B3) -\
    \ LED Anode - LED Cathode - 1k ohm - Ground\n *\n *  Pin 3(C4) - 24LC01B SDA -\
    \ 10k pullup - 5v\n *  Pin 4(C3) - 24LC01B SCL - 10k pullup - 5v\n *  24LC01B\
    \ Vss - Ground\n *  24LC01B Vdd - 5v\n */\n\n#include \"simplec1.1.h\"\n```\n\n\
    The main loop is next and contains the init_micro function and the i2c_init that\
    \ sets the I2C pins up for communication.\n\n```\nvoid\nmain(void)\n{\n    init_micro();\
    \    // Initialize I/O\n    i2c_init();      // Initialize i2c\n```\n\nThe LED\
    \ ports are setup to have all the LEDs off by driving the I/O pins low.\n\n```\n\
    PORTB=0x00;    // All LEDs off\nTRISB=0x00;     // All PORTB outputs\n```\n\n\
    A variable cnt is created that will be used to count the number of times through\
    \ a while loop. It is initialized to zero at this same point in time.\n\n```\n\
    unsigned char cnt=0;\n```"
  merge: -1
  img_proc: true
- pgno: 184
  md: "A while loop runs through ten loops and stores a downward count in the EEPROM.\
    \ The LEDs show the value of the cnt variable in binary by making the whole port\
    \ equal to the variable value. Since we are only using the lower four bits of\
    \ PORTB (CHIPINO pins 8-11) this method of control also affects the state of the\
    \ pin 12, 13, B6 and B7 of the modules. Since we have nothing hooked up to those\
    \ pins this works fine but if you adapt this code you may want to change that\
    \ setup to control each LED individually.\n\n```\nwhile(cnt<=10)    /* write 10\
    \ numbers to eeprom */\n{\nPORTB=cnt;        // The cnt value will display on\
    \ the LEDs\n```\n\nThe I2C_EEOUT function does all the EEPROM communication work.\
    \ The first parameter is the address and the second is the data. In this case\
    \ the variable cnt is the address and the data is the value 10 minus the value\
    \ of the variable cnt. It stores 9 at location 1, 8 at location 2, etc.\n\n```\n\
    I2C_EEOUT(cnt,10-cnt);// Store 9 at address 1, 8 at address 2, ...\ncnt=cnt+1;\
    \           // Increment cnt variable\n```\n\nA pause command is added to allow\
    \ enough time to see the value displayed on the LEDs.\n\n```\npause(255);    \
    \      // Delay 255 milliseconds\n}\n```\n\nThe variable cnt is reset to zero\
    \ and then the data is read back with another while loop. This time the I2C_EEIN\
    \ function is used to read back the data. The parameter is the address and the\
    \ data read back is sent to a variable. In this case we use PORTB label as the\
    \ variable. The HI-TECH compiler allows this because the register names are setup\
    \ as volatile variables in the specific header file for the PIC16F886 automatically\
    \ included by the compiler. This line makes the LED's display the value read back\
    \ from the EEPROM in binary form.\n\n```\ncnt=0;\nwhile(cnt<=10)\n{\nPORTB =I2C_EEIN(cnt);\
    \ // Display data read from EEPROM on\n                       // LEDs in binary\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 185
  md: "A pause function has the parameter 1000 to create a 1 second delay allowing\
    \ you to read the binary value on the LED's. This is slower than the delay for\
    \ writing to the EEPROM so you can easily tell when it's writing and when its\
    \ reading by the speed of the LED changes.\n\n```\npause (1000);    // Delay for\
    \ 1 second to read LEDs\n```\n\nThe cnt variable is incremented for the next test\
    \ of the value in the while loop. When the count reaches 10, the loop is done\
    \ and the program jumps back to the beginning of the main loop, which starts the\
    \ whole process over again.\n\n```\ncnt=cnt + 1;    // Increment cnt variable\n\
    } \n} //End Main\n```\n\n# Next Steps\n\nReplacing the LED's with an LCD is the\
    \ most logical next step and I've already showed you how easy that is with SimpleC.\
    \ You could also add an ADCIN function to read a sensor, average it against previous\
    \ readings and then store the result in the EEPROM. This would create a simple\
    \ data logger for just about anything you can measure with an analog sensor."
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Conclusion


    If you worked through the projects in my Beginner’s Guide to Embedded C Programming
    Volume 2 book, then at this point you should really understand how much typing
    the Simple C library saves you. In this book I wanted to give you a starting point
    for using the most common functions people asked for via email responses to my
    first two books in this series.


    SimpleC can now help you make projects faster or prove out a concept quicker.
    I can see where several of these projects could be combined to create more complex
    projects. Combining the LCD, EEPROM and RS232 communication projects make a great
    starting point to building a data logger. The ADC could be used to read a sensor
    and the measurements displayed on the LCD while also being stored in EEPROM. Later
    on you could retrieve that data with a computer by connecting the serial port
    to the Rx and Tx pins of the data logger module. All that could be done in a short
    list of SimpleC functions. This is just one example of how these can be combined
    or at least give you a starting point for building more complex projects.


    One thing I’ve found in talking to people who program in C is many of them rely
    on libraries of functions to build the projects from. These could be functions
    they created or functions they “borrowed” from another programmer. I’ve also seen
    many code examples on the internet that you can easily modify to fit your needs.
    The whole point of this book and my previous embedded C books are to teach you
    enough of the basics so you can understand the functions at these various other
    sources. By no means is there a standard approach either, therefore one persons
    code may be very helpful while another on the same topic may be so hard to follow
    you would be better off writing a new function yourself. That is the decision
    you have to make as the programmer.


    I want to thank all those who read my first two books on Embedded C and then continued
    on with this one. It’s that loyalty that makes this long process of writing books
    seem worth all the nights of typing and typing and typing… It’s a very long process.'
  merge: -1
  img_proc: true
