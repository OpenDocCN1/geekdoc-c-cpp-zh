- pgno: 113
  md: "```\n/*********************************\nFlash an LED example using SimpleC\n\
    This code will drive an LED on pin 8(RB0)\nand flash it on and off at a 1 second\
    \ rate.\nConnections:\nPIN 8(RB0) to LED Anode\nLED Cathode to 1k ohm\n1k ohm\
    \ to Ground\n*********************************/\n```\n\n```\n#include \"simplec1.1.h\"\
    \n```\n\n```\nvoid\nmain(void)\n{\n    init_micro();    // Initialize I/O\n  \
    \  while (1==1)\n    {\n        high(8);\n        pause (1000);    // Delay for\
    \ 1 second (1.0000 sec)\n        low(8);\n        pause (1000);    // Delay for\
    \ 1 second\n    }\n}\n```\n\n# How it Works\n\nThe first part of the program just\
    \ contains a description header indicating what the code does and then describes\
    \ the electrical connections.\n\n```\n/*********************************\nFlash\
    \ an LED example using SimpleC\nThis code will drive an LED on pin 8(RB0)\nand\
    \ flash it on and off at a 1 second rate.\nConnections:\nPIN 8(RB0) to LED Anode\n\
    LED Cathode to 1k ohm\n1k ohm to Ground\n*********************************/\n\
    ```\n\nThe SimpleC library is setup with the inclusion of the simplec1.1.h file.\
    \ All the configuration settings and some of the defines used by the SimpleC library\
    \ are setup in this header file so all SimpleC files need to include it.\n\n```\n\
    #include \"simplec1.1.h\"\n```"
