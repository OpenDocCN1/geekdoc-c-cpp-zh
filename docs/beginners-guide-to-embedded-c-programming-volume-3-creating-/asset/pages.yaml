    \        }\n        putch(0x0D);        // Send ASCII value for\n            \
    \                // carriage return\n        putch(0x0A);        // Send ASCII\
    \ value for new\n                            // line\n        // *********** Send\
    \ the alphabet from A to Z ***********\n        for (char count = 0x41; count\
    \ <= 0x5A; count = count +1)\n        {\n            putch(count);       // Send\
