  - "[PAGE 183]\n\n```\n} //End Main\n```\n\n# How it Works\n\nThe familiar header\
    \ block has a description of the program. After the header is the #include for\
    \ the simplec.1.1.h file.\n\n```\n/*\n *  I2C External EEPROM example using SimpleC\n\
    \ *  This code will write 10 bytes to the EEPROM and\n *  then read them back\
    \ and display binary value on LEDs.\n *  Connections:\n *  Pin 8(B0) - LED Anode\
    \ - LED Cathode - 1k ohm - Ground\n *  Pin 9(B1) - LED Anode - LED Cathode - 1k\
    \ ohm - Ground\n *  Pin 10(B2) - LED Anode - LED Cathode - 1k ohm - Ground\n *\
    \  Pin 11(B3) - LED Anode - LED Cathode - 1k ohm - Ground\n *\n *  Pin 3(C4) -\
    \ 24LC01B SDA - 10k pullup - 5v\n *  Pin 4(C3) - 24LC01B SCL - 10k pullup - 5v\n\
    \ *  24LC01B Vss - Ground\n *  24LC01B Vdd - 5v\n */\n\n#include \"simplec1.1.h\"\
    \n```\n\nThe main loop is next and contains the init_micro function and the i2c_init\
    \ that sets the I2C pins up for communication.\n\n```\nvoid\nmain(void)\n{\n \
    \   init_micro();    // Initialize I/O\n    i2c_init();      // Initialize i2c\n\
    ```\n\nThe LED ports are setup to have all the LEDs off by driving the I/O pins\
    \ low.\n\n```\nPORTB=0x00;    // All LEDs off\nTRISB=0x00;     // All PORTB outputs\n\
    ```\n\nA variable cnt is created that will be used to count the number of times\
    \ through a while loop. It is initialized to zero at this same point in time.\n\
    \n```\nunsigned char cnt=0;\n```"
  - "[PAGE 184]\n\nA while loop runs through ten loops and stores a downward count\
    \ in the EEPROM. The LEDs show the value of the cnt variable in binary by making\
    \ the whole port equal to the variable value. Since we are only using the lower\
    \ four bits of PORTB (CHIPINO pins 8-11) this method of control also affects the\
    \ state of the pin 12, 13, B6 and B7 of the modules. Since we have nothing hooked\
    \ up to those pins this works fine but if you adapt this code you may want to\
    \ change that setup to control each LED individually.\n\n```\nwhile(cnt<=10) \
    \   /* write 10 numbers to eeprom */\n{\nPORTB=cnt;        // The cnt value will\
    \ display on the LEDs\n```\n\nThe I2C_EEOUT function does all the EEPROM communication\
    \ work. The first parameter is the address and the second is the data. In this\
    \ case the variable cnt is the address and the data is the value 10 minus the\
    \ value of the variable cnt. It stores 9 at location 1, 8 at location 2, etc.\n\
    \n```\nI2C_EEOUT(cnt,10-cnt);// Store 9 at address 1, 8 at address 2, ...\ncnt=cnt+1;\
    \           // Increment cnt variable\n```\n\nA pause command is added to allow\
    \ enough time to see the value displayed on the LEDs.\n\n```\npause(255);    \
    \      // Delay 255 milliseconds\n}\n```\n\nThe variable cnt is reset to zero\
    \ and then the data is read back with another while loop. This time the I2C_EEIN\
    \ function is used to read back the data. The parameter is the address and the\
    \ data read back is sent to a variable. In this case we use PORTB label as the\
    \ variable. The HI-TECH compiler allows this because the register names are setup\
    \ as volatile variables in the specific header file for the PIC16F886 automatically\
    \ included by the compiler. This line makes the LED's display the value read back\
    \ from the EEPROM in binary form.\n\n```\ncnt=0;\nwhile(cnt<=10)\n{\nPORTB =I2C_EEIN(cnt);\
    \ // Display data read from EEPROM on\n                       // LEDs in binary\n\
    ```"
  - "[PAGE 185]\n\nA pause function has the parameter 1000 to create a 1 second delay\
    \ allowing you to read the binary value on the LED's. This is slower than the\
    \ delay for writing to the EEPROM so you can easily tell when it's writing and\
    \ when its reading by the speed of the LED changes.\n\n```\npause (1000);    //\
    \ Delay for 1 second to read LEDs\n```\n\nThe cnt variable is incremented for\
    \ the next test of the value in the while loop. When the count reaches 10, the\
    \ loop is done and the program jumps back to the beginning of the main loop, which\
    \ starts the whole process over again.\n\n```\ncnt=cnt + 1;    // Increment cnt\
    \ variable\n} \n} //End Main\n```\n\n# Next Steps\n\nReplacing the LED's with\
    \ an LCD is the most logical next step and I've already showed you how easy that\
    \ is with SimpleC. You could also add an ADCIN function to read a sensor, average\
    \ it against previous readings and then store the result in the EEPROM. This would\
    \ create a simple data logger for just about anything you can measure with an\
    \ analog sensor."
