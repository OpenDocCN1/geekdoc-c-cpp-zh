    \ SimpleC 库中，它用于格式化发送到终端程序的串行端口数据。以下是在 printf 字符区域中可以使用的一些选项。\n\n格式字符及其含义如下：\n\
    \n- \\\" 双引号\n- \\\\ 反斜杠\n- \\a 警报（BEL）\n- \\b 退格\n- \\c 不再产生输出\n- \\f 换页\n- \\\
