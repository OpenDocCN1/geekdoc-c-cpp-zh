    \ numbers from 1 to 9 **********\nfor (char count = 0x31; count <= 0x39; count\
    \ = count +1)\n{\n    putch(count);        // Send Count 1-9 in ASCII\n    pause(100);\
    \          // Delay 100 msec\n}\nputch(0x0D);           // Send ASCII value for\n\
    \                       // carriage return\nputch(0x0A);           // Send ASCII\
    \ value for new\n                       // line\n```\n\n第二个 for 循环用 PUTCH 发送 A\
    \ 到 Z 的 ASCII 字符。\n\n```\n// *********** Send the alphabet from A to Z ************\n\
    for (char count = 0x41; count <= 0x5A; count = count +1)\n{\n```\n\n串行通信也更简单，也可作为调试工具发送状态数据。PICkit\
    \ 2 软件还能收集和存储接收字符。\n\n### 下一步\n\n建议同时尝试 PICkit 2 和 USB 转 TTL 转换器模块通信。未展示 USB 转换器用法，但已测试效果不错。USB\
    \ 转换器板种类很多，不作具体推荐。\n\n更改发送消息很简单，让 PICkit 2 收集数据后用 EXCEL 或电子表格打开也是很好的用途。可结合模拟传感器读取程序做数据记录器。串口在嵌入式领域仍很流行，尽管\
    \ PC 端已转向其他接口。\n\n## 第 12 章 – SimpleC I2C 通信\n\n本书以 I2C 通信项目开篇，也以此收尾，这次使用 SimpleC\
    \ 库使软件更易编写。硬件和操作与第 2 章相同，演示 SimpleC 如何简化该项目。\n\n### 硬件\n\n若仍保留第 2 章的硬件即可直接进行软件开发。否则\
    \ 24LC01B 芯片连接 CHIPINO 引脚 3 和 4（RC4 和 RC3），LED 连接引脚 8 至 11（RB0 至 RB3）。其余部分集成在\
    \ CHIPINO 中。\n\n![](img/910b145bee7ca8076318eafbe6d13997_180_0.png)\n\n图 12-1：EEPROM\
    \ 示意图\n\n洞洞板布局和 CHIPINO 模块连接如图 12-2 和 12-3 所示，可自行选择。\n\n![](img/910b145bee7ca8076318eafbe6d13997_181_0.png)\n\
    \n图 12-2：I2C EEPROM 洞洞板布局\n\n![](img/910b145bee7ca8076318eafbe6d13997_181_1.png)\n\
    \n图 12-3：I2C EEPROM CHIPINO 模块连接\n\n```\n} //End Main\n```\n\n### 工作原理\n\n熟悉的头部块描述了程序。头部之后是\
    \ simplec1.1.h 的 #include。\n\n```\n/*\n *  I2C External EEPROM example using SimpleC\n\
    \ *  This code will write 10 bytes to the EEPROM and\n *  then read them back\
    \ and display binary value on LEDs.\n *  Connections:\n *  Pin 8(B0) - LED Anode\
    \ - LED Cathode - 1k ohm - Ground\n *  Pin 9(B1) - LED Anode - LED Cathode - 1k\
    \ ohm - Ground\n *  Pin 10(B2) - LED Anode - LED Cathode - 1k ohm - Ground\n *\
    \  Pin 11(B3) - LED Anode - LED Cathode - 1k ohm - Ground\n *\n *  Pin 3(C4) -\
    \ 24LC01B SDA - 10k pullup - 5v\n *  Pin 4(C3) - 24LC01B SCL - 10k pullup - 5v\n\
    \ *  24LC01B Vss - Ground\n *  24LC01B Vdd - 5v\n */\n\n#include \"simplec1.1.h\"\
    \n```\n\n接下来是主循环，包含 init_micro 和设置 I2C 引脚的 i2c_init。\n\n```\nvoid\nmain(void)\n\
    {\n    init_micro();    // Initialize I/O\n    i2c_init();      // Initialize\
    \ i2c\n```\n\nLED 端口通过将 I/O 拉低使所有 LED 关闭。\n\n```\nPORTB=0x00;    // All LEDs off\n\
    TRISB=0x00;     // All PORTB outputs\n```\n\n创建变量 cnt 用于 while 循环计数，初始化为零。\n\n\
    ```\nunsigned char cnt=0;\n```\n\nwhile 循环运行十次并在 EEPROM 中存储递减计数。LED 以二进制显示 cnt\
    \ 值，整个端口等于变量值。由于仅使用 PORTB 的低四位（CHIPINO 引脚 8-11），此控制方式也会影响模块的引脚 12、13、B6 和 B7。由于这些引脚未连接，工作正常，但改编代码时可能需要单独控制每个\
    \ LED。\n\n```\nwhile(cnt<=10)    /* write 10 numbers to eeprom */\n{\nPORTB=cnt;\
    \        // The cnt value will display on the LEDs\n```\n\nI2C_EEOUT 完成所有 EEPROM\
    \ 通信工作。第一个参数为地址，第二个为数据。此处 cnt 为地址，数据为 10 减去 cnt。地址 1 存 9，地址 2 存 8，依此类推。\n\n```\n\
    I2C_EEOUT(cnt,10-cnt);// Store 9 at address 1, 8 at address 2, ...\ncnt=cnt+1;\
    \           // Increment cnt variable\n```\n\n添加 pause 命令以便有足够时间看到 LED 显示的值。\n\
    \n```\npause(255);          // Delay 255 milliseconds\n}\n```\n\n将 cnt 重置为零，然后用另一个\
    \ while 循环读回数据。这次使用 I2C_EEIN 读取数据。参数为地址，读回的数据送入变量。此处使用 PORTB 标签作为变量。HI-TECH 编译器允许这样做，因为寄存器名在\
    \ PIC16F886 的特定头文件中被设为 volatile 变量并自动包含。此行使 LED 以二进制形式显示从 EEPROM 读回的值。\n\n```\n\
    cnt=0;\nwhile(cnt<=10)\n{\nPORTB =I2C_EEIN(cnt); // Display data read from EEPROM\
    \ on\n                       // LEDs in binary\n```\n\npause 函数参数为 1000，产生 1 秒延迟以便读取\
    \ LED 二进制值。写入 EEPROM 的延迟较短，因此可通过 LED 变化速度区分读写。\n\n```\npause (1000);    // Delay\
    \ for 1 second to read LEDs\n```\n\n为 while 循环下一次测试递增 cnt 变量。计数达到 10 时循环结束，程序跳回主循环开头，整个过程重新开始。\n\
    \n```\ncnt=cnt + 1;    // Increment cnt variable\n} \n} //End Main\n```\n\n###\
    \ 下一步\n\n用 LCD 替换 LED 是最合理的下一步，我已展示 SimpleC 如何轻松实现。也可添加 ADCIN 函数读取传感器，对多次读数取平均后存入\
    \ EEPROM，可为几乎任何可测模拟传感器创建简单数据记录器。\n\n### 结论\n\n如果你完成了我的《Beginner’s Guide to Embedded\
    \ C Programming Volume 2》中的项目，现在应能理解 SimpleC 库节省了多少输入工作。本书旨在为人们通过邮件询问的常见函数提供起点。\n\
    \nSimpleC 可加快项目开发或更快验证概念。我认为多个项目可组合成更复杂项目。组合 LCD、EEPROM 和 RS232 通信项目是构建数据记录器的良好起点。ADC\
    \ 可读取传感器并在 LCD 上显示测量值，同时存入 EEPROM。之后可通过将串口连接到数据记录器模块的 Rx 和 Tx 引脚，用计算机检索数据。所有这些都可用少量\
    \ SimpleC 函数完成。这只是组合方式的一个例子，也可作为构建更复杂项目的起点。\n\n与 C 程序员交流时发现，很多人依赖函数库构建项目。这些函数可能是自己创建的，也可能是“借用”的。我也见过许多可在网上找到并修改以满足需求的代码示例。本书和我之前的嵌入式\
    \ C 书籍的重点是教授足够的基础知识，以便理解这些来源中的函数。并没有标准方法，因此一个人的代码可能非常有帮助，而同一主题的另一份代码可能难以理解，以至于自己重写函数更好。这是程序员需要做出的决定。\n\
    \n感谢阅读我前两本嵌入式 C 书籍并继续阅读本书的读者。是这种忠诚让撰写书籍的漫长过程——无数个夜晚的打字——变得值得。这是一个非常漫长的过程。\n"
