  mdcn: "\n停止位的情况与此类似。使用 i2c_stop() 函数时，它会等待总线空闲后再发送该位。\n\n```c\n//***********************************************\n\
    void i2c_stop()\n{\n    i2c_waitForIdle();\n    PEN=1;\n}\n```\n\nI2C 的主要工作在于发送和接收字节。接收部分由\
    \ i2c_read() 函数负责。如果 ack 参数为零，它会发出一个 ACK 位。\n\n```c\n//***********************************************\n\
    int i2c_read( unsigned char ack )\n{\n    unsigned char i2cReadData;\n    i2c_waitForIdle();\n\
    \    RCEN=1;\n    i2c_waitForIdle();\n    i2cReadData = SSPBUF;\n    i2c_waitForIdle();\n\
    \    if ( ack )\n    {\n        ACKDT=0;\n    }\n    else\n    {\n        ACKDT=1;\n\
    \    }\n    ACKEN=1;      // send acknowledge sequence\n    return( i2cReadData\
    \ );\n}\n//***********************************************\n```\n\ni2c_write()\
    \ 函数将参数字节存储到 I2C 外设缓冲区中，然后发送该字节。如果接收到 ACK 位，该函数返回 1，表示通信正常进行。\n\n```c\nunsigned\
    \ char i2c_write( unsigned char i2cWriteData )\n{\n    i2c_waitForIdle();\n  \
    \  SSPBUF = i2cWriteData;\n    return ( ! ACKSTAT ); // function returns '1' if\
    \ transmission is acknowledged\n}\n```\n\n```c\n// ******************************************\n\
    // I2C EEOUT function to write to an 8-bit address Microchip\n// EEPROM part (i.e.\
    \ 24LC01) with 8 byte address (2k bit max)\n// ******************************************\n\
    ```\n\n也许 I2C 最常见的用途是与 EEPROM 通信，因此我编写了 I2C_EEOUT() 和 I2C_EEIN() 函数，利用先前描述的函数来处理这种通信。由于这些函数你都很熟悉，你可以将它们用作将来\
    \ I2C 通信的参考格式。\n\n```c\nvoid I2C_EEOUT(unsigned char address, unsigned char data)\n\
    {\n    i2c_start();\n    i2c_write(0xa0);\n    i2c_write(address);\n    i2c_write(data);\n\
    \    i2c_stop();\n    pause(11);\n}\n```\n\n```c\n// ******************************************\n\
    // I2C EEIN function to read from an 8-bit address Microchip\n// EEPROM part (i.e.\
    \ 24LC01) with 8 byte address (2k bit max)\n// ******************************************\n\
    ```\n\n```c\nunsigned char I2C_EEIN(unsigned char address)\n{\n    unsigned char\
    \ data;\n\n    i2c_start();\n    i2c_write(0xa0);\n    i2c_write(address);\n \
    \   i2c_repStart();\n    i2c_write(0xa1);\n    data=i2c_read(0);\n    i2c_stop();\n\
    \    return(data);\n}\n```\n\n现在，你已经对使用 SimpleC 库时有哪些选项有了基本的了解和参考。接下来，我将用本书的其余部分向你展示这个库让\
    \ CHIPINO 模块中的 PIC16F886 编程变得多么简单。其中一些项目是本书系列第 1 卷和第 2 卷中项目的重复，但你会看到它们编写起来更快，也更容易理解。\n\
    \n## 第 4 章 – SimpleC 数字输出\n\n如果你已经读过本书系列的第 1 卷，这可能看起来像在重走老路，但我们必须从基础开始，以确保一切都能正常工作。最好的方法就是做一个\
    \ LED 闪烁项目。你可以轻松地用晶体管驱动继电器或任何可数字控制的器件来替换 LED。关键在于展示如何使用 SimpleC 库函数 high() 来驱动端口引脚。对于刚接触\
    \ MPLAB 的读者，我将在本章中逐步讲解如何创建一个软件项目。在以后的项目章节中，你可以将其作为参考，因为我不可能每个项目都这样详细讲解。一旦你学会了一个项目，它就适用于所有项目。\n\
    \n### 在 MPLAB 中创建项目\n\n软件已经预先编写好，可从我的网站 http://www.elproducts.com/ebook3files\
    \ 下载。要在 MPLAB 中开始创建项目，我们使用项目向导。你的桌面上应该有 MPLAB 图标，双击它打开 MPLAB。你应该会看到下面的界面。\n\n\
    ![](img/910b145bee7ca8076318eafbe6d13997_100_0.png)\n\n图 4-1：MPLAB 初始界面\n\n正如你所看到的，MPLAB\
    \ 并没有太多东西可看，但一切从这里开始。现在我将带你一步步在 MPLAB 中创建一个项目。每次你想要开始一个新的软件设计时，你都要创建一个项目。该项目将包含你所有的\
    \ C 文件和头文件，以及你可能包含的任何支持文件。当项目完全设置好后，MPLAB 会以“.mcp”和“.mcw”后缀保存两个文件（例如 project1.mcp）。\n\
    \n“.mcp”文件将链接你所有的软件文件，“.mcw”文件将链接你在 MPLAB 设置中打开的所有窗口。如果你打开了任何模拟器窗口或 MPLAB 内置的众多功能中的任何一个，你都不必再次这样做，因为所有这些都会保存在“.mcw”文件中，因此如果你不得不关闭项目，你可以轻松回到原来的状态。\n\
    \n为了简化项目的创建过程，MPLAB 提供了一个“向导”功能，它会一步步引导你完成项目创建。我们将在这里用第一个项目来演示，让你了解如何使用向导来设置项目。图\
    \ 4-2 显示了第一步。\n\n![](img/910b145bee7ca8076318eafbe6d13997_101_0.png)\n\n图 4-2：选择\
    \ MPLAB 项目向导\n\n在 MPLAB 界面中，点击 “Project” 菜单选项即可找到 Project Wizard（项目向导）选项。它是第一个可选项。点击该\
    \ Project Wizard 子菜单选项，将打开如图 4-3 所示的窗口。\n\n![](img/910b145bee7ca8076318eafbe6d13997_102_0.png)\n\
    \n图 4-3：MPLAB 项目向导界面 1\n\n现在，MPLAB 环境中应该会有一个独立的窗口，欢迎你进入项目向导。点击 “Next”（下一步）按钮继续。\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_102_1.png)\n\n图 4-4：MPLAB 项目向导界面 2\n\
    \n项目设置过程的第四步是添加任何预先写好的 C 文件。通常你会修改现有文件以节省时间，而不是从头开始。在左侧窗口中，滚动找到 LED 闪烁文件。点击该文件以高亮选中，然后点击\
    \ “Add >>”（添加）按钮。它应该会出现在屏幕右侧。如果你找不到 LED 文件，请从我的网站下载这些文件，并将它们存储在你计算机上的已知位置。\n\n\
    在所选文件旁边，你会看到一个大的“A”。如果你多次点击它，你会看到旁边出现一个“C”。“C”将强制把该文件的副本保存到你在第三个界面中创建的目录中。我喜欢这样做，这样我就可以将所有修改保存在一个目录中，同时保持原始文件不变。图\
    \ 4-8 显示了最终结果。\n\n![](img/910b145bee7ca8076318eafbe6d13997_105_0.png)\n\n图 4-8：MPLAB\
    \ 项目向导界面 6\n\n### SimpleC 设置\n\n这里就是添加 SimpleC 文件的地方。如果你不想使用 SimpleC 库，可以点击“下一步”继续。如果你确实想使用\
    \ SimpleC 库，则需要将 simplec1.1.h 和 simplec1.1.c 文件添加到项目中。在第四步界面的左侧，找到 SimpleC 文件并将它们添加到右侧。对于这两个\
    \ SimpleC 文件，点击“A”直到它变为“C”。这会将这些文件的副本保存到与你的项目相同的目录中，同时保持原始 SimpleC 文件不变。\n\n图\
    \ 4-9 中的界面是项目设置中的最后一个界面。当你看到这个界面时，说明你已经成功创建了项目。只需点击“完成”，MPLAB 窗口就会显示项目中的所有文件。\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_106_0.png)\n\n图 4-9：MPLAB 项目向导最终界面\n\
    \n图 4-10 中显示的项目界面最初可能是空白的，因此要显示项目和输出窗口，请从顶部菜单中点击 视图>项目（View>Project）选项。你会看到一个复选标记出现，同时窗口也会弹出，通常位于左上角，并显示你的项目文件。\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_107_0.png)\n\n图 4-10：MPLAB 项目界面\n\n\
    点击菜单中的 视图>输出（View>Output）选项，输出窗口通常会出现在屏幕底部。项目窗口将显示你之前选择的 C 文件。双击项目中的 C 文件，MPLAB\
    \ 编辑器窗口应会打开并显示代码清单。图 4-11 显示了编辑器界面打开程序文件后的样子。\n\n![](img/910b145bee7ca8076318eafbe6d13997_107_1.png)\n\
    \n图 4-11：MPLAB 编辑器窗口\n\n你通常会在编辑器窗口中修改文件，以使程序按照你想要的方式编写。当文件修改完成后，你就可以使用 HI-TECH\
    \ 编译器对其进行编译了。MPLAB 使\n"
