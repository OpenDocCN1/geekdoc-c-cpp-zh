    \ C 编译器，以 C 语言对嵌入式微控制器进行编程。\n\n在“嵌入式 C 语言编程初学者指南 – 第 3 卷”中，Chuck Hellebuyck 再次向前迈进，向读者展示了创建\
    \ SimpleC 函数库的步骤，使 C 语言编程更加容易。这种方法向读者展示了如何创建自己的函数并扩展 SimpleC 库，从而比直接编写原始 C 代码更快地创建微控制器项目。对于希望构建电子小装置而无需费心编写每一条\
    \ C 语句的未来程序员来说，这本书无疑将成为他们的参考，使他们能够用更少的时间和精力完成可运行的项目。\n\nSimpleC 库将使以下功能像一行命令一样简单：\n\
    \n- 控制数字输出\n- 读取数字输入\n- 监测模拟电压\n- 驱动液晶显示模块\n- 驱动数字 PWM 信号\n- 通过 SPI 和 I2C 通信发送/接收\n\
    - 写入/读取外部 EEPROM\n- 写入/读取外部 I/O 扩展器\n- 等等！\n\n本书使用基于开源 PIC16F886 的 CHIPINO 模块作为硬件，并构成一个平台，使未来的电子项目和小装置更容易构建。\n\
