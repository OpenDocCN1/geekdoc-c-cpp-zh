    \ |\n| 04h | INTCON |\n| 05h | IOCON |\n| 06h | GPPU |\n| 07h | INTF |\n| 08h\
    \ | INTCAP (Read-only) |\n| 09h | GPIO |\n| 0Ah | OLAT |\n\nThe value entered\
    \ in the register location is written in hex form (i.e. 0x04 for the INTCON register).\
    \ The WR_MCP23S08 function also offers a few nicknames for the most common three\
    \ registers so you can use these names in place of the actual address value:\n\
    \n- IODIR // Data Direction Register Address 0x00\n- OLAT // Output Latch Register\
    \ Address 0x0A\n- GPIO // Port Register Address 0x09\n\n![](img/910b145bee7ca8076318eafbe6d13997_63_0.png)\n\
    \nSpecial Note: Notice the function name is all capitals. This is because this\
