    \  {\n        // *********** Send a decimal numbers from 1 to 9 ***********\n\
    \        for (char count = 0x31; count <= 0x39; count = count +1)\n        {\n\
    \            putch(count);     // Send Count 1-9 in ASCII\n            pause(100);\
    \       // Delay 100 msec\n        }\n    } //End While\n} //End Main\n```\n\n\
    # putch (character)\n\nThe putch function is not necessarily a SimpleC only function.\
