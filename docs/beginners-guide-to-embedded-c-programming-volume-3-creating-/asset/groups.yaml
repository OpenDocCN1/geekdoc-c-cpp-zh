    );\n    char input = getch();  // read a response from the user\n    printf(\"\
    I detected [%c]\\r\\n\",input);    // echo it back\n    }//end while\n}//end main\n\
    ```\n\n## SPI Communication\n\nSerial Peripheral Interface (SPI) is often used\
    \ to communicate with external circuitry. The SPI port on the PIC16F886 is a hardware\
    \ peripheral that runs in the background. So setting it up and running it is simplified\
    \ with the SimpleC library functions below. The peripheral is only setup as a\
    \ SPI master not a slave.\n\n## spi_init()\n\nThe spi_init function sets up the\
    \ SPI port for serial communication as a master. The spi connections are preset\
    \ in the peripheral. Pin 4 (C3) is the clock, pin 3 (C4) is the Master Out Slave\
    \ In (MOSI or SDO), pin 2 (C5) is the Master In Slave Out (MISO or SDI). In order\
    \ to use the spi peripheral, the spi_init must be at the top of your main loop.\n\
    \nExample:\n\n```\n//*****Sample code to control an MCP23S08 SPI I/O Expander***\n\
    void main(void)\n{\ninit_micro();\nspi_init();\nWR_MCP23S08 (IODIR, 0x01);   \
    \ // Setup pins\nwhile (1==1)\n{\nchar y = 1;\ny = RD_MCP23S08 (GPIO); // Read\
    \ switch\ny = y & 0x01;           // Mask all but bit 7\nif (y==0)\n{WR_MCP23S08\
    \ (OLAT, 0x40);} // If switch idle light LED\nelse\n{WR_MCP23S08 (OLAT, 0x80);}\
    \ // If switch pressed LED off\npause(10);\n} //End While\n} //End Main\n```\n\
    \n## spi_output (byte)\n\nThe spi_output function stores the byte value in the\
    \ SPI peripheral buffer so it can be sent by the peripheral to the SPI slave device.\
    \ This function is also used to receive a byte from the SPI slave because every\
    \ time a byte is sent by the SPI peripheral, it also receives a byte. Therefore\
    \ this function is always used to both send and receive a byte of data. If you\
    \ only want to receive then you send a dummy or meaningless byte of data. If you\
    \ only want to send then the byte you receive is not used.\n\nExample:\n\n```\n\
    /*** Read a byte of data from an EEPROM function ****\nchar RD_BYTE ( char EE_address\
    \ )\n{\n    char dummy;\n    char spi_received = 0;\n    CS = 0;     // Set chip\
    \ select low\n    dummy = SPI_OUTPUT (0x03);        // Send read command\n   \
    \ dummy = SPI_OUTPUT( EE_address ); // Send Address\n    spi_received = SPI_OUTPUT(\
    \ 0x00 ); // Receive Stored Value\n    CS = 1;                         // Bring\
    \ chip select high to terminate\n                                    // the read\
    \ command\n    return spi_received;\n}\n```\n\n## WR_BYTE (address, databyte)\n\
    \nThe WR_BYTE function uses the spi_output function to write a byte of data to\
    \ a SPI based EEPROM chip. The byte can be written to a specific memory location.\
    \ The address is a value from 0 to 255 so this function is limited to a 2k bit\
    \ EEPROM memory chip. A Microchip 25LC020A or 25AA020A are 2k bit parts that work\
    \ well with this command.\n\nSpecial Note: Notice the function name is all capitals.\
    \ This is because this function is a SPI specific routine for a particular component.\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_60_0.png)\n\n```\nvoid\nmain(void)\n\
    {\n    lcd_init();    // Initialize LCD Display\nspi_init();          // Initialize\
    \ SPI Peripheral\n\n//*** Load Data in EEPROM ***\nwhile (1==1)\n{\n    for( addr\
    \ = 0; addr < 10; addr = addr + 1 )   // Loop 10 times\n    {\n        data =\
    \ addr;                // addr value is data for SEEPROM\n        WR_BYTE (addr,data);\
    \        // Write to SEEPROM\n        pause (10);                 // Delay 10ms\
    \ after each write\n    } // End For\n\n//*** Continuous Loop to Read and Display\
    \ Data ***\n    for( addr = 0; addr <10; addr = addr + 1 )   // Loop 10 times\n\
    \    {\n        lcd_clear();                // Clear LCD screen\n        lcd_goto(0);\
    \                // select first line\n        lcd_text(\"Address / Value\");\
    \ // Display header\n        b0 = RD_BYTE (addr);        // Read from SEEPROM\n\
    \        lcd_goto(0x40);             // Select second line\n        lcd_number(addr);\
    \           // Display address location\n        lcd_text(\" /\");\n        lcd_number(b0);\
    \             // Display value read from EEPROM\n        pause (250);        \
    \        // Delay 250 msec to see count\n    } //End For\n\n} //End While\n} //End\
    \ Main\n```\n\n## RD_BYTE (address, databyte)\n\nThe RD_BYTE function uses the\
    \ spi_output function to read a byte of data from a SPI based EEPROM chip. The\
    \ byte can be read from a specific memory location. The address is a value from\
    \ 0 to 255 so this function is limited to a 2k bit EEPROM memory chip. A Microchip\
    \ 25LC020A or 25AA020A are 2k bit parts that work well with this command.\n\n\
    Special Note: Notice the function name is all capitals. This is because this function\
    \ is a SPI specific routine for a particular component.\n"
