    \ 24LC01) with 8 byte address (2k bit max)\n// ******************************************\n\
    ```\n\nProbably the most common use of I2C is communicating with EEPROM so I wrote\
    \ the I2C_EEOUT () and I2C_EEIN () functions to handle this communication using\
    \ the functions I previously described. You can use these as the format for future\
    \ I2C communication as they are all very familiar.\n\n```\nvoid I2C_EEOUT(unsigned\
    \ char address, unsigned char data)\n{\n    i2c_start();\n    i2c_write(0xa0);\n\
    \    i2c_write(address);\n    i2c_write(data);\n    i2c_stop();\n    pause(11);\n\
    }\n```\n\n```\n// ******************************************\n// I2C EEIN function\
    \ to read from an 8-bit address Microchip\n// EEPROM part (i.e. 24LC01) with 8\
    \ byte address (2k bit max)\n// ******************************************\n```\n\
    \n```\nunsigned char I2C_EEIN(unsigned char address)\n{\n    unsigned char data;\n\
    \n    i2c_start();\n    i2c_write(0xa0);\n    i2c_write(address);\n    i2c_repStart();\n\
    \    i2c_write(0xa1);\n    data=i2c_read(0);\n    i2c_stop();\n    return(data);\n\
    }\n```\n\nYou should now have a basic understanding and reference of what options\
