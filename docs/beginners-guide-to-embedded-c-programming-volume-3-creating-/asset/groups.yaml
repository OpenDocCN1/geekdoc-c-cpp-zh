    \ 100hz\n}\n```\n\n2.6.1. 我称之为 PICkit 2 独立编程软件。它依赖于 Microsoft .net 框架，许多 PC 已预先安装了该框架。该软件可从\
    \ www.microchip.com/pickit2 免费下载。\n\n运行 PICkit 2 软件时，其外观将如 图 11-4 中的屏幕截图所示。\n\n\
    ![](img/910b145bee7ca8076318eafbe6d13997_170_0.png)\n\n图 11-4：PICkit 2 独立编程软件\n\
    \n独立软件的一个功能是内置的 UART 工具。这是一个终端程序，使用 PICkit 2 编程器作为 PIC 到 USB 的通信通道。你可以从工具菜单启动该软件，如\
    \ 图 11-5 所示。\n\n![](img/910b145bee7ca8076318eafbe6d13997_171_0.png)\n\n## 图 11-5：UART\
    \ 工具选择\n\n如 图 11-5 所示，我在安装了 MPLAB 软件的情况下运行了独立软件。你可以为安全起见在 MPLAB 编程器菜单中取消选择 PICkit\
    \ 2，但我保持选中状态时也能正常工作。\n\n运行 UART 工具时，你会看到 图 11-6 中的屏幕。右上角显示波特率为 9600。屏幕显示在捕获时 CHIPINO\
    \ 中正在运行软件，因为它显示了 CHIPINO 通过 PICkit 2 连接发送到 UART 屏幕的文本。\n\n![](img/910b145bee7ca8076318eafbe6d13997_172_0.png)\n\
    \n## 图 11-6：UART 屏幕截图\n\n最后显示的是 CHIPINO 提示用户按下键盘键或在屏幕下中部的 Send 框中输入一个字符。该字符将被\
    \ CHIPINO 读取然后发回，以演示双向通信。图 11-7 显示了从 Send 窗口向 CHIPINO 发送大写字母 A 时的结果。\n\n此操作将一直持续，直到按下屏幕左上角的\
    \ Disconnect 按钮。你还可以在左下角看到 PICkit 2 的连接，这在将来使用此工具时忘记连接方案会很有帮助。\n\n![](img/910b145bee7ca8076318eafbe6d13997_173_0.png)\n\
    \n图 11-7：发送字母 A 时的 UART 响应屏幕\n\n## 软件\n\n现在我将向你展示创建所有这些内容的软件，你会看到 SimpleC 库如何使编写变得更简单。\n\
    \n```\n/*******************************\nA simple demonstration of serial communications\
    \ which\nincorporates the on-board hardware USART of the Microchip\nPIC16F886\
    \ device.\n1) The project sends ASCII numbers 1-9 out to the terminal once\nfollowed\
    \ by a carriage return and new line command.\n2) Then it sends the ASCII values\
    \ for A-Z once followed by\na carriage return and new line command.\n3) Then it\
    \ will send the word \"Hello\" out once.\n4) Then it will use the printf command\
    \ to send phrases and\nask for you to send it something via the keyboard and it\
    \ will\necho it back.\nThe program will keep asking for input until power is lost.\n\
    \nOption 1: Hyperterminal and USB to RS232 module\n\nPin 0(C7) Rx - to Tx of USB/RS232\
    \ module\nPin 1(C6) Tx - to Rx of USB/RS232 module\n\nHyperterminal settings\n\
    Bits per second: 9600\nData bits: 8\nParity: None\nStop bits: 1\nFlow control:\
    \ None\n\nOption 2: PICKit 2 as interface and running UART tool\nC7 to PICKit\
    \ 2 pin 5\nC6 to PICKit 2 pin 4\nVdd to PICKit 2 pin 2\nGnd to PICKit 2 pin 3\n\
    *****************************/\n```\n\n```\n#include \"simplec1.1.h\"\n\nvoid\
    \ main(void){\n    init_micro();    // Setup micro ports\n    init_serial(9600);\
    \ // set up the USART baud rate (2400 or 9600)\n    // *** Serial Communication\
    \ Main Loop\n    while(1)\n    {\n        // *********** Send a decimal numbers\
    \ from 1 to 9 ***********\n        for (char count = 0x31; count <= 0x39; count\
    \ = count +1)\n        {\n            putch(count);       // Send Count 1-9 in\
    \ ASCII\n            pause(100);         // Delay 100 msec\n        }\n      \
    \  putch(0x0D);        // Send ASCII value for\n                            //\
    \ carriage return\n        putch(0x0A);        // Send ASCII value for new\n \
    \                           // line\n        // *********** Send the alphabet\
    \ from A to Z ***********\n        for (char count = 0x41; count <= 0x5A; count\
    \ = count +1)\n        {\n            putch(count);       // Send Count 1-9 in\
    \ ASCII\n            pause(100);         // Delay 100 msec\n        }\n      \
    \  putch(0x0D);        // Send ASCII value for\n                            //\
    \ carriage return\n        putch(0x0A);        // Send ASCII value for new\n \
    \                           // line\n        // *********** Send a string of characters\
    \ ***************\n        char txt[] = \"Hello\";\n        for (char x = 0; x<5;\
    \ x++)\n        {\n            putch (txt[x]);\n        }\n        putch (0x0D);\
    \    // Send ASCII value for carriage return\n        putch (0x0A);    // Send\
    \ ASCII value for new line\n\n        // ****** Use printf command to ask for\
    \ input and echo it back ******\n        while(1)\n        {\n            printf(\"\
    Press a key and I will echo it back:\\r\\n\");\n            char input = getch();\
    \    //read a response from the\n                                     // user\n\
    \            printf(\"I detected [%c]\\r\\n\",input); //echo it back\n       \
    \ }\n    }\n}\n```\n\n## 工作原理\n\n该头文件在操作和连接选项的描述方面非常完整。它描述了 USB 到 USART 连接选项以及我选择使用的\
