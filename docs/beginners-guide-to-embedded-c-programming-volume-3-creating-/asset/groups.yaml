    \ and then display the address value and the data value using separate lcd_symbol\
    \ functions. The values are added to the constant “number” so the value sent to\
    \ the LCD is the ASCII value for the value. This method works because all the\
    \ values are single digit values.\n\n```\nlcd_goto(0x40);          // Select second\
    \ line\nlcd_symbol(addr + number);   // Display value read from\n            \
    \               //EEPROM on LCD\nlcd_text(\" / \");\nlcd_symbol(b0 + number);\
    \   // Display value read from\n                           //EEPROM on LCD\n```\n\
    \nA delay is added so we can easily read the values displayed on the LCD.\n\n\
    ```\npause (250);          // Delay 250 msec to see count\n} //End For\n} //End\
    \ While\n} //End Main\n```\n\n## Next Steps\n\nYou can play with the first loop\
    \ to change the data being stored and verify it works by monitoring the display.\
    \ You can also expand the project to store more data but you’ll have to modify\
    \ the way the data is displayed on the LCD because larger amounts of data mean\
    \ address values larger than single digit.\n\n## Project 2 – Inputs from MCP23S08\n\
    \nThe MCP23S08 is a SPI I/O expander and is great for adding up to eight digital\
    \ pins to your project by sacrificing the four SPI pins. This project doesn't\
    \ use all eight but does use a few to show how to sense a switch with the MCP23S08\
    \ and then control LEDs based on the state of the switch. The communication between\
    \ the PIC16F886 and the MCP23S08 is through the SPI peripheral. The SimpleC library\
    \ has functions specific for this MCP23S08 chip so the code is easier to write.\n\
