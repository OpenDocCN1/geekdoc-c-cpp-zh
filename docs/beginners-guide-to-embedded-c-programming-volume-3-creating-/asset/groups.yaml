    pwmout2,58,83,103,104,171,173\n\n## Check out other great books by Chuck Hellebuyck\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_196_0.png)\n\n![](img/910b145bee7ca8076318eafbe6d13997_196_1.png)\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_196_2.png)\n\n![](img/910b145bee7ca8076318eafbe6d13997_196_3.png)\n\
    \nYou can purchase them direct at\nwww.elproducts.com\n\n## Beginner's Guide to\
    \ Embedded C Programming\nVolume 3\nCreating the SimpleC Library of Functions\n\
    \nIn his \"Beginner's Guide to Embedded C\" and \"Beginner's Guide to Embedded\
    \ C – Volume 2\" books Chuck Hellebuyck took the reader through the very beginning\
    \ of learning how to program embedded microcontrollers in the C language using\
    \ a Microchip PIC microcontroller and the Microchip HI-TECH C compiler.\n\nIn\
    \ \"Beginner's Guide to Embedded C Programming – Volume 3\" Chuck Hellebuyck takes\
    \ another leap forward by showing you the steps to create the SimpleC library\
    \ of functions that make programming in C even easier. This approach shows the\
    \ reader how they can create their own functions and expand the SimpleC library\
    \ to make creating microcontroller projects much quicker than writing in raw C\
    \ code. This book will clearly be the reference for future programmers who want\
    \ to build electronic gadgets without all the painstaking steps of writing every\
    \ C statement while producing a working project in less time and with less effort.\n\
    \nThe SimpleC library will make the following functions as easy as one command\
    \ line:\n\n- Controlling Digital Outputs\n- Reading Digital Inputs\n- Monitoring\
    \ Analog Voltages\n- Driving Liquid Crystal Display Modules\n- Driving Digital\
    \ PWM Signals\n- Sending/Receiving via SPI and I2C Communication\n- Writing to/Reading\
    \ from External EEPROM\n- Writing to/Reading from External I/O Expanders\n- And\
    \ More!\n\nThe book uses the open source PIC16F886 based CHIPINO module for the\
    \ hardware and also forms the platform to make future electronic projects and\
    \ gadgets easier to build.\n"
