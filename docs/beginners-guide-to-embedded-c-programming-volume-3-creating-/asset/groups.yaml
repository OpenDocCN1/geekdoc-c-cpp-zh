    \ from the user\n    printf(\"I detected [%c]\\r\\n\",input);    // echo it back\n\
    \    }//end while\n}//end main\n```\n\n## SPI 通信\n\n串行外设接口（SPI）通常用于与外部电路通信。PIC16F886\
    \ 上的 SPI 端口是一个在后台运行的硬件外设。因此，使用下面的 SimpleC 库函数可以简化其设置和运行。该外设仅设置为 SPI 主机，而非从机。\n\
    \n## spi_init（）\n\nspi_init 函数将 SPI 端口设置为串行通信的主机。SPI 连接在外设中预设。引脚 4（C3）是时钟，引脚 3（C4）是主机输出从机输入（MOSI\
    \ 或 SDO），引脚 2（C5）是主机输入从机输出（MISO 或 SDI）。为了使用 SPI 外设，spi_init 必须位于主循环的顶部。\n\n示例：\n\
    \n```\n//*****Sample code to control an MCP23S08 SPI I/O Expander***\nvoid main(void)\n\
