    \        ANSELH = 0;\n        CM1CON0 = 0;        //Comparators Shut off\n   \
    \     CM2CON0 = 0;\n        INTCON=0;           // Disable the interrupts\n}\n\
    ```\n\n如果你读过本系列的第1卷或第2卷，那么接下来的部分应该很熟悉。它是一个毫秒基准函数，然后是一个暂停函数，用于创建简单的延迟。这里使用了 Timer0，这些函数也将包含在\
    \ SimpleC 库中。此版本针对 CHIPINO 上的 16 MHz 晶振进行了调整。\n\n```c\n/************************************************\n\
    * msecbase = 1 msec pause routine\n* The oscillator is set to 16 Mhz and the\n\
    * internal instruction clock is 1/4 of the oscillator.\n* This makes the internal\
    \ instruction clock 4 Mhz or\n* 0.25 usec per clock pulse.\n* Using the 1:16 prescaler\
    \ on the clock input to Timer0\n* slows the Timer0 count increment to 4 usec.\n\
    * Therefore 250 counts of the Timer0 would make a one\n* millisecond delay (250\
    \ * 4 usec). But there are other\n* instructions in the delay loop so using the\
    \ MPLAB\n* stopwatch we find that we need Timer0 to overflow at\n* 243 clock ticks.\
    \ Preset Timer0 to 13 (0D hex) to make\n* Timer0 overflow at 243 clock ticks (256-13\
    \ = 243).\n************************************************/\n\nvoid msecbase(void)\n\
    {\n        OPTION = 0b00000011;       //Set prescaler to TMR0 1:16\n        TMR0\
    \ = 0x0d;               //Preset TMR0 to overflow on 243 counts\n        while(!T0IF);\
    \              //Stay until TMR0 overflow flag equals 1\n        T0IF = 0;   \
    \               //Clear the TMR0 overflow flag\n}\n\n/************************************************\n\
    //Pause - millisecond delay routine 1 to 65,535 milliseconds\n/************************************************\n\
    \nvoid pause( unsigned long usvalue )\n{\n```\n"
