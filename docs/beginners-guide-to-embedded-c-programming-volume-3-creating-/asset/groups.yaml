    \ data read back is sent to a variable. In this case we use PORTB label as the\
    \ variable. The HI-TECH compiler allows this because the register names are setup\
    \ as volatile variables in the specific header file for the PIC16F886 automatically\
    \ included by the compiler. This line makes the LED's display the value read back\
    \ from the EEPROM in binary form.\n\n```\ncnt=0;\nwhile(cnt<=10)\n{\nPORTB =I2C_EEIN(cnt);\
    \ // Display data read from EEPROM on\n                       // LEDs in binary\n\
    ```\n\nA pause function has the parameter 1000 to create a 1 second delay allowing\
    \ you to read the binary value on the LED's. This is slower than the delay for\
    \ writing to the EEPROM so you can easily tell when it's writing and when its\
    \ reading by the speed of the LED changes.\n\n```\npause (1000);    // Delay for\
    \ 1 second to read LEDs\n```\n\nThe cnt variable is incremented for the next test\
    \ of the value in the while loop. When the count reaches 10, the loop is done\
    \ and the program jumps back to the beginning of the main loop, which starts the\
    \ whole process over again.\n\n```\ncnt=cnt + 1;    // Increment cnt variable\n\
    } \n} //End Main\n```\n\n### Next Steps\n\nReplacing the LED's with an LCD is\
    \ the most logical next step and I've already showed you how easy that is with\
    \ SimpleC. You could also add an ADCIN function to read a sensor, average it against\
    \ previous readings and then store the result in the EEPROM. This would create\
    \ a simple data logger for just about anything you can measure with an analog\
    \ sensor.\n\n### Conclusion\n\nIf you worked through the projects in my Beginner’s\
    \ Guide to Embedded C Programming Volume 2 book, then at this point you should\
    \ really understand how much typing the Simple C library saves you. In this book\
    \ I wanted to give you a starting point for using the most common functions people\
    \ asked for via email responses to my first two books in this series.\n\nSimpleC\
    \ can now help you make projects faster or prove out a concept quicker. I can\
    \ see where several of these projects could be combined to create more complex\
    \ projects. Combining the LCD, EEPROM and RS232 communication projects make a\
    \ great starting point to building a data logger. The ADC could be used to read\
    \ a sensor and the measurements displayed on the LCD while also being stored in\
    \ EEPROM. Later on you could retrieve that data with a computer by connecting\
    \ the serial port to the Rx and Tx pins of the data logger module. All that could\
    \ be done in a short list of SimpleC functions. This is just one example of how\
    \ these can be combined or at least give you a starting point for building more\
    \ complex projects.\n\nOne thing I’ve found in talking to people who program in\
    \ C is many of them rely on libraries of functions to build the projects from.\
    \ These could be functions they created or functions they “borrowed” from another\
    \ programmer. I’ve also seen many code examples on the internet that you can easily\
    \ modify to fit your needs. The whole point of this book and my previous embedded\
    \ C books are to teach you enough of the basics so you can understand the functions\
    \ at these various other sources. By no means is there a standard approach either,\
    \ therefore one persons code may be very helpful while another on the same topic\
    \ may be so hard to follow you would be better off writing a new function yourself.\
    \ That is the decision you have to make as the programmer.\n\nI want to thank\
    \ all those who read my first two books on Embedded C and then continued on with\
    \ this one. It’s that loyalty that makes this long process of writing books seem\
    \ worth all the nights of typing and typing and typing… It’s a very long process.\n"
