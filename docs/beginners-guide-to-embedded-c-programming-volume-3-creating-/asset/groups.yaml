    \ through the on board UART peripheral. The Tx and Rx pin are fixed to pins 0\
    \ (C6) and pin 1 (C7) respectively. The baud rate can be set to 2400 or 9600 in\
    \ this init_serial function.\n\nExample:\n\n```\nvoid main(void){\n    init_micro();\
    \     // Setup micro ports\n    init_serial(9600); // set up the USART baud rate\
