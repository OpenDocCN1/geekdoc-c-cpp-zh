  mdcn: "\n\n只需单击屏幕顶部的“全部构建”按钮即可轻松完成，如图4-12所示。\n\n![](img/910b145bee7ca8076318eafbe6d13997_108_0.png)\n\
    \n### 图4-12：MPLAB 项目全部构建\n\n如果代码中有任何错误，它们会在此步骤中出现。“全部构建”的结果将显示在输出窗口中。我对示例项目执行了此操作，构建成功，如图4-13所示。\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_108_1.png)\n\n### 图4-13：MPLAB 全部构建成功\n\
    \n构建成功后，我们需要将代码加载到 PIC16F886 中。为此，可以使用 CHIPAXE PK2 克隆编程器或 Microchip PICkit 2 编程器。单击“编程器>选择编程器>PICkit\
    \ 2”菜单选项以启用 PICkit 2，如图4-14所示。如果您有 PICkit 3 或 ICD3，也可以使用它们。只需从下拉菜单中选择它们，而不是选择\
    \ PICkit 2。\n\n![](img/910b145bee7ca8076318eafbe6d13997_112_0.png)\n\n图4-19B：CHIPINO\
    \ 模块设置\n\n### 软件\n\n这部分软件易于学习和理解。如果您曾经使用过 PIC 的 BASIC 编译器，那么这里会非常熟悉。SimpleC 库提供了用于设置引脚的\
    \ high 和 low 函数。这些函数设置 TRIS 寄存器，如果使用 high 函数，则向端口寄存器引脚写入 1；如果使用 low 函数，则写入 0。我在之前书籍中使用过的\
    \ pause 函数现在已纳入 SimpleC 库，因此延迟部分很容易实现。该程序只是循环设置和清除 LED 端口引脚。\n\n```\n/*********************************\n\
    Flash an LED example using SimpleC\nThis code will drive an LED on pin 8(RB0)\n\
    and flash it on and off at a 1 second rate.\nConnections:\nPIN 8(RB0) to LED Anode\n\
    LED Cathode to 1k ohm\n1k ohm to Ground\n*********************************/\n\
    ```\n\n```\n#include \"simplec1.1.h\"\n```\n\n```\nvoid\nmain(void)\n{\n    init_micro();\
    \    // Initialize I/O\n    while (1==1)\n    {\n        high(8);\n        pause\
    \ (1000);    // Delay for 1 second (1.0000 sec)\n        low(8);\n        pause\
    \ (1000);    // Delay for 1 second\n    }\n}\n```\n\n### 工作原理\n\n程序的第一部分只是包含一个描述性头部，说明代码的功能，然后描述电气连接。\n\
    \n```\n/*********************************\nFlash an LED example using SimpleC\n\
    This code will drive an LED on pin 8(RB0)\nand flash it on and off at a 1 second\
    \ rate.\nConnections:\nPIN 8(RB0) to LED Anode\nLED Cathode to 1k ohm\n1k ohm\
    \ to Ground\n*********************************/\n```\n\nSimpleC 库通过包含 simplec1.1.h\
    \ 文件来设置。所有配置设置以及 SimpleC 库使用的一些宏定义都在这个头文件中设置，因此所有 SimpleC 文件都需要包含它。\n\n```\n#include\
    \ \"simplec1.1.h\"\n```\n\n主循环代码以 init_micro 函数开始。该函数将模拟引脚配置为数字模式并关闭所有比较器。这是我之前的书中每个项目都添加的标准代码，因此我将其缩减为\
    \ SimpleC 库中的一个函数。不用说，这也应该是每个 SimpleC 项目文件的一部分。\n\n```\nvoid\nmain(void)\n{\n\
    \    init_micro();    // Initialize I/O\n}\n```\n\n主循环代码包含 high 和 low 函数，以及两个\
    \ pause 函数，它们延迟 1000 毫秒，产生一秒开、一秒关的闪烁。high 和 low 的一个优点是它们控制参数定义的位。这些函数是针对 CHIPINO\
    \ 模块的编号引脚编写的。允许使用 1 到 13 的值，因为这些是 CHIPINO 的引脚编号。不能用引脚名称（如 RB0）代替数字，必须遵循编号系统。\n\
    \n```\nwhile (1==1)\n{\n    high(8);\n    pause(1000);    // Delay for 1 second\
    \ (1.0000 sec)\n    low(8);\n    pause (1000);   // Delay for 1 second\n}\n```\n\
    \n### 后续步骤\n\n这个简单项目能做什么，确实取决于您的想象力。high 和 low 函数一次只操作一个引脚，因此控制多个引脚会使程序非常容易编写，但也会很长。我发现当您只需要一种简单的方法来控制一个引脚时，这些函数效果最好。考虑到这一点，也许可以更改硬件来控制继电器，或者使用这个简单的闪烁程序创建一个脉冲来控制伺服电机。这可以很好地演示数字引脚控制是微控制器一切工作的核心。\n\
    \n## 第5章 – SimpleC 数字输入\n\n正如我在之前的书中展示的，在 C 语言中读取输入并不困难，但我仍然决定创建一个函数，通过设置 TRIS\
    \ 或方向寄存器，然后读取特定端口引脚的状态，来轻松读取端口引脚。本项目通过监视一个瞬时开关来演示这一点：按下开关时点亮一个 LED，开关空闲时点亮另一个\
    \ LED。\n\n### 硬件\n\n本项目的电路如图5-1所示，显示了与 PIC16F886 的所有连接。端口引脚名称显示在芯片的原理图符号上，而 CHIPINO\
    \ Mini 的编号引脚名称显示在标签上。开关连接到引脚 8，也就是 RB0。开关在其常开空闲状态下被上拉到 V+。当开关被按下时，RB0/8 引脚将检测到低电平或接地值。LED\
    \ 连接到 CHIPINO Mini 模块的引脚 9 和 10。\n\n![](img/910b145bee7ca8076318eafbe6d13997_116_0.png)\n\
    \n### 图5-1：SimpleC 输入原理图\n\n图5-2A中的面包板设置显示了连接方式，您可以将其与自己的面包板设置对应起来。模块偏移到面包板底部，这样所有端口导线都可以穿过顶部。电源通过连接到\
    \ CHIPINO Mini 模块的编程器进入，并通过两个跳线为电源轨供电。上部的电源轨负极为外侧一排，内侧一排为正极。在面包板底部，内侧一排通过从上到下的长跳线连接为负极。图5-2B显示了使用\
    \ CHIPINO 模块的相同设置。\n\n![](img/910b145bee7ca8076318eafbe6d13997_117_0.png)\n\n\
    ### 图5-2A：面包板设置\n\n既然我们已经存储了开关的状态，就可以测试它来执行不同的操作。如果值为 1 或开关空闲，则使用 high 和 low 函数打开一个\
    \ LED 并关闭另一个。如果开关被按下，则 LED 的亮灭相反。此操作连续运行，因此我们可以快速看到开关的任何按下或释放。\n\n```\nif (value\
    \ == 1)\n{\n    //*** Switch is idle ***\n    high(11);     // Pin 11 LED on\n\
    \    low(10);      // Pin 10 LED off\n}\nelse\n{\n    //*** Switch is Pressed\
    \ ***\n    low(11);      // Pin 11 LED off\n    high(10);     // Pin 10 LED on\n\
    }\n}\n```\n\n### 后续步骤\n\n一个明显的下一步是更改按下开关时发生的情况。随着您对 SimpleC 库更加熟悉，您会发现当开关被按下时，在\
    \ LCD 上显示内容或发送 SPI 或 I2C 信号非常容易。\n\n## 第6章 – SimpleC LCD 控制\n\n用一行命令控制 2x16 LCD\
    \ 字符模块将非常有用。我见过在 BASIC 编译器中，一行命令有大量不同的参数选项。我没有提供多个选项，而是决定创建一组简单的函数，用于在 2x16 LCD\
    \ 上显示字符和数字。本章详细介绍了如何使用 SimpleC 库的这一功能，并提供了两个独立的软件项目，共用一个通用硬件设置。\n\n### 硬件\n\n\
    硬件连接在 simplec1.1.h 文件中定义，使用 PORTB 引脚，即 CHIPINO 上的第 8 到第 13 引脚。这六个引脚控制 LCD 模块的\
    \ E、RS 和 DB4-DB7 引脚，这正是 4 位模式操作所需的全部引脚，而 4 位模式是最常见的 LCD 控制方式。图6-1中的原理图显示了连接，图6-2A显示了面包板布局。图6-2B适用于使用\
    \ CHIPINO 模块的用户。\n\n![](img/910b145bee7ca8076318eafbe6d13997_122_0.png)\n\n图6-1：LCD\
    \ 原理图\n\n"
