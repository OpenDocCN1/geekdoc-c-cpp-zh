    is open sourced so any user can break it up into separate .c and .h files to optimize
    the use of program memory space. I even modified it before finishing this book.
    I originally started at version 1.0 but after I had handed out a few beta versions
    I discovered some minor changes were needed so I released version 1.1 which is
    in this book.


    # SimpleC Software Description


    Two files make up the Simple C library; simplec1.1.h and simplec1.1.c. The number
    1.1 is the version level so as I add new functions in the future the version number
    will increase from 1.1, to 1.2, to 1.3, etc. These have been opened sourced and
    can be found as part of the books software download and at the chipino.cc download
    page so adding to this library can be a community project where anyone can improve
    upon the capability.


    In this section I wanted to briefly cover how each function works so you can reference
    this chapter if you have issues in using the library or need to modify it for
    your specific application. Later on I’ll go deep into the actual code for each
    function for those that want to modify it.


    *Note: All SimpleC functions are case sensitive meaning if they are written as
    lower case in the simplec.c file then you need to write lower case in your program.
    Some specific functions are written in upper case so please be aware of this.*


    # Initialization and Time Delays


    The first set of functions in the SimpleC library address the microcontroller
    initialization, time base and basic I/O control. The configuration settings and
    some I/O definitions are in the simplec1.1.h file which I’ll cover later. The
    rest of the initializations are handled by these functions so let me summarize
    them here.'
