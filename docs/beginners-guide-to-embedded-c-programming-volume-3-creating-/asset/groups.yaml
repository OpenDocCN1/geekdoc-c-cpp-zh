    \ `/*` 开头，在较远处以 `*/` 结束。这表示两者之间的所有内容都只是注释，而不是代码。\n\n程序将快速地向外部 EEPROM 发送 10 个数据字节，并将每个存储的值以二进制形式显示在四个\
    \ LED 上。然后，它将从 EEPROM 读回每个字节，并将该值以二进制形式显示在四个 LED 上。写入部分会快速地从 1 到 9 以二进制计数，然后读取部分会放慢速度，以二进制格式从\
    \ 9 倒数到 1。\n\n```\n/*\n * I2C External EEPROM example using SimpleC\n * This code\
