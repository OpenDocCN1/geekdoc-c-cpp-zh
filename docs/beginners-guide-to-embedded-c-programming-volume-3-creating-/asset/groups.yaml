  - "[PAGE 97]\n\nA stop bit is similar using the i2c_stop() function. It waits for\
    \ bus idle before sending the bit.\n\n```\n//***********************************************\n\
    void i2c_stop()\n{\n    i2c_waitForIdle();\n    PEN=1;\n}\n```\n\nThe heavy work\
    \ of the I2C is sending and receiving the bytes. The receive portion is handled\
    \ by the i2c_read() function. It issues an ACK bit if the ack parameter is zero.\n\
    \n```\n//***********************************************\nint i2c_read( unsigned\
    \ char ack )\n{\n    unsigned char i2cReadData;\n    i2c_waitForIdle();\n    RCEN=1;\n\
    \    i2c_waitForIdle();\n    i2cReadData = SSPBUF;\n    i2c_waitForIdle();\n \
    \   if ( ack )\n    {\n        ACKDT=0;\n    }\n    else\n    {\n        ACKDT=1;\n\
    \    }\n    ACKEN=1;      // send acknowledge sequence\n    return( i2cReadData\
    \ );\n}\n//***********************************************\n```\n\nThe i2c_write()\
    \ function stores the parameter byte in the I2C peripheral buffer and then sends\
    \ that byte. If an ACK bit is received, the function returns a 1 indicating a\
    \ proper communication occurred.\n\n```\nunsigned char i2c_write( unsigned char\
    \ i2cWriteData )\n{\n    i2c_waitForIdle();\n```"
  - "[PAGE 98]\n\n```\nSSPPBUF = I2CwriteData;\nreturn ( ! ACKSTAT ); // function\
