    我用来创建这些项目的最终设置如图 1-9 所示。图中开发板连接到了一台小型上网本电脑。这是我的便携式便捷设置，让我可以在旅途中写这本书，同时我可以在午餐时间或某个家人找不到我的隐蔽地方开发代码。我花不到
