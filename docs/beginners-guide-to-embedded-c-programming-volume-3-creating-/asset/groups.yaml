    \ 191\n\nCHIPAXE.com 提供的克隆编程器，供那些想要以折扣价购买第二台编程器的人使用。如果你想使用新的 PICkit 3，你也可以将其与这些模块一起使用。\n\
    \n本书将向你展示我如何创建我所称的“SimpleC 库”中的实用函数，然后展示多个项目来演示如何使用该库。我发现这个库非常有用，现在我将其用于大多数 HI-TECH\
    \ C 项目中。我不会声称这是最好的 C 代码，但我认为你会看到这些函数在开发快速原型或开发项目时能为你节省大量时间和精力。它们构成了一个优秀的函数库，全部开源，因此你可以根据需要对其进行修改。使用该库也不会妨碍你使用\
    \ HI-TECH 编译器的核心功能。我在前两本书中教授的所有代码也可以应用于此设置。\n\n本书还涵盖了前两本未涉及的一个主题，那就是 I2C 通信。PIC16F886\
    \ 具有改进的通信外设端口，使 I2C 控制变得更加容易。第 2 章将在本书深入探讨 SimpleC 库之前介绍这一点。\n\n本书中的软件可以从我的网站\
    \ www.elproducts.com/cbook3files 下载。任何错误修正也可以在我的网站（www.elproducts.com）上找到。尽管多次编辑并尝试捕捉错误，但没有一本书是完美的，但我们尽最大努力将其降到最低。如果你遇到问题或对本书内容有疑问，可以通过\
    \ chuck@elproducts.com 联系我。我会尝试回复所有收到的邮件，尽管有些会被垃圾邮件过滤器拦截。如果你没有收到我的回复，请再次发送邮件，因为我可能第一次没有看到。\n\
    \n我希望你能从本书中获得更多嵌入式 C 知识，并经常访问我的网站，看看我接下来在做什么。我希望能不时添加更多信息，因为它致力于帮助读者学习如何开发自己的有趣电子产品。\n\
    \nChuck Hellebuyck\n\n![](img/910b145bee7ca8076318eafbe6d13997_12_0.png)\n\n图\
    \ 1-2：28 引脚 CHIPAXE 面包板模块\n\n我接触到了一种与流行的 Arduino 模块尺寸相匹配的 CHIPINO 模块早期原型（图 1-3）。该设置提供了一个即插板，顶部包含一个小型面包板，因此你可以再次构建电路，然后将其拔下以供以后参考。我能够参与改进该模块的团队，使其成为\
    \ chipaxe.com 网站上所示的当前形式。该板具有带内置 5V 和 3V 调节器的电源端口，因此我可以轻松地将 9V 电源适配器或 9V 电池连接到此设置。所有\
    \ I/O 都引出到边缘的排针上，因此定制板可以轻松插入主板顶部。对于样式相似的 Arduino 模块，已经有很多即插板，或称为扩展板。许多 Arduino\
    \ 扩展板可以插入此 CHIPINO 板。这将使未来的书籍和项目设置变得更加容易，因为硬件已经创建好了。\n\n![](img/910b145bee7ca8076318eafbe6d13997_12_1.png)\n\
    \n![](img/910b145bee7ca8076318eafbe6d13997_12_2.png)\n\n图 1-3：CHIPINO 模块和原型板\n\
    \n不过对于本书，我想要更大的面包板空间来构建电路。这就是我非常喜欢 CHIPAXE 风格模块的原因，它可以插入任何尺寸的面包板。尽管我也很喜欢\n"
