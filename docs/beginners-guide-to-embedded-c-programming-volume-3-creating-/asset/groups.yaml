    ![](img/910b145bee7ca8076318eafbe6d13997_21_0.png)


    图 2-1：I²C™ 总线设置


    ## 主设备与从设备


    I²C 协议定义了什么是主设备、什么是从设备。主设备控制总线。它产生时钟信号，并发送构成完整 I²C 消息的起始和停止信号。从设备必须监听发送的每一条消息，如果收到自己的控制字节，就进行响应。然后从设备向主设备回应数据。有些系统支持多主设备，但在本书中，我只会专注于单主设备配置。


    如前所述，I²C 总线有两条线——一条数据线和一条时钟线。如果你熟悉移位寄存器的工作原理，那么这就很容易理解。主设备通过将数据线拉低或让外部电阻将数据线拉高来在数据线上放置一个位。然后，主设备通过将时钟线拉低，再释放回高电平来产生时钟脉冲。从设备端的电路接收该数据位的方式与移位寄存器移入一个位的方式相同。数据和时钟线的这种脉冲过程一直持续到
    I²C 消息的第一部分传输完毕。图 2-2 显示了数据线上的 I²C 消息格式。


    ![](img/910b145bee7ca8076318eafbe6d13997_22_0.png)


    ### 写命令时序


    ![](img/910b145bee7ca8076318eafbe6d13997_22_1.png)


    ### 读命令时序


    图 2-2：I²C 数据线消息格式


    图 2-2 中的信号显示了与外部 EEPROM 器件通信的写和读时序。我将使用 Microchip 24LC01B EEPROM 器件来演示如何使用 I²C
    作为通信协议，在外部 EEPROM 中存储和读回数据。


    控制字节是一个 7 位宽的值，第 8 位在写操作时为 0，在读操作时为 1。如你所见，读时序需要两个控制字节，而写时序只需要一个。这是因为读操作要求主设备先将存储器地址字节写入
    EEPROM，以便 EEPROM 定位数据，然后再从 EEPROM 读取数据。在写操作期间，主设备将地址和数据字节都发送给 EEPROM，因此只发送一个写控制字节。另请注意，图
    2-2 显示了一个可选的复数“数据字节”。这是因为你可以通过一次读或写控制字节命令发送或接收一串字节。


    ACK 位是应答位。从设备在主设备仍在脉冲时钟线时将数据线拉低。主设备在发送下一个命令字节之前会查找该 ACK 位。这是从设备告诉主设备它已成功收到该信息字节的唯一方式。


    I²C 不像其他通信技术（如我在第 2 卷中介绍的串行外设接口 (SPI)）那样快，但它仍然很快。典型的时钟速度通常为 10 kHz 或 100 kHz。高速模式运行在
    400 kHz。你必须确保你的从设备部件能够承受主时钟的速度。


    | 位 3-0 | SSPM<3:0>：同步串口模式选择位 |

    |---|---|

    | 0000 | SPI 从模式，时钟 = Fosc/4 |

    | 0001 | SPI 主模式，时钟 = Fosc/16 |

    | 0010 | SPI 主模式，时钟 = Fosc/64 |

    | 0011 | SPI 主模式，时钟 = TMR2 输出/2 |

    | 0100 | SPI 从模式，时钟 = SCK 引脚，SS 引脚控制使能 |

    | 0101 | SPI 从模式，时钟 = SCK 引脚，SS 引脚控制禁用，SS 可用作 I/O 引脚 |

    | 0110 | I²C 从模式，7 位地址 |

    | 0111 | I²C 从模式，10 位地址 |

    | 1000 | I²C 主模式，时钟 = Fosc / (4 * (SSPADD+1)) |

    | 1001 | 加载功能 |

    | 1010 | 保留 |

    | 1011 | I²C 固件控制的主模式（从设备空闲） |

    | 1100 | 保留 |

    | 1101 | 保留 |

    | 1110 | I²C 从模式，7 位地址，使能起始和停止位中断 |

    | 1111 | I²C 从模式，10 位地址，使能起始和停止位中断 |


    位 4 在主模式下不使用，因此我们将其清零或置 0。我们希望使能时钟，因此将 SSPEN 位（即第 5 位）设置为 1。


    | 位 5 | SSPEN：同步串口使能位 |

    |---|---|

    |  | 在两种模式下，使能时，这些引脚必须正确配置为输入或输出 |

    | 在 SPI 模式下 |  |

    | 1 | 使能串口，并将 SCK、SDO、SDI 和 SS 配置为串口引脚来源 |

    | 0 | 禁用串口，并将这些引脚配置为 I/O 端口引脚 |

    | 在 I²C 模式下 |  |

    | 1 | 使能串口，并将 SDA 和 SCL 引脚配置为串口引脚来源 |

    | 0 | 禁用串口，并将这些引脚配置为 I/O 端口引脚 |


    | 位 4 | CKP：时钟极性选择位 |

    |---|---|

    | 在 SPI 模式下 |  |

    | 1 | 时钟空闲状态为高电平 |

    | 0 | 时钟空闲状态为低电平 |

    | 在 I²C 从模式下 |  |

    |  | SCK 释放控制 |

    | 1 | 使能时钟 |

    | 0 | 保持时钟为低电平（时钟拉伸）。（用于确保数据建立时间。） |

    | 在 I²C 主模式下 |  |

    |  | 此模式下不使用 |


    位 6 和位 7 是状态位，因此在设置中我们只需将它们保持为零。将所有这些加起来，你会得到一个十六进制值 0x38。因此，在我们的软件中，我们将把 SSPCON
    寄存器设置为 0x38。


    下一个寄存器是 SSPCON2 寄存器，它有许多状态位和一些设置位。我们将它的所有位都初始化为零，因为我们稍后会在发送数据的过程中修改或读取这些位。

