    # Beginner''s Guide to Embedded C Programming

    Volume 3

    Creating the SimpleC Library of Functions


    In his "Beginner''s Guide to Embedded C" and "Beginner''s Guide to Embedded C
    – Volume 2" books Chuck Hellebuyck took the reader through the very beginning
    of learning how to program embedded microcontrollers in the C language using a
    Microchip PIC microcontroller and the Microchip HI-TECH C compiler.


    In "Beginner''s Guide to Embedded C Programming – Volume 3" Chuck Hellebuyck takes
    another leap forward by showing you the steps to create the SimpleC library of
    functions that make programming in C even easier. This approach shows the reader
    how they can create their own functions and expand the SimpleC library to make
    creating microcontroller projects much quicker than writing in raw C code. This
    book will clearly be the reference for future programmers who want to build electronic
    gadgets without all the painstaking steps of writing every C statement while producing
    a working project in less time and with less effort.


    The SimpleC library will make the following functions as easy as one command line:


    +   - Controlling Digital Outputs

    +   - Reading Digital Inputs

    +   - Monitoring Analog Voltages

    +   - Driving Liquid Crystal Display Modules

    +   - Driving Digital PWM Signals

    +   - Sending/Receiving via SPI and I2C Communication

    +   - Writing to/Reading from External EEPROM

    +   - Writing to/Reading from External I/O Expanders

    +   - And More!


    The book uses the open source PIC16F886 based CHIPINO module for the hardware
    and also forms the platform to make future electronic projects and gadgets easier
    to build.'
