    # Next Steps


    There are many ways to take this from here. A real easy change is to adjust the
    frequency and duty cycle to make sure you understand how the PWM function works.
    You can also drive more than LEDs with PWM. You can use this to drive a buzzer
    for noise or use it for controlling the speed of a DC motor if you have the PWM
    control a transistor that grounds the motor. PWM is very handy and the SimpleC
    library makes it easy to implement.


    The SimpleC calculations are based on a 16 Mhz oscillator that runs the CHIPINO
    module. The PWM peripheral at this clock speed limits the frequency range from
    1khz to 32khz so you can adjust the frequency parameter from 1000 to 32000. You
    could do that in a loop to get a variable frequency at a fixed duty cycle. That
