    void i2c_start()\n{\ni2c_waitForIdle();\nSEN=1;\n}\n```\n\nAn I2C repeat start\
    \ bit is created with the i2c_repstart( ) function.\n\n```\n//**********************************************************\n\
    void i2c_repStart()\n{\ni2c_waitForIdle();\nRSEN=1;\n}\n```"
  md: "\nThe HI-TECH compiler already has some pre-built functions included in the\
    \ stdio library which is automatically included during the compile time if the\
    \ stdio.h file is included. One of those is the printf() function. This is described\
    \ in the HI-TECH manual and can be used for all USART communication but I wanted\
    \ a couple specific byte control functions for the SimpleC library as well. The\
    \ first is putch() which is used to send an ASCII character out of the USART.\
    \ The function makes sure the transmit buffer is empty and then fills it with\
    \ the ASCII byte in the parameter section of the function header.\n\n// ****************************************\n\
    // Send ASCII Character from Hardware USART\n// ****************************************\n\
    \nvoid\nputch(unsigned char byte)\n{\n    /* output one byte */\n    while(!TXIF);\
    \ /* set when register is empty */\n    TXREG = byte;\n}\n\nThe second is the\
    \ receive byte getch() function that tests for data in the receive register and\
    \ then returns the byte received from the function call. These make serial communication\
    \ very easy.\n\n// ****************************************\n// Receive ASCII\
    \ Character from Hardware USART\n// ****************************************\n\
    \nunsigned char\ngetch()\n{\n    /* retrieve one byte */\n    while(!RCIF); /*\
    \ set when register is not empty */\n    return RCREG;\n}\n\nAnother form of communication\
    \ is through the Serial Peripheral Interface (SPI), which is commonly used to\
    \ talk to EEPROM, temperature sensors, I/O expanders and many more external peripheral\
    \ chips. Using the hardware SPI can also be a bit confusing at first so having\
    \ these routines in the library is helpful. The first is the setup function spi_init().\
    \ This function controls the SSPCON and the SSPSTAT register bits for 250 Khz\
    \ SPI communication. This is not the fastest possible SPI speed but certainly\
    \ a reliable SPI communication speed.\n\n// ****************************************\n\
    // Hardware SPI Setup\n// ****************************************\n\n/* SPI Peripheral\
    \ Setup */\nvoid spi_init(void)\n{\n// *** 16F886 Settings ***\nTRISC5 = 0; //\
    \ SDO pin set to output\nTRISC3 = 0; // SCK pin set to output (Master Mode)\n\
    TRISA5 = 0; // CS pin set to output\n\n/* SSPCON Settings */\n// *** FOSC = 4Mhz\
    \ ***\n// SSPCON = 0b00000001; // SPI Clock Frequency set to FOSC/16 = 250khz\n\
    \n// *** FOSC = 16Mhz ***\nSSPCON = 0b00000010; // SPI Clock Frequency set to\
    \ FOSC/64 = 250khz\nCKP = 0; // Idle state of clock is low\n\n/* SSPSTAT Settings\
    \ */\nSMP = 1; // Sampled at end of data pulse\nCKE = 1; // Data Transfered on\
    \ rising edge of clock\n\n/* SPI Peripheral on */\nSSPEN = 1; // Enable SPI peripheral\n\
    pause(1); // Allow SPI to Stabilize\n}\n\nThe SPI peripheral will send a bit out\
    \ the SDO pin (Master Out Slave In) while it clocks in data at the SDI pin (Master\
    \ In Slave Out). Therefore one function can handle it all. SPI_OUTPUT() is that\
    \ function and first stores the byte defined in the parameter section of the function\
    \ inside the internal SPI buffer register. The SPI hardware will then automatically\
    \ send out that byte and then receive a byte in the receive buffer. The function\
    \ returns the byte received to the routine that called this function.\n\n// ****************************************\n\
    // Hardware SPI Output\n// ****************************************\n\nchar SPI_OUTPUT\
    \ ( char spi_byte )\n{\nSSPBUF = spi_byte;\ndo {\n}\nwhile(!IBF);\nreturn SSPBUF;\n\
    }\n\nAs I mentioned, SPI is often used to communicate with external EEPROM chips.\
    \ The WR_BYTE() function was created to talk to a SPI based\n\n// External I/O\
    \ Expander Write\n// ****************************************\nvoid WR_MCP23S08\
    \ ( char regist, char data )\n{\n    char dummy;\n    CS = 0;                \
    \     // Select MCP23S08 by pulling CS low\n    dummy = SPI_OUTPUT ( 0x40 ); //\
    \ Send Device Opcode, select Write mode\n    dummy = SPI_OUTPUT ( regist ); //\
    \ Send Register Address location\n    dummy = SPI_OUTPUT ( data ); // Send Data\
    \ byte\n    CS = 1;                     // Release EEPROM to allow byte to be\
    \ written\n}\n\nReading from the MCP23S08 is completed with the RD_MCP23S08 ()\
    \ function.\n\n// ****************************************\n// External I/O Expander\
    \ Read\n// ****************************************\n\nchar RD_MCP23S08 ( char\
    \ regist )\n{\n    char dummy;\n    CS = 0;                     // Set chip select\
    \ low\n    dummy = SPI_OUTPUT (0x41); // Send Device Opcode, select Read mode\n\
    \    dummy = SPI_OUTPUT (regist); // Send Address\n    char data = SPI_OUTPUT\
    \ ( 0x00 ); // Receive data byte\n    CS = 1;                     // Bring chip\
    \ select high to terminate\n    return data;\n}\n\n*Special Note: Notice that\
    \ I used all capital letters for the special SPI functions. I did this to separate\
    \ part specific functions from the generic library functions. When you use these,\
    \ make sure you use capital letters.*\n\nOne of the more popular requests I received\
    \ from the previous books was a simpler way to control the hardware PWM port.\
    \ The PIC16F886 has two of them so I created two PWM functions; pwmout1 () and\
    \ pwmout2 (). The parameters of the function define the duty cycle and the frequency.\
    \ Since both PWM’s must use the same clock source on the PIC16F886, they have\
    \ to have the same frequency. All the register settings are handled in the function\
    \ so you don’t need to issue a pwm_init function. Once turned on though, the PWMs\
    \ continue to run. If you want to shut them off you place a CCP1CON = 0 to shut\
    \ off PWM 1 and CCP2CON = 0 to shut off PWM 2.\n\n// ****************************************\n\
    char adcin (char chan)\n{\nswitch(chan)\n{\ncase 0:\n    TRISA0 = 1;         \
    \   // Make RA0/AN0 an Input\n    ANS0 = 1;              // Configure RA0 to Analog\
    \ to Digital input\n    ADCON0 = 0b11000000;   // Configure A/D to use AN0, left\
    \ justified\n    break;\n\ncase 1:\n    TRISA1 = 1;            // Make RA1/AN1\
    \ an Input\n    ANS1 = 1;              // Configure RA1 to Analog to Digital input\n\
    \    ADCON0 = 0b11000100;   // Configure A/D to use AN1, left justified\n    break;\n\
    \ncase 2:\n    TRISA2 = 1;            // Make RA2/AN2 an Input\n    ANS2 = 1;\
    \              // Configure RA2 to Analog to Digital input\n    ADCON0 = 0b11001000;\
    \   // Configure A/D to use AN2, left justified\n    break;\n\ncase 3:\n    TRISA3\
    \ = 1;            // Make RA3/AN3 an Input\n    ANS3 = 1;              // Configure\
    \ RA3 to Analog to Digital input\n    ADCON0 = 0b11001100;   // Configure A/D\
    \ to use AN3, left justified\n    break;\n\ncase 4:\n    TRISA5 = 1;         \
    \   // Make RA5/AN4 an Input\n    ANS4 = 1;              // Configure RA5 to Analog\
    \ to Digital input\n    ADCON0 = 0b11010000;   // Configure A/D to use AN4, left\
    \ justified\n    break;\n\ndefault:\n    break;\n}\n\nADON = 1;              \
    \  // A/D Converter on;\nGODONE = 1;              // Start A/D conversion on AN0\n\
    pause(1);               // Sample Time\nwhile(GODONE == 1);      // Wait for conversion\
    \ to complete\nchar value = ADRESH;\nreturn value;\n}\n\nIn the first chapter\
    \ I showed how to use the I2C peripheral. Those functions are now part of the\
    \ SimpleC library. The first is the i2c_init ().\n// ****************************************\n\
    // Hardware I2C single master routines for PIC16F886\n// for HI-TECH PIC C COMPILER.\n\
    //\n// i2c_init - initialize I2C functions\n// i2c_start - issue Start condition\n\
    // i2c_repStart- issue Repeated Start condition\n// i2c_stop - issue Stop condition\n\
    // i2c_read(x) - receive unsigned char - x=0,\n// don't acknowledge - x=1, acknowledge\n\
    // i2c_write - write unsigned char - returns ACK\n//\n//**********************************************************\n\
    void i2c_init()\n{\nTRISC3=1;      // set SCL and SDA pins as inputs\nTRISC4=1;\n\
    SSPCON = 0x38;  // set I2C master mode\nSSPCON2 = 0x00;\n// Formula for SSPADD\
    \ register value: SSPADD = [(Fosc/4)/BitRate] - 1\nSSPADD = 0x27;   // 100K at\
    \ 16Mhz clock\n                 // [(16Mhz/4)/100khz]-1 = 39 or 0x27 hex\n\nSMP=1;\
    \           // disable slew rate control for 100khz operation\nSSPIF=0;      \
    \   // clear SSPIF interrupt flag\nBCLIF=0;         // clear bus collision flag\n\
    }\n\nYou have to make sure the I2C bus is ready for transmit or receive so a function\
    \ to test the status bits is handled with the i2c_waitForIdle routine.\n\n//**********************************************************\n\
    void i2c_waitForIdle()\n{\nwhile ((SSPCON2 & 0x1F ) | RW ){}; // wait for idle\
    \ and not writing\n}\n\nAn I2C start bit is created with the i2c_start( ) function.\n\
    \n//**********************************************************\nvoid i2c_start()\n\
    {\ni2c_waitForIdle();\nSEN=1;\n}\n\nAn I2C repeat start bit is created with the\
    \ i2c_repstart( ) function.\n\n//**********************************************************\n\
    void i2c_repStart()\n{\ni2c_waitForIdle();\nRSEN=1;\n}\n"
  mdcn: "\nHI-TECH 编译器已在 stdio 库中包含了一些预建函数，如果在编译时包含 stdio.h 文件，该库会自动包含。其中之一是 printf()\
    \ 函数。这在 HI-TECH 手册中有描述，可用于所有 USART 通信，但我还希望为 SimpleC 库提供几个特定的字节控制函数。第一个是 putch()，用于将\
    \ ASCII 字符从 USART 发送出去。该函数确保发送缓冲区为空，然后用函数头参数部分中的 ASCII 字节填充它。\n\n// ****************************************\n\
    // Send ASCII Character from Hardware USART\n// ****************************************\n\
    \nvoid\nputch(unsigned char byte)\n{\n    /* output one byte */\n    while(!TXIF);\
    \ /* set when register is empty */\n    TXREG = byte;\n}\n\n第二个是接收字节的 getch()\
    \ 函数，它检查接收寄存器中的数据，然后返回函数调用接收到的字节。这些使得串行通信变得非常简单。\n\n// ****************************************\n\
    // Receive ASCII Character from Hardware USART\n// ****************************************\n\
    \nunsigned char\ngetch()\n{\n    /* retrieve one byte */\n    while(!RCIF); /*\
    \ set when register is not empty */\n    return RCREG;\n}\n\n另一种通信形式是通过串行外设接口（SPI），它通常用于与\
    \ EEPROM、温度传感器、I/O 扩展器以及许多其他外部外设芯片通信。初次使用硬件 SPI 也可能有点令人困惑，因此在库中提供这些例程很有帮助。第一个是设置函数\
    \ spi_init()。该函数控制 SSPCON 和 SSPSTAT 寄存器位，用于 250 Khz SPI 通信。这不是最快的 SPI 速度，但确实是一个可靠的\
    \ SPI 通信速度。\n\n// ****************************************\n// Hardware SPI Setup\n\
    // ****************************************\n\n/* SPI Peripheral Setup */\nvoid\
    \ spi_init(void)\n{\n// *** 16F886 Settings ***\nTRISC5 = 0; // SDO pin set to\
    \ output\nTRISC3 = 0; // SCK pin set to output (Master Mode)\nTRISA5 = 0; // CS\
    \ pin set to output\n\n/* SSPCON Settings */\n// *** FOSC = 4Mhz ***\n// SSPCON\
    \ = 0b00000001; // SPI Clock Frequency set to FOSC/16 = 250khz\n\n// *** FOSC\
    \ = 16Mhz ***\nSSPCON = 0b00000010; // SPI Clock Frequency set to FOSC/64 = 250khz\n\
    CKP = 0; // Idle state of clock is low\n\n/* SSPSTAT Settings */\nSMP = 1; //\
    \ Sampled at end of data pulse\nCKE = 1; // Data Transfered on rising edge of\
    \ clock\n\n/* SPI Peripheral on */\nSSPEN = 1; // Enable SPI peripheral\npause(1);\
    \ // Allow SPI to Stabilize\n}\n\nSPI 外设会通过 SDO 引脚（主出从入）发送一位，同时在 SDI 引脚（主入从出）时钟输入数据。因此一个函数可以处理所有操作。SPI_OUTPUT()\
    \ 就是该函数，它首先将函数参数部分定义的字节存储在内部 SPI 缓冲寄存器中。然后 SPI 硬件会自动发送该字节，并在接收缓冲区中接收一个字节。该函数将接收到的字节返回给调用它的例程。\n\
    \n// ****************************************\n// Hardware SPI Output\n// ****************************************\n\
    \nchar SPI_OUTPUT ( char spi_byte )\n{\nSSPBUF = spi_byte;\ndo {\n}\nwhile(!IBF);\n\
    return SSPBUF;\n}\n\n如我所说，SPI 通常用于与外部 EEPROM 芯片通信。WR_BYTE() 函数是为了与基于 SPI 的\n\n\
    // External I/O Expander Write\n// ****************************************\n\
    void WR_MCP23S08 ( char regist, char data )\n{\n    char dummy;\n    CS = 0; \
    \                    // Select MCP23S08 by pulling CS low\n    dummy = SPI_OUTPUT\
    \ ( 0x40 ); // Send Device Opcode, select Write mode\n    dummy = SPI_OUTPUT (\
    \ regist ); // Send Register Address location\n    dummy = SPI_OUTPUT ( data );\
    \ // Send Data byte\n    CS = 1;                     // Release EEPROM to allow\
    \ byte to be written\n}\n\n从 MCP23S08 读取是通过 RD_MCP23S08() 函数完成的。\n\n// ****************************************\n\
    // External I/O Expander Read\n// ****************************************\n\n\
    char RD_MCP23S08 ( char regist )\n{\n    char dummy;\n    CS = 0;            \
    \         // Set chip select low\n    dummy = SPI_OUTPUT (0x41); // Send Device\
    \ Opcode, select Read mode\n    dummy = SPI_OUTPUT (regist); // Send Address\n\
    \    char data = SPI_OUTPUT ( 0x00 ); // Receive data byte\n    CS = 1;      \
    \               // Bring chip select high to terminate\n    return data;\n}\n\n\
    *特别说明：请注意，我对特殊的 SPI 函数使用了全大写字母。我这样做是为了将特定部件的函数与通用库函数区分开来。使用这些函数时，请确保使用大写字母。*\n\
    \n我在之前的书籍中收到的最受欢迎的请求之一是更简单地控制硬件 PWM 端口的方式。PIC16F886 有两个，因此我创建了两个 PWM 函数；pwmout1\
    \ () 和 pwmout2 ()。函数的参数定义占空比和频率。由于 PIC16F886 上的两个 PWM 必须使用相同的时钟源，因此它们必须具有相同的频率。所有寄存器设置都在函数中处理，因此您无需调用\
    \ pwm_init 函数。不过一旦打开，PWM 会持续运行。如果您想关闭它们，请将 CCP1CON = 0 以关闭 PWM 1，将 CCP2CON = 0\
    \ 以关闭 PWM 2。\n\n// ****************************************\nchar adcin (char\
    \ chan)\n{\nswitch(chan)\n{\ncase 0:\n    TRISA0 = 1;            // Make RA0/AN0\
    \ an Input\n    ANS0 = 1;              // Configure RA0 to Analog to Digital input\n\
    \    ADCON0 = 0b11000000;   // Configure A/D to use AN0, left justified\n    break;\n\
    \ncase 1:\n    TRISA1 = 1;            // Make RA1/AN1 an Input\n    ANS1 = 1;\
    \              // Configure RA1 to Analog to Digital input\n    ADCON0 = 0b11000100;\
    \   // Configure A/D to use AN1, left justified\n    break;\n\ncase 2:\n    TRISA2\
    \ = 1;            // Make RA2/AN2 an Input\n    ANS2 = 1;              // Configure\
    \ RA2 to Analog to Digital input\n    ADCON0 = 0b11001000;   // Configure A/D\
    \ to use AN2, left justified\n    break;\n\ncase 3:\n    TRISA3 = 1;         \
    \   // Make RA3/AN3 an Input\n    ANS3 = 1;              // Configure RA3 to Analog\
    \ to Digital input\n    ADCON0 = 0b11001100;   // Configure A/D to use AN3, left\
    \ justified\n    break;\n\ncase 4:\n    TRISA5 = 1;            // Make RA5/AN4\
    \ an Input\n    ANS4 = 1;              // Configure RA5 to Analog to Digital input\n\
    \    ADCON0 = 0b11010000;   // Configure A/D to use AN4, left justified\n    break;\n\
    \ndefault:\n    break;\n}\n\nADON = 1;                // A/D Converter on;\nGODONE\
    \ = 1;              // Start A/D conversion on AN0\npause(1);               //\
    \ Sample Time\nwhile(GODONE == 1);      // Wait for conversion to complete\nchar\
    \ value = ADRESH;\nreturn value;\n}\n\n在第一章中，我展示了如何使用 I2C 外设。这些函数现在是 SimpleC 库的一部分。第一个是\
    \ i2c_init ().\n// ****************************************\n// Hardware I2C single\
    \ master routines for PIC16F886\n// for HI-TECH PIC C COMPILER.\n//\n// i2c_init\
    \ - initialize I2C functions\n// i2c_start - issue Start condition\n// i2c_repStart-\
    \ issue Repeated Start condition\n// i2c_stop - issue Stop condition\n// i2c_read(x)\
    \ - receive unsigned char - x=0,\n// don't acknowledge - x=1, acknowledge\n//\
    \ i2c_write - write unsigned char - returns ACK\n//\n//**********************************************************\n\
    void i2c_init()\n{\nTRISC3=1;      // set SCL and SDA pins as inputs\nTRISC4=1;\n\
    SSPCON = 0x38;  // set I2C master mode\nSSPCON2 = 0x00;\n// Formula for SSPADD\
    \ register value: SSPADD = [(Fosc/4)/BitRate] - 1\nSSPADD = 0x27;   // 100K at\
    \ 16Mhz clock\n                 // [(16Mhz/4)/100khz]-1 = 39 or 0x27 hex\n\nSMP=1;\
    \           // disable slew rate control for 100khz operation\nSSPIF=0;      \
    \   // clear SSPIF interrupt flag\nBCLIF=0;         // clear bus collision flag\n\
    }\n\n您必须确保 I2C 总线已准备好进行发送或接收，因此使用 i2c_waitForIdle 例程来处理测试状态位的函数。\n\n//**********************************************************\n\
    void i2c_waitForIdle()\n{\nwhile ((SSPCON2 & 0x1F ) | RW ){}; // wait for idle\
    \ and not writing\n}\n\nI2C 起始位由 i2c_start( ) 函数创建。\n\n//**********************************************************\n\
    void i2c_start()\n{\ni2c_waitForIdle();\nSEN=1;\n}\n\nI2C 重复起始位由 i2c_repstart(\
    \ ) 函数创建。\n\n//**********************************************************\nvoid\
    \ i2c_repStart()\n{\ni2c_waitForIdle();\nRSEN=1;\n}\n"
