    \ 8-4B uses the CHIPINO module. In this case I only show the CHIPINO Mini version\
    \ of the breadboard setup. Power to the rails is supplied through the CHIPINO\
    \ Mini module, which gets its power from the PICkit 2 programmer (not shown in\
    \ picture). The upper power rail has ground on the outer space while 5v is on\
    \ the inner rail. The lower power rail is the opposite. The two positive rails\
    \ are connected together at the right side of the breadboard. The 10k resistor\
