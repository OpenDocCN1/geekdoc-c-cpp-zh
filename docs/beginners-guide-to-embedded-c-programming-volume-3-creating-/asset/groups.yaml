  - "[PAGE 77]\n\nThe microsecond version is similar to the millisecond version but\
    \ has a minimum of 10 usec. This is because the code isn't fast enough to handle\
    \ delays less than that.\n\n```\n/****************************************************\n\
    \ * usecbase - 10 usec pause routine\n * The internal oscillator is set to 16\
    \ Mhz and the\n * internal instruction clock is 1/4 of the oscillator.\n * This\
    \ makes the internal instruction clock 4 Mhz or\n * 0.25 usec per clock pulse.\n\
    \ * Using the 1:1 prescaler on the clock input to Timer0\n * slows the Timer0\
    \ count increment to 1 count/.25 usec.\n * Therefore 40 counts of the Timer0 would\
    \ make a ten\n * usec delay (25 * .25 usec). But there are other\n * instructions\
    \ in the loop so using the MPLAB\n * stopwatch we find that we need Timer0 to\
    \ overflow at\n * 9 clock ticks. Preset Timer0 to 247 (F7 hex) to make\n * Timer0\
    \ overflow at 9 clock ticks (256-9 = 247).\n * This results in a 10.0 microsecond\
    \ delay.\n ****************************************************/\n\nvoid usecbase(void)\n\
    {\n        OPTION = 0b00010000;       //Set prescaler to TMR0 1:1\n        TMR0\
    \ = 0xF7;               //Preset TMR0 to overflow on 250 counts\n        while(!T0IF);\
    \              //Stay until TMR0 overflow flag equals 1\n        T0IF = 0;   \
    \               //Clear the TMR0 overflow flag\n}\n```\n\n```\n//****************************************************\n\
    //pauseus - millisecond delay routine 1 to 65,535 in 10 usec steps\n//****************************************************\n\
    \nvoid pauseus ( unsigned int usvalue )\n{\n        unsigned int x;\n\n      \
    \  for (x=0; x<=usvalue; x++) //Loop through a delay equal to usvalue\n      \
    \  {\n                usecbase();        // in milliseconds.\n               \
    \                    //Jump to millisecond delay routine\n        }\n}\n```\n\n\
    ```\n/****************************************************\n * msecbase - 1 msec\
    \ pause routine\n * The External oscillator is set to 16 Mhz and the\n * internal\
    \ instruction clock is 1/4 of the oscillator.\n * This makes the internal instruction\
    \ clock 4 Mhz or\n * 0.25 usec per clock pulse.\n * Using the 1:16 prescaler on\
    \ the clock input to Timer0\n * slows the Timer0 count increment to 1 count/4\
    \ usec.\n * Therefore 250 counts of the Timer0 would make a one\n * millisecond\
    \ delay (250 * 4 usec). But there are other\n * instructions in the delay loop\
    \ so using the MPLAB\n * stopwatch we find that we need Timer0 to overflow at\n\
    \ * 243 clock ticks. Preset Timer0 to 0D (hex) to make\n * Timer0 overflow at\
    \ 243 clock ticks (256-13 = 243).\n ****************************************************/\n\
    ```"
