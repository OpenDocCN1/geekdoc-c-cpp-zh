    \ outputs\n```\n\n### i2c_restart()\n\nThe i2c_restart() function is used to send\
    \ a new start bit in the i2c signal. This is used at the beginning of a new i2c\
    \ communication message. This is commonly used when the first start bit is used\
    \ to send a message requesting data to be sent back. The example below shows this\
    \ function used in one of the SimpleC library functions.\n\nExample:\n\n```c\n\
    unsigned char I2C_EEIN(unsigned char address)\n{\nunsigned char data;\ni2c_start();\n\
