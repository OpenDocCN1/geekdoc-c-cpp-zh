    \nspi_output 函数将字节值存储在 SPI 外设缓冲区中，以便外设将其发送到 SPI 从设备。此函数也用于从 SPI 从机接收一个字节，因为每次\
    \ SPI 外设发送一个字节时，它也会接收一个字节。因此，此函数始终用于同时发送和接收一个字节的数据。如果只想接收，则发送一个虚拟或无意义的字节。如果只想发送，则接收到的字节不使用。\n\
