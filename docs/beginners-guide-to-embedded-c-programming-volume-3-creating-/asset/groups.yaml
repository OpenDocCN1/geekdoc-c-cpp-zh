    \ in the stdio library which is automatically included during the compile time\
    \ if the stdio.h file is included. One of those is the printf() function. This\
    \ is described in the HI-TECH manual and can be used for all USART communication\
    \ but I wanted a couple specific byte control functions for the SimpleC library\
    \ as well. The first is putch() which is used to send an ASCII character out of\
    \ the USART. The function makes sure the transmit buffer is empty and then fills\
    \ it with the ASCII byte in the parameter section of the function header.\n\n\
    ```\n// ****************************************\n// Send ASCII Character from\
    \ Hardware USART\n// ****************************************\n\nvoid\nputch(unsigned\
    \ char byte)\n{\n    /* output one byte */\n    while(!TXIF); /* set when register\
    \ is empty */\n    continue;\n    TXREG = byte;\n}\n```\n\nThe second is the receive\
    \ byte getch() function that tests for data in the receive register and then returns\
    \ the byte received from the function call. These make serial communication very\
    \ easy.\n\n```\n// ****************************************\n// Receive ASCII\
    \ Character from Hardware USART\n// ****************************************\n\
    \nunsigned char\ngetch()\n{\n    /* retrieve one byte */\n    while(!RCIF); /*\
    \ set when register is not empty */\n    continue;\n    return RCREG;\n}\n```\n\
    \nAnother form of communication is through the Serial Peripheral Interface (SPI),\
