    ![](img/910b145bee7ca8076318eafbe6d13997_21_0.png)


    Figure 2-1: I²C™ Bus Setup


    # Master and Slave


    The I²C protocol defines what a master is and what a slave is. The master has
    control of the bus. It generates the clock signal and sends the start and stop
    signals that frame the complete I²C message. The slave must listen to every message
    sent and respond if its control byte was received. The slave then responds to
    the master with data. There are systems with multiple masters but, for this book,
    I will only focus on a single master setup.


    As mentioned, the I²C bus has two lines—a data line and a clock line. If you are
    familiar with how a shift register works, then this should be easy to understand.
    The master puts a bit on the data line by pulling the line low or letting the
    external resistor pull the line high. Then, the master pulses the clock line by
    pulling it low and then releasing it high again. The circuitry at the slave receives
    that bit of data the same way a shift register clocks in a bit. This pulsing of
    data and clock lines continues until the first part of the I²C message is transmitted.
    Figure 2-2 shows the format of the data line I²C message.'
  - '[PAGE 22]


    ![](img/910b145bee7ca8076318eafbe6d13997_22_0.png)


    # Write Command Sequence


    ![](img/910b145bee7ca8076318eafbe6d13997_22_1.png)


    # Read Command Sequence


    # Figure 2-2: I²C Data Line Message Format


    The signal in Figure 2-2 shows a write and a read sequence for communicating with
    an external EEPROM device. I will use the Microchip 24LC01B EEPROM part to demonstrate
    how to store and read back data in an external EEPROM using I²C as the communication
    protocol.


    The control byte is a 7-bit wide value, with the eighth bit being either zero
    for a write or one for a read operation. As you can see, the read sequence requires
    two control bytes, while a write only requires one. This is because a read operation
    requires the master to first write the memory-address byte to the EEPROM so it
    can locate the data and then read the data from the EEPROM. During the write operation,
