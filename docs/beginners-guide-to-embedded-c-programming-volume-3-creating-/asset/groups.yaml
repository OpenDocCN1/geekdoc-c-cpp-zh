    i2c_write(0xa0);\ni2c_write(address);\ni2c_repStart();\ni2c_write(0xa1);\ndata=i2c_read(0);\n\
    i2c_stop();\nreturn(data);\n}\n```\n\n```c\nPORTB =I2C_EEIN(cnt); // Display data\
    \ read from EEPROM on LEDs in binary\npause (1000);           // Delay for 1 second\
    \ to read LEDs\ncnt=cnt + 1;            // Increment cnt variable\n}\n```\n\n\
