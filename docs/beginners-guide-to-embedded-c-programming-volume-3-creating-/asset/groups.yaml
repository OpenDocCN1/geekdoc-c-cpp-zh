    \nFigure 8-3: SPI Project 2 Schematic\n\n![](img/910b145bee7ca8076318eafbe6d13997_144_1.png)\n\
    \nFigure 8-4A: SPI Project 2 Breadboard\n\n```\nPIN 12 to NC\nPIN 13 to NC\nPIN\
