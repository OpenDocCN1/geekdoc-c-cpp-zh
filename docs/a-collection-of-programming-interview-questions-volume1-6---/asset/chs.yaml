  \nprint LA.norm(a)\nprint LA.norm(a, 1)\n```\n\n## 9. Numpy、Scipy 和 Spark 的核心数据类型是什么？\n\
  \n### Solution\n\nNumpy 为向量和矩阵的存储以及线性代数运算提供了高效支持。例如：![](img/00034.jpeg) 是两个向量的点积，而\
  \ ![](img/00035.jpeg) 和 ![](img/00036.jpeg) 分别内积和外积。\n\nScipy 为稀疏矩阵和向量提供了多种存储策略，以便在处理零元素时节省空间。特别是\
  \ COOrdinate 格式指定了坐标 ![](img/00038.jpeg) 的非零值 ![](img/00037.jpeg)，而压缩稀疏列矩阵 (CSC)\
  \ 满足关系 ![](img/00039.jpeg)。\n\n\n\n\nSpark 为本地和分布式计算提供了许多原生数据类型。主要的日志抽象是一个称为“弹性分布式数据集（RDD）”的分布式项集合。RDD\
  \ 可以从 `Hadoop InputFormats`[[7]](#part0000_split_066.html__ftn7) 创建，也可以通过转换其他 RDD\
  \ 创建。支持 Numpy 数组、Python 列表和 Scipy CSC 稀疏矩阵。此外：用于机器学习的 Spark 库——MLIB，支持 `SparseVectors`\
  \ 和 [`LabeledPoint`](http://spark.apache.org/docs/latest/api/python/pyspark.mllib.html#pyspark.mllib.regression.LabeledPoint)，即与标签/响应关联的本地向量（稠密或稀疏）。\n\
  \n### Code\n\n```python\nimport numpy as np\n\nfrom scipy.sparse import csr_matrix\n\
  \nM = csr_matrix([[4,  1,  0],  [4,  0,  3],  [0,  0,  1]])\n\nfrom pyspark.mllib.linalg\
  \ import SparseVector\n\nfrom pyspark.mllib.regression import LabeledPoint\n\nlabel\
  \ =  0.0\n\npoint = LabeledPoint(label, SparseVector(3,  [0,  2],  [1.0,  3.0]))\n\
  \ntextRDD = sc.textFile(\"README.md\")\n\nprint textRDD.count()  # count items in\
  \ RDD\n```\n\n## 10. 你能提供 Spark 中 Map 和 Reduce 的示例吗？（让我们来计算均方误差）\n\n### Solution\n\
  \nSpark 是一种强大的并行计算范式，它可以映射到多个服务器，而无需处理调度、数据分区、通信和恢复等低级操作。这些低级操作通常由之前的范式暴露给程序员。现在\
  \ Spark 代我们解决了这些问题。\n\nSpark 支持的一种简单并行计算形式是“Map and Reduce”，这种模式由 Google[[8]](#part0000_split_066.html__ftn8）推广。\n\
  \n![](img/00040.jpeg)\n\n在这个框架中，一组关键字被映射到若干工作节点（例如可用于计算的并行服务器），然后通过应用“reduce”操作符对结果进行归约（例如收集）。reduce\
  \ 操作符可以非常简单（例如求和），也可以很复杂（例如用户定义函数）。\n\n作为分布式计算的一个示例，让我们来计算均方误差（MSE），即估计值与被估计值之间差的平方平均值。在下面的示例中，我们假设\
  \ `valuesAndPreds` 是包含许多 (![](img/00041.jpeg) 元组的 RDD。这些元组被映射为值 ![](img/00042.jpeg)。并行工作节点计算的所有中间结果都通过应用求和操作符进行归约。最后，将结果除以数学定义中的元组总数![](img/00043.jpeg)。注意，Spark\
  \ 通过允许编写非常接近数学公式的分布式代码，为程序员隐藏了所有低级细节。该代码采用 python lambda 计算来实现对匿名函数的紧凑表示。\n\n###\
  \ Code\n\n```python\nMSE = valuesAndPreds.map(lambda  (v, p):  (v - p)**2).reduce(lambda\
  \ x, y: x + y)  / valuesAndPreds.count()\n```\n\n然而，Spark 还可以从骨架计算（skeletons computations）20\
  \ 年的工作，以及最近的 Microsoft Cosmos 中获得灵感，支持额外的并行计算形式[[9]](#part0000_split_066.html__ftn9)。\n\
  \n## 11. 你能提供 Spark 中其他计算的示例吗？\n\n### Solution\n\n第一个代码片段是 map reduction 的示例，我们想要找到文本中单词最多的行。首先，每行被映射为其包含的单词数。然后对这些数字进行归约并取最大值。非常简单：一行代码在这里完成了在\
  \ Hadoop 等其他并行范式中需要数百行代码的任务。\n\nSpark 支持两种操作：转换（transformations），它们从现有数据集创建新的 RDD\
  \ 数据集；以及动作（actions），它们在数据集上运行计算后向驱动程序返回值。Spark 中的所有转换都是惰性的，因为计算会被尽可能地推迟，直到程序真正需要结果为止。这使得\
  \ Spark 能够高效运行——例如，编译器可以意识到通过 `map` 创建的 RDD 将在 `reduce` 中使用，并只向驱动程序返回 `reduce` 的结果，而不是更大的映射数据集。中间结果可以被持久化和缓存。\n\
  \n基本转换包括（以下列表不完整。请在网上查看完整列表[[10]](#part0000_split_066.html__ftn10)）：\n\n| Transformation\
  \ | 用途 |\n| :--- | :--- |\n| `map(func)` | 返回一个新的分布式数据集，通过将源的每个元素通过函数 `func` 形成。\
  \ |\n| `filter(func)` | 返回一个新的数据集，通过选择源中那些 `func` 返回 true 的元素形成。 |\n| `flatMap(func)`\
  \ | 与 map 类似，但每个输入项可以映射到 0 个或多个输出项（因此 `func` 应该返回 `Seq` 而不是单个项）。 |\n| `sample(withReplacement,\
  \ fraction, seed)` | 使用给定的随机数生成器种子，对部分数据进行放回或不放回采样。 |\n| `union(otherDataset)` |\
  \ 返回一个包含源中元素并集的新数据集。 |\n| `intersection(otherDataset)` | 返回一个包含源元素交集的新数据集。 |\n|\
  \ `distinct()` | 返回一个包含源去重元素的新数据集。 |\n| `groupBy()` | 当在 (K, V) 元组上调用时，返回一个 (K,\
  \ Iterable<V>) 元组的数据集。 |\n| `reduceByKey(func)` | 当在 (K, V) 元组上调用时，使用聚合函数 `func`（类型为\
  \ (V,V) => V）对每个键的值进行归约。 |\n| `sortByKey(ascending)` | 当在 (K, V) 元组上调用时，如果 K 实现了\
  \ Ordered，则按 `ascending` 参数指定的升序或降序对键排序，返回一个数据集。 |\n| `join(otherDataset)` | 当在\
  \ (K, V) 和 (K, W) 数据集上调用时，返回一个包含每个键的所有对 (K, (V, W)) 的数据集。外连接通过 `leftOuterJoin`、`rightOuterJoin`\
  \ 和 `fullOuterJoin` 支持。 |\n\n基本动作包括（以下列表不完整。请在网上查看完整列表）：\n\n| Actions | 用途 |\n|\
  \ :--- | :--- |\n| `reduce(func)` | 使用函数 `func`（接受两个参数并返回一个）聚合数据集的元素。该函数应该是交换和结合的，以便能够并行计算。\
  \ |\n| `collect()` | 将数据集的所有元素作为数组返回给驱动程序。这通常在过滤或其他返回足够小子集的操作后有用。 |\n| `count()`\
  \ | 返回数据集中的元素数量。 |\n| `take(n)` | 返回数据集的前 `n` 个元素的数组。 |\n| `takeSample(withReplacement,num,\
  \ [seed])` | 返回数据集的 `num` 个随机采样数组，可以放回或不放回，可选预指定随机数生成器种子。 |\n| `countByKey()` |\
  \ 仅适用于 (K, V) RDD。返回一个包含每个键计数的 (K, Int) 哈希映射。 |\n| `foreach(func)` | 在数据集的每个元素上运行函数\
  \ `func`。这通常用于副作用，例如更新 `Accumulator` 或与外部存储系统交互。 |\n\n\n\n\n第二个代码段是另一个 map reduce\
  \ 操作，将文本转换为单词的 flatmap。然后，我们将每个单词映射为数字 1，因为我们将每次出现计为元对 (words, 1)。然后，通过 `reduceByKey()`\
  \ 操作可以聚合每个单词并累加出现次数。同样非常简单：在 Spark 中使用函数式编程风格的一行代码。第三段代码引入了累加器和广播变量。\n\n### Code\n\
  \n```python\n# map reduce\ntextFile.map(lambda line: len(line.split())).reduce(lambda\
  \ a, b: a if (a > b) else b)\n\n# word count\nwordCounts = textFile.flatMap(lambda\
  \ line: line.split()).map(lambda word: (word, 1)).reduceByKey(lambda a, b: a+b)\n\
  \n# broadcast\nbroadcastVar = sc.broadcast([1, 2, 3])\n\n# accumulators\naccum =\
  \ sc.accumulator(0)\n\nsc.parallelize([1, 2, 3, 4]).foreach(lambda x: accum.add(x))\n\
  ```\n\n## 12. Python 如何与 Spark 交互\n\n### Solution\nSpark 有一个专门为 Python 设计的 API，称为\
  \ PySpark，它提供了对 Spark 编程框架的访问。Spark 内部使用 Scala 开发，Scala 是一种函数式编程语言，与 JVM（Java 虚拟机）集成良好。一个重要的观察是，Python\
  \ 是动态类型的，因此 RDD 可以包含多种类型的对象。另一个观察是 PySpark API 反映了 Scala API，但后者通常接收 Python 函数并返回\
  \ Python 集合。此外，它支持 lambda 函数且使用得非常频繁。\n\n用于转换的函数连同序列化数据和类实例一起发送到工作节点进行代码执行。Python\
  \ 还支持一个交互式 shell `/bin/pyspark`，用于在命令行中执行数据科学任务。\n\n需要指出的是，Spark 编译器将计算分配在底层服务器网络上，程序员不需要显式地处理底层细节，除非有明确需求。\n\
  \n## 13. Spark 对机器学习的支持情况如何？\n\n### Solution\nSpark 有一个名为 MLIB 的强大库，用于机器学习。Mlib\
  \ 支持基本统计计算以及特征的提取、选择和转换。它还支持使用线性模型、朴素贝叶斯、决策树和集成学习进行分类和回归。此外，Mlib 还实现了协同过滤、k-means、高斯、LDA、关联规则挖掘和降维。许多优化问题通过分布式随机梯度下降得到解决。我们将在本卷和下一卷中讨论所有这些技术。\n\
  \n## 14. Spark 在并行环境中是如何工作的\n\n### Solution\nSpark 采用了一种简单的并行计算模型。驱动程序通过使用 `SparkContext`\
  \ 环境变量与工作节点交互。这种交互对用户是透明的。每个工作节点执行分配的任务，并可以在本地缓存计算结果以供未来复用。计算结果会被发送回驱动程序。\n\n![Spark\
  \ 集群组件](img/00044.jpeg)\n\n### Code\n```python\nconf = SparkConf().setAppName(appName).setMaster(master)\n\
  sc = SparkContext(conf=conf)\n```\n\n## 15. 均值、方差和协方差是什么？\n\n### Solution\n在算术术中，均值（或数学期望）是离散数字集合的中心值，即所谓的随机变量，其值受随机机会的影响。均值的定义为所有值之和除以值的个数：\n\
  \n方差衡量了一组数字的离散程度。方差为零表示所有值都相等；小方差表示数据点倾向于非常接近均值，因此彼此接近；而高方差则表示数据点更加分散。方差总是正的。给定一个随机变量，方差定义为\n\
  \n协方差是衡量两个随机变量共同变化程度的指标。数学公式如下：\n\n### Code\n```python\nimport numpy as np\n\nx\
  \ = np.array([[0, 2], [1, 1], [2, 0]]).T\nprint np.mean(x[1,])\nprint np.var(x[1,])\n\
  print np.cov(x)\n\n1.0\n0.666666666667\n[[ 1. -1.]\n[-1.  1.]]\n```\n\n## 16. 百位数和四位数是什么？\n\
  \n### Solution\n百分位数是一个指示值的指标，给定百分比的观测值低于此。例如：第 50 百位数是观测向量的中位数；第 25 百位数是第一四位数，第\
  \ 50 百位数是第二四位数，第 75 百位数是第三四位数。在考虑提供服务的时间时，通常报告第 90、第 95 和第 99 百位数。相比数学平均值，百分位数对所谓“离群值”的影响更具鲁棒性，例如那些被大多数观测值显著分散的数据点。\n\
  \n### Code\n```python\nimport numpy as np\n\nx = np.array([0, 1, 4, 5, 6, 8, 8,\
  \ 9, 11, 10, 19, 19.2, 19.7, 3])\nfor i in [75, 90, 95]:\n    print np.percentile(x,\
  \ i)\n```\n\n# 17. 你能将 XML 文件转换为 Pandas 吗？\n\n### Solution\n这是一个关于转换的问题。XML 通常用于表示信息。例如，这可以是一个表示数据的\
  \ XML 片段：\n```xml\n<?xml version=\"1.0\"?>\n<catalog>\n <book id=\"bk01\">\n <author>Gambardella,\
  \ Matthew</author>\n <title>Developer's Guide</title>\n <genre>Computer</genre>\n\
  \ <price>4.95</price>\n <publish_date>2000-10-01</publish_date>\n <description>In-depth\
  \ look at creating applications.</description>\n </book>\n...\n</catalog>\n```\n\
  Pandas 是用于数据分析的强大 Python 库。Pandas 的核心结构是 `DataFrame`，它是一个带有标签的二维可变异构表格结构。每一行被称为\
  \ `Series`。Pandas 提供了丰富的 DataFrame 操作 API。在此代码中使用方便 `objectify` 模块读取 XML 文件，并相应创建\
  \ Pandas 结构。\n\n### Code\n```python\nfrom lxml import objectify\nimport pandas as\
  \ pd\n\n# 打开并解析\nxml = objectify.parse(open('book.xml'))\nroot = xml.getroot()\n\
  # pandas 和 dataframes\ndf = pd.DataFrame(columns=('Author', 'Title', 'Genre'))\n\
  for i in range(0, 10):\n    row = dict(zip(['Author', 'Title', 'Genre'], [root.book[i].author,\
  \ root.book[i].title, root.book[i].genre]))\n    rowSeries = pd.Series(row)\n  \
  \  rowSeries.name = i\n    df = df.append(rowSeries)\n\nprint df\n```\n\n## 18.\
