  \n# 4 埃尔什数\n\n保罗·埃尔什（Paul Erdős）是一位著名的数学家，他写过 1500 多篇科学论文。他的直接合作者与他的距离为 1，而他们各自的合作者距离为\
  \ 2。递归地，任何与距离埃尔什为 ![](img/00031.jpeg) 的作者有合作的人，其距离将是 ![](img/00032.jpeg)（也记为 Erdős\
  \ (作者)=K）。本书作者的埃尔什数（“Antonio Gulli”）=3，因为他与“Fabrizio Sebastiani”共同过过论文，而后者又与“Micheal\
  \ Anthony Steel”写过过论文，而后者是埃尔什的直接合作者。埃尔什数可以通过 BFS 访问的略微变体计算，此实现被留作了一个练习题。\n\n# 5\
  \ 实现 DFS 访问\n\n深度优先搜索（DFS）是图的一种访问策略，其中访问从一个选定的根节点开始，并沿着每个分支尽可能深地探索，直到回溯到第一个尚未访问的子节点。\n\
  \n## 解决方案\n\n这是另一道经典的面试题，可以使用递归或迭代解决。\n\n`dfs` 方法实现了一个递归方案，它从根节点 `sid` 开始，并维护一个记录已访问节点及其颜色的布尔向量。对于每个节点，初始颜色为‘w’（白色），当节点被访问时颜色变为‘g’（灰色），当所有相邻节点都被已访问时，颜色变为‘b’（黑色）。此外，节点访问时的时间存储在向量\
  \ `timing` 中。\n\n`dfsStack` 方法实现了一个迭代方案，其中将根节点插入栈中。然后弹出栈顶，并将所有尚未访问的相邻节点放入栈中。重复此过程，直到栈为空。\n\
  \n## 代码\n\n```cpp\nvoid dfsUtilRich(const Graph & g, Graph::NodeID sid,\n      \
  \        std::vector<bool> & visited,\n              std::vector<Graph::NodeID>\
  \ & colour,\n              std::vector<Graph::NodeID> & timing,\n              unsigned\
  \ int & time)\n{\nstd::cout << \"Starting dfsUtilRich on \" << sid << std::endl;\n\
  visited[sid] = true;\ncolour[sid] = 'g'; // gray\n              ++time;\ntiming[sid]\
  \ = time;\n for (const auto & e : g.edges(sid))\n if (!visited[e.v])\n    dfsUtilRich(g,\
  \ e.v, visited, colour, timing, time);\ncolour[sid] = 'b'; //black\n           \
  \   ++time;\n}\n\nvoid dfs(const Graph & g, Graph::NodeID sid)\n{\n if (sid >= g.numNodes())\
  \ // 对未知节点进行 dfs\n return;\n unsigned int time = 0;\n              std::vector<bool>\
  \ visited(g.numNodes(), false); // white\n              std::vector<Graph::NodeID>\
  \ colour(g.numNodes(), 'w');\n              std::vector<Graph::NodeID> timing(g.numNodes(),\
  \ 0);\n              visited[sid] = true;\nstd::cout << \"Starting dfs on \" <<\
  \ sid << std::endl;\n for (const auto & e : g.edges(sid))\n          {\n if (!visited[e.v])\n\
  \                    {\nvisited[e.v] = true;\n                      dfsUtilRich(g,\
  \ e.v, visited, colour, timing, time);\n                }\n          }\nstd::cout\
  \ << \"End dfs\" << std::endl;\n}\n\nvoid dfsStack(const Graph & g, Graph::NodeID\
  \ sid)\n{\n if (sid >= g.numNodes()) // 对未知节点进行 dfs\n return;\n              std::stack<Graph::NodeID>\
  \ nodesVisited;\n              std::vector<bool> visited(g.numNodes(), false);\n\
  \              visited[sid] = true;\n              nodesVisited.push(sid);\nstd::cout\
  \ << \"Starting dfs on \" << sid << std::endl;\nwhile (!nodesVisited.empty())\n\
  {\n const Graph::NodeID nid = nodesVisited.top();\nbool myFullExploredNode = true;\n\
  \ for (const auto & e : g.edges(nid))\n{\n if (!visited[e.v])\n{\nvisited[e.v] =\
  \ true;\n              nodesVisited.push(e.v);\nstd::cout << \"Visited: \" << e.v\
  \ << std::endl;\nmyFullExploredNode = false;\nbreak;\n}\n}\n}\n if (myFullExploredNode)\n\
  \              nodesVisited.pop();\n}\nstd::cout << \"End dfs\" << std::endl;\n\
  }\n```\n\n## 复杂度\n\n栈的空间复杂度为 ![](img/00033.jpeg)，如果使用邻接表表示图，则为 ![](img/00034.jpeg)；如果采用邻接矩阵，则为\
  \ ![](img/00035.jpeg)。时间复杂度为 ![](img/00036.jpeg)，其中 ![](img/00037.jpeg) 可能在 ![](img/00038.jpeg)\
  \ 到 ![](img/00039.jpeg) 之间变化。\n\n# 6 如何在图中检测环\n\n## 解决方案\n\n如果在访问过程中存在回边，则 DFS 可以检测环。\n\
