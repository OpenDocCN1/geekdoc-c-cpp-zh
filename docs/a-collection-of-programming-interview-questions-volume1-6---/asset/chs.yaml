  \ (注：此处由于原文存在重复，已合并处理)\n\n# 26. 使用 gamma 编码对整数进行变长编码\n\n## Solution\n\n\n\nGamma\
  \ 编码（Gamma encoding）是另一种整数的变长编码[[3]](#part0000.html__ftn3)。数字 ![](img/00025.jpeg)\
  \ 用 ![](img/00063.jpeg) 位表示。该整数分为两部分：前半部分是不小于 `x` 的最大 2 的幂（例如 ![](img/00064.jpeg)），它用一进制表示，前面有\
  \ `log(x)` 个 0，后面跟一个 1。后半部分是剩余的二进制位，表示 ![](img/00065.jpeg)。\n\n## Code\n\n```cpp\n\
  void gammaEncoding(unsigned int x)\n{\n    int i;\n    unsigned lenOfX = 0;\n  \
  \  for (i = x; i > 1; i >>= 1) // floor(log2(x))\n        lenOfX++;\n    for (i\
  \ = lenOfX; i > 0; --i)\n        std::cout << '0';\n    std::cout << '1';\n    x\
  \ -= (1 << lenOfX); // reminder\n    for (i = 1 << (lenOfX - 1); i > 0; i >>= 1)\n\
  \        if (x & i)\n            std::cout << 1;\n        else\n            std::cout\
  \ << 0;\n}\n```\n\n# 27. 使用增量编码用变长表示整数\n\n## Solution\n\n增量编码（Delta encoding）是另一种整数的变长编码[[4]](#part0000.html__ftn4)。数字\
  \ ![](img/00025.jpeg) 用 ![](img/00066.jpeg) 位表示。该整数分为两部分：前者是不小于 `x` 的最大 2 的幂（例如\
  \ ![](img/00065.jpeg)。\n\n## Code\n\n```cpp\nvoid deltaEncoding(unsigned int x)\n\
  {\n    int len = 0, lengthOfLen = 0, i;\n    for (int i = x; i > 0; i >>= 1) //\
  \ 1+floor(log2(num))\n        len++;\n    for (int i = len; i > 1; i >>= 1) // floor(log2(len))\n\
  \        lengthOfLen++;\n    for (int i = lengthOfLen; i > 0; --i)\n        std::cout\
  \ << 0;\n    for (int i = lengthOfLen; i >= 0; --i)\n        std::cout << ((len\
  \ >> i) & 1);\n    for (int i = len - 2; i >= 0; i--)\n        std::cout << ((x\
  \ >> i) & 1);\n}\n```\n\n# 28. 不使用除法计算平均值\n\n## Solution\n\n这个问题解决了 2006 年报告的一个\
  \ Bug，该 Bug 是在第一个二分查找算法发布 60 多年后提出的[[5]](#part0000.html__ftn5)。二分查找的实现方式如下：\n\n\
  ```cpp\nint binSearch(int a[], unsigned int size, int key) {\n    int low = 0;\n\
  \    int high = size;\n    while (low <= high) {\n        int mid = (low + high)\
  \ / 2;\n        int midVal = a[mid];\n        if (midVal < key)\n            low\
  \ = mid + 1;\n        else if (midVal > key)\n            high = mid - 1;\n    \
  \    else\n            return mid; // key found\n    }\n    return -(low + 1); //\
  \ key not found.\n}\n```\n\nBug 出现在 `int ![](img/00068.jpeg)` 这一行，因为如果 ![](img/00071.jpeg)，和就会溢出为负值。在\
