  \ 0 和 1 组成的矩阵，找到全为 1 的最大子矩阵\n\n## 解决方案\n动态规划解决方案可以定义如下。令 ![](img/0106.jpeg) 为大小为\
  \ ![](img/0272.jpeg) 的 0 和 1 矩阵，并考虑另一个相同相同的 ![](img/0156.jpeg)。如果 ![](img/0273.jpeg)，它可以贡献于位置\
  \ ![](img/0274.jpeg)[j]，或 ![](img/0275.jpeg)，或 ![](img/0276.jpeg)]，可以表示为 ![](img/0277.jpeg)。如果\
  \ ![](img/0278.jpeg)则是 ![](img/0279.jpeg)。这里是代码\n\n## 代码\n```cpp\nvoid FindMaxSquare(const\
  \ Matrix<bool> & m, int &maxI, int &maxJ, int &size)\n{\n  Matrix<int> s(m.dim1(),\
  \ m.dim2());\n  for (unsigned i = 0; i < m.dim1(); i++)\n    s(i, 0) = m(i, 0);\n\
  \  for (unsigned j = 0; j < m.dim2(); j++)\n    s(0, j) = m(0, j);\n  for (unsigned\
  \ int i = 1; i < m.dim1(); i++)\n    for (unsigned int j = 1; j < m.dim2(); j++)\n\
  \      {\n        if (m(i, j))\n          s(i, j) = std::min(std::min(s(i, j - 1),\
  \ s(i - 1, j)), s(i - 1, j - 1)) + 1;\n        else\n          s(i, j) = 0;\n  \
  \    }\n  size = s(0, 0); maxI = 0; maxJ = 0;\n  for (unsigned int i = 0; i < m.dim1();\
  \ i++)\n    for (unsigned int j = 0; j < m.dim2(); j++)\n      if (size < s(i, j))\n\
  \      {\n        size = s(i, j);\n        maxI = i;\n        maxJ = j;\n      }\n\
  }\n```\n\n# 27. 矩阵括号值法 – 给一组 m 个矩阵，找到乘法它们的最有效方法\n\n解决方案\n\n\n\n\n\n矩阵乘法具有结合律，因此有多种执行乘法的方法，导致在标量上执行的操作次数（加法和乘法）是不同的。假设矩阵\
  \ ![](img/00281.jpeg) 的维度包含在位置 ![](img/00282.jpeg) 中，对于向量![](img/00283.jpeg) 我们可以我们可以通过扫描向量并递归地找到解决方案。\n\
  \n## 代码\n\n```cpp\nunsigned int MatrixOrder(const std::vector<unsigned int>&p, int\
  \ i, int j)\n{\n  if (i == j)\n    return 0;\n  unsigned int min = std::numeric_limits<unsigned\
  \ int>::max();\n  unsigned int res;\n  for (int k = i; k < j; ++k)\n  {\n    res\
  \ = MatrixOrder(p, i, k) + MatrixOrder(p, k + 1, j) + p[i - 1] * p[k] * p[j];\n\
  \    if (res < min)\n      min = res;\n  }\n  return min;\n}\n\nunsigned int MatrixChainOrder(const\
  \ std::vector<unsigned int> & p)\n{\n  unsigned int n = p.size();\n  Matrix<unsigned\
  \ int> m(n, n);\n  for (unsigned int i = 0; i < n; ++i)\n    m(i, i) = 0;\n  unsigned\
  \ int j, cost;\n  // len = 2, 1 <= i < n - 1 ; j = i + 1\n  // len = 3, 1 <= i <\
  \ n - 2; j = i + 2\n  // len = n-2, i=1, i = 2 , j = i + n - 3\n  // len = n-1,\
  \ i=1      j = n - 1\n  for (unsigned int len = 2; len < n; ++len)\n    for (unsigned\
  \ i = 1; i < n - len + 1; ++i)\n    {\n      j = i + len - 1;\n      m(i, j) = std::numeric_limits<unsigned\
  \ int>::max();\n      for (unsigned int k = i; k <= j - 1; ++k)\n      {\n     \
  \   cost = m(i, k) + m(k + 1, j) + p[i - 1] * p[k] * p[j];\n        if (cost < m(i,\
  \ j)) {\n          m(i, j) = cost;\n        }\n      }\n    }\n  return m(1, n -\
  \ 1);\n}\n```\n\n## 复杂度\n复杂度为 ![](img/0076.jpeg) 和 ![](img/0083.jpeg)，那么可以在线性时间内计算出使矩形最大的顶行和底行。\n\
  \n## 代码\n\n```cpp\nvoid findMaxSum(const Matrix<int> & M)\n{\n  unsigned int rows\
  \ = M.dim1();\n  unsigned int columns = M.dim2();\n  unsigned int finalLeft, finalRight,\
  \ finalUp, finalDown;\n  int sum, start, maxSum = std::numeric_limits<int>::min();\n\
  \  for (unsigned int left = 0; left < columns; ++left)\n  {\n    std::vector<int>\
  \ temp(rows, 0);\n    for (unsigned int right = left; right < columns; ++right)\n\
  \    {\n      for (unsigned int i = 0; i < rows; ++i)\n        temp[i] += M(i, right);\n\
  \      sum = kadane(temp, start, stop);\n      if (sum > maxSum) {\n        maxSum\
  \ = sum;\n        finalLeft = left; finalRight = right;\n        finalUp = start;\
  \ finalDown = stop;\n      }\n    }\n  }\n  std::cout << \"maxSum=\" << maxSum <<\
  \ \" (Top, Left) (\" << finalUp << \",\" << finalLeft << \") (Bottom, Right) (\"\
  \ << finalDown << \",\" << finalRight << \")\" << std::endl;\n}\n```\n\n## 复杂度\n\
