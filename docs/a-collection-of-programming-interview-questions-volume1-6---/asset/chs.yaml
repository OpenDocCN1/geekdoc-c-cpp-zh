  \ ![](img/0269.jpeg)，如果 ![](img/0270.jpeg)，可以检测到负环。\n\n## 代码\n```cpp\nvoid BellmanFord(const\
  \ Graph & g, int src)\n{\n  std::vector<int> dist(g.numNodes(), std::numeric_limits<int>::max());\n\
  \  std::vector<int> predecessor(g.numNodes(), -1);\n  dist[src] = 0;\n  for (nodeID\
  \ u = 0; u < g.numNodes(); u++)\n    for (auto const & e : g.edges(u))\n      if\
  \ (dist[u] + e.w < dist[e.v])\n      {\n          dist[e.v] = dist[u] + e.w;\n \
