  \ 调度\n- 解决方案\n- 复杂度\n\n## 1 实现一个有图\n\n图数据结构 ![](img/00001.jpeg) 包含有限的节点或顶点集合 ![](img/00002.jpeg)\
  \ 和一组有序对 ![](img/00003.jpeg)，称为边或弧，用于连接两个节点。图可以拥有与节点和/或边相关的标签，从而表示不同的属性（如名称、权重、容量、长度、颜色）。有图是指边具有方向图，通常用箭头表示。\n\
  \n![](img/00004.jpeg)[](2/images/00005.jpeg)\n\n![](img/00006.jpeg) ![](img/00007.jpeg)\n\
  \n## 解决方案\n\n第一种图的实现将节点和边表示为 C++ `struct`。此外，内存中存储了节点集合 ![](img/00008.jpeg)，并且每个节点的所有边都存储存储了\
  \ ![](img/00009.jpeg)。这种表示方法被称为邻接表。在这个特定的实现中，每个节点都有一个唯一的 `NodeID`、一个 `NodeWeight`\
  \ 以及另一个表示节点的标签。事实上，每条边都存储了目标 `NodeID`、表示边权重的 `EdgeWeight` 以及另一个表示边的标签。\n\n第二种图的实现使用大小为\
  \ ![](img/0010.jpeg) 的矩阵来表示 `Graph`，其中 `n` 是节点的数量。这种表示方法被称为邻接矩阵。\n\n## 代码\n\n```cpp\n\
  // Direct Graph\n// with Adjacent lists\nclass Graph\n{\npublic:\n    typedef unsigned\
  \ int NodeID;\n    typedef unsigned int EdgeID;\n    typedef int NodeWeight;\n \
  \   typedef int EdgeWeight;\n    std::string empty;\n\n    struct Edge {\n     \
  \   Edge(NodeID nid, EdgeWeight wt, const std::string & lb) : v(nid), w(lb) {};\n\
  \        NodeID v;\n        EdgeWeight w;\n        std::string label;\n    };\n\
  \    struct Node {\n        Node(NodeWeight wt, const std::string & l) : w(wt),\
  \ label(l){\n        NodeWeight w;\n        std::string label;\n    };\n    // all\
  \ nodes\n    typedef std::vector<Node> Nodes; // edges from a node\n    typedef\
  \ std::forward_list<Edge> EdgesList; // all edges (id -> edgeList)\n    typedef\
  \ std::vector<EdgesList> Edges; // allocate |V| lists of edges\n\n    Graph(NodeID\
  \ V = 0, EdgeID E = 0) {\n        if (V) {\n            _nodes.reserve(V);\n   \
  \         _outdegree.reserve(V);\n        }\n        if (E) {\n            _edges.reserve(E);\n\
  \        }\n    }\n    void reserveNodes(NodeID n) {\n        _nodes.reserve(n);\
  \ _outdegree.reserve(n);\n    }\n    void reserveEdges(EdgeID n) {\n        _edges.reserve(n);\n\
  \    }\n    // we can have multiple edge (v1, v2)\n    void addEdge(NodeID v1, NodeID\
  \ v2, EdgeWeight w = 0, const std::string & label = emptyString) {\n        if (v1\
  \ > _nodes.size() || v2 > _nodes.size())\n            return;\n        Edge e(v2,\
  \ w, label);\n        _edges[v1].push_front(e);\n        _outdegree[v1]++;\n   \
  \ }\n};\n```\n\n // // nodes are unique\n\n\n\n\n\n```cpp\nvoid addNode(NodeWeight\
  \ w = 0, const std::string & label = emptyString) {\n    EdgesList el;\n    Node\
  \ n(w, label);\n    _nodes.push_back(n); // 节点\n    _edges.push_back(el); // 带有\
