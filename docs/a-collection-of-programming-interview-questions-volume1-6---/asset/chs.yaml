- "# 编程面试题集 1-6 - Antonio Gulli\n\n\n\n![cover](img/cover.jpg)\n\n\n\n\n\n动态规划是 25\
  \ 本微型书籍系列中的第一本，这些书籍致力于算法、问题解决和 C++ 编程。\n\n## 献辞\n\n献给 Lorenzo，我的第一个孩子。\n希望你的一生中都能像数学一样享受数学，正如你\
  \ 10 岁时喜欢解决第 8 题一样。\n\n## 感谢\n\n感谢 Gaetano Mendola 提供的代码审查。\n\n\n\n\n\n\n**重叠子问题**意味着任何解决该问题的递归算法都应该反复解决相同的子问题，而不是生成新的子问题。**最优子结构**意味着任何最优解都可以从其子问题的最优解高效地构造出来。换句话说，假设每个子问题都有自己的代价函数：最优子结构意味着，这些代价函数的每一个最小值都可以作为全局代价函数限制在相同子集上的最小值被找到。\n\
  \n动态规划（DP）追求只对每个子问题求解一次，从而减少了计算次数。在计算出给定子问题的解后，它会被存储在表中或进行“**备忘**”（memoized）。下次需要相同的解时，只需查找即可。DP\
  \ 通过以下两种方法解决问题：\n\na) **自顶向下法**：这是许多 DP 问题相关的递归数学定义的直接结果。\n\nb) **自底向上法**：这需要对递归数学定义进行重述，先解决子问题，并使用它们的解来构建和实现更大子问题的解。\n\
  \n在书中，我们将回顾一系列动态规划问题、它们的解决方案以及相关的 C++ 代码。其中许多问题在面试中经常被问到，可以在专门准备面试的互联网网站上频繁找到。\n\
  \n# 1. 斐波纳契数\n\n## 解决方案\n斐波纳契序列的前两个数是 0 和 1，之后的每个数都是前两个数的和。通过在其著作[数学计算书](http://en.wikipedia.org/wiki/Liber_Abaci)中，[莱昂纳多·斐波纳契](http://en.wikipedia.org/wiki/Leonardo_Fibonacci)\
  \ 在 1200 年将该序列引入西欧数学，尽管该序列早在[印度数学](http://en.wikipedia.org/wiki/Indian_mathematics)\
  \ 中就被描述过。\n\n斐波纳契数的数学定义为：\n\n![](img/00028.jpeg)\n\n## 代码\n直接根据数学公式编写递归解决方案是非常容易的。这里我们提供了一个利用模板的力量在编译时计算斐波纳契数的实现。\n\
  \n```cpp\ntemplate <int N>\nstruct CTFibonacci {\n  static constexpr int value()\
  \ {\n    return CTFibonacci<N-1>::value() + CTFibonacci<N-2>::value();\n  }\n};\n\
  \ntemplate <>\nstruct CTFibonacci<1> {\n  static constexpr int value() {\n    return\
  \ 1;\n  }\n};\n\ntemplate <>\nstruct CTFibonacci<0> {\n  static constexpr int value()\
  \ {\n    return 0;\n  }\n};\n```\n\n## 复杂度\n这里的复杂度是指数级的，因为 ![](img/00029.jpeg)。另一种更高效的解决方案记录了中间结果，避免了重复计算同一个子问题。一种解决方案是：\n\
  \n```cpp\nunsigned int Fibonacci(unsigned int n) {\n  int a, b, sum;\n  a = 0; b\
  \ = 1; sum = a + b;\n  if (n <= 1) return n;\n  for (unsigned int i = 2; i < n;\
  \ ++i) {\n    a = b;\n    b = sum;\n    sum = a + b;\n  }\n  return sum;\n}\n```\n\
  \n## 复杂度\n时间上线性的，空间上是常数的。\n\n# 2. 二项式系数\n\n## 解决方案\n索引为 ![](img/00002.jpeg) 和 ![](img/00005.jpeg)\
