  \n## 18  使用 Kruskal 算法寻找最小生成树 (MST)\n\nKruskal 算法可以在带权边的无向图中找到最小生成树 (MST)。该算法按权重从小到大的顺序对边进行排序，然后如果某条边与已选择的边不形成环，则将其包含在解决方案中\n\
  \n## 解决方案\n\n伪代码使用了 UNION-FIND 操作[[9]](#part0000_split_036.html__ftn9) ：\n\n- `Find`:\
  \ 确定特定元素所在的子集。它用于判断两个元素是否在同一个子集中。\n- `Union`: 将两个子集合并为一个子集。\n\n```\nKRUSKAL-MST(G,\
  \ w)\nT ← Ø\nfor each vertex u in V\n    MAKE-SET(DS, u)\nfor each edge (u,v) in\
  \ E in order of nondecreasing weight\n    if FIND-SET(DS, u) != FIND-SET(DS, v)\n\
  \        UNION-SET(DS, u, v)\n    T ← T U {(u,v)}\nreturn T\n```\n\n在 boost[[10]](#part0000_split_036.html__ftn10)\
  \ 中，定义在 boost/graph/kruskal_min_spanning_tree.hpp 中。\n\n作为一个练习，尝试对以下图执行 Kruskal\
