  # 附录 A\n# 59. Python 快速入门\n# 60. 概率、矩阵和向量的快速入门\n\n## 1. 哪些是最重要的机器学习技术？\n\n## 解决方案\n\
  在他著名的论文《计算机器与智能》中，艾兰·图灵（Alan Turing）提出了一个基础问题：“机器能做到我们（作为思考实体）能做的事情吗？”机器学习并不关乎思考，更多的是关于相关的活动：学习，或者按照亚瑟·塞缪尔（Arthur\
  \ Samuel）所说，“赋予计算机在没有编程的情况下学习的能力的研究领域”。\n\n机器学习技术通常分为两类：\n\n在监督学习中，可获得由（输入，输出）组成的示例对，计算机学习一个模型，根据该模型在给定输入时，预测出一个误差最小的预期输出。分类、神经网络和回归都是监督学习的示例。对于所有技术，我们都假设有一个预言者或老师，他们可以教计算机如何做，以便它们将学到的教训应用到新的未见数据上。\n\
  \n在无监督学习中，计算机没有老师，它们被留下来在数据中寻找结构、模式和异常。聚类和密度估计是无监督学习的典型示例。\n\n现在让我们回顾主要的机器学习技术：\n\
  \n在**分类**中，教师提供（输入，目标类别）对，计算机学习如何将类别归因于新的未见数据。朴素贝斯、SVM、决策树和神经网络都是分类方法论。前两种将在本卷中讨论，而其余的将是下一卷的内容。\n\
  \n在**回归**中，教师提供（输入，连续目标）对，计算机学习如何对新的未见数据预测连续值。线性回归和逻辑回归是本卷将讨论的示例。决策树、SVM 和神经网络也可以用于回归。\n\
  \n在**关联规则学习**中，计算机被赋予大量的观测值，所有观测由多个变量组成。任务是学习变量之间的关系，例如 `A & BC`（如果 A 和 B 发生，那么\
  \ C 也会发生）。\n\n在**聚类**中，计算机学习如何将观测划分为不同的子集，使得每个分区根据某些定义的指标由相似的观测值组成。像 `K-Means` 和\
  \ `DBSCAN` 等算法也属于这一类。\n\n在**密度估计**中，计算机学习如何找到描述数据的统计值。像`期望极大化`Expectation Maximization）等算法也属于这一类。\n\
  \n## 2. 为什么为机器学习拥有一套稳健的指标是重要的？\n## 解决方案\n\n\n\n\n\n任何机器学习技术都应该使用指标对结果的质量进行分析性评估。例如：如果我们需要将人物、电影或歌曲等对象归类为不同的类别，精确率（precision）和召回率（recall）可能是合适的指标。\n\
  \n精确率（Precision）是比例尺![](img/00002.jpeg)，其中![](img/00003.jpeg)是真正例的数量，![](img/00004.jpeg)是假正例的数量。召回率（Recall）是比例尺![](img/00005.jpeg)，其中![](img/00006.jpeg)是真正例的数量，![](img/00007.jpeg)是假负例的数量。真和假是通过使用手动创建的数据得到的属性。精确率和召回率通常在一个被称为\
  \ P/R 曲线的二维图表中报告，通过报告在固定召回率值下所实现的精确率，可以比较不同的算法图表。\n\n此外，F1 是另一个经常使用的指标，它将精确率和召回率合并为一个单一值：\n\
  \n![](img/00008.jpeg)\n\nScikit-learn 为分类、聚类、回归、排序和成对判断提供了一全面的指标集[[1]](#part0000_split_066.html__ftn1)。例如，下面的代码计算了精确率和召回率。\n\
  \n### Code\n\n```python\nimport numpy as np\n\nfrom sklearn.metrics import precision_recall_curve\n\
  \ny_true = np.array([0,1,1,0,  1])\n\ny_scores = np.array([0.5,  0.6,  0.38,  0.9,\
  \  1])\n\nprecision, recall, thresholds = precision_recall_curve(y_true, y_scores)\n\
  \nprint precision\n\nprint recall\n```\n\n## 3. 为什么特征提取和特征工程在机器学习中如此重要？\n\n### Solution\n\
  \n特征（Features）是用于预测的选定变量。例如，假设你想预测明天是否是晴天，那么你可能会选择诸如湿度（一个数值）、风速（另一个数值）、一些历史信息（过去几年里发生了什么）、今天是否晴天（一个分类值是/否）以及其他一些特征。对于相同的算法，你的选择会极大地影响你的模型，你需要运行多次实验，以找到合适的数据量和正确的特征，以便以最小的误差进行预测。由成千上万特征及其组合来表示的问题并不罕见，一个优秀的特征工程师会使用工具根据特征对减少预测误差的贡献进行堆叠排序（stack\
  \ ranking）。\n\n不同的作者对不同的特征使用不同的名称，包括属性（attributes）、变量（variables）和预测器（predictors）。在书中，我们统一使用特征（features）一词。\n\
  \n特征可以是分类的，例如婚姻状况、性别、居住州、出生地；也可以是数值的，例如年龄、收入、身高和体重。这种区分很重要，因为某些算法（如线性回归）只对数值属性有效，如果存在分类特征，则需要以某种方式将其编码为数值。\n\
  \n换句话说，特征工程是提取、选择和转换代表数据的本质特征的艺术。它有时被认为没有机器学习算法那么光鲜，但实际上，任何经验丰富的数据科学家都知道，在选择良好的特征集上运行简单算法的效果，优于在糟糕的特征集上运行复杂的算法。\n\
  \n此外，简单算法通常更容易以分布式方式实现，因此它们在大型数据集上具有良好的扩展性。所以经验法则正如伽利略几个世纪前所说的那样：“简单是终极的”。仔细选择你的算法，并花大量时间研究你的数据，并通过适当的特征工程创建有意义的摘要。\n\
  \n现实世界的对象是复杂的，特征被用来分析性地表示这些对象。一方面，这种表示具有固有的误差，可以通过仔细选择一组正确的代表来减少这种误差。另一方面，我们可能不想创建太复杂的表示，因为机器学习一个复杂的模型在计算上可能是昂贵的，实际上这样的模型可能无法对未见数据进行良好的泛化。\n\
  \n现实数据是有噪声的。我们可能会有极少数实例（离群值），它们与剩余的大多数数据有显著差异，而所选算法应该具有足够的抗离群值能力。\n\n现实数据可能包含冗余信息。当我们提取特征时，我们可能希望优化学习模型的简单性，并丢弃与已观测特征高度相关的新特征。\n\
  \nETL 是从真实数据中提取（Extraction）、转换（Transformation）和加载（Loading）特征的过程，用于创建各种学习集。转换特指诸如特征加权、丢弃高相关特征、创建数据中观测特征的派生特征，以及使用哈希或复杂的空间投影技术将高维特征空间简化为低维空间的操作。例如，在书中我们讨论：\n\
  \n* TF-IDF，文本分类中特征加权的一个示例\n* 卡方检验（ChiSquare），过滤高度相关特征的示例\n* 核技巧（Kernel Trick），创建派生特征的示例\n\
  * 哈希（Hashing），一种减少特征空间维度的简单技术\n* 分箱（Binning），将连续特征转换为离散特征的示例。为了表示箱，可能会创建新的合成特征。\n\
  \n## 4. 你能提供一个特征提取的示例吗？\n\n### Solution\n\n假设我们要对文本文件进行机器学习。第一步是从文本中提取有意义的特征向量。一种典型的表示是所谓的词袋模型（bag\
  \ of words），其中：\n\na) 集合中的每个单词![](img/00009.jpeg)都与其分配的唯一整数![](img/00010.jpeg)相关。\n\
  \nb) 对于每个文档![](img/00011.jpeg)，计算每个单词![](img/00009.jpeg)的出现次数，并将此值存储在矩阵![](img/00012.jpeg)中。请注意![](img/00013.jpeg)通常是稀疏矩阵，因为如果单词不在文档中，其计数为零。\n\
  \nNumpy、Scikit-learn 和 Spark 都支持稀疏向量[[2]](#part0000_split_066.html__ftn2)。让我们来看一个示例，我们加载由\
  \ Usenet 文章[[3]](#part0000_split_066.html__ftn3）组成的数据集，其中考虑 alt.atheism 类别，并将文本集合转换为标记计数矩阵。然后我们打印![](img/00014.jpeg)。\n\
  \n### Code\n\n```python\nfrom sklearn.datasets import fetch_20newsgroups\n\nfrom\
  \ sklearn.feature_extraction.text import CountVectorizer\n\ncategories =  ['alt.atheism']\n\
  \nnewsgroups_train = fetch_20newsgroups(subset='train', categories=categories)\n\
  \ncount_vect = CountVectorizer()\n\nTrain_counts = count_vect.fit_transform(newsgroups_train.data)\n\
  \nprint count_vect.vocabulary_.get(u'man')\n```\n\n## 5. 监督学习和无监督学习中的训练集、验证集、测试集和黄金集是什么？\n\
  \n### Solution\n\n在机器学习中，一组真实标签被称为黄金集（gold set）。这组示例通常是手动构建的，通过人类专家或通过众包工具（如 Amazon\
  \ Mechanical Turk[[4]](#part0000_split_066.html__ftn4））或通过在线用户收集的显式/隐式反馈。例如：黄金集可以包含由各领域专家手动分配到不同类别的新闻文章，或者可能包含\
  \ Netflix 用户提供的电影分评分。\n\n监督机器学习包含四个阶段：\n\n\n\n\n\n1. **训练阶段**：通过黄金标准集（gold set）提取的样本用于学习一组数据模型。通过选择合适的超参数集合（即可用于算法微调的因子），可以从该族中生成任意一个模型；\n\
  2. **验证阶段**：通过选取超参数，使得在称为“验证集”（validation set）的黄金标准样本上计算出的误差函数最小化，从而从模型族中选出最佳学习模型；此阶段用于确定给定算法的最佳配置；\n\
  3. **测试阶段**：在称为“测试集”（test set）的黄金标准样本上评估最佳学习模型的误差。此阶段对于比较通过不同算法构建的模型非常有用；\n4. **应用阶段**：将学习到的模型应用于真实数据。\n\
  \n这里可以强调两个额外的观察结果：首先，训练集、验证集和测试集都是从同一个黄金标准集中采样的，但这些样本是相互独立的。其次，假设学习到的模型可以通过两个不同的函数\
  \ ![](img/00015.jpeg) 和 ![](img/00016.jpeg) 结合一组超参数![](img/00017.jpeg) 来描述。\n\n\
  无监督机器学习仅包含测试和应用阶段，因为没有预先需要学习的模型。事实上，无监督算法会动态地适应观测数据。\n\n# 6. 什么是偏差-方差权衡（Bias-Variance\
  \ tradeoff）？\n\n### 解 Solution\n\n`Bias`（偏差）和`Variance`（方差）是机器学习两个独立的误差来源，它们防止算法将学习到的模型泛化到训练集之外。\n\
  \n* `Bias` 是代表特征与输出之间缺失关系的误差。在机器学习中，这种现象被称为欠拟合（underfitting）。\n* `Variance` 是代表对训练数据微小波动敏感程度的误差。在机器学习中，这种现象被称为过拟合（overfitting）。\n\
  \n一个良好的学习算法应该捕捉训练数据中的模式（低偏差），但它也应该在未见的应用数据上良好泛良好（低方差）。通常情况下，复杂模型可能显示出低偏差，因为它捕捉了训练数据中的许多关系，同时它可能显示出高方差，因为它不一定能良好泛化。高偏差低方差模型的情况则相反。在许多算法中，误差可以解析上分解为三个部分：`bias`、`variance`\
  \ 和不可约误差（irreducible error，后者代表未见样本数据预期误差的下限）。\n\n减少方差的一种方法是尝试获取更多数据或降低模型的复杂度。减少偏差的一种方法是增加更多特征或使模型更复杂，因为在这种情况下增加数据没有帮助。在`Bias`\
  \ 和 `Variance` 之间找到正确的平衡是每位数据科学家都必须学会管理的艺术。\n\n![](img/00018.jpeg)\n\n## 7. 什么是交叉验证（cross-validation），什么是过拟合（overfitting）？\n\
  \n### Solution\n\n在一组示例上学习模型并在同一组示例上进行测试是一个逻辑错误，因为模型在测试集上没有误差，但在真实应用数据上的性能几乎会很糟糕。这个问题被称为过拟合，这也是为什么通常将黄金标准集划分为训练集、验证集和测试集等独立集合的原因。代码部分报告了一个随机划分的示例，其中一个包含糖尿病患者数据的玩具级数据集被随机分成了两部分：训练集和测试集。\n\
  \n给定一个学习模型族，验证集用于估计最佳超参数。然而，采用这种策略仍然存在超参数过拟合到特定验证集的风险。\n\n该问题的解决方案被称为交叉验证。其原理很简单：将测试集划分为\
  \ ![](img/00019.jpeg) 个较小的集合，称为 `folds`（折叠），然后在 ![](img/00020.jpeg) 折叠上学习模型，而剩余数据用于验证。这个过程在循环中重复，并对每次迭代实现的指标取平均值。下方的章节报告了交叉验证的示例，其中我们通过\
  \ `SVM` 对玩具级数据集进行分类，并通过交叉验证计算准确率（accuracy）。`SVM` 是一种分类技术，而“准确率”是一个质量衡量标准（所做出的正确预测次数除以总预测次数，并乘以\
  \ 100 以转换为百分比）。\n\n[`Stratified KFold](http://scikit-learn.org/stable/modules/generated/sklearn.cross_validation.StratifiedKFold.html#sklearn.cross_validation.StratifiedKFold)\
  \ 是 `k-fold` 的变体，其中每个集合包含的每个目标类的样本比例与完整集合大致相同且平衡。\n\n### Code\n\n```\nimport numpy\
  \ as np\n\nfrom sklearn import cross_validation\n\nfrom sklearn import datasets\n\
  \nfrom sklearn import svm\n\ndiabets = datasets.load_diabetes()\n\nX_train, X_test,\
  \ y_train, y_test = \\\ncross_validation.train_test_split(\n    diabets.data, diabets.target,\
  \ test_size=0.2, random_state=0)\n\nprint X_train.shape, y_train.shape # test size\
  \ 20%\nprint X_test.shape, y_test.shape    \n\nclf = svm.SVC(kernel='linear', C=1)\n\
  \nscores = cross_validation.cross_val_score(\n    clf, diabets.data, diabets.target,\
  \ cv=4)  # 4-folds\nprint scores\nprint(\"Accuracy: %0.2f (+/- %0.2f)\" % (scores.mean(),\
  \ scores.std()))\n```\n\n## 8. 为什么在机器学习中使用向量（vectors）和范数（norms）？\n\n### Solution\n\
  \n电影、歌曲和文档等对象通常由向量表示。这些特征是判别性特征的总结。\n\n给定一组向量（即所谓的向量空间 ![](img/00021.jpeg)），对于 ![](img/00022.jpeg)\
