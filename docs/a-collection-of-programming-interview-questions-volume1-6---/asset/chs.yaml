  \n# 21. Sum Subset – 给定一个大小为 `![](img/00246.jpeg)` 的整数数组，将其划分，使得两个子集的和相等 `s`\n\n\
  ## 解决方案\n子集和问题是计算机科学中的一个重要问题，在密码学和复杂度理论中有应用。该问题是 NP 完全的。最朴素的方法生成所有子集，并检查每个子集的和是否为正确数字。复杂度为\
  \ `![](img/00247.jpeg)`，其中 `![](img/00248.jpeg)` 是数组的大小。\n\n可以使用动态规划得到多项式时间解决方案。首先，如果和是奇数则无解，而和是偶数时我们可以尝试寻找子集。其次，如果当前元素大于和，我们必须跳过它，否则我们可以决定是否包含它。因此\
  \ `![](img/00249.jpeg)` 取决于 `![](img/00250.jpeg)`，如果我们不包含元素 `![](img/00251.jpeg)`，对于位置\
  \ `![](img/00252.jpeg)` 以及对于当前和值 `![](img/00253.jpeg)`。而如果我们包含元素则取决于 `![](img/00254.jpeg)`。\n\
  \n## 代码\n```cpp\nbool isSubsetSum(const std::vector<unsigned int> & v,\nconst unsigned\
  \ int n, unsigned int sum)\n{\n  if (n == 0 && sum != 0)\n  return false;\n}\n```\n\
  \n\n\n```cpp\nif (sum == 0)\n  return true;\n\nif (v[n - 1] > sum)\n  return isSubsetSum(v,\
  \ n - 1, sum);\n\nreturn isSubsetSum(v, n - 1, sum) ||\n  isSubsetSum(v, n - 1,\
  \ sum - v[n - 1]);\n}\n\nbool partition(const std::vector<unsigned int> & v, unsigned\
  \ int n)\n{\n  int sum = std::accumulate(v.begin(), v.end(), 0);\n  if (sum % 2\
  \ != 0)\n    return false;\n  return isSubsetSum(v, n, sum / 2);\n}\n\nbool isSubsetSumDP(const\
  \ std::vector<unsigned int> & v, const unsigned int n, unsigned int sum)\n{\n  Matrix<bool>\
  \ subset(sum + 1, n + 1);\n  for (unsigned int j = 0; j <= n; j++)\n    subset(0,\
  \ j) = true;\n  for (unsigned int i = 1; i <= sum; i++)\n    subset(i, 0) = false;\n\
  \  for (unsigned int i = 1; i <= sum; i++)\n    for (unsigned int j = 1; j <= n;\
  \ j++) {\n      subset(i, j) = subset(i, j - 1);\n      if (i >= v[j - 1]) {\n \
  \       subset(i, j) = subset(i, j) ||\n          subset(i - v[j - 1], j - 1);\n\
  \      }\n    }\n  return subset(sum, n);\n}\n```\n\n## 复杂度\n复杂度是伪多项式的![](img/00249.jpeg)\n\
  \n# 22. 集合划分 – 将一个正整数多集 `S` 划分为两个子集 `S1` 和 `S2`，使得 `S1` 中的数字之和等于 `S2` 中的数字之和。\n\n\
