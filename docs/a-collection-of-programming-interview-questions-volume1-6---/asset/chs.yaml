  \ (MST)\n\n让我们从一些定义开始。如果无向图中的每对顶点之间都是连接的，则称该图是连通的。特别是，如果两个顶点 ![](img/0062.jpeg)\
  \ 和 ![](img/0063.jpeg) 如果图中包含一条通往 ![](img/0065.jpeg) 的 `path` ![](img/0064.jpeg)，则定义它们为连通的。给定一个连通图，生成树是连接所有顶点的树。如果图的边带有权重，那么最小生成树就是边权之和最小的生成树。\n\
  \n## 解决方案\n\n计算 MST 的一种方法是采用基于 `Prim` 的经典贪心算法。开始时，树包含一个从图中任意选择的顶点。然后，在连接树内顶点与树外顶点的边中选择权重最小的边。将该边添加到树中并重复之前的步骤，直到所有顶点都在树中。在我们的实现中，通过使用\
  \ `boost::fibonacci` 实现的优先级队列来维护边的有序性。\n\n## 代码\n\n```cpp\nstruct nodeComparison\n\
  {\n    const Graph::NodeID node;\n    Graph::weight priority;\n    nodeComparison(Graph::NodeID\
  \ name, Graph::NodeID p) : node(name), priority(p) {};\n    bool operator < (nodeComparison\
  \ & rhs) const\n    {\n        return priority > rhs.priority;\n    }\n};\n\nvoid\
  \ PrimMST(const Graph & g, Graph::NodeID startNode)\n{\n    typedef boost::heap::fibonacci_heap<nodeComparison>\
  \ Heap;\n    Heap heap;\n    std::map <Graph::NodeID, Heap::handle_type> mapHandles;\n\
  \    // 用于 decrease() key\n    Graph::weight edgeWeight;\n    Graph::NodeID numNodes\
  \ = g.getNumNodes();\n    std::vector<bool> isInHeap(numNodes, false);\n    std::vector<Graph::NodeID>\
  \ parent(numNodes + 1, 0);\n    for (Graph::NodeID i = 0; i < numNodes; ++i)\n \
  \   {\n        mapHandles[i] = heap.push(nodeComparison(i, std::numeric_limits<Graph::weight>::max()));\n\
  \        isInHeap[i] = true;\n    }\n    (*(mapHandles[startNode])).priority = 0;\n\
  \    // 初始节点优先级为 0\n    heap.increase(mapHandles[startNode]);\n    // fibonacci\
  \ 的增加是摊还常数时间\n    // decrease 是常数时间\n    while (!heap.empty()){\n        nodeComparison\
  \ nc = heap.top();\n        heap.pop();\n        isInHeap[nc.node] = false;\n  \
  \      std::cout << \"Visited=\" << nc.node << std::endl;\n        for (Graph::NodeID\
  \ v = 0; v < numNodes; ++v)\n        {\n            if (g.edges(nc.node).count(v)\
  \ && !isInHeap[v])\n            {\n                Graph::weight w = g.getWeight(nc.node,\
  \ v);\n                if (w < mapHandles[v]->priority)\n                {\n   \
  \                 mapHandles[v]->priority = w;\n                    heap.increase(mapHandles[v]);\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n## 复杂度\n\n时间复杂度为\
  \ ![](img/0066.jpeg)。然而，使用 ![](img/0067.jpeg) 是可能的。最小生成树的示例见下方 ![](img/0068.jpeg)。\n\
  \n## 12 空间复杂度评估\n\n## 13 在有向图中寻找强连通分量\n\n有向图 ![](img/0069.jpeg) 被认为是连通的，如果每个节点都可以从其他节点到达。强连通分量\
  \ ![](img/0070.jpeg) 创建了一个自身连通的子图划分，如图所示。\n\n![Scc](img/0071.jpeg)\n\n## 解决方案\n\n\
  这里实现的解决方案是 Kosaraju 算法，它使用了两次 `DFS`。第一次遍历在原图上执行，并用于选择第二次 DFS 测试顶点的顺序。第二次 DFS 在原图的转置图上进行。每次递归探索都会发现一个新的连通分量。\n\
  \n\n\n\n\n```cpp\nstd::stack<Graph::NodeID> stk;\nstd::vector<bool> visited(g.numNodes(),\
  \ false);\nunsigned componentID = 0;\n\nfor (Graph::NodeID id = 0; id < g.numNodes();\
  \ ++id)\n    if (visited[id] == false)\n        fillOrder(g, id, visited, stk);\n\
  \nGraph gt;\ntranspose(g, gt);\nstd::fill(visited.begin(), visited.end(), false);\n\
  while (!stk.empty()) {\n    Graph::NodeID id = stk.top();\n    stk.pop();\n    if\
  \ (!visited[id]) {\n        dfsUtil(g, id, visited);\n        std::cout << \"end\
  \ component id=\" << componentID++ << std::endl;\n    }\n}\n```\n\n## 复杂度\n\n时间复杂度见\
  \ ![](img/00078.jpeg)\n\n## 14 覆盖 DFS 树\n\n给定一个图 ![](img/00079.jpeg)，可以定义由 DFS 访问生成的路径树\
  \ ![](img/00080.jpeg)。如果 G 不是（强）连通的，那么我们需要从每个节点重新启动 DFS，访问将生成一棵森林。如果图是有向的，访问将遵循边的方向；而如果图是无向的，由于访问顺序的影响，每条边将产生一个随机的方向。在访问过程中，尚未被包含在\
  \ ![](img/00081.jpeg) 中的边可以分为三类：\n\n* 如果边通过从 T 中的节点 ![](img/00082.jpeg) ![](img/00083.jpeg)\
  \ 移动到另一个节点 ![](img/00084.jpeg)，且该节点是 G 中 ![](img/00085.jpeg) 的祖先，则该边 `(u, v)` 称为\
  \ `回边` (loop back edge)。\n\n* 如果边通过从 T 中的节点 ![](img/00086.jpeg) ![](img/00087.jpeg)\
  \ 移动到另一个节点 ![](img/00088.jpeg)，且该节点是 G 中 ![](img/00089.jpeg) 的后代，则该边 `(u, v)` 称为\
  \ `前进边` (forward edge)。\n\n* 否则，它被称为 `交叉边` (cross edge)。\n\n## 15 寻找哈密顿环\n\n哈密顿路径是遍历[图](http://mathworld.wolfram.com/Graph.html)\
  \ 且恰好访问每个节点的路径。如果该路径也是一个环，那么我们就得到了如图所示的哈密顿环。该问题是 NP-完全的，因此最坏情况的解决方案节点节点数量呈指数级的时间。\n\
  \n![`upload.wikimedia.org/wikipedia/commons/thumb/6/60/Hamiltonian_path.svg/220px-Hamiltonian_path.svg.png`](img/00090.jpeg)\n\
  \n## 解决方案\n\n这里我们展示一个 C++ 回溯算法。\n\n## 代码\n\n```cpp\n// hamiltonianCycle\nbool isSafe(const\
  \ MatrixGraph& g, const MatrixGraph::NodeID v, std::vector<MatrixGraph::NodeID>\
  \ & path, unsigned int pos) {\n    if (!g(path[pos - 1], v)) return false;\n   \
  \ for (MatrixGraph::NodeID i = 0; i < pos; ++i)\n        if (path[i] == v) return\
  \ false;\n    return true;\n}\n\nbool hamiltonianUtil(const MatrixGraph & g, std::vector<MatrixGraph::NodeID>\
  \ & path, unsigned int pos) {\n    if (pos == g.getNumNodes()) {\n        if (g(path[pos\
  \ - 1], path[0])) return true;\n        else return false;\n    }\n    for (MatrixGraph::NodeID\
  \ v = 1; v < g.getNumNodes(); ++v) {\n        if (isSafe(g, v, pos)) {\n       \
  \     path[pos] = v; // insert v\n            if (hamiltonianUtil(g, path, pos +\
  \ 1) == true) return true;\n            path[pos] = -1; // remove v\n        }\n\
  \    }\n    return false;\n}\n\nbool hamiltonianCycle(const MatrixGraph & g) {\n\
  \    MatrixGraph::NodeID V = g.getNumNodes();\n    std::vector<MatrixGraph::NodeID>\
  \ path(V, -1);\n    bool returnValue;\n    path[0] = 0;\n    if ((returnValue =\
  \ hamiltonianUtil(g, path, 1))) {\n        std::cout << \"Hamiltionian cycle \"\
  \ << std::endl;\n        for (MatrixGraph::NodeID i = 0; i < V; ++i)\n         \
  \   std::cout << path[i] << ' ';\n        std::cout << std::endl;\n    } else {\n\
  \        std::cout << \"No Hamiltionian cycle\";\n    }\n    return returnValue;\n\
  }\n```\n\n## 16 寻找图中的割点\n\n割点是指任何移除后会增加连通分量数量的顶点。\n\n## 解决方案\n\n该算法由 Hopcroft 和\
  \ Tarjan 提出。其思想是在运行 DFS 的同时维护：\n\n1. 每个顶点在 DFS 树中的深度。\n2. 对于每个节点 ![](img/00091.jpeg)，其所有后代\
  \ ![](img/00092.jpeg) 邻居的最小深度。\n\n割点在 DFS 树中满足以下条件：\n- 根节点如果至少有两个子节点，则是割点。\n- 非根节点\
  \ $u$ 如果存在一个子节点 $v$，使得 $v$ 的任何后代的深度值都不于 $u$ 的发现深度，则 $u$ 是割点。\n\n## 代码\n\n```cpp\n\
  // Articulation Points\nvoid articulationUtil(const Graph & g, Graph::NodeID u,\
  \ unsigned int time, std::vector<bool> visited, std::vector<Graph::NodeID> & discovery,\
  \ std::vector<Graph::NodeID> & lower, std::vector<Graph::NodeID> & parent, std::vector<bool>\
  \ & articulationPoints) {\n    Graph::NodeID children = 0;\n    visited[u] = true;\n\
  \    discovery[u] = lower[u] = ++time;\n    for (auto & e : g.edges(u)) {\n    \
  \    if (!visited[e.v]) {\n            parent[e.v] = u;\n            children++;\n\
  \            articulationUtil(g, e.v, time, visited, discovery, lower, parent, articulationPoints);\n\
  \            lower[u] = std::min(lower[u], lower[e.v]);\n            if (parent[u]\
  \ == std::numeric_limits<Graph::NodeID>::max() && children > 1)\n              \
  \  articulationPoints[u] = true;\n            if (parent[u] != std::numeric_limits<Graph::NodeID>::max()\
  \ && lower[e.v] >= discovery[u])\n                articulationPoints[u] = true;\n\
  \        } else if (e.v != parent[u]) {\n            lower[u] = std::min(lower[u],\
  \ discovery[e.v]);\n        }\n    }\n}\n\nvoid articulationPoints(const Graph &\
  \ g) {\n    unsigned int time = 0;\n    std::vector<bool> visited(g.numNodes(),\
  \ false);\n    std::vector<Graph::NodeID> discovery(g.numNodes(), 0);\n    std::vector<Graph::NodeID>\
  \ lower(g.numNodes(), 0);\n    std::vector<Graph::NodeID> parent(g.numNodes(), std::numeric_limits<Graph::NodeID>::max());\n\
  \    std::vector<bool> articulationPoints(g.numNodes(), false);\n    for (Graph::NodeID\
  \ i = 0; i < g.numNodes(); i++) {\n        if (!visited[i]) {\n            articulationUtil(g,\
  \ i, time, visited, discovery, lower, parent, articulationPoints);\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n对于具有非负边权重的图，我们可以应用 Dijkstra 算法来寻找单源最短路径树[[6]](#part0000_split_036.html__ftn6)。Edger\
  \ Dijkstra 出于荷兰，他于 1959 年发明了该算法。对于给定的源节点 ![](img/00105.jpeg)，该算法会寻找 ![](img/00106.jpeg)\
  \ 与图中所有其他节点之间开销最低的路径。这类问题有多个应用，包括优化、路由和流量分配。\n\n下面给出了 Dijkstra 的伪代码。向量 ![](img/00107.jpeg)\
  \ 包含到达节点 ![](img/00108.jpeg) 路径的权重和（初始为无穷大）。向量 ![](img/00109.jpeg) 包含 ![](img/00110.jpeg)\
  \ 在最短路径中的前驱节点（初始为 ![](img/00111.jpeg)）。此外，使用一个优先级队列![](img/00112.jpeg) 来选择具有最小 ![](img/00114.jpeg)\
  \ 的节点 ![](img/00113.jpeg）（伪代码中该操作为 `u ← EXTRACT-MIN(Q)`）。此外， ![](img/00115.jpeg)\
  \ 包含了所有与 ![](img/00117.jpeg) 相邻的节点 ![](img/00116.jpeg)。因此，对于每个 ![](img/00118.jpeg)，如果\
  \ ![](img/00119.jpeg) —— 通往 ![](img/00120.jpeg) 的路径权重和加上边 ![](img/00121.jpeg) 的权重小于\
  \ ![](img/00122.jpeg) —— 通往 ![](img/00123.jpeg) 的路径权重和，那么我们就找到了一条更短的路径。在这种情况下 ![](img/00124.jpeg)\
  \ 和 ![](img/00125.jpeg) 会得到相应的更新。同时，如果节点 `v` 之前未被访问过，则将其加入 `Q`。如果已经访问过，则其在 `Q` 中的优先级应根据新权重降低（伪代码中该操作为\
  \ `DECREASE-KEY(Q, v)`）。最后返回向量 ![](img/00126.jpeg) 和 ![](img/00127.jpeg)。\n\n###\
  \ Code\n\n```\nDIJKSTRA(G, s, w) for each vertex u in V\n  d[u] ← infinity\n  p[u]\
  \ ← u\n  color[u] ← WHITE\n  color[s] ← GRAY\n  d[s] ← 0\n  INSERT(Q, s)\n  while\
  \ (Q != Ø)\n    u ← EXTRACT-MIN(Q)\n    for each vertex v in Adj[u]\n      if (w(u,v)\
  \ + d[u] < d[v])\n        d[v] ← w(u,v) + d[u]\n        p[v] ← u\n        if (color[v]\
  \ == WHITE)\n          color[v] ← GRAY\n          INSERT(Q, v)\n      else if (color[v]\
  \ == GRAY)\n        DECREASE-KEY(Q, v)\n    color[u] ← BLACK\n  return (d, p)\n\
  ```\n\n对于本次练习[[7]](#part0000_split_036.html__ftn7)，我们开始使用 `boost::BGL`，这是一个用于图创建和处理的强大框架[[8]](#part0000_split_036.html__ftn8)。图可以具有与边关联的权重和名称标签，这些属性存储在\
  \ `boost::property` 中。此外，图可以用 `boost::adjacency_list` 或 `boost:adjacenty_matrix`\
  \ 来表示。\n\n`boost:adjacenty_list` 使用了许多参数，包括 `OutEdgeList`（用于表示每个顶点边列表的容器选择器）、`VertexList`（用于表示图顶点列表的容器选择器）、`Directed`（用于选择图是有向图、无向图还是具有双向边访问权限的有向图）、`VertexProperties`（用于指定内部属性存储）、`EdgeProperties`（用于指定内部属性存储）、`GraphProperties`（用于指定图对象的属性存储）、`EdgeList`（用于表示图边列表的容器选择器）。例如，`listS`\
  \ 选择了 `std::list`，如果你需要快速添加和删除顶点，这是一个很好的选择。`adjacency_list` 类实现了 `boost::property_maps`\
  \ 用于访问附加到图顶点和边上的对象（属性），并使用 `boost::iterator_property_map` 在 map 内部导航。所有这些功能都用于用统一的表示法表示多种类型的图。考虑到这一点，我们可以创建一个\
  \ `Graph g` 并使用相应的 boost 方法添加顶点和边。`predecessorMap` 记录了最短路径树中的边，该树通过图遍历计算得出，而从源顶点到图\
  \ `g` 中每个顶点的最短路径权重记录在 `predecessorMap` 中。\n\n\n\n\n\n```cpp\n<< \" = \" <<\nboost::get(boost::edge_weight,\
  \ g, pathIterator)\n<< std::endl;\n}\nstd::cout << \"Distance: \"\n<< distanceMap[v2]\
  \ << std::endl;\n}\n```\n\n一个非常有用的练习是使用 Dijkstra 算法计算图中所示图的最短路径。\n\n![](img/00128.jpeg)\n\
