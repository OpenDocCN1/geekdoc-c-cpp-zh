  \ 21 题）：**\n\n[content]\n## 21  使用 Floyd-Warshall 算法寻找所有对最短路径\n\nFloyd-Warshall\
  \ 算法可以找到图中每对顶点之间的最短距离。该算法可以检测是否存在负权环，这会产生无限最短路径。\n\n## 解决方案\n\n伪代码如下\n\n设 dist 为初始化为无穷的\
  \ |V| × |V| 数组\n\n对于每个顶点 v\n对于对于每个边 (u,v)\n    dist[u][v] ← w(u,v) // 边 (u,v) 的权重\n\
  \n对于 k 从 1 到 |V|\n    对于 i 从 1 到 |V|\n        对于 j 从 1 到 |V|\n            if dist[i][j]\
  \ > dist[i][k] + dist[k][j]\n                dist[i][j] ← dist[i][k] + dist[k][j]\n\
  ```\n\n这段伪代码计算了所有节点对最短路径的权重。然而，它并没有记录最小路径。这些可以通过对代码进行某些更改来存储，这里留作练习。\n\n\n\n\n在\
  \ boost 中，这定义在 [boost/graph/floyd_warshall_shortest.hpp](http://www.boost.org/doc/libs/1_41_0/boost/graph/floyd_warshall_shortest.hpp)\
  \ 中\n\n## 复杂度\n\n时间复杂度为 ![](img/00176.jpeg)，而空间复杂度为 ![](img/00177.jpeg)\n\n## 22\
  \ 使用 Bellman-Ford 算法寻找所有单源最短路径\n\n`Bellman-Ford` 算法解决的是具有正权重和负权重边边的图的单源最短路径问题。对于仅包含正权重的图，`Dijkstra’s`\
  \ 算法更高效。`Bellman Ford` 是旧版 RIP[[12]](#part0000_split_036.html__ftn12)（网际路由协议）的代码。`Bellman-Ford`\
  \ 与 `Dijkstra` 非常相似，但它处理所有的边，而不是在所有待处理的节点中选择权重最小的节点（贪心选择）。该计算对所有节点重复进行。\n\n### 解法\n\
  \n伪代码如下：\n\n```\nBELLMAN-FORD(G)\n\nfor each vertex u in V\n  d[u] ← infinity; p[u]\
  \ ← u\n\n  for i ← 1 to |V|-1\n    for each edge (u,v) in E\n      if (w(u,v) +\
  \ d[u] < d[v])\n        d[v] ← w(u,v) + d[u];\n        p[v] ← u\n\n  for each edge\
  \ (u,v) in E\n    if (w(u,v) + d[u] < d[v])\n      return (false, , )\n\n  return\
  \ (true, p, d)\n```\n\n在 boost 中，这定义在 [boost/graph/bellman_ford_shortest_paths.hpp](http://www.boost.org/doc/libs/1_55_0/boost/graph/bellman_ford_shortest_paths.hpp)\
  \ 中\n\n## 复杂度\n\n时间复杂度为 ![](img/00178.jpeg)\n\n## 23 区间的独立集\n\n给定实数线上的 `n` 个区间，最大独立集是一个区间子集\
