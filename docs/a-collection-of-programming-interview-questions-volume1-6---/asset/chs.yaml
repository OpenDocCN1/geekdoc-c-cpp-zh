  \n\n\n\n\n# 24. 实现访问者模式\n\n## 解决方案\n\n# 设计模式\n\n设计模式是一系列逻辑模型，用于解决在软件开发过程中观察到的重复性问题而被采用。模式处理的不是程序所采用的核心算法，而是为现代软件设计提供可重用的最佳实践解决方案。正因如此，算法对于计算效率至关重要，而模式对于构建可扩展的架构解决方案至关重要。\n\
  \n在面向对象编程中，模式通常展示了类与对象之间的关系和交互。在本书中，我们将讨论三类设计模式：\n\n1) `创建型模式`（Creational patterns），它们代表你创建对象，而不是直接实例化它们。\n\
  \n2) `结构型模式`（Structural patterns），它们通过继承来组合接口。对象的组合允许创建新功能、简化接口、适配异构对象、提高性能并降低复杂性。\n\
  \n3) `行为模式`（Behavioural patterns），用于描述对象之间的交互和通信。行为模式还用于处理每个对象的内部状态和内部活动。\n\n设计模式在所谓的“四人帮”（Gamma\
  \ 等人）出版书籍《设计模式：可重用面向对象的设计](http://en.wikipedia.org/wiki/Design_Patterns_(book))》后开始在计算机科学中被采用[[1]](#part0000.html__ftn1)\n\
  \n# 创建型模式\n\n创建型模式代表你创建对象，而不是直接实例化它们。\n\n# 1. 实现抽象工厂模式\n\n## 解决方案\n\n抽象工厂模式背后的直觉是封装一组具有共同行为的工厂，而不需要指定它们的类。这种模式允许交换具体的实现，而无需更改使用这些实现的代码。这是因为工厂通常返回一个抽象指针，而客户端不关心内部细节。\n\
  \n在这个示例中，`Widget` 类有一个纯虚方法。派自 `Widget` 的两个类实现了特定的 `draw()` 行为。在说明性场景中，我们只是打印不同的文本。\n\
  \n代码\n\n```cpp\nnamespace Abstract_Factory{\n\n // 工厂模式建议在工厂基类中定义一个\n\n // 创建服务接口，并在独立的派自工厂的派\
  \ \n\n // 类中实现每个“平台”。\n\n class  Widget{\n\n public:\n\n  virtual  void draw() =\
  \ 0; // 设纯虚\n\n};\n\n class  OSX_Button : public  Widget{\n\n public:\n\n  void\
  \ draw() {\n\n std::cout << \"\\tOSX buttom\" << std::endl;\n\n             }\n\
  \ };\n\n class  Windows_Button : public  Widget{\n\n public:\n\n  void draw() {\n\
  \n std::cout << \"\\tWindows buttom\" << std::endl;\n\n             }\n };\n\n};\
  \ // 结束抽象工厂\n\nvoid testAbstractFactory(){\n\n using  namespace Creational_Patterns::Abstract_Factory;\n\
  \n Widget * w = new  OSX_Button();\n\n w->draw();\n\n delete w;\n\n}\n```\n\n# 2.\
  \ 实现构建器模式\n\n## 解决方案\n\n构建器旨在是将复杂对象的构建与它的表示分离开来。该模式没有使用不同的构造函数，而是定义了一个单一对象：构建器。该对象根据用户定义的配置参数逐步构建所需的对象。`Builder`\
  \ 与抽象工厂的不同之处在于，前者将实际对象的构建委托给特定的辅助类/对象，而后者使用继承来交换具体的实现。\n\n在这个示例中，`Builder` 类的实现根据一个纯虚方法\
  \ `configure`，该方法在每个子类中定义，用于设置驱动每个子类构建过程的参数。可以在骨架代码中添加一组基于不同条件的特定测试，以分别驱动“简单构建器”和“高级构建器”采取的特定操作项。\n\
  \n代码\n\n```cpp\nnamespace Builder{\n\n // 将复杂对象的构建与它的表示\n // 分离开来，以便相同的构建过程\n\n\
  \ // 可以创建不同的表示。\n\n class  Build{ // 基类\n\n public:\n\n  virtual  void configure()\
  \ = 0;\n\n // 这里可以添加方法来查看内部状态\n\n protected:\n\n  int configuration_1_; // 所有的配置变量\n\
  \n  int configuration_2_; // 所有的配置变量\n\n  //...\n\n  int configuration_n_; // 所有的配置变量\n\
  \n      };\n class  SimpleBuilder : public  Build { // 派生类\n\n public:\n\n     \
  \        SimpleBuilder()\n\n             {\n\n  // 这里可以对配置参数添加显式测试\n\n // 以驱动“简单构建器”\n\
  \n// 创建步骤\nstd::cout << \"\\tSimple Builder\" << std::endl;\n\n             };\n\
  \  void configure()\n\n             {\n\n  // 这里可以添加额外的配置\n             };\n };\n\
  \ class  AdvancedBuilder : public  Build { // 派生类\n\n public:\n\n             AdvancedBuilder()\
  \ // 根据上下文推断原文在文中缺失\n             {\n\n  // 这里可以对配置参数添加显式测试\n\n // 以驱动“简单构建器”\n\n\
  // 创建步骤\nstd::cout << \"\\tAdvanced Builder\" << std::endl;\n\n             };\n\
  \  void configure()\n\n             {\n\n  // 这里可以添加额外的配置\n             };\n };\n\
  \n // 使用多个构建器的类\n class  ClientClass{\n\n public:\n\n             ClientClass(Build\
  \ * builder) : builder_(builder){};\n\n private:\n\n  Build * builder_; // 存储特定的构建器\n\
  \n };\n\n}; // 结束构建器\n\nvoid testBuilder(){\n\n using  namespace Creational_Patterns::Builder;\n\
  \n Build * builder = new  AdvancedBuilder();\n\n ClientClass c(builder);\n\n delete\
  \ builder;\n\n}\n```\n\n# 3. 实现工厂模式\n\n## 解决方案\n\n工厂方法使用工厂来创建对象，而不需要显式地识别将创建的确切类。工厂模式利用继承机制，将实际的创建过程委托给派生类。工厂经常用于避免代码重复和抽象通用功能。在这种意义上，超类通过使用创建占位符来指定通用行为。然后超类将创建细节委托给客户端提供的派生类。\n\
  \n工厂模式可以被视为抽象工厂模式的简化版本。工厂方法模式负责创建属于一个家族的产，而抽象工厂模式处理多个家族的产。例如，通过工厂方法，你可以产生特定接口（如\
  \ `IAutomobile`）的实现（如 SUV、旅行车、敞篷车等），而通过抽象工厂方法，你可以产生特定工厂接口的实现（例如所有类型的汽车，包括汽车、卡车、房车等）。\n\
  \n在这个示例中，我们有一个基类和两个派生类 `A` 和 `B`，可以根据特定需求选择交换实现。与第 10 页提供的示例唯一区别在于，`OSX_Button`\
  \ 和 `Windows_Button` 代表了通用按钮家族内特定操作系统的特定工厂接口。\n\n代码\n\n```cpp\nnamespace Factory_Method{\n\
  \n // 定义创建对象的接口，\n\n // 但让派生类决定实例化哪个类。\n\n // 工厂方法让类将实例化延迟到\n\n // 派生类。\n\n // 工厂方法可以多次返回同一个实例，\n\
  \n // 或者可以返回子类而不是确切类型的对象。\n\n class  Base{\n\n public:\n\n  virtual  void what_to_do()\
  \ = 0;\n\n      };\n};\n```\n\n\n\n\n\n```cpp\nclass A : public Base {\npublic:\n\
  \  A() { std::cout << \"\\tClass A\" << std::endl; }\n  void what_to_do() { };\n\
  };\n\nclass B : public Base {\npublic:\n  B() { std::cout << \"\\tClass B\" << std::endl;\
  \ }\n  void what_to_do() { };\n}; // // 工厂方法结束\n\nvoid testFactoryMethod() {\n \
  \ using namespace Creational_Patterns::Factory_Method;\n  Base * b = new A();\n\
  \  b->what_to_do();\n  delete b;\n  b = new B();\n  b->what_to_do();\n  delete b;\n\
  }\n```\n\n# 4. 实现原型模式 (Prototype pattern)\n\n## 解决方案\n\n原型模式创建一个原型实例，通过克隆该实例来产生新对象。当克隆的成本低于创建新对象的成本时，这种模式非常有效。\n\
  \n在这个示例中，我们定义了一个类 `Proto`，它包含一个受保护的虚方法 `clone()`，该方法必须由子类实现。不同的原型存储在一个静态数组中，子类必须注册它们自己。\n\
  \n## 代码\n\n```cpp\nnamespace Prototype {\n  // 使用原型实例指定要创建的对象\n  // 类型，并通过拷贝此原型来创建\n\
  \  // 新对象。\n  // 声明一个抽象基类，它指定一个\n  // 纯虚“clone\" 方法，并维护\n  // 一个所有“可克隆”的具体派生类的\n\
  \  // 字典。\n  class Base {\n  public:\n    virtual Base* clone() = 0;\n    virtual\
  \ void doSomething() = 0;\n  };\n\n  class Factory {\n  public:\n    static Base*\
  \ makeBase(int choice);\n  private:\n    static Base* s_prototypes[3];\n  };\n\n\
  \  class A : public Base {\n  public:\n      Base* clone() { return new A; }\n \
  \     void doSomething() {\n        std::cout << \"A is now doing\\n\";\n      }\n\
  \  };\n\n  class B : public Base {\n  public:\n      Base* clone() { return new\
  \ B; }\n      void doSomething() {\n        std::cout << \"B is now doing\\n\";\n\
  \      }\n  };\n\n  Base* Factory::s_prototypes[] = {\n    0, new A, new B\n  };\n\
  \n  Base* Factory::makeBase(int choice) {\n    return s_prototypes[choice]->clone();\n\
  \  }\n  // 原型结束\n}\n\nvoid testPrototype() {\n  using namespace Creational_Patterns::Prototype;\n\
  \  Base * b = Factory::makeBase(1);\n  b->doSomething();\n  delete b;\n}\n```\n\n\
  # 5. 实现单例模式 (Singleton pattern)\n\n## 解决方案\n\n该模式将类的实例化限制为单个对象。在单线程环境中，构造函数通常是私有的，并且只通过检查其是否为空来初始化一次静态实例。\n\
  \n## 代码\n\n```cpp\nnamespace Singleton {\n  // 确保一个类只有一个实例，\n  // 并为其提供一个全局访问点。\n\
  \  // 单例模式在多线程应用中\n  // 必须仔细构建。\n  // 此问题的经典解决方案是\n  // 在类上使用互斥锁，表示对象\n  // 正在被实例化。\n\
  \  class Single {\n  public:\n    static Single * getInstance(void) {\n      if\
  \ (!instance_) {\n        instance_ = new Single();\n      }\n      return instance_;\n\
  \    };\n  private:\n    // 无法调用\n    Single() { std::cout << \"\\tSingle\" << std::endl;\
  \ };\n    static Single * instance_; // 单例实例\n  };\n\n  Single *Single::instance_;\
  \ // 强制实例化\n} // 单例结束\n\nvoid testSingleton() {\n  using namespace Creational_Patterns::Singleton;\n\
  \  Single * s = Single::getInstance();\n  delete s;\n}\n```\n\n## 解决方案 – 双重检查锁定模式\
  \ (DCLP)\n\n在多线程环境中，在访问单例实例之前必须获取 `lock()`，以避免跨线程冲突的风险。这通过下面所示的代码片段实现：该解决方案总是正确的，但它需要始终执行昂贵的锁操作。有时使用的优化方法是所谓的双重检查锁定模式\
  \ (DCLP)，它在尝试获取锁之前会测试值是否为空。\n\n## 代码\n\n```cpp\nSingleton* Singleton::instance()\
  \ {\n  Lock lock; // 获取锁 \n  if (pInstance == 0) {\n    pInstance = new Singleton;\n\
  \  }\n  return pInstance;\n} // 释放锁（通过 Lock 析构函数）\n\nSingleton* Singleton::instance()\
  \ {\n  if (pInstance == 0) { // 第一次测试\n    pInstance = new Singleton;\n  }\n  return\
  \ pInstance;\n}\n```\n\n# 6. 实现对象模式 (Object pattern)\n\n## 解决方案\n\n对象池用于缓存以避免昂贵的重复创建。当在多线程环境中应采用策略时，这种模式被频繁使用。\n\
  \n## 代码\n\n```cpp\nnamespace Object_Pool {\n  // 对象池用于缓存。\n  // 客户端拥有池访问权限。\n  static\
  \ const int num_objects = 3;\n\n  class Object_to_share {\n  public:\n      Object_to_share()\
  \ {\n        std::cout << \"\\tObject shared\" << std::endl;\n      }\n  };\n\n\
  \  class Pool {\n  public:\n      Object_to_share* getObject() {\n        std::cout\
  \ << \"Getting object\" << std::endl;\n      return &objpool_[0];\n      }\n  private:\n\
  \    // 可以动态分配\n    Object_to_share objpool_[num_objects];\n  };\n} // 对象池结束\n\n\
  void testObjectPool() {\n  using namespace Object_Pool;\n  Object_to_share o;\n\
  \  Pool p;\n}\n```\n\n# 结构模式\n\n结构模式通过继承来组合接口。对象的组合允许创建新功能、简化接口、适配异构对象并降低复杂度。\n\n\
  # 7. 实现适配器模式 (Adapter pattern)\n\n## 解决方案\n\n适配器模式通过适当包装器允许不兼容接口之间的操作。在这个示例中，适配器类公继承\
  \ `DesiredInterface` 并私有继承 `LegacyInterface`。`DesiredInterface` 已经实现。\n\n```cpp\n\
  namespace Adapter {\n  // 适配器模式通过将一个类的接口\n  // 转换为客户端期望接口，允许\n  // 不兼容的类协同工作。\n\
  \  class DesiredInterface {\n  public:\n    virtual void make() = 0;\n  };\n\n \
  \ class LegacyInterface {\n  public:\n      LegacyInterface() {\n        std::cout\
  \ << \"\\tCalled legacy\" << std::endl;\n      }\n  };\n\n  // 私有继承旧组件\n  class\
  \ adapter : public DesiredInterface,\n  private LegacyInterface {\n  public:\n \
  \     adapter() : LegacyInterface(){};\n      void make() {\n        std::cout <<\
  \ \"\\tAdapter do something \" << std::endl;\n      }\n  };\n} // adapter 结束\n\n\
  void testAdapter() {\n  using namespace Adapter;\n  adapter * a = new adapter();\n\
  \  a->make();\n  delete a;\n}\n```\n\n```cpp\ntemplate<typename T>\nstruct GenericVehicleAdapter\
  \ : VehicleInterface {\n  GenericVehicleAdapter(T* x) : m(x) { }\n  virtual void\
  \ Run() { return m->Run(); }\n  T* m;\n};\n```\n\n```cpp\nvoid testTemplateAdapter()\
  \ {\n  Shuttle shuttle;\n  GenericVehicleAdapter<Shuttle> vehiclelike(&shuttle);\n\
  }\n```\n\n# 8. 实现桥接模式 (Bridge pattern)\n\n## 解决方案\n\n\n\n\n桥接模式将抽象与其具体实现解耦。通过这种方式，它们可以独立演进。遵循该模式，类本身可以被视为一种特定的实现，而它更泛泛地被视为一个抽象。在\
  \ C++ 中，这种模式有时会与 PIMPL [[4]](#part0000.html__ftn4) 混淆。然而，它们之间存在差异。PIMPL 是一种隐藏实现的方法，目的是打破编译依赖。而桥接模式则是支持多种实现的一种方法。\n\
  \n在这个示例中，`bridge` 类有一个指针 `bridge_imp`，而两个说明性的子类 `a` 和 `b` 通过 `a_imp` 和 `b_impi`\
  \ 类提供具体的实现。\n\n### Code\n\n```cpp\nnamespace Bridge{\n\n// 将抽象与其实现解耦，以便两者\n// 能够独立变化。这与适配器不同，\n\
  //适配器让无关的类共同工作。\n\n class BridgeImp{ // 解耦\npublic:\n    BridgeImp() {};\n\nprotected:\n\
  \    int my_data_;\n};\n\n class Bridge{\n\npublic:\n    Bridge() {};\nprotected:\n\
  \    BridgeImp * imp_;\n};\n\n class AImp : public BridgeImp{ // 实现层级\npublic:\n\
  \    AImp() { my_data_ = 1; }// 你在这里需要的\n};\n\nclass A : public Bridge{ // 层级\n\
  public:\n    A(){\n        imp_ = new AImp();\n        std::cout << \"\\tcreated\
  \ a\" << std::endl;\n    };\n    ~A(){\n        delete imp_;\n        std::cout\
  \ << \"\\tdeleted a\" << std::endl;\n    }\n};\n\nclass BImp : public BridgeImp{\
  \ // 实现层级\npublic:\nBImp() { my_data_ = 2; }; // 你在这里需要的\n};\n\nclass B : public\
  \ Bridge{ // 层级\npublic:\n    B() {\n        imp_ = new BImp();\n        std::cout\
  \ << \"\\tcreated b\" << std::endl;\n    };\n    ~B(){\n        delete imp_;\n \
  \       std::cout << \"\\tdeleted b\" << std::endl;\n    }\n};\n\n}; // end Bridge\n\
  \nvoid testBridge()\n{\n using namespace Structural_Patterns::Bridge;\n A bridgeA;\n\
  \ B bridgeB;\n}\n```\n\n# 9. 实现组合模式\n\n## Solution\n\n组合模式用于将具有共同行为的多个对象组合，使得它们可以像单个对象一样被操作。一个典型的用法是树形结构的对象组合。\n\
  \n在这个示例中，`Component` 类根据一个纯虚方法 `traverse` 实现，该方法随后又由子类 `Leaf` 和子类 `Composite` 实现。此外，`Composite`\
  \ 维护一个指针向量，`Components` 被插入到其中。该向量被用于遍历整个结构。\n\n### Code\n\n```cpp\nnamespace Composite{\n\
  \n // 将对象组合成树形结构，以表示\n // 整体与部分的层级关系。递归组合\n class Component{\npublic:\n  virtual\
  \ void traverse() = 0; // 纯虚\n};\n\n class Leaf : public Component{\nprivate:\n\
  \  int value_; // 无论你在这里需要的\npublic:\n    Leaf(int val) : value_(val) {};\n  void\
  \ traverse() { std::cout << value_ << \" \"; }\n};\n\n class Composite : public\
  \ Component{\nprivate:\n    std::vector< Component * > children_;\n  typedef std::vector<\
  \ Component * >::const_iterator comp_const_it;\npublic:\n  void add(Component *\
  \ e) { children_.push_back(e); };\n void traverse()\n             {\n  comp_const_it\
  \ it = children_.begin();\n  comp_const_it it_end = children_.end();\n  for (; it\
  \ != it_end; ++it)\n                    (*it)->traverse();\n }\n}; // end composite\n\
  \nvoid testComposite(){\n using namespace Structural_Patterns::Composite;\n Leaf\
  \ l1(1);\n Leaf l2(2);\n Composite c;\n c.add(&l1); c.add(&l2);\n c.traverse();\n\
  }\n```\n\n# 10. 实现装饰器模式\n\n## Solution\n\n装饰器模式用于为对象已有的方法添加额外的行为。在某些情况下，现有的行为会被完全覆盖。这些额外的行为可以是永久的、瞬时的，或在运行时动态添加的。\n\
  \n在这个示例中，`A_and_X` 继承自 `A` 并实现了虚方法 `make()`。\n\n### Code\n\n```cpp\nnamespace Decorator{\n\
  \n // 动态地为对象附加职责\n // 装饰器为功能扩展提供了灵活的\n // 子类方式。\n class A{\npublic:\n  A() { std::cout\
  \ << \"\\tA\" << std::endl; }\n virtual void make(void) { std::cout << \"\\t making\
  \ A\" << std::endl; }\n};\n\n // 装饰是私有的；\n class A_and_X : public A{\npublic:\n\
  \  void make(void) {\n  A::make();\n  make_x();\n  };\n private:\n  void make_x()\
  \ {\n  std::cout << \"\\t making X\" << std::endl;\n  };\n};\n```\n\n# 1. 实现外观模式\n\
  \n## Solution\n\n外观模式用于为大型代码段提供简化的接口，以便使用户可以关注所需的功能。这种模式经常用于减少外部代码对库内部细节的依赖。\n\n\
  在这个示例中，三个类 `A`、`B`、`C` 被一个唯一的类 `facade` 包装，它简化了对这些类的访问。\n\n### Code\n\n```cpp\n\
  namespace Facade{\n\n // 外观对象为子系统中的许多\n // 接口提供单一接口。\n class A{\npublic:\n  A()\
  \ { std::cout << \"\\t A\" << std::endl; }\n  void make() { std::cout << \"\\t A\"\
  \ << std::endl; }\n};\n\n class B{\npublic:\n  B() { std::cout << \"\\t B\" << std::endl;\
  \ }\n  void make() { std::cout << \"\\t B\" << std::endl; }\n};\n\n class C{\npublic:\n\
  \  C() { std::cout << \"\\t C\" << std::endl; }\n  void make() { std::cout << \"\
  \\t C\" << std::endl; }\n};\n\n class Facade{\npublic:\n    Facade() { a_.make();\
  \ b_.make(); c_.make(); }\nprivate:\n  A a_;\n  B b_;\n  C c_;\n}; //end facade\n\
  \nvoid testFacade(){\n using namespace Structural_Patterns::Facade;\n Facade f;\n\
  }\n```\n\n# 12. 实现重量级模式\n\n## Solution\n\n重量级模式用于减少创建大量相似对象的成本。这在性能关键的情况下尤为重要。\n\
  \n在这个示例中，`Icon` 是一个轻量级类，存储在 `FlyweightFactory` 包含的向量中。这种方式，特定的图标只是指向被系统中相同图标实例使用的特定对象的指针。\n\
  \n### Code\n\n```cpp\nnamespace Flyweight{\n\n// 重量级模式共享对象并减少\n // 内存成本并提高性能\n //\n\
  \ // 客户端不应直接实例化重量级对象，\n // 应该专门从重量级工厂对象\n // 获取以正确共享。\n class Icon { // 不要为每个 Icon\
  \ 拥有一个“巨大的”对象\npublic:\n    Icon(unsigned int i) : shared_name_(i) {};\n  unsigned\
  \ int getName(){ return shared_name_; }\nprivate:\n  unsigned int shared_name_;\n\
  };\n\n class FlyweightFactory{\npublic:\n  static Icon * getIcon(unsigned int name)\n\
  \            {\n              std::vector<Icon *>::const_iterator it, it_end;\n\
  \              it = icons_.begin();\n              it_end = icons_.end();\n  for\
  \ (; it != it_end; ++it)\n  if ((*it)->getName() == name){\n  std::cout << \"\\\
  tFlyweight -> 重用名为=\" << name << \" 的图标\" << std::endl;\n  return *it;\n  }\n  \
  \           }\n             icons_.push_back(new Icon(name));\n  std::cout << \"\
  \\t 创建了名为=\" << name << \" 的新图标\" << std::endl;\n  return icons_.back();\n }; //\
  \ 一个示例：获取分配的 Icon\n\nprivate:\n  static std::vector<Icon *> icons_;\n };\n```\n\n\
  \n\n\n\n```cpp\nit = icons_.begin();\nit_end = icons_.end();\nfor (; it != it_end;\
  \ ++it){\n  delete *it;\n}\n}\nprivate:\n  static std::vector<Icon *>icons_;\n};\n\
  std::vector<Icon *> FlyweightFactory::icons_;\n\n// 强制分配\n\n}; // end Flyweight\n\
  \nvoid testFlyweight(){\nusing namespace Structural_Patterns::Flyweight;\n  FlyweightFactory\
  \ * fw = new FlyweightFactory();\n  fw->getIcon(0);\n  fw->getIcon(0);\n  delete\
  \ fw;\n}\n```\n\n# 13. 实现代理模式 (Proxy pattern)\n\n## 解决方案\n\n代理模式用于在需要额外功能的情况下对对象的访问进行拦截。这些情况包括但不限于：访问控制、减少操作复杂性、网络访问、文件系统访问或大内存块访问，以及更通用的资源访问。\n\
  \n在本示例中，使用 `ImageProxy` 类来访问图像，该图像可能位于远程文件系统中。\n\n### 代码实现\n\n```cpp\nnamespace\
  \ Proxy{\n // 代理提供一个替代者来提供对对象的访问。\n // 例如：支票或银行汇票是账户资金的代理。\n // 装饰器模式（Decorator）和代理模式（Proxy）的目的不同，\n\
  \ // 但结构相似。两者都描述了如何为另一个对象提供\n // 间接层，并且实现类保留了对对象的引用，\n // 向该对象转发请求（委托模式）。\n class\
  \ ImageProxy{\nprivate:\n  unsigned int name_;\npublic:\n  ImageProxy(unsigned int\
  \ name) : name_(name)\n  {\n    std::cout << \"\\tCreating image name=\" << name_\
  \ << std::endl;\n  };\n  ~ImageProxy()\n  {\n    std::cout << \"\\tDelete image\
  \ name=\" << name_ << std::endl;\n  };\n  void draw()\n  {\n    std::cout << \"\\\
  tDraw image name=\" << name_ << std::endl;\n  };\n};\n class Image{\nprivate:\n\
  \  ImageProxy * img_proxy_;\n  static unsigned int name_;\npublic:\n  Image() :\
  \ img_proxy_(0) {}; ~Image() { delete img_proxy_; };\n  void draw()\n  {\n    if\
  \ (!img_proxy_)\n      img_proxy_ = new ImageProxy(name_++);\n    img_proxy_->draw();\n\
  \  }\n}; // 此处仅用于示例\nunsigned int Image::name_ = 0;\n}; // end Proxy\nvoid testProxy()\n\
  {\nusing namespace Structural_Patterns::Proxy;\nImage img;\nimg.draw();\n}\n```\n\
  \n# 行为模式 (Behavioral patterns)\n\n行为模式用于描述对象之间的交互和通信。行为模式也用于处理每个对象的内部状态。\n\n# 14.\
  \ 实现责任链模式 (Chain of responsibility)\n\n## 解决方案\n\n责任链模式将一系列命令委托给一个处理对象链。对象可以被动态地添加到列表中。在本示例中，`Base`\
  \ 类维护了一个对象列表。派生类可以注册自己，并且还可以提供 `handle()` 方法来处理详细信息。\n\n### 代码实现\n\n```cpp\nnamespace\
  \ Chain_Of_Responsability{\n // 解耦请求的发送者和接收者\n // 让多个对象有机会处理该请求\n class Base\n {\n\
  public:\n  Base(unsigned int name) : name_(name), next_(0) {};\n  void add(Base*\
  \ n) // 添加到链\n  {\n    if (next_)\n      n->setPointer(next_);\n    next_ = n;\n\
  \  }\n  void setPointer(Base * p) { next_ = p; }\n  virtual void handle(unsigned\
  \ int who){\n    if (who == name_)\n      std::cout << \"\\t\" << name_ << \" is\
  \ the one\" << std::endl;\n    if (next_)\n      next_->handle(who);\n  }\n}\nprotected:\n\
  \  unsigned int name_;\nprivate:\n  Base * next_;\n};\n class H1 : public Base{\n\
  public:\n  H1(unsigned int name) : Base(name) { };\n  void handle(unsigned int who){\n\
  \    std::cout << \"\\tHandler H1\" << std::endl;\n    Base::handle(who);\n  }\n\
  };\n class H2 : public Base{\npublic:\n  H2(unsigned int name) : Base(name) { };\n\
  \  void handle(unsigned int who){\n    std::cout << \"\\tHandler H2\" << std::endl;\n\
  \    Base::handle(who);\n  }\n};\n}; // end Chain_Of_Responsability\nvoid testChainOfResponsability(){\n\
  using namespace Behavioural_Patterns::Chain_Of_Responsability;\n  H2 h2(2);\n  H1\
  \ h1(1);\n  Base b(0);\n  b.add(&h1);\n  b.add(&h2);\n  h2.handle(2);\n}\n```\n\n\
  # 15. 实现命令模式 (Command pattern)\n\n## 解决方案\n\n命令模式用于创建封装了行为和状态的对象。当我们想要委托一系列调用，而不需要显式地知道涉及的参数或特定方法时，经常需要这种模式。在本示例中，`Command`\
  \ 类有一个构造函数，在初始化时传入 `Person` 的名称以及使用的特定命令，即 `talk()` 和 `listen()`。\n\n### 代码实现\n\n\
  ```cpp\nnamespace Command{\n // 命令模式将调用操作的对象与执行该操作的对象解耦。\n class Person;\n class\
  \ Command\n{\nprivate:\n  Person *object_;\n  void(Person::*)method_();\npublic:\n\
  \  Command(Person *o = 0, void(Person::*)m() = 0) : object_(o), method_(m) {}\n\
  \  void execute()\n  {\n    (object_->*method_)();\n  }\n};\n class Person\n{\n\
  private:\n  std::string name_;\n  Command cmd_;\npublic:\n  Person(std::string n,\
  \ Command c) : name_(n), cmd_(c) {}\n  void talk()\n  {\n    std::cout << name_\
  \ << \" is talking\" << std::endl;\n    cmd_.execute();\n  }\n  void listen()\n\
  \  {\n    std::cout << name_ << \" is listening\" << std::endl;\n  }\n};\n}; //\
  \ end command\nvoid testCommand()\n{\nusing namespace Behavioural_Patterns::Command;\n\
  Person Angela(\"angela\", Command());\nPerson Willy(\"willy\", Command(&Angela,\
  \ &Person::listen));\nWilly.talk();\n}\n```\n\n# 16. 实现解释器模式 (Interpreter pattern)\n\
  \n## 解决方案\n\n解释器模式用于实现一种特殊语言。其思想是为语法中的每个符号创建一个类，用于定义解释器。在本示例中，语言非常简单，输入来自字符流。\n\n\
  ### 代码实现\n\n```cpp\nnamespace Interpreter{\nclass Interpreter\n{\npublic:\n  template<typename\
  \ itr>\n  static void runInterpreter(itr from, itr to)\n  {\n    for (itr i = from;\
  \ i != to; ++i)\n    {\n      switch (*i)\n      {\n        case 'h':\n        \
  \  std::cout << \"Hello\";\n          break;\n        case 'w':\n          std::cout\
  \ << \"world\";\n          break;\n        case ' ':\n          std::cout << ' ';\n\
  \          break;\n        case 'n':\n          std::cout << endl;\n          break;\n\
  \        default:\n          std::cout << \"Unknown command\";\n      }\n    }\n\
  \  }\n};\n};\n```\n\n\n\n\n\n```cpp\n // 内部结构。\n\n class Stack\n\n {\n\n private:\n\
  \n  int items_[100]; // 应该是动态的\n\n  int sp_; // 当前项指针          \n\n public:\n\n\
  \  friend class Iterator; // 声明为友类以访问迭代器\n\n           Stack() { sp_ = -1; }\n\n\
  \  void push(int in) { items_[++sp_] = in; }\n\n  int pop() { return items_[sp_--];\
  \ }\n\n  bool isEmpty() { return (sp_ == -1); }\n\n };\n\n class Iterator{\n\n private:\n\
  \n  const Stack &stk_; // 访问结构\n\n  int index_;\n\n public:\n\n  Iterator(const\
  \ Stack &s) : stk_(s), index_(0)\n\n {} // 初始化迭代器\n void operator++()\n\n      \
  \         {\n\n                                     ++index_;\n\n              }\n\
  \n bool operator()() // 获取结构末尾\n\n                                             \
  \ {\n  return index_ != stk_.sp_ + 1;\n\n               }\n\n int operator *()\n\
  \n              {\n\n  return stk_.items_[index_];\n\n              }\n };\n\n bool\
  \ operator == (const Stack &s1,\n\n  const Stack &s2)\n\n {\n\n  Iterator it1(s1),\
  \ it2(s2);\n\n for (; it1(); ++it1, ++it2)\n  if (*it1 != *it2)\n  return false;\n\
  \n return true;\n\n }\n\n}; // 结束 Iterator\n void testIterator()\n\n{\n\n using\
  \ namespace Behavioural_Patterns::Iterator;\n\n Stack s;\n\n Iterator it(s);\n\n\
  \ s.push(10);\n\n s.push(20);\n\n while (it())\n\n {\n\n std::cout << *it << ' ';\n\
  \n                 it++;\n\n }\n}\n```\n\n值得注意的是，在 C++ 中，迭代器通常通过使用指针语义来实现，并结合经典的解引用、递增、递减和指针比较操作，以指示何时到达容器的末尾。我们已经在这段代码段中使用过迭代器：\n\
  \n```cpp\nstd::vector<Icon *>::const_iterator it, it_end;\n\nit = icons_.begin();\n\
  \nit_end = icons_.end();\n\nfor (; it != it_end; ++it){\n if ((*it)->getName() ==\
  \ name){\n              std::cout <<\n  \"\\tFlyweight -> reusing an icon=\"\n <<\
  \ name << std::endl;\n  return *it;\n }\n}\n```\n\n# 18. 实现中者模式\n\n## 解决方案\n\n中者模式允许类之间进行低松耦合的交互。每个类都不需要感知其他类逻辑中过多的细节，而这些细节仅对中者暴露。对象不再需要直接通信，而是利用中者，从而减少了耦合效应。\n\
  \n在这个示例中，类列表（list）充当节点之间的中者。\n\n```cpp\nnamespace Mediator{\n\n // 定义一个封装了对象\n\n\
  \ // 之间如何交互的对象。促进了低松耦合\n\n //\n\n // 例如，一个列表在节点对象之间进行调介\n\n class Node {\n\n private:\n\
  \n  int v_;\n\n public:\n\n               Node(int v) : v_(v){};\n\n  int getValue()\
  \ { return v_; }\n\n };\n\n class List { // 调介节点\n\n private:\n\n              std::vector<Node\
  \ *> values_;\n\n  typedef std::vector<Node *>::const_iterator const_it;\n\n public:\n\
  \n  void add(Node *n){ values_.push_back(n); }\n\n  void traverse()\n\n        \
  \       {\n  const_it it1 = values_.begin();\n  const_it it2 = values_.end();\n\
  \  for (; it1 != it2; it1++)\n std::cout << \" \" << (*it1)->getValue();\n\n   \
  \           std::cout << std::endl;\n\n             };\n\n}; // 结束中者\nvoid testMediator()\n\
  \n{\n\n using namespace Behavioural_Patterns::Mediator;\n\n Node n1(1), n2(2), n3(3);\n\
  \n List l; l.add(&n1); l.add(&n2); l.add(&n3);\n\n l.traverse();\n}\n```\n\n# 19.\
  \ 实现备忘子模式\n\n## 解决方案\n\n备忘子（Memento）用于存储和恢复对象的状态。这通常用于撤销操作或序列化。在示例中，一个备忘子类用于存储一个值，该值由客户端保存并被继继恢复。复杂的实现可以使用\
  \ vector 来存储多个值。\n\n```cpp\nnamespace Memento{\n\n // 当客户端需要对源对象进行检查点时，\n\n // 向源对象请求一个备忘子。如果\n\
  \n // 客户端随后需要“回滚”源\n\n // 对象的状态，它会将备忘子交回\n\n // 源对象以恢复。\n\n class Memento{\n\n public:\n\
  \n              Memento(int val) : value_(val) {};\n\n  int getValue() { return\
  \ value_; };\n\n private:\n\n  friend class Client;\n\n  int value_;\n\n }; class\
  \ Client{ // 客户端\n\n public:\n\n              Client(int value) : value_(value)\
  \ {};\n\n  void increment() { ++value_; } //状态改变\n\n  int get_value() { return value_;\
  \ }\n\n Memento * create_memento() {\n\n  return new Memento(value_);\n\n      \
  \       }\n\n  void restore_from_memento(Memento * m) {\n\n  value_ = m->value_;\n\
  \n             }\n\n private:\n\n  int value_;\n\n }; // 结束备忘子\nvoid testMemento()\n\
  \n{\n\n using namespace Behavioural_Patterns::Memento;\n\n Client c(20);\n\n Memento\
  \ * m = c.create_memento();\n\nstd::cout << m->getValue();\n\n delete m;\n}\n```\n\
  \n# 20. 实现观察者模式\n\n## 解决方案 \n\n观察者模式实现了发布者/订阅者交互，注册的观察者通过发布者通知事件。这种模式经常用于分布式事件处理。在这个示例中，观察者通过\
  \ `update` 方法实现，而该方法由发布者进行通知。请注意，新的观察者可以动态挂载。\n\n```cpp\nnamespace Observer{\n\n\
  \ // 当对象改变状态时，\n\n // 所有的观察者被通知并自动 自动更新。\n\n class Observ{\n\n public:\n\n  virtual\
  \ void update(int value) = 0;\n\n };\n\n class AObserv : public Observ{\n\n public:\n\
  \n  void update(int value)\n\n               {\nstd::cout << \"\\ta seeing \" <<\n\
  \  value << std::endl;\n\n             }\n };\n\n class BObserv : public Observ{\n\
  \n public:\n\n  void update(int value)\n\n               {\nstd::cout << \"\\tb\
  \ seeing \" <<\n  value << std::endl;\n\n             }\n };\n\n class Subject{\n\
  \n private:\n\n  int value_;\n\n              std::vector<Observ *> observers_;\n\
  \n  typedef std::vector<Observ *>::const_iterator const_it;\n\n public:\n\n  void\
  \ set_value(int value) {\n\nvalue_ = value; notify();\n\n             }\n\n // 挂载观察者\n\
  \n  void attach(Observ * o) {\n\n                             observers_.push_back(o);\n\
  \n             }\n\n  void notify()\n\n               {\n  const_it it = observers_.begin(),\n\
  \n              it_end = observers_.end();\n\n  for (; it != it_end; ++it)\n\n \
  \             (*it)->update(value_);\n\n             }\n\n };\n\n}; // 结束观察者\nvoid\
  \ testObserver()\n\n{\n\n using namespace Behavioural_Patterns::Observer;\n\n AObserv\
  \ a;\n\n BObserv b;\n\n Subject s;\n\n              .attach(&a); s.attach(&b);\n\
  \n s.set_value(3);\n\n}\n```\n\n# 21. 实现状态模式\n\n## 解决方案\n\n状态模式用于允许对象根据内部状态改变。例如，这种模式可以在运行时更改对象的状态。在这个简单的示例中，状态类根据两个虚方法\
  \ `on(..)` 和 `off(..)` 实现，这两个方法分别在 `OFF()` 和 `ON()` 类中实现。当前状态在 tool 类中以指针的形式维护。\n\
  \n```cpp\nnamespace State {\n\n // 允许对象在其内部状态改变时 // 时改变行为。对象看起来像是\n\n // 改变了类。\n\
  \n class tool{\n\n private:\n\n  class state * current_;\n\n public:\n\n  void set_current(state\
  \ * s) { current_ = s; };\n\n  void on();\n\n  void off();\n\n };\n\n class state{\n\
  \n public:\n\n  virtual void on(tool * t){\n\nstd::cout << \" state on\\n\";\n\n\
  \ }\n\n  virtual void off(tool *t){\n\nstd::cout << \" state off\\n\";\n\n }\n\n\
  \ };\n\n void  tool::on()\n\n {\n\nstd::cout << \"on is the state\";\n\n       \
  \       current_->on(this);\n\n }\n\n void  tool::off();\n```\n\n\n\n\n\n```cpp\n\
  {\n  std::cout << \"off is the state\";\n  current_->off(this);\n}\n\nclass OFF\
  \ : public state { // 切换状态 OFF->on\npublic:\n  void on(tool * t);\n};\n\nclass ON\
  \ : public state { // 切换状态 off->ON\npublic:\n  void off(tool * t) {\n    std::cout\
  \ << \"\\tgoing from ON to OFF\" << std::endl;\n    t->set_current(new OFF());\n\
  \    delete this;\n  }\n};\n\nvoid OFF::on(tool * t) {\n  std::cout << \"\\tgoing\
  \ from OFF to ON\" << std::endl;\n  t->set_current(new ON());\n  delete this;\n\
  }\n}; // end State\n\nvoid testState() {\n  using namespace Behavioural_Patterns::State;\n\
  \  Tool * t = new Tool();\n  ON * on = new ON();\n  t->set_current(on);\n  on->off(t);\n\
  \  delete t;\n}\n```\n\n# 22. 实现策略模式 (Strategy pattern)\n\n## 解决方案\n\n策略模式允许在运行时针对特定行为选择特定的算法，前提是为该功能提供了一类相似的算法。\n\
  \n在这个示例中，我们有两个类 `algo1` 和 `algo2`，它们派生自父类 `strategy`。\n\n```cpp\nnamespace Strategy\
  \ {\n  // 策略使得算法可以独立于使用它的客户端而发生变化。\n  enum ALGO { ALGO1, ALGO2 };\n  class Strategic\
  \ {\n  public:\n    virtual void do_it() = 0;\n  };\n  class Algo1 : public Strategic\
  \ {\n    void do_it() {\n      std::cout << \"\\tcalling algo1\" << std::endl;\n\
  \    }\n  };\n  class Algo2 : public Strategic {\n    void do_it() {\n      std::cout\
  \ << \"\\tcalling algo2\" << std::endl;\n    }\n  };\n  class Testbed {\n  public:\n\
  \      Testbed() : strategy_(NULL) {};\n      void choose_strategy(unsigned int\
  \ what) {\n        Strategic * tmp;\n        switch (what) {\n          default:\n\
  \          case ALGO1:\n            tmp = new Algo1();\n            delete strategy_;\n\
  \            strategy_ = tmp;\n            break;\n          case ALGO2:\n     \
  \       tmp = new Algo2();\n            delete strategy_;\n            strategy_\
  \ = tmp;\n            break;\n        }\n        strategy_->do_it();\n      }\n\
  \      ~Testbed() {\n        if (strategy_)\n          delete strategy_;\n     \
  \ }\n  private:\n    Strategic * strategy_;\n  };\n} // end Strategy\n\nvoid testStrategy()\
  \ {\n  using namespace Behavioural_Patterns::Strategy;\n  Testbed tb;\n  tb.choose_strategy(1);\n\
  }\n```\n\n# 23. 实现模板方法模式 (Template pattern)\n\n## 解决方案\n\n模板模式允许通过抽象类定义算法的骨架，而子类负责提供具体的行为。“template”一词与\
  \ C++ 中的模板编程没有直接关系。\n\n在这个示例中，`algorithm_base` 拥有 `a()`、`b()` 和 `c()`，并根据两个虚拟方法\
  \ `X()` 和 `Y()` 实现，这些方法将由派生类进行相应的实现。\n\n```cpp\nnamespace Template {\n  // 定义算法的骨架\n\
  \  // 将某些步骤留给子类\n  class AlgorithmBase {\n    void a() { std::cout << \"\\tA\" <<\
  \ std::endl; }\n    void b() { std::cout << \"\\tB\" << std::endl; }\n    void c()\
  \ { std::cout << \"\\tC\" << std::endl; }\n    virtual void X() = 0;\n    virtual\
  \ void Y() = 0;\n  public:\n    void execute() {\n      a();\n      b();\n     \
  \ c();\n    }\n  };\n  class AlgorithmRefinementFirst : public AlgorithmBase {\n\
  \    void X() { std::cout << \"\\tX1\" << std::endl; }\n    void Y() { std::cout\
  \ << \"\\tY1\" << std::endl; }\n  };\n  class AlgorithmRefinementSecond : public\
  \ AlgorithmBase {\n    void X() { std::cout << \"\\tX2\" << std::endl; }\n    void\
  \ Y() { std::cout << \"\\tY2\" << std::endl; }\n  };\n} // end Template\n\nvoid\
  \ testTemplate() {\n  using namespace Behavioural_Patterns::Template;\n  AlgorithmBase\
  \ * a = new AlgorithmRefinementFirst();\n  a->execute();\n  delete a;\n  a = new\
  \ AlgorithmRefinementSecond();\n  a->execute();\n  delete a;\n}\n```\n\n# 24. 实现访问者模式\
  \ (Visitor pattern)\n\n## 解决方案\n\n访问者模式允许以分层的方式访问对象，而无需考虑内部细节。通过这种方式，算法可以从其操作的对象分离出来。在这个示例中，`Parent`\
  \ 包含一个 `parent_elements` 指针向量和一个虚拟方法 `accept()`，该方法将由子类实现。这里提供了两种不同的访问者实现。\n\n```cpp\n\
  namespace Visitor {\n  // 表示要对对象结构执行的操作。\n  // 操作是在不污染对象的情况下执行的。\n  // 这种分离的实际结果是可以在不修改现有结构\n\
  \  // 的情况下为其添加新操作。\n  // 本质上，访问者允许在不修改类本身的情况下\n  // 向一组类中添加虚拟函数；\n  class A;\n \
  \ class B;\n  class Parent;\n  // 访问者接口\n  struct parent_visitor {\n    virtual\
  \ void visit(A &a) = 0;\n    virtual void visit(B &b) = 0;\n    virtual void visit(C\
  \ &c) = 0;\n    virtual void visit(Parent &p) = 0;\n    virtual ~parent_visitor()\
  \ {};\n  };\n  // 层次结构元素的接口\n  struct parent_element {\n    virtual void accept(const\
  \ parent_visitor& v) = 0;\n    virtual ~parent_element() {};\n  };\n  // 类 A\n \
  \ class A : public parent_element {\n  public:\n    A() { std::cout << \"\\t A\"\
  \ << std::endl; }\n    void accept(const parent_visitor& v) override {\n      v.visit(*this);\n\
  \    }\n  };\n  // 类 B\n  class B : public parent_element {\n  public:\n    B()\
  \ { std::cout << \"\\t B\" << std::endl; }\n    void accept(const parent_visitor&\
  \ v) override {\n      v.visit(*this);\n    }\n  };\n  // 类 C\n  class C : public\
  \ parent_element {\n  public:\n    C() { std::cout << \"\\t C\" << std::endl; }\n\
  \    void accept(const parent_visitor& v) override {\n      v.visit(*this);\n  \
  \  }\n  };\n  // 层次结构中所有对象的容器\n  class Parent {\n  public:\n    typedef std::vector<parent_element*>::const_iterator\
  \ const_parent_collection_it;\n    typedef std::vector<parent_element*> parent_collection;\n\
  \    parent_collection& getElements() {\n      return elements_;\n    }\n    Parent()\
  \ {\n      elements_.push_back(new A());\n      elements_.push_back(new B());\n\
  \      elements_.push_back(new C());\n    }\n    ~Parent() {\n      for (const_parent_collection_it\
  \ it = elements_.begin(); it != elements_.end(); ++it) {\n        delete *it; //\
  \ 调用析构函数\n      }\n    }\n  private:\n    parent_collection elements_;\n  };\n \
  \ // 第一种访问者实现\n  class parent_model_one_visitor : public parent_visitor {\n  public:\n\
  \    void visit(A &a) const override {\n      std::cout << \"\\t A, model one\"\
  \ << std::endl;\n    }\n    void visit(B &b) const override {\n      std::cout <<\
  \ \"\\t B, model one\" << std::endl;\n    }\n    void visit(C &c) const override\
  \ {\n      std::cout << \"\\t B, model one\" << std::endl;\n    }\n    void visit(Parent\
  \ &p) const override {\n      parent_collection& elements = p.getElements();\n \
  \     for (Parent::const_parent_collection_it it = elements.begin(); it != elements.end();\
  \ ++it) {\n        // 调用访问者回调\n        (*it)->accept(*this);\n      }\n    }\n \
  \ };\n  // 第二种具体的访问者实现\n  class parent_model_two_visitor : public parent_visitor\
  \ {\n  public:\n    void visit(A &a) const override {\n```\n\n\n\n\n\n```cpp\n \
  \   std::cout << \"\\tvisit A, model two\" << std::endl;\n  }\n\n  void visit(B\
  \ &b) const {\n    std::cout << \"\\tvisit B, model two\" << std::endl;\n  }\n\n\
  \  void visit(C &c) const {\n    std::cout << \"\\tvisit B, model two\" << std::endl;\n\
  \  }\n\n  void visit(Parent &p) const {\n    Parent::parent_collection& elements\
  \ = p.getElements();\n    for (Parent::const_parent_collection_it it = elements.begin();\
  \ it != elements.end(); ++it) {\n      // calling the visitor callback\n      (*it)->accept(*this);\n\
  \    }\n  }\n};\n}; // end visitor\n\nvoid testVisitor()\n{\n  using namespace Behavioural_Patterns::Visitor;\n\
  \  Parent p;\n  parent_element_visitor * pv = new parent_model_one_visitor();\n\
  \  pv->visit(p);\n  delete pv;\n  pv = new parent_model_two_visitor();\n  pv->visit(p);\n\
  \  delete pv;\n}\n```\n\n## 关于作者\n\n一位丰富的数据挖掘工程师，对消费者领域的科技与创新充满热情。对大规模数据集上的搜索和机器学习感兴趣，特别关注查询分析、建议、实体、个性化、新鲜度和通用排名。Antonio\
