  \ int LIS(const std::vector<unsigned int> & v)\n{\n  unsigned int max;\n  unsigned\
  \ int n = v.size();\n  std::vector<unsigned int> maxHere(n, 0);\n  for (unsigned\
  \ int k = 0; k < n; ++k) {\n    max = 0;\n    for (unsigned int j = 0; j < k; ++j)\n\
