  \ 元素的 `Find` 操作需要 ![](img/00147.jpeg) 的时间。\n\n## 19 在 DAG 中寻找最长路径\n\n对于普通图，寻找最长路径是一个\
  \ NP hard 问题。但如果我们有一个有向无环图 (DAG)，我们可以轻松地计算拓扑排序。然后对于每个节点，我们通过当前顶点的距离更新其相邻节点的距离。\n\
  \n## 解决方案\n\n这段代码使用了之前定义的拓扑排序，然后从源开始添加权重\n\n## 代码\n\n```cpp\nvoid longestPathDAG(const\
  \ Graph & g,\n                   const Graph::NodeID id,\n                   std::vector<Graph::NodeID>&\
  \ distance) {\n    std::stack<Graph::NodeID> stk;\n    distance = std::vector<Graph::NodeID>(g.numNodes(),\n\
  \                               std::numeric_limits<Graph::NodeID>::max());\n  \
  \  std::vector<bool> visited(g.numNodes(), false);\n    distance[id] = 0;\n    for\
  \ (Graph::NodeID id = 0; id < g.numNodes(); ++id)\n        if (!visited[id])\n \
  \           topologicalSortUtil(g, visited, stk);\n    while (!stk.empty()) {\n\
  \        const Graph::NodeID id = stk.top();\n        if (distance[id] != std::numeric_limits<Graph::NodeID>::max())\
  \ {\n            for (const auto & e : g.edges(id)) {\n                if (distance[e.v]\
  \ > distance[id] + e.w)\n                    distance[e.v] = distance[id] + e.w;\n\
  \            }\n        }\n        stk.pop();\n    }\n    for (Graph::NodeID id\
  \ = 0; id < g.numNodes(); ++id)\n        if (distance[id] == std::numeric_limits<Graph::NodeID>::max())\n\
  \            std::cout << \"id=\" << id << \" has infinity\" << std::endl;\n   \
  \     else\n            std::cout << \"id=\" << id << \" has distance=\" << distance[id]\
  \ << std::endl;\n}\n```\n\n## 复杂度\n\n时间复杂度为 ![](img/00145.jpeg)，因为我们使用了并查查找数据结构来维护集合信息，其中对\
