  \ ![](img/043.jpeg)工人 ![](img/046.jpeg) 和 ![](img/047.jpeg)，我们想要最小化总成本函数 ![](img/048.jpeg)。注意成本矩阵可以如下例所示表示：\n\
  \n![](img/049.jpeg)\n\n给定这种表示，该问题可以作为最小流的一个特例实例来解决，解答留作练习题。\n\n## 29 寻找欧拉回路\n\n\n\
  \n\n欧拉路径是图中的一种访问，它恰好访问每个 `edge` 一次。如果存在这样一条路径，则该图被称为半欧拉图或可遍历图。欧拉回路是一个起点和终点同一个 `vertex`\
  \ 的欧拉访问。这些问题最早由莱昂哈德·欧拉（Leonhard Euler）为了解决著名的柯尼格堡七桥问题而提出。\n\n![截至 2006 年 7 月 27\
  \ 日 17:12 版本的缩略图](img/00250.jpeg)\n\n位于普鲁士的 `Königsberg` 城市建立在 `Pregel river` 的两侧，有两个大岛通过七座桥相互连接与陆地相连。当时的问题是找到一条穿过城市的路径，使得每座桥都通过且仅通过一次。欧拉证明了该问题无解，这个问题被认为是引入图论这一新学科的第一个案例，而图论正是本书的主题。\n\
  \n## 解决方案\n\n乍一看，这个问题似乎与哈密顿路径相似。但它并非如此。事实上，可以在线性时间内计算出解。\n\n我们注意到，如果满足以下条件，则图具有欧拉回路：(a)\
  \ 所有非零度顶点都是连通的；b) 所有顶点的度均为偶数。此外，如果满足以下两个条件，图遵循欧拉路径：(a) 所有非零度顶点都是连通的；(b) 有零或两个顶点为奇度，且所有其他顶点均为偶数。这些属性的证明留作练习题。\n\
  \n## 代码\n\n```cpp\nbool isConnected(const Graph & g)\n{\n    std::vector<bool> visited(g.numNodes(),\
  \ false);\n    std::vector<Graph::NodeID> color(g.numNodes(), false);\n    std::vector<Graph::NodeID>\
  \ timing(g.numNodes(), 0);\n    Graph::NodeID id;\n    for (id = 0; id < g.numNodes();\
  \ ++id)\n        if (g.outdegree(id))\n            break;\n    if (id == g.numNodes())\n\
  \        return true;\n    dfsUtil(g, id, visited);\n    for (id = 0; id < g.numNodes();\
  \ ++id)\n        if (visited[id] == false && g.outdegree(id))\n            return\
  \ false;\n    return true;\n}\n\nenum euler { notEulerian, SemiEulerian, Eulerian\
  \ };\n\n// Eulerian\n\neuler isEulerian(const Graph & g)\n{\n    if (isConnected(g)\
  \ == false)\n        return notEulerian;\n    unsigned int odd = 0;\n    for (Graph::NodeID\
  \ id = 0; id < g.numNodes(); ++id)\n        if (g.outdegree(id) & 1)\n         \
  \   odd++;\n    if (odd > 2)\n        return notEulerian;\n    return (odd) ? SemiEulerian\
  \ : Eulerian;\n}\n```\n\n## 复杂度\n\n复杂度为 ![](img/00251.jpeg)\n\n## 30 调度\n\n给定 ![](img/00252.jpeg)\
