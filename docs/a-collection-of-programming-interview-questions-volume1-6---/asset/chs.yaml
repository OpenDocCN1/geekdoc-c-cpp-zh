  \ 函数。\n\n# 38. 什么是梯度下降？\n\n## 解答\n\n从数学角度来说，函数![](img/00015.jpeg)的梯度![](img/00125.jpeg)是一个向量，其分量是这些![](img/00126.jpeg)的偏导数![](img/00046.jpeg)。与导数类似，梯度代表函数图象切线的斜率，因此梯度指向函数增长速率最快的方向，而其幅值则是图在该方向上的斜率。结果是它![](img/00127.jpeg)指向函数值下降最快的方向。\n\
  \n在许多监督机器学习问题中，我们需要通过训练数据集来学习模型。估计模型参数的一种流行且易用的技术是使用适当的梯度下降来最小化与模型相关的误差。梯度下降通过每一步移动到使所选代价函数最小的方向来迭代地估计权重。\n\
  \n![](img/00128.jpeg)\n\n这里的伪代码非常简单。在满足收敛或终止条件之前，模型权重根据以下规则进行更新\n\n![](img/00129.jpeg)\n\
  \n其中![](img/00130.jpeg)是![](img/00009.jpeg)中的梯度，![](img/00123.jpeg)是学习率参数。\n\n如果函数是凸的，那么梯度下降将找到唯一的最小值，否则该技术可能会陷入局部最小值，或者可能面临不收敛的风险。因此，如果达到了设定的最大迭代次数，必须停止迭代。此外，对不同的初始值![](img/00131.jpeg)重复该过程可能很有用，以便检测过程是否陷入了局部最小值。\n\
  \n学习率参数![](img/00123.jpeg)决定了我们向最优解移动的速度快慢。如果 `λ` 非常，将会跳过最优解。如果它太小，我们需要多次迭代才能收敛到最佳值。一种可能的解决方案是根据解的接近程度来缩放![](img/00123.jpeg)。换句话之：`λ`\
  \ 可以根据每次迭代中测量的误差率进行缩放。\n\n# 39. 什么是随机梯度下降？\n\n## 解答\n\n许多机器学习问题可以表述为目标函数的最小化问题，该目标是多个函数![](img/00132.jpeg)的和，每个函数与训练集中的第![](img/00133.jpeg)次观测相关：\n\
  \n![](img/00134.jpeg)其中![](img/00135.jpeg)\n\n梯度![](img/00136.jpeg)在计算上可能非常贵，因为在每次迭代中都需要考虑数据集的所有观测值，标准的更新规则将是\n\
  \n![](img/00137.jpeg)\n\n一种解决方案是在每一步采样采样函数的子集。这种方法被称为“随机梯度下降”，它在大规模机器学习问题中非常有效。随机梯度下降的一种简单变体是每次考虑一个训练样本并仅更新该梯度分量。另一种更复杂的方法称为“小批量”（mini-batches），它在每一步中针对多个训练样本计算梯度。这可以是向量化操作，对现代计算机非常高效。\n\
  \n### Code\n\n在 Spark 中，训练样本的采样通过 RDD 分布式数据集完成，而部分结果和的计算通过使用本地工作机器完成，然后更新主服务器。[19]](#part0000_split_066.html__ftn19)\
  \ 以下是 Spark API 的摘要\n\n![](img/00138.jpeg)\n\n# 40. 什么是线性最小二回归？\n\n## 解答\n\n线性模型简单并提供了基于直线的数据划分。通常，它们需要少量的训练数据。更复杂的模型，例如带有核的\
  \ SVM 和集成学习（将在下一卷介绍），允许使用更复杂的曲线进行数据分离——而不只是直线——但它们的训练成本通常更高，需要更多数据，而且在对未知数据进行预测结果时成本也更高。\n\
  \n在许多实际应用中，带有正则化的线性模型提供了良好的性能，并且在训练或部署时极快。此外，线性模型显示出一个非常好的特性，即它们允许容易地理解每个特征的重要性。这被称为“变量重要性信息”，它由对每个选定特征排序组成：排名靠前的特征对减少模型误差的贡献比排名靠后的特征大。因此，排序操作可以引导数据科学家通过丢弃某些特征并添加其他特征来选择正确的特征集。注意，带有正则化的线性模型为学习提供了稀疏解。\n\
  \n当应用新的未知数据时，预测可以通过非常简单的操作来计算，由几次加法和几次乘法组成。\n\n正如所讨论的，回归是预测数值的任务。线性回归是寻找![](img/00078.jpeg)的方法，其中目标函数是损失函数\n\
  \n![](img/00139.jpeg)\n\n![](img/00140.jpeg)且![](img/00088.jpeg)是正则化因子。\n\n此处可以使用随机梯度下降或其他超出本入门书籍范围的更先进的方法来识别最小值。\n\
  \n下面的代码是 Spark 用于线性回归的示例。此图片代表了线性回归和相关回归线的示例。\n\n![](img/00141.jpeg)\n\n### Code\n\
  \n```python\nfrom pyspark.mllib.regression import LabeledPoint, LinearRegressionWithSGD\n\
  from numpy import array\n\n# 将点解析为 LabeledPoint\n# 由 (标签, 特征集) 组成\ndef parsePoint(line):\n\
  \    values = [float(x) for x in line.replace(',', ' ').split(' ')]\n    return\
  \ LabeledPoint(values[0], values[1:])\n\n# 将数据加载到弹性分布式数据集 (RDD)\ndata = sc.textFile(\"\
  data/mllib/ridge-data/lpsa.data\")\n\n# 将 RDD 转换为 LabeledPoint 的 RDD\nparsedData\
  \ = data.map(parsePoint)\n\n# 通过在 parsedData 上训练线性回归构建模型\nmodel = LinearRegressionWithSGD.train(parsedData)\n\
  \n# 在训练数据上评估模型\n# 我们正在创建 (标签, 预测) 对的 RDD\nvaluesAndPreds = parsedData.map(lambda\
  \ p: (p.label, model.predict(p.features)))\n\n# 通过映射标签和预测的平方差计算 MSE\n# 然后通过求和汇总分布式差异\n\
  # spark 通过归约收集所有中间结果\n# 然后将该值除以 (标签, 预测) 元组的总数\nMSE = valuesAndPreds.map(lambda\
  \ (v, p): (v - p)**2).reduce(lambda x, y: x + y) / valuesAndPreds.count()\n\nprint(\"\
  均方误差 = \" + str(MSE))\n```\n\n\n\n\n每个预测都是通过逻辑函数 ![](img/00143.jpeg) 完成的，其中对于每个新的未见观测![](img/00145.jpeg)，对应\
  \ ![](img/00144.jpeg)。[逻辑回归](http://en.wikipedia.org/wiki/Logistic_regression)广泛用于预测二分类响应。如果\
  \ ![](img/00146.jpeg)，则结果为正，否则结果为负。\n\n逻辑回归的一个变体是多项逻辑回归，它可以预测 ![](img/00147.jpeg)\
  \ 不同的结果，其中一类作为基准，并依次选择所有其他类与基准进行比较。换句话之，会运行 ![](img/00148.jpeg) 模型，并选择概率较高的一个作为预测。\n\
  \n可以使用随机梯度下降或小批量梯度下降来解决逻辑回归问题。\n\n以下 Spark 代码与之前介绍线性回归的代码非常相似，这里的唯一区别在于用于学习模型的类。\n\
  \n### Code\n\n```python\nfrom pyspark.mllib.regression import LabeledPoint, LogisticRegressionWithLBFGS\n\
  from numpy import array\n\n# parse the point into a LabeledPoint\n# made up of (label,\
  \ set of features)\ndef parsePoint(line):\n    values = [float(x) for x in line.replace(',',\
  \ ' ').split(' ')]\n    return LabeledPoint(values[0], values[1:])\n\n# load the\
  \ data into a resilient distributed data (RDD)\ndata = sc.textFile(\"data/mllib/ridge-data/lpsa.data\"\
  )\n\n#transform the RDD into an RDD of LabeledPoint\nparsedData = data.map(parsePoint)\n\
  \n# Build the model by training a linear regression on the parsedData\nmodel = LogisticRegressionWithLBFGS.train(parsedData)\n\
  \n# Evaluate the model on training data\n# We are creating an RDD of pairs (label,\
  \ prediction) via a lambda call\nvaluesAndPreds = parsedData.map(lambda p: (p.label,\
  \ model.predict(p.features)))\n\n# compute the MSE by reducing the squared difference\
  \ between label and prediction\n# then we reduce the distributed differences by\
  \ summing them\n# spark collects all the intermediate results via reduction\n# this\
  \ value is then divided by the total number of (label, prediction) tuples \nMSE\
  \ = valuesAndPreds.map(lambda (v, p): (v - p)**2).reduce(lambda x, y: x + y) / valuesAndPreds.count()\n\
  \nprint(\"Mean Squared Error = \" + str(MSE))\n```\n\n## 43. 什么是逐步回归？\n\n## 解答\n\
  \n在逐步选择法中，预测变量的选择通过探索特征空间自动完成。逐步回归可以降低过拟合的风险，并帮助找到性能良好的简单模型，但它的成本可能非常高。如果是在没有如何选择正确特征集的额外提示的情况下暴力探索特征空间，情况尤其如此。逐步回归有三种变体：\n\
  \n- 前向选择（Forward selection）：从模型中不包含特征开始，使用某些误差估计测试每个特征的添加，只有当该变量改进了模型时才添加。重复此选择过程，直到没有特征能改进模型为止。\n\
  - 后向消除（Backward elimination）：从所有候选特征开始，使用某些误差估计测试每个特征的删除，然后删除删除后模型提升最大的变量。重复此消除过程，直到没有特征的删除能改进模型为止。\n\
  - 双向消除（Bidirectional elimination）：将上述两个步骤结合在一起。\n\n## 44. 如何将非线性信息引入线性模型\n\n## 解答\n\
  \n线性方法的创建是为了将预测制为特征的线性组合。然而，如果数据在本质上不是线性可分的，在某些情况下仍然可以使用线性模型。核心思想是将问题中的非线性近似为特征的多项式。这被称为所谓的基扩展（basis\
  \ expansion）。例如，如果你认为某个特征对预测有二次影响，那么可以将该特征的平方添加到特征空间中。为正确的特征集选择正确的基扩展是一门艺术，需要大量的微调和经验。我们在讨论\
  \ SVM 技巧时看到这种技术的另一个例子。\n\n![](img/00149.jpeg)\n\n## 45. 什么是朴素贝斯分类器？\n\n## 解答\n\n\
  朴素贝斯分类器是一种机器学习方法，为实际应用数据的每个实例分配类别标签。“朴素”（naive）属性与以下假设有关：每个特征对学习到的模型提供概率贡献，且该贡献与其他特征相互独立。\n\
  \n例如，分类文章可以被归为“体育”类别，因为它包含了“第一”（first）这个词，这与它也包含了“基础”（base）这个词的事实无关。这两个词被分开考虑，但不具有相关性。尽管其方案朴素且假设显然简化，但朴素贝斯分类器在许多困难和实际的情况下都运行良好。\n\
  \n在数学上，该问题可以通过考虑一个由合适的 ![](img/00152.jpeg)。这在统计学上描述为 ![](img/00153.jpeg) 和贝斯定理[[20]](#part0000_split_066.html__ftn)。\n\
  \n\n\n\n\n在伯努利（Bernoulli）分布中，所有特征都是简单的二值变量，描述观测训练集中特定属性的出现或不存在。因此，伯努利可以建模为：\n\n\
  ![](img/00171.jpeg)\n\n其中 ![](img/00172.jpeg) 是在类别 ![](img/00174.jpeg) 中观察到特征 ![](img/00173.jpeg)\
  \ 的概率。伯努利常用于文本分类，通过显式建模文本中词项 ![](img/00175.jpeg) 的存在或不存在。\n\n多元分布（Multivariate）是伯努利的变体，其中\
  \ ![](img/00173.jpeg) 计算的是事件在特定实例中观察到的次数。多元分布在文本分类中非常流行，其中文本由单词的独立集合表示：即所谓的词袋（bag\
  \ of words）。观察某个单词的概率在数学上表示为：\n\n![](img/00176.jpeg)\n\n同样，在![](img/00177.jpeg)中计算较小的概率时，最好移动到对数空间，这样忽略常数缩放因子后我们得到\n\
  \n![](img/00178.jpeg)\n\n注意后者是 ![](img/00179.jpeg)的简单线性形式，带有 ![](img/00180.jpeg)\
  \ ![](img/00181.jpeg)和![](img/00182.jpeg)。还要注意，使用这种公式，如果概率为零，这将消除所有其他贡献。这个问题通过所谓的平滑策略来解决，使用一些微小的常数因子来替换零。\n\
  \n下面的代码使用 Spark 在文本数据上训练多项贝叶斯分类器。用于评估质量的指标是准确率（accuracy），它是正确预测的次数除以预测总数，并乘以 100\
  \ 转换为百分比。准确率通过 Spark 上的 map-reduce 计算得出。注意，数据集已划分为训练集（数据的 70%）和测试集（数据的 30%）。平滑因子设置为![](img/00183.jpeg)。\n\
  \n### Code\n\n```python\nfrom pyspark.mllib.classification import NaiveBayes\nfrom\
  \ pyspark.mllib.linalg import Vectors\nfrom pyspark.mllib.regression import LabeledPoint\n\
  \n# 创建一个合适的元组 (label, features) 组成的 LabeledPoint\ndef parseLine(line):\n    parts\
  \ = line.split(',')\n    label = float(parts[0])\n    features = Vectors.dense([float(x)\
  \ for x in parts[1].split(' ')])\n    return LabeledPoint(label, features)\n\n#\
  \ 从由 LabeledPoint 组成的文本文件创建 RDD \ndata = sc.textFile('data/mllib/sample_naive_bayes_data.txt').map(parseLine)\n\
  \n# 将数据分为训练集 (70%) 和测试集 (30%)\n# 固定种子以确保实验的可重复性\ntraining, test = data.randomSplit([0.7,\
  \ 0.3], seed =0)\n\n# 使用平滑因子 1.0 训练多项朴素贝叶斯\nmodel = NaiveBayes.train(training, 1.0)\n\
  \n# 进行预测并测试准确率\npredictionAndLabel = test.map(lambda p : (model.predict(p.features),\
  \ p.label))\naccuracy = 1.0 * predictionAndLabel.filter(lambda (x, v): x == v).count()\
  \ / test.count()\n```\n\n## 47. 什么是高斯分布？\n\n### Solution\n\n高斯分布是一类数学函数，呈现出特征的对称“钟曲线”形状。数学上：给定均值\
  \ ![](img/00123.jpeg) 和方差 ![](img/00184.jpeg)，高斯分布定义为：\n\n![](img/00185.jpeg)\n\n\
  高斯分布是一种常见的连续概率分布，因为中心极限定理而在统计学中被频繁使用。该定理指出，从独立分布独立抽取的随机变量（也称为 i.i.d.）呈正态分布。\n\n\
  正态分布的最简单情况是![](img/00186.jpeg)。在以下示例中，使用 ![](img/00187.jpeg)采样了 500 个随机数并分配到桶中。抽取的值具有经典的钟形。该函数在均值处达到峰值，且随着标准差\
  \ ![](img/00188.jpeg) 的增大，“扩散”也随增加。\n\n### Code\n\n```python\nimport matplotlib.pyplot\
  \ as plt\nimport numpy as np\n\nmu, sigma = 0, 1  # 均值和标准差\ns = np.random.normal(mu,\
  \ sigma, 500)\ncount, bins, ignored = plt.hist(s, 50, normed=True)\nplt.plot(bins,\
  \ 1/(sigma * np.sqrt(2 * np.pi)) *\n      np.exp(- (bins - mu)**2 / (2 * sigma**2)),\n\
  \      linewidth=2, color='r')\nplt.show()\n```\n![](img/00189.jpeg)作为一个练习，尝试为不同的\
  \ ![](img/023.jpeg) 值绘制图像并注意差异。\n\n## 48. 什么是标准化？\n\n### Solution\n\n如果数据由高斯分布描述，那么通过对样本进行列统计，将其缩放为单位方差并移除均值，可能会非常方便。\n\
  \n### Code\n\n```python\nfrom pyspark.mllib.util import MLUtils\nfrom pyspark.mllib.linalg\
  \ import Vectors\nfrom pyspark.mllib.feature import StandardScaler\n\ndata = MLUtils.loadSVM(sc,\
  \ \"data/mllib/sample_svm_data.txt\")\nlabel = data.map(lambda x: x.label)\nfeatures\
  \ = data.map(lambda x: x.features)\nscaler1 = StandardScaler().fit(features)\nscaler2\
  \ = StandardScaler(withMean=True, withStd=True).fit(features)\ndata1 = label.zip(scaler1.transform(features))\n\
  ```\n单位方差。\n\n# 49. 为什么统计分布很重要？\n\n### Solution\n\n统计分布对于事件和数据的建模非常重要。分布由概率质量函数（pmf，提供离散变量正好等于某值的概率）和累积分布函数（CDF，描述实值随机变量\
  \ ![](img/0048.jpeg) 小于等于 ![](img/0082.jpeg) 的概率）等函数刻画。除了正态分布，以下分布在数据科学中被频繁使用：\n\
  \n| | 名称 | PMF | CDF | E(X) | VAR(X) |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| 伯努利 | 离散分布。它以 ![](img/00190.jpeg) 的概率取值为 1，以 ![](img/00191.jpeg)的概率取值为 0。经典例子是抛一次硬币。\
  \ | ![](img/00192.jpeg) | ![](img/00193.jpeg) | ![](img/00194.jpeg) | ![](img/00195.jpeg)\
  \ |\n| 二项 | 离散分布。它描述了相同概率的一系列独立实验中的成功次数。 | ![](img/00196.jpeg)n，试验次数 k，成功次数 p，每次实验的成功概率其中\
  \ ![](img/00197.jpeg) | ![](img/00198.jpeg) | ![](img/00199.jpeg) | ![](img/00201.jpeg)\
  \ |\n| 泊二项 | 它描述了一系列具有不同成功概率的独立实验中的成功次数 | ![](img/00203.jpeg)其中 ![](img/00204.jpeg)是从{1,2,3,...,n}中选出的\
  \ k 个整数的所有子集。![](img/00205.jpeg)是集合 A 的补集。 | ![](img/00206.jpeg)其中 ![](img/00207.jpeg)\
  \ | ![](img/00208.jpeg) | |\n\n\n\n\n\n| Poisson | 离散分布。它描述了在固定时间或空间间隔内，事件自上一次发生以来独立且以已知平均发生率到达的概率。\
  \ | ![](img/00211.jpeg)![](img/00212.jpeg)![](img/00213.jpeg)正实数 `\\lambda` 是随机变量\
  \ `X` 的期望值，也是其方差的期望值![](img/00214.jpeg)是一个整数 | ![](img/00215.jpeg) | ![](img/00216.jpeg)\
  \ | ![](img/00216.jpeg) |\n| Gaussian | 实数域上的分布。中心极限定定理：每一个建模为许多具有有限均值的独立同分布（i.i.d）变量之和的变量，[方差](https://en.wikipedia.org/wiki/Variance)符合正态分布。\
  \ | ![](img/00217.jpeg)![](img/00218.jpeg) | ![](img/00219.jpeg) | ![](img/00216.jpeg)\
  \ | ![](img/00220.jpeg) |\n\n### Code\n\nNumpy 为上述描述的所有分布以及许多其他提供了完整支持。感兴趣的读者可以在维基百科上查看[[22]](#part0000_split_066.html__ftn22)\n\
  \n```python\nimport numpy as np\n\nn, p = 10, .5  # 试验次数，每次试验的概率\n\ns = np.random.binomial(n,\
  \ p, 100)\n\nprint s\n```\n\n## 50. 你能将数据与某些分布进行比较吗？什么是 QQ 图？\n\n## 解决方案\n\n如果你想调查你的数据是否遵循某种分布（如正态分布、均匀分布），一种有效的方法是使用\
  \ QQ 图，它通过绘制两个概率分布的分位数对比图来比较它们。如果两个分布相似的，那么图表将显示为一条直线。\n\n## 代码\n\n```python\nimport\
  \ numpy as np\n\nimport pylab\n\nimport scipy.stats as stats\n\nmeasurements = np.random.normal(loc\
  \ = 40, scale = 10, size=80)  \n\nstats.probplot(measurements, dist=\"norm\", plot=pylab)\n\
  \npylab.show()\n```\n\n![](img/00221.jpeg)\n\n## 51. 什么是高斯朴叶贝斯？\n\n## 解决方案\n\n如果数据是连续的，使用高斯分布来估计概率可能会很方便。因此，如果特征\
  \ ![](img/00222.jpeg)，然后以这种方式将概率建模为高斯分布：\n\n![](img/00224.jpeg)\n\n如所述，使用 QQ 图等工具检查我们的数据是否确实呈现出高斯分布可能是很有用的。\n\
  \n## 52. 使用朴叶贝斯处理连续数据的另一种方法是什么？\n\n## 解决方案\n\n处理连续特征的另一种方法是将它们离散化到桶（buckets）中，并使用多项朴叶贝斯进行离散模型。然而，应该特别注意确定合适的桶的数量。\n\
  \n## 53. 什么是最近邻分类？\n\n## 解决方案\n\n“最近邻”是一种非常简单的分类形式，每个实例都将被分配给距离该实例更近的对象。在训练阶段，特征空间根据训练实例的位置被划分为不同的区域。在在应用阶段，使用相对于训练实例的距离对真实数据进行分类。\n\
  \n有许多选择。例如，我们可以考虑最近的对象，或者考虑最多 ![](img/00228.jpeg) |\n| 曼哈顿 | ![](img/00230.jpeg)\
  \ |\n| 汉明 | #(![](img/00231.jpeg)) | 单个向量分量不同的位置数量。 | 2473996 2233796 距离为 3 |\n\
  | Jaccard | ![](img/00233.jpeg)![](img/00234.jpeg)![](img/00235.jpeg) |\n\n实现精确的最近邻可能非常昂贵。因此，人们提出了许多近似变体，通常基于对空间特征进行采样的想法。感兴趣的读者可以在这里找到用于\
  \ Spark 的实验性 alpha 实现[[23]](#part0000_split_066.html__ftn23)\n\n此处代码片段实现了一个 K=1\
  \ 的简单 Knn 版本。更复杂的实现基于高级数据结构，例如 KD 树。[[24]](#part0000_split_066.html__ftn24)\n\n\
  ## 代码\n\n```python\nimport numpy as np\n\ndef dist(p0, p1):\n  return np.sum((p0-p1)**2)\n\
  \ndef knn(training, trainingLabels, newPoint):\n  dists = np.array([distance(t,\
  \ newPoint)]  for t in training)\n  nearest = dists.argmin()\n  return trainingLabels[nearest]\n\
  ```\n\n## 54. 什么是支持向量机 (SVM)？\n\n## 解决方案\n\n支持向量机旨在高维空间中识别一个超平面。直观地说，最好的超平面是距离最近点距离最大的那一个。\n\
  \n幸运的是，有很多可以使用先进的数学工具解决这个优化问题。例如：Spark 使用带有合合损失函数（hinge loss）以及 L1 或 L2 类型正则化的 SVM。优化问题通过随机梯度下降来解决。\n\
  \n一旦模型学习，预测仅仅是向量乘法。对于每个应用实例 ![](6/images/00257.jpeg，如果 ![](6/images/00258.jpeg 结果为正，否则为负。\n\
  \n\n\n\n\n```python\nfrom pyspark.mllib.classification import SVMWithSGD, SVMModel\n\
  from pyspark.mllib.regression import LabeledPoint\n\n# Load and parse the data into\
  \ LabeledPoint\ndef parsePoint(line):\n    values = [float(x) for x in line.split('\
  \ ')]\n    return LabeledPoint(values[0], values[1:])\n\ndata = sc.textFile(\"data/mllib/sample_svm_data.txt\"\
  )\nparsedData = data.map(parsePoint)\n\n# Build the model for SVM with Stocastic\
  \ Gradient Descent\nmodel = SVMWithSGD.train(parsedData, iterations=100)\n\n# Evaluating\
  \ the model on training data\nlabelsAndPreds = parsedData.map(lambda p: (p.label,\
  \ model.predict(p.features)))\n\n# Compute the accuracy\ntrainErr = labelsAndPreds.filter(lambda\
  \ (v, p): v != p).count() / float(parsedData.count())\nprint(\"Training Error =\
  \ \" + str(trainErr))\n```\n\n## 55. 什么是 SVM 核技巧？\n\n## 解决方案\n\n如果线性分离不足，仍然可以使用带有简单技巧的\
  \ SVM。例如，如果原始数据由 3 维向量 `[x, y, z]` 组成，我们可以计算一个新的 9 维特征向量 ![](img/00259.jpeg)。这个基本思想可以像“大规模核机器的随机特征”[[25]](#part0000_split_066.html__ftn25)中所解释的那样进行扩展。这里的直觉是，核方法记忆了第\
  \ ![](img/00260.jpeg)，并将其与另一个训练样本相结合。\n\n在某些情况下，会添加额外的结构，核是一个特殊的函数，它将输入空间 ![](img/00123.jpeg)\
  \ 映射到另一个空间 ![](img/00261.jpeg)，使得 ![](img/00262.jpeg) ![](img/00263.jpeg)，且核是 ![](img/00264.jpeg)\
  \ 和 ![](img/00265.jpeg) 之间的内积，其中从原始输入空间提供了两个特征 ![](img/00266.jpeg)。换句话说，核函数将问题空间中的非线性边界映射到高维空间中的线性边界。\n\
  \n![SVM 线性不可可分](img/00267.jpeg)\n\n这些是机器学习中经常使用的核示例\n\n| 核的示例 | 含义 |\n| :--- | :---\
