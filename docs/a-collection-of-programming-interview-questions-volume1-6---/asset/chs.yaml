  ![](img/00055.jpeg)\n\n## 25. 如何使用 pandas 计算协方差和相关性矩阵？\n\n## 解决方案\nPandas 支持协方差计算。这段简单的代码片段计算了鸢尾花玩具数据集的协方差。记住相关性等同于对标准化变量进行协方差计算。例如，可以观察到萼长度与花瓣长度正相关。\n\
