  \ |\n\n# 56. 什么是 K-Means 聚类？\n\n## 解决方案\n\nK-means 是一种平坦聚类，目标是将空间划分为一组组，而在组之间不建立关系。在下一卷中，我们将介绍一种层次聚类的形式，这些组按照层次树进行组织。\n\
  \nK-Means 是一种无监督学习，实际数据被分组在 ![](img/00147.jpeg) 个不同的簇中。数学上：给定 ![](img/00273.jpeg)观测值![](img/00274.jpeg)，每个观测值是具有\
  \ ![](img/00060.jpeg)特征![](img/00275.jpeg)的向量，![](img/00147.jpeg)-means 方法将 ![](img/00276.jpeg)观测值划分到\
  \ ![](img/00277.jpeg)集合 ![](img/00278.jpeg)中，使得表示为平方和的簇内误差最小化。\n\n![](img/00279.jpeg)\n\
  \n问题的近似解是通过迭代计算的。算法开始从随机选取 ![](img/00147.jpeg)点作为所谓的 ![](img/00280.jpeg)质心。然后交替重复两个步骤，直到满足收敛或停止标准。首先，将每个观测值分配到其质心距离该观测值簇内平方和最小的组。然后，通过考虑组内的观测值来更新每个组的均值。当分配不再变化时，算法即收敛。由于两个步骤都优化了簇内距离，且此类划分的数量有限，因此算法必须收敛到（局部）最优。\n\
  \nK-Means++ 是 K-Means 的变体，其中初始的 K 个簇是分散的：第一个簇中心从应用数据点中均匀随机选择，之后每个后续簇中心从剩余数据点中选择，概率与其到最近现有质心点的距离平方成正比。Spark\
  \ 实现了 K-Means++ 的变体，称为 K-Means||[[26]](#part0000_split_066.html__ftn26)，适用于并行计算。\n\
  \n## 代码\n\n```python\nfrom pyspark.mllib.clustering import KMeans, KMeansModel\n\
  from numpy import array\nfrom math import sqrt\n\n# 加载并解析数据为 LabeledPoint\ndata\
  \ = sc.textFile(\"data/mllib/sample_svm_data.txt\")\nparsedData = data.map(parsePoint)\n\
  \n# 使用随机梯度下降构建 SVM 模型\nmodel = SVMWithSGD.train(parsedData, iterations=100)\n\n\
  # 在训练数据上评估模型\nlabelsAndPreds = parsedData.map(lambda p: (p.label, model.predict(p.features)))\n\
  \n# 计算准确率\ntrainErr = labelsAndPreds.filter(lambda (v, p): v != p).count() / float(parsedData.count())\n\
  print(\"Training Error = \" + str(trainErr))\n```\n\n## 57. 你能提供一个 Spark 文本分类的示例吗？\n\
  \n## 解决方案\n\n让我们 Spark 中的文本分类并利用之前问题中引入的技术。在这个示例中，文本单词被加载并转换为向量空间。\n\n## 代码\n\n\
  ```python\nfrom pyspark import SparkContext, SparkConf\nfrom pyspark.mllib.feature\
  \ import HashingTF\nfrom pyspark.mllib.regression import LabeledPoint\nfrom pyspark.mllib.classification\
  \ import NaiveBayes\n\nconf = SparkConf().setMaster(\"local[*]\").setAppName(\"\
  Naive_Bayes\")\nsc = SparkContext(conf=conf)\n\n# 哈希单词离散空间\n# 限制为 10000\nhtf = HashingTF(10000)\n\
  \n# 分词句子并转换为向量空间\ndataRDD = sc.textFile(\"./positiveData.txt\")\ndata = dataRDD.map(lambda\
  \ text : LabeledPoint(1, htf.transform(text.split(\" \"))))\ndata.persist()\n\n\
  # 构建训练和测试数据集\n# 训练集占数据的 70%，测试集占 30%\ntrainData, testData = data.randomSplit([0.7,\
  \ 0.3])\n\n# 在训练数据上训练 Naive Bayes 模型\nmodel = NaiveBayes.train(trainData)\n\n# 比较预测标签和实际标签\n\
  prediction_and_labels = testData.map(lambda point: (model.predict(point.features),\
  \ point.label))\n\n# 过滤出正确的预测\ncorrect = prediction_and_labels.filter(lambda (predicted,\
  \ actual): predicted == actual)\n\n# 计算并打印准确率\naccuracy = correct.count() / float(testData.count())\n\
  print(\"分类器正确预测了 \" + str(accuracy * 100) + \" 百比的类别\")\n```\n\n## 58. 接下来该去哪里\n\
