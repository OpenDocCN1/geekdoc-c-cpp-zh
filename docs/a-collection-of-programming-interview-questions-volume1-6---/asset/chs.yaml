  ## 复杂度\n复杂度为 `![](img/00123.jpeg)`，空间复杂度为 `![](img/00201.jpeg)`。将空间降低到 `![](img/00202.jpeg)`\
  \ 留作练习题。\n\n# 16. LCS – 给定两个字符串，找到最长公共子序列\n\n给定两个字符串，如果两个子序列以相同的顺序出现，但不一定连续，则它们是公共子序列。与上一个问题的主要区别在于，这里的项不是连续的。\n\
  \n## 解决方案\n对于字符串 `![](img/00203.jpeg)` 和字符串 `![](img/00204.jpeg)1]`，可以通过动态规划计算出解决方案，方法是在长度为\
  \ `![](img/00076.jpeg)` 和 `![](img/00077.jpeg)` 的前缀 `![](img/00206.jpeg)` 和 `![](img/00207.jpeg)`\
  \ 上定义一个递归函数 `![](img/00205.jpeg)`。\n\n`![](img/00208.jpeg)`\n\n可以使用表格来构建动态规划解决方案，我们在表格中存储了上述计算的部分结果（函数`![](img/00209.jpeg)`）。此外，我们还存储了生成该表格的方向，以便在下一步中重建公共子序列（函数`![](img/00210.jpeg)`）。\n\
  \n## 代码\n```cpp\nenum where{DiagonalUpward, Upward, Downward};\n\nvoid printLCS(const\
  \ Matrix<where>& directions, const std::string& str,\n  unsigned int i, unsigned\
  \ int j)\n{\n  if (i == 0 || j == 0)return;\n  if (directions(i, j) == DiagonalUpward)\
  \ {\n    printLCS(directions, str, i - 1, j - 1);\n    std::cout << str[i];\n  }\
  \ else if (directions(i, j) == Upward)\n    printLCS(directions, str, i - 1, j);\n\
  \  else\n    printLCS(directions, str, i, j - 1);\n}\n\nvoid LCS(const std::string&\
  \ s1, const std::string& s2)\n{\n  const unsigned int m = s1.size() + 1;\n  const\
  \ unsigned int n = s2.size() + 1;\n  Matrix<unsigned int> table(m, n, 0);\n  Matrix<where>\
  \ directions(m, n);\n  for (unsigned int i = 1; i<m; i++)\n    for (unsigned int\
  \ j = 1; j<n; j++)\n      if (s1[i] == s2[j]) {\n        table(i, j) = table(i -\
  \ 1, j - 1) + 1;\n        directions(i, j) = DiagonalUpward;\n      }\n      else\n\
  \        if (table(i - 1,j) >= table(i, j - 1)) {\n          table(i, j) = table(i\
  \ - 1, j);\n          directions(i, j) = Upward;\n        }\n        else {\n  \
  \        table(i, j) = table(i, j - 1);\n          directions(i, j) = Downward;\n\
  \        }\n  printLCS(directions, s1, m-1, n-1);\n}\n```\n\n## 复杂度\n复杂度为 `![](img/00201.jpeg)`，空间复杂度为\
  \ `![](img/00201.jpeg)`。\n\n# 17. LIS – 给定一个整数数组，找到最长递增子序列\n\n## 解决方案\n可以通过动态规划快速识别解决方案。假设我们扫描数组\
