  ## 解决方案\n二叉树是每个节点最多有两个子节点的树。非递归的前序遍历可以使用栈来实现。\n\n在循环中：\n* 首先访问当前节点。\n* 然后将左子节点入栈，直到到达叶子节点。\n\
  * ，如果栈为空，则退出循环。否则，弹出栈顶元素并向右子节点继续遍历。\n\n## 代码\n```cpp\ntemplate<typename tVal>\n\
  struct binaryTree {\n    tVal v__;\n    struct binaryTree<tVal> * left;\n    struct\
  \ binaryTree<tVal> * right;\n    binaryTree(tVal v) : v__(v), left(NULL), right(NULL)\
  \ {}\n};\n\ntemplate<typename tVal>\nvoid nonRecursivePreOrder(binaryTree<tVal>\
  \ * root) {\n    std::stack<binaryTree<tVal> *> s;\n    while (true) {\n       \
  \ //left\n        while (root) {\n            std::cout << \" v=\" << root->v__;\n\
  \            s.push(root);\n            root = root->left;\n        }\n        if\
  \ (s.empty())\n            break;\n        // this one\n        root = s.top();\n\
  \        s.pop();\n        //right\n        root = root->right;\n    }\n}\n```\n\
  \n## 复杂度\n时间复杂度是 ![](img/00001.jpeg) 空间复杂度是 ![](img/00001.jpeg)\n\n## 2 计算二叉树的直径\n\
  ## 解决方案\n可以使用递归轻松计算该结果\n\n## 代码\n```cpp\ntemplate<typename tVal>\nunsigned diameter(binaryTree<tVal>\
  \ * root, unsigned &dim) {\n    unsigned left, right;\n    if (!root)\n        return\
  \ 0;\n    left = diameter(root->left, dim);\n    right = diameter(root->right, dim);\n\
  \    if (left + right > dim)\n        dim = left + right;\n    return ((left > right)\
  \ ? left : right) + 1;\n}\n```\n## 复杂度\n时间复杂度是 ![](img/00001.jpeg) 空间复杂度是 ![](img/00001.jpeg)。\n\
  \n## 3 实现二叉树的中序遍历\n## 解决方案\n非递归的中序遍历可以使用栈来实现。\n\n在循环中：\n* 首先将左子节点入栈，直到到达叶子节点。\n\
  * 然后，如果栈为空，则退出循环。否则，弹出栈顶元素并访问当前节点。\n* 最后，向右子节点继续遍历。\n\n## 代码\n```cpp\ntemplate<typename\
  \ tVal>\nvoid nonRecursiveInOrder(binaryTree<tVal> * root) {\n    std::stack<binaryTree<tVal>\
  \ *> s;\n    while (true) {\n        //left\n        while (root) {\n          \
  \  s.push(root);\n            root = root->left;\n        }\n        if (s.empty())\n\
  \            break;\n        // this one\n        root = s.top();\n        s.pop();\n\
  \        std::cout << \" v=\" << root->v__;\n        //right\n        root = root->right;\n\
  \    }\n}\n```\n## 复杂度\n时间复杂度是 ![](img/00001.jpeg) 空间复杂度是 ![](img/00001.jpeg)\n\n\
  ## 4 实现二叉树的后序遍历\n## 解决方案\n在后序遍历期间，每个节点都会被访问两次：第一次是在向左子节点移动时，第二次是在向右子节点移动时。为了区分这两种情况，我们可以比较当前元素与栈顶元素元素的右子节点是否相同。\n\
  \n## 代码\n```cpp\ntemplate<typename tVal>\nvoid nonRecursivePostOrder(binaryTree<tVal>\
  \ * root) {\n    std::stack<binaryTree<tVal> *> s;\n    while (true) {\n       \
  \ if (root) {\n            s.push(root);\n            root = root->left;\n     \
  \   } else if (s.empty())\n            break; else if (!s.top()->right) {\n    \
  \        std::cout << \" v=\" << s.top()->v__;\n            s.pop();\n        }\
  \ else {\n            root = s.top()->right;\n        }\n    }\n}\n```\n*(注：源代码中提供的代码严重碎片化/损坏；我根据标准逻辑清理了结构，同时保留了提供的标记).*\n\
  \n## 5 实现二叉树的层序遍历\n## 解决方案\n层序遍历可以在进入下一层之前遍历所有节点。思路很简单。\n\n在循环中：\n* 首先访问根节点。\n*\
  \ 然后将当前层的节点存储在队列中。\n* 持续循环直到完成所有层的遍历。\n\n## 代码\n```cpp\ntemplate<typename tVal>\n\
  void nonRecursiveLevelOrder(binaryTree<tVal> * root) {\n    std::queue<binaryTree<tVal>\
  \ *> q;\n    binaryTree<tVal> * tmp;\n    if (!root)\n        return;\n    q.push(root);\n\
  \    while (!q.empty()) {\n        tmp = q.front();\n        q.pop();\n        std::cout\
  \ << \" v=\" << tmp->v__;\n        if (tmp->left)\n            q.push(tmp->left);\n\
  \        if (tmp->right)\n            q.push(tmp->right);\n    }\n}\n```\n## 6 统计树中叶子节点的数量\n\
  ## 解决方案\n可以通过修改层序遍历来实现，每次到达叶子节点时增加计数器。\n\n## 代码\n```cpp\ntemplate<typename tVal>\n\
  unsigned NumLeavesNonRecursiveLevelOrder(binaryTree<tVal> * root) {\n    std::queue<binaryTree<tVal>\
  \ *> q;\n    binaryTree<tVal> * tmp;\n    unsigned count = 0;\n    if (!root)\n\
  \        return count;\n    q.push(root);\n    while (!q.empty()) {\n        tmp\
  \ = q.front();\n        q.pop();\n        if (!tmp->left && !tmp->right)\n     \
  \       count++; // 另一个叶子节点\n        else {\n            if (tmp->left)\n      \
  \          q.push(tmp->left);\n            if (tmp->right)\n                q.push(tmp->right);\n\
  \        }\n    }\n    return count;\n}\n```\n\n\n\n\n\n## 复杂度\n\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为\
  \ ![](img/00001.jpeg)。\n\n## 7 检查两个二叉树的结构是否相同\n\n## 解决方案\n\n可以通过递归提供解决方案。当两个节点都为空时，或者其中一个节点为空时，视为基础情况。否则，算法将检查两个节点是否包含相同的值，以及它们的左孩子和右子节点在递归上是否结构相同。\n\
  \n## 代码\n\n```cpp\ntemplate<typename  tVal>\nunsigned structIdentical(binaryTree<tVal>\
  \ * r1, binaryTree<tVal> * r2)\n  {\n    if (!r1 && !r2)\n        return true;\n\
  \    if (!r1 || !r2)\n        return false;\n    return (r1->v__ == r2->v__ &&\n\
  \            structIdentical(r1->left, r2->left) &&\n            structIdentical(r1->right,\
  \ r2->right));\n  }\n```\n\n## 复杂度\n\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\
  \n## 8 打印二叉树中的所有路径\n\n## 解决方案\n\n可以通过递归提供解决方案。该思想是在递归过程中保持一个 vector ![](img/00004.jpeg)，同时每个节点都通过\
  \ `push_back()` 到 ![](img/00005.jpeg) 中。每当我们到达叶子节点时，就会打印该 vector。\n\n## 代码\n\n```cpp\n\
  template<typename  tVal>\nvoid printAllPaths(binaryTree<tVal> * root, std::vector<tVal>\
  \ path)\n  {\n    if (!root)\n        return;\n    path.push_back(root->v__);\n\
  \    if (!root->left && !root->right)\n      {\n        std::vector<tVal>::iterator\
  \ it = path.begin();\n        for (; it != path.end(); it++)\n            std::cout\
  \ << \" v=\" << *it;\n        std::cout << std::endl;\n      }\n    else\n     \
  \ {\n        printAllPaths(root->left, path);\n        printAllPaths(root->right,\
  \ path);\n      }\n  }\n```\n\n## 复杂度\n\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\
  \n## 9 验证路径之和是否等于一个整数\n\n## 解决方案\n\n该思想是在递归访问树时，从给定的和中减去当前值。\n\n## 代码\n\n```cpp\n\
  template<typename  tVal>\nbool hasSum(binaryTree<tVal> * root, int sum)\n  {\n \
  \   if (!root)\n        return (sum == 0);\n    else\n      {\n        int remainingSum\
  \ = sum - root->v__;\n        if ((root->left && root->right) || (!root->left &&\
  \ !root->right))\n            return (hasSum(root->left, remainingSum) ||\n    \
  \                hasSum(root->right, remainingSum));\n        else\n           \
  \ if (root->left)\n                return hasSum(root->left, remainingSum);\n  \
  \          else\n                return hasSum(root->right, remainingSum);\n   \
  \   }\n  }\n```\n\n## 复杂度\n\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\
  \n## 10 寻找二叉树两个叶子节点之间的最大路径和\n\n## 解决方案\n\n两个叶子节点之间的最大路径和可以经过根节点，也可能位于子树中（前提是它属于树本身）。因此，我们有以下递归情况：\n\
  \n- 基础情况是根节点为 NULL，我们返回 0\n- 然后我们递归地计算左子树和右子树的最大路径和\n- 然后我们计算左子树、右子树以及以当前节点为根的子树的最大值。如果这个最大值改进了目前观察到的总最大值，则更新总最大值\n\
  - 从递归返回，我们计算左右子树之间的最大值并加上当前节点的权重。\n\n## 代码\n\n```cpp\ntemplate<typename  tVal>\n\
  tVal max(tVal a, tVal b)\n  {\n    return (a >= b) ? a : b;\n  }\n\ntemplate<typename\
  \  tVal>\nint maxPathSum(binaryTree<tVal> * root, tVal &res)\n  {\n    if (!root)\n\
  \        return 0;\n    int lLPSum = maxPathSum(root->left, res);\n    int rLPSum\
  \ = maxPathSum(root->right, res);\n    int curr_sum = max((lLPSum + rLPSum + root->v__));\n\
  \    if (res < curr_sum)\n        res = curr_sum;\n    return lLPSum + rLPSum +\
  \ root->v__;\n  }\n```\n\n## 复杂度\n\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\
  \n## 1 根据前序遍历和中序遍历重建树\n\n## 解决方案\n\n在前序遍历中，根节点始终是每个子树中最左侧的元素。因此，我们开始将前序数组中最左侧的元素作为整棵树的根。现在：如果在中序数组中搜索该元素，我们可以立即推断出位于该值之前的所有元素（左子树）和位于该值之后的所有元素（右子树）。递归地。\n\
  \n## 代码\n\n```cpp\ntemplate<typename  tVal>\nunsigned search(std::vector<tVal> inorder,\
  \ unsigned start, unsigned end, tVal v)\n  {\n    for (unsigned i = start; i <=\
  \ end; i++)\n        if (inorder[i] == v)\n            return i;\n  }\n\ntemplate<typename\
  \  tVal>\nbinaryTree<tVal> * buildInorderPreorder(const std::vector<tVal> & preOrder,\
  \ const std::vector<tVal> & inorder, unsigned &inIndex, unsigned inStart, unsigned\
  \ inEnd)\n  {\n    binaryTree<tVal> * n;\n    n->v__ = preOrder[inIndex++];\n  \
  \  if (inStart == inEnd)\n        return n;\n    // (此处省略了后续的实现逻辑)\n    n->left\
  \ = buildInorderPreorder(preOrder, inorder, inIndex, inStart, mid);\n    n->right\
  \ = buildInorderPreorder(preOrder, inorder, inIndex, mid+1, inEnd);\n    return\
  \ n;\n  }\n```\n\n## 复杂度\n\n时间复杂度为。读者可以考虑这是否是优的。\n\n## 12 打印 Z 字形遍历\n\n## 解决方案\n\
  \nZ 字形遍历通过两个栈在每一层之间交替实现。在遍历 currLevel 时，维护一个方向（从左到右或从右到左）。当 currLevel 为空时，与 nextLevel\
  \ 交换。使用栈。\n\n## 代码\n\n```cpp\ntemplate<typename  tVal>\nvoid printZigZag(binaryTree<tVal>\
  \ * root)\n  {\n    binaryTree<tVal> * tmp;\n    bool left2right = true;\n    if\
  \ (!root)\n        return;\n    std::stack<binaryTree<tVal> *> currLevel;\n    std::stack<binaryTree<tVal>\
  \ *> nextLevel;\n    currLevel.push(root);\n    while (!currLevel.empty())\n   \
  \   {\n        tmp = currLevel.top();\n        currLevel.pop();\n        if (tmp)\n\
  \          {\n            std::cout << \" v=\" << tmp->v__;\n            if (left2right)\n\
  \              {\n                nextLevel.push(tmp->left);\n                nextLevel.push(tmp->right);\n\
  \              }\n            else\n              {\n                nextLevel.push(tmp->right);\n\
  \                nextLevel.push(tmp->left);\n              }\n          }\n    \
  \    if (currLevel.empty())\n          {\n            left2right = !left2right;\n\
  \            currLevel.swap(nextLevel);\n          }\n      }\n  }\n```\n\n## 复杂度\n\
  \n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\n## 13 打印最近公共祖先 (LCA)\n\
  \n## 解决方案\n\n可以通过递归计算。两个节点 ![](img/00007.jpeg) 和 ![](img/00008.jpeg) 的最近公共祖先是 ![](img/00009.jpeg)如果根是\
  \ ![](img/00010.jpeg)。否则 LCA 是 ![](img/00007.jpeg) (相应的 ![](img/00011.jpeg)) 如果根是\
  \ ![](img/00007.jpeg) (相应的 ![](img/00011.jpeg))。这些是基础情况。然后递归地计算左子树和右子树的解决方案。从递归返回后，如果左右都可用，则\
  \ LCA 是当前根，否则是左节点（如果可用，相应的右节点，如果可用）。\n\n## 代码\n\n```cpp\ntemplate<typename  tVal>\n\
  binaryTree<tVal> * LCA(binaryTree<tVal> * root, binaryTree<tVal> * n1, binaryTree<tVal>\
  \ * n2)\n  {\n    if (!root)\n        return NULL;\n    if (root == n1 || root ==\
  \ n2)\n        return root;\n    binaryTree<tVal> * left = LCA(root->left, n1, n2);\n\
  ```\n\n\n\n\n\n```cpp\nLCA(root->left, n1, n2);\n\nbinaryTree<tVal> * right = LCA(root->right,\
  \ n1, n2);\n\nif (left && right)\n    return root;\nelse\n    return (left ? left\
  \ : right);\n```\n\n## 复杂度\n时间复杂度为 ![](img/00001.jpeg)，空间复杂度为 ![](img/00001.jpeg)。\n\
  \n## 14 在二叉搜索树中实现“查找”和“插入”\n\n## 解决方案\n二叉搜索树 (BST) 是一种树，其中每个节点最多有两个子节点。一个节点的左子树只包含键严格小于该节点键的节点。节点的右子树只包含键大于该节点键的节点。\n\
  \n`Find()` 首先检查[根节点](http://en.wikipedia.org/wiki/Tree_(data_structure)#root_nodes)。如果树为\
  \ `null`，则该键在树中不存在。如果该键等于根节点的键，`find()` 返回根节点。如果键小于根节点的键，则搜索左子树。如果键大于根节点的键，则搜索右子树。这种方法通过递归或迭代重复进行。下面我们提出了一个递归版本，并将迭代版本的实现留给感兴趣的读者自行完成。\n\
  \n`Insert()` 遵循的方法。在树内部查找要插入的候选键。如果找到了，则过程返回。否则，如果搜索到达 `null` 节点，则将键插入到该位置。该过程可以是递归的也可以是迭代的。\n\
  \n## 代码\n```cpp\ntemplate<typename  tVal>\nstruct binaryTree {\n    tVal v__;\n\
  \    struct binaryTree<tVal> * left;\n    struct binaryTree<tVal> * right;\n\n \
  \   binaryTree(tVal v) : v__(v), left(NULL), right(NULL) {}\n};\n\ntemplate<typename\
  \  tVal>\nbinaryTree<tVal> * find(binaryTree<tVal> * const root, const tVal k) {\n\
  \    if (!root)\n        return NULL;\n    return ((root->v__ < k) ? find(root->right,\
  \ k) :\n            (root->v__ > k ? find(root->left, k) : root));\n}\n\ntemplate<typename\
  \  tVal>\nvoid insert(binaryTree<tVal> * & root, const tVal k) {\n    if (!root)\
  \ {\n        root = new binaryTree<tVal>(k);\n        return;\n    }\n    if (root->v__\
  \ < k)\n        insert(root->right, k);\n    else if (root->v__ > k)\n        insert(root->left,\
  \ k);\n}\n```\n\n## 复杂度\n“插入”和“查找”的平均时间复杂度为 ![](img/00012.jpeg)，其中 ![](img/00013.jpeg)\
  \ 表示树中的节点数。然而如果树是不平衡的，复杂度为 ![](img/00014.jpeg)。\n\n## 15 中序打印 BST\n\n## 解决方案\nBST\
  \ 是二叉树，因此中序遍历从左子树开始，然后是当前节点，最后是右子树。\n\n## 代码\n```cpp\ntemplate<typename  tVal>\n\
  void printInorder(binaryTree<tVal> * const node) {\n    if (!node)\n        return;\n\
  \    printInorder(node->left);\n    std::cout << \" n=\" << node->v__;\n    printInorder(node->right);\n\
  }\n```\n\n## 复杂度\n时间复杂度为 ![](img/00014.jpeg)，其中 ![](img/00013.jpeg) 是树中的节点数。\n\n\
  ## 16 在 BST 中实现 findMin 和 findMax\n\n## 解决方案\n最小键位于最左的节点，而最大键位于最右侧的节点。\n\n## 代码\n\
  ```cpp\ntemplate<typename  tVal>\nbinaryTree<tVal> * findMin(binaryTree<tVal> *\
  \ root) {\n    if (!root)\n        return NULL;\n    while (root->left) { root =\
  \ root->left; }\n    return root;\n}\n\ntemplate<typename  tVal>\nbinaryTree<tVal>\
  \ * findMax(binaryTree<tVal> * root) {\n    if (!root)\n        return NULL;\n \
  \   while (root->right) { root = root->right; }\n    return root;\n}\n```\n\n##\
  \ 复杂度\n平均时间复杂度为 ![](img/00012.jpeg)，其中 ![](img/00013.jpeg) 是树中的节点数。然而如果树是不平衡的，复杂度为\
  \ ![](img/00014.jpeg)。\n\n## 17 在 BST 中实现 deleteNode\n\n## 解决方案\n代码 `deleteNode()`\
  \ 首先在树中查找要删除的键。如果没有该键，算法返回。否则，有两种情况：\n* 如果节点是内部节点，`deleteNode()` 在以找到键的节点为根的左子树中找到最大键。这个最大键替换所搜索的键，因此将其移除。然后通过左子树删除该最大值。\n\
  * 如果节点是外部节点且有一个孩子（在左侧或右侧），则该孩子替换父节点。在任何情况下，外部节点都会释放。以下代码实现了该算法：\n\n## 代码\n```cpp\n\
  template<typename  tVal>\nbinaryTree<tVal> * deleteNode(binaryTree<tVal> * & root,\
  \ const tVal key) {\n    binaryTree<tVal> * tmp;\n    if (!root)\n        return\
  \ NULL;\n    if (key < root->v__)\n        deleteNode(root->left, key);\n    else\
  \ if (key > root->v__)\n        deleteNode(root->right, key);\n    else {\n    \
  \    if (root->left && root->right) {\n            tmp = findMax(root->left);\n\
  \            root->v__ = tmp->v__;\n            deleteNode(root->left, root->v__);\n\
  \        } else if (root->left) {\n            root = root->left;\n        } else\
  \ if (root->right) {\n            root = root->right;\n        } else {\n      \
  \      delete root;\n            root = NULL;\n        }\n    }\n    return root;\n\
  }\n```\n\n## 复杂度\n(注：原文此处复杂度描述在 ![](img/00012.jpeg) 处有完整描述，且若树不平衡，复杂度为 ![](img/00014.jpeg))\n\
  \n## 18 在 BST 中实现最近公共祖先\n\n## 解决方案\n两个节点的最近公共祖先 (LCA) 是从根节点开始，通过向左或向右移动，直到满足这些条件或到达外部节点的\
  \ ![](img/0017.jpeg) 或者 ![](img/0018.jpeg)。\n\n## 代码\n```cpp\ntemplate<typename\
  \  tVal>\nbinaryTree<tVal> * lca(binaryTree<tVal> * const root, binaryTree<tVal>\
  \ * const n1, binaryTree<tVal> * const n2) {\n    if (!root || !n1 || !n2)\n   \
  \     return NULL;\n    while (true) {\n        if ((n1->v__ < root->v__) && (root->v__\
  \ < n2->v__)) ||\n            (n1->v__ > root->v__) && (root->v__ > n2->v__))\n\
  \            return root;\n        else if (n1->v__ < root->v__)\n            root\
  \ = root->left;\n        else\n            root = root->right;\n    }\n}\n```\n\n\
  ## 复杂度\n平均时间复杂度为 ![](img/00012.jpeg)，其中 ![](img/00013.jpeg) 是树中的节点数。然而如果树是不平衡的，复杂度为\
  \ ![](img/00014.jpeg)。\n\n## 19 检查树是否为 BST\n\n## 解决方案\n可以通过递归检查左子树、当前节点和右子树是否遵循\
  \ BST 顺序。因此，方便通过引用传递一个分析过的键并与当前节点进行比较。\n\n## 代码\n```cpp\ntemplate<typename  tVal>\n\
  bool isBST(binaryTree<tVal> * const root, tVal & prev) {\n    if (!root)\n     \
  \   return true;\n    if (!isBST(root->left, prev))\n        return false;\n   \
  \ if (root->v__ < prev)\n        return false;\n    prev = root->v__;\n    return\
  \ isBST(root->right, prev);\n}\n```\n\n## 复杂度\n最坏情况时间复杂度为 ![](img/00014.jpeg)。\n\
  \n## 20 将双向链转换为 BST\n\n## 解决方案\n将双向链转换为 BST 可以很容易地递归实现。双向链的前向指针可以用作右孩子，后向指针可以用作左孩子。算法从找到链中中间位置的元素开始（这留给练习者完成）。该节点是\
  \ BST 的根。然后递归地计算左侧和右侧。\n\n## 代码\n```cpp\ntemplate<typename  tVal>\nstruct dLL {\n\
  \    tVal v__;\n    struct dLL<tVal> * prev;\n    struct dLL<tVal> * next;\n\n \
  \   dLL(tVal v) : v__(v), prev(NULL), next(NULL) {}\n};\n\ntemplate <typename  tVal>\n\
  dLL<tVal> * findMiddleNode(dLL<tVal> *head);\n```\n\n\n\n\n\n```cpp\n // left 是上\n\
  \n // right 是下一个\n\n template <typename  tVal>\n\n binaryTree<tVal> * doubleListToBST(dLL<tVal>\
  \ * head)\n\n  {\n\n dLL<tVal> * tmp, *p, *q;\n\n // head 和 head->next \n\n if (!head\
  \ || !head->next)\nreturn null;\n\n // 找到中间节点\n      tmp = findMiddleNode(head);\n\
  \n // 找到前驱\n\np = head;\n while (p->next != tmp)\n          p = p->next;\n\n //\
  \ 断开前半部分\np->next = NULL;\n\n // 开始后半部分\n      q = tmp->next;  \ntmp->next = NULL;\n\
  \n // 递归\n      tmp->prex = doubleListToBST(head);\n      tmp->next = doubleListToBST(q);\n\
  \ return tmp;\n\n  }\n```\n\n## 复杂度\n\n时间复杂度为![](img/00014.jpeg)),其中 ![](img/00013.jpeg)\
  \ 是列表中节点数量。\n\n## 21 将二叉搜索树转换为双向链表\n\n## 解决方案\n\n通过递归可以轻松将二叉搜索树转换为双向链表。节点的右孩子可以作为双向链表的前向指针，左孩子作为后向指针。在开始时会发生特殊情况，即双向链表的尾部指针未定义，如代码所示。\n\
  \n## 代码\n\n```cpp\n template <typename  tVal>\n\n void bstToDoubleList(binaryTree<tVal>\
  \ *root,\n\n binaryTree<tVal> ** head, binaryTree<tVal> ** tail)\n\n  {\n\n if (!root)\n\
  return;\n\n if (root->left)\n          bstToDoubleList(root->left, head, tail);\n\
  \nroot->left = *tail;\n\n if (*tail)\n          (*tail)->right = root;\n\nelse\n\
  \          *head = root;\n\n  *tail = root;\n\n if (root->right)\n          bstToDoubleList(root->right,\
  \ head, tail);\n\n  };\n```\n\n## 复杂度\n\n时间复杂度为![](img/00014.jpeg)),其中 ![](img/00013.jpeg)\
  \ 是列表中节点数量。\n\n## 22 在二叉搜索树中查找第 k 个元素\n\n## 解决方案\n\n如下方代码所示，通过保留一个计数器的引用可以很容易递归地解决该问题。\n\
  \n## 代码\n\n```cpp\n template<typename  tVal>\n\n binaryTree<tVal> * findkth(binaryTree<tVal>\
  \ * const  root,\n\n const  tVal  k, unsigned & count)\n\n  {\n\n if (!root)\nreturn\
  \  NULL;\n\n binaryTree<tVal> * left = findkth(root->left, k, count);\n\n if (left)\n\
  return left;\n\n if (++count == k)\nreturn  root;\n\n return findkth(root->right,\
  \ k, count);\n\n  }\n```\n\n## 复杂度\n\n时间复杂度为![](img/00022.jpeg)),其中 ![](img/00023.jpeg)\
  \ 是要查找的键的位置。\n\n## 23 在给定的区间内打印二叉搜索树中的所有键\n\n## 解决方案\n\n给定两个键 ![](img/00024.jpeg)\
  \ 使得 ![](img/00025.jpeg)，对二叉搜索树进行遍历，如果当前节点的键大于或等于 ![](img/00023.jpeg)，则递归继续处理左子节点。然后检查范围条件，如果满足，则打印当前节点。最后递归继续处理右子节点。\n\
  \n## 代码\n\n```cpp\n template<typename  tVal>\n\n binaryTree<tVal> * rangePrint(binaryTree<tVal>\
  \ * const  root,\n\n const  tVal  k, const  tVal  h)\n\n  {\n\n if (!root)\nreturn\
  \  NULL;\n\n if (root->v__ >= k)\n          rangePrint(root->left, k, h);\n\n if\
  \ (root->v__ >= k && root->v__ <= h)\nstd::cout << \" v=\" << root->v__;\n\n if\
  \ (root->v__ <= h)\n          rangePrint(root->right, k, h);\n\n  }\n```\n\n## 复杂度\n\
  \n最坏时间复杂度为![](img/00014.jpeg)),其中 ![](img/00013.jpeg) 是树中的节点数量。\n\n## 24 合并两棵平衡二叉搜索树\n\
  \n## 解决方案\n\n合并两个二叉搜索树最有效的方法是将它们每一个都存储在数组中。然后合并这两个排序数组，并将结果数组转换回新的二叉搜索树。\n\n## 代码\n\
  \n```cpp\n template<typename  tVal>\n\n void storeInorder(binaryTree<tVal> * const\
  \  root,\n\n  std::vector<tVal> & inorder)\n\n  {\n\n if (!root)\nreturn;\n\n  storeInorder(root->left,\
  \ inorder);\ninorder.push_back(root->v__);\n  storeInorder(root->right, inorder);\n\
  \n  }\n\n template<typename  tVal>\n\n void dumpVector(const std::vector<tVal> &v1)\n\
  \n  {\n\n  std::cout << std::endl;\n  std::vector<tVal>::const_iterator it = v1.begin();\n\
  \n for (; it != v1.end(); it++)\nstd::cout << *it << \" \";\n\nstd::cout << std::endl;\n\
  \n  }\n\n template<typename  tVal>\n\n void merge(const std::vector<tVal> &v1,\n\
  \n const std::vector<tVal> &v2,\n\n  std::vector<tVal> & merged)\n\n  {\n\n unsigned\
  \ m = v1.size(), n = v2.size();\n\n if (merged.size() != n + m)\nreturn;\n\n unsigned\
  \ i = 0, j = 0, k = 0;\n\n while (i < m && j < n)\n\n  {\n\n if (v1[i] < v2[j])\n\
  merged[k] = v1[i++];\nelse\nmerged[k] = v2[j++];\n\n  k++;\n\n  }\n\n while (i <\
  \ m)\nmerged[k++] = v1[i++];\n\n while (j < n)\nmerged[k++] = v2[j++];\n\n  }\n\n\
  \ template<typename  tVal>\n\n binaryTree<tVal> * sortedArrayToBST(const std::vector<tVal>\
  \ &v,\n\n int start, int end)\n\n  {\n\n if (start > end)\nreturn  NULL;\n\n int\
  \ mid = (start + end) / 2;\n\n binaryTree<tVal> *root = new binaryTree<tVal>(v[mid]);\n\
  \n  root->left = sortedArrayToBST(v, start, mid - 1);\n  root->right = sortedArrayToBST(v,\
  \ mid + 1);\n\n return root;\n\n  }\n\n template<typename  tVal>\n\n binaryTree<tVal>\
  \ * mergeTrees(binaryTree<tVal> * const  root1,\n\n binaryTree<tVal> * const  root2)\n\
  \n  {\n\n  std::vector<int> v1;\n\n  storeInorder(root1, v1);\n\n  std::vector<int>\
  \ v2;\n\n  storeInorder(root2, v2);\n\n  std::vector<int> merged(v1.size() + v2.size());\n\
  \n  merge(v1, v2, merged);\n\n  dumpVector(merged);\n\n return sortedArrayToBST(merged,\
  \ 0, merged.size() - 1);\n\n  }\n\n template<typename  tVal>\n\n void dump(binaryTree<tVal>\
  \ * const  root)\n\n  {\n\n if (!root)\nreturn;\n\nstd::cerr << \" v==\" << root->v__\
  \ << \" \";\n\n if (root->left)\n  {\n\nstd::cerr << \" ->left \";\n  dump(root->left);\n\
  \n  }\n\n if (root->right)\n  {\n\nstd::cerr << \" ->right \";\n  dump(root->right);\n\
  \n  }\n\n  }\n```\n\n## 复杂度\n\n该方法的复杂度为![](img/00014.jpeg)),其中 ![](img/00013.jpeg)\
  \ 是两棵树的节点数量。\n\n## 25 在平衡二叉搜索树中找到和为零的三元组\n\n## 解决方案\n\n最优解决方案是将二叉搜索树转换为双向链表。然后就可以遍历列表，对于每个负元素，我们在列表中查找一个和等于当前节点键乘以\
  \ -1 的对。\n\n## 代码\n\n```cpp\n template <typename  tVal>\n\n void bstToDoubleList(binaryTree<tVal>\
  \ *root,\n\n binaryTree<tVal> ** head, binaryTree<tVal> ** tail)\n\n  {\n\n if (!root)\n\
  return;\n\n if (root->left)\n          bstToDoubleList(root->left, head, tail);\n\
  \nroot->left = *tail;\n\n if (*tail)\n          (*tail)->right = root;\n\nelse\n\
  \          *head = root;\n\n  *tail = root;\n\n if (root->right)\n          bstToDoubleList(root->right,\
  \ head, tail);\n\n  };\n\n template <typename  tVal>\n\n bool isPresentInDLL(binaryTree<tVal>\
  \ * head,\n\n binaryTree<tVal> * tail, int  sum)\n\n  {\n\n while (head != tail)\n\
  \n  {\n\n int curr = head->v__ + tail->v__;\n\n if (curr == sum)\nreturn  true;\n\
  \nelse  if (curr > sum)\ntail = tail->left;\n\nelse\n head = head->right;\n\n  }\n\
  \n return  false;\n\n  }\n\n template <typename  tVal>\n\n bool isTripletPresent(binaryTree<tVal>\
  \ *root)\n\n  {\n\n if (!root)\nreturn  false;\n\n binaryTree<tVal>* head = NULL;\n\
  \n binaryTree<tVal>* tail = NULL;\n\n  bstToDoubleList(root, &head, &tail);\n\n\
  \ while ((head->right != tail) && (head->v__ < 0))\n\n  {\n\n if (isPresentInDLL(head->right,\
  \ tail, -1 * head->v__))\nreturn  true;\n\nelse\n          head = head->right;\n\
  \n  }\n\n return  false;\n\n  }\n```\n\n## 复杂度\n\n这部分留给读者作为练习\n\n## 26 实现 B 树\n\n\
  ## 解决方案\n\nB 树允许在对数时间内进行插入和删除，它通常用于读取和写入大块数据的系统，例如数据库或文件系统。\n\n\n\n\n\n在 B 树中，内部节点在预定义的范围内具有可变的子节点![](img/00028.jpeg)。当从节点中插入或删除数据时，该节点的子节点数量会发生变化，因此内部节点可能会被合并或分裂，以确保它们不会超出该范围。B\
  \ 树的每个内部节点都包含一组排序好的键。键充当分离值，如底图所示，它们将树划分为多个子树。因此，![](img/00029.jpeg) 是该树的最小分支因子。\n\
  \n![`bluerwhite.org/btree/tree1.png`](img/00030.jpeg)\n\n`2` 这个因子保证了节点可以被分裂或合并。如果一个内部节点有![](img/00031.jpeg)\
  \ 个键，那么向该节点添加一个键可以通过将该 ![](img/00032.jpeg) 键节点分裂为两个 ![](img/00033.jpeg) 键节点并将该键添加到父节点来实现。每个被分裂的节点都保持了所需的最小键数。同样，如果每个内部节点及其邻居都有![](img/00033.jpeg)\
  \ 个键，则可以通过与邻居合并从内部节点中删除一个键。删除该键会给内部节点留下 ![](img/00034.jpeg) 个键，但合并邻居会增加 ![](img/00035.jpeg)\
  \ 个键，再加上一个来自邻居父节点的键。总数仍为 ![](img/00031.jpeg) 个键。节点的分支数量比该节点存储的键数量多一。B 树通过要求所有叶子节点处于相同深度来保持平衡。\n\
  \n更正式地说，阶数为![](img/00036.jpeg) 的 B 树被定义为满足以下属性的树：\n\n1. 每个节点最多有 ![](img/00037.jpeg)\
  \ 个子节点。\n2. 每个非叶子节点（根节点除外）至少要有 5/images/00038.jpeg) 个子节点。\n3. 如果根节点不是叶子节点，则至少有两个子节点。\n\
  4. 具有 ![](img/00023.jpeg) 个子节点的非叶子节点包含 ![](img/00039.jpeg) 个键。\n5. 所有叶子节点出现在同一层。\n\
  6. 每个内部节点的键充当分离值，将其子树划分。\n\n可以证明，一个高度为 `h` 且所有节点完全填充的 B 树具有![](img/00040.jpeg) 个键。因此，B\
  \ 树的高度为 ![](img/00041.jpeg)，这个值使得最坏情况下的插入、对数查找和删除操作在对数范围内。\n\n## 搜索\n\n此操作类似于搜索二叉搜索树的操作。从根节点开始，从上到下递归地遍历树，在每一层中，搜索选择在搜索值两侧具有分离键的子树。节点内的搜索可以是线性的，也可以是二分的。\n\
  \n## 插入\n\n要插入新键，请搜索树以找到应添加新键的叶子节点：\n\n* 如果节点包含的键少于![](img/00042.jpeg)，则有空间容纳新元素，可以按照顺序插入。\n\
  * 否则，如果节点已满且必须分裂为两个节点：\n    * 在叶子节点的元素和新元素之间选择一个中位数元素。\n    * 小于中位数的值放在新的左节点中，大于中位数的值放在新的右节点中。\n\
  \    * 中位数充当分离值。\n\n分离键被插入到该节点的父节点中，如果父节点已满，则必须对其进行分裂。如果该节点是根节点，我们需要在旧节点上方创建一个新的根节点。\n\
  \n如果分裂一直持续到根节点，它将创建一个具有单个分隔键和两个子节点的新根节点。当节点被分裂时，一个键进入父节点，但会额外增加一个键。\n\n## 删除\n\n\
  该思想是找到并删除该项，然后重构树以恢复其不变性。此操作被留作待练习题。\n\n## 代码\n\n```cpp\n#ifndef BTREE_HEAD_\n\n\
  #define  BTREE_HEAD_ 1\n\n#include  <iostream>\n\nnamespace Tree{\n\n typedef  int\
  \  tKey;\n\n class  BtreeNode;\n\n typedef  BtreeNode * BtreeLink;\n\n class  BtreeNode\n\
  \  {\n\nprivate:\nunsigned t__; // 2t-1 keys, 2t children\n bool leaf__; // is a\
  \ leaf\nunsigned n__; // current number\n tKey * keys__; // array of key\n BtreeLink\
  \ * children__; // ptr to array of children\n\npublic:\n //构造函数\n     BtreeNode(unsigned\
  \  t, bool  leaf) :\n        t__(t), leaf__(leaf), n__(0),\n        keys__(new \
  \ tKey[2 * t__ - 1]),\n        children__(new  BtreeLink[2 * t__])\n      {}; //\
  \ 遍历\n void traverse(unsigned  lev=0)\n  {\nstd::cout << \"lev=\" << lev << \" \"\
  ; // n keys, n+1 childrens\n unsigned i = 0;\n for (; i < n__; i++)\n  {\nstd::cout\
  \ << \" \" << keys__[i];\n```\n\n\n\n\n```cpp\nbtn->children__[0]->insertNonFull(k);\n\
  \n// 修改根节点\n\nroot = btn;\n\n}\n\nelse\n\n    root->insertNonFull(k);\n\n}\n\n}\n\
  \n};;\n\n#endif\n\n## 复杂度\n\n下表提供了平均情况和最坏情况的空间复杂度，同时也报告了搜索、插入和删除的空间及时间复杂度。\n\n|\
  \   | 平均情况 | 最坏情况 |\n| :--- | :--- | :--- |\n| 空间 | ![](img/00043.jpeg) | ![](img/00043.jpeg)\
  \ |\n| 搜索 | ![](img/00044.jpeg) | ![](img/00044.jpeg) |\n| 插入 | ![](img/00044.jpeg)\
  \ | ![](img/00044.jpeg) |\n| 删除 | ![](img/00044.jpeg) | ![](img/00044.jpeg) |\n\n\
  ## 27 实现跳表 (Skiplist)\n\n## 解决方案\n\n跳表允许以平均对数级时间在列表中找到元素。其核心思想是维护额外的指针，这些指针允许如图所示跳过元素。\n\
  \n![`igoro.com/wordpress/wp-content/uploads/2008/07/skiplist.png`](img/00045.jpeg)\n\
  \n跳表有很多层。最底层是一个普通的有序列表。每一高层都充当下方列表的“快道”。具体来说：![](img/00046.jpeg) 层中的元素以某个概率 `p`\
  \ 出现在 ![](img/00047.jpeg) 层（通常 ![](img/00048.jpeg)=0.5）。每个元素平均出现在 ![](img/00049.jpeg)\
  \ 个列表中，最频繁的出现在 ![](img/00050.jpeg) 个列表中。\n\n## 代码\n\n```cpp\n#ifndef SKIP_HEAD_\n\
  #define SKIP_HEAD_\n#include <iostream>\n#define DEBUG2 1\nnamespace Tree{\n\ntypedef\
  \ int num;\ntemplate <typename Tkey, typename Tval>\nclass Skiplist{\nprivate:\n\
  struct node\n{\nTkey key_; // key\nTval val_; // value\nnum size_; // 数组大小 \nnode\
  \ **next_; // 指针数组\nnode(const Tkey key, const Tval val, num size) :\n    key_(key),\
  \ val_(val), size_(size), next_(new node*[size_])\n{\nfor (num i = 0; i < size_;\
  \ ++i) next_[i] = 0;\n}\n};\ntypedef node* const link;\nTkey default_key_; // 跳表中的默认项\n\
  Tval default_val_; // 跳表中的默认值\nlink head_; // 跳表的头节点\nnum lgN_; // 跳表中当前的链接数\nnum\
  \ lgNmax_; // 跳表中最大的链接数\n// 随机扩展跳表\nnum rand_sl_gen__()\n{\nnum i, j, t = rand();\
  \ // t 范围在 [0, RAND_MAX] 之间\n// 生成 j=2, 4, ... i < lgNmax_\n// t > RAND_MAX / 2^i\n\
  for (i = 1, j = 2; i < lgNmax_; i++, j += j)\nif (t > RAND_MAX / j) break;     \
  \       \n// t 是一个小于 1/2^i 的数\nif (i > lgN_) // 扩展当前层\nlgN_ = i; // 呈对数级增长\nreturn\
  \ i;\n}\n// 一个 key 和一个 val\nvoid remove__(link t, Tkey key, num k)\n{\n#ifdef DEBUG2\n\
  std::cerr << \"remove__ \" << t << \" key=\" << key << \" level=\" << k << std::endl;\n\
  #endif\nif (t == 0) return; // 空？\nlink x = t->next_[k];// 下一个单元格\nif ((x != 0)\
  \ && // 非空\n(x->key_ >= key)) // >=\n{\nif (key == x->key_){ // 找到了\nt->next_[k]\
  \ = x->next_[k]; // \n#ifdef DEBUG2\nstd::cerr << \"done\" << std::endl;\n#endif\n\
  if (k == 0) // 可以删除\n{\ndelete x; // 该层不再有链接\nreturn;\n}\n// 尝试移除下方的一个\nremove__(t,\
  \ k - 1);\nreturn;\n}\n// x->key_ < key\n// 尝试在同一层移除\nremove__(t->next_[k], k);\n\
  }\n// 删除所有 keys\nvoid remove_all__(link t, num k)\n{\n#ifdef DEBUG\nstd::cerr <<\
  \ \"remove__ \" << t << \" level=\" << k << std::endl;\n#endif\nif (t == 0) return;\n\
  link x = t->next_[k];\nif (x != 0)\n{\nt->next_[k] = x->next_[k]; // \nif (k ==\
  \ 0) // 可以删除\n{\ndelete x; // 该层不再有链接\nreturn;\n}\n// 尝试移除下方的一个\nremove_all__(t,\
  \ k - 1);\n}\n// x->key_ >= key\n// 尝试在同一层移除\nremove_all__(t->next_[k], k);\n}\n\
  // 给定 link 和当前层，搜索 key\nTval search__(link t, Tkey key, num k) const\n{\n#ifdef\
  \ DEBUG\nstd::cerr << \"search__ \" << t << \" key=\" << key << \" level=\" << k\
  \ << std::endl;\n#endif\nif (t == 0) // 搜索失败\nreturn default_val_;\n#ifdef DEBUG\n\
  std::cerr << \"key =\" << key << \" val = \" << t->val_ << std::endl;\n#endif\n\
  if (key == t->key_) // 搜索成功\nreturn t->val_;\nlink x = t->next_[k]; // 到下一层\nif\
  \ ((x == 0) || // 空？\n(key < x->key_)) // key < 下一层的 key\n{\nif (k == 0) // 没有可用层\n\
  return default_val_;\n// 尝试上一层\nsearch__(t, k - 1);\nreturn;\n}\n// key > x->key_\n\
  // 在同一层继续搜索\nsearch__(x, key);\n}\n// 在层 k 插入 link 指向的新节点\nvoid insert__(link t,\
  \ link x, num k)\n{\n#ifdef DEBUG\nstd::cerr << \"insert__ \" << t << \" \" << x\
  \ << \" level=\" << k << \" key=\" << x->key_ << \" value=\" << x->val_ << std::endl;\n\
  #endif\nTkey key = x->key_; // 当前 key\nlink tk = t->next_[k]; // 下一层的链接\nif ((tk\
  \ == 0) || // 空？\n(key < tk->key_)) // key < 下一层的 key\n{\nif (k < x->size_) // 该节点允许该层？\n\
  { // 插入：\nx->next_[k] = tk;// 新节点的后继是 tk\nt->next_[k] = x; // t 的后继是 x\n#ifdef DEBUG\n\
  std::cerr << \"\\tdone inserted key=\" << key << \" value=\" << x->val_ << std::endl;\n\
  #endif\n}\nif (k == 0) // 层 0\nreturn; // 返回\n// k >= x->size__\n// 向下插入\ninsert__(t,\
  \ x, k - 1);\nreturn;\n}\n// x->key_ >= key\n// 尝试在同一层移除（注：此处原文为 insert，逻辑上为处理位置）\n\
  insert__(t->next_[k], k);\n}\npublic:\nSkiplist(num lgNmax = 5) :\n    head_(new\
  \ node(default_key_, default_val_, lgNmax)), lgN_(0), lgNmax_(lgNmax) {}\n~Skiplist(){\
  \ remove_all__(head_, lgN_); };\n\nTval search__(link t, Tkey key, num k) const\n\
  {\n#ifdef DEBUG\nstd::cerr << \"search__ \" << t << \" key=\" << key << \" level=\"\
  \ << k << std::endl;\n#endif\nif (t == 0) // 搜索失败\nreturn default_val_;\n#ifdef\
  \ DEBUG\nstd::cerr << \"key =\" << key << \" val = \" << t->val_ << std::endl;\n\
  #endif\nif (key == t->key_) // 搜索成功\nreturn t->val_;\nlink x = t->next_[k]; // 到下一层\n\
  if ((x == 0) || // 空？\n(key < x->key_)) // key < 下一层的 key\n{\nif (k == 0) // 没有可用层\n\
  return default_val_;\n// 尝试上一层\nsearch__(t, k - 1);\nreturn;\n}\n// key > x->key_\n\
  // 在同一层继续搜索\nsearch__(x, key);\n}\n\nvoid insert__(link t, link x, num k)\n{\n#ifdef\
  \ DEBUG\nstd::cerr << \"insert__ \" << t << \" \" << x << \" level=\" << k << \"\
  \ key=\" << x->key_ << \" value=\" << x->val_ << std::endl;\n#endif\nTkey key =\
  \ x->key_; // 当前 key\nlink tk = t->next_[k]; // 下一层的链接\nif ((tk == 0) || // 空？\n\
  (key < tk->key_)) // key < 下一层的 key\n{\nif (k < x->size_) // 该节点允许该层？\n{ // 插入：\n\
  x->next_[k] = tk;// 新节点的后继是 tk\nt->next_[k] = x; // t 的后继是 x\n#ifdef DEBUG\nstd::cerr\
  \ << \"\\tdone inserted key=\" << key << \" value=\" << x->val_ << std::endl;\n\
  #endif\n}\nif (k == 0) // 层 0\nreturn; // 返回\n// k >= x->size__\n// 向下插入\ninsert__(t,\
  \ x, k - 1);\nreturn;\n}\n// x->key_ >= key\n// 尝试在同一层移除\ninsert__(t->next_[k],\
  \ k);\n}\n};\n```\n\n```## 28 实现字典树 (Tries)\n\n## 解决方案\n\n字典树是一种有序树形数据结构，用于存储动态集合或关联数组，其键通常是字符串。通常字符串不会被显式记忆，相反，每个键在树中的一个位置定义了与该位置关联的键。节点的所有后代都有该节点关联字符串的公共前缀，根节点与空字符串关联。在下面的示例中，字典树适用于\
  \ 26 个不同符号的字母表，每个子节点标识插入字符串的当前符号。图中提供了一个示例。\n\n```cpp\nifndef TRIE_HEAD_\n#define\
  \ TRIE_HEAD_ 1\n#include <iostream>\n// 假设字典树仅用于 26 个字符\n#define BRANCHLEVEL 26\n\
  namespace Tree{\n```\n\n\n\n\n\n```cpp\n // 这个字典树（trie）用于隐式记忆键\n\n template <typename\
  \ Tkey>\n\n class Trie{\nprivate:\n    // 节点包含一个指向节点数组的指针\n    struct node {\n \
  \       // 该节点的分支\n        node **next;\n        node() : next(new node*[BRANCHLEVEL])\
  \ {\n            for (unsigned int i = 0; i < BRANCHLEVEL; i++)\n              \
  \  next[i] = NULL;\n        }\n    };\n    typedef node *link;\n    link head; //\
  \ 根节点\n\n    // 递归删除节点\n    //\n    void deleteTrie__(link l) {\n        if (!l)\n\
  \            return;\n        else {\n            for (unsigned int i = 0; i < BRANCHLEVEL;\
  \ i++)\n                deleteTrie__(l->next[i]);\n            delete[] l;\n   \
  \     }\n    }\n\n    // 针对 Tkey == std::string 的特殊版本\n    // 等等于对每个字母进行哈希\n   \
  \ //\n    unsigned digit(std::string & k, unsigned d) {\n        if (d < k.length())\n\
  \            return k[d] % BRANCHLEVEL;\n        else\n            return BRANCHLEVEL;\n\
  \    }\n\n    // 从 link l 的 digit d 开始搜索键 k\n    bool search__(link l, Tkey k, unsigned\
  \ d) {\n        // 从 k 获取第 d 个分支值\n        unsigned int i = digit(k, d);\n     \
  \   if (i == BRANCHLEVEL) // 找到\n            return true;\n        if (!l)\n   \
  \         return false;\n        // 树中的 i 个分支\n        return search__(l->next[i],\
  \ k, d + 1);\n    }\n\n    // 考虑键 k 进行递归插入\n    void insert__(link& l, Tkey k, unsigned\
  \ d) {\n        // 从 k 获取第 d 个分支值\n        unsigned int i = digit(k, d);\n     \
  \   if (i == BRANCHLEVEL)\n            return;\n        if (!l)\n            l =\
  \ new node();\n            insert__(l->next[i], k, d + 1);\n    }\n\npublic:\n \
  \   Trie() : head(NULL) {};\n    ~Trie() {\n        deleteTrie__(head);\n    }\n\
  \    bool search(Tkey k) {\n        return search__(head, k, 0);\n    }\n    void\
  \ insert(Tkey k) {\n        insert__(head, k, 0);\n    }\n}; // 类 Trie 结束\n}; //\
  \ 命名空间 Tree 结束\n```\n\n# 29 实现线段树\n\n## 解决方案\n\n给定一个 ![](img/00053.jpeg)，线段树允许：\n\
  \na) 在时间 ![](img/00056.jpeg) 内找到范围 ![](img/00054.jpeg) 内元素之和，其中 ![](img/00055.jpeg)\
  \ \n\nb) 更新一个特定的元素 ![](img/00057.jpeg)，使得 ![](img/00058.jpeg)\n\n线段树具有以下属性\n\n*\
  \ 叶子节点是![](img/00059.jpeg) 的元素\n* 每个内部节点代表叶子节点的合并操作。不同类型的问题对合并操作有不同的表示方式。在下面的代码中，我们简单地使用一个求和该节点下所有叶子的合并操作\n\
  \n线段树通常用数组表示，对于每个节点 ![](img/00046.jpeg)，左子节点位于 ![](img/00060.jpeg)，右子节点位于 ![](img/00061.jpeg)\n\
  \n![[1..7] 的和区间树](5/images/00062.jpeg)\n\n## 代码\n\n```cpp\ninline int getMid(int\
  \ s, int e) { return s + (e - s) / 2; }\n\nint getSumUtil(const int segmentTree[],\
  \ int segmentStart, int segmentEnd,\n int queryStart, int queryEnd, int index) {\n\
  \    // 包含范围内\n    if (queryStart <= segmentStart && segmentEnd <= queryEnd)\n \
  \       return segmentTree[index];\n    // 如果在外部\n    if (segmentEnd < queryStart\
  \ || segmentStart > queryEnd)\n        return 0;\n    // 如果此段与给定范围重叠\n    unsigned\
  \ mid = getMid(segmentStart, segmentEnd);\n    // 获取中间点，在线段树中向左和向右移动\n    return\
  \ getSumUtil(segmentTree, segmentStart, mid, queryStart, queryEnd, 2 * index + 1)\
  \ +\n           getSumUtil(segmentTree, mid + 1, segmentEnd, queryStart, queryEnd,\
  \ 2 * index + 2);\n}\n\nvoid updateValueUtil(int segmentTree[], int segmentStart,\
  \ int segmentEnd,\n int whereToUpdate, int valueToAdd, int index) {\n    // 不是正确的区间\n\
  \    if (whereToUpdate < segmentStart || whereToUpdate > segmentEnd)\n        return;\n\
  \    // 更新\n    segmentTree[index] += valueToAdd;\n    if (segmentEnd != segmentStart)\
  \ {\n        // 递归获取点向左或向右\n        int mid = getMid(segmentStart, segmentEnd);\n\
  \        updateValueUtil(segmentTree, segmentStart, mid, whereToUpdate, 2 * index\
  \ + 1);\n        updateValueUtil(segmentTree, mid + 1, segmentEnd, whereToUpdate,\
  \ 2 * index + 2);\n    }\n}\n\nvoid updateValue(int array[], int segmentTree[],\
  \ int n,\n int whereToUpdate, int newValue) {\n    if (whereToUpdate < 0 || whereToUpdate\
  \ > n - 1)\n        return;\n    int diff = newValue - array[whereToUpdate];\n \
  \   array[whereToUpdate] = newValue;\n    updateValueUtil(segmentTree, 0, n - 1,\
  \ whereToUpdate, diff, 0);\n}\n\nint getSum(int segmentTree[], int n,\n int queryStart,\
  \ int queryEnd) {\n    // 检查错误的输入\n    if (queryStart < 0 || queryEnd > n - 1 ||\
  \ queryStart > queryEnd)\n        return -1;\n    return getSumUtil(segmentTree,\
  \ 0, n - 1, queryStart, queryEnd, 0);\n}\n\nint constructSTUtil(const int array[],\
  \ int segmentTree[],\n int segmentStart, int segmentEnd, int segmentIndex) {\n \
  \   if (segmentStart == segmentEnd) {\n        segmentTree[segmentIndex] = array[segmentStart];\n\
  \        return array[segmentStart];\n    }\n    int mid = getMid(segmentStart,\
  \ segmentEnd);\n    segmentTree[segmentIndex] = constructSTUtil(array, segmentStart,\
  \ mid, segmentIndex * 2 + 1) +\n        constructSTUtil(array, mid + 1, segmentEnd,\
  \ segmentIndex * 2 + 2);\n    return segmentTree[segmentIndex];\n}\n\nint *constructSegmentTree(int\
  \ array[], int n) {\n    int x = (int)(log2(n)); // 线段树的高度\n    int max_size = 2\
  \ * (int)pow(2, x) - 1; // 线段树的最大大小\n    int *segmentTree = new int[max_size];\n\
  \    constructSTUtil(array, segmentTree, 0, n - 1, 0);\n    return segmentTree;\n\
  }\n```\n\n## 复杂度\n复杂度\n\n# 30 实现区间最小值查询\n\n## 解决方案\n\n给定一个 ![](img/00053.jpeg)，线段树允许：\n\
