  \n# 4. 卡兰数\n\n卡兰数在数学上的定义为：\n\n![](img/0050.jpeg)\n\n这些数在组合数学中具有多种应用。例如： ![](img/0051.jpeg)\
  \ 统计包含 ![](img/0052.jpeg) 对正确匹配括号的表达式数量（例如 ![](img/0053.jpeg)）。此外， ![](img/0054.jpeg)\
  \ 是因子可以完全加括号的不同方法（例如 ![](img/0055.jpeg)）。再加之，卡兰兰数 ![](img/0056.jpeg) 也是具有 ![](img/0057.jpeg)\
  \ 个叶子的满二叉树的数量。对于应用的完整描述，请参考维基百科[2。\n\n## 解决方案\n提供的解决方案是直接实现递归定义。\n\n```cpp\nunsigned\
  \ int cat(unsigned int n, std::vector<unsigned int> &table) {\n  if (n == 0) return\
  \ 1;\n  for (unsigned int i = 0; i < n; i++) {\n    if (!table[i])\n      table[i]\
  \ = cat(i, table);\n    if (!table[n - 1 - i])\n      table[n - 1 - i] = cat(n -\
  \ 1 - i, table);\n    table[n] += table[i] * table[n - 1 - i];\n  }\n  return table[n];\n\
  }\n```\n\n## 复杂度\n相对于输入是线性的 ![](img/0058.jpeg)。\n\n## 解决方案\n注意到我们可以利用定义中的对称性。例如\
  \ ![](img/0059.jpeg)。这一观察导致了以下递归实现。\n\n```cpp\nunsigned int catalan2(unsigned int\
  \ n) {\n```\n\n\n\n\n```cpp\nif (n == 0) return 1;\n\nunsigned int sum = 0;\n\n\
  for (unsigned int i = 0; i < n/2; ++i) {\n    sum += catalan(i) * catalan(n-1-i);\n\
  }\n\nsum *= 2;\n\nif (n % 2) {\n    unsigned int c = catalan(n/2);\n    sum += c\
  \ * c;\n}\n\nreturn sum;\n}\n```\n\n# 5. 整数背包 – 背包最大容量为 `C`，有 `n` 个物品，每个物品的重量为 `w[i]`，价值为\
  \ `v[i]`。在不超过背包最大容量的情况下，使背包中的总价值最大。\n\n## 解决方案\n\n物品可以放入背包，也可以不放入：如果放入了该物品，则背包中的总价值将增加\
  \ `v[i]`，容量将减少 `w[i]`。如果不放入该物品，则容量保持不变。这意味着解决方案可以通过递归来获得。在数学上，我们可以定义：\n\n[图片]\n\n\
  [图片]\n\n在剩余部分，我们提供了两种不同的解决方案：第一种是自顶向下的递归，第二种是基于动态规划的，通过在辅助数组中存储部分结果来自底向上地构建。\n\n\
  ## 代码\n\n```cpp\nunsigned int knapRecursive(const unsigned int C,\n  const unsigned\
  \ int w[],\n  const unsigned int v[],\n  const unsigned int n)\n{\n  if (n == 0\
  \ || C == 0)\n    return 0;\n  if (w[n - 1] > C)\n    return knapRecursive(C, w,\
  \ v, n - 1);\n  else  return std::max(v[n - 1] +\n  knapRecursive(C - w[n - 1],\
  \ w, v, n - 1),\n    knapRecursive(C, w, v, n - 1));\n}\n\nunsigned int knapSack(const\
  \ unsigned int C,\n  const unsigned int w[],\n  const unsigned int v[],\n  const\
  \ unsigned int n)\n{\n  Matrix<unsigned int> table(n + 1, C + 1);\n  for (unsigned\
  \ int i = 0; i <= n; ++i)\n    for (unsigned int j = 0; j <= C; ++j)\n      {\n\
  \        if (i == 0 || j == 0)\n          table(i, j) = 0;\n        else  if (w[i\
  \ - 1] <= j)\n          table(i, j) = std::max(v[i - 1] + table(i - 1, j - w[i -\
  \ 1]),\n                          table(i - 1, j));\n        else\n          table(i,\
  \ j) = table(i - 1, j);\n      }\n  return table(n, C);\n}\n```\n\n## 复杂度\n\n时间复杂度为伪线性\
  \ `[图片]`，空间复杂度也为伪线性 `[图片]`。\n\n# 6. 编辑距离 - 给定两个字符串，计算它们之间的编辑距离\n\n## 解决方案\n\n编辑距离是将一个字符串转换为另一个字符串所需的最小编辑次数。为了简单起见，我们假设插入和删除的代价为\
  \ 1。考虑两个字符串 `[图片]` 和 `[图片]`，我们可以为扫描 `S1` 定义一个光标，为扫描 `S2` 定义一个光标。编辑距离 `[图片]` 定义如下：\n\
  \n[图片]\n\n换句话说：如果字符对齐，则该问题的编辑距离将不会增加；否则我们需要通过减小 `S1`、`S2` 或两者的尺寸来对齐字符串。\n\n现在让我们考虑基础情况。显然，`[图片]`\
  \ 是成立的，因为这种情况代表了空字符串。我们也可以定义 `[图片]` 和 `[图片]`，因为在这种情况下，我们正在将长度为 `[图片]`（分别 `[图片]`）的字符串与空字符串进行比较。我们可以使用上述定义通过列出所有值\
  \ `[图片]` 来计算编辑距离，复杂度为 `[图片]`。\n\n然而，通过考虑到计算当前列需要前一列的输入，我们可以显著提高复杂度。这将允许我们只需要 `[图片]`。代码使用初始化每一列的\
  \ `[图片]`，并表示位置 `[图片]` 的最大代价。然后，我们有两个循环：外层循环扫描字符串 `[图片]`，内层循环扫描字符串 `[图片]` 并更新 `[图片]`\
  \ 的代价。当内层循环结束时，根据 `[图片]` 交换 `[图片]` 以满足 `[图片]`。这些情况留作练习。\n\n## 代码\n\n```cpp\nunsigned\
  \ int editDistance(const std::string &s1, const std::string &s2)\n{\n  const size_t\
  \ len1 = s1.size(), len2 = s2.size();\n  std::vector<unsigned int> col(len2 + 1),\
  \ prevCol(len2 + 1);\n  std::iota(prevCol.begin(), prevCol.end(), 0);\n  for (unsigned\
  \ int i = 0; i < len1; i++)\n  {\n    col[0] = i + 1;\n    for (unsigned int j =\
  \ 0; j < len2; j++)\n    {\n      col[j + 1] = std::min(col[j] + 1, std::min(prevCol[j\
  \ + 1] + 1, prevCol[j] + (s1[i] == s2[j] ? 0 : 1)));\n    }\n    col.swap(prevCol);\n\
  \  }\n  return prevCol[len2];\n}\n```\n\n#7. 给定一个序列和每行可以容纳单词的最大数量，整齐地打印序列。假设单词不会跨行。\n\
  \n## 解决方案\n\n设 `[图片]` 为单词的长度。直观上，第一个单词的代价是 `[图片]`，对于剩余的单词，我们可以初始化 `[图片]` 并考虑以下递归关系，我们构建\
  \ `[图片]` 的最优代价：\n\n然而，这种定义尚未满足我们的目标，原因有两个：首先，`[图片]` 只考虑了前一个单词的代价，而它应该考虑能够放入一行的所有单词，直到代价变为负数。因此，我们需要重新定义\
  \ `[图片]`。其次，代价应该是非线性的，因为我们希望平衡行之间（例如，在行内留两个位置的代价直观上比留在另一行更高）。这个需求可以通过多种方式实现，例如通过定义\
  \ `[图片]` 或更方便地使用位运算：`[图片]`。总结来说，我们的目标是找到 `[图片]` 使得 `[图片]`。在代码中，向量 `[图片]` 将包含添加到给定行的最终剩余值。当需要换行时，这些值将会增加。\n\
  \n## 代码\n\n```cpp\nvoid neatPrint(std::vector<unsigned int> & M, const std::vector<unsigned\
  \ int> & length, unsigned int max, int n)\n{\n  int penalty;\n  for (int i = 0;\
  \ i < n; i++)\n  {\n    penalty = max - length[i];\n    M[i] = std::min(M[i], (i\
  \ - 1 < 0 ? 0 : M[i - 1]) + (1 << penalty));\n    for (int j = i - 1; j >= 0; j--)\n\
  \    {\n      penalty -= (length[j] + 1);\n      if (penalty < 0)\n        break;\
  \ // generate next line\n      M[i] = std::min(M[i], ((j - 1 < 0) ? 0 : M[j - 1])\
  \ + (1 << penalty));\n    }\n  }\n}\n```\n\n\n\n\n\n```cpp\n            (1 << penalty));\n\
  \      }\n  }\n}\n\nvoid solveNeatPrint(const std::vector<unsigned int> & length,\
  \ unsigned int max)\n{\n  int n = length.size();\n  std::vector<unsigned int> M(n,\
  \ std::numeric_limits<unsigned int>::max());\n  neatPrint(M, length, max, n);\n\
  \  for (int i = 0; i < n; ++i)\n    std::cout << M[i] << ' ';\n  std::cout << std::endl;\n\
  }\n```\n\n## 复杂度\n注意 ![](img/00107.jpeg) 可以在输入大小的线性时间内计算，而 ![](img/00108.jpeg) 可以在\
  \ ![](img/00109.jpeg) 时间计算。\n\n# 8. 蛋落下问题 – 给定 k 个蛋和一栋 n 层的楼，找到最少所需的测试次数，以确定蛋掉落不会破碎的最低楼层。\n\
  \n## 解决方案\n这是一个经典的谜题，在面试中经常被问到。设 ![](img/00110.jpeg) 为给定 ![](img/00005.jpeg) 个蛋和\
  \ n 层楼时的最小尝试次数。可以通过考虑以下情况计算动态解：当我们从 f 层掉下一个蛋时，只有两种可能的结果：\n\na) 如果蛋碎了，我们就剩下 ![](img/00111.jpeg)\
  \ 个蛋，我们需要检查 ![](img/00112.jpeg) 楼层\n\nb) 如果蛋没有碎，我们还有 ![](img/00005.jpeg) 个蛋以及剩下的\
  \ ![](img/00113.jpeg) 层楼\n\n由于我们想最小化尝试次数，在最坏的情况下，我们必须考虑 a) 和 b) 之间的最大值。关系变为：\n\n\
  ![](img/00114.jpeg)\n\n![](img/00115.jpeg)\n\n基础情况是 ![](img/00116.jpeg)，因为如果我们只有一个蛋，除了一层一层向上爬外没有其他选择；且\
  \ ![](img/00117.jpeg)，因为如果我们只有一层楼，我们只需要检查它即可。此外，我们可以定义 ![](img/00118.jpeg) 和 ![](img/00119.jpeg)，因为这些是边界情况。\n\
  \n这种刻画导致了下所示的直接递归实现，我们在一个辅助 ![](img/00120.jpeg) 中记录了部分解，以避免反复计算这些解。\n\n## 代码\n```cpp\n\
  int eggDropHelper(unsigned int k, unsigned int n, Matrix<int> & table)\n{\n  if\
  \ (n == 1 || n == 0)\n    return n;\n  if (k == 1)\n    return n;\n  if (!k)\n \
  \   return 0;\n  unsigned int min = std::numeric_limits<unsigned int>::max();\n\
  \  unsigned int res;\n  for (unsigned int f = 1; f <= n; ++f)\n  {\n    res = std::max(\n\
  \      ((table(k - 1, f - 1) == -1) ?\n      table(k - 1, f - 1) = eggDropHelper(k\
  \ - 1, f - 1, table) :\n      table(k - 1, f - 1)),\n      (table(k, n - f) == -1)\
  \ ?\n      table(k, n - f) = eggDropHelper(k, n - f, table) :\n      table(k, n\
  \ - f)));\n    if (res < min)\n      min = res;\n  }\n  return min + 1;\n}\n\nint\
  \ eggDrop(unsigned int k, unsigned int n)\n{\n  Matrix<int> table(k+1, n+1, -1);\n\
  \  return eggDropHelper(k, n);\n}\n```\n\n## 复杂度\nDP 解决方案留作练习。一个直接的实现需要在表中 ![](img/00121.jpeg)\
  \ 个条目，每个条目最多计算 ![](img/00008.jpeg) 次。因此，该算法在 ![](img/00122.jpeg) 时间内运行。如果我们考虑到 ![](img/00125.jpeg)\
  \ 的最优楼层 ![](img/00124.jpeg) 至少大于或等于 ![](img/00126.jpeg) 的楼层，时间复杂度可以降低到 ![](img/00123.jpeg)，这样我们可以避免从\
  \ f 重新开始最小值。此外，证明函数 ![](img/00127.jpeg) 在 f 上是凸的可能有用，这样最小值是唯一的可以通过线性扫描计算。\n\n# 9.\
  \ 爬楼梯 – 有一个有 n 级阶的楼梯。你每次可以爬一级或两级。有多少种不同的方法爬上楼梯？\n\n## 解决方案\n让我们尝试几个例子：如果我们只有一个阶，那么只有一种爬楼梯的方法；如果我们有两个阶，那么就有二种方法（例如：1\
  \ 阶、1 阶，或 2 阶）；如果我们有三阶，那么就有三种方法。下表给出了更多例子：\n\n| 阶数 | 方案数 | \n| :--- | :--- |\n|\
  \ 1 | 1 |\n| 2 | 2 |\n| 3 | 3 |\n| 4 | 5 |\n| 5 | 8 |\n\n我们注意到每一阶的方案数是前几阶方案数的之和，即\
  \ ![](img/00128.jpeg)。这个公式有一个直观解释：对于 n 阶，跳跃方案遵循斐波那契数列。\n\n## 代码\n```cpp\nunsigned\
  \ long jump(unsigned int n)\n{\n  if (n == 1) return 1;\n  if (n == 2) return 2;\n\
  \  unsigned long current = 0, prev = 2;\n  for (unsigned int i = 3; i <= n; i++)\n\
  \  {\n    current = prev + prev; // 注：此处原文逻辑可能有误，此处翻译\n  }\n}\n```\n\n# 10. 跳跃数组\
  \ – 给定一个非负数组，从第一个元素开始，以最少的跳跃次数到达末尾。跳跃不能超过当前位置。\n\n## 解决方案\n对于 ![](img/00131.jpeg)，基础情况是\
  \ ![](img/00132.jpeg)。否则，可以在每个 ![](img/00134.jpeg) 位置计算数学公式。\n\n## 代码\n```cpp\n\
