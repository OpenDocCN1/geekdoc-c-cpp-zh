  ## Solution\n假设一个无符号整数是 32 位的，我们要交换位置 0 和位置 1 的位。为了选择所有偶数位，我们可以与位掩码 `0xAAAAAAAA`\
  \ 进行按位与，这是一个偶数位全置 1 的 32 位数字（`0xA`是十进制的 10，二进制为 1010）。为了选择所有奇数位，我们可以与位掩码 `0x55555555`\
  \ 进行按位与，这是一个所有偶数位置 1 的数字（0x5 是十进制的 5，二进制为 0101）。然后我们需要分别向左（或向右）移动一位，并将两个中间结果进行按位或。\n\
  \n## Code\n```cpp\nunsigned int swapBits(unsigned int x)\n{\n    unsigned int evenBits\
  \ = x & 0xAAAAAAAA;\n    unsigned int oddBits = x & 0x55555555;\n    evenBits >>=\
  \ 1;\n    oddBits <<= 1;\n    return (evenBits | oddBits);\n}\n```\n\n# 2. 打印无符号整数的二进制表示\n\
  ## Solution\n一个简单的解决方案是将位与数字 `i` 进行按位与操作\n\n## Code\n```cpp\nvoid bin(unsigned n)\n\
  {\n    for (unsigned int i = 1 << 31; i > 0; i = i >> 1)\n        if (n & i) std::cout\
  \ << 1;\n        else std::cout << 0;\n}\n```\n\n# 3. 计算无符号数是否为 2 的幂\n## Solution\n\
  假设该数不为零。如果它是 2 的幂，那么唯一置 1 的位就在位置 0。在这种情况下，我们减去 1，因此 0 左侧的所有位都会被置零。因此，正数 `n` 是 2\
  \ 的幂当且仅当 `n & (n - 1)` 为 0 时。\n\n## Code\n```cpp\nbool isPowerOf(unsigned n)\n{\
  \ return n && (!(n & (n - 1))); }\n}\n```\n\n# 4. 设置第 i 位\n## Solution\n对于数字 `n`，我们可以设置第\
  \ i 位\n\n# 5. 取消第 i 位\n## Solution\n对于数字 `n`，我们可以取消第 i 位\n\n# 6. 翻转第 i 位\n## Solution\n\
  对于数字 `n`，我们可以翻转第 i 位\n\n# 7. 给定一个仅有一个置位的无符号数，找到该位的位置\n## Solution\n如果只有一个位置 1，那么该数必须是\
  \ 2 的幂。为了识别位置，我们可以将该数与相应的位掩码进行按位与。\n\n## Code\n```cpp\nunsigned int findPosition(unsigned\
  \ int n)\n{\n    unsigned int i = 1, pos = 1;\n    while (!(i & n))\n    {\n   \
  \     i = i << 1;\n        ++pos;\n    }\n    return pos;\n}\n```\n## Solution\n\
  另一种解决方案是使用对数来返回置位的位置。如果 `n` 不是 2 的幂，则返回-1。\n\n## Code\n```cpp\nint findPosition2(unsigned\
  \ int n)\n{\n    if (n & (n - 1))\n        return -1;\n    return (unsigned int)((double)n)\
  \ / log(2.0)) + 1;\n}\n```\n## Solution\n另一种解决方案也是有效的。关键直觉是对表示无符号整数的位进行对数级搜索。\n\n\
  ## Code\n```cpp\nint findPosition3(unsigned int n)\n{\n    if (n & (n - 1))\n  \
  \      return -1;\n    if (n == 1 << 31)\n        return 32;\n    unsigned int position\
  \ = 16;\n    unsigned int half = 1 << 15;\n    unsigned int stride = 16;\n    while\
  \ (1)\n    {\n        if (n == half)\n            return position;\n        else\
  \ if (n > half)\n        {\n            n = n >> stride;\n            position =\
  \ position + (stride >> 1);\n        }\n        else\n        {\n            n =\
  \ n & ((1 << stride) - 1);\n            position = position - (stride >> 1);\n \
  \       }\n    }\n}\n```\n```\n\n\n\n\n```c\nhalf = half >> (stride >> 1);\nstride\
  \ >>= 1;\n}\n\nreturn position;\n}\n```\n\n# 8. 计算无符号数中 1 的个数\n\n## 解决方案\n\n我们可以简单地循环并计数位，复杂度为![](img/00017.jpeg)，其中\
  \ ![](img/00016.jpeg)是无符号数的位数。\n\n## 代码\n\n```c\nunsigned int countBits(unsigned\
  \ int n)\n{\n  unsigned int count = 0;\n  while (n)\n  {\n    count += n & 1;\n\
  \    n >>= 1;\n  }\n  return count;\n}\n```\n\n## 针对稀疏位图的解决方案\n\n该方案对于稀疏的无符号数效果更好，因为它的运行时间与设置为\
  \ 1 的位数成正比。`n &= (n – 1)` 这一行将位图中最右侧的 1 设置为 0。\n\n## 代码\n\n```c\nunsigned int countBitsSparse(unsigned\
  \ int n)\n{\n  unsigned int count = 0;\n  while (n)\n  {\n    count++;\n    n &=\
  \ (n - 1);\n  }\n  return count;\n}\n```\n\n## 针对密集位图的解决方案\n\n该方案对于密集位图效果更好，因为它的运行时间与设置为\
  \ 0 的位数成正比。首先，你必须翻转所有位，然后从 ![](img/00018.jpeg)中减去设置位的个数。`n &= (n – 1)` 这一行将位图中最右侧的\
  \ 1 设置为 0。\n\n## 代码\n\n```c\nunsigned int countBitsDense(unsigned int n)\n{\n  unsigned\
  \ int count = 8 * sizeof(unsigned int);\n  n = ~n;\n  while (n)\n  {\n    count--;\n\
  \    n &= (n - 1);\n  }\n  return count;\n}\n```\n\n## 针对 32 位整数的解决方案\n\n该方案对于无符号\
  \ 32 位整数效果更好。在这里你使用了一个额外的查找表，包含 8 位 ![](img/00019.jpeg)数字二进制表示中所包含的 1 的个数。使用预计算的查找表是加速查找表操作的常用技巧。\n\
  \n## 代码\n\n```c\nstatic int bitInChar[256];\nvoid fillBitsInChar()\n{\n  for (unsigned\
  \ int i = 0; i < 256; ++i)\n    bitInChar[i] = countBits(i);\n}\nunsigned int countBitsConstantFor32BitsInt(unsigned\
  \ int n)\n{\n  return bitInChar[n & 0xffu] +\n         bitInChar[(n >> 8) & 0xffu]\
  \ +\n         bitInChar[(n >> 16) & 0xffu] +\n         bitInChar[(n >> 24) & 0xffu];\n\
  }\n```\n\n# 9. 不使用算术运算符相加两个数字\n\n## 解决方案\n\n我们可以使用异或运算来相两个位，使用与运算来计算进位。在代码中我们还实现了减法操作。\n\
  \n## 代码\n\n```c\nint add(int x, int y)\n{\n  while (y != 0)\n  {\n    int carry\
  \ = x & y;\n    x = x ^ y;\n    y = carry << 1;\n  }\n  return x;\n}\nint negate(int\
  \ x) {\n  return add(~x, 1);\n}\nint subtract(int x, int y) {\n  return add(x, negate(y));\n\
  }\n```\n\n# 10. 给定整数数组，其中所有数字都出现两次，找到只出现一次的数字\n\n## 解决方案\n\n我们可以通过对整数数组进行异或运算来识别只出现一次的数字。如果一个数字是重复的，异或运算的结果将为\
  \ 0。换句话说，如果对所有数字进行异或，结果就是那个只出现一次的数字。\n\n## 代码\n\n留作练习。\n\n# 11. 给定整数数组，其中所有数字都出现两次，找到只出现一次的两个数字\n\
