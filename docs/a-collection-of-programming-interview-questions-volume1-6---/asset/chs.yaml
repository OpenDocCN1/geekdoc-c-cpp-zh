  \ DFS 或 BFS 访问。如果两个直接连接的节点具有相同的颜色，则该图不是二分图。\n\n## 代码\n\n```cpp\nbool isBipartite(const\
  \ Graph & g, Graph::NodeID sid)\n{\n    if (sid >= g.numNodes()) \n        return\
