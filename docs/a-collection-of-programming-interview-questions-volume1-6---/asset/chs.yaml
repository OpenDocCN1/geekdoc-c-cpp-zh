  我们可以对所有整数位置进行段划分，并计算两个部分的最大乘积。如果我们在位置![](img/00093.jpeg) 处切割，那么乘积为![](img/00252.jpeg)。此外，部分\
  \ ![](img/00253.jpeg) 可以被进一步划分。因此，乘积可以递归地计算为![](img/00254.jpeg)。基础情况是![](img/00255.jpeg)。\n\
  \n## 代码\n```cpp\nunsigned int segment(unsigned int n)\n{\n  if (n == 0 || n == 1)\
  \ return 0;\n  unsigned int m = 0;\n  for (unsigned int i = 1; i < n; i++)\n   \
  \ m = std::max(m, std::max(i * (n - i),\n      segment(n - i) * i));\n  return m;\n\
  }\n\nunsigned int segmentDPhelper(unsigned int n, std::vector<unsigned int> & seg)\n\
  {\n  unsigned int m = 0;\n  for (unsigned int i = 1; i < n; i++)\n  {\n    if (!seg[n\
  \ - i])\n      seg[n - i] = segmentDPhelper(n - i, seg);\n    m = std::max(m, std::max(i\
  \ * (n - i), seg[n - i] * i));\n  }\n  return m;\n}\n\nunsigned int segmentDP(unsigned\
  \ int n)\n{\n  if (n == 0 || n == 1) return 0;\n  std::vector<unsigned int> seg(n,\
  \ 0);\n  return segmentDPhelper(n, seg);\n}\n```\n\n## 复杂度\n时间与空间上都是线性的\n\n# 24.\
