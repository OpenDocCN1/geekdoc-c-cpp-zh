  md: "# # Code Design – Physics of Moon Landing\n\nAre you ready for a little physics\
    \ and math? Don't worry it won't be too scary. We want to write the equations\
    \ that describe the position and speed of the landing vehicle as it descends to\
    \ the moon. As a first step, we need to define a coordinate system to do our computations.\
    \ We assume all graphics elements (the lander, the thrust flames, the pad, the\
    \ background) are contained within a rectangular region named landscape: \n\n\
    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_694_0.png)\n\nA point within within this\
    \ region is specified by a “Cartesian” pair, (x, y). In the diagram, note the\
    \ x (horizontal) coordinate increases from left to right, starting at 0 and extending\
    \ to landscape.Width - 1. The y (vertical) coordinate increases from top to bottom,\
    \ starting at 0 and ending at landscape.Height - 1. All measurements are integers\
    \ and in units of pixels. In this program, we will assume one pixel corresponds\
    \ to one meter of distance.\n\nEach graphic element is also contained within a\
    \ rectangle. The lander element (lander) is located at the Cartesian pair (landerX,\
    \ landerY)"
  merge: -1
  pgno: 694
- img_proc: true
  md: 'within the **landscape** rectangle:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_695_0.png)


    The **lander** has width **lander.Width** and height **lander.Height**. **landerX**
    and **landerY** are assigned some initial values (**at time = 0**). The lander
    speeds are **landerXSpeed** and **landerYS**, in the respective directions. **landerXSpeed**
    and **landerYS** are initialized at zero.


    Once we have initial values for **landerX**, **landerY**, **landerXSpeed** and
    **landerYS**, they are “updated” (incremented or decremented) at various times.
    The speeds and positions are updated whenever each change of the running clock,
    governed by **timLanding**. Let’s look at the “update” equations, first seeing
    how thruster affects speed.


    The vertical thruster affects only the vertical speed, **landerYS**. We assume
    this, the horizontal thrusters, work in what rocket scientists call “impulse mode,”
    imparting an immediate speed change (delta) in the opposite direction. If that
    change in speed is called **yDelta**, the equation for changing speed in the y-direction
    when the thruster is applied:


    ```

    landerYS -= yDelta; // Down thruster applied

    ```'
  merge: -1
  pgno: 695
- img_proc: true
  md: 'The vertical (down) thruster slows the vertical speed, providing the slowing
    we need for a proper landing.


    The horizontal thrusters change horizontal speed, landerXpeed. Assuming an impulse
    change in speed (xDelta), the equations for speed in the x-direction when the
    thrusters are applied:


    ```

    landerXpeed += xDelta; // Left thruster applied

    ```


    and


    ```

    landerXpeed -= xDelta; // Right thruster applied

    ```


    The left thruster slows the lander toward the right; the right thruster slows
    the lander to the right.


    Knowing the horizontal (landerXpeed) and vertical (landerYSpeed) speeds of the
    lander, how do we determine the positions landerX and landerY? We use the classic
    formula that tells us:


    # Distance Traveled = Speed x Time Traveled


    This equation is derived using a branch of mathematics known as calculus. Use
    that fact to impress your friends. This computation is done every time the clock
    updates its time (in the timLanding Tick Event). Let t be the interval of the
    timer control in seconds:


    ```

    t = Convert.ToDouble(timLanding.Interval) / 1000;

    ```


    The 1000 divisor converts the Interval property (in milliseconds) seconds.


    Knowing t, the X and Y position of the lander are updated each clock cycle using:'
