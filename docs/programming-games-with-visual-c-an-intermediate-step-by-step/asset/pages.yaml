  md: '# # Saving a Visual C# Project


    When a project is created in Visual C#, it is automatically saved in the location
    you specify. If you are making lots of changes, you might occasionally like to
    save your work prior to running the project. Do this by clicking the **Save All**
    button in the Visual C# toolbar. Look for a button that looks like several floppy
    disks. (With writeable CD’s so cheap, how much longer do you think people will
    know what a floppy disk looks like? – many machines don''t even have a floppy
    disk drive!)


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_77_0.png)


    Always make sure to save your project before running it or before leaving Visual
    C#.'
