  md: '# # Pizza Delivery Project Preview


    In this chapter, we will build a Pizza Delivery game. In this simulation game,
    lots of decisions need to be made. The basic idea is to read the incoming phone
    orders and tell the delivery car where to go. You also need to make sure you always
    have fresh-baked pizzas ready to go out the door. The delivery area is a grid
    of 20 by 20 squares. The more pizzas you sell, the more money you make!


    The finished project is saved as Pizza Delivery in the KidGamesVCS\KidGamesVCS
    Projects folder. Start Visual C# and open the finished project. You will see two
    form files in Solution Explorer (this is our first multi-form project). Open the
    named PizzaDelivery.cs and you will see:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_515_0.png)'
  merge: -1
