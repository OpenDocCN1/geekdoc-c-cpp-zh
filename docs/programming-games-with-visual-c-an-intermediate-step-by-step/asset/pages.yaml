  md: '# # Variable Declaration


    Once we have decided on a variable name and the type of variable, we must tell
    our Visual C# application what that name and type are. We say, we must **explicitly
    declare** the variable.


    There are many advantages to **explicitly** typing variables. Primarily, we insure
    all computations are properly done, mistyped variable names are easily spotted,
    and Visual C# will take care of insuring consistency in variable names. Because
    of these advantages, and because it is good programming practice, we will *always*
    explicitly type variables.


    To **explicitly** type a variable, you must first determine its **scope**. Scope
    identifies how widely disseminated we want the variable value to be. We will use
    three levels of scope:


    +   - Block level

    - Method level

    - Form level


    **Block level** variables are only usable within a single block of code. We will
    see these when we discuss loops.


    The value of **method level** variables are only available within a method. Such
    variables are declared within a method, using the variable type as a declarer:


    ```

    int myInt;

    double myDouble;

    string myString, yourString;

    ```


    These declarations are usually placed after the opening left curly brace of a
    method.'
