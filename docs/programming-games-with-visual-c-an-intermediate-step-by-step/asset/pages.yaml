  md: '```

    number = myRandom.Next(101) + 100;

    ```


    Another method of the random object we use is the NextDouble method:


    ```

    myRandom.NextDouble()

    ```


    This method returns a double type number from 0 to 1. So it is useful for getting
    random numbers that are not integers. So, if we need a decimal number (myNumber)
    from 0 to 100, we use:


    ```

    myNumber = 100 * myRandom.NextDouble();

    ```'
