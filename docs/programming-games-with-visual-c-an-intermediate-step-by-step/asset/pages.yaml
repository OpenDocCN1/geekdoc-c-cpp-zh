  md: '# # DrawLine Method


    The first graphics (drawing) method we learn is **DrawLine**. This method is used
    to connect two Cartesian points with a straight-line segment. It operates on a
    previously created graphics object. If that object is **myGraphics** and we wish
    to connect the point (x1, y1) with (x2, y2) using a pen object **myPen**, the
    syntax is:


    ```

    myGraphics.DrawLine(myPen, x1, y1, x2, y2);

    ```


    Each coordinate value is an integer type. There are other versions of the **DrawLine**
    method (we say the method is overloaded). We will always use this version.


    Using a black pen with a line width of 1 (**Pens.Black**), the **DrawLine** method
    with these points is:


    ```

    myGraphics.DrawLine(Pens.Black, x1, y1, x2, y2);

    ```


    This produces on a form (**myGraphics** object):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_753_0.png)


    For every line segment you need to draw, you will need a separate **DrawLine**
    statement. Of course, you can choose to change pen color or pen width at any time
    you wish.'
