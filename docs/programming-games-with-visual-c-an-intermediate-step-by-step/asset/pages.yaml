  md: '# # Moon Landing Game Project Enhancements


    There are some ways to change the Moon Landing project. Some possibilities are:


    +   - It would be nice if the options selections you make are saved from one game
    to the next. This requires the use of files which are discussed in the next chapter.

    - Add more elaborate graphic effects upon crash landings.

    - Add keyboard control for the thrusters (this is discussed in the next chapter).

    - Add a way to graphically see how close you are to a safe landing speed (rather
    than just display the number).

    - As implemented, you may notice a bit of delay between hearing a thruster and
    seeing the graphic display. This delay is because the sound and drawing of the
    thrust are in two different methods. I kind of like the delay – you hear the sound,
    then pretty soon the flames start flying. If the delay bothers you, try to put
    the sound and graphics in the same routine.

    - The current game gives minimal evaluation of the landing, just checking to see
    if the vertical speed is acceptable. Expand the definition of a safe landing to
    include horizontal position and speed. You might like to add some comments. In
    the original text versions of this game, comments on the landing were quite cynical.
    Some example comments for bad landings from these old programs are:


    > "Sorry, there were no survivors – you blew it!"

    >"Appropriate condolences will be sent to your next of kin."

    >"The space program hates to lose experienced astronauts."'
