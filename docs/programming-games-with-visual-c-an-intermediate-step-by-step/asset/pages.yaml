  md: '# Leap Frog Game Project Enhancements


    There are some ways to change the Leap Frog project. Some possibilities are:


    +   - There are no time penalties in the game – you can play as long as you like.
    Perhaps add a clock timer that rewards faster motion and causes you to lose points
    or lose frogs if you dally.

    - Add more features to the game. Perhaps, logs that randomly break or alligators
    swimming in the river. Put random potholes in the road at higher levels. Use your
    imagination.

    - To make things a bit harder at higher levels, you might narrow the home rectangles
    a bit.

    - Add more scores to the high scores form. Use a list box control to store every
    score ever achieved if you like.'
