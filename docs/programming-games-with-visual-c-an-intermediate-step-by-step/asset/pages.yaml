  md: '# Adding Controls at Run-Time


    In building Visual C# applications, the process of adding controls and setting
    properties at design time is straightforward and simple. There are times, however,
    when it might be advantageous to add controls at runtime. For example, in our
    Pizza Delivery project, we need a 21 x 21 grid of label controls. That''s with
    just a bit of code, we can automate the task of adding controls to a form at run-time.
    We can also remove controls if desired.


    To add a control at run-time, we need to follow five steps: (1) declare the control,
    (2) create the control, (3) set control properties, (4) add control to form and
    (5) connect event handlers. We look at each step separately for a generic control
    named myControl of type ControlType.


    The first step is to declare a control using the usual statement:


    ```

    ControlType myControl;

    ```


    Quite often we declare an array of controls. The control is created using the
    respective constructor:


    ```

    myControl = new ControlType();

    ```


    At this point, myControl is established with a default set of properties. You
    can overwrite any properties you choose. In particular, you must set values for
    the Left and Top properties. If you don''t, all your new controls will be stacked
    in the upper left corner of the form (Left = 0, Top = 0). You probably also want
    to change the Width and Height properties. Once the properties are set, the control
    is added to the form using the Add method of the Controls object:


    ```

    this.Controls.Add(myControl);

    ```'
  merge: -1
  pgno: 541
- img_proc: true
  md: 'If you are adding the control to a group box or panel control, you would replace
    this (referring to the form) in the above statement with the container control''s
    name.


    So, now the control is created and on the form, but recognizes no events. Decide
    what events you want your control to respond to. If you want event MyEvent to
    be handled by a method MyMethod, an event handler is created using:


    ```

    myControl.MyEvent += new

    System.EventHandler(this.MyMethod);

    ```


    Before using this statement, the method MyMethod should exist in the code window.
    It could be a method corresponding to an existing control or a new method you
    create. If you create it, the format is:


    ```

    private void MyMethod(object sender, EventArgs e)

    {

    n}

    ```


    You would write code in this method, assuming event handlers are added at runtime.


    As an aside, you can add event methods in code for existing controls also. This
    sometimes saves a little typing at design time. For example, say you have a method
    that handles clicking on 20 button controls. Rather than assign the event method
    20 times in the properties window, you could add it in code.


    You can also remove controls from your application. To remove a control (named
    myControl) from the form, use:


    ```

    this.Controls.Remove(myControl);

    ```'
  merge: -1
  pgno: 542
- img_proc: true
  md: 'If you are removing a control from a group box or panel control, replace the
    keyword **this** with the container control’s name. When the control is removed,
    all event handlers for this control are modified to no longer include the removed
    control. This also happens when a control is deleted at design time.


    Let’s use this new information to build the delivery grid for the **Pizza Delivery**
    game.'
