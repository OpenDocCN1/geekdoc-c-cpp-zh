  md: '# Brush Object


    To move a sprite in a graphics object, we first clear it from the current location,
    then redraw it in a new location. To do this we need to know how to clear a rectangular
    region. Such a process uses the Visual C# Brush object.


    Like the Pen object, a brush is just like a brush you use to paint – just pick
    a color. You can use brushes built-in to Visual C# or create your own brush.


    In most cases, the brushes built into Visual C# are sufficient. The Brushes class
    provides brush objects that paint using one of the 141 built-color names we’ve
    seen before. The syntax to refer to such a brush is:


    ```

    Brushes.ColorName

    ```


    To create your own Brush object, you first declare the brush using:


    ```

    Brush myBrush;

    ```


    The solid brush is then created using the SolidBrush constructor:


    ```

    myBrush = new SolidBrush(color);

    ```


    where color is the color your new brush will paint with. This color argument can
    be one of the built-in colors or one generated with the FromArgb method.


    Once created, you can change the color of a brush any time using the Color property
    of the brush object. The syntax is is:


    ```

    myBrush.Color = newColor;

    ```


    where newColor is a newly specified color.'
