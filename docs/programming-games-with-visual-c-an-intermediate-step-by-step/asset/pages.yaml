  md: '# # A Brief History of C#


    It’s interesting to see just where the C# language fits in the history of some
    other computer languages. You will see just new Visual C# is! In the early 1950’s
    most computers were used for scientific and engineering calculations. The programming
    language of choice in those days was called FORTRAN. FORTRAN was the first modern
    language and is still in use to this day (after going through several updates).
    In the late 1950’s, bankers and other business people got into the computer business
    using a language called COBOL. Within a few years after its development, COBOL
    became the most widely data processing language. And, like FORTRAN, it is still
    being used today.


    In the 1960’s, two professors at Dartmouth College decided that “everyday” people
    needed to have a language they could use to learn programming. They developed
    BASIC (Beginner’s All-Purpose Symbolic Instruction Code). BASIC (and its successors,
    GW-Basic, Visual Basic, Visual Basic Express) is probably the most widely used
    programming language. Many dismiss it as a “toy language,” but BASIC was the first
    product developed by a company you may have heard of – Microsoft! And, BASIC has
    been used to develop thousands of commercial applications.


    C# had its beginnings in 1972, when AT&T Bell Labs developed the C programming
    language. It was the first, new scientific type language since FORTRAN. If you’ve
    ever seen a C program, you will notice many similarities between C# and C. Then,
    with object-oriented capabilities added, came C++ in 1986 (also from Bell Labs).
    This was a big step.


    In 2001, Microsoft introduced its .NET platform and a new language was introduced
    – C#. It represented a streamlined version of C and C++, with a little Java thrown
    in. This chapter provides an overview of the C# language used in the Visual C#
    environment. If you’ve ever used another programming language, you will see equivalent
    structures in the language of Visual C#.'
  merge: -1
