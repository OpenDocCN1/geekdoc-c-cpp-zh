  md: '# Writing Code


    The last step in building a Visual C# application is to write code using the C#
    language. This is the most time consuming task in any Visual C# application. It
    is also the most fun and most rewarding task.


    We will write a little code using the example we started. Clear any controls you
    may have placed on the example’s form. Place a label control (displays text) and
    two button controls on the form. Make it look something like this:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_68_0.png)


    Now, set the Name property of button1 to btnHello and the Text property to Hello.
    For button2, use a Name property of btnGoodbye and a Text property of Goodbye,
    so the finished form is like this:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_68_1.png)'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'As controls are added to a form, Visual C# automatically builds a framework
    of all event methods. We simply add add code to the event methods we want our
    application to respond to. And, if needed, we write general methods. For those
    who may have never programmed before, the code in these methods is simply a line
    by line list of instructions for the computer to follow


    As you write code, any errors you make are identified in the Error List Window.
    To view this window, choose the View menu option. Then, select Other Windows,
    then Error List. The Error List window will appear:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_69_0.png)


    Errors are listed under Description. You will use this window a lot while writing
    code.


    Code is placed in the Code Window. Typing the code in the code window is just
    like using any word processor. You can cut, copy, paste and delete text (use the
    Edit menu or the toolbar). Learn how to access the code window using the menu
    (View), toolbar, or by pressing <F7> (and there are still other ways) while the
    form is active. Here is the Code window (Form1.cs) for the example project we
    have been playing with:'
  merge: -1
  pgno: 69
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_70_0.png)


    The header line (namespace First_Project) starts the code. In Visual C#, everything
    that makes your project is called a namespace. Your form is called a class. The
    line public Form1() begins the constructor. The constructor consists of a single
    line saying InitializeComponent(). This code accesses a routine written by the
    Visual C# environment to set up the form that you designed. Notice the use of
    curly braces to start and end segments. You don''t have to worry much about any
    of this code – just don''t change any of it. All the code we will write go after
    this constructor. We need to write event methods for the two bottom controls.


    There are two ways to establish event methods for controls – one directly from
    the form and one using the properties window. Let''s look at both. Every control
    has a default event method. For example, a button control''s default event method
    is the Click event, since this is most often what we do to a button. To access
    a control''s default event method, you simply double-click the control on the
    form. For example, if you double-click the button named btnHello in this example,
    the bottom of the code window will display:


    ```

    private void btnHello_Click(object sender, EventArgs e)

    {

    }

    ```


    Let''s spend some time looking at this method – all event methods used in Visual
    C# look just like this. The time spent clarifying things now will be'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'well worth it.

    The assigned name for the event method is seen to be btnHello_Click.

    Our naming convention tells us this is the method executed when the user clicks
    on the btnHello button. The method has two arguments: sender and e. Sender tells
    the method what control caused the event to occur and g gives us some information
    about the event. Following the header line are a matched set of curly braces ({
    { }). The code for the event method will go between these two braces.


    Though simple and quick, double-clicking a control to establish a control event
    method will not work if you are not interested in the default event. In that case,
    need to use the properties window. Recall we mentioned that the properties window
    is not only used to establish properties, but also event methods. To establish
    an event method using the properties window, click on the Events button (appears
    as a lightning bolt) in the properties window toolbar.


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_71_0.png)


    The active control''s events will be listed (the default event will be highlighted).
    To establish an event method, scroll down the listed events'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'and double-click the one of interest. The selected event method will appear
    in the code window. Add the Click event for btnGoodbye.


    There are several ways to locate a previously established method. One is to double-click
    the event name in the properties window, just as we did to create the method.
    Once you double-click the name, the code window will display the selected method.
    If the desired method is a default method, double-clicking the control on the
    form will take you to that method in the code window.


    Another way to locate an event method is via the code window. At the top of the
    code window are three dropdown boxes, the method list is on the right. Selecting
    this box will provide a list of all methods in the code window. Find the event
    method of interest and select it. The selected event will appear in the code window:


    # method list


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_72_0.png)


    Deleting an event method can be tricky. Simply deleting the event method in the
    code window is not sufficient. When you add an event method to your application,
    Visual C# writes a line of code to connect the method to your control. That line
    of code remains after you delete the method. If you delete the method and try
    to run your application, an error will occur. In the Task Window will be a message
    saying your application'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'does not contain a definition for a specific event method. Double-click the
    message and C# will take you to the offending statement (the one that connects
    the control and the method). Delete that line and your code will be fixed.


    The preferred way to delete a method is to select the desired method using the
    properties window (make sure the control of interest is the active control). Once
    the event is selected, highlight the event method name on the right side and press
    the Delete key. This process deletes the event from the code window and deletes
    the line of code connecting the method and control.


    In the little example here, we will just be giving you code to type in the code
    window. There are a few rules to pay attention to as you type Visual C# code:


    +   - Visual C# code requires perfection. All words must be spelled correctly.

    - Visual C# is case-sensitive, meaning upper and lower case letters are considered
    to be different characters. When typing code, make sure you use upper and lower
    case letters properly

    - Visual C# ignores any "white space" such as blanks. We will often use white
    space to make our code more readable.

    - Curly braces are used for grouping. They mark the beginning and end of programming
    sections. Make sure your Visual C# programs have an equal number of left and right
    braces. We call the section of code between matching braces a block.

    - It is good practice to indent code within a block. This makes code easier to
    follow. The Visual C# environment automatically indents code in blocks for you.

    - Every Visual C# statement will end with a semicolon. A statement is a program
    expression that generates some result. Note that not all Visual C#ions are statements
    (for example, the line defining the Main method has no semicolon).'
  merge: -1
