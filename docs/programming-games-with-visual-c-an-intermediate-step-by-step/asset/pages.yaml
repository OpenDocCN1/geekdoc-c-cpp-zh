  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_952_0.png)


    As programmed, you can play Leap Frog forever. You have unlimited frogs and the
    game stays at the same difficulty no matter how long you play. We''ll change that
    for now. First, we will limit the number of frogs available during a game. Once
    your frogs are gone, the game will be over. Second, each time all the frogs have
    reached home, we will increase the difficulty of the game by speeding things up
    a bit, adding more vehicles and removing logs. This idea of having increasing
    levels of difficulty is a fun feature of video games. And, you may be wondering
    why we have label controls at the top for scoring and have no scoring? We''ll
    take care of that soon.'
