  md: "# Visual C# Counting\n\nWith while and do/while structures, we usually didn't,\
    \ ahead of time, how many times we execute a loop or iterate. If you know how\
    \ many times you need to iterate on some code, you want to use Visual C# counting.\
    \ Counting is useful for adding items to a list or perhaps summing a known number\
    \ of values to find an average.\n\nVisual C# counting is accomplished using the\
    \ for loop:\n\n```\nfor (initialization; expression; update)\n{\n  [process this\
    \ code]\n}\n```\n\nThe initialization step is executed once and is used to initialize\
    \ a counter variable. The expression step is executed before each repetition of\
    \ the loop. If expression is true, the code is executed; if false, the loop is\
    \ exited. The update step is executed after each loop iteration. It is used to\
    \ update the counter variable.\n\nExample:\n\n```\nfor (degrees = 0; degrees <=\
    \ 360; degrees += 60)\n{\n  // convert to radians\n  r = degrees * Math.PI / 180;\n\
    \  a = Math.Sin(r);\n  b = Math.Cos(r);\n  c = Math.Tan(r);\n}\n```"
