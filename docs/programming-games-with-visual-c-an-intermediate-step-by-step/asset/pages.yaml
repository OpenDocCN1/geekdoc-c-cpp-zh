  md: '# Code Design – Moving the Frog


    The frog will be able to leap from panel to panel and move horizontally across
    panels. We will use a Sprite object to represent the frog. Four graphics will
    be used to depict the frog depending on its direction of motion. The graphics
    are in the KidGamesVCS\KidGamesProjects\Leap Frog folder:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_898_0.png)


    FrogUp.

    FrogDown.


    FrogLeft.

    FrogRight.


    Each frog is 40 pixels by 40 pixels. The program will assume these files are in
    your project''s Bin\Debug folder. Copy the four files to that folder.


    The frog begins its journey on the start panel (pnlStart) at the bottom of the
    form and ends its journey (if successful) on the home panel (pnlHome) at the top
    of the form. In between, the frog traverses the three lanes in the road panel
    (pnlRoad), the snake panel (pnlSnake) and the three rows of logs in the river
    panel (pnlRiver). We define a variable (frogLocation) to keep track of what panel
    (and where on the panel in the case of the road and river) the frog is on. The
    values for this variable and corresponding locations are note frogLocation increases
    as the frog moves up the screen:


    | frogLocation | Location |

    | 8 | Home panel |

    | 7 | River panel (top row) |

    | 6 | River panel (middle row) |

    | 5 | River panel (bottom row) |

    | 4 | Snake panel |'
