  md: '# Setting Properties at Run Time


    In addition to setting properties at design time, you can set or modify properties
    while your application is running. To do this, you must write some code. The code
    format is:


    ```

    objectName.PropertyName = newValue;

    ```


    Such a format is referred to as dot notation. For example, to change the BackColor
    property of a button named btnStart, we''d type:


    ```

    btnStart.BackColor = Color.Blue;

    ```


    You''ve just seen your first line of code in Visual C#. Good naming conventions
    make it easy to understand what''s going on here. The button named btnStart will
    now have a blue background. We won''t learn a lot much code in this first chapter
    (you''ll learn a lot in Chapter 3), but you should see that the code that is used
    is straightforward and easy to understand.'
  merge: -1
