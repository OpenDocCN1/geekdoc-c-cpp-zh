  md: '# # Safecacker Game Project Enhancements


    There are always things you can do to improve a project. At the end of each chapter,
    we will give you some ideas for the current project. For the **Safecacker** game,
    some possibilities are:


    +   - Add an option so the digits in the combination repeat (perhaps use a check
    box control). You will need to modify the code that generates and checks the combination.
    You will also have to make sure the keypad buttons are not disabled after clicking.
    Do you see how such an option makes the game easier to play?

    - To make the game simpler for smaller children, you might like to have combinations
    that use fewer than the 9 digits on the keypad. For example, a three digit code
    that only uses the numbers from 0 to 4 would be much easier to guess. You would
    need logic to decide which keys to keep on the keypad.

    - After each guess, you might like to provide a hint on how to proceed.

    - After a correct combination, maybe have more dramatic results. Perhaps, have
    the bank graphic disappear and a pile of treasure appear.'
