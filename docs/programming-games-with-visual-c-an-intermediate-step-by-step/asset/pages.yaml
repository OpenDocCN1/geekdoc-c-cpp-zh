  md: '# FillRectangle Method


    Now, to clear a sprite from a graphics object, we use the FillRectangle method.
    This method will draw a filled rectangle in a rectangle structure within a graphic
    object. Assuming you have a graphics object named myGraphics and a rectangle structure
    named myRectangle, the syntax to fill a rectangle with brush object myBrush is:


    ```

    myGraphics.FillRectangle(myBrush, myRectangle);

    ```


    The brush will usually be a solid brush with the color the same as the background
    color of the control hosting the graphics object.


    Using a red solid brush (Brushes.Red), the code to fill a rectangle that takes
    up 80 percent of the width and height of a form-hosted graphics object is:


    ```

    myRectangle = new Rectangle(0.1 * this.Width, 0.1 * this.Height, 0.8 * this.Width,
    0.8 * this.Height);

    myGraphics.FillRectangle(Brushes.Red, myRectangle);

    ```


    This code produces this:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_858_0.png)'
