    The Moon Landing program demonstrates a principle used extensively in engineering
    and mathematics disciplines, that of computer simulation. Simulation is used to
    test designs and methods before actually building some device or structure. For
    example, we use simulators to train airline pilots - this is much safer than training
    them in actual planes because they make a mistake, there is no loss of airplane
    or life. Before constructing a building, we simulate it on a computer to see if
    it can withstand winds and possible earthquakes. Using simulations, we can determine
    how a system operates, learn how its performance varies as we'
