  md: '# Using the Debugging Tools


    There are several debugging tools available for use in Visual C#. Access to these
    tools is provided via both menu options and buttons on the toolbar. Some of the
    tools we will examine are:


    +   - **Breakpoints** which let us stop our application.

    - **Output, Locals** and **Watch** windows which let us examine variable values.

    - **Call stack** which let us determine how we got to a certain point in code.

    - **Step into, step over** and **step out** which provide manual execution of
    our code.


    These tools work in conjunction with the various debugger windows.'
