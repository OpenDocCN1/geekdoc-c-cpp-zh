  md: '# # Code Design – Initializing Options, Clock


    Even though we have no code, you can run the game. It should appear as:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_682_0.png)


    In this ‘stopped’ state, all a user can do one of the two options (**Pilot Level**
    or **Units**) or click on **Start Game** or **Exit**. You can also decide if you
    want **Auto-Pilot On**. If a user chooses to start a game, the two options group
    boxes disappear and the lander control group box (**grpControl**) appears.


    We will use a variable (**pilotLevel**) that ranges from 1 to 5 to keep track
    of the selected pilot level. Add this form level declaration to the code window:


    ```

    int pilotLevel = 1;

    ```'
  merge: -1
  pgno: 682
- img_proc: true
  md: "We initialize this to Beginner (pilotLevel = 1) level to match the initially\
    \ checked radio button.\n\nThe code to set pilotLevel is in the rdoPilotLevel\
    \ Click event method (handles clicks on any of the five radio buttons):\n\n```\n\
    private void rdoPilotLevel_Click(object sender, EventArgs e)\n{\n    RadioButton\
    \ buttonClicked;\n    buttonClicked = (RadioButton)sender;\n    switch (buttonClicked.Text)\n\
    \    {\n        case \"Beginner\":\n            pilotLevel = 1;\n            break;\n\
    \        case \"Novice\":\n            pilotLevel = 2;\n            break;\n \
    \       case \"Junior\":\n            pilotLevel = 3;\n            break;\n  \
    \      case \"Senior\":\n            pilotLevel = 4;\n            break;\n   \
    \     case \"Advanced\":\n            pilotLevel = 5;\n            break;\n  \
    \  }\n}\n```"
  merge: -1
  pgno: 683
- img_proc: true
  md: "We will do the calculations in this program in **Metric** units. This means\
    \ all\npositions will be in meters and all speeds will be in meters/second. If\
    \ a\nuser selects **US (English)** units, we need to multiply all results by the\n\
    number than converts meters to feet. This number will be stored in a\nvariable\
    \ **multiplier**. Add this form level declaration and initialize it to 1.0\nsince\
    \ for metric units (the default choice), we just multiply everything by\n1.0:\n\
    \n```\ndouble multiplier = 1.0;\n```\n\nThe **multiplier** for **metric** units\
    \ is set in the `rdoMetricUnits` Click event\nmethod:\n\n```\nprivate void rdoMetricUnits_Click(object\
    \ sender, EventArgs e)\n{\n    multiplier = 1.0;\n}\n```\n\nAnd for **US (English)**\
    \ units, the **Multiplier** is set in the `rdoUSUnits` Click\nevent method:\n\n\
    ```\nprivate void rdoUSUnits_Click(object sender, EventArgs e)\n{\n    multiplier\
    \ = 3.2808;\n}\n```\n\nThis says there are 3.2808 feet in a meter.\n\nA key element\
    \ in the **Moon Landing** program is the timer control\n**(timLanding)**. It is\
    \ used to update the elapsed time, all computed values\nand all graphics elements\
    \ of the program. In this initialization stage, we'll\njust use it to update the\
    \ time. Add this form level declaration for the\nvariable (**Time**) to represent\
    \ elapsed time (in seconds):"
  merge: -1
  pgno: 684
- img_proc: true
  md: "double time;\n\nThe time is then updated in the timLanding Tick event method:\n\
    \n```\nprivate void timLanding_Tick(object sender, EventArgs e)\n{\n    time +=\
    \ Convert.ToDouble(timLanding.Interval) / 1000;\n    lblTime.Text = String.Format(\"\
    {0:f1}\", time);\n    lblTime.Refresh();\n}\n```\n\nWe currently have the Interval\
    \ property set to 500 milliseconds, hence an update will be obtained every 0.5\
    \ seconds.\n\nNow, we'll begin writing the code that starts, pauses, restarts\
    \ and stops Moon Landing. We also write code that exits the program. Before doing\
    \ this, let's review what each Pilot Level entails:\n\n+   - Beginner – No thrust\
    \ control; no fuel usage.\n- Novice – No vertical thrust control; no fuel usage.\n\
    - Junior – All thrust controls; no fuel usage.\n- Senior, Advanced – All thrust\
    \ controls; fuel usage.\n\nIf Auto-Pilot is on, we have no thrust controls, but\
    \ we want the label specifying Auto-Pilot On visible. Hence, when a game starts,\
    \ different controls may or not appear in the group box displaying the lander\
    \ control information.\n\nTwo buttons control the game, btnStartPause and btnExitStop.\
    \ These buttons have certain interactions. The btnStartPause control can have\
    \ three possible Text properties. If the Text property is Start Game when clicked,\
    \ the game is initialized and put in playing mode using:\n\n+   - Change Text\
    \ to Pause Game."
  merge: -1
  pgno: 685
- img_proc: true
  md: "+   > Change Text of btnExitStop to Stop Game.\n\n+   > Set grpLevel and grpUnits\
    \ Visible properties to false.\n\n+   > Set grpControl Visible property to true.\n\
    \n+   > If PilotLevel = 1:\n  o Set grpControl Text property to Beginner.\n  o\
    \ Remove btnLeftThrust, btnRightThrust, fuel gauge.\n\n+   > If PilotLevel = 2:\n\
    \  o Set grpControl Text property to Novice.\n  o Remove btnDownThrust, fuel gauge.\n\
    \n+   > If PilotLevel = 3:\n  o Set grpControl Text property to Junior.\n  o Remove\
    \ fuel gauge.\n\n+   > If PilotLevel = 4:\n  o Set grpControl Text property to\
    \ Senior.\n\n+   > If PilotLevel = 5:\n  o Set grpControl Text property to Advanced.\n\
    \n+   > If Auto-Pilot On is checked:\n  o Remove btnLeftThrust, btnDownThrust,\
    \ btnRightThrust\n  o Set lblMessage Visible property to true (with appropriate\
    \ Text)\n\n+   > Initialize Time to zero.\n\n+   > Enable timLanding.\n\nWhen\
    \ Text property is Pause Game and the button is clicked, we enter pause mode:\n\
    \n+   > Change Text to Restart Game.\n> Disable btnExitStop.\n> Disable grpControl.\n\
    > Disable timLanding."
