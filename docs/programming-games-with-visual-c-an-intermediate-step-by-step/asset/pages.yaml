  md: '# Project Design Considerations


    Before building this first project by drawing the Visual C# interface, setting
    the control properties, and writing the C# code, let''s look at some of the things
    that should be considered to make a useful game project. A first consideration
    should be to determine what processes and functions you want your application
    to perform. What are the inputs and outputs? Develop a framework or flow chart
    of all your application''s processes.


    Decide what controls you need. Do the built-in Visual C# controls and functions
    meet your needs? Do you need to develop some controls or functions of your own?
    You can design and build your own controls using Visual C#, but that topic is
    beyond the scope of this course. The skills gained in this course, however, will
    be invaluable if you manage to tackle such a task.


    Design your user interface. What do you want your form to look like? Consider
    appearance and ease of use. Make the interface consistent with other Windows applications.
    Familiarity is good in program design.


    Write your code. Make your code readable and traceable - future code modifiers
    (including yourself) will thank you. Consider developing reusable code - modules
    with utility outside your current development. This will save you time in future
    developments.


    Make your code ''user-friendly.'' Make operation of your application obvious to
    the user. Step the user through its. Try to anticipate all possible ways a user
    can mess up in your application. It''s fairly easy to write an application that
    works properly when the user does everything correctly. It''s difficult to write
    an application that can handle all the possible wrong things a user can do and
    not bomb out.


    Debug your code completely before giving it to others. There''s nothing worse
    than having a user call you to point out flaws in your application. A good way
    to find all the bugs is to let several people try the code - a mini beta-testing
    program.'
  merge: -1
