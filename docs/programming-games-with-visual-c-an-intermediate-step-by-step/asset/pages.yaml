  md: "# Code Design – Initializing Stopped State\n\nAny time we start a project,\
    \ there are certain initializations that must take place. Let's look at the initializations\
    \ needed in the Tic Tac Toe game. All initializations are done in the form’s Load\
    \ event method.\n\nTo make our programming job easier, we will establish a control\
    \ array (boxArray) for the nine label controls used to display the X and O marks\
    \ in the grid. This array is defined below the form constructor in the code window:\n\
    \nLabel[] boxArray = new Label[9];\n\nThe assignments are made in the frmTicTacToe\
    \ Load event method. We also set a message in the lblMessage control and blank\
    \ out the label controls that display the marks. Finally, we want the game to\
    \ be initially in Two Players mode so we disable the two group boxes associated\
    \ with options for one player game:\n\n```\nprivate void frmTicTacToe_Load(object\
    \ sender, EventArgs e)\n{\n    //establish array\n    boxArray[0] = lblBox1;\n\
    \    boxArray[1] = lblBox2;\n    boxArray[2] = lblBox3;\n    boxArray[3] = lblBox4;\n\
    \    boxArray[4] = lblBox5;\n    boxArray[5] = lblBox6;\n    boxArray[6] = lblBox7;\n\
    \    boxArray[7] = lblBox8;\n    boxArray[8] = lblBox9;\n```"
  merge: -1
  pgno: 349
- img_proc: true
  md: "```\n// clear boxes\nfor (int i = 0; i < 9; i++)\n    boxArray[i].Text = \"\
    \";\nlblMessage.Text = \"Game Stopped\";\n    grpFirst.Enabled = false;\n    grpComputer.Enabled\
    \ = false;\n}\n```\n\nEven though we have written minimal code, we can run the\
    \ project to make sure the form is properly initialized. Do this and you’ll see\
    \ in the ‘stopped’ state (using default properties), the Tic Tac Toe game looks\
    \ like this:\n\n![](img/84c2dc99e83d71da8758a0b7a2be88cf_350_0.png)\n\nAs desired,\
    \ the game initializes in Two Players mode. We have two choices at this point:\
    \ click btnStartStop (the button with Start Game) or click btnExit (the button\
    \ with Exit). We could also change to One Player mode – we will address this option\
    \ in some detail later."
  merge: -1
  pgno: 350
