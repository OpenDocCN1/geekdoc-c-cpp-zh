  md: '# About The Authors


    **Philip Conrod** has authored, co-authored and edited over two dozen computer
    programming books and tutorials over the past 30 years. Philip holds a Certificate
    in Computer Programming for Business from Warren-Tech, a Bachelor''s Degree in
    Computer Information Systems and a Master''s certificate in the Essentials of
    Business Development from Regis University. Philip still enjoys writing and Technology
    leadership roles in companies like Sundstrand Aerospace, Safeco Insurance, FamilyLife,
    Kenworth Truck Company, and PACCAR Inc. Today, Philip serves as the Chief Information
    Officer for large manufacturing company based in Seattle, Washington. In his spare
    time, Philip publishing computer programming books for students and serves as
    the President of Kidware Software. Kidware Software LLC publishes computer programming
    books and tutorials under the trade names of KIDWARE, Kidware Software, BibleByte
    Books and ComputerScienceForKids.com.


    **Lou Tyle** holds BS and MS degrees in Mechanical Engineering and a PhD in Electrical
    Engineering. Lou has been programming computers since 1969 when he took his first
    Fortran course in college. He has written software to control suspensions for
    high speed ground vehicles, nuclear power plants, lower noise levels in commercial
    jetliners, compute takeoffs for jetliners, locate and identify air and ground
    traffic and let kids count bunnies, learn to help and do math problems. He has
    written several on-line texts teaching Basic, Visual C# and Java to thousands
    of people. He taught a beginning Visual Basic for over 15 years at a major university.
    Currently, Lou works as an engineer at a major Seattle aerospace firm. He is the
    father of five children and proud husband of his special wife. Lou and his family
    live in Seattle, Washington.'
