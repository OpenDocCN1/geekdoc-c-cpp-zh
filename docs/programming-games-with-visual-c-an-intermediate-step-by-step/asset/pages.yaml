  md: '# Colors


    Colors play a big part in Visual C# applications. We have seen colors in our previous
    games. At design time, we have selected background colors (BackColor property)
    and foreground colors (ForeColor property) for different controls. Such choices
    are made by selecting the desired property in the properties window. Once selected,
    a palette of customizable colors appears for you to choose from.


    We will be drawing with pen objects. These objects have Color arguments that specify
    just what color they draw in. Unlike control color properties, these colors cannot
    be selected at design time. They must be defined in code. How do we do this? There
    are two approaches we can take: (1) built-colors and (2) create a color.


    The colors built into Visual C# are specified by the Color structure. A Color
    is specified using:


    ```

    Color.ColorName

    ```


    where ColorName is a reserved color name. There are many, many color names (I
    counted 141). To see a list, consult on-line help for the Color structure and
