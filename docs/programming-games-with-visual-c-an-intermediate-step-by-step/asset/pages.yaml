  md: '# # Introducing Visual C#


    In the early-1980s, there were many ''toy'' computers being introduced to the
    computing world. Names like VIC-20, Commodore 64, Apple II, Texas Instruments
    99/4A, Atari 400, Coleco Adam, Sinclair Timex, and the IBM PC Jr., were finding
    their way to market. This market created many home and hobbyist programmers who
    enjoyed writing computer programs they could use at home. These programs were
    written in BASIC, a language included for free with the computers being sold.
    Since that time, programming languages have become more elaborate and more expensive
    the needs and desires of the hobbyist programmer have shifted to the background.


    With Visual C#, you are able to quickly build Windows-based applications (the
    emphasis in these notes), database applications and projects that run on the web.
    Windows applications built using Visual C# feature a Graphical User Interface
    (GUI). Users interact with a set of visual tools (buttons, text boxes, tool bars,
    menu items) to make an application do its required tasks. The applications have
    a familiar appearance to the user.


    As you develop as a C# programmer, you will begin to look at Windows applications
    in a different light. You will recognize and understand how various elements of
    Word, Excel, Access and other applications work. You will develop a new vocabulary
    to describe the elements of Windows applications.


    Visual C# Windows applications are event-driven, meaning nothing happens until
    an application is called upon to respond to some event (button pressing, menu
    selection,...). Visual C# is governed by an event processor. As mentioned, nothing
    happens until an event is detected. Once an event is detected, a corresponding
    event method is located and the instructions provided by that method are executed.
    Those instructions are the actual code written by the programmer. In Visual C#,
    code is written using a version of the C# programming language. Once an event
    method is completed, program control is then returned to the event processor.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'All Windows applications are event-driven. For example, nothing happens in
    Word until you click on a button, select a menu option, or type some text. Each
    of these actions is an event.


    The event-driven nature of applications developed with Visual C# makes it very
    easy to work with. As you develop a Visual C# application, event methods can be
    built and tested individually, saving development time. And, often event methods
    are similar in their coding, allowing re-use (and lots of copy and paste).


    Visual C# possesses many features of more powerful (and more expensive) programming
    languages:


    +   * All new, easy-to-use, powerful Integrated Development Environment (IDE)

    * Full set of controls - ''draw'' the application

    * Response to mouse and keyboard actions

    * Printer access

    * Full array of mathematical, string handling, and graphics functions

    * Can easily work with arrays of variables and objects

    * Sequential file support

    * Useful debugger and structured error-handling facilities

    * Easy-to-use graphic tools'
  merge: -1
