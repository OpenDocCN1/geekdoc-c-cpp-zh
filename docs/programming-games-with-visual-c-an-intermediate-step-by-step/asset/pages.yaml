  md: '# Close


    Closes the form.


    # Focus


    Sets focus to the form.


    # Hide


    Hides the form.


    # Refresh


    Forces the form to immediately repaint itself.


    # Show


    Makes the form display by setting the Visible property to True.


    The normal syntax for invoking a method is to type the control name, a dot, the
    method name. For form methods, the name to use is **this**. This is a Visual C#
    keyword used to refer to a form. Hence, to close a form, use:


    ```

    this.Close();

    ```


    Form Events:


    # Activated


    Occurs when the form is activated in code or by the user.


    # Click


    Occurs when the form is clicked by the user.


    # Closing


    Occurs when the form is closing.


    # DoubleClick


    Occurs when the form is double clicked.


    # Load


    Occurs before a form is displayed for the first time (the Form object default
    event).


    # Paint


    Occurs when the form is redrawn.


    Typical use of **Form** object (for each control, we will provide information
    for how that control is typically used):


    +   > Set the **Name** and **Text** properties


    +   > Set the **StartPosition** property (in this course, this property will always
    be set to **CenterScreen**


    +   > Set the **FormBorderStyle** to some value. In this course, we will mostly
    use **FixedSingle** forms. You can have resizable forms in'
