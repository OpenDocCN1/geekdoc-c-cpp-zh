  md: '# # Introducing Programming Games With Visual C#


    In these notes, we will use Visual C# to build many fun game projects. The games
    are non-violent and teach logical thinking skills. They are appropriate for kids
    of all ages (even adults). The projects you will build are (in increasing complexity):


    +   - **Safecacker** – Decipher a secret combination using clues from the computer.

    - **Tic Toe** – The classic game – one of the first programmed by Bill Gates!

    - **Match Game** – Find pairs of hidden photos – you use your own photos!

    - **Pizza Delivery** – A business simulation where you manage a small pizza shop
    for a night.

    - **Moon Landing** – A module on the surface of the moon.

    - **Leap Frog** – A fun arcade game where you need to get a frog through traffic
    and across a raging river.


    These projects will teach many of the skills needed to be a successful game programmer.
    You will learn about timing, multi-player games, scoring, simulation techniques
    and animation.


    Each project will be addressed in a single chapter. Complete step-by-step instructions
    covering every project detail will be provided. Before beginning the projects,
    however, we will review the Visual C# and its development environment in the remainder
    of this chapter. Then, we will provide an overview of the controls and objects
    used in Visual C# (Chapter 2), a review of the Visual C# programming language
    (Chapter 3), and instructions on using the Visual C# debugger tools (Chapter 4).
    The projects will begin with Chapter 5.'
  merge: -1
