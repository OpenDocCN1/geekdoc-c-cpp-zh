  md: '# # Match Game Project Enhancements


    There are several ways to improve the Match Game project. Some possibilities are:


    +   - As written, the human player can click on picture boxes while the computer
    is making a move. Implement logic to disallow this.


    +   - Design a tool that allows for selection of photos used in the game. This
    requires some advanced skills. Your tool would write a file with the name of the
    10 photos to use (and their location). Then when Match Game begins, it would open
    that and automatically load the files. Reading and writing to files is briefly
    covered in our last game project.


    +   - Make the number of photo boxes adjustable for an added difficulty adjustment
    (fewer boxes for little kids).


    +   - Add additional levels of difficulty by having finer adjustments on the threshold
    between random and smart computer moves.


    +   - As written, a player could theoretically find all ten pairs without giving
    the other player a chance. Perhaps, rewrite the game so a player only gets one
    extra turn after a match.


    +   - The computer in this game is pretty smart, but it can be smarter. How you
    ask? If the computer un a photo that has no match, its next choice could be a
    photo''s already been uncovered. This would not give the computer any more information
    about hidden photos, but it also does not give you, the opponent, any needed information
    either.'
  merge: -1
