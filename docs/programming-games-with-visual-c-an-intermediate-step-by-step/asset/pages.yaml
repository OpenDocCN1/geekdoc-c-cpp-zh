  md: '# Graphics Object


    As mentioned, graphics methods (drawing methods) are applied to graphics objects.
    Graphics objects provide the “surface” for drawing methods and can be created
    using many of the Visual C# controls. The usual controls for graphics methods
    are the form, the picture box control, and the panel control. Here, we will use
    the panel control for drawing. It provides a nicely “contained” drawing area.


    There are three steps involved in creating a graphics object. We first declare
    the object (**myGraphics**) using the standard standard:


    Graphics myGraphics;


    Placement of this statement depends on scope. Place it in a method method level
    scope. Place it with other form level declarations for form level scope.


    Anything drawn to a graphics object is represented by the **BackgroundImage**
    property of the host control. This property, in turn, uses a **bitmap object**
    to save anything drawn to it. So, a second step in creating a graphics object
    is to create a blank **bitmap** object for the **BackgroundImage** property of
    the host control for **myGraphics**. If that control is named **myPanel** (we
    will use a panel control), the **Bitmap** constructor is:


    ```

    myPanel.BackgroundImage = new Bitmap(myPanel.Width, myPanel.Height, PixelFormat);

    ```


    The first two arguments define the bitmap as having the same dimensions (**Width**
    and **Height**) as the host control. The last argument specifies what format is
    used to maintain the graphics. There are many possible values for **PixelFormat**.
    We will use a ‘medium resolution’ value for **System.Drawing.Imaging.PixelFormat.Format24bppgb.'
  merge: -1
  pgno: 743
- img_proc: true
  md: 'As a last step, we create the graphics object using the panel’s background
    image:


    ```

    myGraphics = Graphics.FromImage(myPanel.BackgroundImage);

    ```


    Once a graphics object is created, all graphics methods are applied to this object.
    Hence, to apply a drawing method named DrawingMethod to the myGraphics object,
    use:


    ```

    myGraphics.DrawingMethod(arguments);

    ```


    where arguments are any needed arguments.


    There are two important drawing methods we introduce now. First, after all of
    your hard work drawing in a graphics object, there are times you will want to
    erase or clear the object. This is done with the Clear method:


    ```

    myGraphics.Clear(color);

    ```


    This statement will clear a graphics object and fill it with the specified color.
    We will look at colors next. The usual color argument for clearing a graphics
    object is the background color of the host control, or:


    ```

    myGraphics.Clear(myPanel.BackColor);

    ```


    After applying graphics methods to a graphics object, the host control must be
    refreshed to reflect changes. The syntax for our example control is:


    ```

    myPanel.Refresh();

    ```


    If something doesn’t appear after drawing in a graphics object, it’s probably
    because you forgot to do a Refresh of the host control.


    All graphics methods use the coordinates of the hosting control:'
  merge: -1
  pgno: 744
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_745_0.png)


    This is the same coordinate system we have been using for the **Moon Landing program**.
    Points are referred to by a Cartesian pair, **(x, y)**. In the diagram, note the
    **x** (horizontal) coordinate runs from left to right, starting at **0** and extending
    to **myPanel.Width - 1**. The y (vertical) coordinate goes from top to bottom,
    starting at **0** and ending at **myPanel.Height - 1**. All measurements are integers
    and in units of **pixels**.'
