    possibleWins[4] = "147"

    possibleWins[5] = "258"

    possibleWins[6] = "048"

    possibleWins[7] = "246"

    ```


    So our win logic would be to go each possible win and see if the corresponding
    elements of boxArray all contain the same mark (X or O, but not blank). If so,
    a winner is declared.


