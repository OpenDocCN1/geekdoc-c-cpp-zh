  md: '# Concatenation Operators


    To concatenate two string data types (tie them together), use the + symbol, the
    string concatenation operator:


    ```

    currentTime = "The current time is " + "9:30";ntextSample = "Hook this " + "to
    this";

    ```


    Visual C# offers other concatenation operators that perform an operation on a
    variable and assigning the resulting value back to the variable. Hence, the operation


    ```

    a = a + 2;

    ```


    Can be written using the addition concatenation operator (+=) as:


    ```

    a += 2;

    ```


    This says a is is incremented by 2.


    Other concatenation operators and their symbols are:


    | Operator Name | Operator Symbol | Operator Task |

    |---|---|--|

    | String | a += b; | a = a + b; |

    | Addition | a += b; | a = a + b; |

    | Subtraction | a -= b; | a = a - b; |

    | Multiplication | a *= b; | a = a * b; |

    | Division | a /= b; | a = a / b; |


    We often increment and decrement by one. There are operators for this also. The
    increment operator:


    ```

    a++; is equivalent to: a = a + 1;

    ```'
