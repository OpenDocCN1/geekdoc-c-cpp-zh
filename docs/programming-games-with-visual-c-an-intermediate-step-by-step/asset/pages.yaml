    By varying **landscapeX** and **landscapeY**, the background landscape will appear
    to move (or scroll) within the viewer panel. So, the question is how do you determine
    **landscapeX** and **landscapeY** to give the lander this appearance of motion?


    We choose to keep the lander image centered within the panel viewer (if possible).
    Superimposing the viewer panel on the landscape image (also showing the lander
