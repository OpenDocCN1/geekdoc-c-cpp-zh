  md: '# Tic Tac Toe Form Design


    We begin building the Tic Tac Toe game project. Let''s build the form. Start a
    new project in Visual C#. Once started, we suggest you immediately save the project
    with a name you choose. This sets up the folder and file structure needed for
    your project.


    We need 14 label controls (set AutoSize to False to allow resizing; setBorderStyle
    temporarily to FixedSingle so we can see where they fit) on the left side of the
    form. Place three group boxes on the right side, along with two button controls.
    Place two radio button controls in each box. The form should look like this:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_338_0.png)


    The label controls are used for messaging, to display the marks (X and O) and
    to form the grid. The radio buttons establish game options. The buttons (one to
    start and stop the game and one to exit the project) are used to control operation
    of the game.'
