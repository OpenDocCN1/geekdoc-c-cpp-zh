  md: '# # Leap Frog Game Project Review


    The Leap Frog game project is now complete. Save and run the project and make
    sure it works as promised. Check that all options work correctly.


    If there are errors in your implementation, go back over the steps of form and
    code design. Go over the developed code – make sure you understand how different
    parts of the project were coded. As mentioned in the beginning of this chapter,
    the completed project is saved as Leap Frog in the KidGamesVCS/KidGamesVCS Projects
    folder.


    While completing this project, new concepts and skills you should have gained
    include:


    +   - Proper steps in game design and game flow.

    - Capabilities and use of many Visual C# controls.

    - More graphics capabilities.

    - Basic object-oriented programming concepts.

    - Reading keyboard inputs.

    - Game scoring and level logic.

    - Working with data files (for saving high scores).


    This is the last project in these notes. By now, you should be a fairly competent
    Visual C# programmer. There’s always more to learn though. Consult the Internet
    and bookstores for more books about skills you might want to gain.'
