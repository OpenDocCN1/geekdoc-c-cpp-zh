  md: '# Course Description


    PROGRAMMING GAMES WITH VISUAL C# teaches Visual# programming concepts while providing
    detailed step-by-step instructions for building many fun games. The tutorial is
    appropriate for both kids and adults. The games built are non-violent and teach
    logical thinking skills.


    PROGRAMMING GAMES WITH VISUAL C# explains (in simple, easy-to-follow terms) how
    to build a Visual C# game project. Students learn about project design, the Visual
    C# language, and how to debug and distribute finished projects. Game skills learned
    include handling multiple players, scoring, graphics, animation, and sounds. The
    game projects built include (in increasing difficulty):


    +   * Safercracker – Decipher a secret combination using clues from the computer.

    * Tic Tac Toe – The classic game.

    * Match Game – Find matching pairs of hidden photos – use your own photos!

    * Pizza Delivery – A business simulation where you manage a small pizza shop for
    a night.

    * Moon Landing – Land a module on the surface of the moon.

    * Leap Frog – An exciting arcade game where you maneuver your frog through traffic
    and across a river.


    The product includes over 700 pages of self-study notes, all Visual C# source
    code and all needed graphics and sound files.'
  merge: -1
