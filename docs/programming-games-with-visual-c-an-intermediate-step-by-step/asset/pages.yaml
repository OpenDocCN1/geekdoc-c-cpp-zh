    \ lines:\n\n```\nprivate void btnShow_Click(object sender, EventArgs e)\n{\n \
    \   int tempF;\n    int tempC;\n    tempF = -60;\n    do\n{\n        tempC = FtoC(tempF);\n\
    \        Console.WriteLine(\"Iteration: \" + numberCalls.ToString());\n\n```"
