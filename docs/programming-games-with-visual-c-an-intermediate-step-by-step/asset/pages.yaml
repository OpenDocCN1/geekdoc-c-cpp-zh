  md: '# # Code Design – One Player, Solitaire Game


    If the **One Player, Play Alone** options are selected in **Match Game**, a single
    player tries to find matching photos on the playing form. The computer keeps track
    of how many guesses it takes until all matches have been found.


    The steps in the one player, solitaire game following a click on a photo box are:


    +   > Make sure the box has not already been clicked.

    > Increment number of guesses (use lblScore[1])

    > Display photo.

    > If first choice, allow second choice and display that photo. Compare the two
    photos.

    > If photos match:

    > - Play matching sound.

    > - Remove picture boxes with photos from form

    > - Increment number of matches by 1.

    > - Decrement **photosRemaining** by 2.

    > - If **photosRemaining = 0**, set **gameOver** to **true**, play game over and
    sound game.

    > - If **photosRemaining != 0**, continue playing.

    > If photos do not match:

    > - Play no match sound.

    > - Replace photos with ''cover'' graphic.

    > - Continue playing.


    To implement these steps, we make a few modifications to the **PhotoBox Click**
    event method. Those modifications are shaded:'
