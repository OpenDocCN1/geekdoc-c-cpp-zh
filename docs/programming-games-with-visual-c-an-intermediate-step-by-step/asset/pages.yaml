    **BackColor**: Gets or sets the text box background color.

    **BorderStyle**: Gets or sets the border style for the text box.

    **Font**: Gets or sets font name, style, size.

    **ForeColor**: Gets or sets color of text or graphics.

    **HideSelection**: Gets or sets a value indicating whether the selected text in
    the text box remains highlighted when the control loses focus.

    **Lines**: Gets or sets the lines of text in a text box control.

    **MaxLength**: Gets or sets the maximum number of characters the user can type
    into the text box control.'
