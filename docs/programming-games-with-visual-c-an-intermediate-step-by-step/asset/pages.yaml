    \ game play should get faster, vehicles should be added and logs should be removed.\
    \ And, to be nice, with every second level, you are given a new frog (up to a\
    \ maximum of five). The rules I developed for each level are:\n\n+   - Decrement\
    \ Interval property of timRiver and timRoad by (minimum value of 30).\n- If odd\
    \ number level (>1), add a frog (maximum number of 5).\n- In Level 2, remove log[0]\n\
    - In Level 3, remove log[6], add vehicle[0] and vehicle[4]\n- In Level 4, remove\
    \ log[11], add vehicle[6] and vehicle[10]\n- In Level 5, add vehicle[3]\n\nSo\
    \ once we reach Level 5, all 12 vehicles are on the road and there are 9 logs\
    \ in the river. By this level, the Interval properties for the river and road\
    \ panels are down to 40 milliseconds – things are really moving. At each level,\
    \ we also reposition the logs and vehicles to their original starting positions\
    \ to avoid the ‘overlap’ problem.\n\nAll of the above rules are implemented in\
