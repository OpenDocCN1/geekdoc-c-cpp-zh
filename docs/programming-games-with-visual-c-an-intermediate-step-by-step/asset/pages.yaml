  md: '# # Multiple Form Visual C# Applications


    All games developed so far in these notes use a single form. Many Visual C# applications
    use **multiple forms**. The **About** window associated with most applications
    is a common example of using a second form in an application. We want to learn
    how to manage multiple forms in our projects. There are four major considerations
    in using multiple forms:


    +   1. Adding forms to a project

    2. Deciding which form appears when the project begins

    3. How to make forms appear and disappear using code

    4. Transferring information from one form to another


    We will consider each of these points.


    To add a new, blank form to an application, click the **Add New Item** button
    on the toolbar and select **Add Windows Form** or select **Add Windows Form**
    under the **Properties** menu. A dialog box will appear asking you to name the
    new form and click **Add**. The newly added form will be listed in the **Solution
    Explorer** window. To have the new form appear in the Design window, highlights
    its name and click the **View Designer** button in the Solution Explorer toolbar.
    Or, double-click its name in the Solution Explorer. Each form is designed using
    exactly the same method we always use: draw the controls, assign properties, and
    write code.


    It is also possible to add an existing form to an application. You can use such
    a form, as is, or modify it for the new application. To add an existing form to
    a project, choose the **Project** menu item and select **Add Existing Item**.
    Browse the directories until the desired form file is located. Select it and click
    **Open.**


    If you want to delete a form from a project, simply right-click the form name
    in the Solution Explorer window. A menu will appear. Select **Delete.**'
  merge: -1
  pgno: 621
- img_proc: true
  md: "Make sure you really want to delete the form – you will not be asked if you\
    \ know what you’re doing!\n\nDisplay of the different forms is handled by code\
    \ you write. You need to decide when and how you want particular forms to be displayed.\
    \ The user always interacts with the ‘active’ form.\n\nThe first decision to make\
    \ is to determine which form will be the startup form. This is the form that appears\
    \ when your application begins. Up to now, the startup form has been the one,\
    \ single form in our project. Now, we must choose among multiple forms. To do\
    \ this, in Solution Explorer, open the file Program.cs. In that file is a short\
    \ construction (Main) with this code:\n\n```\nstatic void Main()\n{\n    Application.EnableVisualStyles();\n\
    \    Application.SetCompatibleTextRenderingDefault(false);\n    Application.Run(new\
    \ Form1());\n}\n```\n\nThe startup form is specified by the final line in this\
    \ method:\n\n> Application.Run(new Form1()); // Startup form Name\n\nBy changing\
    \ this form Name to another form in your project, newly identified form becomes\
    \ the startup form.\n\nThe startup form automatically loads when your application\
    \ is run. Any other form in the project will not display itself by default. When\
    \ you want another form to appear, you write code to load and display it (using\
    \ the Show or ShowDialog methods). Similarly, when you want a form to disappear,\
    \ you write code to unload or hide it (using Close and Hide methods)."
  merge: -1
  pgno: 622
- img_proc: true
  md: 'There are two ways to display a form (here, named frmExample). First, you must
    create the form you are displaying. This is done by declaring and constructing
    a new ‘instance’ of the form:


    Form myForm = new frmExample();


    It can then be displayed as a modal form:


    ```

    myForm.Show(); // Modal display

    ```


    or as a modelless form:


    ```

    myForm.Show();

    ```


    In modal display, no open window in the application may be accessed as long as
    the modal window is open (works like a message box). In modelless display, any
    other open application window may be clicked and made active. Modelless forms
    are harder to program, because users can access them in an unpredictable order.


    To make a form disappear, we can use the Close method (removes form from memory)
    or the Hide method (sets the Visible property to False). To close the current
    form, use:


    ```

    this.Close();

    ```


    To hide the form, use:


    ```

    this.Hide();

    ```


    The last consideration in a multiple form application is to decide how (if needed)
    to transfer information from one form to another. There are several ways to do
    this. We will look at transferring information using the form constructor. Above
    we said to construct an instance of frmExample, we could use:'
  merge: -1
  pgno: 623
- img_proc: true
  md: '```

    Form myForm = new frmExample();

    ```


    To transfer information to this new form, we will not use this code, but replace
    it with an overloaded constructor for frmExample:


    ```

    Form myForm = new frmExample(variables);

    ```


    where variables is a comma-delimited list of variables to transfer to frmExample.
    An overloaded constructor gives us an alternate way to create an object. Once
    created, myForm can access all the information provided by variables. We''ll see
    how to do this with the Pizza Delivery results. You''ll see it''s a pretty easy
    modification.'
  merge: -1
