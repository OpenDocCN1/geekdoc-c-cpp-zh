- img_proc: true
  md: 'Let’s do the math. We have two variables **centerX** and **centerY** that specify
    the distance from the edges of the viewer panel to the lander image to keep the
    lander centered:


    ```

    centerX = (pnlViewer.Width - lander.Width) / 2;

    centerY = (pnlViewer.Height - lander.Height) / 2;

    ```


    With these, the values of **landscapeX** and **landscapeY** (knowing **landerX**
    and **landerY**) are seen to be:


    ```

    landscapeX = landerX - centerX;

    landscapeY = landerY - centerY;

    ```


    So, as the lander moves (**landerX** and **landerY**), we compute **landscapeX**
    and **landscapeY**. This defines the region of the landscape image to copy into
    the viewer panel to give the scrolling effect.


    Notice we said we would center the lander in the viewer panel, if possible. There
    are four cases where we will not be able to center the lander, each related to
    being beyond one of the four borders of the landscape image. Let’s look at each
    border and the limiting values of **landscapeX** and **landscapeY**:


    +   - **Left border, landscapeX > 0**

    - **Right border, landscapeX < landscape.Width - pnlViewer.Width**

    - **Top border, landscapeY > 0**

    - **Bottom border, landscapeY < landscape.Height - pnlViewer.Height**


    In these limiting cases, we will relax the need to center the lander and allow
    it to move freely (sometimes even out of the viewer).


