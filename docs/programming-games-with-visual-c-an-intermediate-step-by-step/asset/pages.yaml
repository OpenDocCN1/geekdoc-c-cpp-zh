  md: '# # Comparison and Logical Operators


    There are six **comparison operators** in Visual C# used to compare the value
    of two expressions (the expressions must be of the same data type). These are
    the basis for making decisions:


    | Operator | Comparison |

    | --- | --- |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |

    | = | Equal to |

    | != | Not equal to |


    It should be obvious that the result of a comparison operation is a **bool** value
    (**true** or **false**). **Examples:**


    +   - a = 9.6, b = 8.1, a > b returns true

    - a = 14, b = 14, a < b returns false

    - a = 14, b = 14, a >= b returns true

    - a = 7, b = 11, a <= b returns true

    - a = 7, b = 7, a == b returns true

    - a = 7, b = 7, a != b returns false


    Logical operators operate on **bool** data types, providing a Boolean result.
    They are also used in decision making. We will use three **logical** operators


    | Operator | Operation |

    | --- | --- |

    | ! | Logical Not |

    | && | Logical And |

    | || | Logical Or |'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'The Not (!) operator simply negates a Boolean value. It is very useful for

    ''toggling'' Boolean variables. Examples:


    +   - a = true, then !a = false

    - a = false, then !a = false


    The And (&&) operator checks to see if two different bool data types are

    true true. If both are true, the operator returns a true. Otherwise, it returns

    a false value. Examples:


    +   - a = true, b = true, then a && b = true

    - a = true, b = false, then a && b = false

    - a = false, b = true, then a && b = false

    - a = false, b = false, then a && b = false


    The Or (||) operator (typed as two “pipe” symbols) checks to see if either

    of two bool data types is true. If either is true, the operator returns a true.

    Otherwise, it returns a false value. Examples:


    +   - a = true, b = true, then a || b = true

    - a = true, b = false, then a || b = true

    - a = false, b = true, then a || b = true

    - a = false, b = false, then a || b = false


    Logical operators follow arithmetic operators in precedence. Use of these

    operators will become obvious as we delve further into coding.'
