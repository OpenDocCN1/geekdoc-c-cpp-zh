  md: '# Game Design – Prelude to Form

    Design


    Before placing controls on the Leap Frog form, we need to talk a a bit about game
    design. In this game (and all arcade type games), things are constantly moving
    around and the code is checking to see where things are located and whether they
    are colliding with other things. To do all this, we need specific information
    about the size of the objects used in the game.


    In Leap Frog, the basic object will be the frog. The program uses several graphics
    to represent the frog moving up, down, left, right or sitting at home. Each of
    these graphics is 40 pixels by 40 pixels. For example, the frog moving up (FrogUp.gif,
    in the KidGamesVCS\KidGamesVCSProjects\Leap Frog folder) is:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_832_0.png)


    This frog needs to fit in a highway lane, in the area with the snake, on a floating
    log in the river and in the home location at the top of the screen. Hence, in
    designing the game form, each element, whether it is a panel control hosting graphics
    or an element within the panel (vehicle, snake, log), will be sized with this
    basic ‘frog element’ in mind.


    Three vehicles are used the game, a car, a truck and a semi, each vehicle having
    a left moving graphic and a right moving graphic. The car is 40 pixels by 40 pixels.
    Here is the moving car (LeftCar.gif, in the KidGamesVCS\KidGamesVCS Projects\Leap
    Frog folder):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_832_1.png)


    The truck is 80 pixels by 40 pixels (2 ‘frog units’). Here is the left moving
    truck (LeftTruck.gif, in the KidGamesVCS\KidGamesVCSProjects\Leap Frog folder):'
  merge: -1
  pgno: 832
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_833_0.png)


    And, the semi is 120 pixels by 40 pixels (3 ‘frog units’). Here is the left moving
    semi (LeftSemi.gif, in the KidGamesVCS\KidGamesVCS Projects\Leap Frog folder):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_833_1.png)


    Similarly, three log sizes are used in the game. The smallest log is 40 pixels
