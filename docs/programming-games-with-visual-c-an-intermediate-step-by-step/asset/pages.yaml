  md: '# Code Design – Move Car


    Once there are pizzas in the car, we’re ready to start deliveries. Click on a
    location on the delivery grid and the car (represented by a little yellow image)
    travels from the pizza parlor to that location. You follow the same process to
    have the car return to the pizza parlor when you need more pizzas. There are lots
    of things to do here: define the pizza parlor location (randomly set), detect
    clicks on the delivery grid, identify the labeled control, and then move the car
    to the clicked location.


    We need several variables to keep track of the car. Add these form level declarations
    to the code window:


    ```

    int pizzaC, pizzaR;

    int deliveryC, deliveryR;

    int carC, carR;

    int deltaC, deltaR;

    int mileage;

    bool carGoing;

    ```


    pizzaC and pizzaR are the column and row numbers for the pizza parlor location
    in the delivery grid (marked by an X). deliveryC and deliveryR are the column
    and row numbers for the delivery (the labeled control). carC and carR are the
    column and row numbers for the current car location. deltaC and deltaR are the
    difference between the car and delivery columns and rows. Lastly, mileage is the
    number of grid locations the car has moved through and carGoing indicates if the
    car is currently moving (for pause mode).


    The timer control timCar will be used to make the car move. We define one constant
    to set car speed:


    ```

    const int minPer20Squares = 3;

    ```'
