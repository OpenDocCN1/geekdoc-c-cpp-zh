  md: '# Code Design – Home Collisions


    Currently, the frog can jump off at any location on the home panel. We’ll make
    that task a little more difficult by specifying five rectangular ‘home’ regions.
    If the frog leaves a log and enters one of these regions (there is a ‘total collision’)
    the frog is home safe. If he misses home, a splash is heard and his journey ends.
    In either case, a new frog appears.


    The home panel is 640 pixels wide (just like the other panels) and 80 pixels high.
    We will define each home to be a black rectangle, 60 pixels wide by 60 pixels
    high. By making the homes 60 pixels wide, we give the frog (40 pixels wide) a
    little leeway when jumping off a log. These homes will be uniformly spread across
    the panel:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_938_0.png)


    Each home is 60 pixels wide and separated by gaps of 50 pixels. The left and right
    borders are 70 pixels wide. We make the borders wider to make it a little easier
    for the frog to reach these homes. If you’d like, add five homes, four gaps and
    two borders to see you indeed get a total width of 640 pixels.


    The home panel will be drawn in a method DrawHome. Each home will be defined by
    a rectangle structure array. Declare that array (rectHome) in the form level declarations
    area:


    ```

    Rectangle[] rectHome = new Rectangle[5];

    ```


    In DrawHome, each rectangle is defined and drawn as a filled area:'
