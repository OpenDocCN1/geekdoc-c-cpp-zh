  md: '# Form Object


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_86_0.png)


    The Form is the object where the user interface is drawn. It is central to the
    development of Visual C# applications. The form is known as a container object,
    since it ‘holds’ other controls. One implication of this distinction is that controls
    placed on the form will share BackColor, FormControl and Font properties. To change
    this, select the desired control (after it is placed on the form) and change the
    desired properties. Another feature of a container control is that when its Enabled
    property is False, all controls in the container are disabled. Likewise, when
    the container control Visible property is False, all controls in the container
    are not visible.


    Here, we present some of the more widely used Properties, Methods and Events for
    the form. Recall properties described the appearance and value of a control, methods
    are actions you can impose on controls and events occur when something is done
    to the control (usually by a user). This is not an exhaustive list – consult-online
    help for such a list. You may not recognize all of these terms now. They will
    be clearer as you progress in the course. The same is true for the remaining controls
    presented in this chapter.


    Form Properties:


    +   * Name: Gets or sets the name of the form (three letter prefix for form name
    is frm).

    * AcceptButton: Gets or sets the button on the form that is'
  merge: -1
