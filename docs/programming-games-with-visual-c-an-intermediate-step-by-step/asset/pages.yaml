  md: '# Handling Multiple Events in a Single Event Method


    In most Visual C# projects, each event method handles a single event. First, When
    grouping controls, like the 9 keypad buttons here, it would be nice if a single
    method could handle multiple events. For example, if we have 4 buttons in a group,
    when one button is clicked, it would be preferable to have a single method where
    we decide which button was clicked, as opposed to having to monitor 4 separate
    event methods. Let’s see how to do this.


    We use a button example to illustrate. Assume we have four buttons (button1, button2,
    button3, button4) that we want to share the same Click event method. To make this
    method sharing possible, we use the properties window to establish events. First,
    we select **button1**, go to the properties window and click the **Events** button.
    The **Click** event will be highlighted since it is the default event for the
    button control:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_297_0.png)


    Usually, at this point, we would double-click the event and the Visual C# environment
    would build an event method named **button1_Click**. The name assigned to this
    method by Visual C# is *arbitrary*. We can assign any name we want and it would
    still handle the **Click** event for **button1**.'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'use a different name, we type the name next to the event in the properties
    window. Since the method will now handling multiple events, we would want to use
    a name to represent a group of buttons, not just a single button. A name like
    myButtons_Click might be more appropriate – we will use that in this example.


    Once you type a name for an event in the properties window and press <Enter>,
    the code window will open in the new method. For this example, we would see:


    ```

    private void myButtons_Click(object sender, EventArgs e)

    {

    }

    ```


    Right now, this method only handles the Click event for button1.


    To have another control share this method, we again use the properties window.
    Next, we would choose button2 in the properties window, then display its events
    and click the drop-down box that appears to the right of the Click event. One
    of the choices will be the myButtons_Click event method. By simply choosing this
    existing method, it will now be the method called for the Click event for button2.
    We then repeat this process for each control we want to share the same event method.
    Hint: a quick way to do this is to “group select” every control on the form that
    is to share an event method. Then using event selection in the properties window,
    choose the shared method.


    With this process, we can attach any existing event of any control to any we want!
    It is best to append like events of controls. It is possible to process dissimilar
    events of dissimilar controls with a single event method, but you need to be careful.


