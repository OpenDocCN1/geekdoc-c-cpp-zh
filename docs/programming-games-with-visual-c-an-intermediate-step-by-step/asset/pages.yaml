  md: '# Collision Detection


    As the frog moves upward from one level to the next, we need some way to see if
    it collides or overlaps with other objects. For example, in the road panel, we
    need to see if a vehicle hits the frog. In the snake panel, we need to check if
    the snake and frog collide. In the river, we want to see if the frog overlaps
    with a log, so it can float down the river. And, once home (still to be defined),
    we need to make sure the frog fits in the specific region. Each object, or sprite,
    is defined by a rectangle structure. Hence, we want to know if two rectangles
    intersect. In Visual C#, this test can be accomplished using the Intersect method
    of the Rectangle structure.


    To use the Intersect method, we need three Rectangle structures. The first two
    (call them rectangle1 and rectangle2) describe the rectangles being checked for
    intersection. The rectangle describing the intersection of these two rectangles
    (collided) is then defined by:


    ```

    collided = Rectangle.Intersect(rectangle1, rectangle2);

    ```


    Once the intersection (or collision) rectangle is created using Intersect, we
    can check the intersection by examining the IsEmpty property:


    ```

    collided.IsEmpty

    ```


    If this property is true, there is no intersection or collision. If IsEmpty is
    false, there is intersection and the Left, Top, Width and Height properties of
    the collided rectangle structure define that intersection region.


    Just because two rectangles intersect, you may not want to declare a collision.
    In many cases, it is prudent to check for intersection and, once detected, see
    how large the intersection area is. For our example, that area is given by:


    ```

    collided.Width * collided.Height

    ```'
  merge: -1
  pgno: 914
- img_proc: true
  md: "If this intersection area is small compared to the size of the compared rectangles,\
    \ you might not allow the collision. We will use such logic in Leap Frog. This\
    \ will allow us to adjust how close a vehicle needs to be to the frog before it\
    \ disappears. Or, we can adjust how close to the edge of a log the frog can get\
    \ and still sit on it.\n\nFor our collision detection, we will define a general\
    \ method IsCollided that checks for the collision between two Rectangle structures\
    \ (rectangle1 and rectangle2). It returns a bool result based on the percentage\
    \ of overlap (percent, 1 to 100) of rectangle2 on rectangle1. If the collision\
    \ area is greater than percent, a value of true is returned, false is returned.\
    \ The code:\n\n```\nprivate bool IsCollided(Rectangle rectangle1, Rectangle rectangle2,\
    \ double percent)\n{\n  Rectangle collided;\n  collided = Rectangle.Intersect(rectangle1,\
    \ rectangle2);\n  if (collided.Width * collided.Height >= percent * rectangle2.Width\
    \ * rectangle2.Height / 100)\n    return (true);\n  else\n    return (false);\n\
    }\n```\n\nAdd this method to the project.\n\nHere are some examples of how this\
    \ method works.\n\n# Example 1:"
