  md: "# Code Design – Marking Grid\n\nIn the Tic Tac Toe player game, when a player\
    \ clicks a box in the grid, we want the proper mark (X or O) to appear. After\
    \ each mark, we then need to see if anyone won. If there is no win, and there\
    \ are still empty locations, we switch to the next player.\n\nSo, when a grid\
    \ box is clicked, we follow these steps:\n\n+   > Make sure there is not a mark\
    \ there already.\n> Increment numberClicks.\n> Place proper mark in corresponding\
    \ label control (X if xTurn true, otherwise O).\n> Switch to next player (not\
    \ needed if there is a win or draw).\n> Check for win. If there is a win, declare\
    \ the winner and stop the game.\n> Check if numberClicks = 9 (board is full with\
    \ no win). If so, declare the draw and stop.\n\nThe code to perform these steps\
    \ will be placed in a method named lblBox_Click. This method should be set to\
    \ handle the Click event for all 9 label controls used in the Tic Tac Toe grid\
    \ (lblBox1, lblBox2, lblBox3, lblBox4, lblBox5, lblBox6, lblBox7, lblBox8, lblBox9).\n\
    \nAdd this method (lblBox_Click) to your project. This implements the needed steps\
    \ to accept the player’s marking of the grid (we are not checking for a win):\n\
    \n```\nprivate void lblBox_Click(object sender, EventArgs e)\n{\n    String whoWon\
    \ = \"\"\";\n    int i;\n    if (canClick)\n```"
