  md: "+   3 Road panel (top lane)\n2 Road panel (middle lane)\n1 Road panel (bottom\
    \ lane)\n0 Start Panel\n\nFor horizontal motion within a panel, the frog will\
    \ leap in units of 40 pixels. Hence, when a game begins, we want the frog to be\
