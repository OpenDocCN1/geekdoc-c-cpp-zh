  md: '# Match Game Project Review


    The Match Game project is now complete. Save and run the project and make sure
    it works as promised. Check that all options work correctly.


    If there are errors in your implementation, go back over the steps of form and
    code design. Go over the developed code – make sure you understand how different
    parts of the project were coded. As mentioned in the beginning of this chapter,
    the completed project is saved as Match Game in the KidGamesVCSKidGamesVCS Projects
    folder.


    While completing this project, new concepts and skills you should have gained
    include:


    +   - Proper steps in game design and game flow.

    - Capabilities and use of many Visual C# controls.

    - How to randomly sort integers (shuffle numbers).

    - How to implement delays in games.

    - How to give the computer graduated intelligence in playing games.'
