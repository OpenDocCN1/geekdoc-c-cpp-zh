    > How to use the Visual C# help system

    > The three steps in building a Visual C# project

    > Different ways to place controls on a form

    > Methods to set properties for controls

    > Proper control naming convention

    > How to add event methods and use the code window


    Before starting the game projects in Chapter 5, we need to review the controls
    used to build projects (Chapter 2), the language of Visual C# (Chapter 3) and
