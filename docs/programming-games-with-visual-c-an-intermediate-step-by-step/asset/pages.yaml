  md: '# Match Game Project Preview


    In this chapter, we will build a Match Game. Ten pairs of photos are hidden on
    a playing board. The objective is to find matching pairs. Turns alternate between
    players – an extra turn is earned with each match. The version we build here allows
    two players to compete against each other or to have a single player play a solitaire
    version or compete against the computer.


    The finished project is saved as Match Game in the KidGamesVCSKidGamesVCS Projects
    folder. Start Visual C# and open the finished project. Open the form (double-click
    MatchGame.cs in Solution Explorer) and you will see:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_410_0.png)'
