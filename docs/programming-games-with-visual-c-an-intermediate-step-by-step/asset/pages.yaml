- img_proc: true
  md: '# Preview


    I bet you’re ready to show your friends, family and colleagues some of the applications
    you have built using Visual C#. Just give them a copy of all your project files,
    ask them to download and install Visual C# and learn how to open and run a project.
    Then, have them open your project and run the application.


    I think you’ll agree this is asking a lot of your friends. We need to know how
    to run an application **without** Visual C#. In this Appendix, we look at a simpler
    way to share your work. We’ll use the **Leap Frog** game just built as an example.'
  merge: -1
  pgno: 1021
- img_proc: true
  md: <!-- no content -->
  merge: -1
