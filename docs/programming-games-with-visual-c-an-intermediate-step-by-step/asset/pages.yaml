  md: '# How to mark the projects.


    In a classroom environment, it is possible for teachers to mark student progress
    by asking questions during the various design and coding stages. Teachers can
    make their own written quizzes easily from the reference material provided, but
    I have found the requirement of completing projects (mastery) sufficient for gathering
    information about student progress – especially in the later grades.


    # Lessons encourage your programming extensions.


    Once concepts are learned, it is difficult to NOT know what to do for your own
    projects.


    Once having done my own projects in one language, such as Visual C#, I know that
    I could easily adapt them to other languages once I have studied the Kidware Software
    tutorials. I do not believe there is any other reference material out there which
    would cause me to make the same claim! In fact, I know there is not as I have
    spent over a decade looking!


    Having used Kidware Software tutorials for the past decade, I have been successful
    at the expansion of my own learning to other platforms such as XNA for the Xbox,
    or the latest developer suites for tablets and phones. I thank Kidware Software
    and its authors for continuing to stand for what is right in the teaching methodologies
    which not only inspire, but propel the self-guided learner through what can be
    a highly intelligible landscape of opportunities.


    Regards,


    Alan Payne, B.A.H., B.Ed.

    Computer Science Teacher

    T.A. Blakelock High School

    Oakville, Ontario'
