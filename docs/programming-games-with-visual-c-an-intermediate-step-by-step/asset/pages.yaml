  md: '# Remaining Work


    Believe it or not, the basics of the moon landing program are done – we can control
    the lander and see its location and speed (label controls). But there is still
    a lot of work to be done to make this an appealing, useful game. Let''s outline
    the needed work, then get started.


    As implemented, the displayed information is not very useful. Knowing the distance
    from the left of the landscape rectangle (landerX) and the distance from the top
    of the rectangle (landery) does not tell us what we really need to know – how
    far are we from the landing pad. So, as a first task, we will place the landing
    pad on the landscape and display distances and speeds relative to the pad. To
    do this, we need to know image sizes, so we will load the images used in the program
    (though we won''t display them). We will add landing detection logic. We will
    also implement our first graphic indication of lander location (using the little
    label controls under the trajectory display panel).


    We need to modify the game to account for differences among the various pilot
    levels, including monitoring fuel consumption. And, of course, we need some sounds.
    After this, we will have a working ‘text version’ of the game.


    The text version of the game is acceptable, but graphics elements add that extra
    flair. The first graphic element we add is the trajectory display under the label
    controls. To add this element, we need to first discuss how to use Visual C# graphics
    objects. In particular, we will learn how to draw colored lines and circles.


    After tackling the trajectory display, we move on to the animated display of the
    lander moving across the landscape to the landing pad. To do this, we need more
    discussion of Visual C# graphics. We will learn how to use scrolling backgrounds
    and how to move objects around in a smooth fashion.'
  merge: -1
  pgno: 705
- img_proc: true
  md: 'And the final addition to **Moon Landing** will be development of an auto-pilot.
