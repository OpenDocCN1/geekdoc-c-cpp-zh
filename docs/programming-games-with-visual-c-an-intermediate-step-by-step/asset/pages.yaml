  md: '# Visual C# Data Types


    Each variable is used to store information of a particular type. Visual C# has
    a wide range of data types. You must always know the type of information stored
    in a particular variable.


    **bool** (short for Boolean) variables can have one of two different values: **true**
    or **false** (reserved words in C#). Boolean variables are helpful in making decisions.
    There is one possible point of confusion when working with Boolean variables.
    Note some control properties are Boolean, for example, the Enabled property. When
    setting a property at design time, the choices are **True** or **False** (using
    upper case letters). When setting Boolean variables in code (either setting control
    properties or some other variable), the choices are *true* or *false* (using lower
    case letters). Be aware of this when writing code. A common error is to use upper
    case values, rather than the proper lower case values.


    If a variable stores a whole number (no decimal), there are three data types available:
    **short**, **int** or **long**. Which type you select depends on the range of
    the value stored by the variable:


    | Data Type | Range |

    | --- | --- |

    | short | -32,768 to 32,767 |

    | int | -2,147,483,648 to 2,147,483,647 |

    | long | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |


    We will almost use the **int** type in our work.


    If a variable stores a decimal number, there are two data types: **float** or
    **double**. The double uses twice as much storage as float, providing more precision
    and a wider range. Examples:


    **Data Type** Value'
