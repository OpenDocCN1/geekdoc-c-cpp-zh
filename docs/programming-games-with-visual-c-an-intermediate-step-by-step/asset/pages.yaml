- img_proc: true
  md: '# RadioButton Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_105_0.png)


    On Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_105_1.png)


    RadioButton controls provide the capability to make a “mutually exclusive” choice
    among a group of potential candidate choices. This simply means, radio buttons
    work as a group, only one of which can be selected. Radio buttons are seen in
    all Windows applications. They are called radio buttons because they work like
    a tuner on a car radio – you can only listen to one station at a time! Examples
    for radio buttons would be twelve buttons for selection of a month in a year,
    a group of buttons to let you select a color or buttons to select the difficulty
    in a game.


    A first point to consider is how do you define a ‘group’ of radio buttons that
    work together? Any radio buttons placed on the form will act as a group. That
    is, if any radio button on the form is ‘selected’, all other buttons will be automatically
    ‘unselected.’ What if you need to make two independent choices? that is, you need
    two independent groups of radio buttons? To do this requires one of two grouping
    controls in Visual C#: GroupBox control or the Panel control. Radio buttons placed
    on either of these controls are independent from other radio buttons. We will
    discuss the group box control next – we’ll cover the panel control in a later
    chapter. For now, we’ll just be concerned with how to develop and use a single
    group of radio buttons.


    RadioButton Properties:


    +   - Name: Gets or sets the name of the radio button (three letter prefix for
    radio button name)'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'rdo).


    # BackColor


    Get or sets the radio button background color.


    # Checked


    Gets or sets a value indicating whether the radio button is checked.


    # Font


    Gets or sets font name, style, size.


    # ForeColor


    Gets or sets color of text or graphics.


    # TextAlign


    Gets or sets the alignment of text of the radio button.


    RadioButton Methods:


    # Focus


    Moves focus to this radio button.


    # PerformClick


    Generates a Click event for the button, simulating a click by a user.


    RadioButton Events:


    # CheckedChanged


    Occurs when the value of the Checked property changes, whether in code or when
    a button is clicked.


    # Click


    Triggered when a button is clicked. Checked property is automatically changed
    by Visual C#.


    When a radio button is clicked, it''s Checked property is automatically set to
    True by Visual C#. And, all other radio buttons in that button''s group will have
    a Checked property of False. Only one button in the group can be checked.


    Typical use of RadioButton control:


    +   - Establish a group of radio buttons.


    +   - For each button in the group, set the Name (give each button a similar name
    to identify them with the group) and Text property.'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'You might also change the Font, BackColor and Forecolor properties.


    +   Initialize the Checked property of one button to True.


    +   Monitor the Click or CheckChanged event of each radio button in the group
    to determine when a button is clicked. The ‘last clicked’ button in the group
    will always have a Checked property of True.'
  merge: -1
  pgno: 107
- img_proc: true
  md: <!-- no content -->
  merge: -1
