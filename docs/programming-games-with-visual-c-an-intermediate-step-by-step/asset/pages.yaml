  md: '# ListBox Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_116_0.png)


    On Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_116_1.png)


    ListBox control displays a list of items (with as many items as you like) from
    which the user can select one or more items. If the number of items exceeds the
    number that can be displayed, a scroll bar is automatically added. Both single
    item and multiple item selections are supported.


    ListBox Properties:


    | Name | Gets or sets the name of the list box (three letter prefix for list box
    name is lst). |

    | BackColor | Gets or sets the list box background color. |

    | Font | Gets or sets font name, style, size. |

    | ForeColor | Gets or sets color of text. |

    | Items | Gets the Items object of the list box. |

    | SelectedIndex | Gets or sets the zero-based index of the currently selected
    item in a list box. |

    | SelectedIndices | Zero-based array of indices of all selected items in the list
    box. |

    | SelectedItem | Gets or sets the currently selected item in the list box. |

    | SelectedItems | SelectedItems object of the list box. |

    | SelectionMode | Gets or sets the method in which items are |'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Sorted


    selected in list box (allows single or multiple selections).


    Gets or sets a value indicating whether the items in list box are sorted alphabetically.


    Text of currently selected item in list box.


    Gets or sets the index of the first visible item in list box.


    # Text


    # TopIndex


    # ListBox Methods:


    # ClearSelected


    Unselects all items in the list box.


    # FindString


    Finds the first item in the list box that starts with the specified string.


    # GetSelected


    Returns a value indicating whether the specified item is selected.


    # SetSelected


    Selects or clears the selection for the specified item in a list box.


    # ListBox Events:


    # SelectedIndexChanged


    Occurs when the SelectedIndex property has changed.


    Some further discussion is need to use the list box Items, SelectedItems object
    and SelectionMode property. The Items object has its own properties to specify
    the items in the list box. It also has its methods for adding and deleting items
    in the list box. The Items object is a zero-based array of the items in the list
    and Count (a property of Items) is the number of items in the list. Hence, the
    first item in a list box named IstExample.Items[0] is:


    ```

    IstExample.Items[0]

    ```


    The last item in the list is:'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# IstExample.Items[IstExample.Items.Count – 1]


    The minus one is needed because of the zero-based array.


    To add an item to a list box, use the **Add** method, to delete an item, use the
    **Remove** or **RemoveAt** method and to clear a list box use the **Clear** method.
    For our example list box, the respective commands are:


    +   * Add Item: **IstExample.Items.Add(ItemToAdd)**

    * Delete Item: **IstExample.Items.Remove(ItemToRemove)**

    * Clear list box: **IstExample.Items.RemoveAt(IndexOfToRemove)**


    List boxes normally list string data types, though other types are possible. Note,
    when removing items, indices for subsequent items in the list change following
    a removal.


    In a similar fashion, the **SelectedItems** object has its own properties to specify
    the currently selected items in the list box Of particular use is **Count** which
    tells you how many items are selected. This value, in conjunction with the SelectedIndices
    array, identifies the set of selected items.


    The **SelectionMode** property specifies whether you want single item selection
    or multiple selections. When the property **SelectionMode.One**, you can select
    only one item (works like a group of option buttons). When the SelectionMode property
    is set to **SelectionMode.MultiExtended**, pressing <Shift>and clicking the mouse
    or pressing <Shift>and one of the arrow keys extends the selection from the previously
    selected item to the current item. Pressing <Ctrl>and clicking the mouse selects
    or deselects an item in the list. When the property is set to SelectionMode.MultiSimple,
    a mouse click or pressing the spacebar selects or deselects an item in the list.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Typical use of ListBox control:


    +   > Set Name property, SelectionMode property and populate Items object (usually
    in Form_Load method).

    > Monitor SelectedIndexChanged event for individual selections.

    > Use SelectedIndex and SelectIndices properties to determine selected items.'
  merge: -1
