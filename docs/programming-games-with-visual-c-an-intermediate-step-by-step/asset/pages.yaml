  md: "# Code Design – Sprite Class, Methods\n\nWe can use the DrawImage method, the\
    \ Brush object, and the FillRectangle method to add methods to the Sprite class.\
    \ Class methods allow methods to perform certain tasks. Methods are written as\
    \ Visual C# methods. We will write three methods for our Sprite object, one that\
    \ draws it on a graphics object, one that moves it to a new location and one that\
    \ clears it. These methods are added to the class description exactly like general\
    \ methods are added to a form's code file. To add a method to a class description,\
    \ you select a name and a type of information the method will return (if there\
    \ is any returned value). Also determine any needed arguments for the method.\n\
    \nThe method Draw positions a Sprite object into a graphics object named g (passed\
    \ as an argument):\n\n```\npublic void Draw(Graphics g)\n{\n    g.DrawImage(this.Image,\
    \ this.Rectangle);\n    this.IsVisible = true;\n}\n```\n\nNote the use of the\
    \ keyword this to refer to the current object. Once the object is placed on g,\
    \ we set the IsVisible property to true.\n\nThe method Move moves a Sprite object\
    \ to a new location (using the Speed property). The required arguments are g,\
    \ the graphics object and bc, the brush used to erase the previous location:\n\
    \n```\npublic void Move(Graphics g, Brush bc)\n{\n    g.FillRectangle(bc, this.Rectangle);\n\
    \    this.Rectangle.X += this.Speed;\n```"
