  md: '# Code Design – Saving High Scores


    When the OK button on the High Scores form is clicked, we want to save player
    names and their high scores in a file. To do this, we look at how to write values
    of variables to files. The constructor for opening a file (myFile) for output
    is:


    ```

    System.IO.StreamWriter outputFile = new

    System.IO.StreamWriter(myFile);

    ```


    where myFile is the name (string) of the file to open and outputFile is the returned
    StreamWriter object used to write variables to disk. The filename must be a complete
    path to the file. As you type this line, the Intellense feature of the IDE will
    help you fill in the arguments.


    When writing to a file, it must be closed using the Close method:


    ```

    outputFile.Close();

    ```


    Once a file is closed, it is saved on the disk under the path and filename used
    to open the file.


    Information (variables or text) is written to a file in an appended fashion. Separate
    C# statements are required for each appending. There are various ways to write
    variables to a file. For our work, we will look at just one – WriteLine statement.


    For a file opened as outputFile, the syntax is to write a variable named myVariable
    is:


    ```

    outputFile.WriteLine(myVariable);

    ```


    where myVariable is the variable to save. This statement will write the variable
    on a single line in the file. In the Leap Frog game, the file we use'
