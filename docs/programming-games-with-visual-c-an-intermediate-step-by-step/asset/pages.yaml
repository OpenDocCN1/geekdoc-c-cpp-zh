  md: "# Code Design – Displaying Photos\n\nIn the Match Game two player game, when\
    \ a player clicks a picture box on the form, we want the proper photo to appear.\
    \ After clicking a second box, another photo is displayed and we see if there\
    \ is a match. If there is match, the photos are removed and the player is given\
    \ another turn. If there is no match, the photos are hidden again and we switch\
    \ to the next player.\n\nSo, when a picture box is clicked, we follow these steps:\n\
    \n+   - Make sure the box has not already been clicked.\n- Display photo.\n- If\
    \ first choice, allow second choice and display that photo. Compare the two photos.\n\
    - If photos match:\n    * Play matching sound.\n    * Remove picture boxes with\
    \ photos from form\n    * Increment proper player score by 1.\n    * Decrement\
    \ photosRemaining by 2.\n    * If photosRemaining = 0, set gameOver to true, determine\
    \ winner, play game over sound and stop game.\n    * If photosRemaining != 0,\
    \ give player another turn.\n- If photos do not match:\n    * Play no match sound.\n\
    \    * Replace photos with ‘cover’ graphic.\n    * Swap players.\n\nThe code to\
    \ perform these steps will be placed in a method named PhotoBox_Click. This method\
    \ is set to handle the Click event for all 20 picture box controls used in Match\
    \ Game (pictureBox1 through pictureBox20)."
