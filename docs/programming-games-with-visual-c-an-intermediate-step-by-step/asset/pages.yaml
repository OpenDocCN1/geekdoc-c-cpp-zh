  md: "# # Using General Methods in Projects\n\nMany projects have tasks that need\
    \ to be repeated or that compute a certain result, such as determining the winner\
    \ of a Tic Tac Toe game. Such tasks are usually coded in a general **method**,\
    \ using provided type information to return some value.\n\nGeneral methods can\
    \ help divide a complex application into more manageable units of code. This helps\
    \ meet goals of readability and reusability. As you build projects, it will be\
    \ obvious where such a method is needed. Look for areas in your application where\
    \ code is repeated in different places. It would be best (shorter code and easier\
    \ maintenance) to put this repeated code in a method. And, look for places in\
    \ your application where you want to do some long, detailed task – this is another\
    \ great use for a general method. It makes your code much easier to follow.\n\n\
    The form for a general method named **myMethod** is:\n\n```\nprivate type MyMethod(arguments)\
    \ // definition header\n{\n    [Method code]\n    return(returnValue);\n}\n```\n\
    \nThe definition header names the **method**, specifies its **type** (the type\
    \ of the returned value – if no value is returned, use the keyword **void**) and\
    \ defines any input **arguments** passed to the method. The keyword **private**\
    \ indicates the method will have form level scope.\n\n**arguments** are a comma-delimited\
    \ list of variables passed to the method. If there are arguments, we need to take\
    \ care how they are declared in the header statement. In particular, we need to\
    \ be concerned with:\n\n+   - Number of arguments"
  merge: -1
  pgno: 365
- img_proc: true
  md: '+   > Order of arguments

    > Type of arguments


    We will address each point separately.


    The **number** of arguments is dictated by how many variables the method needs
    to do its job. You need a variable for each piece of input information. You then
    place these variables in a particular **order** for the argument list.


    Each variable in the argument list will be a particular **data type**. This must
    be known for each variable. In Visual C#, variables are passed by value, meaning
    their value cannot be changed in the method. Variables are declared in the argument
    list using standard notation:


    # type variableName


    The variable name (variableName) is treated as a local variable in the method.


    Arrays can also be used as input arguments. To declare an array as an argument,
    use:


    # type[| arrayName


    The brackets indicate an array is being passed.


    To use a general method, simply refer to it, by name, in code (with appropriate
    arguments). Wherever it is used, it will be replaced by the computed value. A
    function can be used to return a value:


    ```

    rtnValue = MyMethod(arguments);

    ```


    or in an expression:'
  merge: -1
  pgno: 366
