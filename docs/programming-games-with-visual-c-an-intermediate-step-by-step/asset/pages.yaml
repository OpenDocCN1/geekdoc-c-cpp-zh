  md: '# Code Design – Computer Moves


    It''s time to give some intelligence to the computer, trying to make it a reasonable
    opponent in Match Game. Recall in the Tic Toe game, we had two options for a computer
    opponent: random or smart. The random opponent was fairly easy to beat and the
    smart opponent was impossible to beat. As an improvement to the Tic Tac Toe game,
    we suggested graduated levels of computer intelligence. We will take that approach
    here.


    For Match Game, we will still develop logic for a random choice (minimum intelligence)
    and a smart choice (maximum intelligence) by the computer. To give graduated levels
    of intelligence, we will decide how often we wait the computer to make a random
    choice versus how often it will make a smart choice. That graduated level of intelligence
    is selected in the Difficulty group box on the Match Game form.


    Examine the Difficulty group box and you will see four levels of difficulty: Easiest,
    Easy, Hard and Hardest. We will set some rules for intelligence at each level.
    Feel free to change these if you''d like. These rules establish what percentage
    of computer moves are random and what percentage are smart. Obviously lower levels
    of intelligence will have more random choices. The rules selected are:


    +   - Easiest Difficulty: 75% Random, 25% Smart

    - Easy Difficulty: 50% Random, 50% Smart

    - Hard Difficulty: 25% Random, 75% Smart

    - Hardest Difficulty: 10% Random, 90% Smart


    So even at the highest level of difficulty, we allow that the computer can make
    a mistake.


    Let''s build a framework for implementing a computer opponent, then develop the
    code for a random or a smart move. Add these form level declarations:'
