  md: '# Drawing the User Interface


    The first step in developing a Visual C# Windows application is to draw the user
    interface on the form. Make sure the Form appears in the Design window. There
    are four ways to place controls on a form:


    +   1. Click the tool in the toolbox and hold the mouse button down. Drag the
    selected tool over the form. When the cursor pointer is at the desired upper corner,
    release the mouse button and the default size control will appear. This is the
    classic “drag and drop” operation. Here is a button control “dropped” on the form:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_51_0.png)


    +   2. Double-click the tool in the toolbox and it is created with a default size
    on the form. You can then move it or resize it. Here is a button control placed
    on the form using this method:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_51_1.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '3. Click the tool in the toolbox, then move the mouse pointer to the form window.
    The cursor changes to a crosshair. Place the crosshair at the upper left corner
    of where you want the control to be and click the left mouse button. The control
    will appear at the clicked point. Here is a default size button placed on the
    form using this technique:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_52_0.png)


    4. Click the tool in the toolbox, then move the mouse pointer to the form window.
    The cursor changes to a crosshair. Place the crosshair at the upper left corner
    of where you want the control to be, press the left mouse button and hold it down
    while dragging the cursor toward the lower right corner. A rectangle will be drawn.
    When you release the mouse button, the control is drawn in the rectangle. A big
    button drawn using this method:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_52_1.png)'
  merge: -1
