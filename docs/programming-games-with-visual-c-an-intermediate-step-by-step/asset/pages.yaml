  md: '# PictureBox Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_121_0.png)


    On Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_121_1.png)


    Visual C# has powerful features for graphics. The PictureBox control is a primary
    tool for exploiting these features. The picture box control display graphics files
    (in a variety of formats), can host many graphics functions and can be used for
    detailed animations. Here, we concentrate on using the control to display a graphics
    file.


    PictureBox Properties:


    | Name | |

    | --- | --- |

    | Name | Gets or sets the name of the picture box (three letter prefix for picture
    box name is pic). |

    | BackColor | Get or sets the picture box background color. |

    | BorderStyle | Indicates the border style for the picture box. |

    | Height | Height of picture box in pixels. |

    | Image | Establishes the graphics file to display in the picture box. |

    | Left | Distance from left edge of form to left edge of picture box, in pixels.
    |

    | SizeMode | Indicates how the image is displayed. |

    | Top | Distance bottom of form title bar area to top edge of picture box, in
    pixels. |

    | Width | Width of picture box in pixels. |'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# PictureBox Events:


    Click Triggered when a picture box is clicked.


    The Image property specifies the graphics file to display. Five types of graphics
    files that can be viewed in a picture box are:


    | File Type | Description |

    | :--- | :--- |

    | Bitmap | An image represented by pixels and stored as a collection of bits in
    which each bit corresponds to one pixel. This is the format commonly used by scanners
    and paintbrush programs. Bitmap filenames have a .bmp extension. Icon A special
    type of bitmap file of maximum 32 x 32 |

    | Icon | filenames have an .ico extension. Icons are used to represent Windows
    applications |

    | Metafile | A file that stores an image as a collection of graphical objects
    (lines, circles, polygons) rather than pixels. Metafiles preserve an image more
    accurately than bitmaps when resized. Many graphics files available for download
    from the internet are metasiles. Metadata filenames have a .wmf extension |

    | JPEG | JPEG (Joint Photographic Experts Group) is a compressed bitmap format
    which supports 8 and 24 bit color. It is popular on the Internet and is a common
    format for digital cameras. JPEG filenames have a .jpg extension |

    | GIF | GIF (Graphic Interchange Format) is a compressed bitmap format originally
    developed by CompuServe. It supports up to 256 colors and is also popular on the
    Internet. GIF filenames have a .gif extension. |'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'Where do you find graphics files? Your digital photos are stored in JPEG format.
    Other file types can be downloaded from the Internet or collections purchased
    on CD-ROMs.


    Setting the Image property in design mode requires a few steps. Let’s do an example
    to illustrate the process. Start a new project and put a picture box control on
    the form. Mine looks like this:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_123_0.png)


    Graphics files used at design-time are saved as program Resources. Once these
    resources are established, they can be used to set the Image property. The process
    to follow is to display the Properties window for the picture box control and
    select the Image property. An ellipsis (...) will appear. Click the ellipsis.
    A Select Resource window will appear. Make sure the Local resource file radio
    button is selected and click the button marked Import - a file window will appear.
    Move (as shown) to the \KidGamesVCS\KidGamesVCS Projects\Sample Pictures folder
    and you will see some sample files listed:'
  merge: -1
  pgno: 123
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_124_0.png)


    We have included one of each file type. There is a bitmap picture of a beany (**beany.bmp**),
    a metafile of an answering machine (**answer.wmf**), a copy of the KID logo (**kidware.gif**)
    and a picture from my Mexico vacation (**mexico.jpg**). Notice there is no icon
    file (ico extension). By default, icon files are not displayed. To see the icon
    file (a CD-ROM), click the drop-down box next to **Files name** and choose **All
    Files**. All files (including the **ico** file and even non-graphics files will
    be displayed). Hence, if you need an icon file in a picture box, you must take
    an extra step to select it. Select the **beany.bmp** graphic file and click **Open.**


    You should now see the **Select Resource** window:'
  merge: -1
  pgno: 124
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_125_0.png)


    Click the **OK** button. It will be displayed in the picture box on our form:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_125_1.png)


    This process is repeated for each **Image** property.


    To set the **Image** property at run-time, you use the **FromFile** method associated
    with the **Image** object. As an example, to load the file `c:\sample\myfile.bmp`
    into a picture box name **pieExample**, the proper code is:'
  merge: -1
  pgno: 125
- img_proc: true
  md: '```

    picExample.Image = Image.FromFile("c:\sample\myfile.bmp");

    ```


    The argument in the Image.From method must be a legal, complete path and file
    name, or your program will stop with an error message.


    To clear an image from a picture box control at run-time, simply set the corresponding
    Image property to null (a C# keyword). This disassociates the Image property from
    the last loaded image. For our example, the code is:


    ```

    picExample.Image = null;

    ```


    The SizeMode dictates that a particular image will be displayed. There are five
    possible values for this property: Normal, CenterImage, StretchImage, AutoSize,
    Zoom. The effect of each value is:


    | SizeMode | Effect |

    ---|---|n| Normal | Image appears in original size. If picture box is larger than
    image, there will be blank space. If picture box is smaller than image, the image
    will be cropped. |

    | CenterImage | Image appears in original size, centered in picture box. If picture
    box is larger than image, there will be blank space. If picture box is smaller
    than image, image is cropped. |

    | StretchImage | Image will ''fill'' picture box. If image is smaller than picture
    box, it will expand. If image is larger than picture box, it will scale down.
    Bitmap files do not scale nicely. Metafiles, JPEG and GIF files do not scale nicely.
    |

    | AutoSize | Reverse of StretchImage - picture box will change its dimensions
    to match the size of the image. Be forewarned – metafiles are usually very large!
    |

    | Zoom | Similar to StretchImage. The image will adjust to fit within the picture
    box, however'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'its actual height to width ratio is maintained.


    Notice picture box dimensions remain fixed for Normal, CenterImage, StretchImage,
    and Zoom SizeMode values. With AutoSize, the picture box will grow in size. This
    may cause problems at run-time if your form is not large enough to `contain` the
    picture box.


    Typical use of PictureBox control for displaying images:


    +   - Set the Name and SizeMode property (most often, StretchImage).


    +   - Set Image property, either in design mode or at run-time, remembering icon
    files are not automatically displayed.'
  merge: -1
  pgno: 127
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 128
- img_proc: true
  md: '# ProgressBar Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_129_0.png)


    # On Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_129_1.png)


    The ProgressBar is a simple, but useful control used to give a visual display
    of progress during a task. It can be filled as a task continues or emptied.


    ProgressBar Properties:


    +   * **Name**: Gets or sets the name of the progress bar (three letter prefix
    for picture box name is bar).

    * **BackColor**: Get or sets the picture box background color. Height of progress
    bar in pixels.

    * **Left**: Distance from left edge of form to form left edge of progress bar,
    in pixels.

    * **Maximum**: Maximum Value of progress bar. Minimum Value of progress bar.

    * **RightToLeft**: Indicates if bar should draw from right to left. Amount Value
    changes with each step.

    * **Top**: Distance bottom of form title bar area to top edge of progress bar,
    in pixels.

    * **Value**: Current value of progress (between Minimum and Maximum).

    * **Width**: Width of progress bar in pixels.


    ProgressBar Methods:'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# PerformStep Increments Value by Step amount.


    Typical use of ProgressBar control:


    +   - Set the Name, Minimum, Maximum, Step properties. Initialize Value property
    (usually either at Minimum or Maximum).

    - Reset Value property as monitored task evolves.'
