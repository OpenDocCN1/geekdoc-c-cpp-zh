- img_proc: true
  md: 'The panel control on the left of the Pizza Delivery form holds the delivery
    grid. At the top right are group boxes with a single label control to display
    current time and current sales. The computer monitor (in a picture box) displays
    baked orders and status using a list box and label control. Another group box
    holds the pizza oven where pizzas are displayed using eight picture box controls.
    Two button controls in the group box control over oven operation. The group boxes
    below the oven show how many pizzas are ready for delivery and how many are in
    the car (a button control loads pizzas in the car). The two button controls at
    the bottom are used to start/pause the game and to stop the game or exit the program.
    Below the form in the ''tray'' area are several timers used to control various
    aspects of the program.


    Notice, we said the panel control holds the delivery grid. But, where is that
    grid? The grid consists of 400 label controls in 20 rows (marked by a number)
    of 20 columns (marked by a letter). You can imagine trying to place many controls
    on a form? In Pizza Delivery, we will learn how to place controls on a form (or
    panel control in this case) using code. This saves us lots of design time.


    Before running the game, let''s describe its operation. You sell and deliverpizzas
    from 6:00 to 11:00. A clock in the upper right corner shows the time. It doesn''t
    take 5 hours to use the program - the five hours go by in about 15 minutes, so
    fast. The phone rings when an order comes in. The order box in the monitor shows
    what time the order was called, the coordinates for delivery, and the number of
    pizzas ordered. The order is also displayed on the neighborhood grid.


    In the monitor message area, you are told the current location of the car in the
    grid. At the beginning of the program, the car is at the pizza parlor (marked
    by an X). Group boxes at the bottom tell you how many pizzas are baked and ready
    and how many are in the car. To load pizzas in the car, click the Load button.
    To tell the car where to go, click on the grid position. The car will travel to
    the desired position. The car''s horn will sound and tell you the result of the
    delivery. There are four possible results: (1) on-time delivery, (2) late delivery,
    (3) not enough pizzas in the car to make the delivery, or (4) no pizza ordered'
