  md: 'In the ''smart'' logic, we first find out whether the computer has X or O.
    Steps 1 and 2 of the computer logic are done in a loop with k as index. In that
    loop, we go through all the possible wins looking for a row with 2 identical marks
    and an empty box. For k=1, we look for the computer''s mark and an empty box –
    giving the computer a win on the next move. For k=2, we look for the human''s
    mark and an empty box – giving the computer a block on the next move. If neither
    Step 1 or Step 2 is successful, we move to Step 3. The next best moves are listed
    in desired order in the array bestMoves. In Step 3, we go through this array,
    finding the first empty box available and move there.


    Save and run the project. The game is now fully functional. Try playing against
    the computer. You should find it can''t be beat. The best you can do against the
    computer is a draw. Before leaving, let''s add a couple of sounds.'
