  md: "# # Code Design – Landing Detection\n\nIf you continue to run the game as programmed,\
    \ altitude will stop at zero, but the speed will continue to increase and you\
    \ can still apply thrust. We need somew to detect a landing and determine if it\
    \ is a safe landing. We will do this in the timLanding Tick event method. Add\
    \ a constant declaration defining the maximum acceptable landing speed:\n\n```\n\
    const double safeLandingSpeed = 3.0;\n```\n\nNow, add the shaded changes to the\
    \ timLanding Tick event:\n\n```\nprivate void timLanding_Tick(object sender, EventArgs\
    \ e)\n{\n    time += Convert.ToDouble(timLanding.Interval) / 1000;\n    lblTime.Text\
    \ = String.Format(\"{0:f1}\", time);\n    lblTime.Refresh();\n    landerX += landerXpeed\
    \ *\n    Convert.ToDouble(timLanding.Interval) / 1000;\n    landerY += landerYSpeed\
