    to implement the various aspects of the game: physics of motion, altitude and
    lateral distance calculations, line and shape graphics for the trajectory display
    and advanced graphics such as a scrolling background and sprite animations for
    the lander motion display. And, we’ll design a pretty good autopilot for demonstration
    and learning purposes.'
