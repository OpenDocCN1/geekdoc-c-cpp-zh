  md: '# SoundPlayer Object


    Sounds are part of every game. There is only one sound available with the C# language,
    a simple beep (the Beep function). This unexciting sound through the computer''s
    built-in speaker, if there is one. Games feature elaborate sounds that take advantage
    of stereo sound cards. By using the Visual SoundPlayer class (in the System.Media
    namespace).


    The SoundPlayer class is used to play one particular type of sound, those represented
    by wav files (files with wav extensions). Most sounds you hear played in Windows
    applications are saved as wav files. These are the files formed when you record
    using one of the many sound recorder programs available


    Prior to playing a sound, a SoundPlayer object (mySound) must be declared using
    the usual statement.


    ```

    System.Media.SoundPlayer mySound;

    ```


    The object is then constructed using:


    ```

    mySound = new System.Media.SoundPlayer(SoundFile);

    ```


    where SoundFile is a complete path to the wav file to be played. It is normal
    practice to include any sound files an application uses in the same directory
    as the application executable file (the Bin\Debug folder). This makes them easily
    accessible (use the Application.Startup parameter). To create the Bin\Debug folder,
    it is suggested you immediately save any newly started project.


    A sound is loaded into memory using the Load method of the SoundPlayer class:


    ```

    mySound.Load();

    ```'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'This is an optional step that should be done for sounds that will be played
    often – it allows them to be played quickly.


    There are two methods available to play a sound, the **Play** method and the **PlaySync**
    method:


    ```

    mySound.Play();

    ```


    ```

    mySound.PlaySync();

    ```


    With the **Play** method, a sound is played **asynchronously**. This means that
    execution of code continues as the sound is played. With **PlaySync**, the sound
    is played **synchronously**. In this case, the sound is played to completion,
    and then code execution continues. With either method, if the sound is not loaded
    into memory, it will be loaded first. This will slow down your program depending
    on how big the file is. This is why we preload sounds (using the **Load** method)
    that are played often.'
  merge: -1
