  md: '# Moon Landing Form Design


    We begin building the Moon Landing project. Start a new project in Visual C#.
    Once started, we suggest you immediately save the project with a name you choose.
    This sets up the folder and file structure needed for your project.


    We will build the form in two stages, first establishing the options group boxes,
    then overlaying those with the group box used for lander control. Place two panel
    controls on the left side of the form – one used for display, the other simply
    for a border. On the right side of the form, place two group box controls. In
    the first group box, put five radio buttons and a check box. In the second, put
    two radio buttons. At the bottom, put three button controls (two small buttons
    on top of one large). Add one timer control. My form looks like this:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_667_0.png)'
  merge: -1
  pgno: 667
- img_proc: true
  md: 'One panel control forms a frame around another that will display the moon landing
    animation. The first group box is used to select pilot level and whether to use
    auto-pilot. The second group box selects the units for display. The two smaller
    button controls (one to start and pause the game and one to stop and exit the
    project) are used to control operation of the game. The large button under these
    two buttons is used at the end of the game to allow viewing of landing results.
    The timer control is used for computing the lancer position speed and for updating
    the animation.


    If any of the controls used in this project are unfamiliar, review the appropriate
    material in Chapter 2 of these notes. Set the control properties using the properties
