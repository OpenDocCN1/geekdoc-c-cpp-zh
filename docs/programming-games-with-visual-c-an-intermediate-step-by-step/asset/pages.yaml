    You also need to control the pizza oven to make sure there are always pizzas available
    for delivery. To bake pizzas, click Add Pizza for each pizza you want to bake
    (pizzas can''t be taken out once they''re in). When the oven is loaded, click
    Bake Pizza. You will be told that the pizzas are ready. When the pizzas are done,
    a bell will ring and the pizzas are moved to the ready area. The Baked box always
    displays how many pizzas are available for loading into the car. At any time during
    the program, you may pause the action by clicking Pause Game. To restart the program,
    click Restart Game. To stop the program before 11:00, click Stop Game. Once the
    program stops, a summary screen will show your sales and costs results (if any).
    After reading the results, click Return to Pizza Delivery to play again.


    This may seem like lots of instructions but the process becomes fairly obvious
    as you play the game. Run the project (press F5). The game will appear in its
    ''stopped'' state and the delivery grid will appear. At this point, you simply
    click Start Game to get things going. There are no options to select. The randomness
    inherent in the Pizza Delivery game makes each new game a different experience.
