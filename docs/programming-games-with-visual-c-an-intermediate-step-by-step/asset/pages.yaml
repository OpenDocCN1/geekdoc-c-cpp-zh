    The arguments are:


    +   - sender: Control active when key pressed to invoke method

    - e: Event handler revealing which key was pressed and status of certain control
    keys when key was pressed


    We are interested in several properties of the event handler e:


    +   - e.Alt: bool property that indicates Alt key is pressed

    - e.Control: bool property that indicates if Ctrl key is pressed

    - e.KeyCode: Gives the key code for the key pressed

    - e.Shift: bool property that indicates if either Shift key is pressed


    The KeyCode property is a member of the Keys class. There are values for every
    key that can be pressed (see on-line help). The Intellense feature of the Visual
    C# IDE will provide KeyCode values when needed. The KeyDown event usually has
    a Select Case structure with a Case for each possible key (or key combination)
    expected.


    In the Leap Frog game, we choose the cursor control (arrow) keys for frog motion:


    +   - Keys.Up – Move frog up

    - Keys.Left – Move frog left

    - Keys.Down – Move frog down

    - Keys.Right – Move frog right'
