  md: '# Random Number Object


    In writing games and learning software, we use a random number generator to introduce
    unpredictability. This insurers different results each time you try a program.
    Visual C# has a few ways to generate random numbers. We will use one of them –
    a random generator of integers. The generator uses the Visual C# Random object.


    To use the Random object (named myRandom here), it is first declared and created
    using:


    ```

    Random myRandom = new Random();

    ```


    This statement is placed with the variable declaration statements.


    Once created, when you need a random integer value, use the Next method of this
    Random object:


    ```

    myRandom.Next(Limit)

    ```


    This statement generates a random integer value that is greater than or equal
    to 0 and less than Limit. Note it is less than limit, not equal to. For example,
    the method:


    ```

    myRandom.Next(5)

    ```


    will generate random integers from 0 to 4. The possible values will be 0, 1, 2,
    3 and 4.


    As other examples, to roll a six-sided die, the number of spots would be computed
    using:


    ```

    numberSpots = myRandom.Next(6) + 1;

    ```


    To randomly choose a number between 100 and 200, use:'
  merge: -1
