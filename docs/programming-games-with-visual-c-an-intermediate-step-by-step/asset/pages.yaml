  md: '# DrawEllipse Method


    The DrawEllipse method will draw an ellipse in a rectangle structure within a
    graphic object. To draw an ellipse, you first create the graphics object. Then
    you create the rectangle structure using the constructor. Assuming you have created
    a graphics object named myGraphics and a rectangle structure named myRectangle,
    the syntax to draw an ellipse with pen object myPen is:


    ```

    myGraphics.DrawEllipse(myPen, myRectangle);

    ```


    Using a black pen with a line width of 1 (Pens.Black), the code to draw an ellipse
    that takes up 80 percent of the width and height of a form-hosted graphics object
    is:


    ```

    myRectangle = new Rectangle(0.1 * this.Width, 0.1 * this.Height,

    0.8 * this.Width, 0.8 * this.Height);

    myGraphics.DrawEllipse(Pens.Black, myRectangle);

    ```


    This code produces this ellipse:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_766_0.png)


    To draw a circle, the width and height of the rectangle should be the same.'
