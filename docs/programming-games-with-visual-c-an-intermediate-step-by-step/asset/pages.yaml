  md: '# Method Stepping (Step Over)


    Did you notice in the example just studied that, after a while, it became annoying
    to have to single through the function evaluation at every step of the do loop?
    While stepping through your program, if you come to a method call that you know
    operates properly, you can perform method stepping. This simply executes the entire
    method at once, treating as a single line of code, rather than one step at a time.


    To move through a method in this manner, while in break mode, press <F10>, choose
    Step Over from the Debug menu, or press the Step Over button on the toolbar:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_248_0.png)


    # Step Over Example:


    Run the previous example. Single step through it a couple of times.


    One time through, when you are at the line calling the FtoC method, press the
    Step Over button. Notice how the program did not single step through the method
    as it did previously.'
