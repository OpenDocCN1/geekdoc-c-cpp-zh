  md: '# Math Functions


    A last set of functions we need mathematical functions (yes, programming involves
    math!) Visual C# provides a set of functions that perform tasks such as square
    roots, trigonometric relationships, and exponential functions.


    Each of the Visual C# math functions comes from the Math class of the Express
    framework (an object-oriented programming concept). All this means that each function
    name must be preceded by Math. (say Math-dot) to work properly. The functions
    and the returned values are:


    | Math Function | Value Returned |

    |---|---||

    | Math.Abs | Returns the absolute value of a specified number |

    | Math.Acos | Returns a double value containing the angle cosine is the specified
    number |

    | Math.Asin | Returns a double value containing the angle sine is the specified
    number |

    | Math.Atan | Returns a double value containing the angle whose tangent is the
    specified number |

    | Math.Cos | Returns a double value containing the cosine of the specified angle
    |

    | Math.Max | Returns the larger of two numbers |

    | Math.Min | Returns the smaller of two numbers |

    | Math.PI | A constant that specifies the ratio of the circumference of a circle
    to its diameter |

    | Math.Pow | Used to raise a number to a specified power – an exponentiation operator
    |

    | Math.Round | Returns the number nearest the specified number of decimal points
    |

    | Math.Sign | Returns an Integer value indicating the sign of a number |

    | Math.Sin | Returns a Double value containing the sine of the specified angle
    |'
