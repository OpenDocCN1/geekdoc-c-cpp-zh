    logic. To control motion of the frog, we will use the cursor control arrows of
    the keyboard. Let''s look at how to detect such keystrokes using the Visual C#
    **KeyDown** method.


    We need the capability to move our frog up and down from one graphics panel to
    another and left and right across panels. We choose to use the keyboard for control,
    using the **KeyDown** event. This event allows detecting typed keys, along with
    the status of keys like the Alt, Ctrl, Shift, cursor control and other control
    keys. The form of the **KeyDown** event method for a form **(Form)** is:


    ```

    private void Form_KeyDown(object sender, EventArgs e)

    ```'
