  md: '# # Single Stepping (Step Into) An Application


    A powerful feature of the Visual C# debugger is the ability to manually control
    execution of the code in your application. The Step Into option lets you execute
    your program one line at a time. It lets you watch how variables change (in the
    locals window) or how your form changes, one step at a time. Single stepping is
    especially useful to check that decision structures and loops you use in your
    code are executing correctly.


    Once in break mode (at a breakpoint), you can use Step Into by pressing <F11>,
    choosing the Step Into option in the Debug menu, or by clicking the Step Into
    button on the toolbar:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_245_0.png)


    Each time you click this button, the single highlighted line of code will be executed.


    # Step Into Example:


