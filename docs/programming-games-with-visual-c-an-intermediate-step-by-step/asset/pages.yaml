  md: '# # Introduction to Object-Oriented Programming (OOP)


    Each moving item in the Leap Frog game will be represented by a sprite. In the
    previous chapter, we saw sprites were moving images (contained in a rectangle
    structure). Each moving sprite requires four pieces of information:


    +   - Image (Image type)

    - Rectangle (Rectangle type)

    - Speed (int type)

    - IsVisible (bool type)


    where Image is the image shown by the sprite, Rectangle is the sizing and location
    information, Speed is the speed it is moving at and IsVisible tells us if the
    sprite is active (when off the edge of the screen) IsVisible will be False. One
    way to store all this information is to use four different arrays, for each quantity,
    each element of the array representing a single sprite. Using arrays would be
    “doable,” but messy. What if we later want to add more information to a sprite?
    We would need to remember everywhere these arrays were referenced in code to make
    the needed changes. There must be a better way to structure all this information.


    We say Visual C# is an object-oriented language. At this point in course, we have
    used many of the built-in objects included with Visual C#. We have used button
    objects, text box objects, label objects and many other controls. We have used
    graphics objects, font objects, and pen objects. Having used these objects, we
    are familiar with such concepts as declaring an object, constructing an object
    and using an object’s properties and methods.


    We have seen that objects are just things that have attributes (properties) with
    actions (methods). We’ll use the idea here here to create our own “sprite”'
  merge: -1
  pgno: 845
- img_proc: true
  md: 'objects. You will see how creating such objects saves lots of work.


    Before getting started, you may be asking the question “If Visual C# is an object-oriented
    language, why have we waited so long to start talking about using our own objects?”
    And, that’s a good question. Many books on Visual C# dive right into building
    objects. We feel it''s best to see objects and use objects before trying to create
    your own. Visual C# is a great language for doing this. The wealth of existing,
    built-in objects helps you learn about OOP before needing to build your own.


    Now, let''s review some of the vocabulary of object-oriented programming. These
    are terms you''ve seen before in general working with the built-in objects of
    Visual C#. A class provides a general description of an object. All objects are
    created from this class description. The first step in creating an object is adding
    a class to a Visual C# project. Every application we have built in this course
    is a class itself. Note the top line of every application has the keyword Class.


    The class provides a framework for describing three primary components:


    +   - Properties – attributes describing the objects

    - Constructors – methods that initialize the object

    - Methods – methods describing things an object can do


    Once a class is defined, an object can be created or instantiated from the class.
    This simply means we use the class description to create a copy of the object
    we can work with. Once the instance is created, we construct the finished object
    for our use.'
  merge: -1
