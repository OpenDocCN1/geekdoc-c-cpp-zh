  md: '# Use of Form Name Property


    When setting run-time properties or accessing events for the **Form** object,
    the **Name** property is not used in the same manner as it is for other controls.
    To set properties, rather than use the name property, the keyword **this** is
    used. Hence, to set a form property at run-time, use:


    ```

    this.PropertyName = value;

    ```


    We also need to distinguish between the form **Name** property and the **File
    Name** used within Visual C# to save the form file (which includes control descriptions
    and all code associated with a particular form). The Name property and File Name
    are two different entities. We have seen how the Form Name property is used. A
    look at the Solution Explorer window for a sample application shows how the Form
    Name is used:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_65_0.png)


    The name preceding the **cs** extension (**Form1**) is the form file name. Again,
    this is **not** the same as the name assigned in the Form Properties window.


    To change the form file name, click the file in the Solution Explorer window to
    see the **File Properties** window (this is **not** the same as the Form Properties
    window):'
  merge: -1
  pgno: 65
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_66_0.png)


    In this window, you change the File Name by simply typing another name (with the
    cs extension). Visual C# will then automatically save the form file with this
    new name. This name is then used to refer to the form file. This is the name you
    would use if you want to load a particular form into a Visual C# solution or project.'
  merge: -1
