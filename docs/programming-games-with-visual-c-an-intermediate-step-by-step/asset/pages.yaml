  md: '# DrawImage Method – Scrolling Background


    Most action games employ scrolling or moving backgrounds. In our program, we will
    use the viewer panel (pnlViewer) to display the lander as it moves across the
    landscape toward the landing pad. We will center the lander graphic in the panel
    (if possible). Then, to give the appearance of motion, we will move or scroll
    the landscape behind the lander. What looks like a very sophisticated effect is
    really just a simple application of the DrawImage graphics method. This method
    allows us to take a region of an image and “draw” it into a display area.


    The DrawImage graphics method for establishing a background is simple. Assume
    you an Image object (myImage). Within this object is a rectangular region (rectSource)
    which you wish to copy to a rectangular region (rectDestination) in a graphic
    object myGraphics. The syntax for such an operation is:


    ```

    myGraphics.DrawImage(myImage, rectDestination, rectSource, GraphicsUnit.Pixel);

    ```


    rectDestination and rectSource are usually the same width and height. If they
    differ, the image will be scaled up or down to fit within rectDestination.


    For scrolling backgrounds, the ‘destination’ rectangle (rectDestination) encompasses
    the entire panel control (myPanel) hosting the graphics object used as the viewing
    area:


    ```

    rectDestination = new Rectangle(0, 0, myPanel.Width, myPanel.Height);

    ```


    The ‘source’ rectangle (rectSource) contains the portion of the image we want
    to copy into the graphics object. This rectangle has the same'
  merge: -1
  pgno: 773
- img_proc: true
  md: 'dimensions (width and height) as the destination rectangle, with the uppernleft
    corner described by a desired position (x, y) within the source image:


    ```

    rectSource = new Rectangle(X, Y, myPanel.Width, myPanel.Height);

    ```'
