    The tutorial includes several detailed computer projects for students to build
    and try. These projects include a number guessing game, card game, allowance calculator,
    drawing program, state capitals game, and a couple of video games like Pong. We
    also include several college prep bonus projects including a loan calculator,
    portfolio manager, and checkbook balancer. Designed for students age 15 and up.


