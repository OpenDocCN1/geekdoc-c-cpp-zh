  md: '# Form Design – Photo Selection


    One neat thing about this game is that you can use your own photos! This personalizes
    the game that makes things a lot more fun. You need to select 10 photos (jpg files
    from your digital camera) that you want to use - make sure these photos are stored
    somewhere on your computer. Let''s see how to add these to the game. If you don''t
    have photos to use, we include ten sample photos in the KidGamesVCS\KidGamesVCS
    Projects\Match Game folder:


    +   - clara.jpg: one of the KIDWare dogs

