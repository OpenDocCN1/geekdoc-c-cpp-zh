  md: '# Graphics Methods


    Visual C# offers a wealth of graphics methods that let us draw lines, rectangles,
    ellipses, pie shapes and polygons. With these methods, you can draw anything!
    These methods are provided by the GDI+ (graphical device interface), an improved
    version of previous interfaces.


    Graphics methods are applied to Graphics objects. Using graphics objects is a
    little detailed, but worth the time to learn. There is a new vocabulary with many
    new objects to study. We’ll cover every step. The basic approach to drawing with
    graphics objects will always be:


    +   > Create a Graphics object

    > Create Pen objects

    > Draw to Graphics object using drawing methods


    In the next few sections, we will learn about Graphics objects, Pen objects, and
    the use of colors. We’ll learn how to draw lines and ellipses. This will give
    us the skills needed to construct the trajectory panel. Let’s get started.'
  merge: -1
