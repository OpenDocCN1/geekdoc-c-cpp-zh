  md: "# Code Design – Playing to Stopped State\n\nWhen the user clicks the Stop Game\
    \ button in the two player 'playing' state, several things must happen to switch\
    \ the Tic Tac Toe game to 'stopped' state:\n\n+   - Change the Text property of\
    \ btnStartStop to Start Game.\n- Display Game Stopped message.\n- Enable grpPlayers.\n\
    - Enable grpFirst and grpComputer if one player game.\n- Enable btnExit.\n- Set\
    \ canClick to false.\n\nWe use logic similar to what we did for the Safecacker\
    \ game – modifying the code for btnStartStop. The code that does these steps (modifications\
    \ to the current btnStartStop Click event code are shaded):\n\n```\nprivate void\
    \ btnStartStop_Click(object sender, EventArgs e)\n{\n    if (btnStartStop.Text\
    \ = \"Start Game\")\n    {\n        btnStartStop.Text = \"Stop Game\";\n     \
    \   grpPlayers.Enabled = false;\n        grpFirst.Enabled = false;\n        grpComputer.Enabled\
    \ = false;\n        btnExit.Enabled = false;\n        xTurn = true;\n        lblMessage.Text\
    \ = \"X's Turn\";\n        // reset boxes\n    }\n```"
