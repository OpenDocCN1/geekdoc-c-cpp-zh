    **VISUAL BASIC AND DATABASES** is a tutorial that provides a detailed introduction
    to using Visual Basic for accessing and maintaining databases for desktop applications.
    Topics covered include: database structure, database design, Visual Basic project
    building, ADO .NET data objects (connection, data adapter, command, data table),
    data bound controls, proper interface design, structured query language (SQL),
    creating databases using Access, SQL Server and ADOX, and database reports. Actual
    projects developed include a book tracking system, a sales invoicing program,
    a home inventory system and a daily weather monitor.'
