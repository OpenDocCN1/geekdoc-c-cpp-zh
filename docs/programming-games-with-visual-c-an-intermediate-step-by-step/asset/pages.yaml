  md: '# DrawImage Method


    To draw a sprite in a graphics object, we use the drawImage graphics method. In
    Chapter 9 (Moon Landing Project), we looked at various versions of the DrawImage
    method to do animations. Here, we use DrawImage in its simplest form – copy an
    image (myImage) to a rectangular location (myRectangle) in a graphics object (myGraphics):


    myGraphics.DrawImage(myImage, myRectangle);


    A picture illustrates what’s going on with DrawImage:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_853_0.png)


    Successive image transfers give the impression of motion, or animation. Recall
    W and H in the graphics object do not have to necessarily match the width and
    height of the Image object. Scaling (up or down) is possible.


    You may notice this form of DrawImage is similar to the one used in the Moon Landing
    project to move the lander (identifying a transparent color using ImageAttributes).
    You may wonder why we don’t use this version here, insuring the background shows
    through our graphics images. The reason is that the graphics files we use here
    (gif files) have transparent'
