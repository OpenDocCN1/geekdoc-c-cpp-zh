  md: '# Visual C# Integrated Development Environment (IDE)


    The Visual C# IDE is where we build and test our application via implementation
    of the three steps of application development (draw controls, assign properties,
    write code). As you progress through this course, you will learn how easy-to-use
    and helpful the IDE is. There are many features in the IDE and many ways to use
    these features. Here, we will introduce the IDE and some of its features. You
    must realize, however, that its true utility will become apparent as you use it
    to build your own applications.


    Several windows appear when you start Visual C#. Each window can be viewed (visible
    or active) by selecting menu options, depressing function keys or using the displayed
    toolbar. As you use the IDE, you will find the method you feel most comfortable
    with. Also, windows can ''float'' or be ''docked''. Right-clicking a window can
    change this option. We''ll leave it to you to configure the development environment
    to your liking.


    The title bar area shows the name of your project:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_41_0.png)


    When your project is running, the title bar will also show the mode Visual C#
    is operating in. Visual C# operates in three modes.


    +   - Design mode - used to build application

    - Run mode - used to run the application

    - Debug (or Break) mode - application halted and debugger is available


    We focus here on the design mode. You should, however, always be aware of what
    mode you are working in.'
  merge: -1
