  md: '# Requirements for Programming Games With Visual C#


    Before starting, let''s examine what you need to successfully build the projects
    included with Programming Games With Visual C#. As far as computer skills, you
    should be comfortable working within the Windows environment. You should know
    how to run programs, find and create folders, move and resize windows. As far
    as programming skills, we assume you have some exposure to computer programming
    using some language. If that language is Visual C#, great!! We offer two tutorials
    Visual C# for Kids and Beginning Visual C#, that could help you gain that exposure
    (see our website for details). But, if you''ve ever programmed in any language
    (Visual Basic, C, C++, Java, J#, Ada, even FORTRAN), you should be able to follow
    what''s going on. Even if you are a veteran programmer, we suggest you go through
    the first four chapters before attacking the projects. This review will give you
    some idea of the terminology we use in referring to different parts of a Visual
    C# project.


    Regarding software requirements, to use Visual C#, you (and your potential users)
    must be using a minimum of Windows SP1. And, of course, you need a minimum of
    Visual Studio 2015 Community Edition product installed on your computer. It is
    a free download from Microsoft. Follow this link for complete instructions for
    downloading and installing it on your computer:


    https://www.visualstudio.com/products/free-developer-offers-vs'
