  md: '# # Viewing Variables in the Watch Window


    **Watch** windows can also be used to examine variables. They can maintain values
    for both method level and form level variables. And, you can even change the values
    of variables in the watch window (be careful if you do this; strange things can
    happen). The watch window can only be accessed in **break** mode. At that time,
    you simply right-click on any variables you want to add to the watch window and
    select the **Add Watch** option. To view a watch window, select the **Debug**
    menu option, choose **Windows**, then **Watch**, then one of available watch windows.


    **Watch Window Example:**


    Make sure there is still a breakpoint on the **tempF += 10** line in the **btnShow
    Click** event. Run the program and click the **Show Temperatures** button. The
    program will stop at the desired line. Open a watch window. Right-click on the
    **tempF** variable and select **Add Watch**. Scroll down into the **FToC** function
    and do the same for the **numberCalls** variable. You should now see:


    | Name | Value |

    |---|---|

    | tempF | -60 |

    | numberCalls | 1 |


    The current value of **tempF** (a method level variable) and **numberCalls** (a
    form level variable) are seen. Continue running the application (click **Continue**
    button or press <F5>), watching **tempF** and **numberCalls** change with each
    loop execution.


    The two watch variables can be deleted by right-clicking the variable name in
    the watch window and selecting **Delete Watch**. Again, you can only do this in
    **break** mode.'
