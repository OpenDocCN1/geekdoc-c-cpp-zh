  md: '# Code Design - Autopilot


    The auto-pilot option allows you to see how the computer controls the lander as
    it descends to the moon. With auto-pilot, the computer controls the horizontal
    and vertical thrusters in attempt to make a safe landing. The goal is to be under
    a safe vertical landing speed (3 meters/second), while being near the landing
    pad. We will develop the vertical and horizontal thruster auto-pilots separately.


    Like the game playing logic in Tic Tac Toe and Match Game, there are no rigid
    rules for developing an auto-pilot. Like those games, I tried to develop rules
    for how I (a human) might control the lander and put those into code. Feel free
    to change any of the auto-pilot code as you see fit.


    Here are the rules I use to automatically the vertical (down) thruster control:


    +   * If altitude is above 300 meters, apply down thrust to keep landerYSpeed
    under 12 meters/second.

    * If altitude is between 100 and 300 meters, apply down thrust to keep landerYSpeed
    under 6 meters/second.

    * If altitude is under 100 meters, apply down thrust to keep landerYSpeed under
    2 + 0.04 * altitude.


    What I am attempting to do is make sure the lander never accelerates to extremely
    high speeds, as it nears the surface, ramp down the speed to have it 2 meters/second
    upon landing (altitude = 0).


    The code for the vertical auto-pilot is placed in the timLanding Tick event. The
    additions are noted by the shaded code:


    ```

    private void timLanding_Tick(object sender, EventArgs e)

    {

    ```'
