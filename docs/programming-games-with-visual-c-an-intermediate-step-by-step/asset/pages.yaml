  md: '# Leap Frog Form Design


    We begin building the Leap Frog project. Start a new project in Visual C#. Once
    started, we suggest you immediately save the project with a name you choose. This
    sets up the folder and file structure needed for your project.


    Place four label controls at the top of the form (set AutoSize to False and BorderStyle
    temporarily to FixedSingle to see where they are located). Then, place five panel
    controls under these labels. These panels will host the graphics of the game.
    Each panel will be “16 frogs wide” or 640 pixels, since the frog is 40 pixels
    wide. The first panel under the labels will host the frog homes. Make it 80 pixels
    high. The next panel will have the river – make it 120 pixels high (enough to
    hold three logs, which are 40 pixels high). The next panel down has the snake
    – make it 40 pixels high, so it will hold a frog. Under the snake panel is the
    vehicle panel. We want it to hold three lanes of vehicles. Each vehicle is 40
    pixels high, but we make the panel 140 pixels high (rather than 120 pixels) to
    allow room for lane markings. The fifth panel is where the frog starts its journey.
    Make it 40 pixels high. Add a final panel control at the bottom of the form with
    three button controls. Then, as a last step, add four timer controls. Size the
    form so the panel controls just fit within the width of the form.


    My form looks like this:'
