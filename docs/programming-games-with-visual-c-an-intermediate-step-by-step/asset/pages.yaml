  md: "# Switch - Another Way to Branch\n\nIn addition to if/then/else type statements,\
    \ the **switch** structure can be used when there are multiple selection possibilities.\
    \ switch is used to make decisions based on the value of a single variable. The\
    \ structure is:\n\n```\nswitch (variable)\n{\ncase [variable has this value]:\n\
    \    [process code]\n    break;\ncase [variable has this value]:\n    [process\
    \ code]\n    break;\ncase [variable has this value]:\n    [process code]\n   \
    \ break;\ndefault:\n    [process code]\n    break;\n}\n```\n\nThe way this works\
    \ is that the value of **variable** is examined. Each **case** statement is then\
    \ sequentially examined until the value matches one of the specified cases. Once\
    \ found, the corresponding code is executed. If no case match is found, the code\
    \ in the default segment (if there) is executed. The **break** statements transfer\
    \ program execution to the line following the closing right brace. These statements\
    \ are optional, but will almost always be there. If a break is not executed, all\
    \ code following the case processed will also be processed (until a break is seen\
    \ or the end of the structure is reached). This is different behavior than **if**\
    \ statements where only one 'case' could be executed."
  merge: -1
