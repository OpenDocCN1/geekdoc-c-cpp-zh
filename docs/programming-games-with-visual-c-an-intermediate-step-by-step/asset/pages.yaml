- img_proc: true
  md: "# Debugging Visual C# Projects\n\nWe now consider the search for, and elimination\
    \ of, logic errors. These errors that don't prevent an application from running,\
    \ but cause incorrect or unexpected results. Logic errors are sometimes difficult\
    \ to find; they may be very subtle. Visual C# provides an excellent set of debugging\
    \ tools to aid in this search.\n\nA typical logic error could involve an If/End\
    \ If structure. Look at this example:\n\n```\nif (a > 5 && b < 4)\n{\n  'do this\
    \ code\n}\nelelse if (a == 6)\n{\n  'do this code\n}\n```\n\nIn this example,\
    \ if a = 6 and b = 2, the else if statement (which you wanted executed if a =\
    \ 6) will never be seen. In this case, swap the two if clauses to get the desired\
    \ behavior. Or, another possible source of a logic error:\n\n```\nStreamReader\
    \ inputFile = new StreamReader(dlgOpen.FileName);\ninputFile.ReadLine(myLine);\n\
    ```\n\nIn this little 'snippet', the file selected using an open dialog control\
    \ (dlgOpen) is opened and the first variable read. It looks okay, but what if\
    \ the user selected a file that really wasn't meant to be used by your application.\
    \ This would be a classic case of GIGO (garbage in – garbage out)."
  merge: -1
  pgno: 217
- img_proc: true
  md: 'Debugging code is an art, not a science. There are no prescribed processes
    that you can follow to eliminate all logic errors in your program. The usual approach
    is to eliminate them as they are discovered.


    What we will do here is present the debugging tools available in the Visual C#
    environment and describe their use with an example. You, as the program designer,
    should select the debugging approach and tools you feel most comfortable with.
    The more you use the debugger, the more you will learn about it. Fortunately,
    the simpler tools will accomplish the tasks for most debugging applications.


    The interface between your application and the debugging tools is via several
    different windows in the Visual Basic IDE: the Output window, the Locals window,
    and the Watch window. These windows are accessed using the View and or Debug menu
    options. Debugging tasks can be accessed using this menu or can be selected from
    the ‘debug’ region of the IDE toolbar.


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_218_0.png)


    We will examine buttons on this toolbar as we continue (you should) already recognize
    the buttons to Restart, Break and Stop the application.


    All debugging using the debug windows is done when your application is in debug
    (or break) mode. Recall the application mode (while running) is always displayed
    in the title bar of Visual C#. You usually enter break mode by setting breakpoints
    (we''ll look at this in a bit), pressing the Break button on the toolbar or when
    your program encounters an untrapped run-time error, one of the options provided
    is to go into break mode (click the button marked Debug).'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'Once in break mode, the debug windows and other tools can be used to:


    +   > Determine values of variables

    > Set breakpoints

    > Set watch variables and expressions

    > Manually control the application

    > Determine which methods have been called

    > Change the values of variables and properties


    The best way to learn proper debugging is do an example. We’ll open that example
    now, then learn how to use the Visual C# debugger.'
