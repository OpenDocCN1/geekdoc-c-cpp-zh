  md: '# Foreword by Alan Payne, A Computer Science Teacher


    # What is “Programming Games with Visual C#” and how it works?


    These lessons are a highly organized and well-indexed set of lessons in the Visual
    C# programming environment. Visual C# is a programming environment which allows
    the user to drag and drop buttons, text boxes, scroll bars, timers and dozens
    of other visual “controls” to make programs which look like “Windows” programs.
    They provide a graphical interface to the user.


    The tutorials provide the benefit of completed real-world applications – fully
    documented projects from the teacher’s point of view. That is, while full full
    solutions are provided for the teacher’s (and learner’s) benefit, the projects
    are presented in an easy-to-follow set of lessons explaining the rational for
    the form layout, coding design and conventions, and specific code related to the
    problem.


    The learner may follow the tutorials at their own pace while focusing upon context
    relevant information. The finished product is the reward, but the student is fully
    engaged and enriched by the process. This kind of learning is often the focus
    of teacher training. Every Computer Science teacher knows what a great deal of
    work is required for projects to work in this manner, and with these tutorials,
    the work is done by an author who understands the classroom experience. That is
    extremely rare!


    Game projects are presented in an easy-to-follow set of lessons explaining concepts
    fundamental to all languages – data types, input and output, decision making,
    looping, built-in functions, the different types of errors (syntax versus logical),
    logical expressions, comparison operators, random strings, string functions, arrays,
    and subroutines. Emphasis is placed on Visual C# controls – naming conventions,
    coding practices, intellisense features and debugging techniques. While game programming
    holds a higher degree of interest for the young programmer, an experienced'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'teacher would recognize all of the above as a substantive list of topics in
    any first secondary or post-secondary course in Computer Science.


    # Graduated Lessons for Every Project ... Lessons, examples, problems and projects.
    Graduated learning. Increasing and appropriate difficulty... Great results.


    With these projects, there are lessons providing a rich background on the programming
    topics to be covered. Once understood, concepts are easily applicable to a variety
    of applications. Then, specific games are drawn out so that a learner can practice
    with the Visual C# commands. A summative game program for the chapter is presented.
    Game design is broken down into manageable parts – the logical solution to the
    problem, the design of the user-interface and supporting methods (code modules)
    come together in the finished product.


    By presenting lessons in this graduated manner, students are fully engaged and
    appropriately challenged to become independent thinkers who can come up with their
    own project ideas, design their own graphical user interfaces, and do their own
    coding. Once the process is learned, then student engagement is unlimited! I have
    seen student literacy improve dramatically as they cannot get enough of what is
    being presented.


    Indeed, lessons encourage accelerated learning – in the sense that they provide
    an enriched environment to learn computer science, but they also encourage accelerating
    learning because students cannot put the lessons away they start! Computer Science
    provides this unique opportunity to challenge students, and it is a great testament
    to the authors that they are successful in achieving such levels of engagement
    with consistency.


    # My history with the Kidware Software products.


    I have used single license or shareware versions for over a decade to keep up
    my own learning. By using these lessons, I am able to spend time on things which
    will pay off in the classroom. I do not waste valuable time ensconced in language
    reference libraries for programming environments'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'and help screens which can never be fully remembered! These game-design projects
    are examples of how student projects should be as final products – thus, the pathway
    to learning is clear and immediate.


    By following these lessons, I was able to come up with my own projects – An Equation
    Solver which allows a student to solve any equation that they are likely to encounter
    in high school, a dice game of Craps, a Financial Calculator covering all grade
    12 Financial Mathematics, and finally, the game of Mastermind – where I presently
    have a “Mastermind Hall of Fame” for the best solutions by students over the years.
    I have made several applications for hardware interfacing in Computer Technology
    class. I could do all of this only because of these lessons by Kidware Software!


    The exciting thing is that all of the above could also be done in BASIC or Visual
    Studio languages – such as QBasic, Small Basic, Visual Basic or Visual C++, though
    I learned to do the programming using Kidware Software’s “Learn Visual Basic”.
    For me to go from one language to another is not an inevitable outcome! With these
    lessons, I am able to concentrate on the higher order thinking skills presented
    by the problem, and not be chained to a language reference in order to get things
    done!


    If I want to have students use or expand upon projects, I take advantage of site-license
    options. I have found it very straight forward to emphasize the fundamental computer
    science topics that form the basis of these projects when using them in the classroom.


    # Quick learning curve for teachers! How teachers can use the product:


    Having projects completed ahead of time can allow the teacher to present the design
    aspect of the project FIRST, and then have students all of their learning in the
    context of what is required in the finished product. This is a much faster learning
    curve than if students designed all of their projects from scratch. Lessons concentrating
    on a unified outcome for all make for much more streamlined engagement for first-time
    students of computer programming, as they complete more projects within a short
    period of time and there is a context for everything that is learned.'
  merge: -1
