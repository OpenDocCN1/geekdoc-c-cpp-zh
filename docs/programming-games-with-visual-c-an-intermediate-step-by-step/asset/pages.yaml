  md: '# # Tic Tac Toe Game Project

    Enhancements


    There are several ways to improve the Tic Tac Toe game. Some possibilities are:


    +   - Use picture boxes instead of label controls in the grid. With such a change,
    you could use something other than X’s and O’s to mark the squares. Try using
    small digital photos (jpeg files).


    +   - Add better messaging with a computer opponent. As implemented, the computer
    quickly makes its move. Perhaps, add a delay (see the Timer control) and perhaps
    some color changes in the grid so the computer tells you where its move will be.


    +   - In the current computer logic (Step 3), the computer always picks corners
    or sides in the same order. To make things bit unpredictable, add logic so the
    computer makes corner or side moves randomly based on the number of corner or
    side boxes that are empty.


    +   - The computer in this game is pretty smart, and can be made smarter. Between
    Steps 2 and 3 in the current computer logic, we could add another step where the
    computer would be more aggressive. In this new step, the computer search for horizontal,
    vertical or diagonal rows with one of its markers and two empty squares. By choosing
    one of the empty squares, the computer forces your next move. Even better is to
    find a place with an additional mark, the computer sets up two wins, making it
    impossible for you to block him.


    +   - For little kids, maybe the computer is a bit too smart. The random computer
    is an option, but goes to the other extreme of maybe not being smart enough. A
    change would be to add levels of intelligence – having the computer use its ‘smart’
    logic sometimes and its ‘random’ logic times. To do this, you could generate a
    random number from 1 to 100 and based on some threshold, determine whether to
    make a smart move or random move. By varying the'
  merge: -1
  pgno: 405
- img_proc: true
  md: threshold, you can make the computer extremely smart or not so smart. We implement
    such logic in the next game project, Match Game.
  merge: -1
