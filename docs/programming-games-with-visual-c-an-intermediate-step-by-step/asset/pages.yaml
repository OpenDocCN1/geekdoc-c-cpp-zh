  md: '# Code Design – Smart Computer Moves


    We''ve come to one of the more fun and more challenging parts of this game project.
    How can we make our computer a smarter opponent? In any game where a computer
    is playing against a human, we must be able to write down some rules that give
    the computer the appearance of intelligence. Many computer opponents are unbeatable.
    For example, it is very hard for a human to beat a computer at the game of chess.


    So how do we make our computer a better Tic Tac Toe player? We try to embed choices
    we would make if we were playing the game. So for the computer to be a smart player,
    the programmer needs to be a smart player. This usually takes practice and study.
    For the game of Tic Tac Toe, we can develop a fairly simple, yet very intelligent
    strategy. Let''s do it.


    When it is the computer''s turn, what should its move be? The rules we use are
    (in order of choice):


    +   1. If the computer can win with a move, make that move and the game is over.
    So, if there''s a row with two of the computer''s markers and an empty space,
    the empty space is the place to mark!

    2. If the computer can block with a move, make that move and the opponent can''t
    win on the next move. So, if there''s a row with two of the human player''s markers
    and an empty space, the empty space is the place to mark!

    3. If there is no possible win or possible block, make a move in this order: center
    square, one of the four corner squares, or one of the four side squares.


    I think you see this logic makes sense. You may wonder about Step 3 – why we choose
    that particular order. Recall there are 8 possible ways to win in Tic Tac Toe
    (3 horizontal, 3 vertical, 2 diagonal). The center square is needed in 4 of these,
    any one corner is involved in 3 possibilities, while'
  merge: -1
  pgno: 388
- img_proc: true
  md: "any side involved in just 2 wins. Hence, the order of choices is made on basic\
    \ probabilities. Let’s implement this logic in code.\n\nHere is the modified ComputerTurn\
    \ method that implements this ‘smart’ logic. The changes are shared:\n\n```\n\
    private void ComputerTurn()\n{\n    int selectedBox;\n    int i, n;\n    int j,\
    \ k;\n    String computerMark, playerMark, markToFind;\n    int[] boxNumber =\
    \ new int[3];\n    String[][] mark = new String[3];\n    int emptyBox;\n    int[]\
    \ bestMoves = { 4, 0, 2, 6, 8, 1, 3, 5, 7 };\nif (rdoRandom.Checked)\n{\n    //\
    \ random logic\n    // put mark in Nth available square\n    n = myRandom.Next(9\
    \ - numberClicks) + 1;\n    i = 0;\n    for (selectedBox = 0; selectedBox < 9;\
