    You should see all the integers from 0 to 19. Now, subtracting 10 from each value
    greater than 9 yields:


    | 4 | 1 | 5 | 1 |

    | 7 | 2 | 0 | 0 |

    | 5 | 8 | 7 | 8 |

    | 6 | 2 | 9 | 3 |

