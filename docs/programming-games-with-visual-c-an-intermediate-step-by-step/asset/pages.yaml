  md: '# Code Design – Road Panel


    In Leap Frog, the vehicles will move in the road panel (pnlRoad) and motion will
    be governed by the road timer (timRoad). There are three different vehicles (car,
    truck, semi) with the capability of moving left or right. The graphics used for
    each vehicle/direction are found in the KidGamesVCS\KidGamesVCS Projects\Leap
    Frog folder:


