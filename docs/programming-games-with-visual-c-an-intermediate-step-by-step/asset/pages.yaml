  md: '# Code Design – River Panel


    The logs move in the river panel (pnlRiver) and motion is governed by the river
    timer (timRiver). There are three size logs – there is no distinction between
    direction motion. The graphics are found in the KidGamesVCS\KidGamesVCSProjects\Leap
    Frog folder:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_880_0.png)


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_880_1.png)


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_880_2.png)


    Small logs are 40 pixels by 40 pixels, medium logs are 80 pixels by 40 pixels
    and large logs are 120 pixels by 40 pixels. These images will be used to create
    our Sprite objects. The program will assume these files are in your project''s
    BinDebug folder. Copy the three files to that folder.


    The river panel will have three rows (each 40 pixels high). In the top and bottom
    rows, logs will travel from left to right. In the middle row, logs will travel
    from right to left. The river is 120 pixels high – there are no border areas like
    we used in the road panel.


    We will use 12 logs (at most, higher game levels will have fewer). There will
    be logs in the top row, four logs in the middle row and three in the bottom row.
    The logs will be represented by an array (log) of Sprite objects. Like the vehicles,
    each sprite requires an image, a defining rectangle and a speed. The assignments
    I made are:


    ```

    log[0]: Medium Log, Top Row

    ```'
