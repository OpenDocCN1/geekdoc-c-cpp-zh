  md: '# Arrays


    Visual C# has powerful facilities for handling arrays, which provide a way to
    store a large number of variables under the same name. Each variable, called an
    element, in an array must have the same data type, and they are distinguished
    from each other by an array index. In these notes, we work with one-dimensional
    arrays, although multi-dimensional arrays are possible.


    Arrays are declared in a manner similar to that used for regular variables. For
    example, to declare an integer array named ''item'', with dimension 9, we use:


    ```

    int[] item = new int[9];

    ```


    The index on an array variable begins at 0 and ends at the dimensioned value minus
    one. Hence, the item array in the above examples has nine elements, ranging from
    item[0] to item[8]. You use array variables just like any other variable - just
    remember to include its name and its index.


    It is also possible to have arrays of controls. For example, to have 20 button
    types available use:


    ```

    Button[] myButtons = new Button[20];

    ```


    The utility of such a declaration will become apparent.'
