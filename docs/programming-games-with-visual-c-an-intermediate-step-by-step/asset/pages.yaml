    and install Setup Wizard, using the following link:


    https://visualstudiogallery.msdn.microsoft.com/f1cc3f3e-c300-40a7-8797-c509fb8933b9


    Setup Wizard will build a Setup program that lets the user install the application
    (and other needed files) on their computer. At the same time, Program menu entries,
    desktop icons and application removal programs are placed on the user''s computer.


    The best way to illustrate use of Setup Wizard is through an example. In these
    notes, we will build a Setup program for our Leap Frog example. Follow the example
    closely to see all steps involved. All results of this example will be found in
