  md: '# Pizza Delivery Form Design


    We begin building the Pizza Delivery project. Let''s build the first form – the
    one with the delivery grid, status monitor, pizza oven and car control. The results
    form will be built later. Start a new project in Visual C#. Once started, we suggest
    you immediately start the project with a name you choose. This sets up the folder
    and file structure needed for your project.


    Like previous projects, the form used in this project is fairly large. Due to
    margin restrictions, all representations of the form in these notes are smaller
    than real-size. Place a panel control on the left side of the form. It should
    be square. Mine is 500 pixels by 500 pixels. On the right side, add 2 group boxes
    at the top (each with a label control) and a picture box under the group boxes.
    Put a list box control and a label control in the picture box. Place another group
    box under the picture box control. In this group box, place 8 square baking pizzas
    and two picture box controls (to display baking pizzas) and two button controls.
    Add two more group boxes and two button controls. Add all label controls in the
    two group boxes and in the second, add a button control. For all label controls,
    set AutoSize to False to allow resizing and set BorderStyle to FixedSingle so
    we can see where they fit. Add two small picture box controls under the two control
    buttons at the bottom (these will not be visible in the running project). Lastly,
    add four timer controls to the form. They will be placed in the tray area under
    the form; as we continue development, we will discuss how these are used in the
    Pizza Delivery simulation.


    When done, the form should resemble this (again this is smaller than its real
    size):'
  merge: -1
  pgno: 528
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_529_0.png)


    The panel control holds the delivery grid. The first two group boxes with labels
    display the clock and sales. The picture box control (with the list box and label)
    displays clock order and car status. The third group box (with picture boxes and
    two buttons) display and control the pizzas baking in the oven. The fourth group
    box displays the number of baked pizzas. The final group box is used to load pizzas
    in the car. The final buttons (one to start and pause the game and one to stop
    and exit the project) are used to control control operation of the game. The timer
    controls will be used to control the clock, the phone orders, the oven and the
    car. Finally, there are two picture box controls ‘behind’ the two button controls.
    They are used to store views of the car in the grid.


    If any of the controls used in this project are unfamiliar, review the appropriate
    material in Chapter 2 of these notes. Set the control properties using the properties
    window:'
  merge: -1
  pgno: 529
