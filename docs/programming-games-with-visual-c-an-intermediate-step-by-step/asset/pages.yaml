  md: '# Setting Properties of Controls at Design


    Each form and control has properties assigned to it default when you start up
    a new project. There are two ways to display the properties of an object. The
    first way is to click on the object (form or control) in the form window. Sizing
    handles will appear on that control. When a control has sizing handles, we say
    it is the active control. Now, click on the Properties window or the Properties
    window button in the toolbar. The second way is to first click on the Properties
    window. Then, select the object from the drop-down box at the top of the Properties
    window. When you do this, the selected object (control) will now be active (having
    sizing handles). Shown is the Properties window (make sure the Properties button,
    not the Events button is selected in the toolbar) for the Form object:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_55_0.png)


    The drop-down box at the top of the Properties Window is the Object box. It displays
    the name of each object in the application as well as its type. This display shows
    the Form object. The Properties list is directly below this box. In this list,
    you can scroll through the list of properties for the'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'selected object. You select a property by clicking on it. Properties can be
    changed by typing a new value or choosing from a list of predefined settings (available
    as a drop down list). Properties can be viewed in two ways: Alphabetic and Categorized
    (selected using the menu bar under the Object box). We always use the Alphabetic
    view.


    A very important property for each control is its Name. The name is used by Visual
    C# to refer to a particular object or control in code. A convention has been established
    for naming Visual C# controls. This convention is to use a three letter (lower
    case) prefix (identifying the type of control) followed by a name you assign.
    A few of the prefixes (we’ll see more as we progress):


    | Control | Prefix | Example |

    | --- | --- | --- |

    | Form | frm | frmWatch |

    | Button | btn | btnExit, btnStart |

    | Label | lbl | lblStart, lblEnd |

    | Text Box | txt | txtTime, txtName |

    | Menu | mnu | mnuExit, mnuSave |

    | Check box | chk | chkChoice |


    It is suggested to use a mixture of upper and lower case letters for better readability.
    But, be aware that Visual C# is a case-sensitive language, meaning the names frmWatch
    and FRMWATCH would be not assumed the same name.


    Control (object) names can be up to 40 characters long, must start with a letter,
    must contain only letters, numbers, and the underscore (_) character. Names are
    used in setting properties at run-time and also in establishing method names for
    control events. Use meaningful names that help you (or another programmer) understand
    the type and purpose of the respective controls.


    Another set of important properties for each control are those that dictate position
    and size. There will be times you want to refer to (or change)'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'these properties. There are four properties:


    +   - Left: Distance from left side of form to left edge of control, in pixels

    - Top: Distance from title bar of form to top edge of control, in pixels

    - Width: Width of control, in pixels

    - Height: Height of control, in pixels


    Pictorially, these properties for a button control are:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_57_0.png)


    Finding these properties in the Properties window is a bit tricky. To find the
    Left and Top properties, expand the Location property. The displayed X value is
    the Left property, while Y is the Top property. To find the Width and Height properties,
    expand the Size property – the width and height are displayed and can be modified.


    It is possible to multi-select several controls and set common properties. To
    select multiple controls, first click one control to make it active. Then, for
    all subsequent choices, hold down the <Ctrl> key while clicking the desired controls.
    For example, here is a form with all three button controls selected (button1 selected
    first):'
  merge: -1
  pgno: 57
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_58_0.png)


    When you go to the **Properties window with multiple controls selected, no control
    name will be listed in the drop-down box. Rather, a set of common properties for
    the selected controls will be listed. Any properties changed in this situation
    will affect all selected controls. This approach to setting properties is useful
