  md: '# Rules of C# Programming


    Before starting our review of the C# language, let''s review some of the rules
    of C# programming seen in the first chapter:


    +   - C# code requires perfection. All words must be spelled correctly.

    >- C# is case-sensitive, meaning upper and lower case letters are considered to
    be different characters. When typing code, make sure you use upper and lower case
    letters properly.

    >- C# ignores any “white space” such as blanks. We will often use white space
    to make our code more readable.

    >- Curly braces are used for grouping. They mark the beginning and end of programming
    sections. Make sure your C# programs have an equal number of left and right braces.
    We call the section of code between matching braces a block.

    >- It is good coding practice to indent code within a block. This makes code easier
    to follow. The Visual C# environment automatically indents code for you.

    >- Every C# statement will end with a semicolon. A statement is a program expression
    that generates some. Note that not all C# expressions are statements (for example,
    the line defining the main method has no semicolon).'
