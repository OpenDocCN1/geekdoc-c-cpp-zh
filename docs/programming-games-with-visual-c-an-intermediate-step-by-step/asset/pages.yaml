  md: '# # Sprite Animation


    We complete the animation by adding the lander and other graphic elements to the
    viewer panel. Recall the lander image appears as:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_787_0.png)


    We want to use the DrawImage graphics method to place this on the background image
    in the viewer panel. If you copy this image onto the background using the DrawImage
    method we used to draw the background, the lander will be there, but the background
    will be black, obliterating any part of the landscape behind it. We want whatever
    background the lander is over to “come through.” We accomplish this via sprite
    animation.


    Sprite animation is done by invoking a different version of the DrawImage method
    using an ImageAttributes object. Such an object allow us to declare one color
    within the bitmap to be transparent. Then, when the bitmap is drawn over a background,
    that background will show through. Let''s go through the necessary steps for sprite
    animation.


    The ImageAttributes object is part of the Drawing.System.Imaging namespace. The
    object (MyImageAttributes) is declared using:


    System.Drawing.Imaging.ImageAttributes myImageAttributes;


    and constructed using:


    ```

    myImageAttributes = new

    System.Drawing.Imaging.ImageAttributes();

    ```'
  merge: -1
  pgno: 787
- img_proc: true
  md: 'The desired transparent color (**clearColor**) is established using the **SetColorKey**
    method:


    ```

    myImageAttributes.SetColorKey(clearColor, clearColor);

    ```


    You may wonder why the color argument is repeated. The **SetColorKey** method
    actually allows specification of range of colors that can be considered transparent.
    The two arguments specify a **low** color and a **high** color. In our example,
    we only want a single color; hence both arguments are the same.


    To draw an entire source image (**myImage**) using the **ImageAttributes** object
    in a graphics object (**myGraphics**), we use this version of the **DrawImage**
    method:


    ```

    myGraphics.DrawImage(myImage, rectDestination, 0, 0, myImage.Width, myImage.Height,
    GraphicsUnit.Pixel, myImageAttributes);

    ```


    where **rectDestination** is the rectangle structure within the graphics object
    (the destination location) where the image will be drawn. Arguments 3 (0), 4 (**0**),
    5 (**myImage.Width**), and 6 (**myImage.Height**) specify the source rectangle.
    These are respectively, the desired **x** within the source image, **y** within
    the source image, **width** from the source image, and **height** from source
    source image. If you only want to copy a portion of the source, you would adjust
    these arguments. With this method (now including the **ImageAttributes** object),
    **myImage** will be drawn in **myGraphics** with the desired transparent color.


    One question is lingering — how do you determine the desired transparent color?
    In our example, it is obviously black. Many times, the background is not that
    apparent. The **clearColor** argument must be a C# **Color** object, usually using
    the **FromArgb** method with values for the red, green and blue contributions.
    How do you come up with such values? I''ll give one approach.'
  merge: -1
  pgno: 788
- img_proc: true
  md: 'Assume you have an image stored in a file myImage.bmp and the background color
    is the pixel in the upper left corner. Here’s a snippet of code to identify the
    background color in the bitmap:


    ```

    Image myImage;

    myImage = Image.FromFile("\MyImage.bmp");

    Bitmap getBitmap = new Bitmap(myImage);

    Console.WriteLine(myBitmap.GetPixel(0, 0));

    ```


    First, the image is loaded from its file. Next, the Image object is converted
    to a Bitmap object. We can determine the color of individual pixels in such objects.
    That is what is done in the final line of code – we read the color, using GetPixel,
    of the pixel in the upper left corner of myBitmap (part of the background) and
    print it to the output window. When run, the output window will display the red,
    green and blue contributions to the color. You can then use these values in the
    Color.FromArgb method to obtain the color argument to use in the ImageAttributes
    object to make the background of the image transparent.


    We don’t need to use the above approach here since we know the background color
    for our graphic elements (lander, pad, thrusts flames) is black, a built-in color.
    Let’s add these images to the viewer panel.'
