  md: '# Rectangle Structure


    We have seen that graphics elements are bounded by rectangles. Visual C# provides
    a useful Rectangle structure to specify the size and locations of rectangles.


    Rectangle Structure Properties:


    +   * **Height**: Gets or sets the width of the rectangle

    * **Width**: Gets or sets the height of the rectangle

    * **X**: Gets or sets the x-coordinate of the upper-left corner of the rectangle

    * **Y**: Gets or sets the y-coordinate of the upper-left corner of the rectangle


    The measurements (X, Y) are relative to the graphics object. A diagram shows everything:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_763_0.png)


    Each property can be changed at run-time.


    There are two steps involved in creating a rectangle structure. We first declare
    the structure using the standard statement:


    ```

    Rectangle myRectangle;

    ```'
