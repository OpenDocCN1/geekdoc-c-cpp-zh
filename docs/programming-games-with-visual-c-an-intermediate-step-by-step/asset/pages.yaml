- img_proc: true
  md: 'Click event for 4 buttons, how do we know which of the 4 buttons is invoking
    the method? The **sender** argument of the event method provides the answer.


    Each event method has a **sender** argument (the first argument of two) which
    identifies the control whose event caused the method to be invoked. With a little
    Visual C# coding, we can identify the **Name** property (or any other needed property)
    of the sending control. For our button example, that code is:


    ```

    Button btnExample;

    string buttonName;

    // Determine which button was clicked

    btnExample = (Button) sender;

    buttonName = btnExample.Name;

    ```


    In this code, we define a variable (**btnExample**) to be the type of the control
    attached to the method (a **Button** in this case). Then, we assign this variable
    to **sender** (after casting **sender** to the proper control type). Once this
    variable is established, we can determine any property we want to identify the
    button. In the above example, we find the button''s **Name** property. With this
    information, we now know which particular button was selected and we can process
    any code associated with this button. Notice a shortcut way to identify the **Name**
    property (without declaring any variables) is to use:


    ```

    ((Button) sender).Name

    ```'
