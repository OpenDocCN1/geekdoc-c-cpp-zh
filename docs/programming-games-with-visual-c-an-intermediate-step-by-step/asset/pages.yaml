  md: '# Visual C# Decisions - if Statements


    The concept of an if statement for making a decision is very simple. We check
    to see if a particular Boolean condition is true. If so, we take a certain action.
    If not, we do something else. if statements are also called branching statements.
    Branching statements are used to cause certain actions within a program if a certain
    condition is met.


    The simplest branching statement is this form of the if structure:


    ```

    if (condition)

    [process this line of code]

    ```


    In this statement, condition is true, then the single statement following the
    statement will be executed. If condition is false, nothing is done and program
    execution continues following this line of code.


    Example:


    ```

    if (balance – check < 0)

    trouble = true;

    ```


    Here, if and only if balance - check is less than zero, the trouble variable is
    set to true. Notice this form of the if statement has no curly braces.


    If there is more than one line of code to process following an if check, we use
    another form for the Visual C# if statement:


    ```

    if (condition)

    {

    [process this code]

    }

    ```'
  merge: -1
  pgno: 191
