  md: '# Match Game Form Design


    We begin building the Match Game project. Let''s build the form. Start a new project
    in Visual C#. Once started, we suggest you immediately save the project with a
    name you choose. This sets up the folder and file structure needed for your project.


    The form used in this project is fairly large. Due to margin restrictions, all
    representations of the form in these notes are smaller than real-size. We assume
    the photos you use for the game are standard 4 x 6 photos, in landscape mode (width
    is greater than height). We use 20 picture box controls to display the photos
    on the form. We use a picture box size of 150 x 100 pixels to maintain the height-to-width
    ratio of the photos. Place these picture boxes on the left side of the form in
    five rows of four picture boxes each. On the right side, add 5 label controls
    (set AutoSize to False to allow resizing; set BorderStyle temporarily to FixedSingle
    so we can see where they fit). Then, add three group boxes, along with two button
    controls. Place two radio button controls in the first two group boxes and four
    radio button controls in the third. In the lower right corner, add one additional
    picture box control (used to store the photo ''cover''). Add a timer control to
    the form. It will be placed in the tray area under the form; later, we will discuss
    its use for implementing delays.


    When done, the form should resemble this (again smaller than its real size):'
  merge: -1
  pgno: 419
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_420_0.png)


