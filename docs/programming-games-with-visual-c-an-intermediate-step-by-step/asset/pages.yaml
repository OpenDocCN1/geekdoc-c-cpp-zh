- img_proc: true
  md: '# Distribution of Files


    To run an application without Visual C#, you need an executable version of the
    application (exe file). Each time you run your project in the Visual C# environment,
    such an executable version is created and stored in your project''s Bin\Debug
    folder. Open the Bin\Debug folder for any project you have built and you''ll see
    a file with your project name as Application. For example, using my Computer to
    open the Bin\Debug folder for the Leap Frog game project shows:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_1023_0.png)


    In this folder are files created by Visual C# Express and files needed by the
    application to successfully run. These latter files include the high scores file,
    graphics files and sound files.


    The file named Leap Frog.exe (66 KB in size) is the executable version of the
    application. (Notice the file has a “plain vanilla” form icon next to its listing
    – we will change that soon.) If I make sure Visual C# is not running and double-click
    this file, the following appears:'
  merge: -1
  pgno: 1023
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_1024_0.png)


    Voila! The **Leap Frog** project is running outside of the Visual C# IDE!


    So distributing a Visual C# application is as simple as giving your user a copy
    of the executable file (and other needed files), having them place in a folder
    for their computer and double-clicking the file to run it? Maybe. This worked
    on my computer (and will work on yours) because I have a very important set of
    files known as the **.NET Framework** installed (they are installed when Visual
    C# is installed). Every Visual C# application needs the .NET Framework to be installed
    on the hosting computer. The .NET Framework is central to Microsoft’s .NET initiative.
    It is an attempt to solve the problem of first determining what language (and
    version) an application was developed in and making sure the proper run-time files
    were installed. The .NET Framework supports all Visual Studio languages, so it
    is the only runtime software need by Visual Studio applications.'
  merge: -1
  pgno: 1024
- img_proc: true
  md: 'The next question is: how do you know if your user has the .NET Framework installed
    on his or her computer? And, if they don''t, how can you get it installed? These
    are difficult questions. For now, it is best to assume your user does not have
    the .NET Framework on their computer. It is new technology that will take a while
    to get disseminated. Once the .NET Framework is included with new Windows operating
    systems, most users will have the .NET Framework and it can probably be omitted
    from any distribution package.


    So, in addition to our application''s executable file, we also need to give a
    potential user the Microsoft .NET Framework files and inform them how to install
    and register these files on their computer. Things are getting complicated. Further
    complications for application distribution are inclusion and installation of ancillary
    data files, graphics files and configuration files. Fortunately, Visual C# offers
    help in distributing, or deploying, applications.


    Visual C# uses Setup Wizard for deploying applications. Setup Wizard will identify
    all files needed by your application and bundle these files into a Setup program.
    You distribute your program to your user base (usually on a CD-ROM). Your user
    then runs the resulting Setup program. This program will:


    +   - Install the application (and all needed files) on the user''s computer.

    - Add an entry to the user''s Start/Programs menu to allow execution of your application.

    - Add an icon to the user''s desktop to allow execution of your application.


    We''ll soon look at use of Setup Wizard to build a deployment package for a Visual
    C# application. First, let''s quickly look at the topic of icons.'
  merge: -1
  pgno: 1025
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 1026
- img_proc: true
  md: '# Application Icons


    Recall there is an icon that looks like a little, blank Windows form associated
    with the project executable. And, notice that whenever you design a form in the
    Visual C# IDE (and run it), a small icon appears in the upper left hand corner
    of the form. Icons are used in several places in Visual C# applications: to represent
    files in My Computer, to represent programs in the Programs menu, and to represent
    programs on the desktop. Icons are used throughout applications. The default icons
    are ugly! We need the capability to change them.


    Changing the icon connected to a form is simple. The idea is to assign a unique
    icon to indicate the form’s function. To assign an icon, click on the form’s Icon
    property in the properties window. Click on the ellipsis (...) and a window that
    allows selection of icon files will appear. The icon file you load must have the
    ico filename extension and format.


    A different icon can be assigned to the application. This will be the icon that
    appears next to the executable file’s name in Windows Explorer, in the Programs
    menu and on the desktop. Let’s do this for the Leap Frog game project. Open the
    project in Visual C#. Go to the Solution Explorer window and highlight the project
    name (Leap Frog). Choose the Project menu item and select Leap Frog Properties.
    This properties window will appear:'
  merge: -1
  pgno: 1027
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_1028_0.png)


    The icon is selected in the **Icon**: You can choose an icon already listed or
    click `<Browse>** which allows you to select an icon using a dialog box. Once
    you choose, two things will happen. The icon will appear on the property pages
    and the icon file will be added to your project''s folder. This will be seen in
    the **Solution Explorer** window.


    The Internet and other sources offer a wealth of icon files from which you can
    choose an icon to assign to your form(s) and applications. But, it''s also fun
    to design your own icon with that touch.


    It is possible to create your own icon using Visual Studio. To do this, you need
    to understand use of the **Microsoft Paint** tool. We will show you how to create
    a template for an icon and save it in Paint. To do this, we assume you have basic
    knowledge of using Paint. For more details on how to use Paint, go to the internet
    and search for tutorials.


    To create an icon for a particular project, in **Solution Explorer**, right-click
    the project name, choose **Add**, then **New Item**. This window will appear:'
