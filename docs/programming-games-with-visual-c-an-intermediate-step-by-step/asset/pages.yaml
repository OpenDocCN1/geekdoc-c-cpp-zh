  md: '# Timer Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_132_0.png)


    Below Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_132_1.png)


    The Visual C# Timer control generate events without any input from the user. Timer
    controls work in your project''s background, generating events at time intervals
    you specify. This event generation feature is handy when screen displays need
    to be updated at regular intervals. Other control events can be detected while
    the timer control processes events in the background. This multi-tasking allows
    more than one thing to be happening in your application.


    Timer Properties:


    | Name | Gets or sets the name of the timer control (three letter prefix is tim).
    |

    | Enabled | Used to turn the timer on and off. When True, timer control continues
    to operate until the Enabled property is set to False. |

    | Interval | Number of milliseconds (there are 1000 milliseconds in one second)
    between each invocation of the timer control’s Tick event. |


    Timer Events:


    | Tick | Event method invoked every Interval milliseconds while timer control’s
    Enabled property is True. |'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'To use the Timer control, we add it to our application the same as any control.
    There is no user interface, so it will appear in the tray area below the form
    in the design window. You write code in the timer control’s Tick event. This is
    the code you want to repeat every Interval milliseconds.


    The timer control’s Enabled property is False at design time. ‘turn on’ a timer
    in code by changing this property to True. Usually, you will have some control
    that toggles the timer control’s Enabled property. That is, you might have a button
    that turns a timer on and off. The logical Not operator is very useful for this
    toggling operation. If you have a timer control named timExample, this line of
    code will turn it on (set Enabled to True) if it is off (Enabled is False). It
    will do the reverse if the timer is already on:


    ```

    timExample.Enabled = !timExample.Enabled;

    ```


    It is best to start and end applications with the timer controls off (Enabled
    set to False).


    Applications can (and many times do) have multiple timer controls. You need separate
    timer controls if you have events that occur with different regularity (different
    Interval values). Timer controls are used for two primary purposes. First, you
    use timer controls to periodically repeat some code segment. This is like our
    stopwatch project. Second, you can use a timer control to implement some ‘wait
    time’ established by the Interval property. In this case, you simply start the
    timer and when the Interval is reached, have the Tick event turn its corresponding
    timer off.


    Typical use of Timer control:


    +   - Set the Name property and Interval property.


    +   - Write code in Tick event.


    +   - At some point in your application, set Enabled to True to start timer. Also,
    have capability to reset Enabled to False, when desired.'
