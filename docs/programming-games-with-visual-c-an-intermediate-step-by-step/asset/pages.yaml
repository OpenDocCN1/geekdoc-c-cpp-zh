  md: '# Visual C# Arithmetic Operators


    Operators modify values of variables. The simplest operators carry out arithmetic
    operations. There are five arithmetic operators in C#.


    Addition is done using the plus (+) sign and subtraction is done using the minus
    (-). Simple examples are:


    | Operation | Example | Result |

    | --- | --- | --- |

    | Addition | 7 + 2 | 9 |

    | Addition | 3.4 + 8.1 | 11.5 |

    | Subtraction | 6 - 4 | 2 |

    | Subtraction | 11.1 - 7.6 | 3.5 |


    Multiplication is done using the asterisk (*) and division is done using the slash
    (/). Simple examples are:


    | Operation | Example | Result |

    | --- | --- | --- |

    | Multiplication | 8 * 4 | 32 |

    | Multiplication | 2.3 * 12.2 | 28.06 |

    | Division | 12 / 2 | 6 |

    | Division | 45.26 / 6.2 | 7.3 |


    The last operator is the remainder operator represented by a percent symbol (%).
    This operator divides the number on its left side by the whole number on its right,
    ignores the main part of the answer, and just gives you the remainder. It may
    not be obvious now, but the remainder operator is used a lot in computer programming.
    Examples are:


    | Operation | Example | Division Result Operation Result |

    | --- | --- | --- | --- | --- |

    | Remainder | 7 % 4 | 1 | Remainder | 3 |

    | Remainder | 14 % 3 | 4 | Remainder | 2 |

    | Remainder | 25 % 5 | 5 | Remainder | 0 |'
  merge: -1
