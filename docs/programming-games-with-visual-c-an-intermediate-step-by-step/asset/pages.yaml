    As desired, we now have random pairs of the integers from 0 to 9. Matching pairs
    of integers represent matching pairs of photos in Match Game.


    How do we know what photo is behind what picture box control? Say we have a picture
    box control, represented by element i of the control array photoBox[i]. To determine
    the photo, examine photoIndex[i]; call this value j. The photo behind this picture
    box is then photo[j], element j of the array holding the 10 photos being used.
    To set the Image property, the proper line of code is:


