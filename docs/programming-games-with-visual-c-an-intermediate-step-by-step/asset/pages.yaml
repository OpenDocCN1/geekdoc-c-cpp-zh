  md: '# Call Stack Window


    General methods can be called from many places in an application. That’s the idea
    of using a general method! If an error occurs in such a method, it is helpful
    to know which method was calling it. While in break mode, the **Call Stack** window
    will provide display all active methods, that those that have not exited. The
    call stack window provides a road map of how you got to the point you are in the
    code. The call stack window can be viewed using the dropdown button on the debug
    toolbar or select the Debug menu option, choose **Windows**, then **Call Stack**.


    Call Stack Window Example:


    Set a breakpoint on the **numberCalls++** line in the general method **(FtoC)**.
    Run the application. Click **Show Temperatures**. The program will break at the
    marked line. Open the call stack window and you will see:


    | Call Stack Name |

    | --- |

    | Debug Example.exe\WindowsApplication1.frmDebug.btnShow_FtoC.ClickClick(object
    sender, System.EventArgs e) Line 29 [External Code] |

    | Debug Example.exe\WindowsApplication1.Program.Main() Line 20 [External Code]
    |


    The information of use to use is the top two lines. These lines tell us that we
    are in the **FtoC** function and it was called by the **btnShow_Click** on a form
    named **frmDebug**. This would be very useful information if there were an error
    occurring in the function.


    Stop the application and remove all breakpoints.'
