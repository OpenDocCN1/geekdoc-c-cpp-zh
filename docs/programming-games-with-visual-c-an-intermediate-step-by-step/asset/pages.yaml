  md: '# # Viewing Variables in the Locals Window


    In the breakpoint example, we used tooltips to examine variable values. We could
    see variable values, no matter what their scope. The Locals window can also be
    used to view variables, but only those with method level scope. As execution switches
    from method to method, the contents of the local window change to reflect only
    the variables applicable to the current method. The locals window can be viewed
    using the dropdown button on the debug toolbar or select the Debug menu option,
    choose Windows, then Locals.


