  md: '# Code Design - Log Collisions


    Once the frog crosses the road and avoids the snake, it’s time to cross the river.
    To do this, the frog must jump onto the floating logs as they go by. The collision
    logic is different here. For the vehicles and the snake, if there is a collision,
    the frog’s journey ends. Here, if there is a collision, we want the frog to float
    with the log. If there is no collision, the frog’s journey ends with a splash!


    Before discussing the logic of floating on a log, let’s add the sound. We’ll play
    a ‘splash’ sound if the frog misses a log. The sound file Splash.wav is included
    in the KidGamesVCS\KidGamesVCS Projects\Leap Frog folder. Copy this file to your
    project’s BinDebug folder. Add this declaration for the sound:


    System.Media.SoundPlayer splashSound;


    Place these two lines at the bottom of the frmLeapFrog Load method to load this
    sound:


    ```

    splashSound = new

    System.Media.SoundPlayer(Application.StartupPath + "\Splash.wav");

    splashSound.Load();

    ```


    Once the frog enters the river, we need to see if it’s sitting on a log. If so,
    with each river timer update, the position of the frog will change with the position
    of the log. To see if a frog is on a log, we use the IsCollided method. If 80
    percent of the frog intersects with a log sprite, we will say the frog is on the
    log (this allows a little ‘hangover’ room). We will use a variable (onLog) to
    identify the ‘occupied’ log. Add this form level declaration:


    ```

    int onLog;

    ```'
