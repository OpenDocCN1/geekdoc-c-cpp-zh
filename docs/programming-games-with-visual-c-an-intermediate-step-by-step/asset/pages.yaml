  md: "# Writing to the Output Window\n\nBefore using the debugger, you might want\
    \ to try the oldest debugging technique of all – writing information out. You\
    \ can write directly to the output window while an application is running. Sometimes,\
    \ this is all the debugging you may need. A few carefully placed write statements\
    \ can sometimes clear up logic errors, especially in small applications. To write\
    \ to the output window, use the WriteLine method of the Debug object.\n\nConsole.WriteLine(stringData);\n\
    \nThis will write the string information StringData as a line in the output window.\
    \ Hence, the output window can be used as a kind of scratch pad for your application.\
    \ Any information written here is just for your use. Your users will never see\
    \ it ever. You also must maintain the output window. Nothing is ever deleted.\
    \ To manually clear the window, right-click it and select Clear All.\n\nConsole.WriteLine\
