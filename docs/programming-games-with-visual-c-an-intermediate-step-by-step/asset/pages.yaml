  md: '# # CheckBox Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_102_0.png)


    On Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_102_1.png)


    Visual C# features many ''point and click'' controls that let the user make a
    choice by simply clicking with the mouse. These controls are attractive, familiar
    and minimize the possibility of errors in your application. We will see many such
    controls. The first, the **CheckBox** control, is examined here.


    The **CheckBox** control provides a way to make choices from a list of potential
    candidates. Some, all, or none of the choices in a group may be selected. Check
    boxes are used in all Windows applications (even the Visual C# IDE). Examples
    of their use would be to turn on and off in an application or to select from a
    ''shopping'' list.


    **CheckBox Properties:**


    | Name | Description |

    | --- | --- |

    | BackColor | Gets or sets the name of the check box (three letter prefix for
    check box name is **chk**). |

    | Checked | Gets or sets the check box background color. |

    | BackColor | Gets or sets a value indicating whether the check box is in the
    checked state. |

    | Font | Gets or sets font name, style, size. |

    | ForeColor | Gets or sets color of text or graphics. |

    | Text | Gets or sets string displayed next to check box. |

    | TextAlign | Gets or sets the alignment of text of the check |'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'box.


    # CheckBox Methods:


    # Focus


    Moves focus to this check box.


    # CheckBox Events:


    # CheckedChanged


    Occurs when the value of the Checked property changes, whether in code or when
    a check box is clicked.


    # Click


    Triggered when a check box is clicked.


    Checked property is automatically changed by Visual C#.


    When a check box is clicked, if there is no check mark there (Checked = False),
    Visual C# will place a check and change the Checked property to True. If clicked
    and a check mark is there (Checked = True), then the check mark will disappear
    and the Checked property will be changed to False. The check box can also be configured
    to have three states: checked, unchecked or indeterminate. Consult on-line help
    if you require such behavior.


    Typical use of CheckBox control:


    +   - Set the Name and Text property. Initialize the Checked property.

    - Monitor Click or CheckChanged event to determine when button is clicked. At
    any time, read Checked property to determine check box state.

    - You may also want to change the Font, Backcolor and Forecolor properties.'
  merge: -1
  pgno: 103
- img_proc: true
