- img_proc: true
  md: '# GroupBox Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_109_0.png)


    On Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_109_1.png)


    We''ve seen that both radio buttons and check boxes usually work as a group. Many
    times, there are logical groupings of controls. For example, you may have a scroll
    device setting the value of a displayed number. The **GroupBox** control provides
    a convenient way of grouping related controls in a Visual C# application. And,
    in the case of radio buttons, group boxes affect how such buttons operate.


    To place controls in a group box, you first draw the GroupBox control on the form.
    Then, the associated controls must be placed in the group box. This allows you
    to move the group box and controls together. There are several ways to place controls
    in a group box:


    +   - Place controls directly in the group box using any of the usual methods.

    - Draw controls outside the group box and drag them in.

    - Copy and paste controls into the group box (prior to the paste operation, make
    sure the group box is selected).


    To insure controls are properly place in a group box, try moving it and make sure
    the associated controls move with it. To remove a control from the group box,
    simple drag it out of the control.'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'Like the Form object, the group box is a container control, since it ‘holds’
    other controls. Hence, some controls placed in a group box will share BackColor,
    ForeColor and Font properties. To change this, select the desired control (after
    it is placed on the group box) and change the desired properties. Another feature
    of a group box control is when its Enabled property is False, all controls in
    the group box are disabled. Likewise, when the group control Visible property
    is False, all controls in the group box are not visible.


    Moving the group box control on the form uses a different process than other controls.
    To move the group box, first select the control. Note that ‘built-in’ handle (looks
    like two sets of arrows) for moving the control appears at the upper left corner:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_110_0.png)


    Click on this handle and you can move the control.


    As mentioned, group boxes affect how radio buttons work. Radio buttons within
    a GroupBox control work as a group, independently of radio buttons in other GroupBox
    controls. Radio buttons on the form, and not in group boxes, work as another independent
    group. That is, the form is itself a group box by default. We’ll see this in the
    next example.


    # GroupBox Properties:


    | Name | Gets or sets the name of the group box (three letter prefix for group
    box name is grp). |

    | BackColor | Gets or sets the group box background color. |

    | Enabled | Gets or sets a value indicating whether the group box is enabled.
    If False, all controls in the group box are disabled. |

    | Font | Gets or sets font name, style, size. |'
  merge: -1
  pgno: 110
- img_proc: true
  md: '| ForeColor | Gets or sets color of text. |

    | Text | Gets or sets string displayed in title region of group box. |

    | Visible | If False, hides the group box (and all its controls). |


    The **GroupBox** control has some methods and events, but these are rarely used.
    We are more concerned with the methods and events associated with the controls
    in the group box.


    Typical use of **GroupBox** control:


    +   - Set **Name** and **Text** property (perhaps changing **Font**, **BackColor**
    and **ForeColor** properties).

    - Place desired controls in group box. Monitor events of controls in group box
    using usual techniques.'
  merge: -1
  pgno: 111
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Panel Control


    In Toolbox:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_113_0.png)


    On Form (Default Properties):


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_113_1.png)


    The Panel control is another Visual C# ''container'' control. It is nearly identical
    to the GroupBox control in behavior. Controls are placed in a Panel control in
    the same manners they are placed in the GroupBox. Radio buttons in the same panel
    will work as an independent group. Yet, panel controls can also be used to display
    graphics (lines, rectangles, ellipses, polygons, text, animations).


    Panel Properties:


    +   - Name: Gets or sets the name of the panel (three letter prefix for panel
    name is pnl).

    - AutoScroll: Gets or sets a value indicating whether the panel will allow the
    user to scroll to any controls placed outside of its visible boundaries.

    - BackColor: Get or sets the panel background color.

    - BorderStyle: Get or set the panel border style.

    - Enabled: Gets or sets a value indicating whether the panel is enabled. If False,
    all controls in the panel are disabled.'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'Visible If False, hides the panel (and all its controls).


    Panel Event:


    Paint Used to display graphics in panel.


    Like the form and group box objects, the panel is a container control, since it
    ‘holds’ other controls. Hence, many controls placed in a panel will share the
    BackColor property (notice the panel does not have a Text property). To change
    this, select the desired control (after it is placed on the group box) and change
    the background color. Also, note the panel is moved using the displayed ‘handle’
    identical to the process for the group box in the previous class.


    Typical use of Panel control:


    +   - Set Name property.

    - Place desired controls (if any) in panel control.

    - Monitor events using usual techniques.'
  merge: -1
  pgno: 114
- img_proc: true
  md: <!-- no content -->
  merge: -1
