    | File | Edit | View | Project | Build | Debug | Team | Format | Tools | Test
    | Analyze | Window | Help |


    You will become familiar with each menu topic as you work through the course.
    Briefly, they are:


    +   **File**

    Use to open/close projects and files. Use to exit Visual C#


    +   **Edit**

    Used when writing code to the usual editing tasks of cutting, pasting, copying
    and deleting text


    +   **View**

    Provides access to most of the windows in the IDE


    +   **Project**

    Allows you to add/delete components to your project


    +   **Build**

    Controls the compiling process


    +   **Debug**

    Comes in handy to track down errors in your code (when Visual C# is in **Debugging**
    mode)


    +   **Team**

    Used when several people work on one project.


    +   **Format**

    Used to modify appearance of your graphic interface.


    +   **Tools**

    Allows custom configuration of the IDE. Be particularly aware of the **Options**
    under this menu item. This allows you to modify the IDE to meet any personal requirements.


    +   **Test**

    Allows you to compile and run your completed application (go to **Running** mode)


    +   **Analyze**

    Performs analytics on your code.


    +   **Window**

