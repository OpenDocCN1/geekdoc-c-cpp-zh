- img_proc: true
  md: '# Errors in Visual C# Projects


    No matter how hard we try, errors do creep into our projects. These errors can
    be grouped into three categories:


    +   1. Syntax errors

    2. Run-time errors

    3. Logic errors


    Syntax errors occur when you mistype a command, leave out an expected phrase or
    argument, or omit needed punctuation. Visual C# and the Intellisense feature detects
    these errors as they occur and even provides help in correcting them. You cannot
    run a Visual C# program until all syntax errors have been corrected. The Task
    window in the Visual C# IDE lists all syntax errors and identifies the line they
    occur in.


    Run-time errors are usually beyond your program''s control. Examples include:
    when a variable takes on an unexpected value (divide by zero), when a drive door
    is left open, or when a file is not found. Visual C# lets trap such errors and
    make attempts to correct them. Doing so precludes our program from unceremoniously
    stopping. User''s do not like programs that stop unexpectedly! We will discuss
    handling run-time errors in later chapters.


    Logic errors are the most difficult to find. With logic errors, the program will
    usually run, but will produce incorrect or unexpected results. The Visual C# debugger
    is an aid in detecting logic errors.


    Some ways to minimize errors are:


    +   - Design your application carefully. More design time means less debugging
    time.

    - Use comments where applicable to help you remember what you were trying to do.'
  merge: -1
  pgno: 214
- img_proc: true
  md: +   - Use consistent and meaningful naming conventions for your variables, controls,
    objects, and methods.
  merge: -1
