  md: "# # Code Design – Stopped to Playing State\n\nWhen the user clicks the Start\
    \ Game button in the ‘stopped’ state, several things must happen to switch the\
    \ Tic Tac Toe game to ‘playing’ state:\n\n+   > Change the Text property of btnStartStop\
    \ to Stop Game.\n> Disable group boxes (don't allow selection of options while\
    \ playing).\n> Disable btnExit.\n> Establish this as X’s turn (since X always\
    \ goes first).\n> Blank out label controls displaying marks.\n> Allow player to\
    \ input a mark on the grid.\n\nWe establish three variables in the form level\
    \ declarations to help keep track of where we are in the game:\n\n```\nbool xTurn;\n\
    bool canClick = false;\nint numberClicks;\n```\n\nIf xTurn is true, it’s X’s turn,\
    \ otherwise it is O’s turn. canClick is used to determine if it’s okay to click\
    \ on the label controls. It is true when playing, false (the initial value) when\
    \ stopped. numberClicks keeps track of how many of the grid labels have been clicked\
    \ on (9 maximum).\n\nThe code for the btnStartStop_Click event implements the\
    \ steps in the above method and initializes the new variables is:\n\n```\nprivate\
    \ void btnStartStop_Click(object sender, EventArgs e)\n{\n    btnStartStop.Text\
    \ = \"Stop Game\";\n```"
  merge: -1
  pgno: 353
- img_proc: true
  md: "```\ngrpPlayers.Enabled = false;\ngrpFirst.Enabled = false;\ngrpComputer.Enabled\
    \ = false;\nbtnExit.Enabled = false;\nxTurn = true;\nlblMessage.Text = \"X's Turn\"\
    ;\n// reset boxes\nfor (int i = 0; i < 9; i++) {\n    boxArray[i].Text = \"\"\
    ;\n    canClick = true;\n    numberClicks = 0;\n}\n```\n\nCan you see how the\
    \ needed steps are implemented in code?\n\nSave and run the project. Click Start\
    \ Game and the game should switch to two player ‘playing’ state:"
