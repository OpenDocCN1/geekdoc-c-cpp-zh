    building a Visual C# project. If you''ve used Visual C# before, this material
    should be familiar. If you''ve programmed with other languages, you should have
    a fairly clear understanding of what''s going on.


    After completing this chapter, you should understand:


    +   > A little of the history of Visual C#.

    > The concept of an event-driven application

    > The parts of a Visual C# application (form, control, property, event, ...)

