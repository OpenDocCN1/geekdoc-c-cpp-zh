  md: '# TextBox Events:


    +   - Click Occurs when the user clicks the text box.


    +   - Enter Occurs when the control receives focus.


    +   - KeyDown Occurs when a key is pressed down while the control has focus.


    +   - KeyPress Occurs when a key is pressed while the control has focus.


    +   - Leave Triggered when the user leaves the text box. This is a good place
    to examine the contents of a text box after editing.


    +   - TextChanged Occurs when the Text property value has changed.


    Typical use of TextBox control as display control:


    +   - Set the Name property. Initialize Text property to desired string.


    +   - Set ReadOnly property to True.


    +   - If displaying more than one line, set MultiLine property to True.


    +   - Assign Text property in code where needed.


    +   - You may also want to change the Font, Backcolor and Forecolor properties.


    Typical use of TextBox control as input device:


    +   - Set the Name property. Initialize Text property to desired string.


    +   - If it is possible to input multiple lines, set MultiLine property to True.
    Set ScrollBar property.


    +   - In code, give Focus to control when needed. Provide key trapping code in
    KeyPress event (discussed later in this chapter). Read Text property when Leave
    event occurs.


    +   - You may also want to change the Font, Backcolor and Forecolor properties.'
  merge: -1
  pgno: 99
- img_proc: true
  md: Use of the TextBox control should be minimized if possible. Whenever you give
    a user the option to type something, it makes your job as a programmer more difficult.
    You need to validate the information they type to make sure it will work with
    your code (we will do this with the loan assistant). There are many controls in
    Visual C# that are ‘point and click,’ that is, the user can make a choice simply
    by clicking with the mouse. We’ll look at such controls through these notes. Whenever
    these ‘point and click’ controls can be used to replace a text box, do it!
  merge: -1
