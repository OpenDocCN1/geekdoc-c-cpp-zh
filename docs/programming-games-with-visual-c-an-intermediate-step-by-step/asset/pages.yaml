  md: '# Visual C# Statements and Expressions


    The simplest (and most common) statement in C# is the assignment statement. It
    consists of a variable name, followed by the assignment operator (=), followed
    by some sort of expression, followed by a semicolon (;). The expression on the
    right hand side is evaluated, then the variable on the left hand side of the assignment
    operator is replaced by that value of the expression.


    Examples:


    The assignment statement stores information.


    Statements normally take up a single line. Since C# ignores white space, statements
    can be stacked using a semicolon;) to separate them.

    Example:


    ```

    startTime = now; endTime = startTime + 10;

    ```


    The above code is same as if the second statement followed the first statement.
    The only place we tend to use stacking is for quick initialization of like variables.


    If a statement is very long, it may be continued to the next line without any
    kind of continuation character. Again, this is because C# ignores white space.
    It keeps processing a statement until it finally sees a semicolon.

