  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_805_0.png)


    Now, let’s complete this game with some automatic horizontal thrust control.


    To automatically control the horizontal thrusters, we will use the suggested path
    (the red line) drawn in the trajectory panel. The idea is to apply thrust such
    that the lander stays near this path, leading to the landing pad. Engineers call
    this approach **“trajectory following.”** Let the altitude at **time = 0.0** be
    **altitude0** and the corresponding lateral distance be **lateral0** (the starting
    point on the trajectory). Here’s a sketch of the suggested trajectory (red line)
    and the current lander location (green circle), with corresponding variables:'
  merge: -1
  pgno: 805
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_806_0.png)


    In this graph, the origin (where **altitude = lateral = 0**) represents the center
    of the landing pad.


    In this sketch, the lander lateral position is **lateral**, yet we want it to
    be **d**, the point on the trajectory line corresponding to the lander altitude
    **(altitude)**. We define a “miss” distance (**miss**) as:


    **miss = lateral – d;**


    Using the idea of similar triangles, we can write:


    **d / lateral0 = altitude / altitude0**


    Or


    **d = lateral0 * (altitude / altitude0);**


    Then, the **miss** distance is:


    **miss = lateral – lateral0 * (altitude / altitude0);**'
  merge: -1
  pgno: 806
- img_proc: true
  md: "If miss is a positive number, we want the lander to move to the left (or apply\
    \ right thrust). Conversely, is miss is negative, we want the lander to move to\
    \ the right (or apply left thrust). A good question to ask is how big does miss\
    \ need to be before applying thrust? Zero would be a good answer. In such a case,\
    \ the right thruster would move the lander to the left of the path, then the left\
    \ thruster would move it back to the right. The horizontal thrusters would just\
    \ keep alternating, burning lots of fuel. In our game, we will not apply any horizontal\
    \ thrust until the lander is at least two meters away from the suggested trajectory\
    \ path.\n\nAs an aside, this is similar to logic used in the thermostat used to\
    \ heat your home. When the temperature is lower than the thermostat setting, the\
    \ furnace is turned on. When the temperature exceeds the setting, the furnace\
    \ is turned off. But, the furnace doesn’t turn on if the temperature is just below\
    \ the setting. It waits until the temperature difference (miss) is about 2 degrees\
    \ or so. The same difference in temperature is used before turning the furnace\
