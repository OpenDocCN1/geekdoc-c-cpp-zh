  md: '# Code Design – Landing Pad Distances


    As noted, the current displayed values does not answer the question – how far
    are we from the landing pad? Let''s add the pad graphic element to the landscape
    element and determine what these distances are. The pad element (another rectangle;
    shown in red) is located at (padX, padY), has width pad.Width and height pad.Height:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_708_0.png)


    In this sketch, we’ve added two distances. altitude specifies how far the lander
    is above the pad. It is the distance from the bottom of the lander to the middle
    of the pad:


    altitude = (landscape.Height – pad.Height / 2) – (landerY + lander.Height);


    Notice altitude decreases as the lander goes down (landerY increases). This is
    opposite of our basic coordinate system, but it makes sense here. altitude represents
    the height above the pad – it approaches zero as the lander gets closer to the
    pad.'
  merge: -1
  pgno: 708
- img_proc: true
  md: 'The other distance, **lateral**, specifies the horizontal distance from the
    lander to the pad. It is the distance from the middle of the lander to the middle
    of the pad:


    **lateral = (landerX + lander.Width) – (padX + pad.Width);


    Notice **lateral** is positive if the lander is the right of the pad, negative
    if it is to the left of the pad. **lateral** is zero if the lander is directly
    centered over the pad.


    We can add these equations to our program to get proper indication of **altitude**
    and **lateral**, but there’s one problem. We don’t know the sizes of our images.
    We’ll fix that now. We will use five images in the program: **landscape, lander,
    pad, hThrust,** and **vThrust**. Each image is included as a bitmap (**bmp**)
    file in the **KidGamesVCS\KidGamesVCS Projects\Moon Landing** folder. Let''s take
    a look at each image. You can open them in the Windows Paint program or any other
    drawing program you might have.


    The **landscape** image (**landscape.bmp**) is 676 pixels wide by 732 pixels high
    (shown 60 percent of actual size here):'
