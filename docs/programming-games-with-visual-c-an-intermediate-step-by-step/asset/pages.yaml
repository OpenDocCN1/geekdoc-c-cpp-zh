    \ another if it is false? Use an **if/else** block:\n\n```\nif (condition)\n{\n\
    \    [process this code]\n}\nelse\n{\n    [process this code]\n}\n```\n\nIn this\
    \ block, if condition is true, the code between the first two braces is executed.\
