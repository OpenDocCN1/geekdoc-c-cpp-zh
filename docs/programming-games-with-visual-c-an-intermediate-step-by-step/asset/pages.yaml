  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_814_0.png)


    A near perfect landing under the safe landing speed of -3.0 m/s and almost on
    top of the pad (just enough fuel!). Click the button at the bottom if you want
    to play again.


    The game is now complete. As you play, it will become obvious that there are many
    ways to obtain a safe landing with the vehicle. Without a fuel constraint, you
    can take forever to land. A more interesting problem is to try to land as fast
    as possible. The so-called minimum time problem. Or try to land using the least
    fuel possible - an important problem in space travel where you don''t want to
    launch a lot of unnecessary weight.


    Try a so-called ‘coast and burn’ approach. That is, let your land keep dropping
    until some point where you apply nearly constant vertical thrust until landed.
    This approach needs to be used in space vehicles where thrusters can only be turned
    on, but never off (like solid rocket motors).'
