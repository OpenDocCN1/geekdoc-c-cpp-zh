  md: "# Visual C# Looping\n\nMany applications require repetition of certain code\
    \ segments die of course. For example, you may want to roll a die (simulated die\
    \ of course) until it shows a six. Or, you might generate financial results until\
    \ a certain sum of returns has been achieved. This idea of repeating code is called\
    \ iteration looping.\n\nIn Visual C#, looping is done with one of two formats.\
    \ The first is the while loop:\n\n+   while (condition)\n{\n  [process this code]\n\
    }\n\nIn this structure, the code block in braces is repeated ‘as long as’ the\
    \ Boolean expression condition is true. Note a while loop structure will not execute\
    \ even if the while condition is false the first time through. If we enter the\
    \ loop, it is assumed at some point condition will become false to allow exiting.\
    \ Notice there is no semicolon after the while statement.\n\nThis brings up a\
    \ very important point – if you use a loop, make sure you can get out of the loop!\
    \ It is especially important in the event-driven environment of Visual C# event-driven\
    \ applications. As long as your code is operating in some loop, no events can\
    \ be processed. You can also exit a loop using the break statement. This will\
    \ get you out of a loop and transfer program control to the statement following\
    \ the loop’s closing brace. Of course, you may need logic in a loop to decide\
    \ when a break is appropriate. You can also use a continue statement within a\
    \ loop. When a continue is encountered, all further steps in the loop are skipped\
    \ and program operation is transferred to the top of the loop.\n\nExample:"
  merge: -1
  pgno: 201
