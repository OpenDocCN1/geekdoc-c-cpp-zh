  md: '# # Steps in Developing a Visual C# Project


    The Visual C# Integrated Development Environment (IDE) makes building an application
    straightforward process. There are three primary steps involved in building a
    Visual C# application:


    +   1. **Draw the user interface** by placing controls on a Windows form

    2. **Assign properties** to controls

    3. **Write code** for control events (and perhaps write other methods)


    These same steps are followed whether you are building a very simple application
    or one involving many controls and many lines of code.


    The event-driven nature of Visual C# applications allows you to build an application
    in stages and test it at each stage. You can build one method, or part of a method,
    at a time and try it until it works as desired. This minimizes errors and gives
    you, the programmer, confidence as your application takes shape.


    As you progress in your programming skills, always remember to take this sequential
    approach to building a Visual C# project. Build a little, test a little, modify
    a little and test again. You''ll quickly have a completed application. This ability
    to quickly build something and try it makes working with Visual C# fun – not a
    quality found in some programming environments! Now, we''ll start Visual C# and
    look at each step in the application development process.'
  merge: -1
  pgno: 36
