  md: '# Pen Object


    As mentioned, the graphics methods used here require a Pen object. This virtual
    pen is just like the pen you use to write and draw. You can choose color, width
    and style of the pen. You can use pens built into Visual C# or create your own
    pen.


    In many cases, the pen objects built into Visual C# are sufficient. The Pens class
    will draw a line 1 pixel width in a color you choose (Intellisense will present
    the list to choose from). If the selected color is ColorName (one of the 141 built-in
    color names), the syntax to refer to such a pen is:


    Pens.ColorName


    To create your own Pen object, you first declare the pen using:


    Pen myPen;


    The pen is then created using the Pen constructor:


    ```

    myPen = new Pen(color, width);

    ```


    where color is the color your new pen will draw in and width is the integer width
    of the line (in pixels) drawn. This pen will draw a solid line. The color argument
    can be one of the built-in colors or one generated with the FromArgb method. Using
    some of the other versions of the constructor allow you to create pens that can
    draw dashed and other line styles. Consult on-line help for details.


    Once created, you can change the color and width at any time using the Color and
    Width properties of the pen object. The syntax is:


    ```

    myPen.Color = newColor;

    myPen.Width = newWidth;

    ```'
