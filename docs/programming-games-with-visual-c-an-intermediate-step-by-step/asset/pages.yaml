  md: '# Review and Preview


    The final game we build is a version of a classic video game named Frogger. We
    call our game Leap Frog. In the game, you maneuver a frog through highway traffic,
    past a roaming snake and across a raging river to reach home safely.


    The game features fun graphics and multiple levels for challenging play. While
    building the project, you learn more graphics capabilities, basic object-oriented
    programming concepts, how to read keyboard inputs and how to work with data files
    (for saving high scores).


