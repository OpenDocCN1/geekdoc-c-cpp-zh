    scores and provide messaging. The radio buttons establish game options. The buttons
    (one to start and stop the game and one to exit the project) are used to control
    operation of the game. The timer will be used to implement a delay for the computer
    player. Finally, there is a picture box control ‘behind’ the two button controls.
    It is used to store the ‘cover’ picture that hides the photos.


