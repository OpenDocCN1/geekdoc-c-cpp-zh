  md: '# # Structure of a Visual C# Project


    We want to get started building our first Visual C# Windows project. But, first
    we need to define some of the terminology we will be using. In Visual C#, a Windows
    application is defined as a solution. A solution is made up of one or more projects.
    Projects are groups of forms and code that make up some application. In these
    notes, our applications (solutions) will be made up of a single project. Because
    of this, we will usually use the terms application, solution and project synonymously.


    As mentioned, a project (application) is made up of forms and code. In these notes,
    our projects will only use a single form. Pictorially, this is:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_32_0.png)


    This Project (application) is made up of:


    +   - **Form** - Window that you create for user interface

    - **Controls** - Graphical features drawn on forms to allow user interaction (text
    boxes, labels, scroll bars, buttons, etc.) Forms and'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Controls are also called objects. Visual C# is known as an object-oriented
    language.


    +   - Properties - Every characteristic of a form or control is specified by a
    property. Example properties include names, captions, size, color, position, and
    contents. Visual C# applies default properties. You can change properties when
    designing the application or even when an application is executing.


    +   - Methods - Built-in procedures that can be invoked to impart some action
    to a particular object.


    +   - Event methods - Code related to some object or control. This is the code
    that is executed when a certain event occurs. In your applications, this code
    will be written in the C# language (covered in detail in Chapter 3 of these notes).


    +   - General Methods - Code not related to objects. This code must be invoked
    or called in the application.


    Visual C# uses a very specific directory structure for saving of all the components
    for a particular application. When you start a new project (solution), you will
    be asked for a Name and Location (directory). A folder named Name will be established
    in the selected Location. That folder will be used to store all solution files,
    project files, form files (cs extension) and other files needed by the project.
    Two subfolders will be established within the Name folder: Bin and Obj. The Obj
    folder contains files used for debugging your application as it is being developed.
    The Bin folder contains two other folders: Debug and Release. The Bin\Debug folder
    holds your compiled application (the actual executable code or exe file). Later,
    you will see that this folder is considered the ‘application path’ when ancillary
    data, graphics and sound files are needed by an application.


    In a project folder, you will see these files (and possibly more):


    | SolutionName.sln | Solution file for named SolutionName |

    | SolutionName.suo | Solution options file |'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'ProjectName.csproj Project file – one for each project in solution


    ProjectName.csproj.user Another Project file – one for each project in solution


    FormName.resx Form resources file – one for each form


    FormName.cs Form code file – one for each form


    App.ico Icon used to represent the application'
  merge: -1
