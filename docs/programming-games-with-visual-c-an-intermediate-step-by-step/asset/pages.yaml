  md: 'Important: There are two things we need to do to make sure the arrow keys can
    move the frog. First, in Windows applications, keyboard inputs can also be used
    to click buttons, select menu items and perform other tasks. To make sure our
    keyboard inputs (arrow keys) are seen (by KeyDown) before being considered for
    other tasks, we set the KeyPreview property of frmLeapFrog to True. Do that now.


    Second, there is a minor problem related to the arrow keys. In any container control
    (form, group box, panel) with other controls, the arrow keys are used to ‘tab’
    from one control to the other. When such container controls have ‘focus’, or are
    active, the KeyDown event is not triggered by an arrow key. Hence, to move the
    frog using arrow keys, we need to make sure focus stays on a panel control without
    any other controls. In this program, we will make sure the focus stays on the
    start panel. To do this, add one line of code at the end of the btnStartPause
    Click event:


    ```

    pnlStart.Focus();

    ```


    With this line in place, after any button is clicked, focus is placed back on
    pnlStart, allowing arrow keys to be detected by the KeyDown event. Now, we can
    get the frog moving.


    To move a frog from one panel to the next (changing the frogLocation variable),
    we will first clear (using the Sprite class Clear method) the frog from its current
    location, then redraw it (using the Draw method) in its new location. To move
    a frog left or right within a panel, we will move (using the Move method) the
