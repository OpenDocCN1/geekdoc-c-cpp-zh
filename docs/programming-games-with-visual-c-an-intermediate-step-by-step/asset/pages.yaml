  md: '# Code Design – Stopped to Playing to Stopped State


    In the Safecacker and Tic Tac Toe projects, the button to start and stop the game
    was the same control. That is also the case here. We will look at the code behind
    this control (btnStartStop) to both start and stop the game.


    When the user clicks the Start Game button in the ‘stopped’ state, several things
    must happen to switch Match Game to ‘playing’ state:


    +   > Change the Text property of btnStartStop to Stop Game.

    > Initialize scores and corresponding label controls to zero.

    > Initialize number of photos remaining (20).

    > Shuffle photos using nRandomIntegers method.

    > Initialize picture boxes for displaying photos.

    > Disable group boxes (don’t allow selection of options while playing).

    > Disable btnExit.

    > Establish this as Player 1’s turn.

    > Set message to player.

    > Allow player to click on picture box controls.


    Conversely, when the user clicks the Stop Game button in ‘playing’ state, several
    things must happen to switch Match Game to ‘stopped’ state:


    +   > Change the Text property of btnStartStop to Start Game.

    > Enable grpNumberPlayers.

    > Enable grpPlayWho if one player game.

    > Enable grpDifficulty if one player game and playing computer.

    > Enable btnExit.'
