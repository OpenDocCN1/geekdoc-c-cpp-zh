  md: '# Review and Preview


    The next project we build is a Moon Landing simulation. You are the pilot of a
    lunar landing vehicle hovering over the moon. You must land it safely using your
    thrusters. The program uses physics and math to build a realistic simulation.


    You will learn how to use Visual C# graphics for drawing lines and shapes and
    for complex animations with scrolling backgrounds.


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_653_0.png)'
  merge: -1
