  md: '# # Pizza Delivery Game Project

    Enhancements


    There are some ways to change the Pizza Delivery project. Some possibilities are:


    +   - The game difficulty can be adjusted if you like. By varying the time between
    phone orders, the size of orders, the time needed to make a delivery and the speed
    of the car, you can make the game easier or harder. You would need some way for
    the player to select a difficulty.

    - The current car cannot be re-routed once it starts. Modify the click logic to
    re-route the car if desired.

    - Once business builds, you might need a second car. Think of ways you might be
    able to implement and control more than one car.

    - This particular pizza parlor only makes one kind of pizza. This simplifies the
    simulation somewhat. The car can stay out on the road and deliver whatever pizzas
    are in the car. The oven can just keep cranking out pizzas. It would be interesting
    to make different types of pizzas available for order. You would have to know
    how many of each are ordered, bake different types and load different types into
    the car. This would be more like a real pizza delivery process.'
  merge: -1
