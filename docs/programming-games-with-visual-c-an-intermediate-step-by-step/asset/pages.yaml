  md: '# Code Design – Accepting Player Input


    Once the secret combination has been generated, the next step is to allow the
    user to enter his or her guess at the combination. This is done using the 9 number
    buttons on the panel control in the bank graphic. The steps followed are:


    +   * Click a button to enter a digit.

    * If this is the first number in the combination, clear out any previous guess
    in label controls.

    * Determine which button was clicked.

    * Disable the clicked button since repeating digits are not allowed.

    * Add the number on the clicked button to the user’s input combination.

    * Display the number in the proper label control.

    * If all digits have been entered, enable the number buttons and compare the user’s
    input to the actual combination, else repeat these steps.


    The code to perform these steps will be placed in a method named btnCombo_Click.
    This method is set to handle the Click event for all 9 buttons used for input
    (btn1, btn2, btn3, btn4, btn5, btn6, btn7, btn8, btn9).


    Add these form level variables to store the combination entered by the user and
    the number of digits entered:


    ```

    int digitsEntered;

    String enteredCombo;

    ```


    Initialize the value of these two new variables using the shaded code in btnStartStop_Click:'
