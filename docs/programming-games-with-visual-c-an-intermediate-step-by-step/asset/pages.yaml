  md: '# Code Design – Checking For Win


    We will build a general method (named CheckForWin) that examines the playing grid
    and determines if there is a winner. If so, the win will be identified and the
    method will return a string variable holding the marker (X or O) for the winner
    or a blank if there is no winner. Let''s establish a strategy for doing this.


    There are eight possible ways to win (3 horizontal, 3 vertical, 2 diagonal). Notice
    the indices of the label control array (boxArray) used in the playing grid are
    laid out in this manner:


    | 0 | 1 | 2 |

    | 3 | 4 | 5 |

    | 6 | 7 | 8 |


    If we declare a string array named possibleWins, its 8 elements would be:


    ```

