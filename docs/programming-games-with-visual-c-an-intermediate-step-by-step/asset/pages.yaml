    \ end of the panel. To avoid this overlap, we will 'delay' redrawing cars by 80\
    \ pixels and 'delay' drawing trucks by 40 pixels. This way, each vehicle is in\
    \ its own buffer of 120 pixels (the size of a semi) and no overlap will occur.\n\
