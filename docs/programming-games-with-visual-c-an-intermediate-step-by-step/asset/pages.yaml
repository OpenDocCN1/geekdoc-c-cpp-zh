  md: '# Code Design – Clock


    The first element we add to the Pizza Delivery is the clock that keeps track of
    time. Recall the clock starts at 6:00 and stops at 11:00. We don''t want the game
    to actually last five hours, so we speed up a bit. We need to decide how fast
    we want the five hours to really go by and still be able to play the game. This
    is one of the tuning parameters we discussed.


    The clock is controlled by the timer named timClock. With each Tick event for
    this control, we add one minute to the clock. We want to define a constant (mSecPerMinute)
    which tells us how many milliseconds (the Interval property of timClock) should
    elapse for each minute on the clock. We choose to take approximately 15 minutes
    to play a complete game, or simulate 300 minutes (5 hours x 60 minutes/hour) of
    pizza deliveries. So, we need invoke the Tick event 300 times in 900000 milliseconds
    (15 minutes x 60 seconds/minute x 1000 milliseconds/second). The constant we use
    is:


    ```

    mSecPerMinute = 900000 / 300 = 3000 milliseconds/minute

    ```


    Add this constant to the form level declarations area:


    ```

    const int mSecPerMin = 3000;

    ```


    And, add this single line at the end of the frmPizzaDelivery Load method to set
    up the timer control:


    ```

    timClock.Interval = mSecPerMin;

    ```


    As mentioned, with each Tick event, we add one minute to the clock display. Add
    these form level declarations to keep track of the time:


    ```

    int clockHour, clockMinute;

    ```


    The corresponding code in the timClock Tick event is:'
