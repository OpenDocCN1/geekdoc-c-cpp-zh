  pgno: 654
- img_proc: true
  md: '# Moon Landing Project Preview


    In this chapter, we will build a Moon Landing game. In this simulation, you control
    horizontal and vertical thrusters to maneuver your craft over a landing pad on
    the surface of the moon. You want to make sure your landing speed is slow enough
    that you don''t crash!


    The finished project is saved as Moon Landing in the KidGamesVCS\KidGamesVCS Projects
    folder. Start Visual C# and open the finished project. Open the form named MoonLanding.cs
    and you will see:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_655_0.png)'
  merge: -1
  pgno: 655
- img_proc: true
  md: 'On the left of the Moon Landing form are two panel controls (one inside the
    other to build a border). The inside panel will display the lunar module as it
    descends to the moon. On the right side is a group box control holding landing
    control information. Several label controls display time, altitude and lateral
    distance information. Under these labels is a progress bar which shows fuel remaining
    in the module. The black panel and smaller gray panel under the progress bar will
    show current module position relative to the pad. The three button controls with
    arrows control the land’ thrusters. There is also a label under these buttons
    used for messages. When running, either the label or the thrust buttons will appear.
    The two button controls at the bottom are used to start/pause the game and to
    stop the game or exit the program. Another button lies under these buttons used
    to restart the game. Again, when running, either this button or the two control
    buttons will appear, not both. Below the form in the ‘tray’ area is a timer control
    used to monitor the landing module’s location and update all the graphic features
    of the game.


    There are other group boxes on the form that are not apparent. Select the group
    box with landing control information. Right-click the group box and choose **Send
    To Back**. You will see two group boxes hidden under this group box. These are
    used to establish options for **Moon Landing:**'
  merge: -1
  pgno: 656
- img_proc: true
  md: '![](img/84c2dc99e83d71da8758a0b7a2be88cf_657_0.png)


    It is common in Visual C# games to have controls stacked on top of each other
    to conserve form space. Then, in code, you decide when certain controls appear
    (using the Visible property). The first group box has five radio buttons and a
    check box control. It used to establish your level of piloting ability and whether
    you want to run in auto-pilot mode. The second group box (with two radio buttons)
    allows you to select the system of units you want information displayed in. Bring
    the landing control group box back in front of these group boxes if you want to.


    Like the Pizza Delivery game in the last chapter, there''s lots going on in the
    Moon Landing game. So, before running the game, let''s describe its operation.
    Prior to starting your descent to the moon, choose your pilot level: Beginner,
    Novice, Junior, Senior, or Advanced. Decide if you want Auto-Pilot On. And, select
    the type of units: Metric (meters) or US (feet).'
  merge: -1
  pgno: 657
- img_proc: true
  md: 'The idea under each option is the same. Your vehicle is some height above the
    surface of the moon at zero speed. Due to gravity (about one-sixth the gravity
    on earth), you begin to accelerate towards the surface with a corresponding change
    (goes negative) in your speed (a negative speed indicates descent - positive speed
    indicates ascent). You slow your descent by clicking on the vertical thruster
    (button with a down arrow). This thruster counteracts gravity effects. You must
    also adjust the lander''s lateral position relative to the landing pad. Your current
    lateral position (- if to the left of the pad, + to the right) and lateral speed
    (- if moving to the left, + if moving to the right) are displayed. Lateral motion
    of the lander is controlled using the two thrusters with left and right arrows.
    Note the left thruster accelerates the lander to the right and the right thruster
    accelerates the lander to the left. All thrusters operate in ''impulse'' mode.
    They are just fire momentarily, changing the speed in the corresponding direction.
    In ''rocket scientist'' talk, we say the thrusters impact a ''delta V'' (change
    in velocity) to the lander.


    The end goal is to over the landing pad and going at a slow descent speed (and
    slow lateral speed) by the time your altitude (height above the landing pad) reaches
    zero. A safe landing is one where the final speed is between 0 and -3 m/s (-10.0
    ft/s); higher descent speeds result in a crash! There are no crash penalties for
    missing the pad - your astronauts will have a long walk back to the home base!!


    The Beginner option provides practice in slowing the lander''s vertical speed.
    In the Novice option, you get practice controlling the vehicle in the lateral
    direction. The computer will control the vertical thruster, you only use the left
    and right thrusters. The Junior option moves you to having the ability to control
    all thrusters, and hence all motions on the lander. You now have to position the
    lander over its pad and make sure you are going at a slow vertical speed when
    landing, or else.


    Then, the Senior option offers one more concern. With the Senior (and Advanced)
    option, the fuel gauge shows how much fuel you have remaining. Each thruster burns
    some fuel (the vertical thruster uses twice as much as the left and right thrusters).
    So now, you must land at a'
  merge: -1
  pgno: 658
- img_proc: true
  md: 'safe speed, over the landing pad without running out of fuel. At low fuel levels,
    a beep will be heard. Once you run out of fuel, your vehicle will just accelerate
    toward the lunar surface, most likely resulting in a crash. The final level is
    Advanced, where your thrusters work in a random manner, predicting predictability
    from the program. Constant adjustments are needed to keep the vehicle over the
    pad and within speed limits. The program offers an Auto-Pilot mode to demonstrate
    how the computer lands the vehicle. It actually does a fairly decent job.


    At any time during the program, you may pause the action by clicking Pause Game.
    To restart, click Restart Game. To stop the program before landing, click Stop
    Game. Once a landing is complete, the program stops and you may view the final
    positions, speeds and fuel consumption. After reading the results, click Landing
    Complete-Click to Continue to play again.


