  md: '# How Names are Used in Control Events


    The names you assign to controls are also used by Visual C# to set up a framework
    of event-driven methods for you to add code to. Hence, proper naming makes these
    methods easier to understand.


    The format for each of these methods is:


    ```

    private void controlName_Event(Arguments)

    {

    }

    ```


    where Arguments provides information needed by the method to do its work.


    Visual C# provides the header line with its information and arguments and left
    and right curly braces (all code goes between these two braces) delineating the
    start and end of the method. Don’t worry about how to provide any code right now.
    Just notice that with proper naming convention, it is easy to identify what tasks
    are associated with a particular event of a particular control.'
  merge: -1
  pgno: 63
- img_proc: true
  md: <!-- no content -->
