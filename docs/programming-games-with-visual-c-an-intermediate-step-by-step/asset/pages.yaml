  md: '# Meet Different State and Provincial Curriculum Expectations and

    More


    Different states and provinces have their own curriculum requirements for computer
    science. With the Kidware Software products, you have at your disposal a series
    of projects which will allow you to pick and choose from among which best suit
    your curriculum needs. Students focus upon design stages and sound problem-solving
    techniques from a computer-science perspective. In doing so, they become independent
    problemsolvers, and will exceed the curricular requirements of elementary, middle
    and secondary schools everywhere.


    # Useable projects – out of the box!


    The specific projects covered in the Programming Games with Visual C# Express
    tutorials are suitable for grade 10 and above:


    +   - Safecracker (a numeric version of Mastermind)

    - Tic Tac Toe

    - Match Game (Concentration)

    - Pizza Delivery – a game emphasizing business practices

    - Moon Landing – emphasizing trajectory physics

    - Leap Frog – emphasizing collision detection


    As you can see, there is a high degree of care taken so that projects are age-appropriate,
    providing educational content in the finished games.


    You can begin teaching the projects on the first day. It’s easy for the teacher
    to have their own learning by starting with the solution files. Then, they will
    see all of parts of the lesson fall into place. Even a novice teacher could make
    use of the accompanying lessons. The lessons will provide more than just the coding
    of the solution – they will provide the correct context for the coding decisions
    which were made, and provide help in the investigation of related functions. Students
    then experiment with projects of their own making.'
  merge: -1
