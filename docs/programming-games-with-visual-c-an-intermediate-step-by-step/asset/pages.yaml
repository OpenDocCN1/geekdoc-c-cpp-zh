  md: '# Code Design – Reading High Scores


    To **read variables** from a file, we essentially reverse the write procedure.
    First, open the file using a StreamReader:


    ```

    System.IO.StreamReader inputFile = new

    System.IO.StreamReader(myFile);

    ```


    where **inputFile** is the returned file object and **myFile** is a valid path
    to the file. If the file you are trying to open does not exist, an error will
    occur.


    When all values have been read from the file, it is closed using:


    ```

    inputFile.Close();

    ```


    Variables are read from a file in the same order they were written. Hence, to
    read variables from a file, you need to know:


    +   - How many variables are in the file

    - The order the variables were written to the file

    - The type of each variable in the file


    If you developed the structure of the file (as we have for Leap Frog), you obviously
    know all of this information. And, if it is a file generated from another source
    (Excel, Access), the information should be known. If the file is from an unknown
    source, you may have to do a little detective work. Open the file in a text editor
    and look at the data. See if you can figure out what is in the file.


    Variables are read from a file using the **ReadLine** method. The syntax for our
    example file is:


    ```

    myVariable = inputFile.ReadLine();

    ```'
