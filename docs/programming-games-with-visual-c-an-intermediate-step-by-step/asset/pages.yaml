  md: '# Method Exit (Step Out)


    While stepping through your program, if you wish to complete the execution of
    a method (or function) you are in, without stepping through it line-by-line, choose
    the **Step Out** option. The method will be completed and you will be returned
    to the method accessing that function.


    To perform this step out, press <Shift>+F11>, choose **Step Out** from the **Debug**
    menu, or press the **Step Out** button on the toolbar


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_250_0.png)


    # Step Out Example:


    Run the previous example. Single step through it a couple of times. Also, try
    stepping over the function.


    At some point, while single stepping through the function, press the **Step Out**
    button. Notice how control is immediately returned to the calling method (btnShow
    Click event).


    At some point, while in the **btnShow Click** event, press the **Step Out** button.
    The method will be completed and the application form will reappear with the completed
    text box displayed.'
