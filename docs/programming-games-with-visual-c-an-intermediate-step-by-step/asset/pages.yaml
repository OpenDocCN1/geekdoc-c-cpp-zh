  md: '# Code Design – Integer Shuffling


    We will be presenting code for a shuffle process, so called because it can be
    used to shuffle a deck of cards. Here, we''ll just be shuffling 20 “cards,” though
    the code can be generalized to any number of “cards.” You might be asking, why
    we are shuffling 20 values, not 10, since we only have 10 photos? We need two
    copies of each of the 10 photo indices, hence there are 20 total items being shuffled.
    We propose randomly shuffling the integers from 0 to 19. After the shuffle, for
    any value greater than 9, we will subtract 10. This gives us a list of 20 random
    integers. This list will have two of each index from 0 to 9, telling which photo
    is behind picture box control. Let’s see how to do this.


    Usually when we need a computer version of something we can do without a computer,
    in code. it is fairly easy to write down the steps taken and duplicate them in
    code. When we shuffle a deck of cards, we separate the deck in two parts, then
    interleave the cards as we fan each part, making that familiar shuffle noise.
    I don''t know how you write code to do this. We''ll take another approach which
    is hard or tedious to do off the computer, but is easy to do on a computer.


    We perform what is called a “one card shuffle.” In a one card shuffle, we pull
    a single card (at random) out of the deck and lay it aside on a pile. Repeat this
    52 times and the cards are shuffled. Try it! I think you see this idea is simple,
    but doing a one card shuffle with a real deck of cards would be awfully time-consuming.
    We''ll use the idea of a one card shuffle here, with a slight twist. Rather than
    laying the selected card on a pile, we swap it with the bottom card in the stack
    of cards remaining to be shuffled. This takes the selected card out of the deck
    and replaces it with the remaining bottom card. The result is the same as if we
    lay it aside.


    Here’s how the shuffle works with n numbers:


    +   - Start with a list of n consecutive integers.

    - Randomly pick one item from the list. Swap that item with the last item. You
    now have one fewer items in the list to be sorted (called'
  merge: -1
  pgno: 446
- img_proc: true
  md: "the remaining list), or n is now n - 1.\n\n+   Randomly pick one item from\
    \ the remaining list. Swap it with the item on the bottom of the remaining list.\
    \ Again, your remaining list now has fewer items.\n\n+   Repeatedly remove one\
    \ item from the remaining list and swap it with the item on the bottom of the\
    \ remaining list until you have run out of items. When done, the list will have\
    \ been replaced with the original list in random order.\n\nThe code to do a one\
    \ card shuffle, or sort n integers, is placed in a general method named NRRandomIntegers.\
    \ The single argument is n the number of integers to sort. The method returns\
    \ an array containing the randomly sorted integers. The returned array is zero-based,\
    \ returning random integers from 0 to n - 1, not 1 to n. If you need integers\
    \ from 1 to n, just add 1 to each value in the returned array! The code is:\n\n\
    ```\nprivate int[] NRRandomIntegers(int n)\n{\n * Returns n randomly sorted integers\
    \ 0 -> n - 1\n */\nint[] nIntegers = new int[n];\nint temp, s;\nRandom sortRandom\
    \ = new Random();\n// initialize array from 0 to n - 1\nfor (int i = 0; i < n;\
    \ i++)\n{\nnIntegers[i] = i;\n}\n// i is number of items remaining in list\nfor\
    \ (int i = n; i >= 1; i--)\n{\n```"
  merge: -1
  pgno: 447
- img_proc: true
  md: '```

    s = sortRandom.Next(i);

    temp = nIntegers[s];

    nIntegers[s] = nIntegers[i - 1];

    nIntegers[i - 1] = temp;

    }

    return(nIntegers);

    }

    ```


    You should be able to see each step of the shuffle method. This method is general
    (sorting n integers) and can be used in other projects requiring random lists
    of integers.


    Add the NRandomIntegers method to your Match Game project. This will be used to
    hide the 10 photos behind the 20 picture box controls. In the project, we will
    use a level array photoIndex (dimensioned to 20) to hold the randomly sorted integers
    (the shuffled photo indices). Add this form level declaration to your project:


    ```

    int[] photoIndex = new int[20];

    ```


    The snippet of code that does a shuffle (and adjusts the values greater than 10)
    is:


    ```

    photoIndex = NRandomIntegers(20);

    for (int i = 0; i < 20; i++)

    if (photoIndex[i] > 9)

    photoIndex[i] -= 10;

    ```


    Let’s look at an example of how this works. If I run this snippet of code through
    a little example, the 20 elements of photoIndex returned from one particular call
    to NRandomIntegers are (arranged like our photo boxes):'
