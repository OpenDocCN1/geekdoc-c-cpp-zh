  md: '# Code Design – Phone Orders


    In Pizza Delivery, orders are phoned in randomly. The orders (time, location and
    number of pizzas) are displayed in the list box control (time sorted). The number
    of pizzas ordered is displayed at the proper location on the delivery grid (a
    green background is used). You then use this information to send a car to deliver
    the pizzas.


    Here’s another place where I just made up some rules for the orders – feel free
    to change them if you like. The rules implemented for pizza phone orders are:


    +   > Orders arrive at random times, in 1 to 7 minute increments.

    > Orders come from random locations on the delivery grid.

    > Each order is for 1 to 5 pizzas, using these probabilities:

    > * 1 pizza, 30 percent

    > * 2 pizzas, 20 percent

    > * 3 pizzas, 20 percent

    > * 4 pizzas, 15 percent

    > * 5 pizzas, 15 percent

    > No orders are accepted after 10:30 to allow car to finish deliveries.


    As mentioned, the order information will be displayed in the list box control.
    We use a specific format for listing. An example, say an order arrives at 6:20,
    from grid location G 12, for 2 pizzas. The order listing will appear as:


    ```

    6:20 G 12 -> 2

    ```


    Two arrays will be used to keep track of order information. pizzas is a two-dimensional
    array that says how many pizzas were ordered at a grid location and pizzaTime
    is a two-dimensional array holding the corresponding order time (in minutes).
    Add these two declarations in the form level area:'
