  md: '# # Tic Tac Toe Project Preview


    In this chapter, we will build a **Tic Tac Toe** game. This is purportedly the
    first game ever programmed on a computer by Bill Gates when he was a teenager
    at Lakeside School in Seattle. The object of the game is line up 3 X markers or
    3 O markers in a 3 3 grid. The markers can run horizontally, vertically or diagonally.
    Turns alternate between players. The version we build here allows two players
    to compete against each other or to a single player compete against a pretty smart
    computer.


    The finished project is saved as **Tic Tac Toe** in the **KidGamesVCS\KidGamesVCS
    Projects** folder. Start Visual C# and open the finished project. Open the form
    (double-click **TicTacToe.cs** in Solution Explorer) and you see:


    ![](img/84c2dc99e83d71da8758a0b7a2be88cf_329_0.png)'
