  md: '# Code Design - Deliveries


    Once the car arrives at a selected location, we need to check the status of the
    delivery at that location. We''ll also determine how the delivery affects our
    earnings. The rules used for deliveries are:


    +   - An-time delivery is within 30 minutes. On-time deliveries net $10 for each
    pizza delivered. On-time deliveries will have green backgrounds in the grid.

    - A late delivery is between 30 and 60 minutes. Late deliveries net $5 for each
    pizza delivered. Late deliveries will have red backgrounds in the grid.

    - After 60 minutes, the order is cancelled and there is a $1 penalty for each
    pizza not delivered.

    - It costs $3 to bake each pizza.

    - It costs $0.10 for each square the car travels through as it moves around.


    The above rules are implemented in several constants. Add these to the form level
    declarations area:


