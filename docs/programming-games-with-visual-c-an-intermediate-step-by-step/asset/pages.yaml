  md: '# Code Design – Initializing Stopped State


    Any time we start a project, there are certain initializations that must take
    place. Let''s look at additional initializations needed in the Pizza Delivery
    game. All initializations are done in the form''s Load event method.


    When initialized, we need to make sure the only thing a user can do is click on
    Start Game or Exit. They should not be able to operate the pizza oven or load
