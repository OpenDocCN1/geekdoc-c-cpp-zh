  md: '# String C# Functions


    Visual C# offers a powerful set of functions to work with string type variables,
    which are very important in Visual C#. The Text property of the label control
    and the text box control are string types. You will find you are constantly converting
    string types to numeric data types to do some math and then converting back to
    strings to display the information.


    To convert a string type to a numeric value, use one of the Convert methods seen
    in the Type Casting section. As an example, to convert the Text property of a
    text box control named txtExample to an int type, use:


    ```

    Convert.ToInt32(txtExample.Text)

    ```


    This result can then be used with the various mathematical operators. You need
    to be careful that the string you are converting to a number is a valid representation
    of a number. If it is not, an error will occur.


    The ToString method can be used to convert a numeric variable to a string. This
    bit of code can be used to display the numeric variable myNumber in a text box
    control:


    ```

    myNumber = 3.14159;

    txtExample.Text = myNumber.ToString();

    ```


    Some quantities do not support a ToString method. In such cases, you can use the
    Convert.ToString method. This code:


    ```

    myNumber = 3.14159;

    txtExample.Text = Convert.ToString(myNumber);

    ```


    will also do a conversion.'
