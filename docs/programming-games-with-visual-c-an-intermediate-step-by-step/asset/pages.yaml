    Save and run the project making sure the oven and car loading are disabled. We
    now begin adding other elements to our simulation, one at a time. We add code
    for running the clock, accepting phone orders, running the pizza oven, loading
    the car, moving the car and evaluating the deliveries. Each element will require
    certain “tuning” parameters – values that define how the simulation works. Every
    simulation has such parameters. These are constants you adjust as you define the
    program. In the code here, we give you values of such constants we use. Feel free
    to change them as you choose.'
