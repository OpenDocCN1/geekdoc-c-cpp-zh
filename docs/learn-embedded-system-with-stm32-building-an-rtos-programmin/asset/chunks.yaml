    然后，这些 P.S. 13 和 BBC 之间没有特别的区别。所以现在取决于情况。这就是为什么我刚才说，当你把高位寄存器设置为零时，是的，LCD 开启了，你在位位中设置为一，就像
    LCD 的十位一样。


    我们之所以这样设计，是因为微控制器的内部结构并不是为了提供更多电流（source current）或消耗电流（sinking current）设计的，因为它们能够提供的电流较小，对吧。也许你可能会想，为什么不那样设计呢？因为如果那样设计，他们说你会在结尾设置一个零，MOSFET
    开启，然后你接地。这样做是行得通的。但假设你把 `S1` 结尾的 MOSFET 引脚打开了，而现在相关的极极实际上是电流源。对吧。


    而且由于微控制器的内部结构，它提供的电流与廉价电源能提供的电流相比可能小得多。也许可能只有 10 毫安。对吧。那么现在即使它到了最大亮度，可能也只有一半的亮度，这并不是我们想要的。我们需要它要么达到全亮，要么完全关闭。对吧。如果你使用
    PWM 方法，是的，可以提供很多电流。因为电流实际上是由树形电阻提供的。在这种情况下，电流实际上是来自 `USB` 的电源。所以也许它可以达到 100 毫安。对吧。


    现在电阻被用来满足电流。所以剩下的电阻被标记为 `RFI`。你可以在这里看到，在微控制器背面的高位电阻上，你可以测量这个电阻，然后是在你的微控制器板上的电阻，可能来自不同的供应商，那么它会有不同。我的意思是，你实际上可以计算出
    `EDI` 到底消耗了多少电流，以及它何时发生。我可以去 Google 上找一张原理图，读出来是 510 欧姆，但我测量到的是……请想象一下。


    ### 帧结构解释


    我们必须使用停止位（stop bit），而且在术语中，帧（frame）解释了为什么他们只有一个停止位。他们为什么不放 16 位数据、32 位数据甚至更多一点数据呢？对吧。我将通过我这里的这张图来解释。


    假设现在当我发送数据包后，将速度配置为每秒一个位。因此，每秒我会在发送端发送一个位，接收端也配置为读取发送端发送的数据，速度同样每秒一个位。但现在的问题是，当我将两端都配置为每秒读取或发送一个位并进行操作时，问题在于我的发送和接收速度并不完全相同。所以通信速度可能会出现一些微小误差。他们说发送端每秒发送一个位，但实际上如果接收端读取数据的时间是一个位，每个位持续一秒，那么永远不会出现这种微小的误差偏差。读取偏差，对吧。而当你没有停止位时，这是一个大问题，因为它无法提供同步。


    ![](img/image_rsrc1SM.jpg)


    假设现在我们实际上每秒发送一个停止位。所以我们每秒都会听到一个停止位，给我留了一秒的安全时间。在第一秒，发送端实际上以这个速率发送了一个停止位，接收端到达了停止位并在这里接收到一个数据，然后之后在第一秒到第二秒之间，发送端发送了那个停止位。好，但现在接收端读取数据时比发送端延迟了
    0.1 秒。所以接收端读取数据的时间是 2.1 秒。现在你可以看到，从接收端读取数据的角度来看，存在意想不到的偏差，但它现在读的是 2.1 秒。好了。


    现在加上发送端再次发送一个停止位，假设现在接收端读取数据的时间点在第二秒。我们可以看到偏差会变得越来越大，在此之前的偏差是你的 1 秒读取中的读取延迟，对吧。然后第二个秒，你的点在读取延迟中的读取延迟中。假设在很一段时间之后，我运行了
    100 秒，假设接收数据刚好是 100 秒。对吧。现在它在这一点读取数据，在 100.1 秒时，它应该读取这比特数据，但现在它到达了错误的位。所以它给了我们错误的计数。这意味着由偏差引起的误差随着时间的推移会变得越来越大，最终到达错误的数据并给了我们错误的信息。


    如何解决这个问题。现在看，我们设置了停止位。好。这就是我们在这里提供的停止位。假设现在在 A 点，发送端发送了一个停止位，接收端读取了数据。好。在 B 点，发送端再次发送停止位。读取数据时会有一些微小延迟，比如
    0.1 秒，但它立即到达了那个位，读取时是 7 个位，读取偏差会比第一个位稍微大一点，但现在的好处是偏差会在这里停止。它会停止，而且在这里并不大。然后在一个新帧的开始处，接收端知道它将重新开始，它将开始读取数据，对于第一个位来说这本是一个大问题，它将再次从小开始，然后偏差会缓慢增加，由于位，它将再次开始。这意味着偏差只会一直增长。但增长到这个位后它就会停止，然后一个新的数据帧将重新开始，然后它又会停止。这也是为什么一个数据帧只有一个停止位的原因，因为他们不想让读取数据的延迟变得越来越大。想象一下，当你有一个数据帧时，对吧，你有
    32 位数据，当读取数据的微小偏差变得越来越大时，对吧。也许在最后一位比特，它可能会出错。

