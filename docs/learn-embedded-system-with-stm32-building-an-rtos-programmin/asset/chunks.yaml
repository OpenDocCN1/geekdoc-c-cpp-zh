    `Timer3` 以及它的频率是多少，我们需要找出这一点。让我们检查一下。查看你的数据表。正如之前的 `LC` 初始化部分提到的，外设的频率需要注意，以选择一个有效的时间标度值。如果我们打开参考手册页面，那里有
    `A`、`B`、`B` 一个外设时钟，然后是寄存器的位描述。我们将看到 `timer3` 由此寄存器启用，它对应于 `APB1` 总线并进行倍频缩放。在 `STM32`
    中，如 `Biomax` 在 `RCC` 窗口所示，我们可以看到所有 `APB1` 部分的定时器将获得 `60` 的健康频率，包括 `Timer3`。现在回到定时器初始化程序来定义标度，嗯，我们必须知道
    `APB1` 总线频率和需要测量的最短持续时间。在 `NSC` 协议中，我们有 `560` 微秒的最小脉冲长度。假设我们希望定时器测量的时间测量精度为 `10`
