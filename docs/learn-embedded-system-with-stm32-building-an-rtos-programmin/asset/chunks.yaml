    ![](img/image_rsrc1M1.jpg) `P1` 接口上的电源和地引脚进行正常操作，这与红外接收器的电源引脚相似。由于上述原因，我决定使用 `A`、`B`、`C`，其中一个。8
    个 LED 已连接到机板上。此外，当接收到特定的红外遥控器信号时，`LSD` 就可以开启和关闭。我们刚刚涵盖了本课程中将使用的硬件设置。现在我们正在进入课程中最有趣、最激动的部分。在课程的下节课中，我们将更深入地熟悉
    `NS` 协议，它具有命令格式，并且将从红外接收器生物分析器报告遥控。


    NEC 协议时序图分析


    我们已经接触课程的一个重要部分——`NS` 协议的描述，该协议将定义我们的固件算法，我们将在接下来的四个部分实现它。让我们来看，协议的主要特征是什么？距离调制。地址和命令都是位逻辑。逻辑
    0 需要 1.12 毫秒传输，逻辑 1 需要 2.25 毫秒传输。之后，只要按住按钮，就会发送重复码。在本节中，我们将为此分析 `NS` 协议的时序图。我将回顾从互联网接收到的输出数据。让我们将逻辑分析仪连接到地和
    `MCU` 的一个端口上。我将使用字段通道，它对应于橙色。记录的数据将包含来自遥控器的注释。


    ![](img/image_rsrc1M2.jpg)


    这是我将在你的遥控器中使用的两个带有 `NS` 协议的遥控器。此时，逻辑分析仪使用何种采样频率并不重要。对于这个通道，逻辑分析仪的协议解码器已配置为用于注释分析。


    ![](img/image_rsrc1M3.jpg)


    我按下开始按钮，逻辑分析仪开始记录。紧接着，我按住遥控器上的一个按钮一秒钟。然后对其他几个按钮执行了同样的操作。现在，通道三应该包含记录的时序图。红外接收器的输出有效电平为低电，这意味着当遥控器以更高的频率传输时，红外接收器的输出为
    0。第一个脉冲是 9 毫秒的 HCG 脉冲，用于红外接收器的同步。随后是一个长 4.5 毫秒的低电平。正如我们看到的，`NS` 协议描述与从遥控器记录的时序图之间存在相对小的差异。


    ![](img/image_rsrc1M4.jpg)


    接下来的 8 位是系统地址，随后是 8 位反转系统地址。众所周知，系统地址对应于特定的设备类型。最后是命令，它是系统地址之后传输的位反转。起始位随后是反转的命令数据字段。事实证明，尽管
    `NS` 协议定义每个数据脉冲的长度为 560 微秒，但脉冲的实际长度可能有 10-15% 的差异。在我们的情况下，这种真实世界的特征将被很好处理，因此我们不需要担心它。当按下遥控器上的按钮时，命令只传输一次。之后，只要按住按钮，就会发送快速增长。重复码可能由一个
    9 毫秒的 HCG 脉冲、一个短 2.25 毫秒暂停和 560 微秒的停止组成。在每个 `NS` 命令中，代理策略的间隔方式使得前端两个它们之间的时间为 108
    毫秒。108 毫秒的时间间隔适用于任何 SI 协议中的命令场和重复码场。现在，我们理解了协议中的命令是如何展开的，在开始开始实现并推断我们应该在哪里初始化系统外设之前。


    STM32 外设初始化


    我们已经对 `NS` 协议进行了简要概述。现在我们需要初始化系统外设。这只是几件事，但它们都是至关重要的。首先，我们需要定义想要使用的系统并在系统中对其进行配置。第二步是初始化输入和输出。连接到红外接收器和
    LED 的 `GPIO`。这一步还定义了 `MCU` 如何处理信号边缘和红外接收器输出数据。下一步是选择定时器，它用于测量系统中的时间间隔，例如位长度和暂停。


    ![](img/image_rsrc1M5.jpg)


    重要的是要这样配置 `MCU`，以便自动处理关键系统事件。因此，将使用系统中断。在本节中将使用两个 `STM32 Cube`。我将导出一个项目，将作为 `NS`
    编码算法实现的模板。可以通过编写代码手动配置 STM32 外设，但使用 STMCubeMX 我们可以更快地完成此。然而，我们仍然需要手动进行一些修改。此外，查看
    C 代码以更好地理解初始化过程要方便得多。


    系统时钟配置


    除此之外，我将介绍如何配置 `RCC` 复位和时钟单元。在我们选择频率之前，让我们告诉工具将使用外部石晶。现在，在六时钟窗口内，我们看到有几个系统源：内部
    `HSI`、随后的外部石晶和 HSE。对于发现板 `MCU`，默认启用了内部 16MHz 振荡器；我们可以指定 4MHz 到 26MHz 的外部石晶频率。在发现板上使用了
    8MHz。在我们的情况下，频率对于 `NS` 协议解码目的是足够的，但让我们让频率更高。为了这样做，外部晶体将与 `PLL` 块一起使用，8MHz 石晶频率将作为
    `PLL` 的输入。假设我们需要 168MHz 的健康频率。那么，这个 8MHz 的频率在进入 `PLL` 输入之前会被除以 4。然后乘以 64 并除以 2。


    ![](img/image_rsrc1M6.jpg)


    现在 64MHz 的频率是系统时钟频率。与内核不同，STM32 系统外设无法以最高频率运行。例如，虽然最高 `C.P.U` 频率可以配置为 168MHz，然后可以看到外设的工作频率最高为
    84、40MHz，仅取决于使用了哪种总线和外设。这就是为什么我们应该将 64MHz 除以 2，以获得 `PCLK`1 总线的健康频率。现在，当前全局重配置中没有明显的冲突，它可以在我们的固件中使用。时钟频率对
    G.P.A. 操作没有本质影响。尽管它会影响时间标量值，该值定义了外设输入频率必须除以哪个数字以获得所需的时间间隔、测量和精度。我们将在课程的时间初始化部分考虑这一点。到目前，我们配置了系统内核和外设设备的频率。您可以根据所需的频率配置您的开发板，并在下一节中对它们的单元各种配置进行练习，以发现将要考虑的内容。


