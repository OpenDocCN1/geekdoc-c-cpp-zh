    这是 Lars von Trier 的年度教程，我们将讨论 `STM32` 的命名，并将介绍引脚定义以及该微控制器 `MCU` 内部的寄存器。


    ### 命名结构


    通常你会发现以 `STM32` 开头的 `STM32` 名称，就像这里一样。在这个区域，你可以看到有 `STM32`，这通常是你查看 CPU 时发现的第一个东西。现在，你要看的是字母
    `F`，它基本上代表产品类型，后面通常跟着一个数字。这个数字具有指示意义，例如，让我们来尝试弄清楚这个 `MCU` 的命名机制。假设我们有一个名为 `STM32G431RB`
    的微控制器。这是一个很长的名字。它以 `32` 开头，代表 `MCU` 和产品类型。


    ![](img/image_rsrc1PK.jpg)


    现在，它后面通常跟着三个数字：例如用于执行的 `L`，或者你可能会发现四个数字。在这种情况下，我们有四个数字，这个 `4` 后面跟着 `31`。现在这基本上是设备的子类别，后面跟着引脚（`PIN`）数量。所以这里我们有一个。这是一个引脚数量。为了知道你有多少引脚，你可以参考这个标签，这是一个
    `64` 引脚的 `MCU`。这取决于这三个数字之后的字母。好的，那么那个字母 `B` 是什么？它基本上是内存或闪存的大小，这里的 `B` 代表 128 千字节。这就是你如何轻松地读取你的
    `STM32` 名称的方法。


    有时候名称后面还会跟着两个数字。这些是封装类型。第一个是封装类型，第二个是温度。但通常这又是整个名称，以 `STM32` 开始，然后是产品类型 `G`，接着是设备子系列
    `451`，然后是引脚数量（第一个字母）、闪存大小（第二个字母）。所以，每当你看到一个 `STM32`，你都要尝试读取这些数字，尝试弄清楚这个 `MCU`
    有多少引脚，以及该 `MCU` 的闪存大小有多大。


    ### STM32 引脚定义


    现在，如你所示，这是 `LQFP64`。它有 `64` 个引脚。识别这些引脚很容易，我会教你如何做到。


    现在，在开始之前，你需要理解几点。第一点是每当你看到 `PE` 时，它代表端口 E。每当你后面看到 `A`、`B`、`C`、`D` 时，这就是端口。所以这里有
    `PC7`，意味着 `PORTC7`；这里有比如 `PA12`、`PA5`、`PB5` 等，你可以将其与任何其他引脚一起使用。


    现在我们在电源上还有 `VDD`。我们有 `VSS` 作为地。如果你想连接电池，就有 `VBAT`。我们还有 `NRST`，你可以在那里连接按钮来重置微控制器。我们还有
    `VDDA` 和 `VSSA`，它们具有相同的电源引脚。另一个 `VDDN`，这基本上就是全部了。我们既有零引脚，这个引脚用于控制我们 `MCU` 内部的启动机制。你可以检查其他配置，正如你在这里看到的，我们有一个
    100 个引脚的 `LQFP100` 封装，如你所见，它以 `L` 开头接 `100`。它有更多的 `VBAT` 引脚以及所有不同的引脚。


    ![](img/image_rsrc1PM.jpg)


    这里有带有电源引脚的 `VBUS`，我们有 `VDD`、`VSS`、`PORTA`，这里有 `PORTB`、`PORTC`，这是板子。它有更多的支持、更多的引脚，如果你有很多需要接口和连接的输入输出，它是适合的。


    现在是其他几个部分的列表。`STM32F4446` 的映射。如你所见，名称是 `AF101`。现在这是地址，这些是连接到该地址的外设。这里有通用输入输出（GPIO），它意味着通用输入输出引脚。这是端口，即
    `GPIOA`、`GPIOB`、`GPIOC`，它包含所有这些端口。这两个地址留给设备制造商。这些是定时器。这一个用于 `SPI1` 通信。这些用于 `ADC`。这些是用于你的
    `UART` 通信。随着课程进行，你会看到更多模块，如 `I2C`、`SPI2` 和 `RTC`-`TIM4`。这些是定时器，这里我们有一个数字转换器。在这里我们可以看到我们的通信协议，每一项都有它自己的边界地址。这些每一个外设都通过总线连接到我们的主
    `MCU`。


    现在，一些重要的且你需要了解如何配置的大型通用输出寄存器将在下节中解释。本节就此此。我们解释了引脚定义，以及如何知道这些中每一项可以做什么，以及如何识别引脚以便你轻松地连接它们。


    ### STM32 中的某些 GPIO 寄存器


    我们将讨论的是 `STM32` 中的一些输出寄存器。我们有这些寄存器的地址，这里是基地址。所以这里有这些寄存器的地址，这是你在使用 C 语言时使用的名称。


    每当你看到 `A`、`B`、`C`、`D`、`E`、`F`、`G`、`H`、`I` 代表端口。现在我们有 `MODER`，它是模式寄存器。它是通用输入输出模式或方向，控制它是输入还是输出。现在我们有
    `PEEDDR`，它是通用输入输出类型寄存器。它配置我们想要发送的输出类型。如果你将引脚作为输出，可以使用此寄存器配置输出。


    现在，某些引脚可以用于高速数据传输，因此有 `OSPEEDR`，意味着输出速度寄存器。这用于控制输出速度，我们的 `MCU` 内部有上拉和下拉电阻。某些引脚支持，另一些不支持。所以为了控制这个，如果你希望该电阻上拉或下拉，你需要使用这个。它是
    `PUPDR`。这些是上拉/下拉寄存器。


    现在有一个端口 `IDR`，它是输入数据寄存器，控制你使用 `MCU` 读取的输入数据。还有一个 `ODR` 输出数据寄存器，控制你通过 `MCU` 发送的数据。还有一个
