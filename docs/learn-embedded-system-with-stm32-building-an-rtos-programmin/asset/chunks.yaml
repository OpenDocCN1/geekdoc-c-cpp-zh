    `7`。在项目管理窗口的高级设置中，将硬件抽象层更改为低级（`low level`）。在工具链中，选择 `Makefile`。栈（Stack）和堆（heap）说不应更改，然而，即使你更改了，也不会影响工程代码操作。给项目命名，选择其位置并点击红色按钮。现在我们的模板已经准备好了。我们将在下一节继续编写代码。


