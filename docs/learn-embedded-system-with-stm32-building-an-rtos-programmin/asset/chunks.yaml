    `identity`。当我运行它时，这个变量将获取 `potentialmeter_pina` 的数据。


    当我将 `potentialmeter` 拨动到下一个值时，由于 `ADC` 的存在，最大值约为 `4096`。最大十进制值可达 `0xFFF`。它现在连接在一个树形结构上，值为
    `4096`。当我将其拨回 `0` 时，它会给我们一个 `10` 左右的值。你可以看到结果一直在变化，因为输出非常稳定。即使有细微的变化，你也能检测到，且值会随之改变。


    ## 中断服务程序 (ISR)


    回到代码来理解它是如何运行的：第一行代码是 `config`。它用于每毫秒生成一次中断。中断的名称是中断系统处理程序的名称，即 `Felix`。你不能将其更改为其他内容，因为这是中断服务程序。这是我从网站上获取的
    `config` 函数；它配置系统每毫秒生成一次中断。


    ![](img/image_rsrc1T1.jpg)


    这是中断处理程序的名称。我还使用了软件组件服务。


    ## ADC 时钟与频率配置


    接下来的代码级是配置 `ADC` 预分频器。频率不能超过 `14MHz`。我的开发板频率为 `72MHz`，但我不能使用 `72MHz`，因为 `ADC`
    的时钟频率不能超过 `14MHz`。因此，我必须为提供给 `ADC` 的时钟使用分频器。


    根据 ADC 介绍中的数据集，`ADC` 输入时钟不得超过 `14MHz`。在内存和总线架构中，你可以看到 `ADC1` 连接到 `APB2` 总线。我使用的是
    `AHB1` 和 `APB` 总线。`APB` 以全速运行，这意味着 `ADC1` 也在全速运行，因此我们需要使用分频器。


    我需要进入 `第 8 章：RCC_CFGR` 中的 `RCC_CFGR` 寄存器。你可以根据微控制器的速度来配置分频器。由于时钟是 `72MHz` 而我们需要
    `14MHz`，所以我将其除以 `6`。你可以通过右键点击并转到定义找到此定义；它定义在这个头文件中。


    ![](img/image_rsrc1T2.jpg)


    ## 启用外设时钟


    此行代码启用 `ADC1` 的时钟。每个外设都需要时钟才能运行（例如 `USART2`、`I2C`、`SPI1`）。要启用时钟，进入 `第 8 章：RCC_APB2ENR`
    中的 `RCC_APB2ENR` 寄存器，这是外设时钟启用寄存器。每个位分配给不同类型的外设。


    我们需要启用 `ADC1` 位。通过写入 `0x2000`（二进制为 `0010 0000 0000 0000`），我们启用了 `ADC1`。


    ## GPIO 配置


    接下来两行用于启用并配置 `GPIOB`。`GPIOB` 被配置为输入引脚。我们使用寄存器来配置 `GPIOB` 引脚 `7`。你可以在 `第 9 章：GPIO
    问题` 中找到细节，特别是 `GPIOB` 块中的 `GPIO_MODER` 寄存器。该寄存器控制从 `0` 到 `P7` 的引脚。


    我们需要配置这些位。初始，`P7` 的值为 `0100`（二进制），意味着第二位被设置。我们将值更改为 `0x21000` 以配置所需的模式。


