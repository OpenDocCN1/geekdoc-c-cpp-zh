    # CMC 与板级支持层


    CMC 是一种标准的接口方式。你的板级支持文件有效地作用于你的代码，使得所有接口都标准化了，因此制造商在编写所有的板级支持文件和硬件抽象层时，使用的是与硬件以及
    CMC 通信的方式，而你只需要编写自己的代码（即这个你看不见的空白文件）来与 CMC 通信。因此，我们使用了这个名为 `CMC` 的中间层，正如你在之前的幻灯片中看到的那样，以便将一切都连接到它。这就是为什么
    `CMC` 非常有用，而且，它确实能够为你节省大量、大量的时间。


    ## 板级支持包 (Board Support Packet)


    说到板级支持包，按钮上也有板级支持包。现在这块板上只有几个按钮，你可以在这里看到它们。我们有一个复位按钮，它连接到微控制器的复位引。所以我们不会按它，或者我可以按一下给你们看看它是如何工作的。


    我们还有一个用户按钮和唤醒按钮，它们周围有一些电路。我会过一下这里的电路，但基本上，这是一个用户按钮，用于切换我们 LCD 的开启或关闭状态。好的，这里说这个按钮叫
    `button_a`，但按钮 A 就是用户按钮。


    现在我要给你们展示的是如果我按下这个按钮会发生什么。你可以看到这里，这其实就是用户按钮，你可以在这里看到。我将使用我另一个特殊的按键工具——也就是我的手指，因为这样更容易。你可以看到当我按下这个按钮时，实体会停止闪烁。所以实际上你可以看到停止闪烁，按下按钮，我再按一次它又开始闪烁，我再按一次它停止闪烁。


