    然而，通常你会发现人们想要一个操作系统，是因为实际上我们现在拥有了非常快的处理器，而且成本非常、非常低。开发一个不使用操作系统的产品的成本，将高于支付额外费用来购买性能稍微强大一点硬件的成本。从长远来看，这在经济上是不可行的。因此，尽管你可以直接进行“裸机”开发，你也会倾向于使用操作系统，因为你的开发成本会更低。


    我的第一个双项目是创建某种管理音频放大器的设备，我们实际上所做的是：好吧，让我们在这里投入一点更昂贵的压力（硬件），这样我们就能放下一个操作系统。至于这个处理过程比不使用操作系统要多花一点点钱这并不重要，因为实际上，快速开发和安全地管理进程带来的收益，远大于支付略高且更昂贵硬件的成本。


    一个艺术家并不会直接创建一个实时且安全关键的应用程序。你必须知道如何运用艺术来让安全关键型应用程序在定义的时间内运行。例如，如果我穿了一件园艺师的衣服，我就去学了园艺，但这并不会自动让我成为一名园艺大师。园艺是一门艺术，需要付出很多努力才能精通。正如创建适当的实时操作系统以及创建在定义时间内运行的实时操作系统应用程序是一门艺术一样，这需要大量的时间来精通。


    # CMSIS RTOS API


    在本节中，我们将探索 CMSIS 是什么，这些 API 是起什么作用，以及我们将在整个课程中如何使用它们。本课程解释了实时操作系统，并以 `arty x5`
    操作系统作为示例。`RTOS` 是该操作系统的版本名称，而 `CMSIS` 是 ARM 版本的 API，然后我们在 `STM32F4` 系列的 `cortex`
    及其微控制器的语文中使用它们。这里值得说的是，正如你在之前的幻灯片中看到的，`CMSIS` 作为 `Cortex` API 同样适用于其他类型的设备，例如
    `cortex A` 设备。而且，我们并不限于 `cortex`，它实际上可以在 `cortex M7`、`m3m0+` 以及整个系列上运行。


    所以 `CMSIS` 的本质是什么？这些 API 就像一个遥控器，立于我们上层的应用程序代码与运行在实际微控制器上的 `RTOS` 操作系统之间。因此它基本上在操作系统和我们程序员编写的应用程序代码之间提供了一个抽象层。所以我们将编写的所有代码都将为了与
    `CMSIS` 作为 `RTOS` API 接口，然后 `CMSIS` 的 API 将与 `RTOS` 操作系统接口，最后 `RTOS` 操作系统再与硬件接口。由于这种编程方式，这一切实际上都是以一种非常高效的方式发生的。所以它实际上非常快。是的，你将直接访问内存位置和微控制器的实际内存，以便在你需要时从应用程序代码中对其进行直接操作。


    然而，`CMSIS` API 以及运行在设备上的实时操作系统为我们提供了一些更高层次的功能，我们将在课程的后半部分探索这些功能，你将看到当我们为微控制器和嵌入式实时系统编程时，这些功能是多么有用。所以这个
    `CMSIS` API 代表应用程序编程接口（Application Programming Interface），你真的可以把它想象为一个遥控器，它允许你使用一组标准化的和标准化的控制
    set 来访问实时操作系统内部的内容，即一组已经写好的标准函数，你只需要学习这些函数，而不需要学习操作系统的复杂细节以及它的具体运作原理并深入研究。


    ![](img/image_rsrc1MW.jpg)


    所以实际上这个 API 是与硬件无关（agnostic）的，因此 `CMSIS` API 是硬件无关的。这意味着在你的硬件中，运行 `FreeRTOS`、`ArtifactRTOS`
    或任何其他你喜欢的实时操作系统并不重要，只要它与 `CMSIS` 作为 `RTOS` API 兼容，并且你编写的代码与该 API 兼容，就可以了。它将能够运行，完全没有问题。


    现在 `CMSIS` API 提供了版本 2，它为以下类型的构造提供了 `CMSIS` 类型封装器：

    - 线程管理（再次，我们将在整个课程中更详细地探索线程以及如何管理它们）

    - 信号（signal）

    - 事件（events）

    - 互斥锁访问（mutex access）

    - 信号量（semaphore）


    再次，我们将通过操作你的内存池、队列等许多内容来详细讨论这些内容。这些就是我们在课程的这一部分将涵盖的内容。我们将解释其中某一项是什么，它是如何工作的，以及操作系统如何帮助你直接操作它们。


    # 内存池 (MEMORY POOLS)


    现在让我们谈谈内存池的概念以及我们为什么需要它们。内存池是线程安全的内存区域。在这里，我们像之前请求的那样有四个不同的线程，这些线程对内存中自然存在的数据执行操作。现在，这些线程并不一定在特定的数据位上执行操作，可能会在多个数据位上执行操作。一个线程的这些操作可能会在另一个线程同时操作的内存位置上运行，导致数据损坏或数据读取错误。我应该说，除非你以粗心的方式从线程操作数据，否则通常不会发生这种情况。操作系统通常会处理这些此类问题。然而，有方法可以进一步控制这一点，这就是显式内存分配，即内存自然存在于硬件中。


    ![](img/image_rsrc1.jpg)


    现在，为了防止这种线程使用不属于它们的母内存部分的情况，实时操作系统创建了虚拟内存池，通过隔离内存和保护对独立内存位置的访问来指令独立和潜在相互依赖的任务。因此你的操作系统实际上会创建一些安全区域，并确保一个线程不会访问另一个线程正在使用的内容等。所以你的操作系统为你做了很多工作，你不需要去担心它。相信我，如果你尝试让代码在没有操作系统的情况下运行，你就必须担心这类问题，而这并不是件令人担心的事情。线程内存往往是隐式实现的，所以你并不经常需要担心它。然而，在偶尔你可能需要担心它，这些场合可能是你直接操作内存或从内存映射
    I/O 等设备读取内容。所以你有了 `CMSIS` API，它充当你的遥控器。喜欢我程序图标的程序员在这里，基本上通过 `CMSIS` 得到了一个艺术 API。你实际上可以操作内存。更有趣的是，我们将在课程后面会看到，我们实际上可以如何使用操作系统，以及操作系统与你的集成开发环境（IDE）的集成来设置这些东西。这非常有趣。


    # 信号量 (SEMAPHORES)


