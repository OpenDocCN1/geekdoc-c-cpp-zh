    本节介绍了一个用于我们内部城市代码结构和描述的项目。沙特驻古巴大使 Max 生成了一个项目模板，其中包含以下文件：Mansi 主页（以及你看到的 Iasi）、`NCAR`
    页面和 `Makefile`，以及一个类似的 `start up` 脚本、一个包含中断处理程序的文件、一个包含特定系统函数和调用栈以及外设驱动程序的系统文件。`NSCLC`
    文件包含编码器的函数。为了保持条洁并将逻辑集中在一个处，中断处理程序已移动到 `NCAR` 文件中，此 zip 代码库将不会在本课程中介绍。重要的外设驱动程序将在某种程度上进行解释。


    ![](img/image_rsrc1MB.jpg)


    现在让我们来看一下固件算法。在顶层，固件由几个函数组成。上电周期或硬复位会导致固件从 MCU 闪存器中的此特定地址开始执行，而该地址就是中断向量表所在。如果我们打开并汇编
    `start up`，可以看到中断向量被分在不同的部分，第一部分包含系统异常，第二部分包括系统中断。这两个部分之间的主要区别是，异常与 ARM Cortex
    CPU 内核有关，而中断则由微控制器外设驱动。系统可访问空间中有一个跟踪器，最终跳转到汇编文件中的某个位置，该位置标记为 `reset handler`。在这里，指针寄存器被初始化。该指令将该常量加载到此检查寄存器中。请注意，汇编语言是不区分大小写的。


    ![](img/image_rsrc1MC.jpg)


    你可能之前已经注意到，这里的这一点是，该常量位于异常向量表中该向量之前。如果你打开 `Lincoln script`，你会发现该常量值以十六进制形式表示为
    `200000`。该常量代表状态器所在的 RAM 地址。然后程序调用系统 `main` 函数。从 `main` 函数开始，程序调用 `NSC` 协调函数，该函数初始化了系统时钟、硬件定时器和中断。在图图中，能量
    I 控制器的初始化是分开显示的，但在代码中，`GPO` 的函数包含了 `X. want` 中断的 ADC 逻辑。最后，调用 `time`。


    ![](img/image_rsrc1MD.jpg)


    用于定时器的函数。这种代码编写有助于将所有必要的中断保持在一个处，每个外设都有相应的函数。然后主程序跳转到无限 `while` 循环。然后你会看到固件包含了中断处理程序，外部中断处理程序和定时中断处理程序，`NSC`
    解码固件完全是中断驱动的，对于其未来集成到现有代码中非常有益。此外，中断可以在 `NSC irh` 中断时为它们分配优先级。


    ![](img/image_rsrc1ME.jpg)


