    # 开漏输出（Open Drain）配置与分析


    当 `V` 等于 `1` 时，假设你将 `V` 设置为 `0`。这个东西最关键的是，它更具体、更具体，并且将其设置为 `0`。这个 MOSFET 将处于关闭状态，因为相对于
    `S` 的栅极电压为 `0`。所以它不会导通，相反，它会关闭。现在你可以假设这里的这条线，可以假设这里的这条线实际上是断开的。所以，当这条线被断开时，引脚（pin）实际上是浮空状态，什么都没有连接。所以当它处于悬连接状态时，如果有电磁噪声之类的，这种噪声会影响输出。


    所以 PE 意味着地电或高电平。我们称之为开漏。假设它不是高电平，且 MOSFET 在开启时是开启的。当它导通时，整条线实际上——你可以假设这个实际上是连接的，`pin`
    实际上被拉到地，连接到地，因为它把它拉向地。所以只有两种状态：一个是低位状态，另一个是被拉低。这取决于你在寄存器中设置的位。因此我们可以结论，我们只能通过设置
