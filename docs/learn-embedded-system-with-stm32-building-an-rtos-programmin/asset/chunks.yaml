    `PC 13` 引脚，并从此列表中选择你需要这个引脚执行的功能。在我们的案例中，我们需要它控制 LED。因此它将是我们的通用输入输出引脚输出。现在还有其他选项，如
    `input`。有 `RTC out`、`RC tamper` 或 `set status`、`analog pen event out` `input output`、`external
    interop 13` 或任何其他功能。一旦你配置了引脚，你会发现引脚现在变成了绿色。让我们谈谈你可以点击引脚来查看复用功能的内容，任何这些引脚都有复用功能，你可以点击它来查看这些功能的列表。


    现在，如果你看到橙色的引脚，这意味着外设设备未启用，只有引脚被分配了。现在，当外设未启用时，会出现这种情况。我们现在会谈论。如果你在上面看到，这意味着 `MCU`
    必须使用引脚图标冻结信号位置。因此信号现在是通用输入输出输出。这就是为什么这里有一个引脚。有时你需要连接良好但它是不可用的。如何检查这一点呢？你可以进入 `Pins`，如果官方名称或配置名称旁边有一个红色圆圈，你就知道它已被占用，无法使用。


    这些都是你使用此 `MCU` 时可能遇到的所有陷阱，正如你所看到的，你有菱形，你有 `RTC`，你有 `ADC`（这是我们的数字转换器）。你有不同的连接协议。`CCSI`
    你的 UART 以及 `can bus` 加上 `USB pass`。还有 `CRC` 计算功能，那是中间件，比如用于优化的三个小时库。这些是你可以分配的主要功能。随着更多引脚被最终功能保留，其他外设的剩余配置选择就会减少。局限性通过图标变化和其他外设节点指示。


    左键点击引脚以显示它的复用功能，正如我们已经提到的。现在，如果你想右键点击引脚，你可以为它命名或选择引脚分配，这样你可以引入我们的标签。在这里你可以看到 Glemp。正如你所看到的，通过右键点击该引脚，你可以进行信号重映射、引脚叠加或简单通过右键点击该引脚重命名。如果选择了引脚输出但没有启用特定的外设，或者引脚输出有任何其他问题，引脚将变成橙色而不是绿色。在这种情况下，你必须检查文字或错误消息。


    现在，在继续之前我们需要谈论的另一件事是外设模式有三种或四种可能的状态。有 `disabled` 状态，该模式不可用，因为需要设置另一种模式。将鼠标指针悬停在模式上以查看原因。它可能需要一个禁用的时钟源或其他外设依赖项。也就是说，`limited`
    模式在受限的情况下可用，所以它向你显示该引脚在受限的情况下可用，因为某些选项被冲突阻塞了。例如，`USART` 可能无法配置为同步模式，因为所有可选择的引脚都已占用。


    ![](img/image_rsrc1R9.jpg)


    还有一种模式，该模式需要一个信号但无法创建。对于这一点，例如这个 Milkha，如果一个关键信号的所有复用引脚都被其他外设使用。现在信号可以直接从引脚输出视图中设置或移动，基本上就是这个视图，你可以点击
    `PIN` 显示可能信号的列表并选择一个。这适用于没有分配外设的通用输入和输出引脚。没有必要手动设置所有未使用的引脚，直到有一个半自动步骤来完成（它会执行此操作）。所以你可以忽略未使用的引脚，因为代码生成器可以将它们设置为低功耗并分配。引脚输出配置到此结束，我们将在下一节中谈论外设和中间件配置。


    ## 外设和中间件配置


    来谈谈外设和中间件配置。现在，你的全局视图，外设和中间件基本上是可以配置它们的地方，如果你切换到我们的 RCC 视图和系统视图，你可以看到我们有一个下半部分和一个外设部分。在这里你可以看到系统，我们有
    `UART`，我们有通用输出，我们有 `NVIC`（嵌套向量中断控制器），我们有 `RCC`（这是时钟和控制），我们有 `ADC`。此外设已正确配置，你可以使用当前值生成代码。现在，这个绿色符号有三或四种类型。如果你看到这个绿色符号，意味着它是……如果你看到一个感叹号，意味着它没有配置。


    ![](img/image_rsrc1RA.jpg)


    如果你看到黄色矩形，意味着存在未定义的问题，但你可以生成代码。如果你还有一个 `X`，即添加的 `X`，意味着存在错误。现在，这里是你快速切换 `Pinout`
    视图和系统视图的地方。这意味着配置是有效的，因为我们有一个绿色勾选。现在你可以点击来配置 `GPIO`，你可以添加，但我们现在还不做这个，这里还有通用输入、输出和配置。如果你配置了某些内容，正如你所看到的，该外设已配置。如果你没有配置任何内容，没有添加任何引脚，你可能会看到黄色矩形。但这不是错误。现在可以生成代码。我们我们拥的一切，一旦你点击其中任何一个，你都可以轻松地配置。现在我们谈谈分离配置，主窗口的配置选项页提供了所有可以配置的硬件和软件组件的概述，CubeMX
    可以帮助设置。每个可以访问配置选项的按钮都带有一个小图标，指示配置状态，默认状态是未配置，例如你可以点击外设或中间件的按钮显示它的配置，就像我们在这里做的那样。现在，即使配置正确，也可以进行进一步修改。正如你所看到的，这个是正确的，但我们仍然可以进行更多配置。警告符号提供了错误配置的通知，如果在此状态下生成代码，外设将无法工作。


    ![](img/image_rsrc1RB.jpg)


    现在，严重错误由添加的 `X` 表示，必须修改配置继续添加更多外设和组件。你可以返回 `Pinout` 标签页，在这里你可以点击并添加，或者简单地点击任何可用的外设。在这里有中间件。现在，在阅读它们后，你可以从它们的系统视图或此菜单中配置它们。现在我们这里没有任何中间件，但每个中间件软件组件的选项都是不同的。但它们都以类似的方式呈现，让你易于访问初始化选项并提供信息性描述。所以每当你添加新的中间件时。你都会发现它拥有像任何其他配置页一样的选项，并且你可以配置一切。

