    # 我将教你如何下载并安装 STM32 Cube 开发环境


    该开发环境免费在线提供。你所做的就是编写 `STM32`，32 岁。Idea 或开发环境，现在这是第一个结果，即 `STM32 cube idea`，它代表集成开发环境（IDE）。这是一个先进的
    C++ 开发平台，具有强大的配置代码生成功能（编译），以及针对 `STM32` 的调试功能。


    ## 下载过程


    直接进入下载页面，在这里你可以找到所有的功能和不同的版本。现在，如果你有 Linux，可以下载该软件。如你所见，我们有深度、巨大的 Kleenex 安装程序、一个
    knockwurst 版本、适用于 Linux 的 `R.P.M.` 版本，以及 Windows 安装程序。由于我使用的是 Windows 操作系统，我将下载
    Windows 安装程序。如你所见，最新版本是 `1.6.1`。如果你对其他版本感兴趣，可以点击这里从列表中选择不同的版本，我们通常推荐下载。


    ![](img/image_rsrc1P7.jpg)


    最新版本修复了 bug 并包含许多功能。点击“获取软件”。这是许可协议，你必须接受它才能免费下载软件。点击“接受”。现在他们将带你进入软件页面。该页面的主要目的是获取你的姓名、姓氏和电子邮件地址，以便向你发送公告、新软件发布及其他内容。你可以填写你的名、姓和电子邮件地址，然后点击。勾选“我已阅读并理解条款”。如果你想获取软件未来的更新信息，可以勾选此项。完成后，点击“下载”。它将引导你进入该下载页面，如你所见，你的请求已成功提交。现在，通常你会收到一封需要验证电子邮件地址的邮件。一旦收到邮件，你就会发现一封开始软件下载的邮件，其中包含下载链接。只需点击“立即下载”，你需要使用相同的浏览器。现在，你的下载将开始，你会得到一个文件。这就是你得到的文件，通常是一个
    zip 文件，所以你必须使用拥有的任何软件对其解压，如果没有，可以下载一个。


    ![](img/image_rsrc1P8.jpg)


    ## 安装过程


    这是一个免费软件工具，文件只需解压即可。完成后，你将得到这个文件夹，里面有一个双击运行的文件。你的安装程序将启动。Zarkasih 现在只需点击“下一步”、“我同意”、“下一步”、“已选定”。如你所见，这将解决驱动程序处理问题。这被认为是一个驱动程序问题。现在正在解压并安装文件，点击“安装”。现在过程不会花费太长时间，如你所见，它将不断解压文件并将它们安装到你的
    PC 上。


    为了确保你知道我们正在安装什么，它基本上是 `STM32 cube idea`，这是一个全合的多功能开发工具，是 STM32 cube 软件生态系统的一部分。它基本上是一个先进的
    C++ 开发平台，具有配置代码生成、编译功能，以及针对 `STM32` 微控制器和微处理器的功能。它基于 eclipse 框架和 C 工具链进行开发。


    ![](img/image_rsrc1P9.jpg)


    它允许集成成百个现有的插件，以完善 eclipse idea 的功能。作为 Cube 的大使，Ali 将 `STM30` 的配置和项目创建功能集成到 `cube
    mix` 中，以提供全合的工具体验，并节省安装和开发时间。现在，在选择了一个空的芯片、`32 MCO` 或 `MPU` 或已配置的微控制器或微处理器，或者从选择开发板或选择示例后，项目和这个
    idea 将被创建并初始化，它将帮助你生成代码。在开发过程中的任何时候，都可以返回外设和中间件的初始化和配置，并重新生成初始化代码而不对用户代码产生影响。这个软件非常棒的地方在于它结合了
    `STM32` 的代码生成、代码编译和调试功能，而这正是我们在本课程中学习的内容。我信你将开始使用这个平台开发你未来的许多项目。所以，你需要的是按照我们的步骤，让该软件在你的机器上运行起来。


    ## 运行软件


    如你所见，解压和安装过程即将完成。现在我们完成了，只需点击底部的完成。现在，你可以从开始菜单或桌面图标启动软件。只需点击开始“`attempted to cube
    Ivy`”。这需要几秒钟来加载。现在你选择通过“作为工作空间”作为 Cube idea 的回答，即使用工作空间目录来存储其偏好和开发产物。现在，你需要将这些内容存储在一个万一发生问题时可以找回的地方。因此，我们不建议使用安装
    Windows 操作系统的主盘来存放工作空间，只需浏览并进入另一个目录，如 `E` 盘并命名为 Justin 或 expect。只需点击“选择文件夹”。即可。现在你可以选择此选项：“将其作为默认值”或“默认并再次询问”，这样你就不会每次打开软件时都看到这个消息。


    ![](img/image_rsrc1PA.jpg)


    现在，启动 answer Cube Ivy。就是这样。现在你有了 idea，你可以启动一个允许访问的新项目。现在点击，“是”，你可以在这里启动 `STM32
    project`，或者如果你已经有了之前的版本，可以从现有邮件启动新项目，或者你可以随时导入你的项目或示例。现在，这些是支持和社区链接。这些是 Sandrone
    32 工具。这些是应用工具，这些是 `SDM 32 Wiki` 和 `MCO wiki` 的一些快速链接，外加文档和入门指南。


