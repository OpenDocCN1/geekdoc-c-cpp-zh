- fmt: '

    # Let''s start analyzing what an artist is and what it does


    `Artist` stands for real-time operating system. The very quick and dirty, if you
    will definition of a real-time operating system is that it does the right thing
    at the right time; otherwise things go terribly horribly wrong.


    Examples of real-time operating systems can be found in many places. In fact,
    if you are looking at the screen at the moment which I think there is a quite
    high likelihood that you are doing, well behind the scenes on your screen there
    should be a microcontroller, and that microcontroller is more than likely using
    a real-time operating system for doing its thing. Well, it could be other things
    in there as well, and if you have a wireless mouse, it will have an operating
    system. And if it has an operating system, it will be a real-time operating system
    as well.


    ## Types of Real-Time Systems


    There are different types of real-time systems. If you''re looking at a fighter
    jet on the screen, the interesting thing there is that if something goes horribly
    horribly wrong with that fighter jet, it is possible that it will fall out of
    the sky or it will do something silly like firing a missile where it shouldn''t.
    He''s quite well equipped; normally fighter jets are quite well equipped with
    missiles.


    Real-time operating systems effectively come in different flavors of "real-time
    ness" if you will. There are different types of things that can go wrong when
    you''re using a real-time operating system. If you have a real-hard-rating system
    for a fighter jet, you will have to architect your system in a different way rather
    than if you have a real-time operating system for something like a washing machine,
    a mouse, or your light bulb.


    There are quite a number of things that can go horribly horribly wrong if you
    have a fighter jet. However, if your light bulb turns on 10 milliseconds later
    than normal, then it''s fine. But if, for example, a fighter jet does something
    10 milliseconds later than it should do, it might follow this guy and that''s
    not fine as you might think.


    So yes, you can use a real-time operating system, and there are many real-time
    operating systems. It is in fact possible to create a real-time operating system
    and make it operate in a non-real-time manner. That means that it will generally
    work, however, the timing tolerances as to when the reaction time is complete
