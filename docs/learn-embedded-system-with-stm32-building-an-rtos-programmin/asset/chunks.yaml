    # ADC 配置与序列管理


    这行代码设置了我们要使用的 `ABC` 通道数量。由于我们只使用 `Channel 7` 将空值转换为存储值，因此 `ABC` 通道的数量将为 `1`。


    你可以查看 `ABC` 序列寄存器一，可以看到对于 `B23` 到 `B20`，这些是用于设置要使用的通道数的位。它被写入 `L`，表示通道的长度。默认情况下，该寄存器的重置值为零，因此该值将为零，这就是为什么我们不需要设置任何内容。将此设置为零意味着你将进行一次转换；我们只有一个通道。


    ## 序列寄存器


    序列寄存器用于安排通道转换的顺序。由于我们只使用一个通道，将在序列寄存器一中设置 `Channel 7`。这些是我们将用于 `20` 的五个位。如果你使用
    `Channel 7`，我们就在这些位中填入 `7`。


    例如，如果你使用两个通道（PIN 6` 和 `PIN 7`）进行 ADC 转换，并且有一个电位器需要读取。你需要两个通道，并将这里的 `L` 设置为 `2`。在序列寄存器中，你根据转换优先级来安排通道。如果你使用
    `Channel 6` 和 `Channel 7` 并想先转换 `Channel 7`，你在这个序列中放入 `7`。之后，对于 `Channel 6`，你将在下一个序列位中放入
    `6`。


    序列允许你安排先转换哪个通道，而 `L` 则设置转换的总通道数。这些是不同的功能。目前，由于我只使用 `Channel 7`，我将 `B0`、`B1` 和
    `B2` 设置为 `111`，这等于 `7`。在代码中，第一个位代表 `bit 0`，第二个代表 `bit one`，第三个代表 `bit two`。通过将
    `bit zero`、`bit one` 和 `bit two` 设置为 `one`，我们在序列寄存器一中表示了 `Channel 7`。


    ## ADC 激活与电源管理


    此行没有使用扫描模式位，因此将不再进行解释。该位首次启用 ADC 并将其设置为 `continuous mode`（连续模式）。对于 ADC，我们需要在转换开始之前开启两次。


    我们进入 `control register`。`bit zero` 和 `bit one` 分别用于 `ON` 和 `continuous`。如果 `bit
    zero` 的值为 `1`，它会将 ADC 从掉电状态唤醒。在这行代码执行之前，ADC 处于掉电模式。当你将此位设置为 `1` 的一刻，它就会唤醒。然而，转换尚未开始。


    当该位也变为 `1` 时，转换开始。我们开启 ADC，然后延迟 `1 millisecond` 再次开启 ADC。这种延迟是必要的，因为应用程序应该在上电和转换开始之间留出“时钟步进”延迟。第一次激活是上电，第二次是开始转换。第二次开启会触发该过程。我使用了
    `1 millisecond` 的延迟，但你可以尝试微秒级延迟，以寻找 `ABC` 所需的最小延迟。


    ## 校准


    我们将 ADC 设置为 `continuous mode`，以便转换连续进行，而不是在一次转换后停止。开启 ADC 后，我们必须启用校准。在开始校准之前需要延迟，因为文档说明在开始之前，ADC
    必须处于开启模式至少两个 ADC 时钟周期。


    一旦 ADC 开启，`ADONB` 将变为 `1`。延迟后，我们执行校准。虽然我不确定毫秒延迟是否绝对必要，但它确保了数据更好的准确性。校准位设置在控制寄存器中。一旦启用校准，我们必须等待硬件完成该过程。只要校准位为
    `1`，我们就一直保持循环状态。一旦它变为 `0`，校准即完成。


    ## 中断处理


    当转换结束时，如果已启用，则触发中断处理程序。转换完成后，程序将跳转到此处理程序。我们检查 `status register`，特别是状态位。如果 `EOC`（转换结束）位为
    `1`，我们从 `data register` 读取数字值并将其存储在变量中。读取 `data register` 会自动清除状态寄存器中的 `EOC` 位，防止中断服务程序针对同一数据被重复触发。


