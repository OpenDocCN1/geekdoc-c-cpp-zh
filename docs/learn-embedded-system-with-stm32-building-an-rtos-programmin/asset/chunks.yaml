    本节将解释如何全局启用中断并分配它们的优先级，该向量中断控制器或简单称为 `NVIC` 是 Cortex 处理器的高级中断控制器，与 Arm 架构紧密耦合，visi
    启用动态中断优先级排序和低延迟中断处理。`NVIC` 中断是抢占式的。这意味着高优先的中断将被 `visi` 尽可能地处理，即使一个低优先级的中断正在处理中。这意味着低优先级中断的上下文将自动推入栈中，直到高优先级中断完成。当高优先级中断帮助测试时，低优先级的正确上下文将恢复。对于我们的
