    这基本上是一个 Cortex 微控制器的软件接口标准。这就是 `CMS` 的含义。`CMS` 是一个独立于厂商的软件层，它用于导出和复用软件。为了更深入地理解它，你可以在这里查看细节：从用户到微控制器必须经过的不同层级。


    ### 软件层


    现在，让我们从第一层开始。如你在这里看到的，我们有应用程序代码，该应用程序代码基本上就是用户层。如果你看这里，这是该层的名称，因此应用程序代码将通过实时内核和中间件组件，其某些组件可能会一直穿过外设寄存器和中断向量定义，并到达设备执行功能。而有些应用代码可能会直接与外设功能通信。


    之后，你可以看到我们有 `OS`，它基本上是第二层。这基本上是位于应用程序代码和 `CMS` 层之间的实时内核和中间件组件。


    现在，我们在这里关心的层，也是主要主题，最后的一个是这一层，即第三层：`CMS` 基本上是一个包含核心特性函数、中间件访问函数、设备外设函数，以及优化的启动和中断向量定义的层。所有这些内容都在这一层内部。这就是为什么这是一个非常好的标准，使得软件和代码的通信与复用变得容易。


    这一层与 MCU 直接通信。MCU 层包含 `CPU`，它是任何嵌入式系统或嵌入式软件系统的核心；我们有这个 `bus`（总线），它是系统的核心。我们有 `NVIC`，它基本上是嵌套向量中断控制器，以及接口和其他外设。


    ![](img/image_rsrc1P3.jpg)


    所以，这一层帮助来自用户的应用程序代码与 MCU 或 `cortex CPU` 层进行通信。我们利用它来方便我们为 MCU 开发和编写代码。再次强调，这基本上是一个独立于厂商的软件层。这将有助于软件的移植和复用，这两点非常重要，你必须将它们记在心中。


    ### 文件结构


    现在，关于这一层的文件结构，它是从 `stm32f4xx.h` 开始的，这是主文件，它进入两个文件：`hal` 文件和 `system` 文件。`core`
    文件包含 `startup` 文件，而 `system` 文件。现在这就是文件结构。在这里我们解释这些每一个分支：


    - `stm32f4xx.h` 基本上是 `cortex M4` 全局声明文件。

    - `stm32f4xx.c` 是 `cortex M4` 全局定义。

    - 我们有 `stm32f4xx_hal.h`，这些是真正独立的文件，我们有 `device.h`，根据你使用的设备类型被包含在应用程序软件中。我们还有 `system_device.h`，这是设备特定的声明。我们有
    `system_device.c`，它基本上是设备特定的定义。


    所有这些文件都有助于初始化我们的 `CMS` 层。现在你可能会想：“我需要记住所有这些名字和所有这些东西吗？”很可能我们将要使用的开发环境会处理一切。你只需要创建一个新项目，大部分这些文件和定义都会为你创建好。


    ### ARM CORTEX M4 架构


    首先，你需要知道这个微控制器支持哈佛架构（Harvard architecture）。它拥有一套基于哈佛架构的 32 位架构，具有一些 32 位指令集，指令长度可以从
    16 位到 32 位不等。它具有从 `r0` 到 `r12` 的寄存器级，因为这些只是通用单元。它还有栈指针 `PC`（程序计数器）、`LR`（链接寄存器）和
    `xPSR`（程序状态寄存器）。


    它还支持支持高达 4 GB 的统一内存空间，通过基于 `arm aba` 的总线接口，该接口定义了通过片内总线微控制器模块之间的通信。那就是 `AHB`，高性能总线，用于连接总线主设备元素以减少延迟。还有
    `APB` 外设总线，它与外设之间是低带宽连接。


    此外 `NVIC` 控制器负责中断和异常管理，并带有优先级处理。它有一个系统滴答定时器（`SST`），这是一个 24 位的特殊定时器，并且针对低功耗进行了优化。有多种睡眠模式可供选择，我们已经提到过了。


    ![](img/image_rsrc1P4.jpg)


    现在，如果你快速看这张图片，你可以看到 ARM 架构设计的一个示例。这里的系统基本上就是这条总线。但在这里，蓝线连接了核心元素，如上方的处理器和 Flash
    闪存，但来自 `SRAM`（基本上是用于不同目的的不同类型的内存）也连接到该总线接口，而外设总线（我们刚刚提到的 `APB`）处理所有 MCU 外设的连接。这两个总线通道通过一个遵循
    ARM 规范、由主从机制管理的桥接器互连。你可以在这里看到 `bus bridge`（总线桥接）。所以它们使用这个总线桥接连接，但它们连接的是不同的元素。


    ![](img/image_rsrc1P5.jpg)


    正如你所见，这是系统控制器。这是处理器。这是总线接口、Flash 闪存以及来自 `RAM`，这些都是非常重要的部分，在与这些部分通信时无法承受任何延迟，但在与这些外设通信时也可以无法承受延迟。这就是为什么它们连接到一个称为“外设总线”（Peripheral
    Bus）的二级通道上。该总线连接到定时器、`RTC` 以及引脚和数字转换器，可用的话还有以太网控制器。所以你需要的是，在 ARM Cortex 架构内部有两个总线：一个是用于处理器的，另一个用于外设的。


    ### ARM CORTEX M4 内存映射


    我们提到过其他空间可以高达 4 GB，有时对于某些项目是较小的空间，而对于其他项目则这是一个很大的空间。现在，这是从这里开始的内存。你可以看到我们有一个高达
    500 MB 或 1 GB 的代码区域。这个区域主要用于程序，也可以用于异常向量表。正如你在这里看到的，这是起始地址。在它上方，你可以看到 `SRAM`，它具有相同且较小的内存，基本上是静态随机存储器。`SRAM`
    代表静态。


    现在，在那之上，我们有外设内存，主要用于如 `I2C`、`SPI` 和其他通信协议。


    ![](img/image_rsrc1P4.jpg)


    我们还有一个 1 GB 的外部 RAM，是可以寻址的。它可以高达 1 GB。它主要用于外部内存，用于存储那些不重要的数据。现在我们也有一个高达 1 GB 的外部设备内存，主要用于外部外设。之上，我们有系统内存，它基本上是私有外设，包括
    `NVIC` 和调试组件。现在有一个被称为“私有外设总线”（Private Peripherals Bus）的区域，它有一个私有总线 `APB` 和系统控制空间，即
    `SCB`。这就是在 ARM Cortex 内部这 4 GB 空间是如何分配在不同事物之间的。现在它有时是 4 GB，有时是 1 GB，取决于你使用的芯片类型以及该开发板的常规规格。再次，它可以累加到
    4 GB，这是一个你可以使用的非常特性。


    下载并安装 STM32CUBEMX IDE


