    # LCD 闪烁简介


    这一章节极其重要，因为我们将学习嵌入式软件工程师一生中可能最重要的一件事：如何让 LCD 闪烁。是的，亲爱的朋友们，这可能是我们在本课程中要做的最重要的事情。如果按照某种传统，就像你学习
    C 语言时，你学会的第一件事是写 "Hello World" 程序；那么，当你学习嵌入式编程时，我们要学会的第一件事就是如何让眼睛闪烁。这既极其简单，也极其复杂。


    因为它非常简单，所以我们将通过 STMCube 开发人员提供的一些现成代码来设置这个示例。所以实际上，这个过程会非常快。设置只需要不到一分钟，但可能需要很多时间来详细解释我们的软件内部到底运行了什么。我们将看到许多正在发生的不同现象、它们是如何运作的、是如何配置的，以及我们使用了操作系统的哪些功能。


    ## 闪烁的重要性


    首先，让我给你们讲一个小故事。我在英国和一位同事共过，他在英国的嵌入式系统社区非常有名，实际上他写过很多本关于如何使用这类设备的书——这里就不点道姓了，因为根据我刚才的话，你们可能已经推断出他的名字了。


    不管怎样，很久以前，他正在缝制一些东西。他对我说：“嗯，闪烁 LED 可能是嵌入式系统领域软件工程师做的最重要的事情。”他还开玩笑说，我们甚至可以举办一个比赛，看谁能找到最复杂、最迂回的方法让
    LED 闪烁。事实上，尽管我在课程这一节中向你们演示的方法相当简单，但你会发现它实际上利用了许多嵌入式系统概念，终并非那么简单。


    ## 环境搭建


    那么，让我们开始动手吧，让我们去设置它。首先要做的第一件事是像我这里一样打开你的 MicroCube。点击这里名为 `pack installer`（包安装器）的按钮，给它一两分钟时间加载。好的，这其实不需要等。你需要做的是在这里向下找到你尊敬的微电子设备，因为在这个示例中，我们将使用我桌上的板卡，它是一块
    `STM32F429`。我发现了一个套件，我们去这里，实际上我不想留在“设备（devices）”标签，我想去“板卡（board）”标签。


    ![](img/image_rsrc1N1.jpg)


    我要进入“板卡”部分，因为这里实际上有许多针对不同板卡的示例和包。让我们搜索诸如 `STM32F429` 这样的设备。这就是我拥有的实际设备。嗯，这可能会让你们先预览一下这里的一个正在闪烁的设备。就是这一个。没错。


    我们真正想要做的是，在选择好设备后进入“示例（examples）”，然后选择第一个示例：针对此板卡的 `Sims_is_our_to_Binky`。我们在这里不需要编写任何代码，只需点击此这里的
    `copy`（复制），这就会将示例从服务器复制到我的电脑中，我们就可以查看代码，并将代码烧录到连接到电脑的设备或板卡中。我会向你们演示如何完成这一切操作。


    你要做的第一件事是复制，然后为这些文件找一个合适的位置。对我来说这似乎是个不错的文件夹。如果我点击它，它显示目标文件夹不存在。你需要创建它。是的，我想创建它。它实际上会创建文件，并且还会打开一个新的
    CubeMicroIDE 实例，并将整个项目和所有代码加载进来。


    ## 代码概述


    实际上，我们在这里看到的是一段抽象文本，好的。这只是一个简短摘要，告诉我我的系统运行的晶振时钟是什么，我的系统运行的时钟频率是 `168MHz`。`LCD`
    是那个以 `500ms` 固定速度运行的闪烁灯。`button`（按钮）供用户停止或启动 LED 的闪烁。


    ![](img/image_rsrc1N2.jpg)


    同样，尽管这看起来是一个非常简单的操作，但要实现它可能相当复杂。所以我首先要做的是向你们演示我为 `STLink` 进行的所有设置，它就是这里这个小硬件。这实际上是闪烁板卡。你可以看到左侧有几根线连接到我的电脑，它有效地连接到这里的程序；而在
    `STLink` 的右侧，我们有屏幕。现在，在屏幕下方某个地方有主微控制器。好的。这个主微控制器连接着这三块 LCD，你可以看到它们已经在这里闪烁了。是的。所以我现在要向你们演示如何将其作为
    `link`（链接）配置到后端。这是连接到调试器的链路。实际上，你可以看到这里的这个接口（tip）。有趣的地方在于，这些板卡涵盖了我购买的这套整体开发套件的关键部分。它有一个板载调试器，所以这个
    `tip` 调试器是板载的。也可以使用独立的调试器，那是一个独立的设备。它通常是一个无聊的灰色盒子，上面写着 `Whatever`。


    ![](img/image_rsrc1N3.jpg)


