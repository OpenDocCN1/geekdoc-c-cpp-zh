    现在这个输出变高实际上是因为来自 BDD 的电流。你所说的电流输出是反的。这就是为什么我们称之为“推拉脸”（horse face），因为通常当你认为它是 0
    时，在 APM 中它变成了 1。对吧。也许在内部，微控制器并不理想。好的。那就是当你说 0 时，它就变成 1；当你说 1 时，它就变成 0。所以现在你把它设为
    0，这就是我们说的“推”（push），设为 0；然后在这里你可以说是的，1，它变成了我们处于的高电平状态。当你将微控制器寄存器设置为 1 时，输出处于高电平状态，因为你说它是
    1，而大多数晶体管此时都会开启，因为当你说那是 1 时，这里的电压实际上更高，而这里的这些晶极管会传输并开启，这里的电压和那里的电压非常相似，几乎完全一样。所以它们保持开启，而另一部分实际上被拉到了地。所以如果有任何电流流入这里，电流就会流向地。所以低电平（pull）拉到地。好的。然后“推”（push）是电流输出，而“拉”（pull）是电流输入。这就是推拉在微控制器中的工作方式。


    # LED 闪烁


    我建议大家下载一个 PDF 版的书，这样我们以后可以将其作为参考。它大约有一千一百三十四页，所以现在让我们开始吧。首先要让 LED 闪烁，我们需要进行一些
    GPIO 初始化。现在我们创建一个执行 GPIO 初始化（或 GPI 初始化）的函数。哦，我的意思是 GPIO。所以这是函数，在 `main` 函数中放入一个
    `while` 循环，然后这个 GPIO 初始化，我们需要创建一个端口类型的函数，然后假设你想以特定的间隔进行闪烁。


    所以我们创建一个延迟函数（delay）。我们必须创建一个延迟函数。这意味着所有的整数都等于 0。如果 `i` 小于某个值，比如五百万。这是四百五万到五百万。然后
    `i++`。好的。这意味着这些延迟遵循延迟的定义。所以我们在这里放一个延迟，然后把所有这些都放在代码中，这样就能让它闪烁。现在让我们尝试编译它。现在它正给了我们一个警告，说
    `i` 没有定义，因为在之前的版本中我没有设置 C99 模式。为了在像这样的文件中使用定义的 `i`，我们需要设置 C99 模式。所以去 `Flash`，去
    `Configure Flash`，点击 `Ctrl + +`。在这里是 `C99 Mode`，我们需要启用它。然后尝试编译它。没有报错了，好的。现在我们需要做的是执行
    GPIO 初始化，好的。为了初始化设置 GPIO，我们只需要为 GPIO 开启时钟。


    ![](img/image_rsrc1SE.jpg)


    所以在这里，进入外设时钟控制 `RCC`，我们需要查看位于其中的寄存器，即名为 `APB2` 的寄存器。在这个寄存器中你可以看到。现在我们要让 LED 闪烁，它位于
    GPIO 模块上，连接到微控制器的 GPIO 引脚 13。所以我们将让这个 LED 闪烁。现在我们要启用微控制器的输入输出端口（GPIO），所以我们要设置这个位。好的，为了启用这个位，它位于
    `IOPCEN`。


