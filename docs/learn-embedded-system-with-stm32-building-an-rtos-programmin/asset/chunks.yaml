    it gives us a value around `10`. You can see that the result keeps changing because
    the output is quite good. If there is a slight change, you will detect it and
    the value will change accordingly.


    ## Interrupt Service Routine


    Back to the code to understand how to actually get it running: the first line
    of code is the `config`. It is used to generate an interrupt every millisecond.
    For the name of the interrupt, this is the name of the interrupt system handler,
    which is `Felix`. You cannot change it to anything else because this is the interrupt
    service routine. This is the `config` function, which I got from the website;
    it configures the system to generate an interrupt every millisecond.


    ![](OEBPS/image_rsrc1T1.jpg)


    This is the name of the interrupt handler. I''m also using the software component
    services.


    ## ADC Clock and Frequency Configuration


    The next level of code is to configure the `ADC` scalar. The frequency must not
    exceed `14MHz`. The frequency of my entry-board is `72MHz`, but I cannot use `72MHz`
    because the clock frequency of the `ADC` cannot exceed `14MHz`. Therefore, I have
    to use a prescaler for the clock supplied to the `ADC`.


    According to the data sheet in the `ADC` introduction, the `ADC` input clock must
    not exceed `14MHz`. In the memory and bus architecture, you can see that `ADC1`
    is connected to the `APB2` bus. I''m using `AHB1` and the `APB` bus. The `APB`
    operates at full speed, meaning `ADC1` is operating at full speed, so we need
    to use a prescaler.


    I need to go to the `RCC_CFGR` register in `Chapter 8: RCC_CFGR`. You can configure
    the prescaler based on the speed of your microcontroller. Since the clock is `72MHz`
    and we need `14MHz`, I divide it by `6`. You can find this definition by right-clicking
    and going to the definition; it is defined in this header file.


    ![](OEBPS/image_rsrc1T2.jpg)


    ## Enabling Peripheral Clocks


    This line of code enables the clock for `ADC1`. Every peripheral needs a clock
    to run (e.g., `USART2`, `I2C`, `SPI1`). To enable the clock, you go to the `RCC_APB2ENR`
    register in `Chapter 8: RCC_APB2ENR`, which is the peripheral clock enable register.
    Each bit is assigned to a different kind of peripheral.


    We need the `ADC1` bit enabled. By writing `0x2000` (which is `0010 0000 0000
    0000` in binary), we enable `ADC1`.


    ## GPIO Configuration


    The next two lines are to enable and configure `GPIOB`. `GPIOB` is configured
    as an input pin. We use the register to configure the `GPIOB` pin `7`. You can
    find the details in `Chapter 9: GPIO issues`, specifically the `GPIO_MODER` register
    in the `GPIOB` block. This register controls pins from `0` to `P7`.


    We need to configure these bits. Initially, the value for `P7` is `0100` (binary),
    meaning the second bit is set. We change the value to `0x21000` to configure the
    desired mode.


