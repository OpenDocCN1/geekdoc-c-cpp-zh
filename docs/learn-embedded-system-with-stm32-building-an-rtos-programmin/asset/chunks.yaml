    我们将讨论一下 `R`，现在的 `R` 是领先的处理器 IP 供应商，提供最广泛的解决方案来满足每个设备对性能、功耗和成本的需求。`Octopus` 和 `NPR`
    应用包括他们在网站上提供的 `cortex-a`、`cortex-r` 以及其他 `cortex`，`ARM` 代表 `Advanced RISC Machine`（高级精简指令机器）。`RISC`
    代表 `Reduced Instruction Set Computer`（精简指令计算机），这基本上是一种几乎在 1990 年被采用的技术。他们提供 `CPU`
    芯片、物理编译器、系统级芯片和基础设施，并占据了约 75% 的市场。


    现在，`arm` 也写成小写，它之前是高级 RISC 机器缩写，最初是 `ACORN RISC Machine`。它是一个精简指令计算机家族，基本上用于计算机处理器。它针对各种环境进行了配置。这就是为什么会有多个
    `cortex` 的。我们将在几分钟后讨论这些细节。


    现在，他们提供系统级芯片，即 `SoC` 以及 `arm` 系统模块。`arm` 设计已经过了几代。原始的 `arm-1` 使用 32 位内部结构，但具有
    26 位地址空间。


    ![](img/image_rsrc1NW.jpg)


    这里有很多细节，但你现在需要理解的是，`ARM` 代表 `Advanced RISC Machine`，它基本上是一家为不同用途提供 `C.P.U` 设计的公司。现在，我们在市场上的主要客户在这个列表中，如你所示，直到
    `Samsung`，我们还有 `Broadcom`、`AMD`、`Apple`、`Qualcomm`、`Lenovo`。这些都是客户，并且他们使用 `arm`
    设计。所以如果你有一部 `iPhone` 或有一台使用 `Intel CPU` 的电脑，你可能会在那颗 `CPU` 上看到我们的标志，我们将讨论使用我们架构的各种板卡。但知道
    `arm` 无处不在是很好的。现在关于 `ARM` 处理器，`ARM` 提供了多种处理器技术。


    ![](img/image_rsrc1NX.jpg)


    我们在这里要讨论的只有其中三个，最重要的三个。我们将只讨论 `Cortex`，因为它是基于微控制器的 `cortex`。第一个是 `Cortex-a`，代表应用（applications）。它用于高端嵌入式或我们手机的智能手机，如
    `Apple` 设备和一些 `Samsung` 智能手机；而 `cortex-r` 代表实时（real time），专门用于 `Blu-ray` 播放机、硬盘驱动器控制和其他需要实时响应的设备。例如，在使用
    `Blu-ray` 播放机显示电影时，这类设备无法承受任何延迟。所以 `cortex` 是为此目的设计的。


    还有 `Cortex-m`，代表微控制器（microcontroller），主要用于嵌入式系统，并着 `8051` 的角色，`8051` 是一种在系统工作中非常著名的
    `intel processor`。现在，你可能也听过用于大多数中国手机的 `MediaTek CPUs` 或处理器，它们都基于 `arm` 或 `arm
    cortex`。`A7` 再次代表 `application seven`，是 `CPU architecture generation`（CPU 架构代），频率高达
    1.3 GHz。我们需要关于此的更多信息。你可以访问网站 `arm.com/index.php`。


    现在让我们快速看看 `arm cortex`。再次提到 `ARM`。`M` 代表 `microcontroller`（微控制器）。这是一个嵌入式系统芯片。在这张图中，你可以看到一些你必须熟悉的东西。这里有
    `bus`（总线）。


    ![](img/image_rsrc1NY.jpg)


    `bus` 基本上是那个用于将信息从一个位置传输到另一个位置并反之然的组件。这里有我们 `CPU` 的核心。这是整体。这里是 `cortex-m3` 芯片。它有内存、有
    `peripherals`（外设）、有 `clock`（时钟）以及 `input`（输入）和 `out`（输出），所有这些都连接到内部 `bus` 和 `cortex-m3
    core`。现在这里的 `m3` 是代数，每一代都有自己的规格。


    所以你从上一页幻灯片中需要理解的是，应用 `R` 代表 `real time`（实时），`M` 代表 `microcontroller`（微控制器），每当你看到设备和智能手机时，你必须知道它是这样使用的。我们的手机有一个浏览器，它使用
    `Cortex-a`，因为 `Cortex` 是最强大的，是智能手机的主要用途。每当你看到基于嵌入系统的设备时，你必须知道它正在使用 `cortex`。


    回到这里，`Cortex` 和 `Core` 通过 `debug system`（调试系统）连接，这 `debug system` 和 `cortex-m3
    core` 是由 `ARM` 技术开发的。而这两者是由 `arm design houses` 和芯片制造商开发的，因此由芯片制造商决定他们需要连接哪些外设、输出大小以及根据其应用决定
    `clock` 和复位时钟的 `clock speed`（时钟速度）。所以整个包，当你从商店购买时，是由芯片制造商开发的，而不是由我们的 `arm`，我们通常授权芯片制造商使用我们的系统核心设计以及芯片内部的其他内容。他们只是出售了使用我们技术开发最终产品的权利。但使用
    `ARM` 公司原始设计创建最终设计是芯片制造商的责任。但他们共同努力，为你提供使用基于 `arm` 处理器的非常快的设备。


    例如，`Cortex-m0`。在七代版本架构上，没有缓存也没有 `MMU`，现在 `MMU` 代表 `memory management units`（内存管理单元），所以该芯片没有内存管理单元。它自动支持指令和中断的保存与恢复状态。它们具有固定的内存映射和
    `thumb` 指令核心，具有高代码密度。这些是 `arm cortex` 处理器的一些主要特征。其他 `cortex` 和版本可能具有不同的规格。所以你需要选择适用于你应用程序的那一个。现在，如你在这里看到的，我们仍在讨论
    `arm conflicts`，你在这里可以看到这个绿色的框。它有 `Cortex-m0`、`m1`，你可以看到这里有多少条指令。你也可以发现指令并不多。所以这种程序不能用于嵌入式应用（那里有很多指令）。


    ![](img/image_rsrc1NZ.jpg)


    并且你需要在内部执行很多事情，连接许多传感器并进行许多数学运算。现在，之后是 `Cortex-m3`。它是这里的蓝色区域，指令数量是它的四倍。然后 `Cortex-m4`
    拥有更多指令，`Cortex-m7` 如你所示，它有更多指令。所以随着数字的增加，这是一个重要的公式。随着字母后面数字的增加，你会发现处理器更强大，支持更多的指令，并且可以访问更多内存。现在，这就是对我们世界的介绍。我希望现在你明白
    `ARM` 并不是制造芯片的公司。他们将制造权出售给 `Apple`、Intel 等其他公司。

