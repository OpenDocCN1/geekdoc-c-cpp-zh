    `LCD` 和 `board buttons`。现在应该提到的是，这些头文件实际上是 `CMC arts API` 的一部分提供的，而且它实际上是硬件抽象层（Hardware
    abstraction layer）的一部分。看来这个 artist 让我们非常非常容易地实际看到 `amps`（不是 `CMC artists champs`），这让我们非常非常容易地访问这些
    `these` 和 `buttons`，而不需要查看实际硬件——尽管我们还是会查看硬件，因为你知道这很有趣，而且我想卖给你——但我们不需要，因为我们可以直接使用这些头文件以及操作系统来控制
    `LCD` 和 `buttons`，而后台的 `Sams` 实际上是在匹配我们使用更高抽象层来访问它们的方式。


