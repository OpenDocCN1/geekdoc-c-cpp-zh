    `cow` 和 `cow1`，这里是毫秒时间，所以你可以看到这些计数 `cow` 在日志文件中的值，假设下次你有陀螺仪时，你实际上可以使用曲线 OK 来查看陀螺仪角度发生了什么。所以它实际上是你查看脉冲中变量变化的极佳工具。

