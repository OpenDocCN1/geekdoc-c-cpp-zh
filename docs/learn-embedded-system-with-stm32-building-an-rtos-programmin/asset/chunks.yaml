    This is basically a cortex microcontroller software interface standard. And this
    is what `CMS` stands for. `CMS` is a vendor independent software layer that will
    export and reuse software. To understand it more, details you can see here: different
    layers that we must go through from the user to the microcontroller.


    ### Software Layers


    Now, let''s start with the first layer. As you can see here, we have the application
    code, that application code is basically the user layer. And if you look here,
    this is the name of the layer, so the application code will go through real time
    kernel and middleware components, and some of its components might go all the
    way through the peripheral register and interrupt vector definition and to the
    device perform functions. And some application codes might communicate directly
    with the peripheral functions.


    After that, you can see that we have our `OS`, which is basically the second layer.
    This is basically the real time kernel and the middleware components that stand
    between the application code and the `CMS` layer.


    Now, the layer that we care about here and the main topic and this last one is
    this layer, the third one: `CMS` is basically a layer that has core profile functions,
    middleware access functions, device peripheral functions, and prefers to just
    start and interrupt vector definition. All of these are inside this layer. And
    that''s why this is a very good standard that makes it easy to communicate and
    reuse software and code.


    This layer communicates directly with the MCU. The MCU layer has the `CPU`, which
    is mainly the brain of any embedded system or embedded software system, and we
    have this `bus`, which is the art of the operating system. We have the `NVIC`,
    which is basically nested vectored interrupt controller and the interface and
    other peripherals.


    ![](OEBPS/image_rsrc1P3.jpg)


    So this layer helps the application code from the user to communicate with the
    MCU or the `cortex CPU` layer. And we are using this to make it easy for us to
    develop and write codes for the MCU. Now, again, this is basically a vendor independent
    software layer. This will ease porting and reusing of software and these two points
    are very important and you must keep them in your mind.


    ### File Structure


    Now, the file structure when it comes to this layer is as it starts with `stm32f4xx.h`,
    which is the main file, it goes to two files: the `hal` and the `system` file.
    The `core` file has the `startup` and the `system` file. Now, this is the file
    structure. And here we are explaining each of these branches:


    - `stm32f4xx.h` is basically the `cortex M4` global declaration file.

    - `stm32f4xx.c` is the `cortex M4` global definition.

    - We have `stm32f4xx_hal.h`, these are truly independent files, and we have the
    `device.h` to be included in application software depending on the type of device
    that you are using. We also have `system_device.h`, this is the device specific
    declaration. We have `system_device.c`, its basically a device specific definition.


    All of these files help initiate our `CMS` layer. Now, you might think, "do I
    need to remember all of these names and all of these guys?". Most likely the development
    environment that we are going to use will handle everything. You just need to
    create a new project and most of these files and definitions will be created for
    you.


    ### ARM CORTEX M4 ARCHITECTURE


    First, you need to know that this microcontroller supports Harvard architecture.
    It has a 32 bit Harvard based architecture, has some 32-bit instruction sets,
    which can go from 16 to 32 bit instructions. It has registers level of `r0` to
    `r12` as these are just cells that are general purpose. It also has a stack pointer,
    a `PC` program counter, `LR` link register and an `xPSR` program status register.


    It also supports unified memory space up to four gigabytes onto a bus interface
    based on the `arm aba` which defines the communication between the microcontroller
    modules through the on-chip buses. That is the `AHB`, the high performance bus
    connecting the bus master elements for less delay. And there is the `APB` peripheral
    bus. It has a low bandwidth connection with the peripherals.


    Also `NVIC` controller interrupts and exceptions management, with priority handling.
    It had a system stack timer (`SST`) which is a 24 bit different timer, and it
    has optimized or optimization for low power consumption. Various sleep modes are
    available, and we already mentioned that.


    ![](OEBPS/image_rsrc1P4.jpg)


    Now, if you take a quick look at this picture, you can see an example of the arm
    architecture design. The system here which is basically this bus. But here, the
    blue line connects the core elements like the processor up here and flash memory,
    but from `SRAM`, which is basically different types of memories for different
    purposes, also connect that bus interface, whereas that peripheral bus (the one
    that we just mentioned, which stands for `APB`) deals with the connection of all
    MCU peripherals. Both of these bus channels are interconnected by a bridge managed
    by a master slave mechanism following the arm specifications. And you can see
    the `bus bridge` right here. So they are connected using this bus bridge, but
    each of them connects different elements.


    ![](OEBPS/image_rsrc1P5.jpg)


    And as you can see, this is the system controller. This is the processor. This
    is the bus interface, flash memory, both from `RAM`, which are things that are
    very important and cannot afford any delay in communicating with these parts,
    but it can''t afford delay in communicating with these peripherals. That''s why
    they are connected to a secondary pass called `Peripheral Bus`, which is connected
