    # STM32CUBEMX 介绍


    我们将介绍该工具的主要功能，即配置和生成代码，以及编译和调试过程。它还帮助你估计 STM32 系列微控制器的功耗。所以，正如你所看到的，虽然这节课专门关于
    `ASTM, 32 zero`，而且基本上适用于零系列的知识可以适用于任何其他 STM32 控制器，但我们在这里指定了一个特定的系列，以便我们可以学习关于它的一切，你可以将这些知识应用到任何其他微控制器上。


    ![](img/image_rsrc1R2.jpg)


    由于 STM32Cube 是一个通用平台，适用于 STM32 系列，所以你不必担心为你尝试使用的每个新 `STM 32` 版本都要学习新软件。STM32Cube
    应用程序通过一个引导固件项目初始配置的用户界面，帮助开发者使用 STM32 微控制器，它提供了配置引脚分配、时钟、集成外设以及模拟最终项目功耗的方法。它使用了来自
    STM32 微控制器产品组合的大量数据库，该应用程序旨在通过帮助开发者在功能和功耗方面选择最佳产品来简化开发初始阶段。因此，这里的主要应用优势是它可以帮助为特定目的选择正确的
    MCU。仿真为设计阶段提供了优势。它加速了开发速度。有了这个领先优势，你可以选择理想的 MCU 并简单地配置引脚、时钟、振荡器、低功率模式和中间件。


    ![](img/image_rsrc1R3.jpg)


    现在，关于一些关键功能。用户界面围绕自然的工作流构建：选择合适的 MCU、选择所需的外设并分配引脚配置、功耗计算器辅助以及设计高效系统。最后，可以生成项目初始化代码，并在保持用户代码完整的情况下可能重新生成。所以此用户界面的一些关键功能是，你可以控制外设和中间件参数。有一个功耗计算器，你可以用它确切知道你的
    MCU 需要多少功率。有一个代码生成功能，使其可以在保持用户代码完整的情况下生成代码。还有命令行和批量操作选项，它是扩展的，例如库和插件。有一个 `MCO`
    选择器，你可以按系列、封装、外设或引脚进行过滤。


    ![](img/image_rsrc1R4.jpg)


    你可以搜索相似的产品。还有一个引脚配置面板，你可以在其中选择要使用的外设并将通用输入输出和复用功能分配给引脚。你也可以从用户界面配置 ADC 和 DMA。你还可以使用时钟初始化，它允许你选择振荡器设置、PLL
    和时钟分频器。现在我们来谈谈，有很多 IDE 可以来处理你的 `Steam 32`。有 `stem cells Tsukuba mix` 可以帮助你生成代码。有很多
    IDE 让你编译和调试代码。那就是那些为你服务的 IDE，它们将帮助你监控 MCU。还有很多你可以使用的免费 IDE。这是它们的列表。`Estienne 32`
    有很多支持。


