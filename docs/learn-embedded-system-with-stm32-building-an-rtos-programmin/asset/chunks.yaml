    嵌入式系统开发中最为棘手且最晦涩的主题之一就是称为信号量（semaphore）的话题。事实上，这些信号量非常容易理解，有时人们只是会对它们的工作原理感到困惑。因此，我希望能够很好地解释它们。


    考虑到它们看起来可能很可怕，某些信号量实际上是抽象的结构，用于管理对共享可重资源的访问，以便操作系统的多个线程能够同时工作；它们可能在不同的时间需要访问串行可重资源或串行复用资源，例如模拟数字转换器。


    想象一下我们这里有一个模拟数字转换器，它具有某些通道，让我们想象我们有一个非常优秀的操作系统，周围运行着许多不同的线程。我们有 `thread 1` 需要访问该模拟数字转换器的通道
    1，`thread 2` 需要通过 `ABC Channel 3` 访问，然后我们还有 `thread 3` 也需要访问通道 1。实际发生的情况是，如果我们设置得当，操作系统将阻止
    `thread 3` 访问 `ABC` 的通道 1，因为该通道目前正被 `thread 1` 利用。所以 `thread 3` 不会访问通道 1，它不应该访问。这非常重要，因为
    `thread 2` 可能会将其设置为某些配置并进行测量，而 `thread 3` 可能会将其设置为某些配置并进行测量，且 `thread 3` 的设置可能与
    `thread 1` 的设置不同。因此，如果我们让这两个线程同时操作同一个外设，就会导致很多麻烦，特别是当你使用像我们之前解释的那种抢占式操作系统时，一个线程能够抢占另一个线程的执行。所以这里实际上可能会发生很多有趣的事情。


    信号量主要有两种类型：普通信号量（normal binary semaphore）和互斥信号量（mutual exclusion semaphore）。我们将详细详细介绍这两者。`RDX`
    操作系统是实现信号量的操作系统之一，而 `CMC` API 为信号量或互斥锁与程序员之间提供了一个一致的接口。所以再次，你获得了一个完美的遥控器，这使得无论是
    `RDX` 还是其他操作系统并不重要，你只需要学习如何编写代码在 `CMC artist` API 中利用信号量即可，然后 `CMC artist` API
    将负责将你的指令翻译成操作系统语言的指令，然后操作系统将直接操作处理器及其外设，并通过一个全面的 API 将一切呈现给你，你可以使用这个完美的“遥控器”来使用它。我是把这个遥控器比作你的
    API 或者 API。


    ![](img/image_rsrc1MY.jpg)


    我说对于你这个程序员来说，它看起来像一个遥控器，这对于信号量来说可能没什么意义，所以让我们尝试更深入地解释一些信号量。首先，我们将普通信号量视为一个概念，它可以被理解为一个停车场。想象我们有一个只有四个车位的停车场。这个停车场代表一个串行复用资源。所以我们的停车场里只有四个位。假设在汽车中的对应例子是一个可复用资源，它一次只能被四个线程使用而不能更多。假设你所有的车都在这里，这里有四个位，三辆车进入一辆离开。操作系统管理资源、信号量和线程，当我们把一辆车放入信号量时，它的数值减
    1，这有效地表示我们少了一个空位。所以我们放了一辆车，还有三个空位，现在我们向前移动，然后再放入另一辆车，就只剩下两个空位了。是的，你的信号量数值减了。同样，如果我们放入第三辆车，就只剩下一个空位了。现在你的信号量数值是
    1。如果如果一个线程在访问串行复用资源之前需要等待，操作系统将进行匹配，让我们假设我们有一个满的停车场，然后另外一些车也想进去。


    ![](img/image_rsrc1MZ.jpg)


    嗯，操作系统将让这辆车等待它需要的时间。其中之一，我们有零空位，并且有一个线程挂起等待以有效利用零可复用资源，或者说有一辆车等待进入停车场，因为停车场满了；然后可能有另一辆车想进入停车场，因为停车场还是满的。所以我们的挂起数量将增加到两个。是的，现在当两辆车离开停车场后，我们就有两个空位，我们现在可以把那些车放进去，实际上，这里的整个移动过程发生了，最后剩下零空位和零挂起。当然，随着时间的推移，这些线程完成了它们的工作，一旦完成，它们就可以释放串行复用资源，或者有效地释放它们在停车场中的车位，这样我们就可以拥有一个空停车场。


    ## 定器管理


    微控制器许多重要功能之一就是硬件定时器或专用硬件外设，它们在自己的角色中测量时间，并且非常准确。这些定时器的工作原理是，当你使用定时器对特殊操作进行计时时，这实际上发生在主处理器之外，因此你的主处理器可以处理其他事情，而你的定时器在后台测量时间，定时器从零向上计数以测量已时间，执行类似于秒表的功能。它们也可以用于提供时间延迟。


    ![](img/image_rsrc1N0.jpg)


    硬件提供这些时间，并由操作系统监控，所以定时器确实离开了硬件，但在我们的案例中它们是由操作系统 `RDX` 管理的，而 `CMC` 实际上为这些定时器提供了一个有效的遥控器，阻隔了程序员与实际管理真实硬件的细节，而这正是幕后发生的事情。


