    ### THINGS YOU MUST KNOW


    Now let''s talk about you things you must know before moving forward. First, you
    need to know what an embedded system is and what the system is. Basically a computer
    system with dessicated functions within a larger electromechanical system. They
    range from simple portable devices like wearables and PS3 players, etc., up to
    large, complex systems like automotive, telecommunications and other applications.
    Now, when it comes to microcontrollers. It''s basically a small computer, a single
    integrated circuit. It includes the processor memories and input output peripherals
    called pieces on an embedded system. Now, you might find these computer systems
    on cars, on, let''s say, motherboards or satellites and on any PC.


    ![](OEBPS/image_rsrc1NN.jpg)


    Now, let''s talk about a few terms that you need to know about in the A, R or
    R architecture. It''s basically a set of suffocations regarding the instruction
    set, execution model, glimmery organization, instruction cycle and more, which
    describes a machine. Implementing that architecture on Cortex is basically a wide
    set of 30 to 64 are architectures. The first one on the list is Cortex A, it stands
    for applications designed for hosting rich operating system platforms like Linux,
    Android, etc.. There is also cortex, and it stands for embedded processors optimized
    for the empted market, low cost, energy efficient and low power. There is also
    cortex ah, which is real time, high performance and very critical scenarios, reliability,
    real time response, and, for example, the automotive world where we need zero
    real time applications.


