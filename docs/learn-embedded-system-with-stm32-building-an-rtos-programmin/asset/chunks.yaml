  trans: '

    所谓的 `Cortex` 是我们的下一代 ARM 处理器，它由经典的 CPU 和系统外设组成。这种类型有三个系列。有不同的区域，我们对这三个系列进行了划分，并会讨论它们的细节。因此，该系列适用于复杂的应用程序和操作系统。此外，这一系列用于实时系统，并针对我们敏感系统的成本进行了优化。大约有
    15 个性能级别，`zero` 是最低的。现在，让我们来谈谈 `cortex`、`CPU` 和规格。首先，你需要知道 32 位的 `risc`，32 位 `risc`
    基本上是 CPU 结构或你可以定义的内容。


    ![](img/image_rsrc1P0.jpg)


    带有 `risc` 的 `CPU` 是精简指令集体系。它有 16 个寄存器。它具有带有分支保护的三级流水线。它支持 Load/store 架构。现在，如你在此图像所示，这些是从
    `R zero` 到 `12` 的寄存器，然后是 `13`、`14`、`15`。这一个是 `16`。现在，我们提到这是一个 32 位的架构 `C.P.U`。所以你可以很容易识别出我们应该有
    16 位或 32 位。如果你看这里，你可以找到 `zero`。这是 `X PSR` 寄存器，我们现在不进入细节。它从 `zero` 开始。这里右边的最后一位是
    `31`。所以从 `zero` 到 `31`，这些是 32 位。这基本上就是它被称为 32 位处理器集群或 `risc` 架构的原因。再次，这些是 `16`
    个。每一个宽度都是 32 位，并且它具有带有分支预测的三级流水线。当我们谈论这三级时，你可以很容易在这里看到我们对每条指令都有取指（code）和执行（execute）。这基本上是我们的
    `cortex CPU` 的内部结构。而我们在这里讨论的是一个 32 位的 `risc` 架构 `CPU`。


    例如，`cortex M3` 有两种运行模式和两个级别。运行模式称为 `Thread Mode` 和 `Handler Mode`，在没有异常的情况下，运行正常程序或运行异常处理程序（如中断处理程序或系统异常处理程序）。这些特权级别为保护对关键区域的访问提供了一种机制，并提供了基础安全模型。当处理器运行主程序并处于
    `thread mode` 时，它可以处于特权状态，也可以处于用户状态。但当处理器退出时，异常处理程序只能处于特权状态。当程序 处于 `thread mode`
    且具有特权访问权限，在状态程序中，它可以访问所有正常范围并使用所有支持的指令。软件在特权访问级别可以使用该控制寄存器将程序切换到用户访问级别。现在，当发生异常时，处理器将始终切换回特权状态，并在退出异常处理程序时返回到之前的状态。程序无法通过通过写入
    `control register` 变回特权状态，它必须通过异常处理程序，由该异常处理程序配置 `control register` 来切换进程或切回特权访问级别。这发生在返回
    `thread mode` 时。


    ![](img/image_rsrc1P1.jpg)


    现在，如你在图中所示，这些是可用的运行模式和特权级别。现在，如果我们快速看一下原理图，你可以在这里看到我们有 `supervisor handler mode`，这里有
    `user mode`。我们有 `privilege`，即 `US`。这里有 `unprivileged application mode`。现在，`system
    calls` 或者正如我们所说的，来自特权模式的 `undefined instruction`。在这里你可以看到它们，一个具有指令和数据的总线，它正与 `CPU`
    连接并指向它。所以再次，`cortex M3` 有两种运行模式和两个特权级别，运行模式称为 `thread mode`（是这个）和 `handler mode`（是这个）。这决定了人员是在运行正常程序还是运行异常处理程序（如外部中断处理程序或等）。我们在这里讨论的是
    `cortex M3`，但你可以对任何遵循 arm 设计的其它 CPU 使用相同的定义。


    现在，让我们来谈谈一些指令集。某些技术在 `arm t32 ce` 中被引入，它大约在 2003 年发布，它通过扩展 `thumb` 有限的 16 位指令集并增加额外的
    32 位指令，使指令集具有更广度，从而产生变长指令集。`thumb-2` 的一个目标是实现代码密度，类似于在 32 位内存上与其它指令集具有相似的性能。`thumb-2`
    扩展了它们的 `thumb` 指令集，增加了位带操作，以及我们的特色分支和条件执行。同时，某些指令被扩展了，以在两个指令集中保持等效的功能，并且一种新的统一汇编语言（或者
    `as`）支持从同一份源代码生成 `thumb` 或 `arm` 指令。所以你在这里需要知道，`thumb-2` 指令集基本上是具有 16 位代码密度的 32
    位性能，适用于嵌入式微控制器（microcontrollers）。这张图像，如你在这里看到的，解释了一切。对于 `M3` 的上下文，你可以看到我们最初有一些指令是
    16 位的。`thumb-2`，正如我们已经提到的，出现是为了扩展它们 `thumb` 有限的 16 位指令集，这就是这个带有额外的 32 位指令，以使该指令集具有更广度。这是你对整个
    `thumb-2` 设置唯一需要理解的内容。我们将在接下来的课程中详细讨论它。


    ![](img/image_rsrc1P2.jpg)


    现在让我们来谈谈 `memory map`。如你所示，这是我们 `arm cortex`, `CPU''s` 中的映射，如你在这里看到的，我们有 `code`，它是最低的区域，这个区域基本上专门为我们的
    `code` 设计，它可以增长到半 GB。然后我们有 `static ram`，它也可以增长到半 GB。我们在内存中为 `peripherals` 留了特定位置，也可以增长到半
    GB。我们有 `external ram` 可以增长到 1 GB，`external device memory` 可以增长到 1 GB。然后我们有 `private
    peripheral`，包括内部和私有部分，外部加上 `vendor specific`。现在 `vendor specific` 取决于厂商。他们可以在这个内存区域放置任何他们想要的内容。但这是他们主要的结构或内存布局。完全正确。现在在
    `cortex CPUs` 中。


