    # 单步调试 (Debugging Single Stepping)


    首先，我会给你们讲一个小故事。在过去计算机的旧时代，计算机真的非常大——指的是物理尺寸上像房间那么大的计算机，也许是一个更大的房间。在那里，晶体不像现在 ICP
    内部那样纳米级极小，它们实际上是物理的晶体或物理的大块物体。是的，如果你见过那种晶体收音机的话，它们真的是非常非常大的东西。所以在那个时代，你可能会在放置计算机的房间里发现蟑螂或其他虫子（bugs）。你可能会发现真正的“虫”实际上导致了你的程序运行不正常的问题，因为可能由于蟑螂卡在了你系统的某个机械或其他电气部分，所以你必须进行实际的调试（debugging）。当然，它已经演变了，变成了你的软件出现了某种故障，而调试就是确保你已经从软件中移除了所有被称为“bugs”的东西。


    现代编译器和集成开发环境（如我们目前正在使用的）已经将这些 bugs 集成到整个系统中，它们可以独立地在工具上运行，也可以实际上与某种对目标的连接结合运行，而我们在这里实际上有一个实际连接。顺便说一下，这就是目标。而这就是你所谓的板载式调试器。是的，这非常有趣而且很有趣。我们现在来谈谈它。


    实际上可以做的是，可以在硬件上实时单步执行我们的每一行代码，并查看硬件内部发生了什么。所以让我们尝试一下。好，首先，我会和你们分享我所有的调试设置。在之前的课程中已经做过了。然而，我们再做一遍。所以我只需点击这里的这个按钮并进入目标所在的位置，这样你可以看到它们拥有的设置。这些确实是默认设置。我没有在这里或那里触碰任何东西。


