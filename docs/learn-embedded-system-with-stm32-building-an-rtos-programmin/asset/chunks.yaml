    现在，如果你正在读取一个信号，它将通过任何方式产生信号并将其存储在这些位中，即该端口的输入寄存器，在这种情况下是 `Port`。因此，这些引脚中的每一个都有输出和一个输入位，你可以用它们向这个特定的引脚发送或接收数据。它们分别用于数据输入寄存器（零位）和输出位。这基本上是一个快速示意图，用于向你展示我们
    MCU 中的每个引脚是如何结构的，以及它是如何用于接收或发送数据的。


    # STM32 中的控制寄存器


    现在我们将通过一个快速的示例来介绍如何使用和编写通用输入输出（GPIO）模式。现在 GPIOD 代表通用输入输出，它基本上就是数字输入和输出。现在，输入是指程序可以读取输入信号是
    1 还是 0；输出是指程序可以设置输出为 1 或 0，你可以用它与外部设备或板载外设建立接口，例如开关和按钮作为输入，或者 LED 和扬声器作为输出。你已经了解了这些信息。


    ![](img/image_rsrc1PR.jpg)


    在这张图中，你可以看到我们有一个 LQFP100 封装引脚图，从图中你可以看到我们这里有 100 个引脚。我们将它们分成了，有 A、B、C、D、E 组。这些是
    1、2、3、4、5 组。在这个 100 脚封装中，并不是所有的引脚都是可用的，所以有时你可能会发现引脚 5B 是不可用的，或者 B 有两个不可用的选项。因此，你必须根据哪些可用、哪些不可来进行工作。在这种情况下，可用的引脚在图中写出了，这样你就知道哪些可以用，哪些不能。这取决于封装的引脚数量。在这里我们有
    100 个引脚。


    ![](img/image_rsrc1PS.jpg)


    还有其他 64 脚、32 脚的封装。因此，根据你的应用，必须选择正确的封装。


    ## MCU 内部的通用输入输出位电路


    如你所见，我们有配置、数据和锁存。现在我们想解释这些，但我将解释这里的主要要点或部分。我们在这里有读，这里有，现在有一个读。如你所见，输出数据寄存器（ODR）区域基本上是读写寄存器，设置寄存器允许写入，而输入数据寄存器（IDR）已经是读取的。因此，这些位中的每一个都可以读、写或读写。现在，这里如你所见，有一个输出备用功能输入。这将位于位上。现在，这里有一个输出控制器、驱动器和输出驱动器。这一切都在
    MCU 内部。


    现在我需要你理解的是存在特定的寄存器，我们在上一节中已经解释过它们。其中某些可能是只读的，其他一些是读写的。这就是读写，如你在这里看到的。你必须准确记住每个这些寄存器的缩写，因为我们将在代码部分使用它们。现在关于配置，你可以去弄清楚它的方向、模式、速度。


    ![](img/image_rsrc1PT.jpg)


    关于数据，你可以输出数据或获取输入数据或处理模拟数据。通过这些不同的点，你甚至可以锁定数据或使用锁定机制来锁定 CPU 的特定状态。


    ## 控制寄存器概述


    我想再次解释那个控制寄存器，但我们将做一个快速概述，介绍每个端口的作用以及我们对 32 位寄存器的支持。第一个是 `mode part`，它基本上是模式控制系统，将端口定义为输入、输出、模拟或其他任何模式。现在还有另一个名为
    `output type register`（输出类型寄存器）的寄存器。这基本上是一个控制输出类型的寄存器，控制它是推挽还是开漏。还有控制该引脚速度的寄存器或
    `output speed register`。还有 `PUPDR`，即上拉/下拉寄存器，它可以启用上拉或下拉，具体取决于你的特定应用以及连接到我们端口的硬件。


    现在有 3 个数据寄存器。第一个叫 `IDR`，第二个是 `ODR`，我们已经提到过，这基本上是输入数据寄存器，这是输出数据寄存器。现在 32 位寄存器也是可用的，如你所见，这就是该寄存器代表的，`bit
    set register`（位设置寄存器）。现在这是位设置复置寄存器，它的 `BRR` 代表 `bit-reset register`（位复置寄存器）。


    ![](img/image_rsrc1PU.jpg)


    有两个 32 位备用功能寄存器。一个叫做 `AFRL`（备用功能寄存器），另一个是 `AFRH`。`L` 代表低位，`H` 代表高位。


    一组控制寄存器总共基本上 10 个。如果你花点时间，可以数一下。这里有 4 个，这里有 2 个，这里有一个，那里有一个，两个，所以 2 到 4 再到 6。4
    加 6 等于 10 个寄存器。因此每个端口都有 10 个控制寄存器。这就是为什么编程 STM32 不像编程简单的位微控制器那样容易，它需要更多的，可以说更高级的经验。我们将帮助你这一点。


    控制寄存器中的每一位都对应板上的一个位。取决于该端口内部有多少引脚，我们有一个 32 位寄存器，并不是所有的位都被使用，正如我们再次提到的，但某些端口引脚是不可用的。所以我们有时使用这些
    32 位。但当我们访问它们时，必须作为 32 位寄存器来处理。


    ## 寄存器详情


    此时我需要理解的是，我们有 10 个与 MCU 内部每个可用引脚相关的通用寄存器。这是主要的输入输出配置寄存器，每个位可以有不同的配置。设置操作会将方向位清零。每当你启动设置操作，它会在你尝试设置的位内部放入
    0。


    `output mode` 包括推挽或开漏，加上上拉或下拉。来自 `output data register` 的输出数据全部是使用备用功能输出。然后输入状态基本上是浮空、上拉或模拟。然后将其输入到理想或完美，可以说，它是备用功能。因此，每当有输入数据时，它将存储在这个寄存器中；每当有输出时，数据将存储在这个寄存器中，也就是我们在上一页幻灯片中提到的
    R 或备用功能输出寄存器。同样。现在，输出有这些模式，输入有这些机器，这就对特定位增加了零，每个位可以根据你的应用进行不同的配置。现在，如你在该图中看到的，右侧这里有
    `mode register`。这里有 `type register`。这里有 `speed register`。这里有 `pull up all down
    register`。这里有 `input output configuration`（输入输出配置）。现在，如你所见，这是第一种模式。如你所见，这些位中的每一个都根据应用有不同的配置。这里我们有
    `speed mode`。


    ![](img/image_rsrc1PV.jpg)


