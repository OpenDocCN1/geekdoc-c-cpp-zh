- fmt: "\n# GPIO Configuration and LED Blinking\n\nI created a header file for the\
    \ GPIO settings. In the file, I define the definition for each pin. For example,\
    \ `pin0` is defined as `0x0`. \n\nWhen you work with the `GPIO` register, when\
    \ you set a pin (e.g., `pin0`), after the configuration is done, if you set it\
    \ to `1`, `pin0` will be high. If it is set to `0`, it will be low. To set `pin13`\
    \ to high, we use `GPIO_OPEN0`. Instead of turning it off, if we want it be high,\
    \ we put the hexadecimal value `0x1`. We use `GPI0` or `pin0` to replace the raw\
    \ hexadecimal value for clarity.\n\n## Pin Definitions and Header Inclusion\n\n\
    I will be using the definition for `pin13`. This definition is copied over here.\
    \ To use it, I must include the header file I just created: `#include \"gpio.h\"\
    `. After including the file, you can see there are no more red errors. We can\
    \ see that the `GPIO_OUT` value is initially `0`.\n\n## Logic Operations\n\nThis\
    \ is the OR operator. For example, if I have values `a` and `b` such as `0b00011011`,\
    \ and we perform `a | b`, the result is `1` where either bit is `1`. If we use\
    \ `a & b`, the result is `1` only when both bits are `1`. If we use `a ^ b`, the\
    \ result becomes `0` if the bits are equivalent and `1` if they are different.\n\
    \nIn `GPIO_OUT`, the initial value is `0x0`. If we set `pin13` to `0x2000`, the\
    \ initial state is `0x0`. When you execute the code, the value for `pin13` starts\
    \ low. After setting it with `0x2000`, the value becomes `0x2000`.\n\n## LED Blinking\
    \ Logic\n\nThis line of code sets `pin13` from `0` to `1`. The LED will become\
    \ bright. Then, after a `delay`, we go back to the base and execute the next line\
    \ of code. The value becomes `0x0000`.\n\n![](OEBPS/image_rsrc1SH.jpg)\n\nBecause\
    \ the value is `0x0000`, the output is low. After the `delay`, the code executes\
    \ again, making `pin13` high again, repeating the process to blink at a certain\
    \ interval. We then compile the file and upload it to the microcontroller.\n\n\
    # ONBOARD LED HIGH LOW INVERTED EXPLANATION\n\nThe idea is to toggle the pin high\
    \ and low, which is connected to the LED pin. To toggle the onboard LED, we look\
    \ at the initialization. In the `GPIO` initialization, I enabled the clock for\
    \ `GPIOC` because we are using it. These two lines of code configure `pin13` as\
    \ a `push-pull mode output`.\n\nAfter running the code, you can go to the peripherals\
    \ system in the debugger to see the GPIO properties.\n\n![](OEBPS/image_rsrc1SJ.jpg)\n\
    \nThese are the registers belonging to `GPIO`. To turn the pin on, we use the\
    \ `BSRR` (Bit Set/Reset Register). To turn it off, we use the `BRR` (Bit Reset\
    \ Register). \n\n## Internal Driver Structure\n\nThe box shows the internal structure\
    \ of the microcontroller. This is the output driver. When configured in `push-pull\
    \ mode`, setting a zero in the `BRR` register activates the NMOS transistors,\
    \ driving the current to ground (sinking current). Conversely, setting a one in\
    \ the output register activates the PMOS transistors, making the output high.\n"
