    `Microelectronics` 基于 32 位 `arm` 处理器内核开发的 32 位微控制器系列，具体是基于 `arm-cortex` 架构。特别地，在本课程中，我们将使用
    `STM32` 微控制器，它属于低功耗微控制器家族，这就是 `MCU` 被放置在 `Nucleo 开发板`（Nuclear Development Board）中的答案。然后，开发板为微控制器单元提供了调试和开发的媒介。这些是你在继续学习之前需要了解的主要术语，因为我希望现在一切都清楚了。你需要理解什么是`嵌入式系统`，什么是微控制器。


    # STM 的世界


    那是 `cortex-m3` 核心吗？`M` 代表`嵌入式系统`（Embedded System），这是一个名为 `armed` 标准的开放世界。接下来，外围设备基本上提供了高性能、低功耗、高集成度、开发创新，这有助于你开始将任何东西连接到你的`开发板`（bauk）。产品范围是更高层次。它有一个系列完整的外设和软件兼容性，将帮助你合理化你的开发。


    ![](img/image_rsrc1NR.jpg)


    最后是工具和软件，它拥有最好的软件和工具生态系统，我们将在课程中不断发现这一点。所以，每当你看到一个 `STM32` 系统时，你都需要考虑这四点。核心将是
    `cortex-M3` 或 `Cortex-A` 或任何其他 `cortex` 核心。它将与外设连接，并且通常提供广泛的产品范围。它还具有工具和软件，可以帮助你轻松开发并快速调试。


    # 核心特性


    让我们谈谈 `arm` 32 位 `cortex-m3` 核心的核心特性 `Flash` 和 `S`（Isaura）。现在，这个 `cortex-m3` 核心具有高达
    512 字节的闪存内存和高达 64 字节的 `RAM`（Esraa），它支持时钟复位和电源管理。它具有多个通信外设，如 `I2C`、`USART`、`SPI`。现在，它还支持
    `sleep`、`stop`、`stand by` 低功耗模式。它有多个 `16 位`定时器，这意味着可以使用多个定时器，而且它们都是 `16` 位，这是一个非常好的特性。它有一个实时时钟、控制器和
    `12 位`数字模拟转换器。它还具有易开发阶段和快速上市。


    ![](img/image_rsrc1NS.jpg)


    所以你可以从今天就开始开发过程。一周后，你就可以将产品推向市场，因为它有很多开发软件可以帮助你轻松调试和开发代码。这些是 `cortex-m3` 核心支持的一些特性。现在还有其他更多功能的核心，但取决于你的特定应用，你可以找到适合你的那一个。但我们刚刚开始。


    # 应用


    当涉及到 `stm-m32` 或 `cortex` 应用时，你随处可以找到它们。在工业应用方面，你可以找到许多基于 `steel` 和 `arm` 架构的策略，你可以找到逆变器、打印机、扫描仪和工业网络。在建筑和安全方面，你可以找到许多报警系统、视频对讲、构建在我们的架构和
    `cortex` 核心上的 `H.V. AC` 系统。此外，还有低功耗应用，可以在许多应用中找到，例如血糖计、功率表、电池供电应用（所谓的低功耗模式）。


    ![](img/image_rsrc1NT.jpg)


    现在，还有其他应用，如家电器、电机驱动、应用控制、工业应用控制器，以及许多拥有架构并构建在 `cortex` 核心上的消费设备，如 `PC 外设`、游戏、数码相机等平台。所以基本上，你可以在周围随处找到基于
    `arm` 的设备和基于 `cortex` 的设备。你只需要观察并尝试在设备内部的微控制器或控制器上寻找 `arm` 字样。这些都是可靠的应用，但你并不限于这些应用。你可以用这些惊人的核心做任何事情。


    # NUCLEO 开发板


    现在，让我们谈谈 `Nucleo 开发板`（Nuclear Development Board）。现在我们以 `Discovery` 为例。你可以获取任何其他板，但在任何将用于
    `arm` 和 `arm` 架构开发和学习之旅的开发板中，你都应该寻找这些主要特性。所以，这基本上是这块板。它基于 `arm-cortex-m4` 架构，它具有
    1MB 闪存内存、128KB `RAM`（Esraa）数据内存，其时钟频率可以达到 80MHz。它基本上构建在相同的 `STM32F476 MCU` 之上。现在让我们谈谈这个
    `Discovery 板` 的主要特性。这些 `stm32 nucleo-64` 板为用户提供了一种廉价且灵活的方式，通过从各种兼容的微控制器组合中尝试新概念并构建原型。引脚显著减少，降低了功耗，并运行在连接的三个上，并带有
    `ST-LINK`（ESTIE more）引脚，允许轻松扩展 `STM32 Nucleo 开发开发平台的功能的功能，多种专用扩展板。现在，`stm32 nucleo-64`
    板不需要任何额外的调试器，因为它集成了 `ST-LINK`（stealing Bogar）程序，`stm32 nucleo 64` 带有 `STM32` 完整的免费软件库和示例，这些示例与
    `STM32Cube MCU` 软件包一起提供。现在让我们谈谈这些板的共同特性。它们基于 `STM32` 微控制器。它们有一个用户 LED。与 `Arduino`
    共享，它们有一个用户按钮和 32.768kHz 晶振，以及基本上是螺栓连接器，它们具有 `Arduino` 扩展、用于扩展的连接器以全访问所有 `ASTM`、32
    个输入输出引脚。它们还具有灵活的电源选项。


