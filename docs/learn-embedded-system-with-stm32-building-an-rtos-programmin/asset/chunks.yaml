- fmt: "\n# ADC Configuration and Sequence Management\n\nThis line of code sets the\
    \ number of `ABC` channels that we are going to use. Since we are just using `Channel\
    \ 7` to convert the null value to store value, the number of `ABC` channels will\
    \ be `1`. \n\nYou can go to the `ABC` sequence register one to see that for `B23`\
    \ to `B20`, these are the bits where we set the number of channels to use. It\
    \ is written as `L`, which means the length of the channel. By default, the reset\
    \ value of this register is zero, so this will be zero, which is why we don't\
    \ have to set anything. Setting this to zero means you'll be doing one conversion;\
    \ we just have one channel.\n\n## Sequence Register\n\nThe sequence register is\
    \ used to arrange the order in which channels are converted. Since we are using\
    \ just one channel, we are going to set `Channel 7` in the sequence register one.\
    \ These are the five bits we are going to use for `20`. If you are using `Channel\
    \ 7`, we put `7` in these bits.\n\nFor example, if you are using two channels,\
    \ `PIN 6` and `PIN 7`, for ADC conversion, you have a potentiometer to read. You\
    \ would need two channels and would set `L` here to `2`. In the sequence register,\
    \ you arrange the channels based on conversion priority. If you are using `Channel\
    \ 6` and `Channel 7` and want to convert `Channel 7` first, you put `7` in this\
    \ sequence. After that, for `Channel 6`, you put `6` in the next sequence bit.\n\
    \nThe sequence allows you to arrange which channel to convert first, while `L`\
    \ sets the total number of channels for conversion. These are different functions.\
    \ Currently, since I am using just `Channel 7`, I set `B0`, `B1`, and `B2` to\
    \ `111`, which equals `7`. In the code, the first bit represents `bit 0`, the\
    \ second represents `bit one`, and the third represents `bit two`. By setting\
    \ `bit zero`, `bit one`, and `bit two` to `one`, we represent `Channel 7` in sequence\
    \ register one.\n\n## ADC Activation and Power Management\n\nThe scan mode bit\
    \ is not used in this row, so it will not be explained. This bit enables the ADC\
    \ for the first time and sets it to `continuous mode`. For the ADC, we need to\
    \ turn it on twice before the conversion starts.\n\nWe go to the `control register`.\
    \ `bit zero` and `bit one` are for `ON` and `continuous`. If `bit zero` holds\
    \ a value of `1`, it wakes up the ADC from the power-down state. Before this line\
    \ of code is executed, the ADC is in power-down mode. The moment you set this\
    \ bit to `1`, it wakes up. However, the conversion has not started yet.\n\nThe\
    \ conversion starts when this bit also holds a value of `1`. We turn on the ADC,\
    \ then delay `1 millisecond` before turning the ADC on again. This delay is necessary\
    \ because the application should allow a \"clock step\" delay between the power-up\
    \ and the start of conversion. The first activation is power-up, and the second\
    \ is the start of conversion. Turning it on the second time triggers the process.\
    \ I used a `1 millisecond` delay, but you can experiment with microsecond delays\
    \ to find the minimum required for the `ABC` to start.\n\n## Calibration\n\nWe\
    \ set the ADC into `continuous mode` so that conversion takes place continuously\
    \ instead of stopping after one conversion. After turning the ADC on, we must\
    \ enable calibration. A delay is required before starting calibration because\
    \ the documentation states that before starting, the ADC must have been in power-on\
    \ mode for at least two ADC clock cycles.\n\nOnce the ADC is on, `ADONB` goes\
    \ to `1`. After a delay, we perform calibration. While I'm not sure if the millisecond\
    \ delay is strictly necessary, it ensures better accuracy for the data. The calibration\
    \ bit is set in the control register. Once calibration is enabled, we must wait\
    \ for the hardware to complete the process. We stay in a loop as long as the calibration\
    \ bit is `1`. Once it turns to `0`, the calibration is complete.\n\n## Interrupt\
    \ Handling\n\nThe interrupt handler is triggered when the end of conversion occurs,\
    \ provided enabled. When the conversion is finished, the program jumps to this\
    \ handler. We check the `status register`, specifically the status bits. If the\
    \ `EOC` (End of Conversion) bit is `1`, we read the digital value from the `data\
    \ register` and store it in a variable. Reading the `data register` automatically\
    \ clears the `EOC` bit in the status register, preventing the interrupt service\
    \ routine from being triggered repeatedly for the same data.\n"
