    这里有上拉电阻、下拉电阻，你可以选择如何配置其中的每一个。现在，如果你在数据表中看到 `peepee` 或者 `g.p`，`gibi` 代表用途（purpose）。`Yippy`
    代表推挽输出（Push-Pull），`P` 你。这代表上拉（All Up），而 `PDA` 代表下拉（pulldown），或 `D` 代表开漏（open train）。`F`
    代表备用功能（alternative function）。现在阅读数据表并根据应用分配值是如此简单。


    ## 备用功能

    这基本上是 `F` 模式下的 `F` 寄存器，`F` 或 `L` 以及 `F` 边缘，代表备用功能，某些高频需求需要配置为由特定的外设驱动。因此，你必须自己进行配置。它可以被视为多复用器（Multiplex）的选择信号。


    现在，`event out` 没有映射到以下输入输出引脚，即 `Pkwy 13`、`14`、`15 zero one` 和 `P eight`。这就是 `event
    out`，我们将在关于 `STM32` 的高级教程中讨论它。


    现在，我需要理解的是我们有一个通用功能选择寄存器（ultimate function selection register）。这基本上就是我刚才提到的必须配置为由连接到我们系统的特定外设驱动。你可以从这张图中看到，这是
    `F` 区域，这是 `F r edge`。在这里，它从 `F zero` 开始到 `A15` 结束；这里也从 `F zero` 开始到 `F 15` 结束，现在由于这是
    `event out` 并没有映射到这个 `fence`。


    现在这些是引脚，你必须相应地连接它们。假设你想使用 `S.P.I` 协议连接所有。你可以使用这些 `Tobins`。那么假设在一个运行你的 `CRT` 的设备上连接我们的
    `t protocol`，你可以使用这些 `Tobins`。因此，取决于功率、通信协议以及你具体需要做什么，你可以使用这个备用功能选择寄存器。


