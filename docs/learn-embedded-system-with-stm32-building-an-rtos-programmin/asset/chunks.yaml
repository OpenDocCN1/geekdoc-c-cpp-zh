    编写程序。现在我们将等待下载完成，然后我们将开始将这些文件添加到 `Arduino` 文件夹。现在在我们等待时，你需要进入 `Arduino`，这是原始的想法。


    ![](img/image_rsrc1PG.jpg)


    我们已经解释了如何下载和安装 `IDE`。现在你需要进入 `tools`。在这里你会发现 `board` 中我们没有 `Arduino STM32`，为了提供这块板子，我们需要进入
    `boards manager`，在这里我们需要安装 `Arduino some boards`。你会在这里找到第三个结果，抱歉 `Arduino some
    boards`，这个包包含了这些板子，比如 `Altuna do`，它支持 `stm32 bit arm cortex`。只需简单安装。现在安装过程将从一个大约
    60MB 的文件开始，所以它将下载这个文件，一旦下载并安装，它将添加 `Arduino STM32 arm cortex M3` 支持。这是我们在从 `GitHub`
    库拷贝文件到 `Arduino` 文件夹之前需要的。


    ![](img/image_rsrc1PH.jpg)


    现在正如你看到的，已完成并安装，如果你有这个词，那么一切都稍微关闭了，再次点击关闭按钮。现在对于点击关闭按钮，你需要确切知道 `Arduino` 软件在哪里。右键
    `Arduino` 点击 `Open file location`（打开文件位置）。现在再次右键 `Arduino` 点击 `properties`（属性）。这就是简单的安装目录。现在我们完成了从
    `GitHub` 下载库文件，现在我们需要解压它们，所以去这里，让我们看看这是 `Abdinur attempted to master`，只需解压。在这里是
    `ArduinoSTM32`。现在将该文件或文件夹粘贴到 `hardware` 文件夹中，在 `Arduino` 内部。现在将花费半分钟拷贝所有文件。正如你看到的，这个文件夹还有一个用于
    `microcontroller` 的 `avr` 文件夹。现在我们正在为 `STM32 microcontroller` 添加支持。太棒了，现在一旦完成，只需再次右键
    `Arduino` 打开。最小化这些，并将等待 `IDE` 加载以向你展示如何从原始 `IDE` 选择 `Arduino` 或 `STM32 board`，对于大多数熟悉
    `IDE` 的人来说这是简单的方法。现在从这里你可以创建一个 sketch。进入 `tools` 并进入 `board`。现在当你进入 `board`，你会发现现在我们有了
    `Arduino STM32 search to master drivers`，我们有 `Arduino STM32 tools`，我们有 `stem cells
    to EF1 boards before boards`。现在在这个列表中你可以选择你拥有的板子，通常会是这些 `Jaric` 板子之一，但我们将在实践部分讨论那个。


    ![](img/image_rsrc1PJ.jpg)


    现在假设你已经选择了这块板子。你可以返回，确保此策略对应 `F103 series` 已选中，然后你可以从这里选择变体。现在有些板子是 `64KB flash
    memory`，而另一些板子有 `128`。你可以选择使用 `STM32 Luig Bootloader` 的上传方法。如果你的板子上有引导程序或使用 `Serial
    connection`、偷窃或使用 `black magic prop`，你甚至可以选择 CPU 速度，正常是 `72 megahertz`，这就是了。你最后选择的是
    `port`。


