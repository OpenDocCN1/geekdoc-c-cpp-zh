    # 让我们开始分析什么是 Artist 以及它的作用


    `Artist` 代表实时操作系统（real-time operating system）。如果你愿意的话，对实时操作系统一个非常简单粗暴的定义就是：它在正确的时间做正确的事；否则，事情就会变得极其糟糕。


    在很多地方都能找到实时操作系统的例子。事实上，如果你现在正盯着屏幕看（我觉得你很有可能这样做），那么在你屏幕的背后，应该有一个微控制器，而这个微控制器极有可能正在使用一个实时操作系统来执行它的任务。当然，里面也可能有其他东西，如果你有一个无线鼠标，它会有一个操作系统。如果它有操作系统，那么它也会是一个实时操作系统。


    ## 实时系统的类型


    实时系统有不同的类型。如果你在屏幕上看到一架战斗机，有趣的一点在于，如果这架战斗机出了什么极其糟糕的错误，它可能会从天空中坠落，或者做一些愚蠢的事情，比如在不该发射的地方发射导弹。它的装备非常齐全；通常战斗机都配备了大量的导弹。


    如果这么说，实时操作系统实际上有不同程度的“实时性”。在你使用实时操作系统时，可能会发生不同类型的错误。如果你为一架战斗机配备了真正的硬实时系统，你必须以不同的方式来设计你的系统，而不是像为洗衣机、鼠标或灯泡之类的设备配备实时操作系统那样。


    如果你有一架战斗机，有很多事情可能会变得极其糟糕。然而，如果你的灯泡比正常时间晚了 10 毫秒亮，那是没问题的。但是，如果一架战斗机执行某项操作比应该的时间晚了
    10 毫秒，结果可能会非常糟糕，后果不像你想象的那么简单。


    所以，是的，你可以使用实时操作系统，而且有很多实时操作系统。事实上，创建一个实时操作系统让它以非实时的方式运行是可能的。这意味着它通常可以正常工作，但对于相对于输入何时完成反应时间的时间容差可能非常松散。你会说：“我按了一个按钮，动作发生在
    100 毫秒内还是 500 毫秒内其实并不重要”，而在不同的用例下，你可能会说：“当我 25 微秒内按下这个按钮时，我必须有反应。”在汽车工业或航空航天领域就有这种情况。


    ## 任务与资源管理


    `RTOS` 提供许多抽象结构，帮助以及时且可预测的方式监控不同任务的执行。它创建并管理不同的任务，这些任务也被称为 `threads`（线程）。你可能会听到我谈论
    `tasks`（任务）、`threads` 或 `processes`（进程），这三个词在整个 RTOS 课程中会交叉使用，用于定义某些抽象结构来管理对串行可复用资源（如内存区域、网络等）的访问。


    这里的理论是，例如，你可能只有一个网络端口或只有一个 `UDP port`，然后你有三个不同的 `processes` 用于不同的 `threads` 想要与这个端口通信。因此，操作系统实际上会管理对该端口的访问，确保同一时间只有一个进程可以访问它。当然是，如果你有多个进程同时访问同一个
    `UDP port`，你可能会遇到数据损坏或运行不正常的问题。你的操作系统提供了一些结构来管理这种访问。


    ## 优先级与调度


    实时操作系统还会准确地对不同的 `threads`、`tasks` 或 `processes` 进行优先级排序；会有不同的优先级。你可以想象，例如在汽车内部，你的窗户开关的优先级和你的
    `ABS` 命令不同。如果它们运行在同一个处理器上——通常不会这样，但如果确实是这样——因为当我们按下窗户开关时，晚 100 毫秒响应其实并不要紧。但是，由于某种原因，`ABS`
    对某类型的输入多花了 100 毫秒才响应，结果可能会非常非常糟糕，人们很快就会感到非常糟糕。


    操作系统还管理所有 `threads` 和串行可复用资源的和谐执行。也就是说，操作系统充当所有需要发生的事情的主调度器，并确保一切顺利进行，并确保一切都相互配合，前提是你程序得得当。


    ## 操作系统领域


    操作系统可以被认为同时在两个不同的领域运行：

    1. 其中一个领域是资源访问的变货币化。

    2. 另一个领域是主处理器空闲时间访问变货币化。


    现在，如果你有一个核心——有多个核心，在某些系统（我们称之为 `chip`）上存在多个核心的可能性——那么拥有一个能够并经过适当编程的操作系统，能够为它的每个
    `threads` 或 `processes` 变货币化数据和处理器时间，将是至关重要的。


    将 `RTOS` 用于非实时应用是可能的，甚至是常见的，例如洗衣机、自动售卖机或移动电源。即使是管理我部件的非常简陋的应用程序类型，里面也有某种类型的 `RTOS`。我面前的另一个东西是一个计算器，或者里面应该有某种
    `RTOS` 在实际管理这个计算器的工作方式。这个 `RTOS` 可能会更或更不复杂，或者某些设备可能是简陋的，但它们极有可能带有一个实时操作系统。问题是，实时操作系统会增加一些进程或开销，因为它当然需要运行它所有的进程，而且带操作系统运行的效率不会比没有操作系统的情况下简陋运行更低。


