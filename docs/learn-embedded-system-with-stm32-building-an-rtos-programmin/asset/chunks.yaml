    # GPIO 配置与 LED 闪烁


    我为 GPIO 设置创建了一个头文件。在文件中，我定义了每个引脚的定义。例如，`pin0` 被定义为 `0x0`。


    当你操作 `GPIO` 寄存器时，当你设置一个引脚（例如 `pin0`），在完成配置后，如果将其设置为 `1`，则 `pin0` 将为高电平。如果将其设置为
    `0`，则它将为低电平。要将 `pin13` 设置为高电平，我们使用 `GPIO_OPEN0`。与其将其关闭，如果我们想让它置高，就放入十六进制值 `0x1`。我们使用
    `GPI0` 或 `pin0` 来替换原始十六进制值以提高清晰度。


    ## 引脚定义与头文件包含


    我将使用 `pin13` 的定义。这个定义复制到了这里。为了使用它，我必须包含刚刚创建的头文件：`#include "gpio.h"`。包含文件后，你可以看到不再有红色错误了。我们可以看到
    `GPIO_OUT` 的初始值为 `0`。


    ## 逻辑运算


    这是或逻辑运算符。例如，如果我有一个值 `a` 和 `b`，例如 `0b00011011`，我们执行 `a | b`，只要其中一个位为 `1`，结果就为 `1`。如果我们使用
    `a & b`，只有当两个位都为 `1` 时结果才为 `1`。如果我们使用 `a ^ b`，如果位相同则结果变为 `0`，如果不同则变为 `1`。


    在 `GPIO_OUT` 中，初始值为 `0x0`。如果我们将 `pin13` 设置为 `0x2000`，初始状态为 `0x0`。当执行代码时，`pin13`
    的值从低电平开始。设置为 `0x2000` 后，值变为 `0x2000`。


    ## LED 闪烁逻辑


    这行代码将 `pin13` 从 `0` 设置为 `1`。LED 将变亮。然后，在 `delay` 之后，我们回到基础并执行下一行代码。值变为 `0x0000`。


    ![](img/image_rsrc1SH.jpg)


    因为值为 `0x0000`，所以输出为低电平。在 `delay` 之后，代码再次执行，使 `pin13` 再次变为高电平，重复此过程以按间隔闪烁。然后我们编译文件并将其上传到微控制器。


    # 板载 LED 高低电平反转说明


    思路是切换连接到 LED 引脚的引脚的高、低电平状态。要切换板载 LED，我们查看初始化部分。在 `GPIO` 初始化中，我启用了 `GPIOC` 的时钟，因为我们要使用它。这两行代码将
    `pin13` 配置为“推挽输出模式”（push-pull mode output）。


    运行代码后，你可以去调试器中的外设系统（peripherals）查看 GPIO 属性。


    ![](img/image_rsrc1SJ.jpg)


    这些是属于 `GPIO` 的寄存器。要打开引脚，我们使用 `BSRR`（位设置/重置寄存器）。要关闭它，我们使用 `BRR`（位重置寄存器）。


    ## 内部驱动结构


    图中显示了微控制器的内部结构。这是输出驱动器。当配置为推挽模式时，在 `BRR` 寄存器中设置 0 会激活 NMOS 晶管，驱动电流流向地（灌）。相反，在输出寄存器中设置
    1 会激活 PMOS 晶管，使输出为高电平。


