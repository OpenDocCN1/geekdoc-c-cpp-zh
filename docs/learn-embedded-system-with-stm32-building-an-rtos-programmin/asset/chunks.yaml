    本节涵盖了 `GPIO`，即你在 College Board 上对微控制器的配置。你的目的是让微控制器与现实世界接口以实现相互交互。在我们特定的案例中，红外接收器和
    `LCD` 分别连接到控制器的输入和输出。`GPIO` 定义了它们所到达的位置，即逻辑信号电平或驱动外部负载。这意味着每个 `GPIO` 引脚基本上都可以作为输入或输出。事实上，在
    `STM32` 微控制器家族中，有两种以上可能的配置模式。输出和复用配置模式较少，额外的配置选项如推挽（Push-Pull）或开漏（open drain）晶极级。此外，输出、输入模式可能启用或可能未启用上拉或下拉电阻，多种
    `GPIO` 配置模式可以选择最佳的应用能力。


    一个示例报告将连接到红外接收器输出引脚的端口配置为输入并启用了上拉电阻。虽然接收器在数据引脚上内置了上拉电阻，但这个廉价芯片内部的上拉寄存器被启用了。此外，你可能会想，红外接收器的
    `MCU 引脚` 需要上升和下降沿触发检测。这能带给我们什么？答案很简单，通过 `GPIO` 外部配置，它们允许你忘记调用外部中断函数。每当红外接收器输出数据改变其逻辑电平时，这使得大时间和暂停间隔的测量更加准确，并节省你的时间。


    ![](img/image_rsrc1M7.jpg)


    对于 LED，我们需要将 `GPIO` 初始化为输出、推挽模式。在我的情况下，我有额外的八个 LED 连接到 Discovery 板上。如果从零开始计数，从
    `0` 到 `4` 以及 `6` 到 `7` 的引脚作为对应 `LED` 的输出。第五位激活具有相同编号的 LED，它源自 `Pols`；这种决策一直以来与板载的一个外部外设存在五个冲突。嗯，板载上的四个
