    我们将从配置 `STM32` 闪烁报警的第一步开始。现在，这是一个通用示例，一个非常基础的示例，仅用于学习如何处理输入和输出。现在，你需要做的第一步是：选择振荡器，你需要进入低配置（low
    configuration），在这里的右侧我们有一条线。在右侧你可以看到 MCU 的内部结构、内部时钟、那个预设器以及左侧的其他配置。在这里我们有输入频率（input
    frequency），我们必须在这两者中选择一个作为外部振荡器。为了验证这条线的含义，左侧是外部配置，右侧是内部振荡器配置。


    现在，我们要做的是回到引脚配置（pinout configuration），在这里选择我们的 `RCC`。`RCC` 代表 `Reset and Clock
    Counter`（复位与时钟计数器）。点击后，你会看到一个窗口。这基本上是你需要选择的高速和低速时钟配置，你需要选择一个晶体振器。我们为什么选择晶体振器呢？因为我们有
    `STM32 blue pill` 板。在这块板上，我们有一个运行频率为 8MHz 的晶体振器。


    ![](img/image_rsrc1RC.jpg)


    现在，你需要回到时钟配置，并在这里选择 `HSE`。在这里这个区域，我们有高速时钟，它可以运行高达 72MHz，将此数字改为 72MHz 是最大速度。然后，你会发现有一个错误。不，你需要回到引脚配置，在这里你需要确保
    `PC13`（即 `participant13`）被标记为 `General-Purpose Input Output`（通用输入输出）。完成后，你可以继续向左或右移动，选择这个，在这里你需要选择你想要使用的调试器。现在，根据你的规格，如果你有特定的调试器，可以从这个标签中选择。但我们将使用
    `serial wire`（串行线），正如我们在 `USB` 或 `ST-Link` 卡上那样，我们将用于 PC 连接到 `STM32 Global Board`。一旦你选择调试器为
    `serial`，你为什么看到另外两个引脚变成了绿色？现在，这些是将用于串口调试器的两个引脚。完成这一步后，你需要点击设备配置工具（device configuration
    tool）。这将帮助你生成它们。这个工具就是齿轮图标，如你所见，`device configuration tool`，点击 `Generation`。点击一次并点击
    `Yes`。


    现在，如你所见，设备配置工具正在更新代码，这里是你的第二个。现在，如果你不在这里，你会发现有很多文件。你有二进制文件、有 `include` 文件夹以及核心文件。你将要操作的主要部分是核心源
    `main.c` 文件。现在，在这个文件中，我们想解释整个代码结构。你需要直接进入并确保你处于 `main` 方法内部，在里面你会找到一个循环 `while(1)`，这是一个无限循环，你将在其中编写我们的代码。


    现在，为了确保你理解这里发生了什么，我们将使用库。要开始使用这个库，你需要执行以下操作。现在点击这里并开始编写 `HAL_GPIO_Write`。然后如果你想查看可用项目的列表，可以按下
    `Ctrl+Alt+Space`，你将看到此库中可用函数列表。


    ![](img/image_rsrc1RD.jpg)


    我们需要的函数是 `HAL_GPIO_TogglePin`。它接受两个参数。第一个是通用输入输出端口。在这种情况下，它将是 `GPIO_C`。另一个配置输入是通用输出引脚，在我们的案例中，它将是……`13`，所以我们有引脚输出
    13，这意味着 `PC13`。第二步是添加延迟。按下 `Ctrl+Alt+Space` 并输入 `delay`。`500` 意味着五百毫秒，就是如此简单。那个
    `toggle` 函数将切换此引脚（即 `PC13`，`participant13`）的状态。因此内置 LED 将点亮。现在，当循环第二次运行时，它将状态从开启切换到关闭，依此类推。这是一个
    500 毫秒的延迟，以便你可以在事件发生前看到发生了。


    完成后，你需要执行以下操作。首先，你需要使用这个锤子图标编译你的代码，以确保一切正常。现在，在这里，如你所见，我们有一些错误。如果我们向这里滚动，你可以看到这里的箭头，我们忘记了符号
    `;`。现在再次点击锤子。如你所见，我们完成了，零错误，顶部有一个警告。现在你已经写好了你的代码，并准备好调试你的代码或在板卡上运行它。取决于构建情况，你可能没有所有这些，你可能会进行不同的配置。在我的情况下，我会点击这里，运行作为
    `Cortex-M C++ application`。现在你也可以调试这段代码。一旦你选择了这个，让我们回到这里。但正如我所说的，`STM32`，你也会看到这个。现在，如你所见在这个窗口中，你可以选择
    `C++ application`，这是我们的应用程序，空白模板，项目名称，你可以选择启用禁用工作区设置。


    ![](img/image_rsrc1RE.jpg)


