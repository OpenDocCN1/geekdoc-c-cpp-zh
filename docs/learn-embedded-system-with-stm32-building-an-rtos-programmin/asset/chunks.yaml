    橙色切换宏的字，当外部 Interop 处理函数被调用时的最新状态。现在将二进制文件导入 MCU。逻辑分析仪可以帮助比较红外接收器的输出引脚和最新的计时图，通道三显示红外接收器的输出状态，而通道二连接到。如果我们按下遥控器上的任何按钮，我们可以看到橙色警报在闪烁。图表比较确认了橙色的每个状态变化都与其对应。我需要外部中断。从示波器记录的时序图显示遥控器的位值没有反转。我们看到两个菱形图都是反转的，但它们彼此完全对应。


    # NEC 协议主解码逻辑


    将解释称为核心逻辑来实现的初始化，假设 NSA 解码器是完全中断的，驱动器可以包含解码算法逻辑。让我们先考虑外部 Interop 处理程序的算法。正如之前的课程中提到的，当红外接收器输出数据引脚电平变化时，就会调用外部中断程序。上升沿和下降沿都会触发外部中断，每当此中断发生时，就会触发中断，已知测得的脉冲长度和当前解码器状态，系统就可以理解当前从遥控器接收到了什么种数据。首先接收引导脉冲并测量其长度，接着是一个
    4.5 毫秒脉冲。然后解码系统地址和发送器系统地址，命令和反转命令的解码也是如此。当系统地址和命令都接收后，NSC 解码器持续检查重复代码的接收。每当接收到重复代码时，重复代码计数器就会加
    1。现在，如果释放遥控器上的按钮会发生什么？它们仍然会中断，但在这种情况下将不再被调用，且时间不会为新的测量周期重启。


    ![](img/image_rsrc1MP.jpg)


    如果 120 毫秒内没有接收到脉冲，则定时器三比较中断会被调用，并将 NSC 解码器返回初始状态。但让我们更深入地分析外部中断处理程序。当调用外部中断时，定时器和可视中的中断标志位都会被清除。然后将定时器的计数器值读入变量中，该变量值定义了传输中两个邻接边缘之间的长度。当遥控器传输
    38 千赫兹频率时，接收器的输出为零。Litchfield 检测到的边缘不会提供测量结果，因为定时器在此阶段已停止。定时器在看到上升和下降沿时通过定时器三控制寄存器
    1 启动。第二天，系统地址结束端被分配给此系统，逻辑等待接收器的下一个上升沿，当边缘到达时，到了记录寄存器值的时候。测得的该值为 9 毫秒，定时器重启以测量
    4.5 毫秒的暂停，并将解码阶段改为短暂停。


    ![](img/image_rsrc1MR.jpg)


    当检测到第一个接收的系统位的前沿时，在进行位长度测量之前会测量暂停长度，随后的状态和地址命令被分配给解码器状态机。因此，当后续边缘开始新测量时，已知每个高或低逻辑电平的长度。在
    4.5 毫秒脉冲之后，接收到系统地址的第一位，固件将检查脉冲长度。之后在 NSC 解码器的编码部分，测量暂停。2.25 毫秒的暂停周期对应接收到的逻辑 1，而
    1.12 毫秒的暂停间隔是逻辑 0。当接收到所有地址和命令位后，解码器进入长位结束状态，重启定时器并期望接收重复调用，并调用控制以更改精英状态。在第一次重复调用之前，接收到约
    14 毫秒的脉冲。然后是逻辑脉冲，在 2.25 毫秒空间和 500 微秒突发之后，随后是 40 毫秒的暂停。然后解码状态变为长位结束，在约 98 毫秒处再次接收到重复代码。每当接收到重复代码时，重复代码计数器加
    1，重复代码计数器在测量遥控器按钮按了多久时很有帮助。在此阶段，在释放遥控器上的按钮之前，系统中没有发生其他事情。当遥控器超过 120 毫秒没有脉冲时，定时器的比较值匹配时间计数器寄存器值，触发定时器比较中断。首先，定时中断处理程序关闭，中断停止，定时器三清除其内容寄存器并为
    NSC 解码器准备接收下一次命令。然后将其指示变量返回初始状态，调用函数并调用控制以更改精英状态，此时，定时器中断处理程序不再做更多。后续的定时器启动将在再次按下遥控器按钮时发起，在下一节课程中将分析用于
    AC 协议解码的几个辅助函数。


    # 辅助 NEC 解码函数


    这些函数用于提高计数能力和更改状态。需要注意并被 NSC 解码器使用的前两个函数是所知的，是接收和一个接收。这些函数接收值到系统中的系统地址、命令和反转命令变量。逻辑
    0 或逻辑 1 被告知通过右移七位生物位是最低效的。使用位移运算符 `>>` 来产生逻辑 0。可能两次使用 `|` 运算符来存储逻辑 1。


    ![](img/image_rsrc1MS.jpg)


    作为启动和停止 AC 定时器的函数表示指向低级外设驱动程序的简单抽象接口。这些函数启用或禁用定时器三控制寄存器 1，从而启动或停止计数。一个函数返回定时器计数寄存器值。一个函数我们设置定时器重置定时器计数寄存器。一个函数获取一个状态并检查命令是否已解码，函数获取任何系统状态和获取任何命令状态，提供了编码的系统地址和命令。功能控制权限命令到端口
    A 和端口 B，如果此时按下遥控器上的相应按钮，我们已经恢复了辅助函数。


    # NEC 解码器测试


    现在我们准备好在两个 Discovery More 之后测试我们的新系统解码器。如果在权利权限部分打开文件，我们可以告诉编译器代码应该优化到何种程度。我们有几个编译器优化级别供我们选择：`-O0`
    针对编译时间的优化，`-O1` 针对大小和执行时间的优化，`-O2` 和 `-O3` 更多代码大小和执行时间的优化，`-Os` 针对代码大小的优化，或每个编译器优化选项。


    ![](img/image_rsrc1MT.jpg)

