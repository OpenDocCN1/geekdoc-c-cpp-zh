    微控制器中，闪存起始地址为十六进制的 `08000000`，该政府将二进制文件写入此地址。


    让我们将注释存储在 `makefile` 中。要在命令行中调用此注释，我们应该输入 `make flesh` 并按回车。另一个实用的注释是擦除整个闪存数组，如果你不确定闪存内容类型，在命令行窗口输入
    `make arrays`。


