    所以当你来到这里时，这是 Ashleigh 输入配置中的入口。第 9 章，第 163 页。你看不到这张图。它有一个输入驱动器。这里是输入引脚，以及进入这个输入引脚的数据。在被
    `CBU` 读取之前，数据会先经过施密触发器（speed trigger）。当微控制器被配置为输入时，这个 `schmitt trigger` 默认是激活的。你不需要手动激活它。


    这里是输出驱动器。这里有一个开关。它表示当输入引脚的输入部分配置为输入时，该开关被禁用。所以当你向输出发送任何内容时，那里只是数据，对引脚不会产生任何影响，因为这个开关现在已经被禁用了。


    我解释一下当微控制器没有施密触发器的情况，比比微控制器没有施密触发器，那么它可能只有一个单阈值，这意味着随机微控制器检测到没有电压，且微控制器引脚的电压高于
    1.7 伏特，那么微控制器读取的状态为 1；如果电压低于 1.7 伏特，微控制器读取的状态为 0。


    让我们考虑这张图，在 `t1` 时刻，微控制器引脚的电压从 0 变为大于 1.7 伏特。现在在 `t1` 时刻，微控制器的状态是 1，当电压高于 1.7 伏特时它变为
    1。只要电压高于 1.7 伏特，微控制器读取的状态将是 1。然后在 `t2` 时刻，这里微控制器引脚 `P` 的电压略低于 1.7 伏特，微控制器读取的状态现在回到
    0，直到微控制器引脚的电压再次高于 1.7 伏特。所以将只有一个单阈值，而这正是我们不希望发生的情况，因为在 `T2` 和 `T3` 点，这种噪声导致微控制器引脚的电压低了
    1.7 伏特。


    ![](img/image_rsrc1S8.jpg)


    这导致微控制器读取的状态从 1 变为 0，然后又回到 1。这就是我们要做的以及要解决的问题，为了解决这个问题，我们需要安装施密触发器。所以这里有一个增强型触发器，这是我在
    Google 上找到的网站。这个施密触发器设计智能触发器设计得非常棒。我们不需要真正理解触发器的后半部分，我们只需要知道它带有双阈值。这意味着只有当微控制器引脚电压低于
    2.5 伏特时，微控制器的状态才会变为 1；如果微控制器引脚电压低于 0.8 伏特，那么微控制器的状态将变为 0。这个阈值值取决于设计者如何设计施密触发器的电路，数据表里并没有实际说明，所以我假设它是
    2.5 和 0.8。


    现在假设 `T1` 是微控制器的电压，它高于 0.8 伏特时，微控制器的状态保持为 0。只有在 `T2` 时刻，当微控制器引脚电压上升到 2.5 伏特，它才会变为
    1。所以现在即使在这个点处有噪声导致微控制器引脚电压低于 2.5 伏特，微控制器的状态现在也不会改变，它仅保持在 1。在 `P4` 点，当微控制器引脚电压低于
    0.8 伏特时，它才会变为 0。这就是使用施密触发器的优势，当电压低于 2.5 伏特时移除此类噪声，你仍然会保持 `S1`，这就是你说的滞后效应（hysteresis
    effect）。微控制器的状态只有在高于或低于特定阈值时才会改变。让我们考虑这条曲线，x 轴是微控制器的电压，y 轴是微控制器的状态位。当微控制器引脚电压高于
    2.5 伏特时，它只会变为 1；然后考虑黄线，当电压从 2.5 伏特缓慢变化并低于 2.5 伏特一直变为 0.8 伏特时，它只有在低于 0.8 伏特时才会改变，这被称为滞后效应，因为它会保持。


