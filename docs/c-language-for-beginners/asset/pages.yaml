    Normally variables are placed in memory (RAM). But you can gain speed by placing
    a few frequently used variables in registers. Registers are memory locations on
    microprocessor. These memory locations on microprocessor are used for internal
    operations of microprocessor. However, you use them if they are free.


    The following is an example to declare a variable with register storage class.


    | register int n;


    The above is a request to compiler to allocate a register to variable n instead
    of allocating memory. If a register is available then n is placed in register,
    otherwise it is as usual given memory allocation.


