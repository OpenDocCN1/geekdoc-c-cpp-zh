    # Character classification functions


    Quite often programmer has to check whether a character is a capital letter or
    a small letter or a digit etc. C provides a set of functions, which can be used
    to determine the type of a character.


    All these functions take a single character and return an integer, which is non-zero
    (true) or zero (false).


    All these character classification functions are defined in ctype.h.


    | Function | What it returns? |

    | isnum(c) | True, if isalpha(c) or isdigit(c). |

    | isalpha(c) | True, if c is an alphabet (both lowercase and uppercase). |

    | iscnt(c) | True, if c is a control character (0 - 31 or 127). |

    | isdigit(c) | True, if c is a numeric digit. |

    | islower(c) | True, if c is a lowercase letter. |

    | isprint(c) | True, if c is a printable character (with ASCII codes from 32 to
    126). |

    | isspace(c) | True, if c is a whitespace character - new line (10), space (32),
    or tab (8). |

    | isupper(c) | True, if c is an uppercase letter. |


    Table 7.1: Character Classification Functions'
