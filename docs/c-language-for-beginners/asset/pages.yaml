  md: "# Add node to list\n\nFinally the node is to be added to list if list is already\
    \ existing. You can find out whether list is existing or not using root pointer.\
    \ If root pointer is NULL, it means the current node is the first node in the\
    \ list. We then set root pointer to current node.\n\n```\n// if first node, make\
    \ root pointer point to it\nif(root == NULL )\n    root = CURRENT;\nelse\n   \
    \ // make previous node point to current node\n    prev -> next = CURRENT;\n```\n\
    \nIf root pointer is not NULL, it means we have already set root pointer to first\
    \ node. So, add the current node after previous node.\n\n# Make current node previous\
    \ node\n\nThe last but not the least is to copy the address of current pointer\
    \ to prev pointer. The current node can be accessed using prev pointer in the\
    \ next iteration.\n\n```\n// make the current node previous node for next iteration\n\
    prev = CURRENT;\n```\n\n# Displaying the list\n\nThe code is used to display the\
    \ complete linked list. It starts with root node using root pointer. Then it continues\
    \ until it encounters last node.\n\n```\n// display the complete list\ncurrent\
    \ = root; // start with root pointer\nwhile (current != NULL)\n{\n    printf(\"\
    %s\\n\", current->name);\n    // move to next node\n    current = current -> next;\n\
    } // end of while loop\n```\n\nThe code sets current pointer to root pointer.\
    \ Every time after displaying the current node, it moves to next node using next\
    \ pointer of the current node. If next pointer is NULL, it means we reached end\
    \ of the list and while loop is terminated."
