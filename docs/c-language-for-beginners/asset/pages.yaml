    \ are other variants like circular list, and two-way list, which I am not able\
    \ to accommodate here.\n\n# Summary\n\n+   - A linked list is a sophisticated\
    \ data structure that allows you to store a collection of values. Values are stored\
    \ in the form of nodes and these nodes are logically ordered. That means physically\
    \ they may be placed anywhere in the memory and in any order but they can be accessed\
