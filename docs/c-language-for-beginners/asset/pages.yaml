  md: '# 11.USER-DEFINED FUNCTIONS


    Functions are building blocks of a C program. In this chapter, we will understand
    what a function is, and how to create and use functions. Understanding functions
    is one of the most important steps in C language.


    +   - What is a function?

    - Standard functions

    - User-defined functions

    - Creating user-defined functions

    - Passing parameters

    - Returning a value

    - Function declaration and definition

    - Recursion

    - Summary

    - Exercises


    # What is a function?


    A function is a collection of instructions that performs a specific task. Every
    function is given a name. The name of the function is used to invoke (call) the
    function. A function may also take parameters (arguments). Parameters are to be
    passed within parentheses at the time of invoking function.


    A function theoretically also returns a value, but you can ignore the return value
    of the function in C language.


    C is a function-oriented language. Many operations in C language are done through
    functions. For example, we have used printf() function to display values, scanf()
    function to read values from keyboard, strlen() function to get the length of
    the string etc.


    Functions are of four types:


    +   - Functions that take nothing and return nothing

    - Functions that take nothing but return a value'
