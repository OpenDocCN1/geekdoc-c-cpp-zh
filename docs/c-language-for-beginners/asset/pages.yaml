    # Algorithm


    In selection sort, each element is taken and compared with all the following elements.
    If any of the elements is found smaller than the element in question, then the
    elements are interchanged. Comparison should go on till all following elements
    are compared. If the above process is repeated until the last-one element of the
    array then the total array will be in sorted order.


    The following program illustrates how to use this algorithm. It sorts an array
    of 10 integers in the ascending order.


    ```

    01: // Sort array with Selection sort

    02: #include <stdio.h>

    03:

    04: void main()

    05: {

    06:     int arr[10];

    07:     int i,j,temp;

    08:

    09:     // Fill array with random numbers

