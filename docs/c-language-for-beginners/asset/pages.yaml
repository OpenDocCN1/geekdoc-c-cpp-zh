  md: "# C Language For Beginners\n\n# Taking name from user\n\nThe program takes\
    \ one name at a time from user. If name is equivalent to end, it means user wants\
    \ to end inputting.\n\n```\n// take one name at a time\nprintf(\"Enter name of\
    \ player [end to stop]:\");\ngets(input_name);\n```\n\n```\nif(strcmp(input_name,\
    \ \"end\") == 0)\n   break; // come out of loop\n```\n\nThis section of code is\
    \ inside a never-ending while loop. So, we have to terminate loop when user enters\
    \ end.\n\n# Creating a node\n\nAfter taking a name from user, we have to create\
    \ a node in the memory. Node is to be allocated dynamically using malloc function.\
    \ The return value of malloc should be typecast to a struct node pointer.\n\n\
    ```\n// allocation of a node\ncurrent = (struct node*) malloc(sizeof(struct node));\n\
    if (current == NULL)\n{\n```\n\n```\n   printf(\"Memory allocation error\");\n\
    \   exit(1);\n}\n```\n\n```\n// put data and address into new node\n```\n\n```\n\
    strcpy(current -> name, input_name);\n// last node's next must be set to NULL\n\
    current->next = NULL;\n```\n\nAfter node is allocated, we need to copy the name\
