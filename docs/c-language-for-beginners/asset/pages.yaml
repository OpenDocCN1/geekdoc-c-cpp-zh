  md: '# Features Of C


    Each programming language has its own idiosyncrasies. So is the case with C. Now,
    let us understand what are the main features of C language.


    # Few Keywords


    There are only 32 keywords in C language. Keyword is a word that is assigned a
    pre-defined task in the language. As C has only a few keywords, a C programmer
    has only a few names to remember.


    # Case Sensitive


    C case sensitive. It means Capital letters are different from small letters. So,
    variable ''A'' is different from variable ''a''. So, you have two variables: one
    in uppercase and another in lower case. Case sensitivity applies even to keywords
    and other elements of the language. All keywords are in lower case. It could be
    a bit tedious to ensure that you type everything in the required case. But as
    you write more and more programs you get used to that that hardly becomes a matter
    of concern.


    # Rich in Operators


    C has more of operators than other programming languages. An operator is a symbol
    that performs a single operation like addition. By using operators, C programmer
    can make source-code very compact - at the same time cryptic. We will discuss
    in detail all the operators available in C in chapter 4.


    # No Input/Output


    C does not provide any input/output facilities as part of the language. However,
    this handicap of C is never felt because all compilers provide a set of functions
    to deal with I/O. ANSI has also included these functions as part of standard C.
    Apart from the set, compilers normally provide more functions to deal with various
    forms of I/O as writing directly at a particular position of the screen.


    However, these extra functions provided by compilers are not consistent across
    compilers. That means, extra functions that you find in one compiler may not be
    provided by another compiler. So, if your program depends on these extra functions
    provided by compiler then it becomes less portable as it becomes dependent.


    # Low-level Language Features


    As C was designed for system programming, it was very important for it to provide
    direct access to system resources as disk and memory. C has done enough to maintain
    balance between high-level language features and low-level language features.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# C Language For Beginners


    # Function Oriented


    Everything in C is through a function. Program itself begins its execution with
    a function called main. Entire program is written as a collection of functions.
    When main function is terminated the program is deemed to be terminated. Every
    C compiler provides a collection of functions using which majority of the operations
    are done. For example, I/O, string manipulation, graphics etc., all these are
    done through a collection of built-in functions.


    Every compiler provides ready-made functions called as built-in functions or standard
    functions. However, it is also possible for programmers to create more functions
    in the program. These are called as user-defined functions.


    # Structured Language


    A structured language allows programmer to divide program into modules and provides
    all basic control structures like if statement, for loop, while loop, and switch
    statement. C is one of the structured languages.


    # Weakly typed language


    There is no strict data type checking. You can change the type of data from one
    type to another type as data types are compatible. For example, you can convert
    an integer to float and vice-versa. As C does not strictly enforce type checking,
    it is called as Weakly Typed Language.


    # Liberal and error prone


    C does not check for errors. For example, C does not check for array boundary
    violation. It means you can declare array of 10 elements and access 11th element
    of it. C allows you to do so. As you may know, accessing 11th element of an array
    of only 10 elements will access the memory that does not belong to array. It is
    very important for you to understand – as C programmer – unless you check for
    such things you might have severe logical errors.


    The philosophy of C is that programmer knows what he is doing. You can use the
    flexibility of C either to your advantage or you may be a victim of this flexibility.
    Though this gives a lot of flexibility to advanced programmers, beginners will
    sometimes get carried away and run into serious logical errors.'
  merge: -1
