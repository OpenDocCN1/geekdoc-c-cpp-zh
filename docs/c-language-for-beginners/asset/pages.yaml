  md: "# switch Statement\n\nWhen the number of conditions to be checked is more;\
    \ then if statements become lengthy and difficult to understand. A better alternative\
    \ is switch statement. It is used to take different actions based on the result\
    \ of multiple conditions using the same expression.\n\nIf you have to find out\
    \ discount rate depending on product code, the following switch statement can\
    \ be used.\n\n```\nswitch(pc)\n{\n  case 1 : dis = 0.07; break;\n  case 2 : dis\
    \ = 0.08; break;\n  case 3 : dis = 0.05; break;\n  case 4 : dis = 0.06; break;\n\
    \  case 5 : dis = 0.03; break;\n  default : dis = 0.02;\n};\n```\n\nFirst value\
    \ of pc is compared with 1. If condition is true then corresponding statements\
    \ are executed. Otherwise next case is checked and so on. If none of the cases\
    \ is true then statement given after default will be executed.\n\nBy default switch\
    \ executes all statements from the case where condition is true. That means if\
    \ pc is 2 then all the statements starting from case 2 will be executed. In order\
    \ to prevent code of other cases from getting executed, you must use break statement\
    \ to come out of entire switch statement.\n\nTo transfer out of switch after the\
    \ relevant statements are executed, break statement is used. Though break is not\
    \ part of switch statement syntax, it is typically used with each case in switch\
    \ statement.\n\n```\nswitch (expression)\n{\n  case value-1 : statements;\n  [case\
    \ value-2 : statements] ...\n  [default : statements]\n}\n```\n\nAt least one\
    \ case is must and second case onwards is optional and default is optional."
