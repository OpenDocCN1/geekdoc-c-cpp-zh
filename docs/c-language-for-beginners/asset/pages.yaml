- img_proc: true
  md: '22


    C Language For Beginners


    # Line 1


    It is a comment or remark. We give comments to make program more readable. Comments
    in C start with /* (slash and asterisk) and end with */ (asterisk and slash) combination.
    A comment can be given in multiple lines also.


    If you want to have a single line comment then you use two slashes (//) followed
    by comment.


    ```

    // This is a single line comment

    /* This comment runs into

    multiple lines. */

    ```


    # Line 2


    This is a pre-processor command. #include command is used to copy the contents
    of the generic file into your program. In this example #include is used to include
    the contents of stdio.h header file. Though this is not mandatory it is better
    to include the header file (.h files are called as header files) using #include
    command. We will discuss more about #include in chapter 17.


