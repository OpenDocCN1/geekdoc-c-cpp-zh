    The while loop and for loop are perfectly interchangeable. A while loop can also
    be implemented using loop and vice-versa. do...while works in a different way.
    The simple difference between do...while and is, do...while the minimum number
    of repetitions is 1 whereas in loop it is 0.


    The break is used to terminate loop and continue is used to skip the following
    statements and start the next repetition.


    When a loop is inside another loop it is called as nested loop. Inner loop is
    executed for each iteration of outer loop.


