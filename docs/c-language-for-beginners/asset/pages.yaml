    , *p);\n14: \n15:         // increment p so it points to next element\n16:   \
    \      p++;\n17:     }\n18:     /* Now display array in reverse order.*/\n19:\
    \     --p is used to make pointer point to previous element.\n20:     p >= a will\
    \ be true as long as p points to an\n21:         element that is at or first element\
    \ in array a.\n22:     */\n23:     for(--p; p >= a; p--)\n24:         printf(\"\
    %5d\", *p);\n25: }\n```\n\nAccessing the array using a pointer notation is faster\
    \ than using array notation. When you array notation like a[i], every time the\
    \ value of i is added to address of a to get required address and then value is\
    \ taken from that address. On the other hand, when you have the address in p and\
    \ increment it every time other than incrementing pointer there are no other calculations\
    \ involved. So, using pointer makes access faster than array.\n\nBut the difference\
    \ could be minimum unless you use a lot of pointers and access large arrays. So,\
    \ array notation could be simple and whereas pointer notation is faster and error\
    \ prone (at least in the beginning)."
