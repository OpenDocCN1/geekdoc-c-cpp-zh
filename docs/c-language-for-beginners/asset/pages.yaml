  md: "# Subtracting an integer from pointer\n\nSubtracting one from a pointer makes\
    \ pointer pointing to previous element. That means the pointer is decremented\
    \ by the size of the data type to which the pointer is pointing.\n\nThe following\
    \ program uses pointer arithmetic to access an array.\n\n```\n01: // program to\
    \ access an array using pointer\n02: main()\n03: {\n04:     int a[10];\n05:  \
    \   int *p, c;\n06: \n07:     // get values into array\n08:     for (c = 0; c\
