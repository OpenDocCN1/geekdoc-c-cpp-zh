  md: '# C Language For Beginners


    In the above command, **count** is the name of the program (count.exe) and **a.txt**
    is command line argument passed to the program.


    If you want to pass more than one argument, then separate arguments with one or
    more spaces as shown below.


    ```

    c:\cprog a.txt b.txt c.txt

    ```


    # argc and argv parameters


    The values passed on the command line are to be received by the program. For that
    main function has two parameters. These parameters will contain the values passed
    on the command line.


    # argc


    Contains the number of arguments given on command line. It always contains one,
    as program name is always taken as first argument.


    It is of **int** type and must be the first parameter.


    # argv


    This is an array of strings (char *). It contains values given on the command
    line. First parameter is always the name of the program executed. Second parameter
    onwards it contains the values given by user on the command line.


    If user invokes COUNT as follows:


    ```

    c:\cprog a.txt b.txt

    ```


    **argc** contains value 3 as there are three arguments.


    **argv** contains three elements with 0th element containing the program name,
    first and second elements containing **a.txt** and **b.txt** respectively.


    The following program will illustrate how to declare these parameters with **main**
    function and use command line arguments.'
