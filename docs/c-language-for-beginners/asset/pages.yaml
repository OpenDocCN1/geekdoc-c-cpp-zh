  md: '# 14.POINTER vs. ARRAY


    In the previous chapter, we have seen what a pointer is and how to use it. In
    this chapter, we are going to see the relationship between a pointer and an array.


    +   - Similarities between pointer and array

    - Array and pass by reference

    - Pointer arithmetic

    - Dissimilarities between pointer and array name

    - Pointer to pointer

    - Array of pointers

    - Pointer to function

    - Summary

    - Exercises


    # Similarities between pointer and array


    A pointer and an array are similar in some respects. To understand the similarities,
    first you have to see array name more closely. So observe what happens when we
    declare an array


    ```

    int a[5];

    ```


    Here a is the name of the array, which contains five integers. Figure 14.1 shows
    the memory picture of the array.


    Array name a contains address of the first element of the array. That means the
    address of first element of the array and the value of array name are same.


    ```

    &a[0] == a

    ```'
