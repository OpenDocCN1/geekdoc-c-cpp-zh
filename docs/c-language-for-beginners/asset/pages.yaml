    # What is pre-processor?


    Pre-processor is a program that processes C program before program is given to
    compiler. There are a few commands that are processed by pre-processor. All pre-processor
    commands start with # (hash) symbol.


    As you can see in figure 17.1, source code of C program is first given to pre-processor.
    The output of pre-processor is given to C compiler, which will compile the program
    to generate object code.


    All pre-processor commands are processed by pre-processor and compiler is not
    even aware of these commands.


    # Pre-processor commands are used for the following:


    +   - Define symbolic constants

    - Define macros

    - Include content of file

    - Conditionally compile source code'
