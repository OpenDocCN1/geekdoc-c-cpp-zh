  md: '# C Language For Beginners


    # Passing parameters


    Though line is functional, it always does the same thing. I mean, it always displays
    a line of 79 hyphens. But what if we want to have a line of only 30 characters
    and not 79 characters.


    It would be far more flexible and versatile if line function were to take length
    and draw line of that length. For this, function is to slightly modified to take
    a parameter and use that parameter. A parameter or argument is a value passed
    to function so function can use that value while performing task. A function may
    take none, or more parameters depending upon the need.


    Here is the modified version of line function.


    ```

    01: // parameter len specifies size of the line

    02: void line(int len)

    03: {

    04:     // draw a line of size len

    05:     for(; len > 0; len--)

    06:         putch(''-'');

    07: }

    08:

    09: void main()

    10: {

    11:     // call line function with different lengths

    12:     line(10);

    13:     putch(''\\n'');

    14:     line(40);

    15:     putch(''\\n'');

    16:     line(20);

    17: }

    ```


    # Output


    |----------------------------------------------------------------|


    Whenever we call line function, we have to pass a value in parentheses. The value
    passed is placed in variable declared in parentheses of function definition (int
    len). In the function, the passed value is referenced using parameter (len).'
