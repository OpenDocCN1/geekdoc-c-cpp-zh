    # The gets() and puts() functions


    You can use scanf() function with %s conversion character to read a string. But
    as we have seen earlier, it has a limitation. scanf() treats whitespace as the
    end of input and space being one of the whitespace character, it cannot be given
    as part of the string. That means you can get only one word.


    So, C provides another function gets() to read string which may contain spaces.
    Function gets() reads all characters until you press ENTER and stores them in
    the given string. Of course, it stores null character at the end of all the characters.


    The following code snippet shows how to use gets() function.


    ```

