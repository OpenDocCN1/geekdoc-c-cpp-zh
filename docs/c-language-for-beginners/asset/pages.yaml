  md: '# Writing to binary file with fwrite()


    A data file is another example of binary file. Data file is a collection of records.
    Each record is a structure. The content of structure variable is copied from memory
    to file as it is. So, if an integer is occupying two bytes then it occupies the
    same number of bytes even on the file and the exact memory image is copied to
    file.


    Now let us deal with a data file with the name STUDENT.DAT to store the details
    of students.


    ```

    01: /* program to take the details of student and

    02:    store details in file STUDENT.DAT */

    03:

    04: #include <stdio.h>

    05: // declare structure

    06: struct student

    07: {

    08:     int sno;

    09:     char sname[20];

    10:     int tf;      // total fee to be paid

    11:     int fp;      // fee paid so far

    12: };

    13:

    14: main()

    15: {

    16:     FILE * fp;

    17:     struct student s;

    18:     // open file for writing in binary mode

    19:     fp = fopen("student.dat", "wb");

    20:

    21:     // Take details of student

    22:     printf("Enter student details :");

    23:     scanf("%d%s%d", &s.sno, s.sname, &s.tf, &s.fp);

    24:

    25:     // Write contents of structure variable s

    26:     fwrite(&s, sizeof(s), 1, fp);

    27:

    28:

    29:     // close file

    30:     fclose(fp);

    31: }

    ```'
