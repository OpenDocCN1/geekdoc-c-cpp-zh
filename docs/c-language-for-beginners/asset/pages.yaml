  md: '# Binary Search Steps


    +   1. Make sure array is in the sorted order. It doesn''t work unless array is
    sorted.


    +   2. Take middle element of the array.


    +   3. Check whether number is equal to that element.


    +   4. If number is equivalent to the value of middle element then stop search
    and quit.


    +   5. If value of the middle element is greater than the number, then it is clear
    that the number we are looking for will be found only on the left of the middle
    element. This is because the array is already sorted order. Binary search doesn''t
    work unless array is already sorted.


    +   6. So, take left element of the middle element as right element for next search.
    As you can see, now we reduced the number of elements to be searched to half of
    the previous size. That is why this is called as binary search (you know binary
    means 2).


    +   7. If value of the middle element is less than the number we are searching
    for, then take right element of the middle element as the left element of the
    array. The reason for this is simple (as explained above), now we know that value
    cannot exist on the left of the middle element.


    +   8. Now go to step 2 and do the same until left most element exceeds right
    most element, in which case, you can conclude that the value is not found in the
    array.


    Here is the program to search the array using binary search algorithm. Remember
    the program assumes the array is already in the sorted order. Before trying this
    program, either you sort the array or enter values into array in the sorted order.'
