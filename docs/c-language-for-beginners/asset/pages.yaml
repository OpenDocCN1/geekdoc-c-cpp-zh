  md: '# 98 C Language For Beginners


    Declarations about standard functions are available in header files such as stdio.h,
    and string.h.


    We will discuss more about difference between function declaration and function
    definition later in this chapter.


    # Compiler dependent functions


    Out of standard functions, some functions are compiler dependent. That means these
    functions are not available in all compilers. For example, Turbo C comes with
    functions clrcsc(), and getoty(). But these functions will not be found on UNIX
    C compiler and instead some other functions doing similar task will be available.


    # ANSI C functions


    Some functions as printf(), isupper() etc. are ANSI C functions. That means these
    functions are to be made available by every C compiler. So, if you are planning
    to compile your C program with different compilers then you better stick to these
    functions only these functions are standard.


    # User-defined functions


    User-defined function is a function that is defined by user. That means, the code
    for the function is written by user (programmer). User-defined functions are similar
    to standard functions in the way you call. The only difference is instead of C
    language providing the function, programmer creates the function.


    In nutshell, a function created by user is called as user-defined function.


    User-defined functions are used mainly for two purposes:


    # To avoid repetition of code


    In programming, you often come the need to execute the same code in different
    places in the program. For example, assume you have to print an array at the beginning
    of the program and at the end of the program. Without a function you have to write
    the code to display the array twice (see figure 11.1).


    If you create a function to display the array, then you have to call the function
    once at the beginning of the program and once at the end of the program. That
    means, the source code need not be written for multiple times. It is written only
    once and called multiple times (see figure 11.2).'
