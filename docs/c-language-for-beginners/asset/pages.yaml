  md: "# C Language For Beginners\n\n# Random access\n\nWe have so far accessed the\
    \ file sequentially. That means, we accessed from first byte to last byte. But\
    \ it is also possible to access the file from a particular location.\n\nWhen you\
    \ read/write file from a specific position it is called as Random Access. When\
    \ you access the file from beginning to end it is called as Sequential Access.\n\
    \nWhen you open a file, pointer that contains the position from where you read/write\
    \ next character is set to beginning of file. As you read/write, pointer is updated\
    \ to point to next byte. When pointer reaches position where there are no more\
    \ bytes in the file, then it is to reach end-of-file.\n\nRandom access means moving\
    \ the pointer to the required location and read/write content at that location.\n\
    \nTo move pointer to the required location use fseek() function.\n\n# fseek()\
    \ function\n\nMoves file pointer to specified position so that next I/O will take\
    \ place from that position.\n\n```\nint fseek(FILE * fp, long offset, int base);\n\
    ```\n\n| FILE * fp | The file in which file pointer is to be. |\n| long offset\
    \ | The number of bytes by which pointer should move from the base. Positive value\
    \ moves forward and negative value moves backward. |\n| base | This indicates\
    \ from where the movement should take place. It may be any of the following. \n\
    \ 0 - Beginning of the file\n 1 - Current position in the file\n 2 - End of the\
    \ file\n Instead of numbers the symbolic constants - SEEK_SET, SEEK_CUR, SEEK_END,\
    \ which are declared in stdio.h, can also be used. |"
