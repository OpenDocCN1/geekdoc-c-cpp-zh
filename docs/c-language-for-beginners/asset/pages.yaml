    # How to write a simple C program?


    Programming is learnt by doing it not by reading about it. Learning a programming
    language is like learning how to ride a cycle. You got to try it. You might fall
    down a few times and get hurt, but ultimately you will learn it. The same is true
    with programming. You have write programs to learn programming. Do not worry and
    not be afraid of programming. It is a wonderful world. The more you do, the more
    you enjoy – take my word. Now us write our first C program. The following is a
    simple C program to display the given message on the screen


    ```

    01: // Program to display a message on the screen

    02: #include <stdio.h>

    03: main(){

    04: {

    05:     printf("Welcome To C Language");

    06: }

    ```


    > Note: Do not type line numbers and : (colon), they are used only for explanation
    purpose.


    When you run the above program, the following output will be displayed.


    | Welcome To C Language |


    Now, let us understand what each line of the above program does.'
  merge: -1
