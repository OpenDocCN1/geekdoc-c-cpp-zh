  md: '# 7.CHARACTER HANDLING


    Character (char) data type is used to store one character. In this chapter, we
    will understand how character is stored in memory and what are the functions that
    are associated with char data type.


    +   - Storage

    - Character related input-output functions

    - Character classification functions

    - Conversion functions

    - Summary

    - Exercises


    # Storage


    You store a single character in a char variable. A char variable contains the
    ASCII (American Standard Code for Information Interchange) code of the character
    that we want to store. ASCII code is a number to represent each character that
    is stored in memory (both in RAM and disk).


    Though C stores ASCII of the character, it can accept and display a character
    and not as a number. The following example will ratify.


    ```

    char ch;

    ch = ''A'';      // stores ASCII code(65) of A into ch

    ch = 65;       // the same as above

    printf("%c", ch); // displays A on the screen

    ```


    Internally a character is stored as a numeric, you can also have arithmetic character
    variables.


    ```

    // store A into char

    ch = ''A'';

    ch++;      // will increment ch to 66, means character B

    ```'
