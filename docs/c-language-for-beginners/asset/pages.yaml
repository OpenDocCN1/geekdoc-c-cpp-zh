  md: '# 10.STRING HANDLING


    A string is a collection of characters. In the absence of string data to store
    strings, in C we have to simulate string using an array of characters. In this
    chapter, we will understand how to handle strings in C language. We will also
    look at some of the standard functions related to strings.


    +   - How to declare a string?

    - How string is stored?

    - Input/Output of Strings

    - Treating a string as an array

    - The gets() and puts() functions

    - String Library

    - String comparison

    - Summary

    - Exercises


    # How to declare a string?


    A string is a collection of characters. An array of characters is also a collection
    of characters. So, an array of characters is used to represent a string in C.
    For example, to store a name, which may be up to 50 characters, you would declare
    a string as follows:


    ```

    // name can contain up to 50 characters */

    char name[50];


    // names is an array of 10 strings each of 20 chars

    char names[10][20];

    ```


    # How string is stored?


    A string is stored as an array in the memory. However, when you declare a string
    of 20 characters, it doesn''t always contain 20 characters. It may contain only
    15 characters. So, to identify the end of the actual characters in a string, C
    is storing a null character'
