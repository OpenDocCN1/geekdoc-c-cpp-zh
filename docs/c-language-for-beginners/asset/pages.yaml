  md: '# C Language For Beginners


    # Typecasting


    Typecasting can be used to convert one type of value to another type explicitly.
    For example, the following converts a long int variable to int type and stores
    it in int variable. It may be noted that C automatically does the conversion on
    its own. Still there are cases where we have to do it explicitly.


    ```

    int a;

    long int b = 100;


    a = (int) b;

    ```


    The syntax of the typecasting is:


    ```

    (data type) value

    ```


    Data type is the type of data to which value is to be converted. Of course the
    data type and the value are to be compatible. I mean, value must be convertible
    to the specified data type.


    Let us assume we need to calculate average given total and count. Both total and
    count variables are declared as int and average as float.


    ```

    average = total / count;

    printf("%f", average);

    ```


    However, division between two integers will always return another int. So, we
    need to convert one of the values in the expression to float to get a float value
    as shown using type casting:


    ```

    average = total / (float) count;

    printf("%f", average);

    ```'
