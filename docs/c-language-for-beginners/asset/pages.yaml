    starting from the given address.


    The same will be the process for ***fp**, but it will take value from four bytes
    (250 to 253 in the example) as **float** occupies four bytes.


    It is very important to note the number of bytes that a pointer reads to take
    the value depends on the size of the **data type** used in *pointer declaration.*'
