  md: '# 15.STRUCTURES


    We often have to store a collection of values. When the collection is of the same
    type then array is used to store values. When a collection of values related to
    an entity is be stored as one unit, we use structures. In this chapter, we will
    see how to use structures to deal with a collection of values.


    +   - What is a structure?

    - How to declare a structure?

    - Declaring structure variables

    - Accessing a member

    - Array of structures

    - Structures and assignment

    - Initialization of structure variable

    - Structure and function

    - Return a structure

    - Pointer to structure

    - Nested structures

    - Using nested structures

    - Summary

    - Exercises


    # What is a structure?


    A structure is a collection of items, which may be of different types, commonly
    referenced using one name.


    Each item in the structure is called as a **member**.


    Typically programming languages provide two facilities to store collection of
    values - arrays and structures or records. Arrays are used to store collection
    of values of the type. When we want to store values that may be of different types
    we have to use a structure. A structure is like a record. It contains a collection
    of members (also called as fields).'
