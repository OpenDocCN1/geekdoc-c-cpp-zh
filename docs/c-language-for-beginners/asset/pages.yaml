    # #include


    This is used to include the content of a file into current program. Files with
    extension .h are called as header files. Header files contain declaration of structures,
    prototype declaration of functions etc.


    All standard header files like stdio.h are included using #include.


    | #include <file> |

    | #include "file" |


    When file is enclosed in <> (angle brackets), C looks for the specified header
    file in the standard directory, which is compiler dependent.


    When file is enclosed in double quotes, pre-processor first looks for the file
    in the current directory. If file is not found then standard directory is searched.
    This is useful to include user-defined header file, because user-defined include
    files are not placed in standard'
