  md: "# Declaring structure\n\nWe first need to create a data type that can be used\
    \ to represent a node in memory. Node contains a char array and a pointer to struct\
    \ node. To accommodate these two different values, we have to create a structure.\n\
    \n```\nstruct node\n{\n  char name[30];\n  struct node * next;\n};\n```\n\nWe\
    \ created a structure call struct node, which contains members name to store name\
    \ and next to store the address of next node.\n\nAs the next node is nothing but\
    \ another struct node block, next is a pointer pointing to struct node.\n\n> Note:\
    \ When a structure contains a pointer that points to another object of the same\
    \ structure, the structure is called as self-referential structure.\n\n# Creating\
    \ pointer variables\n\nAfter structure is declared, we need to create a few pointer\
    \ variables of the struct node type. The usage of these pointer variables is given\
    \ below.\n\n```\nstruct node * root = NULL, *prev, * current\n```\n\nroot is used\
    \ to point to the very first node of the list. If this is NULL, it means the list\
    \ is empty.\n\ncurrent points to the node that is currently allocated.\n\nprev\
    \ points to previous node. It is used to make the previous node pointing to current\
    \ node. Current node of the current iteration should become previous node for\
    \ the next iteration."
  merge: -1
