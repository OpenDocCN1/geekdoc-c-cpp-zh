    # Array and pass by reference


    Whenever you send an array to function as parameter, you send the address of the
    array and not the complete array. That means, whenever array is passed, it is
    passed by reference. To understand that consider the following.


    ```

    01: main()

    02: {

    03:   int a[5];

    04:   zerofill(a);      // pass the array

    05: }

    06: zerofill(int x [5])

    07: {

    08:   int i;

    09:   for(i = 0; i < 5; i++)

    10:    x[i] = 0;

    11: }

    ```


    Here the actual array x (in main()) gets filled up. Because what we get into parameter
    x in function fill is nothing but the starting address of array a - the address
    of first element in array a.


    As formal parameter x of function fill is nothing a pointer pointing to first
    element of a, any of the following would be valid declarations for x.


    ```

    zerofill(int * x)

    zerofill(int x[5])

    zerofill(int x[])

    ```


    First declaration declares x as an integer pointer. In fact, all that C needs
    here is a pointer to integer. Parameter x in second and third declarations is
    also internally taken as an integer pointer by C. Though you specify the number
    of elements for the array, C ignores it. So, x[5] and x[10] are one and the same.'
