    Whenever max is called, it is to be passed two values. Given two (x and y) values
    will be used to replace a and b names used in macro code.


    In max (x, y), x will replace every occurrence of a in the macro code and y will
    replace b.

    So, the macro code > b ? a : b will become x > y ? x : y and that will replace
    call to macro -max(x, y).


    The following are few guidelines regarding when to consider a macro and when to
    consider a function:


    +   - Use macro when code is less and the macro is not used for many times.

    - Use function when code is more and function is called large number of times.

    - A function is used when size of program is to be small. But execution speed
    suffers because transferring control to function and returning control to calling
    function do some time.

    - Use macro when speed is important. But size of the program might grow considerably
    as each call to macro is replaced with the corresponding code.


