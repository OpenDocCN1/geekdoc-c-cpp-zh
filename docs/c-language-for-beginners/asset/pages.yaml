  md: '# scanf() and &


    We have been using & in order to read values into variables using scanf(). Now
    it is time to understand why & is required. Also remember we do not need & while
    reading value into a string.


    When we use &, we take the address of the variable and send the address as parameter
    to scanf() function. We have to pass address of the variable while using scanf()
    because we want scanf() to change the value of variable with the value it reads
    from keyboard.


    In other words we are using pass by reference by sending address of variable to
    scanf().


    But & is not required while using strings. This is because of the fact that string
    is an array and array itself contains the address. So, no need to take address
    of the array. We will discuss more about it in the next chapter.


    Now you understand why you have to use address operator while using scanf(). Unless
    you pass address of variable, it is not possible for scanf() to change the value
    of variable.'
