    # What is a command line argument?


    Once you compile a C program, you get .OBJ file. If we link object file with libraries
    we get executable (.exe) file. An executable file can be run directly from system
    prompt. The other way of running the program is from IDE.


    To run executable file from system prompt, all you have to do is type the filename
    at the system prompt. For example, if the filename is COUNT.C it becomes COUNT.EXE
    after compilation and linking. Then you can type as shown below to execute it.


    ```

    c:\cprog>COUNT

    ```


    The above command will run COUNT.EXE.


    > Note: The line on which commands can be issued is called as command line.


    While you are running a program you can send values to the program by giving values
    on the command line line after the program name. The values passed to program
    on the command line are called as command line arguments.


    ```

    c:\cprog>count a.txt

    ```'
