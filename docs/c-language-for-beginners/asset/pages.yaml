  md: '# while loop


    Executes the statement as long as the given condition is true. When condition
    is false the loop is terminated and next statement following the loop will be
    executed.


    The following example illustrates how to use while loop.


    ```

    01: // Program to print numbers from 1 to 10

    02: #include <stdio.h>

    03:

    04: void main()

    05: {

    06: int n = 1;

    07:

    08: // repeat loop as long as n is less than 11

    09: while (n < 11)

    10: {

    11:     printf("%d\n", n);

    12:     n++; // Increment n by one

    13: } // end of the while loop

    14: }

    ```


    The above while loop will display numbers from 1 to 10 on the screen.


    The following is the syntax of while loop.


    while (condition)

    statement;


    Condition is any valid C condition. Statement is repeatedly executed as long as
    condition is true. Once condition is false, loop is terminated and control is
    transferred to the statement that is immediately after the loop.


    Statement may be either a single statement or a compound statement.


