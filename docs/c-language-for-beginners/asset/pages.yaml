  md: "# Scope\n\nThe area of the program from where a variable can be accessed is\
    \ called as scope of the variable. Scope of the variable depends on where the\
    \ variable is declared.\n\nThe following snippet will illustrate scope of a variable.\n\
    \n```\n// Scope of g is here from here to end of program\nint g;\n\nmain()\\{\n\
    \    int x; // Scope of x is throughout main function\n}\nvoid sum(){\n    int\
    \ y; // Scope of y is throughout function sum\n....\n}\n```\n\nThe scope of a\
    \ variable may be either **global** or **local**.\n\n# Global Scope\n\nIt means\
    \ the variable is available throughout the program. It is available to all the\
    \ functions that are defined after the declaration of the variable.\n\nThis is\
    \ the scope of the variables that are declared outside of all functions. As we\
    \ have seen in the previous example, variable **g** has global scope. Which means,\
    \ the variable is accessible to all the functions (main, sum) of the program that\
    \ are defined after the variable defined.\n\n# Local Scope\n\nVariables declared\
    \ within a block (like **x** and **y** in the previous example) are available\
    \ only to that block in which they are declared.\n\nWhen the scope of the variable\
    \ is confined to block it is called as **Local scope**."
