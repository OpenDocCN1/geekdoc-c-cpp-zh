  md: "# C Language For Beginners\n\nBy default, C passes only values of the variables\
    \ to parameters. When only values of variables are passed to parameters in function,\
    \ it is called pass by value.\n\nIn pass by value, changes made to formal parameters\
    \ (a and b in swap()) have no impact on actual parameters (x and y of main()).\
    \ But this is not enough in this example and we need to somehow have access to\
    \ original locations of x and y and change values there. This is exactly what\
    \ a pointer can do.\n\n# Pass by reference\n\nTo change the value of actual parameter\
    \ by changing the formal parameter you have to pass address of actual parameter,\
    \ not the value.\n\nWhen you are sending the address of actual parameter, you\
    \ have to take that into a pointer. That means the formal parameter must be a\
    \ pointer.\n\nFollowing is the modified version of previous program to swap two\
    \ integers.\n\n```\n01: // Program to swap (interchange) two integers\n02: void\
    \ swap(int*, int*) // prototype\n03: main()\n04: {\n05:     int x, y;\n06: \n\
    07:     printf(\"Enter two numbers : \");\n08:     scanf(\"%d%d\", &x, &y);\n\
    09: \n10:     swap(&x, &y);\n11:     printf(\"Interchanged values are: %d, %d\"\
    ,\n12: }\n13: void swap(int * a, int * b)\n14: {\n15:     int temp;\n16: \n17:\
    \     temp = *a;\n18:     *a = *b;\n19:     *b = temp;\n20: }\n```"
