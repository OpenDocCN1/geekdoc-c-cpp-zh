    # #define


    This is used to declare symbolic constants and macros. A symbolic constant is
    a name that represents a value. Wherever symbolic constant is used in the program
    it is replaced with corresponding value.


    The following #define command is used to define symbolic constant MAX to represent
    value 20.


    ```

    #define MAX 20

    ```


    Wherever MAX is used in program, MAX is replaced with 20 by pre-processor. Remember,
    the compiler is not even aware of MAX as by the time source code is given to compiler,
    all pre-processor commands would have been processed by pre-processor and MAX
    is replaced with 20.


    > Note: It is a general practice to use all uppercase names for symbolic constants.
    It helps to differentiate symbolic constants from variables.


    # Macro


    Directive #define can also be used to declare macros. Macro is a name that is
    replaced with a collection of instructions. It is identical to a function in usage.


    When a function is called, control is transferred to first statement in the function.
    No matter how many times the function is invoked, only once for the code of the
    function is placed in the program.


    When a macro is called, macro name is replaced with set of instructions. So, if
