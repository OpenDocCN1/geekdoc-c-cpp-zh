    # continue statement


    This is used to transfer control to the beginning of the loop from within the
    loop. It is used to skip the statements after continue statement and enter into
    next iteration of the loop.


    The following example will give you some idea about how it works. The program
    takes 10 positive numbers and displays the sum of the numbers.


    ```

    01: #include <stdio.h>

    02:

    03: void main()

    04: {

    05:   int n, sum, i;

    06:

    07:   sum = 0;

    08:   i = 1;

    09:   while ( i <= 10 )

    10:  {

    11:     printf("Enter a number : ",

    12:     scanf("%d", &n);

    13:

    14:     /* skip the remaining statements

    15:        if number is negative */

    16:

    17:     if ( n < 0 )

    18:       continue;

    19:

    20:     i++;

    21:     sum += n;

    22:   }

    23:   printf("Sum = : %d", sum);

    24: }

    ```


    Whenever the value of n is less than 0 (negative) then the statements between
    continue and end of the loop { } are ignored and control is used the next repetition
    of the loop. That means whenever continue statement is used the next repetition
    of the loop starts.


