  md: '# C Language For Beginners


    fwrite() Function can be used to write a block of memory into file. Whatever you
    have in that block of memory, it is written into file as it is.


    ```

    int fwrite(void*address, int size, int noBlocks, FILE*fp);

    ```


    | void * address | Starting address of the block that is to be written. fopen()
    takes bytes from this address in memory. |

    | int size | Size of each block in bytes. Use sizeof operator to get exact number
    of bytes to be written while you are dealing with structures. |

    | int noblocks | The number of blocks to be written. The size of each block is
    specified by int size. So, total number of bytes written will be size * noblocks.
    |

    | FILE * fp | Identifies the file into which the data is to be written. |


    In the previous program, one structure is written into file. The starting address
    of the structure variable is taken using address operator &. Size of structure
    is taken using sizeof operator.


    Note: sizeof(data-type or variable) returns the number of bytes occupied by data
    type or variable.


    Function fwrite() returns the number of blocks written and NOT number of bytes
    written.


