  md: '# C Language For Beginners


    # Introduction


    In my opinion, C is the first language one should understand. It teaches programming
    and prepares you for complex languages as C++, Java and C#. It is very important
    to learn this language to lay a solid foundation in programming.


    Programming is fun. However, not everyone who wants to be a programmer would realize
    it, because some lack efforts and some direction. This book is meant for people
    who are not able to know what they should understand and to what extent. I have
    written this book keeping a beginner on my mind. The order of the chapters is
    the order in which you better understand these topics.


    # What does this book contain?


    This book is no nonsense book - no lengthy and unwanted discussions. This book
    will teach you with simple examples, simple language and the required extent.
    Once you digest this book and feel you are comfortable with the topics discussed
    in this book, you can start exploring some advanced areas in C. If you like, you
    can move on to more widely used languages as C++, Java, JavaScript, PHP, and C.


    My experience with thousands of students has made me realize that most of the
    students who are struggling to understand programming have only two possible problems.
    First, they do not put enough effort in this case, nobody can help it. Second,
    they try to understand advanced things without understanding fundamentals. I,
    a student trying to understand Java or C++ without understanding programming in
    the first place.


    This book is written to be a good supplement for those who are undergoing training
    in C, and people who want to learn C on their own. With a bit of extra effort,
    the latter category should not find finding C very difficult by using this book.


    Enjoy programming and enjoy your career. Programming can change your life for
    good - forever. Think about it.


    It may be appropriate at this stage to remind you that - winners never quit, quitters
    never win.'
