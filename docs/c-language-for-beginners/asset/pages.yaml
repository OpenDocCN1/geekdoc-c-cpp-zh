  md: '# C Language For Beginners


    # Extent


    This refers to the period of time during which a variable resides in the memory.
    A variable declared inside a block has local extent. Because it exists in the
    memory as long as the block is in execution. It is created when block is invoked
    and removed when the execution of the block is completed.


    Remember, the block where variable is declared may be a function or a compound
    statement as we have seen before in this chapter.


    On the other hand, variable declared outside all functions has static extent as
    they remain in memory throughout the execution of the program.


    Though variable is available in the memory, we can access it only from the region
    of the program to where the variable is visible. That means, just because the
    variable is there in the memory we cannot access it, unless it is visible.


    # Storage Class Specifiers


    You need not explicitly associate a storage class with a variable. Because depending
    upon where a variable is declared, a storage class is implicitly associated with
    variable.


    But in few cases you may have to use a storage class specifier while declaring
    variable.


    The following is the complete syntax of variable declaration.


    ```

    [storage-class] data-type variable = value]

    ```


    The following are different storage class specifiers:


    +   - auto

    - static

    - register

    - extern


    # auto


    This is normally not used as it is implicitly associated with all local variables.


    An auto variable is automatically created and initialized when control enters
    into a block and removed when control comes out of block.


    ```

    auto int i = 30; //Auto variable with local scope and extent

    ```'
