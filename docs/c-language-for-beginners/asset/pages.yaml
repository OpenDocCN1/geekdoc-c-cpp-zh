  md: '# Figure 13.7: Memory image after function swap with pass by reference was
    called.


    When the address of variable is passed, it is possible to access the location
    of the variable and change the value in that location.


    Unless you use a pointer in function **swap**, you cannot access the memory locations
    of **x** and **y** and change their values.


    So to change the value of actual parameter from the function, first, address of
    actual parameter is to be passed to function, then that address is taken into
    a pointer and then that pointer is used to access the location of variable and
    modify its value.


    In the above example, parameters **a** and **b** are pointers to them. They receive
    the address of variables **x** and **y**. Once they get the address of **x** and
    **y**, they can access the location of **x** and **y** through the address and
    interchange values.


    Also remember, at the time of calling *swap* function from **main** you must pass
    address of variables using&.


