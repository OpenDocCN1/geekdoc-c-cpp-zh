  md: '# Actual Parameter


    The value is passed to function while calling the function.


    For example, 10, 40 and 20 values that we passed to line() function in the above
    program.


    # Formal Parameter


    Variable that is used to receive actual parameter. In the above program len in
    function line() is a formal parameter.


    # Passing array as parameter


    When an array is passed as parameter, only the name of the array is given at the
    time of calling function. The formal parameter is to be declared as array. Here
    is an example to print the given array.


    ```

    01: void printarray(int arr[10]) // print an array

    02: {

    03:   int i;

    04:

    05:   for(i = 0; i < 10; i++)

    06:     printf("%5d", arr[i]);

    07: }

    08: void main()

    09: {

    10:  int a[10];

    11:

    12:  // code to initialize array

    13:  printarray(a);

    14: }

    ```


    # Returning a value


