  md: '# 20.COMMAND LINE ARGUMENTS


    Command line arguments are the values passed to a C program while running it from
    system prompt. In this chapter, we will see how to pass, receive and use command
    line arguments.


    +   - What is a command line argument?

    - argc and argv parameters

    - Using command line arguments

    - Summary

