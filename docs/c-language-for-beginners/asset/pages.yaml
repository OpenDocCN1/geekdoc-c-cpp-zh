    \ %d\\n\", v);\n11:     v++;\n12: }\n```\n\nOutput:\n\n| Value = 10 |\n| Value\
    \ = 10 |\n\nThe reason for output is evident. Whenever we enter into disp function,\
    \ it creates variable v and sets it to 10. As a result we always assign 10 to\
    \ v. Though v is incremented at the end of function, that value will be lost as\
    \ soon as control comes out of function because variable v is removed when you\
    \ move out of the block in which it is declared (disp() function).\n\nBut if we\
    \ want use value of v across function calls then we have to use storage specifier\
