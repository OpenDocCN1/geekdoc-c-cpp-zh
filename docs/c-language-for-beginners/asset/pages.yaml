  md: '# Insertion of a new node


    Let us write a function that takes two names, first name is the name after which
    a node with the second name is to be inserted. First we have to locate the name
    that has the first name. We need to create a new node and add that after the node
    with the first name. The new node contains the second name.


    Here is the complete code for the function insertnode. Function assumes root pointer
    is global and available to the function.


    ```

    01: /* Function to insert a new node in the middle of list. *

    02: Returns true if successful otherwise false */

    03:

    04: int insertnode(char * searchname, char * newname)

    05: {

    06:     struct node current, * newode;

    07:     current = root; // start search at root

    08:     while (current != NULL)

    09: {

    10:         if(strcmp(current->name, searchname)==0)

    11:         {

    12:             // create a new node

    13:             newode=(struct node *)malloc(sizeof(struct node));

    14:             if (newode == NULL)

    15:                 {

    16:                 printf("Memory allocation error. ");

    17:                 return 0; // terminate function

    18:             }

    19:             // copy data to new node

    20:             strcpy(newode->name, newname);

    21:

    22:             // add new node after current node

    23:             newode -> next = current -> next;

    24:             current -> next = newode;

    25:             return 1; // terminate function

    26:         } // end of if

    27:         current = current -> next;

    28:     } // end of while loop

    29:     // return 0 as searchname is not found

    30:     return 0;

    31: } // end of function

    ```'
