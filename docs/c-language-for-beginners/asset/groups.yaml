    # C Language For Beginners


    # Pointer Arithmetic


    All that array name contains is the starting address of array. But how does program
    access complete array by using starting address? To know how, we need to understand
    pointer arithmetic.


    It is possible to use arithmetic operations with pointers.


    When a pointer is used with arithmetic operators, it is called as pointer arithmetic.
    Pointer arithmetic is arithmetic of pointers.


    The following are the arithmetic operations permitted on pointers:


    +   - Adding an integer to pointer


    +   - Subtracting an integer from pointer


    +   - Subtracting a pointer from another pointer


    # Adding an integer to pointer


    When you add an integer to pointer then the value (address) of pointer is incremented
    by the size of data type to which pointer points. See the following example.


    ```

    01: int * p;

    02: int a[5];

    03:

    04: // p points to first element of the array

    05: p = a;

    06:

    07: // p now points to second element - a[1]

    08: p++ ;

    ```


    p is a pointer to int. So when you increment p by one it is incremented by number
    of bytes occupied by int. If a float pointer (float *fp) is incremented by one,
    then it is incremented by 4 bytes, assuming float occupies 4 bytes.'
