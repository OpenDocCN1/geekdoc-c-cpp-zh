    But in few cases you may have to use a storage class specifier while declaring
    variable.


    The following is the complete syntax of variable declaration.


    ```

    [storage-class] data-type variable = value]

    ```


    The following are different storage class specifiers:


    +   - auto

    - static

    - register

    - extern


    # auto


    This is normally not used as it is implicitly associated with all local variables.


    An auto variable is automatically created and initialized when control enters
    into a block and removed when control comes out of block.


    ```

    auto int i = 30; //Auto variable with local scope and extent

    ```'
