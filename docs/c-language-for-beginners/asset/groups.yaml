    This is a pre-processor command. #include command is used to copy the contents
    of the generic file into your program. In this example #include is used to include
    the contents of stdio.h header file. Though this is not mandatory it is better
    to include the header file (.h files are called as header files) using #include
    command. We will discuss more about #include in chapter 17.


    # Line 3


    Each Program starts with a function called main. Program''s execution starts with
    function and ends with main function. All remaining functions (standard and user-defined)
    are called from main function. When main function is terminated, the program is
    deemed to be terminated.


    # Line 4 & Line 6


    Each function contains a set of instructions enclosed in {} (braces). The statements
    given between braces will be executed when function is executed. As main function
    is the first function to be executed whenever you run a C program, all the statements
    between {} main function will be executed. A set of statements enclosed within
    {} is also called as a block. In other words for each function you have a block
    and that block is executed whenever the function is called.


    Line 4 starts the block and Line 6 starts the block.


