    modify its value.


    In the above example, parameters **a** and **b** are pointers to them. They receive
    the address of variables **x** and **y**. Once they get the address of **x** and
    **y**, they can access the location of **x** and **y** through the address and
    interchange values.


    Also remember, at the time of calling *swap* function from **main** you must pass
    address of variables using&.


