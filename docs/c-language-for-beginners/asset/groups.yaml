    # 24 C Language For Beginners


    Both printf() statements print the given string on the same line. This is because
    the output of each printf() statement starts at current position of the cursor.
    In the example, the output of first printf() statement is printed and cursor is
    on the left of it. This is why the second printf() statement is printing the given
    string immediately on the right of it.


    To display those two lines in different lines on the screen you have to print
    a new line character after first printf has printed its string. The following
    code does it.


    ```

    printf("First line.\n");

    printf("Second line.");

    ```


    # Output


    First line.

    Second line.


    Escape sequence \n (new line) is used to print a new line character. As a result,
    after string "First Line." is printed, the cursor moves to next first line character.
    That is the reason the output of the second printf function is printed below the
    output of the first printf.


    The following table lists all escape sequence characters.


    | Escape Sequence | Hex Value | Meaning |

    | \a | 0x07 | Audible bell |

    | \b | 0x08 | Backspace |

    | \f | 0x0C | Form feed |

    | \n | 0x0A | Line feed |

    | \r | 0x0D | Carriage return |

    | \t | 0x09 | Horizontal tab |

    | \v | 0x0B | Vertical tab |

    | \\ | 0x5c | Backslash |

    | \'' | 0x27 | Single quote |

    | \" | 0x22 | Double quote |'
