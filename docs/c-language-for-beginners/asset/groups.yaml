    # Binary Files


    So far you have dealt with text files. Text file is a file which contains readable
    characters and a few control characters like tab, new line etc. A simple way of
    identifying a text file is the contents using DOS TYPE command or load the file
    into any text editor EDIT. If contents are readable then it is a text file.


    A binary file is a collection of bytes. It may contain anything. Example for binary
    file is .exe, .obj and .com file. If you type the contents using TYPE command
    at system prompt, you see meaningless characters.


    Text file is terminated with a special character ^z (ASCII 26). On the other hand,
    binary files are not terminated with any special character. That is the reason
    why you have to specify whether you are dealing with text file or binary file.
    This is done using b ( binary ) or t (text) qualifier. If you do not specify anything
    then file is opened in text mode.


    The way operating system deals with text is different from the way it deals with
    binary files. Binary files can contain any character, whereas a text file can
    contain only readable characters like alphabets, digits, punctuation characters
    and a few control characters as new line.'
