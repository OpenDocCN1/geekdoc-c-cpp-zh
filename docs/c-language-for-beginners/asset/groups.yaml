    # C Language For Beginners


    Post-fix


    In post-fix, the value of the variable is used and then the value of the variable
    is incremented/decremented.


    ```

    // Assuming value of a is 10

    b = a++; // a is 11 but b is 10 only

    ```


    First the value of a is stored in b. Then the value of a is incremented by one.


    If the above expression is unclear then you can decode the expression and then
    try to understand.


    So, b = a++; will be equivalent to


    ```

    b = a;

    a = a + 1;

    ```


    and b = ++a; will be equivalent to


    ```

    a = a + 1;

    b = a;

    ```


    Assuming 10 and 20 are values for a and b, evaluate the following.


    ```

    c = ++a + b--; // c=31,a=11,b=19

    c = --b - ++a; // c=8,b=19,a=11

    ```


    # Combined Operators


    We often need to perform some operation between a variable and a value and store
    the result back into the same variable. C language provides a facility to combine
    the operation and assignment into one operator. When an operator and assignment
    operator are combined they are called as combined operators.


    ```

    amount = amount - discount;

    ```


    The above is an example to subtract discount from amount. This expression can
    be rewritten using combined operator as follows.


    ```

    amount = discount;

    ```


    The above is same as before in effect but more compact. The general syntax for
