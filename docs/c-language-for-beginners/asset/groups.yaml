    # Controlling output using Escape Sequence


    Whenever you display values using printf function, values are displayed from the
    current

    position of the cursor on the screen. And whatever you give that there will be
    printed in one

    line. But if you want to display values in two different lines or you want to
    print certain

    special characters, you can do that using escape sequence characters.


    Escape sequence is a combination of \backslash) and a character. This is inserted
    into a

    string to get the required effect.


    Look at the first example and its output.


    ```

    printf("First line.");

    printf("Second line.");

    ```


    The output of the above program will be:


    ```

    First line. Second line.

    ```'
