  mdcn: "\n# 从指针中减去整数\n\n从指针上减 1 会使指针指向上一个元素。这意味着指针被减了该指针所指向的数据类型的大小。\n\n以下程序使用了指针算术访问数组。\n\
    \n```c\n01: // 使用指针访问数组的程序\n02: main()\n03: {\n04:     int a[10];\n05:     int\
    \ *p, c;\n06: \n07:     // 将值读入数组\n08:     for (c = 0; c < 10; c++)\n09:     \
    \    scanf(\"%d\", &a[c]);\n10:     p = a;   // 使 p 指向 a\n11:     for (c = 0;\
    \ c < 10; c++)\n12:     {\n13:         printf(\"%5d\", *p);\n14: \n15:       \
    \  // 递增 p指向下一个元素\n16:         p++;\n17:     }\n18:     /* 现在倒序显示数组。*/\n19:  \
    \   --p 用于使指针指向上一个元素。\n20:     只要 p 指向数组 a 中的\n21:         第一个元素或之后的元素，p >= a\
    \ 就为真。\n22:     */\n23:     for(--p; p >= a; p--)\n24:         printf(\"%5d\"\
    , *p);\n25: }\n```\n\n使用指针符号访问数组比使用数组表示法更快。当你使用数组表示法如 `a[i]` 时，每次都必须将 `i` 的值加到\
    \ `a` 的地址上以获取所需的地址，然后从该地址取值。相反，当你已经在 `p` 中有了地址并每次对其递增时，除了递增指针本身，不涉及任何其他计算。因此，使用指针使访问比数组更快。\n\
    \n但除非使用大量的指针并访问大型数组，否则差异可能微乎其微。所以，数组表示法可能简单，而指针表示法更快且容易出错（至少在开始阶段）。\n\n# 从另一个指针中减去指针\n\
    \n两个指针相减的结果将是两个指针之间的元素个数。如果有两个分别指向 1000 和 1004 的 char 指针，用第二个减去第一个将得到 4。它首先从 1004\
    \ 减去 1000，然后将值 4 除以 1（char 的大小）。结果为 4。\n\n以下程序将从一个指针中减去另一个指针。当我们处理字符串时，已经看到像 `strchr`\
    \ 这样的函数返回地址。此示例使用地址获取字符在字符串中的位置。\n\n```c\n01: // 返回字符串中字符\n02:     位置的函数 */\n\
    03: int getcharpos(char st, char ch)\n04: {\n05:     char * p;\n06: \n07:    \
    \ // 使用 strchr 获取字符的地址\n08:     p = strchr(st, ch);\n09:     /* 如果找到字符，则返回\n10:\
    \     位置，否则返回 -1*/\n11: \n12:     if(p == 0) // 如果指针为空\n13:     return -1;\n14:\
    \     else\n15:     return p-st; // 返回 ch 在 st 中的位置\n16: }\n17: main()\n18: {\n\
    19:     char * st = \"Praneeth\";\n20:     int pos;\n21: \n22:     pos = getcharpos(st,\
    \ 'n');\n23:     if (pos == -1)\n24:         printf(\"Character not found\");\n\
    25:     else\n26:         printf(\"Character found at %d\", pos);\n27: }\n```\n\
    \n此程序使用指针减法来获取字符串中字符的位置。见下方。\n\n# 指针与数组名之间的差异\n\n目前我们交替使用指针和数组名。但它们在各方面并不相同。以下是数组名和指针之间的区别：\n\
    \n- 第一区别数组名是常量，而指针是变量。你可以通过存储地址来更改指针的值。你不能更改存储在数组名中的地址。因为如果丢失第一个元素的地址，整个数组将无法访问。\n\
    \n- 第二区别指针没有初始化，而数组名被初始化为数组第一个元素的地址。\n\n# 指向指针的指针\n\n指向另一个指针是可能的。然后它变成指向另一个指针，进而指向一个值。见以下示例，我们使用了指向指针的指针。\n\
    \n```c\n01: int ** pp; // 指向指针的指针\n02: int *p; // 指向整数\n03: int v = 20; // 整数\n\
    04: p = &v; // 使 p 指向 v\n05: pp = &p; // 使 pp 指向 p\n06:\n07: // 现在下方将将显示 20\n\
    08: printf(\"Value : %d \", v );\n09: printf(\"Value : %d \", *p );\n10: printf(\"\
    Value : %d \", **pp );\n```\n\n![](img/97920077b541e487bc04b53f201_9)\n"
