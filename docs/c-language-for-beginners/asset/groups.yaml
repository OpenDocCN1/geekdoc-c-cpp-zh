    # File I/O functions


    The following functions are related to file handling. All these functions are
    part of standard C library.


    int fputc(int ch, FILE * fp)


    Writes character ch into file referred by fp. If character is successfully written
    then it returns the character written.


    int putc(int ch, FILE * fp)


    Same as fputc() but it is a macro defined in stdio.h.


    int getc(FILE * fp)


    Returns the character that is read from file fp. On error or end of file, it returns
    -1.


    int getc(FILE * fp)


    Same as fgetc() but it is a macro.'
