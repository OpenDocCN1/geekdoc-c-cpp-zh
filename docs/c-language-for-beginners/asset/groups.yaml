    # Structures and assignment


    You can copy the value of one structure variable to another when both the structure
    variables belong to same structure type. For instance if you have two variables
    called x and y of structure employee then you can copy value of y to x using simple
    assignment operator.


    ```

    x = y;

    ```


    Copying one structure variable to another is equivalent to copying all members
    of one to another. Interesting fact about copying, is even members that are of
    string type are copied. Remember copying a string to another is not possible without
    using strcpy function. When you copy one structure variable to another of the
    same type, the data (including strings) will be automatically copied.


    As you have seen, copying y to x would copy even ename and eadd though they are
    strings. Because copying a structure variable to another structure variable is
    equivalent to copying the entire block (block allocated to y) to another (block
    allocated to x) in memory.'
