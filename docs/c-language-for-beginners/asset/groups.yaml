    \ |\n| --- | --- |\n| a == b | 检查变量 a 的值是否与变量 b 等等。 |\n\n> 注意：我们将在下一章中使用关系运算符，到时我们将讨论控制语句。\n\
    \n# 数字作为条件\n\n关于 C 语言条件的一个非常重要的点是 - 任何非零值都被视为真，零被视为假。这意味着如果你提供一个 `int` 变量作为条件，如果变量包含非零值则条件为真，否则条件为假。\n\
    \nC 语言的这一特性将被许多程序员利用，使条件更加紧凑。但要注意可能导致程序更容易出错且难以理解的危险。\n\n# 逻辑运算符\n\n当需要组合两个或多个条件时，你需要使用逻辑运算符。以下是可用的逻辑运算符。\n\
    \n| 运算符 | 含义 |\n|---|---|\n| && (与) | 当两个条件都为真时为真，否则为假。 |\n| || (或) | 当其中一个条件为真时为真，否则为假。\
    \ |\n| ! (非) | 反转条件的结果。真为假，假为真。 |\n\n表格 4.3：逻辑运算符\n\n这里是 `&&`（与）的真值表：\n\n| 条件-1\
    \ | 条件-2 | 结果 |\n|---|---|---|\n| 真 | 真 | 真 |\n| 真 | 假 | 假 |\n| 假 | 真 | 真 |\n\
    | 假 | 假 | 假 |\n\n# C 语言入门\n\n这里是 `||`（或）的真值表：\n\n| 条件-1 | 条件-2 | 结果 |\n|---|---|---|\n\
    | 真 | 真 | 真 |\n| 真 | 假 | 真 |\n| 假 | 真 | 真 |\n| 假 | 假 | 假 |\n\n只要在单独的语句中与变量使用运算符，无论在变量之前还是之后使用，没有区别。然而，如果它们在表达式中与变量使用，就会产生区别。\n\
    \n当运算符在变量之前使用时，称为前缀（++a）。当运算符在变量之后使用时，称为后缀（a++）。\n\n# 递增与递减运算符 (++,--)\n\n在编程中，将变量递增或递减是非常常见的。C\
    \ 提供了专门用于将变量加减1的运算符。\n\n```\na++; // 将 a 的值加 1\n--b; // 将 b 的值减 1\n```\n\n# 前缀\
    \ vs. 后缀\n\n只要 `++` 和 `--` 运算符在单独语句中与变量使用，无论在变量之前还是之后使用，都没有区别。但是，如果它们在表达式中与变量使用，就会产生区别。\n\
    \n# 前缀\n\n在前缀中，先对变量的值进行递增或递减，然后将变量的新值用于表达式。\n\n```\n// 假设 a 的值为 10\nb = ++a; //\
    \ a 是 11，b 也是 11\n```\n\n首先 a 的值加1，并将新值存储在变量 b 中。\n\n"
