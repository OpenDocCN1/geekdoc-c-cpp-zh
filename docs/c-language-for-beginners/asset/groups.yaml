    \ NUMBER;\n05: #endif\n06:\n07: // 声明 NUMBER 类型变量 x\n08: NUMBER x, y;\n```\n\n\
    # #ifdef 和 #ifndef\n\n这些预处理器命令用于测试标识符是否已定义。\n\n```c\n#ifdef name\n语句\n#endif\n\
    \n#ifndef name\n语句\n#endif\n```\n\n# #ifdef 检查给定的标识符是否已定义。\n\n# #ifndef 检查给定的标识符是否未被定义。\n\
    \n以下示例如果没有定义常量 `DEBUG`，则会忽略给代码。你可以使用 `#define` 命令定义符号常量。\n\n```c\n#ifdef DEBUG\n\
    printf(\"Value %d\",i);\n#endif\n```\n\n# #undef\n\n此命令用于取消定义使用 `#define` 定义的标识符。\n\
    \n以下示例将说明条件编译的效果。\n\n```c\n01: #define DEBUG 1\n02: #ifdef DEBUG\n03: // 此部分将被编译\n\
    04: #endif\n05:\n06: // 此部分始终会被编译\n07:\n08: #undef DEBUG\n09:\n10: #ifdef DEBUG\n\
    11: // 此部分将不会编译\n12: #endif\n13:\n14: #ifndef DEBUG\n15: // 此部分将被编译\n16: #endif\n\
    ```\n\n# 总结\n\n- 预处理器处理所有以 `#` 开头的行。两个最常用的预处理器命令是 `#define` 和 `#include`。\n\n\
    - 像 `#if` 这样的预处理器命令可以用于条件编译。通过它们，你可以指定程序的哪些部分需要编译，哪些部分需要忽略。\n\n# 练习题\n\n- 1. 使用\
    \ `#include` 在 `<>` 和 `\"\"` 中包含文件有什么区别？\n\n- 2. 为什么使用宏而不是函数？\n\n- 3. 创建一个名为 `odd`\
    \ 的宏，接收一个数字，如果是奇数则返回 1，偶数则返回 0。\n\n- 4. 创建一个接收数字作为参数并返回该参数下一个偶数的宏。\n\n# 18. 文件处理\n\
    \n当你想要永久存储数据时，必须使用文件。在本章中，我们将学习如何使用 C 库提供的函数将数据存储到文件中，并从文件中检索数据。\n\n- 打开文件\n-\
    \ 文件 I/O 函数\n- 创建文本文件\n- 从文件读取\n- 杂项文件函数\n- 将文件转换为大写\n- 标准流\n- 练习题\n\n磁盘上的数据以文件的形式存储。文件可以定义为**在磁盘上以名称存储的字节集合**。文件可以包含任何内容，即文件内容可以被解释为记录集、行集或指令集等。这取决于你解释内容的方式。\n\
    \n每当你想要访问文件中的数据时，都必须采取以下步骤：\n\n- 以所需的模式打开文件\n- 处理文件（读取、写入或两者兼）\n- 关闭文件\n\n# 打开文件\n\
    \n你使用 `fopen()` 函数打开文件。在打开文件时，应指定文件名和模式。\n\n`Filename` 指定要打开的文件名。如果文件在当前目录中，请提供完整路径。\n\
    \n`Mode` 指定打开文件后将执行的操作——读取、写入或两者兼。\n\n```c\nFILE * fopen(char * filName, char\
    \ * mode)\n```\n\n`Filename` 是要打开的文件名。\n\n`Mode` 可以是以下值的任意一个：\n\n| Mode | 含义 |\n\
    | :--- | :--- |\n| r | 允许我们读取文件内容。 |\n| w | 允许我们向文件写入内容。 |\n| a | 允许在文件末尾添加新数据。\
    \ |\n| b | 指定文件为二进制类型。 |\n| t | 指定文件为文本文件。 |\n| + | 允许我们从文件读取并向文件写入。 |\n\n如果没有给出\
    \ `b` 或 `t`，则默认为文本 - `t`。\n\n`FILE *` 当文件被成功打开时，`fopen()` 返回一个指向 `FILE` 的指针。`FILE`\
    \ 是一个包含已打开文件信息的结构。如果打开失败，`fopen()` 返回 `NULL` 指针。\n\n`FILE` 类型在 `stdio.h` 中声明。这就是为什么每当你处理文件时必须包含\
    \ `stdio.h` 的原因。\n\n以下代码以读取模式打开 `readme.txt`。\n\n```c\n01: #include <stdio.h>\n\
    02: FILE * fp\n03: fopen(\"readme.txt\", \"r\");\n04: if (fp == NULL)\n05:   \
    \  printf(\"无法打开文件。\");\n06:\n07: // 关闭文件\n08: fclose(fp);\n```\n\n# 文件 I/O 函数\n\
    \n以下函数与文件处理相关。它们都是 C 库的一部分。\n\n`int fc` 写入字符 \n\n`int putc(int ch, FILE *fp)`\
    \ 写入字符。\n\n`int getchar(FILE *fp)` 读取字符。\n\n`int getc(FILE *fp)` 读取字符。\n\n`int\
    \ fgets(char *st, int len, FILE *fp)` 读取字符串。\n\n`int fprintf(FILE *fp, char *format,\
    \ ...)` 格式化写入。\n\n`int fscanf(FILE *fp, char *format, ...)` 格式化读取。\n\n`int feof(FILE\
    \ *fp)` 到文件末尾时返回真。\n\n`int fclose(FILE *fp)` 关闭文件。\n\n`int fflush(FILE *fp)` 清空文件缓冲区。\n\
    \n`int fileno(FILE *fp)` 返回文件句柄。\n\n`long ftell(FILE *fp)` 返回文件位置。\n\n# 创建文本文件\n\
    \n以下是一个将 A 到 Z 写入 ALPHA 的示例程序。\n\n```c\n01: #include <stdio.h> // 包含 stdio.h\n\
    02: main()\n03: {\n04:     FILE * fp;\n05:     char ch;\n06:\n07:     // 以写入模式打开文件\n\
    08:     fp = fopen(\"alpha.txt\", \"w\");\n09:     // 检查文件是否成功打开\n10:     if(fp\
    \ == NULL)\n11:     {\n12:         printf(\"无法创建文件。退出。\");\n13:         exit(1);\
    \ // 以退出码 1 退出\n14:     }\n15: }\n```\n\n```c\n16: // 写入大写字母\n17: for(ch = 65;\
    \ ch <= 90; ch++)\n18: fputc(ch, fp); // 一次写入一个\n19:\n20: // 关闭文件\n21: fclose(fp);\n\
    22: }\n```\n\n 从文件中读取内容时，你必须检查是否到达了文件末尾。文件末尾是文件中没有任何内容的位置。也就是说，文件末尾是最后一个字节之后的位置。\n\
    \n以下是一个显示给定内容的程序。首先，使用 `scanf()` 从用户获取文件名。以读取模式打开文件。使用 `fgets()` 读取文件的所有字符并显示在屏幕上。当我们到达文件末尾时\n\
    - `feof()` 返回真，然后我们使用 `fclose()` 关闭文件。\n\n```c\n01: #include <stdio.h> // 包含 stdio.h\n\
    02: main()\n03: {\n04:     FILE * fp;\n05:     char fn[20];\n06:     int ch;\n\
    07:\n08:     // 接收文件名\n09:     printf(\"输入文件名:\");\n10:     gets(fn);\n11:\n12:\
    \     // 读取模式打开文件\n13:     fp = fopen(fn, \"r\");\n14:     if (fp == NULL)\n15:\
    \     {\n16:         printf(\"文件 [%s] 未找到\",fn);\n17:         exit(1); // 以退出码\
    \ 1 退出\n18:     }\n19: }\n```\n\n"
