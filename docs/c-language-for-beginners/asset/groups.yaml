- md: "\n# 15. STRUCTURES\n\nWe often have to store a collection of values. When the\
    \ collection is of the same type then array is used to store values. When a collection\
    \ of values related to an entity is be stored as one unit, we use structures.\
    \ In this chapter, we will see how to use structures to deal with a collection\
    \ of values.\n\n- What is a structure?\n- How to declare a structure?\n- Declaring\
    \ structure variables\n- Accessing a member\n- Array of structures\n- Structures\
    \ and assignment\n- Initialization of structure variable\n- Structure and function\n\
    - Return a structure\n- Pointer to structure\n- Nested structures\n- Using nested\
    \ structures\n- Summary\n- Exercises\n\n## What is a structure?\n\nA structure\
    \ is a collection of items, which may be of different types, commonly referenced\
    \ using one name.\n\nEach item in the structure is called as a **member**.\n\n\
    Typically programming languages provide two facilities to store collection of\
    \ values - arrays and structures or records. Arrays are used to store collection\
    \ of values of the type. When we want to store values that may be of different\
    \ types we have to use a structure. A structure is like a record. It contains\
    \ a collection of members (also called as fields).\n\nFor example, if we want\
    \ to store details of an employee we have to create a structure shown in next\
    \ section and memory image of the structure is shown in figure 15.1.\n\n## How\
    \ to declare a structure?\n\nYou declare a structure using keyword struct as follows.\n\
    \n```c\nstruct employee\n{\n  int eno;\n  char ename[20];\n  char eadd[100];\n\
    \  float bs;\n};\n```\n\n![](img/97920077b5414e4874bc04c0b534f201_145_0.png)\n\
    \nEmployee structure contains eno, ename, eadd and bs. When you declare a structure\
    \ you just create a new data type - struct employee. A structure is also called\
    \ as user-defined data type.\n\nWhen a structure is declared, a new data type\
    \ is created, but no memory is allocated.\n\nThe following is the syntax to declare\
    \ a structure.\n\n```c\nstruct [structure-name]\n{\n  members declaration\n} [variables];\n\
    ```\n\n## C Language For Beginners\n\nStructure name is otherwise known as tag.\
    \ While declaring a structure you can also declare variables by giving list of\
    \ variables after right brace. Members of a structure may be of standard datatypes\
    \ or may be of other structure type (more on this later).\n\n```c\nstruct point\n\
    {\n  int x, y;\n} fp, sp; // fp and sp are structure variables\n```\n\nNote: At\
    \ the time of declaration, if you declare variables and if you do not want to\
    \ declare any more variables later, then you can ignore structure name in the\
    \ declaration of structure.\n\n## Declaring structure variables\n\nYou declare\
    \ a structure variable using structname. You can declare a variable of structure\
    \ anywhere in the program where the structure is visible. Normally structures\
    \ are declared at the beginning of program and outside of all functions, so that\
    \ they are global and available to the entire program.\n\nFollowing is the declaration\
    \ of structure variable e1.\n\n```c\nstruct employee e1;\n```\n\nFigure 15.1 shows\
    \ memory picture of variable e1.\n\nThe number of bytes occupied by a structure\
    \ variable is equal to the total number of bytes required for all members of the\
    \ structure. For example, a variable of struct employee will occupy 126 bytes\
    \ (2 + 20 + 100 + 4).\n\n## Accessing a member\n\nA structure is a collection\
    \ of members. All members are to be accessed using a single structure variable.\
    \ So to access each member of the structure you have to use member operator (.).\n\
    \n```c\nstructure-variable.member\n```\n\nThe following is an example for accessing\
    \ member of a structure variable.\n\n```c\n01: struct employee e;\n02:\n04: strcpy(e.ename,\"\
    Pranav\");\n03: e.eno = 10; // places 10 into eno member\n05: printf(\"%d %s\"\
    , e.eno, e.ename);\n```\n\nOnce you use member operator to access a member of\
    \ a structure, it is equivalent to a variable of the member type. That means e.eno\
    \ in the above example is same as any integer variable as en is of type integer.\n\
    \nThe following simple program demonstrates how to use structure.\n\n```c\n01:\
    \ // program to accept details of an employee\n02: struct employee\n03: {\n04:\
    \    int eno;\n05:    char ename[20];\n06:    char eadd[100];\n07:    float bs;\n\
    08: };\n09: main()\n10: {\n11:    struct employee e;\n12:    int hra;\n13:\n14:\
    \    // accept details\n15:    printf(\"Enter employee details :\n// // print\
    \ salary\nif (e.bs > 15000)\nhra = 1500;\nelse\n    hra = 1000;\nprintf(\"Details\
    \ of employee\\n\" );\nprintf(\"%d %s %s %f\", e.eno, e.ename,\n    e.eadd, e.bs,\
    \ e.bs + hra);\n} // end of main\n```\n\n## Array of structures\n\nJust like you\
    \ create an array of standard data types like int, float etc. you can create an\
    \ array of structures also. An array of structures is an array where each element\
    \ is a structure. You declare an array of structures as follows:\n\n```c\nstruct\
    \ employee det[10];\n```\n\nNow det is an array of 10 elements where each element\
    \ can store data related to an employee. To access eno of element at 5th index,\
    \ you would enter:\n\n```c\ndet[5].eno = 500;\n```\n\nThe following program uses\
    \ an array of structures to store details of marks obtained by 10 students and\
    \ then displays the name of the student who has got the highest marks.\n\n```c\n\
    /* program to take marks of 10 students and\n// display the name of the student\
    \ with highest marks */\n// declare structure\nstruct marks\n{\n    char sname[20];\n\
    \    int marks;\n};\n```\n\n```c\n10: main()\n11: {\n12:     struct marks marks[10];\n\
    13:     int i, hmpos;\n14: \n15:     for(i = 0; i < 10; i++)\n16:     {\n17: \
    \        // take data\n18:         printf(\"Enter name: \");\n19:         gets(marks[i].sname);\n\
    20:         printf(\"Enter marks: \");\n21:         scanf(\"%d\",&marks[i].marks);\n\
    22:     }\n23:\n24:     // find highest marks\n25:     for(i = 1; i < 10; i++)\n\
    26:         if(marks[i].marks > marks[hmpos].marks)\n27:             hmpos = i;\n\
    28:     }\n29:\n30:     // display name\n31:     printf(\"%s has got marks %d\\\
    n\", marks[hmpos].sname, marks[hmpos].marks);\n32: }\n```\n\nIn the above program,\
    \ we first take marks of 10 students. Then we check whether the marks of current\
    \ student (i) are greater than the highest marks. If so, we set marks position\
    \ (hmpos) to index. At the end of the program, we are displaying the name and\
    \ marks from the element where we found highest marks.\n"
  mdcn: "\n\n# 15. 结构体\n\n我们经常需要存储一组值。当这组值具有相同类型时，使用数组来存储。当我们需要将一组与某个实体相关的值集合作为一个单元进行存储时，我们使用结构体。在本章中，我们将学习如何使用结构体来处理值的集合。\n\
    \n- 什么是结构体？\n- 如何声明结构体？\n- 声明结构变量\n- 访问成员\n- 结构体数组\n- 结构体与赋值\n- 结构变量的初始化\n- 结构体与函数\n\
    - 返回结构体\n- 结构体指针\n- 嵌套结构体\n- 使用嵌套结构体\n- 总结\n- 练习题\n\n## 什么是结构体？\n\n结构体是项的集合，可以具有不同的类型，通常使用一个名称引用。\n\
    \n结构体中的每个项被称为**成员**。\n\n通常编程语言提供两种方式来存储值的集合——数组和结构体（或记录）。数组用于存储相同类型的值集合。当我们想要存储可能具有不同类型的值时，我们必须使用结构体。结构体就像一条记录，它包含一个成员集合（也称为字段）。\n\
    \n例如，如果我们 own想要存储员工的详情，我们必须创建下一节所示的结构体，图15.1显示了结构体的内存映射。\n\n## 如何声明结构体？\n\n你使用关键字\
    \ `struct` 按照如下方式声明结构体。\n\n```c\nstruct employee\n{\n  int eno;\n  char ename[20];\n\
    \  char eadd[100];\n  float bs;\n};\n```\n\n![](img/97920077b5414e4874bc04c0b534f201_145_0.png)\n\
    \n员工结构体包含 eno、ename、eadd 和 bs。当你声明结构体时，你只是创建了一个数据类型——`struct employee`。结构体也称为用户定义数据类型。\n\
