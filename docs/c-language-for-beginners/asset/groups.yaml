    Fail\");\n20: }\n```\n\n上述代码段首先检查分数是否大于 80。如果是，它会显示消息“First grade”（一等）。否则，它检查第二个条件，如果为真，则显示“Second\
    \ grade”（二等）。如果第二个条件也为假，它会检查第三个条件，如果为真，则显示消息“Third grade”（三等），如果仍然为假，则显示“Fail”（不及）。\n\
    \n我们我们将讨论 `switch` 语句，它是多重 `if` 语句的替代方案。\n\n## 嵌套 if 语句 (Nested if statement)\n\
    \n在某些情况下，你需要将一个 `if` 语句放在另一个 `if` 语句内部。当你将一个 `if` 语句放在另一个 `if` 语句内部时，被称为嵌套 `if`\
