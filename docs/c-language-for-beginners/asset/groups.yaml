    \ clean version of the logical flow.\n\n[content]\n# Subtracting an integer from\
    \ pointer\n\nSubtracting one from a pointer makes pointer pointing to previous\
    \ element. That means the pointer is decremented by the size of the data type\
    \ to which the pointer is pointing.\n\nThe following program uses pointer arithmetic\
    \ to access an array.\n\n```c\n01: // program to access an array using pointer\n\
    02: main()\n03: {\n04:     int a[10];\n05:     int *p, c;\n06: \n07:     // get\
    \ values into array\n08:     for (c = 0; c < 10; c++)\n09:         scanf(\"%d\"\
    , &a[c]);\n10:     p = a;   // make p point to a\n11:     for (c = 0; c < 10;\
    \ c++)\n12:     {\n13:         printf(\"%5d\", *p);\n14: \n15:         // increment\
    \ p so it points to next element\n16:         p++;\n17:     }\n18:     /* Now\
    \ display array in reverse order.*/\n19:     --p is used to make pointer point\
    \ to previous element.\n20:     p >= a will be true as long as p points to an\n\
    21:         element that is at or first element in array a.\n22:     */\n23: \
    \    for(--p; p >= a; p--)\n24:         printf(\"%5d\", *p);\n25: }\n```\n\nAccessing\
    \ the array using a pointer notation is faster than using array notation. When\
    \ you array notation like a[i], every time the value of i is added to address\
    \ of a to get required address and then value is taken from that address. On the\
    \ other hand, when you have the address in p and increment it every time other\
    \ than incrementing pointer there are no other calculations involved. So, using\
    \ pointer makes access faster than array.\n\nBut the difference could be minimum\
    \ unless you use a lot of pointers and access large arrays. So, array notation\
    \ could be simple and whereas pointer notation is faster and error prone (at least\
    \ in the beginning).\n\n# Subtracting a pointer from another\n\nSubtracting a\
    \ pointer from another would yield the number of elements between two pointers.\
    \ If there are two char pointers pointing to 1000 and 1004 respectively, subtracting\
    \ first from second will result in 4. It first subtracts 1000 from 1004, then\
    \ the value 4 is divided by 1 (size of char). That will result in 4.\n\nThe following\
    \ program will subtract a pointer from another pointer. When we dealt with strings\
    \ we have seen that functions like strchr return the address. This example uses\
    \ of address to get position of a character in a string.\n\n```c\n01: // Function\
    \ to return the position of the string\n02:     character in a string */\n03:\
    \ int getcharpos(char st, char ch)\n04: {\n05:     char * p;\n06: \n07:     //\
    \ Use strchr to get address of char\n08:     p = strchr(st, ch);\n09:     /* if\
    \ character is found then return\n10:     the position, otherwise return -1*/\n\
    11: \n12:     if(p == 0) // if pointer is null\n13:     return -1;\n14:     else\n\
    15:     return p-st; // return position of ch in st\n16: }\n17: main()\n18: {\n\
    19:     char * st = \"Praneeth\";\n20:     int pos;\n21: \n22:     pos = getcharpos(st,\
    \ 'n');\n23:     if (pos == -1)\n24:         printf(\"Character not found\");\n\
    25:     else\n26:         printf(\"Character found at %d\", pos);\n27: }\n```\n\
    \nThis program uses pointer subtraction to get the position of the character in\
