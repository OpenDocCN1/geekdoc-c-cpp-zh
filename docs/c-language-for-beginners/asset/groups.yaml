    02: Returns true if successful otherwise false */

    03:

    04: int insertnode(char * searchname, char * newname)

    05: {

    06:     struct node current, * newode;

    07:     current = root; // start search at root

    08:     while (current != NULL)

    09: {

    10:         if(strcmp(current->name, searchname)==0)

