    # C Language For Beginners


    int fputs(char * st, FILE * fp)


    Writes string st followed by new line into fp.


    int fprintf(FILE * fp, char * format[,values])


    Given values into fp according to the given format. This is same as printf() but
    writes the output to a file instead of standard output device - screen by default.


    int fscanf(FILE * fp, char * format, variables)


    Reads values from file fp and places values into variables.


    int feof(FILE * fp)


    Returns true if you reach end of file in the given file, otherwise returns false.


    int fclose(FILE * fp)


    Closes the given file. If the file is an output file, the content of the buffer
    will be written to file before it is closed.


    int fflush(FILE * fp)


    Clears the content of file buffer so that data read from file is removed from
    buffer for input files. For output files, writes the content of the buffer to
    file.


    Files are associated with buffer, an area in the memory where data of the file
    is stored before is written to file. For input files, it contains a block of data
    read from file. This is done to improve performance of file IO as file IO is the
    bottleneck of the entire process.


    Content of the buffer will be copied to file in the following cases:


    +   - When file is closed


    +   - When buffer is filled


    +   - When fflush() function is called'
