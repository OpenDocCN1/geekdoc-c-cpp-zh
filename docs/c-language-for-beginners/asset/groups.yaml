    # Character related input-output functions


    There are a few functions that are specially designed to deal with character input
    and output.


    # getchar()


    Reads a character from standard input device (keyboard) and returns the character
    that we read. as it reads from standard input device, which is by default keyboard,
    it may read character from any other device if standard input device is redirected
    using input redirection (<) of operating system.


    User must press ENTER after entering the character.


    This function is declared in stdio.h (Standard IO).


    > Note: Header files contain function declarations of standard library functions
    such as getchar(). It is always better to include the corresponding header file
    when function is used in the program.'
