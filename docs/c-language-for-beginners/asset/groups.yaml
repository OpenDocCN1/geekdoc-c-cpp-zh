    # Identifier


    Identifier is the name you give to a variable or a function. An identifier is
    formed using the following rules:


    +   - It can contain characters A-Z,a-z,0-9 or underscore(_).

    - Can contain any number of characters but first 32 characters are significant.

    - Must start with either a letter or underscore. But avoid using underscore as
    the first letter, as system names are defined with underscore as the first character.

    - Keywords cannot be used as identifiers.


    The following is the list of a few valid identifiers.


    ```

    amount

    num1

    circle_radius

    x1

    ```'
