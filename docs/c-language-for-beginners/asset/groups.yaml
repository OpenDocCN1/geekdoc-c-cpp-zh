    # Nested loops


    When a loop is placed inside another loop, it is called nested loop. The inner
    loop or nested loop is executed for each repetition of the outer loop.


    The following is an example of displaying factorial of numbers from 1 to 5. There
    are two loops where first loop is repeated for 5 varying variable i from 1 to
    5 and second loop finds out the factorial of variable i.


    ```

    01: // Program to display factorial for given numbers

    02:

    03: #include <stdio.h>

    04: void main(){

    05: {

    06:     int i, j, n, fact;

    07:

    08:     for (i = 1; i <= 5; i++) // outer loop

    09:     {

    10:         printf("Enter a number: % ");

    11:         scanf("%d", &n);

    12:

    13:         fact = 1;

    14:         for (j = 1; j <= n; j++) // inner loop

    15:             fact = fact * j;

    16:

    17:         printf("Factorial of %d = %d\n", n, fact);

    18:     } // end of outer loop

    19: } // end of main

    ```


    It is possible to have multiple levels of nested loops. Outer loop starts first
    and the next nested loop starts after that. Once the nested loop is completed
    then next iteration of outer loop will start. If at all second loop has one more
    nested loop that will follow the same process as outer most and first nested loop.'
