    ```\n// 从列表中删除 Bale\nres = deletnode(\"Bale\");\nif(res)\n  printf(\"Bale is deleted\"\
    );\n```\n\n虽然链表的编程稍微要困难一些，但它有其自己的回报。我建议你花些时间处理链表。还有其他的变体，如循环链表和双向链表，我在这里无法涵盖。\n\
    \n## 总结\n\n- 链表是一种复杂的数据结构，允许你存储一组值。值以节点的形式存储，这些节点在逻辑上是有序的。这意味着它们在物理上可能存放在内存的任何位置并以任何顺序排列，但按照所需的顺序进行访问。\n\
