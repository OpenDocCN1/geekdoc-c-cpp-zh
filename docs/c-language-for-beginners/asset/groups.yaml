    \ they can access the location of **x** and **y** through the address and interchange\
    \ values.\n\nAlso remember, at the time of calling *swap* function from **main**\
    \ you must pass address of variables using&.\n\n*Note: You must use pointers for\
    \ pass by reference.*\n\n![](img/97920077b5414e487bc04c0b534f201_129_0.png)\n\n\
    # scanf() and &\n\nWe have been using & in order to read values into variables\
    \ using scanf(). Now it is time to understand why & is required. Also remember\
    \ we do not need & while reading value into a string.\n\nWhen we use &, we take\
    \ the address of the variable and send the address as parameter to scanf() function.\
    \ We have to pass address of the variable while using scanf() because we want\
    \ scanf() to change the value of variable with the value it reads from keyboard.\n\
    \nIn other words we are using pass by reference by sending address of variable\
    \ to scanf().\n\nBut & is not required while using strings. This is because of\
    \ the fact that string is an array and array itself contains the address. So,\
    \ no need to take address of the array. We will discuss more about it in the next\
    \ chapter.\n\nNow you understand why you have to use address operator while using\
    \ scanf(). Unless you pass address of variable, it is not possible for scanf()\
    \ to change the value of variable.\n\n# Summary\n\n- A pointer plays vital role\
    \ in C. A pointer is required when you need to change the value of actual parameter\
    \ using formal parameter. That means you need pointer to use pass by reference.\n\
    - Pointers are used by some library functions like scanf().\n\n# Exercises\n\n\
    - 1. ___ is address operator.\n- 2. ___ is indirection operator.\n- 3. How many\
