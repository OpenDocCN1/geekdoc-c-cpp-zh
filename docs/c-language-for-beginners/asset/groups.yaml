    # 8.ARRAYS


    So far we have dealt with one value at a time. But what if you have to take marks
    of 20 students? What if you have to find out the average of 20 students'' marks
    and arrange the marks in ascending order? For such requirements you have to store
    all the values in an array.


    In this chapter, we will understand how to create and use an array.


    +   - What is an array?

    - Declaring an array

    - Storage

    - How to access elements?

    - A Sample Program

    - Initializing an array

    - Searching an array

    - Sorting an array

    - Binary Search

    - Summary

    - Exercises


    # What is an array?


    An array is a collection of values of similar data type that is collectively accessed
    using one name.


    The following are three important characteristics of an array:


    +   - Array is a collection of values

    - All values are of the same type

    - All values are accessed using the same name


    Each value of the array is called as an element. Elements are accessed using index,
    which is a number representing the position of the element. More on this will
    be discussed in this chapter.'
  - '[PAGE 72]


    # C Language For Beginners


    # Declaring an array


    An array is declared just like an ordinary variable but with the addition of number
    of elements that the array should contain.


    The following declaration declares an array of 20 elements where each element
    is of int


    ```

    int marks [20];

    ```


    Now, marks is the name of the array of 20 integers. Marks occupies 40 bytes, by
    if int occupies 2 bytes (20*2).


    # Storage


    Each location of the array can contain a value. Each location of the array is
    called as element. All elements of an array are placed in memory contiguously.
    See the figure below, which represents an array of 7 elements with elements numbered
    from 0 to 6.


    ![](img/97920077b5414e4874bc04c0b534f201_72_0.png)


    Figure 8.1: Array in memory


    It is not possible to add new elements or delete existing elements after the array
    are created. In other words the size of the array is static and it cannot be changed
    at runtime. If you want to create a dynamic array, you can create it using dynamic
    memory allocation and for even more sophisticated you can use linked lists (more
    on this will be discussed in chapters 21 and 22).


    # How to access elements?


    An array contains multiple elements. But the total array is accessed using one
    name. So, to access array elements you have to use index or subscript and array
    name. The index is nothing but the number of the element. It identifies the position
    of the element in the array.


    In C, array index starts with 0 and ends at number of elements - 1.'
