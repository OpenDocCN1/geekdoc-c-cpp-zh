    \ let us understand a simple requirement. Assume that we have to take numbers\
    \ from user and store them in memory. But the problem is that we do not know how\
    \ many user will input. However, at the beginning of the program, user can tell\
    \ you how many numbers he enter.\n\n### How do we allocate memory dynamically?\n\
    \nTo allocate memory dynamically, we have to use malloc() and calloc() functions.\
    \ These take the amount of memory to be allocated and return a pointer pointing\
    \ to the area allocated. Here is the syntax of these functions.\n\n```\nvoid *\
    \ malloc(int size)\nvoid * calloc(int noelements, int sizeofelement)\n```\n\n\
