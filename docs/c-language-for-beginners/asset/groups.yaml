    - 二元运算符 - 接受两个操作数\n- 三元运算符 - 接受三个操作数\n\n根据运算符执行的操作，分类如下：\n\n- 算术运算符\n- 关系运算符\n\
    - 逻辑运算符\n- 递增和递减运算符\n- 复合运算符\n- 位运算符\n\n# 算术运算符\n\n这些运算符用于执行数学计算。这些运算符的操作数是数值类型。\n\
    \n| 运算符 | 作用 |\n|--- |--- |\n| + | 加法 |\n| - | 减法 |\n| - (一元) | 取反符号 |\n| * |\
    \ 乘法 |\n| / | 除法 |\n| % | 取模（余数） |\n\n表格 4.1：算术运算符\n\n注意：没有用于幂的运算符。\n\n```\n10\
    \ / 3 将是 3\n10 % 3 将是 1\n```\n\n# 减号 (-) 作为一元运算符\n\n减运算符可以作为二元运算符从另一个数字中减去数字，也可以作为一元运算符对数字取反。例如，以下语句将变量\
    \ `a` 的符号取反。这意味着如果 `a` 的值为 –100，那么 `b` 将因为符号取反变为 100。\n\n```\nb = - a;\n```\n\n\
    # 关系运算符\n\n这些运算符用于形成条件。条件用于 `if` 语句和 `for` 循环等控制语句。\n\n| 运算符 | 含义 |\n| --- | ---\
    \ |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <= | 小于等于 |\n| == | 等于 |\n| != |\
