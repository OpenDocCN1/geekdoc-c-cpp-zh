    \ 1 且销售额超过 10000，则佣金为 5%，否则为 3%。当代码为 2 且销售额超过 20000 时，佣金率为 7%，否则为 4%。\n\n```c\n\
    01: #include <stdio.h>\n02: main()\n03: {\n04:     unsigned int samt;\n05:   \
    \  float comm;\n06:     int code;\n07:     printf(\"Enter code and sales amount:\"\
