    # What is an operator?


    An operator is a symbol or word that performs a specific operation on the given
    value(s). The values that are used with the operator are called operands.


    C is rich in operators. It has got more number of operators compared with other
    high-level languages.


    Depending upon how many values (operands) an operator takes, operators are classified
    as follows:


    +   - Unary operators - take only one operand

    - Binary operators - take two operands

    - Ternary operators - take three operands'
  - '[PAGE 35]


    Based on the operation performed by the operator they are classified as follows:


    +   - Arithmetic Operators

    - Relational Operators

    - Logical Operators

    - Increment and Decrement Operators

    - Combined Operators

    - Bitwise Operators


    # Arithmetic Operators


    These operators are used to perform mathematical calculations. The operands of
    these operators are of numeric type.


    | Operator | What it does? |

    |--- |--- |

    | + | Addition |

    | - | Subtraction |

    | - (Unary) | Negates sign |

    | * | Multiplication |

    | / | Division |

    | % | Modulus(Remainder) |


    Table 4.1 : Arithmetic Operators


    Note: There is no operator for exponentiation.


    ```

    10 / 3 will be 3

    10 % 3 will be 1

    ```'
  - '[PAGE 36]


    # Minus (-) as unary operator


    Minus operator can be used as binary operator to subtract one number from another
    as unary operator to negate the sign of the number. For example, the following
    statement will negate the sign of variable a. That means, if the value of a is
    –100 then b will be 100 as sign negated.


    ```

    b = - a;

    ```


    # Relational Operators


    These operators are used to form condition. Conditions are used in control statements
    like if statement and for loop.


    | Operator | Meaning |

    | --- | --- |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |

    | == | Equal to |

    | != | Not equal to |


    Table 4.2: Relational Operators


    The following are a few examples of relational operators:


    | a > b | Will be true if value of variable a is more than value of variable b
    otherwise false. |

    | --- | --- |

    | a == b | Checks whether the value of variable a is equivalent to value of variable
    b. |


    > Note: We will use relational operators in the next chapter, where we will discuss
    control statements.'
  - '[PAGE 37]


    # Number as a condition


    One very important point about conditions in C is - any nonzero value is taken
    as true and zero is taken false. That means if you give an int variable as a condition,
    the condition will be true if variable contains nonzero otherwise condition will
    be false.


    This feature of the C language will be exploited by many programmers to make conditions
    more compact. But beware of the danger of making the program more prone to errors
    and difficult to understand.


    # Logical Operators


    When two or more conditions are to be combined then you need to use logical operators.
    The following are the available logical operators.


    | Operator | Meaning |

    |---|---|

    | && (AND) | True when both the conditions are true otherwise false. |

    | || (OR) | True when either of the conditions is true otherwise false. |

    | ! (NOT) | Reverse the result of condition. True will be false and false will
    be true. |


    Table 4.3: Logical Operators


    Here is the truth table for && (And) :


    | Condition-1 | Condition-2 | Result |

    |---|---|---|

    | True | True | True |

    | True | False | False |

    | False | True | False |

    | False | False | False |'
  - '[PAGE 38]


    # C Language For Beginners


    Here is truth table for || (OR) :


    | Condition-1 | Condition-2 | Result |

    |---|---|--|

    | True | | True |

    | True | False | True |

    | False | True | True |

    | False | False | False |


    The following is an example of logical operator where we check for two conditions
    false. If both the conditions are true then total condition will be otherwise
    false. If total condition is to be true when either of the conditions is true
    then we have to use || (OR) operator.


    ```

    // will be true when a is more than b and c

    a > b && a > c

    ```


    # Assignment Operator (=)


    This is used to store a value into a variable. The value being stored may be an
    expression or a constant or a variable. If it is an expression then the result
    of the expression is stored in the variable.


    ```

    a = 10;

    ```


    The variable that is receiving value is called as Lvalue. The Lvalue could be
    any expression that can receive a value of the given type.


    In the above statement value 10 is stored in variable a.


    It is very important to understand that every assignment operation results in
    a value, which is the value of the Lvalue. An assignment expression can be used
    anywhere where a value is expected. One of the most commonly made mistakes in
    C beginners is using instead of ==. But C doesn''t complain about it because even
    = (assignment operator) can return a value. And moreover, C can take a number
    as the condition and return true if number is nonzero and false if number is zero.


    It is also possible to assign the same value to more than one variable at once.'
  - '[PAGE 39]


    ```

    a = b = c = 0;

    ```


    In the above, all three variables will contain the value 0. The assignment starts
    with c = 0 and then the result of the expression, which is the value of lave -
    variable c, will be assigned to b and so on. Also note, the assignment operation
    starts at right most and moves towards left. That means the associativity is right
    to left. See Appendix A for precedence and associativity of operators in C language.


    # Increment & Decrement Operators (++,--)


    In programming, it is very common to increment or decrement a variable by one.
    C has provided operators just to increment and decrement a variable by one.


    ```

    a++; // Increments the value of a by 1

    --b; // Decrements the value of b by 1

    ```


    # Pre-fix vs. Post-fix


    As long as ++ and -- operators are used with variable in a separate statement,
    it will make no difference whether they are used before the variable or after
    the variable. However, if they are used with variable in an expression it makes
    a difference.


    When the operator is used before the variable it is called as Pre-fix (++a). When
    operator is used after the variable it is called as post-fix (a++


    # Pre-fix


    In pre-fix, the value of the variable is incremented or decremented first and
    then the new value of the variable is used in the expression.


    ```

    // Assuming value of a is 10

    b = ++a; // a is 11 and b is also 11

    ```


    The first value of a is incremented by one and the new value is stored in variable
    b.'
