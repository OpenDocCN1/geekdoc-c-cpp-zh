    # Pointer variable


    A pointer variable or a pointer is similar to a variable but where a variable
    stores data, a pointer variable stores address of a memory location.


    So a pointer does contain all attributes of a variable but what is stored in pointer
    is interpreted as an address of a memory location and not as data.


    # How to use a pointer in C?


    Now let us see how to use a pointer. To use a pointer, first we have to declare
    a pointer. Then we have to assign an address to it and use it.


    # Declaring a pointer


    The first thing that you have to know is how to declare a pointer variable. A
    pointer variable (or pointer) is declared same as a variable but contains a *
    before the name. following is an example of a pointer variable.


    ```

    * p; // p is a pointer variable or pointer in brief

    ```


    Now if you have a look at the memory it would look like figure 13.2. Just like
    a normal variable even a pointer variable contains memory allocation.


    ![](img/97920077b5414e4874bc04c0b534f201_122_0.png)


    > Note: A pointer always occupies same number of bytes in memory irrespective
    of datatype it points to, as address always occupies same number of bytes in memory.'
