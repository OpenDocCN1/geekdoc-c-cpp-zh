    # Summary


    +   - A function is a collection of statements to do a task. A function may or
    not take parameters but it always returns a single value.


    +   - Functions may be predefined or user-defined. User-defined functions are
    the ones that are created by user writing the code.


    +   - A user-defined function may contain function declaration, where information
    about function is supplied to compiler, and function definition, where code of
    the function is written. Function returns a value using return statement.


    +   - When a function calls itself it is called as recursion.


    # Exercises


    +   1. The number of values a function can return is ____.


    +   2. ________ statement is used to terminate a function.


    +   3. ________ is the default return type of function.


