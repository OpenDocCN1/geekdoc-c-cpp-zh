    为了释放一块内存，请使用 `free()` 函数，其语法如下：


    ```

    free(void * block);

    ```


    `block` 是要释放的内存块。该块必须是使用 `malloc()` 或 `calloc()` 分配的。


    ## 示例程序


    以下程序将让你了解什么是动态内存分配。该程序用于从用户处获取值。用户首先输入他将要输入的数字个数，然后输入相应数量的数字。在获取所有数字后，它将按照接收顺序的反序显示这些数字。


    ```c

    01: // 从用户处获取数字的程序

    02: /* 使用动态内存分配，因为在编写程序时

    03: 还不输入的数字数量 */

    04:

    05: #include <alloc.h>

    06: main()

    07: {

    08:     int noelements

    ...

    23: // 使用数组符号将值拷贝到内存

    24:   p[i] = num;

    25: }

    26: // 按反序显示数字

    27:   for(i = noelements - 1; i >= 0; i--)

    28:     printf("%d\n", p[i]);

    29:

    30: // 释放内存块

    31: free(p);

    32: }

    ```


    第一个程序获取用户输入的值的数量。它计算了存储数据所需的字节数。然后它分配一块内存并将其存储其中。正如我们在讨论指针时看到的，指针可以被视为数组并用数组符号使用（见第1章）。因此我们使用了
    `p`（一个指向 `int` 的指针），而不是数组符号，我们也可以使用如下指针符号：


    ```c

    *(p + i) = num;

    ```


    此程序利用内存分配根据精确需求分配内存。如果动态内存分配机制不可，此程序将无法实现或效率低下。尽管如此仍然有问题！上面的程序可以。但它假设用户能够给出输入的精确字节数，而且你需要分配的内存必须是连续的。


    总而言之，这种方法是好的但不是最好的。它有两个局限性：

    - 它假设用户能够准确告诉你将要输入多少值。

    - 分配的内存量必须是连续的。


    - 当你知道所需的内存量时，只需声明一个适当类型的变量或适当大小的数组。然而，如果你在编写程序时不知道要存储多少数据，你就必须动态地（在运行时）分配内存。

    - C 语言提供了库函数 `malloc()`、`calloc()`、`realloc()` 和 `free()` 来处理动态分配。


    ### 练习题

    1. `malloc()` 的返回值类型是什么？

    2. `calloc()` 的参数是什么？


    ## 链表


    在上一节中，我们已经了什么是动态内存分配。现在让我们如何使用动态内存分配来创建链表。


    - 什么是链表？

    - 为什么要使用链表？

    - 链表的创建

    - 插入新节点

    - 从列表中删除节点


    ## 什么是链表？


    链表是相互连接的节点集合。列表中的每个节点由两个部分组成：

    - 数据

    - 下一个节点的地址


    | 数据 | 下一个节点的地址 |

    | :--- | :--- |


    图 22.1: 链表中的节点


    链表是一个节点集合，其中每个节点包含要存储的数据和逻辑上被视为下一个节点的节点地址。该集合在物理上不是有序的，相反在逻辑上是有序的。这意味着它是按逻辑顺序排列的。


