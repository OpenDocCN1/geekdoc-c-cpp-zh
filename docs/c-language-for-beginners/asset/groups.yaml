    \ to the smallest of two. Use pass by reference.\n- 7. Write a function to take\
    \ three numbers and return minimum and maximum values. Use pass by reference.\n\
    - 8. Write a function to take an array and return smallest and largest values\
    \ of the array. Use pass by reference.\n- 9. Write a function to take an array\
    \ of 10 integers and set all of them to 0. Use pass by reference.\n\n# 14. POINTER\
    \ vs. ARRAY\n\nIn the previous chapter, we have seen what a pointer is and how\
    \ to use it. In this chapter, we are going to see the relationship between a pointer\
    \ and an array.\n\n- Similarities between pointer and array\n- Array and pass\
    \ by reference\n- Pointer arithmetic\n- Dissimilarities between pointer and array\
    \ name\n- Pointer to pointer\n- Array of pointers\n- Pointer to function\n- Summary\n\
    - Exercises\n\n# Similarities between pointer and array\n\nA pointer and an array\
    \ are similar in some respects. To understand the similarities, first you have\
    \ to see array name more closely. So observe what happens when we declare an array\n\
    \n```c\nint a[5];\n```\n\nHere a is the name of the array, which contains five\
    \ integers. Figure 14.1 shows the memory picture of the array.\n\nArray name a\
    \ contains address of the first element of the array. That means the address of\
    \ first element of the array and the value of array name are same.\n\n```c\n&a[0]\
    \ == a\n```\n\n| 100 | 102 | 104 | 106 | 108 |\n|---|---|---|---|---|\n| a | 100\
    \ | | | |\n\nFigure 14.1: An array in memory.\n\nAs a contains the address of\
    \ first element, it can be used as pointer to access the value of first element\
    \ as shown below.\n\n```c\nx = *a;\n```\n\nThe above statement stores the value\
    \ of first element of array a into variable x. This is the same as\n\n```c\nx\
    \ = a[];\n```\n\nSo, an array name can be used as a pointer. And the reverse is\
    \ also true. The following snippet will use an array as a pointer and a pointer\
    \ to access an array.\n\n```c\n01: int * p;\n02: int a[5];\n03: int x;\n04:\n\
    05: // p now points to first element of a\n06: *p = 20; // Stores 20 in first\
    \ element of array\n07:\n08: x = *a; // Copies first element's value to x\n```\n\
    \n| 100 | 102 | 104 | 106 | 108 |\n|---|---|---|---|---|\n| a | 100 | | | |\n\n\
    Figure 14.2: Pointer pointing to an array\n\n# Array and pass by reference\n\n\
    When you send an array to a function all that you send is only the starting address.\
    \ So, the function that takes the starting address can access the entire array\
    \ or a part of it as the case may.\n\nThe following program will highlight this\
    \ feature.\n\n```c\nvoid displayarray(int * a, int l) {\n    int i;\n    for(i\
    \ = 0; i < l; i++)\n        printf(\"%d\", a[i]);\n}\n\nint main() {\n    int\
    \ arr1[10];\n    int arr2[20];\n\n    // fill arrays\n    displayarray(arr1,10);\n\
    \    displayarray(arr2,20);\n\n    // display only 10 elements of arr2\n    displayarray(arr2,10);\n\
    }\n```\n\nThe above program proves that when you send an array to a function all\
    \ that you send is only the starting address.\n\n# Pointer Arithmetic\n\nAll that\
    \ array name contains the starting address of array. But how does program access\
    \ complete array by using starting address? To know how, we need to understand\
    \ pointer arithmetic.\n\nIt is possible to use arithmetic operations with pointers.\n\
    \nWhen a pointer is used with arithmetic operators, it is called as pointer arithmetic.\
    \ Pointer arithmetic is arithmetic of pointers.\n\nThe following are the arithmetic\
    \ operations permitted on pointers:\n\n- Adding an integer to pointer\n- Subtracting\
    \ an integer from pointer\n- Subtracting a pointer from another pointer\n\n# Adding\
    \ an integer to pointer\n\nWhen you add an integer to pointer then the value (address)\
    \ of pointer is incremented by the size of data type to which pointer points.\
    \ See the following example.\n\n```c\n01: int * p;\n02: int a[5];\n03:\n04: //\
    \ p points to first element of the array\n05: p = a;\n06:\n07: // p now points\
    \ to second element - a[1]\n08: p++ ;\n```\n\np is a pointer to int. So when you\
    \ increment p by one it is incremented by number of bytes occupied by int. If\
    \ a float pointer (float *fp) is incremented by one, then it is incremented by\
    \ 4 bytes, assuming float occupies 4 bytes.\n"
  mdcn: "\n\n# 图 13.7：调用引用传递的交换函数后的内存映像。\n\n当传递变量的地址时，可以访问变量所在的位置并更改该位置的值。\n\n除非在函数\
    \ **swap** 中使用指针，否则你无法访问 **x** 和 **y** 的内存位置并更改它们的值。\n\n因此，若要从函数更改实际参数的值，首先需要将实际参数的地址传递给函数，然后将该地址存入指针中，接着使用该指针来访问变量所在的位置并修改其值。\n\
    \n在上面的示例中，参数 **a** 和 **b** 是指向这些变量的指针。它们接收了变量 **x** 和 **y** 的地址。一旦它们获得了 **x**\
    \ 和 **y** 的地址，就可以通过该地址访问 **x** 和 **y** 的位置并交换值。\n\n此外请记住，在 **main** 中调用 *swap*\
    \ 函数时，你必须使用 `&` 符号传递变量的地址。\n\n*注意：引用传递必须使用指针。*\n\n![](img/97920077b5414e487bc04c0b534f201_129_0.png)\n\
    \n# scanf() 和 &\n\n我们一直在使用 `&` 通过 `scanf()` 将值读入变量。现在是时候理解为什么需要 `&` 了。还要记住，在向字符串读入值时不需要\
    \ `&`。\n\n当我们使用 `&` 时，我们获取变量的地址并将该地址作为参数传递给 `scanf()` 函数。在使用 `scanf()` 时必须传递变量的地址，因为我们希望\
    \ `scanf()` 根据从键盘读取的值来更改变量的值。\n\n换句话说，我们正在通过向 `scanf()` 发送变量的地址来实现引用传递。\n\n但在使用字符串时不需要\
    \ `&`。这是因为字符串是一个数组，而数组本身就包含了地址。因此，不需要获取数组的地址。我们将在下一章详细讨论这一点。\n\n现在你明白为什么在使用 `scanf()`\
    \ 时必须使用地址操作符了。除非传递变量的地址，否则 `scanf()` 无法更改变量的值。\n\n# 总结\n\n- 指针在 C 语言中起着至关重要的作用。当你需要通过形式参数更改实际参数的值时，就需要指针。这意味着使用引用传递需要指针。\n\
    - 某些库函数（如 `scanf()`）会使用指针。\n\n# 练习题\n\n- 1. ___ 是地址操作符。\n- 2. ___ 是间接操作符。\n- 3.\
    \ 在声明 `float * p` 时，`p` 占据多少字节？\n- 4. 使用引用传递时，使用 ___ 作为形式参数。\n- 5. 声明两个 int 变量，向它们读入值并显示这些变量的值和地址。使用引用传递。\n\
    - 6. 写一个函数，接收两个数并将它们都设置为两者中的较小值。使用引用传递。\n- 7. 写一个函数接收三个数并返回最小值和最大值。使用引用传递。\n-\
    \ 8. 写一个函数接收一个数组并返回数组的最小值和最大值。使用引用传递。\n- 9. 写一个函数接收一个包含 10 个整数的数组并将它们全部设置为 0。使用引用传递。\n\
    \n# 14. 指针 vs. 数组\n\n在上一节中，我们了解了指针是什么以及如何使用它。在本章中，我们将学习指针与数组之间的关系。\n\n- 指针与数组的相似之处\n\
    - 数组与引用传递\n- 指针算术\n- 指针与数组名之间的不同点\n- 二级指针\n- 指针数组\n- 函数指针\n- 总结\n- 练习题\n\n# 指针与数组的相似之处\n\
    \n指针和数组在某些方面是相似的。要理解这些相似之处，首先必须更仔细地观察数组名。因此，请观察当我们声明数组时发生了什么：\n\n```c\nint a[5];\n\
    ```\n\n这里 a 是数组名，它包含了五个整数。图 14.1 显示了数组的内存情况。数组名包含第一个元素的地址。数组名与第一个元素的地址是相同的。\n\n\
    | 100 | 102 | 104 | 106 | 108 |\n|---|---|---|---|---|\n| a | | | | |\n\n```c\n\
    &a\n```\n\n由于 a 包含了第一个元素的地址，可以作为指针来访问数组。如下所示：\n\n```c\nx = a;\n```\n\n上述语句将数组第一个元素的值存入变量\
    \ x。反之也是成立的，数组名可以作为指针使用。\n\n```c\n01: int * p;\n02: int a[5];\n03:\n04: // p 指向数组的第一个元素\n\
    05: p = a;\n06:\n07: // p 现在指向第二个元素 - a[1]\n08: p++ ;\n```\n\n# 数组与引用传递\n\n当你将数组传递给函数时，你传递的只是起始地址。因此，接收起始地址的函数可以访问整个数组或其部分。\n\
    \n下面的程序将突出这一特性：\n\n```c\nvoid displayarray(int * a, int l) {\n    int i;\n   \
