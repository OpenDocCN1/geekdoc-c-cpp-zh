    200 (see figure 13.4). When we use ***ip** to get the value of location pointed
    by **ip**, we get the value stored in locations 200 and 201.


    Here are the steps that are taken when a pointer is used with indirection operator
    (*):


    +   - First value of pointer variable is taken (200 in this example for **ip**).


    +   - Then it goes to location with that address.


    +   - From that address it takes value from *n* bytes, where *n* depends on the
    data type of the pointer. In case of **ip** is **int**, so it will be two bytes
