    # 18. FILE HANDLING


    When you want to store data permanently, you have to use files. In this chapter,
    we will understand how to store data into files and retrieve data from files using
    functions available in C library.


    - Opening a file

    - File I/O functions

    - Creating a text file

    - Reading from a file

    - Miscellaneous file functions

    - Converting file to uppercase

    - Standard streams

    - Exercises


    Data on the disk is stored in the form of files. A file can be defined as a **collection
    of bytes stored on the disk under a name.** A file may contain anything, i.e.,
    the contents of file may be interpreted as a collection of records or a collection
    of lines or a collection of instructions etc. It depends on the way you interpret
    the contents.


    Whenever you want to access the data in the file you have to take the following
    steps:


    - Open the file in the required mode

    - Process the file (read or write or both)

    - Close the file


    # Opening a file


    You open the file using fopen() function. While opening the file, the name of
    the file and the mode should be specified.


    Filename specifies the name of the file to be opened. Give complete path if file
    is not existing in the current directory.


    Mode specifies the operation that will be performed on the file after it is opened
    - read or write both.


    ```c

    FILE * fopen(char * filName, char * mode)

    ```


    Filename is the name of the file to be opened.


    Mode may be any of the following values:


    | Mode | Meaning |

    | :--- | :--- |

    | r | Allows us to read the content of the file. |

    | w | Allows us to write content to file. |

    | a | Allows new data to be added at the end of the file. |

    | b | Specifies the file is a binary type. |

    | t | Specifies the file is a text file. |

    | + | Allows us to read from file and write to file. |


    If b or t is not given, then it is taken as text - t.


    FILE * When file is successfully opened fopen() returns a pointer to FILE. FILE
    is a structure containing information regarding the file that is opened. If opening
    fails, NULL pointer is returned by fopen().


    FILE type is declared in stdio.h. That is the reason why you must include stdio.h
    whenever you deal with files.


    The following code will open file readme.txt in read mode.


    ```c

    01: #include <stdio.h>

    02: main()

    03: {

    04:   FILE * fp;

    05:

    06:   fp = fopen("readme.txt", "r");

    07:   if (fp == NULL)

    08:     printf("Could not open file.");

    09:

    10:   // process file

    11:   fclose(fp);

    12: }

    ```


    # File I/O functions


    The following functions are related to file handling. All these are part of C
    library.


    int fc(int ch, FILE *fp)

    Writes character to file.


    int putc(int ch, FILE *fp)

    Writes character to file.


    int getchar(FILE *fp)

    Reads character from file.


    int getc(FILE *fp)

    Reads character from file.


    int fgets(char *st, int len, FILE *fp)

    Reads string from file.


    int fprintf(FILE *fp, char *format, ...)

    Writes formatted to file.


    int fscanf(FILE *fp, char *format, ...)

    Reads formatted from file.


    int feof(FILE *fp)

    Returns true if reach end of file.


    int fclose(FILE *fp)

    Closes the file.


    int fflush(FILE *fp)

    Clears the buffer of file.


    int fileno(FILE *fp)

    Returns file handle.


    long ftell(FILE *fp)

    Returns current position in file.


    # Creating a text file


    The following is a sample program to write A to Z into ALPHA.


    ```c

    01: #include <stdio.h> // include stdio.h

    02: main()

    03: {

    04:     FILE * fp;

    05:     char ch;

    06:

    07:     // open file for writing

    08:     fp = fopen("alpha.txt", "w");

    09:     // check whether file is successfully opened

    10:     if(fp == NULL)

    11:     {

    12:         printf("file cannot be created. Quitting ...");

    13:         exit(1); // Terminate with exit code 1

    14:     }

    15: }

    ```


    ```c

    16: // write uppercase letters

    17: for(ch = 65; ch <= 90; ch++)

    18: fputc(ch, fp); // write one char at time

    19:

    20: // close file

    21: fclose(fp);

    22: }

    ```


    # Reading from a file


    While reading contents from a file, you have to check whether you reached end
    of file. End of file is the position beyond which nothing is found in the file.
    In other words, end of file is the position immediately after the last byte of
    the file.


    The following is a program to display the contents of the given file. First, filename
    is taken from user using scanf(). File is opened and read in mode. Then all the
    characters of the file are read using fgets() and displayed on the screen. When
    we reach end of file

    - feof() returns true, then we close file using fclose().


    ```c

    01: #include <stdio.h> // include stdio.h

    02: main()

    03: {

    04:     FILE * fp;

    05:     char fn[20];

    06:     int ch;

    07:

    08:     // Accept file name

    09:     printf("Enter filename:");

    10:     gets(fn);

    11:

    12:     // open file for reading

    13:     fp = fopen(fn, "r");

    14:     if (fp == NULL)

    15:     {

    16:         printf("File [%s] not found",fn);

    17:         exit(1); // Terminate with exit code 1

    18:     }

    19: }

    ```

