    \ to prevent code of other cases from getting executed, you must use break statement\
    \ to come out of entire switch statement. To transfer out of switch after the\
    \ relevant statements are executed, break statement is used. Though break is not\
    \ part of switch statement syntax, it is typically used with each case in switch\
    \ statement.\n\n```c\nswitch (expression)\n{\n  case value-1 : statements;\n \
    \ [case value-2 : statements] ...\n  [default : statements]\n}\n```\n\nAt least\
    \ one case is must and second case onwards is optional and default is optional.\n\
    \n## C Language For Beginners\n\nNote: Three dots (...) in syntax indicate that\
    \ the previous item can be repeated for any number of times. In the syntax of\
    \ switch, case statement can be repeated for any number of times.\n\n## Summary\n\
    \n- C provides all conditional statements that many high-level languages would\
    \ provide. Simple if statement is to take either of the two possible actions (or\
    \ only one action depending on the condition). If you need to handle multiple\
    \ conditions, use either multiple if statement or switch statement.\n\n- As comparisons\
    \ take more time than calculations, it is important to reduce the number of conditions\
    \ by using the right control statement. Learning to use control statements fluently\
    \ is the first milestone in learning a programming language. So, read this chapter\
    \ till you understand everything.\n\n## Exercises\n\n- 1. Accept a number and\
    \ display whether it is an even or odd number. Write two programs - one with conditional\
    \ expression and another with normal if statement.\n- 2. Accept marks in subject\
    \ and subject code (1 to 4) and display whether student passed or failed. Pass\
    \ mark is based on subject code as follows. 1-40, 2-50, 3-45, 4-55.\n- 3. Accept\
    \ two numbers and display the relationship between the two numbers. The output\
    \ should display one of the messages: \"Both numbers are equal\", \"First number\
    \ is bigger\" or \"Second number is bigger\".\n- 4. Accept three numbers from\
    \ user and display the biggest of three numbers.\n"
  mdcn: "\n\n## 复合语句 (Compound Statement)\n\n由于 `if` 语句默认允许你执行一条语句，因此需要复合语句来克服这一局限性。如果你在只允许执行一条语句的情况下必须执行多条语句，那么你就必须使用复合语句。\n\
    \n复合语句通过将所有要执行的语句放在的一对大括号 `{}` 中来创建。复合语句可以用任何可以使用简单语句的地方。\n\n以下示例在两个条件任一为真时会执行两个语句。\n\
    \n```c\nif(a > b)\n{\n    c = d;\n    d = e;\n}\nelse\n{\n    a = d;\n    d =\
