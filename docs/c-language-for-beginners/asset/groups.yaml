    # 30 C Language For Beginners


    Programmer has to choose the right data type depending on the requirement. For
    instance, if we store a number in the range 100 to 2000 then suitable datatype
    for this requirement is unsigned short.


    > NOTE: Size of data types in C language is not consistent across platforms and
    compilers. So, do check size of data types in your compiler using sizeof operator.


    # Constants


    Constant is a value that does not change during the execution of the program.
    For ex: 10 is always 10 and 150.50 will always be 150.50.


    The following are the different types of constants in C.


    # Character Constant


    This is single character or escape sequence enclosed in single quotes.


    | Examples: ''A'' , ''\n'' , ''0'' |


    # Integer Constant


    An integer value. If the value is negative precede the value with minus sign (-).


    | Examples: 10, -200 |


    Suffix L or I makes an integer constant a long integer and suffix U or u make
    it unsigned.


    # Float Constant


    This is a real number. It can contain minus sign and decimal point.


    | Examples: 10.50, -200.544 |


    You can give floating constant in exponential notation also.


    | Example: 1.0E2 is equivalent to 100.00 |'
  - '[PAGE 30]


    # C Language For Beginners


    # String Constant


    A collection of characters enclosed in double quotes.


    ```

    Example: "This is a string"

    ```


    You can embed escape characters in a string constant.


    ```

    Example: "First \n Second"

    ```


    > Note: Anything enclosed in double quotes becomes string irrespective of the
    actual content. For example, "101" is also a string though what it actually contains
    a number.


    # Function scanf()


    This is a standard function which is used to read values from keyboard (standard
    device). While reading values, you have to specify the following to scanf.


    +   - Type of each value to be read

    - Number of values to be read

    - Name of the variables where the values are to be stored


    ```

    scanf("%d%d", &a, &b);

    ```


    The above scans two integers and places them into two variables a and b, which
    are declared as variables of int type.


    While dealing with scanf function you must precede each variable with &..


    While inputting the value, user has to separate values using whitespace characters
    and terminate the entire input using ENTER key.


    A whitespace character is either a space, newline, or tab.


    ```

    10 20 30 <ENTER>

    ```'
