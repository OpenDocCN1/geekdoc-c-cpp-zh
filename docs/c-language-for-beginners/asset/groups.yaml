    \ nested loop. The inner loop or nested loop is executed for each repetition of\
    \ the outer loop.\n\nThe following is an example of displaying factorial of numbers\
    \ from 1 to 5. There are two loops where first loop is repeated for 5 varying\
    \ variable i from 1 to 5 and second loop finds out the factorial of variable i.\n\
