    # C Language For Beginners


    ## Releasing memory


    A block of memory that is dynamically allocated should be released after it is
    used.

    In order to release a block, use free() function, which has the following syntax.


    ```

    free(void * block);

    ```


    block is the block that is to be released. The block must have been allocated
    using either malloc() or calloc().


    ## Sample program


    The following program will give you an idea about what is dynamic memory allocation.
    The program is used to take values from user. User will first input the number
    of numbers he/she is going to input and user will input that many numbers. After
    taking all it displays the numbers in the reverse order of the accepted order.


    ```c

    01: // program to take numbers from user

    02: /* Uses dynamic memory allocation as the number of numbers to be

    03: taken is not known at the time of writing program */

    04:

    05: #include <alloc.h>

    06: main()

    07: {

    08:     int noelements

    ...

    23: // copy value into memory using array notation

    24:   p[i] = num;

    25: }

    26: // display numbers in the reverse order

    27:   for(i = noelements - 1; i >= 0; i--)

    28:     printf("%d\n", p[i]);

    29:

    30: // deallocate the block

    31: free(p);

    32: }

    ```


    The first program takes the number of values entered by the user. It calculates
    the number of bytes needed to store the data. Then it allocates a block of memory
    and stores them into it. As we have seen during the discussion of pointers, a
    pointer can be treated as an array and used with array notation (see chapter 1).
    So we used p, which is a pointer to int, instead of array notation we can also
    use pointer notation as follows:


    ```c

    *(p + i) = num;

    ```


    This program makes use of memory allocation to allocate memory depending on exact
    requirement. If dynamic memory allocation facility is not available, this program
    is not possible or inefficient. Still there is a problem! The above program works.
    However, it assumes that the user will be able to give you the exact number of
    bytes that he is going to enter, and the memory that you need to allocate must
    be contiguous.


    So, to summarize, the approach is good but not best. It suffers from two limitations:

    - It assumes user will be able to tell you exactly how many values is going to
    enter.

    - The amount of memory to be allocated must be contiguous.


    - When you know the amount of memory required, simply declare a variable of appropriate
    type or an array of appropriate size. However, if you do not know how much data
    is to be stored at the time of writing program, then you have to allocate memory
    dynamically (at runtime).

    - C language provides library functions – malloc(), calloc(), realloc(), and free()
    to deal with dynamic allocation.


    ### Exercises

    1. What is the return type of malloc()?

    2. What are the parameters of calloc()?


    ## LINKED LIST


    In the previous chapter we have seen what is dynamic memory allocation. Now let''s
    see how we can use dynamic memory allocation to create a linked list.


    - What is a linked list?

    - Why to use linked list?

    - Creation of linked list

    - Insertion of a new node

    - Deletion of a node from list


    ## What is a linked list?


    A linked list is a collection of nodes that are linked. Each node in the list
    consists of two things:

    - Data

    - Address of the next node


    | Data | Address of next node |

    | :--- | :--- |


    Figure 22.1: A node in linked list


    A linked list is a collection of nodes where each node contains the data to be
    stored and the address of the node that is logically taken as the next node. The
    collection is not physically ordered, instead it is logically ordered. That means
    the nodes are scattered in the memory without any order physically, they are always
    accessed in the required order.


    So, you can define linked list as a collection of nodes that is logically ordered,
    where each node contains data and the address of the next node. The following
    figure shows how a linked list may appear in memory.


    ![](img/97920077b5414e4874bc040b534f201_204_0.png)


    Figure 22.2: A linked list with nodes


    In the above picture, we have a linked list of nodes. First node contains data,
    which is the name Ronaldo, and also the address of the second node. Likewise each
    node contains name and address of the next node. The last node contains no address,
    as it has nothing to point. As you can see, though the nodes are not ordered physically,
    they are ordered logically. It is possible to access all the nodes starting from
    first node, which is also called root node. In fact, all that we need is only
    the address of root node. Once we access the root node, we can access the remaining
    nodes using address found in each node until we find a node that points to NULL.


    We understood what a linked list is. Now we need to understand, is it worth taking
    so much pain in creating a linked list? Won’t an array do? What are the benefits
    of using a linked list over an array?


    ## Why to use linked list?


    A linked list is far more superior to an array. A linked list has the following
    advantages over the approach we seen in the previous chapter. We have seen how
    to dynamically allocate memory and use that area to store a collection of values
    in the previous chapter. Though in some cases it suffers from certain limitations,
    a linked list overcomes those limitations.


    ### 1. No upper limit


    A linked list can contain any number of nodes. There is no upper limit regarding
    the number of nodes that we can have in the list. The only constraint is the amount
    of memory we have. Each time we need to store a new piece of data, such as a name,
    we allocate memory for a node dynamically and link node to the existing list.
    Moreover, this addition of node may be at the end of the list or in the middle
    or at the beginning.


    ### 2. Addition of a node is simple


    Adding a new node to an existing list is simple. It is possible to add a node
    at the beginning or in the middle of the list or at the end of the list depending
    upon the requirement.


    Addition of a new node to an existing list involves the following steps:

    - Allocate memory for a new node

    - Identify the location where node is to be inserted

    - Manipulate pointers in the list to insert the new node


    The following figure shows how to insert a new node between two existing nodes
    of an existing linked list. We have seen a list in the previous figure. This figure
    shows how to insert a node between nodes Ronaldo and Bale.


    ![](img/97920077b5414e4874bc040b534f201_205_0.png)


    Figure 22.3: After Modric is inserted between Ronaldo and Bale


    ### 3. Deletion of a node is simple


    Similar to addition, deletion of an existing node is very simple as we just have
    to change pointers to remove the node from the list. There is no need to move
    any data in the memory like it is required in case of an array.


    The following are the steps to be taken to delete a node from the list:

    - Identify the node to be deleted and get the address of the node

    - Get the address of previous node

    - Change the next node address of previous node to the address of next node of
    node to delete

    - Deallocate memory of the node that is delinked from the list


    The following figure shows the list after Alonso is deleted from the list. We
    have to first obtain the address of its previous node, which is node Bale in this
    example. Change the address of next node in Bale node to the address of Ramos
    node. This eliminates Alonso node from the list.


    ![](img/97920077b5414e4874bc040b534f201_206_0.png)


    Figure 22.4: After Alonso is deleted from linked list


    ### 4. Possible with even fragmented memory


    It is possible to create a linked list even when memory is fragmented. That means,
    even though we have only a few blocks of memory available and no big block, it
    is possible to create a list as it is a collection of several small blocks. It
    doesn''t need a single large block to be allocated like in the case of an array.

