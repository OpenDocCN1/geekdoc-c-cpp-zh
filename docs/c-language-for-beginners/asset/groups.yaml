    \ 占用 2 字节，那么 `marks` 占用 40 字节（20*2）。\n\n# 存储\n\n数组的每个位置都可以包含一个值。数组的每个位置被称为元素。数组的所有元素连续地放置在内存中。如下图所示，它表示了一个包含\
