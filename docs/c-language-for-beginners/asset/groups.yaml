    # Bitwise operators


    Bitwise operators perform operation on bits. Only integer data types can be used
    as operands. The following are the available bitwise operators in C language and
    what they do.


    | Operator | Meaning |

    | --- | --- |

    | & | Bitwise ANDing |

    | | | Bitwise ORing |

    | ^ | Bitwise XOR |

    | ~ | Ones'' compliment |

    | >> | Right shift |

    | << | Left shift |


    > Table 4.4: Bitwise operators.


    Bitwise ANDing takes two corresponding bits from the given operands and returns
    1 if both the bits are 1, otherwise it returns 0.


    Bitwise ORing takes two corresponding bits from the given operands and returns
    1 if either of the bits is 1, otherwise it returns 0.


    Bitwise XORing takes two corresponding bits from the given operands and returns
    0 if both the bits are the same, otherwise it returns 1.


    Ones'' complement reverses the bits. It returns 1 when bit is 0 and 0 when bit
    is 1.


    Shift operators shift the bits towards left or right by the given number of positions.


    The following are a few examples regarding how to use bitwise operators and what
    they do.


    For all the examples below assume the following variables with the given values.


