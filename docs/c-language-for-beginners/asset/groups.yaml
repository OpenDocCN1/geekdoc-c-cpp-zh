    # C Language For Beginners


    ```c

    #if constant-expression-1

    statements

    #elif constant-expression-2

    statements ] ...

    #else

    statements ]

    #endif

    ```


    constant-expression is any condition that is based on constants. No variables
    can be used as pre-processor will not understand any variables.


    If the given constant-expression is true, then the statements will be compiled,
    otherwise statements will not be passed to compiler and are ignored by compiler.


    The following example will create a new datatype called NUMBER; that will be of
    32 bit. If size of int is 4 bytes NUMBER is an alias to int, otherwise it will
    be an alias to long type.


    ```c

    01: #if (sizeof(int) == 4)

    02: typedef int NUMBER;

    03: #else

    04: typedef long NUMBER;

    05: #endif

    06:

    07: // declare variables of NUMBER x

    08: NUMBER x, y;

    ```


    # #ifdef and #ifndef


    These pre-processor commands test whether an identifier has been defined.


    ```c

    #ifdef name

    statements

    #endif


    #ifndef name

    statements

    #endif

    ```


    #ifdef checks whether the given identifier has been defined.


    #ifndef checks whether the given identifier has NOT been defined.


    The following example ignores the given code if constant DEBUG is not defined.
    You can define symbolic constants using #define command.


    ```c

    #ifdef DEBUG

    printf("Value %d",i);

    #endif

    ```


    # #undef


    This command is used to undef an identifier defined using #define.


    The following example will illustrate the effect of conditional compilation.


    ```c

    01: #define DEBUG 1

    02: #ifdef DEBUG

    03: // This section will be compiled

    04: #endif

    05:

    06: // This section is always compiled

    07:

    08: #undef DEBUG

    09:

    10: #ifdef DEBUG

    11: // This section will not be compiled

    12: #endif

    13:

    14: #ifndef DEBUG

    15: // this section will be compiled

    16: #endif

    ```


    # Summary


    - Pre-processor processes all lines that start with #. Two most commonly used
    pre-processor command are #define and #include.


    - Pre-processor commands like #if can be used for conditional compilation. using
    them you can specify which part of the program is to be compiled and which part
    is to be ignored.


