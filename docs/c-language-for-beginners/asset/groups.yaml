    # Dissimilarities between pointer and array name


    Till now we used a pointer and array name interchangeably. But they are not identical
    in all respects. The following are the differences between array name and a pointer.


    +   - First difference is array name is a constant and a pointer is a variable.
    You can change the value of a pointer by storing an address into it. You cannot
    change the address stored in array name. Because, if the address of the first
    element is lost then the total array will be inaccessible.


    +   - Second difference, a pointer is not initialized whereas an array name is
    initialized to the address of the first element of the array.


    # Pointer to pointer


    It is possible to make a pointer pointing to another pointer. Then it becomes
    a pointer pointing to another pointer, which in turn points to a value. See the
    following example, where we use a pointer to a pointer to integer.


    ```

    01: int ** pp; // pointer to pointer to integer

    02: int *p; // pointer to integer

    03: int v = 20; // integer

    04: p = &v; // make p pointing to v

    05: pp = &p; // make pp pointing to p

    06:

    07: // now all of the below will display 20

    08: printf("Value : %d ", v );

    09: printf("Value : %d ", *p );

    10: printf("Value : %d ", **pp );

    ```


