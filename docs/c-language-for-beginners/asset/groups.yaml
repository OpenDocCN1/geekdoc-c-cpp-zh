    Here are a few examples of types of functions.


    ```

    // Passing parameters and ignoring return value

    printf("We are ignoring return value ");

    ```


    ```

    // Function that takes nothing but returns a value

    ch = getchar();

    ```


    ```

    // Passing a value and taking the return value

    len = strlen(st);

    ```


    As you can see, almost everything in C language is done through functions.


    A function can be defined as a set of instructions meant to perform a task and
    return a value. A function returns one and only one value. A function may also
    take one or more values, but that is optional.


