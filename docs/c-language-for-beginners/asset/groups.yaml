    # C Language For Beginners


    # Variable Properties


    Each variable contains the following properties:


    | Name | Name using which variable is referred. |

    | Data type | Specifies the type of value to be stored. |

    | Value | The current value stored in variable. |

    | Address | Address of the memory location where variable is placed. |


    # Standard Data Types


    The following is the list of standard data types available in C. Apart from standard
    data types programmer can define his own data type (called user-defined datatype).
    We will understand user-defined datatypes later in this book in chapter 15 - structures.


    | Data type | Size(Bytes) | Range of Value |

    | char | 1 | -128 to 127 |

    | unsigned char | 1 | 0-255 |

    | short | 2 | -32768 to 32767 |

    | unsigned short | 2 | 0 to 65535 |

    | int | 2 | -32768 to 32767 |

    | unsigned int | 2 | 0 to 65535 |

    | long | 4 | -2147483648 to 2147483647 |

    | unsigned long | 4 | 0 to 4294967295 |

    | float | 4 | 3.4E-38 to 3.4E+38 |

    | double | 8 | 1.7E-308 to 1.7E+308 |

    | long double | 10 | 3.4E-4932 to 1.1E+4932 |


    Table 3.1: Standard Data Types'
