    n\");\n20:   scanf(\"%d%d\", &t.x, &t.y);\n21:   return t;   // return structure\n\
    22: }\n```\n\n# Pointer to structure\n\nA pointer can also point to structure\
    \ just like how it can point to a standard data type. The process is similar to\
