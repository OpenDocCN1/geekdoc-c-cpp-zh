    C Language For Beginners


    can know that only after the program starts and after we take the value from user.


    So, it is not possible to declare any array of a known size. No matter how large
    array is it might still not be good enough to accommodate required data. Either
    an array with fixed size will be insufficient or too big. In the latter case,
    we waste memory, which is undesired.


    So, what is the remedy? The remedy is to first take the value from user after
    program starts and then calculate the amount of space required to accommodate
    the number of users will input. Allocate memory dynamically and use it to store
    numbers.


    So the steps for the above mentioned process will be:


    +   - Take the number of users will input


    +   - Calculate the number of bytes required to accommodate the data using sizeof
    operator


    +   - Allocate a block of memory to accommodate the required number of bytes using
    library functions and address of that block in a pointer variable


    +   - Store the data in the block that is allocated in the previous step


    +   - Release the block once the usage of the block is over


    # How do we allocate memory dynamically?


    To allocate memory dynamically, we have to use malloc() and calloc() function.
    These take the amount of memory to be allocated and return a pointer pointing
    to the area allocated.


    Here is the syntax of these functions.


    ```

    void * malloc(int size)

    void * calloc(int noelements, int sizeofelement)

    ```


    # malloc()


    Takes the number of bytes to be allocated and returns a pointer that points to
    the allocated block.'
