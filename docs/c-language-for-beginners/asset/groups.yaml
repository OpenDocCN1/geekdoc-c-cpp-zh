    01: // 获取2个数字并显示最小值的程序\n02: main()\n03: {\n04:    int a,b;\n05:\n06:    // 从用户处获取两个数字\n\
    07:    printf(\"Enter 2 numbers : \");\n08:    scanf(\"%d%d\", &a, &b);\n09: \
    \   if (a < b)\n10:        printf(\"Smallest is %d\", a);\n11:    else\n12:  \
    \      printf(\"Smallest is %d\", b);\n13: } // main 结束\n```\n\n## 多重 if 语句 (Multiple\
    \ if statement)\n\n有时，你需要根据不同的条件采取不同的行动。观察以下示例。\n\n```c\n01: // 显示数字正负号的程序\n02:\
    \ main()\n03: {\n04:     int a;\n05: \n06:     printf(\"Enter a number : \");\n\
    07:     scanf(\"%d\", &a);\n08:     if (a < 0)\n09:         printf(\"Negative\"\
    );\n10:     else\n11:         if (a > 0)\n12:             printf(\"Positive\"\
    );\n13:     else\n14:         printf(\"Zero\");\n15: }\n```\n\n在上例中，你有三种选择（正、负和零）。这要求我们一个接一个地检查两个条件。因此，我们必须使用多条语句。首先检查\
    \ `a` 是否小于 0，如果该条件失败，你仍然还有两个选择（正和零）。因此，在采取下一步行动之前，你必须检查其中任何一种可能的情况。\n\n如果条件 `a\
    \ > 0` 为真，意味着 `a` 是正数。由于我们已经检查了 `a` 是否为负，剩下的唯一选项就是零。因此，`else` 部分显示消息“零”。\n\n以下示例根据学生获得的成绩授予学生相应的等级。\n\
    \n```c\n01: #include <stdio.h>\n02: void main()\n03: {\n04:     int marks;\n05:\
