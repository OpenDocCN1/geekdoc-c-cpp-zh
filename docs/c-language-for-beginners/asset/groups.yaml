    19:     comm = samt * 0.04;

    20:

    21: printf("Commission : %f", comm);

    22: } // end of main

    ```


    In the above program, we first check whether code is 1. If code is 1 then we check
    sales amount is more than 10000. If both the conditions are true then commission
    rate is 5%. If code is 1 but sales amount is less than or equal to 10000 then
    commission rate is only 3%. If code is not 1 then we assume it is 2 and check
    for sales amount. If sales amount is more than 20000 then commission rate is 7%
    otherwise 4.


    # Conditional Expression(?):


    This is a ternary operator (an operator with three operands). This is used to
    evaluate a condition and return one of the two given values.


    ```

    a = a > 0 ? 1 : 0;

    ```


    When the value of a is more than 0 then 1 is returned otherwise.


    ```

    condition ? value-1 : value-2

    ```


    When condition is true value-1 is returned, otherwise value-2.


    The following example is used to return biggest of two numbers.


    ```

    biggest = a > b ? a : b;

    ```'
  - "[PAGE 53]\n\n# switch Statement\n\nWhen the number of conditions to be checked\
    \ is more; then if statements become lengthy and difficult to understand. A better\
    \ alternative is switch statement. It is used to take different actions based\
    \ on the result of multiple conditions using the same expression.\n\nIf you have\
    \ to find out discount rate depending on product code, the following switch statement\
    \ can be used.\n\n```\nswitch(pc)\n{\n  case 1 : dis = 0.07; break;\n  case 2\
    \ : dis = 0.08; break;\n  case 3 : dis = 0.05; break;\n  case 4 : dis = 0.06;\
    \ break;\n  case 5 : dis = 0.03; break;\n  default : dis = 0.02;\n};\n```\n\n\
    First value of pc is compared with 1. If condition is true then corresponding\
    \ statements are executed. Otherwise next case is checked and so on. If none of\
    \ the cases is true then statement given after default will be executed.\n\nBy\
    \ default switch executes all statements from the case where condition is true.\
    \ That means if pc is 2 then all the statements starting from case 2 will be executed.\
    \ In order to prevent code of other cases from getting executed, you must use\
    \ break statement to come out of entire switch statement.\n\nTo transfer out of\
    \ switch after the relevant statements are executed, break statement is used.\
    \ Though break is not part of switch statement syntax, it is typically used with\
    \ each case in switch statement.\n\n```\nswitch (expression)\n{\n  case value-1\
    \ : statements;\n  [case value-2 : statements] ...\n  [default : statements]\n\
    }\n```\n\nAt least one case is must and second case onwards is optional and default\
    \ is optional."
