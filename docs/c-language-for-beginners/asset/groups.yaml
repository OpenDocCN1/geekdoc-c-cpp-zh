    \ as ++ and -- operators are used with variable in a separate statement, it will\
    \ make no difference whether they are used before the variable or after the variable.\
    \ However, if they are used with variable in an expression it makes a difference.\n\
    \nWhen the operator is used before the variable it is called as Pre-fix (++a).\
