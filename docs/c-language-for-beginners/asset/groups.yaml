    06:     printf(\"%d\", arr[i]);\n07: }\n08: void main()\n09: {\n10:  int a[];\n\
    11:\n12:  // code to initialize array\n13:  printarray(a);\n14: }\n```\n\n# Returning\
    \ a value\n\nNormally after performing the task, functions return a value. The\
    \ return value may be of any type. But a function can return only one value. To\
    \ return a value from the function we have to first specify what type function\
    \ returns and then have to use return statement in the code of function to return\
    \ the value.\n\nWhen return type is not explicitly mentioned it defaults to int.\
    \ If a function doesn't return any value specify return type as void. The following\
    \ program illustrates it.\n\n```\n01: // Function to return max of two values\n\
    02: int max(int a, int b)\n03: {\n04:   return (a > b ? a : b);\n05: }\n06:\n\
    07: main()\n08: {\n09:   int x, y, big;\n10:\n11:   // x is passed to a, y is\
    \ passed to b\n12:   // return value is copied to big\n13:\n14:   big = max(x,\
    \ y);\n15: }\n```\n\nIn the above example, function max() takes two integers and\
    \ returns the max of two values. The function has specified that it intends to\
    \ return an integer and returned the value using return statement.\n\nNote: Always\
    \ use void as return type when a function doesn't return value.\n\n# Function\
    \ declaration and definition\n\nA function may contain declaration and definition.\
    \ Function declaration specifies function name, return type, and type of parameters.\
    \ This is normally given at the beginning of the program. Though it is not mandatory\
    \ in all cases it is better to declare each function. In fact, header files (.h)\
    \ contain declarations of all standard functions.\n\nThe following is the syntax\
    \ for function declaration.\n\n| return-type functionname ( parameters ); |\n\n\
    Function declaration is called as Prototype Declaration. Though it is not necessary\
    \ in majority of cases it is needed in cases where the following conditions apply:\n\
    \n- Call to function comes before definition of the function\n- Function returns\
    \ non-integer value\n\nThe following is an example where these two conditions\
    \ are satisfied.\n\n```\n01: // Function without prototype declaration\n02: //\
    \ This results in compile time error\n03:\n04: void main()\n05: {\n06:     int\
    \ a, b;\n07:     float avg;\n08:\n09:     /* compiler doesn't know the return\
    \ type.\n10:     So, it assumes average() returns int */\n11:\n12:     avg = average(a,b);\n\
    13: }\n14:\n15: float average(int a, int b)\n16: {\n17:     return (a + b) / 2.0;\n\
    18: }\n```\n\nLook at the above example. Here we have a function called average(),\
    \ which takes two integers and returns a float.\n\nBut as C compiler encounters\
    \ call to function before definition of the function, C compiler assumes the return\
    \ type as integer, which is default return type in C.\n\nBut when compiler gets\
    \ to function definition it understands that the function returns a float. As\
    \ the assumption of the compiler (function returning int) and the reality (function\
    \ returning float) are not matching, it returns an error Type mismatch in redeclaration\
    \ of 'average'.\n\nThe remedy to this is to declare the function before it is\
    \ called using prototype declaration. This lets compiler know that function returns\
    \ float type value and not int type (default type) and that will solve the problem.\n\
    \n```\n01: // prototype declaration for average()\n02:\n03: float average(int,\
    \ int);\n04:\n05: void main()\n06: {\n07:     int a, b;\n08:     float avg;\n\
    09:\n10: // Compiler knows all about average()\n11:     avg = average(a, b);\n\
    12: }\n13:\n14: float average(int a, int b)\n15: {\n16:     return (a + b) / 2.0;\n\
    17: }\n```\n\nNote: It is always better to declare functions and then define them.\n\
    \nAlternatively, it is possible to define a function before it is called to let\
    \ compiler know about function as shown below.\n\n```\n01: float average(int a,\
    \ int b)\n02: {\n03:     return (a + b) / 2.0;\n04: }\n05:\n06: void main()\n\
    07: {\n08:     int a, b;\n09:     float avg;\n10:\n11: // Compiler knows average()\
    \ as it was defined early\n12:     avg = average(a,b);\n13: }\n```\n"
