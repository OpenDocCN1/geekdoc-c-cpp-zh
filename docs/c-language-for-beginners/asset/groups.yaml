    # Arithmetic vs. Logical shift


    While we are shifting bits towards right, the new bits on the left will be filled
    either with the sign of the number or with zero. In case of arithmetic shift,
    new element is 1 if number is positive; O if case of logical shift, the new elements
    are always filled with 0. A given machine may follow either logical shift or arithmetic
    shift.


    # sizeof operator


    This operator is used to find out how many bytes a particular variable or data
    type occupies in memory.


    > sizeof (datatype or variable)


    Especially in C as size of data types is not fixed across compilers, sizeof operator
    is very much needed to know how many bytes a data type occupies in our program.


