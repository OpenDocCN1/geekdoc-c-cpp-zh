    \ of the variable is always the address of the first byte of the space allocated\
    \ to a variable.\n\n# Pointer variable\n\nA pointer variable or a pointer is similar\
    \ to a variable but where a variable stores data, a pointer variable stores address\
    \ of a memory location.\n\nSo a pointer does contain all attributes of a variable\
    \ but what is stored in pointer is interpreted as an address of a memory location\
    \ and not as data.\n\n# How to use a pointer in C?\n\nNow let us see how to use\
    \ a pointer. To use a pointer, first we have to declare a pointer. Then we have\
    \ to assign an address to it and use it.\n\n# Declaring a pointer\n\nThe first\
    \ thing that you have to know is how to declare a pointer variable. A pointer\
    \ variable (or pointer) is declared same as a variable but contains a * before\
    \ the name. following is an example of a pointer variable.\n\n```c\n* p; // p\
    \ is a pointer variable or pointer in brief\n```\n\nNow if you have a look at\
    \ the memory it would look like figure 13.2. Just like a normal variable even\
    \ a pointer variable contains memory allocation.\n\n![](img/97920077b5414e4874bc04c0b534f201_122_0.png)\n\
    \n> Note: A pointer always occupies same number of bytes in memory irrespective\
    \ of datatype it points to, as address always occupies same number of bytes in\
    \ memory.\n\n# Storing address into pointer\n\nWhen a pointer contains the address\
    \ of a variable, the pointer is said to be pointing to that variable. For example,\
    \ in the following code, pointer p is pointing to variable i.\n\n```c\nint *p;\n\
    int i;\n\np = &i;\n```\n\nAfter the above assignment the memory image is shown\
    \ in figure 13.3.\n\n![](img/97920077b5414e4874bc04c0b534f201_123_0.png)\n\nWhen\
    \ p contains the address of i then it is read as p is pointing to i.\n\n# Using\
    \ pointer\n\nSo far have declared a pointer and then stored an address into it.\
    \ But what is the use of storing the address of variable i into pointer p.\n\n\
    When a pointer points to a memory location, we can access the value of that memory\
    \ using a special operator called indirection operator (*). When a pointer is\
    \ used with indirection operator *, you get the value of the location to which\
    \ pointer points.\n\nSo *p will return 50 because p is pointing to memory location\
    \ 200, where value 50 is stored.\n\nThe following program summarizes what you\
    \ learnt so far.\n\nSo, we now know how to declare and use a pointer. Before we\
    \ proceed further we will have to understand a few important points related to\
    \ pointers.\n\n# Significance of data type\n\nWhen you declare an integer using\
    \ int i; variable occupies 2 bytes. And float; would occupy 4 bytes. So data type\
    \ determines how many bytes of memory is given to variable.\n\nBut in pointer's\
    \ case, irrespective of data type pointer always occupies same amount of memory.\
    \ Then what is the use of data type?\n\nTo understand the significance of data\
    \ type in pointer declaration, you need to understand what happens when you use\
    \ *. The following example will explain the process involved in using pointer.\n\
    \n```c\nint i = 50;\nint *ip;\nfloat f = 50;\nfloat *fp;\nip = &i;\nfp = &f;\n\
    printf(\"%d, %f\", *ip, *fp);\n```\n![](img/97920077b5414e4874bc04c0b534f201_125_0.png)\n\
    \nFigure 13.4: Memory image after above code is executed\n\nIn the above example,\
    \ ip contains the address of i, which is 200. When we use *ip to get the value\
    \ of location pointed by ip, we get the value stored in locations 200 and 201.\
    \ Here are the steps that are taken when pointer is used with indirection operator\
    \ (*):\n\n- First value of pointer variable is taken (200 in example).\n- Then\
    \ it goes to location with that address.\n- From that address it takes value from\
    \ n bytes, where n depends on data type of pointer. In case of ip is int, so it\
    \ will be two bytes starting from the given address.\n- But for fp, it will take\
    \ value from four bytes (200 to 203 in example) as float occupies four bytes.\n\
    \n# The need for pointer\n\nSo far we have seen what a pointer is and how to use\
    \ it. But didn't actually understand why we should use pointer. I have used pointer\
    \ only to show you how to declare and use pointer. So whatever you do in this\
    \ chapter can be done without pointer.\n\nThen we ask ourselves, is there anything\
    \ in C that cannot be done unless we use pointer? The answer is Yes. This is the\
    \ reason pointers are so important in C.\n\nTo understand the need of pointer,\
    \ first you execute the following program and see the result.\n\n```c\n// Program\
    \ to swap (interchange) two integers\nvoid swap(int, int); // prototype\nmain()\
    \ {\n    int x, y;\n    printf(\"Enter two numbers: \");\n    scanf(\"%d%d\",\
    \ &x, &y);\n    // Call swap() to interchange values of variables\n    swap(x,\
    \ y);\n    printf(\"Interchanged values are: %d,d\", x, y);\n}\nvoid swap(int\
    \ a, int b) {\n    int temp;\n    temp = a;\n    a = b;\n    b = temp;\n}\n```\n\
    \nThe output of the above program will be:\n\n| Enter two numbers: 10 20 |\n|\
    \ Interchanged values are: 10 20 |\n\nIn the above program interchange has not\
    \ taken place. You have the same old values in x and y after the function swap()\
    \ was completed.\n\nLet us first try to understand why interchange has not taken\
    \ place. First, all variables and parameters are allocated in stack, a part of\
    \ memory available to program.\n\n# STACK\n\n| a | b | temp |\n|---|---|---|\n\
    | 10 | 20 | |\n| 10 | 20 | |\n\nFigure 13.5: Memory image after function swap\
    \ was called, but before statements executed\n\nIn the above program when main\
    \ is invoked, it declares two variables - x and y, and they are allocated memory\
    \ in stack. When function swap is called, it is creating two parameters again\
    \ and temp variable on stack. But each of these variables would occupy separate\
    \ locations in memory. See figure 13.5 for memory image after function swap is\
    \ called but before statements to interchange a and b were executed.\n\nWhen the\
    \ statements in function swap were executed, they only changed the values of variables\
    \ a and b and not the values of variables x and y. This is because variables a\
    \ and b are given separate memory locations and only get the values of x and y.\
    \ After they receive the values of x and y they have no access to x and y therefore\
    \ cannot modify those values.\n\n| a | b | temp |\n|---|---|---|\n| 20 | 10 |\
    \ |\n| 10 | 20 | |\n\nFigure 13.6: Memory image after statements in function swap()\
    \ were executed.\n\nBy default, C passes only values of the variables to parameters.\
    \ When only values of variables are passed to parameters in function, it is called\
    \ pass by value.\n\nIn pass by value, changes made to formal parameters (a and\
    \ b in swap()) have no impact on actual parameters (x and y of main()). But this\
    \ is not enough in this example and we need to somehow access to original locations\
    \ of x and y and change values there. This is exactly what a pointer can do.\n\
    \n# Pass by reference\n\nTo change the value of actual parameter by changing the\
    \ formal parameter you have to pass address of actual parameter, not the value.\n\
    \nWhen you are sending the address of actual parameter, you have to take that\
    \ into a pointer. That means the formal parameter must be a pointer.\n\nFollowing\
    \ is the modified version of previous program to swap two integers.\n\n```c\n\
    // Program to swap (interchange) two integers\nvoid swap(int*, int*) // prototype\n\
    main() {\n    int x, y;\n    printf(\"Enter two numbers: \");\n    scanf(\"%d%d\"\
    , &x, &y);\n    swap(&x, &y);\n    printf(\"Interchanged values are: %d, %d\"\
    , x, y);\n}\nvoid swap(int * a, int * b) {\n    int temp;\n    temp = *a;\n  \
    \  *a = *b;\n    *b = temp;\n}\n```\n"
  mdcn: "\n\n# 理解变量\n\n在我们尝试理解指针之前，让我们先回顾一下学过的关于变量的知识。变量包含一个名称、一个值以及存储该值的内存位置地址。\n\
    \n考虑以下变量声明和内存图。\n\n```c\nint i = 50;\n```\n\n以下是为变量 `i` 分配内存后的内存图。\n\n![](img/97920077b5414e4874bc04c0b534f201_121_0.png)\n\
    \n图 13.1: 内存中的变量 i\n\n本章中使用的所有地址都是虚拟的。它们仅用于帮助你更好地理解概念。因此，观察图 13.1，你会理解整型变量 `i`\
    \ 在内存中分配了两个字节（在某些机器上也可能是四个字节）。\n\n第一个字节位于地址 200，第二个字节位于地址 201。存储在变量中的值是 50。图片没有显示该值具体是如何存储在内存中的。事实上，在这种情况下这并不重要。\n\
    \n以下是图中重要的要点：\n\n- i 是变量的名称\n- 200 是两个字节中第一个字节的地址。第二个字节的地址是 201\n- 50 是变量的值\n\n\
    > 注意：每个内存位置都包含一个地址。变量的地址始终是分配给变量的空间第一个字节的地址。\n\n# 指针变量\n\n指针变量或指针与变量相似，但变量存储数据，而指针变量存储的是内存位置的地址。\n\
    \n因此，指针包含变量的所有属性，但存储在指针中的内容被解释为内存位置的地址，而不是数据。\n\n# 如何在 C 中使用指针？\n\n现在让我们看看如何使用指针。要使用指针，首先我们必须声明指针。然后我们必须给它分配一个地址并使用它。\n\
    \n# 声明指针\n\n你必须知道的第一件事是如何声明指针变量。指针变量（或指针）的声明与变量相同，但在名称前有一个 `*`。以下是一个指针变量的示例。\n\
    \n```c\n* p; // p 是指针变量，简称为指针\n```\n\n现在如果你观察内存，它看起来就像图 13.2 所示。和普通变量一样，即使指针变量也包含内存分配。\n\
    \n![](img/97920077b5414e4874bc04c0b534f201_122_0.png)\n\n> 注意：无论指针指向的数据类型是什么，指针在内存中始终占据相同的字节数，因为地址在内存中始终占据相同的字节数。\n\
    \n# 将地址存入指针\n\n当指针包含变量的地址时，该指针被称为指向该变量。例如，在下面的代码中，指针 `p` 指向变量 `i`。\n\n```c\nint\
    \ *p;\nint i;\n\np = &i;\n```\n\n在上述赋值后，内存图像如图 13.3 所示。\n\n![](img/97920077b5414e4874bc04c0b534f201_123_0.png)\n\
    \n当 `p` 包含 `i` 的地址时，读作 `p` 指向 i。\n\n# 使用指针\n\n到为止我们声明了一个指针并在其中存储了一个地址。但将变量 `i`\
    \ 的地址存入指针 `p` 有什么用呢。\n\n当指针指向一个内存位置时，我们可以使用一个称为间接操作符（`*`）的特殊运算符访问该内存的值。当指针配合间接操作符\
    \ `*` 使用时，你会得到指针指向的位置的值。\n\n因此 `*p` 将返回 50，因为 `p` 指向内存位置 200，那里存储了值 50。\n\n接下来的程序总结了你到为止学到的内容。\n\
    \n所以，我们现在知道如何声明和使用指针了。在继续之前，我们必须理解一些与指针相关的重要要点。\n\n# 数据类型的意义\n\n当你使用 `int i;`\
    \ 声明整数时，变量占用 2 个字节。而 `float;` 会占用 4 个字节。因此，数据类型决定了给变量多少字节的内存。\n\n但在指针的情况下，无论数据类型如何，指针始终占据相同数量的内存。那么数据类型的意义是什么？\n\
    \n要理解数据类型在指针声明中的意义，你需要理解当使用 `*` 时发生了什么。接下来的示例将解释使用指针时涉及的过程。\n\n```c\nint i = 50;\n\
    int *ip;\nfloat f = 50;\nfloat *fp;\nip = &i;\nfp = &f;\nprintf(\"%d, %f\", *ip,\
    \ *fp);\n```\n![](img/97920077b5414e4874bc04c0b534f201_125_0.png)\n\n图 13.4: 执行上述代码后的内存图像\n\
    \n在上面的示例中，`ip` 包含 `i` 的地址，即 200。当我们使用 `*ip` 来获取 `ip` 指向的位置的值时，我们得到了存储在位置 200 和\
    \ 201 的值。这里是配合间接操作符（`*`）使用指针时的步骤：\n\n- 首先取指针变量的值（示例中为 200）。\n- 然后进入该地址的位置。\n-\
    \ 从该地址获取 `n` 个字节的值，其中 `n` 取决于指针的数据类型。在 `ip` 为 `int` 的情况下，它将从给定的地址开始两个字节。\n- 但对于\
    \ `fp`，它将从四个字节中取值（示例中 200 到 203），因为 `float` 占用四个字节。\n\n# 指针的需要\n\n到为止我们已经看到了指针是什么以及如何使用它。但并没有真正理解我们为什么要使用指针。我使用指针只是向你展示如何声明和使用指针。所以你在本章节中做的任何事情都可以不通过指针完成。\n\
    \n那么我们问自己，在 C 中是否有什么东西是不使用指针就无法完成的？答案是定的。这就是指针在 C 中如此重要的原因。\n\n要理解指针的需要，首先执行以下程序并查看结果。\n\
    \n```c\n// 交换两个整数的程序\nvoid swap(int, int); // 原型\nmain() {\n    int x, y;\n  \
    \  printf(\"Enter two numbers: \");\n    scanf(\"%d%d\", &x, &y);\n    // 调用 swap()\n\
    \    swap(x, y);\n    printf(\"Interchanged values are: %d, %d\", x, y);\n}\n\
    void swap(int a, int b) {\n    int temp;\n    temp = a;\n    a = b;\n    b = temp;\n\
    }\n```\n\n上述程序的输出将：\n\nEnter two numbers: 10 20\nInterchanged values are: 10 20\n\
    \n在上述程序中交换没有发生。让我们先尝试理解为什么交换没有发生。\n\n# 栈\n\n| a | b | temp |\n|---|---|---|\n\
    | 10 | 20 | |\n| 10 | 20 | |\n\n图 13.5: 函数被调用但在语句执行之前的内存图像\n\n在上面的程序中，当 `main`\
    \ 调用时声明了两个变量 x 和 y，它们被分配在栈上。当调用 `swap` 时，它再次创建了参数和 `temp` 变量在栈上。但这些变量占据独立的内存位置。参见\
    \ `swap` 函数被调用但在语句执行之前的内存图像。\n\n当 `swap` 函数中的语句执行时，它们只改变了变量 `a` 和 `b` 的值，而不是 `x`\
    \ 和 `y` 的值。这是因为 `a` 和 `b` 被分配了独立的内存位置并且接收了 `x` 和 `y` 的值，因此无法修改这些值。\n\n| a | b\
    \ | temp |\n|---|---|---|\n| 20 | 10 | |\n| 10 | 20 | |\n\n图 13.6: 函数 `swap()`\
    \ 语句执行后的内存图像\n\nC 默认只将变量的值传递给参数。当变量的值传递给函数参数时，这被称为值传递（pass by value）。\n\n在值传递中，对形式参数（`swap`\
    \ 中的 `a` 和 `b`）所做的修改对实际参数（`main` 中的 `x` 和 `y`）没有影响。但在本示例中这还不够，我们需要某种访问 `x` 和 `y`\
    \ 的原始位置并更改值。这正是指针可以做的。\n\n# 引用传递\n\n要通过改变形式参数来改变实际参数的值，你必须传递实际参数的地址而不是值。\n\n当你发送实际参数的地址时，你必须将其引入指针。这意味着形式参数必须是一个指针。\n\
    \n以下是之前交换两个整数程序的修改版本。\n\n```c\n// 交换两个整数的程序\nvoid swap(int*, int*) // 原型\nmain()\
