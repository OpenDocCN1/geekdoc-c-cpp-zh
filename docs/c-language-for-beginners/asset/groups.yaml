    # 12.STORAGE CLASSES


    In this chapter, we will discuss various properties associated with variables
    and functions. It is possible to change some of these properties using storage
    classes.


    +   - Properties of a variable

    - Scope

    - Visibility

    - Extent

    - Storage Class Specifiers

    - Summary

    - Exercises


    # Properties of a variable


    A variable in C language is associated with the following properties.


    | Property | Meaning |

    | --- | --- |

    | Name | Name is used to refer to variable. This is a symbol using which the value
    of the variable is accessed or modified. |

    | Data type | Specifies what type of value the variable can store. |

    | Value | The value that is stored in the variable. The value is not known unless
    the variable is explicitly initialized. |

    | Address | The address of the memory location where the variable is allocated
    space. |

    | Scope | Specifies the region of the program from where variable can be accessed.
    |

    | Visibility | Specifies the area of the program where variable is visible. |

    | Extent | Specifies how long variable is allocated space in memory. |'
  - "[PAGE 111]\n\n# Scope\n\nThe area of the program from where a variable can be\
    \ accessed is called as scope of the variable. Scope of the variable depends on\
    \ where the variable is declared.\n\nThe following snippet will illustrate scope\
    \ of a variable.\n\n```\n// Scope of g is here from here to end of program\nint\
    \ g;\n\nmain()\\{\n    int x; // Scope of x is throughout main function\n}\nvoid\
    \ sum(){\n    int y; // Scope of y is throughout function sum\n....\n}\n```\n\n\
    The scope of a variable may be either **global** or **local**.\n\n# Global Scope\n\
    \nIt means the variable is available throughout the program. It is available to\
    \ all the functions that are defined after the declaration of the variable.\n\n\
    This is the scope of the variables that are declared outside of all functions.\
    \ As we have seen in the previous example, variable **g** has global scope. Which\
    \ means, the variable is accessible to all the functions (main, sum) of the program\
    \ that are defined after the variable defined.\n\n# Local Scope\n\nVariables declared\
    \ within a block (like **x** and **y** in the previous example) are available\
    \ only to that block in which they are declared.\n\nWhen the scope of the variable\
    \ is confined to block it is called as **Local scope**."
  - "[PAGE 112]\n\n# C Language For Beginners\n\nVariable declared at the beginning\
    \ of the block is given local scope. In fact, C allows you to create variables\
    \ not only at the beginning of a function, but also at the beginning of any block.\
    \ The following is an example to show how you can create a variable inside an\
    \ if block.\n\n```\nmain()\n{\\    int v1; // scope is throughout the function\n\
    \n    if(... {\n        int v2; // v2 is accessible only within if block\n   \
    \     ...\n    }\n    else {\n        int v3; // v3 is accessible only within\
    \ else block\n        ...\n    }\n}\n```\n\nYou cannot change the scope of a variable.\
    \ It depends on the place of declaration. You can at the most hide hide a variable,\
    \ which is discussed in the next section.\n\n> Note: Variable with global scope\
    \ is called as \"global variable\" and variable with local scope is called as\
    \ \"local variable\".\n\n# Visibility\n\nNormally visibility and scope are same.\
    \ In other words, a variable is visible throughout the scope. But in one occasion\
    \ the visibility and scope will differ.\n\nVisibility means the region of the\
    \ program in which a variable is visible. A variable can never be visible outside\
    \ the scope. But it may be invisible inside the scope. The following snippet illustrates\
    \ it."
  - "[PAGE 113]\n\n```\n// scope of g is from this point to end\nint g;\nmain()\n\
    {\n    int x;      // scope of x is throughout main\n    ...\n}\nsum()\n{\n  \
    \  int g;\n\n    // Uses local variable g, not global variable g\ng = 20;\n  \
    \  ...\n}\n```\n\nIn this snippet, variable g has global scope. But it becomes\
    \ invisible throughout function sum as a variable with the same name is declared\
    \ in that function. When a global variable is re-declared in a function the local\
    \ variable takes precedence. In other words, all references to g in function sum\
    \ will reference g in function but not declared as global variable. So though\
    \ g has scope throughout program it is not visible throughout function sum.\n\n\
    So, a variable can have scope but may not have visibility in a particular area\
    \ of the program. A variable can never be visible beyond its scope, but it may\
    \ be invisible within the scope. See figure below to understand the difference\
    \ between scope and visibility.\n\n![](img/97920077b5414e4874bc04c0b534f201_113_0.png)"
- md: "\n# C Language For Beginners\n\n## Extent\n\nThis refers to the period of time\
    \ during which a variable resides in the memory. A variable declared inside a\
    \ block has local extent. Because it exists in the memory as long as the block\
    \ is in execution. It is created when block is invoked and removed when the execution\
    \ of the block is completed.\n\nRemember, the block where variable is declared\
    \ may be a function or a compound statement as we have seen before in this chapter.\n\
    \nOn the other hand, variable declared outside all functions has static extent\
    \ as they remain in memory throughout the execution of the program.\n\nThough\
    \ variable is available in the memory, we can access it only from the region of\
    \ the program to where the variable is visible. That means, just because the variable\
    \ is there in the memory we cannot access it, unless it is visible.\n\n## Storage\
    \ Class Specifiers\n\nYou need not explicitly associate a storage class with a\
    \ variable. Because depending upon where a variable is declared, a storage class\
    \ is implicitly associated with variable.\n\nBut in few cases you may have to\
    \ use a storage class specifier while declaring variable.\n\nThe following is\
    \ the complete syntax of variable declaration.\n\n```\n[storage-class] data-type\
    \ variable = value;\n```\n\nThe following are different storage class specifiers:\n\
    \n- auto\n- static\n- register\n- extern\n\n## auto\n\nThis is normally not used\
    \ as it is implicitly associated with all local variables.\n\nAn auto variable\
    \ is automatically created and initialized when control enters into a block and\
    \ removed when control comes out of block.\n\n```\nauto int i = 30; //Auto variable\
    \ with local scope and extent\n```\n\n## static\n\nThis is used to promote local\
    \ extent of a local variable to static extent.\n\nWhen you use static storage\
    \ class while declaring local variable, instead of creating the variable and initializing\
    \ it whenever control enters the block, the variable is created and initialized\
    \ only for once - when variable's declaration is encountered for first time. All\
    \ subsequent calls to function will use current value of variable.\n\nSo, a variable\
    \ with static extent will remain in the memory across the function calls.\n\n\
    Execute the following and see the output.\n\n```c\n01: main()\n02: {\n03:    \
    \ disp();\n04:     disp();\n05: }\n06: disp()\n07: {\n08:     int v = 10;\n09:\
    \ \n10:     printf(\"Value = %d\\n\", v);\n11:     v++;\n12: }\n```\n\nOutput:\n\
    \n| Value = 10 |\n| Value = 10 |\n\nThe reason for output is evident. Whenever\
    \ we enter into disp function, it creates variable v and sets it to 10. As a result\
    \ we always assign 10 to v. Though v is incremented at the end of function, that\
    \ value will be lost as soon as control comes out of function because variable\
    \ v is removed when you move out of the block in which it is declared (disp()\
    \ function).\n\nBut if we want use value of v across function calls then we have\
    \ to use storage specifier static. When we use static storage class, the extent\
    \ of variable is promoted to static and variable remains in memory after control\
    \ comes out of function and as a result the value of the variable also remains.\n\
    \nSee the following program to understand the impact of static storage specifier.\n\
    \n```c\n01: main()\n02: {\n03:   disp();\n04:   disp();\n05: }\n06:\n07: disp()\n\
    08: {\n09:   static int v = 10;\n10:\n11:   printf(\"Value = %d \\n\", v);\n12:\
    \   v++;\n13: }\n```\n\n## Output:\n\n| Value = 10 |\n| Value = 11 |\n\n## register\n\
    \nNormally variables are placed in memory (RAM). But you can gain speed by placing\
    \ a few frequently used variables in registers. Registers are memory locations\
    \ on microprocessor. These memory locations on microprocessor are used for internal\
    \ operations of microprocessor. However, you use them if they are free.\n\nThe\
    \ following is an example to declare a variable with register storage class.\n\
    \n```c\nregister int n;\n```\n\nThe above is a request to compiler to allocate\
    \ a register to variable n instead of allocating memory. If a register is available\
    \ then n is placed in register, otherwise it is as usual given memory allocation.\n\
    \nProgrammer doesn't know which register or memory is allocated to a variable\
    \ that is used with register storage class. So, it is not possible to use address\
    \ operator (&) with variables that contain register storage specifier. This is\
    \ because of the fact that registers do not contain address.\n\nWe have a restriction\
    \ regarding usage of register storage specifier. You cannot use this with non-integer\
    \ variables. The only data types that can be used with this specifier are int\
    \ variants. This is because registers are of int type. However, what type of variables\
    \ and how many variables can be accommodated in registers is largely dependent\
    \ on microprocessor and C doesn't have any restrictions of its own.\n\n**Note:\
    \ It is not possible to use address operator (&) with register variables.**\n\n\
    Also it is important to remember that register storage specifier is only a request\
    \ to compiler to allocate a register if possible. If compiler cannot allocate\
    \ then it ignores the specifier and allocates memory. So, there is no harm in\
    \ using more number of register variables respecting the fact that you cannot\
    \ use address operator.\n\nThe following is an example where register variable\
    \ can really improve performance since it takes less time to access register variable\
    \ compared with normal variable.\n\n```c\nmain()\n{\n    register int i;\n   \
    \ for(i = 0; i < 10000; i++)\n    ...\n}\n```\n\n## extern\n\nA typical project\
    \ in C involves a group of programmers writing individual programs. Later all\
    \ these programs are linked together and a single .EXE file is created using Linker.\n\
    \nWhile these programmers are writing individual programs they may need to access\
    \ the variables defined in other program files.\n\nThe following is an example\
    \ where the programmer writing program a.c has access to a variable count a.c\
    \ is created by another programmer who is writing program b.c. In this case program\
    \ a.c has to access the variable defined in program b.c. This is the case addressed\
    \ by extern specifier.\n\nHere is the code for a.c and b.c.\n\n### A.C\n\n```c\n\
    // Refers to an external variable count\nextern int count;\nvoid inccount()\n\
    {\n    count++;\n}\n```\n\n### B.C\n\n```c\n// Creates variable count with static\
    \ extent\nint count;\nmain()\n{\n    ...\"\n```\n\nWhen a.c and b.c are linked,\
    \ linker resolves all such external references.\n\n## Linker Error\n\nLinker errors\
    \ are errors detected by linker. Compiler detects only syntax errors. That means,\
    \ if you type print() instead of printf(), compiler will not complain about it.\
    \ But linker will detect that missing name.\n\n## Summary\n\n- It is very important\
    \ for every C programmer to know scope, visibility and extent of variable.\n-\
    \ Using storage class specifiers you can change extent of variable (local to static),\
    \ define where variable is to be placed (register or memory) and specify that\
    \ a variable is not defined in the same file and instead elsewhere in the project.\n\
    \n## Exercises\n\n1. ________ is the extent of variables declared outside all\
    \ functions.\n2. ________ attribute of a variable specifies the region from which\
    \ variable can be used.\n3. ________ storage specifier specifies that a variable\
    \ is defined in some other file and not in the file where it is being.\n4. ________\
    \ storage class specifies that local variable should retain its value across function\
    \ calls.\n5. How do you hide a variable?\n6. Is it possible to recreate a global\
    \ variable with a different data type in a function? ________ (Yes/No)\n\n# 13\
    \ pointers\n\nUndoubtedly the most intimidating topic in C language is pointers.\
    \ Believe me or not, pointers are not really too difficult to understand. At least\
    \ up to certain level. Of course, once you cross a few milestones, journey gets\
    \ tough. In this chapter, we will see what a pointer is, where we need pointers\
    \ and how to use pointers.\n\n- What is a pointer?\n- Understanding a variable\n\
    - Pointer variable\n- How to use a pointer in C?\n- The need for a pointer\n-\
    \ Pass by reference\n- scanf() and &\n- Summary\n- Exercises\n\n## What is a pointer?\n\
    \nEvery language uses pointers internally. But what makes pointers in C so special\
    \ and important is their explicit usage. Probably no other language forces programmer\
    \ to deal with pointers as much as C does. C language's explicit usage of pointers\
    \ is understandable considering the fact that it is a language meant for system\
    \ programming, where pointers add extra power needed to language.\n\nWell, understanding\
    \ a pointer is not too difficult. I still stand on that. But what you need to\
    \ understand pointers is a completely disciplined approach and a lot of concentration,\
    \ and of course a few pictures of memory will greatly help you in understanding\
    \ pointers.\n\nFirst let us understand what a pointer is, without bothering about\
    \ why we should use pointers.\n"
  mdcn: "\n\n# 初学者 C 语言\n\n## 范围 (Extent)\n\n这指的是变量在内存中存在的时间。在块内部声明的变量具有局部范围。因为只要块在执行中，它就存在于内存中。它在块被调用时创建，在块执行完成后被移除。\n\
    \n请记住，变量所在的块可以是函数，也可以是复合语句，正如我们在本章之前看到的。\n\n另一方面，在所有函数之外定义的变量具有静态范围，因为它们在整个程序执行过程中一直留在内存中。\n\
    \n尽管变量在内存中可用，但我们只能从程序中变量可见的区域访问它。这意味着，仅仅因为变量在内存中并不能访问它，除非它是可见的。\n\n## 存储类限定符 (Storage\
    \ Class Specifiers)\n\n你不需要显式地为变量关联存储类。因为根据变量声明的位置，存储类会隐式地与变量关联。\n\n但在少数情况下，你在声明变量时可能需要使用存储类限定符。\n\
    \n以下是变量声明的完整语法。\n\n```\n[storage-class] data-type variable = value;\n```\n\n以下是不同的存储类限定符：\n\
    \n- auto\n- static\n- register\n- extern\n\n## auto\n\n这通常不使用，因为它隐式地与所有局部变量关联。\n\
    \n当控制进入块时，auto 变量会自动创建并初始化，当控制离开块时被移除。\n\n```\nauto int i = 30; // 具有局部作用域和范围的\
    \ auto 变量\n```\n\n## static\n\n这用于将局部变量的局部范围提升为静态范围。\n\n当你在声明局部变量时使用 static 存储类时，而不是每次控制进入块时都创建并初始化变量，变量只创建和初始化一次——当第一次遇到变量声明时。随后的所有函数调用将使用变量的当前值。\n\
    \n因此，具有静态范围的变量将在跨函数调用时一直留在内存中。\n\n执行以下代码并查看输出。\n\n```c\n01: main()\n02: {\n03:\
    \     disp();\n04:     disp();\n05: }\n06: disp()\n07: {\n08:     int v = 10;\n\
    09: \n10:     printf(\"Value = %d\\n\", v);\n11:     v++;\n12: }\n```\n\n输出：\n\
    \n| Value = 10 |\n| Value = 10 |\n\n输出的原因显而易见。每当我们进入 disp 函数时，它都会创建变量 v 并将其设置为\
    \ 10。结果我们总是给 v 赋值为 10。虽然 v 在函数末尾被增加，但一旦控制离开函数，该值就会丢失，因为当你移出声明变量 v 的块（disp() 函数）时，变量\
    \ v 就会被移除。\n\n但如果我们想在跨函数调用中使用 v 的值，就必须使用存储限定符 static。当我们使用 static 存储类时，变量的范围被提升为静态，变量在控制离开函数后仍留在内存中，结果变量的值也保留了。\n\
    \n查看以下程序以理解 static 存储限定符的影响。\n\n```c\n01: main()\n02: {\n03:   disp();\n04:  \
    \ disp();\n05: }\n06:\n07: disp()\n08: {\n09:   static int v = 10;\n10:\n11: \
    \  printf(\"Value = %d \\n\", v);\n12:   v++;\n13: }\n```\n\n## 输出：\n\n| Value\
    \ = 10 |\n| Value = 11 |\n\n## register\n\n通常变量被放在内存（RAM）中。但你可以通过将一些频繁使用的变量放在寄存器中来加速。寄存器是微处理器上的内存位置。微处理器上的这些内存位置用于微处理器的内部操作。然而，如果它们空闲，你可以使用它们。\n\
    \n以下是一个使用 register 存储类声明变量的示例。\n\n```c\nregister int n;\n```\n\n上述代码是请求编译器为变量\
    \ n 分配一个寄存器而不是分配内存。如果寄存器可用，则 n 被存放在寄存器中，否则照常分配内存。\n\n程序员并不知道使用 register 存储类的变量被分配到了哪个寄存器或内存。因此，无法对包含\
    \ register 存储限定符的变量使用地址操作符 (&)。这是因为寄存器不包含地址。\n\n我们对 register 存储限定符的使用有一个限制。你不能对非整数变量使用它。可以使用此限定符的唯一数据类型是\
    \ int 变体。这是因为寄存器是 int 类型的。然而，寄存器中可以容纳什么类型的变量以及多少个变量在很大程度上取决于微处理器，C 语言本身没有任何限制。\n\
    \n**注意：无法对 register 变量使用地址操作符 (&)。**\n\n此外，重要的是记住，register 存储限定符只是向编译器在可能的情况下分配寄存器的请求。如果编译器无法分配，它将忽略该限定符并分配内存。因此，在尊重无法使用地址操作符这一事实的情况下，使用更多的\
    \ register 变量也没有害。\n\n以下是一个示例，register 变量确实可以提高性能，因为访问寄存器变量比访问普通变量花费的时间更短。\n\n\
    ```c\nmain()\n{\n    register int i;\n    for(i = 0; i < 10000; i++)\n    ...\n\
    }\n```\n\n## extern\n\nC 语言中的典型项目涉及一组程序员编写单独的程序。随后所有这些程序都被链接在一起。链接器创建了所有的 .EXE\
    \ 文件。\n\n当这些程序员编写单独程序时，可能需要访问在其他文件中定义的变量。这种情况通过 extern 限定符解决。\n\n以下是 a.c 和 b.c\
    \ 的示例。\n\n### A.C\n\n```c\n// 外部变量 count\nextern int count;\nvoid incc()\n{\n\
    \    count++;\n}\n```\n\n### B.C\n\n```c\n// 创建静态范围变量 count\nint count;\nmain()\n\
    {\n    ...\"\n```\n\n当 a.c 和 b.c 链接时，链接器解析所有此类外部引用。\n\n## 链接错误\n\n链接错误是由链接器检测的。编译器只检测语法错误。这意味着，如果你输入\
    \ print() 而不是 printf()，编译器不会报错。但链接器会。\n\n## 总结\n\n- 每个 C 程序员都需要了解变量的作用域、可见性和范围。\n\
    \ 使用 使用存储类你可以更改变量的范围（从局部到静态），定义变量放置的位置（寄存器或内存），并指定变量定义在其他文件中。\n\n## 练习\n\n1. 在函数之外定义的变量范围是\
    \ ________。\n2. 变量的 ________属性指定了它的区域。\n3. ________ 限定符指定变量定义在其他文件中而不是所在文件中。\n\
    4. ________ 存储类指定局部变量跨函数调用时保留其值。\n5. 如何隐藏变量？\n6. 是否可以在函数中用不同的数据类型重建全局变量？________\
    \ (是/否)\n\n# 13 指针\n\nC 语言中最令人生敬畏的话题无疑是指针。信不信由，指针并不真的很难理解。至少在某个水平上是。当然，一旦你跨越了一些里程碑，旅就会变得艰难。在本章中，我们将看到什么是指针，我们需要指针以及如何使用指针。\n\
    \n- 什么是指针？\n- 理解变量\n- 指针变量\n- 如何在 C 中使用指针？\n- 指针的需求\n- 引用传递\n- scanf() 和 &\n-\
    \ 总结\n- 练习\n\n## 什么是指针？\n\n每种语言内部都使用指针。但让 C 语言中的指针如此特别和重要的是它们的显式用法。可能没有其他语言像 C\
    \ 语言这样强制程序员处理指针。\n\n首先让我们理解什么是指针，而不去考虑为什么要使用指针。\n\n"
