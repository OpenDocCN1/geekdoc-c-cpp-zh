    # Conversion functions


    There are two conversion functions related to characters - toupper and tolower.


    ```

    int toupper(int ch)

    ```


    Converts ch to uppercase if it is in lowercase, otherwise returns ch unchanged.


    ```

    int tolower(int ch)

    ```


    Converts ch to lowercase if it is in uppercase, otherwise returns ch unchanged.


    You must include ctype.h to use these functions.


    # Summary


    +   - Clear understanding of character data type is important in C. There are
    a few I-O functions that deal with character alone.


    +   - C provides a set of character classification functions because checking
    the type of a character is very common in C.


    # Exercises


    +   1. is ASCII code for digit 2.


    +   2. function checks whether a character is non-printable character.


    +   3. getchar() reads from


    +   4. What does e in function get() stand for?


    +   5. What happens if you try to read a character using getch() and standard
    input is redirected to a file on the disk?


    +   6. function can be used to display ASCII code of a char.


    +   7. Accept 10 characters and display number of uppercase letters, lowercase
    letters and digits.


    +   8. Accept a character and convert that character to uppercase if it is in
    lowercase or convert it to lowercase if it is in uppercase.


    +   9. Accept characters till the user inputs ''*'' and convert characters to
    lowercase.'
