    # Printing values of variables using printf


    Conversion characters such as %d and %f are used to specify what type of values
    printf function has to display. The following example demonstrates it.


    ```

    01: #include <stdio.h>

    02:

    03: void main()

    04: {

    05:     int a;

    06:     float b;

    07:

    08:     printf("Enter integer and float :");

    09:     scanf("%d%f", &a, &b);      // read values

    10:

    11:     // display values of a and b

    12:     printf("Value of a = %d and b = %f", a, b);

    13: }

    ```


    | Enter integer and float :15 20.34 [Enter Key] |

    | Value of a = 15 and b = 20.34 |


    Depending upon the type of variable you are dealing with, you have to give the
    conversion character. Improper usage of conversion characters may result in wrong
    output.'
