    ```\n\nThe variable that is receiving value is called Lvalue. The Lvalue could\
    \ be any expression that can receive a value of the given type.\n\nIn the above\
    \ statement value 10 is stored in variable a.\n\nIt is very important to understand\
    \ that every assignment operation results in a value, which is the value of the\
    \ Lvalue. An assignment expression can be used anywhere where a value is expected.\
    \ One of the most commonly made mistakes in C beginners is using instead of ==.\
    \ But C doesn't complain about it because even return a value. And moreover, C\
