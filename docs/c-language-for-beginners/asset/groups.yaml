    \n# 16. UNION, ENUMATION and TYPEDEF\n\nIn this chapter, we will see a variant\
    \ of structure called union, creating symbolic constants using enumeration, and\
    \ creating alias to existing data type using typedef.\n\n- Union\n- Enumeration\n\
    - Typedef\n\n# Union\n\nUnion is similar to structure in declaration and usage\
    \ but only one member of the union can be active at a time. Unlike a structure\
    \ in which memory is allocated to all members, a union memory is allocated to\
    \ only largest member. All members of the union will share the same area. That\
    \ is why only one member can be active at a time. Here is the declaration of a\
    \ union.\n\n```c\nunion numbers\n{\n    int a[10];\n    float b[10];\n};\n```\n\
    ![](img/97920077b5414e4874bc04c0b534f201_157_0.png)\n\nWhen you declare a variable\
    \ of union numbers, it will occupy 40 bytes as the largest member of union (b)\
    \ occupies 40 bytes. Both the members a and b will use the same area. See figure\
    \ 16.1 to understand memory allocation for a union.\n\nAs only one member of the\
    \ union can be active at a time, it is the responsibility of the programmer to\
    \ use only one at a time. For example, if we use a in the above example then we\
    \ should not use b. If you try to use both at the same time, though C doesn't\
    \ stop, it will overwrite one data with another. Well, if that is desired result\
    \ it is okay, otherwise watch out for such common errors.\n\nExcept memory allocation,\
    \ there is no difference between a union and a structure. All that is true with\
    \ structure is also true with a union.\n\n# A union is used for two purposes:\n\
    \n- To conserve memory by using the same area for two or more variables\n- To\
    \ represent the same area of the memory in different ways\n\nFollowing is another\
    \ example where we use a union to reduce memory occupied by using the same area\
    \ for two different purposes. However, it is to be noted that this will possible\
    \ only when program needs either of them at a time and not all of them.\n\nIn\
    \ this following example, we store data related to a player in a structure. If\
