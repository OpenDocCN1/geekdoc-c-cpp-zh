    C was designed by Dennis Ritchie. C was not a language that was designed all of
    a sudden

    from the scratch. It was a lengthy process. There was a language called BCPL (Basic

    Combined Programming Language) designed by Martin Richards.


    BCPL was later modified by Ken Thompson and he named the modified version as B.

    Dennis Ritchie modified B language and named the modified version as C. The total

    process took place in late 60s and early 70s. So, C was derived from ‘B’, which
    in turn

    dererived from BCPL. By early 70’s C became popular in system programmers’ community.


    The basic reason for designing a new language at that time was the need for a
    language

    that would be suitable for system programming. Because at that time Unix operating

    system was in, but as it was written in assembly language of PDP machine, the

    operating system was confined to PDP machine the architects of Unix were looking
    for a

    language that was portable (as assembly language is not) and suitable for system

    programming (containing features of assembly language).


    C was designed to be a language for system programming. After C was designed,
    90% of

    Unix operating system was rewritten in C language. So, you can say C was designed
    to

    rewrite Unix in a high-level language. And after C was born it gave a rebirth
    to Unix.


    As C has the language of choice for system programming, you often find C the

    choice for writing Compilers, Interpreters, Viruses, Anti-virus software, and
    Utilities.


    Though C was initially used for system programming, over the years it has become
    a

    general-purpose language and is used in all domains. However, it is very rare
    to find

    a complete database related application being written in C.


    C has been standardized by ANSI (American National Standards Institute), a body
    that

    standards for programming languages. What it all means is, ANSI identifies the
    standard

    features of the language. Each compiler of the language should adhere to these

    standards. Generally all C compilers comply with the standards but they also provide
    extra

    features that are not part of the standards.'
  - '[PAGE 17]


    # Features Of C


    Each programming language has its own idiosyncrasies. So is the case with C. Now,
    let us understand what are the main features of C language.


    # Few Keywords


    There are only 32 keywords in C language. Keyword is a word that is assigned a
    pre-defined task in the language. As C has only a few keywords, a C programmer
    has only a few names to remember.


    # Case Sensitive


    C case sensitive. It means Capital letters are different from small letters. So,
    variable ''A'' is different from variable ''a''. So, you have two variables: one
    in uppercase and another in lower case. Case sensitivity applies even to keywords
    and other elements of the language. All keywords are in lower case. It could be
    a bit tedious to ensure that you type everything in the required case. But as
    you write more and more programs you get used to that that hardly becomes a matter
    of concern.


    # Rich in Operators


    C has more of operators than other programming languages. An operator is a symbol
    that performs a single operation like addition. By using operators, C programmer
    can make source-code very compact - at the same time cryptic. We will discuss
    in detail all the operators available in C in chapter 4.


    # No Input/Output


    C does not provide any input/output facilities as part of the language. However,
    this handicap of C is never felt because all compilers provide a set of functions
    to deal with I/O. ANSI has also included these functions as part of standard C.
    Apart from the set, compilers normally provide more functions to deal with various
    forms of I/O as writing directly at a particular position of the screen.


    However, these extra functions provided by compilers are not consistent across
    compilers. That means, extra functions that you find in one compiler may not be
    provided by another compiler. So, if your program depends on these extra functions
    provided by compiler then it becomes less portable as it becomes dependent.


    # Low-level Language Features


    As C was designed for system programming, it was very important for it to provide
    direct access to system resources as disk and memory. C has done enough to maintain
    balance between high-level language features and low-level language features.'
