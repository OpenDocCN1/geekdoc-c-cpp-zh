    # Initialization of structure variable


    You can initialize a structure variable by listing out values to be stored in
    members of the structure after braces variable, while declaring the variable.


    The following example initializes members en, name, eadd and bs with 100, Norton,
    US and 10000 respectively.


    ```

    struct employee x = {100,"Norton","US",10000};

    ```


    # Structure and function


    A structure can be passed to a function and can also be returned as return value
    of a function.


    To pass a structure to a function you have to pass it just like how you would
    pass standard data types like int and float.


    ```

    01: // Declare a structure for point

    02: struct point

    03: {

    04: int x, y;

    05: };

    06:

    07: // function prototype declaration

    08: void print(struct point t);

    09:

    10: main()

    11: {

    12: struct point p;

    13:

    14: p.x = 10;

    15: p.y = 5;

    16: // pass a structure variable to a function

    17: print(p);

    18: }

    19:

    20: void print(struct point t)

    21: {

    22: printf("%d,%d", t.x, t.y);

    23: }

    ```'
