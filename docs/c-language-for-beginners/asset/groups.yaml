    \ (.h) 包含了所有声明。\n\n以下是函数声明语法：\n\n| 返回类型 函数名 ( 参数 ) |\n\n函数声明被称为原型声明。虽然大多数情况下不需要，但在满足以下条件时需要：\n\
    \n- 在函数定义之前调用函数\n- 函数返回非整数值\n\n以下是满足这两个条件的示例。\n\n```\n01: // Function without\
    \ prototype declaration\n02: // This results in compile time error\n03:\n04: void\
    \ main()\n05: {\n06:     int a, b;\n07:     float avg;\n08:\n09:     /* compiler\
    \ doesn't know the return type.\n10:     So, it assumes average() returns int\
