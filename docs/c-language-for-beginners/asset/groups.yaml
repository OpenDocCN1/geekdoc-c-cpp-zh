    18:     reverse(n / 10);\n19: }\n```\n\nIf you find recursion difficult to understand,\
    \ no need to panic. Because every function is written using recursion can be written\
    \ even without using recursion. However, in certain cases writing recursive version\
    \ is easier than non-recursive version."
