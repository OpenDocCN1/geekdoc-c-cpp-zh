    \n图 8.1: 内存中的数组\n\n数组创建后，无法添加新元素或删除现有元素。换句话说，数组的大小是静态的，在不能更改。如果你想创建一个动态数组，可以使用动态内存分配来创建，对于更复杂的，可以使用链表（关于此点的更多内容将在第\
    \ 21 和第 22 章中讨论）。\n\n# 如何访问元素？\n\n数组包含多个元素。但整个数组通过一个名称访问。因此，要访问数组元素，你必须使用索引或下标以及数组名。索引无非元素的编号。它标识了元素在数组中的位置。\n\
    \n在 C 语言中，数组索引从 0 开始，到元素数量-1 结束。\n\n# 示例程序\n\nmarks [5] = 30; // 将值 30 存储到第 6\
    \ 个元素\n\n以下是一个简单的程序，用于理解如何从数组读取值并反序显示数组元素。\n\n```c\n/* 向数组输入值 \n并反序显示元素的程序 */\n\
    #include <stdio.h>\nvoid main() {\n    int arr[10];\n    int i;\n    // 获取 10\
