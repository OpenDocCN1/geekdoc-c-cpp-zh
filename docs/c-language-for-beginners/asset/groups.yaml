    # 1. INTRODUCTION TO C


    This chapter gives you introduction to C programming language. After this, you
    will be able to get an idea about C language, its history, and its features.


    - What is C language?

    - History of C

    - Features of C

    - Summary


    ## What is C language?


    C is a general-purpose programming language. A programming language is used to
    write programs. A program is a collection of instructions that accomplishes a
    particular task. For example, a program may find out the highest number of 10
    numbers, another program may display the contents of a file on the screen and
    so on. The task that a program accomplishes may just be anything – very complicated
    to trivial. C is one of the most widely used programming languages.


    C is called as middle-level language because it contains the features of high-level
    languages such as Pascal and low-level language - Assembly language. C allows
    the programmer to access system resources directly, a feature only available in
    Assembly language. For example, a program written in C language can directly access
    a location in memory, a sector of the diskette, and send data through the serial
    port of the computer, etc.


    C also has features that are commonly found only in high-level languages like
    Cobol, Pascal, etc. For example, a program written in C is portable. It means,
    it can run on any machine and operating system, as long as a compiler of C is
    available on the target machine to compile source program.


    # C Language For Beginners


    ## History Of C


    C was designed by Dennis Ritchie. C was not a language that was designed all of
    a sudden from the scratch. It was a lengthy process. There was a language called
    BCPL (Basic Combined Programming Language) designed by Martin Richards.


    BCPL was later modified by Ken Thompson and he named the modified version as B.
    Dennis Ritchie modified B language and named the modified version as C. The total
    process took place in late 60s and early 70s. So, C was derived from ‘B’, which
    in turn derived from BCPL. By early 70’s C became popular in system programmers’
    community.


