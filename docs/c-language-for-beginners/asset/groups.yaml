    \ b)\n16: {\n17:     return (a + b) / 2.0;\n18: }\n```\n\n看上面的示例。这里有一个函数 `average()`，它接收两个整数并返回\
    \ `float`。但由于 C 编译器在定义之前遇到调用，它假设返回类型为整数，这是 C 默认的返回类型。当编译器到达函数定义时，它理解函数返回 `float`。由于编译器的假设（返回\
    \ `int`）与事实（返回 `float`）不匹配，它返回错误“average' 重定义类型不匹配”。\n\n解决方法是在调用函数之前使用原型声明对其进行声明。这让编译器知道函数返回\
    \ `float` 类型而不是 `int` 类型（默认类型），从而解决问题。\n\n```\n01: // prototype declaration for\
    \ average()\n02:\n03: float average(int, int);\n04:\n05: void main()\n06: {\n\
    07:     int a, b;\n08:     float avg;\n09:\n10: // Compiler knows all about average()\n\
    11:     avg = average(a, b);\n12: }\n13:\n14: float average(int a, int b)\n15:\
    \ {\n16:     return (a + b) / 2.0;\n17: }\n```\n\n注意：先声明函数再定义它们总是更好的。\n\n另一种方法是在调用之前定义函数以让编译器了解函数，如下所示。\n\
    \n```\n01: float average(int a, int b)\n02: {\n03:     return (a + b) / 2.0;\n\
    04: }\n05:\n06: void main()\n07: {\n08:     int a, b;\n09:     float avg;\n10:\n\
    11: // Compiler knows average() as it was defined early\n12:     avg = average(a,b);\n\
    13: }\n```\n\n"
