    # What is multidimensional array?


    One dimensional array contains multiple columns but only one row. It is used to
    represent single set of values. However, in some cases we need to store multiple
    sets of values. For example, we might have to store marks of 5 students, where
    each student is having 4 subjects. For this, an array containing 5 rows (one for
    each student) and 4 columns (one for each subject) would be ideal.


    A multidimensional array is an array with two or more dimensions. The following
    is an example of declaring two-dimensional array to store marks of students.


    ```

    int marks[5][4];

    ```


    In the above example, marks is an array of 5 rows and 4 columns in each row. Totally
    you can store 20 values in the array.


    The syntax for declaring multidimensional array is:


    ```

    data-type array-name[elements in dimension-1]

    [elements in dimension-2] ...

    ```


    While accessing two-dimensional array, you need two indexes. First index is to
    specify the row to be accessed and second index to specify the column in that
    row.'
