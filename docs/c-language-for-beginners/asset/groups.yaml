    # Writing to binary file with fwrite()


    A data file is another example of binary file. Data file is a collection of records.
    Each record is a structure. The content of structure variable is copied from memory
    to file as it is. So, if an integer is occupying two bytes then it occupies the
    same number of bytes even on the file and the exact memory image is copied to
    file.


