    # A Sample Program


    marks [5] = 30; // will store value 30 into 6th element


    The following is a simple program to understand how to read values from user array
    and display the elements of the array in reverse order.


    ```

    01: /* program to take values into an array

    02: and display elements in reverse order */

    03: #include <stdio.h>

    04: void main()

    05: {

    06:     int arr[10];

    07:     int i;

    08:

    09:     // Take 10 numbers and store in array

    10:     for (i = 0; i < 10; i++)

    11:     {

    12:         printf("Enter a number : ");

    13:         scanf("%d", &arr[i]);

    14:     }

    15:

    16:     // display it in reverse

    17:     for(i = 9; i >= 0; i--)

    18:         printf("%d", arr[i]);

    19:

    20: }

    ```


    At the time of reading value from keyboard we have to use & operator with array
    element in scanf(). Once an element of the array is taken, element is just like
    a variable. In this example arr[i] is equivalent to any int variable as array
    is of int type.'
