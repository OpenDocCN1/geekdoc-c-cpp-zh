    # Summary


    +   - A structure is used to store a collection of values, which may be of different
    types. Each value in a structure is called as a member.


    +   - Once a structure is declared it becomes one of the available data types
    and can be used just like any standard data type. For instance, you can have an
    array of structures, pass structure to a function and return structure from a
    function.


    +   - You can create a pointer to a structure and nest one structure into another.


