    # Summary


    +   Array name points to first element in the array.


    +   Pointers and arrays are closely related. As we have seen, it is possible to
    interchange array notation and pointer notation.


    +   When a pointer is used with arithmetic operators, it is known as pointer arithmetic.


    +   It is possible to have an array of pointers, a pointer to pointer and also
