    \ * 0.04;\n19:     printf(\"Commission : %f\", comm);\n20: } // main 结束\n```\n\
    \n## 条件运算符 (Conditional)\n\n`if` 语句默认允许你执行一条语句，复合语句则用来克服这一局限性。如果你在只允许执行一条语句的情况下必须执行多条语句，那么你必须使用复合语句。\n\
    \n复合语句通过将所有要执行的语句放在的一对大括号 `{}` 中来创建。复合语句可以用任何可以使用简单语句的地方。\n\n以下示例在两个条件任一为真时会执行两个语句。\n\
    \n```c\nif(a > b)\n{\n    c = d;\n    d = e;\n}\nelse\n{\n    a = d;\n    d =\
    \ f;\n}\n```\n\n## 三元运算符 (?:)\n\n有时，你需要根据不同的条件采取不同的行动。观察以下示例。\n\n```c\n01: //\
