    \ {\n04:     int marks;\n05: \n06:     printf(\"Enter marks : \");\n07:     scanf(\"\
    %d\", &marks);\n```\n\n## 初学者 C 语言 延续\n\n```c\n09: // 根据分数显示等级\n10: if (marks\
