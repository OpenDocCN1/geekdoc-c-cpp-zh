    # C Language For Beginners


    Note: Three dots (...) in syntax indicate that the previous item can be repeated
    for any number of times. In the syntax of switch, case statement can be repeated
    for any number of times.


    # Summary


    +   - C provides all conditional statements that many high-level languages would
    provide. Simple if statement is to take either of the two possible actions (or
    only one action depending on the condition). If you need to handle multiple conditions,
    use either multiple if statement or switch statement.


    +   - As comparisons take more time than calculations, it is important to reduce
    the number of conditions by using the right control statement. Learning to use
    control statements fluently is the first milestone in learning a programming language.
    So, read this chapter till you understand everything.


    # Exercises


    +   1. Accept a number and display whether it is an even or odd number. Write
    two programs - one with conditional expression and another with normal if statement.


    +   2. Accept marks in subject and subject code (1 to 4) and display whether student
    passed or failed. Pass mark is based on subject code as follows. 1-40, 2-50, 3-45,
    4-55.


    +   3. Accept two numbers and display the relationship between the two numbers.
    The output should display one of the messages: "Both numbers are equal", "First
    number is bigger" or "Second number is bigger".


    +   4. Accept three numbers from user and display the biggest of three numbers.'
- md: "\n# 6. LOOPING STRUCTURES\n\nLoop is a mechanism through which you repeatedly\
    \ execute a set of statements. Very often in programming you have to repeatedly\
    \ execute a set of statements. For example if you write a program to take marks\
    \ of 20 students and display whether each student passed or failed, you have to\
    \ repeatedly take marks of each student and perform required operations.\n\nIn\
    \ this chapter, we will discuss about available looping structures in C language\
    \ and related statements such as break statement.\n\n- Available looping structures\n\
    - while loop\n- for loop\n- do... while loop\n- break statement\n- continue statement\n\
    - Nested loops\n- Summary\n- Exercises\n\n## Available looping structures\n\n\
    The following are the looping structures available in C language.\n\n- while\n\
    - for\n- do ... while\n\nAll of them are used to execute a set of statements repeatedly.\
    \ However, which one you use depends on which looping structure suits better to\
    \ the requirement.\n\n## while loop\n\nExecutes the statement as long as the given\
    \ condition is true. When condition is false the loop is terminated and next statement\
    \ following the loop will be executed.\n\nThe following example illustrates how\
    \ to use while loop.\n\n```\n01: // Program to print numbers from 1 to 10\n02:\
    \ #include <stdio.h>\n03:\n04: void main()\n05: {\n06: int n = 1;\n07:\n08: //\
    \ repeat loop as long as n is less than 11\n09: while (n < 11)\n10: {\n11:   \
    \  printf(\"%d\\n\", n);\n12:     n++; // Increment n by one\n13: } // end of\
    \ the while loop\n14: }\n```\n\nThe above while loop will display numbers from\
    \ 1 to 10 on the screen.\n\nThe following is the syntax of while loop.\n\n```\n\
    while (condition)\nstatement;\n```\n\nCondition is any valid C condition. Statement\
    \ is repeatedly executed as long as condition is true. Once condition is false,\
    \ loop is terminated and control is transferred to the statement that is immediately\
    \ after the loop.\n\nStatement may be either a single statement or a compound\
    \ statement.\n\nThe following program is used to display the largest of the given\
    \ numbers. It will prompt user to enter numbers until user enters 0 as the number.\n\
    \n```\n01: // Program to display the largest of the given numbers\n02: #include\
    \ <stdio.h>\n03:\n04: void main()\n05: {\n06:     int num;\n07:     int largen\
    \ = 0;\n08:\n09:     printf(\"Enter a number [0 to stop :\");\n10:     scanf(\"\
    %d\", &num);\n11:     while(num != 0) // while(num)\n12:     {\n13:         //\
    \ if num is larger than previous largest\n14:         if (num > largen)\n15: \
    \            largen = num;\n16:\n17:         // take next number\n18:        \
    \ printf(\"Enter a number [0 to stop :\");\n19:         scanf(\"%d\", &num);\n\
    20:     }\n21:     // print the largest\n22:     printf(\"Largest number is :\
    \ %d\", largen);\n23: } // end of main\n```\n\n## for loop\n\nThis is another\
    \ looping structure available in C language.\n\nThis integrates three basic ingredients\
    \ of a loop (initialization, condition and updation). For loop is typically used\
    \ to repeat statements for a fixed number of times. For example, if you know that\
    \ you have to perform an operation for 10 times then for loop is ideal.\n\nThe\
    \ following is an example to display numbers from 1 to 10 using for loop.\n\n\
    ```\n// program to display numbers from 1 to 10\nfor(n = 1; n <= 10; n++)\nprintf(\"\
    %d\\n\", n);\n```\n\nThis is in effect same as loop used previously. But, as it\
    \ combines initialization, condition and updation, it is more easier compared\
    \ with while loop.\n\nHowever, it is a matter of personal choice. Both while and\
    \ for loops do the same job ultimately.\n\nHere is the syntax for loop.\n\n```\n\
    for (initialization; condition ; updation)\n    statement;\n```\n\n### Initialization\n\
    \nExecuted only for once just before loop starts. Normally counter (variable used\
    \ in the loop) is initialized here.\n\n### Condition\n\nAny valid C condition.\
    \ As long as it is true, statement is repeatedly executed.\n\n### Updation\n\n\
    Executed after the statement is executed. Typically contains incrementing counter\
    \ or decrementing counter as the case may be.\n\n### Statement\n\nThis is repeatedly\
    \ executed as long as condition is true. It may be a compound statement also.\n\
    \n> Note: All the above are optional. So, any portion of the loop can be omitted.\
    \ Though a portion omitted, semicolon;) after that must be given.\n\nThe following\
    \ is another example of for loop where initialization and updation parts are omitted.\n\
    \n```\n// Loop terminates when 0 or negative number is given\nfor ( ; n > 0 ;\
    \ )\nscanf(\"%d\", &n);\n```\n\n> Note: In C language, for loop can be used in\
    \ place of while loop and vice-versa. Both of execute statements as long as the\
    \ condition is true and terminate the loop once condition is false.\n\n## Comma\
    \ Operator\n\nIt is possible to have more than one expression in initialization\
    \ and updation portions using, (comma) operator. Comma operator is used to separate\
    \ expressions.\n\nThe following is an example of for loop using comma operator.\n\
    \n```\nfor(i = 0, j = 10; i < j; i++, j--)\nprintf(\"%d %d\", i, j);\n```\n\n\
    ## do...while loop\n\nWhen you need to execute statements at least for once irrespective\
    \ of the result of the condition then you have to use do...while loop. Unlike\
    \ while loop, in which condition is checked at the top of the loop, do...while\
    \ condition is checked at the bottom. Therefore, do...while executes statements\
    \ first and then checks condition. As a result, statements are executed at least\
    \ once as condition is not at all checked before the first iteration.\n\nThe following\
    \ is the syntax for do...while loop.\n\n```\ndo {\n    statements;\n}\nwhile (condition);\n\
    ```\n\nBraces { } } are must for do...while and we can have any number of statements\
    \ between braces.\n\nThe following is an example of do...while loop.\n\n```\n\
    sum = 0;\ndo {\n    printf(\"Enter a number\");\n    scanf(\"%d\", &n);\n    sum\
    \ += n;\n} while (n!=0);\n```\n\n## break statement\n\nThis is used to terminate\
    \ a loop. A loop can be terminated either when condition is false or you execute\
    \ break statement. When you have to terminate loop based on some condition than\
    \ condition of the loop you you use break statement. Consider the following example.\n\
    \n```\nwhile (i <= 10)\n{\n// Terminate loop when n < 0\nif (n < 0)\nbreak;\n\
    }\n```\n\nThe above break terminates the loop when n is less than 0. That means\
    \ the loop when i > 10 (loop condition) or when n < 0 (because of break).\n\n\
    The following program uses for loop and break statement.\n\n```\n01: // Program\
    \ to display sum of 10 numbers or until 0\n02: #include <stdio.h>\n03:\n04: void\
    \ main()\n05: {\n06:     int sum = 0, n, c;\n07:\n08:     for (c = 1; c <= 10;\
    \ c++)\n09:     {\n10:     printf(\"Enter a number [0 to stop]:\n11:     scanf(\"\
    %d\", &n);\n12:     if (n == 0)\n13:         break;\n14:     sum += n;\n15:  \
    \ }\n16:   printf(\"sum = %d\", sum);\n17: }\n```\n\n## continue statement\n\n\
    This is used to transfer control to the beginning of the loop from within the\
    \ loop. It is used to skip the statements after continue statement and enter into\
    \ next iteration of the loop.\n\nThe following example will give you some idea\
    \ about how it works. The program takes 10 positive numbers and displays the sum\
    \ of the numbers.\n\n01: #include <stdio.h>\n02:\n03: void main()\n04: {\n05:\
    \   int n, sum, i;\n06:\n07:   sum = 0;\n08:   i = 1;\n09:   while ( i <= 10 )\n\
    10:  {\n11:     printf(\"Enter a number : \");\n12:     scanf(\"%d\", &n);\n13:\n\
    14:     /* skip the remaining statements\n15:        if number is negative */\n\
    16:\n17:     if ( n < 0 )\n18:       continue;\n19:\n20:     i++;\n21:     sum\
    \ += n;\n22:   }\n23:   printf(\"Sum = %d\", sum);\n24: }\n```\n"
  mdcn: "\n\n# 6. 循环结构\n\n循环是一种允许你重复执行一组语句的机制。在编程中，你经常需要重复执行某组语句。例如，如果你编写一个程序来获取 20\
    \ 个学生的成绩并显示每位学生是及格还是不及格，你就必须反复获取每个学生的分数并执行所需的操作。\n\n在本章中，我们将讨论 C 语言中可用的循环结构以及相关的语句，如\
    \ `break` 语句。\n\n- 可用的循环结构\n- while 循环\n- for 循环\n- do... while 循环\n- break 语句\n\
    - continue 语句\n- 嵌套循环\n- 总结\n- 练习题\n\n## 可用的循环结构\n\n以下是 C 语言中可用的循环结构。\n\n- while\n\
    - for\n- do ... while\n\n所有所有的结构都用于重复执行一组语句。然而，使用哪一个取决于哪种循环结构更符合需求。\n\n## while\
    \ 循环\n\n只要给定的条件为真，就会执行该语句。当条件为假时，循环终止，并执行循环后的下一个语句。\n\n下面的示例说明了如何使用 while 循环。\n\
    \n```\n01: // 打印从 1 到 10 数字的程序\n02: #include <stdio.h>\n03:\n04: void main()\n\
    05: {\n06: int n = 1;\n07:\n08: //只要 n 小于 11 就重复循环\n09: while (n < 11)\n10: {\n\
    11:     printf(\"%d\\n\", n);\n12:     n++; // n 递增 1\n13: } // while 循环结束\n14:\
    \ }\n```\n\n上面的 while 循环将在屏幕上显示从 1 到 10 的数字。\n\n以下是 while 循环的语法。\n\n```\nwhile\
    \ (condition)\nstatement;\n```\n\n条件可以是任何有效的 C 条件。只要条件为真，语句就会重复执行。一旦条件为假，循环终止，控制权转移到紧接在循环之后的语句。\n\
    \n语句可以是单条语句，也可以是复合语句。\n\n下面的程序用于显示给定数字中的最大值。它会提示用户输入数字，直到用户输入 0 为止。\n\n```\n01:\
    \ // 显示给定数字中最大值的程序\n02: #include <stdio.h>\n03:\n04: void main()\n05: {\n06: \
    \    int num;\n07:     int largen = 0;\n08:\n09:     printf(\"Enter a number [0\
    \ to stop :\");\n10:     scanf(\"%d\", &num);\n11:     while(num != 0) // while(num)\
    \ \n12:     {\n13:         // 如果 num 大于之前的最大值\n14:         if (num > largen)\n\
    15:             largen = num;\n16:\n17:         // 获取下一个数字\n18:         printf(\"\
    Enter a number [0 to stop :\");\n19:         scanf(\"%d\", &num);\n20:     }\n\
    21:     // 打印最大值\n22:     printf(\"Largest number is : %d\", largen);\n23: } //\
    \ main 结束\n```\n\n## for 循环\n\n这是 C 语言中另一种可循环结构。\n\n它整合了循环的三个基本要素（初始化、条件和更新）。for\
    \ 循环通常用于重复固定次数的语句。例如，如果你知道需要执行某操作 10 次，那么 for 循环是理想的。\n\n下面是一个使用 for 循环显示从 1 到\
    \ 10 数字的示例。\n\n```\n// 打印从 1 到 10 数字的程序\nfor(n = 1; n <= 10; n++)\nprintf(\"%d\\\
    n\", n);\n```\n\n这在效果上与循环是相同的。但是，由于它整合了初始化、条件和更新，与 while 循环相比更加直观。\n\n这通常取决于个人选择。\n\
    \n这里是 for 循环的语法。\n\n```\nfor (initialization; condition; updation)\nstatement;\n\
    ```\n\n### 初始化\n在循环开始前执行。\n\n### 条件\n只要条件为真，循环就会执行。\n\n### 更新\n在每次迭代后执行。\n\n###\
    \ 语句\n语句可以是单条语句，也可以是复合语句。注意：语句部分是可选的。\n\n```\n... ) \n```\n\n### 逗号\n逗号运算符用于分隔在\
    \ for 循环中的表达式。\n\n```\nfor (initialization; condition; updation)\n```\n\n### do...\
    \ while 循环\n\n当你需要至少执行一次语句时，可以使用 do... while 循环。与 while 循环在顶部检查条件不同，do... while\
    \ 在底部检查条件。\n\n```\ndo {\n    statements;\n} while (condition);\n```\n\n下面是 do...\
    \ while 循环的示例。\n\n```\ndo {\n    // { 语句 }\n} while (condition);\n```\n\n## break\
    \ 语句\n\n用于终止循环。当条件为假时，循环会终止。当你需要根据某些条件终止循环时，可以使用 break 语句。考虑下面的示例。\n\n```\nwhile\
    \ (condition)\n{\n...\nbreak;\n}\n```\n\n上面的 break 在 n 小于 0 时终止循环。这意味着当 n < 0\
    \ 时。\n\n下面的程序使用了 for 循环和 break 语句。\n\n```\n01: // 显示 10 个数字或直到 0 的程序\n02: #include\
    \ <stdio.h>\n03:\n04: void main()\n05: {\n06:     int sum = 0, n, c;\n07:\n08:\
    \     for (c = 1; c <= 10; c++)\n09:     {\n10:     printf(\"Enter a number [0\
    \ to stop]:\n11:     scanf(\"%d\", &n);\n12:     if (n == 0)\n13:         break;\n\
    14:     sum += n;\n15:   }\n16:   printf(\"sum = %d\", sum);\n17: }\n```\n\n##\
    \ continue 语句\n\n用于从循环内部将控制转移到循环开头。它用于跳过 continue 语句之后的语句并进入下一次迭代。\n\n下面的示例将让你了解它是如何工作的。该程序获取\
    \ 10 个正数并显示这些数字之和。\n\n01: #include <stdio.h>\n02:\n03: void main()\n04: {\n05:\
    \   int n, sum, i;\n06:\n07:   sum = 0;\n08:   i = 1;\n09:   while ( i <= 10 )\n\
    10:  {\n11:     printf(\"Enter a number : \");\n12:     scanf(\"%d\", &n);\n13:\n\
    14:     /* 跳过剩余语句\n15:        如果数字是负数 */\n16:\n17:     if ( n < 0 )\n18:     \
    \  continue;\n19:\n20:     i++;\n21:     sum += n;\n22:   }\n23:   printf(\"Sum\
    \ = %d\", sum);\n24: }\n```\n\n"
