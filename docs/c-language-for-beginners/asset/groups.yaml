    Whenever we call line function, we have to pass a value in parentheses. The value
    passed is placed in variable declared in parentheses of function definition (int
    len). In the function, the passed value is referenced using parameter (len).'
  - '[PAGE 103]


    # Actual Parameter


    The value is passed to function while calling the function.


    For example, 10, 40 and 20 values that we passed to line() function in the above
    program.


    # Formal Parameter


    Variable that is used to receive actual parameter. In the above program len in
    function line() is a formal parameter.


    # Passing array as parameter


    When an array is passed as parameter, only the name of the array is given at the
    time of calling function. The formal parameter is to be declared as array. Here
    is an example to print the given array.


    ```

    01: void printarray(int arr[10]) // print an array

    02: {

    03:   int i;

    04:

    05:   for(i = 0; i < 10; i++)

    06:     printf("%5d", arr[i]);

    07: }

    08: void main()

    09: {

    10:  int a[10];

    11:

    12:  // code to initialize array

    13:  printarray(a);

    14: }

    ```


    # Returning a value


    Normally after performing the task, functions return a value. The return value
    may be of any type. But a function can return only one value. To return a value
    from the function, we have to first specify what type of value function returns
    and then we have to use return statement in the code of function to return the
    value.


    When return type is not explicitly mentioned it defaults to int. If a function
    doesn''t return any value then specify return type as void.


    The following program illustrates it.'
  - "[PAGE 104]\n\n# C Language For Beginners\n\n```\n01: // Function to return max\
    \ of two values\n02: int max(int a, int b)\n03: {\n04:   return (a > b ? a : b);\n\
    05: }\n06: \n07: main()\n08: {\n09:   int x, y, big;\n10: \n11:   // x is passed\
    \ to a, y is passed to b\n12:   // return value is copied to big\n13: \n14:  \
    \ big = max(x, y);\n15: }\n```\n\nIn the above example, function max() takes two\
    \ integers and returns the max of two values. The function has specified that\
    \ it intends to return an integer and returned the value using return statement.\n\
    \n> Note: Always use void as return type when a function doesn't return any value.\n\
    \n# Function declaration and definition\n\nA function may contain declaration\
    \ and definition. Function declaration specifies function name, return type, and\
    \ type of parameters. This is normally given at the beginning of the program.\
    \ Though it is not mandatory in all cases, it is better to declare each function.\
    \ In fact, header files (*h) contain declarations of all standard functions.\n\
    \nThe following is the syntax for function declaration.\n\n| return-type functionname\
    \ ( parameters ); |\n\nFunction declaration is called as Prototype Declaration.\
    \ Though it is not necessary in majority of cases, it is needed in cases where\
    \ the following conditions apply:\n\n+   - Call to function comes before definition\
    \ of the function\n- Function returns non-integer value"
  - '[PAGE 105]


    # 106 C Language For Beginners


    The following is an example where these two conditions are satisfied.


    ```

    01: // Function without prototype declaration

    02: // This results in compile time error

    03:

    04: void main()

    05: {

    06:     int a, b;

    07:     float avg;

    08:

    09:     /* compiler doesn''t know the return type.

    10:     So, it assumes average() returns int */

    11:

    12:     avg = average(a,b);

    13: }

    14:

    15: float average(int a, int b)

    16: {

    17:     return (a + b) / 2.0;

    18: }

    ```


    Look at the above example. Here we have a function called average(), which takes
    two integers and returns a float.


    But as C compiler encounters call to function before definition of the function,
    C compiler assumes the return type as integer, which is default return type in
    C.


    But when compiler gets to function definition it understands that the function
    returns a float. As the assumption of the compiler (function returning int) and
    the reality (function returning float) are not matching, it returns an error Type
    mismatch in redeclaration of ''average''.


    The remedy to this is to declare the function before it is called using prototype
    declaration. This lets compiler know that function returns float type value and
    not int type (default type) and that will solve the problem.'
  - '[PAGE 106]


    # C Language For Beginners


    ```

    01: // prototype declaration for average()

    02:

    03: float average(int, int);

    04:

    05: void main()

    06: {

    07: int a, b;

    08: float avg;

    09:

    10: // Compiler knows all about average()

    11: avg = average(a, b);

    12: }

    13:

    14: float average(int a, int b)

    15: {

    16: return (a + b) / 2.0;

    17: }

    ```


    Note: It is always better to declare functions and then define them.


    Alternatively, it is possible to define a function before it is called to let
    compiler know about function as shown below.


    ```

    01: float average(int a, int b)

    02: {

    03: return (a + b) / 2.0;

    04: }

    05:

    06: void main()

    07: {

    08: int a, b;

    09: float avg;

    10:

    11: // Compiler knows average() as it was defined early

    12: avg = average(a,b);

    13: }

    ```'
- md: "\n## Function definition\n\nFunction definition is where the statements to\
    \ be executed are given. When the function is called, the statements given here\
    \ are executed.\n\n```\nreturn-type functionname ( parameters )\n{\n    statements;\n\
    \    return value;\n}\n```\n\n| Return-type | Specifies the type of value a function\
    \ returns. If function doesn't return any value then it must be void. | |\n| :---\
    \ | :--- | :--- |\n| Parameters | Formal parameters of the function. | |\n| Statements\
    \ | The statements to be executed when function is called. | |\n| return | The\
    \ return statement is used to return a value from function. | |\n\n## Recursion\n\
    \nWhen a function calls itself it is called as recursion. Recursion is natural\
    \ way of writing certain functions. Though it sounds a bit intimidating in the\
    \ beginning, once you get used to it, it becomes easy and natural.\n\nThe following\
    \ program displays the given number in reverse order using function reverse(),\
    \ which is recursively called. Every recursive function should have a way to terminate\
    \ the function. That means, at one point it should stop calling itself. Otherwise,\
    \ it becomes never ending recursion and program will be terminated with an error\
    \ saying \"out of stack\".\n\nIf you are wondering what stack has to do with recursion\
    \ then here is the connection. Whenever you call a function, certain information\
    \ about the function, parameters and local variables are placed in a memory structure\
    \ called stack.\n\nIf you call a function several times (which will be the case\
    \ with improperly written recursive function) then the stack may be filled and\
    \ stop the program. So, that is the reason for stack overflow error.\n\n## C Language\
    \ For Beginners\n\n```\n01: // Program to display the number in reverse\n02: main()\n\
    03: {\n04:     int n;\n05: \n06:     printf(\"Enter a number :\");\n07:     scanf(\"\
    %d\",&n);\n08:     reverse(n);\n09: }\n10: void reverse(int n)\n11: {\n12:   \
    \  if ( n == 0 ) return; // stop calling itself\n13: \n14:     // Print last digit\
    \ of the given number\n15:     printf(\"%d\", n % 10);\n16: \n17:     // Call\
    \ function recursively by removing last digit\n18:     reverse(n / 10);\n19: }\n\
    ```\n\nIf you find recursion difficult to understand, no need to panic. Because\
    \ every function is written using recursion can be written even without using\
    \ recursion. However, in certain cases writing recursive version is easier than\
    \ non-recursive version.\n\n## Summary\n\n- A function is a collection of statements\
    \ to do a task. A function may or not take parameters but it always returns a\
    \ single value.\n- Functions may be predefined or user-defined. User-defined functions\
    \ are the ones that are created by user writing the code.\n- A user-defined function\
    \ may contain function declaration, where information about function is supplied\
    \ to compiler, and function definition, where code of the function is written.\
    \ Function returns a value using return statement.\n- When a function calls itself\
    \ it is called as recursion.\n\n## Exercises\n\n- 1. The number of values a function\
    \ can return is ____.\n- 2. ________ statement is used to terminate a function.\n\
    - 3. ________ is the default return type of function.\n- 4. Out of function declaration\
    \ and function definition which is optional?\n- 5. In which order function declaration\
    \ and function definition should be given?\n- 6. When a function calls itself\
    \ it is called as ________.\n- 7. What are the differences between a user-defined\
    \ function and main()?\n- 8. Write a function that takes a number as parameter\
    \ and returns the next odd number.\n- 9. Write a function to take a string as\
    \ parameter and display only non-blank characters of the given string.\n- 10.\
    \ Write a function to take a number and return 1 if it is a prime number otherwise\
    \ 0.\n- 11. Write a function to take a string and return the number of digits\
    \ the string contains.\n- 12. Write a function to take a number and return factorial\
    \ of the given number. Use recursion.\n\n## 12. STORAGE CLASSES\n\nIn this chapter,\
    \ we will discuss various properties associated with variables and functions.\
    \ It is possible to change some of these properties using storage classes.\n\n\
    - Properties of a variable\n- Scope\n- Visibility\n- Extent\n- Storage Class Specifiers\n\
    - Summary\n- Exercises\n\n## Properties of a variable\n\nA variable in C language\
    \ is associated with the following properties.\n\n| Property | Meaning |\n| ---\
    \ | --- |\n| Name | Name is used to refer to variable. This is a symbol using\
    \ which the value of the variable is accessed or modified. |\n| Data type | Specifies\
    \ what type of value the variable can store. |\n| Value | The value that is stored\
    \ in the variable. The value is not known unless the variable is explicitly initialized.\
    \ |\n| Address | The address of the memory location where the variable is allocated\
    \ space. |\n| Scope | Specifies the region of the program from where variable\
    \ can be accessed. |\n| Visibility | Specifies the area of the program where variable\
    \ is visible. |\n| Extent | Specifies how long variable is allocated space in\
    \ memory. |\n\n## Scope\n\nThe area of the program from where a variable can be\
    \ accessed is called as scope of the variable. Scope of the variable depends on\
    \ where the variable is declared.\n\nThe following snippet will illustrate scope\
    \ of a variable.\n\n```\n// Scope of g is here from here to end of program\nint\
    \ g;\n\nmain() {\n    int x;\n}\n\nvoid sum(){\n    int y;\n}\n```\n\nThe scope\
    \ of a variable may be either **global** or **local**.\n\n## Global Scope\n\n\
    It means the variable is available throughout the program. As we have seen in\
    \ the previous example, variable **g** has global scope. It is available to all\
    \ functions that are defined.\n\n## Local Scope\n\nVariables declared within a\
    \ block (like **x** and **y** in the previous example) are available only to that\
    \ block. When the scope of the variable is confined to block it is called **Local\
    \ scope**.\n\n## C Language For Beginners\n\nVariable declared at the beginning\
    \ of a block is given local scope. In fact, C allows you to create variables not\
    \ only at the beginning of a function, but also at the beginning of any block.\
    \ The following is an example to show how you can create a variable inside if\
    \ block.\n\n```\nmain()\n{ int v1; // scope is throughout the function\n\n   \
    \ if(...) {\n        int v2; // v2 is accessible only within block\n        ...\n\
    \    }\n    else {\n        int v3; // v3 is accessible only else block\n    \
    \    ...\n    }\n}\n```\n\nYou cannot change the scope of a variable. It depends\
    \ on the place of declaration. You can at most hide a variable, which is discussed\
    \ in the next section.\n\n> Note: Variable with global scope is called \"global\
    \ variable\" and variable with local scope is called \"local variable\".\n\n##\
    \ Visibility\n\nNormally visibility and scope are same. In other words, a variable\
    \ is visible throughout the scope. But in one occasion the visibility and scope\
    \ will differ.\n\nVisibility means the region of the program in which a variable\
    \ is visible. A variable can never be visible outside its scope. But it may be\
    \ invisible inside the scope. The following snippet illustrates it.\n\n```\n//\
    \ scope of g is from this point to end\nint g;\nmain()\n{\n    int x;      //\
    \ scope of x is throughout main\n    ...\n}\nsum()\n{\n    int g;\n\n    // Uses\
    \ local variable g, not global variable g\ng = 20;\n    ...\n}\n```\n\nIn this\
    \ snippet, variable g has global scope. But it becomes invisible throughout function\
    \ sum as a variable with the same name is declared in that function. When a global\
    \ variable is re-declared in a function the local variable takes precedence. In\
    \ other words, all references to g in function sum will reference g in function\
    \ but not declared as global variable. So though g has scope throughout program\
    \ it is not visible throughout function sum.\n\nSo, a variable can have scope\
    \ but may not have visibility in a particular area of the program. A variable\
    \ can never be visible beyond its scope, but it may be invisible within the scope.\
    \ See figure below to understand the difference between scope and visibility.\n\
    \n![](img/97920077b5414e4874bc04c0b534f201_113_0.png)\n"
  mdcn: "\n\n## 函数定义\n\n函数定义是给出要执行的语句的地方。当函数被调用时，这里提供的语句将会被执行。\n\n```\nreturn-type\
    \ functionname ( parameters )\n{\n    statements;\n    return value;\n}\n```\n\
    \n| 返回类型 | 指定函数返回的值的类型。如果函数不返回任何值，则必须为 void。 | |\n| :--- | :--- | :--- |\n| 参数\
    \ | 函数的形式参数。 | |\n| 语句 | 函数被调用时执行的语句。 | |\n| return | return 语句用于从函数返回值。 | |\n\
    \n## 递归\n\n当函数调用自身时，被称为递归。递归是编写某些函数的自然方式。虽然刚开始听有点令人人生，但一旦你习惯了，它就会变得简单而自然。\n\n\
    以下程序使用函数 reverse() 倒序显示给定的数字，该函数是递归调用的。每个递归函数都应该有一种终止函数的方法。这意味着在某一点，它应该停止调用自己。否则，它将变成无尽的递归，程序将以“栈溢出”（out\
    \ of stack）的错误终止。\n\n如果你在想栈（stack）与递归有什么关系，这里就是联系。每当你调用一个函数时，关于函数、参数和局部变量的某些信息会被存放在名为栈的内存结构中。\n\
    \n如果你多次调用一个函数（这在编写不当的递归函数就会发生），栈可能会被填并停止程序。这就是栈溢出错误的原因。\n\n## C 语言入门\n\n```\n\
    01: // 倒序显示数字的程序\n02: main()\n03: {\n04:     int n;\n05: \n06:     printf(\"Enter\
    \ a number :\");\n07:     scanf(\"%d\",&n);\n08:     reverse(n);\n09: }\n10: void\
    \ reverse(int n)\n11: {\n12:     if ( n == 0 ) return; // 停止调用自己\n13: \n14:  \
    \   // 打印数字的最后一位\n15:     printf(\"%d\", n % 10);\n16: \n17:     // 通过移除最后一位递归调用函数\n\
    18:     reverse(n / 10);\n19: }\n```\n\n如果你觉得递归难以理解，不必恐慌。因为每个使用递归编写的函数都可以不使用递归来编写。然而，在某些情况下，编写递归版本比非递归版本更容易。\n\
    \n## 总结\n\n- 函数是执行某任务的语句集合。函数可以包含参数，也可以不包含，但它总是返回一个值。\n- 函数可以是预定义的也可以是用户定义的。用户定义的函数是用户通过编写代码创建的。\n\
    - 用户定义的函数可能包含函数声明（向编译器提供关于函数的信息）和函数定义（编写函数代码的地方）。函数使用 return 语句返回值。\n- 当函数调用自身时，被称为递归。\n\
    \n## 练习题\n\n- 1. 函数可以返回值的数量是 ____。\n- 2. 使用 ________ 语句来终止函数。\n- 3. ________ 是函数的默认返回类型。\n\
    - 4. 在函数声明和函数定义中，哪一个是可选的？\n- 5. 函数声明和函数定义应该以什么顺序给出？\n- 6. 当函数调用自身时，它被称为 ________。\n\
    - 7. 用户定义的函数和 main() 之间有什么区别？\n- 8. 写一个函数，接受一个数字作为参数并返回下一个奇数。\n- 9. 写一个函数，接受一个字符串作为参数并仅显示给定字符串中的非空白字符。\n\
    - 10. 写一个函数，接受一个数字，如果是质数则返回 1，否则返回 0。\n- 11. 写一个函数，接受一个字符串并返回字符串中包含的数字。\n- 12.\
    \ 写一个函数，接受一个数字并返回该数字的阶乘。使用递归。\n\n## 12. 存储类\n\n在本章中，我们将讨论与变量和函数相关的各种属性。可以使用存储类来改变其中一些属性。\n\
    \n- 变量的属性\n- 作用域 (Scope)\n- 可见性 (Visibility)\n- 范围 (Extent)\n- 存储类说明符\n- 总结\n\
    - 练习题\n\n## 变量的属性\n\nC 语言中的变量与以下属性相关。\n\n| 属性 | 含义 |\n| --- | --- |\n| 名称 | 名称用于引用变量。这是一个符号，用于访问或修改变量的值。\
    \ |\n| 数据类型 | 指定变量可以存储什么类型的值。 |\n| 值 | 存储在变量中的值。除非显式初始化变量，否则该值未知。 |\n| 地址 | 为变量分配空间的内存位置的地址。\
    \ |\n| 作用域 | 指定可以访问变量的程序区域。 |\n| 可见性 | 指定变量可见的程序区域。 |\n| 范围 | 指定变量在内存中分配空间持续多久。\
    \ |\n\n## 作用域\n\n从程序中可以访问变量的区域称为变量的作用域。变量的作用域取决于变量声明的位置。\n\n下面的代码段将说明变量的作用域。\n\
    \n```\n// g 的作用域从这里到程序结束\nint g;\n\nmain() {\n    int x;\n}\n\nvoid sum(){\n \
    \   int y;\n}\n```\n\n变量的作用域可以是**全局的**（global）或**局部的**（local）。\n\n## 全局作用域\n\n\
    这意味着变量在整个程序范围内都是的。正如我们在之前的示例所示，变量 **g** 具有全局作用域。它对所有函数有效。\n\n## 局部作用域\n\n在块内定义的变量（如之前示例中的\
    \ **x** 和 **y**）仅对该块有效。当变量的作用域局限于块时，被称为**局部作用域**。\n\n## C 语言入门\n\n在块开头定义的变量具有局部作用域。事实上，C\
    \ 允许不仅在函数开头创建变量，还可以在任何块开头创建变量。以下是一个如何在 if 块内部创建的示例。\n\n```\nmain()\n{ int v1;\
    \ // 作用域整个函数\n\n    if(...) {\n        int v2; // v2 仅在块内可见\n        ...\n   \
    \ }\n    else {\n        int v3; // v3 仅在 else 块可见\n        ...\n    }\n}\n```\n\
    \n你不能改变变量的作用域。它取决于声明的位置。你最多可以隐藏变量，将在下一节讨论。\n\n> 注意：具有全局作用域的变量被称为“全局变量”，具有局部作用域的变量被称为“局部变量”。\n\
    \n## 可见性\n\n通常情况下可见性和作用域是相同的。换句话说，变量在作用域内是可见的。但在某些情况下，可见性和作用域会有不同。\n\n可见性是指变量可见的程序区域。变量永远不会在作用域之外可见。但在作用域内部它可能是不可见的。下面的代码段说明了这一点。\n\
    \n```\n// g 的作用域从这一点到结束\nint g;\nmain()\n{\n    int x;      // x 的作用域整个 main\n\
    \    ...\n}\nsum()\n{\n    int g;\n\n    // 使用局部变量 g，而不是全局变量 g\ng = 20;\n    ...\n\
    }\n```\n\n在此示例中，变量 g 具有全局作用域。但由于在函数内部声明了同名变量，它在整个 函数中变得不可见。当全局变量在函数中重新声明时，局部变量优先。换句话说，sum\
    \ 函数中对 g 的所有引用将引用函数内的 g，而不是声明为全局的 g。所以，尽管 g 在程序范围内有效，但在 sum 函数中是不可见的。\n\n因此，变量可能有作用域，但在程序的特定区域可能不具有可见性。变量永远不会超出其作用域可见，但在作用域内可能是不可见的。请看下图理解作用域和可见性的区别。\n\
    \n![](img/97920077b5414e4874bc04c0b534f201_113_0.png)\n\n"
