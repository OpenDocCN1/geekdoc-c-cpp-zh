    - Summary


    ## What is C language?


    C is a general-purpose programming language. A programming language is used to
    write programs. A program is a collection of instructions that accomplishes a
    particular task. For example, a program may find out the highest number of 10
    numbers, another program may display the contents of a file on the screen and
    so on. The task that a program accomplishes may just be anything – very complicated
    to trivial. C is one of the most widely used programming languages.


    C is called as middle-level language because it contains the features of high-level
    languages such as Pascal and low-level language - Assembly language. C allows
    the programmer to access system resources directly, a feature only available in
    Assembly language. For example, a program written in C language can directly access
    a location in memory, a sector of the diskette, and send data through the serial
    port of the computer, etc.


    C also has features that are commonly found only in high-level languages like
    Cobol, Pascal, etc. For example, a program written in C is portable. It means,
    it can run on any machine and operating system, as long as a compiler of C is
    available on the target machine to compile source program.


    # C Language For Beginners


    ## History Of C


    C was designed by Dennis Ritchie. C was not a language that was designed all of
    a sudden from the scratch. It was a lengthy process. There was a language called
    BCPL (Basic Combined Programming Language) designed by Martin Richards.


    BCPL was later modified by Ken Thompson and he named the modified version as B.
    Dennis Ritchie modified B language and named the modified version as C. The total
    process took place in late 60s and early 70s. So, C was derived from ‘B’, which
    in turn derived from BCPL. By early 70’s C became popular in system programmers’
    community.


    The basic reason for designing a new language at that time was the need for a
    language that would be suitable for system programming. Because at that time Unix
    operating system was in, but it was not yet standardized. (Note: I fixed the OCR
    repetition here).


    ## Features Of C


    Each programming language has its own idiosyncrasies. So is the case with C. Now,
    let us understand what are the main features of C.


    ## Few Keywords


    There are only 32 keywords in C. Keyword is a word that is assigned a pre-defined
    task. As C has only a few keywords, a C programmer has only a few names to remember.


    ## Case Sensitive


    C case sensitive. It means Capital letters are different from small letters. So,
    variable ''A'' is different from ''a''. So, you have two variables: one in uppercase
    and another in lower case.


    ## No Input/Output


    C does not provide any input/output facilities as part of the language. However,
    this handicap of C is never felt because all compilers provide a set of functions
    to deal with I/O. ANSI has also included these functions as part of standard C.
    Apart from the set, compilers normally provide more functions to deal with various
    forms of I/O as writing directly at a particular position of the screen.


    However, these extra functions provided by compilers are not consistent across
    compilers. That means, extra functions that you find in one compiler may not be
    provided by another compiler. So, if your program depends on these extra functions
    provided by compiler it becomes less portable as it becomes dependent.


    ## Low-level Language Features


    As C was designed for system programming, it was very important for it to provide
    direct access to system resources as disk and memory. C has done enough to maintain
    balance between high-level language features and low-level language features.

