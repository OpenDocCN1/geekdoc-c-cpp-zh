    13:     putch('\\n');\n14:     line(40);\n15:     putch('\\n');\n16:     line(20);\n\
    17: }\n```\n\n# Output\n\nWhenever we call line function, we have to pass a value\
    \ in parentheses. The value passed is placed in variable declared in parentheses\
    \ of function definition (int len). In the function, the passed value is referenced\
    \ using parameter (len).\n\n# Actual Parameter\n\nThe value is passed to function\
    \ while calling the function.\n\nFor example, 10, 40 and 20 values that we passed\
    \ to line() function in the above program.\n\n# Formal Parameter\n\nVariable that\
    \ is used to receive actual parameter. In the above program len in line() is a\
    \ formal parameter.\n\n# Passing array as parameter\n\nWhen an array is passed\
    \ as parameter, only the name of the array is given at the time of calling function.\
    \ Here is an example to print given array.\n\n```\n01: void printarray(int arr[])\
