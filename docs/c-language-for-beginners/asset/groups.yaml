    \ of the conditions is true otherwise false. |\n| ! (NOT) | Reverse the result\
    \ of condition. True will be false and false will be true. |\n\nTable 4.3: Logical\
    \ Operators\n\nHere is the truth table for && (And) :\n\n| Condition-1 | Condition-2\
    \ | Result |\n|---|---|---|\n| True | True | True |\n| True | False | False |\n\
    | False | True | False |\n| False | False | False |\n\n# C Language For Beginners\n\
    \nHere is truth table for || (OR) :\n\n| Condition-1 | Condition-2 | Result |\n\
    |---|---|---|\n| True | True | True |\n| True | False | True |\n| False | True\
    \ | True |\n| False | False | False |\n\nThe following is an example of logical\
