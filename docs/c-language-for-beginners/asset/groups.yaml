    \ : (a > 0) ? \"Positive\" : \"Zero\");\n09: }\n```\n\n## 初学者 C 语言 延续\n\n```c\n\
    09: // 根据分数显示等级\n10: if (marks > 80)\n11:     printf(\"First grade\");\n12: else\n\
    13:     if (marks > 60)\n14:         printf(\"Second grade\");\n15:     else\n\
    16:         if (marks > 50)\n17:             printf(\"Third grade\");\n18:   \
    \  else\n19:         printf(\"Fail\");\n20: }\n```\n\n## switch 语句\n\n当需要检查的条件较多时，`if`\
    \ 语句变得冗长且难以理解。更好的替代方案是 `switch` 语句。它根据结果采取不同的行动。根据产品代码查找折扣率，可以使用以下 `switch` 语句。\n\
    \n```c\nswitch(pc)\n{\n  case 1 : dis = 07; break;\n  case 2 : dis = 08; break;\n\
    \  case 3 : dis = 05; break;\n  case 4 : dis = 06; break;\n\n\n首先将 `pc` 与 1 比较。如果条件为真，则执行相应的语句。否则检查下一个\
    \ case，依此类推。如果没有任何 case 为真，则执行 `default` 后的语句。\n\n默认情况下，`switch` 执行条件为真的语句。这意味着如果\
    \ `pc` 是 2，则从 case 2 开始的所有语句都将执行。为了防止其他 case 的代码被执行，你必须使用 `break` 语句退出整个 `switch`\
    \ 语句。虽然 `break` 不是 `switch` 语句语法的一部分，但它通常在每个 case 中使用。\n\n```c\nswitch (expression)\n\
    {\n  case value-1 : statements;\n  [case value-2 : statements] ...\n  [default\
    \ : statements]\n}\n```\n\n至少有一个 case 是必须的，第二个 case 开始以及 default 是可选的。\n\n## 初学者\
    \ C 语言\n\n注意：语法中的三个点 `...` 表示前一个项目可以重复任意次数。在 `switch` 语法中，`case` 语句可以重复任意次数。\n\
    \n## 总结\n\n- C 提供了许多高级语言所提供的所有条件语句。简单 `if` 语句用于采取两种可能的行动之一（或根据条件采取一种行动）。由于比较所花费的时间比计算长，因此使用正确的控制语句来减少条件的数量是重要的。熟练地使用控制语句是学习编程语言的第一块里程碑。因此，请阅读本章直到理解所有内容。\n\
    \n## 练习\n\n- 1. 接受一个数字并显示它是偶数还是奇数。编写两个程序——一个使用条件运算符，另一个使用普通的 `if` 语句。\n- 2. 接受科目成绩和科目代码（1\
    \ 到 4），并显示学生通过还是不及格。及格根据科目代码如下：1-40、2-50、3-45、4-55。\n- 3. 接受两个数字并显示这两个数字之间的关系。输出应显示以下消息之一：“两个数字相等”、“第一个数字更大”或“第二个数字更大”。\n\
    - 4. 从用户处接受三个数字并显示三个数中最大的。\n\n"
