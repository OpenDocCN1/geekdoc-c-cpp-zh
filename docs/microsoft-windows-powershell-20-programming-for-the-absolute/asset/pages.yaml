    # ALTERING LOOP EXECUTION


    Sometimes certain conditions may occur in which you will want to prematurely terminate
    the execution of a loop. For example, if you wrote a foreach loop in order to
    search an array for a given element and found that element somewhere in the middle
    of the array, rather than iterating through the rest of the array just for the
    fun of it, you''ll probably want to break out of the loop and get with the business
    at hand. Alternatively, you may want to prematurely stop the current iteration
    of a loop, without actually terminating the loop itself. Windows PowerShell supports
    both of these actions through the break and continue commands.


    # Using the break Command


    When the break command is executed, the innermost loop is terminated and processing
    control jumps to the next statement that follows the end of the loop.


    > Loops can be a little confusing to work with when you are just starting out
    as a new programmer. The reason I stated that the break command terminates the
    execution of the "innermost" loop in the preceding sentence is because loops can
    be embedded within one another. The break command will terminate the inner loop
    where it is embedded but will have no impact on the outer loop.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_224_1.png)


    The following example demonstrates how to use the break command to terminate the
    processing of a loop.


    ```

    for ($i = 1; $i -le 10; $i++) {

    if ($i -eq 5) {

    ```'
