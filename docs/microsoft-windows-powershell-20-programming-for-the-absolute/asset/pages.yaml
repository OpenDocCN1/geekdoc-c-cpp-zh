    # MICROSOFT .NET FRAMEWORK


    .NET Framework is a core component of modern Windows PowerShell scripting. Version
    2 of the .NET Framework is a requirement for both Windows PowerShell 1.0 and 2.0.
    It is therefore important that PowerShell programmers have a solid understanding
    of the .NET Framework''s major components and the services it provides. .NET is
    a framework designed to support desktop, network, and Internet-based applications
    and .NET also supports the development of mobile applications for devices such
    as PDAs.


    A framework is a collection of resources that facilitates the development of scripts
    and programs. The purpose of a framework is to alleviate much of the complexity
    involved in developing new programs and scripts by providing programmers access
    to a predefined collection of services and resources, allowing programmers to
    instead focus on the higher level logic required to solve a specific problem.


    . .NET Framework is designed to support the development of applications and scripts
    in conjunction with any .NET-compliant application or script development programming
    language. In fact, Microsoft has generated an entire suite of application programming
    languages built around the .NET Framework. These languages include Visual Basic,
    C++, C#, and j#. Microsoft is promoting the .NET Framework as a key component
    in all its new programming languages. It should be no surprise, therefore that
    Microsoft decided to integrate'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Chapter 3 · Object-Based Scripting with .NET


    for .NET Framework into Windows PowerShell, giving it and its scripting language
    instant access to an enormous range of resources and commands.


    # Key .NET Framework Components


    The .NET Framework acts as an interface between Windows PowerShell and the operating
    system. .NET is responsible for translating script code into a format that can
    be executed on your computer. Figure 3.8 shows the role the .NET Framework plays
    in supporting application and script development.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_108_0.png)


    The .NET Framework consists of two key components, as outlined here.


    +   - .NET Framework class library

    - CLR (common language runtime)


    Don''t be too worried if there are elements in Figure 3.8 that you don''t understand.
    I will cover each in detail in the sections that follow.


    # The .NET Class Library


    Traditional command shells have a very limited recognition of data, typically
    only strings and numbers. However, Windows PowerShell enforces the use of tightly
    structured data. As a result, Windows PowerShell can work with many different
    types of data including, strings, dates, integers, floating-point numbers, Boolean
    data, and so on.


    Structured data is also a key feature of the .NET Framework. With .NET, structured
    data is grouped into different collections to define complex structured classes.
    Classes are used as a template for creating objects, which represents things that
    Windows PowerShell can access and manipulate. An object is a self-contained resource
    that contains information about itself as the code required to access and manipulate
    it. For example, a file, folder, and disk drive are all treated as objects by
    Windows PowerShell.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# 86 Windows PowerShell 2.0 Programming for the Absolute Beginner, Second Edition


    Objects have certain attributes or properties that define a particular characteristic
    of the object. For example, folders have names. Objects provide access to predefined
    collections of code, referred to as methods, which can be executed in order to
    interact with and control the object. For example, a file object provides access
    to methods that can be used to perform all sorts of actions on the file, including
    opening, closing, and deleting it.


    # The Common Language Runtime


    The common language runtime or CLR is responsible for converting Windows PowerShell
    scripts into an executable format that your computer can understand and run. The
    CLR also provides PowerShell with other services, including:


    +   * Compiling

    * Security

    * Memory Management

    * Exception Handling


    # Accessing .NET Framework Resources


    Windows PowerShell provides access to .NET resources through cmdlets. Cmdlets
    provide access to .NET resources while at the same time hiding much of the complexity
    involved. As a PowerShell programmer, you do not have to worry about specific
    .NET classes or their properties and methods. All that you have to do is know
    which cmdlets to use in order to get the type of resources required by your scripts.
    To see what I mean, consider the following series of examples.


    In this first example, let''s execute the Get-ChildItem cmdlet. The Get-ChildItem
    retrieves a list of objects representing each file and subfolder stored in the
    current working directory. The .NET Framework stores a lot of information, or
    properties, about file objects. However, by default, Windows PowerShell only displays
    a few of these properties, as demonstrated here:


    ```

    PS C:\MyScripts> Get-ChildItem

    ```


