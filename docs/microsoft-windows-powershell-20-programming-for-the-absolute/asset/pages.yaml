  md: 'each answer for later analysis. Once the player has finished taking the quiz,
    the player''s answers should be graded and a ranking should be assigned to the
    player based on how well she did.


    The overall steps involved in developing the Seinfeld Trivia Quiz are outlined
    here:


    +   1. Create a new script file and add opening comment statements.

    2. Define variables used in the script to store player answers and keep track
    of the correctly answered questions.

    3. Display a welcome screen.

    4. Display instructions for gameplay and explain the grading scale.

    5. Present the player with the first quiz question.

    6. Display the rest of the quiz questions.

    7. Let the player know when all questions have been answered.

    8. Analyze the answers provided for each quiz question.

    9. Assign a ranking based on the number of correctly answered questions.

    10. Thank the player for taking time to take the quiz.


    # Creating a New Script


    The first step is creating a new PowerShell file named SeinfeldTrivia.ps1 and
    adding the following statements to it.


    ```

    ********************************************************************************

