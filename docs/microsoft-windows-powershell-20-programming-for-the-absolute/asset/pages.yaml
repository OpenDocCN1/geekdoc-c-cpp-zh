  md: '# INTERACTING WITH THE POWERSHELL Command Prompt


    The Windows PowerShell provides programmers with access to 129 (181 for PowerShell
    2.0) cmdlets (pronounced command-lets), each of which is a .NET class that provides
    access to specific system resources. Unlike traditional command shells, the Windows
    PowerShell uses pipelines to pass data between cmdlets; however, instead of passing
    data as text, it is passed as objects. The inherent advantages of this approach
    include:


    +   * When accessed from the command line, data is returned and displayed as text

    * When data is passed from cmdlet to cmdlet, it is passed as objects or structured
    data

    * Data passed between cmdlets is automatically converted into any format that
    is appropriate based the current situation


    Cmdlets also share access to a universal set of options. These options provide
    the ability to specify how errors are handled as well as options that allow you
    to run cmdlets using -WHATIF option that lets you see the effect of a command
    without actually making any changes. Cmdlets also support a -CONFIRM option that
    allows you to prompt the user for approval before execution within scripts.


    Windows PowerShell cmdlets use a syntax that consists of verb-noun. The verb is
    always on the left-hand side and is separated from the noun by a hyphen. The verb
    describes the action that is to take and the noun identifies the target to be
    acted upon. Nouns are specified in a singular form. For example, the Get-* verb
    is a universal verb used to retrieve resources as objects and properties. Using
    the Get-* verb and the Property noun, you could, for example, retrieve information
    about a given object''s properties (e.g., Get-Property).


    By combining the Get-* verb with the Help noun, you can execute the Get-Help cmdlet
    to get help on any cmdlet. For example, Figure 1.9 demonstrates how to use the
    Get-Help cmdlet, which retrieves information about other cmdlets, to get information
    about the Read-Host cmdlet.


    # Starting a New PowerShell Session


    To start a new Windows PowerShell session, select Start > All Programs > Windows
    PowerShell > Windows PowerShell. A new Windows command console is opened and the
    Windows PowerShell command prompt is displayed, as demonstrated in Figure 1.10.'
  merge: -1
  pgno: 40
