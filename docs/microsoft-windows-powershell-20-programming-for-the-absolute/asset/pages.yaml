    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_37_2.png)


    Once installed, you must configure Windows PowerShell before you can begin working
    with it. Although Microsoft markets the Windows PowerShell as a secure environment
    for both command line execution and scripting, the addition of a new shell and
    scripting language opens up the potential for exploitation by hackers. As such,
    Microsoft forces you to explicitly decide whether you trust Microsoft as a publisher
    of PowerShell scripts. Your choices are as follows:


    +   * [D] Do not run

    * [R] Run once

    * [A] Always run

    * [?] Help


    Responding by entering A and pressing the Enter key allows you to run PowerShell
    scripts developed by Microsoft.


    Another security feature implemented by Microsoft is the inability to run scripts
    by double-clicking on them from the Windows desktop. Microsoft also forces you
    to make one more decision before you can start running PowerShell script files
    on your computer by establishing'
