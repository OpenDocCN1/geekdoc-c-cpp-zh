  md: '# CHALLENGES


    +   1. Using the Tic-Tac-Toe game for inspiration, consider creating text-based
    graphic representations of each card assigned to the player and the computer,
    allowing the player to view her hand as if she was handling real cards.

    2. Consider experimenting with Write-Host cmdlet''s -ForegroundColor and -BackgroundColor
    parameters to make the game more visually appealing.

    3. In this implementation of Blackjack, the player and the computer both start
    with a single card. However, in most blackjack games, players start out with two
    cards. Modify the game to correct this deficiency. Also, in addition to reporting
