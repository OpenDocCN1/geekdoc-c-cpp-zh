    project, the Knock Knock Joke game. The creation of this script will demonstrate
    the mechanics involved in creating and running PowerShell scripts. In addition,
    this game will demonstrate how to develop a PowerShell script that can interact
    with the user by retrieving command line input and displaying text output.


    At this point in the book, it is not expected that you will understand each script
    statements or how it works. You will learn the basics of the PowerShell scripting
    language'
