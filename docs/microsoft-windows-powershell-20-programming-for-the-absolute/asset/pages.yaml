    # Processing Incoming Data


    Functions get access to pipeline data through a special variable named $input.
    This variable is automatically populated with all incoming pipeline objects before
    the function begins to execute. If necessary, Windows PowerShell will delay the
    execution of a function until all incoming pipeline object data has been collected.


    As an example of how to access incoming pipeline object data, consider the following
    example.


