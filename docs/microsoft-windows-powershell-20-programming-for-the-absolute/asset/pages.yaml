  md: '# WINDOWS POWERSHELL SCRIPTING


    Windows PowerShell scripts are plain text files with a .ps1 file extension. These
    script files are made up of one or more PowerShell script statements. Once created,
    PowerShell scripts are executed like any PowerShell command or cmdlet, you just
    type in its name at the PowerShell command line name and optionally pass any arguments
    by the script.


    Windows PowerShell comes complete with its own brand-new scripting language, which
    supports a full range of programming language features, including support for:


    +   - variables, arrays, and hashes

    - conditional logic statements

    - looping statements

    - functions

    - error handling


    > HINT You will learn about the Windows PowerShell programming language in Chapters
    3–7.


    # SIMPLIFY POWERSHELL SCRIPT EXECUTION


    To run a PowerShell script, all that you have to do is type in the name of the
    script at the PowerShell command prompt. In response, the PowerShell will search
    every folder in your default search path looking for the specified PowerShell
    script.


    > HINT I suggest that you create a new folder named something like MyScripts and
    make your query the storage location for all your PowerShell script files; this
    will make your script files easy to find.


    To see the contents of your default path, start PowerShell and type `env:path`
    as demonstrated here:


    ```

    PS C:\env:path

    ```


    In response, you should see output similar to this:


    ```

    C:\perl\bin;C:\WINDOWS\system32;C:\WINDOWS\System32\Wbem;c:\Python2

    C:\Program Files\Windows PowerShell\v1.0\nPS C:\Documents and Settings\Owner>

    ```


    This output shows that on my computer, the PowerShell will search each of the
    following folders looking for the specified PowerShell script file.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 26 Programming Windows PowerShell for the Absolute Beginner, Second Edition


    ```

    C:\Perl\bin\

    C:\WINDOWS\system32

    C:\WINDOWS

    C:\WINDOWS\System32\Wbem

    c:\Python22

    C:\Program Files\Windows PowerShell\v1.0\

    ```


    There are a number of different options open to you for making your Windows PowerShell
    scripts easy to execute. For starters, you can store your PowerShell scripts in
    one of the folders that is already listed in your default path. However, this
    is probably not a good idea. It is a much better idea to store them somewhere
    that works better for you and run your PowerShell scripts from there. One way
    to do this is to switch over to the folder where your PowerShell scripts are stored
    and precede the name of your PowerShell script with / when running them.


    ```

    PS C> cd c:\ShellScripts

    PS C> ../knock.ps1

    ```


    By appending, in front of your PowerShell script filename, you temporarily add
    the current folder to your search path, letting PowerShell find it. A more permanent
    way of dealing with things is to add script folder to your default search path,
    which you can do in Windows Vista by clicking on Start and right-clicking on Computer,
    selecting Properties, clicking on the Advanced system settings link and then clicking
    on Continue when prompted for permission to continue. This displays the System
    Properties dialog. Next, click on the Environment Variables button, locate the
    path variable in the System variables list and then click the Edit button and
    append a semicolon by the full path name of your script folder to the end of the
    path string. Once you have finished this modification, you will need to reboot
    your computer for the change to take effect.


    # BACK TO THE KNOCK KNOCK JOKE GAME


