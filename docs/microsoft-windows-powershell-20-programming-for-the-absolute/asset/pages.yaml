    The Story of the Three Amigos is a mad-lib in which player input is collected
    and plugged into key places in the story to allow the user to participate in the
    story-telling experience. Before asking any questions, the game informs the users
    of what is expected from them, as shown in Figure 2.2.


    In total, the user is asked four questions without knowing in advance the context
    in the answers will be used. Figure 2.3 provides an example of one of the questions
    asked by the game.


    Once the game has collected all of the information that it requires, it begins
    telling The Story of the Three Amigos a page at a time. The first page of the
    story is shown in Figure 2.4.'
