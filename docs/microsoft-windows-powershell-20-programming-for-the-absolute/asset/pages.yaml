  md: '# # Designing the Game


    The Rock, Paper, Scissors game challenges the player to outguess the computer
    by selecting superior moves each time a new round is played, based on the scoring
    rules outlined in Table 6.1.


    | Player Move | Computer Move | Result |

    |---|---|---|

    | Rock | Rock | Tie |

    | Rock | Scissors | Player Wins |

    | Rock | Paper | Player Loses |

    | Paper | Paper | Tie |

    | Paper | Rock | Player Wins |

    | Paper | Scissors | Player Loses |

    | Scissors | Scissors | Tie |

    | Scissors | Paper | Player Wins |

    | Scissors | Scissors | Player Loses |


    The player''s move is specified by entering a letter corresponding to a valid
    move (R for Rock, P for Paper, or S for Scissors). The computer''s move is generated
    based on a randomly number. In addition to guiding the player through each round
    of play, the game continuously collects a number of game statistics (total games
    played, wins, losses, and ties), which are displayed at the end of the game.


    The overall logical flow of the Rock, Paper, Scissors game is fairly simple. To
    set it up, we will complete its development in twelve steps, as outlined here:


    +   1. Create a new script file.

    2. Define and initialize script variables.

    3. Display the game''s welcome screen.

    4. Set up a loop to control gameplay.

    5. Generate the computer''s move.

    6. Prompt the player to make a move.

    7. Validate the player''s move.

    8. Translate the player''s move.

    9. Display the computer''s and player''s moves.

    10. Analyze the results of gameplay.

    11. Reset variable values for a new round of play.

    12. Display game statistics.'
  merge: -1
