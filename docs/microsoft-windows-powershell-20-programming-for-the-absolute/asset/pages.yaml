    # Comparing Data Using the if Statement


    The if statement is used to test the value of a condition and to conditionally
    execute statements located in an associated code block based on the results of
    that evaluation. You have already seen the if statement in action on numerous
    occasions in this book. Its syntax is already outlined here:


    ```

    if (condition) code block

    else (condition) code block

    ```


    else {code block}

    condition is a placeholder representing an expression that evaluates to a Boolean
    value of true or false. code_block is a placeholder representing any number of
    statements that are executed based on the results of the test. The if statement
    is very flexible and supports a number of different variations.


    elseif is an optional statement that you can include to test an alternative condition.
    PowerShell allows you to include as many elseif statements as you want. else is
    also an optional statement when added executes its associated control block whenever
    none of the preceding conditional tests evaluate as true.


    The if, elseif, and else statements let you execute statements stored in code
    blocks based on the evaluation of a test, such as a variable, pipeline object,
    or an expression. If you create an if statement that contains multiple elseif
    evaluations, the code block belonging to the first test that evaluates to true
    is executed and the remaining statements in the if statement are skipped.


    # Formulating Statements


