- img_proc: true
  md: '# Chapter 5 • Implementing Conditional Logic


    PS C:\> 5 -eq 10

    False


    You can also compare different types of values such as strings and numbers, as
    demonstrated by the following.


    PS C:\> 5 -eq "X"

    False


    In order to perform this evaluation, Windows PowerShell has to convert the values
    being compared to the same type. When faced with this situation, PowerShell attempts
    to convert the second value to the same type as the first value. A good example
    of how this type of conversion can result in a true value is provided here:


    PS C:\> 5 -eq "5"

    True


    In this example, PowerShell converted the string "5" to its numeric equivalent.
    Windows PowerShell allows you to compare expressions of various levels of complexity,
    as demonstrated here:


    PS C:\> 5 + 7 -eq 3 + 3 + 3 + 3

    True


    Once executed, the value of the expression on the left side of the operator evaluates
    to 12 as does the value of the expression on the right-hand operator.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_184_0.png)


    If you find yourself working from the PowerShell command line and in need of doing
    a quick calculation or two, there is no need to stop what you are doing just so
    you can open the calculator application and crunch a few numbers. Instead, you
    can save yourself a little time by using Windows PowerShell as your calculator.
    For example, if all you need to do is multiply a couple of numbers, just type
    them in using the appropriate PowerShell arithmetic operator, as demonstrated
    here:


    ```

    PS C:\> 5 * 5

    25

    PS C:\>

    ```


