  md: '# NAVIGATING HIERARCHICAL DATA STORES


    Traditional command shells are designed to interact with and navigate the computer''s
    file system. The file system is a hierarchical data store made up of drives, folders,
    and files. In the cmd.exe file, the dir command is used to display the contents
    of the current working directory and the cd command is used to navigate the file
    system''s hierarchical structure. Similar commands are available in Windows PowerShell
    (the Get-ChildItem and Set-Location cmdlets).


    However, unlike traditional shells, Windows PowerShell does not limit itself to
    just the computer''s file system. Instead, Windows PowerShell has the ability
    to access and navigate many different hierarchical data stores, including:


    +   * Alias commands

    * Environment variables

    * Windows PowerShell functions

    * The Windows registry

    * Variables

    * Certificates


    In order to facilitate the access of different hierarchical data stores, Windows
    PowerShell implements a provider model that exposes different hierarchical data
    stores in a manner that simulates a file system. As you, you can not only access
    these different data stores, but you can do so using familiar commands (e.g.,
    cd or Set-Location and dir or Get-ChildItem).


    You can view a list of all the providers supported by Windows PowerShell by executing
    the Get-PSProvider cmdlet, as demonstrated here.


    ```

    PS C:\MyScripts> Get-PSProvider

    ```


    | Name | Capabilities | Drives |

    |---|---|---|

    | Alias | ShouldProcess | (Alias) |

    | Environment | ShouldProcess | (Env) |

    | FileSystem | Filter, ShouldProcess | (C, D, J, K...) |

    | Function | ShouldProcess | (Function) |

    | Registry | ShouldProcess, Transact... | (HKLM, HKCU) |

    | Variable | ShouldProcess | (Variable) |

    | Certificate | ShouldProcess | (cert) |


    ```

    PS C:\MyScripts>

    ```'
