    # Managing Breakpoints


    If you no longer need a specific breakpoint, you can remove it using the Remove-PsBreakpoint
    cmdlet, as demonstrated here:


    ```

    Remove-PsBreakpoint 0

    ```


    Here, o represents the ID assigned to the first breakpoint added in the console
    window. Alternatively, you can remove all of the breakpoints that you have set
    by executing the cmdlet without any arguments as demonstrated here:


    ```

    Remove-PsBreakpoint

    ```


    If, on the other hand, you only want to temporarily disable a breakpoint, you
    can do so:


    ```

    Disable-PsBreakpoint 0

    ```


    This way, you can re-use it by re-enabling it, as demonstrated here:


    ```

    Enable-PsBreakpoint 0

    ```


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_390_0.png)


    > If you do not remember the ID assigned to the breakpoints that you have set,
    you can use the Get-Breakpoint cmdlet to retrieve breakpoint information.


    # BACK TO THE POWERSHELL GAME CONSOLE


    Okay, it is time to turn your attention back to the chapter''s main project, the
    PowerShell Game Console. In this project, you will create a text-based game console
    that displays a menu of PowerShell game scripts, allowing players to start and
    play PowerShell games by entering their menu numbers. Once players finish playing
    a selected game, the game ends and the game console reappears, prompting the player
    to select another game to play.


    # Designing the Game


    The PowerShell Game Console builds its menu on the fly based on the contents stored
    in the folder where your PowerShell scripts are stored. Although the script automatically
    filters out the display of any non-PowerShell script files, it is up to you to
    ensure that the folder only contains game scripts. Other PowerShell scripts, including
    the PowerShell game console itself and your standard PowerShell template script,
    should not reside in the folder.'
