    # # Windows Command Console Editing Features


    Because you access and interact with the Windows PowerShell within the Windows
    command console, you have access to a host of helpful editing features that are
    built into the console. For example, you can edit any command already typed in
    at the command prompt by using the left and right arrow keys to move back and
    forth to locations within the command and then use the Backspace or Delete keys
    to make any necessary changes.


    In addition to this basic command editing capability, you can use any of the edit
    features shown in Table 2.1 to take control of the command line and execute commands.


    Table 2.1 WINDOWS COMMAND CONSOLE EDIT COMMANDS

    | Edit Feature | Result |

    | Up Arrow | Moves back one position in the command line history buffer. |

    | Down Arrow | Moves forward one position in the command line history buffer.
    |

    | Page Up | Moves to the first command stored in the command line history buffer.
    |

    | Page Down | Moves to the last command stored in the command line history buffer.
    |

    | Home | Jumps the cursor to the beginning of the command line. |

    | End | Jumps the cursor to the end of the command line. |

    | Control+Left | Moves the cursor to the left word at a time. |

    | Control+Right | Moves the cursor to the right word at a time. |'
