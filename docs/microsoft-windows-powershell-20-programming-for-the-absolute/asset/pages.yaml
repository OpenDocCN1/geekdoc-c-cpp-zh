  md: '# 22 Microsoft PowerShell 1.0 Programming for the Absolute Beginner, Second
    Edition


    In response to the Get-Process cmdlet, Windows PowerShell displays a structured
    table complete with headings that lists each active process on the computer as
    a bunch of other information related to each process. Most cmdlets accept parameters
    that you can alter to specify how you want them. As you have already seen, by
    itself the Get-Process cmdlet retrieves a list of all the processes running on
    your computer. This cmdlet also support an optional -ProcessName parameter that
    lets you specify a process that it should look for, as demonstrated here:


    ```

    PS C:\ Get-Process -ProcessName Winwin

    ```


    | Handles | NPM(K) | PM(K) | WS(K) | VM(M) | CPU(s) | Id ProcessName |

    | 489 | 16 | 29424 | 54952 | 356 | 24.52 | 5240 WINWORD |


    ```

    PS C:\

    ```


    In this example, the Get-Process command has been instructed to display information
    about the Windows process (if it is running). As you can see, cmdlet parameters
    begin with a hyphen followed by the name of the parameter being specified and
    then the actual parameter. Cmdlet syntax is very straightforward but very strict.
    However, the extra discipline makes Windows PowerShell syntax easy to learn and
    remember.


    The Windows PowerShell is flexible in many circumstances; often you only need
    to type in much as is required to uniquely identify a parameter from other processes.
    As a result, you could retype the previous example as shown next and Windows PowerShell
    will recognize that the argument being passed is the Process-Name parameter.


    ```

    PS C:\ Get-Process -ProcessN winword

    ```


    | Handles | NPM(K) | PM(K) | WS(K) | VM(M) | CPU(s) | Id ProcessName |

    | 495 | 17 | 29548 | 55400 | 361 | 28.88 | 5240 WINWORD |


    ```

    PS C:\

    ```


    Many cmdlets, including the Get-Process cmdlet, define positional parameters,
    allowing you to pass arguments to the cmdlet without explicitly specifying the
    parameter they are supposed to match up against. For example, the first parameter
    expected by the Get-Process cmdlet is the -ProcessName parameter, you can omit
    the -ProcessName or -p and supply just the name of a process. The cmdlet will
    automatically assume that the first argument you pass to it is the name of a process,
    as demonstrated here:'
