  md: '# Deleting a Key-Value Pair


    Associative arrays provide you with access to methods that allow you to manipulate
    their contents. For example, you can remove an entry from an associative array
    using the Remove method, as demonstrated here:


    ```

    $nicknames = @Alexander = "X-Man"; William = "William-D"; Molly = "Mighty-One"

    $nicknames.Remove("Alexander")

    $nicknames

    ```


    When executed, this example will produce the following output:


    | Name | Value |

    |---|---|n| Molly | Mighty-One |

    | William | William-D |


    # Removing Associative Array Contents


    Using the Clear method, you can remove the contents of an associative array, as
    demonstrated by the following:


    ```

    $nicknames.Clear()

    ```


    > HINT: To learn more about hashes, use the Get-Help cmdlet to look up _Associative_Array.


    # BACK TO THE SEINFELD TRIVIA QUIZ


    Okay, let''s turn our attention back to the development of this chapter''s main
    game project, the Seinfeld Trivia Quiz. The development of this game will demonstrate
    how to create an interactive online quiz that presents the player with a series
    of questions that are analyzed and graded. The primary point of focus for you
    as you create this game should be on the use of variables to store and interrogate
    data collected from the player. In addition, you should take note of the use of
    Windows PowerShell escape characters in the generation of display output.


    # Designing the Game


    The Seinfeld Trivia Quiz will begin by displaying a welcome screen and then displaying
    instructions for taking the quiz. Next, it will present a series of five multiple-choice
    questions. The game should validate player answers for each question before accepting
    them and store'
