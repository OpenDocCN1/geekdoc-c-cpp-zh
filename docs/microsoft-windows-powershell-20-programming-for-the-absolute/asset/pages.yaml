    # Restricting Variable Scope


    Up to this point in the book, all the examples that you have seen of variable
    usage involved the use of script-level variables, meaning that once defined, the
    variables could be referenced from any location within your PowerShell scripts.
    However, now that functions have been introduced, things are going to change.


    As discussed in Chapter 4, access to variables is restricted by scope. Within
    a PowerShell script, any variable defined outside of a function is a script-level
    variable. Script-level variables are also local variables to all parts of the
    script file residing outside of functions. However, functions can still access
    script-level variables using a modified variable reference that includes the script
    label. Specifically, script-level variables can be accessed directly by name from
    any function defined within the script, using the following syntax.


    ```

    $localVariable = $script:variableName

    ```


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_252_0.png)


    Script-level scope is established each time a Windows PowerShell script is executed
    and ends when the script stops running.


    Here, $localVariable is the name of a new variable that is local to the function
    in which it is defined. $script identifies the resource being referenced as a
    script-level variable and variableName specifies the name assigned to the variable.
    For example, in the following example, a script-level variable named $userName
    has been defined. Next, a call is made to a function'
