  md: '# INTRODUCTION


    Welcome to the second edition of Microsoft Windows PowerShell 2.0 Programming
    for the Absolute Beginner. Windows PowerShell is a next-generation command shell
    for Microsoft operating systems. A command shell or shell is a text-based interface
    that sits between the user and the operating system, which most people feel looser
    refer to the command prompt. In the case of the Windows PowerShell, the shell
    is both a user interface and a scripting language, both of which have been designed
    from the ground up to facilitate the secure administration of Windows operating
    systems.


    The first edition of this book addressed Windows PowerShell 1.0, which was released
    by Microsoft in November 2006. Although Windows PowerShell 2.0 adds a lot of new
    features and capabilities, it is still 100 percent backward compatible with PowerShell
    1.0. As such, even though this book has been expanded to address Windows PowerShell
    2.0, it still provides complete coverage of PowerShell 1.0. So, regardless of
    which version of PowerShell you are working with, you are going to be served by
    this book.


    The goal of this book is to teach everything you need to know in developing your
    own Windows PowerShell scripts. This, of course, include learning how to interact
    with the Windows PowerShell command line. It will also involve learning a little
    about Microsoft''s .NET Framework. At the same time, you learn how to work with
    other Windows technologies, such as the Windows registry, as you learn how to
    become a PowerShell programmer.


    # WHY POWERSHELL SCRIPTING?


    Windows PowerShell is a next-generation command shell developed by Microsoft to
    run on its latest generation of Windows operating systems. As a shell, you interact
    with Windows PowerShell from the command line. One of the things that makes the
    PowerShell different from cmd.exe, the previous Windows command shell, is that
    PowerShell has been redesigned as an object-based environment that is tightly
    integrated with Microsoft''s .NET Framework. As such, the PowerShell is far more
    powerful and advanced than its predecessor. At the same time, Microsoft worked
    hard to make Windows PowerShell backward compatible. The Windows shell will accept
    and process the same commands as the previous Windows shell,'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'thus preserving any knowledge and experience you may already bring with you
    while also introducing you to a whole new set of capabilities.


    Microsoft provides the Windows PowerShell as a free add-on to Windows operating
    systems. Its scripting language has been designed from the ground up to support
    object-based programming, providing systems administrators and computer hobbyists
    with a tool for automating just about any Windows activity.


    Windows PowerShell makes for a greater scripting language for first-time programmers
    and hobbyists. Professional programmers will also benefit from PowerShell''s scripting
    technology, which provides more robust and powerful scripting capabilities than
    that provided by any other Windows scripting language. You will find that more
    often than not, you can develop scripts to automate a given task more quickly
    and efficiently using the Windows PowerShell than can be done using other scripting
    languages, thus saving time and freeing you up to move on to tackle tasks.


    In short, whether you are interested in learning your programming language or
    looking for an introduction to PowerShell scripting teaches you how to develop
    PowerShell scripts with which you can leverage your existing knowledge of .NET,
    this book should serve you well. If Windows is your operating system of choice,
    Windows PowerShell provides access to a scripting environment that is unmatched
    by other scripting languages. In addition, learning PowerShell scripting will
    provide you with a programming background from which you can then make the jump
    to other .NET programming languages.


    This book will teach you Windows PowerShell scripting and will demonstrate how
    to leverage the scripting capabilities provided by both Windows PowerShell 1.0
    and 2.0. To help learning fun and interesting, you will learn how to program through
    the development of computer games. By the time you have finished this book, not
    only will you have access to a collection of working sample scripts, you will
    also have a foundation upon which you can begin to tackle real-world challenges.


    # Who Should Read This Book?


    My goals in writing this book are to show you how to interact with Windows PowerShell,
    to teach you the fundamentals of how to develop and execute PowerShell scripts,
    and to help you become an effective programmer. I do not make any assumptions
    regarding your previous programming experience, although prior programming experience
    is obviously helpful. I do, however, expect you to have a working familiarity
    with Windows.


    I think that you will find this book''s unique approach of teaching through the
    development of computer games both entertaining and highly productive. Learning
    through the creation'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Microsoft Windows PowerShell 2: Programming for the Absolute Beginner, Second
    Edition


    of computer games not only helps keep things fun but it also provides a unique
    opportunity to experiment with a programming language.


    If you are a first-time programmer or a computer hobbyist, you should find this
    book''s systematic building block approach to programming very helpful, allowing
    you to master basic fundamentals before moving to more advanced topics. By investing
    your time and energy in learning how to program using Windows PowerShell scripting,
    you will develop a programming foundation that translates well to other scripting
    languages such as VBScript, JavaScript, Python, Ruby, and Perl, as well as .NET
    programming languages such as C#, C++, and Visual Basic. Professional programmers
    will also benefit from this book by using it as a quick start guide to PowerShell
    scripting.


    # What You Need to Begin


    In order to work with Windows PowerShell, your computer must run one of the following
    operating systems.


    +   * Windows XP

    * Windows Server 2003

    * Windows Vista

    * Windows Server 2008


    When writing this book, I worked on a computer running Windows Vista. Therefore,
    all of the figures and examples that you will see will be generated on that particular
    operating system. However, everything you should apply to Windows XP, Windows
    Server 2003, and Windows Server 2008 as well.


    The examples shown in this book were developed using Windows PowerShell 2.0 CTP2.
    CTP2 stands for Community Technology Preview version 2 and is an advanced version
    of PowerShell. According to the Windows PowerShell team blog (http://blogs.msdn.com/powershell/),
    PowerShell CTP2 is a feature complete version of Windows PowerShell. As such,
    it should look, act, and behave very much like the general release version of
    PowerShell 2.0 when it is finally released. Except where specifically noted, some
    of the examples that you will see in this book apply to Windows PowerShell 1.0
    as well. However, I have to tell you upfront, that as Windows PowerShell 1.0 is,
    PowerShell 2.0''s new features really take things to the next level and you should
    consider starting out with Windows PowerShell 2.0 CTP2, or the General Release
    Version as soon as it becomes available.


