  md: '# ORGANIZING SCRIPTS USING FUNCTIONS


    ne missing tool in your Windows PowerShell programming arsenal is the ability
    to organize your PowerShell scripts into functions. Functions allow you to write
    code statements once in a named code block and then call them for execution as
    many times as necessary from anywhere in your PowerShell script. By helping to
    central programming logic, functions make your program code easier to maintain
    and understand. Functions also affect variable scope, allowing you to further
    localize variable access, thus helping you to write tighter code. This chapter
    will teach you how to work with functions. In addition, you will also learn how
    to work with filters, although similar to functions, provide a tool for handling
    large amounts of object pipeline more efficiently. You will also learn how to
    create your next computer game, the PowerShell Hangman game.


    Specifically, you will learn how to:


    +   * Set up functions to perform specific tasks

    * Develop functions that accept arguments and return a result

    * Use functions as a means of limiting scope

    * Create filters in order to efficiently process object pipeline data'
