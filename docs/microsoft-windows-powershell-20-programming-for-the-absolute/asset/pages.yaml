  md: "# Chapter 6 • Using Loops to Process Data\n\nloops can be used interchangeably.\
    \ The do until loop can also be used to control the collection of user input,\
    \ as demonstrated in the following example.\n\n$response = \"Play\"\n\n```\ndo\
    \ {\n  $response = Read-Host \"Do you want to play again (Y/N)\"\n} until ($response\
    \ -eq \"N\")\n```\n\nHere, a loop has been set up that prompts the user to respond\
    \ with a value of Y or N. If the user enters Y, the loop repeats. If this was\
    \ a real script, the loop would include additional logic required to perform a\
    \ particular task, which would be performed again each time the user responded\
    \ with Y. As, the loop continues to run and prompt the user for input, until the\
    \ user finally enters a response of N. An example of the output generated by this\
    \ is shown here:\n\n```\nDo you want to play again (Y/N): y\nDo you want to play\
    \ again (Y/N): y\nDo you want to play again (Y/N): y\nDo you want to play again\
    \ (Y/N): y\nDo you want to play again (Y/N): n\nPS C:\\>\n```\n\n# Creating for\
    \ Loops\n\nThe statement is used to create a loop that runs until a specified\
    \ condition becomes true. The loop supports a number of different variations but\
    \ is generally used to execute a specific number of times, based on the value\
    \ of a variable that is used as a counter to keep track of the number of iterations\
    \ made by the loop. The value of the counter can be increased or decreased based\
    \ on the logic being implemented.\n\nThe syntax of the for loop is shown here:\n\
    \n```\nfor (initialization; condition; step)\n(code block)\n```\n\nAll three parameters\
    \ specified above are optional. initialization is a placeholder representing a\
    \ variable that will be used to control the execution of the loop. condition represents\
    \ an expression that is evaluated each time the loop iterates to determine whether\
    \ the loop should run again. As long as the condition remains true, the loop will\
    \ run again. step specifies an incremental value that is added to the value specified\
    \ by the initialization-placeholder. If not specified, Windows PowerShell uses\
    \ a default value of 1 for step."
