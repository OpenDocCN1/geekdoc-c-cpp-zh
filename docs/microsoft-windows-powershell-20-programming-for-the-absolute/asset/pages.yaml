  md: "# Microsoft Windows PowerShell 2.0 Programming for the Absolute Beginner, Second\
    \ Edition\n\n![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_275_0.png)\n\nFIGURE 8.5\n\
    The game has ended in a tie.\n\n# USING THE POWER OF REGULAR EXPRESSIONS\n\nUp\
    \ to this point in the book, you have been validating data based on expected input,\
    \ such as Y or N, when prompting the user for permission to perform a given action.\
    \ However, there will be times when you are unable to strictly control the input\
    \ provided to your PowerShell scripts. Instead, you must be prepared to accept\
    \ any of host of different inputs. To accommodate this type of situation, you\
    \ need to learn how to work with regular expressions. A regular expression is\
    \ a pattern used to describe matching data. Regular expressions have many uses\
    \ and benefits. For example, regular expressions can be used to facilitate string\
    \ searches within text documents. As this chapter's game project demonstrates,\
    \ regular expressions are also an important tool that can be used to validate\
    \ user input.\n\n# Matching Simple Patterns\n\nRegular expressions are generally\
    \ evaluated from left to right. Windows PowerShell implements regular expressions\
    \ using the -match operator. Matches occur when a specified pattern is found in\
    \ a specified source string. Perhaps the simplest regular expression is one that\
    \ defines a specific pattern made up of one or more characters, as demonstrated\
    \ by the following.\n\n```\nif (\"Once upon a time\" -match \"ONCE\") {\n    Write-Host\
    \ \"Match!\"\n}\n```\n\nHere, source string \"Once upon a time\" is searched to\
    \ see if it contains a matching pattern of \"ONCE\". When executed, this example\
    \ results in a match. By default, matches are not case-sensitive. However, using\
    \ the -match operator, you can perform case-sensitive matches, as demonstrated\
    \ here:"
  merge: -1
  pgno: 275
- img_proc: true
  md: "```\nif (\"Once upon a time\" -match \"ONCE\") {\n  Write-Host \"We have a\
    \ match!\"\n}\n```\n\nIn this example, a match does not occur. Windows PowerShell\
    \ also makes it easy for you to perform negative pattern matching operations by\
    \ supplying you with the -notmatch operator, which can be used as demonstrated\
    \ by the following.\n\n```\nif (\"Once upon a time\" -notmatch \"XXX\") {\n  Write-Host\
    \ \"We have a match!\"\n}\n```\n\nHere, a match occurs because the pattern being\
    \ searched for cannot be found in the specified search string. Windows PowerShell\
    \ also allows you to perform case-sensitive pattern matching-using the -notmatch\
    \ operators, as demonstrated next.\n\n```\nif (\"Once upon a time \" -notmatch\
    \ \"XXX\") {\n  Write-Host \"We have a match!\"\n}\n```\n\nWhen executed, this\
    \ example results in a match because the expression being searched for is found\
    \ in the search string.\n\n# Matching Alternative Patterns\n\nWindows PowerShell's\
    \ support for regular expressions also lets you set up pattern matches that can\
    \ look for different sets of patterns. To specify this type of pattern match,\
    \ you use the | character in order to separate each possible matching string.\n\
    \n```\nif (\"mar*\" -match \"war|mar|jar\") {\n  Write-Host \"Match!\"\n}\n```\n\
    \nIn this example, a pattern has been defined that looks for any of three matching\
    \ patterns. If any one of these patterns is found, the match is successful. To\
    \ be more efficient, you could rewrite the previous example, as demonstrated next.\n\
    \n```\nif (\"mar*\" -match \"wa|ma|ja)r\") {\n  Write-Host \"Match!\"\n}\n```\n\
    \nIn this more efficient pattern, the unique portions of each possible pattern\
    \ match have been grouped together and enclosed within parentheses and the shared\
    \ portion of the pattern match has been placed outside of the parentheses."
