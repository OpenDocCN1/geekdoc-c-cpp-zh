    # Waiting for a Background to Complete


    As you have already seen, the Get-PSJob cmdlet returns a table that lists all
    of the background jobs in the currently working environment (except for those
    that have been deleted). The HasMoreData column in the table shows whether background
    jobs have any data that is ready for retrieval. By default, each time you retrieve
    from a background job, that output is removed from the job and is no longer retrieveable.
    Subsequent retrieval operations only retrieve data that has not already retrieved.


    > The Retrieve-PSJob cmdlet supports a -keep argument when used, instructs PowerShell
    to retain all of the output belonging to a background job, so that it will be
    there the next time a retrieval is performed.


    If you have a background job that you decided to wait on before continuing your
    work, you can execute the Wait-PSJob cmdlet, passing the cmdlet session ID of
    the background job that it should wait on. When you do this, the Windows PowerShell''s
    prompt goes away and does not reappear until the specified background job finishes.
    To get a better understanding of how this works, take a look at the following
    example:


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_126_0.png)'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 104 | Windows PowerShell 7.2 Programming for the Absolute Beginner: Second
    Edition


    PS C:\> Start-PSJob "Start-Sleep 60"


    | SessionId | Name | State | HasMoreData | Command |

    |---|---|---|---|---|n| 15 | | Running | True | Start-Sleep 60 |


    PS C:\> Wait-PSJob 15


    Here, a background job has been started that runs a cmdlet named Start-Sleep.
    The Start-Sleep cmdlet does what its name implies, puts your PowerShell script
    to sleep for a specified period of time. In the case of this example, it goes
    to sleep for 60 seconds. Since the Start-Sleep cmdlet was executed as a background
    job, you are free to continue working at the Windows PowerShell command prompt
    while the cmdlet executes. However, the execution of the Wait-PSJob cmdlet in
    this example changes things, suppressing the command prompt until the background
    finishes its execution.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_127_0.png)


    Using a combination of the Get-PSJob and the Wait-PSJob cmdlets, you can build
    a statement that waits for all background jobs to finish executing, as demonstrated:


    ```

    Get-PSJob | Wait-PSJob

    ```


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_127_1.png)


    To facilitate discussion and keep the example simple, all of the background jobs
    examples that you have seen have demonstrated how to execute cmdlets that quickly
    and produce recognizable output. In reality, background jobs are better utilized
    to execute long running jobs that take time to execute, such as the example shown
    here:


    ```

    $MyJob = Start-PSJob -command -Get-EventLog -log application-

    ```


    This background job retrieves all of the records stored in the computer''s application
    event log. Depending on the size of the application event log, the background
    job might take a while to execute. If this statement were part of a script that
    processed the event log data in some manner, things might take even longer to
    run.


    # Stopping Background Job Execution


    If you want, you can halt the execution of a background job using the Stop-PSJob
    cmdlet, as demonstrated here:


    ```

    PS C:\> Stop-PSJob 15

    ```'
