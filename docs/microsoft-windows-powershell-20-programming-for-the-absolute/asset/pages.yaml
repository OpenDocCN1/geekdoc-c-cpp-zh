    \n# REPLACING FUNCTIONS WITH FILTERS\n\nA filter is very much like a function,\
    \ except that instead of waiting for all incoming data to be received and stored\
    \ in $input, filters have immediate access to incoming data as it becomes available\
    \ via the $_ variable. Filters are structured exactly like functions, except that\
    \ the filter keyword is specified in place of the function keyword, as demonstrated\
    \ by the following.\n\n```\nfilter Get-OddEven {\n\n$x - $_ % 2\n\nif ($x -eq\
    \ 1) {\n  $result = \"Odd\"\n}\nelse {\n  $result = \"Even\"\n}\n\n$result\n}\n\
    ```"
