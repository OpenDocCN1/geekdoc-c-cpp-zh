  md: '# 400 Microsoft Windows PowerShell 2.0 Training for Absolute Beginner, Second
    Edition


    Special Variables. A collection of variables created and managed by Windows PowerShell
    that provides access to commonly used information.


    Split-Path. A Windows PowerShell cmdlet that streams a string with the qualifier,
    parent path, or leaf item.


    Start-PSDebug. A Windows PowerShell 2.0 cmdlet that starts the interactive PowerShell
    debugger.


    Start-PSJob. A Windows PowerShell 2.0 cmdlet that starts a background job.


    Start-PSTransition. A Windows PowerShell 2.0 cmdlet that begins a new transaction.


    Start-Service. A Windows PowerShell cmdlet that starts a service that has been
    stopped.


    Start-Sleep. A Windows PowerShell cmdlet that suspends the shell, script, or runspace
    activity for the specified amount of time.


    Start-Transcript. A Windows PowerShell cmdlet that starts a transcript for a command
    session.


    Stop-Process. A Windows PowerShell cmdlet that stops an active process.


    Stop-PSJob. A Windows PowerShell 2.0 cmdlet that terminates a background job.


    Stop-Service. A Windows PowerShell cmdlet that stops an active service.


    Stop-Transcript. A Windows PowerShell cmdlet that stops the transcription process.


    Subclass. A class that inherits base object definitions from its parent class
    and includes its own modifications.


    Suspend-Service. A Windows PowerShell cmdlet that suspends an active service.


    Switch. A statement used to define a collection of different test and code blocks,
    each of which evaluates the same expression.


    Syntactic Error. An error that occurs as a result of not following the syntax
    of the PowerShell scripting language.


    Tab Completion. An editing feature that enables you to type a part of a command
    and to press the Tab key to obtain assistance in filling out the rest of the command.


    Tee-Object. A Windows PowerShell cmdlet that sends input objects to two different
    places.


    Terminating Error. An error that halts the execution of a PowerShell script.


    Test-Path. A Windows PowerShell cmdlet that returns True if a path exists and
    False if it does not.'
  merge: -1
  pgno: 423
- img_proc: true
  md: 'Trace-Command. A Windows PowerShell cmdlet that enables the tracing of a trace
    source instance.


    Trace. The process of tracing the execution of script statements when executing
    a script.


    Transaction. The exchange of a sequence of data, that unless completed in its
    entirety, it can be rolled back and cancelled.


    Trap Handler. A collection of statements that are executed when an exception occurs.


    Try-Finally-Catch. A structure for handling exceptions in order to gracefully
    manage script errors.


    Undo-PSTransaction. A Windows PowerShell 2.0 cmdlet that rolls back and undoes
    a transaction.


    UnregisterEvent. A Windows PowerShell 2.0 cmdlet that cancels an event registration.


    Update-FormatData. A Windows PowerShell 2.0 cmdlet that modifies data files.


    Update-List. A Windows PowerShell 2.0 cmdlet adds and removes items from a property
    value containing a collection of objects.


    Update-Type. A Windows PowerShell 2.0 cmdlet that updates the types.ps1 file.


    Use-PSTransaction. A Windows PowerShell 2.0 cmdlet that allows the current transaction
    to be applied against transacted objects.


    Values. Containers in which actual data is stored in the Windows registry.


    Variable. A reference to data that is stored in memory.


    Wait-Process. A Windows PowerShell 2.0 cmdlet that waits for the specific process
    to complete.


    Wait-Event. A Windows PowerShell 2.0 cmdlet that waits for an event before continuing.


    Wait-PSJob. A Windows PowerShell 2.0 cmdlet that waits for all jobs or a specified
    job to complete.


    Where-Object. A Windows PowerShell cmdlet that filters the input from the object
    pipeline.


    While. A PowerShell statement that iterates it as long as a specified condition
    is True.


    Windows Remote Management (WinRM). A Microsoft implementation of the WS-Management
    Protocol, a Simple Object Access Protocol (SOAP).


    WMI (Microsoft''s Windows Management Instrumentation). A system management interface
    designed to facilitate access to system information.'
  merge: -1
  pgno: 424
