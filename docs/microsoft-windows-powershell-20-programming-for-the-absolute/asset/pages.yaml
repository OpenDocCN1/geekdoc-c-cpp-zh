  md: '# Working with Quantifiers


    Using regular expressions, you can also set up patterns that match based on the
    number of repeating matches. This is accomplished using the regular expression
    quantifiers listed in Table 8.2.


    | TABLE 8.2 REGULAR EXPRESSION QUANTIFIERS |

    | Character | Description |

    |--- | --- |

    | * | Must match zero or more times | "ss-match "\w*" |

    | + | Must match one or more times | "123|123|123" -match "123+" |

    | ? | Must match no more than one time | "ss-match "\w?" |

    | {n} | Must match n times | "ss-match "\w(2)" |

    | {n.} | Must match at least n matches | "ss-match "\w{2}" |

    | (n,m) | Must match at least n, but not more than m times | "ss-match "\w(2,3)"
    |


    For example, the following statement demonstrates how to set up a regular expression
    that matches on one or more occurrences using the + regular expression quantifier.

    if ("The winner of this year''s award is Mrs. Ford!" -match "winter") {

    Write-Host "Match!")

    )


    Here, a match occurs if the string searched contains a substring that matches
    the pattern of "winter". This pattern looks for the letter wi followed by one
    or more instances of the letter n, followed by the letters er. Therefore, this
    pattern will match up against the word winner.


    # Matching Patterns Based on Ranges


    Regular expressions also provide the ability to develop a pattern that looks for
    a specific type of data or that searches for a range of characters. This can be
    accomplished by using the character patterns outlined in Table 8.3.


    Note that to work with class patterns, you must enclose them inside a pair of
    matching brackets ([]), as demonstrated next.


    ```

    if ("March 13th" -match "[0-9]") {

    Write-Host "Match!"

    }

    ```'
