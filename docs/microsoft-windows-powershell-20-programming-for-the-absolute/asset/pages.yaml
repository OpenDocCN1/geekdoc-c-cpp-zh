    - Use Windows PowerShell to access different hierarchical data stores


    # PROJECT PREVIEW: THE STORY OF THE THREE AMIGOS


    In this chapter, you will learn how to create a new computer game that tells The
    Story of the Three Amigos. Key pieces of this mad-lib are collected from the user
    in the form of responses to seemingly unrelated questions. The end result is a
    story that is never told the same way twice. The Story of the Three Amigos begins
    by displaying its title page, as shown in Figure 2.1.


