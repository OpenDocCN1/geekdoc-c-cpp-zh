    # ADDITIONAL POWERSHELL CUSTOMIZATION TECHNIQUES


    Before we jump deep into a review of the .NET Framework and how Windows PowerShell
    uses cmdlets to access .NET resources, let''s spend a few more minutes taking
    a look at one way in which you can customize Windows PowerShell.


    As you learned in Chapter 2, "acting with the Windows PowerShell Command Line,"
    you can customize your Windows PowerShell working environment by making changes
    to a PowerShell shortcut. In addition you learned that you can also programmatically
