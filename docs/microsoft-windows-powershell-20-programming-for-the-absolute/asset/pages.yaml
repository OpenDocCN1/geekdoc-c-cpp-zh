  md: '# INTRODUCING WINDOWS POWERSLL


    PowerShell is a next-generation command shell that runs on the x86 and x64 version
    of Windows XP-SP2, Windows Server 2003-SP2, Windows Vista-SP1, and Windows 2008.
    As a command shell, PowerShell provides a command-line interface that administrators
    and hobbyists can use to interact with and control the Windows operating system.
    PowerShell also includes its own scripting language that has been custom designed
    to interact with Microsoft''s .NET Framework and to take advantage of the resources
    that .NET provides. In this chapter, I will introduce you to PowerShell and PowerShell
    scripting. By the end of this chapter, you will have created your first PowerShell
    script game and have a good understanding of the steps involved in creating and
    executing PowerShell scripts.


    Specifically, you will learn:


    +   - A little about PowerShell''s history

    - How to install PowerShell and configure it to run scripts

    - About new features specific to Windows PowerShell 2.0

    - About the basic components that make up PowerShell

    - About cmdlets and how to use them to formulate commands and script statements

    - How to get help regarding different PowerShell commands'
  merge: -1
