  md: '# ABOUT THE AUTHOR


    Jerry Lee Ford, Jr. is an author, educator, and an IT professional with over 20
    years of experience in information technology, including roles as an automation
    analyst, technical manager, technical support analyst, automation engineer, and
    security analyst. He is the author of 30 books and co-author of two additional
    books. His published works include Perl Programming for the Absolute Beginner,
    Ruby Programming for the Absolute Beginner, Microsoft Visual Basic 2005 Express
    Edition Programming for the Absolute Beginner, Microsoft WSH & VBScript Programming
    for the Absolute Beginner, Microsoft VBScript Professional Projects, Microsoft
    Windows Shell Scripting and WSH Administrator''s Guide, Microsoft Windows Shell
    Script Programming for the Absolute Beginner, and Microsoft Windows XP Administrator''s
    Guide. Jerry has a master''s degree in business administration from Virginia Commonwealth
    University in Richmond, Virginia, and he has over five years of experience as
    an adjunct instructor teaching networking courses in information technology.'
