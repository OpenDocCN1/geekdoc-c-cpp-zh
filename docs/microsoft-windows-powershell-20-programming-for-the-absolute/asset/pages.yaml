    function and that the value of $$ is equal to 1. As soon as the Enter key is pressed,
    the following output is displayed.


    ```

    1

    Function Display-Host now terminating

    Calling the Display-Message function

    passing a value of 2

    ```


    Again, you can see that the Display-Host function is about to be called and the
    value of $i$ is now equal to 2. As this simple example shows, you can effectively
    track the execution of small scripts or parts of larger scripts using the Write-Host
    and Read-Host cmdlets in order to keep an eye on variable values. This will allow
    you to verify that variables are executing in the order you expect and to ensure
    that variables are being assigned the proper values.


    If you do not want to see messages, you might instead take advantage of the Write-Host
    cmdlet''s ability to make beep sounds to let you know when something of interest
    has occurred. Once you have managed to track down and fix any errors, you can
    either remove the extra debugging statements that you added to the script or you
    can comment them out, leaving them in place should you need to debug the script
    again at a later date.


    # Using PowerShell''s Debug Mode


    While strategically placed Write-Host and Read-Host cmdlets throughout a script
    can be helpful in tracking down problems, this debugging technique is only suitable
    for small scripts or limited use within larger scripts. For larger scripts, you
    can use the Set-PSDebug cmdlet to enable PowerShell''s debug mode.


    The Set-PSDebug cmdlet accepts several optional parameters, which allow you to
    specify the level of detail and control you want during the debug session. One
    parameter is -Trace, which tells the cmdlet how much debug information you want
    to see. The following choices are:


    +   - Trace 0. Turns tracing off.

    - Trace 1. Displays each script statement that is executed.

    - Trace 2. Displays information on variable values and function calls and displays
    each script statement that is executed.


    Another optional Set-PSDebug parameter is -Step, which, when specified, tells
    the cmdlet to pause and display the following list of options before executing
    each line in the script.'
