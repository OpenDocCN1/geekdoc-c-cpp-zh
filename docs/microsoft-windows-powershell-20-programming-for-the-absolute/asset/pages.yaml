    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_157_0.png)


    # Defining and Initializing Variables


    Windows PowerShell supports a range of data types that correspond to data types
    supported

    by the .NET Framework. For example, Windows PowerShell supports integers, floating-point

    numbers, and strings which you can assign to variables, as demonstrated by the
    following:


    ```

    $x = 5

    $y = 5.5

    $z = "Winner"

    ```


    Windows PowerShell automatically recognizes the first assignment shown above as
    an inte-

    ger, the second assignment as a floating-point number, and the third assignment
    as a string.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_157_1.png)


    I strongly recommend that you assign an initial default value to any variable
    that

    de declare within your Windows PowerShell scripts. If a script statement at-

    temps to access a variable that has not been assigned a value, an error is not

    gated. Instead, your script will keep running and you''ll end up with unpre-

    dictable results.


    # Variable Interpolation


    Up to this point in the book, all the strings that you have seen have been placed
    inside

    matching sets of double quotation marks. However, you are also allowed to define
    strings

    using matching sets of single quotation marks. The difference between the two
    is variable

    interpolation occurs when a variable is embedded inside a string enclosed within
    double

    quotation marks but does not occur within a string enclosed within single quotation
    marks.


    ```

