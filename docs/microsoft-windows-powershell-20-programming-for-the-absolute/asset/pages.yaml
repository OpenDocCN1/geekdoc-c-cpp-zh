- img_proc: true
  md: '# An expression is a statement that is evaluated and produces a result.


    $x = 5 * 4 / 2 - 5 * 5


    When executed by PowerShell, the value assigned to $x is 25, which is calculated
    as follows:


    +   1. Multiplication and division occurs first so 5 * 4 = 20, which is divided
    by 2, resulting in a value of 10. This value is then multiplied by 5 to get a
    new value of 50.

    2. Since multiplication and division occur before addition and subtraction, the
    subtraction operation, is skipped and the multiplication oper-ation at the end
    of the statement is executed, resulting in a value of 25.

    3. Finally, 25 is subtracted from 50 to produce a value of 25.


    An expression like this can be difficult to read. To help clarify things, you
    can use parentheses to visually group different parts of the expression.


    ```

    $x = (5 * 4 / 2 * 5) - (5 * 5)

    ```


    In addition to helping visually organize the expression, you can also use parentheses
    to alter the order in which the contents of the expression are executed by overriding
    the order of precedence. Take, for example, the following statement:


    ```

    $x = 5 * 4 / (2 * 5 - 5) * 5

    ```


    As you can see, this statement is almost identical to the previous example, except
    that paren-theses have altered the order in which the expression is evaluated.
    As a result, the expression evaluates to a value of 20, which is computed as:


    +   1. The multiplication of 2 * 5 occurs first, resulting in a value of 10, from
    which 5 is then subtracted.

    2. Next, starting at the beginning of the expression, 5 is multiplied by 4, resulting
    in a value of 20.

    3. 20 is divided by the value computed in the first step (e.g., 5), resulting
    in a value of 4. 4 is then multiplied by the last number in the expression, resulting
    in a value of 20.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_159_0.png)


    Two arithmetic operators (+ and *) are overloaded, allowing them to work for strings
    as well as numbers. Thus, as you have already seen, you can use the + operator
    to concatenate two strings together. You can also use the * operator to repeat
    a string specified number of times as was demonstrated earlier in this chapter.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# PowerShell Assignment Operators


    Up to this point in the book, you have seen the equal (=) operator used to make
    all assignments. However, Windows PowerShell supports a host of different assignment
    operators, as shown in Table 4.4.


    | Operator | Description |

    | --- | --- |

    | = | Assigns a value to a variable |

    | += | Adds a value to a variable |

    | -= | Subtracts a value from a variable |

    | * | Multiplies a variable value |

    | /= | Divides a variable value |

    | %= | Assigns the remainder of a division |


    As an example of how to work with these operators, consider the following example.


    ```

    $x = 5

    $x +=5

    ```


    Here, the value of $x is set equal to 5 and then incremented by 5, resulting in
    a final value of 10.


    In addition to the assignment operators shown in Table 4.4, Windows PowerShell
    also supports two additional operators that you can use to automatically increment
    and decrement the value of a variable by 1.


    +   * ++ Automatically increments a value by 1.

    * -- Automatically decrements a value by 1.


    As an example of how these two operators work, consider the following statements.


    ```

    $x = 5

    $y = $x++

    ```


    In the previous example, $x++ is functionally equivalent to $x = $x + 1.


    Here, a variable named $x is set equal to 5. Next, a variable named $y is assigned
    the value assigned to $x, after $x is incremented by 1. Thus $y ends up assigned
    a value of 6.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Special Variables


    Windows PowerShell provides you with access to a number of variables that are
    always available to your PowerShell scripts. These variables provide access to
    commonly used information. By making references to these special variables, you
    save yourself the effort of having to create and maintain your own version of
    these variables. Table 4.5 lists a number of commonly used special variables.


    | TABLE 4.5 WINDOWS POWERSHELL SPECIAL VARIABLES |

    | Special Character Description |

    | $_ | Represents the current pipeline object when used in script blocks such
    as the Foreach-Object and the Where-Object blocks |

    | $Error | Provides access to information about recent errors |

    | $HOME | Represents the home directory of the current user |

    | $PSHome | The name of the folder where Windows PowerShell is installed |

    | $null | Represents a null object |


    You have seen the $_ special variable used a couple of times already in this book.
    As another example of how to use Windows PowerShell''s special variables, consider
    the following example:


    ```

    Set-Location $home

    $x = Get-ChildItem

    $x

    ```


    When executed, this example changes the current working directory to the home
    directory of the person who runs the script and assigns a list of all contents
    of that folder to a variable named $x.


    > To see a listing of all Windows PowerShell''s special variables and see the
    definitions, use the Get-Help cmdlet and pass it an argument of about_automatic_variables,
    as shown:

    Get-Help about_automatic_variables


    # Variable Scope


    Within Windows PowerShell scripts, variable access depends on the location at
    which a variable is defined. Within Windows PowerShell, access is governed by
    scope. PowerShell supports four different scopes, each of which can be referenced
    by one of the following labels.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Chapter 4 • Working with Variables, Arrays, and Hashes


    +   - Local scope. Refers to the current scope, which can be global, private,
    or script.

    - Global scope. A scope that is established whenever a new PowerShell session
    is started.

    - Private scope. A scope that is not visible or accessible to other scopes.

    - Script scope. A scope that is established whenever a script is executed and
    ends when the script stops executing.


    Whenever you start up a new Windows PowerShell session, you establish a global
    scope. Any variable created from the command prompt during the current session
    is global in scope. Global variables can be accessed from within the current scope
    (e.g., from the command line as well as from child scopes). When you execute a
    PowerShell script, a new script scope is created. This is a child scope to the
    global scope.


    Variables defined within your PowerShell scripts (outside of any functions) are
    local variables and can be accessed from anywhere within the script. Within the
    PowerShell script, you can define functions in order to improve the overall organization
    of the script and to refine scope. Variables defined within a function are local
    to the function and the function''s scope is a child scope of the script''s script.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_162_0.png)


    > A function is a collection of statements that can be called upon to execute
    as a unit. Functions are covered later in Chapter 7, "Organizing Scripts Using
    Functions."


    By default, variables created in a child scope can be seen and accessed in a parent
    scope, unless the variables are defined as private, in which case the variables
    can only be accessed from their own scope.


    So all of the variables that you have worked with in this book''s PowerShell game
    scripts have been local in scope and as such have been accessible throughout the
    entire script. How-ever, as you will see in Chapter 7, you can define variables
    within functions and mark them as private, limiting access to just within the
    function itself.


    # Arrays


    As has already been stated, variables can be used to store numbers, strings, and
    objects of any type. Variables can also be used to store arrays. An array is an
    indexed list of values. Each element stored in an array is assigned a unique numeric
    index number, which can later be used to retrieve its value. In Windows PowerShell,
    array indexes start at zero, the first element in an array has an index of 0 and
    the second element has an index of 1 and so on.'
  merge: -1
