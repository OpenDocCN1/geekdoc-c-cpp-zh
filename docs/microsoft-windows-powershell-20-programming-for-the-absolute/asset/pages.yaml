    As has already been stated, functions provide a way of improving the organization\
    \ of your PowerShell script files by letting group related sets of code statements\
    \ together and then making them callable from any location within the script.\n\
    \n![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_243_0.png)\n\n> I strongly suggest\
    \ that you use functions as the primary organizational tool within your Windows\
    \ PowerShell scripts. Using functions to organize script files, you can break\
