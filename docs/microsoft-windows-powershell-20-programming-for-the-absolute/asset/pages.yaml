  md: '# Chapter 4 • Working with Variables, Arrays, and Hashes


    +   * Variables. Store individual pieces of data.

    * Arrays. Store data as an index list.

    * Hashes. Store data in key-value pairs.


    # Variables


    Variables provide a means of storing data within your Windows PowerShell Scripts.
    Using variables, you can store just anything you want, including numbers, strings,
    and objects. If you store object data returned as output by a cmdlet, PowerShell
    is able to retain an awareness of the object types and therefore the properties
    and methods associated with the object.


    # Naming Your Variables


    Windows PowerShell variable names are not case-sensitive, meaning that if you
    define variable named $username, you can later refer to it as $USERNAME and PowerShell
    will understand what you mean. Windows PowerShell variable names can include characters,
    numbers, and the underscore character (_). Windows PowerShell variable names must
    begin with the $ character. Examples of valid variable names include:


    +   * $userName

    * $total

    * $1stName

    * $game_winner


    Examples of invalid variable names include:


    +   * $user Name

    * $total!

    * $#!).@&


    The first example is invalid because it includes a blank space. The second example
    is invalid because it includes the ! character. Lastly, the third example is invalid
    because it contains a whole sweep of unsupported characters. If you forget and
    include an invalid variable in a PowerShell script, your script will most likely
    terminate with an error. For example, the following variable assignment statement
    is invalid because it contains a number of invalid characters.


    ```

    $#!).@& = "Winner"

    ```


    If you were to try and use this variable name in a PowerShell script, the script
    will terminate and display the following error.'
  merge: -1
