    | 253 5 21284 16644 56 1372 audlog |

    | 185 8 15232 40504 105 2508 avgrsx |

    | 172 5 5012 3828 67 1.93 3192 avgtray |

    | 629 10 8116 792 88 1416 avgwdsvc |

    | 697 6 1832 1828 99 568 csrss |

    | 579 8 17484 14628 185 632 csrss |


    The amount of information returned by the Get-Process cmdlet can be a bit overwhelming.
    To help streamline output, you can pass a specified process name to the cmdlet
    as an argument, as demonstrated next.


    ```

    Get-Process PowerShell

    ```


    When executed, this statement displays process information for just the PowerShell
    process. Assuming the specified process is currently running, this statement will
    generate output similar to that shown here:


    | NPM(K) PM(K) WS(K) VM(M) CPU(s) Id ProcessName |

    | 486 13 33808 35416 166 2.87 5736 powershell |


    You can also use a comma-separated list to display more than one process at a
    time, as demonstrated next. You may use wildcards to match any number of processes.


    ```

    Get-Processexplorer, powers

    ```


    From time to time things go away on Windows and as a result, processes get hung
    up, behave, or fail to respond. When these types of circumstances occur, you can
    use the Stop-Process cmdlet to terminate these processes. For example, the following
    statement terminates a process by specifying its process ID.


    ```

    Stop-Process 2932

    ```


    You can just easily terminate a process by specifying its process name, as demonstrated
    here:


    ```

    Stop-Process -processname notepad

    ```


