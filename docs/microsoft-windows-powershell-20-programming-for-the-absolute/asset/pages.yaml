  md: '# Chapter 9 - Basic System Administration


    # Taking Advantage of .NET Classes


    Windows PowerShell depends upon the .NET Framework for much of its capabilities.
    Numerous cmdlets have been designed to manipulate .NET resources or retrieve data
    provided by .NET. However, you are not limited to just the .NET resources exposed
    by PowerShell cmdlets. Thanks to the New-Object cmdlet, you can create and instantiate
    an instance of other .NET classes. For example, rather than using PowerShell 2.0''s
    Get-Random cmdlet to generate a random number, you could instead use the New-Object
    cmdlet to instantiate an instance of the Random class, as demonstrated here:


    ```

    $randomNo = New-Object System.Random

    ```


    When executed, this statement creates an instance of a Random object. Once instantiated,
    you have access to the properties and methods associated with this object. In
    the case of the Random object, you have access to its Next method, which generates
    a random number within a specified range.


    ```

    $number = $randomNo.Next(1, 11)

    ```


    Here, a random number (integer) is generated in the range of 1 to 10 and assigned
    to a variable named $number.


    # Taking Advantage of COM Objects


    The New-Object, discussed in the previous section, can also be used to instantiate
    and control COM objects. COM stands for Component Object Model and is a Microsoft
    technology that allows Windows PowerShell to programmatically interact with control
    objects, which includes Active X controls and various Windows applications (those
    that support COM).


    As an example, the following statements demonstrate how to create a small script
    that creates an HTML file containing a listing of all the processes currently
    running on the local computer and then uses COM to create an instance of Internet
    Explorer in order to display the newly created page.


    ```

    Get-Service | Where-Object { $_.status -eq "running" }

    ```


    ```

    ConvertTo-HTML Name, DisplayName, Status | Set-Content C:\Temp\Text.html

    ```


    ```

    $ie = New-Object -comobject InternetExplorer.Application

    ```


    ```

    $ie.Navigate2("C:\Temp\Text.html")

    ```


    ```

    $ie.Visible = $true

    ```


    When executed, this example uses the New-Object cmdlet to create an instance of
    Internet Explorer. Next, Internet Explorer''s Navigate method is used to load
    the HTML page created at'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'the beginning of the script. Lastly, Internet Explorer''s Visible property
    is set equal to True, making the browser and the specified web page visible. Figure
    9.10 shows an example of the output that you will see if you create and run this
    example.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_339_0.png)


    # PROGRAMMATICALLY INTERACTING WITH THE WINDOWS REGISTRY


    Another powerful capability of Windows PowerShell is its ability to interact with
    the Windows registry. This means that you can only write PowerShell scripts that
    can access data stored in the Windows registry, but you can also store data in
    the registry.


    The Windows registry is organized into five high-level keys, also referred to
    as hives. Registry keys are somewhat analogous to folders on the Windows file
    system. Keys are used to store other keys (or subkeys) and values. Values are
    analogous to files on the Windows file system. Actual data stored in the registry
    is stored inside values. Of the five high-level root keys,'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'Windows PowerShell gives you access to the values stored in two of them, as
    outlined in Table 9.1.


    TABLE 9.1 REGISTRY KEYS ACCESSIBLE BY THE WINDOWS POWERSHE

    | Hive | Shortcut | Description |

    |---|---|---|

    | HKEY_CURRENT_USER | hkcu | Stores information about the currently logged on
    user |

    | HKEY_LOCAL_MACHINE | hklm | Stores global computer settings |


    Windows PowerShell treats registry values as properties. This lets you use the
    Get-ItemProperty cmdlet to retrieve information about a key and to list all its
    values, as demonstrated as here:


    ```

    Set-Location hklm:\SOFTWARE\Microsoft\PowerShell\1\PowerShellEngine

    Get-ItemProperty

    ```


    The first statement here switches from the current provider, typically the Windows
    file system, to a subkey located on the HKEY_LOCAL_MACHINE hive. The second statement
    uses the Get-ItemProperty cmdlet to retrieve information about the current subset.
    When executed, these statements will generate output similar to that shown here:


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_340_0.png)


    Windows operating systems use the registry to store data about the operating system
    as well as the computer''s hardware, software, and user configuration settings.
    The integrity of the registry is critical to the proper operation of the computer.
    Therefore, it is important that you take care when working with it. Otherwise,
    if you accidentally change or delete the wrong key or value, it can have an unpredictable
    impact on the operation of your computer.


