  md: '# # no experience required


    to Learn Microsoft


    # # Windows PowerShell 2.0 Programming


    microsoft® PowerShell is a helpful scripting language that enables the automation
    of system management tasks and the creation of system management tools. PowerShell
    runs on Windows XP, 2000, and Vista. Unlike traditional Windows scripting, PowerShell
    is object-based and designed to work with the .NET Framework. This updated edition
    of Windows PowerShell Programming for the Absolute Beginner teaches aspiring Windows
    PowerShell scripting whether they''re using PowerShell 1.0 or 2.0. To help make
    learning and fun, you will learn how to program through the development of computer
    games, and you will develop a new game that reinforces a newly learned concept
    in an easy way to learn. By the time you have finished the course, not only will
    you have access to a collection of working sample scripts but will also have a
    foundation upon which you can tackle real-world challenges and new languages.


    Create simple games while you learn to program with PowerShell


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_451_0.png)


    With this book, you''ll learn to:


    +   - Script and program in a Windows environment

    - Interact with the Windows PowerShell command line

    - Work with variables, arrays, and hashes

    - Implement conditional logic

    - Use loops to process data

    - Organize scripts using functions

    - Automate various system administration tasks

    - Debug PowerShell scripts


