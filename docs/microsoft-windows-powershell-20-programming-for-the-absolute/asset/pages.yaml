  md: '# Chapter 3 · Object-Based Scripting with .NET


    # Running the Background Job in a Persistent Runspace


    If you want to run a background job in a persistent runspace, you first need to
    execute the New-Runspace cmdlet, followed by the Start-PSJob cmdlet (using its
    runspace parameter) as demonstrated here:


    ```

    PS C:\> $RunSP = New-Runspace -computename FileSVR

    PS C:\> Start-PSJob -command "Get-Service" -runspace $RunSP

    ```


    | SessionId | Name | State | HasMoreData | Command |

    |---|---|---|---||

    | 11 | | Running | True | Get-Service |


    ```

    PS C:\>

    ```


    Here, a new runspace has been created and assigned to a variable named $RunSP.
    The Start-PSJob cmdlet is then used to run the "Get-Services" cmdlet, in the $RunSP
    runspace.


    # Retrieving Information about Background Jobs


