    #  Copy and Moving Files and Folders PowerShell also provides the ability to copy
    and move files and folders. This is accomplished using the Copy-Item and Move-Item
    cmdlets. For example, the following example demonstrates how to copy a file from
    one folder to another.


    ```

    Copy-Item C:\System.log C:\Temp

    ```


    In this example, a file named System.log is copied from the root of the C: drive
    to the C:\Temp folder. If necessary, you can use wild-card characters to copy
    multiple files from one folder to another, as demonstrated here:


    ```

    Copy-Item C:\*.log C:\Temp

    ```


    Here, any .log files found on the root of C: are copied to C:\Temp.


    You can also use the Copy-Item cmdlet to copy one folder into another folder,
    as demonstrated here:

    Copy-Item C:\MyScripts C:\Temp

    nYou can modify this example by passing the -recurse parameter to the Copy-Item
    cmdlet


    When executed, this statement makes a copy of the C:\MyScripts folder and places
    it in the C:\Temp folder. However, none of the contents of the C:\MyScripts are
    copied, just a copy of the folder itself. You can modify this example by passing
    the -recurse parameter to the Copy-Item cmdlet in order to instruct PowerShell
    to recursively copy a folder and all its contents, including any subfolders, into
    another folder, as shown here:


    ```

    Copy-Item C:\MyScripts C:\Temp -recurse

    ```


    Using the Move-Item cmdlet, Windows PowerShell also lets you move files and folders.
    For example, the following example demonstrates how to copy a file from one folder
    to another.


    ```

    Move-Item C:\System.log C:\Temp

    ```


    Cmdlets such as Move-Item may require administrator rights to perform certain
    file actions, so if you get an error when executing the Move-Item cmdlet, close
    your Windows PowerShell console and reopen it using the Run As Administrator


