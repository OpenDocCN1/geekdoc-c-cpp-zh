  md: '# Microsoft Windows PowerShell 2.0 Programming for the Absolute Beginner, Second
    Edition


    +   - Script Cmdlets. The ability to create new cmdlets using Windows PowerShell''s
    scripting language.

    - Modules. The ability to partition and manage PowerShell code in re-usable collections
    or modules.

    - Data Language. The ability to separate data from code within PowerShell scripts.

    - Transactions. The ability to develop Windows PowerShell scripts that perform
    transactional operations, giving them the ability to start, commit, and rollback
    transactions.

    - Eventing. The ability to set up PowerShell so that it listens and reacts to
    system events.

    - Try-Finally-Catch. The ability to throw and handle exceptions in order to gracefully
    manage script errors.

    - New Debugging Features. The ability to set breakpoints on lines, variables,
    and commands, to step into, over, and out of scripts when debugging PowerShell
    script execution.

    - Script Internationalization. The ability to programmatically determine the appropriate
    language with which to display messages when Windows PowerShell scripts.

    - Remote Execution. The ability to remotely run PowerShell scripts on a network
    computer for which you have access permissions.

    - Runspaces. The ability to set up separately managed execution spaces in which
    PowerShell scripts can be executed.


    # UNINSTALLING POWERSHELL 1.0


    While Windows PowerShell 2.0 is 100 percent backwards-compatible with PowerShell
    1.0, you cannot install it alongside or on top of PowerShell 1.0. Instead, you
    must uninstall Windows PowerShell 1.0 before you can install version 2.0. If your
    computer is currently running PowerShell 1.0 and you do not want to upgrade to
    2.0, then you can skip this section and move on. Likewise, if your computer does
    not have PowerShell installed at all, you can proceed to the next section where
    you will learn how to install and configure PowerShell 2.0.


    As was just stated, if your computer is running PowerShell 1.0 and you want to
    work with version 2.0, you must first uninstall version 1.0. The steps required
    to do so vary depending on which Windows operating system you are using. The following
    procedures explain how to uninstall Windows PowerShell 1.0 on different Windows
    operating systems.'
  merge: -1
