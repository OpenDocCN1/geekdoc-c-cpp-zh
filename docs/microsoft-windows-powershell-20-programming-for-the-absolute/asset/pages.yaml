    One of the things that you need to watch out for when developing your PowerShell\
    \ scripts is an endless loop. An endless loop is a loop that never terminates\
    \ and thus runs forever, draining the computer's resources. An endless loop occurs\
    \ when you create a loop that has no way of stopping its own execution. In other\
    \ words, you either forgot to provide a means for terminating it or applied faulty\
    \ logic allowing the loop to continue forever.\n\nIf, while testing a PowerShell\
    \ script, you think something has gone wrong and an endless loop may be executing,\
    \ you can break out of the loop and terminate your script by pressing Ctrl+C.\n\
    \n# Setting Up the do until Loops\n\nThe do until loop executes until a test condition\
    \ evaluates to true. Or to put it another way, the do until loop executes as long\
    \ as a condition is false. Like the while loop, the test performed by the do until\
    \ loop is specified at the bottom of the loop, ensuring that the loop executes\
    \ at least once.\n\nThe syntax of the do until loop is shown here:\n\n```\ndo\
    \ {\n  code block\n} until (condition)\n```\n\nTo see how to work with this type\
    \ of loop, consider the following example:\n\n```\n$i = 1\n```\n\n```\ndo {\n\
    \  Write-Host $i\n  $i++\n} until ($i -gt 10)\n```\n\nThis example is very similar\
    \ to the previous while example, except that this time the loop has been set to\
    \ run until the value of $i is greater than 10. When executed, this example counts\
    \ to 10 exactly like the previous while loop did, demonstrating that each of these"
