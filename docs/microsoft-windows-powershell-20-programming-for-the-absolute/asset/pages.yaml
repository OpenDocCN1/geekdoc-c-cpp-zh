- img_proc: true
  md: '# Populating Associative Arrays at Creation Time


    Associative arrays can also be populated at creation time, as demonstrated here:

    $nicknames = @Alexander = "X-Man"; William = "William-D"; Molly = "Mighty-One"

    $x = $nicknames = "Alexander"


    As you can see, three separate key-value pairs have been defined. Key-value pairs
    are separated by semicolons and enclosed inside matching brackets and preceded
    by the @ character. When executed, $x is assigned a value of Alexander.


    If you want to display the contents of an associative array from your PowerShell
    scripts, as demonstrated by the following:

    $nicknames = @Alexander = "X-Man"; William = "William-D"; Molly = "Mighty-One"

    $nicknames


    When executed, this example will produce the following output:


    | Name | Value |

    | --- | --- |

    | Alexander | X-Man |

    | Molly | Mighty-One |

    | William | William-D |


    > HINT

    Like arrays, you can combine the contents of associative arrays using the operator,
    as demonstrated here:

    $kidNames = @Alexander = "X-Man"; William = "William-D"; Molly = "Mighty-One"

    $parentNames = @Jerry = "Daddy"; Mary = "Mommy"


    $familyNames = $kidNames + $parentNames


    $familyNames


    When executed, this example produces the following output:


    | Name | Value |

    | --- | --- |

    | William | William-D |

    | Alexander | X-Man |

    | Jerry | Daddy |

    | Molly | Mighty-One |

    | Mary | Mommy |


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_167_0.png)'
  merge: -1
