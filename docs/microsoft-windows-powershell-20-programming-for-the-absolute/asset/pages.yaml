- img_proc: true
  md: '# Chapter I · Introducing Windows PowerShell


    Enter the Windows PowerShell, which provides access to well over one hundred commands
    in the form of cmdlets, each of which share a common syntax, making the command
    line and scripting environment far more predictable and easy to learn. When developing
    Windows PowerShell, one of Microsoft''s goals was to make the learning curve for
    PowerShell as easy as possible. Therefore, it incorporated as many cmd.exe and
    UNIX shell features as it could into Windows PowerShell.


    Windows PowerShell has many other features that further differentiate it from
    traditional command shells. These features include:


    +   * A C#-styled syntax

    * Access to cmdlets providing access to .NET Framework classes

    * Support for regular expressions

    * A provider model that provides Windows PowerShell with access to hierarchical
    repositories including the Windows file system and the Windows registry

    * The ability to shorten commands and script statements by supplying abbreviated
    forms of keywords


    # A Little History Lesson


    Going all way back to the first version of Windows, every version of Windows has
    included a command shell. The original command-line shell was named Command. When
    Windows NT was released, Microsoft added cmd.exe as the operating system''s new
    command shell. cmd.exe remained the Windows command shell when both Windows 2000
    and Windows XP were released. As much of an improvement as cmd.exe was over Command,
    it never provided the kind of comprehensive access to the Windows operating systems
    that, for example, UNIX and Linux users and administrators are accustomed to.


    Windows successfully made the leap from the Windows desktop to become a major
    player in data centers all around the world. However, its lack of a world-class
    shell has plagued Windows administrators. When Microsoft released the Windows
    Script Host, or WSH, in 1998, things improved significantly. With the WSH, Windows
    administrators could develop automation scripts using either VBScript or JavaScript.
    Later, third-party developers released WSH-compatible scripting languages that
    included Perl, Rexx, and Python. Still, when compared to UNIX, command-line access
    has continued to remain a major deficiency for Windows.


    By creating Windows PowerShell and providing it with an entirely new scripting
    language capable of accessing resources provided by the .NET Framework. Microsoft
    has provided Windows users and administrators with a command shell that has access
    to resources formerly only available to GUI-based programming languages like Visual
    .NET.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Integration with .NET


    Unlike traditional command shells, which manipulate text, Windows PowerShell treats
    everything as objects. An object is a self-contained resource that stores information
    about itself in properties and provides program code, in the form of methods,
    that can be used to interact with it. For example, a file is a disk drive and
    a folder.


    All objects are derived from a class that defines the object and its properties
    and methods. An object''s properties describe particular features of the object.
    For example, a file has a name, a file extension, and a file size among many other
    properties. Objects also have built-in collections of code, referred to as methods,
    which can be programmatically called upon access to interact with objects. For
    example, files can be opened, read from, written to, closed, and deleted.


    The .NET Framework provides Windows PowerShell with access to a large library
    of classes. The .NET Framework class library is a hierarchical collection of classes
    that define the data type of objects that can be instantiated using the classes
    as templates. Within the framework, classes are often based on other classes,
    creating parent and child relationships. A child class (or subclass) inherits
    base object definitions from its parent class and these classes and subclasses
    are made available to the PowerShell in the form of cmdlets, which are built-in
    commands that provide access to system resources.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_31_0.png)


    Classes, objects, properties, and methods can be difficult for new programmers
    to understand. To help them understand, consider the following analogy. A car
    manufacturer might have a library of blueprints (class library) which are used
    in the making of new cars. An individual blueprint (class) defines everything
    required to create a new type of car (object).


    Individual classes are created or instantiated based on the blueprint. For example,
    a car company might have a master set of blueprints for a model of a car. Using
    this one blueprint (class) the car company can create (instantiate) as many new
    cars (objects) as it wants. By default, each car created using the same class
    has the same set of properties and methods. Each car that is created from the
    same blueprint inherits a predefined set of attributes (properties), every car
    has a color. By modifying the value of its color property, each car or object
    can be given a different color.


    If the company wants, it can pay an engineer to create a new set of blueprints
    for a new car, using the other set of blueprints as a starting point. As the result,
    the new set of blueprints would represent a subclass of the parent class and any
    new cars created from the new set of blueprints, though similar to cars created
    by the parent class, would have their own unique subset of shared properties and
    methods.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter I · Introducing Windows PowerShell


    A basic understanding of objects is essential for any Windows PowerShell programmer
    because the PowerShell interacts with objects in just about everything it does.
    Windows PowerShell scripting is often referred to as an object-based scripting
    language. It is called an object-based scripting language, unlike object-oriented
    programming languages, PowerShell programmers typically work with objects that
    have already been created as opposed to defining and creating entirely new objects
    themselves. That is not to say that a PowerShell programmer cannot create new
    objects; it is just not something that is commonly needed.


    # PowerShell Versus cmd.exe


    On the surface, there are many similarities between cmd.exe and the PowerShell.
    As far as everyday tasks go, you should be able to use the PowerShell in place
    of cmd.exe. However, under the covers, PowerShell is many times more advanced
    than its predecessor. As has already been stated, PowerShell has direct access
    to resources provided by the .NET Framework and a new scripting language specifically
    designed to support interaction with .NET resources via cmdlets.


    Another difference between the manner in which cmd.exe and PowerShell execute
    is the manner in which data is passed between commands. Both shells support the
    use of pipes to move data between commands. However, the type of data moved is
    completely different.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_32_0.png)


    > A pipe is a logical connection between two commands that supports the passage
    of one command''s output to another command where it is received as input.


    With cmd.exe, data is passed as text. Unfortunately, the output of one command
    often does not come back in a format required by the second command. As such,
    shell programmers typically have to add additional programming logic to their
    scripts to reformat one command''s output into a format the other command can
    accept. Windows PowerShell uses an object pipeline that allows the receiving cmdlets
    to access properties and methods of objects generated by other cmdlets. The programmer
    is relieved of the responsibility of formatting object data, significantly simplifying
    the scripting process.


    Table 1.1 lists a number of additional key differences between cmd.exe and PowerShell.
    As you can see, Windows PowerShell boasts many key improvements, which you will
    learn more about you work your way through this book.'
  merge: -1
  pgno: 32
