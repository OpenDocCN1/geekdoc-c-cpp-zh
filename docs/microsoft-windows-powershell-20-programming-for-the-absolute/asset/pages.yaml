  md: '# Retrieving System Information Using WMI


    As you have just seen, Windows PowerShell provides access to cmdlets that collect
    information about different aspects of the computer. However, there are only a
    limited number of these cmdlets available. Windows PowerShell makes up for this
    by allowing you to use Microsoft''s Windows Management Instrumentation (WMI) in
    order to tap into and access system information from a variety of different sources,
    including the operating system, services, applications, and hardware.


    WMI is a system management interface designed to facilitate access to system information.
    Both Windows PowerShell 1.0 and 2.0 encapsulate support for WMI through the Get-WmiObject
    cmdlet. In addition, Windows PowerShell 2.0 provides support for a number of new
    WMI specific cmdlets, as outlined below:


    +   - Invoke-WmiMethod. Executes WMI methods.

    - Register-WMIEvent. Allows you to register with a specific WMI event.

    - Remove-WMIObject. Deletes WMI instances and classes.

    - Set-WmiInstance. Creates or changes a WMI class instance.


    The amount of information that can be accessed through WMI is staggering. A complete
    discussion of WMI is well beyond the scope of this book. However, to give you
    an appreciation of WMI and the kinds of data that you can get from it, these next
    several sections will provide a series of examples that show how to access BIOS,
    processor, network, and application information.


    # Retrieving BIOS Information


    Using the Get-WmiObject cmdlet, you can retrieve system BIOS information from
    any Windows computer. Computer administrators might use this information in order
    to determine on which computers to apply a BIOS update in the event a BIOS-related
    problem is discovered on certain models of computers.


    All that you have to do to retrieve BIOS information is pass Win32-BIOS as an
    argument to the cmdlet.


    ```

    $x = Get-WmiObject Win32_BIOS

    $x

    ```


    When executed, BIOS information is collected and stored in a variable named $x.
    In the preceding example, this data is then displayed. When executed, this example
    will display output similar to that shown here:'
  merge: -1
