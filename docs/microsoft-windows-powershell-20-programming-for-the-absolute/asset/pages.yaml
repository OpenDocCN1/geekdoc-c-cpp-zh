  md: '# Pulling WMI Data from Remote Computers


    Assuming that you have the security permissions required to do so, the Get-WmiObject
    cmdlet can also be used to retrieve information from remote network computers.
    To do so, just append -computername to the end of your commands, as demonstrated
    here:

    Get-WmiObject Win32_ComputerSystem -computername HP-PC


    In this example, the Get-WmiObject is executed and instructed to retrieve system
    data from a network computer named HP.


    +   - Domain : MYODOMAIN

    - Manufacturer : HP-Pavilion

    - Model : RX87AA-ABA a6030n

    - Name : HP-PC

    - PrimaryOwnerName : Jerry

    - TotalPhysicalMemory : 201098912


    Consider a practical example of this capability scenario in which a computer administrator
    is asked to install a new application on 20 computers residing on a company''s
    local area network. Some of the computers might be behind locked doors or in rooms
    occupied by high-level executives and not readily accessible during the normal
    course of the day. The new application might require 500 MB of memory to run.
    Rather than physically visiting every computer to determine the amount of memory
    installed on it, the computer administrator could create a PowerShell script that
    remotely retrieves the computer''s total physical memory. For example, the following
    statement could be used to display a list of computers and their available physical
    memory.


    ```

    Get-WmiObject Win32_ComputerSystem -computername HP1, HP2, HP3 | Format-List

    Name, TotalPhysicalMemory

    ```


    In this example, data is retrieved from the three network computers. As you can
    see, the names of each remote computer are provided to the -computername parameter
    as a comma-separated list. The resulting output is then piped to the Format-List
    cmdlet, which displays the name of each computer and its available physical memory,
    as demonstrated here:


    +   - Name : HP1

    TotalPhysicalMemory : 536195072


    +   - Name : HP2

    TotalPhysicalMemory : 1072390144


    +   - Name : HP3

    TotalPhysicalMemory : 536195072'
