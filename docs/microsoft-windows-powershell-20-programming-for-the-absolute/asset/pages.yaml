  md: '# 222 Mastering Windows PowerShell 2.0 Programming for the Absolute Beginner
    Second Edition


    #

    ****************************************************************************************************


    # # Initialization Section


    # # Functions and Filters Section


    # # Main Processing Section


    As you can see, I have added three additional sections to the script template.
    The Initialization Section identifies the location within the script where script
    level variables should be defined and initialized. The Functions and Filters Section
    identifies the location where any functions and filters will be defined. The Main
    Processing Section identifies the location where the script''s controlling logic
    should be placed.


    Going forward, this modified version of the template will be used in the development
    of the book''s game scripts.


    # Processing Arguments


    Although there is plenty of value in being able to organize groups of related
    statements into name code blocks in order to be able to repeatedly execute them
    as a unit, functions are even more useful when you set them up to process inputs
    passed to them as arguments. For example, in the next section you will learn how
    to set up a function that adds together two numbers that are passed to it. Functions
    can also process output generated by cmdlets.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_245_0.png)


    By developing functions that accept and process inputs, referred to as arguments,
    you make the functions independent of the PowerShell script in which they reside.
    Therefore, you can copy and paste a function into another PowerShell script and
    use it without modification, as long as it still gets called and passed the appropriate
    inputs in its new script. This facilitates code reuse and over time you should
    be able to develop a small library of functions, which you can use as building
    blocks in the development of your Windows PowerShell scripts. This should enable
    you to work smarter and faster by saving you the trouble of reinventing the wheel
    each time you start a new development project.


    TRICK'
