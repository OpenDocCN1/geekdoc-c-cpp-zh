  md: '# Chapter 2 - Interacting with the Windows PowerShell!


    # SUMMARY


    This chapter has covered a number of different PowerShell topics to help you develop
    a solid understanding of how to interact with the PowerShell command line. You
    learned how to configure the Windows command console in order to customize your
    working environment. You learned how to configure the Windows command shell to
    automatically use your Windows PowerShell script folder as your default working
    directory. You also learned how to work with tab completion and to use PowerShell
    to navigate and access different types of system resources, including the Windows
    registry and environment variables.


    Now, before you move on to Chapter 3, “Object-Based Scripting with .NET," I suggest
    you aside a few extra minutes to work on and improve The Story of the Three Amigos
    by implementing the following challenges.


    # CHALLENGES


    +   1. For starters, consider prompting the user to provide additional inputs
