    # Single Line if Statements


    In its simplest form, if the statement consists of a single statement:


    ```

    if ($x -eq 10) (Write-Host "Game over!")

    ```


    In this example, the value of $x is tested to see if it is equal to 10. If this
    text evaluates to true, the Write-Host cmdlet located inside the if statement''s
    code block is executed. This form of the if statement is best applied to simple
    conditional tests that contain a single statement in their code block. For situations
    where more than one statement must be executed inside the code block, the multiline
    form of the if statements should be used.


    # Multiline Statements


    Often, you will want to execute a number of statements based on the evaluation
    of a conditional test. In these situations, you can apply an if statement, as
    demonstrated here:


    ```

    if ($x -eq 10) {

    Clear-Host

    Write-Host "Game over! Press Enter to continue."

    Read-Host

    }

    ```


    As this example demonstrates, you can embed any number of statements in an if
    statement''s code block. In this example, if the value of $x is equal to 10, all
    of the statements inside the code block''s opening and closing brackets are executed.
    If, however, the value of $x is not equal to 10, the statements located inside
    the code block are skipped.


    # Providing an Alternative Course of Action


    The if statement is extremely flexible. By including an optional else statement,
    you can add additional logic that provides for an alternative course of action
    in the event the tested condition evaluates as false. For example, you might use
    the else statement to modify the previous example, as shown here:


    ```

    if ($x -eq 10) {

    Clear-Host

    Write-Host "Game over! Press Enter to continue."

    Read-Host

    }

    ```'
