    # WINDOWS POWERSLL EDIT ENHANCEMENTS


    In addition to inheriting access to all the edit features provided by the Windows
    command console, Windows PowerShell also provides you with access to a couple
    of PowerShell-specific editing capabilities that you can use to work smarter and
    faster from the Windows PowerShell command prompt.


