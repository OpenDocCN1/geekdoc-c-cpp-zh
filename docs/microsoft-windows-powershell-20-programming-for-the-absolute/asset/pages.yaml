  md: '# INTERACTING WITH THE WINDOWS POWERSHELL COMMAND LINE AND GRAPHICAL ENVIRONMENT


    In order to work effectively with the Windows PowerShell and develop PowerShell
    scripts, you must have a solid understanding of how to interact with Windows from
    the PowerShell command line. This chapter will provide instruction on how to configure
    the Windows command console to create a better working environment with which
    to interact with Windows PowerShell. This includes learning how to configure command
    console layout and to specify your default working directory. This chapter will
    also explain how to take advantage of Windows PowerShell''s built-in tab completion
    feature to save time and reduce errors when keying in commands. You will also
    learn how to use PowerShell to navigate and access different types of system resources,
    including the Windows registry, environment variables, and disk drives. On top
    of all this, you will learn how to create your second PowerShellgame, The Story
    of the Three Amigos.'
