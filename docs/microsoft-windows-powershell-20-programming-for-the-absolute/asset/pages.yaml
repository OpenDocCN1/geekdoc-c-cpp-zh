  md: '# CHAPTER 5


    # IMPLEMENTING CONDITIONAL LOGIC


    The Windows PowerShell scripting language, just like every programming language,
    includes language statements that provide the ability to test and evaluate different
    conditions. Conditional logic is a fundamental component of programming logic,
    and it is all impossible to develop a PowerShell script of any level of complexity
    without using it. Conditional logic facilitates the evaluation of user, system,
    and file input against each other and against system resources. Based on the results
    of conditional tests, your PowerShell scripts can exercise tight control over
    which statements are executed, thus creating new dynamic scripts that adjust their
    execution according to the data they encounter.


    Specifically, you will learn how to:


    +   - Implement conditional logic using variations of the if statement

    - Embed if statements inside one another to build more complex logic

    - Use the switch statement to create logical tests that evaluate multiple conditions

    - Work with different types of comparison and logical operators'
