  md: '# Chapter 3 · Object-Based Scripting with .NET


    As you can see, the list of aliases supported by Windows PowerShell is quite extensive.
    Convenient as a short-term solution for executing cmdlets, I suggest that you
    resist the temptation of using these aliases and instead take the time needed
    to learn the PowerShell''s cmdlet names. This will help make your PowerShell scripts
    easier to maintain and support in the long run.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_134_0.png)


    Windows PowerShell also lets you define your own custom aliases. This is accomplished
    using the Get-Alias cmdlet, which requires two arguments. The first argument is
    the alias to be assigned and the second argument is the name of the cmdlet for
    which the alias is to be associated. For example, the statements create a new
    alias of ds for the Write-Host cmdlet.


    ```

    Set-Alias ds Write-Host

    ```


    You may recall seeing an example of this earlier in this chapter when you read
    about how to programmatically customize Windows PowerShell.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_134_1.png)


    Windows PowerShell does not perform any verification of the validity of an alias
    assignment using the Set-Alias cmdlet. It is up to you to ensure that your new
    alias works as expected and you did not mistype the name of the target cmdlet.


    # BACK TO THE POWERSHELL FORTUNE TELLER GAME


    Okay, it is time to turn your attention back to the chapter''s main project, the
    PowerShell Fortune Teller game. This game will involve the use of a number of
    programming techniques, including conditional logic and looping. You will also
    learn how to instantiate (establish a new instance of) a random object in order
    to generate a random number.


    # Designing the Game


    The PowerShell Fortune Teller game begins by displaying a welcome screen and then
    providing the player with instructions on how to formulate questions. Next, the
    player is prompted to ask a question. In response, the game will display a randomly
    generated answer based on the value of the script''s randomly generated number.
    The specific answer displayed by the script will also vary based on the time of
    day, since the fortune teller gets a bit cranky in the afternoon. Once the player''s
    question has been answered, the script will prompt the player to either ask a
    new question or terminate the script''s execution. Thus, the player is allowed
    to ask as many questions as he wants. Once the player indicates that he wants
    to terminate the script, the game ends by inviting the player to return and play
    again.'
