    # Reading from Text Files


    Windows PowerShell can just as easily read from a text file as it can write to
    it. Windows PowerShell provides the ability to read from a text file using the
    Get-Content cmdlet, as demonstrated here:


    ```

    Get-Content C:\Temp\Temp.txt

    ```


    As you see, the only argument passed to the Get-Content cmdlet is the name and
    path of the text file to be read. This statement will display the contents of
    whatever has been stored in the specified text file. When executed, the Get-Content
    cmdlet automatically creates an array into which is stored each of the lines in
    the specified text file, making it possible, for you to then process every line
    of text using a loop.


    # Erasing File Contents


    If you want you can programmatically erase the contents of a file without removing
    the file from the computer using the Clear-Content cmdlet. To use this cmdlet,
    you simply specify the name and path of the file to be erased as an argument as
    demonstrated here:


    ```

    Clear-Content C:\Temp\Temp.txt

    ```


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_292_1.png)


    You can use the Clear-Content cmdlet to erase more than just the content of text
    files. You can use it to clear out other types of files such as Microsoft Word'
