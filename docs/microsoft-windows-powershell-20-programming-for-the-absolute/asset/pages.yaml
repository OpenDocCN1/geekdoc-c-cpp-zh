  md: '# Saving Data as an XML File


    Windows PowerShell also allows you to save pipeline object data in the form of
    an XML file. XML stands for Extensible Markup Language. Its purpose is to facilitate
    the definition, storage, and transmission of data between applications. To generate
    an XML file, you can use the Export-Clixm cmdlet, as demonstrated below.


    ```

    Get-ChildItem | Export-Clixm C:\Temp\Text.xml

    ```


    Here, the Get-ChildItem cmdlet is used to generate a list of files stored in the
    current working directory and then the Export-Clixm cmdlet is used to save the
    resulting output in an XML file. When executed, this statement will generate an
    XML file whose contents are similar to those shown in Figure 8.7.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_294_0.png)


    > Figure 8.7

    Example of the output that is produced when an XML file is generated.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Reading Data from an XML File


    Windows PowerShell provides a cmdlet that lets you retrieve XML data, thus letting
    you use it again as in another PowerShell script. To open and read an XML file,
    you need to use the Import-Clixml cmdlet, as demonstrated here:


    ```

    $xmlFile = Import-Clixml C:\Temp\Text.xml

    $xmlFile

    ```


    In this example, the first statement uses the Import-Clixml cmdlet to retrieve
    the Text.xml file and store a copy of its content in $xmlFile. The second statement
    displays the contents stored in $xmlFile, which should look like this:


    Directory: Microsoft.PowerShell.Core\FileSystem C:\MyScripts


