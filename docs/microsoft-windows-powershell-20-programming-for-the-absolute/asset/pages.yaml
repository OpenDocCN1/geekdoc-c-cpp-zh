    by displaying


    Get-Acl


    If this is what you want, press Enter to accept this selection. Otherwise, press
    Tab to see the next available suggestion. If you continue to press Tab, PowerShell
    will continue until it exhausts the available list, after which it starts over
    again letting you loop back through the list of suggestions. For example, if you'
