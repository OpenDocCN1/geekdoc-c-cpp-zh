    Unfortunately, you cannot perform a secondary sort using the Out-Grid-View cmdlet''s
    graph-

    ical window. Instead, to do this you must programmatically sort the data before
    the desired

    passing it to the Out-Grid-View cmdlet as demonstrated here:


    ```

