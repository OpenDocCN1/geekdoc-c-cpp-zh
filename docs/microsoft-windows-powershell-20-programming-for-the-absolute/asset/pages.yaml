    Remove-ItemProperty. A Windows PowerShell cmdlet that removes a property and its
    value from the specified location.


    Remove-Module. A Windows PowerShell 2.0 cmdlet that removes a PSModuleInfo object
    from the list of loaded modules.


    Remove-PSBreakpoint. A Windows PowerShell 2.0 cmdlet that deletes breakpoints
    from the current working session.


    Remove-PSDrive. A Windows PowerShell cmdlet that removes a drive.


    Remove-PSEvent. A Windows PowerShell 2.0 cmdlet that unsubscribes from an event.


    Remove-PSJob. A Windows PowerShell 2.0 cmdlet that deletes a background job.


    Remove-PSSnapIn. A Windows PowerShell cmdlet that removes PSSnapIns from the current
    console.


    Remove-Runspace. A Windows PowerShell 2.0 cmdlet that terminates one or more runspaces.


    Remove-Variable. A Windows PowerShell cmdlet that deletes a variable and its value.


    Remove-WMIObject. A Windows PowerShell 2.0 cmdlet that deletes WIM instances and
    classes.


    Rename-Item. A Windows PowerShell cmdlet that changes an item''s name.


    Rename-ItemProperty. A Windows PowerShell cmdlet that renames a property.


    Reserved Word. A keyword that Windows PowerShell has predefined as having a special
    purpose.


    Resolve-Path. A Windows PowerShell cmdlet that resolves the wildcard characters
    in a path.


    Restart-Service. A Windows PowerShell cmdlet that restarts a service that has
    been stopped.


    Resume-Service. A Windows PowerShell cmdlet that resumes a service that has been
    suspended.


    Runspaces. Separate managed execution spaces in which Windows PowerShell scripts
    can be executed.


    Run-time Error. An error that occurs when a script attempts to perform an illegal
    action such as the division of a number by zero.


    Script Cmdlets. Custom cmdlets created using the Windows PowerShell scripting
    language.


    Script Scope. The scope that is established whenever a script is executed and
    which ends when the script stops executing.'
  merge: -1
