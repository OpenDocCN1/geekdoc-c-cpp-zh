  pgno: 121
- img_proc: true
  md: '# Chapter 3 · Object-Based Scripting with PowerShell


    Background jobs can be executed on either your local computer or on a network
    to which you have security access. Background jobs are perfect for running scripts
    and cmdlets that may take a while to execute.


    By default, Windows PowerShell immediately returns the results of any command
    you execute and displays them in the console window. However, instead of displaying
    output, background jobs return and display a number, representing a job object.
    You can then use this object to determine the job''s status, to control its execution,
    and retrieve its output.


    Windows PowerShell provides a number of cmdlets, including Get-Process, Get-Service,
    Get-EventLog, and Get-MIObject, which allow you to retrieve information from network
    computers. These commands do so by invoking .NET methods to retrieve object data
    and do not rely on Windows PowerShell''s remoting''s infrastructure.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_122_0.png)


    Once executed, a background job runs in its own "runpace," separate from the execution
    environment being used by Windows PowerShell in the current console window. The
    runspace can be either temporary or persistent, the difference being that a temporary
    runspace is deleted as soon as it finishes executing its command or script, whereas
    a persistent runspace continues to exist until you explicitly delete it. Persistent
    runspaces allow things like variables to persist across different script executions.


    Windows PowerShell 2.0 provides seven cmdlets that allow you to learn about and
    work with background jobs. These cmdlets, along with a brief description of what
    each does, is outlined here:


    +   - PSJob. Provides a high-level overview of how to work with background jobs.

    - Start-Job. Creates and executes a new local or remote background job.

    - Receive-PSJob. Retrieves output generated by a background job.

    - Wait-PSJob. Instructs Windows PowerShell to wait for a background job to complete.

    - Stop-PSJob. Halts the execution of a background job.

    - Get-PSJob. Retrieves information about the status of a background job.

    - Remove-PSJob. Deletes a background job object (including all of its output).


    Windows PowerShell 2.0 also has a New-Runspace cmdlet, which you can use to set
    up a persistent runspace in which to execute remote jobs.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Creating and Executing Background Jobs


    To create and execute a background job that runs in a temporary runspace on your
    local computer, you need to use the Start-PSJob cmdlet, as demonstrated here:

    PS:\> Start-PSJob -command "Get-Service"


    | SessionId | Name | State | MoreData | Command |

    | 7 | | Running | True | Get-Service |


    Here, the Get-Services cmdlet runs as a background job on the local computer.
    Note that no output is displayed when the Get-Service cmdlet executes. Instead,
    a little status information about the background job is displayed in a table.
    Among this information is the SessionId attribute, which you can use to communicate
    and control the job while it executes. Other data includes state information,
    showing whether the job is running, failed, not started, or completed, and HasMoreData,
    which indicates a value of true if the background job has any output data available
    for retrieval.


    # Remotely Executing a Background Job


    To run a background job, remotely, across a network on a computer on which you
    have appropriate security access, all you have to do is add the -computer parameter
    to the end of the statement, followed by the network computer''s hostname. UNC
    name, or IP address, as demonstrated here:


    ```

    PS:\> Start-PSJob -command "Get-Service" -computer FileSVR\

    ```


    | SessionId | Name | State | MoreData | Command |

    | 9 | | Running | True | Get-Service |


    PS:\> you can run a background job on more than one network computer at a time
    by supplying a comma-separated list of computers, as demonstrated here:


    ```

    PS:\> Start-PSJob -command "Get-Service" -computer FileSVR,

    PrintSVR

    ```


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_123_0.png)'
  merge: -1
  pgno: 123
