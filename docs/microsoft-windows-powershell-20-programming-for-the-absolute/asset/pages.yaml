    # WINDOWS POWERSHELL LANGUAGE FEATURES


    Although the primary focus of this chapter is on the storage and retrieval of
    data during script execution, there are a few additional topics that need to be
    covered to help round out your understanding of PowerShell scripting bases. These
    topics include:


    +   - Reserved words

    - Escape characters

    - String manipulation


    # Windows PowerShell Reserved Words


    Like any programming language, Windows PowerShell has a collection of reserved
    words (also referred to as keywords) that have a special meaning to the language
    and thus are not available for use as variable, array, associative array, and
    function names.


    A reserved word is a keyword that Windows PowerShell has predefined as having
    a special purpose. An example of a PowerShell reserved word is if, which is used
    to set up conditional tests in order to evaluate when a condition is true or false
    and then control the logical execution of one or more script statements based
    on that result. As a reserved word, you must use the if keyword according to the
    strict syntactical rules defined by Windows PowerShell. Therefore, you cannot
    create a variable or array or any other identifier named in your PowerShell scripts.
    Table 4.1 provides a listing of PowerShell reserved words.'
