    # Comparing Values


    Windows PowerShell provides the ability to compare different resources, such as
    numbers and strings. To demonstrate this ability, start a new PowerShell session
    and enter 5 -eq 5 and press Enter, as demonstrated below.


    ```

    PS C:> -eq 5

    ```


    ```

    True

    ```


    -eq is the PowerShell operator and is used in this example to determine whether
    two numbers are equal. Once evaluated, Windows PowerShell displays the result
    of its evaluation in the form of a Boolean true or false value. All comparison
    operations evaluate to a value of true or false. The next example demonstrates
    the results returned from the comparison between two unequal values.'
