    # Discoverability


    PowerShell allows you to discover its features. For example, by using Get-Command,
    you can see all available cmdlets.


    PowerShell is designed to be extensible. Because it is an object-oriented shell,
    you can use the pipeline to pass objects from one cmdlet to another, which makes
    it very powerful for complex tasks.


    ```

    get-help-service

    ```


    # Consistency


    PowerShell provides a consistent environment across different platforms. This
    makes it easier for administrators to write and maintain scripts across various
    systems.


    The consistency of PowerShell is one of its primary features. For example, if
    you learn how to use one cmdlet, you likely know how to use many other cmdlets.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_84_3.png)


    # Interactive and Scripting Environments


    PowerShell is an interactive and scripting environment that gives you the power
    of the command-line with the flexibility of modern programming languages.


    The PowerShell Console is a graphical application that provides an interactive
    environment with multiple command lines. It allows you to test commands and see
    results immediately.'
