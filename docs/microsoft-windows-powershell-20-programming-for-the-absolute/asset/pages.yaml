    # Other Types of Commands


    It is important that I do not leave you with the impression that the only types
    of commands that you can run from the Windows PowerShell command prompt are cmdlets.
    In fact, you can run any executable file. One way to locate executable files is
    by using the Get-Command Get-Command *.exe demonstrated below.


