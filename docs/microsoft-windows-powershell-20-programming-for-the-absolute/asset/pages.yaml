- img_proc: true
  md: 'In this example, a filter named GetOddEven has been created that determines
    whether a number is odd or even. This filter takes any numeric value passed to
    it and divides it by 2 using the modulus operator (%). If the result of this operation
    yields a value of 1 then the value passed to the function was an odd number; otherwise,
    it was an even number.


    If called by the following statement


    ```

    @(5, 4, 6) | Get-OddEven

    ```


    The Get-OddEven function will display the following output:


    Odd

    Even

    Even


    In reality, filters and functions are pretty much equivalent. The difference is
    that filters $_ are able to act upon pipeline object data as soon as it becomes
    available through the $_special variables, whereas functions have to wait for
    all incoming pipeline data to arrive and populate the $Input variable before processing.
    To process a large list of data objects stored in the $Input variable, you will
    usually have to set up a loop inside a function in order to iterate through each
    object. Filters also eliminate any need to use loops to process data. As a result
    of these differences, filters can be more efficient and result in faster processing
    than functions when large amounts of data are being passed through the object
    pipeline.


    Often, you can forget the creation of custom filters and instead use the Foreach-Object
    and the Where-Object cmdlets to filter data from the object pipeline. However,
    while these cmdlets are sufficient for simple operations, to perform complex logical
    operations on pipeline data you will need to set up a filter.


    # BACK TO THE POWHELL HANGMAN GAME


    Okay, it is time to turn your attention back to the chapter''s main game project,
    the PowerShell Hangman game. The PowerShell Hangman game is a word guessing game
    in which the player is challenged to guess a randomly selected word, a letter
    at a time. To win, the player must guess each letter in 12 guesses or fewer.


    The overall construction of the PowerShell Hangman game will be completed in 11
    steps, as outlined here:


