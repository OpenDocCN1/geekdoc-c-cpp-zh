  md: '# WORKING WITH FILES AND FOLDERS


    Windows PowerShell provides access to cmdlets that allow you to work with files
    and folders in many ways. This chapter will teach you how to develop PowerShell
    scripts that can create, delete, rename, copy, and move files and folders. You
    will learn how to determine if files and folders exist before you attempt to work
    with them. This chapter will also show you how to write and read data from files
    with different types of files, including plain text files, CSV files, and XML
    files. You will also learn how to use regular expressions to specify matching
    file and folder names and to use other cmdlets that allow you to control the format
    of cmdlet output and to print the output provided by cmdlets or stored in text
    files.


    Specifically, you will learn how to:


    +   - Administer files and folders

    - Write to and read from different types of files

    - Use regular expressions to perform complex pattern matching

    - Control the display of cmdlet output using formatting cmdlets'
