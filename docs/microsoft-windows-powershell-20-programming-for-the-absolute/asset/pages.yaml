  md: '# 354 Microsoft Visual Studio C# Programming for the Absolute Beginner. Second
    Edition


    Using Try, Catch, and Finally blocks, you can embed code statements where errors
    are likely to occur and then provide compensating programming logic to handle
    them. When using the catch blocks described above to develop event handlers, you
    must use the following syntax.


    ```

    Try {

    #Insert code statements where errors may occur

    }

    ```


    ```

    Catch[Exception],...,(Exception) {

    #Code statements to execute

    }

    ```


    .

    .


    ```

    Catch {

    #Code statements to execute

    }

    ```


    ```

    Finally {

    #Code statements run whenever a run-time error occurs

    }

    ```


    To begin, you must place the statement(s) where you think an exception may occur
    inside the Try block. You then place the statements designed to handle the exception
    inside one or more Catch blocks. By defining different Catch blocks you are able
    to develop different responses to different types of exceptions and to handle
    each one accordingly. Each Catch block can define one or more exceptions and can
    add an optional Finally block that will always execute, regardless of whether
    an error occurred or which Catch block executed. When included, the Finally block
    is the last block to be executed, providing a place to put statements that perform
    any necessary wrap-up of tasks.


    > If you specify an empty Catch block (e.g., a Catch block without a specified
    exception), it must be the last Catch block you specify, following other more
    Catch blocks, otherwise, an error will occur.


