  md: '# CHALLENGES


    +   1. As it is currently written, the Guess My Number game provides somewhat
    cryptic messages when interacting with the user. Consider making the game more
    intuitive by adding additional instructions and guidance.


    +   2. Consider tracking and displaying additional game statistics. For example,
    you might create a new variable that keeps track of the total number of games
    played. You might also keep track of the number of low versus high guesses in
    order to help players detect any trends in their methods of play (e.g., a tendency
    to guess too low too often).


    +   3. Consider modifying the game to allow the player to quit at any time, instead
    of just at the end of the current round of play. For example, in addition to looking
    for a number in the range of I to 100, you might also look for the user to instead
    type a 0, signaling a desire to quit.


    +   4. Rather than arbitrarily using a range of I to 100, consider giving the
    player the option of specifying a different range. For example, you might offer
    to allow the player to select from three ranges, such as I to 10, I to 100, or
    I to 1,000.'
