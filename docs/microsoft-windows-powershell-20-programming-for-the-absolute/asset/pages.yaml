- img_proc: true
  md: 'As the sections that follow will demonstrate, the Windows command console is
    highly configurable, allowing you to modify its appearances and behavior in a
    number of ways. In addition, it provides you with a number of handy editing commands
    for interacting with the Windows PowerShell.


    > > HINT To help improve the presentation of figures in this book, I have modified
    the version of the Windows command console to be 25 characters long and 80 characters
    wide. Also, I have set up text to display as black characters on a white background.


    # Windows Command Console Customization Options


    In order to customize the Windows command console, you must first open it, which
    you can do by starting a new PowerShell session. Once opened, right-click on the
    Command Prompt icon located in the upper-left corner of the command console''s
    title bar and select Properties from the context menu. This will open the Windows
    Properties dialog. This dialog is organized into four property sheets. Each of
    these sheets controls a different aspect of the Windows command console. You configure
    the Windows command console''s behavior and appearance by modifying the attribute
    information shown on these property sheets.


    > > HINT Even though this section highlights the configuration of the Windows
    command console using Windows Vista, the information provided here should also
    broadly apply to Windows XP, Windows 2003, and Windows 2008.


    # Modifying Command Console Options


    The first property sheet on the Properties window is the Options tab, as shown
    in Figure 2.10. From here, you can modify the following Windows command console
    attributes:


    +   - Cursor Size. Determines whether the command console appears in a small,
    medium, or large size.


    +   - Command History. Determines the size of the command console''s buffers,
    which affects the number of commands the command console stores and retrieves,
    as well as the number of buffers in use and whether or not duplicate commands
    are saved as part of the command console''s command history.


    +   - Edit Options. Determines whether QuickEdit mode and Insert mode are enabled.
    QuickEdit is a command console feature that supports the copying of text from
    the command window and the pasting of text to the command prompt. Insert mode
    controls whether text is inserted or overwritten when editing text keyed in at
    the command prompt.'
