  md: "# Chapter 6 • Using Loops to Process Data\n\n+   - do while. Iterates as long\
    \ as a specified condition is true\n- do until. Iterates until a specified condition\
    \ is true\n- for. Iterates a set number of times\n- foreach. Iterates through\
    \ all of the elements stored in a collection or array\n- while. Iterates as long\
    \ as a specified condition is true\n\nYou will learn how to work with each of\
    \ these types of loops in the sections that follow.\n\nIn addition to the language\
    \ looping statements listed above, Windows PowerShell also provides access to\
    \ the Where-Object andForEach-Object cmdlets. As you have already seen, these\
    \ cmdlets let you loop through and process lists of data as they pass through\
    \ the object pipeline.\n\n![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_214_0.png)\n\
    \n# Setting Up do Loops\n\ndo while loops execute as long as, or while, the tested\
    \ condition remains true. Because the condition being tested is evaluated at the\
    \ end of the loop, you can count on the loop always executing at least one time.\
    \ The syntax of the do while loop is shown as follows.\n\n```\ndo {\n  code block\n\
    } while (condition)\n```\n\n**condition** is an expression that is tested at the\
    \ end of each iteration of the loop. An example of how to work with the do while\
    \ loop is provided here:\n\n```\ndo {\n  Write-Host $i\n  $++\n} while ($i -lt\
    \ 10)\n```\n\nIn this example, a variable named $i is set to 1 and then used within\
    \ the do while loop that follows. Inside the loop, the value of $i is displayed\
    \ and then incremented by 1. The conditional test, located at the end of the loop\
    \ is evaluated, and as long as the value of $i remains less than 10, the loop\
    \ continues executing. When run, this example displays the results.\n\n+   1\n\
    2\n3"
