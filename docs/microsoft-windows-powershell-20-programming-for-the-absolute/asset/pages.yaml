  md: '# SUMMARY


    This chapter showed you how to use functions and filters as a means of improving
    the overall organization and structure of your Windows PowerShell scripts. You
    learned how functions support the centralization of programming logic, reduce
    the overall size of scripts, and support code reuse. You learned how to define
    and execute functions. You learned how to pass arguments and return results. You
    also learned how to insert functions in the object pipeline. You learned how functions
    affect variable scope as well as how to access script-level variables within functions.
    On top of all this, you learned how to develop filters as an alternative to functions,
    in order to more efficiently large amounts of object pipeline data.


    Now, before you move on and begin reading Chapter 8, I suggest you take a little
    extra time to improve the PowerShell Hangman game by tackling the following list
    of challenges.


    # CHALLENGES


    +   1. As it is currently written, the PowerShell Hangman game gives the player
    I 2 guesses to figure out the game''s secret word. To make this game work more
    like the traditional children''s game, change things so that the player is only
    allowed to make six incorrect guesses. This way correct guesses will not be counted
    against the player. You may also want to associate each guess with a body part.
    For example, the first miss would represent a head, the second miss would represent
    the body, the third and fourth misses would represent arms, and the fifth and
    sixth misses would represent legs. You might enjoy displaying a text-based graphic,
    similar to that of the game''s opening menu, at the end of each turn. You could
    use this graphic to represent the number of misses (e.g., after the first missed
    guess the graphic would show a head, after the second missed guess it would show
    the head and body, and so on).

    2. Currently, the PowerShell Hangman game only has 10 words to randomly choose
    from. To make the game more challenging, consider modifying the game to support
    20 or 30 different words.'
  merge: -1
