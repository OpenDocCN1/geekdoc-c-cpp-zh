    # Accessing and Administering System Resources


    Windows PowerShell will provide system administrators, power users, and computer
    hobbyists with access to a host of system, application, and network resources.
    The number of possibilities is too great to cover all them in this book. Instead,
    this chapter will attempt to provide you with a sampling of examples that demonstrate
    some of the many avenues of system administration that Windows PowerShell can
    assist you in automating.


    # Listing and Stopping Processes


    Windows operating systems run various processes behind the scenes that work together
    to help keep your computer running smoothly. As you have already seen, you can
    use the Get-Process cmdlet to get a listing of all the processes running on a
    computer, as demonstrated here:


    ```

    Get-Process

    ```


    When executed, this statement will generate output similar to the following:


    | Handles NPM(K) PM(K) WS(K) VM(M) CPU(s) Id ProcessName |

    | 95 4 24092 244 155 1664 aawervice |

    | 71 3 2084 740 38 1116 AppleMobileDe... |'
