  md: "# TABLE 10.2 PowerShell Error Handling Options\n\n| Option | Value | Description\
    \ |\n| :--- | :--- | :--- |\n| Y | Yes | Allows the script to continue and process\
    \ the error as appropriate. |\n| A | Yes to All | Automatically assumes a value\
    \ of yes for any further inquiries. |\n| H | Halt Command | Stops the execution\
    \ of the cmdlet. |\n| S | Suspend | Pauses the current pipeline and opens a new\
    \ sub-shell. Allows you to troubleshoot before typing exit to close the sub-shell\
    \ and then returns to decide which option you want to select once pipeline processing\
    \ is resumed. |\n| | Help | Displays an explanation of the effects of each of\
    \ the available options. |\n\n# ## Creating Error Handlers\n\nWhenever an error\
    \ occurs, Windows PowerShell generates an exception. This exception can be trapped\
    \ by an exception or error handler, giving programmers the ability to add logic\
    \ to their PowerShell scripts that respond to errors. Windows PowerShell 1.0 gives\
    \ you the ability to trap and handle errors using handlers. Windows PowerShell\
    \ 2.0 supports trap handlers, but also supports an even more powerful way of handling\
    \ errors using Try, Catch, and Finally code blocks. Both of these error handling\
    \ options are explained and demonstrated in the sections that follow.\n\n# ##\
    \ Creating Trap Handlers\n\nA trap handler is a mechanism that catches errors\
    \ raised during script execution, giving you the opportunity to analyze and hopefully\
    \ recover from errors. The syntax required to set up a trap handler is outlined\
    \ here:\n\n```\nTrap [Exception] (\n  Script statements\n  .\n  Return [Value]\
    \ | Continue | Break\n)\n```\n\nHere, Exception is an optional placeholder for\
    \ an argument representing a specific type of error to be trapped. When specified,\
    \ the trap handler will ignore any errors that occur and do not match the specified\
    \ exception type. If omitted, the trap handler will fire for any"
  merge: -1
  pgno: 374
- img_proc: true
  md: 'exception that occurs within its scope. You can include any number of script
    statements within a trap handler. Typically, you would use $_ to access information
    about the exception and define what action, if any, is appropriate to take as
    well as to change the value of ErrorPolicy when appropriate. Lastly, trap handlers
    can specify any of three optional terminal options.


    Return[Value] will exit the current scope and return the specified value. Continue
    PowerShell to continue script execution beginning with the statement that comes
    immediately after the statement that generated the error. Break terminates the
    execution of the current scope. If none of these options is returned, PowerShell
    returns the value of $_


    It is important to remember that Windows PowerShell provides for different scopes.
    When a script begins executing, it creates its own scope. Within the script, functions
    that are defined generate their own sub-scopes. If you place a trap handler within
    a function and an error occurs within the function, the function''s trap handler
    will be executed. If the function does not have its own trap handler, the error
    will be passed back to the parent scope and will be processed by a trap handler,
    if present, within this scope.


    If you place a trap handler within a function and an error occurs, specifying
    an option of Continue will tell PowerShell to continue executing the next statement
    within the function. Break interrupts PowerShell to terminate the current scope,
    allowing the parent scope to handle the error (if the parent scope has a trap
    handler defined). Return [Value] instructs PowerShell to terminate the current
    scope and return whatever value you specify to the parent scope.


    > TRICK If you want, you can define multiple trap handlers within each scope.
    In this case, each trap handler is executed in the order that it was defined,
    but only the optional Return[Value]/Continue/Break statement in the last trap
    handler is executed.


    For a better understanding of how to set up trap handlers, take a look at the
    following example.


    ```

    trap {

    Clear-Host

    write-Host "*nAn unexpected error has occurred. Please record the following"

    write-host "message and notify the Help Desk.

    "

    }

    ```'
