- img_proc: true
  md: 'Changes to font size also affect the size of the Windows console. The Windows
    Preview area provides you with visual feedback regarding the effects of making
    a font size change.


    The Font property sheet also allows you to change the font type used by the Windows
    console. The effects of a font type selection are made immediately apparent in
    the Selected Font: Terminal section of the Font property sheet. Depending on the
    font that you select, the Bold fonts attribute, located just above the list of
    available fonts, is enabled. When enabled, this binds console text, which depending
    on your preferences, may make console text easier to read.


    # Changing the Layout of the Windows Command Console


    The third property sheet on the Properties windows is the Layout tab, as shown
    in Figure 2.12. From here, you can set the Windows console''s initial size and
    display location.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_67_0.png)


    > FIGURE 2.12

    Modifying Windows console screen size and Windows position.


    Changes made to Layout attributes are immediately reflected in the Windows Preview
    portion of the Layout property sheet. Configuration changes are made by modifying
    any of the following settings:


    +   - **Screen Buffer Size.** The Width setting specifies the number of characters
    that are displayed on a single line. The Height setting specifies the number of
    lines of text that can be stored in memory, thus controlling the number of lines
    that you can scroll back and view.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Chapter 2 · Interacting with the Windows PowerShell


    **Windows Size.** The Width setting specifies the number of characters that are
    displayed on a single line. The Height setting specifies the number of lines of
    text the command console displays by default. Regardless of these settings, you
    can always manually resize the Windows command console like any other Windows
    application by right-clicking on its edges and dragging them to a new location.
    It should be noted, however, that the Windows command console cannot be resized
    larger than the height and width values set in the Screen Buffer Size section.


    **Windows Position.** You can set the starting location of the Windows command
    console by modifying these to specify the exact location where the Windows command
    console should be displayed when started. Position is set by specifying the pixel
    count of the left and right corner of the Windows command console''s upper-left
    corner. A pixel (picture element) represents the smallest area that can be displayed
    or printed. Optionally, you can allow Windows to determine the proper location
    for the Windows command console by leaving the default Left System Position attribute
    selected.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_68_0.png)


    I recommend that you set the Screen Buffer Size Height to at least three times
    the height of the Windows Size setting. This will allow you to scroll through
    several pages of previously executed commands and command output.


    # Changing Command Console Color Attributes


    The fourth sheet on the Properties window is the Colors tab, as shown in Figure
    2.13. From here, you can change the Windows command console''s foreground and
    background colors.


    The left-hand side of the top portion of the Colors property sheet provides access
    to four different options. To configure these options, select them one at a time
    and then select a color from the color strip located in the middle of the property
    sheet. The four options include:


    +   * **Screen Text.** Specifies the color used to display text.

    * **Screen Background.** Specifies the color used to display the command console''s-background
    color.

    * **Popup Text.** Specifies the color used to display the text color of the Windows
    command console''s Command History dialog box.

    * **Popup Background.** Specifies the color used to display the background color
    of the Windows command console''s Command History dialog box.'
  merge: -1
