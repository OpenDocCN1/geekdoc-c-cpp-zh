  md: "# Chapter 7 • Organizing Scripts Using Functions (221)\n\n![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_244_0.png)\n\
    \nUnlike variables, there are no hard and fast rules that you must follow when\
    \ naming functions. However, it is a good idea to assign descriptive names to\
    \ functions that help identify each function's purpose. In this book, you will\
    \ see that I have elected to follow a function naming scheme that mimics the naming\
    \ scheme used by cmdlets. Specifically, functions are assigned names that begin\
    \ with a verb, followed by the - character and then a noun. I suggest you develop\
    \ your own naming scheme and stick to it all in your Windows PowerShell scripts.\
    \ This will help to make your code easier to read and manage.\n\nHere, a function\
    \ named Write-Greeting has been created. When called, this function uses the Write-Host\
    \ cmdlet to display a text string. Of course, you can include as many statements\
    \ as you want within a function's code block. You can execute this function from\
    \ anywhere within the PowerShell script where it has been added by specifying\
    \ its name, as demonstrated by the following.\n\n```\nfunction Write-Greeting\
    \ {\n    Write-Host \"Hello World!\"\n}\n```\n\nWrite-Greeting\nHere, a function\
    \ is defined, initialized, and then executed by specifying its name.\n\n![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_244_1.png)\n\
    \nI recommend that you define all functions in a central location at the beginning\
    \ of your PowerShell script files. This will ensure that all your functions are\
    \ defined and initialized before they are called upon. It will also help to make\
    \ your program code easier to read and make things a lot easier to find. As such,\
    \ I suggest you modify your Windows PowerShell script template as shown here:\n\
    \n```\n# ################################################################\n# Script\
    \ Name:\n# Version:\n# Author:\n# Date:\n#\n# Description:\n#\n```"
