    # Windows PowerShell Basics


    PowerShell uses some basic concepts that are well known to most users, such as
    a familiar interface to accomplish tasks. Operating systems provide users with
    a graphical interface for interaction.


    Unlike other shells that use text streams, PowerShell uses a different object
    framework to pass data between commands. Although you can use text, objects are
    communicated commands and command parameters.


    PowerShell includes many specific cmdlets, which follow a verb-noun naming convention
    that makes them easy to discover and use. These cmdlets work with the shell to
    automate command generation and scheduling of tasks.


    PowerShell provides many advantages for users with knowledge of PowerShell scripting,
    such as flexibility, consistency, and consistency across environments.


    +   - Using Cmdlets

    - Using Pipeline-commands

    - Using Object-oriented


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_84_1.png)


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_84_2.png)


    # About Windows PowerShell


    PowerShell is designed to improve the command-line and scripting environment for
    system administrators, introducing consistency and new features.


