  md: 'used without any arguments, the Out-Printer cmdlet submits print output to
    the computer''s default printer, as demonstrated here:


    "This is a printer test." | Out-Printer


    Here, a text string has been piped to the Out-Printer cmdlet for printing. Similarly,
    you can send a text file to the default printer, as demonstrated here:


    Get-Content C:\Temp\Textfile.txt | Out-Printer


    In fact, you can redirect any pipeline object data to the printer as shown here:


    get-location | Format-List | Out-Printer


    When executed, this statement will print out a document containing the following
    output:


    ```

    Drive : C

    Provider : Microsoft.PowerShell.Core\FileSystem

    Path : C:\nPath : C:\

    ```


    Finally, you can also direct the Out-Printer cmdlet to submit print output to
    a specific printer by passing the printer''s name as an argument.


    Get-Location | Format-List | Out-Printer "hp_deskjet"


    Here, information about the current working directory is printed to a printer
    named hp_deskjet.


    # DISPLAYING DATA IN A GRAPHIC WINDOW USING THE OUT-GRIDVIEW CMDLET


    Before we begin working on the chapter''s game project, let''s switch tracks for
    a moment and learn how to work with Windows PowerShell 2.0''s new Out-GridView
    cmdlet. Like the Format-List and Format-Table cmdlets, this cmdlet gives detailed
    control over the presentation of output. Instead of being used to display output
    in the console window or in a text file, the Out-GridView cmdlet displays output
    using a table grid view in an interactive graphical desktop window.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_299_0.png)


    In order to use the Out-GridView cmdlet, you must have .Net 3.0 installed on your
    computer.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'The OutGridView cmdlet is designed to address the shortcomings of the Windows
    PowerShell console when it comes to displaying large amounts of data and searching
    or sorting that data once it has been displayed.


    You can, of course, programmatically sort output before it is displayed in the
    Windows PowerShell console. In addition, although not terribly efficient, you
    can copy and paste output from the console window into an application like Microsoft
    Word in order to search it.


    # Displaying Output


    The easiest way to use the OutGridView cmdlet is to insert it into the end of
    a pipeline, as demonstrated here:


    ```

    PS C:\> Get-Process | Out-GridView

    ```


    When executed, Windows PowerShell does not display any output in the console window.
    Instead, an output is displayed in a window similar to the one shown in Figure
    8.8.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_300_0.png)


    FIGURE 8.8

    The window generated by the OutGridView cmdlet includes a scroll bar allowing
    you to view all output.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 278 Microsoft Windows PowerShell 2.0 Programming for the Absolute Beginner,
    Second Edition


    Alternatively, you can use the Out-GridView cmdlet''s input parameter to pass
    object data to the cmdlet as demonstrated here:


    ```

    PS C:\> Get-Process

    PS C:\> Out-GridView -inobject $OutPut

    ```


    When executed, this produces output that is identical to that shown in Figure
    8.8.


    The output displayed by the Out-GridView cmdlet is organized in columns displayed
    in whatever order it is passed to the cmdlet. If you wish, you can rearrange the
    order in which columns are displayed by clicking a column heading and dragging
    and dropping it to a new location. You can increase or decrease the width of each
    column by dragging the separator bar that separates column headings. In addition,
    if you resize a column by dragging it you can snap it back to the default context-sensitive
    width, double-click on the separator bar to the right of the column that needs
    to be resized.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_301_0.png)


    You can course exercise a measure of control over the appearance of data displayed
    by the Out-GridView cmdlet by specifying what data you display and how it will
    to be sorted before you pass it off to the Out-GridView cmdlet as demonstrated
    here:


    ```

    PS C:\> Get-Process | select-object -property ProcessName, Handles, Id | Sort-

    Object -Property Handles | Out-GridView

    ```


    When executed, this statement will generate output similar to that shown in Figure
    8.9.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_301_1.png)'
