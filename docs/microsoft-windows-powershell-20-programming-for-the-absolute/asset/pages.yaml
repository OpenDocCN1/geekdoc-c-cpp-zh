  md: '# PROJECT PREVIEW: THE POWERSHELL BLACKJACK GAME


    In this chapter you will learn how to create a PowerShell version of the Blackjack
    card game. In this version of the game, the player will go head to head with the
    computer in an effort to get a better hand without busting by going over 21. When
    first started, the game''s welcome screen is displayed, as shown in Figure 9.1.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_321_0.png)


    FIGURE 9.1 The welcome screen for the PowerShell Blackjack game.


    The welcome screen is also responsible for prompting the player for permission
    to start a new round of play. This game interfaces with the Windows registry by
    accessing a key and value that you will set up as you work your way through this
    chapter. If the required key and value are not found in the registry and the player
    responds to the welcome screen by entering an N, the game will display an error
    message before terminating. If, however, the registry key and value are in place,
    the game will instead display the screen shown in Figure 9.2, should the player
    decide not to play the game after starting the script.


    If, instead of quitting, the player elects to play a hand, a screen similar to
    the one shown in Figure 9.3 is displayed, showing both her and the computer''s
    opening card.


    At the bottom of the screen, the player is prompted to take another card. In order
    to take a new card the player must type Y. To pass on the new card and to stick
    with her hand, the player must enter an N. Any other input is ignored by the game.
    The player, at her discretion, may continue to take new cards, as demonstrated
    in Figure 9.4, until the her hand exceeds 21, in which case she busts.


    If the player busts, the computer wins without ever having to take its own turn.
    Assuming that the player does not bust, the computer goes next. The computer will
    continue to take new cards as long as the total value of its hand is less than
    17. Once its hand exceeds a value of 17, the computer''s turn ends (e.g., with
    a value over 17 but less than or equal to 21, or with a bust).'
