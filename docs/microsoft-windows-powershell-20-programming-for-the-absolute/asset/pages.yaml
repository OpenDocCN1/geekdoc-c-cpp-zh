    # Remoting


    Earlier in Chapter 3, "Object-Based Scripting with .NET," you learned to execute
    local and remote background jobs using Windows PowerShell 2.0 remoting. Now it
    is time to learn about another remoting capability provided by Windows PowerShell
    2.0, referred to as remote command execution. Using remote command execution,
    you can execute commands remotely on one or more computers and any output that
    is generated will automatically returned to your local console or PowerShell script
    for processing. To keep things secure, all communications between the local and
    remote computers is encrypted.'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'Windows PowerShell remotely relies on the Windows Remote Management (WinRM)
    service and the WS-Management protocol. Instruction on how to configure remote
    access was provided in Chapter I. In order to work, both your computer and the
    computers that you want to remotely work with have Windows PowerShell 2.0 installed
    and must be configured to support PowerShell remoting. You also need appropriate
    security permission to perform commands you are executing on the remote computer.
    This includes permission to log into the remote computer, run PowerShell, and
    to access resources such as the registry and file system.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_344_0.png)


    As is the case with background jobs, you can execute remote commands using either
    a temporary runpace or a persistent runpace. To run an individual command on a
    temporary runpace on a network computer, you need to run the command using the
    Invoke-Expression cmdlet. For example, the following statement demonstrates how
    to use this cmdlet to run and retrieve results using the Get-Process cmdlet on
    a network computer named Svr1.


    ```

    Invoke-Expression -computername Svr1 -command "Get-Process torrent"

    ```


    When executed, this statement checks to see if the remote computer has any utorrent
    running. If it does, output similar to the following will be returned.


    | Handles | NPM(K) | PM(K) | WS(K) | VM(M) | CPU(S) | Id ProcessName |

    |---|---|---|---|---|---|---||

    | 245 | 42 | 8556 | 13040 | 114 | 389.36 | 752 utorrent |


    If you want to run the Get-Process cmdlet on more than one network computer at
    a time you can do so as demonstrated here:


    ```

    Invoke-Expression -computername Svr1, Svr1 -Command "Get-Process utorrent"

    ```


    Here the cmdlet has remotely executed on two network computers named Svr1 and
    Svr2. If you need to run two or more separate commands in the same remote runspace
    that they can share data as variables or alias definitions, you can do so by first
    using the New-Runspace cmdlet as demonstrated to set up the remote runspaces,
    followed by the Invoke-Expression cmdlet statements needed to run your commands.


    ```

    $r = New-Runspace -computer Svr1, Svr2

    Invoke-Expression -runspace $r -command $ps = "torrent"

    Invoke-Expression -runspace $r -command Get-Process $ps

    ```


    When working with persistent remote runspaces, it is important that you remember
    to delete any runspaces that you remotely created. Otherwise, they will continue
    to run and'
  merge: -1
