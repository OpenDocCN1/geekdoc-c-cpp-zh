    of active processes running on the computer. This list is then piped to the Where-Object
    cmdlet, which evaluates each process for one name named Winword. If found, information
    about the process is displayed.


    This type of evaluation is not limited to just the Get-Process cmdlet. It can
    be applied to the output of any cmdlet. For example, this next set of statements
    processes the output generated by the Get-ChildItem cmdlet, looking for a particular
    folder.


