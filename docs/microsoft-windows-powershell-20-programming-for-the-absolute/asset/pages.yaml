  md: '# Working with Regular Expression Characters


    Every character included as part of a regular expression will match itself. However,
    Windows PowerShell supports a collection of regular expression characters, also
    known as metachar-acters, that are an exception to this rule. A metacharacter
    is a character that alters the manner in which a pattern match is evaluated. For
    example, consider the following.


    ```

    "The winner of this year''s award is Mrs. Ford!" -match "Mr." (

    Write-Host "Match!"

    ```


    In this example, a regular expression has been set up to match against the characters
    Mr followed by an optional character, the character . is a metacharacter that
    is used to define a pattern that matches any one character. As a result, Mr.,
    and even Mr will all match the "Mr." pattern. If you really wanted to match the
    period as a period and not as a metacharacter, then you would need to precede
    it with a \ as demonstrated below.


    The . and \ used in the two previous examples are just two of a number of metacharacters
    supported by Windows PowerShell. Table 8.1 provides a list of regular expression
    characters.


    | Character | Description | Example |

    | --- | --- | --- |

    | [value] | Matches a single character | "Molly"\match "M...y" |

    | [range] | Matches at least one character specified inside brackets | "Molly"\match
    "M[ol]ly" |

    | [^] | Matches any character except those specified within brackets | "Randy"\match
    "R[^a-T]andy" |

    | ^ | Matches characters located at the beginning of a string | "William"\match
    "^gWil" |

    | $ | Matches characters located at the end of a string | "William"\match "iam$"
    |

    | * | Matches zero or more occurrences of the preceding character | "Daddy"\match
    "d*" |

    | ? | Matches zero or one occurrence of the preceding character | "Daddy"\match
    "d?" |

    | \ | Matches the character following the escape (\) | "Big"\match "Big$" |'
  merge: -1
  pgno: 277
