    # GETTING TO KNOW WINDOWS POWERSLL


    Most operating systems'' command shells consist of a small number of internal
    commands, which the shell runs internally when executed. Because the number of
    commands provided by traditional shells is limited, large numbers of utility programs
    (or external commands) are later developed to supplement built-in shell commands
    in order to provide functionality. These utility programs may or may not support
    a command syntax that is similar to that of its associated command shell. The
    end result is a command line and shell scripting environment that is difficult
    to learn due to syntax inconsistencies.'
