  md: "# Passing Arguments\n\nWindows PowerShell provides several different ways of\
    \ passing arguments to PowerShell scripts. One way is to specify parameters, representing\
    \ each argument in a comma-separated list, enclosed in parentheses, immediately\
    \ after the function name, as demonstrated by the following.\n\n```\nfunction\
    \ Add-Numbers ($x, $y) {\n  $z = $x + $y\n  Write-Host \"$x + $y = $z\"\n}\n```\n\
    \nIn this example, a function named Add-Numbers has been defined that accepts\
    \ two arguments, $x and $y, which then adds together. When this function is called\
    \ for execution somewhere within a PowerShell script, you must pass two arguments\
    \ that correspond to the two parameters required by the function. You pass these\
    \ arguments in much the same way that you pass data to cmdlets, as demonstrated\
    \ here:\n\nAdd-Numbers 3 4\n\nWhen executed, this statement calls on the Add-Numbers\
    \ function, passing it a value of 3 and 4. The function would then execute, displaying\
    \ the results shown here:\n\n3 + 4 = 7\n\nAnother option for setting up functions\
    \ to accept arguments is to use the param keyword to define each argument. When\
    \ used, the param keyword must be the first word specified inside the function's\
    \ code block. Arguments accepted by the function must be specified as parameters,\
    \ separated by commas, all of which are enclosed within parentheses, as demonstrated\
    \ by the following.\n\n```\nfunction Add-Numbers {\n  param ($x, $y)\n  $z = $x\
    \ + $y\n  Write-Host \"$x + $y = $z\"\n}\n```\n\nThis function can be called from\
    \ anywhere within the PowerShell file in which it is defined, as demonstrated\
    \ here:"
