    # WHAT''S NEW IN WINDOWS POWERSHELL 2.0


    Windows PowerShell 1.0 represented a giant leap forward in providing a full-featured
    and powerful command-line interface for Microsoft Windows. Windows PowerShell
    2.0 builds upon and expands the strengths of Windows PowerShell 1.0 by adding
    an set of improvements and new features, many of which are covered in this book.


    # Notable Windows PowerShell Changes


    Windows PowerShell 2.0 includes several new language keywords. These keywords
    include Data, Cmdlet, and DynamicParam. If you have any existing PowerShell scripts
    that variables or functions have these names, you will need to change the names
    assigned to those. Errors will occur when you try to run these scripts using Windows
    PowerShell 2.0. Windows PowerShell includes 129 cmdlets. The number of cmdlets
    included with Windows PowerShell 2.0 exceeds 180, providing all sorts of new capabilities.
    For example, one cmdlet that you will learn in Chapter 8 is the Out-GridView cmdlet,
    which lets you display the results produced by other PowerShell commands in an
    interactive table that you can search and sort. For example, Figure 1.7 shows
    an example of a table that lists active Windows processes that was generated using
    the Out-GridView.


    # New PowerShell Shell Features


    Windows PowerShell 2.0 provides all kinds of new features and capabilities, many
    of which are covered and demonstrated in this book. An abbreviated list of some
    of the more notable improvements that are introduced in Windows PowerShell 2.0
    are listed here:


    +   - Graphical PowerShell. A multi-tabbed shell and script editor supports syntax
    color-coding and line numbering as Intellisense and tab completion.

    - Graphical Help File. A Windows help file that allows you to search, view, and
    print Windows PowerShell help files.'
