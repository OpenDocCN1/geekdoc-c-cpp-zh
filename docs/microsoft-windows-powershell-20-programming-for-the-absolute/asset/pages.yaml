- img_proc: true
  md: '# Modifying Element Values


    You can modify the value of any element in an array by specifying its index number,
    as demonstrated by the following.


    ```

    $numbers = @(1, 2, 3, 4, 5)

    $numbers[2] = 9

    $numbers

    ```


    When executed, this example produces the following output:


    +   1

    2

    9

    4

    5


    As you can see, the value stored in the array''s third element, has been changed
    to 9. (Remember that array indexes begin at 0 and not 1.)


    # Keeping Track of Array Size


    Arrays also have a Count property that you can use to determine the number of
    elements in an array, as demonstrated here:


    ```

    $names = @("Alexander", "William", "Molly"

    $total = $names.Count

    $total

    ```


    When executed, $total is assigned a value of 3.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_164_0.png)


    Arrays also have a length property that you can use to retrieve the number of
    elements in an array, as demonstrated here:


    ```

    $names = @("Alexander", "William", "Molly"

    $total = $names.Length

    $total

    ```


    # Combining Arrays


    Windows PowerShell also allows you to combine two or more arrays to create a new
    array using the + operator, as demonstrated by the following.


    ```

    $lowNumbers = @(1, 2, 3)

    $highNumbers = @(4, 5, 6)

    ```'
