  md: '# GLOSSARY


    .NET Framework. A Microsoft developed framework designed to support the development
    of desktop, network, and Internet-based applications and scripts.


    .NET Framework Class Library. A hierarchical collection of classes that can be
    used to instantiate objects based on those classes.


    .ps1. The file extension used by Windows PowerShell scripts.


    $_. A special variable created and maintained by Windows PowerShell that is automatically
    assigned the name of the current object in the PowerShell pipeline and, in the
    case of the Where-Object cmdlet, is used to reference each object in a collection.


    Add-Content. A Windows PowerShell cmdlet that adds to the content of the specified
    item.


    Add-History. A Windows PowerShell cmdlet adds entries to the session history.


    Add-Member. A Windows PowerShell cmdlet adds a user-defined custom member to an
    object.'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'Add-Module. A Windows PowerShell 2.0 cmdlet that allows you to load a script
    or a DLL as a module.


    Add-PSSnapin. A Windows PowerShell cmdlet that adds one or more PSSnapIn(s) to
    the current PowerShell console.


    Add-Type. A Windows PowerShell 2.0 cmdlet that allows you to load a DLL or assembly
    instead of using the .NET Framework to access resources.


    Alias. A shortcut to another cmdlet.


    Argument. Data passed to a script or function for processing.


    Array. An indexed list of values.


    Associative Array. Sometimes referred to as hash or dictionary, which provides
    efficient access to data stored in key-value pairs.


    Background Jobs. (PSJob) The ability to execute cmdlets in the background, locally
    or on remote systems, without typing out the Windows PowerShell command prompt.


    Breakpoint. A marker that identifies a line, variable, or command at which Windows
    PowerShell script execution is paused to allow for debugging.


    Classes. Templates for creating objects that PowerShell can access and manipulate.


    Clear-Content. A Windows PowerShell 2.0 cmdlet that removes the content from an
    item or file leaving the file intact.


    Clear-History. A Windows PowerShell 2.0 cmdlet that clears the list of commands
    that have been executed during the current session.


    Clear-Item. A Windows PowerShell cmdlet that sets the item at the specified location
    to the "clear" value specified by the provider.


    Clear-ItemProperty. A Windows PowerShell cmdlet that removes the property value
    from a property.


    Clear-Variable. A Windows PowerShell cmdlet that removes a value from a variable.


    Cmd.exe. The predecessor to the Windows PowerShell command shell.


    Cmdlets. Predefined commands, representing .NET classes, which are designed to
    perform a specific task.


    Command Shell. A text-based interface that sits between the user and the operating
    system.'
