  md: '# Chapter 5 • Implementing Conditional Logic


    +   - if. This statement evaluates a comparison and then executes or skips the
    execution of statements located in an associated code block.


    +   - switch. This statement supports the execution of multiple comparison operations,
    each of which has the ability to execute statements embedded inside associated
