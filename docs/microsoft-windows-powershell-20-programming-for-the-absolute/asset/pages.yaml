    +   1. Click on Start, right-click on Computer, and then click on Manage.

    2. Select the Remove a feature option.

    3. Locate and select Windows PowerShell.


    # INSTALLING AND CONFIGURING WINDOWS POWERSLL


    In order to install Windows PowerShell your computer must meet the requirements
    outlined in this book''s introduction. As of the writing of this book, Windows
    PowerShell 1.0 and 2.0 were available as a free download provided by Microsoft
    and could be downloaded and installed from the Microsoft PowerShell website located
    at http://www.microsoft.com/technet/scriptcenter/topics/winsh/powershell2.mspx.


    Both versions of Windows PowerShell download as a self-extracting executable that
    you can install by double-clicking on it. If your computer is not already running
    version 2.0 of the .NET Framework, you must download and install it before you
    can run either version of Windows PowerShell. If you attempt to install Windows
    PowerShell without .NET 2'
