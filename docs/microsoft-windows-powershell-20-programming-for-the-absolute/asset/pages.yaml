  md: '# Executing Background Jobs


    One new Windows PowerShell feature introduced as part of Windows PowerShell 2.0
    is the ability to execute cmdlets, functions, and scripts as a background job
    (PSJob). Background jobs execute behind the scenes without any console interaction.
    Once started, Windows PowerShell immediately returns the Windows PowerShell command
    prompt, allowing you to keep working and productive while your background job
    is running.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_121_0.png)


    Windows PowerShell remoting relies on the Windows Remote Management (WinRM) service
    and the WS-Management protocol in order to execute. Instructions on how to configure
    remote access was provided in Chapter 1. In order to work, both your computer
    and the computer that you want to remotely with must have PowerShell 2.0 installed
    and must be configured to support Windows PowerShell remoting. In fact, remoting
    must be enabled when you only run background jobs locally on your own computer.
    You also need appropriate security permission to perform whatever commands you
    are attempting to execute on the remote computer.


    Windows PowerShell

    PS C:\Scripts> Get-Help Write-Host

    NAME

    Write-Host

    SYNOPSIS

    Writes text to the

    DESCRIPTION

    Write-Host [-Object [Object[]] -NoNewline -Separator [string] [-Color [Black |
    Red | Blue | Green | Cyan | Yellow | Magenta | White | Gray | DarkGray | DarkBlue
    | DarkGreen | DarkCyan | DarkRed | DarkMagenta | DarkYellow] [Gray | Red | Magenta
    | Yellow | White]] [CommonParameters]

    The Write-Host cmdlet creates a customized output window. You can see the text
    in that window using the ForegroundColor parameter and you can specify the background
    color of the window by using the BackgroundColor parameter Use a string to separate
    displayed objects. The particular result is the program that hosting Windows PowerShell.

    RELATED LINES

    Write-Verbose

    Write-Progress

    Write-Debug

    Write-Output

    Write-Warning

    Out-Host

    MARKS

    For more information, type: "get-help Write-Host -detailed"

    For technical information, type: "get-help Write-Host -full".

    PS C:\Scripts>>'
