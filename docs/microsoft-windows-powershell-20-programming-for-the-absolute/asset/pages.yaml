  md: 'Write-Debug. A Windows PowerShell cmdlet that creates debug messages.


    Write-Error. A Windows PowerShell cmdlet that creates an error object and passes
    it through the object pipeline.


    Write-Host. A Windows PowerShell cmdlet that displays object data.


    Write-Output. A Windows PowerShell cmdlet that adds an object to the object pipeline.


    Write-Progress. A Windows PowerShell cmdlet that sends progress records to the
    host.


    Write-Verbose. A Windows PowerShell cmdlet that writes a string to the host''s
    verbose display.


    Write-Warning. A Windows PowerShell cmdlet that writes warning messages.


    WS-Management protocol. A Simple Object Access Protocol (SOAP) that supports communication
    between different hardware and operating systems.


    XML. A markup language that facilitates the definition, storage, and transmission
    of data between applications.'
