  md: '# Chapter 8 • Working with Files and Folders


    If the file being written to already exists, its contents are replaced. To append
    to the end of a file, use the >> pipe operator, as demonstrated below.


    ```

    Get-ChildItem >> C:\TempDirectoryList.txt

    ```


    Alternatively, you can create a new file using the New-Item cmdlet. For example,
    the following statement will create a new empty file named TextFile.txt in the
    C:\Temp folder.


    ```

    New-Item C:\TempTestFile.txt -type file

    ```


    As you can see, the first argument passed to the cmdlet is the name and path of
    the resources to be created. The second argument passed to the cmdlet is the type
    of resource to create (e.g., a file). You can use the New-Item cmdlet to create
    a new folder just as easily as a new file, as demonstrated here:


    ```

    New-Item C:\MyNewFolder -type directory

    ```


    In this example, a new folder named MyNewFolder is created inside the C:\Temp
    folder. Also note that the second argument passed to the cmdlet specified the
    directory and not folder. Both terms are, of course, synonymous but PowerShell
    requires you to specify directory when creating new folders.


    If the file or folder you are attempting to create already exists, you will get
    an error message:


    ```

    New-Item : file ''C:\Temp\TestFile.txt'' already exists.

    At C:\MyScripts\ixxx.ps1:3 char:9

    + New-item <<<< C:\TempTestFile.txt -type file

    ```


    If you want, you can add the -force parameter to replace the file or folder with
    an empty file or folder, as demonstrated here:


    ```

    New-Item C:\TempTestFile.txt -type file -force

    ```


    # Writing to Text Files


    Windows PowerShell provides a number of additional ways to create files and write
    output to them. For example, you have already seen how to create and write new
    text files by redirecting pipeline data with the > operator. Windows PowerShell
    also lets you write text files using the Set-Content, Out-File, and Add-Content
    cmdlets.


    # Writing Text


    Using the Set-Content cmdlet, you can write a string to a text file, as demonstrated
    here:


    ```

    Set-Content C:\Temp\Temp.txt "Once upon a time..."

    ```'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'Here, the first argument passed to Set-Content is the name and path of the
    file to be created.

    The second argument is the string to be written to the text file. If a file of
    the same name already exists, the Set-Content cmdlet will automatically replace
    its content with the specified string.


    You can also use the Out-File cmdlet to send data from the object pipeline directly
    to a file\without seeing anything displayed in the Windows command console. For
    example, the following statement will redirect the output of the Get-Item cmdlet
    to a named file

    Temp.txt in C:\Temp.


    Get-ChildItem | Out-File C:\Temp\Temp.txt


    Like the Set-Content cmdlet, the Out-File cmdlet overwrites the contents of any
    like-named files.


    # Appending Text


    If you want to add to an existing file when writing to it, as opposed to replacing
    its contents, you can use the Add-Content cmdlet to append data to the end of
    a file, as demonstrated by the following example.


    Set-Content C:\Temp\Temp.txt "Once upon a time..."

    Add-Content C:\Temp\Temp.txt "And they lived happily ever after."

    Add-Content C:\Temp\Temp.txt "*The end"


    Here, a new file is created and written using the Set-Content cmdlet. Next, the
    Add-Content cmdlet is used to write additional text to the file.


    # Reformatting Cmdlet Output


    As you have learned, Windows PowerShell provides many ways of creating and writing
    data to text files. You have also seen examples of how to write pipeline object
    data directly into text files. In these examples, data was written using whatever
    format the last cmdlet applied to. However, Windows PowerShell makes it easy to
    customize cmdlet output using the Format-List and Format-Table cmdlets.


    # The Format-List Cmdlet


    The Format-List cmdlet processes object pipeline data and reformats it into a
    vertical list.

    Using the cmdlet''s -property parameter, you can control which object properties
    are displayed in order to create custom reports and output.


    For example, suppose you wanted to develop a PowerShell script that generated
    a report showing all of the files stored in the current working directory. To
    begin, you might start by adding the following statements to the script.'
  merge: -1
  pgno: 287
