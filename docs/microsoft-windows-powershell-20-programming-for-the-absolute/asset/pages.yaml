    # Working with Loops


    In order to effectively repeat a series of commands or to process large amounts
    of data, you need the ability to create loops. A loop is a set of programming
    statements that can be repeatedly executed as a unit. A loop allows you to write
    a few lines of code and execute them over and in order to perform a great deal
    of work. Loops help to reduce the number of code statements required to write
    a PowerShell script and, by centralizing a specific set of programming logic,
    help to make your scripts more manageable.


    Loops are a good tool for processing the contents of arrays and collections of
    data returned by cmdlets. As you have already seen, loops can also be set up to
    repeatedly prompt a user to supply valid input and repeatedly execute a collection
    of statements until a specific result is achieved. Windows PowerShell provides
    access to a number of different types of loops, including:'
