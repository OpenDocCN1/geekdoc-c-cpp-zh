    The Guess My Number game will be completed in 12 steps, as outlined here:


    +   1. Create a new script file and add opening comment statements.

    2. Define and initialize the game''s variables.

    3. Display the opening welcome screen.

    4. Set up a loop to control overall gameplay.

    5. Generate the game''s secret number.

    6. Set up a loop to collect and analyze player guesses.

    7. Collect the player''s input.

    8. Analyze player input.

    9. Display the game''s statistics.

    10. Prompt the player to play another game.

    11. Analyze the player''s answer.

    12. Clear the screen prior to terminating.


