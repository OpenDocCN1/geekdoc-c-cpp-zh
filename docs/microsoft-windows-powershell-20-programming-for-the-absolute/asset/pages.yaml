    # Deleting and Inserting Array Elements


    There is no direct way to insert an element into a particular location in an array.
    However, using the range operator and the + operator, you can work around this
    shortcoming, as demonstrated here:


    ```

    $numbers = @(1, 2, 3, 4, 5, 6, 7)

    $numbers = $numbers[0..2 + 4..6]

    $numbers

    ```


    In this example, the first statement defines an array named $numbers and assigns
    a range of values. The second statement reassigns the contents of the $numbers
    array by using the range operator and the + operator to generate a new list of
    elements consisting of the first and last three elements in the original array.
    When executed, this example produces the following output:


    +   1

    2

    3

    5

    6

    7


    There is no direct way to insert an element into the beginning or middle of an
    array either. However, by adapting the technique demonstrated above, you can insert
    a number at any given location within an array, as demonstrated here:


    ```

    $numbers = @(1, 2, 3, 4, 5, 6, 7)

    $numbers = $numbers[0..3] + 99 + $numbers[4..6]

    $numbers

    ```


    In this example, the number 99 is inserted into the middle of the array.'
