    # UNDERSTANDING POWERSLL ERRORS


    As you have doubted seen many times, Windows PowerShell scripts are subject to
    many different types of errors. For example, errors can occur if a script attempts
    to access a resource that is not available, or if you make a typo when keying
    in a script statement, or if you make a mistake in the logic used to make your
    script run. Each of these three types of errors fall into a distinct category
    of errors, as outlined in the following list.


    +   - Syntactical Error. An error occurring as a result of not following the syntax
    requirements of the PowerShell scripting language.

    - Runtime Error. An error that occurs when a script attempts to perform an illegal
    action such as the division of a number by zero.

    - Logical Error. An error that occurs when a script produces an unexpected result
    as the results of faulty programming logic and not as the result of a syntax or
    runtime error.


    Each of these types of errors is explored further in the sections that follow.


    # Syntax Errors


    Syntax errors occur when a script is initially loaded for execution. These types
    of errors occur when you make typos or if you fail to follow the syntax requirements
    of a command or cmdlet.'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'For example, a syntax error will occur if you create a script and forget to
    provide the required closing double quotation marks at the end of a Write-Host
    statement, as demonstrated here:


    Write-Host "once" upon a time there were little pigts.


    When executed, this statement will generate the following error, preventing the
    script from executing.


    Encountered end of line while processing a string token.


    ```

    At C:\Users\Jerry\Desktop\a.ps1:9 char:1

    ****

    ```


    Syntax errors prevent PowerShell scripts from compiling and running. As such,
    they are easy to identify and fix. For example, if you examine the error message
    that was generated by the previous statement, you will see that it explicitly
    identifies the location and the text of the statement that caused the error, making
    it easy to locate and fix.


    # Runtime Errors


    Unlike syntax errors, runtime errors are not caught and flagged when your PowerShell
    scripts are first started. Instead, they only occur when the statements that generate
    them are executed. Unless you test out all the functionality of your PowerShell
    scripts, it is easy to let runtime errors sneak by. As a result, you run the risk
    that other people with whom you share your scripts will find your errors.


    Some runtime errors are difficult if not impossible to avoid. For example, a computer''s
    network connection may go down or one of its hard drives may crash. Most runtime
    errors can be eliminated by carefully testing every aspect of your PowerShell
    scripts, including seldom-used functionality. Runtime errors can also be handled
    by taking care to incorporate logic within your scripts to prevent them from occurring.
    If your script accepts user input, you should add extra programming logic to validate
    the user''s input, rejecting any input that is not valid. Likewise, if you are
    developing a PowerShell script that is supposed to copy or move files, the time
    to add the logic required to first ensure that the files to be manipulated do,
    in fact, exist.


    Another way to locate and track down runtime errors is to test your PowerShell
    scripts under various conditions. For example, try to input invalid data to if
    your script handles correctly. If your script needs to access network resources,
    try disconnecting your computer''s network connection in the middle of your script''s
    execution. Proper testing is the key to the elimination of most runtime errors.


    As an example of a typical runtime error, take a look at this.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '```

    $x = 10

    $y = 0

    $z = $x / $y

    ```


    In this example, two variables have been declared and assigned values. Next, an
    attempt is made to divide one number by the other. The problem with this example
    is that it is illegal to divide any number by zero. As a result, when executed,
    this example will generate the following error.


    ```

    Attempted to divide by zero.

    At C:\Users\Jerry\Desktop\a.ps1:3 char:10

    + $z = $x / <<< $y

    ```


    Had the values of units $x and $y been provided by the user, instead of hardcoded,
    this problem could have been avoided by validating the user''s input and rejecting
    a value of zero for the denominator.


    # Logical Errors


    Unlike syntax and runtime errors, logical errors do not result in the display
    of error messages and are therefore often difficult to track down. Because logical
    errors represent a breakdown of the programming logic used to develop some part
    of a PowerShell script, the best way to deal with them is to prevent them from
    happening in the first place by carefully planning your script''s logic before
    you start writing it.


    An example of a logical error is an endless loop, where a loop is started without
    providing a way to break out of it. Another example of a logical error is when
    you enter in the wrong logic when trying to perform a task. For example, suppose
    you wanted to write a script that added two numbers together. In doing so, suppose
    you inadvertently keyed in the following statement.


    ```

    # The total number of units sold is calculated by adding $x and $y

    $z = $x - $y

    ```


    Obviously, the intention here was to add the values of $x and $y together. However,
    the value of $y will be subtracted from $x. As a result, if $x was set to 10 and
    $y was set to 5 and then the following statement was executed in the script, unexpected
    results would be displayed.


    ```

    Write-Host "Total number of units sold = $z"

    ```


    In this example, instead of $z equaling 15, it would be set equal to 5, as shown
    below.


    Total number of units sold = 5'
  merge: -1
