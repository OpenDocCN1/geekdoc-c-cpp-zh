  md: '# COMBINING PIPELINES AND OPERATORS


    In addition to comparing strings and numbers, you can compare object data against
    different values as it passes through the PowerShell object pipeline. This allows
    you to select the data that you want to continue sending through the pipeline,
    discarding the data you do not need to process. For example, using the eq operator,
    you can pull out the name of any currentlyexecuting processes, as demonstrated
    here:


    ```

    PS C:\Get-Process | Where-Object {$_.ProcessName -eq "Winword"}

