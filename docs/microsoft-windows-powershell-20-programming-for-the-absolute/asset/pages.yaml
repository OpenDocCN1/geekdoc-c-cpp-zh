    access to the Windows PowerShell Graphical Help file, which you can access from
    the Graphical Windows PowerShell Help menu.


    As shown in Figure 2.24, Windows PowerShell Graphical Help lets you browse and
    display a wide assortment of help topics. In addition to displaying a help file,
