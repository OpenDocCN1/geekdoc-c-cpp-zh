    # Saving Data in a Comma-Separated Value File


    One additional file format that Windows PowerShell can write to and read is CSV.
    CSV stands for comma-separated values CSV is a file format that is used to store
    comma-separated data as records separated by newlines and is commonly used by
    applications such as Microsoft Excel as a means of storing data in a format that
    can easily be moved between different applications.


    To save pipeline object data in a CSV file, you use the Export-Csv cmdlet, as
    demonstrated here:


    ```

    Get-Item | Export-Csv C:\Temp\Text.csv

    ```


    When executed, this statement will create a file output similar to that we have
    shown, ready it for other uses, or for input into another PowerShell script.


