    # IMPLEMENTING CONDITIONAL LOGIC


    Comparison operations are a critical feature of PowerShell scripting and are required
    in all the simplest PowerShell scripts. However, you will need to include comparisons
    as part of conditional statements. Windows PowerShell supports two different conditional
    logic statements, as outlined below.'
