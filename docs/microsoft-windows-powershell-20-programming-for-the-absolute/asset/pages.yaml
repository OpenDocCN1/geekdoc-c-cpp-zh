  md: '# Chapter 3 • Object-Based Scripting with .NET


    The Stop-PSJob cmdlet only halts PSJob execution; it does not remove them. To
    do that you need to execute the Remove-PSJob cmdlet, discussed in the next section.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_128_0.png)


    In addition to stopping a background job using its session ID, you can also stop
    background jobs using their session state, as demonstrated here:


    ```

    Stop-PSJob -state running

    ```


    Here, all background jobs with a state of running are halted.


    # Deleting a Background Job


    Windows PowerShell maintains information about every PSJob executed in your current
    working session and keeps this information in cache until you close the console
    session in which you are working or explicitly delete the background jobs. Using
    the Remove-PSJob cmdlet, you can delete a background job and its output. For example,
    suppose you had executed three background jobs, as shown here:


    ```

    PS C:\> Get-PSJob

    ```


    | SessionId | Name | State | HasMoreData | Command |

    |---|---||-|----||

    | 1 | | Completed | False | start-sleep 30 |

    | 3 | | Completed | True | get-process |

    | 5 | | Completed | False | get-process |


    ```

    PS C:\>

    ```


    You can use the Remove-PSJob cmdlet to remove the background job with a session
    ID of 5 by executing the following statement:


    ```

    PS C:\> Remove-PSJob 5

    ```


    By executing the Get-PSJob cmdlet as shown next, you can verify that the specified
    background-job has indeed been deleted.


    ```

    PS C:\> Get-PSJob

    ```


    | SessionId | Name | State | HasMoreData | Command |

    |---|---||-|----||

    | 1 | | Completed | False | start-sleep 30 |

    | 3 | | Completed | True | get-process |


    ```

    PS C:\>

    ```'
