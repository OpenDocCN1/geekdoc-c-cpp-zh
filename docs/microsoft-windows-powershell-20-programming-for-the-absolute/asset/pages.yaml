    The development of this script will be completed in six steps, as outlined here:


    +   1. Create a new script and add opening comment statements.

    2. Clear the screen and initialize script variables.

    3. Display the opening welcome screen.

    4. Display the rules for formulating questions.

    5. Prompt the player to ask questions and then generate answers.

    6. Invite the player to play again and terminate script execution.


    # Creating a New PowerShell Script


    The first step in the creation of the PowerShell Fortune Teller game is to create
    a new PowerShell script named FortuneTeller.ps1 and add the following statements
    to it:


    ```

    ********************************************************************************

    # Script Name: FortuneTeller.ps1 (PowerShell Fortune Teller)

    # Version: 2.0

    # Author: Jerry Lee Ford, Jr.

    # Date: October 4, 2008

    #

    # Description: This PowerShell script provides random answers to player

    questions.

    #

    ********************************************************************************

    ```


    ```

    #Clear the Windows command console

    Clear-Host

    ```


    As you can see, so far the PowerShell script file consists of comment statements
    that provide high-level script documentation and execute the Clear-Host cmdlet,
    which is called to clear the display area of the Windows command console.


    # Declaring and Initializing Variables


    The next step in the creation of the PowerShell Fortune Teller game is to declare
    variables used throughout the script and assign initial values to these variables.
    This is accomplished by appending the statements to the end of the PowerShell
    script file.


    ```

    #Define the variables used in this script to collect player input

    $question = "" #This variable will store the player''s question

    $status = "Play" #This variable will be used to control game termination

    ```'
