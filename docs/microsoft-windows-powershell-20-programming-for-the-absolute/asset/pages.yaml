    Note that this template consists of a series of comment lines. Comments are text
    embedded within script files that help to document the scripts, but which are
    otherwise ignored when the script is executed. In Windows PowerShell, the # character
    serves as a comment indicator. Anything that follows a # character in a script
    is considered a comment. Comments can be placed on their own line or placed at
    the end of a script statement.


    Before writing the first line of code, it is important to spend a little time
    planning out the script''s overall design. The Story of the Three Amigos will
    begin by displaying a title page. Next, the user is informed that her participation
    is required to tell the story and four questions are presented. Each answer that
    is provided must be saved. The text that makes up the story must be laid out.
    In addition, the variables containing the script''s answers must be strategically
    placed at specific locations within the story text. Lastly, closing credits and
    copyright information should be displayed.


    As you can see, the overall logical flow of The Story of the Three Amigos is fairly
    simple. To set it up, we will complete its development in eight steps.


    +   1. Create a new script using the PowerShell template and add opening statements.

    2. Declare variables used throughout the script file.

    3. Display the introduction screen.

    4. Display game instructions.

    5. Collect first player input.

    6. Collect additional player input.

    7. Display the opening portion of the story.

    8. Display the rest of the story.


