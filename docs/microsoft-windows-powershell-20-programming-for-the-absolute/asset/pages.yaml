    Here, a function Get-FileNames has been defined. The function uses the $input
    variable to collect any data passed to the function via the object pipeline. This
    data is then passed down the pipeline to the Where-Object cmdlet. The Where-Object
    cmdlet then filters out any object reference to a folder named Windows. Any remaining
    object data is then passed to the Sort-Object cmdlet.


    Before running the above example, you need to change the current working directory
    to the root of your C: drive where the Windows folder resides, using the Set-Location
