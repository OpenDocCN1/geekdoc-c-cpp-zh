    # Modifying Command Console Font Attributes


    The second property sheet on the Properties window is the Font tab, as shown in
    Figure 2.11. From here, you can modify the font size and font type used by the
    Windows command console.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_66_1.png)


