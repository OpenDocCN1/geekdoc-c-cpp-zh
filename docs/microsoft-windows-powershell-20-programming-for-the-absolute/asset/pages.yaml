    Set-Acl. A Windows PowerShell cmdlet that accesses Control List properties.


    Set-Alias. A Windows PowerShell cmdlet that maps an alias to a cmdlet.


    Set-AuthenticodeSignature. A Windows PowerShell cmdlet that places an authenticode
    signature in a PowerShell script.


    Set-Content. A Windows PowerShell cmdlet that sets the content in the item.


    Set-Date. A Windows PowerShell cmdlet that sets the system time.


    Set-ExecutionPolicy. A Windows PowerShell cmdlet that establishes execution policy.


    Set-Item. A Windows PowerShell cmdlet that sets the value of a pathname within
    a provider to a specified value.


    Set-ItemProperty. A Windows PowerShell cmdlet that sets a property to a specified
    value.


    Set-Location. A Windows PowerShell cmdlet that sets the current working location.


    Set-PSBreakpoint. A Windows PowerShell 2.0 cmdlet that creates a new breakpoint.


    Set-PSDebug. A Windows PowerShell cmdlet that turns on PowerShell''s script debugging
    features.


    Set-Service. A Windows PowerShell cmdlet that makes changes to service properties.


    Set-StrictMode. A Windows PowerShell 2.0 cmdlet that configures and enables strict
    mode for the current scope.


    Set-TraceSource. A Windows PowerShell cmdlet that modifies and trace listeners
    from the specified trace instance.


    Set-Variable. A Windows PowerShell cmdlet that assigns a value to a variable or
    creates a variable if it does not exist.


    Set-WmiInstance. A Windows PowerShell 2.0 cmdlet that creates or changes a WMI
    class instance.


    Sort-Object. A Windows PowerShell cmdlet that sorts the input objects based on
    property values.'
