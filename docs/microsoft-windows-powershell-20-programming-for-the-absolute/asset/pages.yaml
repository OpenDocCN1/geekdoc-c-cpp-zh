    # Using while Loops


    The while loop is designed to create a loop that runs as long as, or while, its
    conditional remains true. The while loop has the following syntax.


    ```

    while (condition)

    (code block)

    ```


    condition is an expression, which is evaluated each time the loop is run. If the
    value of condition evaluates to true, the loop is run. Otherwise, its execution
    terminates. In order to prevent an endless loop, it is important that you include
    the programming logic required to terminate the loop.


    The following example demonstrates how to set up a while loop.


    ```

    $i = 1


    while ($i -le 10)

    Write-Host $i

    $i++


    ```


    Here, a variable named $i is defined and assigned an initial value of 1. Next,
    a while loop defined that executes as long as, or while, the value of $i remains
    less than 10.


