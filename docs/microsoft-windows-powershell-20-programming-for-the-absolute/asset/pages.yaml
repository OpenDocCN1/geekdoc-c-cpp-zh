  md: '# WORKING WITH GRAPHICAL WINDOWS POWERSHELL


    A new Windows PowerShell feature introduced as part of version 2.0 is the Graphical
    Windows PowerShell. The Graphical Windows PowerShell is a new scripting and development
    environment that provides the ability to edit Windows PowerShell scripts and to
    work with the Windows PowerShell command prompt within a single application window.


    The Graphical Windows PowerShell is automatically installed as part of the Windows
    PowerShell 2.0. It provides a number of editing features that make it a far better
    code editor than Notepad. These features include:


    +   * Statement Color Coding

    * Line Numbering

    * IntelliSense and Tab Completion

    * Automatic Document Indentation


    In order to use the Graphical Windows PowerShell version 3.0, you must have Windows
    PowerShell 2.0 installed as well as the .NET Framework version. To start the Graphical
    Windows PowerShell, click on Start > Windows PowerShell V2 > Graphical Windows
    PowerShell. Alternatively, you can start it by typing PowerShell and pressing
    Enter from any Windows PowerShell console or by clicking on Start and typing PowerShell
    in the text search field located at the bottom of the Start Menu and pressing
    the Enter key, as shown in Figure 2.16.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_77_0.png)


    When first started, Graphical Windows PowerShell displays two panes, as shown
    in Figure 2.17. The upper pane is used to display Windows PowerShell output, and
    the lower pane provides access to the Windows PowerShell command prompt.


    Along the top of the Graphical Windows PowerShell is a menu bar, which provides
    access to application commands. The File menu provides access to commands to create,
    open, save, print, and run scripts. The Edit menu provides access to commands
    that allow you to copy, cut, paste, redo, and undo. In addition, the Edit menu
    provides access to commands that allow you to perform find and replace operations.
    The View menu allows you to jump to any of the three panes ultraspaces, and the
    Runspace menu lets you set up and manage as many unique execution environments
    as you need. Lastly, the Help menu provides access to the Windows PowerShell Graphical'
