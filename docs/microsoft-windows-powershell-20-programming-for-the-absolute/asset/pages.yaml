    By default, Windows PowerShell 2.0 remoting requires execution on a Windows domain.
    It can be configured to work within a workgroup by making registry modifications.
    To learn more about this option, refer to Windows PowerShell 2.0''s release notes.


    # Creating Your Own SCRIPT CMDLETS


    Windows PowerShell is a highly extensible development tool. In Windows PowerShell
    1.0, software developers are able to develop custom cmdlets using .NET programming
    languages like Visual Basic, C++, and C#. However, Windows PowerShell 2.0 makes
    things even easier by allowing you to create script cmdlets using Windows PowerShell
    scripts.


    Script cmdlets developed using Windows PowerShell 2.0 are saved as regular script
    files with a .ps1 extension. Windows PowerShell 2.0 supports the development of
    two types of cmdlets, named and unnamed. Named cmdlets have a Verb-Noun name and
    look behave very much like typical PowerShell cmdlets and will be the focus of
    discussion in this chapter.


    Unnamed cmdlets are not assigned a name and execute differently from regular cmdlets.
    To learn more about unnamed cmdlets, execute the command Get-Help AboutScriptCmdlets
    at the Windows PowerShell 2.0 command prompt.


    When creating a named cmdlet, you create a new Windows PowerShell script and assign
    it a Verb-Noun name. This script will use the following structure:


    ```

    Cmdlet Verb-Noun (


    ```


    ```

    Param (


    ```


    ```

    Begin (


    ```


    ```

    Process (


    ```'
