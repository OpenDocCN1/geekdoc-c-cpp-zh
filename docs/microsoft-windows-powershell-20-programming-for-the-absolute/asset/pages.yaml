    # BACK TO THE POWERSHELL TIC-TAC-TOE GAME


    Okay, it''s time to turn your attention back to the chapter''s main game project,
    the PowerShell Tic-Tac-Toe game. The development of this game will demonstrate
    how to create a script that can interact with the player by displaying messages,
    retrieving command line input, and applying programming logic to control the operation
    of the script.


    # Designing the Game


    This game requires two players, Player X and Player O. Player X always starts
    off each game. The game validates player moves and keeps track of whose turn it
    is. The game displays a text-graphic view of the Tic-Tac-Toe game board, which
    updates after each player''s turn. The game ends when one player lines up three
    board squares in a row (horizontally, vertically, or diagonally), or when all
    board squares have been selected without either player being able to pull out
    a win.


    The overall logical flow of the PowerShell script is fairly simple. To set it
    up, we will complete its development in 17 steps, as outlined here:


    +   1. Create a new script file and adding comment statements.

    2. Define and initialize script variables.

    3. Develop the Clear-Board function.

    4. Develop the Get-Permission function.

    5. Develop the Display-Board function.

    6. Develop the Validate-Move function.

    7. Develop the Check-Results function.

    8. Develop the Display-Results function.

    9. Ready the game for play.

    10. Create a loop to control overall execution of the script.

    11. Create a loop to control individual games.

    12. Collect player moves.

    13. Validate player moves.

    14. Look for a winner.

    15. Look for a tie.

    16. Switch player turns.

    17. Prompt players to start a new game.'
  merge: -1
  pgno: 305
