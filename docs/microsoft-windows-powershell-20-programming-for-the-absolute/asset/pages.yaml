  md: '# WHAT NEXT?


    As you no doubt have concluded after reading this book, Microsoft PowerShell provides
    a robust, powerful scripting environment that goes well beyond traditional shell
    scripting. Windows PowerShell provides an entirely new programming language designed
    from the ground up to integrate with and leverage the capabilities provided by
    the .NET Framework. As this book has demonstrated, Microsoft PowerShell is a great
    programming language for first-time programmers and computer hobbyists. Yet, it
    is also powerful enough to satisfy the needs of professional programmers.


    While you have already learned a great deal about how to program using Windows
    PowerShell scripting, there is still a lot more to be learned. Therefore, rather
    than viewing this book as the end of your PowerShell scripting education, you
    should view it as the beginning. To become a truly effective Microsoft PowerShell
    programmer, you must continue to read and learn as much as possible. To help you
    get started, I have provided this appendix, where you will find an assortment
    of useful Windows PowerShell information. It includes information about PowerShell
    IDEs, assorted PowerShell reading materials, websites, mailing lists, and blogs.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# WINDOWS POWERSHELL IDEs


    As I was updating the second edition of this book, there were two third-party
    Windows PowerShell IDEs available for use. These PowerShell IDEs provide an alternative
    to working with Notepad or the Graphical Windows PowerShell.


    > Definition An IDE or integrated development environment is a graphical software
    development tool that integrates a source editor with other application development
    tools to aid in the creation of scripts or applications.


    The first PowerShell IDE is PowerShellPlus, which at the time I was working on
    this book was available for $145 at http://www.powershell.com/. PowerShellPlus
    provides a long list of features, including:


    +   * Statement code coloring

    * Direct command-line access

    * Debugging features including support for breakpoints

    * Context aware code completion

    * Variable and property values


    Figure B.1 shows an example of PowerShellPlus’s built-in Script Editor.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_403_0.png)


    Figure B.1

    The PowerShellPlus manages the display of script code, output, and variable and
    property values.'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'The other PowerShell IDE is PowerShell Analyzer, which is available as a free
    download at http://www.powershellanalyzer.com. PowerShell Analyzer comes with
    lots of bells and whistles that are designed to help you work faster and smarter
    when interacting with Windows PowerShell and developing scripts. A sampling of
    PowerShell Analyzer features includes:


    +   - Statement color coding

    - Direct command-line access

    - Automatic display of keyword syntax

    - Variable and property views


    Figure B.2 shows an example of PowerShell Analyzer in action.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_404_0.png)


    FIGURE B.2

    The PowerShell Analyzer provides easy access to tools that help simplify and speed
    up script development.


    # RECOMMENDED READING


    Microsoft provides its own PowerShell documentation in the form of a Getting Started
    guide and a user guide. While first-time programmers and individuals new to PowerShell
    scripting may find these guides challenging, they will serve as an excellent next
    step for you who have finished reading this book. Information on both of these
    guides is provided below.


    Getting Started Guide for the Windows PowerShell


    by Microsoft Corporation'
  merge: -1
