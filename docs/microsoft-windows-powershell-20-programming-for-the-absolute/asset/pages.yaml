    # Assigning Variable Values Using Expressions


    You can also assign variable values using expressions. Here, the value of 1 +
    4 (e.g., 5) is assigned to a variable named $x.


    ```

    $x = 1 + 4 # $x equals 5

    ```


    In addition to the + operator, Windows PowerShell supports a wide range of arithmetic
    operators, as shown in Table 4.3.


    | Operator | Description |

    |---|---|

    | + | Adds two numbers together |

    | - | Subtracts one number from another |

    | * | Multiplies two numbers together |

    | / | Divides one number from another |

    | % | Retrieves the remainder of a division operation (modulus) |


    # Precedence


    In Windows PowerShell scripting, like any other programming language, mathematic
    operations are executed according to a specific order of precedence, which occurs
    on a left to right basis. Specifically the unary operator, which negates a number,
    is evaluated first. Next, PowerShell performs multiplication and division and
    then remaindering. Finally, addition and subtraction is performed. For example,
    consider the following expression.'
