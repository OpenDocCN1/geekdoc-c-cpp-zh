    This example requires 24 lines of code. While certainly intuitive and easy to
    understand, using the Write-Host cmdlet in this manner consumes a lot of space
    and bloats your PowerShell script code. An alternative way to exercise detailed
    control over your text string output is to take advantage of PowerShell''s escape
    characters.


    An escape character is a character that has special meaning to Windows PowerShell.
    Escape characters are identified by the ` character (typically located just over
    the Tab key on keyboards). Using escape characters you can insert tabs and newline
    fields at any point within a text string to create an immediate newline operation,
    without breaking the display of the string into two lines. Likewise, you can insert
    a `t within a text string to insert a logical tab. Using just these two escape
    characters, you could rework the previous example as demonstrated here:


    ```

    Write-Host "`n`n`n`t`t`tWELCOME TO THE WINDOWS"

    Write-Host "`n`n`n`t POWERSHELL FORTUNE TELLER"

    Write-Host "`n`n`n`t`t`t BY Jerry Lee Ford, Jr.

    Write-Host "`n`n`n`n`n`n`n`t Press Enter to continue."

    ```


    Believe it or not, this example provides for the exact same output in just four
    statements. The previous example was produced by 24 statements. Windows PowerShell
    supports different escape characters, as outlined in Table 4.2.


    | Table 4.2 WINDOWS POWERSHELL ESCAPE CHARACTERS |

    | Escape Character | Description |

    |---|---|

    | ` | Single quote |

    | 0 | Double quote |

    | a | Null |

    | b | Alert |

    | f | Backspace |

    | n | Form feed |

    | r | Newline |

    | t | Carriage return |

    | v | Horizontal tab |

    | | Vertical tab |'
