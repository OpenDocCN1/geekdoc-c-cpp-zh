    You can learn more about the .NET Framework by visiting www.microsoft.com/net.


    # EXECUTING CMDLETS


    Cmdlets are a key Windows PowerShell resource that provides access to .NET Framework
    resources. Windows PowerShell provides access to a host of commands, each of which
    is designed to perform a singular task. Individually, cmdlets provide access to
    specific resources and commands. However, the real power provided by cmdlets comes
    when they are used together as building blocks to formulate complex tasks.


    You will learn more about how Windows PowerShell lets you combine cmdlets into
    complex statements in the next section. However, in order to work with the Windows
    PowerShell and to write PowerShell scripts, it helps to know a little about each
    of the cmdlets that PowerShell makes available to you. To help you out, I have
    provided a complete list of PowerShell cmdlets in Table 3.1, along with a brief
    explanation of what each cmdlet does and what version of Windows PowerShell supports
    them.'
