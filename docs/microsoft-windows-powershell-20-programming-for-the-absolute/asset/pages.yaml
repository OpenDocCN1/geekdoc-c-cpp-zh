    # Designing the Game


    It is always a good idea to spend a little time planning out the design and organization

    of your PowerShell scripts before you begin writing them. This will help reduce
    errors and

    decrease the amount of time it takes to get the job done. As you saw earlier in
    this chapter,

    the script begins by clearing the screen and prompting the player to answer two
    ques-

    tions correctly before displaying the punch line for the first joke. Two additional
    jokes

    then told in succession. The game ends after displaying a little information about
    itself and

    its author.


    As you can see, the series of steps required to tell a joke is not terribly complicated.
    To develop

    the PowerShell script, we will assemble it in eight steps, as outlined here:


    +   1. Create a new script file and add an initial statement that clears the screen.

    2. Display the first line of the first joke and wait for the player to respond.

    3. Display the second line of the first joke and wait for the player to respond
    again.

    4. Displays the first joke''s punch line.

    5. Pause script execution to give the player a chance to enjoy the joke.

    6. Tell the script''s second joke.

    7. Tell the script''s third joke.

    8. Display closing script and author information.


    # Creating a New PowerShell Script


    Begin by opening your preferred text or script editor and saving a new script
    file named

    KnockKnock.ps1. Next, add the following statement as the first line in the script
    file.


    Clear-Host.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_50_0.png)


    ps1 is PowerShell''s standard file extension. You will be using it for all the
    text

    PowerShell game scripts you create in this book.


    Clear-Host is a Windows PowerShell cmdlet. When executed, it clears out any text
    currently

    displayed in the Windows command console, preparing it for the display of new
    text.'
