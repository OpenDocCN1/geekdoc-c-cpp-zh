  md: '# CHAPTER USING LOOPS TO PROCESS DATA


    As you have certainly noticed already in previous chapters, loops are an essential
    element in most scripts, allowing you to develop programming logic that repeats
    a series of statements over and over again using a minimal amount of code. Without
    loops, it would be all but impossible to develop Windows PowerShell scripts that
    are designed to process large amounts of data. Loops also provide a mechanism
    for processing collections of data passed through the object pipeline or stored
    in arrays. Windows PowerShell provides the ability to set up many different types
    of loops and also offers commands for breaking out of loops when necessary. This
    chapter will not only teach you how to implement loops but also guide you through
    the creation of your next PowerShell script, the Rock, Paper, Scissors game.


    Specifically, you will learn:


    +   * How to set up while and until loops

    * How to set up for and foreach loops

    * How to create while loops

    * How to use the Continue and Break keywords to alter loop execution'
