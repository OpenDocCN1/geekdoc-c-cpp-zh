    # WINDOWS POWERSHELL OPERATORS


    So far, you have seen the equals (-eq) operator used extensively in this chapter
    as a means of comparing different values. Windows PowerShell provides a host of
    additional operators that provide the ability to test relationships between values
    and to reverse the logic of comparison operators.


    # Comparison Operators


    Windows PowerShell supports a number of additional comparison operators in addition
    to the -eq operator, allowing you to perform comparisons that test different values
    in different ways. For example, you can also compare whether a value is greater
    than or less than another value. Table 5.1 lists Windows PowerShell comparison
    operators.


    | Table 5.1 | WINDOWS POWERSHELL COMPARISON OPERATORS |

    |---|---|

    | Operator | Description |

    | -eq | Equal to |

    | -lt | Less than |

    | -gt | Greater than |

    | -ge | Greater than or equal to |

    | -le | Less than or equal to |

    | -ne | Not equal to |'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'Unlike arithmetic operators, Windows PowerShell does not process comparison
    operators according to a predefined order or precedence. Instead, each comparison
    operation is performed in the order in which you define it, starting from left
    to right. You will see several examples of these operators in action a little
    later when you work on the Guess My Number game.


    # Logical Operators


    Windows PowerShell provides a small set of logical operators that provide the
    ability to modify the logical evaluation of a comparison. Table 5.2 lists PowerShell
    logical operators.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_194_0.png)


    | Operator | Description |

    | --- | --- |

    | -not | Not |

    | ! | Not |

    | -and | and |

    | -or | or |


    The -not and ! operator can be used to reverse the logic of any comparison operation,
    as demonstrated here:


    ```

    $x = 1

    $y = 2

    if (-not ($x -eq $y)) (Write-Host ''The value of $X does not equal $y.'')

    if (! ($x -eq $y)) (Write-Host ''The value of $X does not equal $y.'')

    ```


    As you can see, by using the -not or ! operator, you must place it just before
    the expression or value to be tested. When executed, these operators reverse the
    logic of a comparison operation.


    > TRAP Take note of the location and placement of the parentheses in the previous
    examples. The inclusion of the -not and ! operators require that you add an additional
    set of parentheses in order to meet the syntax requirement of the if statement,
    which requires that whatever is being tested be enclosed inside parentheses.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'The and operator, on the other hand, is used to create a comparison operation
    that checks

    to see whether two different expressions or values both evaluate to true, as demonstrated
    by

    the following.


    ```

    $x = 1

    $y = 2

    if (\$x -eq 1) -and ($y -eq 2)) (Write-Host ''The variables equal the expected

    values.\'')

    ```


    In this example, the statement inside the if statement''s code block is executed
    only if both

    expressions being tested by the if statement evaluate to true. Since both of the
    expressions

    evaluated in the previous example evaluate as true, the statement located inside
    the

    if statement''s code block is executed.


    To help up the logical processing of the and operator, PowerShell implements

    a process short-circuiting, whereby the second expression is evaluated only in
    the event

    the first expression proves to be false, there is no point to

    evaluating the second expression, since the end result of the and logical comparison
    will

    result in a value of false regardless of the result of the value of the second
    expression.


    The or operator is also short-circuited. This operator checks to see whether either
    of two

    different expressions or values evaluates to true, as demonstrated here:


    ```

    $x = 1

    $y = 2

    if (\$x -eq 1) -or ($y -eq 3)) (Write-Host ''At least one value matched'')

    ```


    In the previous example, the first expression evaluates as true and the second
    expression

    evaluates as false. As long as one of the tested expressions evaluates as true,
    the statement

    located inside the if statement''s code block is executed.


    # String Comparison Operators


    While you can certainly use the first six comparison operators listed in Table
    5.1 to compare

    strings, the result is a case-insensitive comparison. As a result, PowerShell
    will evaluate strings

    such as "abc" and "ABC" as being equal, though that may not be your intention.
    If string

    case is important in your comparison operators, you can instead use any of the
    case-sensitive

    comparison operators listed in Table 5.3.


    As you can see, Table 5.3 contains two different categories of operators, those
    that perform

    case-sensitive comparison and those that do not. As an example of the difference
    between

    twe these categories of string comparison operators, consider the following example.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Table 5.3 WINDOWS POWERSHELL STRING COMPARISON OPERATORS


    | Operator | Description | Case-Sensitive |

    |---|---|---|

    | -ieq | Equal to | No |

    | -ilt | Less than | No |

    | -igt | Greater than | No |

    | -ige | Greater or equal to | No |

    | -ile | Less than or equal to | No |

    | -ine | Not equal | No |

    | -ceq | Equal to | Yes |

    | -clt | Less than | Yes |

    | -cgt | Greater than | Yes |

    | -cge | Greater or equal to | Yes |

    | -cle | Less than or equal to | Yes |

    | -cne | Not equal | Yes |


    ```

    $x = "abc"

    $y = "ABC"

    if ($x -ieq $y) (Write-Host ''A case-insensitive match has occurred!'')

    if ($x -ceq $y) (Write-Host ''A case-sensitive match has occurred!'')

    ```


    In this example, the first if statement performs a case-insensitive comparison,
    which results in an evaluation of true. However, the second if statement performs
    a case-sensitive comparison, which results in a value of false.


    # BACK TO THE GUESS MY NUMBER GAME


    Okay, let''s turn your attention back to the character''s main game project, the
    Guess My Number game. Through the development of this game, you will get ample
    opportunity to focus on the use of conditional logic in order to control the logical
    execution of PowerShell scripts.


    # Designing the Game


    The Guess My Number game begins by displaying the game''s welcome screen and then
    prompts the player to guess the game''s randomly generated number, which is in
    the range of 1 to 100. Each guess made by the player is evaluated to see if it
    is too high, too low, or if the player has guessed the number. The game displays
    hints to guide the player''s next guess when the player''s previous guess is too
    high or too low. Game statistics are displayed after the player guesses the game''s
    secret number and then the player is invited to play another round.'
