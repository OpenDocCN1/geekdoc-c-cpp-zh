    | -ar-s | 3/3/2007 7:26 AM | 8192 BOOTSECT.BAK |

    | -a-- | 3/3/2007 7:40 AM | 396 RHSetup.log |


    In this example, the Where-Object cmdlet, which removes objects failing to meet
    a specified criteria from the pipeline, is an expression enclosed within matching
    { brackets }. This expression takes each object passed through the pipelines,
    represented by $_ and examines the value of each object Length property to see
    if it is greater than 200. The use of . to connect the $_ to the keyword Length.
    This is an example of dot notation, which is the syntax you must follow when identifying
    an object property.


    Again, don''t get too hung up on the syntax in the previous example to build the
    expression passed as an argument to the Where-Object cmdlet. You will learn everything
    you need to know about PowerShell statement syntax in Chapters 4 through 7. For
    now, the important thing to take away from this example is an understanding of
    pipelines and their use in passing structures between cmdlets in order to build
    complex logical statements.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_131_0.png)


    The Where-Object cmdlet provides the ability to filter out unwanted objects from
    the pipelines passed to it as an argument. In the previous example, the Where-Object
    was instructed to remove any object whose Length property was less than 200 bytes.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_131_1.png)


    $_ is a special variable created and maintained by Windows PowerShell. $_ is automatically
    assigned the name of the current object in the PowerShell pipeline and in the
    case of the Where-Object cmdlet, to reference each object in a collection. In
    the previous example, the collection was composed of every file in the current
    working directory.'
