    use this information to verify a computer network configuration or to troubleshoot
    connectivity problems. For example, to retrieve a list of all active network protocols,
    you would pass Win32_NetworkProtocol as an argument to the Get-WmiObject cmdlet
    as shown here:


    ```

    Get-WmiObject Win32_NetworkProtocol

    ```'
