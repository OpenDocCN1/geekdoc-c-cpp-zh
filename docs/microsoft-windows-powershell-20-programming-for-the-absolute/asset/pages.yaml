  md: '# CHAPTER

    BASIC SYSTEM ADMINISTRATION


    The purpose of this chapter is to provide you with working examples of the kinds
    of system tasks that you can perform with Windows PowerShell scripts, as well
    as to give you an appreciation for the types of information that Windows PowerShell
    puts at your fingertips. You will learn how to programmatically interact with
    the Windows registry and use it as a repository for script configuration settings.
    You will learn how to automate the management and reporting of different Windows
    resources, including Windows processes and services. This chapter will also teach
    you how to create and instantiate new objects using .NET classes and COM objects,
    which will open up a whole new world of programming capabilities. On top of all
    this, you will learn how to create a new PowerShell game, PowerShell Blackjack.


    Specifically, you will learn how to:


    +   - Create registry keys and values and retrieve data stored in registry values

    - Instantiate new objects based on .NET classes and COM objects

    - Retrieve information about local and remote computers using WMI

    - Administer Windows services, processes, and logs'
