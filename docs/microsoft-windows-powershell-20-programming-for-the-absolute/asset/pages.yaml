  md: '# Creating Additional Runspaces


    In addition to all of the features already demonstrated, the Graphical Windows
    PowerShell allows you to work with more than one Windows PowerShell environment
    at a time, running each one in its own runspace. You can open additional runspaces
    by clicking on the New Run space command located on the Runspace window. Whenever
    you work with more than one runspace at a time, the graphical Windows PowerShell
    displays tabs among the left-hand side of the script pane for each open runspace.
    The tab for the currently selected runspace is highlighted in orange, as demonstrated
    in Figure 2.22.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_82_0.png)


    > FIGURE 2.22

    By clicking on the tabs on the right-hand side of the window, you can switch between
    different runspaces.


    Because each runspace displayed in the Graphical Windows PowerShell window represents
    a working environment, you can open and work with more than one script at a time
    within any given runspace. When you do this, a tab located at the top of the current
    runspace is displayed for each open script, as demonstrated in Figure 2.23.


    Using the Graphical Windows PowerShell editing commands, you can easily copy and
    paste code statements between scripts. Even better, you can use the prompt pane
    to develop and test commands and statements to make sure they do what you want
    before copying and pasting them into your script files.'
