  md: '# CHAPTER DEBUGGING POWERSHELL SCRIPTS


    If there is one inevitability in programming, it is that errors can and will occur.
    No matter how long you have been programming or how good you may be, errors are
    going to happen. Windows PowerShell scripting is no exception. Fortunately, as
    you will learn in this chapter, there are many tools at your disposal that you
    can use to track down, identify, and fix errors. In this chapter, you will learn
    how to create error handlers that respond to errors and take appropriate action.
    In addition to showing you how to debug your PowerShell scripts, this chapter
    will also teach you how to develop your final PowerShell script, the PowerShell
    Game Console.


    Specifically, you will learn how to:


    +   - Read and analyze syntax, runtime, and logical errors

    - Alter the logical execution of a script when errors occur

    - Create error handlers that trap and respond to errors

    - Trace and control the logical flow of your PowerShell scripts and track variable
    values'
