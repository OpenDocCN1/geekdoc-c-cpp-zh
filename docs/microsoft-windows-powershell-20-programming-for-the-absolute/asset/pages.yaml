    # ACCESSING WINDOWS POWERSHELL


    As you have already seen, you can start a new Windows PowerShell session by clicking
    on Start > All Programs > Windows PowerShell. When first started, the Windows
    command appears and after a moment, displays the following information.


    Windows PowerShell V2 (Community Technology Preview - Features Subject to Change)

    Copyright (C) 2008 Microsoft Corporation. All rights reserved.


    ```

    PS C:\

    ```


    By default, Windows PowerShell displays its name and copyright information each
    time it is started. The name and copyright information is followed by a blank
    line and the Windows PowerShell command prompt. The command prompt displays, by
    default, the Windows PowerShell''s current working directory.


    There are plenty of other ways to start new Windows PowerShell sessions. For example,
    you can also start a new PowerShell session from a cmd.exe console session by
    typing PowerShell at the command prompt and pressing Enter. In response, a new
    PowerShell session is started within the current command window. When working
    with the PowerShell session, you can close it and return to the cmd.exe session
    by typing Exit at the PowerShell command line and pressing Enter.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'Another way to start up a new Windows PowerShell session is to create a desktop
    shortcut for it, which you can do by right-clicking on an open area of the Windows
    desktop, and when prompted, selecting New > Shortcut. This will start a Shortcut
    wizard, whose job is to walk you through the process of setting up new shortcuts.
    Type PowerShell in the Type the Location of the Item field and click on Next.
    Next type Windows PowerShell in the Type a Name for This Shortcut field and click
    on Finish.


    In addition to starting a new Windows PowerShell session using the options outlined
    above, Windows PowerShell 2.0 users can also work with Windows PowerShell using
    a new Graphical PowerShell application, which is covered a little later in this
    chapter.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_63_0.png)


    # CUSTOMIZING THE WINDOWS POWERSHELL WORKING ENVIRONMENT


    Regardless of how you start a Windows PowerShell session, you will find yourself
    working it from within the Windows command console application. The good news
    is that the Windows command console provides you with access to a rich set of
    commands and features that help you get control over the manner in which you interact
    with the PowerShell and also be used to help you work faster and more efficiently.


    # Customizing Windows PowerShell Shortcuts


    Placing a shortcut to the Windows PowerShell on your desktop provides convenient
    access. One way to make the shortcut an even convenient tool is by modifying its
    Start in field to point to the folder where you have to store all your Windows
    PowerShell script files. This way, all you have to do is double-click on your
    Windows PowerShell icon and a new session will start up, using the specified folder
    as your current working directory.


    The steps required to modify your Windows PowerShell shortcut as described above
    are outlined in the following procedure.


    +   1. Right-click on your Windows PowerShell shortcut and select Properties.
    The Windows PowerShell Properties will appear.

    2. Type the full path name for your PowerShell script folder in the Start in field,
    as demonstrated in Figure 2.8.

    3. Click on OK.


    The next time you start up a new Windows PowerShell session using this shortcut,
    the Windows command console will appear and a new PowerShell session will be started
    with the specified folder set as your current working directory, as demonstrated
    in Figure 2.9.'
