- img_proc: true
  md: '# Chapter I • Introducing Windows PowerShell


    an execution policy that permits PowerShell scripts to run at one of three security
    levels, as outlined here:


    +   - Alligned. Only permits scripts that have a trusted signature to execute
    on your computer.

    - Remotesigned. Permits PowerShell scripts downloaded from the web to run only
    if they are from a trusted source.

    - Unrestricted. Allows any PowerShell script to run on your computer.


    Before PowerShell will allow you to run your first PowerShell script, you will
    need to set one of Windows PowerShell''s execution policy settings. For example,
    to allow any PowerShell script to run on your computer, you would enter the following
    command at the PowerShell command prompt.


    ```

    Set-Executionpolicy Unrestricted

    ```


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_38_0.png)


    If you get an error message when you attempt to configure PowerShell’s execution
    policy, restart Windows PowerShell by right-clicking on its icon and selecting
    the Running as Administrator option, and then run the command again.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_38_1.png)


    Your choice of execution policy to set should be based on your scripting needs
    and security requirements. If you decide later that you want to change your Windows
    PowerShell execution policy, you may do so at any time by executing the Set-Executionpolicy
    command and passing it one of the options listed above.


    # CONFIGURING WINDOWS REMOTE MANAGEMENT


    One significant new feature provided by PowerShell 2.0 is remote execution, which
    gives you the ability to execute PowerShell cmdlets on remote computers, provided
    that both the local and remote computer has the Windows Remote Management (WinRM)
    service enabled. Remote execution also requires the WS-Management protocol to
    be configured to work with the Windows PowerShell.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_38_2.png)


    As of the writing of this book, Windows PowerShell’s support for remote execution
    was limited to computers running Windows Vista and Windows Server 2008. However,
    hopefully this will change.'
