    # Executing PowerShell Cmdlets


    You interact with the PowerShell by submitting commands at the command prompt,
    which typically looks something like PS C:\, as demonstrated in Figure 1.11. PS
    is an abbreviation for PowerShell. C:\ represents the current working directory,
    and the > indicates that PowerShell is ready to receive input. You enter commands
    for PowerShell to process by typing them in and pressing Enter. What happens depends
    on the command you entered. By default, any command you type is processed and
    any output is returned as text, as demonstrated in Figure 1.11.'
