  md: '# Associative Arrays


    One shortcoming of arrays is that as they grow bigger it becomes difficult to
    keep track of where individual array elements are stored. As a result, to find
    a given value, you usually have to set up a loop to search the array, examining
    every element in order to find the one you want. An associative array, referred
    to as a hash or dictionary, provides a more efficient and faster alternative,
    allowing you to store data in key-value pairs.


    # Creating an Associative Array


    One way to create an associative array is to define it as an empty associative
    array, as demonstrated here:


    ```

    $ids = {};

    ```


    As you can see, the variable used to store the hash is just a regular variable,
    and the empty hash table is represented by @().


    Once defined, you can add any key-value pairs to it as necessary, as demonstrated
    by the following.


    Each of these statements adds a new entry into the associative array. The value
    specified inside the brackets is the key and the value specified to the right-hand
    side of the equals sign is the value.


    # Accessing Data Stored in Associative Arrays


    Once created and populated with data, you can retrieve a value from the associative
    array, as demonstrated here:


    ```

    $x = $ids[34567]

    ```


    Here, a value of Molly is retrieved from the associative array and assigned to
    a variable named $x.


    Associative arrays can be used to store any amount of data. Associative array
    elements are stored as values and must be enclosed inside quotation marks if they
    contain blank spaces. Stored values are retrieved by referencing their associative
    key. Associated arrays can store any type of data. Data retrieval from associative
    arrays is relatively fast and does not increase as more values are added.'
  merge: -1
