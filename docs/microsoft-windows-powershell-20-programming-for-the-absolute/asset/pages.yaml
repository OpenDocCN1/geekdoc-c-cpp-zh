- img_proc: true
  md: 'The switch statement begins by defining the expression against which all comparisons
    its code block are evaluated. The switch statements support any of three different
    types of comparison operations, as outlined here:


    +   * Test. An expression whose value is evaluated.

    * Value. A literal value, such as a string or number.

    * Default. Specifies a default code block that is executed if none of the previously
    defined comparisons evaluate as true.


    Unlike the if statement, switch statements do not stop executing once a matching
    value has been found. Instead, every test specified within a switch statement
    is evaluated, thus potentially resulting in some or all of the embedded code blocks
    being executed. The optional default component and its associated code block are
    only executed in the event that none of the previously defined tests evaluate
    as being true.


    To get a good idea of how to work with the switch statement, consider the following
    example.


    ```

    switch ($today.Day)

    {

    1 (Write-Host "Payday!")

    5 (Write-Host "It is time to water the plants.")

    10 (Write-Host "Remember to pay the bills.")

    15 (Write-Host "Payday!")

    20 (Write-Host "It is time to water the plants.")

    25 (Write-Host "It is time to clean the garage again.")

    default (Write-Host "There are no calendar entries to remember today.")

    }

    ```


    Here, a series of six conditional tests have been defined, each of which is compared
    to the value of $today.Day. Because each of the values compared is distinct, only
    one can result in a match. However, if you were to rework this example by adding
    additional tests as shown below, multiple matches could occur and as has been
    stated, the switch statement will execute the code block belonging to any matching
    statements.


    ```

    $today = get-date

    ```


    ```

    switch ($today.Day)

    {

    1 (Write-Host "Payday!")

    1 (Write-Host "It is time to water the plants.")

    ```'
