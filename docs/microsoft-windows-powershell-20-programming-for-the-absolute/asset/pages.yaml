    # Removing Events


    As has already been pointed out, any time a new event is registered, Windows PowerShell
    assigns a unique event identifier(number) to it. Using this identifier, you can
    remove an event subscription once it is no longer needed, as demonstrated here:


    Remove-PsEvent 1


    When executed, this statement deletes the first event subscription that was set
    up in the current working session. If you have more than one event subscription
    defined, you can execute the following statement to delete all of them.


    Remove-PsEvent *


    Closing the Windows PowerShell console terminates any active event subscriptions.


