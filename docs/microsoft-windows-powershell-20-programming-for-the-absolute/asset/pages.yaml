- img_proc: true
  md: '# 348 Microsoft Windows PowerShell 2.0 Programming for the Absolute Beginner,
    Second Edition


    In this example, the problem did not lie in the logic that was applied to the
    development of the script. Instead, the problem most likely occurred by accident,
    when the programmer entered in the - operator instead of + operator. Thus, to
    catch logical errors, it is also important that you take the time to carefully
    analyze the results generated by your scripts to ensure they are working as expected.
    Otherwise, your PowerShell scripts will do exactly what you tell them to, even
    if it is not what you wanted them to do. Logical errors can also be prevented
    by writing PowerShell scripts in a modular fashion, using functions to organize
    and store related statements. This allows you to test your scripts a module at
    a time as you are building them.


    # TERMINATING VERSUS NON-TERMINATING ERRORS


    In addition to syntax, runtime, or logical errors, Windows PowerShell errors can
    also be classified as terminating and non-terminating. A non-terminating error
    is an error that does not prevent the script from continuing its execution. For
    example the following script shows a non-terminating error. When executed, an
    error message is displayed when the third statement is executed. However, the
    script continues executing, allowing remaining statements to execute.


    ```

    $x = 10

    $y = $x / $y

    Write-host "I got here anyway!"

    ```


    A terminating error, as you would expect, is an error that halts the execution
    of the PowerShell script. As you will see later in this chapter, Windows PowerShell
    provides you with with the ability to override the default termination behavior
    for cmdlet errors.


    # DISSECTING THE STRUCTURE OF ERROR MESSAGES


    Anytime an error occurs, PowerShell stores information about the error in an object
    called ErrorRecord. This object provides access to a number of properties, each
    of which stores information about the error. These properties include:


    +   - Exception. This property doubles as an object with its own properties. One
    of its properties is Message. By referencing Exception.Message, you can display
    a description of an error message.

    - CategoryInfo. A high-level category that classifies the type of error that has
    occurred.

    - ErrorDetails. When available, provides additional detailed information about
    an error.

    - TargetObject. When available, identifies the object that was active when the
    error was generated.'
  merge: -1
  pgno: 371
- img_proc: true
  md: 'PowerShell stores information about the last error to occur (e.g., the most
    ErrorRecord object) in a special variable named $error. $error is an array. The
    last error is found in $error[0]; the second last error in $error[1]; and so on.
    For example, using the properties belonging to the ErrorRecord object, you can
    easily display a text message containing the error message or the most recent
    error using the following statement.


    ```

    Write-Host "Error: " + $error[0].exception.message

    ```


    # TELLING WINDOWS POWERSHELL HOW TO REACT TO ERRORS


    By default, Windows PowerShell will continue to run your PowerShell scripts in
    the event a non-terminating error occurs. You can change this behavior by modifying
    the value assigned to the special $ErrorActionPreference variable. For example,
    you could instruct Windows PowerShell to stop executing a PowerShell script in
    the event a non-terminating error occurs by adding the following statement at
    the beginning of the script.


    ```

    $ErrorActionPreference = "Stop"

    ```


    Windows PowerShell allows you to assign any of the values shown in Table 10.1
    to the $ErrorActionPreference special variable.


    Table 10.1 POWERSHELL ERROR ACTION ARGUMENTS

    | Value | Description |

    | Continue | Generates an error but allows the script to continue executing |

    | Stop | Generates an error and terminates the script |

    | SilentlyContinue | Suppresses the display of the error and allows the script
    to continue executing |

    | Inquire | Generates an error and asks the user how to proceed |


    If you want, you can specify an optional -ErrorAction argument at the end of the
    cmdlet statements in order to temporarily override the default global ErrorAction
    setting. For example, by default a script containing the following statement will
    continue executing in the event the cmdlet is unable to connect to the specified
    network computer.


    ```

    Get-WmiObject Win32_ComputerSystem -computername HP1

    ```


    The script continues executing because the default value of the $ErrorActionPreference
    variable is Continue. Thus, the previous statement will result in an error message
    being displayed, as demonstrated here, but the script will continue running.'
