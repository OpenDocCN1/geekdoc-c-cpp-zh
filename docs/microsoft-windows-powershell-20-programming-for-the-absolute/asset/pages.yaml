- img_proc: true
  md: '# Saving Data Output as HTML


    Windows PowerShell is capable of saving output in many different file formats,
    including HTML. The advantage of HTML is that it can often be used to more effectively
    display information, especially when used on a web server to communicate with
    large groups of people. To save file output as an HTML file, use the `ConvertTo-Html`
    cmdlet, as demonstrated below.


    ```

    Get-Service | Where-Object { $_.Status -eq ''running'' } | ConvertTo-HTML Name,
    DisplayName, Status | Set-Content C:\Temp\Text.html

    ```


    Here, the `Get-Service` cmdlet is used to generate a list of all processes running
    on the computer. Next, the `Where-Object` cmdlet is used to filter out all non-running
    services. The `ConvertTo-Html` cmdlet is then used to format the resulting output
    into an HTML file. Note that only the Name, DisplayName, and Status properties
    are outputted. Finally, the HTML is written as a file name, as demonstrated in
    Figure 8.6.


    ![](img/e07ce5ce2afe5ff9f444f2c361d9d87e_293_0.png)


    Figure 8.6 Displaying object pipeline as an HTML file.'
  merge: -1
  pgno: 293
