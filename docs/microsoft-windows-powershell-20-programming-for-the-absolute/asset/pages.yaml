  md: '# CHAPTER

    OBJECT-BASED SCRIPTING WITH .NET


    Windows PowerShell is tightly integrated with Microsoft’s .NET Framework, which
    provides much of the supporting environment required to develop Windows applications
    and scripts. In this chapter, you will learn how Windows PowerShell leverages
    .NET resources. You learn about the .NET class library and common runtime language.
    You will learn how to execute cmdlets and use cmdlets to access object properties
    and methods. You will also review cmdlet aliases and learn how to create your
    own custom aliases. On top of all this, you will learn how to programmatically
    customize the Windows PowerShell and to develop the PowerShell Fortune Teller
    game.


    Specifically, you will learn:


    +   - How to create a profile.ps1 script file and use it to customize Windows
    PowerShell

    - More background information regarding Windows PowerShell’s integration with
    .NET

    - How to use object pipelines to pass structured data between cmdlets

    - How to create custom aliases'
