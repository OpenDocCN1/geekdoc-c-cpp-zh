  md: '# TRICK


    You can use the Get-PSJob cmdlet in conjunction with the Remove-PSJob cmdlet to
    delete all background jobs started from your current working environment, as demonstrated
    here:


    ```

    Get-PSJob | Remove-PSJob

    ```


    # HINT


    There is a whole lot more to working with background jobs than just the basics
    that have been covered in this chapter. To learn more, use the Get-Help cmdlet
    to review the help files associated with the Create-PSJob, Get-PSJob, Retrieve-PSJob,
    Wait-PSJob, Stop-PSJob, and Remove-PSJob cmdlets.


    # WINDOWS POWERSHE PLUMBING


