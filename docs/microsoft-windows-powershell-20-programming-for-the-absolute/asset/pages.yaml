  md: '# Chapter 7 + Organizing Scripts Using Functions


    # CHANGING SCRIPT DESIGN USING FUNCTIONS AND FILTERS


    In the last couple chapters, you were introduced to a number of different programming
    constructs that you can use to improve the overall organization of your PowerShell
    scripts. Using the if and switch statements, you learned how to set up conditional
    tests and to group related sets of statements for execution when certain conditions
    evaluate as being true. Using the do while, do until, for, foreach, and while
    loops, you learned how to group related statements that perform a given task repeatedly.
    centralizing key programming logic and reducing the overall number of code statements
    required to create PowerShell scripts. Now it is time to learn about functions
    and filters.


    A function is a named code block that can be executed by referencing its name.
    When called, all of the statements inside a code block are evaluated and executed.
    Functions can accept arguments and return a result. A filter is very similar to
    a function. There is nothing that you can do with a filter that you cannot do
    with a function. The difference between the two filters are designed to more efficiently
    process large objects of pipeline data.


    > Predefined functions in Windows PowerShell. For example, when you type C or
    D to switch between drives at the Windows PowerShell command prompt, you are actually
    executing functions that in turn make calls to the Set-cmdlet.


    # Improving Script Organization


    One of the primary benefits of functions is that they help to reduce the number
    of lines of code required to write a script. Functions also facilitate the modular
    development of scripts by providing the ability to organize code statements into
    named code blocks, which can then be executed over and again from any location
    within the script file. Functions make your Windows PowerShell scripts more manageable,
    building the blocks required to create larger and more complex scripts, without
    necessarily increasing complexity or ending up with tons of code. For example,
    suppose you were planning on writing a new PowerShell script that performs the
    following tasks.


    +   - Prompts the player for permission to execute.

    - Displays a welcome screen

    - Manages the collection of user input

    - Displays a short story incorporating user input

    - Prompts the player to play again


    One way to develop this script would be to begin by defining any variables that
    are needed followed by a series of functions, each of which is responsible for
    managing one of the tasks'
