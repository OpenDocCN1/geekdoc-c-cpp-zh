- img_proc: true
  md: '# DEBUGGING POWERSHELL 2.0 SCRIPTS


    In addition to using the Set-Debugger cmdlet to enable Windows PowerShell''s debug
    mode, Windows PowerShell 2.0 programmers have access to an even more powerful
    debugging option based on the use of breakpoints. A breakpoint is a location in
    a script where execution is temporarily paused, at which time a nested debug prompt
    is displayed, allowing you to execute by line over statement execution while also
    keeping an eye on execution flow and variable values.


    # Breakpoint Cmdlets


    Windows PowerShell allows you to set as many breakpoints as you want. These breakpoints
    are associated with the current Windows PowerShell session and not with scripts.
    As a result, if you close the Windows Console or Graphical Windows PowerShell,
    any breakpoints that have been set are lost. Breakpoints are managed within Windows
    PowerShell using the following cmdlets:


    +   - Set-PsBreakpoint. Adds a new breakpoint to the specified line, column, variable,
    command, and function.

    - Get-PsBreakpoint. Gets information about breakpoints in the current console
    session.

    - Remove-PsBreakpoint. Deletes breakpoints set in the current console session.

    - Enable-PsBreakpoint. Re-enables breakpoints set in the current console session.

    - Disable-PsBreakpoint. Disables breakpoints set in the current console session.


    # Controlling Statement Execution


    Once breakpoints are set, you need to execute your Windows PowerShell script in
    order to begin debugging. Once your debug session has begun, the script execution
    continues normally until a breakpoint is reached, at which time execution is paused.
    Once this occurs, you can use the following commands to control the execution
    of the script''s statements as you are debugging.


    +   - Step-Into. Executes the next statement within a script and then pauses execution.

    - Step-Over. Executes the next statement within a script and then pauses execution
    processes all statements located within functions as if they were a single statement.

    - Step-Out. Resumes script execution, continuing until either the end of the script
    is reached or another breakpoint is reached.'
  merge: -1
  pgno: 387
