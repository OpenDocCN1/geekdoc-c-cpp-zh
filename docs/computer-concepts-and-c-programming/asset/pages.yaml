  md: '# Frequently Asked Viva Questions 517


    similar to a 10-key calculator, which allows the user to enter numbers rapidly.
    The keyboard that we use is also known as the QWERTY keyboard.


    **Q13. What are different categories of keyboard?


    Ans. Membrane Switch technology, Rubber Dome-switch technology, and Mechanical
    Switch technology.


    **Q14. Mention names of any three types of mouse.**


    Ans. Mechanical mouse, Optical mouse, and Wireless mouse


    Ans. RAM


    Ans. Magnetic Tape


    **Q17. Mention any three secondary memory devices.**


    Ans. Hard Disk, DVD, and USB drive are common examples of secondary memory devices.


    **Q18. What is magnetic tape?**


    Ans. Magnetic tape is a storage device, made up of a thin plastic film coated
    with magnetic material such as ferrous oxide that can be magnetized to store data
    on it. These tapes are read and written using a tape driver and can also be packed
    in a cassette or cartridge


    **Q19. In context to hard disk, what do you understand by the term Area Density?**


    Ans. Areal density is a measure of the amount of data that can be stored in unit
    area of a storage device. It is also known as bit density and is used to compare
    different storage devices in terms of the amount of data storage provided by each
    device. In context to hard disk, areal density is the amount of data that can
    be stored in unit area of a hard disk platter.


    **Q20. What is file system?**


    Ans. The logical organization of data on a storage device such as a hard disk,
    along with the programs to access and manipulate that data is known as file system.
    VFAT, and NTFS are examples of file system.


    **Q21. What is optical media?**


    Ans. Optical media refers to various types of data media, such as CDs and DVDs
    that are read by a laser. This includes CD-ROMs, DVD-ROMs, and all the variations
    of these two formats, such as CD-R, CD-RW, DVD-R, DVD-RW, DVD+R, DVD+RW, and Blu-ray.


    **Q22. What is Blu-ray disk?**


    Ans. Blu-ray (also known as Blu-ray Disc or BD) is an optical disc to record,
    store, and playback high-definition video (video system of higher resolution),
    digital audio,'
  merge: -1
  pgno: 532
- img_proc: true
  md: '# 518  Appendix G


    and computer data. Blue laser which provides higher resolution as compared to
    red laser (used to write DVD) is used to store data on Blu-ray disk


    **Q23. What are the advantages of using optical media over hard disk?**


    Ans. In comparison to hard disk, optical media has low seek time and optical discs
    are not based on magnetic charges. These discs are more lasting and there are
    lesser chances of loss. Moreover, an optical disk is much cheaper and handy compared
    to a hard disk. These advantages make them great for backup and transfer small
    amounts of data between different computers.


    **Q24. What is an operating system?**


    Ans. An operating system provides programs for handling computer operations such
    as sending, receiving input, scheduling, managing files, and so on. It is a software
    that provides support to other software and to the hardware of the computer, enabling
    them to perform their tasks properly. Some examples of operating systems are Windows,
    Unix, and Linux.


    **Q25. Mention any three categories of operating system.**


    Ans. Three commonly used categories of operating system is Time-sharing Operating
    System, Multiprocessing Operating System, and Real-time Operating System


    **Q26. Mention functions of an operating system?**


    Ans. Process management, memory management, devices management, and information
    management


    **Q27. Mention few names of operating system.****


    Ans. UNIX, Linux, Windows, OS/2, and Macintosh


    **Q28. Mention latest operating system developed by Microsoft.****


    Ans. Windows 7, is the latest operating system of Job Scheduling.


    **Q29. What is Job Scheduling? Mention types of Job Scheduling.****


    Ans. Job scheduling is a process of assigning priority to jobs and including new
    jobs for processing at appropriate times. Non-Preemptive and Preemptive are two
    types of Job Scheduling.


    **Q30. What do you mean by multiprocessing?****


    Ans. Multiprocessing refers to the process of using two or more CPUs together
    to optimize data processing. In a multiprocessing environment, the CPU can execute
    more than one instruction at the same time.


    **Q31. What is Round-Robin scheduling?****


    Ans. Round-Robin scheduling is an algorithm that is used mainly in time sharing
    systems for the purpose of scheduling jobs submitted to their operating systems.
    In this algorithm each job is executed for a time period and then it is interrupted
    (even if the job is not completed) and next job is executed. Each job is assigned
    same time interval that is known as time slice or time quantum. A job may get
    completed in one time slice or it might take several time slices upon its'
