  md: '# Introduction to Digital Computers 29


    Q9. Explain read only memory with its types.


    Ans. Read only memory is a part of main memory. It is temporary or volatile in
    nature. When you shut down the computer, RAM loses its data. When you start the
    computer, operating system and other supported files are loaded into the RAM,
    generally from the hard disk. This is also known Read Write Memory for the programs
    and instructions in the memory keep on changing by the process of reading and
    writing. It is used to contain the programs or data, which are critical and used
    frequently.


    There are five types of ROM:


    +   - Masked ROM

    "- Programmable ROM (PROM)

    "- Erasable ROM (EROM)

    "- Electrically Erasable PROM (EEPROM)

    "- Flash Memory


    Q10. Define access time.


