  md: 'Chapter 7


    # Type-identifiers


    The type identifier specifies the type of value to be displayed. If the specified
    identifier is invalid, the unpredictable output will be displayed. Table 2 lists
    the type-identifiers:


    | Table 2: Description of Type-identifiers |

    | Type-identifiers | Description |

    | d, i | Represents signed integers |

    | o | Represents unsigned integers displayed in octal form |

    | u | Represents unsigned integer in decimal form |

    | x | Represents unsigned integer in hexadecimal form and hexadecimal characters
    such as a, b, c, d are printed in lowercase |

    | X | Represents unsigned integer in hexadecimal form and hexadecimal characters
    such as A, B, D are printed in uppercase |

    | c | Converts any value to unsigned char and displays it. It is mainly used for
    printing characters |

    | s | Converts the argument into a character array and prints it; null in the
    string is not printed |

    | f | Prints point |

    | e, E | Represents floating point in exponential form. It has one digit to the
    left of the decimal point; the number of digits on the right side of decimal depends
    on the required precision |

    | g, G | Prints a floating point number in exponential form. The exponential form
    is used if the exponent is less than -1. However, these are both slightly different
    in functionality |

    | n | Prints the number of characters, which are printed so far by function |

    | p | Specifies the value of a pointer |


    # Type Prefixes


    Prefixes specify that the value to be displayed should be interpreted as short,
    long or double long. Table 3 lists the types of prefixes:


    | Table 3: Description of prefixes |

    | Prefix Type | Description |

    | h | Appears before type indicators d, i, o, u, x and X and indicates that the
    value to be displayed should be interpreted as short. For example, short integer
    (hd), short unsigned integer (hu) |

    | l | Appears before type-identifiers d, i, o, u, x and X and indicates that the
    value to be displayed should be interpreted as long. For example, long integer
    (ld), long unsigned integer (lu) |

    | L | Indicates that a value should be specified as long double and is available
    for type-identifiers e, E, f, g and G |'
