    # The Void Data Type


    The void data type stores no values and therefore you cannot perform operations
    on a variable that is declared as void. It is the only non-specific data type
    in C. Unlike all other data types, the void data type neither a size nor any permissible
    range. A void data type used with a function indicates that the function does
    not return any value. A function is a set of instructions which performs some
    actions and returns a value to the calling function. When a function returns no
    value, you can declare its return type as void.


