  md: '# High Level Language


    A language that is one step higher than low-level languages in human readability
    is called high-level language. It is the third generation of languages. To overcome
    the problems of machine languages and assembly languages, the computer technologists
    tried to make the computer understand at least a subset of the human language.
    Each instruction stands for a sequence of machine instructions and is closer to
    human languages, and easier to understand by humans. This reduces the size of
    programs. These make the programming of computers very easy and flexible. They
    are also called English oriented languages in which instructions are given using
    words. Such as add, subtract, input, print, etc. Programmers prefer them for software
    design. Every high level language must be converted into machine language before
    execution. Every high level language must have its own translating program compiler
    or interpreter.


    High level languages were developed as problem oriented languages that so may
    reflect the problem instead of machine features. In high level languages are called
    statements, Like English, these statements have their own grammar. This grammar
    contains the syntax, which governs the structure of statements, must be followed
    by each programmer. As the statements are in English like and follow grammar,
    these languages are easy to remember.


    ```

    10 LET X=7

    20 LET Y=10

    30 LET SUM=X + Y

    40 PRINT SUM

    50 END

    ```


    You can see that the program is self-explanatory and there is no consideration
    to track the memory and know the internals of the machine for the simple application
    programs.


    As is not much need to know the internals of machine, these languages are portable.
    The programs written on one machine can also run on different machine with or
    without much change. The programmer also does not need to keep tracks of memory.
    Statements can be inserted or deleted very easily as per the requirement.


    # Compiler


    A compiler is a translator that reads the full program, locates errors etc and
    translates into machine language. The program gets executed after it has been
    compiled. Once compiled, the program is changed into machine language or EXE file
    which automatically executes every time without compilation.'
