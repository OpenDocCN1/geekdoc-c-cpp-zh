  md: '# Internal Commands


    Internal commands are the commands which are built inside the operating system
    as part of a file called COMMAND.COM. The internal commands are loaded directly
    into the memory whenever the computer is switched on. Whenever you type an internal
    command, the MS-DOS executes it immediately. The most commonly used internal commands
    are listed below. Following are the synonyms of some command names, which can
    be used in place of their official names:


    ```

    BREAK,(ERASE), PATH, SHIFT,

    CALL, DIR, PAUSE, TIME,

    CHCP, ECHO, PROMPT, TYPE,

    CHDIR (CD), EXIT, REM, VER,

    CLS, FOR (RENAME), VERIFY,

    COPY, GOTO, RMDIR (RD), VOL,

    CTTY, IF, SET,

    MKDIR (MD).

    ```


    # External Commands


    Files with extension COM or EXE are external commands. These commands are treated
    as files, not built into the operating system. The MS-DOS external commands may
    contain some/all commands:


    ```

    APPEND.EXE, ASSIGN.COM, ATTRIB.EXE, BCKUP.EXE, CHKDSK.EXE, CHOOSE.EXE, COMMAND.COM,

    DEBUG.EXE, DISK., COPY.COM, DIRECT.COM, DOSSHELL.COM,

    EDIT.COM, EDLIN.EXE, GRIB32.EXE, EXEBIN.EXE, EXPAND.EXE, FASTCOPY.EXE,

    FC.EXE, FORDISK.EXE, FORMAT.COM, GRAPHICS.EXE, HELP.EXE, JOIN.EXE, KEYB.EXE,

    LABEL.EXE, MEM.EXE, MIRROR.COM, MODE.EXE, MODE.COM, NSLSUN.EXE, PRINT.EXE,

    QASIC.EXE, RECOVER.EXE, REPLACE.EXE, RESTORE.EXE, SETVER.EXE, SHARE.EXE,

    SORT.EXE, SUBST.EXE, SYS.COM, TREE.EXE, UNDEL.EXE, FORMAT.EXE, XCOPY.EXE

    ```


    When the command is entered by the user, MS-DOS first looks for the command in
    the current directory. If it is not found there, you can guide the relevant directory
    to the MS-DOS by using the PATH command.


    # Adding Parameters to a command


    The parameter can be referred to a value entered after a command which directs
    the command to carry out an additional task. For example, the command that you
    find in this is the COPY command. This command is used to copy files from one
    disk to another. The COPY command with a parameter can be given as:


    ```

    COPY A:MEM.TXT C:\ / V

    ```


    The command operates copying the MEM.TXT file from the Floppy Disk Drive (A:)
    and paste it into C: drive of the computer. It also verifies whether the file
    is copied to: correctly or not.


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_482_0.png)'
