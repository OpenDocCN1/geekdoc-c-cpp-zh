    # The Increment and Decrement Operators


    You can increment or decrement the value of a variable by using the increment
    (++) or decrement (-) operator. The increment operator is used to add 1 to its
    operand and the decrement operator is used to subtract 1 from its operand. In
    other words, the increment operator increases the value of an integer by 1 and
    the decrement operator decreases the value of the integer by 1. These operators
    can be applied only to variables by using either the prefix form or the postfix
    form.


    When prefix the value is either incremented or decremented first and is then assigned.
    However, in the postfix form, the value is used and only after the assignment
    operator has performed the operation, that the value is incremented or decremented.


    The following is an example of using the increment operator:


    ```

    a = ++b

    ```


    The preceding statement is equal to two assignment statements:


    ```

    b = b + 1

    and

    a = b

    ```


    The following is an example of using the decrement operator:


    ```

    a = --b

    ```


    The preceding statement is equal to two assignment statements:


    ```

    b = b - 1

    and

    a = b

    ```


    Let''s consider the example in Listing 4 to understand the increment operators:


    +   Listing 4: Using the Increment Operators


    ```

    #include<stdio.h>

    void main()

    ```'
