    Q65. What do you understand by conditional statements?


    Ans. A conditional statement is a control structure that allows you to select
    one or more execution paths in a program. It causes a program to execute a block
    of code after evaluating a conditional expression. If the conditional expression
    evaluates to a true set of statements it is executed otherwise those statements
    are skipped and not executed.


    Q66. Define switch statement with its syntax.


    Ans. A switch statement is a conditional statement that tests a value against
    different values. If the value is matched, the corresponding group of statements
    is executed. A switch statement begins with the switch keyword that is followed
    by a value expression in the parenthesis ( ). It is a combination of multiple
    case labels that must be separated by the break statement. Every case contains
    a constant value that is matched against the value, which is specified in the
    switch expression. If the value is matched, the statements of that case label
    are executed. The syntax of switch statement is listed as follows:


    ```

    switch(expression)

    {

    case value1: statement1;

    break;

    case value2: statement2;

    break;

    case value3: statement3;

    break;

    ```'
