    Type indicator is character specifying the type of data to be read. The following
    table shows the description of type indicators:


    | Table 5: Description of Type Indicator |

    | Type Indicator | Result |

    | d, i | Reads signed integers: the expected argument should be a pointer to int.
    However, these are slightly different in functionality |

    | o | Reads unsigned integer in octal form |

    | u | Reads unsigned integer in decimal form |

    | x, X | Reads unsigned integer in hexadecimal form |

    | E, e, f, G | Reads floating-point values. However, these are slightly different
    in functionality |

    | S | Reads character string. It matches a sequence of non-white space characters
    terminated by an end of line or end of file. The additional argument should be
    a pointer to char and should point to an area, which is large enough to hold the
    input string as well as NULL terminator |

    | C | Matches the number of characters according to a specified width. If no width
    is specified then a single character is assumed as the field width. The additional
    argument must be a pointer to char; |'
