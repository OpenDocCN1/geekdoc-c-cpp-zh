    Standard library functions are mainly classified into the following categories:


    +   - Input/Output (I/O) functions

    - String functions

    - Character functions

    - Math functions

    - Time and date functions

    - Miscellaneous functions


    Let''s discuss each of these standard library functions in detail.


    # 17.2 I/O Functions


    Input here means accepting data from the user, and output means presenting data
    on

    screen. The C language contains several I/O standard library functions defined
    in the library

    called `stdio.h`.


    Table 1 lists the standard I/O library functions:


    | Table 1: Standard I/O Library Functions |

    | Function | Description |

    | --- | --- |

    | getchar() | Retrieves the next character specified on the keyboard |

    | putchar() | Writes a single character on the screen |

    | printf() | Writes formatted output on the screen |

    | scanf() | Reads formatted input |


    # 17.3 String Functions


    Sometimes, a programmer may need to manipulate the strings in a program. These
    strings

    can be manipulated using string handling functions that are defined in the `string.h`
    library.

    Table 2 lists the standard string library functions:


    | Table 2: Standard String Library Functions |

    | Function | Description |

    | --- | --- |

    | strcat() | Concatenates two strings |

    | strcmp() | Compares two strings |

    | strcpy() | Copies the content of one string to another string |

    | strlen() | Calculates the length of a string |

    | strl() | Converts the string to lowercase |

    | strupr() | Converts the string to uppercase |'
