    # 14.2 Declaring a Pointer Variable


    A pointer is a variable that stores the address of another variable. You can declare
    a pointer using the following syntax:


    ```

    data_type *pointer_variable_name;

    ```


    In the preceding syntax, data_type specifies the type of the pointer variable
    that you want to declare. Further, the asterisk (*) symbol in C is used to declare
    a pointer variable, followed by the name of the pointer variable, which in our
    case is pointer_variable_name. For example:


    ```

    int *ptr; /* Declares a pointer variable ptr of integer data type */

    float *temp; /* Declares a pointer variable temp of float data type */

    ```


    Let''s create a C program to illustrate the pointer declaration. Listing 1 shows
    the code of this program:


    +   Listing 1: Declaring a Pointer Variable


