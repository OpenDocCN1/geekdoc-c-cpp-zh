  md: '# File Handling


    It means that when you input data in variable length record files, you have to
    terminate each data item by using new line character.


    Note that the total length of first record i.e. the record of student Rakesh is
    5(10001) + (Rakesh) + 2(30) + 2(50) is 15 characters. Similarly the total length
    of record i.e. the record of student Manas Kumar is 5(10001) + 10(Manas Kumar)
    + 2(35) + 2(25) is 19 characters. It means records may have different lengths
    and so the file having varying length of records is given name as variable length
    record files.


    The typical characteristic of such files is that if you need to read a record
    from the file then you have to read the fields individually, in the same sequence,
    in which they will be written. For example, if you want to read the first record
    then you have to read rollino first, then Name, and then marks in Physics and
    mechanics


    As this file can be read using system text editors, these files are also ASCII
    files.


    +   - Fixed Record Length Files


    Unlike variable length record files, all records in fixed length record files
    have same size. Here the size of data is calculated in the form of bytes instead
    of characters. Consider the field "name" of previous example where data Ramesh
    has size of 6 whereas data item Manas Kumar has size of 10 characters. In fixed
    length record files we may fix the size of field "name" as maximum size of 30
    bytes. So whatever be the size of individual data item of "name", it will be stored
    in the file of 30 bytes.


    Fixed record length files are not ASCII files as the data are stored in the form
    of bytes. Therefore, we cannot read data from such files using system text editors.
    The contents of the files can be read or written using the corresponding programs
    only.


    The records, in the fixed length record files are generally defined with the help
    of structures. Therefore, the whole record is read or written in the file instead
    of individual fields.


    In case of binary files the modes are changed "wb" from "w", "rb" from "r" and
    "ab" from "a". The description of binary modes remain same as "w", "r" and "ab"
    as mentioned above.


