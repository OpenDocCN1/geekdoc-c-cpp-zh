  md: '# Chapter 1


    | Central Processing Unit |

    | --- |

    | Control Unit | Arithmetic Logic Unit |

    | Registers | |


    **Figure 16: Components of a CPU


    # Control Unit


    As the name suggests, control unit controls the various components of a computer
    and its operation. The instructions stored in the main memory are accepted, interpreted,
    and processed by the control unit so that they can be executed by appropriate
    parts of the computer. It sends and receives signal from different parts of the
    computer. These signals control the different parts and devices of the computer.


    # Arithmetic and Logic Unit


    ALU performs all the arithmetic or mathematical operations such as, subtraction,
    multiplication, division, and comparison between alphabets, numbers, etc. The
    results obtained from the aforementioned operations are then sent back to the
    main memory.


    # Registers


    Registers are used to store the data that is either processed or to be processed.
    The size of a register is measured in bits in multiples of 8. The size of instructions
    that can be processed depends upon the size of register.


    +   - Output Unit

    Output units are used to either display or hear the processed information. The
    information may be in the form of video clip, audio clip, documents, images, etc.
    The output devices may be monitor, speaker, printer, etc. It may be a CD, floppy,
    or Universal Serial Bus (USB) to store the result.


    Some important and frequently used output devices are discussed in the following
    subsections.


    # Monitor


    A monitor of a PC works similarly to a television screen. It displays text characters
    and graphics in colors or shades of grey. A monitor is sometimes also known as
    screen, display or Cathode Ray Tube (CRT). An image is made of tiny dots called
    pixels. Anything typed by the keyboard is displayed on the monitor. When a program
    is executed, the information is displayed on the monitor.


    However, the results on the screen are shown only temporarily and are not permanent
    unless they are saved in the hard disk. At present, various types of monitors
    are available in the market, such as the monochrome (single color) monitor and
    color monitor. The monochrome'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'monitor and the color monitor differ in terms of their resolution (the sharpness
    of the image on the screen). Higher the resolution, more expensive is the monitor.
    Generally, color monitors have high resolution. High-resolution monitors are used
    for specialized jobs, such as creating graphics and images. A monitor is shown
    in Figure 17:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_28_0.png)


    Figure 17: Monitor


    # Liquid Crystal Display


    Liquid Crystal Displays (LCDs) are similar to monitors. They are also used to
    display information, programs, and applications. Compared to CRTs, LCDs are very
    light in weight. LCD screens use liquid crystal to display information. The liquid
    crystal solution is present between the two sheets of polarizing material. When
    an electric current is passed through the crystal, crystals twist causing some
    light waves to be blocked and the other to pass through, creating the images.
    LCDs are generally used on laptop computers.


    # Speakers


    Once you have recorded a sound file, speakers are used to listen to the music
    or other sound. To attach the speakers with your computer system, you need a sound
    card. Speakers receive electrical signals from your sound files with the help
    of sound cards and convert them into sound waves that you can hear. Speakers are
    shown in Figure 18:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_28_1.png)


    Figure 18: Speakers


    Compared to the speakers connected to your stereo system, the speakers used with
    computer systems are usually very light weight.


    # Printer


    Printers are one of the most popular forms of output of a computer system. A device
    that prints images, numbers, alphabets, and graphs on a sheet of paper is known
    as a printer. After creating a document on a computer, you can send it to a printer
    for printing its hard'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1


    copy, which is generally called a printout. The speed of a printer is rated either
    by pages per minute (ppm) or characters per second (cps). You can take printout
    in full colors or in black color only. Printers which can print in full colors
    are expensive.


    In short, a printer lets you take documents, pictures, and other files and "print"
    them out. In other words, it can be said that they create a hard copy of these
    files on a piece of paper.


    There are a variety of printers available in the market. Some of the commonly
    used printers are as follows:


    # Dot matrix printer


    A Dot-Matrix Printer (DMP) prints each character as a pattern of dots. It forms
    characters with print head, which are received in the coded form (0 and 1) by
    the memory. An electronic circuit is present in the print head, which decodes
    the character.


    The print head has 7x9 matrix of tiny needles in which there are seven rows and
    nine columns of needle. These needles print the characters in the forms of dots.
    These printers do not provide high-quality print outs.


    The speed of dot impact printer is maximum of 350 cps. They come in two sizes:
    (a) 80 columns DMP which can print only on paper having size of 80 columns and
    (b) 132 columns DMP which can print on paper having either size of 80 columns
    or 132 columns. The main advantage of DMP is that you can print multiple copies
    of your result in one go by using carbon. A DMP is shown in Figure 19:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_29_0.png)


    > ▲ Figure 19: Dot Matrix Printer


    # Inkjet printer


    In an inkjet printer, high density ink is squirted out of a nozzle on a paper,
    forming character. Some printers of this category use head, others piezoelectric
    crystal, which when charged changes the shape of crystal that releases ink. The
    speed of an inkjet printer is usually 200-300 characters per second. You cannot
    get carbon copy of the print outs with the help of this printer. This is a type
    of character printer. An inkjet printer is shown in Figure 20:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_29_1.png)


    > ▲ Figure 20: Inkjet Printer'
  merge: -1
