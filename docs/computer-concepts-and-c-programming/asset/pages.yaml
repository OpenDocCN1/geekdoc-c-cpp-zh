  md: '# Chapter 1


    The four units shown in the preceding figure are explained in the following subsections.


    # Input Unit


    Input units are used to feed data and instructions together into the computer.
    These units devices help a user in communicating with the computer. The input
    units consist of some of the input devices such as keyboard, mouse, touch screen,
    light pen, graphics tablet, and microphone.


    Some and frequently used input devices are discussed subsequently.


    # Keyboard


    Keyboard is one of the most important input devices for a computer. At present,
    it is the most widely used input device. It is used to type numbers, letters,
    and other characters. A keyboard is also used to type instructions to your computer
    or to type documents and other papers. Figure 2 shows a keyboard:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_19_0.png)


    Figure 2: Keyboard


    A keyboard has a set of buttons that are used to input data into your computer.
    The keyboard that we use is also known as QWERTY keyboard. It is also called the
    Universal keyboard. Christopher Stokes, the inventor of the typewriter, designed
    the arrangement of characters on a QWERTY keyboard in 1868. The keyboard shown
    in Figure 2 is a QWERTY keyboard.


    A brief description of the various keys present on the keyboard is as follows:


    +   Typewriter keys: Include letters, numbers, and punctuation symbols. The typewriter
    keys are used for typing and designing.


    +   Function keys: Include keys F1 to F12 and are located at the top end of the
    keyboard. The functions they perform on the software that you use.


    +   Cursor control keys: Appear as Left, Right, Up and Down arrow keys. These
    keys enable you to move the cursor to the left, right, up, or down the screen
    - one line or one character at a time.


    +   Numeric keys: Appear just below the function keys along some special characters
    printed on the topside. Also, the right-hand side of the keyboard contains the
    numeric pad comprising calculator-like keys. Some of these keys have two functions
    of a numeric pad is controlled by the key marked NUM LOCK. For example, the key
    marked 7 works as a Home key only when the NUM LOCK is OFF. When the NUM LOCK
    is ON (indicated by the green light on top of the keyboard), the keys marked 1,
    2, 3, 4, 5, 6, 7, 8, 9, and 0 function as Numeric keys, and on pressing any of
    them, a number gets displayed on the screen.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction to Digital Computers


    +   - Page Up and Page Down keys: Allow you to move to the preceding and next
    pages of the document, respectively.


    +   - Home and End keys: Allow you to move the cursor to the top and end of a
    document, line, or window.


    +   - Caps Lock key: Allows you to type in upper case. Normally, an alphabet is
    typed in the lower case. If you press the Caps Lock key once (when the LED indicator
    status of Caps Lock is lit), any letter you type appears in uppercase (capital).
    This effect can be reversed by simply pressing the Caps Lock key again.


    +   - Shift key: Allows you to type text in upper case. Holding the Shift key
    down and then pressing a letter creates an upper case. However, if the Caps Lock
    is ON, then this effect is reversed. Where there are two symbols or characters
    on a key, the Shift key uses the upper symbols, such as ~, @, #, $, %, &, *, (,
    _, +, |.


    +   - Ctrl and Alt keys: Allow you to carry out special actions. For example,
    pressing the Ctrl and C keys simultaneously aborts the current task or command
    from being executed in MS-DOS and returns to the DOS prompt. By pressing the Ctrl,
    Alt, and Del (Delete) keys simultaneously, the machine automatically restarts.


    +   - Enter key: Allows you to start processing the data. In software such as
    MS Word, pressing the Enter key will lead to starting of the next line. The Enter
    key is also referred to as the Return key.


    +   - Tab key: Moves the cursor along a line to a preset indent. It allows you
    indent paragraphs and line-columns, text, numbers. In some software, the Tab key
    helps you move from one option to another in a menu.


    +   - Esc (Escape) key: Allows you to cancel or ignore the entry or command that
    you have entered in an application.


    +   - Delete and Backspace keys: Erase a space or character (one space/character
    at a time) that is placed to the right side of the blinking cursor. On the other
    hand, the Backspace key erases the character to the left side of the blinking
    cursor. It moves the cursor back one character at a time and erases whatever you
    have typed.


    A standard keyboard normally contains 101 to 105 keys.


    # Mouse


    A mouse is a pointing device that is used to move the cursor on the screen. It
    is quite handy for many visual applications. It is considered the most common
    type of input device after the keyboard.


    A mouse has one primary button (left button) and one secondary button (right button).
    The primary button is used to carry out most of the tasks, whereas the secondary
    button is used in special cases, such as opening shortcut menus. You can select
    icons and commands by positioning the tip of the arrow over the desired choice
    and clicking the mouse button. A small wheel between the mouse buttons lets you
    scroll through documents and web pages. To'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1


    scroll down, roll the wheel backward (toward you), and to scroll up, roll the
    wheel forward (away from you).

    Some mice are not directly connected to the computer; they are known as wireless
    mouse. They communicate with the computer by means of infrared rays or radio waves.
    Compared to serial and bus mice, cordless mouse is more costly, but it removes
    the use of wire. Figure 3 shows a mouse:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_21_0.png)


    ▲ Figure 3: Mouse


    # Light Pen


    Light pen is a light-sensitive pointing device that is used to choose a displayed
    menu. Its appearance is similar to that of a normal pen. When the tip of the pen
    is moved on the monitor screen, light is produced by the emission of electron
    beams that cause the specified position to appear by generating an electric impulse.
    Figure 4 shows a light pen:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_21_1.png)


    ▲ Figure 4: Light Pen


    # Touch Screens (Touch Panels)


    On touch screens, you can make selection by just touching the screen. A touch
    screen is shown in Figure 5:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_21_2.png)


    ▲ Figure 5: Touch Screen


    Touch screens are sensitized so that the pressure of a finger, pencil, or stylus
    enables a user to input instructions. These are very useful when menu-driven programs
    are run. The menu is displayed on the screen and the user can just touch the item
    to be selected with fingers. The touch screen works by converting an electric
    signal into surface waves directed across the screen’s glass surface.'
