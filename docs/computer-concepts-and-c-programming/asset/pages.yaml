  md: '# # Appendix: Disk Operating System


    Most Personal Computers run on the MSDOS Operating System. MSDOS refers to Microsoft
    Disk Operating System. It is estimated that almost 10 million machines run on
    the MSDOS Operating System and more than 20,000 end-user applications have been
    published to run on it.


    The Operating System is a program that provides services to the computer users
    and application programs. These services provide access to the hardware resources,
    such as the disk drives and keyboard.


    The Operating system comprises of the three major components briefly mentioned
    below:


    +   1. Refers to the hidden system files, which allows you to execute the basic
    tasks, such as reading the input received from the keyboard, presenting the received
    data on the monitor, opening and closing of the files.


    +   2. Refers to the COMMAND.COM command that can be used to interrupt the command.
    By this, you can read the commands which are typed from the keyboard and attempts
    to obey them. In addition, the COMMAND.COM possesses many simple built in commands
    termed as internal commands.


    +   3. Refers to a sequence of utility programs that contains the functions which
    are not handled by the internal commands. In addition, around S2 of the commands
    from COPY to copy files to EDIT the text editor, and lots of more commands whose
    exact number can be different in distinct versions of MSDOS.


    # ## C.1 Disks and Drives


    Contents present on Random Access Memory (RAM) are temporary available and get
    erased as soon as the computer gets switched off. In this case, you need a place
    where you can save operating system and application programs of your computer
    and also the work you have done. You can store any kind of information on disks.


    There are two types of disks: Floppy disks and Hard disks.


    +   * Floppy disks (Diskettes)

    nThe floppy disk is a thin plastic material and is magnetically coated and has
    a rigid plastic cover. Floppy disks can be used to store data (storage devices).
    You can also use the device in the following cases:


    +   - In transferring the information from one computer to'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# 464  Appendix C


    +   - In storing the application programs and the confidential work, in case when
    the hard disk is not available


    +   - In keeping a record of the operating system software’s, at times when the
    hard disk of your system is not working


    +   - In protection a copy of the information which is kept inside your hard disk,
    in the form of a disk backup


    You need to format a disk only once to erase all the data from the disk. After
    formatting a disk you can use the disk again and again without the need to reform
    it. You can reform a disk when you don’t need the data stored on. There are different
    types of diskettes. So it is important to choose diskettes that match the type
    of disk drive installed in your computer. Several available diskette types are:


    +   5.25 inch 360 Kbyte


    +   5.25 inch 1.2 Mbyte


    +   3.5 inch 720 Kbyte


    +   3.5-inch 1.44 Mbyte


    Let’s brief the following points that must be in mind before working with disk
    drives:


    +   - Allows you to draw a 720Kbyte drive to read and write 720Kbyte diskette.


    +   - Allows you to draw a 1.44 Mbyte to read and write mutually with 720Kbyte
    and 1.44Mbyte diskettes. Though, you can write both of the diskettes but need
    specialized formatting instructions required in the formatting of a 720Kbyte diskette
    under a 1.44Mbyte drive.


    +   - Clears the fact that there is no difference between a 720Kbyte diskette
    and a 1.44Mbyte diskette because of the fact that there is no extra notch on a
    720Kbyte diskette.


    # Hard Disks


    A Hard disk is a device which is bounded permanently by a sealed metal cover.
    In addition, the Hard disks are considered better compared to the Floppy diskettes
    in the following:


    +   - Hard allows you to store much more information than on a diskette. For example,
    in a 40Mbyte Hard disk, you can hold around twenty 1.44Mbyte Floppy diskettes.


    +   - Hard disks can be 10 to 100 times faster than Floppy diskettes in terms
    of finding and loading information from your computer’s memory.


    # C.2 Working with Files and Directories


    You covers the two prominent and fundamental functions which can be implemented
    on the files and directories present in your computer. You can consider their
    functions under the working of files, and in the organization of files with directories.'
  merge: -1
