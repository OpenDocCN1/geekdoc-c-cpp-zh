  md: '# Pointers ◀ 349


    # Assignment


    The assignment operation can be performed on pointer variables in different ways,
    such as assigning the address of other variables to a pointer variable. For example:


    ```

    int *ptr, a;

    ptr=&a;

    ```


    You can assign one pointer variable to another only when both variables point
    to the object of the same data type. For example:


    ```

    float *ptr1, *ptr2;

    ptr1=ptr2;

    ```


    You can assign a Null value to a pointer variable. For example:


    ```

    int *ptr;

    ptr = NULL;

    ```


    # Arithmetic


    C allows you to add integers to pointers as well as subtract one pointer from
    another. Arithmetic operation on pointers is somewhat different from the arithmetic
    operations on regular integer data types. The arithmetic operation on pointers
    refers to the addition and subtraction operations. You can add or subtract an
    integer value from a pointer variable. In case of pointers, addition and subtraction
    operations have different results that depend on the size of the data type on
    which these operations are performed. Shorthand operators can also be used with
    the pointers in arithmetic expressions, such as sum + *p2. For example, suppose
    P1 is a pointer with a current value of 2000. If P1++, the content of P1 will
    be 2002, not 2001. Each time P1 is incremented, it will point to the next integer.
    Let''s consider the following examples of adding a number to a pointer:


    ```

    int i = 5, *j, *k;

    J = &i;

    J = J+1;

    J = J+9;

    k = J+3;

    ```


    Similarly, the following examples illustrate the subtraction of a number from
    a pointer:


    ```

    int i = 5, *j, *k;

    J = &i;

    J = J-2;

    J = J-5;

    k = J-6;

    ```'
