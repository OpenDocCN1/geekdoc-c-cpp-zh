    # 5.1 Machine Language


    It is the first generation of language. Although computers can be programmed to
    understand many different computer languages. There is only one language understood
    by the computer without a translation program. This language is called the machine
    language or the machine codes. Machine codes are the fundamental language of the
    computer and is normally written as strings of binary 0-1.


    In machine language, the program to sum the two numbers can be written as:


    | Location | Instruction | Operand1 | Operand2 |

    | --- | --- | --- | --- |

    | 100 | 0101 | 10 | 11 |


    Assume 0101 is the operational code (opcode) for addition, first data x is stored
    in location 10 and second data y (operand) is stored in location 11. The instruction
    is stored in the memory location 100.'
