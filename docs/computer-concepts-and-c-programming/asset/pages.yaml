    # B.5 Saving the Document


    As you create a new file, you need to save it, so that you can retrieve the data
    whenever you want. When you save your data it gets stored in the computer''s temporary
    memory, RAM. If a power failure occurs or your computer halts, may lose all the
    work you did since last saved your file. You should make sure to save the files
    in ten minutes and finally, when you finish your task. Each MS Office program
    saves the file in a default file type. For example, MS Word uses the DOCX file
    format.


    # Saving a Document in MS Word


    You can save your data to reuse or share it with others. You should also frequently
    save any file that you are working on to protect your file from power failure
    or computer crash. When you save a file you can give it a unique filename, store
    it in a particular folder or drive. Perform the following steps to save the file:


    +   1. Click the Office button (Figure 97). A Backstage View appears.

    2. Click the Save As button in the Backstage View, as shown in Figure 97:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_475_0.png)


    ▲ Figure 97: Save Options'
