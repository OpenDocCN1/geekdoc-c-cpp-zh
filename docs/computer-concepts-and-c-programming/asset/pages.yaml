    # Copying a File


    You a file from one disk or directory to another disk or directory by using the
    COPY command.

    Perform the following steps to copy files from a diskette to a Hard disk:


    +   1. Insert the diskette containing the file you want to copy into drive A:

    2. Type COPY A:\ {filename} C:\ {pathname} {ENTER}


    In the above snippet, {filename} is referred to the full name of the file on the
    diskette and {pathname} is the directory (path) on drive C: (the hard drive) in
    which you want to copy the file.

    If the name is not specified, then the file will be copied to the root directory
    drive C. For example, if you wanted to copy a file called MEMO.TXT from drive
    A: to the root directory drive C, you would type:


    ```

    COPY MEMO.TXT C:\{ENTER}

    ```


    For copying all the files from the diskette to a directory on drive C: called
    MEMOS, you can type:


    ```

    COPY A:\* C:\MEMOS {ENTER}

    ```


    # Copying from a Hard Disk to a Diskette


    The removable media comes into use, when you need the data or your work to be
    readily available irrespective of the computer you previously worked on. .. For
    this, you can copy data from your computer''s hard disk to a diskette. Perform
    the following steps to copy the data from a hard disk to a diskette:


    +   1. Insert the diskette which you want to copy into drive A:

    2. Type: COPY C:\{pathname}\A: {filename} {ENTER}


    In the above code snippet, {pathname} is referred to the name of the file you
    want C: from which you want to copy the file and {filename} refers to the name
    of the file you want to copy on the diskette. In case, if you do not specify a
    new name, the file retains its old name.'
