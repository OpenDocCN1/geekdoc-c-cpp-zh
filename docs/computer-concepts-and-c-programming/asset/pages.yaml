    # The Relational Operators


    The relational operators in C are used to test the relation between two entities.
    The relational operators return a true or false value depending upon whether the
    condition between the two entities hold true or false. The relational operator
    also returns either zero or non zero values. The zero value is taken as false
    while the non zero value is taken as true. The different relational operators
    in C: <, <=, >=, !=.


    The different relational operators allow us to compare two values and check if
    they are equal to other, unequal, or if one is greater than the other.


    While using the == relational operator, you should be very careful, as it can
    be misunderstood by the assignment operator. For example, if you want to compare
    a and b for equality, you should write a == b, not a = b because a = b means you
    are assigning value of b to a.


    For example, consider the following cases given in Table 1:


    | Table 1: The Relational Operators

    | Case | a | b | a = b | a == b |

    | 1 | 5 | 3 | a = 3 (True) | False |

    | 2 | 7 | 0 | a = 0 (False) | False |

    | 3 | 0 | 0 | a = 0 (False) | True |


    In case 1, the value of a = 5 and b = 3. The expression value of b to a, so a
    will get 3 and it returns True value because 3 is not zero. For the same case,
    a == b does not make any assignment and returns False because the value of a is
    not equal to b.


    In case 2, the value of a = 7 and b = 0. The expression value of b to a, so a
    will get 0 and it returns False value because the value of a is 0. For the same
    case, a == b does not make any assignment and returns False because the value
    of a is not equal to b.


    In case 3, the value of a = 0 and b = 0. The expression value of b to a, so a
    will get 0 and it returns False value because the value of a is 0. For the same
    case, a == b does not make any assignment and returns True value because the value
    of a is equal to b.


    Let''s consider the program provided in Listing 5 to understand the relational
    operators in C:'
