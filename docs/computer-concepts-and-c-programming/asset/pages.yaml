  md: '# String Manipulation Functions


    The string manipulation functions are created to manipulate the values held in
    a string, in a C program. The noteworthy built-in manipulation functions, used
    in a C program are:


    +   - char *strcpy(char *deststr, char *sourcestr): Copies the sourcestr string
    to the deststr and returns the result to the calling code


    +   - char *strncmp(char *str1, char *str2, int num): Copies the number of characters
    specified as num, from the first index of the str2 string to the str1 string and
    returns the result to the calling code


    +   - int strcmp(char *str1, char *str2): Compares the str1 string and str2 and
    returns a value <0, if str1 is less than str2, >0 if str2 is less than str1, and
    0 if str1 is equal to str2


    +   - int strlen(char*str): Returns the length of the str string to the calling
    code


    +   - char *strcat(char *deststr, char *sourcestr): Concatenates the sourcestr
    string to the deststr and returns the result string to the calling code


    # Memory Management Functions


    The memory management functions are the built-in library functions which are used
    to perform tasks related to memory manipulation. The noteworthy built-in memory
    management functions, used in a C program:


    +   - free(void *memoryaddress): Frees a block of memory at the specified memory
    address


    +   - void *calloc(int numelements, int elementsize): Allocates an array of memory
    locations for the elements specified as numelements, with the specified size as
    elementsize.


    +   - void *malloc(int numofbytes): Allocates a block of memory that is similar
    to the size specified as numofbytes.


    +   - void *realloc(void *memoryaddress, int size): Reallocates the memory at
    the location specified as memoryaddress with the specified size as filesize.


    # Buffer Management Functions


    A buffer is temporary memory location that is shared by the programs and hardware
    devices to perform their tasks. The buffer management functions are built-in library
    functions which are used to manage the buffer used by a C program. The following
    are the noteworthy built-in buffer functions:


    +   - void *memcpy(void *buf, const void *sourcebuf, int num): Copies the number
    of characters specified as num from the sourcebuf to the buf buffer. The buf buffer
    corrupts in case the objects overlap.


    +   - void *memmove(void *buf, const void *sourcebuf, int num): Copies the number
    of characters specified as num from the sourcebuffer to the buf buffer. The buf
    buffer does not corrupt if the objects overlap.'
