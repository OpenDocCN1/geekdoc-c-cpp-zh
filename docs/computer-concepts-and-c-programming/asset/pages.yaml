- img_proc: true
  md: '# Disk Operating System 465


    Files: Mentioned to the collection of information which can be stored on a disk
    or diskette. In addition, you can also create a file by running the application.
    In case, you can save the letter, which is already written under the word processing
    application, by storing it as a file.


    You must consider the file name as unique. On the other hand, you can create two
    files by sharing the same name provided that they will be located on different
    disks(or in different directories).


    The file name comprises of two parts: the filename itself and an extension. In
    this example:


    ```

    RECIPE.DOC

    ```


    RECIPE is the filename and DOC is the extension. Whenever the filename possesses
    an extension, the two parts of the name is separated by a full stop.


    +   - Filenames: Allows you to consider the type of information stored in the
    file. In addition, the filename comprises of the numbers and letters and it may
    contain maximum of eight characters.


    For example:


    > PDL, README, 4JULY96, MEMO_MAY


    / \, [ ] , <, >, *, @, ;, {, } are some of the characters that cannot be used
    for writing the filenames.


    +   - Some Filenames to Avoid: Refers to the filenames which are needed to avoid
    in time when you name the files as your computer reserves these names for special
    use.

    - AUX, COM1 or COM2: Refers to the internal name assigned to the device which
    is connected with a Serial Port.

    - CON: Refers to the internal name of data sent to the keyboard or screen.

    - LPT1, LPT2, LST or PRN: Refers to the internal names for the printer connected
    to the Parallel port.


    +   - Extension: Allows you to make filenames in a descriptive form. For making
    a descriptive form, you can add the extension .doc with every document you write.
    By this, you can easily identify the files that contain the documents.


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_480_0.png)


    Many applications are available with their unique extensions that cannot be changed
    according to the user''s requirements. In case, these extensions are forcibly
    changed then it may results in the failure to upload the file by the application.
    Various valid extensions used for a filename are .bmp, .txt, .doc, .jpg.


    The extensions used for the file names are considered invalid when used as characters.'
