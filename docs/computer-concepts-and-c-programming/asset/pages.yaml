    # Spacing


    Spacing is the amount of space between two lines or paragraphs. It affects the
    readability of a document. Spacing is of two types, line spacing and paragraph
    spacing. The vertical space between the lines in a paragraph is considered by
    the term Line Spacing. On the other hand, the space above and below the paragraph
    is considered by the term Paragraph spacing.


    # Changing the Line Spacing before and after Paragraphs


    Perform the following steps to provide the line spacing before and after the paragraphs:


    +   1. Select a paragraph or a group of paragraphs.

    2. Click the Home tab.

