    The functions putc() and getc() are the file version of putch() and getchar().
    The only difference while using putc() is that it has two arguments and the second
    argument is a pointer to the structure FILE. In case of getc(), the argument is
    a pointer to the structure FILE.

    For example:

    ```c

    putc("c",ptr);

    ```

    here "c" is the character to be written in the file and ptr is the pointer to
    the file in which "c" is written.

    ```c

    getc(ptr);

    ```

    here, the function getc() reads a character from the file pointed by pointer ptr.


    +   * Closing a File

    The file should be closed after reading/writing of a file. Closing a file is performed
    using library function fclose().

    fclose(ptr);//ptr is the file pointer associated with file to be closed.

