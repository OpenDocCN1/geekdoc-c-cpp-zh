  md: '# # Problem Solving with Digital Computer


    # OBJECTIVES


    +   - The Basic Model of Computation

    - Main Programming Structures

    - Steps for Program Development

    - Pseudocode


    Problem solving is a process that includes problem finding and problem shaping.
    It is required that an artificial intelligence system needs to move from a given
    condition to a desired condition. In computer programming, problem solving is
    a systematic approach to find and implement a solution to a problem. For this,
    the basic model of computation is used. This model consists of six different phases,
    which help in developing the best solution for a program without following the
    basic model of computation. Such a practice often leads to lethargic codings that
    contain a lot of errors and are complex to understand. Different techniques, including
    algorithms and flowcharts, are used to find a solution for the problem. An algorithm
    is a simple and step-by-step description of a problem along with its solution.
    On the other hand, a flowchart is a symbolic representation of a program along
    with its solution. A flowchart indicates the path to the solution along with all
    possible alternatives using arrow-heads.


    This chapter discusses the basic model of computation with all its phases of problem
    solving. Then the chapter acquaint you with different programming structures including
    sequence, selection, and iteration. Further, you will explore the steps for developing
    a program


    # ## 4.1 The Basic Model of Computation


    Computation refers to the process of arriving at a given program, problem statement,
    or a given decision. This process of computation should be logical, and the process
    should follow a step by step approach to arrive at a meaningful output or result.
    To achieve the desirable output, you should follow the basic model of computation.


    The basic model of computation includes a series of phases starting from defining
    a problem, analyzing that problem, designing and planning the procedure to be
    followed, coding of the actual program, testing the created program, and maintaining
    the program.'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# 76 Chapter 4


    # Phase 1: Defining the Problem


    In this phase, the programmer has to define the task precisely and check for completeness.
    The defined problem should not be ambiguous, imprecise, or arbitrarily defined.


    For example, if you need to solve a quadratic equation, but it is not specified
    whether to find the value of roots of quadratic equation, or to find the nature
    of quadratic equation, or both. The problem is incomplete. Therefore, the different
    programmers may program this as per their understanding.


    # Phase 2: Analyzing Problem


    In the definition phase, the programmer has to reflect all the possibilities for
    decision-making. When the programmer defines the problem, a proper analysis of
    that problem requires. As analysis helps in designing and coding for that particular
    problem.


    In this phase, the programmer has to declare the computational strategies to analyze
    the defined problem with the help of available resources, such as database. Programming
    techniques including sequence, selection, and iteration, can be used to develop
    the logic for the analysis with the help of searching, sorting, inserting, and
    merging. Different procedures that can be followed to analyze the problem are
    arithmetic, logical, and relational.


    # Phase 3: Designing a Program


    After and analyzing the problem, you need to design the solution for the problem.
    In this phase, the basic aspect is the selection of suitable data structure, which
    depends on amount and nature of the data that is to be stored. The suitable data
    structure in the designing phase is an algorithm. It is the primary stage of the
    program that leads to correct and efficient program designing.


    Another way that can be followed a process for problem solving is the top-down
    design approach. It is a strategy where the problem is divided into a Hierarchical
    structure. A separate sub-program may be designed for each module. The top-down
    approach provides a method of handling the internal complexity. This allows the
    programmer to build a solution in a step-wise manner. Flowchart is the best example
    for the top-down design approach.


    # Phase 4: Coding a Program


    In this phase, the programmer needs to write a program with the help of coding.
    Before coding program, the logic must be developed using the program development
    tools, such as algorithm and flowchart. You can also divide a program into smaller
    sub-programs for easier programming. This procedure is called refinement of the
    original problem. You can define the data items, variables, and constants while
    writing the code for the program.


    +   - Data item definition


    +   - Initialization


    +   - Input statements


    +   - Assignment statements'
