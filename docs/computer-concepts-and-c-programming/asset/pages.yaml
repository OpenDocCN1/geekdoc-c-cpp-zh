    # Character Manipulation Functions


    The character manipulation functions are the built-in library functions used to
    perform various types of character manipulation in a C program. The following
    are the noteworthy built-in character manipulation functions in a C program:


    +   - int islower(char c): Checks if the specified character is a lower case character
    and returns nonzero value if c is a lower case character.


    +   - int isupper(char c): Checks if the specified character is an upper case
    character and returns nonzero value if c is an upper case character.


    +   - int isalnum(char c): Checks if the specified character is an alphanumeric
    character and returns nonzero if c is an alphanumeric character.


    +   - char towlower(char c): Returns the corresponding lowercase letter of the
    specified character (if one exists and if the isupper(c) function returns nonzero
    value for the character) otherwise, it returns c.


    +   - char toupper(char c): Returns the corresponding uppercase letter of the
    specified character (if one exists and if the islower(c) function returns nonzero
    value for the character) otherwise, it returns c.


    # Error Handling Functions


    The error handling functions are built-in functions that are used to manage errors
    during C programming. The following are the noteworthy error handling built-in
    functions used in a C program:


    +   * void error(const char*str): Displays a message on standard error output
    that describes the last error encountered in a C program.


    +   * char strerror(int errcode): Returns a string describing the error code passed
    as the argument errno.


