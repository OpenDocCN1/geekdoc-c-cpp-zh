    # Checking the Condition of a Disk


    For checking the conditions of the disk, the CHKDS command is used. Following
    is the conditions, where you occasionally use the CHKDS command:


    +   To check a disk for space available and the space in use.


    +   To fix the errors, such as files that show a non-zero size but actually do
    not have any data in them.


    +   To check the display in terms of the access to Random Access Memory (RAM),
    including the total disk space, the number and size of files.


    +   To check the display in terms of the access to Random Access Memory (RAM),
    whether is available to MS-DOS (Temporary memory in your computer!) or not.


    Run CHKDS occasionally on all disks to check for errors.


    The command:


