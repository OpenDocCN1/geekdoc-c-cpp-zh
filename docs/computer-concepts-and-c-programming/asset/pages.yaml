    # 1.2 Types of Functions


    While writing programs using the C language, various statements such as printf(),
    scanf(), getch(), and clscr() are used in most of the programs. These statements
    are functions, which are already defined in C library. Moreover, the main() function
    is the function from where the execution of a program starts; therefore, this
    function is used in all the C programs.


    The various functions that the C compiler provides to the programmers are called
    built-in functions. These functions are also called built-in functions or built-in
    library function. In addition to the functions provided by the C compiler, you
    can create functions in your C program to perform various tasks. Therefore, you
    can conclude that there are two types of functions used in C programs:


    +   * Built-in functions

    * User-defined functions


    # Built-in Functions


    Built-in functions or built-in library functions are the functions provided in
    the library of the C compiler. These are the functions that are commonly required
    to write a C program. Therefore, these functions are created and stored in the
    library of the C compiler by C developers. The various types of built-in library
    functions in C are as follows:


    +   * String manipulation functions

    * Memory management functions

    * Character manipulation functions

    * Error handling functions'
