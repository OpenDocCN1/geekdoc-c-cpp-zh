  md: "# 13 Structures and Unions\n\nOBJECTIVES\n\n+   - Structures\n- Unions\n\n\
    As you know, arrays are used to store a set of values of the same data type. However,\
    \ in many situations, it is required to store a set of values of different data\
    \ types together. For example, you may need to store the complete record of each\
    \ student, including roll number, name, age, and grade, at one place. The different\
    \ fields of the student record consist of different types of values, for example,\
    \ roll number and age are of int, and name and grade are of char; you cannot use\
    \ an array to store a student record. In such a situation, you can use a structure\
    \ or union, each of which provides a way to store values of different data types\
    \ together.\n\nIn this chapter, you will learn about structure and how to define\
    \ a structure. Next, you will learn how to declare variables of a structure type\
    \ and initialize these variables. Further, you will learn how to create nested\
    \ structures and arrays of structures. In addition, you will learn about the typedef\
    \ statement. In the end, you will learn about a union, how to define a union,\
    \ and how to access and initialize variables of a union type.\n\n# 13.1 Structures\n\
    \n> A structure refers to a user-defined data type that contains variables of\
    \ different data types grouped under a common name.\n\nEach member of a structure\
    \ is assigned a separate memory location.\n\n+   - Defining a Structure\nnYou\
    \ must define a structure before using it in a program. Definition of a structure\
    \ starts with the struct keyword, followed by the name of the structure, a pair\
    \ of curly braces containing declaration of a set of variables called structure\
    \ members, and then a semicolon. The syntax for defining a structure is:\n\n```\n\
    struct structure-name\n{\n  data-type_1 variable_1;\n  data-type_2 variable_2;\n\
    ```"
