  md: '# Introducing the C Language 99


    Object-oriented programming (OOP) is a programming paradigm that uses "objects"
    and their interactions to design applications and computer programs. Programming
    techniques may include features such as encapsulation, modularity, polymorphism,
    and inheritance.


    +   ■ Fundamental concepts


    # Class


    Defines the abstract characteristics of a thing (object), including the thing''s
    characteristics (its attributes, fields or properties) and the thing''s behaviors
    (what it can do, or, operations or features). For example:


    | Name | Student | Circle |

    | --- | --- | --- |

    | (identifier) | | radius |

    | Variables | name | color |

    | (Static attributes) grade | getName() | getRadius() |

    | Methods (Dynamic behaviors) | printGrade() | getArea() |


    # Object


    The term "object", however, refers to an actual *instance* of a class. Every object
    must belong to a class. Suppose we have a class called "Animal". All Animals have
    bodies and brains. So, this general "template" of an Animal does not change.


    An instance of the Animal class would be a *specific* animal – like a lion, a
    cat, or a zebra. These instances of the Animal class would be called objects.
    Whereas the Animal class is a general concept, the instances of that class – the
    lions, cats, etc – take that general concept and create an instance of it.


    # Method


    A method is a collection of statements that are grouped together to perform an
    operation. For example, getArea() is a method to find out the area of a circle.


    # Message passing


    Message passing is defined as a process by which an object sends data to another
    object or asks the other object to invoke a method.


    Objects communicate with one another by sending and receiving information. A message
    for an object is a request for execution of a procedure. Message passing involves
    specifying the name of the object, the name of the function (message) and the
    parameter needed by function or method if any.'
