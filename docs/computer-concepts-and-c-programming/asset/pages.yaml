  md: '# Appendix: Working with MS Word 2007


    While scripting a document for the first time, you need to consider various issues
    regarding the document, such as its text size, font size, and typeface. This appendix
    explains how to format text and pages. It also acquaints you with the techniques
    used to prepare a document and the new features of Microsoft Word for getting
    a professional look to the pages.\ this chapter, you will learn how to customize
    a page size and change the orientation of the document. You also learn how to
    insert symbols, equations, and hyperlinks in a document. As you know, a paragraph
    is created by typing text and then pressing the ENTER key. The paragraph can be
    a single word, a single sentence, or multiple sentences. In this chapter, you
    will also learn how to change the look of a paragraph by changing its alignment,
    line spacing, the space before and after it. Finally, you will learn to put borders
    around a paragraph and shade its background.


    # B.1 Considerations before Preparing a Document


    When you open MS-Word, you see a blank document that covers most of the space
    of your computer screen. This space is known as workspace. You need to consider
    the page and text settings on this workspace before preparing a document:


    +   - Setting the page margins

    - Setting the size of the document

    - Setting the orientation of the page

    - Selecting the font and font-size of the text


    # Page Margins


    Page margins are the empty spaces along the left, right, top, and bottom edges
    of a page. Headers and Footers fall, respectively, in the top and bottom margins
    of a page. You can also put graphics, text boxes, and page numbers in the Headers
    and Footers. Margins help in framing the text, making it easier to read. Microsoft
    Word offers you types of page margins, such as top and bottom. By default, Normal
    margin has been configured by Microsoft Word 2007.'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# 422 Appendix B


    +   Document Size


    Document size defines the size of your document. There are several types of document
    sizes available in Microsoft Word, such as standard, legal, letter size. By default,
    the document is printed on the standard size that is 8.5" x 11"; however, you
    can also change the size of your document. The size of the document includes the
    height and width of the document. You can select any kind of size depending upon
    your requirement.


    +   Orientation of the Document


    Microsoft Word provides two types of orientations to a document namely, portrait
    and landscape. In the portrait style, the document is oriented from top to bottom
    of the page. Generally, the documents are printed in the portrait style. The landscape
    orientation is the one in which the page is wider than tall, like in a painting
    or a scenery. The landscape orientation is mostly used to accommodate any text
    or an image that is too wide to fit across the page in the portrait orientation.
    Wide images, a table with many columns, or a line of programming code are few
    examples where landscape width is used.


    +   Fonts


    The combination of letters, numbers, and symbols together a form. They can also
    possess a particular typeface, which includes the italic and bold distinction
    in letters, symbols, and numbers. The font determines the appearance of the text
    and also the features, such as size of the letters and color of the letters plays
    a significant role in text appearance. You can also make your text more attractive
    by applying various text effects or font styles, such as italics or boldface.


    # B.2 Setting Size, Margin, and Orientation of a Document


    Let''s learn how to apply various settings, such as page margins, document size,
    orientation, and fonts to a document.


    +   Setting Page Size


    Perform the following steps to set the page size:


    +   1. Select the Page Layout tab (Figure 1).


    +   2. Click the Size button in the Page Setup group (Figure 1).


    +   3. Select the desired page size from the drop-down list, as shown in Figure
    2:'
