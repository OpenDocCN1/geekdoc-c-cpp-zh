  md: '# Problem Solving with Digital Computer ◄ 77


    +   - Imperative statements

    - Conditional statements

    - Control transfer statements

    - Loop structures/ Iterative structures

    - Comments whenever necessary


    # Phase 5: Testing a Program


    After writing a program, programmer needs to test the program for completeness,
    correctness, reliability, and maintainability. This phase enhances the quality
    of the program. To test any program, it is important to identify the available
    data based on the specific criteria of selection and the level at which the data
    is tested.


    # Selection of Data for Testing Purpose


    Testing of data is relevant only if the selection of data is accurate and appropriate.
    Selected data can be live data or artificial data. The live data can be collected
    from the existing system, which is required for a live project.


    # Levels of Testing the Program


    You can test a program at four levels:


    +   - Unit testing: Refers to testing in which a complex program is divided into
    sub programs and each module can be tested separately.

    - Program testing: Refers to testing in which a program is sufficiently small
    to test at once.

    - Verification testing: Refers to the process of using a program in a simulated
    environment and looks for the design specification.

    - Validation testing: Refers to the process of using the program in a live environment
    and looks for errors.


    # Phase 6: Maintaining Program


    This phase includes either the improvement of the program or the correction that
    arises during the execution of the program. Improvement or amendment in the program
    requires proper documentation of the program. If one programmer has developed
    the program and another programmer is involved in maintenance, then he/she must
    have complete information about the data items and logical development of program.
    Even the program must have the security so that no one can access the program.


    # 4.2 Main Programming Structures


    The programming can be categorized in three main structures:


    +   - Sequence: Implies that there is no intervening control structure and the
    control flows normally from one step to the next step in sequence. In sequence,
    the statements should be one under the other without any change in control.'
