  md: '# Appendix: Frequently Asked Viva Questions


    +   Q1. What do you understand by hardware and software?


    Ans. In terms of computers, any component of the computer system that you can
    touch known as hardware. Typically, computer devices, such as keyboard, mouse,
    printer, monitor, and electrical equipments installed inside the system unit are
    referred as hardware. On the other hand, software is program or set of instructions
    used to carry out some tasks such as, displaying result to the user. Application
    software and system software are two categories of software.


    +   Q2. What is a Computer System?


    Ans. A computer is an electronic device that executes a program and communicates
    with the outside world through peripherals. The programs executed by the computer
    create or manipulate data. Examples of data are numbers and text. Both programs
    and data are normally stored as files on magnetic storage devices, such as cassettes,
    tapes or disks. A file is a collection of information that has a name and can
    be manipulated as a unit.


    +   Q3. How are computers used in health field?


    Ans. Computers can be used in the field of health and hospital management in following
    ways:


    +   a. Medical and accounting data of each patient is maintained from the time
    of admission until discharge.


    +   b. Drug records are used to monitor inventory, to determine the overall effectiveness
    of specific drugs, to determine which drugs have adverse side effects, etc.


    +   c. Laboratory records are maintained so that there is a proper coordination
    between test, and billing.


    +   d. Statistical records are maintained to assist researchers in diagnosing,
    preventing, and curing illness.


    +   e. Auditing of hospital records and procedures are facilitated.


    +   f. Traditional billing, payroll, accounts receivable, and accounts payable
    are performed.


    Ans. A magnetic core memory is a form of Random Access Memory (RAM) that consists
    of a doughnut-shaped ferrite element called magnetic core. This core can be'
  merge: -1
  pgno: 530
- img_proc: true
  md: '# 516 Appendix G


    magnetized in one of directions — clockwise or counterclockwise. A core that

    is magnetized in the clockwise direction is said to be "on", whereas a core

    magnetized in a counterclockwise direction is said to be "off". "On" cores represent

    the binary digit 1 and "off" represent the binary digit 0.


    Q5. What is Integrated Circuits? Explain.


    Ans. Integrated circuits consist of hundreds of electronic components on a silicon\wafer.
    Current flowing in a circuit represents an "on" state used to represent the

    binary digit 1; when current does not flow, it represents binary digit 0.


    Q6. What is the function of the Central Processing Unit?


    Ans. The central processing unit (CPU) is a physical device that controls the
    computer

    operations. It is the "brain" of a computer system. The program specifies the

    functions required for a particular problem. All operations performed by a computer

    system are controlled by the central processing unit. The operations performed
    by

    a CPU can be categorized as follows:


    +   a. Input               b. Data Transfer

    c. Arithmetic           d. Logic

    e. Output


    Q7. What is a chip set?


    Ans. A chip set is a collection of integrated circuits mounted on the mother board
    of a

    computer. It functions such as graphic and data transfer control, memory

    control to the computer system.


    Q8. Briefly explain the function of system bus.


    Ans. A system bus is a physical connection (such as a printed circuit, cable)
    between

    Central Processing Unit (CPU) and the main memory of a computer. All it is also

    known as front side bus or memory bus.


    Q9. What does CMOS stand for? What does it contain?


    Ans. CMOS stands for Complementary metal oxide semiconductor. It is a small memory

    element mounted on a motherboard that contains BIOS settings.


    Q10. What is a Plotter?


    Ans. A plotter is an output device (a type of printer) that generates high quality
    vector

    graphics as its output. There are various kinds of plotters depending upon the

    method that is used for plotting graphics on paper. For example, pen plotter uses
    a

    pen to plot graphics whereas, electrostatic plotter uses electrostatic

    charge for drawing hardcopy images.


    Q11. Output can be divided into two categories. What are they?


    Ans. Soft copy and hard copy


    Q12. What is keyboard?


    Ans. A computer keyboard looks like a typewriter. Besides the normal alphabet
    keys, it

    also has a numeric keypad located to its right. The numeric keypad is configured'
  merge: -1
  pgno: 531
