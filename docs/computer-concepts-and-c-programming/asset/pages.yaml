  md: '# 12.1 Understanding Strings in C


    In C language, a string is a one-dimensional character array where each element
    is either a character constant or a string constant. For example, you create an
    array of characters that stores the vowels of English language. Then, the vowels
    (a, e, i, o, and u) are either character constants or string constants.


    Now, let''s explain how a string is stored in the main memory of a computer. Consider
    an example of storing the word, kogent. The kogent word contains six characters.
    Figure 1 shows the storing of the kogent word, in C language:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_299_0.png)


    > Figure 1: Displaying the Storage of a String


    As similar to a numerical array, the first element of a string is stored at 0th
    position: the second element is stored at 1st subscript position, and so on. In
    addition, the last character of the string is stored at n-1 subscript position,
    where n is the total number of characters. Now, there is a difference between
    a numerical array and a character array or string. The difference is that a character
    array or string stores a null (0) character at the nth subscript position, while
    a numerical array does not store such a character. This means that, a character
    array or string stores n+1 elements, because the last character of the array is
    always null.


    # 12.2 Declaring and Initializing a String


    As similar to a numerical array, a character array or a string is declared as
    follows:


    ```

    char <variable_name>=[array_length];

    ```


    In the preceding syntax, <variable_name> stands for a user-defined string name,
    and <array_length> stands for the size of the array or string.


    A array or string variable is initialized by either assigning a character constant
    individually or assigning all characters collectively. When you initialize a string
    variable by assigning character constants individually, you use single quotes
    ''''. The following example shows the declaration and initialization of a string
    variable using the single quotes:


    ```

    char month[8]={''J'', ''A'', ''N'', ''U'', ''A'', ''R'', ''Y'', ''\0''};

    ```


    In the preceding example, an array of characters or a string variable, month,
    is declared and initialized. The size of this string variable is 8. All the characters
    are assigned individually. The null (\0) character is also assigned manually for
    the 7th subscript position of the array.'
