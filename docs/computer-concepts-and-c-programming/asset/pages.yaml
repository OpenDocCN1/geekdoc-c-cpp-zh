    # CACHE Memory


    Cache memory is a special type of memory, which is used to speed up a system.
    A cache memory is a block of fast RAM placed between the processor and slower
    memory, i.e., main memory (see Figure 25). When the CPU reads the information
    from the slower memory, information is copied into it again, it can be further
    read from the faster cache memory. Thus, the cache memory increases the operating
    speed of the system. However, it is much costlier than the main memory. As per
    the economic concern, the capacity of the cache memory is lesser compared to the
    main memory. The placement of the cache memory is shown in Figure 25:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_34_0.png)


    > Figure 25: Cache Memory Placed between the Processor and Main Memory'
