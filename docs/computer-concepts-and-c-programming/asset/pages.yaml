  pgno: 244
- img_proc: true
  md: '# 230 ► Chapter 10


    > The C language does not perform bound checking for arrays; therefore, you need
    to ensure that you are not trying to access an array element that falls outside
    the array boundary.


    Following are some rules that need to be kept in mind while using arrays:


    +   - The array should be declared with some data type

    - The size of the array should be specified at the time of its declaration

    - In an array, elements are stored sequentially, that is, in contiguous memory
    locations

    - Only one element can be added or removed from the array at a time


    # 10.2 Types of Arrays


    Arrays can be broadly classified into two types: one-dimensional arrays and multi-dimensional
    arrays. A one-dimensional array has only one subscript and a multi-dimensional
    array has n subscripts, where n represents the dimensions of the array. Multi-dimensional
    arrays can be further classified into two-dimensional and three-dimensional arrays.
    The dimensionality of an array is determined by the number of pairs of square
    brackets placed after the array name. For example, array[1] represents a one-dimensional
    array, array[2][] represents a two-dimensional array, and array[3][][] represents
    a three-dimensional array. Each pair of square brackets contains the number of
    elements corresponding to a specific dimension. In this chapter, you learn about
    the following types of arrays:


    +   - One-dimensional arrays

    - Two-dimensional arrays


    # One-Dimensional Arrays


    A one-dimensional array or a single dimensional array is used to store a linear
    list of values of the same type. The elements starting from zero to one less than
    the size of the array. Each element in a one-dimensional array is accessed using
    the same name and a single subscript. A one-dimensional array is similar to a
    row matrix or a column matrix.


    # Declaring a One-Dimensional Array


    Similar to an ordinary variable, you need to declare an array before using it.
    A one-dimensional array can be declared using the following syntax:


    ```

    data_type array_name[size];

    ```


    In the preceding syntax, data_type represents the data type of the array to be
    declared, array_name represents the name of the array, and size represents the
    number of values of the data_type that be stored in the array_name.


    The following code snippet declares an integer array, myArray, of size 10:


    ```

    int myArray[10];

    ```'
