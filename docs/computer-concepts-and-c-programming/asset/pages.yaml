    - Working with Functions and Pointers

    - Working with Arrays and Pointers

    - Allocating Memory at Runtime


    You are already familiar with how to declare variables and assign values to these
    variables in C language irrespective of the fact that these variables are stored
    in the memory. You should know the concept of pointers to know the memory location
    of the variables. A pointer is a concept used with the computer''s memory. The
    memory of a computer is represented as an array of consecutive memory locations,
    which have a unique identification number. This number is known as the address
    of that particular memory location. These addresses are used to easily locate
    the variables and find out their values.


    In this chapter you will learn about pointers in the C language. Next, you will
    learn how to declare a pointer variable. The chapter also discusses about the
    address of operator, which is used to determine the address of a variable. Further,
    you will learn how to initialize a pointer variable as well as how to dereference
    a pointer. In addition, you will learn how to perform operations, such as arithmetic,
    comparison, and assignment, on pointers. In the end, you will learn how to use
    pointers with functions and arrays, and allocate memory at runtime.


    # 14.1 Understanding Pointers


    A pointer is a variable that stores the memory address of some other variable
    that is stored in the same computer where the pointer variable is stored. The
    pointer variable contains only the address of the referenced variable not the
    value stored at that address. Pointers are generally used to point to the variables,
    such as array, functions, structures, unions, and the variables of any basic data
    type. Some of the advantages of using pointers are:


    +   - Pointers are used to point to different data structure'
