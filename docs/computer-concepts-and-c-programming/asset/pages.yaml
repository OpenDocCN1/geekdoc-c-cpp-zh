    # ## The Unary Operators


    The unary operators in C are used to act upon one operand, to produce a new value.
    The unary operators appear before the operator and are associated with the operand
    left to right. The most commonly used unary operator in C is the unary minus operator.
    The unary minus operator, a minus sign precedes the operand assigning a negative
    value to the operand. For example.


    ```

    a = 3 and b = 4

    c = a + (-b)

    ```


    In this case, the value of c, when calculated, is -1. This is because b, which
    initially had a positive value, is changed to negative when preceded by the unary
    minus operator.

