  md: '# Secondary Storage Devices


    We know that the primary memory is volatile in nature. Therefore, to store our
    data permanently, we need secondary memory or secondary storage devices. The secondary
    memory is also called backup storage devices. Moreover, these devices are cheaper
    than other storage devices and offer large storage space in the same binary codes
    similar to primary storage.


    Now, let us discuss about some of the storage devices.


    # Floppy Disk Drive


    Floppy disk drive is a drive that allows a user to save data to a removable disk.
    The floppy disk is of different sizes, such as 8-inch, 5.25-inch, and 3.5-inch.
    The 3.5-inch disk has been the most popular size over the years. The floppy disk
    drive is an internal device which is attached with an open drive bay of the system
    case. This is a magnetic storage device and also a removable storage. A floppy
    disk and a floppy drive are shown in Figure 26 and Figure 27:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_35_0.png)


    ▲ Figure 26: Floppy Disk Drive


    ▲ Figure 27: Floppy


    # Hard Disk Drive


    The computer''s largest secondary storage location is its Hard Disk Drive (HDD).
    The hard disk is a device that stores all programs and data in a computer. Therefore,
    the hard disk is referred to as the memory bank of a computer. The hard disk is
    placed inside the system unit and connected to the motherboard. Hard drives are
    mechanical devices which store data magnetically. Magnetic storage devices are
    flat objects in a round shape, which spins around its center. The magnetic disk
    has read/write head which reads the data from or writes to the disk. The hard
    disk is a non-removable storage device and is considered permanent storage. The
    capacity of the hard disk is measured in Giga Bytes (GB) and Terabytes (TB). It
    typically ranges from about 40 GB to 400 GB, or it can be higher up to 2 TB. An
    HDD is shown in Figure 28:'
