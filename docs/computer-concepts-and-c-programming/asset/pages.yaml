    # 14.9 Allocating Memory at Runtime


    During compilation, C compiler needs to know number of elements in an array. If
    the array elements are not found in appropriate number, the program execution
    fails or causes wastage.


    In some languages, such as BASIC, it is possible to input the array size during
    program execution. This process of allocation of memory size at runtime is referred
    to as dynamic memory allocation.


    In C, there are four routines called memory management functions for the purpose
    of memory management. Table 1 describes the tasks of these functions:


    | Table 1: Describing the Tasks of the Memory Management Functions |

    | Function | Task |

    | malloc() | Allocates memory from a pool and returns a pointer to a block of
    contiguous memory of the specified size |

    | calloc() | Allocates memory for array elements, initializes them to 0, and returns
    a pointer to the memory |

    | free() | Frees the memory block that are previously allocated by malloc() and
    calloc() |

    | realloc() | Modifies the size of a previously allocated memory block |


    Global variables and program code are stored in permanent storage. However, local
    variables are stored in a memory region called apart from permanent storage and
    stack is used for dynamic allocation and called heap. Size of a heap varies throughout
    the program execution because memory is allocated and deallocated to local variables
    during the execution of the functions by one. Let''s discuss all the aforementioned
    memory management functions by one.


    +   - malloc()


    When A compiler executes a function, the memory is allocated to local variables.
    This memory is taken from a free pool. Free pool refers to a memory that is not
    used by a program. After completing the execution, allocated memory is returned
    to the free pool for subsequent use. The syntax of malloc() is as follows:


    ```

    malloc(nob);

    ```'
