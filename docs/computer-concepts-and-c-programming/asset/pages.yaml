  md: '# 8.3 Type Casting in C


    Type Casting in C is referred to the process of converting an expression of a
    given type into another type. For example, in some applications, you may want
    to change the data type of a variable from int to float or vice-versa. This process
    is commonly known as the data type conversion which changes the nature of the
    data stored in a variable.


    Let''s consider the following example:


    ```

    main ()

    {

    int k=2;

    float t;

    t = 1/k;

    }

    ```


    In the preceding example, the value of t will be calculated as 0, which is not
    the correct answer. The correct value of t is 0.5. This error can be resolved
    by using type casting and rewriting the preceding program in the following manner:


    ```

    main ()

    {

    int k=2;

    float t;

    t = 1/(float)k;

    }

    ```


    In this way, the correct value of t will be evaluated.


    # 8.4 Implementing Mixed Mode Operation


    There are several instances when a single program in C involves both the integer
    and floating-point element type. This kind of expression is called the mixed mode
    expressions in C. In such a situation, which involves integer and floating point
    elements, the result that is generated is of the float type. When this value is
    assigned to an identifier, which is of type int, the value is truncated.


    Let''s understand this better with the following code:


    ```

    int a = 5;

    int b = 2;

    float x = 8;

    float y = 10;

    a = (x/y) + a/b;

    b = (a*x)/y;

    x = a-b;

    ```'
