  md: '# 16 Standard Preprocessors


    OBJECTIVES


    +   * Rules for Writing Preprocessor Directives

    * #define Directive

    * #include Directive

    * #if, #elif, #else, and #endif Directives

    * #undef Directive

    * #ifdef Directive

    * #ifndef Directive

    * #error Directive

    * Predefined Macro

    * Command Line Arguments in C


    In C programming language, a preprocessor comprises a part of the C compiler packages.
    It is a program that processes the source code before compiling and translating
    it into a machine language and hence the name.


    In other words, preprocessor statements provided in a program are not the program
    statements; however, they are the directives of preprocessor. Programmatically,
    you can provide various instructions to the compiler in the source code of a C
    language by using the preprocessor directives. For example using the #include
    preprocessor directive, you can instruct the compiler to include a header file
    in a program. In C, the preprocessor acts as a separate program that is invoked
    by the compiler before translating the program into the machine language. They
    use the preprocessor directives to instruct the compiler to perform specific actions.
    For example, a preprocessor allows you to insert the contents of a header file
    in the source file or defines the value of a macro.


    In the source code, the preprocessor statements are placed before the main() function.
    Preprocessors are also referred to as macro processor as they enable you to define
    macros, which are a set of commands represented in an abbreviated form.'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'Table 1 lists the commonly used preprocessor directives of the C language along
    with their functionalities:


    | Table 1:Common used Preprocessor Directives and their Functions |

    | Directive | Function |

    | #include | Specifies the files to be included |

    | #define | Defines a macro substitution |

    | #undef | Undefines a macro |

    | #ifdef | Tests for a macro definition |

    | #ifndef | Tests whether or not a macro is defined |

    | #if | Tests a compile-time condition |

    | #endif | Specifies the end of the #if directive |

    | #else | Specifies alternatives when the #if directive fails |

    | #elif | Allows to take one action if the condition is not true |

    | #elif | Allows to take one action if there are multiple decision points |

    | #error | Prints error message |


    Write a short note on preprocessor directives. (*Computer concepts and C programming.*)


    The directives listed in Table 1 are categorized under the following three types:


    +   - The file inclusion directives: Refer to the directives that insert the contents
    of source files

    - The macro substitution directives: Refer to the directives that define macros

    - The compiler control directives: Refer to the directives that help in identifying
    the parts of code to be compiled under some special conditions


    This chapter helps you understand the rules for writing preprocessor directives.
    It explores the various preprocessor directives, such as #include, #define, #if,
    #elif, #else, #endif, #undef, #ifdef, #ifndef, and #error. Further, the chapter
    provides a brief discussion on predefined macro construct. It outlines command
    line arguments in C.


    # 16.1 Rules for Writing the Preprocessor Directives


    Preprocessor directive statements are always preceded with a hash (#) symbol and
    never end up with a semicolon (;). Space and tab characters are the only characters
    that are allowed to precede the # character in a single line. The newline character
    is used to end a directive'
