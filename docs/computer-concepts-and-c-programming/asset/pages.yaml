  md: '# Introduction to Digital Computers


    The light patterns reflected by the bar code reader are detected by a photodiode
    which produces electric pulses that are matched with the printed bar code pattern.
    This signal is then converted back to the original data by electronic circuit.


    The bar code represents a number. This number is the data input into the computer
    system.


    Bar codes are used in supermarket systems and they are also used in many libraries.
    In a supermarket, each item has a bar code representing a 13 digit number. It
    is far quicker for the bar code scanner to read this number than for the checkout
    assistant to enter it manually. Figure 10 shows a bar code and a bar code reader:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_24_0.png)


    Figure 10: Bar Code and Bar Code Reader


    # Magnetic Ink Character Recognition


    Magnetic Ink Character Recognition (MICR) is similar to OCR. The only difference
    is that in MICR, the texts are scanned magnetically as they are encoded in magnetic
    ink in which each character holds different shapes. However, MICR is much more
    expensive than OCR.


    MICR is used on cheques by banks to encode bank account numbers. The numbers encircled
    at the bottom of the cheque (see Figure 11) are encoded in magnetic ink for use
    with MICR readers at the bank.


    Compared to OCR, MICR is preferred by banks because of the faster reading speed
    and extra security against forgery. Any MICR is shown in Figure 11:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_24_1.png)


    Figure 11: MICR'
