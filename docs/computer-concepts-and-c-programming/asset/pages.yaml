    # 9.2 Working with Conditional Statements


    A conditional statement is a control structure that allows you to select one or
    more execution paths in a program. It causes a program to execute a block of code
    after evaluating a given conditional expression. The block of code associated
    with the conditional expression is executed if the evaluation of the conditional
    expression results in true; if it results in false, it is skipped. The following
    is the list of the conditional statements supported by C:


    +   - if statement

    - if-else statement

    - Nested if

    - if-else ladders

    - switch statement

    - Nested switch statements


    # Using the if Statement


    The if statement can execute either a simple or compound statement depending on
    the result of an expression. The syntax to use the if statement is:


    ```

    if(conditional expression)

    statement;

    ```'
