- img_proc: true
  md: 'Placement method: In method, we write down the column headings from 1 up to
    a number larger than our decimal number. For example, if the decimal number is
    177, we write down the headings as follows:


    | 256 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    Now, 256 cannot be part of the number, so we put 1 in the next column (128):


    | 256 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | 0 | 1 |


    Once we have "placed" 1 in this column, we subtract 128 from 177 to get 49. We
    now need a 0 in the 32 column:


    | 256 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | 0 | 1 | 0 |


    We subtract 32 from 49 to leave 17, which is, of course, (16 + 1):


    | 256 | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |

    | 0 | 1 | 0 | 1 | 1 | 0 | 0 | 1 |


    > .(177)$_{10} = (010110001)$_{2}


    This method is easily and likely likely to proceed without error.


    Repeated division-by-2 method: In this method, divide the given number by 2, which
    gives quotient and remainder. Write down the remainder and repeat this process
    until the quotient becomes 0.


    For example, consider the decimal number 177 and see the following procedure:


    | Repeated division-by-2 | Number | remainder |

    |---|---|---|

    | 177 divide by 2 | | 88 | 1 |

    | 88 divide by 2 | 44 | 0 |

    | 44 divide by 2 | 22 | 0 |

    | 22 divide by 2 | 11 | 0 |

    | 11 divide by 2 | 5 | 1 |

    | 5 divide by 2 | 2 | 1 |

    | 2 divide by 2 | 1 | 0 |

    | 1 divide by 2 | | 1 |'
