- img_proc: true
  md: '# Disk Operating System 475


    The DIR command used in this way results in listing the files in the current directory
    only. If you want to list files of another directory or another drive, you can
    type the DIR command followed by the location. The command used if you are in
    the root directory of C:\ as follows:


    ```

    DIR A:\REPORTS /W {ENTER}

    ```


    The command in the code snippet below displays a list of the contents of the drive
    A.. In addition, it reports directory in a Wide format, that is five filenames
    per line with no details.


    # Making a New Directory


    To make subdirectories, you can use the MKDIR command (MD for short).


    For creating a new subdirectory called USER under your current directory type
    the following command:


    ```

    MKDIR USER {ENTER}

    ```


    The subdirectories you have created by using the MKDIR command always appear as
    subdirectories of your current directory, unless explicitly specify a different
    path.


    You can create a directory named PET under the MEMOS directory type by entering
    the following command:


    ```

    MKDIR\MEMOS\PETE {ENTER}

    ```


    # Removing a Subdirectory


    You can delete a subdirectory using the RMDIR (RD for short) command. Before you
    run RMDIR, you should remember that:


    +   - you can eliminate a subdirectory if it does not contain any files or subdirectories.

    - you can remove only one subdirectory at a time.

    - you cannot remove the ROOT directory.


    +   - you cannot remove the current directory. You must first empty it, and move
    out to its parent directory to remove it.


    For example, to remove the subdirectory called REPORTS:


    +   1. Type DEL\REPORTS {ENTER}. This command deletes ALL the files in the reports
    prompts

    2. MS-DOS prompts you with the following: Are you (Y/N) ? if you want to delete
    all the files in the directory, type Y for yes and N for no.

    3. Type RD \REPORTS {ENTER} allows you to remove directory (or the subdirectory).


    # Changing from one Directory to Another


    You can change the location from the current directory to the desired one in which
    you want to work by using the CHDIR command (CD for short). For changing to a
    directory called APRIL, you can use the command as follows:'
  merge: -1
  pgno: 490
- img_proc: true
  md: '# 476  Appendix C


    ```

    CHDIR \APRIL {ENTER}

    ```


    If APRIL were a subdirectory of the REPORTS directory, you would type:


    ```

    CHDIR \REPORTS\APRIL {ENTER}

    ```


    For changing to the ROOT directory from any other directory or subdirectory, you
    can use the following command:


    ```

    CHDIR\ {ENTER}

    ```


    For changing parent directory of your current directory, you can use the command
    as follows:


    ```

    CDDIR.. {ENTER}

    ```


    # Moving from one Drive to Another


    For moving or logging on to another drive does not require a MS-DOS command. For
    this, you need to type the name of the drive and colon. From the C:\> prompt you
    can type the command as follows:


    ```

    A: {ENTER} to log onto drive A: or... D: {ENTER} to log onto drive D:

    ```


    # Setting a Command Search Path


    By using the PATH command, you can specify the directories in which MS-DOS should
    search for an external command or application program, after it has gone throughout
    (or searched) the current directory.


    > During the booting process, the PATH variable is mostly set in a file AUTOEXE.BAT.


    You can type the following command on the command prompt:


    ```

    PATH = \LEMMINGS

    ```


    # Naming a Disk or Diskette


    For naming a disk or diskette you can use the LABEL command. You can also use
    this name as Volume Label. In addition, the LABEL command is used to change or
    delete the current Volume Label. For example, call a diskette in drive A: BOOT,
    you can type:


    ```

    label a:boot {ENTER}

    ```


    The Volume Label can possess up to 11 characters long, and may not include spaces,
    or TABs. Moreover, you need to use the underscore (_), or the minus- sign, to
    create a break between words.


    For deleting the Volume Label, type LABEL and press {ENTER).'
  merge: -1
  pgno: 491
- img_proc: true
  md: '# Disk Operating System 477


    After this, MS-DOS asks you if you want to delete the current volume label. You
    can type Y(yes), which allows the LABEL deletes the current volume label, otherwise
    it remains the same.


    Let''s next learn about the MS-DOS batch commands in the following section.


    +   - MS-DOS Batch Commands


    The batch file is a file which carries a sequence of MS-DOS commands. You can
    save your time by saving your command in the batch file which is required to repeat
    multiple instances in time. In this, you need to simply type the name of the batch
    file and then the MS-DOS will carry out the command sequence, having one command
    at a time, until the end of the file is reached.


    # Creating and Running a Batch File


    You can create a batch file using the COPY command. On the other hand, with the
    help of EDIT command or any word processing program that allows you to save files
    as ASCII text can be used for creating a batch file.


    You can create batch files having the following features:


    +   - Need to format a blank diskette

    - Need to copy all the files in the current directory on to that diskette

    - Need to list the files copied to the diskette


    # Using the COPY Command


    +   - At the MS-DOS prompt type the following:


    ```

    COPY COPYFILE.BAT {ENTER}

    FORMAT A:

    Copy A: *.* {ENTER}

    dir A: *.* {ENTER}

    ```


    The above mentioned command conveys MS-DOS to copy information you type in the
    keyboard (console) into a new file called COPYFILE.BAT. After the last line executes,
    hold the CTRL key and press the Z key. Next, press the {ENTER} to save the file.
    The MS-DOS displays the 1 File(s) copied to show that it has saved the file.


    For copying information into a new file, you can use the following method:


    +   - Type the syntax at the MS-DOS prompt:


    ```

    EDIT COPYFILE.BAT {ENTER}

    format A: {ENTER}

    copy *.* a: {ENTER}

    dir A: *.* {ENTER}

    ```


    +   - From the File drop menu, choose Save.


    +   - From the File drop menu, choose Exit to close the editing of a program.'
  merge: -1
  pgno: 492
- img_proc: true
  md: '# Appendix C


    To run the file, type the following command:


    ```

    COPYFILE {ENTER}

    ```


    > You are not required to type the extension for MS-DOS to run a file with a BAT,
    EXE or COM extension.


    # Points to remember about Batch files


    You can follow the points that must be kept in mind the batch files as follows:


    +   - You may be questioned by MS-DOS when it runs the batch file

    - You must ensure to place a BAT extension with the file name, so that MS-DOS
    recognizes it as a batch file

    - You can place each MS-DOS command into a batch file

    - You need to place each command in the file on a separate line


    In addition, you can stop an already running batch file by holding the CRTL key
    and pressing the C key. Then, MS-DOS displays the following message:


    ```

    Terminate batch job (Y/N)?

    ```


    You can type Y for ignoring the rest of the commands and the MS-DOS prompt appears.


    # A List of extra Batch files commands


    +   - REM: Allows you to makes the text a remark and not as a command.

    - ECHO: Allows you to suppresses output to the screen.

    - PAUSE: Allows you to pause the file and waits for a key to be pressed.

    - CALL: Allows you to select a batch file for calling and running another batch
    file.

    - FOR: Allows you to use FOR command along with the IN and DO commands.

    - IF: Allows you to test an IF input/parameter is equal or not equal to a given
    quantity.

    - SHIFT: Allows you to SHIFT through a list of given parameters.

    - GOTO: Allows you to jump to a given place in a batch file when used with the
    IF command.

    - @@: Allows to stop the processing of MS-DOS outputting the command line to the
    screen, which is valid for one line only.

    - %1: Allows you to add the value of a parameter to the batch file name when it
    was called.'
  merge: -1
