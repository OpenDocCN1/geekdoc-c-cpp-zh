    +   - data_type: Refers to a built-in data type such as int, char, float, or double.

    - variable_list: Refers to one or more variables of data type data_type. In case
    there are more than one variable, then they must be separated by commas.


    You must always remember to terminate a variable declaration by a semicolon (;).
    The following are the examples of declaring variables:


    ```

    int age;

    float diameter;

    char chr;

    double salary;

    int a, b, c;

    float arr[34];

    char marks[10], color[4];

    ```


