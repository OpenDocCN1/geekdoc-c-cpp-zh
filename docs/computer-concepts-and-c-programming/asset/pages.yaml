    printing with sharp images using laser technology for the formation of images.
    In a laser printer, before printing an image, it is first formed on a photosensitive
    drum. Powdered ink or toner is applied on the surface of the drum. Now, the image
    from the drum is electrostatically transferred to the sheet of paper. Finally,
    the ink image on the paper is fused by internal heating process.


    The speed of a laser printer is usually 4 to 30 pages per minute. You cannot get
    a carbon copy of this type of printer. Laser printer is an example of page printer
