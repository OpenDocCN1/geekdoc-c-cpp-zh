  md: "# 11.5 Recursive Functions\n\nRecursive functions are functions that call themselves\
    \ during their execution until certain conditions are not satisfied. Such functions\
    \ are used when some part of the code needs to be executed repeatedly and the\
    \ inputs come from the outputs of the previous computation. For example, if you\
    \ are calculating the factorial of a number, then you multiply the number by number-1.\
    \ You continue this until you reach up to one, to get the factorial of the given\
    \ number. In other words, if you are supposed to get the factorial of five you\
    \ perform the following multiplication:\n\n```\n5*4*2*1\n```\n\nIn this example,\
    \ the multiplication is performed repeatedly, until the number reaches one. The\
    \ factorial calculated in this example, can be calculated using a recursive function,\
    \ as shown in Listing 8:\n\n+   Listing 8: Using Recursive Function\n\n```\n#include\
    \ <stdio.h>\n#include <conio.h>\nlong factorial(long n) {\n    if(n==1)\n    \
    \    return n;\n    else\n        return n*factorial(n - 1);\n}\nvoid main() {\n\
    \    long n, fact;\n    clrscr();\n    printf(\"\\nEnter a number = \\\");\n \
