  md: '# Computer Concepts and C Programming


    The Computer Concepts and C Programming helps you to master the fundamentals of
    computer and C programming language. The book is divided into two sections—the
    first section elaborates the basic concepts of computer, such as input/output
    devices, memory device, and operating systems. The second section of the book
    provides an in-depth coverage of programming techniques in C programming and covers
    concepts such as variables, operators, strings, managing input/output, arrays,
    and pointers.


    # The book covers:


    +   - The history of computer, basics of hardware devices, and different types
    of systems and application software

    - The different types of operating systems, computer processing techniques, and
    functions of operating systems

    - The fundamentals of problem solving and C, basic computation model, flowcharts,
    algorithm, and pseudo code, history and features of C language, data types, constants,
    variables and volatile type qualifiers, data type modifiers, backlash and symbolic
    constants, delimiters, and multiple assignments.

    - The different types of operators in C, operator precedence, type casting, mixed
    mode operation, mathematical functions, header files, and preprocess directives

    - The control statements, iterative statements, jump statements, and one-as as
    two-dimensional arrays

    - Built-in functions, user-defined functions, passing parameters to functions,
    using arrays in functions, recursive functions, and local, global, static, and
    register variables

    - Structure variables, nested structures, union variable, pointer variable, address
    of operator with pointer, referencing pointer, and passing pointer to a function
    by the call by value and reference methods

    - The #define, #include, #if, #elif, #else, #undef, #endif, #ifdef, #ifndef, and
    #error directives, predefined macro, and command line arguments in C

    - Library functions, I/O functions, string functions, character functions, math
    functions, time and date functions, and miscellaneous functions


    # About the Author


    Vikas Gupta is a publisher, an internationally acclaimed author, a prolific speaker
    on computer learning and e-publishing, co-founder of a software company, offering
    IT-enabled services. He has authored several books for American publishing giants
    such as Wiley, McGraw Hill, and IDG. His earlier books in the same series have
    brought all records of popularity, selling over three million copies in India.
    Comdex Computer Course Kit, a world-class learning system (book + Software), was
    introduced by him four years of research. The book was an instant hit. However,
    the feedback revealing a growing demand for a textbook on Computer Basics and
    C Programming. So, here is a new book that widely covers Computer Concepts and
    C Programming.


