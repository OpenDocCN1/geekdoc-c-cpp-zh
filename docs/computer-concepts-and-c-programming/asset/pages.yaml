    In the preceding syntax, the struct keyword indicates the beginning of a structure
    definition, structure-name represents the name of the structure being defined,
    data-type_1, data-type_2, data-type_3, and data-type_n represent the data types
    of the structure members, and variable_1, variable_2, variable_3, and variable_n
    represent the structure members.


    The following code snippet defines a structure, student:


    ```

    struct student {

    int roll_no;

    char name[20];

    int age;

    char grade;

    };

    ```


    The student in the preceding code snippet contains four members: two integers,
    roll_no and age, to store roll name and age of the student, a char array, name,
    to store the name of the student, and a char variable, grade, to store the grade
    of the student.


    +   - Declaring Structure Variables


    After defining a structure, you can declare variables of the structure type in
    the same way as you declare variables of a predefined data type, such as int,
    char, float, and double. The syntax for declaring a structure variable is:


    ```

    struct structure-name variable_name;

    ```


    You can also declare multiple variables using a single line of code by using the
    following syntax:


    ```

    struct structure-name variable_1, variable_2, variable_3, ..., variable_n;

    ```


    The following code snippet declares two variables of type student:


    ```

    struct student_1, student_2;

    ```


    You can combine the definition of a structure and the declaration of the structure
    variables together, as shown in the following syntax:


    ```

    struct structure-name {

    data-type_1 variable_1;

    data-type_2 variable_2;

    ......

    data-type_n variable_n;

    } structure-variable_1, structure-variable_2, ..., structure-variable_n;

    ```'
