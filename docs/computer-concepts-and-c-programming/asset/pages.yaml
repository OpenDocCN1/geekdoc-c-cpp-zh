    50 to get the total of marks as 80. Here 30 and 50 are treated as numbers not
    characters.


    Variable length files are also ASCII files. It means you can see the data using
    system editor. Unlike files, in variable length record files each field is treated
    as individual data item and each data item is written in single line. For example,
    if you create a variable length record file of the text file mentioned above and
