    | floor() | Rounds up the integer down to the nearest value. For example, this
    function will always return 26 if the integer value is 25.5, 26.9, or 27. |

    | round() | Rounds up the integer value if it is greater than halfway to the next
    value (0.5 or higher) and rounds down if the integer value is lower. For example,
    this function will return 26 if the integer value is 26.1, 27 if the integer value
    is 26.5, and 27 if the integer value is 26.9. |

    | ceil() | Rounds up the integer value up to the nearest value. For example, this
    function will always return 27 if the integer value is 26.5, 26.9, or 26.1. |

    | sin() | Calculates the sine value. |

    | cos() | Calculates the cosine value. |

