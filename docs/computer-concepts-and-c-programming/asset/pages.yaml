  md: '# Concept of linker and loader


    When you compile a C program, the program is converted into object file. The object
    file can be referred to as a language file. It has information that allows a linker
    to see what symbols are in it as well as symbols it requires in order to work.
    (For reference, "symbols" are basically names of global objects, functions, etc.,
    etc.). The machine language file cannot be executed by itself. To convert the
    object file into an executable file, a linker is required.


    A loader loads the executable file from secondary storage device to memory.


    # Linker


    Linker is a tool that merges the object files produced by separation of different
    program or code files and creates an executable file. It performs three tasks:


    +   1. It searches the program to find library routines used by program, e.g.
    printf(), math routines,

    2. It determines the memory locations that each code will occupy and relocates
    its instructions by adjusting absolute references.

    3. It resolves references among files.


    In C programming the linking process is shown as:

    For single program code files


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_111_0.png)


    For multiple program code files


    # Loader


    Loader is a part of the operating system that brings an executable file residing
    on disk into memory and starts it running. The loader loads the executable program
    into memory by using the following steps:


    +   1. Read executable file''s header to determine the size of text and data segment.

    2. Create a new address space for the program.'
