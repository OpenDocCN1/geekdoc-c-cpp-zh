    # Biometric Sensors


    Biometrics is the science of identifying individuals by their physical characteristics.
    When the user''s physical characteristic is scanned by Biometric sensors, it produces
    electrical currents. Physical characteristic such as fingerprints, palm print,
    retina scan, DNA (Deoxyribonucleic acid), etc. can be recognized using biometric
    sensors. Biometric identification method is more secure than other identification
    methods such as passwords, Personal Identification (PIN) numbers, and key cards.


    A variety of biometric sensors with different patterns are now available, such
    as image size, image resolution, image quality, sensing technology, etc. These
    sensors are installed in computers and other devices to authenticate the user.
    A biometric sensor is shown in Figure 14:'
