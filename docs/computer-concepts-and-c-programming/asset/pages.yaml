    # Programming Techniques


    There are four programming techniques which are classified based on the behavior
    of the program and the organization of the program.


    # Structured Programming


    Usually, people start learning programming by writing small and simple programs
    consisting of only one "main program" stands for a sequence of commands or statements
    which modify data is global throughout the whole program. This programming technique
    provides tremendous disadvantages once the program gets sufficiently large. For
    example, if the same statement sequence is needed at different locations within
    the program, the sequence must be copied.


    In C language, the statements GOTO goes of unstructured programming. Using GO
    TO codes, one could transfer backward, or anywhere else with GO TO commands to
    look them. The problem is that the connections between parts of the program by
    using GO TO commands can become quite haphazard. This type of programming is difficult
    to understand and debug. Unstructured programming of this nature is now viewed
    as an ineffective programming strategy.


    # Structured Programming


    It is a programming technique for organizing and coding programs in a hierarchy
    of modules. Each module has a single entry and a single exit point and the control
    is passed downward through the structure without unconditional branches to higher
    levels of the structure. Three types of control flow are used: sequential, conditional
    selection and iteration.


    # Principles of structured programming


    The structured programming has two main principles:


    +   To make flow of control as easily as possible. (Emphasis on use of Control
    Structures).

    To build program from top-down in which it decompose the problem into smaller
    and smaller pieces (Modularization) that helps in avoiding the repetition of the
    same code. This helps in fixing code in one place.


    # Advantages of Structured Programming


    The goal of structured programming is to create correct programs that are easy
    to write, understand and change. It has following advantages.


    +   1. Structured design increases the programmer''s productivity by allowing
    them to look at the big picture first and focus on details later.'
