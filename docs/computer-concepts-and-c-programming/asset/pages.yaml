    # Comparison between Macros and Functions


    The choice between macros and functions is a compromise between program speed
    and program size. Every time a macro is called in the source code, its definition
    is expanded into the code. This means that if your program calls a macro 1000
    times, 1000 copies of the expanded code are found in the final program. On the
    contrary, while using a function, it exists as a single copy, irrespective of
    how many times you have called that function. Therefore, when considering program
    size, a function is a better choice.


    When a function is called, some amount of processing overhead is needed to pass
    the execution to the function code and return the execution point to the calling
    program. On the other hand, calling a macro, there is no processing overhead involved.
    This is because the code is in the program itself and therefore no explicit call
    is required. Therefore, when considering program speed, a macro is a better choice.


    Note that macros have more advantage over functions as they do not have to worry
    about type characters rather than actual values. Hence, the SQUARE (x) macro can
    be used with both the int and float variables.


    # 16.3 The include Directive


    C provides the #include directive to include a file in the source file of a program.
    An external file containing functions or macro definitions can be included as
    part of a program so that you need not rewrite these functions or macro definitions.
    This is achieved with the help of the preprocessor #include “header filename",
    where filename is the name of the file containing the required macro definitions
    or functions. At this point, the preprocessor inserts the entire contents of the
    file into the source code of the program. C'
