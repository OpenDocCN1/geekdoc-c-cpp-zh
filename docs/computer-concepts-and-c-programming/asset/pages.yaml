    # Displaying the Content of a File


    The TYPE command enables you to display the content of a file on your screen.


    > Some of the file types, such as operating system commands or application software''s,
    which are not allowed to read as they comprises of non-alphabetic and non-numeric
    characters.


    For example:


    ```

