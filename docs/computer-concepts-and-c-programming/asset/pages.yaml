    \ values %d %d %d\\n\",i,j,k);\n    return 0;\n}\n```\n\nIn the preceding program\
    \ statement A indicates scanf(), it is used for inputting values for i, j, k.\
    \ The first argument is always a string having place before. During execution\
    \ of the scanf() is processed and it is matched against the string. The process\
    \ is continued till the matching is over. When the first place holder is encountered\
    \ in the string a value of specific type of the first element constitutes a match.\
    \ It is repeated for each place holder. If there is one or more white space characters\
    \ between the place holders, then sequence of one or more white space If there\
    \ are other characters in a string argument then the input should have the same\
    \ character in the same sequence to be matched. Matching is not done then the\
    \ function is terminated. Matching fails if the expected input is missing. scanf()\
    \ returns the number of values, which are successfully entered. In the preceding\
    \ example, when we enter 23 34 A as input, then matching fails for the variable\
    \ k. Therefore, scanf() function returns 2. So it prints the value of i and j,\
