  md: '# Pointers ◄ 363


    where, nob (number of bytes) represents the number of contiguous memory locations
    to be allocated.


    malloc() function allocates memory from a pool. The malloc() function takes integer
    value as a parameter that specifies the number of bytes to be allocated. It returns
    a pointer to a block of contiguous memory of the specified size. The pointer is
    of char * type, but can be cast into any other type as per requirement. The memory
    once allocated can be returned to the free pool by passing the pointer to the
    free() function. For example:


    ```

    ptr = (cast-type *), malloc(byte-size);

    char *string;

    string = malloc(n);

    free(string);

    ```


    In the preceding example, a string of type char * is declared along the malloc()
    function to return a value of the same type where n is a variable containing the
    number of bytes (characters). After handling an array, the program would execute
    free(string) statement which returns the allocated memory to the free pool and
    at this point a new value can be assigned to the string.


    +   calloc()


    calloc() function is used for, to allocate memory for the array elements and initialize
    them with 0. The parameters of the calloc() are different from the parameters
    of the malloc() function. The syntax of the calloc() function is as follows:


    ```

    ptr = (cast-type *) calloc(n,element-size);

    ```


    The preceding statement allocates space for n blocks in bytes where each block
    is of the size specified by element-size. The calloc() function initializes all
    bytes to zero and returns a pointer to the first byte of the allocated region.


    +   free()


    free() function is used to free the memory blocks that are allocated by malloc()
    and calloc(). In a program, if some string or array of some memory is not more
    required, the memory can be free using this function. The syntax of the free()
    function is as follows:


    ```

    free(ptr);

    ```


    where ptr is a pointer created by malloc() or calloc().


    +   realloc()


    realloc() function is used to modify the size of a previously allocated memory
    block. The syntax of the realloc() function is as follows:


    ```

    ptr = realloc(ptr,newsize);

    ```'
