    other hand the numbered list can be created by adding number in front of the list
    items. You can use the numbered list in any step by step procedure, in which number
    precedence matters. The bulleted list can be used in any type of list items where
    you want to write informative steps. By using these numbered and bulleted lists
    the data can be organized and will become formal in presentation.


