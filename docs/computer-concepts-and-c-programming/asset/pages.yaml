  md: "# 13.2 Unions\n\nUnions are similar to structures in the sense that both are\
    \ used to store values of different data types. One main difference between a\
    \ structure and a union is that in case of a structure, each member is allocated\
    \ a separate location in memory, whereas all the members of a union are allocated\
    \ same location in memory. Using a union instead of a structure saves memory as\
