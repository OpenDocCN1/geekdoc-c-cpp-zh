    # Using the goto Statement


    The goto statement is used to perform transfer of control from one statement to
    another in a program. This statement uses user-defined labels to specify the goto
    statement in the program. The syntax to use the goto statement is:


    ```

    goto <label_name>;


    ...

    n<label_name>:statement:

    ```


    In the preceding syntax, <label_name> specifies a user-defined label for the target
    statement to which the control should be transferred. This label should be followed
    by a colon and the target statement must be preceded by the label.


    Listing 16 shows an example to use the goto statement:


    # Listing 16: Using the goto Statement


    ```

    #include <stdio.h>

