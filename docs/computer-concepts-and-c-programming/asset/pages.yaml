    # Benefits of Object-Oriented technology


    The main benefits of OOP technology are as follows:


    +   Easy in software design as you could think in the problem space rather than
    machine and bytes. You are dealing with high-level concepts and abstractions.
    Ease in design leads to produce more productive software development.


    +   Easy in software maintenance: object-oriented software is easier to understand,
    easier to test, debug, and maintain.


    +   Reusable software: you don''t need to keep re-inventing the wheels and re-write
    the same functions for different situations. The fastest and safest way of developing
    a new approach is to reuse existing codes - fully tested and proven codes.


    Top – Bottom – Up Approaches


    Top-down and Bottom-up are approaches to the software development process. These
    approaches can be understood by the example of a tree like structure. In top-up
    approach the code development is from root node to leaf node and bottom-up approach
    follows the code development from leaf to root node.


    +   Top-down approach: In this overview of the system is first formulated, specifying
    but not detailing any first-level subsystems. Each subsystem is then refined in
    greater detail, sometimes in many additional subsystem levels, until the entire
    specification is reduced to base elements.


    Top approaches emphasize planning, and a complete understanding of the system.
    It is inherent that no coding begin until a sufficient level of detail has been
    reached at least some part of the system


    The technique for writing a program using top-down methods is to write a procedure
    that names all the major functions it needs. Later, the programming team looks
    at the requirements of each of these functions and the process is repeated. These
    compartmentalized sub-routines will perform all actions so simply they can be
    easily and concisely coded. When all various sub-routines have been coded the
    program is done.


    +   Bottom-up approach: In this approach the individual base elements of the system
    are specified in great detail. These elements are linked together to larger subsystems,
    which then in turn are linked, sometimes in many levels, until a complete top-level
    system is formed.


    Bottom up emphasizes coding, which can begin as soon as the first module has been
    specified. However bottom-up coding runs the risk that modules may be coded without
    having a clear idea of how they link to other parts of the system, and that such
    linking may not be as easy as first thought.'
