  md: "# Static and Register Variables\n\nThe variables declared with the static keyword\
    \ are called static variables. These variables can be declared locally within\
    \ a function or block of code or globally, in a program. When the static variable\
    \ is declared within a function, it is visible within the function and retains\
    \ its value during the execution of the program. These static variables are called\
    \ internal variables. However, the static variables that are globally declared\
    \ in the program, are accessible to all the functions in the program and retain\
    \ their value throughout the execution of the program. are known as external static\
    \ variables.\n\nThe variables of a program are stored in the Random Access Memory\
    \ (RAM). However, sometimes the program variables are also stored in the Central\
    \ Processing Unit (CPU) registers to make the execution of the program fast. The\
    \ variables which need to be stored in the CPU register are declared with the\
    \ register keyword. The register variables are local program. The register variables\
    \ ensure the fast execution of the program only when the CPU registers are available.\n\
    \n> Declaring a variable with register keyword does not guarantee speedy execution\
    \ of the program. The register variables ensure the fast execution of the program\
    \ only when the CPU registers are available.\n\nListing 13 shows an example of\
    \ using internal static variable:\n\n+   Listing 13: Using Internal Static Variable\n\
    \n```\n#include<stdio.h>\n#include<conio.h>\nvoid function1(){\n    static int\
    \ result=1;\n    result=result+2;\n    printf(\"%d\\n\", result);\n}\nvoid main()\
    \ {\n    int i;\n    clrscr();\n    for(i=1;i<5;i++) {\n        function1();\n\
    \    }\n    getch();\n}\n```\n\nOutput:\n\n```\n2\n4\n8\n16\n```"
