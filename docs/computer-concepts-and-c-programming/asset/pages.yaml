    # 14.3 Using the Address of (&)


    A computer uses memory to store the instructions of different programs and the
    values of different variables. Since the memory is a sequential collection of
    storage cells, each cell has an address. When you declare a variable, the operating
    system allocates memory according to the size of the data type of that variable.
    At this memory location, the value of the variable is stored. Consider the following
    statement:


    ```

    int x = 120;

    ```


    The preceding statement of the program requests the operating system to allocate
    two bytes of space in memory. Since the data type of the x variable is an integer,
    the operating system allocates bytes of memory and stores 120 in that location.


    | x | Variable name |

    | 120 | Value of the variable |

    | 1030 | Address of the memory location |


    By using the address (&) operator, you can determine the address of a variable.
    The & operator is frequently used in the scanf(\&) function. Let''s consider an
    example to understand the concept better:


    ```

    void main() {

    int x = 120;

    // prints the address of variable x /\nprintf("\nAddress of x: %u\n", &x);

    }

    ```


