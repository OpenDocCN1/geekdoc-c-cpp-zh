    When you initialize a pointer variable, assign the reference value to the memory
    location to which the pointer points, such as *var. You should note that at the
    time of declaring a pointer variable, the asterisk (*) symbol is used to indicate
    a pointer variable, it is not the dereference operator (The dereference operator
    also uses the same * sign). Therefore, you should not confuse with the use of
    the * symbol for two different functions as the preceding code could be written:


    ```

    int num;

    int *var;

    *var = &num;

    ```


    Sometimes pointers are set to zero to make null pointers or tested against zero
    to see if they are null. The pointers that points to nothing are called null pointers.
    In simple words, you can say that a null pointer is a pointer that has a special
    value to indicate that it is not pointing to any valid reference or memory address.
    This is the result of type casting where the integer value zero is type casted
    to any pointer type. For example:


    ```

    int *ptr;

    ptr = 0;

    ```


    The null pointers are completely different from the void pointers. A null pointer
    is a pointer type indicating that it is pointing to nothing without a specific
    type. If a null pointer constant is assigned to any other pointer, or compared
    for equality with any other pointer, it is first converted to the type of that
    pointer. Listing 3 shows how to initialize a pointer variable:


