  md: '# Appendix: UNIX Commands


    Unix vi editor provides two types of modes:


    +   - Command mode: Allows entering commands. This is the default mode of vi text
    editor. When you open a file, you enter into the command mode.

    - Insert mode: Allows you to insert text into the file. To switch to insertion
    mode, press the Insert key on your keyboard or the i key. To change from insertion
    mode to command mode, press the ESC key.


    There are numbers of vi commands but for the beginner level vi users, a handful
    of these are usually sufficient. It is also important to keep in mind that commands
    used in vi editor are case sensitive.

    ''s learn the vi commands:


    # E.1 Commands to Open a File in the vi Editor


    The following commands help you to open a file for editing:


    | Command | Outcome |

    | --- | --- |

    | % vi filename | Allows you to edit file form the beginning |

    | % vi + n filename | Allows you to edit file at the nth line |

    | % vi + filename | Allows you to edit file at the end |

    | % vi -r | Displays the list of saved files |

    | % vi -r filename | Allows you to recover filename file |

    | % filename1 filename2 | Allows you to edit filename1 first then filename2 |

    | % +pat filename | Allows you to search filename for pattern |


    # E.2 Commands to Move the Cursor on the Screen


    The following commands help you to move the cursor on the screen:


    | Command | Outcome |

    | --- | --- |

    | H | Moves the cursor to the first non-whitespace character on the top of the
    screen |'
