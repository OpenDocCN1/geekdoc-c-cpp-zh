    +   Using the switch Statement


    A switch statement is a conditional statement that tests a value against different
    values. If the value is matched, the corresponding group of statements is executed.
    Switch statement begins with the switch keyword that is followed by a value expression
    in the parenthesis (). It is a combination of multiple case labels that must be
    separated by the break statement. Every label contains a constant value that is
    matched against the value, which is specified in the switch expression. If the
    value is matched, the statements of that case label are executed. In addition,
    you can specify the default label, which is executed when the value specified
    in the switch expression, does not match with the given case labels. The syntax
    to use a switch statement is:


    ```

    switch(expression)

    {

    case value: statement1;

    break;

    case value2: statement2;

    break;

    case value3: statement3;

    break;


    default: default_statement;

    }

    ```'
