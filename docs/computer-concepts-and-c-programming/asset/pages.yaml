    # Web Camera


    A Web camera is a very simple camera which is used on Web for video conferencing.

    Two persons at different and distant locations, even in two different countries,
    can see each other if they are sitting before each other. If microphone and headphones/speakers
    connected to their computer system, they can talk and listen to each other as
    well. People at distant locations use video conferencing for their business reasons,
    for interviewing candidates for job selection, etc., thereby saving money and
    time. A Web camera is shown in Figure 13:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_25_1.png)


