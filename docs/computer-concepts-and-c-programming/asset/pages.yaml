  md: '# 2.5 Disk Operating System


    DOS is the ancestor of Windows-based OSs. It provides a command-line interface.
    In this OS, the user needs to type the commands to work on the computer. It means
    a user is required to remember commands and their syntaxes to work efficiently.


    The three system files that are required to work on the computer with MS-DOS OS
    are as follows:


    +   - IO.SYS

    - MSDOS.SYS

    - COMMAND.COM


    These commands should be present on the boot disk. IO.SYS and MSDOS.SYS are hidden
    files. Hidden files are those files which are not displayed when you try to see
    them with simple DIR command. The two optional startup configuration files may
    also be used to configure the system at the time of booting is as follows:


    +   - CONFIG.SYS

    - AUTOEXEC.BAT


    AUTOEXEC.BAT is a file that is used to adjust the system''s configuration. AUTOEXEC.BAT
    is a batch file. When the system is turned on, the AUTOEXEC.BAT file simplifies
    automatic execution of command lines included within the file.


    # Booting Process in DOS


    Booting is the first process or set of operations that are performed to start
    the OS. The booting process in DOS involves the following steps:


    +   1. Power on Self-Test (POST) routines residing in the Read Only Memory (ROM)
    are executed.

    2. Bootstrap Loader is executed, which also resides in the ROM.

    3. Boot sector program (This resides on the first sector of the disk) is loaded.

    4. The IO.SYS file is loaded.

    5. The MSDOS.SYS file is loaded.

    6. The COMMAND.COM file is loaded.

    7. The AUTOEXEC.BAT file is loaded.

    8. The DOS prompt c:\> is displayed.


    # Working with DOS


    MS-DOS stands for Microsoft Disk OS. It can be defined as a system for operating
    the disk.

    DOS facilitates the user to organize, load, and execute data files. It also enables
    the user to control all the devices attached to the computer.'
  merge: -1
  pgno: 50
