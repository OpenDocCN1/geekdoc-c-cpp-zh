    # 15.3 Performing File Operations on Text Files


    In text files, let''s learn to perform the following operations:


    +   - Establishing buffer area

    - Opening a text file

    - Reading and writing a text file

    - Closing a file

    - Reaching to the end of file


    Establishing Buffer Area

    Buffer area is a memory area where the information is held temporarily transferring
    it to/from file. Therefore, while working with files in C language, you have to
    establish a buffer by declaring a pointer of type FILE as follows:


    ```

    FILE *ptr;

    ```


    This declaration is needed for communication between file and program.

    Note that FILE (all upper case letters) is a special structure type defined in
    the stdio.h header and ptr is a pointer variable that points to the beginning
    of buffer.


    Opening a Text File

    Opening a file is performed using library function fopen(). The syntax for opening
    a file in standard I/O is:


    ```

    ptr = fopen("file-name","mode")

    ```


    Here, ptr is the same pointer variable which is used to establish buffer area.
    After opening the file, the file is identified by the pointer variable ptr instead
    of the file-name (name of the file) for reading, writing or closing operations
    of the file.

    Note that the function fopen returns a NULL value to the pointer variable ptr,
    if somehow the file could not be opened.

    Mode is a string which indicates the mode, in which file is to be opened. The
    file can be opened in any of the modes shown in Table 1:


    | Table 1: Opening Modes in Standard I/O |

    | File Mode | Meaning of Mode | During Inexistence of file |

    | r | Open for reading. | If the file does not exist, fopen() returns NULL. |

    | w | Open for writing. | If the file exists, its contents are overwritten. If
    the file does not exist, it will be created. |

    | a | Open for append, i.e. Data is added to end of file. | If the file does not
    exist, it will be created. |'
