  md: '# Introduction


    The book contains comprehensive content on the various concepts of computer fundamentals
    and C programming. On a broad basis, the book is divided into two sections – computer
    fundamentals and C programming. The first section of the book provides you in-depth
    knowledge of computer concepts, such as hardware, software, memory management,
    operating system, and networking. The second section of the book exclusively covers
    fundamentals of C and various programming techniques in C, such as variables,
    operators, arrays, pointers, file handling, and memory management.


    We hope that your learning experience with this book will prove as irresistible
    to you as it has proved to you while authorizing and editing the book.


    # About this Book


    Computer Concepts and C Programming extends the approach of providing comprehensive
    reference material on new IT technologies and C programming. Unlike other books,
    Computer Concepts and C Programming goes beyond providing simple descriptions
    on computer concepts and code examples to ensure that it caters to the everyday
    life challenges confronted by the IT personnel. The range of topics and coverage
    offered by this book is a superior mix of description about computer concepts
    and programming features related to C, with all relevant details on computer concepts
    and practical examples to implement solutions programmed in C.


    This book is ideal for beginners, who intend to familiarize themselves with fundamentals
    of computer and C programming language.


    This book mainly covers the following:


    +   - Introduction to Digital Computers

    - Introduction to Operating Systems

    - Number System

    - Problem Solving with Digital Computer

    - Introducing the C Language

    - Computer Networking

    - Introducing the Fundamentals of C Programming

    - Managing Input and Output Operations

    - Operators and Expressions in C

    - Conditional, Iterative, and Jump Statements

    - Strings, Arrays, Functions, and Pointers

    - Unions and Structures

    - Use of Preprocessor Directives


    This is just an indicative list—there is lot inside. Our sole intent has been
    to provide a book with in-depth and sufficient information, so that you enjoy
    reading and learning from it. Happy reading!'
  merge: -1
  pgno: 14
- img_proc: true
  md: "# How to Use This Book\n\nEach chapter of the book provides in-depth knowledge\
    \ on a particular topic. First of all, read the chapter and then test your learning\
    \ by going through the Multiple Choice Questions and Quick Review exercise provided\
    \ at the end of the chapter. In this book, code snippets and programs have been\
    \ tested on a variety of compilers, such as Turbo C. However, you may need to\
    \ add some additional lines of code to complete and execute the C programs, depending\
    \ upon the chapter you use.\n\nFinding a topic in a particular chapter is also\
    \ simple. All you have to do is to open the first page of the chapter and navigate\
    \ through the list of topics displayed, along with your page numbers.\n\n# Conventions\n\
    \nThere are a few conventions followed in this book that need to be taken care\
    \ of. For example, the code explained in this book is in the form of code listing,\
    \ which is immediately followed by the output of the listing. The code with a\
    \ listing number, and its output appears as follows:\n\n+   Listing 3: Using the\
    \ getchar() Function\n\n```\n#include <stdio.h>\nvoid main() {\n    char var1;\n\
    \    var1 = getchar();\n}\n```\n\nComputer Concepts and C Programming book also\
    \ provides you with additional information on various concepts in the form of\
    \ Notes:\n\n> The TCP/IP model uses the client/server model of communication in\
    \ which a user (client) requests the computer (server); therefore, it establishes\
    \ communication.\n\nEvery figure contains a descriptive caption to enhance its\
