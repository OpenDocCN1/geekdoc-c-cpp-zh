    # Basic Flowchart Symbols


    In flowchart, symbols are used to represent the sequence of operations, flow of
    data, and the documents required for completing the task. Flow should be normally
    from top to bottom and left to right. Table 1 shows the commonly used symbols
    of a flowchart:


    Table 1: List of Flowchart Symbols


    | Symbol | Name | Description |

    | --- | --- | --- |

    | Oval | Represents the Terminal points (Start / Stop) |

    | Rectangle | Represents the process steps defined in algorithm |

    | Parallelogram | Indicates the reading operation used for input/output data or
    information from/to any device |

    | Diamond | Indicates the decisions (questions) and consequently the branch points
    or the paths to be followed based on the result of a question |

    | Arrows | Shows the flowchart direction and connects the various flowchart symbols
    |

    | Small Circle | Shows continuation from one point in the process flow to another
    |


