    # Program\n\nThe following program helps you to understand the use of scanf()\
    \ function:\n\n# Listing 2: Using the scanf() Function\n\n```\n#include<stdio.h>\n\
    int main()\n{\n    int m,k;\n    int i,j;\n    scanf(\"%d %d %d\", &i,&j,&k);//statement\
