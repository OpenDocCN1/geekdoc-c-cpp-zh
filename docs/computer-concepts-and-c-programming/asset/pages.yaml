  md: '# Number System 59


    We know that in decimal system, we have digits 0, 1, 2, ..., 9, i.e., there are
    10 digits from 0 to 9. Similarly, in base 5 system, we have digits 0, 1, 2, 3,
    and 4, i.e., only 5 digits from 0 to 4.


    In decimal system, each digit carries some value which is known as weight. The
    rightmost digit of a decimal number is unit digit and the value increases by a
    multiple of 10 as you move toward left.


    Let us understand through an example. Consider the base 8917.


    ```

    8917=8000 + 900 + 10 + 7

    ```


    or


    ```

    8917-8 = 8×10³ + 9×10² + 1×10¹ + 7×10⁰

    ```


    It can be seen in the following example that the weight of the nᵗ digit of the
    number from the right-hand side is equal to (nth digit) × (base)ⁿ.


    +   * Binary Number System


    Binary number system is used in digital computers. It uses two digits, that are
    0 & 1, and therefore it has base 2.


    The digits used by binary number system are known as bits. The number (11010)
    can be represented as:


    ```

    (11010)₂ = 1×2⁴ + 1×2³ + 0×2² + 1×2¹ + 0×2⁰

    = 16+8+0+2+0

    = (26)₀

    ```


    While using different bases, you can only use the digits that are smaller than
    the value of the base. For example, if you are writing a number of base 5, you
    can only use the digits 0, 1, 2, 3, and 4. You cannot use 5, 6, 7, 8, or 9. That
    is why we use 0 & 1 in a binary number system.


    > Computer uses binary number system to represent the electric current. Electric
    current can be represented by 0 and 1. When there is flow of electric current,
    i.e., the on, it is represented by 1, and 0 represents the off status when there
    is no electric current. However, if decimal number system was used by computer,
    it would be more confusing to represent electric current using 10 numbers.


    One more advantage of binary system is that it is very specific and precise, which
    is the basic need of a computer.


    +   * Octal Number System


    The number system consisting of digits from 0 to 7 is known as octal number system.
    The base or radix of octal number system is 8 and therefore it is also known as
    base 8 number system.


    The digits used in this number system are 0, 1, 2, 3, 4, 5, 6, and 7, i.e., only
    8 digits.


    Consider the following example:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_74_0.png)'
