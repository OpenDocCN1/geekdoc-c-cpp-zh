  md: '# 09 Control Structures


    # OBJECTIVES


    +   - Exploring the Syntax of a Control Structure

    - Working with Conditional Statements

    - Working with Iterative Statements

    - Working with Jump Statements


    In a programming language, a program is not just a linear sequence of instructions.
    For instance, a program that may contain a repeated code or decision-making code.
    The C language provides control structures, which are also known as control statements,
    for this purpose. Control structures are statements that decide what has to be
    done by a program, when, and under which circumstances. In other words, control
    structures are those statements that decide the order in which individual statements
    or instructions of a program are executed or evaluated. Some examples of control
    structures are: if-else, switch, and do-while.


    In C language, all control structures are divided into:


    +   - Conditional statement: Specifies a condition to execute a group of statements
    in a program. The control structures, if-else and switch belong to this category.


    +   - Iterative statement: Executes one or more statements repeatedly until a
    condition is met. The control structures, do...while, and for loops belong to
    this category.


    +   - Jump statement: Transfers the control from one part to another within the
    program. Some examples of jump statements are goto, break, and continue.


    In this chapter, you will learn about various control structures. The chapter
    starts with exploring the syntax of a control structure. Next, you learn about
    conditional statements, such as if-else and switch. Then we explain iterative
    statements, including loop, do-while, and for loop. At the end of the chapter,
    you will learn about jump statements, such as break, continue, and goto.


    # 9.1 Exploring the Syntax of a Control Structure


    In general, the syntax of a control structure involves a compound statement. A
    compound statement or a block, is a group of statements that are separated by
    semicolons (;) and grouped together in a block using curly braces, { }. Note that
    there is a difference between simple and compound statements. A simple statement
    is a simple instruction, which ends with a semicolon (;). A compound statement,
    on the other hand, is a group or block of'
