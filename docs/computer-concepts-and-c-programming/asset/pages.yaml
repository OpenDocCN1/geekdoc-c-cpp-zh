    in the C programming language, such as the assignment operators, the arithmetic
    operators, the relational operators, and the logical operators. You have also
    learned about the operator precedence that is implemented while using the different
    operators in C.


    Next, you have learned about type casting in C, which included data type conversion.
    You have also learned about using different data types together in implementing
    mixed operation. The different mathematical functions that are used to perform
    the mathematical operations were also discussed in this chapter. Towards the end,
    you have learned about header files and the preprocessor directives that are used
    to create a simple C program.'
