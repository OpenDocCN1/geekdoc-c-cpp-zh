  md: '# Working with Operators and Expressions in C


    # OBJECTIVES


    +   - Working with Operators

    - Operator Precedence in C

    - Type Casting in C

    - Implementing Mixed Mode Operation

    - Using Mathematical Functions in C

    - Using the Header Files and Preprocessor Directives


    Operators in C are symbols, which are used to perform not only arithmetic expressions,
    such as addition, subtraction, multiplication, or division but also logical computations.
    The operators specify the type of operation that needs to be applied. The values
    that are operated on by operators are called operands.


    The combination of variable and constants along with the C operators, create expressions.
    In other words, operators take more than one expression or operand to perform
    arithmetic and logical computations on it. The expressions are evaluated by the
    operator precedence rules, which determine the order in which the operators in
    an expression are evaluated.


    In this chapter, you will learn about the different operators that are used in
    the C programming language. Next, you will learn about the operator precedence
    used in C. Further, you will learn about type casting, mixed mode operations,
    and mathematical functions that are used in C. Finally, at the end of this chapter,
    you will learn about the header files and preprocessor directives that are used
    in a C program.


    # 8.1 Working with Operators


    An operator is a symbol in C, such as +, &, &&, or == which helps the user to
    perform several mathematical and logical computations. An operator is used basically
    to work upon certain data and produce an output as a result of that. The operators
    included in the C programming language are used to operate not only on numbers
