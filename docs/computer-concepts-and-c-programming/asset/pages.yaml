    # Call by Reference


    The call by reference method allows you to copy the addresses of actual arguments
    of the calling function to the formal arguments of the called function. In simple
    words, you can say you get access to the actual arguments and manipulate them
    directly. In this method, the pointers are passed as arguments to the functions.
    When you change the values in the functions, the original values of the actual
    parameters are also changed. Lets create a C program to understand the use of
    call by reference. Listing 8 shows the code of this program:


    +   Listing 8: Passing a Value by using Call by Reference


    ```

    #include<stdio.h>

    #include<conio.h>

    void swap(int *i, int *j) {

    int temp;

    temp=*i;

    *j=temp;

    }

    void main() {

    int x=25, y=30;

    clrscr();

    swap(&x, &y);

    printf("\n x=%d y=%d", x, y);

    getch();

    }

    ```


    Output:

    nx=30 y=25


    In Listing 8, you can see that the values of x and y are exchanged by using their
    addresses stored in i and j.'
