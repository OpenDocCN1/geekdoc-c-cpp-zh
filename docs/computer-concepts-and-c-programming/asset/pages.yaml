    +   * Paragraphs


    A paragraph is a self-sufficient entity that defines the idea of writing in a
    specialized manner. A paragraph can have one or more sentences, which is required
    to define the idea. In a word processing application, such as MS Word, a paragraph
    can be defined as a sentence (or a group of sentences) typed on the screen before
    pressing the ENTER key. In addition, the heading remains a paragraph until you
    press the ENTER key. Paragraph formatting consists of alignment, indentation,
    and spacing. An indent is the distance between a margin and the text, not the
    edge of the page and the text. You can change the indentation of the first line
    as well as the entire paragraphs. Spacing is the distance between any two lines
    in the paragraph. Let''s learn now how to format a paragraph.


    # Aligning a Paragraph


    The arrangement or position of the text or any object within a document in an
    organized way is called alignment. Word provides four types of alignment—Left,
    Right, Center, and Justify. In word processing, the left-aligned text is even
    along the left margin, and uneven or ragged at the right margin. Right aligned
    text, on the other hand, is even along the right margin and ragged at the left
    margin. By applying the justifying settings, the text evenly distributes between
    margins by generating a clear appearance. Most of the justified settings can be
    seen in magazines and newspapers, having a professional appearance. In addition,
    the titles and headings are preferred over the centered text alignment. Perform
    the following steps to learn how to align the text in a Word document:


    +   1. Select the text or a paragraph that you want to align, as shown in Figure
    44:'
