  md: '# # 01 Introduction to Digital Computers


    # ## OBJECTIVES


    +   - Types of Computers

    - The Basic Operations of a Computer

    - Functional Components of a Computer System

    - Classification of Digital Computers


    The term computer is derived from the word compute. In simple words, a computer
    is an electronic device that takes input from a user in the form of data and instructions.
    Once the computer receives the data, it waits for the user''s instructions to
    process the data. On receiving the instructions from the user, the computer processes
    the data and generates some output and displays it to the user. You can provide
    any type of data, such as text, numerals, audio, video, and image, to the computer.
    When the computer processes data, it becomes information.


    Compared to computers developed in 1940s, today''s computers are much smaller
    in size. In addition, the speed of today''s computers is much faster than the
    earlier ones.


    The main advantage of using computer is its capability of performing arithmetic
    and non-arithmetic operations and taking logical decisions at a very fast speed.
    This can be understood from the fact that the speed of computers is measured in
    terms of milliseconds and lesser units of time.


    Computer gives result or output based on the instructions or programs that are
    provided to it. If the instructions are not faulty, then accurate results are
    provided even for complex calculations. The only possibility that an error occurs
    in the result is when inaccurate instructions or faulty data are provided to the
    computer.


    Unlike humans, computers never get irritated or bored of lots of work or even
    the same type of work. A computer has a large storage space which can contain
    the contents of thousands of books. The information written on the computer can
    be retrieved anytime you want. It is a multipurpose machine which can be used
    in education, research and development, business, entertainment, making drawing
    for machines and building, sending information from one place to another in a
    fraction of time with the help of internet, and many more.


    This unit discusses computer and its different types. It explores the fundamental
    components of a computer system. Finally, the chapter concludes with a brief explanation
    on the classification of digital computers.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1


    # 1.1 Types of Computers


    A computer is basically divided into three types on the basis of how it performs
    its computation. The three types of computer are as follows:


    +   - Analog computer

    - Digital computer

    - Hybrid computer


    Analog computers are used to process analog data or signals. Analog signals are
    continuous in nature and have countless values such as speed, temperature, pressure,
    and voltage.


    Analog computers are also used to measure continuous changes in analog data or
    signals. For example, pressure measuring instrument, thermometer, voltage tester,
    and weighing machine. These computers are ideal in situations where data can be
    accepted directly from measuring instrument without having to convert it into
    numbers or codes.


    Initially, analog computers were developed to provide the basis for the development
    of digital computers.


    Analog computers are broadly used for the measurement of analog quantities for
    specialized engineering and scientific applications. They are used to control
    processes in industries such as chemical industry, sugar milk, and oil refinery
    where flow and temperature measurements are required. Analog computers do not
    need any memory for storage as the measurement and comparison of quantities are
    performed in a single operation.


    # Digital Computers


    Digital computers are used to represent letters, numbers, or other special symbols
    in terms of digits.


    A digital computer can be used to process numeric as well as non-numeric data.
    It can perform logical and arithmetic operations such as multiplication, subtraction,
    and division. Most of the computers available today are digital computers. Examples
    of digital computers are accounting machines and calculators.


    The differences between digital computers and analog computers are as follows:


    +   - The output of digital computers is more accurate compared to analog computers.

    - The processing speed of analog computers is faster than digital computers although
    digital computers produce more accurate result compared to analog computers.

    - Digital computers produce output in terms of numbers, whereas analog computers
    produce output as voltage signals.


    # Hybrid Computers


    A hybrid computer is a computer that provides the features of both analog computer
    and digital computer.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction to Digital Computers


    It can perform operations in a faster way with accuracy, i.e., the speed comes
    from analog computer and the accuracy comes from digital computer. These computers
    can process both separate and continuous data. For example, an analog device is
    used in hospital Intensive Care Unit (ICU) to measure the temperature, blood pressure,
    etc., of a patient. These measurements are first converted and then displayed
    in digital form. It is easy to process mathematical and scientific data by these
    computers.


    # 1.2 The Basic Operations of a Computer


    A computer usually goes through four basic operations to process data into information:
    (a) input, (b) processing, (c) output, and (d) storage. These operations are explained
    as follows:


    +   **Input Operation:** In the input operation, the data is entered or captured
    electronically and converted to a form that can be processed by the computer.
    This operation is performed with the help of input devices such as keyboard.

    **Processing operation:** In the processing operation, work is done by the computer
    with the help of processing hardware and software to produce results. For example,
    numbers may be added or subtracted.

    **Output operation:** In the output operation, the information obtained from the
    data is produced in a usable form by use. Examples of output are sound, printed
    text, and charts and graphs displayed on a computer screen.

    **Storage operation:** In the storage operation, data, programs, and information
    are permanently stored in devices such as hard disk, pen drives, and CDs.


    # 1.3 Functional Components of a Computer System


    A computer has mainly four functional components (units) that coordinate with
    each other to perform a given task. These four units are as follows:


    +   Input unit

    Central Processing Unit (CPU)

    Output unit

    Memory (Random Access Memory (RAM) and storage)


    Figure 1 shows the block diagram of how these units function together:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_18_0.png)


    > Figure 1: Functional Components of a Computer System'
  merge: -1
  pgno: 18
