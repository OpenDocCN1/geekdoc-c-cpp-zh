  md: '# Chapter 1


    # Digital Camera


    Digital camera is similar to regular cameras to some extent. It can take pictures
    of people, things, or places. However, digital cameras allow us to take pictures
    in digital form so that they can be used on computers.


    They capture images which are stored in the memory within the camera. When the
    memory is full, it can be deleted and further images can be captured. The digital
    images can be downloaded from the camera to a computer where they can be manipulated,
    displayed, or printed. A digital camera is shown in Figure 12:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_25_0.png)


