  md: '# 90 Chapter 5


    # Problems with the machine language


    +   1. Difficult to understand: We can see that the machine code instructions
    are difficult to understand by human beings. They are only numbers and it is very
    difficult to identify the instructions they are carrying out.


    +   2. Programmer has to remember all machine codes related to various operations:
    Each computer has its own binary code (opcodes) which implies that machine language
    is different for different computer. If a program is to be written in a machine
    language, the programmer has to remember the machine codes for that computer.


    +   3. Programmer has to keep track of the addresses in use: The programmer must
    keep track of the addresses of all the data items as the operands contain the
    addresses of the data, which the user would need to calculate.


    +   4. Programmer has to know all about the machine to be used: The programmer
    must know about the internals, storage and other capabilities of the machine fully.


    +   5. Programs are not portable: If the programs have to move from one computer
    to another, then the addresses of the whole program have to change accordingly
    to the destination computer. This restricts the use of same program on different
