    # Q94. What are compiler directives? Mention names of compiler directives along
    with their purpose.


    Ans. The compiler directives are used to conditionally include a header file or
    define a macro under a specified condition. The compiler directives are:


    +   1. #ifdef: Verifies whether or the macro is defined. If the identifier is
    defined as a macro, then the compiler translates the lines of code followed by
    the condition.

    2. #ifndef: Verifies whether or the macro is defined. If the macro is not defined,
    then the #ifndef directive considers the condition to be true and executes the
    code statements followed by the #ifndef condition.

    3. #if: Allows to define more generalized condition by using the relational operators,
    such as AND(&&), OR(|). If the specified conditions are true, then the subsequent
    code statements are executed.

    4. #else: Allows the action to be performed if the condition is true or false.
    If the condition is true, then the code statements within the #if construct of
    the #if directive are executed. However, if the condition is false, then the code
    statements within the #else construct are executed.

    5. #elif: Allows to take one action if there are multiple decision points. The
    #elif directive is similar to the #else directive, but it is followed by a condition.
    You must note that the #endif is used after the #if, #ifndef, and #ifdef directives.


