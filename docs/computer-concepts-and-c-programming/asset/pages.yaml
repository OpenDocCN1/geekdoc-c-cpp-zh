  md: '# Chapter 8


    The header file are included in a C program using the #include statement. This
    statement is a preprocessor directive. The preprocessor directives are executed
    before the C program is compiled. The different preprocessor directives included
    in a C program are listed in Table 8:


    | Preprocessor Directives | Description |

    |---|---|

    | #include | Includes the content of a file |

    | #define | Replaces a macro with a string value |

    | #if | Tests whether the compile-time condition is true |

    | #undef | Removes a previously created with #define |

    | #else | Specifies an alternative action, when a test fails |

    | #endif | Ends the #if directive |


    The syntax of using the preprocessor directive and the header file in a C program
    is:


    ```

    # include <stdio.h>

    ```


    You observe that the header file is enclosed within angular (<>) brackets. You
    can also include the header file within a pair of double quotes (" "), as shown
    in the following syntax:


    ```

    # include "stdio.h"

    ```


    The difference between the two is that, when the header file is included within
    a pair of angular brackets, the file is searched only in standard directives.
    When the header file is included within a pair of double quotes, the file is first
    searched within the specified directory and then in the standard directories.


    # Summary


