    Q57. What is iteration?

    Ans. Iteration refers to the repetition of the same logic for execution till the
    specified condition is true. It saves the time and energy for writing the same
    statements repeatedly. It is a loop that creates an iterative structure.


    Q58. What is ring topology?

    Ans. In ring topology, devices are connected to a network that has ends connected
    so as to form a complete ring. In this topology, data is transmitted in only one
    direction at a time, that is, either clockwise or anticlockwise (known as unidirectional
    transmission). The main advantage of the ring topology over bus topology is that
    if a break occurs in the ring, the nodes are still able to communicate by going
    the other way around the ring.


