    # Memory


    All the information (data or instructions) that is fed into the computer is first
    stored into the internal or main memory. The main memory is volatile in nature,
    which means when a computer shuts down or power cuts, the stored information no
    longer remains in the memory. To store the information permanently in the computer,
    the information is move to the secondary memory from the main memory. It means
    that the information is kept in the secondary memory even after the computer is
    shut down. To fetch the data from the secondary memory, it is first sent to the
    main memory, and from the main memory, CPU directly fetches the data for processing.


    # Memory Fundamentals


    It is necessary to get familiar with some technical terms to help a user in developing
    a better understanding of the concept of memory. Such terms are discussed as follows:


    +   Memory cell: An electrical circuit or device that is used to store a single
    bit or binary digit (0 or 1) in the memory is known as a memory cell. This is
    the fundamental unit of information storage. For example, a transformed capacitor,
    flip flop, and a single spot on magnetic disk or tape.

    - Memory word: A group of memory cells in a memory that represents instructions
    or data is known as memory word. For example, register containing eight flip flops
    can be considered to a memory that is storing an 8-bit word.

    - Nibble: A group of 4 bits is known as a nibble.

    - Byte: A group of 8 bits is known as a byte. Information or data is frequently
    stored in blocks of eight bits or one byte.

    - Word length: The number of bits in a memory word is known as a word length.
    For example, the word length of an 8 bit memory word is 8 bit or one byte. Depending
    upon'
