    # Smart Card Reader


    Smart card reader is a device used to process cards for the authentication of
    a user for any type of transactions. Smart cards are basically used in western
    countries for bill payments and paying of parking and tolls. They contain an embedded
    microprocessor chip within them. When the smart card and the reader come in contact
    with each other, the identification is done by sending and receiving signals.
    The smart card readers can also be connected to the computer to read information
    from it. A Smart card reader is shown in Figure 15:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_26_1.png)


    ▲ Figure 15: Smart Card Reader


    +   ■ Central Processing Unit


    Central Processing Unit (CPU) is the brain of a computer. It looks like a small
    chip and placed on the motherboard. The power of CPU lies in its ability to process
    data rapidly and flawlessly. The speed of CPU is measured in MegaHertz (MHz).
    Over the years, there has been a gradual improvement in the speed of a computer.
    Intel is one of the biggest chip manufacturer companies in the world. The CPU
    consists of three components, namely, control unit. Arithmetic and Logical Unit
    (ALU), and registers. All the components of a CPU are shown in Figure 16:'
