  md: '# String Handling in C


    Now, when you initialize a string variable by assigning all the characters collectively,
    you use double quotes " ". The following example shows the declaration and initialization
    of a string variable by using the double quotes:


    ```

    char month[8]="JANUARY";

    ```


    In the preceding example, an array of characters or a string variable is declared
    and initialized. The size of this string is 8. All the character constants are
    assigned to the individual elements of the array automatically. In addition, the
    preceding declaration automatically adds the null (\0) character at the end of
    the string.


    After learning how to declare and use a string variable, let''s perform data input
    and output operations to read and display the strings.


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_300_0.png)


    > How are strings processed in C? How are they declared and initialized? Explain
