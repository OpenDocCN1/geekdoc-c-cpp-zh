  md: '# 02 Introduction to Operating Systems


    # OBJECTIVES


    +   * Purposes of an Operating Systems

    * Functions of an Operating Systems

    * Services provided by an Operating Systems

    * Types of Operating Systems

    * DOS

    * Windows Operating Systems

    * Linux Operating Systems

    * Android Operating Systems


    An Operating System (OS) is software designed to work as a middle layer between
    a user and a computer. It translates the user input into a language that the computer
    can understand and process to generate output. Once the output is generated, the
    OS displays the output in a way that the user could understand, thus providing
    an environment that can be used to execute programs.


    With the help of hardware and software, a computer processes the data given as
    input to generate useful information as output. By hardware, we mean all the physical
    parts of a computer, say keyboard, mouse, monitor, printer, computer chassis,
    motherboard, etc., whereas by software, we mean the series of instructions or
    programs that instruct the hardware to perform tasks.


    Software gives "Intelligence" to the hardware, which is basically a set of instructions
    that are grouped into programs to help you run a computer. The software by a computer
    may be classified into application software and systems software.


    An application is a program or set of instructions that are designed to execute
    a particular task. Application software is defined as a collection of programs
    that allow the computer to perform a specific data-processing task. It helps the
    user to work quickly, efficiently and productively. Database software, presentation
    graphics software, spreadsheet software, and word processing software are some
    examples of application software.


    System software is defined as a collection of low-level programs that support
    the operations of a computer. These programs are used to run a computer''s hardware
    and application programs that are written by software programmers. OS, compiler,
    and interpreter are some examples of system software.


    It can be concluded that in a computer system, the hardware provides the basic
    computing resources, which is controlled and supervised by the OS of the computer
    system. In other words, it can be said that an environment is provided by an OS
    within which other programs can do useful work.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Chapter 2


    This chapter briefly discusses OS, its purposes, and its functions. Then it outlines
    the services provided by an OS. Further, the chapter explores the types of OS,
    wherein you learn about batch OS, time-sharing OS, and real-time OS. You also
    learn about Disk OS (DOS) in the chapter. Finally, the chapter provides a glimpse
    of popular OS such as Windows, Linux, and Android OS.


    # 2.1 Purposes of an Operating Systems


    The purpose of an OS is to translate the input into a language which a computer
    could understand and display processed output in such a way that users could easily
    understand. Every computer must have an OS to run programs.


    An OS is basically a platform for all other applications. It handles greater responsibilities
    for large systems. It also takes care of different programs or users running at
    the same time and ensures that they do not interfere with each other. It provides
    security and ensures that unauthorized users cannot access the system.


    Thus, a reliable way is provided for applications by an OS to work with the hardware
    without knowing all of the details of the hardware. The two main purposes of an
    OS are:


    +   1. Performing internal functions

    2. Providing services to the user


    Internal functions manage and help the computer system in working efficiently.
    The services provided by the OS help users have better control over the computer.

    The next section discusses the functions of the OS.


    # 2.2 Functions of an Operating Systems


    Most popular OSs are DOS, Windows, Unix, Linux, OS/2 and Macintosh. An OS perform
    the following functions:


    +   1. Starts the computer (booting process) when the power is turned on.

    2. Acts as an interface between a user and hardware of the computer. It interprets
    the user''s commands or instructions to the hardware.

    3. Keeps track of the status of each resource, such as processor, memory, and
    Input/Output (I/O) devices. It also decides the control of over computer resources
    and who will control these resources.

    4. Configures computer hardware.

    5. Manages main memory.

    6. Manages files and directories on secondary storage devices.

    7. Controls program execution.

    8. Provides security to user''s jobs and files.

    9. Provides access to compilers to translate programs from high-level languages
    to machine language.'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'Introduction to Operating Systems


    # 2.3 Services Provided by Operating Systems


    The OS provides the background to execute the computer applications or programs.
    It provides certain services that support users or programs to perform different
    tasks. Some of the main services provided by an OS are as follows.


    +   - Program execution: A programming environment where a user can execute or
    run programs is provided by the OS. The activities such as multitasking and memory
    allocation are taken care by the OS and the user does not have to worry about
    these activities.


    +   - I/O operations: Every program accepts inputs and produces after processing
    it. This process involves the use of I/O devices. The OS provides I/O for the
    users to run the program. Users cannot control I/O for efficiency and protection
    directly, so the OS must provide this service to handle I/O operations.


    +   - File system management: Users often require copying of one file to another.
    This service is also provided by the OS. The users do not have to worry about
    secondary storage devices. They can give the commands for reading or writing to
    a file and the task is accomplished by the OS.


    +   - Communications: During some instances, processes need to communicate with
    each other to exchange information. This communication may be between the processes
    of the same computer or different computers. The OS passes messages between the
    processes.


    +   - Error detection: An error may cause malfunctioning of the complete system.
    To avoid this, the OS monitors and detects errors. OS monitors the errors, and
    in some cases, it involves de-allocation of memory or altering area of memory
    for a faulty process.


    In the following section, let''s explore the different types of Oss.


    # 2.4 Types of Operating Systems


    OS may be classified into three types, namely, batch OS, time-sharing OS, and
    real-time OS. These systems are distinguished by the nature of interaction that
    takes place between the user and the program.


    In batch OS, the user submits jobs that are collected in a batch and placed in
    an input queue to run. These jobs are processed periodically at specified time
    intervals. During the processing, the user has no interaction with the jobs. After
    processing, the result is given to the user. An example of batch processing is
    payroll processing in a business.


    In time-sharing OS, multiple users can access a single computer system. On a timed
    basis, the Central Processing Unit (CPU) is switched among users. This process
    of switching of CPU among users is controlled by the OS. The service is provided
    to several or many users concurrently. The resources of the computer system as
    memory and CPU are shared by various users in a facilitated manner. During the
    processing, the user has nearly fully interaction with the program.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 34 Chapter 2


    In real-time OS, the completion of work and its delivery should be on time. The
    response time is very important in real-time OS. The real-time OS can be categorized
    into hard real-time OS and soft real-time OS. Hard real time is one in which the
    deadlines are strictly met, whereas soft real time is one in which the deadlines
    are mostly met. An example of real-time processing is to monitor a nuclear power
    station and handle tool control.


    # Some More Classification of Operating Systems


    Some other classification of the OS is discussed as follows:


    +   - Single program OS: It allows only a single program to execute at a time.
    Only after the execution of the first program, the next program can start execution.
    This is also known as single user OS as only one person can work at one time on
    this type of OS. DOS is an example of a single program OS.


    +   - Multi-program OS: In a multi-program OS, more than one program can run at
    a time. In this OS, a user works at one program, while other programs remain active
    in background or in some form of windows. He/she can switch to another program
    whenever it is desirable. For example, windows in which you can run more than
    one program at a time.


    +   - Multiser OS: In this type of OS, more than one user can work at a time using
    the sharing characteristic of OS. Usually, Multiser is also multiprocessing OS.
    For example, Unix OS.


    +   - Multiprocessing OS: Generally, a computer has one CPU, but this type of
    OS can support more than one processor, i.e., By using multiprocessing OS, you
    can run a single large program with heavy calculations on different processors
    simultaneously. This increases the speed of execution of a program. Main frame
    computers and super computers usually support multiprocessing OS.


    # Classification of Operating Systems on the Basis of Working Environment


    On the basis of the working environment (interface), i.e., on the basis how the
    user interacts with an OS, OS can be classified into the following two types:


    +   - Command Interface (CLI) based OS: All OS as DOS and Unix are command based.
    It means that a user has to input the commands by typing. The major limitation
    of this OS is that the user has to remember the commands for the command-based
    OS.


    +   - Graphical Interface (GUI) based OS: The demand of an OS has been increased
    where the user need not to remember the commands. The user selects some graphical
    icons for instead of giving the commands. This icon-based environment is referred
    as GUI GUI allows the user to click and drag objects with the help of the mouse.
    The problem of learning different commands is solved by GUI. Windows is an example
    of such OS. Windows 3.1, Windows 95, Windows 98, Windows 2000, Windows XP, Windows
    Vista, and latest Windows 8 are the various versions of Windows.


    Note that nowadays, OSs Unix and Linux have the features of CLI as well as GUI.'
  merge: -1
  pgno: 49
