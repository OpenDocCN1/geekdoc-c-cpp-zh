    printf("Sum of four numbers are=%%d", sum);

    printf("\n A=%%d, B=%%d, a, b", a, b);

    ```


    First statement displays text enclosed within the pair of double-quotes.

    Second statement displays the value of var1.

    Third statement displays the value of variables m and n.

