  md: '# Introducing the C Language


    # History of C


    Prior to C, the Basic Combined Programming Language (BCPL) was used, which was
    introduced by Ken Thompson. The C language had many features from the B language.
    In addition, with the introduction of struct types, the C language became more
    popular; and there, the UNIX kernel was re-written in C.


    Initially, the version provided along with the UNIX operating system was the de
    facto standard for the C language. This version was first described in "The C
    Programming Language", written by Brian Kernighan and Dennis Ritchie. Later, in
    1983, a committee was introduced to create the American National Standards Institute
    (ANSI) standard to define the C language. In early 1990s, this was also adopted
    by International Standard Organization (ISO) to develop the ANSI/ISO standard.
    By the end of 1999, the C standard was referred as C99. The following are the
    standards of C:


    +   - K&R C: Refers to the standards for the C language defined in the first edition
    of "The C Programming Language". The K&R standard provides various language features,
    such as standard input/output library, long int type, unsigned int type, and compound
    assignment operator.

    - ANSI C and ISO C: Refers to the C standard that was adopted by the ANSI committee
    in 1983. This standard is also known as C89. Later, ISO adopted this ANSI standard
    and developed ISO C, which is also referred as C90.

    - C99: Provides several new features, such as inline functions, new data types-
    and long int, variable-length arrays, and support for single line comments.

    - C1X: Refers to the standard that was adopted by the C standard committee. According
    to C1X, any new features will not be introduced until they have been verified
    by current applications.


    # Features of C


    The features of the C language are:


    +   - Is a structured programming language

    - Provides various operators, such as arithmetic, increment, decrement, and relational

    - Helps to develop efficient programs and system software

    - Can be compiled and executed on any computer

    - Allows manipulation of internal processor registries

    - Provides various data types, such as int, float, and char

    - Allows use of pointers for memory, array, structures, and functions

    - Provides high level constructs and allows the programmers to make extensive
    use of functions'
