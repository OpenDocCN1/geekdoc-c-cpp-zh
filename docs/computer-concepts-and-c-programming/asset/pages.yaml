  md: '# 10 Arrays


    # OBJECTIVES


    +   * Introducing Arrays

    * Types of Arrays

    * Limitations of Arrays


    As you know, variables are used to store values in a program. However, many times
    we need to work with a set of values of the same type. For example, we may need
    to store the marks obtained by 100 students in an examination. In this case, it
    is very difficult to define 100 variables to store the marks of each student.
    In such a situation, it is better to have a single variable that can store all
    the values rather than storing each value in a separate variable. The simplest
    way to store a set of values is to use an array.


    In this chapter, you will learn what an array is and how elements are organized
    in an array. Then, you will learn about different types of arrays. You will also
    learn to work with one- and two-dimensional arrays. Finally, you will learn about
    some limitations of arrays.


    # 10.1 Introducing Arrays


    An array is a collection of same type of values stored in consecutive memory locations.
    It can be used to store the values of different data types, such as int, float,
    double, char, and string. Each value in an array is referenced by a single name,
    which is the name of the array, and a subscript or index, which indicates the
    position of the value in the array. The subscript is a positive integer number,
    which is enclosed in a pair of square brackets. As subscripts are used in arrays,
    they are also referred to as subscript variables.


    The values in an array are known as the elements of the array.The structure of
    an array, myArray, containing n elements is shown in Figure 1:


    ```

    myArray[0] | myArray[1] | myArray[2] | ... | myArray[n-1]

    ```


    > Figure 1: Structure of an Array


    In Figure 1, myArray[0] represents the first element of the array, myArray[1]
    represents the second element of the array, myArray[2] represents the third element
    of the array, and myArray[n-1] represents the n^th element of the array.'
