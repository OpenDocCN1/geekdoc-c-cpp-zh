  md: '# Chapter 2


    # Communication with DOS


    The commands in DOS are case insensitive, that is, we can type the commands both
    in upper case and lower case.


    Some of the DOS commands are very powerful, such as "Format," Recover," and "Del"
    commands. These commands should be used very carefully. The rest of the commands
    are very much safe to use.


    # How does DOS Organize Disks?


    In DOS, the files are stored in a hierarchical structure. This means that all
    files and folders are stored in a special folder named directory on disk. Directories
    contain a list of files.


    In DOS, the root directory is represented by "\backslash". A directory path name
    contains the disk drive, subdirectory, and folder is required to represent the
    directory on the disk. Disk drives are represented using a single alphabet. For
    example, "A:" represents the floppy disk drive and "C:" represents the hard disk
    drive.


    # How is DOS Used?


    Commands are the set of tasks used to interact with the OS. When a user types
    any command on the DOS prompt, the OS is directed to perform that task.


    For example:


    ```

    C:\BOMB

    ```


    It means that you want to execute a program BOMB (may be a game) from the C drive
    or hard disk. In this example, "C:\"" is the DOS prompt.


    +   There are two types of DOS commands, which are as follows:


    +   Internal commands: Internal commands are the commands that are present in
    computers memory and are loaded from Command.com. Most of the internal commands
    are used to manage files.


    +   External commands: External commands are the commands that are not present
    in Command.com. These commands are used to perform specific tasks. These commands
    need to be loaded from the disk into the memory before their execution. External
    commands has such as .COM, .EXE, and .BAT.


    Some very useful internal DOS commands are as follows:


    ```

    C:\A:<Press Enter>: This command is used to change current directory path to the
    floppy disk drive.

    ```


    ```

    A:\C:<Press Enter>: This command is used to change current directory path to the
    hard disk drive.

    ```'
  merge: -1
