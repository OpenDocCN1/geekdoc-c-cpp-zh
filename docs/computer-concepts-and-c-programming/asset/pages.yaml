    # 12.3 Reading and Displaying the Strings


    In a program, input and output are two important processes that are used to accept
    input details and display the information after processing these details, respectively.
    A string can be read or display by using the input and output functions, such
    as getc(), puts(), printf(), and scanf(). These input and output functions are
    defined in the stdio.h file to perform I/O operations. You can display a string
    by using the printf() function, puts(), or putchar() functions. However, a string
    can be read by using either a keyboard or a data file. You can provide a user-defined
    string by using the scanf(), gets(), or getchar() functions.


    +   Using the scanf() and printf() Functions


    As you are already familiar with the scanf() and printf() functions, these are
    used to perform console-based input and output (I/O) operations in a program.
    The scanf function reads characters from the keyboard and stores them in variables
    according to the specified formats, which are known as format specifiers. When
    you need to read a string, you can use the %s format specifier. The following
    example shows the scanf() function:


    ```

    scanf("%s", &month_name);

    scanf("%s", &employee_name);

    ```


    In the preceding examples, the scanf() function reads strings for month_name and
    employee_name string variables or char array variables.

    The printf() function using the %s format specifier prints a string stored in
    character array to the console. You can use the printf() function to display the
    string data in two ways. Either you can pass the string directly to the printf()
    function or you can store the string in a character array and then pass the array
    as a parameter in the printf().'
