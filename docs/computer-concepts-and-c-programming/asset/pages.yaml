  md: '# Introduction to Digital Computers


    Touch screens are very useful for people who are unfamiliar with computers and
    are used in libraries, banks, shops, restaurants, etc. The major disadvantage
    with touch screen is that it is difficult to point accurately to small areas of
    the screen.


    # Graphics Tablets


    A graphic tablet or a digitizer is used to convert drawings, photos, etc. to digital
    signal. It has special commands to operate on. This device has a flat surface
    on which the user moves a special pen or stylus. The pressure is detected by the
    surface and the data about the position is sent to the computer, wherein the software
    produces the drawing on the screen. It is much more accurate than trying to draw
    with a mouse. Figure 6 shows a graphics tablet:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_22_0.png)


    Figure 6: Graphic Tablet


    # Microphone(Mic)


    Microphone or mic can be used to speak to a computer. It is an acoustic transducer,
    i.e., it converts sound waves into electric signals.


    Computer can accept the spoken word as input data or commands that can be used
    to control machines. A microphone is shown in Figure 7:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_22_1.png)


    Figure 7: Microphone


    Microphones are also used to change radio frequencies in airplane cockpits, asking
    for stock-market quotations over the phone, controlling inventory in an auto.junkyard,
    etc.


    Microphones are also used in radio, telephones, hearing aids, television, etc.


    # Optical Readers


    Optical readers include the various devices that read the characters with the
    help of light beams. These are explained as follows:


    +   a. Scanner: Scanner is a device similar to a photocopier. The photocopier
    scans a page and prints the same contents of that page on a paper, whereas a scanner
    let you put your text,'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'pictures, and images onto your computer. A scanner converts text, pictures,
    and images to digital form so that you can edit them as per your need using the
    computer or put them on the Internet. Figure 8 shows a flat-bed scanner and a
    hand scanner:


    ![](img/9c1ae73c50c0bad69a0ef5ee4183f5ee_23_0.png)


    ▲ Figure 8: Flat-Bed Scanner and Hand Scanner


    The preceding figure shows the types of scanner. The handheld scanner can scan
    a few lines of text in one sweep, but a page scanner inputs a standard-sized page.
    Another type of scanner, the flatbed scanner, can read oversized documents or
    book pages. The advantage of the handheld scanner over page scanner is that it
    is very cheap in comparison to the leader.


    +   b. Optical Character Reader (OCR): OCR devices read characters directly from
    documents. The characters have to be in special type fonts. Some typeface fonts
    agreed upon by the American National Standards Institute (ANSI) optical character
    committee are shown in Figure 9:


    ```

    ABCDEFGHIJKLM

    QRSTUVWXYZ

    0123456789

    / : ; * + = - | # & 8

    Ñ Ñ Å Ä Æ ‡ ¥ ∫

    € | } % ?

    ```


    ▲ Figure 9: Standard Typeface Fonts Agreed upon by the ANSI Optical Character
    Committee


    written data is also read by some of the OCR devices. The OCR emits light which
    help in reading and recognizing the text. This text is further converted into
    electrical signals which are recognized by the computer. In this process, the
    documents containing the text or images are first scanned by the scanner and then
    transmitted to the computer. Compared to keystroke data entry, OCR data entry
    is much faster, accurate, and efficient.


    +   c. Bar code reader: Bar codes consist of a series of black and white bars.
    A light beam is incident on the bar code and the bar code reader measures the
    amount of light reflected back. The white areas reflect more light than the black
    areas.'
