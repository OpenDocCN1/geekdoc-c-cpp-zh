    # 14.7 Working with Functions and Pointers


    Similar to the other parameters, you can also use pointers in a function declaration
    by passing them as parameters to functions. By using pointers, you can easily
    represent a complex function in a C program. The pointers can be passed to a function
    by using two methods:


    +   - Call by value


    +   - Call by reference


    # Call By Value


    When you access a function, a link is established between the formal and actual
    parameters. The calling function passes the values stored in its actual parameters
    to the formal parameters of the called function. The called function creates copies
    of the received values and performs all required operations on those copies. Therefore,
    the changes made to the formal arguments do not affect the actual arguments in
    the calling function. Let''s create a C program to understand the use of call
    by value. Listing 7 shows the code of this program:


    +   - Passing a value by Call by value


    ```

    #include<stdio.h>

    #include<conio.h>

    void swap(int i, int j) {

    int temp;

    temp=i;

    i=j;

    j=temp;

    printf("\n i=%d j=%d", i, j);

    }

    void main() {

    int x=25, y=30;

    }

    ```'
