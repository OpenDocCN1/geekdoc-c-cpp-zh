    # 6.4 Introducing const and volatile Type Qualifiers


    American National Standards Institute (ANSI) C., which is a standard defined for
    the C programming language, has introduced two new type qualifiers called const
    and volatile. Both these type qualifiers are independent of each other. The const
    qualifier is used to specify a constant value in a variable and the volatile type
    qualifier is used to instruct the C compiler to alter the value of the variable
    by using some outside factor.


    +   * The const Type Qualifier


    Using the const qualifier, you can keep the value of a variable as constant during
    the execution of a program. Once you declare a variable by using the const qualifier,
    you cannot change its value later in the program. Any attempt to change its value
    would result in an error. The following code-snippet provides examples of using
    the const type qualifier:


    ```

    const float pi=3.142;

    const int size=90;

    ```'
