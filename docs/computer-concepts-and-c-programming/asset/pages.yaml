    # 4.4 Pseudocode


    Pseudocode is an outline of a program that is expressed in a formally-styled natural
    language in compare to a program language. It provides a detailed template for
    the programmers that help writing codes in the next step. In particular developing
    the process of developing a programming language. It lets designers to express
    the design in detail. It is less costly to find the errors in the pseudocode stage
    rather than finding it at later stage. The advantage of pseudocode is that it
    enables the programmer to focus on the algorithms without concerning about all
    the syntactic details of a specific programming language. Pseudocode can be compiled
    and executed. It has no standard syntax rule. Once, you have completed the pseudocode
    and it is accepted, then it can be written in the syntax form of a programming
    language. The following example shows the examples of


    +   **Example 1:** Sum of 2 Numbers


    ```

    Begin

    input a, b

    sum = a +b

    print sum

    End

    ```'
