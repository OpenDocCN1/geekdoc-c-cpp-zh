  md: '# 474 ► Appendix C


    Deleting old files makes room for new ones. Remember that, once you delete a file,
    you cannot get it back.


    To delete a file using the following command:


    ```

    DEL C:\{filename\} {ENTER}

    ```


    Wildcards can also be used with DEL command to execute commands with the given
    criteria. For example:


    ```

    DEL C:\* {ENTER}

    ```


    The preceding command, deletes all the files stored in the root directory of C.


    +   * Using-on Help


    The HELP command is used to access information and help file from the MS-DOS prompt.
    You can use the HELP command in the following ways:


    +   1. HELP (ENTER)


    +   2. HELP (command needed on) (ENTER)

    The first way allows you to invoke the full file using the MS-DOS commands and
    also to scroll up and down on the command prompt using the cursor keys and the
    TAB key. In addition, you can select the desired command to see its details.

    On the other hand, the second method enables you to the command''s opening screen.

    In this way, the opening screen gives you the syntax for the command.

    The syntax used for the DIR command as follows:


    Syntax:


    ```

    DIR [drive:][path][filename] [/A[::attributes]] [/B] [/C] [/L] [/N]

    [/O[::sortorder]] [/P] [/Q] [/R] [/S] [/T[::timefield]] [/W] [/X]

    [/4]

    ```


    You can use a shortcut to find the parameters and switches for most MS-DOS commands.
    In addition, many program names is used to add the switch after the command name.


    The WIN to start MS Windows gives you a list of possible switches that you use.


    # Listing Files in a Directory


    The list of the current directory on the screen can be displayed by using the
    DIR command. The syntax used for DIR command:


    ```

    DIR

    ```'
