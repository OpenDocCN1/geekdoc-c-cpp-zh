    | ''\f'' | Represents form feed |

    | ''\n'' | Represents new line (line feed) |

    | ''\r'' | Represents carriage return (CR) |

    | ''\t'' | Represents horizontal tab (contains fixed set of space) |

    | ''\v'' | Represents vertical tab |

    | ''\"'' | Represents double quote |

    | ''\'''' | Represents single quote |

    | ''\0'' | Represents null character (end of string) |

    | ''\\'' | Represents backslash character (\) itself |


    # 6.7 Exploring Symbolic Constants


    A symbolic constant is a name that can be used as a substitute for a numeric constant,
    a character constant or a string constant. For example, while calculating the
    area of a circle, you use the formula `area = 3.142 * circle_radius * circle_radius`.


    In the preceding formula, you can replace the numeric constant 3.142 with the
    symbolic constant named PI. Therefore, the formula can be written as:


    ```

    area=PI * circle_radius * circle_radius

    ```'
