    ```


    The preceding command displays the content of the file APRIL.DOC.

    If want to display a long file, you can use the MORE command displays output in
    full-screen mode at any. To view the remaining output press any key.

    For example:


    ```

    TYPE APRIL.DOC | MORE {ENTER}

    ```


    > The pipe (|) switch usually be found by holding down the SHIFT key and pressing
    the backslash (\) key.


    # Renaming a File


    You use the RENAME command (REN for short) to change the name of a file. The general
    format is:


    ```

    REN {oldname} {newname} {ENTER}

    ```


    The command in the preceding code snippet will not work if the new file name is
    same as the old name.


    # Printing a File


    You can use the PRINT command to get a hard copy of the data. Following is the
    command to print the data:


    ```

    PRINT MEMO.DOC {ENTER}

    ```


    This command prints the content of the file MEMO.DOC.


    +   Deleting a File

    nYou can use the DEL command to delete files that you do not need any more.'
