    # Q32. Write short note on buffering and spooling.


    Ans. Buffering: Buffering is the process in which data is to be used by the process
    is pre-fetched in a memory region called buffer. This pre-fetching is done to
    prevent speed mismatch when there is a difference between data transfer rate and
    processing rate of the processor.


    Spooling: Spooling is a process in which jobs are stored in buffer from where
    different devices can access them and when needed. The devices usually have different
    rates of accessing data. Spooling helps in situations such as these, where data
    can be stored for some time until they are required by different devices.


    # Q33. What are FCFS and SJ scheduling techniques?


    Ans. First-Come-First-Served (FCFS): The FCFS scheduling is one of the simplest
    scheduling, its implementation is straightforward which is maintained by FIFO
    (First-In-First-Out) queue. the queue of pending jobs is maintained by the scheduler
    and processes the first one it finds in the queue.


    Shortest Job First (SJF): In SJ scheduling, the scheduler selects and executes
    a process that has shortest run time among all processes in the queue holding
    the processes submitted to the operating system. However, when two processes have
    same run time then they are executed in FCFS fashion.


    # Q34. Write short note on virtual-storage.


    Ans. Virtual storage is a primary storage that does not actually exist. It gives
    a programmer the illusion of a primary storage. The computer system itself maintains
    this illusion through combination of hardware and software techniques. Virtual
    storage has two advantages. First, the CPU is fully utilized, and the second advantage
    of virtual storage is that programmers no longer need to concern about the size
    of primary storage while writing programs.


    # Q35. What do you understand by paging?


    Ans. Paging is a process in which program data is divided into fixed size blocks
    that are called pages. Pages can be stored in non-contiguous locations in memory.
    It helps in efficient memory management by preventing problems related to storage
    and fragmentation.


    # Q36. What is computer network?


    Ans. A network is an arrangement in which two or more computers are connected
    in such a way that they are able to communicate with each other. With a network,
    computers can receive electronic mail (e-mail), send files and instant messages
    to each other. In a network, the computers are connected by network cables through
    which data is transferred in the form of signals.'
