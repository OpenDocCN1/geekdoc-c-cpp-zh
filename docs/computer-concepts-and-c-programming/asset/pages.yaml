    # 6.6 Exploring Backslash Constants


    A backslash is always a combination of two characters where the first character
    is always the backslash (\ and the second character is one of the following: a,
    b, f, n, r, t, v, '', and 0. The backslash is also known as the escape sequence
    and used in output statements. Table 7 lists the backslash character constants:


