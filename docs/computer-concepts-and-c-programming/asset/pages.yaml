    # Types of Main Memory


    Main memory is also known as internal memory or primary memory of the computer.
    The data or information which is fed to the computer is stored in the main memory
    first. It is volatile in nature, i.e., as power is switched off, the data no longer
    remains in the main memory.


    The main memory or primary memory can be further classified into the following
    categories:


    +   1. **Random Access Memory (RAM)**: It is a part of the main memory which is
    temporary or volatile in nature. When you shut down the computer, the operating
    system and other supported files are again loaded into the RAM, from the hard
    disk. This is also known as read write memory as the programs and instructions
    in the memory when changing by the process of reading and writing. There are two
    types of RAM:


    +   - **Dynamic RAM (DRAM)**: it represents a temporary memory of your computer.
    Here, the term dynamic access time is and more volatile than Static Ram (SRAM).
    Unlike firmware chips (ROMs, PROM), both SRAM and DRAM lose their data when the
    computer is shut down or the power is turned off.


    +   - **SRAM**: does not need be refreshed, however, it is more expensive than
    the DRAM. It represents a type of temporary memory and is more reliable than DRAM.
    The access time of SRAM is as low as 10 nanoseconds, whereas DRAM, the access
    time is around 60 nanoseconds. In to DRAM, SRAM has shorter cycle time because
    it does not require between accesses.


    +   2. **Read Only Memory (ROM)**: It is also a part of the primary memory, but
    it is non-volatile in nature like RAM. It means that the data stored in ROM is
    not lost when the computer power is turned off. The data or instructions from
    this type of memory can be used to read only. Any change in the contents of ROM
    is not possible, i.e., you cannot write back into the ROM. It is used to contain
    the programs or data, which are critical and used frequently. There are five types
    of ROM, which are discussed as follows:'
