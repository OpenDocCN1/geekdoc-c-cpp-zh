    +   Initializing Structure Variables

    Each structure variable contains a copy of all the members of the structure. Initializing
    a structure variable involves assigning values to its structure members. You can
    assign values to the members of a variable either at once or one at a time. In
    the first approach, the declaration of the structure variable and the initalization
    of the structure members are done using a single line of code. The following code
    snippet declares a variable of a structure type, and also assigns values to its
    members, using a single line of code:


    ```

    struct student_1 = {101, "James", 24, ''A''};

    ```


    In the second approach, you first need to declare the structure variable, and
    then initialize each member of the structure variable by one. Initializing each
    structure member separately requires you to access individual members. You can
    access a structure by using the name of the structure variable, followed by the
    dot (.) operator, and a member of the structure member. The syntax to access and
    initialize a member of a structure variable is as follows:


    ```

    structure_variable_name.structure_member = value;

    ```


    In the preceding syntax, structure variable_name represents the name of the structure
    variable, structure_member represents the name of the structure variable, and
    value represents the value assigned to the structure member.


    The following code snippet first declares a variable of a structure type, and
    then assigns values to its members, one by one:


    ```

    struct student_student_1;

    student_1.roll_no = 101;

    strcpy(student_1.name, "James");

    student_1.age = 24;

    student_1.grade = ''A'';

    ```'
