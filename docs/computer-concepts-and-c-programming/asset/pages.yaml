    Q37. What is networking protocol? Name any four networking protocols.


    Ans. A networking protocol specifies a set of rules that are to be followed by
    two devices on a network to communicate with each other. A protocol can also provide
    features such as error detection and correction, security, authentication, and
    so forth.

    TCP/IP, SMTP, POP3, and UDP are some examples of networking protocols.


    Q38. What is a repeater?


    Ans. A repeater is a networking hardware device that works at the Physical layer
    of the OSI model. It connects the two segments of the same LAN. Signal carrying
    information travel a limited distance before its quality weakens. When a repeater
    receives a weak signal, it regenerates the original bit pattern.


    Q39. What is a hub?


    Ans. A hub is a network device used to connect multiple computers together to
    form a small network. A hub contains a number of ports. You can connect different
    computers to these ports.


    Q40. What is a bridge?


    Ans. A bridge is a hardware device that works in the physical as well as data
    link layers of the OSI model. As a physical device, the function of a bridge is
    to regenerate the weak signals it receives and as a data link device, its function
    is to check the physical address of the source and destination nodes.


    Q41. What is a router?


    Ans. A router is a networking hardware device that connects LANs and WANs on the
    Internet. It works at the network layer of the OSI model. A router contains a
    routing table that decides the route of a data packet. The routing table contains
    the IP address of the source and destination nodes. The router receives a packet
    from a network (source), checks for the IP address of the destination, and sends
    it to the appropriate destination.


    Q42. What is Gateway?


    Ans. A gateway is used to connect two different networks that are based on different
    protocols or have different architecture. It consists of protocol translators
    that enable communication between the devices and translate data so that a device
    based on different protocol can understand it. A gateway can be implemented in
    hardware, software, or in both hardware and software.


    Q43. Mention names of layers present in the OSI Reference Model?


    Ans. Physical Layer, Data Link Layer, Network Layer, Transport Layer, Session
    Layer, Presentation Layer, and Application Layer


    Q44. What is a LAN?


    Ans. Local Area Network (LAN) is a privately owned network of an organization.
    It is used to connect a computer with other hardware, such as a printer, at home
    or in an office. The range of LAN is restricted to a few kilometers only. This
    type of network is useful when you want to connect two different departments in
    a building.'
