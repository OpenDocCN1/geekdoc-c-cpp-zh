  md: '# 03 Number System


    # OBJECTIVES


    +   - Introduction to Number System

    - Number System Conversion

    - Binary Arithmetic


    Various number systems are necessary for representing and manipulating data in
    digital computers. A number system is a set of numbers that represent some data,
    which can generate useful information after performing some operation. For the
    representation of data, the number system is classified into decimal, binary,
    octal, and hexadecimal number systems based on the total number of digits that
    can be used in the representation. Earlier, data is processed using binary numbers.
    However, with the passage of time, the use of binary numbers has become tedious
    as they are very long. Therefore, the octal and hexadecimal number systems came
    into existence and are used widely as the long binary numbers are compressed through
    them. It is the different types of number systems that enable computers to communicate
    with each other and operate easily.


    However, the data provided to a computer needs to be easily understandable by
    the computer and the processed data as output information needs to be understandable
    by human, that is, the user. Therefore, the conversion of the data from one to
    another is required to make the data understandable and useful. For example, while
    providing input to a computer, the data should be in binary number, which is required
    to be converted into its corresponding decimal number while providing output of
    the operation to a user. In short, the different types of number systems are converted
    from one form to another according to convenience and requirement.


    This unit discusses number system, wherein you learn about the types of number
    system such as decimal number system, binary number system, octal number system,
    and hexadecimal number system. Further, it explains the conversion techniques
    for converting numbers from one number system to another. Toward the end, the
    unit briefly discusses binary arithmetic.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# 3.1 Introduction to Number System


    A number system is used to represent numbers that signify quantity. For example,
    numbers are used to represent students in a class, subjects in a course, bananas
    in a dozen, states in India. A number system of base or radix m is a system containing
    different symbols for representing m different digits. The most commonly used
    number system is decimal system which has base 10.


    The following different number systems are used by computers:


    +   - Decimal number system

    - Binary number system

    - Octal number system

    - Hexadecimal number system


    Table 1 presents the different number systems, their bases, and range of number
    with examples:


    | Number System | Bases | Range of Number | Examples |

    |---|---|---|--|

    | Decimal | 10 | 0–9 | (25)10 |

    | Binary | 2 | 0–1 | (11010)2 |

    | Octal | 8 | 0–7 | 32_8 |

    | Hexadecimal | 16 | 0–F | 19_16 |


    # Decimal Number System


    Decimal system is the most commonly used number system by modern civilization,
    which uses 10 as its base and hence also known as base-10 number system. In this
    system, every number represents a polynomial in powers of 10. The base or radix
    of any number system is decided by the number of digits in the number system.
    The decimal system uses 10 numbers from 0 to 9. Let''s consider the number 1843,
    which is the same as:

    1843 = 1000 + 800 + 40 + 3


    It can also be written:


    (1843)₁₀ = 1 × (10)³ + 8 × (10)² + 4 × (10)¹ + 3 × (10)⁰


    It can be seen that each digit is multiplied by 10 to a power and then all of
    the results are added up. In the same manner, you can learn to count in a different
    base by using this technique.


    For example, let''s consider the number 1843 in base 5. It would be written as:


    (1843)₅ = 1 × (5)³ + 8 × (5)² + 4 × (5)¹ + 3 × (5)⁰ = 348


