    In C programming, file is a place on secondary storage device, like hard disk
    or pen drive. where a group of related data is stored.


    You know that, when a C program is terminated, the entire data is lost. If you
    want to use large volume of data, it is time consuming to enter the data again.
    But, if file is created, the large volume of information can be stored for future
    use. The data can be accessed or modified using few commands.


    # ## 15.1 Types of File


    The C language supports three types of data files as follows:


    +   1. Text files

    2. Variable length record files

    3. Fixed or constant record files


    # ### Text Files


    Text files also known as simple ASCII files are the stream oriented data files.
    In this type of file the data is read or written as the stream of characters.
    The data input in text files is written exactly same as you type from keyboard.'
