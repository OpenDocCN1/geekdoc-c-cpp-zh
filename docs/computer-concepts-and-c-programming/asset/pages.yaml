  md: '# Types of High Level Languages


    There are five types of high level languages. These are as follows:


    +   Commercial or business purpose languages: These languages are also known as
    Data Processing Languages. These languages are mainly used for business applications
    and data processing. File handling is the main feature of these languages. File
    handling includes naming, arranging, movement and processing of files, records
    and fields etc. The statements and rules used in these languages resemble with
    English terms. These languages are extensively used in processing of payroll systems,
    accounting and financial systems, and inventory control systems and for some other
    file handling problems, as these languages are suitable for formulating the well-formatted
    reports, outputs and special forms. The most commonly used Commercial languages
    are COBOL and RPG.


    +   Scientific Languages: These are also known as algebraic languages. These are
    used for scientific and engineering purpose applications. These are mainly used
    to write computational procedures to solve mathematical and statistical problems.
    These languages are currently used to handle complex business applications including
    microeconomics, corporate and business simulations, operations and research, and
    so on. They are also used to find the solutions for the problems of differential
    equations or solving a set of linear equations or statistical analysis of data.


    Such languages have powerful mathematical functions such as in-built library facility
    with all necessary mathematical functions. These languages have ability to handle
    mathematical expressions very efficiently. These also have ability to handle one,
    two or multiple dimensional arrays.


    These languages lack in handling files or non-numeric data processing. Some commonly
    used scientific languages are FORTRAN, ALGOL and PL/1.


    +   Special Purpose Languages: These languages are designed to keep some special
    purposes. For example: LISP is designed for string handling and text processing.
    SIMULA, SIMCRIPT and GPSS are developed for simulation and control of experiments.


    +   Command Languages: These languages are specially used for controlling the
    operations of the computer. These are used to write software like operating systems,
    compilers or linkers etc. These languages are also used to design and develop
    new languages. C is the example of such type of languages. UNIX operating system
    and the C compiler itself are written in C.


    +   Multipurpose languages: These languages are suitable for many different applications
    instead of using only a special field. These languages are very portable like
    Java and can be used with different computers on different platforms. These languages
    have the facility of structured programming. Today most of the languages are multipurpose
    languages.'
