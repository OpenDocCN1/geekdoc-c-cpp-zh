    # 前言


    《实用 C++ 后端编程》是一份全面的指南，为读者提供了必要的工具和知识，帮助他们成为精通 C++ 后端的开发人员。本书重点关注现实应用和实际实现，带领读者领略后端开发的多个领域，是任何有志成为后端开发者或现任后端开发人员的不可或缺的资源。


    从基础知识开始，本书介绍了 `C++`，为该语言、其结构以及与后端编程的核心概念奠定了坚实的基础。随后，读者将深入学习后端开发中更复杂的元素。通过引人入胜的章节、用例和示例，读者将接触到并发编程等高级主题，探索使用线程和多进程来处理密集型计算任务，从而为构建可扩展应用程序奠定基础。


    本书深入探讨了 API（特别是 `gRPC`）、以及缓存策略和数据库管理，并使用 `MongoDB` 作为首选的 NoSQL 数据库。在此过程中，读者将学习如何在实际场景中实现这些技术，从零开始构建一个博客应用程序，从而弥补理论与实际实现之间的鸿沟。书中专门有一个章节介绍应用程序安全，其中教授了身份验证、授权和数据库安全，并演示了如何在博客应用程序中实施这些措施。


    本书的另一个极其重要的部分是涵盖测试策略，教授读者如何使用 `Google Test` (`gtest`) 创建健壮且无故障的后端解决方案。最后，这段旅程将在在
    `AWS` 上部署应用程序的逐步引导中告终，确保读者具备了将其应用程序推上线所需的必要技能。


    ## 在本书中，你将学习如何：


    *   `C++` 编程的详细概述，兼顾初学者和经验丰富的编码人员。

    *   并发编程的实战探索，以设计可扩展且高效的应用。

    *   全面理解 API 的用法，特别是使用 `gRPC` 框架。

    *   深入研究 `MongoDB` 以实现有效的 NoSQL 数据库管理和操作。

    *   实现缓存策略以进行性能优化的步骤。

    *   策略性地使用 `Nginx` 处理包括负载均衡在内的 Web 服务器需求。

    *   为数据库、API 和 Web 服务器实施安全措施的实操指南。

    *   使用 `Google Test` 进行健壮应用程序测试和调试的说明。

    *   在 `AWS` 上部署应用程序的逐步指导，确保满足真实环境的就绪要求。

    *   通过构建和完善博客应用程序来实际应用相关概念。


    '
- fmt: "\n# Prologue\n\nToday's software engineers need a diverse set of abilities\
    \ to keep up with the fast-paced evolution of technology. Knowledge of databases,\
    \ application programming interfaces (APIs), web servers, and other related technologies\
    \ is also required. Using the robust and flexible C++ programming language, this\
    \ book is meant to serve as a comprehensive guide to backend development. This\
    \ book teaches readers the fundamentals of C++ application development through\
    \ a combination of theoretical discussion, real-world examples, and hands-on exercises.\n\
    \nThe first part of the book is devoted to explaining C++ and why so many programmers\
    \ find it to be the best language for the job. This book provides a comprehensive\
    \ overview of C++, covering everything from the language's fundamentals to its\
    \ cutting-edge features like concurrency. C++ Standard Template Library (`STL`)\
    \ is a robust toolkit for C++ programmers, and it is explored in detail. \n\n\
    The second half of the book delves into algorithms and databases, the meat and\
    \ potatoes of back-end development. It explains how various algorithms can be\
    \ used to simplify difficult problems, enhance functionality, and streamline the\
    \ code. The book delves into how to put the CRUD operations into practice using\
    \ `MongoDB`, a well-known NoSQL database. \n\nThe third, the book dives into the\
    \ ins and outs of building and utilizing APIs, with a focus on the `gRPC` framework.\
    \ The `gRPC` framework is a trustworthy and productive tool for creating distributed\
    \ programs and services. It helps programmers create APIs that can scale to a\
    \ large number of requests without sacrificing performance. This section also\
    \ delves into the topic of protecting APIs and web servers.\n\nThe testing and\
    \ debugging process takes up the bulk of the book's fourth section. Using the\
    \ `Google Test` framework, it explains in detail how to create test cases and\
    \ how to troubleshoot problems that may arise. The code is always in a deployable\
    \ state thanks to the book's explanation of how to set up a continuous testing\
    \ environment. \n\nThe deployment procedure is discussed in the book's final chapter.\
    \ It explains in detail how to use `AWS`, the most widely used cloud platform,\
    \ for application deployment. This section also discusses the various factors,\
    \ such as security, scalability, and performance, that must be taken into account\
    \ during deployment.\n\nThroughout the book, you'll build a blog application to\
    \ practice the skills you learn. This method guarantees that readers aren't just\
    \ absorbing the theory but also using it in practice. What sets this book apart\
    \ from others is its emphasis on actual application. By the book's conclusion,\
    \ readers will have a solid grounding in C++ back-end development and will be\
    \ able to apply what they've learned to create applications that are efficient,\
    \ robust, and secure.\n\n# Practical C++ Backend Programming\n## Crafting Databases,\
    \ APIs, and Web Servers for High-Performance Backend\n\nJustin Barbara ![img](image/image-0-0.jpg)\
