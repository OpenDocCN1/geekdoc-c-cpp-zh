- fmt: '

    # Preface


    "Practical C++ Backend Programming" is a comprehensive walkthrough that provides
    readers with the necessary tools and knowledge to become proficient C++ backend
    developers. With a strong focus on real-world application and practical implementation,
    this book takes readers on a journey through the multifaceted landscape of backend
    development, making it an essential resource for any aspiring or current backend
    developer.


    Starting with the basics, the book introduces `C++`, providing a solid foundation
    in the language, its structure, and core concepts with regards to backend programming.
    From there, readers dive into the more complex elements of backend development.
    Through our engaging sections, use-cases and sample examples, readers are introduced
    to advanced topics such as concurrent programming, exploring threading and multiprocessing
    to handle intensive computational tasks, thus laying the groundwork for scalable
    applications.


    This book offers an in-depth look into APIs, specifically `gRPC`, along with caching
    strategies, and database management, using `MongoDB` as a NoSQL database of choice.
    All the while, readers will learn to implement these technologies in a practical
    context, building a blog application from scratch, thereby bridging the gap between
    theory and practical implementation. An entire section is dedicated to securing
    applications, wherein the book teaches authentication, authorization, and database
    security, and demonstrates how to implement these measures in the blog application.


    Another utmost important part of this book is to cover testing strategies, teaching
    the reader how to employ `Google Test` (`gtest`) to create robust and fail-proof
    backend solutions. Finally, the journey culminates in a step-by-step walkthrough
    to deploying applications on `AWS`, ensuring the reader is equipped with the necessary
    skills to take their applications live.


    ## In this book you will learn how to:


    *   Detailed overview of `C++` programming, catering to both beginners and experienced
    coders.

    *   Practical exploration of concurrent programming for scalable and efficient
    application design.

    *   Comprehensive understanding of API usage, specifically using the `gRPC` framework.

    *   Deep dive into `MongoDB` for effective NoSQL database management and operations.

    *   Thorough walkthrough to implementing caching strategies for performance optimization.

    *   Strategic use of `Nginx` for handling web server needs including load balancing.

    *   Hands-on guide to implementing security measures for databases, APIs, and
    web servers.

    *   Instruction on employing `Google Test` for robust application testing and
    debugging.

    *   Step-by-step guidance for deploying applications on `AWS`, ensuring real-world
    readiness.

    *   Practical application of concepts via building and refining a blog application.

    '
