  trans: "\n\n# 序言\n\n当今的软件工程师需要多种能力来跟上技术飞速发展的步伐。他们还需要具备数据库、应用程序编程接口（API）、Web 服务器以及其他相关技术的知识。本书通过使用强大且灵活的\
    \ C++ 编程语言，旨在作为后端开发的全面指南。本书通过理论讨论、真实世界示例和动手练习的结合，向读者教授 C++ 应用开发的基础知识。\n\n书的第一部分侧重于解释\
    \ C++ 以及为什么许多程序员认为它是胜任这项工作的最佳语言。本书提供了 C++ 的全面概述，涵盖了从语言基础到并发等前沿特性的所有内容。C++ 标准模板库（`STL`）是\
    \ C++ 程序员的一套强大工具箱，书中对其进行了详细的探讨。\n\n书的后半部分深入了算法和数据库，这是后端开发的核心内容。它解释了如何使用各种算法来简化复杂问题、增强功能并优化代码。本书深入探讨了如何使用广名的\
    \ NoSQL 数据库 `MongoDB` 来实践 CRUD 操作。\n\n第三部分，书籍深入探讨了构建和利用 API 的细节，重点是 `gRPC` 框架。`gRPC`\
    \ 框架是创建分布式程序和服务的可靠且高效的工具。它帮助程序员创建可以扩展到大量请求而不牺牲性能的 API。这一节还深入探讨了保护 API 和 Web 服务器的话题。\n\
    \n测试和调试过程占据了书第四部分的大部分。通过使用 `Google Test` 框架，详细介绍了如何创建测试用例以及如何排除可能出现的问题。得益书中对如何设置持续测试环境的解释，代码始终处于可部署状态。\n\
    \n部署程序在书的最后一章中讨论。它详细解释了如何使用最流行的云平台 `AWS` 进行应用部署。这一节还讨论了部署过程中必须考虑的各种因素，如安全性、可扩展性和性能。\n\
    \n在整本书中，你将构建一个博客应用程序来练习所学的技能。这种方法确保了读者不仅在吸收理论，而且在实践中使用它。这本书与其他书籍的不同之处在于它对实际应用的强调。到本书结束时，读者将会在\
