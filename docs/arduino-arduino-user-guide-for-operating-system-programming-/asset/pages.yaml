  md: '# Chapter 5


    # WORK WITH ARDUINO


    # I) EXAMPLES FROM BRIDGE LIBRARY


    Here are the examples (read more at Arduino Learning Examples) that will help
    you work with your Arduino. All the examples written here are for Arduino 1.0
    and later versions. This will help you develop an understanding of how your Arduino
    can adapt to different circumstances and how you can develop your skills in this
    direction.


    (This eBook is written under the Creative Commons Attribution-ShareAlike 3.0)


    # A) CHECK WIFI STATUS OF ARDUINO YUN


    For this example, you need to have Arduino Yun microprocessor. It comes with Ethernet,
    digital pins for input—output numbering 20 and WiFi so that you can begin straight
    away, unless there are legal restrictions in your country for use of WiFi-enabled
    devices.


    Arduino Yun has slot for micro-SD card, another for micro-USB-connectivity, 3
    reset-buttons and the USCP header. The Atheros processor in your Yun supports
    Linux distribution OpenWrt-Yun. This allows the users good degree of computer
    networking power along with working brought brought.


    # Start Check Status of Yun WiFi project


    When you run the script "pretty-wifi-info.lua" depicted in the sketch given in
    your Yun in folder /usr/bin, you will get information about the status of your
    Yun WiFi. Be careful however, to connect the Yun in serial connection otherwise,
    it will not print. Connect the computer USB cable to the Yun and choose the right
    port from the Port Menu.'
