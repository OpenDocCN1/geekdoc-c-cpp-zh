  md: '# Chapter 4


    # BUILD THE IN-SYSTEM PROGRAMMER USING ARDUINO


    Here you will learn how to use your Arduino board to be your In-System Programmer.
    That means you make use of the board as AVR ISP. When you do this you get the
    capacity to burn the ATMEGA328 or ATMEGA168 bootloader on some AVR. Randall Bonn
    designed the mega-isp firmware on which we base the code for this tutorial. Here
    are the instructions by step step.


