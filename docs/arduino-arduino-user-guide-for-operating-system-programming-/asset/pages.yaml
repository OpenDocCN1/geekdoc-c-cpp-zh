    in your commercial product. You do not have to disclose any information regarding
    the product.


    +   - You can use the libraries and the Arduino core without being under any obligation
    to disclose information regarding the firmware. However, if you make modifications
    to the libraries or the core or if you require updates from future version Arduino
    libraries or cores, you need to submit modification under LGPL and make available
    object files which you use for relinking the firmware against updated versions.'
