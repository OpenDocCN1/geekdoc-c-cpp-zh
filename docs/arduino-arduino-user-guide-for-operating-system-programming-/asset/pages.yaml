  md: '# USING THE IMAGECRAFT IDE


    Now we will see how to establish the compiler to render code in a hex file and
    how we will download it to the device. This example will show you how to use the
    STK200 starter kit for the AT90S23 13. You can get more details from ImageCraft
    website. Be sure to get the “unlock code” from ICC. This makes your program licensed.
    You will then install the program to a default drive say C, the short cut to the
    program -- ICC AVR will be installed to the “c:\ice” directory. Search in the
    Menu program and find the group ImageCraft Development Tools.


    # Begin your project


    When you start up the ICC AVR program, you will see three areas – project file,
    status window and editors. At the beginning, all are empty. All project files
    are stored in the project file list. Every editor window is syntax aware will
    be allocated a separate tab in the editor section. During the project building
    process every message will be displayed in your status window. You can maximize
    space for your project file list by choosing not to display the status window
    or the editor.


    Select Project New in the dialog box make a new folder c:\icctest. Type in First
    for the file name in the file name window. Your project now has the name First.
    To write and compile code, your compiler must have the correct options. Projects
    need to have settings and you can choose the options from the Options tab under
    the Projects.


    From the options box, choose the Paths tab. The directory path for the output
    directory, libraries and header files will be specified here. The paths for library
    path and include path will automatically get set to “c:\icelib” and “c:\iceinclude".


    In the output directory you will find files related to the project along with
    the output. Unless specified as absolute, it remain relative to project directory.
    In the edit box, if you enter “objects”, IDE will “c:\icctest\first\objects” for
    outputting files.'
