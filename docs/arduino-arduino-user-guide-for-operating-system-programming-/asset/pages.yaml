    # Procedure


    +   1. Make tracks for the robot. These tracks will go winding on a piece of paper.
    They have to be 1 inch (about 2 ½ cm) thick. The line must not intersect and the
    end of the line must join the starting point. Join several pieces of paper if
    the track area is not big enough.

    2. Not fix the paper to the ground with some tape. This will prevent it from slipping
    when the robot runs around on it. Try to keep the surface light in color.

    3. Upload the code, unplug the USB and switch on power.

    4. Put the robot on the ground such that it is facing the line.

    5. For the first few trials (starting screen), the robot will make the calibrations
    required and then it will orient itself to detect the line.

    6. Once the robot detects the line, it will carry on following it without stop.

    For more details on calibration check up lineFollowConfig.


