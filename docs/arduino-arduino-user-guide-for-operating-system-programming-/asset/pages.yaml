  md: 'A simple program will be in use by the application note to increment PORTB
    where you have the 8 LEDs attached. One 8-bit timer will generate delay for each
    increment. You will now be able to see the lights flashing. Begin by creating
    a new file and type:


    ```

    #include <io2313.h>

    void initialization(void);

    void delay (void);

    ```


    ```

    void initialization (void)

    {

    DDRB = 0xff; // set PORTB as output

    TCCR0 = 0x05; // Count clock/1024

    }

    ```


    ```

    void delay (void) // Produce a delay of 65 ms

    at 4 MHz

    {

    while (! (TIFR&0x02)); // Wait for timer () overflow flag to be set

    TIFR = 0x02; // Clear overflow flag

    }

    ```


    ```

    void main (void)

    {

    initialization (); // Initialize Periphrals

    while (1) // Forever

    {

    PORTB++; //Increment PORTB

    delay (); //Short delay

    }

    }

    ```'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Save this file as "avrc031.c" under the File. In addition, you can also save
    it to project folder "c:\icctest\First" but this is optional.


    # About the program


    The program runs in three modes. The main loop is separated from the other two
    operations delay and initialization. Main clock divided by 1024 begins counting
    TIMER () while PORTB acts as the output. Controller waits in the delay subroutine
    until the Overflow Flag of TIMER () gets set. It clears this flag and exits. Main
    loop begins with the increment in PORTB of the content. Then the delay is called
    so the change is visible in the PORTB.


    # Make The Inclusion For The Source File In The Project


    To include the source code for any project, open the Add Files under Projects.
    Open the working file "avr031.c" inside "c:\icctest\first"and click OK.

    Compiling the code: Select Make Project under Project. The toolbar will display
    the icon for Build Project. If the code does not have any errors then the code
    will compile and the HEX code will get allocated to "c:\icctest\first\objs\first.hex".Now
    all you have to do is to place the file inside the starter kit.


    # Loading File Into STK200 Starter Kit


    Before we run the code, we convert the file into AT90S2313 in the STK200 starter
    kit. We use software known as AVR ISP. Open a new project once you have mounted
    the STK dongle in a parallel port. Select New Project under Project. Highlight
    and click OK on Fuse. You have extra options for setting "Lock Bit" and "Fuse"
    under "Project Manager" but it will not be useful for this tutorial.\Click the
    title frame and activate Program Memory window.


    Go to File and click on Load. A dialog box will open where you can see the "c:\icctest\first\objs"
    file. Open this and click on the "first.hex" file. Now load this program on the
    AT90S2313 in the starter kit by selecting the Auto-Program'
  merge: -1
