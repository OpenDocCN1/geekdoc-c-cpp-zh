  md: '# C) Set up Button control


    Button is used to connect two points when you press on it. In this example, we
    see how to make use of a button to turn on a LED connected to pin 13. For this
    example, you will need:


    +   - Moment button

    - Breadboard

    - Arduino board

    - 10K Ω resistor

    - Hook-wire wire


    You have to make three wire connection to begin your button control. The breadbox
    side has two rows that are long and vertical. This will be the red and black wire
    connecting the 5V ground and supply. From pin 2 connect one wire to pushbutton
    leg. From the same button leg, make a connection to 10K Ω pull down resistor to
    ground. The other leg button will be given the 5V supply.


    When the button is depressed, the connection between the legs of the button remains
    open. The pin has connection only to the ground and so it returns the LOW reading.
    When you press the button down, the reading now goes to 5V and so you get a HIGH
    reading.


    Note that you can reverse the functionality of the Button by reversing the connection.
    This makes the LED button to always be on but will go off when you press the button.
    If you disconnect the i/o pin entirely, you will see the light blinking very randomly.
    The reason is that the input has now got a floating value and thus returns HIGH
    or LOW randomly. It is for this reason we include the pull-down resistor.'
