  md: '# NEWTC Prototyping Board


    You can either buy a preassembled board from NEWTC or you can get a board and
    assemble the individual parts yourself. The second option obviously is more exciting
    and offers you the chance to dab in some experiments in designing. Don''t worry
    if things unstuck, the Arduino community are always ready to back you and answer
    all your questions.


    The CPU used in the Prototyping board is the ATMEGA328P-PU. You will also find
    that the Arduino Uno bootloader is already burned into the chip. Typical behavior
    of the Do-It-Yourself kit is as listed below.


    +   - Has the prototyping board self assembled variety ArduinoHeart Arduino Uno
    bootloader pre-burned into it.

    - Gives support for HC-06 Bluetooth connector interface

    - TTL Level (5V) 4-pin connector

    - Supports MCU and compatible connectors

    - Power external 12 V with 3.3V and 5 V internal


    Get the individual parts and begin to solder them. You can order your kit from
    online stores. You can solder the individual parts on the board and test it with
    DM-USB2Serial. Upload the program for the DM-USTYLE V1.0 DIY version board from
    the sketch software. Plug the board in and click on Program Compile and Upload.


    For those who wish to use the board as an AVR board, you have a choice of compilers
    ranging from WINAV and IAR to CodeVision AVR and ICC AVR. Normally, users will
    employ the board ISP to download the output generated by the compiler. You can
    use the AD-ISPRO or the AD-USBISP for doing the download.'
