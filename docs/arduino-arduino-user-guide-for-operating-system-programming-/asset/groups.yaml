    # Introduction


    I want to thank you and congratulate you for purchasing the book, “Arduino Board
    Pin Code Examples”.


    This book contains proven steps and strategies on how to get your Arduino board
    and compile code for projects. You learn how to use the Arduino for creating interactive
    devices around the house and build an in-system programmer. You can work with
    Arduino and become familiar with it.


    Learn the basics for operating the Arduino board. You can work with prearranged
    boards if you are not too good with handling and assembling electronic components.
    You also have information on various Arduino hot selling products that you may
    use for your personal projects.


    Thanks again for purchasing this book, I hope you enjoy it!


    # Chapter 1


    ## USE ARDUINO TO INTERACT AND RUN CODE


    Arduino is the latest sensation in the computer world. Forging a congenial environment
    through the use of a separate programming language, this interactive computing
    tool helps programmers detect and devise new methods for assessing and regulating
    various parameters. The system envisages the use of microcontrollers to assist
    in physical computing.


    Arduino is a creative tool that helps you build something more with just ordinary
    desktop computer or circuits. It senses and thereby helps you control things in
    your physical world. It merges all needed writing-development environments with
    a simple yet effective microcontroller board. In this e-book we will see Arduino
    products, hot selling items from the Arduino store and the method of programming
    the Arduino to create your own home automation system.


    # Chapter 2


    ## ARDUINO PRODUCTS


    Arduino produces boards, accessories, kits and shields. Currently they have 21
    boards, 8 shields, 2 kits and 5 accessories. The boards are named Arduino Uno,
    Arduino Yun, Arduino Tre, Arduino Explora, Arduino Mega ADK, Arduino Robot, Arduino
    Mini, LilyPad Arduino Simple, Fio, Leonardo, LilyPad Arduino, Zero, Micro, Due,
    Arduino Ethernet, Mega 2560, LilyPad Arduino USB, Gemma, Nano, Arduino Pro Mini
    and Arduino Pro.


    The shields are Arduino GSM Shield, Arduino WiFi Shield, Arduino Host Shield,
    Arduino Wireless Shield, Arduino Ethernet Shield, Motor Shield, and LilyPad Arduino
    Simple.


    The kits are Arduino Starter kit. Accessories available are USB/Serial adapter,
    TFT screen, Arduino Pro, and Motor Shield.


    The boards are named Arduino Uno, Arduino Yun, Arduino Tre, Arduino Explora, Arduino
