    \ to construct a simple ultrasonic sensor. This model is very slow and cannot\
    \ be used with interrupt code. You can set a delay of 1 second if it is absolutely\
    \ necessary. This program returns the distance (inches) and you can use the result\
    \ for other calculations. Jason Ch has compiled the code written here.\n\n```cpp\n\
    unsigned long echo = 0;\nint ultraSoundSignal = 9; // Ultrasound signal pin\n\
    unsigned long ultrasoundValue = 0;\n```\n\n```cpp\nvoid setup() {\n  Serial.begin(9600);\n\
    \  pinMode(ultraSoundSignal, OUTPUT);\n}\n```\n\n```cpp\nunsigned long ping()\
    \ {\n  pinMode(ultraSoundSignal, OUTPUT); // Switch signalpin to output\n  digitalWrite(ultraSoundSignal,\
    \ LOW); // Send low pulse\n  delayMicroseconds(2); // Wait for 2 microseconds\n\
    \  digitalWrite(ultraSoundSignal, HIGH); // Send high pulse\n  delayMicroseconds(5);\
    \ // Wait for 5 microseconds\n  digitalWrite(ultraSoundSignal, LOW); // Holdoff\n\
    \  pinMode(ultraSoundSignal, INPUT); // Switch signalpin to input\n  // please\
    \ note that pulseIn has a 30000us timeout\n  ultrasoundValue = pulseIn(ultraSoundSignal,\
    \ 30000);\n  // convert to inches\n  ultrasoundValue = ultrasoundValue / 58;\n\
    \  return ultrasoundValue;\n}\n```\n\n```cpp\nvoid loop() {\n  int x = 0;\n  x\
    \ = ping();\n  Serial.print(\"Ping: \");\n  Serial.print(x);\n  Serial.println(\"\
    cm\");\n  delay(250); //delay 1/4 seconds\n}\n```\n\n## F) Example Sketch for\
    \ NewPing\n\n(does 20 pings per second)\n(Go here for more information.)\n\n```cpp\n\
    #include <NewPing.h>\n\n#define TRIGGER_PIN 12 // Arduino pin tied to trigger\
    \ pin on the ultrasonic sensor\n#define ECHO_PIN 11 // Arduino pin tied to echo\
    \ pin on the ultrasonic sensor\n#define MAX_DISTANCE 200 // Maximum distance we\
    \ want to ping for (centimeters). Maximum sensor distance is rated at 400-500cm.\n\
    \nNewPing sonar(TRIGGER_PIN, ECHO_PIN, MAX_DISTANCE); // NewPing setup of pins\
    \ and maximum distance.\n\nvoid setup() {\n  Serial.begin(115200); // Open serial\
    \ monitor at 115200 baud to see results.\n}\n```\n\n```cpp\nvoid loop() {\n  delay(50);\
    \ // Wait 50ms between pings (about 20 pings/sec).\n  unsigned int uS = sonar.ping();\
    \ // Send ping, get ping time in microseconds (uS).\n  Serial.print(\"Ping: \"\
    );\n  Serial.print(uS / US_ROUNDTRIP_CM); // Convert ping time to distance and\
    \ print result (0 = outside distance range, no echo)\n  Serial.println(\"cm\"\
    );\n}\n```\n"
