    # # Code


    User sets a threshold and studies data generated by the piezo element. One can
    change the threshold value to modify the sensitivity of the element.


    ```

    /* Knock Sensor

    ```


    You can use this sketch to detect knocking sound with a piezo element. Reading
    from the analog pin compares results that user predetermines for some threshold.
    When the result shows bigger value, ''knock'' will be written to serial port and
    the pin 13 LED will be toggled.'
