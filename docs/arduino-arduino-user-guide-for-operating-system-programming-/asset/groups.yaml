    void initialization(void);

    void delay (void);

    ```


    ```

    void initialization (void)

    {

    DDRB = 0xff; // set PORTB as output

    TCCR0 = 0x05; // Count clock/1024

    }

    ```


    ```

    void delay (void) // Produce a delay of 65 ms

    at 4 MHz

    {

    while (! (TIFR&0x02)); // Wait for timer () overflow flag to be set

    TIFR = 0x02; // Clear overflow flag

    }

    ```


    ```

    void main (void)

    {

    initialization (); // Initialize Periphrals

    while (1) // Forever

    {

    PORTB++; //Increment PORTB

    delay (); //Short delay

    }

    }

    ```'
