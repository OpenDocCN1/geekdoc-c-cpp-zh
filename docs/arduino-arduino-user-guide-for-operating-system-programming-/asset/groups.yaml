- md: "\n# NEWTC Prototyping Board\n\nYou can either buy a preassembled board from\
    \ NEWTC or you can get a board and assemble the individual parts yourself. The\
    \ second option obviously is more exciting and offers you the chance to dab in\
    \ some experiments in designing. Don't worry if things unstuck, the Arduino community\
    \ are always ready to back you and answer all your questions.\n\nThe CPU used\
    \ in the Prototyping board is the ATMEGA328P-PU. You will also find that the Arduino\
    \ Uno bootloader is already burned into the chip. Typical behavior of the Do-It-Yourself\
    \ kit is as listed below.\n\n- Has the prototyping board self-assembled variety\
    \ ArduinoHeart Arduino Uno bootloader pre-burned into it.\n- Gives support for\
    \ HC-06 Bluetooth connector interface\n- TTL Level (5V) 4-pin connector\n- Supports\
    \ MCU and compatible connectors\n- Power external 12 V with 3.3V and 5 V internal\n\
    \nGet the individual parts and begin to solder them. You can order your kit from\
    \ online stores. You can solder the individual parts on the board and test it\
    \ with DM-USB2Serial. Upload the program for the DM-USTYLE V1.0 DIY version board\
    \ from the sketch software. Plug the board in and click on Program Compile and\
    \ Upload.\n\nFor those who wish to use the board as an AVR board, you have a choice\
    \ of compilers ranging from WINAV and IAR to CodeVision AVR and ICC AVR. Normally,\
    \ users will employ the board ISP to download the output generated by the compiler.\
    \ You can use the AD-ISPRO or the AD-USBISP for doing the download.\n\nThe former\
    \ is useful for parallel port type STK200/300 while the latter proves useful for\
    \ USB type STK500.\n\n# USING THE IMAGECRAFT IDE\n\nNow we will see how to establish\
    \ the compiler to render code in a hex file and how we will download it to the\
    \ device. This example will show you how to use the STK200 starter kit for the\
    \ AT90S23-13. You can get more details from ImageCraft website. Be sure to get\
    \ the “unlock code” from ICC. This makes your program licensed. You will then\
    \ install the program to a default drive say C, the short cut to the program --\
    \ ICC AVR will be installed to the “c:\\ice” directory. Search in the Menu program\
    \ and find the group ImageCraft Development Tools.\n\n# Begin your project\n\n\
    When you start up the ICC AVR program, you will see three areas – project file,\
    \ status window and editors. At the beginning, all are empty. All project files\
    \ are stored in the project file list. Every editor window is syntax aware will\
    \ be allocated a separate tab in the editor section. During the project building\
    \ process every message will be displayed in your status window. You can maximize\
    \ space for your project file list by choosing not to display the status window\
    \ or the editor.\n\nSelect Project New in the dialog box make a new folder c:\\\
    icctest. Type in First for the file name in the file name window. Your project\
    \ now has the name First. To write and compile code, your compiler must have the\
    \ correct options. Projects need to have settings and you can choose the options\
    \ from the Options tab under the Projects.\n\nFrom the options box, choose the\
    \ Paths tab. The directory path for the output directory, libraries and header\
    \ files will be specified here. The paths for library path and include path will\
    \ automatically get set to “c:\\icelib” and “c:\\iceinclude\".\n\nIn the output\
    \ directory you will find files related to the project along with the output.\
    \ Unless specified as absolute, it remain relative to project directory. In the\
    \ edit box, if you enter “objects”, IDE will “c:\\icctest\\first\\objects” for\
    \ outputting files.\n\n# Compiler\n\nGo to the compiler page in the dialog box\
    \ and choose the option. In the list box, click on **Output Format** and click\
    \ on **Intel HEX**. Keep the box next to the “Accept C++ Comments” checked.\n\n\
    # Target\n\nNext click on the **target** tab. Here you can make options specific\
    \ to the target. In this particular tutorial, you have to click on **Device Configuration**\
    \ tab and select 2313. This ImageCraft IDE becomes very simplified as it it shows\
    \ the options that are required alone for the entire tool chain in the compiler.\
    \ This will include linker, assembler and compiler.\n\nA simple program will be\
    \ in use by the application note to increment PORTB where you have the 8 LEDs\
    \ attached. One 8-bit timer will generate delay for each.\n\n```c\n#include <io2313.h>\n\
    void initialization(void);\nvoid delay(void);\n\nvoid main(void) {\n    initialization();\n\
    \    while (1) {\n        if (TIF & 0x01) {\n            TIF &= ~0x01;\n     \
    \       PORTB++;\n        }\n        delay();\n    }\n}\n\nvoid initialization(void)\
    \ {\n    DDRB = 0xFF;\n    TCCR0A = 0x05;\n}\n\nvoid delay(void) {\n    // delay\
    \ implementation\n}\n```\n"
  mdcn: "\n\n# NEWTC 原型板\n\n你可以从 NEWTC 购买预装好的板子，也可以购买单个部件并自行组装。显然，后种方案更有趣，并能让你获得尝试设计实验的机会。如果遇到问题，请不要担心，Arduino\
    \ 社区随时准备着支持你并回答你的所有问题。\n\n原型板使用的 CPU 是 ATMEGA328P-PU。你还会发现芯片中已经烧录了 Arduino Uno\
    \ 引导程序。该 DIY 套件的典型特性列如下：\n\n- 原型板自组装版本已预烧录 ArduinoHeart Arduino Uno 引导程序。\n- 支持\
    \ HC-06 蓝牙连接器接口\n- TTL 电平 (5V) 4 针连接器\n- 支持 MCU 及兼容接口\n- 外部 12 V 供电，内部提供 3.3V\
    \ 和 5 V 电源\n\n获取单个部件并开始焊接。你可以在在线商店购买套件。你可以将各个部件焊接在板上，并使用 DM-USB2Serial 进行测试。从\
    \ sketch 软件中上传适用于 DM-USTYLE V1.0 DIY 版本板板的程序。插入板子并点击“编译并上传”（Program Compile and\
    \ Upload）。\n\n对于希望将该板作为 AVR 板使用的用户，你有多种编译器可选，从 WINAV、IAR 到 CodeVision AVR 和 ICC\
    \ AVR。通常情况下，用户会使用板载 ISP 下载编译器生成的输出文件。你可以使用 AD-ISPRO 或 AD-USBISP 进行下载。\n\n前者适用于并行端口类型的\
    \ STK200/300，而后者对 USB 类型的 STK500 则非常有用。\n\n# 使用 IMAGECRAFT IDE\n\n现在我们将介绍如何建立编译器将代码渲染为\
    \ hex 文件，以及如何将其下载到设备。此示例将向你展示如何使用适用于 AT90S23-13 的 STK200入门套装。你可以从 ImageCraft 网站获取更多详情。确保从\
    \ ICC 获取“解锁代码”，这会让你的程序获得授权。随后你把程序安装到默认驱动器（例如 C 盘），程序的快捷方式 ICC AVR 将安装在“c:\\ice”目录下。在菜单（Menu）中搜索并找到\
    \ ImageCraft 开发工具组。\n\n# 开始你的项目\n\n当启动 ICC AVR 程序时，你会看到三个区域——项目文件、状态窗口和编辑器。刚开始，它们都是空的。所有项目文件都存储在项目文件列表中。每个具有语法感知的编辑器窗口都将在编辑器部分分配单独的标签页。在项目构建过程中，每条消息都会显示在你的状态窗口中。你可以通过不显示状态窗口或编辑器来为项目文件列表留出最大空间。\n\
    \n在对话框中选择 Project New（新建项目），创建一个新文件夹 c:\\icctest。在文件名窗口中输入 First 作为文件名。你的项目名称现在为\
    \ First。若要编写并编译代码，你的编译器必须具备正确的选项。项目需要设置，你可以在 Projects（项目）下的 Options（选项）选项卡中选择这些选项。\n\
    \n在选项框中，选择 Paths（路径）选项卡。输出目录、库和头文件的目录路径将在此处指定。库路径和包含路径将自动设置为“c:\\icelib”和“c:\\\
    iceinclude”。\n\n在输出目录中，你会找到与项目相关的文件以及输出结果。除非指定为绝对路径，否则它们相对于项目目录。在编辑框中，如果你输入“objects”，IDE\
    \ 将“c:\\icctest\\first\\objects”输出文件。\n\n# 编译器\n\n进入对话框中的编译器页面并选择选项。在列表中，点击 **Output\
    \ Format**（输出格式）并点击 **Intel HEX**。保持勾选“Accept C++ Comments”（接受 C++ 注释）旁边的复选框。\n\
    \n# 目标\n\n接下来点击 **target**（目标）选项卡。在这里你可以针对特定目标设置特定选项。在本特定的教程中，你必须点击 **Device Configuration**（设备配置）选项卡并选择\
    \ 2313。此 ImageCraft IDE 会变得非常简单，因为它只显示编译器中整个工具链所需的选项。这包含了链接器、汇编器和编译器。\n\n应用说明将使用一个简单的程序来递增\
    \ PORTB，那里连接了 8 个 LED。一个 8 位定时器将为每个 LED产生延迟。\n\n```c\n#include <io2313.h>\nvoid\
    \ initialization(void);\nvoid delay(void);\n\nvoid main(void) {\n    initialization();\n\
    \    while (1) {\n        if (TIF & 0x01) {\n            TIF &= ~0x01;\n     \
    \       PORTB++;\n        }\n        delay();\n    }\n}\n\nvoid initialization(void)\
    \ {\n    DDRB = 0xFF;\n    TCCR0A = 0x05;\n}\n\nvoid delay(void) {\n    // delay\
    \ implementation\n}\n```\n\n"
