    # 引言


    感谢并祝贺你购买了《Arduino 板引脚代码示例》一书。


    本书包含了关于如何获取 Arduino 板以及为项目编译代码的经过的步骤和策略。你将学习如何使用 Arduino 在家中创建交互式设备，并构建一个系统内编程器。你可以与
    Arduino 一工作并熟悉它。


    学习操作 Arduino 板的基础知识。如果你不擅长处理和组装电子元件，可以使用预先配置好的板子。你还将获得有关各种 Arduino 热销产品的信息，你可以将它们用于个人项目。


    再次感谢购买本书，希望你读得愉快！


    # 第一章


    ## 使用 Arduino 进行交互和运行代码


    Arduino 是计算机世界的最新热点。通过使用独立的编程语言营造宜宜的环境，这种交互式计算工具帮助编程人员发现并设计评估和调节各种参数的新方法。该系统设想使用微控制器来辅助物理计算。


    Arduino 是一个创意工具，帮助你仅通过普通的台式电脑或电路就能构建更多内容。它能感知并帮助你控制物理世界中的事物。它将所有必要的编写开发环境与一个简单而有效的微控制器板结合在一起。在电子书中，我们将看到
    Arduino 产品、Arduino 商店的热销物品以及为 Arduino 创建你自己的家庭自动化系统的方法。


    # 第二章


    ## ARDUINO 产品


    Arduino 生板子、配件、套件和扩展板。目前他们有 21 块板子、8 个扩展板、2 个套件和 5 个配件。板子命名为 Arduino Uno、Arduino
    Yun、Arduino Tre、Arduino Explora、Arduino Mega ADK、Arduino Robot、Arduino Mini、LilyPad
    Arduino Simple、Fio、Leonardo、LilyPad Arduino、Zero、Micro、Due、Arduino Ethernet、Mega
    2560、LilyPad Arduino USB、Gemma、Nano、Arduino Pro Mini 和 Arduino。


    扩展板有 Arduino GSM Shield、Arduino WiFi Shield、Arduino Host Shield、Arduino Wireless
    Shield、Arduino Ethernet Shield、Motor Shield 和 LilyPad Arduino Simple。


    套件是 Arduino Starter kit。可用配件有 USB/串口适配器、TFT 屏幕、Arduino Pro 和 Motor Shield。


