- md: "\n- When you next select the **Board** under the **Tools**, it actually means\
    \ you are selecting the board on which you intend to burn the bootloader. It does\
    \ not mean the board you are currently using to work the program.\n- Then click\
    \ on the **Arduino as ISP** under **Burn Bootloader.**\n\n# Chapter 5\n\n# WORK\
    \ WITH ARDUINO\n\n# I) EXAMPLES FROM BRIDGE LIBRARY\n\nHere are the examples (read\
    \ more at Arduino Learning Examples) that will help you work with your Arduino.\
    \ All the examples written here are for Arduino 1.0 and later versions. This will\
    \ help you develop an understanding of how your Arduino can adapt to different\
    \ circumstances and how you can develop your skills in this direction.\n\n(This\
    \ eBook is written under the Creative Commons Attribution-ShareAlike 3.0)\n\n\
    # A) CHECK WIFI STATUS OF ARDUINO YUN\n\nFor this example, you need to have Arduino\
    \ Yun microprocessor. It comes with Ethernet, digital pins for input-output numbering\
    \ 20 and WiFi so that you can begin straight away, unless there are legal restrictions\
    \ in your country for use of WiFi-enabled devices.\n\nArduino Yun has a slot for\
    \ micro-SD card, another for micro-USB-connectivity, 3 reset-buttons and the USCP\
    \ header. The Atheros processor in your Yun supports Linux distribution OpenWrt-Yun.\
    \ This allows the users a good degree of computer networking power along with\
    \ working brought.\n\n# Start Check Status of Yun WiFi project\n\nWhen you run\
    \ the script \"pretty-wifi-info.lua\" depicted in the sketch given in your Yun\
    \ in folder /usr/bin, you will get information about the status of your Yun WiFi.\
    \ Be careful however, to connect the Yun in serial connection otherwise, it will\
    \ not print. Connect the computer USB cable to the Yun and choose the right port\
    \ from the Port Menu.\n\n# Hardware and Circuitry\n\nYou do not have to make any\
    \ connections or circuits for this project. You will require these pieces of hardware.\n\
    \n- a) Wireless network\n- b) Arduino Yun\n\n# Code for the WiFi Status project\n\
    \nFirst, you need to include Process class in header.\n#include <Process.h>\n\
    Next, you need to start Bridge and serial communication. If you fail to connect\
    \ the computer in serial, sketch will fail to run.\n\n```cpp\nvoid setup () {\n\
    \  Serial.begin(9600);\n  while (!Serial) {\n    Serial.println(\"Starting bridge...\\\
    n\");\n    pinMode(13,OUTPUT);\n    digitalWrite(13, LOW);\n  }\n  Bridge.begin();\n\
    \  digitalWrite(13, HIGH); // Led on pin 13 turns on when the bridge is ready\n\
    \  delay(2000);\n}\n```\n\nNew process is initialized in loop (). This will run\
    \ the check script for the WiFi. Script is run when you call runShellCommand ()\
    \ after setting path to script.\n\n```cpp\nvoid loop () {\n  Process wifiCheck;\n\
    \  wifiCheck.runShellCommand(\"/usr/bin/pretty-wifi-info.lua\");\n```\n\nCheck\
    \ the characters returned to serial monitor by the script. After a few seconds,\
    \ run it again.\n\n```cpp\nwhile (wifiCheck.available() > 0) {\n  char c = wifiCheck.read();\n\
    \  Serial.print(c);\n}\n\nSerial.println();\n\ndelay(5000);\n```\n\nHere is the\
    \ entire code again.\n\n```cpp\n/*\nStatus of WiFi\n\nThis sketch runs a script\
    \ called \"pretty-wifi-info.lua\"\ninstalled on your Yun in folder /usr/bin.\n\
    It will print information regarding status of your wifi connection.\n\nIt uses\
    \ Serial to print, so you need to connect your Yun to your computer using a USB\
    \ cable and select the appropriate port from the Port menu\n\ncreated 18 June\
    \ 2013\nBy Federico Fissore\n\nThis example code is in the public domain.\n*/\n\
    ```\n\n```cpp\n#include <Process.h>\n\nvoid setup() {\n  Serial.begin(9600); //\
    \ initialize serial communication\n  while(!Serial);    // do nothing until the\
    \ serial monitor is opened\n\n  Serial.println(\"Starting bridge...\\n\");\n \
    \ pinMode(13,OUTPUT);\n  digitalWrite(13, LOW);\n  Bridge.begin(); // make contact\
    \ with the Linux processor\n  digitalWrite(13, HIGH); // Led on pin 13 turns on\
    \ when the bridge is ready\n\n  delay(2000); // wait 2 seconds\n}\n\nvoid loop()\
    \ {\n  Process wifiCheck; // initialize a new process\n\n  wifiCheck.runShellCommand(\"\
    /usr/bin/pretty-wifi-info.lua\"); // command you want to run\n\n  // while there's\
    \ any characters coming back from process, print them to the serial monitor:\n\
    \  while (wifiCheck.available() > 0) {\n    char c = wifiCheck.read();\n    Serial.print(c);\n\
    \  }\n\n  Serial.println();\n\n  delay(5000);\n}\n```\n\n# B) FILE WRITE SCRIPT\n\
    \nThis example tells you how to use FileIO classes to write some file within filesystem\
    \ of Yun. First in /tmp a shell script file will be created. Then execute it.\n\
    \n# Hardware and Circuit\n\nYou do not have to make any circuits only require\
    \ your Arduino board.\n\n# Code for File Write Script\n\nTo communicate with filesystem,\
    \ you have to include FileIO header #include<FileIO.h>\nNext, you have to initialize\
    \ FileSystem communication in setup (). Once the serial connection has made, start\
    \ loop () after you initiate custom function uploadScript ().\n\n```cpp\nvoid\
    \ setup () {\n  Bridge.begin();\n  Serial.begin (9600);\n\n  while (!Serial);\
    \ // wait for Serial port to connect.\n  Serial.println(\"File Write Script example\\\
    n\\n\");\n\n  FileSystem.begin();\n\n  uploadScript ();\n}\n```\n\nOne more custom\
    \ function will run your script. runScript () will execute every 5 seconds.\n\n\
    ```cpp\nvoid loop () {\n  runScript();\n  delay(5000);\n}\n```\n\nCreate a file\
    \ with uploadScript() function. The shell script is created inside Linux system.\
    \ This will check your WiFi network traffic. After you have finished creating\
    \ the file, you may open it by creating instance of File class. You call it by\
    \ invoking FileSystem.open() the precise location where you create script is indicated\
    \ by. Put the script in /tmp inside RAM. This will preserve read/write cycles\
    \ that are limited in FLASH memory.\n\n```cpp\nvoid uploadScript() {\n  File script\
    \ = FileSystem.open(\"/tmp/wlan-stats.sh\", FILE_WRITE);\n```\n\nPrint the header\
    \ #!/bin/sh. Then print ifconfig. The ifconfig line utility controls network interfaces.\
    \ This brings you to the WiFi interface wlan0. Write script contents using File.print().\
    \ The output from ifconfig will be sought out by grep utility. Since you require\
    \ the number of bytes look for RX bytes. Now you can close the file.\n\n```cpp\n\
    script.print(\"#!/bin/sh\\n\");\nscript.print(\"ifconfig wlan0 | grep 'RX bytes\\\
    n'\");\nscript.close(); // close the file\n```\n\nIn order to make script executable,\
    \ you must instantiate some Process. Now chmod changes file modes; send chmod\
    \ with filepath and command. Shell script will now run like an application. Create\
    \ Process through runScript () function. This will run your script and then print\
    \ the result to Serial Monitor. Start the script after creating it by calling\
    \ the two functions Process.begin (filepath) along with Process.run ().\n\n```cpp\n\
    void runScript() {\n  Process myscript;\n  myscript.begin(\"/tmp/wlan-stats.sh\"\
    );\n  myscript.run();\n}\n```\n\nNow use String function to read and hold output.\n\
    \n```cpp\nString output = \"\";\n\nwhile (myscript.available()) {\n    output\
    \ += (char)myscript.read();\n}\n//Now get rid of blank spaces that precede or\
    \ are present at the string end and print the output to serial monitor.\noutput.trim();\n\
    Serial.println(output);\nSerial.flush();\n}\n```\n\nThe complete code will look\
    \ like this:\n/*\nWrite to file using FileIO classes.\n\nThis sketch demonstrates\
    \ how to write file into the Yun filesystem.\nA shell script file is created in\
    \ /tmp, and is executed afterwards.\n\nCreated 7 June 2010\nby Cristian Maglie\n\
    \nThis example code is in the public domain.\n*/\n\n```cpp\n#include <FileIO.h>\n\
    \nvoid setup() {\n  // Setup Bridge (needed every time we communicate with the\
    \ Arduino Yun)\n  Bridge.begin();\n  // Initialize the Serial\n  Serial.begin(9600);\n\
    \n  while(!Serial); // wait for Serial port to connect.\n  Serial.println(\"File\
    \ Write Script example\\n\\n\");\n\n  // Setup File IO\n  FileSystem.begin();\n\
    \n  // Upload script used to gain network statistics\n  uploadScript();\n}\n\n\
    void loop() {\n  // Run stats script every 5 secs.\n  runScript();\n  delay(5000);\n\
    }\n```\n\n// this function creates a file into the Linux processor that contains\
    \ a shell script\n// to check the network traffic of the WiFi interface\nvoid\
    \ uploadScript() {\n    // Write our shell script in /tmp\n    // Using stores\
    \ the script in RAM this way we can preserve\n    // the limited amount of FLASH\
    \ erase/write cycles\n    File script = FileSystem.open(\"/tmp/wlan-stats.sh\"\
    , FILE_WRITE);\n    // Shell script header\n    script.print(\"#!/bin/sh\\n\"\
    );\n    // shell commands:\n    // ifconfig: is a command line utility for controlling\
    \ the network interfaces.\n    // wlan0 is the interface we want to query\n  \
    \  // grep: search inside the output of the ifconfig command the \"RX bytes\"\
    \ keyword\n    // and extract the line that contains it\n    script.print(\"ifconfig\
    \ wlan0 | grep 'RX bytes\\n'\");\n    script.close(); // close the file\n}\n\n\
    // Make the script executable\nProcess.begin(\"chmod\"); // chmod: change mode\n\
    chmod.addParameter(\"+x\"); // x stays for executable\nchmod.addParameter(\\\"\
    /tmp/wlan-stats.sh\"); // path to the file to make it executable\nchmod.run();\n\
    }\n```\n"
  mdcn: "\n\n- 当你下次在 **Tools** 下选择 **Board** 时，它实际上意味着你正在选择你打算写入引导加载程序的开发板。这并不意味着你当前正在用于编写运行的开发板。\n\
    - 然后在 **Burn Bootloader.** 下点击 **Arduino as ISP**。\n\n# 第 5 章\n\n# 运行 ARDUINO\
    \ 操作\n\n# I) 桥接库的示例\n\n以下是一些示例（更多信息请参阅 Arduino Learning Examples），它们将帮助你使用你的 Arduino。这里编写的所有示例都是为\
    \ Arduino 1.0 及更高版本准备的。这将帮助你理解 Arduino 如何适应不同的情况，以及你如何在这个方向上提高你的技能。\n\n（本电子书根据知识产权\
    \ 署名-相同共享 3.0 国际通用许可协议编写）\n\n# A) 检查 Arduino YUN 的 WiFi 状态\n\n对于此示例，你需要一个 Arduino\
    \ Yun 微处理器。它带有以太网、用于输入/输出编号为 20 的数字引脚以及 WiFi，因此你可以直接开始，除非你所在的国家对使用支持 WiFi 的设备有法律限制。\n\
    \nArduino Yun 有一个 micro-SD 卡槽、一个 micro-USB 连接接口、3 个复位按钮和 USCP Header。你 Yun 中的\
    \ Atheros 处理器支持 Linux 发行版 OpenWrt-Yun。这让用户拥有良好的计算机网络能力以及强大的工作功能。\n\n# 开始检查 Yun\
    \ WiFi 状态项目\n\n当你运行 Yun 中 `/usr/bin` 文件夹下示例所示的 \"pretty-wifi-info.lua\" 脚本时，你将获得有关\
    \ Yun WiFi 状态的信息。但请注意，要通过串口连接 Yun，否则它将不会打印。将电脑 USB 线连接到 Yun，并在 Port 菜单中选择正确的端口。\n\
    \n# 硬件与电路\n\n此项目你不需要制作任何连接或电路。你将需要这些硬件：\n\n- a) 无线网络\n- b) Arduino Yun\n\n# WiFi\
    \ 状态项目代码\n\n首先，你需要在头文件中包含 Process 类。\n#include <Process.h>\n接下来，你需要启动 Bridge 和串口通信。如果未能通过串口连接电脑，程序将无法运行。\n\
    \n```cpp\nvoid setup () {\n  Serial.begin(9600);\n  while (!Serial) {\n    Serial.println(\"\
    Starting bridge...\\n\");\n    pinMode(13,OUTPUT);\n    digitalWrite(13, LOW);\n\
    \  }\n  Bridge.begin();\n  digitalWrite(13, HIGH); // 当桥就绪时，引脚13上的 LED 亮起\n  delay(2000);\n\
    }\n```\n\n在 `loop()` 中初始化新进程。这将运行 WiFi 检查脚本。在设置脚本路径后调用 `runShellCommand()` 时会运行脚本。\n\
    \n```cpp\nvoid loop () {\n  Process wifiCheck;\n  wifiCheck.runShellCommand(\"\
    /usr/bin/pretty-wifi-info.lua\");\n```\n\n检查脚本返回到串口监视器的字符。几秒后再次运行。\n\n```cpp\n\
    while (wifiCheck.available() > 0) {\n  char c = wifiCheck.read();\n  Serial.print(c);\n\
    }\n\nSerial.println();\n\ndelay(5000);\n```\n\n这里是完整的代码。\n\n```cpp\n/*\nWiFi 状态\n\
    \n此程序运行一个名为 \"pretty-wifi-info.lua\" 的脚本\n该脚本安装在 Yun 的 /usr/bin 文件夹中。\n它将打印有关你的\
    \ wifi 连接状态的信息。\n\n它使用 Serial 进行打印，因此你需要使用 USB 线将 Yun 连接到电脑，并在 Port 菜单中选择相应的端口\n\
    \n创建于 2013年6月18日\n作者: Federico Fissore\n\n此示例代码属于公有领域。\n*/\n```\n\n```cpp\n#include\
    \ <Process.h>\n\nvoid setup() {\n  Serial.begin(9600); // 初始化串口通信\n  while(!Serial);\
    \ // 等待串口打开\n\n  Serial.println(\"Starting bridge...\\n\");\n  pinMode(13,OUTPUT);\n\
    \  digitalWrite(13, LOW);\n  Bridge.begin(); // 与 Linux 处理器连接\n  digitalWrite(13,\
    \ HIGH); // 当桥就绪时，引脚13上的 LED 亮起\n\n  delay(2000); // 等待 2 秒\n}\n\nvoid loop()\
    \ {\n  Process wifiCheck; // 初始化新进程\n\n  wifiCheck.runShellCommand(\"/usr/bin/pretty-wifi-info.lua\"\
    ); // 你想运行的命令\n\n  // 当进程返回任何字符时，将其打印到串口监视器：\n  while (wifiCheck.available() >\
    \ 0) {\n    char c = wifiCheck.read();\n    Serial.print(c);\n  }\n\n  Serial.println();\n\
    \n  delay(5000);\n}\n```\n\n# B) 文件写入脚本\n\n此示例告诉你如何使用 FileIO 类在 Yun 的文件系统中写入文件。首先在\
    \ `/tmp` 中创建一个 shell 脚本。然后执行它。\n\n# 硬件与电路\n\n你不需要制作任何电路，只需要你的 Arduino 板。\n\n#\
    \ 文件写入脚本代码\n\n为了与文件系统通信，必须包含 FileIO 头文件 `#include<FileIO.h>`。接下来，你需要在 `setup()`\
    \ 中初始化 FileSystem。一旦串口连接，启动自定义函数 `uploadScript()`。\n\n```cpp\nvoid setup () {\n\
    \  Bridge.begin();\n  Serial.begin (9600);\n\n  while (!Serial); // 等待串口连接\n \
    \ Serial.println(\"File Script example\\n\\n\");\n\n  FileSystem.begin();\n\n\
    \  uploadScript ();\n}\n```\n\n另一个自定义函数将运行你的脚本。`runScript()` 将每 5 秒执行一次。\n\n```cpp\n\
    void loop () {\n  runScript();\n  delay(5000);\n}\n```\n\n使用 `uploadScript()`\
    \ 函数创建一个文件。shell 脚本在 Linux 系统内部创建。这将检查你的 WiFi 网络流量。完成文件创建后，你可以通过创建 File 类的实例来打开它。将脚本放在内存中的\
    \ `/tmp` 中。这将保护有限的 FLASH 读写周期。\n\n```cpp\nvoid uploadScript() {\n  File script\
    \ = FileSystem.open(\"/tmp/wlan-stats.sh\", FILE_WRITE);\n```\n\n打印头文件 `#!/bin/sh`。然后打印\
    \ ifconfig。`ifconfig` 工具控制网络接口。`grep` 工具在 ifconfig 的输出中查找 RX bytes。现在你可以关闭文件。\n\
    \n```cpp\nscript.print(\"#!bin/sh\\n\");\nscript.print(\"ifconfig wlan0 | grep\
    \ 'RX bytes\\n'\");\nscript.close(); // 关闭文件\n```\n\n为了使脚本可执行，你必须实例化 Process。现在使用\
    \ `chmod` 修改文件模式；带有路径发送 `chmod`。shell 脚本现在将像应用程序一样运行。通过 `runScript()` 函数创建 Process。这将运行你的脚本并将结果打印到串口监视器。在创建它后，通过调用两个函数\
    \ `Process.begin (filepath)` 和 `Process.run()` 启动脚本。\n\n```cpp\nvoid runScript()\
    \ {\n  Process myscript;\n  myscript.begin(\"/tmp/wlan-stats.sh\");\n  myscript.run();\n\
    }\n```\n\n现在使用 String 函数读取并保存输出。\n\n```cpp\nString output = \"\";\n\nwhile (myscript.available())\
    \ {\n    output += (char)myscript.read();\n}\n// 现在删除字符串开头或结尾的空格，并将输出打印到串口监视器。\n\
    output.trim();\nSerial.println(output);\n}\n```\n\n完整代码如下：\n/*\n使用 FileIO 类写入文件。\n\
    \n此程序演示了如何向 Yun 文件系统写入文件。\n在 /tmp 中创建一个 shell 脚本，并在之后执行。\n\n创建于 2010年6月7日\n作者:\
    \ Cristian Maglie\n\n此示例代码属于公有领域。\n*/\n\n```cpp\n#include <FileIO.h>\n\nvoid setup()\
    \ {\n  // 设置桥接（每次与 Arduino Yun 通信时需要）\n  Bridge.begin();\n  // 初始化串口\n  Serial.begin(9600);\n\
    \n  while(!Serial); // 等待串口连接。\n  Serial.println(\"File Script example\\n\\n\"\
    );\n\n  // 设置文件 IO\n  FileSystem.begin();\n\n  // 用于获取网络统计的上传脚本\n  uploadScript();\n\
    }\n\nvoid loop() {\n  // 每 5 秒运行统计脚本。\n  runScript();\n  delay(5000);\n}\n```\n\
    \n"
