    \nArduino comes into play for interfacing devices that are used as input, output\
    \ or user interfaces. They also help devices used in communication and an ISP\
    \ programmer. In order to use the kit or assemble it, you have to be aware of\
    \ the full capabilities of this revolutionary computing device.\n\nSee all that\
    \ is possible and begin a project that interests you. They help in governing physical\
    \ systems and regulating the audio systems. You can use them in multiplexing and\
    \ controlling and distributing electrical power. They are used as input devices\
    \ in power, audio and automobiles.\n\nSpecific examples for each of these are\
    \ given here. Scientists use them in environmental sciences and distance sensing\
    \ devices. Other uses include their use in human interfacing, game controllers,\
    \ keypads and light sensors. Here we are going to see how to use the Arduino for\
    \ some basic functions.\n\n## SIMPLE BASIC CONTROLS\n\n### A) Fading an LED\n\n\
    For this experiment, you need the following equipment.\n\n- Breadboard\n- 220\
    \ ohm resistor\n- Arduino board\n- An LED\n\nSelect the 9 pin of your Arduino\
    \ and solder a 220 ohm resistor to it. Connect the other end of the resistor to\
    \ anode, the positive leg of your LED. The shorter cathode leg in the LED should\
    \ be directly connected to the ground. Now to write the code.\n\nFirst declare\
    \ the ledPin is your 9. This will be all there is in your setup portion of the\
    \ code. Next comes the analogWrite() function. Here you need to pass two functions\
    \ — one that tells pin it has to write and one that tells what PWM value it has\
    \ to write.\n\nTo make the LED fade off, you need to increase the PWM value that\
    \ is at 0 all the value to 255. Now decrease the value all way back to 0. You\
    \ can use any variable to change the PWM value. In this example, we use fullOrOff.\
    \ For each loop, the increment is done by variable goDark.\n\nWhen the fullOrOff\
    \ is at one end of the value scale, either 0 or 255, the goDark is changed to\
