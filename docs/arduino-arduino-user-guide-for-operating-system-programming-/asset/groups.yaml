    ```

    if (stringOne ==stringTwo) {

    ```


    Greater and less operators will check the first alphabet or number in the string.
    This is why you get "a" < "b" and "1" < "2", but "999" > "1000" 9 comes after
    1.


    Take note: When you use operators for string comparison, do not think the strings
    as numbers. If you want mathematical values, you have to use variable such as
