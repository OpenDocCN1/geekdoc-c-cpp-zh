    # About the program


    The program runs in three modes. The main loop is separated from the other two
    operations delay and initialization. Main clock divided by 1024 begins counting
    TIMER () while PORTB acts as the output. Controller waits in the delay subroutine
    until the Overflow Flag of TIMER () gets set. It clears this flag and exits. Main
    loop begins with the increment in PORTB of the content. Then the delay is called
    so the change is visible in the PORTB.


    # Make The Inclusion For The Source File In The Project


    To include the source code for any project, open the Add Files under Projects.
    Open the working file "avr031.c" inside "c:\icctest\first"and click OK.

