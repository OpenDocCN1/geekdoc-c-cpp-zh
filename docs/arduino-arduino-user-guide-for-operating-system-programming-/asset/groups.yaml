    \ // used for counting time\n\nvoid setup() {\n// initialize the Robot, SD card,\
    \ display, and speaker\nRobot.begin();\nRobot.beginTFT();\nRobot.beginSD();\n\
    Robot.beginSpeaker();\n}\n```\n\n```cpp\n// show the logos on the TFT screen\n\
    Robot.displayLogos();\nRobot.drawBMP(\"lf.bmp\", 0, 0); // display background\
    \ image\nRobot.playFile(\"chase.wav\"); // play a song from the SD card\n```\n\
    \n```cpp\n// add the instructions\nRobot.text(\"Line Following\\n\\n place the\
    \ robot on\\n track and\\n see it run\",5, 5);\nRobot.text(\"Press the middle\\\
    n button to start...\", 5, 61);\nRobot.waitContinue();\n```\n\n```cpp\n// These\
    \ are some general values that work for line following\n// uncomment one or the\
    \ other to see the different behaviors of the robot\n//Robot.lineFollowConfig(14,\
    \ 9, 50, 10);\nRobot.lineFollowConfig(11, 7, 60, 5);\n```\n\n```cpp\n// set the\
    \ motor board into line-follow mode\nRobot.setMode(MODE_LINE_FOLLOW);\n```\n\n\
    ```cpp\n// start\nRobot.fill(255, 255, 255);\nRobot.stroke(255, 255, 255);\nRobot.rect(0,\
