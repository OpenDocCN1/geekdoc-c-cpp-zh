    \ for the finish signal\nRobot.debugPrint(millis() - timerOrigin, 5, 29); // show\
    \ how much time has passed\n}\nRobot.stroke(0, 0, 0);\nRobot.text(\"Done!\", 5,\
    \ 45);\n}\n```\n\n```cpp\nvoid loop() {\n//nothing here, the program only runs\
    \ once. Reset the robot\n//to do it again!\n}\n```\n\n# Working Principle\n\n\
    Robot senses the ground beneath it with five sensors. Light reflects back to the\
    \ sensors. In order to detect the line, the wheels of the robot must turn. This\
    \ it does when it does not detect any line and all five sensors produce white\
