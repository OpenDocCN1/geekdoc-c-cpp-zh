    # A) KNOCK


    This tutorial will tell you how to use a Piezo element for detecting knock on
    any surface — a table, the door or the top of a device. As you might have guessed
    the Piezo would be any electronic device, you use for detecting the knock. How
    does it do? The Piezo element possesses the property of generating electricity
    when you vibrate it...meaning you knock it. The output is a sound with a particular
    tone. Therefore, you can use the piezo element to both generate and detect tones.


    We use analog-to-digital conversion (ADC) process that outputs numerals from 0—1023
    for voltage ranges between 0V and 5V. The sketch reads the voltage with analogRead
    (1) function. In case the output is greater than the prescribed threshold, Arduino
    sends a string "Knock!” which you can see by opening serial monitor.


    # Hardware and Circuit Required


    +   - Arduino board

    - Megohm resistor – 1

    - Piezo-electric disc –1

    - Any solid surface (to knock)


    # Circuit


    Piezos have polarized structures. This allows current to pass through them in
    one direction only. Make a connection with the black wire (lower voltage) to the
    ground and the higher voltage red wire to the 0 analog pin. In order to limit
    voltage/current produced by piezo, use a 1-megohm resistor in parallel. If possible,
    get piezo elements that do not have plastic coverings. Now tape the bare metallic
    body to the surface you want to take the reading from.'
