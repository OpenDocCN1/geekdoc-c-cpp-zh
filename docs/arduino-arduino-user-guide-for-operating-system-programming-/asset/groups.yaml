    \n# III) EXAMPLES FROM ESPLORA LIBRARY\n\n# LED SHOW\n\nIn this tutorial, we learn\
    \ how to get the values directly from joystick. The Serial monitor displays output\
    \ in terms of RGB LED color.\n\nYou can move the joystick along two perpendicular\
    \ axes X or Y. Each one of the axes controls one color that the RGB LED displays\
    \ – X- axis depicts red while Y axis depicts green. Blue element will have its\
    \ control by relative position of linear potentiometer.\n\n# Hardware and Circuit\
    \ Required\n\nArduino Esplora\n\n# Circuit\n\nYou will not need any circuit for\
    \ this example.\n\n![](img/a76f70476fe313ae0aea50fdd57d7f99_51_0.png)\n\n# Code\n\
    \nThe brightness of the RGB LED light may be controlled individually through the\
    \ Explora Library functions. The light consists of three colors Red, Green, and\
    \ Blue.\n\nwriteRed();\nwriteBlue();\nwriteGreen();\n\nYou may also control all\
    \ of the colors with one single command using writeRGB(); Values generated will\
    \ differ when the joystick moves. You can also shift the position of the linear\
    \ potentiometer to create new outputs. One output is by the serial monitor while\
    \ the other you see as the RGB LED light.\n\n```cpp\n/*\nExplora LED Show\n\n\
    Makes the RGB LED bright and glow as the joystick or the\nsider are moved.\n\n\
    Created on 22 November 2012\nBy Enrico Gueli <enrico.gueli@gmail.com>\nModified\
    \ 22 Dec 2012\nby Tom Igoe\n*/\n#include <Explora.h>\n```\n\n```cpp\nvoid setup()\
    \ {\n// initialize the serial communication:\nSerial.begin(9600);\n}\n```\n\n\
    ```cpp\nvoid loop() {\n// read the sensors into variables:\nint xAxis = Explora.readJoystickX();\n\
    int yAxis = Explora.readJoystickY();\nint slider = Explora.readSlider();\n```\n\
    \n```cpp\n// convert the sensor readings to light levels:\nbyte red = map(xAxis,\
    \ -512, 512, 0, 255);\nbyte green = map(yAxis, -512, 512, 0, 255);\nbyte blue\
    \ = slider / 4;\n```\n\n```cpp\n// print the light levels:\nSerial.print(red);\n\
    Serial.print(' ');\nSerial.print(green);\nSerial.print(' ');\nSerial.println(blue);\n\
    ```\n\n```cpp\n// write the light levels to the LED.\nExplora.writeRGB(red, green,\
    \ blue);\n```\n\n```cpp\n// add a delay to keep the LED from flickering:\ndelay(10);\n\
    }\n```\n\n# IV) EXAMPLES FROM ROBOT LIBRARY\n\n# A) FOLLOWING THE LINE\n\nThis\
    \ is a fun project where you can race your robot against others. The means of\
    \ controlling your robot is by a line drawn on large paper. Your robot will search\
    \ for the line and then it will follow it. Think of the fun you can have when\
    \ you have more robots!\n\n# Hardware and Circuit required\n\nArduino Robot\n\
    Large white sheet of paper\nBlack marker\nTape\n\n# Procedure\n\n1. Make tracks\
    \ for the robot. These tracks will go on piece of paper. They have to be 1 inch\
    \ (about 2 cm) thick. The line must not intersect the end of the line must join\
    \ the starting point. Join several pieces of paper if track area is not enough.\n\
    2. Fix the paper to the ground with some tape. This will prevent it from slipping\
    \ when the robot runs around it. Try to keep the surface clean. (Note: \"Not\"\
    \ likely OCR error for \"Clean\")\n3. Upload the code, unplug the USB and switch\
    \ on power.\n4. Put the robot on the ground such that it is facing the line.\n\
    5. For the first few trials (starting), the robot will make calibrations and then\
    \ it will orient itself to detect the line.\n6. Once the robot detects the line,\
    \ it will carry on without stop. For more details check lineFollowConfig.\n\n\
    # Try to run it\n\n![](img/a76f70476fe313ae0aea50fdd57d7f99_55_0.png)\n![](img/a76f70476fe313ae0aea50fdd57d7f99_55_1.png)\n\
    \nNow your robot is ready!\n\n# Code\n\n```cpp\n/* Robot Line Follow\n\nThis sketch\
    \ demonstrates the line following capabilities of Arduino Robot. On the floor,\
    \ place some electrical tape along the path you wish to follow. To indicate stopping\
