- md: '

    # Arduino Counterfeit Boards Learning To Spot The Fake


    First off, check the color. Color must be teal. You can turn the board around
    and see the graphics on the back. The typical logo will be an eight on its side
    with a negative and positive sign within the two orbs. Duplicates will be blue
    to deep blue color. The font will not be Silk as it is in the original. The printing
    is clear and symmetrical in the original. If the printing is not clear or does
    not have symmetry, then it is probably a fake. You will also see the map of Italy.
    This also must be clear.


    Look for the 501K component. Most fakes will have a green colored component that
    is available over the counter. The brown component is specially made for Arduino.
    Lastly check if the Arduino is sold by an authorized dealer.


    # Use C to program your Arduino board


    Arduino language for most part consists of C/C++ functions that you call. The
    sketch will be changed in a minor way (for example when you create function prototypes
    automatically) and is then taken up by the C/C++ compiler avr-g++. So every C
    or C++ construct that is working for avr-g++ will work on Arduino. You can get
    more details on this here.


    For more information, please visit this page.

    '
  mdcn: '


    # Arduino 伪造板学习如何识别假品


    首先，检查颜色。颜色必须是青绿色（teal）。你可以翻转板子查看背面的图案。典型的标志应该是一个侧卧的数字“8”，在两个圆圈内各有一个负号和一个正号。仿制品的颜色会是蓝色到深蓝色。字体不会像原版那样是
    Silk 字体。原版的打印清晰且对称。如果打印不清晰或不对称，那么它很可能是假品。你还将看到意大利的地图，这部分也必须是清晰的。


    寻找 501K 元件。大多数假货会使用一种随处可买的绿色元件。而棕色的元件是为 Arduino 特别制造的。最后，检查该 Arduino 是否由授权销售商出售。


    # 使用 C 语言为你的 Arduino 板板编程


    Arduino 语言大部分由你调用的 C/C++ 函数组成。程序（sketch）会发生细微变化（例如，当你自动创建函数原型时），然后由 C/C++ 编译器
    `avr-g++` 处理。因此，任何适用于 `avr-g++` 的 C 或 C++ 结构都可以在 Arduino 上运行。你可以在此处获取更多详细信息。


    欲了解更多信息，请访问此页面。


    '
