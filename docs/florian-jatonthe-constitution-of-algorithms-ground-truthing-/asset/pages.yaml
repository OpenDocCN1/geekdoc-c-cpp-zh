    # World War II: An Increasing Need for the Resolution of Differential Equations


    An arbitrary point of departure could be President Franklin D. Roosevelt’s radio
    broadcast on December 29, 1940, which publicly presented the United States as
    the main military supplier to the Allied war effort, implying a significant increase
    in US military production spending.¹ Under the jurisdiction of the Army Ordnance
    Department (AOD), the design and industrial production of long-distance weapons
    were obvious choices for this war oriented endeavor. For every newly developed
    long-distance weapon, a complete and reliable firing table listing the appropriate
    elevations and azimuths for the reaching of any distant targets had to be calculated,
    printed, and distributed. Indeed, to have a chance to effectively reach targets
    with a minimum of rounds, every long-distance weapon had to be equipped with a
    booklet containing data for several thousands of curved trajectories.² More battles,
    more weapons, and more distant shots: along with the production of weapons and
    the enrollment of soldiers capable of handling them, the US’s entry into another
    world war in 1942 implied an increasing need for the resolution of differential
    equations.


    These practical mathematical operations—which can take the form of long iterative
    equations that require only addition, subtraction, multiplication, and division—were
    mainly conducted in the premises of the Ballistic Research Laboratory (BRL) at
    Aberdeen, Maryland, and at the Moore School of Electrical Engineering in Philadelphia.
