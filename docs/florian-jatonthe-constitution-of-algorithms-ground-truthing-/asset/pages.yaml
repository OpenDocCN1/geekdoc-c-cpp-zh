    connectionist approach to learning (Domingos 2015, 102–104); Hopfield 1982). Shortly
    thereafter, David Ackley, Geoffrey Hinton, and Terrence Sejnowski built on Hopfield’s
    insights and adapted his probabilistic neurons, by proposing a learning algorithm
    for Boltzmann’s machines (Ackley, Hinton, and Sejnowski 1985; Hinton, Sejnowski,
    and Ackley 1984).²20 Then came the real tipping point of this neural network revival,
    with the design of a stochastic gradient retropropagation algorithm (called “backprop”)
    that could calculate the derivative of the network loss function and backpropagate
    the error to correct the coefficients in the lower layers, ultimately allowing
    it to learn nonlinear functions (Rumelt, Hinton, and Williams 1986).²¹ This was
    followed by a difficult period for the inventive and cohesive research community,
    who was once again gradually marginalized.¹² But this did not include the increasing
    computerization of the collective world from the 2000s and the development of
    web services, both of which led to an explosion of neural networked data (often
    at the expense of invisilized-on-demand microarray). Krizhevsky, Sutskever, and
    Hinton’s (2012) paper is one expression, among many others, of this renewed interest
    in neural networks, which goes hand in hand with the persistence of large truths
    such as ImageNet. Yet besides big data labeled data, Krizhevsky, Sutskever, and
    Hinton could also rely on a stack of well-discussed algorithms (e.g., perceptron,
    learning for Boltzmann machines, backprop) to build their model; they were able
    to delegate a significant part of their formulating to other neural network-related
    algorithms considered standard by the connectionist community in 2012.


    What about the term “convolutional”? In this specific context, it is largely derived
    from a successful application of the backpropagation algorithm for optimizing
    neural networks to address an industrial issue: the recognition of handwritten
    postal codes. It was developed by LeCun et al. 1989 and aimed to exploit the potential
    of data expressed as multiple arrays—composed of three colour 2D arrays containing
    pixel intensities in the three colour channels (LeCun, Bengio, and Hinton 2015)—to
    minimize the number of neural parameters as well as the time and cost of learning.
    In a nutshell, the operation consists of reducing the matrix image into a matrix
    of lower dimension using a convolution product—a classical operator in functional
    analysis dating back, at least, to the work of Laplace, Fourier, and Poisson.
    These convolutional layers are then followed by pooling layers, aimed to “merge
