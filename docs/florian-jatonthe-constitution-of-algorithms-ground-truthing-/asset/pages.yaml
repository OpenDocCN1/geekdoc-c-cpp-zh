    Speculating on these elements, we might be tempted to address machine learning—despite
    its great diversity—as unfolding along a continuum (figure 6.10). Machine learners
    make approximations of functions, but perhaps, the more their invocation relies
    on the stacking of other algorithms—operating as an infrastructure that automates
    the formulating activities—the more they constitute machine learning. According
    to this perspective, the term “machine learning” no longer refers only to a class
    of statistical techniques but now also includes a practice (and perhaps, sometimes,
    a habit) of delegating, requiring an appropriate infrastructure that touches upon
    grounding and programming issues.


