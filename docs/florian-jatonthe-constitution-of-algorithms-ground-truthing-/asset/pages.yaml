    But what about the machinery implemented by Krizhevsky, Sutskever, and Hinton
    to develop their deep convolutional neural network algorithm? How did they formulate
    the relationship between the input-data (here, raw RGB-values) and the output-targets
    (here, words referring to objects in natural images) of the ImageNet ground truth?
    Let us start with the term "neural networks." We have already encountered it in
    chapter 3 when we were inquiring into the progressive invisilization of computer
    programming practices. As we saw, the term neural network came from McCulloch
    and Pitts''s 1943 paper, which was itself made visible by its instrumental role
    in von Neumann''s *First Draft of a Report on the EDVAC* (von Neumann 1945). McCulloch
    and Pitts''s main argument was that a simplified notion of "all-or-none" neurons
    act, depending on their inputs, as logic operators OR, AND, and NOT and thus,
    when organized into interrelated networks, could be compared to a Turing Machine.
    The analogy between logic gates and the inner constituent of the human brain was
    used by von Neumann in his *Draft*, in which he was prompted to use unusual terms
    such as "organs" instead of "modules" and "memory" instead of "storage" (surprising
    analogies that met, crucially, be put into the 1945 context when military projects
    like the ENIAC and the EDVAC were still classified). Yet, as intriguing as they
    were, McCulloch and Pitts''s neural networks, in their role as logic gates, could
    learn; that is, they could not adjust the weight of their "Synaptic" interconnections
    according to measurable errors. It was a merit of Frank Rosenblatt''s *perceptron*
    to have integrated a potential for repetition and modification of logic gates
    based on algorithmic comparisons between actual and desired outputs (Domingos
    2015, 97; Rosenblatt 1958, 1962). But the perceptron allows neural networks to
    modify their synaptic weight error signals could only only learn to draw linear
    boundaries among vectorized data, making it vulnerable to much criticism.19 Nearly
    twenty years later, John Hopfield, as part of his work on spin glasses, proposed
    an information storage algorithm that allowed neural networks to effectively perform
    pattern recognition, an achievement that finally brought to light this-called'
