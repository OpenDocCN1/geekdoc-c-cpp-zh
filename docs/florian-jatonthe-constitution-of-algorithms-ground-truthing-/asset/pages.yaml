  md: '# Introduction


    "real" life of action. In places such as the computer science laboratory will
    soon get to know, these activities form a whirlwind process whose elements influence
    each other in a dance of agency (Pickering 1995). Moreover, even though this book''s
    narrative thread is sequential—with subsequent chapters referring to previous
    ones—one may browse through it in different ways. Readers interested in ethnographic
    accounts may, for example, jump from one case to another eventually coming back
    to theoretical pieces such as chapters 3 and 5. Readers who favor conceptual virtues
    may wish to go the other way round, starting with intellectual matters before
    coming back down-to-earth accounts of practices.


    As mentioned earlier, it is important to keep in mind—almost like a mantra—that
    these three activities forming an empirical and partisan vision of what algorithms
    shall be not fixed nor exclusive. Even though they form, I believe, a refreshing
    and faithful conception of how algorithms come into existence, the precise ecology
    of algorithms would clearly benefit from further investigations. There are surely
    many more activities contributing to the formation of algorithms that future ethnographies
    and case studies will, hopefully, unfold. Although this volume does— In that sense,
    although the volume does intend to bring about an alternative action-oriented
    constitution of algorithms, my arguments should also be considered preliminary
    propositions asking for further considerations.


    At any rate, inscriptions make worlds only when read: at this point, my main concern
    is that readers—sociologists interested in the constitutive relationships of algorithms;
    computer scientists curious about an alternative action-oriented account of their
    work; or in fact, anyone concerned about the power, and beauty, of algorithms—are
    intrigued enough to come with me to explore some of the things that are happening
    in a computer science laboratory.'
