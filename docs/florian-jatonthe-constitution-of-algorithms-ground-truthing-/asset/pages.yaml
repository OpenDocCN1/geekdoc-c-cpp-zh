    may vary; it can be, for example, a Matlab interpreter, a C compiler, or an Intel
    microprocessor. At any rate, the common characteristic of these different entities
    is the incredible swiftness of their constitutive relationships. Indeed, how is
    it possible to have a grip on an interpreter, a compiler—worst—a processor that
    executes billions of operations per second? Once assembled, these entities are
    very difficult to grasp; hence the relevance of the scientific method of verdiction
    to better understand what is affecting them. Moreover, I assume that the adoption
    of laboratory practices during computer programming episodes is not a result of
    the miniaturization of electronic components that followed the development of
    planar process at the end of the 1950s (Lécuyer, Brock, and Last 2010). As shown
    by historical studies of early electronic computers were two-meter-high accumulators
    and multipliers—themselves made of hundreds of registers connected with wires
    and soldered joints—every short circuit, carry errors, or divider fault that occurred
    during computation episodes had to be identified and located through the tedious
    formation of error reports, inscriptions, and experiments (Haigh, Priestley, and
    Role 2014; 2016, 60–83). In these early days of electronic computing, programmers
    also had to alignments to pave out an access to the affected component of the
    system.


    Another similarity between scientific practices and the practices of computer
    programming is a common tendency to forget about the instruments that enabled
    the characterization of the phenomenon we are scrutiny. In both cases, when such
    a phenomenon has been identified thanks to a specific laboratory setting, the
    practices, instruments, and experiments that allowed the formation of the chain
    of reference are generally put aside (Latour and Woolgar 1986, 105–155). This
    characteristic of science can make its history difficult to conduct. As established
    facts are purified from the scaffolds that allowed them to be assembled and solidified
    in the first place, great may be the temptation to start from established facts
    and extrapolate backward (Collins 1975). To empirically grasp the practice of
    science, it is therefore crucial to consider factors as consequences of specific
    processes rather than causes of prior events (Bloor 1981). To a lesser extent,
    the same is true for computer programming. When the phenomenon engaging the remote
    entity is characterized; the problematic location in the script is identified,
    most of the instruments (small bits of code, questions to FJ, “stupid things”)
    are put aside and soon forgotten. At the end of the programming episode, when
    the script is functional and performs as desired, most of these intermediary objects
    (Vinck'
