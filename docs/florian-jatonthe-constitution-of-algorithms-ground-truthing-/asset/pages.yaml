    and trustworthy GCM could come into existence. For the case of machine algorithms
    for handwriting recognition or spam filtering, Burrell (2016, 5–6) noted the importance
    of “test data” in setting the parameters of the algorithms as well as in evaluating
    their performances. Here as well, ground truths appear central, defining what
    is statistically learned by algorithms and allowing the evaluation of their performances.¹
    The same seems also to be true of many algorithms for high-frequency trading:
    as Mackenzie (2014, 17–31) suggested, detailed analysis of former financial transactions
    as empirical bases for the shaping and evaluation of “execution” and “proprietary
    trading” algorithms.


    Yet, despite growing empirical evidences, algorithms’ tendency to be essentially
    linked to ground-truth databases that cannot, obviously, be reduced to sets of
    data remains little discussed in the abundant computer science literature on algorithms.
    The issue is generally omitted: mathematical analysis and programming techniques,
    sometimes highly complex, are discussed after, or as if, a ground truth has been
    constructed, accepted, distributed, and accessible. The theoretical exploration
    of what I called in chapter 1 the standard conception of algorithms tends to take
    for granted the existence of stable and sharedential repositories. This omission
    may be what makes such a vision of algorithms possible: considering algorithms
    as tools ensuring the computerized transition from problems to solutions might
    imply to suppose already defined problems and already assessable solutions.


    Some sociologists—most of them STS-inspired—do consider the topic head on, though.
    In their critique of predictive algorithmic systems, Barocas and Selbst (2016)
    warned against the potentially harmful consequences of problem definition and
    training sets’ collection. In a similar way,'
