    # Algorithm, You Say?


    Going through the previous, unusual section, I hope the reader could appreciate
    that writing an ethnographic document about the shaping of algorithms can somewhat
    be tortuous—even more so when one realizes that in computer science the notion
    of algorithm is rarely problematic! As a sociologist and ethnographer interested
    in the manufacture of algorithms, I indeed leaned in an academic field whose most
    illustrious figures have dedicated—and still dedicate—their lives to the study
    of algorithms. For many computer science professionals then, the fuss about “what
    an algorithm is” overhyped as one colleague suggested on my first week in the
    Lab, taking the local undergraduate course in “algorithmic study” may allow me
    to complete my research in record time... In order to specify my analytical gesture,
    it is important to look at this well-established computer-science-oriented take
    on algorithms to consider the present work as an original complement to it.


    When browsing through the numerous—yet not infinite—computer manuals on algorithmic
    study, one notices algorithms are defined in quite a homogenous way. Authors typically
    start with a short history of the term¹⁷ before quickly shifting to the general
    contemporary acceptance as a systematic method composed of different steps.¹¹⁸
    Authors then specify that the rules of an algorithm''s steps should be univocal
    enough to be implemented in computing devices, differentiating algorithms from
    other a priori systematic methods such as cooking recipes or installation guides.
    In the same movement, it is also specified that these step-by-step computer-implementable
    methods always refer to a problem they are designed to solve.¹¹⁹ This second definitional
    element assigns algorithms a function, allowing computers to provide answers that
    are correct relative to specific problems at hand.


    Right after these opening statements, computer science manuals tend to organize
    these functional step-by-step computer-implementable problem-solving methods around
    “inputs” and “outputs.” The functional activity of algorithms is thus further
    specified: the way algorithms may provide'
