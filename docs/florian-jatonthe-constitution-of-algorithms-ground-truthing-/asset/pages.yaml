  md: '# Mathematics as a Science 209


    For example, we can make the fair assumption that, all things being equal, a claim
    published in the journal Nature will generally have more conviction strength than
    a claim posted on some social media platform with very little monitoring. Without
    even considering their respective content, both claims have different capabilities.
    Why is that? What we immediately put the question of prestige or symbolic power;
    these shortscuts our sociological method of inquiry forbids us to manipulate.
    A more empirical rigor on this topic would quickly point to the number of individuals
    who could prevent the publication of a claim. Very few people—bots—can prevent
    me from publishing a claim on, say, Facebook. Conversely, many individuals can
    prevent me from publishing a claim in the journal Nature. Taking into account
    how they would have to be convinced by claims in order for them to circulate and
    reach a broader audience is crucial as it somewhat calibrates the cost of disagreement.
    If someone disagrees with a claim I publish on Facebook, they can just shrug their
    shoulders and move on to something else. But if the same person disagrees with
    me, my institution, the funding agencies that supported my research, Nature''s
    editorial board, those responsible for the nomination of this board, and so. With
    a claim I publish on Facebook, a claim I publish in Nature is initially supported
    by a far bigger team of external allies (Latour 1987, 31–33).


