  md: 'specific metrics (e.g., face or car detection). This often involves automated
    learning procedures and the management of increasingly large databases (Grimson-Lozano-Perez
    1983; Lowe 1999).


    Despite differences in terms of substratum, both high-level and low-level detection
    algorithms are, and bound to the same construction work-flow consists of five
    interrelated and problematic steps:


    +   1. The acquisition of a finite dataset.


    +   2. On the data of this dataset, the manual labeling of clear targets, defined
    here as the elements (faces, cars, salient regions) the desired algorithm will
    be asked to detect.


    +   3. The construction of a database gathering the unlabeled data and their manually
    labeled counterparts. This database is usually called “ground truth” by the research
    community.


    +   4. The design of the algorithm’s calculating properties and parameters based
    on a representative part of the ground-truth database.


    +   5. The evaluation of the algorithm’s performances based on the rest of the
    ground-truth database.


    To illustrate this schematic workflow, let us hypothesize the existence of $\phi$,
    a standard detection algorithm in image processing. The very existence of $\phi$
    depends upon a finite set of digital images for which human workers have previously
    labeled targets (e.g., faces, cars, salient regions). The unlabeled images and
    their manually labeled counterparts are then gathered together within a database
    to form the **ground truth** of $\phi$. To design and code $\phi$, the ground
    truth is randomly split into two parts: the “training set” and the “evaluation
    set.” The designers of $\phi$ would use the training set to extract formal information
    about the targets, with help of mathematical expressions. Once formulated and
    translated into machine-readable code, the algorithm $\phi$ is tested on the evaluation
    set to see how well it detects targets that were not used in its properties. From
    its confrontation with the evaluation set, $\phi$ produces a number of outputs
    that can be qualified as “true positives,” or “false positives,” thanks to the
    previous human-labeling work. Out of this comparison between manually designed
    targets and automatically produced outputs, statistical measures such as precision
    (the fraction of detected items that were previously defined as targets) and recall
    (the fraction of targets among the detected items) can be obtained to compare
    and rank competing algorithms (see figure 2.1).'
