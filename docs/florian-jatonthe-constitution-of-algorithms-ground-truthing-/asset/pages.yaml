    I need to mention one thing before we dive into the practices of computer programming.
    One may easily object that the following case study and its subsequent tentative
    propositions are not representative of programming practices in general. To this,
    I answer that representativeness is simply not at stake here. Representativeness
    is indeed a powerful and important concept but only when the boundaries of a population
    are clearly defined. Inhabitants of a town, cells of a tissue, words of a book:
    all can be related to a costly and equipped set—the administrative and geographical
    limits of towns, the physical limits of a sample, the hardcover of a book—that
    defines a territory and population. In this specific—rare and controversial—the
    concept of representativeness can be used to extract statistically meaningful
    results. But when there is no territory, the very notion of representativeness
    loses its raison d''être. What is programming? Who are programmers when they program?
    We do not know as there were very few studies of computer programming practices.
    This is typically where ethnography can be useful: the exploration of nondefined—or
    problematically defined—territories may provide for the design of subsequent boundaries
    to be explored statistically. And I think that the young street artist in Leipzig
    who is writing a small JavaScript program to animate the menus of her personal
    website, the engineer of Boeing who is working on the last Ada''s update for cabin
    pressurization modules, or the computer scientist who tries to parse .txt files
    with the Matlab IDE in many ways—they have different problems, affects, environments,
    equipment—I also think that none of these situations have yet been accounted for
    ethnographically. The following case study is one of the very first steps into,
    I, hope for more systematic studies of programming courses of action; hence the
    exploratory aspect of its propositions.'
