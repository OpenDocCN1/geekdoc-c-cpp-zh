    # Introduction


    been published on computer science work.25 The cost of entry and the time required
    to carry out this type of investigation certainly contributed to this situation.
    It is also possible that a peculiar habit of thought participated in this disinterested.
    Indeed, for entangled reasons I will try to tackle this in chapters 3 and 5, the
    fair assumption that computer code and mathematics actively contribute to the
    shaping of computerized methods of calculation is often doubted with the not-so-fair
    assumption that both code and mathematics have no, or little, empirical thickness.
    This assumed evanescence of the ingredients of algorithms contributes, in turn,
    to making them appear inscrutable. This common habit—that Ziewitz (2016) associated
    with an algorithmic drama26—may have discouraged sociologists from entering sites
    where algorithms are shaped, diffused, and maintained: Why both trying to inquire
    into these places since everything happens in the heads of those who work?


    But like any ethnographer involved in the daily work of a scientific laboratory—trying
    to participate, talk adequately, and compile empirical materials—I quickly realized
    that very few things could be attributed to the brains of my colleagues, however
    clever they were. Of course, they never stopped doing things—writing on scratch
    paper, comparing graphs, typing on keyboards, indexing databases, moving their
    mouse cursors, taking coffee breaks—at first appeared unrelated. But as I stubbornly
    accounteded for these things in my logbooks, I soon realized that the succession
    of small elementary “blocks” sometimes ended forming bigger accomplishments: a
    database, a script, a complete program, an algorithm. By remaining continuously
    with my new colleagues in their laboratory, conscientiously writing down observations
    and recording some sequences (with their prior authorization), I was soon forced
    to admit that what we call “practice” is in fact a term without opposite (Latour
    1996). In the artificial science of my laboratory study, accounting for as many
