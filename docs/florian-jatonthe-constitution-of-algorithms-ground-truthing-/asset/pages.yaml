  md: '# Studying Computer Scientists 39


    meaningful ways might at at first sound esoteric, such an activity plays an important
    role in contemporary economies.⁹ This is to be related with the unprecedented
    production, circulation, and accessibility of digital photographs:¹⁰ thanks to
    image-processing algorithms, these numerous two-dimensional signals become potentially
    indicating habits, attributes, preferences, and desires. Instead of a noisy, expansive
    stream of inscrutable data, the many digital photographs produced and shared every
    day have turned into valuable assets (Birch and Muniesa 2020) with the advent
    of image processing and recognition. This is a phenomenon whose must be grasped.
    Giant technology services companies such as Facebook, Google, Amazon, Apple, IBM,
    or Microsoft have laboratories whose members work every day to manufacture new
    algorithms to commercially exploit the infinite potential of digital photographs,
    tangible expressions of what users, clients, and partners are assumed attached
    to.¹¹ Nation-states are not to be left out entirely; public agencies also massively
    invest in image processing to make use of the capabilities of digital photographs
    for security, control, and disciplinary purposes.¹² In recent years, similar to
    what Hine (2008) described for the case of biological systematics, image processing
    has been as a resource in control and planning and, to this end, has increasingly
    the object of strategic policy concern and support.


    All this may sound gloomy. However, image processing is inextricably a fascinating
