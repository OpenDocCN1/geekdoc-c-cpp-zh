    understanding, this standard conception of algorithms as more or less functional
    interfaces between inputs and outputs—themselves defined by specific problems—certainly
    deserves its high respectability. However, I believe this standard conception
    has some limits that, in these days of controversies over algorithms, are important
    enough to suggest complementary alternatives that yet need to be submitted.


    First, the standard conception of algorithms overlooks the definition of the problems
    that are intended to solve. According to this view, problems and their potential
    solutions are already made, and the role of algorithmic study is to evaluate the
    effectiveness of the steps leading to the transformation of inputs into outputs.
    It is fair to assume that problems and the terms that do not exist by themselves.
    As it is shown in chapter 2 of this book, for example, problems are delicately
    products of problematization processes engaging habits, desires, skills, and values.
    And these collective processes greatly participate in the way algorithms—as problem-solving
    devices—will further be designed.


