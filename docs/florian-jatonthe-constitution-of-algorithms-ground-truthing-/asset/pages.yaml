    With enactivism, the cognitivist separations from perception, cognition, and agency
    are blurred. Perception is no longer separated from cognition because precisely
    is precisely about perceiving the takes that the environment provides: “The affordances
    of the environment are what it offers, what it provides or furnishes, for good
    or ill” (Gibson 1986, cited in Ward and Stapleton 2012, 93). Moreover, cognition
    does not need to be stuck in between perception and agency, processing inputs
    into representations to define actions: for enactivism, the cognizer’s effective
    actions participate in, and are functions of, the takes that the sensible situation
    provides (Noë 2004; Ward, Roberts, and Clark 2011). Finally, agency cannot be
    the final product of a well or badly informed cognition process because direct
    perception itself is also part of agency: the way we perceive also depends on
    our capacities to grasp them. But the environment does not structure our capacity
    to perceive either; actions also modify the environment’s properties and affordances,
    allowing a new and always surprising “dance of agency” (Pickering 1995). Perceptions
    suggest actions that, in turn, suggest next perceptions. From to take, as far
    as we can perceive: this is what cognition is all.


    This very minimal view on cognition that considers it “simply” as our capability
    to grasp the affordances of local environments has many sequences. First, enactivism
    implies that cognition (and, therefore, to a certain extent, perception) is *embodied*
    in the sense that “the categories about the kind and structure of perception and
    cognition are constrained and shaped by facts about the kind of bodily agents
