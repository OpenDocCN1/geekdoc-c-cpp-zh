    Though important, the technical features of the algorithm developed by Krizhevsky,
    Sutskeever, and Hinton are not central to the proposition I wish to make. It is
    more important to grasp the overall algorithmic machinery they mobilized to formulate
    the relationships between their input and output targets. Consider Boltzmann machines,
    backpropagation, convolutional networks, and max-pooling: although these algorithms
    were not mainstream in the image-processing and recognition community—as they
    come from an often marginalized connectionist tradition—none constituted a relatively
    stable structure that could be mobilized to find approximations of functions within
    large, reliable, training sets. The work of Krizhevsky, Sutskeever, and Hinton
    was undoubtedly impressive in many respects. Nonetheless, they were able to capitalize
    on a modular algorithmic infrastructure capable of operating, at least theoretically,
    as a formulating machine (see figure 6.9).


