    If we tentatively expand the above propositions, we end up with two ways of considering
    algorithms that both pivot about these material objects called ground truths.
    What we may call an axiomatic perspective on algorithms would consider algorithms
    as sets of instructions designed to computationally solve in the best possible
    way a problem defined by a given ground truth. A second, and complementary, problem-oriented
    perspective on would consider algorithms as sets of instructions designed to computationally
    retrieve what has been defined as output-targets during specific atomization processes.


    While I do think that both axiomatic and problem-oriented perspectives on algorithms
    are complementary and should thus be intimately articulated—specific numerical
    features being suggested by ground truths (and vice versa)—I also believe that
    they lead to different analytical effects. By considering the terms of the problem
    at hand as given, the axiomatic way of considering algorithms facilitates the
    study of the actual mathematical and programming procedures that effectively end
    up transforming input sets of values into output sets of values in the best possible
    ways. This may sound like an obvious statement, but defining a calculating method
    requires minimal agreement on the initial terms and prospective results of the
    method (Ritter 1995). It is by assuming that the transformation of the input-data
    into the output-targets is desirable, relevant, and attestable that a step by
    step schema describing this transformation might be proposed. In the case of computer
    science, different areas of mathematics with many different certified rules and
