  md: '# Studying Computer Scientists


    This inquiry took place in a European technical institute (ETI) between November
    2013 and February 2016. This public school was integral part of the global academic
    landscape and hosted more than five thousand undergraduate and twenty-five hundred
    graduate students in five faculties: basic sciences, engineering, life sciences,
    architecture, and computer science. In this investigation, I will mainly focus
    on the computer science faculty (CSF), one of the most renowned within the ETI
    for its ability to attract foreign students and professors, to raise important
    research funds, and to engage in numerous partnerships with the industry.


    Over the time of the inquiry, the CSF employed nearly forty professors supervising
    the training of more than 780 undergraduate and S50 graduate students. The CSF
    professors were supported in their teaching activities by around 250 doctoral
    students who were also working on the completion of their PhD theses, generally
    over four years. Research among CSF members was extremely varied, ranging from
    theoretical computer science and hardware architecture to machine learning and
    signal processing. Significant human and material resources were invested to gird
    the whole domain of computer science and take active part to its development.


    Teaching, research, and administrative activities of the CSF were nearly located
    in six buildings linked to each other by a system of paths, footbridges, and underground
    passages. Within this complex, the most recent building (inaugurated in 2004)
    served as a nerve center, housing most of the laboratories, the best equipped
    conference rooms, and the faculty''s cafeteria, highly prized for its breathtaking
    view of the surroundings (figure 1.1). Opposite the CSF''s main building, on the
    other side of a small road, was another complex of buildings housing around one
    hundred start-ups and'
