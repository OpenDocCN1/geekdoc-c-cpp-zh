    Group meeting, the Lab’s cafeteria, November 7, 2013


    GY: “But we want to use crowdsourcing to do a new ground truth and ask people
    to label features they think are salient. ... And then we could use that for our
    model and compare the results, you see?”


    In broad strokes, crowdsourcing—a contraction of “crowd” and “outsourcing” initially
    coined by journalist Howe (2006)—is a “type of participatory online activity in
    which an individual, an institution, a non-profit organization, or a company proposes
    to a group of individuals of varying knowledge, heterogeneity, and number, via
    a flexible open call, the voluntary undertaking of a task” (Estellés-Arola and
    González-Ladrón-Guevara 2012, 195). In November 2013, this service was offered
    by companies such as Amazon (via Amazon Mechanical Turk), ClickWorker, or Employment
    Crossing (whose own application programming interfaces (APIs)¹ recommended surveys
    to register online workers mainly located in the United States and India. Once
    a worker submits their completed task—which can vary greatly in time and complexity—the
    organization that designed the survey (eg, a research institution, a company,
    an individual) can decide on its validity. If the task is considered valid, the
    worker receives from the crowdsourcing company the amount of money indicated in
    the open call. If the task is considered valid, the worker receives nothing and,
    most of the time, no possibility of appeal. As the moral economy of crowdsourcing
    has recently been the object of critical sociological studies, it is necessary
    to devote a short sidebar to it.


    Contingent work has long supported industrial efforts. For example, documented
    by Pennington and Westover (1989), the textile industry as developed in England
    in the 1850s relied heavily on off-site manufacturing operations, often referred
    to as “industrial homework.” Women and children living in the countryside, operating
    as proto-on-demand workers, were asked to make crucial finishing touches too few
    for the machines of the time. Almost simultaneously, a similar phenomenon was
    taking place in the United States, particularly in the Pittsburg, Pennsylvania,
    area: even though it was often seen as a reminiscence of the industrial era that
    was doomed to disappear, “piecework” organized on a commission basis in partnership
    with rural households was a necessary lever for the scaling up of mass manufacturing
    (Albrecht 1982). And if trade unions did later manage,'
  merge: -1
  pgno: 79
- img_proc: true
  md: '66


    Chapter 2


    through painful struggles, to somewhat improve the working conditions of employees
    (e.g., US Fair Labor Standards Act in 1938, French Accords de Matignon in 1936),
    these improvements mostly concerned full-time work carried out on designated production
    sites that was mostly reserved for white male adults. The concessions made to
    salaried workers during the first half of the twentieth century mostly concerned
    those who benefited from visibility and proximity: contingent work, which was
    scattered, not very visible, little valued, and considered unskilled, continued
    to pass under the radar. This—and—to many other things that are beyond the scope
    of this sidebar¹¹ added a more or less explicit corporate strategy of circumvent
    unionization and work regulations (which were already reserved for specific trades)
    based notably on the growing availability of information and communication technologies.
    This strategy of “fissuration of the workplace”¹² (Weil 2014) helped to promote
    outsourcing instead of employing benefiting and depend on remote worldwide networks
    of contingent staff. And crowdsourcing, as distributed computer-supported on-demand
    low-valued work, can be seen as the continuation of contingent work’s support
    to and modification of industrial capitalism. As Gray and Suri (2019, 58) noted:
    “Those on-demand jobs today are the latest iteration of expendable good work.
    They are, on the one hand, in the moment, but they are too easily devalued the
    tasks that they are typically dismissed as mundane or the people often employed
    to do carry no cultural cult.”¹³


    Let us come back to the Lab. In November 2013, like most people, the Group was
    not aware of the dynamics underlying generalized outsourcing and devaluation of
