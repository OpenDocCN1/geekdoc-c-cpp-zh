    # The Psychology of Programming (And Its Limits)


    The problem with practice is that it is necessary to do things: essence is existence
    and existence is action (Deleuze 1995). And as soon as electronic computing systems
    started to be presented as input-output functional devices controlled by a central
    organ, the efforts to make them function in desired ways quickly stood out: it
    was extremely tedious to make the devices meaningful things. These intelligent
    electronic brains were, in practice, as dull. But rather casting doubts on the
    input-output framework of the First Draft and considering it formally brilliant
    but empirically inaccurate, the blame was cast on the individuals responsible
    for the design of computer’s inputs. In short, if one could not make electronic
    brains operate, it was because one did not manage to give them the inputs they
    deserved. What was soon called the “psychology of programming” tried, and tries,
    to understand why individuals interact so laboriously with electronic computers.


    This emphasis on the individual first led to aptitude tests in the 1950s that
    aimed at selecting the appropriate candidates for programming jobs in a time of
    workforce scarcity. The late 1970s, entangled dynamics that made Western software
    industry shift from scientific craft to gender-connoted engineering supported
    the launching of behavioral studies that typically consisted of programming tests
    whose relative results were attributed to controlled parameters. A decade later,
    the contested results of these behavioral tests as well as theoretical debates
    within the discipline of psychology to cognitive studies of programming. Cognitive
    scientists put aside the notion of parameters proposed by behaviorists to focus
    on the mental models that programmers should develop to construct efficient programs.
    As we will see, these research endeavors framed programming in ways that prevented
    them from inquiring what programmers do, thus perpetuating the invisibilization
    of their day-to-day work.'
