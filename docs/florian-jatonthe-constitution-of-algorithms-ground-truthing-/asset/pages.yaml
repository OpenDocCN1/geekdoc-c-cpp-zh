    If computationalism in cognitive science derives from a quite recent nonempirical
    history of computers, its metaphysics purely belongs to a philosophical lineage
    that goes back at least to Aristotle (Dreyfus 1992). Susan Hurley (2002) usefully
    coined the term ‘classical sandwich’ to summarize the metaphysics of this lineage—also
    referred to as ‘cognitivism’—that that considers perception, cognition, and agency
    as distinct capacities. For the supporters of the classical sandwich, human perception
    first grasps an input from the ‘real’ world and translates it to the mind (or
    brain). In the case of computationalism, this perceptual input takes the shape
    of nervous pulses that can be expressed as numerical values. Cognition, then,
    ‘works with this perceptual input, uses it to form a representation of how things
    are in the subject’s environment, and through reasoning and planning that arrives
    at a specification of what the subject should do or in his current environment’
    (Ward and Stapleton 2012, 94). In the case of computationalism, the cognitive
    step implies the selection and application of a mental model—or mental program—that
    outputs a different value to the nervous system. Finally, agency is considered
    the output of both perception and cognition processes and takes the form of bodily
    movements instructed by nervous pulses.


    This conception of cognition as ‘stuck’ in between perception and action as meat
    in a sandwich has many consequences. It first establishes a sharp distinction
    between the mind and the world. Two realms are created: the realm of ‘extended
    things’ that are said to be material and the realm of ‘thinking things’ that are
    said to be abstract and immaterial.²⁰ If matter thrones in the realm of ‘extended
    things’ by allowing substance and quantities, mind thrones in the realm of ‘thinking
    things’ by allowing thoughts and knowledge.


    Despite the ontological abyss between them, the realms of ‘thinking things’ and
