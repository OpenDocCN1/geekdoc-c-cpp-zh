    This leads us to the important notion of inscription that we have already encountered
    in the introduction where I emphasized the world-generative capabilities of these
    durable, mobile, and re-presentable entities. There are, of course, many different
    types of inscriptions: books, WhatsApp messages, shopping lists, or even tattooed
    bodies can be considered inscriptions, some being more durable, mobile, and re-presentable
    than others (Gitelman 2014). But in any case, inscriptions are translated manifestations
    of more or less attributable events and thus constitute, at least potentially,
    takes offered by the environment in specific situations. These inscriptions are
    not representations (without hyphen) of “real things” that feed mental computations.
    They are formatted re-presentations of events that may be grasped and, in turn,
    configure other world-generative tasks. This is why I needed to tediously induce
    enclave cognition at the end of chapter 3: as we are now aware that adage precedes
    cognition, documents and inscriptions can be considered no more than also no less
    that may gest other actions—from take to take, as far as we can perceive and make
    sense (Penny 2017).


