    # Glossary


    process thought is an ontological position supported by a wide and heterogeneous
    body of philosophical works that share similar sensibilities towards associations—sometimes
    also called relations. For process thinkers, what things are what they become
    in association to other entities, the association itself being part of the process.
    The emphasis is put on the "how" rather than the "what": instead of asking what
    something is, process thinkers would rather ask how something *becomes*. This
    ontology is about continuous performances instead of binary states.


    PROG specifically refers in, to a Matlab computer program aiming to create matrices
    whose pixel-values correspond to the number of rectangles drawn by human coworkers
    on pixels of digital images.


    program is a document whose structure and content, when adequately articulated,
    makes computers compute data. The practical process of writing a computer program
    is called *programming*.


    re-presentation is the presentation of something *again*. Inscriptions are common
    representations in that they display properties of other entities. Re-presentations,
    in this book, should not be confused with representations (without the hyphen),
    a term that refers to the solution found by cognitivist authors to overcome the
    distinction between extended things (*res extensa*) and thinking things (*res
    cogitans*).


    saliency detection is a subfield of image processing that aims to detect people''s
    attention within digital images. Because the topic of these detection efforts
    is extremely equivocal, saliency detection is a field of research that shows dynamics
    may go unnoticed in more traditional subfields such as facial or object recognition.


    scenario refers to a narrative operating a while shifting toward another place,
    another time, and other actors while having a hold on its enunciator. As performative
    narrative resources, scenarios are of crucial importance for programming activities
    because they institute on which programmers can hold—while being held by them—and
    establish, in turn, the boundaries of computer programming episodes.


    **Science and Technology Studies (STS)** are a subfield of social science and
    sociology that aims to detect the co-construction of science, technology, and
    the collective world. What loosely connects the practitioners of this heterogeneous
    research community is the conviction that science is not just the expression of
    a logical empiricism, that knowledge of the world does not coexist, and scientific
    and technological truths are dependent on collective arrangements, instrumentations,
    and dynamics.


    script commonly refers to a small computer program. Many interlinking scripts
    and programs calling on each other typically form a *software*. The notion should
    not be confused with Madeleine Akrich’s (1989) “scripts” that, in this book, are
    close to the notion of *scenario*.'
