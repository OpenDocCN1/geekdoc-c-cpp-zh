    # The (Varying) Reality of Machine Learning


    So far in this case study, we saw that although ground-truth activities—in their
    capacity as producers of training and evaluation sets and enablers of performance
    measures—influence formulating activities, expectations regarding future requirements
    may also influence the initial generation of ground truths. We then saw to follow
    the Group in its algorithm project, we saw that many practical translations were
    necessary to make a training set acquire the same form as a mathematical object.
    Moreover, we saw the results of formulating activities—in this case, a mathematical
    formula—relate to programming activities, the former providing transposable scenarios
    to the latter.


    When we combine these empirical elements with those of part I and part II, we
    get a quite unusual action-oriented conception of algorithms (see figure 6.7).
    Indeed, it seems that what we tend to call an algorithm may be the result of three
    interrelated activities that I ground-truthing, programming, and formulating.
