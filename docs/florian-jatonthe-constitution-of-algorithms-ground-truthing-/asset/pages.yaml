    # The Lab


    The Lab was located on the third floor of the CSF main building. Typical of the
    organization of the CSF, it was centered upon the tutetary figure of a full professor,
    the director of the Lab. The director was assisted by a secretary dealing with
    administrative issues that were often complex due the high proportion of collaborators
    who came from abroad (especially from Persia, India, and China).² Among these
    collaborators, one postdoc stayed at the Lab for one-and-a-half years. An invited
    scholar also had a desk and took active part in teaching and research activities.
    Members of spin-offs, sometimes related to the innovation area mentioned earlier,
    also stayed within the Lab for the duration of their fund raising, ranging from
    one to two years. It was not uncommon for these spin-off collaborators to make
    presentations at Lab seminars (more on this later), though these situations the
    other collaborators were required to respect an unofficial “nondis-closure arrangement.”
    Some collaborators in between two research contracts were also sometimes hired
    as “scientists,” a temporary position allowing'
