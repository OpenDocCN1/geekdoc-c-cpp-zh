    For the case of computer programming, one may imagine different expressions of
    the alignment practices I have documented above. Even I conjecture that these
    expressions still consist in forming chains of reference in order to access remote
    entities and specific locations within lists of inscriptions, they may not necessary
    deploy themselves in a spatio-temporal landmark that is similar to the one of
    DF. If we consider for example “program testing”—an important process that consists
    in detecting and documenting errors in order to modify lines of code—this work
    can be highly distributed in space and time (Parrington and Roper 1989; Myers,
    Sandler, and Badgett 2011). The “bug reports” we often encounter when one of our
    software programs crash for mysterious reasons are other because precisely documenting
    at what time and following what actions the program fatally affected the interpreter,
    compiler, or processor. These reports serve as first inscriptions that will, in
    turn, be articulated with another one, and then another one, until eventually
    it indicates one of the phenomenon within the source code of the program. Moreover,
    alignment practices can be automated and integrated within the programming languages
