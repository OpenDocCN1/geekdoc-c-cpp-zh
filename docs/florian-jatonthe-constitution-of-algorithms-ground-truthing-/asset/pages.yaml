  md: '# Mathematics as a Science


    This chapter aims to consider mathematical knowledge not as the expression of
    some superior reality but as a huge collection of scientific facts whose shaping
    necessitated a fair amount of practical work. As we will see, by considering mathematical
    knowledge to be one specific product (among many others) of scientific activity,
    we may provide a reasonable explanation of its capacity to make important differences
    in other scientific domains (neurology, geography, gambling, computer science,
    etc.). Once this operational exercise is over, I will come back to the main goal
    of this part III: understanding when, how, and why mathematical knowledge takes
    part in the constitution of algorithms (chapter 6).


    # Where Is the Math?


    If we want to better understand how mathematical entities (formulas, theorems,
    conjectures, equations) are manipulated and related to ground truths and programming
    languages, we first need to better understand where they come from. Such entities
    do not exist by themselves; they need to be assembled by people in specific designated
    places. Where are these places? Who are these people, and what do they do?


