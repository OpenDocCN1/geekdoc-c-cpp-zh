    These basic fair observations are all we need to start our operationization exercise.
    Mathematicians certainly do a lot of things, but among these things, they make
    claims that attract the adherence of more or fewer individuals. Let us assume
    that the grand notions of “theorems,” “conjectures,” “formulas,” or “proofs” can
    be grasped in a down-to-earth manner; let us assume that, to a certain extent,
    they are claims that convey more or fewer individuals.


    This way to consider mathematical knowledge—theorems, conjectures, proofs—as the
    product of some rhetoric may sound odd at first. Many grand narratives have enchanted
    the abstract of mathematical truths that, by themselves, supposedly describe some
    superiority. But this is precisely the road we do not want to take, at least not
    yet. If we do not want to crash on the sharp rocks of epistemological accounts
    of mathematics, we need to plug our ears and, for the moment, ignore the sirens
    of sincerity. Fortunately for, our first operational hypothesis—mathematicians
    make claims that convince more or fewer individuals—echoes well the central of
    Lakatos''s (1976) important book on mathematics. As he showed, instead of an accumulation
    of self-evident discoveries, mathematics should be considered a creative process
    during which concurrent claims are subjected to criticism and improvement. But
    how are such claims criticized or improved? How do they gain or lose their relative
