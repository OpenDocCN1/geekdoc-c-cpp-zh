  md: '# Presentation of the Empirical Materials


    This case study is taken from the saliency-detection project we already encountered
    in chapter 2. Just to refresh the memory of the reader, this saliency-detection
    project included two PhD students and a postdoc—BJ, GY, and CL—that I shall keep
    on referring to as a single entity: "the Group." In a nutshell, the Group’s argument
    that framed the project was that saliency detection in image processing may become
    more industrially if saliency-detection algorithms could detect, segment, and
    evaluate the varying importance of salient objects and human faces within complex
    digital photographs. This new problematization of the saliency problem called
    for the construction of a new ground-truth database gathering unlabeled complex
    images and their manually labeled counterparts, the "targets." The new ground-truth
    was was central to the formation of the Group’s algorithm as this database materially
    established the terms of the problem to be solved. To effectively shape its algorithm,
    the Group divided its new ground-truth database into two sets: a training set
    and an evaluation set. The training set was used to study the relationships between
    input-data and their targets. Once these relationships were defined and expressed
    in a computational model, the Group translated this model into numbered lists
    of machine-readable instructions, thus assembling a genuine computer program.
    The performances of this program could then be evaluated on the evaluation set
    by means of standard statistical measures. The new ground-truth database, the
    principles of the computational model, and the processing performances of the
    correlated computer program were later presented in an academic paper that was
    rejected by the committee of an important conference in image processing. Yet
