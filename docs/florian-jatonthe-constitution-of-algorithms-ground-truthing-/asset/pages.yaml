    # Reframing Saliency


    If, at the beginning of the chapter, the Group''s explanations appeared quite
    cryptic, the previous introductory review should now enable us to understand them
    critically. Let us look at the same excerpt once again:


    # Group meeting, the Lab''s cafeteria, November 7, 2013


    +   CL: "So, you heard about saliency, right?"


    +   FJ: "Well, I''ve read some stuff."


    +   CL: "Huge topic, but basically, when you look at an image, not everything
    is important usually, and you focus only on some elements. ... What we try to
    do basically, it''s like a model that detects elements in an image that should
    attract attention. ... GY worked on a model that contrasts to segment objects
    and Bj has a model that detects faces. We''ll use these as a base. ... For now,
    most saliency models only detect objects and don''t pay attention to faces. There''s
    no ground truth for that. But we say is faces are also important and usually attract
    the attention. ... And that''s the point: we want to include faces to saliency,
    basically."


    +   GY: "And segment faces. Because face detectors output only rectangles. ...
    There can be many applications [for the model], like in display or compression
    for example."


    According to the Group, saliency-detection models should also take human faces
    into account as faces are important in human attention mechanisms. Moreover, investing
    this within saliency detection would be a good opportunity to merge of the Group''s
    recent researches on low-level segmentation and high-level face detection. The
    idea to combine high-level face detection with low-level saliency detection derived
    from previous image-processing papers (Borjie 2012; Karthikeyan, Jagadeesh, and
    Manjunath 2013) inspired themselves by studies in gaze perception (Cerf, Frady,
    and Koch 2009), cognitive psychology (Little, Jones, and DeBruine 2011), and neurobiology
    (Dekowska, Kuniecki, and Jaśkowski 2008). But the'
