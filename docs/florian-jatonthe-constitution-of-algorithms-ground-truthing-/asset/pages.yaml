  md: '# Introduction


    For critics and advocates alike, if we want to know algorithms, we may need to
    live with them.

    —Seaver (2013, 11)


    Let us start this introduction in medias res, in the middle of things:


    # Rearrangement 1


    The election of Donald Trump in November 2016 was quite surprising: how could
    such a controversial figure reach the White House? The reasons, of course, are
    numerous. But what if one of them was Facebook (Lapowsky 2016)? After all, Trump
    supporters never stopped using this platform to spread out disputed contents.
    What if voters were brainwashed by the “fake news” Facebook contributed to diffusing?
    What if this extensive interlinking participated in Trump’s advertisement and
    fundraising? However harsh this claim might be, it seriously harms the image of
    the web application that would rather help to “connect people” to build border
    walls (Isaac 2016). It seems then that monitoring needs to be increased, even
    though it may contradict some assumptions Mark Zuckerberg elevates as precepts
    (Zuckerberg 2016). The main target is the “News Feed, the spine of the application
    that displays stories posted by Facebook users. What about slightly modifying
    how News Feed automatically selects new stories to ignore “low quality posts?”
    This may help restore Facebook’s public image, at least for a little bit, at least
    for a little while. And after several months of in-house research and testing,
    a new algorithm is made operational—based on frequencies of posts and URLs of
    links—identifies spam users and automatically'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Introduction


    deprioritize the links they share (Isaac and Ember 2016). According to one of
    Facebook’s vice presidents, this new method of computation should significantly
    reduce the diffusion of “low quality content as clickbait, sensationalism, and
    misinformation” (Moss 2017).


    # Rearrangement 2


    Planet Mars is a distant location. But hundreds of millions of kilometers did
    not dishearten the US National Aeronautics and Space Administration (NASA) from
    sending the robotic rover Curiosity to explore its surface. On May 6, 2012, the
    costly vehicle safely lands on Gale Crater. Quite a feat! Amazing high-resolution
    pictures are soon available on NASA’s website, showing the jagged surface of cold
    and arid planet. Of course, Curiosity is far more than a remote-controlled car
    taking exotic pictures. It is a genuine laboratory on wheels with many high-tech
    instruments: two cameras for true-color and multispectral imaging, two monochrome
    cameras for navigation, a robotic arm with ultrahigh-definition camera, a laser-induced
    spectrometer, solar panels, two lithium-ion batteries, and so on (Jet Laboratory
    2015). Yet there is an obvious cost to this amazing remote-controlled laboratory:
    it needs to move its 350 kilograms (gravity considered). The sharp, rocky surface
    of Mars does not alleviate the constant efforts of Curiosity’s wheels, irremediably
    wearing down. And in January 2014, the situation becomes alarming (Webster 2015):
    Is there a way to extend the lifetime of Curiosity’s wheels? After much research,
    a new driving algorithm becomes operational in June 2017 from the navigation cameras
    to adjust Curiosity’s speed when it comes to sharp Martian pebbles (Good 2017).
    By reducing the load of Curiosity’s leading and middle wheels up to 20 percent,
    this new method of computation for navigation is considered a serious boost for
    the mission (Sharkey 2017).


    # Rearrangement 3


    Israeli secret services in the West Bank are used to dismantling organizations
    as terrorist by means of preventive actions and intimidation. But what about individuals
    who commit attacks on a whim? Just like several police departments in the United
    States (Berg 2014), Israeli'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    secret services are now supported by a security software whose algorithm generates
    profiles of potential attackers based on aggregated data posted on social media.
    Yet while several US courts are seriously considering the harmful bias of these
    new methods of computation (Angwin et al. 2016; Liptak 2017), Israeli military
    justice as applied to suspected Palestinian “attackers” prevents them from having
    any sort of legal protection. Thanks to the ability of the West Bank military
    commander to stamp administrative detentions, these “dangerous profiles” can be
    sentenced to a renewable six-month incarceration without any possibility of appeal.
    Many Palestinians targeted by this state-secret technology “have served long years
    without ever seeing a court (Gurvitz 2017).


    # Rearrangement 4


    How can people be made to eat Nutella? It has not been easy recent years for the
    Italian brand of chocolate spread. When palm oil production threatened remote
    orangans, only a small fraction of citizens was eager to criticize its use in
    Nutella’s recipe. But in May 2016, as soon as palm oil is suspected of speeding
    up the speed of cancer among Nutella consumers, there starts to be a worrying
    drop in sales (Landini and Navach 2017). For Nutella, something needs to be done
    to reconnect with the stomachs of its customers. What about a fresh new marketing
    campaign? In collaboration with advertising agency Ogilvy & Mather Italia, seven
    million uniquely designed Nutella jars are soon produced and sold in record time
    lies an algorithm that computes a carefully selected set of colors and figures
    to generate unique pop patterns (Leadem 2017).


    States of affairs change. In November 2016, News Feeds of Facebook users were
    subjected to spammers diffusing hoaxes and “fake news” that are presumably played
    a role in the election of Donald Trump. One month later, these News Feeds temporarily
    became monitored lists of stories being read. Similarly, Curiosity’s weight together
    with Martian pebbles first seriously affected the robot’s wheels, thus compromising
    the initial duration of the mission. A few years later later, several changes
    in the locomotion system slowed down this unexpected war. In another case, Israeli
    secret services were at first powerless against attacks that were not prepared'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Introduction


    within dismantle cell organizations. Yet these services soon were able to identify
    suspects and put them in jail without any kind of legal procedure. Finally, Nutella
    was first an old-fashioned chocolate spread whose recipe included orangutanendering
    and cancer-related palm oil. It then became, temporarily, a trendy pop product.
    For better or worse, collective configurations are rearranged, forming new states
    of affairs; relation-between humans and nonhumans are reconstituted, thus temporarily
    establishing new networks. According to this ontological position that is often
    called “process thought,”¹ the collective work is constantly reshaped in this
    way.²


    That being said, we may wish to comprehend some of the dynamics of these messy
    rearrangements (RTs). After all, as we have to coexist on the same planet, getting
    a clearer view of what is going could not hurt; documenting a tiny set of numerous
    relationships that shape the world we inhabit may equip us with some kind of navigational
    instrument. Together, where do we go? What are we doing? What is going on? These
    are important, legitimate questions.


    To address these questions, two approaches are generally used. Broadly speaking,
    the first approach consists in postulating the existence of aggregates capable
    of inducing states of affairs. Depending on academic traditions, such aggregates
    take different names: they are sometimes called “social forces,” “fields and habitus,”
    “economic rationality,” or “social structures,” among many other variations. These
    differently named yet a priori postulated aggregates are all pretenders to the
    definition of the social (or society), an influential evanescent matter that properly
    surrounds individuals and orates their actions. The scientific study of this matter
    and the states of affairs in it engenders what I call the science of the social,
    more succinctly, social science.


    The second approach—this one book embraces—consists in considering the social
    not as an evanescent matter surrounding individuals but as the small difference
    produced when two entities come into and temporarily associate with each other
    (Latour 2005).³ This approach assumes that every new connection between actants—humans
    (Bob, the president, Mark Zuckerberg) or nonhuman entities (a wheel, a virus,
    a document)—makes a small difference that can, sometimes, be accounted for. If
    we accept calling “social” the small difference produced when two agents temporarily'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    associate with each other, we may call “socio-logy” the activity that consists
    in producing specialized texts (logos) about these associations (socius). Our
    initial RTs are small examples of such an activity: Facebook, Curiosity, Israeli
    secret services, and Nutella temporarily associate themselves with new actants,
    and the blending of these new connections contributes to the formation of new
    configurations summarized within a text. I had several rearrangements and accounted
    for their constituents a bit more thoroughly, I would have produced a genuine
    sociological work. On the contrary, had I invoked hidden force to explain these
    reconfigurations; had attributed the modifications of each state to some prior
    postulated aggregate (e.g., economic rationality, society, culture), I would have
    produced a small world of social science. This distinction between sociology and
    social science will accompany us throughout this book. It is thus important to
    keep in mind that the present value is—or, at least, intended to be—a sociological
    work.


    With clarifications in mind, let us have a closer look on our four small sociological
    RTs. What do we see? We quickly notice that each RT is affected by an “algorithm,”
    for loosely defined as a computerized method of calculation. These four algorithms
    can be considered entities—or actants—as they all produce differences within specific
    configurations. In that sense, at some point, associate with. In RT1, there is
    Facebook, Donald Trump, supporters, News Feed, a new algorithm, a Facebook vice
    president, and many other actants that, together, rearrange some state of affairs.
    In RT2, there is NASA, sharp pebbles, a navigational algorithm, lithium-ion batteries,
    and many other actants that, together, rearrange some state of affairs. The same
    is true of RT3 and RT4: algorithms are among many other actants.


    Yet a closer look nonetheless suggests that the algorithms of our RTs possess
    characteristics that make them not akin to, say, Sharp pebbles or lithium-ions
    batteries. Contrary to such “firm” actants, the algorithms of our RTs appear more
    fluid; they seem to be able to move very quickly and make connections with other
    actants that were at remote from each other. In RT1, Facebook’s new algorithm
    can, in the end (and yet temporarily), associate itself with News Feeds of millions
    of users located all around the world almost instantaneously. In RT2, NASA’s algorithm
    can'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction


    reach Mars to make Curiosity''s wheels cope with, potentially, all sharp Martian
    pebbles. In RT3, the algorithm used by Israeli secret services can classify social
    media texts sent by hundreds of people located throughout a two-thousand square-mile
    territory. In RT4, Ogilvy & Mater''s algorithm can create uniquely designed patterns
    instructing Nutella''s packaging factories in Italy and France. It seems that
    these algorithms can circulate and link up initially sparse accents in a very
    short of time. This is a nontrivial characteristic. To underline these algorithms''
    fluidity (they circulate), swift (they are fast), and distributivity (they are
    simultaneously scattered and united), let us categorize them as devices, a special
    category of actant that, according to philosopher Gilles Deleuze, is "tangled,
    multi-linear ensembles [that] trace processes that are always at equilibrium,
    sometimes coming close to each other, sometimes getting distant from each other"
    (Deleuze 1989, 185).


    If we continue our RTs, swift, and distributed devices called notice that this
    fluid, swift contributes to modifying a network of relationships. In every RT,
    one algorithm—well supported by many other entities (researchers, data, testers,
    etc.)—participates in making Facebook subject to the spread of hoaxes (RT1), Curiosity''s
    wheels a bit more durable (RT2), Palestinians definitely more "jailable" (RT3),
    and Nutella temporarily salable (RT4). Along with all the entities they are associated
    with, these methods of calculation seem to participate in changing power dynamics:
    Facebook, Curiosity''s wheels, Israeli security services, and Nutella become temporarily
    stronger from Trump-spamming supporters, sharp Martian pebbles, West Bank potential
    "terrorists," and palm oil sandals, respectively.


    Scholars of Science and Technology Studies (STS)—a subfield of sociology and social
    science that aims to document the co-construction of science, technology, and
    the collective world—are nowadays prone to analyze algorithms'' propensity to
    modify power dynamics in, for example labor markets (Kushner 2013; Steiner 2012),
    surveillance strategies (Introna 2016; Introna and Wood 2002; Kraemer, van Overveld,
    and Peterson 2010), corporate finance (Lenglet 2011; Mackenzie 2014; Muniesa 2014a),
    cultural habits (Anderson 2011; Hallinan and Striphas 2014), or interpersonal
    relationships (Beer 2009; Bucher 2012). These scholars'' works are of the most
    importance as they rise and maintain wakefulness with regard to what'
