    these assertions can be further specified. Sociology, as a professional activity
    that consists in producing specialized texts (logos) about associations (socius),
    does not escape what I shall now call “Dorothy Smith’s law”: however descriptive
    it is, sociology brings into being—by means of inscriptions—partial realities
    to the detriment of other realities. What is true for administrators (DesRösières
    2010), economists (Mackenzie, Munisia, and Siu 2007), or scientists (Latour 1987)
    is also true for sociologists: while describing realities by means of texts, they
    also enact these realities.


    As Law and Urry (2004, 396) well summarized it, there is no innocence:¹⁵ a text,
    however faithful—and some texts are definitely more faithful than others—is also
    a wonderful accomplishment. I must then admit what I intend to do in this book
