  md: '# Mathematics as a Science 207


    and adheres to that of Headwood. However, Guthrie''s 1852 “candid” claim has not
    lost all of its conviction strength yet, which makes Kempe puzzled about the fate
    of Headwood. Scene 3 is quite straightforward: Shannon and Hartley''s claim—and
