    As some readers may have noticed, in order to account for this small programming
    sequence I used several notions that have been developed in the STS literature
    to describe a priori very different process: experimental practices in scientific
    laboratories. I now need to discuss this connection between laboratory practices
    and computer programming practices I have surreptiously drawn.


    For the last fifty years, many studies of scientific work have underlined the
    centrality of textual documents (Latour and Woolgar 1986), diagrams (Netz 2003),
    graphs (Dennis 1989; Gooday 1990), and notes (Lynch 1985; Garinkel 1981) that
    I gather here—following Latour (2013)—under the umbrella term “inscriptions.”
    Other important studies also showed the centrality of the instruments and experiments
    required to produce, confront, and articulate these inscriptions (Hacking 1983;
    Knorr-Cetina and Mulway 1983; Collins 1975; Dear 1987; Gooding, Pinch, and Schaffer
    1989). And other studies further emphasized the importance of the manipulation
    and circulation of these inscriptions (Latour 1987; Knorr-Cetina 1999) that, through
    comparison, confrontation, alignment—in short, articulation—sometimes end forming
    what Latour (1999a) calls “chains of reference”—more or less solidified paths
    that document, when everything is in place; the behavior of some remote entity
    (e.g., a planet, a virus, a particle). These important studies present certified
    knowledge as being produced and objective at the same time: thanks to scientific
    practices and scientific institutions that support the expression of these practices—knowledge
    is objective.


    As this short sequence seems to indicate, programming practices may sometimes—not
    always—semble some of the practices required for the construction of certified
    knowledge. Indeed, the production of inscriptions—via experiments and instruments—and
    comparison and alignment in order to produce more inscriptions well with what
    has been observed in scientific laboratories. Little by little, through the manipulations,
    comparisons, and alignments of inscriptions, some access is paved out that may
    allow the characterization of a phenomenon engaging a remote entity. In the case
    of computer programming, this remote entity'
