    research contract was signed on April 9, 1943. At this point, the construction
    of a computing system that could potentially solve large iterative equations at
    electronic speed and therefore accelerate the printing out of the firing tables
    required for long-distance weapons could begin. This project, initially called
    “Project PX,” took the name of ENIAC for Electronic Numerical Integrator and Computer.


