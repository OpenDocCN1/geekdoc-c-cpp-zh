    # Backstage Elements: Saliency Detection and Digital Image Processing


    “Saliency” for computer scientists in image processing is a blurry term with a
    history that is difficult to track. The term “saliency” was gradually created
    by straddling different—yet closely related—research areas. One point of departure
    was the 1970s when expressive models developed in cognitive psychology and neurobiology³
    started to scheize how the human brain could quickly handle an amount of data
    that is larger than its estimated processing capabilities (Eason, Harter, and
    White 1969); Lappin and Uttal 1976; Shifrin and Gardner 1972).⁴ After many disputes
    and controversies, a rough agreement about the overall process of humans “selective
    visual attention method” had properly emerged that distinguishes between two neuronal
    processes of selecting and gating visual information (Itti and Koch 2001; Heinke
    and Humphreys 2004).⁵ On the one hand, there is a task-independent and rapid “bottom-up
    visual attention process” that selects conspicuous stimulus such as color contrasts,
    orientations, or spatial frequency. On the other hand, there is a slower “top-down
    visual attention process” that selectively bases on tasks to accomplish. The term
    “saliency map” was proposed by Koch and Ullman (1985) to define the final result
    of the brain’s bottom-up visual attention process.


    In the 1980s, the way that cognitive psychologists and neurobiologists theorized
    two different “paths” for the brain to process light signals—one fast and generic,
    the other slower and task-specific—inspired scientists whose machines faced a
    similar problem in computer vision: the stream of sampled digital signals that
    emanated from CCDs were too large to be processed all once. From this point, two
    different classes of image-processing detection algorithms have progressively
    shaped. The first class was inspired by the assumed bottom-up schematic process
    of visual attention and to detect “low-level features” inscribed within the pixels
    of a given image, such as intensity, color, orientation, and texture.” Through
    the academic efforts of Laurent Itti and Christof Koch in the 2000s (Itti, Koch,
    and Niebur 1998; Itti, Koch and Braun 2000; Itti and Koch 2001; Elazary and Itti
    2008; Zhao and Koch 2011), the term “saliency” was progressively assimilated into
    this first class of algorithms that became saliency-detection algorithms. The
    second class of image-processing detection algorithms was inspired by the assumed
    top-down schematic process of visual attention and is based on “high-level features”
    that have to be learned by machines to'
