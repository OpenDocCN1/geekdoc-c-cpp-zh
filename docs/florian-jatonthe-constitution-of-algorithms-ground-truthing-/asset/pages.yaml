  md: '# A First Case Study


    With many such [natural] images, it is difficult to objectively evaluate the model,
    because no objective reference is available for comparison, and observers disagree
    on which locations are the most salient. (Itti, Koch, and Niebur 1998, 1258; italics
    added)


    Saliency detection in natural images is an equivocal topic not easily expressed
    in a ground truth. Whereas it is usually straightforward (and yet time consuming)
    to define universal targets for training and evaluating high-level face-detection
    or car-detection algorithms, it is far more complex to do so for saliency-detection
    because what is considered as salient in a natural image changes to from person
    to person. While in the 2000s saliency-detection algorithms might have been promising
    for many industrial applications, no one in the field of image processing had
    found a way to design a ground truth for natural images.


    In 2007, Liu al proposed an innovative solution to this and created the first
    ground truth for saliency detection in natural images. Their shift was smart,
    costly, and contributed greatly to framing and establishing the subfield of saliency
    detection in the image-processing literature. Liu al''s first move was to propose
    one possible scope of saliency detection by incorporating concepts from high-level
    detection. According to them, instead of trying to highlight salient areas within
    digital images, computational models for saliency should detect the most salient
    object within a given digital image. They framed the saliency problem as being
    binary and one-off object related. According to them, to get around the impasse
    of saliency detection, saliency-detection algorithms should distinguish one salient
    object from the rest of the image:


    We incorporate the high-level concept of salient object into the process of visual
    attention in each respective image. We call them salient objects, or foreground
    objects that we are familiar with. We formulate salient object detection as a
    binary labelling method that separates a salient object from the background. Like
    face detection, we detect a family object; unlike face detection, we detect a
    family yet unknown object in an image. (Liu al. 2007, 1–2)


    Thanks to this refinement of the concept of saliency (from "anything that first
    attracts attention") to “the one object in a picture that first attracts attention”),
    Liu et al. could organize an experiment in order to construct legitimate targets
    to be retrieved by computational models. They first randomly collected 130,099
    high-quality natural images from internet forums and search engines. Then they
