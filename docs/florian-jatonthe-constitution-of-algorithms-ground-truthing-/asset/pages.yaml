    # Formulating—Programming


    The point I want to make in this section is quite simple: if mathematical inscriptions
    describe computational models in academic papers cannot, of course, trigger electric
    pulses capable of making computers compute actual data, they nonetheless work,
    sometimes, as transposable scenarios for computer episodes.


    In chapter 4, we saw that computer programming practices imply the alignment of
    inscriptions to produce knowledge about a remote entity (e.g., a compiler, an
    interpreter, a microprocessor) that negatively affected in its trajectory. We
    also saw that programmers constantly need to enroll new agents to get past impasses.
    More importantly for the case that interests us here, we also found that both
    aligning and contouring actions needed to be “triggered” by special narratives
    that engage those who enunciate them. Building on Lucy Suchman and Bruno Latour,
    I decided to call these performative narratives “scenarios.”


    Scenarios are crucial as they provide the boundaries of programming episodes enabling
    them to unfold. Their irritating drawback is that while they constitute indispensable
    resources that set up programming horizons, often tell little about the actions
    required to reach these horizons. We experienced this when we were following DF
    in his small computer programming venture. Even though his scenario needed for
    the incrementation of an empty matrix with rectangles defined by coordinates stored
    in .txt files, the scenario said almost nothing about how to do this incrementation.
    The lines of code to be progressively assembled as this process was required to
    align inscriptions and to get around impasses.'
