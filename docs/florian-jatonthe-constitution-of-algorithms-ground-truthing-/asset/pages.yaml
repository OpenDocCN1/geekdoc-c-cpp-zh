  md: '# Introduction


    7


    computerized methods of calculation. Yet I must warn the reader right from the
    start: what algorithms do is not the main topic of this book.


    However, as soon as one takes seriously into consideration the banal fact that
    objects and devices wear down and change, that “they break, malfunction and have
    to be constantly mended, retrofitted and repurposed” (Domínguez Rubio 2016, 60),
    thorough sociological studies of all algorithms should be coupled with the studies
    of the maintenance and repair work required to keep doing what they do. Whereas
    maintenance and repair work is currently receiving the attention of an increasing
    number of studies (e.g., by la Bellacasa 2011; Domínguez Rubio 2014, 2016; Denis
    de León and Pholeros 2010; Strebel, Bovet, and Sormani 2019), few have specifically
    explored the work required to keep doing what they do (but Crooks 2019). It is
    a shame since the differences produce should be, at least in principle, proportional
    to the work required to make them continue to produce differences in constantly
    evolving situations. If we continue to draw upon our four initial RTs, we can
    for example imagine that to keep protecting users from spammers, Facebook''s new
    monitoring algorithm may need to be to detect unexpected forms of trolling (RT1).
    Similarly, if curiosity''s balance of weight happens to change—such as it loses
    a piece of equipment—the parameters of its driving algorithm will have to be modified
    (RT2). In a similar vein, due to the progressive accumulation of small differences
    in the computer equipment of Israeli secret services, software package allowing
    the new security algorithm to effectively compute social media data and generate
    profiles will have to be slightly updated (RT3). Finally, for its algorithm to
    keep on supporting effective marketing coups, Ogly & Materia will need to keep
    on convincing its clients that consumers are attached to singular products (RT4).
    In short, we can make the fair assumption that without constant efforts to make
    algorithms keep on fitting with constantly changing situations (and vice versa),
    these devices will not produce differences for very long. Although the necessary
    to preserve the agency of algorithms (Introna 2016) is surely more and more common
    in contemporary economies, it remains poorly documented. Unfortunately, I will
    not contribute to filling in this gap; despite the need for such studies to better
    understand the collective world we live in, this book does not deal with the maintenance
    of algorithms.'
  merge: -1
