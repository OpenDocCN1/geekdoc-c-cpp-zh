    # Chapter 6


    Again, however, something is still missing. Although the inquiry may sharpen the
    overall picture, it still fails to address a massive issue—an issue that may even
    be the most discussed algorithm-related topic at present among the press and academia:
    machine learning. Machine learning is an extremely sensitive topic, sometimes
    considered in itself (Alpaydin 2010), other times in relation to closely related,
    yet evolving, terms such as “big data” (Bhattacharyya et al. 2018) or “artificial
    intelligence” (Michalski, Carbonell, and Mitchell 2014); it is sometimes presented
    as well established (Finlay 2017) and at others, as still in its infancy (Domingos
    2015); it is sometimes praised for its performance (Jordan and Mitchell 2015),
    and others times criticized for the danger it (but what is it?) seems likely to
    represent to the collective world (Müller 2015). As soon as it is articulated,
