    results, the formalism of the First Draft serendipiously presented them as brain-like
    objects that could automatically transform inputs into outputs. And if these high-level
    insights were important to sum up the confidential work that had been undertaken
    at the Moore School during the war and share it with other laboratories, they
    also contributed to separating computing systems from the practices required to
    make them operate. The First Draft presented the architecture of a functioning
