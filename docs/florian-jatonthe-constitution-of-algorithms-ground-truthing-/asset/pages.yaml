  md: '# A Second Case Study


    185


    In planning to run a series of rapids in a canoe, one is very likely to sit for
    a while above the falls and plan one’s descent. The plan might go something like
    “I get as far over to the left as possible, try to make it around that next bunch.”
    A great deal of deliberation, discussion, simulation, and reconstruction may go
    into such a plan. But however detailed, the plan stops of the actual business
    of getting your canoe through the falls. When it comes down to the details of
    responding to currents and handling a canoe, you effectively abandon the plan
    and fall back on whatever embodied skills are available to you. The purpose of
    the plan in this case is not to get your canoe through the rapids, but rather
    to orient you in such a way that you can obtain the best possible position from
    which to use those embodied skills on, in the final analysis, your success depends.
    (Suchman 2007, 72)


    Plans do not determine actions. Rather, by suggesting future orientations, plans
    help express skills in appreciable conditions. Moreover, building on Suchman’s
    example, we can also assume that plans create something like another world, another
    layer of existence: by telling stories, plans express figures that could not exist
    without them. Before running the rapids, when I am expressing my plan above the
    fall, I *project* into another space (“into the rapids,” “as far over to the left
    as possible”), another time (“later”), and toward other human and nonhuman actants
    (“me, alive, at the end of the rapids, “the canoe, struggling to get around the
    next bunch,” “the powerful rapids I—hopefully—managed to run”). In this respect,
    by establishing a triple shifting out* (Latour 2013, 234-257) into other space
    and time, and toward other actants, plans are also *narratives* that help us engage
    into desirable processes.


    Yet this definition of plans as narratives establishing desirable horizons without
    specifying how to reach them is quite loose. In what sense are these narratives
    different from, say, bedtime stories for children or Hollywood mega-productions?
    What specific transformations do plans-narratives institute? How do we address
    the modifications they suggest? To better understand the specificity of these
    narratives—or, as I will call them, these *scenarios*—we shall consider the narrative
    DF constructed for the completion of PROG. One point of departure could be two
