  md: '# A Third Case Study


    As in part II when we were dealing with computer programming, the journey was
    long and full of zigzags. But we did not have any other choice: in order not to
    get lost in our further explorations of the role of mathematics in the formation
    of algorithms, we needed to understand where certified mathematical facts come
    from; how they solidify; and how, sometimes—very rarely—they become part of tacit
    necessary knowledge. Thanks to STS works rarely on mathematics as well as heterogeneous
    examples from nineteenth-century photograph theory, contemporary controversies
    in fuzzy logic, a well-accepted theorem in theoretical signal processing, and
    the laboratory practices that led to the shaping/discovery of quaternions, we
    progressively realized that mathematical objects—and the certified facts that
    describe them—need academic papers, trials, laboratories, instruments, and inscriptions
    to come into existence. Moreover, when nonmathematical disciplines, such as endocrinology
    or brain research, need to borrow the heuristic and ergonomic strength of certified
    mathematical objects to quantify bulky and wet entities (e.g., a new peptide,
    axons of dorsal hippocampus), a cascade of translations is required in order to
    make these entities compatible with the flat ecology of certified mathematical
    facts. Consequently, we saw that the indubitable power of mathematics should be
    understood in the light of the mundane practices that allow nonmathematical entities
    to become “mathematicable.” These mundane often ignored practices aiming to connect
    undefined entities to certified mathematical knowledge are what I call “formulating.”


    But how formulating practices express themselves within computer science laboratories?
    What is their role in the construction of algorithms? In light of the previous
    parts of this book, how does *formulating* articulate with *ground-truthing* and
    *programming* activities? This is what we are going to consider in this third
    case study.'
