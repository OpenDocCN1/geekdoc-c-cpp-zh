    In many cases, natural images only capture one or two objects distinguished from
    a clear background; pictures produced by users of digital cameras are generally
    more cluttered than those used to train and evaluate saliency-detection algorithms
    in the wake of Liu et al. (2007). Indeed, in November 2013, saliency detection
    was becoming a research area where algorithms were more and more efficient only
    on those—rare—natural images with clear and unaltered features. The Group also
    knew that this issue was intimately related to the then available ground truths
    for saliency detection that were all bound to Liu et al''s restricted initial
    definition of saliency that only fit simple images. From this point, as the Group
    wanted to propose a model that could detect a different and more subtle saliency,
    as wanted to propose a model that could calculate and detect multiple salient
    features (objects and faces) in more complex and realistic images, it had to construct
    a new ground truth that would gather complex images and their corresponding multiple
    salient features.


    The Group''s desire to redefine the terms of the saliency problem did not come
    ex nihilo. When Liu et al did their research on saliency in 2007, it was difficult
