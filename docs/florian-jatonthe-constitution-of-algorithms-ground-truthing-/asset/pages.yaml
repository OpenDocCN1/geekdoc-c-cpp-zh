    centroids within the given dataset; (2) compute the distances of every point of
    the dataset from all centroids; (3) assign every point of the dataset to its nearest
    centroid; (4) compute the center of gravity of every centroid-assigned group of
    points; (5) assign each centroid to the center of gravity of its group; (6) reiterate
    the operation until no centroid changes its assignment anymore.


