    Contrary to Cold War–oriented American research projects, postwar British projects
    had no important funding as most of the UK government''s money was being invested
    in the reconstruction of the devastated infrastructures. This forced British scientific
    managers to design smaller prototypes that could quickly show promising results.
    In June 1948, inspired by von Neumann''s architecture as presented in the First
    Draft, Max and Frederic Williams from the University of Manchester provided a
    first minimal proof of concept that the cathode-ray tube storage system could
    be used to store instructions and data for computation at electronic speed in
    a desired, yet fastidious, way. One year later, Maurice Wilkins from the University
    of Cambridge—who also obtained a version of the First Draft and participated in
    the Moore School Series in 1946—successfully led the construction of an electronic
    digital computer with a mercury line storage that he called the EDSAC for Electronic
    Delay Storage Automatic Calculator. Largely due to the programming efforts of
    Wilkes''s PhD student David Wheeler (Richards 2005), the EDSAC could load data
    on ribbon of paper and print the squares of the first one hundred positive integers.
    These two successful experiences participated in rendering electromechanical relays
    and differential analyzers obsolete in the emerging field of computer science
    research. More importantly for the present, these two successful experiments also
    participated in the diffusion of von Neumann''s functional definition of computing
    systems as input-output devices controlled by a central organ. As it ended up
    working, the model, and its encapsulated metaphors, were considered adequate.


    At the beginning of 1950s, when IBM started to redefine computers as data-processing
    systems for businesses and administrations, von Neumann''s definition of computing
    system further expanded. As cited in Haig, Priestley and Rope (2016, 240), an
    IBM paper written by Walker Thomas asserts, for example, “all stored-program digital
    computers have four basic elements: the memory or storage element, the arithmetic
    element, the control element, and the terminal equipment or input-output element”
    (Thomas 1953, 1245). More generally, the broader inclusion of computing systems
    within commercial arrangements (Callon 2017) participated in the dissemination
    of their functional definition. It seems indeed, to create new markets, intricate
    and very costly computing had better presented as devices that automatically transform
    inputs into outputs rather than artefacts requiring a whole infrastructure to
    operate adequately.'
