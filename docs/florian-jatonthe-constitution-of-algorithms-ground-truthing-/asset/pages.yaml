  md: '# A First Case Study


    saliency probability maps—became the material base on which the desired algorithm
    could be developed. By constructing this ground truth, Liu et al. defined the
    terms of a new problem whose solutions could be retrieved by means of calculating
    methods.


    The shift here was not trivial. Indeed, by organizing this survey, inviting people
    into their laboratory, welcoming them, explaining the topic to them, writing the
    appropriate computer programs to make them label the images, and gathering the
    results in a proper database in order to statistically process them, Liu et al.
    transformed their reduced conception of saliency detection into workable and unambiguous
    targets with numerical values. At the end of this laborious process, Liu et al.
    could randomly select two images from set α and one thousand from set β to construct
    a training set (Liu et al. 2007, 5–6) to analyze the shared features of their
    constructed-yet-sound-by-virtue-of-agreement targets. Once the adequate numerical
    features were extracted from the targets of the training set and implemented in
    machine-readable language, they used the four thousand remaining images from set
    β to statistically measure the performances of their algorithm. Further, and for
    the very first time, they could compare the detection performances of their algorithm
    with two competing algorithms that had already been proposed by other laboratories
    that could not have been evaluated on natural images before due to the lack of
    any “natural” targets related to saliency. Besides the actual completion of their
    saliency-detection algorithm, the great innovation of Liu et al. was to redefine
    the saliency problem so that it could allow performance evaluations (see figure
    2.4).


    By publishing their paper and also publicly providing their ground truth online,
    it is not an exaggeration to say that Liu et al. established a newly assessable
    research direction in image processing. A costly infrastructure had been put together,
    ready to support other competing algorithmic propositions with better performances
    than Liu et al’s ground truth and the definition of saliency it encapsulates.
    Their publication was more than a paper: it was a paper that allowed other papers
    to be published as long as they properly quote the seminal paper and accept the
    ground truth’s restricted—yet operational—definition of saliency.


    Another important paper for saliency detection—and therefore also for the Group’s
    project that we shall soon continue to follow—was published'
