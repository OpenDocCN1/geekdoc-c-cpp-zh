    half years, from November 2013 to March 2016. These were no passive moments: as
    required by the analytical genre of laboratory studies and also by the rules of
    the laboratory to which I was affiliated as full member, I had to participate
    in the life of the laboratory and thus become somewhat competent. Although the
    skills I acquired certainly did not make me become a computer scientist, they
    were nonetheless crucial for speaking adequately about issues that mattered to
    my colleagues. But participating and discussing were not enough: I also had to
    write down, collect, and compile what I did, saw, and discussed. Very concretly,
    this implied taking a lot of notes. Discussions, meetings, presentations, actions:
    everything I experienced had, ideally, to be written down, referenced in notebooks
    and computer documents to be later retrieved, compared, sampled, and analyzed.
    This full-time data collection implied one last move: after my stay within the
    computer science laboratory—during which I participated in projects, held discussions
    with colleagues, observed what they did, wrote as much as I could, and made presentations
    about my preliminary results (processes that have deeply transformed me and the
    sociology I do)—I return to my community of research to more thoroughly work on
    the collected materials and write an investigation report that, progressively,
    have become the present book.


    But these all-too-basic elements—that will be more thoroughly presented in chapter
    1—elude one important question: How to effectively account for, and thus write
    down and analyze, what computer scientists do as they try to shape new algorithms
    within their laboratory? How to experience, capture, and analyze their actions?


