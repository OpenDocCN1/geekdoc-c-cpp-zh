    2012). This reframing of human cognition as a local attempt to engage with the
    world is here crucial as it will—finally!—enable us to consider programming in
    the light of situated experiences.


    Broadly speaking, proponents of enactive cognition consider that agency drives
    cognition (Varela, Thompson, and Rosch 1991). Whereas cognitivism considers action
    as the output of the internal processing of symbolic representations about the
    “real world,” enactivism considers action as a relational co-constituent of the
    world (Thompson 2005). The shift in perspective is thus total: it is as if one
    were speaking two different languages. Whereas cognitivism deals with an ideal
    world that is being accessed indirectly via representations that, in turn, instruct
    agency, enactivism deals with a becoming environment of transformative actions
    (Di Paolo 2005). Whereas cognitivism considers cognition as computation, enactivism
    considers cognition as adaptive interactions with the environment whose properties
    are offered to and modified through the actions of the cognizer. For'
