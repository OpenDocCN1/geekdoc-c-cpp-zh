    of medieval Islam (Berggren 1986; Netz 2004)? From baroque mathematics of continuous
    change (Bardi 2007; Boyer 1959)? But if we use the adjective “baroque,” we already
    define the seventeenth century in quite an orientated way (Deleuze 1992). Shall
    we'
