  md: '# Introduction


    What is this book''s topic, then? We have quickly seen that, from a socio-logical
    standpoint, algorithms can be considered two kinds of entities: devices that *do*
    things and devices that *need* things in order to keep on doing what they do.
    Both views are, I believe, of great significance. Yet my work follows a different
    path. Instead of starting from algorithms as devices and studying their agency
    or need for maintenance, this book starts from unrelated entities (e.g., documents,
    people, desires) and tries to account for how they come into contact with form,
    in the end, devices we may call “algorithms.” In short, I am studying what is
    before algorithms become fluid, swift, and distributed devices. Of course, things
    are not so clear-cut; as we see, projections on both agency and maintenance requirements
    of future algorithms may impact their constructions. Moreover, already constructed
    algorithms participate in the formation of new algorithms. But still, it is important
    for the reader to understand that I will mainly invite the practical activities
    by which algorithms are progressively assembled in assignable locations rather
    than what they may suggest or require once they are assembled.


    # Negative Invisibilities


    Already at this point, a question may arise: Why is it important to account for
    the formation processes of algorithms? Why spending time and energy writing—and
    reading—about their constitution? Are there not other things to do than making
    the activities by which algorithms come into existence visible?


    Certainly. As Star and Strauss (1999) have suggested, some activities need to
    remain plainly invisible—that is, not accounted for—otherwise the results of these
    activities may lose some of their capacities. The circus is one example: making
    publicly the infrastructure and training practices required to design and master,
    say, a Cirque du Soleil trapeze may affect the act itself. Wonder, surprise, or
    enchantment would potentially countered by the down-to-earth and uncertain operations
    that enabled the act. Here, a sociological account would take the risk of spoiling
