  md: '# 3 Von Neumann’s Draft, Electronic Brains, and Cognition


    Many things have been written regarding computer programming—often, I believe,
    in problematic ways. To avoid getting lost in this abundant literature, it is
    important to start this chapter with an operational definition of computer programming
    on which I could work and eventually refine later. I shall then temporally define
    computer programming as the situated activity of inscribing lists of instructions
    that can be executed by computer processors to organize the movement of bits and
    to modify data in desired ways. This operational definition of computer programming
    puts aside other practices one one may sometimes describe as “programming,” such
    as “programming one’s wedding” or “programming the clock of one’s microwave.”


    If I place emphasis on the practical and situated aspect of computer programming
    in my operational definition, it is because important historical events have progressively
    set it aside. In this first section that draws on historical works on early computing
    projects, we will see that once computer systems started to be presented as input-output
    instruments controlled by a central unit—following the successful dissemination
    of the so-called von Neumann architecture—the entangled sociotechnical relationships
    required to make these objects operate in meaningful ways had begun to be placed
    in the background. If electronic computing systems were, in practice, intricate
    and highly problematic sociotechnical processes, von Neumann’s ideal made them
    appear as functional devices transforming inputs into outputs. The noninclusion
    of practices—hence their invisibilization—in the accounts of electronic computers
    further led to serious issues that suggested the first academic studies of computer
    programming in the 1950s.'
