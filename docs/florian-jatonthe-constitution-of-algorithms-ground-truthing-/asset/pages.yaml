    field of digital image processing. For example, as Edwards (2013) showed the case
    of climatology, the tedious collection, standardization, and compilation of weather
    data to produce accurate ground truths of the Earth’s climate is crucial for the
    parametrization and evaluation of General Circulation Models (GCMs).²20 Of course,
    just as in the field of image processing, the construction of ground and effective
