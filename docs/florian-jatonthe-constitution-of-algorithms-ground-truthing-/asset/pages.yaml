    were huge as it allowed the existence of all the infinite combinations of instructions.
    Yet, the serendipitious drawback was to consider these combinations as nonproblematic
    realities of potentialities instead of costly actualizations of heterogeneous
    processes. While making a universal machine do something in particular was, and,
    very different from formalizing a universal machine, both practices were progressively
    considered equivalent.¹16


