    manufacturers invested in the electronic computer market, many different assemblers
    were designed, creating important problems of compatibility: (almost) every computer
    organized the accumulator and registers slightly differently, a new assembler
    was required. The problem lay in the one-to-one relationship between an assembler
    and the hardware. Since an assembler had one instruction for one hardware operation,
    every modification of the operational organization of the hardware required a
    new assembler. Yet—and this was the crucial insight of Grace Hopper and John Backus
    from IBM (Campbell-Kelly, 2014, 167–88)—if, of a program with one-to-one relationship
    with the hardware, one could provide a more complex program that could transform
    lines of code into another program with somewhat equivalent-instructions, one
    may be able to stabilize programming languages since any substantial modification
    of the hardware could be integrated within the “transformer” program that lay
    in between the program’s code and the hardware. This is the fundamental advantage
    of compilers that take input a program written in so-called high-level computer
    language and outputs another program—often called “executable”—whose content can
    interact with specific hardware. In the late 1950s, their greater readability,
    a tremendous advantage of FORTRAN and COBOL over assembly language lay in their
    compilers while constant maintenance could compensate and “absorb” the frequent
    modifications of the hardware. For example, if two different computers both had
    a FORTRAN compiler—a crucial and costly condition—the same FORTRAN program could
    run on both computers despite their internal organizations.


