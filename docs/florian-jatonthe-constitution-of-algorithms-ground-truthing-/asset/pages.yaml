    Again, as Lynch demonstrated, no magic intervened; laboratory practices made the
    relationships between axons and dendrites become *mathematicable*. Standardized
    rats became dorsal hippocampus, tiny slices became enlarged photographs, and a
    montage of cardboard became one geometrical space whose occupancy evolved through
    time. If some mathematical facts—computation of surfaces progressively occupied
    by intact terminals—did help demonstrate the existence of a nonmathemat phenomenon
    (axon sprouting), this event necessitated a succession of translations in order
    to connect the wet and bulky ecology of the brain with the dry and flat ecology
    of mathematics.


    # Formulating: A Definition


    Mathematics does not apply to the world. A cascade of translations is required
    to connect nonmathematical entities with certified mathematical facts. But at
    this point of our operationalization exercise, one question remains: if the rats''
    dorsal hippocampus of the brain research laboratory we have just considered the
    rat pituitary culture of Guillemin''s laboratory both end being transformed in
    order to fit with the networks sustaining solidified mathematical objects (themselves
    formerly described by claims that progressively became certified facts and even,
    sometimes, single sentence statements part of tacit undisputed knowledge), do
    they lose properties on the road? After all, from a rich and complex region of
    the brain, the dorsal hippocampus becomes a tinkered montage of gridded photographs;
    from a rich and complex soup of cells, the rat pituitary culture becomes a simple
    graph. To make both entities mathematicable, they must endure important reductions.
    But is it worth? What justifies such flattening and drying?


    In these situations, the gains of these reductions are important because the properties
    of the mathematical objects as formerly defined by mathematicians within their
    flat laboratories are progressively “lent” to the pituitary cell culture and the
    dorsal hippocampus. First, both entities become *easier to handle*. After the
    translation process from a cell soup to a graph, Guillemin does not need the cell
    soup. He certainly conserves it for potential verifications, but whenever he needs
    to see or show the rat pituitary cell culture, he can now use the graph printed
    by the radioimmunoassay that expresses only the tiny part of the soup’s'
