    of actants at a certain time T. This configuration of actants at a time T is specific
    to each technical project and should be supported by a narrative that exposes
    the whys and wherefores of the project being considered. As this dimension expresses
    association among variables, it can be called the AND dimension. The configuration
    of actants in the AND dimension is separated into two branches: the “allies” whose
    configuration participates in the development of the project and the “opponents”
    whose configuration constitutes an obstacle to the completion of the project.
    Again, which actant counts as an ally or an opponent to the development the STG
    is only summarizing (Latour, Mauguin, and Teil 1992, 39). The boundary that separates
    allies'' configuration of actants and opponents'' configuration constitutes the
    “frontline” of the technical project at time T.


