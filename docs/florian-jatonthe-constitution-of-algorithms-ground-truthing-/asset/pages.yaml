    Mental representations of things need to have at least two properties. They first
    need a form on which the mind could operate. This form may vary according to different
    theories about cognitionism. For the computational metaphor of the mind, this
    form takes, for example, the shape of electric nervous pulses that the senses
    acquire and are then routed to the brain. The second property that mental representations
    of things requires is meaning; the distinctive trace of what representations refer
    to in the real world. Both properties depend on each other: a form has a meaning,
    and a meaning needs a form. The notion of symbol is often used to gather both
    the half-material and semantic aspects of the mental representations of things.
    In this respect, cognition, as considered by the proponents of the classical sandwich
    processes symbolic representations of things that the senses offer in their interactions
    with the real world. The result of this processing is, then, another representation
