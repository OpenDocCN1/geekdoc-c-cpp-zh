    going to occur with the program are going to need to correspond with the value
    correctly so that the code is run the way that it should be. The break keyword
    is going to be used whenever there is a new case that has been added to the statement.


    Default values are going to be used but they do not have to be used by me. I can
    add any value that I want to for the statement to be evaluated in my switch statement.


    Example


    Public static void main(String [ ] args) {


    Int user = 87;


    Switch ( user ) {


    Case 45:


    System. out. printIn(“ the price is 45 dollars”) ;


    Break ;


    Case 65:


    System. out. printIn (“ the price is 65 dollars”) ;


    Break ;


    Case 88: 


    System. out. printIn (“ the price is 88 dollars”) ;


    Break ;


    Default:


    System. out. printIn (“ the price is 45, 65, and 88 dollars”) ;


    }


    }


