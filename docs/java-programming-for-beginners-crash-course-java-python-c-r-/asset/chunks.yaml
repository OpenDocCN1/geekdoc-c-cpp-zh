  trans: "\n\n`Scanner` 类的目的是从用户处获取信息，同时来自用户的输入将被赋值给其所属的变量。\n\n## 选项\n\n当我尝试从程序用户处获取所需信息时，使用\
    \ `JOptionPane` 函数可以获得一个选项列表。该类将出现在屏幕上，允许用户在显示他们输入的内容之前输入适当的响应。\n\n### 示例\n\n\
    ```java\nimport javax.swing.JOptionPane;\n```\n\n这次我必须告诉 Java 我想在 `swing` 目录中使用哪个类。因为我不想改变已经写好的代码，所以我直接为这个方法创建了一个新项目。当我把代码放入时，我注意到\
    \ `javax.swing.JOptionPane` 带有下划线，就像错误一样。但这不是错误，它将把数据重定向到需要存储的变量下。\n\n### 示例\n\
    \n```java\nString your_age;\nyour_age = JOptionPane.showInputDialog(\"Your age\"\
    );\n```\n\n`JOptionPane` 允许我输入一个句号，这样我的选项列表就会出现。在这个列表中，我将通过双击 `showInputDialog`\
    \ 来选择它。这会在我的代码中放置括号，括号内将放置我想显示给用户的消息。我还需要在这里使用双引号。\n\n### 示例\n\n```java\nString\
    \ your_age;\nyour_age = JOptionPane.showInputDialog(\"your age\");\nString birthday\
    \ birthday;\nbirthday = \"You were born on\" + month + day;\nJOptionPane.showMessageDialog(null,\
    \ birthday);\n```\n\n这是我希望我的对话框再次出现的地方，并带有所有供我使用的选项。括号中放入了 `null`，以便 Java 知道这个框与我刚刚创建的程序无关。标点符号将显示在最终产品的文本中，就像我在\
    \ Java 中输入的那样。\n\n在我代码的末尾，会有一些我没有放进去的新代码。这些代码旨在告诉程序何时应该退出系统，因为它已经执行到了最后。即使这样做，存储在\
    \ Java 内存中的值和变量也将被存储，以供下一次使用程序使用。\n\n每当我的代码正确执行时，就会弹出一些框，向用户索取不同的数据，例如他们的姓名或年龄。当用户点击“确定”按钮后，输入将显示为用户在框中输入的内容。这将导致程序退出系统，因为所有需要完成的工作已经完成。\n\
    \n## 第章：控制 Java 的运行\n\n之前使用 Java 编写的所有代码都是所谓的顺序编程。在这种情况下，输入代码，程序从上到下读取它，不会跳过我输入的任何行。但，并不是所有的\
    \ Java 程序都是这样运行的。\n\n有些脚本只在设置的条件满足时运行一次。例如，可能我不想让任何来自特定州的人进入我的网站，因此如果发现该条件为真，则程序将运行；但如果用户来自该州，程序将终止。这样做将通过条件逻辑来控制\
    \ Java 的运行。\n\n最常见的条件语句是 `if` 语句。\n\n### If\n\n使用 `if` 语句，每当条件被调用时代码就会执行，而不是等待用户做某些事。`if`\
    \ 语句将是一个简单的脚本。\n\n```java\nif (expression) {\n\n}\n```\n\n使用之前的例子，如果用户来自纽约，那么我不希望他们进入我的网站。我没有输入实现此功能所需的全部代码，而是将缩短脚本，以便我和其他程序员更容易阅读。\n\
    \n### 示例\n\n```java\nif(client < New York) {\n    // This site is restricted\n\
    }\n```\n\n所以，如果我的用户不是来自纽约，在程序执行时，Java 将跳过两组括号。但是，放在它们之间的任何代码都将被执行，但在在此之前必须满足我设置的条件。\n\
    \n我学到的另一个简写技巧是，大于符号将由一个指向右侧的三角形表示。\n\n### 示例\n\n```java\nif(client > New York)\
    \ {\n    //Message for the user\n}\n```\n\n对于那些不在纽约的人来说，代码也是相同的。\n\n### If/else\n\
    \n当 `if` 语句不再足够时，我将使用 `if else` 语句。\n\n```java\nif(what I want to be completed\
    \ before the program runs) {\n\n}\nelse {\n\n}\n```\n\n这段代码的第一行将以 `if` 语句开头，后面跟着我设置的参数。括号将划分我的代码，以便代码根据我的参数执行。第二部分将位于\
    \ `else` 语句之后。所以如果这种情况没有发生，那么就会发生。\n\n使用 `if else` 语句与 `if` 语句一样，只是它有第二个表达式落在新一组括号之间。如果第一个条件不满足，代码将将被分段并通过第二个表达式运行，以检查它是否满足该条件。如果我漏掉了其中一个括号，我将收到错误代码。\n\
    \n```java\nif(expression_one) {\n\n}\nelse if (expression_two) {\n\n}\nelse {\n\
    \n}\n```\n\n在 `if else` 内部可以设置的条件如下：\n- 大于 (`>`)\n- 小于 (`<`)\n- 大于等于 (`>=`)\n\
    - 小于等于 (`<=`)\n- 与 (`&&`)\n- 或 (`||`)\n- 等于 (`==`)\n- 非 (`!`)\n\n在与（AND）条件下，将同时测试多个条件。\n\
    \n### 示例\n\n```java\nelse (user > 45 && user < 55)\n```\n\n### 嵌套的 If\n\n当我将一个表达式放在另一个内部时，我正在嵌套这两个表达式。这可以通过任何\
    \ `if` 表达式完成。\n\n### 示例\n\n```java\nif(client < 55) {\n    system.out.println(\"\
    55 or less\");\n}\n```\n\n为了检查客户是否大于 45 岁，我将在第一个内部放置另一个。\n\n### 示例\n\n```java\n\
    if(client < 45) {\n    if(client > 48 && client < 45) {\n        System.out.println(\"\
    You are 46 or 47\");\n    }\n    else {\n        System.out.println(\"45 or younger\"\
    );\n    }\n}\n```\n\n## 布尔\n\n布尔（Booleans）只允许真或假值。如果它们其他任何值，它们就不是真正的布尔值。在处理布尔值时，不需要使用\
    \ `int`、`string` 或任何其他关键字。相反，我只需输入小写 b 的 `boolean` 以确保其后的任何内容都是布尔值。但我必须确保值是真或假。我将使用两个等号来评估我的表达式的值。\n\
    \n### 示例\n\n```java\nboolean client = true;\nif (user == true) {\n    System.out.println(\"\
    the expression contains the truth\");\n}\nelse {\n    System.out.println(\"this\
    \ expression is false\");\n}\n```\n\n`if` 语句将检查输入的变量，以查看它们是否构成了真布尔语句。如果用户输入已经是真的，则将检查它是否为假。不需要说明该值不是假的，因为很容易看出该值实际上是真的，反之亦然。\n\
    \n当我创建布尔值时，也会使用非（NOT）运算符。\n\n### 示例\n\n```java\nboolean client = true;\nif(!user)\
    \ {\n    System.out.println(\"there is no truth\");\n}\nelse {\n    System.out.println(\"\
    this is the truth\");\n}\n```\n"
- fmt: "\nThe only difference in the NOT Boolean statements is the `(!user)` function.\
    \ The operator is going to be placed before the variable with the use of an exclamation\
    \ mark. As always, the variable is going to be tested to see if it is negative.\n\
    \nBeing that the user variables are usually set to true, they are then tested\
    \ to see if there are any false values in them. It is exactly the opposite if\
    \ the value is set to false.\n\n# Chapter seven: Switches and Loops\n\nAs I am\
    \ working on my script, I am going to use `switch` statements so that I have a\
    \ wider range of options for the values that I am going to set for my variables\
    \ that I use. In essence, these are really long and somewhat complicated `else\
    \ if` statements.\n\nThis is how a `switch` statement is going to look:\n\n```java\n\
    Switch ( variable_to_test_ {\n    Case value:\n    Code_here;\n    Break;\n  \
    \  Case value:\n    Code_here;\n    Break;\n    Default:\n    Values_not_caught_above;\n\
    }\n```\n\nThe keyword used for switch statements is going to be `switch` which\
    \ will then have a set of parentheses following it. The variables that I want\
    \ to check will need to go in the middle of the brackets that I have placed in\
    \ my `switch` statement. Not only will the variables be placed between the brackets,\
    \ but so will other parts of the statements. The `case` keywords are going to\
    \ review all the powers that have to be reviewed by the program.\n\n`Case` values\
    \ are going to use colons instead of semicolons. The events that are going to\
    \ occur with the program are going to need to correspond with the value correctly\
    \ so that the code is run the way that it should. The `break` keyword is going\
    \ to be used whenever there is a new `case` that has been added to the statement.\n\
    \n`Default` values are going to be used but they do not have to be used by me.\
    \ I can add any value that I want to for the statement to be evaluated in my `switch`\
    \ statement.\n\n### Example\n\n```java\nPublic static void main(String [ ] args)\
    \ {\nInt user = 87;\nSwitch ( user ) {\n    Case 45:\n    System. out. printIn(“\
    \ the price is 45 dollars”) ;\n    Break ;\n    Case 65:\n    System. out. printIn\
    \ (“ the price is 65 dollars”) ;\n    Break ;\n    Case 88: \n    System. out.\
    \ printIn (“ the price is 88 dollars”) ;\n    Break ;\n    Default:\n    System.\
    \ out. printIn (“ the price is 45, 65, and 88 dollars”) ;\n}\n}\n```\n\nThe `switch`\
    \ statement code is going to need to test the integers that are being entered\
    \ by the user. The `value` has been set to `87` in this example which tells the\
    \ program to check everything that is inside of it. Each `case` will be checked\
    \ individually to see if there is one that matches the value that was set by me.\
    \ After the `case` that matches has been found, the code will stop and the program\
    \ will be terminated.\n\nThe values that are out of range cannot be tested even\
    \ though they have been placed in the `case`.\n\n### Example\n\n```java\nCase\
    \ ( user >= 55 ) ;\n```\nThis `case` cannot be used and will result in an error\
    \ from Java.\n\nBut, I can use a `case` such as this:\n`Case 5: Case 6: Case 7:\
    \ etc.`\nEach value that is used will need to be spelled out and checked.\n\n\
    ## Loops\n\nThe flow in Java is sequential and moves down the page just like a\
    \ book is written. But, there are functions that can be used so that the flow\
    \ is changed to something different. In order to interrupt the flow that Java\
    \ naturally uses, I am going to create a loop. With a loop, the program is going\
    \ to continuously run the lines of script until it is told to stop.\n\n### Example\n\
