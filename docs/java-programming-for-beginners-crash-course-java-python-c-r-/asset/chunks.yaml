  raw: 'I cannot tell the exact values in an array but I can use the ArrayList so
    that I can look at the structure of the data. The items on my list can be added
    or deleted. But, a normal array is going to have data that does not move because
    I am not going to have the ability to change the arrays size for what I have made.


    When I set up an array list, I am going to have to pull data from the directories
    in Java.


    Syntax:


    import java.util.ArrayList;


    After I have brought in the data that is needed to make a new object, I am going
    to use a different syntax.


    ArrayList listTest = new ArrayList( );


    I am not going to use brackets when I create lists for my array.


    Example


    listTest.add( "and" );


    listTest.add( "for” );


    listTest.add( “but " );


    listTest.add( 8 );


    Anything that is in the parentheses is going to be placed on my list for my array.
    I am going to be able to add any object that I want with this method. The first
    three items that fall on my list are going to be objects that are normally added
    to a string. The last amount is going to be an integer.


    All of the items that are on my list can be found by their index values.


    Example


    listTest.get(5); 


    The number five tells me exactly where I am going to need to go to find what I
    am looking for. Index values are always going to start at zero just like other
    things that are used in Java. With this in mind, for the above example, I am going
    to look at position six.


    When I want to delete objects, I am going to use a different syntax.


    Example


    listTest.remove(5);


    I can also delete the string values on my array.


    listTest.remove(“but”);


    In removing items, the list is going to then resize itself. Because of this, I
    have to be very careful in deleting objects or else my lists index numbers are
    going to be changed dramatically and I am not going to know where anything is
    on my list. So, if I remove the second item on my list, then the next three items
    will be moved up on my list after it has been deleted.


    Conclusion


    Thank for making it through to the end of Java, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    it may be.


    The next step is to download NetBeans and start creating your own Java programs
    with the information that I have provided for you. Some of it may seem confusing,
    but it is going to get easier the more that you practice it.


    If you found any piece of this book confusing, go back and read it again. As I
    stated in the introduction, programming is not easy and it is not going to come
    to you overnight.


    Do not stop learning Java just because one of the codes that you use does not
    work. If you do that, then you are never going to learn where you messed up. Instead,
    take that mistake and learn from it so that you do not have to repeat those same
    mistakes.


    Finally, if you found this book useful in anyway, a review on Amazon is always
    appreciated! 


    Good luck!


