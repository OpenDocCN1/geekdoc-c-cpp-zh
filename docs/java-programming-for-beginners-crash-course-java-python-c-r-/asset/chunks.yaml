  trans: "\n\n在我正式选择好将使用的数据类型后，普通整数将放在括号中。括号让 `Java` 知道正在使用的是数组而不是任何其他数据类型。数组使用 `aryNums`\
    \ 函数来确保数组能够被正确设置。之后，可以放置任何我想要放入数组的变量。\n\n一旦我为数组设置了一个新对象，Java 就会知道我为数组留了多少个空间。\n\
    \n### 示例\n```java\naryNums = new int [ 55 ];\n```\n这告诉 Java 在此数组将使用 55 个空间来存储整数。它们的范围从\
    \ 0 到 55。\n\n当我给这些位置赋值时，我将使用我之前用过的普通方法。\n\n```java\naryNum [ 8 ] = 32 ;\n```\n\
    \n数值 32 将被分配到数组中索引为 8 的空间。\n我必须记住，数组必须从 0 开始。\n\n### 示例\n这样设置我的数组将让我处理起来更加方便。\n\
    \n```java\nInt [ ] aryNims = { 8, 5, 6, 2 } ;\n```\n这种方法在括号内创建了我的数组，第一个值被放在了 0\
    \ 位。关键字后面的方括号将确保数据类型不会在其他地方重复。当我想要使用 `new` 关键字时，这种方法也适用于字符串值和字符值。\n\n### 示例\n\
    ```java\nString [ ] aryStrings = { “ Vampires, Werewolves, Hybrids, Witches” }\
    \ ;\n```\n这在 Java 中可以运行。\n\n```java\nBoolean [ ] aryBools = { yes, no, no, yes\
    \ } ;\n```\n这是不行的。如果我想使用 `Boolean` 值，我必须完全使用 `new` 关键字。\n\n### 示例\n```java\nBoolean\
    \ [ ] aryBools = new Boolean [ ] { yes, no, no, yes } ;\n```\n\n### 数组循环\n数组的循环有特殊的规则。数组中的值将使用数组语法进行赋值。这对我来说似乎不太理解，但这就是值赋值的方式。\n\
    \n### 示例\n```java\npackage prjarrays ;\n\npublic class ArrayTest {\n    public\
    \ static void main (String [ ] args) {\n        Int [ ] ticket _ prices = new\
    \ int [ 65 ] ;\n        Int I ;\n        For ( I = 0; I < ticket_prices . length\
    \ ; i++) {\n            Ticket_prices [ I ] = I +1;\n            System. out.\
    \ printIn ( ticket_prices [ 6 ] ;\n        }\n    }\n}\n```\n上面的数组将包含 65 个整数。循环将一直持续到达到这个数字，`I`\
    \ 将是一个小于数组大小的值。为了给我想要所在的位置分配值，我将使用不同的代码。\n\n### 示例\n```java\nTicket_prices [ I\
    \ ] = I + 1 ;\n```\n当值被放在括号之间时，我使用的值并不是硬编码的，相反，每循环一次每个变量就会增加一位。数组也会随着循环的值而增加。这个值得益于输入的脚本的最后部分。循环将始终从\
    \ 0 开始，在这个示例中一直到数字 65。\n\n脚本的下一部分将是数组中位置的值。如果我想手动写出所有的代码，由于数组中包含的数量，代码最终会变得混乱无章。\n\
    \n### 排序\n我创建的数组可以使用排序方法进行排序。但是，我必须将我要排序的内容引用到 Java 的目录。这将使用 `import` 语句。\n\n\
    ```java\nimport java. util. Arrays ;\n```\n\n### 示例\n```java\npackage prjarrays;\n\
    \nimport java .util. Arrays ;\n\npublic class ArraysTest {\n    public static\
    \ void main ( String [ ] args) {\n        Int [ ] aryNums;\n        aryNums =\
    \ new int [ 9 ] ;\n        aryNums [ 0 ] = 65 ;\n        aryNums [ 1 ] = 54;\n\
    \        aryNums [ 2 ] = 689 ;\n        aryNums [ 3 ] = 654;\n        aryNums\
    \ [ 4 ] = 6543 ;\n        aryNums [ 5 ] = 55 ;\n        // 数组的库将与排序方法一起导入。\n \
    \       Arrays . sort( aryNums ) ;\n    }\n}\n```\n在导入中第一个出现的关键字是 `array`，之后我将插入一个点。那个点将打开一个框，给我列出我可以对该数组进行的所有操作列表。`sort`\
    \ 单词将显示数组名称的位置，然后括号将落在其后。\n\n### 示例\n```java\npackage prjarrays;\n\nimport java\
    \ .util. Arrays ;\n\npublic class ArraysTest {\n    public static void main (\
    \ String [ ] args) {\n        Int [ ] aryNums;\n        aryNums = new int [ 9\
    \ ] ;\n        aryNums [ 0 ] = 202 ;\n        aryNums [ 1 ] = 1696 ;\n       \
    \ aryNums [ 2 ] = 385 ;\n        aryNums [ 3 ] = 2956 ;\n        aryNums [ 4 ]\
    \ = 4554 ;\n        aryNums [ 5 ] = 126 ;\n        Arrays . sort (aryNums) ;\n\
    \        Int I;\n        For ( I = 0 ; I < aryNums . length ; i++) {\n       \
    \     System. out. printIn (“num: “ + aryNums [ I ] ) ;\n        }\n    }\n}\n\
    ```\n当我编写自己的排序代码时，排序将按降序排列条项。我还可以将数组转换为用于整数的对象，这些对象也从一个目录中导入了。\n\n### 示例\n```java\n\
    package prjarrays;\n\nimport java .util. Arrays ;\nimport java.util. collections\
    \ ;\n\npublic class SortDescending {\n    public class ArraysTest {\n        public\
    \ static void main ( String [ ] args) {\n            Int [ ] aryNums;\n      \
    \      aryNums = new int [ 9 ] ;\n            aryNums [ 0 ] = 65 ;\n         \
    \   aryNums [ 1 ] = 54 ;\n            aryNums [ 2 ] = 689 ;\n            aryNums\
    \ [ 3 ] = 654;\n            aryNums [ 4 ] = 6543 ;\n            aryNums [ 5 ]\
    \ = 55 ;\n            Arrays . sort( aryNums ) ;\n            Int I;\n       \
    \     For ( I = 0 ; I < aryNums . length ; i++) {\n                System. out.\
    \ printIn (“num: ” + aryNums [ I ] ) ;\n            }\n        }\n    }\n}\n```\n\
    \n### 字符串\n字符串也可以放在数组中。\n\n### 示例\n```java\nString [ ] aryString= new String [\
    \ 5 ]\naryString [ 0 ] = “I” ;\naryString [ 1 ] = “am” ;\naryString [ 2 ] = “using”\
    \ ;\naryString [ 3 ] = “java” ;\naryString [ 4 ] = “yay” ;\n```\n在这个示例中，位置被填充了。\n\
    \n### 语法\n```java\nInt I;\nFor ( I = 0 ; I < aryString . length ; i++) {\n   \
    \ System. out. printIn ( aryString [ I ] ) ;\n}\n```\n循环将持续到达到某个值。`Arrays` 也可以排序。\n\
    \n### 示例\n```java\npackage strings;\n\nimport java. util. Arrays ;\n\npublic class\
    \ StringArrays {\n    public static void main (String [ ] args) {\n        String\
    \ [ ] aryString= new String [ 5 ] ;\n        aryString [ 0 ] = “I” ;\n       \
    \ aryString [ 1 ] = “have” ;\n        aryString [ 2 ] = “made” ;\n        aryString\
    \ [ 3 ] = “an” ;\n        aryString [ 4 ] = “array” ;\n        Arrays.sort(aryString);\n\
    \    }\n}\n```\n`Arrays` 用于对字符串进行字母顺序排序。\n\n### 多维数组\n我创建的数组可以放入多个列，称为多维数组。\n\n\
    ### 语法\n```java\nInt [ ] [ ] aryAmounts = new int [ 8 ] [ 33 ];\n```\n数组语法很正常，但现在有两个括号，让\
    \ Java 知道有多少行以及将创建多少列。\n\n### 示例\n```java\naryAmounts[0][0] = 106;\naryAmounts[0][1]\
    \ = 124;\naryAmounts[0][2] = 433;\naryAmounts[0][3] = 11554;\naryAmounts[0][4]\
    \ = 262;\naryAmounts[1][0] = 2560;\naryAmounts[1][1] = 43255;\naryAmounts[1][2]\
    \ = 560;\naryAmounts[1][3] = 133;\naryAmounts[1][4] = 3385;\n```\n\n"
- fmt: "\nI cannot tell the exact values in an array but I can use the `ArrayList`\
    \ so that I can look at the structure of the data. The items on my list can be\
    \ added or deleted. But, a normal array is going to have data that does not move\
    \ because I am not going to have the ability to change the arrays size for what\
    \ I have made.\n\nWhen I set up an array list, I am going to have to pull data\
    \ from the directories in Java.\n\n### Syntax\n\n```java\nimport java.util.ArrayList;\n\
    ```\n\nAfter I have brought in the data that is needed to make a new object, I\
    \ am going to use a different syntax.\n\n```java\nArrayList listTest = new ArrayList(\
    \ );\n```\n\nI am not going to use brackets when I create lists for my array.\n\
    \n### Example\n\n```java\nlistTest.add( \"and\" );\nlistTest.add( \"for” );\n\
    listTest.add( “but \" );\nlistTest.add( 8 );\n```\n\nAnything that is in the parentheses\
    \ is going to be placed on my list for my array. I am going to be able to add\
    \ any object that I want with this method. The first three items that fall on\
    \ my list are going to be objects that are normally added to a string. The last\
    \ amount is going to be an integer.\n\nAll of the items that are on my list can\
    \ be found by their index values.\n\n### Example\n\n```java\nlistTest.get(5);\
    \ \n```\n\nThe number five tells me exactly where I am going to go to find what\
    \ I am looking for. Index values are always going to start at zero just like other\
    \ things that are used in Java. With this this mind, for the above example, I\
    \ am going to look at position six.\n\nWhen I want to delete objects, I am going\
    \ to use a different syntax.\n\n### Example\n\n```java\nlistTest.remove(5);\n\
    ```\n\nI can also delete the string values on my array.\n\n```java\nlistTest.remove(“but”);\n\
    ```\n\nIn removing items, the list is going to then resize itself. Because of\
    \ this, I have to be very careful in deleting objects or else my lists index numbers\
    \ are going to be changed dramatically and I am not going to know where anything\
    \ is on my list. So, if I remove the second item on my list, then the next three\
    \ items will be moved up on my list after it has been deleted.\n\n### Conclusion\n\
