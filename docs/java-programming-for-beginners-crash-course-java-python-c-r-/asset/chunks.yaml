    \ > 48 && client < 45) {\n        System.out.println(\"You are 46 or 47\");\n\
    \    }\n    else {\n        System.out.println(\"45 or younger\");\n    }\n}\n\
    ```\n\n## Boolean\n\nBooleans are only allowed to be true or false values. If\
    \ they are anything else then they are not true Booleans. The keywords `int`,\
    \ `string`, or any other keyword does not need to be used when doing Booleans.\
    \ Instead, I am going to simply type `boolean` with a lowercased b to ensure that\
    \ anything after it is a Boolean. But, I have to ensure that the values are true\
    \ or false. I will use two equals signs to evaluate the values of my expression.\n\
    \n### Example\n\n```java\nboolean client = true;\nif (user == true) {\n    System.out.println(\"\
    the expression contains the truth\");\n}\nelse {\n    System.out.println(\"this\
    \ expression is false\");\n}\n```\n\n`if` statements are going to check variables\
    \ entered to see if they make true Boolean statements. In the event that what\
    \ the user entered is already true, then it is going to be checked to see if it\
