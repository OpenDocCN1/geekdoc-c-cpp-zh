  trans: "\n\n![](img/cover.jpeg)\n\n# Martin Laredo\n## 初学者 Java 编程：快速教程\n\n## 目录\n\
    - 介绍\n- 第一章：什么是 Java\n- 第二章：NetBeans 程序\n- 第三章：操作 Java 数据\n- 第四章：数学及更多\n- 第五章：输入及以后\n\
    - 第六章：控制 Java 的运行方式\n- 第七章：分支与循环\n- 第八章：数组\n- 结论\n\n# 介绍\n\n> “我想读的一本书。” — [Matz](http://twitter.com/yukihiro_matz/status/3875573878)，Ruby\
    \ 语言创造者\n> “我真的喜欢这本书。” — [Jeremy Ashkenas](http://coffeescript.org/)，CoffeeScript\
    \ 创造者\n> 想创建一个编程语言，但又不想读那些昂贵又无聊的[1000 页书籍](http://amzn.com/0321486811)？很好，你并不孤单……\n\
    \n[点击此处获取！](http://1071173znfarcld6m3q4q25z32.hop.clickbank.net/)\n\n恭喜你下载了 Java，感谢你的支持。\n\
    \n接下来的章节将讨论 Java 如何工作，以及需要哪些知识，以便让你在使用 Java 时获得最佳体验。\n\n编程并非易事，需要花费大量的时间耐心。如果第一次尝试没有成功，请不要灰心，最终会成功的。\n\
    \n我想告诉的是，Java 将以你可能无法意识到的方式让你获益。Java 可以帮助你找到新工作，甚至让你在目前的职位上晋升，因此学习 Java 对你的职业和个人层面都是好处好处。\n\
    \n市场上有许多关于这个主题的书，再次感谢你选择这一本！我们已尽最大努力确保它包含了尽可能多的有用信息，请尽情享受！\n\n# 第一章：什么是 Java\n\
    \n我发现学习 Java 最难的部分是在编写我想要编写的代码之前需要安装哪些内容。如果我没有安装所有的程序，那么我就是在给自己找麻烦，因为我将无法正常运行该程序。\n\
    \n## 虚拟机 (VM)\n\nJava 拥有一个可以独立运行的平台，不需要任何其他程序的辅助。因此，它可以在我想要使用的任何操作系统上运行。这得益于 Java\
    \ 创造者制作的虚拟机。\n\n虚拟机将有助于确保我的代码被正确处理。不仅如此，在没有安装虚拟机的情况下，Java 代码无法运行。\n\nOracle 是创建\
    \ Java 的公司，在他们的网站上，提供了任何与 Java 相关的程序下载链接，例如 Java 虚拟机或其他称为 Java 运行环境（JRE）。\n\n\
    我首先需要检查我的电脑是否已经安装了 Java 运行环境，因为很多电脑都预装了 Java。为了做到这一点，我将访问 Oracle 网站并点击写有“我有 Java\
    \ 吗？”的框。点击此链接将扫描我的电脑并告诉我是否安装了 Java。\n\n如果我还没有，我就可以下载并将其安装到电脑上，以便我编写想要编写的代码。\n\n\
    ## 软件开发\n\n安装 Java 后，它将像任何其他程序一样在我的电脑上运行。然而，在编写代码之前，我必须下载开发工具包（SDK）。\n\n该工具包将是标准版，并将下载\
    \ NetBeans 程序。虽然由于文件较大，下载需要很长时间，但一旦下载完成，就可以在程序中编写代码以创建我自己的 Java 程序。\n\n## Java\
    \ 的工作原理\n\n当我编写 Java 代码时，我将使用文本编辑器。我的代码被称为源代码，当我保存工作时，将以 `.java` 扩展名保存。\n\n保存文件的同时，我将启动\
    \ `javac`，这样我就可以创建类文件了。感谢 NetBeans，我将使用它自带的软件运行我的程序，而无需打开多个窗口来输入命令并运行它们来测试我的代码。我可以在一个窗口中完成所有操作。\n\
    \n# 第二章：NetBeans 程序\n\n当我第一次打开 NetBeans 时，我将看到项目。这个 IDE（集成开发环境）允许我看到创建的所有项目，并查看哪些仍在进行中。当我选择项目旁边的加号时，我将看到与项目相关的所有文件夹。文件夹也会展开，以便我看到代码存储的位置。\n\
    \n我的代码将显示在右侧的文本区域。如果我没有看到代码，我需要双击项目来强制代码出现，以便我进行操作。\n\n文件名和类名必须匹配，否则 Java 将无法按预期方式运行程序。在编译代码以便运行时，我最终会遇到错误。\n\
    \n## Java 注释\n\n一旦我创建一个新项目，我将看到一些灰色的文本，它们要么带有斜杠，要么带有星号。这些灰色文本是程序在运行代码时会忽略的注释。我可以在注释中输入我想要的任何内容，而任何非代码工作者的人都不会看到这些注释。大多数情况下，这些注释解释了代码正在发生什么，以便其他程序员对其进行工作。\n\
    \n### 示例\n\n```\n//我创建了一个注释\n// 这是我的注释开始的地方\n// 这里继续，因为这是一条长注释。\n```\n\n```\n\
    /* 我在这里使用了另一种类型的注释\n\n 虽然它到了另一行\n\n*/\n```\n\n我还可以使用 Javadoc 注释来输入注释。这些注释将以正斜杠后跟两个星号开头，并一个星号和一个正斜杠结束。然而，我创建的每一行前面都需要一个星号，以便其被视为注释。\n\
    \nJavadoc 将使用文档代码中的注释，这样当代码被转换为其他人使用的 HTML 页面时，代码就会得到解释。\n\n"
- fmt: "\nI am going to need to generate a Javadoc in the menu for NetBeans, but,\
    \ since I have not written any code, I am not going to see anything in my window.\
    \ NetBeans does generate comments automatically so that I can see an example,\
    \ and I can delete these comments so that I can insert my own.\n\n# Structure\
    \ Java Code\n\nLooking at how the code is going to be structured, the name for\
    \ the package is going to come first when I am looking at my code. This line is\
    \ going to end with a semicolon and if I do not put that semicolon in, then the\
    \ program is not going to be able to be compiled therefore, it is not going to\
    \ run. Listed after the package name is going to be the class name.\n\nThe class\
    \ name is going to be set up like it is a segment of code. I have to indicate\
    \ where the code is going to start and where it ends by using the curly brackets\
    \ `{ }`. Everything that is inside of the brackets is going to be known as a code\
    \ segment that is going to be executed by Java.\n\nAs I am writing my code, I\
    \ need to include the keyword `main` so that Java is aware of where the code should\
    \ start being executed. It is going to be much like the curly brackets. If I happen\
    \ to forget to put the `main` keyword then the program is going to give me an\
    \ error message.\n\n# Running programs\n\nAny Java program is going be run in\
    \ an output window that is different than the window that I type all of my code\
    \ in. This makes it to where I do not need to have any other windows open to run\
    \ my code. Everything is run inside of NetBeans.\n\nThe easiest way that I can\
    \ run a program in Java is to press `F6`, this is going to automatically run the\
    \ program so that I do not have to accidentally close my program. But, in the\
    \ event that I do not want to do that, I can always go to the start menu and select\
    \ the button that says “run project”.\n\nIf all else fails, I can locate a green\
    \ button on my tool bar that is going to run the program same as any other method\
    \ that I might choose. I am going to need to make sure that the proper code is\
    \ being run though especially if I have been working with multiple coding projects.\
    \ To do this, I can right click on the project that I am wanting to be run.\n\n\
    # Chapter three: Manipulating Java Data\n\nJava is just like any other programming\
    \ language that is going to allow me to manipulate the data that I input into\
    \ it while the program stores it on the memory. This data is known as text, objects,\
    \ and even amounts. I have to give any data that I use a name, and this data can\
    \ always be renamed. However, the name and the value are going to be Java variables.\n\
    \n## Java amounts\n\nAmounts can be stored in the memory of Java by using whole\
    \ numbers or floating point numbers. Floating point numbers are going to be stored\
    \ with an equals sign while whole numbers are stored with the keyword `int`.\n\
    \n### Example\n\n```\npublic static voice main(String [ ] args) {\n    int last_amount;\n\
    \    System.out.println (“I wrote Java code!\");\n}\n```\n\nI am going to need\
    \ to communicate with the program so that I can let it know what integers I want\
    \ to be saved to the memory of Java; to do this I am going to use the `int` keyword\
    \ and place a space after it. I am going to enter what I want this variable to\
    \ be named as well, but I am going to have to follow a set of rules that has been\
    \ set forth by Java.\n\n1. I cannot use keywords in my variable names. If the\
    \ word turns blue in my code window, then the word is a keyword for Java.\n2.\
    \ I cannot use spaces. Doing this will cause an error code to be returned, but,\
    \ I can use underscores and uppercases to “separate” words like I normally would\
    \ with a space.\n3. I cannot have a number for the first character of a variable\
    \ name. If I spell the number out, then that will work, but using the actual number\
    \ is not going to work.\n4. Having a name that is completely lowercased is going\
    \ to be different than having one that has two uppercased letters.\n\nWhen I want\
    \ to put an integer in after the variable name, I am going to need to use an equals\
    \ sign to ensure that the variable’s value is stored properly.\n\n### Example\n\
    \n```\npublic static void main(String [ ] args) {\n    int some_number;\n    some_number\
    \ = 55,\n    System.out.println (“Java code\");\n}\n```\n\nJava is going to store\
    \ the number 55 to the variable `some_number`. If I do not like how this looks,\
    \ I can put all of the code in one line instead.\n\n### Example\n\n```\npublic\
    \ static void main(String [ ] args) {\n    int some_number = 55;\n    System.out.println(“Java\
    \ code\");\n}\n```\n\nI will have manipulated the last line of the script so that\
    \ it will fit into one line. When I place information between the parentheses,\
    \ it is going to need to be inside of a set of double quotes. The `+` sign is\
    \ going to make sure that two halves of the expression that I create are joined\
