  trans: "\n\n- NOT 布尔语句中的唯一区别是 `(!user)` 函数。该运算符将通过感叹号放在变量之前。像往常一样，将对变量进行测试以检查它是否为负。\n\
    \n由于用户变量通常被设置为 true，因此它们会被测试，以检查其中是否有任何 false 值。如果值被设置为 false，情况则完全相反。\n\n# 第七章：Switch\
    \ 语句与循环\n\n在我编写脚本时，我将使用 `switch` 语句，这样我就可以为我使用的变量设置的值提供更广泛的选择范围。从本质上说，这些实际上是非常长且有些复杂的\
    \ `else if` 语句。\n\n一个 `switch` 语句看起来是这样：\n\n```java\nSwitch ( variable_to_test_\
    \ {\n    Case value:\n    Code_here;\n    Break;\n    Case value:\n    Code_here;\n\
    \    Break;\n    Default:\n    Values_not_caught_above;\n}\n```\n\n用于 switch 语句的关键字是\
    \ `switch`，后面将跟有一组括号。我想要检查的变量需要放在我在 `switch` 语句中括号的中间。变量不仅会被放在括号之间，语句的其他部分也是如此。`case`\
    \ 关键字将检查程序必须检查的所有可能性。\n\n`Case` 值将使用冒号而不是分号。程序中将发生的事件需要与值正确对应，以便代码能够按照预期的方式运行。每当语句中添加了新的\
    \ `case` 时，就会使用 `break` 关键字。\n\n`Default` 值将被使用，但我不必非使用它们。我可以为语句添加任何想要的值，以便在我的\
    \ `switch` 语句中对其进行评估。\n\n### 示例\n\n```java\nPublic static void main(String [ ]\
    \ args) {\nInt user = 87;\nSwitch ( user ) {\n    Case 45:\n    System. out. printIn(“\
    \ the price is 45 dollars”) ;\n    Break ;\n    Case 65:\n    System. out. printIn\
    \ (“ the price is 65 dollars”) ;\n    Break ;\n    Case 88: \n    System. out.\
    \ printIn (“ the price is 88 dollars”) ;\n    Break ;\n    Default:\n    System.\
    \ out. printIn (“ the price is 45, 65, and 88 dollars”) ;\n}\n}\n```\n\n`switch`\
    \ 语句代码需要测试用户输入的整数。在这个示例中，`value` 被设置为 `87`，这告诉程序去检查其内部的所有内容。每个 `case` 将被单独检查，以查看是否有一个匹配我设置的值。在找到匹配的\
    \ `case` 后，代码将停止，程序将终止。\n\n超出范围的值是无法测试的，尽管它们被放置在 `case` 中。\n\n### 示例\n\n```java\n\
    Case ( user >= 55 ) ;\n```\n这个 `case` 无法使用，并将导致 Java 错误。\n\n但是，我可以使用如下这样的 `case`：\n\
    `Case 5: Case 6: Case 7: 等.`\n每个使用的值都需要被列出并检查。\n\n## 循环\n\nJava 中的执行流是顺序的，就像书写书籍一样向下移动页面。但是，可以使用一些函数，使执行流转变为不同的内容。为了中断\
    \ Java 自然使用的执行流，我将创建一个循环。通过循环，程序将连续运行脚本行，直到被要求停止。\n\n### 示例\n\n```java\nInt subtraction\
    \ 100-5-3-4-8-6-2-9\n```\n\n我并不总是想使用这种方法，但循环将一直持续，直到我设置的参数被满足。一旦成功满足该条件，循环将终止，并评估下一段代码。\n\
    \n## 使用 for 的循环\n\n使用关键字 `for` 的循环将是我处理 Java 时最常用的循环之一。这种循环将设置代码在终止之前需要重复的次数。\n\
    \n`For` 循环看起来有点像这样：\n\n```java\nFor ( beginning_value; last_value ; increment_amount)\
    \ {\n    // 我将我的代码输入到这一部分\n}\n```\n\n括号内包含三个决定整个循环的三个值。起始值是循环开始的地方，最后一个值是循环需要到达的值，增量值决定了循环重复的次数。\n\
    \n"
