    \n```java\nif(client > New York) {\n    //Message for the user\n}\n```\n\nThe\
    \ code is going to be the same even for those who do not live in New York.\n\n\
    ### If/else\n\nWhen an `if` statement is not going to be sufficient, then I am\
    \ going to use an `if else` statement.\n\n```java\nif(what I want to be completed\
    \ before the program runs) {\n\n}\nelse {\n\n}\n```\n\nThe first line of this\
    \ code is going to be started with an `if` statement followed by the parameters\
    \ that I have set into place. The brackets will divide my code up so that the\
    \ code is executed based on my parameters. The second part is going to come after\
    \ the `else` statement. So if this does not happen then this will.\n\nWith an\
    \ `if else` statement, it is just like an `if` statement except it has a second\
    \ expression that is going to fall between a new set of brackets. If the first\
