    \ project）按钮。\n\n如果其他方法都失败了，我可以在工具栏上找到一个绿色按钮，它的运行方式与我选择的其他任何方法相同。不过，我需要确保运行的是正确的代码，特别是当我处理多个编码项目时。要做到这一点，我可以对想要运行的项目点击右键。\n\
    \n# 第三章：操作 Java 数据\n\nJava 与任何其他编程语言一样，允许我操作输入它的数据，同时程序将其存储在内存中。这些数据被称为文本、对象甚至数值。我必须为我使用的任何数据命名，而且这些数据可以随时重命名。然而，名称和值统称为\
