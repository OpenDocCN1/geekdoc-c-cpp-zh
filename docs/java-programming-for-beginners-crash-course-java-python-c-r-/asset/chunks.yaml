    Chapter seven: Switches and Loops


    As I am working on my script, I am going to use switch statements so that I have
    a wider range of options for the values that I am going to set for my variables
    that I use. In essence, these are really long and somewhat complicated if else
    if statements.


    This is how a switch statement is going to look:


    Switch ( variable_to_test_ {


    Case value:


    Code_here;


    Break;


    Case value:


    Code_here;


    Break;


    Default:


    Values_not_caught_above;


    }


    The keyword used for switch statements is going to be switch which will then have
    a set of parentheses following it. The variables that I want to check will need
    to go in the middle of the brackets that I have placed in my switch statement.
    Not only will the variables be placed between the brackets, but so will other
    parts of the statements. The case keywords are going to review all the powers
    that have to be reviewed by the program.


