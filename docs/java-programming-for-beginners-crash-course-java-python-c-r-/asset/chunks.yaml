    \nThe NOT operator is also going to be used when Booleans are being created by\
    \ me.\n\n### Example\n\n```java\nboolean client = true;\nif(!user) {\n    System.out.println(\"\
    there is no truth\");\n}\nelse {\n    System.out.println(\"this is the truth\"\
    );\n}\n```\n"
