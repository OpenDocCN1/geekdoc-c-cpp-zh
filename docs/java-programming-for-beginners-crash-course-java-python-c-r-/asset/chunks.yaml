    \n### Example\n\n```java\nif(client < New York) {\n    // This site is restricted\n\
    }\n```\n\nSo, if my user is not from New York, there are going to be two sets\
    \ of brackets that will be skipped by Java as the program is executed. But, anything\
    \ that is placed between them, the code will be carried out, but the condition\
