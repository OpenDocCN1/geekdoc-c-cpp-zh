    \nAs I go to assign values to the positions, then I am going to use the normal\
    \ methods that I have used previously.\n\n```java\naryNum [ 8 ] = 32 ;\n```\n\n\
    The amount of 32 is going to be assigned to the space of 8 in the array.\nI have\
    \ to remember that arrays have to start at zero.\n\n### Example\nSetting up my\
    \ arrays like this is going to make it easier for me to deal with.\n\n```java\n\
    Int [ ] aryNims = { 8, 5, 6, 2 } ;\n```\nThis method has created my array inside\
    \ of the brackets where the first value is placed at zero. The square brackets\
    \ that come after my keyword are going to make sure that the data type is not\
    \ repeated elsewhere. This method is going to also be used with string values\
    \ and chars when I want to use `new` keywords.\n\n### Example\n```java\nString\
    \ [ ] aryStrings = { “ Vampires, Werewolves, Hybrids, Witches” } ;\n```\nThis\
    \ will work with Java.\n\n```java\nBoolean [ ] aryBools = { yes, no, no, yes }\
    \ ;\n```\nThis will not work. If I want to use `Boolean` values I have to use\
    \ a `new` keyword all together.\n\n### Example\n```java\nBoolean [ ] aryBools\
    \ = new Boolean [ ] { yes, no, no, yes } ;\n```\n\n### Arrays for loops\nArrays\
    \ use special rules for their loops. The values in an array will be assigned using\
    \ the array syntax. This does not make sense to me, but this is how values will\
    \ be assigned.\n\n### Example\n```java\npackage prjarrays ;\n\npublic class ArrayTest\
    \ {\n    public static void main (String [ ] args) {\n        Int [ ] ticket _\
    \ prices = new int [ 65 ] ;\n        Int I ;\n        For ( I = 0; I < ticket_prices\
    \ . length ; i++) {\n            Ticket_prices [ I ] = I +1;\n            System.\
    \ out. printIn ( ticket_prices [ 6 ] ;\n        }\n    }\n}\n```\nThe array above\
    \ will contain 65 integers. The loop is going to go until this number has been\
    \ reached and the `I` is going to be a value that is smaller than the arrays size.\
    \ To appoint values to the positions that I want them to be in, I am going to\
    \ use a different code.\n\n### Example\n```java\nTicket_prices [ I ] = I + 1 ;\n\
    ```\nThe values that I use are not going to be hard coded when they are placed\
    \ between the brackets, instead every variable is going to increase by one digit\
    \ each time that the loop is repeated. The array is also going to increase with\
    \ the loops value. This value is going to be assigned thanks to the last bit of\
    \ the script that is entered. The loop is going to start at zero always and go\
    \ up through the number 65 for this example.\n\nThe next bit of script will be\
    \ the value for the positions in the array. In the event that I want to type out\
    \ all my code, it is going to end up jumbled because of the amounts found in the\
    \ array.\n\n### Sorting\nThe arrays I make can be sorted out by using the sorting\
    \ method. I will however have to reference what I am sorting to a directory in\
    \ Java. The `import` statement will be used for this.\n\n```java\nimport java.\
    \ util. Arrays ;\n```\n\n### Example\n```java\npackage prjarrays;\n\nimport java\
    \ .util. Arrays ;\n\npublic class ArraysTest {\n    public static void main (\
    \ String [ ] args) {\n        Int [ ] aryNums;\n        aryNums = new int [ 9\
    \ ] ;\n        aryNums [ 0 ] = 65 ;\n        aryNums [ 1 ] = 54;\n        aryNums\
    \ [ 2 ] = 689 ;\n        aryNums [ 3 ] = 654;\n        aryNums [ 4 ] = 6543 ;\n\
    \        aryNums [ 5 ] = 55 ;\n        // The libraries for an array are going\
    \ to be imported along with the sort method.\n        Arrays . sort( aryNums )\
    \ ;\n    }\n}\n```\nThe keyword that falls first in the importing is `array` after\
    \ that I am going to insert a dot. That dot is going to open up a box that is\
    \ going to give me a list of everything that I can do with that array. The `sort`\
    \ word is going to say where the name of the array is placed and then the brackets\
    \ are going to fall after that.\n\n### Example\n```java\npackage prjarrays;\n\n\
    import java .util. Arrays ;\n\npublic class ArraysTest {\n    public static void\
    \ main ( String [ ] args) {\n        Int [ ] aryNums;\n        aryNums = new int\
    \ [ 9 ] ;\n        aryNums [ 0 ] = 202 ;\n        aryNums [ 1 ] = 1696 ;\n   \
    \     aryNums [ 2 ] = 385 ;\n        aryNums [ 3 ] = 2956 ;\n        aryNums [\
    \ 4 ] = 4554 ;\n        aryNums [ 5 ] = 126 ;\n        Arrays . sort (aryNums)\
