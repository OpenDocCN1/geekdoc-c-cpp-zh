    \ and able to provide you with all of the tools you need to achieve your goals\
    \ whatever it may be.\n\nThe next step is to download NetBeans and start creating\
    \ your own Java programs with the information that I have provided for you. Some\
    \ of it may seem confusing, but it is going to get easier the more that you practice\
    \ it.\n\nIf you found any piece of this book confusing, go back and read it again.\
    \ As I stated in the introduction, programming is not easy and it is not going\
