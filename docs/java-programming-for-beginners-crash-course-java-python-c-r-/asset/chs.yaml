  \n# 第四章：数学及更多\n\n## 算术\nJava 和任何其他编程语言一样，都可以用于数学计算。我可以使用 Java 执行一些基础操作，它们的符号非常容易理解。\n\
  \n- 加 – 加号\n- 减 – 负号\n- 乘 – 星号\n- 除 – 正斜杠\n\n## 运算优先级\n无论我用 Java 做什么数学计算，我都必须确保将每个值都放在正确的位置，这样我才知道正在执行什么以及执行的顺序是什么。\n\
  \n### 示例\n```java\nTenth_value= 5;\n\nFifteenth_value = 654;\n\nTwohundredith_value\
  \ = 54;\n\nResult = tenth_value – fifteenth_value +twohundredith_value;\n```\n该表达式将按照输入\
  \ Java 的顺序进行求值。发生的情况是， 5 减去 654 得到结果 -649，然后加上 54，最后总和为 -595。\n\n当我想让表达式中的某个部分具有优先级时，我会用括号将其括起来。在运算顺序上，乘法和除法总是最先执行。\n\
  \n## 字符串变量\nJava 不仅会在内存中存储值，还会存储分配给变量的文本。当我想要存储一个字符时，我需要将关键字从 `int` 改为 `char`。\n\
  \n我将开始一个新项目，这个项目将用于字符串，因此我会将其命名为类似 `VarsStrings` 的名称，这样我就知道它是用于存放字符串变量的。我还会想确保勾选“创建主类”复选框，这样我以后就不需要这样做，也不会面临搞乱项目的风险。\n\
  \n一旦打开了文本框，我将删除程序自动在文本框内生成的注释，这样我就有了一个空白的起点来处理问题。要创建一个字符串，我需要使用 `string` 一词，以便 Java\
  \ 在我详细编写变量名之前能够识别出这不仅仅是纯文本。\n\n### 示例\n```java\nString game_title\n```\n字符串的值将通过等号赋值给一个新变量。我放在等号之后的数据将储存在在双引号中。\n\
  \n### 示例\n```java\nGame_title = “Raiders” ;\n```\n我也可以将脚本写在一行内，这样我在寻找潜在错误时，脚本会易于查看。\n\
  ```java\nString game_title = “Raiders” ;\n```\n然后我会将这个游戏的创建者放在另一行，这样当它出现在用户所在的网站上时，将带有游戏标题以及创建者信息，这样他们就能为自己的作品获得荣誉。\n\
  \n### 示例\n```java\nString creator_name = “Markus” ;\n```\n到此时，我就可以按照我希望用户看到的方式组合我的代码了。\n\
  \n```java\nSystem. out. printIn (game_title + “ “ + creator_name) ;\n```\n我插入括号中的内容将是我的变量。加号表示游戏标题和创建者姓名之间需要一个空格。\n\
  \n`char` 关键字需要小写，以便在内存中只存储单个字符。这也是我需要使用单引号而不是双引号的时候。如果我忘记并使用了双引号，程序将返回一个错误代码。\n\n\
  ### 示例\n```java\nString game_title = “R”;\n```\n虽然这是正确的输入：\n```java\nString game_title\
  \ = ‘R’;\n```\n但这将返回错误。\n\n# 第五章：输入及以后\nJava 包含了大型目录，允许我使用它们来确保我的代码被正确执行。当我必须引用这些目录时，我需要调用这些目录。\n\
  \n我发现的一个非常有用的类目录是 `scanner` 类。只要我使用 `import` 关键字，我就可以从目录中提取任何类，以便在我的代码中使用。\n\n###\
  \ 示例\n```java\nImport Java.util.scanner ;\n```\n这条语句需要放在告诉其他程序员使用了哪个类的语句之前。\n\n\
  ### 示例\n```java\nImport java. util. Scanner ;\n\nPublic class VariablesForStrings\
  \ {\n\n}\n```\n脚本的导入部分允许 Java 知道它需要从列出的目录中提取该类。一旦完成该任务，它将允许我开始将变量放入该类中。当我观察它时，它仅仅是一段代码，在我在该类内部成功对象之前，它不会产生任何作用。\n\
  \n当我创建一个新对象时，我将使用特定的代码，以便 Java 不尝试从另一个目录中创建此对象。\n\n### 示例\n```java\nScanner inputFrom_user\
  \ = new Scanner( System . in) ;\n```\n整数变量不能与字符串变量函数一起设置。我必须专门使用 `inputFrom_user`\
  \ 来确保程序运行正常。\n\n我的关键字是 `new`，以便从类中创建一个新对象，当该对象被创建时，它将位于一组括号之间。这现在指示来自系统的输入。\n\n\
  来自程序用户的输入必须通过方法来调用，以便让他们知道他们应该与程序进行交互。最常用的方法之一是 `next` 方法。我写的字符串将在用户输入他们的响应后出现。\n\
  \n### 示例\n```java\nString state_name;\n\nState_name = user_response.next() ;\n```\n\
  在客户输入了要求的数据后，将从一个列表中插入一个点，列表中包含了我将要使用的方法。此时，我只需要点击我想要使用的方法，然后在行尾输入一个分号。\n\n### 示例\n\
  ```java\nString state_name;\n\nSystem.out.print (“ Type in the state that you currently\
  \ reside in: “ ) ;\n\nstate_name = client_input.next () ;\n```在尝试从用户获取数据时，我将使用 `print`\
  \ 而不是 `printin` 函数。如果我想使用 `print in`，我必须在产生结果后将鼠标移动到另一行。然而，当使用 `print` 时，我能够留在我正在工作的这一行上。\n\
  \n### 示例\n```java\nString city_name ;\n\nSystem.out.print (“What city are you living\
  \ in: “);\n\ncity_name = client_input.next() ;\n```虽然代码除了客户端的响应外完全相同，但 Java 将数据移动到一个新变量，这样我就不需要自己动手。\n\
  \n### 示例\n```java\nString complete name;\n\nWhere you live = state_name + “” + city_name\
  \ ;\n\nSystem.out.printIn (“You are living in”+state and city name);\n```\n当我创建的运行时，Java\
  \ 将暂停足够的时间让用户输入响应。在数据放入内存后，输出将显示在屏幕上，为他们提供的体验提供“个性化”。\n\n\n\n\n\n`Scanner` 类的目的是从用户处获取信息，同时来自用户的输入将被赋值给其所属的变量。\n\
  \n## 选项\n\n当我尝试从程序用户处获取所需信息时，使用 `JOptionPane` 函数可以获得一个选项列表。该类将出现在屏幕上，允许用户在显示他们输入的内容之前输入适当的响应。\n\
  \n### 示例\n\n```java\nimport javax.swing.JOptionPane;\n```\n\n这次我必须告诉 Java 我想在 `swing`\
  \ 目录中使用哪个类。因为我不想改变已经写好的代码，所以我直接为这个方法创建了一个新项目。当我把代码放入时，我注意到 `javax.swing.JOptionPane`\
  \ 带有下划线，就像错误一样。但这不是错误，它将把数据重定向到需要存储的变量下。\n\n### 示例\n\n```java\nString your_age;\n\
  your_age = JOptionPane.showInputDialog(\"Your age\");\n```\n\n`JOptionPane` 允许我输入一个句号，这样我的选项列表就会出现。在这个列表中，我将通过双击\
  \ `showInputDialog` 来选择它。这会在我的代码中放置括号，括号内将放置我想显示给用户的消息。我还需要在这里使用双引号。\n\n### 示例\n\
  \n```java\nString your_age;\nyour_age = JOptionPane.showInputDialog(\"your age\"\
  );\nString birthday birthday;\nbirthday = \"You were born on\" + month + day;\n\
  JOptionPane.showMessageDialog(null, birthday);\n```\n\n这是我希望我的对话框再次出现的地方，并带有所有供我使用的选项。括号中放入了\
  \ `null`，以便 Java 知道这个框与我刚刚创建的程序无关。标点符号将显示在最终产品的文本中，就像我在 Java 中输入的那样。\n\n在我代码的末尾，会有一些我没有放进去的新代码。这些代码旨在告诉程序何时应该退出系统，因为它已经执行到了最后。即使这样做，存储在\
  \ Java 内存中的值和变量也将被存储，以供下一次使用程序使用。\n\n每当我的代码正确执行时，就会弹出一些框，向用户索取不同的数据，例如他们的姓名或年龄。当用户点击“确定”按钮后，输入将显示为用户在框中输入的内容。这将导致程序退出系统，因为所有需要完成的工作已经完成。\n\
  \n## 第章：控制 Java 的运行\n\n之前使用 Java 编写的所有代码都是所谓的顺序编程。在这种情况下，输入代码，程序从上到下读取它，不会跳过我输入的任何行。但，并不是所有的\
  \ Java 程序都是这样运行的。\n\n有些脚本只在设置的条件满足时运行一次。例如，可能我不想让任何来自特定州的人进入我的网站，因此如果发现该条件为真，则程序将运行；但如果用户来自该州，程序将终止。这样做将通过条件逻辑来控制\
  \ Java 的运行。\n\n最常见的条件语句是 `if` 语句。\n\n### If\n\n使用 `if` 语句，每当条件被调用时代码就会执行，而不是等待用户做某些事。`if`\
  \ 语句将是一个简单的脚本。\n\n```java\nif (expression) {\n\n}\n```\n\n使用之前的例子，如果用户来自纽约，那么我不希望他们进入我的网站。我没有输入实现此功能所需的全部代码，而是将缩短脚本，以便我和其他程序员更容易阅读。\n\
  \n### 示例\n\n```java\nif(client < New York) {\n    // This site is restricted\n}\n\
  ```\n\n所以，如果我的用户不是来自纽约，在程序执行时，Java 将跳过两组括号。但是，放在它们之间的任何代码都将被执行，但在在此之前必须满足我设置的条件。\n\
  \n我学到的另一个简写技巧是，大于符号将由一个指向右侧的三角形表示。\n\n### 示例\n\n```java\nif(client > New York) {\n\
  \    //Message for the user\n}\n```\n\n对于那些不在纽约的人来说，代码也是相同的。\n\n### If/else\n\n\
  当 `if` 语句不再足够时，我将使用 `if else` 语句。\n\n```java\nif(what I want to be completed before\
  \ the program runs) {\n\n}\nelse {\n\n}\n```\n\n这段代码的第一行将以 `if` 语句开头，后面跟着我设置的参数。括号将划分我的代码，以便代码根据我的参数执行。第二部分将位于\
  \ `else` 语句之后。所以如果这种情况没有发生，那么就会发生。\n\n使用 `if else` 语句与 `if` 语句一样，只是它有第二个表达式落在新一组括号之间。如果第一个条件不满足，代码将将被分段并通过第二个表达式运行，以检查它是否满足该条件。如果我漏掉了其中一个括号，我将收到错误代码。\n\
  \n```java\nif(expression_one) {\n\n}\nelse if (expression_two) {\n\n}\nelse {\n\n\
  }\n```\n\n在 `if else` 内部可以设置的条件如下：\n- 大于 (`>`)\n- 小于 (`<`)\n- 大于等于 (`>=`)\n- 小于等于\
  \ (`<=`)\n- 与 (`&&`)\n- 或 (`||`)\n- 等于 (`==`)\n- 非 (`!`)\n\n在与（AND）条件下，将同时测试多个条件。\n\
  \n### 示例\n\n```java\nelse (user > 45 && user < 55)\n```\n\n### 嵌套的 If\n\n当我将一个表达式放在另一个内部时，我正在嵌套这两个表达式。这可以通过任何\
  \ `if` 表达式完成。\n\n### 示例\n\n```java\nif(client < 55) {\n    system.out.println(\"\
  55 or less\");\n}\n```\n\n为了检查客户是否大于 45 岁，我将在第一个内部放置另一个。\n\n### 示例\n\n```java\n\
  if(client < 45) {\n    if(client > 48 && client < 45) {\n        System.out.println(\"\
  You are 46 or 47\");\n    }\n    else {\n        System.out.println(\"45 or younger\"\
  );\n    }\n}\n```\n\n## 布尔\n\n布尔（Booleans）只允许真或假值。如果它们其他任何值，它们就不是真正的布尔值。在处理布尔值时，不需要使用\
  \ `int`、`string` 或任何其他关键字。相反，我只需输入小写 b 的 `boolean` 以确保其后的任何内容都是布尔值。但我必须确保值是真或假。我将使用两个等号来评估我的表达式的值。\n\
  \n### 示例\n\n```java\nboolean client = true;\nif (user == true) {\n    System.out.println(\"\
  the expression contains the truth\");\n}\nelse {\n    System.out.println(\"this\
  \ expression is false\");\n}\n```\n\n`if` 语句将检查输入的变量，以查看它们是否构成了真布尔语句。如果用户输入已经是真的，则将检查它是否为假。不需要说明该值不是假的，因为很容易看出该值实际上是真的，反之亦然。\n\
  \n当我创建布尔值时，也会使用非（NOT）运算符。\n\n### 示例\n\n```java\nboolean client = true;\nif(!user)\
  \ {\n    System.out.println(\"there is no truth\");\n}\nelse {\n    System.out.println(\"\
  this is the truth\");\n}\n```\n\n\n\n\n- NOT 布尔语句中的唯一区别是 `(!user)` 函数。该运算符将通过感叹号放在变量之前。像往常一样，将对变量进行测试以检查它是否为负。\n\
  \n由于用户变量通常被设置为 true，因此它们会被测试，以检查其中是否有任何 false 值。如果值被设置为 false，情况则完全相反。\n\n# 第七章：Switch\
  \ 语句与循环\n\n在我编写脚本时，我将使用 `switch` 语句，这样我就可以为我使用的变量设置的值提供更广泛的选择范围。从本质上说，这些实际上是非常长且有些复杂的\
  \ `else if` 语句。\n\n一个 `switch` 语句看起来是这样：\n\n```java\nSwitch ( variable_to_test_\
  \ {\n    Case value:\n    Code_here;\n    Break;\n    Case value:\n    Code_here;\n\
  \    Break;\n    Default:\n    Values_not_caught_above;\n}\n```\n\n用于 switch 语句的关键字是\
  \ `switch`，后面将跟有一组括号。我想要检查的变量需要放在我在 `switch` 语句中括号的中间。变量不仅会被放在括号之间，语句的其他部分也是如此。`case`\
  \ 关键字将检查程序必须检查的所有可能性。\n\n`Case` 值将使用冒号而不是分号。程序中将发生的事件需要与值正确对应，以便代码能够按照预期的方式运行。每当语句中添加了新的\
  \ `case` 时，就会使用 `break` 关键字。\n\n`Default` 值将被使用，但我不必非使用它们。我可以为语句添加任何想要的值，以便在我的 `switch`\
  \ 语句中对其进行评估。\n\n### 示例\n\n```java\nPublic static void main(String [ ] args) {\n\
  Int user = 87;\nSwitch ( user ) {\n    Case 45:\n    System. out. printIn(“ the\
  \ price is 45 dollars”) ;\n    Break ;\n    Case 65:\n    System. out. printIn (“\
  \ the price is 65 dollars”) ;\n    Break ;\n    Case 88: \n    System. out. printIn\
  \ (“ the price is 88 dollars”) ;\n    Break ;\n    Default:\n    System. out. printIn\
  \ (“ the price is 45, 65, and 88 dollars”) ;\n}\n}\n```\n\n`switch` 语句代码需要测试用户输入的整数。在这个示例中，`value`\
  \ 被设置为 `87`，这告诉程序去检查其内部的所有内容。每个 `case` 将被单独检查，以查看是否有一个匹配我设置的值。在找到匹配的 `case` 后，代码将停止，程序将终止。\n\
  \n超出范围的值是无法测试的，尽管它们被放置在 `case` 中。\n\n### 示例\n\n```java\nCase ( user >= 55 ) ;\n\
  ```\n这个 `case` 无法使用，并将导致 Java 错误。\n\n但是，我可以使用如下这样的 `case`：\n`Case 5: Case 6: Case\
  \ 7: 等.`\n每个使用的值都需要被列出并检查。\n\n## 循环\n\nJava 中的执行流是顺序的，就像书写书籍一样向下移动页面。但是，可以使用一些函数，使执行流转变为不同的内容。为了中断\
  \ Java 自然使用的执行流，我将创建一个循环。通过循环，程序将连续运行脚本行，直到被要求停止。\n\n### 示例\n\n```java\nInt subtraction\
  \ 100-5-3-4-8-6-2-9\n```\n\n我并不总是想使用这种方法，但循环将一直持续，直到我设置的参数被满足。一旦成功满足该条件，循环将终止，并评估下一段代码。\n\
  \n## 使用 for 的循环\n\n使用关键字 `for` 的循环将是我处理 Java 时最常用的循环之一。这种循环将设置代码在终止之前需要重复的次数。\n\n\
  `For` 循环看起来有点像这样：\n\n```java\nFor ( beginning_value; last_value ; increment_amount)\
  \ {\n    // 我将我的代码输入到这一部分\n}\n```\n\n括号内包含三个决定整个循环的三个值。起始值是循环开始的地方，最后一个值是循环需要到达的值，增量值决定了循环重复的次数。\n\
  \n\n\n\n\n在我正式选择好将使用的数据类型后，普通整数将放在括号中。括号让 `Java` 知道正在使用的是数组而不是任何其他数据类型。数组使用 `aryNums`\
  \ 函数来确保数组能够被正确设置。之后，可以放置任何我想要放入数组的变量。\n\n一旦我为数组设置了一个新对象，Java 就会知道我为数组留了多少个空间。\n\n\
  ### 示例\n```java\naryNums = new int [ 55 ];\n```\n这告诉 Java 在此数组将使用 55 个空间来存储整数。它们的范围从\
  \ 0 到 55。\n\n当我给这些位置赋值时，我将使用我之前用过的普通方法。\n\n```java\naryNum [ 8 ] = 32 ;\n```\n\n\
  数值 32 将被分配到数组中索引为 8 的空间。\n我必须记住，数组必须从 0 开始。\n\n### 示例\n这样设置我的数组将让我处理起来更加方便。\n\n\
  ```java\nInt [ ] aryNims = { 8, 5, 6, 2 } ;\n```\n这种方法在括号内创建了我的数组，第一个值被放在了 0 位。关键字后面的方括号将确保数据类型不会在其他地方重复。当我想要使用\
  \ `new` 关键字时，这种方法也适用于字符串值和字符值。\n\n### 示例\n```java\nString [ ] aryStrings = { “ Vampires,\
  \ Werewolves, Hybrids, Witches” } ;\n```\n这在 Java 中可以运行。\n\n```java\nBoolean [ ]\
  \ aryBools = { yes, no, no, yes } ;\n```\n这是不行的。如果我想使用 `Boolean` 值，我必须完全使用 `new`\
  \ 关键字。\n\n### 示例\n```java\nBoolean [ ] aryBools = new Boolean [ ] { yes, no, no,\
  \ yes } ;\n```\n\n## 数组循环\n数组的循环有特殊的规则。数组中的值将使用数组语法进行赋值。这对我来说似乎不太理解，但这就是值赋值的方式。\n\
  \n### 示例\n```java\npackage prjarrays ;\n\npublic class ArrayTest {\n    public static\
  \ void main (String [ ] args) {\n        Int [ ] ticket _ prices = new int [ 65\
  \ ] ;\n        Int I ;\n        For ( I = 0; I < ticket_prices . length ; i++) {\n\
  \            Ticket_prices [ I ] = I +1;\n            System. out. printIn ( ticket_prices\
  \ [ 6 ] ;\n        }\n    }\n}\n```\n上面的数组将包含 65 个整数。循环将一直持续到达到这个数字，`I` 将是一个小于数组大小的值。为了给我想要所在的位置分配值，我将使用不同的代码。\n\
  \n### 示例\n```java\nTicket_prices [ I ] = I + 1 ;\n```\n当值被放在括号之间时，我使用的值并不是硬编码的，相反，每循环一次每个变量就会增加一位。数组也会随着循环的值而增加。这个值得益于输入的脚本的最后部分。循环将始终从\
  \ 0 开始，在这个示例中一直到数字 65。\n\n脚本的下一部分将是数组中位置的值。如果我想手动写出所有的代码，由于数组中包含的数量，代码最终会变得混乱无章。\n\
  \n### 排序\n我创建的数组可以使用排序方法进行排序。但是，我必须将我要排序的内容引用到 Java 的目录。这将使用 `import` 语句。\n\n```java\n\
  import java. util. Arrays ;\n```\n\n### 示例\n```java\npackage prjarrays;\n\nimport\
  \ java .util. Arrays ;\n\npublic class ArraysTest {\n    public static void main\
  \ ( String [ ] args) {\n        Int [ ] aryNums;\n        aryNums = new int [ 9\
  \ ] ;\n        aryNums [ 0 ] = 65 ;\n        aryNums [ 1 ] = 54;\n        aryNums\
  \ [ 2 ] = 689 ;\n        aryNums [ 3 ] = 654;\n        aryNums [ 4 ] = 6543 ;\n\
  \        aryNums [ 5 ] = 55 ;\n        // 数组的库将与排序方法一起导入。\n        Arrays . sort(\
  \ aryNums ) ;\n    }\n}\n```\n在导入中第一个出现的关键字是 `array`，之后我将插入一个点。那个点将打开一个框，给我列出我可以对该数组进行的所有操作列表。`sort`\
  \ 单词将显示数组名称的位置，然后括号将落在其后。\n\n### 示例\n```java\npackage prjarrays;\n\nimport java\
  \ .util. Arrays ;\n\npublic class ArraysTest {\n    public static void main ( String\
  \ [ ] args) {\n        Int [ ] aryNums;\n        aryNums = new int [ 9 ] ;\n   \
  \     aryNums [ 0 ] = 202 ;\n        aryNums [ 1 ] = 1696 ;\n        aryNums [ 2\
  \ ] = 385 ;\n        aryNums [ 3 ] = 2956 ;\n        aryNums [ 4 ] = 4554 ;\n  \
  \      aryNums [ 5 ] = 126 ;\n        Arrays . sort (aryNums) ;\n        Int I;\n\
  \        For ( I = 0 ; I < aryNums . length ; i++) {\n            System. out. printIn\
  \ (“num: “ + aryNums [ I ] ) ;\n        }\n    }\n}\n```\n当我编写自己的排序代码时，排序将按降序排列条项。我还可以将数组转换为用于整数的对象，这些对象也从一个目录中导入了。\n\
  \n### 示例\n```java\npackage prjarrays;\n\nimport java .util. Arrays ;\nimport java.util.\
  \ collections ;\n\npublic class SortDescending {\n    public class ArraysTest {\n\
  \        public static void main ( String [ ] args) {\n            Int [ ] aryNums;\n\
  \            aryNums = new int [ 9 ] ;\n            aryNums [ 0 ] = 65 ;\n     \
  \       aryNums [ 1 ] = 54 ;\n            aryNums [ 2 ] = 689 ;\n            aryNums\
  \ [ 3 ] = 654;\n            aryNums [ 4 ] = 6543 ;\n            aryNums [ 5 ] =\
  \ 55 ;\n            Arrays . sort( aryNums ) ;\n            Int I;\n           \
  \ For ( I = 0 ; I < aryNums . length ; i++) {\n                System. out. printIn\
  \ (“num: ” + aryNums [ I ] ) ;\n            }\n        }\n    }\n}\n```\n\n### 字符串\n\
  字符串也可以放在数组中。\n\n### 示例\n```java\nString [ ] aryString= new String [ 5 ]\naryString\
  \ [ 0 ] = “I” ;\naryString [ 1 ] = “am” ;\naryString [ 2 ] = “using” ;\naryString\
  \ [ 3 ] = “java” ;\naryString [ 4 ] = “yay” ;\n```\n在这个示例中，位置被填充了。\n\n### 语法\n```java\n\
  Int I;\nFor ( I = 0 ; I < aryString . length ; i++) {\n    System. out. printIn\
  \ ( aryString [ I ] ) ;\n}\n```\n循环将持续到达到某个值。`Arrays` 也可以排序。\n\n### 示例\n```java\n\
  package strings;\n\nimport java. util. Arrays ;\n\npublic class StringArrays {\n\
  \    public static void main (String [ ] args) {\n        String [ ] aryString=\
  \ new String [ 5 ] ;\n        aryString [ 0 ] = “I” ;\n        aryString [ 1 ] =\
  \ “have” ;\n        aryString [ 2 ] = “made” ;\n        aryString [ 3 ] = “an” ;\n\
  \        aryString [ 4 ] = “array” ;\n        Arrays.sort(aryString);\n    }\n}\n\
  ```\n`Arrays` 用于对字符串进行字母顺序排序。\n\n## 多维数组\n我创建的数组可以放入多个列，称为多维数组。\n\n### 语法\n```java\n\
  Int [ ] [ ] aryAmounts = new int [ 8 ] [ 33 ];\n```\n数组语法很正常，但现在有两个括号，让 Java 知道有多少行以及将创建多少列。\n\
  \n### 示例\n```java\naryAmounts[0][0] = 106;\naryAmounts[0][1] = 124;\naryAmounts[0][2]\
  \ = 433;\naryAmounts[0][3] = 11554;\naryAmounts[0][4] = 262;\naryAmounts[1][0] =\
  \ 2560;\naryAmounts[1][1] = 43255;\naryAmounts[1][2] = 560;\naryAmounts[1][3] =\
  \ 133;\naryAmounts[1][4] = 3385;\n```\n\n\n\n\n\n我无法确定数组中的确切值，但我可以使用 `ArrayList`，这样我就可以查看数据的结构。列表中的项可以添加或删除。但是，普通数组的数据是不会移动的，因为对于我所创建的内容，我没有更改数组大小的能力。\n\
  \n当我设置一个列表时，我将不得不从 Java 的目录中提取数据。\n\n### 语法\n\n```java\nimport java.util.ArrayList;\n\
  ```\n\n在我引入了创建新对象所需的数据后，我将使用不同的语法。\n\n```java\nArrayList listTest = new ArrayList(\
  \ );\n```\n\n在为数组创建列表时，我不会使用括号。\n\n### 示例\n\n```java\nlistTest.add( \"and\" );\n\
  listTest.add( \"for” );\nlistTest.add( “but \" );\nlistTest.add( 8 );\n```\n\n括号中的任何内容都将被放在我的数组列表中。通过这种方法，我可以添加任何我想要的对象。出现在列表中的前三个项是通常添加到字符串中的对象。最后一个项是一个整数。\n\
  \n列表中的所有项都可以通过它们的索引值找到。\n\n### 示例\n\n```java\nlistTest.get(5); \n```\n\n数字五准确地告诉了我将去哪里寻找我正在寻找。索引值总是从零开始，就像\
  \ Java 中使用的其他东西一样。考虑到这一点，对于上面的示例，我将查看位置六。\n\n当我想要删除对象时，我将使用不同的语法。\n\n### 示例\n\n\
  ```java\nlistTest.remove(5);\n```\n\n我也可以删除数组上的字符串值。\n\n```java\nlistTest.remove(“but”);\n\
  ```\n\n在删除项时，列表将重新调整自身的大小。由于这个原因，我在删除对象时必须非常小心，否则我的索引数字将发生巨大变化，我将不知道列表中的任何内容在哪里。所以，如果我删除了列表中的第二个项，那么接下来的三个项在它们被删除后将在我的列表中向上移动。\n\
  \n## 结论\n\n感谢你读到 Java 的最后，希望它具有启发性，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\n下一步是下载 NetBeans，并根据我提供的信息开始创建你自己的\
  \ Java 程序。某些内容可能看起来很困惑，但你练习得越多，就会变得越容易。\n\n如果你发现这本书的任何部分令人困惑，请回去重读。正如我在引言中所说的，编程并不容易，它不会在夜之间就让你学会。\n\
