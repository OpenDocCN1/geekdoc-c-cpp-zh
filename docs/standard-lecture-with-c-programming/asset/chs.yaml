  \n\n\n\n局部变量声明；`Statement`； 返回值；\n\n### 函数声明\n\n函数声明也称为函数原型。它告知编译器三点内容：这些内容是函数的名称、函数接收的参数的数量和类型，以及函数返回的值的类型。\n\
  \n虽然参数名称的声明是可选的，但函数原型始终以分号结束。\n\n### 函数定义\n函数定义包含了函数的完整描述和代码。它告诉我们该函数在做什么，它的输入是什么，以及输出是什么。它由两部分组成：函数头和函数体。\n\
  \n语法：`return type function(type 1 arg1, type2 arg2, type3 arg3) /*函数头*/`\n\n`局部变量声明`;\
  \ `Statement 1`； `Statement 2`； 返回值`\n\n`return type` 表示函数将返回的值类型，它是可选的；如果省略，默认假设为\
  \ `int`。函数体是复合语句或块，它由局部变量声明语句和可选的 `return` 语句组成。\n\n在函数内部声明的局部变量仅对该函数可见。它不能在程序的任何地方使用，且其生命周期仅限于此函数内部。\n\
  \n函数 `definition` 的参数被称为 `形式参数`。\n\n### 函数调用\n当函数被调用函数调用时，就称为 `函数调用`。当分号后跟着函数名时，编译器会执行这些函数。\n\
  \n示例：\n```c\nfunction(arg1,arg2,arg3);\n```\n\n在函数调用内部使用的参数被称为 `实际参数`。\n\n例：\n```c\n\
  int S=sum(a, b); // 实际参数\n```\n\n### 实际参数\n在函数调用内部提到的或使用的参数被称为实际参数，这些是原始值，这些值的副本会被实际发送到被调用的函数。\n\
  \n它可以写为常量、表达式或任何函数调用，例如：\n```c\nFunction (x);\nFunction (20, 30);\nFunction (a*b,\
  \ c*d);\nFunction(2,3,sum(a, b));\n```\n\n### 形式参数\n在函数定义中提到的参数被称为 `形式参数` 或哑元参数。\n\
  \n这些参数仅用于保存调用函数通过函数调用传递的值副本。\n\n这些参数就像其他的局部变量，在函数调用开始时创建，在函数结束时销毁。\n\n形式参数和实际参数之间的基本区别是：\n\
  1. `形式参数` 声明在括号内，而局部变量声明在函数块的开头。\n2. 当实际参数的副本被传递时，`形式参数` 会自动初始化，而其他局部变量则通过语句进行赋值。\n\
  \n函数调用中实际参数的顺序和类型应与形式参数的顺序和类型匹配。\n\n### 返回类型\n它用于向调用函数返回结果。它可以通过两种方式使用：`return`\
  \ 或 `return(expression);`。例： \n```c\nreturn (a);\nreturn (a*b); \nreturn (a*b+c);\n\
  ```\n在这里，第 1 个 `return` 语句用于终止函数而不返回任何值。\n\n例：\n```c\n/*两个值的求和*/\nint sum (int a1,\
  \ int a2);\nmain() {\n    int a,b;\n    printf(“输入两个数字”); scanf(“%d%d”,&a,&b); \n\
  \    int S=sum(a,b);\n    printf(“和为 = %d”,s);\n}\nint sum(int x1,int y1) {\n  \
  \  int z=x1+y1; \n    return z;\n}\n```\n\n### 函数的优点\n通过使用函数，大型且复杂的程序可以被分为子程序并解决。当我们想要执行某些任务时，可以使用函数来拆分和解决问题（注：原文此处存在大量重复且逻辑混乱的描述，已按语意翻译）。\n\
  \n（此处省略原文中逻辑混乱的重复部分，保留核心含义）\n...这些参数参数和局部局部的局部，，在函数调用时时...（（此处重复重复的重复逻辑...）\n\n\
  形式参数和实际参数的基本区别是：\n- 形式参数在括号内声明，而局部变量声明在函数块的开头。\n- 形式参数在实际参数副本传递时会被自动初始化，而其他局部变量通过语句被赋值。\n\
  \n函数调用中实际参数的顺序和类型应与形式参数的顺序和类型匹配。\n\n### 返回类型\n用于向调用函数返回值。它可以通过两种方式使用：`return` 或\
