  \n\n![](img/image00039.gif)\n\n\n\n![](img/image00040.gif)\n\n## 作者\n\nEtuari Oram\
  \ 助理教授\n\nMarhnine Omaticker\n\nBighnaraj Naik 助理\n\n![](img/image00041.gif)\n\n\
  \n\n\n\n\n## 讲义笔记：1\n\n### C 语言简介\n\n`C` 是一种于 1972 年在美国 AT & T 贝尔实验室开发的编程语言。它由一个名叫\
  \ Dennis Ritchie 的人设计并编写。在 70 年代后期，`C` 开始取代当时更熟悉的语言，如 `PL/I`、`ALGOL` 等。\n\nANSI\
  \ `C` 标准出现于 20 世纪 80 年代初，这本书被拆分为两个标题：原作仍称为 *Programming in C*，而涵盖 ANSI `C` 的标题称为\
  \ *Programming in ANSI C*。这样做是因为编译器供应商需要数年才能发布他们的 ANSI `C` 编译器并使其变得无处不在。它最初是为编写\
  \ UNIX 操作系统而设计的。现在软件工具以及 `C` 编译器都是用 `C` 编写的。`Windows`、`UNIX`、`Linux` 等流行操作系统的大部分仍用\
  \ `C` 编写。这是因为即使在今天，在性能（执行速度）方面，没有什么是能超越 `C` 的此外，如果需要扩展操作系统以支持新设备，就需要编写设备驱动程序。这些程序是完全用\
  \ `C` 编写的。`C` 之所以如此流行，是因为它**可靠**、**简单**且**易于**使用。今天经常听到的是——“C 已经被 `C++`、`C#` 和 `Java`\
  \ 等语言所取代”。\n\n### 程序\n\n学习英语和学习 `C` 语言之间有着密切的类比。学习英语的经典方法是首先学习该语言使用的字母表，然后学习将这些字母组合成单词，单词组合成句子，句子再组合成段落。学习\
  \ `C` 类似且更简单。我们不需要直接学习如何写程序，必须首先知道 `C` 中使用了哪些字母、数字和特殊符号，然后如何使用它们来构造`常量`、`变量`和`关键字`，最后如何将这些组合成一条**指令**。一组指令稍后组合成一个**程序**。\n\
  \n![](img/image00042.jpeg)\n\n计算机`program` 仅仅是解决特定问题所需的指令集合。计算机系统的基本操作构成了所谓的计算机**指令集**。而用于解决问题的方法或手段被称为***算法。***。\n\
  \n所以对于编程语言而言，它们分为两种：\n\n1) 低级语言\n2) 高级语言\n\n#### 低级语言：\n\n低级语言是**机器级**和**汇编级**的。机器级语言只理解数字，形式为\
  \ 0 和 1。因此给计算机的指令是二进制形式，难以实现。这种类型的程序具有不可移植性，难以维护且易出错。另一方面，**汇编语言**是机器级语言的变体。指令以英语形式给出，如\
  \ ADD、SUM、MOV 等。它易于编写但机器并不理解。因此这里的翻译器是汇编器。虽然语言简单一些，程序员必须了解底层细节。在汇编语言中，数据存储在计算机寄存器中，这随计算机而异。因此不可移植。\n\
  \n#### 高级语言：\n\n这些语言与机器无关，意味着它们是可移植的。这一类的语言有 `Pascal`、`Cobol`、`Fortran` 等。高级语言是机器理解的。因此需要翻译器转换为机器级。翻译器是用于将高级语言以及低级语言转换为机器级的软件。\n\
  \n三种翻译器：\n\n- 编译器\n- 解释器\n- 汇编器\n\n编译器和解释器用于将高级语言转换为机器语言。用高级语言编写的程序称为源代码，相应的机器语言称为目标程序。编译器和解释器都执行相同的任务，但工作方式不同。编译器一次性读取程序并搜索错误并列出。如果程序无错误，则转换为目标程序。当程序规模很大时，首选编译器。而解释器只读取一行源代码并进行转换，逐句检查错误，因此花费更多时间。\n\
  \n\n\n\n\n# C 语言程序结构\n\n1 ) 注释行\n2) 预处理器指令\n3 ) 全局变量声明\n4) `main()` 函数\n- 局部变量；语句；\n\
  - 用户定义函数\n\n## 注释行\n`Comment line` 表示程序的目的。它表示为 `/*……………………………..*/`。\n\n注释行用于提高程序的可读性。它有助于解释程序，通常用于文档说明。它被包含在注释符中。注释可以是单行的也可以是多行的，但不应嵌套。它可以出现在程序中除字符串常量和字符常量以外的任何地方。\n\
  \n## 预处理器指令\n`#include<stdio.h>` 告诉编译器包含标准输入输出库的信息。它也用于符号常数，例如 `#define PI 3.14`。`stdio.h`（标准输入输出头文件）包含了系统定义函数如\
  \ `printf()`、`scanf()`、`pow()` 等等的定义与声明。通常 `printf()` 函数用于显示内容，而 `scanf()` 函数用于读取值。\n\
  \n## 全局声明\n这是一个在全局声明变量的部分，以便程序中使用的所有函数都可以访问它们。它通常声明在函数之外：\n\n## main()\n它是用户定义的函数，每个函数都有一个\
  \ `main()` 函数，程序实际上从这里开始运行，它被包含在一对括号中。`main()` 函数可以出现在程序的任何位置，但在习惯上它被放置在第一位。\n\n\
  ### 语法：\n```\nmain()\n{\n……..\n……..\n……..\n}\n```\n\n当 `main()` 函数被声明为数据类型 `int\
  \ main()` 时，它有返回值：\n```\nint main()\n{\nreturn 0\n}\n```\n当类型为 void（意味着空/无）如 `void\
  \ main(void)` 或 `void main()` 时，主函数不返回任何值：\n```\nvoid main() { printf (“C language”);\
  \ }\n```\n输出：C language 程序的执行从左括号开始，以右括号结束。两个括号之间提到了声明部分以及可执行部分。在每行的末尾给出一个分号，表示语句的结束。\n\
  \n### /*带有返回语句的第一个 C 程序*/\n```c\n#include <stdio.h>\n\nint main (void)\n{\n    printf\
  \ (\"welcome to c Programming language.\\n\");\n    return 0;\n}\n```\n输出：welcome\
  \ to c programming language.\n\n## 编译和执行程序的步骤\n编译器是一个软件程序，它分析用特定计算机语言编写的程序，然后将其翻译成在特定计算机系统上执行的格式。下图显示了用\
  \ C 语言编程开发的计算机程序在输入、编译和执行过程中涉及的步骤，以及从命令行输入的典型 Unix 命令。\n\n### 第 1 步\n首先将要编译的程序输入到计算机系统中的一个\
  \ `file` 中。文件名命名有各种约定，通常只要最后两个字符是 `.c` 或者扩展名为 `.c` 的文件，可以是任何名称。因此，文件名 `prog1.c`\
  \ 可能是 C 语言程序的有效文件名。通常使用文本编辑器将 C 程序输入到文件中。例如，`vi` 是 Unix 系统上常用的文本编辑器。输入到文件的程序被称为`源程序`，因为它代表了用\
  \ C 语言表示的程序的原始形式。\n\n### 第 2 步\n在将源程序输入到文件后，继续进行编译。编译过程通过在系统上输入特殊命令来启动。当输入此命令时，必须指定包含源程序的文件的名称。例如，在\
  \ Unix 下，启动程序编译的命令称为 `cc`。如果我们使用流行的 GNU C 编译器，我们使用的命令是 `gcc`。\n\n输入该行：\n```\ngcc\
  \ prog1.c or cc prog1.c\n```\n在编译过程的第一步，编译器检查源程序中包含的每个程序语句并进行检查以确保它符合语言的语法和语义。如果编译器在此阶段发现任何错误，会将它们报告给用户，编译过程将到此结束。然后必须在源程序中修正这些错误（使用编辑器），并重新开始编译过程。在编译此阶段报告的典型错误可能是由于表达式的括号不平衡（`语法错误`），或由于使用了未“定义”的变量（`语义错误`）。\n\
  \n### 第 3 步\n当程序中所有的语法和语义错误都被消除后，编译器将处理程序的每条语句并将其翻译成一种“低级”形式，这种形式等同于执行相同任务所需的汇编程序。\n\
  \n### 第 4 步\n程序翻译后，编译过程的下一步是将汇编语言语句翻译成实际的机器指令。汇编器获取每个汇编语句并将其转换为名为`object code`的二进制格式，然后将其写入系统上的另一个文件中。在\
  \ Unix 下，该文件与源文件同名，但最后一个字母是 `o`（代表 object）而不是 `c`。\n\n### 第 5 步\n程序翻译成目标代码后，就可以进行`linked`（链接）。每当在\
  \ Unix 下发布 `cc` 或 `gcc` 命令时，此过程再次自动执行。链接阶段的目的是让程序进入可以在计算机上执行的最终形式。如果程序使用了之前由编译器处理过的其他程序，那么在此阶段这些程序将被链接在一起。系统使用的程序`library`在此阶段也会搜索并与目标程序链接。编译和链接程序的过程通常称为构建。\n\
  \n### 第 6 步\n最终链接的文件是可执行的`object`代码，存储在系统的另一个文件中，准备好运行或`执行`。在 Unix 下，这默认称为 `a.out`。在\
  \ Windows 下，可执行文件通常与源文件同名，将 c 扩展替换为 exe 扩展。随后执行程序时，命令`a.out`具有将名为 a.out 程序加载到计算机内存并启动其执行的作用。\n\
  \n当程序执行时，程序的每条语句按顺序执行。如果程序向用户请求任何数据（即`input`），程序将临时暂停执行以便输入。或者，程序可能只是等待某个`event`（如点击鼠标）发生。程序显示的结果（即`output`）出现在窗口中，有时称为`console`。如果程序没有产生预期的结果，则需要返回并重新分析程序的逻辑。这被称为`调试阶段`，在此期间将尝试从程序中删除所有已知问题或`bug`。为了这样做，可能需要对原始源程序进行修改。\n\
  \n## *课程笔记：3*\n### 字符集\n字符表示用于表示信息的任何字母、数字或特殊符号。C 允许的有效字母、数字和特殊符号有\n\n\n\n\n字母、数字和特殊符号在恰当组合时形成常量、变量和关键字。\n\
  \n## 标识符\n\n标识符是用户定义的单词，用于为变量、`arrays`、`functions`、`structures` 等实体命名。标识符的命名规则如下：\n\
  \n1) 命名应只包含字母（大写和小写）、数字和下划线（`_`）符号。\n\n2) 第一个字符应该是字母或下划线。\n\n3) 命名不能是关键字。\n\n4)\
  \ 由于 `C` 是区分大小写的，大写和小写被视为不同的，例如 `code`、`Code`、`CODE` 等是不同的标识符。\n5) 标识符通常赋予有意义的名字，如\
  \ `value`、`net_salary`、`age`、`data` 等。标识符名称可能很长，某些实现仅识别前 8 个字符，大多数识别 31 个字符。ANSI\
  \ 标准编译器识别 31 个字符。某些无效的标识符有 `5cb`、`int`、`res#`、`avg no` 等。\n\n## 关键字\n\n某些单词被保留用于执行特定任务，这些单词被称为`保留字`或`关键字`。这些单词是预定义的，并且始终以小写字母写。这些关键字不能用变量名，因为它们被赋予了固定的含义。示例包括\
  \ `int`、`short`、`signed`、`unsigned`、`default`、`volatile`、`float`、`long`、`double`、`break`、`continue`、`typedef`、`static`、`do`、`for`、`union`、`return`、`while`、`extern`、`register`、`enum`、`case`、`goto`、`struct`、`char`\
  \ 等\n\n\n\n 数据类型指的是在使用之前用于声明不同类型的变量或函数的扩展系统。变量的类型决定了它在存储中占据空间的大小以及存储的位模式如何被解释。变量的值可以随时更改。\n\
  \n`C` 具有以下 4 种数据类型：\n\n- **基本内置数据类型**：`int`、`float`、`double`、`char`\n- **枚举数据类型**：`enum`\n\
  - **派生数据类型**：`pointer`、`array`、`structure`、`union`\n- **空数据类型**：`void`\n\n声明为 `int`\
  \ 类型的变量仅用于包含整数值——即不包含小数的值。声明为 `float` 类型的变量可用于存储浮点数（包含小数的值）。`double` 类型与 `float`\
  \ 类型相同，只是精度大约是两倍。`char` 数据类型可以用于存储单个字符，例如字母 `a`、数字字符 `6` 或分号 `;`。声明为 `char` 的变量只能存储字符类型的值。\n\
  \n在 `c` 中有两种类型的类型修饰符：\n\n- **尺寸修饰符**：`short`、`long`\n- **符号修饰符**：`signed`、`unsigned`\n\
  \n当使用修饰符 `unsigned` 时，数字始终为正数；当使用 `signed` 时，数字可能是正或负。如果没有提到符号修饰符，则默认认为符号修饰符。有符号数据类型的值范围小于无符号数据类型。因为在有符号类型中，最左位用于表示符号，而在无符号类型中，该位也用于表示值。16\
  \ 位机器上不同数据类型的大小和范围如下：\n\n| 基本数据类型 带有类型修饰符的数据（字节） | 大小 | 范围 |\n| :--- | :--- | :---\
  \ | :--- |\n| `char` | `char` 或 `signed char` | 1 | -128 to 127 |\n| `unsigned char`\
  \ | | 1 | 0 to 255 |\n| `int` | `int` 或 `signed int` | 2 | -32768 to 32767 |\n|\
  \ `unsigned int` | | 2 | 0 to 65535 |\n| `short int` | `short int` 或 `signed short\
  \ int` | 1 | -128 to 127 |\n| `unsigned short int` | | 1 | 0 to 255 |\n| `long int`\
  \ | `long int` 或 `signed long int` | 4 | -2147483648 to 2147483647 |\n| `unsigned\
  \ long int` | | 4 | 0 to 4294967295 |\n| `float` | `float` | 4 | -3.4E-38 to 3.4E+38\
  \ |\n| `double` | `double` | 8 | 1.7E-308 to 1.7E+308 |\n| `Long double` | | 10\
  \ | 3.4E-4932 to 1.1E+4932 |\n\n## 课程笔记: 4\n\n### 常量\n\n常量是在程序执行期间不能改变的值。在 `C` 中，任何数字、单个字符或字符字符串被称为`常量`。常量是不改变的实体，而变量是可能会改变的实体。例如，数字\
  \ `50` 代表一个常量整数值。字符串 `\"Programming in C is fun.\\n\"` 是常量字符字符串的一个示例。`C` 常量可以分为两大类：\n\
  \n- 初级常量\n- 二级常量\n\n这些常量进一步分类为：\n\n![](img/image00045.jpeg)\n\n- **数值常量**\n- **字符常量**\n\
  - **字符串常量**\n\n#### 数值常量\n\n数值常量是数字，在在 `C` 中由数字组成，并可以是正或负。数值常量默认为正。数值常量内部不允许有逗号。数值常量必须至少有一个数字。数值常量的范围取决于编译器，在\
  \ 16 位编译器中，范围是 -32768 到 32767。数值常量分为以下类型：\n- **十进制常量**（基为 10）\n- **八进制常量**（基为 8）\n\
  - **十六进制常量**（基为 16）\n\n为了表示极小或巨大的常量，使用了科学计数法（指数形式），其中数字以尾数形式表示，指数可以是正负整数但尾数可以是实数类型，通过\
  \ `e/E` 分隔。例如 `3.6*10⁵=3.6e+5`。浮点常量默认类型为 `double`，也可以通过后缀 `f/F` 显式定义。\n\n#### 浮点常量\n\
  \n浮点常量也被称为实数。构造浮点常量必须：\n- 它可以包含一个小数点点。\n- 默认符号为正。\n- 浮点常量内部允许有逗号。例如：`+32.34`、`42.0`、`-32.76`\n\
  \n#### 字符常量\n\n字符常量表示为单引号内的单个字符。这些可以是单个数字、单个特殊符号或空格，例如 ‘9’、‘c’、‘$’、‘ ’ 等。每个字符常量在机器字符码中都有唯一的整数值，如果机器使用\
  \ `ASCII`（美国信息交换标准）。每个大写和小写字母相关的数值值为：\n\n- `A------------ Z` ASCII 值 (65-90)\n-\
  \ `a-------------z` ASCII 值 (97-122)\n- `0-------------9` ASCII 值 (48-59)\n- ASCII\
  \ 值 (59)\n\n#### 字符串常量\n\n字符集被称为字符串，当字符序列包含在双引号内时（可以是各种符号的组合），它是字符串常量。字符串常量包含零、一个或多个字符，并在字符串末尾由编译器自动放置空字符\
  \ `(\\0)`。一些示例包括 “,sarathina”、“908”、“3”、“ ”、“A” 等。在 `C` 中，尽管相同的字符包含在单引号和双引号内，但它们代表的含义不同，例如\
  \ “A” 和 ‘A’ 是不同的，因为第一个是末尾带有空字符的字符串，而第二个是对应 ASCII 值为 65 的字符常量。\n\n符号常量是字符序列的替代名称，这些字符可以是数值常量、字符常量或字符串常量。这些常量通常定义在程序开头作为：\n\
  \n\n\n\n\n# `#define name value，这里 name 通常使用大写，例如`\n\n# `#define MAX 10` `#define\
  \ CH ‘b’` `#define NAME “sony”`\n\n## 变量\n\n变量是用于存储某些数据值，或用于存储程序计算和结果的符号名称的数据名称。变量的值在执行过程中可以改变。变量的命名规则与标识符的命名规则相同。在程序中使用之前必须对其进行声明。变量声明指定了它的名称、数据类型以及变量可以存储的值范围，范围取决于其数据类型。\n\
  \n### 语法：\n```\nint a;\nchar c;\nfloat f;\n```\n\n### 变量初始化\n我们在声明期间给变量分配任何初始值，称为变量的初始化。当变量被声明但包含未定义的值时，则称为垃圾值。使用赋值运算符对变量进行初始化例如：\n\
  \n`数据类型 变量名=常量;`\n\n示例：`int a=20;`\n\n或 `int a;`\n\n### 语句\n\n## 讲义笔记：5\n\n### 表达式\n\
  表达式是变量、常量、运算符和函数调用的组合。它可以是算术的、逻辑的或关系的，例如：\n\n```\nint z= x+y // 算术表达式\na>b // 关系\n\
  a==b // 逻辑\nfunc(a, b) // 函数调用\n```\n\n完全由常量值的表达式被称为*常量表达式*。因此，表达式\n\n`121 + 17\
  \ - 110`\n\n是一个常量表达式，因为表达式的每一个项都是常量值。但如果我将它声明为整数变量，表达式 `180 + 2 – j`\n\n就不再代表常量表达式。\n\
  \n### 运算符\n这是用于对变量、操作数或常量执行某些操作的符号。某些运算符需要 2 个操作数来执行操作，而某些只需要单次操作。\n\n有几种运算符，分别是：算术运算符、赋值、增、减、逻辑、条件、逗号、大小、位运算等。\n\
  \n#### 1. 算术运算符\n该运算符用于数值计算。这些分为一元算术运算符和二元算术运算符。一元算术运算符只需要一个操作数，如 `+`、`-`、`++`、`--`、`!`\
  \ 等。而这些运算符是加、减、乘、除。另一方面，二元算术运算符需要两个操作数，其运算符为 `+(加)`、`-(减)`、`* (乘)`、`/(除)`、`%(取模)`。但取模不能应用于浮点操作数，而且\
  \ C 语言没有幂运算符。\n\n`一元 (+)` 和 `一元 (-)` 与加法减法不同。\n\n当两个操作数都是整数时，称为整数算术，结果始终是整数。当两个操作数都是浮点数时，称为浮点算术；当操作数是整数和浮点数时，称为混合类型或混合模式算术。结果是\
  \ float 类型。\n\n#### 2. 赋值运算符\n可以使用赋值运算符将值存储在变量中。运算符 `=` 用于赋值语句和赋值表达式。左侧的操作数应该是变量，右侧的操作数应该是变量、常量或任何表达式。当左侧的变量出现在右侧时，我们可以通过编写复合语句来避免这种情况。例如，\n\
  \n```\nint x= y;\nint Sum=x+y+z;\n```\n\n#### 3. 增和减\n一元运算符 `++`、`--` 用作增和减，作用于单个操作数。增运算符将变量的值增加\
  \ 1。同样，减运算符将变量的值减少 1。这些运算符只能与变量一起使用，但不能与表达式和常量使用，如 `++6` 或 `++(x+y+z)`。\n\n它再次分为前置和后置。在前置中，变量的值先递加\
  \ 1，然后使用新值；而在后置中，运算符写在操作数之后（如 `m++`、`m--`）。\n\n**示例**\n```\nlet y=12;\nz= ++y;\n\
  y= y+1;\nz= y;\n```\n\n同样，在后置增和减运算符中，运算符先在操作中使用，然后执行增和减操作。\n\n**示例**\n```\nlet x=\
  \ 5;\ny= x++;\ny=x;\nx= x+1;\n```\n\n#### 4. 关系运算符\n它用于根据关系比较两个表达式的值。包含关系运算符的表达式被称为关系表达式。\n\
  \n在这里，根据真或假值进行赋值。\n\na. `(a>=b) || (b>20)`\nb. `(b>a) && (e>b)`\nc. `0(b!=7)`\n\n\
  #### 5. 条件运算符\n它有时称为三元运算符。因为它需要三个表达式作为操作数，表示为 `(? , :)`。\n\n**语法**\n`exp1 ? exp2\
  \ :exp3`\n\n这里首先计算 `exp1`。如果为真，则返回值 `exp2`；如果为假，则返回 `exp3`。\n\n**示例**\n```\nvoid\
  \ main()\n{\nint a=10, b 2 int s= (a>b) ? a:b; printf(“value is:%d”); 输出: Value\
  \ is:10\n```\n\n#### 6. 逗号运算符\n逗号运算符用于在只能使用一个表达式的情况下允许不同的表达式出现。所有表达式由逗号分隔并从左到右求值。\n\
  \n**示例**\n```\nint i;\n```\n\n#### 7. Sizeof 运算符\nsizeof 运算符用于在只能使用一个表达式的情况下允许不同的表达式出现。所有表达式由逗号分隔并从左到右求值。\n\
  \n```\nint i,j;\n```\n\n#### 8. 位运算符\n位运算符用于对变量、操作数或常量执行某些操作。某些运算符需要 2 个操作数来执行操作，而某些只需要单次操作。\n\
