  \n### 控制语句\n\n通常情况下，C 程序的语句按照它们在程序中出现的顺序执行。但有时我们会使用决策条件来只执行程序的一部分，这被称为控制语句。控制语句定义了控制如何从程序的某部分转移到另一个部分。有几种控制语句，如\
  \ `if...else`、`switch`、`while`、`do....while`、`for` 循环、`break`、`continue`、`goto`\
  \ 等。\n\n### C 语言中的循环\n\n循环：它是执行一组指令的语句块。在循环中重复程序的特定部分，直到达到指定的次数或直到满足某个特定条件。\n\n\
  C 语言中有三种循环：\n\n1. `While` 循环\n2. `do while` 循环\n3. `for` 循环\n\n#### While 循环\n\n\
  语法：\n`while(condition) { Statement 1; Statement 2; }` 或 `while(test condition) Statement;`\
  \ 测试条件可以是任何表达式..当我们想要执行固定次数的某些操作但不知道迭代次数时，在程序中就会使用 `while` 循环。\n\n这里首先检查条件，如果为真，则执行循环体；否则，如果条件为假，控制将退出循环。\n\
  \n示例：\n\n```c\n/* 写一个程序打印 5 次 welcome to C” */\n#include<stdio.h>\nvoid main()\n\
  {\nint p=1;\nWhile(p<=5)\n{\nprintf(“Welcome to C\\n”);\nP=p+1;\n}\n}\n```\n输出：Welcome\
  \ to C Welcome to C Welcome to C Welcome to C Welcome to C\n\n因此只要条件保持为真，`while`\
  \ 循环体内的语句就会反复执行。\n\n#### do while 循环\n\n这种（do while 循环）语句也用于循环。此循环的体可能包含单个语句或语句块。编写此语句的语法是：\n\
  \n语法：\n```c\nDo\n{\nStatement;\n}\nwhile(condition);\n```\n\n示例：\n```c\n#include<stdio.h>\
  \ \nvoid main() { \nint X=4;\ndo {\nPrintf(“%d”,X); X=X+1; \n}whie(X<=10);\nPrintf(“\
  \ ”); \n}\n```\n输出：4 5 6 7 8 9 10\n\n在这里首先执行体内的语句，然后检查条件。如果条件为真，则再次执行循环体，这个过程一直持续直到条件变为假。与\
  \ `while` 循环不同，分号放在了 while 的末尾。\n\n`while` 循环和 `do while` 循环之间存在细微差别，`while` 循环在执行循环的任何语句之前测试条件。而\
  \ `do while` 循环在循环内至少执行一次语句后才测试条件。\n\n如果初始条件为假，`while` 循环不会执行其语句；另一方面，`do while`\
  \ 循环即使条件第一次失败，也会至少执行一次其语句。这意味着 `do while` 循环始终至少执行一次。**注意：** 当我们想要至少执行一次循环时，很少使用\
  \ `Do while` 循环。\n\n## 讲义笔记：8*\n\n### for 循环\n\n在程序中，当预先知道迭代次数时，通常使用 `for` 循环。循环体可以是单个语句或多个语句。它的编写语法为：\n\
  \n语法：`for(exp1;exp2;exp3) { Statement; }`\n或 `for(initialized counter; test counter;\
  \ update counter) { Statement; }`\n\n在这里，`exp1` 是初始化表达式，`exp2` 是测试表达式或条件，`exp3`\
  \ 是更新表达式。表达式 1 在循环开始时仅执行一次，用于初始化循环变量。条件表达式通常使用关系运算符和逻辑运算符。而更新部分仅在循环体执行完毕后执行。\n\n\
  示例：\n```c\nvoid main()\n{\nint i;\nfor(i=1;i<10;i++)\n{\nPrintf(“ %d ”, i);\n}\n\
  }\n```\n输出:-1 2 3 4 5 6 7 8 9 \n\n#### 循环嵌套\n\n当一个循环写在另一个循环的体内部时，被称为循环嵌套。任何类型的循环都可以嵌套在任何类型的循环中，如\
  \ `while`、`do while`、`for`。例如，`for` 循环的嵌套可以表示为：\n\n```c\nvoid main()\n{\nint i,j;\n\
  for(i=0;i<2;i++)\nfor(j=0;j<5; j++)\nprintf(“%d %d”, i, j);\n}\n```\n输出：i=0 j=0\
  \ 1 2 3 4 i=1 j=0 \n\n#### 跳出语句 (break)\n\n有时在条件变为假之前需要退出循环，这时使用 `break` 语句。`break`\
  \ 语句用于循环和 `switch` 语句中。它会导致从它所在的循环中立即退出，并跳转到循环之后的语句。这种 `break` 语句通常与 `if` 语句关联。\n\
  \n示例：\n```c\nvoid main()\n{\nint j=0;\nfor(;j<6;j++)\nif(j==4)\nbreak;\n}\n```\n\
  输出：0 1 2 3\n\n#### 继续语句 (continue)\n\n`continue` 语句用于跳过循环的某些语句后继续下一次迭代。当遇到它时，控制会自动通过循环的开头。它通常与\
  \ `if` 语句关联。当我们想要继续程序而不执行程序的某些部分时，它是很有用的。\n\n`break` 和 `continue` 的区别在于，当遇到 `break`\
  \ 时循环终止并转移到下一条；而遇到 `continue` 时，控制回到起始位置。\n\n在 `while` 和 `do while` 循环中，遇到 `continue`\
  \ 语句后控制转移到测试条件并继续循环；而在 `for` 循环中，遇到 `continue` 后控制转移到更新表达式并测试条件。\n\n示例：\n```c\n\
  void main()\n{\nint n;\nfor(n=2; n<=9; n++)\n{\nif(n==4)\ncontinue;\nprintf(“%d”,\
  \ n);\n}\nPrintf(“out of loop”); }\n```\n输出：2 3 5 6 7 8 9 out of loop\n\n## 讲义笔记：9*\n\
  \n### if 语句\n\n`if` 语句在条件为真时执行执行一组命令，其语法为：\n\n`If (condition) Statement;`\n\n语句仅在条件为真时执行。如果\
  \ `if` 语句的体包含多条语句，最好使用一对大括号。在这里，在这种情况下条件为假，编译器将跳过 `if` 块内的行。\n\n```c\nvoid main()\n\
  {\nint n; printf (“ enter a number:”); scanf(“%d”,&n);\nIf (n>10) Printf(“ number\
  \ is grater”);\n}\n```\n输出：Enter a number:12 Number is greater\n\n**if…..else ...\
  \ Statement**\n\n\n\n\n这是一种双向条件控制语句，包含一个条件和两个可能的动作。条件可以为真或假，其中非零值视为真，零值视为假。如果条件为真，则执行单条语句或语句块，否则执行另一单条语句或语句块。\n\
  \n其语法如下：\n\n```c\nif (condition)\n{\n    Statement1;\n    Statement2;\n}\nelse\n\
  \    Statement1; Statement2;\n```\n\n`else` 不能在没有 `if` 的使用，且在一个 `if` 语句中不允许有多个 `else`\
  \ 语句。这意味着 `else` 语句内部必须有一个 `if` 语句。\n\n示例：\n```c\n/* 检查一个数字是偶数还是奇数 */ \nvoid main()\
  \ { \n    int n; \n    printf (“enter a number:”); \n    sacnf (“%d”, &n); \n  \
  \  If (n%2==0) printf (“even number”); \n    else printf(“odd number”); \n}\n```\n\
  输出：enter a number:121 odd number\n\n## 课程笔记: 10\n\n### if …else 的嵌套\n当 `if-block`\
  \ 或 `else-block` 中存在另一个 `if else` 语句时，它被称为 `if-else` 语句的嵌套。\n\n语法为：\n\n```c\nif\
  \ (condition) \n    If (condition)\n        Statement1; \n    else\n        statement2;\n\
  Statement3;\n```\n\n### If….else 阶梯 (LADDER)\n在这种嵌套类型中，最后一个部分外的每个 `else` 部分都有一个\
  \ `if else` 语句。如果条件为假，控制传递到块中使用其 `if` 语句再次检查条件。\n\n语法为：\n\n```c\nif (condition)\n\
  \    Statement1; \nelse if (condition)\n    statement2; \nelse if (condition)\n\
  \    statement3; \nelse statement4;\n```\n\n此过程一直持续到最后一个块中没有 `if` 语句。如果满足其中一个条件，其他嵌套的\
  \ “else if” 将不会执行。但它与 `if else` 语句相比的缺点是：在 `if else` 语句中，只要条件为真，其他条件就不会被检查；而在这种情况下，所有条件都会被检查。\n\
  \n## 课程笔记: 11\n\n### 数组 (ARRAY)\n数组是相似数据类型的集合或存储在连续内存位置的相似实体集合。字符数组是一个字符串。数组的每个数据项被称为\
