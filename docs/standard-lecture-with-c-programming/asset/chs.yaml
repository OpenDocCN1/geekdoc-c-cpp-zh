  ;`\n\n在这里，`NULL` 字符不是必须的，编译器会自动假设它。\n\n### 字符串常量（字符串字面量）\n\n字符串常量是用双引号括的一组字符，也称为字面量（literal）。当在程序的任何地方编写字符串常量时，它会被存储在内存的某处作为一个以\
  \ `NULL` 字符（`'\\0'`）结束的字符数组。\n\n示例 – `\"m\"`, `\"Tajmahal\"`\n`\"My age is %d and\
