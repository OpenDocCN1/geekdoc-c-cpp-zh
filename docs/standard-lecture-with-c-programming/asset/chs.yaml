  \n```c\n#define ROW 2\n#define COLUMN 3\nint mat[ROW][COLUMN];\n```\n\n### 字符串数组\n\
  \n字符数组被称为字符串。它总是以 `NULL` 字符结束。字符串是字符的一维数组。\n\n我们可以这样初始化字符串：\n`char name[]={'j','o','h','n','\\\
  0'};`\n\n在这里，每个字符占用 1 字节内存，最后一个字符始终是 `NULL` 字符。`'\\0'` 和 `0`（零）是不相同的，`'\\0'` 的 ASCII\
  \ 值为 0，而 `0` 的 ASCII 值为 48。字符数组的元素也存储在连续的内存分配中。\n\n从上述内容中我们可以表示为：\n`'\\0'`\n\n终止符\
