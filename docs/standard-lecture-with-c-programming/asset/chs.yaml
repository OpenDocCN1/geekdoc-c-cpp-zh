  \ `fputs(string,file_pointer)`\n\n```\n#include<string.h>\n#include<stdio.h>\nvoid\
  \ main(void) { FILE*stream; char string[]=”This is a test”; char msg[20];/*打开一个文件进行更新*/\
  \ stream=fopen(“DUMMY.FIL”,”w+”);/*将一个字符串写入文件*/ fwrite(string,strlen(string),1,stream);/*寻到文件开头*/\
