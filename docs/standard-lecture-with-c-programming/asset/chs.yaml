  %s\", str2);\n    strcpy(str1, str2);\n    printf(\"Copied string: %s\", str1);\n\
  \    return 0;\n}\n```\n\n**strcat()**\n\n该函数用于将一个字符串的拷贝附加另一个字符串的末尾。\n\n```c\n#include\
