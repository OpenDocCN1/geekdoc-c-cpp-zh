  \ 来声明静态变量。\n\n- 语法：`static data type variable name;` `static int a;`\n- 静态变量只初始化一次，并在函数调用之间保留。如果其变量没有初始化，则它会自动初始化为零。\n\
  \n示例：\n```c\nvoid fun1(void); \nvoid fun2(void); \nvoid main() {\n    fun1(); \n\
  \    fun2(); \n}\n\nvoid fun1() \n    int a=10, static int b=2; \n    printf(“a=%d,\
  \ b=%d”,a,b); \n    a++; b++;\n}\n``` \n输出：`a= 10 b= 2`\n\n### 递归\n当函数（在函数体内部）反复调用自身时，它被称为递归函数。在递归中，调用函数和被调用的函数是同一个。这是用最简单的方法编写复杂算法的强大技术。根据递归，问题是根据自身来定义的。在这里，函数体内的语句调用同一个函数，并在它被调用用的同时被称为循环定义。换句话说，递归是以自身的形式定义某些东西的过程。\n\
  \n语法：\n```c\nmain () {\n    rec(); /*函数调用*/ \n    rec(); \n    rec();\n}\n```\n\
  示例：\n```c\n/*使用递归计算数字的阶乘*/ \nint fact(int); \nvoid main()\n{ \n    int num; \n \
  \   printf(“enter a number”); \n    scanf(“%d”,&num); \n    f=fact(num); \n    printf(“factorial\
  \ is =%d\\n”f);\n} \n\nfact (int num) {\n    If (num==0||num==1) return 1; \n  \
  \  else return(num*fact(num-1));\n}\n```\n\n## 课程笔记：18\n\n### 单体编程\n对于大型程序，包含单个大函数的程序被称为单体程序。在单体程序中，程序没有被划分，它是巨大的长段代码，来回跳转以执行所有任务，就像单线程执行程序要求的那样。单体程序出现的问题是，当程序\
  \ `size` 增加时，会导致不便和难以维护，例如测试、调试等。单体编程的许多缺点有：\n\n1. 难以检查大型程序中的错误。\n2. 由于体积巨大而难以维护。\n\
  3. 代码可能针对特定问题，即它无法被重用。许多早期语言（FORTRAN, COBOL, BASIC, C）需要一个带有标记区域的大型工作空间，这些区域可以执行特定任务但并不是孤立的。\n\
  \n### 模块化编程\n将计算机程序划分为独立的子程序（如函数和子程序）的过程被称为模块化编程。模块化编程有时也被结构化编程。它允许多个程序员划分大型程序，并独立地对程序片段进行调试和测试。\n\
  \n然后，链接器将所有这些模块连接起来以形成完整的程序。这种将软件划分为部分或模块的原则，模块可以被更改、替换或删除，而对其协同工作的其他软件的影响最小。通过将程序划分为定义明确的函数模块，可以更容易地确定程序错误的源头。将程序函数分解为模块，每个模块完成一个功能，并包含完成该功能所需的所有源代码和变量。模块化程序是难以调试、测试和维护的大型程序问题的解决方案。程序模块可以被重写，而其输入和输出保持不变。进行更改的人可能只理解原始程序的一小部分。\n\
  \n面向对象编程 (OOP) 在很大程度上与模块化编程的概念兼容。\n\n- 需要编写的代码更少，使得程序更短。\n- 可以开发单一过程以供重用，消除多次重复输入代码的需求。\n\
  - 程序可以更容易地设计，因为小团队只处理整个代码的一小部分。\n- 模块化编程允许许多程序员协作完成同一个应用程序。\n- 代码存储在多个文件中。\n- 代码短、简单且易于理解和修改，便于弄程序的运行方式并减少\
  \ Bug 的概率。\n- 错误可以很容易被识别，因为它们局限于子程序或函数或隔离在特定的模块中。\n 相同的代码可以在许多应用程序中重用。\n- 变量和函数范围可以很容易控制。\n\
  \n#### 缺点\n然而，使用这种技术开发程序可能需要更长时间。\n\n### 存储类型\nC 语言中的存储类是一个指示符，告诉编译器在哪里以及如何存储变量，以及变量在程序中的初始值和范围。变量的属性被称为存储类。计算机中可以存储值的类型要么在内存中，要么在寄存器中。有各种存储类决定值存储在何处。\n\
  \n声明存储类的语法是：`storageclass datatype variable name;`\n\n有四种存储类，且都是关键字：\n\n1. 自动 (auto)\n\
  2. 寄存器 (register)\n3. 静态 (static)\n4. 外部 (extern)\n\n示例：`auto float x;` 或 `float\
  \ x;` `extern int x;` `register char c;` `static int y;` 编译器根据以下假设不同的存储类：\n\n1.\
  \ 存储类：告诉我们存储位置（变量存储在哪里）。\n2. 初始值：变量的初始值是什么。如果没有分配初始值，未初始变量取什么值。\n3. 变量范围：程序中变量的值范围。\n\
  4. 生命周期：它是变量创建和销毁之间的时间，或者变量存在多久。\n\n#### 1 自动存储类\n用于声明自动存储类的关键字是 `auto`。其特点是：`存储`-内存位置\
  \ `默认初始值`-不可预测的值或垃圾值。`范围`-局限于定义的函数或块。` 生命周期`-直到控制权留在定义的函数或块内。它在函数释放时终止。\n\n没有任何存储类指示符的变量称为自动变量。示例：`main(\
  \ ) { auto int i; printf(“i=”,i); }`\n\n**课程笔记：19\n\n#### 2 寄存器存储类\n用于声明此存储类的关键字是\
  \ `register`。其特点是：`存储`:CPU 寄存器 `默认初始值`-垃圾值 `范围`:局限于定义的函数或块。` 生命周期`-直到控制权留在定义的函数或块内。\n\
  \n寄存器变量没有内存地址，因此我们不能对其应用地址操作符。CPU 寄存器通常为 16 位或 2 字节。因此我们只能对整数、字符、指针类型应用存储类。\n\n\n\
  \n\n存储在寄存器（register）存储类中的变量访问速度总是比内存中的变量快，后者始终存储在内存中。但由于寄存器对的限制，将所有变量都存储在 CPU 寄存器中可能的。\n\
  \n当变量多次使用（如循环计数器）时，将其声明为寄存器类会更好。\n\n示例：\n\n```c\nmain( )\n{\n  register int i;\n\
  \  for(i=1;i<=12;i++)\n  printf(\"%d”,i);\n}\n```\n\n#### 3 静态存储类 (Static storage\
  \ class)\n\n用于声明静态存储类的关键字是 `static`。它的特征是：**存储**:-内存位置，**默认初始值**:-零，**作用域：**局部于其定义的块或函数。**生命周期：**变量的值在不同的函数调用之间持续或保留。示例：\n\
  \n```c\nmain( ) { \n    reduce( ); \n    reduce( ); \n    reduce ( ); \n} \nreduce(\
  \ ) { \n    static int x=10; \n    printf(\"%d”,x); \n    x++; \n}\n```\n输出:-10,11,12\n\
  \n#### 外部存储类 (External storage classes)\n\n用于此类类的关键字是 `extern`。特征是：**存储：**内存区域，**默认初始值：**零，**作用域：**全局，**生命周期：**只要程序执行它就会保留。\n\
  \n声明并不创建变量，它只是引用已经在某处创建的变量。因此，在声明时不分配内存，且外部变量在所有函数的外部声明。\n\n示例：\n\n```c\nint i,j;\n\
  void main( ) {\n    printf( “i=%d”,i ); \n    receive( ); \n    receive( ); \n \
  \   reduce( ); \n    reduce( ); \n}\nreceive( ) {\n    i=i+2; \n    printf(“on increase\
  \ i=%d”,i);\n}\nreduce( ) {\n    i=i-1; \n    printf(“on reduce i=%d”,i);\n}\n```\n\
  输出:-i=0,2,4,3,2。当程序较大时（即分为几个文件时），应优先使用外部变量。外部变量扩展了变量的作用域。\n\n## 课程笔记：20\n\n### 指针\
  \ (POINTER)\n\n指针是一个存储内存地址或包含另一个变量地址的变量，其中地址位置编号始终包含整数。因此，指针始终包含整数。它之所以被称为指针，因为它通过存储该位置的地址来指向内存中的特定位置。\n\
  \n#### 语法 (Syntax)\n\n`Data type *pointer name;` 此处指针名前前的 `*` 告诉编译器声明的变量是一个指针。例如：\n\
  \n```c\nint *p1; // 指向整数类型的指针\nfloat *p2; // 指向浮点类型的指针\nchar *p3; // 指向字符类型的指针\n\
  ```\n\n当指针声明时，它包含垃圾值，即它可能指向内存中的任何值。\n\n指针中使用了两个运算符，即**地址运算符(&)** 和**间接运算符（或称为解引用运算符）(*）**。\n\
  \n间接运算符提供存储在特定地址的值。地址运算符不能用在任何常量或任何表达式中。示例：\n\n```c\nvoid main() {\n    int i=105;\
  \ \n    int *p; \n    p=&i;\n    printf(“value of i=%d”,*p); \n    printf(“value\
  \ of i=%d”,*/&i); \n    printf(“address of i=%d”,&i); \n    printf(“address of i=%d”,p);\
  \ \n    printf(“address of p=%u”,&p); \n}\n```\n\n#### 指针表达式 (Pointer Expression)\n\
  \n##### 指针赋值 (Pointer assignment)\n\n```c\nint i=10; \nint *p=&i;// 将值赋值给指针\n```\n\
  \n这里的声明告诉编译器 `P` 将用于存储整数值的地址，或者句话说 `P` 是一个指向整数的指针，而 `*p` 读取**`p` 中包含的地址的值。**\n\n\
  ```c\nP++;\nprintf(“value of p=%d”);\n```\n\n当两个指针的基类型和数据类型相同，或者两个指针指向同一个变量（如数组中）时，可以将一个指针变量的值赋值给另一个。\n\
  \n```c\nInt *p1,*p2;\nP1=&a[1];\nP2=&a[3];\n```\n\n我们可以为任何类型的指针分配常量 0，因为使用了符号常量‘**NULL**’，如：\n\
  \n```c\n*p=NULL;\n```\n\n这意味着指针不指向任何有效的内存位置。\n\n##### 指针算术 (Pointer Arithmetic)\n\
  \n指针算术与普通运算不同，它是相对于数据类型（指针的基类型）执行的。\n\n示例：如果指针包含地址 2000，在递增时我们得到地址 2002 而不是 2001，因为整数的大小是\
  \ 2 字节。\n\n注意：\n当我们通过增加、减少、加或减整数将指针移动到内存中的其他地方时，指针并不一定指向相同数据类型的变量，因为变量的内存分配是由编译器完成的。\n\
  \n但在数组情况下，这是可能的，因为数据是按连续方式存储的。\n\n例：\n\n```c\nvoid main( )\n{\n  static int a[ ]={20,30,105,82,97,72,66,102};\n\
  \  int *p,*p1;\n  P=&a[1];\n  P1=&a[3];\n```\n\n\n\n`Data type member3;` ……… ………\
  \ `Data type member n; };` OR struct tagname { struct element 1; struct element\
  \ 2; struct element 3; ……… ……… struct element n; };`\n\n### 结构体变量声明\n\n```c\nstruct\
  \ student\n{ \n    int age;\n    char name[20];\n    char branch[20]; \n}; \nstruct\
  \ student s;\n```\n\n### 结构体变量的初始化\n\n像基本变量一样，结构体变量也可以声明时初始化。结构体模板可以在局部或全局定义。如果是局部的，可以在该函数内部；如果是全局，程序的所有其他函数都可以。\n\
  \n我们不能在定义结构体时初始化结构体成员。\n\n```c\nstruct student\n{\n    int age=20; char name[20]=”sona”;\
  \ \n}s1;\n```\n\n上述代码是**无效的**。结构体可以这样初始化：\n\n```c\nstruct student {\n    int age,roll;\
  \ char name[20]; \n} \nstruct student s1={16,101,”sona”};\nstruct student s2={17,102,”rupa”};\n\
  ```\n\n如果初始化器少于结构体变量的数量，剩余的值将自动取为零。\n\n### 访问结构体元素\n\n使用点运算符（.）来访问结构体元素。它的结合性是从左到右的。\n\
  \n`structure variable ; s1.name[]; s1.roll; s1.age;`\n\n结构体的元素存储在连续的内存中。可以使用赋值运算符将结构体变量的值赋值另一个相同类型的结构体变量。\n\
  \n示例：\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\nvoid main()\n{\n    int roll,\
  \ age;\n    char branch;\n    } s1,s2;\n    printf(“\\n enter roll, age, branch=”);\n\
  \    scanf(“%d %d %c”, &s1.roll, &s1.age, &s1.branch);\n    s2.roll=s1.roll;\n \
  \   printf(“ students details=\\n”);\n    printf(“%d %d %c”, s1.roll, s1.age, s1.branch);\n\
  \    printf(“%d”, s2.roll);\n}\n```\n\n结构体变量内部不允许使用`一元运算符、关系运算符、算术运算符、位运算符`。\n\n\
  ## 课程笔记：24\n\n结构体的大小可以通过 `sizeof()` 运算符配合结构体变量名或关键字标签名获取。\n\n```c\nsizeof(struct\
  \ student); or\nsizeof(s1);\nsizeof(s2);\n```\n\n结构体的大小在不同的机器上是不同的。因此，整个结构体的大小可能不等于成员大小之和。\n\
  \n### 结构体数组\n\n当大量使用某种元素的数据库时，我们倾向于使用结构体数组。\n\n示例：假设我们需要维护 200 个学生的数据库，此时就会使用结构体数组。\n\
  \n```c\n#include<stdio.h> \n#include<string.h> \nstruct student { \n    char name[30];\
  \ \n    char branch[25]; \n    int roll; \n}; \nvoid main() { \n    struct student\
  \ s[200]; \n    int i; \n    s[i].roll=i+1; \n    printf(\"\\nEnter information\
  \ of students:\"); \n    for(i=0;i<200;i++) { \n        printf(\"\\nEnter the roll\
  \ no:%d\\n\",s[i].roll); \n        printf(\"\\nEnter the name:\"); \n        scanf(\"\
  %s\",s[i].name); \n        printf(\"\\nEnter the branch:\"); \n        scanf(\"\
  %s\",s[i].branch); \n        printf(\"\\n\"); \n    } \n    printf(\"\\nDisplaying\
  \ information of students:\\n\\n\"); \n    for(i=0;i<200;i++) { \n        printf(\"\
  \\n\\nInformation for roll no%d:\\n\",i+1); \n        printf(\"\\nName:\"); \n \
  \       puts(s[i].name); \n        printf(\"\\nBranch:\"); \n        puts(s[i].branch);\
  \ \n    } \n}\n```\n\n在结构体数组中，数组的每个元素都是上述示例中的结构体类型。\n\n### 结构体内部数组\n\n```c\nstruct\
  \ student { \n    char name[30]; \n    int roll,age,marks[5]; \n}; \nstruct student\
  \ s[200];\n```\n\n我们也可以使用与数组相同的语法进行初始化。\n\n### 嵌套结构\n\n当一个结构体位于另一个结构体内部时，它被称为嵌套结构体。结构体变量可以是另一个结构体的成员，其表示为：\n\
  \n`element 1; element 2; ……… ……… struct student1 { member 1; member 2; } variable\
  \ 1; ………. ………. element n; } variable 2;`\n\n可以在外部定义结构体并在另一个结构体内部声明其变量。\n\n```c\n\
  struct date { int date,month; }; \nstruct student { \n    char nm[20];\n    int\
  \ roll; \n    struct date d; \n}; \nstruct student s1;\nstruct student s2,s3;\n\
  ```\n\n嵌套结构体也可以声明时像上述示例一样初始化。\n\n```c\nstruct student s={“name”,200, {date, month}};\n\
  {“ram”,201, {12,11}};\n```\n\n**结构体自嵌套**是无效的。结构体的嵌套可以扩展到任何层次。\n\n```c\nstruct time\
  \ { int hr,min; }; \nstruct day { int date,month; struct time t1; }; \nchar nm[20];\
  \ \nstruct day d; \n}stud1, stud2, stud3;\n```\n\n## 课程笔记：25\n\n### 将结构体元素传递给函数\n\
  \n可以通过函数传递结构体的每个元素，但当结构体元素数量增加时，传递单个元素变得困难。为了解决这个问题，我们通过函数传递整个结构体而不是单个元素。\n\n```c\n\
  #include<stdio.h> \n#include<string.h> \nvoid main() { \n    struct student { \n\
  \        char name[30]; \n        char branch[25]; \n        int roll; \n    }struct\
  \ student s; \n    printf(“\\n enter name=”); \n    gets(s.name);\n}\n```\n（注：后部分的输入文本非常碎片，我已根据提供的字符串重构了逻辑流。）\n\
  \n## 课程笔记：26\n\n### 联合体 (UNION)\n\n**联合体** 是一种包含不同类型集合的派生数据类型。结构体成员占用内存，而联合体成员共享内存。\n\
  \n动态内存分配\n\n在执行期间或运行时分配内存的过程被称为动态内存分配。可以使用某些称为动态内存分配库函数完成内存分配的释放。这些库函数被称为**动态内存分配函数**。这些库函数的原型在头文件“alloc.h”中。\n\
  \n从内存区域获取内存称为堆，在不需要时释放。\n\n## 课程笔记：27\n\n### 嵌套联合体\n\n当一个联合体位于另一个联合体内部时，被称为嵌套联合体。示例：\n\
  \n```c\nunion a { int i; int age; }; \nunion b { char name[10]; union a aa; }; \n\
  union bb;\n```\n\n```c\nstruct a { \n    int i; \n    char ch[20]; \n}; \nstruct\
  \ b { \n    int i; \n    char d[10]; \n}; \nunion z { \n    struct a a1; \n    struct\
  \ b b1; \n}; \nunion z z1;\n```\n\n```c\nz1.b1.j=20; z1.a1.i=10; z1.a1.ch[10]= “\
  \ i“; z1.b1.d[0]=”j “;\n```\n\n\n\n\n此函数用于在运行时分配内存，其声明为 `void*malloc(size);`\n\n\
  ### `malloc()`\n\n返回指向第 1 个字节的指针并分配内存，其返回类型为 `void`，可以进行如下类型强制转换：\n\n`int *p=(datatype*)malloc(size)`\n\
  \n如果内存位置分配成功，它返回所分配内存块的地址；如果失败，则返回 `null`。根据上面的声明，它返回一个类型为 `(datatype)` 且大小为字节数的指针。\n\
  \n`datatype` 指针用于对 `malloc` 返回的指针进行类型转换，这种转换是必要的，因为 `malloc()` 默认返回一个 `void*` 指针。例如\
  \ `int*p=(int*)malloc(10);`\n\n因此，通过上述指针 `p`，分配的连续内存空间第 1 个字节的地址被存储在变量中。\n\n我们还可以使用\
  \ `size of` 运算符来指定大小，例如 `*p=(int*)malloc(5*size of int)`。在这里，`5` 是数据的数量。\n\n此外，如果没有足够的内存，它将返回\
  \ `null`，我们应该始终检查 `malloc` 的返回值，例如 `if(p==null)`\n\n```\nprintf(“not sufficient\
  \ memory”);\n```\n\n示例: /*计算分数的平均值*/ void main() { int n , avg,i,*p,sum=0; printf(\"\
  enter the no. of marks ”); scanf(“%d”,&n); p=(int *)malloc(n*size(int)); if(p==null)\
  \ printf(“not sufficient”); exit(); } for(i=0;i<n;i++) scanf(“%d”,(p+i)); for(i=0;i<n;i++)\
  \ Printf(“%d”,*(p+i)); sum=sum+*p; avg=sum/n; printf(“avg=%d”,avg); }\n\n### `Lecture\
  \ Note: 28`\n\n`calloc()` 与 `malloc` 相似，唯一的区别是 `calloc` 函数用于分配多个内存块。\n\n有两个参数：\n\
  \n1. `第一个参数`指定块的数量。\n2. `第二个参数`指定每个块的大小。例如 `int *p= (int*) calloc(5, 2); int*p=(int\
  \ *)calloc(5, size of (int));`\n\n`malloc` 和 `calloc` 的另一个区别是，默认情况下 `malloc` 分配的内存包含垃圾值，而\
  \ `calloc` 分配的内存会被初始化为零（但这种初始化并不可靠）。\n\n### `realloc()`\n\n`realloc` 函数用于更改内存块的大小，它可以在不丢失旧数据的情况下改变内存块的大小，这被称为内存重分配。\n\
  \n它接受两个参数，例如：\n\n`int *ptr=(int *)malloc(size);`\n\n`int*p=(int *)realloc(ptr, new\
  \ size);`\n\n分配的新大小可能大也可能小。\n\n如果新大小大于旧大小，旧数据不会丢失，新分配的字节是未初始化的。如果旧地址不足，指针包含的起始地址可能会改变，此重分配函数会将旧块的内容移动到新块中，且旧块的数据不会丢失。\n\
  \n示例：\n\n```\n#include<stdio.h>\n#include<alloc.h>\n\nvoid main()\nint i,*p;\n\n\
  p=(int*)malloc(5*size of (int)); if(p==null) { printf(“space not available”); exit();\
  \ printf(“enter 5 integer”); for(i=0;i<5;i++) { scanf(“%d”,(p+i)); int*ptr=(int*)realloc(9*size\
  \ of (int) ); if(ptr==null) { printf(“not available”); exit(); } printf(“enter 4\
  \ more integer”); for(i=5;i<9;i++) scanf(“%d”,(p+i)); for(i=0;i<9;i++)\nprintf(“%d”,*(p+i));\
  \ }\n```\n\n### `free()`\n\n`free()` 函数用于释放动态分配的空间，通过 `free()` 释放的内存重新变为堆可用，供后续使用。\n\
  \n`free` 声明的语法：\n\n`void(*ptr)`\n\n或\n\n`free(p)`\n\n当程序终止时，操作系统会自动释放内存。即使我们不释放内存，它也不会报错，从而导致内存泄漏。\n\
  \n我们不能释放那些没有分配的内存。\n\n### `Lecture Note: 29`\n\n#### 动态数组\n\n数组是内存以连续方式组织的示例。在使用的动态内存分配函数（如\
  \ `malloc()`、`calloc()`、`realloc()`）中，内存总是以连续方式组成的，并且按照惯例，我们可以通过两种方式访问元素：\n\n1.\
  \ **下标法**\n2. **指针法**\n\n示例：\n```\n#include<stdio.h>\n#include<alloc.h>\nvoid main()\
  \ { printf(“enter the no.of values”); scanf(“%d”,&n); p=(int*)malloc(n*size of int);\
  \ If(p==null) printf(“not available memory”); exit(); } for(i=0;i<n;i++) { printf(“enter\
  \ an integer”); scanf(“%d”,&p[i]); for(i=0;i<n;i++) { printf(“%d”,p[i]); } }\n```\n\
  \n#### 文件处理\n\n**文件：**文件是持久存储介质，可以在其中存储数据。\n\n**可以处理的文件类型：**我们可以处理三种类型的文件：1) 顺序文件\
  \ (2) 随机访问文件 (3) 二进制文件\n\n**文件操作：** 在执行任何类型操作之前，必须打开文件，此时使用 `fopen()` 函数。\n\n**语法：**\
  \ `file-pointer=fopen(“FILE NAME ”,”Mode of open”);` 例如 `FILE *fp=fopen(“ar.c,”r”);`\
  \ 如果 `fopen()` 无法打开文件，将向文件指针返回 `NULL`。\n\n**文件指针：** 文件指针是一个可以存储特殊文件地址的指针变量，基于已打开的文件。\n\
  \n**文件指针的声明：** `FILE* var;`\n\n**打开模式：** 文件可以以三种方式打开：\n- 读取模式 `’ r’/rt`\n- 写入模式\
  \ `’w’/wt`\n- 追加模式 `’a’/at`\n\n**从文件读取：** 使用 `getc()` 从文件中读取字符。语法：`character_variable=getc(file_ptr);`\n\
  \n**向文件写入：** 使用 `putc()` 向文件中写入字符。`puts(character-var,file-ptr);`\n\n**关闭文件：** `fclose()`\
  \ 函数关闭文件。`fclose(file_ptr);` `fcloseall()` 用于一次关闭所有打开的文件。\n\n**文件操作：** (1) 顺序文件\
