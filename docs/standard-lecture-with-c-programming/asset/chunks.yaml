    \ of time or until a particular no of condition is being satisfied.\n\nThere are\
    \ three types of loops in c\n\n1. `While` loop\n2. `do while` loop\n3. `for` loop\n\
    \n#### While loop\n\nSyntax:\n`while(condition) { Statement 1; Statement 2; }`\
    \ Or `while(test condition) Statement;` The test condition may be any expression\
    \ ..when we want to do something a fixed no of times but not known about the number\
    \ of iteration, in a program then `while` loop is used.\n\nHere first condition\
    \ is checked if, it is true body of the loop is executed else, If condition is\
    \ false control will be come out of loop.\n\nExample:\n\n```c\n/* wap to print\
    \ 5 times welcome to C” */\n#include<stdio.h>\nvoid main()\n{\nint p=1;\nWhile(p<=5)\n\
    {\nprintf(“Welcome to C\\n”);\nP=p+1;\n}\n}\n```\nOutput: Welcome to C Welcome\
    \ to C Welcome to C Welcome to C Welcome to C\n\nSo as long as condition remains\
    \ true statements within the body of `while` loop will get executed repeatedly.\n\
    \n#### do while loop\n\nThis (`do while loop`) statement is also used for looping.\
    \ The body of this loop may contain single statement or block of statement. The\
    \ syntax for writing this statement is:\n\nSyntax:\n```c\nDo\n{\nStatement;\n\
    }\nwhile(condition);\n```\n\nExample:\n```c\n#include<stdio.h> \nvoid main() {\
    \ \nint X=4;\ndo {\nPrintf(“%d”,X); X=X+1; \n}whie(X<=10);\nPrintf(“ ”); \n}\n\
    ```\nOutput: 4 5 6 7 8 9 10\n\nHere firstly statement inside body is executed\
    \ then condition is checked. If the condition is true again body of loop is executed\
    \ and this process continue until the condition becomes false. Unlike `while`\
    \ loop semicolon is placed at the end of while.\n\nThere is minor difference between\
    \ `while` and `do while` loop, `while` loop test the condition before executing\
    \ any of the statement of loop. Whereas `do while` loop test condition after having\
    \ executed the statement at least one within the loop.\n\nIf initial condition\
    \ is false `while` loop would not executed it’s statement on other hand `do while`\
    \ loop executed it’s statement at least once even If condition fails for first\
    \ time. It means `do while` loop always executes at least once. **Notes:** `Do\
    \ while` loop used rarely when we want to execute a loop at least once.\n\n##\
    \ Lecture Note: 8*\n\n### for loop\n\nIn a program, `for` loop is generally used\
    \ when number of iteration are known in advance. The body of the loop can be single\
    \ statement or multiple statements. Its syntax for writing is:\n\nSyntax: `for(exp1;exp2;exp3)\
    \ { Statement; }`\nOr `for(initialized counter; test counter; update counter)\
    \ { Statement; }`\n\nHere `exp1` is an initialization expression, `exp2` is test\
    \ expression or condition and `exp3` is an update expression. Expression 1 is\
    \ executed only once when loop started and used to initialize the loop variables.\
    \ Condition expression generally uses relational and logical operators. And updation\
    \ part executed only when after body of the loop is executed.\n\nExample:\n```c\n\
    void main()\n{\nint i;\nfor(i=1;i<10;i++)\n{\nPrintf(“ %d ”, i);\n}\n}\n```\n\
    Output:-1 2 3 4 5 6 7 8 9 \n\n#### Nesting of loop\n\nWhen a loop written inside\
    \ the body of another loop then, it is known as nesting of loop. Any type of loop\
    \ can be nested in any type such as `while`, `do while`, `for`. For example nesting\
    \ of `for` loop can be represented as:\n\n```c\nvoid main()\n{\nint i,j;\nfor(i=0;i<2;i++)\n\
    for(j=0;j<5; j++)\nprintf(“%d %d”, i, j);\n}\n```\nOutput: i=0 j=0 1 2 3 4 i=1\
    \ j=0 1 2 3 4\n\n#### Break statement(break)\n\nSometimes it becomes necessary\
    \ to come out of the loop even before loop condition becomes false then `break`\
    \ statement is used. `break` statement is used inside loop and switch statements.\
    \ It cause immediate exit from that loop in which it appears and it is generally\
    \ written with condition. It is written with the keyword as `break.` When `break`\
    \ is encountered inside any loop, control automatically passes to the statement\
    \ after the loop. without waiting to get back to conditional state. This `break`\
    \ statement is usually associated with `if` statement.\n\nExample:\n```c\nvoid\
    \ main()\n{\nint j=0;\nfor(;j<6;j++)\nif(j==4)\nbreak;\n}\n```\nOutput: 0 1 2\
    \ 3\n\n#### Continue statement (key word continue)\n\n`continue` statement is\
    \ used for continuing next iteration of loop after skipping some statement of\
    \ loop. When it encountered control automatically passes through the beginning\
    \ of the loop. It is usually associated with the `if` statement. It is useful\
    \ when we want to continue the program without executing any part of the program.\n\
    \nThe difference between `break` and `continue` is, when the `break` encountered\
    \ loop is terminated and it transfer to the next statement and when `continue`\
    \ encountered control come back to the beginning position.\n\nIn `while` and `do\
    \ while` loop after `continue` statement control transfer to the test condition\
    \ and then loop continue where as in `for` loop after `continue` control transferred\
    \ to the updating expression and condition is tested.\n\nExample:\n```c\nvoid\
    \ main()\n{\nint n;\nfor(n=2; n<=9; n++)\n{\nif(n==4)\ncontinue;\nprintf(“%d”,\
    \ n);\n}\nPrintf(“out of loop”); }\n```\nOutput: 2 3 5 6 7 8 9 out of loop\n\n\
    ## Lecture Note: 9*\n\n### if statement\n\n`if` statement execute set of command\
    \ like when condition is true and its syntax is\n\n`If (condition) Statement;`\n\
    \nThe statement is executed only when condition is true. If the `if` statement\
    \ body is consists of several statement then better to use pair of curly braces.\
    \ Here in case condition is false then compiler skip the line within the `if`\
    \ block.\n\n```c\nvoid main()\n{\nint n; printf (“ enter a number:”); scanf(“%d”,&n);\n\
    If (n>10) Printf(“ number is grater”);\n}\n```\nOutput: Enter a number:12 Number\
    \ is greater\n\n**if…..else ... Statement**\n"
