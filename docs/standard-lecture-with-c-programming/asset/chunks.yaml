    (with the use of an editor), and the compilation process must be restarted. Typical
    errors reported during this phase of compilation might be due to an expression
    that has unbalanced parentheses ( **syntactic error**), or due to the use of a
    variable that is not “defined” ( **semantic error**).


    **Step 3:** When all the syntactic and semantic errors have been removed from
    the program, the compiler then proceeds to take each statement of the program
