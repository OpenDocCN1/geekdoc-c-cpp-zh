    \n```c\nInt *p1,*p2;\nP1=&a[1];\nP2=&a[3];\n```\n\nWe can assign constant 0 to\
    \ a pointer of any type for that symbolic constant ‘**NULL**’ is used such as\
    \ \n\n```c\n*p=NULL;\n```\n\nIt means pointer doesn’t point to any valid memory\
    \ location.\n\n##### Pointer Arithmetic\n\nPointer arithmetic is different from\
    \ ordinary arithmetic and it is perform relative to the data type(base type of\
    \ a pointer).\n\nExample:If integer pointer contain address of 2000 on incrementing\
    \ we get address of 2002 instead of 2001, because, size of the integer is of 2\
    \ bytes.\n\nNote:\nWhen we move a pointer, somewhere else in memory by incrementing\
    \ or decrement or adding or subtracting integer, it is not necessary that, pointer\
    \ still pointer to a variable of same data, because, memory allocation to the\
