  trans: "\n\n# `#define name value，这里 name 通常使用大写，例如`\n\n# `#define MAX 10` `#define\
    \ CH ‘b’` `#define NAME “sony”`\n\n## 变量\n\n变量是用于存储某些数据值，或用于存储程序计算和结果的符号名称的数据名称。变量的值在执行过程中可以改变。变量的命名规则与标识符的命名规则相同。在程序中使用之前必须对其进行声明。变量声明指定了它的名称、数据类型以及变量可以存储的值范围，范围取决于其数据类型。\n\
    \n### 语法：\n```\nint a;\nchar c;\nfloat f;\n```\n\n### 变量初始化\n我们在声明期间给变量分配任何初始值，称为变量的初始化。当变量被声明但包含未定义的值时，则称为垃圾值。使用赋值运算符对变量进行初始化例如：\n\
    \n`数据类型 变量名=常量;`\n\n示例：`int a=20;`\n\n或 `int a;`\n\n### 语句\n\n## 讲义笔记：5\n\n###\
    \ 表达式\n表达式是变量、常量、运算符和函数调用的组合。它可以是算术的、逻辑的或关系的，例如：\n\n```\nint z= x+y // 算术表达式\n\
    a>b // 关系\na==b // 逻辑\nfunc(a, b) // 函数调用\n```\n\n完全由常量值的表达式被称为*常量表达式*。因此，表达式\n\
    \n`121 + 17 - 110`\n\n是一个常量表达式，因为表达式的每一个项都是常量值。但如果我将它声明为整数变量，表达式 `180 + 2 – j`\n\
    \n就不再代表常量表达式。\n\n### 运算符\n这是用于对变量、操作数或常量执行某些操作的符号。某些运算符需要 2 个操作数来执行操作，而某些只需要单次操作。\n\
    \n有几种运算符，分别是：算术运算符、赋值、增、减、逻辑、条件、逗号、大小、位运算等。\n\n#### 1. 算术运算符\n该运算符用于数值计算。这些分为一元算术运算符和二元算术运算符。一元算术运算符只需要一个操作数，如\
    \ `+`、`-`、`++`、`--`、`!` 等。而这些运算符是加、减、乘、除。另一方面，二元算术运算符需要两个操作数，其运算符为 `+(加)`、`-(减)`、`*\
    \ (乘)`、`/(除)`、`%(取模)`。但取模不能应用于浮点操作数，而且 C 语言没有幂运算符。\n\n`一元 (+)` 和 `一元 (-)` 与加法减法不同。\n\
    \n当两个操作数都是整数时，称为整数算术，结果始终是整数。当两个操作数都是浮点数时，称为浮点算术；当操作数是整数和浮点数时，称为混合类型或混合模式算术。结果是\
    \ float 类型。\n\n#### 2. 赋值运算符\n可以使用赋值运算符将值存储在变量中。运算符 `=` 用于赋值语句和赋值表达式。左侧的操作数应该是变量，右侧的操作数应该是变量、常量或任何表达式。当左侧的变量出现在右侧时，我们可以通过编写复合语句来避免这种情况。例如，\n\
    \n```\nint x= y;\nint Sum=x+y+z;\n```\n\n#### 3. 增和减\n一元运算符 `++`、`--` 用作增和减，作用于单个操作数。增运算符将变量的值增加\
    \ 1。同样，减运算符将变量的值减少 1。这些运算符只能与变量一起使用，但不能与表达式和常量使用，如 `++6` 或 `++(x+y+z)`。\n\n它再次分为前置和后置。在前置中，变量的值先递加\
    \ 1，然后使用新值；而在后置中，运算符写在操作数之后（如 `m++`、`m--`）。\n\n**示例**\n```\nlet y=12;\nz= ++y;\n\
    y= y+1;\nz= y;\n```\n\n同样，在后置增和减运算符中，运算符先在操作中使用，然后执行增和减操作。\n\n**示例**\n```\nlet\
    \ x= 5;\ny= x++;\ny=x;\nx= x+1;\n```\n\n#### 4. 关系运算符\n它用于根据关系比较两个表达式的值。包含关系运算符的表达式被称为关系表达式。\n\
    \n在这里，根据真或假值进行赋值。\n\na. `(a>=b) || (b>20)`\nb. `(b>a) && (e>b)`\nc. `0(b!=7)`\n\
    \n#### 5. 条件运算符\n它有时称为三元运算符。因为它需要三个表达式作为操作数，表示为 `(? , :)`。\n\n**语法**\n`exp1 ?\
    \ exp2 :exp3`\n\n这里首先计算 `exp1`。如果为真，则返回值 `exp2`；如果为假，则返回 `exp3`。\n\n**示例**\n```\n\
    void main()\n{\nint a=10, b 2 int s= (a>b) ? a:b; printf(“value is:%d”); 输出: Value\
    \ is:10\n```\n\n#### 6. 逗号运算符\n逗号运算符用于在只能使用一个表达式的情况下允许不同的表达式出现。所有表达式由逗号分隔并从左到右求值。\n\
    \n**示例**\n```\nint i;\n```\n\n#### 7. Sizeof 运算符\nsizeof 运算符用于在只能使用一个表达式的情况下允许不同的表达式出现。所有表达式由逗号分隔并从左到右求值。\n\
    \n```\nint i,j;\n```\n\n#### 8. 位运算符\n位运算符用于对变量、操作数或常量执行某些操作。某些运算符需要 2 个操作数来执行操作，而某些只需要单次操作。\n\
