    to have it compiled. The compilation process is initiated by typing a special
    command on the system. When this command is entered, the name of the file that
    contains the source program must also be specified. For example, under Unix, the
    command to initiate program compilation is called **cc**. If we are using the
    popular GNU C compiler, the command we use is **gcc**.


