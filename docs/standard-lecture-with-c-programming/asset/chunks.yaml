    \n`Data type *pointer name;` Here `*` before pointer indicate the compiler that\
    \ variable declared as a pointer. e.g. \n\n```c\nint *p1; //pointer to integer\
    \ type\nfloat *p2; //pointer to float type\nchar *p3; //pointer to the character\
    \ type\n```\n\nWhen pointer declared, it contains garbage value i.e. it may point\
    \ any value in the memory.\n\nTwo operators are used in the pointer i.e. **address\
