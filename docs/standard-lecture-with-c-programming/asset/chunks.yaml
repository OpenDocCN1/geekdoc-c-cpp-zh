    \ function in which it is defined. **Life time:** value of the variable persist\
    \ or remain between different function call. Example: \n\n```c\nmain( ) { \n \
    \   reduce( ); \n    reduce( ); \n    reduce ( ); \n} \nreduce( ) { \n    static\
    \ int x=10; \n    printf(\"%d”,x); \n    x++; \n}\n```\nOutput:-10,11,12\n\n####\
    \ External storage classes\n\nThe keyword used for this class is `extern`. Features\
    \ are: **Storage:** memory area, **Default initial value:**zero, **Scope :** global,\
    \ **Life time:**as long as program execution remains it retains.\n\nDeclaration\
    \ does not create variables, only it refer that already been created at somewhere\
    \ else. So, memory is not allocated at a time of declaration and the external\
    \ variables are declared at outside of all the function.\n\nExample:\n\n```c\n\
    int i,j;\nvoid main( ) {\n    printf( “i=%d”,i ); \n    receive( ); \n    receive(\
    \ ); \n    reduce( ); \n    reduce( ); \n}\nreceive( ) {\n    i=i+2; \n    printf(“on\
