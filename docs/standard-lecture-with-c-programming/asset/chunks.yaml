    \ **p;\nint x=22; \nint *p=&x; \nint **p1=&p;\n```\n\n```c\nprintf(“value of x=%d”,x);\
    \ \nprintf(“value of x=%d”,*p); \nprintf(“value of x=%d”,*&x); \nprintf(“value\
