    \  P1=&a[6];\n  printf(“%d”,*p1-*p);\n  printf(“%d”,p1-p);\n}\n```\n\n**Arithmetic\
    \ operation never perform on pointer are:**\n\n**addition, multiplication and\
    \ division of two pointer. multiplication between the pointer by any number. division\
    \ of pointer by any number**\n**-add of float or double value to the pointer.**\
    \ Operation performed in pointer are:\n\n/* Addition of a number through pointer\
    \ */ Example \n```c\nint i=100; \nint *p; \np=&i; \np=p+2; \np=p+3; \np=p+9;\n\
    ```\nii /* Subtraction of a number from a pointer*/ Ex: \n```c\nint i=22; \n```\n\
    iii Subtraction of pointer to another is possible when pointer variable points\
    \ to same data. Ex: \n\n```c\nint a[]={20,25,15,27}\n```\n\n#### Pointer Comparison\n\
    \nPointer variable can be compared when they point to the same address. External\
    \ operators used for comparison `==,!=,<=,,` can be used with pointer.\n\nEx:\n\
    \n```c\nvoid main() {\n    static int a[]={20,25,15,27,105,96};\n    int *x,*y;\n\
    \    x=&a[5];\n    y=(a+5);\n    if(x==y)\n        printf(“same”);\n    else\n\
    \        printf(“not”);\n}\n```\n\n#### Pointer to pointer\n\nAddition of pointer\
    \ variable stored in some other variable is called pointer to pointer. Or Pointer\
