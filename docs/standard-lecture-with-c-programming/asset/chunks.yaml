    ## 讲义笔记：1


    ### C 语言简介


    `C` 是一种于 1972 年在美国 AT & T 贝尔实验室开发的编程语言。它由一个名叫 Dennis Ritchie 的人设计并编写。在 70 年代后期，`C`
    开始取代当时更熟悉的语言，如 `PL/I`、`ALGOL` 等。


    ANSI `C` 标准出现于 20 世纪 80 年代初，这本书被拆分为两个标题：原作仍称为 *Programming in C*，而涵盖 ANSI `C`
    的标题称为 *Programming in ANSI C*。这样做是因为编译器供应商需要数年才能发布他们的 ANSI `C` 编译器并使其变得无处不在。它最初是为编写
    UNIX 操作系统而设计的。现在软件工具以及 `C` 编译器都是用 `C` 编写的。`Windows`、`UNIX`、`Linux` 等流行操作系统的大部分仍用
    `C` 编写。这是因为即使在今天，在性能（执行速度）方面，没有什么是能超越 `C` 的此外，如果需要扩展操作系统以支持新设备，就需要编写设备驱动程序。这些程序是完全用
    `C` 编写的。`C` 之所以如此流行，是因为它**可靠**、**简单**且**易于**使用。今天经常听到的是——“C 已经被 `C++`、`C#` 和 `Java`
    等语言所取代”。


    ### 程序


    学习英语和学习 `C` 语言之间有着密切的类比。学习英语的经典方法是首先学习该语言使用的字母表，然后学习将这些字母组合成单词，单词组合成句子，句子再组合成段落。学习
    `C` 类似且更简单。我们不需要直接学习如何写程序，必须首先知道 `C` 中使用了哪些字母、数字和特殊符号，然后如何使用它们来构造`常量`、`变量`和`关键字`，最后如何将这些组合成一条**指令**。一组指令稍后组合成一个**程序**。


    ![](img/image00042.jpeg)


    计算机`program` 仅仅是解决特定问题所需的指令集合。计算机系统的基本操作构成了所谓的计算机**指令集**。而用于解决问题的方法或手段被称为***算法。***。


    所以对于编程语言而言，它们分为两种：


    1) 低级语言

    2) 高级语言


    #### 低级语言：


    低级语言是**机器级**和**汇编级**的。机器级语言只理解数字，形式为 0 和 1。因此给计算机的指令是二进制形式，难以实现。这种类型的程序具有不可移植性，难以维护且易出错。另一方面，**汇编语言**是机器级语言的变体。指令以英语形式给出，如
    ADD、SUM、MOV 等。它易于编写但机器并不理解。因此这里的翻译器是汇编器。虽然语言简单一些，程序员必须了解底层细节。在汇编语言中，数据存储在计算机寄存器中，这随计算机而异。因此不可移植。


    #### 高级语言：


    这些语言与机器无关，意味着它们是可移植的。这一类的语言有 `Pascal`、`Cobol`、`Fortran` 等。高级语言是机器理解的。因此需要翻译器转换为机器级。翻译器是用于将高级语言以及低级语言转换为机器级的软件。


    三种翻译器：


    - 编译器

    - 解释器

    - 汇编器


    编译器和解释器用于将高级语言转换为机器语言。用高级语言编写的程序称为源代码，相应的机器语言称为目标程序。编译器和解释器都执行相同的任务，但工作方式不同。编译器一次性读取程序并搜索错误并列出。如果程序无错误，则转换为目标程序。当程序规模很大时，首选编译器。而解释器只读取一行源代码并进行转换，逐句检查错误，因此花费更多时间。


