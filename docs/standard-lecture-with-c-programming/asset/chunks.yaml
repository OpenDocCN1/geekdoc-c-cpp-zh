    execution or at the runtime, is called dynamic memory location.


    Two types of problem may occur in static memory allocation. If number of values
    to be stored is less than the size of memory, there would be wastage of memory.


    If we would want to store more values by increase in size during the execution
    on assigned size then it fails.


    Allocation and release of memory space can be done with the help of some library
    function called dynamic memory allocation function. These library function are
    called as **dynamic memory allocation function.** These library function prototype
    are found in the header file, “alloc.h” where it has defined.


    Function take memory from memory area is called heap and release when not required.


