    此函数用于在运行时分配内存，其声明为 `void*malloc(size);`


    ### `malloc()`


    返回指向第 1 个字节的指针并分配内存，其返回类型为 `void`，可以进行如下类型强制转换：


    `int *p=(datatype*)malloc(size)`


    如果内存位置分配成功，它返回所分配内存块的地址；如果失败，则返回 `null`。根据上面的声明，它返回一个类型为 `(datatype)` 且大小为字节数的指针。


    `datatype` 指针用于对 `malloc` 返回的指针进行类型转换，这种转换是必要的，因为 `malloc()` 默认返回一个 `void*` 指针。例如
    `int*p=(int*)malloc(10);`


    因此，通过上述指针 `p`，分配的连续内存空间第 1 个字节的地址被存储在变量中。


    我们还可以使用 `size of` 运算符来指定大小，例如 `*p=(int*)malloc(5*size of int)`。在这里，`5` 是数据的数量。


    此外，如果没有足够的内存，它将返回 `null`，我们应该始终检查 `malloc` 的返回值，例如 `if(p==null)`


    ```

    printf(“not sufficient memory”);

    ```


    示例: /*计算分数的平均值*/ void main() { int n , avg,i,*p,sum=0; printf("enter the no. of
    marks ”); scanf(“%d”,&n); p=(int *)malloc(n*size(int)); if(p==null) printf(“not
    sufficient”); exit(); } for(i=0;i<n;i++) scanf(“%d”,(p+i)); for(i=0;i<n;i++) Printf(“%d”,*(p+i));
    sum=sum+*p; avg=sum/n; printf(“avg=%d”,avg); }


    ### `Lecture Note: 28`


    `calloc()` 与 `malloc` 相似，唯一的区别是 `calloc` 函数用于分配多个内存块。


    有两个参数：


    1. `第一个参数`指定块的数量。

    2. `第二个参数`指定每个块的大小。例如 `int *p= (int*) calloc(5, 2); int*p=(int *)calloc(5, size
    of (int));`


    `malloc` 和 `calloc` 的另一个区别是，默认情况下 `malloc` 分配的内存包含垃圾值，而 `calloc` 分配的内存会被初始化为零（但这种初始化并不可靠）。


    ### `realloc()`


    `realloc` 函数用于更改内存块的大小，它可以在不丢失旧数据的情况下改变内存块的大小，这被称为内存重分配。


    它接受两个参数，例如：


    `int *ptr=(int *)malloc(size);`


    `int*p=(int *)realloc(ptr, new size);`


    分配的新大小可能大也可能小。


    如果新大小大于旧大小，旧数据不会丢失，新分配的字节是未初始化的。如果旧地址不足，指针包含的起始地址可能会改变，此重分配函数会将旧块的内容移动到新块中，且旧块的数据不会丢失。


    示例：


    ```

    #include<stdio.h>

    #include<alloc.h>


    void main()

    int i,*p;


    p=(int*)malloc(5*size of (int)); if(p==null) { printf(“space not available”);
    exit(); printf(“enter 5 integer”); for(i=0;i<5;i++) { scanf(“%d”,(p+i)); int*ptr=(int*)realloc(9*size
    of (int) ); if(ptr==null) { printf(“not available”); exit(); } printf(“enter 4
    more integer”); for(i=5;i<9;i++) scanf(“%d”,(p+i)); for(i=0;i<9;i++)

    printf(“%d”,*(p+i)); }

    ```


    ### `free()`


    `free()` 函数用于释放动态分配的空间，通过 `free()` 释放的内存重新变为堆可用，供后续使用。


    `free` 声明的语法：


    `void(*ptr)`


    或


    `free(p)`


    当程序终止时，操作系统会自动释放内存。即使我们不释放内存，它也不会报错，从而导致内存泄漏。


    我们不能释放那些没有分配的内存。


    ### `Lecture Note: 29`


    #### 动态数组


    数组是内存以连续方式组织的示例。在使用的动态内存分配函数（如 `malloc()`、`calloc()`、`realloc()`）中，内存总是以连续方式组成的，并且按照惯例，我们可以通过两种方式访问元素：


    1. **下标法**

    2. **指针法**


    示例：

    ```

    #include<stdio.h>

    #include<alloc.h>

    void main() { printf(“enter the no.of values”); scanf(“%d”,&n); p=(int*)malloc(n*size
    of int); If(p==null) printf(“not available memory”); exit(); } for(i=0;i<n;i++)
    { printf(“enter an integer”); scanf(“%d”,&p[i]); for(i=0;i<n;i++) { printf(“%d”,p[i]);
    } }

    ```


    #### 文件处理


    **文件：**文件是持久存储介质，可以在其中存储数据。


    **可以处理的文件类型：**我们可以处理三种类型的文件：1) 顺序文件 (2) 随机访问文件 (3) 二进制文件


    **文件操作：** 在执行任何类型操作之前，必须打开文件，此时使用 `fopen()` 函数。


    **语法：** `file-pointer=fopen(“FILE NAME ”,”Mode of open”);` 例如 `FILE *fp=fopen(“ar.c,”r”);`
    如果 `fopen()` 无法打开文件，将向文件指针返回 `NULL`。


    **文件指针：** 文件指针是一个可以存储特殊文件地址的指针变量，基于已打开的文件。


    **文件指针的声明：** `FILE* var;`


    **打开模式：** 文件可以以三种方式打开：

    - 读取模式 `’ r’/rt`

    - 写入模式 `’w’/wt`

    - 追加模式 `’a’/at`


    **从文件读取：** 使用 `getc()` 从文件中读取字符。语法：`character_variable=getc(file_ptr);`


    **向文件写入：** 使用 `putc()` 向文件中写入字符。`puts(character-var,file-ptr);`


    **关闭文件：** `fclose()` 函数关闭文件。`fclose(file_ptr);` `fcloseall()` 用于一次关闭所有打开的文件。


    **文件操作：** (1) 顺序文件 (2) 随机访问文件 (3) 二进制文件 (4) 打开文件 (5) 关闭文件


