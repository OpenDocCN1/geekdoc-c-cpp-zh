    **Variables**


    Variable is a data name which is used to store some data value or symbolic names
    for storing program


    computations and results. The value of the variable can be change during the execution.
    The rule for naming the variables is same as the naming identifier. Before used
    in the program it must be declared. Declaration of variables specify its name,
    data types and range of the value that variables can store depends upon its data
    types.


    Syntax:


    int a;


    char c;


    float f;


    Variable initialization


    When we assign any initial value to variable during the declaration, is called
    initialization of variables. When variable is declared but contain undefined value
    then it is called garbage value. The variable is initialized with the assignment
    operator such as


    Data type variable name=constant;


    Example: int a=20;


    Or int a;


    statements


