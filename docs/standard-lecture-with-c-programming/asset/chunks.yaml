    \n其语法如下：\n\n```c\nif (condition)\n{\n    Statement1;\n    Statement2;\n}\nelse\n\
    \    Statement1; Statement2;\n```\n\n`else` 不能在没有 `if` 的使用，且在一个 `if` 语句中不允许有多个\
    \ `else` 语句。这意味着 `else` 语句内部必须有一个 `if` 语句。\n\n示例：\n```c\n/* 检查一个数字是偶数还是奇数 */ \n\
    void main() { \n    int n; \n    printf (“enter a number:”); \n    sacnf (“%d”,\
    \ &n); \n    If (n%2==0) printf (“even number”); \n    else printf(“odd number”);\
    \ \n}\n```\n输出：enter a number:121 odd number\n\n## 课程笔记: 10\n\n### if …else 的嵌套\n\
    当 `if-block` 或 `else-block` 中存在另一个 `if else` 语句时，它被称为 `if-else` 语句的嵌套。\n\n语法为：\n\
    \n```c\nif (condition) \n    If (condition)\n        Statement1; \n    else\n\
    \        statement2;\nStatement3;\n```\n\n### If….else 阶梯 (LADDER)\n在这种嵌套类型中，最后一个部分外的每个\
    \ `else` 部分都有一个 `if else` 语句。如果条件为假，控制传递到块中使用其 `if` 语句再次检查条件。\n\n语法为：\n\n```c\n\
    if (condition)\n    Statement1; \nelse if (condition)\n    statement2; \nelse\
    \ if (condition)\n    statement3; \nelse statement4;\n```\n\n此过程一直持续到最后一个块中没有\
    \ `if` 语句。如果满足其中一个条件，其他嵌套的 “else if” 将不会执行。但它与 `if else` 语句相比的缺点是：在 `if else`\
    \ 语句中，只要条件为真，其他条件就不会被检查；而在这种情况下，所有条件都会被检查。\n\n## 课程笔记: 11\n\n### 数组 (ARRAY)\n\
    数组是相似数据类型的集合或存储在连续内存位置的相似实体集合。字符数组是一个字符串。数组的每个数据项被称为 `element`（元素）。每个元素都是唯一的并位于独立的内存位置。数组的每个元素共享一个变量，但每个元素具有不同的索引号，即下标（subscript）。\n\
    \n数组可以是单维或多维的，下标决定了它的维度。下标始终从零开始。一维数组被称为向量，二维数组被称为矩阵。\n\n**优点**：数组变量一次可以存储多个值，而其他变量一次只能存储一个值。\n\
    \n示例：\n```c\nint arr[100];\nint mark[100];\n```\n\n### 数组的声明 (DECLARATION OF AN\
    \ ARRAY)\n其语法为：`数据类型 数组名 [大小];`\n\n```c\nint arr[100]; \nint mark[100]; \nint\
    \ a[5]={10,20,30,100,5}\n```\n\n数组的声明告诉编译器：数据类型、数组名称、数组大小以及每个元素占用的内存空间。例如，对于 `int`\
    \ 数据类型，每个元素占用 2 字节；对于 `float`，每个元素占用 4 字节等。数组的大小决定了数组中可以存储的元素数量，它可能是一个 `int` 常量或常量整型表达式。\n\
    \n我们可以这样表示单个数组：\n```c\nint ar[5];\nar[0], ar[1], ar[2], ar[3], ar[4];\n```\n\n\
    符号常量也可以用于指定数组的大小，如：`#define SIZE 10;`\n\n### 数组的初始化 (INITIALIZATION OF AN ARRAY)\n\
    声明后，局部数组元素具有垃圾值。如果是全局或静态数组，它将自动初始化为零。显式地可以初始化为：\n\n`数据类型 数组名 [大小] = {值 1, 值 2,\
    \ 值 3…}` 示例：`ar[5]={20,60,90, 100,120}`\n\n数组下标始终从零开始，被称为下界（lower bound），上限被称为上界（upper\
    \ bound），最后一个下标值比数组大小小一。下标可以是表达式，即整数值。它可以是任何整数、整数常量、整数变量、整数表达式或产生整数值的函数调用返回值。\n\
    \n所以，如果 `i` 和 `j` 不是变量，那么有效的下标是：\n`ar [i*7],ar[i*i],ar[i++],ar[3];`\n\n数组元素连续连续在内存位置中，存储元素所需的存储量取决于其的大小和类型。**一维数组的总字节数为：**\n\
    \n`总字节数 = (数据类型的大小) * 数组的大小。`\n\n示例：如果声明一个数组：\n```c\nint [20];\n```\n总字节 = 2 *\
    \ 20 = 40 字节。\n\n### 数组元素的访问 (ACCESSING OF ARRAY ELEMENT)\n/* 写一个程序向数组输入值并显示它们\
