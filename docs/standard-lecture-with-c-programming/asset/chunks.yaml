  trans: "\n字母、数字和特殊符号在恰当组合时形成常量、变量和关键字。\n\n## 标识符\n\n标识符是用户定义的单词，用于为变量、`arrays`、`functions`、`structures`\
    \ 等实体命名。标识符的命名规则如下：\n\n1) 命名应只包含字母（大写和小写）、数字和下划线（`_`）符号。\n\n2) 第一个字符应该是字母或下划线。\n\
    \n3) 命名不能是关键字。\n\n4) 由于 `C` 是区分大小写的，大写和小写被视为不同的，例如 `code`、`Code`、`CODE` 等是不同的标识符。\n\
    5) 标识符通常赋予有意义的名字，如 `value`、`net_salary`、`age`、`data` 等。标识符名称可能很长，某些实现仅识别前 8 个字符，大多数识别\
    \ 31 个字符。ANSI 标准编译器识别 31 个字符。某些无效的标识符有 `5cb`、`int`、`res#`、`avg no` 等。\n\n## 关键字\n\
    \n某些单词被保留用于执行特定任务，这些单词被称为`保留字`或`关键字`。这些单词是预定义的，并且始终以小写字母写。这些关键字不能用变量名，因为它们被赋予了固定的含义。示例包括\
    \ `int`、`short`、`signed`、`unsigned`、`default`、`volatile`、`float`、`long`、`double`、`break`、`continue`、`typedef`、`static`、`do`、`for`、`union`、`return`、`while`、`extern`、`register`、`enum`、`case`、`goto`、`struct`、`char`\
    \ 等\n\n\n\n 数据类型指的是在使用之前用于声明不同类型的变量或函数的扩展系统。变量的类型决定了它在存储中占据空间的大小以及存储的位模式如何被解释。变量的值可以随时更改。\n\
    \n`C` 具有以下 4 种数据类型：\n\n- **基本内置数据类型**：`int`、`float`、`double`、`char`\n- **枚举数据类型**：`enum`\n\
    - **派生数据类型**：`pointer`、`array`、`structure`、`union`\n- **空数据类型**：`void`\n\n声明为\
    \ `int` 类型的变量仅用于包含整数值——即不包含小数的值。声明为 `float` 类型的变量可用于存储浮点数（包含小数的值）。`double` 类型与\
    \ `float` 类型相同，只是精度大约是两倍。`char` 数据类型可以用于存储单个字符，例如字母 `a`、数字字符 `6` 或分号 `;`。声明为 `char`\
    \ 的变量只能存储字符类型的值。\n\n在 `c` 中有两种类型的类型修饰符：\n\n- **尺寸修饰符**：`short`、`long`\n- **符号修饰符**：`signed`、`unsigned`\n\
    \n当使用修饰符 `unsigned` 时，数字始终为正数；当使用 `signed` 时，数字可能是正或负。如果没有提到符号修饰符，则默认认为符号修饰符。有符号数据类型的值范围小于无符号数据类型。因为在有符号类型中，最左位用于表示符号，而在无符号类型中，该位也用于表示值。16\
    \ 位机器上不同数据类型的大小和范围如下：\n\n| 基本数据类型 带有类型修饰符的数据（字节） | 大小 | 范围 |\n| :--- | :--- |\
    \ :--- | :--- |\n| `char` | `char` 或 `signed char` | 1 | -128 to 127 |\n| `unsigned\
    \ char` | | 1 | 0 to 255 |\n| `int` | `int` 或 `signed int` | 2 | -32768 to 32767\
    \ |\n| `unsigned int` | | 2 | 0 to 65535 |\n| `short int` | `short int` 或 `signed\
    \ short int` | 1 | -128 to 127 |\n| `unsigned short int` | | 1 | 0 to 255 |\n\
    | `long int` | `long int` 或 `signed long int` | 4 | -2147483648 to 2147483647\
    \ |\n| `unsigned long int` | | 4 | 0 to 4294967295 |\n| `float` | `float` | 4\
    \ | -3.4E-38 to 3.4E+38 |\n| `double` | `double` | 8 | 1.7E-308 to 1.7E+308 |\n\
    | `Long double` | | 10 | 3.4E-4932 to 1.1E+4932 |\n\n## 课程笔记: 4\n\n### 常量\n\n\
    常量是在程序执行期间不能改变的值。在 `C` 中，任何数字、单个字符或字符字符串被称为`常量`。常量是不改变的实体，而变量是可能会改变的实体。例如，数字 `50`\
    \ 代表一个常量整数值。字符串 `\"Programming in C is fun.\\n\"` 是常量字符字符串的一个示例。`C` 常量可以分为两大类：\n\
    \n- 初级常量\n- 二级常量\n\n这些常量进一步分类为：\n\n![](img/image00045.jpeg)\n\n- **数值常量**\n- **字符常量**\n\
    - **字符串常量**\n\n#### 数值常量\n\n数值常量是数字，在在 `C` 中由数字组成，并可以是正或负。数值常量默认为正。数值常量内部不允许有逗号。数值常量必须至少有一个数字。数值常量的范围取决于编译器，在\
    \ 16 位编译器中，范围是 -32768 到 32767。数值常量分为以下类型：\n- **十进制常量**（基为 10）\n- **八进制常量**（基为\
    \ 8）\n- **十六进制常量**（基为 16）\n\n为了表示极小或巨大的常量，使用了科学计数法（指数形式），其中数字以尾数形式表示，指数可以是正负整数但尾数可以是实数类型，通过\
    \ `e/E` 分隔。例如 `3.6*10⁵=3.6e+5`。浮点常量默认类型为 `double`，也可以通过后缀 `f/F` 显式定义。\n\n####\
    \ 浮点常量\n\n浮点常量也被称为实数。构造浮点常量必须：\n- 它可以包含一个小数点点。\n- 默认符号为正。\n- 浮点常量内部允许有逗号。例如：`+32.34`、`42.0`、`-32.76`\n\
    \n#### 字符常量\n\n字符常量表示为单引号内的单个字符。这些可以是单个数字、单个特殊符号或空格，例如 ‘9’、‘c’、‘$’、‘ ’ 等。每个字符常量在机器字符码中都有唯一的整数值，如果机器使用\
    \ `ASCII`（美国信息交换标准）。每个大写和小写字母相关的数值值为：\n\n- `A------------ Z` ASCII 值 (65-90)\n\
    - `a-------------z` ASCII 值 (97-122)\n- `0-------------9` ASCII 值 (48-59)\n- ASCII\
    \ 值 (59)\n\n#### 字符串常量\n\n字符集被称为字符串，当字符序列包含在双引号内时（可以是各种符号的组合），它是字符串常量。字符串常量包含零、一个或多个字符，并在字符串末尾由编译器自动放置空字符\
    \ `(\\0)`。一些示例包括 “,sarathina”、“908”、“3”、“ ”、“A” 等。在 `C` 中，尽管相同的字符包含在单引号和双引号内，但它们代表的含义不同，例如\
    \ “A” 和 ‘A’ 是不同的，因为第一个是末尾带有空字符的字符串，而第二个是对应 ASCII 值为 65 的字符常量。\n\n符号常量是字符序列的替代名称，这些字符可以是数值常量、字符常量或字符串常量。这些常量通常定义在程序开头作为：\n\
    \n"
