    void main() {\n    int i=105; \n    int *p; \n    p=&i;\n    printf(“value of\
    \ i=%d”,*p); \n    printf(“value of i=%d”,*/&i); \n    printf(“address of i=%d”,&i);\
    \ \n    printf(“address of i=%d”,p); \n    printf(“address of p=%u”,&p); \n}\n\
    ```\n\n#### Pointer Expression\n\n##### Pointer assignment\n\n```c\nint i=10;\
    \ \nint *p=&i;//value assigning to the pointer\n```\n\nHere declaration tells\
