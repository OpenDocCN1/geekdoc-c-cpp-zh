    \ data type variable name;` `static int a;`\n- 静态变量只初始化一次，并在函数调用之间保留。如果其变量没有初始化，则它会自动初始化为零。\n\
    \n示例：\n```c\nvoid fun1(void); \nvoid fun2(void); \nvoid main() {\n    fun1();\
    \ \n    fun2(); \n}\n\nvoid fun1() \n    int a=10, static int b=2; \n    printf(“a=%d,\
    \ b=%d”,a,b); \n    a++; b++;\n}\n``` \n输出：`a= 10 b= 2`\n\n### 递归\n当函数（在函数体内部）反复调用自身时，它被称为递归函数。在递归中，调用函数和被调用的函数是同一个。这是用最简单的方法编写复杂算法的强大技术。根据递归，问题是根据自身来定义的。在这里，函数体内的语句调用同一个函数，并在它被调用用的同时被称为循环定义。换句话说，递归是以自身的形式定义某些东西的过程。\n\
    \n语法：\n```c\nmain () {\n    rec(); /*函数调用*/ \n    rec(); \n    rec();\n}\n```\n\
    示例：\n```c\n/*使用递归计算数字的阶乘*/ \nint fact(int); \nvoid main()\n{ \n    int num; \n\
    \    printf(“enter a number”); \n    scanf(“%d”,&num); \n    f=fact(num); \n \
    \   printf(“factorial is =%d\\n”f);\n} \n\nfact (int num) {\n    If (num==0||num==1)\
    \ return 1; \n    else return(num*fact(num-1));\n}\n```\n\n## 课程笔记：18\n\n### 单体编程\n\
    对于大型程序，包含单个大函数的程序被称为单体程序。在单体程序中，程序没有被划分，它是巨大的长段代码，来回跳转以执行所有任务，就像单线程执行程序要求的那样。单体程序出现的问题是，当程序\
    \ `size` 增加时，会导致不便和难以维护，例如测试、调试等。单体编程的许多缺点有：\n\n1. 难以检查大型程序中的错误。\n2. 由于体积巨大而难以维护。\n\
    3. 代码可能针对特定问题，即它无法被重用。许多早期语言（FORTRAN, COBOL, BASIC, C）需要一个带有标记区域的大型工作空间，这些区域可以执行特定任务但并不是孤立的。\n\
    \n### 模块化编程\n将计算机程序划分为独立的子程序（如函数和子程序）的过程被称为模块化编程。模块化编程有时也被结构化编程。它允许多个程序员划分大型程序，并独立地对程序片段进行调试和测试。\n\
    \n然后，链接器将所有这些模块连接起来以形成完整的程序。这种将软件划分为部分或模块的原则，模块可以被更改、替换或删除，而对其协同工作的其他软件的影响最小。通过将程序划分为定义明确的函数模块，可以更容易地确定程序错误的源头。将程序函数分解为模块，每个模块完成一个功能，并包含完成该功能所需的所有源代码和变量。模块化程序是难以调试、测试和维护的大型程序问题的解决方案。程序模块可以被重写，而其输入和输出保持不变。进行更改的人可能只理解原始程序的一小部分。\n\
    \n面向对象编程 (OOP) 在很大程度上与模块化编程的概念兼容。\n\n- 需要编写的代码更少，使得程序更短。\n- 可以开发单一过程以供重用，消除多次重复输入代码的需求。\n\
    - 程序可以更容易地设计，因为小团队只处理整个代码的一小部分。\n- 模块化编程允许许多程序员协作完成同一个应用程序。\n- 代码存储在多个文件中。\n-\
    \ 代码短、简单且易于理解和修改，便于弄程序的运行方式并减少 Bug 的概率。\n- 错误可以很容易被识别，因为它们局限于子程序或函数或隔离在特定的模块中。\n\
    \ 相同的代码可以在许多应用程序中重用。\n- 变量和函数范围可以很容易控制。\n\n#### 缺点\n然而，使用这种技术开发程序可能需要更长时间。\n\n\
    ### 存储类型\nC 语言中的存储类是一个指示符，告诉编译器在哪里以及如何存储变量，以及变量在程序中的初始值和范围。变量的属性被称为存储类。计算机中可以存储值的类型要么在内存中，要么在寄存器中。有各种存储类决定值存储在何处。\n\
    \n声明存储类的语法是：`storageclass datatype variable name;`\n\n有四种存储类，且都是关键字：\n\n1. 自动\
    \ (auto)\n2. 寄存器 (register)\n3. 静态 (static)\n4. 外部 (extern)\n\n示例：`auto float\
    \ x;` 或 `float x;` `extern int x;` `register char c;` `static int y;` 编译器根据以下假设不同的存储类：\n\
    \n1. 存储类：告诉我们存储位置（变量存储在哪里）。\n2. 初始值：变量的初始值是什么。如果没有分配初始值，未初始变量取什么值。\n3. 变量范围：程序中变量的值范围。\n\
    4. 生命周期：它是变量创建和销毁之间的时间，或者变量存在多久。\n\n#### 1 自动存储类\n用于声明自动存储类的关键字是 `auto`。其特点是：`存储`-内存位置\
    \ `默认初始值`-不可预测的值或垃圾值。`范围`-局限于定义的函数或块。` 生命周期`-直到控制权留在定义的函数或块内。它在函数释放时终止。\n\n没有任何存储类指示符的变量称为自动变量。示例：`main(\
    \ ) { auto int i; printf(“i=”,i); }`\n\n**课程笔记：19\n\n#### 2 寄存器存储类\n用于声明此存储类的关键字是\
    \ `register`。其特点是：`存储`:CPU 寄存器 `默认初始值`-垃圾值 `范围`:局限于定义的函数或块。` 生命周期`-直到控制权留在定义的函数或块内。\n\
    \n寄存器变量没有内存地址，因此我们不能对其应用地址操作符。CPU 寄存器通常为 16 位或 2 字节。因此我们只能对整数、字符、指针类型应用存储类。\n\n"
