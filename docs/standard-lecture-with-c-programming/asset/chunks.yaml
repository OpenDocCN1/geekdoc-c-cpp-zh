    exp1 ? exp2 :exp3


    Here exp1 is first evaluated. It is true then value return will be exp2 . If false
    then exp3.


    EXAMPLE


    void main()


    {


    int a=10, b=2 int s= (a>b) ? a:b; printf(“value is:%d”); Output: Value is:10


