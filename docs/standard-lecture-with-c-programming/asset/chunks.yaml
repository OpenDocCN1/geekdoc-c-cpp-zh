  trans: "\n\n`<<` 左移 `5` 从左到右 `>>` 右移\n\n`<=` 小于等于 `6` 从左到右 `>=` 大于等于\n\n`<` 小于\n\
    \n`>` 大于\n\n`==` 等于 `7` 从左到右 `!=` 不等于\n\n`&` 按位与 `8` 从左到右\n\n`^` 按位异异 `9` 从左到右\n\
    \n`|` 按位或 `10` 从左到右 `&&` 逻辑与 `11`\n\n`||` 逻辑或 `12`\n\n`?:` 三元运算符\n\n`=`, `*=`,\
    \ `/=`, `%=` 赋值运算符 `14` 从右到左 `&=`, `^=`, `<<=`, `>>=`\n\n`,` 逗号运算符\n\n---\n\n\
    ## 讲义笔记：7*\n\n### 控制语句\n\n通常情况下，C 程序的语句按照它们在程序中出现的顺序执行。但有时我们会使用决策条件来只执行程序的一部分，这被称为控制语句。控制语句定义了控制如何从程序的某部分转移到另一个部分。有几种控制语句，如\
    \ `if...else`、`switch`、`while`、`do....while`、`for` 循环、`break`、`continue`、`goto`\
    \ 等。\n\n### C 语言中的循环\n\n循环：它是执行一组指令的语句块。在循环中重复程序的特定部分，直到达到指定的次数或直到满足某个特定条件。\n\n\
    C 语言中有三种循环：\n\n1. `While` 循环\n2. `do while` 循环\n3. `for` 循环\n\n#### While 循环\n\
    \n语法：\n`while(condition) { Statement 1; Statement 2; }` 或 `while(test condition)\
    \ Statement;` 测试条件可以是任何表达式..当我们想要执行固定次数的某些操作但不知道迭代次数时，在程序中就会使用 `while` 循环。\n\n\
    这里首先检查条件，如果为真，则执行循环体；否则，如果条件为假，控制将退出循环。\n\n示例：\n\n```c\n/* 写一个程序打印 5 次 welcome\
    \ to C” */\n#include<stdio.h>\nvoid main()\n{\nint p=1;\nWhile(p<=5)\n{\nprintf(“Welcome\
    \ to C\\n”);\nP=p+1;\n}\n}\n```\n输出：Welcome to C Welcome to C Welcome to C Welcome\
    \ to C Welcome to C\n\n因此只要条件保持为真，`while` 循环体内的语句就会反复执行。\n\n#### do while 循环\n\
    \n这种（do while 循环）语句也用于循环。此循环的体可能包含单个语句或语句块。编写此语句的语法是：\n\n语法：\n```c\nDo\n{\nStatement;\n\
    }\nwhile(condition);\n```\n\n示例：\n```c\n#include<stdio.h> \nvoid main() { \nint\
    \ X=4;\ndo {\nPrintf(“%d”,X); X=X+1; \n}whie(X<=10);\nPrintf(“ ”); \n}\n```\n\
    输出：4 5 6 7 8 9 10\n\n在这里首先执行体内的语句，然后检查条件。如果条件为真，则再次执行循环体，这个过程一直持续直到条件变为假。与 `while`\
    \ 循环不同，分号放在了 while 的末尾。\n\n`while` 循环和 `do while` 循环之间存在细微差别，`while` 循环在执行循环的任何语句之前测试条件。而\
    \ `do while` 循环在循环内至少执行一次语句后才测试条件。\n\n如果初始条件为假，`while` 循环不会执行其语句；另一方面，`do while`\
    \ 循环即使条件第一次失败，也会至少执行一次其语句。这意味着 `do while` 循环始终至少执行一次。**注意：** 当我们想要至少执行一次循环时，很少使用\
    \ `Do while` 循环。\n\n## 讲义笔记：8*\n\n### for 循环\n\n在程序中，当预先知道迭代次数时，通常使用 `for` 循环。循环体可以是单个语句或多个语句。它的编写语法为：\n\
    \n语法：`for(exp1;exp2;exp3) { Statement; }`\n或 `for(initialized counter; test counter;\
    \ update counter) { Statement; }`\n\n在这里，`exp1` 是初始化表达式，`exp2` 是测试表达式或条件，`exp3`\
    \ 是更新表达式。表达式 1 在循环开始时仅执行一次，用于初始化循环变量。条件表达式通常使用关系运算符和逻辑运算符。而更新部分仅在循环体执行完毕后执行。\n\
    \n示例：\n```c\nvoid main()\n{\nint i;\nfor(i=1;i<10;i++)\n{\nPrintf(“ %d ”, i);\n\
    }\n}\n```\n输出:-1 2 3 4 5 6 7 8 9 \n\n#### 循环嵌套\n\n当一个循环写在另一个循环的体内部时，被称为循环嵌套。任何类型的循环都可以嵌套在任何类型的循环中，如\
    \ `while`、`do while`、`for`。例如，`for` 循环的嵌套可以表示为：\n\n```c\nvoid main()\n{\nint i,j;\n\
    for(i=0;i<2;i++)\nfor(j=0;j<5; j++)\nprintf(“%d %d”, i, j);\n}\n```\n输出：i=0 j=0\
    \ 1 2 3 4 i=1 j=0 \n\n#### 跳出语句 (break)\n\n有时在条件变为假之前需要退出循环，这时使用 `break` 语句。`break`\
    \ 语句用于循环和 `switch` 语句中。它会导致从它所在的循环中立即退出，并跳转到循环之后的语句。这种 `break` 语句通常与 `if` 语句关联。\n\
    \n示例：\n```c\nvoid main()\n{\nint j=0;\nfor(;j<6;j++)\nif(j==4)\nbreak;\n}\n```\n\
    输出：0 1 2 3\n\n#### 继续语句 (continue)\n\n`continue` 语句用于跳过循环的某些语句后继续下一次迭代。当遇到它时，控制会自动通过循环的开头。它通常与\
    \ `if` 语句关联。当我们想要继续程序而不执行程序的某些部分时，它是很有用的。\n\n`break` 和 `continue` 的区别在于，当遇到 `break`\
    \ 时循环终止并转移到下一条；而遇到 `continue` 时，控制回到起始位置。\n\n在 `while` 和 `do while` 循环中，遇到 `continue`\
    \ 语句后控制转移到测试条件并继续循环；而在 `for` 循环中，遇到 `continue` 后控制转移到更新表达式并测试条件。\n\n示例：\n```c\n\
    void main()\n{\nint n;\nfor(n=2; n<=9; n++)\n{\nif(n==4)\ncontinue;\nprintf(“%d”,\
    \ n);\n}\nPrintf(“out of loop”); }\n```\n输出：2 3 5 6 7 8 9 out of loop\n\n## 讲义笔记：9*\n\
    \n### if 语句\n\n`if` 语句在条件为真时执行执行一组命令，其语法为：\n\n`If (condition) Statement;`\n\n\
    语句仅在条件为真时执行。如果 `if` 语句的体包含多条语句，最好使用一对大括号。在这里，在这种情况下条件为假，编译器将跳过 `if` 块内的行。\n\n\
    ```c\nvoid main()\n{\nint n; printf (“ enter a number:”); scanf(“%d”,&n);\nIf\
    \ (n>10) Printf(“ number is grater”);\n}\n```\n输出：Enter a number:12 Number is\
    \ greater\n\n**if…..else ... Statement**\n\n"
- fmt: "\nit is bidirectional conditional control statement that contains one condition\
    \ & two possible action. Condition may be true or false, where non-zero value\
    \ regarded as true & zero value regarded as false. If condition are satisfy true,\
    \ then a single or block of statement executed otherwise another single or block\
    \ of statement is executed.\n\nIts syntax is:\n\n```c\nif (condition)\n{\n   \
    \ Statement1;\n    Statement2;\n}\nelse\n    Statement1; Statement2;\n```\n\n\
    Else cannot be used without `if` or no multiple `else` statement are allowed within\
    \ one `if` statement. It means there must be a `if` statement with in an `else`\
    \ statement.\n\nExample:\n```c\n/* To check a number is eve or odd */ \nvoid main()\
    \ { \n    int n; \n    printf (“enter a number:”); \n    sacnf (“%d”, &n); \n\
    \    If (n%2==0) printf (“even number”); \n    else printf(“odd number”); \n}\n\
    ```\nOutput: enter a number:121 odd number\n\n## Lecture Note: 10\n\n### Nesting\
    \ of if …else\nWhen there are another `if else` statement in `if-block` or `else-block`,\
    \ then it is called nesting of `if-else` statement.\n\nSyntax is :\n\n```c\nif\
    \ (condition) \n    If (condition)\n        Statement1; \n    else\n        statement2;\n\
    Statement3;\n```\n\n### If….else LADDER\nIn this type of nesting there is an `if\
    \ else` statement in every `else` part except the last part. If condition is false\
    \ control pass to block where condition is again checked with its `if` statement.\n\
    \nSyntax is :\n\n```c\nif (condition)\n    Statement1; \nelse if (condition)\n\
    \    statement2; \nelse if (condition)\n    statement3; \nelse statement4;\n```\n\
    \nThis process continue until there is no `if` statement in the last block. if\
    \ one of the condition is satisfy the condition other nested “else if” would not\
    \ executed. But it has disadvantage over `if else` statement that, in `if else`\
    \ statement whenever the condition is true, other condition are not checked. While\
    \ in this case, all condition are checked.\n\n## Lecture Note: 11\n\n### ARRAY\n\
    Array is the collection of similar data types or collection of similar entity\
    \ stored in contiguous memory location. Array of character is a string. Each data\
    \ item of an array is called an `element`. And each element is unique and located\
    \ in separated memory location. Each of elements of an array share a variable\
    \ but each element having different index no. known as subscript.\n\nAn array\
    \ can be a single dimensional or multi-dimensional and number of subscripts determines\
    \ its dimension. And number of subscript is always starts with zero. One dimensional\
    \ array is known as vector and two dimensional arrays are known as matrix.\n\n\
    **ADVANTAGES**: array variable can store more than one value at a time where other\
