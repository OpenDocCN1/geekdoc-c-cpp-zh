  trans: "\n\n# C 语言程序结构\n\n1 ) 注释行\n2) 预处理器指令\n3 ) 全局变量声明\n4) `main()` 函数\n- 局部变量；语句；\n\
    - 用户定义函数\n\n## 注释行\n`Comment line` 表示程序的目的。它表示为 `/*……………………………..*/`。\n\n注释行用于提高程序的可读性。它有助于解释程序，通常用于文档说明。它被包含在注释符中。注释可以是单行的也可以是多行的，但不应嵌套。它可以出现在程序中除字符串常量和字符常量以外的任何地方。\n\
    \n## 预处理器指令\n`#include<stdio.h>` 告诉编译器包含标准输入输出库的信息。它也用于符号常数，例如 `#define PI 3.14`。`stdio.h`（标准输入输出头文件）包含了系统定义函数如\
    \ `printf()`、`scanf()`、`pow()` 等等的定义与声明。通常 `printf()` 函数用于显示内容，而 `scanf()` 函数用于读取值。\n\
    \n## 全局声明\n这是一个在全局声明变量的部分，以便程序中使用的所有函数都可以访问它们。它通常声明在函数之外：\n\n## main()\n它是用户定义的函数，每个函数都有一个\
    \ `main()` 函数，程序实际上从这里开始运行，它被包含在一对括号中。`main()` 函数可以出现在程序的任何位置，但在习惯上它被放置在第一位。\n\
    \n### 语法：\n```\nmain()\n{\n……..\n……..\n……..\n}\n```\n\n当 `main()` 函数被声明为数据类型 `int\
    \ main()` 时，它有返回值：\n```\nint main()\n{\nreturn 0\n}\n```\n当类型为 void（意味着空/无）如 `void\
    \ main(void)` 或 `void main()` 时，主函数不返回任何值：\n```\nvoid main() { printf (“C language”);\
    \ }\n```\n输出：C language 程序的执行从左括号开始，以右括号结束。两个括号之间提到了声明部分以及可执行部分。在每行的末尾给出一个分号，表示语句的结束。\n\
    \n### /*带有返回语句的第一个 C 程序*/\n```c\n#include <stdio.h>\n\nint main (void)\n{\n  \
    \  printf (\"welcome to c Programming language.\\n\");\n    return 0;\n}\n```\n\
    输出：welcome to c programming language.\n\n## 编译和执行程序的步骤\n编译器是一个软件程序，它分析用特定计算机语言编写的程序，然后将其翻译成在特定计算机系统上执行的格式。下图显示了用\
    \ C 语言编程开发的计算机程序在输入、编译和执行过程中涉及的步骤，以及从命令行输入的典型 Unix 命令。\n\n### 第 1 步\n首先将要编译的程序输入到计算机系统中的一个\
    \ `file` 中。文件名命名有各种约定，通常只要最后两个字符是 `.c` 或者扩展名为 `.c` 的文件，可以是任何名称。因此，文件名 `prog1.c`\
    \ 可能是 C 语言程序的有效文件名。通常使用文本编辑器将 C 程序输入到文件中。例如，`vi` 是 Unix 系统上常用的文本编辑器。输入到文件的程序被称为`源程序`，因为它代表了用\
    \ C 语言表示的程序的原始形式。\n\n### 第 2 步\n在将源程序输入到文件后，继续进行编译。编译过程通过在系统上输入特殊命令来启动。当输入此命令时，必须指定包含源程序的文件的名称。例如，在\
    \ Unix 下，启动程序编译的命令称为 `cc`。如果我们使用流行的 GNU C 编译器，我们使用的命令是 `gcc`。\n\n输入该行：\n```\n\
    gcc prog1.c or cc prog1.c\n```\n在编译过程的第一步，编译器检查源程序中包含的每个程序语句并进行检查以确保它符合语言的语法和语义。如果编译器在此阶段发现任何错误，会将它们报告给用户，编译过程将到此结束。然后必须在源程序中修正这些错误（使用编辑器），并重新开始编译过程。在编译此阶段报告的典型错误可能是由于表达式的括号不平衡（`语法错误`），或由于使用了未“定义”的变量（`语义错误`）。\n\
    \n### 第 3 步\n当程序中所有的语法和语义错误都被消除后，编译器将处理程序的每条语句并将其翻译成一种“低级”形式，这种形式等同于执行相同任务所需的汇编程序。\n\
    \n### 第 4 步\n程序翻译后，编译过程的下一步是将汇编语言语句翻译成实际的机器指令。汇编器获取每个汇编语句并将其转换为名为`object code`的二进制格式，然后将其写入系统上的另一个文件中。在\
    \ Unix 下，该文件与源文件同名，但最后一个字母是 `o`（代表 object）而不是 `c`。\n\n### 第 5 步\n程序翻译成目标代码后，就可以进行`linked`（链接）。每当在\
    \ Unix 下发布 `cc` 或 `gcc` 命令时，此过程再次自动执行。链接阶段的目的是让程序进入可以在计算机上执行的最终形式。如果程序使用了之前由编译器处理过的其他程序，那么在此阶段这些程序将被链接在一起。系统使用的程序`library`在此阶段也会搜索并与目标程序链接。编译和链接程序的过程通常称为构建。\n\
    \n### 第 6 步\n最终链接的文件是可执行的`object`代码，存储在系统的另一个文件中，准备好运行或`执行`。在 Unix 下，这默认称为 `a.out`。在\
    \ Windows 下，可执行文件通常与源文件同名，将 c 扩展替换为 exe 扩展。随后执行程序时，命令`a.out`具有将名为 a.out 程序加载到计算机内存并启动其执行的作用。\n\
    \n当程序执行时，程序的每条语句按顺序执行。如果程序向用户请求任何数据（即`input`），程序将临时暂停执行以便输入。或者，程序可能只是等待某个`event`（如点击鼠标）发生。程序显示的结果（即`output`）出现在窗口中，有时称为`console`。如果程序没有产生预期的结果，则需要返回并重新分析程序的逻辑。这被称为`调试阶段`，在此期间将尝试从程序中删除所有已知问题或`bug`。为了这样做，可能需要对原始源程序进行修改。\n\
    \n## *课程笔记：3*\n### 字符集\n字符表示用于表示信息的任何字母、数字或特殊符号。C 允许的有效字母、数字和特殊符号有\n\n"
- fmt: "\nThe alphabets, numbers and special symbols when properly combined form constants,\
    \ variables and keywords.\n\n## Identifiers\n\nIdentifiers are user defined word\
    \ used to name of entities like variables, `arrays`, `functions`, `structures`\
    \ etc. Rules for naming identifiers are:\n\n1) name should only consists of alphabets\
    \ (both upper and lower case), digits and underscore (`_`) sign.\n\n2) first characters\
    \ should be alphabet or underscore\n\n3) name should not be a keyword\n\n4) since\
    \ `C` is a case sensitive, the upper case and lower case considered differently,\
    \ for example `code`, `Code`, `CODE` etc. are different identifiers. \n5) identifiers\
    \ are generally given in some meaningful name such as `value`, `net_salary`, `age`,\
    \ `data` etc. An identifier name may be long, some implementation recognizes only\
    \ first eight characters, most recognize 31 characters. ANSI standard compiler\
    \ recognize 31 characters. Some invalid identifiers are `5cb`, `int`, `res#`,\
    \ `avg no` etc.\n\n## Keyword\n\nThere are certain words reserved for doing specific\
    \ task, these words are known as `reserved word` or `keywords.` These words are\
    \ predefined and always written in lower case or small letter. These keywords\
    \ cann’t be used as a variable name as it assigned with fixed meaning. Some examples\
    \ are `int`, `short`, `signed`, `unsigned`, `default`, `volatile`, `float`, `long`,\
    \ `double`, `break`, `continue`, `typedef`, `static`, `do`, `for`, `union`, `return`,\
    \ `while`, `do`, `extern`, `register`, `enum`, `case`, `goto`, `struct`, `char`,\
    \ `auto`, `const` etc.\n\n## Data types\n\nData types refer to an extensive system\
    \ used for declaring variables or functions of different types before its use.\
    \ The type of a variable determines how much space it occupies in storage and\
    \ how the bit pattern stored is interpreted. The value of a variable can be changed\
    \ any time.\n\n`C` has the following 4 types of data types\n\n- **basic built-in\
    \ data types**: `int`, `float`, `double`, `char`\n- **Enumeration data type**:\
    \ `enum`\n- **Derived data type**: `pointer`, `array`, `structure`, `union`\n\
    - **Void data type**: `void`\n\nA variable declared to be of type `int` can be\
    \ used to contain integral values only—that is, values that do not contain decimal\
    \ places. A variable declared to be of type `float` can be used for storing floating-\
    \ point numbers (values containing decimal places). The `double` type is the same\
    \ as type `float`, only with roughly twice the precision. The `char` data type\
    \ can be used to store a single character, such as the letter `a`, the digit character\
    \ `6`, or a semicolon similarly A variable declared `char` can only store character\
    \ type value.\n\nThere are two types of type qualifier in `c`\n\n- **Size qualifier**:\
    \ `short`, `long`\n- **Sign qualifier**: `signed`, `unsigned`\n\nWhen the qualifier\
    \ `unsigned` is used the number is always positive, and when `signed` is used\
    \ number may be positive or negative. If the sign qualifier is not mentioned,\
    \ then by default sign qualifier is assumed. The range of values for signed data\
    \ types is less than that of unsigned data type. Because in signed type, the left\
    \ most bit is used to represent sign, while in unsigned type this bit is also\
    \ used to represent the value. The size and range of the different data types\
    \ on a 16 bit machine is given below:\n\n| Basic data type Data type with type\
    \ qualifier (byte) | Size | Range |\n| :--- | :--- | :--- | :--- |\n| `char` |\
    \ `char` or `signed char` | 1 | -128 to 127 |\n| `unsigned char` | | 1 | 0 to\
    \ 255 |\n| `int` | `int` or `signed int` | 2 | -32768 to 32767 |\n| `unsigned\
    \ int` | | 2 | 0 to 65535 |\n| `short int` | `short int` or `signed short int`\
    \ | 1 | -128 to 127 |\n| `unsigned short int` | | 1 | 0 to 255 |\n| `long int`\
    \ | `long int` or `signed long int` | 4 | -2147483648 to 2147483647 |\n| `unsigned\
    \ long int` | | 4 | 0 to 4294967295 |\n| `float` | `float` | 4 | -3.4E-38 to 3.4E+38\
    \ |\n| `double` | `double` | 8 | 1.7E-308 to 1.7E+308 |\n| `Long double` | | 10\
    \ | 3.4E-4932 to 1.1E+4932 |\n\n## Lecture Note: 4\n\n### Constants\n\nConstant\
    \ is a any value that cannot be changed during program execution. In `C`, any\
    \ number, single character, or character string is known as a `constant`. A constant\
    \ is an entity that doesn’t change whereas a variable is an entity that may change.\
    \ For example, the number `50` represents a constant integer value. The character\
    \ string `\"Programming in C is fun.\\n\"` is an example of a constant character\
    \ string. `C` constants can be divided into two major categories:\n\n- Primary\
    \ Constants\n- Secondary Constants\n\nThese constants are further categorized\
    \ as\n\n![](Images/image00045.jpeg)\n\n- **Numeric constant**\n- **Character constant**\n\
    - **String constant**\n\n#### Numeric constant\n\nNumeric constant consists of\
    \ digits. It required minimum size of 2 bytes and max 4 bytes. It may be positive\
    \ or negative but by default sign is always positive. No comma or space is allowed\
    \ within the numeric constant and it must have at least 1 digit. The allowable\
    \ range for integer constants is -32768 to 32767. Truly speaking the range of\
    \ an Integer constant depends upon the compiler. For a 16-bit compiler like `Turbo\
    \ C` or `Turbo C++` the range is –32768 to 32767\\. bit compiler, what range of\
    \ an Integer constant has to do with the type of compiler.\n\nIt is categorized\
    \ a `integer constant` and `real constant.` An integer constants are whole number\
    \ which have no decimal point. Types of integer constants are:\n- **Decimal constant**:\
    \ `0-------9` (base 10)\n- **Octal constant**: `0-------7` (base 8)\n- **Hexa\
    \ decimal constant**: `0----9, A------F` (base 16)\n\nIn decimal constant first\
    \ digit should not be zero unlike octal constant first digit must be zero(as `076`,\
