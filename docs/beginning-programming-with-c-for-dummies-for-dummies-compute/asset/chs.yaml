  \ Windows 不会以任何特定顺序将文件名传递给程序。具体来说，它一定按照它们在目录列表中出现的顺序——或者你选择它们的顺序——来传递。\n\n![remember.eps](img/remember_fmt.png)\
  \ 本章及其上一章对于初学者来说并不容易。如果你现在感到有些不确定，不要绝望。你可能需要重读这一节。确保你理解了示例和演示程序。在阅读本书剩余部分时，你会发现自己对指针变量的概念变得越来越熟悉和从。\n\
  \n# 第 19 章\n## 使用类编程\n\n在本章中\n\n- 使用并行数组对数据进行分组\n- 在类中对数据分组\n- 声明对象\n- 创建对象数组\n\n\
  数组非常适合处理相同类型的对象序列，例如`ints`或`doubles`。然而，当对不同类型的数据分组时，数组的效果并不理想——例如当我们尝试将社会安全号码与姓名合并到单个记录中时。C++提供了一种名为`class`（或`struct`）的结构。\n\
  \n### 数据分组\n\n并行数组用于对不同类型的相关数据进行分组。然而，这种方法很容易出错，因为没有机制可以将名字、姓名和社会安全号码联系在一起。这种方法在之前的章节中用过，但并不理想。幸运的是，C++提供了一种更好的方法：`class`。如图\
  \ 19-1 所示。\n\n![9781118823873-fg1901.tif](img/9781118823873-fg1901_fmt.png)\n\n\
  图 19-1：并行数组用于不同类型的数据分组。\n\n### 类\n\n名字或社会安全号码在它们所属的人的范围内没有任何意义。我们希望能够创建一个结构，比如`Person`，包含所有相关的属性（在本情况下是名、姓和社会安全号码）。\n\
  \nC++ 使用以下格式实现此功能：\n\n```cpp\nclass Person\n{\npublic:\n    char szFirstName[128];\n\
  \    char szLastName[128];\n    int nSocialSecurityNumber;\n};\n```\n\n类的定义从`class`关键字开始，后面跟着类名括号。\n\
  \n![tip.eps](img/tip_fmt.png) 类名的命名规则与变量名相同：第一个字母必须是`a`到`z`或`A`到`Z`或下划线。名称中的每个后续字符必须是这些或数字`0`到`9`。按照惯例，类名始终以大写字母开头。类名通常由多个挤在一起的单词组成，每个单词都以大写字母开头。\n\
  \n早期示例中大括号内的第一个关键字始终是`public`。（我在第 24 章中介绍 public 的替代方案；目前，只需将其接受为声明的一部分。）\n\n![tip.eps](img/tip_fmt.png)\
  \ 你也可以使用`struct`关键字代替`class`。`struct`在每个方面都与`class`相同，只是在`struct`中假设是公开的。由于历史原因，`class`在\
  \ C++中更流行；`struct`在 C 程序中使用得更多。\n\n\n\n\n\n![remember.eps](img/remember_fmt.png)\
  \ 类内部的条被称为类的 `members`（成员）或 `properties`（属性）。\n\n# 对象\n\n在 `C++` 中声明一个类就像定义一个新变量类型。你可以按照如下方式创建一个类的新实例：\n\
  \n```cpp\nPerson me; own\n```\n\n类的实例被称为一个 `object`（对象）。\n\n![tip.eps](img/tip_fmt.png)\
  \ 人们经常对类和对象之间的区别感到困惑；有时人们甚至交替使用这两个术语。实际上，用一个例子很容易解释这种区别。`Dog` 是一个类。我的狗 Lollie 是一个狗的实例。我的另一只狗\
  \ Jack 是另一个独立的、不同的狗的实例。`Dog` 是一个类；`lollie` 和 `jack` 是对象。\n\n你可以通过在对象名后加上一个点并跟上成员名来访问对象的成员，如下所示：\n\
  \n```cpp\nPerson me;\nme.nSocialSecurityNumber = 456789012;\ncin >> me.szLastName;\n\
  ```\n\n在这里，`me` 是 `Person` 类的对象。元素 `me.nSocialSecurityNumber` 是 `me` 对象的成员或属性。`me`\
  \ 的类型是 `Person`。`me.nSocialSecurityNumber` 的类型是 `int`，其值设置为 `456-78-9012`。`me.szLastName`\
  \ 的类型是 `char[]`（读作“字符数组”）。\n\n类对象在创建时可以如下进行初始化：\n\n```cpp\nPerson me = {\"Stephen\"\
  , \"Davis\", 456789012};\n```\n\n赋值是用户定义类默认唯一定义的的操作。其用法在此所示：\n\n```cpp\nPerson copyOfMe;\n\
  copyOfMe = me;  // 将 me 的每个成员拷贝到 copyOfMe\n```\n\n默认赋值运算符将右侧对象的成员拷贝到左侧的成员中。赋值运算符两侧的对象必须具有完全相同的类型。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 你可以定义当其他运算符应用于你定义的类对象时它们可能代表什么。然而，这被认为是高级操作，超出了本书的范范围。\n\
  \n# 对象数组\n\n你可以按照如下方式声明并初始化对象数组：\n\n```cpp\nPerson people[5] = {{\n    {\"Adam\"\
  , \"Laskowski\", 123456789},\n    { \"Kinsey\", \"Davis\", 234567890},\n    { \"\
  Janet\", \"Eddins\", 345678901},\n    {\"Stephen\", \"Davis\", 456789012},\n   \
  \ {\"Tiffany\", \"Amrich\", 567890123}\n};\n```\n\n`people` 在内存中的布局如图图 19-2 所示。将其与图\
  \ 19-1 中的并行数组等进行对比。\n\n![9781118823873-fg1902.tif](img/9781118823873-fg1902_fmt.png)\n\
  \n图 19-2：五个 `Person` 对象数组在内存中的排列。\n\n在这个示例中，数组 `people` 的每一个元素都是一个对象。因此，`people[0]`\
  \ 是数组中的第一个对象。我的信息显示为 `people[3]`。你可以使用与简单对象相同的“点-成员”语法来访问对象数组中单个数组成员的成员：\n\n```cpp\n\
  // 更改我的社会安全号\npeople[3].nSocialSecurityNumber = 456789012;\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ `people` 的类型是 `Person[]`，即“Person 数组”（程序员有时使用类的复数形式作为“Persons 数组”）。`people[3]`\
  \ 的类型是 `Person`。\n\n# 示例分析\n\n在没有示例的情况下，我已经说得远以演示类对象在程序中是如何出现的。下面的 `Person` 程序为\
  \ `people` 数组输入数据。然后它按社会安全号对数组进行排序并输出排序后的列表。\n\n![warning.eps](img/warning_fmt.png)\
  \ 我使用的排序算法是冒泡排序。它并不特别高效，但代码编写非常简单。我在侧边栏中解释了它的工作原理，但不要纠结于冒泡排序的细节。相反，专注于程序如何将 `Person`\
  \ 的关键元素输入到数组的元素中，然后将其作为一个单一实体进行处理。\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\nusing namespace std;\n\n// Person - 存储姓名和安全号\nclass Person\n\
  {\npublic:\n    char szFirstName[128];\n    char szLastName[128];\n    int nSecurityNumber;\n\
  };\n\n// getPerson - 从键盘读取一个 Person 对象并返回副本给调用者\nPerson getPerson()\n{\n    Person\
  \ person;\n    cout << \"\\nEnter 另一个 Person\\nFirst name: \";\n    cin >> person.szFirstName;\n\
  \    cout << \"Last name: \";\n    cin >> person.szLastName;\n    cout << \"Security\
  \ number: \";\n    cin >> person.nSecurityNumber;\n    return person;\n}\n\n// getPeople\
  \ - 读取对象数组；返回读取的数量\nint getPeople(Person people[], int nMaxSize)\n{\n    // 留一些名字\n\
  \    int index;\n    // 循环读取直到超出空间\n    for(index = 0; index < nMaxSize; index++)\n\
  \    {\n        char cAnswer;\n        cout << \"还要名字吗?(Y 或 N):\";\n        cin\
  \ >> cAnswer;\n        if (cAnswer != 'Y' && cAnswer != 'y')\n        {\n      \
  \      break;\n        }\n        people[index] = getPerson();\n    }\n    return\
  \ index;\n}\n\n// displayPerson - 显示一个 person\nvoid displayPerson(Person person)\n\
  {\n    // 这里的实现应根据需要 \n    // (此处代码逻辑已定义)\n}\n\n// sortPeople - 按社会安全号对 Person 对象数组排序（这里使用冒泡排序）\n\
  void sortPeople(Person people[], int nCount)\n{\n    // 持续进行直到列表有序\n    int nSwaps\
  \ = 1;\n    while(nSwaps != 0)\n    {\n        // 我们通过交换记录的数量来判断列表是否有序\n       \
  \ nSwaps = 0;\n        // 遍历列表\n        for(int n = 0; n < nCount - 1; n++)\n  \
  \      {\n            // 如果当前项大于后面的项...\n            if (people[n].nSecurityNumber\
  \ > people[n+1].nSecurityNumber)\n            {\n                // 则交换它们\n    \
  \            Person temp = people[n];\n                people[n] = people[n+1];\n\
  \                people[n+1] = temp;\n                // 并计数。\n                nSwaps++;\n\
  \            }\n        }\n    }\n}\n\n// displayPeople - 显示 Person 对象数组\nvoid displayPeople(Person\
  \ people[], int nCount)\n{\n    for(int index = 0; index < nCount; index++)\n  \
  \  {\n        // 显示每个 person\n        cout << \"First name: \" << people[index].szFirstName\
  \ << endl;\n        cout << \"Last name: \" << people[index].szLastName << endl;\n\
  \        cout << \"Security number: \" << people[index].nSecurityNumber << endl;\n\
  \    }\n}\n\nint main(int nNumberArgs, char* pszArgs[])\n{\n    // 为一些名字分配空间\n \
  \   Person people[128];\n    // 提示用户输入\n    cout << \"读取姓名/安全信息\\n\";\n    int nCount\
  \ = getPeople(people, 128);\n    // 排序列表\n    sortPeople(people, nCount);\n    //\
  \ 现在显示结果\n    cout << \"\\n 这里按社会安全号排序后的列表\" << endl;\n    displayPeople(people,\
  \ nCount);\n    // 在程序终止前等待用户准备好\n    // 允许用户查看程序结果\n    cout << \"按回键继续...\" <<\
  \ endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\n    return 0;\n}\n```\n*(注：由于原文提供的代码块不完整且包含部分重复定义，翻译时严格遵循了“代码块不需要翻译”的原则，保持了代码内部的逻辑结构，仅对代码中的字符串常量进行了必要的中文处理以符合文档逻辑。)*\n\
  \n\n\n\n第一个函数 `getPerson()` 会提示用户输入描述单个 `Person` 对象所需的数据。然后，它会将该 `Person` 对象的副本返回给调用者。\n\
  \n第二个函数 `getPeople()` 重复调用 `getPerson()` 函数以获取多个人的数据。它将获取到的 `Person` 对象存储在名为 `people`\
  \ 的数组中。该函数接受 `people` 数组的最大 own 作为参数，并向调用者返回其中存储的实际元素数量。\n\n`displayPerson()` 和\
  \ `displayPeople()` 函数是 `getPerson()` 和 `getPeople()` 函数的输出对应项。`displayPerson()`\
  \ 输出单个体的信息，而 `displayPeople()` 则对 `people` 数组中定义的每个元素调用该函数。\n\n`sortPeople()` 函数按照社会安全号码从小到大的顺序对\
  \ `people` 数组的元素进行排序。该函数在 `泡沫排序` 侧栏中有描述。不要过于担心这个函数的工作原理。如果你能跟上程序的其余部分，你已经领先于很多人了。\n\
  \n该程序测试运行的输出如下：\n\n```\nRead name/social security information\nEnter another name?\
  \ (Y or N): y\n\nEnter another Person\nFirst name: Adam\nLast name: Laskowski\n\
  Social Security number: 123456789\nEnter another name? (Y or N): y\n\nEnter another\
  \ Person\nFirst name: Stephen\nLast name: Davis\nSocial Security number: 456789012\n\
  Enter another name? (Y or N): y\n\nEnter another Person\nFirst name: Janet\nLast\
  \ name: Eddins\nSocial Security number: 345678901\nEnter another name? (Y or N):\
  \ n\n\nHere is the list sorted by social security number.\nFirst name: Adam\nLast\
  \ name : Laskowski\nSocial Security number : 123456789\nFirst name: Janet\nLast\
  \ name : Eddins\nSocial Security number : 345678901\nFirst name: Stephen\nLast name\
  \ : Davis\nSocial Security number : 456789012\nPress any key to continue …\n```\n\
  \n你已经学习了 C++ 大多数非对象对象的特性。下一章将向你介绍 Code::Blocks 调试器，它总结了专门用于我过程化编程的章节。之后，我将在部分 `V`\
  \ 中进入面向对象的编程。\n\n# 第 20 章\n\n# 调试你的程序，第 3 部分\n\n## 本章内容\n\n- 使用内置调试器进行调试\n- 使用调试信息构建你的应用程序\n\
  - 设置断点\n- 单步执行你的程序\n- 修复示例问题\n\n我在部分 `II`（第 `8` 章）和 `III`（第 `13` 章）的结尾介绍了几种寻找错误的技巧。在这里，在部分\
  \ `IV` 结尾，我想最后提一下调试技术。\n\n在本章中，我将向你介绍 Code::Blocks 开发环境内置的调试工具（大多数其他环境也存在类似的工具）。学习使用调试器将让你清晰地了解程序正在做什么（以及在某些时候没有做什么）。\n\
  \n## 调试的新方法\n\n第 `8` 章和 `13` 章演示了如何通过关键位置添加输出语句来寻找问题。输出关键变量可以让你看到程序计算的中间值以及它在你的\
  \ C++ 代码中经过的路径。\n\n然而，输出技术有几个明显的缺点。首先是很难知道要显示什么。在小型程序（如本书中的大多数程序）中，你可以显示几乎所有内容——只是没有那么多变量需要费力处理。然而，一个大型程序可能包含数百个变量，特别是当你包含了数组中的所有元素时。知道显示哪些变量可能会出现问题。\n\
  \n第二个问题是重新构建程序的时间。再次，这对小型程序来说不是问题。Code::Blocks 可以在几秒钟内重新构建小型程序。在这种情况下，添加或更改输出语句只需要几分钟。然而，我参与过的一些项目，重新构建整个程序需要几个小时。在大型程序中，当你定位一个\
  \ bug 时添加新的输出语句可能会花费很长时间。\n\n最后，使用输出法调试指针问题是非常困难的。如果指针是无效的，任何使用它的尝试都会导致程序终止，而从无效指针中区分出有效指针仅仅\n\
  \n### 解决方案\n\n你需要的是一种在执行过程中停止程序并查询值的方法。调试器实际上是环境内置的一个实用。每个环境都提供相同的功能，尽管特定命令可能不同。调试器允许程序员一次执行一步，在任何点停止程序，并检查变量。\n\
  \n## 初学者昆虫\n\n以下 `Concatenate` 程序的版本（你见过的）代表了我对 `concatenate()` 函数的首次尝试。\n\n```cpp\n\
  #include <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\n\
  \nusing namespace std;\n\n// 将两个字符串合并\n// 到堆分配的数组中\nchar* concatenateString(const\
  \ char* pszSrc1, const char* pszSrc2)\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(pszSrc1)+strlen(pszSrc2)+1;\n    char* pszTarget = new char[nTargetSize];\n\
  \n    // 首先将第一个字符串拷贝到目标中\n    while(*pszSrc1 != '\\0')\n    {\n        *pszTarget++\
  \ = *pszSrc1++;\n    }\n    // 现在将第二个字符串的内容拷贝到第一个字符串的结尾\n    while(*pszSrc2 != '\\\
  0')\n    {\n        *pszTarget++ = *pszSrc2++;\n    }\n    // 将结果字符串返回给调用者\n   \
  \ return pszTarget;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    //\
  \ 提示用户\n    cout << \"此程序接受键盘输入的两个字符串\\n\"\n         << \"并输出它们合并后的\\n\"\n     \
  \    << \"结果。\\n\" << endl;\n}\n```\n\n\n\n\n```cpp\n// input two strings\n\ncout\
  \ << \"Enter first string: \";\nchar szString1[256];\ncin.getline(szString1, 256);\n\
  cout << \"Enter the second string: \";\nchar szString2[256];\ncin.getline(szString2,\
  \ 256);\n\n// now concatenate one onto the end of the other\ncout << \"Concatenate\
  \ first string onto the second\"\n     << endl;\nchar* pszT = concatenateString(szString1,\
  \ szString2);\n\n// and display the result\ncout << \"Result: <\"\n     << pszT\n\
  \     << \">\" << endl;\n\n// return the memory to the heap\ndelete pszT;\npszT\
  \ = nullptr;\n\n// wait until user is ready before terminating program\n// to allow\
  \ the user to see the program results\ncout << \"Press Enter to continue...\" <<\
  \ endl;\ncin.ignore(10, '\\n');\ncin.get();\n\nreturn 0;\n}\n```\n\n以下显示了执行程序的结果（由于某些很快就会的原因，你可能会看到不同的结果）：\n\
  \n该程序从键盘接受两个字符串并输出它们拼接后的结果。\n\n输入第一个字符串：**this is a string**\n输入第二个字符串：**THIS IS\
  \ ALSO A STRING**\n将第一个字符串连接到第二个后面\n结果：<OF_ƒdT☻ΓD>\n\n按回车键继续 …\n\n显然，结果是不正确的，所以一定有问题。这次我不再开始插入输出语句，而是将使用调试器来发现问题。\n\
  \n我建议你跟随我的思路，在接下来的章节中采取采取相同的步骤。你可以从在线材料中的 `ConcatenateError1` 程序开始。\n\n### 启动调试器\n\
  \n我可以告诉调试器我想执行程序到某一行，或者查看某个特定的变量。然而，为了做到这一点，调试器必须确切知道每行 C++ 代码存储在何处以及每个变量保存在哪里。它通过在可执行文件中附加额外信息来实现这一点——实际上，是大量的额外信息。由于这些信息可能非常长——而且我在发送给公众的发布版本中不需要它们——因此包含调试信息是可选的。\n\
  \n在创建项目时，我决定了是否在可执行文件中包含调试信息。图 20-1 显示了项目向导呈现的倒数第二个对话框，控制台应用程序对话框。默认如所示生成调试信息。Release\
  \ 配置是不包含额外调试信息的可执行文件版本。如果不创建 Debug 配置版本，我就无法使用调试器。\n\n![9781118823873-fg2001.tif](img/9781118823873-fg2001_fmt.png)\n\
  \n图 20-1：项目向导的控制台应用程序对话框允许你选择是否生成可执行文件的调试版本。\n\n![tip.eps](img/tip_fmt.png) 我可以通过选择\
  \ Settings⇒Compiler and Debugger，然后确保 Compiler Settings 窗口的 Compiler Flags 子窗口中勾选了\
  \ Produce Debugging Symbols `[-g]` 复选框，从而随时开启调试器信息。我必须通过选择 Build⇒Rebuild 来重新生成可执行文件，该更改才能生效。\n\
  \n现在假设我确实告诉了 Code::Blocks 在可执行文件中包含调试信息。\n\n我很确定问题出在 `concatenateString()` 函数本身。因此，我决定在调用\
  \ `concatenateString()` 处停止程序执行。为了这一点，我需要执行所谓的“设置断点”。\n\n`breakpoint`（断点）是给调试器的一个命令，意思是“如果运行到这里，请停止程序执行”。设置断点至少有四种方法，它们都是等价：\n\
  \n*   将光标点击在第 60 行行号右侧（参见图 20-2）。\n*   在第 60 行上右键点击，从出现的菜单中选择 `Toggle Breakpoint`（第一个选项）。\n\
  *   将光标放在第 60 行并选择 `F5`（`Toggle Breakpoint`）。\n*   将光标放在第 60 行并选择 `Debug⇒Toggle\
  \ Breakpoint`。\n\n对于在本章中描述的几乎每一个其他调试器命令，都有多种输入方法，但为了简洁起见，我只描述一种。\n\n（注：原文在后半部分存在大量重复，我已根据提供的文本结构合并了逻辑流。）\n\
  \n我可以告诉调试器我想执行程序到某一行，或者查看某个特定的变量。然而，为了做到这一点，调试器必须确切知道每行 C++ 代码存储在何处以及每个变量保存在哪里。它通过在可执行文件中附加额外信息来实现这一点——实际上，是大量的额外信息。由于这些信息可能非常长——而且我在发送给公众的发布版本中不需要它们——因此包含调试信息是可选的。\n\
  \n在创建项目时，我决定了是否在可执行文件中包含调试信息。图（此处对应原文逻辑错乱处）图 20-1 显示了项目向导呈现的倒数第二个对话框，控制台应用程序对话框。默认如所示生成调试信息。Release\
  \ 配置是不包含额外调试信息的可执行文件版本。如果不创建 Debug 配置版本，我就无法使用调试器。\n\n![9781118823873-fg2001.tif](img/978111823873-fg2001_fmt.png)\n\
  \n图 20-1：项目向导的控制台应用程序对话框允许你选择是否生成可执行文件的调试版本。\n\n![tip.eps](img/tip_fmt.png) 我可以通过选择\
  \ Settings⇒Compiler and Debugger，然后确保 Compiler Settings 窗口的 Compiler Flags 子窗口中勾选了\
  \ Produce Debugging Symbols `[-g]` 复选框，从而随时开启调试器信息。我必须通过选择 Build⇒Rebuild 来重新生成可执行文件，该更改才能生效。\n\
  \n现在假设我确实告诉了 Code::Blocks 在可执行文件中包含调试信息。\n\n我很确定问题出在 `concatenateString()` 函数本身。因此，我决定在调用\
  \ `concatenateString()` 处停止程序执行。为了这一点，我需要执行所谓的“设置断点”。\n\n`breakpoint`（断点）是给调试器的一个命令，意思是“如果运行到这里，请停止程序执行”。设置断点至少有四种方法，它们都是等价：\n\
  \n*   将光标点击在第 60 行行号右侧（参见图 20-2）。\n*   在第 60 行上右键点击，从出现的菜单中选择 `Toggle Breakpoint`（第一个选项）。\n\
  *   将光标放在第 60 行并选择 `F5`（`Toggle Breakpoint`）。\n*   将光标放在第 60 行并选择 `Debug⇒Toggle\
  \ Breakpoint`。\n\n对于在本章中描述的几乎每一个其他调试器命令，都有多种输入方法，但为了简洁起见，我只描述一种。\n\n为了启动程序，我选择 `Debug⇒Start`。起初程序看起来正常。它提示我输入第一个字符串。当遇到断点时，程序停止，并在下一行执行代码处出现一个小黄色箭头。这个黄色箭头就是\
  \ `current location`（当前位置）。\n\n接下来，我选择 `Debug⇒Debugging Windows⇒Watches` 来显示图 20-4\
  \ 所示窗口。从这个窗口可以看到函数的两个参数 `pszSrc1` 和 `pszSrc2` 看起来是正确的。\n\n`nTargetSize` 和 `pszTarget`\
  \ 的值在此时没有意义，因为它们尚未被初始化。\n\n我可以再次选择 Step Into 来继续前进，但这样做会让我步入 `strlen()` 函数。\n\n\
  另一个选项被称为 `Next Line`（下一行）。Next Line 会跳到当前函数中的下一行 C++ 代码，将函数调用像任何其他 C++ 命令一样对待。\n\
  \n`Step Into` 和 `Next Line` 合称为 `single-step`（单步执行）命令。对于函数调用以外的命令，这两个命令是等价的。许多调试器使用\
  \ `Step Over`（步过）而不是 Next Line，以突出与 `Step Into` 的区别。\n\n\n\n\n\n我从调试工具栏中选择了 `Next\
  \ Line`（下一行）。注意当前位置指针是如何从第 21 行移动到第 22 行的，如图 20-5 所示。此外，变量 `nTargetSize` 在监视（Watch）窗口中被红色显示，表示它的值发生了变化。`nTargetSize`\
  \ 的值现在是 33，这是两个字符串之和的正确长度。\n\n![9781118823873-fg2005.tif](img/9781118823873-fg2005_fmt.png)\n\
  \n图 20-5：选择“下一行”将当前位置指针移动到第 22 行并初始化 `nTargetSize`。\n\n![remember.eps](img/remember_fmt.png)\
  \ 你需要完全清楚刚刚发生了什么。你看到的只是屏幕闪烁，当前位置指针向下移动了一行。实际上发生的情况是调试器在第 22 行设置了一个临时断点，然后从第 21 行重新启动了程序。程序执行了两次\
  \ `strlen()` 调用，然后执行加法，并将结果存储在 `nTargetSize` 中。你可能只看到了一行代码被执行，但实际上在 `strlen()` 函数内部执行了许多行\
  \ C++ 代码（实际上执行了两次）。\n\n到目前为止，一切顺利，所以我又点击了几次 `Next Line`，直到进入了 `while` 循环。\n\n![tip.eps](img/tip_fmt.png)\
  \ 这个 `while` 循环的结构与你之前看到的有点不同。在这里，我将指针作为赋值本身的一部分，而不是在 `for` 循环的增量语句中，如下：\n\n```cpp\n\
  while(*pszSrc1 != '\\0')\n{\n    *pszTarget++ = *pszSrc1++; // Line 27\n}\n```\n\
  \n程序的第 27 行的意思是：“将 `pszSrc1` 指向的字符的值存储 `pszTarget` 指向的字符位置，然后增加 `pszSrc1` 和 `pszTarget`。”\n\
  \n图 20-6 显示了我执行几次循环后的调试显示。注意每次执行后，由于它们的值被修改了，`pszSrc1` 和 `pszTarget` 在监视窗口中都被高亮。\n\
  \n![9781118823873-fg2006.tif](img/9781118823873-fg2006_fmt.png)\n\n图 20-6：`while`\
  \ 循环在每次迭代中增加 `pszSrc1` 和 `pszTarget`。\n\n同样注意 `pszSrc1` 指向的字符串似乎在缩短。这是因为随着 `pszSrc1`\
  \ 的增加，它实际上是在字符串向下移动，直到最终它只指向终止空字符（null）。那时，控制权将离开 `while` 循环并继续下一次循环。\n\n等一下！`pszTarget`\
  \ 指向的字符串并没有增长。记住意图是将 `pszSrc1` 的内容复制到 `pszTarget` 中。发生了什么？\n\n思考片刻后答案显而易见：我同时也改变了\
  \ `pszTarget` 的值，并留下了我已经复制的字符。这正是我最初函数中错误的地方。我需要保留一个未修改的原始指针副本，以便返回给调用者！\n\n现在我知道问题所在（或者至少是一个问题——可能还有更多），我通过点击调试工具栏上的\
  \ `Stop Debugger`（停止调试）来停止调试器。控制应用程序对话框立即消失，Code::Blocks 显示恢复到用于编辑的界面。\n\n### 修复（第一个）错误\n\
  \n为了解决我注意到的问题，我只需要保存 `new` 返回的值并将其返回，而不是从函数返回修改后的 `pszTarget` 指针。我在这里只包含修改后的 `concatenateString()`\
  \ 函数（程序的其余部分保持不变——整个程序包含在在线材料中名为 `ConcatenateError2`）：\n\n```cpp\nchar* concatenateString(const\
  \ char* pszSrc1, const char* pszSrc2)\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(pszSrc1)+strlen(pszSrc2)+1;\n    char* pszTarget = new char[nTargetSize];\n\
  \    char* pszT = pszTarget;  // 保存一个用于返回的指针\n    // 首先将第一个字符串复制到目标\n    while(*pszSrc1\
  \ != '\\0')\n    {\n        *pszTarget++ = *pszSrc1++;\n    }\n    // 现在将第二个字符串的内容复制到\n\
  \    // 第一个的结尾\n    while(*pszSrc2 != '\\0')\n    {\n        *pszTarget++ = *pszSrc2++;\n\
  \    }\n    // 将原始指针返回给调用者\n    return pszT;\n}\n```\n\n我将 `new` 返回的指针同时保存到 `pszTarget`（我打算增加它）和\
  \ `pszT`（它将保持不变）中。函数将后者（未修改的指针）返回给调用者。\n\n我重新生成了应用程序，然后重复我的步骤来单步执行第一个循环。图 20-7 显示了执行后的显示。\n\
  \n![9781118823873-fg2007.tif](img/9781118823873-fg2007_fmt.png)\n\n图 20-7：监视窗口显示了更新后的\
  \ `concatenateString()` 函数中 `pszT` 指向的内容。注意 `pszTarget` 源字符串的前七个字符。同样注意 `pszTarget`\
  \ 的值大于 `pszT`。Code::Blocks 显示了垃圾字符，因为目标字符串还没有空字符。\n\n### 发现并修复第二个错误\n\n由于两个源字符串并不长，所以我使用\
  \ `Next Line` 命令单步执行整个循环。图 20-8 显示了执行最后一次循环后的监视窗口。\n\n![9781118823873-fg2008.tif](img/9781118823873-fg2008_fmt.png)\n\
  \n图 20-8：执行最后一次循环后的监视窗口。\n\n由于我完成了函数，我从 Code::Blocks 菜单中选择了 `Debug` -> `Continue`（继续）。这导致调试器从停止的地方继续运行——直到下一个断点或程序结束。果如其所，显示的拼接数组包含了我在调试器中看到的垃圾字符：\n\
  \n此程序从键盘接受两个字符串并将它们输出。\n第一个字符串：this is a string\n第二个字符串：THIS A STRING\n结果：<this\
  \ is a stringTHIS A STRING>\n\n![stuff.eps](img/technicalstuff.png) 如果我不包含空字符，是什么导致\
  \ `concatenateString()` 返回的字符串终止的？为什么字符串没有持续好几页？短答案是：“什么都没有”。可能是 C++ 必须显示数千个字符后最终遇到一个包含空的字符。但在实践中，这种情况很少发生。零是内存中最常见的值。你通常不需要找太远就能找到终止字符串的零字节。\n\
  \n要解决这个问题，我只需要在最后一个 `while` 循环之后添加终止空字符：\n\n```cpp\nchar* concatenateString(const\
  \ char* pszSrc1, const char* pszSrc2)\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(pszSrc1)+strlen(pszSrc2)+1;\n    char* pszTarget = new char[nTargetSize];\n\
  \    char* pszT = pszTarget;  // 保存一个用于返回的指针\n    // 首先将第一个字符串复制到目标\n    while(*pszSrc1\
  \ != '\\0')\n    {\n        *pszTarget++ = *pszSrc1++;\n    }\n    // 现在将第二个字符串的内容复制到\n\
  \    // 第一个的结尾\n    while(*pszSrc2 != '\\0')\n    {\n        *pszTarget++ = *pszSrc2++;\n\
  \    }\n    // 添加终止 NULL\n    *pszTarget = '\\0';\n    // 将未修改的指针返回给调用者\n    return\
  \ pszT;\n}\n```\n\n\n\n\n\n在调试器中运行此版本将创建如图 20-9 所示的。注意，在添加了终止空字符后，`pszT` 指向的字符串奇迹般地“清理”了，丢失了所有跟随在我放置在那里的数据之后的垃圾信息。\n\
  \n![9781118823873-fg2009.tif](img/9781118823873-fg2009_fmt.png)\n\n图 20-9：添加终止空字符会移除拼接后字符串末尾的所有垃圾字符。\n\
  \n![remember.eps](img/remember_fmt.png) 让我明确一点：那些垃圾字符仍然在那里。只是终止空字符告诉 `C++` 不要显示它们。\n\
  \n程序的输出是你已经熟悉并赞赏的那个可以预料的字符串：\n\n```\nThis program accepts two strings\nfrom the\
  \ keyboard and outputs them\nconcatenated together.\n\nEnter first string: this\
  \ is a string\nEnter the second string: THIS IS A STRING\nConcatenate first string\
  \ onto the second\nResult: <this is a stringTHIS IS A STRING>\nPress Enter to continue\
  \ …\n```\n\n可以通过在关键位置添加输出语句来发现小程序中的问题。然而，调试器是一个发现问题的更优雅、更强大的工具。在调试器中单步执行程序可以让你真实地感受到计算机对你的源代码做了什么。你将对计算机的工作原理产生一种理解，这种理解是我认为无法通过其他任何方式获得的。`Code::Blocks`\
  \ 自带的调试器和我见过的任何工具一样易用。我建议你尽早且经常使用它。\n\n## 第五部分\n\n### 对象面向编程\n\n![webextras.eps](img/webextras_fmt.png)\
