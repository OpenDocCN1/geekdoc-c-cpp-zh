  \ 410\n\n# 引言\n\n欢迎阅读《C++ 编程入门（For Dummies）》第二版。本书是想要学习编程的读者准备的。\n\n不知道为什么在过去的多年里，编程一直与数学、逻辑、微积分以及其他复杂的东西联系在一起。我从未完全理解这一点。编程是一项技能，就像写广告词、绘画或摄影一样。它确实需要深入思考问题的能力，但我认识一些非常棒的程序员，他们的数学技能完全为零。有些人天生擅长这个，学得很快，另一些人则没那么好，也不那么快。尽管如此，只要有足够的耐心毅力，任何人都可以学习编程。甚至我也可以。\n\
  \n## 关于本书\n\n学习编程意味着意味着学习一种编程语言。本书基于 C++ 编程语言。建议的 Windows 和 Macintosh 编译器版本包含在本书提供的在线材料中。Linux\
  \ 版本可以在 [www.codeblocks.org](http://www.codeblocks.org) 下载。\n\n本书的目标是教你 C++ 编程的基础知识，而不是让你淹没在\
  \ C++ 语言的每一个细节中。在本书结束，你将能够编写一个相当复杂的 C++ 程序。你也将快速掌握 Java 和 C# 等许多相似的语言。\n\n在书中，你将发现什么是程序、它是如何工作的，以及如何进行：\n\
  \n*   安装 Code::Blocks C++ 编译器并用它构建程序。\n*   创建并评估表达式。\n*   控制程序的流。\n*   创建更好地模拟真实世界的数据结构。\n\
  *   定义并使用 C++ 指针。\n*   处理字符字符串以生成你想要看到的输出。\n\n\n\n\n*   对文件进行读写操作。\n\n## 愚蠢的假设\n\
  \n在书中，我尽量少对读者做出假设，但我确实假设了以下几：\n\n* **你拥有一台电脑。**大多数读者拥有运行 Windows 的电脑；然而，书中的程序在 Windows、Macintosh、Linux\
  \ 和 Unix 上运行得同样良好。事实上，由于 `C++` 是一门标准化语言，这些程序应该运行在任何带有 `C++` 编译器的电脑上。\n\n* **你了解如何使用电脑的基础知识。**例如，我假设你知道如何运行程序、复制文件、创建文件夹等。\n\
  \n* **你懂得如何浏览菜单。**我包含了许多指令，例如“点击 `File` 然后点击 `Open`”。如果你能遵循这些指令，那么你就可以开始学习了。\n\n\
  * **你是编程的新手。** 我并不假设你了解任何编程的知识。老实，我甚至不假设你知道什么是编程。\n\n为了帮助你尽可能高效地阅读本书，我使用了一些惯例：\n\
  \n* `C++` 术语以及你在计算机代码中看到的其他此类项目使用等宽字体，像这样。\n\n* 新术语用*斜体*强调（并给出定义）。\n\n* 你需要遵循的编号步骤和需要输入的字符用**粗体**表示。\n\
  \n* 书中的程序员始终是女性，而用户始终是男性。当我说“她输入了……”时，你知道我指的是程序的作者；当我说“他输入了……”时，你知道我指的是程序的用户。\n\n\
  我鼓励你阅读书的某一部分；然后把书收起来，玩一会儿 `C++`，在移动到下一部分之前休息一下。书的结构安排得，确保在每个部分的结束时，你已经掌握了足够的新材料来去编写编写程序。\n\
  \n我想增加以下建议：\n\n* 如果你已经知道什么是编程，但对 `C++` 一无所知，你可以跳过第 1 章。\n\n* 我建议你使用书中附带的 `Code::Blocks`\
  \ 编译器，即使你打算读完书后想使用不同的 `C++` 编译器。然而，如果你坚持不想使用 `Code::Blocks`，你可以跳过第 2 章。\n\n* 如果你已经做过一点计算机编程，请快速浏览一遍第\
  \ 3 章。\n\n* 即使你有 `BASIC` 等其他语言的经验，也请从第 4 章开始集中。\n\n* 如果你开始感到饱和，可以在阅读第 20 章后停止阅读。第\
  \ 21 章开启了对象对象编程这一新话题——在你觉得对目前所学内容非常从容之前，你不想接受那个内容。\n\n* 你可以跳过任何 `TechnicalStuff`\
  \ 图标。\n\n## 本书是如何组织的\n\n《零基础 C++ 编程入门》（Beginning Programming with C++ For Dummies）分为七部分。你不需要按顺序阅读它，甚至不需要阅读某个章节中的所有章节。你可以使用目录和索引来寻找所需的信息并快速获得答案。在本节中，我简要描述了你将在每个部分发现。\n\
  \n### 第一部分：入门 C++ 编程\n\n这部分描述了程序是什么以及它们是如何工作的。通过一个虚构的换胎电脑，我带你通过几个从汽车上卸轮胎的算法，让你感受程序是如何工作的。在离开这一部分之前，你还将在电脑上安装并运行\
  \ `Code::Blocks`。\n\n### 第二部分：编写程序：决策，决策\n\n这部分向你介绍了使用 `C++` 编程的基础知识。你将发现如何声明整数变量以及如何编写简单的表达式。当你完成这一部分时，你甚至将发现如何在程序中做出决策——向专家水平又进了一小步。\n\
  \n### 第三部分：成为过程化程序员\n\n在这里，你学习如何引导程序内部的控制流。你将发现如何循环、如何将你的代码拆分为模块（以及为什么），以及如何将这些独立的模块重新构建成单一程序。在这一部分的最后，你将能够编写实际上解决问题的程序。\n\
  \n### 第四部分：数据结构\n\n这部分扩展了你对数据类型的知识。书的早期章节局限于整数；在这一部分，你将处理字符、小数和数组；你甚至可以定义自己的类型。最后，这是你掌握最最令人生畏的话题的部分——`C++`\
  \ 指针。\n\n### 第五部分：面向对象编程\n\n这是你将知识扩展到面向对象技术的地方，这些让 `C++` 与其前身（最著名的 `C`）区别的特性。（如果你不知道面向对象编程，不要担心——你会学会的。）在跳到这一部分之前，你最好对第一部分到第四部分的内容感到熟悉，但当你完成它时，你将成为一个更强大的程序员。\n\
  \n### 第六部分：高级技巧\n\n这是一系列重要但没有放在前面部分的主题集合。例如，在这里我讨论如何创建文件。\n\n### 第七部分：最后的部分\n\n\
  这部分包含了关于编程时应该做和不应该做的列表。此外，这部分还包含了关于你决定扩展 `C++` 知识的一些建议。\n\n## 书中使用的图标\n\n没有图标的《傻瓜》书？在本节中，我简要描述我使用的每个图标。\n\
  \n**提示 (Tip)**\n`Tip` 图标指向可能会让你的工作变得更容易的信息。\n\n**记住 (Remember)**\n`Remember` 图标标记了一个通常有趣且有用的事实——你可能以后想记住它。我也使用这个图标来提醒你在之前的章节中跳过的事实。\n\
  \n**警告 (Warning)**\n`Warning` 图标强调了潜在的危险。看到这个图标时，我告诉你要注意并谨慎行动。\n\n**技术性 (Technical-Stuff)**\n\
  当你看到这个图标时，你知道附近有技术内容。如果你不觉得很有技术，可以跳过这些信息。\n\n## 书籍之外\n\n《零基础 C++ 编程入门》第二版在网上提供了以下“精选赠品”供轻松下载：\n\
  \n* 书中所有示例的源代码可以从 [www.dummies.com/extras/beginningprogrammingplusplus](http://www.dummies.com/extras/beginningprogrammingplusplus)\
  \ 下载。程序按章节组织。我为 `Code::Blocks` 提供了一个项目文件（关于 `Code::Blocks` 的更多信息见下一个项目符号，我在第 2 章中解释项目文件）。\n\
  \n* 本书使用免费、开源的 `CodeBlocks` 环境和 `GCC C++ 编译器`。编写本书时使用的 `Code::Blocks` 版本（13.12）可以从\
  \ [www.dummies.com/extras/beginningprogrammingplusplus](http://www.dummies.com/extras/beginningprogrammingplusplus)\
  \ 下载。我包含了适用于 Windows（2000 及以后）和 Macintosh（10.6 及以后）的版本。第 2 章包含了如何下载和安装 `Code::Blocks`\
  \ 的指令。你可以在 [www.codeblocks.org/downloads/binaries](http://www.codeblocks.org/downloads/binaries)\
  \ 找到新版本的 `Code::Blocks` 以及适用于不同 Linux 版本的版本。\n\n```\n如果你确实去了 [www.codeblocks.org](http://www.codeblocks.org)，请务必下载包含\
  \ gcc 编译器的版本。\n```\n\n\n\n\n\n*   本书的更新内容（如果有的话）可以在 [www.dummies.com/extras/beginningprogrammingcplusplus](http://www.dummies.com/extras/beginningprogrammingcplusplus)\
  \ 找到。\n*   一个提供了一些有用编程辅助工具的备查表可以在 [www.dummies.com/cheatsheet/beginningprogrammingcplusplus](http://www.dummies.com/cheatsheet/beginningprogrammingcplusplus)\
  \ 找到。\n\n## 接下来去哪里\n\n你可以在 [www.stephendavis.com](http://www.stephendavis.com) 找到这本书以及我所有书籍的勘误和常见问题解答。你还会在那里找到我邮箱地址的链接。欢迎随时向我发送你的问题和建议（这就是我学习的方式）。正是通过读者的反馈，这些书籍才能不断完善。\n\
  \n现在你已经停得足够了，是时候转向第 1 章并开始发现如何编程了！\n\n## 第一部分\n\n# 开始 C++ 编程\n\n![9781118823873-pp0101.tif](img/9781118823873-pp0101_fmt.png)\n\
