  \ for Xcode。选择该应用程序。**参见图 2-6。\n3. **下载完成后双击 `mpkg` 包；这样做即可安装它。**\n4. **接受所有默认值。**\n\
  \   安装应以 Installation Successful（安装成功）结束。\n\n### 安装 Command Line Tools\n\n尽管 Xcode\
  \ 很大，你可能认为它包含了一切，但你错了。你还需要来自 Apple 的另一个包来完成你的安装。按照以下步骤操作：\n\n1. **打开 Safari 浏览器并访问\
