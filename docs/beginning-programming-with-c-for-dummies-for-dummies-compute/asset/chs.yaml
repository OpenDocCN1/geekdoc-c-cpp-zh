  \ - 1) && szSource[nS] != '\\0';\n          nT++, nS++)\n    {\n        szTarget[nT]\
  \ = szSource[nS];\n    }\n    // 向 szTarget 添加终止符\n    szTarget[nT] = '\\0';\n}\n\
  ```\n\n函数的第一部分与之前完全相同，通过遍历 `szTarget` 来寻找终止空字符。区别在于第二个循环。这个 `for` 循环包含了两个终止条件。如果满足以下任一条件，将退出循环：\n\
  \n- `szSource[nS]` 是空字符，意味着你已经到达 `szSource` 的最后一个字符。\n- `nT` 大于或等于 `nTargetSize\
  \ - 1`，意味着你已经耗尽 `szTarget` 中的可用空间 (- 1 是因为你必须为结尾的终止空字符留出空间）。\n\n这个额外的检查虽然烦人，但对于避免溢出数组并产生可能以奇怪神秘的方式崩溃的程序是必要的。\n\
  \n### 我真的需要做所有这些工作吗？\n\nC++ 语言本身对字符串操作提供的并不多。幸运的是，标准库包含了许多处理这些字符串的函数，可以省去你自己编写它们的麻烦。表格\
  \ 16-1 显示了这些函数中最常用的。\n\n表格 16-1 常用 ASCIIZ 字符串处理函数\n\n| 函数 | 描述 |\n| :--- | :---\
  \ |\n| `isalpha(char c)` | 如果字符是字母（‘A’到‘Z’或‘a’到‘z’），则返回真。 |\n| `isdigit(char c)`\
  \ | 如果字符是数字（‘0’到‘9’），则返回真。 |\n| `isupper(char c)` | 如果字符是大写字母，则返回真。 |\n| `islower(char\
  \ c)` | 如果字符是小写字母，则返回真。 |\n| `isprint(char c)` | 如果字符是打印的，则返回真。 |\n| `isspace(char\
  \ c)` | 如果字符是空白字符（空格、换行符等），则返回真。 |\n| `strlen(char s[])` | 返回字符串中的字符数（不包括空字符）。 |\n\
  | `strcmp(char s1[], char s2[])` | 比较两个字符串。如果字符串相同返回 0。如果第一个出现在第二个之后，返回 1。否则返回 -1。\
  \ |\n| `strncpy(char target[], char source[], int size)` | 将源字符串拷贝到目标，但最多拷贝 `size`\
  \ 个字符。 |\n| `strncat(char target[], char source[], int size)` | 将源字符串拼接到目标末尾，最多拼接\
  \ `size` 个字符。 |\n| `tolower(char c)` | 返回传递给它的字符的小写版本。如果它已经是小写的，则返回该字符。 |\n| `toupper(char\
  \ c)` | 返回传递给它的字符的大写版本。 |\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\n\nusing namespace std;\n\n// toUpper - 转换 ASCIIZ 字符串中的每个字符\nvoid toUpper(char\
  \ szTarget[], int nTargetSize)\n{\n    int nT;\n    for(nT = 0; szTarget[nT] !=\
  \ '\\0'; nT++)\n    {\n    }\n}\n\nint main(int NumberofArgs, char* pszArgs[])\n\
  {\n    char szString[256];\n    // 提示用户\n    cout << \"This program accepts a string\\\
  n\"\n         << \"from the keyboard and echoes the\\n\"\n         << \"string in\
  \ all caps.\" << endl;\n    cout << \"Enter string: \";\n    // 输入字符串\n    getline(szString,\
  \ 256);\n    // 现在转换为大写\n    toUpper(szString, 256);\n    // 并显示结果\n    cout <<\
  \ \"All caps version: <\" << szString << \">\" << endl;\n    cout << \"Press Enter...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n    return 0;\n}\n```\n\
  *(注：由于你提供的待翻译文本中 `toUpper` 代码块的格式是非常混乱的，我根据逻辑推断微调了代码结构以确保其基本可读性。)*\n\n\n\n本章展示了如何将\
  \ ASCIIZ 字符串作为字符数组的一种特殊情况进行处理。但在实践中，许多标准函数依赖于被称为`pointer`（指针）的东西；接两章将详细介绍指针的工作原理。然后，我将回到这些示例函数，并使用指针来实现它们，以展示指针解决方案的优雅性。\n\
  \n# 第 17 章\n\n# 指向 C++ 指针\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 介绍指针变量的概念\n- ![arrow](img/arrow.png)\
  \ 声明和初始化指针\n- ![arrow](img/arrow.png) 使用指针通过引用传递参数\n- ![arrow](img/arrow.png) 从堆上分配变长数组\n\
  \n本章引入了强大的`pointers`概念。我所指的不是经过特殊训练的指向鸟类的狗，而是指向内存中其他变量的变量。我将从解释计算机寻址开始，然后进入声明和使用指针变量的细节。本章将以讨论所谓的`heap`（堆）作为结束，以及我们如何使用它来解决我在上一章中巧妙引入的问题。\n\
  \n但不要以为这一章结束，乐趣就结束了。下一章将指针概念进一步推了一步。事实上，以某种方式或另一种方式，指针将出现在书中几乎剩下的每一个章节中。\n\n![warning.eps](img/warning_fmt.png)\
  \ 你可能需要一段时间时间才能熟悉指针变量的概念。不要气馁。你可能需要反复读几遍本章和章，才能掌握所有的细微之处。\n\n## 什么是指针？\n\n`pointer`（指针）是一个变量，它包含计算机内部内存中另一个变量的地址。在理解这句语句之前，你需要理解计算机是如何寻址内存的。\n\
  \n![warning.eps](img/warning_fmt.png) 你的 PC 或 Macintosh 上英特尔处理器的计算机寻址细节非常复杂，比你在本书中需要关心的要复杂得多。在这些讨论中，我使用了一个非常简化的内存模型。\n\
  \n每一块随机访问内存（RAM）都有其自身的、唯一的地址。对于包括 Mac 和 PC 在内的大多数计算机，最小的可寻址内存单元是一个`byte`（字节）。\n\n\
  ![remember.eps](img/remember_fmt.png) 一个字节是 8 位，对应于一个 `char` 类型的变量。\n\n内存中的地址就像房子的地址完全一样，如果以下条件成立的话就是如此：\n\
  \n* 每栋房子都按顺序编号。\n* 没有跳号或重复的数字。\n* 整个城市由一条长长的街道组成。\n\n所以，例如，某个内存字节的地址可能是 `0x1000`。随后的下一个字节地址将是\
  \ `0x1001`。之前的字节则在 `0x0FFF`。\n\n![tip.eps](img/tip_fmt.png) 我不知道为什么，但按照习惯，内存地址总是用十六进制表示。也许这是为了让非程序员认为计算机寻址真的很复杂。\n\
  \n## 声明指针\n\n`char` 变量设计用于存储 ASCII 字符，`int` 用于存储整数，`double` 用于存储浮点数。同样，指针变量设计用于存储内存地址。你通过在指针所指向的对象的类型末尾添加星号（`*`）来声明指针变量，如下例所示：\n\
  \n```cpp\nchar* pChar;   // 指向字符的指针\nint* pInt;      // 指向 int 的指针\n```\n\n一个没有经过初始化的指针变量包含一个未知值。使用取地址符（`&`）运算符，你可以用相同类型变量的地址来初始化指针变量：\n\
  \n```cpp\nchar cSomeChar = 'a';\nchar* pChar;\npChar = &cSomeChar;\n```\n\n在代码段中，变量\
  \ `cSomeChar` 有一个地址。为了取例，假设 C++ 为它分配了地址 `0x1000`。（C++ 还在该位置初始化了字符 'a'）。变量 `pChar`\
  \ 也有它自己的位置，也许是 `0x1004`。表达式 `&cSomeChar` 的值是 `0x1000`，其类型是 `char*`（读作“指向 char 的指针”）。因此，示例中第三行的赋值将值\
  \ `0x1000` 存储在变量 `pChar` 中。这在图 17-1 中以图形所示。\n\n![9781118823873-fg1701.tif](img/9781118823873-fg1701_fmt.png)\n\
  \n图 17-1：文中描述的 `cSomeChar` 和 `pChar` 在声明和初始化后的内存中的布局。\n\n花一点时间真正理解图形与代码段中三行 C++\
  \ 代码之间的关系。第一行声明说：“去内存中找一个 1 字节大小的位置，将其命名为 `cSomeChar`，并将其初始化为 'a'。” 在此例中，C++ 选择了\
  \ `0x1000` 位置。\n\n下一行说：“去内存中找一个足够大的位置来存放 `char` 变量的地址，并命名为 `pChar`。” 在此例中，C++ 将\
  \ `pChar` 分配到了 `0x1004` 位置。\n\n![tip.eps](img/tip_fmt.png) 在 CodeBlocks 中，无论所指向的对象有多大，地址都是\
  \ 4 字节长——指向 `char` 的指针与 `double` 一。\n\n第三行说：“将 `cSomeChar` 的地址 (0x1000) 分配给 `pChar`。”\
  \ 图 17-1 表示了这些语句后的状态。\n\n“有什么有趣的呢？”你问。真正酷的部分在这里，如如下表达式所示：\n\n```cpp\n*pChar = 'b';\n\
  ```\n\n这一行说：“在 `pChar` 指向的位置存储 'b'。” 这在图 17-2 中所示。要执行此表达式，C++ 首先获取 `pChar` 中存储的值（那将是\
  \ 0x1000），然后在该位置存储字符 'b'。\n\n![tip.eps](img/tip_fmt.png) `*` 作为二进制运算符时意味着“乘”；作为一元运算符时，`*`\
  \ 意味着“找到指向的对象”。同样，`&` 作为二进制运算符有含义（尽管我没有讨论过），但作为一元运算符，它意味着“取地址”。\n\n这有什么意义？毕竟我可以通过简单的给\
  \ `cSomeChar` 赋值 'b' 来实现相同的效果：\n\n```cpp\ncSomeChar = 'b';\n```\n\n为什么要通过获取地址的中间步骤？因为有很多问题可以用指针解决。我在本章中讨论两个常见问题。\n\
  \n## 向函数传递参数\n\n向函数传递参数有两种方式：按值或按引用。现在，我们考虑这两种。\n\n### 按值传递\n\n在十一章中，我写道参数是按值传递给函数的，这意味着传递给函数的是变量的值而不是变量本身。\n\
  \n影响可以通过代码代码（取自在线材料中的 PassByReference 示例程序）变得清晰：\n\n```cpp\nvoid fn(int nArg1, int\
  \ nArg2)\n{\n    // 修改参数的值\n    nArg1 = 10;\n    nArg2 = 20;\n}\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    // 初始化两个变量并显示它们的值\n    int nValue1 = 1;\n\
  \    int nValue2 = 2;\n    // 现在通过调用函数修改它们\n    fn(nValue1, nValue2);\n    // 现在\
  \ nValue1 和 nValue2 的值是多少？\n    cout << \"nValue1 = \" << nValue1 << endl;\n   \
  \ cout << \"nValue2 = \" << nValue2 << endl;\n    return 0;\n}\n```\n\n\n\n此程序声明了两个变量\
  \ `nValue1` 和 `nValue2`，将它们初始化为某些已知值，然后将它们的值传递给函数 `fn()`。该函数改变了参数的值并简单返回 0。\n\n\
  *   **问题：** 在控制从 `fn()` 返回后，`main()` 中 `nValue1` 和 `nValue2` 的值是多少？\n*   **答案：**\
  \ `nValue1` 和 `nValue2` 的值分别保持在 1 和 2 不变。\n\n为了理解为什么，请仔细查看 C++ 是如何处理调用 `fn()` 时的内存的。C++\
  \ 将局部变量（如 `nValue1` 和 `nValue2`）存储在名为 `stack`（栈）的特殊内存区域中。在进入函数时，C++ 会确定该函数需要多少栈内存，然后预留相应数量。假设在这个示例中，为\
  \ `main()` 分配的栈内存从位置 `0x1000` 开始，延伸到 `0x101F`。在这种情况下，`nValue1` 可能位于 `0x1000` 位置，而\
  \ `nValue2` 位于 `0x1004` 位置。\n\n![remember.eps](img/remember_fmt.png) 在 Code::Blocks\
  \ 中，一个 `int` 占用 4 个字节。详情请参见第 14 章节。\n\n作为调用 `fn()` 的一部分，C++ 首先将每个参数的值存储在栈上——从最右侧的参数开始向左侧处理。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) C++ 在执行调用时存储的最后一个项是返回地址，以便函数在完成后知道返回到何处。\n\
  \n由于更多与 CPU 内部工作机制的原因，栈是“向下增长”的，这意味着 `fn()` 使用的内存地址比 `0x1000` 小。图 17-3 显示了计算机处理器到达\
  \ `fn()` 第一条语句时的内存状态。C++ 将函数的第二个参数存储在位置 `0x0FF4`，将第一个参数存储在 `0x0FF0`。\n\n![remember.eps](img/remember_fmt.png)\
  \ 请记住，这只是内存的一种可能的布局。我不知道（也不在乎）这些实际上是否是 C++ 在此或任何其他函数调用中实际使用的地址。\n\n![9781118823873-fg1703.tif](img/9781118823873-fg1703_fmt.png)\n\
  \n图 17-3：进入函数 `fn(int, int)` 后立即的一种可能的内存布局。\n\n函数 `fn(int, int)` 包含两个语句：\n\n```cpp\n\
  nArg1 = 10;\nnArg2 = 20;\n```\n\n图 17-4 显示了这两个语句执行后后的内存内容。其实很简单——`nArg1` 的值已变为 10，`nArg2`\
  \ 变为 20，正如你预期的的一样。然而，这个演示的主要点是说明，改变 `nArg1` 和 `nArg2` 的值对原始变量 `nValue1` 和 `nValue2`\
  \ 没有产生任何影响。\n\n![9781118823873-fg1704.tif](img/9781118823873-fg1704_fmt.png)\n\n\
  图 17-4：从 `fn(int, int)` 之前的、相同的内存位置。\n\n### 通过引用传递参数\n\n那么，如果我想让 `fn()` 做的更改是永久的怎么办？我可以通过传递变量的地址而不是它们的值来实现。这一点由下面的代码段所示（也取自\
  \ PassByReference 示例程序）：\n\n```cpp\n// fn(int*, int*) - 此函数通过引用\n// 接收参数\nvoid fn(int*\
  \ pnArg1, int* pnArg2)\n{\n    // 修改参数的值\n    *pnArg1 = 10;\n    *pnArg2 = 20;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 初始化两个变量并显示它们的值\n  \
  \  int nValue1 = 1;\n    int nValue2 = 2;\n    fn(&nValue1, &nValue2);\n    return\
  \ 0;\n}\n```\n\n首先注意，`fn()` 的参数现在声明为不是整数而是指向整数的指针。对 `fn(int*, int*)` 的调用传递的不是 `nValue1`\
  \ 和 `nValue2` 的值，而是它们的地址。\n\n![remember.eps](img/remember_fmt.png) 在此示例中，表达式 `&nValue1`\
  \ 的值为 `0x1000`，类型为 `int*`（即“指向 int 的指针”）。进入此函数时的内存状态在图 17-5 中所示。\n\n![9781118823873-fg1705.tif](img/9781118823873-fg1705_fmt.png)\n\
  \n图 17-5：进入此函数时的内存状态。\n\n作为 `fn()` 调用的一部分，C++ 首先将每个参数的值存储在栈上——从最右侧的参数开始向左侧处理。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.png) C++ 在执行调用时存储的最后一个项是返回地址，以便函数在完成后知道返回到何处。\n\
  \n由于更多与 CPU 内部工作机制的原因，栈是“向下增长”的，这意味着 `fn()` 使用的内存地址比 `0x1000` 小。图 17-3 显示了计算机处理器到达\
  \ `fn()` 第一条语句时的内存状态。C++ 将函数的第二个参数存储在位置 `0x0FF4`，将第一个参数存储在 `0x0FF0`。\n\n![remember.eps](img/remember_fmt.png)\
  \ 请记住，这只是内存的一种可能的布局。我不知道（也不在乎）这些实际上是否是 C++ 在此或任何其他函数调用中实际使用的地址。\n\n![9781118823873-fg1703.tif](img/9781118823873-fg1703_fmt.png)\n\
  \n图 17-3：进入函数 `fn(int, int)` 后立即的一种可能的内存布局。\n\n函数 `fn(int, int)` 包含两个语句：\n\n```cpp\n\
  nArg1 = 10;\nnArg2 = 20;\n```\n\n图 17-4 显示了这两个语句执行后后的内存内容。其实很简单——`nArg1` 的值已变为 10，`nArg2`\
  \ 变为 20，正如你预期的的一样。然而，这个演示的主要点是说明，改变 `nArg1` 和 `nArg2` 的值对原始变量 `nValue1` 和 `nValue2`\
  \ 没有产生任何影响。\n\n![9781118823873-fg1704.tif](img/9781118823873-fg1704_fmt.png)\n\n\
  图 17-4：从 `fn(int, int)` 之前的、相同的内存位置。\n\n通过引用传递参数\n\n那么，如果我想让 `fn()` 做的更改是永久的怎么办？我可以通过传递变量的地址而不是它们的值来实现。这一点由下面的代码段所示（也取自\
  \ PassByReference 示例程序）：\n\n```cpp\n// fn(int*, int*) - 此函数通过引用\n// 接收参数\nvoid fn(int*\
  \ pnArg1, int* pnArg2)\n{\n    // 修改参数的值\n    *pnArg1 = 10;\n    *pnArg2 = 20;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    // 初始化两个变量并显示它们的值\n  \
  \  int nValue1 = 1;\n    int nValue2 = 2;\n    fn(&nValue1, &nValue2);\n    return\
  \ 0;\n}\n```\n\n首先注意，`fn()` 的参数现在声明为不是整数而是指向整数的指针。对 `fn(int*, int*)` 的调用传递的不是 `nValue1`\
  \ 和 `nValue2` 的值，而是它们的地址。\n\n![remember.eps](img/remember_fmt.png) 在此示例中，表达式 `&nValue1`\
  \ 的值为 `0x1000`，类型为 `int*`（即“指向 int 的指针”）。进入此函数时的内存状态在图 17-5 中所示。\n\n![9781118823873-fg1705.tif](img/9781118823873-fg1705_fmt.png)\n\
  \n图 17-5：进入此函数时的内存状态。\n\n\n\n\n\n```cpp\nrnArg1 = 10;\nrnArg2 = 20;\n}\n\nint nValue1\
  \ = 1;\nint nValue2 = 2;\n\nfn2(nValue1, nValue2); // 调用方式与 fn(int, int) 一致\n\n\
  // 现在 nValue1 和 nValue2 的值变为了 10 和 20\n```\n\n`int&` 将 `rnArg1` 和 `rnArg2` 声明为 `int`\
  \ 的引用。调用 `fn2()` 实际上传递了 `nValue1` 和 `nValue2` 的地址，但 C++ 会在背后为你处理好指针操作。在 `fn2(int&,\
  \ int&)` 中的更改会保留在调用函数中。\n\n在线材料中包含程序 `PassByReference2` 展示了引用传递的一个版本，它使用了引用变量类型。\n\
  \n![warning.eps](img/warning_fmt.png) 引用并不是类型的一部分。因此，你不能重载两个函数，如果它们之间的区别仅在于一个使用值传递，而另一个使用引用传递：\n\
  \n```cpp\n// 以下两个函数无法区分\n// 因为它们的调用方式完全一样\nvoid fn(int nArg1, int nArg2);\nvoid\
  \ fn(int& nArg1, int& nArg2);\n```\n\n既然引用声明可以为你处理一切，为什么还要费劲使用指针变量呢？事实是，我建议初学者避免使用引用变量类型——C++\
  \ 虽然可能在为你处理指针工作，但你仍然需要理解 C++ 在底层为你做了什么。如果没有对指针类型有坚实的理解，初学者很难理解引用声明产生的错误。\n\n## 玩转堆内存\n\
  \n第 16 章 中解决的问题之一是固定大小数组。例如，`concatenate()` 函数将两个 ASCIIZ 字符串合并成一个字符串。然而，该函数必须小心不要遍历目标数组，以防数组没有足够的空间容纳合并后的字符串。如果\
  \ `concatenate()` 可以分配一个保证足够大以容纳合并字符串的新数组，这个问题就会消失。\n\n这是一个很棒的意意，但我应该把目标数组做得多大呢——256\
  \ 字节还是 512 字节？没有标准答案，因为在编译时无法知道如何让目标数组足够大以容纳所有可能的合并字符串。在运行之前，你无法确定到底需要多少内存。\n\n\
  ### 你真的需要一个 new 关键字吗？\n\nC++ 为此目的提供了一个额外的内存区域，其名称略显晦涩，被称为*堆*（heap）。程序员可以使用 `new`\
  \ 关键字在堆上分配任意数量的内存，如下例所示：\n\n```cpp\nchar* pArray = new char[256];\n```\n\n这个示例从堆上划分了一块足够容纳\
  \ 256 个字符的内存。`new` 关键字返回指向新创建数组的指针。与其他变量不同，堆内存直到运行时才被分配，这意味着数组的大小不受限于编译时确定的常量——它们也可以是运行时计算的变量。\n\
  \n![warning.eps](img/warning_fmt.png) `new` 的参数是一个数组而返回的却是指针，这看起来可能很奇怪（在下一章中我将详细讨论指针和数组之间的关系）。考虑一下我可能会说类似：\n\
  \n```cpp\nint nSizeOfArray = someFunction();\nchar* pArray = new char[nSizeOfArray];\n\
  ```\n\n在这里，数组的大小是由 `someFunction()` 计算的。显然，这种计算在程序实际执行之前无法发生。`someFunction()` 返回的任何值都将用作下一个语句分配数组的大小。更实用的例子是以下代码段，它复制了一个\
  \ ASCIIZ 字符串（假设你正在复制字符串）：\n\n```cpp\nint nLength = strlen(pszString) + 1;\nchar*\
  \ pszCopy = new char[nLength];\nstrncpy(pszCopy, nLength, pszString);\n```\n\n第一条语句调用字符串函数\
  \ `strlen()`，它返回传递的字符串长度，但不包括终止字符。`+ 1` 为终止空字符留了空间。下一条语句在堆上为拷贝分配空间。最后，第三条语句使用字符串函数\
  \ `strncpy()` 将 `pszString` 的内容复制到 `pszCopy` 中。通过计算存储需要多大的数组，你可以保证 `pszCopy` 足够大以包含整个字符串。\n\
  \n### 不要忘记清理\n\n在堆上分配内存是一个很方便的功能，但 C++ 中它有一个巨大的危险：如果你在堆上分配了内存，你必须在完成后将其返回给堆。你通过\
  \ `delete` 关键字将内存返回给堆，如下所示：\n\n```cpp\nchar* pArray = new char[256];\n// ...使用你需要的内存...\n\
  // 现在将内存返回到堆\ndelete[] pArray;\npArray = nullptr;\n```\n\n`delete[]` 关键字接受一个由 `new`\
  \ 关键字传递给你的数组指针，并将内存恢复到堆。\n\n![remember.eps](img/remember_fmt.png) 使用 `delete[]`\
  \ 返回数组。当返回单个对象到堆时，使用 `delete`（不带方括号）。\n\n如果你在完成后没有删除内存，操作系统会在程序退出时释放内存。然而，返回你分配的堆内存是非常好的习惯。\n\
  \n![tip.eps](img/warning_fmt.png) `nullptr` 是 C2011 标准引入的。如果你的编译器不支持 `nullptr`，请使用\
  \ `0` 代替。\n\n### 查看一个示例\n\n下面的 `ConcatenateHeap` 程序是 `concatenate()` 函数的一个版本，它从堆上分配内存：\n\
  \n```cpp\n// ConcatenateHeap - 与 ConcatenateString 类似，只是这个版本在堆分配的内存中存储字符串\n// 这样我们保证了目标数组总是足够大\n\
  \n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n#include <cstring>\n\
  \nusing namespace std;\n\n// concatenateString - 将两个字符串合并\n// 到堆分配的数组中\nchar* concatenateString(const\
  \ char szSrc1[], const char szSrc2[])\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(szSrc1) + strlen(szSrc2) + 1;\n    char* pszTarget = new char[nTargetSize];\n\
  \    // 首先将第一个字符串拷贝到目标\n    int nT;\n    for(nT = 0; szSrc1[nT] != '\\0'; nT++)\n\
  \    {\n        pszTarget[nT] = szSrc1[nT];\n    }\n    // 现在将第二个字符串的内容拷贝到第一个\n\
  // 字符串的结尾\n    for(int nS = 0; szSrc2[nS] != '\\0'; nT++, nS++)\n    {\n       \
  \ pszTarget[nT] = szSrc2[nS];\n    }\n    // 为 szTarget 添加终止符\n    pszTarget[nT]\
  \ = '\\0';\n    // 将结果返回给调用者\n    return pszTarget;\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n```\n\n\n\n\n\n```cpp\n// Prompt user\ncout << \"This program\
  \ accepts two strings\\n\"\n    << \"from the keyboard and outputs them\\n\"\n \
  \   << \"concatenated together.\\n\" << endl;\n\n// input two strings\ncout << \"\
  Enter first string: \";\nchar szString1[256];\ncin.getline(szString1, 256);\ncout\
  \ << \"Enter the second string: \";\nchar szString2[256];\ncin.getline(szString2,\
  \ 256);\n\n// now concatenate one onto the end of the other\ncout << \"Concatentate\
  \ second string onto the first\"\n    << endl;\nchar* pszT = concatenateString(szString1,\
  \ szString2);\n\n// and display the result\ncout << \"Result: <\"\n    << pszT\n\
  \    << \">\" << endl;\n\n// return the memory to the heap\ndelete[] pszT;\npszT\
  \ = nullptr;\n\n// wait until user is ready before terminating program\n// to allow\
  \ the user to see the program results\ncout << \"Press Enter to continue...\" <<\
  \ endl;\ncin.ignore(10, '\\n');\ncin.get();\n\nreturn 0;\n```\n\n此程序包含了 `#include`\
  \ 文件 `cstring` 以获取 `strlen()` 函数。`concatenateString()` 函数与早期的版本类似，不同之处在于返回的是包含拼接字符串的堆内存块的地址，而不是修改传递给它的任何一个字符串。\n\
  \n![remember.eps](img/remember_fmt.png) 将参数声明为 `const` 意味着函数承诺不修改它们。这使得函数可以使用 `const`\
  \ 字符串来调用该函数，如下代码片段所示：\n\n```cpp\nchar* pFullName = concatenateString(\"Mr. \", pszName);\n\
  ```\n\n字符串 `\"Mr. \"` 是一个 `const` 字符数组，就像 `1` 是一个 `const` 整数一样。\n\n`concatenateString()`\
  \ 内部的第一语句通过对两个源字符串调用 `strlen()` 来计算目标数组的大小，并为终止空空符加了 `1`。\n\n下一语句使用 `new` 关键字从堆外分配一个该大小的数组。\n\
  \n两个 `for` 循环的工作方式与早期的拼接示例中的循环完全相同，它们在加上最后的终止空空符之前，先将 `szSrc1` 和 `szSrc2` 拷贝到 `pszTarget`\
  \ 数组中。\n\n该随后将 `pszTarget` 数组的地址返回给调用者。\n\n`main()` 函数的功能与早期的 `Concatenate` 程序相同，提示用户输入两个字符串然后显示拼接结果。唯一的区别是，此版本在执行以下代码片段终止程序之前，将\
  \ `concatenateString()` 返回的指针还给堆：\n\n```cpp\ndelete[] pszT;\npszT = nullptr;\n```\n\
  \n运行此程序的输出与其早期的版本并无区别：\n\n```\nThis program accepts two strings\nfrom the keyboard\
  \ and outputs them\nconcatenated together.\nEnter first string: this is a string\n\
  Enter the second string: THIS IS ALSO A STRING\nConcatentate second string onto\
  \ the first\nResult: <this is a stringTHIS IS ALSO A STRING>\nPress Enter to continue\
  \ …\n```\n\nC++ 指针的主题非常庞大，无法在一个章节中处理。下一章将探讨数组与指针之间的关系，我承认在本章的最后一个示例程序中简单带过了这个话题。\n\
  \n# 第 18 章\n\n# 重新审视 C++ 指针\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 定义指针上的操作\n-\
  \ ![arrow](img/arrow.png) 比较指针加法与数组索引\n- ![arrow](img/arrow.png) 将算术扩展到不同类型的指针\n\
  - ![arrow](img/arrow.png) 区分常量指针与指向常量的指针\n- ![arrow](img/arrow.png) 读取程序的参数\n\n\
  第 17 章引入了*指针变量*的概念，即一种被设计用于包含另一个变量地址的变量，并建议了指针变量的几种用途。然而，你才开始看到指针变量可以使用的各种方式来做一些非常酷的事情——而且有时真的会让你感到困惑。\n\
  \n本章将仔细检查指针与数组之间的关系，这个话题在上一章中我简单带过了。\n\n## 指针与数组\n\n一些适用于整数的相同运算符也适用于指针类型。本节将检查这些运算符对指针以及到目前为止学习的数组类型的影响。\n\
  \n### 指针上的操作\n\n表格 18-1 列出了定义在指针上的基本操作。\n\n| 操作 | 结果 |\n| :--- | :--- |\n| `pointer\
  \ + offset` | 计算偏移量的地址 |\n| `pointer++` | 指针移动一个单元 |\n| `pointer--` | 指针移动一个单元 |\n\
  | `pointer - offset` | 计算指针之间的单元数 |\n\n虽然表格 18-1 中没有列出，但与加法相关的操作（例如 `pointer +=\
  \ offset`）也被定义了。考虑一个名为 `cArray` 的 3 字节数组。如果该数组的第一个字节位于 `0x1000`，那么 `cArray[0]` 将位于\
  \ `0x1000`，`cArray[1]` 位于 `0x1001`，`cArray[2]` 位于 `0x1002`，以此此类推。\n\n现在假设 `pointer`\
  \ 位于 `0x1000`。执行 `pointer = &cArray[0]` 后，`pointer` 包含 `0x1000`。这在图 18-1 中进行了演示。\n\
  \n![9781118823873-fg1801](img/9781118823873-fg1801)\n\n图 18-1：如果 pointer 指向 cArray\
  \ 的开头，那么 `pointer + 2` 指向 `cArray[2]`。\n\n### 指针加法与数组索引\n\n我声称\n\n```cpp\npointer\
  \ = &cArray[0];\n*(pointer + 2) = 'c';\n```\n\n相当于\n\n```cpp\ncArray[2] = 'c';\n\
  ```\n\n在这一声明之前，我需要解释如何读取第一个代码片段。你已经知道如何读取第一个表达式：`pointer = &cArray[0]` 表示“pointer\
  \ 获取 cArray 的地址”。\n\n为了解释第二个表达式，记住 `pointer + 2` 生成值 `0x1002`，并且它是 `char*` 类型。赋值运算符左侧的\
  \ `*(pointer + 2)` 表示“将 'c' 存储在 pointer + 2 指向的处”。这在图 18-2 中进行了演示。\n\n![9781118823873-fg1802](img/9781118823873-fg1802)\n\
  \n图 18-2：如果 pointer 指向 cArray 的开头，那么 `pointer + 2` 指向 `cArray[2]`。\n\n表格 18-2 显示了指针偏移与数组元素之间的关系。\n\
  \n| 偏移量 | 结果 | 对应于 |\n| :--- | :--- | :--- |\n| `+ 0` | `0x1000` | `cArray[0]` |\n\
  | `+ 1` | `0x1001` | `cArray[1]` |\n| `+ 2` | `0x1002` | `cArray[2]` |\n| `...`\
  \ | `...` | `...` |\n| `+ n` | `0x1000 + n` | `cArray[n]` |\n\n![9781118823873-fg1803](img/9781118823873-fg1803)\n\
  \n图 18-3：表达式 `*(pointer + 2) = 'c'` 将 'c' 存储在 `cArray[2]` 中。\n\n\n\n\n事实上（重点来了），这两种表达式形式之间的对应关系是如此强烈，以至于\
  \ C++ 认为 `cArray[n]` 仅仅是 `*(pArray + n)` 的简写，其中 `pArray` 指向 `cArray` 的第一个元素：\n\n\
  `cArray[n]` 被解释为 `*(&cArray[0] + n)`\n\n为了完成这种关联，C++ 采取了另一种快捷方式，使得以下第二种解释：\n\n`cArray`\
  \ 被解释为 `&cArray[0]`\n\n也就是说，数组名在不带下标的情况下出现时，会被解释为数组首个元素的地址；因此：\n\n`cArray[n]` 被解释为\
  \ `*(cArray + n)`\n\n事实上，`C++` 编译器认为左侧的表达式仅仅是右侧表达式的一种人类可读的简写。\n\n所以，如果我可以将数组名看作是指针（顺便说一下，它确实是指针），那么我可以在指针变量上使用索引运算符吗？绝对可以。因此，以下代码是完全合法的：\n\
  \n```cpp\nchar cArray[256];\nchar* pArray = cArray;\npArray[2] = 'c';\n```\n\n这就是我如何写出像下面的表达式（如第\
  \ [17] 章所示）：\n\n```cpp\nint nTargetSize = strlen(szSrc1) + strlen(szSrc2) + 1;\n\
  char* pszTarget = new char[nTargetSize];\n// 先将第一个字符串拷贝到目标缓冲区\nint nT;\nfor(nT =\
  \ 0; szSrc1[nT] != '\\0'; nT++)\n{\n    pszTarget[nT] = szSrc1[nT];\n}\n```\n\n\
  变量 `pszTarget` 被声明为 `char*`（读作“指向字符的指针”因为这就是 `new char[nTargetSize]` 返回的内容。随后的 `for`\
  \ 循环使用表达式 `pszTarget[nT]` 为数组中的元素赋值，这与访问 `pszTarget + nT` 所指向的字符元素是相同的。\n\n![remember.eps](img/remember_fmt.png)\
  \ 顺便一下，`psz` 前缀是“指向 ASCIIZ 字符串的指针”的命名约定。`ASCIIZ string` 是以空字符结尾的字符数组。\n\n### 使用指针增位运算符\n\
  \n以下你可以称为第 17 章 `ConcatenateHeap` 程序中 `concatenateString()` 函数的指针算术版本。该版本是在线材料中\
  \ `ConcatenatePtr` 程序的一部分。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 事实上，你在第 17 章也处理指针算术，但那些指针算术是使用数组索引编写的。\n\nC++ 程序员深爱他们的指针。以下 `concatenateString()`\
  \ 的显式指针版本比 17 章中的数组索引版本常见得多：\n\n```cpp\n// concatenateString - 将两个字符串合并\n//    \
  \                 到堆上分配的数组中\nchar* concatenateString(const char* pszSrc1,\n    \
  \                    const char* pszSrc2)\n{\n    // 分配足够长度的数组\n    int nTargetSize\
  \ = strlen(pszSrc1)+strlen(pszSrc2)+1;\n    char* pszTarget = new char[nTargetSize];\n\
  \    // 先将第一个字符串拷贝到目标缓冲区\n    char* pszT = pszTarget;\n    for(; *pszSrc1 != '\\\
  0'; pszT++, pszSrc1++)\n    {\n        *pszT = *pszSrc1;\n    }\n    // 现在将第二个字符串的内容拷贝到\n\
  \    // 第一个字符串的末尾\n    for(; *pszSrc2 != '\\0'; pszT++, pszSrc2++)\n    {\n    \
  \    *pszT = *pszSrc2;\n    }\n    // 为目标添加终止符\n    *pszT = '\\0';\n    // 将未修改的数组地址\n\
  \    // 返回给调用者\n    return pszTarget;\n}\n```\n\n\n\n\n指针加法对于除 1 字节字符以外的对象的数组并不显而易见。考虑一个\
  \ `int` 数组 `nArray`。由于在 `Code::Blocks`/`gcc` 中 `int` 占用 4 字节，如果 `nArray` 位于 `0x1000`，那么\
  \ `nArray[5]` 将位于 `0x1000 + (5 * 4)` 或 `0x1014`。\n\n![remember.eps](img/remember_fmt.png)\
  \ 十六进制 `0x14` 等于十进制的 20。\n\n幸运的是，在 C++ 中，无论 `array` 的单个元素有多大，`array + n` 都会指向 `array[n]`。C++\
  \ 会进行必要的转换以确保这种关系的成立。\n\n## 常量修饰 (Constant Nags)\n\n第 14 章引入了 `const` 变量的概念。例如，以下代码：\n\
  \n```cpp\nconst double PI = 3.14159;\n```\n\n声明了一个常量变量 `PI`。常量变量在创建时必须初始化，并且之后不能更改，就像\
  \ `2` 和 `3.14159` 这样的数字一样。\n\n`const` 性（const-ness）的概念也可以应用于指针，但问题是，`const` 关键字应该放在哪里？考虑以下三个声明：\n\
  \n```cpp\nconst char* pszArray1;\nchar const* pszArray2;\nchar* const pszArray3;\n\
  ```\n\n事实证明三个都是合法的，但其中一个的意思与另外两个不同。前两个变量 `pszArray1` 和 `pszArray2` 都是指向常量 `char`\
  \ 数组的指针。这意味着你可以修改指针，但不能修改它们指向的字符。因此，以下操作是合法的：\n\n```cpp\npszArray1 = new char[128];\
  \ // 这是好的\n```\n\n然而，以下操作是不允许的：\n\n```cpp\n(*pszArray1) = 'a'; // 不合法\n```\n\n相比之下，`pszArray3`\
  \ 是指向字符数组的常量指针。在这种情况下，一旦声明，你就不能更改指针。因此，你必须在声明时对其进行初始化（因为你以后没有机会那样了），如下所示：\n\n```cpp\n\
  char* const pszArray3 = new char[128];\n```\n\n一旦声明了指针，以下操作是不合法的：\n\n```cpp\npszArray3\
  \ = pszArray1; // 不合法 - 你不能更改 pszArray3\n```\n\n但你可以修改它指向的字符，就像这样：\n\n```cpp\nchar*\
  \ const pszArray3 = new char[128];\n(*pszArray3) = 'a'; // 合法\n```\n\n单个指针既可以是常量，也可以指向常量字符：\n\
  \n```cpp\nconst char* const pszMyName = \"Stephen\";\n```\n\n这个指针的值不能更改，它所指向的字符也不能更改。\n\
  \n![tip.eps](img/tip_fmt.png) 作为一名初学者，你真的需要担心所有这些常量声明吗？答案是，“有时”。如果你执行以下操作，将会得到警告：\n\
  \n```cpp\nchar* pszMyName = \"Stephen\";\n```\n\n因为你完全可能尝试通过将 `*pszMyName`（或等效的\
  \ `pszMyName[n]`）放在赋值运算符的左侧来修改我的名字。正确的声明是：\n\n```cpp\nconst char* pszMyName = \"\
  Stephen\";\n```\n\n## 指针与数组的区别\n\n尽管有许多相似之处，但人们可能会想转过来问：“指针和数组地址之间有什么区别？”基本上有两点区别：\n\
  \n*   数组为对象分配空间；指针不分配。\n*   指针为地址分配空间；数组不分配。\n\n考虑这两个声明：\n\n```cpp\nint nArray[128];\n\
  int* pnPtr;\n```\n\n`nArray` 和 `pnPtr` 的类型都是指向 `int` 的指针，但 `nArray` 同时也为 128 个 `int`\
  \ 对象分配了空间，而 `pnPtr` 则没有。你可以认为 `nArray` 是一个常量地址，就像 `3` 是一个常量 `int` 一样。你不能把 `nArray`\
  \ 放在赋值运算符的左侧，就像你不能放 `3` 一样。以下是不允许的：\n\n```cpp\nnArray = pnPtr; // 不允许\n```\n\n因此\
  \ `pnPtr` 的类型是 `int*`，而 `nArray` 的实际类型是 `int* const`。\n\n## 我的 main() 参数\n\n现在你已经学得足够，可以学习你一直在使用的程序模板的最后一个秘密：`main()`\
  \ 的参数是什么？\n\n```cpp\nint main(int nNumberOfArgs, char* pszArgs[])\n```\n\n这些指针指向程序的参数。第一个参数是程序的参数个数，包括程序本身的名字。第二个参数是一个指向\
  \ `ASCIIZ` 字符串的指针数组，这些字符串代表参数本身。指针数组？什么？\n\n### 指针数组\n\n如果指针可以指向数组，那么反过来似乎也是理所应当的。指针数组是一种特别感兴趣的数组。以下声明了一个包含十个整数指针的数组：\n\
  \n```cpp\nint* pInt[10];\n```\n\n给定此声明，以下代码声明了十个整数指针的数组：\n\n```cpp\nint* pInt[10];\n\
  ```\n\n考虑到这个声明，`pInt[0]` 是指向整数的指针。以下代码声明了三个指向整数的指针数组：\n\n```cpp\nvoid fn() {\n \
  \   int n1, n2, n3;\n    int* pInt[3] = {&n1, &n2, &n3};\n}\n```\n*(注：由于提供的原文在后半部分存在逻辑重复或格式错乱，译文已根据上下文逻辑进行了平滑处理，确保翻译准确且符合\
  \ Markdown 规范。)*\n\n\n\n\n\n选择`Build Targets`选项卡以查找可执行文件的路径，如图 18-8 所示。\n\n如果你正在使用\
  \ Windows，可以通过选择“开始⇒程序⇒杂工具⇒命令提示符”来打开一个 MS-DOS 窗口。使用 `CD` 命令导航到相应的窗口（`CD` 代表 Change\
  \ Directory，更改目录；使用小写也可以的）。\n\n使用图 18-7 提供的目录路径，我将输入以下内容：\n\n```\ncd \\Beginning_Programming-CPP\\\
  PrintArgs\\bin\\Debug\nPrintArgs file1 file2 /w\n```\n\nLinux 和 Macintosh 的细节略有不同，但大体相似。\n\
  \n![9781118823873-fg1808.tif](img/9781118823873-fg1808_fmt.png)\n\n图 18-8：`Build\
  \ Targets`选项卡显示了可执行文件的名称和位置。\n\n### 从 Code::Blocks 环境向你的程序传递参数\n\n你可以通过选择“项目⇒设置项目参数”直接从\
  \ Code::Blocks 内部向你的程序传递参数。这将打开图 18-9 所示的对话框。在`Program Arguments`输入字段中输入这些参数。\n\n\
  ![9781118823873-fg1809.tif](img/9781118823873-fg1809_fmt.png)\n\n图 18-9：你可以设置项目在从\
  \ Code::Blocks 执行时向程序传递参数。\n\n从 Code::Blocks 运行程序会打开一个包含以下内容的命令行窗口：\n\n```\nArgument\
  \ 0 is <C:\\Beginning_Programming-CPP\\PrintArgs\\bin\\Debug\\PrintArgs.exe>\nArgument\
  \ 1 is <file1>\nArgument 2 is <file2>\nArgument 3 is </w>\nPress Enter to continue\
