  \ 20 章中会介绍调试器。）\n\n### 通过 Windows 向你的程序传递参数\n\n在 Windows 中，向程序传递参数还有最后一种方法：如果你双击可执行文件的名称，Windows\
  \ 将不带任何参数执行程序。但是，如果你将一组文件拖动并释放到程序的可执行文件名上，Windows 将执行该程序，并将文件名作为参数传递给它。\n\n为了演示，我在`PrintArg.exe`文件所在的目录下创建了两个名为\
  \ `file1.txt` 和 `file2.txt` 的虚拟文件，如图 18-10 所示。\n\n![9781118823873-fg1810.tif](img/9781118823873-fg1810_fmt.png)\n\
  \n图 18-10：在这里我在`PrintArgs.exe`可执行文件相同的目录下创建了两个虚拟文件。\n\n然后我选择了这两个文件，并将它们拖动并释放到`PrintArgs.exe`文件名上。图\
