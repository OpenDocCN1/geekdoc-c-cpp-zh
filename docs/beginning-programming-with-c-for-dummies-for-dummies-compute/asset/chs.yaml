  \ \"factorial.h\"`。\n\n### 构建结果\n\n现在你可以构建程序了（通过选择“构建”⇒“构建”）。注意输出消息，编译器现在编译两个文件：`main.cpp`\
  \ 和 `factorial.cpp`。随后是一个单一的链接步骤。\n\n执行时，此版本的输出与之前的版本无二致，如下面的测试输出所示：\n\n```\nThis\
  \ program calculates factorials of user input.\nEnter a negative number to exit\n\
  Enter number: 5\n5 factorial is 120\nEnter number: 6\n6 factorial is 720\nEnter\
  \ number: -1\nPress Enter to continue …\n```\n\n### 变量作用域\n\n变量根据其定义方式被分配一个存储类型，如下所示：\n\
  \n```cpp\nint GlobalVariable;\n\nvoid fn()\n{\n    int LocalVariable;\n    static\
  \ int StaticVariable = 1;\n}\n```\n\n在函数内部定义的变量如 `LocalVariable` 直到控制通过时才存在。此外，控制退出时它们消失。\n\
  \n相比之下，`GlobalVariable` 在程序启动时创建，并在程序运行期间存在。所有函数都可以访问 `GlobalVariable`。与 `LocalVariable`\
  \ 不同，`StaticVariable` 在返回时不会被破坏。相反，它在调用之间保留其值。\n\n在这个例子，`StaticVariable` 在第一次调用\
  \ `fn()` 时被初始化为 1。函数将其更改为 2。每次后续调用 `fn()`，初始化部分都会被忽略。\n\n然而，`StaticVariable` 的作用域仍然是局部的。fn()\
  \ 外部的代码无法访问 `StaticVariable`。\n\n全局变量用于存储希望所有函数访问的值。静态变量最适用于计数器——例如，如果你想知道函数被调用了多少次。然而，大多数变量都是普通的局部变量。\n\
  \n# 第 13 章\n\n# 调试你的程序，第 2 部分\n\n## 本章内容\n\n![arrow](img/arrow.png) 调试多函数程序\n\n\
  ![arrow](img/arrow.png) 执行单元测试\n\n![arrow](img/arrow.png) 在调试期间使用定义的预处理器命令\n\n本章通过展示如何创建调试函数来让你更快地导航错误，扩展了第\
  \ 8 章中引入的调试技术。\n\n## 调试功能异常程序\n\n为了演示将程序划分为函数如何使结果更容易阅读和维护，我创建了 SwitchCalculator\
  \ 程序的版本，其中计算器操作被拆分为一个独立函数（如果我那时就知道函数，它本该是这样的）。不幸的是，我在过程中引入了一个错误，直到我进行某些测试时才出现。我将这个错误保存为\
  \ CalculatorError1：\n\n```cpp\n// CalculatorError1 - SwitchCalculator 程序\n// 但其中有一个细微错误\n\
  ```\n\n\n\n` 标签内似乎不完整（只有代码没有后续描述），我根据你提供的上下文和格式要求，对代码中的注释部分进行了专业的中文翻译。\n\n[content]\n\
  \n```cpp\n// 原型声明\n\nint calculator(char cOperator, int nOper1, int nOper2);\n\n\
  int main(int nNumberofArgs, char* pszArgs[])\n{\n    // 输入 操作数 op 操作数\n    int nOper1;\n\
  \    int nOper2;\n    char cOperator;\n    cout << \"输入'value1 op value2'\\n\"\n\
  \         << \"其中 op 是 +, -, *, / 或 %:\" << endl;\n    cin >> nOper1 >> cOperator\
  \ >> nOper2;\n    // 输出用户输入的内容，随后跟上\n    // 操作结果\n    cout << nOper1 << \" \"\n\
  \         << cOperator << \" \"\n         << nOper2 << \" = \"\n         << calculator(cOperator,\
  \ nOper1, nOper2)\n         << endl;\n    // 在程序终止前等待用户准备好\n    // 以便用户查看程序结果\n\
  \    cout << \"按回车键继续...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\
  \    return 0;\n}\n\n// calculator -返回对 nOper1 和 nOper2 执行\n//              的 cOperator\
  \ 操作的结果\nint calculator(char cOperator, int nOper1, int nOper2)\n{\n    int nResult\
  \ = 0;\n    switch (cOperator)\n    {\n        case '+':\n            nResult =\
  \ nOper1 + nOper2;\n        case '-':\n            nResult = nOper1 - nOper2;\n\
  \            break;\n        case '*':\n        case 'x':\n        case 'X':\n \
  \           nResult = nOper1 * nOper2;\n            break;\n        case '/':\n\
  \            nResult = nOper1 / nOper2;\n            break;\n        case '%':\n\
  \            nResult = nOper1 % nOper2;\n            break;\n        default:\n\
  \            // 不理解该操作符\n            cout << \" 无法识别\";\n    }\n    return nResult;\n\
  }\n```\n\n此程序的开头部分与其先前的 SwitchCalculator 相同，不同之处在于新创建的 `calculator()` 函数增加了原型声明。注意这里的\
  \ `main()` 变得多么整洁：它提示用户输入，然后回显输出以及 `calculator()` 的结果。非常整洁。\n\n`calculator()` 函数也比以前更简单；它做的只是执行由\
  \ `cOperator` 指定的计算。那些提示用户输入并显示结果的无关代码消失了。\n\n现在要做的就是测试结果。\n\n### 执行单元级测试\n\n将程序拆解为函数不仅允许你分段编写程序，还允许你单独测试程序中的每个函数。在\
  \ SwitchCalculator 程序的这个函数版本中，我需要通过向函数提供所有可能的输入（包括合法和非法的）来测试 `calculator()` 函数。\n\
  \n首先，我为 `calculator()` 生成了一组测试用例。很显然，我需要对 `switch` 语句中的每种情况进行测试。我还需要一些边界条件，例如“当被要求除以\
  \ 0 时，函数如何响应？”。事实证明，在这种情况下我很幸运——调用它的函数 `main()` 允许我向函数提供任何我想要的输入。通常情况下都是这样——函数往往只从主程序以特定的方式被调用。在这种情况下，我必须编写一个特殊的测试模块，通过向函数传递各种测试用例并记录结果来对其进行测试。\n\
  \n你为什么需要编写额外的调试代码？如果某个情况从未在程序中出现，即使函数没有处理该情况你又会在乎什么？你会在乎是因为你不知道该函数将如何被使用。一旦编写完成，函数往往会在它所编写的程序之外产生自己的生命。一个实用的函数可能会被几十个不同的程序使用，这些程序会以你可能想过的各种方式来调用它。此外，此类漏洞经常被黑客利用。以下显示了第一个测试用例的结果：输入'value1\
  \ op value2'\n其中 op 是 +, -, *, / %: 10 + 20=10 似乎是错误的。\n\n### 为测试配置函数\n\n与大多数大多数函数一样，`calculator()`\
  \ 本身不执行任何自己的 I/O。这使得无法确定判断函数内部到底发生了什么。我在第 8 章中通过在关键位置添加输出语句解决了这个问题。当然，在第 8 章中，你还不知道函数，但现在你知道了。\n\
  \n事实证明，创建一个打印你可能想知道的所有内容的错误函数要简单得多。然后你可以在关键位置复制并粘贴对该测试函数的调用。这种方法比为每个位置编写唯一的输出语句要更快，且更不容易出错。C++\
  \ 在创建和调用此类调试函数方面提供了一些帮助。预处理器定义了表 13-2 所示的几个特殊符号。\n\n表 13-2 创建调试函数时的预定义符号\n\n| 符号\
  \ | 类型 | 值 |\n| :--- | :--- | :--- |\n| `__LINE__` | `int` | 当前源代码模块中的行号 |\n| `__FILE__`\
  \ | `const char*` | 当前模块的名称 |\n| `__DATE__` | `const char*` | 模块编译的日期（不是当前日期） |\n\
  | `__TIME__` | `const char*` | 模块编译的时间（不是当前时间） |\n| `__func__` | `const char*` |\
  \ 当前函数的名称 |\n| `__FUNCTION__` | `const char*` | 当前函数的名称（仅限 GCC） |\n| `__PRETTY_FUNCTION__`\
  \ | `const char*` | 当前函数的扩展名称（仅限 GCC） |\n\n你还没有见过 `const char*` 类型（它将在第 16 章首次登场）。现在，听我的，它是双引号包含的字符字符串类型，例如，“Stephen\
  \ Davis is a great guy”—用于接下来的代码中。\n\n你可以看到表 13-2 中的预处理器命令是如何在以下配备了新创建调试函数 `printErr()`\
  \ 的 `calculator()` 版本中使用的。以下代码段取自在线材料中的 `Calculator2` 程序：\n\n\n\n\n\n`printErr()`\
  \ 函数显示了操作符的值和两个操作数。它还显示了调用该函数的行号。该行号是由 C++ 预处理器以 `__LINE__` 符号的形式提供的。在错误信息中打印行号，可以帮助我将调试输出与程序的正常输出区分开来。\n\
  \n你可以通过检查这个新配置版本的程序的输出，看到它是如何运作的：\n\n```\nEnter 'value1 op value2'\nwhere op is\
  \ +, -, *, / or %:\n10 + 20\nOn line 50: '+' operand 1 = 10 and operand 2 = 20\n\
  On line 55: '+' operand 1 = 10 and operand 2 = 20\nOn line 58: '+' operand 1 = 10\
  \ and operand 2 = 20\n10 + 20 = -10\nPress any key to continue …\n```\n\n图 13-1\
  \ 显示了 Code::Blocks 编辑器中程序的显示界面，包括显示左侧的行号。\n\n![9781118823873-fg1301.tif](img/9781118823873-fg1301_fmt.png)\n\
  \n图 13-1：Code::Blocks 编辑器中 `calculator()` 函数的视图，显示了行号。\n\n在我输入“10 + 20”并按下回车键后，程序立即从第\
  \ 50 行调用 `printErr()` 函数。这是正确的，因为这是函数的第一行。检查值，你可以发现输入似乎是正确的：`cOperator` 是‘+’，`nOper1`\
  \ 是 10，`nOper2` 是 20，正如你预期的那样。\n\n下次调用 `printErr()` 发生在第 55 行，这是加法分支的第一行，再次符合预期。值没有变化，所以一切看起来都很正常。\n\
  \n下一行完全出乎意料。由于某种原因，`printErr()` 在第 58 行被调用了。这是减法分支的第一行。由于某种原因，控制流直接从加法分支穿透到了减法分支。\n\
  \n然后我发现了！加法分支末尾缺少了 `break` 语句。程序正确地计算了和，但随后穿透到了下一个分支，并用差覆盖了该值。\n\n首先，我添加了缺失的 `break`\
  \ 语句。我没有删除对 `printErr()` 的调用——函数中可能还有其他 bug，我最终会把它们重新加回来。在确信函数运行正常之前，删除这些调用是没有意义的。\n\
  \n### 回到单元测试\n\n更新后的程序为加法测试用例生成了以下输出：\n\n```\nEnter 'value1 op value2'\nwhere op\
  \ is +, -, *, / or %:\n10 + 20\nOn line 49: '+' operand 1 = 10 and operand 2 = 20\n\
  On line 54: '+' operand 1 = 10 and operand 2 = 20\n10 + 20 = 30\nPress Enter to\
  \ continue …\n```\n\n这与表 13-1 中的预期结果相符。继续测试该表中定义的测试用例，所有结果都匹配，直到我遇到 10 / 0 的用例——此时我得到了图\
  \ 13-2 显示的输出。`printErr()` 的输出显示输入被正确读取，但程序在第 68 行后不久崩溃了。\n\n![9781118823873-fg1302.tif](img/9781118823873-fg1302_fmt.png)\n\
  \n图 13-2：当我输入‘10 / 0’时，`CalculatorError` 程序带有神秘的错误信息终止。\n\n很明显，程序实际上是在执行除零操作时在第\
  \ 69 行崩溃。我需要添加一个测试来拦截这种情况，并告诉程序如果 `nOper2` 的值为 0 则不要执行除法。\n\n当然，这引出了一个问题：如果 `nOper2`\
  \ 为 0，我应该从函数返回什么值？表 13-1 中的“预期结果”案例说，只要程序不崩溃，我们不在乎除零时返回什么。既然如此，我决定返回 0。然而，我需要在函数的注释中记录这种情况。\n\
  \n在函数中添加该内容后，我从头开始测试。\n\n![remember.eps](img/remember_fmt.png) 每当你修改函数时，你都需要回到测试用例的开头重新开始。\n\
  \n函数在每个用例中都生成预期结果。现在我可以删除 `printErr()` 函数了。完成后的 `calculator()` 函数（包含在在线材料的 `CalculatorError`\
  \ 程序中）如下：\n\n```cpp\n// calculator -返回 cOperator 对 nOper1 和 nOper2 执行的结果\n（如果除零或不理解运算符，函数返回\
  \ 0。）\nint calculator(char cOperator, int nOper1, int nOper2)\n{\n    int nResult\
  \ = 0;\n    switch (cOperator)\n    {\n        case '+':\n            nResult =\
  \ nOper1 + nOper2;\n            break;\n        case '-':\n            nResult =\
  \ nOper1 - nOper2;\n            break;\n        case '*':\n        case 'x':\n \
  \       case 'X':\n            nResult = nOper1 * nOper2;\n            break;\n\
  \        case '/':\n            if (nOper2 != 0)\n            {\n              \
  \  nResult = nOper1 / nOper2;\n            }\n            break;\n        case '%':\n\
  \            nResult = nOper1 % nOper2;\n            break;\n        default:\n\
  \            // 不理解运算符\n            cout << \" is not understood\";\n    }\n   \
  \ return nResult;\n}\n```\n\n这个版本的 `calculator()` 函数不再会有导致原始版本崩溃的错误。此外，这个更新版本在除法情况下包含了一个测试：如果\
  \ `nOper2` 为零，它不会执行会导致崩溃的除法，而是保持 `nResult` 的初始值不变。\n\n# 第四部分 数据结构\n\n![webextras.eps](img/webextras_fmt.png)\
  \ 访问 [www.dummies.com/extras/beginningprogrammingplus] 获取更多 Dummies 内容。在本部分……\n\n\
  *   应用浮点变量\n*   创建常量值\n*   构建数组\n*   声明指针\n*   传递参数给函数\n*   创建类和对象\n*   使用调试器测试\n\
  *   访问 [www.dummies.com/extras/beginningprogrammingplus] 获取更多 Dummies 内容\n\n# 第\
  \ 14 章 其他数值类型\n\n## 本章内容\n\n![arrow](img/arrow.png) 回顾整数的局限性\n![arrow](img/arrow.png)\
  \ 在 C++中引入实数\n![arrow](img/arrow.png) 查看实数的局限性\n![arrow](img/arrow.png) 查看 C++中的某些变量类型\n\
  ![arrow](img/arrow.png) 函数重载\n\n到为止，程序仅限于 `int` 类型的变量，只加入了几个 `char`。整数适用于大多数计算——C++中超过\
  \ 90%的变量都是 `int` 类型。遗憾的是，`int` 并不适用于所有问题。在本章中，你将看到基本 `int` 的两种变体以及其他内置类型。内置类型是语言自带的类型。在第\
  \ 19 章](#26_9781118823873-ch19.xhtml)中，你将看到程序员如何定义自己的变量类型。\n\n![remember.eps](img/remember_fmt.png)\
  \ 某些语言允许在同一个变量中存储不同类型的数据。这些被称为弱类型语言。相比之下，C++是一种强类型语言——它要求你声明要存储的数据类型。变量一旦声明，就无法更改类型。\n\
  \n\n\n\n并不是整数表达式不能产生小数值。只是 `int` 类型没有方法存储小数部分。处理器在存储结果之前，会丢弃小数点右侧的部分。（这种丢弃数字小数部分的行为被称为\
  \ `truncation`（截断）。）\n\n考虑计算三个数字平均值的问题。给定三个 `int` 变量——`nValue1`、`nValue2` 和 `nValue3`——它们的平均值由以下表达式：\n\
  \n```cpp\nint nAverage = (nValue1 + nValue2 + nValue3)/3;\n```\n\n假设 `nValue1` 等于\
  \ 1，`nValue2` 等于 2，`nValue3` 等于 2 —— 该表达式的和为 `5`。这意味着平均值为 `5 /3`，或者说是 `1 2/3` 或\
  \ `1.666`，取决于你的个人喜好。但这并没有使用整数运算。\n\n由于所有三个变量都是整数，因此假设和也是一个整数。而且因为 `3` 也是一个整数，你猜对了，整个表达式被视为一个整数。因此，在给定\
  \ 1、2 和 2 相同值的情况下，C++ 为 `nAverage` 值计算出一个不合理但符合逻辑的结果 `1`。\n\n在以下数学等价的表述中，问题严重得多：\n\
  \n```cpp\nint nAverage = nValue1/3 + nValue2/3 + nValue3/3;\n```\n\n代入相同的 1、2 和\
  \ 2 值，`nAverage` 的结果现在变成了 `0`（谈谈什么叫符合逻辑但不合理，就在这儿）。为了看到这是如何发生的，考虑 `1/2` 截断为 `0`，`2/3`\
  \ 截断为 `0`，而 `2/3` 截断为 `0`。`0`、`0` 和 `0` 的和是（惊喜吧！）`0`。\n\n你可以看到，有些时候整数截断是完全无法接受的。\n\
  \n### 有限范围\n\n`int` 变量类型的第二个问题是它的范围有限。普通的 `int` 可以存储的最大值为 `2,147,483,647`，最小值为 `-2,147,483,648`\
  \ ——大约从正 20 亿到负 20 亿 —— 总范围为 40 亿。\n\n![warning.eps](img/warning_fmt.png) 这是在现代\
  \ PC、Mac 或其他常见处理器上的。如果你有一台非常老旧机器，`int` 的范围可能没有那么大。我将在本章稍后的部分详细说明这一点。\n\n![remember.eps](img/remember_fmt.png)\
  \ 20 亿是一个巨大的数字——对于大多数应用程序来说足够大了。这就是为什么 `int` 非常有用。但对于某些应用，包括计算机技术，它还不够。事实上，你的计算机运行速度可能超过\
  \ `2 GHz`（吉赫）（`2 GHz` 是每秒十亿次循环）。单根光纤（那种横跨整个国家两侧的光纤）每秒传输的比特远超 20 亿位。（我甚至不想提银河系中恒星的数量。）\n\
  \n## 一种“双重”实数的类型\n\n在某些应用中，`int` 变量的限制性是不可接受的。幸运的是，C++ 理解带有小数部分的数字。（数学家称这些为 `real\
  \ numbers` 实数。）在 C++ 中，小数被称为 `floating-point numbers`（浮点数）或简单称为 `floats`。这是因为小数点可以从左到右浮动以处理小数。\n\
  \nC++ 中的浮点变量有两种基本类型。较小的一种通过使用关键字 `float` 声明如下：\n\n```cpp\nfloat fValue1;      //\
  \ 声明一个浮点\nfloat fValue2 = 1.5;  // 在声明时初始化\n```\n\n奇怪的是，C++ 中的标准浮点变量是它较大的兄弟，`double-precision`\
  \ 双精度浮点或简单称为 `double`。你按如下方式声明双精度浮点：\n\n```cpp\ndouble dValue1;\ndouble dValue2\
  \ = 1.5;\n```\n\n![tip.eps](img/tip_fmt.png) 因为 C++ 的原生浮点类型是 `double`，我通常避免使用 `float`。`float`\
  \ 确实占内存较少，但这对于大多数应用来说并不是问题。本书剩下的部分我将坚持 `double`。此外，当我说“浮点变量”时，你可以假设我说的是 `double`\
  \ 类型变量。\n\n### 解决截断问题\n\n为了看到 `double` 如何解决我们的截断问题，考虑三个浮点变量 `dValue1`、`dValue2`\
  \ 和 `dValue3` 的平均值，公式如下：\n\n```cpp\ndouble dAverage = dValue1/3.0 + dValue2/3.0\
  \ + dValue3/3.0;\n```\n\n再次假设初始值为 `1.0`、`2.0` 和 `2.0`。这使得这里给出的表达式等于：\n\n```cpp\n\
  double dAverage = 1.0/3.0 + 2.0/3.0 + 2.0/3.0;\n```\n\n它又等于：\n\n```cpp\ndouble dAverage\
  \ = 0.333... + 0.6666... + 0.6666...;\n```\n\n导致最终值为：\n\n```cpp\ndouble dAverage\
  \ = 1.666...;\n```\n\n\n\n\n在需要计数的应用程序中，你不能使用浮点变量。在 C++ 中，你不能说我的第一个名字里有 7.0 个字符。涉及计数的运算符无法作用于浮点变量。特别是自增（`++`）和自减（`--`）运算符在\
  \ `double` 类型上是严格禁止的（verboten）。\n\n### 计算速度\n计算机执行整数运算的速度比执行浮点运算快。幸运的是，多年来 CPU 已经内置了浮点处理器，因此性能差异已经像以前那样显著了。我写了以下循环作为一个简单的示例，首先使用整数算术：\n\
  \n```cpp\nint nValue1 = 1, nValue2 = 2, nValue3 = 2;\n\nfor (int i = 0; i < 1000000000;\
  \ i++)\n{\n    int nAverage = (nValue1 + nValue2 + nValue3) / 3;\n}\n```\n\n这个循环在我的笔记本电脑上执行了大约\
  \ 5 秒。然后我用浮点算术执行了相同的循环：\n\n```cpp\ndouble dValue1 = 1, dValue2 = 2, dValue3 = 2;\n\
  \nfor (int i = 0; i < 1000000000; i++)\n{\n    double dAverage = (dValue1 + dValue2\
  \ + dValue3) / 3.0;\n}\n```\n\n这个循环在同一台笔记本电脑上执行了大约 21 秒。在 20 多秒内计算 10 亿次平均值并不差，但它仍然比对应的整数处理时间慢了四倍。\n\
  \n### 占用更多内存\n表 14-2 显示了每个类型的变量消耗的内存。在 PC 或 Macintosh 上，`int` 占用 4 字节，而 `double`\
  \ 占用 8 字节。这听起来并不多少——事实上也如此——但如果你要在内存中保留几百万个这样的东西……嗯，这仍然算不了什么。但如果你有几亿个，那么差异就会非常显著了。\n\
  \n这是另一种表达方式：除非你需要存储极大量的对象，否则不要担心不同类型之间内存占用的差异。相反，选择符合你需求的变量类型。\n\n如果你恰好正在编写一个需要（例如）同时处理地球上每个人类年龄的应用程序，那么你可能更倾向于使用较小的\
  \ `int`（或我在本章中讨论的其他整数类型之一），因为它们消耗的内存较少。（你经常做这类事情吗？）\n\n### 精度损失\n`double` 变量具有大约\
  \ 16 位有效数字的精度。考虑一下数学家会将数字 1/3 表示为 0.333...，其中省略号表示 3 无限持续。无限级数的概念在数学中是有意义的，但在计算中不是。计算机的内存是有限的，精度也是有限的。因此它必须进行舍入，这导致了微小（但真实）误差。\n\
  \nC++ 在很多情况下可以修正舍入误差。例如，在输出时，如果一个变量是 0.99999999999999，C++ 会直接认为它实际上是 1.0 并相应显示。然而，C++\
  \ 无法修正所有的浮点舍入误差，所以你需要小心。例如，你无法确定 1/3 + 1/3 + 1/3 是否等于 1.0：\n\n```cpp\ndouble d1\
  \ = 23.0;\ndouble d2 = d1 / 7.0;\n\nif (d1 == (d2 * 7.0))\n{\n    cout << \"Did\
  \ we get here?\" << endl;\n}\n```\n\n你可能认为这段代码片段会始终显示 \"Did we get here?\" 字符串，但惊讶的是它并没有。问题是\
  \ 23 除以 7 无法用浮点数精确表示。某些东西丢失了。因此，`d2 * 7` 非常接近 23，但并不完全相等。\n\n与其寻找两个浮点数之间的精确相等，你应该问：“`d2\
  \ * 7` 的值在数值上是否极其接近 `d1`？” 如下如下操作：\n\n```cpp\ndouble d1 = 23.0;\ndouble d2 = d1\
  \ / 7.0;\n\n// d2 * 7.0 是否在 d1 的差值范围内？\ndouble difference = (d2 * 7.0) - d1;\ndouble\
  \ delta = 0.00001;\n\nif (difference < delta && difference > -delta)\n{\n    cout\
  \ << \"Did we get here?\" << endl;\n}\n```\n\n这段代码片段计算了 `d1` 和 `d2 * 7.0` 之间的差。如果这个差小于某个小的\
  \ `delta`，代码就会结束并认为 `d1` 和 `d2 * 7` 本质上是相等的。\n\n#### 有限的范围\n`double` 能存储的最大数字大约是\
  \ 10 的 38 次方。那是 1 后面跟着 38 个 0。\n\n\n\n\n\n这看起来可能很奇怪，但 C++ 标准并没有确切说明每个数据类型实际上能容纳多大的数字。标准只处理了每个变量类型之间的相对大小。例如，它说\
  \ `long int` 的最大值至少与 `int` 的最大值一样。（2011 版的标准说稍微多了一点——例如，`long int` 至少必须是 32 位——但它仍然没有规定每一个变量类型的大小。）C++\
  \ 的作者们并不是为了故弄神秘。他们希望让编译器能够为基础机器实现尽可能快的代码。该标准的设计是为了适用于所有不同类型的处理器，以及运行不同操作系统的环境。\n\
  \n事实上，`int` 的标准大小在过去的几十年里发生了变化。在 2000 年之前，大多数 PC 上的标准 `int` 是 2 字节，范围是正负 64,000。在\
  \ 2000 年左右，Intel 处理器上的基本字长变为了 32 位。大多数编译器都改成了如今的默认 `int` 类型 —— 它是 4 字节，范围是正负 20\
  \ 亿。\n\n表 [14-2] 提供了 `Code::Blocks/gcc` 编译器（以及大多数其他用于运行 32 位操作系统上的 Intel 处理器的编译器）每个变量类型的大小和范围。\n\
  \n![1402](img/9781118823873-tbl1402_fmt.png)\n\n尝试计算超出变量类型范围的数字被称为*溢出*（overflow）。C++\
  \ 标准通常将*溢出*的结果留为未定义。这是 C++ 发明者想要保持语言灵活性的另一种方式，以便生成的机器码尽可能快。\n\n![tip.eps](img/tip_fmt.png)\
  \ 在 PC 上，浮点数溢出会产生一个异常，如果不处理，将导致你的程序崩溃。（有关异常处理的更多信息，请参见第 [32] 章）。尽管听起来很糟糕，但整数溢出更糟\
  \ —— C++ 会在没有任何抱怨的情况下生成一个错误的结果。\n\n## 常量类型\n\n这里 `const` 声明（在本章前面提到过，并在表 [14-1]\
  \ 中再次提到）再次出现了。我想花一点时间来扩展一下常量。\n\n*常量值*是一个显式的数字或字符，例如 `1` 或 `0.5` 或 ‘c’。\n\n*   常量值不能改变；也就是说，它们不能出现在赋值语句的左侧。\n\
  *   每个常量值都有类型。`1` 的类型是 `const int`。`0.5` 的类型是 `const double`。\n\n表 [14-1] 解释了如何声明不同类型的常量值。例如，`1L`\
  \ 的类型是 `const long`。\n\n可以使用 `const` 关键字将变量声明为常量：\n\n```cpp\nconst double PI = 3.14159;\
  \  // 声明常量变量\n```\n\n`const` 变量在声明时必须初始化，因为你以后不会有第二次机会 —— 与常量值一样，`const` 变量不能出现在赋值语句的左侧。\n\
  \n![tip.eps](img/tip_fmt.png) 使用全大写字母声明 `const` 变量是一种常见做法。变量名中的多个单词用下划线分隔，如 `TWO_PI`。一如既往，这仅仅是一种惯例\
  \ —— C++ 并不在乎。\n\n声明一个变量然后说它不能改变这似乎很奇怪。为什么要这么做呢？很大程度上是因为一个命名良好的常量可以使程序变得更容易理解。考虑以下两个等效表达式：\n\
  \n```cpp\ndouble dC = 6.28318 * dR;  // 这是什么意思？\ndouble dCircumference = TWO_PI\
  \ * dRadius; // 这更容易\n// 理解\n```\n\n对于这段代码的读者来说，第二个表达式应该清晰得多，它表示将半径乘以 2π 来计算周长。\n\
  \n2011 版的 C++ 标准允许你根据初始化值的类型来指定变量的类型。要这样做，使用关键字 `auto` 而不是类型来声明变量：\n\n```cpp\nlong\
  \ function();\nauto nIntVar = 1;\nauto lLongVar = function();\nauto dVar = 1.0;\n\
  ```\n\n在这里，变量 `nIntVar` 被声明为 `int`，因为 `1` 是 `int`。同样，`lLongVar` 是 `long`，因为 `function()`\
  \ 被声明返回 `long`。\n\n注意，初始化值的类型必须在编译时已知，且一旦声明，变量的类型就固定了；你不能在以后更改它。\n\n## 向函数传递不同类型\n\
  \n如下代码段所示，浮点变量和不同大小的变量传递给函数的方式与 `int` 变量相同。\n\n```cpp\ndouble maximum(double d1,\
  \ double d2) {\n    if (d1 > d2) {\n        return d1;\n    } else {\n        return\
  \ d2;\n    }\n}\n\nint maximum(int d1, int d2) {\n    if (d1 > d2) {\n        return\
  \ d1;\n    } else {\n        return d2;\n    }\n}\n\nvoid otherFunction() {\n  \
  \  double dArg = 1.0;\n    double d2 = 2.0;\n    double result = maximum(dArg, d2);\n\
  }\n```\n\n### 重载函数\n\n上述具有相同的名称但不同的参数；这被称为*函数重载（function overloading）。\n\n你也可以通过符号和长度来区分：\n\
  \n```cpp\nint maximum(int d1, int d2);\nlong maximum(long l1, long l2);\nunsigned\
  \ maximum(unsigned un1, unsigned un2);\n```\n\n### 混合模式重载\n\n当调用中的参数与声明不匹配时，规则可能会变得非常诡异。考虑以下示例：\n\
  \n```cpp\ndouble maximum(double d1, double d2);\nint maximum(int d1, int d2);\n\n\
  void otherFunction() {\n    double dArg = 1.0;\n    int d2 = 2;\n    double result\
  \ = maximum(dArg, d2);\n}\n```\n\n在这里参数与任何声明都不匹配。没有 `maximum(double, int)`。C++ 可以合理地采取以下三个选项之一：\n\
  \n*   将 `0` 提升为 `double` 并调用 `maximum(double, double)`。\n*   将 `double` 降级为 `int`\
  \ 并调用 `maximum(int, int)`。\n*   放弃并报告编译器错误。\n\n通用规则是 C++ 将提升参数以匹配，但不会自动降低参数。然而，你不能总是依靠这条规则。在这种特殊情况下，Code::Blocks\
  \ 生成了一个错误，说调用是模糊的。也就是说，第三种方案胜出。\n\n我的建议不要依赖 C++ 来猜你的意图；相反，让必要的转换显式化：\n\n```cpp\n\
  void otherFunction(int nArg1, double dArg2) {\n    double result = maximum((double)nArg1,\
  \ dArg2);\n}\n```\n\n现在很清楚了我的意思是要调用 `maximum(double, double)`。\n\n\n\n\n到目前为止声明的变量具有不同的类型、大小和功能。尽管如此，每个变量一次只能存储一个值。如果我想存储三个数字，就必须声明三个不同的变量。问题是，有时我想要存储一组在某种程度上紧密相关的数字。将它们存储在名称拼写相似（如\
  \ `nArg1`、`nArg2` 等）的变量中，可能会在我的脑海中建立关联，但对于笨拙、无知的 C++ 来说并非如此。\n\n另一类被称为 `array`（数组）的变量，它可以存储一系列值。数组是本章和下一章的主题。（在这里我介绍了普通数组。在下一章中，我将介绍字符数组这一特殊情况。）\n\
  \n# 什么是数组？\n\n![tip.eps](img/tip_fmt.png) 如果你对数学感兴趣，并且在高中或大学期间接触过数组的概念，那么你可能想快速略过这一节。\n\
  \n你可以把变量想象成一辆卡车。有的小卡车，如 `short int`，只能存储很小的值；也有大卡车，如 `long double`，能够存储惊人的巨数字。然而，这些卡车中的每辆都只能存储一个值。\n\
  \n每辆卡车都有一个唯一的标识符。也许你给你的车辆命名，但即使你没有，每辆车也有车照，能够唯一描述你的每辆车，至少在一个给定的范围内如此。\n\n这对于一个家庭来说运行得很好。即使是最大的家庭，汽车多到也不至于让这种安排变得混乱。但想一下汽车租赁公司吧。如果他们仅通过车牌号或其他\
  \ ID 来指代他们的汽车会怎样？（天哪，一想到赫兹租车公司！）\n\n在填写了无数表格后——包括决定我是否需要全额保险，以及我是否太懒而不想在还车前把它加满油——柜台后的那个人说：“你的车是\
  \ QZX123。”离开大楼走向停车场，我望向一片与沃尔玛停车场相媲美的车海。QZX123 到底在哪里？\n\n这就是为什么柜台后的那个人实际上说的是完全不同的内容。他说类似：“你的车在\
  \ B11 号位。”这意味着我应该跳过 A 行直接到达 B 行，然后开始向下扫描，找到倒数第 11 辆车。数字通常漆在路面上以帮助我，但即使它们不可见，我也可能能猜出他指的是哪辆车。\n\
  \n为了让这个系统运行，必须满足以下几个条件：\n\n*   车位必须顺序编号（B2 紧随 B1 之后且在 B3 之前），理想情况下序列中没有中断或跳跃。\n\
  *   每个车位都设计用于停一辆车（某个停车位可能是空的，但重点是我永远不会在停车位里发现房子）。\n*   车位之间的间距相等（间距相等意味着我可以跳跃猜测\
  \ B50 在哪里，而不需要从 B1 走到 B49 并逐一检查每一个）。\n\n这基本上就是数组的工作方式。我可以给一组数字起一个统一的名字。我通过索引（index）引用序列中的单个数字。因此，变量\
  \ `x` 可能指代整个整数序列，`x(1)` 是序列中的第一个数字，`x(2)` 是第二个，依此类推，就像租租赁公司的汽车一样。\n\n## 声明数组\n\n\
  在 C++ 中声明数组，你必须提供数组的名称、类型和元素数量。语法如下：\n\n```cpp\nint nScores[100];\n```\n\n这声明了一个包含\
  \ 100 个整数的数组，并将其命名为 `nScores`。\n\n![tip.eps](img/tip_fmt.png) 数组和非数组使用相同的命名规范是常见做法——但要使用复数形式。这是合理的，因为\
  \ `nScores` 代表 100 个整数值。\n\n## 数组索引\n\n你必须提供一个 `index`（索引）来访问数组中的特定元素。索引必须是一个计数类型（例如\
  \ `int`），此处所示：\n\n```cpp\nnScores[11] = 10;\n```\n\n这类似于租赁汽车的编号方式。然而，与人类不同，C++ 在给数组编号时从\
  \ 0 开始。因此，数组 `nScores` 中的第一个分数是 `nScores[0]`。\n\n那么这到底是如何运作的？嗯，再次回到租车停车场（我保证是最后一次了）。图\
  \ 15-1 显示了租赁汽车通常在停车场中是如何编号的。B 行的第一辆车编号为 B1。要找到 B11，我只需将视线向右移动十辆车。\n\n![9781118823873-fg1501.tif](img/9781118823873-fg1501_fmt.png)\n\
  \n图 15-1：租车停车场中的汽车通常从 1 开始顺序编号，以便于查找。\n\nC++ 采取了类似的操作。为了执行语句 `nScores[11] = 10`，C++\
  \ 从 `nScores` 中第一个元素的地址开始。然后它向右移动 11 个空间，并在该位置存储一个 10。这在图 15-2 中以图形形式展示。\n\n（注：此处原文链接和文本描述似乎存在部分错乱，翻译已根据上下文逻辑处理）\n\
  \n### 示例\n\n以下示例对一组分数取平均值，然后显示平均值。\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\n// displayArray 显示数组的内容\nvoid displayArray(int\
  \ nValues[100], int nCount) {\n    for (int i = 0; i < nCount; i++) {\n        cout\
  \ << i << \" - \" << nValues[i] << endl;\n    }\n}\n\n// averageArray 对数组取平均\nint\
  \ averageArray(int nValues[100], int nCount) {\n    int nSum = 0;\n    for (int\
  \ i = 0; i < nCount; i++) {\n        nSum += nValues[i];\n    }\n    return nSum\
  \ / nCount;\n}\n\nint main(int nNumberArgs, char* pszArgs[]) {\n    int nScores[100];\n\
  \    int nCount;\n\n    // 提示用户输入\n    cout << \"此程序对一组分数取平均值\\n\";\n    cout <<\
  \ \"输入要平均的分数\\n\";\n    cout << \"(输入负值终止)\" << endl;\n\n    for (nCount = 0; nCount\
  \ < 100; nCount++) {\n        cout << \"Next: \";\n        cin >> nScores[nCount];\n\
  \        if (nScores[nCount] < 0) {\n            break;\n        }\n    }\n\n  \
  \  // 现在输出结果\n    cout << \"输入终止。\" << endl;\n    cout << \"输入数据:\" << endl;\n \
  \   displayArray(nScores, nCount);\n    cout << \"平均值为 \" << averageArray(nScores,\
  \ nCount) << endl;\n\n    // 等待用户准备好后再终止程序\n    // 允许用户看到程序的运行\n    cout << \"按回车键继续...\"\
  \ << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\n    return 0;\n}\n```\n\
  \n\n\n该程序从 `main()` 的开始运行，提示用户输入一系列整数值。程序在循环中将用户输入的每个数字都保存到数组 `nScores` 中。一旦用户输入一个负数，程序就会退出循环。\n\
  \n![tip.eps](img/tip_fmt.png) 注意到，该程序通过变量 `nCount` 跟踪已输入数值的数量。无论用户是否输入了负数，程序在输入\
  \ 100 个值后都会退出循环——因为程序存储数值的空间仅此为止。你应该始终确保不要越界数组末尾。\n\n一旦用户输入了负值或连续输入了 100 个值，程序就会退出循环。此时，`nScores`\
  \ 数组包含了所有入的数字，而 `nCount` 包含了存储在数组中的数值计数。\n\n然后，程序调用 `displayArray()` 函数向用户回显输入的值。最后，`averageArray()`\
  \ 函数返回输入数字的整数平均值。\n\n`displayAverage()` 函数遍历传递给它的数组中的值，并逐个显示每个值。`averageArray()`\
  \ 函数的工作原理也是遍历数组 `nValues`，并将数组元素的和累加到局部变量 `nSum` 中。该函数返回 `nSum / nCount`，即 `nValues`\
  \ 中值的平均值。\n\n在实践中，程序的输出如下：\n\n```\n此程序计算一组分数的平均值\n输入分数以计算平均值\n(输入负值以结束输入)\nNext:\
  \ 10\nNext: 20\nNext: 30\nNext: 40\nNext: 50\nNext: -1\n输入终止。\n输入数据:\n  0 - 10\n\
  \  1 - 20\n  2 - 30\n  3 - 40\n  4 - 50\n平均值为 30\n按回车键继续 …\n```\n\n## 初始化数组\n\n\
  与任何其他变量一样，如果你不初始化数组，它的初始值是不确定的。唯一的区别在于，与简单变量只包含一个不确定的值不同，数组初始时包含的是大量的未知值：\n\n```cpp\n\
  int nScores[100];  // nScores 中的所有值\n                  // 在你初始化它们之前都是未知的\n```\n\n\
  你可以通过如下循环来初始化数组的元素：\n\n```cpp\nint nScores[100];  // 声明数组，然后...\nfor (int i = 0;\
  \ i < 100; i++) // ...初始化它\n{\n    nScores[i] = 0;\n}\n```\n\n你也可以在声明数组时通过在声明后的括号中包含初始值来初始化。对于小型数组，这是很容易的：\n\
  \n```cpp\nint nCount[5] = {0, 1, 2, 3, 4};\n```\n\n在这里，我将 `nCount[0]` 的值初始化为 0，`nCount[1]`\
  \ 为 1，`nCount[2]` 为 2，以此此类推。如果元素个数多于列表中的数字，C++ 会用零填充列表。因此，在以下情况下：\n\n```cpp\nint\
  \ nCount[5] = {1};\n```\n\n第一个元素（`nCount[0]`）被设置为 1。其他所有元素都被初始化为零。你也可以用这种方法将大数组初始化为零：\n\
  \n```cpp\nint nScores[100] = {0};\n```\n\n这不仅声明了数组，还将数组中的每个元素都初始化为零。\n\n同样，如果你有一个初始化列表，就不需要提供数组大小——C++\
  \ 会直接计算列表中的元素个数，并将数组设置为该大小：\n\n```cpp\nint nCount[] = {1, 2, 3, 4, 5};\n```\n\n\
  这声明 `nCount` 的大小为 5 个元素，因为初始化列表中有这么多个值。\n\n![remember.eps](img/remember_fmt.png)\
  \ 数组用于存储少量到中等量的数据。（实际上大量的数据需要某种数据库。）到目前为止，最常见的数组类型是字符数组，它是下一章的主题。\n\n## 第 16 章\n\
  \n# 字符数组\n\n## 本章内容\n\n- 引入空终止字符数组\n- 创建一个 ASCIIZ 数组变量\n- 检查两个 ASCIIZ 操作示例程序\n-\
  \ 复习一些常用的内置 ASCIIZ 库函数\n\n在第 15 章中，引入了数组的概念，示例程序将值收集到一个整数数组中，然后将其传递给一个函数进行显示，并给另一个独立函数计算平均值。然而，尽管整数数组很有用，但最常见的数组类型绝对是字符数组。具体来说，就是被称为\
  \ ASCIIZ 的字符数组，它是本章的主题。\n\n## ASCII-零字符数组\n\n数组有一个固有的问题：你永远无法通过观察数组就知道其中实际存储了多少个值。\n\
  \n在第 15 章中，程序分配了 100 个值，但并不意味着用户实际上输入了那么多。知道数组的大小告诉你它能容载多少，而不是它实际存储了多少。跟踪数组中的数据本质上有两种：\n\
  \n- **在独立变量中维护数值计数。** 这是 `ArrayDemo` 使用的技术。程序使用 `nCount` 来跟踪。\n- **在数组中使用特殊值。**\
  \ 这是 C++ 使用的技术。\n\n空字符 是数值值为零的字符。它用于标记字符串的结束。C 和 C++ 的设计者非常喜欢这个特性，将其定为字符串的标准。他们甚至给它起了一个名字：ASCIIZ。\n\
  \n空字符还有另一个优势。它是在比较表达式（如循环或 if 语句中）中唯一被视为假的字符。\n\n![remember.eps](img/remember_fmt.png)\
  \ 记得第 9 章，空为假。\n\n这使得编写处理 ASCIIZ 字符串的循环变得更容易，如下。\n\n## 声明和初始化 ASCIIZ 数组\n\n如下可以声明一个包含我名字的\
  \ ASCIIZ 字符数组：\n\n```cpp\nchar szMyName[8] = {'S', 't', 'e', 'p', 'h', 'e', 'n',\
  \ '\\0'};\n```\n\n实际上，8 是多余的。C++ 足够智能可以数初始化字符串中的字符个数并将数组设置为那么大。因此，以下代码与上一个示例完全等：\n\
  \n```cpp\nchar szMyName[] = {'S', 't', 'e', 'p', 'h', 'e', 'n', '\\0'};\n```\n\n\
  这种方法的唯一问题是它非常笨拙。我输入的字符比组成我名字的七个字符要多得多。（我名字的每个字符大约都要输入五个按键——这开销太大。）ASCIIZ 字符串在 C++\
  \ 中非常常见，以至于语言提供了一种简便方案：\n\n\n\n\n\n```cpp\nchar szMyName[] = \"Stephen\";\n```\n\
  \n这两个初始化语句是完全等价的。事实上，双引号包含的字符串无非以空字符终止的常量字符数组。\n\n![remember.eps](img/remember_fmt.png)\
  \ 字符串 \"Stephen\" 由八个字符组成 —— 不要忘记算上末尾的空字符。\n\n### 示例\n\n让我们来看一个显示字符串的简单例子。你现在已经知道\
  \ C++ 能够很好地显示 ASCIIZ 字符串，但假设它不能呢。一个用于显示字符串的函数应该什么样？下面的 `DisplayASCIIZ` 程序展示了一个示例：\n\
  \n```cpp\n//\n//  DisplayASCIIZ - 逐字符显示 ASCIIZ 字符串\n//                  作为 ASCIIZ\
  \ 操作的示例\n//\n\n#include <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing\
  \ namespace std;\n\n// displayString - 逐字符显示 ASCIIZ 字符串\nvoid displayString(char\
  \ szString[])\n{\n    for(int index = 0; szString[index] != '\\0'; index++)\n  \
  \  {\n        cout << szString[index];\n    }\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    char szName1[] = {'S', 't', 'e', 'p', 'h', 'e', 'n',\
  \ '\\0'};\n    char szName2[] = \"Stephen\";\n    cout << \"Output szName1: \";\n\
  \    displayString(szName1);\n    cout << endl;\n\n    cout << \"Output szName2:\
  \ \";\n    displayString(szName2);\n    cout << endl;\n\n    // 在程序终止前等待用户准备好\n\
  \    // 以允许用户看到程序结果\n    cout << \"Press Enter to continue...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n\n    return 0;\n}\n```\n\n`displayString()` 函数是这个演示程序的关键。该函数使用变量\
  \ `index` 遍历传递给它的字符数组。然而，它并没有依赖于一个包含数组字符数量的独立变量，而是一直循环直到 `szString[index]` 处的字符是空字符\
  \ `'\\0'` 为止。只要当前字符不是空字符，循环就会将其输出到显示器上。\n\n`main()` 函数创建了我名字的两个版本：首先使用离散字符创建 `szName1`，然后使用快捷方式\
  \ \"Stephen\" 创建 `szName2`。随后，该函数使用 `displayString()` 函数显示两个字符串，这既是为了证明该函数有效，也是为了演示这两个字符串的等效性。\n\
  \n程序的输出如下：\n\n```text\nOutput szName1: Stephen\nOutput szName2: Stephen\nPress Enter\
  \ to continue …\n```\n\n注意，`szName1` 和 `szName2` 的显示完全相同（因为它们是同一个）。\n\n## 查看一个更详细的示例\n\
  \n显示一个字符字符串非常简单。那么稍微难一点的例子呢？下面的程序拼接了两个它从键盘读取的字符串。\n\n![remember.eps](img/remember_fmt.png)\
  \ `concatenate`（拼接）两个字符串意味着将其中一个字符串接到另一个字符串的末尾。例如，将 \"abc\" 与 \"DEF\" 拼接的结果是 \"\
  abcDEF\"。\n\n在检查程序之前，思考一下你如何将一个名为 `szSource` 的字符串接到另一个名为 `szTarget` 的字符串末尾。\n\n\
  首先，你需要找到 `szTarget` 字符串的末尾（参见图 16-1 顶部）。一旦完成，你就一个一个地从 `szSource` 拷贝字符到 `szTarget`\
  \ 中，直到到达 `szSource` 字符串的末尾（如图 16-1 底部所示）。确保结果末尾有一个空字符，你就大完成了。\n\n![9781118823873-fg1601.tif](img/9781118823873-fg1601_fmt.png)\n\
  图 16-1：为了拼接，函数必须 (a) 找到目标字符串的终止空字符，然后 (b) 从源拷贝字符到目标，直到到达源的终止空字符。这正是 `ConcatenateString`\
  \ 示例中 `concatenateString()` 函数的工作方式。\n\n```cpp\n//\n// ConcatenateString - 通过实现拼接函数\n\
  //                     来演示 ASCIIZ 字符串的操作\n\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\n// concatenateString - 将一个字符串拼接到\n\
  //                    另一个的末尾\nvoid concatenateString(char szTarget[], const char\
  \ szSource[])\n{\n    // 首先找到目标字符串的末尾\n    int nT;\n    for(nT = 0; szTarget[nT]\
  \ != '\\0'; nT++)\n    {\n    }\n    // 现在将源字符串的内容拷贝到\n// 目标字符串，从 'nT' 开始\n    for(int\
  \ nS = 0; szSource[nS] != '\\0'; nT++, nS++)\n    {\n        szTarget[nT] = szSource[nS];\n\
  \    }\n    // 为 szTarget 添加终止符\n    szTarget[nT] = '\\0';\n}\n\nint main(int nNumberofArgs,\
  \ char* pszArgs[])\n{\n    // 提示用户\n    cout << \"This program accepts two strings\\\
  n\" << \"from the keyboard and outputs them\\n\" << \"concatenated together.\" <<\
  \ endl;\n\n    // 输入两个字符串\n    cout << \"Enter first string: \";\n    char szString1[256];\n\
  \    cin.getline(szString1, 256);\n    cout << \"Enter the second string: \";\n\
  \    char szString2[256];\n    cin.getline(szString2, 256);\n\n    // 现在将一个接到另一个的末尾\n\
  \    cout << \"Concatenate first string onto the second\" << endl;\n    concatenateString(szString1,\
  \ szString2);\n\n    // 并显示结果\n    cout << \"Result: <\" << szString1 << \">\" <<\
  \ endl;\n\n    // 在程序终止前等待用户准备好\n    // 以允许用户看到程序结果\n    cout << \"Press Enter to\
  \ continue...\" << endl;\n    cin.ignore(10, '\\n');\n    cin.get();\n\n    return\
  \ 0;\n}\n```\n\n`concatenateString()` 函数接受两个字符串，`szTarget` 和 `szSource`。它的目标是将 `szSource`\
  \ 接到 `szTarget` 的末尾。\n\n![warning.eps](img/warning_fmt.png) 该函数假设 `szTarget` 数组足够大，能够容纳拼接后的两个字符串。它没有办法检查是否有足够的空间。（关于这一点在本章稍后会详细介绍。）\n\
  \n![tip.eps](img/tip_fmt.png) 注意目标参数先传递，源参数后传递。这个顺序看起来可能是反向的，但其实并不重要——任何一个参数都可以是源或目标。这只是\
  \ C++ 的一种约定，即目标在前。\n\n在第一个 `for` 循环中，函数通过递增索引 `nT` 来遍历 `szTarget`，直到 `szTarget[nT]\
  \ == '\\0'`，即 `nT` 指向终止空字符。这对应于图 16-1 顶部的情况。\n\n该函数随后进入第二个循环，在该循环中，它从 `nT` 开始向前移动并将\
  \ `szSource` 的每个字符拷贝到 `szTarget` 中。这对应于图 16-1 的底部。\n\n这个例子展示了在 `for` 循环中使用逗号运算符是合理的这种情况。\n\
  \n由于 `for` 循环在拷贝 `szSource` 的终止字符之前就结束了，函数在返回之前必须为结果添加空字符。\n\n`cin >> string;` 表达式在第一个空白处停止输入。示例程序中\
  \ `getline()` 函数像 `cin >> string;` 一样从键盘读取输入，但它读取到换行符为止的整行。它返回的字符字符串中不包含换行符。不要担心\
  \ `getline()` 调用的奇怪语法——我会在第 23 章 中介绍它。\n\n\n\n\n输入第一个字符串：`String 1`\n\n输入第二个字符串：`STRING\
  \ 2`\n\n将第一个字符串拼接到第二个字符串上\n\n结果：`<String 1STRING 2>`\n\n按回车继续 …\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 注意 `concatenateString()` 的第二个参数实际上声明为 `const char[]`（读作“常量字符的数组”）。这是因为该函数不会修改源字符串。将其声明为常量字符数组允许你像下面的调用那样，传递一个常量字符串给该函数：\n\
  \n```\nconcatenateString(szString, \"The End\");\n```\n\n### 击败黑客\n\n在之前的示例程序中的\
  \ `concatenateString()` 函数是如何知道 `szTarget` 中是否有足够的空间同时容纳源字符串和拼接后的目标字符串的呢？答案很简单：它并不知道。\n\
  \n这是一个严重的漏洞。如果用户在按下回车之前输入了足够多的字符，他可能会覆盖大区域的数据甚至代码。事实上，这种类型的*固定缓冲区溢出*漏洞*是黑客通过浏览器控制\
  \ PC 并植入病毒代码的方法之一。\n\n在接后的修正版本中，`concatenateString()` 接受一个额外的参数：`szTarget` 数组的大小。该函数检查索引\
  \ `nT` 与该数字，以确保它不会写入目标数组范围之外。\n\n该程序在在线材料中显示为 `ConcatenateNString`：\n\n```cpp\n\
  // concatenateString - 将一个字符串拼接到另一个\n//                     字符串的末尾（不要超过\n//    \
  \                 nTargetSize）\nvoid concatenateString(char szTarget[],\n      \
  \                 int nTargetSize,\n                       const char szSource[])\n\
  {\n    // 首先找到目标字符串的结尾\n    int nT;\n    for(nT = 0; szTarget[nT] != '\\0'; nT++)\n\
  \    {\n    }\n    // 现在将源字符串的内容拷贝到\n    // 目标字符串中，从 'nT' 开始，但不要\n    // 超过 nTargetSize\
  \ 个元素 (- 1 是为了\n    // 为终止空字符留出空间)\n    for(int nS = 0;\n          nT < (nTargetSize\
  \ - 1) && szSource[nS] != '\\0';\n          nT++, nS++)\n    {\n        szTarget[nT]\
  \ = szSource[nS];\n    }\n    // 向 szTarget 添加终止符\n    szTarget[nT] = '\\0';\n}\n\
  ```\n\n函数的第一部分与之前完全相同，通过遍历 `szTarget` 来寻找终止空字符。区别在于第二个循环。这个 `for` 循环包含了两个终止条件。如果满足以下任一条件，将退出循环：\n\
  \n- `szSource[nS]` 是空字符，意味着你已经到达 `szSource` 的最后一个字符。\n- `nT` 大于或等于 `nTargetSize\
  \ - 1`，意味着你已经耗尽 `szTarget` 中的可用空间 (- 1 是因为你必须为结尾的终止空字符留出空间）。\n\n这个额外的检查虽然烦人，但对于避免溢出数组并产生可能以奇怪神秘的方式崩溃的程序是必要的。\n\
  \n### 我真的需要做所有这些工作吗？\n\nC++ 语言本身对字符串操作提供的并不多。幸运的是，标准库包含了许多处理这些字符串的函数，可以省去你自己编写它们的麻烦。表格\
