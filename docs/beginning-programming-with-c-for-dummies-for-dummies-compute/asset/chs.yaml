  \ `test expression` 等同于 `true`（这是唯一的情况）。\n\n## 逗号运算符 (Comma Operator)\n\n逗号运算符允许在一个表达式中包含多个表达式。在\
  \ `for` 循环中，它常用于 `setup` 和 `increment` 部分。\n\n例如：\n\n```cpp\nfor (int i = 0, j =\
  \ 10; i < j; i++, j--)\n{\n    // 循环体\n}\n```\n\n在这个例子中，`setup` 部分同时初始化了 `i` 和 `j`。`increment`\
  \ 部分则依次执行 `i++` 和 `j--`。\n\n注意，逗号运算符的优先级非常低，这意味着它会最后被计算。\n\n\n\n\n实际上，这个程序的输出有点很有意思：无论你输入什么，随着\
  \ `nLower` 从 1 开始增加，乘积的值起初会迅速增长。然而，曲线很快就会变得平缓，并渐近地趋向于范围中间的最大值，然后开始下降。乘积的最大值总是出现在\
  \ `nLower` 和 `nUpper` 相等的时候。\n\n我本可以在不使用逗号运算符的情况下，让之前的 `for` 循环正常工作吗？完全可以。我可以将 `nLower`\
  \ 或 `nUpper` 其中一个变量从 `for` 循环中取出，并将它们作为独立的变量处理。考虑以下代码片段：\n\n```cpp\nnUpper = nTarget;\n\
  \nfor(int nLower = 1; nLower <= nTarget; nLower++)\n{\n    cout << nLower << \"\
  \ * \"\n        << nUpper << \" equals \"\n        << nLower * nUpper << endl;\n\
  \    nUpper--;\n}\n```\n\n这个版本的效果同样很好。\n\n![remember.eps](img/remember_fmt.png)\
  \ `for` 循环无法做任何 `while` 循环不能做的事情。事实上，任何 `for` 循环都可以转换为等效的 `while` 循环。然而，由于其紧凑性，你会更多地看到\
  \ `for` 循环。\n\n到本章为止，所有的程序都是一个单一的整体，从 `main()` 之后的左括号一直延伸到对应的右括号。这对于小型程序来说没问题，但如果你能将程序拆分成更小的、可以单独消化的部分，那就太酷了。这正是下一章关于函数的目标。\n\
  \n# 第 11 章：函数，我宣布！\n\n## 本章内容\n\n- ![arrow](img/arrow.png) 将程序拆分为函数\n- ![arrow](img/arrow.png)\
  \ 编写和使用函数\n- ![arrow](img/arrow.png) 从函数返回值\n- ![arrow](img/arrow.png) 向函数传递值\n\
  - ![arrow](img/arrow.png) 提供函数原型声明\n\n你在本章之前看到的程序都足够小、足够简单，到你可以用一串指令写完其中任何一个。当然，虽然有使用\
  \ `if` 语句的分支，以及使用 `while` 和 `for` 循环的循环，但整个程序都在一个地方，供大家查看。\n\n现实世界的程序通常不是那样的。处理现实世界复杂性的程序通常规模太大，无法用单块块\
  \ C++ 指令来编写。在 C++ 中，现实世界的程序被拆分成称为 `functions` 的模块。本章将向你介绍函数的奇妙世界。\n\n## 将你的问题拆分为函数\n\
  \n即使是第 1 章中的“换轮胎程序”也太大，无法写在一个块中。它只解决了拆卸螺母的问题。它甚至没有触及顶车、拆轮子、取出备胎等问题。\n\n事实上，假设我将拆卸螺母的代码放入一个我起\
  \ Simple 极其狡猾名字的模块中，比如 `RemoveLugNuts()`。（我加上括号是为了符合 C++ 语法。）我可以为其他函数打包类似的模块。\n\n\
  用于换轮胎的最终生成的顶层模块可能如下所示：\n\n1. 拿取备胎；\n2. `RaiseCar()`；\n3. `RemoveLugNuts()`； // 我们知道它是做什么的\n\
  4. `ReplaceWheel()`；\n5. `AttachLugNuts()`； // `RemoveLugNuts()` 的反操作\n6. `LowerCar()`；\n\
  \n只有第一条语句实际上是用“换轮胎语言”编写的指令。剩余的每条语句都是某处模块的引用。这些模块由用“换轮胎语言”编写的语句序列组成（包括对其他更简单模块可能的引用）。\n\
  \n想象一下这个程序是如何执行的：换轮胎处理器从语句 1 开始。首先，它看到简单的指令“拿取备胎”，它毫无怨言地执行了（它总是完全按照你要求它做的去做）。然后它继续到语句\
  \ 2。\n\n然而，语句 2 说：“记住你现在所在的位置，去找到名为 `RaiseCar()` 的指令集并执行它们。一旦你在那里完成，返回这里获取进一步的指令。”同样地，语句\
  \ 3 到 6 也引导着那个友好的、具有机械倾向的处理器去往不同的指令集。\n\n## 理解函数为什么有用\n\n将将复杂问题拆分为更简单的函数有几个原因。早期编程语言引入函数机制的原始目的是为了“代码重用”这一圣杯。这个想法是创建可以在多个程序中重用的函数。例如，`factorial`（阶乘）是一个常见的数学过程。如果我将\
  \ `Factorial` 程序重写为一个函数，将来我就可以从任何需要计算阶乘的程序中调用它。这种重用形式允许代码被易地复用——从不同的程序，也可以从同一个程序的不同区域。\n\
  \n然而，一旦引入了函数机制，人们发现将大问题拆分为更简单、更小的问题会带来进一步的优势。最大的优势与一个人一次能思考的事情的数量有关。这通常被称为“七加减二”规则。这是一个人一次能在脑海中保持活跃状态的数量。几乎每个人都能在活跃内存中保持至少五个对象，但极少有人能同时在意识中保持超过九个对象处于活跃状态。\n\
  \n毫无疑问，你可能已经注意到了，在编写 C++ 代码时有很多细节需要担心。当你编写 C++ 代码时，随着规模的增加，很快就会超过九个对象的限制。这种函数很难理解——因此难以编写和正确运行。事实证明，以高层功能来思考顶层程序要容易得多，正如我在本章开始的换轮胎例子中所。\n\
  \n## 编写和使用函数\n\n像很多事物一样，通过示例理解函数最好。以下代码片段显示了创建和调用函数的最简单示例：\n\n```cpp\nvoid someFunction()\n\
  {\n    // 做一些事情\n    return;\n}\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n    // 做一些\n    // 现在调用 someFunction()\n    someFunction();\n    // 控制返回后继续\n\
  }\n```\n\n这个示例包含了创建和调用函数所需的所有元素：\n\n1. **声明**：第一部分是函数的*声明*：函数名称前面带有一个类型，后面跟着一对圆括号。在本例中，函数名称是\
  \ `someFunction()`，它的返回类型是 `void`。（关于最后部分的含义，将在本章的返回东西”部分进行解释。）\n\n2. **定义**：函数的声明之后是它所做什么的*定义*，也称为函数的*体*。函数体总是以左括号开始，以右括号结束。函数体内的语句与循环或\
  \ `if` 语句中的语句完全一样。\n\n\n\n\n\n3. **返回：** 函数体包含零个或多个 `return` 语句。`return` 将控制权返回到函数调用点之后的位置。如果控制权到达函数体的最后一个闭合括号，则控制权会自动返回。\n\
  \n4. **调用：** 通过调用函数名后跟左括号和右括号来调用函数。\n\n控制流如图图 11-1 所示。\n\n![9781118823873-fg1101.tif](img/9781118823873-fg1101_fmt.png)\n\
  \n图 11-1：调用函数将控制权传递给模块。控制权返回到调用点之后的位置。\n\n### 返回值\n\n函数通常会向调用者返回一个值。有时这是一个计算出的值——例如，`factorial()`\
  \ 函数可能会返回一个数的阶乘。有时这个值是关于执行情况的指示——这通常被称为`错误返回`（error return）。因此，如果一切顺利，函数可能会返回零；如果在函数执行过程中发生任何错误，则返回非零值。\n\
  \n要从函数返回值，你需要进行两处更改：\n\n1. 将 `void` 替换为你打算返回的值的类型。\n2. 将你希望函数返回的值放置在 `return` 关键字之后。如果返回类型不是\
  \ `void`，C++ 不允许通过运行到最后一个闭合括号来从函数返回。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 关键字 `void` 是 C++ 语言中表示“无”的意思。因此，声明返回类型为 `int` 的函数返回一个整数。声明返回类型为 `void` 的函数不返回任何内容。\n\
  \n### 复习示例\n\n以下 `FunctionDemo` 程序使用 `sumSequence()` 函数对用户从键盘输入的系列数字求和。该函数被反复调用，直到用户输入长度为零的序列。\n\
  \n```cpp\n//\n// FunctionDemo - 展示如何使用函数\n//               来简化程序的逻辑。\n//\n#include\
  \ <cstdio>\n#include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\n\
  //\n// sumSequence() - 返回用户输入的一系列数字的和\n//               当用户输入负数时，\n//          \
  \     退出循环。\nint sumSequence()\n{\n    // 创建一个变量，并在其中累加\n    // 用户输入的数字\n    int\
  \ nAccumulator = 0;\n    for(;;)\n    {\n        // 从用户处读取另一个值\n        int nValue;\n\
  \        cout << \"Next: \";\n        cin >> nValue;\n        // 如果 nValue 为负数则退出\n\
  \        if (nValue < 0)\n        {\n            break;\n        }\n        // 将输入的值加到累加值中\n\
  \        nAccumulator += nValue;\n    }\n    // 将累加的值返回给调用者\n    return nAccumulator;\n\
  }\n\nint main(int nNumberofArgs, char* pszArgs[])\n{\n    cout << \"此程序对数字序列求和。\\\
  n\"\n         << \"输入一系列数字。输入负\\n\"\n         << \"数会导致程序打印\\n\"\n         << \"\
  总和并重新开始一个新\\n\"\n         << \"序列。\"\n         << \"连续输入两个负数以结束\\n\"\n         <<\
  \ \"程序。\" << endl;\n\n    // 在循环中从用户处获取输入\n    // 直到他输入负数为止\n    for(;;)\n    {\n\
  \        // 累加序列\n        int nSum = sumSequence();\n        // 如果和为零...\n     \
  \   if (nSum == 0)\n        {\n            // ...则退出程序\n            break;\n   \
  \     }\n        // 显示结果\n        cout << \"Sum = \" << nSum << endl;\n    }\n \
  \   // 在终止前等待用户准备好\n    // 以允许用户看到结果\n    cout << \"按回车键继续...\" << endl;\n    cin.ignore(10,\
  \ '\\n');\n    cin.get();\n    return 0;\n}\n```\n\n首先，关注 `main()` 程序。在向用户输出详细说明指令后，程序进入了一个\
  \ `for` 循环。![remember.eps](img/remember_fmt.png) 条件表达式为空（如 `for(;;)`）的 `for` 循环除非循环内部某些某些导致控制权退出（或者地狱冻结），否则它将无限循环。该循环中第一行非注释代码是：`int\
  \ nSum = sumSequence();`。该表达式将控制权传递给 `sumSequence()` 函数。一旦控制权返回，声明语句将使用 `sumSequence()`\
  \ 返回的值来初始化 `nSum`。函数 `sumSequence()` 首先将 `nAccumulator` 初始化为零。然后它提示用户从键盘输入值。如果数字不是负数，它会被加到\
  \ `nAccumulator` 的值中，并在循环中提示用户输入另一个值。用户一输入负数，函数就会跳出循环并将 `nAccumulator` 中累加的值返回给调用者。\n\
  \n以下是 `FunctionDemo` 的示例运行：\n此程序对数字序列求和。输入一系列数字。输入负数会导致程序打印总和并重新开始一个新序列。连续输入两个负数以结束。\n\
  Next: 5\nNext: 15\nNext: 20\nNext: -1\nSum = 40\nNext: 1\nNext: 3\nNext: 4\nNext:\
  \ -1\nSum = 10\nNext: -1\n按回车键继续...\n\n### 向函数传递参数\n\n只返回值的函数的价值是有限的，因为通信是单向的——从函数到调用者。双向通信需要函数参数，我会讨论。\n\
  \n### 带参数的函数\n\n函数参数是在调用期间传递给函数的变量。以下 `FactorialFunction` 将之前的阶乘运算转换为函数：\n\n\n\n\
  \n\n函数可以通过逗号分隔参数来包含多个参数。因此，以下函数返回了两个整数参数的乘积：\n\n```cpp\nint product(int nValue1,\
  \ int nValue2)\n{\n    return nValue1 * nValue2;\n}\n```\n\n### 暴露 `main()`\n\n\
  现在可以揭示真相了：我们标准模板中的“关键字” `main()` 仅仅是一个函数——尽管它是一个带有奇怪参数的函数，但它终究是一个函数。\n\n当构建程序时，C++\
  \ 会添加一些模板代码（boilerplate code），这些代码会在你的程序获得控制权之前执行。这些代码设置了程序运行的环境。例如，这些模版代码会打开默认的输入和输出通道，并将它们绑定到\
  \ `cin` 和 `cout`。\n\n在建立环境后，C++ 模版代码会调用 `main()` 函数，从而开始执行你的代码。当你的程序结束时，它会从 `main()`\
  \ 返回。这使得 C++ 模版代码能够在终止程序并将控制权交还给操作系统之前，清理一些工作。\n\n## 定义函数原型声明\n\n之前的程序示例比看起来的要复杂得多。以第二个程序\
  \ `FactorialFunction` 为例。在构建过程中，C++ 编译器扫描了该文件。当它遇到 `factorial()` 函数时，它会在某个内部符号表中记录该函数的扩展名称和它的返回类型。这就是为什么编译器在我稍后在\
  \ `main()` 中调用 `factorial()` 函数时，能够理解我在表达什么——它看到我正尝试调用一个函数，并说：“让我看看我的定义函数表中找一个叫\
  \ `factorial()` 的函数。啊，这儿有一个！”\n\n在这种情况下，函数已经定义，且参数的类型和数量完全匹配，但情况并不总是如此。如果我调用该函数时使用的不是整数，而是一个可以转换为整数的类型呢？假设我像下面所示调用该函数：\n\
  \n```cpp\nfactorial(1.1);\n```\n\n这并不是一个完美的匹配，`1.1` 不是一个整数，但 C++ 知道如何将 `1.1` 转换为整数。因此它*可以*进行转换，并使用\
  \ `factorial(int)` 来完成调用。问题是，它*真的*这样做了吗？\n\n答案是“是的”。在某些情况下，C++ 会生成一个警告，让你知道它正在做什么，但它通常会对参数进行必要的类型转换，以便使用它已知的函数。\n\
  \n**注意：** 我知道我还没有讨论不同的变量类型（我将在第 14 章中讨论），但我所提出的观点是相当通用的。你也将在第 14 章中看到如何避免由自动类型转换引起的警告。\n\
  \n那么像下面的调用又是怎样的：\n\n```cpp\nfactorial(1, 2);\n```\n\n没有任何转换可以允许 C++ 丢弃一个参数并使用 `factorial(int)`\
  \ 函数来满足这次调用，因此 C++ 在这种情况下会生成错误。\n\nC++ 能够解决此类问题的唯一方法是让它在看到尝试调用函数之前先看到函数声明。这意味着每个函数都必须在使用之前进行声明。\n\
  \n我知道你在想什么（我想是）：C++ 可以没那么懒惰，在放弃并开始生成错误之前，向前查找后面才出现的函数声明，但事实是它并没有这样做。这只是这类问题之一，就像我那辆破车一样；你只能学会与它共处。\n\
  \n那么这意味着你必须在使用所有函数之前先定义它们吗？不是的。C++ 允许你在不带函数体的情况下声明函数，这被称为*原型声明*（prototype declaration）。\n\
  \n原型声明在我在之前提到的表中为该函数创建一个条目。它填补了扩展名称（包括参数的数量和类型）以及返回类型。C++ 将函数的定义（即函数体）留空，直到稍后再处理。\n\
  \n在实践中，原型声明如下所示：\n\n```cpp\n// 原型声明\nint factorial(int nTarget);\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    cout << \"The factorial of 10 is \"\n\
  \         << factorial(10) << endl;\n    return 0;\n}\n\n// factorial(int) 函数的定义；\n\
  // 这满足了我们为上面的原型函数声明\n// 提供定义的承诺\nint factorial(int nTarget)\n{\n    // 从一个初始化为 1\
  \ 的累加器开始\n    int nAccumulator = 1;\n    for (int nValue = 1; nValue <= nTarget;\
  \ nValue++)\n    {\n        nAccumulator *= nValue;\n    }\n    return nAccumulator;\n\
  }\n```\n\n原型声明告诉世界（或者至少是声明之后的那个世界）`factorial()` 接受单个整数参数并返回一个整数。这样，C++ 就可以对比 `main()`\
  \ 中的调用与声明，检查是否需要进行任何类型转换——或者该调用是否可行。\n\n原型声明还代表对 C++ 的一个承诺，将在程序的其他地方提供 `factorial(int)`\
  \ 的完整定义。在这种情况下，`factorial(int)` 的完整定义紧跟在 `main()` 之后。\n\n![tip.eps](img/tip_fmt.png)\
  \ 为模块中的所有函数提供原型声明是一种常见做法。这样你就不必担心它们的定义顺序。我将在下一章中详细讨论这个话题。\n\n# 第 12 章 将程序分为模块\n\n\
  ## 本章内容\n\n- 将程序分解为函数\n- 编写和函数\n- 从函数返回值\n- 向函数传递值\n- 提供函数原型\n\n在第 11 章中，我向展示了如何将复杂问题分解为若干独立的函数；编写和让多个较小的函数工作比编写一个巨大的程序要容易得多。然而，你可能需要在其他应用程序中重用创建的函数。例如，我可以重用第\
  \ 11 章创建的 `factorial()` 函数。\n\n重用此类函数的一种方法是将 `factorial()` 函数的源代码复制粘贴到我的新程序中。但如果我能把它放在单独的文件并在以后链接，就会方便得多。将程序拆分为源模块是本章的主题。\n\
  \n## 分解程序\n\n程序员可以将单个程序拆分为称为模块（modules）的源文件。这些模块由 C++ 编译器分别编译，然后在构建过程中组合以生成单个程序。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 这些模块也被编译专家称为 C++ 编译单元。\n\n将单独编译的模块组合成单个程序的过程被称为链接（linking）。\n\
  \n将程序分解为更易管理的片段有许多优势。首先，将程序分成更小的模块可以缩短编译时间。Code::Blocks 只需要几秒钟就能处理并消化书中的程序。然而，非常大的程序可能需要很长时间。我曾处理过重建需要一整晚时间的项目。\n\
  \n此外，仅仅因为改变了两行代码就重新编译项目中的所有源代码是极其浪费的。更好的做法只重新编译包含更改的模块，然后将其链接到所有未更改的模块中，创建一个包含更改的可执行文件。\n\
  \n\n\n\n\n其次，一个由若干个深思熟虑但准独立的模块组成的程序更容易理解——因此，也更容易编写、测试和调试——每个模块代表一组函数的逻辑分组。一个包含了程序可能用到的所有函数的庞型单一源模块很快就会变得难以维护。\n\
  \n第三是备受推崇的重用魔力。一个包含可重用函数的模块（这些函数可以链接到未来的程序中）更容易编写文档和维护。模块中为了修复某些错误而所做的更改会迅速合并到使用该模块的其他可执行文件中。\n\
  \n最后，是团队协作的问题。两个程序员无法同时处理同一个模块（至少效果不佳）。一种更简单的方法是将一个模块中包含的一组函数分配给一个程序员，同时将另一个模块中的另一组函数分配给第二个程序员。当模块准备好进行测试时，可以将它们链接在一起。\n\
  \n## 拆分并没有那么困难\n\n我无法真的在这样的书中书中包含一个大型程序……嗯，我可以包含，但将没有足够的空间留给其他内容了。相反，我使用第 11 章中的\
  \ `FactorialFunction` 演示作为我的大型程序示例。在本节中，我创建了 `FactorialModule` 项目，将程序分为几个源模块。为了实现这一点，我执行了以下步骤：\n\
  \n1. 创建 `FactorialModule` 项目。\n   此过程与书中目前为止创建的任何其他项目文件并无二致。\n2. 创建 `Factorial.cpp`\
  \ 文件以包含阶乘函数。\n3. 创建 `Factorial.h` 头文件（无论它是什么），供所有想要调用的模块使用。\n4. 更新 `main.cpp` 以使用\
  \ `factorial()` 函数。\n\n### 创建 Factorial.cpp\n\nCode::Blocks 创建的初始控制台应用程序项目只有一个源文件，`main.cpp`。下一步是创建第二个源文件，其中包含阶乘函数。\n\
  \n按照以下步骤创建包含 `factorial()` 函数的 `factorial.cpp`：\n\n1. **选择 文件(File)⇒新建(File)。**\n\
