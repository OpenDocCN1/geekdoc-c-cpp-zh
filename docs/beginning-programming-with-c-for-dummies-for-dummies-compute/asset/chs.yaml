  \   图 12-1：新文件向导帮助你向项目添加源文件。\n2. **选择 C/C++ Source 然后点击 Go(Go)。**\n   屏幕上弹出一个框，显示警告，提示你即将进入神秘且危险的源文件向导。\n\
  3. **点击 下一步(Next)。**\n   这将打开源文件向导。\n4. **点击“带有完整路径的文件(Filename with Full Path)”旁边的\
  \ …。**\n   出现一个文件打开对话框，如果你想将源文件放在不同的目录，可以导航到不同的文件夹。但不要让它变得比必要的复杂。\n5. **输入 `factorial.cpp`\
  \ 作为源文件名并点击 保存(Save)。**\n6. **你希望将此文件添加到你创建的所有可执行文件中，因此为构建目标选择 全部(All)。**\n   当你完成后，对话框看起来应该像图\
  \ 12-2。\n   ![9781118823873-fg1202.tif](img/9781118823873-fg1202_fmt.png)\n   图\
  \ 12-2：C/C++ Source File 对话框让你输入新模块的名称 `factorial.cpp`。\n7. **点击 完成(Finish)以创建 `Factorial.cpp`\
  \ 并将其添加到项目。**\n   ![remember.eps](img/remember_fmt.png) 项目文件包含了构建你的程序所需的所有源文件列表。\n\
  8. **如下所示更新 Factorial.cpp：**\n\n```cpp\n// factorial -此模块包含了阶乘函数\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\nusing namespace std;\n#include \"factorial.h\"\
  \n\n// factorial - 返回参数的阶乘\n// 对于无效参数（如负数）返回 1。\nint factorial(int nTarget)\n{\n\
  \    // 从初始化为 1 的累加器开始\n    int nAccumulator = 1;\n    for (int nValue = 1; nValue\
  \ <= nTarget; nValue++)\n    {\n        nAccumulator *= nValue;\n    }\n    return\
  \ nAccumulator;\n}\n```\n\n前四行是用于所有 C++ 源文件的标准模板的一部分。下一行是 `factorial.h` 头文件，我将在本章稍后详细讨论它。随后是如第\
  \ 11 章中出现的 `factorial()` 函数。\n![warning.eps](img/warning_fmt.png) 头文件不遵循与 C++ 相同的规则。例如，与\
  \ C++ 中的其他语句不同，`#include` 必须从第 1 列开始且不需要分号。\n![warning.eps](img/warning_fmt.png)\
  \ 不要尝试编译 `factorial.cpp`，因为你还没有创建 `factorial.h`。\n\n### 创建 #include 文件\n\n该过程的下一步是创建一个头文件。好了，什么是头文件？\n\
  \n正如我在第 11 章中所述的，原型声明通过提供参数的数量、类型以及返回值的类型来描述要调用的函数。你调用的每个函数必须在调用之前的某处有一个原型声明。\n\n\
  手动为你想要使用的每个函数列出原型声明是可能的，但幸运的是这并不是。相反，C++ 允许创建函数的“笨蛋”创建一个包含函数原型声明的头文件。该文件可以被包含在调用这些函数的模块源文件中。\n\
  \n包含这些原型的方法（至少）有两种。一种方法是复制头文件的内容并将其粘贴到进行调用的模块中。然而，这不是一个好主意。此外，如果头文件中的任何原型声明发生了更改，程序员将遍历每个使用头文件的地方，删除旧的并重新粘贴新的。\n\
  \n与其这样做，C++ 包含了一个预处理器，它理解非常少的指令。这些指令都以井号（#）开头，后面紧跟着命令。（预处理器指令也在行尾结束且不需要分号。）\n\n\
  最常见的预处理器指令是 `#include \"filename.h\"`。该命令将 `filename.h` 的内容复制到 `#include` 处，创建一个所谓的*中间翻译文件*。预处理器随后将此中间翻译文件传递给\
  \ C++ 编译器。这一过程在图 12-3 中图形化显示。\n\n![9781118823873-fg1203.tif](img/9781118823873-fg1203_fmt.png)\n\
  图 12-3：预处理器在 `#include` 命令处插入头文件的内容，然后传递给 C++ 编译器。\n\n### #include 文件\n\nCode::Blocks\
  \ 向导创建头文件非常轻松。只需执行以下步骤：\n\n1. **选择 文件(File)⇒新建(File)。**\n   Code::Blocks 响应并打开图\
  \ 12-1 所示的窗口，与之前一样。这次你正在创建一个头文件。\n2. **选择 Include File 然后点击 Go(Go)。**\n3. **在提示你即将进入头文件向导的下一个窗口中，点击\
  \ 下一步(Next)。**\n4. **点击“带有完整路径的文件(Filename with Full Path)”旁边的 …。**\n   出现一个文件打开对话框。\n\
  5. **输入 `factorial.h` 作为头文件名并点击 保存(Save)。**\n6. **你希望将此文件添加到你创建的所有可执行文件中，因此为构建目标选择\
  \ 全部(All)。**\n   当你完成后，对话框看起来应该像图 12-4。\n\n\n\n\n\n![9781118823873-fg1204.tif](img/9781118823873-fg1204_fmt.png)\n\
  \n图 12-4：C/C++ 头文件对话框允许你输入新包含文件的模块名称，`factorial.h`。\n\n7. **点击“完成”以创建一个如下所示的空包含文件：**\n\
  \n```cpp\n#ifndef FACTORIAL_H_INCLUDED\n\n#define FACTORIAL_H_INCLUDED\n\n#endif\
  \ // FACTORIAL_H_INCLUDED\n```\n\n8. **通过如下所示添加 `factorial()` 函数的原型来编辑该包含文件：**\n\
  \n```cpp\n#ifndef FACTORIAL_H_INCLUDED\n\n#define FACTORIAL_H_INCLUDED\n\nint factorial(int\
  \ nTarget);\n\n#endif // FACTORIAL_H_INCLUDED\n```\n\n9. **点击“文件”->“保存”。**\n\n你完成了！\n\
  \n注意，该包含文件已添加到 Code::Blocks 的“管理”（Management）选项卡中的项目描述中。这表示如果包含文件发生变化，Code::Blocks\
