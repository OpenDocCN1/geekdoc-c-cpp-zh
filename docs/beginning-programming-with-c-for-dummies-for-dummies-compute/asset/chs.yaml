  \ 图标。**\n\n当你第一次执行此操作时，Mac OS 会询问：“你确定要打开它吗？”\n\n7. **选择“在打开此磁盘映像上的应用程序时再次警告”，并点击“打开”。**\n\
  \nCode::Blocks 应该启动并找到通过命令行工具安装的 `gcc` 编译器。\n\n8. **选择 `gcc` 编译器，如图图 2-8 所示。点击“设为默认”，然后点击“确定”继续启动\
  \ Code::Blocks。**\n\nCode::Blocks 打开后会显示一个横幅页，随后在对话框顶部出现一个菜单。\n\n继续下一节，“设置 Code::Blocks”。\n\
  \n![9781118823873-fg0208.tif](img/9781118823873-fg0208_fmt.png)\n\n图 2-8：当你第一次执行\
  \ Code:: Blocks 时，它会自动找到 `gcc` 编译器。\n\n### 设置 Code::Blocks\n\nCode::Blocks 自带的 GNU\
  \ C++ 编译器支持许多选项；所有这些选项都会影响它读取你的程序的方式。对于本书来说，你需要确保设置了其中几个选项。无论你使用的是 Windows、Linux\
  \ 还是 Mac OS，本节的指令说明都是相同的。\n\n1. **如果 Code::Blocks 尚未启动，请启动它。**\n\n在 Windows 中，你可以使用\
  \ Code::Blocks 安装在桌面上的图标。会弹一个与图 2-9 类似的窗口。（此启动界面的细节随操作系统和版本而异。这是版本 13.12 的启动界面。）\n\
  \n2. **从菜单选项中选择设置（Settings）⇒编译器（Compiler）。**\n\n会弹一个与图 2-10 类似的窗口。\n\n3. **从窗口左侧的选项中选择全局编译器设置（Global\
  \ Compiler Settings）。**![9781118823873-fg0209.tif](img/9781118823873-fg0209_fmt.png)\n\
  \n图 2-9：Code:: Blocks 环境的启动界面。\n\n![9781118823873-fg0210.tif](img/9781118823873-fg0210_fmt.png)\n\
  \n图 2-10：编译器设置窗口允许用户调整 C++ 编译器工作方式的细节。\n\n4. **选择编译器标志（Compiler Flags）选项卡。**\n\n\
  此处显示编译器选项。\n\n5. **勾选启用所有编译器警告（Enable All Compiler Warnings）复选框。**\n\n这将导致 GNU C++\
  \ 编译器对它看到的任何可能的问题进行报错。当你初学一种语言时——或者当你已经编程了 30 多年（像我一样），开启所有警告是一个好主意。\n\n6. **勾选让\
  \ g++ 遵循 C++11 ISO C++ 标准（Have g++ Follow the C++11 ISO C++ Language Standard）复选框。**\n\
  \n![tip.eps](img/tip_fmt.png) C++ 标准的最近升级是在 2011 年采用的。这次实现了许多新功能，其中许多超出了本书的范围。然而，这些功能实际上让生活变得更容易，因此你会想要使用它们。勾选此复选框可以使用这些这些扩展。\n\
  \n7. **点击确定。**\n\n设置窗口关闭。\n\n## 测试 Code::Blocks 安装\n\n在本节中，你将构建一个 Code::Blocks 自带的默认程序。该程序的功能只是在屏幕上显示\
  \ Hello, world！但成功构建并运行此程序将验证你已正确安装了 Code::Blocks。\n\n通过双击桌面创建的 Code::Blocks 图标或选择程序（Programs）⇒Code::Blocks⇒Code::Blocks\
  \ 来启动 Code::Blocks。这应该打开一个类似于图 2-9 显示的窗口。\n\n窗口顶部是常用的菜单选项，从文件（File）、编辑（Edit）、视图（View）等开始。右上显示“从这里开始”（Start\
  \ here）的窗口是你到达那里时源代码所在的地方。右下窗口是 Code::Blocks 向用户显示消息的地方。编译器错误信息出现在此区域。左侧标记为管理（Management）的窗口是\
  \ Code::Blocks 跟踪程序文件的地方。它应该是空的。\n\n幸运的是，Code::Blocks 知道如何构建。此外，Code::Blocks 知道如何调试。最后，Code::Blocks\
  \ 知道如何分析。\n\n### 创建项目\n\n1. **选择文件（File）⇒新建（New）⇒项目（Projects），打开图 2-11 所示的窗口。**\n\
  \n这是一个所有类型的列表。选择控制台（Console）。\n\n![9781118823873-fg0211.tif](img/9781118823873-fg0211_fmt.png)\n\
  \n图 2-11：从许多类型中选择控制台应用程序。\n\n2. **选择控制台应用程序并转（Go）。**\n\nCode::Blocks 返回图 2-12 所示显示。此处\
  \ Code::Blocks 为你创建 C 或 C++ 的选项。\n\n3. **选择 C++ 并点击下一步（Next）。**\n\n![9781118823873-fg0212.tif](img/9781118823873-fg0212_fmt.png)\n\
  \n图 2-12：选择 C++ 作为你的语言。\n\nCode::Blocks 打开一个让你输入项目名称和可选子文件夹的对话框。首先，点击小的 ... 按钮创建一个存放项目的文件夹，并导航到工作磁盘的根目录（在\
  \ Windows 机器上可能是 C 或 D）。选择左下角的新建文件夹（Make New Folder）按钮。将新文件夹命名为 Beginning_Programming-CPP。\n\
  \n4. **当你的显示类似于图 2-13 时点击确定。**\n\n存放项目的文件夹不能包含任何空格。此外，路径中的任何文件夹都不应包含空格。这自动排除了将项目放在桌面的情况，因为桌面的路径包含空格。你也应该避免在项目名称中使用空格。你可以使用划线分隔单词。Code::Blocks\
  \ 编译器会对文件名中的空格感到困惑，并产生晦涩且毫无意义的错误。\n\n![9781118823873-fg0213.tif](img/9781118823873-fg0213_fmt.png)\n\
  \n图 2-13：创建文件夹 Beginning_Programming-CPP，并在其中收集 C++ 项目。\n\n现在将项目名称输入为 HelloWorld。注意\
  \ Code:: Blocks 会自动创建一个同名的子文件夹，以包含组成项目的文件。\n\n\n\n\n\n## 5. 当你的显示界面类似于图 2-14 时，点击\
  \ `Next`。\n\n![9781118823873-fg0214.tif](img/9781118823873-fg0214_fmt.png)\n\n图\
  \ 2-14：将你的第一个项目命名为 `HelloWorld`。\n\n## 6. 当 `Code::Blocks` 询问如何设置子文件夹时，你可以接受默认配置，如图\
