  \ 获取优质的 Dummies 在线内容\n\n## 第 21 章\n\n# 什么是对象面向编程？\n\n## 本章\n\n![arrow](img/arrow.png)\
  \ 抽象化细节\n![arrow](img/arrow.png) 将对象面向方法与函数式方法进行对比\n![arrow](img/arrow.png) 分类事物\n\
  \n日常生活中到处都是对象的例子。就在我面前有一把椅子、一张桌子、一台电脑和一个红色的星巴克马克子。我可以毫不费力地根据属性将这些对象分类。例如，马克子是一个容器，它还是一个热绝缘体，所以我可以用它来盛放热东西或冷东西，它还有质量，所以我可以把它当作镇纸或者向狗扔过去。对象面向编程将这种世界观应用于编程中。为了解释我的意思，让我从一个故事开始吧。\n\
  \n### 抽象与微波炉\n\n有时，当我儿子一起看足球时，我会快速做几份玉米片（nachos）。请注意，这并不复杂——我往盘子里倒一些薯片，撒上炸豆泥、奶酪和一波墨西哥辣椒，然后放入微波炉中加热五分钟。要使用使用微波炉，我打开门，把玉米片放在里面，按下面板上的几个按钮，然后按启动。几分钟后，铃声响起告诉我好了。如果我做错了，微波炉会对我蜂鸣且不启动。有时它还会在小显示屏上显示错误信息。\n\
  \n这听起来并不深奥，实际上也并非如此——除非你考虑到为了使用微波炉而*没有*做过的所有事情：\n\n*   我将自己的操作限制在微波炉的前面板上。我不看外壳内部。我不看告诉处理器单元该做什么的源码列表。我不研究贴在外壳内壁上的接线图。\n\
  *   我不会为了让它工作而重写任何代码，或改变微波炉内部的任何东西来让它工作。我用来做玉米片的微波炉和我之前用来加热辣椒狗的微波炉是完全同一个（在我家里除了健康食品什么都没有）。明天它也将是我用来加热\
  \ Malt-O-Meal 麦片时使用的同一个微波炉（假设它没坏的话）。\n*   为了使用微波炉，我并不会考虑微波炉内部可能发生了什么。即使我的职业是设计微波炉的，我在在大赛前做玉米片时，也不可能考虑它是如何工作的。\n\
  \n这些并不是深奥的观察。人类在任何时刻能思考的内容都是有限的。我们倾向于通过抽象掉所有小细节来减少必须处理的事情数量。这使我们能够在与尝试解决的问题相应的细节水平上工作。\n\
  \n**注意：** 在对象面向（OO）术语中，这种细节水平被称为*抽象层次*。\n\n当我做玉米片时，我把微波炉看作一个黑盒。除非它坏了，否则我并不关心那个盒子里发生了什么。只要微波炉运行正常，我就把自己限制在它暴露的界面上。只要通过这个界面，我做的任何事情都不会导致微波炉：\n\
  \n*   进入不一致状态并崩溃（导致我重启）\n*   糟糕，让我的玉米片变成团火焰\n*   更糟糕的是，起火烧了房子\n\n### 程序化的玉米片\n\n\
  假设我让我儿子写一个制作玉米片的算法，使用在第 1 章中更换轮胎的方法。他可能会写出类似“打开一罐豆子，磨一些奶酪，切一些辣椒”之类的代码。对于加热玉米片的部分，他会写类似的“在炉内烹饪直到奶酪融化”。\n\
  \n这种描述直观且完整，但它并不是程序化程序员编写制作玉米片程序的方法。程序化程序员生活在一个没有微波炉等对象的世界里。他们倾向于担心流程图（带有无数函数路径）。在程序化的解决方案中，控制流从我的手指穿过微波炉的前面板，进入其内部。很快，流就会在复杂的逻辑路径中穿行，考虑给电容器充电多久以及是否该响铃了。\n\
  \n在这样的世界上，很难用抽象层次来思考。没有对象可以隐藏复杂性。\n\n### 对象面向玉米片\n\n在制作玉米片的对象面向方法中，我首先识别问题中的对象类型：薯片、豆子、奶酪和烤箱。这些是我必须处理的名词。完成后，我会识别与每个对象相关的动词。接下来，我将仅使用识别出的名词和动词来解决问题。最后，并且仅在此时，我会在软件中实现这些每一个对象。\n\
  \n\n\n\n当我编写对象级代码时，我正处于基础对象的抽象层面进行工作（并思考）。我需要考虑制作一个实用的烤箱，但我还不需要考虑制作墨西哥玉米片（nachos）的过程。毕竟，我微波炉的设计者并没有考虑过我制作零食的具体问题。相反，他们解决的是设计和建造一台实用微波炉的问题。\n\
  \n在我成功地编码并测试了所需的对象后，我就可以提升到下一个抽象层级。我可以开始从制作墨西哥玉米片的层面进行思考，而不是从制作微波炉的层面。在这个阶段，我几乎可以把我儿子的指令直接翻译成\
  \ `C++` 代码。\n\n## 分类与微波炉\n\n抽象概念的关键在于分类。如果我问我儿子：“什么是微波炉？”他可能会说：“它是一个……的烤箱。”如果我接着问：“什么是烤箱？”他可能会回答道：“它是一个……的厨房电器。”我可以一直问下去，在抽象阶梯上不断攀升，直到得出结论：“它是一个东西”，这也是“它是一个对象”的另一种说法。\n\
  \n我儿子理解，我们这个特定的微波炉是被称为“微波炉”这类东西的一个实例。此外，他还认为微波炉只是一种特殊的烤箱，而烤箱反过来又是一种特殊的厨房电器，以此类推。\n\
  \n这些内容的专业说法是：我们的烤箱是 `microwave` 类的 `instance`（实例）。`microwave` 类是 `oven` 类的 `subclass`（子类），而\
  \ `oven` 类是 `microwave` 类的 `superclass`（父类）。\n\n人类会分类。我们世界的一切都被组织进分类法中。我们这样做是为了减少我们需要记忆的事物数量。例如，考虑你第一次看到混合动力汽车。广告称它为“革命性的汽车，与你见过的任何汽车都不同”，但我们都知道并非如此。当然，它的动力系统与传统汽车不同，但它仍然是汽车，因此执行着所有汽车要做的事情：将你和亲属从一个地方运送到另一个地方。它有方向盘、座椅、电机、刹车等。我打赌我甚至不需要帮助就能开一辆。\n\
  \n我不需要让我有限的存储空间被混合动力汽车与其他汽车的所有共同点占满。我只需要记住“混合动力汽车是一种……的汽车”，然后加上那几个混合动力汽车特有的特征即可。汽车是轮式车辆的子类，轮式车辆还有其他成员，如卡车和皮卡。也许轮式车辆是车辆的子类，而车辆包括船只和飞机。以此类推，无限。\n\
  \n## 为什么要这样构建对象？\n\n专门为这一个问题设计和建造一台微波炉，似乎比建造一个独立的、更通用的烤箱对象要容易。假设例如，我建造一台专门用于制作且仅用于制作墨西哥玉米片的微波炉。我不需要给它安装前面板，除了一个\
  \ `START` 按钮。我每次烤墨西哥玉米片的时间都是一样的。我可以省去所有 `DEFROST`（解冻）和 `TEMP COOK`（温度烹饪）之类的废话。微波炉可以很小。它只需要盛一个胖的小盘子。任何额外的立方空间对于墨西哥玉米片来说都是完全的浪费。\n\
  \n尽管如此，假设我完全放弃“微波炉”这个概念。我真正需要的只是烤箱的核心部件。在食谱中，我可以编写让它工作的指令：“把墨西哥玉米片放入盒子里。将红线连接到黑线。注意轻微的嗡嗡声。如果你打算要孩子，不要站得太近。”诸此类内容。\n\
  \n尽管如此，过程化的方法确实存在一些问题：\n\n*   **过于复杂。** 你不希望建造烤箱的细节与制作墨西哥玉米片的细节混合在一起。如果你无法定义这些对象并将它们从细节的泥沼中抽离出来单独处理，你就必须同时处理问题的所有复杂性。\n\
  *   **不灵活。** 如果你需要将微波炉更换为其他类型的烤箱，只要新烤箱的接口与旧的相似，你就应该能够做到。如果没有一个简单且清晰划分的接口，将无法干净地移除一种对象类型并替换为另一种。\n\
  *   **不可复用。** 烤箱被用于制作许多不同的菜肴。你不希望每次遇到新食谱时都创建一个新烤箱。一旦解决了一个问题，在未来的程序中复用该解决方案将是好的。\n\
  \n编写一个通用对象的成本确实更高。建造一台专门为墨西哥玉米片制作的微波炉会更便宜。你可以省去制作墨西哥玉米片所需的昂贵定时器、按钮等。然而，当你已经在多个应用中使用通用对象后，稍微贵一点的类所带来的成本，远大于为每个新应用重复构建廉价但灵活性差的类所产生的成本。\n\
  \n## 自包含类\n\n现在，是时候反思你所学到的东西了。面向对象的编程方法中发生了以下情况：\n\n*   程序员识别解决问题所需的类。（我很清楚我将需要一个烤箱来做像样的墨西哥玉米片。）\n\
  *   程序员创建符合问题要求的自包含类，并且不担心整个应用程序的细节。\n*   程序员使用刚刚创建的类来编写应用程序，而不考虑它们内部是如何工作的。\n\n\
  这种编程模型的一个不可或缺的部分是：每个类都负责自己。\n\n\n\n考虑在 `Savings` 账户类中处理存款的问题。过程化程序通过函数来执行操作。因此，过程化程序可能会创建一个单独的函数，该函数接受指向想要更新的\
  \ `Savings` 账户对象的指针，以及要存款的金额作为参数。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 暂时（目前）不用担心具体如何传递 `Savings` 账户对象的指针。你将在下一章看到更多关于这的内容。\n\n但这并不是现实世界中储蓄账户的工作方式。当我开车去银行窗口，告诉他们我想给我的储蓄账户存款时，出纳员并不会给我一个账本，让我上面记录存款金额并写下新余额。她也不会亲自动手操作。相反，她在某个终端上输入存款金额，然后将该金额放入收银机。机器吐出一张带有新余额的存款单，她将其交给我，一切就此结束了。我们中没有没有人直接触碰银行的账本。\n\
  \n这可能看起来像是一个愚蠢的练习，但请考虑为什么银行不按“过程化的方式”办事。暂时忽略我可能想在汇总前在存款金额末尾多加几个零的诱惑。银行不这样做的原因与我不通过连接和断开箱内部电线来给微波炉供电的原因相同——银行希望对其余额的变化保持严格控制。\n\
  \n这种严谨性也适用于程序员。你晚上可以安心睡去，因为你知道并不是每个程序员都能直接访问银行余额。只有最受信任的程序员才能编写增加和减少银行余额的代码。\n\n\
  为了让 `Savings` 类模拟现实世界中的储蓄账户，它需要拥有自己的活动属性，例如 `deposit()` 和 `withdrawal()`（而且对我来说，还有为了某个不知其所以原因的\
  \ `chargePenalty()`）。只有这样，`Savings` 类才能对其状态负责。\n\n## 创建成员函数\n\n作为类定义一部分函数被称为`成员函数`（`member\
  \ function`）。类内部的数据被称为`数据成员`（`data members`）。成员函数是类的动词；数据成员是名词。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 成员函数也被称为`方法`（`methods`），因为在最初的面向对象语言 Smalltalk 中是这样使用的。`方法`一词在 Smalltalk 中是有意义的，但在\
  \ C++ 中没有特殊含义，只是说起来更容易，而且在对话中听起来更显不凡。我会尽量不让这些冷知识让你感到无聊，但你会在面向对象的派对上听到`方法`这个词，所以你最好习惯它。我会尽量坚持使用`成员函数`术语，但即使是我偶尔也会陷入技术术语。\n\
  \n**注意：** 你到为止看到的不是类成员函数没有特殊名称。当我需要将它们与其成员兄弟区分开来时，我称它们为`非成员函数`（`non-member functions`）。\n\
  \n向类中添加成员函数有三个方面：定义函数、命名函数和调用函数。这样说起来很显而易见。\n\n### 定义成员函数\n\n以下类演示如何在 `Savings`\
  \ 账户类中定义两个关键成员函数：`deposit()` 和 `withdraw()`：\n\n```cpp\n// Savings - 一个简单的储蓄账户类\n\
  class Savings\n{\n  public:\n    int nAccountNumber;\n    double dBalance;\n\n \
  \   // deposit - 向余额存入金额；\n    //           存款必须为正数；返回\n    //           结果余额或出错时返回零\n\
  \    double deposit(double dAmount)\n    {\n      // 不允许负存款 - 那是提取\n      if (dAmount\
  \ < 0)\n      {\n          return 0.0;\n      }\n      // 好的 - 加入余额并返回总额\n     \
  \ dBalance += dAmount;\n      return dBalance;\n    }\n\n    // withdraw - 如果资金充足则执行取款\n\
  \    double withdraw(double dAmount)\n    {\n      if (dBalance < dAmount)\n   \
  \   {\n        return 0.0;\n      }\n      dBalance -= dAmount;\n      return dBalance;\n\
  \    }\n};\n```\n\n![remember.eps](img/remember.png) 成员函数是类的一部分。\n\n### 命名函数\n\n\
  成员函数是类的一部分。类内部的数据被称为`数据成员`（`data members`）。成员函数是类的动词；数据成员是名词。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 成员函数也被称为`方法`（`methods`），因为在最初的面向对象语言 Smalltalk 中是这样使用的。`方法`一词在 Smalltalk 中是有意义的，但在\
  \ C++ 中没有特殊含义，只是说起来更容易，而且在对话中听起来更显不凡。\n\n### 调用函数\n\n作为类定义一部分函数被称为`成员函数`（`member\
  \ function`）。类内部的数据被称为`数据成员`（`data members`）。成员函数是类的动词；数据成员是名词。\n\n\n\n\n调用成员函数的语法看起来像是访问数据成员的语法与调用函数语法的结合体。点运算符（`.`）的右侧看起来像传统的函数调用，但在点符号左侧是一个对象。\n\
  \n当你仔细思考时，这种语法是有意义的。在调用 `s.deposit()` 时，`s` 是要执行 `deposit()` 操作的存款对象。如果你不知道向哪个账户存款，就无法存款。在没有对象的情况下调用成员函数，这比没有对象的情况下引用数据成员更没有意义。\n\
  \n### 在成员函数内部访问其他成员\n\n我明白你的意思了：你对自己说：“没有对对象的引用，你就无法访问成员。没有对对象的引用，你就无法访问成员。你无法……”然后，砰的一声，你豁然了。`Savings::deposit()`\
  \ 看起来恰恰是在做这一点：\n\n```\ndouble deposit(double dAmount)\n{\n    // 不允许负数存款——那是取款\n\
  \    if (dAmount < 0)\n    {\n        return 0.0;\n    }\n    // 好吧——增加余额并返回总额\n\
  \    dBalance += dAmount;\n    return dBalance;\n}\n```\n\n`Savings::deposit()`\
  \ 函数在没有显式引用任何对象的情况下引用了 `dBalance`。这就像那个电视节目：“它们是怎么做到的？”一样。\n\n所以，好吧，到底是怎么样的？你能不能不能在没有对象的情况下引用成员？相信我，答案是否定的，你不能。当你从同一类的某个成员内部引用另一个成员，而没有显式引用对象时，该引用是隐式针对“当前对象”的。\n\
  \n什么是当前对象？回去详细查看该示例。为了简洁起见，我在这里只提取了示例中的关键元素：\n\n```\nclass Savings\n{\npublic:\n\
  \    int nAccountNumber;\n    double dBalance;\n    double deposit(double dAmount)\n\
  \    {\n        dBalance += dAmount;\n        return dBalance;\n    }\n};\n\nvoid\
  \ fn()\n{\n    // 创建并初始化两个对象\n    Savings s1 = {0, 0.0};\n    Savings s2 = {1, 0.0};\n\
  \    // 现在向一个账户存款 100 美元\n    s1.deposit(100.0);\n    // 然后是另一个\n    s2.deposit(50.0);\n\
  }\n```\n\n当使用 `s1` 调用 `deposit()` 时，对 `dBalance` 的未限定引用指向 `s1.dBalance`。在那个时刻，`s1`\
  \ 就是“当前对象”。在调用 `s2.deposit(50.0)` 期间，`s2` 变成了当前对象。在此调用期间，对 `dBalance` 的未限定引用指向 `s2.dBalance`。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) “当前对象”有一个名字。它的命名方式就像“这个对象（this\
  \ object）”。很聪明吧？它的类型是“指向当前类对象的指针”。我在第 23 章讨论对象指针时会详细介绍更多内容。\n\n### 在类外部保留成员函数\n\n\
  我不喜欢 C++ 的点之一是它提供了实现大多数事情的方法。为了保持这种对灵活性的偏好，C++ 允许只要在类内声明成员函数，就可以在类外定义它们。\n\n以下是一个在类声明之外编写的\
  \ `withdraw()` 函数示例（再次，我省略了错误检查以使示例尽可能短）：\n\n```\n// 这部分通常放在 Savings.h 包含文件中\nclass\
  \ Savings\n{\npublic:\n    int nAccountNumber;\n    double dBalance;\n    double\
  \ deposit(double dAmount);\n};\n\n// 这一部分出现在独立的 Savings.cpp 文件中\ndouble Savings::deposit(double\
  \ dAmount)\n{\n    dBalance += dAmount;\n    return dBalance;\n}\n```\n\n现在，`Savings`\
  \ 的定义仅包含成员函数 `deposit()` 的原型声明。函数的实际定义出现在后面。然而，请注意，当它出现时，它是带有完整扩展名称的形式出现的，包含了类名——在类定义之外没有默认的类名。\n\
  \n这种形式非常适合较大的成员函数。在这些情况下，成员函数内部的代码行数可能会多到掩盖了类本身的定义。此外，这种形式在在自己的模块中定义类时非常有用。\n\n\
  ## 重载成员函数\n\n你可以像重载其他函数一样重载成员函数。但请记住，类名是名称的一部分。这意味着以下内容是合法的：\n\n```\nclass Student\n\
  {\npublic:\n    int nAccountNumber;\n    double dBalance;\n    double deposit(double\
  \ dAmount);\n};\n\nclass Hill\n{\npublic:\n    int nAccountNumber;\n    double dBalance;\n\
  \    double deposit(double dAmount);\n};\n\nvoid fn()\n{\n    // 创建并初始化两个对象\n  \
  \  Savings s1 = {0, 0.0};\n    Savings s2 = {1, 0.0};\n    // 现在向一个账户存款 100 美元\n\
  \    s1.deposit(100.0);\n    // 然后是另一个\n    s2.deposit(50.0);\n}\n```\n*(注：此处原文代码中\
  \ fn 内部使用了 Savings 类而非 Hill 类，可能是笔误，翻译时保持原文逻辑。)*\n\n### 对象的指针\n\n指向程序员定义类型（如类）的指针工作原理与指向内置类型的指针基本相同：\n\
  \n```\nint nInt;\nint* pInt = &nInt;\n\nclass Savings\n{\npublic:\n    int nAccountNumber;\n\
  \    double dBalance;\n};\n\nSavings s;\nSavings* pS = &s;\n```\n\n第一对声明定义了一个整数\
  \ `nInt` 和一个指向整数的指针 `pInt`。指针 `pInt` 初始化指向 `nInt`。\n\n同样，第二对声明创建了一个 Savings 对象 `s`。然后声明了一个指向\
  \ Savings 对象的指针 `pS`，并初始化为 `s` 的地址。\n\n`pS` 的类型是“指向 Savings”，写作 `Savings*`。\n\n\
  当我说“等等！还有更多！”时，我觉得自己就像已的 Billy Mays。相似性持续。以下语句为 `pInt` 指向的 int 赋值 1：\n\n```\n*pInt\
  \ = 1;\n```\n\n同样，以下语句为 `pS` 指向的 Savings 对象的账号和余额赋值：\n\n```\n(*pS).nAccountNumber\
  \ = 1234;\n(*pS).dBalance = 0.0;\n```\n\n![remember.eps](img/remember_fmt.png) 括号是必要的，因为\
  \ `.` 的优先级高于 `*`。如果没有括号，`*pS.nAccountNumber = 1234` 将被解释为 `*(pS.nAccountNumber)\
  \ = 1234`，这意味着“将 1234 存储在 `pS.nAccountNumber` 所指向的位置”。这会产生编译器错误，因为 `nAccountNumber`\
  \ 不是指针（`pS` 也不是 Savings）。\n\n\n\n\n我唯一能想到的就是 C 语言的作者可能打字不太好。他们没有在寻找表达内容的简写方式上浪费任何精力。这里另一个例子，他们为了减少击键次数而发明了一种简写方式，发明了一个新运算符\
  \ `->` 来代表 `*()`：\n\n```\npS->dBalance = 0.0; // 等同于 (*pS).dBalance = 0.0\n```\n\
  \n尽管两者是等的，但箭头运算符几乎被专门使用，因为它更易读（而且输入起来更方便）。然而，不要忽视一个事实：这两种形式是完全等价的。\n\n### 调用成员函数\n\
  \n使用指针调用成员函数的语法与访问数据成员相似：\n\n```cpp\nclass Savings\n{\npublic:\n    int nAccountNumber;\n\
  \    double dBalance;\n    double withdraw(double dAmount);\n    double deposit(double\
  \ dAmount);\n};\n\nvoid fn()\n{\n    Savings s = {1234, 0.0};\n    Savings* pS =\
  \ &s;\n    // 向 pS 指向的账户存款\n    pS->deposit(100.0);\n}\n```\n\n这段代码的最后一条语句是：“在 `pS`\
  \ 指向的对象上调用 `deposit()` 成员函数”。\n\n## 将对象传递给函数\n\n将指针传递给函数只是你玩转指针的许多方法之一。\n\n### 使用对象值调用函数\n\
  \n如你所知，C++ 默认通过值传递传递参数给函数。如果你不知道这一点，请参阅第 11 章。复杂的用户定义对象也是通过值进行传递的：\n\n```cpp\nclass\
  \ Savings\n{\npublic:\n    int nAccountNumber;\n    double dBalance;\n    double\
  \ withdraw(double dAmount);\n    double deposit(double dAmount);\n};\n\nvoid someOtherFunction(Savings\
  \ s)\n{\n    s.deposit(100.0);\n}\n\nvoid someFunction()\n{\n    Savings s = {1234,\
  \ 0.0};\n    someOtherFunction(s);\n}\n```\n\n在这里，函数 `someFunction()` 创建并初始化了一个\
  \ `Savings` 对象 `s`。然后它将该对象的拷贝传递给 `someOtherFunction()`。这是一个拷贝，这一事实非常重要，原因有两点：\n\n\
  - 复制大型对象可能非常低效，导致你的程序运行变慢。\n- 对拷贝进行的修改对调用函数中的原始对象没有产生任何影响。\n\n在这种情况下，第二个问题比第一个严重得多。我可以忍受一点低效率——毕竟一个\
  \ `Savings` 对象并不大——但在 `someOtherFunction()` 中进行的存款操作被记录在了原始账户的拷贝上。我在 `someFunction()`\
  \ 中的 `Savings` 账户余额仍然为零。这在图 23-1 中以图表形式显示。\n\n### 使用对象指针调用函数\n\n程序员可以传递对象的地址而不是对象本身，如下例所示：\n\
  \n```cpp\nclass Savings\n{\npublic:\n    int nAccountNumber;\n    double dBalance;\n\
  \    double withdraw(double dAmount);\n    double deposit(double dAmount);\n};\n\
  \nvoid someOtherFunction(Savings* pS)\n{\n    pS->deposit(100.0);\n}\n\nvoid someFunction()\n\
  {\n    Savings s = {1234, 0.0};\n    someOtherFunction(&s);\n}\n```\n\n![9781118823873-fg2301.tif](img/9781118823873-fg2301.tif)\n\
  \n图 23-1：默认情况下，C++ 通过值传递对象 `s` 给 `someFunction()`。\n\n![9781118823873-fg2301.tif](img/9781118823873-fg2301.tif)\n\
  \n![9781118823873-fg2302.tif](img/9781118823873-fg2302.tif)\n\n图 23-2：通过地址传递对象 `s`\
  \ 给 `someFunction()`。\n\n![9781118823873-fg2302.tif](img/9781118823873-fg2302.tif)\n\
  \n\n\n\n你可以使用 `new` 关键字在堆上分配对象，如下例所示：\n\n```cpp\nSavings* newSavings(int nAccountNum)\n\
  {\n    Savings* pS = new Savings;\n    pS->nAccountNumber = nAccountNum;\n    pS->dBalance\
  \ = 0.0;\n    return pS;\n}\n```\n\n在这里，该函数分配了一个 `Savings` 类的新对象，并使用账户号码（作为参数传递）和零余额对其进行初始化。\n\
  \n当你不知道自己需要多少个对象时，这种方法非常有用，例如在第 18 章 中描述的动态大小字符数组。在这种情况下，我首先计算需要为多少字符留出空间，然后在堆上分配一个适当大小的数组。\n\
  \n在目前的示例中，我可以确定内存中一次性需要多少个 `Savings` 账户，并在堆上动态地分配它们。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 当然，还存在如何存储未知数量对象的小问题。C++ 的标准模板库（STL）除了固定大小数组外，还提供了几种变尺寸数据结构。对 STL 的通用讨论超出了本书的范围，但你可以因它的存在而感到宽慰。\n\
  \n![warning.eps](img/warning_fmt.png) 你必须返回每一个在堆上分配的对象；要做到这一点，你需要将该对象的未修改地址传递给 `delete`\
  \ 关键字。否则，你的程序将缓慢地耗尽内存并惨死。\n\n# 第 24 章\n\n# 请勿扰：保护成员\n\n## 本章内容\n- ![arrow](img/arrow.png)\
  \ 保护类成员\n- ![arrow](img/arrow.png) 提问：“为什么要这样做？”\n- ![arrow](img/arrow.png) 声明类的友\n\
  \n我在书中这部分（从第 21 章 开始）的目标是通过使用类结构在 C++ 中模拟现实世界对象。在第 22 章 中，我引入了成员函数的概念，以便为类分配活动属性。回到第\
  \ 21 章 中的微波炉例子，分配活动属性允许我给我的 `Oven` 类赋予如 `cook()` 和 `defrost()` 之类的属性。\n\n然而，这只是故事的一部分。我还没有给我的类内部套上一个“盒子”来防止干扰。如果微波炉起火了，而内部又暴露给任何想要捣乱它的人，我无法很好地要求某人负责。\n\
  \n本章通过声明某些成员对用户函数不可用，为类套上了一个“盒子”。\n\n## 保护成员\n\n类的成员可以使用 `protected` 关键字标记为不可从类外部访问。这与\
  \ `public` 关键字直接相反，`public` 指定了那些所有函数都可以访问的成员。类的公共成员构成了类的接口（想象一下微波炉正面的键键），而受保护成员则构成了内部工作机制（“内部无用户可自行维修的部件”）。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 还有第三类成员，称为 `private`（私有）。`private`\
  \ 和 `protected` 成员之间的唯一区别在于它们对继承的反应方式，我在第 28 章 中介绍了这个概念。\n\n### 为什么你需要保护成员\n\n将成员声明为\
  \ `protected` 允许类为自己套上一个保护盒。这使得类对自己的内部状态负责。如果类中的某些地方搞砸了，类的作者除了自己之外无处可找。然而，如果任何一个旧函数都能伸进去捣乱它，那么要求程序员为类的状态负责是不公平的。\n\
  \n此外，限制类的接口可以使得在程序中使用该接口的程序员更容易学习该类。通常情况下，我并不真正在乎我的微波炉内部是如何工作的，只要我知道如何使用控制按钮。同样，只要我理解公共成员函数的参数，我通常不会担心库类的内部工作机制。\n\
  \n最后，将类接口限制为某些可选的公共函数，可以减少类与应用程序代码之间的耦合水平。\n\n***注：****耦合*（coupling）指的是应用程序对类内部工作方式的了解程度，反之亦然。紧耦合的类对周围的应用程序有深入了解——并利用这些知识。松耦合的类仅通过简单、通用的公共接口工作。松耦合的类对其周围环境了解很少，并且隐藏了大部分自己的内部细节。松耦合的类更容易测试和调试——而且在应用程序更改时更容易替换。\n\
  \n我知道那些过程化程序员在说什么：“你不需要某些花哨的功能来完成这一切。只需制定一条规则，规定某些成员是公开访问的，而另一些不是。”这在理论上是正确的，我甚至参加过采用此类规则的项目，但在实践中它并不行。人们的初衷是好的，但只要这种语言至少不鼓励直接访问保护成员，这些良好的意就会被击碎。\n\
  \n### 使成员变为受保护\n\n为类添加 `protected` 关键字使后续成员变为受保护。添加 `protected` 关键字意味着它们仅对类本身或友元（稍后介绍）可见。你可以根据喜好在\
  \ `protected` 和 `public` 之间切换。\n\n```cpp\n#include <cstdio>\n#include <cstdlib>\n\
  #include <iostream>\n\nusing namespace std;\n\nclass Student\n{\nprotected:\n  \
  \  double dGrade;\n    int nSemesterHours;\n\npublic:\n    // init() - 初始化学生到合法状态\n\
  \    void init()\n    {\n        dGrade = 0.0;\n        nSemesterHours = 0;\n  \
  \  }\n    // getGrade() - 返回当前成绩\n    double getGrade()\n    {\n        return dGrade;\n\
  \    }\n    // getHours() - 获取课程时数\n    int getHours()\n    {\n        return nSemesterHours;\n\
  \    }\n    // addGrade - 将成绩加入 GPA 和总时数\n    double addGrade(double dNewGrade,\
  \ int nHours)\n    {\n        double dWtdHrs = dGrade * nSemesterHours;\n      \
  \  dWtdHrs += dNewGrade * nHours;\n        nSemesterHours += nHours;\n        dGrade\
  \ = dWtdHrs / nSemesterHours;\n        return dGrade;\n    }\n};\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n    // 创建学生并初始化\n    Student s;\n    s.init();\n\
  \n    // 添加三个课程的成绩\n    s.addGrade(3.0, 3);  // 一个 B\n    s.addGrade(4.0, 3);  //\
  \ 一个 A\n    s.addGrade(2.0, 3);  // 一个 C（平均分应该是 B）\n\n    // 现在打印结果\n    cout <<\
  \ \"总 # 小时 = \" << s.getHours()\n         << \", GPA = \" << s.getGrade()\n    \
  \     << endl;\n\n    // 在程序终止前等待用户准备好\n    return 0;\n}\n```\n\n\n\n\n```cpp\n\
  // 允许用户查看程序结果\n\ncout << \"Press Enter to continue...\" << endl;\n\ncin.ignore(10,\
  \ '\\n');\n\ncin.get();\n\nreturn 0;\n}\n```\n\n这个 `Student` 类保护了其成员 `dGrade` 和\
  \ `nSemesterHours`。外部函数无法通过插入以下代码来悄悄将自己的 GPA 设高：\n\n```cpp\nvoid MyFunction(Student*\
  \ pS)\n{\n    // 将成绩设为 A+\n    pS->dGrade = 3.9;  // 会产生编译器错误\n}\n```\n\n此赋值会产生编译器错误。\n\
  \n![tip.eps](img/tip_fmt.png) 你可以从保护成员或公共成员中的任何一个开始，这并不重要。事实上，你可以随心所欲地切换。\n\n任何函数都可以通过\
  \ `getGrade()` 函数读取学生的 GPA。这被称为一个 `access`（访问）函数。然而，尽管外部函数可以读取该值，但它们无法通过此访问函数更改该值。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 访问函数也被称为 `getter function`（如“获取值”）。设置该值的函数也被称为\
  \ `setter function`。它们分别被称为 `accessors`（访问器）和 `mutators`（修改器）。\n\n此程序中的 `main()`\
  \ 函数创建了一个 `Student` 对象 `s`。由于数据成员是受保护的，它无法将 `s` 初始化为某些合法状态。幸运的是，`Student` 类提供了一个\
  \ `init()` 函数供 `main()` 调用，将数据成员初始化为正确的起始状态。\n\n在初始化 `s` 之后，`main()` 调用 `addGrade()`\
  \ 添加了三门不同的课程，并使用访问成员函数打印结果。结果如下：\n\n总学时 = 9, GPA = 3\n\n按回车键继续 …\n\n### 又怎样？\n\n\
  这有什么大不了的？好吧，”你说，“我明白不让其他函数将 GPA 设为任意值这一点，但就此而已吗？”不。在这种松散耦合的背后隐藏着一个更微妙的要点。我选择了尽可能简单地实现计算\
  \ GPA 的算法。只需思考五分钟，我就可以构想出至少三种不同的内部存储成绩和学时的方法，每种方法都有其自身的优缺点。\n\n例如，我可以将每个成绩——连同学时数——保存在一个内部数组中。这允许学生查看计入其\
  \ GPA 的成绩。\n\n点在于，应用程序程序员不应该关心这些。只要成员函数 `getGrade()` 和 `getHours()` 准确地计算出 GPA 和总学时，任何应用程序都不会关心。\n\
  \n现在假设学校改变了计算 GPA 的规则。例如，学校宣布某些课程为“通过/不通过”（Pass/Fail），这意味着你可以获得学分，但该课程的成绩不会计入 GPA\
  \ 计算。这可能需要对 `Student` 类进行完全重写。反过来，这将对任何依赖内部信息存储方式的函数进行修改——即任何能够访问保护成员的函数。然而，局限于公共成员的函数不受此变化的影响。\n\
  \n这就是松散耦合的真正优势：对变化的容忍性。\n\n## 到底谁需要朋友？\n\n偶尔，你需要让非成员函数访问类的受保护成员。你可以通过将该函数声明为 `friend`（朋友）来实现这一点——这意味着你不需要通过将保护成员声明为公共来将其暴露给所有人。\n\
  \n这就像给你的邻居一把钥匙，让他们在你度假期间去检查你的房子。给非家庭成员钥匙通常不是个好主意，但总比把房子门不锁着好。\n\n朋友声明出现在包含保护成员的类中。朋友声明由关键字\
  \ `friend` 后接原型声明组成。在接下来的示例中，`initialize()` 函数被声明为非成员。然而，`initialize()` 显然需要访问类的所有数据成员，无论是否受保护保护：\n\
  \n```cpp\nclass Student\n{\n    friend void initialize(Student*);\n  protected:\n\
  \    double dGrade;         // 学生的 GPA\n    int    nSemesterHours;\n  public:\n\
  \    double grade();\n    int hours();\n    double addGrade(double dNewGrade, int\
  \ nHours);\n};\n\nvoid initialize(Student* pS)\n{\n    pS->dGrade = 0.0;\n    pS->nSemesterHours\
  \ = 0;\n}\n```\n\n一个函数可以同时声明为两个不同类的朋友。虽然这看起来很方便，但它倾向于将两个类绑定在一起。然而，有时类本质上就是绑定在一起的，如下例师生示例：\n\
  \n```cpp\nclass Student;  // 前置声明\nclass Teacher\n{\n    friend void registration(Teacher*,\
  \ Student*);\n  protected:\n    int noStudents;\n    Student *pList[128];\n  public:\n\
  \    void assignGrades();\n};\n\nclass Student\n{\n    friend void registration(Teacher*,\
  \ Student*);\n  protected:\n    Teacher *pTeacher;\n    int nSemesterHours;\n  \
  \  double dGrade;\n};\n```\n\n在这个示例中，`registration()` 函数可以同时进入 `Student` 对象设置 `pTeacher`\
  \ 指针，并进入 `Teacher` 对象向教师的学生列表中添加学生。\n\n![tip.eps](img/tip_fmt.png) 注意 `Student`\
  \ 类是如何先在没有正体的情况下单独出现的。这被称为 `forward declaration`（前置声明），表示了程序员意图在模块的某处定义 `Student`\
  \ 类。这有点像第 11 节 章中描述的函数原型声明。\n\n\n\n\n然而，当数据元素声明为 `protected`（保护）时，如果创建对象的函数不是该类的友元或成员，这样做就不可能了（在大多数情况下，它不会是——关于这些关系的更多信息，请参见第\
  \ 24 章节）。\n\n需要另一种机制在创建对象时对其初始化，这就是构造函数的用用场。\n\n## 构造函数\n\n初始化具有保护成员对象的某种方法是创建一个\
  \ `init()` 成员函数，让应用程序在对象创建时可以调用它该函数。这个 `init()` 函数会将对象初始化为某个合法的起始状态。事实上，这正是我在第 24\
  \ 章节中所做的。\n\n这种方法虽然行得通，但它并不完全符合面向对象编程的“微波炉”规则（参见第 21 章节），因为它好比制造了一个微波炉，要求你在对它进行任何操作之前必须按下重置（Reset）按钮。这就像厂家在说明书中写了一份巨大的免责声明：“在首先按下重置按钮之前，切勿启动任何命令序列。否则可能导致微波炉爆炸并杀死周围所有人，甚至更糟。”（还有比这更糟的吗？）\n\
  \n我虽然不是律师，但我知道，在说明书中写上这样的免责声明，并不能在你们最终上法庭时救你的命——因为有人忘记按重置，结果被爆炸微波炉的碎片伤到，尽管你已经非常清楚地表示要先按重置。\n\
  \n幸运的是，C++ 把调用初始化函数的责任从应用程序程序员手中接了：每当创建一个对象时，它都会自动调用该函数。\n\n你可以给这个初始化函数起任何名字，只要有一条所有人遵守的规则即可。（我个人比较倾向于使用\
  \ `init()`，但我并没有投票权。）规则是，这个初始化函数被称为 `constructor`（构造函数），它的名字与类名相同。\n\n配备了构造函数后，`Student`\
  \ 类如下所示：\n\n```cpp\nclass Student\n{\n  protected:\n    int nSemesterHours;\n  \
  \  double dGrade;\n  public:\n    Student()\n    {\n        nSemesterHours = 0;\n\
  \        dGrade = 0.0;\n    }\n    // ...other public member functions...\n};\n\n\
  void fn()\n{\n    Student s;  // 创建一个对象并调用\n                // 它的构造函数\n}\n```\n\n\
  在声明 `s` 的点，C++ 嵌入了对 `Student::Student()` 的调用。\n\n注意，每创建一个对象就会调用一次构造函数。因此，以下声明连续调用了五次构造函数：\n\
  \n```cpp\nvoid fn()\n{\n    Student s[5];\n}\n```\n\n它首先调用 `s[0]` 的构造函数，然后是 `s[1]`，依此类推。\n\
  \n### 构造函数的局限性\n\n构造函数只能由 C++ 自动调用。你不能像调用普通成员函数一样调用构造函数。这意味着你不能执行如下操作：\n\n```cpp\n\
  void fn()\n{\n    Student s;\n    // ...做一些事情...\n    // 现在将 s 重新初始化为初始状态\n    s.Student();\
  \    // 这不起作用\n}\n```\n\n构造函数不仅仅是一个普通的函数。\n\n此外，构造函数没有返回值，甚至没有 `void`。默认构造函数也没有参数。\n\
  \n![tip.eps](img/tip_fmt.png) 下一章将向你展示如何声明和使用带参数的构造函数。\n\n最后，构造函数必须声明为 `public`（公共），否则你只能在其他成员函数内部创建对象。\n\
  \n构造函数可以调用其他函数。因此，你的构造函数可以调用一个公开的 `init()` 函数，然后该函数可以被任何人将对象重置为初始状态。\n\n### 我能看示例吗？\n\
