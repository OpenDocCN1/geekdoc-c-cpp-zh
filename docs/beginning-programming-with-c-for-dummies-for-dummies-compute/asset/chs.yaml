  \ `Finish`，你就无法再返回并更改选择了。（如果你弄错了并想重新做项目，首先需要移除该项目：在管理窗口中右键点击 `HelloWorld` 并选择 `Close\
  \ Project`。现在你可以删除文件夹 `Beginning_Programming-CPP\\HelloWorld` 并重新开始。）\n\n![9781118823873-fg0215.tif](img/9781118823873-fg0215_fmt.png)\n\
  \n图 2-15：在最后一页选择 `Finish` 以完成 `HelloWorld` 项目的创建。\n\n### 测试你的默认项目\n\n当你在项目向导中选择\
  \ `Finish` 时，`Code::Blocks` 会创建一个控制台应用程序项目——并为其填充一个可以运行的程序。要查看该程序，点击显示器左侧管理窗口中 `Sources`\
  \ 旁边的加号 (+) 符号。下拉列表会显示一个文件，`main.cpp`。双击 `main.cpp` 将在右侧的源码输入窗口中显示以下简单程序：\n\n```cpp\n\
  #include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    cout << \"Hello\
  \ world!\" << endl;\n    return 0;\n}\n```\n\n暂时跳过这些内容的某些含义是没关系的，但程序的关键位于 `main()`\
  \ 之后的大括号之后。这是执行开始的地方。这一行：\n\n```cpp\ncout << \"Hello world!\" << endl;\n```\n\n\
  意为向 `cout` 输出行 \"Hello, world!\"，`cout` 默认是命令行。下一行：\n\n```cpp\nreturn 0;\n```\n\n\
  该代码使控制权返回操作系统，从而有效地终止程序。\n\n1. **选择 Build⇒Build 将 C++ 源代码编译成可执行的机器语言程序。**\n\n  \
  \ （如果你愿意，也可以按 `Ctrl+F9` 或点击 `Build` 图标。）立即，你应该会看到屏幕右下角出现了 `Build Log` 标签页，随后是一系列长长的命令，如图\
  \ 2-16 所示。这是 `Code::Blocks` 正在告诉 C++ 编译器如何使用项目文件中存储的设置来构建测试程序。细节并不重要。然而，重要的是 `Build\
  \ Log` 窗口的最后两行应该是：\n\n```text\nProcess terminated with status 0 (0 minutes, 1 seconds)\n\
  0 errors, 0 warnings\n```\n\n终止状态 `0` 意味着构建过程运行正常。“0 errors, 0 warnings” 意味着程序编译时没有错误或警告。（1\
  \ 秒的构建时间并不重要。）\n\n   ![warning.eps](img/warning_fmt.png) 如果你得到的不是 `0` 状态且 `0` 错误和\
  \ `0` 警告，那么你的安装或项目出了问题。最常见的错误来源是：\n\n- 在安装 `Code::Blocks` 之前，你的电脑上已经安装了 `gcc` 编译器。`Code::Blocks`\
  \ 使用特殊版本的 GNU `gcc` 编译器，但它会使用你电脑上已安装的任何其他 `gcc` 编译器。最稳妥的方法是卸载 `Code::Blocks`、卸载你的其他\
  \ `gcc` 编译器，并从头重新安装 `Code::Blocks`。\n- 你在一个包含空格的目录中构建了项目；例如，你在 `Desktop`（桌面）上构建了项目。请确保在用户磁盘根目录（Windows\
  \ 机器上可能是 `C` 盘）下的 `Beginning_Programming-CPP` 文件夹中构建你的项目。![9781118823873-fg0216.tif](img/9781118823873-fg0216_fmt.png)\n\
  \n图 2-16：构建默认程序应该得到一个无错误无警告的运行程序。\n\n2. **选择 Build⇒Run (Ctrl+F10) 执行程序。**\n\n  \
  \ 立即应该会弹出一个窗口，显示消息 `Hello, world!`，随后是返回码 零以及消息 `Press any key to continue`（如图 2-17\
  \ 所示）。\n\n   ![9781118823873-fg0217.tif](img/9781118823873-fg0217_fmt.png)\n\n图\
  \ 2-17：默认程序显示 \"Hello, world!\"\n\n3. **按回车键 (Enter)**。\n\n   窗口消失，控制权返回到 `Code::Blocks`。\n\
  \n如果你能通过执行程序看到 `Hello, world!` 消息，说明你已经安装好了环境。\n\n# 编写你的第一个程序\n\n本章将引导你使用 `Code::Blocks`\
  \ 创建你的第一个程序。我假设这是你第一次，所以我将解释所有部分。\n\n## 创建新项目\n\n如既往，你必须创建一个新项目来存放你的程序。按照这里的简要步骤操作：\n\
  \n1. 在 `Code::Blocks` 打开时，选择 `File⇒New⇒Project`。\n2. 选择 `Console Applications` 并选择\
  \ `Go`（或双击 Console Applications 图标）。\n3. 选择 `C++` 作为语言并选择 `Next`。\n4. 输入 `Conversion`\
  \ 作为项目标题。\n\n   如果你遵循了第 2 章 中的步骤，“Folder to create project in”应该设置为 `Beginning_Programming-CPP`。如果不是，现在也不迟点击\
  \ `...` 按钮在你的工作磁盘根目录下创建文件夹。（第 2 章 详细描述了这一过程。）`Code::Blocks` 向导会为你填写项目名称（以及生成的程序名称）。\n\
  \n   完成后，你的窗口看起来应该像图 3-1 所示。\n\n![9781118823873-fg0301.tif](img/9781118823873-fg0301_fmt.png)\n\
  \n图 3-1：Conversion 程序的项目窗口。\n\n5. 选择 `Next`。\n\n下一个窗口允许更改目标文件夹。你可能不需要；默认设置很好。\n\n\
  6. 选择 `Finish`。\n\n`Code::Blocks` 会创建一个新项目并将其添加到之前的 `HelloWorld` 项目中。（请接下来的“组织项目”章节以了解为什么会发生这种情况。）结果显示应该像图\
  \ 3-2 所示。\n\n![9781118823873-fg0302.tif](img/9781118823873-fg0302_fmt.png)\n\n图\
  \ 3-2：创建 Conversion 项目后的初始显示。\n\n\n\n\n\n# 文件扩展名\n\nWindows 在显示文件名时有一个隐藏文件扩展名的坏习惯。对于某些应用程序来说，这可能是一个好主意，但对于程序员来说，这几乎不是一个好主意。在隐藏扩展名的情况下，Windows\
  \ 可能会显示三个或四个名为 `HelloWorld` 的文件。显示文件扩展并发现它们都不同时，这种混乱的局面就会迎刃而解。\n\n![tip.eps](img/tip_fmt.png)\
  \ 为了减少困惑，请禁用 Windows 的隐藏已知扩展名功能。具体操作方法取决于你使用的 Windows 版本：\n\n*   默认视图下的 Windows\
  \ XP：选择“开始⇒控制面板⇒性能和维护⇒文件类型”。\n*   经典视图下的 Windows XP：选择“开始⇒控制面板⇒文件夹选项”。\n*   默认视图下的\
  \ Windows Vista：选择“开始⇒控制面板⇒外观和个性化⇒文件夹选项”。\n*   经典视图下的 Windows Vista：选择“开始⇒设置⇒控制面板⇒文件夹选项”。\n\
  *   Windows 7：选择“开始⇒控制面板⇒外观和个性化⇒文件夹选项”。\n\n启动后，导航到出现的“文件夹选项”对话框的“查看”选项卡。向下滚动直到找到“隐藏已知文件类型的扩展名”，确保该复选框未勾选。然后选择“确定”关闭对话框。\n\
  \n在 Windows 8 中，你可以直接进入“文件夹选项”。从“文件资源管理器”中，选择“查看”选项卡。在“显示/隐藏”部分，点击为“文件扩展扩展名”打上勾选。\n\
  \n# 输入你的程序\n\n按照以下步骤输入使用 C++ 创建第一个程序的代码：\n\n1.  确保“管理”窗口中的 `Conversion` 是**加粗**的（请参见图\
  \ 3-2）。这表示它是活动项目。如果不是，右键点击 `Conversion` 并从下拉菜单中选择“激活项目”。\n2.  通过选择“文件⇒关闭所有文件”来关闭可能已打开的源文件窗口。或者，你也可以点击编辑器标签页中每个文件名称旁的小\
  \ `X` 来选择要关闭的源文件。你不希望无意中编辑错误的源文件。\n3.  点击 `Sources` 旁边的小加号（它在“管理”窗口的 `Conversion`\
  \ 下方）来打开 `Sources` 文件夹。下拉菜单显示了文件 `main.cpp`。\n4.  双击 `main.cpp` 在编辑器中打开该文件。\n5.\
  \  通过完全按照此处所示输入以下程序来编辑 `main.cpp` 的内容。结果所示图 3-3。\n\n![9781118823873-fg0303.tif](img/9781118823873-fg0303_fmt.png)\n\
  \n图 3-3：`Conversion` 程序编辑后的 `main.cpp` 文件。\n\n这绝对是最的部分，因此在输入这段代码时请花些时间并保持耐心：\n\n\
  ```cpp\n//\n//  Conversion - 将摄氏度温度\n//             转换为华氏度的程序：\n//             华氏度\
  \ = 摄氏度 * (212 - 32)/100 + 32\n//\n#include <cstdio>\n#include <cstdlib>\n#include\
  \ <iostream>\nusing namespace std;\n\nint main(int nNumberofArgs, char* pszArgs[])\n\
  {\n  // 输入摄氏度温度\n  int celsius;\n  cout << \"Enter the temperature in Celsius:\"\
  ;\n  cin >> celsius;\n  // 将摄氏度转换为华氏度值\n  int fahrenheit;\n  fahrenheit = celsius\
  \ * 9/5 + 32;\n  // 输出结果（后跟一个换行）\n  cout << \"Fahrenheit value is:\";\n  cout <<\
  \ fahrenheit << endl;\n  // 在终止程序前等待用户准备好\n  // 以允许用户看到程序结果\n  cout << \"Press Enter\
  \ to continue...\" << endl;\n  cin.ignore(10, '\\n');\n  cin.get();\n  return 0;\n\
  }\n```\n\n我说的“完全按照你在这里看到的”是什么意思？C++ 对语法非常挑剔。它反感缺少分号或拼写错误的单词。它不在乎额外的空格，只要这些空格没有出现在单词中间即可。例如，`int\
  \ fahren heit;` 与 `int fahrenheit;` 不同，但 `int fahrenheit;` 是可以的。C++ 将制表符、空格和换行符视为相同，统称为\
  \ `空白字符`。\n\n也许这只是我个人的问题，但我花了很长时间才习惯 C++ 区分大写和小写。因此，`int Fahrenheit;` 与 `int fahrenheit;`\
  \ 不是一回事。\n\n最后一个线提示：C++ 会忽略 `//` 之后出现的任何内容，所以你不需要担心\n\n6.  通过选择“文件⇒保存全部”来保存文件。\n\
  \n# 构建程序\n\n现在到了整个开发过程中最紧张的部分：构建你的程序。在这一步中，C++ 会检查你的代码以查看它是否通顺。程序员是永恒的乐观主义者。在我们内心深处，我们真的相信每次点击按钮时，一切都会正常工作，但事实并非如此。实际上，构建程序只需要一步：你选择“构建”或按\
  \ `Ctrl+F9`。\n\n# 查找可能出现的问题\n\n并非无意，但构建步骤几乎没有没有错误。幸运的是，`Code::Blocks` 编辑器集成得非常好，可以引导你找到错误所在的地方。注意第一行的小色块，它指示了该行有问题。你可以在右下角的“生成输出”选项卡中查看所有信息。\n\
  \n![tip.eps](img/tip_fmt.png) 这些只是两个示例错误。理解编译器试图告诉你的——通过它的错误信息——是学习语言的重要部分积累经验。希望这两个例子能帮你入门。\n\
  \n## 拼错误的命令\n\n拼错误的命令是最容易识别和修正的。为了演示这一点，我在前面的代码第 14 行增加了一个 `t`，所以它现在读作\n\n```cpp\n\
  intt celsius;\n```\n\n与 `int` 不同，`intt` 对 C++ 来说没有意义。程序产生了图 3-4 所示显示。\n\n![9781118823873-fg0304.tif](img/9781118823873-fg0304_fmt.png)\n\
  \n图 3-4：拼写 `int` 导致的错误消息。\n\n在这里你可以看到以下消息：\n\n```text\nIn function 'int main(int,\
  \ char**)':\n14 error: 'intt' was not declared in this scope\n14 error: expected\
  \ ';' before 'celsius'\n16 error: 'celsius' was not declared in this scope\n```\n\
  \n第一行指示包含错误的函数。我直到第 12 章才介绍函数，但很容易相信这个程序中的所有代码都在一个名为 `main` 的函数中。下一行是关键。它基本上说 C++\
  \ 不明白程序第 14 行的 `intt` 是什么。错误信息有点晦涩，但足以说，每当你拼错某个东西时，几乎都会收到同样的错误消息。\n\n\n\n\n\n![warning.eps](img/warning_fmt.png)\
  \ 一个 C++ 错误可能会产生一系列的错误信息。在单次编译尝试中识别并修复多个错误是可能的，但需要经验来判断哪些错误是由其他错误引起的。现在，请关注第一条错误信息。修复它并重新编译程序。\n\
  \n### 缺少分号\n\n另一个常见的错误是漏掉分号。该错误产生的信息可能会让人有些困惑。为了演示，我删除了第 14 行声明中的分号，使其变为如下：\n\n\
  ```cpp\nint celsius\n\ncout << \"Enter the temperature in Celsius:\";\n```\n\nC++\
  \ 对此违规行为报告的错误指向不是第 14 行，而是下一行第 15 行：\n\n```\n15 error: expected initialization before\
  \ 'cout'\n16 error: 'celsius' was not declared in this scope\n```\n\n当你考虑到 C++ 将换行符视为另一种形式的空白时，这就更容易理解了。没有分号的情况下，C++\
  \ 将这两行合在一起运行。不再有独立的第 14 行。C++ 可以解释第一部分，但它无法理解从 `cout` 开始的这个连句。\n\n![tip.eps](img/tip_fmt.png)\
  \ 缺少分号通常产生的错误信息与实际错误信息几乎不相似，而且它们几乎总是实际错误之后的下一行。如果你怀疑缺少了分号，请从报告错误的行行开始向后扫描。\n\n##\
  \ 使用在线材料\n\n如果你始终无法正确输入程序，你可以随时从 [www.dummies.com/extras/beginningprogrammingcplusplus](http://www.dummies.com/extras/beginningprogrammingcplusplus)\
  \ 的在线材料中复制程序。\n\n![tip.eps](img/tip_fmt.png) 在求助于在线材料之前，你真的应该先尝试手动输入程序。只有通过解决错误，你才能对这种语言的运行方式产生感觉。\n\
  \n你有几种方法来使用在线材料。最直接的方法是将 CD 中的文件内容复制并粘贴到你自己的文件中，如下：\n\n1. **下载文件** `CPP_Programs.zip`\
  \ 并将此文件解压到某个容易找到的地方。\n在 Windows 机器上，那可能是 `C:\\CPP_Programs`。\n2. **在 Code::Blocks\
  \ 内部选择文件⇒打开。导航到** `CPP_Programs/Conversion`。\n3. **选择文件** `main.cpp`。\nCode::Blocks\
  \ 在编辑器窗口的新新标签页中打开该文件。\n4. **选择编辑⇒全选或按 `Ctrl+A`。**\n这样做会选中源文件的全部内容。\n5. **选择编辑⇒复制或按\
  \ `Ctrl+C`。**\n这会将整个文件复制到剪贴板。\n6. **选择对应于你程序的主标签页。**\n7. **再次选择编辑⇒全选或按 `Ctrl+A`。**\n\
  8. **选择编辑⇒粘贴或按 `Ctrl+V`。**\n这将用下载的对应文件的内容覆盖你一直编写的 `main.cpp` 的全部内容。\n9. **点击文件名旁的小\
  \ X 关闭包含下载版本文件的标签页。**\n\n## 运行程序\n\n一旦你获得了“洁净”的编译结果（即 0 错误和 0 警告），你就可以按照以下步骤执行程序：\n\
  \n1. **选择生成⇒运行或按 `Ctrl+F10`。**\n这将在不使用调试器的情况下执行程序。（如果你不知道 `debugger` 是什么，不用担心；第\
  \ 20 章将向你展示如何使用它。）\n程序打开一个 80 列 25 行的窗口，并提示你输入摄氏度温度。\n2. **输入一个已知温度，如 100 度。按回车键。**\n\
  程序会立即响应等效的华氏度温度，212 度：\n\n```\nEnter the temperature in Celsius:100\nFahrenheit\
  \ value is:212\nPress Enter to continue …\n```\n3. **按两次回车键退出程序并返回编辑器。**\n\n## 程序的工作原理\n\
  \n尽管这是你的第一个程序，但我不想在这一章结束时没有让你对这个程序是如何工作的有一个某种了解。\n\n### 模板\n\n我将程序的第一部分称为“入门编程模板”。这是书书中所有程序使用的相同的魔术咒语。它如下：\n\
  \n```cpp\n//\n// ProgramName - 关于程序功能的\n//               简要说明\n//\n#include <cstdio>\n\
  #include <cstdlib>\n#include <iostream>\n\nusing namespace std;\n\nint main(int\
  \ nNumberofArgs, char* pszArgs[])\n{\n  // 程序放在这里\n  // 等待用户准备好后再终止程序\n  // 以允许用户看到程序结果\n\
  \  cout << \"Press Enter to continue...\" << endl;\n  cin.ignore(10, '\\n');\n \
  \ cin.get();\n\n  return 0;\n}\n```\n\n### 注释\n\n该模板中的前几行似乎是自由格式的文本。这些“代码”要么是给人阅读的，要么是给编译器的。注释允许程序员在编写时解释自己的想法。注释以双斜杠开头，并换行结束。你可以放置任何你想要的字符，尽管习惯上将它们限制在\
  \ 80 个字符以内。\n\n### 包含文件\n\n接下来的几行被称为*包含语句*，因为它们会导致命名文件的内容包含在该处。包含文件始终以第 1 列的 `#include`\
  \ 语句开始，后面跟着要包含的文件名。（更多细节请参见第 12 章。）现在只需将其视为魔术即可。\n\n### main\n\n每个程序在某处都必须有一个 `main()`。程序执行从\
  \ `main()` 之后的左括号开始，并在右括号之前的 `return` 语句处终止。关于 `main()` 声明的确切格式的解释将以后再说。\n\n注意标准模板在\
  \ `return 0` 之前以 `cin.get()` 语句结束。此命令导致程序等待用户按下回车键后再终止。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 只要你在 Code::Blocks 环境中运行程序，调用 `cin.get()` 就不是必要的。Code::Blocks 无论会在关闭控制台应用程序窗口之前等待用户输入按键。然而，并不是所有环境都这么理解。漏掉它，C++\
  \ 经常会在你有机会读取程序输出之前关闭应用程序窗口。\n\n### 转换程序\n\n转换程序的剩余部分（除去模板后）所示：\n\n```cpp\n// 输入摄氏度温度\n\
  int celsius;\n\ncout << \"Enter the temperature in Celsius:\";\ncin >> celsius;\n\
  \n// 将摄氏度转换为华氏度值\nint fahrenheit;\nfahrenheit = celsius * 9/5 + 32;\n\n// 输出结果（后跟一个换行符）\n\
  cout << \"Fahrenheit value is:\";\ncout << fahrenheit << endl;\n```\n\n跳过注释行（C++\
  \ 无论会忽略它们），该程序开始声明一个名为 `celsius` 的变量。*变量*是你用来存储数字或字符的地方。\n\n\n\n\n下一行向用户显示提示符“输入摄氏度温度：”。对象\
