  \  图标变为 Installing（安装中）。\n   下载和安装需要一些时间，因为 Xcode 占据了超过 2GB 的空间。\n\n### 安装 Code::Blocks\n\
  \n现在，最后你可以通过下载 Code::Blocks 包完成 Mac OS 安装：\n\n1. **打开 Safari 浏览器并访问 [www.codeblocks.org/downloads/](http://www.codeblocks.org/downloads)。**\n\
  2. **点击 Downloads（下载）⇒Binaries（二进制文件）。**\n3. **点击 Mac OS X。**\n4. **选择 BerliOS 或\
  \ Sourceforge.net 镜像站获取最新版本。**\n   在写作期间，`CodeBlocks-13.12-mac.zip` 是最新的。\n5. **将下载的\
  \ Zip 文件安装到 Applications 文件夹。**\n   如果你从未从第三方网站安装过应用程序，可能需要先执行这些额外步骤：\n\n1. *点击\
  \ System Preferences（偏好设置）。*\n2. *点击 Security and Privacy（安全性与隐私）。*\n3. *点击窗口左下角的锁以允许更改。*\n\
  4. *点击 Allow Applications Downloaded from:（允许从任何地方下载的应用程序：），如图 2-7。**\n\n\n\n\n\
  当你完成 Code::Blocks 的安装后，你可以选择返回此窗口并将设置还原为 Mac App Store 版本。\n\n![9781118823873-fg0207.tif](img/9781118823873-fg0207_fmt.png)\n\
