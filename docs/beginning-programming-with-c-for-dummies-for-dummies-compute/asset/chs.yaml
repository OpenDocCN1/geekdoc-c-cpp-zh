  10. **点击 Finish（完成）。**\n\n## Mac OS 安装\n\n`Code::Blocks` 的 Linux 安装版不包含 `gcc` 编译程序，因此安装是一个两步过程。首先，你需要安装\
  \ `gcc`。然后你可以安装 `Code::Blocks`。\n\n### 安装 Xcode\n\n尽管 Xcode 很大，你可能认为它包含了一切，但你错了。你还需要来自\
  \ Apple 的另一个包来完成你的安装。\n\n### 安装 Xcode\n\nXcode 是 Apple 提供的一个免费开发包。按照以下步骤安装它：\n\n\
  1. **打开 Safari 浏览器并访问 [`developer.apple.com/`](http://developer.apple.com/)。**\n\
