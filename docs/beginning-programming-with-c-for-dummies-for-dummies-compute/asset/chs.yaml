  在本章中，你将熟悉整数声明和表达式。啊，代数课的回忆。如果运气好的话，它向你介绍了变量和表达式的概念。老师会在黑板上写类似的内容：\n\n```\nx = 1\n\
  ```\n\n这个方程定义了一个变量 `x` 并将其赋值为值 1，直到后续的语句由于某种原因改变了这种关系。术语 `x` 变成了 1 的替换。老师接着会写下下面的表达式：\n\
  \n```\ny = 2x\n```\n\n因为我知道 `x` 是 1，我现在知道 `y` 等于 2。这在七年级是一个真正的突破。好消息是，所有传统的计算机语言都遵循这种创建和操作变量的相同模式。\n\
  \n### 声明变量\n\n整数变量声明以关键字 `int` 开始，后面跟着变量名和分号，例所示：\n\n```cpp\nint n1;      // 声明一个变量\
  \ n1\n```\n\nC++ 中的所有变量在使用之前都必须声明。变量声明在内存中预留一小块空间，足够容纳单个整数（在本例中），并为它分配一个名称。你可以在同一个声明中声明多个变量，如下例所示，但这不是好主意；当你学习后续章节时，原因就会变得清晰：\n\
  \n```cpp\nint n2, n3;  // 声明两个变量 n2 和 n3\n```\n\n![remember.eps](img/remember_fmt.png)\
  \ 关键字是一个对 C++ 有意义的单词。你不能给变量命名与关键字相同的名称。例如，你不能创建一个名为 `int` 的变量。然而，关键字是区分大小写的，所以你可以创建一个名为\
  \ `Int` 或 `INT` 的变量。后面的章节将为你介绍更多的关键字。\n\n使用关键字 `int` 而不是 `integer` 仅仅反映了 C++ 语言整体的简洁性。这让你怀疑该语言的创造者是否是打字高手，想要尽量减少他们需要打字量。\n\
  \n![warning.eps](img/warning_fmt.png) 如果超过了 `int` 的范围，你会得到错误的答案。与代数课不同，C++ 中整数的范围不是无限的。然而，它确实很大。我在第\
  \ 14 章讨论变量的大小和范围。\n\n### 变量名\n\n你可以随心为变量命名——但须遵循以下限制：\n\n*   变量的首字母必须是 `a` 到 `z`、`A`\
  \ 到 `Z` 之间的字符或下划线 (`_`）。\n*   第一个字母后的每个字母必须是 `a` 到 `z`、`A` 到 `Z`、下划线 (`_`）或数字 0\
  \ 到 9。\n*   变量名可以是任何长度。所有字符都有意义。\n\n以下是合法的变量名：\n\n```cpp\nint myVariable;\nint MyVariable;\n\
  int myNumber2Variable;\nint _myVariable;\nint my_Variable;\n```\n\n以下不是合法的变量名：\n\
  \n```cpp\nint myPercentage%;      // 包含非法字符\nint 2ndVariable;         // 以数字开头\n\
  int my Variable;         // 包含空格\n```\n\n变量名应该具有描述性。不建议使用像 `x` 这样的变量名。\n\n### 给变量赋值\n\
