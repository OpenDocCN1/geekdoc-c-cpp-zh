  \n## 第一章\n\n# 什么是程序？\n\n## 本章内容\n\n*   ![arrow](img/arrow.png) 理解程序\n*   ![arrow](img/arrow.png)\
  \ 编写你的第一个“程序”\n*   ![arrow](img/arrow.png) 计算机语言\n\n在本章中，你将掌握什么是程序，以及编写程序意味着什么。你将在“人类计算机”上进行练习，并看到一些为真实计算机编写的程序片段。最后，你将看到你的第一个用\
  \ C++ 编写的代码片段。\n\n到目前为止，运行在你计算机上的所有程序都是别人编写的。很快，情况就不再如此了。你将加入那少数自豪的人的行列：程序员。\n\n\
  ## 我儿子和计算机有什么区别？\n\n计算机是一台速度惊人但极其愚蠢的机器。计算机可以执行你要求它做的任何事情（在合理范围内），但它*完全*按照它被指令的去做——不多也不少。\n\
  \n在这方面，计算机几乎与人类完全对立：人类会根据直觉做出反应。当我学习第二语言时，我发现仅仅理解对方所说的话是不够的——理解那些未说出口的话同样重要，而且要困难得多。这些是说话者通过共同经验或教育与听者分享的信息——这些信息是不需要说出口的。\n\
  \n例如，我会对我儿子说一些话，比如“去洗碗”（尽管这对我没什么好处）。这些指令看起来足够清楚，但那句话中包含的大部分信息是隐含且未说出口的。\n\n假设我儿子知道什么是碗，也知道脏碗通常在水池里。但刀和叉呢？毕竟，我只说了“碗”，没有提到餐具，更不用提玻璃器皿了。我是让他们手动洗，还是把它们放进洗碗机里自动清洗、冲洗和干燥也可以？\n\
  \n但事实是，“洗碗”对我儿子来说是足够的指令了。他可以拆解这句话，并将其与我们共同拥有的信息（包括对脏碗的广泛工作知识）相结合，从而对我想要他做的事情产生有意义的理解——至于他是否去做则是另一回事。我猜，他理解这句话所需的全部心理体操所需的时间，跟我说这句话的时间差不多——大约是\
  \ 1 到 2 秒。\n\n计算机无法对像“洗碗”这样模糊的陈述理出头绪。你必须准确告诉计算机对每种不同类型的碗要做什么，指定任务中包含银器具，并说明如何洗叉子、勺子以及杯子的洗涤方法。程序在什么时候停止洗一个碗（也就是说，它是如何知道碗洗干净的）？它什么时候停止洗涤（也就是说，它是如何知道任务已完成的）？\n\
  \n我的儿子拥有大量的记忆——目前还不清楚普通人到底有多少记忆，但那是多得人的。遗憾的是，人类的记忆是模糊的。例如，犯罪目证人在回忆细节方面是出名的糟糕，即使在事件发生后不久。对于同一事件的两个证人往往对发生的情况持有根本性的分歧。\n\
  \n计算机也拥有大量的记忆，这非常好。一旦事实被存储，计算机就可以随你意愿地检索该事实，而不会改变它。在 20 世纪 80 年代初，内存非常昂贵，最初的 IBM\
  \ PC 只有 16K（即 16 万字节）。这可以扩展到惊人的 64K。与今天大多数计算机提供的 2GB 到 6GB 主存储空间相比（一个吉字节，1GB，是*十亿个字节*）。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.png) 在 20 世纪 80 年代初，内存非常昂贵，IBM PC\
  \ 包含了额外的内存芯片硬件来检测内存故障。如果内存芯片出现故障，电路就能发现问题并报告，而不会导致程序崩溃。这种*校验内存*（parity memory）在几年后就被取消了；据我所知，除了在需要极端可靠性的特定应用外，现在已不再可用。\n\
  \n另一方面，人类非常擅长处理计算机不好甚至无法处理的类型。例如，人类非常擅长从被大量背景噪音干扰的句子中提取含义。相比之下，数字手机（至少也是计算机）拥有一种令人恼火的习惯，只要噪音水平超过内置阈值，它们就会保持沉默。\n\
  \n本章的剩余部分将查看更接近告诉计算机“洗碗”（或其他同样模糊的任务）的指令。\n\n## 为“人类计算机”编程\n\n在深入演示如何编写计算机程序之前，我先通过向你展示一个引导人类行为的程序，让你更好地观察你面对的是什么。编写引导人类的程序比编写计算机硬件程序要容易得多。这是因为我们人类在处理彼此关系方面很有经验——这让我们对人类及其工作方式有一定的熟悉和理解。（至少我是这样假设的。）我们还共享共同的人类语言；不需要将一切都翻译成\
  \ 0 和 1。\n\n### 创建算法\n\n更换轮胎的指令非常直观，大致如下：\n\n1.  升起汽车。\n2.  取出固定故障轮胎在汽车上的螺丝。\n3.\
  \  取出轮胎。\n4.  装上新轮胎。\n5.  安装螺丝。\n6.  放下汽车。\n\n好吧，即使是这些日常术语也可能是模糊的：从技术上讲，螺丝固定的是汽车上的*轮子*，而不是轮胎。为了简单起见，假设“轮子”和“轮胎”这两个术语是同义词，并且计算机将它们理解为同一个东西。\n\
  \n\n\n\n\n尽管这些指令看起来非常详尽，但它们仍然并不构成一个程序。这样一组指令被称为 `algorithm`（算法）——它是对要执行步骤的描述，通常处于高抽象层。算法是详尽的且具有通用性的。我可以使用这个算法来修理我遇到过或未来将要遇到的任何爆胎。但算法并不包含足够的细节，足以让我们那故意装得迟钝的人类计算机来执行这项任务。\n\
  \n### 设置换轮胎语言\n\n在编写程序之前，我们需要一种我们都能认同的语言。在本书的剩余部分中，这种语言是 `C++`，但在本示例中，我使用了一种虚构语言：`TCL`（换轮胎语言）。我专门针对换轮胎问题调整了\
  \ `TCL`。\n\n`TCL` 包含了几个换轮胎世界中常见的名词：\n\n* `car`（汽车）\n* `tire`（轮胎）\n* `nut`（螺母）\n\
  * `jack`（千斤顶）\n* `toolbox`（工具箱）\n* `spare tire`（备胎）\n* `wrench`（扳手）\n\n`TCL` 还包含了以下动词：\n\
  \n* `grab`（抓取）\n* `move`（移动）\n* `release`（释放）\n* `turn`（旋转）\n\n最后，执行 `TCL` 的处理器需要计数和做出简单决策的能力。最后，`TCL`\
  \ 处理器知道像 `up`（向上）对比 `down`（向下）、`left`（向左）对比 `right`（向右）以及 `clockwise`（顺时针）对比 `counter-clockwise`（逆时针）等方向。\n\
  \n这些 `TCL` 中的单词就是换轮胎机器人（虚拟的人类计算机）所理解的所有。任何不是换轮胎语言部分的指令都会让人类换轮胎处理器露出一脸困惑。\n\n# 构建程序\n\
  \n现在是将是用日常英语编写的算法转换为用换轮胎语言编写的程序。这并没有看起来那么简单。例如，“Remove the lug nuts”（卸下螺母）这个短语。实际上，这句话有很多没有说明。`remove`\
  \ 这个词不在处理器的词汇表中。此外，该短语中从未提到 `wrench`（这是计算机认识的词），尽管我们都知道必须用到 `wrench`。我们不能假设计算机知道我们所知道的。\n\
  \n（如果你还没有换过爆胎——并且不知道卸下螺母需要 `wrench`，或者不知道螺母是什么——那么现在先跟着做就好。你会明白的。）\n\n以下步骤仅使用换轮胎语言中包含的动词和名词\
  \ `implement` 了“Remove a lug nut”（卸下一个螺母）这一短语：\n\n1. `Grab wrench。（抓取扳手）。\n2. `Move\
  \ wrench` to `lug nut`（将扳手移动到螺母）。\n3. `Turn wrench counterclockwise five times`（逆时针旋转扳手五次）。\n\
  4. `Move wrench` to `toolbox`（将扳手移动到工具箱）。\n5. `Release wrench。（释放扳手）。\n\n此时，考虑这个换轮胎语言示例中隐含的\
  \ `syntax`（语法，要求的词序）方面：\n\n* 每个命令都以单个动词开始。\n* 动词 `grab` 需要一个名词作为对象。\n* 动词 `turn`\
  \ 需要一个名词、一个方向以及旋转次数。\n\n尽管如此，这段程序片段应该足够易读（毕竟，这不是一本关于换轮胎语言的书）。\n\n![warning.eps](img/warning_fmt.png)\
  \ 你可以通过对换轮胎语言的快速浏览学会，但你必须学习每个 `C++` 命令的语法。否则它将无法运行。\n\n程序从第 1 步开始，依次执行每个步骤，直到到达第\
  \ 5 步。在编程术语中，我们说程序从第 1 步 `flows` 流向第 5 步。当然，程序并没有去任何地方——处理器在完成所有工作——但 `program flow`（程序流）是这种步骤平滑执行的常用术语。\n\
  \n即使略微检查这个程序也能发现一个问题：如果没有螺母怎么办？我想在没有螺母的螺栓上旋转 `wrench` 是无害的，但这样做浪费了时间，不是我心中的良好解决方案。换轮胎语言需要一种分支能力，允许程序根据外部条件采取某条路径。我们需要如下的\
  \ `IF` 语句：\n\n```\n1. Grab wrench.\n2. If lug nut is present // 如果存在螺母\n3. {\n4.\
  \ Move wrench to lug nut.\n5. Turn wrench counterclockwise five times.\n6. }\n7.\
  \ Move wrench to toolbox.\n8. Release wrench.\n```\n\n程序像之前一样从第 1 步开始并抓取一个 `wrench`。但在第二步中，在程序对着空螺栓徒用地挥动\
  \ `wrench` 之前，它会检查是否存在螺母。如果是，流程像以前一样继续执行 3、4 和 5 步。如果没有，程序流将跳过这些不必要的步骤，直接进入第 7 步将\
  \ `wrench` 归工具箱。\n\n在计算机语言中，你说程序执行了逻辑表达式 `is lug nut present?`（螺母是否存在？）。该表达式返回 `true`（是，螺母存在）或\
  \ `false`（否，那里没有螺母）。\n\n![tip.eps](img/tip_fmt.png) 我所说的“步骤”（step），编程语言通常称之为 `statement`（语句）。`expression`（表达式）是一种返回返回值的语句类型，例如\
  \ `1 + 2` 就是一个表达式。`logical expression`（逻辑表达式）是一个返回真或假值的表达式；例如，“这本书的作者帅吗？”的值就是 `true`。\n\
  \n![warning.eps](img/warning_fmt.png) 换轮胎语言中的 `{ }` 是必要的，用于告诉程序如果条件不成立则跳过哪些步骤。\n\
  \n程序像之前一样从第 1 步开始并抓取一个 `wrench`。但在第二步中，在程序对着空螺栓徒用地挥动 `wrench` 之前，它会检查是否存在螺母。如果是，流程像以前一样继续\
  \ 3、4 和 5 步。如果没有，程序流将跳过这些不必要的步骤，直接进入第 7 步将 `wrench` 归工具箱。\n\n![tip.eps](img/tip_fmt.png)\
  \ 我所说的“步骤”（step），编程语言通常称之为 `statement`（语句）。`expression` 是一种返回值的语句类型，例如 `1 + 2` 就是一个表达式。`logical\
  \ expression` 是一个返回真或假值的表达式；例如，“这本书的作者帅吗？”的值就是 `true`。\n\n更好的方法是在换轮胎语言中添加某种“循环和测试”语句：\n\
  \n```\n1. Grab wrench.\n2. If lug nut is present\n3. {\n4. Move wrench to lug nut.\n\
  5. While (lug nut attached to car) // 当螺母连接在汽车上时\n6. {\n7. Turn wrench counterclockwise\
  \ one turn.\n8. }\n9. }\n10. Move wrench to toolbox.\n11. Release wrench.\n```\n\
  \n这里程序从第 1 步流向第 4 步，就像一样。但在第 5 步中，处理器必须做出决定：螺母连接着吗？第一次通过时，假设答案是肯定的，处理器将执行第 7 步并逆时针旋转扳手一次。此时程序返回第\
  \ 5 步并重复测试。如果螺母仍然连接，处理器就会重复第 7 步。最终，螺母会松动，第 5 步的条件将返回 `false`。此时，程序的控制将传递到第 9 步，程序将像以前一样继续。\n\
  \n以下程序扩展了语法，包含了遍历螺母的能力。该程序无论轮上有多少螺母都有效：\n\n```\n1. Grab wrench.\n2. For each lug\
  \ bolt on wheel // 对于轮子上的每个螺栓\n3. {\n4. If lug nut is present\n5. {\n6. Move wrench\
  \ to lug nut.\n7. While (lug nut attached to car)\n8. {\n9. Turn wrench counterclockwise\
  \ one turn.\n10. }\n11. }\n12. }\n13. Move wrench to toolbox.\n14. Release wrench.\n\
  ```\n\n\n\n\n该程序的开始方式与之前一样，都是从工具箱中拿出一把扳手。然而，从`Step 2` 开始，程序会对轮子上的每个螺母钉循环执行 `Step\
  \ 1` 到 `Step 12`。\n\n注意 `Steps 7` 到 `10` 仍然会对每个螺钉重复执行。这被称为`嵌套`循环。`Steps 7` 到 `10`\
  \ 被称为`内层循环`；`Steps 2` 到 `12` 是`外层循环`。\n\n整个程序由算法中每个步骤的相似实现相加组成。\n\n## 计算机处理器\n\n\
  从汽车上卸下轮胎看起来是一项非常简单的任务，但在专门为换轮胎设计的语言中，仅仅为了取下螺母就需要`11` 条指令。一旦完成，这个程序可能包含超过`60` 或 `70`\
  \ 个步骤，并带有许多循环。如果你添加了逻辑来检查如螺母滑丝或缺失等错误条件，则需要更多的步骤。想一下，仅仅为了在显示屏幕上移动窗口这样平庸的事情，需要执行多少条指令（记住，典型的屏幕可能显示`1280\
  \ x 1024`或超过一百万个像素）。幸运的是，尽管计算机处理器很笨，但它运行非常快。例如，你 PC 中的处理器每秒可能可以执行几十亿条指令。你通用处理器中的指令并没有什么——仅仅移动一个像素就需要几条指令——但当你一次可以处理十亿条指令时，滚动区区百万像素就变得易如牛排。\n\
  \n计算机不会执行任何它没有被程序过的东西。创建一种`换轮胎语言`还不足以解决我的平胎——必须有人编写程序指令，一步步描绘出计算机将要做。编写编写旨在处理可能出现的所有特殊情况的真实世界程序并非易事。编写一个工业级程序可能是你可以承担的最具挑战性的任务。因此，问题变成了：“为什么要费劲呢？”因为一旦计算机被正确编程，它就可以反复、不知疲倦地执行所需的功能，而且速度通常比人类控制要快。\n\
  \n## 计算机语言\n\n当然，`换轮胎语言`并不是一种真正的计算机语言。真正的计算机没有像`grab`（取）或`turn`（转）这样的机器指令。更糟糕的是，计算机通过一系列\
  \ 0 和 1 来“思考”。每个内部命令无非一组二进制数序列。真正的计算机拥有像 `01011101` 这样的指令，它可能会给专用寄存器中包含的加 `1`。尽管在\
  \ `TCL` 中编程可能很难，但通过编写长数字字符串来编程更加困难。\n\n![technicalstuff.eps](img/technicalstuff_fmt.png)\
  \ 计算机的本地语言被称为`机器语言`，通常表示为以二进制（二进制）或十六进制（十六进制）编写的数字序列。以下表示了来自第 3 章中`Conversion`程序的前\
  \ 64 个字节。\n\n```\n<main+0>: 01010101 10001001 11100101 10000011 11100100 11110000\
  \ 10000011 11101100\n<main+8>: 00100000 11101000 00011010 01000000 00000000 00000000\
  \ 11000111 01000100\n<main+16>:00100100 00000100 00100100 01110000 01000111 00000000\
  \ 11000111 00000100\n<main+24>:00100100 10000000 01011111 01000111 00000000 11101000\
  \ 10100110 10001100\n<main+32>:00000110 00000000 10001101 01000100 00100100 00010100\
  \ 10001001 01000100\n```\n\n幸运的是，再没有人用机器语言编写程序了。很早时候，有人发现对于人类来说，将`ADD 1,REG1`理解为“向寄存器\
  \ 1 中包含的值加 1”，比理解`01011101`要容易得多。在“机器语言时代”，程序员用这种所谓的`汇编语言`编写程序，然后将其提交给一个名为`汇编器`的程序，该程序将这些指令中的每一条转换为对应的机器语言指令。\n\
  \n人们编写的程序被称为`源代码`，因为它们是万恶之源————开玩笑的——实际上是因为它们是程序的源。计算机实际执行的 0 和 1 被称为`目标代码`，因为它们是令人烦扰的对象。\n\
  \n\n\n\n当我说 C++ 是`符号化的`时，我的意思是它并不啰嗦；它使用符号而不是像 COBOL 等语言那样的长单词。然而，一旦你习惯了这些符号的含义，C++\
  \ 就非常易读。之前在 COBOL 中显示的相同摄氏度转华氏度的代码在 C++ 中形式如下：\n\n```cpp\ncin >> celsiusTemp;\n\
  fahrenheitTemp = celsiusTemp * 9 / 5 + 32;\ncout << fahrenheitTemp;\n```\n\n第一行将一个值读入变量\
  \ `celsiusTemp`。随后的计算正如之前一样，将此摄氏温度转换为华氏度；第三行输出结果。\n\n与其他高级语言相比，C++ 还有其他几个优势。其之一是，C++\
  \ 是通用的。几乎每种存在的计算机上都有 C++ 编译器。\n\n此外，C++ 是高效的。高级语言尝试自动完成的任务越（（为了让你的编程工作更轻松），其生成的机器代码效率往往就越低。对于像书中大多数小型程序来说，这并不会太大影响，但在处理大量数据时（例如在屏幕上移动像素，或者当你需要极快的实时性能时），它会产生巨大的差异。Unix\
  \ 和 Windows 使用 C++ 编写，而 Macintosh 操作系统是用一种与 C++ 非常类似的语言编写的，这并非偶然。\n\n本书剩余章节的目标是让你学会用\
  \ C++ 编程。你不需要把 C++ 语言的每一个细节都背进脑子里，但你最终将掌握足够的知识来编写一些非常酷的程序。\n\n# 第 2 章\n\n### 安装\
  \ Code::Blocks\n\n## 本章\n\n- ![arrow](img/arrow.png) 复习编译过程\n- ![arrow](img/arrow.png)\
  \ 安装 Code::Blocks 开发环境\n- ![arrow](img/arrow.png) 使用默认程序测试你的安装\n- ![arrow](img/arrow.png)\
  \ 复习常见的安装错误\n\n在本章中，你将回顾如何使用 C++ 源代码创建可以在 Windows、Linux 或 Macintosh 计算机上运行的可执行程序。然后，你将安装书中后续部分用到的\
  \ Code::Blocks 集成开发环境——并构建一个默认测试程序来检查安装情况。如果一切运行正常，当你读到本章结束时，你就准备好开始编写和构建自己的 C++\
  \ 程序了——当然，这需要一点帮助！\n\n## 复习编译过程\n\n你需要两个程序来创建自己的 C++ 程序。首先，你需要一个`text editor`（文本编辑器）来输入\
  \ C++ 指令。任何能够生成纯 ASCII 文本字符的编辑器都可以；我曾使用 Windows 自带的记事本编辑器编写过程序。然而，一个了解 C++ 语法的编辑器会更好；它可以节省你大量的打字时间，有时会在你输入时突出显示你可能犯的任何错误，就像拼写检查器在文字处理器中突出拼写错误的单词一样。\n\
  \n你需要的第二个程序是`compiler`（编译器），它将你的 C++ 源语句转换为计算机可以理解和解释的机器语言。这种从源代码 C++语句转换为机器代码的过程被称为`building`（构建/编译）。从图形上看，该过程看起来类似于图\
  \ 2-1。\n\n构建程序的过程实际上有两个步骤：C++ 编译器首先在名为`compiling`（编译）的步骤中将你的 C++ 源语句转换为机器可执行格式。然后，在第二步名为`linking`（链接）中，将你程序中的机器指令与\
  \ C++ 标准带的一组库的指令相结合，创建一个完整的可执行程序。\n\n![9781118823873-fg0201.tif](img/9781118823873-fg0201_fmt.png)\n\
  \n图 2-1：C++ 程序开发过程。\n\n如今大多数 C++ 编译器以名为`Integrated Development Environment`（集成开发环境）或\
  \ `IDE` 的软件包形式出现。IDE 将编辑器、编译器和其他几个实用的开发程序包含在一个包中。这不仅让你无需单独购买这些程序，还通过将它们合并为一个包来提高效率：\n\
  \n- 编辑器可以快速调用编译器，而无需你手动来回切换。\n- 大多数 IDE 中的编辑器提供了快速查找和修复代码错误的方法。\n- 某些 IDE 包含可视化编程工具，允许程序员在屏幕上绘制对话框等常见窗口。\n\
  - IDE 自动生成显示屏幕上框所需的 C++ 代码。\n\n\n\n\n安装向导随后将显示你可以选择安装的组件列表。参见图 2-3。使用默认设置即可。\n\n\
  ![warning.eps](img/warning_fmt.png) `MinGW Compiler Suite` 选项出现在屏幕上并在旁边带有复选标记是至关重要的。该选项用于安装\
  \ C++ 编译程序。\n\n6. **点击 Next（下一步）。**\n\n下一个窗口要求你选择安装位置。该窗口还会告知你 `Code::Blocks` 在你的硬盘上需要多少空间（大约\
  \ 250MB，取决于你选择的选项）以及可用空间有多少。如果你没有足够的空磁盘空间，必须在继续之前删除一些录制的 YouTube 视频以腾出空间。\n\n![9781118823873-fg0203.tif](img/9781118823873-fg0203_fmt.png)\n\
  \n图 2-3：检查 MinGW Compiler Suite 会安装 `Code:: Blocks` 用于编译你程序的 GNU C++ 编译程序。\n\n7.\
  \ **默认安装位置可以的，所以当你确定有足够的磁盘空间时，点击 Install（安装）。**\n\n此时，`Code::Blocks` 安装向导真正开始工作了。它提取出几十个文件，并将其安装在无数个子目录中，其复杂程度凡人难以跟上。此过程可能需要几分钟。\n\
  \n8. **当安装完成后，会出现一个对话框，询问你现在是否要运行 Code::Blocks。选择 No（否）。**\n\n如果到目前为止一切顺利，将出现图 2-4\
  \ 所示的 Installation Complete（安装完成）窗口。\n\n![9781118823873-fg0204.tif](img/9781118823873-fg0204_fmt.png)\n\
  \n图 2-4：Installation Complete 窗口表示 `Code:: Blocks` 已成功安装。\n\n9. **点击 Next（下一步）。**\n\
  \n最后，出现 Completing the Code::Blocks Setup Wizard（完成 Code::Blocks 安装向导）窗口。这最后一步会创建启动应用程序所需的图标。\n\
  \n10. **点击 Finish（完成）。**\n\n你已经安装了 `Code::Blocks`，但仍需确保它已为书中程序进行了正确配置。请跳转到本章节后面的“Setting\
  \ up Code::Blocks”部分。\n\n## Ubuntu Linux 安装\n\n`Code::Blocks` 的 Linux 安装版不包含 `gcc`\
  \ 编译程序，因此安装是一个两步过程。首先，你需要安装 `gcc`。然后你可以安装 `Code::Blocks`。\n\n### 安装 gcc\n\n`gcc`\
  \ 编译程序在 Linux 中可以轻松获得。按照以下步骤安装它：\n\n1. **在命令行提示符输入以下命令：**\n\n```sudo apt-get update\n\
  sudo apt-get upgrade\nsudo apt-get install g++\n```\n\n标准的 Ubuntu Linux 发行版包含一个\
  \ GNU C 编译程序，但不包含 C++ 扩展；特别是，它没有 C++ 2011 标准扩展。前两个命令更新并升级你已有的工具。第三个命令安装 C++。\n\n\
  2. **在命令行提示符输入以下命令：**\n\n```gcc --version\n```\n\n我的 Ubuntu 13.04 下载了 GNU C++ 版本\
  \ `4.7.3\\`。你使用 `4.7.1` 或更高版本也没问题。如果你使用的是更早的版本，某些 C++ 2011 特可能无法正常工作，但在其他情况下应该是好的。\n\
  \n![tip.eps](img/tip_fmt.png) 如果你使用的是 Debian Linux，命令是相同的。如果你使用的是 Red Hat Linux，请将命令\
  \ `apt-get` 替换为 `yum`，这样你就会得到：\n\n```sudosudo yum install g++\n```\n\n### 安装 Code::Blocks\n\
  \n对相关人员幸运的是，Ubuntu 软件中心提供了一个适用于 Ubuntu 的 `Code::Blocks` 版本。许多其他 Linux 版本也包含类似于软件中心的功能。按照以下步骤安装\
  \ `Code::Blocks`：\n\n1. **点击 Ubuntu 桌面上的软件中心图标。**\n2. **从可用软件列表中选择 Code::Blocks。**\n\
  \   安装过程开始开始。\n   `Code::Blocks` 会搜索你的硬盘以寻找你的 C++ 编译程序。如果 `Code::Blocks` 找到了你的 C++\
  \ 编译程序，你就完成了。\n   ![tip.eps](img/tip_fmt.png) 如果 `Code::Blocks` 没有找到你的 C++ 编译程序，请执行以下步骤。\n\
  3. **启动 Code::Blocks。**\n4. **选择 Settings（设置）⇒Compiler（编译器）。**\n5. **选择 Compiler\
  \ Flags（编译标志）选项卡。**\n6. **选择 Toolchain Executables（工具链可执行文件）选项卡。**\n7. **选择 \"...\"\
  \ 图标。**\n8. **导航到 `*/usr**，除非你将 `gcc` 编译程序安装在默认路径 `/user/bin` 的地方。**\n9. **在对话框中设置以下选项：“C\
  \ compiler”应该是 `gcc`，“C++ compiler”应该是 `g++`，“Linker for dynamic libs”应该是 `g++`。**\n\
  10. **点击 Finish（完成）。**\n\n你已经安装了 `Code::Blocks`，但仍需确保它为书中的程序进行了正确配置。跳转到本章节后面的 “Setting\
  \ up Code::Blocks”部分。\n\n## Ubuntu Linux 安装\n\n`Code::Blocks` 的 Linux 安装版不包含 `gcc`\
  \ 编译程序，因此安装是一个两步过程。首先，你需要安装 `gcc`。然后你可以安装 `Code::Blocks`。\n\n### 安装 gcc\n\n`gcc`\
  \ 编译程序在 Linux 中可以轻松获得。按照以下步骤安装它：\n\n1. **在命令行提示符输入以下命令：**\n\n```sudo apt-get update\n\
  sudo apt-get upgrade\nsudo apt-get install g++\n```\n\n标准的 Ubuntu Linux 发行版包含一个\
  \ GNU C 编译程序，但不包含 C++ 扩展；特别是，它没有 C++ 2011 标准扩展。前两个命令更新并升级你已有的工具。第三个命令安装 C++。\n\n\
  2. **在命令行提示符输入以下命令：**\n\n```bash gcc --version\n```\n\n我的 Ubuntu 13.04 下载了 GNU C++\
  \ 版本 `4.7.3\\`。你使用 `4.7.1` 或更高版本没问题。如果你使用的是更早的版本，某些 C++ 2011 特可能无法正常工作，但在其他情况下应该是好的。\n\
