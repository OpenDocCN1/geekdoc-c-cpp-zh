  md: '# Model-Based Testing 41


    and coherent mathematically, the term quasi-infinite is used to indicate this
    finite unit that is of too large a size to be enumerated under realistic conditions.


    To avoid associating a probability with each input vector, it is necessary to
    define probability distributions for the various variables associated with a transition.


    Variables that are real, integers a list of elements, and Boolean are considered
    random variables with well-known probability laws.


    For this, consider two types of real random variables:


    +   - rectangular distribution: the probability of selecting an element in a given
    interval follows a continuous uniform law;

    - Gaussian distribution: when a variable is associated with this distribution,
    it is then necessary to specify its average and its standard deviation.


    An integer can be associated with a rectangular distribution. Just like a real
    variable, if the definition is reduced to only one interval, the distribution
    is discrete uniform. If the definition set consists of several disjoint intervals,
    the probability of selecting one interval among others is introduced. After selecting
    this interval, the condition inside this unit is then discrete uniform.


    For enumerated or Boolean variables, the probability of selecting each item is
    defined. For "object identifier", "bits chains", "bytes chains", "list of items"
    or "character string" variables, there is no probability distribution; the values
    that take these variables are given during the construction of the input vector.


    The probabilities of selecting the input vectors are calculated then according
    to the variables that define them.


    # 2.2.2. Automatic allocation of probabilities


    The allocation of probabilities can be made manually or semi-automatically. It
    is not limited to just the model transitions, but it also applies to the set of
    the data born by a transition, i.e. the input vectors.


    It is possible to automatically affect the probabilities according to predefined
    objectives, such as automatically allocating probabilities to allow an identically
    intense test for the whole application, or to facilitate and optimize the coverage
    criteria.


    An automatic allocation of probabilities is useful for several levels:


    +   - during the construction of a new model when the usage probabilities are
    unknown, the automatic allocation of probabilities makes it possible to allot
    profiles by defect (interesting for the generation) and thus enables system validation;'
