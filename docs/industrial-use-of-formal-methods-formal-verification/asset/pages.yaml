    # 2.2.3. Principles of generation


    Generation techniques in test cases are diverse:


    +   – the set of test cases satisfying an objective;

    – the set of test sequences offering complete coverage of a reference;

    – the set of test sequences that are random.


    Once the model is created, it is possible to use it like a support for generating
    a test case. Several strategies are possible: either deterministic or random generation.


    The following are examples of generation algorithms. Several other solutions exist,
    such as generating the most probable test case or even a test case with input
    vector values at the bounds of defined intervals.


    # 2.2.3.1. Random generation


    DEFINITION 2.5.– Let E be the set of states of a Markov chain, E = {e₁, ..., eₙ}.
    A path C is defined as a finite set of ordered transitions beginning with the
    transition leaving the [Start] state and finishing with the transition arriving
    in the [End] state. The path corresponds to the different transitions encountered
    during the realization of a process, knowing that the creation of a path stops
    at the first instance of the [End] state.


    A transition is associated with at least one input vector characterized by the
    various variables associated with the input.


