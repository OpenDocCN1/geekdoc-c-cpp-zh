- pgno: 30
  md: 'SPARK – A Language and Tool-Set 17


    Part of the SHOLIS software was assessed to be at the highest Safety Integrity
    Level, SIL 4, requiring the use of all of the above techniques in the relevant
    components of the SHOLIS software.


    Overall, the source code for SHOLIS consists of approximately 27,000 lines of
    SPARK, of which 14,000 are executable statements (as opposed to declarations).
    Full data and information flow analysis of all of the source code was performed
    by the Examiner, and proof of exception-freedom was also carried out for all of
    the code. The flow analysis performed on SHOLIS supported the demonstration of
    the separation of the safety-critical and non-critical code elements.


    In addition, for the safety-critical code elements, the code was proved to be
    a correct implementation of the corresponding formal specifications, written in
    the Z notation [ZI 85], and proof that the code maintains the system''s top-level
    properties was also performed.


    Proof of the certification conditions generated from the SHOLIS source code entailed
    proving some 9,000 VCs. Of these, more than 90% were discharged automatically
    by the Examiner and Simplifier. In the decade or since the SHOLIS software was
    first developed, the proof tools have been further improved, so that using the
    latest version of the Simplifier improves the success rate for automatic proof
    to more than 95%, more than cutting in half the number of VCs requiring additional
    manual proof effort.


    Development of the SHOLIS software demonstrated that the use of formal methods,
    proof of correctness and exception-freedom for SPARK code was a real and practical
    possibility. In addition, the EXOLIS development project revealed that proof of
    both the Z formal specification and the SPARK source code can be significantly
    more cost-effective at finding faults than traditional testing activities [KIN
    00], in part they allow faults to be found and corrected earlier in the development
    process.


