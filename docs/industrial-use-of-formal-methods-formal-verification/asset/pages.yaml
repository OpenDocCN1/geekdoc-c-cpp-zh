    defined by the SQO model.


    To reach the SQO-2 quality model, the code cannot contain systematic run-time
    errors or a construction that does not. To achieve this, the Polyspace* results
    must not contain a red error.


    To increase software quality and reach the SQO-3 level, the code must not include
    unreachable branches, which implies that Polyspace* results must not contain gray
    code.


    As the unproven code (code colored in orange by Polyspace*) may not always be
    a problem, the SQO model establishes different thresholds to define the number
    of operations of type that can remain uncorrected and un-justified in the code
    for SQO-4, SQO-5 and SQO-6.


    For example, SQO-4 requires that 80% of potential divisions by zero are proven
    safe or justified. If Polyspace* automatically proves 70% of these operations
