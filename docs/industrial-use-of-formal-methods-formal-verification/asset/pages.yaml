- pgno: 284
  md: '# Conclusion


    # 8.2.5.4. Qualification


    The different standards (DO 178, ISO 26262, CENELEC EN 50128) reveal/or will reveal
    the notion of the "qualification file".


    Qualification of a tool depends on its impact on the final product:


    +   - an impact on the executable (compiler, data generator, etc.);

    - an impact on the verification and/or validation (test tools, etc.);

    - no impact.


    The qualification file can rely on different activities:

    - analysis of the use of a certificate (commonly termed cross-acceptance): if
    a certificate exists, it is necessary to verify that the tool is suited to what
    it is intended to be used for (same normative referential, similar safety level,
    etc.);

    - experience construction: an inventory of all uses (those that are known and
    those of the business). It must be capable of justifying the version used, levels
    of safety, size, sectors, etc.;

    - establishment of a qualification; test runs of the tool can be undertaken so
    as to show that the former is usable for a given safety level.


    The notion of qualification is an important notion, which is linked to the implementation
    of tools in the production process of a software application.


    All the tools used can be subjected to a qualification phase.


    Regarding formal methods, the question of qualification of tools is of fundamental
    importance, since the complexity of technologies implemented (prover, model-checking,
    etc.), the confidentiality aspect (licensed algorithm, etc.), the innovation aspect
    (new technology, few users, etc.), and the maturity aspect (product resulting
    from research, product made using a "free" license, etc.) do not permit trust
    for it to be built easily.


    # 8.2.5.5. Advantages/disadvantages


    The programming language used facet anomaly detection and for this, it is necessary
    to implement strong typing and modular and structured programming.


    As Table 8.12 shows, one of the principal difficulties while using a language
    such as C or C++ resides within demonstrating the "proven" character of the translator.
    Use of a programming language:'
