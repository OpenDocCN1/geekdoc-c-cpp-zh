    # 2.2.5.4. Calculating the characteristics of reliability


    Once the probability of not encountering an error during the execution of a type

    of software is known, it is necessary to introduce a temporal variable to obtain

    reliability.


    Let $P_u$ be the probability of not having an error during the execution of the

    software, $\mu$ is the real number expressing the amount of activations of the
    software

    per unit of time t. Equation [2.9] presents the calculation of reliability:


    ```

    $R(t) = P_u^{inf} \quad [2.9]$

    ```


    Software uses are done independently of each other according to the same

    profile. Let X be the random variable associated with the behavior of the software

    during an execution: X = \{error, no error\}. The probability that there is an
    error

    during a software execution is given by equation [2.10]:


    ```

    $P [X = error] = 1 - P_u \quad [2.10]$

    ```


    Let Y be the random variable recording the number of executions with no error,

    Y follows an amended geometrical law [TRI 82] and the expectation that Y equals

    nP_u(1 - P_u)$. The MTTF is expressed then by equation [2.11]:


    ```

    $MTTF = \frac{P_u}{\mu (1 - P_u)} \quad [2.11]$

    ```


    The MTTF makes it possible to determine the stop criteria of the test campaign

    adapt to each type of software.


