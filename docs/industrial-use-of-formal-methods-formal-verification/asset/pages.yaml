  md: 'The complex languages are harder to verify, be by hand or with an automatic
    tool. To simplify this verification, most standards such as CEI/IEC 61508 [IEC
    98], CENELEC EN 50128 [CEN 01], and ISO 26262 [ISO 11, Table A.3] limit the use
    of a language to a restricted subset.


    To meet these standards, a development team must use language constructions that
    are adhered to the standard. Generally, the quality model illustrated in Table
    4.2 recommends certain coding rules of the MISRA-C:2004 [MIS 04] to be adhered
    to. In addition to making the coding easy to verify, coding standards also tend
    to make the code easy to read, maintain and carry on other other targets. Generally,
    the adoption of a coding standard does not require that all the rules of this
    standard are verified.


    The quality model above defines then subsets of rules of coding standards MISRA-C:2004
    [MIS 04]. The first subset, which is required for objects SQO-1, includes rules
    such as:


    +   - 8.11: The static storage class classifier shall be used in definitions and
    declarations of objects and functions that have internal linkage;

    - 8.12: When an array is declared with external linkage, its size shall be stated
    explicitly or defined implicitly by initialization;

    - 13.3: Floating-point expressions shall not be tested for equality or inequality;

    - 20.2: Dynamic heap memory allocation shall not be used.


    The second subset, required for levels SQO-5 and SQO-6, includes rules such as:


    +   - 8.7: Objects shall be defined at block scope if they are only accessed from
    within a single function;

    - 9.2: braces shall be used to indicate and match the structure in the non-zero
    initialization of arrays and structures;

    - 13.1: Assignment operators shall not be used in expressions that yield a Boolean
    value;

    - 20.3: The validity of values passed to library functions shall be checked.


