- pgno: 209
  md: '# 6.2.3. 2009 – tool comparison


    To verify if the current tools can be modified to reflect industrial needs, I
    prepared a brief comparison of some existing tools. I have restricted this comparison
    to some tools that I knew well and have been used in my application field, that
    is in railways application. These tools are Atelier B, Rodin, and SCADE¹. This
    study was performed three years ago, so some subsequent changes are possible at
    this time.


    # 6.2.3.1. Methodology


    As this not a scientific comparison, the way that I choose to determine the classification
    of each tool in each category was my personal feeling while adopting those tools
    in our development process.


    It is also prudent to state the maturity differences among these tools. While
    SCADE and Atelier B have been in the market for a long time, Rodin was about to
    be released in its first official version (version 1.0). This means that these
    two tools already received a lot of feedback from their industrial users, helping
    them to change the direction when users were not satisfied (it was the Atelier
    B case, where after a lot of complaints about the user interface, its GUI was
    changed completely), while the last one has not yet received or implemented completely
    this feedback.


    The comparison methodology was based on three aspects, as follows:

    - capability: in this case, we try to verify how these tools can satisfy project
    constraints;

    - usability: basically, what''s the difficulty the user faces when trying to use
    the tool;

    - adequacy to the current development process: that is, how the tool can better
    fit in the process without causing too many changes in the way it has performed
    so far.


    To make a classification of these aspects I used a simple ranking method, as follows:

    - 1 Very difficult;

    - 2 Medium;

    - 3 Easy.


    We present the results in Table 6.1.


    1 Versions: Atelier B 3.7, SCADE 6.0, and Rodin 0.9.'
  merge: -1
  img_proc: true
