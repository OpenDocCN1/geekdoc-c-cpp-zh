    about them.


    #  5.5. A Perfect Developer example


    We will specify a bounded queue in terms of a sequence. Some expected properties

    of the specification will be declared and verified. We will then refine the queue
    by using

    a ring buffer to store the elements.


    #  5.5.1. The specification


    The specification (Listings 5.1 and 5.2) declares a class Queue with a generic

    type parameter X (which stands for the type of the elements we wish to pass through

    the queue). The class has an abstract section describing the abstract data model,
    and

    a interface describing the public interface to the class.


    The abstract data comprises:


    +   - an integer "capacity" defining the maximum number of elements that

    the queue is permitted to store;

    - a variable "b" of sequence type to store the elements. The sequence type in

    Perfect has the characteristics of both list and array types. For example: like
    a list,

    with variable length and it supports concatenation; but its elements can be accessed

    by an index just like an array. It also supports insertion or deletion of elements
    at any

    position:


    +   - a history invariant, which constrains the variable "capacity" to remain
    constant

    after construction. A history invariant is distinguished from a normal invariant
