- pgno: 11
  md: '# Objective of this book


    In [BOW 95, ARA 97], industrial feedback involving formal techniques can be found,
    and, notably, a report on the B method [ABR 96], the LUSTRE language [HAL 91,
    ARA 97], and SA+, the predecessor to SCADE¹¹ [DOR 08]. Other work such as [MON
    00, MON 02, HAD 06] provide a panorama of formal methods with a/or more scientific
    point of view.


    Given the presentation of the context and of the state of the literature, our
    objective is to present concrete examples of industrial use of formal techniques.


    By formal techniques, we mean the different approaches based on mathematics making
    it possible to demonstrate that a software application abide by some properties.


    Note that the standard use of formal techniques consists of making specification
    and/or design models, but formal techniques are seen more and more as a possibility
    of making a verification (static analysis of code, demonstration of abiding by
    properties, good management of floating-point calculations, etc.).


    This work is related to two other books by the same authors published by ISTE
    and John Wiley & Sons in [2012 BOU 12, BOU 12].


    The current book is dedicated to the presentation of formal techniques, as the
    SPARK Ada (Chapter 1) Mr. Melo¹² (Chapter 2), Alta Rica (Chapter 3), Polyspace¹
    (Chapter 4), Escher Verification Studio Perfect Developer (Chapter 5) and the
    B method (Chapters 6 and 7).


    The first book is dedicated to the presentation of different formal methods, as
    the B method (Chapters 2 and 3), SCADE (Chapters 6 and 7) MATLAB/ SIMULINK (Chapters
    4 and 5) and Control Build¹³ (Chapter 8).


    [Bou 12d] industrial examples of implementation of formal techniques based on
    static analysis as abstract interpretation; examples of use of ASTREE (Chapters
    2 and 3), CAVEAT (Chapter 3), CODEPEER (Chapter 6), Frama-C (Chapters 7 and 8),
    and Polyspace¹ (Chapters 4 and 5) tools.


    I thank all the manufacturers who have taken the time to redraft and improve these
    chapters.


    11 It should be noted that SCADE was initially a development environment basing
    on itself and since version 6, SCADE has become an entirely separate language
    (the code generator for version 6 takes most of its input from a SCADE model,
    and not a LUSTRE code).


    12 To find out more about Melo, visit www.all4tec.net/index.php/All4tec/matelo/mateloproduct.html.

    13 To find out more about the ControlBuild tool, visit www.geofoft.com/en/article/controlbuild.'
