    variables: openDoor and closeDoor. Moreover, since the emergency button is part
    of a train, the respective variable emergencyButton (and the modification event
    toggleEmergencyButton) is also included in this sub-component. RecTrainMsg sends
    messages to the trains and the content is stored in the variable permit. Although
    variable permit is set on the content of the messages exchanged between Train
    and Track, that variable is read by trains. That is why it is allocated to this
    sub-component. The events that change the speed of the train are also included
    in this sub-component: brake, stopBraking, changeSpeed due to variables speed
    and braking as depicted in Figure 7.19.


