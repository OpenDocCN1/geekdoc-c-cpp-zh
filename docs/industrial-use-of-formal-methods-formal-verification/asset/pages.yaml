    # 7.4.2. Abstract model: MetroSystem_M0


    We model a system constrained by trains that operate on tracks. The tracks are
    divided into smaller parts called sections. The most important (safety) global
    property introduced at this stage states that two trains cannot be in the same
    section at the same time (which would mean the trains might collide).


    We need to ensure some properties regarding the routes (set of track sections):


    +   - Route sections are all connected: sections should be all connected and cannot
    have space between them.


    +   - There are no loops in the route sections: sections cannot be connected to
    themselves and cannot introduce loops.


    These properties can be preserved if we represent the routes as a transitive closure.
    We use the no-loop property proposed by Abrial [ABR 08] and used to model a tree-structured
    file system in Event-B [DAM 08]: a context is defined and this property is proved
    over track section relations and functions. The reason we choose this formulation,
    instead of transitive closure, which is generally used, is to make the model easier
    to prove. Context TransitiveClosureCtx containing the transitive closure property
    can be seen in Figure 7.11.'
