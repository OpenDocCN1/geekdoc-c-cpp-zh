    elements are in strictly increasing order. This could be simplified somewhat by
    using the built-in function "isndec" instead of using quantifiers. The third precondition
    is to avoid overflow in the code when we calculate the mid point between high
    and low array indices. Escher maxof(size_t) is an ECV construct that returns the
    maximum value representable by type size_t.'
