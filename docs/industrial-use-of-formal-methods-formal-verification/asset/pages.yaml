- pgno: 263
  md: '# Industrial Use of Formal Methods


    DEFINITION 8.4.– REQUIREMENT¹¹¹. A requirement is a statement that translates
    a need andor constraints (techniques, costs, time, etc.). This statement is written
    in a language that can be natural, mathematical, etc.


    To get a clear identification, a requirement is a labeled element (the label allows
    a single identification) that characterizes an element of the system to be carried
    out. For each requirement, it is necessary to know the source.


    Within the framework of the execution, the requirements (definition 8.5) will
    be analyzed and taken into account during each stage of the cycle of the system.
    In the context of the phases of hardware and/or software design, a requirement
    could be translated in the form of properties (definition 8.2) carried out the
    components (software or hardware).


    Remember (Figure 8.3) that there are two families of requirements, the functional
    ones that are related to the behavior of the system, and the nonfunctional ones
    (also called extra-functional requirements) that are related to quantifiable objectives
    (performance, level of safety, reliability, availability, etc.). In Chapter 2
    of [RAM 09] and Chapter 3 of [RAM 11], we have presented some examples of requirements
    management in the automobile and rail industries.


    ![](img/701040363c568d7f491808943697cd68_263_0.png)


    **Figure 8.3.** Different types of requirements


    Table 8.3 is an extract from [STAN 94], which allows for emphasis of the fact
    that over 30% of the causes of failure in production originate from incomplete
    requirements, incomplete needs descriptions and unrealistic needs.


    ¹¹ AFIS is the French Association of System Engineering. One of its areas of work
    is specifically dedicated to managing requirements. For more information: www.a
    fi s.fr.'
