- pgno: 28
  md: 'SPARK – A Language and Tool-Set 15


    Indeed, as reported in [GER 03], the choice of programming language is important
    in determining a number of factors, including: the level of analysis that is possible;
    the value achieved by the analyses (strong, rigorous reasoning at one end of the
    spectrum, versus many false alarms from weaker analysis tools which stop defects
    from being detected); and the typical defect density achieved. In Table 1.1 of
    [GER 03], which compares SPARK with Ada, Pascal, and C among other languages,
    the average defect density found in the SPARK code is easily an order of magnitude
    lower than the averages for Pascal and C, six times better than the average per
    day and an impressive two orders of magnitude better than the worst results for
    C. Using a language like SPARK for performing analysis at an early stage are major
    factors in the development of very low defect density software.


    CbyC has delivered software with in-service defect rates of 0.4 defects per KLOC
    or less, without compromising productivity. Whole-lifecycle productivity of 30
    LOC per day has been achieved with this approach. This compares favorably with
    the average defect density reported for the higher MMR Levels 4 and 5 [SO 09].
    Practical experience from a number of projects using CbyC-type approaches for
    developments ranging in size from 10 KLOC to 200 KLOC confirms that the use of
    CbyC can consistently lead to low defect software.


    SPARK supports the CbyC approach by:


    +   - being a language with clear and unambiguous semantics, making it easier
    to reason about the correctness of the delivered code;

    - providing notations for expressing strong contracts, making the required behavior
    of a software component clear to users without the need to delve inside the package
    body and look at the executable code;

    - having tools that enforce these contracts, so that correspondence with the specification
    can be established with effective tool support.


    # 1.4. Industrial applications of SPARK


    SPARK has been in industrial use for more than two decades, and there is a growing
    and active user base. Long-standing users include the Eurofighter Consortium (for
    embedded software on the Eurofighter Typhoon aircraft), Lockheed Martin, Rockwell
    Collins, Goodrich Engine Controls, the UK Weapons Establishment, AerMacechi, Westinghouse
    Rail Systems and ALSTOM Transport, to name but a few.


    SPARK applications cover on-board aircraft systems, control systems, rail systems,
    cryptographic and security applications, in many areas where software integrity
    is an important consideration.'
  merge: -1
  img_proc: true
