- pgno: 51
  md: 'The relation of inclusion is represented by an arrow going from the subchain
    to the higher-level string to which it is attached. Figure 2.3 shows subchains
    that are impossible to include at various places in the inclusion graph, a trigger.
    The reason for prohibiting inclusion is then represented on the link connecting
    the subchain to the higher level string.


    If the same subchain appears several times in the same model, there will then
    be two possibilities to consider various calculations (for example, involving
    coverage).


    It is indeed entirely possible to treat the various graph representations either
    as only one graph or, on the contrary, as different graphs.


    # 2.2.2.5. Profile concept


    The reliability is the probability that a specific user will not encounter a failure
    during system use at a given time. For this reason, it is necessary to be able
    to handle several profiles of the same system to guarantee the reliability for
    each type of user.


    To build a profile of system use, each input vector is associated with a probability.
    Thus, each transition is associated with the sum of the probabilities of selection
    of the input vectors that are associated with it.


    With the help of some modifications [LEG 05], each graph included in the model
    can therefore be compared to a Markov chain in discrete time.


    # 2.2.2.6. Distributions of the input vectors


    As we saw previously, the input vectors are associated with the model''s transitions.
    Each input vector, moreover, is associated with a probability of being selected.
    The input vectors associated with the same transition have the following properties:


    +   - they are described according the same type;

    - whatever the input vector chosen for the transition, the state where the chain
    is found identical;

    - the probability of the transition in the Markov chain is thus equal to the sum
    of the probabilities of the input vectors associated with this transition.


    This modeling involves a probability distribution on two levels: the probability
    $p_ij$ of selecting the transition (i,j) and the probability $p_{uv}$ of selecting
    an input vector knowing that the transition (i,j) was chosen.'
