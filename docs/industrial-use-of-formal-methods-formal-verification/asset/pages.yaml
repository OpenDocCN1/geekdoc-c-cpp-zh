    # 5.5.3. Refining to a ring buffer


    To refine the specification to use a different data representation, we add an
    internal section for the concrete data. See Listing 5.3.


    Listing 5.3. Queue specification refined to ring buffer implementation (part 1)


    In this case, we define a fixed-length sequence "ring" (the ring buffer), a variable
    "hd" giving the index of the oldest element in the queue, and a variable "tl"
    giving the index of the next element in the queue. Number of elements in the ring
    buffer is constrained by the invariant to be exactly one greater then the capacity.
    Making one greater means that it is possible to distinguish between an empty and
    a full queue, but it also means that there will always be at least one unused
    element. We constrain "hd" and "tl" to be less than the number of elements in
    the buffer, so that they are always valid indices to buffer elements.'
