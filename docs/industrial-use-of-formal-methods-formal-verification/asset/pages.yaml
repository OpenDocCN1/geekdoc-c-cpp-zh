  md: '142 Industrial Use of Formal Methods


    +   - systematic run-time errors have been corrected;

    - potential run-time errors have been corrected or justified;

    - data flow analysis has been carried out.


    On the basis of these criteria, the document defines six objectives for software
    quality (known as software quality objectives or SQOs).


    +   SQO-1 unto recommends reaching a restricted set of criteria, whereas SQO-6
    requires all criteria to be satisfied. The selection of an adapted SQO level depends
    on:

    - the criticality of the project;

    - process standards used within the company; these can, for example, require the
    application of the capability maturity model integration (CMMI) or software process
    improvement and capability determination (SPICE);


    +   - or not standards such as CE/IEC 61508 [IEC 98], ISO 26262 [ISO 11], CENELEC
    50128 [CEN 11], or DO 178B [RTC 92].


    Table 4.2 describes the different criteria applicable to SQO objectives. Certain
    criteria have attained thresholds, the crossing of which signifies that the SQO
    objective has been reached.


    For example, to reach SQO-1, the table shows that we need to have defined a quality
    plan, written a detailed design, and verified code complexity metrics.


    To reach SQO-2, it is necessary in addition to this, to respect an initial set
    of coding rules, to have corrected systematic execution errors, and to have verified
    that there are no more ever-ending constructions in the code.


    To reach SQO-3, it is also necessary to show that the code does not comprise unattainable
    branch codes (dead code).


    # 4.10.3. Use of a subset to satisfy coding rules


    General-purpose languages, such as C and C++, have been designed to develop a
    large variety of applications, from office automation applications to critical
    embedded applications.


    With extensions as C99, or extensions linked to compilers such as Visual C++ and
    GNU, these languages have evolved to support constructions that are increasingly
    distant from the original language. These have posed difficulties in the verification
    of complex applications.'
