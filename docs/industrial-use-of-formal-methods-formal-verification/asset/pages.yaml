  md: 'the development of the functions that the aircraft must offer to its customers
    (for example, controlling the speed of the aircraft in flight and on the ground);


    +   - the development of the embedded systems that fulfill these functions (such
    as the thrust reverser deployment system that contributes to slowing down the
    aircraft on the ground);

    - the development of the equipment (such as a computer hosting the software that
    generates the deployment command of the thrust reversers)

    - the equipment (such as a computer hosting the software that generates the deployment
    command of the thrust reversers)


    The applicable analyses of safety are not the same ones for the development of
    systems and data-processing equipment. Different documents describe these analyses.
    Refer to ARP 4754 [SAE 10] for the analyses applicable to aircraft development
    and systems whereas the document DO 178 version B [RTC 921] and DO 254[RTC 60]
    relate to the development of data-processing equipment. In the aeronautical field,
    system development is generally carried out by the aircraft manufacturer whereas
    equipment development is generally carried out by subcontractors. This justifies
    document ARP 4754 is focused on the preliminary aspects of the implementation,
    such as risk analysis, the development of the structure, the establishment of
    requirements, or later aspects of implementations, such as testing the equipment.


    In this chapter, we discuss how to use models formally described with the AltaRica
    language to support safety analyses, which must be carried out when designing
    the structure of the embedded system. These analyses aim at establishing that
    the system structure meets the safety requirements allocated to it.


    The safety requirements are in the following form:


    > “The failure condition FC belongs to a class of severity. The rate of the occurrence
    of FC must be lower than a quantitative objective. No combination meeting a qualitative
    objective must lead to FC"


    A failure condition (FC) is a combination of failure modes applied to the functions
    allocated to the studied system. The failure modes usually taken into account
    are the total or partial loss of function, the detected or undetected erroneous
    behavior of a function, and the inadvertent activation of a function. The failure
    condition can also refer to conditions, which describe the current phase of Flight
    (taxing, takeoff, cruising, etc.), a operating mode (engine 1 off), or an external
    condition (crosswind, contaminated runway, etc.).


    The classes of severity for safety are Catastrophic, Hazardous, Major, Minor,
    and NSE (No Safety Effect). During risk analysis, the failure conditions are classified
    according to their effect on the aircraft and its occupants. The quantitative
    objective associated with a failure condition is a limit that the the rate of
    occurrence (measured)'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'hour of flight) should not be exceeded. This objective depends on the class
    of severity of the failure condition.


    The usual values are $10^{-7}$ for hazardous and $10^{-5}$ for major) for a condition
    Catastrophic. The qualitative objective describes the type of combination of failures,
    which should not lead to the failure condition. They are usually simple, double,
    or triple combinations.


    The assessment of the capacity of an aircraft system to maintain the qualitative
    or quantitative safety objectives is done mainly using fault-trees or reliability
    block diagrams. The analysis is done while considering the failure conditions
    by one. For each, the reliability expert builds a tree or a diagram, which gradually
    breaks down the failure condition into more elementary states until basic failures
    are obtained (leaves of the tree).


    This type of model is, in fact, a Boolean formula where literals (leaves of the
    tree) are labeled with probabilities. The associated tools make it possible to
    calculate the minimal combinations of literals (or minimal cut sets) which cause
    the initial failure. The analysis of the order of these minimal cut sets (the
    number of literals intervening in a combination) makes it possible to easily determine
    if the objectives are met. The probability of the occurrence of the initial failure
    condition based on the literal probabilities can also be calculated effectively,
    starting from the minimal cut sets or directly on the tree.


    However, as the systems become more complex, the approach becomes increasingly
    difficult to control. The number of trees grows with the number of the systems.
    Furthermore, new systems integrate more and more functions with basic physical
    components and can be dynamically reconfigurable. Reliability experts need models
    closer to the system to help share knowledge and monitor the spatial and temporal
    propagation of failures.


    Some languages as AltaRica aim to overcome these limits while making it possible
    to build propagation models that are dynamic, compositional, and close to architectures
    that support the assessments of qualitative and quantitative safety requirements.


    # 3.3. AltaRica language and tools


    # 3.3.1. The AltaRica language


    The AltaRica language [GRI 98, ARN 00, POI 00] was created by the Laboratoire
    Bordelais de recherche en informatique (LaBRI)(Bordeaux Laboratory for Computer
    Science Research) at the University of Bordeaux. It makes it possible'
