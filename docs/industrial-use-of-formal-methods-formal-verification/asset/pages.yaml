  md: '# Conclusion 271


    From 1994, some experience feedback regarding the implementation of C (see for
    example [HAT 94]) has revealed that it was possible to define a sub-assembly of
    C usable to create software applications needing a high level of safety (SSIL3
    and SSIL4).


    In fact, since the end of the 1990s, the MISRA-C [MIS 98, MIS 04] standard, which
    was developed by the Motor Industry Software Reliability Association (MISRA)$^{22}$
    has become a standard for the C language.


    MISRA-C [MIS 04] specifies programming rules (see the examples of possible to
    avoid execution errors provoked by poorly-defined constructions, wherein C language
    structures are not completely defined) and misunderstandings between those people
    in charge of production (legible code, implicit code, etc.). Several tools enable
    the MISRA-C rules to be automatically verified.


