    Table 6.1. Comparison table


    # 6.2.3. Chart comparison


    To justify these results, I can say that:


    +   - Atelier B:

    - the capability to solve the project constraints is not so bad, but you do need
    to know a lot of the formal language and constructs to be able to have easy proof
    obligations.


    +   - as version 4 of Atelier B demonstrates better usability, comments I have
    so far are on the previous version where the lack of a good User Interface makes
    it difficult to use,

    - since it allows us to go from the specification to the code, it can be considered
    a good tool for that purpose, but as the interactions during the middle phases
    (refinements) are some times cumbersome, it cannot receive the higher grade;


    +   - Rodin:

    - as is not very different from Atelier B, similar results could be seen. the
    capability to solve the project constraints is good, but you do need to know a
    lot of the formal language and constructs to be able to have proof obligations.

    - the way Rodin was constructed helps an inexperienced person who just need to
    fill in some fields to have a bad specification. However, the absence of a text
    editor that could help a more inexperienced person and speed up the specification
    process lowers its classification,

    - as, at the moment of the evaluation there were no possibilities of decomposition,
    and the ability to help only in the system specification phase, turn it in a difficult
    tool to be used in the current process;


    +   - SCADE:

    - even based on a different concept, what formal methods are behind the scene,
    it has a great capability to deal with project constructs, but you still need
    some formal background to construct correct models.

    - as it was built from the very beginning to be an industrial tool, its usability
    is its strongest point, with good intent and a lot of features that captivate
    the user. A lot of things can be based on templates and patterns, what helps a
    lot as well, besides the capability to go from the specification to the code,
    it has also other complementary tools that help you in important auxiliary tasks
    in the project, such as requirement management, traceability, etc.


    # 6.2.4. Late 2009 – writing a formal specification – point of view


    B [ABR 96] is the formal method that allows us to produce proof obligations that
    demonstrate correctness of design and the refinement. Nevertheless, there is no'
