    # 3.4.2. System of electric power generation and distribution


    # 3.4.2.1. Architecture of the electrical system


    The role of the electrical system is fundamental in an aircraft since it supplies
    many critical elements (i.e. airfoil servo control, embedded computers, etc.).
    As the loss of electric power can lead to the loss of aircraft control, this system
    must respect the following safety requirement: the total of electric power is
    considered catastrophic. The rate of occurrence of this failure condition must
    be lower than 10⁻⁸ per of hour and single failure should not lead to this failure
    condition.


    To respect this requirement, an electrical system of an aircraft such as the A320¹
    is organized in two subsystems: the normal system and the back-up system. Each
    subsystem includes generators, supply bars, transformers, circuit breakers, converters
    and junctions.


    > To know more about the architecture of the Airbus, see Chapter 6 of [BOU 09].'
