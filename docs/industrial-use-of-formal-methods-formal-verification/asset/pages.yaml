- pgno: 211
  md: "standard mechanism for mapping requirements to formal specifications. To overcome\
    \ this issue, different solutions have been proposed by researchers. In [PON 06],\
    \ the authors have presented traceability between KAOS requirements and B. Some\
    \ authors are investigating the use of the Problem Frames approach [JAC 01] as\
    \ a possible response. A mixed solution using natural language and UML-B has been\
    \ proposed by [JAS 09]. However, these approaches use non-standard artifacts for\
    \ requirement specifications, which are difficult for designers to adopt formal\
    \ methods unless they spend time to learn them.\n\nUse cases [JAC 92] can be considered\
    \ as the de facto industry standard for requirement specifications. They provide\
    \ a good way to capture the end user interacts with the system by detailing scenario-driven\
    \ threads. A typical use case describes a user-valued transaction in a sequence\
    \ of steps expressed in a natural language, which makes use cases easy for most\
    \ end-users. In [LED] the author has presented an approach for building specifications\
    \ from use-case models. This approach is similar to ours, but his project has\
    \ focused on building the object-oriented paradigm (including UML diagram) to\
    \ formal methods. His method also maps each use case as a unique operation, which\
    \ is incorrect since each use case has many transactions according to Jacobson\
    \ [JAC 87].\n\nAnother relevant point about use cases is the possibility to derive\
    \ test cases. One of the new development models is the so-called Test Driven Development\
    \ [BEC 02], where the input information used to generate the source code is the\
    \ test case, instead of use case scenarios or other requirement documentation.\n\
    \nWe tried an approach for starting B specifications using use and test cases.\
    \ Use case transaction identification can be used as a guideline for defining\
    \ B operations, including the pre- and post-conditions. In the same way, test\
    \ cases can help in the definition of global invariants and constraints.\n\n#\
    \ 6.2.4.1. Mapping UC to B\n\nThe aim of this approach is to fulfill some intermediate\
    \ phases in the proposed development process. So far, the use of formal methods\
    \ in the development process is only from the design phase where the requirements\
    \ are already well defined, but this is not the case with industrial projects.\n\
    \nBased on that, the method proposed here would be useful during the early phases,\
    \ to help in both directions:\n\n+   - to the top, helping the requirements elicitation\
    \ (what might be combined with other techniques and methods, such as Jackson's\
    \ Problem Frames);\n to the bottom, helping the creation of the first abstract\
    \ formal model, in the sense that it can support the first definitions."
