    # 1.3.3. Correctness by construction


    An approach by Altran Praxis² has applied for many years, and which effectively
    exploits the language features and design style of SPARK, is “Correctness by Construction”
    (ByC) [HAL 02, CHA 05]. This approach aims to deliver software with low in-service
    defect rates at high whole-lifecycle levels of productivity, achieving software,
    which is robust and resilient to change throughout its lifecycle. The SPARK contractual
    model provides good support for this.


    ² Hereafter, we shall use the simpler name Praxis to refer to the company Altran
    Praxis Ltd.'
