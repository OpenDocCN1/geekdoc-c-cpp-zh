    # 4.10.1. Begin by establishing models and objectives for software quality


    As the systems they develop are becoming increasingly sophisticated, software
    teams must meet rigorous software quality objectives, either dictated by the company
    itself or imposed by its clients and national regulation authorities.


    For these objectives to be reached, and ideally to reach zero defects, it is necessary
    to define a quality model. This model establishes specific objectives for software
    quality, with metrics and thresholds to be reached. These objectives provide a
    mechanism through which teams can communicate their objectives and the state of
    their development, both internally and with people who are external to their company.


    # 4.10.2. Example of a software quality model with objectives


    The Software Quality Objectives for Source Code [NIS 96] document describes an
    example of software quality models comprising well-defined objectives. It was
    written by different automobile constructors and part manufacturers in partnership
    with MathWorks®. This quality model includes a list of objectives linked to software
    quality, which requires the use of a tool for the static analysis of code.


    Conformity with these objectives is evaluated according to the following criteria:


    +   - a quality plan is in place;

    - there is a detailed design;

    - complexity code metrics have been defined and verified;

    - adherence to coding rules has been demonstrated (for example, respect of MISRA-C
    [MIS 04]);

    - the code does not include an unattainable branch code;

    - the code does not include a construction that does not end (infinite loop, for
    example);'
  merge: -1
  img_proc: true
