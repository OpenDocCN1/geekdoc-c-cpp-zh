- pgno: 10
  md: '# xii Industrial Use of Formal Methods


    The method and the SCADE environment are associated with industrial tools.


    For example, Atelier B and the B-Toolkit, marketed by CLEARSY² and B-Core³ respectively,
    are tools, which completely cover the development cycle proposed by the B method
    (specification, refinement, code, and proof generation). Atelier B⁴ can be accessed
    for free from version 4.0 onward.


    Formal methods rely on different formal verification techniques such as proofs,
    model checking [BAI 08], and/or simulation.


    The use of formal methods while in full development remains marginal, given the
    number of lines of code. In effect, there are currently many more Ada [ANS 83],
    [ISO 99] or C++ lines of code, which have been produced manually rather than through
    a formal process.


    That is why other formal techniques have been implemented to verify the behavior
    of a software application written in a programming language as C or Ada. The technical
    principle known as abstract interpretation [COU 00] of programs makes it possible
    to evaluate the behaviors of a software application through a static analysis.
    This type of technique has, in the last few years, rise to several tools such
    as Polyspace⁸, Caveat⁹, Absint¹, Frama-C¹⁰ and/or ASTREE¹.


    The efficacy of this static analysis techniques has progressed greatly with the
    increase in power of business machines. It should be noted that these techniques
    generally necessitate the integration of complementary information as pre-conditions,
    invariants and/or post-conditions in the manual code.


    SPARK Ada¹ [BAR 03] is one approach where the Ada language [ANS 83] has been expanded
    to introduce these complementary elements (pre-, post-, invariant), and an adapted
    suite of tools has been defined.


    +   2 To find out about the CLEARSY company and Atelier B, visit www.clearsy.com.

