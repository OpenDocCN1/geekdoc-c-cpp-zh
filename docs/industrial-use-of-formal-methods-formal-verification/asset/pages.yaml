    automatically from the model to the implementation.


    # 5.12.2. Code generation


    Generation of code by Perfect Developer in a subset of C suitable for embedded
    systems is desirable, but the C language is far from ideal for writing high-integrity
    code. However, we believe that a small and carefully-chosen subset of C++ could
    offer substantial advantages, such as encapsulation. We propose to define such
    a subset, supporting it in eCv, and adding it as a target language for code generation
    in Perfect Developer. The potential for a standardized treatment of concurrency
    emerged with the 2011 C++ standard.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# 5.12.3. Concurrency


    We would like to add support for concurrency. At its present stage of evolution,
    Perfect Developer does not check for deadlock, livelock, or race conditions. It
    is very hard to reason about concurrency using mutable shared variables. The twin
    approaches of communicating objects (such as Communicating Sequential Processes)
    and transactional memory may offer a way at forward.


    # 5.12.4. Extension


    # 5.12.4.1. C++


    These language features facilitate better encapsulation and greater type-safety.
    Some loop invariants will be derived automatically [STA 99].


    # 5.12.4.2. MISRA


    Reporting MISRA violations will be extended such that ECv can serve as a MISRA
    compliance checker as well as a program verifier.


    # 5.12.4.3. SPARK Ada


    Perfect Developer can already generate partial code in the SPARK-annotated subset
    of the Ada language [BAR 03]. We would like to improve the translation of complex
    specifications to SPARK code annotations. We hope that when support for Ada generics
    is added to the SPARK language, we will be able to generate complete SPARK Ada
    code in Perfect Developer.


    # 5.12.5. Conclusion


    In this chapter, we have given simple code examples of both our major tools, along
    with some explanation. We have given instances of the use of our tools in industrial
    systems where safety is critical, to a greater or lesser extent (DefStan 00-55
    SIL 4 and IEC-61508 SIL 2). We have given a detailed instance of a software consultancy
    firm, which believes whole-heartedly in the value of formal methods of software
    development in novel applications. Lastly, we have mentioned the advantages of
    Perfect Developer as a teaching tool in the classroom. We hope that this range
    of applications gives a fair representation of the capabilities of our software
    development tools at this stage in their evolution.


    Our aim continues to be to raise the quality and reliability of software products
    to a level where even minor software defects are an exceptional occurrence. In
    time, we'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'hope provably-correct software development will become standard practice for
    most applications in mainstream industry.


    By producing tools to reduce the cost of developing critical software, we assist
    the evolution of software engineering towards delivering software that is at least
    as reliable as the hardware on which it runs. In theory, software can be constructed
    to conform perfectly to precisely stated requirements; but it is in the nature
    of things that always have some possibility of failure.


    # 5.13. Glossary


    The reference manuals are available online [ECV 11, PDL 11] if further information
    is required.


    Assertion


    An assertion is a declaration of some condition that we must hold (“is true”)
    at point in an implementation. Perfect Developer will verify this.


    Ghost


    A ghost (whatever) is one (whatever) that has no executable code.


    Perfect methods ghost methods, ghost operators, ghost selectors, and ghost schemas.


    For instance, when defining functions to represent abstract properties, it sometimes
    happens that the property is only used in declaring pre-conditions, post-conditions,
    class invariants, etc.


    Postassertion


    A postassertion is an assertion given at the end of a method (i.e. after the result
    or postcondition) that expresses one or more conditions that should be true when
    the method completes. Each condition should have something to say about the return
    value (for a function or operator) or the final values of modified objects (for
    a schema).


    For example: we have a class Money in which we declare a division-by-integer operator
    that is supposed to round up the result. If our specification really does round
    up, we expect that as we start with a non-zero amount, we end up with a non-zero
    result. We can express this expectation in a postassertion like:


    ```

    operator /(other: nat): Money

    pre other = 0

    ^= Money((amount + other - 1) / other)

    assert amount !== 0 => result.amount != 0;

    ```'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'A postassertion is different from a postcondition. A postassertion specifies
    everything that the client can expect to be true when a method finishes, even
    in the presence of polymorphism, when different objects may be responding differently
    to the same message.


    # Postcondition


    A postcondition says precisely which variables have changed, and what conditions
    are satisfied by the final values of those variables. Postconditions must be complete
    in every way.


    # Precondition


    A precondition must be met before a method is called.


    # Property


    Part of an object''s state, which can be changed.


    # Schema


    A schema is a method that changes something. It may be either the current object
    that is changed, or a parameter.


    # State


    The stored data that a system accesses and alters; in particular, in object-oriented
    terms, the values of an object''s properties (attributes), which can vary over
    its lifetime.


