    #  7.4.11. Conclusion


    We modeled a metro system case study, starting by proving its global properties
    through several refinement steps. Afterwards due to an architectural decision
    and to alleviate the problem of modeling and handling a large system in one single
    machine, the system is decomposed in three sub-components. We further refine one
    of the resulting sub-components (Train), introducing several details in four refinement
    levels.'
