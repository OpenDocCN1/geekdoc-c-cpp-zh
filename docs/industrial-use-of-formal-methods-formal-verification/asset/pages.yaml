  md: '# SPARK = A Language and Tool-Set


    the semantics of the sub-program call in principle depend on the parameter passing
    mechanism chosen by the compiler. A program that exhibits such dependency is said
    to be erroneous, but no simple mechanism is provided to detect such an insecurity.
    The SPARK subset of Ada, augmented by its additional annotations and checked using
    the Examiner, rules out such language insecurities and makes the SPARK code amenable
    to sound analysis.


    # Verifiability


    For high-integrity applications, we have the facilities to prove properties of
    our software. One aspect is of this language simplicity, that in the semantics
    of the language are clear and unambiguous. Another aspect is an annotation language,
    which allows us to express preconditions, post-conditions, and other invariants
    in such a way that with appropriate tool support we can perform the necessary
    mathematical analysis. Furthermore, we want this reasoning to be sound: if it
    is possible to construct such a proof, then we can have confidence that the required
    property generally holds in all cases. This was a major consideration in the design
    of SPARK.


    # Bound and time requirements


    An important application for SPARK was in high-integrity embedded systems. In
    such systems, one frequently wants to be able to establish the maximum amount
    of memory needed, to show that this will not exceed system resources in the embedded
    system. For this reason, SPARK prohibits dynamic storage allocation, and it is
    equally necessary to establish that there are no infinite loops or execution paths,
    that take too long to complete. While the SPARK language and the Examiner do not
    provide explicit support for establishing that such memory and timing requirements
    are met, the rules of the SPARK language subset mean that reasoning becomes much
    however for full Ada without any constraints (N.B. Other tools may be used to
    evaluate worst-case execution time, for instance RuntimeTime [RAP] and Absint
    AIT [ABS], and to undertake stack analysis, as AdaCore''s GNATStack [ADA].


    # Correspondence with Ada


    It was a design goal of SPARK that legal SPARK programs should also be legal Ada
    programs, and thus it should be possible to compile any SPARK program with any
    standard Ada compiler. Thus, although SPARK provides extensions to Ada for flow
    analysis and formal proof, these are in the form of annotations, which are used
    by the Examiner but appear to an Ada compiler to be just comments, which do not
    affect compilation. Since since all SPARK annotations are effectively comments
    as far'
