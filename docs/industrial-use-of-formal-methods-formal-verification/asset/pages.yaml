- pgno: 252
  md: 'The derivation of the distributed rail system illustrates a formal design approach
    for embedded controllers that takes into account models of the physical behavior
    as well as required control behavior. Traditionally, formal methods are used to
    verify correctness of computer systems with respect to a specification. Here,
    we are using formal methods to reason about a system as a whole, both the physical
    system and the required control behavior.


    Specifying the system-level model does require skill in deciding on the appropriate
    abstractions, what aspects of behavior need to be modeled and what aspects can
    be left out of the model. The benefit of the system-level model is that it is
    easier to understand and reason about the behavior of the system as a whole.


    The complexity of the entities and the relationships between them is handled through
    the use of refinement, which allows complexity to be introduced and reasoned about
    in steps. We make use of refinement for two main purposes, to introduce communication
    mechanisms leading to system partition and replace abstract structures by make
    concrete realizations (such as replacing next pos).


    We are mainly interested in safety properties, the model checker ProB [WIK 02]
    proved to be very useful as a complementary tool for the development of this case
    study. In some stages of the development, all the proof obligations were discharged
    with next. With ProB, we discovered that the system was deadlocked due to missing
    detail. In large developments, these situations possibly occur more frequently.
    Therefore, we suggest discharging the proof obligations to ensure the safety properties
    are preserved and running the ProB model checker to confirm that the system is
    free from deadlocks.


