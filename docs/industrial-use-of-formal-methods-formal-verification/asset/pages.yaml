    # 8.2.6. Verification and validation (V&V)


    Creation of a software application must take into account not only the design
    of the software application, but also activities that allow for it to reach a
    certain quality standard.


    Development of a verifiable software application is constrained by the requirements
    of standards associated with each industry (aeronautical [ARI 92], automobile
    [ISO 09], rail [CEN 01, CEN 11], nuclear [IEC 06], and generic [IEC 98]).


    Accomplishment of a quality standard requires demonstration that no fault has
    been introduced during the design and that the product corresponds to the needs,
    which have been identified. Above all else, it is necessary for us to recall what
    verification and validation are.'
