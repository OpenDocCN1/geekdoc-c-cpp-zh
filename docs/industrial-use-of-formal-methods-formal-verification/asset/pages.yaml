    Fortunately, the C language offers an alternative: to define specification

    structs using macros. In C, macros can be defined so as to expand to nothing when

    the program is compiled, so that the specification is invisible to a standard
    compiler

    but visible to our verifier.


    For example, we declare function preconditions using the construct

    pre(expression), having made the macro definition:


    ```

    #define pre(x)  /* nothing */

    ```


    visible to the compiler.


    One small disadvantage of using macros is that, under C89, the number of\arguments
    must be fixed for any particular macro. If the user tries to declare two

    comma-separated preconditions in a single pre clause like this:


    ```

    pre(p1, p2)

    ```


    then the compiler will refuse to compile the program, because it is expecting
    a

    single argument but finds two. However, the following alternative forms:


    ```

    pre(p1) pre(p2)

    pre(p1; p2)

    pre (p1, p2) )

    pre(p1 && p2)

    ```


    all avoid this problem.


