  md: '# Chapter 5


    # Escher Verification Studio

    Perfect Developer and Escher C Verifier


    ### 5.1. Introduction

    Barriers to the widespread adoption of formal methods of software development
    include the perceived difficulty and expense of using them. Software tools are
    needed to make it easier to use mathematical methods.


    We have two tools for developing mathematically verified software: Perfect Developer
    (PD) and Escher C Verifier (ECV). PD takes what may be described as a top-down
    approach, working from a specification, refining it, and generating source code
    in C++, Java, C#, or Ada. ECV uses a bottom-up approach, being a deep static analyzer
    for a safe subset of C. Both tools used the Verified Design-by-Contract paradigm
    to verify each function individually, ensuring they scale to large software systems.


    ### 5.1.1. Escher Technologies Ltd

    Our organization, Escher Technologies Ltd, was founded by Dr. David Crocker in
    1995.


    Our aim was to make mathematically verified software development productive. In
    particular, we wanted to use modern automated reasoning technology to discover


    Chapter written by Judith CARLTON and David CROCKER.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Industrial Use of Formal Methods


    verification proofs. We needed to make it accessible to ordinary software engineers,
    that is, to those who knew about engineering and about computing, but who had
    limited mathematical knowledge.


    As software was becoming more and widely used, and as individual software systems
    were becoming times larger than before, we considered it important to create software
    that would be correct by its method of construction, and which, furthermore, could
    be proved to be correct.


    # 5.1.2. Needs


    Software development tools were clearly needed to facilitate these objectives.
    From the beginning, we aimed to design our tools with a view to overcoming the
    barriers to the widespread adoption of formal methods. We aimed to produce tools
    that mathematical methods relatively easy to use, avoiding mathematical notation
    as possible, and relatively quick to use, saving the developers’ time by having
    an automated prover as proposed to an interactive prover.


    Additionally, we knew from experience that one of the most difficult facets of
    software development by any method (at least, any method in which the developer
    is not the same person as the end-user) is elicitation of the correct requirements
    for the software. Our way of dealing with this was to enable a fully functional
    prototype of the software system to be developed rapidly for approval by end-users,
    with speedy modification of the prototype, if required.


    Following some years of research and development, the Escher Tool was previewed
    in September 1999 at the World Congress of Formal Methods. This was released in
    March 2001 under the name Perfect Developer. It is now in its fifth major version.


    During 2011, Perfect Developer was joined by another tool, Escher C Verifier (abbreviated
    to ECV). The two products are packaged and distributed as components of Escher
    Verification Studio, which is available in a commercial edition and in a capacity-limited
    free edition. Commercial users may license one or both tools.


    For clarity, the Perfect Developer and Escher C Verifier will be described separately
    here. The examples were verified using version 5.1 of Escher Verification Studio.


    # 5.2. Perfect Developer – its inspiration and foundations


    # 5.2.1. Design-by-Contract


    In the late 20th Century, the improvements in computer hardware meant that it
    was becoming easy to write software that was increasingly large and complex. With
    this'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'accelerating growth in size, eliminating errors from the software was more
    and more

    diffult and time-consuming. Computer scientists such as Hoare, Dijkstra, Meyer
    and\many others sought ways of improving methods of development [HOA 69, DIJ 76,

    MEY 88].


    The term Design-by-Contract was introduced with the Eiffel programming language

    MEY 88]. DbC is essentially Hoare logic applied at the level of complete functions

    or other programs. The basic principles are as follows:


    +   - for each class, a precondition and a post condition are specified;

    - whenever a class method is called, the client and the method are bound by a

    contract. The client guarantees to satisfy the precondition at the point of call;
    in return

    the method guarantees to satisfy the post condition at the point of return;

    - when inheritance and inherited methods are overridden in classes,

    relationship between the contracts of the overridden and overriding methods

    must satisfy the Liskov Substitution principle [LIS 94];

    - additional elements such as class invariants and assertions may be included
    in the

    specification in order to ensure that contracts are honoured.


    The Design-by-Contract principle is a powerful addition to software development

    techniques, but it can be hard to ensure that all contracts are honoured. When
    applied

    to software developed in traditional programming languages and enhanced by notation

    for contracts, typically only limited verification of contracts is possible, because:

    - the specified contracts are frequently incomplete, often because the notation
    used

    - even with class invariants and assertions, insufficient information is available
    to

    sp that contracts are honoured;

    - contracts are most naturally and simply expressed in terms of a simple

    abstract data model of a class, whereas the programming language only allows the

    implementation model to be described;

    - the presence of unconstrained polymorphism and reference aliasing introduce
    too

    many unknowns;

    - it is not certain that honouring the contracts is sufficient to ensure that
    the program

    meets its specifications.


    # 5.2.2. Verified Design-by-Contract


    Verified Design-by-Contract [CRO 04a] as supported by Perfect Developer and the

    Escher C Verifier, avoids these issues.


    While we liked the idea of Design-by-Contract, we thought it would be even better

    if the contracts could be mathematically proved to be honoured.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '158 Industrial Use of Formal Methods


    In Perfect Developer:


    +   - contracts are completely specified, while constraining the implementation
    unnecessarily;


    +   - contracts are expressed in terms of an abstract data model, which has a
    specified relationship to the implementation model (if different);


    +   - additional elements such as ghost methods, recursion variants and post-assertions
    complete the information needed to make automatic verification of contracts possible;


    +   - polymorphism and aliasing occur only on demand, instead of by default;


    +   - required or expected behavior of methods or sequences of method calls may
    be described, in addition to the basic contracts.


    By extending the Design-by-Contract principle in this way, using advanced automated
    reasoning technology, Perfect Developer provides functional requirements right
    to code.


    # 5.2.3. Perfect Developer


    Perfect Developer is based on the principle of writing formal specifications for
    systems and developing implementations that are proven mathematically to meet
    the specifications. The specification language used is called Perfect. We do not
    claim that the Perfect language is itself perfect; our claim is that the language
    can be used to produce code, which perfectly implements a precise specification.


    Perfect Developer uses a fully-automatic theorem prover, freeing the developer
    to make good use of time while the proofs are being created. Proving contracts
    mathematically tends to still more complexity, with the inevitability of enormous
    proofs [BUN06]. The proofs are output to file for inspection if required. When
    the theorem prover fails to find a proof, it provides information to help the
    developer to identify the possible problem, including suggestions for misconditions
    or other parts of the specification.


    Perfect Developer can generate code automatically from the verified specification.
    Automatic generation of code allows the developer to view a fully functioning
    prototype quickly. Once the prototype exists, the developer will probably wish
    to check with the end-user that requirements were correctly elicited. Any necessary
    changes are readily made at the specification, and the verifier re-run. A significant
    benefit of this approach is that misunderstandings of requirements are exposed
    earlier in the software development cycle, which reduces cost.


    When Perfect Developer is being used to generate final code by the implementation
    generated by Perfect Developer is unsuitable, or where Perfect'
