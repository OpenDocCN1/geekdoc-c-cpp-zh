    # 5.6. Escher C verifier


    While Perfect Developer starts from the concept of generating code by refining
    a formal specification, many developers of embedded systems destruct code generation,
    preferring to write code by hand, most in C. It was to meet their needs that we
    produced Escher C Verifier, which performs formal verification of C programs.


    +   Our goals were:

    - make it easy to use (the annotation simple, provide suggestions);

    - make a sufficient subset of C for SIL2 and higher software;

    - make the subset compatible with MISRA-C 2004;

    - support a wide range of embedded processors and C and C++ compilers.


    The Escher C Verifier extends the C language with additional keywords and constructs
    needed to express specifications and to strengthen the type system of C.'
