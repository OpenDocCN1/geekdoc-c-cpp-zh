  md: '# Chapter 8


    # Conclusion


    # 8.1. Introduction


    Formal techniques (simulation, model-checking, abstract interpretation, proof,
    etc.) are not new. Indeed, the first papers that cover the subject date from the
    1970s (for examples, see [HOA 69, COW 77, DJ 76]). However, the implementation
    of formal methods dates back to the 1980s [SPI 89, JON 90, HAL 91], with industrial
    use in the 1990s [BEH 93, BOU 06, ARA 97].


    In [BOU 95, ARA 97], we find the early feedback from industrialists concerning
    formal techniques and, in particular, feedback on the B method [ABR 96, BEH 93,
    BEH 96, BOU 06], the language LUSTRE [HAL 91, ARA 97, SAO+] predecessor SCADE,
    such as [MON 00, HAD 06]. Other works, such as provide a panorama of the formal
    methods in a more scientific approach.


    Within the framework of this book, we presented various industrial uses of formal
    methods. These cover various fields (railway, automotive, aeronautics, nuclear
    power, etc.).


    Chapter by Jean-Louis BOULANGER


    +   1 It should be noted that SCADE was a development environment based on the
    language LUSTRE and since Version 6, SCADE became a language of its own code generator
    for Version 6 works well inputting a SCADE model but not a LUSTRE code.'
