    # 3.4. Examples of modeling and safety analysis


    # 3.4.1. Integrated modular avionics architecture


    The embedded systems in modern aircraft, whether they are for military or civilian
    use, are supported more and more by an avionics platform made up of shared resources
    for computation and communication.


    This new architecture on shared resources is supposed to have many advantages,
    like simplifying the installation of the electronic components and their wiring
    board or reducing the number of necessary spare parts. Nevertheless, this architecture
    has an important impact on the development process of embedded systems for two
    reasons that we have studied:


    – a new actor in the development process. It relates to the team in charge of
    designing the avionics platform. From now on, the selection of the data-processing
    equipment is not within the competence of the teams in charge of developing the
    embedded systems consuming shared resources such as flight control, navigation,
    or terrain following systems,'
