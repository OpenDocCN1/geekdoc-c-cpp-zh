    # 3.3.1.3. Semantics of AltaRica


    The article [ARN 00] defines the semantics of AltaRica mathematically. In this
    section, we informally explain the semantics of the Dataflow fragment used.


    AltaRica node describes a mode automaton in which each state is a configuration,
    i.e. a function that associates a value to each state and state variables.


    The initial configurations are defined by the values of the state variables that
    appear in the clause. There are as many initial configurations as acceptable combinations
    of the input variables.


    Once the values of the input and output variables are fixed, the values are associated
    with the outputs after assessment assignments.


    In the automaton associated with the AltaRica node, two configurations are connected
    by an arrow labeled with an event name if, in the starting configuration, guard
    of the transition associated with this event is true and the state variables of
    the arrival configuration are updated in accordance with the assignment of the
    transition. If the variables do not appear in the assignment, they keep the value
    assigned to them in the starting configuration.


    A scenario of model events is a path in the automaton that starts in the initial
    configuration and goes from configuration to configuration by selecting an arrow
    labeled by an event. If, in the current configuration, an arrow labeled by an
    event whose law of probability is not $\text{Dirac}$(0), then all the events whose
    law of probability is not $\text{Dirac}$(0) are not selectable in this configuration.
    This means that the $\text{Dirac}$(0) events have priority compared to the other
    events.


    In the models that we built, use $\text{Dirac}$(0) events to represent the actions
    of automatic reconfiguration whereas we use the other events to represent the
    equipment failures. Thus, in these models, the reconfiguration events are always
    triggered before the next possible failure.


    An AltaRica model made up of several interconnected nodes can be represented by
    a single node containing the set of variables, events, assertions, and transitions
    from the contained nodes. The rules of semantics described previously apply to
    the whole node, which makes it possible to describe the behavior of complete AltaRica
    model. The AltaRica models, which we designed do not contain free input variables
    (all the input variables are connected to an output variable). Consequently, there
    is a single initial configuration for this type of model.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 3.3.2. Modeling the propagation of failures with AltaRica


    We use the AltaRica language to model the propagation of failures. These models
    [McD 94, HEI 01], describe the failure modes that can occur for each component
    of a system. They also describe the way in which these failure modes are propagated
    within the architecture of the system.


    Based on the description of a system, the analyst initially defines a library
    of useful AltaRica nodes to model the system. For example, in the case of an electrical
    power system, we created a library containing nodes describing the useful equipment,
    such as a generator, an electric bar, a switch, a circuit breaker.


    We also built a library of nodes in order to model systems in a more abstract
    way, for example, in the form of a functional architecture. The library contains
    nodes as Function0 and Function2 in the preceding section. Each node represents
    the anticipated failure modes of the modeled component. In the case of an electrical
    component, it can relate to the loss of output voltage or a short-circuit. In
    the case of a functional component, the failure modes considered could be the
    loss of the function, providing an erroneous result, unnecessary operation or
    closure.


    Each failure mode is represented by an event node. Moreover, by defining the possible
    values of the output according to the input values and the status of the component,
    the assertions describe the propagation of failures within the component. To facilitate
    modeling the failure propagation, the values of a variable indicate its status
    from the safety stand point, like an incorrect command or a loss of hydraulic
    power, rather than the real value that this variable can take.


    # 3.3.2.1. Description of the “Terrain Following/Terrain Avoidance” system in
    AltaRica


    The Terrain Following/Terrain Avoidance system (TFTA) provides either the flight
    control system or the pilot of an aircraft with orders to climb or descend so
    that the aircraft maintains a proper altitude compared to the ground. This makes
    it possible for a military aircraft to fly very close to the ground.


    Figure 3.6 shows the principal functions and the data flows of the terrain system.
    The rectangles represent the functions and the hexagons represent the data flows.


    Before TF/TA, the pilot selects the height SelfHeight of the aircraft by using
    a dedicated interface called the TF/TA panel. Then, a vertical acceleration VertAccel
    is computed with the following input flows: SelfHeight (previously defined), TerrainInfo
    (information on the relief provided by the radar), and the speed'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Safety Analysis of the Embedded Systems 93


    of the aircraft (computed by the navigation system). Then VertAccel is sent to
    the flight control system.


    ![](img/701040363c568d7f491808943697cd68_104_0.png)


    Figure 3.6. The terrain-following system


    Simultaneously, a release alarm EmergencyClimbAlarm is calculated on the basis
    of the vertical speed provided by the navigation system and the altitude provided
    by the radio altimeter. This alarm is sent to the flight control system so that
    the aircraft can go up quickly and reach a safe altitude.


    ![](img/701040363c568d7f491808943697cd68_104_1.png)


    Figure 3.7. Alturica model of the terrain-following system


