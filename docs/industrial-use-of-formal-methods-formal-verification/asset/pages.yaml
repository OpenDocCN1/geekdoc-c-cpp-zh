- pgno: 169
  md: '# 5.4. The Perfect language


    When using Perfect Developer, the developer is required to enter a formal specification
    of the system or module to be constructed. The specification is written in a formal
    specification language called Perfect.


    The design goals of the language included:


    +   - Ease of learning and use. To this end, Perfect uses lexical symbols and
    constructs familiar to software engineers, rather than mathematical notation,
    and it supports features found in most modern programming languages.


    +   Among these features are classes to provide encapsulation, inheritance with
    polymorphism and dynamic binding, and genericity:

    - Expressiveness. Perfect includes some constructs from functional programming
    languages that, in many cases, specifications can be expressed without recourse
    to recursion;

    - Ease of proof automation. This has be balanced against expressiveness. For example,
    full functional programming languages are very expressive, but higher-order reasoning
    is much more difficult to automate than first-order reasoning. Perfect includes
    only few constructs (for example, a limited form of left-fold) that requires higher-order
    reasoning.


    +   The following aspects of the system or module to be constructed can be expressed
    in Perfect:

    - variables and data structures describing the abstract state: Perfect supports
    familiar data types such as integers, reals, characters, Booleans, and enumeration
    types. Classes can be declared and class inheritance is supported with polymorphism
    and dynamic binding if required. Class invariants are supported, as are constrained
    types (for example, range-limited subsets of integers and reals);

    - functions that retrieve information from the state and from input, defined by
    preconditions and result definitions;

    - operations that modify the state, defined by preconditions, and postconditions;

    - expected properties and behavior of the system or. These are expressed using
    assertions, property declarations, and ghost schemas;

    - refinement of the abstract state variables into concrete data, where desirable;

    - refinement of functions and operations in sequential and iterative implementations;
    Where abstract data has been refined to concrete data, the developer is required
    to provide refinements for functions and operations that use this data. Elsewhere,
    refinement is optional. Indeed, it is normally omitted, being carried out only
    if the developer wishes to use a more efficient algorithm than the one that Perfect
    Developer would otherwise use.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Although Perfect Developer is intended mainly for specifying software, it is
    possible

    in many cases to use Perfect to model aspects of the surrounding system as well.
    This

    allows properties of the system as a whole to be represented, and hence we can
