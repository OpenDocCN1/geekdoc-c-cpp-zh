- pgno: 203
  md: '# Chapter 6


    # Partial Applications of Formal Methods


    # 6.1. History


    The AeS Group is a Brazilian company, established in 1991. At that time, it dealt
    with building automation. By 1998, it began its involvement in the railway sector
    when the first Brazilian General Door Control System (GDC) for rolling stock doors
    was developed. The aim of this equipment was to interface between train requests
    (operator request, signaling requests, etc.) and the door system itself. In this
    short chapter, its role is critical as major operation of this equipment consists
    of sending an open command to the doors in each cabin. From that time, several
    safety-critical or safety-related systems were developed by AeS, such as "dead
    man control", parts of brake system, speed limit control, etc.


    Due to the advances in technology, many safety functions handled earlier by hardware
    are now responsibility of embedded software. Some standards can be followed to
    increase the safety level. One of the most widely used is the IEC 61508 EHA 07.
    This standard presents four levels of safety (higher level, higher safety, the
    so-called Safety Integrity Levels – SIL). Above SIL2, the use of the formal method
    is required or suggested to achieve a certain level of completeness, robustness,
    and safety, which increases as the level becomes higher. This is a general standard
    that can be applied in several fields, and it is deeply related to the concept
    of functional safety, which means that the safety property is related to a function
    (or behavior) of the systems and not to a simple component (as it is done when
    reliability is the point of study). This is also a base standard for many others,
    among them, the


    Chapter written by Aryaldo G. Russo Jr.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'CENELEC EN 50128, that is specific for the railway domain, and follows the
    principle, although the safety classification is slightly different.


    The goal of using formal methods is to produce an unambiguous and consistent specification
    that is complete, error-free, and with as few contradictions as possible. However,
    it must simple to verify.


    Since 2006, AeS began its studies about formal methods to decide which method
    to use, where to apply it, how to apply it, and etc. Later on, AeS became a part
    of the DEPLOY project as Deploy Aerospace. This chapter outlines case studies
    related to the project.


    # 6.1.1. Context


    Before going through the studies, a brief description of the AeS structure, projects,
    and team is needed to create a context for our applications:


    +   - our Research and Development team is composed of 10 engineers, none of them
    with a formal method background, and one R&D manager (engineer with some formal
    background);

    - during the time of the DEPLOY project, the team received a whole week''s training
    covering the Rodin environment, refinement, and UML-B;

    - as AeS is inserted in the railway domain, several standards need to be followed,
    some of them related to safety, such as EN 50128 and IEC 61508. Those standards
    recommend the use of formal methods for application, which require higher levels
    of safety (SIL3 and SIL4).


    # 6.2. Case studies


    In this section, we present a chronological description of our case studies, trying
    to show what the problem was, what we applied, and what the results were. One
    important point is that in time of our case studies we used formal methods (or
    formal methodologies) from the beginning to the end of the development process.
    we only applied it precisely at the point that thought it would be effective,
    avoiding extra costs and efforts. Nevertheless, we, some time in the future, a
    complete formalized development process might be used and evaluated in comparison
    with the traditional approach. This is the last case study we are carrying out,
    but unfortunately, it was not finished at the time of writing.


    # 6.2.1. Early 2007 – The B method and railway domain – breaking the wall


    During our search of formal methods (that began in 2006), we found that the B
    method had become popular in the railway domain. At that time, the reason'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'was not evident, and we decided to follow this flow. Only theoretical publications
    could be found about the subject and "easy-to-use guide" was available. We learned
    that a Deploy B was to take place in 2007 in Besançon, France. This conference
    was our first contact with the real world of academic development. It was also
    our first contact with people committed to deploying the B/Event-B method and
    with the Rodin tool. Moreover, it was the first contact with our first case study
    — the bridge between continent and isle. And this was the reason for us to now
    be a Deploy associate partner, and to successfully use formal methods in our applications.


    Although this was our first contact, several attempts on the use of formal methods
    had already been made before, and some of them resulted in successful outcomes,
    as as well, and here is our first attempt [EHA 07].


    # 6.2.2. Early 2008 – requirements verification


    In our early attempts to use formal methods, we tried to apply at the beginning
    of the development process, namely, in the process of converting the natural language
    specification into a formal. We could not find a tool that would help us to do
    it manually, but after the formalization process and the notion of abstraction
    and refinement, which helped changing the way of thinking, improving our understanding
    of the specification.


    As a result of this initial attempt, I can cite two small (in terms of size) important
    achievements:


    +   - we could find natural language specification inconsistencies: we formalized
    a small portion of a door system specification, and at that point our objective
    was to formalize exactly what was written in that specification. Doing so we reached
    a point where the formal abstraction could not be proved, and analyzing the case,
    we found contradictory information from the natural language specification;


    +   - we could find missing information on natural language specification. We
    tried to formalize the existing specification of our pilot project: a small system
    that stop the movement of the train in case of human problems with the operator.
    This was a one-sheet only specification. As in the former case, we formalize exactly
    what we had in the natural language specification and discover that there were
    a lot of missing information. This missing points leads us to several assumptions
    that shall be validated with the customer specialist. Only after this validation
    and changing of the natural language specification the formal model could be finished.


    At the end, in both attempts, we realized that we could use formalization as a
    tool to verify and correct customers'' specifications.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 6.2.2.1. Example


    In this small but actual example, we performed an exercise, formalizing a specification,
    and we realized that there was a lot of information that was missing. We had to
    guess (or request clarification from the customer) what the possible options were
    to fulfill the gaps in the specification. This exercise helped changing the way
    we built the specification, using the formal language as a tool to find these
    gaps.


    This system is called "dead man control" and the basic requirements are as follows:
    (the full elicitation is also part of this research):


    +   1) if the train is in automatic mode, the dead man control must be disabled;

    2) if the train is in manual mode, the dead man control must be enabled;

    3) in manual mode the operator must push the control button every X seconds;

    4) after X seconds, if the operator has not pressed the button, the system must
    provide an alarm sound;

    5) after X seconds after the activation, if the operator has not pressed the button,
    the system must stop the train;

    6) whenever the operator presses the button, the system must go back to the normal
    situation.


    Of course, it is just an example. A formal specification of the door system has
    more than 7,000 of event-B lines (only) for the abstract model).


    Another example was used to find a contradiction. The full specification in natural
    language is more than 100 pages long, and the information is spread out. There
    were some contradictions though, which were difficult to find by just reading
    the specification. But, when you try to put it formally, you can see that there
    are some problems.


    Here, you can find the specification based on the natural language document.

    Where''s the mistake?


    # MACHINE Open_contradiction


    # VARIABLES


    ```

    train_stopped boolean. when the train is stopped its value is TRUE

    train_low_speed boolean. when the train speed is below 6 km/h its value is TRUE

    door_authorization boolean. when the train is allowed to open doors its value
    is TRUE

    ememergency_button boolean. if the button is pressed, its value is TRUE

    ```'
