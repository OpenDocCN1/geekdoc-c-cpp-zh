    # 3.3.2.2. Meeting the requirements


    As previously described, a safety requirement is related to a failure condition
    FC, which is a combination of couples "functions, failure modes". To represent
    the safety requirements, nodes "observers" are added to the model. These input
    variables that make possible to observe the status of certain components. An observer
    calculates the value of output variables that indicate the status in which a failure
    condition occurs.


    The safety requirements of the terrain-following system are related to three failure
    conditions:


    +   - terrain-following produces an undetected vertical acceleration (TFTA_erroneous),
    this situation is extremely critical because it could lead to the aircraft crashing.
    In the Altaka model, this situation occurs when the output variable VertAccel.O
    is equal to erroneous and that EmergencyClimbAlarm.O is not equal to ok.

    - terrain-following is lost (TFTA_loss). this situation is supposed to be more
    dangerous than the preceding one because the pilot can stop terrain following
    and fly manually. Nevertheless, this situation can involve cancelling a mission,
    which this situation occurs when the output variables VertAccel.O and EmergencyClimbAlarm.O
    are both equal to lost;


    +   - the terrain-following system produces a spurious alert alarm (TFTA_spurious).
    this situation is not dangerous because the aircraft will carry out a release
    operation which will make it reach safe altitude. This situation can result in
    cancelling a terrain following. In the Altaka model, this situation occurs when
    the output VertAccel.O is equal to ok and EmergencyClimbAlarm.O is not equal to
    ok.


    The node FlightControl is an observer that makes it possible to calculate if one
    of the three failure conditions just presented has occurred. To carry out this
    calculation, FlightControl takes the input and output of the data flows VertAccel
    and EmergencyClaimAlarm. The safety requirements associated with the terrain following
    are summarized in Table 3.1.'
