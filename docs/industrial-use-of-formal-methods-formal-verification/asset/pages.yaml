- pgno: 126
  md: '# 3.6.3. Clarification of the nominal system characteristics: impacts on the
    generic definitions of the failure modes


    Two principal options of modeling are offered to the reliability experts when
    they enter into the details of the transformation models between input/output
    of each atomic component of the system.


    First, they must keep the same approach taken in FMEA or fault-trees. The component
    component propagates only deviations from its nominal role in the system, but
    this nominal role is left implicit. In particular, the barriers to the propagation
    of the failures are not cleared. This approach in particular is tested in [HEI
    01]. Like FMEA or makes it possible to naturally adapt the level of deviation
    granularity to the needed for analysis and to easily observe the relevant conditions.


    However, this approach does not necessarily facilitate defining the logic of propagation.
    This logic depends not only on the current state of the component and the deviations
    received in input, but also on the nominal functional capacities remaining everywhere
    else in the system. Thus, it will have to be deduced from the type of input failure
    if a prior component raised an alarm. In a similar way, the later components will
    have to deduce from the output failures of the component if it contains protection
    mechanisms, which could block the detected failure. This supports the local analysis
    of the propagation, nor the definition of generic components since the models
    of the components then are very often specialized to their place in the architecture.


    The second option of modeling consists of clarifying not only the rules of failure
    propagation but also nominal information. The difficulty is then identifying the
    relevant nominal parameters for study and abstracting them to be able to obtain
    usable results (i.e. at the same calculable time by the tools and syntactic enough
    to be readable by the reliability expert).


    To achieve this, we propose to clarify the normal generic functions of the components
    employed in the system''s architecture and to consider modes of failure for these
    generic functions. It is this approach that was favored in the models presented
    in this chapter, and it facilitates the re-use of components as well as the definition
    of local behaviors.


    On the other hand, it requires determining the local generic functions to model.
    Indeed, each component fills primary functions (for example, "to provide electric
    power" for a generator) and has side effects (for example "to dissipate heat").
    It appears ineffective, even illusory, to seek to model all the generic effects
    of a component.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Industrial Use of Formal Methods


    In fact, it is enough that the selection of the modeled functions and the granularity
    of their description make it possible to correctly propagate and observe the system
    effects to be studied. The way in which the failure conditions can be broken up
    into a combination of elementary failures of certain system components is thus
    a first criterion that directly directs the choice of the local functions to be
    modeled. For example, as the risk "fire" was not studied in our electrical system
    example, the dissipation of heat was not modeled.


    The second criterion concerns having the most complete possible propagation in
    relation to the need for the analysis. This choice is relatively natural in cases
    where the perimeter of the studied system includes with ports of interconnection
    that are well identified and rather homogeneous from the technological standpoint,
    i.e. whose primary functions of generation, transmission, or reception flows of
    the same types. This is the case with "aircraft systems" such as the electrical,
    hydraulic, or control systems, for which the potential interactions between components
    are relatively well-known. Of course, side effects can be incorrectly forgotten
    or neglected, but the compositional model clarifying the nature of the dependencies
    considered between components where the vertical model remains vague.


    In this context, methodological guides are necessary to assist reliability experts
    in choosing models. Thus, one result of the MISSA project [MIS 11], [PAP 11] specifies
    the alternatives of modeling outlined in this section. [ADE 11] proposes a guide
    to model systems with a fine enough granularity for multiple physical fields.


    # 3.6.4. Compositional models of failure propagation: impacts on the overall safety
    process


    Lastly, the possibility of carrying out and effectively analyzing compositional
    models of failure propagations integrating nominal information opens the door
    for many other analyses.


    Thus, this type of approach facilitates the study of the impact of potential software
    errors in system architecture. In the preliminary design phase, this type of hypothetical
    is not closely analyzed, using fault-trees for example, because it would lead
    the expert to manually consider case combinations that would be too large. Detailed
    software architecture can be more easily depicted by compositional models. The
    compositional modeling approach can start with the accurate definition of smaller
    generic components. Then the global model is created by assembling the basic generic
    components. Finally, the available tools remain applicable to the complex global
    model and they provide the users with a very rich set of paths'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Safety Analysis of the Embedded Systems 117


    failure propagation leading to failure conditions. [HUM 08] shows how to carry
    out this type of model and use it to find critical software requirements for a
    safe system. Such sets of paths of failure propagation are also used in [BIE 11]
    to assist the allocation of Development Assurance Level (DAL) to system functions.
    A tool was developed to deal with the allocation rules which are defined in aeronautics
    in the ARP 4754 [SAC 10].


    The proximity of the model of failure propagation to a physical architecture system
    was also used to study the impact of particular risks on the safety of embedded
    systems. Indeed, certain particular risks, such as the bursting of a tire or the
    explosion of an engine, produces debris, which when propelled with a high energy
    on a given trajectory, destroy independent components. These trajectories and
    the link are calculable with 3D modeling tools, such as Catia. However, if it
    is really tedious to establish a link between the components of a Catia model
    and those dispersed or left implicit in a forest of fault-trees, the task is easier
    when a single structured model is considered. The link is then used in the AltaRica
    model to automatically introduce new causes of failures and to check that the
    safety requirements are always maintained [SAG 08].


    Lastly, these direct impacts on the process of system safety assessment, the lessons
    drawn from various experiments encourage us to explore AltaRica modelings for
    other needs, such as the analysis of the safety procedures of aircraft operation
    [MA 11] or the optimization of the aircraft maintenance [TIA 11], and, if necessary,
    to develop new tools, in particular to diagnose [GRI 11] or to forecast [TEI 11]
    the health of an aircraft.


