- pgno: 124
  md: '[BOZ 09] proposes an extension of AADL to deal with the system behaviour when
    faults occur. In this case, the system models can be analyzed with acceptable
    performances.


    # 3.6. Conclusion


    # 3.6.1. An approach to assess the safety of systems tested in aeronautics


    Through two cases of a different nature (modular integrated avionics, a system
    with dominating data processing, and an electrical system), this chapter presented
    how theRica language and associated tools could be used to carry out safety assessments
    in embedded systems.


    The environments of modeling and analysis came out at the beginning of the 2000s
    and the approach was found valuable by research projects and industrial programs.
    Since 2004, it has contributed, for instance, to the certification of the flight
    control of Falcon 7X on Dassault Aviation.


    We observed that the simplicity of the language makes it available quickly to
    engineers and that its flexibility makes it possible to carry out failure propagation
    models of varied granularities; going from the functional view, where only the
    availability and the loss of functions are considered, to views related to the
    physics of electric, mechanical, or hydraulic components of the studied system.


    Moreover, this simplicity, accompanied by restrictions on the expressivity of
    the language, is an important factor in being able to assess complex systems with
    satisfactory response times.


    Certain points remain to be improved in the short term, like the modeling of causality
    loops presented in the section on the electrical system, or the performances of
    computing times for the largest models.


    In the long term, we note that using compositional failure propagation models
    rather radically changes the way of leading the safety assessment of systems and
    that this can have repercussions on the overall reliability process.


    # 3.6.2. Clarification of the system architecture and horizontal exploration of
    the failure propagation: impacts on the scope of analyses


    Indeed, modeling the propagation of failures consists of characterizing the links
    between an initial fault, that is not necessarily observable through an internal'
