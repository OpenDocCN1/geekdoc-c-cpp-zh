- pgno: 15
  md: '# Industrial Use of Formal Methods


    # 1.2. An overview of SPARK


    # 1.2.1. What is SPARK?


    SPARK is a high-level, high-integrity software development language, supported
    by powerful tools. The compilable elements of SPARK are a subset of Ada, but SPARK
    is not just a subset of Ada; an integral part of the language is its annotation
    language, which forms an essential part of the “contractual” specification of
    SPARK programs.


    One element of a program''s contract, in both Ada and SPARK is its “signature”:
    its name, arguments (together with their types and modes) and description (in
    accompanying comments). SPARK programs have additional contractual elements, however.
    These additional elements consist of a set of core annotations, which may be supplemented
    by more specific proof annotations. The core annotations allow for fast, polynomial
    time analysis of SPARK source code to indicate a failure of the code to meet its
    contract (dataflow and informationflow errors). Proof annotations are optional;
    when these are used, they can support the mathematical proof of correctness code.
    The proofs performed can range from proof of exception freedom, at its simplest,
    all the way to a proof of correctness against a formal specification. The relationship
    of SPARK, with its additional annotations, to the “full” Ada language is illustrated
    in the Figure 1.1.


    ![](img/701040363c568d7f491808943697cd68_15_0.png)


    Figure 1.1. The relationship between full Ada and SPARK


    The subset of Ada, which is at the heart of the SPARK language, has been chosen
    to produce a simple, yet powerful programming language, retaining the key features
    that support the construction of software that is demonstrably correct and abstraction'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'through specification. For example, packages, private types, and separate compilation
    are all important aspects of the language, allowing abstract data types and abstract
    state machines to be specified, designed, and implemented in a natural way with
    SPARK. The separate compilation of the package specification and its body mean
    that developers can design the package specification, which forms the contract
    of the users of the package, separately from the body, and "hide" implementation
    details from the users of the package, who should not need to see such details
    to understand what the package does and how to use it. Furthermore, the verification
    of the body of each package is independent of the bodies of any other; only the
    contracts of the packages on which it depends are verification purposes.


    The core SPARK is a sequential programming language. However, in recent years,
    the SPARK language and its principal support tool, the Examiner, have been extended
    to provide support for concurrency in SPARK. This was again achieved by taking
    a subset of Ada concurrency features that is enforced by the Examiner, supplemented
    by additional core annotations to express contractual constraints.


    The extension of the sequential SPARK programming language with this support for
    concurrency is called RavenSPARK, which reflects the origins of the SPARK concurrency
    model in the Ravenscar profile of Ada 95 and Ada 2005.


    Since SPARK is designed with high-integrity software development in mind, let''s
    look at the main influences on the language and how these influences are reflected
    in the language features and the supporting contractual annotations.


    # 1.3. The rationale behind SPARK


    For high-integrity software, it is important that the code be unambiguous, amenable
    to sound and rigorous analysis, and behave predictably when executed. The soundness
    of the language was therefore a major consideration in the design of SPARK, and
    in the choice of a subset of Ada in support of this. The original Language Reference
    Manual for SPARK identified six major considerations in the definition of the
    language:


    +   - logical soundness;

    - simplicity of formal language definition;

    - expressive power;

    - security;

    - verifiability;

    - bounded space and time requirements.'
