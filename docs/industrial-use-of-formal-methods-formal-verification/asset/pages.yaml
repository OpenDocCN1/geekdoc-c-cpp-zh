- pgno: 217
  md: 'In Event-B we are allowed to add events (analog to operations in B) through
    refinements, so we can expand the model without cheating (like with the B method).
    The key point to the horizontal refinements in Event-B is, however, the decomposition;
    by default, INCLUDES abstraction, there is no communication between different
    machines, but one can introduce it through decompositions, based on the concepts
    of shared events (the same event is shared by independent machines) and shared
    variables (the same variable is shared by independent machines, which models complexity
    division inside the same component).


    Using this feature, we will be able to model the architecture communication (through
    shared events) between the CGP and the environment, and model the complexity division
    (through shared variables) between the CGP and its nested components. Once the
    decomposition is done, we can independently refine the decomposed model, getting
    a more expanded model and getting more decompositions if necessary.


