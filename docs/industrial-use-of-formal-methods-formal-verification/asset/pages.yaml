    # 2.2.5. Calculating reliability


    The criteria to stop tests in the industry are seldom based on reliability. However,
    this quantity is essential to allow calculations of the average time of use before
    the first failure, and therefore we have to envisage the cost of non-quality.


    Several models of reliability calculation [VAL 04] are limited to the observation
    of errors and intervals of time between these errors. They are thus based only
    on the past making extrapolations to the future. We propose a new solution considering
    the use of information relating to the coverage of functional tests allowing us
    to guarantee better knowledge of reliability in less time than a test.


    An estimate of reliability is calculated for each usage type of the software,
    i.e. for each profile associated with the Markov chain. These estimates are calculated
    independent of the profiles used for the generation of the test cases.


    We assume that the fact that the reliability is calculated starting from a test
    model (modeling some particularities of the test architecture) to generate test
    cases and not a specification model (expressing the functionalities of the application
    in an operational situation) does not involve a bias when estimating reliability.


    Our method of reliability calculation reflects that, in practice, the errors are
    not immediately systematically corrected. They can be corrected one-by-one or,
    alternatively, by packages. It also assumes that it is not possible to correct
    all the errors. This is the case during the delivery of certain software to be
    non-critical or in a trial version.'
