    # 5.11.3.6 Verification conditions


    There is an important issue connected with the automated deduction of verification
    conditions from the specification. The successful proof of these conditions means
    nothing in relation to the correctness of the application in satisfying the end-users’
    requirements. This is due to the assumption that the specification is correct;
    any other specification would proof unless there was some inconsistency in the
    deduction and proof process. The satisfactory proof of conditions deduced by rule
    shows consistency (not without value) but not correctness, which is generally
    more important.


    The verification conditions that are most valuable are provided by the end-users.
    They define the system properties (verification conditions) on the basis of their
    expertise and knowledge of the application means, rather than on the basis of
    the specification. They, therefore, provide independent corroboration of the specification.
    Where their proposed properties are provable, this confirms specification correctness
    in respect of that property. Where their properties are refutable, this identifies
    a demonstrable discrepancy between specification and end-user intention. Where
    the properties are neither provable nor refutable, there is a clear justification
    for deeper investigation.


    # 5.11.3.7. Invariant properties


    We can identify universally valid properties within many application systems.
    We refer to these properties as invariants and they are actually an abbreviation
    for a (possibly large) number of separate verification conditions. Invariants
    also represent user-provided verification conditions (it is not possible to deduce
    invariants by rule). They represent valuable application domain knowledge that
    the specification should embody.'
