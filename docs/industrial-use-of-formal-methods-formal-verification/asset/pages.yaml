  md: '# 5.8.5. Quantifiers


    The expression sub-language of C does not provide quantification over types or
    collections. However, quantification is frequently needed in specifications. We
    therefore imported quantified expressions from Perfect with syntactic modifications
    to fit better with the style of C.


    We allow quantification over types and over collections such as arrays and sets.
    We use the expression a : b to denote the set of integers from a to b inclusive
    (or the empty set if b < a). For example, the expression:


    ```

    forall i a lwb.upb : a[i] > 0

    ```


    conveys the notion that all members of the array a are positive. These expressions
    can, of course, be used only within specifications.


    # 5.9. Escher C verifier examples


    # 5.9.1. First escher verifier example


    # 5.9.1.1. Presentation


    Our first ECV Verifier is a classic binary search algorithm. We use eCV to show,
    subject to the preconditions, the algorithm terminates and returns the correct
    result for all possible inputs.


    When writing Modular programs, it is useful to write a header file that defines
    the interface to the module, and a separate code file that provides the code and
    data. When a module wishes to call into a second module, the code for the first
    module imports the header file using #include, so as to access the interface definition.
    Accordingly, the ECV specifications for public functions are placed in the header
    file so that, when another module imports the header file, the specifications
    of calls defined in other modules are available.


    The header file for this example is shown in Listing 5.6. It is standard C''90
    after the addition of the (pre) and (post) annotations. As is usual in C, when
    a function parameter is a pointer to an array, we have to pass an additional parameter
