  md: '# Industrial Use of Formal Methods


    The following studies can be cited:


    +   - JSFF (Joint Strike Fighter C++), which has published a guide [LOC 05] regarding
    the current work, notably the MISRA-C: 1998 [MIS 98] standard;


    +   - MISRA, which has developed the MISRA-C++2008 [MIS 08] standard; Table 1.5
    shows some MISRA-C++2008 rules examples:


    +   - OOTIA⁷ (Objected Technology in Aviation), which has published several guides
    [OOT 04a, OOT 04b, OOT 04], and [OOT 04].


    C++ [ISO 03] is therefore quite an old language. Some approaches identifying the
    weak points of C++ and proposing some rules appeared early on [MEY 98, SUT 05],
    but the definition of a framework for using C++ for high safety-level applications
    are recent [OOT 04, LM 05, MIS 08], which explains how applications in C++ are
    to be found even at SSL02.


    As Table 8.10, the MISRA C++:2008 [MIS 08] standard introduces some rules inspired
    by these current for the C language, but do not allow for all the difficulties
    of C++ to be taken into account.


    Under various pressures (a reduction in the number of Ada and C programmers, for
    example), the updating of standards, such as CENELEC EN 50128 or DO 178 has given
    rise to initiatives seeking to introduce object-oriented languages.


