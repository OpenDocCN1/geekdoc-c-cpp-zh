- pgno: 41
  md: '# Chapter 2


    # Model-Based Testing

    Automatic Generation of Test Cases

    Using the Markov Chain Model


    # 2.1. Preliminaries on the test process


    # 2.1.1. Findings


    Test phases are the last stages of system development. They are therefore severely
    constrained by delivery periods. In general, they are subject to all the delays
    accumulated during the overall project.


    Currently, test phases still correspond to 30% or even to 50% of the total cost
    of system development [JON 08] and thus represent an important point for possible
    development improvements.


    Testing is a difficult activity. Indeed, it is not possible to test everything
    because of the sheer numbers for the majority of modern systems. The difficulty
    of testing lies in the selection of relevant test cases for each phase of validation.


    It also lies in the absence of a true reflection of test optimization guided by
    both quality and costs.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 2.1.2. Test optimization


    The concept of reliability is based not on the number of remaining faults in the
    software, but on the probability of the appearance of errors in an operational
    situation. It is this notion of reliability, which makes it possible to guarantee
    a time of correct operation in a particular environment. The concept of an operational
    profile [MUS 99], called a usage model, makes it possible to define the various
    types of software use.


    Since the reliability of the software depends not on the number of residual code
    defects but on their capacity to be activated in a given usage profile, the various
    studies carried out these problems tend to show that the best testing strategy
    to increase reliability is that of the statistical usage [VAL 00].


    The development methodology Cleanroom [DYE 92] laid the basis of the statistical
    usage test. Cleanroom technology brought a change to software development and
    testing while aiming to produce software close to a zero-defect quality.


    Its principal characteristic is that it recommends statistical control throughout
    the lifecycle. Cleanroom does not provide a formal methodology, but it proposes
    applicable principles to improve development. One of these principles consists
    of accounting for all of the faults found by inspecting all of the stages of the
    development process to better control the project.


    The tests in Cleanroom also present an innovation: they are there to guarantee
    a MTTF (Mean Time To Failure) of the software. Indeed, it is not a question here
    to know if everything was tested, but to know the future behavior of the software
    to guarantee an average time of trouble-free software operation.


    # 2.1.3. The statistical usage test


    The basis of the statistical usage test therefore results from two previously
    evoked reports, namely:


    +   - the exhaustive test is not possible in the majority of the situations;

    - the frequencies of appearance of certain errors are very weak.


    The purpose of the statistical usage test is not to find all of the software’s
    defects, but rather to identify all of the errors having a probability of occurrence
    higher than a certain threshold. The test is thus carried out in accordance with
    the envisaged operational use.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Model-Based Testing 31


    Several statistical test techniques have been developed, such as selecting entries
    according to a random profile [NTA 98], using partitioning [OST 88], modeling
    a usage profile with a Markov chain [WHI 92], or even automatic derivation of
    statistical tests starting from formal specifications [THE 93].


    Different methods exist for implementing the statistical usage test. Constructing
    a model representing the software''s dynamic behavior and makes it possible to
    derive conclusions automatically from test cases. These tests being automatically
    derived will be neither intuitive nor similar to the tests written by a person
    accustomed to drafting test plans. The usage tests greatly put the system to the
    test because they test a large number of possible usage cases and not just one
    unit of functionalities.


    The statistical test presents some disadvantages. The first is the construction
    of the usage model. In many of the examples cited in literature, it is often found
    that it is either system applications (synchronized, Boolean data exchanges, etc.)
    or applications vary dependent on the tested system, in particular with the use
    of Oracle, that determine the test''s verdict.


    The usage model must naturally be able to adapt to a broad range of applications.
    Attributing probabilities is not so easy as each system user could behave differently.
    However, even a course attribution always gives more interesting results than
    the equilibrium of functionalities.


    Employing the statistical usage test, however, has many advantages:


    +   - the most frequently used functions are tested much more often;


    +   - it relates the only method that allows obtaining an estimation of the time
    of the application''s proper function;


    +   - it discovers the most frequently occurring errors and therefore considerably
    improve the system user''s view;


    +   - it becomes rather unlikely, if the model is correct, that an error is discovered
    in the first moments of system use because the simplest cases of usage are validated.


    Remember also that the statistical usage test, like any validation test strategy,
    may appear only if the system reaches the validation stage with a reasonable rate
    of residual faults. Indeed, in the contrary case, it is more interesting to resume
    an early test strategy, unit or integration tests, or even to completely resume
    a poorly conceived code.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 2.1.4. Generating test cases


    The manual generation of test cases, which is still the most often employed during
    consists of manually writing the test sequences starting from a reference (for
    example, the specification). The techniques for choosing these test cases vary.
    Owing to the essential human element, the test cases may be poorly chosen (from
    a memory lapse or, on the contrary, from redundantly checking). In addition, with
    systems that are becoming increasingly complex, it is extremely expensive to implement.


    Today, the competition is that the specifications evolve systematically during
    development. Therefore, the maintenance costs of manual plans explode since they
    require quasi-systematic recoveries.


    Automatically generating test cases solves the problem of poorly chosen test sets,
    at least the process of generation is efficient and adapted to the system. However
    it requires a formalized expression for the reference.


    > NOTE 2.1 – The test sequences generated, at the same time, comprise the input
    and the output of the implementation being tested. Where the input selection is
    easy, the generation of the anticipated data (thus of the output produced by the
    system) is much less commonplace. This difficulty is known as the "Oracle problem".
    The challenge is to calculate the expected results without having to develop a
    reference model comparable to the system being tested in terms of size, complexity,
    and thus cost. However, some solutions exist, such as the use of semi-formal or
    formal specifications.


    # 2.2. Modeling using Markov chains


    # 2.2.1. Origin


    The principles employed to make a test model based on Markov chains depend on
    the work carried out during the statistical usage test [WHI 92, MUS 99].


    Excluding notable exceptions such as the telephone company AT&T, note that these
    techniques took a long time to become employed by industries.


    This is probably due to a lack of practicality and easily comprehensible tools
    to implement them. Specifically, this is what pushed the company ALL4TEC in 2000
    to invest in the development of a tool, such as MaTeLo® (Markov Test Logic).


    At the beginning of the development of the MaTeLo tool, the problems to be solved
    included adapting statistical approaches so that the industries could gain some
    of the benefits, i.e. testing with better quality and, if possible, at a lower
    cost.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'This work involves creating a model that more effectively takes into account
    the systems'' various characteristics including the possibility of indicators
    related to the time of the test remaining to reach a given quality.


    | Stop and finalize the results |

    | Estimate the reliability and coverage |

    | Build and run tests |

    | Verify and analyze the usage model |

    | Develop the model structure |

    | Define the stopping criteria |

    | Analyze specifications |


    **Figure 2.1.** The main stages of the statistical usage test


    The essential components of the method include:

    - constructing a model representative of the possible scenarios of system use:
    the usage model;

    - estimating the test load to reach the stopping criteria;

    - using the generation algorithms of test cases;

    - determining the functional coverage;

    - calculating the reliability;

    - monitoring the test campaign.


    The major interests in this method are:

    - the possibility of making a control of the model (*model-checking*) before it
    for generation;

    - the possibility of guaranteeing the functional coverage by using a formal description
    of the exchanges between the environment and the system, and then using this model
    to generate the test case;

    - the possibility of measuring reliability after the test''s execution;

    - reducing the validation time for a quality-controlled delivery;

    - maintaining a usage model, which is easier than the maintaining test plans.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'This statistical method is based on the construction of a test model in line
    with the system specification, which represents the complex exchanges between
    the system being tested and its environment.


    # 2.2.2. Mathematical formalization


    There are many models for test generation, which are all based on state machines
    [PET 00]. The model retained for MaTeLo is a combination of state machine models
    and Markov chains. Its objective is to propose solutions for conducting realistic
    test campaigns aiming to create stop criteria (such as guaranteeing reliability
    and a functional coverage) for a controlled test''s time.


    This model uses only one component, which appears in a large majority of the cases.
    Several ports of communication can be declared, and input and output vectors are
    attached to these ports. Thereafter, we will reconsider the description of the
    input and output vectors.


    The test component execute the executive test. The exchanges between the executive
    test and the system being tested are modeled by a state diagram, which is presented
    in the following section.


    # 2.2.2.1. State diagrams


    The usage model consists of a group of state diagrams. The states of the diagrams
    are stable as stable if the system cannot evolve without receiving a new event
    from the outlet (such as an input coming from the executive test).


    A diagram always contains two particular states, the [Start] state, which represents
    the initial state of the system before starting a test and the [End] state, which
    represents the final state of the system after the execution of a test.


    The stimuli attached to the system as the reactions of the latter are associated
    with the state transitions. A transition is connected to an exchange between the
    environment and the system being tested, i.e. an input and possibly more outputs
    known as atomic transition, i.e. when a transition on the graph is taken, and
    then the actions connected to it will run until the system is in a stable state.
    This property is similar to Mealy machines.


    The input field is, in general, infinite. On the other hand, the number of different
    types of events that make the system change from a stable state is finite.


    An exchange starts with an input (message from the environment to the system being
    tested) and finishes when the system is in a stable state, i.e. when the system
    cannot evolve any further without receiving another input.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Model-Based Testing


    DEFINITION 2.1.— The test graph G is defined by G = {E, Start, End, T, AI, AO,
    d} such that:


    +   - E is a finite number of states;

    - Start = E is the initial state of the system; this state is not connected to
    an incoming transition;

    - End = E is the final state of the system; this state is not connected to an
    outgoing transition;

    - T = {t1,..., tn} is the set of transitions;

    - AI = {i1,..., in} is the set of input vectors;

    - AO = {o1,..., on} is the set of output vectors;

    - δ (e, i) is the transfer function that makes it possible to change from a stable
    state in the test graph by following the transition t: E × AI → (o1,o2,...,on)
    ∈ AO × E, the transition t is associated with an input vector i ∈ AI and a set
    of output vectors (o1,...,on) ∈ AO.


    NOTE 2.2.— It is possible according to this definition to have several transitions
    connecting the same set of states.


    NOTE 2.3.— It is not possible to reach the [Start] state beginning at any state
    of the graph, and the {End} state does not allow any state of the graph to be
    reached, it acts as a final state.


    # 2.2.2.2. Topology of events


    The input (stimuli) and the output (reactions) are the observable events, which
    can be exchanged between the system and the environment. An input (or an output)
    is described using typed variables.


    We present here the language used to describe the input and output vectors that
    are associated with the test graph. The events are listed and described only.
    In the test graph defined previously, it is possible to link the same event several
    times to a transition as an input or output. To then link the state machine to
    a test architecture, it is necessary to indicate the port associated with each
    event.


    Let V = (x1, x2, ...) be the ordered set of variables associated with a transition.
    An input vector va = (x1,va, x2,va, ...) is defined by an instantiation of each
    one of these variables.


    The variables xi can be from eight different types: integer, real, Boolean, object
    identifier, bits chain, bytes, list of elements, or character chain.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'It is also possible to define types made up of key words:


    +   - sequence, which indicates a structured element made up of several variables
    of different types;


    +   - sequence of which indicates a structured element made up of several variables
    of the same type;


    +   - choice, which makes it possible to define a variable whose type belongs
    to a list of types.


    This classification of events makes it possible to define the input and output
    vectors in a more precise way. An input vector will be described according to
    the set of instantiated variables.


    The model is built so that all the input vectors associated with the same transition
    are defined according to the same set of variables.


    # 2.2.2.3. Hierarchical representation


