    # 3.4.2. AltaRica model of the electric system


    We developed a library of electric components: generators, circuit breakers, transformers,
    contactors, busbars, and electrical consumers. For each component, we modeled
    the effect of failure on its internal behavior as well as the propagation of failures
    towards its environment. We were interested in failure modes that could lead to
    the total or partial loss of electric power.


    We assume that all the components could no longer generate, transmit, or provide
    electricity. In a more detailed version of the model, we had also assumed that
    short-circuits could occur in the supply bars (see article [KEH 04] for more detail).
    Finally, contactors and the circuit breakers can remain blocked in an open or
    closed position.


    ![](img/701040363c568d7f491808943697cd68_117_0.png)


    Figure 3.13. Flows associated with a busbar


    We use the flows of components of the electric system to model the propagation
    of the failures within the electric system. It is therefore necessary that the
    flows account for the presence or the absence of voltage. We considered that each
    of the component was likely to have an input and output voltage. For example,
    a busbar with two ports a and b will be modeled with five flow variables: a_o_V,
    the output voltage in port a; a_i_V, the input voltage in port a; b_o_V, the output
    voltage in port b; b_i_V, the input voltage in port b, and status that indicates
    whether the bar is being supplied.


    The system comprises contactors that allow a great number of possible reconfigurations.


    We developed controller components that control each of the model''s contactors
    by opening or closing them according to the observation of the current state of
    the engines, generators, bars, and transformers.'
