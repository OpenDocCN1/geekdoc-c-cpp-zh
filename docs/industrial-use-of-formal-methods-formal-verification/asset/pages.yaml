- pgno: 142
  md: 'carry out contextual verifications on larger software components. In addition
    to this, quality objectives can involve the verification of coding rules and define
    minimum quality thresholds to be reached.


    # 4.7.1. Robustness verification


    The objective of robustness verification is to show that the software works correctly
    in all instances, including "non-standard" conditions for which it has not been
    designed. This can be seen as "worst case" verification.


    This is the type of verification carried out by default with Polyspace®. In this
    case, Polyspace®:


    +   - assumes the input of functions is not bounded and can take on all of the
    values permitted by their types;

    - initializes global variables with all the values permitted by their types;

    - automatically stubs the missing functions by assuming that their output is not
    bounded and they can take on all the values permitted by their types.


    The benefit of this approach is to make sure the behavior of the program in all
    cases. Its disadvantage is that it can produce more non-proven results (therefore
    colored in orange by Polyspace®). The developer or the tester must then inspect
    the orange parts of the code, in line with his quality objectives.


    # 4.7.2. Contextual verification


    The objective of a contextual verification is to show that the software functions
    within their predefined domains of use. This limits the verification domain to
    specific values for certain variables.


    The realization of contextual verifications with Polyspace® will reduce the number
    of unproven results.


    Various techniques are available to the user to help him or define the verification
    context of his or her application. The user can:


    +   - use the DRS (data range specification) module to specify the ranges of function
    input and thereby limiting verification to these cases;

    - write a main program by hand to model the call sequence of its functions, rather
    than base it on the main program automatically created by Polyspace®;

    - provide manual stub functions to emulate the behavior of missing functions,
    rather than base it on stubs that are automatically created by the product.'
