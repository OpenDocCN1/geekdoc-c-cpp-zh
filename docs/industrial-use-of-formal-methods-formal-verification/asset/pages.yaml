    # 2.3.5.2. Executing tests and verdicts


    The execution of test cases is delegated to the test environment. The only return
    necessary and sufficient for MaTLo by test case is as follows:


    +   - status: Not Run/Passed/Failed;

    - if there is an error: Error step (stage of the test case or the first failure
    has appeared).


    # 2.3.6. Analysis of the results and indicators


    The analysis of the test campaign fulfills the quality assurance of the system
    being tested by posting, in particular, the test carried out according to the
    system versions being tested. There are three levels of reports (expert, developer,
    manager) posting information, more or less.


    The first thing to be defined by the user is the set of stop criteria, which will
    be used to evaluate the difference between the achieved quality and the objective.


    The following objectives are proposed in the MaTLo tool:


    +   - objectives of coverage of the requirements, states, transitions, classes
    of equivalence, and totality: in a unitary (through a version of SUT) or cumulated
    (through all the versions of SUT) manner;

    - objectives of reliability: probability of failure, Mean Time To Failure, and
    failure intensity by operational profile defined in the model.'
