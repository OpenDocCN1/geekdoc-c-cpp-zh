  md: '# Chapter 3

    Safety Analysis

    of the Embedded Systems

    with the AltaRica Approach


    # 3.1. Introduction


    In this chapter, we describe the use of formal methods to assess the safety of
    embedded aeronautical systems. We are particularly interested in the AltaRica
    language and the tools associated with it.


    We begin with the presentation of the context of the use of AltaRica: the development
    of aeronautical systems and the safety assessment activities, which are conducted
    for certifying aircraft airworthiness.


    Then, we introduce the AltaRica language and the associated assessment tools.
    We show how they were used to assess the safety of two types of aircraft systems.
    Lastly, we compare our work with other similar approaches and conclude with an
    assessment of some work and prospects.


    # 3.2. Safety analysis of embedded systems


    The certification of the aircraft requires following a process of strict development
    including safety analyses applied at various stages of an aircraft''s development.
    The three stages usually considered include:


    Chapter written by Pierre BIEBER and Christel SEGUIN.'
