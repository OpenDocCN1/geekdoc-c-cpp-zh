  md: 'Our model for the reliability estimation is based on the probability of having
    an error when triggering a transition because this probability is related to the
    coverage of the transition. The more important the coverage of a transition, the
    higher is the probability of not having an error during a new transition triggering.
    In absolute terms, if the coverage is complete, the probability of not having
    an error is equal to one.


    The experiment consisting of randomly generating S test sequences is carried out
    by starting with a generic profile that is executed one after the other in the
    software. When an error is discovered, the coverage of the current test is immediately
    stopped and passed to the following sequence.


    During the application of the S tests, corrections of the errors discovered on
    the software are not made. With each execution of a test sequence, the frequency
    of activation for each transition and the possible errors discovered recorded.


    This is based on the proposal of K. Sayre [S99], which consists of allotting each
    transition the probability of having an error at the time of the course of the
    transition. However, the method of calculating this probability differs from K.
    Sayre''s proposal.


    The following stage consists of calculating the probability that an execution
    is done without error. It is then sufficient to introduce a temporal parameter
    to obtain reliability.


    # 2.2.5.1. Probability of having an error during a transition triggering


