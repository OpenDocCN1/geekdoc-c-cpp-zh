- pgno: 286
  md: '# Conclusion


    These normative requirements recommend implementation of a “V-cycle”-type development
    process based on the activities of verification and validation, based on the carrying
    out of tests (MT, IT and FT)$^{30}$).


    Activity testing implementation suffers from several problems, which include:


    +   - the cost and complexity of activity testing;

    - late detection of faults;

    - the difficulty of carrying out all the tests.


    This is why it is necessary to implement other practices, which must enable faults
    in the software orientation to be detected as early as possible.


    One of the possible approaches consists of implementing formal methods (for example,
    the B method [ABR 96], SCADE$^{31}$ [DOR 08], VDM [JSON 90], Z [SPI 89], which
    on the basis of a model and set of properties, enable demonstration that the software
    product verifies the properties.


    It may, however, be interesting, on the basis of classic development languages
    (such as C) to explore the program behaviors and demonstrate that it verifies
    some properties.


    | | SSIL0 | SSIL1 | SSIL2 | SSIL3 | SSIL4 |

    |---|---|---|---|---||}{

    | Formal proof | | R | R | HR | HR |

    | Static analysis | | | HR | HR | HR | HR |

    | Dynamic analysis and tests | | | HR | HR | HR | HR |

    | Metrics | | | R | R | R | R |

    | Tracability | R | HR | HR | M | M |

    | AEEL | | | R | R | HR | HR |

    | Coverage of the test for the code | R | HR | HR | HR | HR |

    | ... | | | | | | |


    Table 8.13. New CeneLEC EN 50128 ((CEN 11)) – Table A.5


    30 MT for module testing, IT for integration testing and FT for functional testing.

    31 SCADE is distributed by Esterel Technologies, see: www.esterel-technologies.com.'
