  md: "Safety Analysis of the Embedded Systems 87\n\nThe AltRica code of the node\
    \ Function2 is presented in Figure 3.3.\n\n```\nnode Function2\nflow\n  O: FailureType:out;\n\
    \  I1, I2: FailureType:in;\nstate\n  Status: FailureType;\n  event\n    loss,error\n\
    \  trans\n    (Status = lost) | loss -> Status:= lost;\n    (Status = ok) | error\
    \ -> Status:= erroneous;\n  assert\n    O = case { Status=ok and I1=ok and I2=ok\
    \ : ok,\n              Status=ok and (I1=lost or I2=lost) : lost,\n          \
    \    Status=lost: lost,\n              else erroneous};\ninit\n  Status:= ok;\n\
    extern\n  law <event loss> = \"exp 1e-4\";\n  law <event error> = \"exp 1e-5\"\
    ;\n```\n\n**Figure 3.3.** AltRica code of the node Function2\n\nAn AltR node can\
    \ have state variables that make it possible to store values; they are declared\
    \ under the heading state. The node Function2 has one state variable called Status\
    \ whose value indicates the component's functional or dysfunctional mode.\n\n\
    An AltRica node can also have flow variables that establish the link between the\
    \ node and its environment; they are declared under the heading flow. It is also\
    \ necessary to indicate the direction of the flow variables: in for the input,\
    \ out for the output, local for the variables, which are used as abbreviations."
