    # 4.5. Abstract interpretation


    Abstract interpretation is a formal mathematical method based on techniques that
    enable us to abstract the semantics of a program. It can be an efficient method
    for certain types of software verification.


    The benefits of abstract interpretation can be illustrated in a simple way by
    the multiplication of the three big numbers in the following equation:


    ```

    4,586 × 34,985 × 2,389 = ?

    ```


    Although the calculation of the solution to the problem takes time if it is done
    by hand, it is possible to apply the rules of the multiplication sign to determine
    that the result is negative. The determination of this sign is an example of the
    application of abstract interpretation. The technique enables us to verify a set
    of properties of a final result, such as the sign, certainty without having to
    do the whole calculation.


    By applying these rules, it is also possible to know that the result of this calculation
    will never be positive. This property of the program at this point can be useful
    if, for example, the result of the function calculating the square root of a number.
    Similarly, abstract interpretation can be applied to the semantic of software
    to prove certain properties of conventional analysis with dynamic tests by verifying
    certain dynamic properties of the source code without running the program.


    Abstract interpretation takes into account all the behaviors of a program, that
    is to say all the combinations of values, and can then determine whether the program
    contains categories of run-time errors. The results that come from abstract interpretation
    are considered sound as their mathematic proof.


    # 4.6. Code verification


    Code verification or code verifiers based on abstract interpretation can be used
    as static analysis tools to detect and mathematically prove the absence of certain
    run-time errors in the source code, such as overflows, divisions by zero and out-of-bounds
    array access.'
