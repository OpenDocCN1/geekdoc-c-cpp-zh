- pgno: 283
  md: '# 8.2.5.3. Programmable controller


    The "continuous processes" CEI/IEC 61511 [IEC 05] industry standard brings precision
    in restricting the initial field of application of the CEI/IEC 6150829 [IEC 98]
    to the traditional context of continuous processes.


    The CEI/IEC 61511 [IEC 05] standard applies in the framework of E/E/PE systems
    used in the context of safety instrumented functions for controlling a process
    (chemical products), petrol refining, petrol and gas production, non-nuclear electricity
    production). It does not apply to manufacturers or system providers, who must
    use the CEI/IEC 61508.


    For synthesizing, the CEI/IEC 61511 standard is used when already-certified components
    (of programmable controllers) are used and with limited variability.


    With respect to programming languages, the CEI/IEC 61511 [IEC 05] standard only
    restricts programming languages to the industry, which are specified through the
    CEI/IEC 61131-3 [IEC 03] standard.


    This is in no way prevents someone from programming their E/E/PE system with the
    Ada or C++ languages, but in cases, it is necessary to refer to the CEI/IEC 61508
    [IEC 98] standard, which defines what languages can be used.


    Part of the CEI/IEC 61131-3 [IEC 03] standard describes the principles for producing
    an application for a programmable controller and introduces several technical
    terms: FBDs for function block diagrams, SFCs for sequential function charts,
    suites of instructions (written IL), structured text (ST), and contact diagrams
    (LD for ladder diagrams).


    The languages introduced by the CEI/IEC 61131-3 [IEC 03] standard are used more
    and more for making software applications. This is because these languages are
    easily assimilated and standardized. There are thus some tools that cover all
    the formulas described in the CEI/IEC 61131-3 [IEC 03] standard.


    These tools are supplied for making programmable controller applications and may
    come with a certificate for a safety level, which might be SSIL2 or SSIL3.


    The ControlBuild presented in Chapter 8 of [BOU 12c]. ControlBuild is used by
    several actors in the rail sector to make SSIL2-level safety-critical software
    applications.


    > 29 In Chapter 10 of [BOU 09], there is a discussion on the use of SISs (Safety
    Instrumented Systems) in industry. Chapter 6 of [BOU 11] presents a complete example
    of implementation of a programmable safety controller for managing ventilation
    of the Soumagne tunnel and the Walhorn trench of the high-speed L3 line.'
