- pgno: 275
  md: 'As Table 1.1 shows, in the context of applications, which have a high level
    of criticality (SSIL3/SSIL4), the Ada language itself is only R (recommended);
    it is necessary to establish a sub-assembly of the language so that the use of
    Ada is HR (highly recommended).


    Ada was conceived as an initiative of the DoD (the US Department of Defense) to
    federate more than 400 languages or dialects used by this body since the 1970s.


    Ada is widely used in the framework of embedded software applications in avionics
    (airbus), in space (the Ariane rocket), and in the rail sector. The principal
    characteristic of these systems is that they require a correction of the execution.


    The Ada 83 language [ANS 83] has advanced toward a second major standard, Ada
    95 [ISO 95], which is the first object-normalized language. It provides the possibility
    of constructing object-oriented models. The latest version to date is Ada 2005.


    DEFINITION 8.5.– Certification. consists of achieving a certificate, which is
    a commitment that the product complies with a normative referential. Certification
    is based on the results of an evaluation and on production of a certificate.


    Regarding certification of Ada compilers, the existence of a standard and a rather
    fine semantic of Ada has made it possible to define a certification process. This
    process has been implemented on different compilers and is based on a suite of
    tests named ACATS (Ada Conformity Assessment Test Suite); see the [ISO 99] standard.
    To find out more, consult [ADA 01].


    For the moment, these new versions of Ada have not been adopted by the embedded
    systems sector because of this object-oriented aspect. Given their efficacy, however,
    Ada 95 compilers are used for compilation provided that a sub-assembly of the
    language, which does not use the "object-oriented" features is relied upon.


    John Barnes, in the context of the ADACORE article makes a presentation on the
    strengths of the Ada 2005 language (syntax and semantic, strong typing, sound
    management of the pointer and the memory, etc.) and the impact of its implementation,
    upon demonstration that the software is reliable.


    The "object-oriented" aspect is not taken into account by CeneLEC EN 50128 ([CEN
    01], DO 178 [ARI 92], CEI/IEC 61508 [IEC 98], and ISO 26262 [ISO 09] standards
    applicable to safety-critical applications.'
