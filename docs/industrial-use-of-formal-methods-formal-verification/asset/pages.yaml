- pgno: 178
  md: 'These annotations are invisible to ordinary C compilers, the annotated programs
    can be compiled as normal.


    The language subset has been carefully chosen to avoid classic vulnerabilities
    of the C language [CRO 09a]. The subset includes most constructs permitted by
    MISRA-C 2004, so already adhering to this standard find that their code is well
    on the way to compatibility with the C Verifier code subset. Optional support
    is provided for some and C++98 constructs


    Escher C uses the same interface as Perfect Developer. We therefore chose to retain
    the Verified Design-by-Contract paradigm [CRO 04a] that we use when verifying
    Perfect. This paradigm requires as a minimum that all function preconditions be
    explicitly stated. Although this may seem cumbersome for the programmer, the rigorous
    documentation of preconditions greatly enhances maintainability and re-usability,
    even when formal methods are not otherwise used. In a critical system, when a
    programmer writes a call, there should be no uncertainty in his/her mind as to
    what conditions must be satisfied for the called function to be relied upon to
    behave as expected.


    # 5.7. The C subset supported by Cv


    In the C language, it is easy to write constructs that have undefined behavior
    or have implementation-defined behavior [CRO 09a]. It follows that C is far from
    an ideal choice for writing critical applications. However, the language definition
    documents [ANS 89, ISO 991] state clearly the situations in which behavior is
    not well-defined. This makes it possible to define subsets of C with well-defined
    semantics. One attempt at such subset is MISRA C [MIS 04], which has gained widespread
    acceptance in industry.


    Many of the restrictions imposed by Cv can be enforced statistically, often over
    the inter-relation between different parts of the program, in ways that can be
    resolved using mathematical proof.


    Whereas some of the MISRA rules are based on notions of “good programming practice”
    rather than on the avoidance of undefined behavior, we have selected our subset
    of C solely with verification in mind. Surprisingly, all the constructs that are
    prohibited in our subset are also prohibited in the MISRA subset although the
    reverse is not true.


    # 5.8. The annotation language of Cv


    The usual way of augmenting programs with formal specifications is to express
    them as specially formatted comments. In most programming languages, no other'
