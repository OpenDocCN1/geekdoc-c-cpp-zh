- pgno: 31
  md: '# Industrial Use of Formal Methods


    The Lockheed-Martin C-130 transport aircraft, commonly known as the "Hercules",
    was updated in the 1990s to produce the C-130J Hercules II, with significantly
    improved avionics, engines, and propellers.


    Part of the transformation involved new Operational Flight Plan (OFP) software
    [CRO 96, MID 05] to control the many individual systems on the aircraft and operate
    and provide information on the integrated aircraft. The primary OFP consists of
    mission computers, with combinations for each of the Bus Interface Units.


    The C-130 OFP software was required to be certified for both civil and military
    use. This meeting both DO-178B for civil applications, as well as the static analysis
    and formal verification requirements of the UK’s Royal Air Force.


    The OFP software consists of around 200 KLOC of source code, written in Ada. Of
    this, all with significant system semantics are implemented in SPARK, allowing
    proof of correctness against a specification expressed using a notation known
    as CoRE, or "Parnas tables."


    These tables are written so that each line of the table specifies an element of
    the overall input-to-output function relation. The union of the lines should cover
    all possible input conditions, while there be no overlap distinct lines of the
    table (unless the overlap is intended), and yields the same value in all cases
    of such overlap.


    This form of specification is well-suited to analysis with SPARK. The overall
    flow from input to output, illustrated below, maps very well on to SPARK dependency
    relations (derive Output from Input, ..., Input,, in effect). Each line of the
    Parnas table can be expressed, suitably formalized, as a clause in the corresponding
    post-condition, allowing us to prove correctness with respect to the specification.
    Further, any issues or anomalies encountered in formalizing the Parnas table are
    raised for investigation and resolution, detecting errors and inconsistencies
    in the development lifecycle than would otherwise be the case.


    An example of a Parnas table is shown below (note that "X" means "don’t care”),
    with how this would typically be represented as a SPARK post-condition.


    | Tank_Level | Xfer_Method | Direction | Control_Value |

    | --- | --- | --- | --- |

    | "X" | "X" | Empty | Off | Shut |

    | "X" | Manual | Fill | Open |

    | < Limit | Auto | Fill | Open |

    | >= Limit | Auto | Fill | Shut |


    Table 1.1. Example Parnas Table'
  merge: -1
  img_proc: true
