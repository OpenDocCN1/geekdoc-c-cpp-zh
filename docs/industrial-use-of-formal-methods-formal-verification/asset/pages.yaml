    # 3.3.1.2. AltaRica model


    In a system model, the instances of AltaRica nodes are interconnected by assertions
    that connect input flows of a component to output flows of other components. Figure
    3.4 shows a model made up of an instance of the node Function2 named fc and two
    instances of the node Function0 named s1 and s2. The output of s1 and s2, is connected
    to the input of fc.


    ![](img/701040363c568d7f491808943697cd68_100_0.png)


    Figure 3.4. Graphic view of an AltaRica model using Function2


    The AltaRica code presented in Figure 3.5 contains the AltaRica code of the two
    nodes used (Function0 and Function2) as a principal node (main).


    The heading sub of the principal node makes it possible to declare the two instances
    of Function0(s1 and s2) and the instance of Function2 (FC).


    The assertions express the fact that at any time the value of the output O of
    s1 (respectively of s2) should be equal to the input value I1 (respectively I2)
    of fc.


    Although directly linking flow variables is the best method of describing the
    interactions of AltaRica nodes, it is also possible to model the interactions
    by combining the different nodes.


    For group of events, a new event representing this group is added to the AltaRica
    principal node. There are two types of combining events:


    +   - synchronization event: the synchronization event can be triggered if the
    combined events can be triggered individually (the transition guards of these
    events are true). When a synchronization event is triggered, all the combined
    events are triggered and all the variables are modified in accordance with the
    defined transitions,'
