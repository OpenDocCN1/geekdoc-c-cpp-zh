- pgno: 212
  md: 'For mapping use cases to traditional B specifications, we propose that use
    case scenario sentences must be written using a controlled natural language (CNL)
    described according our use case transaction sequence, which is based on Ochodek''s
    transaction model [OCH 08].


    DEFINITION 6.1.-- A transaction is the shortest sequence of an actor''s and a
    system actions, which starts from the actors requests and finishes with the system
    response. The system validation and system explosive actions must also occur within
    the starting and ending action. The pattern for a transaction went as a sequence
    of four steps in a scenario:


    +   n. An actor''s request action (U).

    n+1. A system data validation action (SV).

    n+2. A system explosive action (e.g. system state change action) (SE).

    n+3. A system response action (SR).


    We have also decided to define the grammar using subject-verb-object (SVO) sentences
    because we are good at telling the sequence of events. We have mapped the use-case
    actor as subject, set of actor''s predicate synonyms (for example, validate, verify
    etc. would be grouped together) as verb, and the rest of the sentence as object.


    For the sake of simplicity, we assume that all environmental tasks, like user
    interactions, are perfect, i.e. they are always executed in a correct order and
    at the right time. Further studies will be developed to incorporate non-functional
    requirements and exceptions.


    Let''s take a look at an example to clarify our idea. In accordance with the definition
    (6.1), suppose we have the following use case scenario:


    +   1. The agent specifies a travel itinerary for a client.

    2. The system validates the itinerary.

    3. The system searches for a set of appropriate flights.

    4. The system presents them to the agent.

    5. The agent selects a flight.

    6. The system verifies free spaces on the flight.

    7. The system reserves any seat from the set of free spaces.

    8. The system confirms the reservation.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Partial Applications of Formal Methods 205


    In the above example, we can see two transactions (1–4 and 5–8) and each one can
    be used as a guide to create a B operation. From SV actions (2 and 6) we extract
    the preconditions (validates the free spaces) from SE actions, (3 and 7) we derive
    the operations (search, reserve) and the post-conditions (searches at sets, removes
    any seat). A possible mapping to B specifications, which is self-explanatory,
    is shown below.


    ```

    flights(flight) ⊓ search(city1,city2) triangle

    PRE city1 ∈ CITY ∧ city1 ≡ city2 � itinerary(city1) (2)

    THEN flight := compañiet(city1 ↦ city2)) (3)

    END;

    ```


    ```

    reserve(flight)

    PRE card(flight) > 0 (6)

    THEN ANY seat WHERE seat = flight (7)

    THEN flight := flight - [seat]

    END

    ```


    # 6.2.4.2. Results


    We used an approach for mapping requirements to B (Event B) models from use cases
    and test cases. We were not interested (at this moment) in the automatic translation
    of use cases for formal specifications since there were many natural language
    ambiguity problems. The intention was to take the use cases as a guideline for
    starting B specifications.


    This was only an attempt to find out how well formal methods could fit in a UML
    development process. A lot of work has to be undertaken to make it a mature process.


    # 6.2.5. Early 2010 – a methodological approach to a B formalization


    Developing a formal specification of a system from the informal requirements of
    a customer remains an open issue in the software engineering world. Good requirements,
    which are well written and easy to understand, are essential [JAC 01] but not
    sufficient for achieving this goal.


    We propose a framework to structure and organize such requirements, resulting
    in a requirements specification document. This Meta-model facilitates the development
    of a formal abstract model of the system functionality using the B method.


    In this work, requirements elicitation is done without feedback from the customer,
    for two reasons. First, requirements elicitation often produces inconsistencies
    and redundancies. One needs to produce a formal representation that presents the'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'requirements to the customer, beyond any doubt, we will consider the customer
    feedback back once we have constructed the model and noted the inconsistencies.
    The lack of information has to be clearly pointed out and proved. Second, this
    work is part of a larger project to develop a method for methodically organizing
    the requirements of a system having only natural language documents as input.
    As an offshoot of this work, the formal model could help the customer to resolve
    inconsistencies and redundancies to future projects with similar requirements.


    To reduce the gap between the requirements and the formal model of the system
    and to come with a clearer traceability, it is helpful to use an intermediate
    representation such as cases [JR 09], problem cases [JAC 01], or KAOS [DAR 97].
    This work employs an adaptation of the WRSPM approach [GUN 01], a reference model
    that can be adapted without requiring a whole new language to represent the requirements
    (as opposed to KAOS or problem frames). This is the basis of the method explored
    in this work.


    To achieve a match that we can verify and validate, which points out inconsistencies,
    redundancies, and the lack of information, the B is applied over the specification
    from WRSPM. Once a formal model is constructed, one can use animation tools from
    Prob to show this to the customer. They would be much easier to understand mathematical
    objects and it is also in this process that we can verify the advantages of the
    methodology and identify the main complications of developing an abstract formal
    model using the horizontal refinements approach, which can lead to alternatives
    to this issue in future.


    # 6.2.5.1. The methodology


    The method we use to generate the WRSPM-based model consists of taking the customer
    requirements (expressed in natural language) one-by-one. This way, we incrementally
    produce the specification S in terms of *phenomena, invariants,* and *operations*.
    We break the requirements into **W**, **R**, and establish traceability relating
    the labels of the *atomic* requirements with the labels of the invariants and
    operations manually. In fact, with the development of tools, this should be automatic.


    In 6.1 we have a flowchart illustrating the process step-by-step. We take it to
    each requirement (already decomposed into an atomic requirement) and firstly identify
    all the *phenomena*. Then, each *phenomenon* is identified for the first time
    we define the invariants with reference to its type and next the invariants and
    operations with reference to its state. All *phenomena* to that single requirement
    are identified (the new ones) typed and invariant/operation related, we break
    the text of the requirement into information of the environment (**W**) and constraints
    of the system (**R**). The last step is to provide the traceability, making the
    links between the labels of the *atomic* requirements and the elements of the
    WRSPM specification.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/701040363c568d7f491808943697cd68_215_0.png)


    **Figure 6.1.** Flowogram illustrating the processing of requirements


    To model a complete system this, we need to decide on a formal language that is
    rich enough to express the formal artifacts and phenomena.


    Once all requirements are this modeled, we have a complete abstract formal representation
    of the system (using the B method, for example). This is the starting point of
    a series of refinements, the last one resulting in P (in some programming language),
    to be executed in some execution environment M. In the process, dependency links
    shall be maintained between all artifacts to guarantee traceability. Upon completion
    of these steps, we have a correct and complete implementation of the system (since
    the requirements are also correct and complete).


    # 6.2.5.2. Horizontal refinements


    Some systems are too large and complex to have their formal modeling (the abstract
    model) done in just one step, and are more predicated to have it done in successive
    steps. That where the idea of horizontal refinements (or superpositions) fits
    in.


    The idea consists of starting with an abstract model that only considers parts
    of the requirements, and then introduces new requirements through successive refinements,
    adding new variables, strengthening preconditions, adding invariants, actions,
    or operations.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Industrial Use of Formal Methods


    The one doing the modeling process has to explore the requirements document (in
    the methodology presented in this chapter, the WRSPM model) and gradually take
    from it the elements to be formalized.


    It is important to take care to, correctly, define the architecture that supports
    the incremental addition of information, and to define a good order to add these
    requirements, so abstraction disparities are not faced (like a very concrete requirement
    being added in a high abstract level)


    Another issue is to guarantee completeness with the previous model (WRSPM): the
    horizontal process must last until all the requirements and definitions have been
    taken into account, and only after this phase is over, we will start the process
    of the vertical refinements, pushing the model into more concrete levels through
    design decisions until a level concrete enough to generate code is reached.


    # 6.2.5.3. Lessons learned


    Once we had added what we considered to the abstract model (to be further expanded
    with the horizontal refinements), this model was analyzed using the animations
    tool ProB (LEU 031), with features such as model checking and execution step-by-step
    to achieve although without the specification. This allowed us to explore the
    B specification, checking for errors and identifying inconsistencies and lack
    of information. Undefined states to the variables were reached since we did not
    know, guided by the customers, what to do in conditions. It would also be possible
    to show the customer the result of the project so far, following the ProB examples
    of the model execution.


    The next step would be to refine the abstract model of the system. Earlier, we
    only considered part of the requirements in the process of construction of the
    model, so the new requirements had to be introduced through refinements. That
    is where we had conceptual problems.


    To model the architecture communication, and complexity decomposition with the
    B method, this clause INCLUDES is necessary, and this clause cannot be used to
    include a refinement, which means, in a practical example: the machine System
    of the abstract model cannot include the refinement refinement_, which cannot
    include the refinement step, so this one can add a new operation through refinements.
    It is necessary to define the signature of the operation (with variables to be
    received and returned) and perform the refinement step, which clearly defines
    the concept of exchanging the information. In order to have an abstract model
    able to be horizontally refined one would have to do an analysis through all the
    requirements to define at least the signature of all the operations that are going
    to be performed in all the machines. Therefore, to apply horizontal refinements,
    we decided to use another approach to build the model and perform the refinements,
    using the Event-B formal methodology and its extensions that enables the decomposition
    process.'
