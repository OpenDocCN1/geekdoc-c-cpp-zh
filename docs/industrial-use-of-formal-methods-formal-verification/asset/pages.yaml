    # 4.7. Robustness verification or contextual verification


    Polyspace® users can carry out so-called robustness or contextual verifications.
    Robustness verification helps to show that the software functions correctly in
    all of its conditions of use, whereas contextual verification shows that it works
    correctly in the nominal conditions of its use.


    The verification processes can include both types of verification. For example,
    developers can carry out robustness verifications in their files as early as possible
    in the development cycle, while they are writing their code. The later team can'
