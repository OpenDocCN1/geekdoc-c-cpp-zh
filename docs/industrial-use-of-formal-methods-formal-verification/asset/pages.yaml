  md: '# Chapter 1


    # SPARK – A Language and Tool-Set for High-Integrity Software Development


    # 1.1. Introduction


    SPARK¹ is used worldwide and across a range of industry sectors for the cost-effective
    development and assurance of high-integrity software. In this chapter, we will
    consider the SPARK language and the tools that support its use in increasingly
    large-scale, high-integrity industrial applications.


    The material of this chapter is divided into three main parts, as follows:


    +   - first we provide an overview of what SPARK is, including its founding principles,
    with simple examples;

    - next, we provide descriptions of a range of industrial applications of SPARK
    spanning more than 15 years of use, and supported by some statistics on the size
    of programs tackled and results achieved, again providing some illustrative material
    where it is possible to do;

    - we finish with some conclusions drawn from the examples and applications that
    we have discussed, and a discussion of what is in the pipeline for future enhancements
    to SPARK and its support tools.


    > Chapter written by Ian O''NEILL.

    ¹ The SPARK programming language is not sponsored by or affiliated with SPARC
    International Inc; and is not based on the SPARC architecture.'
