- pgno: 20
  md: "# SPARK – A Language and Tool-Set\n\nData flow analysis is concerned with how\
    \ data flows within and between programs. If we use the value of a variable before\
    \ it has been assigned a value, for instance, this is a data flow error. Data\
    \ flow analysis is performed by the Examiner on all of the source code to which\
    \ it is applied.\n\nInformation flow analysis is concerned with how information\
    \ flows between variables. For a given program, we can determine a set of input\
    \ (parameters of mode in or out, parameters of mode together with globals from\
    \ which we may read values) and a set of output (parameters of mode together with\
    \ globals, which we may modify). Information flow analysis considers which input\
    \ may affect output, by composition, subprograms which call these, and so on.\
    \ As described in [BER 85], information flow analysis can detect more programming\
    \ errors, including missing or unexpected dependencies between input and output\
    \ exit conditions, which may become “stable” (i.e. cease to change) after a small\
    \ number of iterations. Information flow analysis is optional, but it can be applied\
    \ to all SPARK code, which has the relevant core annotations.\n\nTo illustrate\
    \ the power of the flow analysis performed by the Examiner, consider the following\
    \ subgraph, which exchanges its two parameters. We first give its declaration,\
    \ which includes its signature and its SPARK annotations:\n\n```\nprocedure Exchange\
    \ (X, Y : in out Float);\n--# derives X from Y &\\n--# Y from X\n```\n\nFirst\
    \ note that this subgraph has a dependency-relation present as a formal annotation\
    \ (--# comments). This is part of the subgraph's contract. It states that the\
    \ exported value of X is derived (only) from the imported value of Y (derives\
    \ X from Y), and the exported value of Y is derived (only) from the imported value\
    \ of X. This tells us rather about the intended behavior of the subgraph than\
    \ the pure **in out** parameter information itself.\n\nNow consider a correct\
    \ implementation of this subgraph:\n\n```\nprocedure Exchange (X, Y : in out Float)\n\
    is\nbegin\n  T : Float;\n  T := X;\nX := Y;\n  Y := T;\nend Exchange;\n```"
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Industrial Use of Formal Methods\n\nIf we apply the Examiner to this source\
    \ code, we are not informed:\n\n```\n+++ Flow analysis of subprogram Exchange\
    \ performed:\nno errors found.\n```\n\nHowever, we introduce a single coding error,\
    \ changing the final assignment\nfrom \"Y := T\" to \"Y := X\" instead, we see\
    \ a number of data and information flow\nmessages, including:\n\n```\nprocedure\
    \ Exchange (X, Y : in out Float)\nis\n  T : Float;\nbegin\n  T := X;\n  T := Y;\n\
    \  !!! (1) Flow Error : 10: Ineffective statement.\n  X := Y;\n  Y := X;\nend\
    \ Exchange;\n!!! (2) Flow Error : 50: Y is not derived from the\nimported value(s)\
    \ of X.\n??? (3) Flow Error :601: Y may be derived from the\nimported value(s)\
    \ of Y.\n```\n\nThe Flow Analysis chapters of [BAR 06a] covers in detail how these\
    \ various flow\nerrors and warnings are deduced. Note that just one coding error\
    \ has given rise to\nvarious errors and warnings; let's consider each of the three\
    \ above in a little\nmore detail:\n\n+   - (1) Ineffective statement. The assignment\
    \ (T := X) is now \"ineffective\",\nT is a local variable, and it is no longer\
    \ subsequently used to derive a value\nfor any of the subprogram's exports. This\
    \ is a flow error, in effect: assigning a\nvalue, failing to make use of it under\
    \ any circumstances. The remaining two\nerror messages shown from information\
    \ errors:\n\n+   - (2) Y is not derived from the imported value(s) of X. This\
    \ message tells us that\nalthough we've claimed in our contract that the exported\
    \ value of Y is derived from\nthe imported value of X, this has not been implemented.\
    \ The coding error\nwe introduced is discarding the value of X without making\n\
    effective use of it. No matter what the initial value of Y is on entry to this,\n\
    exported values of both X and Y will be unaffected by it, in other words:\n\n\
    +   - (3) Y may be derived from the imported value(s) of Y. Finally, we find that\
    \ the\nexported value of Y depends on its imported value, rather than that of\
    \ X. This is\nnot what we claimed in the dependency-relation part of the subprogram's\n\
    contract, so this discrepancy (between its contract and its behavior) is reported."
