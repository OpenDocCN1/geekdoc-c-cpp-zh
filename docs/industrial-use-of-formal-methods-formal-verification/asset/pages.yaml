    # 8.2.3. Taking into account techniques and formal methods


    It is interesting to note that the definitions of the B and C annexes (part 7
    of the CECI/IEC 61508 standard) use some articles and/or books, which are dated
    between 1970 and 1998, as references. It seems necessary to bring this up to date.


    # 8.2.3.1. Definitions


    # 8.2.3.1.1. Semi-formal method


    According to the CECI/IEC 61508 (B.2.3) standard, a semi-formal method offers
    a means of developing a description of a system at a stage of development (specification,
    architecture and/or design). The description can be analyzed and animated as to
    verify that the system model satisfies requirements (real and/or specified). It
    is indicated that state diagrams (finite controllers) and temporal Petri nets
    are two semi-formal methods.


    The CECLEC EN 50128 standard identifies semi-formal methods (see Table 8.1). In
    the outline of the new CECLEC EN 50128 [EN 11] standard, semi-formal methods as
    techniques have disappeared. This is due to the ambiguity that existed between
    formal and semi-formal and between semi-formal and structured methods. Certain
    manufacturers consider the existence of a modeling tool as enough to demand establishment
    of a semi-formal method.


    | SSIL0 | SSIL1 | SSIL2 | SSIL3 | SSIL4 |

    |---|---|---|---|--|

    | Logic/function block diagram | | R | R | HR | HR |

    | Sequence diagrams | | R | R | HR | HR |

    | Data flow diagrams | | R | R | R | R |

    | Finite state controllers/state transition semantic | - | R | R | HR | HR |

    | Temporal petri nets | - | R | R | HR | HR |

    | Decision/truth table | R | R | R | HR | HR |


