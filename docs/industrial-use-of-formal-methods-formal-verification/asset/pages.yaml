  md: '# Industrial Use of Formal Methods


    elements to verify; they must impose a weak intellectual service (simple, intuitive,
    and pragmatic method).


    Among the structured methods are SADT [LIS 90], JSD, CORE, Yourdon real-time,
    and MASCOT.


    Structured specification is a technique, which aims to give prominence to the
    simplest viable relationships between the partial requirements and the functional
    specification. Analysis is refined by stages, right down to obtaining small and
    straightforward partial requirements. A hierarchical structure of partial requirements
    is then obtained, and refined to be specified. The method highlights interfaces
    between requirements and enables interface failures to be avoided.


    # 8.2.3.2. Computer-aided specification tools


    In section 24.2 of the CEI/IEC 61508 standard, it is indicated that implementation
    of computer-aided specification tools allows a specification to be obtained in
    the form of a database, which can be automatically inspected to evaluate coherence
    and completion.


    The application can be made at any of the different phases: specification, architecture,
    and/or design. For the design phase, use is recommended once there are tools,
    but it will be necessary to show correction of the tool (experience feedback and/or
    independent verification of the results).


    # 8.2.4. Software requirement specification


    # 8.2.4.1. Requirement management


    The standards applicable to different industries render identification of the
    software application requirements mandatory. It should be noted that the literature
    presents several terms: prescriptions, recommendation, requirement, constraint,
    and property, which seem equivalent. The general CEI/IEC 61508 [IEC 98] standard
    uses the notion of requirement, but the most-used term remains the notion of requirement.


    Standards recommend that the specification of a software application be composed
    from a textual description of the requirements and all the notations necessary
    to facilitate understanding of the requirement. So, for the EN 50128 [CEN 01]
    standard, there is Table A.2 (Table 8.2).'
