    # 7.4.5. Third refinement and first decomposition: MetroSystem_M3


    This refinement does not introduce new details to the model. It corresponds to
    the preparation step before the decomposition. We want to implement a three-way
    event decomposition and therefore we need to separate the variables that will
    be allocated to each sub-component. In particular, for exchanged messages between
    the sub-components, the protocol will work as follows: messages are sent from
    Track and stored in Middleware. After receiving the message, Middleware forwards
    it to the corresponding Train. Train reads the message and processes it according
    to the content. This protocol allows a separation between Train and Track with
    the Middleware as a bridge between these two sub-components.


    The decomposition follows the steps described in section 7.3.2.2. Variables are
    distributed according to Figure 7.16. To avoid constraints during the decomposition
    process, predicates and assignments containing variables that belong to different
    sub-components are re-arranged in this refinement step.


    Some guards need to be rewritten in the refined events. For instance, grd10 in
    event leaveCDV is rewritten to include both variables trns (sub-component Train)
    and occ (sub-component Track). Therefore, it is changed from:


    ```

    Vtt-tt ∈ trns ∧ card(occ ∪ {c2 → tt})⁻¹([tt]) > 1 ⇒ (occZ ∧ {tt → c2})(tt) ≠ occA(tt):

    Vtt-tt ∈ dom(occZ) ∧ card(occ ∪ {c2 → tt})⁻¹([tt]) > 1 ⇒ (occZ ∧ {tt → c2})(tt)
    ≠ occA(tt)

    (Figure 7.17).

    ```


    Both represent the same property since trns corresponds to the domain of variable
    occZ (inv7 in Figure 7.13a). In Figure 7.17, the original guard grd3 in toggleToggleButton
    is rewritten to separate variables occp and door.'
