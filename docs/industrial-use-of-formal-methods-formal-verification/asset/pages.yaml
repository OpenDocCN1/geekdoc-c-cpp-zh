- pgno: 17
  md: '# Industrial Use of Formal Methods


    [BAR 06a] discusses three related considerations: correspondence with Ada, verifiability
    of compiled code, and simplicity of run-time systems. We shall briefly consider
    each of these and their implications for the language, before turning to the distinctive
    aspects of flow analysis and “Correctness by Construction” that SPARK makes possible.


    # Logical soundness


    The meaning of the code should be completely and unambiguously determined by its
    text, and should not be affected by considerations such as elaboration order or
    evaluation of sub-expressions. Thus, an assignment such


    ```

    Y := f(X) + g(X)

    ```


    is legal in SPARK if the order of evaluation affects the result (because f or
    g may have a side-effect on the value of X for instance, or on the value of some
    other global parameter used by such functions). The Examiner enforces the rules
    of SPARK, which prevent such order-dependence.


    # Simplicity of formal language definition


    If a language is complex and difficult to define, it will be difficult for users
    to understand, and more likely for errors of misunderstanding to lead to code
    that does not behave as users might reasonably expect. Indeed, experience suggests
    that parts of a language, which are baseline precisely are more likely to be a
    source of compiler problems; conversely, simplicity is likely to make it easier
    to reason formally about the behavior of code. Another aspect of this is that
    the subset of Ada, which is at the core of SPARK typically exercises the most
    “well-trodden” parts of an Ada compiler, making it less likely that the compiled
    code suffers from underlying compiler errors.


    # Expressive power


    While simplicity of language definition is to be encouraged, nevertheless we do
    not a language, which is so small and constrained that it is impossible to write
    significant applications in the language. SPARK supports abstraction, hierarchy,
    modularity, decomposition, low-level and real-time programming, as well as providing
    facilities for enforcing contractual interfaces between units. The proof of the
    expressive power of SPARK is well reflected in its use in real industrial applications
    in the numerous lines of code, as we shall-see later in this chapter.


    # Security


    By security, we mean that the language lacks insecurities. An insecurity present
    in Ada, for instance, entails the possibility of aliasing via parameter passing,
    where'
