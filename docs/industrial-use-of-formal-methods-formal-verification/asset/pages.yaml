  md: '# Conclusion


    The properties are conventionally separated into two groups: properties of safety
    and properties of liveness (see definition 8.2 and definition 8.3).


    | SSIL0 | SSIL1 | SSIL2 | SSIL3 | SSIL4 |

    | --- | --- | --- | --- | --- |

    | Formal methods comprising for example CCS, CSP, HOL, LOTOS, OBJ, VDM, Z, B |
    | R | R | HR | HR |

    | Semi-formal methods | | R | R | HR | HR |

    | Structured methodology comprising for example JSD, MASCOT, SADT, SDL, SSAMAD
    AND YOURDON | | R | HR | HR | HR |


    Table 8.2. CENELEC EN 50128 [CEN 01] – Table A.2


    DEFINITION 8.2.– PROPERTY OF SAFETY. The property of safety asserts that something
    bad never occurs during execution.


    As an example of the property of safety, we can cite the absence of blocking,
    mutual exclusion, etc. and in our case, the absence of a collision between trains.


    DEFINITION 8.3.– PROPERTY OF LIVENESS. The property of liveness expresses that
    something good inevitably occurs during execution.


    As we presented, the concept of property is related to an identification *a posteriori*
    of the application being analyzed must respect. In this context, the properties
    are identified in the phase of “conception” by analyzing the element in entries,
