  md: 'Industrial Use of Formal Methods


    # 7.1.5. A comparison between Event-B and other formal methods


    Classical B, Z, and VDM have a one-to-one abstract operation refinement, meaning
    that one abstract operation is refined by only one concrete operation. There is
    no facility for introducing new events in refinement of these formal methods.
    Event-B is more flexible as it has its refinement on action systems. Also, event
    merging and event splitting are permitted in Event-B refinement. Although Event-B
    is an extension of Classical B, there are some differences between them:


    +   The model structure operation is continuously executed in Event-B, the context
    as the static part of the system and the machine as the dynamic part of the system
    are explicitly specified. In the B method, a machine contains both parts.


    +   The enabled events are continually executed by other operations executed in
    a non-deterministic manner. In Event-B, we are modeling reactive systems, the
    events are not called and the model controls their behavior non-deterministically
    using the enabled events.


    +   A B method operation consists of pre-conditions, which express formally what
    is to be proved when the operation is invoked. The caller of an operation is responsible
    for ensuring that pre-conditions of the called operation are satisfied before
    calling it. The caller can assume that its pre-conditions are satisfied, and it
    does not need to check its pre-conditions. In contrast, an Event-B event contains
    guards. An event can be executed only when its guards hold. In Event-B, enabled
    events are non-deterministically chosen to execute.


    +   Refinement is more general in Event-B. Introducing new events is an important
    ability in Event-B refinement.


    # 7.2. Rodin as an Event-B tool


    Rodin [ABR 10, EVE] is an open source software tool for formal modeling and proving
    Event-B. Rodin is an open platform and is an extensible and adaptable modeling
    tool. The Prob animator [WI 02, LEU 08], UML-B [WI 03, SNO 06], B2LaTex [WI 01]
    and model decomposition [SIL 11] are good examples of plugin developments; Prob
    is a model checker, which checks the consistency of B machines; UML-B is a formal
    modeling tool mapping the Event-B language; B2LaTex is used for translating Event-B
    models into LaTeX; and model decomposition for decomposition of a model into sub-models.
    Decomposition will be explained in section 7.3.


    Like programming tools, Rodin carries out many tasks automatically, and provides
    fast feedback in the case of changes in a model text. While a programming tool
    provides feedback to the programmer by compiling and executing a program, Rodin
    provides feedback to modelers by generating proof obligations and verifying these
    using automated provers.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Rodin is an integration between modeling and proving. As described in previous
    sections, proving is an essential part of modeling. The proof obligations define
    what is to be proved for an Event-B model. Discharging all proof obligations of
    a model shows that all model properties are consistent. Sometimes, a model can
    be changed using proof errors. When a proof obligation cannot be changed, it shows
    that there is an inconsistency in the model. This leads us to learn more about
    the system to change the model in an inconsistent way. Therefore, during modeling,
    we can learn about the system and eliminate misunderstandings. We can also learn
    new requirements by proving the failed obligations.


    # 7.3. Event-B decomposition


    # 7.3.1. Overview


    Model decomposition predated Event-B, and one of the key features is introducing
    new events and new state variables during refinement. As a consequence, it usually
    ends up with many events and variables in the last refinement. Dealing with a
    large number of events and variables can be complex; particularly when we need
    to refine just a few variables and events and other variables play no role in
    refinement.


    Model decomposition in Event-B [SIL 11] is intended to increase the complexity
    and increase the modularity of a large Event-B model, especially after several
    layers of refinements. The idea of model decomposition is cutting a huge model
    into smaller pieces called sub-models, which we can more easily deal with the
    first model, and each of them can be refined separately.


    Distribution of proof obligations into several sub-models is one of the major
    results of model decomposition, which is expected to be easier to discharge. The
    further refinements of independent sub-models in parallel is a benefit of model
    decomposition. Moreover, the possibility of team development after model decomposition
    seems useful in developing a big system.


    An overview of the model decomposition in Event-B is illustrated in Figure 7.5.
    As presented, the model becomes bigger during refinement layers and with decomposition,
    it is split into smaller sub-models. Then, each sub-model can be refined independently.


    # 7.3.2. Decomposition styles


    There are two ways of decomposing an Event-B model, shared variable and shared
    event [SIL 11]. The shared event approach seems particularly suitable for message-passing
    distributed programs, whereas the shared variable approach seems'
