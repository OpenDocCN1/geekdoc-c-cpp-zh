- pgno: 223
  md: '# # Chapter 7


    # # Event-B and Rodin


    # ## 7.1. Event-B


    # ### 7.1.1. The Event-B definition


    Event-B [ABR 08] is a formal method for specifying, modeling, and reasoning about
    system based on set theory and predicate logic. Event-B evolved from Classical
    B[ABR 90] and Action Systems [BAC 89]. On the one hand, Event-B is a simplification
    as well as an evolution of the B-Methods; on the other hand, Event-B is influenced
    by the behavior of an action system approach. It has the same structure as an
    action system, which describes the behavior of a reactive system in terms of the
    guarded actions that can take place during its execution.


    Event-B is different from the B method in some aspects. The B method is organized
    in a way that is suitable for the development of non-concurrent programs, whereas
    Event-B is geared towards the development of systems including reactive and concurrent
    systems. Building a model in Event-B starts with a very abstract level, and continues
    in different abstraction levels by use of refinement, which will be explained
    in section 7.1.3. Event-B uses mathematical proof to verify consistency between
    refinement levels. Association of proof obligations in Event-B permits us to reason
    about it; see section 7.1.4. Rodin is a tool platform for modeling and proving
    in Event-B. It will be outlined in section 7.2. Section 7.4 describes the development
    of a metro system case study in Event-B.


    Chapter written by Michael BUTLER, Asieh SALEHI FATHABADI and Renato SILVA.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 7.1.2. Event-B structure and notation


    A model in Event-B [ABR 08] consists of contexts and machines. Contexts contain
    the static part (types and constants) of a model while machines contain the dynamic
    part (variables and events). Contexts provide axiomatic properties of an Event-B
    model, whereas machines provide behavioral properties of an Event-B model. Items
    of machines and contexts presented in this section are called modeling elements.
    There are various relationships between contexts and machines. A context can be
    ''extended'' by other contexts and ''seen'' by machines. A machine can be ''refined''
    by other machines and refer to contexts as its static part. Refinement is described
    more in section 7.1.3. The relationship between contexts and machines is illustrated
    in Figure 7.1.


    ![](img/701040363c568d7f491808943697cd68_224_0.png)


    **Figure 7.1.** Machine and context relationships


    From a given machine, Machine1 in this case, a new machine, Machine2, can be built
    as a refinement of Machine1. In this case, Machine1 is called an abstraction of
    Machine2, and Machine2 is said to be a concrete version of Machine1.


    # 7.1.2.1. Context structure


    Modeling elements of a context [ABR 08] are of four forms: sets, constants, axioms,
    theorems. This is illustrated in Figure 7.2. Axioms are predicates that describe
    the properties of sets and constants. Theorems are properties that should follow
    from the axioms. A context may extend one or more other contexts, and can also
    be seen by several machines in a direct or indirect way.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Context


    | Sets |

    | Constants |

    | Axioms |

    | Theorems |


    **Figure 7.2.** Structure of a context


    # 7.1.2.2. Machine Structure


    A machine [ABR 08] consists of variables, invariants, events, theorems, and variants,
    illustrated in Figure 7.3. Variables, $v$, define the states of a model. $I(v)$,
    constrain variables, and are supposed to be "hold" whenever variables are changed
    by an event. New events can be defined in a concrete machine. These will be described
    more in section 7.1.3. To prove that they do not take control forever, a new event
    must decrease a natural number expression called a variant.


    # Machine


    | Variables |

    | Invariants |

    | Theorems |

    | Variants |

    | Events |


    **Figure 7.3.** Structure of a machine


    # 7.1.2.3. Events


    In Event-B, state of model is changed by means of event execution. Each event
    is composed of a model, a set of guards $G(t, v)$, and some actions $S(t, v)$,
    where $t$ are parameters of the event and $v$ is state of the system, which is
    defined by variables. All events are automatic and can be executed only when their
    guards hold. When the guards of several events hold at the same time, only one
