    # 8.2.4.4. Model


    The new version of the EN 50128 [CEN 11] standard (Table A.3) recommends that
    software application architecture is based on a structured method (SADT, etc.).


    Yet it is possible to establish a model, which is based on the techniques of Table
    A.17 (see Table 8.5).


    | SSIL0 | SSIL1 | SSIL2 | SSIL3 | SSIL4 |

    |---|---|---|---|---||

    | Data modeling | R | R | R | HR | HR |

    | Data organization | | R | HR | HR | HR |

    | Command data flow | R | R | T | HR | HR |

    | Finite state controllers/transition schematics | | HR | HR | HR | HR |

    | ... | | | | | |

    | Formal methods | R | R | R | HR | HR |

    | Sequencing diagrams | | R | HR | HR | HR |


    **Table 8.5.** New CENELEC EN 50128 [CEN 01] – Table A.17


    The creation of a model M is to help understand a problem or a situation. In general,
    the specification phase, which allows adaptation of the specifications, involves
    creation of an M model.


    A model may be more or less close to the system studied, which would then be termed
    abstraction. The closer the model, the closer are the results obtained to those
    observed on the final system.


    Another characteristic of models is their dependence on a semantic for language
    support.


    The presence of a semantic enables implementation of reasoning techniques, which
    guarantee correction of obtained results.'
