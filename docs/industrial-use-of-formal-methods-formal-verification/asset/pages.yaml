    # 8.2.3.1.2. Formal method


    Section B30 of the CE/IEC 61508 standard indicates that a formal method (HOL,
    CSP, LOTOS, CCS, linear temporal logic (LTL), VDM† [J 90], and Z† [SPI 81]) enables
    an unambiguous and coherent description of a system at a stage of development
    (specification, architecture, and design) to be produced. The description takes
    a mathematical form and can be subjected to a mathematical analysis. This mathematical
    analysis may be performed automatically.


    A formal method generally offers a notation, a technique for processing a description
    in this notation, and a verification process for controlling correction of the
    requirements.


    The CEI/IEC 61508 standard indicates that it is possible to make transformations
    right down to "logic circuit design"^10.


    Petri nets and state machines (mentioned in the outline of semi-formal methods)
    can be considered as formal methods, according to the degree of conformity to
    a rigorous mathematical basis of their uses.


    # 8.2.3.1.3. Structured method


    The aim of structured methods (EN 50128, B.60) is to promote quality of software
    development in bringing attention to the first phases of the lifecycle.


    This type of method calls for some precise and intuitive notions (computer-aided)
    as to produce and document the requirements and characteristics of installation
    of the product.


    Structured methods are tools for reflection. They are based on an order of logical
    reflection, an analysis of the system taking into account environment, production,
    and documentation of the system, breakdown of data and the functions and the


