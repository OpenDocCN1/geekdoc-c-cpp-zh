- pgno: 272
  md: 'Using UML notation is thus not without certain questions [BOU 07, OKA 07].
    How to use a notation without a semantic? How to evaluate an application based
    on UM notation? etc. Several studies aim to offer answers to these questions,
    for example [OOT 04, MOT 05].


    At present, UML notation [OMG 06a, OMG 06b, OMG 07] is not recognized as a structured
    or semi-formal method in the standards, even if many would like to implement it
    completely or partially.


    In [BOU 07, BOU 09a], and Chapter 19 of [RAM 09], we have shown how UML can be
    used to create some models of safety-critical systems.


    In the context of RT3-TUCs, ANR-RNTL-MEMVATES projects, we have studied different
    ways of introducing UML as a means of modeling a safety-critical system; for example
    [RAS 08, BOU 08, IDA 07a, IDA 07b, OKA 07, BOU 05].


    Over the last few years, several studies have enabled a formalization of UML notation
    to be proposed by returning to formal languages, for example [IDA 09, IDA 06,
    MAR 04, MAR 01, MAM 02, LED 02]. Studies such as [MOT 05] must also be noted,
    which have it possible to suggest some additional rules for verifying UML models.


    # 8.2.4.5. Architecture


    Once the software application specification is created, it is then possible to
    establish an architecture. This architecture aims to break down the software application
    into components$^{16}$ (or modules, following the vocabulary used).


    Figure 8.12 presents an example of architecture. The software application has
    been broken down into three components ($C_1$, $C_2$, and $C_3$); there are interfaces
    between the environment ($E_i$, $S_j$, and $S_j$) and components and some interfaces
    between components; for each component, the list of requirements to take account
    is given.


    Creation of a software application specification and/or an architecture (though
    the same could be said of the design phase) must be able to continue processing
    (Figure 8.13) of the specification phase up to the design phase; not to mention
    the coding phase.


    16 In the new versions of the standards, the notion of components is used whereas
    in preceding versions, “module” (file, functions, class, etc.) was used.'
