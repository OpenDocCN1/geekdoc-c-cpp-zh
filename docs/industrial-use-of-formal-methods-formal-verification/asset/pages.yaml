    Lack of space and commercial confidentiality prevent us from disclosing a wider
    range of applications. Nevertheless, in the sections that follow, we will discuss
    various aspects of the applications shown in Figure 1.4, following roughly the
    order shown on the timeline (from past up to the present day).


    # 1.4.1. SHOLIS


    SHOLIS, the Ship/Helicopter Operational Limits Instrumentation System, is a ship-borne
    embedded software system that provides advice to a ship''s crew on the safety
    of certain helicopter operations and maneuvers over various scenarios.


    At the time of its implementation in the mid-1990s, it was the first system to
    be developed to meet the newly introduced rigorous requirements of the UK Ministry
    of Defence Interim Standard 00-55 for safety-critical software. Interim Defence
    Standard 00-55 had some novel and demanding requirements for the most critical
    software systems, including:


    +   - the use of a formal specification of system behavior;

    - static analysis including the flow analyses of SPARK source code that was performed
    by the Examiner;

    - formal verification (proof) at both the specification and the source code level
    (with the latter to prove that the code meets the specification);

    - independence of the development and verification/validation teams.'
