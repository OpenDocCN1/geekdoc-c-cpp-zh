  md: '# Conclusion


    The CEI/IEC 61508 [IEC 98] standard defines the notion of SIL (*Safety Integrity
    Level*). The SIL allows the security level of a system to be quantified. Safety
    integrity level 1 (SIL1) is the lowest and safety integrity level 4 (SIL4) is
    the highest.


    The CEI/IEC 61508 standard details the requirements necessary to be implemented
    to create a system and/or software, which achieves its safety objectives (SIL).
    The higher the safety level to be obtained, the more severe the requirements to
    be implemented and the greater financial impact. In effect, to obtain a probability
    for a dangerous failure, greater financial investment is necessary.


    The SIL *Integrity Level* enables prescriptions concerning functions integrity
    to allocate to E/E/PE systems to be specified.


