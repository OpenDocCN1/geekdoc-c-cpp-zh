    # 5.3. Theoretical foundations


    Although Perfect Developer was inspired by Dijkstra''s weakest-pre-condition calculus
    [DIJ 76], it owes more to Floyd-Hoare logic [FLO 67, HOA 69]. Operations in Perfect
    are specified using preconditions and postconditions, and can be composed in sequence
    or in parallel using the usual rules. In object-oriented designs, polymorphism
    and dynamic binding are verified by application of the Liskov substitution principle
    [LIS 94].'
