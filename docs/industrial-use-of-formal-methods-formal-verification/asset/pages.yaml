- pgno: 23
  md: '# Industrial Use of Formal Methods


    In short, the **global** and **derives** annotations of SPARK provide a richer,
    more rigorous description of the code''s "contract" with its environment, and
    make clear to a user of the operation which values it may read and write, without
    needing to examine the subprogram body to find this information. The flows analysed
    by the Examiner both ensure that these contracts are enforced, and detect errors
    and inconsistencies that may indicate subtle programming errors. These errors
    might otherwise go undetected until much later in the development process by SPARK,
    by which time they will be more costly to correct.


