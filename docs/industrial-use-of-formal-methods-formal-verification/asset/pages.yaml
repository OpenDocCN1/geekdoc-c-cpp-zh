  md: '# 2.2.5.5. Interests and limits of this solution


    With this new method, the estimate of reliability is more relevant and realistic.
    Indeed, reliability is not equal to one, as is the case for the Whittaker model
    when error is found; but one allows the limit when the number of test cases extends
    towards infinity.


    It is not necessary to have good coverage of the chain to have a relevant estimate
    of reliability. It is enough that the most used functions are sufficiently well
    tested.


    Calculating the probability of error can be carried out irrespective of the test
    cases executed; they are representative of the use for which it does not estimate
    the probability.


    All the test cases can be used to modify the probability of having an error in
    a particular transition. The time necessary to achieve reliability is consequently
    reduced.


    This method accounts for the fact that the probability of discovering errors in
    functionalities that have been heavily tested or not is inevitably stronger than
    in functionalities that have been greatly tested.


    If you consider a function is represented by a set of transitions in the test
    model, then the more these transitions are triggered by the tests, the higher
    is the probability of having an error in these tests. Thus the probability of
    having an error in the corresponding function will be weak.


    This method is well adapted for calculating reliability because it takes into
    account the functional structure of the software on the level of its interaction
    with the user; therefore, thanks to the profile association, it is able to provide
    a result with a good degree of reliability.


    Furthermore, it takes into consideration the importance of an error for a profile
    because the method does not give it the same weight if it is found during a frequently
    used transition for this profile.


