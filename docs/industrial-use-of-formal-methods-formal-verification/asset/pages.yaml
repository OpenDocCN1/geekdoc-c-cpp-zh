- pgno: 56
  md: '# Industrial Use of Formal Methods


    “A traveling salesman must visit "n" cities, passing through each city only once.
    He starts with an unspecified city and finishes by returning to the city of departure.
    The distances between the cities are known. Which course must he choose to minimize
    the distance covered?”


    The problem not necessarily have a solution. This problem is representative of
    the complexity of NP-complete problems. The existence of an algorithm of polynomial
    complexity remains unknown. Algorithms to solve TSP can be divided into two classes:
    the deterministic algorithms, which find the optimal solution; and the algorithms
    of approximation, which provide an almost optimal solution.


    Among the existing algorithms, one can quote the cutting-plane method [DAN 54],
    the facet-finding method [APP 95], or even the use of a genetic algorithm.


    The algorithms of approximation make it possible to find a solution for which
    the cost is close to the cost of the optimal solution. They have the advantage
    of making it possible to find a solution within a reasonable time.


    # 2.2.3 Coverage of all the states of the chain


    The problem associated with covering the arcs of a graph is still referred to
    as the Chinese Postman Problem (CPP). The initial problem consists of identifying
    the least expensive route through all the arcs of the graph pass.


    A certain number of assumptions can be taken into account; for example, the postman
    must leave and return at the same determined point, but the number of factors
    can be higher than one. The graph can be directed, and in some cases (for the
    rural postman) certain arcs are not required to be covered.


    Our problem consists of determining a set of test cases, so that each arc appears
    in this test series. If the graph is Eulerian, i.e. if each state has the same
    number of arcs entering and leaving, then there is a solution where each arc is
    covered exactly once. However, this does not have to do with the general case.
    The problem then consists of minimizing the additional costs generated by multiple
    coverage of the same arc.


    One solution to this problem consisting of finding a test set that makes it possible
    to cover all the branches in a directed graph, for a minimal cost, is presented
    in [LEG 05].


    # 2.2.4. Some indicators


    Different metrics can be calculated and exploited from the usage model formed
    by Markov chains.'
