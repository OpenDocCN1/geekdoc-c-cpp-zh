- pgno: 24
  md: '# 1.3.2. Code proof


    Along with the derives and global annotations of SPARK, there is another set of
    optional annotations known as proof contexts. These can be used to express a precondition-
    and post-condition on each operation, to provide additional assertions within
    subprogram bodies (particularly, not exclusively, within loops), and to declare
    “proof functions” as a mathematical shorthand for use in proof annotations. Proof
    functions are not executable functions, in the Ada sense: they are mathematically
    pure, and can be given semantics via proof rules, which the user may separately
    define.


    At one extreme, if we have a suitable formal specification of the required behavior
    of the code, we may attempt formal proof of correctness against this specification.
    This is the approach that was taken for the most critical SPARK code within the
    SHOLIS software, discussed here.


    At the other extreme, we may not carry out proof activities at all. In this case,
    we will gain the benefits of using the SPARK subset of Ada and its stronger contracts
    implies code improvements and flow analysis.


    Aside from carrying with SPARK is no code proof at all, the minimal formal proof
    of we may carry out is exception-freedom (GAR 93). This entails proving that the
    code will not raise a Constraint_Error exception at any point during its execution
    (A number of other Ada pre-defined exceptions are ruled out by using the SPARK
    subset which, such as Storage_Error, become straightforwardness in space and time
    requirements, and the enforcement of static limits in SPARK).


    Such a proof does not show any correspondence between the code and its specification.
    It merely shows, whatever it does, it will not use an invalid input into an array,
    or compare a result outside the range of the relevant base type or subtype, and
    so on.


    Typically, a combination will be used, with proof of exception-freedom for all
    of the source code, together with targeted proof for critical components. This
    can involve proving something stricter than pure correctness: for instance, we
    might prove that safety invariants are established and maintained.


    For example, in an elevator controller, we might want to prove that the elevator
    movement operations are never invoked with the elevator doors open (via pre own
    constraints), because this is a safety requirement, but we may not wish to prove
    availability, i.e. that all elevator requests get serviced eventually, because
    this is not required for the safety case.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Industrial Use of Formal Methods


    Where proof of exception-freedom is being performed, the annotations needed to
    make the proofs tractable are typically fairly-weight, provided good use is made
    of the SPARK language and its system type. For example, for a routine that limits
    to a range Lower_Bound..Upper_Bound, we might see a contract such as:


    ```

    -- pre Lower_Bound <= Upper_Bound;

    -- post The_Value in Lower_Bound..Upper_Bound;

    ```


    The pre-condition states that the range to which we are limiting is non-empty,
    the post-condition says that the exported value of The_Value returned by the routine
    is within. However, however, that is quite a "weak" as it does not state how the
    limiting is performed by the routine’s behavior. This may be all we need, however,
    for the purposes of proving the absence of run-time errors for this code and for
    other sub-programs, which make use of it.


    If, however, we are performing a more detailed proof then we need to know more
    about the operation''s effect to correct behavior of code makes use of this operation.
    We can achieve this by providing a more explicit post-condition, stating in a
    premise, a mathematical style that the subgraph is supposed to do. For example,
    consider a ISQRT, which is intended to return the "integer square-root" of a given
    input:


    ```

    function ISQRT (N : Natural) return Natural;

    -- return Root => Root * Root <= N and

    -- N < (Root + 1) * (Root + 1);

    ```


    The contract for this declaration says that we want to return the largest root
    that Root*Root <= N still (we know it is the largest, because the second clause
    says that the square of Root+1 is no longer less or equal to N).


    An important point about the contract of ISQRT is that it specifies what the function
    is to return, not how the result is to be calculated. It is a mathematical statement
    of what the function is required to achieve. An implementer is free to choose
    any appropriate implementation. This could be a simple search, starting at zero
    and going upward until a suitable value is found, or a more sophisticated binary'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# SPARK – A Language and Tool-Set 13


    search, or some other implementation relying on more subtle mathematical properties
    to determine the result. The key point is that the contract is the specification
    of what is to be discharged, free from such implementation details.


    Thus, SPARK provides the required machinery, in the form of formal annotations,
    where to give a precise mathematical description of the required behavior of the
    source code, which can form part of the subgraph''s contract included in a package
    specification. Users of the operation rely on the code meeting this specification
    provided we prove mathematical formulae – “verification conditions” (VCs), otherwise
    called proof obligations – which demonstrate this.


    To do so, we first use the Examiner to generate these formulae, which is an entirely
    mechanical process. Next, we attempt to discharge these proofs, typically using
    proof tools with SPARK''s Simplifier or other automated proof tools.


    Furthermore, note that such proofs are not as difficult as you might think. They
    are not of the complexity of establishing the four-color theorem, in fact, quite
    the opposite! Proof of exception freedom in particular typically involves large
    numbers of relatively mundane and not-to-demanding formulae, the exact sort of
    thing that is amenable to machine-supported proof.


    With little effort, it is common to discharge more than 95% of exception-freedom
    VCs at an early stage. The remaining small percentage can be investigated to determine
    whether they are symptoms of coding errors or not.


    In fact, the approach to completing the remaining proofs follows a simple iterative
    approach: the “proof cycle”, shown in Figure 1.3. In this approach, we annotate
    with the minimal set necessary, generate VCs, simplify these and then inspect
    the unproven ones. For those that have not been proven, they may be a symptom
    of an error, which needs to be rectified, or may just suggest that we need to
    strengthen or adjust our annotations.


    In either case, we fortify to resolve the problem (by adjusting our code in doing
    so), then we go around the cycle again: annotate to strengthen and adjust contracts,
    generate VCs, and fortify as necessary.


    More recent experience using this approach suggests that after just a few iterations
    on the remaining unproven VCs, we can achieve automatic proof of over 98% for
    well-written code practice, with very little extra effort. The small number of
    VCs remaining – typically less than 2% – can be tackled by other means, including
    any or all of the following:


    +   - creation of user-defined proof rules. The Simplifier allows users to write
    their own proof rules, which can then be used in attempting to discharge the VCs
    for particular subprograms,'
