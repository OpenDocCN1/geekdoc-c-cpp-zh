  md: '# 5.8.2. Arrays and pointers


    Possibly the biggest flaw in the C language is its lack of distinction between
    a pointer to a single storage location and an array (which, in C, is just a pointer
    to a block of contiguous locations). A related problem is that when an array is
    passed as a parameter to a function, the called has no way of determining the
    number of addressable elements in the array, unless this information is passed
    in an additional parameter. However, when writing specifications, it is frequently
    necessary to refer to the length of an array.


    We work around this problem as follows. First, we distinguish between pointers
    to single locations and arrays. This we do by using the keyword array when declaring
    an array pointer. Thus, in the following declarations:


    ```

    int *p;

    int *array pa;

    ```


    the variable *p* is a pointer to a single element, whereas the variable *pa* is
    a pointer to an array. Our tool forces the correct use of this annotation, for
    example by prohibiting the use of pointer arithmetic and indexing on pointers.


    Second, we treat an array pointer as if it is a structure comprising three variables:
    two ghost integer variables named *lb* and *upb*, which represent the lower and
    upper bounds of the array, and the storage pointer itself. The main use of the
    ghost variables is to describe the functions that ensure accesses are arrays.
    As a further convenience, the precondition of the array access *pa[i]* is *pa.lb
    <= i <= pa.upb*. We provide an additional ghost member *lim* (short for limited)
    and *up+1*.


    For example, in the following declarations:


    ```

    int *array pa null;

    int *p;

    ```


    variable *pna* may point to an array or zero, while variable *p* is a non-zero
    pointer to a simple variable or single element. This approach removes the need
    to pepper'
