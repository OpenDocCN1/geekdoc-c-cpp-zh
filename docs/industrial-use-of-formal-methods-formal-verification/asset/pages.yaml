- pgno: 99
  md: 'The node *Function2* has two input flows (*I1* and *I2*) and one output flow
    (O). In the models we carried out, these variables are either Boolean or they
    take their values in a small enumerated set of constants. The four variables of
    the node *Function2* take their values in a predefined domain called *FailureType*,
    which is equal to the enumeration {ok, lost, erroneous}.


    A node can also have events that can change the value of the state variables.
    The events are fully enumerated to model the occurrence of failures or the reaction
    to conditions on the flow value. We indicate if the event is started internally
    by the component in the case of a reconfiguration (in this case, the *Dirac* law
    of probability is associated with the event under the heading *extern*), or externally
    by its environment in the case of the occurrence of a failure (in this case, a
    law of probability of occurrence of the failure as associated with the event under
    the heading *extern*).


    The node *Function2* has two events, which represent failures: *loss*, which corresponds
    to the loss of this component and *error*, which corresponds to the erroneous
    behavior.


    The *trans* section contains the definitions of transitions being formed:


    ```

    g|evt-> e

    ```


    The guard *g* is a Boolean formula that can refer to the state and flow variables.
    The guard defines the configuration in which the transition can be carried out
    if the event *evt* occurs. The effect *e* modifies the value of the state variables
    if the guard is satisfied and if the event occurs.


    The transition associated with the event *lost* can be triggered only if the node
    *Function2* is not already in the state *lost*. The new value of state becomes
    *lost*. The value of a state variable can be modified only by one transition.
    The transition associated with the event *error* can be triggered if the node
    *Function2* is in the state *ok*. The new value of state becomes *error*.


    In the models we made, the assertions describe the calculation rules of the value
    of output flows according to the state of the component and the value of input
    flows:


    +   - the assertion with the output variable of *Function2* means that a correct
    value is produced (O = ok) when *Status* and the two input flows are equal to
    *ok*, no value is produced (O=lost) when *Status* is equal to *ok* and one of
    the two input flows is equal to *lost* or;'
