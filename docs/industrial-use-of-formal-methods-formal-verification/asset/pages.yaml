    # 5.10. The theorem prover by Perfect Developer and Escher C verifier


    # 5.10.1. Logic


    The underlying logic in which verification conditions are expressed is a many-sortedational
    logic with partial functions. The Perfect language is designed so that most of
    the verification conditions generated are first-order. This allowed us to use
    on a traditional first-order theorem prover using resolution and paramodulation,
    coupled with a term rewriting system.


    Some transformations are typically applied to proof terms by automatic theorem
    provers are unsound in the presence of partial functions, even when it is known
    that the theorem as a whole is either true or false. Care must be taken to avoid
    unsafe inferences in these situations.


    A few constructs – such as polymorphism, dynamic binding, and the limited form
    of left-fold supported by Perfect Developer and Escher C Verifier are not readily
    expressible in first-order logic. The theorem prover uses additional lemmas and
    inference rules to handle the terms which these constructs give.


    # 5.10.2. Term rewriter


    The term rewriter uses a set of hard-coded rules for actions such as literal evaluation
    and De Morgan''s laws. It also uses a larger set of parameterized rewrite rules,
    ordered to reduce confluence issues. Additional rewrite rules are generated from
    terms in the prover. Around 60% of verification conditions are proved by the term
    rewriter alone.


    We choose to integrate the proof with the rest of the tool, rather than to develop
    a separate entity. The disadvantage of this approach is that it is not straightforward
    to substitute another theorem prover. However, there are few theorem provers that
    correctly handle partial functions.


    Integrating the theorem prover has a number of advantages. For example, the specification
    and/or implementation being verified is accessible to the prover, which can inspect
    it for additional information and/or guidance in selecting appropriate heuristics.
    When the prover fails to detect a verification condition, it can use the'
