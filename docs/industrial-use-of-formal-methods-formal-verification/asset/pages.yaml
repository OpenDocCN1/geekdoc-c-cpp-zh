- pgno: 287
  md: '# Industrial Use of Formal Methods


    This analysis of behaviors can be made through implementation of static analysis
    techniques of code based on abstract interpretation [COU 00] and proof of programs
    [HOA 69]. The first volume of this series [BOU 11a] is dedicated to abstract interpretation.


    It should be noted that one of the difficulties in implementing these techniques
    lies in the absence of recognition of these techniques within the current standards.
    In effect, certain standards (see Table 8.4 and 8.13, extract from the standard
    CENELEC EN 50128 [CEN 01a] for example) advocate implementation of formal methods,
    but they do not mention the notion of abstract interpretation (derived methods).


    In the new version of the CENELEC EN 50128, (see Table 8.13) static analysis and
    the formal proof are directly cited as verification techniques. In Table A.13,
    we also see the notice of traceability that is very important for demonstrating
    the safety of the application.


    # 8.3. Conclusion


    This chapter presents some requirements to respect when a software application
    with a high safety objective [ISO 099], rail [CEN 01], and generic [IEC 98] industry
    standards, formal methods are advocated (see Tables 8.4 and 8.13) as a means of
    satisfying needs and achieving a controlled code production.


    In effect, some formal methods like the B method [ABR 96], SCADE [DOR 08], VDM
    [90], etc. give you the possibility to acquire the user, to formalize as a model,
    to demonstrate that some properties are respected and to generate code that matches
    usage of the model (no verification is needed the code if you are confident on
    the safety of your tools).


    This book and [BOU 12a] cover different aspects of formal techniques: static analysis
    of code, formal methods, and tools.


    The formal techniques and methods are now successfully being used for projects
    of various sizes in industry. The associated tools have reached maturity so that
    we can account for the complexity of such applications. Note that the complexity
    of industrial applications often has an impact on the processing time³³.


    32 The list is not meant to be total; for more information, see: example [MON
    00].

    33 Within the context of the SAET-METEOR, [MAT98] it took longer than a week in
    1998 to analyze 100,000 lines of Ada code with the Polyspace² tool (see Chapter
    8 for more information), whereas maintaining that would take one or two hours.'
