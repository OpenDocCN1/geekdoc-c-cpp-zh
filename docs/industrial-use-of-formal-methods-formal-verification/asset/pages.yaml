  md: 'The normal system is composed of two principal generators GEN1 led by engine
    1, GEN2 led by engine 2, and an auxiliary unit of power APU (Auxiliary Power Unit).
    The backup system is composed of a standby generator CSM. G supplied by the hydraulic
    system and the RAT (Ram Air Turbine) which is automatically deployed if the principal
    generators are lost.


    The electric power is provided to the loads by means of four busbars for the normal
    system: ACside1, DCside1, ACside2, DCside2, and by means of two essential buses
    in the backup system: ACess and DCess. The conversion of AC current to the DC
    circuit is performed by transformers TR1, TR2, and Tress. The system also uses
    circuit breakers to implement several types of short-circuits. For example, all
    the normal system generators (GEN1, GEN2, or APU) can be used to supply electricity
    to all the busbars of normal or backup systems when one or two generators are
