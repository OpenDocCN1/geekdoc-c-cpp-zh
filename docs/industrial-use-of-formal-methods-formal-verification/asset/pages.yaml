    In both types, the guards of the concrete event must be proved to be stronger
    than its abstraction (guard strengthening).


    # 2. Adding new events


    The new event refines a dummy event in the abstraction, which does nothing (skip).


    The new event does not diverge. It means that it should not take control forever.
    The new event can be labeled as


    +   - Convergent: Each event requires a variant to ensure non-divergence.

    - Anticipated: Events that will be introduced in a future refinement but are declared
    in anticipation.

    - Ordinary: None of the others and the most commonly used.


    # 3. Add new variables and invariants


    Introducing variables usually results in (2) or (1.a) types of refinement. Sometimes,
    abstract variables can be replaced by new variables. In this case, the refinement
    can result in (1.b). Variable replacement is called data refinement.


    A gluing invariant connects the abstract variables to the concrete variables.
    In other words, it glues the state of the concrete model to that of its abstraction.
    The invariant of the concrete model including gluing invariants should be preserved
    for every event.


    Each abstract event should be refined by at least one concrete event. One abstract
    event can be refined by more than one concrete event. This is called event splitting.
    Also, one concrete event can refine more than one abstract event. This is called
    event merging.


    Refinement is the process of enriching or modifying the abstract model to introduce
    new functionality or add details of the current functionality. From another point
    of view, there are two types of refinement:


