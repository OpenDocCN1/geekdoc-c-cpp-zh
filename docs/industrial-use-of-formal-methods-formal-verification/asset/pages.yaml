  img_proc: true
- pgno: 22
  md: "SPARK – A Language and Tool-Set 9\n\nWhere such \"derives\" annotations are\
    \ present and the Examiner is used to perform information flow analysis, any information\
    \ flow errors or inconsistencies between the contractual specification of the\
    \ code and its actual behavior will be reported by the Examiner. These derives\
    \ annotations are not mandatory. However, there is a core counter, which is mandatory,\
    \ and affects the Examiner's flow analysis. Considering adding a global variable\
    \ counter, which keeps track of how many times exchange gets called, for profiling\
    \ purposes:\n\n```\nbegin\n T := X;\nX := Y;\nY := T;\nCounter := Counter + 1;\
    \ -- added code\nend Exchange;\n```\n\nIf we apply the Examiner to this source\
    \ code, we are told:++++++\n\n```\nCounter := Counter + 1;\n^1\n***(1) Semantic\
    \ Error : 1: The identifier Counter is either undeclared or not visible at this\
    \ point.\n***(2) Semantic Error : 1: The identifier Counter is either undeclared\
    \ or not visible at this point.\n```\n\nend Exchange;\n\nWe get these error messages\
    \ because SPARK requires us to state, as part of the subgraph's contract, any\
    \ global variables that are accessed within the subgraph, together with their\
    \ mode: in (they are only used, not written to), out (only written to) or in (both\
    \ used and written to).\n\nIn the case of this sub-program, this means we must\
    \ also add a global annotation to the specification. In addition, if we are performing\
    \ information flow analysis, we need to update its dependency relation to reflect\
    \ the subgraph's effect on the counter. For the correct implementation of the\
    \ exchange, with updating the counter, the full specification is:\n\n```\nprocedure\
    \ Exchange(X, Y : in out Float);\n-- global X from Counter;\n-- derives X from\
    \ Y &\n-- Y from X &\n-- Counter from Counter;\n```"
