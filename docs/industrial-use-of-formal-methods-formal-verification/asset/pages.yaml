    The use of SPARK proved to be a major success, with [CRO 96, MID 05] reporting
    that the use of formal methods was "advantageous from an economic standpoint",
    while "the technology for generating and discharging the proof obligations, based
    on the formal definition of the SPARK component of Ada, was crucial, in binding
    the code to the initial requirements". The use of SPARK contributed directly to
    the economic savings reported, in helping to produce code with an unusually low
    defect density.


    # 1.4.3. MULTOS CA


    As reported in [HIL 02, CHA 00], the Multi-Application Operating System (MULTOS)
    is an operating system designed for use on smart cards. It allows several applications
    to reside on a single device and enforces separation of applications. Digital
    certificates signed by the MULTOS Certification Authority (CA) are used to prevent
    forging of smartcards and applications, which is a key security concern.


    The system at the heart of the MULTOS CA, which issues digital certificates, is
    subject to stringent security constraints and is required to meet the standards
    of level "E6", the highest assurance level of the UK ITSEC scheme ITS 91].


    A requirement for the software is that it should be run uninterrupted. The software
    cannot be upgraded or restarted without significant effort. As a result, avoiding
    memory leaks or unexpected behavior, such as termination via an exception, was
    a major goal. The system components were further classified into a number of security
    categories, with the user-interface and data coming from it considered insecure,
    for instance, requiring rigorous validation.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '20 Industrial Use of Formal Methods


    The security-enforcing core of the system was implemented in SPARK. SPARK flow
    analysis made an important contribution to establishing the absence of subtle
    security vulnerabilities: failure to initialize a variable might lead to unencrypted
    information leaking out of the system, for instance, so data flow analysis can
    be used to demonstrate the absence of this particular vulnerability. Information
    flow analysis was also useful in this respect, showing that certain data elements
    cannot affect other elements, giving confidence that such security properties
    were being established and maintained by the code.


    The development of the MULTOS CA software demonstrated that SPARK can aid in showing
    the security requirements and separation of concerns are achieved.


    Furthermore, despite the stringent analysis and verification activities, productivity
    of 28 LOC per day was achieved, even measured over the whole development lifecycle.
    The overall defect density achieved was very low: 0.04 defects per KLOC were found
    in service one year after delivery, in an overall system of roughly 100 KLOC.


    # 1.4.4. Tokener


    To study the effectiveness of SPARK and the CyBC approach, and its relevance to
    the security community, the US National Security Agency (NSA) commissioned Praxis
    to redevelop the software for the Tokener ID Station (TIS) using SPARK and CyBC
    [BAR 06b] (the Tokener ID Station is one component of a larger system, Tokener,
    which was originally developed by the NSA as a research vehicle for investigating
    various aspects of biometrics as applied to access control).


    Tokener itself ensures of a secure enclave, physical access to which must be controlled,
    and which are a number of workstations. To gain access to the enclave and the
    workstation, use security tokens (for instance, smart cards), which must be presented
    to a reader external to the enclave. The reader uses information encoded on the
    entry token to carry biometric tests (such as fingerprint reading). The door to
    the enclave will only be opened if the user passes these tests, allowing the user
    to enter the enclave and use the token to gain access to the workstations.


    At the heart of the TIS is the TIS Kernel, on which the security assessments and
    certifications were required to focus. The TIS Kernel, intended for use in high
    risk environments, was required to meet evaluation level (EAL) 5 of the Common
    Criteria [ISO 99].'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'SPARK – A Language and Tool-Set 21


    To summarize, the main steps of the development process used to meet the TIS Kernel
    requirements were as follows:


    +   - requirements analysis. The most expensive mistakes to fix are those that
    occur early in the development process. The Praxis team used the REVEAL¹ requirements
    engineering approach to investigate and clarify the system boundary, which also
    helped to clarify dependencies on aspects of the environment outside the TIS Kernel,
    such as certificates and the behavior of the dog and its latch;

    - security analysis. This involved creating a Security Target and a Security Policy
    Model, which seek to identify only the key properties that must be satisfied to
    ensure security, and ignore other aspects such as functionality, ease of use,
    etc. This also helps in gaining further insight into the requirements, and can
    be used to prove the functional specification has required security properties,
    acting as a factor of validation of the specification;

    - specification. This requires that we develop a sufficiently detailed, rigorous
    specification before writing code. It is an essential step in documenting what
    you expect the system to do, rather than leaving it to the coders to guess this.
    When the code is designed and written, design and code review activities will
    be more fruitful and rigorous if the review is focused on checking that the code
    delivers the functionality documented in the specification. In addition, testers
    will be able to derive tests from the specification. For the TIS Kernel, Z notation
    was used;

    - design. Prior to writing the executable code, one or more design steps are applied,
    depending on the size of the system and the complexity of the design decisions
    to be made. For the TIS Kernel, two further documents were developed:

    - a refinement (in Z) of the functional specification,

    - an outline of the SPARK packages be developed, including the location of a persistent
    state, using notations from the INFORMED design method for SPARK [INF 05].


    These documents had clear purposes, including the documentation of difficult implementation
    details, the detailed definition of the structure and content of audit elements
    and how they should be stored, the definition of the concrete representation of
    certificates, the provision of a top-level design of the main software components
    and the information flow between them, which can be analyzed by the Examiner:


    +   - implementation. The package structure outlined in the design stage can then
    be fleshed out with SPARK package bodies implementing the required functionality,


    3 REVEAL is a UK registered trademark of Altran Praxis Ltd.'
