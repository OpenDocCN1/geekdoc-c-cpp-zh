- pgno: 133
  md: '# # Chapter 4

    # Polyspace®


    # ## 4.1. Overview¹


    The development of embedded systems encompasses a wide range of practices and
    development methods. For critical projects intended for extremely robust applications,
    the production of very high quality software is essential. Development and test
    teams need to carry out code reviews and test the target operating system.


    But is this really enough? What would happen if a critical problem went unnoticed
    during the development phase in the operational use of the code?


    Methods based on mathematical techniques can enable us to alleviate doubt.


    The application of formal methods on code verification using abstract interpretation
    can provide development teams with a report on the piece of code that will work
    well, and those that have or risk having errors. This chapter presents the practical
    application of these techniques for software verification.


    In the context of the application of this quality improvement technique, this
    chapter explores the techniques that can be used with Polyspace®, one of the MathWorks®
    products.


    > Chapter written by Patrick MUNIER.

    1. This chapter describing the Polyspace® product and its main uses in industry
    comes from an internal MathWorks report from January 2011.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 4.2. Introduction to software quality and verification procedures


    Most software development teams aim to maximize both quality and productivity.
    During software development, however, there are always three interdependent variables:
    cost, quality and time. Generally, the criticality of the final use determines
    which of these variables is to be favored. With classical testing processes, development
    teams usually try and reach their quality objective by testing all the modules
    of an application until each meets the required quality level. Unfortunately,
    this procedure is often stopped before the quality objectives are reached or the
    allocated time and/or budget has run. Furthermore, code verification and testing
    that is carried out at the end of the development process is not enough to attain
    maximum quality and productivity. It must be integrated into the whole verification
    process, respecting time and budgetary constraints.


    The verification and validation process (often referred to as V&V) of embedded
    systems consists of determining whether the requirements of the software are correctly
    and completely implemented, and whether they are traceable to the system requirements.


    The main objective of a V&V process is to analyze and test the software during
    the development and test phase to ensure that the software does its intended functions
    correctly, to make sure it does not perform any unintended operations, and to
    provide information about its quality and reliability.


    V&V also enables us to determine whether the software meets its technical specifications,
    as well as its in terms of security, robustness and reliability. V&V analyses,
    reviews, demonstrates, or tests everything that is produced by software development.
    This process is often described in the form of a V diagram, as presented in Figure
    4.1.


    The specific classes of software defects that, strictly speaking, can be introduced
    into the development and coding phases of the V&V process are coding and design
    errors, as well as execution or run-time errors, which are software errors that
    are considered latent.


    Coding errors occur due to improper implementation of code when compared to the
    requirements or specification. For example, the specifications require the existence
    of three fault conditions, but the code only implements two of them. Design errors
    occur when the code does not behave as it should for a specific operating environment.
    For example, a variable that is a 16-bit type for which the program produces a
    result greater than the highest value that can be represented on 16 bits.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   - non-initialized variable: if a variable is not initialized before it
    is read, it can contain an unknown value;

    - access the bounds of an array: this represents reading or writing of data outside
    the bounds of the allocated memory;

    - de-reference of a null pointer: this occurs when attempting to reference memory
    with a pointer that is NULL. Any de-reference of this pointer leads to a crash;

    - incorrect arithmetic calculation: these errors are caused by arithmetic errors
    such as overflows, divisions by zero, or for example by taking the square root
    of a negative value;'
  merge: -1
  img_proc: true
- pgno: 136
  md: '— concurrent access to shared variable: this error is caused by two (or more)
    variables declared in different tasks that want to access the same memory location;


    — illegal type conversions: these can lead to data corruption;


    — dead code: even though dead code (code that cannot be executed) does not really
    represent a run-time error, it may be important to explain its presence. We can
    note that standards, such as DO-178B [RTC 92] prohibit the presence of non-justified
    dead code;


    — non-justified infinite loops: these errors are caused by incorrect guard conditions
    on loop operations (for example, while, etc.) and may result in system hangs or
    halts.


    The following sections present various techniques that can be used to minimize
    or eliminate these errors in software, and describe how these techniques can be
    integrated into a V&V process to create high-quality embedded software.


    # 4.3. Static analysis


    Static analysis, or static verification, is a generic term that can be applied
    to any tool that derives the dynamic properties of a program without executing
    it. Most static analysis or verification tools only verify the complexity of the
    software and look for constructions that can potentially be dangerous.


    As described in [BES 10], these tools can usually find errors in the code, but
    will miss errors that are strongly dependent on data flow (such as run-time errors
    or design errors).


    Due to the fact that they do not exhaustively analyze all possible behaviors,
    these tests are not considered sound (they miss errors) and produce “false negatives”
    (undetected real errors). Decreasing the risk of false negatives will increase
    the probability of false positives, that is to say the production of alarms that
    are not linked to real problems in the code.


    The use of classic static analysis tools can contribute to the automation of part
    of the verification procedure, this advantage must be carefully weighed against
    the ability of tools to generate false negatives and not detect errors.


    # 4.4. Dynamic tests


    Dynamic tests verify software execution flow. Wagner [WAG 06] describes this methodology
    and explains the applications of these tests according to the dimension of types
    (both functional and structural) and granularity, such as unitary tests, integration
