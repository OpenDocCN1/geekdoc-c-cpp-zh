  md: '# Industrial Use of Formal Methods


    – when the same sequence of functionalities appears on several occasions, creating
    only one graph is sufficient and it could be used in various places in the model;


    – factoring calculations on the entire model is simplified by the modular approach;


    – storing the model in the form of files and re-using them are facilitated.


    # 2.2.2.4. Inclusion graph


    Using hierarchical levels creates an inclusion graph concerning the model. This
    inclusion graph defines the dependencies between the model’s various hierarchical
    levels.


    > DEFINITION 2.4.– The chain source is the graph corresponding to the root of
    the inclusion graph. The other constitutive graphs of the test model are indicated
    under the subchain.


    To avoid creating infinitely sized models with this inclusion system, we specify
    the following rule when adding a new subchain in a model: “it is possible to include
    a completely new chain that does not appear in the source path, or does not include
    another subchain, which is already in the source string path”.


    In other words, it is an acyclic graph. These rules of inclusion are illustrated
    in the example given in Figure 2.3.


    ![](img/701040363c568d7f491808943697cd68_50_0.png)


    Figure 2.3. Rules of inclusion'
