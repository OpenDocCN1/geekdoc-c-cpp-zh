    The goal of this chapter is to summarize what was presented and to provide an
    update on the changes taking place. Recall that the objective of these three books³
    is to make an inventory of the use of formal techniques (simulation, model-checking
    [BAI 08]; proof, abstract interpretation, etc.) and formal methods (for example,
    B method [ABR 96], LUSTRE [HAL 91], BEN 03, HAL 05], SCADE [HAL 05, DOR 08]; AltaRica
    [BAR 03]) by industrialists. We will not discuss the scientific challenges and
    possible future developments.


    # 8.2. Structured, semi-formal and/or formal methods


    # 8.2.1. E/E/PE system


    The CEI/IEC 61508 [IEC 98] standard is a generic standard, which may be applied
    to electronically based and/or programmable complex systems termed E/PE (electric/electronic/programmable
    electronic). This standard is edited by the International Electrotechnical Commission
    (IEC), which is the international standardization organization responsible for
    electricity, electronics and related techniques.


    The CEI/IEC 61508 [IEC 98] standard proposes a globalized approach to security,
    in the sense of safety/verifiable safety², comparable to the ISO 9001:2008 [ISO
    08] system for quality. The CEI/IEC 61508 [IEC 98] standard is totally consistent
    with the convergence observable between different industrial sectors (aeronautical,
    nuclear, rail, automobile, manufacturer, etc.), but the content of the CEI/IEC
    61508 is sufficiently complex, not to mention unusual, as needed “to be guided
    through”, as interested readers will be able to read in [ISA 05, SMI 07].


    > The French version of the Industrial implementation of formal methods is composed
    of four volumes, whereas [BOU 1a, BOU 11b, BOU 12c, BOU 12d]; and three books
    in English this book, along with [BOU 12a, BOU 12b].

    To find out more about the IEC, visit: www.iec.com.

    4 The CEI/IEC 61508 [IEC 98] standard does not cover the confidentiality and/integrity
    aspects, which are linked to establishment of precautions aiming to prevent non-authorized
    persons from damaging and/or affecting safety achieved by the E/E/PE system or
    systems. Notably, management of the network aspect as to avoid intrusions comes
    to mind here.'
