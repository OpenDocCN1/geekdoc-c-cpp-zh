    # 3.3.3. Tools associated with AltaRica


    The development of AltaRica models is supported by industrial and academic tools,
    which provide functionalities such as a graphic editor for models and a components
    manager. Moreover, these tools also offer facilitating safety analysis. In this
    section, we present in detail the various tools allowing AltaRica model analysis.


    # 3.3.3.1. Interactive graphic simulator


    The interactive graphic simulator is an extremely useful tool for understanding
    the behavior of a model. The tool graphically presents the AltaRica model as well
    as its current configuration. The color of the lines indicates the nodes the current
    value associated with the input and output variables by these lines.


    Icons are associated with each state of a model. For example, a green box is posted
    when the variable of the component is equal to ok, a red box is posted when this
    variable is equal to lost, and a blue box is posted in other cases. The icons
    and the colors of the links make it possible to quickly assess the current state
    of a set of components. It is also possible to inspect in detail the values of
    the variables by using a textual interface, which lists the set of the variables
    and their current value.'
