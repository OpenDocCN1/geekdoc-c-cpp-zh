    # 1.4.5. Aircraft monitoring software


    This is another embedded aircraft system, the design approach for which is described
    in [AME 04], with software written in SPARK using the CyC approach.


    A novel aspect of the approach was the use of UML, with INFORMED [INF 05] to design
    the structure of the software components and guide the construction of the UML
    model. The overall design approach entailed:


    +   - use of INFORMED to construct a design for the relevant system component;

    - the capture of the design in UML, including component contracts (in the form
    of SPARK annotations);

    - the validation of the system design at an early stage through the use of the
    Examiner to check for errors;

    - the implementation in SPARK, using the Examiner to establish that the code meets
    its contract.


    UML stereotypes were used to define new elements, as a SPARK Ada package. UML-tagged
    values were used to include essential SPARK elements within the UML model, as
    SPARK core annotations for packages and sub-programs.


    This allowed the UML model to be constructed in such a way that the overall structure
    of the SPARK source code could be generated from the UML model. This provided
    the main aspects – package, type and sub-definitions of the SPARK source code,
    but not the executable sub-program bodies; these were hand coded, and the Examiner
    was used to ensure that the hand-written code for each unit met its contract,
    with proof of exception-freedom of the source code performed as a standard part
    of the development process.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 1.4.6. iFACTS


    NATS, the UK''s leading air traffic services provider, has pioneered research
    and development into new predictive (look-ahead) tools for air traffic controllers.
    iFACTS – the interim Future Area Controls Tools Support – provides tools for trajectory
    prediction, conflict detection, and monitoring aids. It will replace traditional
    paper information strips with electronic data and new displays. iFACTS enables
    air traffic controllers to increase the amount of air traffic they can handle,
    providing capacity increases and enhancing safety.


    NATS approved Praxis to develop safety software for iFACTS, which needed to meet
    SW01, the stringent software safety regulation by the UK Civil Aviation Authority.
    Praxis applied its Correctness by Construction method, deployed a multi-disciplinary,
    multi-national team of over 100 engineers, and worked with NATS at all levels
    to ensure success.


    The iFACTS source code consists of over 200 KLOC of RavenSPARK source code, from
    which 120,000 verification conditions are generated to prove exception-freedom.
    The Examiner and the Simplifier between them prove 98.5% of these VCs automatically,
    without the aid of any user-defined proof rules.


    All of the VCs can typically be generated and simplified automatically overnight
    on approximately 1,800 VCs, some 1,500 are also discharged automatically once
    user-defined rules are used; again, this can be achieved as part of the overnight
    run of the SPARK tools on the overall source code. This has been carried out throughout
    development, allowing any flow errors or unproven VCs resulting from changes to
    the source code to be detected and addressed as soon as possible.


    Initial versions of iFACTS have successfully been deployed to the live operational
    environment at Swanwick''s en-centre and used for shadowing and operational trials
    at quiet times of the day. It became fully operational in 2011.


    # 1.4.7. SPARK Skein


    One perceived of SPARK, and Ada in general, is that it entails greater overheads
    than a rather raw, lower-level language such as C, which provides minimal protection
    against coding errors and minimal run-time overheads. This perception is, however,
    entirely incorrect. It is possible to take full advantage of the benefits of SPARK
    and still achieve performance that is the same as that which can be achieved with
    less supportive languages, as a recent paper [CHA 10] on the development of SPARKSkein
    has shown.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# SPARK – A Language and Tool-Set 25


    Skein is a new family of cryptographic hash functions, designed to be fast, secure,
    and simple. The reference implementation on [SKE] is in C. As reported in [CHA],
    Praxis and AdaCore engineers re-engineered this implementation into a reference
    SPARK implementation, identifying a code flaw in the C implementation in the process.
    Through the use of appropriate compiler switches with the GNAT compiler used for
    this, it was possible to achieve similar levels of efficiency in the SPARK executable
    code, indeed performance which could surpass that of C implementation in the right
    circumstances.


    The SPARKSkein implementation project demonstrates not only that it is possible
    to have rigor without loss of efficiency, but also SPARK is a powerful and flexible
    development toolkit applicable to a wide variety of application areas.


    # 1.5. Conclusion


    SPARK provides a high-integrity language for the development of software for critical
    applications, supported by powerful, industrial-strength analysis tools such as
    the Examiner and Simplifier. Furthermore, as the cases we have looked at have
    consistently shown, the use of a rigorous language and powerful analysis can yield
    lower defect software without any reduction in whole-lifecycle productivity.


    Indeed, we would argue that the benefits that have been demonstrated are so great
    that the use of SPARK in any project, whether critical or not, makes good economic
    sense. This is a reflection of the fact that using such techniques, it is possible
    to trap errors earlier in the development process, leading to higher-quality code
    by the time that commences and less time spent in testing.


    Recent developments in SPARK include the launch of the GPL (General Public License)
    version of SPARK, which aims to drive the use of SPARK high-assurance programming
    techniques and tools by a larger portion of the overall software development community.
    This has been undertaken in partnership with Praxis and AdaCore. The professional
    toolkit SPARK Pro is now globally available from AdaCore.


    The more recent SPARK Pro toolkit offers additional tools not present in earlier
    releases of the SPARK tools. This includes “ZombieScope”, which allows the Examiner
    and the Simplifier to be combined to search for non-executable or “dead” paths
    through the source code (hence the name). It is also available on a wider range
    of platforms and supports extensions such as the automated checking of safety
    and security policies through flow analysis.'
  merge: -1
  img_proc: true
