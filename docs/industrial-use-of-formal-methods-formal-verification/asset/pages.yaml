  md: '# Industrial Use of Formal Methods


    as an Ada compiler is concerned, it is easy to see that SPARK programs are also
    Ada programs as a consequence of the language definition.


    # Verifiability of compiled code


    For critical applications, it may be necessary to inspect or review the output
    from the compiler, as an additional verification activity. This may be done to
    ensure that the executable object code does indeed correspond to the source code
    that is input to the compiler, and to gain confidence that errors in the compiler
    have compromised the correctness of the code. In practice, this can be a cumbersome
    activity, particularly for a complex language using dynamic allocation or constructs,
    which can make this comparison difficult to undertake. The consequence of the
    SPARK approach, using a subset of Ada with simpler semantics, static constants
    and the avoidance of features, which require dynamic allocation and de-allocation
    is that this activity is somewhat more tractable than it would be for a more complex
    language.


    # Simplicity of run-time systems


    As already mentioned, an important consideration in designing SPARK was to allow
    SPARK programs to be used in high-integrity embedded systems. For systems we typically
    require a small run-time system, with certification of the run time system to
    meet the required standards for the application area. Again, the design of SPARK
    is such that a relatively small and straightforward run-time system can be used.


    # 1.3.1. Flow analysis


    With the core annotations, which are an essential part of SPARK, its support tool,
    the Examiner, can perform various flow analyses to look for potential anomalies
    in the source code. These are an "well-formedness" check, and can be effective
    in detecting flaws, which might otherwise go unnoticed after considerable testing.


    The analyses performed by the Examiner are rigorous and mathematically defined.
    They are based on those defined and described in [BER 85]. To undertake such analyses
    with speed and rigor, the source code must be well-structured. SPARK achieves
    this by a combination of its choice of Ada subset, together with other constraints,
    which are enforced by the Examiner, such as some restrictions on exit statements
    may be placed within loops.


    There are two types of flow analysis that the Examiner performs: data-flow analysis
    and information-flow analysis.'
