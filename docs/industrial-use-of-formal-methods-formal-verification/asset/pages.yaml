  md: '# 86 Industrial Use of Formal Methods


    to describe the behavior of a system in a nominal case and in the presence of
    failures at the same time. We retained it because it is a simple formal language
    that is also hierarchical and compositional. Its clearly defined semantics and
    syntax enable it to be coupled with various reliability and validation tools,
    such as Aralia [JAU 93, DUT 97], Moca-RP, or model-checkers like Mec V (VIN 03,
    VIN 04) or SMV [McM 94]. Continuing in this section, we present the principal
    components of the fragments of the AltaRica language that we used (AltaRica Dataflow).


    # 3.3.1.1 AltaRica node


    Each component is described by a node comprises three parts: the declaration of
    variables and events; the definition of transitions; and the definition of assertions.


    ![](img/701040363c568d7f491808943697cd68_97_0.png)


    **Figure 3.1.** Graphic representation of the node Function2


    We illustrate these concepts with the example of a computation with two input
    flows. The component Function2 has two inputs I1, and I2 and an output O. When
    it does not undergo any failure, this function produces a correct value provided
    that each one of its inputs is correct; it does not produce any result when at
    least one of these two inputs is absent and it produces an erroneous value in
    the other cases.


    ![](img/701040363c568d7f491808943697cd68_97_1.png)


    **Figure 3.2.** Automaton of the failure modes of the node Function2


    If the node Function2 is not lost, a failure categorized as an error can occur,
    which causes the erroneous state. In this state, the node Function2 produces an
    erroneous value. In the same way, a failure categorized as lost can occur, which
    causes the state lost. In this state, the node Function2 does not produce a value.'
