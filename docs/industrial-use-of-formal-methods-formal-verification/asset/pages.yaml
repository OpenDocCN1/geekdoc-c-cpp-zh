  md: 'To check the requirements, we used sequence generation as well as model-checking.
    Initially, checking the requirements failed, and this was related to deficiencies
    of the contactor controllers.


    We analyzed the generated sequences that invalidated the requirements and corrected
    the controllers.


    The interest in sequence generation is that it is very simple and provides a list
    of minimal sequences leading to the failure condition. Considering these minimal
    sequences are comparable to minimal cuts, it becomes possible to assess the model
    quantitatively. One of the disadvantages of sequence generation is the duration
    of calculations since become very long for larger models (model containing more
    than 200 failures on a mono-processor computer).


    In the case where the set of sequences is not needed, model-checking offers an
    alternative. It is enough to check a temporal property indicating that no sequence
    smaller than a certain limit leading to the failure condition. When this check
    fails, the generated counterexample can be interpreted as a sequence of events
    leading to the failure condition. This sequence can be played using the interactive
    simulator to understand the origin of the problem. This facilitates the correction
    of the model.


    # 3.4.2.4. Partial conclusion


    Modeling the electrical system proposed in this section illustrates the principles
    used for other physical systems (a mechanical part of the flight control device
    [BER 07], hydraulic system [BIE 04], engine [ADE 10], etc.). Modeling the propagation
    of the failures requires the use of bidirectional flows; this involves the appearance
    of circular deficiencies that must be treated. To eliminate these loops, we propose
    adding delays. This makes the model incompatible with fault-tree generation tools.
    It is thus necessary to use verification tools to treat dynamic systems, such
    as sequence generation and model-checking.


    # 3.5. Comparison with other approaches


    As the preceding sections show, the AltaRica language makes it possible on the
    one hand to model the propagation of failures of the components of a system using
    a static or dynamics, model, reflecting the system architecture and, and on the
    other hand, the associated tools make it possible to use the model in order to
    qualitatively and quantitatively analyze the occurrence of several failure conditions.
    Other approaches, more or less recent, were proposed to achieve similar goals.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 3.5.1. Some precursors


    The approaches of FPTN [FEN 94] and HipHops [HEI 01] were proposed to carry out
    compositional models of the propagation of failures and to extract fault-trees
    from these models. Each component of the model includes inputs and outputs that
    conveys failure modes according to a Boolean logic rules specific to the component.
    These approaches are suitable when the study of static dependencies between components
    of the system is possible and sufficient for the needs of the safety analysis.


    The networks of stochastic activities [DAL 00] are an extension of the stochastic
    Petri nets that let the user make models of the propagation of compositional and
    dynamic failures. The associated Moebius tool makes it possible to estimate various
    measurements of reliability using stochastic simulations. To our knowledge, the
    tools for scenario generation applicable to this type of model still need to be
    developed.


    Another language, Figaro, makes possible to describe a hierarchical system starting
    from knowledge bases [BOU 91]. According to the type of the knowledge base, it
    would be possible to make a static model of the analyzed system and to generate
    fault-trees. More quantitative analyses on the dynamic part of a system could
    also be carried out. AltaR is a less expressive language but was formally defined
    to model static and dynamic architectures at the same time and to interface easily
    with existing tools.


    # 3.5.2. Tools for preprocessing formal languages


    More recently, tools for generating fault-trees or sequences leading to a failure
    condition were developed for compositional formalisms initially conceived to model
    the dynamics of the complex systems like SCADE, StateMate, Simulink – State Flow
    or Nu-SMV [AKE 99, AKE 03]. These languages have a priori an expressivity higher
    than the language AltaR Data used in this paper. They make it possible to or less
    carry out models equivalent to previously presented. However, AltaR mode automaton
    structures the definition of the failure in two parts: one dedicated to expressing
    the logic of the operating mode, and the other the logic of dysfunction suitable
    for a given mode. This is far simpler than a single automaton which mixes the
    two parts without distinction, as in formal languages.


    On the other hand, the models written in the richest languages can use functions
    depending on clocks or nonlinear functions in their definition of the dynamics
    of the system. These complex primitives reduce the performances of the current
    tools considerably and some of them cannot be analyzed at all. Experiments were
    carried'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'on in the MISSA project ([MIS 11, PAP 11]) for pushing the current limits further
    and for determining the range of developed tools better.


    # 3.5.3. Languages for physical systems


    Note that the group of approaches previously cited makes it possible to express
    functional dependencies (between inputs and outputs of a component and between
    components) or cause-and-effect relations oriented between the system states.
    However, the traditional equations of physics are not necessarily oriented or
    other languages to try similar approaches.


    Modelica [MOD 11] and AltaRica [ARN 00] (not reduced to its DataFlow fragment)
    to this language category. This expressive power has a counterpart. For AltaRica,
    calculations remain decidable in all the cases, but the performances attained
    from the first generations of tools were significantly degraded. In Modelica,
    it is not generally possible to automate the search of all the failure combinations
    or all the sequences of limited size leading to a failure condition.


    # 3.5.4. Injecting faults in nominal models


    Lastly, a certain number of works are trying to develop tools to extend specifications
    of the nominal behavior and to carry out the safety analyses starting from the
    extended models. The aim is not only to factorize the efforts of modeling, but
    also to guarantee consistency In practice, the kind of injected faults is limited
    (it is hard to express a deviation of a component output which is a function of
    some component inputs) and two main cases of performances are encountered.


    In the first case, the specification of the nominal behavior is very detailed
    (for example, cases of Simulink or SCADE models used to describe control laws).
    Failure modes are injected inside this initial nominal behaviour i.e. alternative
    computations of some output values are added. This inserted code is activated
    when the failure is present. More often, these models are too expressive and,
    as indicated previously, the current tools do not make it possible to carry out
    a system analysis in its entirety [AKE 06, HEI 05].


    The initial model must be simplified and when it is manual, this process is neither
    more economic nor safer making models dedicated to safety analysis.


    In the second case, the initial model has limited expressivity. Let us consider,
    for example, an AADL model [FEI 06] describing the static architecture of a system.'
