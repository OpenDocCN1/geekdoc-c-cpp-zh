    # 3.3.2. Tools of analysis


    Several tools can be used to check whether the AltaRica model of a system meets
    the expected safety requirements.


    The first group of tools generates the minimal combinations of failures that lead
    to a failure condition. The size of these combinations is analyzed to determine
    if the qualitative requirements are satisfied. The combinations can also be provided
    to tools carrying out probabilistic calculations to determine if the quantitative
    requirements are satisfied.


    There are several means of generating the minimal combinations. First, fault tree
    generation [RAU 03] allows, for certain AltaRica models, automatic production
    of a fault-tree. This tree represents a Boolean formula whose variables are the
    events of the AltaRica model. The AltaRica describes the paths that lead the system
    from the initial state to a state that satisfies the failure condition. The minimal
    cuts are calculated from the fault-trees using a tool such as Aralia. Another
