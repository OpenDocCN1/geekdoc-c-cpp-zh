    # 7.4.3. First refinement: MetroSystem_M1


    MetroSystem_M1 refines, MetroSystem_M0, incorporating the communication layer\and
    an emergency button for each train. The communication works as follows: a

    message is sent from the tracks, stored in a buffer, and read in the recipient
    train. The

    properties to be preserved for this refinement are as follows:


    +   1. Messages are exchanged between trains and tracks. If a train intends to
    move to

    ocupied section, the track sends a message neglecting access to that section and

    train should break.

    2. As part of the safety requirements, all trains have an emergency button.

    3. While the emergency button is enabled, the train continues braking and

    speed up.


    Now, the system proceeds as follows: trains that enter and leave sections must

    take into account messages sent by the tracks. Therefore, events corresponding
    to

    Enter and leaving the section need to be strengthened to preserve this property.
    The

    requirement concerning the space required for the train to halt is a simplification
    of

    are real system and could require adjustments to preserve the real behavior (for

    instance the occupied sections of a train and the sections indirectly occupied
    by the same train that

    correspond to the sections required for the train to halt). Nevertheless, in real
    systems,

    trains can have a built-in way to detect the required space to break. For instance,
    in

    Communication-Based Train Control (BTC: TSD 12, FAL 09) systems, this is called

    the stopping downward.


    The messages are represented by variables tmsgs that store the messages (buffer)

    from the tracks and permits which refine the message in the train, representing

    property 1. At this level, the messages are Boolean values assessing whether a

    train can move to the following section (if the section is free): TRUE the

    train can move; FALSE if the section is occupied and the train broke. The reception
    of messages is

    modeled in event receiveFromTrainMsg where the message is stored in permit before

    tmsgs is reset. The guards of event break are strengthened to allow a train to
    break

    when permit(t) = FALSE or when the emergency button is activated (guard grd3 in

    Figure 7.14b). Property 2 is expressed by adding variable emergency_button. The

    activation/deactivation of the emergency button occurs in the new event

    toggleToggleButton. Property 3 is expressed by guard grd3 in the event stop

    Braking: a train can only stop braking if the emergency button is not enabled.'
