    Figure 2.17. Defining the test bench and mapping the test operations


    # 2.3.4. Configuration of test strategies


    Choosing a strategy is very important for properly conducting validation campaigns.
    In fact, test optimization depends on the test case optimizations to run according
    to the maturity of the system being tested. Indeed, the nominal test cases have
    almost no effect on a mature system, and conversely in an immature system, the
    test usages will highlight too many bugs and will explode the analysis of results.
    The objective is to find the system''s bugs at a useful moment and in a useful
    order.


    The strategy described within the box in Figure 2.18 is that often implemented.


    The strategy presented in Figure 2.17 lists the nominal functions of the system
    according to several operational processes, and makes trade tests based on the
    complexity or criticality of updates until optimal coverage tests. Then, when
    everything is covered at least once in a context, it is interesting to generate
    test cases whose objective is to cover the system usage and validate its reliability.


    These test strategies are configurable and can evolve with time via algorithms.
    They are defined by:


    +   - choosing an algorithm;

    - selecting a profile;

    - selecting a part or the totality of the usage model that is to be taken into
    account.'
  merge: -1
  img_proc: true
