- pgno: 9
  md: '# Introduction


    # Context


    Although formal analysis programming techniques (see works by Hoare [HOA 69] and
    Dijkstra [DI 75]) may be quite old, the introduction of formal methods dates from
    the 1980s. These techniques enable us to analyze behavior of a software application,
    described in a programming language. Program correction (good behavior, program
    stop, etc.) is thus demonstrated through a program proof based on the weakest
    precondition allocation [DI 76].


    It took until the end of the 1990s before formal methods (Z [SPI 89], VDM JON
    [90]), or the B method [ABR 96, ARA 97] could be implemented in industrial applications,
    or were usable in an industrial setting.


    One of the stumbling blocks was implementing them in the framework of an industrial
    application (size of application, cost constraints, or delays, etc.). This implementation
    is only possible using “sufficiently” mature and high-performance tools.


    It should be noted that in the context of safety-critical applications, at least
    two formal methods have a currently-used and recognized environmental design,
    which covers one part of the specification production process according to the
    code, all while integrating one or more verification processes; namely the B method
    [ABR 96] and the LUSTRE language [HAL 91, ARA 97] and its graphic version, named
    SCADE [DOR 08].


    Introduction written by Jean-Louis BOULANGER

    1. The SCADE development environment is marketed by the company Esterel Technologies;
    to find out more, visit www.esterel-technologies.com.'
