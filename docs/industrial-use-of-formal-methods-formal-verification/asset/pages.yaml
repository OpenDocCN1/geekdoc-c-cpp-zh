- pgno: 288
  md: '# Conclusion


    Taking the techniques and formal methods that have an impact on the implemented
    process into account, it is necessary to build a new standard that conforms to
    the quality standards being enforced. This standard does not take into account
    that the model can replace some documents. It is necessary to explain how the
    process based on a model gives you the same level of confidence on the safety
    of the software. The confidence is based on the global process and using a model
    does not provide the same level of verification, in fact some very important verifications
    are removed and not replaced by equivalent techniques. Indeed, if the tool is
    no longer maintained and formalism is proprietary, it is difficult to update the
    application with the model.


    Another difficulty of the model-centered approach is bringing the software application''s
    level of safety to that of the tools implemented.


    Though it is difficult to show that a compiler is SSL4, it is even more difficult
    to show that a prover is SSL4. Within the context of compilers, it is possible
    to set up strategies by redundancy and diversity. For specific tools such as provers,
    model-checking tools, and/or tools for abstract interpretation, it is difficult
    to have two tools of similar effectiveness within the same field34. Therefore,
    it is necessary to set up tool qualification files.


    The different standards (DO 178, ISO 26262, CEI/IEC 61508, CENELEC EN 50128) show
    the concept of a qualification file. The qualification of a tool depends on its
    impact on the final product.


    Concerning formal techniques and methods, the question of tool quality is of primary
    importance because the complexity of the implemented technologies (prover, model-checking,
    etc.), the confidentiality aspect (licensed algorithm, etc.), the innovation aspect
    (new technology, few users, etc.), and the maturity aspect (product resulting
    from research, carried out under a “free” license, etc.) do not bring confidence
    on the safety.


    One of the difficulties in implementing these techniques lies in the absence of
    recognition of these techniques within the current standards. In effect, certain
    standards (see Table 8.13, extract from CENELEC EN 50128 [CEN 01] for example)
    advocate implementation of formal methods but they do not mention the notion of
    abstract interpretation (or derived methods).


    34 Recall that for several of the tools currently in use, the algorithms are not
    public and also under copyright.'
