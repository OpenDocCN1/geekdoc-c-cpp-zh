    of the

    analysis once and for all.


    This constraint has beneficial effects: it contributes to obtaining more

    hogeneous, consistent, and probably more complete models in the case of

    systems including strictly independent components. On the other hand, the

    models of a system are dedicated to a given level of analysis. Changing the level
    of

    analysis generally requires changing the model.


    This, then, poses the problem of coherence between more or less refined models.

    This studied, for example in [KEH 05, BER 09]. [KEH 05] proposes structural

