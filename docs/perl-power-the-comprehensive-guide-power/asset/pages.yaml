  md: 'In the lines that comment #1 in Listing07_10 designates, you create an array
    of customers called @Customers. (This is the same customer group from Listing07_09.)
    You use the qw() function in this case for convenience. In addition to setting
    up the customer array, you also create a formatting line and use the scalar()
    function to obtain the number of elements in the @Customers array and assign this
    to a scalar, $CustomerCount.


    Next you turn to creating a for statement to attend to the primary activities
    of the program. In the lines accompanying comment #2, to control the for loop,
    you employ the value stored in $CustomerCount. This approach to controlling the
    loop is a crude measure. You could, in fact, do without it.


    Through the operations that the code affiliated with comment #3 performs, you
    use the push() function to push customers into three arrays you create to accommodate
    the three customer representatives. The shift() function extracts the names of
    customers from the front of the @Customer array. In this way, the customers who
    arrived first are given attention first. The push() function inserts their names
    into the arrays that represent the customer service representatives.


    Each customer service array serves as a queue. Each name is pushed into one of
    the customer service arrays from the back or end of the queue. It then migrates
    up the queue as other names are push()ed into the queue.


    In this instance, rather than using the shift() function to remove the name of
    the customer from the queue, you go only so far as to display the name of the
    customer in the order in which it entered the queue. To accomplish this, as you
    can see at comment #4, you employ the scalar form of each of the queues you have
    set up for the customer service representatives. You iterate through the scalar
    using a for loop controlled by the number of customers stored in the queues you
    have set up for the customer representatives. By using the scalar() function you
    are able to continuously monitor the number of customer names each queue stores.


    The actions associated with comment #5 allow you to use the sleep() function to
    pause the display every second before refreshing it. You also make a call to the
    system() function, which allows you to issue commands to the operating system.
