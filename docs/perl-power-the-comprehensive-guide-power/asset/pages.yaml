    \ many chemists can relate, in 1742 Anders Celsius figured out how to convert\
    \ degrees Celsius into degrees Fahrenheit. The formula that he presented reads\
    \ as follows:\n\n```\nFahrenheit = 9/5(Celsius) + 32\n```\n\nYou can fold this\
    \ formula into a program to add a column to an output table that shows the Fahrenheit\
    \ values for the melting points of selective elements (see Figure 8.7). In the\
    \ process, you can check your program for sanity by using the Celsius temperature\
    \ at which water boils (100). On the Fahrenheit scale, water boils at 212 degrees.\n\
    \n```\n#Listing08_06\n# 1 Formatting elements for the table\n$NL = \"\\n \";\n\
