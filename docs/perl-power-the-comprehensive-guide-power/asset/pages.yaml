    \n# Inserting Elements into the Front of an Array\n\nThe `unshift()` function\
    \ performs an action that is the reverse of the `shift()` function. Rather than\
    \ removing the first element in an array, the `unshift()` function inserts an\
    \ element into the first or zero position of an array. Consider Figure 7.7. When\
    \ the `unshift()` function inserts a new element into an array, the indexes of\
    \ the existing elements increase in value by one. They are “unshifted” from the\
    \ front or head of the array toward its tail or end.\n\n**Figure 7.7**\nThe `unshift()`\
    \ function moves all the elements further from the head of the array when it adds\
    \ a new element.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_182_1.png)\n\nListing07_06\
