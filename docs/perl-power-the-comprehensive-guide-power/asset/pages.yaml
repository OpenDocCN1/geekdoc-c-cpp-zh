    # Conclusion


    This chapter has provided the first two parts of a three-part treatment of control
    structures. In Chapter 11, the discussion continues with repetition statements.
    In this chapter, you have concentrated on statements that involve sequence and
    selection in the flow of programs. At the start of the chapter, you reviewed the
    notion that a program consists of a set of statements. Unless you introduce controls
    that force it to do otherwise, when a program executes, it processes one statement
    after another. Such basic program activity is known as the sequential flow of
    a program.


    You can introduce involved procedures into the sequential flow of a program if
    you make use of such features as functional subroutines, parentheses, array storage,
    and goto operations. The extent to which you can alter a sequential flow becomes
    evident when you make heavy use of the goto operator. Given the use of labels
    and frequent jumps from one place in a program to another, a program can become
    nearly impossible to understand. This situation has been responsible for a widespread
    trend among programmers to avoid using goto operators.


    When you introduce selection statements, you again have the option of performing
    a wide variety of activities not possible with sequential statements alone. Among
    the selection statements available to you are the single and exclusive selection
    statements (if and if...else). You can also use a negative form of selection,
    the unless statement. For more involved operations, you have the cascading or
    multiple case structure. This is the if...elsif...else statement.


    Control expressions involve using relational and Boolean operators. You can combine
    such operators into compound statements. Such statements can be used in all forms
    of selection, and as Chapter 11 shows, extend to repetition structures as well.


