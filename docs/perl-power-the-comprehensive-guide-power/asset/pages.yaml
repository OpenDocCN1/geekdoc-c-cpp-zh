  md: "# The read() Function\n\nThe read() function works with either three or four\
    \ parameters. The first parameter identifies a file handle. The second parameter\
    \ establishes a string identifier you can use to extract characters from a file\
    \ during the read operation (the target string). The third parameter designates\
    \ the number of characters you want to extract. The fourth parameter relates to\
    \ the identifier you want to store characters in (the target string). It indicates\
    \ the index position in the target string that you want to use as the beginning\
    \ point as you transfer characters to it.\n\nTo use the read() function, you first\
    \ call the seek() function to designate the starting point. The read() function\
    \ reads from the starting point for the number of characters you designate. Listing14_07\
    \ experiments with the read() function using the starting positions and lengths\
    \ of the dinosaurs named in the SourceData.txt file. It moves through the file\
    \ a word at a time, accessing the words and then placing them in a string in alphabetical\
    \ order.\n\n```\n#Listing14_07\n\n#1 Open source file\n$NL = \"\\n \";\nopen(FILE,\
    \ \"<SourceData.txt\")\n                         or die (\"File could not be opened:\
    \ $!\");\n\n#2 Set the first value and advance through the file\n$WordBeginning\
    \ = 0;\n$Line = <FILE>;\ndo{\n#3 Obtain word beginnings and ends\n    $FileSoFar\
    \ = tell(FILE);\n    #Assign values using an anonymous array reference\n    #use\
    \ a hash to capture beginning and end positions\n    $WordPositions{$Line} = [$WordBeginning,\
    \ $FileSoFar];\n    $WordBeginning = $FileSoFar;\n}while($Line = <FILE>);\n\n\
    #4 Assign keys to an array and sort\n@Dinosaurs = keys(%WordPositions);\n@Dinosaurs\
    \ = sort(@Dinosaurs);\n\n$Str = 0;\nforeach $Name(@Dinosaurs){\n```"
