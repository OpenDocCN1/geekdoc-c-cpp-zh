- pgno: 321
  md: '# # Identifying Functional Subroutines


    To create a functional subroutine (from here on referred to as a function) in
    Perl, you employ a combination of program syntax and convention. The syntax and
    conventions apply to both the specific development of functions and the broader
    layout of programs in which you include functions. Table 12.1 provides a summary.


    # ## Table 12.1 Syntax and Conventions for Functions


    | Item | Discussion |

    |---|---|

    | sub | This is a keyword that allows you to designate the word that follows it
    as the name of a function. |

    | Name | Functions have names. The name of a function can be almost any expression
    you choose. You cannot use words reserved for other purposes in Perl (`continue`,
    `for`, `while`, and so on). The function name should not be a number or consist
    of operators or controls. It should begin with an alphabetical character. Function
    names can include underscores and dashes, among other characters (`A_Za_z0`),
    but they must always begin with a character and cannot include hyphens. |

    | Block | In this context, block refers to a set of curly braces (`{}`). You must
    enclose the statements that compose the body of the function in curly braces.
    The curly braces follow the name of the function. |

    | return | You can use the `return` keyword with functions. The `return` keyword
    closes out the function so that you can predict the precise value the function
    makes available in the flow of the program. The return value allows you to specify
    the value that the function passes back to the calling code. |

    | Arguments | When you create a function, you can define a list of arguments you
    can pass to the function. You can pass these arguments to the function inside
    a set of parentheses that follow the name of the function. When you define a function,
    you can make it clear what arguments the function receives by following a coding
    standard that identifies the arguments. |

    | Program organization | You can organize a program on a structural, package,
    or modular basis. On a modular basis, you place functions in separate files or
    groups of files known as modules. If you use a package approach, you divide a
    single file into separate parts using package labels. If you use a structural
    approach, you try to place all the code that constitutes a program into functions
    and then, to set up the program, call the functions. |'
  merge: -1
