  md: "# # Using the keys() Function\n\nThe `keys()` function allows you to access\
    \ all the keys in a hash. Its sole argument consists of the implicit form of the\
    \ hash. Its two principal uses involve converting the keys of a hash into an array.\
    \ You can then iterate through the array and fetch the values of the array using\
    \ the lookup form of the hash. You can also make use of the `keys()` function\
    \ for hash slicing (see the section titled “Slicing Hashes,” in Chapter 9). Listing08_04\
    \ illustrates the basic use of the `keys()` function to retrieve an array of hash\
    \ keys.\n\n# ## Listing08_04\n\n```\n```perl\n# 1 Formatting elements for the\
    \ table\n$NL = \"\\n \";\n$DC = \"=\";\t\t#character for top and bottom lines\
    \ of table\n$TW = 55;\t\t#Table width\n$DL = sprintf( \"%55s\", $NL . $DC x $TW);\
    \ #top and bottom lines\n$COLAHEAD = \"Element\";\n$COLBHEAD = \"Atomic Weight\"\
    ;\n#2 Set up the data using an implicit hash\n%ElementsAtomicWeights = (Oxygen,\
    \ 15.9994, Fluorine, 18.9984032,\n\tNeon, 20.1797, Sodium, 22.989770,\n\tMagnesium,\
    \ 24.3050, Aluminum, 26.981538,\n\tSilicon, 28.0855, Phosphorus, 30.973761,\n\
    ```\n```\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_208_0.png)"
