    can be used.

    For example, you can restrict writing to a file, making it so the file you access
    cannot be written

    to. You can also overwrite the data in a file. To define such options, you prefix
    a read-write

    specifier to the name of the file when you use it as the first argument to the
    open() function.

    Table 14.2 provides examples of how to set the permissions relating to files.
    In each case, FH

    designates a file handle, and filename stands for the name of a file.


    # ## Table 14.2 Arguments for the open() Function


    | Use of open | Discussion |

    |---|---|

    | open(FH, ">filename") | Creates a file and writes to it. This overwrites an
    existing file. |

    | open(FH, "<filename") | Opens an existing file for reading only. |

    | open(FH, "filename") | Just the name of the file alone. Opens an existing file
    for reading

    only. |

    | open(FH, ">>filename") | Adds data to the end of an existing file. If the file
    does not exist,

    it creates a file. |

    | open(FH, "+<filename") | Updates a file. Opens the file for reading and writing.
    Appends

    data to the end of the file. |

    | open(FH, "+>filename") | Creates a file for reading or writing. If the file
    already exists, it

    overwrites it. |

    | open(FH, "+>>filename") | Appends data to the end of the file. If the file does
    not exist, it

    creates it. |


