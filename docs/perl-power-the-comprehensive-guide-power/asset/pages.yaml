  md: "# Accessing Fixed-Length Records\n\nTo access data in fixed-length records,\
    \ you again use the `pack()` function to determine the length of the records you\
    \ want to read. You then use the `seek()` function to navigate the file in increments\
    \ equal to the length of a record. To know where to find a given record, you determine\
    \ the number of the record in the file and then multiply the record length by\
    \ this number. You assign the product to the `seek()` function, and using the\
    \ length of the record as an argument to the `read()` function, you retrieve the\
    \ record for viewing. Listing14_09 explores how to retrieve specific fixed-length\
    \ records. It introduces no new functions but instead affords you the opportunity\
    \ to experiment with common uses of functions already introduced.\n\n```\n```perl\n\
    #Listing14_09\n#Read fixed length records from a file\n#1 Verify the record length\n\
    $NL = \"\\n\";\n$DC = sprintf(\"%c\", 236);     #Special character\n$TW = 63;\
    \                       #Line width\n$DL = sprintf(\"%63s\", $NL . $DC x $TW);\
    \ #top and bottom lines\nopen(FILE, \"<SourceData.txt\") or die (\"File could\
    \ not be opened: $!\");\nprint($DL);\n\n$Record = \"A3 A20 A20 A20\";\n$RecordLength\
    \ = length(pack($Record));\nprint \"$NL Record length: $RecordLength\";\n\n#2\
    \ Open the data file--read only\nopen(FILE, \"RecordData.txt\") || die \"\\n Cannot\
    \ access file.\";\n\n#3 Set the file at the end (option 2)\n    seek(FILE, 0 ,\
    \ 2);\n# Obtain the length\n    $FileLength = tell(FILE);\n    print \"$NL The\
    \ length of the file is $FileLength\";\n    $NumOfRecords = int($FileLength/$RecordLength);\n\
    \    print \"$NL $NumOfRecords records are in the file.\";\n    print($DL);\n\
    \    print \"$NL>>Press <Enter>\";\n\n#4 Use seek and read to obtain records by\
    \ multiplying by length\n```\n```"
