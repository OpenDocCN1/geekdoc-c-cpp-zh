    # # Operations with Numbers


    When you perform operations on numbers in Perl, the operators you employ differ
    from the operators that apply to strings. For example, you employ `eq` to test
    for the equality of strings, but you employ double equal signs (`==`) to perform
    a similar operation with numbers. Generally, the numeric operators that Perl provides
    resemble those of other programming languages (such as C or C++). Table 5.1 provides
    a summary of operators that the Perl interpreter allows you to use.


    The operators for both strings and numbers are characterized by how they can be
    associated (associativity) and what precedence they have with relation to each
    other. Precedence has to do with the order in which the interpreter performs operations.
    The operators listed in Table 5.1 appear in a top-down scheme of precedence. At
    the top are the parentheses, which stand as what might be viewed as the super
    operators of operators, for they allow you to arbitrarily enforce the precedence
    of almost any operation you want to perform.


    As Figure 5.3 illustrates, associativity involves how the interpreter reads an
    expression. In some cases, it reads left to right. In other cases it reads right
    to left. In still other cases, associativity does not apply. Left-to-right associations
    characterize all the arithmetic operators. If you add the variables a and b (a
    + b), the interpreter reads b, reads the addition operator, and then reads a.
    On the other hand, with the assignment operator (=), the association is from right
    to left. When you assign the sum of a and b to an identifier named c (c = a +
    b), the interpreter attends first to the addition (a + b), then to the assignment
    operator (=), and then to the target identifier (c), which lies on the left side
    of the assignment operator.


