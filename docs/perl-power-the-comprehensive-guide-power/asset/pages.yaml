  md: "# # ASCII Characters\n\nASCII characters often do not have representations\
    \ on your keyboard. To deal with such characters, you can use hex values. If you\
    \ use hex values, you prefix an “x” and a backslash to the number to designate\
    \ it as a hex value. In the following example, you search for the word lack using\
    \ the hex values of its letters:\n\n```\n```\nprint \"lack (\\\\x6C\\\\x61\\\\\
    x63\\\\x6B) found\\\\n\"\nif (\"The cat is black\" =~ m/\\\\x6C\\\\x61\\\\x63\\\
    \\x6B/);\n```\n```\n\nHere is the output of the expression, which is Example 2\
    \ in Listing15_05:\n\n```\n```\nlack (\\\\x6C\\\\x61\\\\x63\\\\x6B) found\n```\n\
    ```\n\n# # The Caret (^)\n\nYou use a caret to indicate that no character precedes\
    \ the expression you are looking for. Since it often represents word boundaries,\
    \ the caret is often referred to as an _anchor_ or _word marker_. The following\
    \ lines illustrates that if the caret precedes the characters for which you are\
    \ searching and you are searching for a character does not start a word or expression,\
    \ the result is false.\n\n```\n```\n# Example 3 The Caret (^)\nif(\"Peace\" =~\
    \ m/^ace/)\n{\n   print \"ace found\\\\n\";\n}else{\n   print \"ace not found\
    \ \\\\n\";\n}\n```\n```\n\nBecause the caret establishes that you are beginning\
    \ a line, when you try to match the three characters preceded by others, the expression\
