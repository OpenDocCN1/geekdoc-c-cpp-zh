  md: '# # Figure 11.7 You halt the loop to solicit input from the user.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_288_0.png)


    The specific lines that accomplish the work of halting the loop and prompting
    you for input are as follows:


    ```

    $ControlChar = <STDIN>;

    chomp($ControlChar);

    system(cls);    #Call to the DOS system

    ```


    When the program encounters the handle (<STDIN>), it immediately halts its execution
    while it waits for input. To process the input, you assign it to a scalar ($ControlChar).
    At the same time, when you press the Enter key to transmit the input to the program,
    you append a newline character to the data you enter. To eliminate this extra
    character, you call the chomp() function.


    After removing the extra character from the input, you call the Perl system()
    function. The system() function allows you to interact with the operating system.
    The cls argument of the system() function is a DOS command that clears the screen.


    > > Using such a call in a command line application presents no problem; however,
    if you develop a Perl program for use in a browser, then calls of system() can
    create major problems. Among other things, because it calls directly to the operating
    system, it creates a “security violation.” Browsers are not supposed to interact
    directly with your operating system.


    Prior to halting the loop to provide input to the program, you make several calls
    to the print() and printf() functions to display the options available to the
    program user. These options appear in the bottom of the screenshot Figure 11.6
    displays. To print the options to the screen, you might easily use another block.
    You could also use the join() function to create'
