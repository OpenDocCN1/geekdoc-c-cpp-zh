  md: "# CHAPTER 12  Functions\n\nIn the lines associated with comment #6, you define\
    \ `printTable()`. In this case, you assign the argument array to a local array\
    \ only to make things a little clearer to anyone who might be reading the code.\
    \ You traverse the items in the array through a repetition statement that you\
    \ advance in increments of 2 using the counter. When you advance the counter in\
    \ increments of 2, you can access items two at a time. The first item corresponds\
    \ to the value of the counter. The second item is the item that corresponds to\
    \ the value of the counter plus 1. Retrieving items from the array in this way,\
    \ you can assign them simultaneously as two arguments to the `printf()` function.\
    \ In this fashion, you display media and percentages in ascending order, as Figure\
    \ 12.14 illustrates.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_348_0.png)\n\n\
    **Figure 12.14**  \nContextual uses of arrays and hashes allow you to organize\
    \ items for display.\n\n# Conclusion\n\nIn this chapter, you have explored the\
    \ use of functions. Functions provide a way to organize the statements that constitute\
    \ a program into manageable units. When you set up a Perl program, it is beneficial\
    \ to make use of some of the lessons of structural programming. Accordingly, you\
    \ designate a space in your program in which you place function definitions. You\
    \ make calls to these defined functions in another area of your program. The area\
    \ you set aside for calling functions provides the working area of your program.\
    \ Set up in this way, you can pursue development activities in the working area\
    \ while reserving the defined area for code you consider stable.\n\nDefinitions\
    \ of functions range from those that employ no return values and accept no arguments\
    \ to those that employ many arguments and return values and even incorporate arrays\
    \ and hashes. When you pass values to a function, you pass the values through\
    \ the Perl argument array. The argument array translates all the arguments you\
    \ pass to a function into a single array. To access the values you have provided\
    \ as arguments to a function, you must retrieve them through array operations\
    \ you implement within the function definition block."
  merge: -1
