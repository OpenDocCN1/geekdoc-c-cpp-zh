- pgno: 432
  md: "# # The Question Mark (?)\n\n\nYou use the question mark to indicate zero or\
    \ one previous letter. These characters can be optional. In Example 10 of Listing15_05,\
    \ the question mark allows c to be optional. Given the optional c, the expression\
    \ renders true.\n\n\n```\n@WordList = qw(snide ride hide confide inside);\nforeach\
    \ $Word (@WordList){\n    print \"\\nMatch A : $Word\" if ($Word=~ m/c?.*ide/);\n\
    \    print \"\\nMatch B: $Word\" if ($Word=~ m/c.*ide/);\n}\n\n```\n\nOption A\
    \ allows all the words on the list because it makes the c optional. Option B allows\
    \ only one word, confide, because it lacks the question mark to make the c optional.\
    \ Here is the output of Example 10 in Listing15_05:\n\n\n```\nMatch A : snide\n\
    Match A : ride\nMatch A : hide\nMatch A : confide\nMatch B: confide\nMatch A :\
    \ inside\n\n```\n\n# # Ways of Extending Expressions\n\n\nA number of operations\
    \ you perform with regular expressions involve using brackets and other elements\
    \ to create complex queries. Many of these operations involve the elements named\
    \ in Table 15.1, but a few additional items come into play as you go. The following\
    \ sections explore a number of different directions your regular expressions can\
    \ take. Listing15_06 provides the program samples.\n\n\n# # Using Character Classes—Square\
    \ Brackets []\n\n\nYou use character classes to indicate a range of characters\
    \ or digits you want to match. You can employ several approaches to creating a\
    \ class of characters. One is to use a group of characters between square brackets\
    \ []. The following sequence of matches shows different ways of setting ranges\
    \ for searches.\n\n\n```\nMatch 4: toot\nMatch 4: foot\n\n```"
