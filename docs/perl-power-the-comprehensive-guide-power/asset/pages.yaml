  md: "# CHAPTER 9  Extending Hash Applications\n\n```\n```text\n#Set up a key array\
    \ using the melting points and sort them\n@MeltingPoints = keys(%ElementsCelMeltingPts);\n\
    @MeltingPoints = sort{$a <=> $b}(@MeltingPoints); #Sort the elements\n# @MeltingPoints\
    \ = reverse (@MeltingPoints); #ARRAY Reversal for ascending\n\n#5 Use a while\
    \ loop and the hash lookup operation\n#to retrieve the names of elements\nwhile\
    \ ($CelsiusMP =pop(@MeltingPoints)){\n        #Look up name of the element\n \
    \       $EName = $ElementsCelMeltingPts{$CelsiusMP};\n        printf(\"\\n %-17s\
    \ %15.2f %15.2f\", $EName ,\n                #Display Celsius\n              \
    \  $CelsiusMP,\n                #Display Fahrenheit\n                (9/5) * $CelsiusMP\
    \ + 32);\n}#end while\n```\n```\n\nAt comment #1, you create scalar identifiers\
    \ to provide formatting for the table. The lines comment #2 identifies create\
    \ a hash containing the names of elements and their melting points. (Water is\
    \ included as a test value.) The lines accompanying comment #3 print the column\
    \ headings for the table.\n\nAt comment #4 you use the `reverse()` function to\
    \ reverse the key value pairs in the `%ElementsCelMeltingPts` hash. To accomplish\
    \ this, as mentioned previously, you assign the return value of the `reverse()`\
    \ function back to the name of the hash.\n\nGiven the reversal of the keys and\
    \ values, the keys of the hash now consist of the temperatures at which the elements\
    \ melt. You use the `keys()` function to assign these values to an array, `@MeltingPoints`.\n\
    \nThe lines at comment #4 .5 apply the `sort()` function to the array of melting\
    \ temperature. Notice the form of the `sort()` function:\n\n```\n```text\nsort\
    \ {$a < = > $b} (@MeltingPoints)\n```\n```\n\nThis form of the `sort()` function\
    \ applies to numbers, and you must use it in this context or the temperatures\
    \ are not sorted correctly. The `sort{$a < = > $b}` function sorts the temperatures\
    \ so that they are in ascending order. The `pop()` function, used in the `while`\
    \ loop, reverses this order. If you want to see ascending order, uncomment the\
    \ following line:\n\n```\n```text\n# @MeltingPoints = reverse(@MeltingPoints);\
    \ #ARRAY Reversal for ascending\n```\n```"
