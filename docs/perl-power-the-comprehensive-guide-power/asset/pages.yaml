- pgno: 351
  md: '# # 13 References


    This chapter explores references, which among other activities allow you to pass
    complex arguments to functions and to create data structures that involve storing
    arrays in arrays or arrays in hashes. References work in direct and indirect ways.
    From a direct approach, you create a reference and assign a value directly to
    it. From an indirect approach, you assign a value to an identifier and then assign
    the identifier to the reference. In addition to constructing references for scalar,
    array, and hash values, you can also create references to functions. In addition
    to function references, you can make use of typeglobs, which are a more basic
    form of reference. One good use of typeglobs involves creating constant values.
    Here are a few of the topics this chapter covers:


    +   - How to create references

    +   - Dereferencing references

    +   - Storing arrays in hashes

    +   - Storing hashes in arrays

    +   - Creating and using function references

    +   - Typeglobs and the `ref()` function


    # ## References in General


    In previous chapters, you saw that when you create a function with multiple parameters,
    the parameters are merged into the argument array. When you define a function,
    you must unpack the argument array if you want to retrieve individual elements
    from it. If you pass a series of scalar values to an array, you can easily retrieve
    the values by employing the indexes of the argument array. When you pass several
    different data types to a function, unpacking the argument array becomes more
    problematic. Consider Listing13_01.'
  merge: -1
  img_proc: true
- pgno: 352
  md: "# # CHAPTER 13 References\n\n```\n#Listing13_01\n\n#1 Define different identifiers\
    \ of different types\n$ExtraVegetable = \"Cabbage\";\n@Vegetables = (\"Green beans\"\
    , \"Broccoli\", \"Brussels sprouts\");\n@Fruits = (\"Apple\", \"Apricot\", \"\
    Banana\", \"Cantaloupe\", \"Grapefruit\");\n%Cereals = (\"Bran Buds\" , 110, \"\
    Raisin Bran\" , 150, \"Grapenuts\" , 100);\n\n#2 Call a function to submit the\
    \ identifiers\nprintItems(@Vegetables, @Fruits, %Cereals, $ExtraVegetable);\n\n\
    #==============================================================\n#3 ----- Definition\
