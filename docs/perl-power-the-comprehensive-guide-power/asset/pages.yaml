  md: 'with Potassium. The same form of displacement characterized the two Metalloid
    keys. In the end, you find only the key associated with Silicon.


    | Category | Element |

    |---|---|

    | Noble Gasses | Helium |

    | Alkali Metals | Lithium |

    | Alkali Metals | Sodium |

    | Alkali Metals | Potassium |

