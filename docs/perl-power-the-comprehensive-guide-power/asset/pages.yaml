    # Using a Sequence of Items


    The list function when combined with a foreach repetition statement allows you
    to traverse

    a sequence of strings and effect any number of regex operations. For example,
    in Example 5 of

    Listing15_05, the match operation compares each item in a list. You use the foreach
    statement

    to traverse the list:


    ```

    foreach ( "not here", "not there", "not yet", "but at last found"){

    print "Not yet.\n";

    print "last found\n" if m/last/;

    }

    ```


    The matching expression evaluates each term in the list to determine whether it
    corresponds

    to last. The terms it evaluates are enclosed in quotation marks. For this reason,
    you see four

    messages as the output of Example 5 in Listing15_05:

    Not yet.

    Not yet.

    Not yet.

    Not yet.


    # Use of the Braces (Multiplier) and the Period


    You can employ curly braces to indicate a range, such as a number of characters
    to be skipped.

    A period indicates any character except the newline. In Example 6 of Listing15_05,
    you use the

    curly braces to indicate that two letters lie between the letters m and t. The
    period indicates that

    any characters are acceptable:

    @WordList = qw(mast mart mort moot must muck mist mope);

    print "\nTest for words.\n";

    foreach $Word(@WordList){

    print "\nMatch 1: $Word" if($Word =~ m/m.{2}t/);

    }


    Given that the expression allows that the word can start with m, consist of any
    two characters,

    and then end in t, you see every word in the list except muck and mope. Here is
    the output of

    Example 6 in Listing15_05:'
