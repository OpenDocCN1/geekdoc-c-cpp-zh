    +   * Spending hours on the Internet searching for information on an obscure module
    because

    +   someone said that is has already been done and you would be stupid even to
    think about

    +   doing it again.


    +   * Making any given function (method) call in at least six different ways,
    so that if you consider

    +   the functions even a smattering of modules provide and multiply them by the
    number of

    +   ways you can use them, you suddenly have to start using exponents when you
    talk about

    +   the number of things you might do in a given day of programming.


    +   * Encountering situations in which you learn what it is to program with few
    words and even

    +   go so far as to participate in competitions that challenge you to write programs
    that contain

    +   no words at all.


    +   * Become absorbed by the notion that Perl is a language designed only to write
    CGI programs.


    +   * Decide that you should use only modules to do anything, especially when
    it comes to

    +   creating webpages.


    +   * Feel that if you cannot do it with the Apache webserver, then it should
    not be done at all,

    +   especially with Perl.


    +   * Regard database connectivity as essential to programming with Perl, especially
    with respect

    +   to MySQL.


    The preceding list provides a set of topics on which good books have been written.
    The list could

    be considerably lengthened. As it stands, however, if you are trying to learn
    a programming

    language rather than a category of applied programming, the foregoing list proves
    as much a

    bane as boon. The problem lies in the bewildering complexity of Perl as used by
    its maestros,

    in contrast with its essential grace and simplicity as a resource for beginning
    programmers.


    The simplicity and grace of Perl allow you to start writing interesting programs
    after only a

    few hours of exposure. If you concentrate on the language itself and put aside
    the thousands of

    exotic uses people have made of it (at least for a while), you can learn how to
    work with it in'
