  md: '# 15 Regular Expressions


    In this chapter, you review a number of points relating to regular expressions,
    which are an effective tool you can use to supplement your Perl programs. When
    you work with regular expressions, your activities fall into two main categories.
    One involves matching expressions. A basic matching function and the binding operator
    allow you to test strings for the existence of words and character patterns. The
    second activity falls under the heading of substitution. Again, as with matching,
    a substitution function allows you to search strings for given words or characters.
    In addition to searching, however, you can also replace characters. Along with
    matching and substitution, a third area of activity often becomes a part of the
    work you perform with regular expressions. This involves translation. Translation
    proves much more limited in scope than matching or substitution, but you can still
    find handy uses for it. Among the topics this chapter addresses are the following:


    +   - How regular expressions work

    +   - Using the binding operator

    +   - Expressions for matching

    +   - Expressions for substitution

    +   - Expressions for translation

    +   - Using special characters and other elements


    # General Notions


    Regular expressions allow you to find, extract, and modify text that matches predefined
    patterns. As developed in Perl, programmers often call regular expressions regexes.
    Regexes often depend on the use of the binding operator, which consists of an
    equal sign preceded by a tilde (~=). You can also use a negative form of the binding
    operator, which consists of an exclamation mark or negation operator preceding
    a tilde (!~).'
