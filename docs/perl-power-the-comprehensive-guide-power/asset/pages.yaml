    # The until Statement


    Like the `while` repetition statement, the `until` repetition statement allows
    you to test a condition prior to allowing the flow of your program to enter the
    block associated with the condition. Unlike the `while` statement, the `until`
    statement tests for the falsehood of a condition. Listing11_06 illustrates how
    you can use the `until` statement to print a table of data that identifies gems
    according to general classifications.


    ```

