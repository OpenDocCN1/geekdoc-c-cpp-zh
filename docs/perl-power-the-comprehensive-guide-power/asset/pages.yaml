    # # Converting a String into a Hash


    You can employ the split() function to convert a string into a hash. This procedure
    proves useful when you process the results of Internet transmissions, which arrive
    as strings. The split() function takes two arguments. The first argument names
    the expression to use to separate the items in the string. The second argument
    consists of the string you want to operate on. Listing09_05 provides an example
    of how to translate a string into a hash. In this instance, the string consists
    of key-value pairs joined by colons. Commas separate the pairs.


    #Listing09_05

    #1 Set up the data using an implicit hash

    #It is important not to introduce extra line returns and the like ...

    $ElementsString = "Aluminum:659, Carbon:3600, Chromium:1615, Copper:1083, ".

    "Gold:1946, Hydrogen:-259, Iron:1530, Lead:327, " .

