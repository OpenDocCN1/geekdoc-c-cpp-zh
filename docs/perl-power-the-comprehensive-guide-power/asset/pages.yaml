- pgno: 353
  md: "When you use a hash, an array, and a scalar as arguments to the `printItems()`\
    \ function in Listing13_01, they are all merged into one large array. The items\
    \ in the hash (`%Cereals`) lose their key-value identity. The items in the arrays\
    \ (`@Vegetables`, `@Fruits`) merge into one massive array. The lone scalar (`$ExtraVegetable`)\
    \ is likewise tossed in, and when you see the list Figure 13.1 shows, you have\
    \ lost track of the initial groupings the hash, arrays, and scalar provided. How\
    \ do you retrieve these items in the same form that you submitted them? You use\
    \ references to make this possible.\n\nWhat you do when you pass arguments to\
    \ functions extends to building complex bodies of data that involve putting hashes\
    \ inside arrays or arrays inside hashes. In each instance, you need a convenient\
    \ way to maintain the identity of your data. At the same time, you can use references\
    \ to make it so that you can store and retrieve data without having to use explicit\
    \ names for it. The same power that allows you to maintain the identity of data\
    \ as you pass it to functions allows you to maintain the identity of data when\
    \ you store it in complex forms in arrays or hashes. How references allow you\
    \ to accomplish this work becomes the topic of later topics in this chapter (see,\
    \ for example, “Anonymous Hash References as Data Containers”).\n\nThe term “reference”\
    \ applies to the process of referring one thing to another. When applied to data,\
    \ a reference identifies a place in the memory of your computer. When you work\
    \ with Perl, the reference identifies a place in memory that stores the values\
    \ you create for your programs. This place in memory is characterized by a table.\
    \ The table can relate your values to all the data types that Perl supports and\
    \ allows you to perform operations such as accessing an array element as a scalar\
    \ or working back and forth between numbers and strings. Figure 13.2 provides\
    \ a crude representation of a reference table.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_353_0.png)\n\
    \n**Figure 13.2**  \nA reference allows you to access values more immediately\
    \ than is otherwise possible."
  merge: -1
  img_proc: true
- pgno: 354
  md: '# # Creating References


    To create a reference, you use a special operator called the reference operator.
    The reference

    operator consists of a backslash (\). When you prefix it to an identifier, it
    issues a directive for

    the Perl interpreter that the identifier should be recognized as a reference.
    When you use the

    reference operator, you can do so in two ways. One way involves assigning a reference
    to another

    identifier. This involves what is known as _indirect_ or _symbolic_ reference
    and provides an ex-

    cellent way to work with references if you are encountering them for the first
    time. The other

    approach involves direct or hard references, and this approach is preferable after
    you understand

    how to use references.


    To create references in an indirect way, you can use the approach Listing13_02
    provides. Ac-

    cordingly, you define an identifier as you do normally. You then employ the reference
    operator

    to create a reference. The reference is the address or place in memory of the
    value you have

    defined for your identifier. You then assign this value to yet another identifier.
    See Figure 13.2.


    ```

    ```perl

    #Listing13_02

    ```

    ```


    ```

    ```perl

    #1 Define different identifiers of different types

    $ExtraVegetable = "Cabbage";

    @Fruits = ("Apple", "Apricot", "Banana");

    %Cereals = ("Bran Buds" , 110, "Raisin Bran" , 150);


    $NL = "\\n\n";

    $DL = "-" x 50;

    #2 Define references

    #  In each case, the scalar stores the reference

    #  You assign the reference to the scalar


    #2.1 Define a reference for a scalar

    $RefToExtraVegetable = \$ExtraVegetable;


    print "$NL 2.1.1. Value in \$ExtraVegetable -- ". $ExtraVegetable;

    print "$NL 2.1.2. Reference in \\\$ExtraVegetable -- ". $ExtraVegetable;

    print "$NL 2.2.3. Reference in \$RefExtraVegetable -- ". $ExtraVegetable;


    print $NL . $DL;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# #2.2 Define a reference for an array


    ```

    `$RefFruits = \@Fruits;`

    ```


    ```

    `print "$NL 2.2.1. Value in \@Fruits -- @Fruits";`

    `print "$NL 2.2.2. Reference in \\\@Fruits -- ". \@Fruits;`

    `print "$NL 2.2.3. Reference in \$RefToFruits -- ". $RefFruits;`

    ```


    ```

    `print $NL . $DL;`

    ```


    # #2.3 Define a reference for a hash


    ```

    `$RefToCereals = \%Cereals;`

    ```


    ```

    `print "$NL 2.3.1. Value in %Cereals -- ";`

    `print %Cereals;`

    `print "$NL 2.3.2. Reference in \\\%Cereals -- ". \%Cereals;`

    `print "$NL 2.3.3. Reference in \$RefToCereals -- ". $RefToCereals;`

    ```


    As Figure 13.3 shows, Listing13_02 provides output that traces the assignment
    process. At comment #1, you define three standard identifiers ($ExtraVegetable,
    @Fruits, and %Cereals). You then proceed at comment #2 to use the reference operator
    to access the reference for each of these identifiers. In each instance, you assign
    the reference to a scalar identifier that you prefix with Ref. As Figure 13.3
    illustrates, printing the value that you have assigned to each identifier echoes
    the value back to you.


    When you apply the reference operator or the identifier (items 2.1.2, 2.2.2, and
    2.3.2), you see the reference identifier. You can refer to this form of the identifier
    as its typeglob readout. The typeglob readout is an analytical tool that usually
    has few places in basic Perl programs, but it proves useful if you are curious
    to see how the identifier reference table identifies any given identifier in your
    program.


    In every instance, the typeglob characterization consists of the address of the
    identifier and its type. For the @Fruits array, then, you see ARRAY (0×35f00)
    in Figure 13.3. For the %Cereals hash, you see HASH (0×1833e7c) in Figure 13.3.
    When you execute Listing13_03 on your computer, you see different numbers (the
    0× indicates that they are hexadecimal numbers) because your computer assigns
    the memory locations to the identifiers when the program executes, and each computer
    on which a program runs is likely to designate different memory locations.'
