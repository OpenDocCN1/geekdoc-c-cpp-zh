    $Itr = 1;\nforeach $City (@CitiesJapanCaps){\n    print \"\\n \" . $Itr++ . \"\
    . $City\";\n}\n```\n```\n\nWhen you use the basic form of `sort()`, you can depend\
    \ on the success of the operation when you deal with words. The reason is that\
