  md: '# # 4 Print Functions


    While many of the functions Perl offers originate in modules that accompany the
    Perl interpreter,

    it is best to begin your work with the built-in Perl functions. Toward this end,
    this chapter introduces functions, function arguments, and the returned values
    of functions. Among key functions that most Perl programmers learn first are the
    `uc()`, `ucfirst()`, `chomp()`, `chop()`,

    `length()`, `substr()`, and `join()` functions, and these and other functions
    receive attention in this chapter. As you go, you work with the functions through
    a number of elementary programming exercises. The topics this chapter addresses
    include the following:


    +   - Functions applied to scalars

    +   - How arguments and return values apply to functions

    +   - Using functions to change the cases of characters

    +   - Hidden characters and truncating strings

    +   - Command line input and Perl programs

    +   - Manipulating strings in a variety of ways


    # ## How Functions Work


    Although a great deal more remains to be said about functions in chapters to come,
    a few preliminary points can be made in this chapter to ensure that you understand
    the use of the built-in Perl functions as they relate to strings.


    # ## Basic Call and Return Operations


    As Figure 4.1 illustrates, in the standard presentation and use of functions,
    the name of the function directly precedes a set of parentheses that enclose an
    _argument that you pass to the function_. When you type the name of a function,
    the interpreter processes the arguments. When you use a built-in function, you
    do not see the code that performs this work. (After all, the function is built
    into Perl. In later chapters, you see how you can build your own functions.) After
    the'
