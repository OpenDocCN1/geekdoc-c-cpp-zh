    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_316_0.png)


    # ## Conclusion


    This chapter began with an exploration of the basic concept of repetition. It
    then moved on to explore the most fundamental of repetition control statements,
    the for control statement. From there, it moved into such control statements as
    while, until, do..while, and do..until. Such repetition control statements tend
    to be generic, lending themselves to any types of appli- cations you want to make
    of them.


    Other controls investigated in this chapter tend to be more specific. Among these
    are the foreach and each controls. The foreach statement extracts items from an
    array until it reaches an undefined element that marks the end of the array. The
    each control statement performs a similar action with relation to hashes, with
    the difference that it reads key-value pairs rather than single array items.


    In addition to control statements, this chapter explored the next, redo, last,
    and continue operators. The next operator returns you to the head of a repetition
    control block. The last operator exits you from a block. You can use the redo
    operator with block target tags to control the flow of a program in a fairly arbitrary
    way. The continue operator allows you to extend a repetition block. Used with
    selection statements and next and last, continue statements become effective ways
    of implementing involved program flows.'
