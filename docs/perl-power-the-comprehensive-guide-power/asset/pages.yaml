  md: "# Match Variations\n\nYou can use a number of variations in the forms of matching\
    \ you employ. The slashes are the most common delimiters, but you can change the\
    \ delimiters in many ways. Consider, for example, a few basic alternatives involving\
    \ matches:\n\n```\nif ($TestString =~ m!roof!){\n    print(\"Match delimited with\
    \ !! $NL\");\n}\nif ($TestString =~ m{roof}){\n    print(\"Match delimited with\
    \ {} $NL\");\n}\n```\n\nIn these two expressions, you substitute exclamation marks\
    \ and curly braces for slashes. The output is as follows:\n\n```\nMatch delimited\
    \ with !!\nMatch delimited with {}\n```\n\nWhen you evaluate expressions that\
    \ contain special characters, you must identify the special characters using escape\
    \ sequences:\n\n```\n$EscapeTerms = \"\\\\\\$\";\nif ($EscapeTerms =~ m\"\\@\"\
    ){\n    print \"Match with escape \\@ $NL\";\n}\n```\n\n# Exactness\n\nWhen you\
    \ create a pattern, you can match almost any series of letters. In other words,\
    \ the letters can be separated by spaces, other letters, or words, but the match\
    \ requires (in most cases) that you match the sequence.\n\n```\nif ($TestString\
    \ =~ m/ on the r/){\n    print \"An exact pattern works. $NL\";\n}\n```\n\nIf\
    \ you include spaces to indicate that a given word lacks completion, the match\
    \ remains inexact. Consider the following matches:\n\n```\nif($TestString =~ m/\
    \ on the r /){\n    print \"Found on the r (space after r)$NL \";\n}elseif($TestString\
    \ =~ m/ on the r/){\n```"
