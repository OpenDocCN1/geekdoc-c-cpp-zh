- pgno: 314
  md: "# Using each to Count Word Occurrences\n\nListing11_12 counts the number of\
    \ times specific terms occur in a list. A scenario for such an array might involve\
    \ a geology lab. A lab instructor might divide a class into teams and then solicit\
    \ from the teams lists of mineral samples studied during a term. Rather than counting\
    \ the items one-by-one, the instructor might create a list and then use a Perl\
    \ program to discover the number of times the teams as a whole accessed specific\
    \ lab samples. Using the same model, it becomes possible to create a much more\
    \ involved program that goes through a text, finds the pages on which words occur,\
    \ and records them in a file. Listing11_12 provides a minimal program that shows\
    \ a few starting routines.\n\n```\n```perl\n#Listing11_12\n#Using foreach, while,\
    \ and each.\n#compendium, concordance, count\n\n#1 Create an array of items\n\
    @MineralSamples = qw( Flourite Rhodonite Roodochrosite\n                     \
    \ Siderite Strontianite Smithsonite\n                      Colemanite Natrolite\
    \ Feldspare\n                      Siderite Natrolite Strontianite\n         \
    \             Topaz Borax Magnesite Turquoise\n                      Colemanite\
    \ Siderite Natrolite\n                      Flourite Rhodonite Natrolite Feldspare\n\
    \                      );\n\n#2 foreach counts all the items in the array\nforeach\
    \ $Sample (@MineralSamples) {\n    #access value and increment it for each occurrence\
    \ found\n    $SampleCount{$Sample} = $SampleCount{$Sample} += 1;\n}\n\n#3 Formatting\
    \ elements for the table\n$NL = \"\\n \";\n$DC = sprintf(\"%c\",236);   #cast\
    \ using sprintf to make a special character\n$TW = 60;                   #Table\
    \ width\n$DL = sprintf(\" %55s\", $NL . $DC x $TW); #top and bottom lines\n$COLHEAD\
    \ = \"Mineral Name\";\n```\n```"
