    # Range Problems and the rand() Function


    To generate the random number shown in Listing05_04, you use the `rand()` function.
    By default, the return value of this function is a rational number in a range
    that is zero or greater and less than a whole number value of the digit you use
    as an argument. As Figure 5.5 illustrates, a problem results when you consider
    that a die has 6 dots. If you use an argument of 6 for the `rand()` function,
    the largest value the `rand()` function can generate is 5.99999999999999. This
    not quite 6. Likewise, a die has 1 to 6 dots; no face is blank. Such inconsistencies
    constitute a range problem.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_126_0.png)


    To solve the range problem, you shift the returned value of `rand()` function
    by one. Given the truncation that the `int()` function performs, if you add one
    to the value the `rand()` function generates and set the argument of `rand()`
    to 7, you then acquire numbers in the range of 1 to 6.


