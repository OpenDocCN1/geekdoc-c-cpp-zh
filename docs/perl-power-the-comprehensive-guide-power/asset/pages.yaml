- pgno: 147
  md: '# # Array Fundamentals


    This chapter provides you with an introduction to Perl arrays. A Perl array is
    more of a container than it is a fundamental array. It expands automatically.
    It allows you to employ a number of functions associated with it to perform such
    actions as inserting and extracting elements. In this chapter, you focus primarily
    on issues concerning initializing arrays and working with a few basic functions
    relating to them. Among the topics this chapter addresses:


    +   - Getting used to the scalar and implicit forms of Perl arrays

    +   - Exploring a few definition issues

    +   - Combining smaller arrays to form larger arrays

    +   - Changing the order of elements in an array

    +   - Using specialized functions to add lists of items to arrays

    +   - Swapping, slicing, and splicing arrays


    # ## Basics of Arrays


    An array consists of a sequence of items stored sequentially in your computer’s
    memory. An array is analogous to a set of drawers. Each drawer is an element.
    You can know each element in the array according to its index. The indexes of
    arrays start at zero.


    As Figure 6.1 illustrates, Perl arrays possess two forms. One form is known as
    the *literal* or *scalar* form of the array. You can recognize this form of the
    array because it looks like a scalar identifier with a suffix that consists of
    square braces containing a number. The other form is known as the *implicit* form
    of the array. The implicit form of an array consists of an identifier prefixed
    with the business “at” sign (@).'
  merge: -1
  img_proc: true
- pgno: 148
  md: "**Figure 6.1**\nArrays have scalar and implicit forms.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_148_0.png)\n\
    \nAs this chapter and the next explore fairly extensively, when you employ the\
    \ scalar form of the array, you access its element using the indexes of the elements.\
    \ On the other hand, to work with the implicit form of the array, you use any\
    \ of a fairly large group of functions Perl provides specifically for use with\
    \ arrays. Figure 6.1 illustrates one such function, `sort()`, which allows you\
    \ to alphabetically or numerically organize the elements in an array.\n\n# Adding\
    \ Elements\n\nArrays expand dynamically. For this reason, you do not need to declare\
    \ them or initialize them in any way other than the way you make of them when\
    \ you first declare and define them. To add elements to an array, you can take\
    \ two basic approaches. From one approach, you can add an element to an array\
    \ by using the scalar (`$`) form and naming the index to which you want to assign\
    \ a value. From the other approach, you can employ what is known as the *list\
    \ function* to assign new elements to the implicit (`@`) form of the array. Some\
    \ programmers refer to the `@` as the *implicit* form of the array. Listing06_01\
    \ provides several examples of how you can define, retrieve, and print elements\
    \ in arrays.\n\n```\n```perl\n#Listing06_01\n#Array definitions\n\n$NL = \"\\\
    n\";\n#1 Add items using the scalar form of the array\n$NewArray[0] = \"Fields\
    \ \";\n$NewArray[1] = \"of \";\n$NewArray[2] = \"Green \";\n\n#2 Print as a scalar\
    \ or interpolated value\nprint \"$NL Array element identified by index 1: \"\n\
    \                 . $NewArray[1] . \"$NL\";\n```\n```"
