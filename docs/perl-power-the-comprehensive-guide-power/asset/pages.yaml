- pgno: 67
  md: '# # Multiplying String Output


    Operators cause identifiers to act on each other. You use them to create relations
    among identifiers. In Perl, since scalars are numbers or strings, there are also
    two sets of operators. For numbers, many of the operators are those that you are
    familiar with through mathematics. However, with respect to strings, you use a
    set of operators that differ from those that mathematics provides. If they are
    the same, you find in many instances that when you use them, you might not be
    able to easily predict the result. Consider for instance what a multiplication
    operator (x) means when applied to strings. Perl sports such an operator. It allows
    you to duplicate and concatenate a string with itself. Listing03_12 illustrates
    two approaches to such concatenation.


    ```

    ```perl

    #Listing03_12

    #"Multiplying" and concatenating a string

    #Use of a standard arithmetic operator

    #Copies and concatenates an interpolated string three times

    #Then assigns the result to a scalar variable

    $MultipliedString = "\nDo it!" x 3;

    print "$MultipliedString";

    #Another approach using the same general notion

    #but this time preceding the scalar variable

    #with the multiplication expression

    $TextSource = "Done that!";

    #With a little variation

    $SpacePlace = "...";

    print "\n" . $SpacePlace x 1 . "$TextSource\n";

    print $SpacePlace x 2 . "$TextSource\n";

    print $SpacePlace x 3 . "$TextSource\n";

    ```

    ```


    In Listing03_12, you combine the operator and the scalar that contains the three
    dots ( $SpacePlace × 3 ) into an expression. You then concatenate the expression
    to the scalar that contains the text source. However, you place the scalar containing
    the text source in quotes to combine it with an escape sequence. Figure 3.13 illustrates
    the output of Listing03_12.'
  merge: -1
  img_proc: true
