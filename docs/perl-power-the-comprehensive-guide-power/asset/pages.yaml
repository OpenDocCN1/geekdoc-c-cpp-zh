    \ a repetition block. The `continue` operator allows you to extend the block to\
    \ which you append it and add additional statements. If you append it to a `while`\
    \ statement, for example, and use the `next` operator, the flow of the program\
    \ returns to the top of the `while` statement. If you use the `last` operator\
