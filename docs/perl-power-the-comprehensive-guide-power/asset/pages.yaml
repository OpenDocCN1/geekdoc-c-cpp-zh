    for or while loop), they do not cause your loops to repeat too many or too few
    times (see Chapters 10 and 11).


    As a reminder, an _identifier_ is a word you use as the name of a variable. Generally,
    programmers say that they _declare_ a variable when they type the identifier.
    When you assign a value to a variable, you _initialize_ it. Some programmers refer
    to this as _defining_ the variable.


    The Perl interpreter regards an identifier to which you have assigned a value
    as _defined_. It recognizes an identifier to which you have not assigned a value
    as _undefined_. The `defined()` function does not change the value in your identifier;
    rather, it evaluates your identifier. If it determines that you have defined the
    identifier, it returns true (1). If it finds that you have not defined the identifier,
    it returns false (0). In contrast to the `defined()` function, the `undef()` function
    does change the value of your identifier, for it strips the identifier of its
    definition. Listing05_02 examines some of the uses you can make of the `defined()`
    and `undef()` functions.


