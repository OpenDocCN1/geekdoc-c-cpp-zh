  md: '# # Controlling Shuttles with Stacks


    As Figure 7.13 illustrates, a stack constitutes a container in which you add elements
    to the end and then, at a given moment, remove elements from the end. Generally,
    programmers say that they *push* elements into a stack or *pop* elements from
    a stack. The `push()` and `pop()` functions reviewed in previous sections perform
    actions on arrays that correspond to common stack operations. One other operation
    common to stack containers is that of obtaining the length of the stack. The `scalar()`
    function or the procedure you use to assign the `@` array value (`$Length = @some
    array`) serves this purpose.


    A key concept in the use of stacks usually involves the notion of a threshold.
    A threshold is an accumulated quantity. Consider, for example, a situation in
    a factory in which you want to relate the actions of two production lines. One
    line supplies plastic dolls. The other supplies crates that contain plastic dolls.
    A stack allows you to do so. You can create a computer program that records the
    actions of an electronic detection device that monitors the output of the line
    that produces the dolls. Each time a doll emerges from the line, you can add an
    element to a stack. When the elements in the stack grow to a given point, you
    can “pop” the stack. When you pop the'
  merge: -1
