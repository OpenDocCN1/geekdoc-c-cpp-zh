- pgno: 21
  md: '# # Perl Basics


    This chapter provides an introduction to this book, with a little information
    on the history of Perl and its general features as a programming language. It
    provides you with a few observations relating to the purpose of this book and
    how it can contribute to your work with Perl. Among the topics dealt with are
    the following:


    +   - Perl is a language that you can easily learn.

    +   - You can acquire the Perl interpreter on an open, freely available basis.

    +   - The Perl development community is immense.

    +   - The language features of Perl could occasion a lifetime of learning.

    +   - If you want to learn Perl, work with it on the most essential level; then
    go from there.


    # ## Having Fun


    The inventor of Perl is a linguist/programmer named Larry Wall, and a point of
    his philosophy as a developer is that if you do not have fun programming, then
    something is wrong.


    This is one of the most wonderful statements ever made by a world-class programmer
    and goes against the standard wisdom of any number of programming efforts and
    programming languages. Many languages are anything but fun. Many programming efforts
    seem to have as their ground rule a dictate that anyone involved shall be reduced
    to a slave-like condition and subjected to endless hours of harsh, unremitting
    labor, involving the resolution of itty-bitty programming language details.


    Perl can provide one of the most pleasant programming experiences to be found
    anywhere. This book is based, in any event, on this assumption. It focuses on
    the bare details of the Perl programming language with the hope that you will
    take what it offers and then proceed to deepen your knowledge from there.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# # CHAPTER 1 Perl Basics


    If you gain an understanding of the basics, then you are equipped to take your
    explorations as far into the universe as you want to. The basics allow you to
    deal with the strange metaphorical planets, solar systems, and galaxies that characterize
    any number of modular approaches to Perl, and if it so happens that you want to
    do your own explorations, well ...


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_22_0.png)


    This book originated in my efforts as a teacher at a trade college. I taught one
    course after another on Perl. How many such courses there are at the college level
    is hard to say, but whatever the case, over time I learned that the students in
    the class were delighted when they discovered programming through Perl. On thing
    I learned as a teacher was that the people in the classes (and they constituted
    a fairly diverse group) enjoyed the essentials most. They tended to express dissatisfaction
    when I approached Perl as a module-driven language.


    It could have been the teacher, of course.


    # ## Power and Perl


    Many programmers regard Perl as a powerful and useful programming language because
    it offers modules. This is a most tenable position, and I fully accept it. At
    the same time, trying to acquire a knowledge of Perl through modules proves difficult.
    Perl modules can be black holes (to extend a metaphor). It is easy to lose sight
    of the essentials even while you are trying'
  merge: -1
  img_proc: true
- pgno: 23
