- pgno: 24
  md: '# # The Community


    The Perl programming community extends around the Earth and possibly into distant
    parts of the galaxy. As you can see in Table 1.1, surveys reveal that over a million
    people program using Perl. The widespread use of Perl as a programming language
    dates from the mid-1990s, and Perl is almost always associated with the spread
    of the Internet. Where the Internet goes, Perl goes.


    It could be the other way, also. There are plenty of reasons for this. Perl is
    an interpreted language, and the Perl interpreter has been ported to Windows and
    Unix/Linux operating systems, spreading in its use in much the same way that the
    Internet has spread.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_24_0.png)


    If you write a program in Perl that executes on the Windows operating system,
    you can move it fairly easily to Unix or Linux. This is called portability. In
    addition to portability, Perl appeals to many people because you can acquire it
    free of charge, install it in a few minutes, and start composing programs with
    it almost immediately.


    To a certain extent, the same can be said of other programming languages, especially
    Java, but with Java you face the task of learning how to work with object-oriented
    programs and the Java class libraries. As you’ll discover in Chapter 2, none of
    this is necessary with Perl. You can download the ActivePerl interpreter and begin
    programming in a few minutes. Writing your first Perl program requires one line
    (maybe two) of code.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Further, you can compose Perl programs using vi, Notepad, or any other word
    processor that allows you to save your files as ASCII text. You don’t have to
    worry about packages or byte code compilation. You just type it, save the file,
    and then run it. Life is good.


    # The Other End of the Galaxy


    Perl is a fairly friendly language to program with if you are interested in learning
    how to program. It does not enforce restrictive data-typing requirements. The
    four fundamental data categories you work with in this book (scalars, arrays,
    hashes, and handles) are represented in a reference table that allows you to convert
    one to the other with relative ease. This means that if you don’t like your data
    in one form, you can change it to another with what usually amounts to a single
    function call. That is about as friendly as a language can get.


    As mentioned before, however, while Perl is friendly, it also has what might be
    viewed as possessing a dark side. The dark side has two faces:


    +   As mentioned previously, over the years, advanced Perl developers have created
    an armada of modules. The modules offer functions. The functions are often mysterious.
    The documentation grows voluminously, accumulating on the web in every country
    and dozens of languages. Neophyte Perl programmers dig into these modules and
    their accompanying documentation, create programs that they think they understand
    but ultimately do not, and sometimes end up saying that they regret that they
    ever endangered their website, programming class, or sanity by engaging in such
    a dangerous activity.


    +   The syntactic flexibility of Perl allows clever programmers to write arcane
    programs that rival the work of master cryptographers. Out in the more remote
    regions of the galaxy there are possibly new religions being founded on such programs.
    Closer to home, however, people who have to maintain such programs resent them
    and say harsh things about them. In slightly different terms, when programmers
    write programs that others cannot understand and maintain, the cost of the program
    increases over time. The cost is both in the money companies must spend on maintaining
    programs and the stress those who work to maintain such programs endure.


    Well...such things can be said about any programming language, but in many ways
    the stories you hear about Perl result because it is, after all, a vastly democratic
    language and so exposes itself to all sorts of abuse.


    # Derivations


    Perl provides a set of functions that allows you to easily begin working with
    its primary categories of data. You can sort or reverse the items in an array,
    for example, and if you want to use a hash, you do not have to resort to extraordinary
    construction operations to add keys and values to it'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# # CHAPTER 1 Perl Basics


    or to access them afterward. And along simpler lines, if you create a character
    and want to make

    it a number, you can.


    Such ease of use in many ways presents an enigma when you consider that Perl possesses
    the

    look and feel of the C programming language is something like

    the ancient Greek of the Unix world (or the programming word as a whole). As wonderful
    as it

    might have been for many of us twenty-five or so years ago to begin programming
    with C, the

    story is now different. C was austere and unforgiving, and that was that.


    On the other hand, Perl owes much to the scripting languages in the UNIX world.
    It provides

    many features that allow you to readily interact with operating systems as a system
    administrator.

    It provides you with regular expressions. It appeals to a fairly essentialist
    view of how to interact

    with a computer. (Old salts call this being close to the hardware.)


    Still, Perl tends to be to a great extent what its user/developer community has
    made it. One way

    that the community continuously shapes Perl involves the use of modules. Modules
    extend Perl

    into thousands of special applications. In fact, some books teach Perl as an extension
    of one or

    another module rather than a programming language that makes use of modules.


    As has already been mentioned, however, learning Perl through modules is probably
    not the best

    idea. At least, that is the perspective I take. When pushed to defend my position,
    I usually recount

    a story that involves a student who once brought me a fantastic book on Perl modules.
    It showed

    you how to build websites. It was great! Just access these modules and go to work.


    No explanations of the basics accompanied the book.


    Further, use of the modules assumed that you had installed them. To install them,
    you had to

    know where to find them. To find them, you had to obtain the right versions of
    them. Likewise,

    it was necessary to access a server...and a database.


    The student reported that the learning experience was beneficial, generally, for
    he learned that

    he was ignorant of many things, but since he could not get any of the code in
    the book to work,

    he said he was not having fun.


    I’ll admit that as much as I enjoy solving problems, the venture did not sound
    fun. In the end,

    he said a very strange thing: “I think I need to learn the language first.”


    # ## Getting It


    Among other companies and organizations, ActiveState and O’Reilly have emerged
    as leading

    support centers for Perl. Likewise Perl is often associated with the Apache Server,
    and you can

    discover quite a bit about Perl modules by visiting the Apache Software Foundation
    site. The

    perl.org site provides you with information on Perl libraries and many pages of
    documentation

    and source code. The O’Reilly site provides extensive resources, along with books
    by Larry'
  merge: -1
  img_proc: true
