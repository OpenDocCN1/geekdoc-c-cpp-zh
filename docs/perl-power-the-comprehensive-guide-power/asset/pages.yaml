    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_201_3.png)


    The order in which the hash replaces duplicated keys is predictable. The most
    recently entered duplicate key displaces the older key. As for the organization
    of values in a hash, the situation depends on the algorithm behind the hash. When
    you display the items in a hash, it is difficult to predict the order of display.
    Consider the elements shown in Figure 8.3. This could be the order in which you
    see elements as you print them from a hash. The order of elements is not alphabetical.
    Nor is it the order in which you add values to the hash.


    # Identifying and Initializing Hashes


    Hashes have two contexts of use. One context is the implicit context. The other
    is the scalar context. When a hash appears in an implicit hash context, you identify
    it with a percent sign (%).'
