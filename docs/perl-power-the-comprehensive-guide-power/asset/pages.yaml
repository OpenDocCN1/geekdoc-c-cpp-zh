    # The if...else Selection Structure


    The if...else selection structure accommodates exclusive choices. You can use
    it to make one choice or another. To make a choice, you set up one condition.
    If the condition proves true, then the selection statement directs the flow of
    the program to the primary `if` block. If the condition does not prove true, then
    the statement directs the flow to a catch-all `else` block. No conditional expression
    governs the `else` portion of the structure. Listing10_09 explores the use of
    the if...else selection structure, but it adds to the basic use by embedding a
