- pgno: 250
  md: '# # Flow and Sequence


    Programs flow sequentially when one statement after another executes until you
    reach the end of the program. Usually, the statements in a program that employ
    only sequential logic execute in the order in which you see them in the text of
    the program. You can alter this situation if you use labels and “go to” instructions,
    but even then it remains that your program executes according to a sequential
    logic. No decisions occur. Rather, you set a path, and the program follows it.
    Figure 10.2 illustrates the actions of a program that executes according to sequential
    logic.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_250_0.png)


    **Figure 10.2**

    When a program executes sequentially, it moves invariably from one statement to
    another from beginning to end.


    Table 10.1 provides discussion of a few of the terms related to sequential statements.
    The sequential flow of a program can include subroutines (also known as functions
    or methods). Chapter 12 covers the use of functions. The use of functions also
    relates to modules (see Chapter 13).


    # ## Table 10.1 Discussion of Sequential Terms


    | Term | Discussion |

    |---|---|

    | The semicolon (;) | You employ the semicolon to create a statement. A sequence
    consists of a set of statements. |

    | Operator precedence | Operators possess precedence. In Chapter 5, Table 5.1
    provides a summary of the operators Perl provides. The table also indicates their
    precedence. |


    functions, you can create a program in which the order of the statements in the
    text no longer corresponds to the sequence of their execution.


    * **Selection.** You can embed decisions in a program that determines whether
    given blocks of the program are to be entered. The flow of the program depends
    on the outcomes of the decisions. Selection can involve single decisions or multiple
    decisions.

    * **Repetition.** A program can execute such that certain blocks of its statements
    execute over and over again, according to a set number of repetitions that a counter
    controls or according to given conditions. If a condition is true, a block of
    your program repeatedly executes. If the condition becomes no longer true, then
    the repeated executions cease.'
