- pgno: 416
  md: '# CHAPTER 15 { } Regular Expressions


    The binding operator associates the regex with the string it operates on. When
    associated with a string, it returns either a modified string or a Boolean value
    from an expression that evaluates the string.


    You employ regular expressions extensively on isolated strings, but it remains
    that regexes often enter the picture as you work in broader contexts, such as
    when you use the `split()` or other functions to translate strings into arrays
    or hashes or hashes and arrays into strings.


    There are three fundamental aspects of regular expressions: matching, substituting,
    and translating. Technically, a translation does not constitute a regular expression,
    but it is traditional to discuss it as a regular expression.


    # Overview


    Matching takes the following form:


    ```

    $TestString =~ m/<Regular Expression>/

    ```


    In this expression, `m//` constitutes the *matching function*. The matching function
    matches the string, `$TestString`, against the expression between the slashes.
    The binding operator effects the comparison. If the expression finds a match,
    it returns true.


    Substitution takes the following form:


    ```

    $TestString =~ s/TermToSub/TermReplaced/

    ```


    In this expression, `s///` is the *substitution function*. The expression looks
    roughly the same as the matching function, but it results in a different outcome.
    The function operates on the string to the left of the binding operator according
    to the expression given on the right. Rather than returning a Boolean value, it
    modifies the string on the left. The function returns the string to itself, modified.
    The string you place in the a position is substituted for the item in the b position.


    In addition to matching and substitution functions, Perl offers *translation functions*.
    Translation takes the following form:


    ```

    $TestString =~ tr/A-Z/a-z/

    ```


    This example is more specific than the previous examples. This is an actual example
    of the use of the translation function to search `$TestString` and change all
    the capital letters to lower-case letters.


    # Statement Formulations and Matches


    The expression `m//` constitutes the basic form of the regular expression you
    use for matching. The expression matches a string in a string. Here is a starting
    string that you can use in the exercises in this and the next few sections. For
    the complete program, see Listing15_01.'
