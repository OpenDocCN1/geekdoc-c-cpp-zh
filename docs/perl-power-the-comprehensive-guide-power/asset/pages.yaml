    \ (@ImplicitArray) and an array using the scalar ($NewArray[2]) syntax.\n\n```\n\
    ```\n#Listing06_02\n# Array definition issues\n$NL = \"\\n\";\n#1 Declare identifiers\n\
    @ImplicitArray; #Array as array\n$NewArray[20]; # Array as a scalar\n#2 Test for\
    \ definition\n$LenA = @NewArray;\nprint \"$NL Non-initialized array length of\
    \ \\$NewArray[20]: \" . $LenA;\n$LenA = @ ImplicitArray;\nprint \"$NL Non-initialized\
    \ array length of \\@ImplicitArray: \" . $LenA;\n#3 Arbitrary definitions more\
    \ or less successful\n$NewArray[15] = 40;\n$LenA = scalar(@NewArray);\nprint \"\
    $NL 3.A Initialized (\\@) array length: \" . $LenA;\n$NewArray[20] = 40;\n$LenA\
