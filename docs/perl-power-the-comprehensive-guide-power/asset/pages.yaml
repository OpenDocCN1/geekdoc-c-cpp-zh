    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_245_0.png)


    **Figure 9.8**

    The `reverse()` function when applied to hashes reverses the key-value designations
    of the items in the hash.


    # ## Conclusion


    In this chapter, you have explored a number of ways to extend your use of hashes.
    You first examined the uses that you can make of the `defined()` and `exists()`
    functions to establish whether a named key exists in a hash. You moved from this
    to approaches you can use to obtain the number of elements in a hash. From obtaining
    the number of elements, you then explored how to slice hashes. A number of approaches
    to hash slicing are available. One involves using the lookup hash operation. Another
    involves using the list operation to merge the contents of different hashes.


    Two important activities you perform when using hashes involve uses of the `join()`
    and `split()` functions to translate hashes into strings or strings into hashes.
    When combined with the `sprintf()` function, you can transform key-value pairs
    into fully formatted strings ready for display. In addition to operations relating
    to strings, you also investigated the use of the `delete()` function, which used
    in combination with the `defined()` and `exists()` functions allows you to remove
    items from hashes.'
