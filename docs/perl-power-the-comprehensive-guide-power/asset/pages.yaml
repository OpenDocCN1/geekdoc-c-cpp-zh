- pgno: 427
  md: '| Character | Discussion |

    |---|---|

    | `{ }` | Curly braces serve as a multiplier. You can indicate you are looking
    for two or more of a given character. |

    | `[ ]` | Square braces establish classes. A class consists of subgroups of characters
    or expressions that you can search for. |

    | `^` | You can use the caret to signal to exclude a character. You negate the
    character. At the start of a pattern, the caret indicates the start of a line.
    |

    | `$` | You can use the dollar sign only at the end of a line of a pattern as
    a special character; otherwise, it is read as a scalar identifier. When you use
    it at the end of a line, it indicates that no more characters should follow in
    the pattern you are searching for. |

    | `,` | You can use commas to establish a range. A comma between 2 and 6 signals
    the range from 2 to 6. |

    | `|` | The separator (or pipe) serves to indicate options. |

    | `*` | Use an asterisk to indicate “any character.” It matches zero or more instances
    of characters, so you can indicate “Coronado” with “C*do.” |

    | `+` | Use the plus sign to indicate one or more instances of a given character.
    |

    | `?` | Use the question mark to indicate zero or more occurrences of letters.
    |

    | `\\` | The escape character allows you to indicate that the character that follows
    it is to be read as a literal character rather than a metacharacter. |

    | `.` | The period serves as a substitute for characters. It indicates one occurrence
    of any character. Use two periods to stand for a series of characters. |


    Listing15_05 provides examples of the use of special characters and escape sequences.
    As a starting observation, if you want to match special characters as literal
    characters, you must precede them with a backslash. Here is an example involving
    a plus sign:


    ```

    print "found 6+2\n" if ("6+2=8" =~ /6+2/);

    ```


    This expression results in no match because it attempts to match the plus sign
    (+) without compensating for the fact that the plus sign constitutes a special
    character. To correct the expression, you employ a backslash:


    ```

    print "found 6+2\n" if ("6+2=8" =~ /6\+2/);

    ```


    Now the expression prints because it recognizes the plus sign as a plus sign.
    Here is the output of the expression, which you find as Example 1 in Listing15_02:


    ```

    found 6+2

    ```'
  merge: -1
  img_proc: true
