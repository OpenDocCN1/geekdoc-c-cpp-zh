  md: "# # The pack() Function\n\nThe `pack()` function allows you to create a fixed-length\
    \ record by specifying the data types to be processed and the number of bytes\
    \ needed to accommodate the data. To create fixed-length records, you first need\
    \ to establish the length of the record you want to create. Suppose for starters\
    \ that you want to write records that consist of the following fields:\n\nDinosaur\
    \ Name Dinosaur Family Period of Existence\n\nAfter surveying the basic data,\
    \ you decide that you are safe if you use the following maximum lengths for the\
    \ three fields that constitute the record:\n\n20 characters 20 characters 20 characters\n\
    \nTo create a record to accommodate these fields, you use the following approach:\n\
    \n$Record = \"A20 A20 A20\";\nmy $RecordLength = pack($Record);\n\nThe `pack()`\
    \ function retrieves the information the `$Record` identifier provides and “packs”\
    \ it into a single value. The resulting record length for the specifications provided\
    \ is 60. Now you can use this record definition to write records to a file. Listing14_08\
    \ explores this activity in a context that allows you to create a file that contains\
    \ fixed-length records. The program creates the file every time you execute it\
    \ and opens the file using Notepad so that you can view it.\n\n```\n#Listing14_08\n\
    #1 Create anonymous embedded arrays\n$DinoRecords = [\n\t[ #Container array\n\t\
    ['Parasaurolophus', 'Hadrosaurids', 'Late Cretaceous'],\n\t['Tsintaosaurus', 'Hadrosaurids',\
    \ 'Late Cretaceous'],\n\t['Allosaurus', 'Carnosaurs', 'Late Jurassic'],\n\t['Centosaurus',\
    \ 'Carnosaurs ', 'Late Jurassic',]\n\t];\n#2 Print the records to preview them\n\
    #Dereference\n@Ref = @$DinoRecords;\n#Obtain the number of items in the container\
    \ array array\n$Length = scalar(@Ref);\n#Traverse both the array and print its\
    \ content\nfor($Itr = 0; $Itr < $Length ; $Itr++){\n\tprint(\"\\n\");\n}\n```"
