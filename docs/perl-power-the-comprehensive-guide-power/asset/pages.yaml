  md: '# # CHAPTER 3 Scalars and Strings


    In Listing03_13, string constants are used in the selection statements. In Statement
    1, the tested strings are interpolated. In Statements 2 and 3 the strings are
    literal. As the interpreter enters each if statement, it encounters the strings
    to be compared and a relational operator (eq).


    This type of operator is called a _binary operator_. It is binary because it relates
    two (bi) terms. The interpreter tests the items presented according to the logic
    the relational operator establishes. If the relationship is true, then the interpreter
    goes on to process statements inside of the curly braces. If the relationship
    is false, then the interpreter skips over the statements inside the curly braces
    and goes on with the remainder of the program.


