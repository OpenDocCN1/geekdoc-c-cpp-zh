    \ $NL = \"\\n \";\n    foreach $Item (@_){ #access the argument array here\n \
    \       printf(\"%$NL %-30s\", $Item);\n    }\n}\n```\n\nAt comment #1 in Listing13_01,\
    \ you define a series of identifiers of different types. The identifiers consist\
    \ of a scalar, two arrays, and a hash. At comment #2, you call the printItem()\
    \ function and pass all of these identifiers to it as arguments. With the definition\
    \ of printItem() that follows comment #3, you employ a foreach statement to access\
    \ the argument array and print the items it contains. As you can see in Figure\
    \ 13.1, the result consists of a single, merged array from which it would prove\
    \ difficult to extract individual items.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_352_0.png)"
