- pgno: 51
  md: '# # Scalars and Strings


    This chapter introduces you to scalars, primarily as used to program with strings.
    A scalar variable is a variable in which you can store a single value. A single
    value can be a number or a string. If the scalar stores a string, it can constitute
    a fairly vast amount of information. When you deal with strings, Perl allows you
    to use either interpolated strings or character strings. One of the best ways
    to experiment with strings involves performing output to your computer system
    using the `print()` function. In addition to exploring the basics of outputting
    strings, it is also important to become acquainted with operations relating to
    strings. Among these operations are concatenation, comparison, incrementing, and
    the use of blocks to store large bodies of text. This chapter takes you through
    a variety of topics and programs that help you to understand Perl strings. Among
    the topics covered are the following:


    +   - What makes a string a scalar

    +   - How strings can be interpolated

    +   - How strings can be read as characters

    +   - How to print strings

    +   - How to put strings together

    +   - Using operators to manipulate and compare strings


    # ## Preliminary Work


    The best way to learn a programming language often involves typing sample programs,
    studying them, and modifying them. Toward this end, this section allows you to
    work with the `print()` function and also offers a few essential points about
    Perl that furnish you with learning tools you can use throughout this book.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # The print() Function


    The most important functions you use as a beginning programmer in any language
    usually involve writing messages from your programs and reading messages into
    your programs. Such functions concern input and output (shortened to IO). When
    you want to write messages from your program in Perl, you use the `print()` function.
    To use this function in its simplest form, you type the word `print` and follow
    it in single or double quotes with whatever you want to write to an output device.
    Consider the following code sample:


    ```

    ```perl

    #Listing03_01

    #the print function

    print "\nHere are some data about Mt. Everest: ";

    print "\nClimber: Edmund Hillary, ";

    print "\nClimber: Tenzing Norgay.";

    ```

    ```


    Figure 3.1 illustrates the appearance of the output of this program as displayed
    in the DzSoft Perl Editor.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_52_0.png)


    The word `print` represents a function call. Much more is presented later on concerning
    functions. For now, note only that after the word `print` you see text placed
    in double quotation marks. This defines the text as an _interpolated_ string.
    You use opening and closing quotation marks. You end the line with a semicolon,
    which is a terminating mark for a program _statement_. As is explained at greater
    length later on, at the beginning of each line, the `\n` forces the text to appear
    on a new line when it is printed to the output device.


    # ## Code Composition Strategies with the Editor


    If you use an unregistered version of the EzSoft Perl Editor, you can still work
    with the programming examples in this book. EzSoft limits the length of the programs
    you can work with if you do not purchase a license. Otherwise, your use remains
    unrestricted.


    To work with the program examples in this book, access the chapter folders in
    the _Perl Power_! code directory. The programs are arranged on a chapter-by-chapter
    basis. You can find the examples for this'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'chapter in Chapter03. Each program is numbered sequentially and begins with
    the word “Listing.” Listing03_02.pl is an example of a file for this chapter.


    An effective way to learn a programming language involves typing programs and
    then modifying them to see how they work. It is suggested, in any event, that
    you use this approach with this book. If you run into problems, you can always
    open and compile the samples.


    When you develop a program, use an _iterative_ and _incremental_ approach to adding
    code to your program. Accordingly, start with a program of only a few lines of
    code. Compile these few lines to see whether they work. If they work, add a few
    more lines. The action of adding a few lines at a time involves incremental building
    of your program. The iterative part is the repeated testing by compiling.


    If your code results in an error, and you are working with the DzSoft Perl Editor,
    you’ll see an error report in a text area that opens automatically. In some cases,
    if you can click the line in the message window that reports the error, the editor
    positions the cursor on either the line that contains the error or one in close
    proximity to it. On the other hand, the error can also be serious enough that
    the editor cannot help you. In this case, try working from a single line. You
    can comment out all but one line if you must and work from there.


