  md: "# # Exiting for Loops Using last\n\nIn addition to using the `for` statement\
    \ control, you can implement loops that employ the\n`last` operator. The `last`\
    \ operator causes the flow of the program to exit a repetition block.\nListing11_02\
    \ provides examples using the `if` and `unless` selection statements.\n\n```\n\
    ```perl\n#Listing11_02\n#1 Set up some data\n$Example = 1;\n@Minerals = qw(Covelite\
    \ Galena Stibinite\n    Molybdenite Graphite Pyrolusite);\n$LIMIT = scalar(@Minerals);\n\
    \nprint \"\\n\\nExample \" . $Example++ .\n    ': for(;;){unless(){last;;}}' .\
    \ \"\\n\\n\";\n#2 Set the counter at 0 to accommodate the array\n$Itr = 0;\nfor(;;)\n\
    {\n    print \"\\n \" . $Itr . \" \" $Minerals[$Itr++] .\";\n    unless($Itr <\
    \ $LIMIT)\n    {\n        last;\n    }\n}\n```\n```\n\n# # Figure 11.3\n\nYou\
    \ can position the\ncontrol elements of a `for`\nstatement inside and out-\nside\
    \ the `for` block.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_280_0.png)"
