- pgno: 318
  md: '# # CHAPTER 12 Functions


    A function is a subroutine. A subroutine provides a way that you can conveniently
    break a program into parts to make its development and maintenance much more convenient
    than would be possible otherwise. In fact, without subroutines, it would not be
    possible to write programs of any but a fairly elementary level of sophistication.
    The reason for this is that programs constitute information systems. An information
    system consists of a collection of processes that accomplish a given task or provide
    a given service. As a system becomes more complex, the number of processes it
    includes can after a time become too complex for any given individual to understand
    as a whole.


    > In much of the documentation pertaining to Perl, you often read about functions
    as built-in functions. It remains, however, that the functions you create are
    also functions. Another term for the functions you developed are “user-defined”
    functions.


    Complexity provides a measurement of how many things you must be conscious of
    at any given moment to accomplish a given task or provide a given service. Consider
    a situation in which you have ten tasks to perform. If you try to think about
    all ten tasks at once, you are not likely to meet with success. Even if you can
    think of ten things at once, sustaining ten simultaneous thoughts is probably
    not a good use of your time.


    To deal with complexity, you use what is known as abstraction. Abstraction allows
    you to group the 10 tasks into subtasks. A subtask is a group of tasks that possess
    a common theme. Consider in general terms the work involved in composing a computer
    program. Suppose, for example, that you have at hand the work of creating a program
    to display information about ecological science. Figure 12.1 provides a possible
    scenario.


    Figure 12.1 represents a longer list of tasks broken down into a shorter list
    of tasks. The shorter list represents abstractions. Each abstraction helps you
    view the task in a given context of activity. Researching ecological biomes now
    constitutes an initial project activity. Testing the main features of the program
    the project becomes a task you associate with the end of the project. In the middle
    lie tasks involving assimilating and categorizing information and attending to
    the specifics of writing a computer program.


    When you create abstractions, you develop ways to more easily understand a project.
    Remembering four headings requires less effort than remembering ten. Assessing
    priorities becomes easier when the work of assessment involves four tasks rather
    than ten. Likewise, when you analyze how tasks relate to each other, if you can
    view sets of tasks as a given type of activity (planning, research, design and
    development, testing), then you are in a better position to know how to organize
    tasks that emerge as you pursue your project.


    In Figure 12.1, each abstraction can be considered a subroutine of the larger
    group of tasks. Each subroutine results from what is sometimes called functional
    decomposition. Functional'
