    # # Table 5.1 Numerical Operators


    | Category | Operators | Description |

    |---|---|---|

    | Grouping | ( ) | Ensures that you can control how operations impact each other.
    Parentheses allow you to group operations visually if you lack certainty about
    the precedence of operators. The interpreter associates items in parentheses from
    left to right. |

    | Unary | ++$c $c++ --$d $d-- | Allows you to successively increment or decrement
    a value. Unary operators immediately affect variables, so next to the parentheses,
    they have the highest precedence of any operator. Since unary operators involve
    only one operand (identifier), there is no associativity. |

    | Arithmetic | * / % + - | Standard arithmetic operators. Multiplication and division
    have higher precedence than the modulus (remainder) operator, and these three
    operators in turn have higher precedence than addition and subtraction. All math
    operations are associated on a left-to-right basis. |

    | Relational | > < >= <= | Allows you to evaluate the relations that pertain between
    values. After you increment, decrement, or perform arithmetic operations, you
    conduct relational evaluations. Since relational operators do not involve combinations
    of values, they have no associativity. |

    | Equality | == != | Boolean operations require you to evaluate expressions according
    to equality or lack of equality. Equality and inequality have no associativity.
    |'
