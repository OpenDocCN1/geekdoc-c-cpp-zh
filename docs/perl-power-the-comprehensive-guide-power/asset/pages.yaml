  md: '# # The Explicit Use of return


    At comment #6, which identifies lines inside the `makeTable()` definition block,
    you call a function that converts acreage to hectares (`convertAcreToHectare()`).
    To employ this function, you supply it with the lookup hash operation for `%LocalFP`.
    When you provide the key (`$Acres`) to the lookup operation, it provides the number
    of acres for the footprint the key identifies. The `convertAcreToHectare()` function
    performs its work and then returns a value to the `printf()` function through
    the `makeTable()` function, and as Figure 12.13 illustrates, you see the result
    displayed under the `Hectares` column heading.


    You return this value explicitly (with the use of the `return` keyword). To return
    the value explicitly, in the definition of the `convertAcreToHectare()` function
    (see the lines following comment #7), you provide only one statement for the entire
    body of the function:


    ```

    return($_[0]/2.42);

    ```


    The `return` keyword accesses the result of the calculation and makes it available
    when the flow of the program reaches the end of the function and returns the value
    to the main flow of the program. If it is your task to maintain this code, the
    keyword enables you to recognize precisely how and where the function returns
    its value. When the `return` statement executes, it terminates the action of the
    function. Lines following it are not processed.


    As a contrast, in the comment following the `return` statement, the program provides
    an example of how you can implicitly return the converted number.


    ```

    #($_[0]/2.42);

    ```


    Commenting out this line make no difference in the performance of the function
    because the function terminates with the execution of the `return` statement.
    However, it is good form to comment the line to show that it is not intended as
    a duplication of the `return` statement. Were you to comment out the `return`
    statement, this statement would take its place and implicitly return the result
    of the calculation.


    On the other hand, as Figure 12.12 illustrates, if you reverse the order of the
    statements so that the explicit `return` statement follows the calculation, the
    `return` statement remains the last statement in the program. The flow of the
    program reaches the calculation, performs it, and without returning passes on
    to the following line, which contains the `return` statement. It then performs
    the calculation again and this time returns the result.'
  merge: -1
  img_proc: true
