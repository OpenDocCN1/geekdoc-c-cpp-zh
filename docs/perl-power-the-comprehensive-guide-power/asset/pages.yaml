- pgno: 312
  md: 'After setting up data and formatting details, you then turn to defining two
    identifiers that prove important to the execution of the program. Comment #2 identifies
    the lines that attend to these tasks. You set up an identifier, `$TRUE`, to allow
    the `while` control statement that creates the overall block for the program to
    run indefinitely. You also define an identifier (`$Score`) to track the progress
    of the player. Prior to defining these two identifiers, you call the `system()`
    function to clear the screen.


    In the lines just prior to comment #3, you use the `rand()` function to generate
    numbers in the range from 1 to 7. You assign the random number to an identifier
    (`$Number`). You print the number so the player can see it with each iteration
    of the `while` block. Following the generation of the random number, you set up
    a sequence control structure that tests the generated value against constant values.
    In each case, if the number corresponds to any number in the range from 1 to 6,
    you print a message that names one of the minerals and includes information about
    how to identify the mineral. It also congratulates the player on a successful
    find.


    To retrieve information, you use the array `@MineralNames` in its scalar form
    and submit the value the `$Number` identifier contains to locate the mineral name
    to display. To access information for the mineral, you employ the lookup hash
    operation for `%MineralDescriptions`. For the argument of the operation, you use
    the mineral name you retrieve from the `@MineralNames` array.


    Two `if` selection statements follow the cascading selection structure. One (at
    comment #4) tests for when the value assigned by the random number generator equals
    7. The other (at comment #5) tests for when the number assigned to `$Score` equals
    12.


    # Losing with 7


    In the lines trailing comment #5 in Listing11_11, you test for whether `$Number`
    is equal to 7. When you test for 7, you are testing for the number that ends the
    game. If the player can avoid this number for long enough to accumulate a score
    of 12, then the player wins. Even if the player’s luck has proven bad, you allow
    the player to continue to play. The player can type “q” to quit or press Enter
    to go on. You assign the input to `$ControlChar`.


    If the player presses Enter, the value assigned to `$ControlChar` consists only
    of a line return. When you apply the `chomp()` function to `$ControlChar` immediately
    after you assign the line return to it, you end up with an undefined value.


    The `unless` selection statement allows you to evaluate `$ControlChar` to exclude
    everything except a defined value. This defined value is “q.” (The `lc()` function
    transforms the uppercase version into lowercase if the player has typed “Q.”)
    Given a defined value of “q,” the `unless` condition directs the flow of the program
    into its block, and the last operator causes the flow to return to break out of
    the `while` loop. The game terminates.'
