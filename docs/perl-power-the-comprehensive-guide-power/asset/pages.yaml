    # ## Discussion


    number, then; it is a string. It is not an interpreted string, however; it is
    a _literal string_. The single quotation marks make the number into a literal
    string. The string stores a set of characters precisely as you have typed them.
    For this reason, the use of the dollar sign as a part of the string does not cause
    the interpreter to try to read the expression `$100 , 000` as a scalar. The dollar
    sign is read literally as a dollar sign. Such a string is called either a _literal
    string_ or a _character string_. Perl allows you use letters and number to create
    the names of scalars and other identifiers. Among the rules that apply to naming
    identifiers is that you cannot start them with numbers. For example, `$1aaa` is
    not a permissible identifier name. Here you have a combination of a word and two
    numbers, along with a comma. The double quotation marks cause the expression to
    be read as a single string. It is an _interpolated string_. The assignment of
    a single word to a single scalar value creates the most generally recognized version
    of a string. It is an interpolated string. To add to the discussion concerning
    `$100 , 000`, Perl is _case sensitive_, so `$FirstName` and `$firstname` are different
    identifier names.'
