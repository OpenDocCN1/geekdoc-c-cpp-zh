- pgno: 372
  md: '# Anonymous Array References as Data Containers


    You can create data structures that consist of arrays within arrays if you use
    anonymous array references. One reason that programmers use anonymous references
    is that such references enable them to avoid the need to name arrays within arrays.
    If you use an anonymous reference, you can concentrate on perfecting the work
    of a few sets of braces instead of a large number of different identifier names.
    As the next few programs reveal, without anonymous references, you might end up
    with dozens of identifier names that would make it almost impossible to manage
    the code in your programs.


    An anonymous array reference consists of square braces inside of square braces.
    The outer set of braces constitutes a “container” for as many arrays as you want
    to add inside them. You can view the arrays inside the outer braces as “records.”
    You can view the elements within these record arrays as “fields.” Figure 13.11
    illustrates the arrangement of the arrays that results and how two sets of index
    braces are involved when you access any given field in a record.


    # Figure 13.10


    You can store references to functions in an array.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_372_0.png)


    # Figure 13.11


    An outer container array involves two sets of indexes.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_372_1.png)'
