- pgno: 289
  md: 'a single string that would require a single call to `print()`. As it is, the
    calls to `print()` and `printf()` represent a needed refinement.


    The menu provides you with four input options. The three numerical options display
    information on metamorphic, sedimentary, and igneous rocks. The letter option
    allows you to exit. Comment #4 identifies the lines that attend to processing
    the input. A cascading selection structure provides five selection statements.
    As Chapter 11 discussed, each block of the selection structure allows you to process
    a different control expression.


    The `if` selection statement processes the “q” character. When you type this character,
    you indicate you want to quit the program. As mentioned previously, quitting the
    program involves exiting the infinite `for` loop. The last operator provides a
    vehicle to accomplish this. When the program flow reaches the `last` operator,
    it immediately reroutes the flow of the program outside the most immediate repetition
    loop. Since the program contains only one repetition loop, this means that the
    execution of the `last` operator effectively ends the program.


    Taking care of exceptional data input events also forms part of the work the selection
    structure performs. The final `elsif` statement provides a control expression
    that disallows any input that does not lie in the narrow range extending from
    1 to 3. The letter “q” falls outside this range, but you avoid preempting its
    processing by processing exceptions at the end of the selection structure rather
    than the beginning.


    > Providing “handlers” (such as the final `elsif` statement) for unexpected input
    is a basic precaution all experienced programmers take as they develop programs.
    A handler is a statement that accounts for data that falls outside the data you
    expect the user to submit to your program. It keeps the program under the programmer’s
    control and prevents it from wandering off in unanticipated directions.


    The use of a character operator (eq) to process the numerical values as character
    values makes no difference in the performance of the program. On the other hand,
    the final `elsif` statement handles the input as numbers rather than characters.
    One justification for processing exceptional input as numbers is that the numerical
    operators can at least ostensibly deal with a much larger range of values than
    the character operators. Figure 11.8 shows the error message you receive if you
    type any characters other than those specified in the menu.'
