    \ 7.12**  \nAs each element is pushed onto an array, it assumes the highest index\
    \ value.\n\n# Uses of Dynamic Arrays\n\nThe array Perl provides is known technically\
    \ as a *dynamic* array. Dynamic arrays grow automatically. In other words, you\
    \ can add items to them whenever you want, at any time during the execution of\
    \ your program. In contrast, in other programming languages, you find *static*\
    \ arrays, which are arrays that you set up once, with a fixed number of elements,\
    \ and cannot change afterward. Perl does not provide such arrays. Its arrays are\
    \ dynamic. You can add to them at any time.\n\nThe question then becomes *how*\
    \ you want to add items to your arrays. How you add items to an array changes\
    \ the array into a *container*. In simple terms, a container can be viewed as\
    \ an array that you use in a special way, as when you add items to its beginning\
    \ only or to its end only. The `push()`, `pop()`, `shift()`, and `unshift()` functions\
    \ allow you to use arrays as containers. Among the containers are such entities\
    \ as stacks, queues, lists, and vectors. Each of these containers is also known\
    \ as a *data structure*. Data structures (containers) allow you to control the\
    \ way that you add data to or remove data from an array.\n\nTwo frequently used\
    \ data structures are called *stacks* and *queues*. You can apply the `push()`\
    \ and `shift()` functions to the dynamic array Perl furnishes to transform it\
    \ into a"
