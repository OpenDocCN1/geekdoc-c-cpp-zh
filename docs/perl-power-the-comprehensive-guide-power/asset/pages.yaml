    Comment #1 in Listing04_01 shows what might be viewed as the most explicit and
    accepted approach to calling a function. This form of calling functions involves
    enclosing the arguments to the function in parentheses. The advantage of this
    form of function call is that it makes clear to the reader of your code precisely
    what you have submitted to the function as an argument. (Figure 4.2 illustrates
    the output of Listing04_01.)


    In the lines that comment #1 introduces, you also see a function within a function.
    The `uc()` function converts the contents of a string from lower- to uppercase.
    In this context, the `uc()` function also uses parentheses. You pass an argument
    to it, and when you employ the parentheses with the function, it is easy to discern
    that you are passing an argument to the `uc()` function and then, in turn, feeding
    the returned value of the `uc()` function to the `print()` function. Such an approach
    to using functions is often referred to as _cascading_ functions.


    At comment #2 in Listing04_01, you see that it is possible (as has been shown
    repeatedly in the previous chapters) that you can follow the `print()` function
    with its argument in quotes. This approach to using the `print()` function proves
    acceptable in many contexts, but in this case, if you place the `uc()` inside
    the quotes, the interpreter reads the `uc()` function as part of the text. (See
    the output in Figure 4.2.)


    In the lines comment #3 identifies, you see a form of code that programmers often
    find irritating to work with if they have little experience with Perl. Here, neither
    parentheses nor quotes appear to distinguish the functions and their arguments.
    You see only one function name, another'
