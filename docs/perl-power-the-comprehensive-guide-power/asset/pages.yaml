  md: "# Tracking Customers with a Queue\n\nA queue is a container that is analogous\
    \ to a group of people standing in line at a movie theater. The theater receptionists\
    \ sell tickets to people on the basis of their positions in the line. The first\
    \ person in the line receives a ticket first. When you arrive, you line up last\
    \ in line.\n\nAn array can work like a queue if you control it using the `push()`\
    \ and `shift()` functions. As Figure 7.16 illustrates, the `push()` function inserts\
    \ a new element into the array in an index position greater than those of existing\
    \ members. The `shift()` position extracts the element of the array that occupies\
    \ the lowest index position.\n\n**Figure 7.16**  \nThe `push()` and `shift()`\
    \ functions turn an array into a queue.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_194_0.png)\n\
    \nLike stacks, queues receive use throughout the programming world as accumulators.\
    \ Consider a situation in which a large group of people show up at a bank and\
    \ want to receive help filling out forms. The banking associates who provide this\
    \ service must prepare background material so that they can serve those whom they\
    \ counsel. Further, they wish to have the customers who arrive distributed fairly\
    \ evenly among the available service representatives. Also, the principle stands\
    \ that the first person to arrive should be the first person served. Figure 7.17\
    \ illustrates the situation.\n\nTo provide for the distribution of work among\
    \ the three service representatives and likewise to ensure that each person received\
    \ service on a first-come-first-serve basis, Listing07_10 implements a queue.\
    \ People get in line, and then the program directs them to an available service\
    \ representative. The program ensures that the service representatives receive\
    \ customers on an equally distributed basis."
  merge: -1
  img_proc: true
