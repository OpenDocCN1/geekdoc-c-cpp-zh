  md: '# # CHAPTER 5 Scalars and Formatting


    To remedy the situation, you can employ precision specifiers in addition to conversion
    specifiers

    to control the number of decimal places. Table 5.4 discusses some of the precision
    specifiers

    you can use. (Likewise, refer to Figure 5.9.)


    # ## Table 5.4 Formatting Flags for Printing


    | Flag | Discussion* |

    |---|---|

    | `%fw.dpcs` | `fw`designates the field width of the data you are displaying.
    This is an integer value. |

    | `%fw.dp cs` | `dp` designates the decimal precision you are displaying. This
    is an integer value. |

    | `-%fw.dpcs` | The minus sign (-) indicates that you want to left justify the
    content of the field you

    have created. The default is right justification (which you indicate by leaving
    the

    position blank). |

    | `+%fw.dpcs` | The plus sign (+) indicates that you want to prefix a sign to
    the value. If the value is

    negative, then you see a minus sign. If the value is positive, then you see a
    plus sign. |

    | `'' %fw.dpcs` | Use one or more blank spaces (`''`) to create blank spaces.
    If you leave a blank

    space, you see a space before positive values. |

    | `%#x.dpcs` | Use a pound sign (#) if you want to display `0x` before hexadecimal
    or `0` before octal

    values. (The expression `printf("%#x", 344335)` gives you `0x5410f`.) |

    | `0%fw.dpcs` | A zero (`0`). This pads the whole field with zeros, so if the
    field were 5 characters

    wide and right justified, then you would see `00032` for `32`. |


    *Note that `cs` designates the conversion specifiers (`s`, `f`, `i`, `d`, and
    so on) as presented in Table 5.3.


    # # Controlling Precision


    When you use the precision control flags of the `printf()` function, you combine
    the conver-

    sion specifiers with the precision flags to format both the data you are printing
    and the field in

    which the data appears. As Table 5.4 reveals, in addition to setting the width
    of the field, the

    precision flags allow you to determine the justification of the data in the field.
    If you apply a

    minus sign, you can align the data to the left. Otherwise, the data remains aligned
    to the right.

    In addition to the width and alignment, you can control the number of decimal
    places. Assigning

    decimal places involves using a period to append a number to the field specifier.
    This number

    establishes how many decimal places you want to maintain. Figure 5.9 illustrates
    the essential

    layout of the specifiers and flags.


    In Figure 5.9, you see that `printf()` function is employed to create three columns.
    The three

