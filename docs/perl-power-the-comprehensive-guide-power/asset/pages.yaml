  md: "# Substituting\n\nThe substitution function allows you to replace a given expression\
    \ with another expression. The most elementary approach to using the substitution\
    \ function involves substituting one word for another. The basic substitution\
    \ function replaces the first occurrence of a term you identify. As the example\
    \ in Listing15_02 shows, you name the expression you want to replace in the first\
    \ part of the expression. You name the replacement term in the second. Here is\
    \ the example:\n\n```\n```perl\n#Listing15_02\n$TestStringA = \"Say hello to the\
    \ world.\";\n$ResultString = $TestStringA;\n$ResultString =~ s/hello/your greetings/;\n\
    print(\"Result: $ResultString $NL\");\n```\n```\n\nThe output appears as follows:\n\
    \n```\n```text\nResult: Say your greetings to the world.\n```\n```\n\nYou can\
    \ use the substitution statement as you traverse a string with a repetition control\
    \ statement. As Example 2 in Listing15_02 shows, you can employ a repetition statement\
    \ to traverse a string and sequentially alter words in the string.\n\n```\n```perl\n\
    $ResultString = \"Tell me about the world as a world in the world\";\n$Count =\
    \ 1;\ndo{\n        print(\"$ResultString $NL\");\n        $ResultString =~ s/world/planet/;\n\
    \        $Count++;\n}while($Count < 5);\n```\n```\n\nThe output of Example 2 shows\
    \ you how the substitution function alters a new term with each repetition of\
    \ the block:\n\n```\n```text\nTell me about the world as a world in the world\n\
    Tell me about the planet as a world in the world\nTell me about the planet as\
    \ a planet in the world\nTell me about the planet as a planet in the planet\n\
    ```\n```\n\n# Global Changes\n\nThe g (global) argument provides an alternative\
    \ to using a repetition control structure. It detects all instances of the terms\
    \ you have designated for substitution and changes them. Example 3 in Listing15_02\
    \ explores both how to use global substitution and how to obtain the number of\
    \ substitutions the function performs:"
