- pgno: 15
  md: '# # About This Book


    This book provides you with an essential view of programming with Perl. Its chapters
    are based on Perl classes the author has taught over several years and includes
    over 160 sample programs. This book is suitable for beginning and intermediate
    programmers who seek a learning and reference resource on Perl.


    # ## Who Should Read This Book


    If you are a beginner, this book provides you with a tutorial that you can work
    from as soon as you get it home. The first chapters allow you to approach Perl
    as a total beginner. Later chapters tend to fold in the lessons provided in earlier
    chapters. All chapters offer complete programs to demonstrate the topics discussed.
    You can access the source code through the book’s website (www.courseptr.com/downloads).
    The programs are ready to run, and line-by-line commentary in the programs and
    in the book allows you to understand the logic and syntax behind them.


    For intermediate programmers seeking a deeper knowledge of Perl, the discussions
    the book offers provide an easy way to become conversant in Perl. Topics are laid
    out in traditional categories that allow you to use the book purely as a reference
    source. The book provides certain advantages over other books because it offers
    programs that tell or follow stories (or use cases). At the same time, efforts
    have been made to present verbose samples that emphasize language features in
    isolation. The code contains extensive commentary, and the book covers the code
    on a line-by-line basis whenever possible and supplements the commentary in the
    code files.


    # ## The Topics


    The chapters concentrate on making programming fun. They provide a friendly programming
    context in which you can acquire a fundamental knowledge of Perl without developing
    dependencies on modules.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# # ABOUT THIS BOOK


    Chapter 2 concentrates on getting up you up and running with the Perl interpreter
    and the DzSoft Perl Editor. You acquire the editor from the DzSoft site and the
    interpreter from the ActiveState site. No cost is involved unless you want to
    pay the nominal registration fees or buy the software. Installation requires less
    than half an hour. You can go right to work from there. It is assumed that you
    are working on a PC and that your PC is networked.


    Chapters 3 and 4 focus on using the scalar data type and the functions associated
    with it. A variety of programs are included that enable you to experiment with
    the syntax. Work is divided between text and numbers.


    Chapter 5 investigates formatting and data display. By exploring different printing
    functions Perl makes available to you, you acquire a strong sense of how simple
    tools provide many options.


    Chapter 6 focuses specifically on Perl arrays and the functions associated with
    them. Chapter 7 takes the discussion of arrays into the context of data containers.
    The topics covered include making use of Perl arrays to create stacks and queues.


    Chapter 8 investigates the use of hashes and functions associated with hashes.
    Working from the fundamentals of using hashes into more advanced topics, Chapter
    9 concerns developing applications that incorporate hashes.


    In Chapter 10, you explore sequence and selection statements as they relate to
    Perl. In addition to investigating the basic statements, you see their many applications
    and are able to draw from the sample programs a sense of how Perl furnishes you
    control mechanisms that are easy and flexible to use.


    Chapter 11 further expands on the topics Chapter 10 covers, allowing you to explore
    the use of repetition controls in a number of contexts.


    Chapter 12 concentrates on the behaviors of functions in Perl. You work extensively
    with the use of the argument array and passing arguments to functions and returning
    values.


    In Chapter 13, you examine how to enhance your options in the use of functions
    by passing arguments as references. In this way, you can pass several arrays or
    hashes simultaneously and combine into reference structures any combination of
    data you choose. You likewise explore the use of references to functions.


    Chapter 14 focuses on file IO. In addition to learning about handles and the functions
    associated with IO processes, you put to work the knowledge acquired in previous
    chapters to create data structures for reading, writing, and presenting data.


    xvi


    TEAM LinG'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Chapter 15 offers you a view of the use of regular expressions in Perl. You
    investigate matching

    expressions, substitution expressions, and translations. The chapter provides
    a multitude of ex-

    amples that you can work with as you further your knowledge of regular expressions.


    # # The Programs That Accompany This Book


    You must install the Perl interpreter before you can work with the programs this
    book includes.

    Flip to Chapter 2 and follow the instructions. You’ll be up and running in half
    an hour, more or

    less. I suggest that you install the DzSoft Perl Editor, also, but if you use
    another editor, that’s fine.


    # # Obtaining the Code for the Book


    It is important to have on hand the source code for the book if you want to fully
    benefit

    from the discussion the book offers of Perl programming. To obtain the code, access

    www.courseptr.com/downloads and enter the title of the book.


    # # Identifying Files


    Copy the programs that accompany this book from the www.courseptr.com/downloads
    site to

    the hard drive of your computer. You’ll find them in chapter folders. They are
    all named in a

    standard way:


    ```

    ListingNN_nn.pl

    ```


    Within a file and the book, you see:


    ```

    #ListingNN_nn

    ```


    NN refers to the chapter, and nn refers to position of the program in a chapter.
    So Listing12_03

    is the third program in Chapter 12. In most cases, you can click on the file in
    Windows to see it

    execute.


    # # Comments


    Within the program, I do not use line numbers to talk about the code. You probably
    know this

    story. You write a program and pass it around. People do this and that with the
    program when

    you are not looking, and before you know it, your line 38 is their line 45, and
    you tell them to

    do something that messes up their code.


    For this reason, you’ll see numbered comments in each file. There are never more
    than seven

    per program. They always take the following form:


    ```

    #1 This is a comment

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # ABOUT THIS BOOK


    In the explanations the text provides, the commentary refers you to the comment:
    “At comment #1 in Listing09_04, you . . .”


    The book includes over 160 programs available through the website. They are programs
    that my students liked when they took classes from me on Perl, so I’m assuming
    you’ll enjoy them, too. They are all intended to provoke you into finding better,
    more interesting ways of doing things.


    # # The Flash Phenomenon


    After installing the Perl interpreter, you should be able to click on the programs
    in Windows and see them execute. If it so happens that you encounter a program
    that flashes and disappears, there’s probably nothing wrong with it (not to start
    with, anyway). The problem is that it executes too quickly. You need to pause
    the program.


    Your options are along the following lines:


    +   * Install the DzSoft Perl Editor, open the file, and then press Shift + F9.


    +   * Open the DOS window and drag and drop the file from Windows Explorer into
    the DOS window. Press Enter and watch the file execute.


    +   * Or do a little preliminary programming. To follow this route, open the flashing
    file in Notepad and insert one of the following lines at the end of the file:


    ```

    <STDIN>;

    system(''pause'');

    $AnyChar = <STDIN>;

    <>

    ```


    Just one is enough. Save and close the file. Then click on it in Windows Explorer.


    In most cases, you find a diamond operator at the end of the file (<>). If the
    file flashes, open it in your editor and check to verify that the operator is
    at the end of the file. If it’s not there, put it in.


    I have made a strong effort to place a diamond operator at the end of every file,
    but ... well, you get the point.


    To get the most out of the experience, install the DzSoft Perl Editor. Chapter
    2 provides you with all the information you need in this respect.


    # # Armchair Programming


    As an inveterate armchair programmer, I have tried to set up the chapters so that
    three things happen:'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   * Each program is introduced in a way that gives you a story about what
    it does and what you can learn if you study it.

    +   * You find the complete program with many notes. Each program provides numbered
    commentaries.

    +   * In the passages following each program, you find line-by-line explanations
    of the programs, together with screenshots that show you the program’s output.


    Before you settle into a routine, take a minute to skim one of the chapters to
    see how this approach works. It is somewhat literary in nature, but I have used
    it over the years and have read plenty of books that employ the same approach.
    The difference is that you find a short introduction preceding the program, the
    program, and then a long explication or discussion following the program (along
    with the snapshots of the output). Then, if that’s not enough, you see what it
    looks like when it executes.


    # ## And Thanks


    By the way, thanks for having an interest in Perl and picking up this book. I
    wish you the best with your efforts to learn Perl.'
  merge: -1
  img_proc: true
