  md: "# Infinite for Loops with Controls\n\nInfinite loops allow programs to continue\
    \ operating until you issue an instruction that breaks the looping activity. To\
    \ break out of a loop, as discussed previously, you can use the `last` operator.\
    \ Listing11_03 provides an example of an application that performs its work inside\
    \ an infinite `for` loop. As the loop executes, it repeatedly encounters a temporary\
    \ halting point. This is a handle. The handle pauses the program until you enter\
    \ a number or letter to tell a selection structure embedded in the loop what you\
    \ want to do next. Figure 11.5 illustrates the opening view of the program. The\
    \ program provides information about igneous, metamorphic, and sedimentary rocks.\
    \ When you enter a number, you select a body of information.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_282_0.png)\n\
    \n**Figure 11.5**  \nWhen the program displays the menu, type a number to view\
    \ data of a given type of rock.\n\nFigure 11.6 (following Listing11_03) shows\
    \ you the information you can retrieve for sedimentary rocks. Obviously, in a\
    \ world in which you can set up webpages or use windows and any number of other\
    \ tools to create applications that retrieve and display data, the geological\
    \ data program Listing11_03 presents leaves much to be desired. Still, it serves\
    \ to show you one use of an infinite loop, the `last` operator, and a cascading\
    \ selection structure. Even the most sophisticated Windows applications in the\
    \ end use this same type of control.\n\n```\n```perl\n#Listing11_03\n#1 Block\
    \ for the opening\nsystem('cls');\n$NL = \"\\n\" ;\n\n($RockType[0] = <<ROCKS);\n\
    ```\n```"
