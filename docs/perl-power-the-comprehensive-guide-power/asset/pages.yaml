- pgno: 360
  md: "# # Accessing Items in References to Arrays\n\nTo access values in referenced\
    \ arrays, you can use two approaches. One approach involves\ndereferencing the\
    \ array. In this instance, you apply the dereference operator (@) and then access\n\
    items in the array just as though you were dealing with a standard array. The\
    \ other approach\ninvolves using the pointer operator (->). When you use the pointer\
    \ operator, you do not deref-\nerence the array. Instead, you access the item\
    \ from the reference itself. If the item you are seeking\nis not a reference,\
    \ then it appears in a non-referenced form. Listing13_05 explores using both\n\
    dereferencing an array to retrieve items in it and accessing values directly from\
    \ an array\nreference.\n\n```\n#Listing13_05\n#Accessing items in arrays\n#1 Define\
    \ an array\n@Vegetables = (\"Green beans\", \"Broccoli\", \"Brussels sprouts\"\
    );\n\n#2 Define reference\n$RefToVegetables = \\@Vegetables;\n$Size = scalar(@$RefToVegetables);\n\
    \nmakeTableHeading(\"Vegetables\", \"1. Dereferenced Array \\@\\$\", \"\");\n\
    #3. using Dereference\nforeach $Item (@$RefToVegetables){\n\tprintf(\" %10s \"\
    , $Item);\n}\n\nmakeTableHeading(\"Vegetables\", \"2. Dereferenced Index []\"\
    , \"\");\n#4. Dereference\n$Count = 0;\nwhile($Count < $Size){\n\tprintf(\" %10s\
    \ \", @$RefToVegetables[$Count++]);\n}\n\nmakeTableHeading(\"Vegetables\", \"\
    3. Pointer Operator ->\", \"\");\n#5 Pointer Operator\n$Count = 0;\nwhile($Count\
    \ < $Size){\n\tprintf(\" %10s \", $RefToVegetables->[$Count++]);\n}\n```"
  merge: -1
  img_proc: true
