- pgno: 247
  md: '# 10 **Control Structures**


    This chapter provides an introduction to conditional statements. In this chapter,
    you concentrate on sequence and selection statements. Sequence, repetition, and
    selection characterize the actions that all programs perform. When a program performs
    actions sequentially, it executes one statement after another. Sequential execution
    of programs can become somewhat involved if you introduce such items as goto operators,
    arrays, and incremental operators. When a program performs actions governed by
    selection, it uses control expressions to determine whether one or more alternate
    courses of action might be introduced into the flow of the program. Among the
    sequential control statements are if, unless, if...else, and if...elsif...else
    statements. To make effective use of selection (and repetition) control statements,
    you employ relational and Boolean operators. You frequently use these two types
    of operators to create involved control expressions. This chapter provides discussion
    of the following topics:


    +   - The basics of statements and compound statements

    +   - Blocks and control blocks

    +   - Sequence, selection, and repetition as programming fundamentals

    +   - Relational and Boolean operators as they apply to control expressions

    +   - Sequential use (or abuse) of goto, arrays, parentheses, and incremental
    operators

    +   - Selection using if, unless, if...else, and if...elsif...else statements


    # Expressions and Statements


    To review a few items, a declaration involves typing an identifier and associating
    it with a type of data. In Perl, you work primarily with scalars ($), array (@),
    and hash (%) data types. When you declare an identifier in Perl, you usually assign
    data to it. You define or initialize the identifier upon first use.'
