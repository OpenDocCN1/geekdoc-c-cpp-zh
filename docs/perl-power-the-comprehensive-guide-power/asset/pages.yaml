    # Winning with 12


    At comment #5 in Listing11_11, you deal with winners. Winning brings a humble
    accolade, nothing more. You allow the player the option of continuing to play
    or to exit. The player presses Enter to continue or types “q” to quit. You assign
    the result of the action to $ControlChar and then use the lc() and chomp() functions
    to eliminate the return from the input and to reduce the input to lowercase characters
    if necessary.


    If the player has entered “q,” you provide an if selection statement that calls
    the last operator. The last operator causes the flow of the program to skip out
    of the while loop, so the game ends.


    If the player presses Enter (or any character other than the “q” key), then you
    reset the value of $Score, call the system() function to clear the screen, and
    execute the next operator to cause the flow of the program to return to the top
    of the while loop.


    As a final point, at comment #6 you see a Perl function (subroutine). Its name
    is enterData, and since it is a function, in this book it is identified as enterData().
