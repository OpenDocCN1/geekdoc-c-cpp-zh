    # Searching for Numbers


    You can search a term for a digit by using a range. When you create a range, you
    use two numbers to designate the range. You place a dash between them to indicate
    that you are establishing a range. In Example 5 in Listing15_06, you create an
    expression that establishes a range from 0 to 9.


    ```

    print "Topic0 matched $NL"if ("topic0" =~ m/[0-9]/);

    print "Topic7 matched $NL"if ("topic7" =~ m/[0-9]/);

    print "Topic8 matched $NL"if ("topic8" =~ m/[0-9]/);

    print "Topic08 matched $NL"if ("topic08" =~ m/0[1-9]/);

    ```


    In the last example, the 0 precedes the brackets, so the search renders true only
    if a 0 precedes the digit searched for. Here is the output of Example 5 in Listing15_06:


    ```

    Topic0 matched

    Topic7 matched

    Topic8 matched

    Topic08 matched

    ```


    # Using the Caret for Negation


    The caret (^) operator in class ranges has a special meaning. It works to negate
    the letter that immediately follows it. For example, ^c means “not c.” Example
    6 in Listing15_06 traverses an array and searches for any word that does not begin
    with a c.


    ```

    @ThreeLetters = qw(mat cat bet sat rat fat net);

    foreach $Word (@ThreeLetters){

    print "Matched $Word \n"if ($Word =~ m/[^c]at/);

    }

    ```


    The expression matches all the terms that end in at except cat. Here is the output
    of Example 6 in Listing15_06:


    ```

    Matched mat

    Matched sat

    Matched rat

    Matched fat

    ```'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# Excluding a Range of Characters


    As a variation on Example 6, assume that the search involves excluding a *range*
    of characters. The caret can be used to accomplish this operation. In Example
    7 in Listing15_06, the match iterates through an array and excludes items that
    include numbers in the range from 2 to 4.


    ```

    ```perl

    @NumWords = qw(rat1 rat2 rat3 rat4 rat5);

    foreach $Word (@NumWords){

    print "Match $Word found\n" if ($Word =~ m/rat[^2-4]/);

    }

    ```

    ```


    Here is the output of Example 7 in Listing15_06:


    ```

    ```text

    Match rat1 found

    Match rat4 found

    Match rat5 found

    ```

    ```


    # Special Characters and Other Operations


    You can employ a number of special characters to increase the power of regular
    expressions. Table 15.2 lists several of these characters. The sections that follow
    provide a few examples of their use.


    **Table 15.2  Special Characters**


    | Character | Discussion |

    |---|---|

    | `\d` | This matches any digit. |

    | `\D` | This matches any character that is not a digit. |

    | `\w` | This matches a character of a word. |

    | `\W` | This matches any non-word character. |

    | `\s` | Any white space character – `\t` `\n` `\f` `\r` (space, tab, return,
    feed, return). |

    | `\S` | Any non-white space character. |

    | `.` | The period matches any character except a newline (`\n`). |

    | `\n` | A newline character. |

    | `\t` | A tab character. |

    | `\z` | Matches at the end of a string. |


    # Matching Digits


    You can use the special character `\d` to match a digit. In the example that follows,
    a match occurs for any string that contains any digit. In other words, the match
    involves the evaluation of all the characters in the string.'
