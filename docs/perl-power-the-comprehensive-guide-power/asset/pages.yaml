  md: '# CHAPTER 3 Scalars and Strings


    scalar, you store it as an interpolated string or as a literal string. An interpolated
    string allows

    you to place variables in the string and retrieve values from the variables. A
    literal string makes

    it so that you see exactly what you include in the string, regardless of how you
    use it.

    When you store a number, such as 2 or 2.2 in a scalar, the value 2 is known as
    an integer, a

    whole number. The value 2.2 is known as a rational or real number or floating
    decimal. With

    Perl you can assign interpolated strings, literal strings, integers, and floating
    decimals to scalars.


    # Making Scalars


    Consider the scalars that Figure 3.9 illustrates. The name of each scalar consists
    of a word known

    as an identifier combined with a dollar sign ($) that precedes each identifier.
    The dollar sign

    itself is called a type identifier. When you prefix the type identifier to the
    identifier, you create

    a scalar identifier (sometimes called a scalar variable).

    An equals sign (=) then follows each scalar variable. The equal sign is know as
    an assignment

    operator. The assignment operator assigns a single value to each of the scalar
    variables. When

    the assignment operator assigns the value on its right side to the scalar on its
    left side, it converts

    the value so that the scalar knows how to store it.


