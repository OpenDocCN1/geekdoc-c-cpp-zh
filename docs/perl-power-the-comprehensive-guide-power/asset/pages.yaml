    # Conclusion


    In this chapter you have worked through several functions that allow you to view
    how the array can be used as a data container. Beginning with the `reverse()`
    and `sort()` functions, you explored the extent to which the elements in an array
    can be manipulated as a complete set.


    Given a start with reversing and sorting arrays, you then moved on to examine
    how the `split()` function allows you to easily break the contents of strings
    into array elements. Along the same lines, you also dealt with the `join()` function,
    which you viewed in an earlier chapter in relation to string manipulations. In
    this chapter, the `join()` function allowed you to merge the contents of several
    arrays.


    The step beyond merging arrays involved a set of four functions that allow you
    to make the array into a data container. These four functions consist of the `shift()`,
    `unshift()`, `push()`, and `pop()` functions. By using these functions with arrays
    in different ways, you can transform arrays into such data containers as stacks
    and queues. The uses of such data containers prove endless. In this chapter, you
