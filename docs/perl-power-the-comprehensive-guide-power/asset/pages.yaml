- pgno: 364
  md: '# # Passing Hash References to a Function


    When you submit hash references as arguments to a function, each reference becomes
    an item in the function’s argument array. To retrieve a hash from the array, you
    retrieve the reference to the hash from the argument array and then access the
    key-value pairs in the hash either by dereferencing the hash or by using the pointer
    operator to retrieve the items it contains. Listing13_07 makes use of both dereferencing
    and the pointer operator to process the key-value pairs of three hashes passed
    to a function. The hashes contain information on food groups.


    ```

    ```perl

    #Listing13_07

    #Pass Hashes to a Function

    #1 Define hashes

    %Cereals = ("Bran Buds" , 110, "Raisin Bran" , 150);

    %Fruits = ("Apple" , 80, "Apricot", 50);

    %CookedLegumes = ("Kidney beans" , 110, "Lima beans" , 95);

    #Create references for the hashes

    $RefToCereals = \%Cereals;

    $RefToFruits = \%Fruits;

    $RefToCookedLegumes = \%CookedLegumes;

    makeTableHeading("Food Name", "Calories per Serving");

    #2 Use the references to the hashes as arguments to a function

    showData($RefToCereals, $RefToFruits, $RefToCookedLegumes );

    ```

    ```


    # ## Figure 13.7


    You can use different approaches to dereferencing hashes and accessing the information
    they contain.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_364_0.png)'
