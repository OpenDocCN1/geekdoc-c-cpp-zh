    \n> **Figure 7.2**\n> The `sort()` function gives capitalized alphabetical precedence\
    \ over words that are not capitalized.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_176_0.png)\n\
    \nYou can achieve consistency in your sorting procedures if you first iterate\
