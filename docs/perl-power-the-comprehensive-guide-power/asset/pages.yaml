- pgno: 317
  md: '# # 12 Functions


    This chapter provides discussion of how to create and use functions. You first
    investigate the fundamental properties of functions, such as returned values,
    arguments to functions, the `sub` keyword, and function blocks. These elements
    in place, you then turn to creating functions with no return values and no arguments.
    From this starting point, you explore functions that accept scalar values as arguments
    and likewise return scalar values. Next, you turn to functions that involve arrays
    and hashes. You explore how you can use function arguments to convert hashes into
    arrays and then retrieve the hashes through operations you establish in the block
    scope of the function. Contextualization allows you to make use of the returned
    values of functions. As for returning values, you can do so both explicitly and
    implicitly. Explicit return of values involves using the `return` keyword. Among
    the central topics of this chapter:


    +   * Functions as vehicles for simplifying programs

    +   * The elements involved in defining functions

    +   * Creating functions with scalar arguments and return values

    +   * Creating functions with array arguments and return values

    +   * Creating functions that use hashes

    +   * Different approaches to process return values


    # ## Abstraction and Functional Decomposition


