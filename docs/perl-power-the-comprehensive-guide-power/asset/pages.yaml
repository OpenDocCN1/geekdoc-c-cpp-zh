  md: "# Accessing Elements in Arrays\n\nYou can access individual elements in an\
    \ array using the `for` and `foreach` statements, and you can then make use of\
    \ functions associated with scalars to make decisions about and effect transformations\
    \ of the elements in the arrays. Listing06_04 creates arrays of the names of nations\
    \ and concatenate the lists into a master array. It then selects elements for\
    \ a final list on the basis of the second letter in their spelling.\n\n```\n```perl\n\
    #Listing06_04\n#1 Initialize two lists\n@NationArrayB = (@NationArrayB, \"Bangladesh\"\
    );\n@NationArrayB = (@NationArrayB, \"Barbados\");\n@NationArrayB = (@NationArrayB,\
    \ \"Belarus\");\n@NationArrayB = (@NationArrayB, \"Belgium\", \"Belize\", \"Benin\"\
    );\nprint \"\\n A: @NationArrayB\";\n\n@NationArrayL = (@NationArrayL, \"Laos\"\
    , \"Latvia\",\n                         \"Lebanon\", \"Lesotho\",\n          \
    \               \"Liberia\" , \"Libya\");\nprint \"\\n B: @NationArrayL\";\n\n\
    #2 Concatenate the two nation lists\n@NationArrayAll = (@NationArrayB, @NationArrayL);\n\
    \n# 3 Show the second letter in each nation's name\nprint \"\\n Nations from the\
    \ \\'L\\' list with second e\\'s\\n \";\nforeach $Nation (@NationArrayAll){\n\
    \        $Letter = substr($Nation, 1, 1);\n                print \"$Letter \"\
    ;\n}\n\n# 4 Create a list of nation names with \\'e\\' as the second character\n\
    print \"\\n Take L\\'s with second e\\'s and move them to the E list: \\n\";\n\
    foreach $Nation (@NationArrayAll){\n        $Letter = substr($Nation, 1, 1); #Get\
    \ the letter at index 1\n        #Select on the basis of the letter\n        if(\"\
    e\" eq $Letter){                 #if the second letter is \\'e\\'\n          \
    \      print \"\\n $Letter\";\n```\n```"
