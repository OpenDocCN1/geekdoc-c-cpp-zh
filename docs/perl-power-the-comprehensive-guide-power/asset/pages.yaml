    # ## Figure 7.4


    You can retrieve elements from arrays and join them into a string.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_180_0.png)


    # # Extracting Elements from the Front of an Array


    The `shift()` function removes elements from the beginning of the arrays. To understand
    how this works, consider Figure 7.5. When you create an array using, for example,
    the `list()` function, the first element you assign to the array is associated
    with the index position of 0. The second element you assign to the array is associated
    with the index position of 1. The array continues to grow in this way as you add
    elements. When you employ the `shift()` function, you automatically remove the
    element associated with the lowest index. At the same time, as you remove the
    element using the `shift()` function, all the elements in the array are shifted
    toward the front (or zero index) of the array.


    # ## Figure 7.5


    `shift()` removes the first element of the array.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_180_1.png)


    Listing07_05 explores the basic operations of the `shift()` function.


    ```

    ```

