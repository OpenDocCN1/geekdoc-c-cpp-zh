    into play in your

    efforts to learn Perl:


    +   * The practice of imposing strict requirements for data definitions, which
    force you to

    +   broaden your vocabulary by learning that personal pronouns like “my” and “our”
    lead

    +   hidden lives.


    +   * Discovery of thousands of functions and an armada of modules that you can
