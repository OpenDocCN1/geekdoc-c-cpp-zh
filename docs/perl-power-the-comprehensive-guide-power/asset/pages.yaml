- pgno: 199
  md: '# # 8 Hashes


    This chapter introduces you to hashes. Hashes consist of containers that hold
    key-value pairs. When you work with hashes, you associate a unique key with a
    value. The keys in any given hash must be unique, but the values need not be.
    When you add a duplicate key to a hash, the hash automatically replaces the old
    key with the new. Many basic functions allow you to work with hashes. Some of
    these are familiar if you have worked with Perl arrays. Others are new. Among
    those familiar from working with arrays are the `shift()` and `pop()` functions.
    Among those new with hashes are the `keys()`, `values()`, and `each()` functions.
    The programs and activities presented in this chapter include the following:


    +   - Approaches to defining hashes

    +   - Implicit and scalar forms of hashes

    +   - Keys and values in hashes and how to access them as arrays

    +   - How to access both keys and values using the `each()` function

    +   - Building tables to display the contents of hashes

    +   - Fetching values from hashes in specific orders


    # ## Basics of Hashes


    A hash resembles an array, but rather than storing items in association with a
    set of indexes, it stores items in *key-value pairs*. Hashes are sometimes called
    *associative containers*. As Figure 8.1 reveals, a container provides a way that
    you can collect data into a single group. Hashes and arrays are containers that
    work according to different logics of organization. The array that Perl provides
    is a dynamic array that stores its items one after another, on a logic based on
    the value of its indexes, from zero to whatever constitutes the largest index
    in the array. It is referred to as a *sequential container*.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# ## Figure 8.1 A hash is an associative container.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_200_0.png)


    A hash constitutes an associative container because it does not necessarily store
    the elements it contains using a logic based on the sequence of the indexes. Instead,
    you access the elements in a hash according to an order that the content of the
    elements establishes. The order the content establishes creates a situation in
    which association among the elements, rather than sequence, characterizes the
    logic that characterizes the container.


    The elements in a hash can be said to be organized according to hashed keys. When
    you place a key in a hash, as Figure 8.1 indicates, you see a recognizable word.
    However, when you insert this word into the hash, the hash transforms (or hashes)
    it to make it so that it can serve, in essence, as a kind of encrypted index.
    This index might be placed in the container in any number of positions. An algorithm
    embedded in the programming behind the container determines this position. Given
    an effective design of the algorithm, when you search a hash for a given key,
    the hash retrieves the item more quickly than it could using a sequential search
    (which is the approach often employed with arrays).


    Each key serves as a hashed index to a value. Perl hashes provide unique keys.
    When a hash provides unique keys, if it finds that you are inserting a key that
    the hash already contains, it replaces the old key with the new one. In Figure
    8.2, when you insert the second and third elements with the key of `Alkali`, the
    third key displaces the first two, and when you examine the contents of the hash
    afterward, you find only the third entry, which in this case is associated'
  merge: -1
  img_proc: true
