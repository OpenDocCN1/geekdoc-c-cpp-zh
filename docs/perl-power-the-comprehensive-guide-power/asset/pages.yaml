- pgno: 77
  md: '# Conclusion


    In this chapter, you have explored how to use scalar variables. The focus of your
    work has been scalar variables with relation to interpolated and character strings.
    Although scalar values in Perl involve both numbers and strings, many programmers
    view Perl as a language that is ideal for processing text. Your work with strings
    in this chapter is a concession to this viewpoint.


    The strings you work with encompass interpolated and character strings. You create
    interpolated strings using double quotation marks. An interpolated string allows
    you to extract the value from a variable when you create or display the string.
    You create character strings using single quotation marks. A character string
    preserves everything you include in it exactly as you have typed it, including
    the names of variables. It does not allow you to extract the value from a variable
    as you create it.


    To work with strings, you examined uses of the `print()` function. The `print()`
    function provides a primary tool for learning how to program. It allows you to
    write output to a selected device.


    In addition to the `print()` function and strings, you explored escape sequences,
    which provide ways of performing such actions as forcing line returns and inserting
    special characters, such as dollar signs. After examining escape sequences, you
    experimented with string concatenation. Concatenation allows you to combine the
    text stored in variables or to deal with literal text and assign it to variables.


    Beyond concatenation, you dealt with operators that apply specifically to strings.
    To explore how operators work, you briefly experimented with simple selection
    statements. Given the grounding you gained from selection statements, you were
    able to examine such operators as the eq, gt, lt, and ne operators. All of these
    are binary operators. You also examined a single unary operator, the increment
    operator. This allows you to increase the alphabetical value of a letter at the
    end of a string. As a final sally in this chapter, you explored the q() and qq()
    functions and the use of labeled text blocks. Work with these functions sets the
    stage for the next chapter, which extensively investigates the use of functions
    relating to strings.'
