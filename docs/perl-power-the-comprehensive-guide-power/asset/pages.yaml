    # # Perl Scalars, Arrays, Hashes, Handles


    The heading of this section summarizes everything. That’s what this book is about.
    You might add a few other terms on such things as data structures, references,
    file IO, and programming methodologies. But if you get these four terms, you have
    the essence.


    Perl is sometimes called a _contextually typed language_. This means, in essence,
    that when you define and use a given identifier, the meaning of the identifier
    depends on how you use it. (In one respect, you might say that programming in
    Perl is a lot like life in general.)


    As a contextually typed language, Perl differs from languages like C, C++, or
    Java. When you program using those languages, how you define an identifier to
    a great extent determines the contexts in which you can use it.


    To repeat the topic heading, Perl has four types of variables (or as you’ll read
    most often in this book, _identifiers_): scalars, arrays, hashes, and handles.
    You initially designate these type identifiers using type specifiers. The specifiers
    are as follows:


    +   * **Dollar sign.** Put your money where you scalar is. Example: $ScalarName

    +   * **Business “at” sign.** Perl offers you an array of names, just like the
    Internet. Example: @ArrayName

    +   * **Percent sign.** Example: %HashName

    +   * **The diamond operator.** Handle identifiers are often capitalized. Example:
    <STDIN>


    Scalars, arrays, hashes, and handles each afford you a set of functions that allow
    you to perform your work. Likewise, you find that certain control statements,
    such as `foreach` and `each`, allow you to work readily with one type of data
    rather than another.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'References are also an important part of basic Perl, as are regular expressions.
    Using references, you can extend the powers of arrays and hashes in enormous ways.
    You can also create arrays of functions.


    As for regular expressions (regexes), this book includes a chapter on them because
    Perl allows you to readily use them in the contexts provided by common programming
    problems. If you use them, you can accomplish more than you would otherwise using
    far fewer lines of code. One chapter on regexes is in many ways an unfair treatment
    of the topic, for regexes form an enormous asset for programmers throughout the
    programming and system administration communities. Likewise, what you learn using
    regexes in Perl carries over to work in other languages, for in general, the form
    and use of such expressions tend to be uniform across many languages. With Perl
    you enjoy the advantage of being able to join regular expressions with a flexible
    programming language that enables you to use them in a number of sophisticated
    ways.


    # Source Books


    There are many books that are always good to have around if you find that you
    like Perl. Here is a short list:


    Christiansen, Tom and Torkington, Nathan. *Perl Cookbook*. Cambridge: O’Reilly
    & Associates, 1998.


    Deitel, H. M., Deitel, P. J., Nieto, T. R., McPhie, D. C. *Perl, How to Program*.
    Upper Saddle River, N.J.: Prentice-Hall, 2001.


    Schwartz, Randal L., and Christiansen, Tom. Foreword by Larry Wall. *Learning
    Perl*. Cambridge: O’Reilly & Associates, 1997.


    Wall, Larry, Schwartz, Randal L., Christiansen, Tom. *Programming Perl*. Cambridge:
    O’Reilly & Associates, 1996.'
