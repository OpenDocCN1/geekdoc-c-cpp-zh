- pgno: 275
  md: '# # Control Structures and Applications


    Chapter 10 introduced compound statements and selection control statements. In
    this chapter,

    you continue to explore control statements as they apply to repetition in programming.
    Repetition

    is the third primary form in which the flow of a program can be controlled. Perl
    provides some

    forms of repetition that can be applied to almost any situation. Among these are
    for, while,

    until, do..while, and do..until. Other control statements work especially well
    with ar-

    rays. The chief among these is the foreach control statement. The each control
    statement

    provides a ready way to access keys and elements in a hash. A number of Perl operators
    sup-

    plement repetition and other control activities. Among these operators are next,
    last,

    redo, and continue. In addition to standard programming controls statements, Perl
    also

    provides block tags and the controls you can apply to them. In relation to these
    and other con-

    cerns, the topics this chapter explores are as follows:


    +   - Basic uses of the for control statement

    +   - Basic uses of the while control statement

    +   - Using infinite loops with routines that break out of the loop

    +   - Using control expressions and the ends of control blocks

    +   - Creating blocks and relating them to sequential selection

    +   - Creating applications that allow you to explore control


    # ## Flow as Repetition


    Repetition characterizes the flow of a program that at some point repeatedly executes
    a given

    statement or compound statement. Figure 11.1 illustrates the simplest type of
    repetition control

    statement. The statement involves a single block or loop of statements (bounded
    by curly braces).

    The control statement precedes the loop and includes an expression that is evaluated
    as the flow

    of the program enters the loop and as it iterates through the statements in the
    loop. As long as'
