    Calcium Oxide\"}      =     \"CaO\";\n```\n```\n\nAt comment #1 in Listing08_02\
    \ you first assign an interpolated string to a scalar ($TableElement). Then, in\
    \ the implicit form of initialization that follows, you insert the scalar in the\
    \ position in the list that designates the key for the first element. For the\
    \ value for the first element, you follow the correspondence operator (=>) with\
    \ an interpolated string containing a single character, H, which designates the\
    \ abbreviation for Hydrogen in the Table of Elements.\n\nAfter inserting an element\
    \ for Hydrogen, when you initialize the elements immediately following it, you\
    \ first use an interpolated string (\"Helium\") for a key and a character string"
