    ```perl\n$TestString = \" a xxx c xxxxxxxx c xxx d\";\nprint \"\\nMatched: $TestString\
    \ \\n\" if ($TestString =~ m/a*c*d/);\n```\n```\n\nSince the string contains three\
    \ xs, eight xs, and then three xs, when you use the asterisk between the a and\
    \ the c and the c and the d, you make it possible for the expression to return\
    \ true. The asterisk following what is in effect the first c encompasses the second\
    \ c along with the xs. Here is the output of Example 8 in Listing15_05:\n\n```\n\
    ```text\nMatched: a xxx c xxxxxxxx c xxx d\n```\n```\n\n> Use of the wildcard\
    \ (*) can lead to problems. Use the wildcard sparingly. As a general rule, use\
    \ regular expressions as restrictively as possible, especially if you use patterns\
    \ that involve multiple lines. Regular expressions select the largest match that\
    \ they can. Consider the following string:\n> \n> ```text\n> I came. I saw. I\
    \ conquered.\n> ```\n> \n> If you use the expression `m/ I .*\\,/` and expect\
    \ to match `I came.`, you get a surprise. You get instead the whole string:\n\
    > \n> ```text\n> I came. I saw. I conquered.\n> ```\n> \n> Given the choice of\
    \ the shortest string that can match the pattern (`I came.`) and the longest (the\
    \ whole thing), the regular expression returns the largest.\n\n# The Plus Sign\
    \ (+)\n\nYou employ the plus sign following a given letter to indicate one or\
    \ more instances of the letter. The following lines match any word that begins\
    \ with any letter, has two os, and ends with a t:\n\n```\n```perl\n@WordList =\
    \ qw(moat soot root boat toot cold foot);\nprint \"\\nTest for words.\\n\";\n\
    foreach $Word (@WordList){\n    print \"\\nMatch 4: $Word\" if ($Word =~ m/[a-z]oo+t/);\n\
    }\n```\n```\n\nOnly two words fail to meet the match. Here is the output of Example\
    \ 9 in Listing15_05:\n\n```\n```text\nTest for words.\nMatch 4: soot\nMatch 4:\
    \ root\n```\n```"
