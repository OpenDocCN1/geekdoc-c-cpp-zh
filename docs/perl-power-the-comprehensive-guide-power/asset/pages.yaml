    # # The seek() and getc() Functions


    You use the `seek()` function to position a pointer in a file. The function takes
    the following form:


    ```

    ```

    Seek(file_handle, offset, [beginning | point_within | end])

    ```

    ```


    This function requires three arguments. The first argument is the file handle.
    The second argument provides the position in the file at which you want to locate
    the pointer (the offset). The third parameter proves a little more complicated
    that the first two. It allows three values. It designates what you want to assign
    as the initial position of your seek activities. The settings for the third parameter
    are as follows:


    +   * 0 indicates that you want to start at the beginning of the file.


    +   * 1 indicates that you want to start at the current position (a point within
    the file).'
