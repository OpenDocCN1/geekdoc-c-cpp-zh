    Press F9 to compile; if you meet with success, add a few more lines.


    To preserve space, in most of the code examples presented in this book, you do
    not see the bang and content-type lines. These lines remain in many of the programs
    that you download from the book’s Internet site.


    # # Fundamental Programming Syntax


    Among the most elementary items of syntax you use when programming with Perl are
    those you use to create comments, make statements, force new lines, and escape
    from regular program interpretation so that you can display special characters.
    This section reviews these items.


    # ## Comments Using #


    The pound sign (#) provides a way that you can tell the Perl interpreter to skip
    over notes you include in a program. Such notes are referred to as _comments_.
    Comments are not part of the code. Any line that begins with a pound sign is considered
    a comment.


    The interpreter reads from left to right. For this reason, if you want to make
    it so that the interpreter does not read a line of text you have included in your
    program, you type the pound sign as the first character at which you want the
    interpreter to stop reading. From that point on, until the interpreter reaches
    the end-of-line character, it does not try to interpret anything you have typed
    as Perl code. Consider the following sample of code:


    ```

    ```

    #Listing03_04

    #Comments proceeded to the end-of-line character

    #You press Enter to insert an EOL character

    print "\nListing03_04.pl works."; #Comments can follow code

    print "\nReady to add lines!";

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The first three lines of Listing03_04.pl provide standard comments. Each line
    begins with a

    pound sign. On the fourth line, beginning “Comments can ...” you see a comment
    to the right

    of the program statement. Such a comment creates no problem. The interpreter knows
    not to

    read it. If you were to reverse the position of the comment and the statement,
    however, the in-

    terpreter would immediately have a problem. You must place the comment on a separate
    line

    or, if on the same line, after your program statements. Figure 3.4 illustrates
    the output of

    Listing03_04.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_55_0.png)


    # Figure 3.4

    Comments to the left

    of code do not create

    problems.


    # How to Make a Statement


    The semicolon (;) indicates that the interpreter should read the words to the
    left of the semicolon

    as a complete unit. A complete unit is a statement. The shortest statement you
    can make in Perl

    consists of a semicolon. Consider the following sample of code:


    #Listing03_05

    print "\nListing03_05.pl works."; #Comments can follow code

    print "\nReady to add lines!";

    ;;;

    ;

    ;

    print "\nReady to add more lines!";


    The first two lines of Listing03_05 provide standard statements. For example,
    interpolated

    strings (strings within double quotation marks) follow the print() function. The
    next three

    lines provide only semicolons. On the third line, you see three semicolons in
    a row. On the

    following two lines, one semicolon occupies each line. For the final line, you
    see a standard

    statement beginning with the print() function.


    The interpreter reads the semicolons as statements even if they do nothing more
    than cause the

    interpreter to continue on the next statement. As Figure 3.5 illustrates, the
    semicolons cause no

    extra line spaces to appear in the program output.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# # CHAPTER 3 Scalars and Strings


    # ## Figure 3.5


    Semicolons alone constitute no statements but produce no visible change.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_56_0.png)


    # ## Leaving Out Semicolons


    If you delete one of the semicolons following a statement, you can create an interpreter
    error. Consider the following code sample:


    ```

    ```perl

    #Listing03_06

    #Missing semicolons result in interpreter error messages

    # To correct the problem, add a semicolon on each line

    # right after the closing quotation marks

    print "\nListing03_06.pl works."   #1 semicolon left off

    print "\nReady to add lines!"      #2 semicolon left off

    ; ; ;

    ;

    ;

    print "\nReady to add more lines!";

    ```

    ```


    The lines identified in the comments as #1 and #2 lack semicolons. When you submit
    your code to the interpreter, you might see a message along the following lines:


    ```

    ```

    syntax error at Listing03_06.pl line 8, near "print"

    Execution of Listing03_06.pl aborted due to compilation errors

    ```

    ```


    The Perl interpreter might not object every time you forget to type a semicolon.
    Consider the lines identified with the #2 comment in Listing03_06. The first semicolon
    on the following line (the line of three semicolons) replaces the missing semicolon.
    In such a situation, the interpreter does not object. However, if you leave out
    the semicolon for #1, the interpreter invariably objects.


