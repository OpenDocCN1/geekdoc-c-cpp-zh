  md: "# Sorting Array Elements\n\nYou use the `sort()` function to alphabetically\
    \ or numerically sort items. The sorting process orders the elements in your array\
    \ in ascending order. For this reason, the `sort()` function places capitalized\
    \ words before words that are not capitalized. The `sort()` function also works\
    \ with numbers. Generally, when using the `sort()` function, if you combine letters\
    \ and numbers, the results you encounter can vary. The reason for this becomes\
    \ clear in the next few programs. As a starter, the `sort()` function evaluates\
    \ words according to the ASCII values of the letters. When you sort words, then,\
    \ you can always rely on it to perform its work in good form, for ASCII values\
    \ fall between 0 and 255. When you deal with very large numbers, however, you\
    \ need to augment the `sort()` function with a supplemental operation (see the\
    \ next section). Generally, serial numbers or other such items, which consist\
    \ of alphanumeric elements, create no problem. Listing07_02 explores the `sort()`\
    \ function as applied to capitalized and lowercase versions of the names of Japanese\
    \ cities.\n\n```\n```perl\n#Listing07_02\n#1 Set up an array of Japanese cities\n\
    @CitiesJapan = (@CitiesJapan, qw(Fukui Hofu Funabashi Ngano));\n@CitiesJapan =\
    \ (@CitiesJapan, qw(\"mito\", \"chiba\", \"akita\"));\n@CitiesJapan = (@CitiesJapan,\
    \ qw(Mito Chiba Akita));\n\n$Itr = 1;\nprint \"\\n Japanese cities: \\n\";\nforeach\
    \ $City (@CitiesJapan){\n    print \"\\n  \" . $Itr++ . \". \" . $City\";\n}\n\
    #2 Reverse the elements\nprint \"\\n\\n\" . @CitiesJapan = reverse(@CitiesJapan);\n\
    print \"\\Sort elements in the array: \\n\";\n@CitiesJapan = sort(@CitiesJapan);\n\
    \n$Itr = 1;\nforeach $City (@CitiesJapan){\n    print \"\\n  \" . $Itr++ . \"\
    . \" . $City\";\n}\n```\n```\n\nAt comment #1 you employ three concatenation operations\
    \ to create a mixed array of the names of Japanese cities. Some of the names appear\
    \ without capitalization. At comment #2, you submit"
  merge: -1
  img_proc: true
