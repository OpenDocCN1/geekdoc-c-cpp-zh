- pgno: 322
  md: '# Basic Program Organization for Functions


    When you develop functions, you can use any of a number of programming techniques.
    One that many programmers favor requires that you organize your programs structurally.
    Structural organization of a program entails placing a program in a file so that
    you see calls to functions first and then the definitions of the called functions.
    Figure 12.4 illustrates the practical consequences of this type of organization.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_322_0.png)


    Organized structurally, a program hides the details involved in the definition
    of functions. When you hide details, you make it simpler to understand your code.
    You likewise make it possible to make repairs to your program without having to
    become involved in functions other than those you need to fix.


    When you define a function, you compose the lines of code that constitute the
    function. The definition of a function, then, consists of a body of code enclosed
    in curly braces and preceded by the name of the function and the appropriate keyword
    (usually sub). In a structurally organized program, as Figure 12.5 illustrates,
    you employ the top of the program for calling functions. You reserve the remainder
    of the program for the functions you have developed.


    During the development cycle of a program’s life, you can employ the top of the
    program as a development area. Using this approach, you can have a fairly clear
    view of the overall program, but as the need arises, you can “open” a functional
    space and either add to it or create new functionality.


    For more involved programs, the structural approach to development still pertains,
    but rather than placing functions in a submerged area of a single file, you move
    them to separate files. The separate files become modules or packages. Figure
    12.6 illustrates this situation.


    When you create a function, you attempt to hide complexity, making the operations
    the function contains visible to the user of the function only through the calls
    made to the function. The structural organization of the program accommodates
    both abstraction and development. It'
  merge: -1
  img_proc: true
