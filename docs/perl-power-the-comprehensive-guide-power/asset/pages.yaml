  md: "![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_179_0.png)\n\n# # Joining Elements\
    \ from an Array\n\nUsing the join() function, you can extract elements from an\
    \ array to form a string. As you know from a previous chapter, the join() function\
    \ allows you to join elements into a string. You can use it to access elements\
    \ in an array in the same way that you use it to access elements in a list enclosed\
    \ between parentheses. Listing07_04 explores some of the ways you can use the\
    \ join() function to form a scalar that includes line returns.\n\n```\n```perl\n\
    #Listing07_04\n#1 Form arrays\n@CountryArrayM = qw(Macedonia Madagascar Malawi);\n\
    @CountryArrayN = qw(Namibia Nepal Nicaragua Norway);\n@CountryArrayP = qw(Pakistan\
    \ Palau Panama);\n\n#2 Iterate through all the arrays\n$Itr = 0;\nforeach $Country\
    \ (@CountryArrayM, @CountryArrayN, @CountryArrayP) {\n    print \"\\n\" . ++($Itr)\
    \ . \". $Country\";\n}\n\n#3 Form a scalar with line returns\n$AllCountries =\
    \ join(\" \", @CountryArrayM, \"\\n\",\n                    @CountryArrayN, \"\
    \\n\",\n                    @CountryArrayP);\n\n#print the scalar\nprint \"\\\
    n\\nCountries ($Itr):\\n \".\n      $AllCountries . \"\\n\\n\";\n```\n```"
