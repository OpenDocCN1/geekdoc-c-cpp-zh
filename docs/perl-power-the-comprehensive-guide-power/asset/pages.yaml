- pgno: 74
  md: '# The q() and qq() Functions


    Although the next chapter deals extensively with functions you can apply to strings,
    two functions work in ways that closely resemble double and single quotation marks.
    These are the q() and qq() functions. The names of the functions abbreviate single
    and double quotations. In general, in fact, you can picture these functions as
    performing the work of double and single quotation marks. Instead of the quotation
    marks, however, you employ the functions.


    When you use the functions, you place whatever you want to translate into a string
    between the opening and closing parentheses that follow the names of the functions.
    Listing03_18 provides examples of basic uses of the two functions:


    ```

    #Listing03_18

    #q() and qq()

    #set up a scalar for testing in the functions

    $TestValue = "Hello";


    #q() gives you a character string, so you see what you type

    $CharacterQ = q($TestValue, it is good to see you.);

    print "\nq(): " . $CharacterQ;


    #qa() gives you an interpolated string,

    #so you have some options with embedded identifiers

    $CharacterQQ = qq($TestValue, it is good to see you.);

    print "\nqq(): " . $CharacterQQ;

    ```


    When you insert the scalar value ($TestValue) into the q() function, as Figure
    3.17 illustrates, you see only the identifier’s name, not the value the identifier
    stores. This demonstrates that the q() function creates a character string. On
    the other hand, when you insert the scalar identifier into the qq() function along
    with some text, the interpreter extracts the string from the identifier. This
    demonstrates that the qq() function creates an interpolated string.


    # Figure 3.16 The increment operator increases the value of the final letter in
    the string to which it is applied.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_74_0.png)'
