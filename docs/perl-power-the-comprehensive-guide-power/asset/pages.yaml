- pgno: 49
  md: '# Conclusion


    This chapter has helped you to acquire and install the ActivePerl interpreter
    and the DzSoft Perl Editor. Given these two items, you are now ready to develop
    Perl programs. When you work with Perl, you do not need a specific editor, of
    course. You can work with a command prompt and a generic application like Notepad.
    Using an editor designed to parse Perl makes your work much easier than it would
    be otherwise, however. The programs in this book have been developed using the
    DzSoft Perl Editor.


    Perl files have a *.pl extension, and as long as this extension is associated
    with the Perl interpreter, you can readily execute Perl files at the command line.
    When you install an editor, you should refrain from associating the Perl extension
    with your editor. Instead, associate the *.pl extension with the Perl interpreter.
    In the installation processes this chapter documents, the ActivePerl installer
    installs the Perl interpreter in the Perl directory. When you associate the *.pl
    extension with the interpreter, you can use the command prompt or the Windows
    directory to directly execute the Perl programs you create.'
  merge: -1
