  md: "# # Splitting Strings into Array Elements\n\nThe `split()` function allows\
    \ you to break a string in which the elements are in some way consistently separated\
    \ (by commas, spaces, periods, and so on) into elements of an array. To split\
    \ a string in this way, the `split()` function requires two arguments. The first\
    \ argument designates the punctuation or element to be used to segment the items\
    \ in the source string into elements. The second string consists of the scalar\
    \ string source. Listing07_03 explores the use of the `split()` function to separate\
    \ a string containing the names of the countries bordering Hungary into an array.\n\
    \n```\n#Listing07_03\n\n#1 create a string\nprint \"\\n\\nUsing split with a string\
    \ of countries bordering Hungary: \\n\";\n$HungaryBorderCountries = \"Slovakia,\
    \ Austria, Slovenia, Croatia, \" .\n    \"Yugoslavia, Romania, Ukraine\";\n\n\
    print \"\\n\\n\" . $HungaryBorderCountries;\n#2 Use the split function; break\
    \ at commas with space\nprint \"\\n\\nAfter split and sort:\";\n@BorderArray =\
    \ split(\", \", $HungaryBorderCountries);\n#3 sort after array is formed\n@BorderArray\
    \ = sort(@BorderArray);\n$Itr = 1;\nforeach $Country(@BorderArray)\n{\n    print\
    \ \"\\n\". $Itr++ . \". \". \\t$Country\";\n}\n```\n\nThe lines accompanying comment\
    \ #1 create a string that consists of the names of nations bordering Hungary.\
    \ After printing this string, you proceed with the lines trailing comment #2 to\
    \ split the string. To split the string, you designate the first argument of the\
    \ `split()` function as a comma followed by a space. For the second argument,\
    \ you supply the name of the string holding the names ($HungaryBorderCountries).\
    \ To receive the elements the `split()` function creates, you assign the returned\
    \ values of the `split()` function an array (@BorderArray).\n\nIn the lines associated\
    \ with comment #3, you employ the `sort()` function to order alphabetically the\
    \ names of the countries bordering Hungary. You then print the final alphabetical\
    \ list with numbered items. Figure 7.3 shows you the output of Listing07_03."
