  md: "# Variations on Initialization\n\nWhen you employ either the implicit form\
    \ of initialization or the scalar (lookup) form of initialization for hashes,\
    \ you can represent the data you are dealing with in a number of ways. Listing08_02\
    \ provides examples of several somewhat random approaches to data representation.\
    \ The program produces no output.\n\n```\n```perl\n#Listing08_02\n\n#1 Implicit\
    \ initialization -- variations\n\n# Scalar\n$TableElement = \"Hydrogen\";\n\n\
    # A scalar and interpolated and literal strings\n%Elements = ($TableElement =>\
    \ \"H\",\n             \"Helium\" => 'He',\n             'Manganese' => \"Mn\"\
    );\n\n#2 Initialization using the scalar\n$Elements{\"Carbon\"} = \"C\";\n$Elements{\"\
    Calcium\"} = \"Ca\";\n$Elements{Aluminum} = \"Al\";\n\n#3 Keys and values consisting\
    \ of more than one word\n#requires quotes\n$CompoundName = \"Carbon Monoxide\"\
    ;\n%Compounds = ($CompoundName       => \"CO\",\n              q(Plumbous Oxide)\
