- pgno: 54
  md: '# # CHAPTER 3 Scalars and Strings


    and then try to compile, you are likely to face a long list of errors, and you
    deprive yourself of the positive feedback an interpreter (or compiler) can provide
    when you work in an incremental, iterative way.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_54_0.png)


