    What pertains to keys, however, does not pertain to values. As Figure 8.3 illustrates,
    as long as you insert unique keys, a hash stores multiple identical values.


    | Key | Value |

    |---|---|

    | Helium | Noble Gasses |

    | Lithium | Alkali Metals |

    | Sodium | Alkali Metals |

    | Potassium | Alkali Metals |

    | Titanium | Transition Metals |

    | Boron | Metalloids |

    | Silicon | Metalloids |


