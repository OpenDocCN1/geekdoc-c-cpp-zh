  md: "# CHAPTER 8  Hashes\n\nWhen you use a hash in a scalar context, you identify\
    \ it with a dollar sign ($). Listing08_01 shows you hashes initialized in both\
    \ implicit and scalar contexts. The program produces no output.\n\n```\n```text\n\
    #Listing08_01\n\n#1 Implicit initialization using the\n# correspondence operator\
    \ (0=>)\n#Parentheses\n%Elements = (Hydrogen => H,\n             Helium => He,\n\
    \             Manganese => Mn);\n\n#Implicit initialization using a list\n%Elements\
    \ = (\"Oxygen\" , \"O\",\n             \"Nitrogen\" , \"N\",\n             \"\
    Potassium\" , \"K\");\n\n#2 Scalar initialization using\n#Curly braces\n     \
    \   # correspondence operator (0=>)\n$Elements{Carbon}=C;\n$Elements{Calcium}=C;\n\
    $Elements{Aluminum}=Al;\n```\n```\n\nAt comment #1 you first initialize a hash\
    \ using the correspondence operator. To effect such an initialization, you prefix\
    \ the percent sign to the hash identifier (%Elements). This designates an implicit\
    \ hash. You then use a list operation (parentheses enclosing the keys and values)\
    \ to designate the key-value pairs you want to assign to the hash. If you do not\
    \ use the parentheses, the initialization will still work, but only for the first\
    \ element (Hydrogen). The second form of implicit initialization using a list\
    \ involves using commas rather than the correspondence operator. This approach\
    \ works just as well as the first.\n\nThe lines associated with comment #2 allow\
    \ you to continue the work of initializing the %Elements hash using the scalar,\
    \ or lookup, form of initialization. In this case, you prefix a dollar sign to\
    \ the hash identifier ($Elements) and employ curly braces ({ }) to enclose the\
    \ key you want to designate. You then follow with an assignment operator and the\
    \ value you want to associate with the key."
  merge: -1
