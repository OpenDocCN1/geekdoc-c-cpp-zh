    finds the test false and so skips the statement inside the curly braces.


    Notice, however, Statement 4. It involves a selection statement that evaluates
    a literal and an interpreted string. As Figure 3.14 illustrates, these, too, prove
    equal. They prove equal because the interpolated string and the literal string
    represent different forms of the same data.


