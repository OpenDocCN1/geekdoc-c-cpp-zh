- pgno: 366
  md: '# # CHAPTER 13 References


    At comment #2, after calling the makeTableHeading() function and setting up two
    column headings (Food Names and Calories per Serving), you call the showData()
    function, a function that allows you to processes references to hashes to print
    the items the hashes contain. How this is accomplished becomes apparent at comment
    #3, which introduces the definition of the function.


    To process the hash references, you assign the elements from the argument array
    to a local array (@ArrayInSub). You then employ the scalar function to determine
    the number of items the array contains, and this you assign to a scalar ($NumOfHashes).
    Given that you know the number of hashes in the local array, you can create an
    embedded repetition structure. The embedded structure consists of a for repetition
    statement that traverses @ArrayInSub and a foreach repetition structure that retrieves
    the key terms in the hashes that the array contains.


    Prior to accessing the information the hashes contain, you employ the print()
    function to print the Category of the data. This amounts to the current value
    of $Itr, which serves to set the index values of $ArrayInSub as you traverse its
    elements. As Figure 13.8 shows, the category number allows you to identify the
    contents of each hash passed to showData(). To retrieve individual hash references
    from @ArrayInSub, you assign each reference to a scalar, $Ref. You then make a
    dereferenced version of this identifier ($$Ref) the argument of the hash keys()
    function. The keys() function retrieves the names of foods from the hash, and
    you submit these to the hash lookup operation in its pointer form to retrieve
    calorie information from the hash currently represented by @ArrayInSub.


    Each iteration of the for loop provides @ArrayInSub in sub with a different reference,
    so the inner foreach repetition statement traverses each array in the order in
    which the argument array for showData() transfers the arrays to @ArrayInSub. There
    is nothing spectacular in this representation of data, but it does suffice to
