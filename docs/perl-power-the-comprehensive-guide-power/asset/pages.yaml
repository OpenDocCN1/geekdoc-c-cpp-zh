  img_proc: true
- pgno: 356
  md: "# Using the ref() Function\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_356_0.png)\n\
    \n**Figure 13.3**  \nDefinition of references allows you to see the location in\
    \ memory of different identifiers.\n\nThe typelob readouts for items 2.1.2, 2.2.2,\
    \ and 2.3.2 in Figure 13.3 provide direct references. In other words, you are\
    \ directly accessing the reference itself. The direct reference results when you\
    \ use the reference operator on the identifier that holds the value. On the other\
    \ hand, the typelob readouts for items 2.1.3, 2.2.3, and 2.3.3 represent indirect\
    \ or symbolic references. The indirect reference results when you print the value\
    \ that you have assigned to a scalar.\n\nWhen you use the symbolic form of an\
    \ identifier (its name), you see the form of the identifier that gets merged into\
    \ the argument array of your function. When data is identified in this indirect\
    \ way, the interpreter sees no need to distinguish it on the address level—the\
    \ level of the reference. But, if you move to a direct approach to identifying\
    \ the data, then the interpreter can always know precisely where the data you\
    \ are dealing with begins and ends based on its location in memory. It can use\
    \ this address to preserve the identity of the data. You then submit the address\
    \ rather than the data the address points to (or references).\n\nPerl provides\
    \ a function that allows you to check the typelob status of any given reference.\
    \ In this way, you can see the reference the interpreter stores for each data\
    \ item. Also, you can see how you might make use of this form of the data as you\
    \ approach the problem of preserving groups of data as you pass them to functions.\
    \ This is the `ref()` function. Listing13_03 illustrates the basic use of the\
    \ `ref()` function. To use it, you submit the identifier you want to explore,\
    \ prefixed with the reference operator.\n\n```\n```perl\n#Listing13_03\n#1 Define\
    \ different identifiers of different types\n$ExtraVegetable = \"Cabbage\";\n@Fruits\
    \ = (\"Apple\", \"Apricot\", \"Banana\");\n%Cereals = (\"Bran Buds\", 110, \"\
    Raisin Bran\", 150);\n```\n```"
