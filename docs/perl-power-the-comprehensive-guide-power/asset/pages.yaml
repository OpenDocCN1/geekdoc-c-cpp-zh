- pgno: 319
  md: '# # Figure 12.1

    Abstraction generally allows you to view large sets of tasks in smaller sets.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_319_0.png)


    decomposition involves, among other things, asking a fairly rudimentary question:
    What is the order of the tasks to be performed? With the designation of an order
    of tasks comes the designation of dependencies. You know what you need for each
    task to be fulfilled. In Figure 12.1, for example, it makes little sense to check
    the spelling if no textual content exists.


    Abstraction serves to eliminate dependencies. It accomplishes this feat by encapsulating
    code. Encapsulation ends up being an enormous asset in most industrial situations.
    Consider this: If you set up your programs so that the different functions you
    create are not tangled up with other functions, then you can more easily change
    one thing in isolation. This is one of the major benefits of encapsulation. Programmers
    can make isolated changes. The technical terms for this are loosely coupled and
    highly cohesive. In other words, the code in a function coheres: It makes sense
    when examined in isolation. A function is also loosely coupled with other functions,
    meaning that if you make changes to one function, you do not have to make changes
    in other functions.


