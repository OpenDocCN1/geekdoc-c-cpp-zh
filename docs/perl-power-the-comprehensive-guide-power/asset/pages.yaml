    # Deleting Elements


    To delete items from a hash, Perl provides you with the `delete()` function. The
    `delete()` function requires one argument, the lookup form of the hash you are
    working with supplied with the key for the key-value pair you want to delete.
    Listing09_06 provides an interactive program you must execute from the DOS command
    line. You can either open a command prompt window or just click on the program
    in Windows Explorer. The program prompts you to supply the name of a chemical
    element (Aluminum) to be deleted from a list of chemical elements. Figure 9.6
    shows you a complete round of interaction with the program.'
