- pgno: 384
  md: '# CHAPTER 14 File IO


    participates in this activity is a special relationship it has with the operating
    system through an array known as the @ARGV array.


    # Handles


    Perl manages input and output using handles. A handle consists of paired less
    than and greater than signs (<>). You can refer to this combination of symbols
    as the diamond operator or file handle operator. If you supply a file handle identifier
    to the file handle operator, the operator establishes communication with the file
    the identifier represents. To define a file handle identifier in association with
    a file, you use the open() function.


    When you associate a file handle identifier with a file, you establish a data
    stream. A data stream allows you to write information to or receive information
    from another file.


    The file handle works within the context of your file to allow you to perform
    such actions as streaming data from your keyboard to your monitor. In previous
    chapters, you have used statements in the following form:


    ```

    print("Type something. \n >>");

    $Input = <STDIN>;

    ```


    The first line prompts the program user to type something. The second line, containing
    a handle, captures the input as entered at the keyboard and streams it to the
    $Input identifier. As a matter of convention, you identify a handle using an expression
    in capital letters.


    # Basic IO Interactions


    Three primary Perl functions allow you to negotiate activities related to IO operations.
    These are the open(), print(), and close() functions. The open() function opens
    a file for reading. One of its primary responsibilities is to associate a file
    handle you name with the name of a file. In performing this work, it opens a file
    stream. The close() function closes a file, so one of its primary responsibilities
    is to close out a stream.


    As for the middle part, you deal with a familiar function. This is the print()
    function. The only difference between how you use the print() function with files
    and how you use it with the standard activity of printing to the monitor involves
    redirecting the output of your streaming operations so that it goes not to the
    monitor but to the disk drive. To accomplish this, you use a file handle in place
    of the standard quotation marks. Figure 14.1 illustrates the different uses.


    # Basic Open, Print, and Close Activities


    To experiment a little with interactions between a program you write, the monitor,
    the keyboard, and a file, you can use a handle to collect data from the keyboard
    and stream it to an external file. Listing14_01 employs the open() function to
    open a file handle (create a stream) and associate


