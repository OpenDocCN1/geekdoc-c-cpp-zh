    \ array. If you try to print the contents of the array argument, you find\nonly\
    \ the address values representing the arrays. To access the contents of the arrays,\
    \ you must\ndereference the arrays. Listing13_08 explores passing and dereferencing\
    \ references to three\narrays that contains the names of foods in different food\
    \ groups. When the showData() func-\ntion accesses the references, it dereferences\
    \ them in reverse order.\n\n```\n```perl\n#Listing13_08\n#Pass Arrays to a function\n\
    #1 Define arrays\n@Vegetables = (\"Green beans\", \"Broccoli\", \"Brussels sprouts\"\
    );\n@Fruits = (\"Apple\", \"Apricot\", \"Banana\", \"Cantaloupe\", \"Grapefruit\"\
    );\n@Legumes =(\"Kidney beans\", \"Lima beans\", \"Navy beans\");\n$RefToVegetables\
    \ = \\@Vegetables;\n$RefToFruits = \\@Fruits;\n$RefToCookedLegumes = \\@Legumes;\n\
    #Print the heading\nmakeTableHeading(\"Food Name\", \"\");\n#2 Pass the references\
