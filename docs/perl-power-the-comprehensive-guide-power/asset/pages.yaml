  md: '# CHAPTER 6  Array Fundamentals


    This is the `scalar()` function, which can be used to obtain the number of elements
    in an array. The `scalar()` function takes as its argument the `@` form of the
    array and renders the same result that you obtain if you implicitly assign the
    `@` array identifier to a scalar. It has the advantage of making the purpose of
    the statement clearer to the reader of your code. Figure 6.9 illustrates the output
    of Listing06_08.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_164_0.png)


    # Splicing


    Splicing differs from slicing. Splicing involves taking elements from one array
    and placing them in another array. You overwrite the elements in the destination
    array.


