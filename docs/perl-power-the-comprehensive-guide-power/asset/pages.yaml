  md: '# # Anonymous Hash References as Data Containers


    You can employ anonymous references with hashes in much the same way that you
    employ them with arrays. One approach involves using the hash key as a lookup
    for an embedded array reference. When you employ this approach to accessing records,
    you can obtain a given record through what might be a unique serial or account
    number consisting of a combination of letters and numbers. As Figure 13.13 illustrates,
    to create a container that involves a combination of a hash and an array reference,
    you combine the capacity to access a hash key with a given word and the indexes
    the arrays provide.


    # ## Figure 13.13 A hash reference can contain array references.


    To create anonymous hashes, you employ curly braces. On the other hand, to create
    anonymous arrays, you use square brackets. Listing13_11 provides an example of
    using a hash to create records identified by a given food name. For each food
    name (a hash key), you create an anonymous array. The array provides information
    such as calories and fiber content. You insert the reference to the array into
    the value position of the hash and then use the each hash function to retrieve
    the key and its associated array reference.


    # ## #Listing13_11


    #1 Create an array using anonymous references -- square brackets [ ] # Embed the
    array in an anonymous reference -- hash curly braces ( )


    #{ Food } [Group Food Serving KCalories Grams of Fiber] $FoodGroupData = { # key
    value ''All Bran'', [Cereal, ''1 Cup'', ''25'', ''2.5''], ''Oatmeal'', [Cereal,
    ''1 Cup'', ''155'', ''4.0''], ''Green Beans'', [Vegetables, ''0.5 Cup'', ''15'',
    ''1.0''], ''Broccoli'', [Vegetables, ''0.5 Cup'', ''20'', ''3.0''] };'
