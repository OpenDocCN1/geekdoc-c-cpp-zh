  md: "# CHAPTER 11 — Control Structures and Applications\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_278_0.png)\n\
    \nListing11_01 demonstrates a few variations on the `for` statement. The basic\
    \ `for` statement uses three arguments separated by semicolons. Depending on the\
    \ problem you seek to solve, you can place these argument inside or outside the\
    \ parentheses. You can increment the control within the control block, for example,\
    \ or you can initialize the counter prior to the `for` statement.\n\n```\n```perl\n\
    #Listing11_01\n\n#1 Basic for repetition statement\n#Control, Limit, and Counter\n\
    \n$Example = 1;\n@Minerals = qw(Covelite Galena Stibnite\n               Molybdenite\
    \ Graphite Pyrolusite Basalt);\n\n$LIMIT = scalar(@Minerals);\n\n# 1 Set the counter\
    \ at 0 to accommodate the array\nprint \"\\n\\n Example \" . $Example++ .\n  \
    \    ': for($Itr = 0; $Itr < $LIMIT ; $Itr++)' . \"\\n \";\n\nfor($Itr = 0; $Itr\
    \ < $LIMIT ; $Itr++)\n{\n    print \"\\n \" . $Itr . \" $Minerals[$Itr].\";\n\
    }\n# 2 Increment inside the loop by increments of 2\nprint \"\\n\\n Example \"\
    \ . $Example++ .\n```\n```"
