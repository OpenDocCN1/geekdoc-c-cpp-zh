- pgno: 69
  md: "# Evaluating Relationships\n\nIn most cases, when you evaluate a relationship\
    \ between two strings, you use selection. Selection statements (also known as\
    \ selection control structures) receive extensive discussion later in this book,\
    \ but it does not hurt to introduce one such statement (the if statement) at this\
    \ point to illustrate how to work with relational operators.\n\nConsider what\
    \ happens if you want to determine if two items are equal to each other. You can\
    \ use an if selection statement. An if selection statement sets up an expression\
    \ that can be interpreted more or less as follows: if the relation I describe\
    \ between A and B is true, then do something. The selection involves selecting\
    \ an action to perform based on the truth of a given relationship. The relationship\
    \ usually involves determining whether A and B are equal to, less than, greater\
    \ than, or not equal to each other.\n\n# Selection and Equality (eq)\n\nAs Listing03_13\
    \ shows, to create an if selection statement, you type the word if and a set of\
    \ parentheses that enclose the relation you want to test. The relation usually\
    \ consists of the terms you want to test related by a relational operator (in\
    \ this case eq). You then create a statement inside curly braces following the\
    \ selection statement. The statement you place inside the curly braces tells the\
    \ interpreter what to do if the result of the selection test (the test inside\
    \ the parentheses) is true.\n\n```\n#Listing03_13\n#Generic selection statements\
    \ using eq with strings\nif(\"Chicago\" eq \"Chicago\")\n{\n    print \"\\nStatement\
    \ 1 (\\\"\\\"): Chicago to Chicago, okay.\";\n}\n    if('Chicago' eq 'Miami')\n\
    \    {\n        print \"\\nStatement 2: Chicago to Miami, okay.\";\n    }\n  \
    \  if('Chicago' eq 'Chicago')\n    {\n        print \"\\nStatement 3 (\\'\\'):\
    \ Chicago to Chicago, okay.\";\n    }\n    if('Chicago' eq \"Chicago\")\n    {\n\
    \        print \"\\nStatement 4 (\\'\\'): Chicago to Chicago, okay.\";\n    }\n\
    ```"
  merge: -1
  img_proc: true
