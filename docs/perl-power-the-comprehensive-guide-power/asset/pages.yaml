  md: '| Category | Operators | Description |

    |---|---|---|

    | Assignment | = | You assign the results of operations after performing them,
    so it makes sense that the assignment operator has relatively low precedence.
    Assignment always proceeds according to a right-to-left association. On the left
    of the assignment operator you create an expression and then assign it to the
    value on the right of the assignment operator. |

    | Augmentation | += -= *= /= *= **= | Allows you to augment a variable and assign
    the result of the augmentation back to the variable. The double asterisks (**)
    relates to powers (exponents). These operators have slightly lower precedent than
    the lone assignment operator. If you lined up three values, two related by the
    assignment operator and two by one of the augmentation operators, the assignment
    would occur prior to the augmentation. Augmentation proceeds according to right-to-left
    associativity. You create an expression on the right side of the augmentation
    operator, and the interpreter assigns the result to the value on the left. |


    # # Numbers and Built-In Functions


    As with string operations, life becomes particularly interesting when you begin
