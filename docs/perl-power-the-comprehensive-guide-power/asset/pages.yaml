  md: '# # Extending Hash Applications


    In this chapter you further explore the use of hashes. Among the functions you
    explore are the `defined()`, `exists()`, `scalar()`, `delete()`, and `reverse()`
    functions. Some of these functions are also used with arrays. When used with hashes,
    they might perform the same basic activity they perform with arrays, but they
    have different visible results. This is the case with the `reverse()` function,
    which reverses the key-value associations you see when you access items in a hash.
    One of the more complex activities you perform with hashes involves slicing hashes.
    When you slice hashes, you insert one hash into another. You can use a number
    of approaches to slicing. The same applies to converting hashes into strings or
    strings into hashes. To accomplish this work, you use the `split()` and `join()`
    functions. Among the activities this chapter addresses are the following:


    +   - Exploring different ways to determine whether hash elements have been defined

    +   - How to delete a key-value pair from a hash

    +   - Sorting and reversing items as you retrieve them from a hash

    +   - Converting the key-value pairs in a hash to a string

    +   - Converting a sting into key-value pairs

    +   - Merging hashes through slicing


    # ## Checking for Existence


    The `exists()` function checks for the existence of a hash key. If the key exists,
    it returns true (1). If the key does not exist, it returns false (0). It does
    not test for the existence of values. The `exists()` function requires one argument.
    This argument consists of the hash lookup operation with the name of the key that
    you target for your query.


    Listing09_01 makes use of the tables of elements created by the chemists John
    Newlands and Dmitri Mendeleev. In 1866, Mendeleev created what is generally recognized
    as the modern'
