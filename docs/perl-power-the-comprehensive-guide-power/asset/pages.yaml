- pgno: 243
  md: "# # Reversing Keys and Values\n\nThe `reverse()` function works with both arrays\
    \ and hashes. With a hash, it reverses keys and values. The `reverse()` function\
    \ takes only one argument, the name of the hash in its implicit form (`%`). When\
    \ you use it with hashes, you assign the return value of the hash back to the\
    \ hash. Listing09_08 reverses a hash to create a table that displays chemical\
    \ elements according to the descending order of their melting points.\n\n```\n\
    ```perl\n#Listing09_08\n# 1 Formatting elements for the table\n$NL = \"\\n\";\n\
    $DC = \"=\";    #character for top and bottom lines of table\n$TW = 55;      \
    \ #Table width\n$DL = sprintf(\"%55s\", $NL . $DC x $TW); #top and bottom lines\n\
    $COLAHEAD = \"Element\";\n$COLBHEAD = \"Celsius\";\n$COLCHEAD = \"Fahrenheit\"\
    ;\n\n#2 Set up the data using an implicit hash\n%ElementsCelMeltingPts = ( Water,\
    \ 100,\n    Aluminum, 659, Carbon, 3600,\n    Chromium, 1615, Copper, 1083,\n\
    \    Gold, 1946, Hydrogen, -259,\n    Iron, 1530, Lead, 327,\n    Magnesium, 670,\
    \ Manganese, 1260,\n    Nickel, 1452, Phosphorous, 44,\n    Silicon, 1420, Silver,\
    \ 961,\n    Tin, 232, Titanium, 1795,\n    Tungsten, 3000, Zinc, 419);\n\n#3 Print\
    \ the table\nprintf(\"$DL\");\nprintf(\"\\n % -25s %-15s %-15s\", $COLAHEAD ,\
    \ $COLBHEAD, $COLCHEAD);\nprintf(\"$DL\");\n\n#4 HASH: Reverse the Keys and Values\
    \ in the hash\n%ElementsCelMeltingPts = reverse(%ElementsCelMeltingPts);\n```\n\
    ```"
  merge: -1
  img_proc: true
