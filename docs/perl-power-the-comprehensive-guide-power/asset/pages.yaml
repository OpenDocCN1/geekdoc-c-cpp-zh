- pgno: 190
  md: '# # Using a Stack as an Accumulator


    To create a brief program to illustrate how to use the stack as an _accumulator_,
    it is possible to use the example of the doll factory as a starting point. The
    goal involves people at an airport arriving at one of several stops located around
    the airport. A service representative attends each stop and sends a message to
    a computer in the central office each time a new passenger arrives needing a shuttle
    ride. During peak hours, the central office dispatches a shuttle to stops when
    the computers show that eight people are waiting. Figure 7.14 illustrates the
    situation.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_190_0.png)


    A specification for Listing07_09 might be along the following lines:


    * Record each passenger who comes to one of the shuttle stops and requests transportation.

    * Accumulate the requests (in a stack).

    * When the stack reaches the designated maximum (8), issue an order to dispatch
    a shuttle.


    Granted, in a commercial setting, much more might be involved in developing any
    such dispatch system, but in this situation, the scenario provides a context in
    which it is possible to see how the stack works as an accumulator to relate two
    activities: passengers arriving at a shuttle stop and dispatching shuttles to
    pick up passengers.


    # ## Figure 7.14

    The computer dispatches a shuttle when it finds that eight people are waiting.'
  merge: -1
  img_proc: true
