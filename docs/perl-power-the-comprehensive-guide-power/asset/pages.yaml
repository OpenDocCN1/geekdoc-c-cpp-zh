- pgno: 203
  md: '# Order of Initialization


    When you initialize hashes using implicit and lookup forms of the hashes, you
    follow implicit form with the lookup form. Consider the following order of initialization:


    ```

    #1 Lookup following implicit form works

    %Elements = (Hydrogen =>  H);  #implicit

    $Elements{Aluminum} = Al;       #lookup

    ```


    When the lookup follows the implicit form, you see the following output if you
    print the contents of @Elements with formatting:


    ```

    Aluminum Al

    Hydrogen H

    ```


    The Perl interpreter allows you to initialize a hash implicitly and then to add
    more elements to the hash with the scalar or lookup statement. You add Aluminum
    after Hydrogen, and when you print the contents, you see both elements.


    This situation changes when you reverse the order. If you begin with a lookup
    form of initialization and then follow with an implicit form of initialization,
    the Perl interpreter does not add elements to your hash. Instead, it allows the
    implicit initialization to cancel the contents previously assigned. Consider initializations
    in the following lines:


    ```

    #2 Implicit following lookup does not work

    $Elements{"Calcium"}=       "Ca";       #lookup

    $Elements{Aluminum}=        "Al";       #lookup

    %Elements = ("Oxygen", "O");           #implicit – cancels previous

    ```


    When you follow the two scalar expression with the implicit initialization, if
    you print the contents of @Elements with formatting, you see only one element:


    ```

    Oxygen O

    ```


    With the implicit initialization, you lose the contents of the hash as previously
    defined.


    > It might seem that the behavior of Perl is arbitrary when you consider the way
    that you go back and forth between the implicit (%) and (scalar) explicit ($)
    forms. One way to counter this notion involves remembering that when you use explicit
    ($) form, you are dealing with an item in the hash as a single scalar. When you
    use the implicit form (%), you are dealing with the item as a part of the whole
    hash structure. It is as though you have thrown a switch.'
  merge: -1
  img_proc: true
