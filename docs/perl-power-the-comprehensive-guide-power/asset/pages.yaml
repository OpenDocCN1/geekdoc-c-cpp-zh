    # Rational Operations


    When you combine numbers, the Perl interpreter follows the logic of *type promotion*.
    Type promotion stipulates that if you combine two numbers of different types,
    the resulting value is of (or cast to) the type that provides the greatest storage
    ability. For example, an integer requires relatively little storage space. A float
    requires more than an integer. If you combine an integer and a float, the result
    is a float. Perl does not work in this way on a visible level because it does
    not require strict type designation for the identifiers you create. Still, when
    you work with numbers, Perl tends to maintain a logic of type promotion as you
    combine different values. Listing05_06 provides examples of what happens with
    the declaration and combination differed identifiers.


    ```

