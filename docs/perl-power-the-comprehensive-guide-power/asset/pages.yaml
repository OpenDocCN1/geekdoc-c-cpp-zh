  md: '# 14 File I/O


    This chapter provides an exploration of the use of functions and operators that
    allow you to write to and read from files. Input/output (IO) processes involve
    reading from files. To accomplish this in Perl, you use a file handle. A file
    handle is a data type you identify using the diamond operator. You associate filenames
    with file handles and then write to them or read from them using operations that
    employ the handle as an argument. Among the IO functions you use often are the
    open(), close(), seek(), and read() functions. Using these functions, you can
    readily manipulate the data in the files you access. Among the topics this chapter
    covers are the following:


    +   - Gaining familiarity with IO

    +   - The basics of handles

    +   - The open(), print(), and close() functions

    +   - Seeing and reading data from a file

    +   - Writing records to files

    +   - Reading records from files


    # Input/Output Streams


    Anything beyond the CPU and its associated memory is usually regarded as a “device.”
    The operating system of your computer can identify devices through special memory
    locations that allow the CPU to communicate with them. When you enter characters
    at the keyboard, your operating system regards the characters as input to your
    CPU. On the other hand, your operating system regards the signal from the CPU
    to the monitor as output. Together, input and output constitute data input/output
    (IO) streams. The operating system commands the CPU to stream characters from
    the keyboard to RAM, and when you save the file, the operating system commands
    the CPU to stream data to your disk drive. The means by which your program file'
  merge: -1
