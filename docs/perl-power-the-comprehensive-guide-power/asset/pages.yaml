- pgno: 358
  md: '# # Dereferencing References


    When you print the scalar to which you have assigned a reference, you see only
    the memory locations of the information the reference guides you to. What you
    usually require is not the location of the information but the information itself.
    To access the information a reference designates, you must dereference the reference.
    To dereference a reference, you employ the dereference operator.


    As Figure 13.5 illustrates, the dereference operator for each type of reference
    consists of its type identifier. You prefix the type identifier to the reference:


    +   * Dereference a scalar: $$RefToExtraVegetable

    +   * Dereference an array: @$RefToFruits

    +   * Dereference a hash: %$RefToCereals


    In each case, extracting the value a reference represents involves applying a
    type identifier to the reference identifier. In Listing13_04, you apply the dereference
    operators to the scalar identifiers to which you have assigned references.


    # ### Listing13_04


    ```

    ```perl

    #1 Define array and hash

    $ExtraVegetable = "Cabbage";

    @Fruits = ("Apple", "Apricot", "Banana");

    %Cereals = ("Bran Buds" , 110, "Raisin Bran" , 150);


    #2 Define references

    #For a scalar

    $RefToExtraVegetable = \$ExtraVegetable;

    #For an array

    $RefToFruits = \@Fruits;

    #For a hash

    $RefToCereals = \%Cereals;


    $NL = "\\n\n";

    $DL = "-" x 50;

    #3Show dereferences

    #Scalar

    print "$NL Scalar: $NL Value in \$ExtraVegetable -- " . $ExtraVegetable;

    ```

    ```'
  merge: -1
  img_proc: true
