- pgno: 173
  md: '# # Arrays and Data Containers


    In this chapter you''ll explore a variety of functions associated with the implicit
    form of the array. Such functions as `reverse()`, `sort()`, `split()`, and `join()`
    allow you to easily increase the number of problems you can solve using Perl arrays.
    Along with the built-in operations, this chapter also explores how the array that
    Perl provides is in essence a flexible container. You can use it as a traditional
    dynamic array, or through such functions as the `push()`, `pop()`, `shift()`,
    and `unshift()` functions you can transform it into data containers. Among the
    containers you investigate are stacks and queues. Toward this objective and others,
    the topics in this chapter include the following:


    +   - How to reverse the order of elements in an array

    +   - Using the `join()` function with arrays

    +   - Adding and extracting elements from the front of an array

    +   - Adding and extracting elements from the end of an array

    +   - Using the array as a stack

    +   - Using the array as a queue


    # ## Reverse Elements in an Array


    One basic function associated with arrays allows you to reverse their contents.
    This is the `reverse()` function. If you have a sorted list that goes from 1 to
    10 or “a” to “z,” then when the `reverse()` function does its work, you see as
    a result a list that goes from 10 to 1 and “z” to “a.” The `reverse()` function
    itself does sort the contents of an array; it works with the items as it finds
    them. When you reverse the elements of an array, you must assign the array back
    to itself for the reversal to take effect. Listing07_01 explores how to reverse
    an alphabetical list of Japanese cities.'
  merge: -1
  img_proc: true
