  md: "# The unless Structure\n\nThe `unless` selection statement tests for a negative\
    \ condition. Whereas the `if` statement processes statements in its block when\
    \ an expression is true, the `unless` statement processes statements only when\
    \ the expression is *not* true. Listing10_08 provides an example of the use of\
    \ `unless` to provide a slightly different appearance for quotes from Henry D.\
    \ Thoreau’s *Walden*.\n\n```\n```text\n#Listing10_08\n#1 block containing text\n\
    $Itr = 1;\n($WaldenLines=<<WALDENLINES);\n1. The mass of men live lives of quiet\
    \ desperation.\n2. Most of the luxuries, and many of the so-called\ncomforts of\
    \ life, are not only not indispensable,\nbut positive hindrances to the elevation\
    \ of mankind.\n3. Every child begins the world again, to some extent,\nand loves\
    \ to stay outdoors, even in wet and cold.\n4. If I knew for a certainty that a\
    \ man was coming to\nmy house with the conscious design of doing me good,\nI should\
    \ run for my life . . . .\n5. The heroic books, even if printed in the character\n\
    of our mother tongue, will always be in a dead\nlanguage to degenerate times .\
    \ . . .\n6. No man ever followed his genius until it misled him.\nWALDENLINES\n\
    \n#2 Split the text at numbers\n@HDThoreau = split(/\\d\\.\\s/, $WaldenLines);\n\
    \n#3 Set up strings for display\n```\n```\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_264_0.png)\n\
    \n**Figure 10.10**  \nDifferent expressions embedded in `if` selection statements\
    \ allow you to display a range of six items."
