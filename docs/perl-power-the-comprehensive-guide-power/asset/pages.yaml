  md: "A similar procedure characterizes your use of the `values()` function. The\
    \ `values()` function accesses all the values in a hash, and if you cascade the\
    \ `values()` function into the `scalar()` function, you get a count of all the\
    \ values in a hash.\n\nFor the two hashes representing the data used by Mendeleev\
    \ and Newlands, you use the `scalar()` function and the cascaded `keys()` and\
    \ `values()` functions to define four scalar identifiers ($MLenV, $MLenK, $NLenK,\
    \ $NLenV). Having obtained these values, you can then proceed to print them. Figure\
    \ 9.3 shows you the table that results from Listing09_03.\n\n![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_233_0.png)\n\
    \n**Figure 9.3**  \nUse the `scalar()` function to retrieve the number of elements.\n\
    \n# Slicing Hashes\n\nWhen you use a slice operation, you can insert the contents\
    \ of one or more other hashes into a hash. You can improvise an endless number\
    \ of approaches to hash slicing. The procedure usually involves the use of the\
    \ lookup form of the target hash. You follow this with an assignment operation\
    \ involving a list of items to be sliced into the target hash. In other cases,\
    \ you can avoid using the lookup operation and employ instead assignment of a\
    \ list alone. Listing09_04 presents three possibilities:\n\n+   - Use the hash\
    \ lookup operation with a series of keys separated by commas. Assign a list of\
    \ values to the keys. See comment #4.\n+   - Use the hash lookup operation. As\
    \ the argument for the lookup, use `keys()` with the hash from which you want\
    \ to derive keys for splicing. Follow with the assignment operator and a list\
    \ containing the `values()` function. For the argument of the `values()` function,\
    \ you use the same hash you used in the `keys()` function. See comment #5.\n+\
    \   - Use the assignment operator to assign a list of hashes to the target hash.\
    \ As the first item in the list, name the target list. See comment #6.\n\n```\n\
    #Listing09_04\n# 1 Formatting elements for the table\n$NL = \"\\n \";\n$DC = \"\
    =\";            #character for top and bottom lines of table\n```"
