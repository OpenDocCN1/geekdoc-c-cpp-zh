    # ## Conclusion


    This chapter explored the basics of hashes as associative containers. An associative
    container

    employs an algorithm that does not involve storing data on a strictly sequential
    basis, as you see,

    for example, when you inspect the indexes of an array. One item does not necessarily
    follow

    another according to how you have placed them in the container. Instead, the algorithm
    is con-

    structed to organize data according to its own characteristics. The characteristics
    remain hidden

    in the algorithm, but it remains that it makes it possible for you to quickly
    access the information

    the hash stores.


    When you initialize a hash, you can use both scalar and implicit forms of the
    hash as you do so.

    The result depends to a great extent on the context you are working in. Still,
    the basics remain

    the same. You can recognize the implicit form of a hash by the business “at” sign
    (@). The scalar,

    or lookup, form of a hash is associated with the dollar sign.


    When accessing items in a hash, you have a variety of options. Two easy ones involve
    employing

    the keys() or values() function to access the keys or values in a given hash and
    assigning

    them to an array. You can then use repetition control statements such as while
    or foreach

    to traverse the array. Used with the lookup form of the hash, traversing an array
    of keys or values

    allows you to easily access all the elements in the hash.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Conclusion


    This chapter also explored how functions familiar from work with arrays prove
    useful when dealing with hashes. Among these functions are the `shift()`, `pop()`,
    and `reverse()` functions. When you use the `reverse()` function with a hash as
    its argument, you reverse the key-value relationship of the items in the hash.
    In essence, you are reading a list backward, but in relation to a hash, this means
    that you are also reading the key-value pairs backward. Reversing key-value pairs
    allows you to easily organize data in varying ways, as when you display chemical
    elements in an order established by their melting points.'
