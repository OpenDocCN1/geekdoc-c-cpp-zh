    # # Extracting and Replacing Strings


    Perl provides a function called `substr()` that allows you to either extract a
    substring from a given target string or replace a substring in a given target
    string with another substring. The operation the function performs depends on
    the number of arguments you provide to the function. With three arguments, you
    can extract a substring. With four arguments, you can replace a substring. The
    next few sections elaborate on these themes.


    # # Extracting Substrings with substr()


