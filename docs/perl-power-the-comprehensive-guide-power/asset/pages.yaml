    # # Selection Using the if Control Statement


    The if control statement is known as a single-entry, single-exit control statement.
    The reason for this is that it sets one condition and allows you to access one
    block of statements. The if statement tests for the truth of a given condition.
    If the expression the statement evaluates does not render true, then statements
    that follow in the control block are not performed. To be true, the result of
    a condition must possess a value that is not undefined or a zero. The if statement
    can on this basis handle expressions that test strings and numbers. As shown previously
    in the example relating to retrieving a poem from a data store, it can easily
    handle expressions that combine Boolean and relational operators. Listing10_07
    provides examples of selection statements used with both relational and Boolean
    operations.


    ```

