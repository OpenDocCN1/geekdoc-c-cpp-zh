  md: '# ## Indexes of Characters


    The `index()` function returns the starting position of a string within a string.
    The `index()` function derives its name from the _index_ of an _array_. As Figure
    4.13 illustrates, an array is analogous to a bureau of drawers. You can identify
    a drawer by its number. A string is an array of characters, so you can identify
    each of its characters by its index number. Array indexes begin at 0.


    To use the `index()` function, you provide it with three arguments. The first
    argument is the string for which you want to search. This can be a scalar or a
    literal string. The second argument is the target string—the string you want to
    search. The final argument is the _offset_. The offset indicates the position
    in the target string you want to designate as the starting point of your search.
    You identify this position with an integer that identifies an index in the target
    string. The


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_94_0.png)'
