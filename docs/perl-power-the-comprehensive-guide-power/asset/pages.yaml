  md: "![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_68_0.png)\n\n**Figure 3.13**  \nUsing\
    \ string multiplication allows you to enhance the effects of basic concatenation.\n\
    \n# Relational Operators for Strings\n\nThe concatenation operator is one of several\
    \ operators that apply to strings. Another type of operator is a *relational operator*.\
    \ Relational operators allow you to compare items to each other. One form of string\
    \ comparison involves discovering whether one string is alphabetically prior to\
    \ (less than) another or comparatively the same as (equal to) another. Table 3.3\
    \ provides a discussion of the relational operator and a few other operators that\
    \ apply to strings.\n\n**Table 3.3 — Operators for Strings**\n\n| Operator | Discussion\
    \ |\n|---|---|\n| `eq` | One string is equal to another. This applies with letters,\
    \ words, or longer units of text. The equality is exact, not relative to length.\
    \ |\n| `ne` | One string is not equal to another. This applies with letters, words,\
    \ or longer units of text. |\n| `lt` | One string occupies an alphabetical position\
    \ that is less than another. “Another” is less than “Brother.” |\n| `gt` | One\
    \ string occupies an alphabetical position that is greater than another. “Brother”\
    \ is greater than “Another.” |\n| `ge` | One string is the same as or alphabetically\
    \ greater than another. “Another” is equal to itself, but not greater than itself.\
    \ The test would render a true finding. |\n| `le` | One string is the same as\
    \ or alphabetically less than another. “Another” is equal to itself, but not less\
    \ than itself. The test would render a true finding. |\n| `++` | This is a unary\
    \ operator. Suffixed to a scalar, it causes the last letter of the scalar to change\
    \ so that it increases one place in the alphabet. If the letter is “z”, then it\
    \ shifts back to the beginning of the alphabet and moves to “a.” |\n| `comma (,)`\
    \ | Allows you to append strings to each other. |"
