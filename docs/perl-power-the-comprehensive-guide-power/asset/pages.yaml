  md: "# Array Slicing\n\nSlicing allows you to replace designated elements in an\
    \ array using either scalar values or other arrays. When you employ the slice\
    \ operation, you use the implicit (@) form of the array, but you combine this\
    \ with the square brackets. You can slice as many elements as you choose. As Listing06_06\
    \ shows, you can do this with a combination of the list and the array context:\n\
    \n```\n#Listing06_06\n#1 Define an array\n@CanadianCities = (\"Amos\", \"Barrie\"\
    , \"Battleford\",\n                  \"Beauport\", \"Bonavista\");\n\nprint \"\
    \\n Original list:\\n @CanadianCities\";\n\n#2 Slice in scalars -- two slices\n\
    @CanadianCities[1, 2] = (\"Chicoutimie\", \"Estevan\");\nprint \"\\n Slice at\
    \ indexes 1 and 2:\\n @CanadianCities\";\n@CanadianCitiesA = (\"Saskatoon\", \"\
    Moose Jaw\");\n#slice in three elements\n@CanadianCities[0, 2, 3] = (\"Gagnon\"\
    , \"Perce\", \"Gaspe\");\nprint \"\\n Splice at indexes 0, 2 and 3:\\n @CanadianCities\"\
    ;\n\n#3 Slice in elements of an array\nprint \"\\n Alternate array:\\n @CanadianCitiesA\"\
    ;\n@CanadianCities[3] = (@CanadianCitiesA);\nprint \"\\n Splice of alternate list\
    \ at index 3:\\n @CanadianCities\";\n```\n\nAt comment #1, you set up an initial\
    \ array of Canadian cities. Then, with the lines comment #2 identifies, you conduct\
    \ slices. The first slice involves the replacement of the elements at indexes\
    \ 1 and 2. The second slice involves the replacement of the elements at indexes\
    \ 0, 2, and 3. Both of these slices involve scalar substitutions. You employ string\
    \ constants to replace elements in @CanadianCities on the basis of index position.\n\
    \nIn the lines that comment #3 identifies, you slice an array into the original\
    \ array. The slicing begins at index 3. Figure 6.7 illustrates the result of the\
    \ slicing in Listing06_06."
  merge: -1
  img_proc: true
- pgno: 162
  md: '# # Swapping


    When you swap elements in an array, you improvise on the basic routine afforded
    by slicing. To effect a swap, you reassign an array to itself, and as you do so
    you employ indexes to define how you want to reorganize (or swap) the elements.
    Listing06_07 explores a basic swapping scenario:


    ```

    #Listing06_07

    #1 Create an array

    @CanadianCities = ("Amos" , "Barrie" , "Battleford" ,

    "Beauport", "Bonavista");

    $Itr = 0;

    print "\n Original order:\n ";

    foreach $City (@CanadianCities){

    print "\n ". $Itr++ . ". ". $City";

    }

    #2 Use swapping to rearrange the elements

    @CanadianCities[0,3,2,1] = @CanadianCities[4,1,2,3];

    #print results of swapping

    $Itr = 0;

    print "\n\n Rearranged order: \n";

    foreach $City (@CanadianCities){

    print "\n ". $Itr++ . ". ". $City";

    }

    ```


    At comment #1, you set up an array of Canadian cities and then print the array
    with an iterator so that you can see the order. Then at comment #2, you set up
    a swapping routine. The routine involves using the implicit (@) form of the array
    and multiple indexes between brackets to indicate the elements you want to swap.
    To make the swap, you assign the array back to itself.


    ![](img/fd17b6cf7ddc9bc7e6f1529936c3ac84_162_0.png)'
  merge: -1
  img_proc: true
