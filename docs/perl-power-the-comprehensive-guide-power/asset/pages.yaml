    \n```\n```text\n#Listing06_08\n\n#1 Define an array of cities in India\n@CitiesInIndia\
    \ = qw(Hyderabad Imphal\n                    Behra’Dun, New’Delhi,\n         \
    \           Indore Jodhpur\n                    Merest Nagpur\n              \
    \      Raipur);\n\n# 2 Explicit use of scalar\n$Length = scalar(@CitiesInIndia);\n\
    print \"\\n Number of cities: $Length.\";\n\n#print\nforeach $City (@CitiesInIndia){\n\
    \    print \"\\n $City\";\n}\n```\n```\n\nThe lines trailing comment #1 create\
    \ an array of cities in India. Use of the apostrophe is a work-around for the\
    \ qw( ) function. This makes it so that the function recognizes the cities consisting\
