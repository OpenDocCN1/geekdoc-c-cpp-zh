  ## 13. 考虑以下函数，它接受双向链表头节点的引用作为参数。假设双向链表的节点有一个指针为 `prev`，后继指针为 `next`。\n\n```c\nvoid\
  \ fun(struct node **head_ref)\n{ \n    struct node *temp = NULL; \n    struct node\
  \ *current = *head_ref; \n\n    while (current !=  NULL) \n    { \n        temp\
