  \ | :--- |\n| a[0] | a[1] | a[2] | a[3] | a[4] | a[5] | a[6] | a[7] |\n| 步骤 6 |\
  \ 步骤 10 | 步骤 16 | 步骤 20 | | | |\n\n仅对该子列表进行排序。\n\n| -38 | 91 | 33 | 48 | 25 | 56\
  \ | 10 | 84 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| a[0]\
  \ | a[1] | a[2] | a[3] | a[4] | a[5] | a[6] | a[7] |\n| 步骤 11 | 步骤 21 | | | | |\
  \ |\n\n合并两个列表 合并两个列表。\n\n| -38 | 10 | 25 | 33 | 48 | 56 | 84 | 91 |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| a[0] | a[1] | a[2] | a[3] | a[4]\
  \ | a[5] | a[6] | a[7] |\n| 步骤 22 | | | | | | |\n\n合并这两个列表并进行排序。\n\n| -38 | 10 |\
