  \ `X` 的下一个节点的数据拷贝到 `X` 中，然后删除 `X` 的下一个节点。\n\n**答案：(A)**\n\n**解析：**\n\n以下是简单步骤：\n\
  \n1. 访问下一个节点并将其赋值给 `temp`。\n```\nstruct node *temp = X->next;\n```\n2. 用下一个节点(`temp`)\
  \ 的内容替换当前节点(`X`)。\n```\nX->data = temp->data;\nX->next = temp->next;\n```\n3. 释放下一个节点(`temp`)。\n\
  ```\nfree(temp);\n```\n\n## 9. 考虑下文定义的函数 `f`。\n\n```c\nstruct item  \n{  \n  int\
  \ data;  \n  struct item * next;  \n};  \n\nint f(struct item *p)  \n{  \n  return\
  \ ( \n          (p == NULL) ||  \n              (p->next == NULL) ||  \n       \
  \   (( P->data <= p->next->data) && f(p->next)) \n             );  \n} \n```\n\n\
  对于给定的链表 `p`，函数 `f` 返回 1 当且仅当（GATE CS 2003）：\n\n1. 列表为空或恰好有一个元素。\n2. 列表中的元素按数据值的非递增顺序排序。\n\
  3. 列表中的元素按数据值的非递减顺序排序。\n4. 列表中的并非所有元素都具有相同的数据值。\n\n**答案：(B)**\n\n**解析：** 函数 `f()`\
  \ 的工作如下：\n\n1. 如果链表为空，返回 1。\n2. 否则，如果链表只有一个元素，返回 1。\n3. 否则，如果 `node->data` 小于或等于\
  \ `node->next->data` 且再次调用函数处理 `node->next`。如果链表的剩余部分也满足相同条件，则返回 1。\n4. 否则返回 0。\n\
  \n## 10. 考虑使用一个单向循环链表来表示一个 `Queue`（队列）。只有一个变量 `p` 可用于访问该队列。`p` 应该指向哪个节点，才能在常数时间内完成\
