  \n   **答案: (D)**\n\n40. 下面哪些陈述是错误的或是正确的？\n\n1.\n```c\nstruct node\n{\nstruct node\
  \ *prev;\nint data;\nstruct node *next;\n};\n```\n这是 C 语言中单向链表的节点表示。\n2. \n```c\n\
  struct node\n{\n      int data;\n      struct node *next;\n};\n```\n这是 C 语言中双向链表的节点表示。\n\
  \n   **答案: (C)**\n\n\n\n\n\n在树数据结构中，第一个节点被称为根节点。没有父节点的节点被称为根节点。每棵树都需要一个根节点。根节点可以认为是树结构的起源。在任何树数据结构中，应该只有一个根节点。树中永远不会有多个根节点。在图\
  \ 5.1 中，“A”是树的根节点。\n\n![](img/Fig05_01.jpg)\n\n图 5.1 具有七个节点和六条连边的树。\n\n### 2. 边\
  \ (Edge)\n在树数据结构中，任意两个节点之间的连接链路被称为边。具有若干节点‘N’的树将最大数量的边。在图 5.1 中，节点 A 和 B 之间的链路被称为边。\n\
  \n### 3. 父节点 (Parent)\n在树数据结构中，作为任何节点的祖先的节点被称为父节点。简单来说，分支到任何其他节点的节点被称为父节点。父节点也可以描述为“拥有一个或多个子节点的节点”。在图\
  \ 5.1 中，节点 A、B 和 C 被称为父节点。\n\n### 4. 子节点 (Child)\n在树数据结构中，作为任何节点后代的节点被称为子节点。简单来说，在其父节点上有一条边的节点被称为子节点。在树数据结构中，任何父节点都可以有任意数量的子节点。在树中，除根节点外，所有节点都是子节点。在图\
  \ 5.1 中，B、C、D、E、F 和 G 都是子节点。\n\n### 5. 兄弟节点 (Siblings)\n在树数据结构中，属于同一个父节点的节点被称为兄弟姐妹。简单来说，具有相同父节点的节点被称为兄弟节点。在图\
  \ 5.1 中，B 和 C 节点是彼此的兄弟。此外，节点 E、F 和 G 也是彼此的兄弟。\n\n### 6. 叶子节点 (Leaf)\n在树数据结构中，没有子节点的节点被称为叶子节点。简单来说，叶子节点是没有子节点的节点。\n\
  \n在树数据结构中，叶子节点也称为外部节点。外部节点也是没有子节点的节点。在树中，叶子节点也称为“终端”节点。在图 5.1 中，D、E、F 和 G 是叶子节点。\n\
  \n### 7. 内部节点 (Internal nodes)\n拥有至少一个子节点的节点被称为内部节点。简单来说，内部节点是有至少一个子节点的节点。\n\n在树数据结构中，除叶子节点或外部节点以外的节点被称为内部节点。如果树结构包含一个一个节点，根节点也被视为内部节点。内部节点也称为非终端节点。在图\
  \ 5.1 中，A、B 和 C 节点是内部节点。\n\n### 8. 度 (Degree)\n在非线性树数据结构中，一个节点的子节点总数被称为该节点的度。简单来说，树数据结构中一个节点的度是它拥有的子节点的总数。\n\
  \n树中所有节点中度最高的被称为“树的度”。在图 5.1 中，C 节点的度为 3，B 节点的度为 1。然而，树的度是 3。\n\n### 9. 层 (Level)\n\
  在非线性树数据结构中，根节点位于第 0 层，根节点的子节点位于第 1 层，位于第 1 层节点的子节点将位于第 2 层，依此类推。简单来说，在树数据结构中，从顶到底部的每一步都称为一层，层数从“0”开始，每层或每一步增加\
  \ 1。在图 5.1 中，D、E、F 和 G 的层为 2。\n\n### 10. 高度 (Height)\n在非线性树数据结构中，从叶子节点到特定节点的最长路径上的边或链路总数被称为该节点的高度。在树中，根节点的高度被称为树的高度。在树中，所有叶子节点的高度均为“0”。\n\
  \n在图 5.1 中，A 节点的高度为 2，树的高度也是 2。\n\n### 11. 深度 (Depth)\n在非线性树数据结构中，从根节点到特定节点的边总数被称为该节点的深度。在树中，从根节点到叶子节点的最长路径上的边总数被称为树的深度。简单来说，树中任何叶子节点的最高深度被称为该树的深度。在树中，根节点的深度为“0”。\n\
  \n在图 5.1 中，D 节点的深度为 2，树的高度也为 2（注：此处原文可能笔误，应指深度）。树的深度为 2，但高度和深度不相等。\n\n### 12. 路径\
  \ (Path)\n在非线性树数据结构中，从一个节点到另一个节点的节点边序列被称为路径。路径的长度表示节点的数量。在图 5.1 中，路径 A - B - D 的长度为\
  \ 3。\n\n### 13. 子树 (Sub-tree)\n在非线性树数据结构中，每个节点的递归形成子树。子树由其父组成。\n\n### 14. 森林 (Forest)\n\
  森林是树的不交并集。\n\n## 5.2 二叉树数据结构\n\n### 5.2.1 二叉树定义\n每个节点最多有两个子节点的树被称为二叉树。二叉树中每个节点的度最多为二（图\
  \ 5.2）。\n\n![](img/Fig05_02.jpg)\n\n图 5.2 二叉树。\n\n只有一个节点的二叉树是根节点，其左右子树为空。如果二叉树有两个节点，其中一个是根节点，另一个可以是左孩子或右孩子（图\
  \ 5.3）。\n\n![](img/Fig05_03.jpg)\n\n图 5.3 两个节点的二叉树。\n\n### 5.2.2 二叉树的类型\n\n1. **严格二叉树或满二叉树或恰二叉树：**\n\
  满二叉树或恰二叉树或严格二叉树是指除叶子节点外的每个节点有两个孩子的树。这意味着二叉树中的每个节点具有 0 个或 2 个孩子，被称为满二叉树或严格二叉树。完全二叉树用于表示数学表达式（图\
  \ 5.4）。\n\n![](img/Fig05_04.jpg)\n\n图 5.4 严格二叉树或**满二叉树**或**恰二叉树**。\n\n2. **完全二叉树或完美二叉树：**\n\
  完全二叉树是指除最后一层外，每层都是满的且所有节点尽可能靠左的二叉树。所有完全二叉树都是严格二叉树，但并不是所有严格二叉树都是完全二叉树。完全二叉树是允许左右子树高度差仅为\
  \ 1 的严格二叉树。所有叶子节点位于同一层，或者仅允许 1 层差异（图 5.5）。\n\n![](img/Fig05_05.jpg)\n\n图 5.5 完全二叉树。\n\
  \n3. **二叉搜索树：**\n如果一棵二叉树满足以下属性：节点 n 左子树中的所有元素都小于 n 的内容，右子树中的所有元素都大于或等于 n 的内容，则这样的二叉树被称为二叉搜索树\
  \ (BST)。\n\n\n\n\n\n在二叉搜索树（BST）中，如果插入相同的元素，则相同的元素会被插入到节点的右侧，且具有相同的值。如图 5.6 所示。\n\
  \n![](img/Fig05_06.jpg)\n\n图 5.6 二叉搜索树。\n\n## 4. 接近完全二叉树：\n\n深度为 `d` 的二叉树被称为接近完全二叉树当且仅当：\n\
  \n1. 树中的每个叶子节点要么位于深度 `d`，要么位于深度 `d-1`，这意味着叶子节点之间的深度差仅允许为一个。\n\n2. 在深度 `d`（即最后一层），如果存在节点，则该节点左侧的所有节点也必须先存在，且深度\
  \ `d` 从左到右的节点之间没有间隙。\n\n在图 5.7 中，最后一层的节点从左到右填充，且最后一层节点之间没有间隙。然而，在图 8 中，最后一层拥有两个节点\
  \ `H` 和 `I`，之间有一个间隙，因为 `D` 节点的左孩子存在但右孩子缺失，因此图 5.8 不是接近完全二叉树。\n\n![](img/Fig05_07.jpg)\n\
  \n图 5.7 接近完全二叉树。\n\n图 5.7 显示了一个接近完全二叉树，但不是完全二叉树，因为 `D` 节点有左孩子没有右孩子。在完全二叉树中，每个内部节点恰有两个孩子。\n\
  \n## 3. 倾斜二叉树：\n\n如果一棵树由左孩子节点或右孩子节点主导，则称为倾斜二叉树。\n\n![](img/Fig05_08.jpg)\n\n图 5.8\
  \ 不是接近完全二叉树。\n\n在左倾斜树中，大多数节点都有左孩子而没有对应的右孩子，如图 5.9 所示。在右倾斜树中，大多数节点都有右孩子而没有对应的左孩子，如图\
  \ 5.10 所示。\n\n![](img/Fig05_09.jpg)\n\n图 5.9 左倾斜树。\n\n![](img/Fig05_10.jpg)\n\n\
  图 5.10 右倾斜树。\n\n## 5.2.3 二叉树的表示法\n\n二叉树有两种表示技术：\n\n1. 顺序表示或数组表示法\n2. 链表示法或链表表示法\n\
  \n### 5.2.3.1 顺序表示或数组表示\n\n如果一个二叉树是完全二叉树，且树的深度为 `3`，那么节点总数就是 `7`。也就是说，如果完全二叉树的深度为\
  \ `n`，则最大节点通过 `2n − 1` 计算（图 5.11）。\n\n![](img/Fig05_11.jpg)\n\n图 5.11 完全二叉树。\n\n\
  如果二叉树的深度已知，我们可以使用数组数据结构来表示二叉树。在顺序表示中，每个节点的编号将从根节点开始，其余节点将按层逐级递增。同一层的节点将从左到右编号。编号如图\
  \ 5.12 所示。\n\n![](img/Fig05_12.jpg)\n\n图 5.12 使用数组的二叉树顺序表示。\n\n如果我们知道父节点的索引假设为 `n`，那么左孩子节点表示为：\n\
  \n`Left child (n) = (2n+1)`\n\n如果我们知道父节点的索引假设为 `n`，那么右孩子节点表示为：\n\n`Right child (n)\
  \ = (2n+2)`\n\n这里，根节点位于索引 `0`。\n\n在图 5.12 中，节点 `C` 位于索引 `2`，那么其左孩子位于索引 `5`，右孩子位于索引\
  \ `6`。此外，如果我们知道左孩子的索引，可以使用公式 `(n-1)/2` 计算其父节点的索引；如果我们知道右孩子的索引，可以使用公式 `(n-2)/2` 计算其父节点的索引。\n\
  \n**顺序表示的优点：**\n1. 直接访问任何节点。\n2. 寻找左孩子或右孩子。\n\n**顺序表示的缺点：**\n1. 内存浪费：如果二叉树不是完全的，会浪费空间。\n\
  2. 如果二叉树增长，则需要调整数组。\n\n### 5.2.3.2 链表示法\n\n在链表示中，每个节点包含数据以及指向左右孩子的的指针。\n\n```\n\
  struct binary_tree {\n    struct binary_tree *left;\n    int data;\n    struct binary_tree\
  \ *right;\n};\n```\n\n**链表示的优点：**\n1. 不浪费内存。\n2. 节点的插入和删除更容易。\n\n**链表示的缺点：**\n1.\
  \ 无法直接访问任何节点。\n2. 每个节点需要额外的空间来存储左右地址。\n\n## 5.2.4 二叉树的操作\n\n1. 创建二叉树。\n2. 显示树中每个节点的数据。\n\
  3. 将任何节点作为左孩子或右孩子插入二叉树。\n4. 从二叉树中删除节点。\n\n## 5.2.5 二叉树遍历\n\n遍历树意味着访问访问树中的每个节点。共有六种遍历树的方法。对于这些遍历，我们将使用一些符号：\n\
  \n1. L 表示移动到左孩子。\n2. R 表示移动到右孩子。\n3. R’ 表示移动到根节点或父节点。\n\n因此，L、R、R’ 有六种不同的组合。\n\n\
  然而，其中遍历方法是最重要的，如下：\n\n1. 左-根-右 (LR’R)：中序遍历。\n2. 根-左-右 (R’LR)：前序遍历。\n3. 左-右-根 (R’LR)：后序遍历。\n\
  \n上述所有遍历技术也称为深度优先搜索或深度遍历。\n\n树通常有两种遍历方式：\n\n1. 广度优先遍历 (BFS) 或层序遍历。\n2. 深度优先遍历 (DFS)。\n\
  \n### 5.2.5.1 广度优先遍历或层序遍历\n\n在上述遍历方法中，按层访问项目。因此，首先访问节点 A，然后在第二层首先访问节点 B 然后 C，最后在第三层首先访问节点\
  \ D、F 然后 G（图 5.14）。\n\n![](img/Fig05_14.jpg)\n\n\n\n\n\n# 图 5.14 (C08_chapter5.xhtml_f5_14b)\
  \ 使用广度优先遍历或层序遍历遍历二叉树。\n\n层序遍历顺序如下：A - B - C - D - F – G\n\n## 算法\n\n在二叉树中，首先访问根节点，然后访问其子节点并将其入队列。然后从队列中弹出一个节点，找到它的子节点并再次插入队列，直到所有节点都被访问。\n\
  \n## 二叉树层序遍历算法\n\n1. 创建一个空队列 `q`。\n2. `temp_node = root` // 从根节点开始，并将根节点的值赋值给 `temp_node`\n\
  3. `while temp_node is not NULL` 重复以下步骤\n    1. 3.1 打印 `temp_node->data`。\n    2.\
  \ 3.2. 从左到右依次将 `temp_node` 的子节点入队列 `q`。\n    3. 3.3. 从 `q` 中弹出一个节点并将其值赋值给 `temp_node`。\n\
  4. 停止。\n\n## 广度优先遍历或层序遍历的时间复杂度：O (n)，因为我们恰好访问每个节点一次。\n\n层序遍历所需的额外空间为 O (w)，其中 w\
  \ 是二叉树的最大宽度。在广度优先遍历中，需要一个队列数据结构。在广度优先遍历中，队列逐层存储不同节点。\n\n## 5.2.5.2 深度优先遍历\n\n深度优先遍历有以下三种遍历类型：\n\
  \n1. 中序遍历\n2. 前序遍历\n3. 后序遍历\n\n### 5.2.5.2.1 中序遍历\n\n基本原理是遍历左子树，然后是根节点，最后是右子树（图\
  \ 5.15）。\n\n![](img/Fig05_15.jpg)\n\n### 图 5.15 (C08_chapter5.xhtml_f5_15b) 使用中序遍历方法遍历二叉树。\n\
  \n中序遍历顺序如下：D - B - A - F - C – G\n\n### 5.2.5.2.2 前序遍历\n\n基本原理是先遍历根节点，然后是左子树，最后是右子树（图\
  \ 5.16）。\n\n![](img/Fig05_16.jpg)\n\n### 图 5.16 (C08_chapter5.xhtml_f5_16b) 使用前序遍历方法遍历二叉树。\n\
  \n前序遍历顺序如下：A - B - D - C - F – G\n\n### 5.2.5.2.3 后序遍历\n\n基本原理是先遍历左子树，然后是右子树，最后是根节点（图\
  \ 5.17）。\n\n![](img/Fig05_17.jpg)\n\n### 图 5.17 (C08_chapter5.xhtml_f5_17b) 使用后序遍历方法遍历二叉树。\n\
  \n后序遍历顺序如下：D - B - F - G - C – A\n\n## 5.2.6 简单二叉树实现\n\n创建一个简单的二叉树，第一个元素将形成根节点。对于后续的所有元素，用户必须输入该元素是作为前一个节点的左子节点还是右子节点。\n\
  \n**示例：**\n\n假设 10 是根节点，\n\n![](img/un05_01.jpg)\n\n如果下一个节点是 21，则用户会被要求选择连接在 10\
  \ 的左侧还是右侧。如果用户回答左或 `l`，则树将如下：\n\n![](img/un05_02.jpg)\n\n然后，如果下一个元素是 11，用户再次需要给出选择，是左还是右。这意味着首先要询问用户想将\
  \ 11 附加在根节点 10 的左侧还是右侧。然后，如果用户回答左，再次询问用户是否想将 11 附加在 21 的左侧还是右侧，如果用户回答右，则节点 11 将作为\
  \ 21 的右子节点。\n\n![](img/un05_03.jpg)\n\n这样就生成了一个简单的二叉树。这种创建方法背后的核心思想是始终询问用户想在何处附加下一个节点，并始终从根节点开始扫描树。\n\
  \n**程序：简单二叉树的实现以及在简单二叉树上执行递归插入和遍历操作.**\n\n```\n #include<stdio.h>\n#include<stdlib.h>\n\
  struct bt\n{\nstruct bt *left;\nint data;\nstruct bt *right;\n};\n// 函数声明\nvoid\
  \ insert(struct bt *root, struct bt *new1);\nvoid in-order(struct bt *temp);\nvoid\
  \ preorder(struct bt *temp);\nvoid postorder(struct bt *temp);\n// main 函数定义\n\n\
  int main()\n{\nstruct bt *root, *new1;\nint ch;\nchar c;\nroot=NULL;\ndo\n{\nprintf(\"\
  1\\. Create 2.Inorder 3.Preorder 4.Postorder 5.Exit\");\nprintf(\"\\nEnter choice:\
  \ \");\nscanf(\"%d\",&ch);\nswitch(ch)\ncase 1:\nroot=(struct bt*)malloc(sizeof(struct\
  \ bt));\nprintf(\"Enter data: \");\nscanf(\"%d\",&root->data);\nroot->left=NULL;\n\
  root->right=NULL;\nbreak;\ncase 2:\nnew1=(struct bt*)malloc(sizeof(struct bt));\n\
  printf(\"Enter data: \");\nscanf(\"%d\",&new1->data);\nnew1->left=NULL;\nnew1->right=NULL;\n\
  printf(\"Enter left or right: \");\nscanf(\"%c\",&c);\nif(c=='l'||c=='L')\nroot->left=new1;\n\
  else\nroot->right=new1;\nbreak;\ncase 3:\npreorder(root);\nbreak;\ncase 4:\npostorder(root);\n\
  break;\ncase 5:\nexit(0);\ndefault:\nprintf(\"Invalid choice\");\n}\n} while(1);\n\
  }\nvoid in-order(struct bt *temp)\n{\nif(temp!=NULL)\n{\nin-order(temp->left);\n\
  printf(\"%d\\t\",temp->data);\nin-order(temp->right);\n}\n}\nvoid preorder(struct\
  \ bt *temp)\n{\nif(temp!=NULL)\n{\nprintf(\"%d\\t\",temp->data);\npreorder(temp->left);\n\
  preorder(temp->right);\n}\n}\nvoid postorder(struct bt *temp)\n{\nif(temp!=NULL)\n\
  {\npostorder(temp->left);\npostorder(temp->right);\nprintf(\"%d\\t\",temp->data);\n\
  }\n}\n```\n\n\n\n\n\n### 5.3.3 后序遍历的递归算法\n\n二叉树 `T` 根节点 `R` 的后序遍历。\n\n**算法 `Postorder\
  \ (Root)`**\n\n1. 遍历根节点 `R` 的左子树，即调用 `postorder (left sub-tree)`。\n2. 遍历根节点 `R`\
  \ 的右子树，即调用 `postorder (right sub-tree)`。\n3. 访问并处理根节点 `R`。\n\n## 5.4 根据给定的遍历方法构造二叉树\n\
  \n### 5.4.1 根据给定的中序和前序遍历构造二叉树\n\n举例说明：\n\n1. 中序遍历：14, 7, 21, 8, 15, 11, 61, 99 和\
  \ 33\n2. 前序遍历：11, 21, 14, 7, 15, 8, 33, 61 和 99\n\n前序遍历中的第一个值是二叉树的根节点，因为在前序遍历中，首先遍历根节点，然后遍历左子树，最后遍历右子树。因此，数据为\
  \ 11 的节点成为二叉树的根。在中序遍历中，首先遍历左子树，然后是根节点，最后是右子树。因此，中序列表中 11 之前的数据（即 14, 7, 21, 8 和\
  \ 15）构成了左子树，而中序列表中 11 之后的数据（即 61, 99 和 33）构成了右子树。图 5.18 显示了将树分为左右子树后的树的结构。\n\n![](img/Fig05_18.jpg)\n\
  \n**图 5.18** 二叉树重建第 1 步。\n\n在下一次迭代中，21 是左子树的根。因此，中序列表中 21 之前的数据（即 14, 7）构成了值为 21\
  \ 的节点的左子树。中序列表中位于 21 右侧的数据（即 8, 15）构成了值为 21 的节点的右子树。图 5.19 显示了扩展值为 21 的节点的左右子树后的树的结构。\n\
  \n![](img/Fig05_19.jpg)\n\n**图 5.19** 二叉树重建第 2 步。\n\n现在，前序列表中的下一个数据是 14，所以它现在变为了根节点。中序列表中\
  \ 14 之前的数据构成了值为 14 的节点的左子树。然而，由于中序列表中 14 之前没有数据，值为 14 的节点的左子树为空。中序列表中位于 14 右侧的数据\
  \ 7 构成了值为 14 的节点的右子树。图 5.20 显示了扩展值为 14 的节点的左右子树后的树的结构。\n\n![](img/Fig05_20.jpg)\n\
  \n**图 5.20** 二叉树重建第 3 步。\n\n以此类推，从前序列表中逐个取出所有数据并将其视为根节点，然后从中序列表中找到左右子树中的元素，并以递归方式或非递归方式（即迭代方式）构造整棵树（图\
  \ 5.21 和 5.22）。\n\n![](img/Fig05_21.jpg)\n\n**图 5.21** 二叉树重建第 4 步。\n\n![](img/Fig05_22.jpg)\n\
  \n**图 5.22** 二叉树重建第 5 步。\n\n### 5.4.2 根据给定的中序和后序遍历构造二叉树\n\n举例说明：\n\n1. 中序遍历：4 2\
  \ 5 1 6 7 3 8\n2. 后序遍历：4 5 2 6 7 8 3 1\n\n后序遍历中的最后一个值是二叉树的根节点，因为在后序遍历中，根节点最后被遍历，然后是左子树，最后是右子树。因此，数据为\
  \ 1 的节点成为二叉树的根。在中序遍历中，首先遍历左子树，然后是根节点，最后是右子树。因此，中序列表中 1 之前的数据（即 4, 2, 5）构成了左子树，中序列表中\
  \ 1 之后的数据（即 6, 7, 3, 8）构成了右子树。图 5.23 显示了将树分为左右子树后的树的结构。\n\n![](img/Fig05_23.jpg)\n\
  \n**图 5.23** 二叉树重建第 1 步。\n\n在下一次迭代中，2 是左子树的根，因为它是后序遍历中的最后一个元素。因此，中序列表中 2 之前的数据构成了值为\
  \ 2 的节点的左子树。中序列表中位于 2 右侧的数据构成了值为 2 的节点的右子树。图 5.24 显示了扩展值为 2 的节点的左右子树后的树的结构。\n\n\
  ![](img/Fig05_24.jpg)\n\n**图 5.24** 二叉树重建第 2 步。\n\n现在，前序列表中的下一个数据是 14，所以它现在变为了根节点。中序列表中\
  \ 14 之前的数据构成了值为 14 的节点的左子树。然而，由于中序列表中 14 之前没有数据，值为 14 的节点的左子树为空。中序列表中位于 14 右侧的数据\
  \ 7 构成了值为 14 的节点的右子树。图 5.25 显示了扩展值为 2 的节点的左右子树后的树的结构。\n\n![](img/Fig05_25.jpg)\n\
  \n**图 5.25** （此处应为第 3 步\n\n以此类推，从后序列表中逐个取出所有数据并将其视为根节点，然后从中序列表中找到左右子树中的元素，并以递归方式或非递归方式构造整棵树（图\
  \ 5.26）。\n\n![](img/Fig05_26.jpg)\n\n**图 5.26** 二叉树\n\n### 5.4.3 根据给定的前序和后序遍历构造严格或完全二叉树\n\
  \n如果我们有前序和后序遍历序列，则无法构造普通的二叉树。因为不同的二叉树的前序和后序遍历可能是相同的，如图 5.27 所示。\n\n![](img/Fig05_27.jpg)\n\
  \n**图 5.27** 二叉树。\n\n1. 前序遍历：1 - 2 - 3\n2. 后序遍历：3 - 2 - 1\n\n在图 5.27a 和 b 中，前序和后序遍历得到相同的结果。也就是说，使用前序和后序遍历我们无法预测想要构造的是哪一棵树。这意味着存在歧义。\n\
  \n然而，如果我们知道二叉树是严格或完全二叉树，我们就可以无歧义地构造二叉树。\n\n举例说明：\n\n1. 前序遍历：1 2 4 5 3 7 8\n2. 后序遍历：4\
  \ 5 2 7 8 3 1\n\n后序遍历中的最后一个值是二叉树的根。前序遍历中的第一个值也是根。因此，数据为 1 的节点成为二叉树的根。前序遍历中紧邻 1 的值是左孩子。因此，我们知道\
  \ 1 是根，2 是左孩子。现在知道 2 是左子树所有节点的根。后序列表中 2 之前的所有节点都在左子树，即 4, 5 和 2。现在我们知道 1 是根，4, 5\
  \ 和 2 在左子树中，而 7, 8 和 3 在右子树中（图 5.28 和 5.29）。\n\n![](img/Fig05_28.jpg)\n\n**图 5.28**\
  \ 完全二叉树重建第 1 步。\n\n![](img/Fig05_29.jpg)\n\n**图 5.29** 完全二叉树重建第 2 步。\n\n以此类推，从后序列表中逐个取出最后数据元素并将其视为根节点，然后从中序列表中找到左右子树中的元素，并以递归方式或非递归方式构造整棵树（图\
  \ 5.30）。\n\n![](img/Fig05_30.jpg)\n\n**图 5.30** 完全二叉树重建第 3 步。\n\n\n\n\n\n在简单的二叉树中，节点可以以任何方式分布。根据用户的意愿，新节点可以连接到任何指定节点的左子或右子。在这种情况下，查找任何节点都是一个非常耗时的过程，因为我们必须搜索整棵树。此外，搜索时间的复杂度会不必要地增加。因此，为了加快二叉树的搜索速度，让我们创建二叉搜索树（BST）。BST\
  \ 衍生于二叉搜索算法。在创建 BST 的过程中，数据是有序的。这意味着左子树的值 < 根节点的值 < 右子树的值（图 5.31）。\n\n![](img/Fig05_31.jpg)\n\
  \n`图 5.31`\n\n### 5.5.2 BST 的操作\n\n1. 在 BST 中插入节点\n2. 从 BST 中删除节点\n3. 在 BST 中查找特定节点\n\
  \n让我们来讨论这些操作：\n\n#### 5.5.2.1 在 BST 中插入节点\n\n在 BST 中插入任何节点时，首先要在 BST 中寻找其合适的位置。在图\
  \ 5.32 中，如果我们想插入 32，并将 32 与根节点的值 55 进行比较。由于 32 小于 55，我们将移动左子树。现在我们将 32 与 15 比较，32\
  \ 大于 15，因此移动右子树。再次将 32 与 33 比较，32 小于 33，因此移动左子树，但左子树是空的，我们将 32 挂在 33 的左侧作为其左节点（图\
  \ 5.33）。\n\n![](img/Fig05_32.jpg)\n\n`图 5.32` 在二叉搜索树中插入节点前。\n\n![](img/Fig05_33.jpg)\n\
  \n`图 5.33` 在二叉搜索树中插入节点 32 后。\n\n#### 5.5.2.2 从 BST 中删除节点\n\n从 BST 中删除节点有三种可能的情况：\n\
  \n1. 删除叶子节点\n2. 删除只有一个左子或右子节点的节点\n3. 删除有两个子节点的节点\n\n##### 5.5.2.2.1 删除叶子节点\n\n这是简单的删除，我们首先搜索要删除的节点及其对应的父节点。如果要删除的节点是叶子节点，该节点是其父节点的左孩子或右孩子，则将父节点的左指针或右指针设置为\
  \ `NULL`（图 5.34）。\n\n![](img/Fig05_34.jpg)\n\n`图 5.34` 从二叉搜索树中删除叶子节点前。\n\n在上面的 BST\
  \ 中，值为 33 的节点是一个叶子节点，我们要删除该节点意味着我们将首先在 BST 中搜索节点 33 并找到它的父节点 15。然后找到 33 节点是在 15\
  \ 父节点的左侧还是右侧。在上面的例子中，33 节点在父节点 15 的右侧，因此将 15 节点的右指针设置为 `NULL`。此外，如图 5.35](#C08_chapter5.xhtml_f535)所示释放节点\
  \ 33。\n\n![](img/Fig05_35.jpg)\n\n`图 5.35` 从二叉搜索树中删除节点 33 后。\n\n##### 5.5.2.2.2\
  \ 删除只有一个左或或右节点的节点\n\n我们要从 BST 中删除的节点是一个只有一个右孩子的内部节点，则找到它的父节点并检查该被删除节点是父节点的左孩子还是右孩子。如果被删除节点是父节点的右孩子，则将被删除节点的右孩子的地址拷贝到父节点的右侧（图\
  \ 5.36）。\n\n![](img/Fig05_36.jpg)\n\n`图 5.36` 删除前。\n\n我们想在上面的 BST 中删除节点 33，因为它只有一个左孩子。为了这样做，我们将首先在\
  \ BST 中搜索节点 33 并找到它的父节点 15。然后找到 33 节点是在 15 父节点的左侧还是右侧。在上面的例子中，33 节点在父节点 15 的右侧，因此将\
  \ 15 节点的右指针设置为 `NULL`。此外，如图 5.37](#C08_chapter5.xhtml_f537)所示释放节点 33。\n\n![](img/Fig05_37.jpg)\n\
  \n`图 5.37` 删除节点 33 后。\n\n##### 5.5.2.2.3 删除有两个子节点的节点\n\n我们要从 BST 中删除的节点是一个有两个子节点的内部节点，则找到它的父节点并检查该被删除节点是父节点的左孩子还是右孩子。如果被删除节点是父节点的右孩子，则将被删除节点的右孩子的地址拷贝到父节点的右侧（图\
  \ 5.36）。\n\n![](img/Fig05_38.jpg)\n\n`图 5.36` 删除前。\n\n我们想在上面的 BST 中删除节点 15，因为它有两个子节点。为了这样做，我们将首先在\
  \ BST 中搜索节点 15 并找到它的父节点 55。然后找到 15 节点是在 55 父节点的左侧还是右侧。在上面的例子中，15 节点在父节点 55 的左侧，因此将\
  \ 55 节点的左指针设置为 `NULL`。此外，如图 5.39](#C08_chapter5.xhtml_f539)所示释放节点 15。\n\n![](img/Fig05_39.jpg)\n\
  \n`图 5.39` 删除节点 15 后。\n\n#### 5.5.2.3 在 BST 中查找特定节点\n\n搜索时，我们想要查找的节点被称为键节点（key node）。如果键节点的值大于当前节点，则从根节点开始与每个节点进行匹配，然后在右子树中搜索；否则在左子树中搜索。如果我们到达叶子节点仍未得到键节点的值，则声明“节点不在二叉搜索树中”（图\
  \ 5.40）。\n\n![](img/Fig05_40.jpg)\n\n`图 5.40`\n\n\n\n\n\n```c\n #include<stdio.h>\n\
  #include<stdlib.h>\nstruct bst\n{\nstruct bst *left;\nint data;\nstruct bst *right;\n\
  };\n// 函数原型\nvoid insert(struct bst * root , struct bst * new1);\nvoid in-order(struct\
  \ bst *);\nstruct bst * search(struct bst * root, int key, struct bst **parent);\n\
  void delet(struct bst *, int key);\n// 主函数定义\nint main()\n{\nint choice, key;\n\
  char ch;\nstruct bst *root,*new1,*temp,*parent;\nroot=NULL;\nparent=NULL;\nprintf(\"\
  \\n 二叉搜索树:\");\ndo\n{\nprintf(\"1.插入\\t 2.显示 \\t 3.搜索 \\t 4.删除 \\t 5.退出\\n \");\n\
  printf(\" 输入您的选择\");\nscanf(\"%d\", &choice);\nswitch(choice)\n{\ncase 1:      \
  \ \ndo\n{\nnew1=(struct bst *)malloc(sizeof(struct bst));\nprintf(\" 输入数据\");\n\
  scanf(\"%d\",&new1->data);\nnew1->left=NULL;\nnew1->right=NULL;\nif(root==NULL)\n\
  {\nroot=new1;\n}\nelse\n{\ninsert(root,new1);\n}\nprintf(\"\\n 您想再插入另一个节点吗[y/n]:\
