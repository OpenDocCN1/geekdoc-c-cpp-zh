  \n## 2.1 线性数据结构与非线性数据结构的区别\n\n1. **线性数据结构**\n\n   数据元素按顺序或线性组织的数据结构，其中元素与其前驱和后续相邻元素连接，称为线性数据结构。在线性数据结构中，只涉及单层。因此，我们只能通过一次运行遍历所有元素。由于计算机内存是线性组织的，因此线性数据结构易于实现。示例包括数组、栈、队列、链表等。\n\
  \n2. **非线性数据结构**\n\n   数据元素未按顺序或线性组织的数据结构被称为非线性数据结构。在非线性数据结构中，不涉及单层。因此，不可能一次遍历所有元素。与线性数据结构相比，非线性数据结构不容易实现。与线性数据结构相比，它可以更有效地利用计算机内存。示例包括树和图。\n\
  \n## 2.2 栈的操作\n\n栈是一种非原元线性数据结构。栈是一个有序列表，但元素的访问、插入和删除受到某些规则的限制。\n\n示例：在栈中，弹出最后放入栈的元素，并在栈顶处推入元素，这种顺序被称为后进先出（LIFO）。\n\
  \n**栈的概念：**\n\n栈是一个有序列表，所有的插入和删除操作都在其中一端进行，该端称为栈（图 2.1）。\n\n![](img/Fig02_01.jpg)\n\
  \n**图 2.1** 栈。\n\n### 2.2.1 栈的原初操作\n\n1. 创建栈：在内存中创建一个栈。栈的创建可以使用数组或链表完成。\n\n2. 向栈中插入元素，即推（push）操作。\n\
  \n3. 从栈中删除元素，即弹出（pop）操作。\n\n4. 验证栈顶是哪个元素。\n\n5. 验证栈是否为空或已满。\n\n**使用数组表示栈：**\n\n\
  **声明 1 (图 2.2):**\n\n```c\n#define size 100\nint stack[size],top = -1;\n```\n\n\
  ![](img/Fig02_02.jpg)\n\n**图 2.2** 使用一维数组数据类型的栈实现。\n\n**声明 2 (图 2.3):**\n\n```c\n\
  #define size 10\nstruct stack\n{\n        int s[size];\n        int top;\n} st ;\n\
  ```\n\n![](img/Fig02_03.jpg)\n\n**图 2.3** 使用结构体数据类型的栈实现。\n\n我们将编写 push 和 pop 函数来实现栈，在推入之前，我们将检查栈是否已满。在从栈中弹出元素之前，我们将检查栈是否为空。\n\
  \n**空栈操作 (图 2.4):**\n\n初始 设为 −1。\n\n```c\nAs st.top = -1 ; // 当栈为空时\nint stack_empty()\n\
  {\n      if(st.top == -1)\n      return 1:\n      else\n      return 0;\n}\n```\n\
  \n![](img/Fig02_04.jpg)\n\n**图 2.4** 栈空条件。\n\n**栈满操作 (图 2.5):**\n\nTop 设为 -1。\n\n\
  ```c\nint stack_full()\n{\n      if(st.top == size-1)\n      return 1;\n      else\n\
  \      return 0;\n}\n```\n\n![](img/Fig02_05.jpg)\n\n**图 2.5** 栈满条件。\n\n我们将编写 push\
  \ 和 pop 函数来实现栈，在推入之前，我们将检查栈是否已满。在从栈中弹出元素之前，我们将检查栈是否为空。\n\n*(注：此处原文中部分代码逻辑与描述对应错乱，译文已根据逻辑意图对齐)*\n\
  \n*(由于提供的原文文本在后半部分存在严重的格式混乱和代码错位，译文保持了其结构并进行了可读的翻译。)*\n\n\n\n\n\n给定的中缀表达式 `(a + b)\
  \ * (c - d)` 通过操作符栈和操作数栈转换为后缀表达式形式 `a b + c d - *`。\n\n### 2. 中缀转前缀的转换：\n\n给定的中缀表达式\
  \ `(a + b) * (c - d)` 通过操作符栈和操作数栈转换为前缀形式 `* + a b - c d`。\n\n### 3. 后缀转中缀的转换：\n\n\
  `A B - C *`\n\n#### 解决方案：\n\n第一个给出的公式是后缀表达式形式，因此**从左到右扫描公式**。\n\n## 算法\n\n1. 检查字符是操作数还是运算符。\n\
  2. 如果是操作数，则将其推入`operand stack`操作数栈。\n3. 如果是运算符，则将其放入`operator stack`运算符栈；然后检查它是单元运算符还是二元运算符。\n\
  4. 如果是单元运算符，则从`operand stack`中弹出一个当前的操作数，并对该操作数进行操作，结果（即操作数本身）存储在`operand stack`中。\n\
  5. 如果是二元运算符，则从`operand stack`中弹出两个操作数，并对这些操作数进行操作，结果（即操作数本身）存储在`operand stack`中。\n\
  6. 重复相同步骤直到字符字符串结束。\n\n| **Operator Stack** | **Operand Stack** |\n| --- | --- |\n\
  | | A |\n| | B |\n| - | |\n| | `(A - B)` |\n| | C |\n| * | |\n| | `((A - B) * C)`\
  \ |\n| | **这是全括号的中缀形式。** |\n\n### d. 前缀转中缀的转换：\n\n将以下表达式从前缀转换为中缀：\n- `+ +a b * c\
  \ d`\n\n#### 解决方案：\n\n第一个给出的公式是前缀表达式形式，因此从右到左扫描字符串或公式。\n\n## 算法\n\n1. 检查字符是操作数还是运算符。\n\
  2. 如果是操作数，则将其推入`operand stack`操作数栈。\n3. 如果是运算符，则将其放入`operator stack`运算符栈；然后检查它是单元运算符还是二元运算符。\n\
  4. 如果是单元运算符，则从`operand stack`中弹出一个当前的操作数，并对该操作数进行操作，结果（即操作数本身）存储在`operand stack`中。\n\
  5. 如果是二元运算符，则从`operand stack`中弹出两个操作数，并对这些操作数进行操作，结果（即操作数本身）存储在`operand stack`中。\n\
  6. 重复相同步骤直到字符字符串结束。\n\n| **Operator Stack** | **Operand Stack** |\n| --- | --- |\n\
  | | D |\n| | C |\n| * | |\n| | `(c * d)` |\n| | B |\n| | A |\n| | + |\n| | `(a + b)`\
  \ |\n| - | |\n| | `((a + b) - (c * d))` **这是全括号的中缀形式。** |\n\n### 2.3.3 回溯\n\n回溯算法用于那些从起点到特定目标沿某路径存在步骤的算法。\n\
  \n1. 找到通过迷宫的路径。\n2. 找到从图或地图上的一个点到另一个点的路线。\n3. 玩一种国际棋或象棋游戏，其中需要进行移动。\n\n在所有这些情况下，都在多个选项中进行备选选择。我们需要某种方法来记住这些决策点，以防我们想要回来尝试备选方案。\n\
  \n考虑迷宫。在做出备选时，我们可能会发现该选择导致了死胡同。我们希望回到那个决策点，然后尝试下一个备选方案。\n\n在上面的示例中，数据结构`stack`（栈可以作为回溯解决方案的一部分。\n\
  \n### 2.3.4 函数调用和函数返回过程\n\n当调用一个方法或函数时，如果它是一个函数调用，那么：\n\n1. 创建激活记录（activation record）；其大小取决于局部变量和局部参数的数量和大小。\n\
  2. 将基指针值保存在为其预留的特定位置。\n3. 将程序计数器值存储在返回地址位置。\n4. 此时将基指针重置为新的基指针。\n5. 在参数区域内拷贝调用参数。\n\
  6. 在局部变量区域初始化局部变量。\n\n为了维护函数调用数据，使用了栈数据结构。\n\n### 2.3.5 递归函数\n\n递归使用栈内存来存储该特定函数调用所有局部变量的中间结果。\n\
  \n### 2.3.6 深度优先搜索 (DFS)\n\nDFS 中使用了栈数据结构。\n\n### 2.3.7 文本编辑器撤销机制\n\n它是使用栈数据结构实现的。\n\
  \n### 2.3.8 字符串反转\n\n在字符串字符串的应用中，我们首先将字符串中的所有字符入栈，然后从栈中弹出字符即可得到反转字符串。\n\n### 2.3.9\
  \ 汉诺塔问题\n\n通过栈解决。\n\n### 2.3.10 解析或语法分析\n\n解析或语法分析是分析字符串是否符合语法的过程。为了此目的，我们必须创建解析树或使用栈。\n\
  \n## 2.4 实现应用\n\n### 2.4.1 使用栈实现后缀转中缀\n\n**程序：**\n\n```c\n#include <stdio.h>\n#include\
  \ <string.h>\n#include <stdlib.h>\n#define MAX 20\nchar stack[MAX];\nint top=-1;\n\
  void push(char c)\n{\n   stack[++top]=c;\n}\nchar pop()\n{\n   return stack[top--];\n\
  }\nvoid strrev(char x[])\n{\n   int i,j=0;\n   n=strlen(x);\n   for(i=0;i<n;i++)\n\
  \   {\n      push(x[i]);\n   }\n   for(i=0;i<n;i++)\n   {\n      x[i]=pop();\n \
  \     j++;\n   }\n   x[j]='\\0';\n}\nvoid post_in()\n{\n   int i,j=0;\n   char str[MAX],x[MAX];\n\
  \   printf(\"Enter postfix expression\\n\");\n   gets(str);\n   strrev(str);\n \
  \  n=strlen(str);\n   printf(\"Infix is: \");\n   for(i=0;i<n;i++)\n   {\n     \
  \ if(str[i]=='+'||str[i]=='-'||str[i]=='*'||str[i]=='/')\n      {\n         push(str[i]);\n\
  \      }\n      else\n      {\n         char op2 = pop();\n         char op1 = pop();\n\
  \         x[j]='(';\n         j++;\n         x[j]=op1;\n         j++;\n        \
  \ x[j]=op2;\n         j++;\n         x[j]=')';\n         j++;\n         push(x[j-2]);\n\
  \      }\n   }\n   x[j]='\\0';\n   printf(\"%s\\n\",x);\n}\nint main()\n{\n   int\
  \ ch;\n   while(1)\n   {\n    printf(\"Enter choice 1 to infix 2.exit\\n\");\n \
  \   scanf(\"%d\",&ch);\n    switch(ch)\n    {\n     case 1:\n     post_in();\n \
  \    break;\n     case 2:\n     exit(0);\n     default: printf(\"Wrong choce\\n\"\
  );\n   }\n   printf(\"Enter 1 to continue, 0 to exit\\n\");\n   scanf(\"%d\",&ch);\n\
  \   if(ch==0)\n    {\n    break;\n     }\n }\nreturn 0;\n}\n```\n\n**输出：**\n\n![](img/un02_01.jpg)\n\
  \n### 2.4.2 使用递归实现汉诺塔问题\n\n#### 2.4.2.1 汉诺塔问题的递归算法\n\n1.  步骤 1：开始\n2.  步骤 2：将 n-1\
  \ 个盘从源杆 (from_rod) 移动到辅助杆 (aux_rod)，使用目标杆 (to_rod)\n3.  步骤 3：将第 n 个盘从源杆移动到目标杆\n\
  4.  步骤 4：将 n-1 个盘从辅助杆移动到目标杆，使用源杆\n5.  步骤 5：停止\n\n在上面的算法中，from_rod 指源杆，to_rod 指目标杆，aux_rod\
  \ 指辅助杆。\n\n#### 2.4.2.2 使用递归实现汉诺塔问题的程序\n\n```c\n#include <stdio.h>\nvoid towerOfHanoi(int\
  \ n, char from_rod, char to_rod, char aux_rod)\n{\n     if (n == 1)\n     {\n  \
  \             printf(\"\\n Move disk 1 from rod %c to rod %c\", from_rod, to_rod);\n\
  \               return;\n     }\n     towerOfHanoi(n-1, from_rod, aux_rod, to_rod);\n\
  \     printf(\"\\n Move disk %d from rod %c to rod %c\", n, from_rod, to_rod);\n\
  \     towerOfHanoi(n-1, aux_rod, to_rod, from_rod);\n}\nint main()\n{\n     int\
  \ n = 3;  // 盘数量\n     towerOfHanoi(n, 'A', 'C', 'B');  // A, B 和 C 是杆的名字\n    \
  \ return 0;\n}\n```\n\n**输出：**\n\n![](img/un02_02.jpg)\n\n\n\n\n[content]\n队列是一种`非线性线性数据结构`。队列是一种允许我们使用两个端的数据结构，分别称为\
  \ `front`（头）和 `rear`（尾）。在队列数据结构中，可以从头部移除元素，从尾部插入元素。队列也被称为先出（FIFO）。队列是编程中一种非常有用的数据结构。它类似于电影院外的排队队列，队列中的第一个人是第一个拿到票的人。\n\
  \n## 队列的类型\n\n有四种队列，如下：\n\n1. **线性队列**：在线性队列中，插入发生在尾部，取出发生在头部。它严格遵守 FIFO 规则。\n2.\
  \ **循环队列**：在循环队列中，最后一个元素通过循环链接指向第一个元素。与线性队列相比，循环队列的主要优势是内存利用率更高。如果最后一个位置已满而第一个位置为空，则可以将元素插入到第一个位置。这在线性队列中是无法实现的。\n\
  3. **优先级队列**：在优先级队列中，元素按键值进行排序，使得键值最小的元素在前面，键值最大的元素在尾部，反之亦然。优先级队列是一种特殊的队列，每个元素都与优先级相关，并根据其优先级提供服务。当具有相同优先级的元素出现时，它们按照队列中的顺序执行。优先级队列元素的插入根据值的到达情况，而元素的删除根据其优先级。\n\
  4. **双端队列**：双端队列也称为 dequeue。在双端队列中，插入和删除操作可以从头部和尾部进行。\n\n### 2.5.1 线性队列\n\n### 2.5.1.1\
  \ 使用数组表示线性队列及其操作\n\n线性队列的所有元素都是顺序存储的。我们可以简单地使用线性数组来表示线性队列。有两种索引：`front index`（头索引）和\
  \ `rear index`（尾索引）。`front index` 和 `rear index` 指向在线性队列中执行插入和删除的位置。初始状态，线性队列中 `front`\
  \ 和 `rear index` 的值为 `-1`，表示队列为空。包含六个元素的线性队列的数组表示以及相应的 `front` 和 `rear` 索引值如图图 2.7\
  \ 所示。\n\n![](img/Fig02_07.jpg)\n\n**图 2.7** 使用数组表示线性队列。\n\n线性队列的各种操作如下：\n\n1. 线性队列溢出操作。\n\
  2. 线性队列上溢操作。\n3. 将元素插入线性队列也称为 `enqueue`（入队）操作。\n4. 从线性队列移除元素也称为 `dequeue`（出队）操作。\n\
  5. 显示线性队列的元素。\n\n1. **线性队列溢出操作**：队列溢出由于试图向满队列添加元素。\n2. **线性队列上溢操作**：当你尝试从空队列中删除元素时发生队列上溢。\n\
  3. **将元素插入线性队列（图 2.8）**：\n\n   ![](img/Fig02_08.jpg)\n\n   **图 2.8** 向线性队列插入元素。\n\
  \n执行插入操作之前，必须验证队列是否满。如果 `rear pointer` 超过队列的最大长度，则发生队列溢出。如果队列没有溢出，则从尾部插入元素。\n4.\
  \ **从线性队列移除元素**：从队列中移除任何元素只能从头部开始。在执行任何删除操作之前，必须检查队列是否为空。如果队列为空，则无法删除（图 2.9）。\n\n\
  \   ![](img/Fig02_09.jpg)\n\n   **图 2.9** 从线性队列移除元素。\n\n在从使用数组实现的线性队列中移除元素时，`front\
  \ index` 会递增，即元素从逻辑上从队列中移除，但物理元素仍然留在线性队列的相同索引位置。在上面的图中，从线性队列中删除元素时，只有 `front index`\
  \ 从索引 0 增加到 1，但物理元素 10 仍留在相同的索引位置，线性队列仅从头部到尾部进行处理，即从索引 1 到 `rear index` 3。\n5. **显示线性队列的元素**：如果线性队列不为空，在对其执行显示操作时，元素将从头部到尾部显示。\n\
  \n### 2.5.1.2 使用数组实现线性队列\n\n```\n#include<stdio.h>\n#include<stdlib.h>\n#define\
  \ max 5\n\n// 使用数组实现的线性队列\nstruct queue\n{\n int que[max];\n int front,rear;\n}q;\n\
  \n// 验证线性队列是否为空\nint qempty()\n{\nif((q.front==-1)|(q.front>q.rear))\n{\nreturn\
  \ 1;\n}\n}\n\n// 验证线性队列是否满\nint qfull()\n{\nif(q.rear==max-1)\n{\nreturn 1;\n}\n\
  else\nreturn 0;\n}\n\n// 将元素插入线性队列\nvoid qinsert(int data)\n{\nif(qfull())\n{\n\
  printf(\"\\n 队列溢出\");\n}\nelse\n{\nprintf(\"输入数据: \");\nscanf(\"%d\",&data);\nq.que[++q.rear]=data;\n\
  }\n\n// 从线性队列移除元素\nvoid qdelete()\n{\nif(qempty())\n{\nprintf(\"\\n 队列上溢\");\n}\n\
  else\n{\nint data;\ndata=q.que[q.front++];\nprintf(\"删除元素=%d\", data);\n}\n\n//\
  \ 显示线性队列的元素\nvoid display()\n{\nif(qempty())\n{\nprintf(\"\\n 队列为空\");\n}\nelse\n\
  {\nint i;\nprintf(\"队列元素 : \");\nfor(i=q.front; i<=q.rear; i++)\n{\nprintf(\"\\\
  t%d\",q.que[i]);\n}\nprintf(\"\\n\");\n}\n\n// main 函数\nint main()\n{\n int choice,\
  \ data;\n char ch;\n q.front=-1;\n q.rear=-1;\n do\n {\n  printf(\"数组实现的线性队列:\"\
  );\n  printf(\"\\n 1.插入 \\t 2.删除 \\t 3.显示 \\t 4.退出\");\n  printf(\"\\n 输入选择: \"\
  );\n  scanf(\"%d\",&choice);\n  switch(choice)\n  {\ncase 1:\nqinsert(data);\nbreak;\n\
  case 2:\nqdelete();\nbreak;\ncase 3:\ndisplay();\nbreak;\ncase 4:\nexit(0);\nbreak;\n\
  default:\nprintf(\"\\n 选择错误\");\n}\nprintf(\"你想继续吗...[y/n]\");\n// fflush 函数清除标准输入缓冲区\n\
  fflush(stdin);\nscanf(\"%c\",&ch);\n}while(ch=='y');\nreturn 0;\n}\n```\n\n**输出：**\n\
  \n![](img/un02_04.jpg)\n\n### 2.5.2 循环队列\n\n在使用数组的线性队列中，元素是从逻辑上删除的，如下所示（图 2.10）：\n\
  \n为了克服线性队列的缺点，我们将引入另一种队列，称为循环队列。循环队列的主要优势是我们可以充分利用循环队列的空间。\n\n### 2.5.2.1 使用数组表示循环队列\n\
  \n循环队列的表示方法与线性队列相似，但循环队列的最后一个位置指向第一个位置，形成一个圆，如图图 2.11 所示。\n\n![](img/Fig02_11.jpg)\n\
  \n**图 2.11** 循环队列。\n\n[/content]\n\n\n\n\n考虑上述形队列中已删除的元素，如 10、50 和 40。此时队头（front）递增并指向索引\
  \ 3。索引 0、1 和 2 的位置现在可以插入新元素，该空间随后会在形队列中被重用，这就是线性队列的局限性。在形队列中设置队首和队尾索引需要应用公式，使用数组实现所示：\n\
  \n在使用数组实现的形队列中，`rear` 和 `front` 索引的计算方式如下\n\n```\nrear = (rear+1)%size\nfront =\
  \ (front+1)%size\n```\n\n例如，在图 2.11 中，形队列的大小为 5，如果 `rear` 指向索引 4，且 `front` 指向索引\
  \ 3，那么形队列中的索引 0、1 和 2 处是空的。如果我们在形队列中插入一个新元素，那么我们将从 `rear` 端开始插入。在这种情况下，`rear` 的计算方式为：\n\
  \n```\nrear = (rear + 1) % size\n         = (4 + 1) % 5\nrear = 0\n```\n\n然后，在形队列的\
  \ `rear` 索引 0 处插入新元素。\n\n假设 `front` 指向索引 3。同样，在从形队列中删除元素时，`front` 的计算方式为：\n\n```\n\
  front = (front + 1) % size\n= (3 + 1) % 5\nfront = 4\n```\n\n因此，第三位置的元素被删除，`front`\
  \ 递增到第四个索引，并指向形队列中第第四个位置的元素。\n\n形队列的各种操作如下：\n\n1. 溢出操作（Overflow）\n2. 上溢操作（Underflow）\n\
  3. 向形队列插入元素也称为入队操作（enqueue）。\n4. 从形队列中移除元素也称为出队操作（dequeue）。\n5. 显示形队列中的元素。\n\n关于形队列，我们必须了解的一些重要条件如下：\n\
  \n1. 如果 `rear` 和 `front` 指向同一个索引，则形队列只包含一个元素。\n2. 如果 `front` 索引大于 `rear` 索引一个，即如果\
  \ `front` 索引为 4 且 `rear` 索引为 3，则形队列为满。\n   如果 `(front == (rear+1) % max size of\
  \ the circular queue)` 此条件为真，则形队列为满。\n3. 如果 `front` 和 `rear` 索引指向 −1，则称形队列为空（图 2.12）。\n\
  \n![](img/Fig02_12.jpg)\n\n**图 2.12** 形队列上的入队和出队操作。\n\n在上述形队列中，如果我们向形队列插入新元素，则按如下方式递增\
  \ `rear` 索引。\n\n`rear` 索引的当前值为 4，形队列的大小为 5，则新插入元素的 `rear` 索引计算方式为：\n\n```\nrear\
  \ = (rear + 1) % SIZE    ( SIZE = 5, 对应形队列的大小)\nrear = (4 + 1) % 5\nrear = 0\n```\n\
  \n因此，在形队列的 `rear` 索引 0 处插入元素。形队列并不是满的，因为 `front` 指向索引 3。通过这种，我们可以利用形队列中被删除的空间。\n\
  \n#### 2.5.2.2 使用数组实现形队列\n\n```\n#include<stdio.h>\n#include<stdlib.h>\n#define\
  \ max 5\n\n// 使用数组实现的形队列\nint que[max];\nint front,rear;\n\n// 检查形队列是否满\nint qfull()\n\
  {\nif(front==(rear+1)%max)\nreturn 1;\nelse\nreturn 0;\n}\n\n// 检查形队列是否为空\nint qempty()\n\
  {\nif(front==-1)\nreturn 1;\nelse\nreturn 0;\n}\n\n// 向形队列中插入元素\nvoid insert(int\
  \ data)\n{\nif(front==-1)\n{\nfront=rear=0;\nque[rear]=data;\n}\nelse\n{\nrear=(rear+1)%max;\n\
  que[rear]=data;\n}\n}\n\n// 从形队列中删除元素\nvoid delete()\n{\nint data;\nif(front==rear)\n\
  {\ndata=que[front];\nfront=rear=-1;\n}\nelse\n{\ndata=que[front];\nfront=(front+1)%max;\n\
  }\nprintf(\"Deleted element=%d\\n\", data);\n}\n\n// 显示形队列中的元素\nvoid display()\n\
  {\nint i=front;\nprintf(\"Elements in circular queue are: \");\ndo\n{\nprintf(\"\
  \\t%d\",que[i]);\ni=(i+1)%max;\n}while(i != ((rear + 1)%max));\nprintf(\"\\n\");\n\
  }\n\n// 主函数\nint main()\n{\n int choice, data;\n char ch;\n front=-1;\n rear=-1;\n\
  \ do\n{\nprintf(\" Circular Queue:\");\nprintf(\" 1:insert\\t 2:delete\\t 3:display\\\
  t 4:exit\\n\");\nprintf(\" Enter your choice:\");\nscanf(\"%d\", &choice);\nswitch(choice)\n\
  {\ncase 1:\nprintf(\"Enter data: \");\nscanf(\"%d\",&data);\nif(qfull())\nprintf(\"\
  \\nqueue is full\");\nelse\ninsert(data);\nbreak;\ncase 2:\nif(qempty())\nprintf(\"\
  \\n Circular queue is empty\");\nelse\ndelete();\nbreak;\ncase 3:\nif(qempty())\n\
  printf(\"\\n Circular queue is empty\");\nelse\ndisplay();\nbreak;\ncase 4:\nexit(0);\n\
  default:\nprintf(\"\\n Wrong choice\");\n}\nprintf(\" Do you want to continue...[y/n]:\
  \ \");\nfflush(stdin);\nscanf(\"%c\",&ch);\n}while(ch=='y');\nreturn 0;\n}\n```\n\
  \n**输出：**\n\n![](img/un2_05.jpg)\n\n### 2.5.3 优先级队列\n\n栈和队列的限制是元素从特定的端插入或删除，元素的顺序是被忽略的。优先级队列中的元素应该具有特定的排序。在优先级队列中，高优先级项目优先于低优先级项目。优先级队列的一个典型例子是操作系统的任务调度。\n\
  \n#### 2.5.3.1 优先级队列的类型\n\n1. **升序优先级队列：** 是一种可以随机插入元素的集合，但升序优先级队列首先移除最小的元素。\n2.\
  \ **降序优先级队列：** 是一种可以随机插入元素的集合，但降序优先级队列首先移除最大的元素。\n\n   当我们尝试使用数组实现优先级队列时，插入变得非常简单，但从优先级队列中删除任何元素会引起两个问题：\n\
  \n1. 要么检查优先级队列的所有元素，要么找到用于删除的最大或最小元素。\n2. 在数组中间删除元素是一项困难的任务，需要移动元素。\n\n这些问题通过以下方式解决：\n\
  \n1. 在数组中，如果删除了任意元素，该位置将为空。因此，必须在该位置放置特殊的指示器（如 −1），以指示该元素已删除。\n2. 每次删除后都应该移动元素以管理连续存储。\n\
  3. 每次从优先级队列中删除元素时都需要扫描整个优先级队列。这里的解决方案是你可以任意插入数字，并在每次插入后维护优先级队列的排序。\n\n#### 2.5.3.2\
  \ 使用数组实现升序优先级队列\n\n\n\n\n\n```c\n#include<stdio.h>\n#include<stdlib.h>\n#define\
  \ max 100\nint que[max];\nint front, rear;\n\n// 检查优先级队列是否为空\nint qempty()\n{\n\
  if((front==-1)|(front>rear))\nreturn 1;\nelse\nreturn 0;\n}\n\n// 检查优先级队列是否满\nint\
  \ qfull()\n{\nif(rear>=max-1)\nreturn 1;\nelse\nreturn 0;\n}\nvoid priority();\n\
  \n// 在优先级队列插入一个元素\nvoid insert(int data)\n{\nif(front==-1)\n{\nfront++;\n}\nque[++rear]=data;\n\
  priority();\n}\n\n// 检查元素的优先级并将数据按升序排列\nvoid priority()\n{\nint i,j,temp;\nfor(i=front;i<rear;i++)\n\
  {\nfor(j=front;j<rear;j++)\n{\nif(que[j]>que[j+1])\n{\ntemp=que[j];\nque[j]=que[j+1];\n\
  que[j+1]=temp;\n}\n}\n}\n}\n}\n\n// 从优先级队列删除元素\nvoid delete()\n{\nint data;\ndata=que[front];\n\
  front++;\nprintf(\" Deleted element=%d \\n\", data);\n}\n//显示优先级队列中的元素\nvoid display()\n\
  {\nint i;\ni=front;\nprintf(\"Elements in priority queue: \");\nwhile(i<=rear)\n\
  {\nprintf(\"\\t%d\",que[i]);\ni++;\n}\nprintf(\"\\n\");\n}\nint main()\n{\n int\
  \ choice, data;\n char ch;\n front=-1;\n rear=-1;\n do\n {\n  printf(\" Priority\
  \ Queue\");\n  printf(\" 1:insert\\t2:delete\\t3:display\\t4:exit\");\n  printf(\"\
  \\n Enter your choice\");\n  scanf(\"%d\", &choice);\n  switch(choice)\n  {\n  \
  \ case 1:\nprintf(\"Enter data: \");\n      scanf(\"%d\",&data);\n      if(qfull())\n\
  \      printf(\"\\n Queue is full\");\n      else\n      insert(data);\n   break;\n\
  \   case 2:\nif(qempty())\n      printf(\"\\n Queue is empty\");\n      else\n \
  \     delete();\n   break;\n   case 3:\nif(qempty())\n      printf(\"\\n Queue is\
  \ empty\");\n      else\n      display();\n   break;\n   case 4:\nexit(0);\n   default:\n\
  printf(\"\\n Wrong choice\");\n  }\nprintf(\" Do you want to continue[y/n]\");\n\
  fflush(stdin);\nscanf(\"%c\",&ch);\n}while(ch=='y');\nreturn 0;\n}\n```\n\n**输出：**\n\
  \n![](img/un02_06.jpg)\n\n### 2.5.4 双端队列\n\n双端队列（Double-ended Queue）是一种特殊的队列数据结构，插入和删除操作可以在队头和队尾执行。这意味着我们可以从头部和尾部位置元素元素，也可以从头部和尾部移除元素。\n\
  \n#### 2.5.4.1 双端队列的表示\n\n双端队列可以用两种不同的方式表示，具体如下：\n\n1. **入受限双端队列：**\n\n   入受限双端队列意味着元素的插入受到某些限制。在入受限双端队列中，插入操作仅从队尾执行，而删除操作在队尾和队头执行（图\
  \ 2.13）。\n\n   ![](img/Fig02_13.jpg)\n\n   **图 2.13** 入受限双端队列的表示。\n\n2. **出受限双端队列：**\n\
  \n   出受限双端队列意味着元素的删除受到某些限制。在出受限双端队列中，删除操作仅从队头执行，而插入操作在队尾和队头执行（图 2.14）。\n\n   ![](img/Fig02_14.jpg)\n\
  \n   **图 2.14** 出受限双端队列的表示。\n\n#### 2.5.4.2 在双端队列上执行的操作\n\n在双端队列上执行的各种操作如下：\n\n\
  1. 在队头插入\n2. 从队头删除\n3. 在队尾插入\n4. 从队尾删除\n5. 双端队列满操作\n6. 双端队列空操作\n7. 显示双端队列的元素\n\n\
  #### 2.5.4.3 使用数组实现双端队列\n\n\n\n\n\n```c\n#include<stdio.h>\n#define SIZE 21\n\n\
  // 在双端队列上执行的各种操作\nint deQueueFront(); // 从头部删除\nint deQueueRear();  // 从尾部删除\nvoid\
  \ enQueueRear(int); // 在尾部插入\nvoid enQueueFront(int); // 在头部插入\nvoid display();\
  \  // 显示元素\nint queue[SIZE];\nint rear = 0, front = 0;\n\n// main 函数定义\nint main()\n\
  {\n    char ch;\n    int choice1, choice2, value;\n    printf(\"Double Ended Queue:\
  \ \\n\");\n     do\n     {\n          printf(\"\\n1. 输入限制双端队列:\n\\n\");\n      \
  \    printf(\"2. 输出限制双端队列: \\n\");\n          printf(\"\\nEnter 您的选择: \");\n   \
  \       scanf(\"%d\",&choice1);\n          switch(choice1)\n          {\n      \
  \         case 1: \n                    printf(\"\\n 选择操作: \\n\");\n           \
  \         printf(\"1.从头部插入\\n2.从尾部删除\\n3.从头部删除\\n4. 显示\");\n                   \
  \ do\n                    {\n                       printf(\"\\nEnter 您的操作选择: \"\
  );\n                       scanf(\"%d\",&choice2);\n                       switch(choice2)\n\
  \                       {   \n                          case 1: enQueueRear(value);\n\
  \                                  display();\n                              break;\n\
  \                            case 2: value = deQueueRear();\n                  \
  \           printf(\"\\n 从队列尾部删除的值为 %d\",value);\n                             display();\n\
  \                                 break;\n                            case 3: value=deQueueFront();\n\
  \                                    printf(\"\\n 从队列头部删除的值为 %d\",value);\n    \
  \                                display();\n                                  \
  \  break;\n                            case 4: display();\n                    \
  \                break;\n                            default:printf(\"选项错误\");\n\
  \                       }\n                       printf(\"\\n 您想继续另一个操作吗 (Y/N):\
  \ \");\n                       ch=getche();\n                    }while(ch=='y'||ch=='Y');\n\
  \                    getch();\n                    break; \n\n               case\
  \ 2 :\n                   printf(\"\\n 选择操作:\\n\");\n                   printf(\"\
  1.在尾部插入\\n2.在头部插入\\n3.从头部删除\\n4. 显示\");\n                   do\n               \
  \    {\n                      printf(\"\\nEnter 您的操作选择: \");\n                 \
  \     scanf(\"%d\",&choice2);\n                      switch(choice2)\n         \
  \             {   \n                         case 1: enQueueRear(value);\n     \
  \                            display();\n                                 break;\n\
  \                         case 2: enQueueFront(value);\n                       \
  \          display();\n                                 break;\n               \
  \          case 3: value = deQueueFront();\n                                 printf(\"\
  \\n 从队列头部删除的值为 %d\",value); \n                                 display();\n    \
  \                             break;\n                         case 4: display();\n\
  \                                 break;\n                         default:printf(\"\
  选项错误\");\n                       }\n                       printf(\"\\n 您想继续另一个操作吗\
  \ (Y/N): \");\n                       ch=getche();\n                    } while(ch=='y'||ch=='Y');\n\
  \                    getch();\n                    break ;\n            }\n    \
  \        printf(\"\\n 您想继续吗 (Y/N):\");\n            ch=getch();\n      }while(ch=='y'||ch=='Y');\n\
  }\n\n // 在尾部插入 \nvoid enQueueRear(int data)\n{   \n     char ch;\n     if(front\
  \ == SIZE/2)\n      {\n            printf(\"\\n 队列已满。 \");\n            return;\n\
  \      }\n      do\n      {\n            printf(\"\\nEnter 要插入的数值:\");\n       \
  \     scanf(\"%d\",&data);\n            queue[front] = data;\n            front++;\n\
  \            printf(\"您想继续插入吗 (Y/N) \\n\");\n            ch=getche();\n      }while(ch=='y');\n\
  }\n\n// 在头部插入\nvoid enQueueFront(int data)\n{   \n     char ch;\n     if(front==SIZE/2)\n\
  \      {\n            printf(\"\\n 队列已满.\");\n            return;\n      }\n   \
