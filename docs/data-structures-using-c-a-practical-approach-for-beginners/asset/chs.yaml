  Enter adjacency matrix of the graph: \\n\");\nfor(i=0;i<n;i++)\n{\n        for(j=0;j<n;j++)\n\
  \        {\n        scanf(\"%d\",&G[i][j]);\n        }\n}\n//访问数组初始化为零\nfor(i=0;i<n;i++)\n\
  {\n        visited[i]=0;\n}\n//以 0 节点为起始节点调用 DFS\nprintf(\"DFS traversal of a graph\
  \ : \");\nDFS(0); \nreturn 0;;\n}\n// 递归 DFS 函数定义\nvoid DFS (int i)\n{\nint j;\n\
  printf(\"\\t %d\",i);\nvisited[i]=1;\nfor(j=0;j<n;j++)\n{\n        if(!visited[j]\
  \ && G[i][j] == 1)\n        {\n            DFS(j);\n        }\n}\n```\n\n#### 6.3.2.6\
  \ 使用 DFS 技术遍历图的时间复杂度\n\n如果使用邻接矩阵实现，时间复杂度为 O(V²)；如果使用邻接表实现，时间复杂度为 O(V+E)。\n\n####\
  \ 6.3.2.7 DFS 的优点\n\n1. 消耗的内存较少。\n2. 在某些目标时比 BFS 找到更快。\n\n#### 6.3.2.8 DFS 的缺点\n\
  \n1. 状态可能会陷入循环。\n\n#### 6.3.2.9 DFS 的应用\n\n1. 寻找连通分量。\n2. 寻找强连通分量。\n3. 解决迷宫问题。\n\
  4. 寻找图中的环。\n\n## 6.4 用于最短路径的图应用\n\n设 `G = (V, E)` 是一个具有 `n` 个顶点的图。问题是找到从顶点到所有其他顶点的距离。\n\
  \n#### 6.4.1.1 Dijkstra 算法\n\nDijkstra 算法也称为单源最短路径算法。它是基于贪心策略的。我们使用：\n\n1. visited\
  \ 数组\n2. cost 矩阵\n3. distance 矩阵\n\n1 开始。\n2. 从邻接矩阵创建代价矩阵 `C[]`。如果顶点 `i` 和 `j` 之间没有边，则将\
  \ `C[i][j]` 设置为无穷。\n3. `visited[]` 数组初始化为零。\n4. 如果顶点 0 是源顶点，则 `visited[0]` 标记为 1。\n\
  5. 构建距离矩阵存储从顶点 0 到所有顶点的代价。\n```\nfor(i=1; i<n; i++)\n    distance [i] = cost [0]\
  \ [i];\n```\n6. 选择一个顶点 `w`，`distance[w]` 最小且 `visited[w]` 为 0。将 `visited[w]` 标记为\
  \ 1。重新计算其余顶点的最短距离。只有 `visited[]` 数组中未标记为 1 的顶点才会被重新计算。即：\n```\nfor 每个顶点 v\nif (visited[v]==0)\n\
  distance [v]=min (distance[v], distance[w] + cost[w][v])\n```\n7. 停止。\n\n#### 6.4.1.2\
  \ 时间复杂度\n\nT (n) = O (n²)\n\n#### 6.4.1.3 展示 Dijkstra 算法运行的示例\n\n在所示图中展示 Dijkstra\
