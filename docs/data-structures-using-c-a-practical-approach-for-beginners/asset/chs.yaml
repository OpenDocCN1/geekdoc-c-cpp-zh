  \ 的子集，它用最少的边连接所有顶点。\n\n如果图中的所有顶点都是连通的，那么至少存在一个生成树。在图中，可能存在多个生成树。如果图 `G` 包含 `n` 个顶点，则生成树包含\
  \ `n` 个顶点和 `(n-1)` 条边。\n\n#### 6.4.2.2 生成树的属性\n\n1. 生成树中没有环。\n2. 从任意顶点可以到达其他任何顶点。\n\
  \n`Minimum Spanning Tree (MST)` 是连通加权无向图的边子集，它以最小的总边权重连接所有顶点。\n\n#### 6.4.2.3 生成树示例\n\
