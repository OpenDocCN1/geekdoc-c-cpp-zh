  \ 函数结束\n// 主函数\nint main()\n{\n int choice;\n char ch;\n start=NULL;\n printf(\"\
  双向线性链表: \");\n do\n {\n  printf(\"1\\. 创建\\t2\\. 显示\\t3\\. 删除\\t4\\. 退出\");\n  printf(\"\
