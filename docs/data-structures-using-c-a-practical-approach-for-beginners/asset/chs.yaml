  scanf(\"%d\",&pos);\nif( pos > (count+1))\n{\nprintf(\"\\n 您的选择错误\");\ngoto lable1;\n\
  }\nif(pos==1)    //如果在双向线性链表的第一个位置插入\n{\nstart->prev=new1;\nnew1->next=start;\n\
  start=new1;\nstart->prev=NULL;\n}\nelse                // 如果在双向线性链表第一个位置以外的位置插入\n\
  {\ntemp=start;\nwhile(i < (pos-1))  //遍历 temp 指针，直到 temp\n指针包含我们要插入的节点节点的前一个 \n\
  {\ntemp=temp->next;\ni++;\n}\nnew1->next=temp->next;\ntemp->next=new1;\nnew1->prev=temp;\n\
  }\ndisp(); // 显示从起始节点到结束的所有节点。\n}\n```\n\n---\n\n## 4.7 双向循环链表\n\n双向循环链表包含两个指针：previous\
  \ 和 next 指针。previous 指针指向前一个节点，next 指针指向下一个节点或包含下一个节点的地址。最后一个节点的 next 指针存储第一个节点的地址，第一个节点的\
  \ previous 指针存储双向循环链表中最后一个节点的地址。\n\n### 4.7.1 程序：双向循环链表的实现\n\n\n\n\n\n```c\n#include<stdio.h>\n\
  #include<stdlib.h>\nstruct node\n{\nint data;\nstruct node* prev;\nstruct node*\
  \ next;\n}*start,*new1,*temp,*prev,*last;\n//last 指针存储双向循环链表中末尾节点的地址\nvoid insert_at_end();\n\
  void display();\nvoid reverse();\nvoid delet();\n//main 函数\nint main()\n{\nint c;\n\
  char ch;\nprintf(\"双向循环链表: \\n\");\ndo\n{\nprintf(\"1.末尾插入(Insert_at_end)  2.逆序显示节点\
  \  3. 删除节点  4. 显示节点\");\nprintf(\"\\n 输入您的选择: \");\nscanf(\"%d\", &c);\nswitch(c)\n\
  {\ncase 1:\n      insert_at_end();\n      break;\ncase 2:\n      reverse();\n  \
  \    break;\ncase 3:\n      delet();\n      break;\ncase 4:\n      display();\n\
  \      break;\ndefault:\n      printf(\"\\n 您输入的选项错误。\\n\");\n}\nfflush(stdin);\n\
  printf(\"您要继续吗(Y/N): \");\nscanf(\"%c\",&ch);\n}while(ch=='Y'||ch=='y');\nreturn\
  \ 0;\n}\nvoid display()\n{\nif(start==NULL)\n{\nprintf(\"\\n 未创建双向循环链表。\\n\");\n\
  return;\n}\nelse\n{\nprintf(\"双向循环链表数据:\");\ntemp=start;\ndo\n{\nprintf(\"%d\\t\"\
  ,temp->data);\ntemp=temp->next;\n} while(temp!=start);\nprintf(\"\\n\");\n}\n}\n\
  void insert_at_end()\n{\nnew1=(struct node*)malloc(sizeof(struct node));\nprintf(\"\
  输入节点数据: \");\nscanf(\"%d\",&new1->data);\nnew1->next=NULL;\nnew1->prev=NULL;\nif(start==NULL)\n\
  {\nstart=new1;\nstart->next=start;\nstart->prev=start;\n}\nelse\n{\ntemp=start;\n\
  do\n{\ntemp=temp->next;\n} while(temp->next!=start);\ntemp->next=new1;\nnew1->prev=temp;\n\
  new1->next=start;\nstart->prev=new1;\n}\ndisplay();\n}\n// 逆序显示双向循环列表中的数据\nvoid\
  \ reverse()\n{\nif(start==NULL)\n{\nprintf(\"\\n 未创建双向循环链表.\");\nreturn;\n}\nelse\n\
  {\ntemp=start;\ndo               // 使用 do-while 循环我们需要将 temp 指针移动到最后一个节点\n// 此处使用\
  \ do-while 或 while 循环均可\ntemp=temp->next;\n} while(temp->next!=start);\n// 现在退出\
  \ do-while 后，temp 指针包含双向链表末尾节点的地址\ndo\n{\nprintf(\"\\t%d\",temp->data);\ntemp=temp->prev;\n\
  }while(temp!=start->prev);\n// 从最后一个节点到第一个节点逆序显示数据\nprintf(\"\\n\");\n}\nvoid delet()\n\
  {\nint num,found=0;\nif(start==NULL)\n{\nprintf(\"未创建双向循环链表。\\n\");\nreturn;\n}\n\
  else\n{\nprintf(\"输入要删除的节点值: \");\nscanf(\"%d\",&num);\n// 如果链表仅有一个节点且与要删除的节点匹配\n\
  if(start==start->next && num==start->data)\n{\nstart->next=NULL;\nstart->prev=NULL;\n\
  free(start);\nstart=NULL;\nprintf(\"删除的节点是 %d\\n\",num);\nreturn;\n}\n// 如果链表仅一个节点且与要删除的节点不匹配\n\
  if(start==start->next && num!=start->data)\n{\nprintf(\"\\n 双向循环链表中不存在该数据 \\n\"\
  );\nreturn;\n}\ntemp=start;\ndo\n{\nif(temp->data==num)\n{\nfound=1;\n}\nelse\n\
  {\ntemp=temp->next;\n}\n}while(found!=1 && temp!=start);\nif(found==0)   //如果在双向循环列表中未找到节点\n\
  {\nprintf(\"\\n 双向循环链表中不存在该节点 \\n\");\nreturn;\n}\nelse       //如果在双向循环列表中找到了节点\n\
  {\nif(temp==start)   //如果要从双向循环列表中删除第一个节点\n{\nlast=start;\ndo\n{\nlast=last->next;\n\
  }\nwhile(last->next!=start);\nstart=start->next;\nlast->next=start;\nstart->prev=last;\n\
  temp->next=NULL;\ntemp->prev=NULL;\nfree(temp);\ntemp=NULL;\n}\nelse   //如果要从双向循环列表中删除第一个以外的节点\n\
  {\n(temp->prev)->next=temp->next;\n(temp->next)->prev=temp->prev;\ntemp->next=NULL;\n\
  temp->prev=NULL;\nfree(temp);\ntemp=NULL;\n}\nprintf(\"删除的节点是 %d\\n\",num);\n}\n\
  }\n}\n```\n\n**输出：**\n\n![](img/un04_04.jpg)\n\n## 4.8 使用链表实现栈\n\n### 4.8.1 使用链表表示栈\n\
  \n- 使用链表实现栈的优点是不需要考虑栈的大小。\n- 节点是动态创建的，因此不需要担心栈溢出。\n- 使用链表表示栈的结构：\n\n```c\nstruct\
  \ stack\n{\n      int data;\n      struct stack *next;\n};\n```\n\n### 4.8.2 程序：使用链表实现栈\n\
