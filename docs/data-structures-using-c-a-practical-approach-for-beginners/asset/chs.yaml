  ![](img/un06_27.jpg)\n\n**访问数组：**\n\n### 6.4.2 最小生成树\n\n#### 6.4.2.1 生成树与最小生成树的基本概念\n\
  \n生成树（Spanning tree）是给定图的一个极小子图，它们遵循或满足以下所有三个条件：\n\n1. 生成树中的顶点数量等于给定图 `G` 中的顶点数量。\n\
