  \ `60` 优于现有距离 `∞` 或 `infinity`。\n5. 从源顶点 `0` 出发通过选定的顶点 `1` 到顶点 `3` 的代价为：`distance\
  \ [1] + cost [1] [3] = 10 + ∞=∞`，这比现有距离 `30` 大。\n6. 同样，通过顶点 `1` 到顶点 `4` 的代价为 `∞`，这比现有距离\
