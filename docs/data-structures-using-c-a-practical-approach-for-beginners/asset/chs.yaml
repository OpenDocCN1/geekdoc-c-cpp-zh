  双向线性链表中的数据如下: \\n\");\nwhile(temp!=NULL)\n{\nprintf(\"\\t%d\",temp->data);\ntemp=temp->next;\n\
  }\nprintf(\"\\n\");\n}\n}\n\n// 从双向线性链表中删除节点。\nvoid delete_node()\n{\n int num;\n\
  \ int found=0;\n temp=start;\n // 双向线性链表为空\n if(start==NULL)\n {\n  printf(\"\\\
  n 双向线性链表为空。 \\n\");\n  return;\n }\n // 双向线性链表已创建并包含一些节点\n else\n{\n  printf(\"\
  输入想要删除的数据: \");\n  scanf(\"%d\",&num);\n  // 搜索我们要删除的元素，并将要删除的节点地址\n  // 存储到 temp\
  \ 指针中\n  while((found==0)&&(temp!=NULL))\n  {\n   if(temp->data==num)\n   {\n  \
  \     found=1;\n   }\n   else\n   {\n       temp=temp->next;\n   }\n  }\n  // 数据元素不在双向线性链表中\n\
  \  if(found==0)\n  {\n   printf(\"\\n 未找到节点。 \\n\");\n   return;\n  }\n  // 数据元素存在于双向线性链表中\n\
  \  else\n  {\n   // 我们要删除的节点是双向线性链表的第一个节点\n   if(temp==start)\n   {\n       if(temp->next!=NULL)\
  \ // 双向线性链表包含一个以上的节点且我们要删除的是第一个节点\n{\n     start=start->next;\n     temp->next=NULL;\n\
  \     start->prev=NULL;\n     free(temp);\n     temp=NULL;\n     }else // 双向线性链表只包含一个节点且我们要删除的是第一个节点\n\
  \     {\n     free(temp);\n     start=NULL;\n     }\n   }\n   // 我们要删除的节点是双向线性链表中第一个节点以外的节点\n\
  \ else\n   {\n       if(temp->next!=NULL) // 删除的节点不是双向线性链表的最后一个节点\n       {\n  \
  \       (temp->prev)->next=temp->next;\n         (temp->next)->prev=temp->prev;\n\
  \       }else   // 删除的节点是双向线性链表的最后一个节点\n       {\n       (temp->prev)->next=NULL;\n\
