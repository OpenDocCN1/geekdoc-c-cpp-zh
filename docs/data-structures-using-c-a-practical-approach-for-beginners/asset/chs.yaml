  %d\",&data);\n            rear--;\n            queue[rear] = data;\n           \
  \ printf(\"您想继续插入吗 (Y/N\");\n            ch = getche();\n      }\n      while(ch\
  \ == 'y');\n}\n\n// 从尾部删除\nint deQueueRear()\n{\n     int deleted;\n     if(front\
  \ == rear)\n     {\n            printf(\"\\n 队列为空。 \");\n            return 0;\n\
  \     }\n     front--;\n     deleted = queue[front+1];\n     return deleted;\n}\n\
  \n// 从头部删除\nint deQueueFront()\n{\n     int deleted;\n     if(front == rear)\n \
  \    {\n            printf(\"\\n 队列为空。 \");\n            return 0;\n     }\n   \
  \  rear++;\n     deleted = queue[rear-1];\n     return deleted;\n}\n\n// 显示元素 \n\
  void display()\n{\n     int i;\n     if(front == rear)\n        printf(\"\\n 队列为空。\
  \ \");\n     else{\n        printf(\"\\n 队列元素为:\");\n        for(i=rear; i < front;\
