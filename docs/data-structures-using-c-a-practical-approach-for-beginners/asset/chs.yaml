  \ = %ld\\n\", number, factorial(number));\nreturn 0;\n}\nlong factorial(int n)\n\
  {\nint c;\nlong fact = 1;\nfor (c = 1; c <= n; c++)\n{\nfact = fact * c;\n}\nreturn\
