  }\n```\n\n1. `x` 存储在堆内存分区区，`y` 存储在全局分区区，`z` 存储在栈分区区。\n2. 变量 `x`、`y` 和 `z` 存储在栈分区区。\n\
  3. `x` 存储在堆内存，`y` 和 `z` 变量存储在栈分区区。\n4. `x` 和 `y` 存储在堆内存分区，`z` 存储在栈分区区。\n\n**答案：(A)**\n\
