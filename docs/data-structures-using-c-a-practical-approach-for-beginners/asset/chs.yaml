  \n### 6.3.2 图的 DFS 遍历\n\n#### 6.3.2.1 DFS 基础\n\n在图的 DFS 遍历中，我们尽可能深度地沿着路径移动。当没有相邻顶点存在时，我们会回溯并寻找未访问的顶点。我们将维护一个访问数组来标记所有已访问的顶点。标记为已访问的节点不应被选择进行遍历。访问顶点的标记可以使用全局数组\
  \ `visited[]` 完成。`visited[]` 数组初始化为 0。\n\n#### 6.3.2.2 非递归 DFS 算法\n\n1. 将节点 `V1`\
  \ 推入栈中。\n2. 打印节点 `V1` 的值。\n3. 在 `visited` 数组中将节点 `V1` 的值标记为 `1`。\n4. 找到节点 `v1` 的所有相邻节点。\n\
  5. 重复步骤 4 直到所有相邻节点结束。\n6. 如果节点 `v1` 没有任何相邻节点，则从栈中弹出节点 `V1`。\n7. 重复步骤 1–6 直到栈为空。\n\
  \n#### 6.3.2.3 递归 DFS 算法\n\n1. 步骤 1：开始\n2. 步骤 2：`n` - 图 `G` 中的节点数量。\n3. 步骤 3：初始化\
  \ `visited[]` 为 `0`\n\n```\nfor(i=0; i<n; i++)\nvisited [i]= 0\n```\n\n4. 步骤 4：空函数\
  \ `DFS(vertex i)`\n```\n{\n    print i;\n    visited [i] = 1;\n    for each w adjacent\
  \ to i\n    if (! visited [w])\n    DFS (w);\n}\n```\n\n5. 步骤 5：停止。\n\n#### 6.3.2.4\
  \ 深度优先遍历 (DFS) 逻辑说明\n\n在 DFS 中，存储相邻节点的节点数据结构是 `stack`。在我们的程序中，我们使用了 `DFS` 函数的递归调用。当触发递归调用时，会执行入栈操作。当我们退出循环时，将执行出栈操作（图\
  \ 6.28）。\n\n![](img/Fig06_28.jpg)\n\n**图 6.28** 一个无向图。\n\n**步骤 1：** 从顶点 0 开始，打印它，因此打印了‘0’节点。标记\
  \ 0 节点为已访问。\n\n![](img/un06_12.jpg)\n\n**步骤 2：** 找到 0 的相邻顶点，有两个相邻顶点 1 和 2，其中选择一个，假设选择了节点\
  \ 1，如果它未被访问，则调用 `DFS(1)`，即 1 将被插入栈中，在 `visited` 数组中标记节点 1 为已访问。\n\n![](img/un06_13.jpg)\n\
  \n退出循环 1 后，将弹出 1 并打印 1。\n\n**步骤 3：** 找到 1 的相邻顶点，即顶点 0 或 3，但 0 已经访问，因此选择剩余的节点 3，如果它未被访问并调用\
  \ `DFS(3)`，即 3 将推入栈，在 `visited` 数组中标记其为已访问。\n\n![](img/un06_14.jpg)\n\n退出循环 3 后，将弹出\
  \ 3 并打印 3。\n\n**步骤 4：** 找到 3 的相邻顶点顶点 2，如果它未被访问，则调用 `DFS(2)`，即 2 将推入栈，并在 `visited`\
  \ 数组中标记节点 2 为已访问。\n\n![](img/un06_15.jpg)\n\n退出循环 2 后，将弹出 2 并打印 2。\n\n由于所有节点都已访问一次，因此停止程序。\n\
  \n因此 DFS 的输出是 0 1 3 2。\n\n#### 6.3.2.5 使用 DFS 技术实现图的遍历\n\n```c\n#include<stdio.h>\n\
  void DFS( int );  //DFS 函数声明\nint G[10][10], visited[10], n;  //n 是顶点数量，\n     \
