  \n## 3.1 空指针\n\n整数类型指针指向值类型的整数变量，浮点类型指针指向浮点值类型变量，以此此类推。在 C 语言中，有一种通用指针可以指向任何数据类型，被称为空指针（void\
  \ pointer）。空指针也称为通用指针（generic pointer）。空指针是指没有关联数据类型。空指针可以保存任何数据类型的地址，并可以强制转换为任何其他数据类型。\n\
  \n有时，我们知道需要一个指针，但不一定知道它指向什么类型的数据。C/C++ 语言允许一种特殊的指针称为空指针，它允许我们产生一个非特定类型的指针，这意味着它可以限制指向任何内容。\n\
  \n### 3.1.1 为什么空指针很有用？\n\n`malloc()` 是一个动态内存管理函数，返回类型为 `void *`。`malloc()` 函数在堆分区上动态预留内存并返回该内存位置的起始地址，我们将该地址存储在任何指针类型的变量中。在这里，我们同样不知道存储地址的数据类型，即预先不知道是哪种数据类型。因此，决定为\
  \ `malloc()` 分配哪种返回类型非常困难，所以该函数的返回类型必须是 `void *`，即通用指针是唯一的解决方案。\n\nC 语言中的空指针用于在\
  \ C 语言中实现通用函数。\n\n**语法：**\n\n```\n void * vptr;\n```\n\n在对指针解引用之前，必须进行合适的类型转换，如下：\n\
  \n![](img/un03_01.jpg)\n\n### 3.1.2 程序：将浮点型或整型变量赋值给空指针，并在解引用空指针时转换为特定的数据类型\n\n```\n\
  #include<stdio.h>\nint main ()\n{\nint x = 100;\nfloat y = 50.50;\nint *iptr;\n\
  float *fptr;\nvoid *vptr;\niptr = &x;\nfptr = &y;\n// iptr = &y;     /* 语法错误，int\
  \ 指针指向 float */\nvptr = &x;        /* 有效，空指针指向 int  */\nprintf(\"\\n  x= %d  \"\
  \ , *((int*)vptr) );     /* 通过 int 类型转换 */\nvptr = &y;                         \
  \         /* 有效，空指针指向 float  */\nprintf(\"y= %f\", *((float *)vptr));\nreturn 0;\n\
  }\n```\n\n**输出：**\n\nx = 100\n\ny = 50.50\n\n**在打印空指针中的值时，必须进行类型转换，否则空指针的值将无法显示。**\n\
  \n**解引用空指针：**\n\n我们使用间接运算符 `*` 来实现解引用。然而，在空指针的情况下，我们需要对指针变量进行类型转换才能解引用。这是因为空指针没有关联的数据类型。编译器无法知道或猜测空指针指向的是哪种数据。因此，为了获取空指针指向的数据，我们将其转换为空指针位置上存储的正确类型。\n\
  \n### 3.1.3 程序：将空指针地址赋值给浮点型或整型指针类型变量并解引用空指针\n\n```\n#include<stdio.h>\n#include<conio.h>\
  \ \n\n//main 函数定义\nvoid main()\n{\nint a=21;\nfloat b=21.21;\nvoid *ptr;  // 声明一个空指针\n\
  ptr=&a;  // 将整数地址赋值给空指针\nprintf(\"The value of integer is %d\", *((int*)ptr));\n\
  ptr=&b;  // 将浮点数地址赋值给空指针\nprintf(\"The value of float is %f\", *((float*)ptr));\n\
  }\n```\n（注：此处原文存在大量重复和不完整的描述，已根据核心逻辑进行翻译）\n\n\n\n\n```c\n#include <stdio.h>\nstruct\
  \ student\n{\nchar name[10];\nint * roll_no;    //结构体指针类型数据成员\n} stud;\nint main()\n\
  {\nint a=21;\nstruct student *pt;      // 结构体指针类型变量\npt=&stud;\npt->roll_no =&a;\n\
  printf(\"Enter roll number \\n\");\nscanf(\"%d\",&(*(pt->roll_no)));\nprintf(\"\
  Enter  name \\n\");\nscanf(\"%s\", pt->name);         \nprintf(\"\\n Accessing student\
  \ structure data members using structure's pointer variable \");\nprintf(\"\\n Name:\
  \ %s Roll Number: %d \", pt->name, *(pt->roll_no));\nreturn 0;\n}\n```\n\n**输出：**\n\
  \nEnter roll number\n\n21\n\nEnter name\n\nxyz\n\nAccessing student structure data\
  \ members using structure’s pointer variable\n\nName: xyz Roll Number: 21.\n\n###\
  \ 3.2.3 程序：结构体指针变量的递增\n\n```c\n#include <stdio.h>\nstruct student\n{\nchar name[10];\n\
  int  roll_no;\n} stud[2]={{\"amol\",21},{\"suraj\",31}};\nint main()\n{\nstruct\
  \ student *pt;\npt=&stud[0];\nprintf(\"\\n Accessing student structure roll number\
  \ using ++pt->roll_no: \");\n++pt->roll_no;\n/* 首先通过指针 pt 获取 roll 号 的值，然后增加学号，所以输出为\
  \ 22 */\nprintf(\"\\n Roll Number = %d\",pt->roll_no);\nprintf(\"\\n Accessing student\
  \ structure roll number using (++pt)->roll_no: \");\n(++pt)->roll_no;  \n/* 首先存储在指针\
  \ pt 中的地址递增，然后显示该地址处的值，所以输出为 31 */\nprintf(\"\\n Roll Number = %d\",pt->roll_no);\n\
  return 0;\n}\n```\n\n**输出：**\n\nAccessing student structure roll number using ++pt->roll_no:\n\
  \nRoll Number = 22.\n\nAccessing student structure roll number using (++pt)->roll_no:\n\
  \nRoll Number = 31.\n\n**解释：**\n\n**++pt→roll_no;**\n\n这里首先计算 `pt->roll_no` 的值，然后该学号值递增。因此，`pt->roll_no`\
  \ 的值为 21，在加 1 后变为 22。\n\n**然而使用 (++pt) →roll_no;：**\n\n先递增 `pt` 意味着地址增加 1（即一个位置），然后给出该地址处结构体数据成员的值，该值是\
  \ 31。\n\n## 3.3 动态内存分配\n\n在 C 语言中，元素的数量（即数组的大小）需要在编译时指定。\n\n如果对大小的初始判断错误，会导致程序失败或浪费内存空间。在执行过程中进行内存分配的过程被称为动态内存分配。“C”语言提供了**“内存管理函数”**，可用于在程序执行期间分配内存和释放内存。对于动态内存管理，**使用了\
  \ RAM 的堆内存分区**。\n\n**内存分配函数：**\n\n| 函数 | 任务 |\n| --- | --- |\n| `malloc` | `malloc()`\
  \ 函数为单个元素分配请求的字节数，并返回指向分配空间第一个字节的指针，且**初始元素值是随机值**。 |\n| `calloc` | `calloc()` 函数为元素数组分配空间，将其初始化为零，并返回指向分配空间第一个字节的指针。\
  \ |\n| `free` | `free()` 函数释放之前由 `malloc()`、`calloc()` 或 `realloc()` 函数分配的空间。 |\n\
  | `realloc` | `realloc()` 函数更改已分配空间的大小。 |\n\n### 3.3.1 分配内存块：`malloc()` 函数\n\n`malloc()`\
  \ 函数的通用语法或函数原型为：\n\n```c\nptr= (cast_type *) malloc(byte_size);\n```\n\n`malloc()`\
  \ 函数返回 `void *`，因此如果接收的变量是 `int *`，则必须进行类型转换。\n\n**示例：**\n\n```c\nchar *cptr;\n\
  cptr=(char*) malloc (10);\n```\n\n为字符分配 10 字节的空间，并将第一个字节的地址存储在指针变量 `cptr` 中，如图所示：\n\
  \n![](img/un03_02.jpg\n\n动态分配的存储空间没有名称，因此只能通过指针访问其内容。\n\n`Structure_pointer_variable=(struct\
  \ stud *) malloc (sizeof( struct stud)) );`\n\n其中 `Structure_pointer_variable` 是一个\
  \ **类型为 struct stud 的指针**。\n\n记住，**`malloc()` 函数**分配的是块**连续的字节**。\n\n如果堆上的空间不足以满足请求，分配可能会失败。如果失败，它返回\
  \ **NULL 地址**。\n\n### 3.3.2 分配多个内存块：`calloc()` 函数\n\n**`calloc()` 函数**分配多个存储块，每个块的大小相同，然后将所有字节块设置为零。\n\
  \n```c\nstruct stud *s;\ns=(struct stud*)calloc(30,sizeof(struct\nstud) );\n```\n\
  \n**calloc 函数的通用语法：**\n\n`ptr =(cast_type *) calloc (n, element_size);`\n\n其中 `n`=\
  \ 元素个数\n\n`element_size`= 每个元素的大小的大小。\n\n### 3.3.3 使用 `free()` 函数释放已用空间\n\n编译时通过\
  \ `malloc()`、`calloc()` 或 `realloc()` 分配存储变量。`free()` 函数释放空间。\n\n**free 函数的通用语法或函数原型：**\n\
  \n`void free(void *ptr);`\n\n`free()` 函数释放堆区的内存。\n\n**程序：以下程序展示了 `malloc()` 和 `free()`\
  \ 函数的使用。**\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include<string.h>\n\
  \n// main 函数\nint main()\n{\n   char *str;\n\n   /* 使用 malloc 函数初始内存分配 */\n   str\
  \ = (char *) malloc (15);\n   strcpy(str, \"Amol Jagtap\");\n   printf(\"String\
  \ = %s, Address = %u\\n\", str, str);\n   free(str); // 从堆释放内存\n   return 0;\n}\n\
  ```\n\n让我们编译并运行上述程序，这将产生结果：\n\n**输出：**\n\nString = Amol Jagtap, Address = 35509448\n\
  \n### 3.3.4 realloc 函数\n\nrealloc()` 函数更改由 `malloc()` 或 `calloc()` 分配的内存块的大小。\n\n\
  realloc 函数的通用语法或函数原型为：\n\n`void * realloc (void *ptr, size_t size);`\n\n`ptr` 参数作为原始内存块的指针。新大小（字节）由\
  \ `size` 指定。`realloc()` 函数有几种可能的结果。如果有足够的空间扩展 `ptr` 所向的内存块，则分配额外的内存并返回 `ptr`。\n\n\
  如果当前位置没有足够的空间扩展当前块，则分配一个新大小的块，并将现有数据从旧块复制到新块的开头。释放旧块，并返回指向新块的指针。\n\n如果 `ptr` 参数为\
  \ `NULL`，该函数的作用类似于 `malloc()`，分配 `size` 字节的块并返回其指针。如果参数 `size` 为 0，则 `ptr` 指向的内存被释放，且函数返回\
  \ `NULL`。\n\n如果内存不足以通过扩展旧块或分配新块来重新分配，函数将返回 `NULL`。\n\n程序：实现一个使用 `realloc()` 增加动态分配内存块大小的程序。\n\
  \n\n\n\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n\
  //main 函数定义\nint main ()\n{\nchar buf[80], *message;\n/* 输入任意字符串 */\nputs(\"Enter\
  \ a line of text.\");\ngets(buf);\n/* 分配初始块并将字符串拷贝到其中\n强制转换为 char * 是必须的 */\nmessage\
  \ = (char *) realloc(NULL, strlen(buf)+1);\nstrcpy(message, buf);\n/* 在控制台上显示输入的消息\
  \ */\nputs(message);\n/* 从用户处获取另一个字符串。 */\nputs(\"Enter another line of text.\"\
  );\ngets(buf);\n/* 动态增加字符串所需的空间，然后\n将字符串连接到它。 */\nmessage = (char *) realloc(message,(strlen(message)\
  \ +\nstrlen(buf)+1));\nstrcat(message, buf);\n/* 在控制台上显示连接后的消息 */\nputs(message);\n\
  return 0;\n }\n```\n\n**输出:**\n\nEnter a line of text.\n\nHello students.\n\nHello\
  \ students.\n\nEnter another line of text.\n\nWelcome to our class.\n\nHello students.\
  \ Welcome to our class.\n\n## 3.4 内存泄漏\n\n内存泄漏发生在程序员在堆分区上动态创建内存但忘记删除它时。在这里，编译时分配的内存将由运行时环境根据变量的生命周期移除。然而，动态分配的内存不会被自动删除，为了这一目的，程序员必须编写相应的代码，在\
  \ C 语言中，使用 `free()` 函数来释放动态分配的内存。\n\n### 3.4.1 程序：演示带有内存泄漏的函数\n\n```c\n#include\
  \ <stdlib.h>\n#include<stdio.h>\nvoid fun()\n{\nint *ptr = (int *) malloc(sizeof(int));\n\
  printf(\"\\n Memory allocated dynamically for integer\nvariable\");\n}\nint main()\n\
  {\nfun();\nreturn 0;\n}\n```\n\n在这里，在函数 `fun` 中，为 `int` 动态分配了内存但没有释放，导致程序在执行执行结束后堆上的内存仍保持分配状态。为了实现这一目的，使用了\
  \ `free` 函数。为了避免内存泄漏，在不再需要时必须始终释放在堆上分配的内存。\n\n### 3.4.2 程序：演示没有内存泄漏的函数\n\n```c\n\
  #include <stdlib.h>\n#include<stdio.h>\nvoid fun()\n{\nint *ptr = (int *) malloc(sizeof(int));\n\
  printf(\"\\n Memory allocated dynamically for integer variable\");\nfree (ptr);\
  \   // 释放为整数变量动态分配的内存\n}\nint main()\n{\nfun();\nreturn 0;\n}\n```\n\n使用 `free`\
  \ 函数，我们必须释放堆上动态分配的内存。因此，堆分区上的内存会被其他变量再次使用，内存泄漏问题得以解决。\n\n## 3.5 悬空指针\n\n悬空指针指向之前已经释放的内存位置。该存储空间不再可用。访问该内存可能会导致段错误或导致程序崩溃。\n\
  \n指针可以通过三种方式成为悬空指针，下文解释：\n\n### 3.5.1 释放指针指向的内存会导致悬空指针\n\n```c\n#include <stdlib.h>\n\
  #include <stdio.h>\nint main()\n{\nint *ptr = (int *)malloc(sizeof(int));\n/* 在调用\
  \ free 函数后，指针 ptr 变成了一个悬空\n指针，因为分配给 ptr 的动态内存变为\n空，且 ptr 指向堆上未被分配的内存位置。 */\nfree(ptr);\
  \ \n// 给 ptr 指针赋值 NULL 地址，现在 ptr 指针不再是悬空指针。\nptr = NULL;\nreturn 0;\n}\n```\n\n\
  ### 3.5.2 函数调用\n\n当局部变量是非静态的且向另一个函数返回地址时，指向局部变量的指针会变成悬空。\n\n```c\n#include <stdio.h>\n\
  int * sample()\n{\n/* x 是一个局部变量，在 sample() 函数执行结束后它会离开作用域，且变量将变为失效。 */\nint x =\
  \ 21;\nreturn &x;\n}\nint main ()\n{\nint *p = sample ();\nfflush(stdin);\n// p\
  \ 指向的内容不再有效了。\nprintf(\"%d\", *p);\nreturn 0;\n}\n```\n\n**输出:**\n\nSegmentation\
  \ Fault（段错误）\n\n作为运行时错误。\n\n该问题的解决方案：\n\n当局部变量是静态的时，指向局部变量的指针不会变成悬空。\n\n```c\n#include\
  \ <stdio.h>\nint * sample()\n{\n/* x 是局部变量但它是静态的，因此在 sample() 函数执行结束后变量不会\n变为失效。为变量\
  \ x 留的值和内会在整个程序执行期间保持有效。 */\nstatic int x = 21;\nreturn &x;\n}\nint main()\n{\n\
  int *p = sample();\nfflush(stdin);\n// 不是悬空指针，因为它指向静态变量。\nprintf(\"%d\", *p);\n\
  return 0;\n}\n```\n\n**输出:**\n\n21\n\n### 3.5.3 当局部变量离开作用域或生命周期结束\n\n```c\nint main()\n\
  {\nint *ptr;\n{\nint i;\nptr = &i;    // 块 1\n}\nreturn 0;\n}\n```\n\n**在这里 `ptr`\
  \ 指针是悬空指针，因为在块 1 之后变量 `i` 的值失效了，且变量 `i` 的作用域结束了。也就是说指针再次失效.**\n\n## 3.6 面试题\n\n\
