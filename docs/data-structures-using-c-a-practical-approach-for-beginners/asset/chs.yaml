  \n# 1 算法与递归的基础原理\n\nDOI: [10.1201/9781003105800](https://doi.org/10.1201/9781003105800)\n\
  \n## 1.1 算法、伪代码表示与流程图\n\n### 1.1.1 算法定义\n\n解决问题的逐步程序。任何用自然语言编写的任何程序的顺序解决方案都称为算法。算法是解决过程的第一步。在问题分析后，开发者为该问题编写算法。它主要用于数据处理、计算和其他相关的计算机和数学操作。\n\
  \n算法必须满足以下五个条件：\n\n1. `输入`：外部提供零或多个数量。\n2. `输出`：算法至少产生一个输出。\n3. `确定性`：每条语句必须清晰、明确且无歧义。\n\
  4. `有限性`：算法应在有限步后结束。\n5. `有效性`：每条语句必须非常基础，以让任何个人仅使用纸和笔即可执行。\n\n\n\n\n\n### 1.1.2\
  \ 伪代码表示\n\n“Pseudo”一词意味着“虚假的”，因此“pseudo-code”意味着“伪代码”。伪代码是程序员用于开发算法的一种非正式的语言。伪代码描述了你如何实现一个算法，而不涉及具体的语法细节。它使用了正式编程语言的结构惯例，但它是为了人类阅读而非机器读取而设计的。它被用于创建程序的概述或大纲。系统设计人员编写伪代码以确保程序员理解软件项目的需求，并据此调整代码。伪代码中不包含变量声明。\n\
  \n伪代码遵循某些标准循环结构，如下：\n\n1. `FOR… ENDFOR`\n2. `WHILE… ENDWHILE`\n\n对于标准条件句也存在某些术语：\n\
  \n1. `IF… ENDIF`\n2. `WHILE… ENDWHILE`（顺便说一下，这既是循环也是条件语句）\n3. `CASE… ENDCASE`\n\n\
  伪代码无法在可执行程序中被编译。\n\nC 代码示例：\n\n```\nif (I < 10)\n{\nI++;\n}\n```\n\n因此，其对应的伪代码是：\n\
  \n如果 `I` 小于 10，则将 `I` 加 1。\n\n**伪代码的优点：**\n\n1. 伪代码可以被每个编程语言开发者（如 `Java` 或 `C#`\
  \ 开发者、Net 开发者等）理解。\n2. 大多数人很难阅读编程语言，但伪代码允许非程序员（如业务分析师、最终用户或客户）审查符合编码规范的预测伪代码步骤。\n\
  3. 通过先用人类语言起草代码，程序员可以防止遗漏重要的步骤。\n\n### 1.1.3 流程图\n\n任何程序的图形化表示称为流程图。流程图是一种表示算法程序、工作流或操作的图。流程图旨在为人们提供一种共同语言来理解项目或过程。开发者经常将其作为程序规划工具，用于排排除故障。每个流程图都提供特定问题的解决方案。有几个标准的图形符号在流程图中如下使用：\n\
  \n![](img/un01_01.jpg)\n\n1. 起始和停止或终端\n   圆形矩形或椭圆形符号表示流程图的开始和结束位置。\n2. 输入和输出\n \
  \  平行四边形符号表示流程图中的输入或输出操作。\n3. 处理或指令\n   矩形代表过程，如计算、数学运算或变量赋值操作等。\n4. 箭头或流向\n   箭头或流向表示步骤序列的流向和过程的方向。\n\
  5. 问题或决策\n   菱形符号用于表示决策符号中测试的真假陈述。\n6. 连接符\n   流程图根据项目需求被分为两个或多个较小的流程图。当流程图无法放在单页上或必须分成若干部分时，经常使用这种连接符。连接符是一个称为页内连接符（On-Page\
  \ Connector）的小圆，内部有一个数字，允许你连接同一页上的两个流程图。\n   看起来像衬衫口袋的连接符称为跨页连接符（off-page connector），允许你连接到另一页的流程图。\n\
  \n**开发流程图的指南：**\n\n在设计和开发流程图时，请记住以下几点：\n\n1. 设计流程图期间，箭头不应交叉。\n2. 处理或活动通常从上到下或从左到右进行。\n\
  3. 页内连接符通常使用数字引用。\n4. 跨页连接符通常使用字母引用。\n5. 流程图可能只有一个起始符号和一个停止符号。\n6. 流程图的形状、线条和文本需要保持一致。\n\
  \n**流程图的优缺点：**\n\n**流程图的优点：**\n\n1. 流程图是记录程序的最佳方式之一。\n2. 与算法和伪代码相比，流程图更容易理解。\n3.\
  \ 它帮助我们调试和分析过程。\n4. 它帮助我们理解如何通过思考或决策来制定问题方案。\n\n**流程图的缺点：**\n\n1. 需要手动跟踪以验证纸质流程图的准确性。\n\
  2. 修改流程图有时非常耗时。\n3. 在流程图中显示大量的分支并创建循环。\n4. 问题逻辑的简单修改可能导致流程图的完全重新设计。\n5. 为巨大且复杂的程序绘制流程图非常困难。\n\
  \n示例：画一个寻找三角形面积以及奇奇偶数的流程图：\n\n![](img/un01_02.jpg)\n\n## 1.2 抽象数据类型\n\n抽象数据类型（ADT）是对象的一种类型或类，其行为由一组值和一组函数决定。ADT\
  \ 的定义仅涉及需要执行的事务，而不涉及这些事务将如何实现。它没有指定数据如何在内存中组织，以及将使用什么算法来实现这些操作。它之所以被称为“抽象”，是因为它提供了一个独立于实现的视角。这种只提供核心内容并隐藏细节的过程被称为抽象。\n\
  \n使用过该数据类型的程序员可能不知道该数据类型是如何实现的，例如，我们一直在使用不同的内置数据类型（如 `int`、`long`、`float`、`double`、`char`），只知道可以在特定数据类型中存储哪些值以及可以在它们上执行哪些操作，而不知道它们是如何实现的。程序员只需要知道数据类型可以做什么，而不需要如何实现。ADT\
  \ 可以被视为一个黑盒，隐藏了内部结构和设计。我们现在将定义三种 ADT：列表 ADT、栈 ADT、队列 ADT。\n\n### 1.2.1 列表 ADT\n\n\
  列表按顺序组织相同类型，可以执行以下操作：\n\n1. `Get()` - 获取列表元素。\n2. `Insert()` - 在列表的任何位置插入项。\n3.\
  \ `Remove()` - 从非空列表中删除第一个实例。\n4. `RemoveAt()` - 从非空列表的指定位置删除元素。\n5. `Replace()`\
  \ - 在任何位置替换项。\n6. `Size()` - 返回列表中的项数。\n7. `IsEmpty()` - 如果列表为空则返回 true，否则返回 false。\n\
  8. `IsFull()` - 如果列表已满则返回 true，否则返回 false。\n\n### 1.2.2 栈 ADT\n\n栈按顺序排列相同的元素，推和弹出操作发生在栈的一个端（顶部）。可以在栈上执行以下操作：\n\
  \n1. `Push()` - 在栈的一个端（顶部）插入项。\n2. `Pop()` - 如果栈不为空，移除并返回栈顶项。\n3. `Top()` - 如果栈不为空，返回栈顶元素但不删除它。\n\
  4. `Size()` - 返回栈中的项数。\n5. `IsEmpty()` - 如果为空则返回 true，否则返回 false。\n6. `IsFull()`\
  \ - 如果栈满则返回 true，否则返回 false。\n\n### 1.2.3 队列 ADT\n\n队列按顺序组织相似的项目。操作在两端进行，即头部和尾部，插入在尾部执行，删除在头部执行。可以在队列中执行以下操作：\n\
  \n1. `Enqueue()` - 在队列的末部（尾部）插入元素。\n2. `Dequeue()` - 如果队列不为空，从队列头部删除第一个项。\n\n\n\n\
  \n\n3. `Size()` – 返回队列中的元素数量。\n4. `IsEmpty()` - 如果队列为空，则返回 `true`，否则返回 `false`。\n\
  5. `IsFull()` – 如果队列已满则返回 `true`，否则返回 `false`。\n\n通过这些对抽象数据类型（ADT）的描述，我们可以看到这些描述并没有指定这些\
  \ ADT 将如何表示以及如何执行这些操作。可以使用数组或链表等替代方法来实现这些 ADT，例如，列表 ADT 可以使用数组进行静态实现，或者使用单链表或双链表进行动态实现。同样，`stack`\
  \ ADT 和 `Queue` ADT 或其他 ADT 也可以使用数组或链表来实现。\n\n## 1.3 数据结构\n\n### 1.3.1 定义\n\n数据结构是按照特定方式组织的数据元素集合，并定义了用于存储、检索、删除和搜索单个数据元素的函数。\n\
  \n所有数据类型，包括内置的如 `int` 和 `float`；派生的如 `array` 和 `pointer`；或用户定义的如 `structure` 和 `union`，本质上都是数据结构。数据结构是一种用于组织和存储数据的特殊格式，具有恢复、移除和搜索数据项的功能。通用数据结构包括\
  \ `array`、`list`、`stack`、`tree`、`graph` 等。每种数据结构的设计都是为了特定的目的组织数据，以便能够相应地访问和使用。\n\
  \n数据结构的研究涵盖了以下主题：\n\n1. 所需存储空间。\n2. 处理数据所需的时间。\n3. 主内存的数据表示形式。\n4. 对此类数据执行的操作。\n\
  \n### 1.3.2 数据结构的类型或分类\n\n![](img/un01_03.jpg)\n\n### 1.3.3 抽象数据类型与数据结构的区别\n\nADT\
  \ 是接口。它由其将支持的操作来定义。它没有指定如何使用数据结构或算法技术来执行这些操作。\n\n例如，可以使用许多不同的思路来实现 `queue`：它可以是环形队列、线性队列、双端队列和优先队列。使用\
  \ `arrays` 或 `linked lists` 实现的 `Queue`。因此，数据结构是 ADT 的实现。\n\nADT 是数据和数据处理操作的逻辑蓝图。数据结构是实现期间数据的真实表示以及处理数据元素的算法。ADT\
  \ 是逻辑层面的，而数据结构是实现层面的。\n\nADT 是根据可能的值对数据类型的表示，而不是值在内存中的存储方式，以及在不考虑其实现细节的情况下允许的操作。\n\
  \n因此，当使用 `C` 等编程语言实现 `stack` 时，它将是一个数据结构；但用其行为（如后入先出 LIFO）、可能的取值集合、允许的操作（如 `push`、`pop`\
  \ 等）来描述它，则被视为 `stack` 的 ADT。\n\n## 1.4 算法效率或算法性能分析\n\n算法的有效性或算法性能的分析主要涉及两个方面：空间复杂度和时间复杂度。\n\
  \n### 1.4.1 空间复杂度\n\n空间复杂度定义为程序运行到结束所需的内存内存总量。\n\n#### 1.4.1.1 程序空间的组成部分\n\n程序空间包括指令空间、数据空间和栈空间，描述如下：\n\
  \n`Program space = Instruction space + data space + stack space.`\n\n1. **指令空间取决于若干几个因素：**\n\
  \   1. 生成机器码或二进制代码的编译器\n   2. 目标计算机\n2. **数据空间：**\n   1. 严重取决于计算机的架构和编译器。\n   2.\
  \ 程序处理的数据规模。\n   在编程语言中，有不同类型的数据，存储特定数据所需的字节数也不同。例如 `character` 数据类型需要 1 字节内存，`integer`\
  \ 需要 4 字节，`float` 需要 4 字节，`double` 需要 8 字节等。这随编译器而异。选择“较小”的数据类型将影响程序整体空间的使用。在处理\
  \ `arrays` 时请选择合适的类型。\n3. **栈空间：**\n   每次调用函数时，以下数据会被记录在栈中。\n   1. 返回地址。\n   2.\
  \ 所有局部变量的值和形式参数的值。\n   3. 所有引用和常量引用参数的绑定。\n\n高效利用空间的几点：\n1. 始终选择你需要的最小数据类型。\n2.\
  \ 详细研究编译器。\n3. 发现各种编译设置的影响。\n4. 如果适用，选择非递归算法。\n\n因此，任何 p 算法的空间 (p) 需求可以写为：\n\n1.\
  \ `S (p) = c + Sp (instance characteristics)`\n2. `C = fixed part`：这包括指令空间、单个及固定大小变量的空间、常量等。\n\
  3. `Sp = variable part`：引用变量所需的空间，取决于实例特征和递归状态空间。\n\n**示例：**\n\n1. 非递归算法 `sum(a,\
  \ n)`\n```\n{\nS = 0.0;\nfor i =1 to n do\nS = S + a[i] ;\nreturn S;\n}\n```\n这里非递归\
  \ `sum` 算法的空间复杂度为：\n\n```\nSsum(n) >= n+3\n```\n其中 `Ssum(n)` 表示具有数组大小的非递归 `sum`\
  \ 的空间复杂度。\n\n`(n+3)` 意味着数组 `[]` 的 `n`，每个元素的 `1` 以及 `s`。\n\n2. 递归算法 `Rsum(a, n)`\n\
  ```\n{\nif (n<=0) then return 0.0;\nelse return Rsum(a, n-1) + a[n];\n}\n```\n`Rsum`\
  \ 的空间需要：\n\n调用了 `(n+1)` 次，所以递归状态空间为 `≥ 3 (n+1)`。\n\n这意味着具有数组元素 `n` 的 `SRsum(n)`\
  \ 的空间复杂度。\n\n### 1.4.2 时间复杂度\n\n算法运行所需的时间称为时间复杂度。\n\n绝对时间定义如下：\n\n$\\begin{array}{ll}\
  \ {\\textbf{绝对时间复杂度}\\operatorname{~=}} & \\textbf{指令数量} \\\\ & {\\times \\text{执行一条指令所需的时间}}\
  \ \\end{array}$\n\n然而，执行一条指令所需的时间随系统或计算机而异。因此，我们只将算法中的指令数量视为时间复杂度。\n\n对于大多数算法，运行时间取决于输入的大小。运行时间表示为输入大小\
  \ `n` 的函数 `T` 的 `T (n)`。假设存在可能执行的 `if….. else` 语句，在这种情况下时间是可变的。\n\n通常，算法时间复杂度通过以下方式计算：\n\
  \n1. **最坏情况**：执行程序所需的最大时间。最坏情况的时间复杂度用大 O 符号 `O` 表示。\n2. **平均情况**：执行程序所需的平均时间。平均情况的时间复杂度用\
  \ Theta 符号 `θ` 表示。\n3. **最好情况**：执行程序所需的最少时间。最好情况的时间复杂度用 Omega 符号 `Ω` 表示。\n\n算法的效率或分析涉及两个阶段：\n\
  \n1. **先验估计**：\n   先验估计涉及理论或数学计算。理论或数学计算使用渐近符号进行表示。\n2. **后验估计或测试**：\n\n\n\n\n该算法设计在机器上实现。它涉及程序的编写，因此取决于操作系统、编译器等。\n\
  \n**性能分析：** 主要目标是确定运行程序直到完成所需的系统时间和系统内存（以空间复杂度衡量）。\n\n**先验分析：** 涉及给定算法中语句计数的计算。计数指示了每条指令执行的频率。\n\
  \n#### 示例 1\n\n```\n1\\. Algorithm add (a, n)\n2\\. {\n3\\. S=0;\n4\\. for (i=1\
  \ to n) do\n5\\. S = S + a[i];\n6\\. return s;\n7\\. }\n```\n\n| 行号 | 每次执行步骤 | 频率\
  \ | 总步数 |\n| --- | --- | --- | --- |\n| 1. | 0 | 0 | 0 |\n| 2. | 0 | 0 | 0 |\n|\
  \ 3. | 1 | 1 | 1 |\n| 4. | 1 | n+1 | n+1 |\n| 5. | 1 | N | N |\n| 6. | 1 | 1 | 1\
  \ |\n| 7. | 0 | 0 | 0 |\n| | | | **2n+3 步数** |\n\n#### 示例 2\n\n```\n1\\. Algorithm\
  \ add(a,b,c,m,n)\n2\\. {\n3\\. for (i=1 to m) do\n4\\. for (j=1 to n) do\n5\\. C[i,\
  \ j]=a[i, j]+b[i, j]\n6\\. }\n```\n\n| 行号 | 总步数 |\n| --- | --- |\n| 1. | 0 |\n|\
  \ 2. | 0 |\n| 3. | m+1 |\n| 4. | m(n+1) |\n| 5. | Mn |\n| 6. | 0 |\n| | **2mn+2m+1\
  \ 步数** |\n\n在示例 1 和 2 中，展示了执行的步数。\n\n**步数**有三种类型：\n\n1. **最好情况：** 对于给输入，可以执行的最少步数。\n\
  2. **最坏情况：** 对于给定输入，可以执行的最多步数。\n3. **平均情况：** 对于给定输入，可以执行的平均步数。\n\n## 1.5 递归与递归算法的设计（带适当示例）\n\
  \n递归函数是一个调用自身的函数。同样，如果一个算法在体内调用了自身，则该算法是递归的。\n\n递归算法可以分为以下类型：\n\n1. **直接递归算法：**\
  \ 如果算法在体内调用了相同的算法，则称为直接递归算法。\n\n**示例：**\n\n```c\n#include<stdio.h<\nint main() \
  \    // main 函数被作为直接\n递归函数调用\n{\n        printf(\"Hello\\n\");\n        main();\
  \        // 调用 main 函数\n        return 0;\n}\n```\n\n**输出：**\n\n无限次打印 Hello。\n\n\
  在上述程序中，`main()` 函数被自身调用，被视为直接递归函数。\n\n2. **间接递归算法：** 如果算法 `A` 调用了另一个算法 `B`，而 `B`\
  \ 又调用了 `A`，则算法 `A` 被视为间接递归算法。\n\n**示例：**\n\n```c\n#include<stdio.h>\nvoid demo();\n\
  int main()   //main 函数被作为间接\n递归函数调用\n{\n    printf(\"Hello\\n\");\n    demo();\n\
  \    return 0;\n}\nvoid demo()\n{\n    main();   // 在 demo 内部调用 main\n函数且 demo 函数被\
  \ // main\n函数调用\n}\n```\n\n**输出：**\n\n无限次打印 Hello。\n\n在上述程序中，`demo()` 函数被 `main()`\
  \ 函数调用，而 main 函数再次在 `demo()` 函数的体内被调用，被视为间接递归函数。\n\n### 1.5.1 示例 1：使用非递归函数实现阶乘程序\n\
