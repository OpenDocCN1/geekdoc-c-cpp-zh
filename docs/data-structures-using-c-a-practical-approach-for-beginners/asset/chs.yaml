  \ :--- |\n| a[0] | a[1] | a[2] | a[3] | a[4] | a[5] | a[6] | a[7] |\n\n步骤 1：元素存储在数组中，我们将继续划分\n\
  \n| 91 | -38 | | 48 | 33 | 56 | 25 | 10 | 84 |\n| :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| a[0] | a[1] | | a[2] | a[3] | a[4] | a[5] | a[6]\
  \ | a[7] |\n| 步骤 2: | | | | | 步骤 12 | | | |\n\n再次划分每个子列表。\n\n| 91 | -38 | | 48 |\
  \ 33 | | 56 | 25 | | 10 | 84 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| a[0] | a[1] | | a[2] | a[3] | | a[4] | a[5] |\
  \ | a[6] | a[7] |\n| 步骤 3: | | | | | 步骤 7: | 步骤 13 | | 现在划分子列表，每个列表将得到单个元素。\n\n\
