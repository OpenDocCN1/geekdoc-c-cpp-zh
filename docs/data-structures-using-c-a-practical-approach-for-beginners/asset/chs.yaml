  **答案：D**\n\n# 7 搜索与排序技术\n\nDOI: [10.1201/9781003105800-7](https://doi.org/10.1201/9781003105800-7)\n\
  \n## 7.1 搜索与排序的必要性\n\n### 7.1.1 搜索的必要性\n\n信息搜索是计算机科学最重要的应用之一。我们经常需要在成百上千甚至更多数据记录中找到某一条特定的记录。例如，你可能需要在手机上查找某人的手机号，或者查找需要搜索的地址。当该记录的键值与给定的输入值匹配时，就可以识别该记录。如果找到了所需的记录，则认为搜索操作成功，否则搜索失败。搜索是计算机科学算法的一种。我们了解到如今的现代计算机存储了大量信息。为了熟练地读取这些信息，我们需要高效的搜索算法。组织数据的某些方法可以改进搜索过程，这意味着如果我们按照正确的顺序保存信息，就很容易找到所需的元素。排序是使元素顺序有序的技术之一。\n\
  \n定义：搜索是指在元素集合中找到给定项目的位置的操作。数据结构中的搜索是指在列表中查找元素位置的过程。\n\n**两种类型的搜索：**\n\n1. **内部搜索**\n\
  \   所有元素都保持在主内存中的搜索方法称为内部搜索。\n   所需时间较短，但非常适用于小量数据。线性搜索、二分查找、二叉搜索树和 AVL 树都是内部搜索技术。\n\
  \n2. **外部搜索：**\n   元素保存在次级存储中的搜索方法称为外部搜索。所需时间更长，是处理大量数据的理想搜索技术。B 树和 B+ 树是外部搜索技术。\n\
  \n### 7.1.2 排序的必要性\n\n排序是加速数据结构后续操作的重要步骤，例如比较两个列表、根据优先级将进程分配给处理器等。在排序列表中搜索元素的位置比在未排序列表中更容易、更快。排序算法可以用于程序对数组进行排序，以便后续搜索或写入有序文件或报告。历史上，计算机在排序上花费的时间比任何其他操作都多，在主机上占\
  \ 25%。排序是计算机科学中研究最充分的问题，已知多种不同的算法。排序很重要，因为一旦元素集经过排序，许多其他问题就会变得容易解决。\n\n## 7.2 顺序搜索或线性搜索\n\
  \n### 7.2.1 线性搜索或顺序搜索的基础\n\n在线性搜索中，我们按顺序访问数组的每个元素，并检查它是否为所需的元素。如果访问了所有元素但未找到所需的元素，则搜索失败。\n\
  \n### 7.2.2 线性搜索的效率\n\n1. **最好情况的时间复杂度：**\n   搜索的元素位于第一个或几乎第一个位置，即 `[0]`。\n   `T(n)\
  \ = Ω (1)`\n\n2. **最坏情况的时间复杂度：**\n   搜索的元素位于数组末尾，即 `[n – 1]`，或者不在数组中。\n   `T(n)\
  \ = O(n)`\n\n3. **平均情况的时间复杂度：**\n   搜索的元素几乎位于列表中间，称为线性搜索的平均情况。\n   `平均情况 = (最好情况\
  \ + 最坏情况)/2 = (1+n) /2`\n   `T(n) = Θ (n)`\n\n**时间复杂度：**\n\n| 最好情况的时间复杂度 | T(n)\
  \ = Ω (1) |\n| 平均情况的时间复杂度 | T(n) = Θ (n) |\n| 最坏情况的时间复杂度 | T(n) = O(n) |\n\n###\
  \ 7.2.3 线性搜索算法\n\n1. 开始。\n2. 使用任何其他循环遍历数组。\n3. 在每次迭代中，将键元素值与数组的当前值进行比较。\n    1.\
  \ 如果值匹配，则打印数组元素的当前位置或索引。\n    2. 如果值不匹配，通过将数组索引加一移动到下一个数组元素。\n    3. 如果数组中的最后一个元素与键元素比较后未找到匹配，则打印未找到键元素。\n\
  4. 停止。\n\n### 7.2.4 线性搜索程序\n\n```c\n#include<stdio.h>\nint main()\n{\nint a[50],\
  \ n, item, loc=-1;\nprintf(\"\\n size of array: \");\nscanf(\"%d\",&n);\nprintf(\"\
  \ Enter values in the array: \\n\");\nfor(i=0;i<n;i++)\n{\nscanf(\"%d\",&a[i]);\n\
  }\nprintf(\"\\n Enter the number you want to search: \");\nscanf(\"%d\",&item);\n\
  for(i=0;i<n;i++)\n{\nif(item==a[i])\n{\nloc=i;\nbreak;\n}\n}\nif(loc>=0)\n{\nprintf(\"\
  \\n %d is found at the index %d and at position %d\",item,loc,loc+1);\n}\nelse\n\
  {\nprintf(\"\\n Item does not exist in array\");\n}\nreturn 0;\n}\n```\n\n### 7.2.5\
  \ 线性搜索的优点\n\n1. 它是一种非常简单的方法。\n2. 不需要数据有序。\n3. 不需要任何额外的结构。\n\n### 7.2.6 线性搜索的缺点\n\
  \n1. 如果元素非常多，这种搜索方法效率低且缓慢。\n\n## 7.3 二分搜索\n\n### 7.3.1 二分搜索的基础\n\n二分搜索是一种仅适用于有序列表的高效搜索技术。二分搜索的最坏情况时间复杂度为\
  \ `Ο (log[2] n)`。这种搜索算法基于分治原理。为了该算法正常工作，数据集合或列表必须是有序的\n\n### 7.3.2 二分搜索算法\n\n二分搜索技术的逻辑如下：\n\
  \n1. 开始。\n2. 数组必须是升序或降序。找到数组的中间元素，称为 `mid`。\n3. 将中间元素 `mid` 与搜索元素或键进行比较。\n4. 假设数组是升序的，有三种情况：\n\
  \    1. 如果 `mid = key`，即中间元素是所需的元素，则搜索成功。\n    2. 如果 `mid > key`，即中间元素大于键元素，则只在数组的前半部分搜索。\n\
  \    3. 如果 `mid < key`，即中间元素小于键元素，则只在数组的后半部分搜索。\n5. 重复上述步骤 1-3，直到找到键元素。\n6. 停止。\n\
  \n在此算法中，我们每次都缩小搜索区域。因此，比较次数不断减少。即使在**最坏情况**下，比较次数**最多为 log[2] (N + 1)**（图 7.1）。\n\
  \n### 7.3.3 二分搜索示例\n\n在数组 `a` [5] 中使用二分搜索 45 的步骤为：\n\n**步骤 1：**`beg = 0, last =\
  \ 4 mid = (beg + last)/2 = 2`\n\na[mid] 即 `a[2]` 是 24,\n\n\n\n\n\n如果 24 < 45 则在数组的后半部分搜索，并计算\
  \ `beg` 为，\n\n`beg = mid+1 = 2+1 = 3`  `last=4`\n\n**步骤 2：** `mid` = (beg + last)/2\
  \ = (3+4)/2 = 3\n\n![](img/un07_04.jpg)\n\n`a[mid]<45`\n\n然后计算 `beg` 索引为，`beg =\
  \ mid + 1 = 3 + 1 = 4`  `last = 4`。\n\n**步骤 3：** `mid` = (beg + last)/2 = (4+4)/2\
  \ = 4\n\n![](img/un07_05.jpg)\n\n**a[mid] 即 a[4] 为 45，**\n\n45 = 45 则在数组索引 4 或数组的第五个位置搜索成功。\n\
  \n### 7.3.4 二分查找程序\n\n```\n #include<stdio.h>\nint main()\n{\nint a[50] , i , n\
  \ , loc , mid , beg , end , item , flag=0;\nprintf(\"\\n Enter the size of array\
  \ or list:\");\nscanf(\"%d\",&n);\nprintf(\"Enter the elements in array:\\n\");\n\
  \        for(i=0;i<n;i++)\n        {\n        scanf(\"%d\",&a[i]);\n        }\n\
  \        printf(\"Enter the element which you want to search:\");\n        scanf(\"\
  %d\",&item);\n        loc=0;\n        beg=0;\n        end=n-1;\nwhile( (beg<=end)&&(item!=a[mid]))\n\
  {\n        mid=(beg+end)/2;\n        if(item==a[mid])\n        {\n        printf(\"\
  \\n Searched element is found\");\n        loc=mid;\n        printf(\"\\n Location\
  \ of the element is %d and array\n        index is %d\",loc+1,loc);\n          \
  \   flag=1;\n             }\nif(item<a[mid])\n        end=mid-1;\nelse\n       \
  \ beg=mid+1;\n}\nif(flag==0)\n        printf(\"\\n Item is not found in the list.\"\
  );\nreturn 0;\n}\n```\n\n**输出：**\n\n![](img/un07_06.jpg)\n\n### 7.3.5 二分查找分析或二分查找的时间复杂度\n\
  \n1. **最好情况时间复杂度：**\n\n   被搜索元素位于列表的中间，即 `a[mid]`。\n\n   `T (n) = Ω (1)`\n\n2. **最坏情况时间复杂度：**\n\
  \n   被搜索元素位于数组的末尾、开头或不在数组中。\n\n   `T (n) = O (log[2] n)`\n\n3. **平均情况时间复杂度：**\n\n\
  \   被搜索元素不在列表的末尾、开头或中间，而在数组的其他地方。\n\n   `T (n) = Θ (log[2] n)`\n\n   二分查找算法的时间复杂度为\
  \ `O (log[2] n)`，因为它在搜索的每个阶段都会将列表的大小减半。假设一个列表包含 21 万个元素，在最坏情况下，线性搜索算法需要 21 万次键值比较，而二分查找算法只需要大约\
  \ 21 次比较。\n\n### 7.3.6 二分查找的优点\n\n1. 二分查找的最坏情况时间复杂度非常高效。\n2. 与线性搜索相比，二分查找算法要快得多。\n\
  3. 二分查找是一种用于在有序列表中查找元素的简单算法。\n\n### 7.3.7 二分查找的缺点\n\n1. 不适用于未排序的记录。在应用二分查找之前，数据必须始终保持排序。\n\
  2. 二分查找算法比线性搜索算法更复杂。\n3. 二分查找对于短列表效果不佳。\n4. 二分查找适用于类似数组的直接访问结构，但不适用于类似链链的存储结构。\n\
  \n## 7.4 针对最好、平均和最坏情况的搜索技术分析\n\n有三种不同类型的搜索，其中哈希搜索技术为我们提供了最好的时间复杂度，而不是线性搜索或二分查找。二分查找技术的时间复杂度比线性搜索更好，但二分查找中的元素必须是排序的。在所有搜索技术（如线性搜索、二分查找）中，搜索元素所需的时间取决于数据结构中元素的总数。在所有这些搜索技术中，随着元素数量增加，搜索元素所需的时间也线性增加。\n\
  \n哈希是另一种搜索方式，其中搜索元素所需的时间不取决于元素的数量。使用哈希数据结构，以常数时间复杂度进行元素搜索。哈希是减少在数据结构中搜索元素时比较次数的有效方法。哈希处理的是证明记录可能存储的直接地址的思路。哈希是在数据结构中对索引和检索键元素或数据的过程，以提供使用哈希键查找元素最快的方法（[表格]）。\n\
  \n\n\n\n通过哈希函数获得的键在这里称为 `hash key`，`4456000 % 1000` 得到的哈希键为 `0`。\n\n### 7.5.3 哈希函数中的冲突\n\
  \n当哈希函数对多个记录返回相同的哈希地址或键时，这被称为冲突（collision）。请注意，冲突的发生说明哈希函数的设计不佳。\n\n### 7.5.4 选择良好哈希函数的规则\n\
  \n1.  哈希函数应该易于计算。\n2.  冲突次数应该较少。理想情况下，不发生冲突。这种函数被称为`完美哈希函数`（a perfect hash function）。\n\
  3.  哈希函数产生的键应该均匀分布在数组上。\n    如果发生了冲突，则应该通过某些技术来处理，这种技术被称为`冲突处理或避免或解决技术`。\n\n## 7.6\
  \ 哈希函数的类型\n\n哈希函数的类型或哈希函数的计算方法如下：\n\n### 7.6.1 取位法 (Mid-Square Method)\n\n针对整数键值设计的良好哈希函数是取位法。取位法将键值平方，然后取出结果中间的\
  \ `n` 位，给出一个 `0` 到 `2n-1` 范围内的值。这种方法有效，因为键值的大部分或所有位都对结果有所贡献。\n\n例如，考虑键值为十进制四位数的记录。目标是将这些键值哈希到一个大小为\
  \ 100 的表中，即 `0–99` 范围内。这个范围等同于十进制的两位数，即 `n = 2`。如果输入数字 `4567`，平方后得到一个八位数字 `20857489`。该结果的中间两个数字是\
  \ `57`。现在，将该结果值 `57` 称为哈希键。\n\n**示例：**\n\n```\nKey: 325\n325* 325 = 105625\nHash\
  \ key: 56\n```\n\n### 7.6.2 取模法 (Division or Modulus Method)\n\n所有哈希方法中最简单的方法或许是：整数值键除以\
  \ `n`，然后使用余数作为哈希键。这被称为哈希的取模法或除法法。在这种情况下，哈希函数如下：\n\n`h(key) = key % m`\n\n### 7.6.3\
  \ 折叠法 (Folding Method)\n\n将键分为不同的部分，每个部分的长度与所需的地址相同。然后将这些部分相加，并忽略进位。\n\n**示例：**\n\
  \n1.  键：`3455677234`\n2.  分区：`345 | 567 | 723 | 4`\n3.  相加：`345 + 567 + 723 + 4\
  \ = 1639`\n\n哈希键或地址：`639`，进位 `1` 被忽略。\n\n折叠法有两种：一种是`平移折叠` (fold shift)，另一种是`边界折叠`\
  \ (fold boundary)。在平移折叠中，键值被分为大小匹配所需地址或哈希键位数的部分。然后将左部分和右部分平移并与中间部分相加。在边界折叠中，左右两个数字在它们与中心数字之间的固定边界上进行折叠。\n\
  \n1.  **平移折叠：**\n    键值：`123456789`\n    `123+456+789=1368`，这里 `1` 是进位，舍弃或移除所得地址或哈希键中的进位数字。因此，`368`\
  \ 是新的哈希键或地址。\n\n2.  **边界折叠：**\n    键：`123456789`\n    `321`（数字反转）+ 456 + 987（数字反转）=\
  \ `1764`，这里 `1` 是进位，舍弃或移除所得地址或哈希键中的进位数字。因此，`764` 是新的哈希键或地址。\n\n### 7.6.4 数字分析法 (Digit\
  \ Analysis)\n\n地址或哈希键通过选择和移动原始键的位或数字形成。分析包括计算键，然后统计每个数字在每个位置出现的次数。我们选择数字分布更均匀的位置。例如，我们可以从原始键中选择第一、第四和第五位置来形成地址或哈希键。该函数取决于分布。对于给定的键集，必须一致使用相同的重排模式。\n\
  \n**示例：**\n\n键：`2234`、`3452` 和 `2784`\n\n分布情况：\n\n| 数字 | | 位置 | | | |\n| :--- |\
  \ :--- | :--- | :--- | :--- | :--- |\n| | **1** | **2** | **3** | **4 (从右向左)** |\n\
  | 2 | 1 | 0 | 1 | 2 |\n| 3 | 0 | 1 | 0 | 1 |\n| 4 | 2 | 0 | 1 | 0 |\n| 5 | 0 | 1\
  \ | 0 | 0 |\n| 7 | 0 | 0 | 1 | 0 |\n| 8 | 0 | 1 | 0 | 0 |\n\n位置 `2` 和 `3` 的分布最为均匀。因此，我们将哈希键设为\
  \ `23`、`45` 和 `78`。\n\n## 7.7 冲突解决技术\n\n### 7.7.1 线性探测 (Linear Probing)\n\n当发生冲突时（即两条记录要求哈希表中的相同位置），可以通过在找到任何空位置处线性地放置第二个记录来解决冲突。\n\
  \n**示例：**\n\n在图 7.4 所示给出的哈希表中，使用的哈希函数是 `data % 10`。\n\n![](img/Fig07_04.jpg)\n\n\
  图 7.4 线性探测。\n\n如果放置第一个元素 `131`，则 `131 % 10 = 1`，即 `131` 放置在数组的索引 `1` 处。\n\n如果放置第二个元素\
  \ `21`，则 `21 % 10 = 1`，即 `131` 已经放置在索引 `1`，意味着发生了冲突，所以我们现在采用线性探测。在该方法中。\n\n### 7.7.2\
  \ 链法（不替换）\n\n如前所述，线性探测的缺点是丢失了哈希函数的含义。在这种情况下，引入了链法。\n\n**示例：**\n\n假设我们有图 7.5：\n\n\
  ![](img/Fig07_05.jpg)\n\n图 7.5 链法（不替换）。\n\n`131`、`21`、`31`、`4`、`5`、`61`、`2`\n\n\
  **解释：**\n\n在这里不替换的链法中，首先 `131` 的哈希键通过 `131 % 10` 生成，即 `131` 放置在索引 `1`。下一个键元素 `21`\
  \ 的哈希键为 `1`，则 `21` 放置在 `131` 的链中。同样，对于键元素 `31`，其哈希键为 `1`，则 `31` 放置在索引 `1` 的 `21`\
  \ 链中。\n\n### 7.7.3 链法（带替换）\n\n如前所述，不替换链法的缺点是当下一个键元素为 `2` 时，将哈希函数应用于键元素 `2`，得到的哈希键为\
  \ `2`。此时索引 `2` 已经填充，但不是正确的元素 `21`。然而，我们知道 `21` 目前并不所在的位置。因此，我们将用 `2` 替换 `21`，并相应地更新链表。这里哈希表和链列中的值\
  \ `-1` 表示空位置图 7.6。\n\n![](img/Fig07_06.jpg)\n\n图 7.6 链法（带替换）。\n\n**带替换链法的优点：**\n\
  \n1.  保留了哈希函数的含义。\n2.  然而，每次都需要一些逻辑来测试元素是否处于正确位置。\n\n## 7.8 开放哈址与封闭哈址\n\n### 7.8.1\
  \ 封闭哈址或开放寻址法\n\n封闭哈址也称为开放寻址法。第一冲突解决方法是封闭哈址或开放寻址法。这种方法在主区域解决冲突。当发生冲突时，为发生冲突的键元素搜索主区域，并将键元素放置在哈希表的另一个索引处。在封闭哈址中，所有键都存储在哈希表中，而不使用链表或链。开放寻址是指元素的位置或地址并非由其哈希值精确且永久地确定。\n\
  \n\n\n\n\n开放地址法（Open addressing）告诉我们，对象在哈希表中的存储索引并不完全取决于其哈希键（hash key）。相反，索引可能会取决于哈希表中已经存在的内容。“闭散哈散”（closed\
  \ hashing）中的“闭”是指我们永远离开哈希表；每个对象都直接存储在哈希表内部数组的某个索引处，不会为不同的哈希键维护单独的列表。注意这只有通过某种开放地址策略才能实现。因此，闭散哈散被称为开放地址法。\n\
  \n闭散哈散或开放地址方法的示例如下：\n\n1. 线性探测（Linear probing）\n2. 二次探测（Quadratic probing）\n3. 双重哈希（Double\
  \ hashing）\n4. **线性探测：**\n   在线性探测中，我们线性地探测下一个位置。当发生冲突时（即两条记录需要哈希表中的同一个位置时），可以通过将第二个记录线性地放置直到找到空位置来解决冲突。\n\
  \n5. **二次探测：**\n   如果在哈希键或地址 `h` 处发生冲突，二次探测方法将在位置 `h+1`、`h+4`、`h+9`……等处对表进行探测。即\
  \ `h(key)=key % table size` 给出哈希键 `h`，如果该位置已填充，则通过 `h + i²` 获取哈希键，其中 `i = 1, 2,\
  \ ..` 等得到迭代次数。\n\n6. **双重哈希：**\n   双重哈希通过为不同的键计算不同的探测增量使用非线性探测。双重哈希使用两个哈希函数。第一个函数计算原始地址或哈希键，如果槽可用，则将记录保存在该索引处；但如果槽为空，则使用第二个哈希函数再次计算哈希键。\n\
  \n### 7.8.2 开放哈散或闭散地址\n\n开放哈散（Open hashing）也称为闭散地址（closed addressing）。开放哈散或闭散地址也称为分离链法（separate\
  \ chaining），因为对于同一个哈希键，会维护一个单独的列表。在开放哈散中，键存储在附加到哈希表单元的链表、链、单独列表或桶（bucket）中。其思想是让哈希表的每个单元指向具有相同哈希函数值的记录链表。\n\
  \n开放哈散或闭散地址方法的示例如下：\n\n1. 链链法（Chaining）\n2. 桶的使用\n1. **链法：**\n   解决冲突的一种方法是维护 `n`\
  \ 个链表，为哈希表的每个可能的地址维护一个。键 `k` 哈希到表中的地址 `i = h(k)`。在地址 `i` 处，我们找到一个包含所有哈希到 `i` 的键的记录的列表表头。然后在该列表中查找包含键\
  \ `k` 的记录。\n\n2. **桶的使用：**\n   假设我们将表划分为 `n` 组记录，每组恰好包含 `m` 条记录，那么每组 `m` 条记录就被称为一个桶（bucket）。哈希函数\
  \ `h(k)` 从元素键 `K` 计算桶号，包含 `K` 的记录存储在桶号为 `h(K)` 的桶中。如果某个桶溢出，则涉及溢出策略。\n\n   如果桶溢出，可以使用链链技术链接到“溢出”桶。这种链接可以建立在溢出桶的末尾。将溢出桶保留在同一个柱面上是方便的，或者我们可以为溢出设置单独的柱面。\n\
  \n## 7.9 排序\n\n排序是计算机科学中的基础操作。排序是指将数据按照任何给定序列排列的操作，即升序或降序。\n\n![](img/un07_07.jpg)\n\
  \n内部排序是指当元素存在于计算机的主存或主内存时，对数组中的元素进行排序的过程。相反，外部排序是从辅助存储器读取外部文件并对元素进行排序的过程。在内部排序中，排序过程中所有需要排序的数据始终存储在主内存中。在外部排序中，所有需要排序的数据存储在主内存之外，仅根据需要分块加载到内存中。外部排序通常应用于数据无法完全放入主内存的情况。内部排序算法的性能优于外部排序。\n\
  \n### 7.9.1 冒泡排序\n\n#### 7.9.1.1 冒泡排序简介\n\n在冒泡排序中，我们按升序排列元素，并将每个元素与其相邻元素进行匹配。如果第一个元素大于第二个元素，则交换元素的位置，否则保持不变。然后将后续元素与其下一个相邻元素进行比较，并对数组中的所有元素重复此过程。\n\
  \n在第一遍通过中，首先将数组中的最大数放在数组的最后一个位置。\n\n在第二遍通过中，将数组中的第二大数放在数组的倒数位置，依此类推。\n\n#### 7.9.1.2\
  \ 冒泡排序算法\n\n1. 开始。\n2. 从用户处读取元素的总数 `n`。\n3. 将用户输入的所有元素存储在数组中。\n4. 为第一遍指定 `i=0`。\n\
  5. 比较相邻元素，如果 `(a[j] > a[j+1])` 则交换元素。\n6. 对所有元素重复步骤 4。\n7. `i` 的值加 1，并重复步骤 4 和 5\
  \ 直到 `i < n-1` 不成立。\n8. 打印升序结果。\n\n#### 7.9.1.3 冒泡排序示例\n\n排序前的初始元素：\n11 21 35 6\
  \ 7\n\n**第一遍通过：**\n11 21 6 7 35\n**第二遍通过：**\n11 21 6 7 35\n**第三遍通过：**\n11 6 7 21\
  \ 35\n**第四遍通过：**\n6 7 11 21 35\n\n所有元素在第四遍通过后完成。\n\n#### 7.9.1.4 冒泡排序程序\n\n```c\n\
  \ #include<stdio.h>\nvoid bubble_sort(int a[],int);\n//main 函数定义\nint main()\n{\n\
  int a[15], num ,i;\nprintf(\"输入数组或列表的大小: \");\nscanf(\"%d\",&num);\nprintf(\"输入数组中的值:\\\
  n\");\nfor(i=0;i<num;i++)\n{\n         scanf(\"%d\",&a[i]);\n}\nprintf(\"排序前的数组元素:\\\
  n\");\nfor(i=0;i<num;i++)\n{\n         printf(\"%d\\t\",a[i]);\n}\nbubble_sort(a,num);\n\
  getch();\n}\nvoid bubble_sort(int a[],int n)\n{\nint i,j,temp;\n         for(i=0;i<n-1;i++)\n\
  \         {\n         for(j=0;j<(n-1-i);j++)\n         {\n         if(a[j]>a[j+1])\n\
  \         {\n         temp=a[j];\n         a[j]=a[j+1];\n         a[j+1]=temp;\n\
  \         }\n         }\n         }\nprintf(\"\\n 冒泡排序后数组元素为: \\n\");\nfor(i=0;i<n;i++)\n\
  {\n         printf(\"%d\\t\",a[i]);\n}\nreturn 0;\n}\n```\n\n**输出：**\n\n![](img/un07_18.jpg)\n\
  \n#### 7.9.1.5 冒泡排序分析\n\n假设 n 是数组中元素的个数。那么，在冒泡排序中，第一遍通过需要 (n-1) 次比较将最大元素固定在正确位置。第二遍通过需要\
  \ (n-2) 次比较，依此类推。\n\n因此，所需的总比较次数如下：\n\n\n\n\n\n```\nf(n) = (n-1) + (n-2) + (n-3)\
  \ + ……………3+2+1 = n(n-1)/2\nf(n) = O(n2)\nT(n) = O(n2)\n```\n\n因此，冒排序算法的时间复杂度为 `O(n²)`。对于冒排序算法，最坏情况、平均情况和最好情况的时间复杂度是相同的，即\
  \ `n²`。\n\n### 冒泡排序的空间复杂度：\n\n`O (1)` 是冒泡排序的空间复杂度。\n\n#### 7.9.1.6 冒泡排序的优点\n\n1.\
  \ 冒泡排序是一种简单的排序方法。\n2. 不需要额外的数据结构。\n3. 元素在原地交换，不需要使用额外的临时存储，因此所需的空间极小。\n\n#### 7.9.1.7\
  \ 冒泡排序的缺点\n\n1. 冒泡排序是一种非常效的排序方法。\n2. 即使元素已经是有序的，也会完成所有 `(n-1)` 趟遍历。\n3. 冒泡排序主要适用于学术教学，而不适用于实际应用。\n\
  4. 冒泡排序在处理包含大量元素的列表时效果不佳。\n\n### 7.9.2 选择排序\n\n#### 7.9.2.1 选择排序简介\n\n选择排序也被称为`下推排序`。在这里，我们将元素按升序排列进行排序。选择排序完全由一个选择阶段组成，在该阶段中搜索数组中最小的元素。一旦找到最小元素，就将其放在数组的第一个位置，即\
  \ `index 0`。在剩余的元素中继续寻找下一个最小的元素，并将其放在数组的第二个位置，即数组的 `index 1`，依此类推。\n\n因此，所有元素都按升序排列好了。\n\
  \n假设 `a` 是一个包含 `n` 个元素的数组。\n\n**第 1 趟：** 在包含 `n` 个元素的列表 `a[0], a [1],………a [n-1]`\
  \ 中找到最小元素的位置 `i`，然后将 `a[i]` 与 `a[0]` 交换，如果 `index 0` 和 `i` 不同则交换，否则不交换。这样，`a[0]`\
  \ 完成排序。\n\n**第 2 趟：** 然后在从 `a [1], a [2],………, a [n-1]` 的 `(n-1)` 个元素的列表中找到第二个最小的元素即\
  \ `a [i]`，然后将 `a [i]` 与 `a [1]` 交换，如果 `index 1` 和 `i` 不同则交换，否则不交换。然后 `a[0]` 和 `a[1]`\
  \ 完成排序。\n\n**第 3 趟：** 在从 `a [2], a [3],……..,a [n-1]` 的 `(n-2)` 个元素的列表中找到第三个最小的元素，假设为\
  \ `a [i]`，然后将 `a [i]` 与 `a [2]` 交换，如果 `index 2` 和 `i` 不同则交换，否则不交换。然后 `a[0], a [1],\
  \ a [2]` 完成排序，依此类推直到第 `(n-1)` 趟。\n\n因此，数组 `a` 在 `(n-1)` 趟遍历后完成排序。\n\n#### 7.9.2.2\
  \ 选择排序示例\n\n初始数组 `a` 包含四个元素：`21, 5, 9, 2`。![](img/un07_19.jpg) `a[3]`\n\n| 21 |\
  \ 5 | 9 | 2 | **a** |\n|---|---|---|---|---|\n| index | 0 | 1 | 2 | 3 |\n\n在这里，第一趟遍历中，在\
  \ `index 3` 找到最小元素，即 `2`。此外，`0 index` 和 `index 3` 不同；然后交换这两个索引的值，即 `a [0]`（为 `21`）和\
  \ `a [3]`（为 `2`）。现在元素 `2` 被排序到它自己的位置。因此，在完成第一趟遍历后，数组 `a` 如下：\n\n| 2 | 5 | 9 | 21\
  \ | a |\n|---|---|---|---|---|\n| **index** | **0** | 1 | 2 | 3 |\n\n在第二趟遍历中，在数组\
  \ `a` 中从 `index 1` 到 `3` 寻找最小元素。在这里，`5` 是数组 `a` 中从 `index 1` 到 `3` 的最小元素。因此，检查最小元素的索引和\
  \ `1`，这里两者相同，所以不需要交换。现在元素 `2` 和 `5` 被排序到它们自己的位置。因此，在完成第二趟遍历后，数组 `a` 如下：\n\n| 2 |\
  \ 5 | 9 | 21 | a |\n|---|---|---|---|---|\n| **index** | **0** | 1 | 2 | 3 |\n\n\
  在第三趟遍历中，在数组 `a` 中从 `index 2` 到 `3` 寻找最小元素。在这里，`9` 是数组 `a` 中从 `index 2` 到 `3` 的最小元素。因此，检查最小元素的索引和\
  \ `2`，这里两者相同，所以不需要交换。现在元素 `2, 5` 和 `9` 被排序到它们自己的位置。因此，在完成第三趟遍历后，数组 `a` 如下所示，其中所有元素都处于排序位置。这里数组总元素共有四个，所以总共需要三趟遍历来排序数组。\n\
  \n| 2 | 5 | 9 | 21 | a |\n|---|---|---|---|---|\n| index | 0 | 1 | 2 | 3 |\n\n####\
  \ 7.9.2.3 选择排序程序\n\n```c\n #include<stdio.h>\nvoid selection_sort(int a [], int\
  \ n);\nint main()\n{\nint a[10], num, i;\nprintf(\"Enter size of array or list:\
  \ \");\nscanf(\"%d\",&num);\nprintf(\"Enter values in array: \\n\");\nfor(i=0;i<num;i++)\n\
  {\n        scanf(\"%d\",&a[i]);\n}\nselection_sort(a, num);\nprintf(\"Array after\
  \ selection sort:\\n\");\nfor(i=0;i<num;i++)\n{\n        printf(\"%d\",a[i]);\n\
  }\nreturn 0;\n}\nvoid selection_sort(int a *, int n)\n{\nint i,j,min,temp;\nfor(i=0;i<n-1;i++)\n\
  {\n        min=i;\nfor(j=i+1;j<n;j++)\n        {\n                if(a[j]<a[min])\n\
  \                    min=j;\n        }\nif(min!=i)\n        {\n                temp=a[i];\n\
  \                a[i]=a[min];\n                a[min]=temp;\n        }\n}\n}\n```\n\
  \n**输出：**![](img/07_20.jpg)\n\n#### 7.9.2.4 选择排序分析\n\n```\nf(n) = (n-1) + (n-2)\
  \ + (n-3) + ……………3+2+1 = n(n-1)/2\nf(n) = O(n2)\nT(n) = O(n2)\n```\n\n因此，选择排序算法的时间复杂度为\
  \ `O(n²)`。对于选择排序算法，最坏情况、平均情况和最好情况的时间复杂度是相同的，即 `n²`。\n\n### 7.9.3 插入排序\n\n`O (1)`\
  \ 是插入排序的空间复杂度。\n\n#### 7.9.3.1 插入排序\n\n1. 插入排序是一种简单的排序方法。\n2. 不需要额外的数据结构。\n3. 元素在原地交换，不需要使用额外的临时存储，因此所需的空间极小。\n\
  \n#### 7.9.3.2 插入排序的缺点\n\n1. 插入排序是一种非常高效的排序方法。\n2. 即使元素已经是有序的，也会完成所有 `(n-1)` 趟遍历。\n\
  3. 插入排序主要适用于学术教学，而不适用于实际应用。\n4. 插入排序在处理包含大量元素的列表时效果不佳。\n\n#### 7.9.4.1 插入排序简介\n\n\
  插入排序通过将值插入到已排序的文件中一组一组。在插入排序算法中，每次遍历都会将元素从未排序部分移动到有序部分，直到列表完全有序。\n\n#### 7.9.4.2\
  \ 插入排序示例\n\n假设数组 `a[5]` 包含五个元素：`45, -30, 170, 97, 21`。\n\n| 45 | -30 | 170 | 97\
  \ | 21 |\n|---|---|---|---|---|\n| a[0] | a[1] | a[2] | a[3] | a[4] |\n\n**第 1 趟：**\
  \ 首先将 `a[1]` 值存入 `temp` 变量。将 `temp` 与 `a[0]` 比较，如果 `temp < a[0]`，则交换元素。\n\n| -30\
  \ | 45 | 170 | 97 | 21 |\n|---|---|---|---|---|\n| a[0] | a[1] | a[2] | a[3] | a[4]\
  \ |\n\n**第 2 趟：** 现在将 `a[2]` 值存入 `temp` 变量。将 `temp` 与 `a[1]` 和 `a[0]` 比较，如果 `temp\
  \ > a[1]` 和 `a[0]`，则不需要交换。\n\n| -30 | 45 | 97 | 170 | 21 |\n|---|---|---|---|---|\n\
  | a[0] | a[1] | a[2] | a[3] | a[4] |\n\n**第 3 趟：** 在下一趟遍历，将 `a[3]` 值存入 `temp` 变量。将\
  \ `temp` 与 `a[2]` 比较，`a[2] > temp`，则将 `170` 的值移动到数组位置 `a[3]`。再次比较 `temp` 与 `a[1]`，这里\
  \ `a[1] < temp`，所以将 `temp` 值插入数组位置 `a[2]`。\n\n| -30 | 45 | 97 | 170 | 21 |\n|---|---|---|---|---|\n\
  | a[0] | a[1] | a[2] | a[3] | a[4] |\n\n**第 4 趟：** 最后一次，将 `a[4]` 值存入 `temp` 变量。将\
  \ `temp` 与 `a[3]` 比较，`a[3] > temp`，则将 `170` 的值移动到 `a[4]`。再次将 `temp` 与 `a[2]` 比较，`a[2]\
  \ > temp`，则将 `97` 的值移动到 `a[3]`。再次将 `temp` 与 `a[1]` 比较，`a[1] < temp`，所以将 `temp` 值插入到数组位置\
  \ `a[2]`。\n\n| -30 | 21 | 45 | 97 | 170 |\n|---|---|---|---|---|\n| a[0] | a[1]\
  \ | a[2] | a[3] | a[4] |\n\n#### 7.9.4.3 插入排序程序\n\n```c\n #include<stdio.h>\nvoid\
  \ insertion_sort(int a [], int n);\nint main()\n{\nint a[10], num, i;\nprintf(\"\
  Enter size of array or list: \");\nscanf(\"%d\",&num);\nprintf(\"Enter values in\
  \ array: \\n\");\nfor(i=0;i<num;i++)\n{\n        scanf(\"%d\",&a[i]);\n}\ninsertion_sort(a,\
  \ num);\nprintf(\"Array after insertion sort:\\n\");\nfor(i=0;i<num;i++)\n{\n  \
  \      printf(\"%d\",a[i]);\n}\nreturn 0;\n}\nvoid insertion_sort(int a *, int n)\n\
  {\nint i,j,key;\nfor(i=1;i<n;i++)\n{\n        key=a[i];\n        j=i-1;\n      \
  \  while(j>=0 && a[j]>key)\n        {\n                a[j+1]=a[j];\n          \
  \      j=j-1;\n        }\n                a[j+1]=key;\n}\n}\n```\n\n**输出：**![](img/07_21.jpg)\n\
  \n\n\n\n第 4 轮：在下次遍历中，将 `[4]` 值复制到变量 `temp`。然后将 `temp` 与 `[3]` 比较，`[3] > temp`，然后将\
  \ `170` 的值移动到数组位置 `a [4]`。再次将 `[2]` 与 `temp` 比较，此处 `[2] > temp`，因此将值 `97` 移动到数组位置\
  \ `a [3]`。再次将 `[1]` 与 `temp` 比较，此处 `[1] > temp`，因此将值 `45` 移动到数组位置 `a [2]`。再次将 `[0]`\
  \ 与 `temp` 比较，此处 `[0] < temp`，因此将 `temp` 值插入到数组位置 `a [1]`。因此，在这种排序中，我们将新值插入到已经排序的数组，这就是所谓的插入排序。在将值\
  \ `21` 插入数组位置 `a [1]` 后，所有数组元素都按升序排列，如下所示。\n\n| -30 | 21 | 45 | 97 | 170 |\n| a[0]\
  \ | a[1] | a[2] | a[3] | a[4] |\n\n因此，数组 `a` 的元素通过插入排序完成了排序。\n\n### 7.9.3.3 插入排序程序\n\
  \n```c\n #include<stdio.h>\n// main function definition\nint main()\n{\nint a[10],\
  \ n, i, j, k, temp;\nprintf(\"Enter size of array or list: \\n\");\nscanf(\"%d\"\
  ,&n);\nprintf(\"Enter values in the array: \\n\");\nfor(i=0;i<n;i++)\n{\n      \
  \   scanf(\"%d\",&a[i]);\n}\nprintf(\"Array elements before sorting: \\n\");\nfor(i=0;\
  \ i<n; i++)\n{\n         printf(\"%d\\t\", a[i]);\n}\n//insertion sort \n//n = 数组中的元素个数.\n\
  //temp = 我们想要插入到已排序数组中的临时变量\n// k = 总遍历轮数.\n//j = 用于内部比较的控制变量 \nfor(k=0; k<n; k++)\
  \    \n{\n         temp = a[k];\n         j=k-1;\n         while((a[j]>temp)&&(j>=0))\n\
  \         {\n         a[j+1]=a[j];\n         j--;\n         }\na[j+1]=temp;\n}\n\
  printf(\"\\nArray elements After insertion sort:\\n\");\nfor(i=0;i<n;i++)\n{\n \
  \        printf(\"%d\\t\", a[i]);\n}\nreturn 0;\n}\n```\n\n**输出：**\n\n![](img/un07_21.jpg)\n\
  \n### 7.9.3.4 插入排序分析\n\n1. **插入排序的最佳情况时间复杂度：**\n\n   当数组已经是排序状态时，出现最佳情况。在这种情况下，运行时控制不会进入\
  \ `while` 循环。\n\n   那么，`T (n) = 1 + 1 + …… + 1 (n 次)`\n\n   `T (n) = Ω (n)`\n\n\
  2. **插入排序的最坏情况时间复杂度：**\n   最坏情况发生在数组呈逆序，或者几乎所有数组元素都在未排序的数组位置。\n\n   那么，`T (n) =\
  \ 1+2+3+…………. + (n-1) = n (n-1)/2`。\n\n   `T (n) = O (n²)`\n\n3. **插入排序的平均情况时间复杂度：**\n\
  \   平均情况发生在数组一半的元素处于未排序位置。\n\n   那么，`T (n) = 1+2+3+…………. + (n-1) = n (n-1)/2`。\n\
  \n   `T (n) = Θ (n²)`\n\n   **插入排序的空间复杂度：**\n\n   `O (1)` 是插入排序的空间复杂度。\n\n### 7.9.3.5\
  \ 插入排序：实时示例\n\n逐张纸牌玩家的牌。纸牌者拿起牌并将其插入到所需的位置。因此，在每一步中，我们都把一个项目插入已排序列表的正确位置。\n\n###\
  \ 7.9.3.6 插入排序的优点\n\n1. 插入排序是一种简单的排序方法。\n2. 不需要额外的数据结构。\n3. 对于最佳情况，时间复杂度为 `Ω (n)`。\n\
  4. 插入排序在处理较短列表时具有良好的性能。\n5. 插入排序是原地排序算法，因此空间需求最小。\n\n### 7.9.3.7 插入排序的缺点\n\n1. 当元素几乎是未排序时，插入排序是一种低效的方法。此时，复杂度为\
  \ `O (n²)`。\n2. 随着插入排序中元素数量的增加，算法的性能会受到影响并变慢。插入排序需要大量的元素移动。\n\n### 7.9.4 快速排序\n\n\
  #### 7.9.4.1 快速排序简介\n\n由 C.R. Hoare 引入快速排序是一种非常快的内部排序方法。它基于分治法范式。\n\n#### 7.9.4.2\
  \ 快速排序算法\n\n1. 开始。\n2. 从用户处读取元素总数，假设为 `n`。\n3. 将用户输入的所有元素存储在数组中。\n4. 取数组的第一个元素并作为基准值\
  \ (pivot)。\n5. 现在找到所有小于 `pivot` 的元素，并将它们放在 `pivot` 之前。\n6. 重复步骤 3 和 4，每次将基准值放置在适当位置。该列表将完成排序。\n\
  7. 停止。\n\n#### 7.9.4.3 快速排序示例\n\n大小为 5 的初始数组所示：\n| 25 | 57 | 48 | 38 | 10 |\n| a[0]\
  \ | a[1] | a[2] | a[3] | a[4] |\n\n**第 1 轮：** 设置 `a[0]` 即 `25` 为基准值。现在找到所有小于 `25`\
  \ 的元素并将 `25` 放在这些元素之后。\n| 10 | 25 | 48 | 38 | 57 |\n| sub-list 1 | pivot | | | |\n\
  \n**第 2 轮：** 现在 `sub-list 1` 只有一个元素，不需要排序，但 `sub-list 2` 可以排序。为此，将基准值设置为 `57`。\n\
  | 10 | 25 | 48 | 38 | 57 |\n| sub-list 1 | | | | pivot |\n\n**第 3 轮：** 再次从 `sub-list\
  \ 1` 开始，`48` 是新的基准值。将所有小于 `48` 的元素放在它前面。\n| 10 | 25 | 38 | 48 | 57 |\n| sub-list\
  \ 1 | | pivot | |\n\n此处，`sub-list 1` 包含一个元素，算法停止。因此列表通过快速排序完成排序。\n\n#### 7.9.4.4\
  \ 快速排序程序\n\n```c\n #include<stdio.h>\nvoid quickSort(int list[], int low, int high);\n\
  //main function definition\nint main()\n{\nint list[20], size, i;\nprintf(\"Enter\
  \ size of the list: \");\nscanf(\"%d\", &size);\nprintf(\"Enter %d values: \\n\"\
  , size);\nfor(i=0; i < size; i++)\n{\n         scanf(\"%d\", &list[i]);\n}\nprintf(\"\
  Array elements before sorting:\\n\");\nfor(i=0; i < size; i++)\n{\n         printf(\"\
  %d\\t\", list[i]);\n}\nquickSort(list, 0, size-1);\nprintf(\"\\nArray elements after\
  \ sorting:\\n\");\nfor(i=0; i < size; i++)\n{\n         printf(\"%d\\t\", list[i]);\n\
  }\nreturn 0;\n}\nvoid quickSort(int list[], int low, int high)\n{\nint pivot, l,\
  \ h, temp;\nif(low < high)\n{\npivot = low;\nl = low;\nh = high;\nwhile(l < h)\n\
  {\n        while(list[l] <= list[pivot] && l < high)   // l < high 意味着增加 l 直到达到子列表的索引\n\
  \           {\n           l++;\n           }\n           //此处不比较 low 和 h，因为 list[pivot]\
  \ 元素意味着 list[low] 元素 //两者相同所以 h 永远不会小于 low，low < h 条件不像之前那样被检查。\n           while(list[h]\
  \ > list[pivot])     \n           {\n           h--;\n           }\n//交换 list[l]\
  \ 和 list[h] 元素\nif(l < h)\n{\n        temp = list[l];\n        list[l] = list[h];\n\
  \        list[h] = temp;\n}\n} //外部 while 循环结束\n//交换元素 list[pivot] 和 list[h]\ntemp\
  \ = list[pivot];\nlist[pivot] = list[h];\nlist[h] = temp;\nquickSort(list,low,h-1);\
  \   //排序左子列表\nquickSort(list,h+1,high);  //排序右子列表\n}   // if 结束\n}\n```\n\n**输出：**\n\
  \n![](img/un07_22.jpg)\n\n### 7.9.4.5 快速排序分析\n\n快速排序的时间复杂度计算如下：\n\n`T (n) = {O (n)\
  \ + T(n/2) + T(n/2) }`\n\n`O (n)` = 划分数组的时间。\n\n`T (n/2)` = 排序左子数组的时间。\n\n`T (n/2)`\
  \ = 排序右子数组的时间。\n\n1. **快速排序的最坏情况时间复杂度：**\n   在最坏情况时间复杂度下，每次函数调用都将给定数组分为两个子数组。如果其中一个是空数组，则被视为最坏情况。\n\
  \n   `T (n) = O (n) + T(0) + T (n - 1)`\n\n   `= O (n) + O (n-1) + T (n - 2)`\n\n\
  \   `= O (n) + O (n-1) + O (n-2) + T (n - 3)`\n\n   `= O (n) + O (n-1) + O (n-2)\
  \ + ….. + O (1)`\n\n   `= O (n (n+1) /2)`\n\n   `= O (n2)`\n\n\n\n\n当数组始终被划分为两个几乎相等的部分时，可以进行最优时间分析。\n\
  \n`T (n) = Ω (n) + T (n/2) + T (n/2) = Ω (n) + 2 T (n/2)`\n`T (n) = Ω (n log2 n)`\n\
  \n注意 `log[2] n` 是因为 `log[2] (4)` 得到的值是 2，这意味着每一轮子列表都被划分为两个几乎相等的部分。因此，最优情况下的时间复杂度变为\
  \ `T (n) = Ω (n log[2] n)`。因此，最优划分产生了一种速度更快的算法。\n\n### 3. 快速排序的平均时间复杂度\n\n当数组在大部分时间内被划分为两个几乎相等的部分时，可以进行平均情况时间分析。\n\
  \n`T (n) = Θ (n) + T (n/2) + T (n/2) = Θ (n) + 2 T (n/2)`\n`T (n) = Θ (n log2 n)`\n\
  \n#### 快速排序的空间复杂度\n\n`O (log[2] n)` 是快速排序的空间复杂度。\n\n#### 7.9.4.6 快速排序的优点\n\n1. 快速排序的\
  \ CPU 缓存性能优于其他排序算法。这是因为它的原地特性。CPU 缓存是一种硬件，通过将主内存中部分频繁使用的数据保存在自身来减少访问内存数据的时间。它比主内存更小、速度更快。因此，快速排序是最快的排序算法。\n\
  2. 不需要像合并排序或堆排序那样的额外数据结构。\n3. 在空间方面，快速排序优于合并排序。快速排序所需的空间或内存少于合并排序。\n4. 快速排序是原地排序算法，而合并排序不是。原地排序意味着它不使用额外的存储空间来执行排序。在合并排序中，为了合并已排序的数组，需要一个临时数组，因此它不是原地的。\n\
  5. 快速排序优于相同时间复杂度 `O (n log2 n)` 的其他算法（如合并排序和堆排序）。尽管快速排序在最坏情况下复杂度为 `O(n²)`，但通过选择正确的基准元素，可以高概率地避免这种情况。\n\
  \n#### 7.9.4.7 快速排序的缺点\n\n1. 快速排序的时间效率取决于基准元素的选择。基准元素选择不当会导致最坏情况的时间复杂度。\n2. 在快速排序中实现划分算法较为困难。\n\
  \n### 7.9.5 合并排序\n\n#### 7.9.5.1 合并排序简介\n\n合并排序基于分治算法。在合并排序中，我们将主列表划分为两个子列表，然后继续划分这些子列表，直到子列表达到足够的长度。然后我们比较并排序每个列表的元素。合并两个子列表并对合并后的列表。这个过程将重复，直到得到一个有序的列表。\n\
  \n#### 7.9.5.2 合并排序的算法\n\n`Algorithm mergeSort(arr[], low, high)`\n\n如果 `high >\
  \ low`\n\n1. 找到中心点将数组分为两半：\n   数组或列表的中间索引，`mid = (low + high)/2`\n2. 对左半或第一部分调用\
  \ `mergeSort`：\n   `Call mergeSort(arr, low, high)`\n3. 对右半或第二部分调用 `mergeSort`：\n\
  \   `Call mergeSort(arr, mid+1, high)`\n4. 合并步骤 2 和 3 中排序的两个部分：\n   `Call merge(arr,\
  \ low, mid, high)`\n\n#### 7.9.5.3 合并排序的示例\n\n步骤编号表示步骤执行的顺序。\n\n| 91 | -38 | 48\
