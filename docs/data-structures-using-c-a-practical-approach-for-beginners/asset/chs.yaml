  \n## 7.11 单选题\n\n1. `insertion sort` 排序包含 `n` 个元素的数组时，最好情况的时间复杂度是多少？\n   1. `Ω (n)`\n\
  \   2. `Ω (n log n )`\n   3. `Ω (n²)`\n   4. `Ω (n log n²)`\n   **答案: (A)**\n  \
  \ 解释：\n   在 `insertion sort` 中，最好情况发生在数组已经有序的情况下。在这种情况下，运行时间控制不会进入循环。\n   `T (n)\
  \ = 1 + 1 + …… + 1 (n 次)`\n   `T (n) = Ω (n)`，因此 `insertion sort` 在最好情况下的时间复杂度保持为\
  \ `Ω (n)`。\n\n2. 如果待排序的元素数量很少，那么 …… 排序是高效的。\n   1. `Heap sort`\n   2. `Quick sort`\n\
  \   3. `Merge sort`\n   4. `Selection sort`\n   **答案: (D)**\n   解释：\n   当数组中的元素较少时，`selection\
  \ sort` 是一种很好的排序技术。\n\n3. 哪种排序算法属于优先级队列排序技术？\n   1. `Quick sort`\n   2. `Heap sort`\n\
  \   3. `Insertion sort`\n   4. `Selection sort`\n   **答案: (D)**\n   解释：\n   `selection\
  \ sort` 完全由一个选择阶段组成，在该阶段中搜索数组中的最小元素。一旦找到最小元素，就会将其放在数组的第一个位置，这与优先级队列排序技术相似。\n\n4.\
  \ 排序也被称为分区和交换类型的排序。\n   1. `Quick sort`\n   2. `Heap sort`\n   3. `Insertion sort`\n\
  \   4. `Selection sort`\n   **答案: (A)**\n   解释：\n   `quick sort` 被称为分区和交换类型的排序。\n\
