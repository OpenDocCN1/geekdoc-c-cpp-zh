  \ NULL 地址时，堆上预留的内存保持分配状态且无法被任何人使用，这个问题被称为内存泄漏。\n\n11. 在 `realloc()` 库函数中，如果内存块的新尺寸大于旧尺寸，则新添加的内存空间……..?\n\
