  \ A)` 是两条连接顶点 A 和顶点 B 的不同边。某些边可能将一个节点与其自身连接。这些边称为环。例如，边 `(A, A)` 是一个环。\n\n顶点的度是与之相关的边数。顶点的入度是指向该顶点的边数，顶点的出度是从该顶点出发的边数。例如，在图\
  \ 6.3 中，节点 `B` 的出度为 3，入度为 1，节点 `B` 的度为 4。\n\n#### 6.1.2 空图\n空图是指没有任何顶点的图。\n\n####\
  \ 6.1.3 孤立图\n孤立图是指只有顶点而没有边的图。\n\n#### 6.1.4 完全图\n完全图是指图中任意两个不同的顶点之间都有一条边相连的图。\n\n\
  #### 6.1.5 连通图\n连通图是指图中任意两个顶点之间存在路径。强连通图是指任意两个顶点之间都存在有向路径。\n\n\n\n\n\n![](img/Fig06_12.jpg)\n\
  \n图 **6.12** 有环图。\n\n#### 6.1.3.9 无环图或非环图\n\n`没有环`的图被称为无环图或非环图。\n\n在图 6.13 中，该图没有任何环。因此，它是一个非环图或无环图。\n\
  \n![](img/Fig06_13.jpg)\n\n图 **6.13** 无环图。\n\n#### 6.1.3.10 二分图\n\n如果简单图 `G = (V,\
  \ E)` 的顶点或节点被划分为两个集合 `V1` 和 `V2`，其中 `V = {V1, V2}` 且 `V1 ∩ V2 = ф`，并且 `E` 中的每条边都连接了\
  \ `V1` 中的一个顶点与 `V2` 中的一个顶点，则该图被称为二分图。\n\n一般来说，二分图有两个顶点集合，我们称之为 `V1` 和 `V2`，如果画了一条边，它应该连接集合\
  \ `V1` 中的任何顶点到集合 `V2` 中的任何顶点。图 6.14 所示的图是二分图。\n\n![](img/Fig06_14.jpg)\n\n图 **6.14**\
  \ 二分图。\n\n#### 6.1.3.11 完全二分图\n\n完全二分图是一种简单图，其顶点可以划分为两个不相交的集合 `V1` 和 `V2`，使得 `V1`\
  \ 中的每个顶点与 `V2` 中的每个顶点都相邻。图 6.15 所示了一个完全二分图。\n\n![](img/Fig06_15.jpg)\n\n图 **6.15**\
  \ 完全二分图。\n\n在这里，二分图是指第一个集合 `V1` 中的每个顶点都连接到第二个集合 `V2` 中的每个顶点的简单图。\n\n## 6.2 使用邻接矩阵和邻接表表示图\n\
  \n有两种常用的图表示技术：\n\n1. 邻接矩阵表示法\n2. 邻接表表示法\n\n### 6.2.1 邻接矩阵表示\n\n#### 6.2.1.1 邻接矩阵的定义\n\
  \n考虑一个具有顶点集 `V(G)` 和边集 `E(G)` 的图 `G`。如果 `V(G)` 中有 `N` 个节点，当 `N >= 1` 时，图 `G` 可以用一个邻接矩阵表示，该矩阵是一个具有\
  \ `N` 行 `N` 列的表格，其中：\n\n`A(i, j) = 1` 当且仅当 `E(G)` 中存在边 `(V[i], V[j])` 时，否则为 0。\n\
  \n如果 `E (G)` 中存在连接 `V[i]` 和 `V[j]` 的边，则表格中 `[i, j]` 位置的值为 1，否则为 0。\n\n在这种表示法中，图可以用一个总顶点数乘以总顶点数的矩阵来表示。这意味着如果一个有五个顶点的图，可以使用大小为\
  \ `5 × 5` 的矩阵来表示。在该矩阵中，行和列都是顶点。该矩阵由 1 或 0 填充。这里，1 表示从行顶点到列顶点有边，0 表示从行顶点到列顶点没有边。\n\
  \n#### 6.2.1.2 邻接矩阵示例\n\n参见图 6.16 和 6.17。\n\n![](img/Fig06_16.jpg)\n\n图 **6.16**\
  \ 有向图，`G`。\n\n![](img/Fig06_17.jpg)\n\n图 **6.17** 有向图 `G` 的邻接矩阵。\n\n如果两个节点之间的关系是无序的，则图被称为无序图或无向图（图\
  \ 6.18 和 6.19）。\n\n![](img/Fig06_18.jpg)\n\n图 **6.18** 无向图，`G`。\n\n![](img/Fig06_19.jpg)\n\
  \n图 **6.19** 无向图 `G` 的邻接矩阵。\n\n#### 6.2.1.3 使用邻接矩阵创建或表示图的算法\n\n使用邻接矩阵创建图的算法如下所示：\n\
  \n1. 声明一个数组 `M [size] [size]`，用于存储图，其中 `size = 最大节点数`。\n2. 输入所需的节点数量。\n3. 输入 `V[i]`。\n\
  4. 如果是有向图，则 `M[i][j] = 1`。如果是无向图，则 `M[i][j] = 1`。\n5. `V[j]`。\n\n### 6.2.2 邻接表\n\
  \n#### 6.2.2.1 邻接表基础\n\n由于其静态性，使用邻接矩阵并不合适。邻接表显示了边的数量。通常，邻接表是链链表的数组。数组中的每个项代表一个顶点，列表包含：\n\
  \n1. 节点标识符\n2. 指向下一个链接\n3. 可选权重字段\n\n#### 6.2.2.2 有向图的邻接表示例\n\n图 6.22 展示了节点表示。有向图中节点的出度可以通过计算其链表中的项来确定。然而，确定节点的入度很难，但我们可以轻松地获取出度（图\
  \ 6.21）。\n\n#### 6.2.2.3 加权图的邻接表示例\n\n图 6.23 展示了一个加权图（图 6.24），图 6.25 展示了其节点表示。\n\
  \n## 6.3 图遍历技术（广度优先搜索和深度优先搜索）\n\n图遍历是一种用于在图中搜索顶点或节点的程序。图遍历还用于决定在搜索过程中访问顶点的顺序，且仅访问一次。图遍历意味着每个节点恰好访问一次。\n\
  \n\n\n\n\n图遍历技术共有两种类型，它们如下：\n\n1. 广度优先搜索 (BFS)\n2. 深度优先搜索 (DFS)\n\n### 6.3.1 图的\
  \ BFS 遍历\n\n#### 6.3.1.1 BFS 遍历的基础\n\n在图中，假设顶点 `V[1]` 首先被访问，然后遍历与 `V[1]` 邻接的所有顶点，假设与\
  \ `V[1]` 邻接的顶点为 `(V[2], V[3])`，然后再次从 `V[2]` 开始打印其邻接顶点。这个过程将持续到遇到所有的顶点。为了跟踪所有的顶点及其邻接顶点，我们将使用一个数组来记录已访问节点。被访问过的节点设置为\
  \ 1。这样，我们就可以跟踪已访问的节点。\n\n#### 6.3.1.2 图 BFS 遍历算法\n\n```\n // 数组 visited [ ] 初始化为\
  \ 0。\n// q 是队列类型的数据结构。\n// 在图 G 上执行 BFS 遍历，从顶点 V 开始。\nvoid  BFS( int v)\n{ \n  q:\
  \ 一个队列类型变量\n  Initialize q;\n  visited[ v] = 1;    //标记 v 为已访问\n  将顶点 v 添加到队列 q;\n\
  \  while( q is not empty )\n  {\n  打印节点 v;\n  v  → 从队列中删除一个元素；\n  对于所有与 v 邻接的顶点\
  \ w\n  { \n       if ( ! visited[ w] ) \n       {\n       visited[ w] = 1;\n   \
  \    将顶点 w 添加到队列 q;\n       } // if 语句结束\n } // for 循环结束\n} // while 循环结束 \n} //\
  \ BFS 函数结束\n```\n\n#### 6.3.1.3 BFS 示例\n\n找到图中图 G 的 BFS 遍历（参见图 6.26）。\n\n![](img/Fig06_26.jpg)\n\
