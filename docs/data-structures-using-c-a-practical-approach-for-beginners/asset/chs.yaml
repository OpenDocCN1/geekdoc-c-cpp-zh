  printf(\"\\n 先创建二叉搜索树\");\nelse\nin-order(root);\nbreak;\ncase 3:\nif(root==NULL)\n\
  printf(\"\\n 先创建二叉搜索树\");\nelse\n{\nprintf(\"\\n 输入要搜索的数据\");\nscanf(\"%d\", &key);\n\
  temp=search(root, key, &parent);\nprintf(\"\\n%d\", temp->data);\n}\nbreak;\ncase\
  \ 4:\nif(root==NULL)\nprintf(\"\\n 先创建二叉搜索树 \");\nelse\n{\nprintf(\"\\n 输入要删除的数据\"\
  );\nscanf(\"%d\", &key);\ndelet(root, key);\n}\nbreak;\ncase 5:\nexit(0);\ndefault:\n\
  printf(\"\\n 选择错误\");\n}\nprintf(\"\\n 您想继续操作二叉搜索树吗[y/n]\");\nfflush(stdin);\nscanf(\"\
  %c\",&ch);\n}while(ch=='y' || ch=='Y');\nreturn 0;\n}\n// 在二叉搜索树中插入元素\nvoid insert(struct\
  \ bst *root, struct bst *new1)\n{\nif(root->data<new1->data)\n{\n        if(root->right==NULL)\n\
  \        {\n        root->right=new1;\n        }\n        else\n        {\n    \
  \    insert(root->right, new1);\n        }\n}\nif(root->data>new1->data)\n{\n  \
  \      if(root->left==NULL)\n        {\n        root->left=new1;\n        }\n  \
  \      else\n        {\n        insert(root->left, new1);\n        }\n}\n}\n// 在二叉搜索树中搜索节点，并返回被搜索节点的地址以及其\
  \ //父 节点的地址\nstruct bst * search(struct bst *root, int key, struct bst **parent)\n\
  {\nstruct bst *temp;\ntemp=root;\nwhile(temp!=NULL)\n{\n        if(temp->data==key)\n\
  \        {\n        printf(\"\\n 找到节点\");\n        return temp;\n        }\n   \
  \     else\n        {\n        *parent=temp;   // 更新调用函数中的父节点地址\n        if(temp->data<key)\n\
  \        {\n        temp=temp->right;\n        }\n        else\n        {\n    \
  \    temp=temp->left;\n        }\n        }   // else else 语句结束\n} // while 循环结束\n\
  \nprintf(\"\\n 未找到节点\");  \nreturn NULL;   // 如果二叉搜索树中不存在该节点，则返回 NULL 地址\n}  //\
  \ search 函数结束\n// 从二叉搜索树中删除节点\nvoid delet(struct bst *root, int key)\n{\nstruct\
  \ bst * parent, *temp, *temp_succ;\ntemp=search(root, key, &parent);\nif(temp ==\
  \ NULL)\n{\nprintf(\"\\n 二叉搜索树中未找到该节点\");\nreturn ;\n}\nif(temp == root)\n{\nprintf(\"\
  \\n 您要删除的节点是根节点，我们无法删除根节点\");\nreturn ;\n}\n\n// 删除有两个子节点的节点\nif( (temp->right!=NULL)\
  \ && (temp->left!=NULL) )\n{\nparent=temp;\ntemp_succ=temp->right;\nwhile(temp_succ->left!=NULL)\
  \   //寻找 temp 节点的中序后继\n{\nparent=temp_succ;\ntemp_succ=temp_succ->left;\n}\ntemp->data=temp_succ->data;\
  \  //将中序后继节点的数据拷贝到 temp 节点\nif(temp_succ==temp->right)    //如果中序后继节点是 temp 节点的右侧\n\
  {\nparent->right=NULL;\n}\nelse      //如果中序后继节点是 temp 节点的左侧\n{\nparent->left=NULL;\n\
  }\n}\n```\n\n\n\n\n### 步骤 3：检查根节点和新节点中的数据。如果根节点的数据大于新节点的数据，则进入左子树。此外，检查根节点的左指针是否包含\
  \ `NULL` 地址。如果根节点的左指针包含 `NULL` 地址，则将新节点挂载到当前根节点的左侧。否则，使用新根节点的地址和新创建节点的地址递归地调用 `insert`\
  \ 函数。此处，当前根节点包含左子树的地址。在此处，新创建节点的地址保持不变，显示所示：\n\n```\n if(root->data > new1->data)\n\
  {\n      if(root->left==NULL)\n      {\n      root->left=new1;\n      }\n      else\n\
  \      {\n      insert(root->left, new1);\n      }\n}\n```\n\n### 步骤 4：如果新节点已放置在正确的位置，则停止递归调用\
  \ `insert` 函数。\n\n### 步骤 5：停止\n\n### 5.6.3 BST 算法中的节点查找\n\n**算法 `bst search (struct\
  \ bst *root, int key, struct bst **parent)`**\n\n步骤 1：开始\n\n步骤 2：检查是否创建了二叉搜索树（BST）。\n\
  \n```\n If root=NULL, then\n```\n\n打印“先创建二叉搜索树。”\n\n否则\n\n从用户处获取想要在 BST 中查找的 `key`。\n\
  \n步骤 3：将根节点的地址复制到 `temp` 指针中以用于遍历。\n\n```\n temp= root\n```\n\n步骤 4：检查 `temp` 指针的数据部分与要查找的\
  \ `key` 是否匹配，直到 `temp` 指针包含 `NULL` 地址为止。如果 `temp` 指针的数据与 `key` 匹配，则显示消息“找到节点”并返回所查找节点的地址。\n\
  \n步骤 5：如果 `temp` 指针的数据与 `key` 不匹配，则按照如下方式将当前 `temp` 的地址复制到 `parent` 指针中：\n\n```\n\
  \ *parent=temp;\n```\n\n步骤 6：如果 `temp` 指针的数据小于 `key` 值，则将右子树的地址赋值给 `temp` 指针。\n\n\
  ```\n if (temp->data<key)\n{\ntemp=temp->right;\n}\n```\n\n步骤 7：否则，将左子树的地址赋值给 `temp`\
  \ 指针。\n\n```\n temp=temp->left;\n```\n\n重复步骤 4–7，直到 `temp` 指针包含 `NULL` 地址。\n\n步骤\
  \ 8：如果 `temp` 指针包含 `NULL` 地址，则打印“未找到节点。”\n\n步骤 9：停止。\n\n### 5.6.4 BST 中删除任意节点的算法\n\
  \n**算法 `delet (struct bst *root, int key)`**\n\n步骤 1：开始\n\n步骤 2：检查是否创建了二叉搜索树。\n\n\
  ```\n If root=NULL, then\n```\n\n打印“先创建二叉搜索树。”\n\n否则\n\n从用户处获取想要从 BST 中删除的 `key`。\n\
  \n步骤 3：调用 `search` 函数。在执行 `search` 函数后会返回两个地址：一个是存储在 `temp` 指针中要删除的节点地址，另一个是存储在\
  \ `parent` 指针中要删除的父节点地址。\n\n步骤 4：首先检查 `temp` 指针是否为 `NULL`。如果 `temp` 指针为 `NULL`，则打印消息“二叉搜索树中未找到节点”并返回调用函数。\n\
  \n步骤 5：如果 `temp` 指针不为 `NULL`，则检查 `temp` 指针是否包含根节点的地址。如果 `temp` 包含根节点，则打印消息“你要删除的节点是根节点，我们无法删除根节点”并返回调用函数。\n\
  \n步骤 6：如果 `temp` 指针不包含根节点的地址，则检查要删除的节点是否有两个孩子。如果条件成立，则找到它的中序后继（in-order successor），用中序后继节点的值替换被删除节点的值，并从\
  \ BST 中释放中序后继节点。\n\n```\n if ( (temp->right!=NULL) && (temp->left!=NULL) )\n   \
  \                     {\n                        parent=temp;\n                \
  \        temp_succ=temp->right;\n                        while(temp_succ->left!=NULL)\
  \   //寻找节点的中序后继\n                        {\n                        parent=temp_succ;\n\
  \                        temp_succ=temp_succ->left;\n                        }\n\
  \                        temp->data=temp_succ->data;  //将中序后继\n                \
  \        节点的数据复制到 temp \n                             节点\n                     \
  \   if(temp_succ==temp->right)    //如果中序后继\n                        节点在 temp 节点的右侧\n\
  \                        {\n                        parent->right=NULL;\n      \
  \                  }\n                        else      //如果中序后继节点在 temp 节点的左侧\n\
  \                        {\n                        parent->left=NULL;\n       \
  \                 }\n                        free(temp_succ);     //释放中序后继节点 \n\
  \                        temp_succ = NULL;\n                        } \n```\n\n\
  步骤 7：如果要删除的节点没有两个孩子，则检查该节点是否仅包含右孩子。如果条件成立，找到 `temp` 节点是在 `parent` 的左侧还是右侧。如果 `temp`\
  \ 是在 `parent` 的右侧，则将 `temp` 节点的右指针地址赋值给 `parent` 的右指针。否则，将 `temp` 节点的右指针地址赋值给 `parent`\
  \ 的左指针。此外，释放 `temp` 节点。\n\n```\n else if((temp->right!=NULL)&&(temp->left==NULL))\n\
  \                        {\n                        if(parent==temp)   //寻找 temp\
  \ 节点是\n                        parent 的左侧还是右侧\n                        {\n     \
  \                   parent->right=temp->right;\n                        }\n    \
  \                    else\n                        {\n                        parent->left=temp->right;\n\
  \                        }\n                        temp->right=NULL;\n        \
  \                temp->left=NULL;\n                        free(temp);\n       \
  \                 temp=NULL;\n                        }\n```\n\n步骤 8：如果要删除的节点不只包含右孩子，则检查该节点是否仅包含左孩子。如果条件成立，找到\
  \ `temp` 节点是在 `parent` 的左侧还是右侧。如果 `temp` 是 `parent` 的右侧，则将 `temp` 节点的左指针地址赋值给 `parent`\
  \ 的右指针。否则，将 `temp` 节点的左指针地址赋值给 `parent` 的左指针。此外，释放 `temp` 节点。\n\n```\n else if((temp->right==NULL)&&(temp->left!=NULL))\n\
  \                        { \n                        if(parent->left==temp)  //寻找\
  \ temp 节点是\n                        parent 的左侧还是右侧\n                        {\n\
  \                        parent->left=temp->left;\n                        }\n \
  \                       else\n                        {\n                      \
  \  parent->right=temp->left;\n                        }\n                      \
  \  temp->right=NULL;\n                        temp->left=NULL;\n               \
  \         free(temp);\n                        temp=NULL;\n                    \
  \    }\n```\n\n步骤 9：如果要删除的节点不只包含左孩子，则检查该节点是否既不包含左右孩子。如果条件成立，找到 `temp` 节点是在 `parent`\
  \ 的左侧还是右侧。如果 `temp` 是 `parent` 的左侧，则将 `parent` 节点的左指针赋值为 `NULL`，否则将 `parent` 节点的右指针赋值为\
  \ `NULL`。此外，释放 `temp` 节点。\n\n\n\n\n\n```c\n else if((temp->right==NULL)&&(temp->left==NULL))\n\
  \                        {\n                        if(parent->left==temp)  //查找\
  \ temp 节点是左节点\n                        还是父节点的右节点\n                        {\n  \
  \                      parent->left=NULL;\n                        }\n         \
  \               else\n                        {\n                        parent->right=NULL;\n\
  \                        }\n                        free(temp);\n              \
  \          temp=NULL;\n                        }\n```\n\n### 步骤 10：检查所有条件后，打印删除节点的值。\n\
  \n### 步骤 11：停止\n\n```c\n //使用中序遍历方法\n                        显示二叉搜索树\n         \
  \               void in-order(struct bst *temp)\n                        {\n   \
  \                     if(temp!=NULL)\n                        {\n              \
  \          in-order(temp->left);\n                        printf(\"\\n%d\",temp->data);\n\
  \                        in-order(temp->right);\n                        }\n   \
  \                     }\n```\n\n### 5.6.5 BST 的中序遍历算法\n\n根节点为 `R` 的二叉搜索树 `T` 的中序遍历。\n\
  \n**算法 `in-order (root R)`**\n\n1. 遍历根节点 `R` 的左子树，即调用 `in-order (left sub-tree)`\n\
  2. 访问根节点 `R` 并处理。\n3. 遍历根节点 `R` 的右子树，即调用 `in-order (right sub-tree)`\n\n## 5.7 二叉树和\
  \ BST 的应用\n\n1. `BST` 用于实现字典。\n2. `BST` 用于实现数据库中的多级索引。\n3. `BST` 用于实现搜索算法。\n4. `Heaps`（堆）是一种特殊的二叉树：用于实现高效的优先级队列，优先级队列又被用于许多操作系统的进程调度、路由器中的服务质量以及人工智能应用（包括机器人和视频游戏）中的路径查找算法。它也被用于堆排序。\n\
  5. 语法树：在编译器的语法分析阶段，为对表达式进行自顶向下解析或自底向上解析，会绘制解析树或语法树。\n6. `BST` 用于 Unix 内核管理一组虚拟内存区域（VMA）。每个\
  \ `VMA` 代表 Unix 进程中的一段内存。\n7. 互联网主机发送的每个 `IP` 数据包都带有一个 16 位的 `id`，该 ID 对于该源目的对必须是唯一的。Linux\
  \ 内核使用 `AVL tree` 或高度平衡树来处理索引 IP 地址。\n8. `BST` 用于以排序的形式高效存储数据，以便快速访问和搜索存储的元素。\n\
  9. `BST` 用于动态排序。\n10. **哈夫曼树构建：** 一种构造最小冗余码的方法。`Huffman code`（哈夫曼码是一种最优前码，通常用于无损数据压缩。该算法由\
  \ David A. Huffman 开发。该技术通过创建一个节点二叉树来工作。节点数量取决于符号的数量。\n\n其核心思想是将普通输入转换为变长编码。与其他熵编码方法一样，最常见的符号通常使用的位比特比不常见的符号少。\n\
  \n**哈夫曼编码：**\n\n一种基于给定文档中实际字符频率的变长编码。\n\n哈夫曼编码使用二叉树：\n\n1. 用于确定每个字符的编码。\n2. 用于解码需要解压缩的压缩文件，将其还原为\
  \ ASCII 格式。仅包含六个字符的文本哈夫曼树示例：\n\n叶子节点是字符。\n\n左分支标记为 0，右分支标记为 1。\n\n如果你遵循从根到叶的路径，即可得到叶子节点字符的编码。\n\
  \n示例：`101 = ‘j’` 和 `01 = ‘m’`。\n\n出现频率越高的字符离根节点越近，因此编码所需的内存越少。\n\n**构建哈夫曼树：**\n\n\
  1. 首先读取文本，确定每个字符的频率。\n2. 为文本中的每个字符创建一个包含字符和频率对的节点列表，并按频率排序。\n3. 移除并合并两个最小频率的节点，创建一个新节点作为它们的父节点。\n\
  \    1. 频率最低的左子节点。\n    2. 频率次低的右子节点。\n    3. 父节点的频率等于其子节点（即左节点和右节点）频率之和。\n4. 将父节点添加到节点列表中，保持列表的排序顺序。\n\
  5. 只要列表中只有一个节点，就重复步骤 3 和 4，该节点将是所示图 5.41 中的哈夫曼树根。![](img/Fig05_41.jpg)\n\n**图**\
  \ **5.41** 哈夫曼树。\n\n11. 二叉树是表示算术表达式的好方法。叶子节点或外部节点是操作数，内部节点是运算符。二叉表达式树可以描述的两种常见表达式类型是代数布尔。这些二叉树可以表示包含一元和二元运算符的表达式。\n\
  \n二叉树的每个节点（即在二叉表达式树中）有零、一个或两个孩子。这种紧密的排列简化了表达式树的处理。\n\n## 5.8 堆 (Heaps)\n\n### 5.8.1\
  \ 堆的基础\n\n堆结构是一种特殊的二叉树。\n\n二堆有两种类型：\n\n1. 最大堆\n2. 最小堆\n\n### 5.8.2 最大堆的定义\n\n最大堆定义如下：\n\
  \n1. 二叉树是**完全二叉树**。也就是说，每个叶子节点要么在 `d` 层，要么在 `d-1` 层，这意味着层之间只允许一层的差异。在深度 `d`（即最底层），如果存在节点，则其左侧的所有节点都应该存在。\n\
  2. 节点中的键排列使得每个节点的内容小于或等于其父节点的内容，这意味着对于节点 `info[i] <= info[j]`，其中 `j` 是节点 `i` 的父节点。这种堆被称为最大堆。\n\
  \n在这里，二叉树的每一层都从左到右填充。\n\n在最小堆中，根节点的键必须是所有存在键中最小的。这一特征迭代地适用于二叉树中的所有节点。\n\n**最大堆示例（图\
  \ 5.42）。**\n\n![](img/Fig05_42.jpg)\n\n**图** **5.42** 最大堆的示例。\n\n### 5.8.3 最大堆执行的操作\n\
  \n在堆数据结构上执行以下操作：\n\n1. 插入或创建堆\n2. 删除\n3. 查找最大值。\n\n#### 5.8.3.1 最大堆中的插入操作\n\n最大堆中的插入操作使用以下算法：\n\
  \n步骤 1：开始\n步骤 2：从左到右将新节点作为最后一个叶子添加。\n步骤 3：相对于父节点检查新节点。\n步骤 4：如果新节点值大于父节点，则交换两者。\n\
  步骤 5：只要新节点值小于父节点或新节点到达根节点，就重复步骤 3 和 4。\n步骤 6：停止\n\n插入新键需要 **O (log n)** 时间。\n\n\
  **示例（图 5.43）：**\n\n![](img/Fig05_43.jpg)\n\n**图** **5.43** 大小为 5 的最大堆。\n\n\n\n\n\
  上述二叉树是一棵几乎完全二叉树，每个节点的内容或值都小于其父节点的内容，且二叉树的每一层都从左到右填充。也就是说，根据最大堆数据结构，该二叉树同时满足顺序和结构属性，因此上述二叉树是一个大小为\
  \ 5 的最大堆。\n\n现在在上述大小为 5 的最大堆中插入一个值为 65 的新节点。\n\n### 步骤 1：从左到右将值为 65 的 `new node`\
  \ 作为 `last leaf` 插入，这意味着新节点被添加为值为 35 的节点的左子节点。添加 65 后，最大堆如下：\n\n![](img/un05_06.jpg)\n\
  \n### 步骤 2：将 `new node` 的值 (65) 与其父节点的值 (35) 进行比较。这意味着 `65 > 35`\n\n![](img/un05_07.jpg)\n\
  \n此时，新节点的值 (65) 大于其父节点的值 (35)，则交换两者。交换后，最大堆如下所示：\n\n### 步骤 3：现在，再次将新节点的值 (65) 与其父节点的值\
  \ (55) 进行比较。此处，新节点的值 (65) 大于其父节点的值 (55)，则交换两者。交换后，最大堆如下所示：\n\n![](img/un05_08.jpg)\n\
  \n### 步骤 4：现在新节点已成为根节点，因此停止比较，大小为 6 的最终堆如图 5.44 所示。\n\n![](img/Fig05_44.jpg)\n\n\
  FIGURE 5.44 插入节点 65 后大小为 6 的最大堆。\n\n#### 5.8.3.2 最大堆中的删除操作\n\n在最大堆中，移除最后一个节点是非常简单的因为它因为它破坏最大堆的特性。从最大堆中移除根节点具有挑战性，因为它会破坏最大堆特性。我们使用以下步骤从最大堆中移除根节点。\n\
  \n步骤 1：开始\n步骤 2：将根节点与最大堆中的最后一个节点交换。\n步骤 3：交换后，移除最后一个节点。\n步骤 4：比较根节点的值与其左子节点的值。\n\
  步骤 5：如果根节点的值小于其左子节点，则比较左子节点的值与其右兄弟节点。如果不是，继续执行步骤 7。\n步骤 6：如果左子节点的值大于其右兄弟节点，则将根与左子节点交换。否则，将根与其右子节点交换。\n\
  步骤 7：如果根节点的值大于其左子节点，则比较根的值与右子节点的值。\n步骤 8：如果根的值小于其右子节点，则将根与右子节点交换。否则，停止过程。\n步骤 9：重复相同的操作直到根节点被设置到正确位置。\n\
  步骤 10：停止。\n\n插入键需要 `O (log n)` 时间。\n\n**示例 (图 5.45):**\n\n![](img/Fig05_45.jpg)\n\
  \nFIGURE 5.45 大小为 6 的最大堆。\n\n在上述最大堆中，如果我们想删除值为 65 的根节点，请遵循以下步骤：\n\n**步骤 1：**将最大堆中的根节点\
  \ 65 与最后一个节点 35 交换。交换后，最大堆如下：\n\n![](img/un05_09.jpg)\n\n**步骤 2：**从最大堆中删除最后一个节点\
  \ 65。从最大堆中删除值为 65 的节点后，最大堆如下：\n\n![](img/un05_10.jpg)\n\n**步骤 3：**比较根节点 35 与其左子节点\
  \ 32。此处，值为 35 的节点大于其左子节点。因此，我们用值为 35 的节点与其右子节点 55 进行比较。此处，值为 35 的节点小于其右子节点 55。因此，我们交换两者。交换后，最大堆如下：\n\
  \n![](img/un05_11.jpg)\n\n此处，值为 35 的节点没有左右子节点。因此，我们停止过程。\n\n最后，删除根节点 65 后的最大堆如下：\n\
  \n![](img/un05_12.jpg)\n\n#### 5.8.3.3 在最大堆中寻找最大值\n\n在最大堆中寻找最大值节点非常简单。在最大堆中，根节点具有最大堆中所有节点的最大值。因此，我们可以直接将根节点的值作为最大堆中的最大值。\n\
  \n### 5.8.4 堆的应用\n\n1. **堆排序：** 堆排序使用二叉堆在 `O (n log n)` 时间内对数组排序。\n2. **图算法：** 优先级队列特别用于\
  \ Dijkstra 最短路径和 Prim 最小生成树等图算法。\n3. **优先级队列：** 优先级队列可以使用二叉堆进行有效实现。\n\n## 5.9 AVL\
  \ 树\n\n### 5.9.1 引言\n\nAVL 树是一种自平衡二叉搜索树。在 AVL 树中，任意节点左右子树的高度差最多为 1。\n\n### 5.9.2\
  \ 定义\n\n如果任意节点左右子树的高度差为 -1、0 或 1，则 AVL 树是平衡的。这种差异被称为平衡因子。\n\n`BF(T) = height(left_subtree)\
  \ - height(right_subtree)`\n\n如果 AVL 树的任意节点的平衡因子超过 1，则必须进行重新平衡。\n\n### 5.9.3 AVL\
  \ 树旋转\n\n在 AVL 树中，每次执行插入和删除操作后，我们必须检查每个节点的平衡因子。如果每个节点都符合平衡因子条件，则完成操作；否则，我们必须通过旋转操作使其平衡。\n\
  \n以下是四种旋转：\n\n1. **L L 旋转**（左旋）\n2. **R R 旋转**（右旋）\n3. **L R 旋转**（左右旋）\n4. **R L\
  \ 旋转**（右左旋）\n\n**示例：**\n\n1. **L L 旋转：** 当在节点 A 左子树的左子树中插入新节点时使用。\n![](img/un05_13.jpg)\n\
  \n2. **R R 旋转：** 当在节点 A 右子树的右子树中插入新节点时使用。\n![](img/un05_14.jpg)\n\n3. **L R 旋转：**\
  \ 当在节点 A 左子树的右子树中插入新节点时使用。\n![](img/un05_15.jpg)\n\n4. **R L 旋转**\n\n\n\n\n\n当新节点插入到节点\
  \ A 右子树的左子树时使用。\n\n![](img/un05_16.jpg)\n\n### 5.9.4 AVL 树的操作\n\n在 AVL 树中执行以下操作：\n\
  \n1. 在 AVL 树中搜索节点\n2. 在 AVL 树中插入节点\n3. 从 AVL 树中删除节点\n\n#### 5.9.4.1 AVL 树中的搜索操作\n\
  \n在 AVL 树中，搜索操作的时间复杂度为 `O (log n)`。搜索操作与 `BST` 的搜索操作相同。我们使用以下步骤在 AVL 树中搜索元素：\n\n\
  1. 第 1 ：开始\n2. 第 2 ：从用户处读取搜索元素。\n3. 第 3 ：下一步，将搜索元素与树根节点的值进行比较。\n4. 第 4 ：如果两者相等，则显示“找到元素”并结束搜索函数。\n\
  5. 第 5 ：如果两者不相等，则验证搜索元素小于还是大于父节点的值。\n6. 第 6 ：如果搜索元素较小，则继续在左子树中搜索。\n7. 第 7 ：如果搜索元素较大，则继续在右子树中搜索。\n\
  8. 第 8 ：只要找到确的元素或到达叶子节点，就重复上述操作。\n9. 第 9 ：如果我们到达具有搜索值的节点，则显示“找到元素”并终止函数。\n10. 第\
  \ 10：如果我们到达一个叶子节点且不匹配，则显示“未找到元素”并终止函数。\n11. 第 11：停止。\n\n#### 5.9.4.2 AVL 树中的插入操作\n\
  \n在 AVL 树中，插入操作以 `O (log n)` 时间复杂度执行。在 `AVL Tree` 中，新节点始终作为叶子节点插入。插入操作如下：\n\n1.\
  \ 第 1 ：开始\n2. 第 2 ：按照 `BST` 插入逻辑在树中插入新项。\n3. 第 3 ：插入完成后，检查每个节点的平衡因子。\n4. 第 4 ：如果每个节点的平衡因子为\
  \ `0`、`1` 或 `-1`，则跳转到第 6 步。\n5. 第 5 ：如果节点的平衡因子不是 `0`、`1` 或 `-1`，则认为树是不平衡的。此时执行适当的旋转技术以实现平衡。此外，继续后续操作。\n\
  6. 第 6 ：停止。\n\n**示例：**\n\n**在 AVL 树中插入以下节点：**\n\n**55, 66, 77, 15, 11 和 33**\n\n\
  | 新标识符 | 插入后 | 旋转技术 | 重平衡后 |\n| :--- | :--- | :--- | :--- |\n| 55 | ![](img/un05_17.jpg)\
  \ | | 不需要重平衡 |\n| 66 | ![](img/un05_18.jpg) | | 不需要重平衡 |\n| 77 | ![](img/un05_19.jpg)\
  \ | | |\n| 15 | ![](img/un05_20.jpg) | | 不需要重平衡 |\n| 11 | ![](img/un05_21.jpg) |\
  \ | |\n| 33 | ![](img/un05_22.jpg) | | |\n\n#### 5.9.4.3 AVL 树中的删除操作\n\n在 `AVL Tree`\
  \ 中，删除操作类似于 `BST` 中的删除操作。然而，在每次删除操作后，我们必须检查平衡因子条件。如果删除后树是平衡的，则进入下一个操作，否则执行适当的旋转使树平衡。\n\
  \n### 5.9.5 优点\n\n1. 与插入和删除次数相比，搜索操作的次数相对较大。使用 `AVL tree` 总是能带来优的性能。\n2. 这里的主要目标是保持树始终平衡。这种平衡使得树的深度保持在最小，减少了整体搜索成本。\n\
  3. `AVL tree` 为动态表提供了最佳性能。\n\n### 5.9.6 缺点\n\n1. 从 AVL 树中插入和删除任何节点都会变得复杂。\n\n###\
  \ 5.10 B 树\n\n#### 5.10.1 B 树简介\n\n`B tree` 不是二叉树。`B tree`是一种平衡 m 路树，每个树节点包含最多 `(m-1)`\
  \ 个数据元素，并有 `m` 个分支或链接。\n\n例如，一个平衡的四路树节点包含三个数据字段和四个链接字段，如下：\n\n![](img/un05_23.jpg)\n\
  \n`B tree` 应用于外部排序。\n\n在 `BST`、`AVL Tree` 中，每个节点只能有一个值或键，且最多有两个孩子，但存在其他类型的搜索树称为\
  \ `B-Tree`，在其中节点可以存储多个值或键，并且可以有两个以上的孩子。`B-Tree` 由 Bayer 和 McCreight 于 1972 年开发，名为“高度平衡\
  \ m 路搜索树”。\n\n#### 5.10.2 B 树的性质\n\n1. 所有叶子节点都处于同一层。\n2. 根节点至少有两个孩子。\n3. 根节点外的每个内部节点至少有\
  \ `ceil(m/2)` 个孩子。\n4. 每个节点最多有 `m` 个孩子。\n5. 具有 `k` 个键的节点有 `k+1` 个孩子。\n6. 第 i 个子树的所有键小于第\
  \ i 个键，第 i+1 个子树的所有键大于第 i 个键。\n7. 每个节点中的键按递序存储。\n\n### 5.10.3 B 树的操作\n\n#### 5.10.3.1\
  \ B 树插入\n\n在 `B-Tree` 中，新元素被添加到叶子节点。插入操作如下：\n\n1. 第 1 ：开始\n2. 第 2 ：如果树为空，创建根节点。\n\
  3. 第 3 ：如果叶子节点有空间，按排序插入键。\n4. 第 4 ：如果叶子节点满了，将其分为两个节点并将中值移到父节点。\n5. 第 5 ：如果父节点也满了，将其分裂并将中值移到下一层。\n\
  6. 第 6 ：停止。\n\n**示例：**\n\n考虑一个阶 4 的 B 树，它是一个平衡四路树，每个节点可以容纳三个数据。假设我们要插入以下数据：**1,\
  \ 5, 6, 2, 8, 11, 13, 18, 20, 7, 9。**\n\n**步骤：**\n\n首先，将值 1 放置在一个节点中，该节点还可以容纳两个值，即\
  \ 5 和 6。\n\n![](img/un05_24.jpg)\n\n当插入第四个值 2 时，节点按中值 5 分裂为两个叶子节点，父节点为 5。\n\n![](img/un05_25.jpg)\n\
  \n然后，将 8 和 11 添加到叶子节点。\n\n![](img/un05_26.jpg)\n\n插入 13。然而，右叶子节点满了。因此，它按中值 8 分裂，并将\
  \ 8 移到父节点。此外，右叶子节点被分裂为多个节点。\n\n![](img/un05_27.jpg)\n\n插入 18，所示：\n\n![](img/un05_28.jpg)\n\
  \n插入 20，所示：\n\n![](img/un05_29.jpg)\n\n接下来插入 7，然后是 9，所示：\n\n![](img/un05_30.jpg)\n\
  \n#### 5.10.3.2 B 树删除\n\n`delete` 方法允许你搜索第一个要删除的记录。\n\n\n\n\n\n1. 如果记录在叶子节点中，删除操作非常简单。删除记录以及相应的指针即可。\n\
  \n2. 如果记录不在叶子节点中，则用其后继节点的副本替换，后继节点是后续值较大的记录。\n\n**示例：**\n\n![](img/un05_31.jpg)\n\
  \n如果搜索 20，则从该节点中删除 20。删除后，B 树如下：\n\n![](img/un05_32.jpg)\n\n如果删除元素 5，则找到它的后继节点元素（即\
  \ 6），并用 6 替换 5。\n\n删除元素 5 后，B 树变为如下：\n\n![](img/un05_33.jpg)\n\n### 5.10.3.3 B 树中的搜索操作\n\
  \n在 B 树中，搜索函数与二叉搜索树（BST）相同。在 BST 中，搜索过程从根节点开始，其余时间内我们进行二路选择：进入左子树或右子树。在 B 树中，搜索过程同样从根节点开始，但每次我们进行\
  \ n 叉选择，其中 n 是该节点拥有的子总数。在 B 树中，搜索操作的时间复杂度为 `O (log n)`。搜索步骤如下：\n\n1. 步骤 1：开始。\n\n\
  2. 步骤 2：首先，从用户处读取搜索元素。\n\n3. 步骤 3：将搜索元素与树中根节点的第一个键值进行比较。\n\n4. 步骤 4：如果两者相等，则显示“找到节点”并结束函数。\n\
  \n5. 步骤 5：如果两者不匹配，则验证搜索元素小于还是大于该键值。\n\n6. 步骤 6：如果搜索元素较小，则在左子树中继续搜索。\n\n7. 步骤 7：如果搜索元素较大，则与同一节点中的下一个键值比较，并重复步骤\
  \ 3、4、5 和 6，直到找到精确匹配或完成与叶子节点中最后一个键值的比较。\n\n8. 步骤 8：如果完成了叶子节点中最后一个键值的比较，则显示“未找到元素”并终止函数。\n\
  \n9. 步骤 9：停止。\n\n### 5.10.4 B 树的用途\n\n1. B 树用于外部排序目的。\n\n2. B 树用于数据库管理系统。\n\n##\
  \ 5.11 B+ 树\n\n### 5.11.1 B+ 树简介\n\nB+ 树不是二叉树。B+ 树是一种平衡 m 叉树，即每个树节点最多包含 (m-1) 个数据元素，并有\
  \ m 个分支或链接。\n\n在 B+ 树中，所有叶子节点都连接在一起，形成一个顺序键的链表。\n\nB+ 树包含两个部分：\n\n1. 索引部分是内部节点。\n\
  \n2. 序集是叶子节点或外部节点。\n\n连接的叶子节点是 B+ 树的一个亮点。键既可以直接访问也可以顺序访问。B+ 树用于提供索引顺序文件组织。序集中的键值是记录集合中的键值。索引部分的键值仅存在于直接访问序集的内部目的。\n\
  \n在 B+ 树中，`+` 表示比 B 树额外的功能，即叶子节点是连接的。\n\n### 5.11.2 m 阶 B+ 树具有以下属性\n\n1. 所有叶子节点必须处于同一层级。\n\
  \n2. 每个节点最多有 m 个子节点或链接部分。\n\n3. 每个节点的键数量比子节点少一个，最多有 m-1 个键或数据值。\n\n4. 键在节点内按定义顺序排列，例如升序。此外，左子树中的所有键值小于该键，右子树的键值较大。\n\
  \n5. 当要将新键插入到满节点时，该节点被拆分为两个节点，并将中值键插入父节点。如果父节点是根节点且同样已满，则创建一个新的根节点。\n\n6. 所有叶子节点已连接，形成一个顺序键的链表。\n\
  \n例如，3 阶 B+ 树每个节点最多包含两个键值，每个节点最多有三个子节点或链接部分。\n\n### 5.11.3 B+ 树上的操作\n\n1. **B+ 树插入：**\n\
  \n2. **B+ 树删除：**\n\n3. **B+ 树中的搜索操作：**\n\n#### 5.11.3.1 B+ 树插入\n\n**B+ 树插入算法：**\n\
  \n在 B+ 树中，新元素只能添加到到叶子节点。这意味着，新键值始终附加在叶子节点上。插入操作执行如下：\n\n1. 步骤 1：开始。\n\n2. 步骤 2：首先验证树是否为空。\n\
  \n3. 步骤 3：如果树为空，创建一个带有新键值的新节点并将其作为根节点放入树中。\n\n4. 步骤 4：如果树不为空，则新键值仅附加到叶子节点上。\n\n\
  5. 步骤 5：如果搜索元素较小，则在左子树中继续搜索。\n\n6. 步骤 6：如果搜索元素较大，则与同一节点中的下一个键值比较，并重复步骤 3、4、5 和 6，直到找到精确匹配或完成与叶子节点中最后一个键值的比较。\n\
  \n7. 步骤 7：如果完成了叶子节点中最后一个键值的比较，则显示“未找到元素”并终止函数。\n\n8. 步骤 8：如果父节点是根节点且同样已满，则创建一个新的根节点。\n\
  \n9. 步骤 9：停止。\n\n\n\n\n\n### 树搜索算法步骤\n\n- 步骤 3：将搜索元素与树中根节点的第一个键值进行比较。\n- 步骤 4：如果两者相等，则显示“找到给定节点”并终止函数。\n\
  - 步骤 5：如果两者均不匹配，则检查搜索元素小于还是大于该键值。\n- 步骤 6：如果搜索元素较小，则在左子树中继续搜索过程。\n- 步骤 7：如果搜索元素较大，则与同一节点中的下一个键值进行比较，并重复步骤\
  \ 3、4、5 和 6，直到找到精确匹配或与叶子节点中的最后一个键值完成比较。\n- 步骤 8：如果通过叶子节点中的最后一个键值完成操作，则显示“未找到元素”并结束函数。\n\
  - 步骤 9：停止。\n\n### 5.11.4 B+ 树的用途\n\n1. 用于外部排序的 B+ 树。\n2. B+ 树用于提供索引顺序文件组织。\n3. B+\
  \ 树用于数据库管理系统。\n\n### 5.12 面试题\n\n1. 有哪些不同的二叉树遍历技术？\n2. 使用递归实现二叉树的前序遍历？\n3. 举例说明二叉树与二叉搜索树（BST）的区别？\n\
