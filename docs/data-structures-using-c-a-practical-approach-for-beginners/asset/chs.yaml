  **答案：(B)**\n\n**解释：**\n`realloc()` 改变已分配的大小。\n\n19. 下面哪些陈述是或错误的？\n\n1. 陈述 1：变量的编译时存储由编译器分配和释放取决于变量的作用域和生命。\n\
  2. 陈述 2：在动态分配中，程序员负责在不需要时释放空间。\n\n1. 陈述 1 错误，陈述 2 正确\n2. 陈述 2 错误，陈述 1 正确\n3. 陈述\
  \ 1 和 2 错误\n4. `陈述 1 和 2 都正确`\n\n**答案：(D)**\n\n**解释：**\n变量的编译时存储由编译器分配和释放取决于变量的作用域和生命。\n\
  \n20. 下面哪些陈述是或错误的？\n\n1. 陈述 1：当程序员在堆分区上动态创建内存但忘记删除时，会发生内存泄漏。\n2. 陈述 2：悬空指针指向已经释放的内存位置。\n\
  \n1. 陈述 1 错误，陈述 2 正确\n2. 陈述 2 错误，陈述 1 正确\n3. 陈述 1 和 2 错误\n4. `陈述 1 和 2 都正确`\n\n\
  **答案：(D)**\n\n**解释：**\n悬空指针指向已经释放的内存位置，且当程序员在堆分区上动态创建内存但忘记删除时，会发生内存泄漏。\n\n\n\n\n\
  \n# 21. 下列叙述正确或错误？\n\n1. 叙述 1：`free()` 函数释放之前由 `malloc()`、`calloc()` 或 `realloc()`\
  \ 函数分配的空间。\n2. 叙述 2：悬空指针和空指针（void pointers）是相同的。\n\n   1. 陈述 1 错误，陈述 2 正确\n   2.\
  \ 陈述 2 错误，陈述 1 正确\n   3. 陈述 1 和 2 错误\n   4. 陈述 1 和 2 都正确\n\n**答案：(D)**\n\n**解析：**\n\
  \n悬空指针和空指针的概念是不同的。\n\n# 4 线性数据结构的链表示\n\nDOI: [10.1201/9781003105800-4](https://doi.org/10.1201/9781003105800-4)\n\
  \n## 4.1 静态内存分配的局限性与动态内存管理的优势\n\n### 4.1.1 引言\n\n在第 3 章中，我们学习了数组和静态内存分配。我们了解到元素在数组中顺序存储，我们可以对数组元素进行顺序访问和随机访问，并对数组元素进行静态内存分配。到目前为止我们学习的所有内存管理都是静态内存管理，这意味着内存是在编译时而不是运行时分配的。数组中的内存是在编译时预留的，这被称为静态内存管理。而在链表中，内存是在运行时预留的，被称为动态内存管理。\n\
  \n### 4.1.2 静态内存分配的主要局限性\n\n如果声明的静态数据空间或静态内存超过了需要，会导致内存空间浪费。如果声明的静态空间或静态内存小于需要，则在运行时无法扩展这种固定大小。在数组中，插入和删除元素的开销相对昂贵。\n\
  \n### 4.1.3 动态内存分配的主要优势\n\n使用动态内存管理，数据结构可以增长和缩小以适应变化的数据需求。我们可以在运行时需要时分配额外的存储空间。当我们使用空间且该空间不再需要时，可以动态地取消分配或释放空间。\n\
  \n然而，数组作为数据结构的主要缺点如下：\n\n一旦元素按顺序存储，在中间插入元素或删除中间元素就会变得非常困难。对于新元素的插入，元素应该向上的方向移动。如果我们从数组中删除任何元素，数组中将创建一个空隙。移动元素将非常耗时且耗逻辑，而且在时间和空间上都是无效的。\n\
  \n在数组数据结构中，我们无法对数组大小做出精确判断。有时内存可能会被浪费，或者可能会出现必须增加数组大小的情况。\n\n**因此，为了解决上述问题，我们将学习一种名为链表的新数据结构。**\n\
  \n通过链表，可以高效地执行插入和删除。链表是动态数据结构，在程序运行时可以扩展或缩小。通过动态内存管理可以实现高效的内存利用许多许多应用可以通过链表轻松实现。\n\
  \n## 4.2 链表的概念\n\n### 4.2.1 引言\n\n链表是一组节点，每个节点都有两个字段：“data”（数据）和“link”（链接）或“next”（下一个）。\n\
  \n**“data”字段存储实际信息，而“link”或“next”字段用于指向下一个节点或存储下一个节点的地址（图 4.1）。**\n\n![](img/Fig04_01.jpg)\n\
  \n**图 4.1** 节点结构和整数链表。\n\n注意，最后一个节点的 link 字段由“NULL”组成，这表示单向线性链表的结束。NULL 表示空指针或空地址。空指针意味着链表的最后一个节点不包含下一个节点的地址。\n\
  \n### 4.2.2 使用 C 语言的单向链表表示\n\n如果我们需要在链表中存储整数数字作为数据，那么内存的链表表示具有如下的声明语法。\n\n```\n\
  struct node\n{\n     int data;\n    struct node *next;\n};\n```\n\n使用上述声明语法，我们可以创建许多个具有整数数据的节点，其中\
  \ `next` 指针存储链表中下一个节点的地址。\n\n### 4.2.3 链表上的操作\n\n在链表上执行的基本操作如下：\n\n1. **创建**（Creation）\n\
  2. **插入**（Insertion）\n3. **删除**（Deletion）\n4. **遍历**（Traversing）\n5. **查找**（Searching）\n\
  6. **显示**（Display）\n\n让我们详细定义上述操作：\n\n1. **创建：**此操作用于创建一个新的链表。\n2. **插入：**此操作用于在指定位置（头部、末尾或指定位置）插入新节点。\n\
  3. **删除：**此操作用于从头部、末尾或指定位置删除节点。\n4. **遍历：**此操作用于从链表的头部或末尾访问链表中的所有节点。\n5. **查找：**此操作用于查找特定数据所在的节点。\n\
  6. **显示：**此操作用于从链表的头部或末尾打印链表中的所有节点。\n\n### 4.2.4 程序：包含三个节点的静态链表实现\n\n```\n#include<stdio.h>\n\
  #include<conio.h>\nstruct node  \n{\n int data;\n struct node *next;\n};\nstruct\
  \ node n1,n2,n3;\nstruct node *first,*temp;\nint main()\n{\n    n1.data=10;\n  \
  \  n1.next=&n2;\n    n2.data=20;\n    n2.next=&n3;\n    n3.data=30;\n    n3.next=NULL;\n\
  \    first=&n1;\n    temp=first;\n    while(temp!=NULL)\n    {\n        printf(\"\
  \\n%d\",temp->data);\n        temp=temp->next;\n    }\n       return 0;\n}\n```\n\
  \n**输出：**\n\n10\n\n20\n\n30\n\n**解析：**\n\n**步骤 1：** 声明结构类型的节点 n1、n2 和 n3（图 4.2）。\n\
  \n![](img/Fig04_02.jpg)\n\n**图 4.2** 链中的节点结构。\n\n**步骤 2：** 开始向每个节点的 data 字段填充数据并将下一个节点的地址赋值给节点的\
  \ next 指针。在这里，节点 n2 的地址为 200，并赋值给 n1 的 next 字段，如图 4.3 所示。\n\n![](img/Fig04_03.jpg)\n\
  \n**图 4.3** 节点中数据和地址的插入。\n\n同样，在 data 字段中添加 20 数据并将 n3 节点的地址添加到 n2 节点的 next 字段，向\
  \ n3 节点添加 30 数据，最后一个节点的 link 或 next 字段通过语句 `n3.next=NULL;` 赋值为 NULL 地址。\n\n**步骤\
  \ 3：** 设置\n\n```\n first=&n1;\n temp=first;\n```\n\n![](img/Fig04_04.jpg)\n\n**图\
  \ 4.4** 链表包含三个带有数据和下一个节点地址的节点。\n\n**步骤 4：** 当 temp!=NULL\n\n遍历链表直到最后一个节点，并打印每个节点的\
  \ data 字段：\n\n```\n{\n    printf(\"\\n%d\",temp->data);\n    temp=temp->next;\n\
  }\n```\n\ntemp 是节点类型的指针，因此它存储节点的地址。\n\n```\n temp = temp ->next;\n```\n\n\n\n\n\
  在这里，`temp->next` 是链表中下一个节点的地址。\n\n当 `temp` 指针指向最后一个节点时，`temp->next` 的值为 `NULL`，此时通过上述语句将其赋值给\
  \ `temp`：\n\n```\ntemp=temp->next ;\nAnd then while (temp != NULL)\n```\n\n该条件变为假，循环随终止。\n\
  \n## 4.3 链表的类型\n\n1. 单向线性链表\n2. 单向循环链表\n3. 双向线性链表\n4. 双向循环链表\n\n### 4.3.1 单向线性链表\n\
  \n* 单向是因为节点只包含一个链接部分，即 `next`，它存储下一个节点的地址。\n* 线性是因为最后一个节点指向空，这意味着最后一个节点的 `next`\
  \ 或链接字段包含 `NULL` 地址。\n* 第一个节点被称为头节点或第一个节点（图 4.5）。![](img/Fig04_05.jpg)\n  **图 4.5**\
  \ 单向线性链表。\n\n### 4.3.2 单向循环链表\n\n* 循环意味着最后一个节点的链接或 `next` 字段指向第一个节点或头节点，或者包含第一个节点的地址。\n\
  * 即最后一个节点 `n3` 的 `next` 字段包含数据为 10 的第一个节点的地址 `100`（图 4.6）。![](img/Fig04_06.jpg)\n\
  \  **图 4.6** 单向循环链表。\n\n### 4.3.3 双向线性链表\n\n* 双向是因为每个节点有两个指针 `previous` 和 `next`\
  \ 指针。\n* `previous` 指针指向上一个节点，`next` 指针指向下一个节点或包含下一个节点的地址。\n* 只有头节点的 `previous`\
  \ 指针字段包含 `NULL`，而最后一个节点的 `next` 指针指向 `NULL` 地址（图 4.7）。![](img/Fig04_07.jpg)\n  **图\
  \ 4.7** 双向线性链表。\n\n* 在双向循环链表中，最后一个节点的 `next` 指针指向头节点的 `previous` 指针，而头节点的 `previous`\
  \ 指针指向最后一个节点的 `next` 指针。\n* 头节点是一个特殊节点，可能包含哑元数据或某些有用信息，例如链中的节点总数（图 4.8）。![](img/Fig04_08.jpg)\n\
  \  **图 4.8** 双向循环链表。\n\n## 4.4 单向线性链表\n\n单向线性链表仅包含一个链接字段即 `next`，它存储下一个节点的地址，且最后一个节点的\
  \ `next` 或链接字段包含 `NULL` 地址。\n\n### 4.4.1 单向线性链表的算法\n\n#### 4.4.1.1 算法：在单向线性链表末尾插入节点\n\
  \n* 步骤 1：[检查溢出 ]\n```\n     If new1 = NULL, then\n                 Print, \"over\
  \ flow\"\n                 Exit\n      Else\n                 New1 = (stuct node\
  \ *)malloc (sizeof(struct\n                 node));\n      End if\n```\n* 步骤 2：设置\
  \ `new1->data = num`\n* 步骤 3：设置 `new1->next = NULL`\n* 步骤 4：如果 `start == NULL`，则设置\
  \ `start = new1`，即将新创建节点的地址赋值给 `start` 指针。\n* 步骤 5：如果 `start != NULL`，则使用 `temp`\
  \ 指针在链表中查找最后一个节点，直到\n\n```\ntemp->next != NULL .\n```\n* 步骤 6：设置 `temp->next = new1`。\n\
  * 步骤 7：停止。\n\n#### 4.4.1.2 算法：从单向线性链表中删除节点\n\n1. 步骤 1：[检查上溢]\n```\nIf start == NULL,\
  \ then\n\tPrint “underflow”\nExit\n```\n2. 步骤 2：读取想要删除的信息，假设为‘num’。\n   继续检查每个节点的数据字段，判断其是否匹配‘num’：\n\
  ```\nwhile((temp = NULL)&&(found == 0)) \n{\nif(temp -> data == num)\n        {\n\
  \        found = 1;\n        }\n        else\n        {\n        temp =temp->next;\n\
  \        }\n }\n```\n3. 步骤 3：如果 `found == 0`，则打印“链表中不存在该数字”。\n   步骤 4：如果找到了节点，则将找到的节点地址存储到\
  \ `temp` 指针中。如果找到的节点是第一个节点（即 `temp == start`），只需将 `start` 向移动一位并移除 `temp` 节点。\n\
  ```\n     start = start->next ;\n         temp->next = NULL;\n         free(temp);\n\
  ```\n4. 步骤 5：否则如果找到的节点不是第一个节点，则使用名为 `prev` 的指针指向要删除的 `temp` 节点的前一个节点：\n```\nprev=start;\n\
  while(prev->next != temp)\n{\n      prev = prev->next;\n}\n```\n然后\n```\n prev->next=temp->next;\n\
  ```\n即指针 `prev` 的后续（`prev->next`）指向 `temp` 节点（找到的节点）的后续，并使 `temp->next=NULL`（即 `temp`\
  \ 节点不再指向其他节点），然后通过 `free(temp)` 函数删除为 `temp` 节点分配的内存。\n\n#### 4.4.1.3 算法：显示链表元素\n\
  \n1. 步骤 1：如果 `start==NULL`，则链表为空。\n2. 步骤 2：否则，链表为空，移动节点指针遍历链表，访问每个节点并显示信息：\n```\n\
  \ temp=start;\n     while(temp!=NULL)\n     {\n                  printf(\"d   \"\
  ,temp->data);\n                  temp=temp->next;\n     } \n```\n\n### 4.4.2 程序：单向线性链表的实现\n\
  \n\n\n\n\n```c\n//包含的头文件\n#include<stdio.h>\n#include<stdlib.h>\n//函数原型\nvoid create_node();\n\
  void display();\nvoid delete_node();\n//单向线性链表的节点结构\nstruct node\n{\n int data;\n\
  \ struct node *next;\n}*new1,*start,*prev,*temp;\n//new1 指针存储新创建结的地址\n//start 指针存储链表中起始节点的地址\n\
  //prev 指针存储链表中我们想要删除的节点的前驱地址\n//temp 指针用于遍历目的\nint main()\n{\n int ans;\n char ch;\n\
  \ start=NULL;\n do\n {\n  printf(\"Singly Linear Linked List: \\n\");\n  printf(\"\
  \\t1.create_node\\t2.diplay\\t3.delete_node\\t4.exit \");\n  printf(\"\\n Enter\
  \ your choice: \");\n  scanf(\"%d\",&ans);\n  switch(ans)\n  {\n      case 1:create_node();\n\
  \      break;\n      case 2:display();\n      break;\n      case 3:delete_node();\n\
  \      break;\n      case 4:exit(0);\n      default: printf(\"\\n Enter correct\
  \ choice\");\n  }\n  printf(\"Do you want to continue press[yes(y) /no(n)] : \"\
  );\n  fflush(stdin);\n  scanf(\"%c\",&ch);\n } while(ch=='y'||ch=='Y');\n return\
  \ 0;\n}\n// 创建节点并在单向线性链表的末尾添加新节点 \nvoid create_node()\n{\n//为单个节点分配动态内存\n new1=(struct\
  \ node*)malloc(sizeof(struct node));\n printf(\"Enter data : \");\n scanf(\"%d\"\
  ,&new1->data);\n new1->next=NULL;\n      if(start==NULL)  //如果链表为空\n      {\n  \
  \    start=new1;\n      }\n      else\t//如果链表至少有一个节点\n      {\n      temp=start;\n\
  \      while(temp->next!=NULL)     //遍历链表直到到达最后一个节点\n      {\n      temp=temp->next;\n\
  \      }\n      temp->next=new1;\n      }\nprintf(\"Node inserted at the end of\
  \ Linked list=%d\n\\n\",new1->data);\n}\n// 显示单向线性链表中的节点\nvoid display()\n{\n if(start==NULL)\n\
  \ {\n  printf(\"Linked list  is not created.\\n\");\n }\n else\n {\n  temp=start;\n\
  printf(\"Data in the Singly Linear Linked List is as follows:\n\\n\");\nwhile(temp!=NULL)\n\
  {\n      printf(\"%d \\t\",temp->data);\n      temp=temp->next;\n      }\n     \
  \ printf(\"\\n\");\n  }\n}\n// 从单向线性链表中删除节点\nvoid delete_node()\n{\n int num;\n\
  \ int found=0;\n temp=start;\n if(start==NULL)    //链表未创建\n {\n  printf(\"\\n Linked\
  \ list is not created ,first create a\nnode.\\n\");\n }\n else\n {\n  printf(\"\
  Enter value which you want to be deleted: \");\n  scanf(\"%d\", &num);\n  while((temp!=\
  \ NULL)&&(found == 0))  //循环查找我们想要的数据  {\n// 删除并将删除节点的地址存储到\n//temp 指针中。\n     \
  \ {\n      if(temp -> data == num)\n      {\n      found =1;\n      }\n      else\n\
  \      {\n      temp =temp->next;\n      }\n  }\n  if(found == 0)     //如果没有找到节点\n\
  \  {\n      printf(\"\\n Node is not present in the Linked List. \\n\");\n  }\n\
  \  else\n  {          //如果找到了节点，则我们要删除的节点是第一个节点还是第一个节点以外。\n      if(start == temp)\t\
  //如果删除的节点是链表的第一个节点\n      {\n      start = start->next;\n      temp->next=NULL;\n\
  \      free(temp);\n      temp=NULL;\n      }\n      else  //如果删除的节点是链表的第一个节点以外的\n\
  \      {\n      prev=start;\n      while(prev->next!=temp)\n      {\n       prev=prev->next;\n\
  \      }\n      prev->next=temp->next;\n      temp->next=NULL;\n      free(temp);\n\
  \      temp=NULL;\n      }\n      printf(\"Node deleted =%d\\n\",num);\n  }\n}\n\
  }\n```\n\n**输出：**\n\n![](img/un04_01.jpg)\n\n## 4.5 单向循环链表\n\n单向循环链表是一种列表，最后一个节点的\
  \ next 指针始终指向第一个节点或头节点，且节点只包含一个链接或 next 字段。\n\n线性循环链表上的操作：\n\n1. 创建\n2. 显示\n3. 删除\n\
  \n### 4.5.1 单向循环链表的算法\n\n#### 4.5.1.1 单向循环链表的创建\n\n**步骤 1 (图 4.9):**\n\n![](img/Fig04_09.jpg)\n\
