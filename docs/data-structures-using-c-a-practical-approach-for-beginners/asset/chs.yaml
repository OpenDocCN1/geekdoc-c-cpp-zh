  \n#### 7.9.5.4 合并排序的程序\n\n\n\n\n\n```c\n #include<stdio.h>\n//函数原型声明\nvoid merge_sort(int\
  \ *a, int *t, int low, int high);\nvoid merge(int *a, int *t, int low, int mid,\
  \ int high);\n//main 函数定义\nint main()\n{\n    int n, a[10], t[10], l=0, h, i;\n\
  \    printf(\"Enter size of array:\");\n    scanf(\"%d\", &n);\n    printf(\"Enter\
  \ %d array elements:\\n\", n);\n    h=n-1;\n    for(i=0;i<=(n-1);i++)\n    {\n \
  \       scanf(\"%d\", &a[i]);\n    }\n    printf(\"Array elements before sorting:\\\
  n\");\n    for(i=0;i<=(n-1);i++)\n    {\n        printf(\"%d\\t\", a[i]);\n    }\n\
  \    merge_sort(a,t,l,h);\n    printf(\"\\nArray elements after sorting:\\n\");\n\
  \    for(i=0;i<=(n-1);i++)\n    {\n        printf(\"%d\\t\",a[i]);\n    }\n    return\
  \ 0;\n}\n//归排序函数定义\nvoid merge_sort(int *a, int *t, int low, int high)\n{\n    int\
  \ mid;\n    if(high>low)\n    {\n        mid=(high+low)/2;  //找到中间数组索引 \n      \
  \  merge_sort(a,t,low,mid); //递归调用左子列表，直到左子列表只包含一个元素 \n        merge_sort(a,t,mid+1,high);\
  \ //递归调用右子列表，直到右子列表只包含一个元素\n        merge(a,t,low,mid+1,high); //调用合并排序函数\n    }\n\
  }\n// 合并两个左、右子列表的函数定义\nvoid merge(int *a, int *t, int low, int mid, int high)\n\
  {\n    //mid 是右子列表第一个元素的索引\n    //high 是右子列表最后一个元素的索引\n    //pos 变量是指临时数组 t 的索引\
  \ \n    // a 是原始数组\n    int pos, n, end, i;\n    pos = low; //low 是左子列表第一个元素的索引\n\
  \    n = (high-low + 1); // n 存储左、右子列表中包含的元素总数\n    end = mid-1;          // end\
  \ 是左子列表最后一个元素的索引\n    //将左子列表和右子列表的元素拷贝到临时数组 t 中\n    while(low<=end && mid<=high)\n\
  \    {\n        /* 根据左子列表或右子列表的值，将左右子列表的元素\n        拷贝到临时数组 t。如果左子列表第一个元素的值\n  \
  \      小于右子列表的值，则将左子列表第一个元素\n        拷贝到临时数组 t。这样临时数组\n        包含了按排序顺序的元素。继续执行循环循环\n\
  \        直到 low<=end && mid<=high 为假 */\n        if(a[low]<a[mid])\n        {\n\
  \            t[pos]=a[low];\n            pos++;\n            low++;\n        }\n\
  \        else      \n        {\n            t[pos]=a[mid];\n            pos++;\n\
  \            mid++;\n        }\n    }\n    // 如果左子列表还剩余元素，则将那些剩余元素 拷贝到临时 //数组 t\n\
  \    while(low<=end)\n    {\n        t[pos]=a[low];\n        pos++;\n        low++;\n\
  \    }\n    // 如果右子列表还剩余元素，则将那些剩余//元素 拷贝到临时 //数组 t\n    while(mid<=high)\n    {\n\
  \        t[pos]=a[mid];\n        pos++;\n        mid++;\n    }\n    //将临时数组 t 中的所有元素从高索引处\n\
  \    //拷贝回原始数组 a，取决于该临时数组中\n    // 元素的数量。n 变量给出了左右子列表//\n    // 包含的元素总数\n    for(i=0\
  \ ; i<n ; i++)\n    {\n        a[high]=t[high];\n           high--;\n    }\n}\n\
  ```\n\n**输出：**\n\n![](img/un07_23.jpg)\n\n#### 7.9.5.5 归并排序分析\n\n这种排序方法非常高效。它需要\
  \ $(\\log[2] n)$ 趟遍历和 $O (n \\log[2] n)$ 次比较。\n\n即使在最坏情况下，它的比较次数也不会超过 $(n \\log[2]\
  \ n)$。\n\n该方法的唯一缺点是需要 $O (n)$ 的额外空间来存储临时数组。\n\n**归并排序的时间复杂度：**\n\n1. 最优情况 = $\\\
  Omega (n \\log n)$\n2. 平均情况 = $\\Theta(n \\log n)$\n3. 最坏情况 = $O (n \\log n)$\n\n\
  **归并排序的空间复杂度：**\n\n$O (n)$ 是归并排序的空间复杂度。\n\n#### 7.9.5.6 归并排序的优点\n\n1. 归并排序最坏情况下的时间复杂度也是\
  \ $(n \\log[2] n)$，且保持不变。\n2. 归并排序可以应用于任何大小的文件。\n3. 归并排序适用于访问速度慢的文件，例如磁带。\n4. 它对于顺序访问的数据非常出色，例如链表。\n\
  \n#### 7.9.5.7 归并排序的缺点\n\n1. 需要额外的空间。\n2. 在原地排序方面，归并排序的效率低于其他排序算法。\n\n#### 7.9.5.8\
  \ 归并排序的应用\n\n1. 归并排序的时间复杂度为 $O(n \\log n)$。\n2. 用于外部排序。\n\n### 7.9.6 堆排序\n\n堆排序基于二叉树结构。堆排序包含两个阶段：\n\
  \n1. **建堆**\n2. **堆排序**\n\n#### 7.9.6.1 堆简介\n\n堆排序是一种基于堆数据结构的排序算法。堆是一个完全二叉树，其中每个节点的值大于等于其父节点（大顶堆）或小于等于其父节点（最小堆）。\n\
  \n#### 7.9.6.2 堆的示例\n\n我们可以注意到，对于任意节点 $i$，它的两个孩子位于堆 $2i$ 和 $2i+1$。如果我们想查看堆 $k$ 的父节点，可以在\
  \ $k/2$ 处找到。\n\n#### 7.9.6.3 建堆\n\n将无序键逐一个取出并加入堆中。堆的大小随 $i$ 增长。初始堆的大小为 $(i-1)$，以满足几乎完全的约束。\n\
  \n将 $ki$ 的值与其父节点的值进行比较。如果 $ki$ 更大，则交换新增节点与该父节点的内容。这一过程持续，直到 $ki$ 到达根节点或父键不再小于 $ki$。最终树是一个大小为\
  \ $i$ 的堆。\n\n**向大小为 $(i-1)$ 的堆添加一个键以建堆的算法（$i \\ge1$）：**\n\n1. 开始\n2. $s = i$\n3.\
  \ 在数组中找到第 $i$ 个节点的父节点索引：\n   ```\n   parent = s / 2;\n   key[s] = newkey;\n   ```\n\
  4. ```\n   while ( s != 0 && key[parent] <= key[s] )\n     {\n      随后交换父节点和子节点，如：\n\
  \       temp = key[parent];\n         key[parent] = key[s];\n       keys[s] = temp;\n\
  \      将新节点在树中向上移动一层，如下：\n      s = parent;\n      parent = s / 2;\n      }\n  \
  \ ```\n5. 停止。\n\n**建堆的示例：** 考虑以下无序键列表：\n\n10, 20, 9, 4, 15, 17\n\n![](img/un07_24.jpg)\n\
  \n**大小为 1 的堆**\n\n![](img/un07_25.jpg)\n\n**大小为 2 的堆**\n\n![](img/un07_26.jpg)\n\
  \n\n\n\n\n# 大为 3 的堆\n\n![](img/un07_27.jpg)\n\n## 大为 4 的堆\n\n![](img/un07_28.jpg)\n\
  \n## 大为 5 的堆\n\n## 大为 6 的堆\n\n查看图 7.8。\n\n![](img/Fig07_08.jpg)\n\n**图 7.8 创建一个大小为\
  \ 6 的堆。\n\n### 7.9.6.4 处理堆\n\n该堆可以用下图所示的数组表示（图 7.9），\n\n![](img/Fig07_09.jpg)\n\n\
  **图 7.9 使用数组表示大小为 6 的堆。**\n\n我们可以注意到，生成的堆取决于未排序列表的初始顺序。\n\n对于输入列表的不同顺序，堆也会不同。\n\n\
  现在，我们必须处理该堆以生成一个排序后的键列表。\n\n我们知道最大元素位于堆的顶部，在数组中的位置 `heap [0]` 处进行排序。我们将 `heap [0]`\
  \ 与堆数组中的最后一个元素 `heap [maxnodes-1]` 交换，使得 `heap [0]` 处于正确的位置。然后，我们调整数组使其成为大小为 `(n\
  \ – 1)` 的堆。再次交换 `heap [0]` 与 `heap [n – 2]`，调整数组成为大小为 `(n – 2)` 的堆，依此类推。最后，我们得到一个包含按排序排列键的数组。处理堆的算法如下：\n\
  \n**处理堆的算法：**\n\n1. 步骤 1：开始。\n2. 步骤 2：将根节点与堆数组最后一个节点交换。\n3. 步骤 3：此时，`heap [maxnode-1]`\
  \ 处于正确位置。\n4. 步骤 4：现在，将新根值与其左节点值进行比较。\n5. 步骤 5：如果新根值小于其左节点，则将左节点与其右兄弟进行比较；否则跳转到步骤\
  \ 7。\n6. 步骤 6：如果左节点值大于其右兄弟，则将根与左节点交换。否则，将根与其右节点交换。\n7. 步骤 7：如果根值大于其左节点，则将根值与其右节点值进行比较。\n\
  8. 步骤 8：如果根值小于其右节点，则将根与右节点交换。否则，停止处理。\n9. 步骤 9：重复相同操作，直到根节点固定在它的精确位置。\n10. 步骤 10：对新根重复步骤\
  \ 2 到 9，直到堆只包含一个元素。\n11. 步骤 11：停止。\n\n**处理堆的示例：**\n\n**处理堆后，堆数组如下所示（图 7.10）：**\n\
  \n![](img/Fig07_10.jpg)\n\n**图 7.10 处理堆后大小为 6 的堆数组。**\n\n### 7.9.6.5 堆排序程序\n\n```c\n\
  \ #include <stdio.h>\n#define LENGTH 10\nint heapSize, n;\nvoid Heapify (int* A,\
  \ int i)\n{\nint l = 2 * i + 1;  //左子节点的索引\nint r = 2 * i + 2;  //右子节点的索引\nint largest;\n\
  \nif(l <= heapSize && A[l] > A[i]) //比较左节点的值\n与父节点的值\nlargest = l;    //如果左节点的值更大，将左\n\
  //节点索引赋值给 largest 变量\nelse\nlargest = i;   //否则父节点的值更大，\n//将父索引赋值给 largest 变量\n\
  if(r <= heapSize && A[r] > A[largest]) //比较右\n//节点的值与数组中最大索引的值\n//值值\n         \
  \                   //该值可能是父\n//节点或左节点节点的值\nlargest = r;   //如果右节点的值更大，将右\n//节点索引赋值给\
  \ largest 变量\nif(largest != i)  //如果最大索引不等于父节点索引\n//则交换最大元素的值\n//与父节点的值\n{\nint\
  \ temp = A[i];\nA[i] = A[largest];\nA[largest] = temp;\nHeapify(A, largest); //再次递归地检查当前父\n\
  //节点值与其左、右节点的值\n                    //直到父节点到达二叉树\n//树中的根节点\n}\n}\nvoid BuildHeap\
  \ (int* A)\n{\nint i;  //父节点的索引\nheapSize = n - 1;  //堆的大小为 (n-1)，因为数组索引\n//从 0\
  \ 开始\nfor(i = (n - 1) / 2; i >= 0; i--)\n{\nHeapify(A, i);  //处理堆\n}\n}\n//堆排序函数\n\
  void HeapSort (int* A)\n{  \nint i;\nBuildHeap(A); // 创建堆函数\n\nfor(i = n - 1; i\
  \ > 0; i--)\n//交换根和数组中的最后一个\n//元素\nint temp = A[heapSize]; //将数组中的最后一个\n//元素赋值给\
  \ temp\nA[heapSize] = A[0];   //将根节点赋值给最后一个元素\nA[0] = temp;         //将 temp 赋值给根节点\n\
  heapSize--;           //堆的大小减一\nHeapify(A, 0);       \n}\n}\n//main 函数定义\nint main()\n\
  {\nint array[LENGTH];\nint i;\nprintf(\"输入数组的大小: \\n\");\nscanf(\"%d\", &n);\nprintf(\"\
  输入数组中的 %d 个元素: \\n\", n);\nfor(i=0; i< n; i++)\nscanf(\"%d\", array[i]);\nprintf(\"\
  排序前的元素: \\n\");\nfor(i = 0; i < n; i++)\n{\nprintf(\"%d\\t\", array[i]);\n}\nHeapSort(array);\n\
  printf(\"\\n 排序后的元素: \\n\");\nfor(i = 0; i < n; i++)\n{\nprintf(\"%d\\t\", array[i]);\n\
  }\nreturn 0;\n}\n```\n\n### 7.9.6.6 堆排序分析\n\n1. 首先，考虑创建阶段，在该阶段中，插入键沿到堆根的路径需要 `O(log\
  \ i)`。\n2. 如果我们分析处理阶段，大小为 `i` 的堆需要 `O(log i)` 次比较和交换。\n\n因此，最坏情况下的时间复杂度为 **O (n\
  \ log n)**。\n\n**堆的时间复杂度：**\n\n- 最优情况：`Ω (n log n)`\n- 平均情况：`Θ (n log n)`\n- 最坏情况：`O\
  \ (n log n)`\n\n**排序的空间复杂度：**\n\n**O (1)** 是堆排序的空间复杂度。\n\n### 7.9.6.7 堆排序的优点\n\n\
  1. 堆排序非常高效。堆排序特别适用于排序大型列表。\n2. 堆排序可以实现为原地排序算法。这意味着它的内存占用极低。\n3. 堆排序提供了稳定的性能。这意味着它在最好、平均和最坏情况下表现都良好。\n\
  4. 堆排序比同样高效的排序算法更容易理解，因为它不使用递归。\n\n### 7.9.6.8 堆排序的缺点\n\n1. 稳定排序保持具有相同键的元素的相对顺序，即它们在初始数组中的出现顺序。堆排序是不稳定排序。它可能会重新排列相对顺序。\n\
