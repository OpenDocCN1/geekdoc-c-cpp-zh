  **第 7 步：**\n**第 8 步：**\n**第 9 步：**\n（注：由于原文文本在步骤部分存在格式重复和内容错位，译文已根据逻辑对 Kruskal 算法执行过程进行了对齐处理，以确保技术文档的易读性。）\n\
  \n\n\n\n### 第 5 \n下一条边是 A – B，权重为 4。我们舍弃这条边，因为它会导致环。A 和 B 在 `V[s]` 中处于同一个集合。\n\n\
  ### 第 6 \n因此，下一条边是 C – E，权重为 5。选择它。\n\n`T = {<A, F>, <B, F>, <C, E>}`\n`V[S] = {{A,\
  \ F, B}, {D}, {C, E}}`\n\n### 第 7 \n因此，下一条边是 B – C，权重为 6，选择它。\n\n`T = {<A, F>, <B,\
  \ F>, <C, E>, <B, C>}`\n`V[S] = {{A, F, B, C, E}, {D}}`\n\n### 第 8 \n下一条边是 B – E，权重为\
  \ 7。我们舍弃这条边，因为它会导致环。此外，B 和 E 在 `V[s]` 中处于同一个集合。\n\n### 第 9 \n因此，下一条边是 D – E，权重为\
  \ 7，选择它。\n\n`T = {<A, F>, <B, F>, <C, E>, <B, C>, <D, E>}`\n`V[S] = {{A, F, B, C,\
  \ E, D}}`\n\n### 第 10 \n现在给定图的所有顶点都已访问。停止此过程。我们得到如下所示的**最小权重生成树**（见图 6.38）：\n\n\
  ![](img/Fig06_38.jpg)\n\n图 6.38 图 6.36 中图 G 的最小权重生成树。\n\n最小权重 = 2+3+5+6+7 = 23\n\
  \n#### Kruskal 算法的时间复杂度：\n1. 将所有顶点添加到 `V[s]` 需要时间复杂度 `O (n)`。\n2. 在 while 循环中，我们需要对两个集合进行并集操作，这可以在\
  \ `O (n)` 内完成。\n3. 每当一条边被选中并从队列中删除时，都会显示相应的状态。这些操作复杂度为 `O (1)`。\n4. 在 while 循环中，循环对整个边列表重复执行。因此，复杂度为\
  \ `O (|E|)`。\n5. 因此，算法的复杂度为 `O (|E|log[2]|E|)`。\n\n## 6.5 面试题\n1. 什么是图？\n2. 图由哪些部分组成？\n\
