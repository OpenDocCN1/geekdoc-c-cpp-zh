  \n**最优解：** 具有最小代价的可行解。\n\n寻找 MST 有两种算法：\n\n1. Prim 算法（Prime’s algorithm）\n2. Kruskal\
  \ 算法（Kruskal’s algorithm）\n\n#### 6.4.2.4 Prim 算法\n\n假设 `G (V, E)` 是一个没有环和平行边的连通加权无向图。如果图\
