  }\n```\n\n**输出：**\n\n![](img/un027.jpg)\n\n## 2.6 队列的应用\n\n1. 队列用于 CPU 调度和磁盘调度。当多个进程需要\
  \ CPU 时，会使用通过队列实现的各种调度算法。\n\n2. 在打印缓冲中，文档被加载到缓冲区中，然后打印机按照自己的速率将其取出。例如：缓冲区、管道等。\n\
  \n3. 在非线性图结构上实现广度优先搜索（BFS）算法需要线性队列数据结构。它是一种用于非线性图遍历或搜索的算法。它从某个节点开始，首先探索邻居，然后移动到下一层邻居。\n\
  \n4. 实时系统中的中断处理。队列按照出现的顺序处理中断，先来先服务。\n\n5. 在生活中，叫中心电话系统使用队列来呼叫的人，直到服务人员可用。\n\n6.\
  \ 普姆算法（Prim algorithm）可以通过优先级队列实现。\n\n7. Dijkstra 最短路径算法可以通过优先级队列完成。\n\n8. 优先级队列用于操作系统的负载均衡和中断处理。\n\
  \n9. 优先级队列用于霍夫编码进行数据压缩。\n\n10. 队列也用于交通系统。\n\n11. 队列数据结构用于浏览器历史记录。最近，访问过的 URL 被添加到双端队列的头部，在头部插入指定数量后，会移除队列尾部的\
  \ URL。\n\n12. 双端队列另一个普通应用是存储软件应用程序的撤销操作列表。\n\n13. 在网络系统中，队列用于路由器和交换机。\n\n14. 在电子邮件中，也使用了队列数据结构。\n\
  \n## 2.7 栈与队列数据结构的区别\n\n| 栈 | 队列 |\n| --- | --- |\n| 栈是非结构性线性数据结构。 | 队列也是非结构性线性数据结构。\
  \ |\n| 栈使用数组或链表实现。 | 队列也使用数组或链表实现。 |\n\n\n\n\n\n| 栈（Stack）是一种线性数据结构，元素仅在一个称为 `top`\
  \ 的端进行插入和删除，并基于后进先出（LIFO）原则。 | 队列（Queue）是一种线性数据结构，元素从一个称为 `rear end` 的端插入，并从另一个称为\
  \ `front end` 的端删除，并基于先进先出（FIFO）原则。 |\n| 栈 栈的元素添加和删除只在一个端进行。 | 队列的元素添加和删除在不同的端进行。\
  \ |\n| 在栈上插入元素的操作称为 `push`。 | 在队列中插入元素的操作称为 `enqueue`（入队）。 |\n| 从栈删除元素的操作称为 `pop`。\
  \ | 在队列中删除元素的操作称为 `dequeue`（出队）。 |\n| 在 `Stack` 数据结构中，只维护一个指针，指向栈顶端元素。 | 队列数据结构在实现时需要两个指针，分别指向\
  \ `rear end` 和 `front end`。 |\n| 栈数据结构是一种迭代数据结构，用于解决基于递归的问题。 | 队列是一种顺序数据结构，用于处理涉及顺序处理的问题。\
  \ |\n| 栈可以用于解决二叉树的前序、后序和中序遍历问题。 | 生产者消费者问题使用队列数据结构作为底层数据结构来解决。 |\n| 栈数据结构可以看作垂直线性集合。\
  \ | 队列数据结构可以看作水平线性集合。 |\n| 堆叠在一起的盘子是栈的一个特定现实实例。 | 人们排队交电费或在电影院窗口取票是队列的一个特定现实实例。\
