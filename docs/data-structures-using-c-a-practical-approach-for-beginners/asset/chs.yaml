  # 前言\n\n编写这本书我感到非常高兴。这源于我们以及其他人希望推动计算机科学基础课程演变的愿望。\n\n本书旨在用于教学。我们认为，对于从业者来说，理解选择或设计能够最好解决问题的数据结构所需的原理更为重要。因此，我们将其设计为一本教学文本，涵盖了大多数标准数据结构。一些未被广泛采用的数据结构作为重要原理的示例包含在内。某些预计未来将广泛使用的较新数据结构也被包含其中。\n\
  \n数据结构课程最重要的方面之一是学生通过实现链表、栈、队列、树和图等数据结构，学习使用指针和动态内存分配进行编程。在我们的课程中，这是学生首次进行重大设计的第一门课程，因为通常需要真实的数据结构来激发重要的设计练习。最后，如果没有实际编程经验，就无法评估内存中数据访问与磁盘上数据访问之间的基本差异。由于所有这些原因，如果没有大量的编程部分，数据结构课程将无法取得成功。\n\
  \n## 方法\n\n本书描述了许多表示数据的技术。这些技术在以下原理的背景下呈现：\n\n1. 数据结构和算法存在成本和收益。数据结构课程最重要的方面之一是学生通过实现链表、栈、队列、树和图等数据结构，学习使用指针和动态内存分配进行编程。在我们的课程中，这是学生首次进行重大设计的第一门课程，因为通常需要真实的数据结构来激发重要的设计练习。\n\
  2. 算法存在成本和收益。数据结构课程最重要的方面之一是学生通过实现链表、栈、队列、树和图等数据结构，学习使用指针和动态内存分配进行编程。在我们的课程中，这是学生首次进行重大设计的第一门课程，因为通常需要真实的数据结构来激发重要的设计练习。\n\
