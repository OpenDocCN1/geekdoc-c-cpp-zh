  \ 6.1 图的概念与术语\n\n### 6.1.1 图简介\n众所周知，在树结构中，主要的限制是每棵树只有一个根节点。然而，如果我们去掉这个限制，就会得到一种更复杂的数据结构，称为图。在图中完全没有根节点。\n\
  \n### 6.1.2 图的定义\n图被定义为节点（或顶点）集合以及连接这两个顶点的边（或弧）的集合。\n\n顶点集通过像集合一样列出顶点来描述。例如，`V =\
  \ {k, l, m, n}`，边集被确定为边的边序列。例如，`E = {(k, l), (m, n), (k, n), (l, m)}`。\n\n图通常定义如下：\n\
  1. `G = (V, E)`\n\n其中 `V(G)` 是图 `G` 的有限非空顶点集。`E(G)` 是顶点对或弧的集合，每个对代表图的一条边。\n\n###\
  \ 6.1.3 图的类型\n\n#### 6.1.3.1 有向图、无向图和混合图\n有向图也称为有向图（digraphs）。有向图是由边连接的节点集合，其中边带有特定的方向。\n\
  \n无向图是图的一种，其中一组顶点或节点是连接的，且所有的边都是双向的。\n\n在有向图中，方向显示在边上（图 6.1）。\n\n![](img/Fig06_01.jpg)\n\
