    Panicked Depth-First Search


    Depth-first search is a search algorithm that fully explores a single path before
    backtracking to test other paths. The algorithm operates recursively, using a
    depth-first search to explore all of the options down one subpath before considering
    other subpaths.


    * * *


    Ann realized her mistake as soon as she crossed the first bridge. In her rush
    to get to the school, she had neglected to bring a map with her. In any other
    town, this wouldn’t have been a problem—she would have run in the general direction
    of the school. But traveling in G’Raph wasn’t that simple.


    Ann stopped when she reached Thomas’s farm. Two paths branched out in front of
    her without any indication of which one led to the school. She looked for Thomas,
    but the farmer wasn’t in his radish patch.


    ![](images/00006.jpg)


    Making a quick decision, Ann chose the path on her right. She ran over the bridge
    and found herself at a pottery kiln. An assortment of bowls lined shelves outside
    the kiln. Judging from the quality of craftsmanship, some of the bowls must have
    been made by third graders at the school. Ann hoped that she was getting close.


    ![](images/00064.jpg)


    Ann had another decision to make—two new paths led away from the kiln. Again,
    Ann chose the path to her right, and she ran over the bridge. This time, she hit
    a dead end. The island, which appeared to be a mud quarry, had no new bridges
    that might lead to the school.


    ![](images/00063.jpg)


    Ann backtracked quickly, returning to the pottery kiln island.


    ![](images/00067.jpg)


    She ran down another bridge, arriving at a carrot farm—another dead end.


    ![](images/00071.jpg)


    Ann backtracked to the pottery kiln again. This time there were no new paths to
    take, so she backtracked further. She returned to Thomas’s farm.'
