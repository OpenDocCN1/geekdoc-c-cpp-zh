    an event from twenty-five years ago bother her now?


    “Three times,” answered Geoffrey. “The first time was twenty-five years ago. Then
    I saw him again ten years later. I was about to give up on the problem, but he
    found me and asked if I had solved it. That question rekindled the fire. I knew
    I could find a solution.”


