  raw: '“Okay,” agreed Simon happily. He promptly set about hitting the horseshoe
    over and over again. By the end, Simon breathed heavily from the effort, but he
    had succeeded in flattening the horseshoe.


    Drex was stunned. How had Simon understood that?


    “Good. Now go get the coals hot,” Drex commanded.


    Simon looked confused again.


    Drex sighed. “It’s another loop. Pump the bellows 10 times. FOR each number that
    you count from 1 to 10, give the bellows a pump.”


    “Okay.” Simon again got to work, pumping the bellows exactly ten times. He counted
    loudly each time:


    “One … two … three … four … five … six … seven … eight … nine … ten.”


    Over the course of a week, Drex determined that Simon would repeat tasks if they
    were well specified in a loop. Drex would tell Simon exactly what task to repeat
    and exactly how long to repeat it. Sometimes he told Simon to count up to a certain
    number. Other times he phrased the command like a WHILE loop, telling Simon to
    continue doing something until he had met a goal.


    Simon responded well to these structured commands. The blacksmith’s shop was filled
    with the noise of Simon cheerfully counting and hammering. “One … bang … two …
    bang …”


    Eventually, Drex introduced nested loops, issuing instructions such as “WHILE
    the sword is not thin enough, turn it over and FOR each number from 1 to 5, hit
    it with the hammer.” Simon would happily go about banging the sword into shape
    while turning it over after every five hits.


    Unfortunately, this formalized approach only worked to a point. Disaster finally
    struck when Drex tried to teach Simon more complicated computational concepts.
    As Drex and Simon stood outside the burning blacksmith’s shop, Drex admitted defeat.
    Before leaving town for an open blacksmith’s position in New Athens, he found
    Simon a better job—counting laps for runners on the local track team.


    The Town of Bool


    Boolean logic is based on two values: TRUE and FALSE (or alternatively ON and
    OFF for physical transistors). Complex logical expressions can be formed by using
    a few simple operations, such as AND, OR, and NOT. These expressions allow computers
    to perform logic such as adding binary digits, determining whether an IF statement
    executes, or controlling when a loop terminates.


    * * *


    The town of Bool was home to one of the kingdom’s most respected logicians, Ellis
    Conjunctione. Ann had decided to visit the kingdom’s scholars in the hope that
    they would provide insights into her quest. Unfortunately, upon arrival, Ann was
    informed that Dr. Conjunctione wouldn’t be seeing anyone.


    “I am sorry, but Dr. Conjunctione is busy at the current time,” stated one of
    Dr. Conjunctione’s graduate students. His voice projected a rare combination of
    formality and boredom. It reminded Ann of a over-practiced lecture, during which
    the teacher struggles to maintain his own interest in the material.


    The graduate student stood in front of the university’s doors, physically blocking
    Ann’s path. He crossed his arms. Ann wondered if the student thought that pose
    would make him look menacing. In reality, he just looked uncomfortable.


    “I’m on an important quest,” insisted Ann.


    The student appeared unswayed. “Dr. Conjunctione is already working on the single
    most important problem facing the kingdom: a logic problem called 3-SAT. Your
    quest will have to wait. He gave me explicit instructions not to be interrupted
    by anyone.”


    Despite arguing her case for two hours, Ann couldn’t convince the student. He
    refused to compromise at all. Finally, she admitted defeat and resolved to move
    on to the next name on her list. She decided to stay the night in Bool before
    continuing.


    Ann found her short stay in the town of Bool most annoying. She had always heard
    that the Booleans were strict believers in binary logic—everything was either
    true or false. She had naturally assumed that this simply meant that they were
    opinionated. For example, she wouldn’t expect anyone in Bool to state “Jazz is
    okay.” Opinions would be definite. However, she hadn’t expected this philosophy
    to apply to absolutely every single aspect of life.


    The first surprise came at a local restaurant.


    “May I get more water, please?” Ann asked a waiter.


    “No,” he replied. “I only refill a glass if it is empty AND you’re still eating.”


    “I am still eating,” Ann assured him.


    “But your glass is NOT empty,” he responded as he moved off to the next table.


    Ann looked down at her glass. It contained at most three drops of water. Ann sighed
    and finished those drops in preparation for the waiter’s return. She decided that
    in this case she was going to embrace the Boolean philosophy and NOT give him
    a tip.


    Luckily, Ann was well equipped for her stay. She had studied Boolean logic as
    an elective in kindergarten. It all came down to a few simple rules:


    *   There are only two options: TRUE and FALSE,


    *   A AND B evaluates to TRUE if and only if both A and B are TRUE,


    *   A OR B evaluates to TRUE if either A or B (or both) is TRUE,


    *   NOT A evaluates to TRUE if and only if A is FALSE.


    The logic matched how people used the terms in everyday life. Unfortunately, though,
    the laws of Boolean logic weren’t designed for living everyday life.


    Over the course of her 16-hour stay, Ann continued to experience the frustration
    of dealing with the Booleans’ world. She found that when the park “closed at sunset,”
    the patrons would stay until the second the sun dropped below the horizon and
    then run out of the park. Similarly, getting directions turned out to be extremely
    aggravating.


    “Is the hotel in that direction?” she asked, pointing approximately southeast.


    “It is NOT in that direction,” proclaimed a Boolean on the street. “It is in that
    direction.” The Boolean pointed in almost, but not exactly, the same direction.
    Ann sighed and walked in approximately the correct direction.


    “You are NOT going in the correct direction,” the Boolean shouted after her. Ann
    ignored him.


    She also resolved to program Marcus’s compass to guide her back to the hotel.
    That way, if she went out, she could avoid having to ask for directions again.


    Even the signage in Bool was overly logical. The crosswalk light actually said
    “Cross when the WALK light is on AND there are no cars speeding toward you.” Did
    they really need to clarify that? Ann wondered what would happen if someone misprinted
    the sign to use an OR. Would it be chaos?


    Ann only fully understood the Booleans’ true adherence to this logical formulation
    when she reached the hotel. There, on the back of her hotel door, was a fire escape
    plan like you would find at any hotel—except, in this case, all of the conditions
    were specified as long Boolean logic statements. “Use the south stairs If (they
    are NOT on fire AND the north stairs are on fire) OR (there is an obstruction
    in the hall toward the north stairs) OR …”


    After reading the sign four times, Ann decided that in the event of a fire she
    would be too confused to escape. She promptly resolved to leave Bool as soon as
    she could.


    Unhappy Magic Flowers and Binary


    Binary is a number system in which each digit can take one of only two values:
    0 or 1. Binary allows the computer to encode information in a series of switches
    that are either on (1) or off (0).


    Each binary digit represents a power of two. The first (right-most) digit represents
    the 1’s place, the second digit represents the 2’s place, the third represents
    the 4’s place, and so forth. For example, the binary number 10110 = (1 · 2⁴) +
    (0 · 2³) + (1 · 2²) + (1 · 2¹) + (0 · 2⁰) = 22 in decimal.


