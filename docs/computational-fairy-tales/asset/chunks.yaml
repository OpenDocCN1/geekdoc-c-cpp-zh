    Ann resolved to fix the situation before leaving the garrison. She spent the entire
    night pondering the different algorithmic strategies, certain that one of them
    would help the garrison run more efficiently. As she had been taught from an early
    age, almost every problem has an algorithmic solution. Ultimately, the true problem
    dawned on her at 3 a.m., and she fell asleep confident that she knew how to fix
    the situation.


    “Sir Aat,” she addressed the commander at breakfast the next morning. “We need
    to discuss the attack last night.”


    “Yes,” agreed the commander. “The goblin threat is real. Now you see why we need
    the reinforcements?”


    “No,” responded Ann.


    The commander looked shocked. The rest of the dining hall fell silent. Everyone
    waited to see what Ann would say next.


    “You need better names,” Ann continued.


    The commander laughed deeply. “You don’t understand. We’ve already improved our
    names. When a soldier joins the outpost, I assign him a new name. Every name is
    short so that commanders can call out orders quickly in battle.”


    “No,” disagreed Ann. “It’s inefficient.”


    “No offense, Princess Ann, but what do you know about commanding in battle?” he
    asked.


    “Only what I observed last night. But from that limited introduction, I can assure
    you that the names are hurting your efforts.”


    “I think you’re mistaken,” declared the commander. “They allow us to issue commands
    at incredible speeds.”


    “Yes, they do,” agreed Ann. “But they’re prone to mistakes. Last night, you corrected
    yourself 89 different times. The names are too similar and thus too easy to confuse.
    Plex and Dex. Ut, Ot, Et, and Aat. The short names don’t help!”


    “Ha! What would you suggest?” scoffed the commander.


    “Use descriptive names. For example, Plex should be called ‘South Tower Archer’
    or at least ‘Archer Plex.’ That more accurately reflects his role.”


    “That’s crazy!” bellowed the commander as he slammed his mug of coffee on the
    table. His anger at being lectured overrode his manners toward the future ruler
    of the kingdom. “Do you know how long it takes to say ‘South Tower Archer’ in
    the heat of battle? We would waste valuable time.”


    “Do you know how long it takes to say ‘Dex, swap places with Plex, we need an
    archer on the wall, not a blacksmith’? Any measure of efficiency needs to take
    into account the time spent on corrections,” Ann countered.


    “Well—you see—our old blacksmith Drex recently relocated, so—” started the commander.


    “What about you?” Ann interrupted. “Why not have them call you ‘Commander’ or
    ‘Captain’?”


    “Our names already reflect rank,” replied the commander. “The names proceed down
    the ranks in alphabetical order. It allows any soldier to instantly know who outranks
    them! It makes life simple!”


    “No it doesn’t. In order for the soldiers to refer to each other, they have to
    learn new, made-up names. Why not have them learn the ranks instead? Either way
    they have to learn something new. Only, in this case, the ranks mean something.”


    “We have a good system!” argued the commander.


    Ann sighed. “It’s like programming a complex algorithm,” she explained. “Using
    short variable names can make it feel more efficient to program, because you can
    type out the code faster. But, in the long run, it can do more harm than good.
    It becomes easy to make mistakes and difficult to sort out what’s happening. Oftentimes,
    slightly longer names can make a significant difference.”


    The commander opened his mouth to argue but couldn’t think of a rebuttal. Instead,
    he sat at his table, mouth open, with a confused look on his face. After a while,
    he spoke.


    “Princess Ann, I think you might have a point.” Secretly, the commander also felt
    a small pang of relief. He had never been fond of his own assigned name. He often
    found himself daydreaming of his soldiers saluting and shouting “Yes, Commander!”
    in unison.


    That afternoon, the commander changed every soldier’s name to be longer but more
    meaningful. Over the next few days, the troops stumbled through drills, getting
    used to their longer names. But soon Ann began to see efficiency improve.


    A week later, on Ann’s final night in Garroow, goblins attacked again. This time
    the invading force consisted of ten highly trained goblin special-forces troops.
    The Garroow soldiers turned away the attack with ease.


    As Ann left the garrison, she took a small bit of pride in the dramatic improvements
    in the forces there. After indulging in the brief moment of happiness, she turned
    her horse south and continued on her quest to save the kingdom.


    ## Pseudocode for the Quest Algorithm


    Pseudocode is an informal way of writing algorithms in order to make them easily
    understandable. While it represents actual computer code, it does not adhere to
    the syntax of any programming language. Instead, it is often written as a mixture
    of programming syntax and natural language.


    ***


    As she rode, Ann pulled a small scrap of paper out of her bag:


    ![](images/00077.jpg)


    She already knew it by heart. It contained the algorithm that Sir Galwin had taught
    her. Despite its simplicity, looking at the algorithm always gave her hope.


    So, without any leads, Ann picked a new city in which to gather information. She
    would travel to Guelph and consult the foremost expert in loops, Dr. Iterator.
    With any luck, she would also find an opportunity to speak with Dr. Whileton.


    She carefully folded the paper and returned it to her bag. At least she had a
    plan.


    ## DATA STRUCTURES


    ![](images/00060.jpg)


    ### Arrays, Linked Lists, and Zed


    Arrays and linked lists are both simple data structures that store multiple values.
    These data structures differ in how they allow access to the data.


    Arrays are like a set of bins with a fixed number of slots. Their structure makes
    it easy to read or write an arbitrary element in the array.


    In contrast, linked lists are easily expandable. However, you must scan to the
    correct location in the chain to read or modify a node.


    ***


    One year after Zed opened his coffee shop in the capital, business was great.
    Zed had a devoted set of regulars who bought coffee every morning on their way
    to the castle. They were mostly bureaucrats, specializing in such jobs as counting
    cattle or copying maps. King Fredrick’s steward had become a particularly devoted
    patron, drinking an alarming amount of coffee each day. Even Princess Ann used
    to frequent the shop before she departed on her quest.


    Then, one day, a competitor opened shop across the street. Zed started losing
    business to MegaCup’s low prices and flashy signs. Zed knew he had to expand.
    Looking over the books, Zed noticed that he sold a lot of coffee in the morning
    but almost none at night. None of his customers wanted to be jittery as they headed
    home and went to sleep. Zed needed a new product—something he could sell at night.


    His supplier told him about a new type of coffee coming from the southern region
    of the kingdom, “Low-Jitter Coffee.” Immediately, Zed knew this coffee would solve
    his evening sales slump. He ordered eight cases.


    Zed needed a way to market his new coffee. The sign outside his store read “Coffee”
    and didn’t have room for anything else. After a week of intense thought, Zed ordered
    a new ArrayDesignBoard menu board for outside his shop. The board had four slots
    into which you could slide the menu items you wanted to display. He slid in “Coffee”
    and “Low-Jitter Coffee” tags.


    The new coffee became a huge success. Zed’s business doubled in a week. He added
    four baristas to the evening shift. He even attracted a few new morning customers,
    such as the king’s tailor, who had long ago learned not to mix sewing and strong
    coffee.


    However, Zed’s competition soon caught on. A week later, Zed noticed a new shingle
    on MegaCup’s sign: “Low-Jitter Coffee.” The war was on.


    ![](images/00030.jpg)

