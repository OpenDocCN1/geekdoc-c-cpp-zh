- fmt: "\n“Mister Mayor, I think there’s a wizard casting spells on the scholars of\
    \ G’Raph,” Ann repeated. “Everyone to whom the wizard has spoken has become obsessed\
    \ with finding an efficient, exact solution to a specific NP-hard problem. Have\
    \ you heard any stories about a stranger in a dark cloak asking scholars NP-hard\
    \ computational problems?”\n\nThe mayor looked confused. “NP-hard? I’m not exactly\
    \ sure what that means, but I had a man in a dark cloak ask me a hard question\
    \ once.”\n\n“You did?” asked Ann, Edgar, and Florence in unison. None of them\
    \ could hide the shocked looks on their faces.\n\n“Yes,” answered the mayor. “It\
    \ was about twenty years ago—right after I left school. He had just come from\
    \ the library. I think he stopped to talk to Geoffrey about some salesman problem.\
    \ Geoffrey was my favorite teacher, you know. He would always have the easiest\
    \ tests. Anyway, the man asked me if I could solve a game: find a path through\
    \ G’Raph such that I go through each island at most one time.”\n\n“The Hamiltonian\
    \ Path problem,” stated Edgar. “It’s also NP-hard.”\n\n“It’s related to Geoffrey’s\
    \ traveling salesman problem,” added Florence.\n\n“But why did the wizard ask\
    \ you about Hamiltonian paths?” Ann asked, trying to phrase the question tactfully.\
    \ From her limited time with the mayor, he had yet to strike her as one of G’Raph’s\
    \ great scholars.\n\nThe mayor shrugged. “I don’t know, but it sounded like a\
    \ fun game.”\n\n“It’s a popular game in G’Raph,” Edgar agreed. “We played Hamiltonian\
    \ paths as kids. We would draw out different hopscotch graphs and have to traverse\
    \ them in Hamiltonian paths. Of course, you weren’t allowed to solve them ahead\
    \ of time. You had to determine the Hamiltonian path as you were hopping. If you\
    \ got stuck or stepped on the same node twice, you were out.”\n\nAnn looked skeptical.\
    \ “You really played that as a kid? That was how you spent your childhood?” she\
    \ asked.\n\nEdgar smiled at the fond memory. “Those were good times,” he answered.\n\
    \n“What did you say to the wizard?” Ann asked the mayor. “You didn’t solve it,\
    \ did you?”\n\nThe mayor smiled. “I sure did. I told the man in the cloak: ‘That’s\
    \ easy. I would just build a few more bridges.’ The man left shortly after that.\
    \ I think he said something about my future as a politician.”\n\n“That’s cheating,”\
    \ objected Edgar. “You can’t add bridges in a game of Hamiltonian paths!”\n\n\
    “Mister Mayor,” interrupted Ann. “Do you know anyone else who met the wizard?”\n\
    \nThe mayor thought for a moment. “Not here in G’Raph. But I had an intern who\
    \ told me a story that sounded similar to what you’re claiming. He had a good\
    \ friend in the town of Bool who became obsessed with one of these hard problems.\
    \ What did you call them? NT? ND?”\n\n“NP,” offered Ann.\n\n“Sure, sure. Anyway,\
    \ my intern’s friend had a fun little problem called 3-SAT or something like that.\
    \ Sounded like the type of thing you would find in the Sunday paper.”\n\n“The\
    \ town of Bool? Are you sure?” asked Ann.\n\nThe mayor nodded. “You always know\
    \ a Boolean when you meet one.”\n\nAnn couldn’t agree more. At the thought of\
    \ Bool, her mind flashed back to Dr. Conjunctione and his insistence on solving\
    \ 3-SAT. In that instant, the scope of the problem became frighteningly clear.\n\
    \nAfter a few more minutes of discussion, Ann decided that she wasn’t going to\
    \ find any more answers here. She knew that there was a wizard who was casting\
    \ spells on computational scholars; now she had to figure out why.\n\nFor the\
    \ first time in her quest, Ann knew where to go next. She needed to pay a visit\
    \ to the one place where she might find more information about NP-hard problems:\
    \ the Library of Alexandria.\n\n## COMPUTATIONAL THINKING\n\n![](images/00061.jpg)\n\
    \n## Reflections on Algorithms\n\nComplex algorithms build on a core set of fundamental\
    \ concepts. Mastering these basic concepts and learning to combine them is the\
    \ key to solving new problems.\n\n* * *\n\nFor the millionth time, Ann wished\
    \ that she had a better algorithm for solving quests. She wanted something that\
    \ required less guessing and that guaranteed a solution. Most of all, she wanted\
    \ something fast. After nearly a year of searching, Ann was tired.\n\nAs she looked\
    \ down at the rugged dirt road, her mind wandered back to her time at G’Raph and\
    \ the algorithms she learned there. Those algorithms, such as Dijkstra’s shortest-path\
    \ algorithm and Prim’s algorithm for minimum spanning trees, went beyond anything\
