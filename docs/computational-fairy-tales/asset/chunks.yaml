    The manager waited for Casey to see the solution. It wasn’t a hard problem. Finally,
    after two minutes, the manager realized that Casey wasn’t going to figure it out.


    “Use that empty tank as temporary storage,” the manager prompted. “First, put
    the tetras in the empty tank. Second, move the tiger barbs to the old tetra tank.
    Third, move the tetras to the old tiger barb tank.”


    “But that means three sets of moving things. I know that I can do it in two.”
    Casey responded. He was determined to prove that he was a good employee.


    The manager sighed. “No. You can’t. You need to use temporary storage. Otherwise,
    you’ll end up putting tiger barbs in the tetra tank and causing problems.”


    Casey wanted to argue, but he couldn’t think of a better solution. “Okay,” he
    finally agreed.


    The manager looked at Casey. While he was semi-confident that Casey could handle
    the fish swap, he worried about Casey doing something stupid later.


    “Come find me when you finish,” the manager instructed. “And stay away from the
    turtle tank,” he added for good measure.


    ![](images/00003.jpg)

    ![](images/00033.jpg)

    ![](images/00024.jpg)


    ## Pointers and Walk-In Closets


    Pointers are variables that hold a particular type of data: addresses in the computer’s
    memory. A main advantage of using pointers is the flexibility that they provide
    when interacting with data stored in memory. A single, relatively small pointer
    can give the location of a massive chunk of data sitting in memory, allowing functions
    to access the data without passing around the full block of data itself. Programmers
    can also create complex data structures by using pointers to link blocks of data.


    ***


    The powerful wizard Marcus lived in a small townhouse in downtown New Athens.
    It had high rent and terrible views, but that was the price of living downtown.
    To be honest, neither of those factors bothered Marcus. What annoyed him was the
    the townhouse’s size. Marcus had accumulated many belongings over the years, and
    he liked having a place to store them. The townhouse had only one closet, and
    it was pathetically small.


    Being a powerful magician, Marcus turned to magical solutions to improve the situation.
    First, he shrunk his belongings so everything fit in his closet. However, he could
    never find anything in the resulting heap of tiny items. One night he spent two
    hours on the floor with a magnifying glass, searching for his favorite wizard’s
    hat. As a result, he arrived tremendously late for a date.


    Next, he tried dehydrating his possessions to powder and putting them in labeled
    jars. His closet soon resembled a spice rack. Unfortunately, rehydrating clothes
    left them thoroughly soaked, and a single poorly timed sneeze scattered his favorite
    cloak over his living room. Marcus quickly abandoned that idea as well.


    Finally, he came to a stunning realization. He didn’t need to keep all of his
    possessions right here. As long as he could easily retrieve them when needed,
    he could store them anywhere.


    He bought a huge castle in the rural outlands to store his belongings. When he
    needed an object, he would summon it. Similarly, when he finished with it, he
    would send it back. The process effectively gave him a giant virtual closet.


    In only a short matter of time, Marcus found that he had a new problem. He no
    longer remembered what was in the castle or even how much space he had left. Fashions
    from previous years lay forgotten throughout the castle’s halls. He found himself
    randomly summoning items from different rooms in the castle just to see what was
    there—a process that led to the disturbing discovery of a two-year-old blueberry
    muffin. Marcus needed a better system.


    In order to keep track of the items he had stored in the castle and their locations,
    Marcus created a formal accounting system. He divided the castle into a giant,
    labeled grid of squares. Then he created a scroll listing all of his items. Each
    time he sent an item to the castle, he carefully recorded a pointer to where he
    had sent that object. Using this scroll, he could find the location from which
    to summon any item. He needed to keep only one small scroll of pointers in his
    downtown townhouse. This system worked well.


    ![](images/00008.jpg)


    Or, at least, the system worked well most of the time. Occasionally, Marcus got
    careless and forgot to record where he sent an item. As a result the item was
    lost and the space inside the castle wasted. Other times, Marcus would forget
    to check that a space was free before sending an object there. One night, after
    returning from a party, he accidentally sent his coat to the same location as
    a priceless vase. The vase exploded as the large coat appeared inside it. These
    were the inherent dangers of carelessness with his pointers.


    Despite the occasional accident, the system worked well. Marcus learned to be
    careful about tracking everything in his scroll, and he lived happily in his small
    townhouse in the most fashionable neighborhood in New Athens.


    ## Linked Lists and Ocean Voyages


    Linked lists are data structures that store lists of items. Each node in the list
    consists of a few pieces of data: the information being stored at that node (or
    a pointer to it), a pointer to the next node in the list, and (optionally) a pointer
    to the previous node in the list. An algorithm can traverse the items in a list
    by simply following the pointer out of each node to the next. Linked lists allow
    the user to insert and remove elements easily, simply by changing the appropriate
    nodes’ pointers.


    ***


    Ann had been excited about her ocean voyage to visit the Oracle of New Atlantis
    for approximately twenty minutes. She had stood at the ship’s railing, watching
    the shoreline move away and feeling the sea breeze on her face. The ship’s sails
    had made a pleasant flapping noise as they caught the wind. It had been exhilarating.
    Then, much to her dismay, the ship had started a nauseating series of sways and
    lurches.


    Bundled up against the (now frigid) breeze, Ann sat on the ship’s deck and watched
    the three ships following after them. The first trailed four hundred meters behind,
    the second four hundred meters after that, and the third another four hundred
    meters behind. In addition, Ann knew that another ship led the way, four hundred
    meters in front of them. Together the five ships made a convoy that stretched
    out in a mile-long line across the ocean.


    ![](images/00029.jpg)


    Ann had found the arrangement of the convoy fascinating. When she had interrogated
    the captain as to the convoy’s linear arrangement, he had happily explained the
    line’s functionality in exquisite detail. The convoy consisted of a chain of ships
    navigating along the same route. The head ship led the convoy. This arrangement
    facilitated both navigation and safety.


    Communication among the ships also fascinated Ann. Each ship had two special crew
    members, called pointers, who handled communication with the other ships. The
    pointer in the rear of one ship could communicate with the pointer at the front
    of following ship by using large, brightly colored flags. Sadly, it had taken
    a comment from the captain before Ann realized that the pointers were passing
    messages. It had honestly looked as though they were simply being friendly and,
    perhaps, a bit too enthusiastic.


    When ship #2 wanted to pass a message to ship #5, the pointer at the back of ship
    #2 would signal the message to the pointer at the front of ship #3\. Similarly,
    through pointers, ship #3 would relay it to ship #4 and ship #4 to ship #5\. It
    was a completely linear system, with the message passing through each ship on
    its way.

