    “I have no idea what this particular spider is trying to do or why he built this
    web like this,” answered Ann. “But, in the case of binary search trees, the branching
    structure makes searching for a specific node very fast.”


    “You think this spider is organizing his bugs?”


    “Of course not,” answered Ann. “Or … probably not. But the similarity is remarkable.”


    Both Ann and the captain stood in silence, watching the spider disconnect an empty
    node at the bottom of his web. The empty webbing floated away in the breeze.


    “Like a ship leaving the convoy,” Ann noted, marveling at how the web’s nodes
    were linked together.


    “Do you think we should put our ships into one of these ‘trees’?” the captain
    asked.


    “Why would you do that?” asked Ann.


    “Well … you make it sound like a superior way of organizing things,” said the
    captain.


    Ann shrugged. “Different data structures are meant for different things. Binary
    search trees are good for searching. Linked lists are good for storing a sequence
    of data.


    “I think that a line works better in your case,” she continued. “If you used a
    tree, the convoy would branch out as it went back—each ship would have two ships
    linked behind it. It would be terribly difficult to navigate into the harbor.
    I’m sure at least one ship would run aground. And you would likely confuse every
    fishing boat in your path.”


    Ann shook her head at the image of a giant tree of ships bearing down on a small
    fishing boat. “No,” she concluded. “It wouldn’t work well at all.”


    ![](images/00072.jpg)


    The captain nodded and looked relieved. Ann wondered if he had actually been willing
    to reconsider the convoy’s formation based on a few offhand comments about a spider’s
    web. However, she let the matter drop so as not to embarrass the captain. After
    exchanging a few more pleasantries with her, the captain returned to his duties.


    Ann continued to watch the spider for another two hours, fascinated by the web’s
    strange design and the unknown reasons behind it.


    ## Caching and the Library of Alexandria


    Caching data means storing a copy of the data in a quickly accessible location
    to speed up future accesses of that data. The key trade-off is that the faster
    storage locations for data tend to be smaller and thus hold less data. For example,
    accessing data from RAM is much faster than reading it off a hard drive, but RAM
    is both smaller and expensive per unit of storage. By caching data that is used
    often, you can greatly speed up a program.


    * * *


    The Library of Alexandria is still famous to this day for the size and breadth
    of its collection. However, few people know that the true magic of the library
    was the librarian’s ability to find relevant resources with amazing speed. Within
    a few seconds he could often locate the canonical reference to answer a patron’s
    question.


    For young Peter, this magical ability had always been a thing of wonder. He had
    grown up in a small house four blocks from the library and had spent many afternoons
    sitting at the tables listening to the librarian answer questions:


    “What should I feed my new pet yak?”


    “Where can I find the sweetest prunes in Alexandria?”


    The scope of knowledge commanded by the librarian was almost legendary. Peter
    dreamed of one day learning the magic. And, after ten years of training, Peter
    got his wish: he was accepted as the librarian’s apprentice.


    On the first day of his apprenticeship, Peter arrived three hours early. As the
    librarian took him on a tour of the library, Peter eagerly followed him around,
    scribbling notes into his new notebook. Although Peter knew the public areas by
    heart, he soaked in every word. After the tour was complete, the librarian and
    his new apprentice took their places behind the reference desk and waited for
    the first patron of the day.


    The first question came from a small man holding a rather large rock. “I’m trying
    to build a wheel. And, well … I’m not sure what shape to go with. Do you have
    any good references?”


