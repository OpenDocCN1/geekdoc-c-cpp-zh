    A wizard in a dark black cloak stood at the foot of the library stairs. In his
    right hand, he held a solid wooden staff carved with mathematical symbols. A large
    hood obscured his face.


    “Good morning. I am looking for Peter,” announced the wizard. He stopped at the
    foot of the steps and looked up at the two kids standing there.


    Peter didn’t answer. He gripped Ann’s arm tightly and took a half step backward.
    “Are you sure about your plan?” he asked Ann in a whisper.


    Ann looked at the wizard standing at the foot of the library steps. “No,” she
    whispered back truthfully. “But we’re out of time. This is our only option.”


    “We could run,” offered Peter.


    Ann didn’t respond. She stared at the wizard, waiting for the spell to come.


    The wizard cleared his throat loudly. He looked mildly annoyed that he didn’t
    seem to have their full attention.


    “Excuse me. Are you Peter?” the wizard asked again as he started to approach.
    “I have a problem for which I need your help. I have been told that you are a
    great computational mind.”


    Peter’s grip tightened.


    “Ask me,” Ann said.


    The wizard paused and studied Ann for a moment. Then, he pulled back his hood.
    His face reminded Ann of any of the many tenured professors at her school. His
    gray hair barely covered his head and deep wrinkles adorned his face, but his
    eyes blazed intensely. He gave her a wicked smile. “Princess Ann? What a truly
    pleasant surprise. I had not expected to run into you so soon. Of course, I had
    hoped our paths would indeed cross.”


    “Are you going to ask me a question or not?” asked Ann.


    The wizard’s smile widened to consume his entire face. “Let’s talk about a little
    problem that I call the traveling salesman problem. I need to find a fast, exact
    algorithm to solve that very problem on large graphs.” His voice was calm and
    almost soothing; it reminded Ann of countless lectures that had put her to sleep.
    As he spoke, his right hand began to wave his staff back and forth. A faint blue
    glow emanated from the top.


    “I was always partial to an algorithm that I learned in the sixth grade: randomized
    hill-climbing,” stated Ann.


    The wizard paused, looking confused. “Randomized hill-climbing?” he asked.


    “It’s quite simple,” explained Ann. “Start with a guess at the solution. It will
    probably be wrong, but you can at least find out how good it is. In this case,
    guess a path and compute its total distance.


    “Then, you start the optimization loop. At each step in the loop you:


    1.  Propose a small random change to your solution.


    2.  Check the new solution.


    3.  If the new solution is better, take it. If it isn’t better, then take it with
    some small probability. I like to roll two six-sided dice and take a bad move
    if I roll a double six.'
