    # The Prince’s Complaint Line


    Stacks, queues, and priority queues are data structures that control the order
    in which data is extracted. Stacks are last-in, first-out data structures that
    return the most recent data inserted. Queues are first-in, first-out data structures
    that return the least recent data inserted. Priority queues return the highest
    priority data inserted (accord to some priority value).


    ***


    Before he became king, Prince Fredrick had a tradition of hearing his future subjects’
    complaints every Tuesday in the Great Room. At 10 a.m. the doors would open and
    his loyal subjects would fill the room to raise their complaints. On the days
    he felt particularly generous, Prince Fredrick would even task his steward with
    addressing some of the complaints. However, on most days, Fredrick believed that
    he had done his part just by listening to them.


    By 6 a.m. every Tuesday, a large crowd would form outside the doors to the Hall
    of Complaints. Farmers with particularly pressing concerns camped out for days
    or weeks, hoping to be near the front of the crowd and thus be selected to discuss
    their complaint. The fact that their complaint would likely be ignored did not
    dampen their resolve. They needed to be heard.


    Fredrick never gave much thought to what happened before the doors opened. After
    all, he was the prince. Why should he care about what happened outside of his
    room?


    Then, Rok the Dragon arrived. In early June the dragon started burning crop fields
    and eating the livestock—typical dragon activities. However, Fredrick continued
    to use his system, selecting the subjects from the front of the room.


    In late July, Fredrick finally selected a farmer who was there to talk about the
    dragon. “What is your complaint?” asked Fredrick.


    “A dragon ate my farm,” the farmer answered.


    “A dragon?” Fredrick repeated. “We must act now before it destroys a second farm!”


    Silence followed Prince Fredrick’s proclamation.


    “What is it?” Fredrick asked, but nobody responded. Fredrick singled out another
    farmer and directed the question at him.


    “It’s just—well—the dragon has destroyed over twenty farms since it arrived here
    in June. My farm was destroyed six weeks ago.”


    “Why am I only hearing about it now?” yelled the prince.


    “Noble sir, I’ve been lining up for six weeks to discuss the dragon. It’s only
    today that you gave me an audience.”


    “How many others are here to talk about the dragon?” inquired the prince. Half
    the people in the room raised their hands. The prince screamed at everyone in
    general. Eventually, he calmed down enough to send knights to run the dragon out
    of town.


    “This will never happen again,” the prince vowed. “Henceforth there will be a
    system. Each person will write down his or her complaint and put it on top of
    a complaint stack. Each Tuesday from 10 a.m. to 11 a.m. I will take the top complaints
    off the stack. This way I will always hear the most recent complaints.”


    Everyone in the room looked at each other. They gave a half-hearted cheer: “Yay.”


    For the next few months life returned to normal and the Complaint Stack worked
    as well as the unorganized mob of people. Then Rok returned. On Wednesday, he
    ate one farm and took a week-long nap.


    On the following Tuesday, the prince read through the first ten complaints. All
    ten were about refereeing at last Sunday’s sporting event. The prince sighed.
    He retired to his study and began working on the new system. It had to let people
    voice their frustrations. It had to allow the prince to find the most important
    issues. More importantly, it couldn’t take too much of his time; he really hated
    dealing with complaints. He spent three weeks in isolation working on his system.

