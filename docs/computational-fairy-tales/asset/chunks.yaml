    The librarian led Peter into the back room. The room was dimly lit by two small
    oil lamps. At the back was a single door leading to the vaults where the thousands
    of scrolls were kept. The librarian walked over to the a small table that held
    a coffee pot and a small stack of scrolls. He pointed at the scrolls. “I usually
    find the answers in one of these.”


    Peter was confused. “Twenty scrolls? The library has tens of thousands of scrolls.
    How does having twenty in the back room help? Are they magic?”


    “Not at all,” chuckled the librarian. “It turns out that people are pretty boring.
    They all ask the same types of questions. In fact, I’ve found that 95% of the
    questions in a single day can be answered with only twenty scrolls.”


    “Is that all?” Peter asked, visibly disappointed.


    “Yes,” replied the librarian. “What did you hope for?”


    “I’m not sure. But I was certainly expecting something magical. Maybe you were
    summoning the scrolls or could teleport yourself to the correct shelf. But … this
    seems like cheating.”


    “Cheating?” The librarian laughed. “Do you realize how much effort goes into making
    this efficient enough to appear magical? You can’t pick any twenty scrolls. They
    have to be the right twenty scrolls.”


    At the news of this challenge, the apprentice perked up a bit. “And how do you
    pick them? Telepathy?”


    “When I first started, I kept the most frequently read scrolls in my cache. Every
    time someone read a scroll, I would note that. I kept a count for each scroll.”


    “I see why that would work,” said the apprentice, sounding slightly bored.


    “Aha! But it didn’t work!” exclaimed the librarian. “Everything seemed to be going
    fine, until the same scrolls got stuck in my cache. Remember that massive flood
    we had two years ago? During the entire flood, I still had three scrolls on how
    to survive a drought. It was a disaster.”


    “Then I had a new idea,” he continued. “I could keep more data and use statistics.
    I meticulously kept track of which scrolls people were viewing and correlated
