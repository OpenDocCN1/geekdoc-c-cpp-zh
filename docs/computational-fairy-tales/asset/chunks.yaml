    After thanking the mayor, Ann began her trek back to the inn. As she crossed the
    bridge from the dry cleaner’s to the inn, she was grateful that she could walk
    either direction across the bridge. She was too tired to find her way around G’Raph
    through an entirely different set of bridges.


    ## Bridge Weights


    Graphs can have either weighted or unweighted edges. In graphs with weighted edges,
    each edge is associated with a numeric weight. The interpretations of the weights
    depend on what the graph represents. For example, the weights might indicate the
    distance between two nodes in a transportation graph, or they could indicate the
    cost of sending messages between two computers in a computer network.


    Two of G’Raph’s scholars, Edgar and Florence, met Ann at the library. They were
    both visibly excited. The mayor had warned Ann that G’Raph’s academic community
    rarely had opportunities to show off their latest algorithms, but she had not
    expected this much energy. The two scholars babbled nonstop about path routing
    and clustering with such zeal that Ann began to share their excitement.


    After settling into a small, overcrowded office in the basement of the library,
    the scholars immediately pulled out a large stack of maps. Each map showed the
    same set of islands—the city of G’Raph. However, each map contained different
    labels next to the bridges.


    “What are all these labels?” asked Ann.


    “The labels on the nodes or edges?” asked Florence.


    “Nodes? Edges?” asked Ann. “I meant the bridges.”


    “Oh. Sorry,” said Florence. “Whenever I look at these maps, I see graph data.
    Hazard of the job, you know. Each of the islands is a node, and each of the bridges
    is an edge. So each edge links two nodes. It’s a useful abstraction.”


    “I see,” said Ann. “In that case, what do the labels on the edges mean?”


    “It depends on the map,” answered Florence. “This one is labeled with the distance
    between the islands. We use it for path planning.”


    “I understand labeling the bridges with their lengths. That would allow you to
    compute the shortest path between two islands, right? How else would you label
    an edge?” asked Ann.


    ![](images/00028.jpg)


    “Distance is only one concern,” said Edgar. He had been sitting quietly in the
    corner, drinking his ninth cup of coffee. “There are hundreds of other things
    you might want to consider. For example, this map is labeled with the smelliness
    of each bridge. We use it for planning tours. Some of the bridges cross particularly
    nasty bits of swamp, you know. We want to avoid those bridges for tours, so we
    give them a high cost.”


    “This one is labeled with the estimated length of time needed to cross the bridge,”
    interrupted Florence. She hoped to prevent Edgar from launching into a coffee-fueled
    lecture on the unpleasantness of living in a swamp. “We use it to compute different
    evacuation scenarios.”


    “Evacuation?” asked Ann in surprise. “Why would you need to evacuate?”


    “There was some trouble a few years ago with a dragon,” answered Florence. “We
    didn’t account for the time that it actually took to cross an old bridge. It totally
    gummed up the evacuation. Ten people got stuck at the dry cleaner’s after the
    dragon burned out a bridge. They were trapped for a week.”


    “And they didn’t stop complaining for three months after that,” added Edgar.


    Ann nodded. The prospect of being stuck at the dry cleaner’s for a week seemed
    rather unpleasant. “Which map do you use most?” she asked.


    “This one, of course,” answered Florence and Edgar at the same time. They both
    pointed to a map labeled with the distances between islands.


    “You use it for path planning? How do you do that?” prompted Ann. She was eager
    to learn more about the graph algorithms.


    “Dijkstra’s algorithm!”


    “What’s that?” asked Ann. Her knowledge of graph algorithms was admittedly not
    what it should be.


    “You’ll love it,” said Edgar. “It involves scooters.”


    ## Dijkstra’s Algorithm on Scooters


    Dijkstra’s algorithm finds the shortest path from a given starting node to all
    other nodes in the graph. It requires that the weights of all edges be nonnegative.
    It operates by maintaining a set of “visited” nodes and continually updating the
    tentative distance to each unvisited node. At each iteration, the closest unvisited
    node is added to the visited set and the distances to its unvisited neighbors
    are updated.


    “We start by creating a list of all islands in the city,” began Edgar. “We label
    them all ‘unvisited’ and give them a tentative distance of infinity. Except the
    starting island itself; we give that a distance of zero. You can always get from
    here to here without moving.”


    “Distances of infinity are obviously not correct,” interrupted Ann. She had walked
    from the inn to the library this morning, and it hadn’t been an infinite distance.


    “Of course it’s not correct,” agreed Florence. “Dijkstra’s algorithm keeps finding
    shorter paths to each node. The distance will keep going down as we update our
    list. Since we haven’t found any paths at this point, we use the largest distance
    that we can. That way, any path we find will be better.”


    That explanation sounded reasonable to Ann. However, she didn’t quite see where
    this was going.


    “Then, the fun begins,” continued Edgar. “We keep visiting islands until we’ve
    visited them all! This is the part where we drive around on scooters.”


    He took a deep breath before launching into the description. Ann foolishly believed
    that this was for dramatic effect.


    Edgar explained, “At each loop of the algorithm, we follow the same procedure:


    1. We find the unvisited island with the shortest distance to our starting point.

    2. We travel to that island on our scooters. Usually, Florence and I race. That
    adds some more excitement.

    3. Once we’re on the island, we find all of the islands connected to it—all of
    its neighbors—and update their tentative distances. For each unvisited neighbor,
    we compute how far it is from the starting island if we go through the current
    island—that is, the distance to the current island plus the distance to its neighbor.
    If this new distance is shorter, then we’ve found a better path and we update
    the distance.

    4. We mark the current island as visited, knowing that we now have the shortest
    path to that island.


    Then we repeat the procedure for the next closest unvisited island.”


    By the end of the explanation, Edgar was winded. He took a few gulps of coffee
    as he collected himself.


    “At the end, all of the islands have been visited, and we have a list of the shortest
    distances to each one,” added Florence helpfully.


    “There’s one thing that I don’t understand—” Ann started.


    “An example will help,” interrupted Edgar. “Say we start at the library. That
    becomes our current node, with distance zero. Everything else starts with an infinite
    distance.”


    As Edgar spoke, he retrieved a fresh map of G’Raph from what appeared to be a
    frighteningly large stack of identical copies of the map. They reminded Ann of
    children’s paper placats. Edgar circled the library in dark marker.


    “Then we look at the neighbors and update their proposed distances,” he continued.
    “In this case, the inn is at most 5 meters away and City Hall is at most 18 meters
    away.”


    ![](images/00039.jpg)


    “Now we’re done with the library,” he continued. We mark it as ‘visited’ and move
    to the next closest island—the inn. In this case, it’s a quick scooter drive and
    not much of a race.


    “Since the inn is the closest unvisited island, we know we’ve found the shortest
    path to it. We can update both its distance and its path.”


    ![](images/00026.jpg)


    “Yay!” added Florence, cheering on the description of the algorithm.

