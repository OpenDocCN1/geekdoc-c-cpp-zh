    整个安排让 Ann 想起了她小时候读幼儿园的时光，那时学生们在郊外活动时被要求手拉手。每个孩子都恰好与两名同学保持接触，确保整条学生队伍保持完全连接。老师们会沿着队伍走动，仔细地对着名单来核对学生人数。


    但在 Ann 心中里，幼儿园队伍最棒的地方在于它们具有**动态性**。如果 Ann 需要去洗手间，她只需要确保她两边的学生互相拉手，就可以离开队伍。当她回来时，她会选择一个点将自己插入队伍中，在那个点断开队伍，并通过与新邻居握手来重新建立连接。由于这些新加入的人员经常忘记擦手，这个过程还包括了新邻居们的大声抱怨。这些幼儿园队伍让
    Ann 开开了眼界，看到了动态数据结构的威力。


    “船长，你们的船队会有增加或减少吗？”Ann 在一个早晨问道，“或者船队一旦出发就固定了？”


    “船队当然会变化，”船长回答道，“事实上，今天晚些时候将会有三艘船从北帕塔戈尼亚加入我们。”他模糊地指了指北帕塔戈尼亚的方向，仿佛在说明他的观点。


    “它们会加入队伍末尾吗？”Ann 问道，急于理解船队的动态情况。简单地将新船附加在队伍末尾是有道理的。这样一来，只需要新抵达船的首艘船和当前船队的最后一艘船进行连接即可。这就是他们在幼儿园时合并队伍的方式。


    “不，不，”船长坚持道，“它们将加入 4 号船和 5 号船之间。5 号船是一艘特殊的战舰，配有额外的后向炮。它必须排在最后。船只将一个一个地插入链条中，通过它们的指针进行协调。那些指针可是了出色的水手。”


    “但怎么做呢？”Ann 问道。


    “向你保证，非常简单。新船，我们称它为 `D`，它会停在我们的头船旁边然后慢下来。它会沿着船队缓慢移动，直到找到一个可以插入的位置：比如在 `A` 号船和
    `B` 号船之间。然后重新分配指针。`D` 的后指针现在指向 `B`。`B` 的前指针现在指向 `D`。`A` 的后指针现在指向 `D`。而 `D` 的前指针现在指向
    `A`。这一切都非常有组织。”


    Ann 非常兴奋。当下午船只到达时，她欣喜地看着它们那协调一致的“舞蹈”。这种简单性让她感到惊叹。在队伍中插入一艘新船只需要重新分配四个指针，每个方向两个。在对船队动态操作的兴奋中，Ann
    甚至忘记了她的晕症。


    ![](img/00037.jpg)


    # 王子的投诉队列


    栈（Stacks）、队列（queues）和优先级队列（priority queues）是控制数据提取顺序的数据结构。栈是后进先出（LIFO）的数据结构，返回最近插入的数据。队列是先进出（FIFO）的数据结构，返回最早插入的数据。优先级队列则返回优先级最高的插入数据（根据某些优先级值）。


    ***


    在成为国王之前，弗雷德里克王子有一个传统，即每周二二在大厅里听取他未来臣民的抱怨。上午 10 点，门会打开，他忠诚的臣民会挤满房间来提出他们的抱怨。在他感到特别慷慨的日子里，弗雷德里克王子甚至会要求他的管家处理一些抱怨。然而，在大多数时候，弗雷德里克认为，光是听取这些意见就已经尽到职责了。


    每周二清晨 6 点，一大群人在投诉大厅门外聚集。有特别迫切忧虑的农民们在外面露营了好几天或几周，希望挤到人群最前沿，从而被选中讨论他们的抱怨。他们的抱怨可能会被忽视，这一事实并没有消磨他们的决心。他们需要被听到。


    弗雷德里克从未怎么想过门打开之前发生了些什么。毕竟，他是王子。他为什么要关心他房间外发生的事情呢？


    这时，龙洛克（Rok）降了。6 月初，那条龙开始焚烧农田并吃牲畜——这是典型的龙的活动。然而，弗雷德里克继续使用他的系统，从房间前方挑选臣民。


    7 月底，弗雷德里克终于选择了一位来此谈论龙的农民。“你的诉求是什么？”弗雷德里克问道。


    “一条龙吃了我的农场，”农民回答道。


    “龙？”弗雷德里克重复道，“在我们现在摧毁第二个农场之前，必须采取行动！”


    弗雷德里克王子的宣告后是一片沉默。


    “怎么了？”弗雷德里克问，但没有人回答。弗雷德里克指了另一个农民并将问题指向他。


    “只是——额——自从它 6 月来到这里以后，那龙已经摧毁了二十多个农场。我的农场在六周前被毁了。”


    “为什么我现在才听说？”王子吼道。


    “尊贵的先生，为了讨论这条龙，我已经排了六周的了。直到今天您才见我面。”


    “还有多少人在这里谈论这条龙？”王子询问。房间里有一半的人举起了手。王子对大家大声叫。最后，他冷静了许多，派遣骑士把龙赶出城。


    “这种情况永远不会发生发生，”王子发誓道，“从现在起将有一个系统。每个人都写下自己的抱怨，并把它放在投诉栈的顶部。每周二上午 10 点到 11 点，我将从栈中取出顶部的抱怨。这样，我就总能听到最近的抱怨。”


    房间里的每个人互相看着对方。他们发出了一个力不从心的欢呼：“万岁。”


    在过去的几个月里，生活恢复了正常，投诉栈运行得和之前无组织的人群一样。接着龙洛克回来了。周三，它吃掉了一个农场，然后睡了一个星期的觉。


    在下一个周二，王子读了前十条抱怨。这十条都是关于上周日体育活动的裁判的。王子叹了口气。他回到书房，开始研究一种新系统。它必须让人们发泄情绪。它必须让王子找到最重要的问题。更重要的是，它不能占用他太多的时间；他真的很讨厌处理抱怨。他闭关了三周来研究他的系统。


