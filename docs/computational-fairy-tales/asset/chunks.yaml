- fmt: "\nAnn looked back at him. “Then what did you mean?” she asked.\n\n“The wizard\
    \ has cursed all of the scholars, so they aren’t developing any new algorithms.\
    \ I get that, and that’s bad. But why is it impacting everything else so quickly?\
    \ It should take a while for the kingdom to get this bad, right? Not everyone\
    \ needs a new algorithm every day. It’s not like a loaf of bread in a damp closest.\
    \ Algorithms don’t get all green and fuzzy with age.”\n\n“Oh, right … that,” said\
    \ Ann, the energy draining out of her voice.\n\nAnn didn’t speak for a moment.\
    \ She looked at Peter, carefully studying him. Peter got the distinct feeling\
    \ that he wouldn’t like what came next.\n\n“It’s much worse than that,” Ann said\
    \ finally.\n\n“Worse?” asked Peter.\n\n“Worse,” confirmed Ann.\n\n“Uh, how?” asked\
    \ Peter nervously.\n\n“I think the spells are targeting more than the scholars,”\
    \ explained Ann. “The curse is seeping into all aspects of life. It’s using the\
    \ scholars—using them to target the very algorithms themselves. You curse an expert\
    \ in sorting, and you curse the sorting algorithm itself. The wizard is unraveling\
    \ the very basis of computation in the kingdom.”\n\n“Oh,” was all that Peter could\
    \ manage. His legs suddenly seemed a bit wobbly. He felt around for a chair, pulled\
    \ it behind him, and fell into it.\n\n“Oh,” he repeated.\n\n“Yeah,” Ann agreed.\n\
    \n“So?” asked Peter.\n\n“I have to stop it … fast.”\n\n## The Quicksort Message\n\
    \n`Quicksort` is a recursive sorting algorithm that is similar to merge sort.\
    \ Like merge sort, `quicksort` partitions the items into two groups, recursively\
    \ sorts those groups, and merges the results into a single sorted list. Unlike\
    \ merge sort, `quicksort` uses the items’ values in the partitioning. `Quicksort`\
    \ chooses a random element, called a `pivot`, and divides the current list into\
    \ two sublists: items less than or equal to the `pivot`, and items greater than\
    \ the `pivot`. Since the lists are partitioned by value, the merge operation consists\
    \ of simply appending one sorted list to the other.\n\nThe worst-case performance\
    \ of `quicksort` is `O(N²)`. However, `quicksort` takes `N log N` time on average.\
    \ In fact, `quicksort` can be faster than other `O(N log N)` sorting algorithms\
    \ such as merge sort.\n\n***\n\n“What are you doing?” asked Ann.\n\n“Putting away\
    \ books,” answered Peter. “We ask the patrons to leave the books out for us, because\
    \ they always mess things up when they try to help. They take the book back to\
    \ the general area where they got it, see a gap, and shove it there. It messs\
    \ up the whole order. And you should see what they do with the scrolls.”\n\n“Okay,”\
    \ agreed Ann. “But what are you doing with the those books now?”\n\n“Sorting them,”\
    \ answered Peter. “It’s easier if I sort them here. That way I can go through\
    \ the stacks in order and put away the books. It’s like the merge step of a gigantic\
    \ merge sort. It saves a lot of time.”\n\n“But how are you sorting them? It almost\
    \ looks like you’re picking things at random.”\n\n“Oh,” Peter said. “This is something\
    \ new that an accountant showed me. She called it `quicksort`. It has a terrible\
    \ worst-case big-O complexity, but it actually works pretty well.”\n\n“An accountant?”\
    \ asked Ann.\n\n“I think she works for a farm animal bureau, but she seemed to\
    \ understand sorting. She obviously isn’t a computational expert though, or she\
    \ would have known this `quicksort` has a worst-case time of `O(N²)`. Imagine\
    \ trying to sort more than a few shelves of books—”\n\n“Clare O’Connell?” interrupted\
    \ Ann. She stood up, staring intensely at the book cart.\n\nPeter paused. In the\
    \ five days Ann had been working at the library, she had barely looked up from\
    \ her books. Her sudden interest in the reshelving of books unnerved him. The\
    \ fact that she was paying any attention to him now was unnerving. \n\n“That sounds\
    \ familiar,” Peter answered hesitantly.\n\n“Tell me everything,” commanded Ann.\
    \ She stood next to him now, still staring at the bookshelves. “What did she say?”\n\
    \n“Uh, okay … yeah, she was in here a few weeks ago to get a scroll on cows—or\
    \ turkeys—or some type of animal. I’m pretty sure it was cows, though.”\n\n“What\
    \ about the sorting?” prompted Ann.\n\n“All she said was that there was a better\
    \ way to sort,” Peter said. “She showed me this algorithm that she called `quicksort`.\
    \ You start with a stack of books to sort. Pick one book at random. You call that\
    \ the `pivot` book.\n\n“Then you use the `pivot` to split the stack into two smaller\
    \ stacks. Books before the `pivot` go on the left and books after the `pivot`\
    \ go on the right.\n\n![](images/00010.jpg)\n\n“You keep recursively splitting\
    \ piles until you have one book in each pile.\n\n![](images/00013.jpg)\n\n“Then\
    \ you merge them back together by putting the left pile in front of the right\
    \ pile.”\n\n![](images/00016.jpg)\n\nPeter shrugged. “That’s all there is. As\
    \ I said, it’s worst case `O(N²)`, but it usually goes faster than that. More\
    \ importantly, it’s a lot easier to merge library books by putting one pile on\
    \ top of another.”\n\nAnn didn’t respond. She continued to stare at the shelf\
    \ of library books. Finally, she whispered, “It has an `N log N` expected running\
    \ time.”\n\n“Expected?” asked Peter.\n\n“It means that on average it will take\
    \ `N log N`,” answered Ann. “I heard rumors that Clare was working with expected\
    \ running times.”\n\n“The worst case is still `N²`,” objected Peter. He firmly\
    \ believed that worst-case running time spoke for itself.\n\nThat broke Ann out\
    \ of her trance. “That’s the beauty of it,” answered Ann. “You would need to always\
    \ make a bad pick to have a that bad a running time. For example, if you always\
    \ chose the smallest value for the `pivot`, it would be bad. You would need to\
    \ split the books `N` times, with each split requiring up to `N` comparisons.”\n\
    \nAnn turned back to the bookshelf. Her voice dropped to almost a whisper. “The\
    \ chances of that must be very small.”\n\nShe spun toward Peter and grabbed his\
    \ shoulders. Her eyes lit up with a wild energy. “When did you say Clare was here?”\
    \ she asked.\n\nPeter tried to take a step back, but Ann held him tight.\n\n“When\
    \ was she here?” asked Ann.\n\n“Two weeks ago, I think.”\n\nThe Bureau of Farm\
    \ Animal Accounting had fallen three weeks ago.\n\n“It’s a message!” shouted Ann.\
    \ “Quicksort is a message!”\n\n## Comments and the Baker’s Apprentice\n\nComments\
    \ are additional text within code that can greatly improve the code’s readability\
    \ by providing additional insight, explanation, or summarization. For example,\
    \ a comment before a large block of numeric statements might simply explain `Solve\
    \ a x²+ b x+ c=0 for x,` allowing the user to understand exactly what the following\
    \ block of code is meant to do.\n\n***\n\n“Now this is how you write an algorithm,”\
    \ proclaimed Ann. After days of reading through some of the worst-written scrolls\
    \ in the history of the kingdom, Clare’s scroll on “The Application of QuickSort\
    \ to Filing Expense Reports” provided a welcome change.\n\n“How so?” asked Peter,\
    \ leaning in to look at the scroll. He stared for a moment. “I guess it’s nice\
    \ handwriting,” he said.\n\n“It’s so more than that,” said Ann. “The algorithm\
    \ itself is readable. The variable names make sense, the functions are well defined,\
    \ and there are comments. Good comments!”\n\n“Comments?” asked Peter. “That seems\
    \ unnecessary. I thought a good algorithm was supposed to make sense on its own.”\n\
    \n“Not always,” said Ann. “In complex algorithms, good comments can help make\
    \ everything more understandable. Other times, a good comment can provide useful\
    \ insights into why an approach was used.”\n\nAnn paused as she thought back.\
    \ “Our castle’s baker, Breadtista, was the first person to show me the importance\
    \ of a good comment. I spent a summer as his apprentice. In fact, I spent a lot\
