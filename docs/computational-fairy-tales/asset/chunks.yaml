  trans: '


    在感谢市长后，安（Ann）开始返回旅馆。当她穿过从干洗店到旅馆的桥时，她很感激这座桥可以从任何方向通过。她太累了，没有精力通过完全不同的另一套桥梁在格拉夫（G’Raph）绕路。


    ## 边的权重


    图可以有带权边，也可以有无权边。在带权图中，每条边都关联有一个数值权重。权重的解释取决于图所代表的内容。例如，在交通图中，权重可能表示两个节点之间的距离，或者可能表示计算机网络中两台计算机之间发送消息的成本。


    格拉夫的两位学者，埃德加（Edgar）和弗罗伦斯（Florence）在图书馆会了安。他们两个看起来都兴奋得非常厉害。市长曾警告过安，格拉夫的学术界很少有机会展示他们最新的算法，但她没想到会有这么大的活力。这两位学者就路径路由和聚类问题没完没了地闲论，如此热烈，以至于安也开始感染了他们的兴奋情绪。


    在图书馆地下室一个狭小而拥挤的办公室坐下后，学者们立刻抽出一大叠地图。每张地图显示的都是同一组岛屿——格拉夫市。然而，每张地图在桥梁旁边都包含不同的标签。


    “这些标签是什么意思？”安问道。


    “节点或边上的标签吗？”弗罗伦斯问道。


    “节点？边？”安问，“我的意思是桥。”


    “哦。抱歉，”弗罗伦斯说，“每当我看这些地图时，我看到的都是图数据。职业习惯，你懂的。每个岛屿都是一个节点，每座桥都是一条边。所以每条边都连接两个节点。这是一个非常有用的抽象。”


    “我明白了，”安说，“既然如此，边上的标签意味着什么？”


    “这取决于地图，”弗罗伦斯回答道，“这张标注的是岛屿之间的距离。我们用它来进行路径规划。”


    “我理解标注桥的长度。这允许你们计算两个岛屿之间的最短路径，对吧？你们还会怎么标注边呢？”安问道。


    ![](img/00028.jpg)


    “距离只是关注点之一，”埃德加说。他一直静静地坐在角落，喝着他的第九杯咖啡。“还有成百上千种你可能想要考虑。例如，这张地图标注了每座桥的气味。我们用它来规划路线。有些桥跨越了特别糟糕的沼泽，你知道的。我们想在旅游时避开那些桥，所以给它们设定了高成本。”


    “这张标注了通过桥梁所需的预计时间，”弗罗伦斯插话道。她希望防止埃德加开始一场关于咖啡驱动的、关于在沼泽生活多么不愉快的演讲。“我们用它来计算不同的疏散方案。”


    “疏散？”安惊讶地问，“你们为什么要疏散？”


    “几年前发生了一些关于龙的，”弗罗伦斯回答道，“我们没有考虑到通过一座旧桥实际上花费的时间。它完全搞乱了疏散。在龙烧掉了一座桥后，有十个人被困在了干洗店。他们被困了一个星期。”


    “而且在那之后的三个月里他们都没有停止抱怨，”埃德加补充道。


    安点了点头。被困在干洗店一个星期的前景似乎相当糟糕。“你们最常用的是哪张地图？”她问道。


    “当然是这一张，”弗罗伦斯和埃德加同时回答道。他们都指向一张标注有岛屿间距离的地图。


    “你们用它来进行路径规划？你们是怎么做的？”安催促道。她渴望学习更多关于图算法的知识。


    “迪杰斯特算法（Dijkstra’s algorithm）！”


    “那是什么？”安问道。她承认自己对图算法的了解并没有达到理想水平。


    “你会喜欢它的，”埃德加说，“它涉及到滑板车。”


    ## 滑板车上的迪杰斯特算法


    迪杰斯特算法寻找从给定的起始节点到图中所有其他节点的最短路径。它要求所有边的权重必须是非负的。它的运行原理是维护一个“已访问”节点集合，并不断更新到每个未访问节点的临时距离。在每次迭代中，最近的未访问节点被添加到已访问集合中，并更新到其未访问邻居的距离。


    “我们首先创建一个包含城市中所有岛屿的列表，”埃德加开始说道，“我们将它们都标记为‘未访问’，并给它们一个无穷大的临时距离。起始岛屿除外；我们给它的距离为零。你总是不需要移动就能从这里到达那里。”


    “无穷大的距离显然是不正确的，”安打断道。她今天早上从旅馆走到图书馆时，那并不是无限的距离。


    “当然是不正确的，”弗罗伦斯同意道，“迪杰斯特算法不断寻找到每个节点的更短路径。当我们更新列表时，距离会一直减小。由于目前我们还没有找到任何路径，所以我们使用能使用的最大距离。这样，我们找到的任何路径都会更好。”


    这个解释对安来说听起来合理。然而，她并没有完全明白这会走向何。


    “然后，有趣的开始了，”埃德加继续说道，“我们不断访问岛屿，直到访问了所有的岛屿！这就是我们骑滑板车到处跑的部分。”


    在开始描述之前，他深吸了一口气。安天真地认为这是为了戏剧效果。


    埃德加解释道：“在算法的每个循环中，我们遵循相同的程序：


    1. 我们找到距离起点最近的未访问岛屿。

    2. 我们骑着滑板车去那座岛屿。通常我和弗罗伦斯会比比赛。这增加了一些趣味性。

    3. 一旦到达了该岛屿，我们就找到与它相的所有岛屿——即它的邻居——并更新它们的临时距离。对于每个未访问的邻居，我们计算通过当前岛屿到达它的距离——即当前岛屿的距离加上到该邻居的距离。如果这个新距离更短，我们就找到了更好的路径并更新距离。

    4. 我们将当前岛屿标记为已访问，因为我们现在有了该岛屿的最短路径。


    然后对下一个最近的未访问岛屿重复该程序。”


    解释结束时，埃德加气喘吁吁。他喝了几口咖啡平复了一下。


    “在最后，所有的岛屿都被访问了，我们得到了一份每个岛屿最短距离的列表，”弗罗伦斯心地补充道。


    “有一件事我不明白——”安开始说。


    “举个例子会有帮助，”埃德加插话道，“假设我们从图书馆开始。它成为我们的当前节点，距离为零。其他所有地方从无穷距离开始。”


    埃德加说话时，从一堆看起来惊人的大量相同地图中取了一张新的格拉夫地图。这些地图让安想起了小孩子的纸垫。埃德加用深色马克笔圈出了图书馆。


    “然后我们查看邻居并更新它们的建议距离，”他继续道，“在这种情况下，旅馆最多 5 米远，市政厅最多 18 米远。”


    ![](img/00039.jpg)


    “现在我们完成了图书馆，”他继续道。我们将其标记为‘已访问’，并到下一个最近的岛屿——旅馆。在这种情况下，这是一次快速的滑板车行驶，不怎么像比赛。


    “既然旅馆是最近的未访问岛屿，我们知道已经找到了它的最短路径。我们可以更新它的距离和路径。”


    ![](img/00026.jpg)


    “耶！”弗罗伦斯补充道，为算法的描述欢呼。


