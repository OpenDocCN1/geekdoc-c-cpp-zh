    During one early May morning, Clare was accidentally caught in the crossfire.
    She had been leaving the baker’s shop when a stray spell turned her bread into
    a frog. The true target, a loaf of pumpernickel held by the wizard behind her,
    remained unscathed and quite edible. Unfortunately, the same could not be said
    for Clare’s bread, which promptly hopped out of her hand and down the street.
    Clare was furious.


    That morning, Clare resolved to break the stalemate and end the war for good.
    Since she didn’t have a strong opinion on the pronunciation of “elementary,” she
    chose to meet with the commander of the closest faction. During a three-hour meeting,
    she grilled him about the war’s progress. In the process, she learned how wizards
    thought about their spells. The interview ended with one unmistakable conclusion:
    wizards knew nothing about computational complexity. Years of casting spells had
    made them lazy and inefficient.


    Clare knew that the first side to relearn the importance of computational complexity
    would win the war. So, she called together all of the wizards from the closest
    faction for a tutorial at the local pub.


    “Your problem is that your techniques are inefficient,” she began.


    The wizards mumbled in protest. How dare this accountant lecture them on the art
    of casting spells? They threatened to transform her drink, a well-made and perfectly
    heated mug of tea, into oatmeal.


    “But there’s a solution!” Clare continued. “There’s a new technique, called `Big-O
    notation`, that will shift the tides. This notation tells you how a spell performs
    as the size of the battle increases, allowing you to know which spell is most
    efficient. You simply ask: how many steps does it take to cast a spell when facing
    `N` different enemies? Then you strip out all the constant factors and focus on
    just the parts that grow the fastest.”


    “For example,” Clare continued, “if a spell takes three steps to cast, regardless
    of the number of enemies, then it’s an `O(1)` spell—constant cost. In contrast,
    if you need a single step for each pair of enemies then the cost is `O(N²)`—quadratic
    cost. In a large battle, you want spells that will scale well.”


    The wizards grumbled in protest.


    “That would never work.”


    “It simplifies the problem too much.”


    “This accountant is crazy!”


    Clare was unfazed. “What’s your favorite spell?” she asked a wizard in the front
    row.


    He turned red at being singled out and mumbled, “The Spell of Pairwise Protection.”


    “Which does … ?” prompted Clare.


    “Well, if you cast it on an enemy and a friend, the friend is protected from that
    enemy for a full five minutes.”


    “How long does it take to cast?”


    “Two seconds. It’s a fast spell.”


    “But how well does it scale?” asked Clare.


    “Scale?” asked the wizard.


    “I mean: how does the performance change as you add more and more people to the
    battle?” explained Clare. “The performance of this spell depends on how many people
    are in the battle.”


    The wizard looked back blankly.


    Clare sighed. “When you’re in a large battle, you need to understand how the cost
    of using a spell increases as the number of people in the battle increases. Let’s
    take the Spell of Things Smelling Like Fish. You cast it once for each enemy in
    the battle and they smell rotting fish for the next half hour. One step for each
    enemy, so it’s an `O(N)` spell. It scales linearly with the number of enemies.”


    “In contrast,” Clare continued, “the Spell of Pairwise Protection requires you
    to cast it on each pair of friends and enemies. If there are `N` enemies and `M`
    friends, you need to cast it `M ⠮ N` times—one step for each pair. So the cost
    is `O(M ⠮ N)`. If you have a lot of friends, that’s going to take a while.”


    “Good thing Henry-doesn’t have many friends,” someone joked from the back row.
    A few muffled laughs followed. Clare ignored the comment.


    “The Spell of Things Smelling Like Fish takes 15 seconds to cast,” objected a
    wizard in the back row. “Your `Big-O notation` doesn’t capture that!”


    “You’re right,” admitted Clare. `Big-O notation` is only used to compare how spells
    scale as the size of the battle scales. This is where your strategy is lacking.
    You’re still accustomed to the simpler world of dueling, where the number of enemies
    is always one. You focus too much on the constant factors.”


    Clare continued, “At some size of battle, an `O(N²)` spell will always take much
    much longer than an `O(N)` spell. At some point, the constant factors don’t matter
    anymore. That’s the value of `Big-O notation`.”


    ![](images/00041.jpg


    The same wizard went back on the offensive. “Are you telling me that it’s better
    to cast the Spell of Loud Techno Music, which takes one hour and impacts all enemies,
    than the Spell of Temporary Elevator Music, which takes one minute but impacts
    only one enemy? It would seem that that is what your `Big-O notation` would recommend.”


    “Yes,” said Clare. “If there are more than 60 enemies, the Spell of Loud Techno
    Music is more efficient the Spell of Temporary Elevator Music.”


    The wizard was stunned. He repeated the math over and over in his head to check
    her answer. Clare knew that he would eventually come to the same result. Accountants
    were notoriously good with numbers.


    “What about the Spell of Love Triangles? That takes only one second to cast and
    the results are so much fun to watch,” argued another wizard.


    “You need to cast it on all triplets of people, so it’s `O(N³)` . If you have
    twenty opponents, that’s `20 ⠮ 20 ⠮ 20 = 8000` seconds! That’s over two hours!”
    The wizards gasped in unison.


    ### Detecting Curses with Recursion


    Recursion is a problem-solving technique that builds a solution to a problem from
    solutions to smaller subproblems of the same type. Most commonly, recursion is
    implemented as a function calling itself to solve the subproblems.


    * * *


    “Who has been cursed?” asked Ann. With a pang of fear, she looked around at the
    mob of people now surrounding her. The crowd seemed on edge.


    Ann had arrived in the small coastal town of Turington minutes before the mob
    descended. She had planned on passing through on her journey from the docks to
    the city of New Atlantis itself. Then, one of the town council members had recognized
    her and had started pleading for her help. Within minutes, a large mob had formed.
    All that Ann had managed to make out was that someone was cursed.


    “We don’t know!” cried twenty different townsfolk. They sounded angry at the question.

