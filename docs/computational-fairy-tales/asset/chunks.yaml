    “一个接一个，”安说道。她迅速转向镇议会议员。“你，只有你，告诉我问题出在哪里。”


    “我们听说你正肩负着王国从黑暗中拯救出来的使命。黑暗已经袭击了我们这儿。我们中有一个人中咒了！你必须帮助我们。”


    最后那句话听起来像是一个命令，而不是礼貌的请求。安不喜欢他的语气。一阵恼火闪过她的心头。


    “只有一个人中咒？”安问道，“这听起来完全不像是什么所谓的‘黑暗降临’。”


    人群并不买账安的评价。在一片嘈杂的嗡嗡声中，她能听到几句尖酸的讽刺话。随后，随着镇议会议员的发言，人们陷入了紧张的沉默。


    “这是一个非常可怕的诅咒，”他说，“难道你看出来它是具有传染性的吗？”


    “水肿？”安问道。她讨厌带水肿的诅咒。那不仅对受害者来说很痛苦，对周围的其他人来说也很不舒服。


    “当然不是。你看到水肿了吗？这是‘近距离焦虑之咒’（Curse of Proximal Angst）。”


    瞬间，安对整个情况豁然开朗。近距离焦虑之咒是一种特别恶毒且有效的诅咒。它利用了“坏苹果”理论：只有一个人中了咒，但它会影响特定半径内的所有人。仅仅是靠近那个人就会引起非理性的愤怒。


    “你不知道是谁中咒了？”安确认道。现在她知道了自己为什么生气，努力控制自己的愤怒。她深吸了一口气，等待着刻薄的回。


    议员也压制了自己的情绪。“我们试图弄清楚，但无济于。我们目前只排除了两个人：我和芬德利（Findley）。今天早些时候，我们去寻求帮助，愤怒就消失了。我们以为诅咒已经失效了，就回来了。它并没有失效。它还在这儿！”


    “你知道诅咒的半径吗？”安问道，保持注意力集中在事务上。


    “至少一英里，”议员回答。


    “我们可以让大家分散那么远吗？”安问。


    议员摇了摇头。“这里有 512 名村民。我们不能让每个人都隔至少一英里。没有空间。我们想过一个接一个把人送出去，但那样太慢了。”


    安沉默地思考了一会儿。“我们将使用**递归分治法**，”她宣布道。


    “那是什么？”议员问。


    “一个非常简单的算法，”安在来得及停止自己之前傲慢地说。


    “对不起，”她迅速道歉道。“我的意思是这是一个简单的算法。我们从全镇的一组开始。然后你们平均分成两组——每组一半的人。两组向相反的方向走半英里并等待一小时。”


    “这有什么帮助？”议员问。


    “一小时后，只有一组会生气。那组包含了中咒的人。一旦他们感觉好些了，另一组就可以回家了。”


    “这只排除了半个村，”人群中有人抗议道。


    “没错，”安继续道，“然后我们对剩下的小组递归地应用该算法。它再次分成二。两组分开，等待，然后得知哪一组包含中咒者。”


    议员点了点头。“我们可以继续递归搜索中咒者。每小时，我们都可以排除剩余村的一的人。”


    “没错，”安赞同道，“对于 512 个人，你需要九个小时。首先你排除 256 人，然后是 128 人，再是 64 人，然后是 32 人，再是 16 人，然后是
    8 人，4 人，2 人，最后是 1 人。你最后剩下那个中咒的人。”


    “我们要对那个人怎么办？”议员问。


    安再次思考。显然，中咒者需要解除咒语。安只知道一个她保证能做到那事的巫师。“把他或她送到一位可以解除咒语的巫师那里。马库斯巫师住在新雅典（New Athens）。他能够破咒。”


    安迅速补充道：“但中咒者必须快速找到他。我们不能让整个新雅典都遭受近距离焦虑的影响。事实上，我建议直接跑过新雅典的街道冲向马库斯的门口。如果人们不让路，就试着大喊‘我有传染水肿！’。或者在跑过时用肘用力撞开他们。”


    安意识到自己正在发牢，并闭了嘴。镇民们用混合着震惊和普遍焦虑的神情看着她。


    “快去吧，”安结束道。


    留下这个警告，安决定是时候离开图灵顿（Turington）了。她匆匆告了别。


    一小时和几英里后，安的大脑开始变得清醒。她意识到自己从未问过那个最基础的问题。为什么会有人中咒？图灵顿是一个小镇，以友好的渔民和安静但高效的闪闪卡作者闻名。那里几乎不是会中咒的地方。


    安短暂地考虑过回去，但她害怕再次感到那种焦虑。她服自己这并不重要，继续她的旅程。


    ![](img/00015.jpg)


    # 使用二分查找猎龙


    二分查找是一种在排序列表中高效查找目标值的算法。该算法维持一个不断缩小的搜索窗口。它通过反复排除剩余搜索空间的一半来缩小该窗口。在每一步中，你检查当前窗口的中间项，并将其与目标值进行比较。如果中间值小于目标值，就可以排除窗口的下部分；如果值大于目标值，就可以排除窗口的上部分。


    ***


    早晨的消息简直令人沮丧。弗雷德里克王醒来才十分钟，就决定今天会非常糟糕。事情开始得还算顺利，管家告诉他他最爱的皇冠正在擦拭，无法使用。然而，紧随其后的是代理首席骑士芬德利的报告，一条龙正恐扰着他的王国。


    “告诉我发生了什么，”王疲惫地命令道。他讨厌龙。


    “有一条龙，”芬德利宣布道。


    “你已经告诉我那个了。现在告诉我发生了什么。有人见过那条龙吗？它攻击过任何人吗？它已经出现了六周没人告诉我？”王促道。


    “我们收到了六次目击，先生。没有人受伤，但麦当农失去了他的奖牛。我想它今天早上刚出现的，先生。”


    “麦当农的牛？那头去年获得冠军的大牛？”王询问道。如果他记得没错，那是一头巨大的牛，是龙的完美目标。


    “是的，先生，”骑士回答道。


    王叹了口气。这个故事听起来像教科书式的龙攻击。很快龙就会吃掉王国一半的牛。“好吧，你最好带上猎龙人消灭那条龙。”


