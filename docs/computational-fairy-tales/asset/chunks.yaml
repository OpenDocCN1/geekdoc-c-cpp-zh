    The whole arrangement reminded Ann of her days as a young kindergartener when
    the students would be forced to hold hands as they went on field trips. Each kid
    would maintain contact with exactly two classmates, ensuring that the full string
    of students stayed completely connected. The teachers would walk down the line,
    carefully comparing the students to a list of names.


    But in Ann’s mind, the best thing about the kindergarten lines was their ability
    to be dynamic. In the event that Ann had to visit the restroom, she would leave
    the line by simply making sure that the students on either side of her held hands
    with each other. When she returned, she would pick a point to insert herself in
    the line, break the line at that point, and reform the connections by holding
    hands with her new neighbors. Since all such new arrivals often forgot to dry
    their hands, the process also included loud complaints from the new neighbors.
    These kindergarten lines had opened Ann’s eyes to the power of dynamic data structures.


    “Captain, do your convoys ever get additions or removals?” Ann asked one morning.
    “Or is the convoy fixed once it departs?”


    “Of course the convoy changes,” the captain answered. “In fact, later today we
    have three ships joining us from North Patagonia.” He gestured vaguely toward
    the direction of North Patagonia as if to illustrate his point.


    “Will they join the end of the line?” asked Ann, eager to understand the convoy’s
    dynamics. It would make sense to simply append the new ships to the end of the
    line. That way only the first ship of the new arrivals and the last ship of the
    current convoy would need to connect. That’s how they had merged lines in kindergarten.


    “No, no,” insisted the captain. “They’ll join between ships #4 and #5\. Ship #5
    is a special warship with extra rear-facing cannons. It has to be in the back.
    One by one the ships will insert themselves into the chain, coordinating through
    their pointers. Good sailors, those pointers.”


    “But how?” asked Ann.


    “All very simply, I assure you. The new ship, let’s call it `D`, will pull up
    next to our head ship and then slow down. It will slowly work its way down the
    convoy until it finds a location to insert itself: let’s say between ship `A`
    and ship `B`. Then the pointers are reassigned. `D`’s backward pointer now talks
    to `B`. `B`’s forward pointer now talks to `D`. `A`’s backward pointer now talks
    to `D`. And `D`’s forward pointer now talks to `A`. It’s all very organized.”


    Ann was thrilled. When the ships arrived that afternoon, she watched their coordinated
    dance with glee. The simplicity of it amazed her. Inserting a new ship into the
    line was only a matter of reassigning four pointers, two in each direction. In
    her excitement over the dynamic operations of the convoy, Ann even managed to
    forget about her seasickness.


