  raw: 'As Ann stared at the row of cards, her perception shifted. She no longer saw
    a line of eight cards; she saw an array with eight values. The image of a loop
    iterating over bins in an array filled her mind. Ann shook her head to clear it,
    but the image remained.


    The oracle continued to work. She carefully scooped up all eight cards and began
    sorting them.


    Ann tried to follow what the oracle was doing, but the computational images continued
    to intrude in her mind.


    “What are you doing? You just put those down,” asked Ann.


    The oracle looked up. “And now I’m sorting them,” she stated. “Each card has a
    number at the bottom. I’m putting them in order.” Her tone indicated that she
    didn’t want further interruptions.


    Ann watched the sorting with interest. The oracle used a classic merge sort, recursively
    dividing the pile of cards and then merging them back together. The motions were
    calm and practiced—almost soothing.


    The eight cards, now in sorted order, again formed an array on the ground. The
    oracle looked at each card in turn while she muttered to herself.


    ![](images/00053.jpg)


    Again, computational imagery flooded Ann’s mind. The oracle ceased to be a nasty
    old woman; instead she became a computer. The cards became an array on the ground.
    The sorting, pointing, and muttering were parts of an algorithm that Ann didn’t
    understand.


    For a brief moment everything seemed to fit in perfect harmony: algorithms, loops,
    and data structures. Even if she didn’t understand the algorithm, Ann was witnessing
    computation in action. She smiled.


    “You will succeed most of the time,” said the oracle, her raspy voice snapping
    Ann out of her stupor.


    “Excuse me?” asked Ann.


    “The answer,” replied the oracle. “You will succeed most of the time.”


    “What does that mean?” asked Ann.


    The oracle shrugged. “How am I supposed to know? I read the answers. I don’t always
    understand them. You asked me how you can stop the darkness and I tell you ‘You
    will succeed most of the time.’ That’s literally what these words say.” The oracle
    indicated the words printed on the card.


    “So you just picked eight random cards, sorted them, and read them off?” asked
    Ann.


    The oracle stared back without answering.


    “Well, that answer doesn’t help,” objected Ann. “How is that supposed to help?”


    “You asked the question, and I answered it. Now go away.”


    Despite a few attempts to argue, Ann was unable to get any more information. Eventually,
    the oracle grew tired of arguing and hobbled back to her house.


    Ann stood on top of the mountain, wondering what the message meant and, more importantly,
    what to do next.


    Big-O and Hitting Things with Hammers


    Big-O notation focuses on the (worst-case) performance of the algorithm as the
    size of the input grows. As such, it focuses on just the aspects of the running
    time that depend most on the size of the data. Constants are dropped from the
    Big-O notation.


    * * *


    “I’ve done it!” proclaimed Judd as he burst into the library. “I’ve done it!”


    Peter looked up from behind the counter. “Done what?” he asked. He tried to rub
    the sleep from his eyes.


    “I’ve revolutionized the art of making horseshoes,” stated Judd proudly.


    Judd was a blacksmith’s apprentice in Alexandria and a friend of Peter’s. Like
    all apprentices, he dreamed of making a major contribution to his field—advancing
    the state of the art. However, as Peter had found, revolutionizing one’s field
    was actually an exceedingly difficult task. His own attempts to improve library
    science had ended poorly and, in one particularly embarrassing case, resulted
    in a two-day hospital stay.


    “How?” asked Peter.


    “It’s very technical. What do you know about making horseshoes?” asked Judd.


    “Nothing,” admitted Peter. He was a librarian’s apprentice and had never even
    been to a forge. When he thought about it, he remembered having once used a hammer.
    He had been trying to either hang a picture or swat a fly. It was a long time
    ago, and details were fuzzy now.


    “The key is flattening the horseshoe. You have to hit it repeatedly with a hammer
    until it’s flat enough. It takes a lot of muscle.”


    Peter nodded politely. The description perfectly matched his mental image of blacksmiths
    pounding metal with large hammers.


    Encouraged, Judd continued, “The larger the horseshoe, the more you have to hit
    it. You need ten hits per inch on each pass. Ten hits! But the horseshoe also
    bulges around where you hit it. So you need to make more flattening passes on
    longer horseshoes. In fact, for each inch of horseshoe you need to make another
    pass over the whole thing. So if the horseshoe is N inches long, you need to swing
    the hammer 10 ∙N ∙ N times.”


    Judd paused, waiting for some reaction from Peter. After a moment, he added, “For
    a four-inch horseshoe, that’s 160 hits!”


    “Wow,” responded Peter. It seemed like the correct reaction, but Peter had no
    idea if that was a lot. After all, blacksmiths hit things all day long.


    “You know what I did?” prompted Judd.


    “What?” responded Peter with fake interest.


    “I found a way to do it in eight hits per inch,” Judd stated with a wide grin.


    “That’s it?” asked Peter. He didn’t mean to be rude, but saving two hits per inch
    didn’t seem like a big deal. It was only a constant factor.


    “That’s a lot,” responded Judd. He was obviously upset with Peter for not sharing
    his joyous moment.


    “It’s still an O(N ∙ N) process,” argued Peter. “Or more accurately it’s an O(N ∙ N ∙ K)
    process to make K horseshoes. I’m guessing that you make more than one horseshoe
    at a time, right?”


    “Huh?”


    It appeared that blacksmiths weren’t required to learn complexity theory. Peter
    switched tactics.


    “Why not form them in a mold?” asked Peter. “Then it would take O(K) time to make
    all of your horseshoes.”


    Judd looked aghast. “It takes hours to make a mold,” he protested.


    “So?” prompted Peter. “If you make enough horseshoes, it pays off in the long
    run. That’s the beauty of asymptotic complexity: if the problems get large enough
    the constant factors don’t matter and the process with the better asymptotic complexity
    wins.”


    Judd didn’t look convinced.


    “How long does it take to hit the horseshoe?” asked Peter.


    “Normally? Or when I’m in the zone?” asked Judd.


    “When you’re in the zone,” answered Peter.


    “Two seconds.”


    “And how long does it take you to build a mold? And cast a horseshoe in that mold?”


    “Maybe 15 minutes per inch to carve out the mold, and then 60 seconds to fill
    the whole mold,” answered Judd.


    “So to make K horseshoes of size N inches, it would take 2 ∙ 8 ∙N ∙ N ∙ K seconds
    with your new method. With a mold it would take 60 ∙K + 900 ∙ N seconds. Correct?”


    Judd squinted as he tried to confirm the math in his head. His lips moved and
    he waved his finger as though writing in the air. Peter almost offered him a pen
    and paper, but worried that this might be insulting.


    “So?” Judd asked finally. Peter was not sure if Judd had reached the same conclusion
    or simply given up.


    “In the long run it’s cheaper to use a mold,” answered Peter. “If you have to
    make 20 6-inch horseshoes (K= 20, N = 6), your method takes 11,520 seconds, and
    the mold takes 6,600 seconds. The mold is faster—a lot faster.”


    He waited for the look of joy to cross on Judd’s face. A simple analysis of computational
    complexity would save Judd vast amounts of time. But instead of happy, Judd looked
    angry.


    “Fine,” he said. “I guess I’ll just go make some molds then.”


    “What’s wrong with that?” asked Peter. “Are you upset that I quashed your revolutionary
    idea?”


    Judd shook his head. “No. It’s just … well, I really like hitting things with
    hammers.”


    Now Peter could see the problem with the mold idea.


    “Oh. Well, no one says that you have to use the most efficient algorithm. Computational
    complexity just helps you figure out what it is. You can still hit things with
    hammers, if you prefer.”


    The smile on Judd’s face told Peter that that had been the best news he had received
    all day.


