    “It’s a stack,” Ann said.


    “I can see that,” said Peter. “I helped stack them. Wouldn’t it help to organize
    them? It might be more efficient.”


    “You don’t understand. It’s a computational stack—a last-in, first-out data structure.
    It’s organized.”


    “How is that pile organized?” asked Peter in disbelief.


    “The most recently requested books are on top,” answered Ann. Then, after a moment,
    she set her pen down and turned her full attention to Peter. “Everyone has their
    own way of doing research. Some people like to try a bunch of different ideas
    at the same time. Some people jump around. I use depth-first search.”


    “What does depth-first search have to do with research?”


    “I keep going deeper and deeper into a subject until I hit a dead end. Then I
    backtrack and try something different. A stack is perfect for that type of research.


    “Consider the books that you just brought up: `On the Use of Dice for Selecting
    Random Numbers in the Range of 1 to 6` and `Advanced Probability for the Study
    of Garden Gnomes`. Both books are related to the topic that I read about a few
    minutes ago—the use of randomness in certain algorithms. So I decided to dig deeper
    into randomness. Next, I’ll take one of those two books off the top of the stack,
    read it, and possibly ask for other related books.


    “As I finish with books, I take them off the stack. This means that when I hit
    a dead end in one of my investigations, I find older books that are lower in the
    stack. My research automatically backtracks to earlier ideas.”


    Peter nodded intently. “What a great data structure!” he exclaimed. “It keeps
    your information organized exactly as you need it. It’s efficient, too! Inserting
    and removing books are both `O(1)` operations; you put new books on top and take
    books off the top. No need to sort anything. It’s amazing.”


    “I guess so,” Ann agreed. “For the record, the insertion operation is called `push`
    and the removal operation is called `pop`. You push data onto a stack and pop
    it off.”


    “Did you develop this data structure yourself?”


    Ann looked confused. “A stack of books? I doubt it. I’m quite confident that people
    have been putting books into piles for a long time.”


    “Oh, right.” Peter paused. “Why are you researching randomness, anyway?”


    ![](images/00022.jpg)![](images/00020.jpg)


    “I’m not sure,” Ann admitted. “I got the idea from this magic purse that I was
    given. It magically tracks how much money is in it.”


    Ann showed Peter the purse from Marcus. She took a dime out, and the counter decreased
    by `$0.10`.


    “What does that have to do with anything?” asked Peter.


    Ann shrugged. “Since I left on my journey, the value has slowly trended downward.
    During any given week it bounces up and down, but the long-term trend is the same.
    Something about that reminded me of randomized algorithms. They randomly explore
    different solutions, always trying to find something better.”


    Peter looked back and forth between Ann and the purse. “I still don’t get it.”


    “It’s a long shot,” admitted Ann. “But something about Clare’s message made me
    think of the purse. As I said, I keep following one idea deeper and deeper until
    I hit a dead end.”


    Peter looked down at the stack of books and shuffled uncomfortably. “But do you
    have time for that? For dead ends, I mean.”


    “I don’t know,” answered Ann honestly.


    “And what if you’re right?” asked Peter, sounding more worried.


    “We win,” answered Ann. “That would be a good thing.”


    “But the wizard will still be there. He’ll probably be a few feet away by the
    time you try your idea. Couldn’t he just cast a giant fireball at us?”


    “This wizard doesn’t really seem to be the fireball type,” offered Ann.


    “How about a different curse then? What about boils?”


    “I think I have an idea about that too,” Ann said. “If the `NP-hard` curse is
    as powerful as I think it is, he needs to use a lot of magic. As long as we can
    avoid being cursed by the first spell, we should be safe from any followup spells
    for a while.”


    “Are you sure?” asked Peter.


    “No. But all evidence seems to point that way.”


    Peter nodded to himself a few times. Then, reaching some internal conclusion,
    he turned and walked purposefully toward the library’s main doors.


    “Where are you going?” Ann asked. She wondered if she had managed to frighten
    him into running. Admittedly, fleeing in terror would actually be the safest course
    of action for him.


    “To make a new friend,” said Peter. “If your research works out and we avoid the
    curse and the wizard doesn’t have enough magic left to smite us with a fireball,
    then we could use some more help. And if your research doesn’t work out, I guess
    it doesn’t matter anyway.”


    After he left, Ann looked back at the stack of books. She tried to push all of
    those ‘ands’ out of her mind and focus on the research at hand. She still needed
    to figure out how to avoid being cursed in the first place. She carefully reached
    over and `pop` the next book of the stack.


    ## Expected Running Time


    The expected running time of an algorithm indicates how long an algorithm will
    take on average. This gives an indication of how the algorithm will perform on
    typical problems. However, unlike worst-case analysis, the expected running time
    can be optimistic for difficult instances.


    ***


    A wizard in a dark cloak stood at the foot of the stairs. In his right hand, he
    held a wooden staff carved with mathematical symbols. A large hood obscured his
    face.


    “Good morning. I am looking for Peter,” announced the wizard. He stopped at the
    foot of the steps.


    Peter didn’t answer. She stared at the wizard. “Excuse me. Are you Peter?” the
    wizard asked again as he started to approach. “I have a problem for which I need
    your help. I have been told that you are a great computational mind.”


    Peter’s grip tightened.


    “Ask me,” Ann said.


    The wizard paused and studied Ann for a moment. Then, he pulled back his hood.
    His face reminded Ann of any of the many tenured professors at her school. His
    gray hair barely covered his head and deep wrinkles adorned his face, but his
    eyes blazed intensely. He gave her a wicked smile. “Princess Ann? What a pleasant
    surprise. I had not expected to run into you so soon. Of course, I had hoped our
    paths would indeed cross.”


    “Are you going to ask me a question or not?” asked Ann.


    The wizard’s smile widened to consume his entire face. “Let’s talk about a little
    problem I call the traveling salesman problem. I need to find a fast, exact algorithm
    to solve that very problem on large graphs.” His voice was calm and almost soothing;
    it reminded Ann of countless lectures that had put her to sleep. As he spoke,
    his right hand began to wave his staff back and forth. A faint blue glow emanated
    from the top.


    “I was always partial to an algorithm that I learned in the sixth grade: randomized
    hill-climbing,” stated Ann.


    The wizard paused, looking confused. “Randomized hill-climbing?” he asked.


    “It’s quite simple,” explained Ann. “Start with a guess at the solution. Then
    start the optimization loop. At each step in the loop you:


    1.  Propose a small random change to your solution.

    2.  Check the new solution.

    3.  If the new solution is better, take it. If it isn’t better, then take it with
    some small probability. I like to roll two six-sided dice and take a bad move
    if I roll a double six.”

