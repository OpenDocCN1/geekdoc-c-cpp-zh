    “Use the rankings from last year’s cow competition!” cried the king, losing his
    patience. “It is a sorted list of the largest cows!”


    “Ah. Of course, sir. We’ll work down the list until we find the dragon!” confirmed
    the knight.


    The king nodded, relieved that the knight was finally thinking on his own. Sir
    Braver and the dragon hunter would visit each of the farms on the list, in order,
    and find the dragon. Even as he tried to comfort himself with this thought, warning
    bells went off in the king’s head.


    “Not down the list,” the king admonished. “Do you know anything about searching?”


    The knight looked confused. He had been certain that he was on the correct track.
    “But sir, I don’t understand,” he said.


    “How long does it take you to travel between farms?” asked the king.


    “A few hours, sir.”


    “How many farms are on the list?”


    “Maybe a hundred.”


    “That means it could take you hundreds of hours. By that time, the dragon will
    have eaten more cows. It might even have gone by then.”


    “But, sir—”


    “Use binary search,” commanded the king.


    “Binary search, sir?” asked Sir Braver, regretting having fallen asleep in his
    Algorithms for Knights class.


    “Start at the farm in the middle of the list and check whether the cow is still
    there. If it is still there, tear the list in half, throw away the bottom half,
    and repeat the process on the top half of the list. If, on the other hand, the
    middle cow is gone, tear the list in half, throw away the top half, and repeat
    the process on the bottom half of the list. Each time you visit a farm, tear the
    list in half and concentrate your search on only one of the two halves.”


    “But sir, that sounds complex,” protested Sir Braver.


    “It is not,” argued the king. “It is simple. If the cow in the middle of the list
    is still at its farm, then so are all the cows below it on the list. That is how
    dragons eat. It will not eat a smaller cow first. That would be absurd.


    “On the other hand, if the middle cow is missing, then so are all the cows above
    it on the list. Dragons do not eat cows randomly. There is an order to these things.”


    “What if the dragon moves while we search?” asked the knight.


    Finally, a reasonable question. “Your search effectively tracks two bounds: the
    smallest cow that you know has been eaten and the largest cow that you know has
    not been eaten. If you get to a point where those bounds are next to each other
    on the list, and you do not see a dragon, then proceed to the largest uneaten
    cow and wait there.”


    “But sir, how is that any faster than simply scanning down the list?” asked the
    knight.


    The king sighed again. His confidence in the knight’s ability to handle this task
    was eroding rapidly. “If the dragon has attacked 45 farms, how long will it take
    you to scan those farms? 90 hours? But in the case of binary search, after the
    first farm you will have ruled out 50 farms on the list—one way or another. After
    the second farm, you will have ruled out another 25. Each time, you are cutting
    the problem in half. In fact, you can find the dragon after checking only seven
    farms.”


    ![](images/00046.jpg)


    The knight nodded, yet looked unconvinced. “But sir, are you sure?”


    The king screamed. “Of course I am sure! I am the king! And, furthermore, every
    idiot knows that binary search is a logarithmic time algorithm while scanning
    down a list is a linear time algorithm. Now go and get that dragon!”


    For the first time in his long career as a knight, Sir Braver ran away. He told
    himself that he was running in order to carry out the king’s orders as quickly
    as possible. But in truth, the king looked really mad.


    As he watched his top knight clank noisily down the hall, the king decided that
    it was indeed time to go back to bed.


    # Why Tailors Use Insertion Sort


    Insertion sort is a simple, although potentially inefficient, algorithm for sorting
    an array of numbers. The algorithm iteratively sorts the beginning of the array,
    expanding the sorted range until the entire array is sorted.


    At the start of the `ith` iteration of the algorithm, the first `i` numbers in
    the array are in sorted order. The algorithm then takes the `i + 1^{th}` number
    in the array, finds the correct location to insert it in the sorted prefix, and
    inserts it (shifting the following numbers down). Thus, after this step, the first
    `i + 1` numbers in the array are sorted.


    ***


    “Insertion sort!” scoffed Peter. Only three months into his apprenticeship at
    the Library of Alexandria, Peter was already arrogant from the computational knowledge
    that he now wielded.


    “Who would ever use insertion sort?” Peter continued, working himself into a full
    rant. “It’s a quadratic algorithm—`O(N²)`! You need to learn the wonders of merge
    sort. I have the scroll right here.”


    “Oh,” remarked the shocked patron, hesitantly taking the scroll. “Thank you?”


    “What’s going on?” asked the head librarian as he returned from the stacks.


    “Your young apprentice was ‘educating’ me on the correct sorting algorithm to
    use in my shop,” explained the patron.


    “He’s using insertion sort,” added Peter mockingly.


    The librarian gave the patron a questioning look, but he didn’t burst into laughter
    as Peter expected.


    “I thought you came for a scroll about removing blackberry stains. It took me
    a while to find that one,” said the librarian. Blackberries were out of season
    and the librarian had had to go deep into the stacks to find the relevant scroll.


    The patron nodded. “While I was waiting, I explained to young Peter here how my
    tailoring shop works. He had some interesting questions about how I sort the jackets.”


    “Ah,” said the librarian. He knew the tailor well. “I think insertion sort makes
    sense in your case.”


    Peter was shocked. “What?” he screamed. He felt the blood rise to his face. How
    could anyone disagree with such a clear difference in computational complexity?
    That was almost as bad as cheering against the East Alexandria soccer team.


    The librarian looked sternly at Peter. Embarrassed, Peter looked down at the floor.


    “I don’t understand,” Peter added quietly.


    “Perhaps you should explain how your shop actually works,” suggested the librarian.


    “It’s simple,” explained the tailor. “The shop is small, so I only have a single
    rack for all my jackets. I like to keep them sorted by size, because it’s easier
    when patrons come in. I use binary search to quickly find a jacket in any size
    I need.”


    “That makes sense,” agreed Peter. Binary search was another one of Peter’s favorite
    algorithms for solving problems. At least the tailor used a reasonable search
    algorithm.


    “Each Monday, I get a new shipment of jackets, which I need to add to the rack.
    I start by putting them on the end of the rack so they won’t sit on the floor
    and get wrinkled. The new fabrics are finicky this year. I wish wool could have
    stayed in style a little longer.


    “Anyway, after I put them on the rack, I have `N` sorted jackets at one end and
    then `M` new, unsorted jackets after them. So I take each of the new jackets and
    insert it into the already sorted set of jackets. After inserting the first jacket,
    I have `N+1` sorted jackets and `M-1` unsorted jackets. I keep doing this until
    everything is inserted.”


    ![](images/00049.jpg)


    Before Insertion


    ![](images/00056.jpg)


    During Insertion


    ![](images/00038.jpg)


    After Insertion


    “But—” started Peter. The librarian cut him off.


    “I think what Peter wants to know is why you don’t take all the jackets off the
    rack and use something like merge sort,” said the librarian. “Other sorting algorithms
    can be faster.”


    “Because jackets are heavy,” explained the tailor. “It’s a pain to take them off
    the rack. It would be tiring. But the jackets do slide easily down the rack.”


    Peter looked confused. Why did it matter how hard it was to take things off the
    rack? This was an argument about computational complexity.

