- fmt: '

    “I think the factor that you’re missing is: when most people use insertion sort,
    the insertions are expensive,” the librarian explained to Peter. “Consider an
    accountant who’s trying to sort a list of accounts in one of his books. Each line
    is one account—like entries in a computer’s array. You can’t just insert something
    and have the rest shift down automatically. That would take a most tedious form
    of magic. Every time the accountant wants to do an insertion, he has to manually
    shift down everything below that. A single insertion is an expensive `O(N)` operation.
    That’s a lot of erasing and rewriting.


    “But, for a tailor, the insertion is a simple `O(1)` operation. He pushes the
    coats down,” added the librarian.


    Peter nodded an acknowledgement. Inside he chafed at the technicalities of the
    physical world impacting the cost of different operations. The theoretical world
    was so much cleaner. However, he did agree with the librarian and the tailor;
    in this case, insertion sort seemed reasonable. He wondered what other real-world
    applications might challenge his computational assumptions.


    Later that day, Peter tried using insertion sort on several carts’ worth of books.
    Unfortunately, the books didn’t move easily between the carts’ shelves, and Peter
    found himself spending the entire night shifting books between shelves. It took
    him an extra three hours to finish the sorting. He left the library at 2 a.m.,
    angry at himself for not determining the cost of the insertion operation before
    he started sorting.


    ### Bullies and Bubble Sort


    Bubble sort is another simple sorting algorithm. The algorithm repeatedly passes
    through an array, swapping adjacent elements if they are out of order. As a result,
    larger elements “bubble” up to the end of the array, while smaller numbers “sink”
    down. This process continues until the array is sorted. Like insertion sort, bubble
    sort’s worst-case performance is `O(N²)`.


    ***


    Peter had been in line for two hours when he felt the tap on his shoulder. He
    felt a pang of fear as he looked behind him. Terrible `Todd` glared angrily back.
    Then again, Terrible Todd always looked angry to Peter.


    Terrible Todd was best known for his recent performance at the annual Alexandria-area
    rock-throwing contest. He had been the first candlemaker’s apprentice ever to
    win the main event. His winning throw had used a two-hundred-pound rock, and the
    reverberation could be felt two miles away.


    Unofficially, he was also known for being a bully.


    “Hi Todd,” Peter greeted him. His voice came out small, betraying his fear.


    Todd grunted back and motioned Peter out of the way. With a strange burst of courage,
    Peter held firm. He refused to give up his place in line. Season ticket sales
    for the East Alexandria soccer team started in an hour. This year Peter was determined
    to get premium season tickets. He had his heart set on midfield.


    “I’m sorry, Todd. I was here first,” Peter explained.


    Todd looked Peter up and down. Then, with a louder grunt, Todd picked Peter up,
    turned, and set him down behind himself.


    ![](images/00075.jpg)


    ”Hey!” Peter cried, but Todd was already tapping the shoulder of the next person
    in line. Peter briefly considered tapping Todd on the shoulder and confronting
    him, but he quickly discarded that idea. Peter had seen Todd’s winning throw.


    Peter fumed. This wasn’t fair. Why should Todd get to go in front? There were
    principles to these things.


    As Peter ranted silently in his own head, he watched Todd slowly work his way
    up the line. One person at a time, Todd swapped places with smaller people. Todd’s
    advance halted only when he reached Wren, the muscular blacksmith.


    Then Peter felt another tap on his shoulder. Turning, he saw Big Jim. With a sigh,
    Peter stepped to the side and let Jim go ahead of him. Like Todd, Big Jim worked
    his way forward through the line. To Peter’s pleasure, Jim even moved in front
    of Todd to take the spot behind Wren.


    Now Tiny Mike stood behind Peter. Peter tried to glare at Tiny Mike, making it
    clear that Mike wasn’t moving ahead. Mike didn’t even try.


    ![](images/00065.jpg)


    This process continued for the next hour. Every time a larger person found himself
    waiting behind a smaller person, there was a tap on the shoulder and a switching
    of positions. Each time Peter moved back in the line, he felt a little more demoralized.
    Due to his small size, Peter found himself unable to swap with anyone. By the
    end of the hour the entire line was sorted by size, with Peter near the back.
    Discouraged, Peter left the line and returned to the library.


    ![](images/00044.jpg)


    As Peter sulked behind the library’s counter, he remembered that this year tickets
    were also available by pigeon message. He hurriedly filled out the form, requesting
    “Best Available.” He borrowed one of the library’s pigeons for the job. The pigeon
    flapped away, carrying Peter’s only hope for reasonable seats.


    Ten minutes later, the pigeon returned with a confirmation of second-row, midfield
    seats. Peter was thrilled. The seat was close to the action and in his favorite
    peanut vendor’s section. He must have purchased his tickets before even Big Jim.


    That day Peter learned two important lessons. First, bubble sort is great for
    bullies. Second, standing in line isn’t worth it in the age of near-instantaneous
    pigeon-based ordering.


    ### Merge Sort and Lines of Kindergarteners


    Merge sort is a recursive sorting algorithm based on two intuitive principles:


    1. It is easy to sort very short lists. In fact, it is trivial to sort lists containing
    only one item.

    2. It is easier to merge together two sorted lists than to sort a long list.


    Using those ideas, the merge sort algorithm can be described simply: “Break the
    data in half, sort each half separately, and merge the halves back into a sorted
    list.” The algorithm is efficient, requiring `O(N log N)` time.


    ***


    As Ann continued along the coast toward the city of New Atlantis, she saw a long
    convoy of ships departing the harbor. She could see the pointers coordinating
    the convoy’s formation with their bright flags, and she again thought back to
    her first exposure to linked lists in kindergarten. From there, her mind flashed
    back to other kindergarten memories. She remembered her first game of hopscotch,
    the annual kindergarten exam, and the small crabapple tree in the playground.
    Then, of course, her mind drifted to her teacher.


    Ann’s kindergarten teacher, Mage, was fiercely competitive. She insisted that
    the class excel in everything. Her class always had the highest test scores. Her
    class always won at dodgeball. And, most important of all, her class could form
    a sorted line faster than any other class in the kingdom.


    It didn’t matter how the class was to be sorted. Mage would call out an attribute,
    and the class would spring into action. The kids could line up by height, by first
    name, by last name, by length of their left pinky toe, or even by their skill
    at dodgeball. Truthfully, though, Mage avoided sorting by skill in dodgeball,
    since it often led to heated disagreements and, on at least three occasions, resulted
    in impromptu one-on-one dodgeball matches.


    Like all winning teams, her class’s excellence depended on more than natural talent.
    In fact, most kindergarteners in the class were absolutely dreadful at sorting
    when they started school. Once, two students, Jack and Jake, had spent fifteen
    minutes trying to decide which of their names came first in alphabetical order.


    The class’s ability came from practice. Mage drilled the class for hours at the
    start of the year. Every time the students went to the bathroom or to lunch, she
    would first make them line up in some sorted order.


    Of course, Mage also had a strategy—merge sort. It was her secret weapon, her
    key to winning.

