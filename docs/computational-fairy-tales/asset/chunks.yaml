    who was trying to plunge the kingdom into a computational dark age. Marcus is
    still traveling around and undoing the damage.”


    “You did well,” the king declared. “I am very proud of you. Welcome home, Ann.”


    “Thank you” was all that Ann could manage. A small doubt continued to nag at her.
    She tried to push it down and bask in her success, but it refused to be quiet.


    King Fredrick noticed the look on her face. “What is wrong? You succeeded.”


    “I know,” answered Ann. “It’s just …” She trailed off.


