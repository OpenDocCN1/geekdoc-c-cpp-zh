    安报以轻蔑的微笑。“看来你低估了我所能运用的整个计算分析领域。存在一个算法与概率相汇的新分析世界。你的诅咒在那里毫无威力。”


    “你必须成为`heuristic algorithms`和`expected running times`领域的世界级专家，这个咒才会失效，”巫师抗议道，“你是怎么知道的？”


    “我一路上发现了一些线索，”安说道。


    “这还没完！”巫师大喊道。


    他转身想要离开——却发现“可怕的托德”挡住了他的退路。那个蜡烛匠学徒咯咧笑着，抓住巫师的双臂将他提了起来。安确信自己可以扣留巫师一两天，直到马库斯和加尔温爵到达。而且显然，不需要担心托德会成为`NP-hard`诅咒的受害者。


    “是的，结束了，”彼得从安身后探头喊道。然后他小声地嘟囔道，“放弃我的季票完全值了。”他听起来像是在努力说服自己。


    巫师转过身看向安。“我只是开始，”他宣称道。


    “什么的开始？”安问道。


    老巫师笑了起来。“混沌将吞噬整个王国。计算基础将崩塌。那是一个新的黑暗时代。”


    “为什么？”安问道。


    “当然，是接管的第一步，”巫师简单地说。这种直率让安措手不及。他继续道：“你认为你的计算规则会永远持续吗？我只是开始。即使你从我的咒中救了王国的计算思想者，你认为你准备好迎接未来的挑战了吗？”


    ## 回家


    在远征阻止黑暗一年后，安回到了城堡。号角宣告了她的到来，旗帜在每个旗杆上飘扬，一全副荣誉卫队在她的旁列队。城堡准备了英雄式的欢迎。一年前，安会为这种庆祝感到欣喜不已。而现在，她只想睡觉。


    安直接走向王座厅。她的父亲独自等在那里。当她进入房间时，他露出了自豪的微笑。


    “我阻止了黑暗，”安宣布道，“或者说，我阻止了那个试图让王国陷入计算黑暗时代的巫师。马库斯仍在到处旅行修复造成的损害。”


    “你做得很好，”国王宣布道，“我为你感到骄傲。欢迎回家，安。”


    “谢谢，”这是安能说出的全部。一小怀疑继续困扰着她。她试图压抑它并沉浸在成功中，但它拒绝安静。


    弗雷德里克国王注意到了她脸上的表情。“怎么了？你成功了。”


    “我知道，”安回答道，“只是……”她声音小了下去。


    她的父亲等她说完。


    “如果我没有成功呢？”安问道，让洪水般的怀疑倾而出。“我离失败只有一步之遥。我不确定为什么这次任务必须是我。我完全没有准备好。”


    她的父亲沉默地看着她。片刻后，他开口了。“这就是为什么必须是你；因为你必须学习。准确地说，预言者说必须由我挑选的人独自出征。我相信你可以利用这段经验。而且，无论如何，你在预言期间根本没有在听。”


    安对这个发现感到震惊。“如果我失败了呢？”


    “我对你有信心，”他平静地说，“有些事情必须通过实践和应用来学习。仅仅阅读关于任务的概念是不够的；你必须出去应用它们。你必须通过试错来实验这些技术。”


    安看起来并不被说服。


    国王变得严肃起来。“听好，安。当你登上王位时，总会有新的挑战。有些会更容易，有些会更难，但你必须面对所有挑战。王国的命运将一次又一次取决于你。”


    她点了点头，但怀疑继续侵蚀着她。“如果我处理不了怎么办？如果我不够聪明怎么办？”


    “有些基础知识你已经有了；其他的，你将会学习。继续学习如何应用它们取决于你。”


    安带着不安的情绪离开了王座厅。她在家里是安全的。她完成了任务；她拯救了王国，使其没有陷入计算黑暗时代。”'
