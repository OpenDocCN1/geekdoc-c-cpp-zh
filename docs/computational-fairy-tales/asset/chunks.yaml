    to make sense of Marcus’s statement.


    “They protest by changing color to blue. Roses are supposed to be red. You have
    probably heard all of the poems to that effect, ‘Roses are red’ and such. But
    these roses insist on telling me how long they have had to ‘suffer’ without rain.”
    Marcus gestured angrily at the roses as he spoke.


    “They talk to you?” The deliveryman took a step away from Marcus.


    “Of course not. They simply change color.”


    “What does color have to do with when it rained?”


    “Well,” started Marcus. “they used to all change color together after three days
    without rain—a sort of mass protest. Then they started to organize. They want
    to let me know exactly how unhappy they are. So now they count the days.”


    “Only two are blue,” observed the deliveryman. “It hasn’t rained all week.”


    “Nine days, to be exact,” corrected Marcus after looking at the flowers. “They
    use binary.”


    “Huh?”


    “Red flowers are zero and blue flowers are one,” Marcus added.


    That explanation did not help. In fact, it seemed to further confuse the deliveryman.
    However, on the positive side, he no longer looked as though he wanted to run
    away.


    “Binary?” prompted Marcus. “Each flower represents a different digit, and thus
    a different power of two. The rightmost flower means one (2⁰), the one next to
    it means two (2¹), the one next to that means four (2²), and so forth. Add up
    the numbers represented by the blue flowers and you get the total number of days.
    Right now only the first (2⁰ = 1) and fourth (2³ = 8) flowers are blue, so it’s
    been 2⁰ + 2³ = 1 + 8 = 9 days.”


    The deliveryman looked. Sure enough, the five flowers across Marcus’s porch were:
    Red Blue Red Red Blue (or 01001).


    ![](images/00045.jpg)


    “Why do they use binary?” asked the deliveryman.


    “They tried to spell out the numbers on their petals, and they got too confused.
    So they had to settle for each flower being either all red or all blue. It turns
    out that flowers aren’t that smart. Binary is a simple enough system for them.
    If they were smart enough for anything else, do you think they would be complaining
    to me about the rain? There’s nothing I can do about it!” Marcus shouted the last
    part directly at the flowers.


    “But how do they work together?” The more absurd the story got, the more interested
    the deliveryman became. He leaned in toward the flowers.


    “It’s really quite simple for them to count in binary,” started Marcus. “When
    it rains, they’re all happy and turn red. They effectively reset the counter to
    00000\. I like those days a lot.


    “Then, each morning all of the flowers wake up and decide what color they’ll be
    for the whole day. If it hasn’t rained, they increase the count.


    After 1 day: Red Red Red Red Blue (00001 = 1)


    After 2 days: Red Red Red Blue Red (00010 = 2)


    After 3 days: Red Red Red Blue Blue (00011 = 2 + 1 = 3)


    After 4 days: Red Red Blue Red Red (00100 = 4)


    After 5 days: Red Red Blue Red Blue (00101 = 4 + 1 = 5)


    and so on.


    “You see, each flower looks to its right in order to decide what to do. If its
    right-hand neighbor changes from blue to red (1 to 0), then the flower flips its
    own color. A blue flower changes to red, and a red flower changes to blue. This
    keeps happening until one of the flowers doesn’t change from blue to red.”


    “What about the right-most flower?” asked the deliveryman. “How does it know what
    to do?”


    “Ah. That one is the instigator! I’m sure he’s the one that started it. Every
    morning there’s no rain, he flips. He’s the one that starts the process off. Red
    to blue to red to blue.”


    The deliveryman thought about it. “Why does a flower only change when its neighbor
    flips from blue to red?”


    “Think about it the way that you would count with numbers 0-9\. When you hit 9,
    you can’t go any further with that digit. So you increase the next digit by one
    and roll the current digit back to 0\. It’s like going from 19 to 20 or from 29
    to 30\. Only here there are exactly two options for each digit, 0 and 1, so things
    roll over more frequently.”


    ![](images/00068.jpg)


    “That system always works?” interrupted the deliveryman.


    Marcus tore his attention away from the right-most flower. He suddenly wondered
    how the discussion had gone from a rant about magic flowers to counting in binary.
    Did the deliveryman not have any other deliveries? For that matter, where was
    the delivery for Marcus?


    “Yes. They’ve already counted out nine days, haven’t they?” answered Marcus flippantly.


    Then, seeing the look of interest on the deliveryman’s face, Marcus returned to
    his teaching tone. “Consider what happens if doesn’t rain tomorrow. The first
    flower will switch from blue to red, so the second flower will switch from red
    to blue. The count will go from 01001 = 9 to 01010 = 10.”


    The deliveryman looked impressed. Marcus couldn’t understand why. The flowers
    were really annoying.


    The Importance of (Variable) Names


    Writing ‘readable’ code is vital to the long-term usability of the code. Code
    that is clearly written is easy to understand (both for the original programmer
    and for future users), easier to maintain, and easier to check for mistakes. One
    important aspect of readable code is the use of clear, meaningful variable names.
    Using meaningful variable names can greatly improve the understandability of code.


    * * *


    By the time Princess Ann reached the northernmost outpost within the kingdom,
    she was losing hope. Her father, King Fredrick, had sent her on a quest to save
    the kingdom from impending darkness weeks ago. So far, Ann had found nothing.


    The outpost of Garroow had been hit particularly hard by the chaos. The frequency
    of goblin attacks had increased in recent weeks. The commander, Sir Aat, had sent
    word to Ann’s father that the outpost desperately needed reinforcements. At a
    loss for better stops on her quest, Princess Ann headed north to Garroow. While
    there she also hoped to consult with the world’s second-most expert in loops,
    Dr. Whileton.


    Ann found the situation in Garroow worse than she had expected. First off, Dr. Whileton
    had left for Guelph to start an “important collaboration” with another loop scholar.
    Nobody could provide details on the project or the timing of his return. Second,
    and perhaps more importantly, the outpost itself teetered on the verge of collapse.


    During her first night at the outpost, a small goblin attack almost overwhelmed
    it. The fifty-person garrison barely held off three relatively tired goblins.
    She heard the captain shouting orders at his soldiers:


    “Ut, guard the south wall. No, I meant Ot. Ut, stay where you are.


    “Drex—no, I mean Dex—swap places with Plex. We need an archer on the wall, not
    a blacksmith.


    “Et, secure that door.”


    Eventually, the soldiers repelled the attack and put out the fires. However, the
    lingering feeling of chaos and confusion continued to bother Ann. It worried her
    that the garrison’s response had been so disorganized. It was like watching her
    father’s turtle Fido try to chase its own tail. The problem wasn’t the number
    of soldiers in Garroow, but rather how they were being commanded.'
