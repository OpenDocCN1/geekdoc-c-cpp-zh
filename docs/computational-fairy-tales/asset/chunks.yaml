  trans: '


    在听到“排队！”的指令时，班级分成两个大小尽可能相等的组。


    ![](img/00021.jpg)


    ### 排序前的班级

    ![](img/00032.jpg)


    ### 第一次划分

    随后，这些小组各分成两个更小的组。


    ![](img/00066.jpg)

    ![](img/00062.jpg)


    划分一直持续（递归地），直到每个小组只包含一个人。


    然后，各小组按照它们划分的顺序重新合并。合并从每对学生开始，他们会合并回之前的双人小组。每个孩子都看着自己的伙伴，快速地按顺序排好。只有两个人时，这很容易。只需快速比较一次就能确定顺序。


    ![](img/00011.jpg)


    当两个人的小组排好顺序后，孩子们合并成更大的小组。同样，合并非常简单——你只需要比较两排队伍最前面的两个孩子。数值最小的孩子必然是前两个孩子之一，因为队伍已经是排序好序的。或者，正如梅奇夫人所说：“如果你不在队伍的最前面，你就不能排在后面。所以站好，等轮你了！”


    前两个孩子进行比较，其中一个向前一步，开始形成新的有序队伍。


    ![](img/00012.jpg)


    ### 合并步骤 1

    然后，第二小的一个仍然必须是前两个孩子之一。依此类推。


    ![](img/00074.jpg)


    ### 合并步骤 2

    ![](img/00014.jpg)


    ### 合并步骤 3

    ![](img/00001.jpg)


    ### 合并步骤 4

    ![](img/00047.jpg)


    ### 合并步骤 5

    队伍迅速合并在一起，形成更大的小组。每一个合并步骤都有效地撤销了之前的某轮划分，按排序顺序重新形成小组。这个过程一直持续，直到整个班级都排序完毕。


    这就是梅奇夫人的班级赢得第六届年度排序锦标赛的原因。他们的班比亚军整整提前五分钟就完成了排序。事实上，当弗里尔先生的五年级学生还在比较右臂上的雀斑数量时，梅奇夫人的冠军们已经去午餐了。


    ## 流感爆发期间的排序

    在选择算法时，理解其应用背景背景至关重要。算法的计算复杂度只告诉了部分情况。其他需要考虑的因素包括数据规模、其他限制的存在以及可以利用的额外问题结构。例如，对于已经几乎处于正确顺序的极小量数据，冒泡排序是一个合理的选择的算法。


    ***


    多年来，梅奇夫人的幼儿园班赢得了王国内的每一场排序比赛。持续练习与归并排序算法的强大组合让他们无所不能。这所班级每周都在打破记录。很快，梅奇夫人不再满足于胜利；她的班级必须在比竞争对手少一半的时间内完成排序。唯一的真正胜利是完全的压制。


    很快，梅奇夫人对她班级的能力过于自信了。她坚信她的学生无论什么情况下都能获胜，并且在向她遇到的每个人解释这一点时也毫无压力。


    接着，在 1 月，流感袭袭了。梅奇夫人的班级几乎所有学生都请假了，只剩下三个学生。就在这种情况下，沃拉斯先生向她挑战了一场排序比赛。他也有三个健康的学生，所以两个班级实力均敌。但他的二年级班级只理解低级的冒泡排序技术。他的搜索可能耗时
    `O(N²)`！


    梅奇夫人甚至同意让孩子们根据某种简单的东西进行排序。经过片刻的思考，沃拉斯先生提议用鞋码。


    裁判一喊出“开始”，梅奇夫人的班级就分成两组。一组有两个学生，另一组只有一个学生。归并排序开始了。


    相比之下，沃拉斯的学生们互相看着。比利和苏在脑中进行了一次快速的比较并交换了位置。现在三个人都处于正确的顺序上。


    “不！”梅奇夫人意识到发生了什么时哀叫道。


    已经太晚了。比赛结束了。


    ## 神谕的数组

    算法和数据结构结合使用以创建复杂的程序。例如，算法的某一步可能会排序数组的内容，或者算法可能会在二叉搜索树中搜索值。


    ***


    “神谕会有信息的，”安在攀爬狭窄的山路时对自己说。神谕住在新亚特兰蒂斯较高的山峰之一的顶上。安已经爬了八小时。


    安责备自己没有早早咨询神谕。虽然她可以归咎于漫长的航海或险恶的山路，但安知道真相。她害怕面对神谕。根据传说，神谕时而疯狂时而刻薄。在到达新亚特兰蒂斯后，安在寻求神谕之前几乎和了一百个人。


    当安转过最后一个转角时，她看到神谕坐在路边的椅子上等待。老人冷冷地看着她。安试图隐藏自己的恐惧。


    片刻后安恢复了。“神谕大人，我来向您询问信息。”


    “你想知道关于即将到来的黑暗吗？”神谕问。她的声音沙哑，语气傲慢。


    “你见过它了？”安问。


    “没有，”神谕回答道，“目标显而易见。你父亲已经咨询了王国里的每一位预言者。当然，除了我。”


    神谕盯着安。她的表情混合着愤怒和厌恶。


    神谕似乎没有注意到这句话。


    “我现在为什么要帮你？”


    安深吸了一气，开始辩论。“黑暗将威胁所有的王国。世界的命运取决于……”


    “噢，你练习了一段演讲，”神谕大笑起来，“我最喜欢他们练习了。你学会跳舞了吗？”


    安大吃眼镜。“你说什么？”


    神谕啐了一口，“哈！你觉得我是第一次听‘请拯救世界’的演讲吗？”


    “神谕大人——”安开口，但被神谕可怕的笑声打断了。


    分钟后，神谕平静下来。“你想知道什么？”神谕问。笑容消失了，她恢复到厌恶地盯着安。


    “你会……帮我吗？”安被这种互动彻底搞懵了。


    “你听过我说的话？”神谕问，“我听过这个演讲一千次了。这意味着你不得到信息是不离开的。而我想让你尽快离开。”


    “噢，”安说。


    “你想知道什么？”神谕再次问道。


    “我想知道关于黑暗，”安说。


    “我不蠢。那部分涵盖过了，”神谕回答道，“你想知道关于黑暗的什么？是什么？如何停止？是否有喜欢的诗人？我只回答你一个。”


    安立即回答。“我想知道如何停止黑暗。”


    神谕看起来很失望，但点了点头。她从椅子移到地板上开始工作。首先，她拿出一大叠牌牌并洗了牌。然后她开始在地面上铺开牌，八张牌排成一行。每张牌上都印着一种安不知道的语言的单词、一种亮圈的排列，以及底部的一个数字。其中一张牌除了数字
    `999` 之外。


    ![](img/00069.jpg)


    神谕动作的节奏让安着迷了。“当地上没有八张牌时，在队伍里增加另一张牌，”安低声自语，将神谕的动作描述为一个循环。她完全不知道自己为什么会那样说。


    '
