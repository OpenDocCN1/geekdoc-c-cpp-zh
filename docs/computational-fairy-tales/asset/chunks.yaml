    pick them? Telepathy?”


    “When I first started, I kept the frequently read scrolls in my cache. Every time
    someone read a scroll, I would note that. I kept a count for each scroll.”


    “I see why that would work,” said the apprentice, sounding slightly bored.


    “Aha! But it didn’t work!” exclaimed the librarian. “Remember that massive flood
    we had two years ago? During the entire flood, I still had three scrolls on how
    to survive a drought. It was a disaster.”


    “Then I had a new idea,” he continued. “I could keep more data and use statistics.
    I meticulously kept track of which scrolls people viewing and correlated it to
