    Yet the deliveryman didn’t continue toward the door. He stood transfixed, staring
    at the flowers. After two minutes, Marcus went outside to see if there was a problem.


    “Your flowers have changed since yesterday,” observed the deliveryman. “I’m sure
    the one on the right was red yesterday. Today it’s blue.”


    “Those are the same flowers,” responded Marcus. “Some of them are sulking today.
    Stupid flowers.”


    “Sulking? Do flowers sulk?” the deliveryman asked.


    “Actually, it’s more of a protest,” clarified Marcus. “They are, of course, magic.
    They protest whenever it doesn’t rain. It’s quite aggravating, really. I water
    them every day, yet they still insist on sulking.”


    “Huh?” The deliveryman looked back and forth between Marcus and the flowers, trying
    to make sense of Marcus’s statement.


    “They protest by changing color to blue. Roses are supposed to be red. You have
    probably heard all of the poems to that effect, ‘Roses are red’ and such. But
    these roses insist on telling me how long they have had to ‘suffer’ without rain.”
    Marcus gestured angrily at the roses as he spoke.


    “They talk to you?” The deliveryman took a step away from Marcus.


    “Of course not. They simply change color.”


    “What does color have to do with when it rained?”


    “Well,” started Marcus. “they used to all change color together after three days
    without rain—a sort of mass protest. Then they started to organize. They want
    to let me know exactly how unhappy they are. So now they count the days.”


    “Only two are blue,” observed the deliveryman. “It hasn’t rained all week.”


    “Nine days, to be exact,” corrected Marcus after looking at the flowers. “They
    use binary.”


    “Red flowers are zero and blue flowers are one,” Marcus added. That explanation
    did not help. In fact, it seemed to further confuse the deliveryman. However,
    on the positive side, he no longer looked as though he wanted to run away.


    “Binary?” prompted Marcus. “Each flower represents a different digit, and thus
    a different power of two. The rightmost flower means one (`2⁰`), the one next
    to it means two (`2¹`), the one next to that means four (`2²`), and so forth.
    Add up the numbers represented by the blue flowers and you get the total number
    of days. Right now only the first (`2⁰ = 1`) and fourth (`2³ = 8`) flowers are
    blue, so it’s been `2⁰ + 2³ = 1 + 8 = 9` days.”


    The deliveryman looked. Sure enough, the five flowers across Marcus’s porch were:
    Red Blue Red Red Blue (or `01001`).


    ![](images/00045.jpg)


    “Why do they use binary?” asked the deliveryman.


    “They tried to spell out the numbers on their petals, and they got too confused.
    So they had to settle for each flower being either all red or all blue. It turns
    out that flowers aren’t that smart. Binary is a simple enough system for them.
    If they were smart enough for anything else, do you think they would be complaining
    to me about the rain? There’s nothing I can do about it!” Marcus shouted the last
    part directly at the flowers.


    “But how do they work together?” The more absurd the story got, the more interested
    the deliveryman became. He leaned in toward the flowers.


    “It’s really quite simple for them to count in binary,” started Marcus. “When
    it rains, they’re all happy and turn red. They effectively reset the counter to
    `00000`. I like those days a lot.


    Then, each morning all of the flowers wake up and decide what color they’ll be
    for the whole day. If it hasn’t rained, they increase the count.


    After 1 day: Red Red Red Red Blue (`00001 = 1`)

    After 2 days: Red Red Red Blue Red (`00010 = 2`)

    After 3 days: Red Red Red Blue Blue (`00011 = 2 + 1 = 3`)

    After 4 days: Red Red Blue Red Red (`00100 = 4`)

    After 5 days: Red Red Blue Red Blue (`00101 = 4 + 1 = 5`)

    and so on.


    “You see, each flower looks to its right in order to decide what to do. If its
    right-hand neighbor changes from blue to red (`1` to `0`), then the flower flips
    its own color. A blue flower changes to red, and a red flower changes to blue.
    This keeps happening until one of the flowers doesn’t change from blue to red.”


    “What about the right-most flower?” asked the deliveryman. “How does it know what
    to do?”


    “Ah. That one is the instigator! I’m sure he’s the one that started it. Every
    morning there’s no rain, he flips. He’s the one that starts the process off. Red
    to blue to red to blue.”


    The deliveryman thought about it. “Why does a flower only change when its neighbor
    flips from blue to red?”


    “Think about it the way that you would count with numbers `0-9`. When you hit
    `9`, you can’t go any further with that digit. So you increase the next digit
    by one and roll the current digit back to `0`. It’s like going from `19` to `20`
    or from `29` to `30`.”


    ![](images/0068.jpg)


    ## Importance of (Variable) Names


    Writing ‘readable’ code is vital to the long-term usability of the code. Code
    that is clearly written is easy to understand (both for the original programmer
    and for future users), easier to maintain, and easier to check for mistakes. One
    important aspect of readable code is the use of clear, meaningful names. Using
    meaningful names can greatly improve the understandability of code.

