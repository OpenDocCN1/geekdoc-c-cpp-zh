    Returning Home


    One year after she ventured forth to stop the darkness, Ann returned home to the
    castle. Trumpets announced her arrival, banners flew from every post, and a full
    honor guard lined her path. The castle had prepared a hero’s welcome. A year ago,
    Ann would have been thrilled at this celebration. Now, she just wanted to sleep.


