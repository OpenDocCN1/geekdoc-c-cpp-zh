    Edgar gave her a strange look. “Anyway, we do the same thing here: update the
    neighbors’ distances. The inn has three neighboring islands to consider: the library
    (which is already visited), the dry cleaner’s, and the brewery. We update the
    proposed distance of the dry cleaner’s to 20 meters—5 from the library to the
    inn and 15 from the inn to the dry cleaner’s. And we update the proposed distance
    of the brewery to 12 meters—5 from the library to the inn and 7 from the inn to
    the brewery.


    ![](images/00042.jpg)


    “We again proceed to the closest unvisited node. This time it’s the brewery,”
    Edgar explained. “We repeat the process there, updating the neighbors.


    “Then, on to City Hall! Here things get interesting. It’s a good race from the
    brewery to City Hall.” Edgar made driving motions with his hands as he explained
    this. “Also, on the algorithmic side, the distance from the library to the dry
    cleaner’s is shorter if we go via the inn instead of via City Hall. So we don’t
    update the distance to the dry cleaner’s in this case, because we’ve already found
    a shorter path.


    ![](images/00055.jpg)


    “And so forth,” he concluded with a wave of his hand.


    ![](images/00048.jpg)


    “I understand that part,” said Ann. “You expand the set of visited nodes and maintain
    tentative distances to nodes along the unvisited frontier. Each time you find
    a shorter path to a node, you use it. What I don’t understand is—”


    “You’re quick!” proclaimed Edgar. “I bet you’re confused by the question of whether
    there could be a shorter path through other unvisited notes?”


    “No,” declared Ann. “There can’t be a shorter path, because you always take the
    closest unvisited node. If there were a shorter path, then it would require going
    through another node. But we already know that that other node is further away,
    because it wasn’t the closest.”


    “Why we add the distances, then?” ventured Edgar. “Well, that’s simple. The distance
    of going from A to B through node C is the distance from A to C plus the distance
    from B to C.”


    At this point, Ann was severely aggravated at the interruptions. “No! I’ve walked
    before. I know that when you walk over two bridges the total distance is the sum
    of their lengths. And I see that you’re ignoring the distance over the island
    itself, which makes sense given that G’Raph is composed of very little island
    and a lot of bridge.”


    Ann continued before she could be interrupted again. “I understand the algorithm.
    It’s all very clear. What I want to know is: why do you have to use scooters?
    You already have all the distances between islands written on this map. You could
    do all of this without traveling to the islands.”


    Edgar looked at Ann blankly. “Why would we do that?”


    Ann sighed. “Because it’s a lot faster to just mark nodes on a map as ‘visited’
    instead of actually visiting them. You could do this entire algorithm on paper
    without leaving the library.”


    Edgar looked at Florence for help. “But scooters are the best part. What fun would
    it be without scooters?”


    Florence agreed. “That’s why we call them ‘visited’ nodes; we get to visit them.”


    “All I’m saying is that you don’t need to actually drive there,” Ann noted.


    “Maybe you’re confused about one of the concepts,” ventured Edgar. “Let me start
    again. Dijkstra’s algorithm finds the shortest distance from any starting node
    to all other nodes in the graph. …”


    Ann sighed and sat quietly in the corner. As Edgar and Florence re-explained how
    to add unvisited neighbors to the visited list, Ann daydreamed about racing through
    G’Raph on a scooter. There was something appealing about that approach.


    ## A Disagreement over Data Structures


    Graphs can be represented by a variety of data structures. Two common representations
    are adjacency matrices and adjacency lists. Both data structures can handle directed,
    undirected, weighted, or unweighted edges. An adjacency matrix represents a graph
    as a matrix, with one row and one column for each node. The matrix value of row
    `i`, column `j` is the weight of the edge from node `i` to node `j` (0 or 1 for
    unweighted graphs). An adjacency list maintains a separate list of neighbors for
    each node.


    ***


    Ann had obviously touched upon a controversial question. Florence and Edgar stood
    on opposite sides of the room glaring at each other. The question had seemed innocent
    enough: “Do you always represent graphs with these illustrations?” Ann had asked.


    Florence had quickly answered, “No. Those are only for illustration. Adjacency
    matrices work better.”


    Edgar had snapped back, “The correct answer is: adjacency lists.”


    Silence and glaring had followed.


    “What are adjacency matrices and adjacency lists?” asked Ann, starting with the
    most basic question. Both scholars immediately rushed to explain their data structures.
    The resulting sound reminded Ann of two chipmunks fighting.


    “One at a time, please,” Ann pleaded. “Florence, why don’t you start with adjacency
    matrices?”


    Florence smiled. “They’re simple. Every row represents a node and every column
    represents a node. If there’s an edge between two nodes, you put the edge’s weight
    in the corresponding element. So `M[i][j]` would store the weight of the edge
    from node `i` to node `j`. Here’s an example of some of the islands of G’Raph:


    ![](images/00043.jpg)


    “As I mentioned earlier, each island is a node in our graph and each bridge is
    an edge. In this case, I’m showing an unweighted graph. So a value of 1 indicates
    that a bridge exists between two islands, and a value of 0 indicates that does
    not. Adjacency matrices are wonderful. See how it puts all of the information
    into a single, convenient form? You can even perform some computations by multiplying
    the matrices.”


    Ann nodded. It seemed sensible enough. “Why aren’t there ones along the diagonal?”
    asked Ann. “Depending on what you’re trying to represent, self edges (or loops)
    can certainly make sense. In this case, there’s no bridge from the library to
    the library,” explained Florence.


    “Okay. Now Edgar, can you tell me about adjacency lists?” asked Ann, turning to
    the other scholar.


    “Certainly,” started Edgar. “You start with a list of the nodes. Imagine a giant
    array or linked list with the name of each node. Then, for each of those nodes,
    you keep another list of all the nodes to which it connects. For graphs with only
    a few edges, it can use less memory. You only store the edges that are there.
    Here’s an example.”


    Edgar sketched an example on the board that used an array to store the nodes (islands)
    and a linked list for its neighbors. Ann noticed immediately that, in this case,
    the existence of an edge (bridge) was implied by the fact two nodes were neighbors.
    However, the actual ordering of the neighbors didn’t seem to matter at all.


    ![](images/00051.jpg)


    Ann studied the examples. “Both forms can represent the same graph exactly?” asked
    Ann.


    Both scholars nodded.


    “Both forms can do directed graphs as well?” asked Ann.


    Both scholars nodded.


    “They can both represent weighted edges?” asked Ann.


    Both scholars nodded.


    “Why are you fighting then? It seems like they both do the same thing, but have
    different advantages. A matrix is simpler to specify, and a list can take less
    space. Is that really worth fighting over?” asked Ann.


    Both scholars nodded.


    “Really?” asked Ann.


    “Space matters!” cried Edgar. Then turning to Florence, he asked, “Have you ever
    tried using your precious matrices to represent the entire pigeon network? There
    are thousands and thousands of nodes!”


    “Simplicity matters too!” answered Florence “I can traverse my matrices with two
    fixed-size `FOR` loops. You need to iterate over lists of different size. I’ve
    seen your implementations; they have pointers!”


    “Better to have pointers than a row with ten thousand useless zeros!” responded
    Edgar.

