    About the Author


    Jeremy Kubica began his career in computer science by learning to program a Commodore
    in the second grade. There he soon mastered the secret arts of variables and loops—skills
    that helped propel him toward fame and ever greater challenges.


    He has a B.S. in Computer Science from Cornell University and a Ph.D. in Robotics
    from Carnegie Mellon University. He spent his graduate school years creating algorithms
    to detect killer asteroids (actually stopping them was, of course, left as ‘Future
    work’).


