    然而，快递员没有继续朝门口走。他呆在原地，盯着那些花。两分钟后，马库斯（Marcus）走出去看看是不是出了问题。


    “你的花和昨天比变了，”快递员观察道，“我确定右边那朵昨天是红色的，今天变成蓝了。”


    “它们是同一种花，”马库斯回答道，“它们今天有些在闹气。愚蠢的花。”


    “闹气？花也会会闹气吗？”快递员问。


    “实际上，这更像是一种抗议，”马库斯解释道，“它们当然是魔法花。每当不下下雨时，它们就会抗议。这真的很让人恼火。我每天给它们浇水，但它们还是坚持要闹气。”


    “哈？”快递员在马库斯和花之间来回看去，试图理解马库斯的话。


    “它们通过颜色变成蓝色来抗议。玫瑰本该是红色的。你可能听过所有这类意思的诗，比如‘玫瑰是红的’之类的。但这些玫瑰执意要告诉我它们在没有下雨的情况下已经‘受苦’了多久。”马库斯说话时愤怒地对着花比划着。


    “它们会和你说话？”快递员从马库斯身边退了一步。


    “当然不。它们只是在改变颜色。”


    “颜色和下雨时间有什么关系？”


    “这个嘛，”马库斯开始说道，“它们以前在连续三天没雨后会一起变色——一种集体抗议。然后它们开始组织起来。它们想让我确切地知道它们有多不开心。所以现在它们数日子。”


    “只有两朵是蓝色的，”快递员观察到，“这一周都没下雨。”


    “准确来说是九天，”马库斯看了看花后纠正道，“它们使用二进制。”


    “红花是零，蓝花是一，”马库斯补充道。这个解释并没有帮助。事实上，它似乎让快递员更加困惑了。不过从好的一面来说，他不再想逃跑了。


    “二进制？”马库斯引导道，“每朵花代表一个不同的数字，因此代表不同的 2 的幂。最右边的花代表一（`2⁰`），它旁边的那朵代表二（`2¹`），再旁边的那朵代表四（`2²`），以此类推。把蓝花所代表的数字加起来就能得到总天数。现在只有第一朵（`2⁰
    = 1`）和第四朵（`2³ = 8`）是蓝色的，所以是 `2⁰ + 2³ = 1 + 8 = 9` 天。”


    快递员看了看。果然，马库斯门廊五朵花是：红、蓝、红、红、蓝（或 `01001`）。


    ![](img/00045.jpg)


    “它们为什么要用二进制？”快递员问。


    “它们试图在花瓣上写下数字，结果太混乱了。所以它们只好让每朵花要么全红要么全蓝。事实证明花并不聪明。二进制对它们来说是一个足够简单的系统。如果它们聪明到能做其他事情，你认为它们会向我抱怨下雨吗？我对此无能为力！”马库斯直接对着花喊了最后一段。


    “但它们是如何协作的？”故事越变得荒诞，快递员就越感兴趣。他向花凑近。


    “对它们来说，用二进制数数其实简单，”马库斯开始说，“下雨时，它们都很开心并变成红色。它们有效地将计数器重置为 `00000`。我很喜欢那些日子。


    然后，每天早晨，所有的花都会醒来并决定一整天变成什么颜色。如果没有下雨，它们就会增加计数。


    第 1 天后：红红红红蓝 (`00001 = 1`)

    第 2 天后：红红红蓝红 (`00010 = 2`)

    第 3 天后：红红红蓝蓝 (`00011 = 2 + 1 = 3`)

    第 4 天后：红红蓝红红 (`00100 = 4`)

    第 5 天后：红红蓝红蓝 (`00101 = 4 + 1 = 5`)

    以此类推。


    “你看，每朵花都向自己的右侧看以决定做什么。如果它的右侧邻居从蓝色变成红色（`1` 变为 `0`），那么这朵花就会翻转自己的颜色。蓝花变红，红花变蓝。这种情况会一直发生，直到某朵花不再从蓝色变成红色为止。”


    “最右边的那朵呢？”快递员问，“它怎么知道该做什么？”


    “啊。那个是挑事者！我确定它是开始这一切的那个。每天早上只要没下雨，它就会翻转。它是启动过程的那个。红变蓝，蓝变红……”……”


    快递员想了想。“为什么花只有在邻居从蓝色变成红色时才会改变呢？”


    “像你用数字 `0-9` 数数那样想吧。当你遇到 `9` 时，那个数字就不能再继续增加了。所以你把下一位加一，并将当前数字拨回 `0`。这就像从 `19`
    变成 `20`，或者从 `29` 变成 `30`。”


    ![](img/0068.jpg)


    ## （变量）名称的重要性


    编写“可读的”代码对于代码的长期可用性至关重要。编写清晰的代码更容易理解（无论对于原始程序员还是未来的用户都是），更容易维护，也更容易检查错误。可读代码的一个重要方面是使用清晰、有意义的名字。使用有意义的名字可以极大地提高代码的可理解性。


