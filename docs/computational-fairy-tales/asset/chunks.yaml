    a counter on the front.


    “A purse?” asked Ann.


    “A magic purse,” corrected Marcus. “It works like a calculator. It uses a variable
    called ‘value’ to track how much money the purse contains. This purse displays
    that amount on the front.


    “When you put a coin in, that amount is added to the ‘value’ variable, and when
    you take a coin out, the appropriate amount is subtracted from ‘value.’ It always
    tells you how much money you have in the purse.”


    Marcus demonstrated the concept by inserting a nickel into the purse. The counter
    on the front increased by five cents. Ann imagined a magical variable within the
    purse changing as the result of the addition.


    ![](images/00070.jpg)


    “Why would I need that?” asked Ann. “I can always count the money.”


    “Ah,” said Marcus with a smile. “Counting takes time. What if you’re in a hurry?”


    “I see. Thank you again for these wonderful gifts,” Ann responded with false enthusiasm.
    She already knew that the gifts wouldn’t help her.


    “I hope they help you on your quest,” replied Marcus. Then he quietly added, “If
    I had known you were departing on a quest, I would have brought better magical
    items for you.”


    He shrugged, closed up his pack, and prepared to leave.


    “Sir?” ventured Ann. “May I ask you for one more favor? Do you have any advice
    to give me on my quest? Any helpful pointers on where to start?”


    Marcus paused for a long moment and looked off into the distance. “I don’t know
    what the darkness is, or where you should go. I’m sorry. Instead, I’ll leave you
    with the following advice: don’t get eaten by a dragon. I hear it’s terribly unpleasant.”


    With those words, Marcus continued his journey toward the castle. He hummed to
    himself as he went.


    Once again, Ann felt a pit of despair in her stomach.


    The IF-ELSE Life of the King’s Turtle


    IF-ELSE statements allow programs to branch off and execute one of two different
    blocks of code. The IF statement starts by evaluating a Boolean (true/false) clause.
    If this clause evaluates to true, then the block of code conditioned on the IF
    statement is executed. Otherwise, it is skipped. An ELSE clause can be included
    to provide an alternate block of code in the cases where the original Boolean
    clause evaluates to false.


    * * *


    Fido, King Fredrick’s prized pet turtle, lived a charmed life. He spent his days
    in the garden fountain, swimming and sleeping. He didn’t have any magic powers,
    aside from the ability to amuse himself for an hour by staring at a pebble, but
    King Fredrick was quite fond of him. Due to his quiet nature and lack of razor-sharp
    teeth, Fido had always been Ann’s favorite pet as well. The castle’s servants
    took good care of him. They made sure that his fountain was always mostly clean—Fido
    did enjoy the occasional patch of slime.


    Fido lived by a series of simple rules. In fact, since his brain was roughly the
    size of a pebble, they were incredibly simple IF-ELSE–style rules. These rules
    made up Fido’s entire daily routine. For example, he had simple logic to determine
    when he ate:


    `IF` `he was hungry then he ate`


    This logic worked well for Fido, because he ate when he was hungry. And, as a
    natural consequence, he didn’t eat when he wasn’t hungry. It was quite a good
    system.


    For some aspects of life, the If statement could have two different actions depending
    on the condition. For example, when he was swimming:


    `IF` `the fountain is on then play in the fountain`


    `ELSE` `swim around the large rock`


    Obviously, Fido enjoyed the fountain more than the rock.


    Sometimes the decisions would be complex enough to require a series of chained
    IF-ELSE statements:


    `IF` `it is sunny then sit in the grass`


    `ELSE IF` `it is warm then go swimming`


    `ELSE` `sleep`


    On sunny days, Fido would happily sit in the grass. When it was warm but not sunny,
    Fido would swim in the fountain. And on those rare days when it was neither warm
    nor sunny, Fido would sleep. He hated those days.


    The gardener responsible for taking care of Fido often joked that “All that turtle
    does is eat, sleep, and swim,” which wasn’t far from the truth. The logic that
    ruled Fido’s life consisted of about fifty different actions contained within
    chained and nested IF-ELSE statements.


    When Ann was a child, a visiting scholar had once spent a week studying Fido.
    With Ann’s eager assistance, he recorded the entire logic for Fido’s routine on
    a single scroll of parchment. If Fido had been intelligent enough to understand
    what that meant, he might have been offended. Instead, he sat in the grass—it
    was sunny.


    Then, five days after the start of Ann’s quest, the unthinkable happened. The
    gardener, worried that Fido would be bored without Ann’s visits, added a second
    large rock to the garden. This addition threw off Fido’s IF-ELSE–based routine
    completely. It took almost a full week for Fido to determine a new routine. In
    the end, he added another IF-ELSE:


    `IF` `he is closer to the right rock then swim around the right rock`


    `ELSE` `swim around the left rock`


    Thus order was restored to his life.


    Loops and Making Horseshoes


    Loops, such as the FOR loop or WHILE loop, are programming constructs for repeating
    a set of instructions until some termination criterion is met. Two primary things
    define a loop: 1) What you do inside the loop, and 2) the conditions to stop looping.


    * * *


    Hundreds of miles north of the capital, in the small outpost of Garroow, the blacksmith
    Drex was losing his patience. His new apprentice, Simon, wasn’t working out. In
    fact, Drex had never had a worse apprentice in his thirty-five years as Garroow’s
    master blacksmith. Simon could barely lift the hammer, let alone swing it with
    sufficient force to shape metal. However, worse than that, Simon also lacked the
    necessary intelligence to carry out even simple tasks. Had it not been for his
    diminutive size, Drex might have thought that Simon was actually an ogre.


    Drex found himself constantly repeating instructions:


    “Now, hit the metal again.”


    “And again.”


    “And again . …”


    Drex’s patience was wearing thin. He hated repeating himself.


    Finally, Drex decided to try an experiment. “Simon, hit the metal twice,” he commanded.


    Clank. Clank. Simon complied.


    “Now, turn it over and flatten it,” Drex commanded.


    Simon flipped the deformed-looking horseshoe and hit it once. Then he paused and
    looked back at Drex, confused.


    Drex sighed loudly. Was that really too much for Simon to handle? The boy was
    hopeless.


    “It’s a loop!” shouted Drex. He knew that Simon wouldn’t understand, but at least
    shouting made Drex feel better. “A simple, simple loop.”


    “A loop?” asked Simon.


    “Haven’t you ever heard of a loop?”


    Simon shook his head sadly.


    Drex realized that they had hit the core of the problem. How could Simon function
    as a reasonable blacksmith without understanding how loops worked? Then again,
    Drex had no idea how Simon could function as a human without understanding loops.


    “A loop is defined by two things: something to do and a way to know when to stop
    doing it. You keep doing that one thing over and over until you stop,” Drex explained
    calmly, reciting the favorite description by Garroow’s famous scholar Dr. Whileton.
    Of course, Dr. Whileton tended to repeat himself, so he would have explained it
    at least a few times.


    Simon stared back blankly.


    “Think about a one-mile race,” Drex suggested. “You run around the track until
    you have gone a mile. That’s four laps, right? So, running is the thing you do
    and having run a full mile is how you know when to stop. The track even looks
    like a loop.”


    “I run until someone tells me to stop,” said Simon.


    “Of course you do,” muttered Drex.


    “In this case,” continued Drex, “I want you to keep hammering that horseshoe until
    it’s flat. As soon as it’s flat, you can stop. WHILE the horseshoe is not flat,
    hit it with the hammer.”'
