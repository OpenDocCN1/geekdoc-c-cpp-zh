    “One at a time,” Ann said. She quickly turned toward the town councilman. “You,
    and only you, tell me the problem.”


    “We’ve heard you’re on a quest to save the kingdom from the darkness. It has already
    struck us here. One of us is cursed! You have to help us.”


    The last sentence sounded like a command instead of a polite request. Ann didn’t
    like his tone. A wave of irritation flashed through her.


    “A single person cursed?” asked Ann. “That doesn’t sound like much of a ‘coming
    darkness’ at all.”


    The crowd didn’t appreciate Ann’s commentary. She could make out a few choice
    snarky comments through the general din. The people then fell into a tense silence
    as the town councilman spoke.


    “It’s a horrible curse,” he said. “Can’t you see that it’s contagious?”


    “Boils?” asked Ann. She hated curses with boils. Not only were they painful for
    the recipient, but they were rather unpleasant for everyone else around.


    “Of course not. Do you see any boils? It’s the Curse of Proximal Angst.”


    Instantly, the entire situation made sense to Ann. The Curse of Proximal Angst
    was a particularly nasty and effective curse. It used the “bad apple” theory:
    only one person received the curse, but it impacted everyone within a certain
    radius. Simply being near the cursed person caused irrational anger.


    “You don’t know who’s cursed?” confirmed Ann. Now that she knew why she was angry,
    she fought to control her rage. She took a depth breath and waited for the snarky
    response.


    The councilman also fought back his emotions. “We tried to figure it out, but
    to no avail. We’ve managed to rule out only two people: myself and Findley. Earlier
    today we went to get help, and the anger disappeared. Thinking that the curse
    had worn off, we returned. It hadn’t worn off. It is still here!”


    “Do you know the radius of the curse?” asked Ann, keeping her mind focused on
    business.


    “At least a mile,” answered the councilman.


    “Can we spread everyone out that far?” asked Ann.


    The councilman shook his head. “We have 512 villagers here. We can’t have everyone
    stand at least a mile apart. There isn’t room. We were thinking of sending people
    out one at a time, but that would take too long.”


    Ann thought in silence for a moment. “We’ll use a recursive divide-and-conquer
    approach,” she proclaimed.


    “What’s that?” asked the councilman.


    “A very simple algorithm,” said Ann condescendingly before she could stop herself.


    “Sorry,” she quickly apologized. “What I mean is that it’s a simple algorithm.
    We start with the full town in one group. Then you split evenly into two groups—each
    with half the people. The two groups walk half a mile in opposite directions and
    wait for an hour.”


    “How does that help?” asked the councilman.


    “At the end of the hour, only one group will be angry. That group contains the
    cursed individual. Once it feels better, the other group can come home.”


    “That only rules out half the village,” protested someone in the crowd.


    “True,” continued Ann. “Then we recursively apply the algorithm to the remaining
    group. It splits in two. The two groups separate themselves, wait, and then learn
    which one contains the cursed individual.”


    The councilman nodded. “We can continue to recursively search for the cursed person.
    Every hour, we can eliminate half the remaining village.”


    “Exactly,” agreed Ann. “With 512 people you’ll need nine hours. First you rule
    out 256 people, then 128 more, then 64 more, then 32 more, then 16 more, then
    8 more, then 4 more, then 2, and finally 1. You’re left with the one cursed person.”


    “What do we do with that person?” asked the councilman.


    Ann thought again. Obviously, the cursed individual needed to have the spell removed.
    Ann knew only one wizard she could guarantee would be able to do that. “Send him
    or her to a wizard that can undo the spell. The wizard Marcus lives in New Athens.
    He’ll be able to break the spell.”


    Ann quickly added: “But the cursed person must find him fast. We can’t have all
    of New Athens suffering from proximal angst. In fact, I’d suggest running through
    the streets of New Athens to Marcus’s door. Try yelling ‘I have contagious boils!’
    if people won’t get out of your way. Or elbow them hard as you run past.”


    Ann realized that she was ranting and cut herself off. The towns folk stared at
    her in a mixture of shock and general angst.


    “Just hurry,” Ann finished.


    With that warning, Ann decided that it was time to leave Turington. She said a
    quick goodbye.


    One hour and a few miles later, Ann’s head began to clear. She realized that she
    had never asked the most basic question. Why had someone been cursed? Turington
    was a small town renowned for its friendly fishermen and quiet but efficient collection
    of flashcard authors. It was hardly the sort of place where someone would get
    cursed.


    Ann thought briefly of going back, but she dreaded feeling the angst again. She
    convinced herself that it didn’t matter and continued forth on her own quest.


    ![](images/00015.jpg)


    # Hunting Dragons with Binary Search


    Binary search is an algorithm for efficiently finding a target value within a
    sorted list. The algorithm maintains a shrinking search window. It narrows down
    that window by repeatedly ruling out half of the remaining search space. At each
    step, you check the middle item in the current window and compare it with the
    target value. If the value in the middle is less than the target value, you can
    rule out the lower half of the window. If the value is greater than the target
    value, you can rule out the upper half. This process repeats until the target
    item is found or the window shrinks to a single item that doesn’t match the target
    value.


    ***


    The morning’s news was nothing short of dismal. King Fredrick had been awake for
    only twenty minutes when he decided that today was going to be awful. It had started
    manageably enough, with his head butler informing him that his favorite crown
    was still being polished and wasn’t available. However, that news was quickly
    followed by a report from his acting chief knight, Sir Braver, that a dragon was
    now terrorizing his kingdom.


    “Tell me what happened,” commanded the king in a weary tone. He hated dragons.


    “There’s a dragon,” declared Sir Braver.


    “You have already told me that part. Now tell me what has happened. Has anyone
    seen this dragon? Has it attacked anyone? Has it already been here for six weeks
    without anyone telling me?” prompted the king.


    “We’ve received six sightings, sir. No one has been hurt, but Farmer McDonald
    has lost his prize cow. And I think it just showed up this morning, sir.”


    “Farmer McDonald’s cow? The large one that won last year’s competition?” inquired
    the king. If he recalled correctly, it had been a sizable cow and would have been
    a perfect target for the dragon.


    “Yes, sir,” answered the knight.


    The king sighed. The story sounded like a textbook dragon attack. Soon the dragon
    would eat half the cows in the kingdom. “Well, you had better take the dragon
    hunter and vanquish the dragon.”


    “But sir, no one knows where the dragon is. How shall we hunt it?” asked the knight.


    “Really?” the king asked, surprised that his acting head knight didn’t know how
    to hunt a dragon. For the tenth time that week, King Fredrick regretted giving
    Sir Galwin a vacation.


    Sir Braver remained silent.


    “Find the last farm that it attacked,” said the king. “Dragons take long naps
    after each meal, so you will have time to catch it there.”


    “But sir, how will we know where that is?” asked the knight.


    “Have you studied dragon attacks at all?” the king asked. “There is an order to
    these attacks. Dragons are clever. A dragon will eat the largest cow in the area,
    then the second largest, then the third, and so forth. He continues to eat smaller
    and smaller cows until the only remaining cows are too small to be worth the bother.
    Then the dragon goes on to the next kingdom.”


    “But sir—” started the knight.

