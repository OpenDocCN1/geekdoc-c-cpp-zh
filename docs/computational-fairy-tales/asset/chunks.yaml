    The argument continued to build. Ann backed away from the two scholars. She was
    afraid that one of them would throw a coffee mug.


    Then, Ann heard a low sigh from the corner of the room. Turning away from the
    argument, Ann peeked around a huge stack of books. There, at a tiny desk in the
    corner, sat the most depressed-looking person that she had ever seen. He hunched
    over his desk, staring at a single sheet of paper on his desk and shaking his
    head.


    “Hello?” Ann said.


    The man looked up at her. “Both data structures are completely reasonable in their
    own way,” he explained without bothering to introduce himself.


    “I can see that,” Ann agreed. “I think they both have advantages and disadvantages.”


    The man nodded. “I wish they would see that. They make such a terrible racket
    when they argue. I have important work to do, you know.”


    “Can I ask what you’re working on?”


    “It isn’t done,” he answered. “I haven’t figured it out yet.”


    “What’s the problem, then?” Ann probed.


    The man didn’t answer for a while. Behind her, Ann could hear more shouting. She
    tried to ignore the argument.


    Finally, the man gave Ann a sad look. “It’s a really simple problem. I don’t know
    why I haven’t been able to come up with a good solution. It really is quite simple.
    I just want an algorithm that will give me the shortest path through a graph such
    that the path visits each node exactly once.”


    “Sounds like a good problem,” she offered.


    The man nodded. “I’ve been working at it for a while without any success. It all
    started a long time ago, when a man in a dark cloak first told me about the problem.
    I think he might have been a traveling salesman. I never did see his face, though.
    He told me he had a problem that he needed the best scholar in G’Raph to solve.
    I was young and naive. I told him I would have an efficient algorithm by the end
    of the week. That was twenty-five years ago.”


    ## The Traveling Salesman’s Problem


    The traveling salesman problem is a route-planning problem. The goal is to find
    the shortest path through a graph that visits each node exactly one time and returns
    to the starting node. The problem is also a classic example of a type of computationally
    difficult problems called `NP-hard`. There are no known efficient solutions for
    solving `NP-hard` problems exactly, and it has yet to be determined whether or
    not such solutions even exist.


    ***


    Ann looked at the depressed scholar in the corner. “You’ve been working on the
    same problem for twenty-five years?” she asked.


    “I’m so close!” he answered.


    Behind her, Florence and Edgar had stopped arguing. They peeked their heads around
    the stack of books.


    “Oh. I see you met Geoffrey,” said Edgar. “Never mind him.”


    “I want to hear more about this problem,” stated Ann. “What do you mean by ‘shortest
    path’?”


    Geoffrey didn’t answer. He hunched over his paper and mumbled to himself.


    Ann turned back to Edgar and Florence. “You just told me about a shortest-path
    algorithm,” she said.


    “This is different,” explained Florence. “The traveling salesman problem is a
    particularly difficult path-planning problem. The goal is to find the shortest
    path through a graph that visits each node exactly once and returns to the starting
    node.”


    “Here are two example paths through G’Raph’s school neighborhood,” offered Edgar,
    drawing a crude sketch on a nearby blackboard.


    ![](images/00073.jpg)


    ### Path 1


    ![](images/00025.jpg)


    ### Path 2


    “Both paths cross each node exactly once. Path 1 has a distance of 55 meters,
    and path 2 has a distance of 66 meters,” he explained.


    “That seems simple enough,” commented Ann. “There’s really no algorithm to solve
    it? Why not try all possible orderings of nodes? For each ordering, you could
    compute the total distance traveled if you visited the nodes in that order.”


    “There’s no known efficient algorithm to solve it,” explained Edgar. “No exact
    solution, at least. The method you suggested would work, but it’s factorial, `O(N!)`.
    For the five nodes in our simple example, there are `5! = 120` different permutations.”


    Florence shrugged. “No one actually knows if there’s an efficient solution or
    not. At least no one has found an efficient solution yet. There are good approximations,
    of course, but no exact algorithm.”


    “I played with it for a while,” offered Edgar. “I never made much progress.”


    “Geoffrey has been working on it for twenty-five years?” asked Ann.


    Both scholars nodded. “Ever since he met that man, Geoffrey has been unnaturally
    obsessed with this problem. He doesn’t think about anything else. In the past,
    he would work on three or four different problems at the same time. It’s as though
    he’s under some sort of spell,” Edgar explained.


    Edgar’s words sent a shiver through Ann. A vague memory floated through the back
    of her mind, but she was unable to latch onto it.


    “Has anyone else met that man?” Ann asked.


    Edgar shrugged. “I don’t think so. Geoffrey said that he was probably a visiting
    salesman.”


    “He was selling questions,” Geoffrey said quietly. Ann jumped at the sudden statement.
    Even though she had spoken to him only a minute ago, she had forgotten he was
    there.


    “What did he look like?” asked Ann. The undefined memory continued to nag at the
    back of her mind.


    “Dark cloak and a large wooden staff,” said Geoffrey.


    ## Panicked Depth-First Search


    Depth-first search is a search algorithm that fully explores a single path before
    backtracking to test other paths. The algorithm operates recursively, using depth-first
    search to explore all of the subpaths.


    ***


    Ann realized her mistake as soon as she crossed the first bridge. In her rush
    to get to the school, she had neglected to bring a map with her. In any other
    town, this wouldn’t have been a problem. But traveling in G’Raph wasn’t that simple.

