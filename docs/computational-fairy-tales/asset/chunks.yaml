    Then his supplier told him about another type of coffee. Called “Double-Bold Coffee,”
    it was significantly stronger than the normal brew. A single cup could keep you
    awake all night. Zed ordered eight cases and a new menu tag for the `ArrayDesignBoard`
    menu.


    Again, the new coffee became a rapid success. His morning crowd loved it. The
    steward alone ordered three extra-large cups each morning. Zed also started attracting
    new customers from the castle’s night guards. They needed something strong to
    keep them awake during their watch.


    Alas, MegaCup soon added a new shingle to the end of its sign.


    ![](images/00050.jpg)


    The next time his supplier visited, Zed grilled him on the other types of coffee
    available. After obsessing over the supply lists, Zed decided to try a novel approach.
    He ordered one case each of ten different flavors. He put these flavors into a
    rotation, constantly offering new variety.


    This rotation approach worked particularly well with Zed’s sign. Every time he
    switched a flavor, he would remove one tag and slide a new one in. Sometimes he
    changed the menu a few times in one day, such as replacing “Double-Bold” with
    “Low-Jitter” after noon.


    MegaCup took a different approach. The manager quickly found that, while adding
    new shingles to the end of the list was easy, removing them was frustrating. In
    order to remove a shingle, he had to: unlink it from both the shingle above and
    the shingle below, then reattach the shingle below to the one above. It was a
    time-consuming process. He decided to take advantage of the sign’s ability to
    easily expand offerings. He instead offered six different coffees on a semi-permanent
    basis. On rare occasions, he would grudgingly spend fifteen minutes unlinking
    a shingle on his sign and adding a new one.


    The two coffee shops operated in that mode for years. Zed’s coffee shop rotated
    through different options, and MegaCup offered a more constant, but larger, selection.


    Both businesses thrived as the market for coffee grew. Eventually, Zed’s Coffee
    House became one of the largest businesses in the kingdom, with over a hundred
    different locations. Zed continued to expand aggressively until the great sugar
    famine hit. With business dropping due to the lack of sugar, Zed decided to leave
    the world of coffee and speculate in coconut sales.


    ### Strings and Pigeon Messages


    Strings are sequences of characters. In many programming languages, strings are
    implemented as an array of characters, and you can access each character as you
    would any value in an array.


    ***


    “Only twenty letters?” asked Ann. The limit seemed ridiculous. Who had ever heard
    of a pigeon-carrier message with a length limit?


    “Yes,” confirmed Guelph’s pigeon master. “We don’t have the kingdom’s strongest
    pigeons here. We need to be careful about the weight of the messages.”


    “But twenty letters is so short,” objected Ann.


    “It’s actually a twenty character limit,” clarified the pigeon master. “Spaces
    count toward your total. So does punctuation.” He laid out a tiny rectangle of
    parchment on the counter. It had twenty tiny gray squares. Each square was large
    enough to hold a single character.


    “I suppose we could send for a stronger pigeon,” offered the pigeon master. “It
    might take a while, but we’ve done it before. I hear the castle has pigeons that
    can carry multiple pages of information. Can you imagine that?” He smiled wistfully
    and looked out the window. Ann had never seen a case of pigeon envy this bad.


    Ann shrugged. Truthfully, twenty characters would be more than enough. She had
    yet to find any useful information about the darkness. This message was a courtesy
    to her father; she had promised regular updates.


    Without a good reason to argue for a longer message, Ann set about filling in
    the tiny squares: “No progress. -Ann.” Seventeen letters.


    ![](images/00017.jpg)


    Ann took a moment to consider where she could add more information. She could
    strip out the punctuation, but that would save her only two characters. Anyway,
    she had nothing more to say.


    She paid the pigeon master and watched him attach the message to the pigeon’s
    leg. The bird lethargically flapped away, barely clearing the windowsill. Ann
    briefly wished that she could follow the pathetic bird back to the castle. Instead,
    she left the communications office and continued on her quest.


    As prescribed by Sir Galwin’s algorithm, Ann needed to find more information.
    She had no leads and her recent attempts to consult Dr. Conjunctione, Dr. Whileton,
    and now Dr. Iterator had failed miserably. In fact, none of the scholars she had
    visited could provide any assistance. They had all been too busy with “vital problems”
    to even speak with her. She needed some clue—any clue. So, despite her deep misgivings,
    she resolved to consult the Oracle of New Atlantis.


    ### The Swimmy Friends Pet Store


    Swapping two values in an array is a basic operation that helps illustrate how
    arrays store data. Each entry in an array can be viewed as an individual variable—it
    stores one piece of information. In order to swap the values contained in two
    different entries, additional (temporary) storage must be used. Specifically:
    1) the data from one array entry is written to the temporary storage, 2) the data
    from the other array entry is written to the memory location of the first entry,
    and 3) the data from temporary storage is written to the second array entry.


    ***


    Casey’s first day at the Swimmy Friends Pet Store hadn’t gone smoothly. Within
    fifteen minutes, he had accidentally allowed all thirty turtles to escape. He
    had then spent the next eight hours rounding them up. Although the turtles were
    slow, they scattered in different directions and hid under store shelves. No matter
    how nicely he asked, the turtles refused to come when he called them.


    The day had concluded with a stern lecture from the manager. The manager reminded
    Casey that Swimmy Friends Pet Store had a reputation to maintain. It was, after
    all, the kingdom’s finest aquatic pet store. Even the king had purchased his pet
    turtle at Swimmy Friends, and the king’s gardener had purchased a large rock here
    just last week.


    Casey sincerely hoped that his second day would go better.


    “Casey, I have a job for you,” called the manager as Casey entered the store.


    “Sure!” responded Casey eagerly.


    “We’re starting a promotion on tiger barbs this week,” the manager explained.
    “I want to put them in the big tank at the front of the wall. Can you swap them
    with the neon tetras?”


    Casey looked at the fish section. Large, torch-lit fish tanks lined the entire
    back wall of the store. At the front was the tank currently occupied by the neon
    tetras. Five tanks over, two dozen tiger barbs swam lazily around a small rock.
    Both tanks looked quite heavy.


    “You want me to move the tanks?” asked Casey.


    “Of course not!” the manager answered. “The tanks are full of water and weigh
    more than you. Just swap the fish. The temperature and pH are already identical.”


    Casey nodded. He walked over to the tiger barb tank and began trying to scoop
    up barbs in the net. The manager watched from the side.


    “What are you doing?” the manager asked.


    “Moving the tiger barbs over,” responded Casey without looking up. The tiger barbs
    were fast, and Casey wasn’t coordinated. He thrashed about with his little green
    net, hoping that he could catch one by luck.


    “You do know that tiger barbs and tetras can’t go in the same tank, right?”


    “Uh-huh,” responded Casey, still lost in concentration.


    “So, what are you going to do with the tiger barb that you’re having trouble catching?”
    prompted the manager.


    “I’m going to put it—oh.” Casey realized his mistake. There was no way he could
    transfer the tiger barbs over without first moving the tetras. And there was no
    way to transfer the tetras over without first moving the tiger barbs. The whole
    swap was deadlocked. His brain spun as he tried to come up with a solution.

