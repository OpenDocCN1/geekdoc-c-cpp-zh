  raw: 'Ann looked back at him. “Then what did you mean?” she asked.


    “The wizard has cursed all of the scholars, so they aren’t developing any new
    algorithms. I get that, and that’s bad. But why is it impacting everything else
    so quickly? It should take a while for the kingdom to get this bad, right? Not
    everyone needs a new algorithm every day. It’s not like a loaf of bread in a damp
    closest. Algorithms don’t get all green and fuzzy with age.”


    “Oh, right … that,” said Ann, the energy draining out of her voice.


    Ann didn’t speak for a moment. She looked at Peter, carefully studying him. Peter
    got the distinct feeling that he wouldn’t like what came next.


    “It’s much worse than that,” Ann said finally.


    “Worse?” asked Peter.


    “Worse,” confirmed Ann.


    “Uh, how?” asked Peter nervously.


    “I think the spells are targeting more than the scholars,” explained Ann. “The
    curse is seeping into all aspects of life. It’s using the scholars—using them
    to target the very algorithms themselves. You curse an expert in sorting, and
    you curse the sorting algorithm itself. The wizard is unraveling the very basis
    of computation in the kingdom.”


    “Oh,” was all that Peter could manage. His legs suddenly seemed a bit wobbly.
    He felt around for a chair, pulled it behind him, and fell into it.


    “Oh,” he repeated.


    “Yeah,” Ann agreed.


    “So?” asked Peter.


    “I have to stop it … fast.”


    The Quicksort Message


    Quicksort is a recursive sorting algorithm that is similar to merge sort. Like
    merge sort, quicksort partitions the items into two groups, recursively sorts
    those groups, and merges the results into a single sorted list. Unlike merge sort,
    quicksort uses the items’ values in the partitioning. Quicksort chooses a random
    element, called a pivot, and divides the current list into two sublists: items
    less than or equal to the pivot, and items greater than the pivot. Since the lists
    are partitioned by value, the merge operation consists of simply appending one
    sorted list to the other.


    The worst-case performance of quicksort is O(N²). However, quicksort takes N log
    N time on average. In fact, quicksort can be faster than other O(N log N) sorting
    algorithms such as merge sort.


    * * *


    “What are you doing?” asked Ann.


    “Putting away books,” answered Peter. “We ask the patrons to leave the books out
    for us, because they always mess things up when they try to help. They take the
    book back to the general area where they got it, see a gap, and shove it there.
    It messes up the whole order. And you should see what they do with the scrolls.”


    “Okay,” agreed Ann. “But what are you doing with the those books now?”


    “Sorting them,” answered Peter. “It’s easier if I sort them here. That way I can
    go through the stacks in order and put away the books. It’s like the merge step
    of a gigantic merge sort. It saves a lot of time.”


    “But how are you sorting them? It almost looks like you’re picking things at random.”


    “Oh,” Peter said. “This is something new that an accountant showed me. She called
    it quicksort. It has a terrible worst-case big-O complexity, but it actually works
    pretty well.”


    “An accountant?” asked Ann.


    “I think she works for a farm animal bureau, but she seemed to understand sorting.
    She obviously isn’t a computational expert though, or she would have known this
    quicksort has a worst-case time of O(N²). Imagine trying to sort more than a few
    shelves of books—”


    “Clare O’Connell?” interrupted Ann. She stood up, staring intensely at the book
    cart.


    Peter paused. In the five days Ann had been working at the library, she had barely
    looked up from her books. Her sudden interest in the reshelving of books unnerved
    him. The fact that she was paying any attention to him now was unnerving.


    “That sounds familiar,” Peter answered hesitantly.


    “Tell me everything,” commanded Ann. She stood next to him now, still staring
    at the bookshelves. “What did she say?”


    “Uh, okay … yeah, she was in here a few weeks ago to get a scroll on cows—or turkeys—or
    some type of animal. I’m pretty sure it was cows, though.”


    “What about the sorting?” prompted Ann.


    “All she said was that there was a better way to sort,” Peter said. “She showed
    me this algorithm that she called quicksort. You start with a stack of books to
    sort. Pick one book at random. You call that the pivot book.


    “Then you use the pivot to split the stack into two smaller stacks. Books before
    the pivot go on the left and books after the pivot go on the right.


    ![](images/00010.jpg)


    “You keep recursively splitting piles until you have one book in each pile.


    ![](images/00013.jpg)


    “Then you merge them back together by putting the left pile in front of the right
    pile.”


    ![](images/00016.jpg)


    Peter shrugged. “That’s all there is. As I said, it’s worst case O(N²), but it
    usually goes faster than that. More importantly, it’s a lot easier to merge library
    books by putting one pile on top of another.”


    Ann didn’t respond. She continued to stare at the shelf of library books. Finally,
    she whispered, “It has an N log N expected running time.”


    “Expected?” asked Peter.


    “It means that on average it will take N log N,” answered Ann. “I heard rumors
    that Clare was working with expected running times.”


    “The worst case is still N²,” objected Peter. He firmly believed that worst-case
    running time spoke for itself.


    That broke Ann out of her trance. “That’s the beauty of it,” answered Ann. “You
    would need to always make a bad pick to have a that bad a running time. For example,
    if you always chose the smallest value for the pivot, it would be bad. You would
    need to split the books N times, with each split requiring up to N comparisons.”


    Ann turned back to the bookshelf. Her voice dropped to almost a whisper. “The
    chances of that must be very small.”


    She spun toward Peter and grabbed his shoulders. Her eyes lit up with a wild energy.
    “When did you say Clare was here?” she asked.


    Peter tried to take a step back, but Ann held him tight.


    “When was she here?” asked Ann.


    “Two weeks ago, I think.”


    The Bureau of Farm Animal Accounting had fallen three weeks ago.


    “It’s a message!” shouted Ann. “Quicksort is a message!”


    Comments and the Baker’s Apprentice


    Comments are additional text within code that can greatly improve the code’s readability
    by providing additional insight, explanation, or summarization. For example, a
    comment before a large block of numeric statements might simply explain “Solve
    a · x² + b · x+ c= 0 for x,” allowing the user to understand exactly what the
    following block of code is meant to do.


    * * *


    “Now this is how you write an algorithm,” proclaimed Ann. After days of reading
    through some of the worst-written scrolls in the history of the kingdom, Clare’s
    scroll on “The Application of QuickSort to Filing Expense Reports” provided a
    welcome change.


    “How so?” asked Peter, leaning in to look at the scroll. He stared for a moment.
    “I guess it’s nice handwriting,” he said.


    “It’s so much more than that,” said Ann. “The algorithm itself is readable. The
    variable names make sense, the functions are well defined, and there are comments.
    Good comments!”


    “Comments?” asked Peter. “That seems unnecessary. I thought a good algorithm was
    supposed to make sense on its own.”


    “Not always,” said Ann. “In complex algorithms, good comments can help make everything
    more understandable. Other times, a good comment can provide useful insights into
    why an approach was used.”


    Ann paused as she thought back. “Our castle’s baker, Breadtista, was the first
    person to show me the importance of a good comment. I spent a summer as his apprentice.
    In fact, I spent a lot of summers apprenticing; my father is a fan of a broad
    education. Anyway, as part of his world-renowned teaching program, Breadtista
    insisted that each apprentice thoroughly document his or her work. All recipes,
    tips, and tricks must be clearly documented to create a reference that lives beyond
    the apprenticeship.”'
