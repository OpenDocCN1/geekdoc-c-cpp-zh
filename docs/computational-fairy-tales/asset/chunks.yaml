    A graph is defined by a set of nodes and a set of edges that link together the
    nodes. Graphs can be used to represent a large number of real-world systems, including
    social networks, computer networks, and transportation systems. For example, in
    a transportation network the nodes could be cities and the edges could be roads
    between the cities.


    Ann arrived at the city of G’Raph shortly before nightfall. It looked more like
    a massive swamp than a proper city. Tiny dirt islands dotted the landscape, poking
    out of the mud like warts. On each dirt island stood a small structure—usually
    a house or business. The islands were connected by what appeared to be an inconceivably
    large number of rope bridges.


    Despite the large sign stating “Welcome to G’Raph: Land of the Bridges,” Ann was
    certain that she had arrived at the wrong place. This couldn’t be the same G’Raph
    of which her father had spoken so highly. To hear him tell it, some of the best
    minds in the world had built G’Raph into an intellectual powerhouse. Could she
    really find any answers here?


    Ann took a deep breath, immediately regretting that decision as the swamp air
    filled her lungs. She coughed a few times, shook her head in dismay, and walked
    toward the city. Her first stop was G’Raph’s City Hall. She hoped the mayor could
    introduce her to someone to help with her quest.


    Unfortunately, Ann quickly discovered that she couldn’t simply walk to City Hall.
    Each little dirt island had only a few bridges connecting it to its neighbors,
    providing her a limited numbers of options of where to go next. This arrangement
    required her to stop and think about the path, instead of thinking solely about
    the direction she was going.


    Finally, after crossing thirty bridges, Ann stopped at a small farm to ask directions.
    A small wooden sign on the edge of the property read “Welcome to Thomas’s Farm:
    Home of G’Raph’s Best Radishes.” The farmer, who had been harvesting his radish
    crop from the swamp mud, seemed eager to help.


    “Excuse me, sir. Can you point me in the direction of City Hall?” asked Ann.


    “The direction? I guess it’s that way. But you need to take that bridge over there.”
    The farmer’s arms extended in different directions.


    “Are you sure?” asked Ann. In her experience, the fastest way to City Hall was
    to walk toward it.


    “You’re not from around here, are you?” asked the farmer.


    Ann shook her head.


    “It’s the bridges,” explained the farmer. “In order to get anywhere in G’Raph,
    you have to understand how the different islands are connected. Each bridge forms
    a link between two island nodes. So in order to get from `node A` to `node B`,
    you need to take the correct sequence of bridges.”


    “I go that way?” Ann asked, pointing away from City Hall.


    “You need to go from here to McFane’s farm, to the brewery, to the inn, to the
    24-hour dry cleaner’s, and then to City Hall. That’s five bridges.” The farmer
    counted the steps on his fingers.


    Ann stared back at him.


    “Let me write it down for you,” the farmer offered. He pulled out a scrap of paper
    and sketched a small map:


    ```

    ![](images/00005.jpg)

    ```


    “There you go,” he said, offering the paper to Ann. “Each line is a bridge. Just
    follow the bridges from island to island, and you’ll be fine.”


    “Thank you,” Ann said.


    Looking at the map, she confirmed that she first needed to walk away from City
    Hall. Her head spun wildly. How did anyone find their way around here? At least
    she knew with certainty that Marcus’s magic compass would be useless here.


    Little did Ann know that the very structure of G’Raph had pushed its population
    to become a city of algorithmic thinkers. It was here in the city of G’Raph that
    Ann would find the first real clue to her quest.


    ## Directed Graphs and Bridges


    The edges in a graph can be either directed or undirected. Directed edges indicate
    one-way relationships, such as: there is a link from `Node A` to `Node B`. Undirected
    edges indicate bidirectional relationships, such that `Node A` and `Node B` are
    linked. The distinction between undirected and directed edges is important to
    both the structure of the graph and the way algorithms operate on the graph.


    As Ann waited in the mayor’s office, she studied the map of G’Raph that hung on
    the wall. The map itself was huge, taking up the entire south wall of the room.
    The map contained at least a thousand dirt islands, represented as tiny circles,
    and several thousand bridges, represented as lines. Each bridge was clearly labeled
    with some number, which Ann assumed was the distance between islands. At seeing
    the full extent of the city mapped out, Ann again wondered why anyone would build
    a city in such an inhospitable swamp.


    “Ann!” greeted the mayor in a loud voice. “You’ve grown so much since I last saw
    you. It must have been at least ten years. How have you been?”


    “I’ve been splendid. Thank you for asking. And yourself?” responded Ann.


    She had absolutely no recollection of ever meeting the mayor. Then again, given
    how young she was ten years ago, she wouldn’t have expected to remember him. Still,
    Ann was convinced that she should remember this particular man. His bushy gray
    muttonchops alone would be impossible to forget. They easily covered half of his
    face.


    “I am wonderful,” answered the mayor. “Life in G’Raph is most wonderful. How are
    you finding our humble town so far?”


    “I’ve met the most charming and helpful people. However, I do have to admit that
    your islands pose a bit of a challenge,” answered Ann honestly.


    The mayor laughed. He turned to look at the map. “Yes. That’s a common feeling.
    Luckily, our best scholars have developed some algorithms. Once a person masters
    those, life becomes a lot easier.”


    “I suppose,” replied Ann, thoroughly convinced.


    “You know, it wasn’t always this simple, either,” continued the mayor in a hushed
    tone. “My predecessor made such a mess of our bridge system. He actually made
    each bridge one-way.”


    “Really?” Ann gasped. She already knew that it would take a long time to navigate
    around. The thought of making all the paths one-way was absurd.


    “Indeed,” answered the mayor. “He thought it would streamline movement. Admittedly,
    it did make the traffic flow over each bridge. But it also meant that you had
    to account for the direction of every bridge when planning your path. Worse though,
    since each bridge only went one direction, some paths became much too long. He
    even started building second bridges between some high traffic islands—one bridge
    from here to there and another from there to here. Perhaps you wondered why there
    are parallel bridges between the south market and the top hat shoppe?”


    “I didn’t come that way, so I didn’t have an opportunity to wonder,” Ann explained.


    “Well, that’s why. Before the second bridge, people had to take nine bridges to
    get from the south market to the top hat shoppe. It was horrendous!”


    “The second bridge helped?” asked Ann.


    “It did. However, building extra bridges is too expensive. Unlike adding lines
    on this map, building a bridge takes real effort. Eventually, we returned to using
    two-way bridges again.”


    Ann nodded in agreement. From what she had seen, each bridge probably took days
    to build. She couldn’t imagine it being doubling that effort.


    Finally, Ann decided to get to the real purpose of her visit. “Sir, my father
    has always spoken highly of the theorists of G’Raph. I’m sure you’re aware of
    my quest and the vaguely defined danger that the kingdom faces. Would it be possible
    for me to stay here and learn from your scholars?”


    The mayor’s face lit up in a wide smile. “Of course!” he proclaimed. “You’re welcome
    to stay as long as you want. I assure you that you shall find our scholars’ work
    most enlightening. I shall take you to the G’Raph library first thing tomorrow.”

