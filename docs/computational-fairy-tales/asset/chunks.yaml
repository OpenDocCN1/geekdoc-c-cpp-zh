    “What if I hadn’t succeeded?” Ann asked, letting a flood of doubts rush out. “I
    came so close to failing. I’m not sure why it had to be me on this quest. I wasn’t
    prepared at all.”


    Her father sat silently, watching her. After a moment, he spoke. “That is why
    it had to be you; you had to learn. To be precise, the seer said that it needed
    to be the person of my choice who would venture forth alone. I believed that you
    could use the experience. And, anyway, you were not paying attention during the
    prophecy.”


    Ann was shocked at this revelation. “What if I had failed?”


    “I had confidence in you,” he said calmly. “Some things have to be learned through
    practice and application. It is not enough to read about the concept of quests;
    you must go out and apply them. You must experiment with techniques through trial
    and error.”


    Ann didn’t look convinced.


    The king grew serious. “Listen carefully, Ann. When you take the throne, there
    will always be new challenges. Some will be easier and some will be more difficult,
    but you must face them all. The fate of the kingdom will depend on you again and
    again.”


    She nodded, but the doubt continued to eat at her. “What if I can’t handle them?
    What if I’m not smart enough?”


