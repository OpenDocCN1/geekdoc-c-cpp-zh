    backtrack.”


    “Ah, a depth-first search,” noted Florence. “Nice.”


    “Depth-first search?” asked Ann, a little out of breath from all the running.


    “Depth-first search is when you keep exploring along one path until you hit either
    a dead end or a node that you’ve seen before. Then you backtrack to the most recent
    decision point and try a different option. If there are no new options at that
    point, you backtrack again.” Edgar explained.


