    The following Monday, he addressed his subjects. “I have devised a new system
    that uses a priority queue. Each of you shall write your complaints on a piece
    of paper. Every Monday night, the steward shall read each complaint and assign
    a priority from 0 to 10\. We shall then deal with the highest priority complaints
    first.” The prince paused and waited for the applause. A few subjects clapped
    in a lackluster fashion. The steward audibly groaned at his new task. He knew
    quite well that everyone would complain to him about the assigned priorities.


    Thus the kingdom adopted a priority-based complaint system. Over time, the subjects
    embraced this system. The prince went on to become king and guide his kingdom
    through a period of unprecedented happiness and quick responses to dragons. Everyone
    in the kingdom was happy—except, of course, the steward.


    ## Binary Search Trees and the Spider


    Binary search trees (`BST`) organize data to allow efficient searches by value.
    Data is stored in tree nodes. Each tree node also maintains pointers to at most
    two child nodes: a left child and right child. The tree maintains the property
    that, at each node, values down the left child are less than the value of the
    current node. In contrast, values down the right child are greater than (or equal
    to) the value in the current node. This structure allows you to search efficiently
    by walking down the tree and branching in the direction of the value for which
    you are looking.


    ***


    Speck lived a typical spider lifestyle. He built webs, ate flies, and enjoyed
    discussing the weather with his neighbors. In fact, for those who had never been
    to visit his web, he seemed like a perfectly normal spider.


    However, Speck had a most unusual quirk for a spider. He was obsessive about his
    food choices and demanded a level of variety that was unheard-of among arachnids.
    Speck insisted on keeping a supply of at least 25 different types of bugs in his
    web.


    Speck also insisted on absolute organization in his food supply. What good were
    25 varieties of bugs if he couldn’t quickly find the one he wanted? While most
    spiders kept their bugs distributed randomly throughout their webs, that prospect
    seemed absurd to Speck. He loathed such disorganization. Instead, like any rational
    chef, Speck organized his food choices in alphabetical order.


    The result of these preferences was a new type of web, which Speck developed through
    days of trial and error. He called it a binary search web. He firmly believed
    that it would revolutionize the world of bug storage.


    The web consisted of nodes—clusters of webbing storing his bugs—and strings of
    web between the nodes. The whole web was organized vertically. At the top, a single
    “root” node hung from a wooden beam. Each node could have at most two “child”
    nodes below it. These nodes were attached securely to their parent node using
    a strong strand of webbing. As a result, the web branched out wider as it progressed
    downwards, taking on a vaguely triangular shape.


    In order to organize his bugs, Speck used the nodes to enforce a particular alphabetical
    ordering. If you were standing on any node in the web, then all of the bugs down
    the left-hand path had to be before the current node’s bug in alphabetical order.
    Similarly, all of the bugs down the right-hand path had to be after the current
    node’s bug in alphabetical order. So if you wanted to find a particular bug, you
    could always use the current node’s bug to choose whether to go left or right.


    For example, one morning Speck decided that he wanted a fly for breakfast. He
    started at the top of his web, where he slept, and examined the bug there. It
    was a ladybug. Although it wasn’t the bug he wanted, it told him which way to
    go. Since flies come before ladybugs alphabetically, Speck chose the left child
    node to continue his search.


    At the next node, Speck found a beetle. His stomach turned at the sight of it.
    Admittedly, Speck had never been too fond of beetles, and the thought of one for
    breakfast was deeply unpleasant. He hurried past that node. This time he knew
    to go right, because flies come after beetles.


    Thus, Speck found the three day old fly. He happily ate his breakfast and then
    took a mid-morning nap.


    ![](images/00002.jpg)


    Since Speck got cranky whenever he was hungry, he found the efficiency provided
    by the web critical. The web’s branching structure often allowed Speck to find
    any bug in just a short walk. In fact, Speck could double his inventory of bugs
    by adding just one new level to his web.


    The web also lent itself to the addition and removal of bugs. Adding a new bug
    simply consisted of walking the bug down the web (while taking the correct alphabetical
    branches) until he hit a dead end. Then he would add a new child node, with the
    new bug, to the correct side of the current node. Adding a new node meant spinning
    some webs, and Speck enjoyed that part of being a spider. As he saw it, making
    webs was definitely the best part of being a spider.


    ![](images/00034.jpg)


    ![](images/00019.jpg)


    When Speck finished with a bug, he would simply remove it from the web. If there
    were two nodes below the now-empty node, he would move a bug up to fill the empty
    spot. He was always careful to do this in such a way as to maintain the tree’s
    structure and sorted property. If there was only one child node, he would shift
    that child node into the place of the empty node. At the end, he would be left
    with a single empty node that he could cut out of the tree and let drift off in
    the wind.


    Sadly, despite the obvious advantages of the binary web structure, Speck never
    managed to encourage wide adoption. His friends stuck with the classic circular
    patterns and continued to eat whichever bugs were closest.


    ![](images/00027.jpg)


    ![](images/00018.jpg)


    ## Pointers, Linked Lists, and Trees


    Pointers can be used to link together blocks of data and create complex data structures.
    For example, each node in a linked list may contain a pointer to the next node.
    This node may live in a completely different area of the computer’s memory, but
    the pointer allows the program to move from one node to the next. Similarly, the
    nodes in a binary tree contain pointers to their child nodes.


    ***


    “Do you want me to squish it?” the ship’s captain asked loudly.


    Ann jumped and turned in surprise. With a rising sense of embarrassment, she realized
    that she had been staring at the spider’s web for the last two hours. In that
    time, the galley had emptied and the crew had returned to work.


    “No,” Ann answered hastily. “It’s fascinating.”


    “Fascinating?” asked the captain. “It’s a spider. How interesting can it be?”


    Ann turned back to the web. “I’ve never seen a web like this before; the …” Ann’s
    voice drifted off as she struggled to describe the web. “It looks like a binary
    search tree,” she continued. “See how the tiny nodes of web are joined together
    by thin linkages, and how each node has at most two child nodes.”


    “Binary search tree?” asked the captain. “It is an oddly shaped web, to be sure.
    But I don’t see how it looks like a tree.”


    ![](images/00054.jpg)


    Ann thought for a moment to draw a comparison that the captain would understand.
    “Your convoy!” she exclaimed suddenly. “It’s like your convoy.”


    The captain leaned in. “It looks nothing like my convoy. My convoy is a straight
    line. This web branches out in weird ways. Moreover, this web has bugs! Lots of
    bugs. I think there’s even a beetle in there.”


    “Think about pointers,” Ann interrupted. “In the convoy each ship is a node—a
    self-contained unit bearing some cargo. The ships are joined together into a line
    by pointers. A pointer links each ship to the one behind it, like a giant linked
    list.”


    ![](images/00057.jpg)


    “The web is similar,” Ann continued. “Each node seems to have a ‘cargo’ of a single
    bug. The threads of web joining them together are like pointers.”


    “Why not make it a line?” asked the captain. “Why does it branch out like that?”

