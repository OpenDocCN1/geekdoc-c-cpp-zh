    在目睹了船上指示系统的运作后，安对船只的各个方面都着迷了。她花了几个小时观察船员。安看着水手们升起风帆、系好绳子、清洁甲板并记录航向。她对经验丰富的水手们无懈可击的技能感到惊叹，对厨师助理笨拙的动作感到好笑。在强烈好奇心的驱动下，安试图尽可能多地学习每一项工作。


    一天早晨，安甚至向船长请求是否可以借一本船用手册。船长总是乐于助人，很快带了一本 4,096 页的《水员手册》（第 3 版）。安震惊了。


    “为什么这么大？”她问。


    “要学的东西多呢，”船长自豪地回答道，“普通水员需要五年的时间学习基础知识，还需要三十五年才能学会手册上的其他内容。”


    “我明白了，”安说。四十年的教育似乎有些过头了。不过话说回来，仅仅是读完手册本身可能就需要很多年。在安的经验中，操作手册很少是快速读完的。


    在感谢了船长后，安带着手册来到一个安静、阴凉的角落。她翻阅着手册，扫过不同的主题。她跳过了许多关于胡须长度规定和鹦鹉护理的页面。最后，她选择了“将船固定在码头”这一主题。指令占据了整整三页密小字体。这种详细程度让安感到惊讶。每条指令都详细说明了任务的每一个细节。


    安读着每一行，试图吸收信息。她甚至在自己的鞋带上练习了将绳子系成结的指令（长达二十五行），然后立刻责备自己没有认出常见的“奶奶结”。大约半小时后，她对自己对该流程的理解有了信心。


    下一部分描述了如何将小艇固定在船上。同样，这一部分也占据了三页密小字体。当安翻阅这些页面时，她开始识别出上一节的指令。事实上，关于系绳子的那二十五行完全相同。她在两个章节之间快速来回翻看以确认。


    第二天，安向船长汇报了这一发现。


    “观察得敏锐！”他夸赞她，“很多概念都是相似的。例如，拿绳子来说，系结的方法只有几种真正好的方法。”


    “那为什么要逐行重复这些指令呢？”安问。


    “你每次都要做一遍，”船长回答道，“跳过系结的部分就太糟糕了。小艇会漂走的。几年前有一只木舟发生过一起可怕的事故……”


    “我明白，”安打断道，“但你不需要重复所有内容。为什么不能说类似‘用奶奶结系绳’这样？这能为你节省大量空间——光这一节就有二十四行。你只需要将常见任务拆分成它们自己的指令集即可。”


    “这会让指令更难理解，”船长说，“现在，每一步都安排得完美完美。我可以把关于修剪主帆的三十页内容交给任何水手，而不需要假设他们有任何先验。你会惊讶的，有多少新水手在第一周没有读完整本手册！”


    “重用核心概念会让手册更容易理解，”安辩论道，“一旦水手学会了如何系特定的结，他就可以任何场景下这样做。它本身将变成一个基础步骤——就像计算机函数一样。”


    “我想这会让内容变得更短，”船长同意道，“但实际上，书的长度不是问题。我们还用书来压舱石，所以有重的书是有用的。”


    “比这更好，”安反驳道，忽略了关于压舱石的评论，“如果你找到了更好的结呢？现在你必须更改每一条使用当前结的指令。那可能是一个漫长且容易出错的过程。如果你把同样的事情写一百遍，你总会在其中某一次犯错。你这里可能已经有几十个错误了。”


    船长轻微皱缩了一下，安想自己关于可能错误的建议是否有些过分了。批评船长总是有风险的。


    “如果你想指导水手做一些新动作，比如系好热气球呢？”安继续说道，“你有关于那方面的指令吗？”


    “嗯，没有，”船长承认道。他本能地拿过笔记本，记下了一个增加热气球章节的提醒。


    “这样说会更简单：1) 抓住绳子，2) 用奶奶结将其系在左侧护栏上。这些是你甚至可以口头传达的指令。水手只需要学会执行几个基本函数就可以开始。”


    船长沉默了，凝视着大海。片刻后，他缓慢地点了点头。


    “我觉得你是对的！”他大声宣布。在和他一起在海上过了几天后，安意识到船长是一个喜欢大声宣布某事的粉丝。更重要的是，只要可能，他也愿意改进流程。


    安笑了。


    “我打赌这不仅仅是系绳子。我们用来通信的信号也可以被拆分成函数。所有的灯都用同样的程序加油。所有的甲板都用同样的方式擦拭——当然，是逆时针擦。还有修剪胡须……”船长慢慢环顾着船舱，评估着不同技能的重用性。


    突然，他转向安。“你能帮我重写这本书吗？我们可以把这些内容拆分成你描述的这些独立单元。这将彻底改变整个行业！”

