    The knight turned back toward Ann. From the wide smile on his face, Ann knew that
    she had asked the right question. Sir Galwin loved to share his stories about
    quests almost as much as he loved questing itself.


    “Follow the established algorithm for quests, and you’ll be fine,” Sir Galwin
    assured her.


    “An algorithm?” asked Ann. She had never heard of an algorithm for quests. Hope
    flowed through her. She could handle algorithms.


    “It’s simple,” started Sir Galwin. “If you have one or more leads, you follow
    the best one. Otherwise, if you don’t have any leads, you travel to where you
    can find more information. Break any ties by flipping a coin.”


    This advice surprised Ann. She didn’t know what she had been expecting, but this
    certainly wasn’t it. It took her a few moments to figure out how to voice her
    confusions.


    “This approach seems to involve a lot of guessing,” ventured Ann.


    “I prefer to think of it as a heuristic,” said Sir Galwin.


    “A heuristic is basically an educated guess—a rule of thumb, if you prefer,” said
    Ann. “Is there anything more exact? Something without any guessing, perhaps? Something
    that guarantees that I find a solution quickly?”


    Sir Galwin let out a deep throaty laugh. “I said the same thing when my mentor
    described this approach to me. I resolved to develop a better algorithm for solving
    all quests.”


    Ann waited for him to continue, but Sir Galwin appeared to be watching a pigeon
    outside her window. As far as Ann could tell, the pigeon was not doing anything
    particularly interesting. It paced along the window ledge, bobbing its head.


    “Did you?” she finally asked.


    “What? Oh. The algorithm. No. I never invented anything better. I eventually realized
    that the established algorithm was pretty good. It turns out that quests always
    involve some guessing.”


    “So my entire plan is to keep following the best lead and collecting new information?”
    Ann confirmed.


    “Yes. I call it the Information Maximization for Issue Resolution algorithm,”
    said the knight. “I think it sounds much better than what my mentor used to say.
    He would call it ‘figuring stuff out.’


    “Think of it as a search for an answer. At each step you try to either move closer
    to the answer or learn more about the problem itself. Hopefully, learning about
    the problem will help you find an answer.”


    “How do I figure out the best lead? How do I figure out where to get more information?”
    asked Ann.


    “You have to find a strategy that works for you,” said Sir Galwin. “I rank things
    according to a gut feeling. I use `0` to indicate ‘feels utterly normal’ and `10`
    to indicate ‘feels wrong.’ For me, a `10` feels similar to eating three pounds
    of refried beans. I also use a special data structure to track everything. That
    system saved my life hundreds of times. One time, I was hunting a particularly
    nasty bog dragon through some marshlands—”


    “Is there anything else I should know?” interrupted Ann. She was desperate for
    any more information.


    Sir Galwin thought for a moment. Finally, he said, “Avoid chasing bog dragons
    through marshlands.”


    For the twentieth time this hour, Ann wondered what she had gotten herself into.


    # Variables and Magic Gifts


    A `variable` is a place in memory where you can store a single piece of data.
    Each `variable` is associated with a name. Programmers can reference, modify,
    or set the value of a `variable` using its name. `Variables` can also have associated
    types, such as `integer`, `Boolean`, or `float`. These types indicate what kind
    of information can be stored in the corresponding `variable`.


    ***


    Ann made it less than two miles from the castle before the crushing weight of
    her task once again descended on her. The fate of the kingdom depended on her
    finding a way to stop the darkness, yet she didn’t know what it was or even how
    to find out. She felt utterly alone.


    Ahead of her, Ann saw a man walking up the road wearing a bright blue wizard’s
    cloak with silver threading. She instantly recognized Marcus; no other wizard
    dressed so fashionably. He was also one of the kingdom’s most powerful wizards
    and a staunch friend of her father’s. If anyone could help her in the quest, he
    could.


    “Sir Wizard!” she called out to him, embarrassed that she had never learned the
    proper etiquette for addressing a wizard.


    Marcus looked up with a smile. “Princess Ann. How are you this lovely morning?
    Out for a ride, I see.”


    “Unfortunately, I’m not,” responded Ann. “I’m embarking on an important quest.
    The seers have predicted a coming darkness, and I must stop it.”


    “Alone?” asked Marcus. His smile vanished.


    “Yes. The prophecy said that I ‘must journey forth alone to stop the coming darkness.’
    But … perhaps you could still join me. Technically, we met after I had already
    journeyed forth alone. In fact, I’ve been journeying alone for about two miles.
    And, I could really use your help,” Ann pleaded.


    Marcus shook his head. “That wouldn’t be a good idea. Prophecies are fiddly things,
    and they don’t like it when you try to find technicalities. One time I thought
    I found a loophole in a prophecy; as a result, it rained Haborian Slugs for three
    days. It was terribly messy. You must go alone.”


    Ann’s heart sank. Tears started to well up in the corners of her eyes, but she
    fought them back and nodded bravely to Marcus. She knew he was right.


    “Maybe I can still help you, though,” continued Marcus. “Let me see what I have
    with me.” As he spoke he rummaged through a pack. After a moment, he extracted
    a couple of curious looking objects.


    “I have with me some of my latest works,” he explained. “They’re based on variable
    magic.”


    “Variable magic?” asked Ann. “What’s that? And what happened to your other work?”


    He shook his head as though clearing a horrible image. Then he continued, “Variable
    magic is a useful, but often overlooked, form of magic. It’s based on the simple
    idea of storing values. Take this rock for instance. It uses what’s known as a
    `location` variable.”


    “I’m taking a break from all plant-related magic. A terrible accident with roses,”
    Marcus said without further explanation. Ann thought she detected a hint of anger
    in his expression.


    “What does it do?” asked Ann, her eyes wide with interest. After algorithmic design,
    magic was her second favorite topic.


    “Stores a value, of course,” answered Marcus. “Weren’t you listening? It stores
    a location.”


    “So, you could use it to …” Ann paused as she thought. She couldn’t think of a
    single use case.


    “You can use it to find your way back to a given place,” Marcus finished. “For
    example, you could hide treasure and use the rock to store its secret location.
    Or you could store your current location before heading into a dangerous bog,
    so you can find your way out. Or you could use it to find your horse in a particularly
    large parking lot. It has many practical, everyday uses.”


    “I see,” acknowledged Ann. She silently wondered what Marcus’s “everyday” life
    must be like.


    “You simply tap the rock with your index finger five times,” explained Marcus.
    “Then the rock will store your current location in a magic variable. No matter
    where you are, the rock will continue to point toward the saved location until
    you set a new one.”


    “Like a compass?” asked Ann.


    “Exactly!” exclaimed Marcus. “Except you set the location instead of it always
    pointing north.”


    “It can only store a single location?” asked Ann.


    “That’s how a variable works; it only stores one piece of information,” answered
    Marcus. “Think about a small pocket—you can fit one thing in it. You can change
    what you have in it, but you can never have two things in it at the same time.”


    “I guess it would depend on the size of the pocket,” commented Ann.


    “Tiny, tiny, tiny,” responded Marcus. “A tiny pocket that can only fit one thing.”


    “Oh. Well, thank you.” said Ann. She was still uncertain about the actual usefulness
    of a compass rock.

