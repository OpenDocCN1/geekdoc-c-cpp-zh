    From the farm, she took the other bridge and arrived at another (smaller) radish
    farm. From the looks of it, this farm was decidedly less successful than Thomas’s
    farm. Ann paused for the briefest moment to wonder what could cause the difference
    in radish-growing performance between two almost indistinguishable islands of
    mud. She quickly pushed that question out of her head and continued her search.


    Yet again, Ann faced a choice of bridges. She started with the path to her right.
    Much to her relief, this bridge led to the school.


    ![](images/00052.jpg)


    Ann ran up to the school, where Florence and Edgar now waited. Edgar held a folded
    map of `G’Raph` in his hand. Ann cursed herself again for not having brought her
    own map. She could have avoided a lot of backtracking.


    “You made it!” exclaimed Edgar. “I was afraid you would get lost without a map.”


    “I did get lost,” admitted Ann. “Or, at least, I hit a few dead ends and had to
    backtrack.”


    “Ah, a `depth-first search`,” noted Florence. “Nice.”


    “`depth-first search`?” asked Ann, a little out of breath from all the running.


    “`depth-first search` is when you keep exploring along one path until you hit
    either a dead end or a node that you’ve seen before. Then you backtrack to the
    most recent decision point and try a different option. If there are no new options
    at that point, you backtrack again.” Edgar explained.


    “With `depth-first search`, you keep exploring deeper and deeper until you come
    to a dead end,” added Florence.


    “Or find what you’re looking for,” added Edgar.


    “Good point,” replied Florence. “You can also find what you’re looking for. Edgar,
    remember that time we used `depth-first search` on that choose-your-own-adventure
    novel?”


    “Fun times,” answered Edgar. He looked off into the sky as though replaying the
    memory in his mind.


    Ann was too tired to appreciate the algorithmic beauty of her own frantic run.
    A map would have saved her from experiencing `depth-first search` firsthand.


    The school’s principal, having seen the group standing outside, came out to investigate.


    “Excuse me,” he said in the stern tone every principal seemed to have mastered.
    “Who are you and why are you here? If you’re selling flashcards, you can keep
    walking. We don’t buy from traveling flashcard salesman.”


    “Have you seen a strange man in a dark cloak?” asked Ann without bothering to
    introduce herself or answer any of his questions.


    “Umm, yes. Why do you ask?” asked the principal.


    “Did he talk to anyone?” asked Ann, again ignoring the principal’s question.


    “He talked with one of our star students, Elizabeth,” answered the principal.
    “He had some question about some sort of math problem. I was there, too, but honestly
    I couldn’t understand what he was talking about.


    “Elizabeth seemed certain that she could figure it out, though. She went right
    home to work on it. She’s bright, you know. Probably the best scholar that our
    school has ever taught. She’ll find the answer.”


    “Do you know what the question was?” asked Ann.


    “It was something about islands and bridges. I think he called it ‘vertex covering`’
    I hadn’t heard of it before, but it sounded like fun.”


    “Another classic `NP-hard` graph problem,” said Edgar cheerfully. “I worked on
    that one too.”


    Ann felt her stomach drop.


    Now Elizabeth, `G’Raph High School`’s star student, had become singularly obsessed
    with it. She had fallen victim to the same spell as Geoffrey.


    The wizard had targeted two star scholars. Unfortunately, Ann had no idea why.


    ## Bridge Upgrades


    The `minimum spanning tree` of an undirected graph is the smallest set of edges
    such that all of the nodes are connected (if possible). Similarly, in a weighted
    graph, the `minimum-cost spanning tree` is the set of edges with the minimum total
    weight that connect together all the nodes.


    * * *


    Ann went straight to City Hall, where she hoped to find more information about
    the mysterious wizard. Florence and Edgar decided to join her. Or, more accurately,
    they decided to demonstrate how quickly they could navigate `G’Raph` on their
    scooters. At least they left their map with Ann.


    Ann found the mayor in his office, staring intently at a map of `G’Raph`.


    ![](images/00009.jpg)


    “Mayor, I have an important question for you,” started Ann.


    The mayor didn’t acknowledge her. He continued to stare at the map, mumbling to
    himself. He appeared to be tracing different paths with his finger. Ann started
    to panic. Had the wizard been here?


    After a moment, the mayor finally turned. “Edgar, this will never do. You need
    to redo it,” he snapped.


    “What?” asked Edgar. “That’s exactly what you requested: the `minimum-cost spanning
    tree`.”


    “The what?” asked the mayor with a confused look.


    “Umm, I have an important question here,” tried Ann, but nobody was paying attention.


    “It’s the set of bridges to upgrade,” Florence explained to the mayor.


    The mayor stood silently, not making the connection.


    Florence continued. “You asked for the cheapest set of bridges to upgrade such
    that you could travel between any two islands while only crossing stone bridges.
    Since the price is determined by the length of the bridges, we found the shortest
    set of bridges.”


    “Why would you need to connect all the islands with stone bridges?” asked Ann,
    forgetting her original question for the moment.


    ![](images/00031.jpg)


    “Nobody wants to be stuck at the dry cleaner’s after a dragon attack,” said Florence
    without additional explanation.


    “We need a stone bridge between City Hall and the library,” said the mayor.


    “That would add three meters,” responded Edgar. “It’s cheaper to connect the inn
    and the dry’s.” He pointed to the relevant bridges on the map to illustrate.


    The mayor started to argue, but Ann cut him off.


    “Interesting,” interrupted Ann. “You found the set of bridges to replace that
    will connect all the islands, while minimizing the total cost. Did it take you
    long?”


    “No,” answered Florence. “I used `Prim’s algorithm`.”


    “`Prim’s algorithm`?” asked Ann.


    “It’s a relatively simple algorithm,” said Florence. “You start with a random
    node and add it to a new set of connected nodes. In this case, I ‘randomly’ chose
    the library.”


    ![](images/00004.jpg)


    “Then you keep adding the closest node that isn’t in the set. Since we want to
    minimize the cost of each new edge, we define ‘closest’ to use the distance from
    the node to any node in the set. In this case, we first add the inn, which is
    five meters from the library.”


    ![](images/00040.jpg)


    “Then the brewery, which is seven meters from the inn.”


    ![](images/00076.jpg)


    “All very fascinating,” interrupted the mayor. “But the library and City Hall
    should have a new stone bridge between them.”


    “Edgar and Florence are correct,” said Ann. “The `minimum-cost spanning tree`
    doesn’t have a new bridge there.”


    “But … I walk that way every day,” said the mayor. “I’m tired of the wobbly old
    bridge. We need something new.”


    Edgar, Florence, and Ann all looked at each other. Edgar took a deep breath to
    start another algorithmic argument, but thought better of it. Edgar decided to
    submit both prices and let the mayor choose.


    Suddenly remembering why she had gone to the mayor’s office in the first place,
    Ann spun toward the mayor.


    “Mister Mayor, I think there’s a wizard casting a spell on the scholars of `G’Raph`,”
    Ann blurted out. “I think the city and all of its scholars are in danger.”


    Behind Ann, Edgar and Florence gasped in unison.


    ## The Game of Hamiltonian Paths


    A `Hamiltonian path` visits each node in a graph exactly one time. The problem
    of determining whether a graph has a `Hamiltonian path` is `NP-hard`.

