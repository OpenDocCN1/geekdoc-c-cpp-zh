    “You always take a move that will improve things. And sometimes you take a move
    that makes things worse, so that you can ultimately find better solutions.”


    The wizard stared at Ann with his mouth open. Ann noticed a small bead of sweat
    on his forehead. “That’s a `heuristic algorithm`—a series of guesses! It doesn’t
    guarantee that you’ll find the solution. It searches almost blindly.”


    “That’s true,” Ann agreed. “But it can do reasonably well most of the time.”


    “Most of the time?” asked the wizard.


    “Surely you know that there are no efficient, exact algorithms for `NP-hard` problems
    … yet. In fact, there might not be any efficient solutions. No one knows. But
    some algorithms perform quite reasonably on most cases.”


    The wizard took a step back and raised his staff. “What trickery is this?” he
    asked.


    “No trickery,” answered Ann. “It’s the same thinking as `expected-time algorithm
    analysis`. Worst-case performance of algorithms only tells you part of the story.
    My kindergarten teacher once learned the hard way when she—”


    “Enough!” the wizard bellowed.


    Ann smiled back condescendingly. “It seems that you underestimated the full range
    of computational analysis at my disposal. There’s a new world of analysis where
    algorithms and probability meet. Your curse has no power there.”


    “You have to be a world expert in `heuristic algorithms` and `expected running
    times` for this spell to have no effect,” objected the wizard. “How did you know?”


    “I found a few clues along the way,” Ann said.


    “This is not over!” the wizard shouted.


    He turned to leave—but found Terrible Todd blocking his retreat. The candlemaker’s
    apprentice grinned as he grabbed the wizard by the arms and lifted him. Ann had
    no doubt that he could detain the wizard a day or two until Marcus and Sir Galwin
    arrived. And there was clearly no need to worry about Todd falling victim to the
    `NP-hard` curse.


    “Yeah, it is over,” shouted Peter, as he peeked out from behind Ann. Then more
    quietly, he mumbled, “Totally worth giving up my season tickets.” He sounded as
    though he was still trying to convince himself.


    The wizard spun back to Ann. “I am just the beginning,” he proclaimed.


    “The beginning of what?” asked Ann.


    The old wizard laughed. “Chaos will engulf the entire kingdom. The computational
    foundations will crumble. It will be a new dark age.”


    “Why?” asked Ann.


    “The first step in taking over, of course,” said the wizard simply. The bluntness
    caught Ann off-guard. He continued, “Do you think your computational rule will
    last forever? I am just the beginning. Even if you break the kingdom’s computational
    thinkers from my spell, do you think you’re prepared for the challenges ahead?”


    ## Returning Home


    One year after she ventured forth to stop the darkness, Ann returned home to the
    castle. Trumpets announced her arrival, banners flew from every post, and a full
    honor guard lined her path. The castle had prepared a hero’s welcome. A year ago,
    Ann would have been thrilled at this celebration. Now, she just wanted to sleep.


    Ann proceeded directly to the throne room. Her father waited there, alone. He
    smiled proudly as she entered the room.


    “I have stopped the darkness,” Ann declared. “Or, at least, I’ve stopped the wizard
    who was trying to plunge the kingdom into a computational dark age. Marcus is
    still traveling around and undoing the damage.”


    “You did well,” the king declared. “I am very proud of you. Welcome home, Ann.”


    “Thank you” was all that Ann could manage. A small doubt continued to nag at her.
    She tried to push it down and bask in her success, but it refused to be quiet.


    King Fredrick noticed the look on her face. “What is wrong? You succeeded.”


    “I know,” answered Ann. “It’s just …” She trailed off.


    Her father waited for her to finish.


    “What if I hadn’t succeeded?” Ann asked, letting a flood of doubts rush out. “I
    came so close to failing. I’m not sure why it had to be me on this quest. I wasn’t
    prepared at all.”


    Her father sat silently, watching her. After a moment, he spoke. “That is why
    it had to be you; you had to learn. To be precise, the seer said that it needed
    to be the person of my choice who would venture forth alone. I believed that you
    could use the experience. And, anyway, you were not paying attention during the
    prophecy.”


    Ann was shocked at this revelation. “What if I had failed?”


    “I had confidence in you,” he said calmly. “Some things have to be learned through
    practice and application. It is not enough to read about the concept of quests;
    you must go out and apply them. You must experiment with techniques through trial
    and error.”


    Ann didn’t look convinced.


    The king grew serious. “Listen carefully, Ann. When you take the throne, there
    will always be new challenges. Some will be easier and some will be more difficult,
    but you must face them all. The fate of the kingdom will depend on you again and
    again.”


    She nodded, but the doubt continued to eat at her. “What if I can’t handle them?
    What if I’m not smart enough?”


    “Some of the building blocks you have already; others, you will learn. It is up
    to you to continue to learn how to apply them.”


    Ann left the throne room with a sense of unease. She was safe at home. She had
    succeeded in her quest; she had saved the kingdom from plunging into a computational
    dark age.”

