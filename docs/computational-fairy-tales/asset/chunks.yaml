    After witnessing the ship’s pointers in action, Ann became fascinated by all aspects
    of the ship’s operations. She spent hours observing the ship’s crew. Ann watched
    as the sailors hoisted sails, tied off ropes, cleaned the decks, and recorded
    headings. She marveled at the flawless skills of the seasoned sailors and at the
    stubborn clumsiness of a cook’s assistant. Driven by intense curiosity, Ann tried
    to learn as much as possible about each job.


    One morning, Ann even asked the caption if she could borrow a copy of the ship’s
    manual. Always eager to help, the captain soon returned with a 4,096-page `Sailor’s
    Manual` (3rd edition). Ann was shocked.


    “Why is it so large?” she asked.


    “There’s a lot to know,” responded the captain with pride. “It takes the average
    sailor five years to learn the basics and another thirty-five to learn the rest
    of the manual.”


    “I see,” Ann said. A forty-year education seemed rather excessive. Then again,
    it probably took years to simply read through the manual itself. In Ann’s experience,
    operational manuals were rarely quick reads.


    After thanking the captain, Ann took the manual to a quiet, shady corner. She
    flipped through, glancing at the different subjects. She skimmed past the many
    pages devoted to regulation beard lengths and the care of parrots. Finally, she
    selected the topic of securing the ship to the dock. The instructions occupied
    three full pages of tiny print. The level of detail astounded Ann. Each instruction
    spelled out every last aspect of the task.


    Ann read each line, trying to absorb the information. She even practiced the instructions
    for tying the ropes into knots (twenty-five lines long) on her own shoe laces,
    and then promptly berated herself for not recognizing the common granny knot.
    After about half an hour, she felt confident in her understanding of the procedure.


    The following section described how to secure a dinghy to the ship. Again, the
    section occupied three pages of tiny print. As Ann skimmed the pages, she began
    to recognize instructions from the last section. In fact, the twenty-five lines
    about tying the rope were absolutely identical. She flipped back and forth rapidly
    between the two sections to confirm.


    The next day, Ann approached the captain about this discovery.


    “How observant!” he congratulated her. “Many of the concepts are similar. For
    example, take ropes. There are only a few really good ways to tie knots.”


    “Then why repeat the instructions line for line?” asked Ann.


    “You need to do them each time,” answered the captain. “It would be horrible to
    skip the part about tying the knot. The dinghy would drift off. There was a terrible
    incident a few years ago with a canoe—”


    “I understand that,” Ann interrupted. “But you don’t need to repeat everything.
    Why not say something like: ‘Tie the rope with a granny knot’? It would save you
    a lot of space—24 lines in this section alone. All you need to do is to break
    out the common tasks into their own sets of instructions.”


    “That might make it much harder to understand the instructions,” said the captain.
    “Right now, every step is laid out perfectly. I can hand any sailor the thirty-five
    pages about trimming the main sail without having to assume any prior knowledge.
    It would surprise you how many new sailors don’t read the entire manual during
    their first week!”


    “Reusing core concepts would make the manual easier to understand,” argued Ann.
    “Once a sailor learns how to tie a specific knot, he or she could do it in any
    context. It would become a fundamental step itself—like a computer function.”


    “I guess it would make things shorter,” agreed the captain. “But really, the length
    of the book is not a problem. We also use the books for ballast, so having heavy
    books can be useful.”


    “It’s better than that,” argued Ann, ignoring the comment about ballast. “What
    if you found a better knot? Right now you’d have to change every single instruction
    that uses the current knot. It’d probably be a long and error-prone process. If
    you write the same thing a hundred times, you’ll make a mistake one of those times.
    You probably have dozens of mistakes in here already.”


    The captain winced sightly, and Ann wondered if the suggestion of possible errors
    had gone too far. Criticizing a captain was always risky.


    “What if you want to instruct a sailor to do something new, such as tie down a
    hot air balloon?” Ann continued. “Do you have instructions for that?”


    “Well, no,” admitted the captain. He instinctively reached for a notepad and jotted
    down a reminder to add a section on hot air balloons.


    “It would be easier to say: 1) Grab the rope, and 2) Tie it to the port railing
    with a granny knot. Those are instructions you can even give verbally. The sailor
    only needs to know how to perform a few basic functions to start.”


    The captain fell silent and stared out into the sea. After a moment he nodded
    slowly.


    “I think you’re right!” he declared loudly. After a few days at sea with him,
    Ann had realized that the captain was a big fan of declaring things loudly. More
    importantly, he was also open to improving processes whenever possible.


    Ann smiled.


    “I bet it goes beyond simply tying ropes. The signals we use to communicate can
    be broken off into functions too. And all of the lamps are refilled with the same
    procedure. And the decks are all mopped in the same way—counterclockwise mopping,
    of course. And there’s beard trimming …” The captain trailed off as he slowly
    looked around the ship, assessing the reuse of different skills.


    Suddenly, he spun back toward Ann. “Will you help me rewrite the book? We could
    break things up into these stand-alone units you describe. It would revolutionize
    the entire industry!”

