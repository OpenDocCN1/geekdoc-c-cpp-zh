  trans: '


    “我认为你遗漏的因素是：当大多数人使用插入排序时，插入操作是非常昂贵的，”管理员向彼特解释道，“想象一位正在试图给账本中的一个账户列表排序的会计师。每一行都是一个账户——就像计算机数组中的条目。你不能直接插入某个东西并让其他部分自动向下移动。那将需要一种极其枯燥的魔法。每当会计师想要进行插入时，他都必须手动将该位置以下的所有内容向下移动。单次插入是一个昂贵的
    `O(N)` 操作。这意味着大量的擦除和重写。”


    “但对于一个裁缝师来说，插入操作是一个简单的 `O(1)` 操作。他只需要把大衣往下一推，”管理员补充道。


    彼特点头认同。在内心，他对物理世界的这些细节影响了不同操作的成本感到不恼。理论世界要纯洁得多。然而，他确实同意管理员和裁缝师的观点；在这种情况下，插入排序似乎是合理的。他想，还有哪些现实世界的应用可能会挑战他的计算假设。


    当天晚些时候，彼特尝试对几辆推车的书籍进行插入排序。不幸的是，书籍在推车书架之间并不容易移动，彼特发现自己花了一整晚在书架之间移动书籍。他多花了三个小时才完成排序。他在凌晨
    2 点离开图书馆，对自己感到愤怒，因为没有在开始排序之前确定插入操作的成本。


    ### 霸凌者与冒泡排序


    泡排序是另一种简单的排序算法。该算法反复遍历数组，如果相邻元素顺序不对，则交换它们。结果是，较大的元素“泡”到数组的末尾，而较小的数字则“沉”下去。这个过程一直持续到数组排序完毕。与插入排序一样，泡排序的最坏情况性能为
    `O(N²)`。


    ***


    彼特已经排了两个小时队，感觉到肩膀被人拍了拍。他向后看去，感到一阵恐惧。可怕的**托德**（Todd）正愤怒地瞪着他。不过说回来，可怕的托德在彼特看来总是很愤怒。


    可怕的托德以他最近在亚历山大地区年度年度投掷石头比赛中的表现而闻名。他是第一位赢得主赛项目的蜡烛学徒。他获胜的一投使用了一块两百磅重的石头，震动两英里外都能感觉到。


    在非正式场合，他也因霸凌者而闻名。


    “嗨，托德，”彼特向他打招呼。他的声音很小，出卖了他的恐惧。


    托德哼哼了一声，示意彼特让开。在一种奇异的勇气驱动下，彼特坚持住了。他拒绝放弃自己在队列中的位置。东亚历山大足球队的季票销售将在一小时后开始。今年彼特决心要买到优质季票。他心心的是中场位置。


    “对不起，托德。我先来这里，”彼特解释道。


    托德从上到下量了彼特。然后，伴随着更大的哼哼声，托德把彼特拎起来，转了个身，把他放在了自己身后。


    ![](img/00075.jpg)


    ”嘿！”彼特叫道，但托德已经在拍排队中下下人的肩膀了。彼特短暂地考虑过拍拍托德的肩膀并和他对质，但他很快抛弃了这个念头。彼特见过托德获胜的一投。


    彼特气得发抖。这不公平。为什么托德可以排在前面？这些事情是有原则的。


    当彼特在脑子里默默抱怨时，他看着托德慢慢地在队伍中向前移动。一个接一个，托德和比小的人交换位置。托德的推进直到他遇到肌肉发达的铁匠瑞恩（Wren）时才停止。


    接着，彼特感到肩膀又被人拍了拍。转过，他看到了大吉姆（Big Jim）。彼特叹了口气，走到旁边让吉姆走在他前面。像托德一样，大吉姆也在队伍中向前方移动。令彼特高兴的是，吉姆甚至到了托德前面，占据了瑞恩之后的位置。


    现在，小迈克（Tiny Mike）站在彼特身后。彼特试图瞪着小迈克，明确表示迈克不能往前挪。迈克甚至没有尝试。


    ![](img/00065.jpg)


    这个过程又持续了一个小时。每当一个高大的人发现自己等在一个小的人后面，就会有人拍肩膀并交换位置。每当彼特在队列中后移，他就感到一天更加沮丧。由于身材矮小，彼特发现自己无法与任何人交换位置。小时结束时，整个队伍已经按身高排好了序，彼特在最后。心灰意冷的，彼特离开了队列回到图书馆。


    ![](img/00044.jpg)


    当彼特在图书馆柜台后面生闷时，他记得今年也可以通过鸽信购票。他匆忙填写表格，要求“可用最好的”。他借了图书馆的一只鸽子。鸽子扇动翅膀飞走了，带着彼特获得合理座位的唯一希望。


    十分分钟后，鸽子带着中排中场的确认单回来了。彼特激动了。座位离活动很近，而且在他最喜欢的花生卖贩所在的区域。他可能甚至在大吉姆之前就买到了票。


    那天，彼特学到了两个重要的教训。第一，泡排序对霸凌者非常有效。第二，在近乎即时的鸽信订票时代，排队并不值得。


    ### 合并排序与幼儿园的小朋友们


    合并排序是一种递归排序算法，基于两个直观原理：


    1. 排序非常短的列表很容易。事实上，排序只包含一个项目的列表是轻而易举的。

    2. 将两个已排序的列表合并在一起比排序一个长列表更容易。


    利用这些想法，合并排序可以简单描述为：“将数据分成两半，分别排序每一部分，然后将它们合并回来。”该算法非常高效，时间复杂度为 `O(N log N)`。


    ***


    当安沿着海岸向亚历山大城移动时，她看到一队从港口出发的船。她看到彩色的旗帜协调着船队的形成，她再次想起了在幼儿园第一次接触链表。


    '
- fmt: '

    At the command “Line up!” the class would split into two groups that were as close
    to equally sized as possible.


    ![](images/00021.jpg)


    ### Class before sorting

    ![](images/00032.jpg)


    ### First split

    Those groups would then each split into two smaller groups.


    ![](images/00066.jpg)

    ![](images/00062.jpg)


    The splitting continued (recursively) until each group contained only a single
    person.


    Then, groups would merge back together in the order in which they split. The merging
    started with each pair of students, who would merge back into their previous group
    of two. Each child would look at his or her partner and quickly line up in order.
    With only two people it was easy. A single quick comparison provided the order.


    ![](images/00011.jpg)


    After the groups of two were in order, the kids would merge into larger groups.
    Again, merging was simple—you only needed to compare the two kids at the front
    of the two lines. The child with the smallest value had to be one of the first
    two kids, because the lines were sorted. Or, as Mrs. Magee would say, “If you
    aren’t at the front of the line then you can’t come next. So stand still and wait
    your turn!”


    The first two kids would compare, and one would step forward to start the new
    sorted line.


    ![](images/00012.jpg)


    ### Merge Step 1

    Then the second smallest still had to be one of the front two kids. And so forth.


    ![](images/00074.jpg)


    ### Merge Step 2

    ![](images/00014.jpg)


    ### Merge Step 3

    ![](images/00001.jpg)


    ### Merge Step 4

    ![](images/00047.jpg)


    ### Merge Step 5

    The lines would quickly merge together, forming larger groups. Each merging step
    would effectively undo an earlier round of splitting, reforming the group in sorted
    order. This would continue until the entire class was in order.


    That’s how Mrs. Magee’s class won the sixth annual kingdomwide sorting championship.
    Her class was in order a full five minutes before the runners-up. In fact, Mr.
    Frizzle’s fifth graders were still comparing the numbers of freckles on their
    right arms when Mrs. Magee’s champions left for lunch.


    ## Sorting During the Flu Outbreak

    When selecting an algorithm, it is important to understand the context in which
    it will be applied. An algorithm’s computational complexity only tells part of
    the story. Other factors to consider include the size of the data, the existence
    of other constraints, and additional problem structure that can be used. For example,
    bubble sort is a reasonable algorithm to use for a tiny amount of data that is
    already almost in the correct order.


    ***


    For years, Mrs. Magee’s kindergarten class won every sorting competition in the
    kingdom. The powerful combination of constant practice and the merge sort algorithm
    made them unstoppable. The class decimated records weekly. Soon Mrs. Magee demanded
    more than just victory; her class had to finish sorting themselves in less than
    half the time of their competition. The only true victory was total domination.


    Soon Mrs. Magee became overconfident in the ability of her class. She firmly believed
    that her students could win regardless of the situation, and she had no problem
    explaining that to everyone she met.


    Then, in January, the flu hit. Almost all of Mrs. Magee’s class was out sick,
    leaving just three students. It was under these conditions that Mr. Wallace challenged
    her to a sorting competition. He also had three healthy students, so the classes
    were equally matched. But his second-grade class only understood the lesser bubble
    sort technique. His search could take `O(N²)` time!


    Mrs. Magee even agreed to allow the children to sort by something simple. After
    only a moment’s thought, Mr. Wallace suggested shoe size.


    As soon as the moderator shouted “Go,” Mrs. Magee’s class split into two groups.
    One group had two students, and the other had only one student. The merge sort
    had begun.


    In contrast, Mr. Wallace’s students looked at each other. Billy and Sue did a
    quick comparison in their heads and swapped places. All three were now in the
    correct order.


    “No!” wailed Mrs. Magee as she realized what had happened.


    It was too late. The competition was over.


    ## The Oracle’s Array

    Algorithms and data structures are used together to create complex programs. For
    example, one step of an algorithm might sort the contents of an array, or an algorithm
    might search for values in a binary search tree.


    ***


    “The oracle will have information,” Ann assured herself as she climbed the narrow
    mountain path. The oracle lived atop one of New Atlantis’s taller mountains. Ann
    had been climbing for eight hours.


    Ann chastised herself for not consulting the oracle earlier. While she could blame
    the long ocean voyage or the treacherous mountain paths, Ann knew the truth. She
    was afraid to face the oracle. According to legend, the oracle was alternately
    crazy and mean. Even after arriving in New Atlantis, Ann had spoken to almost
    a hundred people before seeking the oracle.


    As Ann rounded the final corner, she saw the oracle waiting in a chair by the
    path. The old woman watched her coldly. Ann tried to hide her fear.


    After a moment Ann recovered. “Madam Oracle, I’ve come to ask you for information.”


    “You want to know about the coming darkness?” asked the oracle. Her voice was
    raspy and her tone condescending.


    “You’ve seen it?” asked Ann.


    “No,” answered the oracle. “The quest is obvious. Your father has already consulted
    every seer in the kingdom. Except me, of course.”


    The oracle stared at Ann. Her expression was a mixture of anger, disgust.


    The oracle appeared not to notice the statement.


    “Why should I help you now?” asked the oracle.


    Ann took a deep breadth and started her argument. “The darkness will threaten
    all of kingdoms. The fate of the world depends on—”


    “Oh, you practiced a speech,” cackled the oracle. “I love it when they practice.
    Did you learn a dance too?”


    Ann was taken aback. “Excuse me?”


    “Ha!” spat the oracle. “Do you think this is the first time I’ve heard ‘please
    save the world’ speech?”


    “Madam Oracle—” Ann began, but the oracle cut her off with horrible snorting laughter.


    After a minute, the oracle calmed down. “What do you want to know?” asked the
    oracle. The laughter had vanished, and she returned to staring at Ann in disgust.


    “You’ll … help me?” asked Ann, now thoroughly confused by the interaction.


    “Have you listened to a word I said?” asked the oracle. “I’ve heard that speech
    a thousand times. That means I also know you won’t leave without getting your
    information. And I want you to leave. Soon.”


    “Oh,” said Ann.


    “What do you want to know?” the oracle asked again.


    “I want to know about the darkness,” said Ann.


    “I’m not stupid. We covered that part,” responded the oracle. “What do you want
    to know about the darkness? What it is? How to stop it? Whether it has a favorite
    poet? I’ll only answer one question for you.”


    Ann responded instantly. “I want to know how I can stop the darkness.”


    The oracle looked disappointed, but nodded. She shifted herself from the chair
    onto the ground and began working. First, she produced a large stack of cards
    and shuffled them. Then she started laying the cards out on the ground, eight
    cards in a line. On each card was printed a word in a language that Ann didn’t
    know, an arrangement of bright circles, and a number at the bottom. One of the
    cards was except for the number `999`.


    ![](images/00069.jpg)


    The rhythm of the oracle’s motions mesmerized Ann. “While there aren’t eight cards
    on the ground, add another card to the line,” Ann muttered under her breath, describing
    the oracle’s motions as a loop. She had no idea why she had said that.

