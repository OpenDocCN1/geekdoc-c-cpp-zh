- fmt: '

    “Why make every apprentice repeat the work?” asked Peter. “Breadtista could simply
    copy his best recipes, right?”


    “Learning to write a good recipe is part of the education. As Breadtista often
    pointed out, the key to a great recipe is capturing the perfect amount of information.
    Where other bakers wrote recipe books filled with lists of bland instructions,
    such as ‘Add two eggs and blend well,’ Breadtista insisted on adding comments
    to his recipes. He used wonderful comments that added context and the perfect
    amount of explanation.”


    Peter looked unconvinced. In his time as the librarian’s apprentice, he couldn’t
    remember a single instance when he had needed additional context. When the master
    librarian gave instructions, Peter wrote them down verbatim.


    “Here,” said Ann as she pulled an old notebook out of her bag. “Here’s Breadtista’s
    recipe for his famous eight-chili strawberry muffins.”


    `Step 5: Cut the strawberries into cubes of 1 cm per side. [This size allows the
    flavors to blend while preserving the fruit’s texture.]`


    `Step 6: Add the strawberries to the dough.`


    `Step 7: Gently stir until the strawberries are mixed into the dough.`


    “The comments have the brackets around them,” explained Ann, pointing at the symbols
    `[` and `]`.


    “I guess it’s useful to know why the strawberries should be that size,” said Peter.
    “How else do you use comments? Can you provide information about how you thought
    up a recipe?”


    Ann shook her head adamantly. “Comments should always provide information meaningful
    to the recipe itself. Breadtista would rant for hours about recipe books by famous
    castle chefs that contained thirty-page digressions on the author’s lifelong quest
    for the perfect pancake. He considered it especially egregious if the recipe then
    produced chewy pancakes. As he would say: ‘Pancakes should not be chewy, and comments
    should not be life stories.’ He felt strongly about it.”


    “Did it take you long to learn to write good comments?” asked Peter.


    Ann started laughing. “It took me a month to write any comments at all. I didn’t
    see the use of them. I’d complain and say things like ‘I won’t forget what I did’
    and ‘Isn’t that step obvious?’ I was such a pain.


    “But Breadtista was patient. He would always give the same answer: ‘Just because
    it’s obvious to you at this moment doesn’t mean you won’t forget it, or that someone
    else won’t need an explanation when they read the recipe.’ He gave a very logical
    argument, but I still ignored it.


    “Then Breadtista found the perfect way to reinforce the importance of good comments.
    He started making me work from the worst notes of previous students. It was agonizing.
    Sometimes I had no idea what the instructions meant. Other times, they went on
    forever.”


    Ann flipped a few pages back in her notebook. “Look at this mess!”


    `Step 1: Measure out 1/4 of an ounce of yeast into a small bowl. [We put it into
    a bowl so that we can add water in step 2 to activate the yeast.]`


    `Step 2: Add two tablespoons of warm water to the bowl with the yeast. [We add
    the water to the bowl in order to activate the yeast.]`


    `Step 3: Wait 5 minutes. [We wait 5 minutes in order to allow the yeast to activate
    in the water.]`


    “A third-year apprentice wrote that recipe,” Ann explained. “It was horrible.
    I never made it past step 85 in that recipe. In fact, I ‘accidentally’ spilled
    a full pitcher of water over the parchment so as to spare anyone else from reading
    it.”


    Ann sighed. “After that, I learned the value of good comments. It turns out that
    nothing reinforces the concept of understandable, well-documented recipes more
    than having to read other people’s recipes.”


    “And the quicksort scroll?” asked Peter, returning to the topic at hand.


    “Well-commented,” answered Ann with a smile.


    “Sure. But does it have the information you need?”


    Ann looked worried. “Is has some of it—a direction at least. We still have so
    much work to do. But I fear we don’t have much time left.”


    # The Curse of Excessive Commenting


    Good comments can improve the readability of code. However, overcommenting can
    do the opposite. Unnecessary comments waste both space and the reader’s attention
    without adding value.


    ***


    The New Athens blacksmith, Drex, had been cursed. Drex freely admitted that he
    had provoked the wizard Marcus, but the curse seemed like an extreme reaction.
    The wizard could have simply insulted him back or walked away. There were plenty
    of reasonable options. He didn’t have to curse Drex.


    As much as the curse annoyed Drex, his apprentice Rachel suffered more. The Curse
    of Excessive Commenting was designed to annoy both the teacher and the student.
    Whenever Drex explained something, he now did it in excruciating detail.


    “Watch how I form this hinge,” Drex instructed. “First I pick up the metal with
    these large tongs. They are made of a heavier metal, so they won’t burn or melt
    in the fire. Then I use the tongs to put metal in the fire, where it will heat
    up.”


    As he spoke, Drex grabbed a small blob of metal with his tongs and shoved it into
    the fire. After a moment, he felt obligated to add, “I’m still heating it up in
    the fire.” He reiterated this observation five more times before the metal was
    hot enough to work.


    “Now, I use the hammer to flatten the metal,” Drex explained. “I’m hitting the
    metal with the hammer. I’m hitting it again. I’m hitting it again.”


    Rachel stood off the side, watching. After the tenth repetition, she rolled her
    eyes. Not only were these descriptions annoying, but it also made it hard to follow
    what was going on. The constant stream of details overran the concept of forming
    the hinge. The first time Drex had described the process of making a hinge, it
    had been simple. He had left unspoken the low-level details that any blacksmith
    should easily pick up: to flatten out a piece of metal you heat it and hit it
    with a hammer.


    The commentary was driving Rachel crazy. She thought back bitterly to the encounter
    with the wizard three days ago. Drex had confronted Marcus to complain about his
    magic candle. The candle had burned out, which magic candles should never do.
    When Drex had discovered that the wizard’s apprentice had created the candle,
    he had made the fateful mistake of insulting Marcus’s teaching skills. “At least
    I tell my apprentices what they need to know,” Drex had bragged. It turned out
    to be a mistake to taunt a sleep-deprived wizard at two in the morning.


    I was hitting it again.


    # Data Structures for Research


    Data structures can often be used as core elements of complex algorithms. In these
    cases, data structures do more than just store data. They organize the data and
    help make operations, such as finding a specific value, efficient.


    ***


    “You want them right here?” asked Peter. He motioned toward a tall stack of books.
    He had serious doubts about the pile’s stability.


    “On top,” said Ann without looking up. “I should also have some more requests
    in a minute.”


    “Are you sure you want them on top?”


    Ann looked up in surprise. “Of course I’m sure. I have a system.”

