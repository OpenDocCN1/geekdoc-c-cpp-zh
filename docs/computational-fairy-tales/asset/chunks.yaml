  raw: '“Mister Mayor, I think there’s a wizard casting spells on the scholars of
    G’Raph,” Ann repeated. “Everyone to whom the wizard has spoken has become obsessed
    with finding an efficient, exact solution to a specific NP-hard problem. Have
    you heard any stories about a stranger in a dark cloak asking scholars NP-hard
    computational problems?”


    The mayor looked confused. “NP-hard? I’m not exactly sure what that means, but
    I had a man in a dark cloak ask me a hard question once.”


    “You did?” asked Ann, Edgar, and Florence in unison. None of them could hide the
    shocked looks on their faces.


    “Yes,” answered the mayor. “It was about twenty years ago—right after I left school.
    He had just come from the library. I think he stopped to talk to Geoffrey about
    some salesman problem. Geoffrey was my favorite teacher, you know. He would always
    have the easiest tests. Anyway, the man asked me if I could solve a game: find
    a path through G’Raph such that I go through each island at most one time.”


    “The Hamiltonian Path problem,” stated Edgar. “It’s also NP-hard.”


    “It’s related to Geoffrey’s traveling salesman problem,” added Florence.


    “But why did the wizard ask you about Hamiltonian paths?” Ann asked, trying to
    phrase the question tactfully. From her limited time with the mayor, he had yet
    to strike her as one of G’Raph’s great scholars.


    The mayor shrugged. “I don’t know, but it sounded like a fun game.”


    “It’s a popular game in G’Raph,” Edgar agreed. “We played Hamiltonian paths as
    kids. We would draw out different hopscotch graphs and have to traverse them in
    Hamiltonian paths. Of course, you weren’t allowed to solve them ahead of time.
    You had to determine the Hamiltonian path as you were hopping. If you got stuck
    or stepped on the same node twice, you were out.”


    Ann looked skeptical. “You really played that as a kid? That was how you spent
    your childhood?” she asked.


    Edgar smiled at the fond memory. “Those were good times,” he answered.


    “What did you say to the wizard?” Ann asked the mayor. “You didn’t solve it, did
    you?”


    The mayor smiled. “I sure did. I told the man in the cloak: ‘That’s easy. I would
    just build a few more bridges.’ The man left shortly after that. I think he said
    something about my future as a politician.”


    “That’s cheating,” objected Edgar. “You can’t add bridges in a game of Hamiltonian
    paths!”


    “Mister Mayor,” interrupted Ann. “Do you know anyone else who met the wizard?”


    The mayor thought for a moment. “Not here in G’Raph. But I had an intern who told
    me a story that sounded similar to what you’re claiming. He had a good friend
    in the town of Bool who became obsessed with one of these hard problems. What
    did you call them? NT? ND?”


    “NP,” offered Ann.


    “Sure, sure. Anyway, my intern’s friend had a fun little problem called 3-SAT
    or something like that. Sounded like the type of thing you would find in the Sunday
    paper.”


    “The town of Bool? Are you sure?” asked Ann.


    The mayor nodded. “You always know a Boolean when you meet one.”


    Ann couldn’t agree more. At the thought of Bool, her mind flashed back to Dr. Conjunctione
    and his insistence on solving 3-SAT. In that instant, the scope of the problem
    became frighteningly clear.


    After a few more minutes of discussion, Ann decided that she wasn’t going to find
    any more answers here. She knew that there was a wizard who was casting spells
    on computational scholars; now she had to figure out why.


    For the first time in her quest, Ann knew where to go next. She needed to pay
    a visit to the one place where she might find more information about NP-hard problems:
    the Library of Alexandria.


    COMPUTATIONAL THINKING


    ![](images/00061.jpg)


    Reflections on Algorithms


    Complex algorithms build on a core set of fundamental concepts. Mastering these
    basic concepts and learning to combine them is the key to solving new problems.


    * * *


    For the millionth time, Ann wished that she had a better algorithm for solving
    quests. She wanted something that required less guessing and that guaranteed a
    solution. Most of all, she wanted something fast. After nearly a year of searching,
    Ann was tired.


    As she looked down at the rugged dirt road, her mind wandered back to her time
    at G’Raph and the algorithms she learned there. Those algorithms, such as Dijkstra’s
    shortest-path algorithm and Prim’s algorithm for minimum spanning trees, went
    beyond anything that Ann could have imagined a year ago. Yet these new algorithms
    used concepts Ann had learned in first grade.


    Dijkstra’s shortest-path algorithm was based on a few simple loops:


    WHILE there are unvisited nodes …


    FOR each of the neighbors of the current node …


    Similarly, Prim’s algorithm was just a loop that added new nodes to a set until
    there was nothing left to add. It also required updating and finding “close” nodes.


    Everything she learned in G’Raph built on the core set of computer science concepts
    she had learned in school. As this realization struck Ann, a burst of hope flowed
    through her. She had the tools to solve this quest. Now she needed to figure out
    how to apply them.


    Computational Graffiti


    Recursion can allow a complex algorithm to be specified in a short, simple, and
    often beautiful form. A function calls itself on a subset of the data, using the
    results from those subproblems to form the final solution. However, recursion
    can also add computational overhead due to the new recursive function calls.


    * * *


    While traveling to the Library of Alexandria, Ann could see the signs of chaos
    engulfing the kingdom. The traditionally smooth operation of the kingdom’s services
    barely squeaked along under the burden of additional complexities. Overhead, the
    pigeons of the kingdom’s vast carrier network flew about aimlessly. The postal
    carriers had stopped sorting the mail before embarking on their delivery routes.
    Instead, they stood in front of each mailbox and flipped through their full bags
    to find that house’s letters. Everything was a mess.


    Ann first noticed the computational graffiti in the outskirts of Alexandria. Initially,
    it looked harmless—the rebellious proclamations of teenagers: “DFS rulez” or “Dynamic
    Programming FTW.” However, the signs soon became more troubling: “Say ‘No’ to
    Big-O” and “BRUTE FORCE ALGORITHMS FOREVER.”


    At first, Ann thought these signs were jokes. Who would argue against an efficient
    algorithm? The absurdity made them almost amusing.


    Then, Ann saw a message that stopped her cold:


    `int RecursiveAdd(int n, int m) {`


    > `if (m == 0) return n;`


    > `return RecursiveAdd(n, m-1) + 1;`


    `}`


    The recursive algorithm for adding two numbers covered the entire north wall outside
    a florist’s shop. It was written in the classical language of C, which Ann had
    learned in school. While it was technically valid, the sheer inefficiency of the
    approach shocked Ann.


    For example, given n= 10 and m = 5, the function would be called a total of six
    times!


    User calls: RecursiveAdd(10, 5)


    Recursive call: RecursiveAdd(10, 4)


    Recursive call: RecursiveAdd(10, 3)


    Recursive call: RecursiveAdd(10, 2)


    Recursive call: RecursiveAdd(10, 1)


    Recursive call: RecursiveAdd(10, 0)


    Mercifully, the recursive chain would stop after the sixth call. The last call
    would return 10\. The next call would add 1 to that result and return 11\. This
    process would continue to work its way back up until the top level function returned
    (10 + 4) + 1 = 15.


    Why take a simple mathematical operation, m+ n, and specify it as a chain of m +
    1 function calls? The overhead was staggering. The graffiti clearly pointed to
    the complete collapse of computational thinking.


    Tearing herself away from the disturbing image, she broke into a full run. There
    was no time to lose.


    The NP-Hard Curse


    NP-hard is a class of computational problems for which there are no known efficient
    and exact algorithmic solutions.


    * * *'
