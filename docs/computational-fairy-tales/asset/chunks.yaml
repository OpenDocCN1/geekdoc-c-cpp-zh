    经理等待着 Casey 看到解决方案。这并不是一道难题。最后，两分钟后，经理意识到 Casey 根本没法想出来。


    “用那个空水箱作为临时存储，”经理提示道，“第一，把灯真鱼放入空水箱。第二，将虎马灯移到旧的灯鱼缸。第三，将灯真鱼移到旧的虎马灯缸。”


    “但这意味着有三次移动操作。我知道我可以在两次内完成，”Casey 回答道。他决心要证明自己是一个优秀的员工。


    经理叹了口气。“不行。你不能。你需要使用临时存储。否则，你最终会把虎马灯放进灯鱼缸，从而引起问题。”


    Casey 想反驳，但他想不出更好的办法。“好吧，”他终于同意了。


    经理看着 Casey。虽然他半信半疑 Casey 能处理好这次鱼类调换，但他担心 Casey 之后会做些愚蠢的事。


    “办完后来找我，”经理交代道，“顺便离乌龟缸远一点，”他补充道以防万一。


    ![](img/00003.jpg)

    ![](img/00033.jpg)

    ![](img/00024.jpg)


    ## 指针和嵌入式橱


    指针（Pointers）是持有特定类型数据的变量：计算机内存中的地址。使用指针的一个主要优势是它们在与内存中存储的数据交互时提供的灵活性。单个相对较小的指针就可以指向内存中大块数据的位置，允许函数无需传递整个数据块本身即可访问数据。程序员还可以通过使用指针链接数据块来创建复杂的数据结构。


    ***


    强大的巫师马库斯住在新亚特兰斯市中心的一栋小排屋里。那里租金很高，景观也很糟糕，但这就是住在市中心的代价。老实说，这两个因素都没有扰到马库斯。令他恼的是排屋的大小。多年来，马库斯积累了很多物品，他喜欢有一个地方存放它们。但排屋只有一个衣柜，而且小得可怜。


    作为一名强大的魔法师，马库斯转向魔法解决方案来改善局面。首先，他缩小了自己的物品，让所有东西都能装进衣柜。然而，他再也在那堆微小物品中找不到任何东西。一天晚上，他在地板上拿着放大镜待了两个小时，寻找他最爱的巫师帽。结果，他约会时迟到了非常晚。


    接着，他尝试将他的财产脱水成粉，并放在有标签的罐子里。他的衣柜很快看起来像一个调料架。不幸的是，衣服重新加水后完全浸透了，一次时机不妙的喷嚏就把他最爱的斗篷散落在整个客厅里。马库斯很快也放弃了这个想法。


    最后，他有了一个惊人的发现。他不需要把所有的财产都存在这里。只要他在需要时可以轻松取出它们，他就可以把它们存在任何地方。


    他在乡村郊外买了一座巨大的城堡来存放物品。当他需要某个物体时，他就会召唤它。同样，当他用完时，就会把它送回去。这个过程有效地给了一个巨大的虚拟衣柜。


    在很短的时间内，马库斯发现自己有了一个新问题。他不再记得城堡里有什么，甚至不知道还剩下多少空间。过去几年的时尚被遗忘在城堡的走廊里。他发现自己经常会随机地从城堡的不同房间里召唤物品，只为了看看那里有什么——这个过程导致了一个令人不安的发现：一个两年前的蓝莓松芬。马库斯需要一个更好的系统。


    为了追踪他在城堡存储的物品及其位置，马库斯创建了一个正式的会计系统。他将城堡分成一个巨大的、带有标签的网格。然后他创建了一卷列出所有物品的卷轴。每当他将一个物品发送到城堡时，他都会仔细记录一个发送该对象的指针。使用这卷卷轴，他就可以找到召唤任何物品的位置。他只需要在市中心的排屋里保留一个小小的指针卷轴。这个系统运行良好。


    ![](img/00008.jpg)


    或者，至少这个系统在大多数时候运行良好。偶尔，马库斯会粗心，忘记记录他把物品发送到了哪里。结果物品丢失了，城堡内部的空间被浪费了。其他时候，马库斯会在发送物体到那里之前忘记检查空间是否可用。一天晚上，从派对回来后，他不小心将外套发送到了与无价花瓶相同的位置。当大外套出现在花瓶内部时，花瓶爆炸了。这些就是粗心对待指针时固有的危险。


    尽管偶尔会有意外，系统仍然运行良好。马库斯学会了仔细跟踪卷轴中的所有内容，并在新亚特兰斯市最时尚街区的小排屋里幸福地生活着。


    ## 链表和洋海之旅


    链表（Linked lists）是存储项目列表的数据结构。列表中的每个节点由几部分数据组成：存储在该节点上的信息（或指向该信息的指针）、指向列表中下一个节点的指针，以及（可选的）指向列表中上一个节点的指针。算法可以通过简单地沿着每个节点外的指针指向下一个节点来遍历列表中的项目。链表允许用户通过更改相应节点的指针来轻松插入和删除元素。


    ***


    Ann 对她前往新亚特兰斯神谕的洋海之旅感到兴奋了大约二十分钟。她站在船的栏杆上，看着海岸线远离，感受海风拂在脸上。船的帆在捕捉风时发出了悦耳的拍打声。这令人心潮澎湃。然后，令她非常失望的是，船开始了一系列令人作呕的摇晃和颠簸。


    Ann 裹紧衣服抵御（变得寒冷的）风，坐在船甲板上，看着跟在后面的三艘船。第一艘在后面四百米处，第二艘在之后四百米处，第三艘又在四百米处。此外，Ann 知道还有一艘船在领先，在他们前方四百米处。五艘船共同构成了一个横跨海洋的里长船队。


    ![](img/00029.jpg)


    Ann 发现链队的安排非常迷人。当她询问船长关于链队的线性安排时，他愉快地详细解释了该线的功能。链队由一组沿着同一路线航行的船组成。头船引导链队。这种安排便于导航和安全。


    船只之间的通信也让 Ann 着迷。每艘船都有两个特殊的成员，被称为指针，负责与其他船的通信。一艘船后方的指针可以使用色彩鲜艳的大旗帜与后续船前面的指针进行通信。遗憾的是，直到船长说了一句，Ann
    才意识到指针正在传递信息。老实说，看起来他们他们是在友好互动，也许是太热情了。


    当 #2 号船想向 #5 号船传递消息时，#2 号船后方的指针会向 #3 号船前面的指针发出信号。同样，通过指针，#3 号船会将其转给 #4 号船，然后由
    #4 号船转给 #5 号船。这是一个完全线性的系统，消息在传递过程中经过了每一艘船。


