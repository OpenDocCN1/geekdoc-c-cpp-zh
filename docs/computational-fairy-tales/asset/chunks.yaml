    从农场出来，她过了另一座桥，来到了另一个（较小的）萝卜菜场。从样子上看，这个农场显然比托马斯的农场成功得多。安停顿了一小会儿，思考为什么这两个几乎无法区分的泥岛之间，萝卜生长性能会有这种差异。她迅速将这个问题抛出脑后，继续她的寻找。


    安再次面临桥梁的选择。她从右侧的路径开始。让她松了一口气的是，这桥桥通向学校。


    ![](img/00052.jpg)


    安跑到学校，佛罗伦斯和埃德加正在那里等着。埃德加手里拿着一张折叠好的 `G’Raph` 地图。安再次埋备自己没有带地图，她本可以避免很多回路白走的。


    “你做到了！”埃德加惊呼道，“我担心你没有地图会迷路。”


    “我确实迷路了，”安承认道，“或者说，我撞了几个死胡同，不得不回路。”


    “啊，这是一个`depth-first search`，”佛罗伦斯注意到，“不错。”


    “`depth-first search`？”安问道，因为跑了路有些喘不过气。


    “`depth-first search` 是指你沿着一条路径不断探索，直到遇到死胡同或你之前见过的节点。然后你回溯到最近的决策点并尝试不同的选项。如果那个点没有新选项了，你就再次回溯。”埃德加解释道。


    “通过`depth-first search`，你不断向更深处探索，直到来到一个死胡同，”佛罗伦斯补充道。


    “或者找到你寻找的东西，”埃德加补充道。


    “说得好，”佛罗伦斯回答道，“你也可以找到你寻找的东西。埃德加，记得我们上次在那本选择冒险小说上使用 `depth-first search` 的时候吗？”


    “真是有趣的时光，”埃德加回答道。他望着天空，仿佛在脑海中重放那段记忆。


    安太累了，无暇欣赏自己那番疯狂奔跑中的算法之美。一张地图本可以让她避免亲身体验 `depth-first search`。


    学校校长看到这群人站在外面，走出来查看。


    “打扰了，”他用那种每位校长似乎都精通的严厉语气说道，“你们是谁？为什么要在这里？如果你们是卖闪闪卡的，请继续走吧。我们不从旅行闪闪卡销售员那里买东西。”


    “你见过一个穿着深色斗篷的奇怪男人吗？”安问道，没忙介绍自己或回答他的任何问题。


    “嗯，是的。你为什么问这个？”校长问道。


    “他和别人说话过吗？”安再次忽略了校长的问题。


    “他和我们的一位优等学生伊丽莎白聊过，”校长回答道，“他对某个数学问题有些疑问。我也在那里，但老实说，我不明白他在说什么。


    “不过，伊丽莎白似乎确定她能解决。她直接回家去研究了。她很聪明，你知道的。可能是我们学校教过的最优秀的学者。她会找到答案的。”


    “你知道问题是什么吗？”安问道。


    “是关于岛屿和桥的。我想他称它为`vertex covering`。我以前没听说过，但听起来很有趣。”


    “另一个经典的`NP-hard` 图形问题，”埃德加愉快地说，“我也研究过那一个。”


    安感到心里一沉。


    现在伊丽莎白，`G’Raph High School` 的优等生，也变得痴迷于此。她和杰弗一样落入了同样的魔咒。


    巫师盯定了两个优等学者。遗憾的是，安不知道为什么。


    ## 桥梁升级


    无向图的`minimum spanning tree`是最小边集，使得所有节点都相互连接（如果可能的话）。同样，在加权图中，`minimum-cost spanning
    tree`是总权重最小且连接了所有节点的边集。


    * * *


    安直接去了市政厅，她希望在那儿能找到更多关于那个神秘巫师的信息。佛罗伦斯和埃德加决定加入她。或者更准确地说，他们决定展示一下他们骑着板车能多快地穿梭于 `G’Raph`。至少他们把地图留给了安。


    安在办公室找到了市长，他正专注地盯着一张 `G’Raph` 的地图。


    ![](img/00009.jpg)


    “市长，我有一个重要的问题要问你，”安开始说道。


    市长没有理会她。他继续盯着地图，自言自语地嘟囔着。他似乎在用手指追踪不同的路径。安开始恐慌。巫师来过这里吗？


    过了一，市长终于转过身。“埃德加，这绝对不行。你需要重做，”他厉声说道。


    “什么？”埃德加问道，“那正是你要求的：`minimum-cost spanning tree`。”


    “什么？”市长带着困惑的表情问道。


    “嗯，我这里有一个重要的问题，”安尝试道，但没有人注意。


    “这是需要升级的桥集，”佛罗伦斯向市长解释道。


    市长沉默地站着，没有对上号。


    佛罗伦斯继续说道：“你要求一组最便宜的桥进行升级，以便你可以在任何两个岛屿之间旅行时只跨越石桥。由于价格是由桥的长度决定的，我们找到了最短的桥集。”


    “你们为什么需要用石桥连接所有岛屿呢？”安问道，暂时忘了她原本的问题。


    ![](img/00031.jpg)


    “在龙的袭击后，没人想被困在干洗店，”佛罗伦斯在没有额外解释的情况下说道。


    “我们需要在市政厅和图书馆之间有一座石桥，”市长说。


    “那会增加三米，”埃德加回答道，“连接酒馆和干洗店。”指向地图上相关的桥。


    市长开始争论，但安打断了他。


    “有趣，”安打断道，“你找到了一组可以连接所有岛屿且成本最低的桥。你花很久了吗？”


    “没有，”佛罗伦斯回答道，“我使用了 `Prim’s algorithm`。”


    “`Prim’s algorithm`？”安问道。


    “这是一个简单的算法，”佛罗伦斯说，“你从随机节点开始，将其加入一个新的节点集合。在这种情况下，我‘随机’选择了图书馆。”


    ![](img/00004.jpg)


    “然后你不断添加不在集合中的最近节点。由于我们想要化每条新边的成本，我们将‘最近’定义为节点到集合中任何节点的距离。在这种情况下，我们首先添加酒馆，它距离图书馆五米。”


    ![](img/00040.jpg)


    “然后是酿酒厂，它距离酒馆七米。”


    ![](img/00076.jpg)


    “这些很有意思，”市长打断道，“但图书馆和市政厅之间应该有一座石桥。”


    “埃德加和佛罗伦斯是正确的，”安说，“`minimum-cost spanning tree`在那里没有新桥。”


    “但是……我每天都走那里，”市长说，“我受够了那座摇晃的老桥。我们需要新的。”


    埃德加、佛罗伦斯和安互相看着。埃德加深吸了一口气准备开始另一场算法争论，但又改变了主意。埃德加决定提交两个价格让市长挑选。


    突然想起她为什么要去市政厅，安转向市长。


    “市长先生，我觉得有一个巫师对 `G’Raph` 的学者们施咒，”安脱口而出，“我觉得这座城市和所有的学者都处于危险之中。”


    在安身后，埃德加和佛罗伦斯同时吸了一口气。


    ## 哈密路径游戏


    `Hamiltonian path` 访问图中的每个节点一次。判断图中是否存在 `Hamiltonian path` 的问题是 `NP-hard`。

