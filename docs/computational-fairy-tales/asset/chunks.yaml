  trans: '

    Ann 回头看着他。“那你是什么什么意思？”她问道。


    “巫师诅咒了所有的学者，所以他们不再开发任何新算法了。我明白，这很糟糕。但为什么它会这么快地影响其他所有方面？王国堕落到这种程度应该需要一段时间吧，对吗？并不是每个人每天都需要一个新算法。它又不是潮湿储藏室里的面包，算法不会随着时间的推移而变绿长霉的。”


    “噢，对了……那个，”Ann 说道，声音里的活力消失了殆尽。


    Ann 沉默了一会儿。她看着 Peter，仔细地审量着他。Peter 明显地感觉到，自己可能不喜欢接下来的话。


    “情况比那糟糕得多，”Ann 终于说道。


    “更糟？”Peter 问。


    “更糟，”Ann 确认道。


    “呃，怎么个糟？”Peter 紧张地问。


    “我想这些咒语针对的不仅仅是学者，”Ann 解释道，“诅咒正在渗透到生活的各个方面。它在利用学者——利用他们来针对算法本身。你诅咒了一个排序专家，你就诅咒了排序算法本身。巫师正在瓦解王国计算的基石。”


    “噢，”这是 Peter 唯一能说的话。他的腿突然似乎有些发软。他摸索着找了椅子，把它拉到身后，然后坐在了上面。


    “噢，”他重复道。


    “是啊，”Ann 同意道。


    “所以？”Peter 问。


    “我必须停止它……快一点。”


    ## 快速排序信息


    `Quicksort` 是一种递归排序算法，类似于归并排序。像归并排序一样，`quicksort` 将元素分为组，递归地对这些组进行排序，并将结果合并成一个单一有序列表。与归并排序不同，`quicksort`
    在分区时使用了元素的值。`Quicksort` 选择一个随机元素，称为 `pivot`（基准值），并将当前列表分为两个子列表：小于或等于 `pivot` 的元素和大于
    `pivot` 的元素。由于列表是根据值划分的，因此合并操作仅需将一个排序列表追加到另一个列表之后。


    `quicksort` 的最坏情况性能为 `O(N²)`。然而，`quicksort` 的平均时间为 `N log N`。事实上，`quicksort` 的速度可以比其他
    `O(N log N)` 排序算法（如归并排序）更快。


    ***


    “你在做什么？”Ann 问。


    “收书，”Peter 回答道，“我们让顾客把书留在这里给我们处理，因为他们想要帮忙时总是会把事情搞乱。他们把书拿回原来所在的普通区域，看到一个空隙，就把它塞进去。这弄乱了整个顺序。你真应该看看他们对那些卷轴是怎么做的。”


    “好吧，”Ann 同意道，“但你现在在对那些书做什么？”


    “对它们进行排序，”Peter 回答道，“在这里排序更容易。这样我就可以按顺序检查书架（注：此处原文为 stacks，通常指书堆或书架）并把书收好。这就像是一个庞大归并排序的合并步骤。这节省了很多时间。”


    “但你是怎么排序的？看起来你简直像是在随机挑选东西。”


    “噢，”Peter 说道，“这是一个会计师教给我的新花样。她叫它 `quicksort`。它的最坏情况大圈复杂度非常糟糕，但实际上运行效果相当不错。”


    “一个会计师？”Ann 问。


    “我觉得她在一家农场动物局工作，但她似乎很懂排序。不过，她显然不是计算专家，否则她会知道这个 `quicksort` 的最坏时间是 `O(N²)`。想象一下要给超过几层架的书排序——”


    “Clare O’Connell？”Ann 打断了他。她站起来，死死地盯着书推车。


    Peter 停顿了。在 Ann 在图书馆工作的五天里，她几乎没有抬起头看书。她对重新整理书籍突然产生的兴趣让他感到不安。她现在竟然在关注他，这更让他感到不安。


    “听起来很耳熟，”Peter 犹豫地回答道。


    “全告诉我，”Ann 命令道。她现在站在他身边，仍然盯着书架。“她说了什么？”


    “呃，好的……是的，她几周前来这里拿过一卷关于牛——或者火鸡——或者某种动物的卷轴。不过我很确定是牛的。”


    “排序的事呢？”Ann 追问道。


    “她只说有更好的排序方法，”Peter 说道，“她向我展示了这种她称为 `quicksort` 的算法。你从一堆要排序的书开始。随机选一本书。你称那本书为
    `pivot` 书。”


    “然后你用 `pivot` 将堆分成两个较小的堆。`pivot` 之前的书放在左边，`pivot` 之后的书放在右边。”


    ![](img/00010.jpg)


    “你不断递归地拆分，直到每个堆只有一。”


    ![](img/00013.jpg)


    “然后你通过把左堆放在右堆前面来将它们合并回去。”


    ![](img/00016.jpg)


    Peter 耸了耸肩。“就这些。正如我所说，最坏情况是 `O(N²)`，但通常比那要快。更重要的是，通过把一堆放在另一堆上面，合并图书馆书籍要容易得多。”


    Ann 没有回应。她继续盯着那架图书馆书籍。最后，她低声耳语道：“它的预期运行时间是 `N log N`。”


    “预期的？”Peter 问。


    “意思是平均而言需要 `N log N`，”Ann 回答道，“我听过传闻，说 Clare 正在研究预期运行时间。”


    “最坏情况还是 `N²`，”Peter 反驳道。他坚信最坏情况运行时间本身就能说明一切。


    这让 Ann 从出神中了。“这就是它的之处，”Ann 回答道，“你必须总是做出糟糕的选择才有那么糟糕的运行时间。例如，如果你总是选择最小的值作为 `pivot`，情况就会糟。你需要拆分
    `N` 次书，每次拆分都需要多达 `N` 次比较。”


    Ann 转回书架。她的声音低得几乎是耳语。“那种机会一定非常小。”


    她转身看向 Peter，抓住了他的肩膀。她的眼睛里闪烁着狂野的能量。“你说 Clare 是什么时候在这里的？”她问道。


    Peter 试图后退一步，但 Ann 紧紧抓住了他。


    “她什么时候在这里的？”Ann 问。


    “我想两周前。”


    农场动物会计局三周前倒了。


    “这是一个信息！”Ann 大喊道，“`Quicksort` 是一个信息！”## 注释与面包师徒


    注释是代码内部额外的文本，可以通过提供额外的见解、解释或总结来极大地提高代码的可读性。例如，在大型数值语句块之前的注释可能简单地解释 `Solve a x²+
    bx+ c=0 for x`，让用户完全理解接下来的代码块的意图。


    ***


    “这才是写算法的方式，”Ann 宣称道。在读了王国历史上一些写得最糟糕的卷轴几天后，Clare 那篇关于《快速排序在报销费用表中的应用》的卷轴提供了一个令人欢迎的变化。


    “怎么说？”Peter 问道，凑过去看卷轴。他盯着了一会儿。“我想是字迹不错，”他说。


    “不仅于此，”Ann 说道，“算法本身是可读的。变量名很有意义，函数定义得很好，而且还有注释。很好的注释！”


    “注释？”Peter 问道，“那似乎没必要。我原以为一个好的算法应该是自己就能解释通。”


    “并不总是如此，”Ann 说道，“在复杂的算法中，良好的注释可以帮助一切变得更容易理解。在其他时候，良好的注释可以为为什么使用某种方法提供有用的见解。”


    Ann 回想起时停顿了。“我们城堡的面包师 Breadtista 是第一个向我展示良好注释重要性的人。我曾当过他的学徒。事实上，我当过很多学徒；我父亲是广博教育的支持者。总之，作为他闻名全球的教学计划的一部分，Breadtista
    要求每个学徒都要详细记录他们的工作。所有的食谱、技巧和窍门都必须清晰记录，以创建一个超出学徒期的参考资料。”

