  trans: "\n\n“市长先生，我认为有一个巫师正在对格拉（G’Raph）的学者们施咒，”安重复道。“每一个和巫师交过道的人都痴迷于寻找特定 NP-hard\
    \ 问题的高效、精确解。您有没有听说过某个穿黑斗篷的陌生人向学者们询问 NP-hard 计算问题？”\n\n市长看起来很困惑。“NP-hard？我不完全确定那是什么意思，但以前确实有一个穿者黑斗篷的人问过我一个很难的问题。”\n\
    \n“真的吗？”安、埃德加和弗罗伦斯齐声问道。他们没有人能掩饰脸上的震惊表情。\n\n“是的，”市长回答道，“那是二十年前的事了——就在我刚毕业后。他刚从图书馆回来。记得停下来和杰弗里讨论关于某个推销员问题。杰弗里是我最喜欢的老师，你们知道的。他出的考试总是最简单的。总之之，那个人问我是否能解决一个游戏：找到一条穿过格拉的路径，使得我每个岛屿最多只经过一次。”\n\
    \n“哈密顿路径问题，”埃德加说道，“它也是 NP-hard 的。”\n\n“它和杰弗里的旅行推销员有关，”弗罗伦斯补充道。\n\n“但为什么巫师要问你哈密顿路径呢？”安问道，试图委婉地提问。根据她和市长相处的短暂时间，他并没有让她觉得是格拉伟大的学者之一。\n\
    \n市长耸了耸肩。“我不知道，但那听起来像个有趣的游戏。”\n\n“这在格拉很流行，”埃德加赞同道，“我们小时候玩过哈密顿路径。我们会画出不同的跳格图，并必须按照哈密顿路径遍历它们。当然，你不被允许提前解题。你必须在跳跃的过程中确定哈密顿路径。如果你被卡住了或者两次踩了同一个节点，你就出局了。”\n\
    \n安看起来很怀疑。“你小时候真的玩过那个吗？你就是这样度过童年的？”她问道。\n\n埃德加对这段美好的记忆露一笑。“那是段美好的时光，”他回答道。\n\n\
    “你对巫师说了什么？”安问市长，“你没有把它解出来吧？”\n\n市长笑了。“我当然解出来了。我对那个穿斗篷的人说：‘那太简单了。我只要多造几座桥就行。’那人很快就离开了。我觉得他提到了我作为政治人的未来。”\n\
    \n“那是作弊，”埃德加抗议道，“在哈密顿路径游戏里你不能加桥！”\n\n“市长先生，”安打断道，“你还其他人遇到过那个巫师吗？”\n\n市长思考了一下。“在格拉这里没有。但我有一个实习生，他讲过一个听起来和你们所说的相似的故事。他在布尔（Bool）镇有一个好朋友，变得痴迷于这些难题中的一个。你们管它们叫什么？NT？还是\
    \ ND？”\n\n“NP，”安提议道。\n\n“行，行。总之，我实习生的朋友有一个有趣的小问题，叫 3-SAT 之类的。听起来像是在周日报上能看到的内容。”\n\
    \n“布尔镇？你确定吗？”安问道。\n\n市长点了点头。“当你遇到一个布尔（Boolean）时，你就能认出来。”\n\n安完全赞同。一想到布尔，她的脑海中浮现出了结博士（Dr.\
    \ Conjunctione）以及他坚持要解决 3-SAT 的样子。在那一瞬间，问题的范围变得清晰得令人恐惧。\n\n在经过几分钟的讨论后，安决定不再在这里寻找更多答案了。她知道确实有一个巫师正在对计算学者们施咒；现在她必须弄清楚为什么。\n\
    \n在她的寻找过程中的第一次，安知道下一步该去哪里了。她需要拜访一个她可能找到更多关于 NP-hard 问题信息的地方：亚历山大图书馆。\n\n## 计算思维\n\
    \n![](img/00061.jpg)\n\n## 算法反思\n\n复杂的算法建立在核心基础概念之上。精通这些基础概念并学会组合它们，是解决新问题的关键。\n\
    \n* * *\n\n第一百万次，安希望自己能有一个更好的算法来解决任务。她想要一种不需要过多猜测且能保证解决方案的东西。最重要的是，她想要快速的。在经历了近一年的寻找后，安已经累了。\n\
    \n当她俯视崎岖的土路时，她的思绪回到了在格拉的时光以及她在那里学到的算法。那些算法，比如 Dijkstra 最短路径算法和用于求最小生成树的 Prim 算法，远远超过了安一年前的想象。然而，这些新算法使用的概念，是她在一年级就学过的。\n\
    \nDijkstra 最短路径算法基于几个简单的循环：\n\n```\nWHILE 存在未访问的节点 …\nFOR 当前节点的每个邻居 …\n```\n\n\
    同样，Prim 算法只是一个循环，不断向集合中添加新节点，直到没有节点可以添加的为止。它还需要更新和寻找“接近”的节点。\n\n她在格拉学到的一切都建立在她在学校学过的计算机科学核心概念之上。当这个念头击入安的大脑时，一股希望流遍她的全身。她拥有解决这个任务的工具。现在，她需要弄清楚如何应用它们。\n\
    \n## 计算涂鸦\n\n递归允许将复杂的算法以简短、简单且往往优美的形式描述出来。函数在数据的子集上调用自己，利用这些子问题的结果来形成最终解决方案。然而，递归也会因为产生新的递归调用而增加计算开销。\n\
    \n* * *\n\n在前往亚历山大图书馆的途中，安可以看到混乱席卷王国的迹象。邮差他们在路线之前停止了分发邮件。相反，他们站在每个信箱前翻阅邮包。一切一团糟。\n\
    \n安首先在亚历山大的郊区发现了涂鸦。起初，它们看起来并无害——青少年叛逆的宣言：“DFS 胜过”或“动态规划万岁”。然而，这些标语很快变得令人不安：“对大\
    \ O 说‘不’”以及“暴力破解永恒”。\n\n起初，安认为这些标语是笑话。谁会反对高效的算法呢？这种荒谬感让它们显得滑稽。\n\n接着，安看到了一条让她如坠冰窟的消息：\n\
    \n```\nint RecursiveAdd(int n, int m) {\n  if (m == 0) return n;\n  return RecursiveAdd(n,\
    \ m-1) + 1;\n}\n```\n\n这个求两个数的递归算法覆盖了花店的整个北墙。它是用安在学校学的经典语言 C 写的。虽然技术上是有效的，但这种方法极低的效率让安震惊。\n\
    \n例如，给定 n=10 和 m=5，函数总会被调用六次！\n\n```\n用户调用: RecursiveAdd(10, 5)\n递归调用: RecursiveAdd(10,\
    \ 4)\n递归调用: RecursiveAdd(10, 3)\n递归调用: RecursiveAdd(10, 2)\n递归调用: RecursiveAdd(10,\
    \ 1)\n递归调用: RecursiveAdd(10, 0)\n```\n\n幸运的是，递归链在第六次调用后会停止。最后一次调用返回 10。下一次调用在该结果上加\
    \ 1 并返回 11。这个过程一直向上进行，直到顶层函数返回 (10 + 4) + 1 = 15。\n\n为什么要将一个简单的数学运算 m+n 描述为 m\
    \ + 1 次函数调用的链？这种开销是令人惊舌的。这些涂鸦显然指向了计算思维的彻底崩溃。\n\n安从令人不安的画面中挣回神来，飞奔起来。没有时间浪费了。\n\
    \n## NP-hard 诅咒\n\nNP-hard 是一类目前没有任何高效精确算法解决方案的计算问题。\n\n"
- fmt: '

    By the time Ann arrived at the Library of Alexandria, things had deteriorated
    further. She heard reports from throughout the kingdom of people falling victim
    to an obsession with specific `NP-hard` problems. It appeared that over eighty
    percent of the kingdom’s top scholars had been cursed. Most recently, Ann had
    learned that the `Bureau of Farm Animal Accounting: Large Mammal Division`—the
    greatest collection of complexity theorists in the kingdom—had fallen. The nine
    theorists, including `Clare O’Connell`, had vanished.


    “I need everything that you have on `NPhardhard problems, computational complexity
    … and curses,” ordered Ann as she approached the main desk.


    Peter, the librarian’s apprentice, looked worried. “Everything?”


    “Everything,” confirmed Ann.


    A look of panic replaced the worry on Peter’s face. “Are you here to curse me?”
    he asked. Then, with more resolve, he puffed out his chest and declared, “I will
    protect the wisdom in the Library of Alexandria with my life!”


    Ann froze in surprise. It never occurred to her that she might be mistaken for
    the very wizard that she needed to stop. However, judging from the young librarian’s
    reaction, he seemed certain that she was here to destroy the scrolls, curse him,
    or, at the very least, add to the already plentiful graffiti.


    “Umm, no. I’m not here to curse you or do anything bad to the library. I’m Princess
    Ann. I was sent by my father, `King Fredrick`, to stop the coming darkness. I
    need your help.”


    The panic on Peter’s face melted into relief. The relief gave way to gleeful excitement,
    which produced its own scary sort of expression. Peter’s entire face was contorted
    into a massive smile, and he seemed to have stopped blinking. Ann wished he could
    have stayed at relief.


    “I can help!” Peter cried as he turned and ran into the stacks.


    He returned fifteen minutes later carrying ten scrolls, two books, and an ancient
    clay tablet. “Here’s the first batch. I brought these up now so you can get started.
    Unfortunately, this is the type of request where our `caching system` doesn’t
    work too well.”


    “Caching system?` asked Ann, but Peter had already disappeared back into the stacks.


    Ann took the scrolls over to a table in the corner. As she worked, Peter returned
    with new batches of scrolls. Ann noticed that over half the scrolls on computational
    complexity were from the `Bureau of Farm Animal Accounting`.


    All together, about one hundred scrolls covered the table before Peter finally
    paused for a moment. He breathed heavily from the constant running, and sweat
    dripped from his nose.


    “What are you looking for?” he asked over the mountain of material.


    “I’m not sure,” Ann answered, wondering why he hadn’t asked this question sooner.
    “Anything that might help me understand this curse or its purpose.”


    “I heard that the curse targets scholars and forces them to become obsessed with
    `NP-hard problems` to the exclusion of all else. One thinker was helping the navy
    rewrite their manuals to use `functions`, but he became obsessed with packing
    cargo into the ships’ holds. They say he now lives in the cargo hold of a cow-transport
    ship in hopes of being inspired,” Peter babbled, his energy returning.


    Ann winced at the story. It had been her request that had sent that scholar to
    help the navy. She wondered if he would have otherwise avoided the curse. She
    tried to push that doubt from her mind and refocused on the problem.


    “What’s all the excitement over `NP-hard problems` anyway?” asked Ann.


    Peter gasped. “NP-hard problems are some of the hardest problems in the world,”
    he explained. “Everyone wants to solve them! You would be rich and famous!”


    “Why?” asked Ann.


    “Because no one has figured out an efficient `algorithm` for them yet,” answered
    Peter. “You can always check whether you have a valid solution, but generating
    an exact solution from scratch is much harder.”


    Ann continued to look unimpressed.


    “Take the problem of `Hamiltonian paths`,” Peter continued. “You need to find
    a path through a `graph` that touches each node one time. It’s really easy to
    check if any given path is valid—you simply test the `path`. Does it step on the
    same node twice? Yet it’s incredibly hard to even determine whether any such path
    exists.”


    “Is it that important?” asked Ann. “I guess the `Hamiltonian path problem` is
    interesting, but solving it won’t cure the common cold.”


    “It’s very important!” exclaimed Peter. “Well, maybe not `Hamiltonian paths` themselves,
    but solving these types of `NP-hard problems`. They have real, practical applications.
    Further, some `NP-hard problems` can be reduced to different `NP-hard problems`.
    That means if you solve one problem, you can solve another. If you found an efficient,
    exact solution to the `Hamiltonian paths problem`, you would find a solution to
    the `3-SAT problem`. It would revolutionize everything.”


    “Oh,” Ann said. She had never really appreciated the scope of these problems.
    “And it’s hard to solve these problems?” she asked.


    “Over three-quarters of the kingdom’s best scholars are spending every waking
    moment on them now with no luck. So …” Peter trailed off.


    “We need to figure out how to break the curse,” finished Ann.


    ### Everyday Algorithms


    Algorithms are essential for thousands of everyday tasks. We use algorithms for
    everything from adding two numbers together to navigating a store.


    ***


    Peter watched Ann for ten minutes before he had the courage to disturb her. Even
    then, it took him five false starts to get the words out. If Ann hadn’t been so
    absorbed in her work, she would have found the entire incident creepy.


    “Excuse me,” Peter ventured.


    Ann looked up, dazed. “What?”


    Even though her tone was pleasant, the words sent a wave of guilt through Peter.
    He had been trained not to disturb patrons unless there was a fire or the library
    was about to close.


    “Do you know what ‘the darkness’ is? Is it the curse?” he asked. “I only ask because
    it could help me locate other resources for you. The master librarian has said
    that I should make helping you top priority.”


    “I’m not sure, but I think ‘the darkness’ refers to a new dark age. A `computational
    dark age`, to be exact.”


    “Computational dark age?”


    “The wizard appears to be targeting the computational thinkers, and clearly the
    kingdom is already suffering.”


    Something didn’t sound right to Peter. “Does it matter that much?” he asked.


    “Excuse me?” asked Ann. “Have you seen the graffiti? The cursed scholars? The
    wandering tribes of bureaucrats?”


    “I mean, it seems like a lot of problems to result from,” Ann said. Her entire
    face came to life, and Peter could hear the passion in her voice. “Algorithms
    are everywhere. The entire kingdom runs on algorithms.”


    Ann set a scroll down on the table and continued, “Consider something as small
    as adding two numbers; it’s an algorithm. You add the two rightmost digits. Then
    the next two. Then the next two. It’s a loop over the digits—right to left. And
    there are specific steps for each digit. You add the numbers, determine whether
    you need to carry one to the next column, and so forth. It’s an algorithm.”


    “I meant new algorithms,” Peter managed to interrupt. “The impact of new algorithms.”


    Ann switched topics seamlessly. “There’s always the need for new algorithms. Sometimes
    you need to solve a new problem, or solve an old problem more efficiently. The
    scholars I met in G’Raph worked on these types of new algorithms daily. Or sometimes
    there’s a real-world twist to a known problem that requires you to adapt the solution.
    The importance of continued algorithmic development should not be underestimated.”


    At the mention of adapting the algorithm for the real world, Peter flashed back
