- "# 计算童话\n\n\n\n![](img/cover.jpeg)\n\n![](img/00023.jpg)\n\n\n# 献辞\n献给我的家人\n\n#\
  \ 读者的话\n\n本书侧重于计算思维。书中的故事旨在介绍并说明计算概念。因此，它们侧重于高层概念、这些概念背后的动机以及它们在非计算机领域的应用。这些故事并不是为了计算机科学严谨的技术描述。相反，这些故事旨在像插图一样，用于补充完整的概念说明。\n\
  \n本书涵盖了广泛的内容，从入门编程到更高级的算法概念。故事按概念分为若干章节。每个章节涵盖了逐渐进阶的概念。\n\n最后，每个故事都（大约）是独立的。虽然大多数故事都围绕着安（Ann）拯救王国的征程展开，但也有多个与主线无关的支故事。所有这些故事都发生在同一个王国。\n\
  \n# 主要角色\n\n安是弗德里克国王（King Fredrick）的女儿，也是王位的继承人。她被预言者赋予了拯救王国免于未来黑暗的任务。不幸的是，预言对于王国面临的具体威胁描述非常模糊。\n\
  \n弗德里克国王是国王，也是安的父亲。他是一位明智、公正偶尔有些懒的统治者。\n\n马库斯（Marcus）是一位强大的巫师，也是国王的好友。他坚信魔法实用方面的重要性，例如测试和注释。\n\
  \n克莱尔·奥康尔（Clare O’Connell）是王国最杰明的计算理论家。她每天在农场动物会计局大型哺乳部工作，在那里组建了一支才华横溢的理论家团队。\n\n\
  彼得（Peter）是亚历山大图书馆的学徒，一个对计算思想渴望但偶尔有些傲慢的学生。\n\n加尔文爵（Sir Galwin）是国王信任的首席骑士。他拥有多年处理困难任务的经验。\n\
  \n# 征程的开始\n\n![](img/00007.jpg)\n\n## 黑暗降临了\n\n“黑暗要来了，”预言者说道。\n\n他是本周第站在弗德里克国王面前的十五位预言者。十五位预言者——他们有着相同的预言。黑暗。混沌。毁灭。\n\
  \n诚然，每位预言者都为预言加入了自己的独特色彩。一个谈到了“邪风”，并为了增加效果而微微瑟抖了一下。另一个大声大地大叫着“世界末日”，直到被强行带出房间。第三个人把预言写成了一首格式不的五音律诗，导致房间里的每个人在他每一次尝试押韵时都忍不住皱起眉头。\n\
  \n相比之下，这位预言者就没有那么戏剧性；他冷静且直击要点。安公主喜欢这种风格。她从来不喜欢不必要的表演，尤其是在预言中。\n\n当然，安并不在乎信息本身。为什么王国注定毁灭？她的生活本来过得很好。现在，某些可怕的“黑暗”要吞噬这片土地了。当她父亲开始审问预言者时，安心不在焉地想着今天剩下多少个预言者。她厌倦了没完没了的毁灭预告。为什么不穿插一两个乐师呢？任何能活跃气氛的都是受欢迎的。\n\
  \n“安？”弗德里克国王大声问道。他盯着她。安意识到他正在等待回答，但她根本不知道问题是什么。在最初的预言之后，她就停止了关注。\n\n“抱歉。问题是什么？”她问。\n\
  \n安听到房间后方传来几声惊讶的抽气声。她的父亲叹了口气，不满地看着她。\n\n“你会接受这次征程吗？你会出去拯救王国吗？”他问。\n\n安愣住了。什么征程？为什么是她？为什么加尔文爵这位这片土地最著名的骑士正盯着她看？一提到征程，他本应该是喜笑颜开的。他热爱征程。\n\
  \n“什么征程？”安问。\n\n“出发旅行并找到阻止黑暗的方法，”父亲回答道。他说话缓慢，仿佛为了确保安在听。这让安想起了父亲早上点早餐的方式——在生活的某些方面，她的父亲没有留任何误解的空间。\n\
  \n安相当喜欢这个征程的建议。她渴望游王国，但从未被允许过。随着下周暑假的开始，这次征程听起来像是个极佳的机会。她可能会看到南巴塔哥尼亚著名的倒金字塔，或者是伟大的亚历山大图书馆。\n\
  \n“好的。我可以，”她很快回答道。\n\n“这将是一个漫长、孤独且危险的旅程，”父亲补充道，“但你必须找到拯救王国并阻止黑暗的方法。预言说你必须独自旅行去寻找答案。”\n\
  \n“等等，什么？独自？”安结结道。他们从不给青少年分配独行任务。通常，第一次征程涉及到一整个老兵骑士团。她对征程一窍不通。\n\n她的父亲再次叹了口气。“你到底有没有听预言的字？”\n\
  \n“没有，”安承认道，“当他说到‘你们全完蛋了’的部分时我就停止听了。我已经听过一百次了。很无聊。”\n\n房间里的每个人都不可置信地看着她。她开始感到不安。她短暂地想自己能否以某种方式逃脱。\n\
  \n“我明白了，”父亲开始说，“简而言之，预言者说你可以拯救这些土地。你需要找到答案，否则我们就完蛋了。然后他提到了 Fortran 是唯一的语言。从那以后就都是胡言乱语。”\n\
  \n“但是……独自？”安问。\n\n她的父亲给了她一个严肃的眼神。“独自。”\n\n安木木地点了点头，再次想逃出房间。\n\n* *\n\n计算机科学本质上是一种思考问题的方式。你如何在跨越全球的分布式网络中路由信息？你如何渲染看起来真实的图片？我该如何让这个程序停止崩溃？\n\
  \n这些问题的答案建立在核心概念之上——解决问题的方法。本书关注这些核心概念、它们解决的问题以及这些概念本身。\n\n算法是解决问题的特定步骤或指令。例如，有用于排序数字、计算数学结果和渲染图像的算法。\n\
  \n* *\n\n安在收拾征程行李时开始恐慌。她要如何找到答案并拯救王国？她很少离开首都，即使离开也从未去过米灵顿（Millington）。现在她必须在所有已知土地寻找拯救王国的方法。她很快意识到自己完全不知道在做什么。\n\
  \n她的思绪被急促的敲门声打破。加尔文爵僵硬地站在门口，显得有些不自在。自从安接受了征程以来，他一直在闷闷不脸，她担心再次触怒他。\n\n“我是来送你好运的，”加尔文爵说道，“我相信你在征程中会成功的。”\n\
  \n“谢谢，”安回答道。\n\n骑士僵硬地示意了一下，转身离开。\n\n“加尔文爵，你有什么建议给我也吗？”安在他离开之前问道。\n\n\n\n\n骑士转过身看向安。从他脸上灿烂的笑容，安知道自己问了一个对的问题。加尔温爵热爱分享他关于任务的故事，几乎就像他热爱执行任务本身一样。\n\
  \n“遵循既定的任务算法就行了，你不会没问题的，”加尔温爵向她保证道。\n\n“算法？”安问道。她从未听说过什么任务算法。希望涌上了她的心头。她是可以应付算法的。\n\
  \n“这很简单，”加尔温爵开始解释道，“如果你有一个或多个线索，就遵循最好的那一个。否则，如果你一个线索都没有，就去能找到更多信息的地方。如果遇到平局，就通过掷硬币来决定。”\n\
  \n这个建议让安感到惊讶。她不知道自己原本期待的是什么，但这显然不是她预期的。她花了好几秒才弄清楚如何表达自己的困惑。\n\n“这种方法似乎涉及到大量的猜测，”安试探着问道。\n\
  \n“我更倾向于将其视为一种启发式方法，”加尔温爵说。\n\n“启发式方法基本上是一种有根据的猜测——如果你愿意的话，可以叫经验法则，”安说，“有没有什么更精确的东西？也许是不包含任何猜测的东西？某种能保证我能快速找到解决方案的东西？”\n\
  \n加尔温爵发出一声深沉的、状的笑声。“当我导师向我描述这种方法时，我也是这么说的。我下决心开发出一种更好的算法来解决所有任务。”\n\n安等他继续，但加尔温爵似乎在盯着她窗外的一只鸽子。在安看来，那只鸽子并没有做什么特别有趣的事。它在窗台上踱步，抖动着头。\n\
  \n“你（做过）吗？”她终于问道。\n\n“什么？哦。算法。没有。我从来没有发明过任何更好的。我最终意识到既定的算法已经不错了。事实证明任务总是涉及一些猜测。”\n\
  \n“所以我的整个计划就是继续遵循最好的线索并收集新信息？”安确认道。\n\n“是的。我称之为‘问题解决信息最大化算法’，”骑士说，“我觉得听起来比我导师以前说的好得多。他会管这叫‘搞定事情’。”\n\
  \n“把它想象成对答案的寻找。在每一步中，你都尝试更接近答案或者了解更多关于问题本身的信息。了解问题能帮助你找到答案。”\n\n“我如何找到最好的线索？我如何确定去哪里获取更多信息？”安问道。\n\
  \n“你必须找到一种适合你的策略，”加尔温爵说，“我根据直觉对事物排序。我用 `0` 表示‘感觉完全正常’，用 `10` 表示‘感觉不对’。对我来说，`10`\
  \ 的感觉就像吃了三磅炸豆泥。我还使用一种特殊的数据结构来跟踪一切。那个系统救过我几百次。有一次，我在沼泽地追逐一只特别讨厌的沼泽龙——”\n\n“还有什么我应该知道的吗？”安打断道。她渴望获得更多信息。\n\
  \n加尔温爵思考了一会儿。最后，他说：“避免在沼泽地追逐沼泽龙。”\n\n这是这小时的第十次，安在想自己陷入了什么样的境地。\n\n# 变量与魔法礼物\n\n\
  `variable` 是内存中的一个位置，可以在其中存储单条数据。每个`variable` 都关联一个名称。程序员可以使用它的名称引用、修改或设置`variable`的值。`Variables`\
  \ 还可以关联关联类型，例如 `integer`（整数）、`Boolean`（布尔值）或 `float`（浮点数）。这些类型指示了相应的`variable`中可以存储什么信息。\n\
  \n***\n\n安离开城堡不到两英里，任务的巨大压力再次降临在她身上。王国的命运取决于她是否能找到阻止黑暗的方法，但她不知道那是什么，甚至不知道如何发现。她感到孤立无援。\n\
  \n在她面前，安看到一个男人走在路上，穿着一件绣有银色丝线的亮蓝色魔法师斗篷。她立刻认出了马库斯；没有其他魔法师穿得如此时尚。他也是王国最强大的魔法师之一，她父亲的忠实朋友。如果有人能在任务中帮助她，那他可以。\n\
  \n“魔法师先生！”她向他喊道，尴尬于自己从未学过称呼魔法师的正确礼仪。\n\n马库斯微笑抬头。“安公主。在这个美丽的早晨你好吗？看来是在出来散心。”\n\n\
  “不幸的是，不是，”安回答道，“我正开始一项重要的任务。预言者预言了黑暗即将到来，我必须阻止它。”\n\n“独自？”马库斯问。他的笑容消失了。\n\n“是的。预言说我‘必须独自出发去阻止即将到来的黑暗’。但是……也许你仍然可以加入我。技术上来说，我们是在独自出发之后相的。事实上，我已经独自旅行了大约两英里。而且，我真的需要你的帮助，”安恳求道。\n\
  \n马库斯摇摇头。“那不是个好主意。预言是很棘剔的东西，它们不喜欢你钻字眼的行为。有一次我以为我找到了预言中的漏洞；结果，下了三天三天的哈伯利亚蛞。那场面极其混乱。你必须独自去。”\n\
  \n安的心沉了半。。泪水开始在眼角打转，但她忍住了泪水，勇敢地向马库斯点头。她知道他是对的。\n\n“不过我也许还是帮助你，”马库斯继续说道，“让我看看我带了什么。”他说话一边翻找包。过了一会儿，他拿出了几个看起来很奇怪的物体。\n\
  \n“我带着一些我最近的作品，”他解释道，“它们基于变量魔法。”\n\n“变量魔法？”安问道，“那是什么？你的其他作品呢？”\n\n他摇了摇头，仿佛在清除一个可怕的画面。然后他继续道，“变量魔法是一种有用但经常被忽视的魔法形式。它是基于存储值的简单想法。以这块石头为例。它使用了所谓的\
  \ `location` 变量。”\n\n“我想这取决于口袋的大小，”安评论道。\n\n“非常小，非常小，非常小，”马库斯回答道，“一个只能放下一件东西的小口袋。”\n\
  \n在算法设计之后，魔法是她感兴趣的话题。“所以，你可以用它来……”安停顿思考。她没想出一个用例。\n\n“你可以用它找到回到地方的方法，”马库斯结束道，“例如，你可以隐藏宝藏并用这石头存储它的秘密位置。或者你可以在进入危险的沼泽之前存储你的当前位置，这样你就能找到出口。或者你可以用它在特别大的停车场找到你的马。它有很多实用的日常用处。”\n\
  \n“我明白了，”安承认道。她默默在想马库斯的“日常”生活是什么样的。\n\n“你只需要用手指点石头五次，”马库斯解释道，“然后石头就会把你的位置存储在魔法变量中。无论你在哪里，石头都会一直指向保存的位置，直到你设置一个新的。”\n\
  \n“就像指南针一样？”安问道。\n\n“完全正确！”马库斯惊呼道，“是你设置位置，而不是它总是指向北方。”\n\n“它只能存储一个单一的位置？”安问道。\n\n\
  “这就是变量的工作方式；它只存储一条信息，”马库斯回答道，“想象一个小口袋——你可以在里面放东西。你可以改变里面的东西，但你永远无法同时在里面放两件东西。”\n\
  \n“我想这取决于口袋的大小，”安评论道。\n\n“非常小，非常小，非常小，”马库斯回答道，“一个只能放下一件东西的小口袋。”\n\n“噢。好吧，谢谢你。”安说。她仍然不确定指南针石的实际用处。\n\
  \n\n\n“我还有这个给你，”马库斯说，递给她一个正面带有一个计数器的小零钱包。\n\n“钱包？”安问道。\n\n“一个魔法钱包，”马库斯纠正道，“它的工作原理像计算器。它使用一个名为\
  \ `value` 的变量来跟踪钱包里有多少钱。这个钱包会在它的正面显示那个金额。\n\n“当你放入一个硬币时，该金额就会加到 `value` 变量中；而当你拿出一枚硬币时，相应的金额就会从\
  \ `value` 中减去。”它会一直告诉你钱包里有多少钱。”\n\n马库斯通过向钱包里投入一枚五分币演示了这一概念。正面的计数器增加了五分。安想象钱包内部有一个魔法变量随着加法结果而发生变化。\n\
  \n![](img/00070.jpg)\n\n“我为什么需要那个？”安问道，“我随时可以数钱。”\n\n“啊，”马库斯微笑道，“数钱是需要时间的。如果你赶时间呢？”\n\
  \n“我明白了。再次感谢你这些美妙的礼物，”安假装热情地回答道。她已经知道这些礼物对她毫无帮助。\n\n“希望它们能在你的征程中帮助你，”马库斯回答道。接着他低声补充道，“如果我知道你要去征程，我会为你带更好的魔法物品的。”\n\
  \n他耸了耸肩，收好背包，准备离开。\n\n“先生？”安试探性地问，“我可以再请你一个忙吗？对于我的征程你有什么建议吗？关于从哪里开始有什么用的提示吗？”\n\n\
  马库斯沉默了良久，望向远方。“我不知道黑暗是什么，也不知道你应该去向哪里。我很抱歉。相反，我给你留下这条建议：别被龙吃掉。我听那那糟糕糟糕。”\n\n说完，马库斯继续他朝城堡的旅程。他边走一边低声哼着歌。\n\
  \n安再次感到胃里升起一阵绝望。\n\n## 国王乌龟的 IF-ELSE 生活\n\n`IF-ELSE` 语句允许程序分支并执行两个不同代码块之一。`IF` 语句首先评估一个布尔（真/假）子句。如果该子句的结果为真，则执行受\
  \ `IF` 语句约束的代码块。否则，则跳过。可以包含 `ELSE` 子句，以便在原始布尔子句结果为假的情况下提供替代代码块。\n\n***\n\n芬多，弗雷德里克国王最喜爱的宠物乌龟，过着幸福的生活。它的一天都花在花园的喷泉里，游泳和睡觉。它没有任何魔法能力，除了盯着小卵石看一小时来让自己自乐的能力之外，但弗雷德里克国王非常喜欢它。由于它性格安静且没有锋利的牙齿，芬多一直也是安最喜爱的宠物。城堡的仆人们很好地照顾它。他们确保它的喷泉始终保持大部分整洁——芬多确实喜欢偶尔发现的一小块粘粘液。\n\
  \n芬多遵循一系列简单的规则生活。事实上，由于它的大脑大约和小卵石一样大，这些规则是极其简单的 `IF-ELSE` 风格的规则。这些规则构成了芬多的整个日常生活。例如，它有一套简单的逻辑来决定自己什么时候吃饭：\n\
  \n```\nIF he was hungry then he ate\n```\n\n这种逻辑对芬多来说很有效，因为它在饥饿时会吃。而且，作为自然的结果，它不饿就不吃。这是一个非常好的系统。\n\
  \n对于生活的某些方面，`IF` 语句可以根据条件采取两个不同的动作。例如，当它游泳时：\n\n```\nIF the fountain is on then\
  \ play in the fountain\nELSE swim around the large rock\n```\n\n显然，芬多喜欢喷泉多于喜欢那块大石头。\n\
  \n有时候决策足够复杂，需要一系列链式的 `IF-ELSE` 语句：\n\n```\nIF it is sunny then sit in the grass\n\
  ELSE IF it is warm then go swimming\nELSE sleep\n```\n\n在晴朗的日子里，芬多会很乐意坐在草地上。当天气温暖但不晴朗时，芬多会在喷泉里游泳。在那些既不温暖也不晴朗的稀有日子里，芬多会睡觉。它讨厌那些日子。\n\
  \n负责照顾芬多的园丁经常开玩笑说：“那只乌龟做的就是吃、睡和游，”这并非于事实。统治芬多生活的逻辑由大约五十种包含在链式和嵌套 `IF-ELSE` 语句中的不同动作组成。\n\
  \n当安还是孩子时，一位访问的学者曾花了一周时间研究芬多。在安热心的帮助下，他在单张羊皮纸上记录了芬多日常生活的全部逻辑。如果芬多足够聪明能理解那意味着什么，它可能会感到被冒犯。相反，它坐在草地上——那天是晴的。\n\
  \n然后，在安的征程开始五天后，不可思议的事情发生了。园丁担心芬多在没有安来的情况下会感到无聊，于是向花园里增加了第二块大石头。这一增加完全打乱了芬多基于 `IF-ELSE`\
  \ 的常规。芬多花了几乎整整一周才确定了一套新的常规。最后，它又增加了一个 `IF-ELSE`：\n\n```\nIF he is closer to the\
  \ right rock then swim around the right rock\nELSE swim around the left rock\n```\n\
  \n于是，它的生活恢复了秩序。\n\n## 循环与制作马蹄\n\n循环，如 `FOR` 循环或 `WHILE` 循环，是编程构造，用于重复一组指令直到满足某些终止标准。两个主要方面定义了循环：1)\
  \ 在循环内部做什么，以及 2) 你知道何时停止。\n\n***\n\n在首都以北数百里的地方，加罗镇的铁匠德雷克斯失去了耐心。在他三十五年的铁匠生涯中，从未见过过更差的学徒。芬蒙甚至拿不起锤子，更不用说用足够的力气挥动它。更糟糕，它缺乏执行简单任务的智力。德雷克斯发现自己不断重复指令：\n\
  \n“现在，再敲击金属。”\n\n“再一次。”\n\n“再一次……”\n\n德雷克斯的耐心耗尽了。最后，德雷克斯决定尝试实验。“芬蒙，敲两次金属，”他命令道。\n\
  \n当。当。芬蒙服从了。\n\n“现在，把它翻过来并敲平，”德雷克斯命令道。\n\n芬蒙翻过变形的马蹄，敲了一下。然后他停下来，困惑地看向德雷克斯。\n\n德雷克斯大声叹了口气。这对于芬蒙来说真的太难了吗？这孩子没没救了。“这是一个循环！”德雷克斯喊道。他知道芬蒙不会懂，但至少大喊让德雷克斯感觉好受些。“简单的、简单的循环。”\n\
  \n“循环？”芬蒙问。\n\n“你以前听说过循环吗？”\n\n芬蒙遗憾地摇了摇头。\n\n德雷克斯意识到他们触及了问题的核心。如果不理解循环是如何工作的，芬蒙如何能成为一个合理的铁匠？同样，德雷克斯也不知道芬蒙在不理解循环的情况下如何作为一个人类。\n\
  \n“循环由两个东西定义：要要做的事以及一种知道何时停止的方法。你重复做那件事，直到你停止，”德雷克斯冷静地解释道，背诵加罗镇著名学者怀尔顿博士最喜欢的描述。当然，怀尔顿博士倾向于重复自己，所以他会至少解释好几次。\n\
  \n芬蒙呆呆地看着他。\n\n“想象一下一英里比赛，”德雷克斯建议道，“你绕着跑道跑完一英里。那是四圈，对吧？所以，跑步是你要做的事，而跑完一英里是你知道停止的方法。跑道看起来就像一个循环。”\n\
  \n“我跑步直到有人告诉我停止，”芬蒙说。\n\n“你当然会，”德雷克斯嘟囔道，“在这种情况下，”德雷克斯继续道，“我想让你一直敲那只马蹄，直到它是平的。一旦它是平的，你就可以停止。`WHILE`\
  \ 马蹄不是平的，用锤子敲它。”\n\n\n\n“好的，”西蒙愉快地同意道。他立即开始反复敲击那块铁蹄。结束时，西蒙由于用力而气喘吁吁，但他已经成功地将铁蹄敲平了。\n\
  \n德克斯惊呆了。西蒙是怎么理解那点的？\n\n“很好。现在去把煤炉烧热，”德克斯命令道。\n\n西蒙再次露出困惑表情。\n\n德克斯叹了口气。“又是一个循环。拉\
  \ 10 次风箱。每从 1 到 10 数数的**每一个**数字，就拉一次风箱。”\n\n“好的。”西蒙再次开始工作，准确地拉了十次风箱。他每次都大声数着：\n\n\
  “一……二……三……四……五……六……七……八……九……十。”\n\n在这一周的时间里，德克斯发现，如果任务在循环中被明确指定，西蒙就会重复执行。德克斯会准确地告诉西蒙要重复什么任务，以及具体重复多长时间。有时他告诉西蒙数到某个特定的数字。有时他会将命令表述为一个\
  \ `WHILE` 循环，告诉西蒙继续做某事，直到他达到目标为止。\n\n西蒙对这些结构化的命令反应很好。铁匠铺里充满了西蒙快乐的数数和敲击声。“一……砰……二……砰……”\n\
  \n最终，德克斯引入了嵌套循环，发布了诸如下的指令：“`WHILE` 剑还不够薄时，将其翻转过来，并 `FOR` 从 1 到 5 的**每一个**数字，用锤子击它。”西蒙愉快地忙着把剑敲成所需的形状，同时每击五下就翻转一次。\n\
  \n遗憾的是，这种形式化的方法只起了一部分作用。当德克斯试图教西蒙更复杂的计算概念时，灾难终于降临了。当德克斯和西蒙站在着火的铁匠铺外时，德克斯承认了失败。在离开新雅典去寻找一个公开的铁匠职位之前，他为西蒙找了一份更好的工作——为当地田径队的跑步者数圈。\n\
  \n# 布尔镇 (Town of Bool)\n\n布尔逻辑基于两个值：`TRUE` 和 `FALSE`（或者对于物理晶体管来说是 `ON` 和 `OFF`）。通过使用几个简单的操作，如如\
  \ `AND`、`OR` 和 `NOT`，可以形成复杂的逻辑表达式。这些表达式允许计算机执行逻辑操作，例如相二进制位、判断 `IF` 语句是否执行或控制循环何时终止。\n\
  \n***\n\n布尔镇是王国最受尊敬的逻辑学家之一艾利·康结（Ellis Conjunctione）的家乡。Ann 决定访问王国的学者，希望他们能为她的任务提供见解。遗憾的是，到达后，Ann\
  \ 被告知康结博士不会见任何人。\n\n“我很抱歉，康结博士现在很忙，”康结博士的一位研究生说道。他的声音中透出一种罕见的正式与无聊的结合体。这让 Ann 想起某场过度练习的讲座，老师在其中苦苦维持自己对内容的兴趣。\n\
  \n研究生站在大学门前，用身体挡住了 Ann 的路。他交叉着双臂。Ann 在想，这个学生是否认为那个姿势会让他看起来很有威胁性。事实上，他看起来只是很不不自在。\n\
  \n“我正在执行一项重要的任务，”Ann 坚持道。\n\n学生似乎无动于衷。“康结博士正在处理王国面临的最单一重要问题：一个被称为 3-SAT 的逻辑问题。你的任务必须等一下。他明确指示我不要让任何人打扰。”\n\
  \n尽管辩解了两个小时，Ann 仍无法说服那个学生。他拒绝任何妥协。最后，她承认了失败，并决定转向名单上的下一个名字。她决定在继续之前在布尔镇留一晚。\n\n\
  Ann 发现她在布尔镇的短暂停停留最令她讨厌。她一直听说布尔人是二进制逻辑的严格信徒——一切要么为真要么为假。她自然地假设这仅仅意味着他们很有主见。例如，她不会预期布尔镇的任何人会说“爵乐还行”。意见将是确定的。然而，她没有预料这种哲学适用于生活的每一个方面。\n\
  \n第一个惊喜出现在当地的一家餐厅。\n\n“可以再给我点水吗？”Ann 问一个服务员。\n\n“不，”他回答道，“只有当杯子空的 `AND` 且你还在吃时，我才会加水。”\n\
  \n“我还在吃，”Ann 向他保证道。\n\n“但你的杯子 `NOT` 是空的，”他一边回答一边走向了下一张桌子。\n\nAnn 低头自己的杯子。里面最多只有三滴水。Ann\
  \ 叹了口气，喝掉了那几滴水以准备服务员回来。她决定在这种情况下，她将拥抱布尔哲学并且 `NOT` 给他小费。\n\n幸运的是，Ann 为这次停留做好了充分准备。她在幼儿园时作为选修课学习过布尔逻辑。这一切都归结为几个简单的规则：\n\
  \n- 只有两个选项：`TRUE` 和 `FALSE`，\n- 当且仅当 `A` 和 `B` 都是 `TRUE` 时，`A AND B` Result 为 `TRUE`，\n\
  - 只要 `A` 或 `B`（或两者）为 `TRUE`，`A OR B` Result 为 `TRUE`，\n- 当且仅当 `A` 为 `FALSE` 时，`NOT\
  \ A` Result 为 `TRUE`。\n\n这种逻辑与人们在日常生活中使用这些词的方式相匹配。遗憾的是，布尔逻辑法则并不是为了日常生活设计的。\n\n在\
  \ 16 小时的停留期间，Ann 继续经历着与布尔人世界接触的挫败感。她发现，当公园“在日落时关闭”时，顾客们会一直留到太阳落在地平线以下的一秒，然后冲出公园。同样，问路证明是极其恼人的。\n\
  \n“酒店在那个方向吗？”她问道，指向东南东南方向。\n\n“它 `NOT` 在那个方向，”街上的一个布尔人宣布道。“它在那个方向。”布尔人指向一个几乎相同但并不完全相同的方向。Ann\
  \ 叹了口气，朝大致正确的方向走去。\n\n“你 `NOT` 在正确的方向上，”布尔人在她身后喊道。Ann 忽略了他。\n\n她还决定为马库斯的罗盘进行编程，以引导她回到酒店。这样，如果她出去，就可以避免再次问路。\n\
  \n即使是布尔镇的指示牌也过度逻辑化。斑行道灯实际上写着：“当 `WALK` 灯亮起 `AND` 且没有汽车向你冲来时通过。”他们真的需要澄清这一点吗？Ann\
  \ 在想，如果有人把牌子印错，使用了 `OR` 会发生什么。\n\nAnn 直到到达酒店时才理解了布尔人对这种哲学的真正忠从。在那里，在她的酒店门背后，有一份在任何酒店都能找到的火灾逃生计划——只是在这种情况下，所有的条件都被指定为长布尔逻辑语句。“使用南侧楼梯，如果（它们\
  \ `NOT` 在着火 `AND` 北侧楼梯着火）`OR`（通往北侧楼梯的走廊有障碍）`OR`……”\n\n读了四次标志后，Ann 决定一旦发生火灾，她会因为太混乱而无法逃生。她立即决定尽快离开布尔镇。\n\
  \n## 不快乐的魔法花朵与二进制\n\n二进制是一种计数系统，其中每个数字可以取两个值之一：0 或 1。二进制允许计算机在一系列处于开启（1）或关闭（0）状态的开关中进行编码。\n\
  \n每个二进制位代表 2 的幂。第一个（最右侧的）数字代表 1 位，第二个数字代表 2 位，第三个代表 4 位，以此此类推。例如，二进制数 `10110 = (1\
  \ · 2⁴) + (0 · 2³) + (1 · 2²) + (1 · 2¹) + (0 · 2⁰) = 22`（十进制）。\n\n***\n\n快递员在魔法师马库斯在新雅典的联排别墅外停了。。马库斯微笑。他最近从访问首都的弗德里克国王回来，正在等待积压的各种快递。今天至少会有五种重要的药水成分一顶新帽子到达。\n\
  \n\n\n\n然而，快递员没有继续朝门口走。他呆在原地，盯着那些花。两分钟后，马库斯（Marcus）走出去看看是不是出了问题。\n\n“你的花和昨天比变了，”快递员观察道，“我确定右边那朵昨天是红色的，今天变成蓝了。”\n\
  \n“它们是同一种花，”马库斯回答道，“它们今天有些在闹气。愚蠢的花。”\n\n“闹气？花也会会闹气吗？”快递员问。\n\n“实际上，这更像是一种抗议，”马库斯解释道，“它们当然是魔法花。每当不下下雨时，它们就会抗议。这真的很让人恼火。我每天给它们浇水，但它们还是坚持要闹气。”\n\
  \n“哈？”快递员在马库斯和花之间来回看去，试图理解马库斯的话。\n\n“它们通过颜色变成蓝色来抗议。玫瑰本该是红色的。你可能听过所有这类意思的诗，比如‘玫瑰是红的’之类的。但这些玫瑰执意要告诉我它们在没有下雨的情况下已经‘受苦’了多久。”马库斯说话时愤怒地对着花比划着。\n\
  \n“它们会和你说话？”快递员从马库斯身边退了一步。\n\n“当然不。它们只是在改变颜色。”\n\n“颜色和下雨时间有什么关系？”\n\n“这个嘛，”马库斯开始说道，“它们以前在连续三天没雨后会一起变色——一种集体抗议。然后它们开始组织起来。它们想让我确切地知道它们有多不开心。所以现在它们数日子。”\n\
  \n“只有两朵是蓝色的，”快递员观察到，“这一周都没下雨。”\n\n“准确来说是九天，”马库斯看了看花后纠正道，“它们使用二进制。”\n\n“红花是零，蓝花是一，”马库斯补充道。这个解释并没有帮助。事实上，它似乎让快递员更加困惑了。不过从好的一面来说，他不再想逃跑了。\n\
  \n“二进制？”马库斯引导道，“每朵花代表一个不同的数字，因此代表不同的 2 的幂。最右边的花代表一（`2⁰`），它旁边的那朵代表二（`2¹`），再旁边的那朵代表四（`2²`），以此类推。把蓝花所代表的数字加起来就能得到总天数。现在只有第一朵（`2⁰\
  \ = 1`）和第四朵（`2³ = 8`）是蓝色的，所以是 `2⁰ + 2³ = 1 + 8 = 9` 天。”\n\n快递员看了看。果然，马库斯门廊五朵花是：红、蓝、红、红、蓝（或\
  \ `01001`）。\n\n![](img/00045.jpg)\n\n“它们为什么要用二进制？”快递员问。\n\n“它们试图在花瓣上写下数字，结果太混乱了。所以它们只好让每朵花要么全红要么全蓝。事实证明花并不聪明。二进制对它们来说是一个足够简单的系统。如果它们聪明到能做其他事情，你认为它们会向我抱怨下雨吗？我对此无能为力！”马库斯直接对着花喊了最后一段。\n\
  \n“但它们是如何协作的？”故事越变得荒诞，快递员就越感兴趣。他向花凑近。\n\n“对它们来说，用二进制数数其实简单，”马库斯开始说，“下雨时，它们都很开心并变成红色。它们有效地将计数器重置为\
  \ `00000`。我很喜欢那些日子。\n\n然后，每天早晨，所有的花都会醒来并决定一整天变成什么颜色。如果没有下雨，它们就会增加计数。\n\n第 1 天后：红红红红蓝\
  \ (`00001 = 1`)\n第 2 天后：红红红蓝红 (`00010 = 2`)\n第 3 天后：红红红蓝蓝 (`00011 = 2 + 1 = 3`)\n\
  第 4 天后：红红蓝红红 (`00100 = 4`)\n第 5 天后：红红蓝红蓝 (`00101 = 4 + 1 = 5`)\n以此类推。\n\n“你看，每朵花都向自己的右侧看以决定做什么。如果它的右侧邻居从蓝色变成红色（`1`\
  \ 变为 `0`），那么这朵花就会翻转自己的颜色。蓝花变红，红花变蓝。这种情况会一直发生，直到某朵花不再从蓝色变成红色为止。”\n\n“最右边的那朵呢？”快递员问，“它怎么知道该做什么？”\n\
  \n“啊。那个是挑事者！我确定它是开始这一切的那个。每天早上只要没下雨，它就会翻转。它是启动过程的那个。红变蓝，蓝变红……”……”\n\n快递员想了想。“为什么花只有在邻居从蓝色变成红色时才会改变呢？”\n\
  \n“像你用数字 `0-9` 数数那样想吧。当你遇到 `9` 时，那个数字就不能再继续增加了。所以你把下一位加一，并将当前数字拨回 `0`。这就像从 `19`\
  \ 变成 `20`，或者从 `29` 变成 `30`。”\n\n![](img/0068.jpg)\n\n## （变量）名称的重要性\n\n编写“可读的”代码对于代码的长期可用性至关重要。编写清晰的代码更容易理解（无论对于原始程序员还是未来的用户都是），更容易维护，也更容易检查错误。可读代码的一个重要方面是使用清晰、有意义的名字。使用有意义的名字可以极大地提高代码的可理解性。\n\
  \n\n\n\n\n安决定在离开驻军之前解决目前的局面。她花了一整晚的时间思考不同的算法策略，坚信其中一种策略能让驻军运行得更高效。正如她从小受到的教育的那样，几乎每个问题都有算法解决方案。最终，在凌晨\
  \ 3 点，她想通了真正的问题所在，入睡时确信自己已经知道该如何解决问题了。\n\n“阿特爵，”第二天早晨早餐时她对指挥官说道，“我们需要讨论一下昨晚的进攻。”\n\
  \n“是的，”指挥官同意道，“哥布林的威胁是真实的。现在你明白为什么我们需要援军了吗？”\n\n“不，”安回答道。\n\n指挥官看起来很震惊。整个餐厅陷入了沉寂。所有人都在等看安接下来会说什么。\n\
  \n“你们需要更好的名字，”安继续说道。\n\n指挥官大笑大起来。“你不明白。我们已经改进过名字了。当一个士兵加入哨所时，我会给他分配一个新名字。每个名字都非常短，这样指挥官在战斗中就能快速下达命令。”\n\
  \n“不，”安反对道，“这太低效了。”\n\n“无意，安公主，但你对战斗指挥又了解什么？”他问道。\n\n“只了解我昨晚观察到的。但从这些有限的观察中，我可以保证，这些名字正在损害你们的效率。”\n\
  \n“我认为你错了，”指挥官宣布道。“它们让我们能以惊人的速度发布命令。”\n\n“是的，确实，”安同意道，“但它们容易出错。昨晚，你自己修正了 89 次。这些名字太相似了，因此很容易混淆。Plex\
  \ 和 Dex。Ut、Ot、Et 和 Aat。短名字没有任何帮助！”\n\n“哈！你有什么建议？”指挥官嘲讽道。\n\n“使用描述性的名字。例如，Plex 应该被称为‘南塔弓手’，或者至少叫‘弓手\
  \ Plex’。这能更准确地反映他的角色。”\n\n“太疯了！”指挥官吼道，将咖啡杯重地摔在桌上。被教训的愤怒盖过了他对王国未来统治者的礼貌。“你知在激烈的战斗中，说出‘南塔弓手’需要多久吗？我们会浪费宝贵的时间。”\n\
  \n“你知道说出‘Dex，和 Plex 交换位置，墙上需要一个弓手，而不是铁匠’需要多久吗？任何效率衡量都必须考虑到修正错误上花费的时间，”安反驳道。\n\n\
  “呃——你看——我们的老铁匠 Drex 最近搬家了，所以——”指挥官开始说道。\n\n“你呢？”安中断了他，“为什么不让他们叫你‘指挥官’或‘队长’呢？”\n\n\
  “我们的名字已经反映了军级，”指挥官回答道。“名字按字母顺序排列。这让任何士兵都能瞬间知道谁的级别更高！这让生活变得简单！”\n\n“并没有。为了让士兵们互相称呼，他们必须学习新造的名字。为什么不让他们学习军级呢？反正他们都要学新东西。只是在这种情况下，军级是有意义的。”\n\
  \n“我们有一个很好的系统！”指挥官争辩道。\n\n安叹了口气。“这就像编写一个复杂的算法，”她解释道，“使用短变量名会让编程感觉更高效，因为你可以打字得更快。但从远来看，弊大于利。很容易出错且难以理清发生了什么。通常，稍微长一点的名字会有显著差异。”\n\
  \n指挥官张嘴想反驳，却想不出反驳的理由。相反，他坐在桌旁，张着嘴，脸上写满了困惑。过了一会儿，他开口了。\n\n“安公主，我想你说的有道理。”指挥官私下也感到了一丝松口气。他从未喜欢自己被分配的名字。他经常发现自己在梦见士兵们整齐地礼并喊道：“是的，指挥官！”\n\
  \n那天下午，指挥官将每个士兵的名字改得更长但更有意义。在接下来的几天里，部队在训练中磕磕，适应了更长的名字。但很快，安看到效率有所提高。\n\n一周后，在安离开加罗尔的最后一个晚上，哥布林再次发动进攻。这次入侵部队由十名经过高度训练的哥布林特种部队组成。加罗士兵轻松地击退了进攻。\n\
  \n当安离开驻军时，对那里力量的巨大改进感到有些自豪。在享受了片刻的幸福后，她转马向南，继续她拯救王国的任务。\n\n## 任务算法的伪代码\n\n伪代码是一种编写算法的非正式方法，使其易于理解。虽然它代表真实的计算机代码，但不遵循任何编程语言的语法。相反，它通常被写成编程语法和自然语言的混合体。\n\
  \n***\n\n在骑行时，安从包里掏出一张小纸：\n\n![](img/00077.jpg)\n\n她已经烂记如心。它包含了加尔温爵士教给她的算法。尽管很简单，看着这个算法总是带给她希望。\n\
  \n所以，在没有任何线索的情况下，安选择了一个新城市来收集信息。她将前往格尔夫咨询循环领域的顶级专家迭代器博士。如果运气好，她还会找到机会与怀尔顿博士交谈。\n\
  \n她小心地折好纸，把它放回包里。至少她有一个计划。\n\n## 数据结构\n\n![](img/00060.jpg)\n\n### 数组、链表与 Zed\n\n\
  数组和链表都是存储多个值的简单数据结构。这些数据结构在访问数据的方式上有所不同。\n\n数组就像一组具有固定数量槽位的储物箱。它的结构使得读取或写入数组中的任意元素变得很容易。\n\
  \n相比之下，链表是于扩展的。然而，你必须扫描到链条中的正确位置才能读取或修改节点。\n\n***\n\n在 Zed 在首都开咖啡店的一年后，生意非常好。Zed\
  \ 拥有一群忠诚的常客，他们每天早上去城堡的路上买咖啡。他们大多是官僚，专门从事数牛或抄制地图等工作。弗雷德里克国王的管家成了一个特别忠诚的顾客，每天喝的咖啡量惊人。甚至安公主在出发任务之前也经常光顾这家店。\n\
  \n有一天，一个竞争对手在街对面开了一家店。Zed 开始因为 MegaCup 的低价格和显眼的招牌而流失客户。Zed 知道他必须扩张。看着账本，Zed 发现他在早上卖了很多咖啡，但晚上几乎没有。他的客户都不想在回家睡觉时感到焦虑。Zed\
  \ 需要一种新产品——一种可以在晚上卖的东西。\n\n他的供应商告诉他一种来自王国南部地区的新咖啡，“低焦虑咖啡”。Zed 立即意识到这种咖啡将解决他的晚上销售下滑。他订购了八箱。\n\
  \nZed 需要一种方法来营销他的新咖啡。他店外的招牌写着“咖啡”，没有空间写其他内容。经过了一周的深度思考后，Zed 为店外订购了一个新的 ArrayDesignBoard\
  \ 菜单板。板上有四个槽位，可以在其中插入想要展示的菜单项目。他插了“咖啡”和“低焦虑咖啡”标签。\n\n这种新咖啡取得了巨大的成功。Zed 的生意在一周内增加了一倍。他在晚间班次增加了四名咖啡师。他甚至吸引了一些新的早晨客户，比如国王的裁缝，裁缝早已学会了不要把缝纫和浓咖啡混合。\n\
  \n然而，Zed 的竞争对手很快察觉了。一周后，Zed 发现 MegaCup 的招牌上了一个新招牌：“低焦虑咖啡”。战争开始了。\n\n![](img/00030.jpg)\n\
  \n\n\n\n接着，他的供应商告诉他另一种咖啡。这种被称为“双倍浓缩咖啡”，比普通冲咖啡要浓得多。一杯就能让你彻夜不睡。Zed 订购了八箱，并为 `ArrayDesignBoard`\
  \ 菜单换了一个新的菜单标签。\n\n同样，新咖啡迅速获得了成功。他的早晨客群非常喜欢它。光是管家每天早上就会额外点三大杯。Zed 还开始吸引城堡守卫士兵的新客户。他们需要一些强效的东西在值守期间保持清醒。\n\
  \n唉，MegaCup 很快在它的招牌末尾增加了一块新牌子。\n\n![](img/00050.jpg)\n\n下一次供应商来访时，Zed 详细询问了其他类型的咖啡。在钻研了供应清单后，Zed\
  \ 决定尝试一种新颖的方法。他每种口味订了一箱，共十种。他将这些口味进行轮换，不断提供新的花样。\n\n这种轮换方法对 Zed 的招牌非常有效。每当他更换一种口味时，他就会取掉一个标签并滑进一个新的标签。有时他一天内更换好几次菜单，比如在午后将“双倍浓缩”换成“低抖动”。\n\
  \nMegaCup 采取了不同的方法。经理很快发现，虽然在列表末尾添加新牌子很容易，但移除它们却令他沮丧。为了移除一块牌子，他必须：将其从上方和下方的牌子上都解开连接，然后将下方的牌子重新连接到上方的牌子上。这是一个非常耗时的过程。他决定利用招牌易于扩展供应的特性。他改为半永久性地提供六种不同的咖啡。在极少数情况下，他才会不情愿地花十五分钟解开招牌上的一个牌子并添加一块新的。\n\
  \n这两家咖啡店以这种模式运行了多年。Zed 的咖啡店轮换不同的选择，而 MegaCup 则提供一种更固定但种类更丰富的选择。\n\n随着咖啡市场的增长，两家企业都得到了蓬勃发展。最终，Zed\
  \ 的咖啡馆成为了王国里最大的企业之一，拥有一百多个个分店。Zed 继续激进地扩张，直到大糖饥荒降临。由于缺糖导致生意额下滑，Zed 决定离开咖啡界，转而投机椰子。\n\
  \n### 字符串与鸽子信息\n\n字符串是字符的序列。在许多编程语言中，字符串被实现为字符数组，你可以像访问数组中的值一样访问每个字符。\n\n***\n\n\
  “只有二十个字母？”Ann 问道。这个限制看起来很荒唐。谁听过有长度限制的鸽子信使信息？\n\n“是的，”Guelph 的鸽子大师确认道，“我们这里没有王国最强的鸽子。我们需要对信息的重量保持小心。”\n\
  \n“但二十个字母太短了，”Ann 反驳道。\n\n“实际上是二十个字符的限制，”鸽子大师解释道，“空格也计入总数。标点符号也是。”他在柜台上铺了一张微小的矩形羊纸。上面有二十个微小的灰色方格。每个方格都足够容纳一个字符。\n\
  \n“我想我们可以去找一只更强的鸽子，”鸽子大师提议道，“这可能需要一些时间，但我们以前这样做过。我听城堡里有可以携带多页信息的鸽子。你能想象吗？”他怀念地笑着向窗外望去。Ann\
  \ 以前从未见过如此严重的对鸽子的嫉妒。\n\nAnn 耸了耸肩。说实话，二十个字符绰绰有余。她还没有找到任何关于“黑暗”的有用信息。这条信息是对她父亲的礼貌；她答应过要定期更新。\n\
  \n由于没有合理的理由要求更长的信息，Ann 开始填充那些微小的方格：“没有进展。-Ann。”十七个字母。\n\n![](img/00017.jpg)\n\n\
  Ann 花了一点时间考虑可以在哪里添加更多信息。她可以删掉标点符号，但这只能省下两个字符。无论如何，她无话可说。\n\n她给了鸽子大师钱，看着他将信息系在鸽子的腿上。那只鸟无精打采地飞走了，勉强越过窗台。Ann\
  \ 短暂希望自己能跟着那只可怜的鸟回到城堡。相反，她离开了通讯办公室，继续她的搜寻。\n\n按照 Galwin 爵算法的规定，Ann 需要找到更多信息。她没有任何线索，最近尝试咨询\
  \ Conjunctione 博士、Whileton 博士以及现在的 Iterator 博士的尝试都惨遭失败了。事实上，她访问过的学者无一个能提供任何帮助。他们都忙于处理“重大问题”，甚至没空和她说话。她需要一些线索——任何线索都行。所以尽管内心深存疑虑，她还是决定咨询新亚特兰斯的神谕。\n\
  \n### Swimmy Friends 宠物店\n\n在数组中交换两个值是一项基础操作，有助于说明数组如何存储数据。数组中的每个条目都可以被视为一个独立的变量——它存储一条信息。为了交换两个不同条目中所包含的值，必须使用额外的（临时）存储。具体来说：1)\
  \ 将其中一个数组条目的数据写入临时存储，2) 将另一个数组条目的数据写入第一个条目的内存位置，以及 3) 将临时存储中的数据写入第二个数组条目。\n\n***\n\
  \nCasey 在 Swimmy Friends 宠物店的第一天进展并不顺利。在十五分钟内，他不小心让所有三十只乌龟逃跑了。接着，他在接下来的八小时里一直在把它们找回来。虽然乌龟行动缓慢慢，但它们向不同的方向分散并躲在商店货架下。无论他请求得多么客气，当他叫它们时，乌龟拒绝过来。\n\
  \n这一天在经理的严厉教训中结束了。经理提醒 Casey，Swimmy Friends 宠物店有声誉要维护。毕竟，它是王国最顶级的水生宠物店。国王都在这里买过宠物乌龟，国王的园丁上周也刚在这里买了一块大石头。\n\
  \nCasey 真诚地希望第二天能好一点。\n\n“Casey，我有个任务交给你，”Casey 进入商店时经理叫道。\n\n“没问题！”Casey 热热地回答。\n\
  \n“我们这周要对斑鱼进行促销，”经理解释道，“我想把它们放在前面的那个大缸里。你能把它们和霓虹鱼交换一下吗？”\n\nCasey 看着鱼区。灯光亮的鱼缸排列在整个商店墙上。前面是目前住着霓虹鱼缸。五个缸之外，二十四只斑鱼绕着一块小石头游动。两个鱼缸看起来都很重。\n\
  \n“你想让我移动鱼缸？”Casey 问。\n\n“当然不！”经理回答道，“鱼缸里满了水，比你还重。交换鱼就行。温度和 pH 值是一样的。”\n\nCasey\
  \ 点点头。他走向斑鱼缸，开始尝试用网捕捉它们。经理在旁边看着。\n\n“你在做什么？”经理问道。\n\n“把斑鱼移过去，”Casey 头也不回地回答道。斑鱼很快，而\
  \ Casey 并不协调。他挥着小绿网胡乱舞着，希望运气好抓到一只。\n\n“你知道斑鱼和霓虹鱼不能呆同一个缸里吧？”\n\n“嗯，”Casey 回答道，仍然处于专注中。\n\
  \n“所以，你打算怎么处理那只你抓不住的斑鱼？”经理提示道。\n\n\n\n\n经理等待着 Casey 看到解决方案。这并不是一道难题。最后，两分钟后，经理意识到\
  \ Casey 根本没法想出来。\n\n“用那个空水箱作为临时存储，”经理提示道，“第一，把灯真鱼放入空水箱。第二，将虎马灯移到旧的灯鱼缸。第三，将灯真鱼移到旧的虎马灯缸。”\n\
  \n“但这意味着有三次移动操作。我知道我可以在两次内完成，”Casey 回答道。他决心要证明自己是一个优秀的员工。\n\n经理叹了口气。“不行。你不能。你需要使用临时存储。否则，你最终会把虎马灯放进灯鱼缸，从而引起问题。”\n\
  \nCasey 想反驳，但他想不出更好的办法。“好吧，”他终于同意了。\n\n经理看着 Casey。虽然他半信半疑 Casey 能处理好这次鱼类调换，但他担心\
  \ Casey 之后会做些愚蠢的事。\n\n“办完后来找我，”经理交代道，“顺便离乌龟缸远一点，”他补充道以防万一。\n\n![](img/00003.jpg)\n\
  ![](img/00033.jpg)\n![](img/00024.jpg)\n\n## 指针和嵌入式橱\n\n指针（Pointers）是持有特定类型数据的变量：计算机内存中的地址。使用指针的一个主要优势是它们在与内存中存储的数据交互时提供的灵活性。单个相对较小的指针就可以指向内存中大块数据的位置，允许函数无需传递整个数据块本身即可访问数据。程序员还可以通过使用指针链接数据块来创建复杂的数据结构。\n\
  \n***\n\n强大的巫师马库斯住在新亚特兰斯市中心的一栋小排屋里。那里租金很高，景观也很糟糕，但这就是住在市中心的代价。老实说，这两个因素都没有扰到马库斯。令他恼的是排屋的大小。多年来，马库斯积累了很多物品，他喜欢有一个地方存放它们。但排屋只有一个衣柜，而且小得可怜。\n\
  \n作为一名强大的魔法师，马库斯转向魔法解决方案来改善局面。首先，他缩小了自己的物品，让所有东西都能装进衣柜。然而，他再也在那堆微小物品中找不到任何东西。一天晚上，他在地板上拿着放大镜待了两个小时，寻找他最爱的巫师帽。结果，他约会时迟到了非常晚。\n\
  \n接着，他尝试将他的财产脱水成粉，并放在有标签的罐子里。他的衣柜很快看起来像一个调料架。不幸的是，衣服重新加水后完全浸透了，一次时机不妙的喷嚏就把他最爱的斗篷散落在整个客厅里。马库斯很快也放弃了这个想法。\n\
  \n最后，他有了一个惊人的发现。他不需要把所有的财产都存在这里。只要他在需要时可以轻松取出它们，他就可以把它们存在任何地方。\n\n他在乡村郊外买了一座巨大的城堡来存放物品。当他需要某个物体时，他就会召唤它。同样，当他用完时，就会把它送回去。这个过程有效地给了一个巨大的虚拟衣柜。\n\
  \n在很短的时间内，马库斯发现自己有了一个新问题。他不再记得城堡里有什么，甚至不知道还剩下多少空间。过去几年的时尚被遗忘在城堡的走廊里。他发现自己经常会随机地从城堡的不同房间里召唤物品，只为了看看那里有什么——这个过程导致了一个令人不安的发现：一个两年前的蓝莓松芬。马库斯需要一个更好的系统。\n\
  \n为了追踪他在城堡存储的物品及其位置，马库斯创建了一个正式的会计系统。他将城堡分成一个巨大的、带有标签的网格。然后他创建了一卷列出所有物品的卷轴。每当他将一个物品发送到城堡时，他都会仔细记录一个发送该对象的指针。使用这卷卷轴，他就可以找到召唤任何物品的位置。他只需要在市中心的排屋里保留一个小小的指针卷轴。这个系统运行良好。\n\
  \n![](img/00008.jpg)\n\n或者，至少这个系统在大多数时候运行良好。偶尔，马库斯会粗心，忘记记录他把物品发送到了哪里。结果物品丢失了，城堡内部的空间被浪费了。其他时候，马库斯会在发送物体到那里之前忘记检查空间是否可用。一天晚上，从派对回来后，他不小心将外套发送到了与无价花瓶相同的位置。当大外套出现在花瓶内部时，花瓶爆炸了。这些就是粗心对待指针时固有的危险。\n\
  \n尽管偶尔会有意外，系统仍然运行良好。马库斯学会了仔细跟踪卷轴中的所有内容，并在新亚特兰斯市最时尚街区的小排屋里幸福地生活着。\n\n## 链表和洋海之旅\n\
  \n链表（Linked lists）是存储项目列表的数据结构。列表中的每个节点由几部分数据组成：存储在该节点上的信息（或指向该信息的指针）、指向列表中下一个节点的指针，以及（可选的）指向列表中上一个节点的指针。算法可以通过简单地沿着每个节点外的指针指向下一个节点来遍历列表中的项目。链表允许用户通过更改相应节点的指针来轻松插入和删除元素。\n\
  \n***\n\nAnn 对她前往新亚特兰斯神谕的洋海之旅感到兴奋了大约二十分钟。她站在船的栏杆上，看着海岸线远离，感受海风拂在脸上。船的帆在捕捉风时发出了悦耳的拍打声。这令人心潮澎湃。然后，令她非常失望的是，船开始了一系列令人作呕的摇晃和颠簸。\n\
  \nAnn 裹紧衣服抵御（变得寒冷的）风，坐在船甲板上，看着跟在后面的三艘船。第一艘在后面四百米处，第二艘在之后四百米处，第三艘又在四百米处。此外，Ann 知道还有一艘船在领先，在他们前方四百米处。五艘船共同构成了一个横跨海洋的里长船队。\n\
  \n![](img/00029.jpg)\n\nAnn 发现链队的安排非常迷人。当她询问船长关于链队的线性安排时，他愉快地详细解释了该线的功能。链队由一组沿着同一路线航行的船组成。头船引导链队。这种安排便于导航和安全。\n\
  \n船只之间的通信也让 Ann 着迷。每艘船都有两个特殊的成员，被称为指针，负责与其他船的通信。一艘船后方的指针可以使用色彩鲜艳的大旗帜与后续船前面的指针进行通信。遗憾的是，直到船长说了一句，Ann\
  \ 才意识到指针正在传递信息。老实说，看起来他们他们是在友好互动，也许是太热情了。\n\n当 #2 号船想向 #5 号船传递消息时，#2 号船后方的指针会向 #3\
  \ 号船前面的指针发出信号。同样，通过指针，#3 号船会将其转给 #4 号船，然后由 #4 号船转给 #5 号船。这是一个完全线性的系统，消息在传递过程中经过了每一艘船。\n\
  \n\n\n\n整个安排让 Ann 想起了她小时候读幼儿园的时光，那时学生们在郊外活动时被要求手拉手。每个孩子都恰好与两名同学保持接触，确保整条学生队伍保持完全连接。老师们会沿着队伍走动，仔细地对着名单来核对学生人数。\n\
  \n但在 Ann 心中里，幼儿园队伍最棒的地方在于它们具有**动态性**。如果 Ann 需要去洗手间，她只需要确保她两边的学生互相拉手，就可以离开队伍。当她回来时，她会选择一个点将自己插入队伍中，在那个点断开队伍，并通过与新邻居握手来重新建立连接。由于这些新加入的人员经常忘记擦手，这个过程还包括了新邻居们的大声抱怨。这些幼儿园队伍让\
  \ Ann 开开了眼界，看到了动态数据结构的威力。\n\n“船长，你们的船队会有增加或减少吗？”Ann 在一个早晨问道，“或者船队一旦出发就固定了？”\n\n\
  “船队当然会变化，”船长回答道，“事实上，今天晚些时候将会有三艘船从北帕塔戈尼亚加入我们。”他模糊地指了指北帕塔戈尼亚的方向，仿佛在说明他的观点。\n\n“它们会加入队伍末尾吗？”Ann\
  \ 问道，急于理解船队的动态情况。简单地将新船附加在队伍末尾是有道理的。这样一来，只需要新抵达船的首艘船和当前船队的最后一艘船进行连接即可。这就是他们在幼儿园时合并队伍的方式。\n\
  \n“不，不，”船长坚持道，“它们将加入 4 号船和 5 号船之间。5 号船是一艘特殊的战舰，配有额外的后向炮。它必须排在最后。船只将一个一个地插入链条中，通过它们的指针进行协调。那些指针可是了出色的水手。”\n\
  \n“但怎么做呢？”Ann 问道。\n\n“向你保证，非常简单。新船，我们称它为 `D`，它会停在我们的头船旁边然后慢下来。它会沿着船队缓慢移动，直到找到一个可以插入的位置：比如在\
  \ `A` 号船和 `B` 号船之间。然后重新分配指针。`D` 的后指针现在指向 `B`。`B` 的前指针现在指向 `D`。`A` 的后指针现在指向 `D`。而\
  \ `D` 的前指针现在指向 `A`。这一切都非常有组织。”\n\nAnn 非常兴奋。当下午船只到达时，她欣喜地看着它们那协调一致的“舞蹈”。这种简单性让她感到惊叹。在队伍中插入一艘新船只需要重新分配四个指针，每个方向两个。在对船队动态操作的兴奋中，Ann\
  \ 甚至忘记了她的晕症。\n\n![](img/00037.jpg)\n\n# 王子的投诉队列\n\n栈（Stacks）、队列（queues）和优先级队列（priority\
  \ queues）是控制数据提取顺序的数据结构。栈是后进先出（LIFO）的数据结构，返回最近插入的数据。队列是先进出（FIFO）的数据结构，返回最早插入的数据。优先级队列则返回优先级最高的插入数据（根据某些优先级值）。\n\
  \n***\n\n在成为国王之前，弗雷德里克王子有一个传统，即每周二二在大厅里听取他未来臣民的抱怨。上午 10 点，门会打开，他忠诚的臣民会挤满房间来提出他们的抱怨。在他感到特别慷慨的日子里，弗雷德里克王子甚至会要求他的管家处理一些抱怨。然而，在大多数时候，弗雷德里克认为，光是听取这些意见就已经尽到职责了。\n\
  \n每周二清晨 6 点，一大群人在投诉大厅门外聚集。有特别迫切忧虑的农民们在外面露营了好几天或几周，希望挤到人群最前沿，从而被选中讨论他们的抱怨。他们的抱怨可能会被忽视，这一事实并没有消磨他们的决心。他们需要被听到。\n\
  \n弗雷德里克从未怎么想过门打开之前发生了些什么。毕竟，他是王子。他为什么要关心他房间外发生的事情呢？\n\n这时，龙洛克（Rok）降了。6 月初，那条龙开始焚烧农田并吃牲畜——这是典型的龙的活动。然而，弗雷德里克继续使用他的系统，从房间前方挑选臣民。\n\
  \n7 月底，弗雷德里克终于选择了一位来此谈论龙的农民。“你的诉求是什么？”弗雷德里克问道。\n\n“一条龙吃了我的农场，”农民回答道。\n\n“龙？”弗雷德里克重复道，“在我们现在摧毁第二个农场之前，必须采取行动！”\n\
  \n弗雷德里克王子的宣告后是一片沉默。\n\n“怎么了？”弗雷德里克问，但没有人回答。弗雷德里克指了另一个农民并将问题指向他。\n\n“只是——额——自从它 6\
  \ 月来到这里以后，那龙已经摧毁了二十多个农场。我的农场在六周前被毁了。”\n\n“为什么我现在才听说？”王子吼道。\n\n“尊贵的先生，为了讨论这条龙，我已经排了六周的了。直到今天您才见我面。”\n\
  \n“还有多少人在这里谈论这条龙？”王子询问。房间里有一半的人举起了手。王子对大家大声叫。最后，他冷静了许多，派遣骑士把龙赶出城。\n\n“这种情况永远不会发生发生，”王子发誓道，“从现在起将有一个系统。每个人都写下自己的抱怨，并把它放在投诉栈的顶部。每周二上午\
  \ 10 点到 11 点，我将从栈中取出顶部的抱怨。这样，我就总能听到最近的抱怨。”\n\n房间里的每个人互相看着对方。他们发出了一个力不从心的欢呼：“万岁。”\n\
  \n在过去的几个月里，生活恢复了正常，投诉栈运行得和之前无组织的人群一样。接着龙洛克回来了。周三，它吃掉了一个农场，然后睡了一个星期的觉。\n\n在下一个周二，王子读了前十条抱怨。这十条都是关于上周日体育活动的裁判的。王子叹了口气。他回到书房，开始研究一种新系统。它必须让人们发泄情绪。它必须让王子找到最重要的问题。更重要的是，它不能占用他太多的时间；他真的很讨厌处理抱怨。他闭关了三周来研究他的系统。\n\
  \n\n\n\n\n下周一，他向他的臣民发表了演讲。“我设计了一套使用优先级队列的新系统。你们每个人都要在一张纸上写下自己的诉求。每个周一晚上，管家都会阅读每份诉求，并分配一个从\
  \ 0 到 10 之间的优先级。我们将首先处理优先级最高的投诉。”王子停顿了一下，等待着掌声。几个臣民无精打采地鼓了掌。管家面对这项新任务发出了出了出了可闻的叹息。他很清楚，每个人都会对分配的优先级向他抱怨。\n\
  \n于是，王国采用了一套基于优先级的投诉系统。随着时间的推移，臣民们接受了这套系统。王子继位成为国王，带领王国度过了前所未有的幸福时期，并对龙 {做出了快速反应。王国里的每个人都很快乐——当然，除了管家之外。\n\
  \n## 二叉搜索树与蜘蛛\n\n二叉搜索树（`BST`）通过组织数据，允许按值进行高效搜索。数据被存储在树节点中。每个树节点还维护指向最多两个子节点的指针：左子节点和右子节点。该树维持这样一个属性：在每个节点处，左子节点所在的值小于当前节点的值。相比之下，右子节点的值大于（或等于）当前节点的值。这种结构允许你通过向下移动树并向你正在寻找的值的方向进行分支，从而高效搜索。\n\
  \n***\n\n斯派克（Speck）过着典型的蜘蛛生活。他织网、吃苍子，并喜欢和邻居讨论天气。事实上，对于那些从未访问过他的网的人来说，他看起来像一只完全正常的蜘蛛。\n\
  \n然而，斯派克对蜘蛛来说有一个不寻常的怪癖。他对食物选择非常痴迷，要求的多样性在节肢动物中是闻所未闻。斯派克坚持在网里储备至少 25 种不同类型的昆虫。\n\n\
  斯派克还坚持食物供应必须绝对有序。如果他不能快速找到想要的那个，那 25 种昆虫有什么用呢？虽然大多数蜘蛛将昆虫随机分布在整个网中，但这种想法在斯派克看来是荒谬的。他厌恶这种无组织的状态。相反，像任何理性的厨师一样，斯派克按照字母顺序组织了他的食物选择。\n\
  \n这些偏好的结果是一种新类型的网，是斯派克通过数日的尝试错误开发的。他将其称为“二叉搜索网”。他坚信这将会彻底改变昆虫存储的世界。\n\n这张网由节点——存储他昆虫的蜘蛛网簇——以及节点之间的网线组成。整个网是垂直排列的。在顶部，单一的“根”节点挂在一根木梁上。每个节点下方最多可以有两个“子”节点。这些节点用坚韧的蜘蛛丝牢固地附着在它们的父节点上。结果是，网随着向下延伸而分支变得越越宽，呈现出模糊的三角形形状。\n\
  \n为了组织他的昆虫，斯派克利用节点来执行特定的字母排序。如果你站在网的任何节点上，那么左侧路径上的所有昆虫在字母顺序上必须在当前节点昆虫之前。同样，右侧路径上的所有昆虫在字母顺序上都必须在当前节点昆虫之后。因此，如果你想找到某种特定的昆虫，你始终可以使用当前节点的昆虫来决定向左还是向右。\n\
  \n例如，一天早晨，斯派克决定早餐想吃一只苍蝇。他从睡觉的网顶部开始，检查那里的昆虫。那是一只瓢虫。虽然这不是他想要的昆虫，但它告诉了他该往哪个方向走。由于在字母顺序上苍蝇在瓢虫之前，斯派克选择了左子节点继续他的搜索。\n\
  \n在下一个节点，斯派克发现了一只甲虫。看到它让他感到胃里翻腾。诚然，斯派克从未太喜欢甲虫，而早餐吃甲虫的想法让他非常不愉快。他匆忙过了那个节点。这一次他知道该向右走了，因为苍蝇在甲虫之后。\n\
  \n于是，斯派克找到了那只三天大的苍蝇。\n\n\n\n\n\n“我完全不知道这只蜘蛛在想做什么，或者它为什么要这样织网，”安回答道，“不过，在二叉搜索树的例子中，这种分支结构使得搜索特定节点变得非常快。”\n\
  \n“你认为这只蜘蛛在整理它的虫子吗？”\n\n“当然不，”安回答道，“或者……可能不是。但这种相似性确实惊人。”\n\n安和船长都沉默地站着，看着蜘蛛断开它网底部的一个空节点。空空的丝网在微风中飘远。\n\
  \n“就像一艘船离开了护队，”安注释道，赞叹于网的节点是如何连接在一起的。\n\n“你觉得我们应该把我们的船投入这些‘树’中的一个吗？”船长问。\n\n“你为什么要那样做？”安问。\n\
  \n“嗯……你听起来这像是一种更优越的组织方式，”船长说。\n\n安耸了耸肩。“不同的数据结构有不同的用途。二叉搜索树适合搜索。链表适合存储顺序化数据。”\n\n\
  “我认为在你的情况下，用直线效果更好，”她继续说道，“如果你使用树，护队在后退时就会分叉——每艘船后面都会跟着两艘船。驶入港口将变得异常困难。我确信至少有一艘船会搁浅。而且你可能会扰扰路径上的每一艘渔船。”\n\
  \n安看着那棵巨大的船之树冲向一艘小渔船的画面，摇了摇头。“不，”她结论道，“那样完全行不通。”\n\n![](img/00072.jpg)\n\n船长点了点头，看起来松了一口气。安在想，他是否真的愿意根据对蜘蛛网的几句随口评论就重新考虑护队的阵型。然而，她不再谈这个话题，以免让船长尴尬。在和她多了几句寒暄后，船长回到了自己的工作中。\n\
  \n安继续观察了两个小时的蜘蛛，对这张网奇异的设计及其背后的未知原因感到着迷。\n\n## 缓存与亚历山大图书馆\n\n缓存数据意味着将数据的副本存储在快速访问的位置，以加速未来对该数据的访问。关键的权衡在于，存储位置越快通常越小，因此存储的数据也越少。例如，从\
  \ RAM 访问数据比从硬盘读取快得多，但 RAM 的容量更小，且单位存储成本更昂贵。通过缓存经常使用的数据，你可以极大地提高程序速度。\n\n* *\n\n\
  亚历山大图书馆至今仍因其收藏的规模和广度而闻名世。然而，很少有人知道图书馆真正的魔力在于管理员以惊人的速度找到相关资源的能力。在几秒钟内，他通常就能找到回答访客问题的权威参考。\n\
  \n对于年轻的彼得来说，这种魔力一直是一件令人惊叹的事。他在离图书馆四个街之遥的小房子里长大，度过了许多下午坐在桌子旁，听着管理员回答问题：\n\n“我应该给我的新宠物牦牛吃什么？”\n\
  \n“在亚历山大哪里能找到最甜的李子？”\n\n管理员所掌握的知识范围几乎是传奇性的。彼得梦想着有一天能学会这种魔法。在经过十年的训练后，彼得如了心愿：他被接收为管理员的学徒。\n\
  \n学徒的第一天，彼得提前三个小时到达。当管理员带他参观图书馆时，得得急切地跟在他身后，在新笔记本上飞快地记录笔记。尽管彼得对公共区域了如指掌，但他吸收了每一个字。参观结束后，管理员和他的新学徒在参考台后就位，等待今天的第一个访客。\n\
  \n第一个问题来自一个拿着大石头的矮个男人。“我正尝试造一个轮子。而且，嗯……我不确定该用什么形状。你们有什么好的参考资料吗？”\n\n管理员消失在书架间，几秒钟后出现，拿着一卷名为《轮子及其设计方法》的卷轴。访客非常高兴。他把卷轴带到附近的桌子，开始快速浏览。\n\
  \n“噢……我明白了……一个圆……嗯……太棒了，”访客低声自言自语。\n\n“你是做到的？”学徒问，“你是怎么这么快找到卷轴的？请教我图书馆的魔法。”\n\n\
  “魔法？”管理员问，“我不确定那个，但我可以给你展示我的系统。”\n\n管理员带彼得来到后室。房间里只有两盏小油灯，光线昏暗。后面有一扇门通往库房，那里存放着成千上万卷卷轴。管理员走到一张放着咖啡壶和小堆卷轴的小桌旁。他指着那些卷轴，“我通常在这些里面找到答案。”\n\
  \n彼得很困惑。“二十卷？图书馆有数万卷卷轴。在后室里放二十卷有什么帮助？它们有魔法吗？”\n\n“完全没有，”管理员笑着说，“事实人们相当无趣。他们问的问题都是同一类型的。事实上，我发现一天中\
  \ 95% 的问题只需要二十卷卷轴就能回答。”\n\n“只有这些？”彼得问，显而地失望。\n\n“是的，”管理员回答道，“你期待什么？”\n\n“我不确定。但我确实期待一些魔法的东西。也许你可以召唤卷轴，或者把自己传送到正确的书架上。但是……这看起来像是作弊。”\n\
  \n“作弊？”管理员笑了起来，“你知道为了让这高效到看起来像魔法需要付出的多少努力吗？你不能随便挑卷轴。必须是正确的卷轴。”\n\n听到这个挑战，学徒精神了些。“那你是怎么挑的？感应吗？”\n\
  \n“当我刚开始时，我把经常阅读的卷轴放在我的缓存里。每当有人阅读卷轴时，我都会记录。我为每卷卷轴计数。”\n\n“我明白为什么那样有效，”学徒说，听起来有点无聊。\n\
  \n“啊！但它没用！”管理员惊呼道，“记得我们两年前那场大洪水吗？在整个洪水期间，我手里还有三卷关于如何度过旱灾的。那是一场灾难。”\n\n“于是我新主意，”他继续道，“我可以保留更多数据并使用统计学。我仔细追踪人们查看哪些卷轴，并将其与季节、天气和当时的流行联系起来。我创建了复杂的预测模型，预测某天哪些卷轴最受需求。我每天早上都可以预填我的书架！”\n\
  \n“那有效吗？”彼得问。\n\n“有效。但工作量太大了。所以我停止了。”\n\n“最后，我变懒了，把最近的卷轴留在书架上。当我需要去书架时，我就拿哪卷最久没被使用的卷轴换回来。事实证明这是一个非常不错的系统。”\n\
  \n“真的吗？所以亚历山大图书馆背后的魔法就是你把最近查看的二十卷卷轴放在后室的书架上？”\n\n学徒呆呆点了点头。现在他确定本该去当铁匠的。\n\n## 算法\n\
  \n![](img/00058.jpg)\n\n函数与航行\n\n函数是程序中自成一体的代码块。它们有定义的输入和输出，并且可以从代码的其他部分调用。函数允许程序员在程序的不同位置复用常见的代码块。\n\
  \n\n\n\n在目睹了船上指示系统的运作后，安对船只的各个方面都着迷了。她花了几个小时观察船员。安看着水手们升起风帆、系好绳子、清洁甲板并记录航向。她对经验丰富的水手们无懈可击的技能感到惊叹，对厨师助理笨拙的动作感到好笑。在强烈好奇心的驱动下，安试图尽可能多地学习每一项工作。\n\
  \n一天早晨，安甚至向船长请求是否可以借一本船用手册。船长总是乐于助人，很快带了一本 4,096 页的《水员手册》（第 3 版）。安震惊了。\n\n“为什么这么大？”她问。\n\
  \n“要学的东西多呢，”船长自豪地回答道，“普通水员需要五年的时间学习基础知识，还需要三十五年才能学会手册上的其他内容。”\n\n“我明白了，”安说。四十年的教育似乎有些过头了。不过话说回来，仅仅是读完手册本身可能就需要很多年。在安的经验中，操作手册很少是快速读完的。\n\
  \n在感谢了船长后，安带着手册来到一个安静、阴凉的角落。她翻阅着手册，扫过不同的主题。她跳过了许多关于胡须长度规定和鹦鹉护理的页面。最后，她选择了“将船固定在码头”这一主题。指令占据了整整三页密小字体。这种详细程度让安感到惊讶。每条指令都详细说明了任务的每一个细节。\n\
  \n安读着每一行，试图吸收信息。她甚至在自己的鞋带上练习了将绳子系成结的指令（长达二十五行），然后立刻责备自己没有认出常见的“奶奶结”。大约半小时后，她对自己对该流程的理解有了信心。\n\
  \n下一部分描述了如何将小艇固定在船上。同样，这一部分也占据了三页密小字体。当安翻阅这些页面时，她开始识别出上一节的指令。事实上，关于系绳子的那二十五行完全相同。她在两个章节之间快速来回翻看以确认。\n\
  \n第二天，安向船长汇报了这一发现。\n\n“观察得敏锐！”他夸赞她，“很多概念都是相似的。例如，拿绳子来说，系结的方法只有几种真正好的方法。”\n\n“那为什么要逐行重复这些指令呢？”安问。\n\
  \n“你每次都要做一遍，”船长回答道，“跳过系结的部分就太糟糕了。小艇会漂走的。几年前有一只木舟发生过一起可怕的事故……”\n\n“我明白，”安打断道，“但你不需要重复所有内容。为什么不能说类似‘用奶奶结系绳’这样？这能为你节省大量空间——光这一节就有二十四行。你只需要将常见任务拆分成它们自己的指令集即可。”\n\
  \n“这会让指令更难理解，”船长说，“现在，每一步都安排得完美完美。我可以把关于修剪主帆的三十页内容交给任何水手，而不需要假设他们有任何先验。你会惊讶的，有多少新水手在第一周没有读完整本手册！”\n\
  \n“重用核心概念会让手册更容易理解，”安辩论道，“一旦水手学会了如何系特定的结，他就可以任何场景下这样做。它本身将变成一个基础步骤——就像计算机函数一样。”\n\
  \n“我想这会让内容变得更短，”船长同意道，“但实际上，书的长度不是问题。我们还用书来压舱石，所以有重的书是有用的。”\n\n“比这更好，”安反驳道，忽略了关于压舱石的评论，“如果你找到了更好的结呢？现在你必须更改每一条使用当前结的指令。那可能是一个漫长且容易出错的过程。如果你把同样的事情写一百遍，你总会在其中某一次犯错。你这里可能已经有几十个错误了。”\n\
  \n船长轻微皱缩了一下，安想自己关于可能错误的建议是否有些过分了。批评船长总是有风险的。\n\n“如果你想指导水手做一些新动作，比如系好热气球呢？”安继续说道，“你有关于那方面的指令吗？”\n\
  \n“嗯，没有，”船长承认道。他本能地拿过笔记本，记下了一个增加热气球章节的提醒。\n\n“这样说会更简单：1) 抓住绳子，2) 用奶奶结将其系在左侧护栏上。这些是你甚至可以口头传达的指令。水手只需要学会执行几个基本函数就可以开始。”\n\
  \n船长沉默了，凝视着大海。片刻后，他缓慢地点了点头。\n\n“我觉得你是对的！”他大声宣布。在和他一起在海上过了几天后，安意识到船长是一个喜欢大声宣布某事的粉丝。更重要的是，只要可能，他也愿意改进流程。\n\
  \n安笑了。\n\n“我打赌这不仅仅是系绳子。我们用来通信的信号也可以被拆分成函数。所有的灯都用同样的程序加油。所有的甲板都用同样的方式擦拭——当然，是逆时针擦。还有修剪胡须……”船长慢慢环顾着船舱，评估着不同技能的重用性。\n\
  \n突然，他转向安。“你能帮我重写这本书吗？我们可以把这些内容拆分成你描述的这些独立单元。这将彻底改变整个行业！”\n\n\n\n\n在五月初的一个早晨，克莱尔（Clare）意外地卷入了火战。当时她正离开面包店，一道离离的法术将她的面包变成了一只蛙。真正的目标——她身后巫师拿着的一块黑麦面包——毫发无损，而且看起来很可吃。不幸的是，克莱尔的面包就不是了，面包迅速从她手中跳落，顺着街跑掉了。克莱尔愤怒了。\n\
  \n那天早晨，克莱尔决定打破僵局，彻底结束这场战争。由于她对“elementary”（基础）一词的发音没有特定意见，她选择与最近的一个派系的指挥官见面。在为期三小时的会议中，她严厉地询问了战争的进展。在此过程中，她了解到巫师们是如何看待他们的法术的。面试以一个显而易见的结论结束：巫师们对计算复杂度一无所知。多年的施法法让他们变得既懒惰又低效。\n\
  \n克莱尔知道，谁先重新理解计算复杂度，谁就能赢得战争。于是，她召集了最近派系的所有巫师，在当地的酒吧进行了一场辅导课。\n\n“你们的问题在于你们的技术太低效了，”她开始说道。\n\
  \n巫师们低声抗议着。这个会计师胆竟竟教他们如何施法的艺术？他们威胁要将她的饮料——那杯调制得很好、温度恰好处的茶——变成燕麦片。\n\n“但有办法的！”克莱尔继续道，“有一种新技术，叫做`Big-O\
  \ notation`（大 O 表示法），它将改变局势。这种表示法可以告诉你随着战斗规模的增大，法术的表现如何，让你知道哪种法术效率最高。你只需要问：面对`N`\
  \ 个不同的敌人时，施展一个法术需要多少步骤？然后剔除掉所有的常数因子，只关注增长最快的部分。”\n\n“例如，”克莱尔继续说，“如果一个法术施法需要三步，无论敌人数量有多少，那么它就是一个\
  \ `O(1)` 法术——常数代价。相比之下，如果你对每一对敌人都需要一步，那么代价就是 `O(N²)`——平方级代价。在大规模战斗中，你需要那些扩展性良好的法术。”\n\
  \n巫师们抱怨着抗议。\n\n“那永远行不通。”\n\n“这把问题简化得太过了。”\n\n“这个会计师疯了！”\n\n克莱尔无动于色。“你最喜欢的法术是什么？”她问第一排的一位巫师。\n\
  \n他被点名脸红了，小声嘟囔道：“伙伴保护咒（Spell of Pairwise Protection）。”\n\n“它是……？”克莱尔引导道。\n\n“嗯，如果你把它施在一个敌人和一个朋友身上，朋友就能受到该敌人的整整五分钟。”\n\
  \n“施法需要多久？”\n\n“两秒。这是一个快速法术。”\n\n“但它的扩展性如何？”克莱尔问。\n\n“扩展？”巫师问道。\n\n“我的意思是：随着战斗中的人越来越多，性能是如何变化的？”克莱尔解释道，“这个法术的性能取决于战斗中的人数。”\n\
  \n巫师呆呆地看着。\n\n克莱尔叹了口气。“当你处于大战斗中，你需要理解随着战斗人数增加，使用法术的代价是如何增加的。以‘鱼味物体咒’（Spell of Things\
  \ Smelling Like Fish）为例。你对战斗中的每个敌人都施一次法，他们在接下来的半小时内都会闻到腐鱼的味道。每个敌人占一步，所以它是一个 `O(N)`\
  \ 法术。它随敌人数量线性扩展。”\n\n“相比之下，”克莱尔继续道，“伙伴保护咒要求你对每一对朋友和敌人施法。如果有 `N` 个敌人和 `M` 个朋友，你需要施法\
  \ `M ⠮ N` 次——每对施一次。所以代价是 `O(M ⠮ N)`。如果你有很多朋友，那将花费很长时间。”\n\n“幸好亨利没有几个朋友，”后排有人开玩笑道。接着是几声压抑的笑声。克莱尔忽略了这条评论。\n\
  \n“鱼味物体咒施法需要 15 秒，”后排的一位巫师反对道，“你的`Big-O notation` 并没有体现这一点！”\n\n“你说得对，”克莱尔承认。`Big-O\
  \ notation` 仅用于比较法术随战斗规模扩展的比例。这正是你们策略缺失的地方。你们仍然习惯于更简单的决斗世界，那里敌人总是只有一个。你们太关注常数因子了。”\n\
  \n克莱尔继续说，“在某种规模的战斗中，一个 `O(N²)` 法术总是比一个 `O(N)` 法术花费长得多。在某一点，常数因子就不重要了。这就是`Big-O notation`\
  \ 的价值。”\n\n![](img/00041.jpg\n\n那个巫师转守为攻。“你是想告诉我，施展‘大音电音音乐咒’（Spell of Loud Techno\
  \ Music，需要一小时且影响所有敌人）要比施展‘临时电梯音乐咒’（Spell of Temporary Elevator Music，需要一分钟但只影响一个敌人）更好？看起来你的`Big-O\
  \ notation` 确实是这样建议的。”\n\n是的，”克莱尔说，“如果敌人超过 60 个，大音电音音乐咒就比临时电梯音乐咒更有效。”\n\n巫师震惊了。他在脑子里一遍又一遍地重复数学题以检查她的答案。克莱尔知道他最终会得出相同的结论。会计师在数字方面是出名的敏感。\n\
  \n“那三角恋咒（Spell of Love Triangles）呢？那个施法只需要一秒钟，而且结果非常好，”另一位巫师争辩道。\n\n“你需要对所有的三个人组施法，所以它是\
  \ `O(N³)`。如果你有二十个对手，那就是 `20 ⠮ 20 ⠮ 20 = 8000` 秒！那是两个多小时！”巫师们齐齐吸了一口气。\n\n### 使用递归检测诅咒\n\
  \n递归是一种解决问题的方法，通过构建同类型更小子问题的解决方案来构建问题的解决方案。通常情况下，递归实现为函数调用自身来解决子问题。\n\n* * *\n\n\
  “谁被诅咒了？”安（Ann）问道。她感到一阵恐惧，环顾着围着她的人群。人群看起来非常紧张。\n\n\n\n\n“一个接一个，”安说道。她迅速转向镇议会议员。“你，只有你，告诉我问题出在哪里。”\n\
  \n“我们听说你正肩负着王国从黑暗中拯救出来的使命。黑暗已经袭击了我们这儿。我们中有一个人中咒了！你必须帮助我们。”\n\n最后那句话听起来像是一个命令，而不是礼貌的请求。安不喜欢他的语气。一阵恼火闪过她的心头。\n\
  \n“只有一个人中咒？”安问道，“这听起来完全不像是什么所谓的‘黑暗降临’。”\n\n人群并不买账安的评价。在一片嘈杂的嗡嗡声中，她能听到几句尖酸的讽刺话。随后，随着镇议会议员的发言，人们陷入了紧张的沉默。\n\
  \n“这是一个非常可怕的诅咒，”他说，“难道你看出来它是具有传染性的吗？”\n\n“水肿？”安问道。她讨厌带水肿的诅咒。那不仅对受害者来说很痛苦，对周围的其他人来说也很不舒服。\n\
  \n“当然不是。你看到水肿了吗？这是‘近距离焦虑之咒’（Curse of Proximal Angst）。”\n\n瞬间，安对整个情况豁然开朗。近距离焦虑之咒是一种特别恶毒且有效的诅咒。它利用了“坏苹果”理论：只有一个人中了咒，但它会影响特定半径内的所有人。仅仅是靠近那个人就会引起非理性的愤怒。\n\
  \n“你不知道是谁中咒了？”安确认道。现在她知道了自己为什么生气，努力控制自己的愤怒。她深吸了一口气，等待着刻薄的回。\n\n议员也压制了自己的情绪。“我们试图弄清楚，但无济于。我们目前只排除了两个人：我和芬德利（Findley）。今天早些时候，我们去寻求帮助，愤怒就消失了。我们以为诅咒已经失效了，就回来了。它并没有失效。它还在这儿！”\n\
  \n“你知道诅咒的半径吗？”安问道，保持注意力集中在事务上。\n\n“至少一英里，”议员回答。\n\n“我们可以让大家分散那么远吗？”安问。\n\n议员摇了摇头。“这里有\
  \ 512 名村民。我们不能让每个人都隔至少一英里。没有空间。我们想过一个接一个把人送出去，但那样太慢了。”\n\n安沉默地思考了一会儿。“我们将使用**递归分治法**，”她宣布道。\n\
  \n“那是什么？”议员问。\n\n“一个非常简单的算法，”安在来得及停止自己之前傲慢地说。\n\n“对不起，”她迅速道歉道。“我的意思是这是一个简单的算法。我们从全镇的一组开始。然后你们平均分成两组——每组一半的人。两组向相反的方向走半英里并等待一小时。”\n\
  \n“这有什么帮助？”议员问。\n\n“一小时后，只有一组会生气。那组包含了中咒的人。一旦他们感觉好些了，另一组就可以回家了。”\n\n“这只排除了半个村，”人群中有人抗议道。\n\
  \n“没错，”安继续道，“然后我们对剩下的小组递归地应用该算法。它再次分成二。两组分开，等待，然后得知哪一组包含中咒者。”\n\n议员点了点头。“我们可以继续递归搜索中咒者。每小时，我们都可以排除剩余村的一的人。”\n\
  \n“没错，”安赞同道，“对于 512 个人，你需要九个小时。首先你排除 256 人，然后是 128 人，再是 64 人，然后是 32 人，再是 16 人，然后是\
  \ 8 人，4 人，2 人，最后是 1 人。你最后剩下那个中咒的人。”\n\n“我们要对那个人怎么办？”议员问。\n\n安再次思考。显然，中咒者需要解除咒语。安只知道一个她保证能做到那事的巫师。“把他或她送到一位可以解除咒语的巫师那里。马库斯巫师住在新雅典（New\
  \ Athens）。他能够破咒。”\n\n安迅速补充道：“但中咒者必须快速找到他。我们不能让整个新雅典都遭受近距离焦虑的影响。事实上，我建议直接跑过新雅典的街道冲向马库斯的门口。如果人们不让路，就试着大喊‘我有传染水肿！’。或者在跑过时用肘用力撞开他们。”\n\
  \n安意识到自己正在发牢，并闭了嘴。镇民们用混合着震惊和普遍焦虑的神情看着她。\n\n“快去吧，”安结束道。\n\n留下这个警告，安决定是时候离开图灵顿（Turington）了。她匆匆告了别。\n\
  \n一小时和几英里后，安的大脑开始变得清醒。她意识到自己从未问过那个最基础的问题。为什么会有人中咒？图灵顿是一个小镇，以友好的渔民和安静但高效的闪闪卡作者闻名。那里几乎不是会中咒的地方。\n\
  \n安短暂地考虑过回去，但她害怕再次感到那种焦虑。她服自己这并不重要，继续她的旅程。\n\n![](img/00015.jpg)\n\n## 使用二分查找猎龙\n\
  \n二分查找是一种在排序列表中高效查找目标值的算法。该算法维持一个不断缩小的搜索窗口。它通过反复排除剩余搜索空间的一半来缩小该窗口。在每一步中，你检查当前窗口的中间项，并将其与目标值进行比较。如果中间值小于目标值，就可以排除窗口的下部分；如果值大于目标值，就可以排除窗口的上部分。\n\
  \n***\n\n早晨的消息简直令人沮丧。弗雷德里克王醒来才十分钟，就决定今天会非常糟糕。事情开始得还算顺利，管家告诉他他最爱的皇冠正在擦拭，无法使用。然而，紧随其后的是代理首席骑士芬德利的报告，一条龙正恐扰着他的王国。\n\
  \n“告诉我发生了什么，”王疲惫地命令道。他讨厌龙。\n\n“有一条龙，”芬德利宣布道。\n\n“你已经告诉我那个了。现在告诉我发生了什么。有人见过那条龙吗？它攻击过任何人吗？它已经出现了六周没人告诉我？”王促道。\n\
  \n“我们收到了六次目击，先生。没有人受伤，但麦当农失去了他的奖牛。我想它今天早上刚出现的，先生。”\n\n“麦当农的牛？那头去年获得冠军的大牛？”王询问道。如果他记得没错，那是一头巨大的牛，是龙的完美目标。\n\
  \n“是的，先生，”骑士回答道。\n\n王叹了口气。这个故事听起来像教科书式的龙攻击。很快龙就会吃掉王国一半的牛。“好吧，你最好带上猎龙人消灭那条龙。”\n\n\
  \n\n\n“用去年的牛之王比赛排名！”国王失去了耐心吼道，“那是一份按体型大到小排序的牛列表！”\n\n“啊。当然了，陛下。我们会顺着列表往下找，直到找到巨龙为止！”骑士确认道。\n\
  \n国王点了点头，松了一口气，觉得骑士终于独立思考了。布雷弗爵士（Sir Braver）和猎龙猎人将按照顺序访问列表上的每个农场，并找到巨龙。尽管他试图用这个想法来安慰自己，脑海中的警钟却拉响了。\n\
  \n“不是顺着列表往下找，”国王告诫道，“对搜索有什么了解吗？”\n\n骑士看起来很困惑。他原本确定自己正处于正确的道路上。“但是，陛下，我不明白，”他说。\n\
  \n“你穿梭于农场之间需要多久？”国王问道。\n\n“需要几个小时，陛下。”\n\n“列表上一有多少农场？”\n\n“大概有一百个。”\n\n“这意味着你可能需要花几百个小时。等那时，巨龙已经吃了更多的牛了。甚至它可能已经离开了。”\n\
  \n“但是，陛下——”\n\n“使用**二分查找**，”国王命令道。\n\n“二分查找，陛下？”布雷弗爵士问道，后悔自己在《骑士算法论》课上睡着了。\n\n“从列表中间的农场开始，检查那只牛是否还在那里。如果还在那里，就把列表一分为二，扔掉下半部分，然后在列表上半部分重复这个过程。相反，如果中间的那只牛不见了，就把列表一分为二，扔掉上半部分，然后在下半部分重复这个过程。你每访问一个农场，就将列表一分为二，并将搜索集中在两部分中的之一。”\n\
  \n“但是陛下，这听起来很复杂，”布雷弗爵士抗议道。\n\n“并不复杂，”国王反驳道，“很简单。如果列表中间的牛还在它的农场里，那么列表中它下面的所有牛也都在。巨龙就是这么吃的。它不会先吃较小的牛。那太荒谬了。\n\
  \n“另一方面，如果中间的牛不见了，那么列表中它上面的所有牛也不见了。巨龙不是随机吃牛的。这些事情是有顺序的。”\n\n“如果我们在搜索时巨龙移动了怎么办？”骑士问。\n\
  \n终于，这是一个合理的问题。“你的搜索实际上追踪了两个边界：你已知被吃掉的最小牛，以及你已知未被吃掉的最大牛。当你发现这两个边界在列表上相邻，且你没有看到巨龙时，就去那只最大的未吃掉的牛并在那里等待。”\n\
  \n“但是陛下，这比简单地扫描列表到底快在哪里？”骑士问道。\n\n国王再次叹了口气。他对骑士处理这项任务能力的信心正在迅速瓦失。“如果巨龙袭击了 45 个农场，你扫描这些农场需要多久？90\
  \ 小时吗？但在二分查找的情况下，在检查第一个农场之后，你就会排除了列表上的 50 个农场——无论如何。在检查第二个农场之后，你又排除了 25 个。每一次，你都在将问题减半。事实上，你只需要检查七个农场就能找到巨龙。”\n\
  \n![](img/00046.jpg)\n\n骑士点了点头，但看起来并不信服。“但是陛下，你确定吗？”\n\n国王尖叫道。“我当然确定！我是国王！而且，每个白痴都知道二分查找是对数时间算法，而扫描列表是线性时间算法。现在，去把那条龙找回来！”\n\
  \n在他漫长的骑士生涯中，布雷弗爵士第一次逃跑了。他告诉自己，他逃跑是为了尽快执行国王的命令。但事实上，国王看起来真的很生气。\n\n看着他最顶尖的骑士甲甲作响地走过走廊，国王决定确实是时候回床上睡觉了。\n\
  \n## 为什么裁缝会使用插入排序\n\n插入排序是一种简单但可能效率低下的数组排序算法。该算法通过迭代方式对数组的开头进行排序，扩展排序范围，直到整个数组都排序完毕。\n\
  \n在算法第 `ith` 次迭代开始时，数组中的前 `i` 个数字已经是有序的。然后算法取出数组中的第 `i + 1^{th}` 个数字，在排序前缀中找到插入它的正确位置，并将其插入（将随后的数字向下移动）。因此，在这一步之后，数组中的前\
  \ `i + 1` 个数字就都有序了。\n\n***\n\n“插入排序！”彼得嘲笑道。此时彼得在亚历山大图书馆当学徒才三个月，就已经因为现在掌握的计算知识而傲慢自大了。\n\
  \n“谁会用插入排序？”彼得继续说道，越说越气势如人，“这是一个二次方算法——`O(N²)`！你需要学习合并排序的奇妙。卷轴就在我这儿。”\n\n“噢，”大震惊的顾客评论道，犹豫地接过了卷轴，“谢谢？”\n\
  \n“发生什么事了？”首席管理员从书架间回来问道。\n\n“你那年轻的学徒在‘教导’我店里应该使用的正确排序算法，”顾客解释道。\n\n“他在用插入排序，”彼得嘲讽地补充道。\n\
  \n管理员给了顾客一个疑惑的眼神，但他并没有像彼得预料的那样大笑。\n\n“我以为你是来拿一张关于去除黑莓渍的卷轴的。我花了一段时间才找到那一个，”管理员说道。黑莓不是时季，管理员不得不深入书架去寻找。\n\
  \n（注：此处原文提到卷轴是关于黑莓渍，逻辑衔接）\n\n顾客点了点头。“在等待时，我向小彼得解释了我的店是如何运作的。” 这里的问了一些关于如何对衣服排序的有趣问题。\n\
  \n“啊，”管理员说道。他很了解裁缝，“在你这种情况下，插入排序是有道理的。”\n\n彼得大为震惊。“什么？”他尖叫道。他感到脸发红。怎么会有人反对如此明显的计算复杂度差异？这简直和支持亚历山大足球队一样糟糕。\n\
  \n管理员严厉地看着彼得。彼得很尴尬地低头看着地板。\n\n（注：此处原文逻辑略有跳跃）\n\n“我不明白，”彼得小声补充道。\n\n“也许你应该解释一下你的店到底是如何工作的，”管理员建议道。\n\
  \n“很简单，”裁缝解释道，“店很小，所以我只有一个衣服架子。我喜欢按尺寸排序，因为顾客进来时很方便。我使用二分查找来快速找到所需的任何尺寸。”\n\n“这很有道理，”彼得同意道。二分查找是彼得解决问题的喜欢的算法之一。至少裁缝使用了合理的搜索算法。\n\
  \n“每周一，我会收到一批衣服，需要把它们加入架子。我先把它们放在架子的末端，这样它们就不会掉在地板上起皱。今年的面料很挑剔。我希望羊毛能再流行一会儿。\n\n\
  “总之，当我把它们放在架子上后，我一端有 `N` 件有序的衣服，后面是 `M` 件新的未排序的衣服。所以我取出每一件新衣服，并将它们插入到已经排序的衣服组中。插入第一件衣服后，我有\
  \ `N+1` 件有序的衣服和 `M-1` 件未排序的衣服。我不断重复这个过程，直到所有衣服都插入。”\n\n![](img/00049.jpg)\n\n插入前\n\
  \n![](img/00056.jpg)\n\n插入中\n\n![](img/00038.jpg)\n\n插入后\n\n“但是——”彼得开口。管理员打断了他。\n\
  \n“我想彼得想知道的是为什么你不把所有的衣服都从架子上取下来，使用像合并排序之类的算法，”管理员说道，“其他的排序算法更快。”\n\n“因为衣服重，”裁缝解释道，“从架子上取下来很麻烦。那会很累。但衣服确实很容易从架子上滑下来。”\n\
  \n彼得看起来很困惑。从架子上取东西有多难有什么关系呢？这是一场关于计算复杂度的争论。\n\n\n\n\n“我认为你遗漏的因素是：当大多数人使用插入排序时，插入操作是非常昂贵的，”管理员向彼特解释道，“想象一位正在试图给账本中的一个账户列表排序的会计师。每一行都是一个账户——就像计算机数组中的条目。你不能直接插入某个东西并让其他部分自动向下移动。那将需要一种极其枯燥的魔法。每当会计师想要进行插入时，他都必须手动将该位置以下的所有内容向下移动。单次插入是一个昂贵的\
  \ `O(N)` 操作。这意味着大量的擦除和重写。”\n\n“但对于一个裁缝师来说，插入操作是一个简单的 `O(1)` 操作。他只需要把大衣往下一推，”管理员补充道。\n\
  \n彼特点头认同。在内心，他对物理世界的这些细节影响了不同操作的成本感到不恼。理论世界要纯洁得多。然而，他确实同意管理员和裁缝师的观点；在这种情况下，插入排序似乎是合理的。他想，还有哪些现实世界的应用可能会挑战他的计算假设。\n\
  \n当天晚些时候，彼特尝试对几辆推车的书籍进行插入排序。不幸的是，书籍在推车书架之间并不容易移动，彼特发现自己花了一整晚在书架之间移动书籍。他多花了三个小时才完成排序。他在凌晨\
  \ 2 点离开图书馆，对自己感到愤怒，因为没有在开始排序之前确定插入操作的成本。\n\n### 霸凌者与冒泡排序\n\n泡排序是另一种简单的排序算法。该算法反复遍历数组，如果相邻元素顺序不对，则交换它们。结果是，较大的元素“泡”到数组的末尾，而较小的数字则“沉”下去。这个过程一直持续到数组排序完毕。与插入排序一样，泡排序的最坏情况性能为\
  \ `O(N²)`。\n\n***\n\n彼特已经排了两个小时队，感觉到肩膀被人拍了拍。他向后看去，感到一阵恐惧。可怕的**托德**（Todd）正愤怒地瞪着他。不过说回来，可怕的托德在彼特看来总是很愤怒。\n\
  \n可怕的托德以他最近在亚历山大地区年度年度投掷石头比赛中的表现而闻名。他是第一位赢得主赛项目的蜡烛学徒。他获胜的一投使用了一块两百磅重的石头，震动两英里外都能感觉到。\n\
  \n在非正式场合，他也因霸凌者而闻名。\n\n“嗨，托德，”彼特向他打招呼。他的声音很小，出卖了他的恐惧。\n\n托德哼哼了一声，示意彼特让开。在一种奇异的勇气驱动下，彼特坚持住了。他拒绝放弃自己在队列中的位置。东亚历山大足球队的季票销售将在一小时后开始。今年彼特决心要买到优质季票。他心心的是中场位置。\n\
  \n“对不起，托德。我先来这里，”彼特解释道。\n\n托德从上到下量了彼特。然后，伴随着更大的哼哼声，托德把彼特拎起来，转了个身，把他放在了自己身后。\n\n\
  ![](img/00075.jpg)\n\n”嘿！”彼特叫道，但托德已经在拍排队中下下人的肩膀了。彼特短暂地考虑过拍拍托德的肩膀并和他对质，但他很快抛弃了这个念头。彼特见过托德获胜的一投。\n\
  \n彼特气得发抖。这不公平。为什么托德可以排在前面？这些事情是有原则的。\n\n当彼特在脑子里默默抱怨时，他看着托德慢慢地在队伍中向前移动。一个接一个，托德和比小的人交换位置。托德的推进直到他遇到肌肉发达的铁匠瑞恩（Wren）时才停止。\n\
  \n接着，彼特感到肩膀又被人拍了拍。转过，他看到了大吉姆（Big Jim）。彼特叹了口气，走到旁边让吉姆走在他前面。像托德一样，大吉姆也在队伍中向前方移动。令彼特高兴的是，吉姆甚至到了托德前面，占据了瑞恩之后的位置。\n\
  \n现在，小迈克（Tiny Mike）站在彼特身后。彼特试图瞪着小迈克，明确表示迈克不能往前挪。迈克甚至没有尝试。\n\n![](img/00065.jpg)\n\
  \n这个过程又持续了一个小时。每当一个高大的人发现自己等在一个小的人后面，就会有人拍肩膀并交换位置。每当彼特在队列中后移，他就感到一天更加沮丧。由于身材矮小，彼特发现自己无法与任何人交换位置。小时结束时，整个队伍已经按身高排好了序，彼特在最后。心灰意冷的，彼特离开了队列回到图书馆。\n\
  \n![](img/00044.jpg)\n\n当彼特在图书馆柜台后面生闷时，他记得今年也可以通过鸽信购票。他匆忙填写表格，要求“可用最好的”。他借了图书馆的一只鸽子。鸽子扇动翅膀飞走了，带着彼特获得合理座位的唯一希望。\n\
  \n十分分钟后，鸽子带着中排中场的确认单回来了。彼特激动了。座位离活动很近，而且在他最喜欢的花生卖贩所在的区域。他可能甚至在大吉姆之前就买到了票。\n\n那天，彼特学到了两个重要的教训。第一，泡排序对霸凌者非常有效。第二，在近乎即时的鸽信订票时代，排队并不值得。\n\
  \n### 合并排序与幼儿园的小朋友们\n\n合并排序是一种递归排序算法，基于两个直观原理：\n\n1. 排序非常短的列表很容易。事实上，排序只包含一个项目的列表是轻而易举的。\n\
  2. 将两个已排序的列表合并在一起比排序一个长列表更容易。\n\n利用这些想法，合并排序可以简单描述为：“将数据分成两半，分别排序每一部分，然后将它们合并回来。”该算法非常高效，时间复杂度为\
  \ `O(N log N)`。\n\n***\n\n当安沿着海岸向亚历山大城移动时，她看到一队从港口出发的船。她看到彩色的旗帜协调着船队的形成，她再次想起了在幼儿园第一次接触链表。\n\
  \n\n\n\n\n在听到“排队！”的指令时，班级分成两个大小尽可能相等的组。\n\n![](img/00021.jpg)\n\n### 排序前的班级\n![](img/00032.jpg)\n\
  \n### 第一次划分\n随后，这些小组各分成两个更小的组。\n\n![](img/00066.jpg)\n![](img/00062.jpg)\n\n划分一直持续（递归地），直到每个小组只包含一个人。\n\
  \n然后，各小组按照它们划分的顺序重新合并。合并从每对学生开始，他们会合并回之前的双人小组。每个孩子都看着自己的伙伴，快速地按顺序排好。只有两个人时，这很容易。只需快速比较一次就能确定顺序。\n\
  \n![](img/00011.jpg)\n\n当两个人的小组排好顺序后，孩子们合并成更大的小组。同样，合并非常简单——你只需要比较两排队伍最前面的两个孩子。数值最小的孩子必然是前两个孩子之一，因为队伍已经是排序好序的。或者，正如梅奇夫人所说：“如果你不在队伍的最前面，你就不能排在后面。所以站好，等轮你了！”\n\
  \n前两个孩子进行比较，其中一个向前一步，开始形成新的有序队伍。\n\n![](img/00012.jpg)\n\n### 合并步骤 1\n然后，第二小的一个仍然必须是前两个孩子之一。依此类推。\n\
  \n![](img/00074.jpg)\n\n### 合并步骤 2\n![](img/00014.jpg)\n\n### 合并步骤 3\n![](img/00001.jpg)\n\
  \n### 合并步骤 4\n![](img/00047.jpg)\n\n### 合并步骤 5\n队伍迅速合并在一起，形成更大的小组。每一个合并步骤都有效地撤销了之前的某轮划分，按排序顺序重新形成小组。这个过程一直持续，直到整个班级都排序完毕。\n\
  \n这就是梅奇夫人的班级赢得第六届年度排序锦标赛的原因。他们的班比亚军整整提前五分钟就完成了排序。事实上，当弗里尔先生的五年级学生还在比较右臂上的雀斑数量时，梅奇夫人的冠军们已经去午餐了。\n\
  \n## 流感爆发期间的排序\n在选择算法时，理解其应用背景背景至关重要。算法的计算复杂度只告诉了部分情况。其他需要考虑的因素包括数据规模、其他限制的存在以及可以利用的额外问题结构。例如，对于已经几乎处于正确顺序的极小量数据，冒泡排序是一个合理的选择的算法。\n\
  \n***\n\n多年来，梅奇夫人的幼儿园班赢得了王国内的每一场排序比赛。持续练习与归并排序算法的强大组合让他们无所不能。这所班级每周都在打破记录。很快，梅奇夫人不再满足于胜利；她的班级必须在比竞争对手少一半的时间内完成排序。唯一的真正胜利是完全的压制。\n\
  \n很快，梅奇夫人对她班级的能力过于自信了。她坚信她的学生无论什么情况下都能获胜，并且在向她遇到的每个人解释这一点时也毫无压力。\n\n接着，在 1 月，流感袭袭了。梅奇夫人的班级几乎所有学生都请假了，只剩下三个学生。就在这种情况下，沃拉斯先生向她挑战了一场排序比赛。他也有三个健康的学生，所以两个班级实力均敌。但他的二年级班级只理解低级的冒泡排序技术。他的搜索可能耗时\
  \ `O(N²)`！\n\n梅奇夫人甚至同意让孩子们根据某种简单的东西进行排序。经过片刻的思考，沃拉斯先生提议用鞋码。\n\n裁判一喊出“开始”，梅奇夫人的班级就分成两组。一组有两个学生，另一组只有一个学生。归并排序开始了。\n\
  \n相比之下，沃拉斯的学生们互相看着。比利和苏在脑中进行了一次快速的比较并交换了位置。现在三个人都处于正确的顺序上。\n\n“不！”梅奇夫人意识到发生了什么时哀叫道。\n\
  \n已经太晚了。比赛结束了。\n\n## 神谕的数组\n算法和数据结构结合使用以创建复杂的程序。例如，算法的某一步可能会排序数组的内容，或者算法可能会在二叉搜索树中搜索值。\n\
  \n***\n\n“神谕会有信息的，”安在攀爬狭窄的山路时对自己说。神谕住在新亚特兰蒂斯较高的山峰之一的顶上。安已经爬了八小时。\n\n安责备自己没有早早咨询神谕。虽然她可以归咎于漫长的航海或险恶的山路，但安知道真相。她害怕面对神谕。根据传说，神谕时而疯狂时而刻薄。在到达新亚特兰蒂斯后，安在寻求神谕之前几乎和了一百个人。\n\
  \n当安转过最后一个转角时，她看到神谕坐在路边的椅子上等待。老人冷冷地看着她。安试图隐藏自己的恐惧。\n\n片刻后安恢复了。“神谕大人，我来向您询问信息。”\n\
  \n“你想知道关于即将到来的黑暗吗？”神谕问。她的声音沙哑，语气傲慢。\n\n“你见过它了？”安问。\n\n“没有，”神谕回答道，“目标显而易见。你父亲已经咨询了王国里的每一位预言者。当然，除了我。”\n\
  \n神谕盯着安。她的表情混合着愤怒和厌恶。\n\n神谕似乎没有注意到这句话。\n\n“我现在为什么要帮你？”\n\n安深吸了一气，开始辩论。“黑暗将威胁所有的王国。世界的命运取决于……”\n\
  \n“噢，你练习了一段演讲，”神谕大笑起来，“我最喜欢他们练习了。你学会跳舞了吗？”\n\n安大吃眼镜。“你说什么？”\n\n神谕啐了一口，“哈！你觉得我是第一次听‘请拯救世界’的演讲吗？”\n\
  \n“神谕大人——”安开口，但被神谕可怕的笑声打断了。\n\n分钟后，神谕平静下来。“你想知道什么？”神谕问。笑容消失了，她恢复到厌恶地盯着安。\n\n“你会……帮我吗？”安被这种互动彻底搞懵了。\n\
  \n“你听过我说的话？”神谕问，“我听过这个演讲一千次了。这意味着你不得到信息是不离开的。而我想让你尽快离开。”\n\n“噢，”安说。\n\n“你想知道什么？”神谕再次问道。\n\
  \n“我想知道关于黑暗，”安说。\n\n“我不蠢。那部分涵盖过了，”神谕回答道，“你想知道关于黑暗的什么？是什么？如何停止？是否有喜欢的诗人？我只回答你一个。”\n\
  \n安立即回答。“我想知道如何停止黑暗。”\n\n神谕看起来很失望，但点了点头。她从椅子移到地板上开始工作。首先，她拿出一大叠牌牌并洗了牌。然后她开始在地面上铺开牌，八张牌排成一行。每张牌上都印着一种安不知道的语言的单词、一种亮圈的排列，以及底部的一个数字。其中一张牌除了数字\
  \ `999` 之外。\n\n![](img/00069.jpg)\n\n神谕动作的节奏让安着迷了。“当地上没有八张牌时，在队伍里增加另一张牌，”安低声自语，将神谕的动作描述为一个循环。她完全不知道自己为什么会那样说。\n\
  \n\n\n\n当 Ann 盯着那一排卡片时，她的感知发生了变化。她不再看到的是八张卡片，而是看到了一个包含八个值的数组。一个循环在数组箱格中迭代的图像充满了她的脑海。Ann\
  \ 摇了摇头想要清空脑脑，但那个图像依然存在。\n\n神谕继续工作。她小心地捧起所有八张卡片，开始对它们进行排序。\n\nAnn 试图理解神谕在做什么，但计算图像不断侵入她的脑海。\n\
  \n“你在做什么？你刚把它们放下了，”Ann 问道。\n\n神谕抬起头来。“现在我正在对它们进行排序，”她说，“每张卡片的底部都有一个数字。我正在按顺序排列它们。”她的语气表明她不想再受到打扰。\n\
  \nAnn 很有兴趣地观察着排序过程。神谕使用了经典的合并排序，递归地划分卡片堆，然后将它们重新合并。动作平静而熟练——几乎让人抚慰人心。\n\n这八张卡片现在按顺序排列，再次在地上形成了一个数组。神谕一边自言自语，一边逐个查看每张卡片。\n\
  \n![](img/00053.jpg)\n\n计算图像再次涌入 Ann 的脑海。神谕不再是一个刻薄的老妇人；她变成了一台计算机。卡片变成了地上的数组。排序、指向和低语都是\
  \ Ann 无法理解的算法的一部分。\n\n在短暂的片刻，一切似乎都达到了完美的和谐：算法、循环和数据结构。即使 Ann 不懂这个算法，她也亲眼见证了计算的运行。她笑了。\n\
  \n“你大多数时候都会成功，”神谕说，她沙哑的声音让 Ann 从出神中惊醒。\n\n“你说什么？”Ann 问。\n\n“答案，”神谕回答道，“你大多数时候都会成功。”\n\
  \n“那是什么意思？”Ann 问。\n\n神谕耸了耸肩。“我怎么会知道？我只是读答案。我并不总是理解它们。你问我如何停止黑暗，我告诉你‘你大多数时候都会成功’。这些字字面上面上就是这个意思。”神谕指了指卡片上的打印文字。\n\
  \n“所以你只是随机选了八张卡片，对它们进行了排序，然后读了它们？”Ann 问。\n\n神谕回着她，没有回答。\n\n“好吧，那个回答一点用也没有，”Ann 反议道，“这怎么会有用呢？”\n\
  \n“是你问的问题，我回答了。现在走吧。”\n\n尽管尝试争论了几，Ann 仍然无法获得更多信息。最后，神谕厌倦了争论，蹒跚跚地走回了自己的房子。\n\nAnn\
  \ 站在山顶，思考着那个信息是什么意思，更重要的是，接下来该怎么办。\n\n## 大 O 表示法与锤击物体\n\n大 O 表示法关注算法随着输入规模增长而增长的（最坏情况）性能。因此，它只关注运行时间中受数据大小影响最大的部分。在大\
  \ O 表示法中，常数项是会被舍弃的。\n\n***\n\n“我做到了！”Judd 冲进图书馆时宣布道，“我做到了！”\n\nPeter 从柜台后抬起头。“做到了什么？”他问道，揉了揉眼睛睡意。\n\
  \n“我彻底改革了造马蹄的艺术，”Judd 自豪地说道。\n\nJudd 是亚历山大的一个铁匠学徒，也是 Peter 的朋友。像所有学徒一样，他梦想着为自己的领域做出重大贡献——推动技术水平的进步。然而，正如\
  \ Peter 发现的，改革自己的领域实际上是一项极其困难的任务。他自己改进图书馆科学的尝试结果都很惨淡，在一次特别尴尬的案例中，甚至导致了住院两天。\n\n\
  “怎么做到的？”Peter 问。\n\n“这很有技术性。你对造马蹄了解多少？”Judd 问。\n\n“什么都不懂，”Peter 承认道。他是一个管理员学徒，从未去过铁炉。当他想到这里时，想起自己曾用过锤子。当时他正试图挂画或拍苍蝇。那是很久以前的事了，细节现在很模糊。\n\
  \n“关键是要把马蹄敲平。你必须用锤子反复敲击直到它足够平。这需要很大的体力。”\n\nPeter 礼貌地点头。这个描述完全符合他脑海中铁匠用大锤敲击金属的形象。\n\
  \n受到鼓励的 Judd 继续说道：“马蹄越大，你越需要多敲它。每一轮每英寸需要敲十次。十次！但马蹄在你敲击的地方会凸起。所以对于较长的马蹄，你需要进行更多次的平整处理。事实上，马蹄每增加一英寸，你就对整个物体再敲一遍。所以如果马蹄长度为\
  \ `N` 英寸，你需要挥动锤子 `10 ∙ N ∙ N` 次。”\n\nJudd 停下来，等待 Peter 的反应。片刻后，他补充道：“对于四英寸的马蹄，那是\
  \ 160 下！”\n\n“哇，”Peter 回道。这似乎是正确的反应，但 Peter 并不知道这多不多。毕竟，铁匠整天都在敲东西。\n\n“你知道我是怎么做的吗？”Judd\
  \ 催促道。\n\n“什么？”Peter 假装好奇地回答。\n\n“我发现了一种每英寸只需敲八次的方法，”Judd 大笑着说道。\n\n“就这？”Peter 问。他并不是故意的无礼，但每英寸省下两下似乎并不是什么大事。那仅仅是一个常数因子。\n\
  \n“那很多了，”Judd 回答道。他显然对 Peter 非常不悦。\n\n## 分析的概念\n\n在计算机科学中，我们关注算法所需的资源如何随输入规模而增长。主要的资源是时间和内存。我们使用大\
  \ O 表示法来描述这种增长。\n\n大 O 表示法关注算法随着输入规模增长而增长的（最坏情况）性能。因此，它只关注运行时间中受数据大小影响最大的部分。常数项在大\
  \ O 表示法中是会被舍弃的。\n\n***\n\n（注：用户提供的文本重复了大 O 章节和 Judd 的对话。我将按照规则提供唯一的文本。）\n\n\n\n\n\
  图由一组节点和一组连接这些节点的边共同定义。图可以用来表示大量的现实世界系统，包括社交网络、计算机网络和交通系统。例如，在交通网络中，节点可以是城市，而边可以是城市之间的道路。\n\
  \nAnn 在夜幕降临前到达了 G’Raph 市。它看起来更像是一座巨大的沼泽，而不是一座正规的城市。细小的泥土岛屿点缀在景观中，像疣子一样从泥浆中凸出来。每个泥土岛上都立着一栋小建筑——通常是房子或店铺。这些岛屿通过数量到难以想象的绳桥连接在一起。\n\
  \n尽管有一块巨大的标牌上写着“欢迎来到 G’Raph：桥梁之乡”，但 Ann 确信自己来错地方了。这不可能是她父亲口中赞誉的那个 G’Raph。听他描述，世界上一些最顶尖的大脑将\
  \ G’Raph 造成了一个智力中心。她真的能在这里找到任何答案吗？\n\nAnn 深吸了一气，当沼泽的空气充盈肺部时，她立刻后悔了这个决定。她咳嗽了几声，失望地了摇头，朝城市走去。她的第一站是\
  \ G’Raph 市厅。她希望市长能向她介绍一些可以帮助她完成的人。\n\n不幸，Ann 很快发现她不能直接走到市政厅。每个小泥土岛只有几座桥与其邻岛屿相连，这为她的下一步去向提供了有限的选项。这种安排要求她停下来思考路径，而不是仅仅考虑她要去的方向。\n\
  \n最后，在穿过三十座桥后，Ann 在一个小农场停下来问路。农场边缘的一块小木牌上写着“欢迎来到托马斯的农场：G’Raph 最棒萝卜的家”。那个农民正在沼泽泥浆中收割萝卜，看起来很乐意提供帮助。\n\
  \n“打扰一下，先生。您能指一下去市政厅的方向吗？”Ann 问。\n\n“方向？我猜是在那边。但你需要过那里的那座桥。”农民的双臂指向了不同的方向。\n\n“你确定吗？”Ann\
  \ 问。根据她的经验，去市政厅最快的方法就是朝那里走过去。\n\n“你不是这儿的人吧？”农民问道。\n\nAnn 摇了摇头。\n\n“是因为桥的问题，”农民解释道，“为了到达\
  \ G’Raph 的任何地方，你必须理解不同岛屿是如何连接的。每座桥都形成两个岛屿节点之间的连接。所以，为了从 `node A` 到 `node B`，你需要走正确的桥梁序列。”\n\
  \n“我朝这边走吗？”Ann 问，指着背离市政厅的方向。\n\n“你需要从这里去 McFane 的农场，去酿酒厂，去客栈，再到 24 小时洗衣店，最后到市政厅。那是五座桥。”农民在手指上数着步数。\n\
  \nAnn 盯着他看。\n\n“我给你写下来吧，”农民提议道。他掏出一张废纸，画了一幅小地图：\n\n```\n![](img/00005.jpg)\n```\n\
  \n“好了，”他说，把纸递给 Ann。“每一条线都是一座桥。只要顺着桥从一个岛屿到另一个岛屿，就没问题的。”\n\n“谢谢，”Ann 说。\n\n看着地图，她确认了自己首先需要离开市政厅。她的头疯狂地转着。人们在这里在这里是怎么找到路来的？至少她可以确定，Marcus\
  \ 的魔法罗盘在这里将毫无用处。\n\nAnn 并不知道，正是 G’Raph 的这种结构迫使那里的人们变成了一个算法思考者的城市。正是在 G’Raph 市，Ann\
  \ 将找到她任务中的第一个真正的线线索。\n\n## 有向图与桥\n\n图中的边可以是方向性的，也可以是无向的。有向边表示单向关系，例如：从 `Node A`\
  \ 到 `Node B` 有一条链接。无向边表示双向关系，使得 `Node A` 和 `Node B` 相连。无向边和有向边的区别对于图的结构以及算法在图上的运行方式都非常重要。\n\
  \n当 Ann 在市长办公室等待时，她研究挂在墙上的 G’Raph 地图。地图本身巨大，占据了房间的整个南墙。地图包含至少一千个泥土岛屿（用小圆表示）和几千座桥（用线表示）。每座桥都清晰地标记着一个数字，Ann\
  \ 假设那是岛屿之间的距离。看到整个城市的地图被绘制出来，Ann 再次疑惑为什么有人会在这样一个不宜居住的沼泽中建造一座城市。\n\n“Ann！”市长大声打招呼，“自从我上次见到你，你长了很多。至少有十年了。你过得怎么样？”\n\
  \n“我很好。谢谢您的关问。您呢？”Ann 回答道。\n\n她完全没有见过这位市长的记忆。不过，考虑到她十年前还那么年轻，她并不指望能记得他。尽管如此，Ann\
  \ 坚信她应该记得这个男人。光是他那浓密的灰色络腮胡就不可能忘记。那些胡须轻易地盖住了他半张脸。\n\n“我很好，”市长回答道，“G’Raph 的生活非常精彩。到目前为止你觉得我们这个小镇如何？”\n\
  \n“我遇到了非常有魅力且乐于助人的人。然而，我必须承认你们的岛屿确实有些挑战，”Ann 诚实地回答。\n\n市长笑了起来。他转向地图。“是的，这种正常。幸运的是，我们最好的学者开发了一些算法。一旦掌握了这些，生活就会变得简单得多。”\n\
  \n“我想，”Ann 回答，完全信服了。\n\n“你知道，以前并不总是这么简单，”市长低声继续道，“我的前任搞乱了我们的桥梁系统。他实际上让每座桥都变成了单向。”\n\
  \n“真的吗？”Ann 惊讶地吸了一口气。她已经知道在这里绕行需要长时间。把所有路径都变成单向的想法太荒谬了。\n\n“确实，”市长回答道，“他认为这样可以优化流量。承认，这确实让流量流过了每座桥。但也意味着你在规划路径时必须考虑每座桥的方向。更糟糕的是，由于每座桥只能单向，某些路径变得太长了。他甚至在一些高流量岛屿之间建造了双桥——从这里到那里一座，从那里到这里另一座。也许你奇怪为什么在市场和洗衣店之间有平行桥？”\n\
  \n“我没朝那边来，所以我没有机会奇怪，”Ann 解释道。\n\n“噢，这就是原因。在第二座桥之前，人们从市场走到洗衣店需要走九座桥。那简直是灾难！”\n\n\
  “第二座桥有帮助吗？”Ann 问。\n\n“有。然而，建造额外的桥太昂贵了。不像在地图上画线，建造桥需要真正的努力。最终，我们重新回到了使用双向桥。”\n\n\
  Ann 同意地点头。根据她所见，每座桥可能需要好几天才能建成。她无法想象努力会增加一倍。\n\n最后，Ann 决定说明她访问的真正目的。“先生，我父亲一直对 G’Raph\
  \ 的理论家们赞有有加。我相信您知道我的任务以及王国面临的模糊定义的危险。我可以留在这里向你们的学者们学习吗？”\n\n市长脸上脸上绽出了灿烂的笑容。“当然可以！”他宣布道，“欢迎你呆多久。我向你保证，你会发现我们学者的工作受益匪浅。明天一早，我会带你去\
  \ G’Raph 图书馆。”\n\n\n\n\n\n在感谢市长后，安（Ann）开始返回旅馆。当她穿过从干洗店到旅馆的桥时，她很感激这座桥可以从任何方向通过。她太累了，没有精力通过完全不同的另一套桥梁在格拉夫（G’Raph）绕路。\n\
  \n## 边的权重\n\n图可以有带权边，也可以有无权边。在带权图中，每条边都关联有一个数值权重。权重的解释取决于图所代表的内容。例如，在交通图中，权重可能表示两个节点之间的距离，或者可能表示计算机网络中两台计算机之间发送消息的成本。\n\
  \n格拉夫的两位学者，埃德加（Edgar）和弗罗伦斯（Florence）在图书馆会了安。他们两个看起来都兴奋得非常厉害。市长曾警告过安，格拉夫的学术界很少有机会展示他们最新的算法，但她没想到会有这么大的活力。这两位学者就路径路由和聚类问题没完没了地闲论，如此热烈，以至于安也开始感染了他们的兴奋情绪。\n\
  \n在图书馆地下室一个狭小而拥挤的办公室坐下后，学者们立刻抽出一大叠地图。每张地图显示的都是同一组岛屿——格拉夫市。然而，每张地图在桥梁旁边都包含不同的标签。\n\
  \n“这些标签是什么意思？”安问道。\n\n“节点或边上的标签吗？”弗罗伦斯问道。\n\n“节点？边？”安问，“我的意思是桥。”\n\n“哦。抱歉，”弗罗伦斯说，“每当我看这些地图时，我看到的都是图数据。职业习惯，你懂的。每个岛屿都是一个节点，每座桥都是一条边。所以每条边都连接两个节点。这是一个非常有用的抽象。”\n\
  \n“我明白了，”安说，“既然如此，边上的标签意味着什么？”\n\n“这取决于地图，”弗罗伦斯回答道，“这张标注的是岛屿之间的距离。我们用它来进行路径规划。”\n\
  \n“我理解标注桥的长度。这允许你们计算两个岛屿之间的最短路径，对吧？你们还会怎么标注边呢？”安问道。\n\n![](img/00028.jpg)\n\n“距离只是关注点之一，”埃德加说。他一直静静地坐在角落，喝着他的第九杯咖啡。“还有成百上千种你可能想要考虑。例如，这张地图标注了每座桥的气味。我们用它来规划路线。有些桥跨越了特别糟糕的沼泽，你知道的。我们想在旅游时避开那些桥，所以给它们设定了高成本。”\n\
  \n“这张标注了通过桥梁所需的预计时间，”弗罗伦斯插话道。她希望防止埃德加开始一场关于咖啡驱动的、关于在沼泽生活多么不愉快的演讲。“我们用它来计算不同的疏散方案。”\n\
  \n“疏散？”安惊讶地问，“你们为什么要疏散？”\n\n“几年前发生了一些关于龙的，”弗罗伦斯回答道，“我们没有考虑到通过一座旧桥实际上花费的时间。它完全搞乱了疏散。在龙烧掉了一座桥后，有十个人被困在了干洗店。他们被困了一个星期。”\n\
  \n“而且在那之后的三个月里他们都没有停止抱怨，”埃德加补充道。\n\n安点了点头。被困在干洗店一个星期的前景似乎相当糟糕。“你们最常用的是哪张地图？”她问道。\n\
  \n“当然是这一张，”弗罗伦斯和埃德加同时回答道。他们都指向一张标注有岛屿间距离的地图。\n\n“你们用它来进行路径规划？你们是怎么做的？”安催促道。她渴望学习更多关于图算法的知识。\n\
  \n“迪杰斯特算法（Dijkstra’s algorithm）！”\n\n“那是什么？”安问道。她承认自己对图算法的了解并没有达到理想水平。\n\n“你会喜欢它的，”埃德加说，“它涉及到滑板车。”\n\
  \n## 滑板车上的迪杰斯特算法\n\n迪杰斯特算法寻找从给定的起始节点到图中所有其他节点的最短路径。它要求所有边的权重必须是非负的。它的运行原理是维护一个“已访问”节点集合，并不断更新到每个未访问节点的临时距离。在每次迭代中，最近的未访问节点被添加到已访问集合中，并更新到其未访问邻居的距离。\n\
  \n“我们首先创建一个包含城市中所有岛屿的列表，”埃德加开始说道，“我们将它们都标记为‘未访问’，并给它们一个无穷大的临时距离。起始岛屿除外；我们给它的距离为零。你总是不需要移动就能从这里到达那里。”\n\
  \n“无穷大的距离显然是不正确的，”安打断道。她今天早上从旅馆走到图书馆时，那并不是无限的距离。\n\n“当然是不正确的，”弗罗伦斯同意道，“迪杰斯特算法不断寻找到每个节点的更短路径。当我们更新列表时，距离会一直减小。由于目前我们还没有找到任何路径，所以我们使用能使用的最大距离。这样，我们找到的任何路径都会更好。”\n\
  \n这个解释对安来说听起来合理。然而，她并没有完全明白这会走向何。\n\n“然后，有趣的开始了，”埃德加继续说道，“我们不断访问岛屿，直到访问了所有的岛屿！这就是我们骑滑板车到处跑的部分。”\n\
  \n在开始描述之前，他深吸了一口气。安天真地认为这是为了戏剧效果。\n\n埃德加解释道：“在算法的每个循环中，我们遵循相同的程序：\n\n1. 我们找到距离起点最近的未访问岛屿。\n\
  2. 我们骑着滑板车去那座岛屿。通常我和弗罗伦斯会比比赛。这增加了一些趣味性。\n3. 一旦到达了该岛屿，我们就找到与它相的所有岛屿——即它的邻居——并更新它们的临时距离。对于每个未访问的邻居，我们计算通过当前岛屿到达它的距离——即当前岛屿的距离加上到该邻居的距离。如果这个新距离更短，我们就找到了更好的路径并更新距离。\n\
  4. 我们将当前岛屿标记为已访问，因为我们现在有了该岛屿的最短路径。\n\n然后对下一个最近的未访问岛屿重复该程序。”\n\n解释结束时，埃德加气喘吁吁。他喝了几口咖啡平复了一下。\n\
  \n“在最后，所有的岛屿都被访问了，我们得到了一份每个岛屿最短距离的列表，”弗罗伦斯心地补充道。\n\n“有一件事我不明白——”安开始说。\n\n“举个例子会有帮助，”埃德加插话道，“假设我们从图书馆开始。它成为我们的当前节点，距离为零。其他所有地方从无穷距离开始。”\n\
  \n埃德加说话时，从一堆看起来惊人的大量相同地图中取了一张新的格拉夫地图。这些地图让安想起了小孩子的纸垫。埃德加用深色马克笔圈出了图书馆。\n\n“然后我们查看邻居并更新它们的建议距离，”他继续道，“在这种情况下，旅馆最多\
  \ 5 米远，市政厅最多 18 米远。”\n\n![](img/00039.jpg)\n\n“现在我们完成了图书馆，”他继续道。我们将其标记为‘已访问’，并到下一个最近的岛屿——旅馆。在这种情况下，这是一次快速的滑板车行驶，不怎么像比赛。\n\
  \n“既然旅馆是最近的未访问岛屿，我们知道已经找到了它的最短路径。我们可以更新它的距离和路径。”\n\n![](img/00026.jpg)\n\n“耶！”弗罗伦斯补充道，为算法的描述欢呼。\n\
  \n\n\n\n\n埃德加给了她一个奇怪的眼神。“不管如何，我们在这里做的是同样的事情：更新邻居的距离。旅馆有三个相邻岛屿需要考虑：图书馆（已经访问过了）、干洗店和酿酒厂。我们将干洗店的建议距离更新为\
  \ 20 米——从图书馆到旅馆是 5 米，从旅馆到干洗店是 15 米。然后我们将酿酒厂的建议距离更新为 12 米——从图书馆到旅馆是 5 米，从旅馆到酿酒厂是\
  \ 7 米。”\n\n![](img/00042.jpg)\n\n“我们再次走向最近未访问节点。这次是酿酒厂，”埃德加解释道，“我们在那里重复这个过程，更新邻居。”\n\
  \n“然后，去市政厅！这里变得有趣了。从酿酒厂到市政厅是一场不错的赛跑。”埃德加在解释时，一边用手做着驾驶的动作，“而且，从算法角度来说，如果我们通过旅馆而不是市政厅，从图书馆到干洗店的距离会更短。所以在这种情况下，我们就不更新到干洗店的距离，因为我们已经找到了一条更短的路径。”\n\
  \n![](img/00055.jpg)\n\n“以此类推，”他挥挥手总结道。\n\n“我理解那部分，”安说，“你扩展了访问节点集合，并维护了指向未访问前沿节点的临时距离。每当你找到通某个节点的更短路径时，你就使用它。我不明白的是——”\n\
  \n“你真快！”埃德加赞叹道，“我打赌你被‘是否可能通过其他未访问节点找到更短路径’这个问题困扰了？”\n\n“不，”安断言，“不可能有更短的路径，因为你总是选择最近的未访问节点。如果有更短的路径，那么就需要经过另一个节点。但我们已经知道那个节点更远，因为它们不是最近的。”\n\
  \n“那么我们为什么要相加距离呢？”埃德加探性地问，“这个，很简单。通过节点 C 从 A 到 B 的距离就是 A 到 C 的距离加上 B 到 C 的距离。”\n\
  \n此时，安对这种不断的中断感到非常恼躁。“不！我以前走过路。我知道当你走过两座桥时，总距离是它们长度之和。我看到你忽略了岛屿本身的距离，考虑到格拉夫（G’Raph）由很少的岛屿很多桥组成，这是合理的。”\n\
  \n安在再次被中断之前继续说道。“我理解这个算法。一切都很清楚。我想知道的是：你们为什么要用滑板车呢？你们已经在这些地图上写好了所有岛屿之间的距离。你们完全不需要去岛屿就能完成所有这一切。”\n\
  \n埃德加茫然地看着安。“我们为什么要那样呢？”\n\n安叹了口气。“因为直接在地图上标记节点为‘已访问’比实际上去访问它们快得多。你们完全可以在离开图书馆的情况下在纸上完成整个算法。”\n\
  \n埃德加看向佛罗伦斯寻求帮助。“但滑板车是最棒的部分。没有滑板车哪有多趣呢？”\n\n佛罗伦斯表示同意。“这就是为什么我们把它们称为‘已访问’节点；我们可以去访问它们。”\n\
  \n“我说的意思是你们不需要真的开车过去，”安指出道。\n\n“也许你对其中一个概念有困惑，”埃德加探性地问，“让我重新开始。迪杰斯特算法找到从图中任何起始节点到所有其他节点的最短距离……”\n\
  \n安叹了口气，静静地坐在角落里。当埃德加和佛罗伦斯重新解释如何将未访问的邻居添加到访问列表时，安在幻想自己骑滑板车穿梭在格拉夫。那种方法确实很有吸引力。\n\n\
  ## 关于数据结构的争议\n\n图可以用多种数据结构来表示。两种常见的表示法是邻接矩阵和邻接列表。这两种数据结构都可以处理有向、无向、加权或无权的边。邻接矩阵将图表示为矩阵，每个节点对应有一行一列。矩阵第\
  \ `i` 行第 `j` 列的数值是从节点 `i` 到节点 `j` 的边的权重（无权图为 0 或 1）。邻接列表则为每个节点维护一个单独的邻居列表。\n\n***\n\
  \n安显然已经触及了一个争议性的问题。佛罗伦斯和埃德加站在房间的两侧，瞪着对方。这个问题看起来似乎很无害：“你们总是用这些插图来表示图吗？”安问道。\n\n佛罗伦斯很快回答道：“不。那些只是为了说明。邻接矩阵效果更好。”\n\
  \n埃德加反驳道：“正确答案是：邻接列表。”\n\n紧接着是沉默和瞪视。\n\n“邻接矩阵和邻接列表是什么？”安问道，从最基础的问题开始。两位学者立即冲上去解释他们的数据结构。随产生的声音让安想起了两只松鼠在打架。\n\
  \n“请一个一个，”安请求道，“佛罗伦斯，你为什么不从邻接矩阵开始？”\n\n佛罗伦斯笑了。“它们很简单。每一行代表一个节点，每一列代表一个节点。如果两个节点之间有一条边，你就把边的权重放在相应的元素中。所以\
  \ `M[i][j]` 将存储从节点 `i` 到节点 `j` 的边的权重。这里是格拉夫一些岛屿的示例：\n\n![](img/00043.jpg)\n\n“正如我之前提到的，每个岛屿都是我们图中的一个节点，每条桥都是一条边。在这种情况下，每个岛屿都是图中的一个节点，每条桥都是一条边。我展示的是一个无权图。所以值为\
  \ 1 表示两个岛屿之间存在桥，而值为 0 则表示不存在。邻接矩阵非常棒。看到它是如何把所有信息都放在一个方便的形式中了吗？你甚至可以通过矩阵乘法进行某些计算。”\n\
  \n安点了点头。这听起来很合理。“为什么对角线上没有 1？”安问道。“取决于你想要表示什么，自环（循环）当然是可能的。在这种情况下，没有从图书馆到图书馆的桥，”佛罗伦斯解释道。\n\
  \n“好的。现在埃德加，你能告诉我关于邻接列表吗？”安转向另一位学者问道。“当然，”埃德加开始说道，“你从节点列表开始。想象一个包含每个节点名称的巨大数组或链表。然后，对于这些节点中的每一个，维护另一个与之连接的所有节点的列表。对于边很少的图，它可以使用更少的内存。你只存储存在的边。这是一个示例。”\n\
  \n埃德加在黑板上画了一个示例，使用数组存储节点（岛屿），并为每个邻居维护一个链表。安立即注意到，在这种情况下，边（桥）的存在是由节点是邻居这一事实暗示的。然而，邻居的顺序似乎完全无关。”\n\
  \n![](img/00051.jpg)\n\n安研究了这些示例。“两种形式可以完全表示同一个图吗？”安问道。\n\n两位学者点头。“这两种形式也可以表示有向图吗？”安问道。\n\
  \n“这两种形式都可以表示加权边吗？”安问道。\n\n两位学者点头。\n\n“那么你们为什么要争吵呢？看起来它们都能做同样的事情，但各有优劣。矩阵定义更简单，而列表可以更节省空间。这真的值得争吗？”安问道。\n\
  \n两位学者点头。\n\n“真的吗？”安问道。\n\n“空间很重要！”埃德加喊道。然后转向佛罗伦斯问道，“你试过用你宝贵的矩阵来表示整个鸽子网络吗？那里有成千上万个节点！”\n\
  \n\n\n\n争论仍在升级。Ann 从那两个学者身后退了回来。她担心其中某人会扔咖啡杯。\n\n这时，Ann 听到房间角落传来一声低沉的叹息。她转过身避开争论，从一大书堆后面看去。在角落的一张小书桌旁，坐着她见过的看起来最忧郁的人。他蜷缩在桌前，盯着桌上的一张纸，不停摇头。\n\
  \n“你好？”Ann 说道。\n\n“这两种数据结构在各自范围内都是完全合理的，”他解释道，并没意自我介绍。\n\n“我看得出来，”Ann 同意道，“我想它们各有优劣。”\n\
  \n男人点了点头。“我希望他们能明白这一点。他们争吵起来时吵闹得简直不可成体。你知道的，我有正工作工作要做。”\n\n“我可以问问你正在研究什么吗？”\n\n\
  “还没完成，”他回答道，“我还没有想出来。”\n\n“那么问题出在哪里？” Ann 探问道。\n\n男人沉默了一会儿没有回答。在她身后，Ann 听到了更多的叫喊声。她试图忽略那场争论。\n\
  \n最后，男人给了 Ann 一个哀伤的眼神。“这是一个其实非常简单的问题。我不知道为什么我一直没能给出好的解决方案。它真的非常简单。我只是想要一种算法，给我找到图中的最短路径，使得路径恰好访问每个节点一次。”\n\
  \n“听起来是个不错的问题，”她提议道。\n\n男人点了点头。“我已经研究了一段时间了，但一无进展。这一切始于很久以前，一个披着深色斗篷的人第一次告诉我这个问题。我想他可能是一个旅行推销员。不过，我从未见过他的脸。他告诉我，他有一个问题需要\
  \ G’Raph 最顶尖的学者来解决。我那时既年轻又天真。我告诉他我在本周结束前能出一个高效的算法。那是二十五年前的事。”\n\n## 旅行商人问题\n\n旅行商人问题是一个路线规划问题。其目标是找到通过图的最短路径，该路径恰好访问每个节点一次并返回起点。该问题是一类被称为\
  \ `NP-hard` 的计算困难性问题的经典示例。目前没有已知的精确解决 `NP-hard` 问题的高效方案，而且尚未确定此类方案是否存在。\n\n***\n\
  \nAnn 看着角落里那个忧郁的学者。“你已经在同一个问题上工作了二十五年？”她问道。\n\n“我离成功非常近！”他回答道。\n\n在她身后，Florence\
  \ 和 Edgar 停止了争论。他们从书堆后面探出头来。\n\n“噢。我知道你见过 Geoffrey 了，”Edgar 说，“别理会他。”\n\n“我想听听更多关于这个问题的，”Ann\
  \ 说道，“你说的‘最短路径’是什么意思？”\n\nGeoffrey 没有回答。他蜷缩在纸前，自言自语着。\n\nAnn 回头看向 Edgar 和 Florence。“你们刚才告诉了我一个最短路径算法，”她说。\n\
  \n“这个不一样，”Florence 解释道，“旅行商人问题是一个特别困难的路径规划问题。其目标是找到通过图的最短路径，该路径恰好访问每个节点一次并返回起点。”\n\
  \n“这是穿过 G’Raph 学校社区的两个示例路径，”Edgar 提道，在附近的黑板上画了一个简单的草图。\n\n![](img/00073.jpg)\n\n\
  ### 路径 1\n\n![](img/00025.jpg)\n\n### 路径 2\n\n“这两条路径都恰好穿过每个节点一次。路径 1 的长度为 55 米，路径\
  \ 2 的长度为 66 米，”他解释道。\n\n“这看起来足够简单，”Ann 评论道，“真的没有算法可以解决它吗？为什么不尝试节点的所有可能排列呢？对于每种排列，你都可以计算按该顺序访问节点时的总路程。”\n\
  \n“没有已知的高效算法可以解决它，”Edgar 解释道，“至少没有精确解。你建议的方法可行，但它是阶乘级的，`O(N!)`。对于我们这个简单例子中的五个节点，有\
  \ `5! = 120` 种不同的排列。”\n\nFlorence 耸耸肩。“没有人真的知道是否存在高效解。至少还没有人找到过高效解。当然，有很好的近似算法，但没有精确算法。”\n\
  \n“我研究过一会，”Edgar 说道，“我没有取得什么进展。”\n\n“Geoffrey 已经研究这个问题二十五年了？”Ann 问道。\n\n两个学者都点了点头。“自从遇到那个男人后，Geoffrey\
  \ 对这个问题就变得异常地痴迷。他什么什么都不想。过去，他会同时处理三个或四个不同的问题。他就像是中了某种咒一样，”Edgar 解释道。\n\nEdgar 的话让\
  \ Ann 感到一阵发凉。一段模糊的记忆在她脑海中浮现，但她无法抓住它。\n\n“还有别人见过那个男人吗？”Ann 问道。\n\nEdgar 耸耸肩。“我不这么认为。Geoffrey\
  \ 说他可能是一个外地推销员。”\n\n“他在推销问题，”Geoffrey 轻声说道。Ann 被这句突然的话惊了一跳。尽管她一分钟前才和他交过话，但她忘记他在那里。\n\
  \n“他长什么样？”Ann 问道。那段模糊的记忆继续在她脑海中萦绕。\n\n“深色斗篷，拿着一根大木杖，”Geoffrey 说道。\n\n## 恐慌深度优先搜索\n\
  \n深度优先搜索是一种搜索算法，它在回溯测试其他路径之前完全探索一条路径。该算法递归运行，使用深度优先搜索探索所有的子路径。\n\n***\n\nAnn 在跨过第一座桥时就意识到了自己的错误。急着去学校，她忘记带地图了。在任何其他城市，这都不是问题。但在\
  \ G’Raph 旅行并不那么简单。\n\n\n\n\n从农场出来，她过了另一座桥，来到了另一个（较小的）萝卜菜场。从样子上看，这个农场显然比托马斯的农场成功得多。安停顿了一小会儿，思考为什么这两个几乎无法区分的泥岛之间，萝卜生长性能会有这种差异。她迅速将这个问题抛出脑后，继续她的寻找。\n\
  \n安再次面临桥梁的选择。她从右侧的路径开始。让她松了一口气的是，这桥桥通向学校。\n\n![](img/00052.jpg)\n\n安跑到学校，佛罗伦斯和埃德加正在那里等着。埃德加手里拿着一张折叠好的\
  \ `G’Raph` 地图。安再次埋备自己没有带地图，她本可以避免很多回路白走的。\n\n“你做到了！”埃德加惊呼道，“我担心你没有地图会迷路。”\n\n“我确实迷路了，”安承认道，“或者说，我撞了几个死胡同，不得不回路。”\n\
  \n“啊，这是一个`depth-first search`，”佛罗伦斯注意到，“不错。”\n\n“`depth-first search`？”安问道，因为跑了路有些喘不过气。\n\
  \n“`depth-first search` 是指你沿着一条路径不断探索，直到遇到死胡同或你之前见过的节点。然后你回溯到最近的决策点并尝试不同的选项。如果那个点没有新选项了，你就再次回溯。”埃德加解释道。\n\
  \n“通过`depth-first search`，你不断向更深处探索，直到来到一个死胡同，”佛罗伦斯补充道。\n\n“或者找到你寻找的东西，”埃德加补充道。\n\
  \n“说得好，”佛罗伦斯回答道，“你也可以找到你寻找的东西。埃德加，记得我们上次在那本选择冒险小说上使用 `depth-first search` 的时候吗？”\n\
  \n“真是有趣的时光，”埃德加回答道。他望着天空，仿佛在脑海中重放那段记忆。\n\n安太累了，无暇欣赏自己那番疯狂奔跑中的算法之美。一张地图本可以让她避免亲身体验\
  \ `depth-first search`。\n\n学校校长看到这群人站在外面，走出来查看。\n\n“打扰了，”他用那种每位校长似乎都精通的严厉语气说道，“你们是谁？为什么要在这里？如果你们是卖闪闪卡的，请继续走吧。我们不从旅行闪闪卡销售员那里买东西。”\n\
  \n“你见过一个穿着深色斗篷的奇怪男人吗？”安问道，没忙介绍自己或回答他的任何问题。\n\n“嗯，是的。你为什么问这个？”校长问道。\n\n“他和别人说话过吗？”安再次忽略了校长的问题。\n\
  \n“他和我们的一位优等学生伊丽莎白聊过，”校长回答道，“他对某个数学问题有些疑问。我也在那里，但老实说，我不明白他在说什么。\n\n“不过，伊丽莎白似乎确定她能解决。她直接回家去研究了。她很聪明，你知道的。可能是我们学校教过的最优秀的学者。她会找到答案的。”\n\
  \n“你知道问题是什么吗？”安问道。\n\n“是关于岛屿和桥的。我想他称它为`vertex covering`。我以前没听说过，但听起来很有趣。”\n\n“另一个经典的`NP-hard`\
  \ 图形问题，”埃德加愉快地说，“我也研究过那一个。”\n\n安感到心里一沉。\n\n现在伊丽莎白，`G’Raph High School` 的优等生，也变得痴迷于此。她和杰弗一样落入了同样的魔咒。\n\
  \n巫师盯定了两个优等学者。遗憾的是，安不知道为什么。\n\n## 桥梁升级\n\n无向图的`minimum spanning tree`是最小边集，使得所有节点都相互连接（如果可能的话）。同样，在加权图中，`minimum-cost\
  \ spanning tree`是总权重最小且连接了所有节点的边集。\n\n* * *\n\n安直接去了市政厅，她希望在那儿能找到更多关于那个神秘巫师的信息。佛罗伦斯和埃德加决定加入她。或者更准确地说，他们决定展示一下他们骑着板车能多快地穿梭于\
  \ `G’Raph`。至少他们把地图留给了安。\n\n安在办公室找到了市长，他正专注地盯着一张 `G’Raph` 的地图。\n\n![](img/00009.jpg)\n\
  \n“市长，我有一个重要的问题要问你，”安开始说道。\n\n市长没有理会她。他继续盯着地图，自言自语地嘟囔着。他似乎在用手指追踪不同的路径。安开始恐慌。巫师来过这里吗？\n\
  \n过了一，市长终于转过身。“埃德加，这绝对不行。你需要重做，”他厉声说道。\n\n“什么？”埃德加问道，“那正是你要求的：`minimum-cost spanning\
  \ tree`。”\n\n“什么？”市长带着困惑的表情问道。\n\n“嗯，我这里有一个重要的问题，”安尝试道，但没有人注意。\n\n“这是需要升级的桥集，”佛罗伦斯向市长解释道。\n\
  \n市长沉默地站着，没有对上号。\n\n佛罗伦斯继续说道：“你要求一组最便宜的桥进行升级，以便你可以在任何两个岛屿之间旅行时只跨越石桥。由于价格是由桥的长度决定的，我们找到了最短的桥集。”\n\
  \n“你们为什么需要用石桥连接所有岛屿呢？”安问道，暂时忘了她原本的问题。\n\n![](img/00031.jpg)\n\n“在龙的袭击后，没人想被困在干洗店，”佛罗伦斯在没有额外解释的情况下说道。\n\
  \n“我们需要在市政厅和图书馆之间有一座石桥，”市长说。\n\n“那会增加三米，”埃德加回答道，“连接酒馆和干洗店。”指向地图上相关的桥。\n\n市长开始争论，但安打断了他。\n\
  \n“有趣，”安打断道，“你找到了一组可以连接所有岛屿且成本最低的桥。你花很久了吗？”\n\n“没有，”佛罗伦斯回答道，“我使用了 `Prim’s algorithm`。”\n\
  \n“`Prim’s algorithm`？”安问道。\n\n“这是一个简单的算法，”佛罗伦斯说，“你从随机节点开始，将其加入一个新的节点集合。在这种情况下，我‘随机’选择了图书馆。”\n\
  \n![](img/00004.jpg)\n\n“然后你不断添加不在集合中的最近节点。由于我们想要化每条新边的成本，我们将‘最近’定义为节点到集合中任何节点的距离。在这种情况下，我们首先添加酒馆，它距离图书馆五米。”\n\
  \n![](img/00040.jpg)\n\n“然后是酿酒厂，它距离酒馆七米。”\n\n![](img/00076.jpg)\n\n“这些很有意思，”市长打断道，“但图书馆和市政厅之间应该有一座石桥。”\n\
  \n“埃德加和佛罗伦斯是正确的，”安说，“`minimum-cost spanning tree`在那里没有新桥。”\n\n“但是……我每天都走那里，”市长说，“我受够了那座摇晃的老桥。我们需要新的。”\n\
  \n埃德加、佛罗伦斯和安互相看着。埃德加深吸了一口气准备开始另一场算法争论，但又改变了主意。埃德加决定提交两个价格让市长挑选。\n\n突然想起她为什么要去市政厅，安转向市长。\n\
  \n“市长先生，我觉得有一个巫师对 `G’Raph` 的学者们施咒，”安脱口而出，“我觉得这座城市和所有的学者都处于危险之中。”\n\n在安身后，埃德加和佛罗伦斯同时吸了一口气。\n\
  \n## 哈密路径游戏\n\n`Hamiltonian path` 访问图中的每个节点一次。判断图中是否存在 `Hamiltonian path` 的问题是 `NP-hard`。\n\
  \n\n\n\n“市长先生，我认为有一个巫师正在对格拉（G’Raph）的学者们施咒，”安重复道。“每一个和巫师交过道的人都痴迷于寻找特定 NP-hard 问题的高效、精确解。您有没有听说过某个穿黑斗篷的陌生人向学者们询问\
  \ NP-hard 计算问题？”\n\n市长看起来很困惑。“NP-hard？我不完全确定那是什么意思，但以前确实有一个穿者黑斗篷的人问过我一个很难的问题。”\n\
  \n“真的吗？”安、埃德加和弗罗伦斯齐声问道。他们没有人能掩饰脸上的震惊表情。\n\n“是的，”市长回答道，“那是二十年前的事了——就在我刚毕业后。他刚从图书馆回来。记得停下来和杰弗里讨论关于某个推销员问题。杰弗里是我最喜欢的老师，你们知道的。他出的考试总是最简单的。总之之，那个人问我是否能解决一个游戏：找到一条穿过格拉的路径，使得我每个岛屿最多只经过一次。”\n\
  \n“哈密顿路径问题，”埃德加说道，“它也是 NP-hard 的。”\n\n“它和杰弗里的旅行推销员有关，”弗罗伦斯补充道。\n\n“但为什么巫师要问你哈密顿路径呢？”安问道，试图委婉地提问。根据她和市长相处的短暂时间，他并没有让她觉得是格拉伟大的学者之一。\n\
  \n市长耸了耸肩。“我不知道，但那听起来像个有趣的游戏。”\n\n“这在格拉很流行，”埃德加赞同道，“我们小时候玩过哈密顿路径。我们会画出不同的跳格图，并必须按照哈密顿路径遍历它们。当然，你不被允许提前解题。你必须在跳跃的过程中确定哈密顿路径。如果你被卡住了或者两次踩了同一个节点，你就出局了。”\n\
  \n安看起来很怀疑。“你小时候真的玩过那个吗？你就是这样度过童年的？”她问道。\n\n埃德加对这段美好的记忆露一笑。“那是段美好的时光，”他回答道。\n\n“你对巫师说了什么？”安问市长，“你没有把它解出来吧？”\n\
  \n市长笑了。“我当然解出来了。我对那个穿斗篷的人说：‘那太简单了。我只要多造几座桥就行。’那人很快就离开了。我觉得他提到了我作为政治人的未来。”\n\n“那是作弊，”埃德加抗议道，“在哈密顿路径游戏里你不能加桥！”\n\
  \n“市长先生，”安打断道，“你还其他人遇到过那个巫师吗？”\n\n市长思考了一下。“在格拉这里没有。但我有一个实习生，他讲过一个听起来和你们所说的相似的故事。他在布尔（Bool）镇有一个好朋友，变得痴迷于这些难题中的一个。你们管它们叫什么？NT？还是\
  \ ND？”\n\n“NP，”安提议道。\n\n“行，行。总之，我实习生的朋友有一个有趣的小问题，叫 3-SAT 之类的。听起来像是在周日报上能看到的内容。”\n\
  \n“布尔镇？你确定吗？”安问道。\n\n市长点了点头。“当你遇到一个布尔（Boolean）时，你就能认出来。”\n\n安完全赞同。一想到布尔，她的脑海中浮现出了结博士（Dr.\
  \ Conjunctione）以及他坚持要解决 3-SAT 的样子。在那一瞬间，问题的范围变得清晰得令人恐惧。\n\n在经过几分钟的讨论后，安决定不再在这里寻找更多答案了。她知道确实有一个巫师正在对计算学者们施咒；现在她必须弄清楚为什么。\n\
  \n在她的寻找过程中的第一次，安知道下一步该去哪里了。她需要拜访一个她可能找到更多关于 NP-hard 问题信息的地方：亚历山大图书馆。\n\n## 计算思维\n\
  \n![](img/00061.jpg)\n\n## 算法反思\n\n复杂的算法建立在核心基础概念之上。精通这些基础概念并学会组合它们，是解决新问题的关键。\n\
  \n* * *\n\n第一百万次，安希望自己能有一个更好的算法来解决任务。她想要一种不需要过多猜测且能保证解决方案的东西。最重要的是，她想要快速的。在经历了近一年的寻找后，安已经累了。\n\
  \n当她俯视崎岖的土路时，她的思绪回到了在格拉的时光以及她在那里学到的算法。那些算法，比如 Dijkstra 最短路径算法和用于求最小生成树的 Prim 算法，远远超过了安一年前的想象。然而，这些新算法使用的概念，是她在一年级就学过的。\n\
  \nDijkstra 最短路径算法基于几个简单的循环：\n\n```\nWHILE 存在未访问的节点 …\nFOR 当前节点的每个邻居 …\n```\n\n同样，Prim\
  \ 算法只是一个循环，不断向集合中添加新节点，直到没有节点可以添加的为止。它还需要更新和寻找“接近”的节点。\n\n她在格拉学到的一切都建立在她在学校学过的计算机科学核心概念之上。当这个念头击入安的大脑时，一股希望流遍她的全身。她拥有解决这个任务的工具。现在，她需要弄清楚如何应用它们。\n\
  \n## 计算涂鸦\n\n递归允许将复杂的算法以简短、简单且往往优美的形式描述出来。函数在数据的子集上调用自己，利用这些子问题的结果来形成最终解决方案。然而，递归也会因为产生新的递归调用而增加计算开销。\n\
  \n* * *\n\n在前往亚历山大图书馆的途中，安可以看到混乱席卷王国的迹象。邮差他们在路线之前停止了分发邮件。相反，他们站在每个信箱前翻阅邮包。一切一团糟。\n\
  \n安首先在亚历山大的郊区发现了涂鸦。起初，它们看起来并无害——青少年叛逆的宣言：“DFS 胜过”或“动态规划万岁”。然而，这些标语很快变得令人不安：“对大 O\
  \ 说‘不’”以及“暴力破解永恒”。\n\n起初，安认为这些标语是笑话。谁会反对高效的算法呢？这种荒谬感让它们显得滑稽。\n\n接着，安看到了一条让她如坠冰窟的消息：\n\
  \n```\nint RecursiveAdd(int n, int m) {\n  if (m == 0) return n;\n  return RecursiveAdd(n,\
  \ m-1) + 1;\n}\n```\n\n这个求两个数的递归算法覆盖了花店的整个北墙。它是用安在学校学的经典语言 C 写的。虽然技术上是有效的，但这种方法极低的效率让安震惊。\n\
  \n例如，给定 n=10 和 m=5，函数总会被调用六次！\n\n```\n用户调用: RecursiveAdd(10, 5)\n递归调用: RecursiveAdd(10,\
  \ 4)\n递归调用: RecursiveAdd(10, 3)\n递归调用: RecursiveAdd(10, 2)\n递归调用: RecursiveAdd(10,\
  \ 1)\n递归调用: RecursiveAdd(10, 0)\n```\n\n幸运的是，递归链在第六次调用后会停止。最后一次调用返回 10。下一次调用在该结果上加\
  \ 1 并返回 11。这个过程一直向上进行，直到顶层函数返回 (10 + 4) + 1 = 15。\n\n为什么要将一个简单的数学运算 m+n 描述为 m +\
  \ 1 次函数调用的链？这种开销是令人惊舌的。这些涂鸦显然指向了计算思维的彻底崩溃。\n\n安从令人不安的画面中挣回神来，飞奔起来。没有时间浪费了。\n\n##\
  \ NP-hard 诅咒\n\nNP-hard 是一类目前没有任何高效精确算法解决方案的计算问题。\n\n\n\n\n\n当安抵达亚历山大图书馆时，情况已经进一步恶化了。她听到来自王国各地的报告，说人们因痴迷于特定的`NP-hard`问题而沦落。看起来王国超过百分之八十的顶尖学者都中了诅咒。最近，安得知`农场动物会计局：大型哺乳动物`——王国内最大的复杂度理论学家聚集地——已经陷落了。包括`Clare\
  \ O’Connell`在内的九位理论学家都消失了。\n\n“我需要你所有关于`NP-hardhard 问题、计算复杂度……以及诅咒`的资料，”安在走向主接待台时命令道。\n\
  \n图书管理员学徒彼得看起来很忧虑。“所有的？”\n\n“全都要，”安确认道。\n\n彼得脸上的忧虑被恐慌所取代。“你是来诅咒我的吗？”他问。接着，他变得更加坚定，挺起胸膛宣称道：“我会用我的生命保护亚历山大图书馆的智慧！”\n\
  \n安惊讶得愣住了。她从未想过自己竟然可能被误认为是她正需要阻止的那个巫师。然而，从这位年轻管理员的反应来看，他似乎确信她是来摧毁卷轴、诅咒他的，或者至少是在那已经遍地的涂鸦上再添上一笔。\n\
  \n“嗯，不是。我不是来诅咒你，也不是对图书馆做任何坏事。我是安公主。我是受我的父亲`弗雷德里克国王`派来阻止即将到来的黑暗的。我需要你的帮助。”\n\n彼得脸上的恐慌化为了释慰。释慰随后转变为喜悦的兴奋，这产生了一种同样可怕的表情。彼得的整张脸扭成了一个巨大的微笑，他似乎停止了眨眼。安真希望他能停留在释慰的状态就好。\n\
  \n“我可以帮的！”彼得大叫着，转身跑进了书架区。\n\n十五分钟后，他回来了，手里拿着十卷卷轴、两本书和一块古老的泥板。“这是第一批。我现在把它们拿来，你可以就可以开始了了。遗憾的是，这种请求我们的`缓存系统`并不太好用。”\n\
  \n“`缓存系统`？”安问道，但彼得已经消失在书架区了。\n\n安把卷轴带到角落的桌子上。当她工作时，彼得带着新的一批卷轴回来。安注意到，关于计算复杂的卷轴有一半以上来自`农场动物会计局`。\n\
  \n总共大约一百卷卷轴铺满了桌面，彼得终于停顿了一下。由于不断的奔跑，他气喘吁吁，汗水从鼻尖滴落。\n\n“你在找什么？”他对着如山的资料问道。\n\n“我不确定，”安回答道，心想他为什么不早点问这个问题。“任何可能帮助我理解这个诅咒或其目的的东西。”\n\
  \n“我听说诅咒针对的是学者，迫使他们痴迷于`NP-hard 问题`而忽略其他任何事情。有一位思想者曾帮助海军重写手册以使用`functions`，但他却迷上了如何将货物装进船的舱舱。人们说他现在住在一艘运牛船的货舱里，希望能获得灵感，”彼得嘟囔着，精力恢复了。\n\
  \n安听到这个故事时畏缩了一下。正是她的请求才让那位学者去帮助海军的。她想，如果不是那样他是否就能避开这个诅咒。她试图将那种疑虑从脑海中赶出去，重新集中在问题上。\n\
  \n“到底`NP-hard 问题`有什么好兴奋的？”安问道。\n\n彼得吸了一口气。“NP-hard 问题是世界上最困难的问题之一，”他解释道，“每个人都想解决它们！你会变得名又利的！”\n\
  \n“为什么？”安问。\n\n“因为还没有人为它们想出高效的`algorithm`，”彼得回答道，“你总是可以检查是否有一个有效的解，但从零开始生成精确的解要困难得多。”\n\
  \n安继续显得无动于色。\n\n“以`哈密顿路径`问题为例，”彼得继续道，“你需要找到一条穿过`graph`的路径，每个节点只接触一次。检查任何给定的路径是否有效非常容易——你只需要测试这条`path`。它是否两次踏了同一个节点？然而，要确定是否存在这样的路径却是极其困难。”\n\
  \n“它有那么重要吗？”安问道。“我想`哈密顿路径问题`很有趣，但解决它并治不好感冒。”\n\n“它非常重要！”彼得惊呼道。“嗯，也许`哈密顿路径`本身不是，但解决这类`NP-hard\
  \ 问题`是。它们有真实的、实际的应用。此外，某些`NP-hard 问题`可以归约为不同的`NP-hard 问题`。这意味着如果你解决了一个问题，你就可以解决另一个。如果你找到了`哈密顿路径问题`的高效精确解，你就能找到`3-SAT\
  \ 问题`的解。它将彻底一切。”\n\n“噢，”安说道。她从未真正意识到这些问题的规模。“而且解决这些问题很难吗？”她问。\n\n“王国超过四之三的最优秀学者现在每醒一分钟都花在它们身上，但毫无进展。所以……”彼得声音小了。\n\
  \n“我们需要弄清楚如何破解诅咒，”安总结道。\n\n## 日常算法\n\n算法对于成千上万的日常任务至关重要。从两个数字相加到在商店里导航，我们到处都在使用算法。\n\
  \n***\n\n彼得看了安十分钟才有胆打扰她。即便如此，他也尝试了五次才说出话。如果安不是那么沉浸在工作中，她会觉得整个过程很毛骨悚然。\n\n“不好意思，”彼得试探着说。\n\
  \n安抬起头，眼神呆滞。“什么？”\n\n尽管她的语气很愉快，但这些话让彼得感到一阵愧疚。他受过训练，除非发生火灾或图书馆要关闭，否则不要打扰顾客。\n\n“你知道什么是‘黑暗’吗？是那个诅咒吗？”他问。“我这么问是因为这可以帮助为你寻找其他资源。首席管理员说过，我应该把帮助你放在首要位置。”\n\
  \n“我不确定，但我认为‘黑暗’指的是一个新的黑暗时代。准确地说，是一个`计算黑暗时代`。”\n\n“计算黑暗时代？”\n\n“那个巫师似乎在针对计算思想家，显然王国已经在遭受苦难。”\n\
  \n彼得觉得有些地方不对劲。“有那么重要吗？”他问。\n\n“什么？”安问道。“你看到那些涂鸦了吗？那些中诅咒的学者？那些流浪的官僚部落？”\n\n“我的意思是，看起来有很多问题因此，”安说道。她的整张脸都活跃了起来，彼得能听到她声音中的激情。“算法无处不在。整个王国都是运行在算法上的。”\n\
  \n\n\n\nAnn 回头看着他。“那你是什么什么意思？”她问道。\n\n“巫师诅咒了所有的学者，所以他们不再开发任何新算法了。我明白，这很糟糕。但为什么它会这么快地影响其他所有方面？王国堕落到这种程度应该需要一段时间吧，对吗？并不是每个人每天都需要一个新算法。它又不是潮湿储藏室里的面包，算法不会随着时间的推移而变绿长霉的。”\n\
  \n“噢，对了……那个，”Ann 说道，声音里的活力消失了殆尽。\n\nAnn 沉默了一会儿。她看着 Peter，仔细地审量着他。Peter 明显地感觉到，自己可能不喜欢接下来的话。\n\
  \n“情况比那糟糕得多，”Ann 终于说道。\n\n“更糟？”Peter 问。\n\n“更糟，”Ann 确认道。\n\n“呃，怎么个糟？”Peter 紧张地问。\n\
  \n“我想这些咒语针对的不仅仅是学者，”Ann 解释道，“诅咒正在渗透到生活的各个方面。它在利用学者——利用他们来针对算法本身。你诅咒了一个排序专家，你就诅咒了排序算法本身。巫师正在瓦解王国计算的基石。”\n\
  \n“噢，”这是 Peter 唯一能说的话。他的腿突然似乎有些发软。他摸索着找了椅子，把它拉到身后，然后坐在了上面。\n\n“噢，”他重复道。\n\n“是啊，”Ann\
  \ 同意道。\n\n“所以？”Peter 问。\n\n“我必须停止它……快一点。”\n\n## 快速排序信息\n\n`Quicksort` 是一种递归排序算法，类似于归并排序。像归并排序一样，`quicksort`\
  \ 将元素分为组，递归地对这些组进行排序，并将结果合并成一个单一有序列表。与归并排序不同，`quicksort` 在分区时使用了元素的值。`Quicksort`\
  \ 选择一个随机元素，称为 `pivot`（基准值），并将当前列表分为两个子列表：小于或等于 `pivot` 的元素和大于 `pivot` 的元素。由于列表是根据值划分的，因此合并操作仅需将一个排序列表追加到另一个列表之后。\n\
  \n`quicksort` 的最坏情况性能为 `O(N²)`。然而，`quicksort` 的平均时间为 `N log N`。事实上，`quicksort` 的速度可以比其他\
  \ `O(N log N)` 排序算法（如归并排序）更快。\n\n***\n\n“你在做什么？”Ann 问。\n\n“收书，”Peter 回答道，“我们让顾客把书留在这里给我们处理，因为他们想要帮忙时总是会把事情搞乱。他们把书拿回原来所在的普通区域，看到一个空隙，就把它塞进去。这弄乱了整个顺序。你真应该看看他们对那些卷轴是怎么做的。”\n\
  \n“好吧，”Ann 同意道，“但你现在在对那些书做什么？”\n\n“对它们进行排序，”Peter 回答道，“在这里排序更容易。这样我就可以按顺序检查书架（注：此处原文为\
  \ stacks，通常指书堆或书架）并把书收好。这就像是一个庞大归并排序的合并步骤。这节省了很多时间。”\n\n“但你是怎么排序的？看起来你简直像是在随机挑选东西。”\n\
  \n“噢，”Peter 说道，“这是一个会计师教给我的新花样。她叫它 `quicksort`。它的最坏情况大圈复杂度非常糟糕，但实际上运行效果相当不错。”\n\n\
  “一个会计师？”Ann 问。\n\n“我觉得她在一家农场动物局工作，但她似乎很懂排序。不过，她显然不是计算专家，否则她会知道这个 `quicksort` 的最坏时间是\
  \ `O(N²)`。想象一下要给超过几层架的书排序——”\n\n“Clare O’Connell？”Ann 打断了他。她站起来，死死地盯着书推车。\n\nPeter\
  \ 停顿了。在 Ann 在图书馆工作的五天里，她几乎没有抬起头看书。她对重新整理书籍突然产生的兴趣让他感到不安。她现在竟然在关注他，这更让他感到不安。\n\n\
  “听起来很耳熟，”Peter 犹豫地回答道。\n\n“全告诉我，”Ann 命令道。她现在站在他身边，仍然盯着书架。“她说了什么？”\n\n“呃，好的……是的，她几周前来这里拿过一卷关于牛——或者火鸡——或者某种动物的卷轴。不过我很确定是牛的。”\n\
  \n“排序的事呢？”Ann 追问道。\n\n“她只说有更好的排序方法，”Peter 说道，“她向我展示了这种她称为 `quicksort` 的算法。你从一堆要排序的书开始。随机选一本书。你称那本书为\
  \ `pivot` 书。”\n\n“然后你用 `pivot` 将堆分成两个较小的堆。`pivot` 之前的书放在左边，`pivot` 之后的书放在右边。”\n\n\
  ![](img/00010.jpg)\n\n“你不断递归地拆分，直到每个堆只有一。”\n\n![](img/00013.jpg)\n\n“然后你通过把左堆放在右堆前面来将它们合并回去。”\n\
  \n![](img/00016.jpg)\n\nPeter 耸了耸肩。“就这些。正如我所说，最坏情况是 `O(N²)`，但通常比那要快。更重要的是，通过把一堆放在另一堆上面，合并图书馆书籍要容易得多。”\n\
  \nAnn 没有回应。她继续盯着那架图书馆书籍。最后，她低声耳语道：“它的预期运行时间是 `N log N`。”\n\n“预期的？”Peter 问。\n\n“意思是平均而言需要\
  \ `N log N`，”Ann 回答道，“我听过传闻，说 Clare 正在研究预期运行时间。”\n\n“最坏情况还是 `N²`，”Peter 反驳道。他坚信最坏情况运行时间本身就能说明一切。\n\
  \n这让 Ann 从出神中了。“这就是它的之处，”Ann 回答道，“你必须总是做出糟糕的选择才有那么糟糕的运行时间。例如，如果你总是选择最小的值作为 `pivot`，情况就会糟。你需要拆分\
  \ `N` 次书，每次拆分都需要多达 `N` 次比较。”\n\nAnn 转回书架。她的声音低得几乎是耳语。“那种机会一定非常小。”\n\n她转身看向 Peter，抓住了他的肩膀。她的眼睛里闪烁着狂野的能量。“你说\
  \ Clare 是什么时候在这里的？”她问道。\n\nPeter 试图后退一步，但 Ann 紧紧抓住了他。\n\n“她什么时候在这里的？”Ann 问。\n\n\
  “我想两周前。”\n\n农场动物会计局三周前倒了。\n\n“这是一个信息！”Ann 大喊道，“`Quicksort` 是一个信息！”## 注释与面包师徒\n\n\
  注释是代码内部额外的文本，可以通过提供额外的见解、解释或总结来极大地提高代码的可读性。例如，在大型数值语句块之前的注释可能简单地解释 `Solve a x²+\
  \ bx+ c=0 for x`，让用户完全理解接下来的代码块的意图。\n\n***\n\n“这才是写算法的方式，”Ann 宣称道。在读了王国历史上一些写得最糟糕的卷轴几天后，Clare\
  \ 那篇关于《快速排序在报销费用表中的应用》的卷轴提供了一个令人欢迎的变化。\n\n“怎么说？”Peter 问道，凑过去看卷轴。他盯着了一会儿。“我想是字迹不错，”他说。\n\
  \n“不仅于此，”Ann 说道，“算法本身是可读的。变量名很有意义，函数定义得很好，而且还有注释。很好的注释！”\n\n“注释？”Peter 问道，“那似乎没必要。我原以为一个好的算法应该是自己就能解释通。”\n\
  \n“并不总是如此，”Ann 说道，“在复杂的算法中，良好的注释可以帮助一切变得更容易理解。在其他时候，良好的注释可以为为什么使用某种方法提供有用的见解。”\n\
  \nAnn 回想起时停顿了。“我们城堡的面包师 Breadtista 是第一个向我展示良好注释重要性的人。我曾当过他的学徒。事实上，我当过很多学徒；我父亲是广博教育的支持者。总之，作为他闻名全球的教学计划的一部分，Breadtista\
  \ 要求每个学徒都要详细记录他们的工作。所有的食谱、技巧和窍门都必须清晰记录，以创建一个超出学徒期的参考资料。”\n\n\n\n\n“为什么要让每个学徒都重复同样的工作？”彼特问道，“Breadtista\
  \ 完全可以直接复制他最好的配方，对吧？”\n\n“学习编写好的配方是教育的一部分。正如 Breadtista 经常指出的那样，一个优秀配方的关键在于捕捉完美的信息量。当其他面包师写的配方书充斥着平淡指令的列表时，比如‘加入两个鸡蛋并充分混合’，Breadtista\
  \ 坚持在他的配方中添加注释。他使用了极妙的注释，增加了背景信息和恰到好处的解释。”\n\n彼特看起来并不信服。在他担任图书管理员学徒的期间，他不记得曾有过任何一次需要额外的背景信息。当首席图书管理员下达指令时，彼特总是原封不动地记录下来。\n\
  \n“这里，”安一边从包里掏出一本旧笔记本，一边说道，“这是 Breadtista 为他著名的八辣椒草莓马芬写的配方。”\n\n`Step 5: 将草莓切成每边\
  \ 1 厘米的方块。[这种尺寸可以让风味融合，同时保留水果的质地。]`\n\n`Step 6: 将草莓加入面团。`\n\n`Step 7: 轻轻搅拌，直到草莓混合在面团中。`\n\
  \n“注释周围有括号，”安解释道，指着符号 `[` 和 `]`。\n\n“我猜知道为什么草莓应该是那种尺寸是有用的，”彼特说，“你还会在其他地方使用注释？你能提供一些关于你是如何构思出某个配方的信息吗？”\n\
  \n安坚决地摇了摇头。“注释应该始终提供对配方本身有意义的信息。Breadtista 会为了那些著名城堡厨师写的配方书大骂几个小时，那些书里包含了长达三十页的关于作者对完美煎饼一生追求的离题。他认为，如果配方做出来的煎饼是嚼性的，那是极其恶劣的。正如他常说的那样：‘煎饼不应该是嚼性的，注释不应该是生平故事。’他对此非常有意见。”\n\
  \n“你学习写好注释花了很长时间吗？”彼特问道。\n\n安笑了起来。“我花了一个月的时间才开始写任何注释。我当时没看出它们的用处。我会抱怨并说诸如‘我不会忘记我做过什么’以及‘这一步不是显而易见的吗？’之类的话。我真是个麻烦鬼。\n\
  \n“但 Breadtista 很有耐心。他总是给出同样的答案：‘仅仅因为这对你现在来说是显而易见的，并不意味着你不会忘记它，也不意味着别人在阅读配方时不需要解释。’他给出了非常有逻辑的论据，但我还是忽略了它。\n\
  \n“后来 Breadtista 找到了强化良好注释重要性的完美方法。他开始让我根据以前学生最糟糕笔记来进行工作。那简直是折磨。有时我完全不知道那些指令是什么意思。有时，它们又没完没了。”\n\
  \n安翻回了笔记本的后几页。“看看这团乱麻！”\n\n`Step 1: 在小碗中量取 1/4 盎司酵母。[将其放入碗中是为了我们在第 2 步加入水来激活酵母。]`\n\
  \n`Step 2: 在有酵母的碗中加入两汤匙温水。[我们将水加入碗中是为了激活酵母。]`\n\n`Step 3: 等待 5 分钟。[等待 5 分钟是为了让酵母在水中激活。]`\n\
  \n“那是一个三年级学徒写的配方，”安解释道。“太糟透了。我从来没做过那个配方的第 85 步。事实上，我‘不小心’洒了一整壶水在烘焙纸上，以免得其他人读它。”\n\
  \n安叹了口气。“之后，我学会了良好注释的价值。事实证明，没有什么比阅读他人的配方更能强化‘易于理解、文档齐全的配方’这一概念了。”\n\n“那快速排序卷呢？”彼特问道，回到当前的话题。\n\
  \n“注释良好的，”安微微笑回答道。\n\n“当然了。但里面有你需要的信息吗？”\n\n安看起来很忧虑。“它有一些信息——至少有一个方向。我们还有很多工作要做。但我担心我们没多少时间了。”\n\
  \n# 过度注释的诅咒\n\n良好的注释可以提高代码的可读性。然而，过度注释可能会适得其反。不必要的注释既浪费空间又浪费读者的注意力，而且没有增加任何价值。\n\
  \n***\n\n新雅典的铁匠德克斯（Drex）被诅咒了。德克斯坦言承认他惹怒了巫师马库斯（Marcus），但这个诅咒似乎是一种过激反应。巫师本可以简单地反唇回去或者直接离开。有很多合理的选择。他没必要诅咒德克斯。\n\
  \n尽管诅咒让德克斯很恼恼，他的学徒蕾切尔（Rachel）受苦得更多。“过度注释的诅咒”旨在同时干扰老师和学生。每当德克斯解释某些事情时，他现在都会以极其详细的方式进行。\n\
  \n“看我是如何制作这个合页的，”德克斯指示道，“首先我用这些大钳子夹起金属。它们由较重的金属制成，所以在火中不会烧毁或熔化。然后我用钳子把金属放入火里，它会受热。”\n\
  \n一边说着，德克斯用钳子夹起一小块金属并将其推入火中。片刻，他觉得有必要补充道：“我正在火里加热它。’在金属热到可以动工之前，他又重复了这一观察五次。\n\n\
  “现在，我用锤子把金属敲平，”德克斯解释道，“我正在用锤子敲金属。我又在敲了。我又在敲了。”\n\n蕾切尔站在侧面看着。在第十次重复之后，她翻了个白眼。\n\n\
  这些描述不仅令人厌烦，还让人难以跟上思路。持续不断的细节掩盖了制作合页的概念。德克斯第一次描述制作合页的过程时其实非常简单。他没有说出任何铁匠应该轻易掌握的低级细节：为了敲平一块金属，你先加热并用锤子敲它。\n\
  \n\n\n\n\n“这是一个栈，”安说道。\n\n“我看出来了，”彼得说，“我帮着把它们堆在一起。把它们整理起来不是有帮助吗？可能效率更高。”\n\n“你不明白。这是一个计算栈——一种后进先出的数据结构。它是经过组织过的。”\n\
  \n“那这堆书是怎么组织的？”彼得有些不可置信地问。\n\n“最近请求的书在最上面，”安回答道。接着，过了一会儿，她放下笔，全神贯注地转到彼得身上。“每个人都有自己的研究方法。有些人喜欢同时尝试许多不同的想法。有些人则是东来跳去的。而我使用深度优先搜索。”\n\
  \n“深度优先搜索和研究有什么关系？”\n\n“我会不断深入钻研一个课题，直到遇到死胡同。然后我会回溯并尝试不同的东西。栈非常适合这种研究。”\n\n“考虑一下你刚才提到的那两本书：`在\
  \ 1 到 6 的范围内使用骰子选择随机数`和`研究花园小矮人的高级概率论`。这两本书都与我几分钟前读到的主题有关——某些算法中随机性的使用。所以我决定深入探究随机性。接下来，我会从栈的最顶部取下其中一本书，阅读它，并可能请求其他相关的书籍。”\n\
  \n“当我读完书时，我会把它们从栈中取出。这意味着当我在某项调查遇到死胡同时，我会找到栈中下方较旧的书。我的研究会自动回溯到早期的想法。”\n\n彼得专注地点头。“多么棒的数据结构啊！”他惊叹道，“它能让你的信息完全按照你的需要保持整齐。而且非常高效！插入和移除书籍都是`O(1)`\
  \ 操作；你只需把新书放在顶部，从顶部取出书。不需要对任何东西排序。太神奇了。”\n\n“我想是吧，”安赞同道。“记录一下，插入操作称为 `push`，移除操作称为\
  \ `pop`。你将数据 `push` 到栈中，然后将其 `pop` 出来。”\n\n“这个数据结构是你自己开发的吗？”\n\n安显得很困惑。“一堆书？我怀疑。我很确定人们很久以前就把书堆成堆了。”\n\
  \n“噢，也是。”彼得停顿了一下，“到底，你为什么要研究随机性呢？”\n\n![](img/00022.jpg)![](img/00020.jpg)\n\n“我不确定，”安承认道。“这个灵感来自别人给我的这个神奇钱包包。它能神奇地追踪里面有多少钱。”\n\
  \n安向彼得展示了马库斯给的那个钱包包。她拿出一个美分，计数器减少了 `$0.10`。\n\n“这有什么关系呢？”彼得问。\n\n安耸了耸肩。“自从我开始旅程，它的价值一直在缓慢下降。在任何给定的一周内它都会起伏，但长期趋势是一样的。某些点让我想起了随机算法。它们随机地探索不同的解决方案，总是试图找到更好的。”\n\
  \n彼得在安和钱包包之间来来望去。“我还是不明白。”\n\n“这机会很大，”安承认道。“但克莱的消息中某些地方让我想起了那个钱包包。正如我所说，我会一直沿着一个想法深入钻研，直到遇到死胡同。”\n\
  \n彼得看着那堆书，有些局促地挪动着身体。“但你有时间做那个吗？我的意思是遇到死胡同。”\n\n“我不知道，”安诚实地回答道。\n\n“如果你是对的呢？”彼得问，听起来更加担心了。\n\
  \n“我们会赢，”安回答道。“那会是好事。”\n\n“但那个巫师还在那里。当你尝试你的想法时，他可能已经在几英尺外了。他不能直接朝我们放一个巨大的火球吗？”\n\
  \n“这个巫师看起来并不像那种放火球的人，”安提议道。\n\n“换一种诅咒呢？水疱怎么样？”\n\n“我想对此也有主意，”安说道。“如果 `NP-hard` 咒语真的像我想中那样强大，他需要使用大量的魔法。只要我们能避免被第一个咒语诅中，一段时间内对后续咒应该是安全的。”\n\
  \n“你确定吗？”彼得问。\n\n“不确定。但所有证据似乎指向那里。”\n\n彼得自己点了点头几次。然后，似乎得出了某种结论，他坚定地朝图书馆正门走去。\n\n\
  “你要去哪？”安问。她心想自己是不是把他吓跑了。诚然，由于恐惧而逃跑对他来说确实是最安全的做法。\n\n“去你的。如果你的，，巫师没有足够的魔法来用火球消灭我们，那么我们可能还需要更多的帮助。如果你的研究没有成功，我想反正也无所谓了。”\n\
  \n在他离开后，安看向那堆书。她试图把脑子里所有那些“如果”都赶走，专注于眼下的研究。她仍然需要弄清楚从一开始该如何避免被诅咒。她小心地伸出手，`pop` 掉了栈中的下一本书。\n\
  \n## 期望运行时间\n\n算法的期望运行时间表示算法平均执行需要多长时间。这指示了算法在处理典型问题时的表现。然而，与最坏情况分析不同，期望运行时间对于困难实例来说可能是乐观的。\n\
  \n***\n\n一个披着深色斗篷的巫师站在楼梯口。他的右手握着一根刻有数学符号的木杖。大大的兜篷遮住了他的脸。\n\n“早安。我正在寻找彼得，”巫师宣布。他在楼梯口停下。\n\
  \n彼得没有回答。她盯着巫师。“请问，你是彼得吗？”巫师再次走近问道，“我有一个需要你帮助的问题。我听说你是伟大的计算天才。”\n\n彼得握紧了双手。\n\n\
  “问我吧，”安说道。\n\n巫师停顿了一下，观察了安片刻。然后，他拉下兜篷。他的脸让安想起了学校里的许多终身教授。灰白的头发几乎没盖住头，脸上布满了皱纹，但他的眼睛闪烁着光芒。他给了一个邪恶的微笑。“安公主？真是个惊喜。我没想到这么快就遇到了你。当然，我曾希望我们的路径确实交汇。”\n\
  \n“你到底问不问问题？”安问。\n\n巫师的笑容扩大占据了他的整张脸。“让我们聊聊一个我称为旅行商问题的小问题。我需要一个快速、精确的算法来解决大图上的这个问题。”他的声音平静得几乎安抚人心；这让安想起了无数让她睡着的的讲座。当他说话时，他的右手开始挥动魔杖。顶端散发着微弱的蓝光。\n\
  \n“我一直偏爱我在六年级学到的一种算法：随机爬山，”安陈述道。\n\n巫师停住了，显得很困惑。“随机爬山？”他问。\n\n“非常简单，”安解释道，“从对解决方案的猜测开始。然后开始优化循环。在循环的每一步中你：\n\
  \n1.  对解决方案提出一个微小的随机更改。\n2.  检查新解决方案。\n3.  如果新解决方案更好，就接受它。如果不是更好，则以较小的概率接受它。我喜欢掷两个六面骰子，如果掷出双六点，就采取一个错误的举动。”\n\
  \n\n\n\n\n“你总是采取能让事情好起来的行动。有时你也会采取让事情变得糟糕的行动，这样你你最终能找到更好的解决方案。”\n\n巫师张着嘴呆地盯着安。安注意到他的额头上渗出了一小汗珠。“那是一个`heuristic\
  \ algorithm`——一系列猜测！它不能保证你一定能找到答案。它几乎是在盲目地搜索。”\n\n“你说得对，”安认同道，“但在大多数时候，它的表现是相当不错的。”\n\
  \n“大多数时候？”巫师问道。\n\n“你一定知道，对于`NP-hard`问题，目前还没有高效且精确的算法……。事实上，可能根本没有任何高效的解决方案。没人知道。但某些算法在大多数情况下表现得非常合理。”\n\
  \n巫师向后退了一步，举起法杖。“这是什么鬼术？”他问道。\n\n“没什么鬼术，”安回答道，“这和`expected-time algorithm analysis`的逻辑是一样的。算法的最坏情况性能只能告诉你部分情况。我的幼儿园老师曾经吃过一次大亏，当她——”\n\
  \n“够了！”巫师吼道。\n\n安报以轻蔑的微笑。“看来你低估了我所能运用的整个计算分析领域。存在一个算法与概率相汇的新分析世界。你的诅咒在那里毫无威力。”\n\
  \n“你必须成为`heuristic algorithms`和`expected running times`领域的世界级专家，这个咒才会失效，”巫师抗议道，“你是怎么知道的？”\n\
  \n“我一路上发现了一些线索，”安说道。\n\n“这还没完！”巫师大喊道。\n\n他转身想要离开——却发现“可怕的托德”挡住了他的退路。那个蜡烛匠学徒咯咧笑着，抓住巫师的双臂将他提了起来。安确信自己可以扣留巫师一两天，直到马库斯和加尔温爵到达。而且显然，不需要担心托德会成为`NP-hard`诅咒的受害者。\n\
  \n“是的，结束了，”彼得从安身后探头喊道。然后他小声地嘟囔道，“放弃我的季票完全值了。”他听起来像是在努力说服自己。\n\n巫师转过身看向安。“我只是开始，”他宣称道。\n\
  \n“什么的开始？”安问道。\n\n老巫师笑了起来。“混沌将吞噬整个王国。计算基础将崩塌。那是一个新的黑暗时代。”\n\n“为什么？”安问道。\n\n“当然，是接管的第一步，”巫师简单地说。这种直率让安措手不及。他继续道：“你认为你的计算规则会永远持续吗？我只是开始。即使你从我的咒中救了王国的计算思想者，你认为你准备好迎接未来的挑战了吗？”\n\
  \n## 回家\n\n在远征阻止黑暗一年后，安回到了城堡。号角宣告了她的到来，旗帜在每个旗杆上飘扬，一全副荣誉卫队在她的旁列队。城堡准备了英雄式的欢迎。一年前，安会为这种庆祝感到欣喜不已。而现在，她只想睡觉。\n\
  \n安直接走向王座厅。她的父亲独自等在那里。当她进入房间时，他露出了自豪的微笑。\n\n“我阻止了黑暗，”安宣布道，“或者说，我阻止了那个试图让王国陷入计算黑暗时代的巫师。马库斯仍在到处旅行修复造成的损害。”\n\
  \n“你做得很好，”国王宣布道，“我为你感到骄傲。欢迎回家，安。”\n\n“谢谢，”这是安能说出的全部。一小怀疑继续困扰着她。她试图压抑它并沉浸在成功中，但它拒绝安静。\n\
  \n弗雷德里克国王注意到了她脸上的表情。“怎么了？你成功了。”\n\n“我知道，”安回答道，“只是……”她声音小了下去。\n\n她的父亲等她说完。\n\n“如果我没有成功呢？”安问道，让洪水般的怀疑倾而出。“我离失败只有一步之遥。我不确定为什么这次任务必须是我。我完全没有准备好。”\n\
  \n她的父亲沉默地看着她。片刻后，他开口了。“这就是为什么必须是你；因为你必须学习。准确地说，预言者说必须由我挑选的人独自出征。我相信你可以利用这段经验。而且，无论如何，你在预言期间根本没有在听。”\n\
  \n安对这个发现感到震惊。“如果我失败了呢？”\n\n“我对你有信心，”他平静地说，“有些事情必须通过实践和应用来学习。仅仅阅读关于任务的概念是不够的；你必须出去应用它们。你必须通过试错来实验这些技术。”\n\
  \n安看起来并不被说服。\n\n国王变得严肃起来。“听好，安。当你登上王位时，总会有新的挑战。有些会更容易，有些会更难，但你必须面对所有挑战。王国的命运将一次又一次取决于你。”\n\
  \n她点了点头，但怀疑继续侵蚀着她。“如果我处理不了怎么办？如果我不够聪明怎么办？”\n\n“有些基础知识你已经有了；其他的，你将会学习。继续学习如何应用它们取决于你。”\n\
  \n安带着不安的情绪离开了王座厅。她在家里是安全的。她完成了任务；她拯救了王国，使其没有陷入计算黑暗时代。”\n\n\n\n# 字符串与鸽子信\n\n# 小鱼花儿的宠物店\n\
