- fmt: "\n为了帮助你进一步理解这个概念，这里有一个示例：\n\n```\nmain()\n{\n    unsigned short a;\n    unsigned\
    \ short b;\n    ULONG c;\n    \n    c = a * b;\n}\n```\n\n如上方输出所示，程序执行了数学运算——乘法。你可以看到变量`c`是变量`a`与变量`b`相乘的结果。然而，这些变量的含义仍然不明确。究竟\
    \ `a`, `b`, 和 `c`\n代表什么？它们是度量单位吗？还是特定的数值？代码行并没有说明这些变量的意义。因此，在程序中使用这样的变量名并不理想。\n\
    第一次看到这段代码的人可能会感到困惑，尤其如果你没有任何编程经验。\n\n你需要看另一个示例：\n\n```\nmain()\n{\n   unsigned\
    \ short Area ;\n   unsigned short Length ;\n  unsigned short Width ;\n\n  Area\
    \ = Length * Width ;\n}\n```\n\n如上例所示,很明显这几个分别代表了特定对象的面积 (`Area`) 、长度(`Length`)\n\
    和宽度(Width)。这个比之前的那个容易阅读和理解得多.此目的是通过将长乘宽来找出某物体的面积；它直接明了、简洁清晰.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ | |\n![image(d2D IMAGES /CHAPTER TITLE CORNER DECORATION RIGHT.PNG)\n\n! [Imag\
    \ e ] ( ...上面图片路径 )\n\n# Chapter :Pointers\n\n下面是分割线----------\n\n## C Pointers\
    \ \n\n指针是语言中令人惊叹的特性之一正是这使该不同于其他包括Python Java在内的等其他高级吧语它们用于操作地址以及访问内存  \n\n**C语言的地址**\n\
