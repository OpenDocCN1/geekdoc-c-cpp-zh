  raw: 'Lastly, the above given example shows that the address points to *pc, with
    c also being a value.


    In both of these cases, the pointer pc does not point to the address of the variable
    c.


    Arrays and Pointers


    Arrays are in close relation with the pointers in the C language. However, even
    though they are related, they are still different from each other. For instance,
    the pointer variable has a different address for every value while the array only
    has a fixed one.


    To understand this concept further, you have to take a look at the following sample
    program:


    ![image](d2d_images/image007.png)


    When you run the above given sample program, you will see the following output:


    The address of the charArray [ 0 ] is 28ff44


    The address of the charArray [ 1 ] is 28ff45


    The address of the charArray [ 2 ] is 28ff46


    The address of the charArray [ 3 ] is 28ff47


    You have to take note that there is a possibility for you to get a different address
    for the array that you used in your program.


    Also, you have to be observant with regard to the differences of bytes between
    the consecutive elements of the arrays. In the above given example, there is an
    obvious difference of one byte between the two elements that are consecutive in
    the array charArray.


    However, because the pointers simply point towards the location of a new variable,
    it has the capability to store whatever address there is.


    The Relationship of Pointers and Arrays


    You have to remember that in the C language, the name of an array points to the
    address of the array’s first element at all times. Take a look at the following
    example:


    int arr [ 4 ] ;


    ![image](d2d_images/image011.png)


    As you can see in the above given example, the arrays arr [ 0 ] and arr both point
    to the address of the declared first element. In this example, arr is equivalent
    to &arr [ 0 ].


    Because their addresses are similar, their values are similar as well. If you
    will study both &arr [ 0 ] and arr, you will see that they have the same values.


    *arr is equivalent to arr [ 0 ] in terms of the value of the addresses of their
    pointers.


    Likewise, you can say that &arr [ 1 ] has the same equivalence as ( arr + 1 ).
    At the same time arr [ 1 ] and *( arr + 1 ) have the same equivalence. Then, &arr
    [ 2 ] has the same equivalence as ( arr + 2 ) while at the same time, arr [ 2
    ] has the same equivalence as *( arr + 2 ). Also, &arr [ 3 ] has the same equivalence
    as ( arr + 3 ) while at the same time, arr [ 3 ] has the same equivalence as *(
    arr + 3 ). This pattern goes on and on until you reach &arr [ i ], which has the
    same equivalence as ( arr + i ). At the same time, arr [ i ] has the same equivalence
    as *( arr + i ).


    Keep in mind that in the C language, you are free to declare arrays and use pointers
    to change the data of your arrays.


    To better understand this concept, you have to take a look at the following sample
    program. In this program, you will see how you can get the sum of six numbers
    with pointers and arrays.


    #include < stdio.h >


    int main ( )


    {


    int i , classes [ 6 ] , sum = 0 ;


    printf ( “ You have to enter six numbers :  \n ” ) ;


    for ( i = 0 ; i < 6 ; ++i )


    { 


    // In this sample program, you have to take note that ( classes + i ) has the
    same equivalence as &classes [ i ]


    scanf ( “ %d “ ,  ( classes + i ) ) ;


    // In this sample program, you have to take note that *( classes + i ) has the
    same equivalence as classes [ i ]


    sum += *( classes + i ) ;


    }


    printf ( “ The sum of the numbers is equal to :  %d “ ,  sum ) ;


    return 0 ;


    }


    When you run the above given sample program, you will get the following output:


    You have to enter six numbers :


    3


    2


    1


    7


    3


    5


    The sum of the numbers is equal to : 21


    In the above given sample program, you are asked to enter six numbers because
    that is what has been declared. You are free to input any number you want. They
    do not have to be in a certain order or follow a specific sequence. You just have
    to enter six numbers. Once you are done entering the six numbers, the program
    will compute their sum because that is what was declared. Whatever value was computed
    will be displayed in the output.


    If you are still having a bit of a hard time understanding this concept, you have
    to take a look at the following sample program. In this other example, you will
    learn how you can access the elements of an array with the use of pointers.


    #include < stdio.h >


    int main ( )


    {


    int data [ 5 ] ,  i ;


    printf ( “ You have to input elements here :  “ ) ;


    for ( i = 0 ; i < 5 ; ++i )


    scanf ( “ %d “ , data + i ) ;


    printf ( “ You have entered the elements :  \n “ ) ;


    for ( i = 0 ; i < 5 ; ++i )


    printf ( “ %d \n “ ,  *( data + i ) ) ;


    return 0 ;


    }


    When you run the above given sample program, you will get the following output:


    You have to input elements here : 5


    6


    7


    9


    8


    You have entered the elements :


    5


    6


    7


    9


    8


    As you can see in the above given example, the elements used are kept in an integer
    array data. With the use of a for loop, every one of the elements in the data
    is passed through and printed with the use of a pointer technique.


    Functions and Pointers


    The moment the pointer gets passed to the function as an argument, the address
    of its memory location gets passed rather than its value.


    To help you understand the concept of functions and pointers better, here’s another
    sample program. In this example, you will see how two numbers are swapped with
    the use of a call by reference.


    ![image](d2d_images/image001.png)


    If you run the above given sample program, you will obtain the following output:


    The value of num1 is 10


    The value of num2 is 5


    As you can see in the output, the addresses of the memory locations num1 and num2,
    respectively, are passed on towards the function swap as well as the pointers
    *n1 and *n2, respectively. The values are accepted. Thus, the pointers n1 and
    n2 now point to the addresses of num1 and num2.


    In case the values of the pointers are switched, the value indicated within the
    specific memory location changes as well. Therefore, whatever changes are made
    to both *n1 and *n2 are shown in both num1 and num2 at the function main. In the
    C language, such technique is referred to as call by reference.


    To help you understand this concept further, you have to consider the following
    examples.


    Use Call By Reference to Swap Numbers In a Cyclic Order


    This sample program shows you how pointers are used to collect integers and swap
    them in a cyclic order.


    As the user, you have to input three variables. The values that you entered will
    be stored in their respective locations, which in this case, are variables a,
    b, and c.


    The variables will be passed on towards the function cyclicSwap ( ). Rather than
    pass the actual variables, the addresses of the variables are the ones that are
    passed. Once these variables get swapped in a cyclic order in the function cyclicSwap
    ( ), the variables a, b, and c within the function main also gets swapped automatically.


    In order for you to understand this concept further, you have to take a look at
    the following example. In this sample program, you will see how elements are swapped
    with the use of the call by reference.


    ![image](d2d_images/image008.png)


    // This sample shows how swapping is done in a cyclic order


    temp = *b ;


    *b = *a ;


    *a = *c ;


    *c = temp ;


    }


    When you run the above given sample program, you will get the following output:


    You have to enter the value for a, b, and c : 1


    2


    3


    You have to enter a value before you swap


    a = 1


    b = 2


    c = 3


    The value after swapping is


    a = 3


    b = 1


    c = 2


    As you can see, there were no values that have been returned from the function
    cyclicSwap (  ).


