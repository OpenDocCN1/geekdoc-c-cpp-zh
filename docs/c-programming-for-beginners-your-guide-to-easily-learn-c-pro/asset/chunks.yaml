    -----------------------------\n#基础知识\n---\n现在开始进入本书第一部分：《学好语法之前需掌握哪些核心概念》\n\n\
    操作符体系介绍：\n\n对于任何算法来说都会涉及到针对常量或是变量所做的一系列运算控制指令集统称即为\"运算符\"。其中最常用的几类恰好与我们日常算术有着紧密联系\
    \ ——比如下面这些常见符号各自功能解析 ：加号(+)实现累加效果 ;乘性记号(* )处理乘法业务选项 【但请注意并非所有数组相乘都有意义】;\n\n减式(-\
    \ ）应对递减场景的需求匹配 ,左斜杠(/ )专职用于除法求解的环节设计,百分取模(% ),负责输出两整数相除之后遗留下的余数片段信息结果项内容 。最后标准赋值符号(=),作用是把右侧计算结果传递给左侧存储单元以便后续再利用!\n\
    \n除此之外还存在着更多辅助性质更强的一些专用标记等着我们去探索发掘呢!举个例子说当你引用头文件名为 `<iostream>`后便能获得对插入外发键(`<<`)的执行权限从而顺利完成文本打印任务喽~暂时忽略预处理宏指示字串(#include)，也可照样访问其他不同类型的高级操控句柄呀?譬如归类行列里的关系判断对比组件又有增量累计器模块以及复合重载开启模式等等~\n\
    \n声明变量的规范步骤说明:\n\n如果想要把自定义标识纳入表达式范畴之内必须先向编译器进行通告注册才行--并且同时赋予初始量纲指标参数额！！格式模板参照\
    \ : \n\n数据类型名称 +空格+自定义别名 ;\n\n切记不能遗忘掉明确分类修饰关键词这一点非常关键哦～～同理,初始化构造时要严格遵循这套准则哈 !比方准备设置整型字段命名为\
