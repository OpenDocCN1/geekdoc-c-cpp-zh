  raw: 'Keep in mind that this statement is repeatedly executed for as long as the
    value of the expression stays non-zero. Such expression gets evaluated after every
    iteration. This is necessary in order for the loop to execute the statement one
    or more times.


    With regard to the parentheses found around the expression, they are mandatory.
    If you do not include them in your statements, you will get an error when you
    try to run your program.


    In addition, you have to take note that do is the sole control structure in the
    C programming language that explicitly ends with a semicolon ( ; ). The other
    control structures in the C programming language tend to end with a statement.
    This means that they implicitly feature a closing brace or semicolon.


    In order for you to understand this concept better, you have to take a look at
    the following example. In this example, the scalar product of two vectors are
    calculated with the use of the do statement:


    w = 0 ; i = 0 ;


    do


    {


    w += a [ i ] * b [ i ] ;


    i++ ;


    }


    while ( i < n ) ;


    ––––––––


    ![image](d2d_images/scene_break.png)


    Decision-Making Statements


    When writing your programs in the C language, always remember that you need to
    specify at least one condition for testing or evaluation of the structures. You
    also have to include at least one statement for execution in case your condition
    is found to be true. You may include optional statements in case the condition
    is found to be false.


    The flow diagram of the general form of a decision-making structure is as follows:


    ![image](d2d_images/image006.png)


    In the C language, you have to use the following types of decision-making statements
    in your programs:


    | Statements | Descriptions |


    | if statement | It consists of a Boolean expression and at least one more statement.
    |


    | if . . . else statement | It is followed by an optional else statement that
    executes if a Boolean expression is found to be false. |


    | switch statement | It allows the variable to be tested for equality against
    a set of values. |


    | nested if statement | A single if or else if statement can only be used within
    another if or else statement. |


    | nested switch statement | A switch statement can only be used within another
    switch statement. |


    The If Statement


    It consists of a Boolean expression, and then followed by at least one more statement.
    It has the following syntax:


    if ( Boolean expression )


    {


    // This statement will be executed if the Boolean expression is found to be true.


    }


    You have to take note that the expression found within the parentheses can be
    anything. For instance, if its value is zero, the expression is considered to
    be false and the statement is ignored. If its value is a non-zero, the expression
    is considered to be true and the statement is executed.


    In case the Boolean expression is found to be true, the block of code within the
    if statement gets executed. On the other hand, if it is false, the initial series
    of code after the end part of the if statement gets executed.


    The flow diagram for the if statement is as follows:


    ––––––––


    ![image](d2d_images/scene_break.png)


    Flow Diagram


    ![image](d2d_images/image013.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    The if statement lets you test for different types of conditions, as well as branch
    out to different areas in the body of the program, based on your  output.


    if ( LargeNumber > SmallNumber )


    LargeNumber = SmallNumber ;


    AS you can see in the above given sample code, the elements LargeNumber and the
    SmallNumber are compared to each other. If the LargeNumber is proven to be larger,
    then the second line sets the value to the value of the SmallNumber, regardless
    of what it is.


    if ( expression )


    {


    FirstStatement ;


    SecondStatement ;


    ThirdStatement ;


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    Advanced If Statements ( Nested If Statements )


    As the programmer, you are allowed to use any statement within an if or else clause,
    as well as within another if or else statement. However, you should remember that
    you are dealing with complex if statements when you see this format:


    if ( expression1 )


    {


    if ( expression2 )


    statement ;


    else


    {


    if ( expression3 )


    statement2 ;


    else


    statement3 ;


    }


    }


    else


    statement4 ;


    If the two expressions are found to be true, the first statement gets executed.
    If the first and third expressions are found to be true and the second expression
    is false, the second statement gets executed. If your first expression is found
    to be true, but the second and third expressions are found to be false, the third
    statement gets executed. Lastly, if your first expression is found to be false,
    the fourth statement gets executed.


    Nested If Statements and Braces


    As a programmer, you have to be cautious when you use nest if statements in your
    programs.


    if ( a > b )   // If a is found to be bigger than b


    if ( a < c )  // and if a is found to be smaller than c


    a = b ;   // then you should set a to the value of c


    You have to avoid assigning else statements to the incorrect if statements. Moreover,
    you should always use whitespaces and indentions in your programs so that they
    will appear more organized and easier to read.


    The If . . . Else Statement


    Always keep in mind that the if statements may be followed by else statements,
    which execute if the Boolean expressions are proven to be false. The if . . .
    else statement has this syntax:


    if ( Boolean_expression )


    {


    // The statement executes if the Boolean expression is found to be true


    }


    else


    {


    // The statement executes if the Boolean expression is found to be false


    }


    If your Boolean expression is proven to be true, the if block of code gets executed.
    Otherwise, the else block of code is the one that gets executed. The flow diagram
    of the if . . . else statement is as follows:


    ––––––––


    ![image](d2d_images/scene_break.png)


    Flow Diagram


    ![image](d2d_images/image014.png)


    ––––––––


    ![image](d2d_images/scene_break.png)


    The If . . . Else If . . . Else Statement


    If statements can be followed by else if . . . else statements. These statements
    are useful for testing different conditions with the use of the single if . .
    . else if statement. Each moment you use an if . . . else if . . . else statement,
    you have to make sure that you keep these pointers in mind:


    *   The if statement can have 0 or 1 else statement that must come after else
    if.


    *   The if statement can have 0 or as many else if statements that must go before
    the else.


    *   When an else if statement executes with success, no other else if or else
    must be tested.


    The if . . . else if . . . else statement has this syntax:


    ––––––––


    ![image](d2d_images/scene_break.png)


    if ( first Boolean expression )


    {


    // It executes when the first Boolean expression is true


    }


    else if ( second Boolean expression )


    {


    // It executes when the second Boolean expression is true


    }


    else if ( third Boolean expression )


    {


    // It executes when the third Boolean expression is true


    }


    else


    {


    // It executes when none of the above conditions is true.


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    The Nested Switch Statement


    As the programmer, you are free to use a switch as part of the statement sequence
    of your outer switch. There are at least two hundred and fifty-six levels of nesting
    that you can use for your switch statements.


    The Switch Statement


    The switch statement allows for all variables to be tested for equality. A value
    is referred to as a case. In every case, the variable that gets switched on needs
    verification.


    ![image](d2d_images/image003.png)


    Each time you use a switch statement, you need to remember these tips:


    *   All the expressions used in your switch statements must have enumerated or
    integral types.


    *   Any number of case statements may be used within a switch, as long as you
    include the value you used to compare the case. Make sure that you also include
    a colon.'
