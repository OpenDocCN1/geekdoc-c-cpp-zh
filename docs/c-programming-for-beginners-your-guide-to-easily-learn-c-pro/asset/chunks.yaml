  raw: 'Clearly, complete and boundless flexibility in terms of purpose and application
    could be an advantage. However, in the case of programming, the lack of specialization
    can be deemed a downside. For example, if there’s a language that’s better suited
    to your goals, choosing to continue with C could only lead to an increase in the
    effort required to come up with something functional.


    Still, even with the presence of better alternatives, knowing how to program in
    C should prove to be beneficial – as previously mentioned, it is similar to other
    popular, more recent languages.  


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Reserved Words


    ![image](d2d_images/chapter_title_below.png)


    Before you proceed with writing programs in the C language, you have to learn
    about the reserved words first. These words have specific purposes and cannot
    be used for any purpose other than what they are originally intended for.


    The following reserved words are used in the C programming language:


    auto – it is a storage class specifier used for declarations


    break – it is a statement used for escaping from loops or switches


    case – it is an option prefix used within the switch statement


    char – it is a typename


    continue – it is a statement used to branch towards the beginning of the next
    loop


    default – it is an option used in the switch statement


    double – it is a typename


    do – it is a statement


    else – it is a statement


    entry – it is meant to be used in the future


    extern – it is a storage class specifier


    for – it is a statement


    float – it is a typename


    goto – it is a goto label


    int – it is a typename


    if – it is a statement


    long – it is a typename


    return – it is a functional statement


    register – it is a storage class specifier


    short – it is a typename


    static – it is a storage class specifier


    sizeof – it is a compile time operator


    struct – it is a partial typename


    typedef – it is a statement


    switch – it is a statement


    unsigned – it is a typename


    union – it is a partial typename


    while – it is a statement


    void – it is a typename


    enum – it is a partial typename, but only for ordinal types


    const – it is a storage class specifier, but there is no allocated storage


    volatile – it is a storage class specifier


    signed – it is a typename


    ––––––––


    ![image](d2d_images/scene_break.png)


    Preprocessor Directives


    See to it that you also familiarize yourself with these preprocessor directives
    so that you can write working programs in the C language:


    #include – it includes the file for the purpose of linking


    #undef – it undefines a symbol that has been previously defined


    #define – it defines a preprocessor symbol or macro


    #if – it tests for conditional compilations


    #ifndef – it tests for conditional compilations


    #ifdef – it tests for conditional compilations


    #endif – it tests for conditional compilations


    #else – it tests for conditional compilations


    #error – it is a tool for debugging


    #line – it is a tool for debugging


    Libraries and Header Files


    The header file contains the macro definitions, variable declarations, function
    declarations, and type definitions that are used in relation with the standard
    library. They are used to supplement an object code library that is linked at
    a compile time for a standard library function. Keep in mind that there are library
    facilities that are not available if there are no included header files. Some
    of the most common names for header files include the following:


    stdio.h – it is the standard input and output


    math.h – it is used for mathematical definitions


    ctype.h – it is a macro for the character types


    Constants


    Octal – it has a prefix of 0 and involves the characters 0 to 7


    Integer – it involves the characters 0 to 9


    Hexadecimal – it has a prefix of 0x and involves the characters 0 to 9\. It can
    also use A to F or a to f.


    Character – it is declared using single quotes


    Explicit long – it means that hexadecimal or octal and integer types can be declared
    as long when you write the letter L right after your constant


    Strings – they are written using double quotes


    Float – it involves the characters 0...0 and one ( . ). It can also involve scientific
    notation exponents that are preceded by the uppercase letter E or the lowercase
    letter e.


    Primitive Data Types


    int – it is an integer type


    char – it holds a character


    long int – it is used for an integer that is no smaller than int


    short int – it is used for an integer that is no larger than int


    float – it is a floating point, which is used for real numbers


    long float – it is a double precision float


    void – it does not hold any value and does not use any storage, except when it
    is used as a pointer


    double – it is a double precision float


    Storage Classes


    const – it does not allocate any variable and the value does not change


    auto – it is used for local variables


    extern – it is used for a variable that has been defined in a different file


    register – it is used for storing in the register as much as possible


    static – it is used when a value has been preserved between function calls


    volatile – it is used when a value is changeable by an agent outside of the program


    Character Utilities


    These are used when you use char ch; in your program.


    isalpha ( ch ) – it means alphabetic order, from A to Z or a to z


    islower ( ch ) – it means lower case


    isupper ( ch ) – it means upper case


    isxdigit ( ch ) – it covers the range of A to F or a to f or 0 to 9


    isdigit ( ch ) – it covers the range of 0 to 9


    isspace ( ch ) – it is a whitespace character


    ispunct ( ch ) – it is symbolic or a punctuation


    isalnum ( ch ) – it is alphanumeric


    isgraph ( ch ) – it is used when the character can be printed or is printable


    isprint ( ch ) – it is used when the character can be printed or is printable
    on screen and space


    isascii ( ch ) – it is used within the range of 0 to 127


    iscntrl ( ch ) – it is a control character and is not printable


    iscsym ( ch ) – it is a valid character for the identifier in C


    tolower ( ch ) – it converts the character to a lowercase letter


    toupper ( ch ) – it converts the character to an uppercase letter


    toascii ( ch ) – it converts the character to its ASCII equivalent


    Special Control Characters


    These characters are necessary in a program, even though they are not visible
    on your screen. They are used for specific purposes, such as for cursor movements.
    They are also written into ordinary characters or strings with the use of the
    backslash symbol ( \ ) and another character.


    The following are the special control characters used in the C programming language:


    \b – it is the backspace


    \f – it is the form feed


    \n – it is the new line


    \r – it is the carriage return


    \t – it is the horizontal tab


    \v – it is the vertical tab


    \” – it is the double quotes character


    \’ – it is the single quote character


    \\ – it is the backslash character


    \ddd – it is the character ddd in which ddd is actually an ASCII code given in
    base 8 or octal


    Input and Output Functions


    It is important for you to take note of the following:


    scanf ( ) – it means formatted input analysis


    printf ( ) – it means formatted printing


    putchar ( ) – it means putting one character in the stdout file buffer


    getchar ( ) – it means getting one character from the stdin file buffer


    puts ( ) – it puts the string in stdout


    gets ( ) – it gets the string from stdin


    fscanf ( ) – it means formatted input from the general files


    fprintf ( ) – it means formatted printing to the general files


    fputs ( ) – it means putting the string in the file


    fgets ( ) – it means getting the string from the file


    fclose ( ) – it closes the file that was opened by fopen ( )


    fopen ( ) – it opens or creates a file for a high level access


    getc ( ) – it gets one character from the file


    ungetc ( ) ; – it is used to undo the last get operation'
