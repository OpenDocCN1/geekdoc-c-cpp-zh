    # Chapter 1: Introduction to C


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # The C Language


    ![image](d2d_images/chapter_title_below.png)


    The C language was developed by Dennis MacAlistair Ritchie in 1972\. It is a general
    purpose, imperative, and procedural programming language. It is mostly used on
    operating systems such as iOS and Windows. It is also one of the most popular
    computer languages of all time. It is practical and easy to learn. The programs
    are portable and the source code is compatible with many operating systems.


    A Brief History of C


    The development of the C language is closely related to that of the Unix operating
    system.


    This programming language was developed by Dennis Ritchie in the 1970s. Ritchie
    was working at Bell Labs at that time. Before he came up with the C language,
    however, he worked on a project known as Multics, along with other people at Bell
    Labs.


    Bell Labs is a research and scientific development company that is owned by Nokia,
    which is a Finnish company. Its roots are in the consolidation of some engineering
    departments at the Western Electric Company and the American Telephone & Telegraph
    company, also known as AT&T.


    Anyway, during that time, Ritchie and his colleagues were working on the Multics
    project; they aimed to come up with an operating system that a huge computer can
    use. They wanted thousands of users to be able to benefit from their operating
    system project.


    However, Bell Labs suddenly quit the project in 1969 because Ritchie and his colleagues
    cannot produce a system that is useful in the economic sense. Due to the failure
    of this project, they were forced to look for a new project that they can focus
    on. Ken Thompson and Dennis Ritchie were eager to start this new project.


    Thompson started to work on developing a file system. In fact, he made a version
    of his new file system in the assembler, for the DEC PDP-7\. This file system
    was used for Space Travel as well. It was a popular game during that time.


    Eventually, the duo started to see improvements in their work. They also started
    to include expansions in the file system. Since they already acquired useful knowledge
    and experience from working on the Multics project, they were able to include
    useful features with ease. These new features made the system more efficient.


    Soon enough, a complete system was done. Brian Kernighan, a computer scientist
    who also worked with Ritchie and Thompson at Bell Labs, called it UNIX. His name
    for the system was intended to be a sarcastic reference to the earlier Multics
    project. The entire system was written using assembly code.


    Aside from FORTRAN and assembler, UNIX also featured an interpreter for the B
    programming language. It was directly derived from the Basic Combined Programming
    Language (BCPL), which was a structured, procedural, and imperative programming
    language that was designed by a computer scientist named Martin Richards.'
