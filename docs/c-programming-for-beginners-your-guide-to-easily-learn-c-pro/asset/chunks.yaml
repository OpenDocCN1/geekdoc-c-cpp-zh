    # Elements of Arrays


    ![image](d2d_images/chapter_title_below.png)


    Arrays are practically collections of locations of data storage that hold a similar
    class of data. A storage location is called an element of the array. Declaring
    arrays is done by determining and writing their types, names, and subscripts.


    The subscripts are the numbers of elements found within the array. They have square
    brackets.


    long LongArray [ 20 ] ;


    In the above given sample statement, you can see that a declaration of an array
    consisting of 20 long integers that is named LongArray is made. When your compiler
    reads it, it prepares the memory to hold twenty elements. You should take note
    that a long integer needs four bytes. In this particular declaration, a hundred
    contiguous bytes of memory will be prepared.


    Elements of an Array


    The elements of an array can be accessed through the offsets of names. Then, they
    are counted, starting from zero. This explains why the first element of an array
    is given a 0 value. For example, you can write ArrayName [ 0 ] .


    If you choose to use the name LongArray, your first array element would be LongArray
    [ 0 ]  while your second array element would be LongArray [ 1 ]. You will continue
    to count from that value until you reach your target destination.


    SomeArray [ 3 ] , for example, has three elements, as you can tell by the value
    enclosed within its brackets. These elements are named SomeArray [ 0 ] , SomeArray
    [ 1 ] , and SomeArray [ 2 ] . SomeArray [ n ] also contains numbered elements
    from SomeArray [ 0 ] until SomeArray [ n – 1 ] . So, LongArray [ 25 ] is numbered
    from LongArray [ 0 ] until LongArray [ 24 ] .


    Writing Past the End of Arrays


    Once you put sample values in the elements of the array, the compiler will start
    to calculate where it should store these values. It considers the sizes and subscripts
    of these values too.


    For example, if you wish to write over a value that you stored at LongArray [
    5 ] , your compiler will multiply the offset according to the size of the element
    you used. In this example, the values you have are 5 and 4, respectively. It also
    moves 20 bytes from the beginning of the array as well as write the new values
    on the same location.


    Then again, if you would rather write at LongArray [ 50 ] , your compiler will
    compute the distance of your first element. Then, it will write over any value
    it sees on that location. This is not a good outcome because writing a new value
    like this may only cause your program to have unpredictable results.


    Array Initialization


    When you declare an array, you may initialize it as a simple array, such as characters
    and integers. See to it that you never forget to include the equal sign ( = ).
    You also have to include a series of values that are separated by commas. Always
    remember that you have to enclose everything within braces.


    Take a look at the following example:


    int IntegerArray [ 5 ] = { 10, 20, 30, 40, 50 } ;


    In the above given sample statement, the IntegerArray is declared as an array
    with five integers. It allocates the value of 10 to IntegerArray [ 0 ] and the
    value of 20 to IntegerArray [ 1 ] . The same process of allocating values goes
    on and on until the last IntegerArray. If you skip the array size, you produce
    an array that is big enough for initialization.


    To understand this concept further, you have to take a look at this example:


    int IntegerArray [ ] = { 10, 20, 30, 40, 50 } ;


    When you write this, you create the same exact array that you have already created
    before.


    If you wish to determine the array size of your program, you can command the compiler
    to compute it. You can input the following, for example:


    const USHORT IntegerArrayLength ;


    IntegerArrayLength = sizeof ( IntegerArray ) / sizeof ( IntegerArray [ 0 ] ) ;


    As you can see in the sample code shown above, the constant USHORT variable IntegerArrayLength
    is set to whatever result you get from dividing the whole array size by the individual
    array size. Whatever value of the quotient you get is the number of array members.


    Keep in mind that you are not allowed to initialize elements that you have declared
    for your array.


    Consider the following example:


    int IntegerArray [ 5 ] = { 10, 20, 30, 40, 50, 60 } ;


    If you type this code, you will only generate a compiler error. This happens because
    you declared an array that has five members when you only initialized an array
    that has six values.


    Take a look at this other example:


    int IntegerArray [ 5 ] = { 10, 20 } ;


    The above given example is allowed to be used in the C programming language. Even
    if uninitialized array members do not have guaranteed values, the aggregates are
    still initialized to 0\. If you do not initialize the array member, the value
    would be set to 0.


    You should allow the compiler to set your initialized array size. Keep in mind
    that it is not good practice to write beyond the end part of your array. Just
    like with variables, see to it that you use sensible names for your arrays in
    order to avoid confusion and misunderstandings. Also, you have to remember that
    the initial array member is always at offset 0.


    Array Declaration


    As the programmer, you are free to use any legal variable name you want for your
    array. However, you should avoid using a name that is the same as that of another
    variable and an array within the scope.


    When you declare arrays, you must define the type of object stored, the name of
    your array, and a subscript that contains the number of objects to be held in
    the array at all times. Take a look at the following examples to understand the
    concept further:


    int MyIntegerArray [ 90 ] ;


    long * ArrayOfPointersToLongs [ 100 ] ;


    If you decide to access the members of an array, you can use the subscript operator.


    Again, consider the following examples:


    int theNinthInteger = MyIntegerArray [ 8 ] ;


    long * pLong = ArrayOfPointersToLongs [ 8 ]


    All the arrays are counted starting from zero. The arrays of n items are numbered
    from 0 to n – 1.


    Multidimensional Arrays


    You can use arrays with more than one dimension in the C programming language.
    Take note that every dimension is represented as an array subscript. This means
    that a 2-dimensional array has two subscripts while a 3-dimensional array has
    three. An array can have any number of dimensions, depending on what is necessary.
    However, it is most likely that you will create an array with 1 or 2 dimensions.'
