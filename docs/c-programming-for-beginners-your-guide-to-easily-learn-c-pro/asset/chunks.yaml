    # Chapter 2: Getting Started


    ![image](d2d_images/chapter_title_below.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Hello World!


    ![image](d2d_images/chapter_title_below.png)


    The phrase “hello world” is often used in computer programs. It is simple and
    straightforward. It is usually used to show the syntax of the program. What better
    way to start writing programs than with a “hello world”?


    Since you are a beginner, you should start with a basic program such as the following:


    #include < stdio.h >


    main (  )


    {


    // This sample program displays the output Hello World!


    /* This sample program displays the output Hello World! */


    /* This sample program displays the output


    Hello World! */


    printf ( “Hello World! \n” ) ;


    return 0 ;


    }


    When you run the above given sample code, you will get this output:


    Hello World!


    Now, let us discuss the parts and the elements you used in this sample program.


    #include <stdio.h>


    The stdio.h header file allows you to use the function printf ( ), which contains
    your text. Your compiler knows where to find it. In order for you to use this
    header file, you have to include it in the program. You can do this by using the
    preprocessor #include.


    Keep in mind that the C language cannot really do much on its own, which is why
    you have to use files to run your program and get your desired output.


    Then again, you do not necessarily need to use stdio.h all the time. You can use
    a different header file, depending on the requirements of your program. For instance,
    if you have to calculate a square root, you have to use sqrt ( ).


    main ( )


    The function main ( ) allows the code to be executed in the program. It does not
    really matter where you put it. The code will execute right where this function
    starts.


    Aside from main ( ), you can also use int main ( ) or void main ( ), and you will
    get the same output. However, using void main ( ) is not recommended.


    { }


    These curly braces contain the body of your main ( ) function.


    ––––––––


    ![image](d2d_images/scene_break.png)


    //


    This is a double slash comment prefix. You can use it to write a comment on a
    single line.


    /*  */


    These are a slash asterisk and an asterisk slash. You can use them to write a
    comment on a single line or on multiple lines.


    printf( );


    This library function sends the formatted output to your screen. It displays whatever
    you put within the quotation marks. Make sure that you do not forget to put the
    semicolon ( ; ) at the end of your statement.


    return 0;


    The return statement ends your program. Unlike the function main ( ), the return
    statement is not mandatory. However, in the sample program shown above, return
    0 is necessary. Otherwise, you will get an error. You can omit the return statement
    if you use int main ( ) or void main ( ) instead of main ( ). If you do not want
    to experience any issues, it is best to just use a return statement in all of
    your programs.


