    # Compilers


    ![image](d2d_images/chapter_title_below.png)


    A compiler is basically a program that translates a high-level language into another
    language, whether it is machine-specific or assembly. It also translates source
    codes or plain texts into object codes, which usually come in a form that is ideal
    for processing by linkers and other programs. Most programmers aim to translate
    their source code so that they can come up with an executable or working program.


    When the compiler is done translating the source codes into object codes, the
    objects must be linked to the executable. You can do this by using a linker, which
    is a type of program. More often than not, the link stage and the compile stage
    are automatically performed. Then again, you have the option to perform the stages
    individually.


    There are a lot of compilers available on the market today. Some of them are operating
    system specific, while others can be used on a variety of platforms.


    GNU Compilers


    The GNU Compiler Collection ( GCC ) features front ends for the C language as
    well as C++ and Objective – C and their respective libraries. The GCC may be used
    on various platforms. Nonetheless, it is most commonly used on Linux and UNIX.


    If you wish to use the GCC on your windows machine, see to it that you check out
    Cygwin first. Do not worry because you are not restricted to installing a Windows
    partition alone. You may also use a Linux partition. Then again, keep in mind
    that it is strongly recommended for you to use Ubuntu distribution.


    There are so many text editors you can find on the Internet. As the programmer,
    you are free to use any text editor you want to write your codes. Once you have
    finished your program, you may use the command below. This command will compile
    your program in the C language:


    # gcc - o < name of output > < your - source.c >


    ––––––––


