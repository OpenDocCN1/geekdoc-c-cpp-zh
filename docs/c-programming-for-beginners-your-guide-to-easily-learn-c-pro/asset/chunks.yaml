  raw: '![image](d2d_images/chapter_title_below.png)


    Statements


    A program is basically a series of commands that are run according to a sequence.
    In the C programming language, the statements control the execution of the sequence.
    It also does the following: evaluate the expressions or even do nothing at all.
    The null statement is an example. All statements, including the null statement,
    have to end with a semicolon.


    w = x + y ;


    In the example shown above, you can tell that “the value of the sum of x and y
    is assigned to w.” Take note that this is not the same as in algebra wherein you
    read it as w equals x + y. In the C programming language, the assignment operators
    assign whatever elements are on the right with whatever elements are on the left.


    Expressions


    Expressions return values. They are also statements that you see in a program.
    You have to consider the following example:


    PI    // It is a float const that returns the value 3.14


    3.2    // It returns the value 3.2


    SecondsPerMinute  // It is an inst const that returns the value 60


    In the above given example, PI is a constant that is equivalent to 3.14 while
    SecondsPerMinute is another constant that is equivalent to 60. These three statements
    are all expressions.


    y = w + d ;


    The above sample code is also an expression. It adds w and d, as well as allocates
    the resulting value to y. It also returns the value of the assignment.


    w = d = x + y;


    As you can see in the above given code, it is evaluated from x to y.  The resulting
    value is then assigned to d, which in turn is assigned to w. If w, d, x, and y
    are integers, and x has a value of 3 while y has a value of 7, both w and d will
    be assigned with the value of 10.


    Keep in mind that your program has to store the data that it uses. Constants and
    variables have different ways of representing and manipulating data.


    Defining Variables


    The variable is the place where you put the information of your program. It is
    located in the memory of your computer. You can use it to store values that you
    can retrieve later on. This is great because you do not have to use a new variable
    every time.


    The name of your variable is known as a label. For instance, you can use the variable
    name myVariableName. How many memory addresses there are depends on how big your
    variable name is.


    Then, there is the RAM. It stands for random access memory. Every time you run
    a program, it gets loaded from disk to RAM. Every variable is also made in the
    RAM. In programming, the term memory is typically used to refer to the RAM of
    a computer.


    ––––––––


    ![image](d2d_images/scene_break.png)


    Setting the Memory Aside


    Before you start defining variables, you have to make sure that your compiler
    knows about this huge change. You have to inform it with regard to the type of
    variable used. You have to state if it is an integer or a character. Keep in mind
    that this information becomes the basis for determining how much room you have
    to reserve and what type of value you can use to store your variable in.


    The type of variable that you use tells your compiler how much memory it has to
    reserve for such variable. Because the modern computers that people have today
    make use of bytes and bits when it comes to representing values, and since memory
    is usually measured in bytes, you have to take note of these concepts very carefully.


    Integer Sizes


    Every type of variable takes up a specific room amount. For example, an integer
    may be three bytes on a certain machine and three on another, but never changes
    when it is on either computer.


    You can use the variable char to hold or store characters. Usually, it is a byte
    long while a short integer is a couple of bytes long. A long integer, on the other
    hand, tends to be four bytes while an integer that does not have the keywords
    long or short may be two or four bytes.


    You should also learn about character, which takes up a byte of your computer’s
    memory. It is usually a letter, symbol, or number.


    Signed and Unsigned Integers


    In nearly every program, you will see the word int. Integers are either signed
    or unsigned. You may need negative values at certain times, so you have to know
    what type of integer you need. Integers are generally assumed to be signed, unless
    they contain the word unsigned. This applies to both long and short integers.


    Signed integers are either positive or negative. Unsigned integers, however, are
    always positive. Unsigned short integers can handle numbers between 0 and 65,535\.
    Half of the numbers represented by signed short integers are negative. Signed
    short integers only have the capacity to represent numbers between -32,768 and
    32,767.


    Basic Variable Types


    There are other variable types in the C programming language. These variable types
    may be divided conveniently into integer variables, character variables, and floating
    point variables. Floating point variables contain values that are allowed to be
    expressed as fractions. Then again, this is only possible if they are real numbers.
    Character variables can also contain a single byte. They are typically used for
    holding the two hundred and fifty-six symbols and characters of ASCII and its
    extended character sets.


    The ASCII character set is a set of characters standardized to be used on computers.
    ASCII stands for American Standard Code for Information Interchange. Nearly every
    computer operating system in the world supports ASCII, and many of them support
    international character sets.


    The variable types typically used in programs are written as follows. You will
    see the variable type and how much memory it takes up. You will also learn about
    the types of values that these variables can store. These values can be stored
    and determined through the size of their variable types.


    ![image](d2d_images/image010.png)


    The sizes of your variables may not be exactly the same as the ones shown in the
    sample table above. Again, this can be a case-to-case basis. It depends on the
    computer and compiler that you have. If you get the same results, then the table
    applies to the compiler that you use. Otherwise, you should check out the manual
    of your compiler to see which values are held by your variable types.


    Defining Variables


    You define or create variables by stating the type, leaving at least one space,
    including its variable name, and closing it with a semicolon.  For your variable
    name, you can use any letters. You can combine uppercase with lowercase letters.
    You can use numbers and then combine them with letters for your variable name.
    However, you should never include a space in your variables.


    For example, w, Wilson, W1lsoN, and wilsonn are all legitimate variable names.
    Even if they have the same letters and number of characters, they are still considered
    to be different from one another. Also, even if you can use any variable name
    you want, make sure that you choose something that is beneficial to your program.
    You can choose a variable name that tells you and your readers what the program
    is about. For instance, if you are using an integer variable named myAge : , you
    can write it this way:


    int myAge ;


    A rule of thumb is to avoid using nonsense names such as haFihDR93. You cannot
    make any sense of it. It is just composed of random letters and numbers. It is
    hard to read and remember. In addition, you should avoid restricting your variable
    names to single letters only because they tend to cause confusion even if they
    are legitimate.


    As much as possible, you should use variable names that already give a clue as
    to what the program is about. People should know what the program does even before
    they read the entire code or run the program. Expressive names like myAge, SpeedLimit,
    and howMany are all easy to understand and direct to the point. When you see these
    variable names, the first thing that comes to your mind may be to find out the
    age, speed limit, or number of a particular object in the program.'
