    that the operand ( z < y ) is equivalent to 0, which is false.


    You can also see that ( x = y ) || ( z < y ) results in 1 due to the fact that
    the operand ( x = y ) is equivalent to 1, which is true.


    You can also see that ( x != y ) || ( z < y ) results in 0 due to the fact that
    the operand ( x != y ) and the operand ( z < y ) are both equivalent to 0, which
    is false.


    You can also see that !( x != y ) results in 1 due to the fact that the operand
    ( x != y ) is equivalent to 0, which is false. Thus, the operand !( x != y ) is
    equivalent to 1, which is true.


    You can also see that the operand !( x == y ) results in 0 due to the fact that
    the operand ( x == y ) is equivalent to 1, which is true. Thus, the operand !(
    x == y ) is equivalent to 0, which is false.


    You know, in the C language, there are other operators that you may have not yet
    heard about.


    Comma Operator


    This operator is used to connect expressions that are related to one another.
    To help you understand the concept of this operator further, you have to take
    a look at the following sample code:


    int a , c = 3 , d ;


    SizeOf Operator


    This operator is a unary operator that returns the data size, such as that of
    variables, constants, arrays, and structures among others. To understand the concept
    of this operator further, you have to take a look at the following sample program:


    ![image](d2d_images/image002.png)


    When you run the above given sample program, you will obtain the following output:


    The size of the int is 4 bytes


    The size of the float is 4 bytes


    The size of the double is 8 bytes


    The size of the char is 1 byte


    The size of the integer type array that has 10 elements is 40 bytes


    Ternary Operator / Conditional Operator


    This operator is a conditional operator. It is used for three operands. When you
    use this operator, you have to use the characters ( ?: ).


    The syntax of a conditional operator is as follows:


    conditionalExpression ? expression 1 : expression2


    The first expression, which in the above given example is conditionalExpression,
    gets evaluated first. If it is true, it gets evaluated to 1\. If it is false,
    it gets evaluated to 0.


    If the expression conditionalExpression is found to be true, expression1 gets
    evaluated. However, if the same expression is found to be false, expression2 gets
    evaluated.


    To help you understand the concept of conditional operators further, you have
    to take a look at the following sample program:


