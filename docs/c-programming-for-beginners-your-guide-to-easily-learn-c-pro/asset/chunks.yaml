    # Introduction:


    ![image](d2d_images/chapter_title_below.png)


    In this day and age, nearly everyone has a computer and has access to the Internet.
    Each day, millions of people from different parts of the world go online to do
    a variety of activities, such as shopping, banking, downloading and sending data,
    reading and acquiring new information, doing online work, and communicating with
    other people.


    When you go online, you see lots of different websites with different functionalities.
    Whatever your purpose for going to the Internet is, you will not be able to do
    it without using the program the Web developer or programmer has made. If you
    want to use and download an application, play a game, or perform an online task,
    you also need to use the program developed by the programmer.


    Ubiquity of a Programming Language


    With this being said, you can expect to see the C programming language live in
    action. In fact, this programming language is not only used online. It is also
    used in a variety of applications offline. The C language is widely popular and
    preferred by a lot of users because of its many advantages. It even beats other
    newer programming languages.


    The C language is used for operating systems, assemblers, language compilers,
    text editors, network drivers, print spoolers, modern programs, language interpreters,
    data bases, and various utilities.


    You may even be surprised to find out that many of the applications you see and
    use today are based on the C language. For example, the Linux kernel was created
    using this programming language. Microsoft Windows also uses the NT kernel that
    was created with C and Assembly. In essence, every program that runs on Windows
    interact with the Windows API, which is actually an API based on the C language.


    What’s more, Android, Windows Phone, OSX, iOS, FreeBSD, and OpenBSD all use the
    C language at the core level of their architecture. This programming language
    is actually the most highly recommended system programming language.


    A lot of operating systems are created using the C language. So, this means that
    each and every one of them provides an API that you can use to create platform-specific
    applications. Furthermore, a lot of embedded devices make use of the C language.
    It is also used to create interpreters.


    Discovering the Expert’s Tool of Choice


    This programming language is chosen as the development language of many for certain
    reasons. For starters, it is the development language that programmers prefer
    for their operating systems such as Unix platforms as well as their variants.
    The C language is also chosen due to its low-level integration. So, if you want
    to inline an assembler, you can use this programming language to achieve your
    desired results.


    Moreover, the C language is chosen by many programmers because of its cross-platform
    qualities. In fact, you can use it to create platform-independent codes. Then
    again, this may have been largely superseded by the Java programming language.


    Nevertheless, the C language is still admired by many programmers and users because
    of its raw speed. A lot of programmers still believe that the C language is the
    best high-level programming language in terms of performance and speed. Thus,
    if you are primarily concerned with the performance of your program, you have
    to go for the C language to achieve your desired results.


    Anyway, the C language is usually used along with C++. You can actually do a lot
    of things with these programming languages. You can create a wide variety of programs
    and applications. You can create systems for payroll and financial accounting,
    digital publishing, digital artwork and designs, COBOL converters, digital libraries,
    computerized displays, variable printing, application testing, RFID readers, and
    manufacturing resource planning.


    An Ideal Reference for All Skill Levels


    If you are in search of a material or reference that you can use to learn the
    C language, this book is highly recommended. It is perfect if you have to learn
    the programming language in the shortest amount of time possible. While it will
    not make you an instant expert, it will feed you with the basics that you need
    to go along with the learning process.


    This book contains detailed information with regard to the C language and how
    you can create programs using it. It is carefully written in a way that everyone
    can easily understand and relate to. Names and terms are also explained so that
    you will not get lost when reading the book. So, even if you do not have any previous
    experience with computer programming, you will not experience headaches reading
    this.


    This book is also designed for software programmers who want to learn the C programming
    language from scratch. It provides you with adequate understanding on the programming
    language. From there, you can bring yourself towards a higher level of expertise.
    While you are not really required to have any previous experience with computer
    programming, you still need to have a basic understanding of the terms commonly
    used in programming and computers.


    You see, the C language is one of the most recommended computer programming languages
    for beginners. After all, it is a predecessor to many of the modern programming
    languages used today, such as Java and Python. In other words, before you can
    effectively learn these languages, you have to have a clear understanding of the
    C language first.


    Through this book, you will learn how to write your first programs and see how
    they work in real time. You have to keep in mind that it is perfectly okay to
    make mistakes every now and then. It is through these mistakes that you learn.
    So, when you encounter an error on your program, you just have to study the part
    where you went wrong and redo it. When you run the programs in the C language,
    you will be notified in case you made a mistake. You will see the error and know
    which line you have to modify.


    This book features Frequently Asked Questions (FAQ) sections that are written
    with beginners like you in mind. The author understands that beginners may have
    certain questions with regard to the elements of C that are not often discussed
    in books.'
