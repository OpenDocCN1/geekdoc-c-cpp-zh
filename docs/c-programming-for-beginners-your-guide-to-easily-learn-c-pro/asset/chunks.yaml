    ![image](d2d_images/chapter_title_above.png)


    # Statements


    ![image](d2d_images/chapter_title_below.png)


    The execution of a program is controlled by statements. An execution is called
    an iteration. In general, there are three statements used for looping: for, while,
    and do.


    The For Statement


    It allows you to repeat compound statements or statements for a certain duration.
    Its body is executed at least zero times and continues until the optional condition
    is found to be false. If you want to change and initialize values during your
    execution of your for statement, you may use optional expressions.


    The syntax of the for statement is as follows:


    for ( init – expressionopt ; cond – expressionopt ; loop – expressionopt ) statement


    The execution of the for statement is done through the following steps:


    If there is an init – expression, it gets evaluated in order for it to specify
    the initialization of the loop. A type of the init – expression does not have
    any restrictions.


    If there is a cond – expression, it gets evaluated. It needs to have a pointer
    or arithmetic type. It also has to be evaluated right before every iteration.
    If you do that, you can achieve any of the following results:


    If the cond – expression is found to be true or non-zero, then the statement gets
    executed. If there is a loop – expression, it gets evaluated. This loop – expression
    gets evaluated after every iteration. Keep in mind that this type does not have
    any restrictions. The side effects generally take place in a certain order. Then,
    the process will start once more alone with evaluation of the cond – expression.


    In case the cond – expression gets skipped, then this cond – expression will be
    regarded as true. The execution will then continue. You have to take note that
    a for statement that does not have any cond – expression argument only terminates
    when a return or break statement within a statement body gets executed. The same
    thing happens when goto gets executed.


    In case the cond – expression is found to be false or zero, the execution of for
    statement is terminated and the control is passed on towards the following program
    statement.


    You have to keep in mind that the for statement can also be terminated when a
    return, break, or goto statement in your statement body gets executed.


    In the for loop, the loop – expression is evaluated when there is a continue statement
    involved. If the break statement inside the for loop is executed, the loop – expression
    does not get executed or evaluated. The statement for ( ; ; ) is actually a traditional
    way to come up with the infinite loop. You can only terminate this loop with the
    use of a return, break, or goto statement.


    In order for you to understand this concept better, you have to take a look at
    the following example:


    ![image](d2d_images/image004.png)


    When you run the above given sample program, you will obtain the following output:


    The number of spaces is 4


    The number of spaces is 2


    The While Statement


    It allows you to repeat the statement until the specified expression turns out
    to be false. This statement has the following syntax:


    The iteration statement:


    while ( expression ) statement


    Keep in mind that your expression has to have a pointer or arithmetic type. When
    everything is ready, your program will be executed through the following steps:


    The expression gets evaluated first. If it is found to be false, then the body
    of the white statement does not execute. Instead, the control is passed from the
    while statement towards the next statement in your program. In case the expression
    is found to be true, which is represented by a non-zero, the statement body gets
    executed. The same process that was done before occurs once more.


    You have to keep in mind that the while statement may also be terminated if a
    return, break, or goto gets executed within the body of the statement.


    You have to make use of the continue statement if you want to end an iteration
    without needing to exit your while loop. Then, the continue statement passes the
    control towards the next iteration of your while statement.


    In order for you to understand this concept further, you have to take a look at
    the following example:


    while ( i >= 0 )


    {


    string1 [ i ] = string2 [ i ] ;


    i - - ;


    }


    As you can see in the above given example, the characters from the string2 to
    the string1 are copied. So, if i is found to be greater than or equal to the value
    of 0, the value of string2 [ i ] gets allocated to string1 [ i ] and then i gets
    decremented. If i reaches or goes below 0, the execution of the statement is terminated.


    The Do Statement


    It keeps on executing until the condition is found to be false. This statement
    has the following syntax:


    do statement while ( expression ) ;'
