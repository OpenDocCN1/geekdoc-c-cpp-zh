- fmt: "\n# B语言和C语言的起源\n\nB语言由肯·汤普森在20世纪60年代末开发。当时，计算机代码主要用汇编代码编写。因此，一个人每次想完成特定任务时，都必须写好几页的代码。\n\
    \n由于B是一种高级编程语言，它为这个问题提供了解决方案。用户不再需要编写多页代码，因为只需写几行就能完成任务。显然更快速、也更便捷地写出了这几行逻辑。\n\
    \n后来B被用于UNIX的开发中因其的高级特性使得用户可以轻松快速地编码却不浪费过多时间然而即使看似拥有诸多优势它也存在很多缺点比如不知道数据类型所以程序员不得不将所有内容都通过机器字来表达同时缺乏结构这也给广大使用者带来了很大的困扰为了解决这些问题丹尼斯-里奇于1970年代初将原先的内容转换为新的名为优化的选择题除了保留大量原有语法之外还成功添加了数据类型等关键功能最终呈现出的结果是惊人的：符合操作系统所需的所有特征兼具高等级功用因为这个缘故许多最初建立在旧版本之上的构成部分都已经改为使用版本来重新实现尤其是其内核在一九七三年就已经迁移到了\
    \ DEC PDP 11上现在有关这一新体系的全部资料都可以在《程序设计》一书中的描述看到此书是由搭档合作完成的其中一人还创造了世界上著名的 Hello World\
    \ 程序及 UNIX系统中的其他多种实例首版的这部作品成为了后续众多相关书籍的基础更是该门学科公认的标准（即ANSI C）标准美国国家标准协会(AAA)成立了专门委员会并于一九八八年正式确定了定稿这份副本只对原始设计进行了极其微小的改动毕竟必须要确保旧有能在新版下正常工作之后国际标准化组织也通过了这项虽然其实应当称为但现在大家还是习惯叫做\
    \  \n\n## 使用C的优势  \n可供选择的不同编成词汇库有很多各自独有的特点那么为何要倾向于支持什么呢？凡是用会运行得非常迅速如果你向往丰富的话完全可以选择更为新颖如\
    \ Java或Python但追求速度就应该采纳相比而言由于处理机占用较少性能自然更好此外还能直接操弄硬件这是多数高层级并不具有的一点对于初学者来说则是实实在在的红利能更有成效地上手学习；而自带范例又具备极佳的便携性你无需反复撰写同一个一旦在自己的电脑——无论装了什么系统创制首先可以再到另一安装不同系统的环境内编译而不出现任何不必要的差异例如拿\
    \ Windows7写成可以在苹果 OS中得到一模一样的结果每个段落都能存储下来留待后用这种概念称作模块化能把类似输出显示需求的难题交给stdlib来解决职能：【printf()】进而能够适用于各类目标即便作为最为古老的种类之一仍有大批开发者钟情可用作诸如照片编辑与嵌入式驱动数据库编译器网络打印机后台监控乃至整体OS也在覆盖范围内堪称万物皆当而且它是静态类型的运行时变量值不被审核而是在翻译阶段完善故此错误得以更快捕获助力顺畅软件开发另外也比那种动态型语速稍快学会它能让你深刻理解真实计算细节涉及内存分配管理以及架构知识数列指向底层机制学之前须明白读罢才可通晓\
