  raw: 'The B language was developed by Ken Thompson in the late 1960s. During that
    time, computer codes were mainly written in assembly codes. So, each time a person
    wants to do a certain task, he has to write several pages of codes.


    Since the B language was a high-level programming language, it provided a solution
    to this problem. Users no longer have to write several pages of code because they
    can simply write a few lines to complete their tasks. Writing a few lines of codes
    is definitely faster and more convenient.


    The B language was further used for the development of UNIX. Due to its high level
    characteristics, users can easily write codes without wasting a lot of time. Then
    again, even though the B language seems to have a lot of advantages, it also has
    several disadvantages.


    For instance, the B language did not know about data types. Programmers had to
    express everything in codes or machine words. In addition, the B language did
    not have structures. This became a problem for a lot of users.


    So, Dennis Ritchie developed the C language in order to provide a solution to
    these problems. In the early 1970s, he converted the B language into the C language.
    He kept a lot of the syntax of the B language in their original form, but he added
    data types among other features.


    The result was amazing. The C language had a high-level functionality and had
    the features necessary to program operating systems. Because of this, a lot of
    the components found in UNIX were rewritten using the C language. In fact, the
    UNIX kernel was rewritten on DEC PDP-11 in 1973.


    Today, you can read all about the C language in the book entitled The C Programming
    Language. It was written by Ritchie and Kernighan. Kernighan made the world famous
    Hello World program as well as a lot of other programs in UNIX.


    The first edition of The C Programming Language became the basis for many other
    books on the programming language. It actually became the standard of the C language.
    A committee was created by the American National Standards Institute (ANSI) in
    1983\. The objective of this committee was to create an up-to-date definition
    for the C language. By 1988, they were able to create the final standard definition
    of the language, which was called the ANSI C.


    This final standard only had minor changes on the C language’s original design
    because the old programs still had to work on the new standard. Then, the International
    Standards Organization (ISO) eventually adopted the ANSI C standard. Even though
    the standard should now be called ISO C, people are still used to calling it ANSI
    C.


    Advantages of Using the C Language


    There are a variety of computer programming languages you can choose from. Each
    one is unique in its own way. So, why should you go for the C language?


    Programs written in C are fast.


    You can go for newer programming languages such as Java and Python if you want
    to see a lot of features. However, if you want a C program that is fast, you should
    go for C. Its performance is still better due to the fact that it has less processing
    time.


    Also, the C language allows for the direct manipulation of its hardware, which
    many high level programming languages do not offer. If you are a beginner, this
    is a huge advantage for you since you will be able to learn programming faster.


    The standard programs are portable.


    There is no need for you to write your program over and over. Once you write a
    program on your computer, regardless of what operating system it has installed,
    you can compile it on another computer with a different operating system. For
    example, if you write it using Windows 7, you can compile it using Mac OS. The
    program will stay exactly the same. There would not be any unnecessary or unwanted
    changes.


    Code sections can be stored for later use.


    The concept of storing C code sections in libraries for later use is called modularity.
    These libraries are powerful. They can solve problems. For example, if you have
    to display an output, you can use the stdio.h library so you can use the printf
    ( ) function.


    C can be used for a variety of purposes.


    Even though it is one of the oldest programming languages, it is still preferred
    by a lot of programmers. It can be used for various applications, such as photo
    editing and system programming. It can also be used for embedded systems, databases,
    compilers, network drivers, print spoolers, and operating systems.


    C is statically typed.


    When you run a program in C, the variable type is not checked during run time.
    Instead, it is checked during compile time. Because of this, errors are quickly
    detected. Thus, you can develop your software with ease. In addition, a statically-typed
    language is faster than a dynamically-typed language.


    C lets you understand how computers work.


    When you learn the C language, you will not merely learn about programming, but
    you will also learn about the functionality of computers. For instance, you will
    be able to learn about memory allocation and management. You will also learn about
    computer architecture.


    C precedes Python.


    If you want to learn Python, which is also a great programming language for creating
    applications, you have to realize that learning C is necessary for learning Python.
    You will not be able to grasp Python interpreters if you do not know how to write
    and read C programs.


    C is the basis for many other programming languages.


    Python is not the only programming language that is related to C. C++, C#, and
    Java are also related to it. In fact, C++ is regarded as the superset of C. The
    syntax of PHP and JavaScript are also similar to that of C. So, if you become
    adept at writing programs in C, you will not have a hard time transitioning to
    these other programming languages.


    Downsides to Using the C Language


    Despite being the popular choice that it is, C isn’t perfect. It does come with
    downsides that, while possibly minor for those simply curious or just beginning
    their programming pursuits, should be carefully taken into account by intermediate
    and advanced programmers.


    C isn’t capable of doing runtime checks by itself.


    Runtime checking is quite an important feature as it immediately detects issues
    that occur when an application is run.


    While someone with sufficient knowledge in the programming language shouldn’t
    have much difficulty pinpointing problems that occur during runtime, having an
    internal mechanism that automatically checks for such defects would still prove
    to be advantageous – especially in minimizing the time needed to have a working
    program.


    C doesn’t support object-oriented programming.


    Object-oriented programming (OOP) focuses on five key concepts: data abstraction,
    modularity, encapsulation, polymorphism, and inheritance. These make it possible
    to write applications that are easy to understand, manage, and maintain. OOP is
    innate to the C++ programming language and was mainly developed to overcome the
    limitations of–you’ve guessed it–the C programming language. 


    There’s no variable type-checking in C.


    When you’ve been writing an application for quite some time, you lose track of
    the types of certain variables. Unfortunately, given the age of the C programming
    language, it doesn’t support variable type-checking – in other words, you’re expected
    to keep track of such details on your own. If you fail to properly identify a
    particular variable for example, then the blame’s entirely on you.


    It should be pointed out, however, that some C enthusiasts are claiming that their
    favorite language, in its latest iteration (C11), finally supports type-checking
    albeit through a workaround.


    Anything and everything can be done in C.'
