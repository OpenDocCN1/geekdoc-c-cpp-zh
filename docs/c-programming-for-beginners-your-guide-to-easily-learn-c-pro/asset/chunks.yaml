  raw: 'Yes, it is. Thus, you have to be careful with your use of uppercase and lowercase
    letters. For example, the words “Hello World”, “hello world”, and “HELLO WORLD”
    are all considered different in C. They may contain the same letters of the alphabet,
    but they are different in terms of their use of uppercase and lowercase letters.
    So, they would be read differently.


    Who is the father of the C language?


    Dennis MacAlistair Ritchie is the father of the C language. He was an American
    computer scientist who created the programming language.


    Where did the C language get its name?


    It was inspired by the B language, where it got many of its features.


    The B language was developed by Dennis Ritchie, who also developed the C language,
    and Ken Thompson in the late 1960’s. It was derived from the Basic Combined Programming
    Language (BCPL), which is a structured, procedural, and imperative programming
    language.


    What is the difference between int main ( ) and void main ( )?


    When you use int main ( ) , you have to end the program with a return 0 or the
    appropriate value. If you use void main ( ) , you will be able to skip a line.


    Do you have to use return 0 all the time?


    No. You can also use return 1, depending on your program. The return value generally
    indicates how your program should exit. The value 0 represents a normal exit for
    the function main ( ).


    What is the difference between return and exit?


    Return is used to exit from the function. Exit, on the other hand, is used to
    exit from the program.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Fundamentals


    ![image](d2d_images/chapter_title_below.png)


    In this chapter of the book, you will learn about the basic elements of the C
    language.


    Operators


    In the C language, constants and variables are operated or controlled by the operators.
    The basic operators are generally the same as arithmetic operators.


    The arithmetic operators include the plus sign ( + ) for performing addition,
    the asterisk ( * ) for performing multiplication, the minus sign ( - ) for performing
    subtraction, the forward slash symbol ( / ) for performing division, the percentage
    sign or the modulus (% ) for finding the remainder, and the equal sign ( = ) for
    assigning expressions.


    There are also other operators used for additional tasks. For instance, the iostream
    header lets you use the insertion operator ( << ) if you want a certain output
    to be processed. You can also access other operators even if you do not use the
    #include directive. The basic operators are classified under comparison operators,
    increment and decrement operators, logical operators, and compound assignment
    operators.


    Variable Declaration


    Before you include variables in your operations, see to it that you declare them
    first. You also have to indicate their values. When you declare a variable, see
    to it that you use the following syntax:


    type variable ;


    See to it that you do not forget to specify the data type. You have to specify
    it, just like you do when you initialize functions. Thus, if you want to declare
    w as an integer variable type, you have to initialize it. You have to type the
    following:


    int w ;


    Once you have declared the integer w, you can allocate a specific value to it.
    You have to use the assign operator ( = ) to do this process. For example, if
    you want to assign the value 10 to the variable w, you should write the following:


    w = 10 ;


    You should always make sure that you declare the variable prior to assigning a
    value into it. Likewise, you have to declare your variable and allocate a value
    into it by using a single line. Take a look at the following example:


    int w = 10 ;


    Aside from using these expressions for your program, you may also want to consider
    using operators.


    Increment and Decrement Operators


    The increment operator consists of two plus signs ( ++ ). The decrement operator
    consists of two minus signs ( - - ). The primary purpose of these operators is
    to make the expression of adding and subtracting 1 from the variable faster. It
    becomes shorter so that you can save space in your program. You will also spend
    less time and energy when writing your code. For example, you can write the following
    statement:


    if w = 4 , then + + w must be equal to 5 while - - w must be equal to 3.


    As the programmer, you can include the increment and decrement operators as either
    a suffix or a prefix in your program. This is useful and practical if you want
    to identify the values of two or more variables.


    Then again, you have to keep in mind that when you use the increment and decrement
    operators as suffices ( x++ or x - - ), the original value of x prior to the addition
    or subtraction of 1 would be denoted. If you run the operators on their own, both
    the x++ and the ++x would have a similar meaning. Conversely, if you use it in
    setting other variables, you would see their obvious differences.


    a = 5 ;


    b = ++a ;


    As you can see in the example shown above, the value of b is determined only after
    the value of a is raised. Thus, the value of b eventually becomes 6.


    a = 5 ;


    b = a++ ;


    Still using the same example shown above, you can see that the value of b is determined
    before the value of a is increased. Thus, the value of b eventually becomes 6.


    Compound Assignment Operators


    Aside from the standard assignment operator ( = ) and the basic arithmetic operators,
    you can also use compound assignment operators to perform operations before you
    assign values in your program. These operators are shortened versions of the usual
    expressions involved in basic arithmetic operators.


    x + = 1 ;  // It is practically the same as the expression x = x + 1 ;


    x - = 1 ;  // It is practically the same as the expression x = x – 1 ;


    x * = y ;  // It is practically the same as the expression x = x * y ;


    x /= y ;    // It is practically the same as the expression x = x / y ;


    Arithmetic Operators


    | Operators | Descriptions |


    | Addition ( + ) | It adds the operands. |


    | Subtraction ( - ) | It subtracts the second operand from the previous one. |


    | Multiplication ( * ) | It multiples both operands. |


    | Division ( / ) | Divides operands (first by second) |


    | Modulus ( % ) | It divides the first operand by the second operand and returns
    the remainder |


    | Increment Operator ( ++ ) | It increases the integer value by one. |


    | Decrement Operator( - - ) | It decreases the integer value by one. |


    Assignment Operators


    ![image](d2d_images/image009.png)


    Relational Operators


    | Operators | Descriptions |


    | == | It verifies if the values are equal. |


    | != | It verifies if the values are not equal. |


    | > | It verifies if the value of the first is greater than that of the second.
    |


    | < | It verifies if the value of the first is less than that of the second. |


    | >= | It verifies if the value of the first is greater than or equal to that
    of the second. |


    | <= | It verifies if the value of the first is less than or equal to that of
    the second. |


    ––––––––


    ![image](d2d_images/scene_break.png)


    Logical Operators


    | Operators | Descriptions |


    | && | It is the logical AND operator. In the event that both operands are non-zero,
    the condition is true. |


    | &#124;&#124; | It is the logical OR operator. In case one of two operands is
    non-zero, the condition is true. |


    | ! | It is the logical NOT operator. It reverses the operand’s logical state.
    In case the condition is found to be true, this operator makes it false. |


    Bitwise Operators


    | Operators | Descriptions |


    | & ( binary AND ) | It copies the bit if it is present in both operands. |


    | &#124; ( binary OR ) | It copies the bit if it is present in either operand.
    |


    | ^ ( binary XOR ) | It copies the bit if it is present in one operand, but not
    both. |


    | ~ ( binary ones complement ) | It flips bits. |'
