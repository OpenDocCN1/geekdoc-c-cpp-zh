  raw: '*   You have to use a constant expression of the same data type as the variable
    of the switch. It also has to be either a literal or a constant.


    *   In case the variable you switch on is equal to a case, the rest of the statements
    that follow it have to be executed until your program reaches a break statement.


    *   When your program finally reaches a break statement, it will terminate the
    switch. Then, the control flow moves on to the next line that follows your switch
    statement.


    *   There is no need for you to include a break in all of your codes or programs.
    If you do not see any break in the program, it means that the control flow continues
    to the next cases until the program reaches a break statement.


    *   You can use a default case in your switch statement. Since it is optional,
    you can just skip using it. Then again, if you ever decide to use it, make sure
    that you place it at the end of your switch.


