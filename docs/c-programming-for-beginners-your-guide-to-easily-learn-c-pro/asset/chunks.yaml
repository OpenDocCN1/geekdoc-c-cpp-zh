    # Comments


    ![image](d2d_images/chapter_title_below.png)


    Writing a program requires you to be careful and articulate. You need to make
    sure that your program is both executable and aesthetically pleasing. A messy
    program does not only cause errors, but it also results in confusion. For example,
    if you have been working on a particular program for so long, you may tend to
    forget some details. Thus, taking down notes is necessary.


    The comments in programs seem to be nothing but unnecessary lines. However, they
    are actually necessary because they help bring clarity and organization to your
    program. Without them, your program may be unclear and confusing.


    If a long time has passed since you last touched your program, you may forget
    some details. So, you need to include comments to help you stay on the right track
    and make your program presentable to other programmers or readers. The comments
    in C are merely texts that your system ignores. You can write anything in your
    comments sections.


    Types of Comments


    In general, the comments used in the C programming language are divided into two
    categories: double – slash ( // ) and slash – star ( /* ) .


    Double – slash comments, also known as C - style comments, tell your compiler
    to refrain from minding the things that follow them. Whatever you write after
    this comment, the compiler ignores. This process continues until it reaches the
    end of that particular line.


    Slash – star comments, also known as C – style comments, tell your compiler to
    refrain from reading the things that follow them. The lines of text you write
    after the star – slash ( */ ) comment mark is not read by your computer. Always
    remember that each /* has to be paired with a closing */ .


    In the C language, the C – style comment is also used. However, the C - style
    comment is not really a part of it. A lot of C programmers actually prefer to
    use the C - style comment in their work and only turn to the C – style comment
    to block out huge blocks in their program.


    Using Comments


    You can basically write comments all over your program. These comments can be
    anywhere. They are literally ignored by the compiler, so they will not do any
    harm to your program. Just make sure that you write your comments correctly. Do
    not be confused with the double – slash and the slash – star comments.


    As a programmer, you are advised to put comments at the start of your programs
    so that you can clearly define what these programs do. The moment you read your
    program, you should immediately be able to tell what its purpose is. You should
    also be informed about its author, the date it was created, and even the time
    if that is included. You should also know about the functions used in the program.


    Furthermore, statements in the program that are not that obvious must include
    comments so they can be noticed more easily. When you run your code, the process
    and the output stay the same. As you have learned, comments are pretty harmless.


    Comments Seen at the Top of Every File


    Ideally, you should include a comment block at the start of each file you make.
    Their style depends on your personal preference and/or requirements for the program.
    Nevertheless, you have to make sure that your headers include the necessary elements.


    It has to include the name of your program or function as well as the name of
    the file. You also have to include the purpose of your program or function, plus
    a description or summary that explains how your program works.


    In addition, you have to include your name but only if you are the author of the
    program. If there are any revisions made on the program, you have to include them
    as well. A history of these revisions, including the notes that you made on the
    changes, have to be included.


    Furthermore, it has to include the liners, compilers, and other tools you used
    to create your program. If you have any other additional notes, you have to include
    them as well.


    It is very important to keep descriptions and notes up to date. A lot of beginner
    programmers, and even advanced programmers, make the mistake of ignoring the comments
    section once they are done with their programs. They think that it is okay to
    leave the comments since the program is already working.


    Once you complete your program, see to it that you still check their headers.
    Otherwise, your program can become misleading over time. Your readers can get
    confused because they are not aware that the headers are not up to date.


    You have to keep in mind that comments can serve as invaluable guidelines to your
    overall program if only they are properly written and maintained. See to it that
    you check your program every now and then to update its header.


    The // Comment versus the /* Style comment


    When it comes to writing comments, you can choose between these two. The double
    – slash comment ( // ) expires by the end of the line while the slash – star (
    /* ) comment stays in effect until the closing comment ( */ ) is reached. The
    slash – star comment cannot be terminated easily. Even when it reaches the end
    of the line, it may still continue until you place a closing comment mark. If
    you do not put this particular comment mark, you will encounter a compile – time
    error.


    Bad Comments versus Good Comments


    It should not really be difficult for you to tell apart bad comments from good
    comments. It is merely like telling a good fruit apart from a bad fruit.


    A bad comment merely says the function of the code. It states what is already
    obvious. Even if you remove it, your program will still be the same. You can immediately
    tell if the comment is bad when you read the line of code and you already know
    what it is about. You may have understood what it is, what it does, and why it
    does it – yet it has a very minor effect on the program.


    A good comment tells you why the code does whatever it does. It gives you a detailed
    explanation on why the program functions this way. It also explains what that
    particular code section is all about.


