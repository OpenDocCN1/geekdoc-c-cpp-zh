  trans: "\n\n是的，确实如此。因此，你必须小心使用大写和小写字母。例如，“Hello World”、“hello world”和“HELLO WORLD”在\
    \ C 语言中都被视为不同的标识符。它们可能包含相同的字母表字母，但在大小写的使用上是不同的，因此会被区别对待。\n\n谁是 C 语言之父？\n\n`Dennis\
    \ MacAlistair Ritchie`是 C 语言的父亲。他是一位美国计算机科学家，创造了这门编程语言。\n\nC 语言的名字从何而来？\n\n它的名字受到了\
    \ B 语言的启发并从中获得了许多特性。\n\nB 语言由丹尼斯·里奇（他也是后来开发了 C 的人）和肯·汤普森在 20 世纪 60 年代末共同开发而成；它源自基本组合编程语\
    \ (`BCPL`) ，这是一种结构化、面向过程且命令式的变成范型之一 。\n\n什么是 `int main()`  与 `void main()`的区别?\n\
    \n当你在程序中使用 “mian（）返回类型指定为整形”（即：写成 \" type: Int MathFunctionName(void)\"形式时），必须让该函数最终通过诸如：“\
    \ return Zero; ”之类语句来结束整个代码逻辑流！但如果将主控点阵定义为无返回值版本(也就是所谓的 “空类型”)那么就可以省略这条结尾行.\n\n\
    是否总是需要附加无条件终止指令 Return zero？答案当然否定——完全可根据实际需求调整成如：\"Return One\"等不同数值以表明特定退出状态码！（通常约定俗成的规则如下》）：“零值标志正常结束执行流程”；只承担入口角色的特殊方法除外）\n\
    \n‘返回’动作仅作用于当前调用栈内对应子例程完成跳出行为 ；而 'ystemExit ’则直接导致进程彻底中止离开运行环境！\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
