  raw: '| << ( binary left shift ) | It moves the value of the left operand towards
    the left based on the number of bits assigned by the right operand. |


    | >> ( binary right shift ) | It moves the value of the left operand towards the
    right based on the number of bits assigned by the right operand. |


    ––––––––


    ![image](d2d_images/scene_break.png)


    To help you understand the concept of operators better, you have to take a look
    at the following examples.


    In this sample program, you will see how arithmetic operators are used.


    // This sample program shows you how arithmetic operators are used.


    #include < stdio.h >


    int main (  )


    {


    int a = 11 ,  b = 3 ,  c ;


    c = a + b ;


    printf ( “ a + b = %d \n “ , c ) ;


    c = a – b ;


    printf ( “ a – b = %d \ n “ , c ) ;


    c = a * b ;


    printf ( “ a * b = %d \ n “ , c ) ;


    c = a / b ;


    printf ( “ a / b = % d \ n “ , c ) ;


    c = a % b ;


    printf ( “ This is the remainder that you get when you divide a with b :  %d \
    n “ , c ) ;


    return 0 ;


    }


    When you run the above given sample program, you will get the following output:


    a + b = 14


    a – b = 8


    a * b = 33


    a / b = 3


    This is the remainder that you get when you divide a by b : 2


    As you can see in the output shown above, all of the operators used in the program
    performed their specific tasks, which are addition, subtraction, multiplication,
    and division respectively.


    However, if you divide 11 by 3, you will get an answer of 3.67\. This is why you
    got 3 in your output. You got this value because variable a and variable b are
    both integers. So, it is only appropriate that you also get an integer for your
    output. The compiler does not read the terms after the decimal point, and that
    is why it only displayed 3 instead of 3.67.


    Then, the modulo operator ( % ) calculates the remainder of a and b. If you divide
    11 by 3, you will get a remainder of 2\. You can use the modulo operator when
    you compute for integers alone.


    To help you understand this concept further, here is another example that you
    can check out:


    For example, you have the following variables and values in your program:


    a = 5.0


    b = 2.0


    c = 5


    d = 2


    In the C language, the following operators are used to compute for their values:


    a / b = 2.5 // You get this output because the two operands are both floating-point
    variables


    c / b = 2.5 // You get this output because one of the operands is a floating-point
    variable


    a / d = 2.5 // You get this output because one of the operands is a floating-point
    variable


    c / d = 2 // You get this output because the two operands are both integers


    In this next example, you will learn about decrement and increment operators.
    The following sample program shows you how these operators function in a program.


    // This is a sample program that demonstrates how decrement and increment operators
    work


    #include < stdio.h >


    int main ( )


    {


    int a = 10 ,  b = 100 ;


    float c = 10.5 , d = 100.5 ;


    printf ( “ ++a = %d \n “ , ++a ) ;


    printf ( “ - - b = %d \n “ , - - b ) ;


    printf ( “ ++c = %d \n “ , ++c ) ;


    printf ( “ - - d = %d \n “ , - - d ) ;


    return 0 ;


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    When you run the above given sample program, you will get the following output:


    ++a = 11


    - - b = 99


    ++c = 11.500000


    ++d = 99.500000


    As you can see in the output, the operators - - and ++ are used as prefixes. However,
    they can also be used as postfixes such as a- - and a++.


    In the C language, the increment operator ( + + ) increases the value of the variable
    by 1\. On the other hand, the decrement operator ( - - ) decreases the value of
    the variable by 1.


    To help you understand this concept further, you have to take a look at the following
    examples:


    For instance, you have a = 5\. This gives you the following values:


    ++a ;   // a turns into 6


    - - a ;   // a turns into 6


    a++ ;   // a turns into 7


    a - - ;  // a turns into 5


    So, how does using the ++ operator and the - - operator differ when they are used
    as a prefix and a postfix?


    For instance, if you use the ++ operator to serve as a prefix like in ++var, you
    get a value that is incremented by 1\. A value is then returned.


    On the other hand, if you use the ++ operator to serve as a postfix like in var++,
    you see that the original value of var gets returned first. Var is also incremented
    by 1.


    To help you understand this concept further, you have to take a look at the following
    sample program:


    #include < stdio.h >


    int main ( )


    {


    int var = 7 ;


    // The value is shown and then var gets increased to 8


    printf ( “ %d \n “ ,  var ++ ) ;


    // At first, var is equal to 8\. Then, it gets increased to 9 and is shown at
    the output


    printf ( “ %d “ , ++var ) ;


    return 0 ;


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    When you run the above given sample program, you will get the following output:


    7


    9


    In the C programming language, you will also encounter relational operators. You
    have learned about these operators earlier in this book. However, in order for
    you to understand the concept further, you have to take a look at the following
    examples.


    // This sample program shows you how arithmetic operators work


    #include < stdio.h >


    int main ( )


    {


    int x = 5 , y = 5 , z = 10 ;


    printf ( “ %d == %d = %d \n “ , x , y , x == y ) ;   // This one is true


    printf ( “ %d == %d = %d \n “ , x , z , x == z ) ;   // This one is false


    printf ( “ %d > %d = %d \n “ , x , y , x > y ) ;   // This one is false


    printf ( “ %d > %d = %d \n “ , x , z , x > z ) ;   // This one is false


    ––––––––


    ![image](d2d_images/scene_break.png)


    printf ( “ %d < %d = %d \n “ , x , y , x < y ) ;   // This one is false


    printf ( “ %d < %d = %d \n “ , x , z , x < z ) ;   // This one is true


    printf ( “ %d != %d = %d \n “ , x , y , x != y ) ;   // This one is false


    printf ( “ %d != %d = %d \n “ , x , z , x != z ) ;   // This one is true


    printf ( “ %d >= %d = %d \n “ , x , y , x >= y ) ;   // This one is true


    printf ( “ %d >= %d = %d \n “ , x , z , x >= z ) ;   // This one is false


    ––––––––


    ![image](d2d_images/scene_break.png)


    printf ( “ %d <= %d = %d \n “ , x , y , x <= y ) ;   // This one is true


    printf ( “ %d <= %d = %d \n “ , x , z , x <= z ) ;   // This one is false


    return 0 ;


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    When you run the above given sample program, you will obtain the following output:


    5 == 5 = 1


    5 == 10 = 0


    5 > 5 = 0


    5 > 10 = 0


    5 < 5 = 0


    5 < 10 = 1


    5 != 5 = 0


    5 != 10 = 1


    5 >= 5 = 1


    5 >= 10 = 0


    5 <= 5 = 1


    5 <= 10 = 1


    In the C language, logical operators are also used. In the following sample program,
    you will learn how they function.


    // This sample program shows you how logical operators work.


    #include < stdio.h >


    int main ( )


    {


    int x = 5 , y = 5 , z = 10 , result ;


    result = ( x = y ) && ( z > y ) ;


    printf ( “ ( x = y ) && ( z > y ) is equal to %d \n “ , result );


    result = ( x = y ) && ( z < y ) ;


    printf ( “ ( x = y ) && ( z < y ) is equal to %d \n “ , result );


    result = ( x = y ) || ( z < y ) ;


    printf ( “ ( x = y ) || ( z < y ) is equal to %d \n “ , result );


    result = ( x != y ) || ( z < y ) ;


    printf ( “ ( x != y ) || ( z < y ) is equal to %d \n “ , result );


    result = ! ( x != y ) ;


    printf ( “ ! ( x == y ) is equal to %d \n “ , result ) ;


    result = ! ( x == y ) ;


    printf ( “ ! ( x == y ) is equal to %d \n “ , result ) ;


    return 0 ;


    }


    ––––––––


    ![image](d2d_images/scene_break.png)


    When you run the above given sample program, you will get the following output:


    ( x = y ) && ( z > y ) is equal to 1


    ( x = y ) && ( z < y ) is equal to 0


    ( x = y ) || ( z < y ) is equal to 1


    ( x != y ) || ( z < y ) is equal to 0


    ! ( x != y ) is equal to 1


    ! ( x == y ) is equal to 0


    As you can see in the output of the sample program shown above, ( x = y ) && (
    z > 5 ) results in 1 due to the fact that the operand ( x = y ) and the operand
    ( z > y ) are both equivalent to 1, which is true.'
