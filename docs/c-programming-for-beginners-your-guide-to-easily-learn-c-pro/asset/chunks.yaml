    \ (`BCPL`) ，这是一种结构化、面向过程且命令式的变成范型之一 。\n\n什么是 `int main()`  与 `void main()的区别?\n\
    \n当你在程序中使用 “mian（）返回类型指定为整形”（即：写成 \" type: Int MathFunctionName(void)\"形式时），必须让该函数最终通过诸如：“\
    \ return Zero; ”之类语句来结束整个代码逻辑流！但如果将主控点阵定义为无返回值版本(也就是所谓的 “空类型”)那么就可以省略这条结尾行.\n\n\
