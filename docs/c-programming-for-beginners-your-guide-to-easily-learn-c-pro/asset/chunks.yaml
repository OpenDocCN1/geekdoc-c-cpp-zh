  raw: 'In the C programming language, you can dynamically allocate the memory with
    the use of standard library functions. These include malloc ( ) , free ( ) , realloc
    ( ) , and calloc ( ).


    Also, in the C programming language, the exact array size remains unknown until
    the compile time occurs. This compile time is about the compiler compiling the
    code into a language that is easy to understand.


    Through dynamic memory allocation, your program can acquire a bigger memory space
    as it runs. Conversely, it allows it to have more memory to release if it does
    not need it. Simply put, dynamic memory allocation lets you manually deal with
    the memory space in the program.


    Even though this programming language does not have an inherent technique for
    allocating memory dynamically, you can use library functions.


    | Function | Usage |


    | malloc ( ) | It allocates the requested size of the bytes and then returns the
    pointer first byte of the allocated space |


    | calloc ( ) | It allocates the space for the elements of an array. It also initializes
    to zero and returns the pointer to memory |


    | realloc ( ) | It changes the size of the previously allocated space |


    | free ( ) | It deallocates the previously allocated space |


    ––––––––


    ![image](d2d_images/scene_break.png)


    Malloc ( )


    It stands for memory allocation. This function reserves memory and returns the
    pointer type of void. Its syntax is as follows:


    ptr = ( cast – type * ) malloc ( byte – size )


    ptr is the cast-type pointer. The pointer is returned by the malloc ( ) function
    to an area of the memory. If there is not enough space, the allocation does not
    occur and the NULL pointer is returned. Consider the following example:


    ptr = ( int * ) malloc ( 100 * sizeof ( int ) ) ;


    Calloc ( )


    It stands for contiguous allocation. It is different from malloc ( ) in the way
    that it allocates multiple memory blocks that have the same size whereas malloc
    ( ) allocates single memory blocks. This function also sets the bytes to zero.
    Its syntax is as follows:


    ptr = ( cast – type * ) calloc ( n , element – size ) ;


    The statement allocates a contiguous space in the memory for the array of n elements.
    Consider the following example:


    ptr = ( float * ) calloc ( 25 , sizeof ( float ) ) ;


    Realloc ( )


    It can be used to change the previously allocated size of the memory in case there
    is too little or too much of it. Its syntax is as follows:


    ptr = realloc ( ptr , newsize ) ;


    ptr gets reallocated with the size of newsize.


    Free ( )


    It is used to release the space or free a dynamically-allocated memory that was
    created using malloc ( ) or calloc ( ). Its syntax is as follows:


    free ( ptr ) ;


    It frees the space that was allocated in the memory that ptr pointed to.


