    # Chapter 5: Pointers


    ![image](d2d_images/chapter_title_below.png)


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # C Pointers


    ![image](d2d_images/chapter_title_below.png)


    Pointers are amazing features of the C language. These features are what set this
    programming language apart from the others, including Python and Java. Pointers
    are used to manipulate addresses and access memory.


    Address in the C Language


    As a programmer, you have to familiarize yourself with the address used in the
    C language. You can use var, which is a variable in the program. You can also
    use &var, which gives you the address in your memory. Here, the notation & is
    referred to as the reference operator. You also need it if you have to use the
    function scanf ( ). It is necessary for the purpose of storing inputted values
    in the var address.


    Take a look at the following code:


    scanf ( “%d”, &var ) ;


    To help you understand this concept further, you should take a look at the following
    sample program:


    /* This sample program demonstrates the usage of the reference operator in the
    C language. */


    #include < stdio.h >


    int main ( )


    {


    int var = 5 ;


    printf ( “The value is %d \n “ , var ) ;


    printf ( “The address is %u” , &var ) ;


    // Check out the presence of the ampersand ( & ) character before the var.


    return 0 ;


    }


    When you run the above given sample program, you would get the following output:


    The value is 5


    The address is 2686778


    You have to take note that you may get a different value for your address, depending
    on your computer. In the example shown above, a value of 5 gets stored in the
    2686778 memory location. Var is used simply to provide a name to the location
    in the program.


    Pointer Variables


    In the C language, a special variable is used to store the address of another
    variable. This special variable is referred to as the pointer or the pointer variable.


    ––––––––


    ![image](d2d_images/scene_break.png)


    Pointer Declaration


    When you declare a pointer in your program, you can write the following codes:


    data_type *  name_of_pointer_variable ;


    int *  p ;


    As you can see in the sample statement shown above, p was defined as the pointer
    variable of the type int.


    Reference and Deference Operators ( & and * )


    You can use two types of operators in your C programs: the reference operator
    & and the deference operator *. The previous operator provides you with the address
    of the variable, while the latter provides you with the value of this address.


    To help you know more about pointers as well as deference operators and reference
    operators, you have to check out the following sample program. In this example,
    you will see how pointers work.


    /* This is a source code that shows you how pointers are used in the C language
    */


    #include < stdio.h >


    int main ( )


    {


    int *  pc ;


    int c ;


    c = 22 ;


    printf ( “The address of c is : %u \n “ , &c ) ;


    printf ( “The value of c is : %d \n \n “ , c ) ;


    pc = &c ;


    printf (“The address of the pointer is : %u \n “ , pc ) ;


    printf ( “The content of the pointer pc is : %d \n \n “ , *pc ) ;


    c = 11 ;


    printf ( “The address of the pointer pc is : %u \n “, pc ) ;


    printf ( “The content of the pointer pc : %d \n \n” , *pc ) ;


    *pc = 2 ;


    printf ( “The address of c is : %u \n “ , &c ) ;


    printf ( “The value of c is : %d \n \n “ , c ) ;


    return 0;


    }


    When you run the above given example, you will get the following output:


    The address of c is : 2686784


    The value of c is : 22


    The address of the pointer pc is : 2686784


    The content of the pointer pc is : 22


    The address of the pointer pc is : 2686784


    The content of the pointer pc is : 11


    The address of c is  2686784


    The value of c is : 2


    The above given sample program resulted in this output because of the following:


    The command int *  pc ; makes the pointer pc while the command int c ; makes the
    normal variable c. Because both c and pc are not initialized, the pointer pc can
    point to any random address or to no address at all.


    Similarly, the variable c gets assigned a specific address even though it has
    a garbage value or random value.


    A value of 22 gets assigned to the variable c because that is what you declared
    in the program when you wrote c = 22 ; . This stores the value 22 within the memory
    location of the variable c. You have to keep in mind that when you print &c, which
    refers to the address of c, you have to use %u instead of %d because the address
    is generally regarded as an unsigned integer. This makes it positive at all times.


    The address of the variable c gets assigned to the pointer pc because you wrote
    pc = &c ; . When it comes to printing, the value of the pointer is the same as
    the address of the variable. In this case, the value of pc is similar to that
    of the address of c. In addition, the content of the pointer pc is also the value
    22.


    Then, the value 11 gets assigned to the variable c because you wrote c = 11 ;
    . You have to allocate a new value to the variable c in order for you to see how
    it affects the pointer pc.


    Due to the fact that the pointer pc also points to the address of the variable
    c, the value that the pointer pc uses is also 11\. When you print the content
    and the address of pc, you display the updated content.


    Everything that the memory location contains is changed when you use *pc = 2 ;
    . The pointer pc points towards the value 2\. Because the address of the pointer
    is similar to that of the variable c, the value of c changes to 2 as well.


    ––––––––


    ![image](d2d_images/scene_break.png)


    Frequently Asked Questions (FAQ)


    What are the common mistakes that programmers make when they work with pointers?


    A lot of programmers make a mistake when they use pointers to point to the addresses
    of variables.


    For instance, they make a mistake when declaring the pointer and the address,
    such as in the following sample code:


    int c ,  *pc ;


    pc = c ;


    In the above given example, pc is used as an address. However, the same cannot
    be said of c because it is not an address.


    Here is another example:


    int c ,  *pc ;


    *pc = &c ;


    In the above given example, the address points to the value *pc while &c ;  is
    the address.


    So, what are the correct codes to be used then?


    Take a look at the following example:


    int c , * pc ;


    pc = &c ;


    In the above given example, both &pc and pc are addresses.


    int c ,  *pc ;


    *pc = c ;'
