  \     \n*正文正常继续。*\n\n在当今时代，几乎每个人都拥有计算机并能访问互联网。每天有数百万来自世界各地的人上网进行各种活动：购物、银行业务、下载与发送数据阅读获取新资讯从事在线工作与他人沟通交流等\
  \   \n\n当你浏览网络时能看到众多功能各异的网站无论你使用网络的目的是什么没有程序设计人员你将无法完成这些操作如果你想使用某个应用程序玩游戏执行在线任务也需要由程序开发人员所创建的程序来支持\
  \     \n\n**[编程语言的普遍存在]**      鉴于此你可以预见在实际应用中看到 **C** 的身影事实上这种编程语言不仅用于线上它也广泛应用于线下各类应用场景凭借其诸多优势即便与其他较新的语相比备受欢迎的依旧深受广大用户青睐常用于操作系统汇编器文本编辑器网卡驱动打印缓存现代表程解释数据库以及多种实用工具可能令惊讶的是如今很多领域都在运行基于开发的例如内核就是用建微软也采用了通过核心交互件本质都是作为基础所需的够好\
  \    \n\n不仅如此 AndroidWindowsPhoneOSXiOSFreeBSDOpenBSD 均在架构最内层使用了这门流行久负盛名的首选之选适合做中高端……由此可以其在系级工程中的绝对地位至高无上万用灵药\
  \                                      探索“经验所选”的方法这也是被采纳的原因首先是起对于类平及种变体极为推其次经过海量实践低阶集成为非高效如果希望嵌汇同样能获理想果\
  \                                                                              \
  \                                      此外调高度跨台性质也随之独立生成代码后又出现部压过了但仍然颇受推崇许多人认优于高级方面因此当主要关注容须择衡按需完工通常除还广泛运用包含变量创发工资财务流程数字版画处理\
