  \n\n\n\n\n![image](img/chapter_title_below.png)\n\n## 语句\n\n程序本质上就是一系列按照特定顺序执行的命令。在\
  \ C 语言中，**语句（statements）**控制着这个执行序列。它还可以做以下事情：计算表达式，或者甚至什么都不做——空语句就是一个例子。所有语句，包括空语句在内，都必须以分号结尾。\n\
  \n```c\nw = x + y ;\n```\n\n在上面的示例中，`x`和 `y`两数相加的值被赋给了名为“W”的变量。（注意：这与代数中的等式 \\(\
  \ w = x + y \\) 不同。）在 C 语言里，“=”是赋值运算符而非等号；它将右侧元素的结果存入左侧指定的存储位置。\n\n严格来说（为了代码演示目的），上述示例显然并非简单的算学等式；它展示了编程与数学之间的语义差异。“=`\
  \ ”并不会被理解为等于关系,而是一个操作符:其作用是将结果值存放到左边的目标地址中去.实际上你看到的是这样一个事实：“x+y=某物”并不是描述一个相等状态(如纯数学推导),而是代表一套用于数据转移指令的操作流程/结果的存放点指定过程.\n\
