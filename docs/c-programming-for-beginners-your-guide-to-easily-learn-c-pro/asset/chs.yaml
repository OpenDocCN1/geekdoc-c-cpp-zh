  \ compliance checking processing complete.\n\n\n\n\n\n# B 语言和 C 语言的起源\n\nB 语言由肯·汤普森在\
  \ 20 世纪 60 年代末开发。当时，计算机代码主要用汇编代码编写。因此，一个人每次想完成特定任务时，都必须写好几页的代码。\n\n由于 B 是一种高级编程语言，它为这个问题提供了解决方案。用户不再需要编写多页代码，因为只需写几行就能完成任务。显然更快速、也更便捷地写出了这几行逻辑。\n\
  \n后来 B 被用于 UNIX 的开发中,因其的高级特性使得用户可以轻松快速地编码却不浪费过多时间；然而即使看似拥有诸多优势它也存在很多缺点:比如不知道数据类型所以程序员不得不将所有内容都通过机器字来表达;同时缺乏结构这也给广大使用者带来了很大的困扰.为了解决这些问题丹尼斯里奇于\
  \ 1970 年代初将原先的内容转换为新的名为优化的选择题——除了保留大量原有语法之外还成功添加了数据类型等关键功能最终呈现出的结果是惊人的：符合操作系统所需的所有特征兼具高等级功用因为这个缘故许多最初建立在旧版本之上的构成部分都已经改为使用新版本来重新实现尤其是其内核在一九七三年就已经迁移到了\
  \ DEC PDP 11 上现在有关这一新体系的全部资料都可以在《程序设计》一书中的描述看到此书是由搭档合作完成的其中一人还创造了世界上著名的 Hello World\
  \ 程序及 UNIX 系统中的其他多种实例首版的这部作品成为了后续众多相关书籍的基础更是该门学科公认的标准（即 ANSI C）标准美国国家标准协会(AAA)成立了专门委员会并于一九八八年正式确定了定稿这份副本只对原始设计进行了极其微小的改动毕竟必须要确保旧有系统能在新版下正常工作之后国际标准化组织也通过了这项规范虽然其实应当称为但仍大家还是习惯叫做\
  \  \n\n## 使用 C 的优势  \n可供选择的不同编程语库有很多各自独有的特点那么为何要倾向于支持什么呢？凡是用会运行得非常迅速如果你向往丰富的动态性完全可以选择更为新颖如\
  \ Java 或 Python 但追求速度就应该采纳相对于而言由于其处理器占用较少性能自然更好此外还能直接操弄硬件这是多数高层级并不具有的一点对于初学者来说则是实实在在的红利能更有成效地上手学习而自带范例又具备极佳的便携性你无需反复撰写同一个一旦在自己的电脑无论装了什么系统创制好首先可以再到另一安装不同系统的环境内编译而不出现任何不必要的差异例如拿\
  \ Windows7 写的可以在苹果 OS 中得到一模一样的结果每个段落都能存储下来留待后用这种概念称作模块化能把类似输出显示需求的难题交给 stdlib 来解决职能：【printf()】进而能够适用于各类目标即便作为最为古老的种类之一仍有大批开发者钟情可用作诸如照片编辑与嵌入式驱动数据库编译器网络打印机后台监控乃至整体\
  \ OS 也在覆盖范围内堪称万物皆可而且它是静态类型的运行时变量值不被审核而是在翻译阶段完善故此错误得以更快捕获助力顺畅软件开发另外也比那种动态型语速稍快学会它能让你深刻理解真实计算细节涉及内存分配管理以及架构知识数列指向底层机制学之前须明白读罢才可通晓\
  \ Python 解释器否则无从把握在此基础上衍生出了多少新型创作呢并非只有协调一起包括 Java 等等在内实际上被视为超集由此各不相同的 PHP 和 JavaScript\
  \ 句法也十分相似因而当你熟练之后就转战其它也将越发游刃有余余量成了攀登路上不可阻挡之步最后一个原因则说到优越过往正如我们推断的那样由于其历史比较古老但却同样没有淘汰掉大量的传统项目但实际上重型现代工程还得是靠手脚活用参考那一份继承来的功勋——总之终极用途几乎无所不能此节也好彼处也罢要想制作出贴合实际需求的好工具新人可从诞生的源头开始层层剥茧直击本质世界那么大不妨联手亲历修炼本该充满乐趣的上古经典如今仍在全线火热！\n\
  \n### C 语言的缺陷\n尽管`C`广受欢迎但它并非完美无缺它的弊端即便是新手也能察觉中级/高级程序员则必须加以权衡：\n\n**缺少内置运行时检查**:虽然经验丰富者可手动定位运行时问题但有自动机制可在调试过程中节省时间。\n\
  不支持面向对象编程：抽象、模块化封装多态继承这类面对对象的根基让项目管理井井有条而这些特质仅在较晚问世的 languages 原生态存在 c++正是为弥补纯环境中确见不足而产生反之类型缺失碰上大型需记各项保持就会责全员拥护称最新标修订简称\
  \ ``202311``常见称呼“当前代际”无异间接等效包装允许所有借助潜能每位勇者入探索[...］深度维!\n\n\n\n\n\n显然，在目的和应用方面拥有完全且无限的灵活性可能是一个优势。然而，就编程而言，缺乏专一性可以被视为一个缺点。例如，如果存在一种更适合你目标的语言，选择继续使用\
  \ `C` 只会导致为实现某些功能而付出的努力增加。\n\n尽管如此，即使有更好的替代方案存在，《了解如何用 C 语言编程》仍应证明是有益的——正如之前所提；它与其他流行、较新的语言相似。\n\
