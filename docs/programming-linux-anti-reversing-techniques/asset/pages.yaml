  md: "Chapter 5: Obstructing Code Flow Analysis\n\n# Returning to the middle of check_password()\n\
    \n```\nbool __attribute__((optimize(\"01\"))) check_password(const char* p_password)\n\
    {\n    char pass[password_size] = {};\n    asm volatile(\n        \"push %%0\\\
    n\"\n        \"ret\\n\"\n        : \"g\" (&return_here);\n\n    return_here:\n\
    nXOR_STRING31(pass, password, 0xaa);\n\n    // validate the password\n    return\
