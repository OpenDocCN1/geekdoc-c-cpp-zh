    # # Early Return


    Another way to hide *Trouble*''s logic is to trick the diser into exiting the
    *check_password()* function early. One way to do this is to push an address onto
    the stack and immediately return. This will cause the program to return to the
    address on the stack. There is actually a very good write up on this technique
    on malwinator.com⁵⁰ but we will create our own example as well.


    In order to use the early return technique, you''ll create a label in *check_password()*
    and use inline assembly to push the address of the label onto the stack. The updated
    *check_password()* looks like this:'
