  md: "There is a problem with this technique though. If the debugger attaches to\
    \ Trouble after the SIGTRAP has been generated then it won't be detected. In the\
    \ following example, gcore has no problem generating a core from Trouble.\n\n\
    # Bypassing the SIGTRAP technique with gcore\n\n```\nalbino-lobster@ubuntu: $\
    \ sudo gcore pidof trouble\n[sudo] password for albino-lobster:\n0x00000000000401448\
    \ in __syscall ()\nSaved corefile.84691\n```\n\ngcore is able to attach to Trouble\
    \ and create the core file. Unfortunately, there is little SIGTRAP method can\
    \ do to stop this. Even if you generate more SIGTRAP signals, this method simply\
    \ doesn't prevent other processes from attaching.\n\n# Becoming Attached\n\nAnother\
    \ well known method uses PTRACE_ATTACH from a forked child. Consider the following\
    \ changes to Trouble:\n\nTrouble updated to trace itself\n\n```\nint main(int\
    \ p_argc, char* p_argv[])\n{\n    (void)p_argc;\n    (void)p_argv;\n\n    int\
    \ fork_pid = fork();\n    if (fork_pid == 0)\n    {\n        // trace the parent\
    \ process\n        if (ptrace(PTRACE_ATTACH, getppid(), NULL, NULL) != 0)\n  \
    \      {\n            exit(EXIT_FAILURE);\n        }\n    }\n    ptrace(PTRACE_SETOPTIONS,\
    \ getppid(), NULL, PTRACE_O_TRACEK);\n\n    // restart the parent so it can keep\
    \ processing like normal\n```"
