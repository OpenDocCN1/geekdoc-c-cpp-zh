    # Using mus


    If you want to write a truly hardened binary it''s best to distrust all of the
    shared

    libraries on this system. According to the GCC documentation, -static “prevents
    linking with the shared

    libraries²²⁸. However, glibc, the lib version shipped with many major Linux distros,

    is really meant to be statically linked. When we do statically link, some lib

    functionality gets broken and it makes our binary significantly larger. The fact
    of

    matter is that glibc simply should not be used for static linking. Luckily, there

    other versions of lib that are intended to be statically linked²²⁹.


    > ²⁸https://gcc.gnu.org/onlinedocs/gcc/Link-Options.html


    > ²²⁹http://www.etalabs.net/compare_libcs.html'
