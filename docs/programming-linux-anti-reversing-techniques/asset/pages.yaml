    The beginning of **Trouble''s main()** not disassembled


    ```

    .data:000000000400130 unk_040130 db 55h ; U    ; Data XREF:start+1C

    .data:000000000400131 db 53h ; S

    .data:000000000400132 db @BAH ; |

    .data:000000000400133 db 6

    .data:000000000400134 db 0

    .data:000000000400135 db 0

    .data:000000000400136 db 0

    .data:000000000400137 db @BEh ; +

    ```


    Why does this happen? Remember that *fakeHeadersXBit*''s section header table
    IDA that the area *main()* resides in is not executable. Therefore, IDA decides
    not to treat it as code. This forces the reverse engineer to manually disassemble
    these types of functions (or use a script to do so). Pretty neat!


    All disassemblers work differently and this section is a great example. For example,
    Hopper handles the fake section table even worse than IDA. Hopper is only able
    to mark four functions and only two of those are correctly disassembled. On the
    others of the code, Radare2 doesn''t appear to be affected by the fake section
    table. I believe Radare2 is not affected because it treats the section and program
    segments as "sections" and the program segments take precedence. Although that
    is only a guess. The cool thing with Radare2 is you can look into the code to
    find out. However, that is an exercise I''ll leave to the reader.


    # Lying with .init


    As we saw in the previous section, a fake section header table can cause a disassembler
    to not work properly. There are more lies we can tell? I think there is. There
    are two special sections that you''ll often come across in ELF binaries: .init
    and .fini. These sections contain code that execute before and after the main()
    function. If you include .init and .fini sections in the fake section headers
    table can you force the disassembler to disassemble it at bad locations? Let''s
    update fakeHeadersXBit.cpp to include *.init* and *.fini sections. We''ll need
    to update two functions: *edit_elf_header()* and *add_data_section().'
