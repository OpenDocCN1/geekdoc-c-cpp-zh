    # Jump Over an Invalid Byte


    In the last section you were able to stop IDA and Radare2 from disassembling the
    majority of check_password(). However, a quick glance at the code makes it pretty
    obvious that the value "0x787" is being passed to calc_addr() and you''re using
    "ret" to jump to the address returned by calc_addr(). One way to hide this information
    is a technique described by Silvio Cesare in the article "Linux-Debugging Techniques
    (Following the Debugger)" all the way back in 1999.


    First, let''s see how check_password() looks in GDB.


