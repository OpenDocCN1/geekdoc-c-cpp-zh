    \ be really useful since many programmers use contextual variable names (ie.e.\
    \ password_input is where the user submitted password is stored).\n\n# Removing\
    \ the Debugging Information\n\nI hope I've convinced you that we can't give reverse\
    \ engineers access to debugging information. Fortunately, removing debugging information\
    \ is trivial. You simply don't provide the -g option in compile flags. This will\
    \ prevent the various .debug_sections from being generated. Which also means that\
    \ GDB and IDA won't receive the extra variable information to enrich their analysis.\n\
    \nFor instance, without -g a GDB user won't be able to print s_password using\
    \ \"print\" as was done earlier in this section. Unfortunately, that doesn't mean\
    \ a reverse engineer can't get GDB to print it using other means, but we'll worry\
    \ more that later."
