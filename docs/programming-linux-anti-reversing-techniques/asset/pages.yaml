    to the binary. Without the additional context the reverse engineer is left to
    figure it out for themselves.


    # -O


    An often overlooked subject is that of optimization. You control the many ways
    the compiler tries to improve the performance or size of your program through
    the optimization flags. There are many flags19, so it''s helpful that GCC has
    combined many of them under various "-O" flags. While there are more "-O" flags
    I believe the following four are most useful:'
