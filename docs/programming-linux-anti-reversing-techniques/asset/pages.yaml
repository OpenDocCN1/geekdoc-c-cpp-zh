    # Overlapping Instructions


    In the previous examples, you inserted a byte that would never be executed by
    the program. While this technique successfully obfuscated check_password(), a
    clever disassembler might be able to identify the unused byte and display the
    correct disassembly. However, there is a technique that even a clever disassembler
    would struggle with: overlapping instructions. If you can write code that is executed
    twice but represents two different instructions you have introduced a real problem
    to both the disassembler and the reverse engineer.


    The most well known example of this technique, can be found in'
