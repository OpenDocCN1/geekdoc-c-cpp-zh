  md: '# madvise


    In the previous section, you introduced a new way to detect if a debugger is attached
    to *Trouble*'' tracing child. However, the method doesn''t protect against utilities
    that attach and detect without controlling executing like gore.


    gore still to attach to *Trouble*''s tracing child


    ```

    albino-lobster@ubuntu:~$ ps fa

    PID TTY      STAT TIME COMMAND

    6369 pts/29 Ss+       0:00 bash

    6352 pts/21 Ss        0:00 bash

    16614 pts/21 R+       0:00 \_ ps fa

    6230 pts/9 Ss        0:00 bash

    16611 pts/9 S+       0:00 \_ /trouble/trouble

    16612 pts/9 S+       0:00 \_ /trouble/trouble

    16613 pts/9 S+       0:00 \_ /trouble/trouble

    albino-lobster@ubuntu:~$ sudo gore 16613

    0x000000000402374 in ~syscall()

    Saved corefile.16613

    ```


    As mentioned previously, a core file can be loaded into IDA and provides a view
    of *Trouble* that strips away many of the obfuscations techniques. However, there
    is a Linux function called *madvise()* that will allow us to exclude memory ranges
    from being included in a core file. From the man page:


    > The madvise() system call is used to give advice or directions to the kernel
    about the address range beginning at addr and with size length bytes. Initially,
    the system call sup-ported a set of "conventional" advice values, which are also
    available on several implementations. (Note, though, madvise() is not specified
    in POSIX.) Subsequently, a number of Linux-specific advice values have been added.


    One of the "Linux-specific advice values" is the MADV_DONTDUMP value. Again, from
    the madvise page:


    ![](img/fdf1e4bfff3995dc5a8580eb00fa23e5_224_0.png)'
  merge: -1
  pgno: 224
- img_proc: true
  md: "Chapter 6: Evading the Debugger\n\n221\n\nMADV_DONTDUMP (since Linux 3.4) Exclude\
    \ from a core dump those in the range specified by addr and length. This is useful\
    \ in applications that have large areas of memory that are not known to be in\
    \ a core dump. The effect of MADV_DONTDUMP takes precedence over the bit mask\
    \ that is set via the /proc/PID/coredump_filter file (see core(5)).\n\nUsing madvise(),\
    \ you can prevent gcre from dumping Trouble after the cryptor has been executed.\
    \ The only real challenge is to programmatically find the addresses to pass to\
    \ madvise(). To do this I created another post-compilation tool in the chapter\
    \ 6 dont directory under madvise. The project, as usual, contains two files.\n\
    \nchap_6_debugger/dontpanicic/madvise/CMakeLists.txt\n\n```\nproject(madvise CXX)\n\
    cmake_minimum_required(VERSION 3.0)\n```\n\n```\nset(CMAKE_CXX_FLAGS \"Wall -Wextra\
    \ -g\")\n```\n\n```\nadd_executable(${PROJECT_NAME} src/madvise.cpp)\n```\n\n\
    chap_6_debugger/dontpanicic/madvise/src/madvise.cpp\n\n```\n#include <cstdlib>\n\
    #include <iostream>\n#include <fstream>\n#include <iomnip>\n#include <cstring>\n\
    #include <elf.h>\n```\n\n```\n/*\n * Parse the program headers and store the address/size\
    \ of the first LOAD.\n * the section headers table looking for \".madvise_base_addr\"\
    \ and \".madvise_size\"\n * where we store the address and size we pulled from\
    \ the LOAD segment.\n *\n * \\param[in,out] p_data the ELF binary\n * \\return\
    \ true if we found both .madvise sections\n */\n```\n\n```\nbool add_advise_info(std::string&\
    \ p_data)\n```"
