    ```

    int memcmp(const void *s1, const void *s2, size_t n)

    {

    char* new_s1 = malloc(n + 1, 1);

    char* new_s2 = malloc(n + 1, 1);


    memcpy(new_s1, s1, n);

    memcmp(new_s2, s2, n);


    printf("memcmp(%s, %s, %u)\n", new_s1, new_s2, (int)n);

