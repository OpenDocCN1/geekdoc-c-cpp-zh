  md: "# Chapter 3: File Format Hacks\n\nYou don’t want to manually execute strip\
    \ -R after every build though. That would just be sort of annoying. Luckily, CMake\
    \ provides the ability to execute commands. If you add the following command to\
    \ the Trouble’s CMakeList.txt than the .comment section will be removed everytime\
    \ time the binary is compiled:\n\nStrip .comment atfer each compilation\n\n```\n\
    add_custom_command(TARGET ${PROJECT_NAME}\n  POST_BUILD\n  COMMAND strip -R .comment\
    \ ${CMAKE_CURRENT_BINARY_DIR}/${PROJECT_NA}ME)\n```\n\n# Removing the Section\
    \ Headers Table\n\nIn the previous section you were looking at the section headers\
    \ table. The section headers table is useful for a reverse engineer because it\
    \ breaks down the binary’s address space into very specific chunks. However the\
    \ section headers aren’t actually needed for execution. You read that right, the\
    \ section table is not needed! You can remove it entirely.\n\nDon’t take my word\
    \ for it though. Test it yourself. Consider Trouble’s ELF header.\n\nTrouble’s\
    \ ELF header\n\n```\nalbino-lobster@ubuntu:~antire-book/chap_3_format_hacks/trouble/build$\
    \ readelf -h -./\nrouble\nELF Header:\nMagic: 7f 45 4c 46 02 01 00 00 00 00 00\
    \ 00 00 00 00 00\nClass: ELF64\nData: 2's complement, little endian\nVersion:\
    \ 1 (current)\nOS/ABI: UNIX - System V\nABI Version: %\nType: EXEC (Executable\
    \ file)\nMachine: Advanced Micro Devices X86-64\nVersion: 0x1\nEntry point address:\
    \ 0x4002f2\nStart of program headers: 64 (bytes into file)\nStart of section headers:\
    \ 8632 (bytes into file)\nFlags: 0x0\n```"
