  md: '# # Chapter 1: Introductions


    # ## Introducing “Trouble”


    This book centers around the obfuscation of a bind shell called Trouble.


    # ### What is a bind shell?


    “Bind shell is a type of shell in which the target machine opens up a communication
    port or a listener on the victim machine and waits for an incoming connection.
    The attacker connects to the victim machine’s listener which then leads to code
    or command execution on the server.”


    The Trouble bind shell is used as an example, not because it is unique or interesting,
    but because it is small and simple. It also has a property that should be interesting
    to a reverse engineer: it requires a password to access the shell. All of the
    activity in this book attempts to either hide or recover the shell’s password.


    # ## Using CMake


    You’ll be using CMake to compile Trouble. CMake is an open source Makefile generation
    tool. It’s useful for dependency checking and supports a simple syntax. Don’t
    worry if you aren’t familiar with CMake. You’ll pick it as the book progresses.


    CMake relies on “CMakeList.txt” files to generate Makefiles. For chapter one,
    you’ll find Trouble’s “CMakeList.txt” in the chapter_1_introduction/trouble directory.


    > ^1http://resources.infosecstitute.com/icmp-reverse-shell/

    2https://cmake.org/'
