  md: '# Chapter 4: Fighting Off String Analysis


    Psudo code for badly computing a functions size


    ```

    void a_function()

    {

    }

    void b_function()

    {

    }

    void c_function()

    {\  int a_function_length = b_function - a_function();

    }

    ```


    This method makes the assumption that, when compiled, b_function() will immediately
    follow a_function(). This might work. It might not. It totally depends on what
    the compiler decides to do with your code. A fool proof way of finding a function''s
    size is to use a linker script*. The linker script describes how sections are
    mapped in the binary. Normally, you don''t worry about the code because the linker
    uses an internal script. You can see the default internal script by passing the
    verbose option to the linker (note that the following output is truncated because
    it goes on for a while).


