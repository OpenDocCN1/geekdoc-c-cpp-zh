  md: '# Chapter 2: Compiler Options


    +   1. -O1: "With -O, the compiler tries to reduce code size and execution time,
    without performing any optimizations that take a great deal of compilation time.\^{20


    +   2. -O2: "Optimize even more. GCC performs nearly all supported optimizations
    that do not involve a space-speed tradeoff.\^{21


    +   3. -O3: "All optimizations in -O2 perform a handful of others."


    +   4. -Os: "All -O2 optimizations that do not typically increase code size. It
    also performs further optimizations designed to reduce code size.\^{22


    ![](img/fdf1e4bfff3995dc5a8580eb00fa23e5_41_0.png)


    # Writing good code


    One of the problems with optimizations is that they can break poorly written programs.
    I think optimization levels aren''t often discussed or even fully understood by
    programmers because many write such shod code they couldn''t use optimizations
    even if they wanted.


    If you''re going to write code then do it well. Use-Wall and -Xextra when compiling.
    Use CPPCheck^{23} to do static analysis. Use Valgrind^{24} to do runtime analysis.
    These are the bare minimum to write quality C or C++ code, but I''ve rarely seen
    security professionals use any of these tools.


    # Corrected Block Tiny Encryption Algorithm (XXTEA)


    For this section, and this section, you won''t be working with the Trouble shell.
    The usefulness of optimization as an anti-reverse engineering tool is best shown
    with cryptographic algorithms and it''ll be a couple of chapters until add any
    real cryptography to Trouble.


    Therefore, I implemented the Corrected Block Tiny Encryption Algorithm^{25} (aka
    XXTEA) in C. My implementation is based on the reference code on the


    > ^{20}https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html


    > ^{21}https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html


    > ^{22}https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html


    > ^{23}http://cppcheck.sourceforge.org/


    > ^{24}http://valgrind.org/


    > ^{25}https://en.wikipedia.org/wiki/XXTEA'
