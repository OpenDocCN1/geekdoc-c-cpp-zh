    # # Hiding FUNC symbols


    As you can see from the above, the password for the bind shell is easily retrieveable.
    However, you can use a GCC compile flag to remove the check_password symbol and
    prevent a reverse engineer, from again, easily dumping the password. The GCC flag
    is "visibility-hidden"¹⁸ and when you add it to Trouble’s compiler options it
    would look like this:


    ```

    set(CMAKE_FLAGS "-Wall -Wextra -Wshadow -s -visibility=hidden -std=gnu11")

    ```


    Using -visibility=hidden will by, hide all possible symbols. That means that check_password()
    would be hidden in the chapter version of Trouble.


    # # Static functions


    We could have hidden the check_password symbol by using the static keyword in
    the function definition. In fact, if a function is not going to be used outside
    of the file (or translation unit) it is considered best practice to make the function
    static.


    > ¹⁸https://gcc.gnu.org/onlinedocs/gcc-4.6.0/gcc/Code-Gen-Options.html'
