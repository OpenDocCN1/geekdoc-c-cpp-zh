    # Case Study: XOR DDOS


    Using and removing debugging information is a beginner’s topic, but I think it’s
    important to know. You may be thinking, "No one worried reverse engineers would
    ship their binary with debugging information!" However, I can assure you they
    do.


    Take for example, XOR DDOS malware¹¹¹¹².


    # Malware


    Be careful when downloading and analyzing malware


    As noted in the analysis by MalwareMustDie¹¹¹, this malware encrypts/decrypts
    configuration files, packets, and "remote strings" using an XOR encryption scheme.
    However, just by looking at the sections in the VirusTotal link, and I know that
    debugging information is present. This makes binary an excellent toy for reverse
    engineers to play.


