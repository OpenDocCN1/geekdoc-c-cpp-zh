    If you recompile and recompile for check_password_size in the symbol table you
    won''t find it. The reason is that you haven''t added the logic to the linker
    script yet. Unfortunately, this is one of the few places that CMake fails us.
    There is no way to actually pass a script to the linker in CMake. I was forced
    to hack it in. Trouble''s CMakeList.txt should be updated to look like this:


    Using sed to insert the linker script into CMake


    ```

    project(trouble)

    make_minimum_required(VERSION 3.0)

    ```


    ```

    # This will create a 32 byte "password" for the bind shell. This command

    # is only run when "cmake" is run, so if you want to generate a new password

    # then `cmake .. make` should be run from the command line.

    exec_program("/bin/sh"

    ${CMAKE_CURRENT_SOURCE_DIR}

    ARGS " -c /dev/urandom | tr -dc a-zA-Z0-9 | head -c 32"

    OUTPUT_VARIABLE random_password)

    ```


    ```

    # Pass the random password into ${PROJECT_NAME} as a macro

    add_definitions(-Dpassword="${random_password}" -Dpassword_size=33)

    ```


    ```

    set(CMAKE_C_COMPILER mysql-gcc)

    set(CMAKE_C_FLAGS "-Wall -Wextra -Wshadow -O3 -funroll-loops -fno-asynchronous-unwind-

    tables -static -stdgnu1")

    add_executable(${PROJECT_NAME} src/trouble.c)

    ```


    ```

    add_custom_command(addLDS

    COMMAND sed -i ''s,-o,${CMAKE_CURRENT_SOURCE_DIR}/trouble_layout.

    lds -o,''g'' ${CMAKE_FILES}/trouble.dir/link.txt)

    ```


    ```

    add_dependencies(${PROJECT_NAME}) addLDS

    ```


    ```

    # After the build is successful, display the random password to the user

    add_custom_command(TARGET ${PROJECT_NAME} POST_BUILD

    COMMAND ${CMAKE_COMMAND} -E echo

    "The bind shell password is: ${random_password}")

    ```'
