  md: '# -g


    As previously mentioned, you can instruct GCC to include debugging information
    in your program using the -g flag. To gain a better understanding of what I mean
    by "include debugging information" use the command line utility readelf on Trouble.


    # readelf


    readelf is a command line utility that understands the Executable and Linkable
    Format (ELF). ELF is the standard format for Linux executables, shared libraries,
    and core dumps. readelf can provide binaries and display information about their
    formatting. readelf comes pre-installed on Ubuntu 16.04.


    readelf has a lot of command line options. One option, -S, will display the provided
    binary''s section headers.


    Listing Trouble''s section headers


    albino-lobster@ubuntu:-~/antire_book/chap_2_compiler/trouble/build$ readelf -S
    ./troub\

    There are 36 section headers, starting at offset 0x3c8:


