  md: '# Chapter 4: Fighting String Analysis


    since each character’s hex representation is visible in the disassembly. Let’s
    go one step further and XOR each byte so that the reverse engineer can’t just
    read the values straight from the disassembly.


    Before you add in the new XOR logic consider if you had one hundred of these strings
    that need to be obfuscated. It’s not realistic to write them out as arrays every
    single time is it? Let’s use macros to automate this. What is a macro exactly?
    GCC’s documentation calls it a "fragment of code which has been given a name^{38}.
    For our purposes, you can consider macros to be a simple find and replace mechanism.
    replace them with the actual code defined in the macro. Understand that this is
    an oversimplification but it’s enough to understand the basics.


    I would love to present you with a beautiful recursive macro that prettifies the
    stack string. Reality isn’t as beautiful as we’d like. Recursive macros aren’t
    possible in C (or C++ for that matter). Therefore, you’re forced to create a new
    macro for each index in the string.


    chap_4_static_analysis/dontpanic/trouble/src/xor_string.h


    ```

    /**

    * The macros below can be used to generate a stack string that has been

    * obfuscated by a given "key" (ie 0aaa). The macros are listed from 0-31.

    * The length of the string is the number in the macro name. For example, if I

    * have an 8 byte string I want to obfuscate then I’d use XOR_STRING7. Why 7?

    * Because the macros start at.

    */

    ```


    ```

    #define XOR_STRING0(storage, string, key) storage[0] = string[0] ^ key;

    #define XOR_STRING1(storage, string, key) storage[1] = string[1] ^ key \

    XOR_STRING0(storage, string, key),

    #define XOR_STRING2(storage, string, key) storage[2] = string[2] ^ key \

    XOR_STRING1(storage, string, key),

    #define XOR_STRING3(storage, string, key) storage[3] = string[3] ^ key \

    XOR_STRING2(storage, string, key),

    #define XOR_STRING4(storage, string, key) storage[4] = string[4] ^ key \

    XOR_STRING3(storage, string, key),

    #define XOR_STRING5(storage, string, key) storage[5] = string[5] ^ key \

    XOR_STRING4(storage, string, key);

    ```


    > 38https://gcc.gnu.org/onlinedocs/gcc-5.1.0/cpp/Macros.html'
