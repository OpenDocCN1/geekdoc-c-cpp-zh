    00000f10 58 6a 55 4a 52 31 37 66 63 52 30 63 5a 53 6e 6c |XJubT1GfCR0jSnl|

    00000f20 00 46 61 69 63 65 24 20 74 6f 20 63 72 65 61 74 |.Failed to create|

    00000f30 65 20 74 68 65 20 73 6f 63 6b 65 74 2e 2e 20 62 69 |e the socket..Bi|

    ```


    # Case Study: the FILE Symbol


    One of the there you included in the table is the FILE symbol. For example:


    ```

    37: 0000000000000000 0 FILE LOCAL DEFAULT trouble.c

    ```


    This can be really useful for a reverse engineer. If you can take this information
    straight to Google, GitHub, etc. and find the source code of the binary are reversing
    then life has become so much easier.'
