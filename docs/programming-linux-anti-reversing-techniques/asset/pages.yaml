  md: '# Chapter 6: Evading the Debugger


    However, if you execute Trouble without GDB then it executes without issue. What''s
    the deal? The new code you added makes a call to ptrace using PTRACE_TRACEME.
    If Trouble wasn''t started with GDB then this PTRACE_TRACEME call sets the parent
    program as tracing program. In this case, the program is `/bin/bash`. To confirm
    this, run Trouble and check it''s `/proc-<pid>/status` file. Here is an example
    of what you should see.


    Observing the tracer pid albino-lobster@ubuntu:-$ cat /proc/pidof trouble/status


    ```

    Name:           trouble

    State:          S (sleeping)

    Tgid:           59935

    Ngid:           0

    Pid:            59935

    PPid:           2402

    TracerPid:     2402

    ```


    The two most important lines in the above are "PPid" (parent pid) and "TracerPid".
    Both of these show the value of 2402. You can confirm that is bash by using the
    ps command.


    albino-lobster@ubuntu:-$ ps pid 2402 in ps


    ```

    PID TTY STAT TIME COMMAND

    2833 pts/17 Ss       0:00 bash

    59953 pts/17 R+       0:00  \_ ps f

    2402 pts/1 Ss        0:01 bash

    59935 pts/1 S+       0:00  \_ ./trouble/trouble

    ```


    If Trouble was executed via GDB then the PTRACE_TRACEME call you would added will
    fail and Trouble will exit. This is because Trouble is already being traced by
    GDB it can''t set the parent process as the tracer. Remember there can be only
    one tracer at a time. In this way we prevent ptrace base debuggers from attaching
    to Trouble.

    Another example, consider the gcore utility. gcore is a tool that produces core
    dumps of running programs. This is particularly useful if a program is using a
    cryptor, like Trouble does, since the core will dump the unencrypted version of
    the program which can then be loaded into IDA or another disassembler. However,
    if we use the PTRACE_TRACEME logic then gcore will fail.'
