    # Little Endian or BigEndian?


    In the previous section, you learned the section headers is unnecessary. That
    might get you wondering, “What else isn’t used when executing an ELF binary?”
    Well, you aren''t the first to walk down this path. In fact, Brian Raiter wrote
    an interesting essay called “A Whirlwind Tutorial on Creating Really Teensy ELF
    Executables for Linux”33 in which he explores how to create the smallest possible
    ELF executable. Part of his exploration involving the unused space in the ELF
    header to store the program headers and some executable code. It is really quite
    clever and well worth a read.


    One of the fields that Raiter overwrites is the sixth byte in the ELF header.
    This byte resides within the e_ident array that makes up the first 16 bytes of
    any ELF binary. The sixth byte is called EI_DATA and it indicates the endianness
    of the binary. The man page says this about it:


    > 33http://www.muppetlabs.com/~breadbox/software/tiny/teensy.html'
