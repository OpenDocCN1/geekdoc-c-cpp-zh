  md: '# # Chapter 3: File Format Hacks


    This chapter is all about modifying the ELF data structures after compilation.
    Having some understanding of these data structures would be useful in understanding
    this chapter. However, I don''t think you have to know ELF in order to benefit
    from this chapter. You should pick up a good amount as you go.


    The main reason I''ve not written a primer on ELF for this book is because there
    are many good descriptions that already exist. If you''d like to brush up on ELF
    than check out these resources:


    +   1. man elf

    2. https://en.wikipedia.org/wiki/Executable_and_Linkable_Format

    3. http://wiki.osdev.org/ELF


    # ## The Strip Utility


    In two you used the strip compiler option, -s, to remove the .symtab from Trouble.
    There exists a post-compilation tool called "strip" that will do the same thing.
    However, the strip utility can do more than remove the symbol table. It can remove
    sections from a binary.


    What do I mean by "remove sections"? Take a look at the section headers table
    in chapter three’s version of Trouble.'
