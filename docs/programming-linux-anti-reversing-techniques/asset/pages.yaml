  md: '.text:0000000004009E2 check_password endp


    That is harder to pull the password out of (especially when you don’t know the
    key). As a reverse engineer, if you ever come across XOR encoded data there are
    two known tools for finding and decoding the data.


    +   - XORSearch^40 by Didier Stevens

    - xortool^41 by "hellman"


    However, note that you’ve already defeated these tools simply by using XOR in
    conjunction with a stack string.


    # Function Encryption


    Generating XOR obfuscated stack strings is pretty handy, but it won’t slow down
    a good reverse engineer. You need something more powerful to hide the bind password.
    Let’s try encrypting the entire `check_password()` function.


    # Computing the Function’s Size Using a Linker Script


    The first problem you’ll face when trying to figure out how to encrypt a function
    is how to determine the size of the function. Unfortunately, many people seem
    to come up with the following solution.


    > ^40https://blog.didierstevens.com/programs/xorsearch/

    41https://github.com/hellman/xortool'
