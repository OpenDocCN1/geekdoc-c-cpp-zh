    \ The output shows the current Pid (7123), the parent's Pid (7113), and the tracer's\
    \ Pid (7124). We can update Trouble to look up this information using /proc/self/status.\n\
    \n# Looking for TracerPid in /proc/self/status\n\n+   * Checks the \"TracerPid\"\
