    # Signals


    Another code flow obfuscation technique is to use signals⁴⁶. A signal is an IPC
    mechanism that can be used to alter the execution flow of a program. If you''ve
    ever used a terminal you''re almost certainly familiar with signals. For example,
    when you hit "Ctrl-C" to terminate a program you''ve actually sent the SIGINT
    signal. There are many signals and you can find them all by looking at the signal
    man page⁷.


    Using the function sigaction⁸⁹ you can register a function to handle a specific
    signal. For example, if you register a function to handle SIGINT and you "Ctrl-C"
    while your program is running your function will be called instead of terminating
    the program. That''s pretty useful, right? You also send signals to your program
    using the kill¹⁰ function. How is that useful? Instead of directly calling a function,
    you can register the function with sigaction() and generate a signal with kill()
    everytime you want to call the function.


    For example, consider this version of the Trouble bind shell.


    > ⁴⁶https://en.wikipedia.org/wiki/Unix_signal

    ⁷man 7 signal

    ⁸⁹ man sigaction

    ¹⁰man 2 kill'
