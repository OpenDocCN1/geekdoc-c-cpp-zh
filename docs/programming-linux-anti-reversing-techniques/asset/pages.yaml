  md: '# Chapter 6: Evading the Debugger


    For this chapter you''ll use the version of the Trouble shell found in the “chap-6_debugger”
    directory. This version of the bind shell uses many of the obfuscation techniques
    you''ve previously learned in the book.


    # Trace Me


    Before you can catch debuggers like GDB you need to know how they work. Essential
    to the operation of a debugger is the ptrace system call*. The man page says:


    > The ptrace() system provides a means by which one process (the “tracer”) may
    observe and control the execution of another process (the “tracee”), and examine
    and change the tracee’s memory and registers. It is primarily used to implement
    breakpoint debugging and system call tracing


    One notable aspect of ptrace is that only one tracer can control a tracee at a
    time. This means if GDB is tracing Trouble then no other process can trace Trouble.
    This is useful from an anti debugging point of view because you are able to determine
    if a debugger is attached to Trouble by simply calling ptrace(). To try out, update
    Trouble’s main() to detect tracing. Note that the following code will require
    “#include <sys/ptrace.h>” to be added as well.'
  merge: -1
