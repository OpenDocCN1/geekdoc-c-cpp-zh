    # # Creating a Cryptor


    As you saw at the end of the previous chapter, a reverse engineer doing static
    analysis can recover all the variables they need to decrypt check_password() by
    looking at the disassembly right before the call to check_password(). Is it possible
    to prevent that? The answer is always no. You really can''t prevent it. However,
    you can make it more difficult. Let''s write a cryptor to encrypt more of the
    binary!


    # ## What’s a Cryptor?


    A cryptor encrypts a binary and adds additional logic to decrypt the binary at
    runtime. A couple of open source examples are:


    +   1. cryptelf⁴

    2. midgetpack⁵


    Unlike a cryptor, a packer compresses the binary. The most widely used cryptor
    is UPX`[upx]`.


    > ⁴https://dl.packetstormsecurity.net/linux/cryptelf.c

    ⁵https://github.com/arisada/midgetpack'
