  md: '# Chapter 2: Compiler Options


    The compiler options are often overlooked when talking about anti-reverse engineering.
    However, it''s essential that you understand how different options alter the final
    binary. The compiler can be your worst enemy that gives away all of your secrets
    or it could be your best friend as it strips away unnecessary information.


    ![](img/fdf1e4bfff3995dc5a8580eb00fa23e5_15_0.png)


    # Focusing on GCC


    The code in this book expects GCC to be used as the compiler. That is not to say
    that Clang or other compilers could not be used. They very well could be. However,
    GCC is used since it was the de facto standard for so many years.


    If you are unfamiliar with CMake or GCC you might be wondering are the compiler
    options I''m talking about. If you look back at the “CMakeLists.txt” file from
    chapter one you will find this:


    ```

    set(CMAKE_C_FLAGS "-Wall -Wextra -Wshadow -g -std=gnu")

    ```


    These are the compiler options. GCC supports many options³ and maintains detailed
    documentation. The flags used in the chapter one version of Trouble are a subset
    of what is available.


    In the compiler options above, all of the options that start with -W are warning
    options⁴ that tell the compiler to check for specific types of programming mistakes.
    The -g option instructs the compiler to include debugging information⁵ in the
    binary. Finally, -std=gnu11 tells the compiler that the C code you are expecting
    the GNU dialect of the C11 standard for the C programming⁶. The GNU portion extensions
    that were not part of the C11 standard.


    ³https://gcc.gnu.org/linedocs/gcc/Option-Summary.html

    ⁴https://gcc.gnu.org/linedocs/gcc/Warning-Options.html#Warning-Options

    ⁵https://gcc.gnu.org/linedocs/gcc/Debugging-Options.html#Debugging-Options

    ⁶https://gcc.gnu.org/linedocs/gcc/C-Dialect-Options.html#C-Dialect-Options'
