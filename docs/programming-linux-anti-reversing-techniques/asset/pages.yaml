    # Mixing the Symbols


    This chapter has, so far, emphasized file format hacks using the statically compiled
    Trouble. However, this section will discuss an anti reverse engineering technique
    that requires the dynamic symbol table to be present. Therefore, youll have to
    revert back to using the one version of Trouble for this section.


    I first saw this in a blog written by Andrew Pawlowski¹¹⁵. In this technique,
    you’ll append a fake dynamic symbol table to the end of the binary. Then you’ll
    repoint the offset in the .dynsym section header to point to the fake symbol table.
    Finally, you’ll mix all of the symbol name pointers for FUNC symbols. This will
    cause the disassemblers that rely on the sections table, inside of the program
    headers, to display incorrect function names in the disassembly.


    I wrote a tool to mix the dynamic symbols. You can find it in the chapter directory
    under mixDynamicSymbols. There are two files in the project: CMakeLists.txt and
    mixDynamicSymbols.cpp.


    > ¹⁵https://b4des.org/blog/index.php?archives/346-elf-obfuscation-let-analysis-tools-show-wrong-external-symbol-calls.html'
