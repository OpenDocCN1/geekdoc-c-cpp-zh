  md: "# Chapter 3: File Format Hacks\n\nThis is a technique you can use to hide the\
    \ entry point. If you add a fake section headers table and alter the base address\
    \ of the section that contains the entry point then any disassembler relying exclusively\
    \ on the sections headers table won't be able to properly find the entry point\
    \ in the file.\n\nI wrote some code that you can examine it further. The project\
    \ is called fakeHeadersHideEntry and can be found in the chapter directory. There\
    \ are two files: CMakeLists.txt and fakeHeadersHideEntry.cpp.\n\nchap_3_format_hacks/fakeHeadersHideEntry/CMakeLists.txt\n\
    \n```\nproject(fakeHeadersHideEntry CXX)\ncmake_minimum_required(VERSION 3.0)\n\
    \nset(CMAKE_C_FLAGS \"-Wall -Wextra -Wshadow\")\nadd_executable($${PROJECT_NAME}\
    \ src/fakeHeadersHideEntry.cpp)\n```\n\nchap_3_format_hacks/fakeHeadersHideEntry/src/fakeHeadersHideEntry.cpp\n\
    \n```\n#include <cstdef>\n#include <iostream>\n#include <fstream>\n#include <iomanip>\n\
    #include <cstring>\n#include <ctime>\n#include <elf.h>\n```\n\n+   * This tool\
    \ will cause disassemblers to rely on the sections table for virtual address mapping\
    \ to fail to correctly find the entry point. This tool expects the provided binary\
    \ to have no sections table. It will add its own fake table with four sections:\n\
    * null header\n .text: the section code is in. This will have an altered sh_addr.\n\
    \ .data: the r/w data section\n .shstrtab: the strings table.\n\n+   * This code\
    \ makes the assumption that the binary has two PF_LOAD segments in the program\
    \ table. One segment with PF_X set and one with PF_W set."
