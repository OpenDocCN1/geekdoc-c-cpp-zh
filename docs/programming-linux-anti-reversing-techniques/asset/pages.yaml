    Hiding the entry from IDA by overlapping the entry and .init


    ```

    .init:000000000000402F0    db 2 dup(@)

    .init:000000000000402F2    public start

    .init:000000000000402F2 start    db 48h

    .init:000000000000402F2 _init    ends

    .init:000000000000402F2

    .data:000000000000402F4    ====================================

    .data:000000000000402F4    Segment type: Pure data

    .data:000000000000402F4    Segment permissions: Read/Write

    .data:000000000000402F4 _data    segment dwarf public ''DATA'' use64

    .data:000000000000402F4    assume cs:data

    .data:000000000000402F4    .org 4002F4h

    .data:000000000000402F4    db 0EDH ; f

    .data:000000000000402F5    db 49h ; I

    ```


    Because IDA stops the disassembly at the boundary of .init, it is unable to disassemble
    any of the entry point. Without the entry point getting disassembled, IDA fails
    to disassemble anything else due to the fact that you also messed with the executable
    flag.


    # Hiding the Entry Point


    In the previous section, you stopped IDA from disassembling the entry point by
    messing with the size attribute in the section header. In this section, you''ll
    learn another little lie that will hide the entry entirely.


    Consider the fields of the section header struct in C.'
