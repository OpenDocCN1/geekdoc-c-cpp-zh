    \ in from tracees\nwhile (true) {\n    int pid = wait(&status);\n    if (status\
    \ >> 16 == TRACE_EVENT_FORK)\n    {\n        // follow the fork\n        long\
    \ newpid = 0;\n        ptrace(TRACE_GETEVENTMSG, pid, NULL, &newpid);\n      \
    \  ptrace(TRACE_ATTACH, newpid, NULL, NULL);\n        ptrace(TRACE_CONT, newpid,\
    \ NULL, NULL);\n    }\n    ptrace(TRACE_CONT, pid, NULL, NULL);\n}\n\n```\n\n\
    The code above will fork() a child process that becomes the tracer of the parent\
    \ Trouble process via TRACE_ATTACH. It will also automatically begin tracing any\
    \ forks that Trouble creates due to the TRACE_SETOPTIONS call. This largely addresses\
    \ the issues that we had with the PTRACEME method because we now know the tracing\
    \ program: Trouble! This also mostly addresses the issues we had with SIGTRAP.\
    \ No one can simply attach to the Trouble process since it is being traced by\
    \ a child.\n\nHowever, this approach does have issues:\n\n+   1. Anyone can attach\
    \ to the child process tracing Trouble.\n2. If the forked tracer gets killed then\
    \ the main process doesn't know.\n3. Use of PTRACE_ATTACH requires escalated privileges.\n\
    \nAn example of the second point looks like this:"
