    No version information found in this file.


    There are four program headers that describe “Trouble’s address space. An important
    part of the program headers is the “flags” field. The flag field describes if
    a segment is executable, writeable, and or readable. Of Trouble’s four program
    headers one is read only (“r”), two are readable and writable (“rw”), and one
    is readable and executable (“re”). Do disassemblers use the “flags” field for
    their analysis? Let’s experiment.


    Let’s try to create a fake section headers table that reverses the program headers
    “flag” fields. This will happily make the disassembler think that the space described
    by the first LOAD is not executable and the space described by the second load
    is. The section headers table will have four entries:


    +   1. SHT_NULL section header. This is commonly placed at the beginning of a
    section table and would look weird if left out.


    +   2. SHT_PROGBITS section. In this section, you’ll set the address space to
    cover the first LOAD segment. However, instead of being “re” like the first LOAD
    it will be “rw” like the second LOAD. The name of the section will be “data” so
    that it will look like a normal data section.


    +   3. Another SHT_PROGBITS section. In this section, you’ll set the address space
    to cover the second LOAD segment. This time mark the segment as “re” instead of
    “rw”. The name for this section should be “text” since it’ll look like a code
    segment.


    +   4. A SHT_STRTAB section. This section will point to the end of the file where
    you’ll be appending a new list of section names.


    I have included code in chapter three that does exactly this. The project is called
    “fakeHeadersXBit”. The project, again, contains two files: CMakeLists.txt and
    fakeHeadersXBit.cpp.'
