  \ draw() const override { \n        Shape::draw();\n        std::cout << \"Border\
  \ style: \" << borderStyle << \", texture: \" << texture << std::endl;\n    } \n\
  };\n```\n\n在这个示例中，我们定义了一个抽象原型 `GraphicElement` 和一个具有克隆能力的具体子类 `Shape`。这种设置允许用户通过复制现有形状来创建新形状，避免了重新定义颜色和类型等共享属性。\n\
