  2^x\"); \n\n    try { \n        // 解释表达式 \n        double result = expression->interpret(context);\
  \ \n        std::cout << \"Result: \" << result << std::endl; \n    } catch (const\
  \ std::exception& ex) { \n        std::cout << \"Error: \" << ex.what() << std::endl;\
