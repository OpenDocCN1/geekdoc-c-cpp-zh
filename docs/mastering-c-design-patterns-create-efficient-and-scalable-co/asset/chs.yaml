  \ exponent->interpret(context)); \n    } \n\n    ~PowerExpression() { \n       \
  \ delete base; \n        delete exponent; \n    } \n}; \n\n// 解析功能\nAbstractExpression*\
  \ parseExpression(const std::string& expression) { \n    // 为了说明目的而简化的解析逻辑 \n  \
