- pgno: 7
  md: '# # Introduction


    If you have acquired this book, you want to start programming and be logically
    challenged as soon as possible, without wanting to read a sermon on the mount.
    But it is important to highlight a few things before we begin.


    Even though many exercises may be considered easy, if you are new to this programming
    journey, it is important for you to first try to solve the problem on your own
    before looking at the solution. There is more than one possible solution to the
    same problem, and you need to think and develop your own solution. Then, you can
    compare it with the proposed one in the book, identify the strengths of each,
    and try to learn a little more.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'If the exercise is too difficult and you can''t solve it, move on to the next
    one and try again the next day. Don''t immediately jump to the answer, even if
    you can''t solve it, and definitely don''t look at the answer without even attempting
    to solve it.


    Learning programming logic is not about getting the answer; it''s about the journey
    you take to arrive at the answer.


    With that being said, the remaining chapters of this book are divided according
    to the programming topics covered in the proposed exercises.


    From now on, it''s all up to you!'
