  mdcn: "\n\n# 练习 C++\n160 道已解练习，加速你的学习\nRUHAN CONCEIÇÃO\n\n# 练习 C++\n160 道已解练习，加速你的学习\n\
    \nRuhan Avila da Conceição\n\n## 前言\n\n欢迎阅读本书，书中介绍了许多附带答案和注释的 C++ 练习题。在本书中，你将找到超过\
    \ 160 道练习题，旨在帮助你提高在这门强大语言中的编程技能。\n\n学习编程不仅涉及理解理论概念，还涉及将这些概念应用于现实场景中。这正是你将在书中发现的内容：从基础性知识到更复杂的挑战的各种问题。\n\
    \n随着练习的进行，你将面临涉及数学公式操作、字符串、条件判断、循环、向量操作、矩阵等更多任务的挑战。\n\n本书的主要目标是为寻求进步的程序员提供一份实用且全面的资源。无论你是一个想要巩固知识的\
    \ C++ 初学者，还是希望加深专业知识的经验丰富的程序员，这些练习都将作为极佳的学习指南和参考。这本书也适用于那些希望拥有丰富的编程逻辑练习题集，以便为学生创建题目的老师们。\n\
    \n享受这段学习旅程，深入探索这些带答案和注释的 C++ 练习吧。准备好迎接刺激的挑战、创造性的解决方案，以及提升编程技能的独特机会。\n\n本书的内容创作过程中使用了人工智能工具，但所有材料都经过了作者的审核和编辑，以交付最终的高质量产品。\n\
    \n阅读愉快，学习进步，并在探索 C++ 编程奇妙世界中获得乐趣。\n\nRuhan Avila da Conceição.\n\n## 目录\n\n- 引言\n\
    - 基础练习\n- 数学公式\n- 条件判断\n- 重复循环\n- 数组\n- 字符串\n- 矩阵\n- 递归函数\n- 正则表达式\n- 排序算法\n-\
    \ 练习完整列表\n- 额外内容\n- 关于作者\n\n## 引言\n\n如果你购买了这本书，说明你想尽快开始编程并接受逻辑挑战，而不想听布教山上的大篇大论。但在开始之前，强调几点是非常重要的。\n\
    \n尽管许多练习可能被认为是简单的，但如果你是这段编程旅程的新手，那么在看答案之前，首先尝试自己解决问题是非常关重要的。同一个问题可能有多种解决方案，你只需要思考并开发出自己的方案。然后，你就可以将其与书中提出的方案进行比较，识别各自的优点，并尝试多学一点。\n\
    \n如果练习太难且你无法解决，请跳到下一个，并在第二天再次尝试。即使无法解决，也不要立即跳到答案，更不要在没有尝试解决的情况下直接看答案。\n\n学习编程逻辑不在于得到答案，而在于你通往答案所经历的历程。\n\
    \n话如此，本书的其余章节将根据建议练习中涵盖的编程主题进行划分。\n\n从现在起，这一切取决于你！\n\n## 基础练习\n\n1. 编写一个程序在屏幕上打印\
    \ \"Hello World!\"。\n\n```cpp\n#include <iostream>\n```\n\nint main() {\n    std::cout\
    \ << \"Hello World!\" << std::endl;\n    return 0;\n}\n```\n\n2. 编写一个程序，使用两个不同的命令在一行打印\
    \ \"Hello\"，在底部打印 \"World!\"。\n\n```cpp\n#include <iostream>\n```\n\nint main()\
    \ {\n    std::cout << \"Hello\" << std::endl;\n    std::cout << \"World!\" <<\
    \ std::endl;\n    return 0;\n}\n```\n\n# 3. 编写一个程序，仅使用一个打印命令在一行打印 \"Hello\"，在底部打印\
    \ \"World!\"。\n\n```cpp\n#include <iostream>\n\nint main() {\n    std::cout <<\
    \ \"Hello\" << std::endl << \"World!\" << std::endl;\n    return 0;\n}\n```\n\n\
    # 4. 编写一个程序在一行打印 \"Hello\"，在底部打印 \"World!\" 并留出一个空行。\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    std::cout << \"Hello\" << std::endl << std::endl << \"World!\"\
    \ << std::endl;\n    return 0;\n}\n```\n\n# 5. 编写一个程序在一行打印 \"Hello\"，并在最后打印 \"\
    World!\"。\n\n```cpp\n#include <iostream>\n\nint main() {\n    std::cout << \"\
    Hello\" << \"\\nWorld!\" << std::endl;\n    return 0;\n}\n```\n\n# 6. 编写一个程序在屏幕上打印\
    \ \"HellonWorld!\"。\n\n```cpp\n#include <iostream>\n\nint main() {\n    std::cout\
    \ << \"Hello\" << std::endl << \"World!\" << std::endl;\n    return 0;\n}\n```\n\
    \n# 7. 编写一个程序要求用户输入姓名。\n\n```cpp\n#include <iostream>\n#include <string>\n\nint\
    \ main() {\n    std::string name;\n    std::cout << \"Enter your name: \";\n \
    \   std::cin >> name;\n    std::cout << \"Hello \" << name << \"!\" << std::endl;\n\
    \    return 0;\n}\n```\n\n# 8. 编写一个程序顺序读取三个人的姓名，然后是相应的年龄，并以表格格式输出。\n\n```cpp\n\
    #include <iostream>\n#include <iomanip>\n#include <string>\n\nint main() {\n \
    \   std::string name1, name2, name3;\n    int age1, age2, age3;\n\n    // 第一个人的\n\
    \    std::cout << \"Enter the name of the first person: \";\n    std::getline(std::cin,\
    \ name1);\n    std::cout << \"Enter the age of \" << name1 << \": \";\n    std::cin\
    \ >> age1;\n    std::cin.ignore(); // 清除换行符\n\n    // 第二个人的人的\n    std::cout <<\
    \ \"Enter the name of the second person: \";\n    std::getline(std::cin, name2);\n\
