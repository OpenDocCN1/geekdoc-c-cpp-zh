  md: 'available bandwidth $B$. Hence, to derive the required assignments for $P$,
    we consider the following two cases.


    # Case 1: Assignment $\Phi''$ is admissible


    An admissible frequency assignment for $P$ can be derived by using the $\Phi''$
    by means of the following theorem.


    **Theorem 7.** Given the problem $P=(X,W,C)$ and the bandwidth $B$, if the frequency
    assignment $\Phi''$ for $P''$ is admissible, an admissible frequency assignment
    for $P$ can be derived from $\Phi''$.


    **Proof:** To get an assignment of $P$ from $\Phi''$, all the cells in $Y(i)$
    $(0\leq i\leq z-1)$, are assigned the same set of channels assigned to $N(Y(i))$
    in $\Phi''$. This assignment must satisfy the interference constraints because
    in $P''$, $c''(Y(i),Y(j))$ is the maximum among all $c_{ij}$''s in $C$ where $i\in
    Y(i)$ and $j\in Y(j)$. This assignment must also satisfy the demand vector $W=(w_i)$,
    since in $P''$, $M(Y(i))$ is the maximum among all $w_i$''s in $W$ where $i\in
    Y(i)$.


    When it is admissible, $\Phi''$ not only satisfies all the requirements of $P$,
    but also provides some redundant channels. If cell $i$ has been assigned $w''_i$
    channels while the requirement was $w_i$, and $w''_i>w_i$, then $r_i=(w''_i-w_i)$
    number of channels remains unused or redundant in cell $i$. This set of redundant
    channels is represented by the vector $R=(r_i)$. The total number of redundant
    channels $R_{total}$ of the system is


    $$R_{total}=\sum_{i=0}^{n-1}r_i.$$


    **Example 11.** For the problem of Example 6, the derived problem $P''$ has been
    described in Example 10 above. One solution to $P''$ has been obtained by the
    algorithm in [15] (a GA-based algorithm for the second category of CAP) as shown
    in Table 3.10, where entries in row $T_a$ indicate the total number of channels
    assigned to each node and those in row $T_r$ indicate the total number of channels
    actually required.'
