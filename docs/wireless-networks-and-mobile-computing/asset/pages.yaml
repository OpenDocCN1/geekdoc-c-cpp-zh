- pgno: 239
  md: 'In this chapter, we discuss various communication protocols used in ad hoc
    networks (stationary or mobile) for different types of communication requirements,
    e.g., broadcast, gossiping and point-to-point communication among the nodes in
    the network. Broadcast is a process by which a source node transmits a message
    to be received by every node in the network. On the other hand, if every node
    has a different message to be sent to all other nodes in the network, the situation
    is called gossiping [1].


    While discussing the protocols for all these communication requirements, we assume
    that the nodes in an ad hoc network all communicate over only one single channel.
    Under this assumption, it is likely that when one node is trying to send a message
    to its neighbors (nodes within hearing zone of the transmitting node), other nodes
    may also transmit through the common channel during the same time. This may lead
    to a _collision_ of two or more messages at the receiving end. Because of mobility
    and limited battery power of the nodes, it is important to have fast, energy-efficient
    and deterministic (as opposed to randomized) broadcast and gossiping protocols
    for ad hoc networks by resolving collisions efficiently. Such protocols with efficient
    collision resolution mechanisms would provide low end-to-end latency and low overhead
    for retransmission of the collided messages. We first discuss the broadcast problem,
    followed by descriptions of gossiping and point-to-point routing protocols.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# ### 5.2 Broadcast in Ad Hoc Networks


    Broadcast protocols in ad hoc networks may be centralized or distributed and may
    be based on deterministic or randomized algorithms. A broadcast protocol should
    have the following desirable properties:


    +   - The protocol should be *mobility independent* or *mobility resilient* so
    that the broadcast is always completed correctly without knowledge of the identities
    of the neighbors of a node or the mobility of the nodes.

    +   - It should be *deterministic* so that an upper bound on the broadcast completion
    time can be ascertained.

    +   - It should be *distributed* rather than centralized so that the nodes can
    execute the protocol without *a priori* knowledge of the topology of the entire
    network. This property would successfully handle the dynamic network topology
    of an ad hoc network in a more efficient way than a centralized protocol.

    +   - It should be *simple* so that the computational overhead at each node is
    minimized.


    We first describe some deterministic distributed broadcast protocols for which
    we assume a system model as given below.


    # #### 5.2.1 System Model


    Following the ideas of [2, 3], let us model an ad hoc network consisting of *n*
    nodes by an undirected graph *G = (V, E)*, where *V = 0, 1, 2, · · ·, n − 1* is
    the set of vertices and *E* is the set of bidirectional edges. We assume that
    there exists an edge between two vertices if the corresponding nodes in the network
    are in the'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'hearing zone of each other. Note that it is possible that a node $u$ can hear
    some other node $v$, but $v$ is unable to hear $u$ for some reasons (e.g., transmission
    power of $u$ may be too small, sensitivity of the receiver at node $v$ may not
    be sufficiently high, etc.).


    In that case there will be only a directed edge from $v$ to $u$, but no directed
    edge from $u$ to $v$. We, however, exclude this possibility in this chapter unless
    stated otherwise.


    We denote the set of neighbors of a node $i$ by $N(i)$, the maximum degree of
    a node in the network by $\Delta$, and the diameter of the network graph $G$ by
    $D$. Thus,


    $$D = \max_{i,j\in V} d(i,j),$$ where $d(i,j)$ is the distance between two nodes
    $i$ and $j$ of $G$.


    There will be one distinguished node in the network called the source node $s$
    which carries the message to be broadcast to all other nodes in the network. $s$
    initiates the broadcast process. Any node $i$, $0 \le d(s,i) = \ell \le D$ is
    said to belong to the layer $\ell$ of the network starting from the initiator
    source node $s$.


    We assume that the time axis is divided into several *phases*, and each phase
    will consist of $k$ rounds or time slots (numbered from 0 to $k-1$), each round
    having the same time duration which is long enough to complete one hop of communication
    from a node to its neighbor. Phase 1 will start only after $s$ initiates the broadcast
    process.


    During any round, a node can be in the transmitting state (transmitting a message
    to its neighbors), or in the receiving state (ready to receive a message from
    any of its neighbors), or it may remain idle (neither transmitting nor receiving).
    However, a node cannot be in the transmitting state unless it receives some message
    correctly; and once it receives the message correctly, it will switch to the transmitting
    state or may remain idle during any round until the broadcast is completed. A
    node $u$ can receive a message correctly during a round if and only if only one
    of the nodes belonging to $N(u)$ is transmitting the message during that round;
    if more than one node belonging to $N(u)$ is in the transmitting state during
    a round, $u$ experiences a collision and no message can be received by $u$ during
    that round.'
