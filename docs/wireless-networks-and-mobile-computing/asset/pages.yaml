  md: '# ## 8.4 Ternary with Silent Symbol (TSS) Communication Protocol


    We now describe another energy-efficient communication protocol called _ternary
    with silent symbol (TSS)_ [3, 4] which is based on a source coding scheme using
    the ternary number system, along with silent communication. Of the three symbols
    0, 1 and 2 in the encoded message, one symbol (say 0) is made silent while the
    other two (say 1 and 2) are transmitted using a hybrid modulation scheme. In a
    noiseless channel there will be energy savings of 33% in the transmitter due to
    the non-transmission of carrier during the periods of 0. However, in a channel
    with additive white Gaussian noise (AWGN) and a receiver based on non-coherent
    detection, the amount of transmitter energy savings is expected to be less than
    this value as the peak signal power needs to be increased in the presence of the
    noise to distinguish the silent symbol from the no-signal situation of the channel.


    # ### 8.4.1 Basic Idea and Algorithm Descriptions


    Let a given binary message \( B \) be represented by an _n_-bit binary string
    \( b_{n-1} b_{n-2} \ldots b_2 b_1 b_0 \). Let T be its equivalent _m_-digit ternary
    representation given by \( T = t_{m-1} t_{m-2} \ldots t_2 t_1 t_0 \). We assume
    that _n_ is even, otherwise we pad the message with a 0 bit at leftmost, i.e.,
    most significant bit (msb) position. For conversion from binary to ternary, we
    successively scan every two bits of the binary message starting from its msb position
    and then convert the leftmost part of the binary message (starting from its msb
    to the currently scanned bit position) to its equivalent ternary representation.
    To do this, we replace the currently scanned two bits (bit pair) by a single ternary
    digit (0, 1 or 2 depending on whether the binary bit pair is 00, 01 or 10), or
    by two ternary digits (10)<sub>3</sub> (if the binary bit pair is 11), and add
    it to four times the obtained ternary number _T_ from all the previous bit positions
    (on the'
  merge: -1
  img_proc: true
- pgno: 423
  md: 'left of this bit pair). Note that this addition will be in the ternary number
    system, and the multiplying factor four is to adjust the weight of T with respect
    to the currently scanned bit bit pair. Also, since this addition will be in the
    ternary number system, the weight of four can be assigned to T by adding the two
    ternary numbers T0 and 0T. Thus, the equivalent ternary representation of the
    part of the binary message from its msb to the currently scanned bit pair will
    then be obtained as T0 \(\oplus\) 0T \(\oplus\) x, where \(\oplus\) represents
    a ternary addition operator and x is the ternary number equal to 0, 1, or 2 (when
    the scanned bit pair is 00, 01 or 10, respectively), or equal to (10)3 (when the
    scanned bit pair is 11).


    **Example 33.** _Consider the binary number_ 10011100_. First, we get T_=2 _from
    the leftmost two bits_ 10_. Then, for the next two bits, the equivalent ternary
    digit is_ 1_. We add (in ternary) the three numbers_ (20)3_,_ (02)3 _and_ (1)3
    _to get the changed value of T_=(_100_)3 _(which is equal to_ 9 _in decimal corresponding
    to the binary digits_ 1001 _scanned so far). For the next two bits, we get the
    equivalent ternary representation as_ (_10_)3_, which is added to_ (1000)3_(=
    T0) and_ (0100)3_(= 0T) in ternary to get the changed value of T_=(_1110_)3_=_(39)10_.
    Finally, for the bit pair_ 00_, we add_ (_11100_)3 _to_ (01110)3 _to get the equivalent
    ternary number as_ (_12210_)3_=_(156)10_._


    The _Binary2Ternary_ algorithm outlines the steps required to convert a number
    from binary to ternary.


    +   1: **procedure** BINARY2TERNARY(IN bit vector _B_, integer _n_, OUT ternary
    number _T_)

    +   2: _/_** Initialization **/\_

    +   3: **if** _bn_-1_bn_-2=00 **then**

    +   4: _T_ \(\leftarrow\) 0;

    +   5: **end if**

    +   6: **if** _bn_-1_bn_-2=01 **then**

    +   7: _T_ \(\leftarrow\) 1;


