  md: "vided by this approach can be utilized for accommodating small changes in demands\
    \ dynamically is a topic for further study.\n\nWe also described a polynomial\
    \ time algorithm for near-optimal channel assignment in hexagonal cellular networks\
    \ with non-homogeneous demands in a two-band buffering system. The CAP for non-homogeneous\
    \ demands is divided into a number of smaller subproblems, each of which has a\
    \ homogeneous demand from a subset of the nodes of the original network. A simple\
    \ assignment scheme gives priority assignment to the higher demand nodes to solve\
    \ each subproblem. We illustrated this algorithm with the help of the Philadelphia\
    \ benchmark Problem 6, which is regarded as the most difficult one in the literature.\
    \ This algorithm yields an assignment which never takes more than 6% of the optimal\
    \ bandwidth and requires very little execution time (less than 5 milliseconds\
    \ on a HPxw8400 workstation) for most difficult benchmark problems. Thus, this\
    \ algorithm is suitable for real-life situations where fast channel assignment\
    \ is demanded, although a marginal deviation (say, about 6%) from the optimal\
    \ bandwidth may be tolerated.\n\n# 3.8  Exercises\n\n+   1. Describe the mathematical\
