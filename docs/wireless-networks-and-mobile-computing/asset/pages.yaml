  md: '# ## 7.3 Deployment Algorithm


    In each iteration, we compute _VOR_(_P_) [3], and then compute the circumscribing
    circle _C<sub>i</sub>_ of each _vor_(_p<sub>i</sub>_) using the algorithm proposed
    in [4] for each _i_ = 1, 2, ..., _k_. Let _r<sub>i</sub>_ denote the radius of
    _C<sub>i</sub>_. It can be easily verified that to cover a given convex polygon
    completely by a sensor node with minimum range, we need to place the sensor node
    at the center of the circumscribing circle of that convex region, and the range
    assigned to that base station is equal to the radius of the circumscribing circle.
    Thus, for each _i_ = 1, 2, ..., _k_, we move _p<sub>i</sub>_ to the center of
    _C<sub>i</sub>_ and assign range _r<sub>i</sub>_ to it. Next, we compute \(\rho
    = max\{r_i, i=1,2,\dots,k\}\). The stepwise description of the algorithm for an
    iteration is given below.


    +   Input: (* of the _j_-th iteration *)

    +   _k_ points _P_ = {_p_<sub>1</sub>, _p_<sub>2</sub>, ..., _p<sub>k</sub>_}

    +   If _j_ = 1, the members of _P_ are _k_ random points inside the polygon \(\Pi\),
    and if _j_ > 1, the members of _P_ are the output of the (_j_ - 1)-th iteration.


    +   Output: /\* of the _j_-th iteration \*/

    +   The range \(\rho\) obtained in this iteration and

    +   the centers of _k_ circles for the next iteration.


    +   Step 1: Compute _VOR_(_P_).


    +   Step 2: Compute the minimum enclosing circle _C<sub>i</sub>_ of _vor_(_p<sub>i</sub>_).


    +   Step 3: Compute \(\rho = max\{r_i\}_{i=1}^k\), where _r<sub>i</sub>_ is the
    radius of the circle _C<sub>i</sub>_.


    +   Step 4: Output \(\rho\) and the centers of _C<sub>i</sub>_ for _i_ = 1, 2,
    ..., _k_.


    +   Lemma 24. At each iteration, _i_) the newly assigned position of each point
    _p<sub>i</sub>_ lies inside the corresponding _vor_(_p<sub>i</sub>_), and _ii_)
    the value of \(\rho\) decreases.


    +   Proof. (i) The smallest enclosing circle of a convex polygon passes through
    the farthest pair of vertices of the polygon and the line segment joining that
    pair of vertices'
