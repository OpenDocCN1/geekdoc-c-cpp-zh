    # **FIGURE 9.9:** One byte/cycle by hardware pipelining


    erably simplified compared to the design in Section 9.3. To improve the area and
    timing, the KSA circuit is reorganized to merge two iterations of key generation
    in one cycle. The benefit is to have the *S*-box created in 128 instead of 256
    cycles.


    **TABLE 9.5:** Two consecutive loops of RC4 key scheduling


    | First Loop | Second Loop |

    |---|---|

    | $i_1=i_0+1$<br>$j_1=j_0+S_0[i_1]+K[i_1]$<br><br>Swap $S_0[i_1]\leftrightarrow
    S_0[j_1]$ | $i_2=i_1+1=i_0+2$<br>$j_2=j_1+S_1[i_2]+K[i_2]$<br>$\quad=j_0+S_0[i_1]+S_1[i_2]+K[i_2]$<br><br>Swap
    $S_1[i_2]\leftrightarrow S_1[j_2]$ |


    # 9.3.5.1  **Area Optimization in Pipelined Design A**


    The idea of loop unrolling was also fused to merge two consecutive rounds of KSA.
    As a result, the number of read accesses to *K*-box from KSA grew to two. The
    numbers of read and write accesses from KSA to *S*-box are both four due to the
    double swap in one cycle. As discussed in [1], the following area optimization
    approaches can further be adopted.


    **Pipelined Design B:** Modifications are performed on Design A to implement access
    sharing (read and write) for the *S*-box between KSA and PRGA. In Design A, KSA
    contains four read, four write accesses and PRGA contains three read and two write
    accesses to the *S*-box. Naturally, all the accesses from PRGA can be shared with
    ac-'
  merge: -1
  img_proc: true
- pgno: 527
  md: 'cesses from KSA, resulting in a total of four read and four write accesses
    in Pipelined Design B. The synthesis indicated a compact circuit with the same
    throughput.


    **Pipelined Design C**: Another idea for reducing circuit size further is to perform
    only one iteration of KSA per cycle. In this approach, KSA will require 256 cycles
    to initialize the _S_-box and the read and write accesses to _S_-box will become
    two per cycle. By applying access sharing on top of that, the total read and write
    accesses to _S_-box are reduced to three and two, respectively. Furthermore, the
    number of read accesses to _K_-box also drops to one. The synthesis of this circuit
    also indicated a more compact design.


    A sharp reduction in _S_-box and KSA areas for Pipelined Design C in comparison
    with the previous designs was observed. The reduction in the area for _S_-box
    is most prominent as Pipelined Design C directly reduces the area requirements
    for the address decoders and multiplexers, due to fewer _S_-box access ports.
    However, the reduction in _K_-box access ports costs 256 cycles for KSA instead
    of 128 as in the previous two designs. A comparison of the area requirements for
    different circuit blocks in all these designs reported by Sen Gupta et al. [1],
    is presented in Table 9.6; Design 1 refers to the approach described in Section
    9.3.'
