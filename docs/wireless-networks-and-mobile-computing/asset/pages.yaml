- pgno: 349
  md: 'According to this association policy [1], users associating to an AP providing
    the maximum throughput may change to another AP with maximum RSSI depending on
    the available bandwidth. The drawback is that the change may also lead to an imbalance
    in the load distribution.




    In [8], a numerical approach based on stochastic dynamic programming proposes
    to find the optimal association for a network having a small topology consisting
    of two APs only. Using the insights from the association rule for the two-AP problem,
    a near-optimal heuristic named RAT, has been proposed. An objective function is
    defined based on both rate and throughput and then an STA associates with that
    AP for which is objective function is minimized.




    The AP selection and channel allocation are two fundamental access control problems.
    For users in the coverage area of one AP, this involves only channel allocation.
    However, for users that belong in the intersection of coverage areas of more than
    one AP, the selection of an appropriate AP to establish the connection is also
    important. Iordanis et al. [16] proposed a joint approach of AP selection and
    channel assignment with a view to satisfying a given user load vector with a minimum
    number of channels. The authors formulated this joint problem as a clique load
    balancing problem and using this as a guideline, a heuristic algorithm has been
    proposed.


    Traditionally, AP placement and channel assignment are considered sequen-'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'tially. The *AP* placement is often modeled as a facility location problem
    and the channel assignment problem is mapped to a graph coloring problem. Authors
    in [11] argued that treating these two key issues separately may lead to suboptimal
    designs.


    Accordingly, they proposed an integrated model based on mathematical programming
    that addresses both the aspects simultaneously to maximize the net throughput
    that an *STA* can enjoy.


    In [17], *AP* placement and channel assignment were considered jointly to maximize
    the system throughput and fair resource sharing among mobile terminals. However,
    they allowed co-channel overlapping between cells.


