- pgno: 63
  md: 'In a public land mobile network, the two location management functions, i.e.,
    location registration and call delivery required to set up a call are implemented
    by the exchange of signaling messages through a signaling network. Signaling System
    7 (SS7) [2, 3, 4] is the protocol used for signaling exchange which is based on
    a two- level data hierarchy using two types of location registers, the home location
    register (HLR) and the visitor location register (VLR) associated with each MSC
    . A user or an MT is permanently associated with an HLR in its own subscribed
    network (where it is originally registered with all details about the user and
    the types of services to be provided). When an MT moves to another LA controlled
    by a different MSC, the information regarding the current location of that MT
    is kept in the VLR of the MSC controlling its current LA, and the current location
    information of the MT is also communicated to the HLR of the MT (by sending a
    signaling message to the MSC which manages its HLR). Figure 2.2 shows a hierarchical
    view of the corresponding SS7 signaling network where the intermediate nodes STPs
    stand for the signal transfer points used for routing the signaling messages between
    the HLR of the MT and the VLR of its current MSC.




    Location registration updates the current location of the MT in the MSC of its
    current LA and also authenticates the MT with the help of signaling messages from
    the HLR of the MT. There are two commonly used standards for location registration
    and call delivery: i) IS-41 (Interim Standard-41) [5, 6] introduced by the Electronic
    and Telephone Industry Associations EIA/TIA, and ii) GSM MAP (Global System for
    Mobile Communications Mobile Application Part) [7, 6]. IS-41 is popular in North
    America, while GSM MAP is commonly used in Europe, and both these standards are
    based on the above two-level database hierarchy using HLR and VLR.'
  merge: -1
  img_proc: true
