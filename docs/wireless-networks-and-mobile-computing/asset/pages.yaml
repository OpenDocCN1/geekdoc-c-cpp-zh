  md: 'ment at the next step. In contrast, the Brownian mobility model [31] allows
    non-intentional movements of the constituent nodes in which the position of a
    node at the next time step is dependent only on its position at the current time
    step. To be more specific, three parameters are used in this model: $prob_{stat}$,
    $prob_{move}$ and $m$. The $prob_{stat}$ parameter represents the probability
    that a node remains stationary for the entire time of interest. The $prob_{move}$
    parameter represents the probability that a node moves at a given time step and
    finally $m$ defines a square having each side of length $2m$ centered at the current
    position. If a node is at its current position at time step $k$, at the $(k+1)^{th}$
    time step its position will be at some randomly chosen point within this square.
    In effect, the parameter $m$ models the maximum velocity of the mobile node, for
    a given duration of each time step. Because of the short step movements of a node
    at each time step, the movement pattern appears like the movement of a drunken
    person and hence it appears that the nodes following this model make non-intentional
    movements.


    # 2.4.4  Map-based Mobility Model


    In the above three models, nodes are assumed to be free to move around within
    the deployment region $R$. In this model, we assume that the nodes move only along
    specified paths within the region $R$. Examples of such constrained movements
    include driving along roads or highways and people moving along sidewalks on the
    streets. Thus, a road map of the region $R$ is needed in this model. The nodes
    will be randomly deployed on these roads and the movements of the nodes will be
    confined to these defined paths only. An example of a map-based model is the *freeway
    mobility model* proposed by Bai et al. [32] that assumes several freeways with
    varying numbers of lanes in both directions. Nodes will be deployed on the freeway
    in a random manner and they can move along these lanes in specified directions
    only, with randomly chosen velocities which are temporally dependent on their
    immediate'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'previous velocities. However, if two nodes are moving in the same lane and
    within a certain minimum threshold distance (which may be directly proportional
    to the velocity of the following node), the velocity of the following node cannot
    exceed that of the preceding node.


    A variant of freeway mobility model is the *Manhattan mobility model* also proposed
    in [32], in which the movements follow a Manhattan-like map in the region \(R\)
    consisting of horizontal and vertical streets as in a city grid. Nodes can move
    along these streets in both directions. After reaching a point of intersection,
    a node chooses the direction of its next movement: along the same direction or
    along the left road or the right road. The velocity of a node will follow the
    same rules discussed above for the freeway mobility model.


    # 2.4.5  Group-based Mobility Model


    This model [33, 34] is used to mimic certain real-life situations like movements
    of a group of tourists in a city or a group of trekkers on a mountain. The idea
    is that the set of nodes, after being randomly deployed, are divided into clusters
    or groups with a leader for each such group. The group leaders follow one of the
    mobility models as discussed above (e.g., random way point mobility model) and
    the other group members follow the leader with velocities which are small perturbations
    of that of the leader. However, the model adheres to the provision that when two
    groups cross each other, any group member may leave the current group and join
    the other with a certain probability.'
  merge: -1
  img_proc: true
