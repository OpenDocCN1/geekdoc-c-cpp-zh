- pgno: 519
  md: 'In Figure 9.6, $L_i$ denote the latches operated by the trailing edge of $\phi_{2n+i}$,
    i.e., the $(2n+i)^{th}$ cycle of the master clock $\phi$ where $n \ge 0$. For
    example, the latches labeled $L_1$ (four of them) are released at the trailing
    edge of $\phi_1, \phi_3, \phi_5, \ldots$ and the latches labeled $L_2$ (eight
    of them) are released at the trailing edge of $\phi_2, \phi_4, \phi_6, \ldots$
    etc. In the final implementation, these latches have been replaced by edge-triggered
    flip-flops which operate at the trailing edge of the clock.


    The timing analysis for the circuit in Figure 9.6 is shown in the three-stage
    pipeline diagram of Figure 9.7. We illustrate the first two iterations, and the
    remainder fall along similar lines. The combinational logics operate between the
    clock pulses and all read, swap and increment operations are done at the trailing
    edges of the clock pulses. The first two bytes $Z_1, Z_2$ are obtained at the
    end of the third clock cycle and the next two bytes $Z_3, Z_4$ are obtained at
    the fifth clock cycle. We now generalize this observation.


    # Efficiency of the design for PRGA:


    > The hardware for the PRGA stage of RC4 as shown in Figure 9.6, produces one
    byte per clock after an initial delay of two clock cycles.


    Let us call the stage of the PRGA circuit shown in Figure 9.6 the $n^{th}$ stage.
    This denotes the $n^{th}$ iteration of the above model, which produces the output
    bytes $Z_{n+1}$ and $Z_{n+2}$. The first block (Circuit 1) operates at the trailing
    edge of $\phi_n$ and increments $i_n$ to $i_{n+1}, i_{n+2}$. During cycle $\phi_{n+1}$,
    the combinational part of Circuit 2 operates to produce $j_{n+1}, j_{n+2}$. The
    trailing edge of $\phi_{n+1}$ releases the latches of type $L_1$, and activates
    the swap circuit (Circuit 3). The combinational logic of the swap circuit functions
    during cycle $\phi_{n+2}$ and the actual swap operation takes place at the trailing
    edge of $\phi_{n+2}$ to produce $S_{n+2}$ from $S_n$. Simultaneously, the latch
    of type $L_2$ is released to activate Circuits 4 and 5. The combinational logic
    of these two circuits operates during $\phi_{n+3}$, and we get $Z_{n+1}$ and $Z_{n+2}$
    at the trailing edge of $\phi_{n+3}$.'
