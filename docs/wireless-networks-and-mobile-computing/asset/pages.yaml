  md: '# **TABLE 8.14:** Number of slots for VarBaTaC with radix as power of 2 and
    $k = 64$


    | $p$ | radix $r$ | $t_{avg}=\frac{64}{p}\left(\frac{2^p+1}{2}\right)+1$ |

    |---:|---:|---:|

    | 2 | 4 | 81 |

    | 3 | 8 | 100 |

