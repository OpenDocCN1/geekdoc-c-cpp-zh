    # 8.5.2.4  Collision Avoidance Issues


    For contention-based medium access protocols, an issue that arises with the use
    of *N* symbols in the transmitted data is how the neighboring nodes determine
    whether a channel is free for transmission or whether there is an ongoing transmission
    containing a run of silent *N* symbols. An erroneous interpretation of the absence
    of any signal (carrier and/or baseband) can lead to corruption of an ongoing transmission
    (thus leading to retransmission and an increase in energy consumption by the communicating
    node pair) or unnecessary increase in communication delay due to waiting, when
    the channel is actually free.


    To avoid the above mentioned issue, we can use one of the three schemes described
    in Section 8.3.4.3. Following the third scheme described there, a node attempts
    a transmission if it finds the channel silent for, say, eight consecutive symbol
    periods. In *CNS*, eight consecutive *N* symbols correspond to sixteen consecutive
    zero bits in the original message. Thus, occurrence of eight successive *N* symbols
    in the message implies that there is a run of zeros of length 16 in the message.
    Depending on the symbols before and after these consecutive eight *N* symbols,
    the original message may actually have a run of zeros of length 16, 17 or 18 corresponding
    to this occurrence of eight consecutive *N* symbols. Using the results from [39]
    (which'
