    # 8.6.3.5  Energy Savings Analysis


    Now we analyze the extent of energy savings in non-coherent detection using TFNS.
    We assume that the symbol duration of the TFNS-encoded message in TFNS is same
    as that in BFSK. It means that the transmission duration of the TFNS message will
    be smaller than that of the equivalent binary message due to encoding. Considering
    $T_b$ and $T_1$ as the transmission duration of the binary message and its equivalent
    ternary message, respectively, we can write $\frac{T_1}{T_b}=\frac{n}{m}$. This
    is asymptotically (for large $m$) equal to 0.72.


    If we denote the total (scaled) energy in TFNS with non-coherent receiver as $E_1$
    and the energy in non-coherent BFSK as $E_b$,


    $$\frac{E_1}{E_b}=\frac{P_1\times T_1}{P_b\times T_b}=1.038\times 0.72=0.7474
    \tag{8.65}$$


    At the same time, because of the reduced value of $n$ in the TFNS-encoded message,'
