    # 3.7  Conclusion


    We have discussed lower bounds on the required bandwidth for assigning $w$ channels
    to each node of a hexagonal cellular network with two-band buffering for different
    relative values of $s_0$, $s_1$, and $s_2$ [29]. Next we described an algorithm
    based on GA for solving the channel assignment problem in its general form, then
    demonstrated how this technique can be effectively applied to the special cases
    of hexagonal cellular networks with homogeneous demands and two-band buffering.
