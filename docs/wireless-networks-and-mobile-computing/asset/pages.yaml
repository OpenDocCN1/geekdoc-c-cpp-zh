- pgno: 70
  md: 'with minimum overhead on location updates and minimum paging delay may be achieved
    on a per-user basis by optimally selecting the location areas for an MT depending
    on its mobility pattern and call arrival rate.


    If the paging delay is unconstrained, the message traffic arising due to polling
    can be reduced to some extent by sequentially searching the cells in decreasing
    order of probability that the MT is currently residing in that cell [8]. However,
    this requires some prior knowledge about the recent history of movements of the
    MT within that LA. Location updates and paging subject to delay constraints have
    been considered by various researchers [9, 10] and are essentially based on having
    an upper bound on the time required for paging. In [9], a distance-based location
    update mechanism has been assumed and the residing area of the called MT is partitioned
    into a number of smaller areas. When an incoming call for the MT arrives, all
    these subareas are polled sequentially. The number of polling areas is limited
    to some maximum value, say N, so that the total paging delay is limited to the
    time required for N polling operations. Depending on the mobility pattern of the
    MT (which may be decided by a mobility model), call arrival rate and maximum delay
    N, the optimal distance may be computed for distance-based location update. Thus,
    an optimal scheme for a constrained paging delay scheme with distance-based location
    update is complex to implement. However, as in [10], if a movement-based location
    update is used along with the maximum number N of polling operations to limit
    the paging delay, the implementation of the overall scheme for location update
    and paging becomes relatively simple.


    # 2.1.4  Database Architectures


    As discussed above, location registration involves updating the location databases
    with the most recent location information of an MT that is currently available,
    while call delivery requires querying these databases to find the current location
    of a called'
