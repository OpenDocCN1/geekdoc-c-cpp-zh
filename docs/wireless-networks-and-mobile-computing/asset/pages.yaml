    # 2.2  Call Setup in Mobile IP Networks


    All the above discussions on call setup refer to the public land mobile network.
    The location registration and call delivery in a mobile IP network, however, works
    in a different manner *without the use of any location databases* as in a PLMN.
    The standards for communication in a mobile IP network have been developed by
    the IETF (Internet Engineering Task Force) [18]. In such a network, mobile terminals
    in the same subnetwork can send their packets directly, but the terminals belonging
    to'
