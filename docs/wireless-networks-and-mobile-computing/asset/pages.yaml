  md: 'We also assume in this model that all nodes are synchronized on a round-by-round
    basis. Every node will have a phase counter. When a node receives a message $m$,
    it waits for the beginning of the next phase when it sets its phase counter to
    0. From that time onward, the phase counter is incremented by 1 at the end of
    every $k$ rounds. Also, there will be a round counter at each node which will
    be incremented by 1 (modulo $k$) at the end of every round. We assume that the
    network always remains connected and the topology does not change during one broadcast
    process.


    # 5.2.2 Deterministic Transmission Schedule


    To have a distributed deterministic protocol for broadcasting a message originated
    at the source node $s$, we need to find a transmission schedule of every node
    $i$ a priori irrespective of its current set of neighbors $N(i)$ at the moment,
    given the values of only $n$, $\Delta$ and the identifier $(i)$ of the node. Note
    that the neighbor set $N(i)$ of a node $i$ may change due to factors like mobility
    of the nodes, reduced battery power of the nodes and other network conditions.
    Despite these dynamic situations in the network, we need to find a transmission
    schedule for every node, with an ultimate upper bound on the number of phases
    $p$, each phase having an appropriate number of rounds $k$, so that the message
    is correctly broadcast among all nodes of the network. In other words, once we
    can give a protocol requiring at most $p$ phases each of $k$ rounds, the broadcast
    will be guaranteed to be completed in $pk$ rounds of transmissions. Every node
    will execute some function, e.g., $Get\_Rounds$ to get the round numbers in a
    phase during which it should transmit, and will store these round numbers as its
    transmission schedule. After receiving a message $m$, a node should mechanically
    follow this computed transmission schedule to determine whether it should transmit
    the message or remain idle during any round in a given phase.'
