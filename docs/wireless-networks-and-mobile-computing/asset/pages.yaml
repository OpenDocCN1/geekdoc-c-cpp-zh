    The *span* $S(\Phi)$ of a frequency assignment $\Phi$ is the maximum frequency
    assigned to the system. That is,


    $$S(\Phi)=\max_{i,j}\phi_{ij}.$$


    Thus, the objective of the *minimum span* frequency assignment is to find an admissible
    frequency assignment with the minimum span $S_{min}(P)$, where $S_{min}(P)=\min\{S(\Phi)\mid
    \Phi\text{ is admissible for }P\}$. The advantage of this category of algorithms
    is that the derived channel assignment always fulfills all the interference constraints
    for a given demand. However, it may be hard to find optimal solutions for large
    and difficult problems, even with powerful optimization tools [29].


    For the *fixed bandwidth* channel assignment, let $B$ be the given bandwidth of
    the system. Now suppose, due to the bandwidth constraint $B$, only $w''_i$ channels
    are assigned to cell $i$ instead of $w_i$ in an admissible frequency assignment
