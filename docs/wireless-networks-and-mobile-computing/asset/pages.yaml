  md: 'In this section, we compare the performance of CNS with existing techniques
    as discussed below.




    We first compare the performance of CNS with those of CtS [9] and VarBaTaC [10]
    in terms of the transmission length duration. We assume ideal channel conditions
    for this comparison. Because both CtS and VarBaTaC utilize complete silence for
    information communication, their performance degradation in the presence of noise
    will be much more than that suffered by CNS.


    The biggest drawback of the CtS scheme is that the transmission time is exponential
    in the number of bits to be sent. VarBaTaC uses a variable coding base and controls
    the communication time by suitably tuning the base value. Suppose we want to transmit
    a value \( M \), where \( 0 \leq M < 2^k \), \( k \geq 0 \). The representation
    of \( M \) in base \( r \) will have \( m = \lceil \frac{k}{\log r} \rceil \)
    digits. Each of these \( m \) digits is then transmitted using CtS with a pulse
    separating each digit. For \( m \) digits, the number of pulses transmitted would
    be \( m+1 \) and the total time taken in the worst case would be \( (m+1)+m\cdot(r-1)
    \). For example, the decimal value \( (245)_{10} \) in base 16 is \( F5 \). Assuming
    base 16 is used for transmission, the number of pulses required by the VarBaTaC
    scheme would be 3 (i.e., \( 3e_b \) units of energy expenditure) and the total
    duration of transmission would be \( 3+(15+5)=23 \) time slots. To compare VarBaTac
    with CNS, we see that \( (245)_{10} \) in binary is \( 11110101 \). The frequency
    of both the bit pairs \( 01 \) and \( 11 \) is 2. We arbitrarily choose \( 01
    \) to be the \( N \) symbol and map \( 11 \) to the symbol \( A \). Thus the sequence
    to be transmitted in CNS is \( AANN \) and the total duration of transmission
    would be four time slots, with only \( 2e_b \) units of energy expenditure by
    the transmitter for the two \( A \) symbols.


    Let \( t_{avg} \) be the average number of time slots required in the VarBaTaC
    scheme.'
