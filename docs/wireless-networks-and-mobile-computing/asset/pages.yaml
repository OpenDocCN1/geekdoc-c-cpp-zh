    to transmit a 1 or \(\bar{1}\) symbol in TX state. For an _n_-digit RBN data frame,
    considering all possible strings, for \( (n+2)2^{n-2} \) non-zero symbols (1 and
    \(\bar{1}\)) in the TX state, \( P_{\bar{1}\bar{1}} = (n+2)2^{n-2}(t_p - t_\text{rise})I_0
