  md: 'be a reference node or a node whose location has been computed with the help
    of location information of its neighboring beacons.


    Considering thermal noise at the receiver, NLOS errors and channel characteristics,
    the measured range between two nodes *u* and *v* can be expressed as,


    $$r_{uv}=d_{uv}+\eta_{uv}+c\tau_{uv}$$


    (4.1)


    where $d_{uv}$ represents the unknown Euclidian distance between $u$ and $v$.
    $\eta_{uv}$ completely models the combined additive effects of thermal receiver
    noise, signal bandwidth and signal-to-noise ratio. $\eta_{uv}$ has been shown
    to be a zero-mean normal random variable and hence can be measured or pre-computed
    [1]. $\eta_{uv}$ is assumed to be always additive. $c\tau_{uv}$ represents the
    NLOS distance error and is the dominant error contributor [2], $c$ being the speed
    of light in air.


    It will be assumed that beside the ranges measured for location computation, the
    advertised locations of the reference nodes (and beacon nodes in general) are
    erroneous within certain known bounds. The advertised co-ordinates of a reference
    node may have ±ε error along both x-axis and y-axis. The error in a measured range
    can be erroneous by ±δ along both axes.


    # 4.2  Preliminaries


    The above model assumes that errors may be present in the advertised co-ordinates
    of a beacon node (including reference nodes) and in a measured range between two
    nodes. We note that a number of existing location sensing technologies mention
    the accuracy of their location determination processes. This value can be used
    as the ε error in the advertised coordinates of the reference nodes. For example,'
