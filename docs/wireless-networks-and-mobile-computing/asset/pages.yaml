    to this RWp model where \( A, B, C, D, E \) and \( F \) are different mobile terminals.
    The figure shows that the mobile nodes have a tendency to move across the central
    part of the deployment region. Several researchers [28, 29, 30] noted that the
    mobile nodes following the RWp model concentrate near the center of the deployment
    region in the long run. This is known as the _border effect_ of the RWp model.
    The border effect is, however, not exhibited in the random walk model.


    One small variation of the RWp model has been proposed by Bettsletter et al. [29]
    who suggests that the pause time between the time instants of reaching the destination
    point and starting the next move from there can also be randomly chosen following
    an arbitrary probability distribution. Also, some random fraction of the nodes
    in the network may be allowed to remain stationary for the entire duration of
    interest to reflect a more practical scenario.




    The above two models reflect the mobility pattern in a network where the nodes
    make intentional movements, with randomized direction and velocity of each move-'
