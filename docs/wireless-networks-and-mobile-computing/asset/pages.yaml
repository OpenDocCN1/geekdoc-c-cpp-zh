- pgno: 344
  md: '# 6.1.2 Different Association Policies


    When several *APs* are available, the *AP* selection of an *STA* heavily influences
    its performance and those of others. An association policy is an algorithm on
    the basis of which an *STA* is associated to an *AP* within its range. Intensive
    studies have been performed by various researchers to find a feasible association
    between *STAs* and *APs* based on different metrics and objectives. Kumar et al.
    [2] address an optimal association policy between *STAs* and *APs* with the objective
    of maximizing the throughput of the association, but ignored the co-channel interference
    by assuming the proper frequency planning of the *APs*. Many authors advocate
    load balancing to optimize performance. It has been shown [3, 6, 5] that the traditional
    association based on the received signal strength indicator (*RSSI*) measurement
    may lead to poor user experience due to non-uniform load distribution across different
    *APs*. To address this issue, some *AP* access control mechanisms are proposed
    [5, 6]. Bejerano et al. [3] proposed an association model considering both load
    balancing and fairness that includes a complicated central *AP* association mechanism.


    Unlike the traditional *RSSI*, a heuristic has been proposed that helps the users
    to select the *AP* to be associated on the basis of the number of users already
    associated with that *AP* and the mean *RSSI* [4].


    Vasudevan et al. [7] proposed an *AP-STA* association policy based on the bandwidth
    that an *STA* is likely to receive if it is associated with that *AP*. Before
    a user is associated to an *AP*, it estimates the potential bandwidth of neighboring
    *APs* by passive measurement and selects the *AP* with the highest potential bandwidth
    for connection.


    In [12], an *AP* association strategy is proposed. Before an *STA* associates
    to an *AP*, it calculates the minimal throughput for all the *STAs*. The *STA*
    finds its associating *AP* such that the minimal throughput for all the *STAs*
    is maximized.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'In [9], the AP selection is modeled as a many-to-one matching problem in a
    bipartite graph to maximize the total load among all the APs.


    Another association policy [10] taken into account the throughput degradation
    of an STA before it joins an AP. The metric is a weighted sum of the throughput
    provided to the new STA and the average transmission time of STAs already associated
    with the concerned AP.


    Below we describe a few more association policies under various MAC scheduling
    strategies.


    # 6.1.2.1 Strongest Signal First (SSF) Association


    Strongest signal first(SSF) is one of the simplest association policies based
    on the metric of strongest signal-to-noise ratio measured by a received signal
    strength indicator (RSSI). According to this policy, an STA is associated to the
    AP from which it receives the strongest signal. As described in [4], the procedure
    for finding this metric is simple. An STA scans the available channels of each
    AP in the region and listens to the beacon or probe response frames. Depending
    on the country, one to fourteen channels per AP may exist. The STA stores the
    RSSI of the beacon or the probe response frames and other relevant information
    (e.g., whether encryption is on or off). After finishing the scanning procedure,
    the STA selects that AP with the maximum RSSI if the selected AP covers other
    requirements (usually the extended service set identification (ESSID), wired equivalent
    privacy (WEP) encryption) as well. The STA will leave the AP when the RSSI falls
    under a predefined threshold. This procedure is based on the premise that the
    quality of service of the selected AP is the best. However, the result of this
    procedure is that many stations are connected to a few APs, while neighboring
    APs remain idle. This overloading of the APs due to non-uniform load distribution
    will lead to performance degradation [3, 6, 5].'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 6.1.2.2 Maximum Utility-Based Association


    Kumar et al. [2] address an optimal association policy between the $STAs$ and
    the $APs$ in their ranges in which finding an optimal association policy is considered
    the maximum utility-based formulation of the problem. The authors note that an
    $STA$ associates to an $AP$ with a physical bit rate and eventually such an association
    will yield an $STA$ throughput dependent on the specific $MAC$ scheduling used.
    They used two $MAC$ scheduling techniques, namely random polling and proportional
    fair access, to calculate the throughput of an individual association. As per
    random polling access, the set of $STAs$ associated to a common $AP$ achieves
    equal individual throughput. If there are $m_j$ $STAs$ $i_1,i_2,\ldots,i_{m_j}$
    associated with AP $j$ and these are associated with rate $r_{i_pj}$ where $1
    \leq p \leq m_j$, the aggregate uplink throughput obtained by all the $STAs$ served
    by AP $j$ is of the form:


    ```

    $$\frac{m_j}{\displaystyle\sum_{p=1}^{m_j}\frac{1}{r_{i_pj}}}.$$

    ```


    The individual throughput obtained by the $STA$ from AP $j$ can be expressed as


    ```

    $$t_j=\frac{1}{\displaystyle\sum_{p=1}^{m_j}\frac{1}{r_{i_pj}}}.$$

    ```


    For fair allocation of user throughput, they used log utility to formulate the
    aggregate throughput of the network as given by


    ```

    $$\sum_{j=1}^{n}m_j\ln(t_j).$$

    ```


    Based on these facts, the association policy will be optimum when the $STAs$ are
    associated to the $APs$ in range such that the logarithmic sum of the obtained'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'individual throughput is maximized. Basically they used the log utility formulation
    while calculating the individual throughput. The advantage of the association
    policy is that it provides a fair throughput allocation to the individuals.


    # 6.1.2.3  Max-Min Fair (MMF) Allocation


    One well known association policy [2, 3] is known as the *max-min fair (MMF)*
    allocation. As stated earlier, the *STAs* are associated to the *APs* in their
    range by obtaining physical bit rates. A rate vector is *MMF* if there is no other
    vector for which the rate of some node, say *i*, is higher without the rate of
    some other node, say *j*, that has a smaller than or equal to rate than *i*, being
    made lower. *STAs* associated on the basis of *MMF* allocation of their individual
    data rates may obtain uniform or fair throughput allocation. However, such a policy
    may lead to a reduced network throughput [3]. Furthermore, instead of the obtained
    data rate, max-min fair allocation can be formulated with the obtained bandwidth.
    A system provides a fair service if all users have the same allocated bandwidths.
    Unfortunately, such a degree of fairness may cause significant reduction of the
    network throughput, since all users have the same bandwidth allocation as bottleneck
    users. As described in [3], a bandwidth allocation of a weighted system is called
    max-min fair if there is no way to increase the bandwidth of a user without decreasing
    the bandwidth of another user with the same or less normalized bandwidth.


    # 6.1.2.4  Least Load First (LLF)


    Another association policy known as the *least load first (LLF)* association is
    a widely used load-balancing heuristic defined in terms of load of an *AP* [3].
    When an *STA* associates to an *AP*, it imposes a load on that *AP*. According
    to this association policy, an *STA* checks the load incorporated to an *AP* before
    associating it to the *AP*. A user chooses the least loaded *AP*, where an *AP*
    load is inversely'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'proportional to the current bandwidth that its associated users receive. This
    policy may lead to unfair bandwidth allocation and poor load balancing.


    # 6.1.2.5  Min-Max Load Balancing Allocation


    An association policy aiming at providing fair load balancing across the APs is
    *min-max load balancing* [3]. The load of an *AP* needs to reflect its inability
    to satisfy the requirements of its associated users and it should be inversely
    proportional to the average bandwidth that they enjoy. A feasible association
    is min-max load balanced if its corresponding load vector has the same or lower
    lexicographical value than any other load vector of any other feasible assignment.
    According to such a policy, *STAs* are associated to the *APs* with the objective
    of min-max load balancing [3]. Load balancing along with mean *RSSI* can be used
    as the association metric [4]. According to such a metric, users select the *AP*
    on the basis of the number of users already associated with that AP and the mean
    *RSSI* value.


    # 6.1.2.6  Link Rate and Throughput-Based Association


    Link rate and realized throughput together can be considered to formulate an association
    policy [13] for a multi-channel multiple AP network. The objective is to maximize
    the capacity region of the set of *APs* under a dynamic traffic model. Users arrive
    at a point within the network coverage area, associate with an access point, realize
    a download and leave. Network capacity is defined by the limiting load beyond
    which the number of active users would grow indefinitely as the arrival rate in
    some region is greater than the rate at which downloads complete. The limitation
    of such an approach is that using network capacity as a criterion for comparison
    does not necessarily consider how well policies perform at normal loads.'
