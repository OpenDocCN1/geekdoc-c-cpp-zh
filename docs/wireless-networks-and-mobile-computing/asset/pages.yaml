  md: "# 8.6  Tri-Digit Fibonacci Number System (TFNS)  \nCommunication Protocol\n\
    \nWe describe another energy-efficient communication protocol based on a variant\
    \ of Fibonacci number system, called the *Tri-digit Fibonacci number system (TFNS)*,\
    \ coupled with silent communication of the dominant symbol of the encoded message.\n\
    \nIn many engineering applications, the Fibonacci number system (FNS) has been\
    \ used with remarkable success. Such applications include VLSI chip design (in\
    \ minimizing crosstalk among the data buses inside a processor chip [37]), synchronization\
    \ control [35], compression of large sparse bit strings [33] and robust transmission\
    \ of binary strings [32]. Another possible application is in low-power wireless\
    \ communication systems [34, 39, 6] where asymmetry in the numbers of symbols\
    \ to be transmitted through the wireless channel is exploited to minimize the\
    \ transmitter and/or receiver energy required. If the Fibonacci number system\
    \ is used to give positional weights to binary digits for representation of decimal\
    \ numbers, a marked asymmetry may be observed in the numbers of 0’s and 1’s in\
    \ the resulting codewords. These asymmetric characteristics can be exploited for\
    \ saving energy, particularly in low-power wireless sensor networks. However,\
    \ if conventional FNS is used, the number of bits representing a given decimal\
    \ number increases compared to the binary number system. As a result, the savings\
    \ of energy for low-power wireless communication systems may not be substantial.\
    \ A variant of FNS, called the *Tri-digit Fibonacci number system* (TFNS) has\
    \ been proposed by Sinha et al. [40] provides asymmetric distribution in the number\
    \ of 0’s, 1’s and 2’s used in representing all possible numbers, along with a\
    \ substantial reduction in the number of digits. This brings about"
  merge: -1
