  md: 'The following theorem analyzes the time complexity of each iteration of the
    above heuristic algorithm.


    **Theorem 24.** *The worst case time complexity of an iteration is* $O(n + k\log
    k)$.


    *Proof.* The factors involved in this analysis are as follows:


    +   - Computing $VOR(P)$ can be done in $O(k\log k)$ time [3].

    +   - $VOR(P)$ splits the convex polygonal region $\Pi$ into $k$ closed cells.
    Each edge of $VOR(P)$ appears in at most two cells. As the number of edges of
    the region $\Pi$ is $n$, identifying these $k$ cells requires $O(n+k)$ time.

    +   - Computing the minimum enclosing circle of a convex polygon needs time linear
    in its number of edges [4]. Thus, computing $\{C_i, i = 1, 2, \ldots, k\}$, needs
    $O(n+k)$ time.


    The number of iterations needed to reach local optima from an initial configuration
    is reasonably small. The overall time complexity depends on the number of times
    we apply the refinement step.


    # 7.4 Experimental Results


    An exhaustive experiment has been performed with several convex shapes of region
    $\Pi$ and with different values of $k$. For a given initial placement of $P$ the
    value of $\rho$ is decreased at each iteration. As the process reaches local minima,
    the quality of the result depends on the initial choice of the positions of $P$.
    Studies have been made of random distribution of $P$. In an optimal solution,
    the distribution of points is very regular. To get the best possible results,
    the initial distribution of the points was carefully chosen. Thus, while performing
    the experiment with a unit square region,'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'the initial placement of the points in $P$ was chosen as follows: compute $m
    = \lceil\sqrt{k}\rceil$.


    If $m^2 = k$, we split the region into $m \times m$ cells, and in each cell placed
    a point of $P$ randomly. If $(k - m^2) < m$, we split the region into $m$ rows
    of equal width, then arbitrarily chose $(k - m^2)$ rows and split each of these
    rows into $(m + 1)$ cells; the other rows were split into $m$ cells. We then placed
    one point in each cell. If $(k - m^2) > m$, we split the square region into $(m
    + 1)$ rows, and each row was split into $m$ or $(m + 1)$ rows to accommodate all
    the points in $P$.


    For each $k$, authors in [8] considered 1000 initial instances. For each instance,
    they computed the value of $\rho$ by executing the above iterative algorithm.
    Finally, they reported the value of $\rho^*_{opt}$ = minimum value of $\rho$ over
    all 1000 instances. Table 7.1 shows a comparison $\rho^*_{opt}$ with the value
    of $\rho_{opt}$ obtained by the algorithm in [2] for different values of $k$.


    Authors in [8] compared their method with that of [1] when the region to be covered
    was an equilateral triangle. The experimental results for different values of
    $k$ are presented in Table 7.2. Figure 7.1 demonstrates the output of the deployment
    algorithm described above for covering a convex polygon with 13 circles.


    To test the performance of the heuristic used in designing the algorithm, we need
    an idea of the minimum, average and standard deviation of the values of $\rho$
    over all the 1000 instances for different values of $k$ and the unit square region
    as $\Pi$ (see Table 7.3). Thus, column 3 of Table 7.1 is identical to column 2
    of Table 7.3. Das et al. [8] performed the entire experiment in Sun Blade 1000
    workstations with 750 MHz CPU speed, and used LEDA [6] for computing the Voronoi
    diagram. The average time for processing each instance is shown. Similar results
    were observed with equilateral triangle.'
