  md: 'A round of message transmission consists of several control slots, a message
    slot for transmitting the actual message *M*, and three slots for receiving acknowledgments
    from the neighboring nodes as explained below. The control slots are used to guarantee
    collision-free reception of the message by all receiving nodes and their usage
    is defined later. The acknowledgment slots are:


    +   - Slot *S* for receiving a single-bit acknowledgment from the nodes which
    received the message correctly without any collision

    +   - Slot *C* for receiving a single-bit acknowledgment from the receiving nodes,
    if the corresponding receiving nodes detected a *collision* during message slot

    +   - Slot *N* for receiving a single-bit acknowledgment to indicate that it did
    not receive any message (clean or collided) in this round although it received
    a collided message in the previous rounds


    If for a node *u*, the channel status is *null* during any of these three slots,
    we assume that none of the neighbors of *u* have responded in that slot. The presence
    of a clean or collided signal due to one or multiple nodes responding simultaneously
    in any of these *S*, *C* and *N* slots is interpreted as the appropriate acknowledgment
    signal for that slot by the node *u*.


