  md: '# # Wireless Networks and Mobile Computing


    ![](img/6578f6fc95ac71d2c7109e594d9df12f_62_0.png)


    all these activities in more detail for a public land mobile network (PLMN) and
    a mobile IP (mobile Internet protocol) network.




    A schematic diagram of the various operations to be performed for call setup in
    PLMN is shown in Figure 2.1. The _location registration_ module in the Figure
    2.1 updates the location databases of the mobile terminals (MTs) stored at various
    places (e.g., MSCs) of the network and is also responsible for authentication
    of a mobile terminal when a request for location update from an MT is received.
    The _call delivery_ module shown in Figure 2.1 [1] performs the two functions:
    i) querying the databases to find the current MSC which keeps track of the called
    MT and ii) paging different LAs under that MSC to exactly locate the cell within
    which the called MT is currently residing. A detailed discussions on all these
    activities is given below.'
  merge: -1
