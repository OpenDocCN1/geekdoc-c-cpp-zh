  md: 'node 5 has to sum all the temperature values received from all nodes. Assume
    that the temperature values sensed by the nodes 1, 2, 3 and 4 are 5, 9, 3 and
    2, respectively. Node 1 sends its data value 5 to node 2 which adds this value
    to its own sensed data 9 to store the partial sum 14 in its memory. Then node
    3 sends its data value 3 to node 2 which is added to the previous partial sum
    14 to generate the new partial sum 17 at node 2. Node 2 later sends this value
    17 to node 4 (refer to Figure 8.5) which is added to the data value sensed by
    node 4 to get the result 19, which is then sent to collector node 5. Thus, the
    number of communication hops used to send the data values from the nodes 1, 2,
    3 and 4 is only four, spending only $4E_h$ units of energy for these steps. This
    saves $5E_h$ units of energy. Instead of the average temperature, we could have
    computed the maximum or minimum temperature among all points of observation inside
    the auditorium and this scheme would be equally effective in saving energy. However,
    it must be noted that such a method of energy saving in data communication through
    data aggregation will be effective only if the required application allows such
    aggregation. That is, energy saving at the application layer is not a general
    technique and very application specific.


    # 8.2 Some Elegant Physical Layer-Centric Techniques


    Conventional communication strategies utilize energy-based transmission (EbT)
    schemes, which require energy for transmitting each bit of information, whether
    a 0 or a 1. Depending on the transmission strategy, both 0 and 1 are represented
    by non-zero voltage levels or one of the bit values is represented by a zero voltage
    level while a non-zero voltage level is used to distinguish the other bit value.
    An example of the latter is the polar return-to-zero (polar-RZ) transmission scheme,
    where a 0 corresponds to a zero voltage level, while a 1 represents a non-zero
    voltage level.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'However, most existing transmission schemes utilize non-zero voltage levels
    for both 0 and 1 to distinguish between silent and busy channels. Communication
    strategies that require energy expenditure for transmitting both 0 and 1 bit values
    are known as *energy-based transmission* (EbT) schemes. For example, to communicate
    a value of 278, a node will transmit the bit sequence < 1, 0, 0, 0, 1, 0, 1, 1,
    0 >, consuming energy for every bit it transmits. Thus, if the energy required
    per bit transmitted is $e_b$, the total energy consumed to transmit the value
    278 would be $9e_b$.


    In 2005, Zhu and Sivakumar [9] proposed a communication strategy called *communication
    through silence* (CtS), that involved using silent periods instead of energy-based
    transmissions. CtS, however, suffers from the disadvantage of being exponential
    in time. It introduces long delays and adversely affects the network throughput.
    Another problem is maintaining synchronization between sender and receiver over
    long periods of silence. Chen et al. proposed [10] an alternative strategy called
    variable-base tacit communication (VarBaTaC) that uses a variable radix-based
    information coding coupled with CtS for communication. The throughput with VarBaTac
    decreases exponentially with an exponential increase of the radix. Also the hardware
    circuit complexity increases significantly for representing higher radix numbers
    and handling dynamic changes of radix.


    We now describe elegant techniques for energy-efficient communication in low power
    wireless networks, e.g., in wireless sensor networks, mobile ad hoc networks and
    applications which typically involve low cost devices and demand low power operations
    with simple modulation techniques like ASK, OOK and FSK [22]. All these techniques
    are based on some type of source coding along with selective silent communication
    of the dominant symbol (most frequently occurring) after encoding the message.


    With some appropriate source coding, it may be possible to convert a given binary
    bit stream (message) into a stream of $m$ possible symbols ($m > 2$), with one'
  merge: -1
  img_proc: true
- pgno: 382
  md: 'of these $m$ symbols having a higher frequency of occurrence than the remaining
    $m-1$ symbols. Most modern radio devices have multiple states that consume varying
    amounts of power. In general, a radio in *transmit* or *receive* state consumes
    the maximum power while in *active* and *idle* states, it consumes very little
    power. Typically, the radio consumes the least power in idle state but takes longer
    to switch to transmit or receive state from idle state than from the active state.
    Thus, given a biased statistics of the symbols after encoding the message, one
    might choose to transmit the stream of $m$ symbols through an appropriate digital
    modulation scheme in which the transmitter is kept silent during the occurrence
    of the dominant symbol. During these silence intervals, the transmitter can save
    significant energy. The family of phase and frequency modulations such as phase-shift
    keying (PSK), frequency-shift keying (FSK), $m$-ary PSK, $m$-ary FSK and their
    variants are superior to the amplitude-shift keying (ASK) and $m$-ary ASK techniques.
    When one chooses to employ $m$-ary PSK/FSK modulation along with silent intervals
    for the dominant symbol which corresponds to an ASK transmission, the instantaneous
    power levels of the $m-1$ non-silent symbols may have to be increased appropriately
    due to the higher SNR requirements of ASK for the same bit error rate (BER) value
    compared to $m$-ary PSK/FSK. Thus, for a successful energy-efficient communication,
    the difference between the energy saved due to silence and the additional energy
    needed for the increased instantaneous power for $m$-ary PSK/FSK needs to be positive.


    Several successful approaches implementing the appropriate source coding technique
    and silent communication of the dominant symbol, along with suitable modulation
    and demodulation techniques have already been proposed by various researchers
    [39, 3, 4, 6, 5, 40]. We discuss some of these schemes in the following sections.'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# 8.3 Redundant Binary Number Encoding with Silent Zero Communication (RBNSiZeComm)


    This communication scheme is based on encoding the messages to be transmitted
    in a redundant binary number system (*RBNS*). We first discuss *RBNS* basics and
    the frequency distribution of the symbols in all possible messages (assuming that
    every binary string is equally likely to occur as a message to be transmitted)
    in this number system. After that, we describe the communication protocol using
    the concept of silent communication on encoded messages and then evaluate the
    performance of the protocol in terms of energy savings in the transceiver as described
    in [39].


    # 8.3.1 Preliminaries on Redundant Binary Number System


    The redundant binary number system (RBNS) [21] utilizes the digits from the set
    {−1, 0, 1} for representing numbers using radix 2. In the rest of the chapter,
    for convenience, we denote the digit −1 by **1̅**. In RBNS, there can be more
    than one possible representation of a given number. For example, the decimal number
    7 can be represented as either 111 or 1001̅ in RBNS. We utilize this property
    to recode a message string to reduce the number of 1’s in the string while transmitting
    the message. The original binary message can, however, be obtained at the receiver
    end by reconverting the received message from RBN to the binary number system.


    The basic idea of the recoding scheme is as follows: Consider a run of *k* 1’s,
    *k* > 1. Let *ι* be the bit position for the first 1 in this run, *ι* ≥ 0 (bit
    position 0 refers to the least significant bit at the rightmost end). Let *v*
    represent the value of this run of *k* 1’s. Then,'
  merge: -1
  img_proc: true
- pgno: 384
  md: '$v = 2^i + 2^{i+1} + 2^{i+2} + \dots + 2^{k+i-1}.$  (8.1)


    Alternatively, we can rewrite Equation (8.1) as,


    $v = 2^{k+i} - 2^i.$  (8.2)


    Equation (8.2) can be represented in RBNS by a 1 at bit position $(k+i)$ and a
    $\bar{1}$ at bit position $i$, while all the intermediate 1’s between them are
    converted to 0’s. We formalize this observation in the form of the following reduction
    rule.


    **Reduction 1.** *A run of $k$ 1’s ($k > 1$) starting from bit position $i$, is
    replaced by an equivalent representation consisting of a 1 at bit position $k+i$
    and a $\bar{1}$ at bit position $i$, with 0’s in all intermediate bit positions.*


    Observe that for a run of $k$ 1’s, $k > 1$, the savings in terms of the number
    of non-zero digits is $k-2$. Note that the number of non-zero digits remains unchanged
    for $k = 2$. Also, if we consider a string, say 110111, with only one 0 trapped
    between runs of 1’s, after applying reduction rule 1, we would get the string
    $10\bar{1}1001$. Note the presence of the pattern $\bar{1}1$ for this trapped
    0. A second reduction can now be applied to the bit pattern $\bar{1}1$ to replace
    it with $0\bar{1}$. Thus, from $10\bar{1}100\bar{1}$, we get the string $100\bar{1}00\bar{1}$
    with fewer non-zero digits. We thus have a second reduction rule.


    **Reduction 2.** *Every occurrence of the bit pattern $\bar{1}1$ in a string obtained
    after applying reduction rule 1 is replaced by the equivalent bit pattern $0\bar{1}$.*


    The application of reduction rules 1 and 2 warrants a two-pass algorithm. However,
    it is easy to combine the two rules to obtain a single-pass algorithm, as stated
    below.


    ```

    1: procedure RBNSiZeCom(IN bit vector data_frame, IN integer len)

    2:     /* The data frame is converted to RBNS */

    ```'
