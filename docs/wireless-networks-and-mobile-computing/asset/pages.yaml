  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_83_0.png)


    **FIGURE 2.14:** Handoff management process


    When performing an intracell handoff, it is quite possible that an MT is simultaneously
    receiving strong signals from multiple new base stations because of physical proximity
    from all of them. In such a case, some kind of signaling diversity may be used
    by the MT to combine the multiple signals received from those base stations, to
    stay connected to all new base stations. This transient situation is termed *soft
    hand-off*. Eventually, the MT will be handed over to only one of these new base
    stations as may be decided from the direction of movement of the MT and the received
    signal strengths. The connection with the former base station will be cleared
    under this situation after transferring the data packets of any ongoing call to
    the MT that might be buffered during the establishment of this handoff process.
    Also, the MT’s required resources will be allocated from the new base station
    and the routing path for receiving the packets of the ongoing calls will be determined.
    At this point, a *hard handoff* of the MT from the old base station to the new
    one occurs. All these steps involved in handoff management are represented in
    Figure 2.14 [1].


    For a smooth handoff process, it is essential that when a mobile user is changing
    its point of attachment (base station in a PLMN or an Internet access point (AP)
    in a'
