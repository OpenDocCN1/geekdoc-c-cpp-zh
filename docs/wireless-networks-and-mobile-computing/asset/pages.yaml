  md: 'sending agent advertisement messages. There are two mechanisms which may be
    used by the MN to detect its movement from one subnet to another as given below:


    +   1. Advertisement Lifetime: There is a _lifetime_ field in the main body of
    the Internet Control Message Protocol (ICMP) router advertisement portion of the
    agent advertisement. The MN records this information for the lifetime of the binding
    with the current CoA, until the lifetime expires. When the lifetime expires, the
    MN must attempt to solicit a new agent.


    +   2. Network Prefix: This scheme uses a network prefix consisting of some number
    of initial bits in the IP address to detect movement. If the prefix received through
    the agent advertisement differs from the prefix in the current CoA of the MN,
    the MN decides that it has moved to a different AP.


