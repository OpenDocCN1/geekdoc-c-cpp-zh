  md: 'be applicable to the nodes in a mobile ad hoc network (MANET) or a wireless
    sensor network (WSN).


    # 2.4.1  Random Walk Mobility Model


    According to the model proposed by Royer et al. [22], a mobile user chooses a
    random direction in the interval [0, 2π] and a random velocity within some range,
    say [vₘᵢₙ, vₘₐₓ], to make a movement from a certain point in a closed region R.
    When the mobile user reaches the boundary of R, it again chooses some other random
    direction and velocity to move from that point, and so on. Thus, this model effectively
    assumes obstacle-free random movement for every individual MT (or MN) leading
    to a uniform spatial distribution of mobile nodes within region R during any simulation
    run.


    There are some variants of this model proposed in the literature. The first proposes
    that a mobile node is bounced back from the boundary when it reaches a boundary
    point of the region R [23, 24]. A second variant allows a mobile node to move
    in a randomly chosen direction at a randomly chosen velocity for a time duration
    which is exponentially distributed and then the mobile node will again change
    its direction, velocity, and duration of movement with these chosen direction
    and velocity.


    A third variant, known as the *Gauss-Markov mobility model* [25] involves the
    assignment of an initial speed and a direction of movement to each mobile node.
    After a fixed time interval, the speed and direction of each mobile node for the
    next interval, say nᵗʰ time interval, are determined from the speed and direction
    at the previous time interval (i.e., (n−1)ᵗʰ interval) using two statistically
    random variables Sₓ and Dₓ (for speed and direction, respectively) that follow
    Gaussian (normal) distribution and some tuning parameter α, 0 ≤ α ≤ 1 that determines
    the relative contribution by the current status and the variability in node movement.
    Specifically,'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'the values of speed $S_n$ and direction $D_n$ at the $n^{th}$ time interval
    are calculated based on the values of speed $S_{n-1}$ and $D_{n-1}$ at the $(n-1)^{th}$
    time interval with incremental random changes from the following equations:


    $$S_n = \alpha * S_{n-1} + (1 + \alpha) * \bar{S} + \sqrt{(1 - \alpha^2)} * S_{x_{n-1}}$$  (2.1)


    $$D_n = \alpha * D_{n-1} + (1 + \alpha) * \bar{D} + \sqrt{(1 - \alpha^2)} * D_{x_{n-1}},$$  (2.2)


    where $\bar{S}$ and $\bar{D}$ are the mean values of speed and direction, respectively,
    and $S_{x_{n-1}}$ and $D_{x_{n-1}}$ are values of two random variables $S_x$ and
    $D_x$ at the $(n - 1)^{th}$ time interval.


    # 2.4.2  Random Way Point Mobility Model


    This is one of the most popular mobility models and is implemented in the $ns2$
    simulator [18]. This model (also referred to as the *RWP model* in the literature)
    was proposed by Johnson and Maltz [23] to study the performance of the DSR protocol
    used for routing in ad hoc networks. Its main difference from the random walk
    model is that instead of choosing a random direction for movement, the mobile
    node chooses a destination point at random in a given region $R$. Then, with a
    randomly chosen velocity from a given interval, say $[v_{min}, v_{max}]$, the
    mobile node starts moving toward this randomly chosen destination point or *way
    point*. After reaching this way point, it remains stationary (pause time) for
    a predefined period (this is another point of difference from the random walk
    model), and then repeats the above steps to make another movement from that point.
    This RWP model also allows obstacle-free movements of individual mobile nodes
    in a given region $R$ which may represent the movement pattern of a person moving
    in a shopping complex, market place, or convention site.


    Figure 2.15 is a representative diagram showing the mobility pattern according'
