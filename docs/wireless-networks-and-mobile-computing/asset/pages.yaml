    # 2.3  Handoff Management


    In Chapter 1, we mentioned three distinct stages for handoff: i) handoff initiation,
    ii) new connection generation and iii) data flow control. Actually, handoff initiation
    depends on the received signal strength by the MT from the BS and vice versa.
    This leads to two types of handoff situations: intracell handoff and intercell
    handoff. Intracell handoff may be initiated when the user moves even in the same
    cell, but the signal strength falls below the threshold value due to changed network
    surroundings (e.g., obstacles or reflecting walls, etc.) for reliable communication
    to be maintained between the BS and the MT. In this case, after the handoff, the
    ongoing call to the MT will be continued over a newly allocated channel through
    which the signal strength received by the MT from the BS and vice versa will be
    more to sustain a reliable communication. The intercell handoff is initiated when
    the MT moves from one cell to an adjacent cell so that the signal received from
    the old BS is of smaller strength than that from another BS in the direction of
    its movement.'
