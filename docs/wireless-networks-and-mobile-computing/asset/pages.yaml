  md: 'Kitsos et al. [11] and Matthews [17]. Combining the KSA and PRGA architectures
    in the above design approach, we can obtain 2N output-stream bytes in 2N + 259
    clock cycles, counting the initial delay of 1 cycle for KSA and 2 cycles for PRGA.
    The hardware implementation of RC4 described in [11] and [17] provides an output
    of N bytes in 3N + 768 clock cycles. A formal comparison of the timings is shown
    in Table 9.4. We can easily observe that for large N, the throughput of the design
    mentioned above [1] is three times that of the designs proposed in [11] and [17].


    An exact comparison of area with [11] is not possible since we do not have access
    to the FPGA board for which the area of [11] is reported. Considering the design
    idea, both [11] and [17] modeled their storage using block RAMs. This implementation
    restricts the number of port accesses per cycle. To overcome that, three 256-byte
    dual-port RAM blocks are used in [11]. Even then, the design requires three cycles
    to produce 1 byte of data. An improved design is reported in [17] where only two
    256-byte dual-port RAM blocks are used. Sen Gupta et al. [1] utilized register-based
    storage for the S and K arrays instead of RAM because RAM-based storage would
    incorporate port access restrictions and latency issues, resulting in a compromise
    of throughput. An alternative technique to maintain the high throughput with RAM
    based implementation may be partitioning the arrays according to the accesses
    and optimizing them accordingly.


    Matthews [18]. This design proposes a 1-byte-per-cycle design of RC4 hardware
    using a technique different from that used by Sen Gupta et al. [1]. The claimed
    throughput is achieved in [18] by a hardware pipeline; instead of two iterations
    per cycle, one iteration per cycle in PRGA is performed. The pipeline design is
    as shown in Table 9.3.4 (as in [18, Table 1]). This design provides 1-cycle-per-byte
    output in PRGA and completes KSA in 256 cycles, with an initial lag of three cycles
    due to the four-stage pipeline structure (as in Table 9.3.4). Thus, N bytes of
    output are produced in approximately N + 259 clock cycles, which is comparable
    to the performance'
