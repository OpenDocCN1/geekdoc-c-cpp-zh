    # 8.3.4.4  Effect of Device Characteristics


    For most commercially available radio devices, the power drawn in the *transmit*
    or *receive* state is considerably more than the power drawn in the *idle* or
    *active* state - i.e., when the radio is in *low power operation mode* [22]. The
    penalty paid for this low power operational state is the switching time from the
    active to transmit state and vice versa. However, this does not limit the applicability
    of the *RBNSiZeComm* protocol in a WSN, which essentially is classified as a low
    data rate one. With chips having faster switching time, the data rate can be increased.
    We now investigate the effect of the device characteristics on the energy saving
    aspect of the *RBNSiZeComm* protocol. We will use the terms *idle* and *active*
    interchangeably to refer to this low power operation state.


