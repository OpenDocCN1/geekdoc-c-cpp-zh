    During recent years, wireless communication has emerged as the most widely used
    technology in various application domains involving almost all spheres of our
    daily activities. Most notable of these applications is, of course, the mobile
    telephone system which has proved extremely useful and popular worldwide. Starting
    with about 200 million registered mobile users in 1997 [1], the number of users
    of the mobile telephone system increased to more than five billion by early 2014.


    However, prior to the introduction of mobile telephone systems, wireless communication
    technology was also used extensively in other household and commercial devices
    like cordless telephones, remote controls for TV sets, cordless microphones, and
    so on. Over the past two decades, the world has experienced a phenomenal growth
    in communication science and technology, particularly in optical communication
    and wireless communication. Many types of communication networks like ZigBee networks,
    Wi-Fi networks, cellular mobile networks, ad hoc networks, sensor networks and
    many other such networks based on wireless communication technology have been
    introduced for real-life applications ranging from personal communication, entertainment,
    to rural and urban healthcare, smart home building, inventory control, surveillance,
    police and security control, military and defense systems, and'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'so on. A brief review of various application areas of wireless communication
    technology is given in the following section.


    # 1.1 Applications Involving Wireless Communication


    # 1.1.1 Cordless Telephones


    A cordless telephone is a replacement of the handset cord of a landline telephone
    receiver set by means of a radio link so that the handset can be physically detached
    from the remaining part of the receiver set (may be considered the _base station_
    of the cordless telephone) [2]. This modified handset communicates with the base
    station which, in turn, is connected to a fixed telephone line. The communication
    range of the handset is usually very small, just sufficient for covering short
    distances within a room or building. Unlike a corded telephone, a cordless telephone
    needs supply of power from the mains for its base station to work. The cordless
    handset is powered by a rechargeable battery, which is charged when the handset
    is placed on its cradle.


    In 1994, digital cordless telephones operating around 900 MHz frequency range
    were introduced. Use of digital signals enabled the phones to be more secure (decreased
    eavesdropping) than those using analog signals. In 1995, the digital spread spectrum
    (DSS) technique was introduced for cordless phones. This technology enabled the
    digital information between the receiver and the base station of the cordless
    telephone to be spread in pieces over several frequencies , thereby making it
    very difficult for anyone to eavesdrop on the cordless conversations.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'A cordless microphone has no physical cable connecting it directly to the sound
    recording or amplifying equipment with which it is associated [3]. This is also
    alternatively known as a radio microphone or a wireless microphone. Its body contains
    a small, battery-powered radio transmitter which transmits the audio signal from
    the microphone by modulated radio waves to a nearby radio receiver unit, which
    recovers the audio from the received radio signal by appropriate demodulation
    technique. The rest of the audio equipment is connected to the receiver unit by
    a cable. Cordless microphones are widely used in the entertainment industry, television
    broadcasting, seminars and interviews to allow the audience to speak and also
    the interviewers or performers or entertainers to move about freely while using
    a microphone to amplify their voices.


    There are many different standards, frequencies and transmission technologies
    used to replace the microphone’s cable connection and make it into a cordless
    or wireless device. Users may transmit, for example, radio waves over the UHF
    (300 MHz to 3 GHz) or VHF (30 MHz to 300 MHz) frequency bands and use FM, AM,
    or various digital modulation schemes. Some low cost models may, however, use
    infrared light. Infrared microphones require a direct line of sight communication
    between the microphone and the receiver, while the costlier radio frequency models
    do not have such constraints. Some models operate on a single fixed frequency,
    but the more advanced models operate on a user selectable frequency to avoid interference
    and allow the use of several microphones in nearby places at the same time.




    Wi-Fi, also spelled Wifi or WiFi [4], is a technology that allows electronic devices
    to exchange data or connect to the Internet through wireless communication using
    2.4 GHz signals (in the UHF band) or 5 GHz signals (in the super high frequency
    or SHF'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'band of 3 GHz to 30 GHz). Wi-Fi is also used synonymously to indicate a wireless
    local area network (WLAN) based on the IEEE 802.11 protocol.


    Many devices can use Wi-Fi, e.g., personal computers, laptops, video-game consoles,
    smartphones, some digital cameras, tablet computers and digital audio players.
    These can connect to a network resource such as the Internet via a wireless network
    access point. Such an access point (or hotspot) has a range of about 20 meters
    (66 feet) indoors and a greater range outdoors. Hotspot coverage can cover an
    area as small as a single room with walls that block radio waves or as large as
    many square kilometres achieved by using multiple overlapping access points.


    Wi-Fi can be less secure than wired connections (e.g., Ethernet) because an intruder
    does not need a physical connection to such a network. Web pages that use the
    secure sockets layer (SSL) - a protocol used above the transport layer for encrypting
    information over the Internet, are secure but unencrypted Internet access can
    easily be detected by intruders. Because of this, Wi-Fi has adopted various encryption
    technologies. The early WEP (wired equivalent privacy) encryption, introduced
    in 1999 for IEEE 802.11 wireless networks has been proven easy to break. Higher
    quality protocols such as WPA (Wi-Fi protected access) and WPA2 were introduced
    in 2003 and 2004, respectively.


    # 1.1.4  ZigBee Networks


    ZigBee [5] is a specification for a suite of high level communication protocols
    used to create personal area networks built from small, low-power digital radios.
    It was conceived in 1998, standardized in 2003, and revised in 2006.


    ZigBee is used in applications that require a low data rate, long battery life,
    and secure networking. It has a defined rate of 250 Kbit/s, best suited for periodic
    or intermittent data or a single signal transmission from a sensor or input device.
    Typical applications include wireless light switches, electrical meters with in-home
    displays,'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'traffic management systems, and other consumer and industrial devices that
    require short-range wireless transfer of data at relatively low rates.


    ZigBee is based on the IEEE 802.15 standard. Though low-powered, ZigBee devices
    can transmit data over long distances by passing data through intermediate nodes
    (devices) to reach more distant ones in the network. The ZigBee network layer
    supports star, tree and generic mesh networks. Every network has a coordinator
    node. Within star networks, the coordinator must be the central node. Trees and
    meshes allow the use of ZigBee routers to extend communication at the network
    layer.


    ZigBee networks are secured by 128-bit symmetric encryption keys. In home automation
    applications, transmission distances range from 10 to 100 meters line-of-sight
    (LOS), depending on power output and environmental characteristics.


    The technology defined by the ZigBee specification is intended to be simpler and
    less expensive than other wireless personal area networks (WPANs) using Wi-Fi
    or Bluetooth standards (Bluetooth is a wireless technology standard for exchanging
    data over short distances using short wavelength UHF radio waves in the ISM (industrial,
    scientific and medical) band from 2.4 to 2.485 GHz introduced by telecom vendor
    Ericsson in 1994 as wireless alternative to RS-232 data cables).


    ZigBee operates in the ISM radio bands: 868 MHz in Europe, 915 MH in the USA and
    Australia and 2.4 GHz in other countries. Data transmission rates vary from 20
    Kbps in the 868 MHz frequency band to 250 Kbps in the 2.4 GHz frequency band.


    ZigBee builds upon the physical layer and media access control defined in IEEE
    Standard 802.15.4 (2003 version) for low data rate WPANs . The specification goes
    on to complete the standard by adding four main components: network layer, application
    layer, ZigBee device objects (ZDOs) and manufacturer-defined application objects
    that allow for customization and favor total integration. The ZDOs are re-'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 1.1.5 Cellular Mobile Networks


    sponsible for a number of tasks, which include executing the device roles, management
    of requests to join a network, device discovery and security.


    As already mentioned above, mobile telephone systems have emerged as the most
    widely used and popular technology over the last few years. This is mainly based
    on the cellular mobile networks in which the geographical region under consideration
    is spatially divided into a number of cells that may be either overlapping or
    non-overlapping. A *base station (BS)* (also known as a *base transceiver station
    (BTS)*) is established in each cell (Figure 1.1) which coordinates the activities
    of all mobile phones (also commonly termed as mobile terminals (MTs)) residing
    in that cell. Each mobile phone in the cell communicates through this base station
    via a wireless channel assigned by the base station. In Figure 1.1, two MTs *X*
    and *Y* are shown in two cells and both communicate to the BSs in their respective
    cells. Several such base stations may be concentrated at a *base station controller
    (BSC)* and several such BSCs may be connected to a *mobile switching center (MSC)*
    to constitute a hierarchical network structure. Such a structure makes the design
    and development of the network easy, and makes it easy to manage the mobility
    of the MTs. A hierarchical structure also makes it easy to maintain the network
    in case of any failure, update or modification of the network components. The
    connection links from the BSs to BSCs and from the BSCs to the MSCs are usually
    through wireline links.


    Several techniques such as frequency-division multiplexing (FDM), time-division
    multiplexing (TDM) and code-division multiplexing (CDM) can be used to distribute
    the available radio spectrum into appropriate communication channels. More efficient
    techniques based on combining the above can also be designed to allocate the available
    radio spectrum among several users. A channel can simultaneously be used by multiple
    base stations if their separation is sufficient to satisfy the inter-'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Wireless Networks and Mobile Computing


    ![](img/6578f6fc95ac71d2c7109e594d9df12f_28_0.png)


    ference constraints. With the advances in technology, there has been an increasing
    demand from mobile users for multimedia services like voice, text, still image
    and video over wireless networks. On the other hand, the available bandwidth required
    for such multimedia data communication for a large number of mobile users is very
    limited. Such a limited availability of the radio spectrum, signal distortion
    and the interferences caused by the environment and other mobile users impose
    an inherent restriction on the capacity of such wireless networks. Therefore,
    developing methods to utilize the scarce radio spectrum efficiently is more critical
    than ever.


    Interference is a function primarily of transmitter power, receiver sensitivity,
    antenna gains, and channel loss. Channel loss is a function of distance, frequency
    and weather, and is quantified by the minimum acceptable signal-to-noise ratio.
    Assuming that most of these factors are already determined or beyond our ability
    to influence, the interference can be defined directly as a function of frequency
    and distance. Based on that, three types of interference are generally taken into
    consideration which can be avoided by satisfying the following constraints: i)
    co-channel constraint, due to which the same channel cannot be assigned to certain
    pairs of cells'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'simultaneously, ii) *adjacent channel constraint*, for which adjacent channels
    cannot be assigned to certain pairs of cells simultaneously, and iii) *co-site
    constraint*, which implies that any pair of channels assigned to the same cell
    must be separated by a certain number of channels [7].


    The task of assigning frequency channels to the cells satisfying the interference
    constraints and using as little bandwidth as possible is known as the *channel
    assignment problem* (CAP). In its most general form, the CAP is equivalent to
    the generalized graph coloring which is a well known NP-complete problem [10,
    11, 12]. In a subsequent chapter, we provide detailed discussion about this channel
    allocation problem in cellular mobile networks.


    # 1.1.6 Ad Hoc Networks


    Based on the application scenario, the common ways to design wireless networks
    are: i) infrastructure-based networks, ii) infrastructure-less networks and iii)
    hybrid networks which uses a mix of both infrastructure and infrastructure-less
    network components. The cellular mobile network discussed above is an example
    of an infrastructure-based network where base stations are the existing infrastructures
    in the network. Absence of such base stations in a network leads to an infrastructure-less
    network of which the ad hoc network is an example. In such an ad hoc network,
    the component telephone devices themselves create a communicating network of their
    own, without the support of any base station. Such ad hoc networks may be static
    (where the component units may not change their geographical positions) or dynamic
    (the component telephone units may be mobile, changing their geographical positions
    with time). An ad hoc network of mobile telephone devices or handsets is commonly
    known as a *mobile ad hoc network (MANET)*. Nodes in an ad hoc network usually
    communicate through a single channel by means of broadcasting or multicasting
    of data over the network.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Ad hoc networks are particularly useful where an infrastructure, (e.g., a base
    station) is difficult, if not impossible, to set up due to unfriendly terrain
    conditions, or in a disaster situation where the infrastructure has been destroyed
    or damaged. Accordingly, these networks have proven very effective in disaster
    management, military and surveillance operations, communication in underground
    mines and communication under seas.


    Due to the absence of any infrastructure, ad hoc networks may be considered as
    distributed systems with no arbiters. However, the computing facilities with such
    portable or mobile devices are also limited in terms of available memory, processing
    capability and speed of computation. Moreover, each component node is operated
    by a battery to allow mobility of the nodes. This makes the network highly energy
    constrained.


    Due to the energy constraint, a component node of an ad hoc network may go out
    of the network if it runs out of battery power. That is, this node will no longer
    be a part of the network and this situation may effectively be abstracted by a
    node failure in the network. Similarly, in a MANET where the nodes have mobility,
    if a node moves out of the communication range from all of the remaining nodes
    of the network, that node will be disconnected from the rest of the network. This
    situation may be abstracted by a link failure in the network. On the other hand,
    new nodes are allowed to join an ad hoc network (static or mobile) at any time,
    establishing connection links to some node(s) already existing in the network.
    All these facts make the topology of an ad hoc network and a mobile ad hoc network
    highly dynamic in nature. The communication protocols developed on such networks
    must consider this dynamic network topology arising from energy-constraints, mobility
    and new arrivals in designing a robust communication network.'
  merge: -1
  img_proc: true
