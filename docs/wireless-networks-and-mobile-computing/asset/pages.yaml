  md: 'As noted in Chapter 1, security is an important concern in all applications
    of wireless communication. There are different possible types of security threats
    in a wireless communication network, whether cellular, ad hoc, cognitive radio
    network, or wireless sensor network. Such threats threaten a network in multiple
    ways. An attacker may be a node of the network (called an intruder), or may be
    a node outside the network. For example, if we are concerned about message communication
    amongst the nodes of a MANET, an internal attacker may be a misbehaving or adversary
    node which is a member of the same network, while an external attacker may be
    a node which is not an integral part of the network.




    Internal attacks may be of several types. For example, a node of the network may
    misbehave in such a way that it receives all messages coming from its neighbors,
    but never responds to those messages or never forwards them to their destinations.
    Thus, effectively, this attacker node behaves like an infinite sink for all messages.


    Another kind of internal attack may be a reverse activity in the form of sending
    unnecessary or duplicate messages to other nodes of the network which would cause
    undue flooding of the network with useless messages, consuming a lot of communication
    bandwidth and node energy, thus disrupting or delaying the message communications.
    Some nodes may become non-operational if they are depleted of their stored battery
    energy due to undesirable flooding in the network.


    In a third kind of more intelligent attack by an internal node, the attacker selectively
    suppresses received packets that are not forwarded to their destination nodes,
    The attacker node may also misdirect the packets and prevent them from reaching'
  merge: -1
  img_proc: true
- pgno: 499
  md: 'their true destinations by changing their destination addresses. Packets may
    be selected randomly or, more intelligently, by critical examination of their
    contents and limiting selection to packets containing important information.


    A fourth kind of attack may be a little different. The attacker node misdirects
    a packet with changed route information in the message so that the packet moves
    around a local loop. Thus, the packet never reaches its destination, but the network
    resources of communication bandwidth, node energy, etc., are continuously wasted.
    This kind of attack is more serious than the third kind mentioned above.


    In a fifth type, an internal node may be *jamming* by continually transmitting
    high intensity radio signals of the same frequency as that used by all the nodes
    in the network so that other nodes are unable to transmit their packets (for collision-free
    transmission) or nodes are unable to receive packets correctly due to the interference
    created by noise signals from the attacker node (bit-error rate of the receiver
    may be reduced due to reduced SNR). To measure the performance of the network
    under noisy situations, we usually define two parameters:


    +   - **Packet Sending Ratio (PSR)** on the transmitter side, which is equal to
    *s/n*, where *s* is the number of packets actually sent by the transmitter (within
    a specified time-out period), given a total number of *n* generated packets (which
    are intended to be sent).

    +   - **Packet Delivery Ratio (PDR)** on the receiver side, which is equal to
    *r/s*, where *r* is the number of correctly received packets out of the total
    of *s* packets sent by the transmitter.


    Due to such jamming signals, both *PSR* and *PDR* are likely to be reduced. This
    type is called *constant jamming* to distinguish it from the other types of jamming
    which arise from the attack of the second type above. Note that the second type
    of attack has a flavour of jamming as transmission of regular packets is hampered
    by'
  merge: -1
  img_proc: true
- pgno: 500
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 501
  md: 'data about the nodes which are very important in the network, e.g., which are
    often used as destinations of other nodes in the network. This information may
    be later used by the attacker for disrupting the communication to such important
    nodes.


    Usually, the first five types of internal attacks causing denial of service are
    also called active attacks; the last two types are called passive attacks in the
    literature.


    # ## 9.1.2 External Attacks


    An external attack arises from an unauthorized node, i.e., a node which is not
    a part of the network. In the first type, the external attacker node injects a
    strong jamming signal in the communication band of a network, similar to constant
    jamming mentioned above. If an external node has enough information (from unauthorized
    sources) about the physical layer (communication band, modulation and demodulation
    mechanisms, etc.), MAC layer protocol and network layer protocol, it can generate
    false packets and insert those packets into the network continuously or at random
    intervals of time or as and when a packet is being transmitted over the channel,
    like similar attacks by an internal node. Packets injected by an external attacker
    node may eventually be ignored if the network has an appropriate authentication
    technique (which is often the case). The danger is that such an activity consumes
    a lot of network resources like communication band and node energy. However, considering
    that authentication will eventually be used by the network for allowing a node
    to take part in communication, an external attacker actually stands a very small
    chance of acceptance of its inserted packets by the nodes in the network. Based
    on this ultimate consequence, an external attacker may better choose to follow
    only constant jamming, generating random noise signals to jam the network, without
    taking the trouble of generating false or misguiding packets and trying to inject
    them in the network. It will suffice for an external attacker to create the desired
    denial-of-service through these jamming signals only.'
