  md: 'While solving an optimization problem using a genetic algorithm, the parameter
    set of the optimization problem must be coded as a finite-length string or chromosome
    over some finite alphabet \( Q \) [47]. A collection of \( M \) (finite) such
    strings or chromosomes is called a population. A simple genetic algorithm is composed
    of three basic operators: i) reproduction or selection, ii) crossover, and iii)
    mutation [47]. A genetic algorithm (GA) starts with an initial population (randomly
    generated) and in each iteration, a new (hopefully improved) population of the
    same size is generated from the current population by applying the above-mentioned
    operators on the strings of the current population. The newly generated population
    is then used to generate the next (possibly improved) population and so on.


    Let \( S_b \) be the best string (with respect to the fitness value) of the population
    generated up to iteration \( t \). In the elitist model of genetic algorithm (EGA),
    if \( S_b \) or any string better than \( S_b \) is not in the population generated
    in iteration \( (t + 1) \), we include \( S_b \) in the \( (t + 1)\)-th population
    [47]. We describe below this technique for solving the channel assignment problem
    as given in [29] which ensures that the population is improved in successive iterations.'
