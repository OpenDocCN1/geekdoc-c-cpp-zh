    # 4.5.3 Complexity Analysis


    The operations *compute_region* and *improve_region* both need \(O(\Delta)\) time
    in the worst case, where \(\Delta\) is the maximum node degree in the network.
    Also, the operation *Get T* needs \(O(\Delta)\) time. If we assign a distinct
    time slot to each node depending on its unique *id* number [15] to avoid collision,
    each iteration of the *repeat* loop would need \(O(n)\) time slots. From Theorem
    15, the algorithm terminates when an all-to-all broadcast of the sets \(RR\) and
    \(Ref_n\) is achieved. Assuming that the effect of the viewed range information
    of all node pairs can be transmitted in \(O(1)\) time slots, the whole communication
    process will be completed in \(O(D)\) rounds, where \(D\) is the diameter of the
    network (each round consists of \(O(n)\) time slots for message communication
    from all nodes in a layer to the nodes in the next layer [15]). Hence, the algorithm
    *location_region_identify* will need \(O(nD)\) time.


