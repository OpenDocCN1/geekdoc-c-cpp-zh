- pgno: 67
  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_67_0.png)


    # **FIGURE 2.4:** Movement-based location update scheme


    to be one distance apart) for successive location updates. Thus, the MT first
    makes a location update at point *A*, then it moves along the path *AB*. At the
    position *B* where the distance of the MT is going to exceed the assumed threshold
    of three-cell distance, the next location update is initiated.


    **Dynamically changing size of LA:** In this location update scheme, the LA size
    and hence the LA boundaries may be different for different MTs and may be dynamically
    changed even for the same MT depending on its recent mobility characteristics.
    For example, referring to Figure 2.6, [1] the LA size of an MT, say MT1 may consist
    of 2 × 2 square cells, whereas for another mobile terminal, say MT2, moving at
    a faster rate, the LA size may consist of 3 × 3 cells. Thus, essentially, the
    LA size is chosen on a per-user basis aiming at getting the optimum results in
    terms of the total overhead in time arising from location update and paging. Naturally,
    this scheme is more complicated than the others and is difficult to implement
    because of the dynamically changing LA size and LA boundaries for each individual
    MT. The scheme becomes even more complicated if the cells are hexagonal rather
    than square.'
