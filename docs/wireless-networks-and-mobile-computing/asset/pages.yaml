    \ and $q_B$ will now be the binary outputs of the threshold detectors corresponding\
    \ to the symbols 1 and 2, respectively. Thus, in this case, the desired output\
    \ $\\hat{s}$ of the receiver can be expressed as follows:\n\n+   i) If $q = 0$,\
    \ $\\hat{s} = 0$, corresponding to $s_A = s_B = 0$.\n+   \n+   ii) If $q = 1$,\n\
    \n$$\\hat{s} = \\begin{cases} 1 & \\text{if } e_A > e_B,\\ (\\text{when } s_A\
    \ = 1, s_B = 0) \\\\ 2 & \\text{if } e_B > e_A,\\ (\\text{when } s_B = 1, s_A\
    \ = 0). \\end{cases}$$\n\nWe consider a message frame containing $n$ binary bits.\
    \ Corresponding to each such frame, we consider the message frame after converting\
    \ the binary to ternary form containing symbols 0, 1 and 2, and having a length\
    \ of $m$ digits, where $n$ and $m$ are related as $m = \\lceil n \\log 2 / \\\
    log 3 \\rceil = \\lceil 0.6309n \\rceil$.\n\nFor performing the energy saving\
    \ analysis of the TSS scheme, again the conventional bit error rate (BER) will\
    \ not be suitable. Instead, the frame error rate (FER) will be used as in RBNSiZeComm\
    \ scheme. BER has the limitation that the propagation of errors over the higher\
    \ significant digits due to an erroneously received ternary symbol cannot be captured\
    \ appropriately since it considers the transmission of each bit independent of\
    \ the other bits. It may be noted that due to the nature of ternary"
