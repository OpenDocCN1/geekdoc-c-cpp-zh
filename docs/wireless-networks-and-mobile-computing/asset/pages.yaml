- pgno: 71
  md: 'MT first to the level of the MSC that stores the current information of the
    called MT and then to the cell level, i.e., the level of the base station (BS)
    of the cell where the called MT currently resides. If the called MT has moved
    far away from its home location, a lot of location update messages may be generated
    from its current VLR to the HLR and also to all the intermediate VLRs on the path
    from its current VLR to the HLR. Also, the acknowledgement and registration cancellation
    messages will be communicated among its HLR and the respective VLRs (see steps
    4, 5 and 6 of the location registration process described above). The total overhead
    in terms of the time needed for the two basic operations of updating the databases
    and terminal paging as well as the message traffic in the network for the required
    signalling operations may be significant, as explained below, unless the location
    databases are properly managed.


    For example, consider a situation that the called MT is originally registered
    in Kolkata, and has currently moved to Bangalore. Then a location update message
    is transmitted from the VLR in Bangalore to its HLR in Kolkata whenever the MT
    moves to a new LA that belongs to a different VLR. This may involve message communication
    through a number of intermediate MSCs. Further, when a call is generated from
    another MT in Bangalore to this roaming MT (which is also in Bangalore), the MSC
    of the calling MT must first query the HLR of the called MT in Kolkata, to discover
    that the called MT is currently residing in Bangalore. Due to an ever-increasing
    number of mobile users, this signalling traffic through the network can be very
    high, causing a significant reduction in the network’s performance in handling
    the calls.


    There are two basic approaches to design the architecture of the location databases
    to mitigate the above problem. The first is the *centralized database architecture*
    and the other is the *distributed database architecture*.


    # **Centralized Database Architecture:**


    One possible scheme under this category'
  merge: -1
