  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_66_0.png)


    updates may have been issued.


    **Movement-based location update:** The location of an MT is updated when the
    MT makes a predefined number of moves across the cell boundaries. The situation
    is illustrated by Figure 2.4 [1] assuming that the location update will be initiated
    after the MT crosses three cell boundaries. Thus, in this figure, the MT initially
    starts moving from point *A* and after reaching point *B*, when it has crossed
    three cell boundaries, a location update is initiated. The next location update
    is made at point *C* when it crosses another three cell boundaries from point
    *B*. The drawback of this approach is again that if the MT is situated around
    a cell boundary and moves back and forth across the same boundary without moving
    to any other distant cell, unnecessary location updates may be initiated.


    **Distance-based location update:** The location update in this scheme is initiated
    when an MT moves through a predefined distance from the cell where it performed
    its last location update. The situation is illustrated in Figure 2.5 [1] with
    the assumed threshold of three-cell distance (two cells sharing a common boundary
    are assumed'
  merge: -1
