  md: 'or a node whose location has been computed with the help of location information
    of its neighbors. We assume errors exist in the advertised locations of all beacon
    nodes, including the reference nodes. ±ε denotes the maximum possible error in
    the advertised coordinates of a beacon node along either axis of a two-dimensional
    coordinate system. ±δ is the maximum possible error along either axis in a measured
    range between a node and a beacon. We first present an intelligent beacon selection
    algorithm proposed by [11] such that the error in the computed location of a node
    is within a bound of ±[3ε(1 + √2) + 2δ] to ±(3ε + 2δ) along one axis and within
    ±[2δ(1 + √2) + 3ε] to ±(3ε + 2δ) along its orthogonal axis. Authors in [11] also
    derived a general expression for computing the bounds on an error that can be
    introduced in the computed location of a node and the conditions that must be
    met in selecting the beacon nodes to keep the error in the computed location of
    a node within these bounds.




    An ad hoc network is modeled as a graph \( G = (V, E) \) consisting of \( n \)
    nodes. \( V \) is the set of all nodes, \( |V| = n \) and \( E \) is the set of
    edges in the graph \( G \). The nodes may be stationary or mobile. All communication
    links are assumed to be bi-directional. A node \( v \) is said to be a _neighbor_
    of \( u \) if they are within each other''s hearing zones. The neighborhood \(
    N(i) \) of a node \( i \) consists of all nodes that are within its transmission
    range. A small percentage of the nodes are assumed to know their individual locations
    with high precision, either through GPS or some other means. These nodes serve
    as the _reference nodes_ (RNs) in the network. Initially, nodes other than the
    RNs do not possess any knowledge of their locations. A node is defined as a _beacon
    node_ if it is used in computing the unknown location of another node. A beacon
    node may'
