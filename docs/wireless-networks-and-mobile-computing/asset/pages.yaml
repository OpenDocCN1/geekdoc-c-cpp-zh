  md: 'to check whether $i_2$ is equal to either of $i_1$ or $j_1$. Now, $i_2$ cannot
    be equal to $i_1$ as they differ only by 1 modulo 256. Therefore, $S_1[i_2] =
    S_1[j_1] = S_0[i_1]$ if $i_2 = j_1$, and $S_1[i_2] = S_0[i_2]$ otherwise. In both
    cases, three binary numbers are to be added.


    Let us denote the $k^{th}$ bit of $j_0$, $S_0[i_1]$ and $S_1[i_2]$ (either $S_0[i_2]$
    or $S_0[i_1]$) by $a_k$, $b_k$ and $c_k$, respectively, where $0 \leq k \leq 7$.
    We first construct two 9-bit vectors $R$ and $C$, where the $k^{th}$ bits ($0
    \leq k \leq 8$) of $R$ and $C$ are given by:


    $$R_k = \operatorname{XOR}(a_k,b_k,c_k)\ \text{for }0 \leq k \leq 7,\quad R_8=0,\quad
    C_0=0,$$


    $$C_k = a_{k-1}b_{k-1}+b_{k-1}c_{k-1}+c_{k-1}a_{k-1}\ \text{for }1\leq k\leq 8.$$


    In RC4, all additions are done modulo 256. Hence, we can discard the ninth bit
    ($k=8$) of the vectors $R,C$ while adding them together, and carrying out normal
    8-bit parallel addition considering $0\leq k\leq 7$. Therefore, one may add $R$
    and $C$ by a parallel full adder as used for $j_1$. The circuit to compute $j_1$
    and $j_2$ is shown in Figure 9.2.


    **TABLE 9.2: Different cases for register-to-register transfers in swap operation**


    | # | Condition | Register-to-Register Transfers |

    |---|---|---|

    | 1 | $i_2\ne j_1$ & $j_2\ne i_1$ & $j_2\ne j_1$ | $S_0[i_1]\to S_0[j_1],\ S_0[j_1]\to
    S_0[i_1],\ S_0[i_2]\to S_0[j_2],\ S_0[j_2]\to S_0[i_2]$ |

