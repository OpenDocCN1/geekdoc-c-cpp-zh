- pgno: 72
  md: "is a dynamic hierarchical database architecture which uses an additional level\
    \ of databases called *directory registers (DRs)* along with the two-tier IS-41\
    \ database structure involving HLR and VLR. The basic idea is to use a DR that\
    \ covers the service area of a number of MSCs so that it stores the location pointer\
    \ configuration for the MTs roaming in its service area. There are three basic\
    \ types of location pointers used by a DR [1]:\n\n+   1. A *local pointer* is\
    \ stored at an MT’s serving DR pointing to the currently serving MSC of the MT.\n\
    +   \n+   2. A *direct remote pointer* is stored at a remote DR which points to\
    \ the currently serving MSC of the MT.\n+   \n+   3. An *indirect remote pointer*\
    \ is stored at a remote DR which indirectly points to the currently serving MSC\
    \ of the MT.\n\nAlong with this scheme of using the DRs, the HLR of the MT may\
    \ now be configured to store a pointer to the serving DR and/or the currently\
    \ serving MSC. In some cases, however, no such change in HLR may be made for a\
    \ cost-effective operation and the original IS-41 scheme may be used in HLR. In\
    \ view of these DRs, let us again consider the above example of an MT having its\
    \ HLR in Kolkata, and currently roaming in Bangalore. Suppose it moves to Chennai\
    \ and receives calls from the Bangalore area. If a significant number of incoming\
    \ calls to this MT are detected as originating from Bangalore, a direct or indirect\
    \ remote pointer can be set up for this MT in the DR at Chennai. When the next\
    \ call is initiated for this MT from Chennai, the calling MSC first queries the\
    \ DR and the call can be immediately forwarded to Bangalore, without the need\
    \ for querying its HLR in Kolkata. This significantly reduces the signaling traffic\
    \ in the network for call delivery. Likewise, signaling traffic in location registration\
    \ can also be greatly reduced if its HLR records the ID of the serving DR (instead\
    \ of the serving MSC) of the MT. If the MT moves to a new"
  merge: -1
  img_proc: true
- pgno: 73
  md: 'LA under a different MSC (but under the same DR) in the Bangalore area, then
    only the local pointer at the serving DR of the MT has to be updated, without
    the need for accessing the HLR in Kolkata. Thus, such a scheme using DRs can be
    used for significant overhead reduction in both location registration and call
    delivery processes.


    Another possible scheme for reducing the overhead in location registration and
    call delivery is through *per-user location caching* [11] which stores the current
    location information of an MT in a cache at a nearby signal transfer point (STP).
    Whenever an MT is accessed through the STP, an entry is added to the cache which
    refers to the mapping from the ID of the MT to that of its serving VLR. When a
    call is initiated to an MT, the STP first checks whether a cache entry exists
    for this MT. If no cache entry exists, the usual (e.g., IS-41) call delivery scheme
    as described above is used to locate the MT. If, however, a cache entry is found
    for this MT, the STP will query the VLR as specified by the cache entry. If the
    MT still resides under this VLR, a cache hit occurs and the MT is found easily
    without the need for querying its HLR. If, however, the MT has already moved to
    another location not associated with this VLR, a miss occurs and the usual IS-41
    call delivery scheme is followed in locating the MT. Figure 2.7 illustrates this
    scheme in which MT1 is trying to call MT2 and there is a cache entry at the signal
    transfer point STP1 corresponding to this MT2 that it is now mapped to VLR2. If
    the MT2 still resides under VLR2, the call is delivered to it immediately through
    VLR2 without querying the HLR of MT2. However, if MT2 moves to a new location
    under a VLR other than VLR2, there will be a cache miss and the usual IS-41 process
    will be applied to locate MT2. Thus, the overhead under this cache miss situation
    is more than that in the usual IS-41 scheme. For a better system performance,
    there should be a minimum cache hit ratio and the system should operate with a
    cache hit ratio always above this value. This minimum cache hit ratio depends
    on the local call-to-mobility ratio (LCMR) (LCMR) which is defined as ratio of
    the average number of calls to an MT from a given originating'
