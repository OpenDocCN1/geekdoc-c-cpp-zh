  md: '# 8.1.2  MAC Layer-Centric Approach


    In the MAC layer, we need improved techniques for avoiding collision in grabbing
    a common channel for communication, reducing collisions of messages and reducing
    the frequency of message retransmissions. Note that collision leads to retransmission
    of a collided message which, in turn, involves additional energy that is in a
    sense wasted. Thus, collision of messages should be avoided or minimized in the
    designs of energy-efficient communication schemes. Also, in the MAC layer, there
    is another possible way of conserving energy. Usually, a transmitter may operate
    in *transmit* mode in which some bits can be transmitted, or *idle* mode. The
    power required to keep the transmitter in the *idle* mode is usually negligible
    compared to that used in its *transmit* mode. Because of this difference in power
    requirements, an intelligent way of saving energy would be to keep the transmitter
    in *idle* mode when the communication channel is sensed to be idle (i.e., no message
    to be transmitted), rather than keeping it always in the *transmit* mode. The
    decision for keeping the transmitter in the *transmit* or *idle* mode is made
    by the MAC layer of the communication protocol. Thus, a judicious selection (tweaking)
    of the idle and transmit periods of the transmitter may result in substantial
    energy savings in the long run. For further study of optimizing data transmissions
    by reducing collisions and retransmissions, the reader is referred to [7, 15,
    13, 8, 14, 20].


    # 8.1.3  Network Layer-Centric Approach


    In the network layer, energy required for communication can be reduced if the
    path for routing a message from a source node to a destination node is so chosen
    to minimize the overall energy spent by all the nodes in that communication path.
    It may seem logical to seek the shortest path between a source and destination
    pair to route the messages; but this may not be the best solution as explained
    below.


    Let *u₁* and *v₁* be the source and destination nodes. Assume that the shortest
    path'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'between $u_1$ and $v_1$ passes through another node $w$. Repeated transmission
    of messages from $u_1$ to $v_1$ through this node $w$ would eventually deplete
    the energy of $w$ to such a low level that it will no longer be able to communicate
    to other nodes of the network. Thus, if $w$ has some message to be transmitted
    to another node of the network, it can no longer do so. In the same way, it would
    not be possible for some other node to send its data to $w$. Thus, effectively,
    the node $w$ is altogether eliminated from the network. The situation can worsen
    if node $w$ falls in the shortest paths between more than one source-destination
    pair, e.g., the shortest path between source node $u_2$ and destination node $v_2$
    also passes through $w$. In such a situation, the node $w$ will have a reduced
    lifetime serving as an intermediate node for message communication between several
    source-destination pairs. In essence, blind shortest path routing does not yield
    the best possible result considering the operational lifetime of a whole network.
    This is particularly true for low power wireless networks, e.g., wireless sensor
    networks in which each sensor node is battery powered. Despite the limited energy
    source, we want to extend the lifetime of each sensor node as much as possible.


    To mitigate the above situation, several alternative message routing techniques
    have been proposed and consider the residual energy of the constituent nodes.
    Essentially, the idea is i) to maintain the residual energy level of each node
    above some chosen threshold value so that no node goes out of network connectivity,
    ii) the individual messages are transmitted with minimum communication latency
    (delay) and iii) the total energy required for communication of all messages throughout
    the network is also minimized. Note that if the communication ranges (which are
    dependent on the transmitting power of a node) of all nodes are same, the last
    two conditions are not mutually conflicting. Communicating each individual message
    via the shortest path will lead to the minimum energy expenditure for the total
    message communication between all source-destination pairs (we assume that no
    congestion or queuing delay at any intermediate node). The first requirement may
    be mutually'
  merge: -1
  img_proc: true
- pgno: 375
  md: 'conflicting with the last two as explained above. Thus, a tradeoff is needed
    between these conflicting requirements to maintain as many nodes with residual
    energy above the threshold value as possible while keeping the total energy requirement
    for communication of all messages as low as possible.


    One possibility for meeting the requirement is clustering of nodes with a cluster
    head in each cluster so that the heads form the backbone network. Usually, the
    node in a cluster having the maximum residual energy is chosen as the cluster
    head. Thus, a node in a specific cluster sends its message first to its cluster
    head, then the cluster head routes this message directly to the destination node
    (if it lies in the same cluster) or to another cluster head that may function
    as an intermediate node for a shortest path routing in the backbone network. Note
    that a node may have a direct (single hop communication) link to its destination,
    but this would not be allowed by the above technique if the source node is not
    a cluster head. A variant of this technique may be that when the destination node
    is in the same cluster, the source node may directly send its message to the destination
    node, relieving the cluster head of functioning as the intermediate node for this
    communication. This would reduce the time required for communication and the total
    energy for routing this message, with the negative point that the source node
    (which is a non-cluster head node) may be required to increase its peak transmission
    power, i.e., spend more energy to directly reach the farthest node of the same
    cluster. This, in turn, needs a careful clustering algorithm that considers the
    residual energy and transmission range of each node to be included in the cluster
    along with the selection of the appropriate nodes as the cluster heads. Thus,
    if a node in the cluster does not have enough residual energy to increase the
    peak transmission power to reach another node in the same cluster at the farthest
    distance, this node can not be included in the cluster. Basically, this requirement
    should reduce the cluster size and hence the maximum delay in the backbone network.
    Again there is a question of tradeoff to get the best possible result.'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'The technique of clustering and routing requires changing the clusters and
    the cluster heads dynamically. After certain time, a cluster head may be depleted
    of its energy and will no longer have the maximum residual energy among all nodes
    in the cluster. Also, the network connectivity may be changed if the nodes are
    mobile, energy of a node is so much depleted that it is disconnected from the
    network, or new nodes may have joined since the last computation of the clusters
    (and corresponding cluster heads). These situations should invoke computing the
    clusters afresh, depending on the current status of the network, e.g., network
    connectivity, residual energy of nodes, and transmission range of nodes.


    An alternative approach for energy-efficient message routing is the use of a connected
    dominating set (CDS) as the backbone network, instead of the cluster heads forming
    the backbone network in the earlier technique. In this approach, we first construct
    a network graph \( G(V, E) \) with \( V \) as the set of vertices and \( E \)
    as the set of edges from the network. Corresponding to each node in the network,
    there is a vertex in the set \( V \), and two vertices will have an undirected
    edge between them if the corresponding two nodes of the network are within the
    transmission range of each other. We assume, for simplicity, that the transmission
    range of each node is the same. A dominating set \( DS \) of the graph \( G(V,
    E) \) consists of a subset of \( V \) such that every vertex of the graph is in
    \( DS \) or adjacent (at Distance 1) from at least one vertex in \( DS \). As
    an example, consider the graph of Figure 8.1 with 10 vertices. One possible dominating
    set of this graph is {2, 5, 9} as shown in Figure 8.2. However, the induced graph
    on this dominating set is not connected and accordingly the nodes corresponding
    to this dominating set cannot constitute a backbone network. To form a backbone
    network, we include a minimal set of other vertices in this dominating set to
    make it a connected dominating set \( CDS \). Thus, a possible connected dominating
    set of the graph in Figure 8.3 is {2, 4, 5, 7, 9}. Note that the additional vertices
    4 and 7 added'
  merge: -1
  img_proc: true
