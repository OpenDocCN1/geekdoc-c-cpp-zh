    contains at most $\lfloor |R|/2 \rfloor \leq n/r$ elements of $R$. This level
    1 block $P(1,k)$ is now subjected to level 2 partitioning and by similar arguments
    as in the proof of Lemma 16, we get a level 2 block of size $\lfloor |R|/4 \rfloor$
    at most.


    The partitioning process can now be generalized. We generate blocks of level $(i+1)$
    partition from the blocks of level $i$ partition, $i \geq 1$, as follows. For
    each element $id \in P(i,k)$, we compute $j=\lfloor k/r\rfloor$ and $\alpha=id-d_j\times
    r^j$, where $d_{m-i-1}\cdots d_0$ is the $(m-i)$-digit radix-$r$ code of the element
    $id$. We then map $id$ to $id'' = (\lfloor \alpha/r^{j+1}\rfloor)\times r^j +
    \alpha\ MOD\ r^j$, so that all the elements in $P(i,k)$ are now mapped to a set
    of integers $\{0,1,\cdots,r^{m-i}-1\}$ via a one-to-one and onto mapping. These
    $id''$ values, corresponding to the elements of $P(i,k)$, are used to re-code
    the elements of $P(i,k)$ into $(m-i-1)$-digit radix-$r$ numbers to generate the
    blocks of level $(i+1)$ partition. This successive partitioning scheme is illustrated
    by a partition tree as in Figure 5.1 for $r=4$ and $n=64$ where $V$ is the root
    (assumed to be at level $i=0$) with blocks $P(1,k)$ as its children, and at every
