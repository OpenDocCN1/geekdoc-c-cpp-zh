    to D stored in its route cache, this new route can be chosen by S without the
    need for initiating a fresh *RREQ* message by S. If an intermediate node (in the
    reverse route from w to S) receiving this *RERR* message also has alternative
    route information from w to D without involving the broken link, that node can
    easily perform *route salvaging* by appending this alternative route from w to
    D to the route from S to w. However, even in this case, the *RERR* message is
    to be sent back to S to let S know about this error and the corresponding salvaging
    action taken by w.


