    # 5.6  Point-to-Point Routing in Ad Hoc Networks


    The point-to-point routing protocols in ad hoc networks can be broadly classified
    as:


    +   1. Proactive routing protocols

    +   2. Reactive routing protocols

    +   3. Hybrid (both proactive and reactive) routing protocols


    In proactive protocols, the routing information from a source to a destination
    is maintained in advance. Thus, every node computes and stores a route to every
    other node in the network (*route creation activity*). These routes may be updated
    (*route maintenance activity*) periodically or may be triggered by some event
    (e.g., a link error when a previously existing link is removed due to mobility
    of nodes or'
  merge: -1
