    # 3.3  Lower Bounds on Bandwidth


    As mentioned in the earlier subsection, because of the NP-completeness nature
    of the CAP, researchers attempted to solve the problem based on heuristic approaches
    or approximation algorithms. Many of these algorithms do not assess how far their
    results are away from optimality and some of them over-estimate the frequencies
    by more than 100% [41, 42]. As a result, even if by some lucky coincidence, an
    optimal assignment is found, it may not be recognized as optimal unless one has
    a clear idea about the lower bound on the required bandwidth. In heuristic approaches
    like the genetic algorithm (GA), the process usually terminates after a certain
    number of iterations. Hence, a prior idea about the lower bound on the required
    bandwidth will be very useful in deciding the termination conditions of these
    algorithms. Furthermore, in the approaches based on neural networks, simulated
    annealing, and tabu search, the techniques typically start from some known lower
    bounds and then gradually improve the results through each iteration.


