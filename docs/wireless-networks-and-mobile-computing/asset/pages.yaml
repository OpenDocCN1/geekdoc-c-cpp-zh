    Mobile computing, particularly over cellular networks, has emerged as an important
    topic of research because of the need for computing capabilities even when people
    are on the move. Over the past decade, the number of such cellular network dependent
    mobile users has increased almost exponentially. However, the available bandwidth
    for providing services to those users is very limited. Such a limited availability
    of the radio spectrum, signal distortion, and the interference caused by the environment
    and other mobile users impose inherent limitations on the capacity of wireless
    networks. Therefore, developing methods to utilize the scarce radio spectrum efficiently
    is more critical than ever.




    For cellular networks, the available radio spectrum is divided into a number of
    non-overlapping frequency bands. We assume that the frequency bands are of equal'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'length and numbered 0, 1, 2, ... from the lower end. Each such frequency band
    is called a channel. The highest numbered channel required in an assignment problem
    is known as the required bandwidth or span of the assignment. When a mobile cellular
    network is designed, each cell of the network is assigned a set of channels to
    provide services to the individual calls. The same frequency channel may be assigned
    to different cells (reused) if they are at a sufficient distance without causing
    any interference. However, the assignment of channels to nearby cells should satisfy
    certain constraints to avoid channel interference. Interference is a function
    primarily of transmitter power, receiver sensitivity, antenna gains, and channel
    loss. Channel loss is a function of distance, frequency, and weather, and is quantified
    by the minimum acceptable signal-to-noise ratio (SNR). Assuming that most of these
    factors are already determined or beyond the ability to influence, the interference
    can be defined directly as a function of frequency and distance. Based on that,
    three types of interference are generally considered: 1) co-channel constraint,
    due to which the same channel cannot be assigned to certain pairs of cells simultaneously,
    2) adjacent channel constraint, for which adjacent channels cannot be assigned
    to certain pairs of cells simultaneously, and 3) co-site constraint, which implies
    that any pair of channels assigned to the same cell must be separated by a certain
    number of channels [20].


    The channel assignment problem (CAP) deals with assigning frequency channels to
    cells to satisfy the frequency separation constraints with a view to avoiding
    channel interference and using as little bandwidth as possible. This variant of
    the channel assignment problem is known as the minimum span channel assignment
    problem.


    For another variant of the CAP, consider the channel assignment when the bandwidth
    B of the system is given, which may even be smaller than the required lower bound
    on bandwidth for the given problem. Depending on B, it may or may not be possible
    to satisfy all the channel demands of each cell unless B is sufficiently large.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Thus, a solution to this variant of CAP may cause blocked calls. However, the
    objective is to minimize call blocking. This class of assignment problem is known
    as the *fixed bandwidth* channel assignment problem.


    There is, however, another class of problem of real-life importance known as the
    *perturbation-minimizing* frequency assignment problem (PMFAP) [17]. Assume that
    an assignment has been obtained for a given network to satisfy the required channel
    demands. After some time, demands of some of the cells may be changed due to either
    1) newly generated calls or 2) a handoff situation or 3) completion of some ongoing
    calls. The objective of this variant of CAP is to accommodate these small changes
    in demands; but while doing so, the number of changes in the existing assignment
    should be minimized while meeting the desired QoS. This variant is useful for
    addressing the short-term demand fluctuations that often arise in real-life scenarios.


    Channel assignment schemes can be classified into several categories. In the fixed
    (or static) channel assignment problem (FCA), the number of calls to each cell
    is known a priori and a number of nominal channels is permanently allocated to
    each cell for its exclusive use. In the simple uniform FCA, the same number of
    nominal channels is allocated to each cell. Since the traffic in cellular systems
    is mostly nonuniform, uniform allocation may result in poor channel utilization
    [34]. To achieve better channel utilization, the number of channels allocated
    to each cell should depend on the expected traffic load of the cell. This technique
    is called non-uniform channel allocation [35, 36]. Simple FCA schemes are not
    adaptive to temporal and spatial fluctuations of user demands and to overcome
    this drawback, dynamic channel assignment (DCA) schemes have been developed [37].
    In DCA, all channels are available to every cell and channels are assigned to
    newly generated calls as and when required, provided they satisfy the interference
    constraints. Though DCA schemes provide flexibility and traffic adaptability at
    the cost of higher complexity,'
  merge: -1
  img_proc: true
- pgno: 101
  md: "they are less efficient than FCA under high load situations [34, 38, 40]. To\
    \ address this drawback, many hybrid schemes combining the benefits of both FCA\
    \ and DCA have been developed. Both the FCA and DCA schemes can be implemented\
    \ in centralized or distributed fashion. In centralized schemes, a channel is\
    \ assigned by the central controller whereas in the distributed schemes, a channel\
    \ is selected by the base station at which the call is initiated or by the mobile\
    \ [34]. If the base stations select the channel, each base station keeps the information\
    \ about the currently available channels in its vicinity and this information\
    \ is updated by exchanging status information among these stations. In the other\
    \ situation where the mobile terminals are allowed to select the channel, the\
    \ mobile terminals choose the channels based on the local signal-to-interference\
    \ measurements [34].\n\n# 3.1.2 Mathematical Formulation of CAP\n\nThe channel\
    \ assignment problem can be represented as a mathematical optimization problem.\
    \ The model used in [1], [8], [14] to represent a CAP can be described by the\
    \ following components:\n\n+   1. A set of *n* distinct cells $X = \\{0, 1, \\\
    cdots, n - 1\\}$.\n+   \n+   2. A demand vector $W = (w_i)$ $(0 \\leq i \\leq\
