- pgno: 320
  md: 'reduction in transmission power of nodes, other changes in the network affecting
    the topology, addition of new nodes, changes in traffic load, etc.). Most commonly
    used proactive routing protocols include *Destination-Sequenced Distance Vector
    Routing (DSDV)* [21] and *Optimized Link State Routing (OLSR)* [20].


    In reactive routing protocols, routes are not computed in advance. Rather, routes
    are discovered only when needed. If a source node wants to send a message to some
    destination node, it first examines its local routing table to see whether a route
    to the desired destination already exists. If no such route exists, it initiates
    a *route discovery* process to find a routing path to the destination node. Examples
    of such reactive routing protocols include *Ad Hoc On-Demand Distance Vector Routing
    (AODV)* [24], *Dynamic Source Routing (DSR)* [23], and *Temporally-Ordered Routing
    Algorithm (TORA)* [25].


    Reactive routing protocols perform better than the proactive routing protocols
    due to reduced overhead in route discovery and route maintenance for low to moderate
    traffic loads in the network. However, if the traffic load is heavy, the signaling
    overhead in the route discovery of reactive protocols tends to become equal or
    even surpass that in proactive routing protocols. On the other hand, if the nodes
    in a MANET have a high mobility or network conditions change very frequently due
    to addition or removal of nodes or changing transmission conditions, the route
    maintenance overhead in proactive protocols may rise significantly (being triggered
    by specific events) and in these situations, reactive protocols may be better
    choices. Reactive protocols suffer from an additional drawback of a *latency*
    period of acquiring the route from the instant when the source node needs a route
    to a given destination. In proactive protocols, there is no such latency as the
    routes to all destinations are computed in advance at each source node. Due to
    these advantages and disadvantages of both proactive and reactive protocols, hybrid
    protocols have been proposed'
