  md: '# 8.6.3.7  Energy Savings Analysis


    Table 8.23 indicates that for different $FER/m$ values in the range $10^{-4}$
    to $10^{-9}$, the peak transmitter power for TFNS with coherent detection is on
    average 3 dB higher than that with coherent BFSK. Now, $10\log_{10}(1-0.44)$ dB
    = -2.518 dB. Hence, the average transmitter power for TFNS with coherent detection
    will be $(3-2.518)$ dB = 0.482 dB higher than that with coherent BFSK scheme.
    We denote the average transmitter powers for coherent TFNS and coherent BFSK by
    $P_t$ and $P''_b$, respectively. Hence, we have $\frac{P_t}{P''_b}=10^{0.482/10}=1.1174$.


    We denote $E_t$ and $E''_b$ as the transmitter energy requirements for the coherent
    TFNS and the coherent BFSK schemes, respectively. The reduction in transmission
    time is given by


    $$\frac{E_t}{E''_b}=\frac{P_t\times T_t}{P''_b\times T_b}=1.1174\times0.72=0.8045.
    \tag{8.67}$$


    We consider $FER/m$ in the range $10^{-4}$ to $10^{-8}$. The comparative figures
    for relative energy requirements with non-coherent TFNS, coherent TFNS, coherent
    BFSK and non-coherent BFSK are shown in Table 8.23. From the values in this table,
    we see that the peak transmitter power for TFNS scheme with coherent detection
    is on average 2.28 dB higher than that with non-coherent BFSK and the average
    transmitter power for TFNS with coherent detection will be $(2.28-2.518)$ dB =
    -0.238 dB (i.e., 0.9466 times) higher than that with non-coherent BFSK. Since
    $0.9466\times0.72=0.6815$, the TFNS scheme with coherent detection will require
    0.6815 times the energy needed for non-coherent BFSK, indicating a savings of
    31.85% of transmitter energy.


