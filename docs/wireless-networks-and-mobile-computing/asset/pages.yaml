    It continues this until it receives an ACK from $L_i$.


    # 5.4.6.4  **Mobile Terminal Leaving Cell or Network**


    If a mobile terminal $u$ other than the cell leader or the network leader leaves
    the current cell, no immediate update action is taken. The slot assigned to $u$
    may be reclaimed by the cell leader if the cell leader fails to find sufficient
    unused slots in the cell to satisfy a new incoming mobile terminal in the cell.
    If a cell leader leaves the network or the cell, according to this protocol no
    transmission will be heard by the nodes of the corresponding cells in the control
    slots. When such a situation occurs, a new *cell leader* is elected from the remaining
    MTs.


    If the network leader has left the network, the existing cell leaders elect a
    new network leader.


