    expenditure for transmitting the equivalent RBNS data frame can be represented
    as the sum of the following three terms.


    +   1. A base energy value \( P_\text{base} \) needed throughout the transmission,
    which is equal to the energy required when the device is in the _active_ state.
    For an _n_-digit RBN data frame, considering all possible \( 2^n \) strings of
