    Binary to ternary conversion of data provides the advantage of reduction in the
    total number of symbols to be transmitted and reduces total transmission duration.
    As both the transmitter and the receiver consume energy proportional to the duration
    for which they are switched on, regardless of the symbol transmitted, recoding
    to a higher radix will lead to a savings in energy at both the transmitter and
    the receiver. Additional energy savings can be obtained at the transmitter by
    adopting the silent symbol strategy as explained in the preceding sections for
    one of the three possible ternary digits. The ternary with silent symbol (TSS)
    combines these two strategies to derive an energy-efficient communication scheme
    that saves energy at both the transmitter and the receiver. Assuming equal likelihood
    of all the three symbols, we assume 0 to be the silent symbol. In practice, however,
    the relative frequencies of the three symbols will depend on the nature of the
    data to be transmitted. A better strategy would be to assign the most frequent
    symbol as the silent symbol based on the relative frequencies of the symbols,
    determined statistically or assigned for each message to be transmitted.'
