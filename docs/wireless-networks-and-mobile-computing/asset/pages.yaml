    # 3.1.3 CAP and Generalized Graph Coloring


    In its most general form, the channel assignment problem is equivalent to the
    generalized graph coloring which is a well-known NP-complete problem [3]. The
    minimum span channel assignment problem can be represented as a graph coloring
    problem defined on a CAP *graph*. Call $k$ of cell $i$ is represented as node
    $(ik)$ of a CAP graph and the nodes $(ik)$ and $(jl)$ are connected by an edge
    with weight $c_{ij}$, if $c_{ij} > 0$. Let us assume that the channels are assigned
    to the nodes of the CAP graph in a specific order and a node will be assigned
    the channel corresponding to the smallest integer that will satisfy the frequency
    separation constraints with all the previously assigned nodes. It can be shown
    that the ordering of the nodes has strong impact on the required channel bandwidth.
    Suppose there are $m$ nodes in the CAP graph. Therefore, the nodes can be ordered
    in $m!$ ways and hence for sufficiently large $m$, it is impractical to find the
