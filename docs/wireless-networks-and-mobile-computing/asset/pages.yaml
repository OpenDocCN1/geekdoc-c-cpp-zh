  md: '# 8.5.2.1   Representation of Encoded Numbers


    From Section 8.5.1, we see that the optimal encoding scheme corresponds to \(k
    = 2\). Therefore, starting from the least significant bit (lsb) position of the
    binary data frame, every bit pair (00, 01, 10 or 11) can be assumed to represent
    a CNS symbol. We shall refer to the four CNS symbols as *A*, *B*, *C* and *N*
    and the mapping of the bit pairs to the symbols as *bit pair to symbol mapping*
    or *BpS Mapping*. *N* stands for *null* to indicate communication through silent
    time periods or null signal on the channel. As an example, for a particular scenario,
    the bit pairs 00, 01, 10 and 11 may be mapped to the symbols *N*, *A*, *B* and
    *C*, respectively. Starting from the lsb of the binary data frame to be transmitted,
    the system would then read every successive bit pair to determine whether the
    corresponding transmitted CNS symbol is to be *A*, *B*, *C* or *N* and do the
    reverse mapping at the receiver to reconstruct the original binary string.


    # 8.5.2.2   Mapping to Codewords


    For a binary string of length \(n\), considering all \(2^n\) possibilities, the
    theoretical average percentage of occurrence of each of the 4 bit pairs 00, 01,
    10 and 11 is 25%. However, in practice, the distribution of these four bit patterns
    in a data set depends on the nature of the data transmitted, as can be seen from
    Figure 8.18 which depicts the frequency of the four codewords in different file
    types obtained from statistics in 691 files. Table 8.11 lists the number of files
    of each type used to derive these statistics. File type *text* represents a set
    of ASCII plain text files (e.g., C/C++ or Java source codes, LaTex source files,
    etc.) other than *html* source files. The file set *bin* consists of binary files
    for both Unix and Windows operating systems: executables, object codes and library
    files.


    Two schemes can be adopted to choose the BpS mapping:


    +   - **Scheme 1:** Fix one of the four possible bit patterns as the *N* symbol
    and use'
