    # 5.5.2.6  Mobility Resilience


    The layer-by-layer transmission of the message as in [3] and periodic retransmission
    of the message by the source node after every log *n* rounds ensures that even
    if a node moves from a layer *j* to a layer *i* before it has received the message
    *M* and after all nodes in layer *i* have finished transmitting *M*, where *i*
    < *j* (i.e., it is now at a smaller distance from the source node *s*), it will
    still be able to receive the broadcast message correctly at some point. Thus,
    the algorithm *bf_broadcast* works correctly even when the network topology changes
    frequently.


    # 5.5.2.7  Complexity


    > **Lemma 23.** *At least one node is guaranteed to have received the message
    correctly, after every 2 log n rounds of transmission.*


    *Proof.* Because of the typical nature of dropping successive transmitting nodes
    causing a collision, it is guaranteed that for every 2 log *n* rounds, at least
    one node of the receiving layer *j* (assuming that transmitting layer is *j* −
    1) gets the message correctly. The factor of 2 is included to take care of the
    fact that if a bit tested for 1 causes a *no signal* to the receiving nodes, this
    bit is flipped to 0. Since there are a maximum of log *n* such flippings, the
    claim is justified.


    > **Theorem 23.** *The algorithm bf_broadcast takes O(n log n) rounds to complete
    the broadcast in the worst case.*'
