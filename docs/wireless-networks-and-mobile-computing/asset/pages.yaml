- pgno: 360
  md: 'with center at $p''_i$. Consider the line segment defining the chords of intersection
    of each $C_j$ with $C_i$ for all $j \ne i, j = 1, 2, \ldots, k$, and the edges
    of the convex polygon $\Pi$. Next, compute the *envelope* of these line segments
    around $p''_i$. This defines the Voronoi polygon $vor(p''_i)$ around $p''_i$ for
    the next iteration. In Figure 7.2, the region bounded by the solid lines demonstrates
    the Voronoi region of $p''_i$; the cords of intersection are shown using the dotted
    line segments.


    Note that, $vor(p''_i)$ is properly inscribed by the corresponding circle $C_i$
    with center at $p''_i$, and having radius $\rho_{old}$. In the next iteration,
    we compute the smallest enclosing circle $C''_i$ of each $vor(p''_i)$ which is
    completely enclosed in $C_i$. This proves that if $\rho_{new}$ is the revised
    value of $\rho$ in the next iteration, $\rho_{new} \leq \rho_{old}$.


    **Remark 21.** *The iteration terminates when the value of $\rho$ reaches a local
    minimum, or in other words, $\rho_{new} = \rho_{old}$ is attained.*


    To get rid of the local minimum, we apply a refinement step during the iterative
    process. Note that if a point (base station) $p_i$ is on the boundary of $\Pi$,
    at least 50% of the area of $C_i$ lies outside $\Pi$, and hence this region need
    not be covered. This indicates the scope of further reduction in the area of $C_i$.
    Thus, if a point goes very close to the boundary of $\Pi$, we move it to the centroid
    of $\Pi$, which is computed as follows:


    Let $\Pi$ be a $m$ vertex convex polygon, and $(x_j,y_j)$ denote the $j$-th vertex
    of $\Pi$, $j = 1, 2, \ldots, m$. The centroid of $\Pi$ is the point having the
    coordinates $\left(\frac{1}{m}\sum_{j=1}^{m}x_j,\frac{1}{m}\sum_{j=1}^{m}y_j\right)$.
    It can be shown that the centroid of a convex region is always inside that region.


    Such a major perturbation brings the solution away from local minima, and it leads
    to a further reduction in $\rho$. We continue the iteration with this initial
    placement until it reaches more local minima.'
