    # 5.8  Dynamic Source Routing (DSR)


    *Dynamic source routing (DSR)* is an example of a reactive routing protocol. This
    is a source routing protocol, i.e., each packet to be routed from a source node
    carries in its header the complete ordered list of nodes through which the packet
    must pass. This protocol has two distinct phases: *route discovery* and *route
    maintenance*. When a source node *S* wants to send a packet to a destination node
    *D* and *S* has no information regarding the route to *D*, node *S* has to find
    a suitable route and this is done in the *route discovery* phase. In the *Route
    Maintenance* phase, a new route is found if there appears a need for updating
    an already existing route between a given source and destination pair due to a
    special situation such as a link failure.


