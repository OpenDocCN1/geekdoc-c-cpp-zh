    adjacent channel, and co-site constraints. In [44], new lower bounds were generalizations
    of the bounds presented in [20, 42]. All these lower bounds are defined on a general
    network of arbitrary cell structure.


    For the special case of hexagonal cellular networks, the problem of determining
    the lower bounds has been studied by several authors [29, 28]. In this special
    type of network, a *k*-band buffering exists in the network if the channels assigned
    to any two calls in two cells which are more than distance *k* apart do not interfere
    with each other. In other words, for a *k*-band buffering network we need to define
