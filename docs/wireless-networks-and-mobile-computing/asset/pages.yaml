- pgno: 78
  md: '# # Wireless Networks and Mobile Computing


    ![](img/6578f6fc95ac71d2c7109e594d9df12f_78_0.png)


    When an MN moves from one subnet to another, it has to register its new IP address
    (in the newly visited subnet) with its home agent. Thus, in effect, there are
    two IP addresses associated with every MN: one is the home address for its identification
    and the other is for finding its current location. The latter address is known
    as its _care of address (CoA)_. The association between the current CoA and the
    MN’s home address is maintained by some mobility binding rule with some lifetime
    period for this binding. Any packet destined for this MN is routed using the current
    CoA. The lifetime period of the binding with the CoA is determined at the time
    of MN’s registration at its home agent and after this period, this registration
    is deleted. The MN must re-register with its HA before the expiry of this time
    period to ensure continuous service (e.g., without interrupting ongoing calls)
    using this CoA. Thus, the MN may need to send a registration request message even
    when it is in its home subnet, i.e., the registration message may be sent directly
    to its HA (when it is still in its own subnet) or through an FA it is currently
    visiting. According to the Mobile Internet Protocol Version 4 (IPv4), the following
    sequence of actions is performed in the location registration process of an MN,
    illustrated in Figure 2.11 [1].'
