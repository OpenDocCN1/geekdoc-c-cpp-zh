- pgno: 32
  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_32_0.png)


    **FIGURE 1.2:** Schematic view of a cognitive radio network


    Cognitive radios are widely accepted as the wireless technology of the future
    and it is envisioned that most radios on portable devices (e.g., cellphones (telephones
    used in cellular mobile networks) and Wi-Fi enabled notebook PCs) will possess
    some amount of cognitive capability [14] by the time this book is published.


    In the context of networks operating in licensed bands, the ability to exploit
    unused parts of the spectrum can provide a multitude of benefits. Taking the case
    of cellular networks as an example, such frequency agility can dramatically reduce
    operational, deployment and licensing costs, increase the number of users that
    can be supported under a single base station and improve the operator’s ability
    to provide guaranteed service through the intelligent exploitation of the large
    additional unused spectrum pool. Moreover, such cognitive radio-based cellular
    networks can offer benefits in the events of attacks or natural disasters. While
    a conventional cellular system is centralized and can only operate in licensed
    bands, a cognitive system is capable of establishing communications even if some
    network elements are out of order or the'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'total requested bandwidth by the users exceeds the operator’s licensed bandwidth.
    It is thus apparent that cognitive radios will play a pivotal role in the coming
    generations of wireless networks [18, 19, 8, 9, 20, 13, 14, 17, 16, 15].


    # 1.1.8 Wireless Mesh Networks


    As an alternative to the cellular and ad hoc network architectures, there has
    been a great deal of interest in recent times in wireless mesh networks (WMNs).
    The operational characteristics of WMNs may be considered to be somewhere in between
    infrastructure-based networks such as wireless local area networks (WLANs) and
    ad hoc networks with no pre-installed infrastructure support. In WMNs, the network
    consists of a set of *fixed* gateway nodes and a set of non-gateway nodes (either
    stationary or mobile). The non-gateway nodes must access a gateway node (similar
    to WLANs) to establish communication to the outside world. These non-gateway nodes
    can act as hosts or as wireless routers by forwarding packets from other users
    (similar to ad hoc networks), enabling other non-gateway nodes to establish links
    with the gateway nodes in a multi-hop fashion, if required.


    This fusion of ad hoc network and infrastructure-based network properties allows
    significant extension of the coverage area of the network and enables nodes in
    areas with poor signal propagation properties to contact the outside world with
    higher probability of success. The overall effect of such a deployment is thus
    a substantial reduction in the number of deployed gateway nodes needed to cover
    a zone and consequently the overhead for installation, operational, and maintenance
    expenses.


    Furthermore, such a network structure also allows for scalable operations simply
    by adding new gateway nodes when and where required. The reliability also improves
    as multiple paths to gateway nodes are more common and re-routing of packets in
    case of node failures is handled as in ad hoc networks.


    Because of the above mentioned advantages, even traditional infrastructure-based'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'networks such as cellular networks are beginning to look at possibilities of
    migrating to either WMN-based or WMN-like topologies [21, 22, 24, 28]. The promises
    are several: reducing infrastructure setup and maintenance cost, improving fault
    tolerance and robustness in the face of unnatural events and natural calamities
    and enhancing network coverage, among others. However, with the use of a mesh
    architecture, the importance of the channel assignment problem becomes even more
    accentuated due to the increased probability of interference between the links
    of a WMN, as most applications of WMNs (e.g., dense sensor networks) tend to contain
    more links than traditional cellular and ad hoc networks in an attempt to improve
    reliability through path diversity [28, 27, 26, 25]. As an example, Lan and Trang
    [23] proposed a technique for channel assignment in WMNs with multiple channels
    and multiple radios at each node of the network for increasing the network throughput.


    # 1.1.9 Vehicular Ad Hoc Networks (VANETs)


    A vehicular ad hoc network (VANET) is a mobile ad hoc network (MANET) consisting
    of moving cars. Each participating car acts as a wireless router or node of the
    network, with a range of about 100 to 300 metres. If cars move out of the signal
    range, they will drop out of the network, while other cars may also join the network.
    Design of such a network was first intended to enable police and fire vehicles
    to communicate with each other for security and safety purposes on highways.


    # 1.1.10 Wireless Sensor Networks


    A wireless sensor network (WSN) or simply a sensor network, is a network of spatially
    distributed autonomous sensors to monitor physical or environmental conditions,
    such as temperature, sound, pressure, etc. and cooperatively pass their data through
    the network to a sink node at some location, as shown in Figure 1.3. The more
    modern networks are bi-directional so as to enable control of sensor activity.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_35_0.png)


    Each such sensor network node has several parts: a radio transceiver with an internal
    antenna or connection to an external antenna, a microcontroller, an electronic
    circuit for interfacing with the sensors and an energy source, usually a battery
    or embedded form of energy harvesting. A sensor node may vary in size from that
    of a shoe box down to the size of a grain of dust, although functioning *motes*
    of genuine microscopic dimensions have yet to be created. The cost of sensor nodes
    is similarly variable, ranging from a few to hundreds of dollars, depending on
    the complexity of the individual nodes. Size and cost constraints on sensor nodes
    result in corresponding constraints on resources such as energy, memory, computational
    speed and communications bandwidth.


    A sensor network may be thought to be an ad hoc network. Just like the ad hoc
    networks, a sensor network may also be static or mobile. For example, a surveillance
    system with large static camera sensors deployed in a mall or supermarket is a
    static sensor network, while very light and small-sized sensors deployed over
    a terrain where the sensors can float around or may change their positions over
    time constitute a mobile sensor network. Communication protocols in wireless sensor
    networks may'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'be developed in a similar way as those in ad hoc networks. Data propagation
    among the sensor nodes may be through point-to-point communication or through
    flooding using broadcast or multicast.


    Sensor networks find applications in a large number of real-life situations including
    environmental monitoring, inventory control in industries, process control, machine
    health monitoring, smart home building, monitoring of structures of large buildings
    and bridges, military and surveillance control, and so on. Processing of data
    streams received continuously from the sensor nodes by the sensor nodes even with
    low computational resources for specific application purposes constitutes a challenging
    research problem.


    # 1.1.11  Body Area Networks


    A body area network (BAN) (also referred to as a wireless body area network (WBAN)
    or a body sensor network (BSN)) is a wireless network consisting of a set of wearable
    computing devices. In particular, the network consists of several miniaturized
    body sensor units (BSUs) together with a single body central unit (BCU). The technology
    for developing body area networks started around 1995 based on the idea of using
    wireless personal area network (WPAN) technologies for implementing communications
    on, near, and around the human body.


    # 1.2  Effects of Mobility of Devices


    A wireless mobile network, whether cellular, ad hoc or sensor, consists of mobile
    devices (telephones, sensors or other types of devices) which are invariably operated
    by batteries of limited energy because of the mobility of such devices. When the'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'battery of a device is exhausted, the device leaves the communication network.
    This phenomenon may be effectively abstracted by a node/link failure in the network.


    Apart from this energy constraint, such mobile devices, because of their small
    size for portability, usually have small computing resources in the form of memory,
    computational power and speed of computation. They are also usually constrained
    by low communication bandwidth.


    Mobility of component nodes in a network also gives rise to additional problems
    in network connectivity, e.g., when a node moves out of the range of communication
    from all other nodes in the network, it is dropped from the network. On the other
    hand, new nodes are also usually allowed to join a network at any time and may
    request additional communication channels for sending their messages. Such an
    allocation of new channels to newly arrived nodes must avoid all types of channel
    interferences with the existing communicating nodes in the nearby region. The
    communication protocols of the network must take proper account of such a dynamic
    network topology arising from all these situations.


    Further, when a mobile communicating node changes its geographical position, it
    is possible that the channels assigned to this node may interfere with the channels
    allocated to other communicating nodes in the vicinity of its new location. Accordingly,
    some new non-interfering channel needs to be assigned to this node very quickly
    so as not to disrupt communication which is already in progress.


    Quality of Services (QoS) is an important consideration for developing the communication
    protocols in any network. The quality of service is usually expressed or demanded
    by the users in several different forms like delay (time required for communicating
    packets of message), delay jitter (i.e., variation in delay for communicating
    different packets of the same message), reliability (e.g., bit error rate (BER)),
    availability of channels, and the bandwidth of communication under different application
    environments. For example, for voice communication over telephone, packet'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'delay is important and should be very small – not perceptible by human audio
    recognition systems; otherwise it may give rise to unwanted repetition of a message
    by the sender, often overlapping with the reply message from the receiver. Also,
    delay jitter in sending voice signals (e.g., using voice-over IP (VoIP)) is equally
    annoying to a human audio recognition system if different parts of the same sentence
    arrive with different lengths of intermittent delay. But it may be possible to
    compromise with the reliability of communication of voice signals to some extent.
    For example, if one or two bits of a voice packet are received erroneously, the
    human ear can possibly tolerate that and if not, the person receiving the message
    can ask the sender to repeat the message once again. This may also apply to communicating
    video signals.


    On the other hand, for text data communication, delay and delay jitter are relatively
    unimportant, but reliability is extremely important. Quick allocation of channels
    to a requesting user for a specific purpose needs to be done by the network. Also,
    usage of minimum bandwidth for effecting the desired communication over the network
    is a direct concern for the designers of the network system; the network must
    provide uninterrupted service to the maximum possible number of users with the
    available bandwidth resource.


    Due considerations need to be given for developing robust communication protocols
    for maintaining the desired QoS under all dynamic network conditions as discussed
    above that may arise from mobility of the component nodes.


    # ## 1.3 Issues in Cellular Mobile Networks


    As evident from the requirements of the cellular mobile networks described above,
    we essentially need to i) assign a channel to a new call, avoiding all sorts of
    channel interferences from other calls and ii) maintain the communication between'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'any two nodes even when one or both of them move from one place to another.


    Apart from these two essential factors, the next important concerns are the energy-efficiency
    in implementing the communication protocols and security of messages to be communicated.
    Thus, broadly speaking, we need the following four issues to be resolved when
    implementing a cellular mobile network.


    +   - Mobility management

    +   - Bandwidth management

    +   - Energy management

    +   - Security


    # 1.3.1  Mobility Management


    In order to achieve the major goal of mobile computing in a cellular mobile network,
    i.e., the ability of computing at any place at any instant of time even when people
    are on the move, the important concern is, of course, to allow a user to make
    a call from any place (cell) to any other person in the network and to continue
    the call even when one or both of them are moving. The following four activities
    are involved in implementing this requirement.


    +   - Call setup

    +   - Handoff management

    +   - Internetworking and interoperability


    We give a brief introduction to these activities as follows:'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 1.3.1.1  Call Setup


    In order to set up a call from a mobile terminal (MT) to another MT, two distinct
    activities are involved: i) location registration and ii) call delivery. These
    two activities are known as location management functions. Each mobile terminal
    is required to update its location information periodically or at least when it
    changes its location. For this purpose, usually a number of cells are grouped
    together to form a location area (LA) and a mobile switching center (MSC) controls
    several such LAs. Whenever an MT moves from one LA to another LA, the MT initiates
    a request to its current MSC for updating the location databases. On the other
    hand, call delivery involves querying the location databases to find the current
    location of the called MT. We discuss these two activities in detail in Chapter
    2.


    # 1.3.1.2  Handoff Management


    When an MT changes its position from one cell to another cell, the strength of
    the signal received by it from the base station (BS) of the old cell becomes less
    than that from the base station of the new cell. Accordingly, the control of this
    MT is to be handed over from its old BS to the new BS. A smooth handoff of control
    of the MT from the old BS to the new one without hampering the ongoing communication
    with this MT, if any, is known as handoff management. In other words, handoff
    or handover management enables the network to maintain a user’s connection when
    the user (MT) continues to move and changes its access point from one BS to another
    BS. There are three distinct stages for handoff: i) handoff initiation, ii) new
    connection generation and iii) data flow control. In the first stage, handoff
    may be initiated by a user or MT when it receives the signal from its BS at a
    very low strength (lower than some threshold value) or it may be initiated by
    network software (either due to weak signals received from an MT or due to some
    changing network conditions, e.g., the communication channel used by the MT may
    be changed by executing a channel'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'allocation algorithm at the base station to satisfy the channel demands of
    other MTs in the network). The second stage of handoff management, new connection
    generation, may be performed in three different ways. In case of network-controlled
    handoff (NCHO) or mobile-assisted handoff (MAHO), the network generates a new
    connection and finds the resources and the additional routing operations. In mobile-controlled
    handoff (MCHO), the MT finds the new resources and the network approves them.
    The third stage, i.e., data flow control, involves the delivery of data from the
    old connection path to the new connection path according to the agreed-upon services
    to be provided to the MT. In Chapter 2, we address handoff management in somewhat
    more detail.


    # 1.3.1.3  Internetworking and Interoperability


    There are different backbone networks which can support cellular mobile communication.
    Examples of such backbone networks include public land mobile networks (PLMNs),
    mobile IP networks, wireless asynchronous transfer mode (WATM) networks, low earth
    orbit (LEO) satellite networks, and so on. Each such backbone network has its
    own kind of signal propagation techniques and communication protocols to provide
    services to cellular mobile users. While roaming, it is quite possible that an
    MT moves from one place to another where the supporting backbone network is changed.
    The future generation mobile communication system aims at global roaming capability
    for mobile users. In order to implement this idea, the associated problem of internetworking
    must be properly addressed. The mobile devices need to be equipped with the appropriate
    hardware (physical layer and MAC layer issues) and software (network layer issues)
    to operate in different backbone networks during roaming. Also, this switching
    from one backbone network to another should be smooth and transparent to the users
    without disrupting the ongoing calls of the moving MTs. The location registration,
    call delivery and handoff management tech-'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'niques must also be appropriately handled for a smooth switching from one backbone
    network to another.


    Likewise, an MT may also move from one area to another where the backbone network
    remains unaltered, but the service provider is changed causing corresponding changes
    in communication techniques, protocols and service level agreements (e.g., tariffs)
    between the user and the service provider. For example, different service providers
    may operate over different frequency bands for message communication, and use
    different channel access mechanisms. One may use frequency division multiple access
    (FDMA) to access the channel, while the other may use code division multiple access
    (CDMA). The issues of compatibility of the mobile devices and the associated communication
    protocols, and designing the appropriate location registration, call delivery,
    handoff management techniques for such interoperability of the mobile services
    need also to be addressed to provide roaming facilities across different service
    providers. All these issues related to internetworking and interoperability constitute
    an important area of future research and development for providing the effective
    global roaming facilities to the mobile terminals.


    # 1.3.2 Bandwidth Management


    Because of the extreme popularity of mobile telephone systems, the number of cellular
    mobile users is increasing day by day almost exponentially. With about 200 million
    listed mobile users in 1997, the number has gone up to more than 6.8 billion in
    early 2015 and continues to increase at a high rate. Moreover, the users of mobile
    telephone systems no longer confine their use to voice messages and texts; multimedia
    signals including audio, still image and video are also communicated through cellular
    mobile networks. Quite naturally, the bandwidth requirement of the communication
    channel increases for multimedia signals. Thus, for audio signals, 64 Kbps is
    considered enough, while for video signals, 384 Kbps is the bare minimum bit'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'rate used in second generation mobile systems. In third and fourth generation
    mobile communication systems, for better quality video communication, the channel
    speeds are intended to be 2 Mbps and 100 Mbps, respectively.


    On the other hand, the total bandwidth for signal communication in cellular mobile
    networks is very limited. Apart from the 100 MHz band from 860 MHz to 960 MHz
    used by the GSM (Global System for Mobile Communications) system, the 1992 World
    Administrative Radio Conference in Geneva allocated the 1885 to 2025 MHz and 2100
    to 2200 MHz bands — a total of only 230 MHz — for terrestrial and satellite communications.
    Within these two bands, the satellite band covers 1980 to 2010 MHz and 2170 to
    2200 MHz for a total of 60 MHz, while the remaining 170 MHz is for terrestrial
    mobile communication. The frequency gaps between 2025 to 2110 MHz and beyond 2200
    MHz are reserved for other services such as remote sensing, cable TV relay service,
    space research, etc. In 1995, the World Radio Conference changed the above frequency
    allocation a bit. The satellite band allocation for Region 2 (the Americas and
    the Caribbean) was modified to 1990 to 2025 MHz and 2160 to 2200 MHz for a total
    of 75 MHz, leaving only the other 155 MHz for terrestrial services. This has made
    the situation for cellular mobile communication in the countries of this region
    more difficult. Even with some later minor modifications, the end result is that
    the total bandwidth available for terrestrical uses is very small compared to
    the huge ever-increasing demand due to a large number of mobile users along with
    the increasing demand for multimedia communication.


    One possible way to overcome this problem of bandwidth crisis is by intelligent
    re-use of the frequencies at sufficiently distant cells of the cellular network
    so that these two frequencies do not interfere with each other. Over the past
    two decades, research results on this topic have appeared in the literature, and
    yet a number of problems need to be solved to develop an effective algorithm for
    channel allocation in cellular mobile networks. We will discuss these issues later
    in this text.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 1.3.3  Energy Management


    Energy is a current buzz word. However, there are two distinct groups of scientists
    and technologists who are interested in energy. One group focuses on the generation
    of energy from unconventional sources, and the other group looks for efficient
    utilization of energy in various real-life applications. Our concern in connection
    with cellular mobile networks is the same as that of the latter group.


    In particular, due to the mobility of the terminals, the mobile devices are operated
    with batteries having limited energy. Also, often the devices are small and hence
    the batteries used have small capacities of total energy. This has motivated the
    researchers to develop energy-efficient communication techniques which may be
    easily adopted in cellular mobile networks. Energy efficiency has been studied
    over the past few years for minimizing energy consumption in different layers
    of the communication protocols, e.g., in the physical layer, MAC layer, network
    layer, and so on. In the physical layer, for example, one may think of i) designing
    circuits with minimum number of gates and other electronic components to reduce
    the total power consumption, ii) selecting appropriate modulation and demodulation
    techniques for designing low-power transceivers. In the MAC layer, we may try
    to avoid collisions, or at least keep the collisions as few as possible, because
    a collision requires re-transmission of the collided message leading to waste
    of power. We may also try to keep the channel in sleep mode to use less power
    than in the normal mode and tweak the sleep, listen and awake periods for optimal
    performance in terms of energy consumption. In the network layer, the messages
    may be routed through a path requiring minimum hops and hence minimum energy consumption.


    We will devote Chapter 8 to energy-efficient communication in various low-power
    wireless networks.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 1.3.4 Security


    Security in communication is one of the very important aspects to be considered
    in most real-life applications involving message communication. In particular,
    the wireless networks are more vulnerable to attacks by intruders than the wired
    networks. This has given rise to security issues like user authentication, encryption
    and decryption of messages and jamming. However, often the algorithms designed
    for these purposes consume a lot of time and energy (through the use of large
    programs or complex hardware) which may not suitable for online wireless communication.
    Research to find suitable techniques for online low-energy secure communication
    in cellular mobile networks is ongoing.


    # 1.4 Issues in Ad Hoc Networks


    The important issues that need to be considered by the researchers and developers
    of ad hoc networks include the following:


    +   - Initialization

    +   - Leader election

    +   - Communication protocol

    +   - Location identification

    +   - Energy

    +   - Security'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_46_0.png)


    # FIGURE 1.4: Initialization in ad hoc networks


    # 1.4.1  Initialization and Leader Election


    The first two issues on the above list pertain only to ad hoc networks due to
    the absence of any infrastructure in the network as in the cellular mobile systems.
    In order to establish a communication between two nodes in the network, every
    node of the network must have a unique identifier or *Id* which should also be
    known to all other nodes in the network. This assignment of unique *Ids* to the
    nodes is known as *initialization*. Referring to Figure 1.4, there are seven nodes
    of the ad hoc network which are given unique *Ids* 1, 2, · · · , 7 by this initialization
    process. While assigning the unique *Ids*, due consideration must be given to
    the possibility that any node may drop out (be switched off or the battery may
    be out of power) any time, or go out of communication range from others; and at
    any time, any new node may join anywhere in the network. The topology of the network
    should be determined after every such arrival or departure of a node. In other
    words, the initialization algorithm must consider such dynamic behavior of the
    network.


    The second issue of leader election as given above is also a specific issue of
    ad hoc networks in absence of an infrastructure, e.g., a base station in a cellular
    mobile network. It is often easy to control communication in a network for optimizing
    other network parameters, e.g., network congestion due to flooding of messages,
    to-'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_47_0.png)


    tal energy expenditure on the nodes, and average message communication time, if
    the network has a so-called *leader* that will take control of message routing
    with a view to optimizing those parameters. Again, referring to Figure 1.5 with
    seven nodes in the ad hoc network, the node 4 is elected as a leader and after
    this election, node 4 broadcasts a message to all other nodes informing them of
    its election as the leader.


    Often it is advisable to cluster the network so that the nodes within a cluster
    are geographically near each other, requiring very little communication power
    of the transceivers; and a cluster head or leader of a cluster is chosen based
    on some criterion (for example, the smallest average distance from all the nodes
    in the cluster, maximum remaining energy, etc.). This is illustrated by the example
    in Figure 1.6. Communication between a node *u* in, say, cluster 1 and a node
    *v* in, say, cluster 2, may then be effected through the leaders of clusters 1
    and 2.


    In Chapter 5 of the book, we will discuss the different communication protocols
    used in ad hoc networks.


    # 1.4.2  Location Identification


    Most location estimation systems in cellular mobile and ad hoc networks utilize
    the fundamental method of using *trilateration* or *triangulation* of received
    sig-'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Wireless Networks and Mobile Computing


    ![](img/6578f6fc95ac71d2c7109e594d9df12f_48_0.png)


    nals to obtain an estimate of the receiver’s position [29]. In this method, in
    a two-

    dimensional geometry, the distances of the mobile terminal in question are measured

    from three reference points which are not collinear. By drawing three circles
    centered

    at these three reference points with these measured distances of the reference
    points

    from the terminal as the radii of these circles, we can estimate the coordinates
    of the

    mobile terminal. The distance of the mobile terminal from a reference point can
    be

    determined by sending a signal (at ultrasonic or radio frequency) from the reference

    point to the mobile terminal and then measuring the time of flight of the signal.
    This

    is also called the time of arrival (TOA) technique for finding the location of
    the mo-

    mile terminal. Such an estimate of the distance is possible if there is a direct
    path or

    a line of sight (LOS) communication between the transmitter and the receiver.
    Non-

    line of sight or NLOS signals occur under multi-path conditions when the received

    signals come from reflected, diffracted or scattered paths, thus introducing excess

    path lengths into the Euclidean distance between the transmitter and the receiver.
    The

    NLOS error is defined as the excess distance traversed compared to the direct
    path

    and is always positive. The corruption of LOS signals by NLOS signals and Gaussian'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'measurement noise are the major sources of error in all location estimation
    systems; the former is the dominant factor [2].


    Another possible way of locating a mobile terminal is by measuring the angle of
    arrival (AOA) in which the transmitter sends a signal which is received by the
    receiver with the help of a highly directional antenna so that the receiver can
    estimate the angle of arrival of the received signal with respect to a reference
    direction. By noting the directions of receipt of the LOS signals by the nodes
    at two reference points, the position of the mobile terminal can be found from
    the point of intersection of two straight lines.


    The first and arguably archetypal indoor location discovery system was the Active
    Badge Location System [31]. The Active Bat system used time difference of arrival
    technique [32]. Complementing the Active Bat was the Cricket system [5] which
    implemented both lateration and proximity techniques. It had a less precision
    than the Active Bat, but had the advantages of privacy support and a decentralized
    scalability. RADAR [4] was a building-wide tracking system developed by Microsoft.
    It used a building signal characteristic model for location estimation. Unfortunately,
    movements of people or objects may necessitate reconstruction of the pre-defined
    signal-strength database or creation of an entirely new database.


    The Global Positioning System (GPS) [3, 36] is perhaps the most widely publicized
    location-sensing system. Unfortunately, GPS does not scale well in dense urban
    areas or in indoor locations. Modeling of the radio propagation environment provides
    a more accurate location estimate by mitigating the effect of NLOS errors. While
    reasonably accurate radio propagation models exist for outdoor conditions [37,
    38, 39], unfortunately there are no such unanimously accepted models for indoor
    environments.


    Authors in [6] modeled distance errors for a sample office environment, measured
    using TOA techniques. Their simulation results show that LOS signals can be'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'modeled as a Gaussian distribution while the obstructed LOS signals may be
    treated as a combination of Gaussian and exponential distributions for the environment
    considered. Authors in [6, 41] demonstrated that the bandwidth of the channel
    plays an important role in the magnitude of errors introduced and that a minimum
    bandwidth of 100 MHz is required for effective location estimation.


    Several authors have attempted to mitigate the effect of NLOS errors [6, 42, 43,
    1, 45, 4, 46, 47, 48, 49]. The least squares (LS) algorithm [50, 51], uses the
    Davidon algorithm [52] to find a location estimate that would minimize the residual
    of the estimate. The residual weighting algorithm (Rwgh) was proposed in [42]
    as another way to mitigate the effects of errors in distance measurements caused
    by NLOS propagations. Authors in [50] compare different geolocation algorithms
    for indoor environments, assuming the channel characteristics proposed in [6].
    Authors in [43] proposed two algorithms for identification and correction of NLOS
    errors, based on _a priori_ knowledge of the NLOS errors. An NLOS error mitigation
    algorithm based on maximum likelihood detection has been presented in [53]. Another
    approach to location estimation was presented in [1], where the authors attempted
    to distinguish between LOS and NLOS measurements by assuming a statistical distribution
    of thermal receiver noise and signal characteristics.


    Authors in [54] considered the problem of position estimation in large area networks,
    particularly sensor networks. They based their algorithm on measurement of signal
    strengths or time difference of arrival of signals and then the use of statistical
    methods to characterize the separation distances between two nodes. APS [55] is
    another location estimation algorithm that does not use GPS. However, the use
    of a hop-by-hop propagation process, such as DV hop or DV distance to propagate
    location estimates makes it unsuitable for mobile and random graphs. Authors in
    [29] presented a location estimation algorithm based on triangulation technique
    of signals in a cellular mobile network that is suitable for outdoor environments.
    Au-'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'thors in [56] presented another GPS-free location estimation technique for
    mobile ad hoc networks. A common characteristic of all of the above algorithms
    is that they compute a single location point as an estimate. However, any estimation
    is a probabilistic measure and hence may be considerably different from the true
    scenario in some cases, especially for dense urban or indoor environments where
    NLOS errors are functions of location and time.


    # 1.4.3  Energy and Security Issues


    The energy and security issues in ad hoc networks are very much the same as those
    in cellular mobile networks. Some detailed discussions on these two issues in
    low-power wireless networks, in general, will be given in Chapters 8 and 9.


    # 1.5  Issues in Cognitive Radio Networks


    The important issues to be addressed in cognitive radio networks include:


    +   - Channel sensing

    +   - Channel allocation


    Detailed discussions on these two issues in the context of both single signals
    and multimedia signals in the network can be found in [57, 58, 59].


    # 1.6  Issues in Sensor Networks


    The important issues to be considered in sensor networks include the following:'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   - Placement of sensors

    +   - Communication protocols

    +   - Computation with streaming data

    +   - Energy

    +   - Security


    The first issue of deploying the sensors at strategic locations is important for
    several reasons depending on the application requirements. For example, for a
    video surveillance system using cameras as sensors in a shopping mall or a library,
    the visibility of all points of the mall or library by the set of camera sensors
    is essential. In another application of weather sensors, the placement should
    be such that all the sensors are able to communicate their sensed data to the
    sink location through other sensors using minimum energy for transmission and
    reception of all messages. We consider this aspect of placement in more details
    in Chapter 7.


    The issues of communication protocols, energy and security are similar to those
    in ad hoc networks. However, depending on the typical application requirement
    of the sensed data, some specific energy-efficient algorithms can be developed
    for the application layer of the communication protocol stack in some special
    types of sensor networks by exploiting the impact of the computation process on
    the sensed data.


