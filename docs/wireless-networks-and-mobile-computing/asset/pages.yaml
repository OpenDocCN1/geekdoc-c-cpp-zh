  md: '# Chapter 7


    # Placement of Sensor Nodes in WSN


    | Section | Title | Page |

    |---|---|---:|

    | 7.1 | Introduction | 335 |

    | 7.2 | Preliminaries | 336 |

    | 7.3 | Deployment Algorithm | 338 |

    | 7.4 | Experimental Results | 341 |

    | 7.5 | Exercises | 346 |

    |  | Bibliography | 347 |


    # 7.1  Introduction


    In this chapter, we consider the problem of deployment of sensor nodes in a wireless
    sensor network (WSN) to cover a region with a given number of sensor nodes. However,
    the results we present here will also be applicable for placement of base stations
    in a cellular mobile network. The overall objective is to place a given number
    of sensor nodes in a convex region and assign range to each of them so that every
    point in the region is covered by at least one sensor node and the maximum range
    assigned is minimized. We assume that the same range is assigned uniformly to
    all the sensor nodes and that the sensing ranges and communication ranges of the
    sensor nodes are the same.


    In an abstract sense, the above problem basically maps to completely cover a'
  merge: -1
  img_proc: true
- pgno: 356
  md: 'convex region (without leaving any holes) by a given number of circles of equal
    radius, as illustrated in Figure 7.1, with the objective of minimizing the radius.
    We describe an elegant algorithm for this problem using a Voronoi diagram, as
    presented in [8, 9]. Other results for this problem appear in the literature and
    indicate some special geometric structure of the region to be covered, e.g., a
    square [2] and an equilateral triangle [1]. For these special cases, the minimum
    radius obtained by the algorithm presented in [8] compares favorably with the
    results reported in [1, 2]. Also, the execution time of this algorithm is a fraction
    of a second, whereas the existing methods may require 2 weeks to yield a reasonable
    value of the number of circles (≥ 27) as reported in [1, 2], even for special
    cases.


    # 7.2  Preliminaries


    Consider a set of points $P = \{p_1,p_2,\ldots,p_k\}$ inside a convex polygon
    $\Pi$ where the $i$-th base station is located at point $p_i \in \Pi$. We use
    $VOR(P)$ to refer the Voronoi diagram [3] of the set of points $P$, and $vor(p_i)$
    to denote the Voronoi cell corresponding to the point $p_i \in P$. Since we need
    to establish communication inside $\Pi$, if a part of the region $vor(p_i)$ goes
    outside $\Pi$ for some $i$, the region $vor(p_i) \cap \Pi$ is used as $vor(p_i)$.


    Note that all the points inside $vor(p_i)$ are closer to $p_i$ than any other
    point $p_j \in P$, $j \ne i$. Thus, all these points will communicate with $p_i$.
    As all the sensor nodes are of equal range, our objective is to arrange the points
    in $P$ inside the region so that the maximum range required $(\rho)$ among the
    points in $P$ is as small as possible. The algorithm [8] described below is iterative.
    At each step, it perturbs the point set $P$ as explained below, and finally attains
    a local minimum.'
