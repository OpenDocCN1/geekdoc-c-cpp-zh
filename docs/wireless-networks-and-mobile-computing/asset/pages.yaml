    **FIGURE 9.1:** Circuit to compute $i_1$ and $i_2$


    **Step 1: Calculation of $i_1$ and $i_2$.** Incrementing $i_0$ by 1 and 2 can
    be done by the same clock pulse applied to two synchronous 8-bit counters. The
    counter for $i_1$ is initially loaded with 00000001 and the counter for $i_2$
    is loaded with 00000010, the initial states of these two indices. This serves
    the first two rounds of RC4, in both KSA and PRGA.


    Thereafter, in every other cycle, the clock pulse is applied to all the flip-flops
    except the ones at the LSB position for both the counters, as shown in Figure
    9.1. This will result in proper increments of $i_1$ that assume only the odd values
    1, 3, 5, . . ., and for $i_2$ assuming only the even values 2, 4, 6, . . ., as
    required in RC4. This is assured as the LSB of $i_1$ will always be 1 and that
    of $i_2$ will always be 0 as shown in Figure 9.1.


    **Step 2: Calculation of $j_1$ and $j_2$.** The values of $j_1$ and $j_2$ will
    be computed and stored in two 8-bit registers. To compute $j_1$, we need a 2-input
    parallel adder unit. It may use a carry lookahead adder or use *scan* operation
    as proposed by Sinha and Srimani [24], or use *carry-lookahead-tree* as proposed
    by Lynch and Swartzlander [13]. For computing $j_2$, there are two special cases:


    $$j_2=j_0+S_0[i_1]+S_1[i_2]=\begin{cases} j_0+S_0[i_1]+S_0[i_2] & \text{if } i_2\ne
    j_1 \\ j_0+S_0[i_1]+S_0[i_1] & \text{if } i_2=j_1. \end{cases}$$


    The only change from $S_0$ to $S_1$ is the swap $S_0[i_1]\leftrightarrow S_0[j_1]$,
    and hence we need'
