    environments, the performance degrades rapidly with increasing mobility.


    # 5.9  Ad Hoc On-Demand Distance Vector Routing (AODV)


    The *Ad hoc on-demand distance vector (AODV)* routing protocol belongs to the
    class of reactive routing protocols that blends some of the features from both
    *DSDV* and *DSR* protocols. The protocol is based on an on-demand route discovery.
    However, every node also maintains a routing table for storing the information
    regarding the most recent routing path to a destination node if such a route has
    already been discovered. Each such route has an associated lifetime. When a source
    node has data packets to be sent to a destination node, it first checks its routing
    table to see whether there already exists a valid or unexpired (i.e., within the
    lifetime) route from this source node to the required destination. If a route
    already exists, the source node uses it. Otherwise, the route discovery process
    is initiated.


