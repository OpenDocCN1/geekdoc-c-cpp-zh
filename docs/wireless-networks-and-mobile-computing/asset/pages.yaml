    # 8.3.4.2  Synchronization Issues


    A requirement for the correct detection of silent symbols in the RBNSiZeComm protocol
    is clock synchronization between the sender and the receiver. We assume that the
    receiver and the transmitter are i) synchronized for every packet on the MAC packet
    header as common in most wireless and wired communication protocols (e.g., in
    the IEEE 802.3 protocol the *preamble* field in the MAC frame header is utilized
    for synchronization of the sender and the receiver) or, ii) there exists a global
    clock source, for example, the *network time protocol* (NTP), which disseminates
    *International Atomic Time* (TAI) in the form of Coordinated Universal Time (UTC)
    to provide network-wide clock synchronization. For WSNs, a number of low overhead
    clock synchronization protocols are described in the literature [30, 31]. The
    transmission time of the payload of the packet is assumed to be small enough not
    to lose synchronization between the receiver and the transmitter during the transmission
    of consecutive silent symbols. The exact implementation of maintaining synchronization
    of nodes is left to the data link layer designer.


    # 8.3.4.3  Collision Avoidance Issues


    For contention-based medium access protocols, an issue that arises with the use
    of silence-based symbols in the transmitted data is how neighboring nodes determine
    whether a channel is free for transmission or whether there is an ongoing transmission
    containing a run of 0’s. An erroneous interpretation of the absence of any signal
    on air (carrier and/or baseband) can lead to corruption of an ongoing transmission
    (thus leading to retransmission and an increase in energy consumption by the communicating
    node pair) or unnecessary increase in communication delay due to waiting when
    a channel is actually free.'
