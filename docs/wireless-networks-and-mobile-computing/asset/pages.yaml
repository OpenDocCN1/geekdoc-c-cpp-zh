    # 8.6.3  Energy-efficient Communication Using TFNS


    We apply TFNS to communication systems to save energy during communication. Digital
    data in binary format are first converted to decimal form and the decimal number
    is encoded to the tri-digit Fibonaccian number using the appropriate conversion
    algorithm. If digital data are transmitted in this encoded form, i.e., TFNS-based
    format, the numbers of 1’s and 2’s in such data streams for large values of data
    are substantially reduced. The numbers of 0’s, 1’s and 2’s in such data streams
    are found to be in the ratio 44 to 38.2 to 17.8, respectively as against 50 to
    50 for 0’s and 1’s in normal binary coding.


    # 8.6.3.1  Implementation of TFNS Protocol


    The TFNS transmission scheme involves the recoding of an outgoing binary message
    to its equivalent decimal form and converting the decimal number into a tri-digit
    Fibonaccian number and transmitting it. The receiver then reconverts the received
    tri-digit Fibonaccian number to a decimal number and decodes into a binary number
    and passes it onto the higher layers of the communication stack for further processing.
    As in the case of TSS, we use a hybrid modulation scheme involving FSK and ASK.
    In the same way, the transmitter uses FSK modulation with two frequencies, such
    as *f_c* and *f_c + Δf* corresponding to the symbols 1 and 2, respectively. The
    transmitter is switched to *sleep* state during the transmission of the silent
    symbol (0’s). As in the case of TSS protocol, Figure 8.10 may be used as a receiver
    for implementation of the TFNS scheme based on non-coherent detection. We can
    use coherent detection'
