    # 8.6.1  Preliminaries


    Consider the Fibonacci sequence < 0, 1, 1, 2, 3, 5, 8, 13, 21, … > and denote
    the $n^{th}$ ($n \ge 0$) number of this sequence by $F_n$, where $F_0 = 0$, $F_1
    = F_2 = 1$, $F_3 = 2$, $F_4 = 3$, $F_5 = 5$ and so on. In FNS, the $i^{th}$ bit
    position ($i \ge 0$, $i = 0$ being the least significant bit) has the positional
    weight of $F_{i+2}$. In the literature, there exist different versions of FNS
    which have different representations of the same decimal number [37]. However,
    the normal form of FNS [35] always provides a unique representation of a given
    decimal number $N$ in FNS as shown in Table 8.20. Another interesting result regarding
    the Fibonacci numbers is that a positive integer can be expressed uniquely in
    terms of a sum of non-consecutive Fibonacci numbers as in Zeckendorf representation
    of numbers [38]. However, the positional weights in all such representations [35,
    38] consist of all the Fibonacci numbers in order, leading to a representation
    of a number in terms of a string of 0’s and 1’s only.


    One interesting property of the normal form of FNS is that if the $i^{th}$ ($i
    > 0$) bit is 1, the $(i − 1)^{th}$ bit must be a 0. That is, two consecutive 1’s
    do not appear in any of these normal codewords. The total numbers of 0’s and 1’s
    appearing at any bit position (starting from the most significant bit (msb)) of
    an $n$-bit FNS representation of all decimal numbers in the range $0 \le N \le
    F_{n+2} − 1$ can be visualized by an edge-weighted binary tree as shown in Figure
    8.23.


    The root node labeled * has the left child labeled as 0 with the corresponding
    edge weight of $F_{n+1}$, and a right child labeled as ‘1’ with the corresponding
    edge weight of $F_n$; considering the representation of all possible numbers,
    there are $F_{n+1}$ 0’s and $F_n$ 1’s at the msb (i.e., $(n − 1)^{th}$ bit position).
    This left child 0 of *, in turn, has a left child labeled 0 with the corresponding
    edge weight of $F_n$ and a right child'
