    # 5.4.6.2 Complexity Analysis


    The leader election process in Step 1 of *algorithm COSA* takes O(log log m) time
    [10, 11, 12]. Steps 2 and 5 take O(mD) time each for round-robin broadcast, assuming
    ∀ i, dᵢ ≪ D and wᵢ = O(m) for Step 5 of *algorithm COSA*. Step 3 of *algorithm
    COSA* takes O(1) time. Computation of an optimal slot assignment schedule by algorithm
    *homogeneous_slot_assignment* or algorithm *heterogeneous_slot_assignment* takes
    O(n) time where n is the number of cells in the cellular network. Thus, Step 4
    takes O(mD) + O(n) time. Hence, the complexity of the *algorithm COSA* is O(log
    log m + mD + n) time.


    # 5.4.6.3 New Mobile Terminal Joining the Network


    In each cell, the cell leader periodically transmits a *cell status message* Mₛ
    as stated above. This message is locally broadcast within the cell. When a new
    MT j joins the network in some cell i, it first waits for the Mₛ message. Subsequently
    it executes the following steps to join the network in cell i:


    **Step 1:** If there exists at least one unused time slot in cell i, mobile terminal
    j randomly selects an unused time slot k of cell i and sends a HELLO message to
    the cell leader Lᵢ. In the event that there are no free slots in cell i that can
    be used by j, j transmits a HELLO message in the highest value control slot, which
    according to the protocol is always unused. The HELLO message contains the following
    information and its structure is shown in Figure 5.15.


    +   1. Message Type is set to HELLO'
