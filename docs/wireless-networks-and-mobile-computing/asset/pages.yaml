  md: '![](img/6578f6fc95ac71d2c7109e594d9df12f_200_0.png)


    # **FIGURE 4.1:** Delay channel and receiver design


    GPS, by far the most widely used location sensing technology, has an accuracy
    of 1 to 5 meters in outdoor environments for 95 to 99% of the time [3]. Microsoft
    Radar [4] claims an accuracy of 3 to 4.3 meter, while PinPoint 3D-iD and WhereNet
    [3] have location accuracies of 1 to 3 meter. The Cricket system [5] has an accuracy
    of 4 × 4 feet regions nearly 100% of the time. Based on the application scenario,
    we can thus set an appropriate value for ε corresponding to the reference nodes.


    To determine a ±δ bound on range measurement errors, NLOS error is assumed to
    be the major contributor for errors in measured ranges. The error due to thermal
    noise (η_tw in Equation (4.1)) is generally much smaller than the NLOS error component
    and ignored in the subsequent discussions. In [6], experimental results show that
    for indoor locations where line of sight exists between the transmitter and the
    receiver, the zero mean Gaussian model for normalized distance error closely models
    the NLOS distance error. For the indoor obstructed line of sight (OLOS) case,
    while the Gaussian model is not suitable, a mixed distribution consisting of zero
    mean Gaussian and exponential distribution fits the distance error very well.


    While it is not possible to know the extent of error introduced in the measured
    range due to NLOS propagation, it is possible to estimate the maximum NLOS error
    that can be tolerated so that a transmitted signal is correctly interpreted at
    the receiver. To analyze the amount of tolerable NLOS error, consider a *delay
    channel* and a receiver circuit as shown in Figure 4.1. In a delay channel, the
    output channel state at a given instant *t* is the same as the input channel state
    at instant *t − t′*. A receiver'
