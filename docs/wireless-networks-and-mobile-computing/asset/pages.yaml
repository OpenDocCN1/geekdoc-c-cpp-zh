- pgno: 504
  md: 'where $N$ is a product of two large prime numbers $p$ and $q$. It is very difficult
    for even the most powerful computer to compute $p$ and $q$ within a reasonable
    time if it knows only $N$. We form a secret key $k$ as $k=(d,N)$, where $d$ is
    a private key although $N$ is publicly known. The signature algorithm to be executed
    by a node to be authenticated is $S(d,N)(m)=m^d\ mod\ N$ (assuming that $m^d\
    mod\ N$ is a collision-resistant function of $d$). Thus, $a=m^d\ mod\ N$. The
    corresponding verification function will be $V(d,N)(m,a)\equiv(a^e\ mod\ N=m)$,
    where $ed\ mod\ (p-1)(q-1)=1$. Even if a node knows $e$ and $N$, i.e., the verification
    function, it is computationally infeasible or very difficult to compute $d$ from
    the knowledge of $e$ and $N$, as $p$ and $q$ are difficult to compute from $N$.
    That is, the function $S$ cannot be computed from the knowledge of the function
    $V$.


    # 9.2.2  Intrusion Detection


    Intrusion detection techniques depend on detecting deviations of the characteristics
    of an internal node. If we gather statistical data about the contribution of a
    node to the various network function related parameters, an idea about the normal
    behavior of that node can be estimated. Any deviation from this estimated normal
    behavior might be considered an abnormal behavior or an anomaly that might be
    used for identifying this node as an intruder. The network function-related parameters
    that might be used for anomaly detection include packet drop ratio, delay in packet
    forwarding and successful forwarding of packets following the designated route
    (if route is computed at the source). In fact, this depends on the statistical
    behavior of nodes over a long period and appropriate modeling of the behavior
    of each constituent node. Inference from such analysis may require a lot of engineering.
    The potential problems with these techniques involve failure to detect a true
    intruder and false identification of a good node as an intruder.'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# 9.2.3 Message Encryption


    To guard against eavesdropping or man-in-the-middle attack, it is necessary that
    the source node properly encrypts its message *m* which can be decrypted only
    by its intended recipient. Thus, the message cannot be known by an external attacker
    or an intermediate internal node. As a consequence, this message cannot be changed
    by the attacker. There are two different types of encryption algorithms. The first
    is based on a **symmetric key encryption** in which every pair of sender and receiver
    nodes share a common key which is kept secret from all other nodes. The example
    is the **Data Encryption Standard (DES)** adopted by the National Institute of
    Standards and Technology (NIST) in the U.S. and largely used for civilian applications.
    However, in 2001, DES was considered insecure for many applications as it used
    key values only 56 bits long which can be exhaustively searched with available
    computing resources. DES was replaced by the **Advanced Encryption Standard (AES)**
    which works on blocks of 128 bits and key lengths of 128 bits to 256 bits.


    The main problem with the symmetric key encryption is key management. If there
    are *n* nodes in the network, the number of possible communicating pairs will
    be *n(n − 1)/2*, and thus we need *O(n²)* secret keys. Managing such a large number
    of secret keys, one for each pair of communicating nodes, is a problem in practice
    when the security of communication channel is questionable.


    The other type of encryption algorithm is based on **asymmetric key encryption**
    which started with a ground-breaking idea of Diffie and Hellman in 1976. They
    proposed the notion of public key cryptography involving two different keys, one
    *public key* known to all and the other a *private key* known only to the recipient
    of a message. Anyone can use the public key to encrypt a message, but someone
    who has the private key can only decrypt the message. Thus, effectively, for all
    *n* nodes, we need to manage only *n* secret keys, far better than the *O(n²)*
    secret keys required for symmetric key encryption. The success of this idea is
    heavily dependent on the'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'proposition that for any communicating pair, even if the public key is known,
    specifically to the attacker, it is not possible for any party to compute the
    secret private key from the public key. The **RSA algorithm** is the first successful
    encryption algorithm based on the above idea.


    The RSA algorithm is applicable for encryption of a block of data or message bits.
    In many real-life applications, message bits are transmitted as streams, for example,
    in a wireless communication channel. For such applications, a different class
    of encryption algorithms, commonly known as **stream ciphers** are needed which
    differ from the so-called **block ciphers** like the RSA algorithm.


    Stream ciphers are broadly classified into two categories depending on the platform
    most suited to their implementation: software stream ciphers and hardware stream
    ciphers. RC4 is one of the widely used stream ciphers implemented in software.
    This cipher is used in network protocols such as SSL, TLS, WEP and WPA. The cipher
    also finds applications in Microsoft Windows, Lotus Notes, Apple AOCE and Oracle
    Secure SQL. Though several other efficient and secure stream ciphers were devised
    after RC4, it is still the most popular stream cipher algorithm due to its simplicity,
    ease of implementation, and speed.


    # 9.2.4 RC4 Stream Cipher


    The RC4 stream cipher was designed by Ron Rivest for RSA Data Security in 1987.
    It uses *S*-box *S*, an array of length *N*, where each location of *S* stores
    one byte (typically, *N* = 256). A secret key *k* of size *l* bytes is used to
    scramble this permutation (typically, 5 ≤ *l* ≤ 16). Array *K* of length *N* holds
    the main key, with secret key *k* repeated as *K[y] = k[y mod l]*, for 0 ≤ *y*
    ≤ *N* − 1.


    RC4 has two components, namely the key scheduling algorithm (KSA) and the pseudo-random
    generation algorithm (PRGA). The KSA uses the key *K* to generate a pseudo-random
    permutation *S* of {0, 1, . . . , *N* − 1} and PRGA uses'
  merge: -1
  img_proc: true
- pgno: 507
  md: 'this pseudo-random permutation to generate arbitrary number of pseudo-random
    keystream bytes. The procedures are in Algorithms 1 and 2, respectively.


    ```

    **Algorithm 1** Key Scheduling Algorithm


    1: **procedure** KSA(Secret Key *K*)

    2: Initialize *S* ← {0, 1, . . . , *N* − 1} and *j* ← 0

    3: **for** *i* = 0, . . . , *N* − 1 **do**

    4:       Increment: *j* ← *j* + *S*[*i*] + *K*[*i*]

    5:       Swap: *S*[*i*] ↔ *S*[*j*]

    6: **end for**

    7: **return** S-box *S*

    8: **end procedure**

    ```


    ```

    **Algorithm 2** Pseudo-Random Generation Algorithm


    1: **procedure** PRGA(*S*-box *S*)

    2: Initialize indices: *i* ← 0, *j* ← 0

    3: **while** TRUE **do**

    4:       Increment: *i* ← *i* + 1, *j* ← *j* + *S*[*i*]

    5:       Swap: *S*[*i*] ↔ *S*[*j*]

    6:       **output** *Z* ← *S*[*S*[*i*] + *S*[*j*]]

    7: **end while**

    8: **end procedure**

    ```


    Any arithmetic addition used in context of RC4 is in general addition modulo *N*,
    unless specified otherwise. The output keystream *Z* is XOR-ed with the plaintext
    (byte per byte) to generate the ciphertext at the sender end (*C* = *M* ⊕ *Z*),
    and is XOR-ed with the ciphertext to get back the plaintext at the receiver end
    (*M* = *C* ⊕ *Z*).


    Efficiency of keystream throughput is used as a benchmarking parameter for stream
    ciphers. The efficiency of the RC4 obviously depends on the efficiency of KSA
    and PRGA. While the KSA invokes a fixed cost for generating the initial pseudo-random
    state *S*, the PRGA incurs a variable cost based on the number of keystream bytes
    to be generated. An efficient implementation of RC4 would minimize the cost per
    round of KSA and PRGA to provide better throughput. The software implementation
    of RC4 is simple, and a detailed comparison of the software performance of eSTREAM
    and RC4 is given in [2]. It is rumored in the cryptographic'
  merge: -1
  img_proc: true
- pgno: 508
  md: 'community that an efficient RC4 software implementation can produce keystream
    bytes at a rate of 3 cycles per byte. However, there is no documented evidence
    to prove this claim. The best software performance of RC4 stated in the literature
    [2] provides an account of 7 to 15 cycles per byte of RC4 keystream, depending
    on the processor and the clock speed on which the cipher was tested. This rate
    is slow for typical wireless communication applications.


    In contrast to the software implementation, a hardware implementation of the RC4
    stream cipher may possibly be faster and find potential applications in encrypting
    and decrypting message streams in a wireless communication network. A number of
    attempts for efficient hardware implementation of RC4 have already been reported
    in the literature.


    A 3-cycle-per-byte efficient implementation of RC4 on custom pipelined hardware
    was proposed by Kitsos et al. [11] in 2003. Later, a patent by Matthews [17] was
    disclosed and provided a similar 3-cycles-per-byte architecture using hardware
    pipelining. Five years later, Matthews disclosed another patent [18] that included
    a design for RC4 hardware based on pipeline architecture that could increase the
    efficiency of the cipher to obtain 1-byte-per-cycle in RC4 PRGA. In 2013, Sen
    Gupta et al. [1] introduced a hardware implementation of RC4 that also produced
    1 byte per cycle as in the Mathews’ patent [18]. We describe below a hardware
    implementation of RC4 [1] which is based on loop unfolding and instruction rescheduling
    with a three-stage pipelining, resulting in less hardware cost and complexity
    than in [18]. Note that wireless communication devices are often constrained by
    the computing resources and optimization of resources and speed are always beneficial.


    The approach followed in [1] is based on twofold unrolling of the loop in the
    PRGA algorithm, rescheduling the instructions in the two consecutive iterations
    of the loop, and generating one cipher byte per cycle in a three-stage pipelined
    fash-'
