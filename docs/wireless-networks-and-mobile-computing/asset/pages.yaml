  md: '**Step 2:** *L* broadcasts the mapping to convert the geographical region into
    a hexagonal grid structure to all the nodes of the network. It transmits a message
    *M* consisting of:


    +   - The id of the MT transmitting the message

    +   - A mapping to convert the geographical region into a hexagonal grid structure

    +   - A list of the ids of all MTs heard by *L*


    Each node, on receiving this message, appends it with its own location coordinates
    to be known to all other nodes. An MT *i* transmits its message in the *i*th slot
    to avoid collisions during this step.


    **Step 3:** For each cell *i*, a *cell leader* *Lᵢ* is elected from the MTs residing
    in cell *i*, based on some metric such as remaining battery power, load, location,
    etc. [11].


    **Step 4:** The demand of each cell *i*, *wᵢ* is communicated by each cell leader
    *Lᵢ* to the network leader *L*. *L* produces an optimal, collision-free transmission
    schedule by executing the *homogeneous_slot_assignment* or the *heterogeneous_slot_assignment*
    algorithm.


    **Step 5:** *L* broadcasts the slot assignment schedule of the network to each
    cell leader.


    The slot assignment schedule details the slots assigned to each cell *i*, that
    demand *wᵢ* slots. Once a cell leader *Lᵢ* of cell *i* receives the information
    about the slots assigned to it from *L*, it generates a transmission schedule
    for the MTs in cell *i* and transmits a periodic local broadcast of this schedule
    within cell *i*.


    For Step 2 of the *COSA algorithm*, assuming it takes *O(1)* time to transmit
