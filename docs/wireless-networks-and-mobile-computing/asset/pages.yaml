  md: 'to have fast, energy-efficient and deterministic broadcast and gossiping protocols
    for wireless ad hoc networks by resolving collisions efficiently. Such protocols
    with efficient collision resolution mechanisms would provide low end-to-end latency
    and low overhead for retransmission of the collided messages. Most existing broadcast
    and gossiping algorithms do not address these issues together.


    In this section, we present deterministic broadcast and gossiping algorithms as
    proposed [13] for mobile ad hoc networks that have low broadcast latencies. The
    algorithms presented here assume collision detection capabilities at the mobile
    terminals.


    The deterministic broadcast algorithm is based on breadth-first traversal of the
    nodes of the network. The algorithm allows *simultaneous transmission* by multiple
    nodes. Although this may result in collisions at the receiving nodes, the algorithm
    can detect and take corrective measures to eventually avoid collisions. The idea
    of breadth-first broadcast was first proposed in [7, 15] where the two different
    types of rounds of transmission, *control round* and *message round*, made the
    protocol somewhat complex. However, in [13], only one type of round of transmission
    has been used. The algorithm presented in citesinhA08 works for scenarios where
    network topologies change frequently due to high mobility of the nodes and takes
    $O(n \log n)$ time in the worst case. Both the average case and worst case performances
    of this breadth-first algorithm are better than the *polylog broadcast* algorithm
    proposed in [3]. Simulation results show that the time complexity of this breadth-first
    algorithm on an average is upper bounded by $8D \log n$. The reported simulation
    results were obtained for networks having 100 nodes to 1024 nodes. It may be noted
    that the asymptotic lower bound for deterministic broadcast in networks where
    spontaneous transmission by the nodes is not allowed is on average $\Omega(D \log
    n)$ [5]. Also, based on simulation results, the time to complete broadcast is
    almost insensitive to the mo-'
