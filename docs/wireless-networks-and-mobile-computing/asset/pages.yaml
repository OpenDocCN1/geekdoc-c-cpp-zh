  md: 'One way to avoid this would be to utilize only designated time slots in a predetermined
    transmission schedule for data communication. For example, in the 802.15.4 protocol,
    one may choose to employ RBNSiZeComm-based data transmission only during the _contention-free
    period_ (CFP).


    For contention-based medium access, three possible MAC layer schemes can detect
    and resolve collisions for acquiring the channel.


    The first is based on a longer carrier sensing time, equal to the duration of
    the maximum allowable number of bits in the message as determined by the protocol,
    by a neighboring node (that wishes to transmit over the same channel) so that
    collision is avoided.


    The second scheme is based on inserting a 1 or \(\bar{1}\) (similar to bit stuffing)
    after every run of 0’s of a predefined length. This avoids collision, but the
    overhead would be a small increase in transmission time and energy. This is in
    line with similar techniques used in protocols like IEEE 802.15.4.


    A third possible scheme is based on waiting for a few, say _w_, symbol periods
    to get a non-zero symbol and then trying to retransmit which may, however, cause
    a collision with a probability as a function of _w_. If a collision is detected,
    standard backoff techniques similar to those used in IEEE 802.3 and IEEE 802.15.4
    may be used. As an example, in CSMA-CA-based IEEE 802.15.4, before a node attempts
    to send a frame in the _contention access period_ (CAP), it waits for a random
    backoff period chosen from a specific integer range. After completing a backoff,
    a node performs a _clear channel assessment_ (CCA) for eight symbol periods to
    assess whether the channel is busy. If after eight symbol periods the channel
    is assessed to be free, the node attempts a transmission.


