- pgno: 520
  md: 'This complete block of architecture performs in a cascaded pipeline fashion,
    as the indices *i₂*, *j₂* and the state *Sₙ₊₂* are fed back into the system at
    the end of φₙ₊₂ (actually, *iₙ₊₂* is fed back at the end of φₙ₊₁ to allow for
    the increments at the trailing edge of φₙ₊₂). The operational gap between two
    iterations (e.g., *n*ᵗʰ and (*n* + 2)ᵗʰ) of the system is thus two clock cycles
    (e.g., φₙ to φₙ₊₂), and we obtain two output bytes per iteration.


    Hence, the circuit for PRGA shown in Figure 9.6, produces 2*N* bytes of output
    stream in *N* iterations, over 2*N* clock cycles. Note that the initial clock
    pulse φ₀ is an extra one, and the production of the output bytes lags the feedback
    cycle by one clock pulse in every iteration (e.g., φₙ₊₃ in case of *n*ᵗʰ iteration).
    Therefore, this design produces 2*N* output bytes in 2*N* clock cycles or one
    byte per clock, after an initial lag of two clock cycles.


    **Issues with KSA.** Note that the general KSA routine runs for 256 iterations
    to produce the initial permutation of the *S*-box. Moreover, the steps of KSA
    are similar to the steps of PRGA except that:


    +   - Calculation of *j* involves key *K* along with *S* and *i*.

    +   - Computing *Z₁, Z₂* is not required or advised.


    We use the *loop-unrolled* PRGA architecture (Figure 9.6) for the KSA with some
    minor modifications, as follows:


    +   1. **K-register bank:** Introduce a new register bank for key *K*. It will
    contain *l* 8-bit registers, where 8 ≤ *l* ≤ 15 in practice.

    +   2. **K-register MUX:** To read key values *K[i₁ mod l]* and *K[i₂ mod l]*
    from the *K*-registers, we introduce two 16-to-1 multiplexer units. The first
    *l* input lines of this MUX will be fed data from registers *K[0]* to *K[l − 1]*,
    and the remaining (16 − *l*) inputs can be left floating (recall that 8 ≤ *l*
    ≤ 15). The control lines'
