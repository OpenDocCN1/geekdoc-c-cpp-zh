  - '**Theorem 16.** 给定任意子集 $R$ 的 $V$，满足 $2^h \leq |R| \leq 2^{h+1}-1$，$h \geq 0$，且
    $n \geq r^h(2^{h+1}-1)/2^h$，则至少存在一个 $j \leq h$ 级块，其中仅包含 $R$ 的一个元素。'
- - '##'
  - '**Theorem 17.** 考虑一个在相位开始时尚未接收到消息的节点 $x$，以及至少有一个节点 $y$（在节点 $x$ 的邻居集合 $R$ 中）已经拥有消息。在该相位期间，必然存在至少一个时间槽
    $T(k)$（$0 \leq k \leq r^h\frac{m!}{(m-h)!}-1$），使得恰好有一个已知的邻居在该时隙发送消息，节点 $x$ 能够正确接收（不发生碰撞）。'
