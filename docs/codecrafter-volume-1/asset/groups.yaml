    # Codecrafter ~ 133


    Tagglinde. Sorcery is a skill that requires diligence and patience. It is not
    something to master, but to meet as a challenge every day and keep learning. Your
    life will be hard if you stay, Tagglinde. But if you truly want to learn... I
    will give you my blessing.


    Tagg reached out her arms to hug him. “Thank you, Papa.” She looked up into his
    face, the stern, lined visage that she had known all of her life.


    He was smiling. “You are welcome, Tagglinde.”


    She watched her father’s ship leave the following afternoon. The south wall of
    Tilde overlooked the bay, and she stood there until the sails vanished into the
    east, heavily on her staff to support her healing leg. She was sure he would make
    a great king. And she would be a great sorcerer.


    Footsteps on the battlements caused her to turn, and she saw Rushingfoam had climbed
    up to join her.


    “I’m sorry,” she said before he could speak.


    “You’re– oh, the lang-monsters,” he said. “I ought to apologize to you, it seems.
    I am sorry I scared you.”


    # 134 ~ Erica Sandbothe


    Tagg nodded. “I’m sorry I hurt your thesis. Did it turn out all right?”


    Rushingfoam regarded her steadily. “The Dean was... more understanding than I
    thought. It seems his own dissertation took place during the Year of the Great
    Hurricane, and he said, at, at least when that happened the lang-monsters still
    worked. So he has given me an extension.”


    “I’m glad,” said Tagg, shifting uneasily on her injured leg. “I didn’t mean to
    hurt you, I hope you know.”


    “I know,” said Rushingfoam. “But it is all in the past. Tagglinde, you have missed
    quite a number of your lessons.”


    Tagg blanched. “I’m sorry, I don’t know if you heard—”


    Rushingfoam raised an eyebrow. “Oh, and now it will be some we story about how
    you were kidnapped and could not turn in your homework? You must think I am a
    complete newb to believe something like that.”


    Tagg bit her lip. “Well....”


    Then Rushingfoam smiled. “Do not worry, Tagglinde. I am certainly not the one
    to begrudge you an extension. And if I was, your Melga was quite emphatic that
    I not penalize you in any way for missing lessons. She sought me out yesterday
    and, ah, gave me my orders. ‘You be good to my sponsored or else,’ were her exact
    words, I believe.


    Tagg had a brief thought of Melga “interceding” with Rushingfoam. Probably threatening
    to turn him into a carrot, if she knew Melga. Tagg had not thought it possible
    that things could change so much between her and her sponsor, and yet they had.
    Many things had changed since her coming to Tilde.


    And many things would change in the future. Her father would be a king –and she
    a kingsdaughter. But more importantly, she would be a sorcerer. And if Floria
    took it into her head to make trouble, well, Tagg would be ready.


    “I am glad you are going to stay here,” said Rushingfoam.


    “Thank you, Rushingfoam,” said Tagg. “I’m glad, too.”


    # Author''s Note


    Tagg''s world is fiction, but the words of her codecraft are not. They are drawn
    from real computer programming languages that people all over the world use to
    create everything from the navigation instruments in space shuttles to the graphics
    in popular video games. The language of the Three compilers is based on the C
    and C++ programming languages, and can be learned by anyone with a computer and
    a little time to spend. Rushingfoam''s lessons are both taken from real mathematical
    theorems, one of which really is called the Pigeonhole Principle.


    # About the Author


    Erica Sandbothe learned her codecraft at Carnegie Mellon University, where she
    graduated with a B.S. in Computer Science and a minor in Creative Writing.

    She lives in Pittsburgh.


    Visit her online at http://www.ericasandbothe.com


    Learn more about the world of Codecrafter at http://www.codecrafter.org


