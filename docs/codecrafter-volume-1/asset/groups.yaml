    \ for a long time. It seemed to be right. She coaxed the lang-monster over to\
    \ her desk then set the paper down for him to look at. The Chreeling snuffled\
    \ over the parchment just as Ukan had, then inhaled the words on the page.\n\n\
    Two seconds later the lang-monster had vomited a steaming mess at her feet. The\
    \ harassed-looking man who supervised the session gave her a shovel and a bucket\
    \ while glancing at her code. “He doesn't know how to print if you don't tell\
    \ him he needs that library.”\n\nTagg winced. How could she have forgotten to\
    \ include a reference to the code libraries that they had used that very day?\
    \ Without knowing how to understand print, the lang-monster would just, well,\
