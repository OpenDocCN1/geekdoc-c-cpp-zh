    “No, there is,” said Rushingfoam. It just has to go into a hole with another pigeon.”
    He retrieved the pigeon and placed it in a cubby with one of the smaller birds.
    According to the laws of pigeons, it promptly relieved itself. Our law is then,
    when we have more pigeons than places to put them, there will be a place where
    more than one pigeon must go: a cubby with two pigeons.


    “So, that’s rather obvious,” said Tagg. “What does this have to do with stockings?”


    “Well, let us consider reshaping our stocking problem. We have, in essence, two
    cubbyholes—two colors. If we draw out three stockings—or pigeons—in the dark,
    we are guaranteed to have at least two stockings that go in one hole—two stockings
    that have the same color, and thus are just the pair we need. Do you understand?”


    “Well, it’s not quite the same as having the pigeons, though, is is it?” said
