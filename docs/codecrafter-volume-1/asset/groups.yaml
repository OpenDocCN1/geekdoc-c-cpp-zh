    “Stop! Tagglinde! Stop! Come back!”


    Her scarf had fallen back from her hair. The soldier


    looked at her sharply. “Tagglinde?”


    Then he smiled.'
  - '[PAGE 112]


    Tagg was jostled awake. Her head ached and her arms and legs were bound tightly.
    She tried to open her eyes, but could only see the darkest of midnight blue. When
    she breathed in, fabric pressed up against her mouth and nose.


    She struggled, trying to free herself from her bonds. New pains flared to life
    in her neck and ankles. She tried to remember what had happened.


    Then she did.


    Her thrashing became more violent. She tried to scream. How could she let herself
    be captured? How *could* it happen? She began to breathe in short, ragged gasps.


    She passed out.'
  - '[PAGE 113]


    When she came to, the jostling had stopped. She was on solid ground, and could
    feel every rock and twig beneath her. Then she was turning, turning, and coughing
    and gasping and then light, light that hurt her eyes and made her shrink back.


    There were soldiers all around her, setting up camp. Tagg felt a tug beneath her
    and she was knocked over. It suddenly became clear: they had smuggled her out
    of Tilde wrapped in a roll of cloth. Her hands and feet were tied with rope, and
    it was only when rough hands pulled her into a sitting position that she could
    see the face of her captor.


    It was the soldier captain from the langhouse, the same man who issued Floria’s
    decree before the contests. And at his throat... an iron chain of Tilden codecraft.


    “Awake now?” he said. When she struggled back from him he held up his hands. “Now,
    now, we don’t plan on hurting you, at least as long as you don’t make trouble.”


    “Let me go,” croaked Tagg. “Let me go!”


    “I can’t do that... Lordsdaughter. You are Taglinde of Morthigern, are you not?”'
  - '[PAGE 114]


    # Codecrafter ~ 107


    “No,” said Tagg. “I-I’m Alia Smithsdaughter.”


    “The sorcerers at Tilde tend to think that you aren’t.”


    “They’re lying,” she said.


    “They were quite angry to find out you hindered the lang-monsters, you know,”
    he said. “It seems to me you might not want go back.”


    A thread of guilt boiled up in the mixture of fear and panic within her. It...
    it couldn’t be true, could it? She hadn’t thought that... no, they wouldn’t...
    he had to be lying to her...


    The captain could see the conflict on her face. “You just think that over, then,”
    he said. He picked up a case that caught in Tagg’s memory at once. The same carvings,
    the same handles... it was just the same.


    “You,” she cried. “You sent me –sent me the infinite loop box. You tried to kill
    me!” She began to scream, yell, lashing and kicking with all of her might.


    The soldier backhanded her across the mouth. Tagg tasted the coppery tang of blood
    on her tongue.


    “Quiet!” said the captain. “Do not make this difficult, or I will kill you. Floria
    has set no rules on your condition for me to collect the reward. Be sure I interpret
    as ‘alive.”'
  - '[PAGE 115]


    108 ~ Erica Sandbothe


    He opened the case and Tagg saw eight slots inside. The soldier drew a short reed
    from the first slot and stuck it into the ground at Tagg''s feet. Tagg shivered
    at once.


    “I trust you''ve seen a partish before. You may well know that these will prevent
    anyone *outside* from tracing you, and prevent you from doing any spellwork *inside*.


    Tagg instantly felt her shoulders droop, and her eyes were difficult to keep open.


    “Ah, yes, the drugging effect is another benefit. Pleasant dreams, Lordsdaughter.”


    ***


    When Tagg woke up the next day she was too tired to move. Just as the partishes
    had formed a sandbox for Melga''s spells by stretching and holding each other
    head-to-tail, these partishes had stretched into a hoop on the ground around her.
    The soldiers had removed the bindings from Tagg''s wrists and ankles, setting
    them just out of her reach beside the empty case. With all of her limbs feeling
    like lead, Tagg couldn''t help thinking that she might have preferred the ropes
    if it meant no partishes.


    None of the soldiers looked at her as they broke camp.'
  - '[PAGE 116]


    The captain arrived just as they were smothering the campfire, picking up the
    piece of rope from where he had placed it beside the partishes’ case.


    “I hope you’ve rested well, Lordsdaughter,” said the captain. “Hold out your hands.”


    Tagg wanted to refuse him, but the draining effects of the partishes meant that
    she couldn’t have lifted her arms even had she wanted to.


    The captain grabbed her hands then tied them roughly, doing the same with her
    feet. Then he said a word and the partishes inched from their circle into the
    ornate case.


    They need to recharge, Tagg remembered. She wondered if she could use the fact
    to escape. Having the creatures at a distance lifted some of the tiredness, though
    her bones still ached.


    But any chance of escape that day was rendered impossible. The soldiers bundled
    her back into the groundcloth that they had used to smuggle her out of Tilde,
    but this time they left space so that she could look out from the roll. When they
    piled her into a wagon, she was able to watch the clouds go by while she struggled.


    Think, Tagg, she told herself. Struggling isn’t doing'
