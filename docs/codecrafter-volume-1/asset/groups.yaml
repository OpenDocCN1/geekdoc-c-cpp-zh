    # Codecrafter ~ 133


    Tagglinde. Sorcery is a skill that requires diligence and patience. It is not
    something to master, but to meet as a challenge every day and keep learning. Your
    life will be hard if you stay, Tagglinde. But if you truly want to learn... I
    will give you my blessing.


    Tagg reached out her arms to hug him. “Thank you, Papa.” She looked up into his
    face, the stern, lined visage that she had known all of her life.


    He was smiling. “You are welcome, Tagglinde.”


    She watched her father’s ship leave the following afternoon. The south wall of
    Tilde overlooked the bay, and she stood there until the sails vanished into the
    east, heavily on her staff to support her healing leg. She was sure he would make
    a great king. And she would be a great sorcerer.


    Footsteps on the battlements caused her to turn, and she saw Rushingfoam had climbed
    up to join her.


    “I’m sorry,” she said before he could speak.


    “You’re– oh, the lang-monsters,” he said. “I ought to apologize to you, it seems.
    I am sorry I scared you.”'
