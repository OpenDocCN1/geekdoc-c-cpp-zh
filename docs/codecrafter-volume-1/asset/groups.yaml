    # 作者的话


    Tagg的世界是虚构的，但她代码魔法（codecraft）中的文字并非如此。它们源自真实的计算机编程语言，全世界的人使用这些语言来创造从太空穿梭器导航仪器到热门视频游戏图形的一切切物。“三编译器”的语言基于
    C 和 C++ 编程语言，任何拥有电脑和一点时间的人都可以学习。奔流的课程也取自真实的数学定理，其中一个真的就叫做“鸽巢原理”。


    # 关于作者


    Erica Sandbothe 在卡内基·梅隆大学学习了她的代码魔法，她在那里获得了计算机科学文学学士学位和创意写作辅修学位。

    她住在匹兹堡。


    访问她的个人网站：http://www.ericasandbothe.com


    了解更多 Codecrafter 世界请访问：http://www.codecrafter.org


    # 力量源于代码


    Tagg来到蒂尔只有一个：成为一名魔法师，一个可以锻造自己魔法咒的术士。这条道路并不容易。Tagg必须面对无限循环的顽劣学生、棘手的语言怪物，以及一位女王的愤怒。


    最重要的是，她将面对成为魔法师意味着什么。


    因为Tagg正在学习的文字确实魔法。它们是计算机科学。


    Codecfter设定在一个世界，咒语是软件，魔法是可以编程的，一个女孩必须利用她所有的技能来战胜想要摧毁她的敌人。


