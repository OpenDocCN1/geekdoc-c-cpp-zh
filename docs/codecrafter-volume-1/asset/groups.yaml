    Ukan。由于图夫顿允许她和那些鸟类在Ukan上编译代码，因此“rwx”必须意味着某种类型的使用。因此，“—”就必须意味着“无权限”。


    塔格脸上掠过一丝细微的微笑。


    最困难的部分是将目录从语言房（langhouse）里偷偷溜出去。考虑到她的计划，她不能把书随处乱放以免别人破坏了她的工作。幸运的是，邦·马雷特（Bon Marett）已经离开了，可能是去处理他的脸了，她得以避开其他可能对她裙子里隐藏的大书提问的随从者。她尽快地向蒂尔德（Tilde）的西墙跑去，寻找一个安全的地方来工作。


    大厅后面有一个花园，贯穿其中的铺石小路上刻着数字。术士们称其为“数字花园”，尽管旁边的标牌上写着“奶牛营地”。无论它以前是什么地方，现在都被荆刺和棕色砂岩碎石覆盖了。塔格放慢了脚步，在确认没有人在看时，躲在两块石板后面，这两块石板在小路旁形成了一个屏风。


    她取出开头，沿着起始列的行向下操作。无论这个语言怪物（lang-monster）是被分配给某个术士的，还是铜变玻璃，她都抹掉了所有的“rw”标记、“x”标记、“u”标记，甚至是偶尔出现的加号和减号。她将它们全部替换为“-”。随着她的操作，文字闪烁着发着银色的光芒。


    当她完成时，太阳已经下山了；编辑整本书花了整天的大部分时间。塔格在花园里走了一会儿，直到她找到一块可以捡起的地面平石。她把书藏在下面，然后匆匆回到自己的宿舍。


    她的手指因为写字而抽挛了，几乎没得及锁上门就倒在床上了。


    # [8]


    塔格那天晚睡得很安稳。


    第一批发现权限消失的语言怪物是赫斯米尔（Hessimals）。它们总是那么挑剔、那么讲究，当它们意识到自己不受任何人指挥时，它们离开了语言房的栖息地、莱费大厅（Raiffe
    Hall）的鱼族箱，甚至是院长在公寓里制作的那个特殊温室球。它们聚集在摇摇欲坠的老旧带塔上，像一群愤怒的乌鸦一样，围攻每一个经过它们下方的术士。这些愤怒的乌鸦喉咙里含着部分编译的咒语碎片。这导致火焰以极快的速度从它们口喷而出。


    一个刚离开图书馆的铁链巫师被卷入了一场火焰龙风，被投到了喷泉里，而他的靴子落在法杖架上，点燃了茅草顶。


    ……塔格在睡梦中翻了个身……


    很快，术士们也加入了其中，试图用铅线套住语言怪物，或用咒语约束它们。然而，蒂尔德的语言怪物对咒语有免疫，很少有术士知道绕过它们边界的技巧。即使是战斗法师也感到困难，因为在决斗中对敌人的语言怪物魔法被认为是不光的。


    接着，第一个厨师发现雅夫林（Yavlings）不仅逃脱了圈养，还吃掉了整个厨房花园以及几个稻草人。整个家庭都被惊醒了，追着雅夫林赶它们离开谷仓，同时还要避开赫斯米尔，这些怪物正在捕捉一个皮匠并把他留在大厅顶端，皮匠在上面和石像鬼在一起呆了好几天，直到一位术士注意到并帮他下来。


    士兵们也许是最后发现不对劲的人。不过，他们很快就注意到一条蟒（Python）和两条蛇灵（Serpients）入侵了客房，吃掉了他们的许多腰带和靴扣。


    一群带着装满雅夫林的网的术士试图从语言房的阁楼上唤醒邦·马雷特。他咒骂着他们，回去继续睡，直到老福恩特坦（old Fourntan）醒来并踢掉了语言房的后墙，导致阁楼的一半塌了，邦·马雷特掉进了冰冷的雪贝围场圈（Snowbel
    pen）。


    梅尔加（Melga）还醒着，正庆祝她在比赛中的表现，她成功用星光绳索套住了一只克里（Chree）。她在蒂尔德的防御墙上绕了完整的一圈才让那动物停下来，即便如此，也只是为了让那只克里检查墙缝里的一个老海鸥巢。


    疾流泡沫（Rushingfoam）醒来发现，编译他论文的赫斯米尔在窗户上破了一个洞，偷走了他的图灵传记。


    ……而塔格继续睡着。


    # 代码构建者 ~ 97


    有人在敲她的门。塔格醒了，心惊失措。是士兵吗？他们找到她了吗？她知道自己不该回到宿舍的！


    “塔格，在不在？”是梅尔加。


    塔格吐出了憋了一整口的口气，开了门。


    “啊，好了，你没事，”梅尔加说。然后她看起来有些局促。


    “怎么了？”塔格问。


    “没脸，”梅尔加说。“我的意思是——是的，出了很多事。”


