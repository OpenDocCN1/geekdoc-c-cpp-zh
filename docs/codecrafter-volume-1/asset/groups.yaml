    [2]


    They arrived at noon the next day, leading their horses over the causeway into
    the grand courtyard. Tagg supposed she should feel relief after the long weeks
    on the road, but the memory of her father’s warning sent her to searching the
    shadows for threatening figures. Coupled with that, there was something about
    Tilde that just felt... off. There were no guards on the battlements, no flock
    of servants standing ready to take their horses, no laundry being done in the
    bubbling pool at the center of the yard.


    Instead, a woman and a girl older than Tagg got up from where they had been waiting
    beside the pool and started towards them.


    “We saw you coming on the outlook,” said the woman. “Well met, Shory Bearkiller."


    # Codecrafter ~ II


    “Mistress Voss, by my word you are lovely still,” said Shory. He laughed and bowed.
    “May I present the Lordsdaughter Tagglinde of Morthigern?”


    Tagg curseyed. Then she caught her first full look of Mistress Voss. The woman
    had three eyes! And not in the spectacles-way, there was a third, brown eye planted
    squarely in her forehead that blinked and looked her up and down. Tagg forced
    herself not to stare, imagining the swat her governess would have given her for
    being rude. “I-It is a pleasure to meet you, Mistress Voss,” she said.


    “You have Taggerion’s look about you, for certain. Let’s hope you have his brights,
    too,” said Mistress Voss. “In any circumstance, I am the head of household at
    Tilde. Should you need anything non-sorcerery, you need only come to me.”


    “Of course, Mistress,” said Tagg. The woman had to know that eye was there, didn’t
    she? She had to, thought Tagg. Perhaps it was some kind of deformity?


    Voss looked back at Shory, releasing Tagg from her peculiar gaze. “You may tell
    your master that Tagglinde will be well protected here.”


    “He’ll be glad to hear it,” said Shory.


    “And on that note: Tagglinde, this is Melga Hewenaven. She will be your mentor
    here at Tilde while you acquaint yourself to our ways. Melga?”


    The girl stepped forward. She was about four years older than Tagglinde, with
    curly red hair and a sour look on her face.


    “It’s a pleasure to meet you, Melga Hewenaven,” said Tagg, inclining her head
    as she had been taught.


    Melga jerked her head and muttered, “Pleasure.”


    “Melga, go get Tagglinde settled while I have a word with Shory. She will be needing
    a frock and staff before tomorrow’s lessons.


    “Yes, Mistress,” said Melga. “C’mon, Tagglindy.”


    Tagg hesitated. It was only when Shory motioned for her to go that she cautiously
    followed the older girl.


    Tagg had to trot to keep up with Melga. The girl had a long stride and tended
    to flail her staff as she walked, and in the absence of conversation, Tagg took
    to studying her surroundings for enemies. Melga took a path uphill from the courtyard
    and turned south towards a well-kept area that Tagg would learn was called the
    Wizard’s Plaza, distressingly full of nooks for a well-placed archer. Buildings
    of yellow brick lined the grassy lawn, which was crisscrossed with stone walkways
    and dotted with sycamore trees. Sorcerers dressed like Melga in burgundy coats
    with silver trim waved and called out to them as they passed, but Melga kept her
    head down and made for a small building nestled in the curve of the yellow sandstone
    wall. It was three stories tall, with narrow, slit-like windows. It looked sturdy.
    Tagg thought her father would approve.


    “This is Meerwood. The girls live here, boys over Greatwood,” said Melga, gesturing
    to a much larger house across the way. She dug around in her pocket and tossed
    Tagg a key. “For your cell."


    Tagg didn’t have a chance to ask Melga what she meant by that before they were
    off again, into Meerwood and down a flight of steps into a cavernous basement.
    Melga ra on a door with her staff and it opened, revealing a long, low room filled
    with boxes and racks of clothing. Tagg entered cautiously, keeping one hand on
    the wall.


    “Light(4),” said Melga, and four glowing orbs leapt from her staff to space themselves
    evenly across the ceiling.


    “Now you stand right there and keep still."


    Tagg stepped into the chalked square that Melga had indicated, her body tensing
    in case this was some kind of a trap. When nothing happened, she began to relax.


    Then, the boxes and racks of clothing moved, jumping and hopping over each other
    as if dancing. Tagg nearly fell over.


    “Yeah, it looks pretty,” said Melga. “Then y’find it’s just a buggy old bubblesort
    an’ the magic goes right out of it.


