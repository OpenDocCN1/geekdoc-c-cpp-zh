    # Codecrafter


    Erica Sandbothe


    ![](img/6c4ea05b3ab49e575f22db8cbab4b53c_0_0.png)


    # Codecrafter


    Erica Sandbothe


    Copyright © 2013 Erica Sandbothe


    Cover Art and Design by Samantha Collier


    All rights reserved.


    ISBN: 0989192806


    ISBN-13: 978-0989192804


    To my mother,


    who taught me to write.

    And to my father,


    who taught me mathematics.


    Digitized by the Internet Archive

    in 2022 with funding from

    Kahle/Austin Foundation


    https://archive.org/details/codecrafter0000sand


    # Acknowledgements


    I would like to thank everyone who had a hand in bringing this book to light.


    I would like to thank my mother and father, for starting me on this road, and
    Evan, who insisted that there was something special about Tilde all along.


    Some, however, learn the words.


    The riders were gaining. Tagg risked a quick glance behind her and swallowed,
    crouching low over her horse’s neck. The mare, a sedate, ladelike creature, heaved
    and panted, her short legs pounding the sandy soil.


    “Keep headed west,” shouted Shory. Tagg turned just in time to see her bodyguard
    slow his horse.


    “No!” she cried. “Come with me!”


    The wind whipped the scarf around her head, but she could still see the mad grin
    on Shory’s face as he drew his sword. Part of her wanted to stop, to turn and
    stay with the man who had been her protector on the long road from Morthigern.
    Her father would not run away, not when a friend was in danger. But her father
    had told her to obey Shory. She whispered an apology and spurred her mare on.


    When I am a sorcerer I will not run. When I am a sorcerer I will not be afraid.
    A quick look back showed that Shory had engaged the riders. One had fallen, another
    was locked in combat with her protector. How many there were in total, she did
    not know. Shory called them bandits, but bandits would not pursue a target so
    doggedly. Especially not after Shory had killed six of them already.


    Tagg heard hoofbeats out of rhythm with her own. A set of riders had split away
    from Shory and were galloping straight toward her.


    If only her father had taught her real sorcery! Then she would have her own staff,
    and a spell would send the riders flying, their horses'' legs tangled in endless
    knots, their breath swept away from them, their bodies weak and powerless against
    the might of her codecraft.


    The land sloped downward, and Tagg glimpsed the lights of Tilde ahead. Her mare
    skittered on the sandy gravel, hoofs tangling in the long seagrass that grew on
    the clifftop flats. Tagg reined her just in time to avoid sliding down the dune,
    but the mare''s heavy breaths told Tagg that they could gallop no more. She urged
    the horse into a trot and drew her knife. Her heart pounded in her chest. She
    would have to be quick.


    Hoofbeats. Tagg glanced behind her and saw a rider come into view at the top of
    the dune. He reigned better than Tagg, and his horse danced to a stop. The rider''s
    face was weathered and sharp, and when he saw her foam-flecked horse, he smiled.
    He drew his sword.


    After they had been attacked at Plainfoot, Shory had taught her where to cut a
    man to cripple him. She slashed the rider who came at her, eliciting a laugh as
    he ducked out of her range. She hadn''t even pierced his leathers.


    “Put that down, dearie. She wants you whole, she does, but if you cross me I swear
    you''ll regret it.”


    It was the last thing he said. Shory was there, his face bloodied and full of
    anger. He raised his sword and the enemy toppled from his horse. Tagg shuddered.
    Shory wiped his sword on the dead man’s tunic, then gripped her by the forearms
    and forced her to look at him. Shory’s face was blood-spattered, but his eyes
    were sane. “It''s over,” he said.


    Tagg tried to draw herself up in the saddle. It was funny, her governess had never
    taught her how to kill a man well. Perhaps there was a formal response, and Tagg
    had simply not paying attention. Soon the world grew fuzzy, and her chest began
    to hurt.


    It was full dark when Shory woke her. He passed her bit of cheese on bread, then
    sat down to stir the fire. It took a while for Tagg to come back, but she shivered
    when she cleaned away the blood. “The camp’s secure, Lordsdaughter,” said Shory,
    looking out over the sandy flats and low dunes. Tagg followed her gaze, then huddled
    in her cloak. “They’re not bandits, are they, Shory?”


    Shory looked at her with surprise. “Why would you think that, Lordsdaughter? They’ve
    followed us from Plainfoot. Bandits stick to an area and pick off travelers as
    they go. They wouldn’t come all this way just for the two of us and pack.”


    Shory crooked his mouth into a grin. “You''re sharp enough, Lordsdaughter. Sharp
    enough to give them sorcerer-scholars a run. I was to give you this before you
    left Tilde, but now seems the better time. You still have your private key?”


    Tagg fished a steel chain from around her neck. The little key that dangled at
    the end was spidery with grooved teeth. Her father had given it to her before
    she left Morthigern. She warmed it in her hands as Shory pulled a small, flat
    box out of his satchel. The engraving on the box matched the key, its fretwork
    out from a small keyhole. Tagg recognized it immediately as a courier box used
    by sorcerers for particularly delicate communication. Opening the case aside would
    produce a garbled mess, but with the right key in the lock, the words would be
    clear. Shory passed her the box, then turned away to give her privacy. Tagg inserted
    the key and opened the case, breathing in a scent that reminded her of her father’s
    room. There was a small cone inside the box, attached with a length of string.
    Tagg put it to her ear immediately.


    “Tagg of Morthigern, my daughter of Morthigern. Dated Seventeen Spring of the
    Limping Fox,” said her father’s voice from inside the cone. “Tagg, forgive me
    for telling telling this before your departure, but it was vital that you have
    no knowledge of these things should something befall you on the road. I will be
    brief. By the time you hear this, I will have declared war on our so-called queen,
    Florida, for the rulership of Sharell. It is my hope that the war will be over
    quickly, and my claim as cousin of our late King Din will be supported over that
    of his commoner widow queen. Even such, it is possible that Florida will seek
    to strike at me through you. Daughter, you must be careful, even at Tilde. Choose
    your company wisely and be aware at all times. I say this only as a caution, for
    Tilde has never become involved with any faction of the Sharell wars, and is unlikely
    to do so now. You should be more safe among my chieftains in the Narnava. Learn
    your skills well and the next time we meet, may it be as king and daughter. Grace
    guard you, daughter... and destroy this case.”


    Tagg blinked away tears as her father’s voice faded. It had been three weeks since
    she had left her home at Morthigern, and the sound of his voice made her homesick
    all over again. Tagg set her mouth, wiping her eyes with the back of her hand.
    She put the cone into the case, removed her private key, then pitched the whole
    thing into the fire.


    “My lord didn’t mean you to worry, Lordsdaughter,” said Shory. “Florida’s not
    likely to try anything at Tilde.”


    Tagg fought to keep her voice from breaking as she tucked the key back into her
    blouse. “Those were her soldiers following us, weren’t they?”


    Shory drew his sword onto his lap. “And if one old Morthigern berserker can drop
    ten ‘em at a go, what are the odds of your father’s scuffle lasting longer than
    this summer?”


    Tagg smiled, pushing down her feelings of unease. “Of course, Shory. Papa is the
    greatest codecrafter in the world, after all.”


    “And you’ll soon match him, Lordsdaughter,” said Shory.


    Tagg looked to the east where, far away, her father waged war on Florida. She
    breathed a prayer for his safety, then looked west to Tilde. Lights from the castle
    twinkled in the darkness. When I am a sorcerer, I will be able to protect the
    people I love.

