    “沃斯夫人，看我的老天，你还是如此美丽，”肖里说道。他笑着鞠了个躬，“我可以向您介绍莫西格恩（Morthigern）的领主女儿塔格林德（Tagglinde）吗？”


    塔格行了礼。接着，她第一次完整地审视了沃斯夫人。那个女人有三只眼睛！不是那种眼镜式的，而是第三只棕色的眼睛正正长在她的额头上，眨眨着眼，从上到下地打量着她。塔格强迫自己不要盯着看，想象着如果因为无礼，她的女家教会扇她一个耳光。“我——我很高兴见到您，沃斯夫人，”她说。


    “你确实有塔格里翁（Taggerion）的相貌。希望你也继承了他的那份灵敏（brights），”沃斯夫人说，“无论在任何情况下，我都是蒂尔德的家主。如果你需要任何非魔法物品，只需来我这里。”


    “当然的，夫人，”塔格说。那个女人一定知道那只眼睛在那里，对吧？她一定知道，塔格心想。也许那是某种畸形？


    沃斯回看向肖里，让塔格从她奇异的目光中释放出来。“你可以告诉你的主人，塔格林德在这里会得到很好的保护。”


    “他听了会高兴的，”肖里说。


    “既然如此：塔格林德，这是梅尔加·赫文纳文（Melga Hewenaven）。在你熟悉我们这里的规矩期间，她将是你这里的导师。梅尔加？”


    女孩走上前。她比塔格林德大大约四岁，留着红色的卷发，神情严厉。


    “很高兴见到你，梅尔加·赫文纳文，”塔格说，像教过的那样歪了点头。


    梅尔加猛地一了一下，咕囔道：“荣幸。”


    “梅尔加，去帮塔格林德安顿好，我和肖里谈谈。在明天的课程之前，她需要一件长袍和法杖。”


    “是的，夫人，”梅尔加说，“走吧，塔格林迪。”


