    “…thus commands the queen.”


    She stood up, her vision clouding, but it didn''t matter. She tripped over Bashko,
    hurried along the main aisle. She had to get out of the Pit, away from the soldiers.
    Before, she might have believed that they would not dare arrest her, capture her,
    take her. Not in Tilde, not surrounded by sorcerers. She did not believe that
    now.


    “Taggllinde? Where are you going?” Saoric was saying. But she was already gone.


    She dared not go back to Meerwood. The infinite loop box had been left there for
    her, and who was to say that soldiers were not already waiting? She drew her scarf
