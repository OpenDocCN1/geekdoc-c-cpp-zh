    [5]


    Tagg spent the next two hours doing what the Tildens called “earning their keep”.
    There were a good many things that needed to be done around a castle like Tilde,
    and the non-sorcerers who lived there could not be expected to do all of them.
    So, the sorcerers took time off from their studies to help. Codefters of all makes
    and ranks cast spells to clean the rooms, wash the walls, tend the gardens and
    mind the bees. Silver-chains sorted books in the library or heated fires for the
    blacksmiths and the smithmages, who set aside time each week to mend any Tilden
    items that were in need of repair. The idea was to make amends to Tilde for putting
    up with the sorcerers. Tagg thought that it seemed fair enough. Her father had
    never approved of laziness, either.'
