    And there were others, not sorcerers, not nobles, who stood out from the crowd.
    They wore brown leather in intricate pleats around their chest and shoulders,
    and their hair was short and roughly cut. The regiment walked by Tagg without
    a glance, and when they passed down to the stage, Tagg saw the green sun blazoned
    on the back of their cloaks. Soldiers of Floria.


    Tagg wanted to bolt, but her legs would not move. Soldiers? At Tilde? But Tilde
    had no allegiance, or so everyone had told her. Had Tilde allied with Floria?
    Were there other soldiers about, waiting to capture her? Kill her? Did her father
    know? She felt sick.


    For ten agonizing minutes Tagg sat on the aisle''s end. Saoric said something
    about Sergeant Tufton, something that didn''t matter when there were soldiers
    about. He took her hand in his own, but Tagg could not draw away, would not dare
    move when any such movement might bring the soldiers right to her. Saoric was
    saying something, something reassuring? It was too much, too much to bear, not
    after the infinite loop, not after all that had happened—


    Movement at the stage. A sorcerer walked out and thumped his staff. Speaking.
    No, stopping. Outrage. People standing up, leaning forward. Necks craning, then
    silence.


    The regiment leader, tall and thin, sauntered to the center of the dueling arena.
    His second, overly pale like Rushingfoam, came to stand beside him. Swords, had
    they swords? Tagg swallowed, her throat gravel.


    “In the name of her majesty the Queen Florida Sharellingyle the First...”


    Tagg''s heart lurched. All of it was forgotten: the codes, the math, Melga and
    Rushingfoam, Saoric sitting beside her...


    > “...the queen decrees that the thirty battlecasters who prove their courage
    and skill in this contest, given on the date of...”


    Thirty battlecasters. Half of the battlecasters at Tilde, so said Melga. Including
    Melga. They wanted Melga, her sponsor...


    > “...will take their place at the hand of the queen’s army against the usurper
    lord, the traitor, Morthigern...”


    Her father. Tagg could see him, as clear as if he were there with her, his long,
    handsome features, his dark hair streaked with white, his thin, strong fingers
    to smooth her hair and tell her that all would be well.


    “…thus commands the queen.”


    She stood up, her vision clouding, but it didn''t matter. She tripped over Bashko,
    hurried along the main aisle. She had to get out of the Pit, away from the soldiers.
    Before, she might have believed that they would not dare arrest her, capture her,
    take her. Not in Tilde, not surrounded by sorcerers. She did not believe that
    now.


    “Taggllinde? Where are you going?” Saoric was saying. But she was already gone.


    She dared not go back to Meerwood. The infinite loop box had been left there for
    her, and who was to say that soldiers were not already waiting? She drew her scarf
    further over her head until it shadowed her face. She started towards Raiffe Hall,
    vaguely thinking of going to Rushingfoam and asking his advice. But when she saw
    the soldiers congregating at the Wizard’s Plaza, lounging and whetting their knives
    by the fountain, her resolve failed her and she darted into a heavy stand of bushes.
    They were the same bushes Eddie had fallen into just that morning, just an hour
    ago. Had it been only an hour ago?


    The branches snagged at her frock, but she followed the wall around the Plaza
    until she stood before the great gates. A Carter was there, unloading barrels
    and arguing with the porter. Yet even here were the signs of soldiers; their horses
