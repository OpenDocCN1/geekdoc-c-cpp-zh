    \ to her own place, was cleaning up a similar pile. Tagg glanced at him and looked\
    \ away quickly—she did not want him spreading stories about her traits as a lordsdaughter.\
    \ Jay, meanwhile, had gotten his code to compile and was printing a whole batch\
    \ of rude words in the air before him. When he caught Tagg watching him, he printed\
    \ “Hi, Tagglindy” and winked. Tagg ignored him.\n\nOn her next try, Tagg remembered\
