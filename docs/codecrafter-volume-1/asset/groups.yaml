    # Codecrafter ~ 51


    然而，塔格（Tagg）只是个菜鸟。沃斯（Voss）夫人把她送到语言房去照顾语言怪兽。


    语言房的负责人名叫博恩·马雷特（Bon Marett）。他不是法师，但法师们都畏惧他。当他看到塔格时，吐了一口唾沫并咒骂道，塔格想，在被他踢出语言房的编译器侧并投入雅瓦（Yava）圈养场之前，她可能得用法杖敲他一下。


    塔格很快发现，并不是所有的语言怪兽都像图顿军士（Sergeant Tufton）的Ukan那样善良冷静。塔格了解到，雅瓦语言怪兽至少外观上很像兔子。它们有长长的、垂耳朵和湿润的鼻子，像一袋土豆一样重。塔格的工作是刷刷毛并给它们喂颗粒。这并不是一项困难的任务，除了这些雅瓦灵虽然没有牙齿，但下颚像兽夹一样僵硬，它们宁愿咬掉她的手也不愿吞下一粒饲料，哪怕那粒饲料能保证提升它们的优化性能并让皮毛变得光亮。。


    当塔格离开马厩时已经是五点了，她快饿坏了。她必须在大厅向梅尔加（Melga）报到，但她不能就这样过去。她得去一趟梅尔伍德（Meerwood）买件新外套——其中一只雅瓦灵把她的衣服弄脏了。


    门外有一个惊喜——一个看起来不像邮差箱的小装饰盒。它是刻工精美的檀木做的，边缘有三个锁。但周围看不见钥匙。塔格收拾了一下自己，把箱子滑进兜里。尽管很反常，但她太饿了，没精力调查。她打算边吃边看。


    五点吃午饭对塔格来说并不寻常，但对于法师们来说不是，因为他们天生就起得晚。现在吃饭的法师比早上还要多，其中许多人看起来刚睡醒。塔格感觉自己像几十年没吃东西一样，往盘子里装满了酸奶饼干和火肉炖。


    塔格一手平衡盘子，另一手握着法杖，寻找梅尔加。越快结束这一切越好。梅尔加在大厅后面，正如她所说的那样，坐在一张小长桌旁，周围挤满了金链和铁链法师。


    “梅-梅尔加？”塔格走向她的赞助人问道。


    “让开点，新手，位子满了，”一个坐在梅尔加对面的男法师说。


    塔格感到脸脸红了，她握着法杖的手也紧了紧。


    梅尔加转过身，在看到塔格后点了点头。“看来你路找得还不错，”她说道。


    “是的，梅尔加，”塔格说。


    “这位是谁，梅尔？”那个刚才让塔格离开的法师问道。


    梅尔加对着杯子咕咕了一句什么。


    “什么？”


    “我的赞助人，”梅尔加咬着牙说道。这种反应充其量算一般。坐在梅尔加旁边的法师是一个肤色深、绿眼睛的女孩，她说：“你不早说？挪挪，让个位……”而其他几个人笑了起来。其中一人说：“梅尔加，梅尔加，梅尔加，你还是不长教训，对吧？”另一边一个高个、苍白的施法者（spellcoder）摇了摇头说：“你这次又对沃斯做了什么？”


    塔格太急于离开梅尔加了，突然被推到了紧挨着她的一个座位上。她收起手肘，开始稳稳地吃了起来，避开梅尔加朋友们的目光。尽管她成功掌握了奔流（Rushingfoam）的课程让她稍微平复了一些，但对她来说依然是艰难的一天。


    笑声开始平息，接着那个脸色苍白的施法者说：“说真的，梅尔加，你一定做了些什么坏事才让沃斯直接把你踢出来。到底是怎么了？”


    梅尔加低头对着盘子低声咆吼道。“我……可能在她的门外留了一个分身术。在大约……眼睛的高度。”


    桌上爆发出一阵笑声。“你？你是那个给她额外一只眼睛的人？”


    “梅尔加，梅尔加，为什么？”


    梅尔加看起来明显不舒服，在长凳上挪了挪。“我……可能也可能在梅尔伍德休息室里没有沙盒的情况下练习……”然后她直起腰，用拇指指了指塔格。“但完全不是那样。沃斯说这个新手需要重度保护，还需要一个全职的战斗法师。”


    “那你保护得可真好，让她自己在提尔德（Tilde）上到处乱，”塔格右侧的女法师说。塔格脸红了。她可以、也会照顾好自己的！


    “见鬼，我不会让她死的，”梅尔加不情愿地看了塔格一眼。“最好别，否则沃斯真的会把你的脑袋钉在标矛上，”那个苍白的施法者说。


