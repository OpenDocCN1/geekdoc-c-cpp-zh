    \ convince herself that everything would be all right. Tilde did not take part\
    \ in wars, everyone knew. Too many sorcerers came from feuding families that the\
    \ alternative would have been an empty school.\n\nPerhaps it had even been some\
    \ kind of mistake. Perhaps someone had dropped the box by her door by accident.\
    \ There had been no key, after all, and Tagg would not have been able to open\
    \ the box had Melga not broken the lock. Tagg tried to maintain this view as he\
    \ sat listening to Professor Ailonet talking about tiny magical particles that\
    \ composed the world and could be harnessed by compiled source code. Yet for all\
    \ that she thought she might come to enjoy Ailonet's lectures, she couldn't forget\
    \ the feeling of terror that had come from her time in the infinite loop.\n\n\
    She entered her late coding practicum feeling sleepy, worn, and somewhat guilty\
    \ that Professor Ailonet might suddenly pop out from behind a pillar and accuse\
    \ her of not paying attention in his class (he didn't). Therefore, Tagg, keeping\
    \ to the main walkways around the Plaza, entered Vyndium Hall with twenty other\
    \ sorcerers. Among them were the Jays.\n\nOther mages were already at work in\
    \ the big gymnasium where they were to practice their spellwork. Tagg was shepherded\
    \ to a little space marked off with eight stones in an octagon. She had a desk\
    \ and parchment and charcoal, as well as access to a Chree lang-monster stationed\
    \ between her workspace and the other Jays'. Tagg saw a young sorcerer working\
    \ with a Yavaling to juggle wine goblets in midair, and an older lady wizard using\
    \ a thin, delicate lang-monster to divert a stream of water into three separate\
    \ ones of ice, steam, and rain.\n\nFaced with the blank paper to begin her Chree\
    \ spells, Tagg forced herself to concentrate. She put the infinite loop out of\
    \ her mind and focused on recalling exactly what Tufton had said about starting\
    \ her code.\n\nOkay, thought Tagg. Let's try a main method. Like this...\n\n```\n\
