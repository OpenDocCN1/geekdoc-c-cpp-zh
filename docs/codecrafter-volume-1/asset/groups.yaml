  mdcn: "\n当她的生命处于危险时，她打了个喷嚏。“比……比赛是什么？”\n\n“大锦赛，”梅尔加说道，“战斗施法锦标赛，就像你常做的那样。两天后就开始了！我今年必须得名，这是在我父亲那场战争结束之前得到我的铁链的唯一机会，否则我就没用了。”\n\
    \n塔格（Tagg）吸了吸鼻子。“我信你——你会没问题的。”\n\n梅尔加摇了摇头。她站起来，在塔格面前来回走动。她没有看她，说道：“我不能一直看着你，你知道的。但是……但是当我我去练习时，你跟我一起，方便我盯着你。待在主路上，不要到处乱逛。如果我不在，不要触碰、打开、舔舐、移动或戳任何东西。我会给你施加一个保护咒，但要明白这不是最好的，因为那是为我定制的，而不是为你——你得自己防范以获得最好的保护。你明白了吗？”\n\
    \n“明白了，梅尔加，”塔格说。\n\n“很好，”梅尔加说。她瞥了一眼南方高处的钟楼。“我要去听课了。你期间要注意安全。”\n\n塔格深吸了一气。“我会试试的。”\n\
    \n上“咒法理论”课时，塔格开始说服自己一切都会好的。每个人都知道，提尔德（Tilde）不参与战争。有太多的巫师来自敌对家族，如果不是这样，学校将会空空如一人。\n\
    \n也许这根本就是某种错误。也许有人不小心把盒子掉在了她的门口。毕竟那里没有钥匙，如果不是梅尔加破了锁，塔格根本打不开那个盒子。当塔格坐着听艾洛内特教授（Professor\
    \ Ailonet）讲述构成世界的微小魔法粒子，以及如何通过编译后的源代码来操控它们时，她努力维持这种观点。然而，尽管她认为自己可能会喜欢艾洛内特的课，但她无法忘记在“无限循环”中感受到的那种恐惧。\n\
    \n她进入晚上的编程实操课时，感到困倦、疲惫，并有些许内疚，担心艾洛内特教授可能会突然从柱子后面跳出来，指责她在课上没听讲（但他并没有）。因此，塔格走着广场周围的主路，和另外二十名巫师一起进入了温迪姆大厅（Vyndium\
    \ Hall）。其中就有杰（Jay）家族。\n\n其他法师已经在大体育馆里开始工作了，那里是他们练习施法的地方。塔格被引导到了一个由八块石头围成八边形的小空间。她有一张书桌、羊皮纸和木炭，还可以使用一只驻守在她的工作区域和其他“杰”族区域之间的克里（Chree）语言怪兽（lang-monster）。塔格看到一个年轻巫师正和一只雅瓦灵（Yavaling）在半空中杂耍酒杯，而一位年长的女巫师正用一只纤细、脆弱的语言怪兽将一股水流引成三股，分别变成冰、蒸汽和雨水。\n\
    \n面对要开始施展克里咒的白纸，塔格强迫自己集中注意力。她把“无限循环”抛出脑后，专注于回忆图夫顿（Tufton）关于如何开始代码的说明。\n\n*好吧，*塔格想，*试试主方法。像这样……*\n\
    \n```\nvoid main()\n{\n    printf(\"Hello, world!\");\n}\n```\n\n她盯着纸看了很久。看起来是对的。她引那只语言怪兽来到她的书桌，然后放下纸让它看。那只克里灵生物像乌坎（Ukan）之前那样嗅了嗅羊皮纸，然后吸入了纸上的文字。\n\
    \n两秒钟，那只语言怪兽在她的脚边吐出了一堆热腾腾的脏物。看起来很心力交瘁的导师给了她铲子和一个水桶，同时看了一眼她的代码。“如果你不告诉它需要那个库，它就不知道怎么打印。”\n\
    \n塔格缩了缩脖。她怎么能忘记包含他们当天使用的代码库引用呢？如果不如何理解 `print`，那只语言怪兽只会……额，只会做她现在正铲进桶里的那些东西。杰在离她地方对角的八边形区域里清理着类似的堆物。塔格看了他一眼，然后迅速移开视线——她不想让他散布她作为领主之女的传闻。与此同时，杰已经让他的代码编译成功，并在面前的空中打印出一整批粗俗的单词。当他发现塔格在看他时，他打印出“嗨，塔格”并眨了眨眼。塔格忽略了他。\n\
    \n在下一次尝试中，塔格想起了 `include` 语句，在代码开头加上了 `#include <stdio.h>`。这次，那只克里语言怪兽没有抱怨。塔格看着它的肚子咕咕作响，希望一切顺利，这时那只大动物朝着她的方向吹出了银色的泡泡。塔格握好法杖，匆忙接住了编译好的咒语。\n\
    \n整整天，塔格都带着她的法杖，觉得手里拿着任何一根旧木棍没区别。它在穿越提尔德一些岩石较多的地段时有用，但仅此而已。法杖曾是空的。\n\n但现在不是了。\n\
    \n塔格能感觉到那道咒语。塔格感受到了咒语，“Hello, world!”这句话在空气中闪烁。\n"
