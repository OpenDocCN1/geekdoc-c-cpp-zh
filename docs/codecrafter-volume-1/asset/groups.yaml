    Yet would escape help her any more? Tagg thought of Rushingfoam and his anger
    at learning what she had done to the lang-monsters. Would they even want her back
    at Tilde? Had they in fact given her to Flor’s soldiers? She couldn’t remember
    anything beyond running into the soldier, the blow he had given her had knocked
    her out cold. It was very possible that the Tildens had let the soldiers take
    her. And why should they not? She had made a choice, and she had ultimately chosen
    her father and Morthigern over the sorcerers and Tilde. If the soldiers had broken
    Tilde’s neutrality, then so had she. Did she even have a place back at Tilde?


    She missed her father. He never would have let this happen to her. He had sent
    her to Tilde to be safe... and Floria had broken the rules. Yet in sabotaging
    the lang-monsters she had chosen to be a Morthigern above a Tilden; she had broken
    the rules, too.


    A thousand curses on the rules! thought Tagg. She had to think, think logically.
    She was trapped. Bound with ropes and the cloth, wound so tight during the day,
    and at night penned by partitions. She wanted a sword, a knife, her staff. Anything
    that would help her fight against her captors. But what good would fighting be?
    Tagg had counted at least thirty men in the company, and the idea that she could
    fight off all of them was laughable. Her better option would be to run.


    She would have to run before they set up the partitions. She had to force herself
    to move in the face of the coldness and lethargy that they created. She would
    do it. Break free, then run west to the sorcerers. If they would have her, Tagg
