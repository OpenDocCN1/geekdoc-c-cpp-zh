    The Pit, as it was called, was a huge circular arena with

    row after row of steps descending into the earth, ringed with

    marble benches and already filling with burgundy-clad

    wizards. At the center of the arena a flat dirt patch was

    being carefully inspected by a sorcerer and a snuffling Chree

    lang-monster. Tagg went with Saoric to the first empty row

    near the stage. She had never seen this many codecrafters

    together at once, not even at the High Hall or the Wizard’s

    Plaza.


    There were non-sorcerers around as well. Tagg saw

    Mistress Voss descend to the levels nearest the stage on the

    am of a tall, portly sorcerer. There were nobles dressed in

    black and gray velvets with silk scarves and gloves that made

    Tagg long to be back at Morgithigern with her own familiar

    gowns. Beautiful birds of green and red perched on the

    ladies’ shoulders, their shining plumage glistening in the

    morning sun. There were men in cambric tunics

