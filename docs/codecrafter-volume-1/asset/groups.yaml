    # Codecrafter ~ 51


    Tagg, however, was only a brass-chain. Mistress Voss sent her to the langhouse
    to tend the lang-monsters.


    The man in charge of the langhouse was named Bon Marett. He was not a wizard,
    but the wizards were all afraid of him. When he saw Tagg, he spat and cursed and
    Tagg thought she might have to hit him with her staff before he punted her to
    the compiler side of the langhouse and into the Yava pens.


    Tagg quickly found out that not all lang-monsters were kind and calm as Sergeant
    Tufton''s Ukan. Yava lang-monsters, Tagg learned, were much like rabbits, at least
    in appearance. They had long, floppy ears and wet noses and were as heavy as a
    sack of potatoes. Tagg''s job was to brush them and give them their pellets. This
    was not a difficult task except for the fact that the Yavalings, while toothless,
    had jaws as stiff as beartraps and would sooner gum her hand off than swallow
    a pellet, even if it was guaranteed to improve their optimization and give them
    glossy coats.


    By the time Tagg left the stables it was five o''clock and she was starving. She
    had to report to Melga at the High Hall, but she could not go as she was. She
    would have to make a trip to Meerwood to get a new frock coat—one of the Yavalings
    had slobbered all over her.


    There was a surprise waiting outside her door—a small ornamental box not unlike
    a courier case. It was intricately carved sandalwood, with three locks around
    the edge. But there was no key in sight. Tagg cleaned herself up and slipped the
    case into her pocket. As unusual as it was, she was too hungry to investigate.
    She would look it over while she ate.


    Having lunch at five o''clock was out of the ordinary for Tagg, but not for the
    sorcerers, who were later risers by nature. There were more wizards eating now
    than there had been that morning, many of whom looked like they had just woken
    up. Tagg, feeling as if she hadn''t eaten in decades, loaded up her plate with
    buttermilk biscuits and ham stew.


    Balancing the plate in one hand and her staff in the other, Tagg sought out Melga.
    The sooner she got this over with, the better. Melga was at the back of the hall
    where she had said she would be, at a small rectangular table packed with gold-
    and iron-chain mages.


    “M-Melga?” asked Tagg, approaching her sponsor.


    “Scoot, newb, table’s full,” said a male wizard sitting across from Melga.


    Tagg felt her cheeks going red, and her grip on her staff tightened.


    Melga turned around, then nodded when she saw Tagg. “See you found your way well
    enough,” she said.


    “Yes, Melga,” said Tagg.


    “Who is this, Mel?” asked the sorcerer who had told Tagg to leave.


    Melga muttered something into her cup.


    “What?”


    “My sponsored,” said Melga gritting her teeth. It was a mixed reaction at best.
    The sorcerer sitting next to Melga, a dark-complected girl with green eyes, said,
    “Why didn’t you say? Move over, make room...” while a few of the others laughed.
    One said, “Melga, Melga, Melga, you do’nae learn, do you?” A tall, pale spellcoder
    on the other side shook his head, saying, “What did you do to Voss this time?”


    Tagg, all too eager to get away from Melga, was suddenly hustled into a seat right
    next to her. She tucked in her elbows and began to eat steadily, averting her
    eyes from Melga’s friends. Though her success in grasping Rushingfoam’s lesson
    had soothed her slightly, she was still having a trying day.


    The laughter began to die down, then the pale spellcoder said, "Seriously, Melga,
    you must have done something bad to get Voss to kick you right before the contests.
    What was it?"


    Melga growled, hunching over her plate. "I... may or may''ve been the one who
    left a duplication spell outside her door. At about... eye level."


    The table showed with laughter. "You? You were the one who gave her the extra
    eye?"


    “Melga, Melga, why?”


    Melga looked distinctly uncomfortable, and shifted on her bench. "I... may or
    may not''ve been practicing without a sandbox in the Meerwood lounge..." Then
    she straightened and jerked her thumb at Tagg. "It ain''t totally that, though.
    Voss says the little newb needs heavy protection an'' a full-fledged battlecaster."


    “Fine job you''re doing protecting her, then, letting her wander about Tilde on
    her own," said the female sorcerer on Tagg''s right. Tagg flushed. She could and
    she would take care of herself!


    “Garn, I inn''t gonna let her die,” said Melga, glancing at Tagg grudgingly.


    “Better not, or Voss''ll really have your head on a pike,” said the pale spellcoder.


    Tagg busied herself with her meal while the older sorcerers went on to talk about
    other topics. The food was good, and she was hungry. Every so often she caught
    mentions of lang-monsters and induction. Melga was studiously ignoring her, and
    Tagg was happy to let her.

