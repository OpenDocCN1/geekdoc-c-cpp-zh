    # Codecrafter ~ 63


    watched his stomach gurgle, hoping that all would work out, when the big animal
    blew a silvery bubble in her direction. Tagg held her staff at the ready, and
    hurriedly caught the compiled spell.


    For the whole day, Tagg had carried around her staff, feeling that she may as
    well holding any old stick of wood. It was useful for navigating some of the rockier
    patches of Tilde, but that had been it. The staff had been empty.


    It was not empty now.


    Tagg could feel the spell, feel it waiting like a little flag in the back of her
    mind whenever she touched the wood. `main();` she whispered.


    The words, “Hello, world!" glowed in the air before her.


    ***


    Tagg left the practicum tired but in high spirits. She had managed to change her
    code to print whatever she said when she cast the spell. It was a beautiful feeling
    to say something then see the words printed in the air before her, and she felt,
    for the first time, a bit like a real sorcerer.'
