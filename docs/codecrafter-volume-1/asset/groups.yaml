    Above all all, she will face what it means be a Codecfter.


    For the words that Tagg is learning aren are just magical. They are computer science.


    Codecfter is set in a world where spe are software, magic is programmed, and o
    girl must use all of her skills to outwit enemy bent on her destruction.


