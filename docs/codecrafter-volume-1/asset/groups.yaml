    110 ~ Erica Sandbothe


    没有任何用处。


    然而，逃跑还能多帮到她吗？塔格（Tagg）想到了拉什泡沫（Rushingfoam）以及他在得知她对语言兽所做的那些事后的愤怒。他们还想要她回到蒂尔德（Tilde）吗？他们是否实际上把她交给了弗洛（Flor）的士兵？除了遇到那个士兵之后，她什么也想不起来，那一击让她彻底昏迷了过去。蒂尔德的人很有可能让士兵带走了她。他们又为什么不能呢？她做出了选择，而她最终选择了她的父亲和莫西格恩（Morthigern），而不是巫师和蒂尔德。如果士兵破坏了蒂尔德的中立，那么她也一样。她回到蒂尔德还有自己的位置吗？


    她想念她的父亲。他绝不会这种这种发生在她身上。他送她去蒂尔德是为了让她安全……而弗洛利亚（Floria）破坏了规则。然而在破坏语言兽时，她选择了做一个莫西格恩而非蒂尔德人；她也破坏了规则。


    这些规则该死！塔格想。她必须思考，逻辑性地思考。她被困住了。被绳子和布条缚着，白天被勒得那么紧，晚上又被隔板围着。她想要一把剑，一把刀，或者她的法杖。任何能帮到她反抗捕禁者的东西。但战斗有什么用呢？塔格数过那个部队里至少有三十个人，认为自己能打败所有人的想法简直是笑话。她更好的选择是逃跑。


    她必须在他们搭好隔板之前逃跑。她必须强迫自己在面对他们带来的寒冷和疲惫时动起来。她会做到的。挣脱，然后向西跑向巫师。如果他们愿意留下她，塔格离队长和他的士兵走了三步，就被自己僵硬而沉重的四肢绊倒了。另一个士兵轻易地抓住了她，她再次被缚在圈子里。她的大脑变得麻木，她努力思考，就像他们在蒂尔德教她做的那样，去面对问题……她睡着了。


    在马车这个监狱里，塔格躺在地上，裹着地席看着云朵。在她周围，她听到士兵们的马匹在她的马车旁骑行时发出的叮当撞击声。塔格已经闻不到海味了，空气让她感到陌生。她再次被紧紧地系在车里，愤怒和愧疚让她感到痛苦。思考！这里一定有出去的办法！要是她能解开绳子……但士兵们在马上，她跑不过他们。如果能在他们停下休息的晚上逃就好了……但隔板太坚固了，她昨天已经学到了。如果有人能找到她就好了……但隔板让她无法被定位？隔板只在晚上有效。也许队长那里有一套。可怕的念头再次浮上脑海。蒂尔德人为什么要来这里呢？毕竟，她毁了他们的语言兽。她孤身一人。她感到泪水刺痛了眼睛，但这次的泪水是因为


    113 ~ Erica Sandbothe


    愤怒和挫败。如果她能和他们战斗……但这简直是笑话，不是吗？他们拿走了她的法杖，但如果她有法杖，又能做什么？她只懂得最基础的魔法。她不像梅尔加（Melga）那样的战斗法师。思考！我打不过。无用感试图将她淹没，但愤怒再次袭来。她并不无用。她在这里能做点什么吗？但士兵们没有语言兽，他们不是没从蒂尔德拿到吗？也许队长在某处有他自己的私用箱，但她能拿到它吗？考虑到她昨天已经走了多远。这些该死的隔板！隔板……她能对它们做点什么吗？据塔格所知，它们没有破坏装置。只有他们那个小盒子，带有雕刻和锡制手柄，是一个配套的整体。

