    “Let’s talk about cause and effect,” said Rushingfoam.


    “All right,” said Tagg.


    Rushingfoam pulled a case out of his pocket and set it on the ground between them.
    He opened it and motioned to the rows of tiles inside. “Do you know what these
    are?” he said.


    “They’re dominoes,” said Tagg. A lump appeared in her throat as she remembered
    sitting up late playing games with her father. He had always let her win.


    “Correct,” said Rushingfoam. “And if you know these are dominoes, then surely
    at some point you have done this.”


    He swept a clear area on the ground between them and removed three dominoes. Standing
    them upright, he placed them carefully so that the three pieces were less than
    an inch apart. They looked like a line of little soldiers.


    “I am going to teach you about induction,” said Rushingfoam. “Now, this may sound
    difficult, but it is actually quite simple. This is induction.” He tapped the
    first domino lightly with his finger.


    It toppled over, knocking into the second domino, which in turn knocked down the
    third.


    Tagg blinked, and waited for something magical to happen. When it didn’t, she
    looked at Rushingfoam with confusion. “Induction is knocking things over?”


    Rushingfoam smiled. “In a manner of speaking. It is a way of proving that something
    will happen in the future.”


    Tagg frowned. “What does that have to do with dominoes?”


    Rushingfoam smiled. “Let’s look at this bit more slowly.” He took away two of
    the dominoes so that there was only one. This, stood up on its end. “Let us say
    that this is the zeroth domino.”


    “The zero-ith’?” said Tagg. “Isn’t it the first domino?”


    Rushingfoam laughed. “Sorcerers always start with zero. Later on, you’ll see that
    it makes a lot more sense than you would think. After all, we all begin with nothing
    when we learn sorcery, is that not true?”


    Tagg shrugged. If Sergeant Tufton and Rushingfoam were keen on starting at zero
    when there was a perfectly good “one,” she supposed she would have to go with
    it and chalk it up to a sorcerer’s quirk.


    “I now tap the zeroth domino, and…” he paused, doing that. The domino hit the
    ground with a clink. “...it falls over.” He drew a piece of chalk out of his coat
    and wrote on the ground,


    ## Domino(o) falls over when tapped


    “Now, let’s take domino one,” said Rushingfoam. He picked up another domino and
    stood it up next to the “zeroth,” so that both tiles were lined up. “Will you
    do the honors?”


    Tagg tapped the zeroth domino, feeling rather silly. It knocked into the new piece
    and both fell down.


    “So now we have Domino(1),” said Rushingfoam. “Which also falls over.” He wrote
    as much on the ground beneath the line about Domino(o).


    “You said you have learned something about algebra,” said Rushingfoam. “So you
    are used to substituting letters for numbers. I want to talk about the Nth domino
    now. You might want to think of that for now as ‘the next domino.”


    “So it’s the third domino?” asked Tagg.

    “No, it’s the Nth domino. Where N could be any number greater than two, in this
    case. It could be three, it could be four, it could be seven million and twelve.
    Let’s say that people in Sharell help us line up these dominoes for miles. We
    don’t care which domino is hundreds of miles down the road at Vi Sharell, we just
    care that it is a domino in a line with all the others that have come before.
    Since we don’t know the precise number that it is, we call it the Nth number.


    Isn’t that kind of lazy?” said Tagg, before she could stop herself. She put a
    hand over her mouth quickly. She hadn’t meant to be rude, even if Rushingfoam
    was going to be wasting her time talking about mile-long lines of dominoes.


    But if she had been rude, Rushingfoam didn’t seem to notice. “Not lazy. It is
    a way of proving that something will happen in the future. If we know the first
    domino falls, and we know that if any domino falls the next one must too, then
    we know that every domino will fall.”


    Tagg frowned. “But how do we know the next one must fall?”


    Rushingfoam smiled. “That is the induction step. We assume that if the Nth domino
    falls, then the (N+1)th must also fall. Since we already know the first one falls,
    the second must fall. And because the second falls, the third must fall, and so
    on, forever.”


