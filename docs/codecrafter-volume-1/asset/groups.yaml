    塔格不得不小跑才能跟上梅尔加。女孩步子很大，走路时倾向于挥舞她的法杖，在没有交谈的情况下，塔格开始观察周围环境寻找敌人。梅尔加走了一条离开庭院向上的坡路，向南进入一个维护良好的区域，塔格事后得知那里被称为“法师广场”（Wizard’s
