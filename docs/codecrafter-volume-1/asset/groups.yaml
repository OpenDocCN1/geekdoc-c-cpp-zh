    wanted magic. Well, magic wasn''t magic until it was compiled by lang-monsters
    and if they thought they could get the magic so easily they had another thing
    coming. She would make sure they never got their hands on a spell.


    It was lunchtime at the langhouse. Bon Marett was feeding mice to a very satisfied
