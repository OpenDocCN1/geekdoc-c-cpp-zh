    他们第二天中午抵达，领着马穿过堤道进入了宏大的庭院。塔格（Tagg）本以为在路上奔波了几个周后，她应该感到松口气，但父亲警告的记忆让她不断在阴影中搜寻具有威胁性的身影。与此同时，蒂尔德（Tilde）身上有些地方让她觉得……不对劲。女儿墙上没有守卫，没有成群待命接马的仆人，院子中心沸腾的水池里也没有在洗衣服。


    相反，一个女人和一个比塔格年长的女孩从水池旁的等候处起身，朝他们走来。


    “我们在瞭望台上看到你们过来了，”女人说，“得遇，肖里·熊杀者（Shory Bearkiller）。”


