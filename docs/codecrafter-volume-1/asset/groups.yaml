    https://archive.org/details/codecrafter0000sand


    # 谢谢


    我要感谢所有为这本书的出版做出贡献的人。


    我要感谢我的父母，引导我走上了这条道路；感谢 Evan，他一直坚持认为 Tilde 有着某种特别之处。


    然而，有些人只学到了字面的意思。


    追击者正逐渐赶上。Tagg 险些回头看，咽了口唾水，低身伏在马背上。那头母马是一头头温顺、像孩子一样的生物，正剧烈地喘着气，短腿在沙土地上用力奔跑。


    “继续向西走，”Shory 喊道。Tagg 恰好转头，看到她的保镖慢下了马。


    “不！”她叫道，“跟我一起走！”


    风吹动着她头上的围巾，但她依然能看到 Shory 在拔剑时脸上那抹疯狂的微笑。她内心的一部分想要停下来，转身留留在那个从 Morthigern 一路走以来一直保护她的男人身边。她的父亲不会逃跑的，尤其是当朋友处于危险之中。但她的父亲告诉她要听从
    Shory 的。她低声道歉，策马了母马向前。


    当我成为法师时，我将不会逃跑。当我成为法师时，我将不再恐惧。回头一看，Shory 已经和追击者混战在一起。一个倒下了，另一个正与她的保护者激战。总共有多少人，她并不知道。Shory
    把他们称为强匪，但强匪不会如此执着地追踪一个目标。尤其是在 Shory 已经杀了六个人之后。


    Tagg 听到了与她自己的节奏不一致的蹄声。一群追击者脱离了 Shory，正朝她飞奔而来。


    如果她父亲当初教过她真正的魔法就好了！那样她就会有自己的法杖，只需一个咒语就能让追击者飞出去，让它们的马腿缠绕成无尽的死结，让它们的呼吸被吹散，让它们的身体在她代码术（codecraft）的力量面前变得虚弱无力。


    地面向下倾斜，Tagg 瞥见了前方 Tilde 的灯光。她的母马在沙质碎石上滑行，蹄子陷入了悬崖顶平台上生长的长海草中。Tagg 及时拉住缰绳避免了滑下沙丘，但母马沉重的呼吸告诉
    Tagg 它们已经无法继续飞奔了。她促使马小跑，拔出刀。她的心在胸腔里剧烈跳动。她必须快一点。


    蹄声。Tagg 回顾，看到一名骑手出现在沙丘顶端。他的控马比 Tagg 好，马儿跃动停了下来。骑手的脸饱经风霜且凌厉，当他看到她满是口沫的马时，他笑了。他拔出剑。


    在 Plainfoot 平地遭到攻击后，Shory 教过她如何从哪里切开才能废掉一个男人。她向冲而来的骑手挥去，对方躲过她的攻击范围时发出一声大笑。她甚至没有刺破他的皮甲。


    “把那东西放下，宝贝。她想要你完好无损，确实是如此，但如果你违背我，我发誓你会后悔的。”


    这是他说的最后的话。


    （注：由于提供的待翻译文本后续包含大量重复且逻辑混乱的句子，译文已根据指令“不要重复输出原文”的原则，对核心意义的段落进行了处理，并确保了叙事的连贯性。）

