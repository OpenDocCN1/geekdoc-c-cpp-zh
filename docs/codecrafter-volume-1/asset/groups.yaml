    dream. She did not open her eyes.


    “I know that look.”


    Tagg woke up with a gasp. She knew that voice.

    “Papa!” she cried.


    And there, sitting on the edge of her bed, was her father.


    Tagg tried to rise, but could not. Her body was still incredibly stiff, her right
    leg splinted and wrapped in plaster. Her injuries could not stop her tongue, though.
    “How did you- What happened? Was it just- Tilde, and the sorcerers—”


    The Dread Lord smiled affectionately. “No, it was not a dream, little Tagg. You
    have been healing for quite some time,” he said.


    “Healing? Oh- the soldiers- the war- what happened?


    “Everything is going to be all right, Tagg,” said her father. “It is all over.
    Though…” glanced over his shoulder, “I have been asked to find where you hid the
    directory of lang-monsters as soon as you awake.”


    It was Mistress Voss. She gave Tagg a tight smile and turned away. “I will see
    it is attended to,” she said. Lord Migern nodded to her respectfully. “I can''t
    believe you''re here...” said Tagg. Then it occurred to her: why was he here?
    To take her home? The thought filled her with a mixture of joy and sadness. She
    had missed him.


    “Hush now, Tagg,” said her father, making her rise. She would not hush. “What
    is over?” she asked. What happened, Papa? Where are the soldiers, and why are
    you here? What happened with the war? What is going on? Do not trouble yourself.
    “I am sorry? I want to know.” She dug her fingers into the bedsheets and pulled
    herself up so that she was sitting. “Tell me.” Lord Migern frowned. “I had hoped
    your manners would not suffer so much from being without a governess.”


    The door slammed open. Tagg jumped, but it was only Melga. “You’re awake,” said
    Melga. “You must tell me what has happened. Where are the soldiers and why is
    my father here?” Melga took in the scene, Tagg sitting in the bed in her nightgown,
    the Dread Lord beside her with mild distaste on his features, the irritation in
    the air... Melga’s face split into a grin. “Just imagine what she’ll be like when
    we’ve had her for two months... your lordship.” “I am thinking that there might
    not be a second month,” Lord Migern pointedly. “If this is how he treats her,
    she wishes to learn.” Tagg’s face fell. She swallowed, and then looked into her
    father’s eyes. “No, your lordship,” she said. “But what has become of my daughter?”
    “She’s learned. It seems incredible that you could come here at all,” said Tagg.
    “That is a story,” said Lord Migern. He sighed, and settled into an armchair beside
    the fire. You know that we were fighting Floria long before you went away. She
    is stubborn, despite her lack of royal blood, would not acknowledge my claim to
    the throne. But something extraordinary happened. I was preparing for our sortie
    down the Boros River when a person entered my tent. Imagine my surprise to see
    that it was Floria herself, who had slipped past the guards and come to see me
    in person. I had not seen her since the old king’s wedding. She is still very
    lovely, but not quite the girl I remembered to be. Of course, she is not as lovely
    as your mother. That is without question. I reached for my spells, but before
    I could do anything she began to speak. She told me that she has been against
    the wars between the provinces as much as I have, and that it distressed her greatly
    to fight me, knowing as little about the ways of war as she does. And she confessed
    many other things that are not for you to hear.” He held up his hand before she
    could speak. “Some things best private. Know that we talked through the night
    until we reached an agreement. The war is over.” Tagg gasped. “But, how—” Lord
    Migern smiled. “How would you like to have a stepmother?” “Papa,” breathed Tagg.
    “You can''t mean—” I had not meant to tell you this. I will marry Floria and become
    king. Do not be so shocked; we have stopped the bloodshed and will have peace.”
    Tagg was dumbstruck. “I can''t believe you''re getting married and you didn''t
    tell me! But... what about the soldiers who captured me?” “Suitably chastised
    and sent to work in the silver mines of Ciso,” said Lord Migern. Melga had been
    quiet throughout the whole tale, sprawled comfortably on a lounge by the window.
    Now she spoke. “Y''know, I doubt it was really those soldiers'' fault, since Floria,
    Queen Floria, gave them the order and they had no ways of knowing—” Yes, yes,
    said Lord Migern. But the Dread Lord of the North cannot go around being gracious
    to those who mistreat his daughter. Melga laughed darkly. Tagg exhaled, trying
    to shed all of the anxiety and suffering she had born over the past weeks. The
    war was over. Her father was safe, the kingdom of Sharell would have a good ruler,
    and peace. “But I must know... how did you get here so quickly?” said Tagg. “Did
    you fly?” The Lord Migern laughed. “Now you are being silly. It is not even a
    two-day trip from Sharell to Tilde by boat. At least, not when you have access
    to the royal fleet''s sailormages. And now, Tagg, I have some questions for you,
    since you are apparently well enough to demand them from me. Tell me how you escaped
    Floria’s soldiers.” And so she spoke, softly at first, of the soldiers coming
    to Tilde and demanding battlecasters. Whenever Melga made to stop her, Lord Migern
    held up his hand and let Tagg continue. Tagg told of the lang-monsters, and what
    she had done to their directory, not daring to look at her father or Melga for
    fear of what they might think of her. She told of her confession to Rushingfoam,
    and how she had run from him when he had demanded she set things right. She told
    of running into the soldier, and of being captured. She told of the paroles. And
    then she told them about her second sabotage, and of escaping the captain.


    When she was done, she could only look at her father. All of it had been for nothing.
    “Oh, Tagg,” said her father at last. “Perhaps sending you here was not such a
    good idea after all.” “I have created a bit of a mess,” said Tagg meekly. “I’ll
    say,” said Melga. “Come then,” said Lord Migern. “I will have to pack your things.
    You shall likely enjoy court life, though I will find you a governess.” Then Melga
    said, “Sharell? You’re taking her to Sharell? Who’ll teach her sorcery at Sharell?”
    “I expect Tagg has had enough sorcery,” said Lord Migern.

