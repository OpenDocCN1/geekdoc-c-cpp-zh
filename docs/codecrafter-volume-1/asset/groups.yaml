    也占据了一个空隙，把它们弄断，从而完全堵住了孔。然后她又覆盖上了一层泥，并将其抹平。


    完成后，那里看起来只是有七个凹槽，而不是八个。


    “希望这足够好，”塔格心想。


    她把箱子挪出圆圈。接着，由于过度集中而精疲力竭，肘部因揉捏而作痛，她直接睡着了。


    第二天早上，她醒来时比任何时候都要疲累。她的圈子里有几块旅行干面包，她不得不费力把它们捡起来、咀嚼并咽下去。她努力不让焦虑显现在脸上。万一失败了怎么办？


    上官到了，踢开箱子，对分体生物（partishes）说了一句话。“早安，大小姐，”他说，抓起她的肩膀把她拉起来。塔格听到分体生物冲向箱子时发出的吱吱声和爬行声。


    “早——早，”塔格说。随着分体生物的离开，她感到头脑开始清醒。她的身体很酸痛，但她可以强撑过去。她需要保持头脑冷静。


    吱吱声持续着。一个分体生物找不到可以安顿自己的地方。


    “伸出手，”上官说，挥舞着他用来系她手腕的绳子。


    吱吱声变得越来越狂乱。塔格让身体垂下，眼睛找到了分体生物的箱子。它们正四处乱爬，争夺槽位，互相攻击，并撬出已经入位的个体以抢夺它们的家园。上官试图抓住她的手，塔格想：就是现在！


    她突然推了他一把。上官失去了平衡，向后踉跄，脚落在了箱子里。


    接着，分体生物扑向了他，寻找一个锚点来充电。当它们爬满他的身体时，上官叫了起来。塔格没有留下来看。她跑了，在树林间穿梭，躲避向上官副官跑去的士兵。


    尽管很疲惫，她的心在歌唱。她做到了！她面对了问题并克服了它。即使经历了失败，或许正因为这些失败，她感到胜利的甜味流遍全身，给她继续奔跑、继续移动、坚持前行的力量。这就像施展她的第一个咒语，编写她的第一行代码……她创造了什么，独立解决了一个问题……而且它成功了。


    她看到前方有一排马。她的肌肉像火烧了一样，但无法停止奔跑。士兵们在这里停了马，正为当天的旅程做准备。她提起裙子，抓起几把裙摆，穿过丛林。在昏暗的光线下下，她希望自己的黄铜夹能被当作链条，而她能伪装成从蒂尔德（Tilde）招募的巫师之一。


    “快快，上官受伤了！”她喊道。


    几个士兵担忧地抬头。他们中没有一个冲过去，方便地让她留有了挑选马的机会。


    她抓起最近的一只动物的缰绳，翻上马鞍。


    “嘿！”最近的士兵说，“你不能——”


    “他受伤了，他需要治疗师！”她喊道，用脚跟踢了那只动物。


    当她策马狂奔时，她听到另一个士兵赶到。“犯逃了！”他大喊道。


    那时塔格已经太远了，听不见。她伏在马鞍上，在向蒂尔德疾驰时尽力保持平衡。她的腿因速度太快而尖叫，肌肉在努力坐稳时如火灼之。


    等塔格再次反应过来时，身后传来了蹄声。她驱使马跑得更快，俯伏在马背上。她的骑术更好，但她疲惫的身体无法再维持这种速度多久了。


    草原在她面前铺开，随后她能看到左侧的海洋，树木的影子在身后远去。远处是海鸟的鸣叫，而前方地平线上一点微弱的光，那是蒂尔德。


    士兵们正与她并驾。塔格低声念道：“快点，快点。”她偷了一眼右边的士兵，发出了惊讶的惊呼：他快要追上她了。


    接着，她的坐骑抖了一下。马抖了一下。马抖了一下。马抖了一下。马抖了一下。马抖了一下。这。

