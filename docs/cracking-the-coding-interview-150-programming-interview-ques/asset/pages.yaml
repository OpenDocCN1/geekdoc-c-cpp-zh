  md: '# Chapter 6 | Brain Teasers


    A first approach is to divide the balls in sets of four, with the ninth ball sitting
    off the side. The heavy ball is in the heavier set. If they are the same weight,
    then we know that the ninth ball is the heavy one. Replicating this approach for
    the remaining sets would result in a worst case of three weighings—one too many!


    This is an imbalance in the worst case: the ninth ball takes just one weighing
    to discover if it''s heavy, whereas others take three. If we penalize the ninth
    ball by putting more balls off to the side, we can lighten the load on the others.
    This is an example of “worst case balancing.


    If we divide the balls into sets of three items each, we will know after just
    one weighing which has the heavy one. We can even formalize this into a rule:
    given N balls, where N is divisible by 3, one use of the scale will point us to
    a set of N/3 balls with the heavy ball.


    For the final set of three balls, we simply repeat this: put one ball off the
    side and weigh two. Pick the heavier of the two. Or, if the balls are the same
    weight, pick the third one


    # Algorithm Approaches


    If you''re stuck, consider applying one of the five approaches for solving algorithm
    questions. Brain teasers are often nothing more than algorithm questions with
    the technical aspects removed. Exemplify, Simplify and Generalize, Pattern Matching,
    and Base Case and Build can be especially useful.


