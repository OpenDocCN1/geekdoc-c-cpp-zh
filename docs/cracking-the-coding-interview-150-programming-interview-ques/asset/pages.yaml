  md: '# II. Behind the Scenes | The Facebook Interview


    Through Facebook''s online engineering puzzles get a lot of hype, they''re merely
    one way to get noticed. You can still apply without solving these puzzles, the
    traditional avenues like an online job application or your university career fair.


    Once selected for an interview, candidates will generally do one of two phone
    screens. Local candidates, however, will often do one interview before being invited
    on-site. Phone screens will be technical and will involve coding, usually via
    Etherpad or another online document editor.


    If you are in college and are interviewing you will also do coding. This will
    be done either on a whiteboard (if one is available) or on a sheet of paper.


    During your on-interview, you will interview primary with other engineers, but
    hiring managers are also involved whenever they are available. All interviewers
    have gone through comprehensive interview training, and who you interview has
    no bearing on your odds of getting an offer.


    Each interviewer is given a "role" during the on-interviews, which helps ensure
    that there are no repetitive questions and that they get a holistic picture of
    a candidate. Questions are broken down into algorithm / coding skills, architecture
    / design skills, and the ability to be successful in Facebook''s fast-paced environment.


    After your interview, interviewers submit written feedback, prior to discussing
    your performance with each other. This ensures that your performance in one interview
    will not bias another interviewer''s feedback.


    Once everyone''s feedback is submitted, your interviewing team and a hiring manager
    get together to collaborate on a final decision. They come to a consensus decision
    and submit a final recommendation to the hiring committee.


    Facebook looks for "ninja skills"--the ability to get together an elegant and
    scalable solution using any language of choice. Knowing PHP is not especially
    important, particularly given that Facebook also does a lot of backend work in
    C++, Python, Erlang, and other languages.


    # Definitely Prepare:


    The youngest of the "elite" tech companies, Facebook develops with an entrepreneurial
    spirit. In your interviews, you should show that you love to build stuff fast.


    # What''s Unique:


    Facebook interviews developers for the company "general", not for a specific team.
    If you are hired, you go through a six-week "bootcamp" which will help you up
    in the massive code base. You will get mentorship from senior devs, learn best
    practices, and ultimately, get a greater flexibility in choosing a project than
    you were assigned to a project in your interview.


