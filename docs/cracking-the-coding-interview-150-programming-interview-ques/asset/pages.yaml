  md: '# Solutions to Chapter 9 | Recursion and Dynamic Programming


    9.1 A child is running up a staircase with n steps, and can hop either 1 step,
    2 steps, or 3 steps at a time. Implement a method to count how many possible ways
    the child can run up the stairs.


    pg 109


    SOLUTION


    We can approach this problem from the top down. On the very last hop, up to the
    nth step, the child could have done either a single, double, or triple step hop.
    That is, the last move might have been a single step hop from step n-1, a double
    step hop from step n-2, or a triple step hop from n-3. The total number of ways
    of reaching the last step is the sum of the number of ways reaching each of the
    last three steps.


    A simple implementation of this code is below.


    ```

    1 public int countways(int n) {

    2   if (n < 0) {

    3     return 0;

    4   } else if (n == 0) {

    5     return 1;

    6   } else {

    7     return countways(n - 1) + countways(n - 2) +

    8     countways(n - 3);

    9   }

    10 }

    ```


    Like the Fibonacci problem, the runtime of this algorithm is exponential (specifically,
    O(3ⁿ)), since each call branches out to three more calls. This means that countways
    is called many times for the same values, which is unnecessary. We can fix this
    using dynamic programming.


    ```

    11 public static int countwaysDP(int n, int[] map) {

    12   if (n < 0) {

    13     return 0;

    14   } else if (n == 0) {

    15     return 1;

    16   } else if (map[n] > -1) {

    17     return map[n];

    18   } else {

    19     map[n] = countwaysDP(n - 1, map) +

    20     countwaysDP(n - 2, map) +

    21     countwaysDP(n - 3, map);

    22     return map[n];

    23   }

    24 }

    ```


    Regardless of whether or not you use dynamic programming, note that the number
    of ways will quickly overflow the bounds of an integer. By the time you get to
    n = 37, the result has already overflowed. Using a long will delay, but not completely
    solve, this issue.'
