- img_proc: true
  md: '# Chapter 12 | Testing


    +   - Organization: Do you approach the problem in a structured manner, or do
    you spout anything that comes to your head? Some candidates, when asked to come
    with test cases for a camera, will just state anything and everything that comes
    to their head. A good candidate will break down the parts into categories like
    Taking Photos, Image Management, Settings, and so on. This structured approach
    will also help you to do a more thorough job creating the test cases.


    +   - Practicality: Can you actually create reasonable testing plans? For example,
    if a user reports that the software crashes when they open a specific image, and
    you just tell them to re reinstall the software, that''s typically not very practical.
    Your testing plans need to be feasible and realistic for a company to implement.


    Demonstrating these aspects will show that you will be a valuable member of the
    testing team.


    # Testing a Real World Object


    Some candidates will be surprised to be asked questions like how to test a pen.
    After all, you should be testing software, right? Maybe, but these "real world"
    questions are still very common. Let''s walk through this with an example.


    Question: How would you test a paperclip?


    Step 1: Who will use it? And why


    You need to discuss with your interviewer who is using the product and for what
    purpose. The answer may not be what you think. The answer could be "by teachers,
    to hold papers together," or it could be "by artists, to bend into the shape of
    animal." Or, or it could be both. The answer to this question will shape how you
    handle the remaining questions.


    Step 2: What are the use cases?


    It will be useful for you to make a list of the use cases. In this case, the use
    case might be simply fastening paper together in a non-damaging (to the paper)
    way.


    For other questions, there might be multiple use cases. It might be, for example,
    that the product needs to be able to send and receive content, or write and erase,
    and so on.


    Step 3: What are the bounds of use?


    The bounds of use might mean holding up to thirty sheets of paper in a single
    usage without permanent damage (e.g., bending), and thirty to fifty sheets with
    minimal permanent bending.


    The bounds also extend to environmental factors as well. For example, should the
    paperclip work during very warm temperatures (90 - 110 degrees Fahrenheit)? What
    about extreme cold?'
