    \ considering locks. A synchronized method applies a \"lock\" on all synchronized\
    \ methods in that instance of the object. This blocks other threads from executing\
    \ synchronized methods within that instance.\n\nIn the second part, we are asked\
    \ if thread1 can execute synchronized method A while thread2 is executing nonsynchronized\
    \ method B. Since B is not synchronized, there is nothing to block thread1 from\
    \ executing A while thread2 is executing B. This is true regardless of whether\
    \ thread1 and thread2 have the same instance of the object or not.\n\nUltimately,\
    \ the key concept to remember is that only one synchronized method can be in execution\
    \ per instance of that object. Other threads can execute non-synchronized methods\
    \ on that instance, or they can execute any method on a different instance of\
    \ the object."
