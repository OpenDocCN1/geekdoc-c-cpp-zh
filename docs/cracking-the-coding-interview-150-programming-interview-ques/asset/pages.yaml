    array of integers. You might proceed as follows.


    Step 1: Define the test cases


    In general, you should think about the following types of test cases:


    +   * The normal case: Does it generate the correct output for typical inputs?
    Remember to think about potential issues here. For example, because sorting often
    requires some sort of partitioning, it''s reasonable to think that the algorithm
    might fail on an odd number of elements, since they can''t be evenly partitioned.
    Your test case should list both examples.

    * The extremes: What happens when you pass in an empty array? Or a very small
    (one element) array? What if you pass in a very large one?

    * Nulls and "illegal" input: It is worthwhile to think about how the code should
    behave when given illegal input. For example, if you''re testing a function to
    generate the nth Fibonacci number, your test cases should probably include the
    situation where n is negative.

    * Strange input: A fourth kind of input sometimes comes up: strange input. What
    happens when you pass in an already sorted array? Or an array that''s sorted in
