  md: '# I. The Interview Process | How Questions are Selected


    Candidates frequently ask me what the "recent" interview questions are at a specific
    company, as the questions change over time. The reality is that the company itself
    has typically little to do with selecting the questions. It''s all up to the interviewer.
    Allow me to explain.


    At a large company, interviewers typically go through an interviewer training
    course. My "training course at Google was outsourced to another company. Half
    of the one-day training course focused on the legal aspects of interviewing: don''t
    ask a candidate if they''re married, don''t ask about their ethnicity, and so
    on. The other half discussed "troublesome" candidates: the ones who get angry
    or rude when asking a coding question or other questions they think are "beneath
    them." After the training course, I shadowed two real interviews to see what they
    showed in an interview—as though I didn''t already know it! After that, I was
    sent off to interview candidates on my own.


    That''s it. That''s all the training we got—and that''s very typical of companies.


    There was no list of "official Google interview questions." No one ever told me
    that I should ask a particular question, and no one told me to avoid certain topics.


    So where did my questions come from? From the same places as everyone else''s.
    Interviewers borrow what they were asked as candidates. Some swap amongst each
    other. Others look on the internet for questions, including—yes—CareerCup.com.
    And some interviewers take questions from the earlier mentioned resources and
    tweak them in minor or major ways.


    It''s unusual for a company to give give a list of questions. Interviewers pick
    their own questions and tend to have each a pool of five or so that they prefer.


    So next time you want to know what the "recent" Google interview questions are,
    stop and think. Google interview questions are really no different from Amazon
    interview questions since the questions aren''t decided at a company-wide level.
    The "recent" questions are also irrelevant. Questions don''t change over time
    since no one''s telling you what to do.


    There are some differences in broad terms across companies. Web-based companies
    are more likely to ask system design questions, and a company using databases
    is more likely to ask you database questions. Most questions, however, fall into
    the broad "data structures and algorithms" category and could be asked by any
    company.'
