  md: '# I. The Interview Process | The Evaluation Process


    Most recruiters will probably tell you that candidates are evaluated on four aspects:
    prior experience, culture fit, coding skills, and analytical ability. These four
    components are certainly all in play, but typically the decision comes down to
    coding skills and your analytical ability (or intelligence). This is why most
    of this book is devoted to improving your coding and algorithm skills.


    However, just because the decision usually comes down to coding and algorithm
    skills doesn''t mean you should overlook the other two factors.


    At big companies, your experience tends not to be a direct deciding factor once
    you''re actually interviewing, but it may bias an interviewer''s perception of
    the rest of your interview. For example, if you demonstrate brilliance when you
    discuss some tricky program you wrote, your interviewer is more likely to think,
    "Wow, she''s brilliant! And once he''ve decided that you''re sure, he''s more
    likely to subconsciously overlook your little mistakes. Interviewing, after all,
    is not an exact science. Preparing for "soft" questions is well worth your time.


    Culture fit (or your personality, particularly in relation to the company) tends
    to matter more at smaller companies than at big companies. One way it might come
    up is if the company''s culture is to let employees make decisions independently,
    and you need direction.


    It''s not unusual for a candidate to get rejected because they appear too arrogant,
    argumentative, defensive. I once had a candidate blame himself with a question
    on my wording of the problem, and later, on the way that I''d coached him through
    it. I recorded this defensiveness as a potential red flag—and, as it turns out,
    so did the other interviewers. He was rejected. Who wants to work with a teammate
    like that?


    What this means for you is the following:


    +   - If people often perceive you as arrogant or argumentative in an interview...
    Even an otherwise superstar candidate may get rejected if people don''t want to
    work with them


    +   - Spend some time preparing for questions about your resume. It''s not the
    most important factor, but it matters. Even a little bit of time can help you
    improve in major ways. It''s a great "bang for your buck."


    +   - Focus mainly on coding and algorithm questions.


    Finally, it''s worth noting that interviewing is not a perfect science. There
    is some randomness not only in your performance, but also in the decision of the
    hiring committee (or whoever decides your offer). Like any group, the hiring committee
    is easily swayed by the most outspoken individuals. It may not be fair, but that''s
    the way it is.


    And remember—a rejection is not a life sentence. You can always reapply within
    a year, and many candidates get offers from companies that previously rejected
    them.

    Don''t get discouraged. Keep at it.'
