    # 4.8


    You have two very large binary trees: T1, with millions of nodes, and T2, with
    hundreds of nodes. Create an algorithm to decide if T2 is a subtree of T1.


    A tree T2 is a subtree of T1 if there exists a node in T1 such that the subtree
    of n is identical to T2. That is, if you cut off the tree at node n, the two trees
    would be identical.


    pg 86


    # SOLUTION


    In problems like this, it''s useful to attempt to solve the problem assuming there
    is just a small amount of data. This will give us a basic idea of an approach
    that might work.


    In this smaller, simpler problem, we could create a string representing the in-order
    and pre-order traversals. If T2''s pre-order traversal is a substring of T1''s
    pre-order traversal, and T2''s in-order traversal is a substring of T1''s in-order
    traversal, then T2 is a subtree of T1. Substrings can be checked with suffix trees
    in linear time, so this algorithm is relatively efficient in terms of the worst
    case.


    Note that we need to insert a special character into our strings to indicate when
    a left or right node is NULL. Otherwise, we would be unable to distinguish between
    the following cases:


    ![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_244_0.png)


    These would have the same in-order and pre-order traversal, even though they are
    different.


    ```

    T1, in-order: 3, 3

    T1, pre-order: 3, 3

    T2, in-order: 3, 3

    T2, pre-order: 3, 3

    ```


    However, if we mark the NULL values, we can distinguish between these two trees:


    ```

    T1, in-order: 0, 3, 0, 3, 0

    T1, pre-order: 3, 3, 0, 0, 0

    T2, in-order: 0, 3, 0, 3, 0

    T2, pre-order: 3, 3, 0, 3, 0

    ```


    While this is a good solution for the simple case, our actual problem has much
    more data. Creating a copy of both trees may require too much memory given the
    constraints of the problem.


