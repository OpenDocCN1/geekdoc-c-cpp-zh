  md: '# II. Behind the Scenes | The Yahoo! Interview


    While Yahoo! tends to recruit from the top schools, other candidates can still
    get interviewed through Yahoo''s job board (or—better yet—through an internal
    referral). If you are selected for an interview, your interview process will start
    off with a phone screen. Your phone screen will be with a senior employee such
    as a tech lead or manager.


    During your on-site interview, you will typically interact with 6-7 people on
    the same team for 45 minutes each. Each interviewer will have an area of focus.
    For example, one interviewer might focus on databases, while another interviewer
    might focus on your understanding of computer architecture. Interviews will often
    be composed as follows:


    +   - 5 minutes: General conversation. Tell me about yourself, your projects,
    etc.

    - 20 minutes: Coding question. For example, implement merge sort.

    - 20 minutes: System design. Design a large distributed cache. These questions
    will often focus on an area from your past experience or something your interviewer
    is currently working on.


    At the end of the day, you will likely meet with a Program Manager or someone
    else for a general conversation. This may include a product demo or a discussion
    about potential concerns about coming to the company or your competing offers.
    This is usually not a factor in the decision.


    Meanwhile, your interviewers will discuss your performance and attempt to come
    to a decision. The hiring manager has the ultimate say and will weigh the positive
    feedback against the negative.


    If you have done well, you will often get a decision that day, but this is not
    always the case. There can be many reasons why you might not be told for several
    days—for example, the team may feel it needs to interview other people.


    > Definitely Prepare:


    Yahoo!, almost as a rule, asks questions about system design, so make you prepare
    for that. They want to know that you can not only write code, but can also design
    software. Don''t worry if you don''t have a background in this—you can still reason
    your way through it!


    What''s Unique:

    nYour phone interview will likely be performed by someone with more influence,
    such as a hiring manager. Yahoo! is also unusual in that it often gives a decision
    (if you''re hired) on the same day. Your interviewers will discuss your performance
    while you meet with a final interviewer.'
