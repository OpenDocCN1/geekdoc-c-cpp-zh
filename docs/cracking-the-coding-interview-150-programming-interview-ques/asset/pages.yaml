  md: '# Bit Manipulation


    Bit manipulation is used in a variety of problems. Sometimes, the question explicitly
    calls for bit manipulation, while at other times, it''s simply a useful technique
    to optimize your code. You should be comfortable with bit manipulation by hand,
    as well as with code. But be very careful; it''s easy to make little mistakes
    on bit manipulation problems. Make sure to test your code thoroughly after you''re
    done writing it, or even writing it.


    # Bit Manipulation By Hand


    The practice exercises below will be useful if you have the oh-so-common fear
    of bit manipulation. When you get stuck or confused; try to work these operations
    as a base 10 number. You can then apply the same process to a binary number.


    Remember that ^ indicates an XOR operation, and ~ is not a (negation) operation.
    For simplicity, assume that these are four-number bits. The third column can be
    solved manually, or with “tricks” (described below).


    | 0110 + 0010 | | 0011 * 0101 | 0110 + 0110 |

    |---|---|--|

    | 0011 + 0010 | 0011 * 0011 | 0100 * 0011 |

    | 0110 - 0011 | 1101 >> 2 | 1101 ^ (~1101) |

    | 1000 - 0110 | 1101 ^ 0101 | 1011 & (~<< 2) |


    Solutions: line 1 (1000, 1111, 1100); line 2 (0101, 1001, 1100); line 3 (0011,
    1111, 1111); line 4 (0100, 1000, 1000).


    The tricks in Column 3 are as follows:


    +   1. 0110 + 0110 is equivalent to 0110 * 2, which is equivalent to shifting
    0110 by 1.


    +   2. Since 0100 equals 4, we are just multiplying 0011 by 4. Multiplying by
    2” just shifts a number by n. We shift 0011 left by 2 to get 1100.


    +   3. Think about this operation bit by bit. If you XOR a bit with its own negated
    value, you will always get 1. Therefore, the solution to a^(~a) will be a sequence
    of 1s.


