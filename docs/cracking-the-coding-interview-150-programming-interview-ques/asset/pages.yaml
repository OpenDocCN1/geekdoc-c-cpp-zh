    forget to ask yourself the following:


    +   - What are its space and time complexity?

    - What happens if there is a lot of data?

    - Does your design cause other issues? For example, if you''re creating a modified
    version of a binary search tree, did your design impact the insert, find, and
    delete?

    - If there are other issues or limitations, did you make the right trade-offs?
    For which scenarios might the trade-off be less optimal?

    - If they gave you specific data (e.g., mentioned that the data is ages, or in
    sorted order), have you leveraged that information? Usually there''s a reason
    that an interviewer gives you specific information.


    It''s perfectly acceptable, to first mention the brute force solution. You can
    then continue to optimize from there. You can assume that you''re expected to
    create the most optimal solution possible, but that doesn''t mean that the first
    solution you give must be perfect.


    # Step 3: Pseudocode


    Writing pseudocode first can help you outline your thoughts clearly and reduce
    the number of mistakes you commit. Make sure to tell your interviewer that you''re
    writing pseudocode first and that you''ll follow it up with "real" code. Many
