    # Databases


    Candidates who profess experience with databases may be asked to demonstrate this
    knowledge by implementing SQL queries or designing a database for an application.
    We''ll review some of the key concepts and offer an overview of how to approach
    these problems.


    As you read these queries, don''t be surprised by minor variations in syntax.
    There are a variety of flavors of SQL, and you might have worked with a slightly
    different one. The examples in this book have been tested against Microsoft SQL
    Server.


    # SQL Syntax and Variations


    Developers commonly use the implicit join and the explicit join in SQL queries.
    Both syntaxes are shown below.


    ```

    /* Explicit Join */

    SELECT CourseName, TeacherName

    FROM Courses INNER JOIN Teachers

    ON Courses.TeacherID = Teachers.TeacherID


    /* Implicit Join */

    SELECT CourseName, TeacherName

    FROM Courses, Teachers

    WHERE Courses.TeacherID = Teachers.TeacherID

    ```


    The two statements above are equivalent, and it''s a matter of personal preference
    one you choose. For consistency, we will still stick to the explicit join.


    # Denormalized vs. Normalized Databases


    Normalized databases are designed to minimize redundancy, while denormalized databases
    are designed to optimize read time.


    In a traditional normalized database with data like Courses and Teachers, Courses
    might contain a column called TeacherID, which is a foreign key to Teacher. One
    benefit of this is that information about the teacher (name, address, etc.) is
    only stored'
