    # Sorting and Searching


    Understanding the common sorting and searching algorithms is incredibly valuable,
    as many of sorting and searching problems are tweaks of the well-known algorithms.
    A good approach is therefore to run through the different sorting algorithms and
    see if one applies particularly well.


    For example, suppose you are asked the following question: Given a very large
    array of Person objects, sort the people in increasing order of age.


    We''re given two interesting bits of knowledge here:


    +   1. It''s a large array, so efficiency is very important.


    +   2. We are sorting based on ages, so we know the values are in a small range.


    By scanning through the various sorting algorithms, we might notice bucket sort
    (or radix sort) would be a perfect candidate for this algorithm. In fact, we can
    make the buckets small (just 1 year each) and get O(n) running time.


    # Common Sorting Algorithms


    Learning (or re-learning) the common sorting algorithms is a great way to boost
    your performance. Of the five algorithms explained below, Merge Sort, Quick Sort
    and Bucket Sort are the most commonly used in interviews.


    Bubble Sort | Runtime: $O(n^2)$ average and worst case. Memory: $O(1)$.


    In bubble sort, we start at the beginning of the array and swap the first two
    elements if the first is greater than the second. Then, we go to the next pair,
    and so on, continuously making sweeps of the array until it is sorted.


    Selection Sort | Runtime: $O(n^2)$ average and worst case. Memory: $O(1)$.


    Selection sort is the child''s algorithm: simple, but inefficient. Find the smallest
    element using a linear scan and move it to the front (swapping it with the front
    element). Then, find the second smallest and move it, again doing a linear scan.
