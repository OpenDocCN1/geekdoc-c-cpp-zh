    # Mathematics and Probability


    Although many mathematical problems given during an interview read as brain teasers,
    most can be tackled with a logical, methodical approach. They are typically rooted
    in the rules of mathematics or computer science, and this knowledge can facilitate
    either solving the problem or validating your solution. We''ll cover the most
    relevant mathematical concepts in this section.


    # Prime Numbers


    As you probably know, every positive integer can be decomposed into a product
    of primes. For example:


    ```

    84 = 2^2 * 3^1 * 5^0 * 7^1 * 11^0 * 13^0 * 17^0 * ...

    ```


    Note that many of these primes have an exponent of zero.


    # Divisibility


    The prime number law stated above means that, in order for a number x to divide
    a number y (written x\y, or mod(x,y) = 0), all primes in x''s prime factorization
    must be in y''s prime factorization. Or, more specifically:


    ```

    x = 2^k0 * 3^k1 * 5^k2 * 7^k3 * 11^k4 * ...

    ```


    ```

    Let y = 2^k0 * 3^k1 * 5^k2 * 7^k3 * 11^k4 * ...

    ```


    ```

    x\y, then for all i, j <= ki ..

    ```


    In fact, the greatest divisor of x and y will be:


    ```

    gcd(x, y) = 2^min(j, k0) * 3^min(j, k1) * 5^min(j, k2) * ...

    ```


    The least common multiple of x and y will be:


    ```

    lcm(x, y) = 2^max(j, k0) * 3^max(j, k1) * 5^max(j, k2) * ...

    ```


    As a fun exercise, stop for a moment and think what would happen if you did gcd
    lcm:


    ```

    gcd * 1cm = 2^min(j, k0) * 2^max(j, k0) * 3^min(j, k1) * 3^max(j, k1) * ...

    ```'
