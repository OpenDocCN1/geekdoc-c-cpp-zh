  md: '# IV. Before the Interview | Getting the Right Experience


    Although offer decisions are typically based more on the interview than anything
    else, it is your resume—and your prior experience—that gets you the interview.
    You should think actively about how to enhance your technical (and nontechnical)
    experience. Both students and professionals will benefit greatly by adding additional
    coding experience.


    For current students, this may mean the following:


    +   - Take the Big Project Classes: If you''re in school, don''t shy away from
    the classes with big, "meaty" projects. These projects on your resume and will
    greatly improve your chances at getting an interview with the top companies. The
    more relevant the project is to the real world, the better.


    +   - Get an Internship: Even at a relatively early stage in school, students
    can get relevant professional experience. Freshmen and sophomores can get early
    experience through programs like Microsoft Explorer and Google Summer of Code.
    If you can''t get one of these internships, start-ups are also a great option.


    +   - Start Something: Trying your hand at something more entrepreneurial will
    impress almost any company. It develops your technical experience and shows that
    you have initiative and "can get things done." Use your weekends and breaks to
    build some software on your own. If you want to know a favor, you might even get
    her to agree to "sponsor" your work as an independent study


    Professionals, on the other hand, may already have the right experience to switch
    to their dream company. For instance, a Google dev probably has sufficient experience
    to switch to Facebook. However, if you''re trying to move from a lesser known
    company to leaving, you can discuss your eagerness to take on bigger challenges.
    From one of the "biggies," or from testing / IT to a dev role, the following advice
    will will be useful:


    +   - Shift Work Responsibilities Towards Coding: Without revealing to your manager
    that you are thinking of leaving, you can. As much as possible, try to ensure
    that these projects are "meaty," use relevant technologies, and lend themselves
    to a resume bullet or two. It is these coding projects that, ideally, form the
    bulk of your resume.


    +   - Use Your Nights and Weekends: If you have some free time, use it to build
    a mobile app, a web app, or a piece of desktop software. Doing such projects is
    also a great way to get experience with new technologies, making you more relevant
    to today''s companies. This project work should definitely be listed on your resume;
    few things are as impressive to an interviewer as a candidate who built something
    "just for fun."


    All of these boil down to the two big things that companies want to see: that
    you''re smart and that you can code. If you can prove that, you can land your
    interview.


    In addition, you should think in advance about where you want your career to go.
    If you want to move into management down the road, even though you''re currently
    looking for a dev position, you should find ways of developing leadership experience.


    34 Cracking the Coding Interview'
