    \ You should not use + or any arithmetic operators.\n\npg 167\n\n# SOLUTION\n\n\
    Our first instinct in problems like these should be that we're going to work with\
    \ bits. Why? Because when you take away the + sign, what other choice do we have?\
    \ Plus, that's how computers do it!\n\nOur next thought should be to, really understand\
    \ how addition works. We can walk through an addition problem to see if we can\
    \ understand something new—some pattern—and then see if we can replicate that\
    \ with code.\n\nSo let's just do that—let's walk through an addition problem.\
    \ We'll work in base 10 so that it's easier to see.\n\nTo add 759 + 674, I would\
    \ usually add digit[0] from each number, carry the one, add digit[1] from each\
    \ number, carry the one, and so on. You could take the same approach in binary:\
    \ add each digit, carry each digit, and carry the one as necessary.\n\nCan we\
    \ make this a little easier? Yes! Imagine I decided to split apart the \"addition\"\
    \ and \"carry\" steps. I then do the following:\n\n+   1. Add 759 + 674\n2. Add\
    \ 759 + 674 but only do the carrying, rather than the addition of each digit.\
    \ I then get 1110.\n3. Add the result of the first two operations (recursively,\
    \ using the same process described in step 1 and 2): 1110 + 323 = 1433.\n\nNow,\
    \ how would we do this in binary?\n\n+   1. If I add two binary numbers together,\
    \ but forget to carry, the ith bit in the sum will be 0 only if a and b have the\
    \ same ith (both 0 or both 1). This is essentially XOR.\n2. If I add two numbers\
    \ together but only carry, I will have a 1 in the ith bit of the sum only if bit\
    \ i - 1 of a and b are both 1s. This is an AND, shifted.\n3. Now, recurse until\
    \ there's nothing to carry.\n\nThe following code implements this.\n\n```\npublic\
    \ static int add(int a, int b) {\n    if (b == ==) return a;\n    int sum = a\
    \ ^ b; // without carrying\n    int carry = (a & b) << 1; // carry, but don't\
    \ add\n    return add(sum, carry); // recurse\n}\n```\n\nProblems requiring us\
    \ to implement core operations like addition and subtraction are relatively common.\
    \ The key in all of these problems is to dig into these operations"
