  md: '# IV. Before the Interview | Writing a Great Resume


    # Projects


    Developing the projects section on your resume is often the best way to present
    yourself as more experienced. This is especially true for college students or
    recent grads.


    The projects should include your 2 - 4 most significant projects. State what the
    project was and which languages or technologies it employed. You may also want
    to consider including details such as whether the project was an individual or
    a team project, and whether it was completed for a course or independently. These
    details are not required, so only include them if they make you look better.


    Do not add too many projects. Many candidates make the mistake of adding all 13
    of their prior projects, cluttering their resume with small, non-impressive projects.


    # Programming Languages and Software


    Software


    Generally speaking, I do not recommend listing that you''re familiar with Microsoft
    Office. Everyone is, and it dilutes the "real" information. Familiarity with highly
    technical software (e.g., Visual Studio, Linux) can be useful, but, frankly, it
    usually doesn''t make much of a difference.


    # Languages


    Knowing which languages to include on your resume is always a tricky thing. Do
    you list everything you''ve ever worked with, or do you shorten the list to the
    ones that you''re most comfortable with? I recommend the following compromise:
    list most of the languages you''ve used, but add your experience level. This approach
    is shown below:


    +   - Languages: Java (expert), C++ (proficient), JavaScript (prior experience).


    # Advice for Non-Native English Speakers and Internationals


    Some companies will throw out your resume just because of a typo. Please get at
    least one native English speaker to proofread your resume.


    Additionally, for US positions, do not include age, marital status, or nationality.
    This sort of personal information is not appreciated by companies, as it creates
    a legal liability for them.'
