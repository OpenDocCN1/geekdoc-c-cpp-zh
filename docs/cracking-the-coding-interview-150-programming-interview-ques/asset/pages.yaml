    adding a user, creating a conversation, updating one''s status, and so on. In
    the interest of time and space, we will not go into the networking aspects of
    the problem, or how the data actually gets pushed out to the clients.


    We will assume "friending" is mutual; I am only your contact if you are mine.
    Our chat system will support both group chat and one-on-one (private) chats. We
