    Dynamic programming, as you can see, is nothing to be scared of. It''s little
    more than recursion where you cache the results. A good way to approach such a
    problem is often to implement it as a normal recursive solution, and then to add
    the caching part.


    # Recursive vs. Iterative Solutions


    Recursive algorithms can be very inefficient. Each recursive call adds a new layer
    to the stack, which means that if your algorithm has O(n) recursive calls, then
    it uses O(n) memory. Oops!


    All recursive code can be implemented iteratively, although sometimes the code
    to do so is much more complex. Before diving into recursive code, ask yourself
    how hard it would be to implement it iteratively, and consider the trade-offs
    with your interviewer.


