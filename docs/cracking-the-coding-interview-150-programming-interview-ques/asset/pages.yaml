    If we stored all the data on one machine, we would do two passes of the document.
    The first pass would split the URLs into 4000 chunks of 1 GB each. An easy way
    to do that is to store each URL in a file named <x>.txt where x = hash(u) % 4000.
    In the second pass, we divide the URLs based on their hash value (modulo the number
    of chunks). This way, all URLs with the same hash value will be in the same file.


