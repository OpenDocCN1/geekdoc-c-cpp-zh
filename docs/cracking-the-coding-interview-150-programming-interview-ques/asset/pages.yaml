  md: '# VII. The Offer and Beyond | Handling Offers and Rejection


    Just when you thought you could sit back and relax after your interviews, you
    faced the post-interview stress: Should you accept the offer? Is it the right
    one?

    How do you decline an offer? What about deadlines? We''ll handle a few of these
    issues here and go into more details about how to evaluate an offer, and how to
    negotiate it.


    # Offer Deadlines and Extensions


    When companies extend an offer, there''s almost always a deadline attached to
    it. Usually these deadlines are one to four weeks out. If you''re still waiting
    to hear back from other companies, you can ask for an extension. Companies will
    usually try to accommodate this, if possible.


    # Declining an Offer


    How you decline an offer matters. Even if you aren''t interested in working for
    this company right now, you might be interested in working for it in a few years.
    (Or, your contacts might move to another more exciting company.)It''s in your
    best interest to decline the offer on good terms and keep a line of communication
    open.


    When you decline an offer, offer a reason that is non-offensive and inarguable.
    For example, if you were declining a big company for a start-up, you could explain
    that you feel a start-up is the right choice for you at this time. The big company
    can''t suddenly "become" a start-up, so they can''t argue about your reasoning.


    # Handling Rejection


    The tech companies reject around 80% of their interview candidates and recognize
    that interviews are not a perfect test of skills. For this reason, companies are
    often eager to re-interview previously rejected candidates. Some companies will
    even reach out to old candidates or expedite their application because of their
    prior performance.


    When you get the unfortunate call, you should see this as a setback but not a
    life sentence. Your recruiter for it time, explain that you''re disappointed but
    you understand their position, and ask when you can reapply to the company.


    Finding out why you were rejected is incredibly difficult. Recruiters are unlikely
    to reveal the reason, though you might have slightly better luck if you instead
    ask where should focus your preparation. You can try to reflect on your performance
    yourself, but in my experience, candidates can rarely properly analyze their performance.
    You may think that you struggled on a question, but it''s all relative; did you
    struggle more or less than other candidates on the same question? Instead, just
    remember that candidates are typically rejected because of their coding and algorithm
    skills, and so you should focus your preparation there.'
