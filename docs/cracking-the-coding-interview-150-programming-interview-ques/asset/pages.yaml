  md: '# II. Behind the Scenes | The Microsoft Interview


    Microsoft wants smart people. People who are passionate about technology. You
    probably will not be tested on the ones of C++ APIs, but you will be expected
    to write code on the board.


    In a typical interview, you''ll show up at Microsoft at some time in the morning
    and fill out initial paper work. You''ll have a short interview with a recruiter
    who will give you a sample question. Your recruiter is usually to prep you, not
    to grill you on technical questions. If you get asked some basic technical questions,
    it may be because your recruiter wants to ease you into the interview so that
    you''re less nervous when the "real" interview starts.


    Be nice to your recruiter. Your recruiter can be your biggest advocate, even pushing
    to re-interview you if you stumbled on your first interview. They can fight for
    you to be hired—or not!


    During the day, you''ll do four or five interviews, often with two different teams.
    Unlike many companies, where you meet your interviewers in a conference room,
    you''ll meet with Microsoft interviewers in their office. This is a great time
    to look around and get a feel for the team culture.


    Depending on the team, interviewers may not share their feedback on you with the
    rest of the interview loop.


    When you complete your interviews with a team, you might speak with a hiring manager.
    If so, that''s a great sign! It likely means that you passed the interviews with
    a particular team. It is now down to the hiring manager''s decision.


    You might get a decision that day, or it might be a week. After one week of no
    word from HR, send a friendly email asking for a status update.


    If your recruiter isn''t very responsive, it''s because she''s busy, not because
    you''re being silently rejected.


    > Definitely Prepare:


    "Why do you want to work for Microsoft?"


    In this question, Microsoft wants to see that you''re passionate about technology.
    A great answer might be, "I''ve been using Microsoft software as long as I can
    remember, and I''m really impressed at how Microsoft manages to create a product
    that is universally excellent. For example, I''ve been using Visual Studio recently
    to learn programming, and its APIs are excellent." Note how this shows a passion
    for technology!


    What''s Unique:

    You''ll only reach the hiring manager if you''ve done well, so if you do it, that''s
    a great sign!'
