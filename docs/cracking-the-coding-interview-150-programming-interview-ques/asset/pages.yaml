  md: '# VII. The Offer and Beyond | Evaluating the Offer


    +   - If I do want to leave the company, it is situated near other companies I''m
    interested in, or will I need to move?


    The final point is extremely important and usually overlooked. If you''re working
    for Microsoft in Silicon Valley and wish to leave, you''ll get your choice of
    almost any other company. In Microsoft-Seattle, however, you''re limited to Amazon.
    Google and a handful of other smaller tech companies. If you go to AOL in Dulles,
    Virginia, your options are even more limited. You may find yourself forced to
    stay at a company simply because there''s nowhere else to go without uprooting
    your whole life.


    # Company Stability


    Everyone''s situation is a little bit different, but I typically encourage candidates
    not to focus too much on the stability of a company. If they let you go, you can
    find an offer from an equivalent company. The question for you to answer is: what
    will happen if you get laid off? Do you feel reasonably comfortable in your ability
    to find a new job?


    # The Happiness Factor


    Last but not least, you should course consider how happy you will be. Any of the
    following factors may impact that:


    +   - The Product: Many people look heavily at what product they are building,
    and of course this matters a bit bit. However, for engineers, there are more important
    factor, such such as who you work with.


    +   - Manager and Teammates: When people say that they love, or hate, their job,
    it''s often because of their teammates and their manager. Have you met them? Did
    you enjoy talking with them?


    +   - Company Culture: Culture is tied to everything from how decisions get made,
    to the social atmosphere, to how the company is organized. Ask your future teammates
    how they would describe the culture.


    +   - Hours: Ask future teammates about how long they typically work, and figure
    out if that meshes with your lifestyle. Remember, though, that hours before major
    dead-lines are typically much longer.


    Additionally, note that if you are given the opportunity to switch teams easily
    (like you are at Google), you''ll have an opportunity to find a team and product
    that matches you well.'
