    This algorithm is certainly much, much better than our first algorithm, but it''s
    still not perfect.


    To generate a new element A, we are searching through a linked list where each
    element looks like one:


    +   * 3 previous element

    * 5 previous element

    * 7 unnecessary work that we might be able to optimize out


    Where is imagine our list looks like


    Q_i = {7A_i, 5A_i, 7A_i, 3A_i, 5A_i, 7A_i, 5A_i}


    When we search this list for the min, we check if 7A_i < min, and then later we
    check 7A_i < min. That seems sort silly, doesn''t it? Since we know that A_i <
    A_j, we should only need to check 7A_i.


    If we separated the list from the constant factors, then we''d only need to check
    the first of the multiples of 3, 5 and 7. All subsequent elements would be bigger.


    That is, our list above would look like:


    ```

    Q36 = {3A_i}

    Q56 = {5A_i, 5A_i, 5A_i}

    Q76 = {7A_i, 7A_i, 7A_i, 7A_i}

    ```


    To get the min, we only need to look at the fronts of each queue:


    ```

    y = min(Q3.head(), Q5.head())

    ```


    When we compute y, we need to insert 3y into Q3, 5y into Q5 and 7y into Q7. But,
    we only want to insert these elements if they aren''t already in another list.


    Why might, for example, y already be somewhere in the holding queues? Well, if
    y was pulled from Q7, then that y=7x, for some smaller x. If 7x is the smallest
    value, we must have already seen 3x. And what do we do when we saw 3x? We inserted
    7 * 3x into Q7. Note that 7 * 3x = 3 * 7x.


    To put this another, if we pull an element from Q7, it will look like 7 * suffix,
    and we have already handled 3 * suffix and 5 * suffix. In handling 3 * suffix,
    we inserted 7 * 3 * suffix into a Q7. And in handling 5 * suffix, we inserted
    7 * 5 * suffix in Q7. The only value we''ve never seen is 7 * 7'
