  md: '# III. Special Situations | Start-Ups


    The application and interview process for start-ups is highly variable. We can''t
    go through every start-up, but we can offer some pointers. Understand, however,
    that the process at a specific start-up might deviate from it.


    # The Application Process


    Many start-ups might post job listings, but for the hottest start-ups, often the
    best way is through a personal referral. This referrer doesn''t necessarily need
    to be a close friend or a coworker. Just by reaching out and expressing your interest,
    you can get someone to pick up your resume to see if you''re a good fit.


    # Visas and Work Authorization


    Unfortunately, most smaller start-ups in the U.S. are not able to sponsor work
    visas. They hate the system as much as you do, but you won''t be able to convince
    them to hire you. If you require a visa and wish to work at a start-up, your best
    bet is to reach out to a professional recruiter who works with many start-ups
    or to focus your search on bigger start-ups.


    # Resume Selection Factors


    Start-ups are engineers who are not only smart and can code, but also people who
    would work well in an entrepreneurial environment. Your resume should ideally
    show initiative.


    Being able to "hit the ground running" is also very important; they want people
    who already know the language of the company.


    # The Interview Process


    In contrast to big companies, which tend to look mostly at your general aptitude
    with respect to software development, start-ups often look closely at your personality
    fit, skill set, and prior experience.


    +   * Personality Fit: Personality fit is typically assessed by how you interact
    with your interviewer. Establishing a friendly, engaging conversation with your
    interviewers is your ticket to many job offers.

    * Skill Set: Because start-ups need people who can hit the ground running, they
    are likely to assess your skills with specific programming languages. If you know
    a language that the start-up works with, make sure to brush up on the details.

    * Prior Experience: Start-ups are likely to ask you a lot of questions about your
    prior experience. Pay special attention to the Behavioral Questions section.


    In addition to the above areas, the coding and algorithms questions that you see
    in this book are also very common.'
