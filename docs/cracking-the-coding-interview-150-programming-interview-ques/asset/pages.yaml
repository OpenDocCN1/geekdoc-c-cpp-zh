    # SOLUTION


    The thing with minimums is that the stack doesn''t change very often. They change
    when a smaller element is added.


    One solution is to have a single int value, minValue, that''s a member of the
    Stack class. when minValue is popped from the stack, we search through the stack
    to find the new minimum. Unfortunately, this would break the constraint that push
    and pop operate in O(1)time.


    To understand this question, let''s walk through it with a short example:


    ```

    push(5); // stack is {5}, min is 5

    push(6); // stack is {6, 5}, min is 5

    push(3); // stack is {3, 6, 5}, min is 3

    push(7); // stack is {7, 3, 6, 5}, min is 3

    pop(); // pops 7. stack is {3, 6, 5}, min is 3

    pop(); // pops 3. stack is {6, 5}, min is 5.

    ```


    Observe how once the stack goes back to a prior state ({6}), the minimum also
    goes back to its prior state (5). This leads us to our second solution.


    If we kept track of the minimum at each state, we would be able to easily know
    the minimum. We can do this by having each node record what the minimum beneath
    itself is. Then, to find the min, you would look at what the top element thinks
    is the min.


    When you push an element onto the stack, the element is the current minimum. It
    sets its "local min" to be the best.


