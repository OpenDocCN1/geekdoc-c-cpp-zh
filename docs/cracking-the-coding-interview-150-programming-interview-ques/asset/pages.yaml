  md: '# Foreword


    Let''s get the introductions out of the way.


    I am not a recruiter. I am a software engineer. And as such, I know what it''s
    like to be asked to up brilliant algorithms on the spot, and then write flawless
    code on a whiteboard. I know because I''ve been asked to do the same thing—in
    interviews at Google, Microsoft, Apple, and Amazon, among other companies.


    I also know because I''ve been on the other side of the table, asking candidates
    to do this. I combed through stacks of resumes to find the engineers who I thought
    might be able to pass these interviews. And I debated in Google''s Hiring Committee
    whether or not a candidate did well to merit an offer. I understand and have experienced
    the full hiring cycle.


    And you, reader, are probably preparing for an interview, tomorrow, next week,
    or next year. You likely have or are working towards a Computer Science or related
    degree. I am not here to re-teach you basics of a binary search tree, or to traverse
    a linked list. You already know such things, and if not, there are plenty of resources
    to learn them.


    I am here to help you take your understanding of Computer Science fundamentals
    to the next level, to learn how to apply those fundamentals to crack the coding
    interview.


    The 5th edition of Cracking the Coding Interview updates the 4th edition with
    over 200 pages of additional questions, revised solutions, new chapter introductions,
    and other content. Be sure to check out our website, www.careercup.com, to connect
    with other candidates and discover new resources.


    I''m excited for you and the skills you are going to develop. Thorough preparation
    will give you a wide range of technical and communication skills. It will be well-worth
    it no matter where the effort takes you!


    I encourage you to read these introductory chapters carefully. They contain important
    insight that might just make the difference between a "hire" and a "no hire."


    And remember—interviews are hard! In my years of interviewing at Google, I saw
    some interviewers ask "easy" questions while others ask harder. But you know?
    Getting the easy questions doesn''t make it any easier to get the offer. Receiving
    an offer is not about solving questions flawlessly (very few candidates do!),
    but rather, it is about answering better than other candidates. Don''t stress
    out when you get a tricky question—everyone else probably thought it was hard
    too.


    Study hard, practice, and good luck!


    Gayle L. McDowell


    Founder / CEO, CareerCup.com

    Author of The Coding Resume and Cracking the Coding Interview'
