    That said, there are better and worse ways to prepare. Many candidates just read
    through problems and solutions. That''s like trying to learn calculus by reading
    a problem and its solution. You need to practice solving problems. Memorizing
    solutions won''t help you.


    How to Practice a Question (and any other problem you might encounter), do the
    following:


    +   1. Try to solve the problem on your own. I mean, really try to solve it. Many
    questions are designed to be tough—that''s ok! When you''re solving a problem,
    make sure to think about the space and time efficiency. Ask yourself if you could
    improve the time efficiency by reducing the space efficiency, or vice versa.


    +   2. Write the code for the algorithm on paper. You''ve been coding all life
    on a computer, and you''ve gotten used to the many nice things about it. But,
    in your interview, you won''t have the luxury of syntax highlighting, code completion,
    or compiling. Mimic this situation by coding on paper.


    +   3. Test your code—on paper. This means testing the general cases, base cases,
    error cases, and so on. You will need to do this during your interview, so it''s
    best to practice this in advance.


    +   4. Type your paper code as-is into a computer. You will probably make a bunch
    of mistakes. Start a list of all the errors you make so that you can keep these
    in mind in the real interview.


    In addition, mock interviews are extremely useful. CareerCup.com offers mock interviews
    with actual Microsoft, Google and Amazon employees, but you can also practice
    with friends. You and your friend can trade giving each other mock interviews.
    Though your friend may not be an expert interviewer, he or she may still be able
    to walk you through a coding or algorithm problem.


    What You Need To Know


    Most interviews won''t ask about specific algorithms for binary tree balancing
    or other complex algorithms. Frankly, being several years out of school, they
    probably don''t remember these algorithms either.


    You''re usually expected to know the basics. Here''s a list of the absolute, must-have
    knowledge:'
