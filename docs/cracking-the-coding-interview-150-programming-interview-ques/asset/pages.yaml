  md: '# Step 4: What are the stress/failure conditions?


    No product is fail-proof, so analyzing failure conditions needs to be part of
    your testing. A good discussion to have with your interviewer is about when it''s
    acceptable (even necessary) for the product to fail, and what failure should mean.


    For example, if you were testing a laundry machine, you might decide that the
    machine should be able to handle at least 30 shirts or pants. Loading 30-45 pieces
    of clothing may result in minor failure, such as the clothing being inadequately
    cleaned. At more than 45 pieces of clothing, extreme failure might be acceptable.
    However, extreme failure in this case should probably mean the machine never turning
    on the water. It should certainly not mean a flood or a fire.


    # Step 5: How would you perform the testing?


    In some cases, it might also be relevant to discuss the details of performing
    the testing. For example, if you need to make sure a chair can withstand normal
    usage for five years, you can''t accurately place it in a home and wait five years.
    You''d need to define what "normal" usage is (How many "sits" per year on the
    seat? What about the armrest?). Then, in addition to some manual testing, you
    would likely want a machine to automate some of the testing.


    # Testing a Piece of Software


    Testing a piece of software is actually very similar to testing a real world object.
    The major difference is that software testing generally places a greater emphasis
    on the details of performing testing.


    Note that software testing has two core aspects to it:


    +   * Manual vs. Automated Testing: In an ideal world, we would love to automate
    everything, but that''s rarely feasible. Some things are simply much better with
    manual testing because some features are too qualitative for a computer to effectively
    examine (as if content represents pornography). Additionally, whereas a computer
    can generally recognize only issues it''s been told to for, human observation
    may reveal new issues that haven''t been specifically examined. Both humans and
    computers form an essential part of the testing process.


    +   * Black Box Testing vs. White Box Testing: This distinction refers to the
    degree of access we have into the software. In black box testing, we''re just
    giving the software as-is and need to test it. With white box testing, we have
    additional programmatic access to test individual functions. We can also automate
    black box testing, although it''s certainly much harder.


    Let''s walk through an approach from start to end.


