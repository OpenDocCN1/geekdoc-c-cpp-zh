    \ we would have already checked with b.\n\nOf course, in reality, we all really\
    \ need to do is check if n is divisible by a prime number. This is where the Sieve\
    \ of Eratosthenes comes in.\n\n# Generating a List of Primes: The Sieve of Eratosthenes\n\
    \nThe Sieve of Eratosthenes is a highly efficient way to generate a list of primes.\
    \ It works by recognizing that all non-prime numbers are divisible by a prime\
    \ number.\n\nWe start with a list of all the numbers up through some value max.\
    \ First, we cross off all numbers divisible by 2. Then, we look for the next prime\
    \ (the next non-crossed number) and cross off all numbers divisible by it. By\
    \ crossing off all numbers divisible by 2, 3, 5, 7, 11, and so on, we wind up\
    \ with a list of prime numbers from 2 through max."
