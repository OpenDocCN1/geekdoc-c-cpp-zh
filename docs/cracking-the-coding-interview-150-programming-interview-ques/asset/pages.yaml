  md: '# V. Behavioral Questions | Behavioral Preparation


    Behavioral questions are asked for a variety of reasons. They can be asked to
    get to know your personality, to understand your resume more deeply, or just to
    ease you into an interview. Either way, these questions are important and can
    be prepared for.


    # How to Prepare


    Behavior questions are usually of the form "Tell me about a time when you..."
    and may require an example from a specific project or position. I recommend filling
    in the following "preparation grid" as shown below:


    | Common Questions | Project 1 | Project 2 | Project 3 | Project 4 |

    |---|---|---|---|---||

    | Most Challenging | | | | | |

    | What You Learned | | | | | |

    | Most Interesting | | | | | |

    | Hardest Bug | | | | | |

    | Enjoyed Most | | | | | |

    | Conflicts with Teammates | | | | | |


    Along the top, as columns, you should list all the major aspects of your resume,
    including each project, job, or activity. Along the side, as rows, you should
    list the common questions: what you enjoyed most, what you enjoyed least, what
    you considered most challenging, what you learned, what the hardest bug, and so
    on. Study this grid before your interview. In each cell, put the corresponding
    story.


    In your interview, when you''re asked about a project, you''ll be able to come
    up with an appropriate story effortlessly.


    I recommend reducing each story to a couple of keywords that you can write in
    each cell. This will make the grid easier to study and remember.


    If you''re doing a phone interview, you should have this grid out in front of
    you. When each story has a couple of keywords to trigger your memory, it will
    be much easier to give a fluent response than you''re trying to re-read a paragraph.
    It may also be useful to extend this grid to "softer" questions, such as conflicts
    on a team, failures, or times you had to persuade someone. Questions like these
    are very common outside of strictly software engineer roles, such as dev, PM or
    even testing role. If you are applying for one of these positions, I would recommend
    making a second grid covering these softer areas.


    When answering these questions, you''re not just trying to find a story that matches
    their question. You''re telling them about yourself. Think deeply about what each
    story communicates about you.'
