  md: '# Recursion and Dynamic Programming


    While there is a wide variety of recursive problems, many follow similar patterns.
    A good hint that a problem is recursive is that it can be built off of sub-problems.

    When you hear a problem beginning with the following statements, it''s often (though
    not always) a good candidate for recursion: "Design an algorithm to compute the
    nth...";Write code to list the first n...";Implement a method to compute all...";etc.\nPractice
    makes perfect! The more problems you do, the easier it will be to recognize recursive
    problems.


    # How to Approach


    Recursive solutions, by definition, are built off solutions to sub-problems. Many
    times, this will mean simply to compute f(n) by adding something, removing something,
    or otherwise changing the solution for f(n-1). In other cases, you might have
    to do something more complicated.


    You should consider both bottom-up and top-down recursive solutions. The Base
    Case and Build approach works quite well for recursive problems.


    # Bottom-Up Recursion


    Bottom-up recursion is often the most intuitive. We start with knowing how to
    solve the problem for a simple case, like a list with only one element, and figure
    out how to solve the problem for the two elements, then for three elements, and
    so on. The key is to think about how you can build the solution for one case off
    of the previous case.


    # Top-Down Recursion


    Top-Down Recursion can be more complex, but it is sometimes necessary for problems.
    In these problems, we think about how we can divide the problem for case N into
    sub-problems. Be careful of overlap between the cases.'
