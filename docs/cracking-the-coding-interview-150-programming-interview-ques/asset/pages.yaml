    \ 12 | | 8 | | 8 |\n| | 8 | | 12 | 3 | | 12 | 5 |\n| 10 | 3 | -> | 10 | | | 10\
    \ | |\n| 7 | 1 | -> | | 7 | | |\n\nNote that 8 and 12 are still in s1 -- and that's\
    \ okay! We repeat the same steps for those two numbers as we do for 5, each time\
    \ popping the top of s1 and putting into the \"right place\" on s2. (Of course,\
    \ 8 and 12 were moved from s2 to s1 precisely *because* they were larger than\
    \ 5, the \"right place\" for these elements will be on top of s5. We won't need\
    \ to muck around with s2's other elements, and the inside of the below loop will\
