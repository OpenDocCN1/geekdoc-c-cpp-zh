  md: '# 4


    # Trees and Graphs


    # Potential Issues to Watch Out For


    Trees and graphs questions are ripe for ambiguous details and incorrect assumptions.
    Be sure to watch out for the following issues and seek clarification when necessary.


    # Binary Tree vs. Binary Search Tree


    Given a binary tree question, many candidates assume that the interviewer means
    binary search tree. Be sure to ask whether or not the tree is a binary search
    tree. A binary search tree imposes the condition that, for all nodes, the left
    children are less than or equal to the current node, which is less than all the
    right nodes.


    # Balanced vs. Unbalanced


    While many trees are balanced, not all are. Ask your interviewer for clarification
    on this issue. If the tree is unbalanced, you should describe your algorithm in
    terms of both the average and the worst case time. Note that there are multiple
    ways to balance a tree, and balancing a tree implies only that the depth of subtrees
    will not vary by more than a certain amount. It does not mean that the left and
    right subtrees are exactly the same size.


    # Full and Complete


    Full and complete trees are trees in which all leaves are at the bottom of the
    tree, and all non-leaf nodes have exactly two children. Note that full and complete
    trees are extremely rare, as a tree must have exactly 2-1 nodes to meet this condition.'
