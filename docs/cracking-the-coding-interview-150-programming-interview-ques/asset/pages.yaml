  md: '# Chapter 7 | Mathematics and Probability


    between 1 and 5. The odds of doing both are 20%. So the odds are:


    ```

    P(x is even or x <=5)

    = P(x is even) + P(x <= 5) - P(x is even and x <= 5)

    = (1/2) + (1/2) - (1/5)

    = 4/5

    ```


    From here, getting the special case rules for independent events and for mutually
    exclusive is.


    # Independence


    If A and B are independent (that one tells you nothing about the other happening),
    then P(A and B) = P(A) P(B). This rule simply comes from recognizing that P(B
    given A) = P(B), since A indicates nothing about B.


    # Mutual Exclusivity


    If A and B are mutually exclusive (that is, if one happens, then the other cannot
    happen), then P(A or B) = P(A) + P(B). This is because P(A and B) = 0, so this
    term is removed from the earlier P(A or B) equation.


    Many people, strangely, mix up the concepts of independence and mutual exclusivity.
    They are entirely different. In fact, two events cannot be both independent and
    mutually exclusive (provided both have probabilities greater than 0). Why? Because
    exclusivity means that if one happens then the other cannot. Independence, however,
    says that one event happening means absolutely *nothing* about the other event.
    Thus, as long as two events have non-zero probabilities, they will never be both
    mutually exclusive and independent.


    If one or both events have a probability of zero (that is, it is impossible),
    then the events are both independent and mutually exclusive. This is provable
    through a simple application of the definitions (that is, the formulas) of independence
    and mutual exclusivity.


    # Things to Watch Out For


    +   1. Be careful with the difference in precision between floats and doubles.

    2. Don''t assume that a value (such as the slope of a line) is an int unless you''ve
    been told so.

    3. Unless otherwise specified, do not assume that events are independent (or mutually
    exclusive). You should be careful, therefore, of blindly multiplying or adding
    probabilities.'
