    - OUTER JOIN: An OUTER JOIN will always contain the results of INNER JOIN, but
    it may also contain some records that have no matching record in the other table.
    OUTER JOINS are divided into the following subtypes:

    - LEFT OUTER JOIN, or simply LEFT JOIN: The result will contain all records from
