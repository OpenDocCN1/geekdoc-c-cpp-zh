  md: "# Solutions to Chapter 13 | C and C++\n\n13.1 Write a method to print the last\
    \ K Lines of an input file using C++.\n\n# SOLUTION\n\nOne brute force would be\
    \ to count the number of lines (N) and then print from N-K to Nth line. But, this\
    \ requires two reads of the file, which is unnecessarily costly. We need a solution\
    \ which allows us to read just once and be able to print the last K lines.\n\n\
    We can allocate an array for all K lines and the last K lines we've read in the\
    \ array. So, initially, our array has lines 0 through K, then 1 through K+1, then\
    \ 2 through K+2, and so on. On each time that we read a new line, we purge the\
    \ oldest line from the array.\n\nBut, you might ask, wouldn't this require shifting\
    \ elements in the array, which is also very very expensive? No, if we do it correctly.\
    \ Instead of shifting the array each time, we will use a circular array.\n\nWith\
    \ a circular array, we always replace the oldest item when we read a new line.\
    \ The oldest item is tracked in a separate variable, which adjusts as we add new\
    \ items.\n\nThe following is an example of this algorithm:\n\n+   step 1 (initially):\
    \ array = {a, b, c, d, e, f}; p = 0\nstep 2 (insert g): array = {g, b, c, d, e,\
    \ f}; p = 1\nstep 3 (insert h): array = {g, h, c, d, e, f}; p = 2\nstep 4 (insert\
    \ i): array = {g, h, i, d, e, f}; p = 3\n\n```\nvoid printLastKLines(char* fileName)\
    \ {\n    const int K = 10;\n    ifstream file(fileName);\n    string L[K];\n \
    \   int size = 0;\n\n    /* read line by line into circular array */\n    while\
    \ (file.good()) {\n        getline(file, L[size % K]);\n        size++;\n    }\n\
    \n    /* compute start of circular array, and the size of it */\n    int start\
    \ = size > K ? (size % K) : 0;\n    int count = min(K, size);\n\n    /* print\
    \ elements in the order they were read */\n    for (int i = 0; i < count; i++)\
    \ {\n        cout << L[(start + i) % K] << endl;\n    }\n}\n```\n\nThis solution\
    \ will require reading the whole file, but only ten lines will be in memory"
