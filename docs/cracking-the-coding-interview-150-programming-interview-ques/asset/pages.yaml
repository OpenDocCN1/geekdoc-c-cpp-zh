    18.12 Given an NxN matrix of positive and negative integers, write code to find
    the submatrix with the largest possible sum.


    pg 168


    # SOLUTION


    This problem can be approached in a variety of ways. We''ll start with the brute
    force solution and then optimize the solution from there.


    # Brute Force Solution: O(N⁶)


    Like many "maximizing" problems, this problem has a straightforward brute force
    solution. This solution simply iterates through all possible submatrices, computes
    the sum, and finds the biggest.


    To iterate through all possible submatrices (with no duplicates), we simply need
    to iterate through all ordered pairs of rows, and then all ordered pairs of columns.


    This solution is O(N⁶), since we iterate through O(N²) submatrices and it takes
    O(N²) time to compute the area of each.


    # Dynamic Programming Solution: O(N⁴)


    Notice that the earlier solution is made slower by a factor of O(N²) simply because
    computing the sum of a matrix is so slow. We can reduce the time to compute the
    area? Yes! In fact, we can reduce the time of computeSum to O(1).


