  md: '# Solutions to Chapter 13 | C and C++


    unexpectedly, the compiler will therefore reload the value each time from memory.


    A volatile integer can be declared by either of the following statements:


    ```

    int volatile x;

    volatile int x;

    ```


    To declare a pointer to a volatile integer, we do the following:


    ```

    volatile int *;

    volatile int * x;

    ```


    A volatile pointer to non-volatile data is rare, but can be done.


    ```

    *volatile x;

    ```


    If you wanted to declare a volatile variable pointer for volatile memory (both
    pointer address and memory contained are volatile), you would do the following:


    ```

    int volatile * volatile x;

    ```


    Volatile variables are not optimized, which can be very useful. Imagine this function:


    ```

    1 int opt = 1;

    2 void Fn(void) {

    3 start;

    4 if (opt == 1) goto start;

    5 else break;

    6 }

    ```


    At first glance, the code appears to loop infinitely. The compiler may try to
    optimize it to:


    ```

    1 void Fn(void) {

    2 start;

    3 int opt = 1;

    4 if (true)

    5 goto start;

    6 }

    ```


    This becomes an infinite loop. However, an external operation might write ''0''
    to the location of variable opt, thus, breaking the loop.


    To prevent the compiler from performing such optimization, we want to signal that
    another element of the system could change the variable. We do this using the
    volatile keyword, as shown below.


    ```

    1 volatile int opt = 1;

    2 void Fn(void) {

    3 start;

    4 if (opt == 1) goto start;

    5 else break;

    6 }

    ```


    Volatile variables are also useful when multi-threaded programs have global variables
    and any thread can modify these shared variables. We may not want optimization
    on these variables.'
