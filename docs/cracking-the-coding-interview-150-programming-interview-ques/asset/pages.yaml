    # Hash Tables


    A hash table is a data structure that maps keys to values for highly efficient
    lookup. In a very simple implementation of a hash table, the hash table has an
    underlying array and a hash function. When you want to insert an object and its
    key, the hash function maps the key to an integer, which indicates the index in
    the array. The object is stored at index.


    Instead of making an extremely large array and storing objects at index hash (key),
    we can make the array much smaller and store objects in a linked list at index
    hash (key %) array_length. To get the object with a particular key, we must search
    the linked list for this key.


    Alternatively, we can implement the hash table with a binary search tree. We can
    then guarantee an O(log n) lookup time, since we can keep the tree balanced. Additionally,
    we may use less space, since a large array no longer needs to be allocated in
    the beginning.


    Prior to your interview, we recommend you practice both implementing and using
    hash tables. They are one of the most common data structures for interviews, and
