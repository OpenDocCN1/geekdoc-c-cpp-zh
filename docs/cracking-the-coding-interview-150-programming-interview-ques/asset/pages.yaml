    In the above stack, each call will check if the list is a palindrome by comparing
    its head node with the corresponding node from back of the list. That is:


    +   - Line 1 needs to compare node 0f with node 0b

    - Line 2 needs to compare node 1f with node 1b

    - Line 3 needs to compare node 2f with node 2b

    - Line 4 needs to compare node 3f with node 3b.


    If we rewind the stack, passing nodes back as described below, we can just that:

    - Line 4 sees that it is the middle node (since length = 1), and passes back head.
    the head value equals node 3, so head.next is 2b.

    - Line 3 compares its head (node 2f), to returned_node(the value from the previous
    recursive call), which is node 2b. If the values match, it passes a reference
    to node 1b (returned_node.next) up line 2.

    - Line 2 compares its head (node 1f) to returned_node(node 1b). If the values
    match, it passes a reference to node 0b (or, returned_node.next) up line 1.

    - Line 1 compares its head (node 0f), to returned_node, which is node 0b. If the
    values match, it returns true.


    To generalize, each call compares to returned_node, and then passes returned_node.next
    up the stack. In this way, every node i gets compared to node n - i. If at any
    point the values do not match, we return false, and every call the stack checks
    for that value.


