  md: '# VII. The Offer and Beyond | On the Job


    Navigating your career path doesn''t end at the interview. In fact, it''s just
    getting started. Once you actually join a company, you need to start thinking
    about your career path. Where will you go from here, and how will you get there?


    # Set a Timeline


    It''s a common story: you join a company, and you''re psyched. Everything is great.
    Five years later, you''re still there. And it''s then that you realize these last
    three years didn''t add much to your skill set or to your resume. Why didn''t
    you leave after two years?


    When you''re enjoying your job, it''s very easy to get wrapped up in it and not
    realize that your career is not advancing. This is why you should outline your
    career path before starting a new job. Where do you want to be in ten years? And
    what are the steps necessary to get there? In addition, each year, think about
    what the next year of experience will bring you and how your career or skill set
    advanced in the last year.


    By outlining your path in advance and checking in on it regularly, you can avoid
    falling into this complacency trap.


    # Build Strong Relationships


    When you move to something new, your network will be critical. After all, applying
    online is tricky; a personal referral is much better, and your ability to do so
    hinges on your network.


    At work, establish strong relationships with your manager and teammates. When
    employees leave, keep in touch with them. Just a friendly note a few weeks after
    their depart will help bridge that connection from a work acquaintance to a personal
    acquaintance.


    This same approach applies to your personal life. Your friends, and your friends
    of friends, are valuable connections. Be open to helping others, and they''ll
    be more likely to help you.


    # Ask for What You Want


    While some managers may really try to grow your career, others will take a more
    hands-off approach. It''s up to you to pursue the challenges that are right for
    your career.


    Be (reasonably) frank about your goals with your manager. If you want to take
    on more back-end coding projects, say so. If you''d like to explore more leadership
    opportunities, discuss how you might be able to do so.


    You need to be your best advocate, so that you can achieve goals according to
    your timeline.'
