  md: '# III. Special Situations | Testers and SDETs


    SDETs are in a tough spot. Not only do they have to be great coders, but they
    must also be great testers.


    We recommend the following preparation process:


    +   - Prepare the Coding Questions: For example, how would you test a light bulb?
    A pen? A cash register? Microsoft Word? The Testing chapter will give you more
    background on these problems.

    - Practice the Coding Questions: The number one thing that SDETs get rejected
    for is coding skills. Although coding standards are typically lower for an SDET
    than for an SDE, SDETs are still expected to be very strong in coding and algorithms.
    Make sure you practice solving all the coding and algorithm questions that a regular
    developer would get.

    - Practice Testing the Coding Questions: A very popular format for SDET questions
    is "Write code to X," followed up by "OK, now test it." Even when the question
    doesn''t specifically require this, you should ask yourself, "How would I test
    this? Remember: any problem can be an SDET problem!


    Strong communication skills can also be very important for testers, since your
    job requires you to work with so many different people. Do not neglect the Behavioral
    Questions section.


    # Career Advice


    Finally, a word of career advice: if, like many candidates, you are hoping to
    apply to an SDET position as the "easy" way into a company, be aware that many
    candidates find it very difficult to move from an SDET position to a dev position.
    Make sure to keep your coding and algorithms skills very sharp if you hope to
    make this move, and try to switch within one to two years. Otherwise, you might
    find it very difficult to be taken seriously in a dev interview.


    Never let your coding skills atrophy.'
