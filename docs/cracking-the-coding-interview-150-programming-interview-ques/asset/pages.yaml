  md: "# Solutions to Chapter 9 | Recursion and Dynamic Programming\n\n9.2 Imagine\
    \ a robot sitting on the upper left corner of an X by Y grid. The robot can only\
    \ move in two directions: right and down. How many possible paths are there for\
    \ the robot to go from (θ, 0) to (X, Y)?\n\nFOLLOW UP\nImagine certain spots are\
    \ \"off limits,\" such that the robot cannot step on them. Design an algorithm\
    \ to find a path for the robot from the top left to the bottom right.\n\npg 109\n\
    \n# SOLUTION\n\nWe need to count the number of ways of making a path with X right\
    \ steps and Y down steps. This path will have X+Y steps total.\n\nTo build a path,\
    \ we are essentially selecting X times to move right out of a total of X+Y moves.\
    \ Thus, the number of total paths must be the number of ways of selecting X items\
    \ out of X+Y items. This is given by the binomial expression (a.k.a., \"choose\
    \ r\"),\n\n```\n$$$\binom{n}{r} = \\frac{n!}{(n-r)!}$$\n```\n\nIn terms of this\
    \ problem, the expression is:\n\n```\n$$$\binom{X+Y}{X} = \\frac{(X+Y)!}{X!Y!}$$\n\
    ```\n\nIf you didn't know the binomial expression, you could still deduce how\
    \ to solve this problem.\n\nThink about each path as a string of length X+Y consisting\
    \ X ‘R’s and Y ‘D’s. We know the number of strings we can make with X+Y unique\
    \ characters is (X+Y)!. However, in this case, X of the characters are ‘R’s and\
    \ Y are ‘D’s. Since the ‘R’s can be rearranged in X! ways, each of which is identical,\
    \ and we can do an equivalent thing with we divide out by X! and Y!. We then get\
    \ the same expression as we had before:\n\n```\n$$$\frac{(X+Y)!}{X!Y!}$$\n```\n\
    \n# Follow Up: Find a path (with off limits spots)\n\nIf we pick our grid, the\
    \ only way to move to (X,Y) is by moving to one of the adjacent spots: (X-1, Y)\
    \ or (X, Y-1). So, we need to find a path to either (X-1, Y) or (X, Y-1).\n\n\
