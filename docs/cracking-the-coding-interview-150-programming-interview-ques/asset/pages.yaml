    The algorithm works as follows. When a new value arrives, it is placed in the
    maxHeap if the value is less than or equal to the median, otherwise it is placed
    in the minHeap. The heap sizes can be equal, or the maxHeap may have one extra
    element. This constraint can easily be restored by shifting an element from one
