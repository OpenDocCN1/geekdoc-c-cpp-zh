    # 18.6 Describe an algorithm to find the smallest one million numbers in one billion
    numbers. Assume that the computer memory can hold all one billion numbers.


    pg 167


    # SOLUTION


    There are a number of ways to approach this problem. We will go through three
    of them: sorting, max heap, and selection rank.


    # Solution 1: Sorting


    We can sort the elements in ascending order and then take the first million numbers
    from that. The time complexity is O(n log(n)).


    # Solution 2: Max Heap


    We can use a max heap to solve this problem. We first create a max heap (largest
    element at the top) for the first million numbers.


    Then, we traverse the list. On each element, if it''s smaller than the root, insert
    it into the list and delete the largest element (which will be the root).


    At the end of the traversal, we will have a heap containing the smallest one million
    numbers. This algorithm is O(n log(m)), where m is the number of values we are
    looking for.


    # Approach 3: Selection Rank Algorithm (if you can modify the original array)


    Selection Rank is a well-known algorithm in computer science to find the ith smallest
    (or largest) element in an linear time.


    If the elements are unique, you can find the ith smallest element in expected
    O(n)


