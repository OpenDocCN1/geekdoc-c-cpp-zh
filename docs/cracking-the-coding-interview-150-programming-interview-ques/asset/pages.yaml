    12.1 Find the mistake(s) in the following code:


    ```

    unsigned int i;

    for (i = 100; i >= 0; --i)

    printf("%d\n", i);

    ```


    # SOLUTION


    There are two mistakes in this code.


    First, note that an unsigned int is, by definition, always greater than or equal
    to zero. The loop condition will therefore always be true, and it will loop infinitely.


    The correct code to print all numbers from 100 to 1, i > 0. If we truly wanted
    to print zero, we could add an additional printf statement after the loop.


    ```

    unsigned int i;

    for (i = 100; i > 0; --i)

    printf("%d\n", i);

    ```


    One additional correction is to use %u instead of %d, as we are printing unsigned
    int.


    ```

    unsigned int i;

    for (i = 100; i > 0; --i)

    printf("%u\n", i);

    ```


    This code will now print the list of all numbers from 100 to 1, in descending
    order.


