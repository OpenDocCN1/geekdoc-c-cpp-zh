    ![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_384_0.png)


    Suppose we want to find the rank of 24 in the tree above. We compare 24 with the
    root, 20, and find that 24 must reside on the right. The root has 4 nodes in its
    left subtree, and when we include the root itself, this gives us five total nodes
    smaller than 24. We set counter to 5.


    Then, we compare 24 with node 25 and find that 24 must be on the left. The value
    of counter does not update, since we''re not "passing over" any smaller nodes.
    The value of counter is still 5.


    Next, we compare 24 with node 23, and find that 24 must be on the right. Counter
    gets incremented by just 1 (to 6), since 23 has no left nodes.


    Finally we find 24 and we return counter: 6.


    Recursively, the algorithm is the following:


    ```

    1 int getRank(Node node, int x) {

    2   if x is node.data

    3     return node.leftSize()

    4   if x is on left of node

    5     return getRank(node.left, x)

    6   if x is on right of node

    7     return node.leftSize() + 1 + getRank(node.right, x)

    8 }

    ```


