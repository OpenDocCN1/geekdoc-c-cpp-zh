    # Pointers and References


    A pointer holds the address of a variable and can be used to perform any operation
    that could be done directly on the variable, such as accessing and modifying it.


    Two pointers can equal each other, such that changing one''s value also changes
    the other''s value (since they, in fact, point to the same address).


    ```

    1 int *p = new int;

    2 *p = 7;

    3 int *q = p;

    4 *p = 8;

    5 cout << *q; // prints 8

    ```


    Note that the size of a pointer varies depending on the architecture: 32 bits
    on a 32-bit machine and 64 bits on a 64-bit machine. Pay attention to this difference,
    as it''s common for interviewers to ask exactly how much space a data structure
    takes up.


    # References


    A reference is another name (an alias) for a pre-existing object and it does not
    have memory of its own. For example:


    ```

    1 int a = 5;

