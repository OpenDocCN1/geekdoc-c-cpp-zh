  md: '# Chapter 4 | Trees and Graphs


    # Binary Tree Traversal


    Prior to your interview, you should be comfortable implementing in-order, post-order,
    and pre-order traversal. The most common of these, in-order traversal, works by
    visiting the left side, then the current node, and then the right.


    # Tree Balancing: Red-Black Trees and AVL Trees


    Though learning how to implement a balanced tree may make you a better software
    engineer, it''s very rarely asked during an interview. You should be familiar
    with the runtime of operations on balanced trees, and vaguely familiar with how
    you might balance a tree. The details, however, are probably unnecessary for the
    purposes of an interview.


    # Tries


    A trie is a variant of an n-ary tree in which characters are stored at each node.
    Each path down the tree may represent a word. A simple trie might look something
    like:


    ![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_93_0.png)


    # Graph Traversal


    While most candidates are reasonably comfortable with binary tree traversal, graph
    traversal can prove more challenging. Breadth First Search is especially difficult.


    Note that Breadth First Search (BFS) and Depth First Search (DFS) are usually
    used in different scenarios. DFS is typically the easiest we want to visit every
    node in the graph, or at least visit every node until we find whatever we''re
    looking for. However, if we have a very large tree and want to be prepared to
    quit when we get too far from the original node, DFS can be problematic; we might
    search thousands of ancestors of the node, but never even search all of the node''s
    children. In these cases, BFS is typically preferred.


    # Depth First Search (DFS)


    In DFS, we visit a node r and then iterate through each of r''s adjacent nodes.
    When visiting a node n that is adjacent to r, we visit all of n''s adjacent nodes
    before going'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Chapter 4 | Trees and Graphs


    on to r''s other adjacent nodes. That is, n is exhaustively searched before r
    moves on to its other children.


    Note that pre-order and other forms of tree traversal are a form of DFS. The key
    difference is that when implementing this algorithm for a graph, we must check
    if the node has been visited. If we don''t, we risk getting stuck in infinite
    loop.


    The pseudocode below implements DFS.


    ```

    1 void search(Node root) {

    2 if (root == null) return;

    3 visit(root);

    4 root.visited = true;

    5 foreach (Node n in root.adjacent) {

    6 if (n.visited == false) {

    7 search(n);

    8 }

    9 }

    10 }

    ```


    Breadth First Search (BFS)


    BFS is considerably less intuitive, and many interviewees struggle with it unless
    they are already familiar with the implementation.


    In BFS, we visit each of a node r''s adjacent nodes before searching any of r''s
    "grandchildren". An iterative solution involving a queue usually works best.


    ```

    1 void search(Node root) {

    2 Queue queue = new Queue();

    3 root.visited = true;

    4 visit(root);

    5 queue.enqueue(root); // Add to end of queue


    7 while (queue.IsEmpty()) {

    8 Node r = queue.dequeue(); // Remove from front of queue

    9 foreach (Node n in r.adjacent) {

    10 if (n.visited == false) {

    11 visit(n);

    12 n.visited = true;

    13 queue.enqueue(n);

    14 }

    15 }

    16 }

    17 }

    ```


    If you are asked to implement BFS, the key to remember is the use of the queue.
    The rest of the algorithm flows from this fact.'
