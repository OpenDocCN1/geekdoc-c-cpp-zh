    \ the simple, expected case.\n\n# Error Checking\n\nOne sign of a careful coder\
    \ is that she doesn't make assumptions about the input. Instead, she validates\
    \ that the input is what it should be, either through ASSERT statements or if-statements.\n\
    \nFor example, recall the earlier code to convert a number to a base i (e.g.,\
    \ base 2 or base 16) to represent it.\n\n```\npublic int convertToBase(String\
    \ number, int base) {\n    if (base < 2 || (base > 10 && base == 16)) return -1;\n\
    \    int value = 0;\n    for (int i = number.length() - 1; i >= 0; i--) {\n  \
    \      int digit = digitToValue(number.charAt(i));\n        if (digit < 0 || digit\
    \ >= base) {\n            return -1;\n        }\n        int exp = number.length()\
    \ - 1 - i;\n        value += digit * Math.pow(base, exp);\n    }\n    return value;\n\
    ```\n\nIn line 2, we check to see that base is valid (we assume bases greater\
    \ than 10, other than base 16, have no standard representation in string form).\
    \ In line 6, we do another error check: making sure that each digit falls within\
    \ the allowable range well.\n\nChecks like these are critical in production code\
    \ and, therefore, in interview code as well.\nOf course, writing these error checks\
    \ can be tedious and can waste precious time in an interview. The important thing\
    \ is to point out that you would write the checks. If the error checks are much\
    \ more than a quick if-statement, it may be best to leave some space where the\
    \ error checks would go and indicate to your interviewer that you will fill in\
    \ them when you are finished with the rest of the code."
