  md: "# Solutions to Chapter 9 | Recursion and Dynamic Programming\n\nFirst, let's\
    \ visualize how this method works. When we call paintFill (i.e., \"click\" paint\
    \ fill in the image editing application) on, say a green pixel, we want to \"\
    bleed\"outwards. Pixel by pixel, we expand outwards by calling paintFill on the\
    \ surrounding pixel. When we hit a pixel that is not green, we stop.\n\nWe can\
    \ implement this algorithm recursively:\n\n```\nenum Color {\n  Black, White,\
    \ Red, Yellow, Green\n}\n\nboolean paintFill(Color[][] screen, int x, int y, Color\
    \ ocolor) {\n  if (x < 0 || x >= screen[0].length ||\n      y < 0 || y >= screen.length)\
    \ {\n    return false;\n  }\n  if (screen[y][x] == ocolor) {\n    screen[y][x]\
    \ = ncolor;\n    paintFill(screen, x - 1, y, ocolor, ncolor); // left\n    paintFill(screen,\
    \ x + 1, y, ocolor, ncolor); // right\n    paintFill(screen, x, y - 1, ocolor,\
    \ ncolor); // top\n    paintFill(screen, x, y + 1, ocolor, ncolor); // bottom\n\
    \  }\n  return true;\n}\n```\n\nNote the ordering of the x and y in screen[y][x],\
    \ and remember when you hit this graphical problem. Because x represents the horizontal\
    \ axis (that is, it's left to right), it actually corresponds to the number of\
    \ column, not the number of rows. The value of y equals the number of rows. This\
    \ is a very easy place to make a mistake in an interview, as well as in your daily\
    \ coding.\n\nDoes this algorithm seem familiar? It should! This is essentially\
    \ depth-first search on a graph. At each pixel, we search outwards to each surrounding\
    \ pixel.\n\nThe drawback of the recursive approach is that it will overflow relatively\
    \ quickly. Each pixel branches out to four other pixels. This means that we have\
    \ potentially 1,000,000 functions on the call stack after going just 10 pixels\
    \ away.\n\nTo get around this issue, we can implement a modification of breadth-first\
    \ search."
