    +   - Heap? A heap is really good at basic ordering and keeping track of max and
    mins. This is actually interesting—if you had two heaps, you could keep track
    of the bigger half and the smaller half of the elements. The bigger half is kept
    in a min heap, such that the smallest element in the bigger half is at the root.
    The smaller half is kept in a max heap, such that the biggest element of the smaller
    half is at the root. Now, with these data structures, you have the potential median
    elements at the roots. If the heaps are no longer the same size, you can quickly
    "rebalance" the heaps by popping an element off the one heap and pushing it onto
    the other.


    Note that the more problems you do, the more developed your instinct on which
    data structure to apply will be. You will also develop a more finely tuned instinct
    as to which of these approaches is the most useful.'
