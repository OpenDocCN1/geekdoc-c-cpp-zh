    # Dividing Up Lots of Data


    Though we can sometimes increase hard drive space in a computer, there comes a
    point where data simply must be divided across machines. The question, then, is
    what data belongs on which machine? There are few strategies for this:


    +   - By Order of Appearance:

    We could simply divide data by order of appearance. That is, as new data comes
    in, we wait for our current machine to fill up before adding an additional machine.
    This has the advantage of never using more machines than are necessary. However,
    depending on the problem and our data, lookup table may be more complex and potentially
    very large.


    +   - By Hash Value:

    An alternative approach is to store the data on the machine corresponding to the
    hash value of the data. More specifically, we do the following: (1) pick some
    sort of key relating to the data, (2) hash the key, (3) mod the hash value by
    the number of machines, and (4) store the data on the machine with that value.
    That is, the data is stored on machine #[(mod(hash(key), N)].


    The nice thing about this is that there''s no need for a lookup table. Every machine'
