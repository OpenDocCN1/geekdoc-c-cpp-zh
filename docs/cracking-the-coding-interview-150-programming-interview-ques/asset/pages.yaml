  md: '# Chapter 6 | Brain Teasers


    We can also time two hours, by lighting one rope, waiting until it is burnt, and
    then lighting the second. We can generalize this into a rule.


    Rule 1: Given a rope that takes x minutes to burn and another that takes y minutes,
    we can time x+y minutes.


    What else can we do with the rope? We can probably assume that lighting a rope
    in the middle (or anywhere than the ends) wouldn''t do us much good. The flames
    would expand in both directions, and we have no idea how long it would take to
    burn.


    However, we can light a rope at both ends. The two flames would meet after 30
    minutes.


    Rule 2: Given a rope that takes x minutes to burn, we can time x/2 minutes.


    Now we know that we can time 30 minutes using a single rope. This also means that
    we can remove 30 minutes of burning time from the second rope, by lighting rope
    1 on both ends and rope 2 on just one end.


    Rule 3: If rope 1 takes x minutes to burn and rope 2 takes y minutes, we can turn
    rope 2 into a rope that takes (x-y) minutes or (y-x)/2 minutes.


    Now, let''s pick all of these together. We can turn rope 2 into a rope with 30
    minutes of burn. If we light rope 2 on the other end (see rule 2), rope 2 will
    be done after 15 minutes.


    From start to end, our approach is as follows:


    +   1. Light rope 1 at both ends and rope 2 at one end.


    +   2. When the two flames on Rope 1 meet, 30 minutes will have passed. Rope 2
    has 30 minutes left of burn-time.


    +   3. At that point, light Rope 2 at the other end.


    +   4. In exactly fifteen minutes, Rope 2 will be completely burnt.


    How solving this problem is made easier by listing out what you''ve learned and
    “rules” you''ve discovered.


    # Case Shifting


    Many brain teasers are worst-case minimization problems, worded either in terms
    of minimizing an action or doing something at most a specific number of times.
    A useful technique is to try to “balance” the worst case. That is, if an early
    decision results in a skewing of the worst case, we can sometimes change the decision
    to balance out the worst case. This will be clearest when explained with an example.


    The “nine balls” question is a classic interview question. You have nine balls.
    Eight are of the same weight, and one is heavier. You are given a balance which
    tells you whether the left side or the right side is heavier. Find the heavy ball
    in just two uses of the scale.'
