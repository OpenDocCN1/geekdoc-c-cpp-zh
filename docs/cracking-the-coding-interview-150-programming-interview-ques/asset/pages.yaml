    3. Play a white piece at (row 4, column 3). This flips the piece at (row 4, column
    4) from black to white.


    This sequence of moves leads to the board below.


    ![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_314_0.png)


    The core objects in Othello are probably the game, the board, the pieces (black
    or white), and the players. How do we represent these with elegant object-oriented
    design?


    # Should BlackPiece and WhitePiece be classes?


    At first, we might think we want to have a BlackPiece class and a WhitePiece class,
    which inherit from an abstract Piece. However, this is probably not a great idea.
    Each piece may flip back and forth between colors frequently, so destroying and
    creating what is really the same object is probably not wise. It may be better
    to just have a Piece class, with a flag in it representing the current color.


    # Do we need separate Board and Game classes?


