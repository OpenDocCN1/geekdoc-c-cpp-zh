  md: '# Solutions to Chapter 10 | Scalability and Memory Limits


    content or its URL?


    If it''s based on its URL, we must recognize that URL parameters might indicate
    a completely different page. For example the www.careerc.com/page?id=microsoft-interview-questions
    is totally different from the page www.careerc.com/page?id=google-interview-questions.
    But, we can also append URL parameters arbitrarily to any URL without truly changing
    the page, provided it''s not a parameter that the web application recognizes and
    handles. It is the same as www.careerc.com.


    Okay," you might say, "let''s define it on its content." That sounds good too,
    at first, but it doesn''t quite work. Suppose I have randomly generated content
    on the careerc.com home page. Is it a different page each time you visit it? Not.

    The reality is that there is probably no perfect way to define a "different" page,
    and this is where this problem gets tricky.


    One way to tackle this is to have some sort of estimation for degree of similarity.
    If, based on the content and the URL, a page is deemed to be sufficiently similar
    to other pages, we deprioritize crawling its children. For each page, we would
    come up with some sort of signature based on snippets of the content and the page''s
    URL.


    Let''s see how this would work.


    We have a database that stores a list of items we need to crawl. On each iteration,
    we select the highest priority page to crawl. We then do the following:


    +   1. Open the page and create a signature of the page based on specific subsections
    of the page and its URL.

    2. Query the database to see whether anything with this signature has been crawled
    recently.

    3. If something with this signature has been recently crawled, insert this page
    back into the database at a low priority.

    4. If not, crawl the page and insert its links into the database.


    Under the above implementation, we never "complete" crawling the web, but we will
    avoid getting stuck in a loop of pages. If we want to allow for the possibility
    of "finishing" crawling the web (which would clearly happen only if the "web"
    were actually a smaller system, like an intranet), then we can set a minimum priority
    that a page must have to be crawled.

    This is just one, simplistic solution, and there are many others that are equally
    valid. A problem like this will more likely resemble a conversation with your
    interviewer which could take any number of paths. In fact, the discussion of this
    problem could have taken the path of the very next problem.'
