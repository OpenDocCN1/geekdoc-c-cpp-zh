  md: '# II. Behind the Scenes | The Amazon Interview


    Amazon''s recruiting process typically begins with two screens in which candidate
    interviews with a specific team. A small portion of the time, a candidate may
    have three or more interviews, which can indicate either that one of the interviewers
    wasnt convinced or they are being considered for a different team or profile.
    In more unusual cases, such as when a candidate is local or has recently interviewed
    for a different position, a candidate may only do one phone screen.


    The engineer who interviews you will usually ask you to write simple code via
    a shared document editor, as with CollabEdit. They will also offer a broad set
    of questions to explore what areas of technology you''re familiar with.


    Next, you fly to Seattle for four or five interviews with one or two teams that
    have selected you by your resume and phone interviews. You will have to code on
    a whiteboard, and some interview will stress other skills. Interviewers are each
    assigned a specific area to probe and may very different from each other. They
    cannot see the other feedback until they have submitted their own, and are discouraged
    from discussing it until the hiring meeting.


    The "bar raiser" is interviewed with keeping the interview bar high. They attend
    special training and will interview candidates outside their group in order to
    balance the group itself. If one interview seems significantly harder than the
    bar raiser, that most likely the bar raiser experience with interviews and veto
    power in the hiring decision. Remember, though: just because you seem to be struggling
    more in this interview doesn''t mean you are actually doing worse. Your performance
    is judged relative to other candidates; it is not evaluated on a simple "percent
    correct" basis.


    # Definitely Prepare:


    Amazon is a web-based company, and means they care about scale. Make sure you
    prepare for scalability questions. You don''t need a background in distributed
    systems to answer these questions. See our recommendations in the Scalability
    and Memory Limits chapter.


    Additionally, Amazon tends to ask a lot of questions about oriented design. Check
    out the Object-Oriented Design chapter for sample questions and suggestions.


    Once your interviews have entered their feedback, they will meet to discuss it.
    They will be the people making the hiring decision.


    While Amazon''s recruiters are usually excellent at following up with candidates,
    occasionally there are delays. If you haven''t heard from Amazon within a week,
    we recommend a friendly email.


    # What''s Unique:


    The Bar Raiser is brought in from a different team to keep the bar high. You need
    to impress both this person and the hiring manager.'
