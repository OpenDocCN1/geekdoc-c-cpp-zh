  md: '# 10


    # Scalability and Memory Limits


    Despite how intimidating they seem, scalability questions can be among the easiest
    questions. There are no “gotchas,” no tricks, and no fancy algorithms—at least
    not usually. You don''t need any courses in distributed systems, nor do you need
    experience in system design. With a bit of practice, any thorough and intelligent
    software engineer can handle these questions with ease.


    # The Step-By-Step Approach


    Interviewers are not trying to test your knowledge of system design; in fact interviewers
    rarely try to test knowledge of anything but the most basic Computer Science concepts.
    Instead, you are evaluating your ability to break down a tricky problem and solve
    problems using what you know. The following approach works well for many system
