  md: '# VI. Technical Questions | Five Algorithm Approaches


    There''s no sufire approach to solving a tricky algorithm problem, but the approaches
    below will be useful. Keep in mind that the more problems you practice, the easier
    it will to identify which approach to use.


    The five approaches below can be "mixed and matched." That is, if you have applied
    "Simplify & Generalize," you may want to try "Pattern Matching" next.


    # Approach I: Exemplify


    Example: Given a time, calculate the angle between the hour and minute hands.


    For the below solution, we''ll assume that h is the hour and m is the minute.
    We''ll also assume that the hour is specified as an integer between 0 and 23,


    By playing around these examples, we can develop a rule:


    +   - Angle between the minute hand and 12 o''clock: 360 * m / 60


    +   - Angle between the hour and minute and 12 o''clock: 360 * (h * 12) / 12 +
    360 * (m / 60) * (1 / 12)


    +   - Angle between hour and minute: (hour angle - 5.5m) % 360


    By simple arithmetic, this reduces to (30h - 5.5m) % 360.


