    Let arraySize represent the number of blocks in the first pass. Note that arraySize
    = 2^{31}/rangeSize, since there are 2^{23} non-negative integers.


    We need to select a value for rangeSize such that the memory from the first pass
    (the array) and the second pass (the bit vector) fit.


    First Pass: The Array


    The array in the first pass can fit in 10 megabytes, or roughly 2^{23} bytes,
    of memory. Since each element in the array is an int, and it is 4 bytes, we can
    hold an array of at most 2^{21} elements. So, we can deduce the following:


    ```

    arraySize = 2^{31}/rangeSize <= 2^{21}

    rangeSize >= 2^{31}/2^{21}

    rangeSize >= 2^{10}

    ```


    Second Pass: The Bit Vector


    We need to have enough space to store arraySize bits. Since we can fit 2^{23}
    bytes in memory, we can fit 2^{26} bits in memory. Therefore, we can conclude
    the following:


    ```

    2^{10} <= rangeSize <= 2^{26}

    ```


    These conditions give us a good amount of "wiggle room," but the nearer to the
    middle we pick, the less memory will be used at any given time.


