  md: '# III. Special Situations | Program and Product Managers


    These "PM" roles vary wildly across companies and even within a company. At Microsoft,
    for instance, some PMs may be essentially customer evangelists, working in a customer-facing
    role that borders on marketing. Across campus, other PMs spend much of their day
    coding. The latter type of PMs would likely be tested on coding, since this is
    an important part of their job function.


    Generally speaking, interviewers for PM positions are looking for candidates to
    demonstrate skills in the following areas:


    +   - Handling Ambiguity: This is typically not the most critical area for an
    interview, but you should be aware that interviewers look for skill here. Interviewers
    want to see that when faced with an ambiguous situation, you don''t get overwhelmed
    and stall. They will want to see you tackle the problem head: seeking new information,
    prioritizing the most important parts, and solving the problem in a structured
    way. This will typically not be tested (though it can be), but it may be one of
    many things the interviewer is looking for in a problem.


    +   - Customer Focus (Attitude): Interviewers want to see that everyone will use
    the product just like you? Are you the type of person who puts himself in the
    customer''s shoes and tries to understand how they want to use the product? Questions
    like "Design an alarm clock for the blind" are ripe for examining this aspect.
    When you hear a question like this, be sure to ask a lot of questions to understand
    who the customer is and how they are using the product. The skills covered in
    the Testing section are closely related to this.


    +   - Customer Focus (Technical Skills): Some teams with more complex products
    need to ensure that their PMs work with a strong understanding of the product,
    as it would be difficult to acquire this knowledge on the job. An intimate knowledge
    of instant messengers is is probably not necessary to work on the MSN Messenger
    team, whereas an understanding of security might might be necessary to work on
    Windows Security. Hopefully, you wouldn''t interview with a team that required
    specific technical skills unless you at least possess the requisite skills.


    +   - Multi-Level Communication: PMs need to be able to communicate with people
    at all levels in the company, across many positions and ranges of technical skills.
    Your interviewer will want to see that you possess this flexibility in your communication.
    This is often examined directly, through a question such as, "Explain TCP/IP to
    your grandmother." Your communication skills may also be assessed by how you discuss
    your projects.


    +   - Passion for Technology: Happy employees are productive employees, so a company
    wants to make sure you''ll enjoy the job and be excited about your work. A passion
    for technology—and, the company or team—should come across in your answers. You
    may be asked a question directly like, "Why are you interested in Microsoft?"
    Additionally, interviewers look for enthusiasm in how you discuss your prior experience
    and how you discuss the team''s challenges. They want to see that you will be
    eager to face the challenges of the job.'
