    13.4 What is the difference between deep copy and shallow copy? Explain how you
    would use each.


    pg 139


    # SOLUTION


    A shallow copy copies all the member values from one object to another. A deep
    copy does all this and also deep copies any pointer objects.


    An example of shallow and deep copy is below.


    ```

    1 struct Test {

    2 char *ptr;

    3 };

    4

    5 void shallow_copy(Test &src, Test &dest) {

    6 dest.ptr = src.ptr;

    7 }\8

    9 void deep_copy(Test &src, Test &dest) {

    10 dest.ptr = (char*)malloc(strlen(src.ptr) + 1);

    11 strcpy(dest.ptr, src.ptr);

    12 }

    ```


    Note that shallow_copy may cause a lot of programming runtime errors, especially
    with the creation and deletion of objects. Shallow copy should be used very carefully
    and only when a programmer really understands what he wants to do. In most cases,
    shallow copy is used when there is a need to pass information about a complex
    structure without actual duplication of data. One must also be careful with destruction
    of objects in a shallow copy.


    In real life, shallow copy is rarely used. Deep copy should be used in most cases,
    especially when the size of the copied structure is small.


