  md: '# Brain Teasers


    Brain teasers are some of the most hotly debated questions, and many companies
    have policies banning them. Unfortunately, even when these questions are banned,
    you still may find yourself being asked a brain teaser. Why? Because no one can
    agree on a definition of what a brain teaser is.


    The good news is that if you are asked a brain teaser, it''s likely to be a reasonably
    fair one. It probably won''t rely on a trick of wording, and it can almost always
    be logically deduced. Many brain teasers even have their foundations in mathematics
    or computer science.


    We''ll go through some common approaches for tackling brain teasers.


    # Start Talking


    Don''t panic when you get a brain teaser. Like algorithm questions, interviewers
    want to see how you tackle a problem; they don''t expect you to immediately know
    the answer. Start talking, and show the interviewer how you approach a problem.


    # Develop Rules and Patterns


    In many cases, you will find it useful to write down “rules” or patterns that
    you discover while solving the problem. And yes, you should really write these
    down—it will help you remember them as you solve the problem. Let''s demonstrate
    this approach with an example.


    You have two ropes, and each takes exactly one hour to burn. How would you use
    them to exactly 15 minutes? Note that the ropes are of uneven densities, half
    the rope length-wise does not necessarily take half an hour to burn.


    > Tip: Stop here and spend some time trying to solve this problem on your own.
    If you absolutely must, read this section for hints—but do so slowly. Every paragraph
    will get you a bit closer to the solution.


    From the statement of the problem, we immediately know that we can time one hour.'
