  md: "# Solutions to Chapter 7 | Mathematics and Probability\n\nQ7 -> only append\
    \ x*7 to Q7. Remove x from Q7.\n\n6. Repeat steps 4-6 until we've found k elements.\n\
    \nThe code below implements this algorithm.\n\n```\npublic static int getKthMagicNumber(int\
    \ k) {\n    if (k < 0) {\n        return 0;\n    }\n    int val = 0;\n    Queue<Integer>\
    \ queue3 = new LinkedList<Integer>();\n    Queue<Integer> queue5 = new LinkedList<Integer>();\n\
    \    Queue<Integer> queue7 = new LinkedList<Integer>();\n    queue3.add(1);\n\n\
    \    /* O through kth iteration */\n    for (int i = 0; i < k; i++) {\n      \
    \  int v3 = queue3.size() > 0 ? queue3.peek() : Integer.MAX_VALUE;\n        int\
    \ v5 = queue5.size() > 0 ? queue5.peek() : Integer.MAX_VALUE;\n        int v7\
    \ = queue7.size() > 0 ? queue7.peek() : Integer.MAX_VALUE;\n        val = Math.min(v3,\
    \ Math.min(v5, v7));\n        if (val == v3) { // enqueue into queue 3, 5 and\
    \ 7\n            queue3.add(3 * val);\n            queue5.add(5 * val);\n    \
    \    } else if (val == v5) { // enqueue into queue 5 and 7\n            queue5.remove();\n\
    \            queue5.add(5 * val);\n        } else if (val == v7) { // enqueue\
    \ into queue 7\n            queue7.remove();\n        }\n        queue7.add(7\
    \ * val); // Always enqueue into Q7\n    }\n    return val;\n```\n\nWhen you get\
    \ this question, do with a brute force approach (challenging, but not quite as\
    \ tricky), and then you can start trying to optimize it. Or, try to find a pattern\
