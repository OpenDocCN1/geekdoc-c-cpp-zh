  md: '# Solutions to Chapter 10 | Scalability and Memory Limits


    many repeat queries would be treated as fresh queries.


    Option 2: Each machine has a copy of the cache


    On the other extreme, we could give each machine a complete copy of the cache.
    When new items are added to the cache, they are sent to all machines. The entire
    data structure—linked list and hash table—would be duplicated.


    This design means that common queries would nearly always be in the cache, as
    the cache is the same everywhere. The major drawback however is that updating
    the cache firing off to N different machines, where N is the size of the response
    cluster. Additionally, because each item effectively takes up N times as much
    space, our cache would hold much less data.


    Option 3: Each machine stores a segment of the cache.


    A third option is to divide the cache, such that each machine holds a different
    part of it. Then, when machine i needs to look up the results for a query, machine
    i would figure out which machine holds this value, and then ask this other machine
    (machine j) to look up the query in j''s cache.


    But how would i know which machine holds this part of the hash table?


    One option is to assign queries based on the formula hash (query) % N. Then, machine
    i only needs to apply this formula to know that machine j should store the results
    for this query.


    So, when a new query comes to machine i, this machine would apply the formula
    and call out to machine j. Machine j would then return the value from its cache
    or processSearch(query) to get the results. Machine j would update its cache and
    return the results back to i.


    Alternatively, you could design the system such that machine just returns null
    if it doesn''t have the query in its current cache. This would require machine
    i to call processSearch and then forward the results to machine j for storage.
    This implementation actually increases the number of machine-to-machine calls,
    with few advantages.


    # Step 3: Updating results when contents change


    Recall that some queries may be so popular that, with a sufficiently large cache,
    they would permanently be cached. We need some sort of mechanism to allow cached
    results to be refreshed, either periodically or "on-demand" when certain contents
    change.


    To answer this question, we need to consider how results change (and you need
    to discuss this with your interviewer). The primary times would be:


    +   1. The content at a URL changes (or the page at that URL is removed).

    2. The ordering of results change in response to the rank of a page changing.'
