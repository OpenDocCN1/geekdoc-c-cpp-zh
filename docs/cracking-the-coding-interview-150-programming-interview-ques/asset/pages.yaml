- img_proc: true
  md: '# Chapter 15 | Databases


    once in the database. The drawback is that many common queries require expensive
    joins.


    Instead, we can denormalize the database by storing redundant data. For example,
    if we knew that we would have to repeat this query often, we might store the teacher''s
    name in the Courses table. Denormalization is commonly used to create highly scalable
    systems.


    # SQL Statements


    Let''s walk through a review of basic SQL syntax, using as as an example the database
    that was mentioned earlier (* indicates a primary key):


    ```

    Courses: CourseID*, CourseName, TeacherID

    Teachers: TeacherID*, TeacherName

    Students: StudentID*, StudentName

    StudentCourses: CourseID*, StudentID*

    ```


    Using the above table, implement the following queries.


    # Query 1: Student Enrollment


    Implement a query to get a list of all students and how many courses each student
    is enrolled in.


    At first, we might try something like this:


    ```

    /* Incorrect Code */

    SELECT Students.StudentName, count(*)

    FROM Students INNER JOIN StudentCourses

    ON Students.StudentID = StudentCourses.StudentID

    GROUP BY Students.StudentID

    ```


    This has three problems:


    +   1. We have excluded students who are not enrolled in any courses, since Courses
    only includes enrolled students. We need to change this to a LEFT JOIN.


    +   2. Even if we changed it to a LEFT JOIN, the query is still not quite right.
    Doing count(*) would return how many items there are in a given group of StudentIDs.
    Students in zero courses would still have one item in their group. We need to
    change this to count the number of CourseIDs in each group: count(StudentCourses).


    +   3. We grouped by Students.StudentID, but there are still multiple StudentNames
    in each group. How will the database know which StudentName to return? Sure, they
    may all have the same value, but the database doesn''t understand that. We need
    to apply an aggregate function to this, such as first(Students.StudentName).'
