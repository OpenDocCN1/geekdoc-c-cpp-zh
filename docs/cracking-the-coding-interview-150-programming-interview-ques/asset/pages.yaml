    course, record the timestamp of every instruction in the process.


    Another issue is swapping is governed by the scheduling algorithm of the operating
    system and may be many kernel level threads which are also doing context switches.
    Other processes may be contending for the CPU or the kernel handling interrupts.
    The user does not have any control over these extraneous context switches. For
    instance, at time $t_{1,r}$, the kernel decides to handle an interrupt, then the
    context switch would be ordered.


    In order to overcome these obstacles, we must first construct an environment such
    that $P_1$ executes, the task scheduler immediately selects $P_2$ to run. This
    may be accomplished by constructing a data channel, such as a pipe, between $P_1$
    and $P_2$ and having the two processes play a game of ping-pong with a data token.


    That is, let $P_1$ to be the initial sender and $P_2$ to be the receiver. Initially,
    $P_2$ is blocked (sleeping) as it awaits the data token. When $P_1$ executes,
    it delivers the token over the data channel to $P_2$ and immediately attempts
    to read a response token. However, since $P_2$ has not yet had a chance to run,
    no token is available for $P_1$ and the process is blocked. It relinquishes the
    CPU.


    A context switch results and the task scheduler must select another process to
    run. Since $P_1$ is now in a ready-to-run state, it a desirable candidate to be
    selected by the task scheduler for execution. When $P_2$ runs, the roles of $P_1$
    and $P_2$ are swapped. $P_2$ is now acting as the sender and $P_1$ as the blocked
    receiver. The game ends when $P_2$ returns the token to $P_1$.


    To summarize, an iteration of the game is played with the following steps:


    +   1. $P_1$ blocks awaiting data from $P_2$.

    2. $P_2$ marks the start time.

    3. $P_1$ sends token to $P_2$.

    4. $P_2$ attempts to read a response token from $P_1$. This induces a context
    switch.

    5. $P_1$ is scheduled and receives the token.

    6. $P_2$ sends token to $P_1$.

    7. $P_1$ attempts to read a response token from $P_2$. This induces a context
    switch.

    8. $P_2$ is scheduled and receives the token.

    9. $P_1$ marks the end time.


    The key is that the delivery of a data token induces a context switch. Let $T_d$
    and $T_r$ be the time it takes to deliver and receive a data token, respectively,
    and let $T_c$ be the amount of time spent in a context switch. At step 2, $P_1$
    records the timestamp of the delivery of the token, and at step 9, it records
    the timestamp of the response. The amount of time elapsed, $T$, between these
    events may be expressed by:


    ```

    T = 2 * (T_d + T_c + T_r)

    ```'
