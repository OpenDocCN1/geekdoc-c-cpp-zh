  md: '# Solutions to Chapter 4 | Trees and Graphs


    When might the simple solution be better, and when might the alternative approach
    be better? This is a great conversation to have with your interviewer. Here are
    a few thoughts on that matter though:


    +   1. The simple solution takes O(n + m) memory. The alternative solution takes
    O(log(n) + log(m)) memory. Remember: memory usage can be a very big deal when
    it comes to scalability.

    2. The simple solution is O(n + m) time and the alternative solution has a worst
    case time of O(m). However, the worst time can be deceiving; we need to look deeper
    than that.

    3. A slightly tighter bound on the runtime, as explained earlier, is O(n + km),
    where k is the number of occurrences of T2''s root in T1. Let''s say the node
    data for T1 and T2 were random numbers picked between 0 and p. The value of k
    would be approximately n/p. Why? Because each of n nodes in T1 has a 1/p chance
    of equaling the root, so approximately n/p nodes in T1 should equal T2, root.
    So, let''s say p = 100, n = 100000 and m = 100. We would do somewhere around 1,100,000
    node checks (100000 = 100000 + 100*100000/100).

    4. More complex mathematics and assumptions could get us an even tighter bound.
    We assumed in #3 above that we call treeMatch, we will end up traversing all m
    nodes of T2. It''s far more likely that we will find a difference early on in
    the tree and then exit early.


    In summary, the alternative approach is certainly more optimal in terms of space
    and is likely more optimal in terms of time as well. It depends on what assumptions
    you make and whether you prioritize reducing the average case runtime at the expense
    of the worst case runtime. This is an excellent point to make to your interviewer.


