  md: "# Solutions to Chapter 8 | Object-Oriented Design\n\n```\nfor each edge in\
    \ p.edges {\n    if edge is inner then add to inners\n    if edge is outer then\
    \ add to outers\n}\n```\n\nWe now have a quicker way to zero in on potential matches\
    \ for any given edge. We then go through the puzzle, line by line, to match pieces.\n\
    \nThe solve method, implemented below, operates by picking an arbitrary corner\
    \ to start with. It then finds an open edge on the corner and tries to match it\
    \ to an open piece. When it finds a match, it does the following:\n\n+   1. Attaches\
    \ the edge.\n2. Removes the edge from the list of open edges.\n3. Finds the next\
    \ open edge.\n\nThe next edge is defined to be the one directly opposite the current\
    \ edge, if it is available. If it is not available, then the next edge can be\
    \ any other edge. This will cause the puzzle to be solved in a spiral-like fashion,\
    \ from the outside to the inside.\nThe spiral comes from the fact that the algorithm\
    \ always moves in a straight line, whenever possible. When we reach the end of\
    \ the first edge, the algorithm moves to the only available edge on that corner—a\
    \ 90-degree turn. It continues to take 90-degree turns at each end of side until\
    \ the entire outer edge of the puzzle is completed. When that last edge piece\
    \ is in place, the puzzle has only one exposed edge remaining, which is again\
    \ a 90-degree turn. The algorithm repeats itself for subsequent rounds around\
    \ the puzzle, until finally all the pieces are in place.\n\nThis algorithm is\
    \ implemented below with Java-like pseudocode.\n\n```\npublic void solve() {\n\
    \    /* Pick any corner to start with */\n    Edge currentEdge = getExposedEdge(corner[0]);\n\
    \n    /* Loop will iterate in a spiral-like fashion until the puzzle\n       is\
    \ full. */\n    while (currentEdge != null) {\n        /* Match with opposite\
    \ edges. Inners with outers, etc. */\n        Edge[] opposites = currentEdge.type\
    \ == inner ? outers : inners;\n        for each Edge fittingWith(opposites) {\n\
    \            if (currentEdge.fitsWith(fittingEdge)) {\n                attachEdges(currentEdge,\
    \ fittingEdge); // attach edge\n                removeList(currentEdge);\n   \
    \             removeFromList(fittingEdge);\n            }\n        }\n       \
    \ /* get next edge */\n        currentEdge = nextExposedEdge(fittingEdge);\n \
    \   }\n}\n```"
