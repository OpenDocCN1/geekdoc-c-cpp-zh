    For each of the above topics, make sure you understand how to use and implement
    them, where applicable, what the space and time complexity is.


    For the data structures and algorithms, be sure to practice implementing them
    from scratch. You might be asked to implement one directly, or you might be asked
    to implement a modification of one. Either way, the more comfortable you are with
    implementations, the better.


    In particular, hash tables are an extremely important topic. You will find that
    you use them frequently in solving questions.


    # Powers of 2 Table


    Some people have already committed to this memory, but if you haven''t, you should
    be before your interview. The table comes handy often in scalability questions
    in computing how much space a set of data will take up.


    | Power of 2 | Exact Value (X) | Approx. Value | X Bytes into MB, GB, e.tc. |

    | --- | --- | --- | --- |

    | 7 | 128 | | |

    | 8 | 256 | | 1 K |

    | 10 | 1024 | | 1 K |

    | 16 | 65536 | | 64 K |

    | 20 | 1048,576 | 1 million | 1 MB |

    | 30 | 1,073,741,824 | 1 billion | 1 GB |

    | 32 | 4,294,967,296 | | 4 GB |

    | 40 | 1,099,511,627,776 | 1 trillion | 1 TB |


    Using this table, you could easily compute, for example, that a hash table mapping
    every 32-bit integer to a boolean value could fit in memory on a single machine.


    If you are doing a phone screen with a web-based company, it might be useful to
    have this table in front of you.'
