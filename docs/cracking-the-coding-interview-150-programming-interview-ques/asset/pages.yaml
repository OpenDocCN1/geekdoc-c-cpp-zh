    The advantages of this approach include the following:


    +   - It''s very easy to distribute, and it can also be easily read by both machines
    and humans. This is one reason that XML is a standard data model to share and
    distribute data.


    +   - Most languages have a library to perform XML parsing, so it''s reasonably
    easy for clients to implement.


    +   - We can add new data to the XML file by adding additional nodes. This would
    not break the client''s parser (provided they have implemented their parser in
    a reasonable way).


    +   - Since the data is being stored as XML files, we can use existing tools for
    backing up the data. We don''t need to implement our own backup tool.


    The disadvantages may include:


    +   - This solution sends the clients all the information, even if they only want
    part of it. It is inefficient in that way.


    +   - Performing any queries on the data storage requires parsing the entire file.


    Regardless of which solution we use for data storage, we could provide a web service
    (e.g., SOAP) for client data access. This adds a layer to our work, but it can
    provide additional security, and it may make it even easier for clients to integrate
    the system. we expect or want them to.


    However—and this is a pro and a con—clients will be limited to grabbing the data
    only how we expect or want them. By contrast, in a pure SQL implementation, clients
    could query for the highest stock price, even if this wasn''t a procedure we "expected"
    them to need.


    So which one of these would we use? There''s no clear answer. The pure text file
    solution is probably a bad choice, but you can make a compelling argument for
    the SQL or XML solution, with or without a web service.


    The goal of a question like this is not to see if you get the "correct" answer
    (there is no single correct answer). Rather, it''s to see how you design a system,
    and how you evaluate trade-offs.


