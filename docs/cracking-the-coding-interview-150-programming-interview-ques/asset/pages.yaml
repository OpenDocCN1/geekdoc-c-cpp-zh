  md: '# Solutions to Chapter 10 | Scalability and Memory Limits


    10.1 Imagine you are building some sort of service that will be called by up to
    1000 client applications to get simple end-of-day stock price information (open,
    close, high, low). You may assume that you already have the data, and you can
    store it in any format you wish. How would you design the client-facing service
    which provides the information to client applications? You are responsible for
    the development, rollout, and ongoing monitoring and maintenance of the feed.
    Describe the different methods you considered and why would you recommend your
    approach. Your service can use any technologies you wish, and can distribute the
    information to the client applications in any mechanism you choose.


    pg 115


    # SOLUTION


    From the statement of the problem, we want to focus on how we actually distribute
    the information to clients. We can assume that we have some scripts that magically
    collect the information.


    We want to start off by thinking about the different aspects we should consider
    in a given proposal are:


    +   - Client Ease of Use: We want the service to be easy for the clients to implement
    and useful for them.


    +   - Ease for Ourselves: This service should be as easy as possible for us to
    implement, as we shouldn''t impose unnecessary work on us. We need to consider
    in this not only the cost of implementing, but also the cost of maintenance.


    +   - Flexibility for Future Demands: This problem is stated in a "what would
    you do in the real world" way, so we should think like we would be in a real-world
    problem. Ideally, we do not want to constrain ourselves in the implementation,
    such that we can''t be flexible if the requirements or demands change.


    +   - Scalability and Efficiency: We should be mindful of the efficiency of our
    solution, so as not to overly burden our server.


    With this framework, we can consider various proposals.


    # Proposal #1


    One option is that we keep the data in simple text files and let clients download
    the data through some sort of FTP server. This would be easy to maintain in some
