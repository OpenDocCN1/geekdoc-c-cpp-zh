    # SOLUTION


    This is a recursive problem, so let''s figure out how to compute makeChange(n)
    using prior solutions (i.e., sub-problems).


    Let''s say n = 100. We want to compute the number of ways of making change for
    100 cents. What is the relationship between this problem and its sub-problems?


    We know making change for 100 cents would involve either 0, 1, 2, 3, or 4 quarters.
    So:


    ```

    makeChange(100) =

    makeChange(100 using 0 quarters) +

    makeChange(100 using 1 quarter) +

    makeChange(100 using 2 quarters) +

    makeChange(100 using 3 quarters) +

    makeChange(100 using 4 quarters)

    ```


