  md: '# Solutions to Chapter 3 | Stacks and Queues


    # SOLUTION


    Since the major difference between a queue and a stack is the order (first-in
    first-out vs. last-in first-out), we know that we need to modify peek() and pop()
    to go in reverse order. We can use our second stack to reverse the order of the
    elements (by popping s1 and pushing the elements to s2). In such an implementation,
    on each peek() and pop() operation, we would pop everything from s1 onto s2, perform
    the peek / pop operation, and then push everything back.


    This will work, but if two pop / peeks are performed back-to-back, we are needlessly
    moving elements. We can implement a "lazy" approach where we let the elements
    in s2 until we absolutely reverse the elements.


    In this approach, stackNewest has the newest elements on top and stackOld has
    the oldest elements on top. When we dequeue an element, we want to remove the
    oldest element first, so we dequeue from stackOld. If stackOld is empty, then
    we transfer all elements from stackNewest into this stack in reverse order. To
    insert an element, we push onto stackNewest, since it has the newest elements
    on top.


    The code below implements this algorithm.


    ```

    1 public class MyQueue<T> {

    2 Stack<T> stackNewest, stackOldest;

    3

    4 public MyQueue() {

    5 stackNewest = new Stack<T>();

    6 stackOldest = new Stack<T>();

    7 }

    8

    9 public int size() {

    10 return stackNewest.size() + stackOldest.size();

    11 }

    12

    13

    14 public void add(T value) {

    15 /* Push onto stackNewest, which always has the newest

    16 * elements on top */

    17 stackNewest.push(value);

    18 }

    19

    20 /* Move elements from stackNewest into stackOldest. This is

    21 * usually done so that we can do operations on stackOldest. */

    22 private void shiftStacks() {

    23 if (stackOldest.isEmpty()) {

    24 while (!stackNewest.isEmpty()) {

    25 stackOldest.push(stackNewest.pop());

    26 }

    27 }

    ```'
