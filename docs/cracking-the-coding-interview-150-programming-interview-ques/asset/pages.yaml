  md: '# VII. The Offer and Beyond | Evaluating the Offer


    Congratulations! You got an offer! And—if you''re lucky—you may have even gotten
    multiple offers. Your recruiter''s job is to do everything to encourage to accept
    it. How do you know if the company is the right fit for you? We''ll go through
    a few things you should consider in evaluating an offer.


    # The Financial Package


    Perhaps the biggest mistake that make in evaluating an offer is looking too much
    at their salary. Candidates often look so much at this one number that they wind
    up accepting the offer that is worse financially. Salary is just one part of your
    financial compensation. You should also look at:


    +   - Signing Bonus, Relocation, and One Time Perks: Many companies offer a signing
    bonus and/or relocation. When comparing offers, it''s wise to amortize this cash
    over three years (or however long you expect to stay).


    +   - Cost of Living Difference: If you''ve received offers in multiple locations,
    do not overlook the impact of cost of living differences. Silicon Valley, for
    example, is about 20 to 30% more expensive than Seattle (in part due to a 10%
    California state income tax). A variety of sources can estimate the cost of living
    difference.


    +   - Annual Bonus: Annual bonuses at tech companies can range from anywhere from
    3% to 30%. Your recruiter might reveal the average annual bonus, but if not, check
    with friends at the company.


    +   - Stock Options and Grants: Equity compensation can form big part of your
    annual compensation. Like signing bonuses, stock compensation between companies
    can be compared by amortizing it over three years and then lumping that value
    into salary.


    # Career Development


    As thrilled you may be to receive this offer, odds are, in a few years, you''ll
    start thinking about interviewing again. Therefore, it''s important that you think
    right now about how this offer would impact your career path. This means considering
    the following questions:


    +   - How good does the company''s name look on my resume?


    +   - How much will I learn? Will I learn relevant things?


    +   - What is the promotion plan? How do the careers of developers offer a realistic
    plan?


    +   - If I want to move into management, does this company offer a


    +   - Is the company or team growing?


