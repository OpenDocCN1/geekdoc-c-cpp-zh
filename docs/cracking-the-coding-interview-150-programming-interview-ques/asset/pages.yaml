  md: "# Chapter 16 | Threads and Locks\n\n13 )\n\nLike synchronizing method, only\
    \ one thread instance of MyObject can execute the code within the synchronized\
    \ block. That means, if thread1 and thread2 have the same instance of MyObject,\
    \ only one will be allowed to execute the code block at a time.\n\nLocks\n\nFor\
    \ more granular control, we can utilize a lock. A lock (or monitor) is used to\
    \ synchronize a shared resource by associating the resource with the lock. A thread\
    \ gets access to a shared resource by first acquiring the lock associated with\
    \ the resource. At any time, at most one thread can hold the lock and, therefore,\
    \ only one thread can access the shared resource.\n\nA common case for locks is\
    \ when a resource is accessed from multiple places, but should only be accessed\
    \ by one thread at a time. This case is demonstrated in the code below.\n\n```\n\
    public class LockedATM {\n    private Lock lock;\n    private int balance = 100;\n\
    \    public LockedATM() {\n        lock = new ReentrantLock();\n    }\n    public\
