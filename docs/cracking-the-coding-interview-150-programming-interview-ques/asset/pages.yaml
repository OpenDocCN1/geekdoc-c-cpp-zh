    # SOLUTION


    Like many problems, this one somewhat depends on how well we''d like to support
    these stacks. If we''re ok with simply allocating a fixed amount of space for
    each stack, we can do that. This may mean though that one stack runs out of space,
    while the others are nearly empty.


    Alternatively, we can be flexible in our space allocation, but this significantly
    increases the complexity of the problem.


    # Approach 1: Fixed Division


    We can divide the array in three equal parts and allow the individual stack to
    grow in that limited space. Note: we will use the notation "[" to mean inclusive
    of an endpoint and ")" to mean exclusive of an endpoint.


    +   * For stack 1, we will use [0, n/3).\n* For stack 2, we will use [n/3, 2n/3).\n*
    For stack 3, we will use [2n/3, n).


    The code for this solution is below.


