  md: 'GAYLE LAAKMANN MCDOWELL is the author of The Google Resume and the founder
    and CEO of CareerCup.com, which helps candidates prepare for technical interviews.
    She has worked at Microsoft, Google, and Apple as a software engineer, served
    on Google''s hiring committee, and has interviewed over 150 software engineering
    candidates.


    > If you are planning to appear for a technical interview, I highly recommend
    studying this book. It is an awesome compilation of problems, strategies, and
    approaches you must know for doing well in a tech interview.

    Ginnie, an Amazon Reviewer


    +   * 150 Programming Interview Questions and Answers

    From binary trees to binary search, this massive list includes the most common
    and most useful questions in data structures and algorithms.


    +   * Five Proven Ways to Tackle the Toughest Algorithm Problems

    Using these five approaches, you can learn how to approach and conquer even the
    thorniest problems.


    +   * Top Ten Most Common Mistakes that Candidates Make

    Don''t lose your chance by making these common mistakes. Learn what candidates
    do wrong, and how to avoid these issues.


    +   * Strategies to Prepare for Behavioral and Technical Questions

    Stop sifting through an endless set of questions, while skipping the most important
    areas. Follow these steps to prepare more effectively.


