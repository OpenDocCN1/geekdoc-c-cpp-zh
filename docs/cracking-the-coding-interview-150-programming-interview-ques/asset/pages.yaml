  md: '# Solutions to Chapter 16 | Threads and Locks


    # 16.1 What''s the difference between a thread and a process?


    pg 159


    # SOLUTION


    Processes and threads are related to each other but are fundamentally different.


    A process can be thought of as an instance of a program in execution. A process
    is an independent entity to which system resources (e.g., CPU time and memory)
    are allocated. Each process is executed in a separate address space, and one process
    cannot access the variables and data structures of another process. If a process
    wishes to access another process'' resources, inter-process communications have
    to be used. These include pipes, sockets, and other forms.


    A thread exists within a process and shares the process'' resources (including
    its heap space). Multiple threads within the same process will share the same
    heap space. This is very different from processes, which cannot directly access
    the memory of another process. Each thread still has its own registers and its
    own stack, but other threads can read and write the heap memory.


    A thread is a particular execution path of a process. When one modifies a process
    resource, the change is immediately visible to sibling threads.


    # 16.2 How would you measure the time spent in a context switch?


    pg 159


    # SOLUTION


    This is a tricky question, but let''s start with a possible solution.


    A context switch is the time switching between two processes (i.e., bringing a
    waiting process into execution and sending an executing process into waiting/terminated).
    This happens in multitasking. The operating system must bring the state information
    of waiting processes into memory and save the state information of the currently
    running process.


    In order to solve this problem, we would record the timestamps of the last and
    first instruction of the swapping processes. The context switch time is the difference
    in the timestamps between the two processes.


    Let''s take an easy example: Assume there are only two processes, $P_1$ and $P_2$.


    $P_1$ is executing and $P_2$ is waiting for execution. At some point, the operating
    system must swap $P_1$ and $P_2$—let''s assume it happens at the $N^{th}$ instruction
    of $P_1$. If $t_{x,k}$ indicates the timestamp in microseconds of the $k^{th}$
    instruction of process $x$, then the context switch would take $t_{2,1} - t_{1,n}$
    microseconds.


    The tricky part is this: how we know when this swapping occurs? We can not,of'
