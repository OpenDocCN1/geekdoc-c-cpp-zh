  md: '# Solutions to Chapter 14 | Java


    14.1 In terms of inheritance, what is the effect of keeping a constructor private?


    # SOLUTION


    Declaring the constructor private will ensure that no one outside of the class
    can directly instantiate the class. In this case, the only way to create an instance
    of the class is to provide a static public method, as is done when using the Factory
    Method Pattern. Additionally, because the constructor is private, the class also
    cannot be inherited.


    14.2 In Java, does the finally block get executed if we insert a return statement
    inside the try block of a try-catch-finally?


    # SOLUTION


    Yes, it will get executed. Even when we attempt to exit within the try block (via
    a return statement, a continue statement, a break statement or any exception),
    the finally block will still be executed.


    Note that there are some cases in which the finally block will not get executed,
    such as the following:


    +   * If the virtual machine exits during try/catch block execution.

    * If the thread which is executing the try/catch block gets killed.


    14.3 What is the difference between final, finally, and finalize?


    # SOLUTIONS


    Despite their similar sounding names, final, finally and finalize have very different
    purposes. To speak in very general terms, final is used to control whether a variable,
    method, or class is "changeable". The final keyword is used in a try/catch block
    to ensure that a segment of code is always executed. The finalize() method is
    called by the garbage collector once it determines that no more references exist.


    Further detail on these keywords and methods is provided below.


    final


    The final statement has a different meaning depending on its context.'
