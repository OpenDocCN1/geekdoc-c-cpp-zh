    that he doesn''t think you''re stuck.


    And, one more thing: you''re not until the interviewer says you''re done! What
    I mean here is that when you come up with an algorithm, start thinking about the
    problems. When you write code, start trying to find bugs. If you''re anything
    like the other 110 candidates that I''ve interviewed, you probably made some mistakes.


    # Five Steps to a Technical Question


    A technical interview question can be solved utilizing a five step approach:


    +   1. Ask your interviewer questions to resolve ambiguity.

    2. Design an Algorithm.

    3. Write pseudocode first, but make sure to tell your interviewer that you''ll
    eventually write “real” code.

    4. Write your code at a moderate pace.

    5. Test your code and carefully fix any mistakes.


    We will go through each of these steps in more detail below.


    # Step 1: Ask Questions


    Technical problems are more ambiguous than they might appear, so make sure to
    ask questions to anything that might be unclear. You may eventually wind up with
    a very different—or much easier—problem than you had initially thought. In fact,
    many interviewers (especially at Microsoft) will specifically test to see if you
    ask good questions.


    Good questions are more like one: What are the data types? How much data is there?
    What assumptions do you need to solve the problem? Who is the user?


    Example: “Design an algorithm to sort a list.”


    +   - Question: What sort of list? An array? A linked list?

    - Answer: An array.

    - Question: What does the array hold? Numbers? Characters? Strings?

    - Answer: Numbers.

    - Question: And are the numbers integers?'
