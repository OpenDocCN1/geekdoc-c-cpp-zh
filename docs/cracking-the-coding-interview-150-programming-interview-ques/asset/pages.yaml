    # Synchronized Methods


    Most commonly, we restrict access to shared resources through the use of the synchron-
    d keyword. It can be applied to methods and class blocks, and restricts multiple
    threads from executing the code simultaneously on the same object.


    To clarify the last point, consider the following code:


    ```

