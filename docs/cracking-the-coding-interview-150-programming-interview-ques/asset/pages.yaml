  md: '# The Interview Process'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# I. The Interview Process | Overview


    Most companies conduct their interviews in very similar ways. We will offer an
    overview of how companies interview and what they''re looking for. This information
    should guide your interview preparation and your reactions during and after the
    interview.


    Once you are selected for an interview, you usually go through a screening interview.
    This is typically conducted over the phone. College candidates who attend top
    schools may have these interviews in-person.


    Don''t let the name fool you; the "screening" interview often involves coding
    and algorithm questions, and the bar can be as high as it is for in-interviews.
    If you''re unsure whether or not the interview will be technical, as your recruiting
    coordinator what position your interviewer holds. An engineer will usually perform
    a technical interview.


    Many companies take advantage of online synchronized document editors, but others
    will expect you to write code on paper and read it back over the phone. Some interviewers
    may give you "homework" to solve after you hang up the phone or ask you to email
    them the code you wrote.


    In an on-site interview or two screening interviewers you usually have 4 to 6
    in-person interviews. One of these will be over lunch. The lunch interview is
    usually not technical, and the interviewer may not even submit feedback. This
    is a good person to discuss your interests with and to ask about the company culture.
    Your other interviews will be mostly technical and involve a combination of coding
    and algorithm questions. You should also expect some questions about your resume.


    Afterwards, the interviewers meet to discuss your performance and/or submit written
    feedback. At most companies, your recruiter should respond to you within a week
    with an update on your status.


    If you have waited more than a week, you should follow up with your recruiter.
    If your recruiter does not respond, this does not mean that you are rejected (at
    least not any major tech company, and almost any other company). Let me repeat
    again: not responding indicates nothing about your status. The intention is that
    all recruiters should tell candidates once a final decision is made.


    Delays can do happen. Follow up with your recruiter if you expect a delay, but
    be respectful when you do. Recruiters are just like you. They get busy and forgetful
    too.'
