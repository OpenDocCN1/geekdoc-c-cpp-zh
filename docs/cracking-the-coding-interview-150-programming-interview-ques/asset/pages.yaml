  md: '# VII. The Offer and Beyond | Negotiation


    late 2010, I signed up for a negotiations class. On the first day, the instructor
    asked us to imagine a scenario where we wanted to buy a car. Dealership A sells
    the car for a fixed $20,000—negotiating. Dealership B allows us to negotiate.
    How much would the car have to be (after negotiating) for us to go to Dealership
    B? (Quick!) Answer this for yourself!


    On average, the class said that the car would have to be $750 cheaper. In other
    words, students were willing to pay $750 just to avoid having to negotiate for
    an hour or so. Surprisingly, in a class pool, most of the students also didn''t
    negotiate their job offer. They just accepted whatever the company gave them.


    Do yourself a favor. Here are some tips to get started.


    +   Just Do It: Yes, I know it''s scary (almost) no one likes negotiating. But
    it''s so worth it. Recruiters will not revoke an offer because you negotiated,
    so you have nothing to lose.


    +   Have a Viable Alternative. Fundamentally, recruiters negotiate with because
    they''re concerned you may not join the company otherwise. If you have alternative
    options, that will make their concern that you decline their offer feel much more
    real.


    +   Have a Specific "Ask": It''s much more effective to ask for an additional
    $7000 in salary than just ask for "more". After all, if you ask for more, the
    recruiter could throw in $1000 and have satisfied your wishes.


    +   Overshoot: In negotiations, people usually don''t agree to whatever you demand.
    It''s a back and forth. Ask for a bit more than you''re really hoping to get,
    since the company will probably meet you in the middle.


    +   Think Beyond Salary: Companies are often more willing to negotiate on non-salary
    components, since boosting your salary too could mean that they''re paying you
    more than your peers. Consider asking for more equity or a bigger signing bonus.
    Alternatively, you may be able to ask for your relocation benefits in cash, instead
    of having the company pay directly for the moving fees. This is a great avenue
    for many college students, whose actual expenses are fairly cheap.


    +   Use Your Best Medium: Many will advise you to only negotiate over the phone.
    To a certain extent, they''re right: it is better to negotiate over the phone.
    However, if you don''t feel comfortable on a phone negotiation, do it via email.
    It''s more important that you negotiate to negotiate that you do via a specific
    medium.


    Additionally, if you''re negotiating with a big company, you should know that
    they often have "levels" for employees, where all employees at a particular level
    are around the same amount. Microsoft has a particularly well-defined system for
    this. You can negotiate within the salary range for your level, but going beyond
    that requires bumping up a level. If you''re looking for a big bump, you''ll need
    to convince the recruiter and your future team that your experience matches this
    higher level—a difficult, but feasible, thing to.


