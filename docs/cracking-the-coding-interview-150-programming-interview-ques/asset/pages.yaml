    # Part 3: How Do You Find The Start of the Loop?


    We now know that CollisionSpot is K nodes before the start of the loop. Because
    K = mod(k, LOOP_SIZE) (or, in other words, k = K + M * LOOP_SIZE), for any integer
    M), it is also correct to say that k nodes from the loop start. For example, if
    node N is 2 nodes into a 5 node loop, it is also correct to say that it is 7,
    12, or even 397 nodes into the loop.


    Therefore, both CollisionSpot and LinkedListHead are k nodes from the start of
    the loop.


    Now, if we keep one pointer at CollisionSpot and move the other one to LinkedListHead,
    they will each be k nodes from LoopStart. Moving the two pointers at the same
    speed will cause them to collide again—time after k steps, at which point they
    will both be at LoopStart. We all have to return this node.


    # Part 4: Putting It Together


    To summarize, we move FastPointer twice as fast as SlowPointer. When SlowPointer
    enters the loop, after k nodes, FastPointer is k nodes into the linked list. This
    means that FastPointer and SlowPointer are LOOP_SIZE - k nodes away from each
    other.


    Next, if FastPointer moves two nodes for each node that SlowPointer moves, they
    move one node closer to each other on each turn. Therefore, they will meet after
    LOOP_SIZE - k turns. Both will be k nodes from the front of the loop.


    The head of the linked list is also k nodes from the front of the loop. So, if
    we keep one pointer where it is, and move the other pointer to the head of the
    linked list, then they will meet at the front of the loop.


    Our algorithm is derived directly from parts 1, 2 and 3.


    +   1. Create two pointers, FastPointer and SlowPointer.


    +   2. Move FastPointer at a rate of 2 steps and SlowPointer at a rate of 1 step.


    +   3. When they collide, move SlowPointer to LinkedListHead. Keep FastPointer'
