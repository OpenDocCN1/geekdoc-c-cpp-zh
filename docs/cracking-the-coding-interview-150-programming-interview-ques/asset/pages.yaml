  md: '# VI. Technical Questions | Handling Technical Questions


    at a nice, slow, methodical pace. Also, remember this advice:


    +   - Use Data Structures Generously: Where relevant, use a good data structure
    or define your own. For example, if you''re asked a problem involving finding
    the minimum age for a group of people, consider defining a data structure to represent
    a Person. This shows your interviewer that you care about good object-oriented
    design.

    - Don''t Crowd Your Coding: This is a minor thing, but it can really help. When
    you''re writing code on a whiteboard, start in the upper left hand corner rather
    than in the middle. This will give you plenty of space to write your answer.


    # Step 5: Test


    Yes, you need to test your code! Consider testing for:


    +   - Extreme cases: 0, negative, null, maximums, minimums.

    - User error: What happens if the user passes in null or a negative value?

    - General cases: Test the normal case.


    If the algorithm is complicated or highly numerical (bit shifting, arithmetic,
    etc.), considering testing while you''re writing the code rather than just at
    the end.


    When you find mistakes (which you will), carefully think through why the bug is
    occurring before fixing the mistake. You do not want to be seen as a "random fixer"
    candidate: one who, for example, finds that their function returns true instead
    of false for a particular value, and so just flips the return value and tests
    to see if the function works. This might fix the issue for that particular case,
    but it inevitably creates several new issues.


    When you notice problems in your code, really think deeply about why your code
    failed before fixing the mistake. You''ll create beautiful, clean code much, much
    faster.'
