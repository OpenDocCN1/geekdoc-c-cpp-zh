    can say that the statement LEFT JOIN B is equivalent to the statement RIGHT JOIN
    A. In our example, we will get five records. In addition to INNER JOIN results,
    FRECA AND WATER records will be listed.

    - FULL OUTER JOIN: This type of join combines the results of the LEFT and RIGHT
    JOINS. All records from both tables will be included in the result set, regardless
