  md: "# Solutions to Chapter 5 | Bit Manipulation\n\n5.1 You are given two 32-bit\
    \ numbers, N and M, and two positions, i and j. Write a method to insert M into\
    \ N that M starts at j and ends at i. You can assume that the bits j through i\
    \ have enough space to fit all of M. That, if M = 10011, you can assume that there\
    \ are at least 5 bits between j and i. You would not, for example, have j = 3\
    \ and i = 2, because M could not fit properly between bit 3 and 2.\n\nEXAMPLE:\n\
    Input: N = 10000000000, M = 10011, i = 2, j = 6\n\nOutput: N = 10001001100\n\n\
    # SOLUTION\n\nThis problem can be approached in three key steps:\n\n+   1. Clear\
    \ the bits through i in N\n\n+   2. Shift M through i so it lines up with bits\
    \ through j\n\n+   3. Merge M and N\n\nThe trickiest part is Step 1. How do we\
    \ clear the bits in N? We can do this with a mask. This mask will have all 1s,\
    \ except for 0s in the bits j through i. We create this mask by creating the left\
    \ half of the first mask, and then the right half.\n\n```\nint updateBits(int\
    \ n, int m, int i, int j) {\n    /* Create a mask to clear bits through j in n\n\
    \     * EXAMPLE: i = 2, j = 4. Result should be 11000011.\n     * For simplicity,\
    \ we'll use 8 bits for the example.\n     */n    int allOnes = ~0; // will sequence\
    \ of all 1s\n    // 1s before position j, then os. left = 11100000\n    int left\
    \ = allOnes << (j + 1);\n    // 1's after position i. right = 00000011\n    int\
    \ right = (1 << i) - 1;\n    // Clear bits j through i. mask = 111000011\n   \
    \ int mask = left | right;\n    int n_cleared = n & mask; // Clear bits j through\
    \ i.\n    int m_shifted = m << i; // Move m into correct position.\n\n    return\
    \ n_cleared | m_shifted; // OR them, and we're done!\n}\n```\n\nIn a problem like\
    \ this (and bit manipulation problems), you should make sure to thoroughly test\
    \ your code. It is extremely easy to wind up with off-by-one errors."
