    Step 2: Who will use it? And why?


    Software typically has one or more target users, and the features are designed
    with this in mind. For example, if you''re asked to test software parental controls
    on a web browser, your target users include both parents (who are implementing
    the blocking) and children (who are the recipients of blocking). You may also
    have "guests" (people who should neither be implementing nor receiving blocking).


    Step 3: What are the use cases?


    In the software blocking scenario, the use cases of parents include installing
    the software, updating controls, removing controls, and of course your own personal
    internet usage. For the children, the use cases include accessing legal content
    as well as "illegal" content.


    Remember that it''s not up to you to just magically decide the use cases. This
    is a conversation with your interviewer.


    Step 4: What are the bounds of use?


    Now that we have the vague use cases defined, we need to figure out what exactly
    this means. What does it mean for a website to be blocked? Should just the "illegal"
    page be blocked, or the entire website? Is the application supposed to "learn"
    what is bad content, or is it based on a white or black list? If it''s supposed
    to learn what inappropriate content, what degree of false positives or false negatives
    is acceptable?


    Step 5: What are the stress conditions / failure conditions?


    When the software fails—which it inevitably will—what should the failure look
    like? Clearly, the software shouldn''t crash the computer. Instead, it''s likely
    that the software should permit a blocked site, or ban an allowable site. In the
    latter case, you might want to discuss the possibility of a selective override
    with a password from the parents.


    Step 6: What are the test cases? How would you perform the testing?


    Here is where the distinctions between manual and automated testing, and between
    black box and white box testing, really come into play.


    Steps 3 and 4 should have roughly defined the use cases. In step 6, we further
    define them and discuss how to perform the testing. What exact situations are
    you testing? Which of these steps can be automated? Which require human intervention?


    Remember that while automation allows you to do some very powerful testing, it
    also has some significant drawbacks. Manual testing should usually be part of
    your test procedures.'
