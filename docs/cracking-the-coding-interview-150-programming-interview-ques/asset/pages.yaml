    \nSuppose we are implementing a hash table that looks like Hash<K, V>. That is,\
    \ the hash table maps from objects of K type to objects of type V.\n\nAt first,\
    \ we might think our data structure would look something like this:\n\n```\npublic\
    \ class Hash<K, V> {\n    LinkedList<V>[] items;\n    public void put(K key, V\
    \ value) { ... }\n    public V get(K key) { ... }\n}\n```\n\nNote that items is\
    \ an array of linked lists, where items[i] is a linked list of all objects with\
    \ keys that map to index i (that is, all the objects that collided at i).\n\n\
    This would seem to work until we think more deeply about collisions.\n\nSuppose\
    \ we have a very simple hash function that uses the string length,\n\n```\npublic\
    \ int hashCodeOf(K key) {\n    return key.toString().length() % items.length;\n\
    }\n```\n\nThe keys jim and bob will map to the same index in the array, even though\
    \ they are different keys. We need to search through the linked list to find the\
    \ actual object that corresponds to these keys. But how would we do that? All've\
    \ stored in the linked list is the value, not the original key.\n\nThis is why\
    \ we need to store both the value and the original key.\n\nOne way to do that\
    \ is to create another object Cell which pairs keys and values. With this implementation,\
    \ our linked list is of type Cell.\n\nThe code below uses this implementation.\n\
    \n```\npublic class Hash<K, V> {\n    private final int MAX_SIZE = 10;\n    LinkedList<Cell<K,\
    \ V>>[] items;\n\n    public Hash() {\n        items = new LinkedList<Cell<K,\
    \ V>>[MAX_SIZE];\n    }\n\n    /* Really, really stupid hash. */\n    public int\
    \ hashCodeOf(K key) {\n        return key.toString().length() % items.length;\n\
    \    }\n}\n```"
