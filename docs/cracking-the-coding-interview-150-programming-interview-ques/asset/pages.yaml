    x, then we know we need to move upwards.


    Observe that we can also make a similar conclusion by looking at the ends of columns
    or rows. If the end of a column or row is less than x, then we know we must move
    down (for rows) or to the right (for columns) to find x. This is because the end
    is always the maximum element.


