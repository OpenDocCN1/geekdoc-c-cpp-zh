  md: '# III. Special Situations | Experienced Candidates


    If you read the prior section carefully, the following shouldn''t surprise you:
    experienced candidates are asked very similar questions as inexperienced candidates,
    and the standards don''t vary significantly.


    Most questions, as you may know, are general questions covering data structures
    and algorithms. The major companies feel that this is a good test of ones abilities,
    so they hold everyone to that test.


    Some interviewers may hold experienced candidates to a slightly higher standard
    on those questions. After all, an experienced candidate has many more years of
    experience and should perform better, right?


    It turns out other interviewers see things in exactly the opposite way. Experienced
    candidates are out of school and may not have touched some of these concepts since
    then. It''s expected that they would forget some details, so we should hold them
    to a lower standard.


    On average, it balances out. If you''re an experienced candidate, you''ll be asked
    roughly the same types of questions and held to roughly the same standard.


    The exception to this rule is system design and architecture questions, as well
    as questions on your resume.


    Typically, students don''t study much architecture, so experience with such challenges
    would only come professionally. Your performance in interview questions would
    be evaluated with respect to your experience level. However, students and recent
    graduates are still asked these questions and should be prepared to solve them
    as well as they can.


    Additionally, experienced candidates will be expected to give a more in-depth,
    impressive response to questions like, "What was the hardest bug you''ve faced?"
    You have more experience, and your response to these questions should show it.'
