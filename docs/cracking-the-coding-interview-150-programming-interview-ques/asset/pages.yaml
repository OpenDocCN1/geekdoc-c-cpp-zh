    # 6.5


    There is a building of 100 floors. If an egg drops from the Nth floor or above,
    it will break. If it''s dropped from any floor below, it will not break. You''re
    given two eggs. Find N, while minimizing the number of drops for the worst case.


    pg 96


    # SOLUTION


    We may observe that, regardless of how we drop Egg 1, Egg 2 must do a linear search
    (from lowest to highest) between the "breaking floor" and the next nonbreaking
    floor. For example, if Egg 1 is dropped from floors 5 and 10 without breaking,
    but it breaks when it''s dropped from floor 15, then Egg 2 must be dropped, in
    the worst case, from floors 11, 12, 13, and 14.


    # The Approach


    As a first try, suppose we drop an egg from the 10th floor, then the 20th, ...


    +   * If Egg 1 breaks on the first drop (floor 10), then we have at most 10 drops
    total.

    * If Egg 1 breaks on the last drop (floor 100), then we have at most 19 drops
    total (floors 10, 20, ...,90, 100, then 91 through 99).


    That''s pretty good, but all we''ve considered is the absolute worst case. We
    should do "load balancing" to make those two cases even more.


    Our goal is to create a system for dropping Egg 1 such that the number of drops
    is as consistent as possible, whether Egg 1 breaks on the first drop or the last
    drop.


    +   1. A perfectly load-balanced system would be one in which Drops(Egg 1) + Drops
    (Egg 2) is always the same, regardless of where Egg 1 breaks.

    2. For that to be the case, since each drop of Egg 1 takes one more step, Egg
    2 is allowed one fewer step.

    3. We must, reduce the number of steps potentially required by Egg 2 by one drop
    each time. For example, if Egg 1 is dropped on floor 20 and then floor 30, Egg
    2 is potentially required to take 9 steps. When we drop Egg 1 again, we must reduce
    potential Egg 2 steps to only 8. That is, we must drop Egg 1 at floor 39.

    4. We know, therefore, Egg 1 must start at floor X, then go up by X-1 floors,
    then X-2, ..., until it gets to 100.


    CrackingTheCodingInterview.com 261'
