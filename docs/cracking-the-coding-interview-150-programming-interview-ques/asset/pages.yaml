  md: '# I. The Interview Process | Top Ten Mistakes


    And it lets them guide you when you get off-track, helping you get to the answer
    faster.

    Best of all, it demonstrates your awesome communication skills. What''s not to
    love?


    # #6 | Rushing


    Coding is not a race, and neither is interviewing. Take your time when working
    on a coding problem. Rushing leads to mistakes and suggests that you are careless.
    Go slowly and methodically, testing often and thinking through the problem thoroughly.
    In the end, you''ll finish the problem in less time and with fewer mistakes.


    # #7 | Sloppy Coding


    Did you know that you can write bug-free code but still perform horribly on a
    coding question? It''s true! Duplicated code, messy data structures (i.e., lack
    of object-oriented design), and so on. Bad, bad, bad! When you write code, imagine
    you''re writing for real-world maintainability. Break code into sub-routines,
    and design data structures to link appropriate data.


    # #8 | Not Testing


    You probably wouldn''t write code in the real world without testing, so why do
    that in an interview? When you finish writing code in an interview, "run" (or
    walk through) the code to test it. Or, on complicated problems, test the code
    while writing it.


    # #9 | Fixing Mistakes Carelessly


    Bugs will happen; they''re just a matter of life, or of coding. If you''re testing
    your code carefully, then you will probably discover bugs. That''s okay.

    The important thing is that when you find a bug, you think through why it occurred
    before fixing it. Some candidates, when they find that their function returns
    false for particular parameters, will just flip the return value and check if
    that fixes the issue. Or, it rarely does; in fact, it creates to even more bugs
    and demonstrates that you''re careless.

    Bugs are acceptable, but changing your code randomly to fix the bugs is not.


    # #10 | Giving Up


    I know interview questions can be overwhelming, but that''s part of what the interviewer
    is testing. Do you rise to a challenge, or do you shrink back in fear? It''s important
    that you step up and eagerly meet a tricky problem head-on. After all, remember
    that interviews are supposed to be hard. It shouldn''t be a surprise when you
    get a really tough problem.'
