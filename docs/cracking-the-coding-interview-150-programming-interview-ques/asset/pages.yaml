  md: '# IV. Before the Interview | Building a Network


    You probably already know that many people get jobs from their friends. But what
    you may not know is that, in fact, even more people get jobs from their friends
    of. And this really makes perfect sense. To drop into geek-speak for a second,
    you may have N friends, but you have N'' friends of friends.


    So what does this mean for your job-finding possibilities? It means that both
    your immediate and extended network is critical to finding a job.


    # What Makes a Network a “Good Network”


    A good network is one that is both broad and close. If it seems contradictory,
    that’s because it is (somewhat).


    +   - Broad: A network should be somewhat focused on your own industry (technology),
    but it should also be broad and cover many industries. An accountant, for example,
    can be valuable to career-wise simply because he she probably has lots of friends
    outside of accounting. Some of these friends—who are your of friends—will probably
    be looking for someone just like you at some point. Be open to connecting with
    anyone you.

    - Close: It is much easier to access a friend of a friend via a close friend of
    yours that is through a more distant acquaintance. Moreover, people who are seen
    as “professional networks” or “card collectors” are often written off by others
    as being too fake. Make your connections deep and meaningful.


    The trick to finding a balance here is to meet whoever you can, but to be open
    and genuine to everyone. When you just try to “collect cards,” you often wind
    up with nothing at all.


    # How to Build a Strong Network


    Some people argue that you “just” need to get out and meet people, and that’s
    mostly true. But where? And how do you go from an introduction to a real connection?


    The following steps will help:


    +   1. Use websites like Meetup.com or your alumni network to discover events
    that are relevant to your interests and goals. Bring business cards. If you don’t
    have them you’re unemployed or a student, make some.

    2. Walk up and say, “Hello,” to people. It may seem scary to you, but honestly,
    no one will hold it against you. Most people willsel appreciate your assertiveness.
    What’s the worst that can happen? They don’t like you, don’t establish a connection
    with you, and you never see them again

    3. Be open about your interests, and talk to people about them. If they’re running
    a start-up or something else you might have some interest in, ask to grab coffee
    to chat more.


    CrackingTheCodingInterview.com 35'
