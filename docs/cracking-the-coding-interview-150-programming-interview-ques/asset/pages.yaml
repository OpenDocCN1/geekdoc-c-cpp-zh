  md: '# I. The Interview Process | Dress Code


    Software engineers and those in similar positions typically dress less formally.
    A good rule of thumb for any interview is to dress one small notch better than
    the employees in your position.


    More specifically, I would recommend the following attire for software engineering
    (and testing) interviews. These rules are designed to put you in the "safe zone":
    not too dressy, and not too casual. Many people interview at startups and big
    companies in jeans and a t-shirt and don''t face any problems. After all, your
    coding skills matter more than your sense of style.


    | Start-Ups | Microsoft, Google, Amazon, Facebook, e.t.c. | Non-Tech Companies
    (including banks) |

    |---|---|---|n| Men | Khakis, slacks, or nice jeans. Polo shirt or dress shirt.
    | Khakis, slacks, or nice jeans. Polo shirt or dress shirt. | Suit, no tie. (Consider
    bringing a tie just in case.) |

    | Women | Khakis, slacks, or nice jeans. Nice top or sweater. | Khakis, slacks,
    or nice jeans. Nice top or sweater. | Suit, or nice slacks with a nice top. |


    These are just good advisements, and you should consider the culture of the company
    with which you are interviewing. If you are interviewing for a Program Manager,
    Dev Lead, or any role closer to management or the business side, you should lean
    towards the more dressy side.'
