  md: '# 12


    # # Testing


    Before you flip past this chapter saying, "But I''m not a tester," stop and think.
    Testing is an important task for a software engineer, and for this reason, testing
    questions can come up during your interview. Of course, if you are applying for
    Testing roles (or Software Engineer in Test), then that''s all more reason why
    you need to pay attention.


    Testing problems usually fall under one of four categories: (1) Test a real world
    object (like a pen); (2) Test a piece of software; (3) Write test code for a function;
    (4) Troubleshoot an existing issue. We''ll cover approaches for each of these
    four types.


    Remember that all four types require you not to make an assumption that the input
    or the user will play nice. Expect abuse and plan for it.


    # ## What the Interviewer Is Looking For


    At their surface, testing questions seem like they''re just about coming up with
    an list of test cases. And to some extent, that''s right. You do need to come
    up with a reasonable list of test cases.


    But in addition, interviewers want to test the following:


    +   - Big Picture Understanding: Are you a person who understands what the software
    is really about? For example, suppose you''re asked to test an e-commerce system
    like Amazon. It''s great to make sure that the product images appear in the right
    place, but it''s even more important that payments work reliably, products are
    added to the shipment queue, and customers are never double charged.

    - Knowing How the Pieces Fit Together: Do you understand how software works, and
    how it might fit into a greater ecosystem? Suppose you''re asked to test Google
    Spreadsheets. It''s important that you test opening, saving, and editing documents.
    But, Google Sheets is part of a larger ecosystem. You need to test integration
    with Gmail, with plug-ins, and with other components.'
  merge: -1
