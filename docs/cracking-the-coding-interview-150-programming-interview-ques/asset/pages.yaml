- img_proc: true
  md: '# V. Behavioral Questions | Handling Behavioral Questions


    This technique grabs your interviewer''s attention and makes it very clear what
    your story will be. If you have a tendency to ramble, it also helps you to be
    more focused in your communication, since you''ve made it clear to yourself what
    the gist of your response is.


    S.A.R. (Situation, Action, Result)


    The S.A.R. approach means that when you start out outlining the situation, then
    explaining the actions you do, and lastly, describing the result.


    Example: "Tell me about a challenging interaction with a teammate."


    +   **Situation:** On my operating systems project, I was assigned to work with
    three other people. While two were great, the third member didn''t contribute
    much. He stayed quiet during meetings, rarely chipped in during email discussions,
    and struggled to complete his components.


    +   **Action:** One day after class, I pulled him aside to speak about the course
    and then moved the discussion into talking about the project. I asked him open-ended
    questions about how it was going and which components he was most excited about
    tackling. He suggested all the easiest components, and yet offered to do the write-up.
    I realized then I made sure to compliment him a lot on his work to boost his confidence.
    I realized then that he wasn''t lazy—he was actually just confused about the project
    and lacked confidence. I worked with him after that to break down the components
    into smaller pieces.


    +   **Result:** He was still the weakest member of the team, but he got a lot
    better. He was able to finish all his work on time, and he contributed more in
    discussions. We were happy to work with him on a future project.


    The situation and the result should be very succinct. Your interviewer generally
    does not need details to understand what happened and, in fact, may be confused
    by them.


    By using the S.A.R. model with clear situations, actions and results, the interviewer
    will be able to easily identify how you made an impact and why it mattered.'
