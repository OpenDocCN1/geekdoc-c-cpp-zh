  md: '# Solutions to Chapter 5 | Bit Manipulation


    5.4 Explain what the following code does: ((n & (n-1)) == 0).


    # SOLUTION


    We can work backwards to solve this question.


    What does it mean if A & B == 0?


    It means that A and B never have a 1 bit in the same place. So if n & (n-1) ==
    0, then n and n-1 share a 1.


    What does n-1 look like (as compared with n)?


    Try subtracting by hand (in base 2 or 10). What happens?


    ```

    110101000 [base 2]      591300 [base 10]

    -1                        1

    =110101111 [base 2]      593099 [base 10]

    ```


    When you subtract 1 from a number, look at the least significant bit. If it''s
    a 1 change it to 0, and you are done. If it''s a zero, you must "borrow" from
    a larger bit. So, you go to increasing larger bits, changing each bit from a 0
    to a 1, until you find a 1. You flip 1 to 0 and you are done.


    Thus, n-1 will look like like n, except that n''s initial 0s will be 1s in n-1,
    and n''s least significant will be a 0 in n-1. That is:


    ```

    if n = abcde1000

    then n-1 = abcde0111

    ```


    What does n & (n-1) == 0 indicate?


    n and n-1 must have no 1s in common. Given that they look like this:


    ```

    if n = abcde1000

    then n-1 = abcde0111

    ```


    abcde must be all 0s, which means that n must look like this: 00001000. The value
    n is therefore a power of two.


    So, we have our answer: ((n & (n-1)) == 0) checks if n is a power of 2 (or if
    n is 0).


