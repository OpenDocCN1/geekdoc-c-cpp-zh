  md: '# VI. Technical Questions | Five Algorithm Approaches


    Eventually, we can build a solution that can always compute the result for N if
    we know the correct result for N-1. It may not be N equals 3 or 4 that we know
    the instance that''s interesting enough to try to build the solution based on
    the previous result.


    Example: Design an algorithm to print all permutations of a string. For simplicity,
    assume all characters are unique.


    Consider a test string abcdef.


    ```

    Case "a" -> {"a"}

    Case "ab" -> {"ab", "ba"}

    Case "abc" -> ?

    ```


    This is the first "interesting" case. If we had the answer to P("ab"), how could
    we generate P("abc")? The additional letter is "c", so we could just stick c in
    every point.


    ```

    P("abc") = insert("c" into all locations of all strings in P("ab")

    P("abc") = insert("c" into all locations of all strings in P("ab", "ba")

    P("abc") = merge({"cab", "acb", "abc"}, {"bca", "cba", "bac"})

    ```


    Now that we understand the pattern, we can develop a general recursive algorithm.
    We generate all permutations of a string s₁...sₙ by "chopping off" the last character
    and generating all permutations of s₁...s_{n-1}. Once we have the list of permutations
    of s₁...s_{n-1}, we iterate through this, and for each string in it, we insert
    s_n into every location of the string.


    Base Case and Build algorithms often lead to natural recursive algorithms.


    # Approach V: Data Structure Brainstorm


    This approach is somewhat hacked, but it works. We can simply run through a list
    of data structures and apply each one. This approach is useful because solving
    a problem may be trivial if it occurs to us to use, say, a tree.


    Example: Numbers are randomly generated and stored into an (expanding) array.
    How would you keep track of the median?


    Our data structure brainstorm might look like the following:


    +   - Linked list? Probably not. Linked lists tend not to do well with accessing
    and sorting numbers.


    +   - Array? Maybe, but you already have an array. Could you somehow keep the
    elements sorted? That''s probably expensive. Let''s hold off on this and return
    to it if it''s needed.


    +   - Binary tree? This is possible, since binary trees do fairly well with ordering.
    In fact, the binary search tree is perfectly balanced, the top might be the median.
    But, be careful—if there''s an even number of elements, the median is actually
    the average of the middle two elements. The middle two elements can''t both be
    at the top.


    S4 Cracking the Coding Interview'
