    | | x1 | x2 |

    |---|---|---|

    | y1 | A | C |

    | y2 | B | D |


    Suppose we knew the following values:


    ```

    ValD = area(point(0, 0)) -> point(x2, y2))

    ValC = area(point(0, 0)) -> point(x2, y1))

    ValB = area(point(0, 0)) -> point(x1, y2))

    ```


