    # 14.4  Explain the difference between templates in C++ and generics in Java.


    pg 145


    # SOLUTION


    Many programmers consider the concepts of templates and generics to be equivalent
    simply because both allow you to do something along the lines of List<String>.
    But, how each language does this, and why, varies significantly.


    The implementation of Java generics is rooted in an idea of "type erasure". This
    technique eliminates the parameterized types when source code is translated to
    the Java Virtual Machine (JVM) bytecode.


    For example, suppose you have the Java code below:


    ```

    Vector<String> vector = new Vector<String>();

    vector.add(new String("hello"));

    String str = vector.get(0);

    ```


    During compilation, the code is re-written into:


    ```

    Vector vector = new Vector();

    vector.add(new String("hello"));

    String str = (String) vector.get(0);

    ```


    The use of Java generics didn''t really change about our capabilities: it just
    made things a bit prettier. For this reason, Java generics are called "synthetic
    sugar."


    This is quite different from C++. In C++, templates are essentially a glorified
    macro set, with the compiler creating a new copy of the template code for each
    type. Proof of this is in the fact that an instance of MyClass<Foo> will not share
    a static variable with


