    # ## The Alternative Approach


    An alternative approach is to search through the larger tree, T1. Each time a
    node in T1 matches the root of T2, call treeMatch. The treeMatch method will compare
    the two subtrees if they are identical.


    Analyzing the runtime is somewhat complex. A naive answer would be to say that
    it is O(nm), where n is the number of nodes in T1 and m is the number of nodes
    in T2. While this is technically correct, a little more could produce a tighter
    bound.


    We do not actually call treeMatch on every node in T. Rather, we call k times,
    where k is the number of occurrences of T2''s root in T1. The runtime is closer
    to O(n + km).


    In fact, even that overstates the runtime. Even if the root were identical, we
    exit treeMatch when we find a difference between T1 and T2. We therefore probably
    do not actually look at m nodes on each call of treeMatch.


    The code below implements algorithm:


    ```

