  md: '# About the Author


    Gayle Laakmann McDowell has worked for Microsoft, Apple, and Google as a software
    engineer.


    Most recently, McDowell spent three years as a Software Engineer, where she was
    one of the company''s lead interviewers and served on Google''s hiring committee.
    She interviewed over 150 candidates in the U.S. and abroad, assessed over 1000
    candidate interview packets for the hiring committee, and reviewed hundreds of
    resumes.


    In addition to her experience as an interviewer, she has interviewed with—and
    received offers from twelve tech companies, including Microsoft, Google, Amazon,
    IBM, and Apple.


    In 2005, McDowell founded CareerCup.com to bring her wealth of experience on both
    sides of the interview table to candidates. CareerCup.com offers a database of
    thousands of interview questions from major companies and a forum for interview
    advice.


    McDowell''s second book, The Google Resume: How to Prepare for a Career and Land
    a Job at Apple, Microsoft, Google or Any Top Tech Company, provides a broader
    look at the interview process for major tech companies. It offers insight on how
    anyone, from college freshmen to marketing professionals, can position themselves
    for a career at one of these companies.


    McDowell holds a bachelor''s and master''s degree in Computer Science from the
    University of Pennsylvania and an MBA from the Wharton School.


    She lives in Palo Alto, California.


