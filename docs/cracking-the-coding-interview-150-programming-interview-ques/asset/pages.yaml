  md: '# IV. Before the Interview | Writing a Great Resume


    Resume screeners look for the same things that interviewers do. They want to know
    that you are smart and that you can code.


    That means you should prepare your resume to highlight those two things. Your
    love of tennis, traveling, or magic cards will not do much to show that. Twice
    before cutting more technical lines in order to allow space for your non-technical
    hobbies.


    # Appropriate Resume Length


    In the US, it is strongly advised to keep a resume to one page if you have less
    than ten years of experience, and no more than two pages otherwise. Why is this?
    Here are two great reasons to do this:


    +   - Recruiters only spend a fixed amount of time (about 20 seconds) looking
    at your resume. If you limit the content to the most impressive items, the recruiter
    is sure to see them. Adding additional items just distracts the recruiter from
    what you''d really like them to see.

    - Some people just flat-out refuse to read long resumes. Do you really want to
    risk having your resume tossed for this reason?


    If you are thinking right now that you have too much experience and can''t fit
    it all on one page, trust me, you can. Everyone says this at first. Long resumes
    are not a reflection of having tons of experience; they''re a reflection of not
    understanding how to prioritize content.


    # Employment History


    Your resume does not—and should not—include a full history of every role you''ve
    ever had. Your job serving ice cream, for example, will not show that you''re
    smart or that you can code. You should include only the relevant positions.


    # Writing Strong Bullets


    For each role, to discuss your accomplishments with the following approach: "Accomplished
    X by implementing Y which led to Z." Here''s an example:


    +   - Reduced object rendering time by 75% by implementing distributed caching,
    leading to a 10% reduction in log-time."


    Here''s another example with an alternating wording:


    +   - "Increased match accuracy from 1.2 to 1.5 by implementing a new comparison
    algorithm based on windiff."


    Not everything you did will fit into this approach, but the principle is the same:
    show what you did, how you did it, and what the results were. Ideally, you should
    try to make the results "measurable".'
