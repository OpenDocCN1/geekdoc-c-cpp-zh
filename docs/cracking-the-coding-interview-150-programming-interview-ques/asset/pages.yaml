    the last element, k = 2 would return the second to last element, and so on. It
    is equally acceptable to define k such that k = 0 would return the last element.


    # Solution #1: If linked list size is known


    If the size of the linked list is known, then the kth to last element is the (length
    - k) element. We can just iterate through the linked list to find this element.
    Because this is so trivial, we can almost be sure that this is not what the interviewer
    intended.


    # Solution #2: Recursive


    This algorithm recurses through the linked list. When it hits the end, the method
    passes a back counter to 0. Each parent call adds 1 to this counter. When the
    counter equals k, we have reached the kth to last element of the linked list.


