  md: "# Solutions to Chapter 17 | Moderate\n\n17.1 Write a function to swap a number\
    \ in place (that is, without temporary variables).\n\npg 163\n\n# SOLUTION\n\n\
    This is a classic interview problem, and it's a reasonably straightforward one.\
    \ We'll walk through this using $a_o$ to indicate the original value of a and\
    \ $b_o$ to indicate the original value of b. We'll also use diff to indicate the\
    \ value of $a_o - b_o$.\n\nLet's picture these on a number line for the case where\
    \ $a > b$.\n\n![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_439_0.png)\n\nFirst, we\
    \ briefly set a diff, which is the right side of the above number line. Then,\
    \ when we add b and diff (and store that value in b), we get $a_o$. We now have\
    \ $b = a_o$ and $a = diff$. All that's left to do is set a equal to $a_o - diff$,\
    \ which is just $b - a$.\n\nThe code below implements this.\n\n```\npublic static\
    \ void swap(int a, int b) {\n    // Example for a = 9, b = 4\n    a = b; // a\
    \ = 9 - 4 = 5\n    b = a + b; // b = 5 + 4 = 9\n    a = b - a; // a = 9 - 5\n\n\
