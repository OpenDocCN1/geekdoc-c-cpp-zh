  md: '# V. Behavioral Questions | Handling Behavioral Questions


    As stated earlier, interviews usually start and end with "chat chit" or "soft
    skills." This is a time for your interviewer to ask you about resume or general
    questions, and it''s also a time for you to ask your interviewer about the company.
    This part of the interview is targeted at getting to know you, as well as relaxing
    you.


    Remember the helpful advice when responding to questions.


    # Be Specific, Not Arrogant


    Arrogance is a red flag, but you still want to make yourself sound impressive.
    So how do you make yourself sound good without being arrogant? By being specific!


    Specificity means giving just the facts and letting the interviewer derive an
    interpretation. Consider an example:


    +   - Candidate #1: "I basically did the hard work for the team."

    - Candidate #2: "I implemented the file system, which was considered one of the
    most challenging components because..."


    Candidate #2 not only sounds more impressive, but she also appears less arrogant.


    # Limit Details


    When a candidate blabbers about a problem, it''s hard for an interviewer who isn''t
    well versed in the subject or project to understand it. Stay light on details
    and just state the key points. That is, consider something like this: "By examining
    the most, I designed a new algorithm to reduce search from O(n) to O(log n) in
    90% of cases. I can go into more details if you''d like."This demonstrates the
    key points while letting your interviewer ask for more details if he wants.


    # Give Structured Answers


    There are two common ways to think about structuring responses to a behavioral
    question: nugget first and S.A.R. These techniques can be used separately or together.


    # Nugget First


    Nugget First means starting your response with a "nugget" that succinctly describes
    what your response will be.


    For example:


    +   - Interviewer: "Tell me about a time you had to persuade a group of people
    to make a big change."

    - Candidate: "Sure, let me tell you about the time when I convinced my school
    to let undergraduates teach their own courses. Initially, my school had a rule..."'
