  md: '# Chapter 7 | Mathematics and Probability


    # Probability


    Probability can be a complex topic, but it''s based in a few basic laws that can
    be logically derived.


    Let''s use a Venn diagram to visualize two events A and B. The areas of the two
    circles represent their relative probability, and the overlapping area is the
    event {A and B}.


    ![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_109_0.png)


    # Probability of A and B


    Imagine you were throwing a dart at this Venn diagram. What is the probability
    that you would land in the intersection between A and B? If you knew the odds
    of landing in A, and you also knew the percent of A''s also in B (that is, the
    odds of being in B given that you were in A), then you could express the probability
    as:


    ```

    P(A and B) = P(B given A) P(A)

    ```


    For example, imagine we were picking a number between 1 and 10 (inclusive). What''s
    the probability of picking an even number and a number between 1 and 5? The odds
    of picking a number between 1 and 5 is 50%, and the odds of a number between 1
    and 5 being even is 40%. So, the odds of both are:


    +   - P(x is even and <= 5)

    - P(x is even given x <= 5) P(x <= 5)

    - (2/5) * (1/2)

    - 1/5


    # Probability of A or B


    Now, imagine you wanted to know the probability of landing in A or B is. If you
    knew the odds of landing in each individually, and you also knew the odds of landing
    in their intersection, then you could express the probability as:


    ```

    P(A or B) = P(A) + P(B) - P(A and B)

    ```


    Logically, this makes sense. If we simply added their sizes, we would have double-counted
    their intersection. We need to subtract this out. We can again visualize through
    a Venn diagram:


    ![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_109_1.png)


    For example, imagine we were picking a number between 1 and 10 (inclusive). What''s
    the probability of picking an even number or a number between 1 and 5? We have
    a 50% probability of picking an even number and a 50% probability of picking a
    number'
