    # ## Java


    While Java-related questions are found throughout this book, this chapter deals
    with questions about the language and syntax. Such questions are more unusual
    at bigger companies, which believe more in testing a candidate''s aptitude than
    a candidate''s knowledge (and which have the time and resources to train a candidate
