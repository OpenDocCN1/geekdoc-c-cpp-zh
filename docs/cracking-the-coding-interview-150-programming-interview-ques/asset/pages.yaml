  md: '# I. The Interview Process | Top 10 Mistakes


    # #1 | Practicing on a Computer


    If you were training for an ocean swim race, would you practice only by swimming
    in a pool? Probably not. You''d want to get a feel for the waves and other "terrain"differences.
    I bet you''d want to practice in the ocean, too.


    Using a compiler to practice interview questions is like doing all your training
    in the pool. Put away the compiler and get out the old pen and paper. Use a compiler
    only to verify your solutions after you''ve written and hand-tested your code.


    # #2 | Not Rehearsing Behavioral Questions


    Many candidates spend all their time prepping for technical questions and overlook
    the behavioral questions. Guess what? Your interviewer is judging you too!


    And, not only that—your performance on behavioral questions might bias your interviewer''s
    perception of your technical performance. Behavioral prep is relatively easy and
    well-worth your time. Look over your projects and positions and rehearse your
    key stories.


    # #3 | Not Doing a Mock Interview


    Imagine you''re preparing for a big speech. Your whole school, company, or whatever
    will be there. Your future depends on it. You''d be crazy to only practice the
    speech silently in your head.


    Not doing a mock interview to prepare for your real one is just like this. If
    you''re an engineer, you must know other engineers. Grab a buddy and ask him/her
    to do a mock interview with you. You can return the favor!


    # #4 | Trying to Memorize Solutions


    Memorizing the solution to a specific problem will help you solve that one if
    it comes in an interview, but it won''t help you solve new problems. It''s very
    unlikely that all, or even most, of your interview questions will come from this
    book.


    It''s much more effective to struggle through the problems in this book yourself,
    without flipping to the solutions. This will help you develop strategies to approach
    new problems. Even if you review fewer problems in the end, this kind of preparation
    will go much further. Quality beats quantity.


    # #5 | Not Solving Problems Out Loud


    Psst—let tell you a secret: I don''t know what''s going on in your head. If you
    aren''t talking, I don''t know what you''re thinking. If you don''t talk for a
    long time, I''ll assume that you aren''t making any progress. Speak up often,
    and try to talk your way through a solution. This shows your interviewer that
    you''re tackling the problem and aren''t stuck.


    ![](img/34a2b3cc4c8dcd9dc08cbc0136fb66a1_22_0.png)'
