  md: '# Chapter 5 | Bit Manipulation


    # Clear Bit


    This method operates in almost the reverse of setBit. First, we create a number
    11101111 by creating the reverse of it (00010000) and negating it. Then, we perform
    an AND with num. This will clear the ith and leave the remainder unchanged.


    ```

    1 int clearBit(int num, int i) {

    2 int mask = ~(1 << i);

    3 return num & mask;

    4 }

    ```


    To clear all bits from the most significant bit through i (inclusive), we create
    a mask with 1 at the ith bit (1 << i). Then, we subtract 1 from it, giving us
    a sequence of 0s followed by 1s. Then we AND our num with this mask to leave the
    last i bits.


    ```

    1 int clearBitsMSBThrough(int num, int i) {

    2 int mask = (1 << i) - 1;

    3 return num & mask;

    4 }

    ```


    To clear bits through 0 (inclusive), we take a sequence of all 1s (which is -1)
    and shift it over 31 - i bits. By using the >>> operator, we shift the initial
    1 as well as sign bit. This gives us a sequence of 1 followed by i 0 bits.


    ```

    1 int clearBitsThrough(int num, int i) {

    2 int mask = ~(1 >>> (31 - i));

    3 return (num & mask);

    4 }

    ```


    # Update Bit


    To set the ith to a value v, we first clear the bit at position i using a mask
    that looks like 11101111. Then, we shift the intended value, left by i bits. This
    will create a number with ith equal to v and all other bits equal to 0. Finally,
    we OR these two numbers, updating the ith bit if v is 1 and leaving it otherwise.


    ```

    1 int updateBit(int num, int i, int v) {

    2 int mask = ~(1 << i);

    3 return (num & mask) | (v << i);

    4 }

    ```


