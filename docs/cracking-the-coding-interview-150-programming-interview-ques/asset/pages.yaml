    Let''s start with an example. Suppose we have the following moves in an Othello
    game:


    +   1. Initialize the board with two black and two white pieces in the center.
    The black pieces are placed at the upper left hand and lower right corners.

    2. Play a black piece at (row 6, column 4). This flips the piece at (row 5, column
