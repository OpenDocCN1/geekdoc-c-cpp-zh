  md: '# I. The Interview Process | Frequently Asked Questions


    Should I tell my interviewer if I know a question?


    Yes! You should definitely tell your interviewer if youve previously heard the
    question. This seems silly to some people—if you already know the question (and
    answer), you could ace the question, right? Not quite.


    Here''s why we strongly recommend that you tell your interviewer that you''ve
    heard the problem before:


    +   1. Big honesty points. This shows a lot of integrity—that''s huge! Remember
    that the interviewer is evaluating you as a potential teammate. I don''t know
    about you, but I personally prefer to work with honest people.


    +   2. The question might have changed over ever so slightly. You don''t want
    to risk repeating the wrong answer.


    +   3. If you easily built out the answer, it''s obvious to the interviewer. They
    know how difficult a problem is supposed to be. If you instead try to pretend
    to struggle through a problem, you may very well wind up “struggling” too much
    and coming off unqualified.


    # What language should I use?


    Many people will tell you whatever language you''re most comfortable with, ideally
    you want to use a language that your interviewer is comfortable with. I''d usually
    recommend coding in C, C++ or Java, as the vast majority of interviewers will
    be comfortable in one of these languages. My personal preference for interviews
    is Java (unless it''s requiring C (C++), because it''s easier to write and almost
    everyone can read and understand Java, even if they code in C++. For this reason,
    almost all the solutions in this book are written in Java.


    # I didn''t hear back immediately after my interview. Am I rejected?


    No. Almost every company intends to tell when they''re rejected. Not hearing back
    quickly could mean anything. You might have done well, but the recruiter is on
    vacation and can''t process your offer. The company might be going through a re-org
    and be unclear what their head count is. Or, it might be that you did poorly,
    but you got stuck with a lazy or overworked recruiter who hasn''t got a chance
    to notify you. It''s a strange company that actually decides, “Hey, we''re rejecting
    this person, so we just won''t respond.” It''s in the company''s best interest
    to notify you of your ultimate decision. Always follow up.


    # Can I re-apply to a company after getting rejected?


    Always maybe, but you typically have to wait a bit (6 months – 1 year). Your first
    interview usually won''t affect you too much when you re-interview. Lots of people
    get rejected from Google or Microsoft and later get offers.


    CrackingTheCodingInterview.com 15'
