    # Small Database Design


    Additionally, you might be asked to design your own database. We''ll walk you
    through an approach for this. You might notice the similarities between this approach
    and the approach for object-oriented design.


    # Step 1: Handle Ambiguity


    Database questions often have some ambiguity, intentionally or unintentionally.
    Before you proceed with your design, you must understand exactly what you need
    to design.


    Imagine you are asked to design a system to represent the apartment rental agency.
    You will need to know whether this agency has multiple locations or just one.
    You should also discuss with your interviewer how general you should be. For example,
    it would be extremely rare for a person to rent two apartments in the same building.
    But does that mean you should be able to handle that? Maybe, maybe not. Some rare
    conditions might be best handled through a work around (like duplicating the person''s
    contact information in the database).


    # Step 2: Define the Core Objects


    Next, we should look at the core objects of our system. Each of these core objects
    typically translates into a table. In this case, our core objects might be Property,
    Building, Apartment, Tenant and Manager.


    # Step 3: Analyze Relationships


    Outlining the core objects should give us a good sense of what the tables should
    be. How do these tables relate to each other? Are they many-to-many? One-to-many?


    If Buildings has a one-to-many relationship with Apartments (one Building has
    many Apartments), then we might represent this as follows:'
