    # Part 1: Detect If Linked List Has A Loop


    An easy way to detect if a linked list has a loop is through the FastRunner /
    Slow-Runner approach. FastRunner moves two steps at a time, while SlowRunner moves
    one step. Like much two cars racing around a track at different steps, they must
    eventually meet.


    An astute reader may wonder if FastRunner "hop over" SlowRunner completely, without
    ever colliding. That''s not possible. Suppose FastRunner did dip over SlowRunner,
    such that SlowRunner is at spot i and FastRunner is at spot i +1. In the previous
    step, SlowRunner moves at spot i-1 and FastRunner would be at spot ((i + 1) -
    2), or spot i - 1. That is, they would have collided.


    # Part 2: When Do They Collide


    Let''s assume that the linked list has a "non-looped" part of size k.


    If we apply our algorithm from part 1, when will FastRunner and SlowRunner collide?


    We know that for p steps that SlowRunner takes, FastRunner has 2p steps. When
    SlowRunner enters the looped portion after k steps, FastRunner has 2k steps total
    and must be 2k - k steps, or k steps, into the looped portion. Since k might be
    much larger than the loop length, we should actually write this as mod(k, LOOP_SIZE)
    steps, which we will denote as K.


    At each subsequent step, FastRunner and SlowRunner get either one step farther
    away or one step closer, depending on your perspective. That is, because we are
    in a circle, when A moves q steps away from B, it is also moving q steps closer
    to B.


    So now we know the following facts:


    +   1. SlowRunner is into the loop.

    2. FastRunner is K steps into the loop.

    3. SlowRunner is K steps behind FastRunner.

    4. FastRunner is LOOP_SIZE - K steps behind SlowRunner.

    5. FastRunner catches up to SlowRunner at a rate of 1 step per unit of time.


    So, when do they meet? Well, if FastRunner is LOOP_SIZE - K steps behind SlowRunner,
    and FastRunner catches up at a rate of 1 step per unit of time, then they meet
    after LOOP_SIZE - K steps. At this point, they will be K steps before the head
    of the loop. Let''s call this point CollisionSpot.'
