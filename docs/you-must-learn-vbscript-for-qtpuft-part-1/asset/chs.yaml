  \n## Rex Jones 的联系方式\n\n***\n\n电子邮箱：Rex.Jones@Test4Success.org\nLinkedIn：[`www.linkedin.com/in/rexjones34`](https://www.linkedin.com/in/rexjones34)\n\
  Twitter: @RexJonesII\nSkype: rex.jones34\n\n# 前言\n\n我必须承认，编写这本关于 `QTP/UFT` 的书是一项挑战。这种挑战源于互联网上无无限制的信息访问。书中的所有信息都可以散落在各个搜索引擎、博客等地方被找到。然而，如果你正在寻找一个整合后的资源，那么这本书就是适合你的。\n\
  \n## 目标读者群\n\n目标读者群是初学者和中级自动化工程师。初学者是指刚接触 `QTP/UFT` 的人员，他们需要学习比 `VBScript` 基础知识更多的内容。中级自动化工程师是具备\
  \ `VBScript` 知识但希望刷新自己编程技能的人员。不需要预先具备 `VBScript` 知识或编程概念。然而，关于 `QTP/UFT` 的一个误区是认为开发技能并非必要。事实是，开发技能是非常必要的。\n\
  \n## 为什么要学习 VBScript？\n\n你能想象去到一个外国旅行，在不学习当地语言的情况下尝试与当地人交流吗？这与在不学习 `VBScript` 的情况下与\
  \ `QTP/UFT` 通信相似。本书的目的是帮助自动化工程师理解，如果没有坚实的 `VBScript` 基础，无法完全优化 `QTP/UFT`。大多数 `QTP/UFT`\
  \ 书籍和培训课程犯的错误是没有提供关于 `VBScript` 编程语言的可靠信息。这些书籍和培训课程仅关注 `QTP/UFT`，导致自动化工程师在自动化项目中挣扎。自动化是应用程序测试的未来。利用这个机会学习\
  \ `VBScript`吧。\n\n## 关于作者\n\n![](img/00096.jpg)\n\nRex Allen Jones II 是一位 QA/软件测试员，热于分享软件测试知识。自\
  \ 2005 年 2 月以来，他一直在观看网络研讨会、参加会议并测试应用程序。Jones 先生于 1999 年 6 月毕业于 `DeVry University`，获得计算机信息系统\
  \ (`CIS`) 理学士学位。\n\n目前，Rex 是 `User Group: Dallas / Fort Worth Mercury User Group`\
  \ (`DFWMUG`) 的顾问和董事会成员，也是 `User Group: Dallas / Fort Worth Quality Assurance Association`\
  \ (`DFWQAA`) 的活跃成员。除了用户小组成员外，他还是认证软件测试工程师 (`CSTE`) 并拥有测试管理方法 (`TMap`) 认证。\n\nJones\
  \ 先生对对功能自动化测试感兴趣的人建议是学习编程语言。这一建议引导他写了两本书“（第一部分和第二部分）你必须为 QTP/UFT 学习 VBScript”，这些书针对\
  \ `VBScript`，它是统一功能测试 (`UFT`，原 Quick Test Professional (`QTP`)）的编程语言。此外，还有两本即将出版的针对\
  \ `Java` 的书籍，它是 Selenium 的编程语言之一。\n\n## 关于编辑\n\n![](img/00111.jpg)\n\n当 Samantha\
