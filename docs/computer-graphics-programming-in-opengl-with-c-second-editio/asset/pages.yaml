    ![](img/1695de1bc7486362f86c143285f3fb40_385_0.png)


    Figure 15.4 illustrates that the textures in the reflection and refraction buffers
    are already in the desired screen position. Therefore, all we need to do is use
    the *screen coordinates of the object being textured* (in this case, the top water
    surface), as the coordinates which are used to access the textures in the reflection
    and refraction buffers. The screen coordinates have already been computed in the
    vertex shader and are found in the (x,y) portion of the variable gl_Position.
    We merely need to pass a copy of gl_Position from the vertex shader to the fragment
    shader (as a varying vertex attribute) and use the .xy portion of that as the
    texture coordinates.


    This technique is a simple case of *projective texture mapping* [E01], which can
    be used in cases where some portion of the scene appears on an object. A common
    example is building a mirror (which, in a sense, we are doing here in the case
    of the reflection buffer). It is called “projective” because it is similar to
    projecting a scene onto an object like a projection screen.


    We are now ready to complete Program 15.3. In part three, the reflection and refraction
    textures are incorporated onto the water’s top surface. To do this, the C++/OpenGL
    application needs to make the reflection and refraction buffers available to the
    shaders for rendering the top surface. The fragment shader for the top surface
    of the water is where the reflection and refraction textures are applied. The
    vertex shader copies gl_Position into the new vertex attribute named glp and passes'
