    Elements of look-at.


    A look-at transform still requires deciding on a camera orientation. We do this
    by specifying a vector approximating the general orientation desired (such as
    the world Y̅ axis). Typically, a sequence of cross products can be used to then
    generate a suitable set of forward, side, and up vectors for the desired camera
    orientation. Figure 3.20 shows the computations, starting with the camera location
    (eye), target location, and initial up vector Y̅, to build the look-at matrix,
    as derived in [FV95].


    ```

    ```

    fwd = normalize(eye - target)

    side = normalize(-fwd × Y̅)

    up = normalize(side × -fwd)


    The look-at matrix then equals:


    [ side_x   side_y   side_z   -(side • eye) ]

    [ up_x     up_y     up_z     -(up • eye)   ]

    [ -fwd_x   -fwd_y   -fwd_z   -(-fwd • eye) ]

    [ 0        0        0        1             ]

    ```

    ```


    **Figure 3.20**

    Look-At matrix.'
