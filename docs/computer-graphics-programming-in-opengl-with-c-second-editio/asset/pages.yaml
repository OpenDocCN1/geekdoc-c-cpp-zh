  md: '![](img/1695de1bc7486362f86c143285f3fb40_150_0.png)


    We can systematically use our knowledge of the geometry of a circle to algorithmically
    build a sphere model. Our strategy is as follows:


    +   1. Select a *precision* representing a number of circular regions the sphere
    is divided into. In the left side Figure 6.2, the sphere is sliced into four regions.

    +   2. Subdivide the circumference of each circular slice into some number of
    points. See the right side of Figure 6.2. More points and horizontal slices produces
    a more accurate and smoother model of the sphere. In our model, *each slice will
    have the same number of points, including at the very top and bottom (where those
    points are coincident).*


    ![](img/1695de1bc7486362f86c143285f3fb40_150_1.png)


    +   3. Group the vertices into triangles. One approach is to step through the
    vertices, building two triangles at each step. For example, as we move along the
    row of the five colored vertices on the sphere in Figure 6.3, for each of those
    five vertices we build the two triangles shown in the corresponding color (the
    steps are described in greater detail below).'
