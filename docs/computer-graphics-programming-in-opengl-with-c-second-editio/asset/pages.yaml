  md: 'transparent objects. Then, whichever surface is encountered behind the 2nd
    object is what we would see. If the transparent objects were boxes (or spheres),
    how many rays would be required for the final object to appear? An example is
    shown in Figure 16.17, in which a green star is viewed through two transparent
    boxes. Since each transparent object would generally require two secondary rays
    (one entering the object and one leaving the object), we would need a total of
    five rays.


    ![](img/1695de1bc7486362f86c143285f3fb40_453_0.png)


    However, that is not what the code we have built so far will do. Rather, we have
    hard-coded functions raytrace1(), raytrace2(), and raytrace3() that result in
    a maximum sequence of three rays (ignoring the shadow ray). So, in the example
    shown in Figure 16.17, the sequence of rays would stop at the second transparent
    object, and we wouldn''t see the star at all. As the need for longer and longer
    sequences of rays increases, we cannot keep making more copies of the raytrace()
    function, as such a solution would not be scalable.


    Another similar situation occurs if we have two highly reflective objects facing
    each other. Anyone who has done this with two mirrors knows the effect as they
    reflect back and forth between each other. Figure 16.18 shows such an example
    generated by one of the authors at his home. Our code could only do two reflections,
    but no subsequent reflections. A much longer sequence of rays is needed to achieve
    this effect.


    ![](img/1695de1bc7486362f86c143285f3fb40_453_1.png)


    We actually faced this situation in the previous example from Program 16.11 (Figure
    16.16) because both the box and the sphere were reflective. The effects of any
    additional rays in that particular example would be negligible, and in such cases,
    a depth of one or two rays is sufficient. However, in those cases where the additional
    rays are needed to achieve realistic results, we need a way of generating more
    rays.'
