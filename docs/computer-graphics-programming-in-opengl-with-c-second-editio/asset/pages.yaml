  md: "Shadow acne can also be caused by differences in precision between the texture\
    \ map and the depth computation. This too can lead to rounding errors and subsequent\
    \ incorrect assessment of whether or not a pixel is in shadow.\n\nFortunately,\
    \ fixing shadow acne is fairly easy. Since shadow acne typically occurs on surfaces\
    \ that are *not* in shadow, a simple trick is to move every pixel slightly closer\
    \ to the light during pass one, and then move them back to their normal positions\
    \ for pass two. This is usually sufficient to compensate for either type of rounding\
    \ error. An easy way is to call glPolygonOffset() in the display() function, as\
    \ shown in Figure 8.12 (highlighted).\n\nAdding these few lines of code to our\
    \ display() function improves the output of our program considerably, as shown\
    \ in Figure 8.13. Note also that with the artifacts gone, we can now see that\
    \ the inner circle of the torus displays a small correctly cast shadow on itself.\n\
    \n```\n```cpp\nvoid Display(GLFWindow* window, double currentTime) {\n    // clearing\
    \ the depth and color buffers as before goes here\n    ...\n    // setting up\
    \ matrices for camera and light points of view as before goes here\n    ...\n\
    \    glBindFramebuffer(GL_FRAMEBUFFER, shadowBuffer);\n    glFramebufferTexture(GL_FRAMEBUFFER,\
    \ GL_DEPTH_ATTACHMENT, shadowTex, 0);\n\n    glDrawBuffer(GL_NONE);\n    glEnable(GL_DEPTH_TEST);\n\
    \n    // for reducing shadow artifacts\n    glEnable(GL_POLYGON_OFFSET_FILL);\n\
    \    glPolygonOffset(2.0f, 4.0f);\n\n    passOne();\n\n    glDisable(GL_POLYGON_OFFSET_FILL);\n\
    \n    glBindFramebuffer(GL_FRAMEBUFFER, 0);\n    glActiveTexture(GL_TEXTURE0);\n\
    \    glBindTexture(GL_TEXTURE_2D, shadowTex);\n    glDrawBuffer(GL_FRONT);\n\n\
    \    passTwo();\n}\n```\n```\n\n**Figure 8.12**\nCombining shadow acne."
