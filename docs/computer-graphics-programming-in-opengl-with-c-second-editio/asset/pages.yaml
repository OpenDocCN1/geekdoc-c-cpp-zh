- pgno: 307
  md: 'The cause of this problem is the resolution of the tessellated grid. The maximum
    number of vertices that can be generated by the tessellator is hardware dependent,
    and a maximum value of at least 64 for each tessellation level is all that is
    required for compliance with the OpenGL standard. Our program specified a single
    tessellated grid with inner and outer tessellation levels of 32, so we generated
    about 32*32, or just over 1000 vertices, which is insufficient to reflect the
    detail in the image accurately. This is especially apparent along the upper right
    (enlarged in the figure)—the edge detail is only sampled at 32 points along the
    horizon, producing large, random-looking hills. Even if we increased the tessellation
    values to 64, the total of 64*64 or just over 4000 vertices would still be woefully
    inadequate to do height-mapping using the moon image.


    A good way to increase the number of vertices is by using instancing, which we
    saw in Chapter 4. Our strategy will be to have the tessellator generate grids
    and use instancing to repeat this many times. In the vertex shader we build a
    patch defined by four vertices, one for each corner of a tessellated grid. In
    our C++/OpenGL application we change the glDrawArrays() call to glDrawArraysInstanced().
    There, we specify a grid of 64 by 64 patches, each of which contains a tessellated
    mesh with levels of size 32. This will give us a total of 64*64*32*32, or over
    four million vertices.


    The vertex shader starts by specifying four texture coordinates (0,0), (1,0),
    (0,1), and (1,1). When using instancing, recall that the vertex shader has access
    to an integer variable gl_InstanceID, which holds a counter corresponding to the
    glDrawArraysInstanced() call that is currently being processed. We use this ID
    value to distribute the locations of the individual patches within the larger
    grid. The patches are positioned in rows and columns, the first patch at location
    (0,0), the second at (1,0), the next at (2,0), and so on, and the final patch
    in the first column at (63,0). The next column has patches at (0,1), (1,1), and
    so forth up to (63,1). The final column has patches at (0,63), (1,63), and so
    on up to (63,63). The X coordinate for a given patch is the instance ID modulo
    64, and the Y coordinate is the instance ID divided by 64 (with integer division).
    The shader then scales the coordinates back down to the range [0..1].


    The control shader is unchanged, except that it passes through the vertices and
    texture coordinates.


    Next, the evaluation shader takes the incoming tessellated grid vertices (specified
    by gl_TessCoord) and moves them into the coordinate range specified by the incoming
    patch. It does the same for the texture coordinates. It also applies height'
