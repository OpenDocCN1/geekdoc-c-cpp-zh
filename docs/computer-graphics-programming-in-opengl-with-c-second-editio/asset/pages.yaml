  md: "# 14.5 NOISE\n\n![](img/1695de1bc7486362f86c143285f3fb40_348_0.png)\n\n**Figure\
    \ 14.11**  \nDragon with 3D checkerboard texture.\n\nMany natural phenomena can\
    \ be simulated using randomness, or *noise*. One common technique, *Perlin Noise*\
    \ [PE85], is named after Ken Perlin, who in 1997 received an Academy Award¹ for\
    \ developing a practical way to generate and use 2D and 3D noise. The procedure\
    \ described here is based on Perlin’s method.\n\nThere are many applications of\
    \ noise in graphics scenes. A few common examples are clouds, terrain, wood grain,\
    \ minerals (such as veins in marble), smoke, fire, flames, planetary surfaces,\
    \ and random movements. In this section, we focus on generating 3D textures containing\
    \ noise, and then subsequent sections illustrate using the noise data to generate\
    \ complex materials such as marble and wood, and to simulate animated cloud textures\
    \ for use with a cube map or skydome. A collection of spatial data (e.g., 2D or\
    \ 3D) that contains noise is sometimes referred to as a *noise map*.\n\nWe start\
    \ by constructing a 3D texture map out of random data. This can be done using\
    \ the functions shown in the previous section, with a few modifications. First,\
    \ we replace the generate3DPattern() function from Program 14.4 with the following\
    \ simpler generateNoise() function:\n\n```\n```cpp\n#include <random>\n...\ndouble\
    \ noise[noiseWidth][noiseHeight][noiseDepth];\n\nvoid generateNoise() {\n    for\
    \ (int x=0; x<noiseWidth; x++) {\n        for (int y=0; y<noiseHeight; y++) {\n\
    \            for (int z=0; z<noiseDepth; z++) {\n                noise[x][y][z]\
    \ = (double) rand() / (RAND_MAX + 1.0);  // computes a double in [0..1]\n    \
    \        }\n        }\n    }\n}\n```\n```\n\n¹ The Technical Achievement Award,\
    \ given by the Academy of Motion Picture Arts and Sciences."
