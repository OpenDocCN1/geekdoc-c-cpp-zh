  md: '| | |

    |---|---|

    | `GL_CONSTANT_ALPHA` | `(A_blendColor, A_blendColor, A_blendColor, A_blendColor)`
    |

    | `GL_ONE_MINUS_CONSTANT_ALPHA` | `(1,1,1,1) - (A_blendColor, A_blendColor, A_blendColor,
    A_blendColor)` |

    | `GL_ALPHA_SATURATE` | `(f, f, f, 1) where f = min(A_src, 1)` |


    Those options that indicate a “blendColor” (GL_CONSTANT_COLOR, etc.) require an
    additional call to glBlendColor() to specify a constant color that will be used
    to compute the blend function result. There are a few additional blend functions
    that aren’t shown in the previous list.


    The possible options for the glBlendEquation() parameter (i.e., mode) are as follows:


    | mode | blended color |

    |---|---|

    | `GL_FUNC_ADD` | `result = source_RGBA + destination_RGBA` |

    | `GL_FUNC_SUBTRACT` | `result = source_RGBA - destination_RGBA` |

    | `GL_FUNC_REVERSE_SUBTRACT` | `result = destination_RGBA - source_RGBA` |

    | `GL_MIN` | `result = min(source_RGBA, destination_RGBA)` |

    | `GL_MAX` | `result = max(source_RGBA, destination_RGBA)` |


    The glBlendFunc() defaults are GL_ONE (1.0) for srcFactor and GL_ZERO (0.0) for
    dstFactor. The default for glBlendEquation() is GL_FUNC_ADD. Thus, by default,
    the source pixel is unchanged (multiplied by 1), the destination pixel is scaled
    to 0, and the two are added—meaning that the source pixel becomes the frame buffer
    color.


    There are also the commands glEnable(GL_BLEND) and glDisable(GL_BLEND), which
    can be used to tell OpenGL to apply the specified blending, or to ignore it.


    We won’t illustrate the effects of all of the options here, but we will walk through
    some illustrative examples. Suppose we specify the following settings in the C++/OpenGL
    application:


    +   - `glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA)`

    +   - `glBlendEquation(GL_FUNC_ADD)`


    Compositing would proceed as follows:


    +   1. The source pixel is scaled by its alpha value.

    +   2. The destination pixel is scaled by 1-srcAlpha (the source transparency).

    +   3. The pixel values are added together.'
