  md: '![](img/1695de1bc7486362f86c143285f3fb40_304_0.png)


    # 12.3 TESSELLATION FOR TERRAIN / HEIGHT MAPS


    Recall that performing height mapping in the vertex shader can suffer from an
    insufficient number of vertices to render the desired detail. Now that we have
    a way to generate lots of vertices, let’s go back to Hastings-Trew’s moon surface
    texture map (from [HT12]) and use it as a *height map* by raising *tessellated*
    vertices to produce moon surface detail. As we will see, this has the advantages
    of achieving vertex geometry that better matches the moon image, along with improved
    silhouette (edge) detail.


    Our strategy is to modify Program 12.1, placing a tessellated grid in the X-Z
    plane, and use height mapping to set the Y coordinate of each tessellated grid
    point. To do this a patch isn’t needed, because we can hardcode the location of
    the tessellated grid. So we will specify the required minimum of 1 vertex per
    patch in glDrawArrays() and glPatchParameteri(), as was done in Program 12.1.
    Hastings-Trew’s moon texture image is used both for color and as the height map.


    We generate vertex and texture coordinates in the evaluation shader by mapping
    the tessellated grid’s gl_TessCoord values to appropriate ranges for vertices
    and textures.⁴ The evaluation shader also is where the height mapping is performed,
    by adding a fraction of the color component of the moon texture to


    ⁴ In some applications the texture coordinates are produced externally, such as
    when tessellation is being used to provide additional vertices for an imported
    model. In such cases, the provided texture coordinates would need to be interpolated.'
