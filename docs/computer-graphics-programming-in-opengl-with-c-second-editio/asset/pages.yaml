- pgno: 11
  md: '# # Preface


    This book is designed primarily as a textbook for a typical computer science undergraduate
    course in OpenGL 3D graphics programming. However, we have also endeavored to
    create a text that could be used to teach oneself, without an accompanying course.
    With both of those aims in mind, we have tried to explain things as clearly and
    as simply as we can. All of the programming examples are stripped down and simplified
    as much as possible, but they are still complete so that the reader may run them
    all as presented.


    One of the things that we hope is unique about this book is that we have strived
    to make it accessible to someone new to 3D graphics programming. While there is
    by no means a lack of information available on the topic—quite the contrary—many
    students are initially overwhelmed. This text is our attempt to write the book
    we wish we had had when we were starting out, with step-by-step explanations of
    the basics, progressing in an organized manner up through advanced topics. We
    considered titling the book “shader programming made easy”; however, we don’t
    think that there really is any way of making shader programming “easy.” We hope
    that we have come close.


    This book teaches OpenGL programming in C++. There are several advantages to learning
    graphics programming in C++:


    +   - OpenGL’s native language is C, so a C++ program can make direct OpenGL function
    calls.

    +   - OpenGL applications written in C++ typically exhibit very high performance.

    +   - C++ offers modern programming constructs (classes, polymorphism, etc.) not
    available in C.

    +   - C++ is a popular language choice for using OpenGL, and a large number of
    instructional resources for OpenGL are available in C++.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'It is worth mentioning that there do exist other language bindings for OpenGL.
    Popular alternatives exist for Java, C#, Python, and many others. This textbook
    focuses only on C++.


    Another thing that makes this book unique is that it has a “sister” textbook:
    *Computer Graphics Programming in OpenGL with Java 2/E*. The two books are organized
    in lock-step, with the same chapter and section numbers and topics, figures, exercises,
    and theoretical descriptions. Wherever possible, the code is organized similarly.
    Of course, the use of C++ versus Java leads to considerable programming differences
    (although all of the shader code is identical). Still, we believe that we have
    provided virtually identical learning paths, even allowing a student to choose
    either option within a single classroom.


    An important point of clarification is that there exist both different *versions*
    of OpenGL (briefly discussed later) and different *variants* of OpenGL. For example,
    in addition to “standard OpenGL” (sometimes called “desktop OpenGL”), there exists
    a variant called “OpenGL ES,” which is tailored for development of *embedded systems*
    (hence the “ES”). “Embedded systems” include devices such as mobile phones, game
    consoles, automobiles, and industrial control systems. OpenGL ES is mostly a subset
    of standard OpenGL, eliminating a large number of operations that are typically
    not needed for embedded systems. OpenGL ES also adds some additional functionality,
    typically application-specific operations for particular target environments.
    This book focuses on standard OpenGL.


    Yet another variant of OpenGL is called “WebGL.” Based on OpenGL ES, WebGL is
    designed to support the use of OpenGL in web browsers. WebGL allows an application
    to use JavaScript¹ to invoke OpenGL ES operations, which makes it easy to embed
    OpenGL graphics into standard HTML (web) documents. Most modern web browsers support
    WebGL, including Apple Safari, Google Chrome, Microsoft Edge, Microsoft Internet
    Explorer, Mozilla Firefox, and Opera. Since web programming is outside the scope
    of this book, we will not cover any WebGL specifics. Note however that because
    WebGL is based on OpenGL ES, which in turn is based on standard OpenGL, much of
    what is covered in this book can be transferred directly to learning about these
    OpenGL variants.


    The very topic of 3D graphics lends itself to impressive, even beautiful images.
    Indeed, many popular textbooks on the topic are filled with breathtaking scenes,
    and it is enticing to leaf through their galleries. While we acknowledge the motivational
    utility of such examples, our aim is to teach, not to impress. The images in this
    book are simply


    ¹ JavaScript is a scripting language that can be used to embed code in webpages.
    It has strong similarities to Java, but also many important differences.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'the outputs of the example programs, and since this is an introductory text,
    the resulting scenes are unlikely to impress an expert. However, the techniques
    presented do constitute the foundational elements for producing today’s stunning
    3D effects.


    We also haven’t tried to create an OpenGL “reference.” Our coverage of OpenGL
    represents only a tiny fraction of its capabilities. Rather, our aim is to use
    OpenGL as a vehicle for teaching the fundamentals of modern shader-based 3D graphics
    programming and provide the reader with a sufficiently deep understanding for
    further study.


    # ## What’s New in this Edition


    We have added three new chapters in this 2nd edition of *Computer Graphics Programming
    in OpenGL using C++*:


    +   - Chapter 15 – *Simulating Water*

    +   - Chapter 16 – *Ray Tracing*

    +   - Chapter 17 – *Stereoscopy*


    Ray tracing in particular has become “hot” recently, so we are especially excited
    that it is now included in our book. It is also a huge topic, so even though our
    coverage is just a basic introduction, Chapter 16 is now the longest chapter in
    the book. Chapter 16 also includes an introduction to *compute shaders*, which
    were introduced in OpenGL 4.3, and an introduction to additive and subtractive
    color blending, which expands on a topic that was introduced in Section 14.2.


    For years, our own students have repeatedly expressed an interest in simulating
    water. However, water takes so many forms that writing an introductory section
    on the topic is challenging. Ultimately, we decided to present water in a way
    that would complement related topics in the book such as terrain, sky, etc., and
    so in Chapter 15 we focus on utilizing our noise maps from Chapter 14 to generate
    water surfaces such as are seen in lakes and oceans.


    The new chapter on stereoscopy is motivated by the increased popularity of virtual
    reality. However, it is also applicable to the development of animation for “3D
    movies,” and we have tried to provide introductory coverage of both uses equally.


    As a result of these additions, this 2nd edition is larger than the previous edition.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Besides the new material, there are important revisions throughout the book.
    For example, we fixed bugs in our Torus class in Chapter 6 and made significant
    improvements to our noise map functions in Chapter 14. We expanded our Utils.cpp
    utility class to handle the loading of compute shaders. We also helped identify
    a bug in SOIL2 (now fixed) that affected Macintosh users attempting to load cubemaps.


    There are dozens of small changes in every chapter that the reader might not even
    notice: fixing typos, cleaning up code inconsistencies, updating the installation
    instructions, making slight wording changes, sprucing up figures, updating references,
    etc. Completely eliminating typos is virtually impossible in a book that covers
    an ever-changing technology-rich topic, but we really have tried hard.


    # ### Intended Audience


    This book is targeted at students of computer science. This could mean undergraduates
    pursuing a BS degree, but it could also mean anyone who studies computer science.
    As such, we are assuming that the reader has at least a solid background in object-oriented
    programming, at the level of someone who is, say, a computer science major at
    the junior or senior level.


    There are also some specific things that we use in this book that we don’t cover,
    because we assume the reader already has sufficient background. In particular,
    these are:


    +   - C++ and its most commonly used libraries, such as the Standard Template
    Library;

    +   - familiarity with using an *Integrated Development Environment* (IDE), such
    as Visual Studio;

    +   - basic data structures and algorithms, such as linked lists, stacks, and
    queues, etc.;

    +   - recursion;

    +   - event-driven programming concepts;

    +   - basic matrix algebra and trigonometry; and

    +   - awareness of color models, such as RGB, RGBA, etc.


    It is hoped that the potential audience for this new book is further bolstered
    by the existence of its “sister” textbook, *Computer Graphics Programming in OpenGL
    with Java*. In particular, we envision a learning environment where students are
    free to utilize either C++ or Java *in the same classroom*, selecting one or the
    other. The two texts cover the material sufficiently in lockstep that we have
    been able to conduct a graphics programming course successfully in this manner.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# How to Use This Book


    This book is designed to be read from front to back. That is, material in later
    chapters frequently relies on information learned in earlier chapters. So, it
    probably won’t work to jump back and forth in the chapters; rather, work your
    way forward through the material.


    This is also intended mostly as a practical, hands-on guide. While there is plenty
    of theoretical material included, the reader should treat this text as a sort
    of “workbook,” in which you learn basic concepts by actually programming them
    yourself. We have provided code for all of the examples, but to really learn the
    concepts you will want to “play” with those examples—extend them to build your
    own 3D scenes.


    At the end of each chapter are a few exercises to solve. Some are very simple,
    involving merely making simple modifications to the provided code. The problems
    that are marked “(PROJECT),” however, are expected to take some time to solve,
    and require writing a significant amount of code, or combining techniques from
    various examples. There are also a few marked “(RESEARCH)”—those are problems
    that encourage independent study because this textbook doesn’t provide sufficient
    detail to solve them.


    OpenGL calls often involve long lists of parameters. While writing this book,
    the authors debated whether or not to, in each case, describe all of the parameters.
    We decided that in the early chapters we would describe every detail. Further
    into the book, as the topics progress, we decided to avoid getting bogged down
    in every piece of minutiae in the OpenGL calls (and there are many), for fear
    of the reader losing sight of the big picture. For this reason, it is essential
    when working through the examples to have ready access to reference material for
    OpenGL and the various libraries being used.


    For this, there are a number of excellent online resources that we recommend using
    in conjunction with this book. The documentation for OpenGL is absolutely essential;
    details on the various commands are available either by simply using Google to
    search for the command in question, or by visiting:


    https://www.khronos.org/registry/OpenGL-Refpages/gl4/


    Our examples utilize a mathematics library called GLM. After installing GLM (described
    in the appendices), the reader should locate the accompanying online documentation
    and bookmark it. At press time, the current link is:


    https://glm.g-truc.net/0.9.9/index.html'
  merge: -1
  img_proc: true
