    and linking them, and detecting GLSL errors; in fact, recall that we have moved
    them to a "Utils.cpp" file:


    +   - createShaderProgram()

    +   - readShaderSource()

    +   - checkOpenGLError()

    +   - printProgramLog()

    +   - printShaderLog()'
