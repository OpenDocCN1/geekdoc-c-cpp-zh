  md: "+   - a buffer to hold the *texture coordinates*\n+   - a vertex attribute\
    \ for passing the texture coordinates down the pipeline\n+   - a *texture unit*\
    \ on the graphics card\n\nA texture image can be a picture of anything. It can\
    \ be a picture of something man-made or occurring in nature, such as cloth, grass,\
    \ or a planetary surface; or, it could be a geometric pattern, such as the checkerboard\
    \ in Figure 5.1. In video-games and animated movies, texture images are commonly\
    \ used to paint faces and clothing on characters or paint skin on creatures such\
    \ as the dolphin in Figure 5.1.\n\nImages are typically stored in image files,\
    \ such as jpg, png, gif, or tiff. In order to make a texture image available to\
    \ shaders in the OpenGL pipeline, we need to extract the colors from the image\
    \ and put them into an OpenGL *texture object* (a built-in OpenGL structure for\
    \ holding a texture image).\n\nMany C++ libraries are available for reading and\
    \ processing image files. Among the popular choices are CImg, Boost GIL, and Magick++.\
    \ We have opted to use a library designed particularly for OpenGL called SOIL2\
    \ [SO20], which is based on the very popular but now outdated library SOIL. The\
    \ installation steps for SOIL2 are given in Appendices A and B.\n\nThe general\
    \ steps we will use for loading a texture into an OpenGL application are: (a)\
    \ use SOIL2 to instantiate an OpenGL texture object and read the data from an\
    \ image file into it, (b) call glBindTexture() to make the newly created texture\
    \ object active, and (c) adjust the texture settings using the glTexParameter()\
    \ function. The result is an integer ID for the now available OpenGL texture object.\n\
    \nTexturing an object starts by declaring a variable of type GLuint. As we have\
    \ seen, this is an OpenGL type for holding integer IDs referencing OpenGL objects.\
    \ Next, we call SOIL_load_OGL_texture() to actually generate the texture object.\
    \ The SOIL_load_OGL_texture() function accepts an image file name as one of its\
    \ parameters (some of the other parameters will be described later). These steps\
    \ are implemented in the following function:\n\n```\n~~~cpp\nGLuint loadTexture(const\
    \ char *texturePath) {\n    GLuint textureID;\n    textureID = SOIL_load_OGL_texture(texturePath,\n\
    \        SOIL_LOAD_AUTO, SOIL_CREATE_NEW_ID, SOIL_FLAG_INVERT_Y);\n    if (textureID\
    \ == 0) cout << \"could not find texture file\" << texturePath << endl;\n    return\
    \ textureID;\n}\n~~~\n```"
