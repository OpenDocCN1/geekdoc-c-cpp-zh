    \  + bu2 * ( bv0*p20 + bv1*p21 + bv2*p22 + bv3*p23 )\n  + bu3 * ( bv0*p30 + bv1*p31\
    \ + bv2*p32 + bv3*p33 );\ngl_Position = mvp_matrix * vec4(outputPosition,1.0f);\n\
    \n// output the interpolated texture coordinates\nvec2 tc1 = mix(texCoord_TCSout[0],\
    \ texCoord_TCSout[3], gl_TessCoord.x);\nvec2 tc2 = mix(texCoord_TCSout[12], texCoord_TCSout[15],\
    \ gl_TessCoord.x);\nvec2 tc = mix(tc2, tc1, gl_TessCoord.y);\ntexCoord_TESout\
    \ = tc;\n}\n```\n```\n\n# ### Fragment Shader\n\n```\n```glsl\n#version 430\n\
    in vec2 texCoord_TESout;\nout vec4 color;\nuniform mat4 mvp_matrix;\nlayout (binding\
    \ = 0) uniform sampler2D tex_color;\nvoid main(void)\n{ color = texture(tex_color,\
    \ texCoord_TESout);\n}\n```\n```\n\n# ### C++ / OpenGL application\n\n```\n```cpp\n\
    // This time we also pass a texture to paint the surface.\n// Load the texture\
    \ in init() as usual, then enable it in display()\nvoid display(GLFWwindow* window,\
    \ double currentTime) {\n\n    glActiveTexture(GL_TEXTURE0);\n    glBindTexture(GL_TEXTURE_2D,\
    \ textureID);\n    glFrontFace(GL_CCW);\n    glPatchParameteri(GL_PATCH_VERTICES,\
    \ 16);        // number of vertices per patch = 16\n    glPolygonMode(GL_FRONT_AND_BACK,\
    \ GL_FILL);\n    glDrawArrays(GL_PATCHES, 0, 16);                 // total number\
    \ of patch vertices: 16 x 1 patch = 16\n}\n```\n```"
