- pgno: 70
  md: 'We can build a single transform that does both the rotation and the translation
    in one matrix, called the *viewing transform* matrix, or **V**. The matrix **V**
    is produced by concatenating the two matrices **T** (a translation matrix containing
    the negative of the desired camera location) and **R** (a rotation matrix containing
    the negative of the desired camera orientation). In this case, working from right
    to left, we first translate world point P, then rotate it:


    P_c = R * ( T * P_w )


    As we saw earlier, the associative rule allows us to group the operations instead
    thusly:


    P_c = ( R * T ) * P_w


    If we save the concatenation **R*T** in the matrix **V**, the operation now looks
    like:


    P_c = V * P_w


    The complete computation, and the exact contents of matrices **T** and **R**,
    are shown in Figure 3.13 (we omit the derivation of matrix **R**—a derivation
    is available in [FV95]).


    ![](img/1695de1bc7486362f86c143285f3fb40_70_0.png)


    **Figure 3.13** Deriving a view matrix.


    More commonly, the **V** matrix is concatenated with the model matrix **M** to
    form a single *model-view* (MV) matrix:


    MV = V * M'
