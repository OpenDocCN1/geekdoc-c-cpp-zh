    # SUPPLEMENTAL NOTES


    As was the case in Chapter 5 when we first studied textures, while using SOIL2
    makes building and texturing a cube map easy, it can have the unintended consequence
    of shielding a user from some OpenGL details that are useful to learn. Of course,
    it is possible to instantiate and load an OpenGL cube map in the absence of SOIL2.
    It is still advisable to use an image handling library, such as *stb_image.h*
    [SB20]. The basic steps are detailed in [dV14] and are summarized as follows:


    +   1. Copy the *stb_image.h* header file into your project directory.

    +   2. Use `glGenTextures()` to create a texture for the cube map and its integer
    reference.

    +   3. Call `glBindTexture()`, specifying the texture’s ID and `GL_TEXTURE_CUBE_MAP`.

    +   4. Read the six image files using `stbi_load()`.

    +   5. Use `glTexImage2D()` to assign the images to cube faces.


    The *stb_image.h* header file is already included with SOIL2, or it can be installed
    separately. For more details, see [dV14] or [GE16].'
