    Properly setting the winding order is important when using back-face culling.
    An incorrect setting, such as GL_CW when it should be GL_CCW, can lead to the
    interior of an object being rendered rather than its exterior, which in turn can
    produce distortion similar to that of an incorrect perspective matrix.


    Efficiency isn’t the only reason for doing face culling. In later chapters, we
    will see other uses, such as for those circumstances when we want to see the inside
    of a 3D model, or when using transparency.


    # ## SUPPLEMENTAL NOTES


    There is a myriad of other capabilities and structures available for managing
    and utilizing data in OpenGL/GLSL, and we have only scratched the surface in this
    chapter. We haven’t, for example, described a *uniform block*, which is a mechanism
    for organizing uniform variables similar to a *struct* in C. Uniform blocks can
    even be set up to receive data from buffers. Another powerful mechanism is a *shader
    storage block*, which is essentially a buffer into which a shader can write.


    An excellent reference on the many options for managing data is the *OpenGL SuperBible*
    [SW15], particularly the chapter entitled “Data” (Chapter 5 in the 7th edition).
    It also describes many of the details and options for the various commands that
    we have covered. The first two example programs in this chapter, Program 4.1 and
    Program 4.2, were inspired by similar examples in the *SuperBible*.


    There are other types of data that we will need to learn how to manage, and how
    to send down the OpenGL pipeline. One of these is a *texture*, which contains
    color image data (such as in a photograph) that can be used to “paint” the objects
    in our scene. We will study texture images in Chapter 5. Another important buffer'
