  md: "**Standard texturing shaders are now used for all objects in the scene, including\
    \ the cube map:**\n\n# ### Vertex Shader\n\n```\n```glsl\n#version 430\nlayout\
    \ (location = 0) in vec3 position;\nlayout (location = 1) in vec2 tex_coord;\n\
    out vec2 tc;\nuniform mat4 mv_matrix;\nuniform mat4 proj_matrix;\nlayout (binding\
    \ = 0) uniform sampler2D s;\n\nvoid main(void)\n{  tc = tex_coord;\n   gl_Position\
    \ = proj_matrix * mv_matrix * vec4(position,1.0);\n}\n```\n```\n\n# ### Fragment\
    \ Shader\n\n```\n```glsl\n#version 430\nin vec2 tc;\nout vec4 fragColor;\nuniform\
    \ mat4 mv_matrix;\nuniform mat4 proj_matrix;\nlayout (binding = 0) uniform sampler2D\
    \ s;\n\nvoid main(void)\n{  fragColor = texture(s,tc);\n}\n```\n```\n\nThe output\
    \ of Program 9.1 is shown in Figure 9.7, for each of two different cube map textures.\n\
    \nAs mentioned earlier, skyboxes are susceptible to image distortion and seams.\
    \ Seams are lines that are sometimes visible where two texture images meet, such\
    \ as along the edges of the cube. Figure 9.8 shows an example of a seam in the\
    \ upper part of the image that is an artifact of running Program 9.1. Avoiding\
    \ seams requires careful construction of the cube map image and assignment of\
    \ precise texture coordinates. There exist tools for reducing seams along image\
    \ edges (such as [GL20]); this topic is outside the scope of this book."
