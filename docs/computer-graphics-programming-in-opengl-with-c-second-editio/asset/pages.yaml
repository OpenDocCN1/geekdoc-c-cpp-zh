  md: 'will study later, in that they are accessed using three texture coordinates—often
    labeled $(s,t,r)$—rather than two as we have been doing thus far. Another unique
    characteristic of OpenGL texture cube maps is that the images in them are oriented
    with texture coordinate (0,0,0) at the upper left (rather than the usual lower
    left) of the texture image; this is often a source of confusion.


    Whereas the method shown in Program 9.1 reads in a single image for texturing
    the cube map, the loadCubeMap() function shown in Program 9.2 reads in six separate
    cube face image files. As we learned in Chapter 5, there are many ways to read
    in texture images; we chose to use the SOIL2 library. Here too, SOIL2 is very
    convenient for instantiating and loading an OpenGL cube map. We identify the files
    to read in and then call SOIL_load_OGL_cubemap(). The parameters include the six
    image files and additional parameters that are similar to the ones for SOIL_load_OGL_texture()
    that we saw in Chapter 5. In the case of OpenGL cube maps, it isn’t necessary
    to flip the textures vertically, since OpenGL does that automatically. Note that
    we have placed loadCubeMap() in our “Utils.cpp” file.


    The init() function now includes a call to enable GL_TEXTURE_CUBE_MAP_SEAMLESS,
    which tells OpenGL to attempt to blend adjoining edges of the cube to reduce or
    eliminate seams. In display(), the cube’s vertices are sent down the pipeline
    as before, but this time it is unnecessary to send the cube’s texture coordinates.
    As we will see, this is because an OpenGL texture cube map usually uses the cube’s
    vertex positions as its texture coordinates. After disabling depth testing, the
    cube is drawn. Depth testing is then re-enabled for the rest of the scene.


    The completed OpenGL texture cube map is referenced by an int identifier. As was
    the case for shadow-mapping, artifacts along a border can be reduced by setting
    the texture wrap mode to “clamp to edge.” In this case it can help further reduce
    seams. Note that this is set for all three texture coordinates: s, t, and r.


    The texture is accessed in the fragment shader with a special type of sampler
    called a samplerCube. In a texture cube map, the value returned from the sampler
    is the texel “seen” from the origin as viewed along the direction vector $(s,t,r)$.
    As a result, we can usually simply use the incoming interpolated vertex positions
    as the texture coordinates. In the vertex shader, we assign the cube vertex positions
    into the outgoing texture coordinate attribute so that they will be interpolated
    when they reach the fragment shader. Note also in the vertex shader that we convert
    the incoming view matrix to 3x3, and then back to 4x4. This “trick” effectively
    removes the translation component while retaining the rotation (recall that translation
    values are found in the fourth column of a transformation matrix). This fixes'
