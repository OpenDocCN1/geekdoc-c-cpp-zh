- pgno: 197
  md: "The vertex shader contains our first example of using the struct notation.\
    \ A GLSL “struct” is like a datatype; it has a name and a set of fields. When\
    \ a variable is declared using the name of a struct, it then contains those fields,\
    \ which are accessed using the “.” notation. For example, variable “light” is\
    \ declared of type “PositionalLight”, so we can thereafter refer to its fields\
    \ light.ambient, light.diffuse, and so forth.\n\n![](img/1695de1bc7486362f86c143285f3fb40_197_0.png)\n\
    \n**Figure 7.9**  \nTorus with Gouraud shading.\n\nAlso note the field selector\
    \ notation “.xyz”, used in several places in the vertex shader. This is a shortcut\
    \ for converting a vec4 to an equivalent vec3 containing only its first three\
    \ elements.\n\nThe vertex shader is where most of the lighting computations are\
    \ performed. For each vertex, the appropriate matrix transforms are applied to\
    \ the vertex position and associated normal vector, and vectors for light direction\
    \ (L⃗) and reflection (R⃗) are computed. The ADS computations described in Section\
    \ 7.4 are then performed, resulting in a color for each vertex (called varyingColor\
    \ in the code). The colors are interpolated as part of the normal rasterization\
    \ process. The fragment shader is then a simple pass-through. The lengthy list\
    \ of uniform variable declarations is also present in the fragment shader (for\
    \ reasons described earlier in Chapter 4), but none of them are actually used\
    \ there.\n\nNote the use of the GLSL functions normalize(), which converts a vector\
    \ to unit length and is necessary for proper application of the dot product, and\
    \ reflect(), which computes the reflection of one vector about another.\n\nArtifacts\
    \ are evident in the output torus shown in Figure 7.9. Specular highlights have\
    \ a blocky, faceted appearance. This artifact is more pronounced if the object\
    \ is in motion (we can’t illustrate that here).\n\nGouraud shading is susceptible\
    \ to other artifacts. If the specular highlight is entirely contained within one\
    \ of the model’s triangles—that is, if it doesn’t contain at least one of the\
    \ model vertices—then it may disappear entirely. The specular component is calculated\
    \ per-vertex, so if a model vertex with a specular contribution does not exist,\
    \ none of the rasterized pixels will include specular light either."
  merge: -1
  img_proc: true
- pgno: 198
  md: "# 7.5.2 Phong Shading\n\nBui Tuong Phong developed a smooth shading algorithm\
    \ while a graduate student at the University of Utah, and described it in his\
    \ 1973 dissertation [PH73] and published it in [PH75]. The structure of the algorithm\
    \ is similar to the algorithm for Gouraud shading, except that the lighting computations\
    \ are done *per-pixel* rather than per-vertex. Since the lighting computations\
    \ require a normal vector **N** and a light vector **L**, which are only available\
    \ in the model on a per-vertex basis, Phong shading is often implemented using\
    \ a clever “trick,” whereby **N** and **L** are computed in the vertex shader\
    \ and *interpolated* during rasterization. Figure 7.10 outlines the strategy:\n\
    \n![](img/1695de1bc7486362f86c143285f3fb40_198_0.png)\n\n**Figure 7.10**  \nImplementing\
    \ Phong shading.\n\nThe C++/OpenGL code is completely unchanged. Some of the computations\
    \ previously done in the vertex shader are now moved into the fragment shader.\
    \ The effect of interpolating normal vectors is illustrated in Figure 7.11:\n\n\
    ![](img/1695de1bc7486362f86c143285f3fb40_198_1.png)\n\n**Figure 7.11**  \nInterpolation\
    \ of normal vectors."
  merge: -1
  img_proc: true
- pgno: 199
  md: "We now are ready to implement our torus with positional lighting, using Phong\
    \ shading. Most of the code is identical to that used for Gouraud shading. Since\
    \ the C++/OpenGL code is unchanged, we present only the revised vertex and fragment\
    \ shaders, shown in Program 7.2. Examining the output of Program 7.2, as shown\
    \ in Figure 7.12, Phong shading corrects the artifacts present in Gouraud shading.\n\
    \n![](img/1695de1bc7486362f86c143285f3fb40_199_0.png)\n\n**Figure 7.12**  \nTorus\
    \ with Phong shading.\n\n# Program 7.2 Torus with Phong Shading\n\n# Vertex Shader\n\
    \n```\n```glsl\n#version 430\nlayout (location=0) in vec3 vertPos;\nlayout (location=1)\
    \ in vec3 vertNormal;\nout vec3 varyingNormal;       // eye-space vertex normal\n\
    out vec3 varyingLightDir;     // vector pointing to the light\nout vec3 varyingVertPos;\
    \      // vertex position in eye space\n\n// structs and uniforms same as for\
    \ Gouraud shading\n...\nvoid main(void)\n{  // output vertex position, light direction,\
    \ and normal to the rasterizer for interpolation\n   varyingVertPos=(mv_matrix\
    \ * vec4(vertPos,1.0)).xyz;\n   varyingLightDir = light.position - varyingVertPos;\n\
    \   varyingNormal=(norm_matrix * vec4(vertNormal,1.0)).xyz;\n\n   gl_Position=proj_matrix\
    \ * mv_matrix * vec4(vertPos,1.0);\n}\n```\n```\n\n# Fragment Shader\n\n```\n\
    ```glsl\n#version 430\nin vec3 varyingNormal;\nin vec3 varyingLightDir;\nin vec3\
    \ varyingVertPos;\nout vec4 fragColor;\n\n// structs and uniforms same as for\
    \ Gouraud shading\n...\n```\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "```\n```cpp\nvoid main(void)\n{\n    // normalize the light, normal, and view\
    \ vectors:\n    vec3 L = normalize(varyingLightDir);\n    vec3 N = normalize(varyingNormal);\n\
    \    vec3 V = normalize(-varyingVertPos);\n\n    // compute light reflection vector\
    \ with respect to N:\n    vec3 R = normalize(reflect(-L, N));\n    // get the\
    \ angle between the light and surface normal:\n    float cosTheta = dot(L,N);\n\
    \    // angle between the view vector and reflected light:\n    float cosPhi =\
    \ dot(V,R);\n\n    // compute ADS contributions (per pixel), and combine to build\
    \ output color:\n    vec3 ambient = ((globalAmbient * material.ambient) + (light.ambient\
    \ * material.ambient)).xyz;\n    vec3 diffuse = light.diffuse.xyz * material.diffuse.xyz\
    \ * max(cosTheta,0.0);\n    vec3 specular =\n        light.specular.xyz * material.specular.xyz\
    \ * pow(max(cosPhi,0.0), material.shininess);\n\n    fragColor = vec4((ambient\
    \ + diffuse + specular), 1.0);\n}\n```\n```\n\nAlthough Phong shading offers better\
    \ realism than Gouraud shading, it does so while incurring a performance cost.\
    \ One optimization to Phong shading was proposed by James Blinn in 1977 [BL77],\
    \ and is referred to as the *Blinn-Phong* reflection model. It is based on the\
    \ observation that one of the most expensive computations in Phong shading is\
    \ determining the reflection vector **R**.\n\nBlinn observed that the vector **R**\
    \ itself actually is not needed—**R** is only produced as a means of determining\
    \ the angle φ. It turns out that φ can be found without computing **R**, by instead\
    \ computing a vector **H** that is halfway between **L** and **V**. As shown in\
    \ Figure 7.13, the angle α between **H** and **N** is usually close to ½(φ). Although\
    \ α isn’t identical to φ, Blinn showed that good results can be obtained by using\
    \ α instead of φ.\n\nThe “halfway” vector **H** is most easily determined by finding\
    \ **L** + **V** (see Figure 7.14), after which cos(α) can be found using the dot\
    \ product **H** • **N**.\n\n![](img/1695de1bc7486362f86c143285f3fb40_200_0.png)"
  merge: -1
  img_proc: true
