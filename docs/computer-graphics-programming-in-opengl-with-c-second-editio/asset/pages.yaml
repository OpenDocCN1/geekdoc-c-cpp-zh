    # 12.4 CONTROLLING LEVEL OF DETAIL (LOD)


    Using instancing to generate millions of vertices in real time, as in Program
    12.4, is likely to place a load on even a well-equipped modern computer. Fortunately,
    the strategy of dividing the terrain into separate patches, as we have done to
    increase the number of generated grid vertices, also affords us a nice mechanism
    for reducing that load.


    Of the millions of vertices being generated, many aren’t necessary. Vertices in
    patches that are close to the camera are important because we expect to discern'
