- pgno: 38
  md: 'much more efficient to have the tessellator in the GPU generate the triangle
    mesh in hardware, rather than doing it in C++.


    # 2.1.4 Geometry Shader


    We cover the geometry shader stage in Chapter 13. Whereas the *vertex shader*
    gives the programmer the ability to manipulate one *vertex* at a time (i.e., “per-vertex”
    processing), and the *fragment shader* (as we will see) allows manipulating one
    *pixel* at a time (“per-fragment” processing), the *geometry shader* provides
    the capability to manipulate one *primitive* at a time—“per-primitive” processing.


    Recalling that the most common primitive is the *triangle*, by the time we have
    reached the geometry stage, the pipeline must have completed grouping the vertices
    into triangles (a process called *primitive assembly*). The geometry shader then
    makes all three vertices in each triangle accessible to the programmer simultaneously.


    There are a number of uses for per-primitive processing. The primitives could
    be altered, such as by stretching or shrinking them. Some of the primitives could
    be deleted, thus putting “holes” in the object being rendered—this is one way
    of turning a simple model into a more complex one.


    The geometry shader also provides a mechanism for generating additional primitives.
    Here too, this opens the door to many possibilities for turning simple models
    into more complex ones.


    An interesting use for the geometry shader is for adding surface texture such
    as bumps or scales—even “hair” or “fur”—to an object. Consider for example the
    simple torus shown in Figure 2.7 (we will see how to generate this later in the
    book). The surface of this torus is built out of many hundreds of triangles. If
    at each triangle we use a geometry shader to add additional triangles that face
    outward, we get the result shown in Figure 2.8. This “scaly torus” would be computationally
    expensive to try and model from scratch in the C++/OpenGL application side.


    It might seem redundant to provide a per-primitive shader stage when the tessellation
    stage(s) give the programmer access to *all* of the vertices in an entire model
    simultaneously. The difference is that tessellation only offers this capability
    in very limited circumstances—specifically when the model is a grid of triangles
    generated by the tessellator. It does not provide such simultaneous access to
    all the vertices of, say, an arbitrary model being sent in from C++ through a
    buffer.'
