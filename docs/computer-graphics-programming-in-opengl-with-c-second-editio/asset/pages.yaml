    ![](img/1695de1bc7486362f86c143285f3fb40_114_0.png)


    Each vertex that passes through the pipeline efficiently forms a triangle with
    the previous two vertices:


    | vertices: | 0 | 1 | 2 | 3 | 4 | etc. |

    |---|---|---|---|---|---|---|

    | triangles: | | 0-1-2 | 2-3-4 | | | |


    GL_TRIANGLE_FAN


    ![](img/1695de1bc7486362f86c143285f3fb40_114_1.png)


    Each pair of vertices that passes through the pipeline forms a triangle with the
    very first vertex:


    | vertices: | 0 | 1 | 2 | 3 | 4 | etc. |

    |---|---|---|---|---|---|---|

    | triangles: | | 0-1-2 | 0-2-3 | 0-3-4 | | |


    GL_TRIANGLES_ADJACENCY


    Intended only for use with geometry shaders. Allows the shader to access the vertices
    in the current triangle, plus additional adjacent vertices.


    GL_TRIANGLE_STRIP_ADJACENCY


    Intended only for use with geometry shaders. Similar to GL_TRIANGLES_ADJACENCY,
    except that triangle vertices overlap as for GL_TRIANGLE_STRIP.


    # Line primitives:


    GL_LINES


    ![](img/1695de1bc7486362f86c143285f3fb40_114_2.png)


    Vertices that pass through the pipeline form distinct lines:


    | vertices: | 0 | 1 | 2 | 3 | 4 | 5 | etc. |

    |---|---|---|---|---|---|---|---|

    | lines: | | 0-1 | 2-3 | 4-5 | | | |


    GL_LINE_STRIP


    ![](img/1695de1bc7486362f86c143285f3fb40_114_3.png)


    Each vertex that passes through the pipeline efficiently forms a line with the
    previous vertex:


    | vertices: | 0 | 1 | 2 | 3 | etc. |

    |---|---|---|---|---|---|

    | lines: | | 0-1 | 1-2 | 2-3 | |


    GL_LINE_LOOP


    Same as GL_LINE_STRIP, except a line is also formed between the very first and
