    Texture mapping is the technique of overlaying an image across a rasterized model
    surface. It is one of the most fundamental and important ways of adding realism
    to a rendered scene.


    Texture mapping is so important that there is hardware support for it, allowing
    for very high performance resulting in real-time photorealism. *Texture Units*
    are hardware components designed specifically for texturing, and modern graphics
    cards typically come with several texture units included.'
