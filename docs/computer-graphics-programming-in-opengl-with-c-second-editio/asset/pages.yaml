    # 2.6 ORGANIZING THE C++ CODE FILES


    So far, we have been placing all of the C++/OpenGL application code in a single
    file called "main.cpp", and the GLSL shaders into files called "vertShader.glsl"
    and "fragShader.glsl". While we admit that stuffing a lot of application code
    into main.cpp isn''t a best practice, we have adopted this convention in this
    book so that it is absolutely clear in every example which file contains the main
    block of C++/OpenGL code relevant to the example being discussed. Throughout this
    textbook, it will always be called "main.cpp". In practice, applications should
    of course be modularized to appropriately reflect the tasks performed by the application.


    However, as we proceed, there will be circumstances in which we create modules
    that will be useful in many different applications. Wherever appropriate, we will
    move those modules into separate files to facilitate reuse. For example, later
