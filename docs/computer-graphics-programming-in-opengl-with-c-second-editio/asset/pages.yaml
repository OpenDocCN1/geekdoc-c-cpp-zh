- pgno: 473
  md: 'To summarize, we have learned thus far that blending RGB colors for light *sources*
    works very well by simply adding the RGB colors, but blending RGB colors for transparent
    planes (as if we are mixing paint) is more problematic. Depending on the colors
    being used, some applications may suffice by using one of the two methods just
    described, that is, either converting the colors to CMY, adding them, and converting
    back to RGB, or simply blending the two colors in RGB with a weighted sum. Figure
    16.27 shows both methods in three scenarios: red/yellow/blue, red/green/blue,
    and magenta/yellow/cyan panes.


    ![](img/1695de1bc7486362f86c143285f3fb40_473_0.png)


    **Figure 16.27**

    Adding in CMY color space (top row) and blending in RGB color space (bottom row).


    In each of the methods shown in Figure 16.27, there is at least one color combination
    that would appear incorrect for mixing paint (or stacking glass panes). Therefore,
    if an application requires correct subtractive blending across the color spectrum,
    none of the above methods will be adequate, and another method is needed.'
