  md: "+   5. Set the OpenGL color mask to enable only the green and blue channels.\n\
    +   6. Call display() to render the scene, using the view and perspective matrices\
    \ for the right eye.\n\nThe above steps occur in the render loop in main() in\
    \ a similar manner as we have been doing throughout the book. Note steps #2 and\
    \ #5 – it is convenient that OpenGL offers the command glColorMask(), which can\
    \ be used to restrict the color channels that are written to the color buffer.\n\
    \nWe illustrate anaglyph rendering using the fog example from Section 14.1 (the\
