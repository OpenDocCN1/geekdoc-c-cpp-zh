    the additions are independent, and therefore can be done in parallel. To keep
    things simple, we will consider only matrices of size six. The strategy is to
    write a compute shader that simply adds two numbers together, and we run that
    shader six times, once for each matrix element. This will allow the six executions
    of the shader to be run in parallel. It is sufficiently simple that we can use
    it to easily illustrate how to: (1) pass data to a compute shader, (2) perform
    a simple parallel computation, and (3) pass the result back to the C++/OpenGL
    application. Details of the code follow the listing.


    There are multiple ways of passing data to a compute shader, including many of
    the normal methods we have already learned such as uniforms, buffers, etc. However,
    there are only two ways of getting computed data *out* of a compute shader. The
