    # ### 16.2.3 Ray-Sphere Intersection


    Computing the intersection(s) of a ray with a sphere is derived using geometry
    and is well-documented [Sf86]. Although the derivation is relatively simple, here
    we describe only the solution. There are either 0, 1, or 2 intersection points,
    depending on if the ray misses the sphere, skims the surface, or enters on one
    side and exits out the other. Given the ray''s origin $r_o$ and direction $r_d$,
    and the sphere''s position $s_p$ and radius $s_r$, then finding the distance $t$
    along the ray at which the intersection(s) occur requires solving the following
    quadratic equation:


    $$ (r_d \cdot r_d)t^2 + (2r_d \cdot [r_o - s_p])t + |r_o - s_p|^2 - s_r^2 = 0
    \qquad [1] $$


    First, we compute its discriminant$^\dagger$:


    $$ \Delta = (2r_d \cdot (r_o - s_p))^2 - 4|r_d|^2 (|r_o - s_p|^2 - s_r^2) $$


    If $\Delta < 0$, we can stop because the ray misses the sphere (and to avoid attempting
    to take the square root of a negative number). When $\Delta$ is not less than
    zero, there are then two solutions to equation [1]:


    $$ t = \frac{(-2r_d \cdot [r_o - s_p]) \pm \sqrt{\Delta}}{2(r_d \cdot r_d)} $$


    The smaller and larger of the two resulting values of $t$ are denoted t_near and
    t_far, respectively.


    +   - When both t_near and t_far are negative, the entire sphere is behind the
    ray and there is no intersection.

    +   - When t_near is negative and t_far is positive, then the ray started inside
    the sphere and the first intersection point is at t_far.

    +   - When both are positive, the first intersection point is at t_near. Note
    that this also handles the case of the ray skimming the surface of the sphere,
    when both t_near and t_far are positive and equal to each other (which occurs
    when the discriminant $\Delta$ is zero).'
