- pgno: 188
  md: 'if the model doesn''t include normals, $\vec{N}$ would need to be estimated
    geometrically based on the locations of neighboring vertices. For the rest of
    the chapter, we will assume that the model being rendered includes normal vectors
    for each vertex (this is common in models constructed with modeling tools such
    as Maya or Blender).


    It turns out that in this case, it isn''t necessary to compute $\theta$ itself.
    What we really desire is $\cos(\theta)$, and recall from Chapter 3 that this can
    be found using the dot product. Thus, the diffuse contribution can be computed
    as follows:


    $$I_{diffuse} = Light_{diffuse} * Material_{diffuse} * (\hat{N} \bullet \hat{L})$$


    The diffuse contribution is only relevant when the surface is exposed to the light,
    which occurs when $-90 \le \theta \le 90$; that is, when $\cos(\theta) \ge 0$.
    Thus, we must replace the rightmost term in the previous equation with:


    $$max((\hat{N} \bullet \hat{L}), 0)$$


    *Specular* contribution determines whether the pixel being rendered should be
    brightened because it is part of a “specular highlight.” It involves not only
    the angle of incidence of the light source, but also the angle between the reflection
    of the light on the surface and the viewing angle of the “eye” relative to the
    object’s surface.


    ![](img/1695de1bc7486362f86c143285f3fb40_188_0.png)


    **Figure 7.5**<br>View angle incidence.


    In Figure 7.5, $\vec{R}$ represents the direction of reflection of the light,
    and $\vec{V}$ (called the *view vector*) is a vector from the pixel to the eye.
    Note that $\vec{V}$ is the negative of the vector from the eye to the pixel (in
    camera space, the eye is at the origin). The smaller the angle $\phi$ between
    $\vec{R}$ and $\vec{V}$, the more the eye is on-axis or “looking into” the reflection,
    and the more this pixel contributes to the specular highlight (and thus the brighter
    it should appear).'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'The manner in which φ is used to compute the specular contribution depends
    on the desired “shininess” of the object being rendered. Objects that are extremely
    shiny, such as a mirror, have very small specular highlights—that is, they reflect
    the incoming light to the eye exactly. Materials that are less shiny have specular
    highlights that are more “spread out,” and thus more pixels are a part of the
    highlight.


    Shininess is generally modeled with a *falloff* function that expresses how quickly
    the specular contribution reduces to zero as the angle φ grows. We can use cos(φ)
    to model falloff, and increase or decrease the shininess by using powers of the
    cosine function, such as cos(φ), cos²(φ), cos⁴(φ), cos⁸(φ), cos¹⁶(φ), cos³²(φ),
    cos⁶⁴(φ), and so on, as illustrated in Figure 7.6.


    ![](img/1695de1bc7486362f86c143285f3fb40_189_0.png)


    Note that the higher the value of the exponent, the faster the falloff, and thus
    the smaller the specular contribution of pixels with light reflections that are
    off-axis from the viewing angle.


    We call the exponent *n*, as used in the *cos^n(φ)* falloff function, the *shininess
    factor* for a specified material. Note back in Figure 7.3 that shininess factors
    for each of the materials listed are specified in the rightmost column.


    We now can specify the full specular calculation:


    $$ I_{\text{specular}} = \text{Light}_{\text{specular}} * \text{Material}_{\text{specular}}
    * \max(0, (\hat{R} \cdot \hat{V})^n) $$


    Note that we use the *max()* function in a similar manner as we did for the diffuse
    computation. In this case, we need to ensure that the specular contribution does
    not ever utilize negative values for cos(φ), which could produce strange artifacts
    such as “darkened” specular highlights.


    And of course as before, the actual computations involve red, green, and blue
    components.


    # ## 7.5 IMPLEMENTING ADS LIGHTING


    The computations described in Section 7.4 have so far been mostly theoretical,
    as they have assumed that we can perform them for every pixel. This is'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'complicated by the fact that normal (N⃗) vectors are typically available to
    us only for the vertices that define the models, not for each pixel. Thus, we
    need to either compute normals for each pixel, which could be time-consuming,
    or find some way of estimating the values that we need to achieve a sufficient
    effect.


    One approach is called “faceted shading” or “flat shading.” Here we assume that
    every pixel in each rendered primitive (i.e., polygon or triangle) has the same
    lighting value. Thus, we need only do the lighting computations for one vertex
    in each polygon in the model, and then copy those lighting values across the nearby
    rendered pixels on a per-polygon or per-triangle basis.


    ![](img/1695de1bc7486362f86c143285f3fb40_190_0.png)


    Faceted shading is rarely used today, because the resulting images tend not to
    look very realistic, and because modern hardware makes more accurate computations
    feasible. An example of a faceted-shaded torus, in which each triangle behaves
    as a flat reflective surface, is shown in Figure 7.7.


    **Figure 7.7**

    Torus with faceted shading.


    Although faceted shading can be adequate in some circumstances (or used as a deliberate
    effect), usually a better approach is “smooth shading,” in which the lighting
    intensity is computed for each pixel. Smooth shading is feasible because of the
    parallel processing done on modern graphics cards, and because of the interpolated
    rendering that takes place in the OpenGL graphics pipeline.


    We will examine two popular methods for smooth shading: *Gouraud shading* and
    *Phong shading*.


    # ### 7.5.1 Gouraud Shading


    The French computer scientist Henri Gouraud published a smooth shading algorithm
    in 1971 that has come to be known as *Gouraud shading* [GO71]. It is particularly
    well suited to modern graphics cards, because it takes advantage of the automatic
    interpolated rendering that is available in 3D graphics pipelines such as OpenGL.
    The process for Gouraud shading is as follows:


    +   1. Determine the color of each *vertex*, incorporating the lighting computations.'
