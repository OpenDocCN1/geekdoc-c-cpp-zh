    \ scene, we place a grid of pixels (at the desired resolution) in which we store\
    \ the rendering of the scene. For each pixel in the grid, we generate one ray,\
    \ as shown in Figure 16.1. An algorithm for rendering a scene in this manner was\
    \ first described in 1968 by Arthur Appel, who dubbed it ray casting [A68]. The\
    \ idea was extended in 1979 by Foley and Whitted to include bouncing each ray\
    \ recursively to simulate reflection, shadows, and refraction [FW79], and this\
    \ process is called “ray tracing.” Today, ray tracing tools and hardware are being\
    \ introduced into the consumer market (such as Nvidia RTX [RTX19])\n\n![](img/1695de1bc7486362f86c143285f3fb40_404_0.png)\n\
    \n**Figure 16.1**  \nRay Casting\n\nImplementing ray tracing using OpenGL shaders\
    \ is challenging. The large number of computations that must be done can tax even\
    \ modern GPUs. Also, as we shall see, a generalized ray tracing algorithm uses\
    \ recursion, which is not supported in OpenGL (GLSL) shaders. While some simple\
    \ cases can be done without recursion, implementing a reasonably complete ray\
    \ tracing algorithm will require us to implement the recursion stack ourselves.\
    \ Our overall approach will involve a two-phase process:\n\n+   - (phase 1) Implement\
    \ the ray-tracing algorithm that builds the pixel grid as an image\n+   - (phase\
