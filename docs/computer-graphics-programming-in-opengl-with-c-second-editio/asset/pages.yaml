    \nThe computations can be done in the fragment shader, or even in the vertex shader\
    \ (with some tweaks) if necessary for performance. Figure 7.15 shows the torus\
    \ rendered using Blinn-Phong shading; the quality is largely indistinguishable\
    \ from Phong shading, with substantial performance cost savings.\n\nProgram 7.3\
