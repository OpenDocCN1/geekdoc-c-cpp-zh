    \   element.type = type;\n   element.depth = depth;\n   element.phase = 0;\n \
    \  element.ray = r;\n\n   stack_pointer++;\n   stack[stack_pointer] = element;\
    \      // add this element to the stack\n}\n\n// The \"pop\" function, which removes\
