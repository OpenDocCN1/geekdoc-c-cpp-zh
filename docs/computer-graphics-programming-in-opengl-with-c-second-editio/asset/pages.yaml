  md: "![](img/1695de1bc7486362f86c143285f3fb40_211_0.png)\n\n**Figure 8.3**  \nProjective\
    \ shadow.\n\n# 8.3 SHADOW VOLUMES\n\nAnother important method, proposed by Crow\
    \ in 1977, is to identify the spatial volume shadowed by an object and reduce\
    \ the color intensity of polygons inside the intersection of the shadow volume\
    \ with the view volume [CR77]. Figure 8.4 shows a cube in a shadow volume, so\
    \ the cube would be drawn darker.\n\nShadow volumes have the advantage of being\
    \ highly accurate, with fewer artifacts than other methods. However, finding the\
    \ shadow volume and then computing whether each polygon is inside of it is computationally\
    \ expensive even on modern GPU hardware. Geometry shaders can be used to generate\
    \ shadow volumes, and the *stencil buffer*¹ can be used to determine whether a\
    \ pixel is within the volume. Some graphics cards include hardware support for\
    \ optimizing certain shadow volume operations.\n\n![](img/1695de1bc7486362f86c143285f3fb40_211_1.png)\n\
    \n**Figure 8.4**  \nShadow volume.\n\n¹ The *stencil buffer* is a third buffer—along\
    \ with the color buffer and the z-buffer—accessible through OpenGL. The stencil\
    \ buffer is not described in this textbook."
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 8.4 SHADOW MAPPING


    One the most practical and popular methods for casting shadows is called *shadow
    mapping*. Although it is not always as accurate as shadow volumes (and is often
    accompanied by pesky artifacts), shadow mapping is easier to implement, can be
    used in a wide variety of situations, and enjoys powerful hardware support.


    We would be remiss if we failed to clarify our use of the word “easier” in the
    previous paragraph. Although shadow mapping is simpler than shadow volumes (both
    conceptually and in practice), it is by no means “easy”! Students often find shadow
    mapping among the most difficult techniques to implement in a 3D graphics course.
    Shader programs are by nature difficult to debug, and shadow mapping requires
    the perfect coordination of several components and shader modules. *Be advised
    that successful implementation of shadow mapping will be greatly facilitated by
    liberal use of the debugging tools described earlier in Section 2.2.*


    Shadow mapping is based on a very simple and clever idea: namely, anything that
    cannot be seen by the *light* is in shadow. That is, if object #1 blocks the light
    from reaching object #2, it is the same as the light not being able to “see” object
    #2.


    The reason this idea is so powerful is that we already have a method for determining
    if something can be “seen”—the hidden surface removal algorithm (HSR) using the
    Z-buffer, as described in Section 2.1.7. So, a strategy for finding shadows is
    to temporarily move the camera to the location of the light, apply the Z-buffer
    HSR algorithm, and then use the resulting depth information to find shadows.


    Rendering our scene will require two passes: one to render the scene from the
    point of view of the light (but not actually drawing it to the screen), and a
    second pass to render it from the point of view of the camera. The purpose of
    pass one is to generate a Z-buffer from the light’s point of view. After completing
    pass one, we need to retain the Z-buffer and use it to help us generate shadows
    in pass two. Pass two actually draws the scene.


    Our strategy is now becoming more refined:


    +   - *(Pass 1) Render the scene from the light’s position. The depth buffer then
    contains, for each pixel, the distance between the light and the nearest object
    to it.*

    +   - *Copy the depth buffer to a separate "shadow buffer."*'
  merge: -1
  img_proc: true
- pgno: 213
  md: '+   - *(Pass 2) Render the scene normally. For each pixel, look up the corresponding
    position in the shadow buffer. If the distance to the point being rendered is
    greater than the value retrieved from the shadow buffer, then the object being
    drawn at this pixel is further from the light than the object nearest the light,
    and therefore this pixel is in shadow.*


    When a pixel is found to be in shadow, we need to make it darker. One simple and
    effective way of doing this is to render only its ambient lighting, ignoring its
    diffuse and specular components.


    The method described above is often called “shadow buffering.” The term “shadow
    mapping” arises when, in the second step, we instead copy the depth buffer into
    a *texture*. When a texture object is used in this way, we will refer to it as
    a *shadow texture*, and OpenGL has support for shadow textures in the form of
    a sampler2DShadow type (discussed below). This allows us to leverage the power
    of hardware support for texture units and sampler variables (i.e., “texture mapping”)
    in the fragment shader to quickly perform the depth lookup in pass 2. Our revised
    strategy now is:


    +   - *(Pass 1) as before.*

    +   - *Copy the depth buffer into a texture.*

    +   - *(Pass 2) as before, except that the shadow buffer is now a shadow texture.*


    Let’s now implement these steps.


    # 8.4.1 Shadow Mapping (PASS ONE) – “Draw” Objects from Light Position


    In step one, we first move our camera to the light’s position and then render
    the scene. Our goal here is *not* to actually draw the scene on the display, but
    to complete just enough of the rendering process that the depth buffer is properly
    filled. Thus, it will not be necessary to generate colors for the pixels, and
    so our first pass will utilize a vertex shader, but the fragment shader does nothing.


    Of course, moving the camera involves constructing an appropriate *view* matrix.
    Depending on the contents of the scene, we will need to decide on an appropriate
    *direction* to view the scene from the light. Typically, we would want this direction
    to be toward the region that is ultimately rendered in pass 2.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'This is often application specific—in our scenes, we will generally be pointing
    the camera from the light to the origin.


    Several important details need to be handled in pass one:


    +   - Configure the buffer and shadow texture.

    +   - Disable color output.

    +   - Build a look-at matrix from the light toward the objects in view.

    +   - Enable the GLSL pass one shader program, containing only the simple vertex
    shader shown in Figure 8.5 that expects to receive an MVP matrix. In this case,
    the MVP matrix will include the object''s model matrix M, the look-at matrix computed
    in the previous step (serving as the view matrix V), and the perspective matrix
    P. We call this MVP matrix "shadowMVP" because it is based on the point of view
    of the light rather than the camera. Since the view from the light isn''t actually
    being displayed, the pass one shader program''s fragment shader doesn''t do anything.

    +   - For each object, create the shadowMVP matrix and call glDrawArrays(). It
    is not necessary to include textures or lighting in pass one, because objects
    are not rendered to the screen.


    ```

    ```glsl

    #version 430            // vertex shader

    layout (location=0) in vec3 vertPos;

    uniform mat4 shadowMVP;


    void main(void)

    {  gl_Position = shadowMVP * vec4(vertPos,1.0);

    }

    #version 430            // fragment shader

    void main(void) {}

    ```

    ```


    **Figure 8.5**

    Shadow mapping pass 1 vertex and fragment shaders.


    # ### 3.3.2 Shadow Mapping (Intermediate Step) – Copying the Z-Buffer to a Texture


    OpenGL offers two methods for putting Z-buffer depth data into a texture unit.
    The first method is to generate an empty shadow texture and then use the command
    glCopyTexImage2D() to copy the active depth buffer into the shadow texture.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'The second method is to build a “custom framebuffer” back in pass one (rather
    than use the default Z-buffer) and attach the shadow texture to it using the command
    `glFrameBufferTexture()`. This command was introduced into OpenGL in version 3.0
    to further support shadow mapping. When using this approach, it isn’t necessary
    to “copy” the Z-buffer into a texture, because the buffer already has a texture
    attached to it, and so the depth information is put into the texture by OpenGL
    automatically. This is the method we will use in our implementation.


    # ### 8.4.2 Shadow Mapping (PASS TWO) – Rendering the Scene with Shadows


    Much of pass two will resemble what we saw in Chapter 7. Namely, it is here that
    we render our complete scene and all of the items in it, along with the lighting,
    materials, and any textures adorning the objects in the scene. We also need to
    add the necessary code to determine, for each pixel, whether or not it is in shadow.


    An important feature of pass two is that it utilizes two MVP matrices. One is
    the standard MVP matrix that transforms object coordinates into screen coordinates
    (as seen in most of our previous examples). The other is the shadowMVP matrix
    that was generated in pass one for use in rendering from the light’s point of
    view—this will now be used in pass two for looking up depth information from the
    shadow texture.


    A complication arises in pass two when we try to look up pixels in a texture map.
    The OpenGL camera utilizes a [-1,+1] coordinate space, whereas texture maps utilize
    a [0,1] space. A common solution is to build an additional matrix transform, typically
    called B, that converts (or “biases,” hence the name) from camera space to texture
    space. Deriving B is fairly simple—a scale by one-half followed by a translate
    by one-half.


    The B matrix is as follows:


    B =

    [0.5 0 0 0.5]

    [0 0.5 0 0.5]

    [0 0 0.5 0.5]

    [0 0 0 1]


    B is then concatenated onto the shadowMVP matrix for use in pass two, as follows:


    shadowMVP2 = [B] [shadowMVP_(pass1)]'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Assuming that we use the method whereby a shadow texture has been attached
    to our custom framebuffer, OpenGL provides some relatively simple tools for determining
    whether each pixel is in shadow as we draw the objects. Here is a summary of the
    details handled in pass two:


    +   - Build the "B" transform matrix for converting from light to texture space
    (actually, this is more appropriately done in init() ).

    +   - Enable the shadow texture for lookup.

    +   - Enable color output.

    +   - Enable the GLSL pass two rendering program, containing both vertex and fragment
    shaders.

    +   - Build the MVP matrix for the object being drawn based on the camera position
    (as normal).

    +   - Build the shadowMVP2 matrix (incorporating the B matrix, as described earlier)—the
    shaders will need it to look up pixel coordinates in the shadow texture.

    +   - Send the matrix transforms to shader uniform variables.

    +   - Enable buffers containing vertices, normal vectors, and texture coordinates
    (if used), as usual.

    +   - Call glDrawArrays().


    In addition to their rendering duties, the vertex and fragment shaders have additional
    tasks:


    +   - The vertex shader converts vertex positions from camera space to light space
    and sends the resulting coordinates to the fragment shader in a vertex attribute
    so that they will be interpolated. This makes it possible to retrieve the correct
    values from the shadow texture.

    +   - The fragment shader calls the textureProj() function, which returns a 0
    or 1 indicating whether or not the pixel is in shadow (this mechanism is explained
    later). If it is in shadow, the shader outputs a darker pixel by not including
    its diffuse and specular contributions.


    Shadow mapping is such a common task that GLSL provides a special type of sampler
    variable called a sampler2DShadow (as previously mentioned) that can be attached
    to a shadow texture in the C++/OpenGL application. The textureProj() function
    is used to look up values from a shadow texture, and it is similar to texture()
    that we saw previously in Chapter 5, except that it uses a vec3 to index the texture'
  merge: -1
  img_proc: true
