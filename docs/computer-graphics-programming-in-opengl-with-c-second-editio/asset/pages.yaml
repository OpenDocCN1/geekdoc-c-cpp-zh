  img_proc: true
- pgno: 297
  md: 'Next let’s look at the Tessellation Evaluation Shader. It starts with a line
    of code that says:


    ```

    layout(quads, equal_spacing, ccw) in;

    ```


    This may at first appear to be related to the “out” layout statement in the control
    shader, but actually they are unrelated. Rather, this line is where we instruct
    the tessellator to generate vertices so they are arranged in a large rectangle
    (a “quad”). It also specifies the subdivisions (inner and outer) to be of equal
    length (later we will see a use for subdivisions of unequal length). The “ccw”
    parameter specifies the winding order in which the tessellated grid vertices are
    generated (in this case, counter-clockwise).


    The vertices generated by the tessellator are then sent to the evaluation shader.
    Thus, the evaluation shader *may* receive vertices *both* from the control shader
    (typically as control points) and from the tessellator (the tessellated grid).
    In Program 12.1, vertices are only received from the tessellator.


    The evaluation shader executes once for each vertex produced by the tessellator.
    The vertex location is accessible using the built-in variable `gl_TessCoord`.
    The tessellated grid is oriented such that it lies in the X-Z plane, and therefore
    `gl_TessCoord`’s X and Y components are applied at the grid’s X and Z coordinates.
    The grid coordinates, and thus the values of `gl_TessCoord`, range from 0.0 to
    1.0 (this will be handy later when computing texture coordinates). The evaluation
    shader then uses the `mvp` matrix to orient each vertex (this was done in the
    vertex shader in examples from earlier chapters).


    Finally, the fragment shader simply outputs a constant color yellow for each pixel.
    We can, of course, also use it to apply a texture or lighting to our scene as
    we saw in previous chapters.


    # # 12.2 TESSELLATION FOR BÉZIER SURFACES


    Let’s now extend our program so that it turns our simple rectangular grid into
    a Bézier surface. The tessellated grid should give us plenty of vertices for sampling
    the surface (and we can increase the inner/outer subdivision levels if we want
    more). What we now need is to send *control points* through the pipeline, and
    then use those control points to perform the computations to convert the tessellated
    grid into the desired Bézier surface.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '![](img/1695de1bc7486362f86c143285f3fb40_298_0.png)


    Assuming that we wish to build a cubic Bézier surface, we will need sixteen control
    points. We could send them from the C++ side in a VBO, or we could hardcode them
    in the vertex shader. Figure 12.4 shows an overview of the process with the control
    points coming from the C++ side.


    Now is a good time to explain a bit more precisely how the tessellation control
    shader (TCS) works. Similar to the vertex shader, the TCS executes once per incoming
    vertex. Also, recall from Chapter 2 that OpenGL provides a built-in variable called
    `gl_VertexID` which holds a counter that indicates which invocation of the vertex
    shader is currently


    executing. A similar built-in variable called `gl_InvocationID` exists for the
    tessellation control shader.


    A powerful feature of tessellation is that the TCS (and also the TES) shader has
    access to all of the control point vertices simultaneously, in arrays. At first,
    it may seem confusing that the TCS executes once per vertex, when each invocation
    has access to all of the vertices. It is also counterintuitive that the tessellation
    levels are specified in assignment statements which are redundantly set at each
    TCS invocation. Although all of this may seem odd, it is done this way because
    the tessellation architecture is designed so that TCS invocations can run in parallel.


    OpenGL provides several built-in variables for use in the TCS and TES shaders.
    Ones that we have already mentioned are `gl_InvocationID` and of course `gl_TessLevelInner`
    and `gl_TessLevelOuter`. Here are some more details and descriptions of some of
    the most useful built-in variables:


    *Tessellation Control Shader (TCS) built-in variables:*


    +   - `gl_in[]` — an array containing each of the incoming control point vertices—one
    array element per incoming vertex. Particular vertex attributes can be accessed
    as fields using the “.” notation. One built-in attribute is `gl_Position`—thus,
    the position of incoming vertex “i” is accessed as `gl_in[i].gl_Position`.'
  merge: -1
