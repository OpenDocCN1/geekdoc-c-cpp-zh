  md: '+   2. It then creates OpenGL shader objects and loads the GLSL shader code
    into them.

    +   3. Finally, it uses OpenGL commands to compile and link objects and install
    them on the GPU.


    In practice, it is usually necessary to provide GLSL code for at least the *vertex*
    and *fragment* stages, whereas the tessellation and geometry stages are optional.
    Let’s walk through the entire process and see what takes place at each step.


    ![](img/1695de1bc7486362f86c143285f3fb40_29_0.png)


    **Figure 2.2**

    Overview of the OpenGL pipeline.


    # 2.1.1 C++/OpenGL Application


    The bulk of our graphics application is written in C++. Depending on the purpose
    of the program, it may interact with the end user using standard C++ libraries.
    For tasks related to 3D rendering, it uses OpenGL calls. As described in the previous
    chapter, we will be using several additional libraries: GLEW (OpenGL Extension
    Wrangler), GLM (OpenGL Mathematics), SOIL2 (Simple OpenGL Image Loader), and GLFW
    (Graphics Library Framework).


    The GLFW library includes a class called GLFWwindow on which we can draw 3D scenes.
    As already mentioned, OpenGL also gives us commands for installing GLSL programs
    onto the programmable shader stages and compiling them. Finally, OpenGL uses *buffers*
    for sending 3D models and other related graphics data down the pipeline.


    Before we try writing shaders, let’s write a simple C++/OpenGL application that
    instantiates a GLFWwindow and sets its background color. Doing that won’t require
    any shaders at all! The code is shown in Program 2.1. The main() function shown
    in Program 2.1 is the same one that we will use throughout this textbook. Among
    the significant operations in main() are: (a) initializes the GLFW library, (b)
    instantiates a GLFWwindow, (c) initializes the GLEW library, (d) calls the function
    “init()” once, and (e) calls the function “display()” repeatedly.


    The “init()” function is where we will place application-specific initialization
    tasks. The display() method is where we place code that draws to the GLFWwindow.'
