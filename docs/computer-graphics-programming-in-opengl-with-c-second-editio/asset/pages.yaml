  md: 'phases don’t require the generation of additional rays (collision detection,
    lighting/shadows, and texturing). However, the reflection and refraction phases
    both require generating a new ray and running `process_stack_element()` on the
    new ray(s). Since there is no way in GLSL to make such a call recursively, we
    adjust the contents of the current stack element to keep track of where we left
    off, push a new stack element containing the new ray to be processed, and then
    exit `process_stack_element()`. The driver function — the new version of `rayTrace()`
    — then continues iteratively calling `process_stack_element()` until every stack
    element (every ray) has had a chance to complete all five phases. The end result
    is the same as if recursion had been available.


