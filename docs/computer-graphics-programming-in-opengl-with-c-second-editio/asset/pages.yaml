  md: "vertices progress in a clockwise direction (as viewed from the OpenGL camera)\
    \ are *back-facing*, and are not rendered. This counter-clockwise definition of\
    \ “front-facing” is sometimes called the *winding order*, and can be set explicitly\
    \ using the function call glFrontFace(GL_CCW) for counter-clockwise (the default)\
    \ or glFrontFace(GL_CW) for clockwise. Similarly, whether it is the front-facing\
    \ or the back-facing triangles that are rendered can also be set explicitly. Actually,\
    \ for this purpose we specify which ones are *not* to be rendered—that is, which\
    \ ones are “culled.” We can specify that the back-facing triangles be culled (although\
    \ this would be unnecessary because it is the default) by calling glCullFace(GL_BACK).\
    \ Alternatively, we can specify instead that the front-facing triangles be culled,\
    \ or even that all of the triangles be culled, by replacing the parameter GL_BACK\
    \ with either GL_FRONT or GL_FRONT_AND_BACK respectively.\n\nAs we will see in\
    \ Chapter 6, 3D models are typically designed so that the outer surface is constructed\
    \ of triangles with the same winding order—most commonly counter-clockwise—so\
    \ that if culling is enabled, then by default the portion of the model’s outer\
    \ surface that faces the camera is rendered. Since by default OpenGL assumes the\
    \ winding order is counter-clockwise, if a model is designed to be displayed with\
    \ a *clockwise* winding order, it is up to the programmer to call gl_FrontFace(GL_CW)\
    \ to account for this if back-face culling is enabled.\n\nNote that in the case\
    \ of GL_TRIANGLE_STRIP, the winding order of each triangle alternates. OpenGL\
    \ compensates for this by “flipping” the vertex sequence when building each successive\
    \ triangle, as follows: 0-1-2, then 2-1-3, 2-3-4, 4-3-5, 4-5-6, and so on.\n\n\
    Back-face culling improves performance by ensuring that OpenGL doesn’t spend time\
    \ rasterizing and rendering surfaces that are never intended to be seen. Most\
    \ of the examples we have seen in this chapter are so small that there is little\
    \ motivation to enable face culling (an exception is the example shown in Figure\
