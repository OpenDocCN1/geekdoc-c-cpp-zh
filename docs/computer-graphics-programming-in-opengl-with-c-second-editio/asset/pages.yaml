- pgno: 93
  md: 'setupVertices() function sets up the VAO and two VBOs (although only one is
    used) and loads the cube vertices into the 0th VBO buffer.


    Note that the init() function performs tasks that only need to be done once: reading
    in shader code and building the rendering program, and loading cube vertices into
    the VBO (by calling setupVertices()). Note that it also positions the cube and
    the camera in the world. Later we will animate the cube and also see how to move
    the camera around, at which point we may need to remove this hardcoded positioning.


    Now let’s look at the display() function. Recall that display() may be called
    repeatedly and the rate at which it is called is referred to as the *frame rate*.
    That is, animation works by continually drawing and redrawing the scene, or frame,
    very quickly. It is usually necessary to clear the depth buffer before rendering
    a frame so that hidden surface removal occurs properly (not clearing the depth
    buffer can sometimes result in every surface being removed, resulting in a completely
    black screen). By default, depth values in OpenGL range from 0.0 to 1.0. Clearing
    the depth buffer is done by calling glClear(GL_DEPTH_BUFFER_BIT), which fills
    the depth buffer with the default value (usually 1.0).


    Next, display() enables the shaders by calling glUseProgram(), installing the
    GLSL code on the GPU. Recall this doesn’t run the shader program, but it does
    enable subsequent OpenGL calls to determine the shader’s *vertex attribute* and
    *uniform* locations. The display() function next gets the uniform variable locations,
    builds the perspective, view, and model matrices³, concatenates the view and model
    matrices into a single MV matrix, and assigns the perspective and MV matrices
    to their corresponding uniforms. Here, it is worth noting also the form of the
    GLM call to the translate() function:


    ```

    vMat = glm::translate(glm::mat4(1.0f), glm::vec3(-cameraX, -cameraY, -cameraZ));

    ```


    The somewhat cryptic-looking call builds a translation matrix by (a) starting
    with an identity matrix (using the glm::mat4(1.0f) constructor) and (b) specifying
    translation values in the form of a vector (with the glm::vec3(x,y,z) constructor).
    Many of the GLM transform operations utilize this approach.


    ³ An astute reader may notice that it shouldn’t be necessary to build the perspective
    matrix every time display() is called, because its value doesn’t change. This
    is partially true—the perspective matrix would need to be recomputed if the user
    were to resize the window while the program was running. In Section 4.11 we will
    handle this situation more efficiently, and in the process we will move the computation
    of the perspective matrix out of display() and into the init() function.'
