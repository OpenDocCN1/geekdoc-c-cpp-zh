- pgno: 195
  md: "# *(Program 7.1, continued)*\n\n# *Vertex Shader*\n\n```\n```glsl\n#version\
    \ 430\nlayout(location=0) in vec3 vertPos;\nlayout(location=1) in vec3 vertNormal;\n\
    out vec4 varyingColor;\n\nstruct PositionalLight\n{ vec4 ambient;\n  vec4 diffuse;\n\
    \  vec4 specular;\n  vec3 position;\n};\nstruct Material\n{ vec4 ambient;\n  vec4\
    \ diffuse;\n  vec4 specular;\n  float shininess;\n};\nuniform vec4 globalAmbient;\n\
    uniform PositionalLight light;\nuniform Material material;\nuniform mat4 mv_matrix;\n\
    uniform mat4 proj_matrix;\nuniform mat4 norm_matrix;  // for transforming normals\n\
    \nvoid main(void)\n{ vec4 color;\n\n  // convert vertex position to view space,\n\
    \  // convert normal to view space, and\n  // calculate view space light vector\
    \ (from vertex to light)\n  vec4 P = mv_matrix * vec4(vertPos,1.0);\n  vec3 N\
    \ = normalize((norm_matrix * vec4(vertNormal,1.0)).xyz);\n  vec3 L = normalize(light.position\
    \ - P.xyz);\n\n  // view vector is equivalent to the negative of view space vertex\
    \ position\n  vec3 V = normalize(-P.xyz);\n\n  // R is reflection of -L with respect\
    \ to surface normal N\n  vec3 R = reflect(-L,N);\n\n  // ambient, diffuse, and\
    \ specular contributions\n  vec3 ambient = ((globalAmbient * material.ambient)\
    \ + (light.ambient * material.ambient)).xyz;\n  vec3 diffuse = light.diffuse.xyz\
    \ * material.diffuse.xyz * max(dot(N,L), 0.0);\n```\n```"
