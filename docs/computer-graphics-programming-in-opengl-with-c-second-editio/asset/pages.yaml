  md: "we will refer to the parameters as *u* and *v*. Whereas our curves were composed\
    \ of points P(t), our surfaces will comprise points P(u,v), as shown in Figure\
    \ 11.8.\n\nFor quadratic Bézier surfaces, there are three control points on each\
    \ axis *u* and *v*, for a total of nine control points. Figure 11.9 shows an example\
    \ of a set of nine control points (typically called a control point “mesh”) in\
    \ blue, and the associated corresponding curved surface (in red).\n\nThe nine\
    \ control points in the mesh are labeled p_ij, where i and j represent the indices\
    \ in the *u* and *v* directions respectively. Each set of three adjacent control\
    \ points, such as (p_00, p_01, p_02), defines a Bézier curve. Points P(u,v) on\
    \ the surface are then defined as a sum of two blending functions, one in the\
    \ *u* direction and one in the *v* direction. The form of the two blending functions\
    \ for building Bézier surfaces then follows from the methodology given previously\
    \ for Bézier curves:\n\n$$\nB_0(u) = (1-u)^2\nB_1(u) = -2u^2 + 2u\nB_2(u) = u^2\n\
    B_0(v) = (1-v)^2\nB_1(v) = -2v^2 + 2v\nB_2(v) = v^2\n$$\n\nThe points P(u,v) comprising\
    \ the Bézier surface are then generated by summing the product of each control\
    \ point p_ij and the i-th and j-th blending functions evaluated at parametric\
    \ values *u* and *v* respectively:\n\n$$P(u,v)=∑_{i=0}^{2}∑_{j=0}^{2} p_{ij} *\
    \ B_i(u) * B_j(v)$$\n\n![](img/1695de1bc7486362f86c143285f3fb40_285_0.png)\n\n\
