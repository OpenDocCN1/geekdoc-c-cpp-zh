    \ the floor to be distorted based on the distortions on the water surface – but\
    \ they are straight.\n+   - When the camera is below the surface (right image),\
    \ we expect the lighting on the floor to be similarly distorted, but the specular\
    \ highlight is perfectly round.\n+   - Light is attenuated more rapidly under\
    \ water, but the floor is equally bright both up close and far away.\n+   - The\
    \ Fresnel effect is missing. This is a phenomenon in which viewing straight down\
    \ through a transparent medium (such as water) favors the refraction contribution,\
    \ while looking across the surface favors the reflection [B01]. Instead, in the\
    \ image at the left, reflection and refraction are equally apparent across the\
