- pgno: 232
  md: 'More specifically, the four usual offset patterns for each of the cases resulting
    from the glFragCoord mod 2 computation are:


    | case (0,0) | case (0,1) | case (1,0) | case (1,1) |

    |---|---|---|---|

    | sample points: | sample points: | sample points: | sample points: |

    | (s_x-1.5, s_y+1.5) | (s_x-1.5, s_y+0.5) | (s_x-0.5, s_y+1.5) | (s_x-0.5, s_y+0.5)
    |

    | (s_x-1.5, s_y-0.5) | (s_x-1.5, s_y-1.5) | (s_x+0.5, s_y-0.5) | (s_x+0.5, s_y-1.5)
    |

    | (s_x+0.5, s_y+1.5) | (s_x+0.5, s_y+0.5) | (s_x+1.5, s_y+1.5) | (s_x+1.5, s_y+0.5)
    |

    | (s_x+0.5, s_y-0.5) | (s_x+0.5, s_y-1.5) | (s_x+1.5, s_y-0.5) | (s_x+1.5, s_y-1.5)
    |


    S_x and S_y refer to the location (S_x, S_y) in the shadow map corresponding to
    the pixel being rendered, identified as shadow_coord in the code examples throughout
    this chapter. These four offset patterns are illustrated in Figure 8.22, with
    each case shown in a different color. In each case, the texel corresponding to
    the pixel being rendered is at the origin of the graph for that case. Note that
    when shown together in Figure 8.23, the staggering/dithering of the offsets is
    apparent.


    ![](img/1695de1bc7486362f86c143285f3fb40_232_0.png)


    Let’s walk through the entire computation for a particular pixel. Assume the pixel
    being rendered is located at glFragCoord = (48,13). We start by determining the
    four shadow map sample points for the pixel. To do that, we would compute vec2(48,13)
    mod 2, which equals (0,1). From that we would choose the offsets shown for case
    (0,1), shown in green in Figure 8.22, and the specific points to be sampled in
    the shadow map (assuming that no scaling of the offsets has been specified) would
    be:


    +   - (shadow_coord.x-1.5, shadow_coord.y+0.5)

    +   - (shadow_coord.x-1.5, shadow_coord.y-1.5)'
