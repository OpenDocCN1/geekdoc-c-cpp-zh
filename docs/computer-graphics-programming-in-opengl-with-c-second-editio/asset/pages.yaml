    \ = (GLubyte) bluePortion;\n                data[(noiseWidth*noiseHeight*4)+(noiseHeight*4*k)+4*j+3]\
    \ = (GLubyte) 255;\n            } } } }\n```\n```\n\nThe wood rings in Figure\
