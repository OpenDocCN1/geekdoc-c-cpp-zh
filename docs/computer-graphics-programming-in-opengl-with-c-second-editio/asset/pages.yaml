- pgno: 448
  md: '# ### 16.3.2 Refraction


    What happens when an object is transparent? Of course, we expect to see what lies
    behind it (at least partially). As we saw in Chapter 14, OpenGL has support for
    rendering with transparency, and there are commands for blending colors to simulate
    transparency. However, ray tracing can give us the tools to generate some of the
    more complex aspects of transparency and improve realism. For example, ray tracing
    allows us to simulate refraction.


    Refraction happens when light rays are bent when passing through a transparent
    object, causing an object''s position to appear to shift when it is placed behind
    another transparent object. The amount that the light rays are bent depends on
    the shape of the transparent object and the material of which it is made. A transparent
    object is sometimes referred to as the *medium* that the light is passing through,
    and different transparent media (such as water, glass, or a diamond) bend light
    to different degrees. Anyone who has peered through a fishbowl knows how complex
    refraction can be. We will only scratch the surface and see some very simple examples.


    The amount that a given medium bends light is called its *index of refraction*
    or *IOR*. We usually indicate index of refraction with η. IOR is a factor that
    indicates the degree to which a ray''s angle when it hits a medium is altered
    when the ray continues through the medium (actually, the sines of those angles).
    The IOR of a vacuum is 1, and the IOR of glass is about 1.5. The IOR of air is
    so close to 1 that it is usually ignored.


    In the case of an object that has thickness (such as our sphere or box, if transparent),
    refraction may occur both when the ray enters the object, and then again when
    it exits, and both would need to be considered to properly render an object behind
    a transparent one. Thus, adding refraction to our scene (e.g., making the sphere
    or the box transparent) requires a sequence of two successive secondary rays,
    one that refracts from the initial ray into the object and a second one that refracts
    as the ray exits the object. An example is shown in Figure 16.14, where the current
    initial ray being processed is labeled I, the normal at the initial collision
    point is N₁, the first secondary ray is S₁, the normal at the second collision
    point is N₂, and the second secondary ray is S₂. In a purely transparent object,
    the color at the final collision point C is the color that would be ultimately
    be rendered at the collision point of the initial ray I.'
