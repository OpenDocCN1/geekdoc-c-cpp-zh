- pgno: 264
  md: 'To understand how this works, we start by noting that a vector can be stored
    to reasonable precision in three bytes, one for each of the X, Y, and Z components.
    This makes it possible to store normals in a color image file, with the R, G,
    and B components corresponding to X, Y, and Z. RGB values in an image are stored
    in bytes and are usually interpreted as values in the range [0..1], whereas vectors
    can have positive or negative component values. If we restrict normal vector components
    to the range [-1..+1], a simple conversion to enable storing a normal vector N
    as a pixel in an image file is:


    $R = (N_x + 1)/2$


    $G = (N_y + 1)/2$


    $B = (N_z + 1)/2$


    Normal mapping utilizes an image file (called a *normal map*) that contains normals
    corresponding to a desired surface appearance in the presence of lighting. In
    a normal map, the vectors are represented relative to an arbitrary plane X-Y,
    with their X and Y components representing deviations from “vertical” and their
    Z component set to 1. A vector strictly perpendicular to the X-Y plane (i.e.,
    with no deviation) would be represented (0,0,1), whereas non-perpendicular vectors
    would have non-zero X and/or Y components. We use the above formulae to convert
    to RGB space; for example, (0,0,1) would be stored as (.5,.5,1), since actual
    offsets range [-1..+1], but RGB values range [0..1].


    We can make use of such a normal map through yet another clever application of
    texture units: instead of storing colors in the texture unit, we store the desired
    normal vectors. We can then use a sampler to look up the value in the normal map
    for a given fragment, and then rather than applying the returned value to the
    output pixel color (as we did in texture mapping), we instead use it as the normal
    vector.


    ![](img/1695de1bc7486362f86c143285f3fb40_264_0.png)


    One example of such a normal map image file is shown in Figure 10.3. It was generated
    by applying the GIMP normal mapping plugin [GI20] to a texture from Luna [LU16].
    Normal-mapping image files are not intended for viewing; we show this one to point
    out that such images end up being largely blue. This is because every entry in
    the image file has a B value of 1 (maximum blue), making the image appear “bluish”
    if viewed.


    **Figure 10.3**


    Normal mapping image file example [LU16].'
  merge: -1
  img_proc: true
- pgno: 265
  md: "![](img/1695de1bc7486362f86c143285f3fb40_265_0.png)\n\n**Figure 10.4**  \n\
    Normal mapping examples.\n\nFigure 10.4 shows two different normal map image files\
    \ (both are built out of textures from Luna [LU16]) and the result of applying\
    \ them to a sphere in the presence of Blinn-Phong lighting.\n\nNormal vectors\
    \ retrieved from a normal map cannot be utilized directly, because they are defined\
    \ relative to an arbitrary X-Y plane as described previously, without taking into\
    \ account their position on the object and their orientation in camera space.\
    \ Our strategy for addressing this will be to build a transformation matrix for\
    \ converting the normals into camera space, as follows.\n\nAt each vertex on an\
    \ object, we consider a plane that is tangent to the object. The object normal\
    \ at that vertex is perpendicular to this plane. We define two mutually perpendicular\
    \ vectors in that plane, also perpendicular to the normal, called the *tangent*\
    \ and *bitangent* (sometimes called the *binormal*). Constructing our desired\
    \ transformation matrix requires that our models include a tangent vector for\
    \ each vertex (the bitangent can be built by computing the cross product of the\
    \ tangent and the normal). If the model does not already have tangent vectors\
    \ defined, they could be computed. In the case of a sphere they can be computed\
    \ exactly, as shown in the following modifications to Program 6.1:\n\n…\n\n```\n\
    for (int i=0; i<=prec; i++) {\n    for (int j=0; j<=prec; j++) {\n        float\
    \ y = (float)cos(toRadians(180.0f - i*180.0f / prec));\n        float x = -(float)cos(toRadians(j*360.0f\
    \ / prec)) * (float)abs(cos(asin(y)));\n        float z = (float)sin(toRadians(j*360.0f\
    \ / prec)) * (float)abs(cos(asin(y)));\n        vertices[i*(prec+1)+j] = glm::vec3(x,\
    \ y, z);\n    }\n}\n```"
