  img_proc: true
- pgno: 469
  md: 'It is a simple matter to declare an object to be transparent, and also having
    a color, by simply assigning an RGB value for whatever color we want (such as
    [1,0,0] for red), and then combining this color with the incoming refracted color
    as we did in previous examples. However, the results are not always as one would
    expect! For example, suppose that we declare three panes colored red, yellow,
    and blue, and stack them in our scene so that we can see the result of mixing
    the colors as we have been doing, with equal weights where they overlap. The result
    is shown in Figure 16.23. Is this what you would expect to see if these were real
    colored panes of glass?


    ![](img/1695de1bc7486362f86c143285f3fb40_469_0.png)


    **Figure 16.23**

    A scene with three overlapping colored panes, colors mixed equally


    Figure 16.23 was created by defining three overlapping transparent colored panes
    (red, yellow, and blue) and mixing their colors with a weighted sum as we have
    done before, such as


    ```

    mixed_color = mix(pane_color, refracted_color, 0.5);

    ```


    Where the red and yellow overlap, we see orange, and where the red and blue overlap
    we see purple, both of which are likely to match our expectations. However, where
    yellow and blue overlap we probably expected green, but a sort of grey color appears
    there instead.


    Welcome to the complex world of color models! If those were *real* glass panes,
    we should indeed see green where the yellow and blue panes overlap. That is because
    as white light passes through a yellow pane, and then a blue pane, some of the
    spectrum from the original white light is removed, leaving only the green'
  merge: -1
  img_proc: true
- pgno: 470
  md: 'portion. This is called a *subtractive* color effect, and is how colors blend
    when, for example, mixing paint or ink.


    However, suppose that these panes were actually *emitting* colors, rather than
    filtering them — such as if a yellow light source was combined (*added*) to a
    blue light source. In that case, the yellow and blue panes would *not* combine
    to form green. Thus, depending on what we wish to model, we need to blend colors
    in different ways.


    So far, all of our colors have been expressed using the RGB color model. RGB is
    an example of an *additive* color model, and it is designed for *blending light
    sources* — most specifically the red, green, and blue elements of an RGB computer
    monitor — by adding them together. That is, it is designed not to “mix” its colors
    like paint, but ideally to *add* them. When mixing paint, we expect each successive
    combined color to *darken* the mix (because each successive color subtracts some
    portion of the light). However, in an additive model which blends light sources,
    each successive color *brightens* the mix, moving it closer and closer to white
    light.


    Another thing about the RGB model that is a common source of confusion is that
    it is designed with primary colors red, green, and blue, rather than the familiar
    red, *yellow*, and blue primary colors for paints or crayons that most of us learned
    in elementary school. The RGB primary colors work very well if our three panes
    are light sources. Suppose for example that we replaced the red/yellow/blue panes
    with red/green/blue panes, and simply *added* their colors, without weights, as
    in the following:


    mixed_color = pane_color + refracted_color;


    The result is shown in Figure 16.24.


    ![](img/1695de1bc7486362f86c143285f3fb40_470_0.png)


    **Figure 16.24**

    A scene with three overlapping colored light sources, colors added together'
