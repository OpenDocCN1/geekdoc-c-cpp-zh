- pgno: 62
  md: '# ### 3.4.3 Rotation


    Rotation is a bit more complex, because rotating an item in 3D space requires
    specifying (a) an axis of rotation and (b) a rotation amount in degrees or radians.


    In the mid-1700s, the mathematician Leonard Euler showed that a rotation around
    any desired axis could be specified instead as a combination of rotations around
    the X, Y, and Z axes [EU76]. These three rotation angles around the respective
    axes have come to be known as *Euler angles*. The discovery, known as *Euler''s
    Theorem*, is very useful to us, because rotations around each of the three axes
    can be specified using matrix transforms.


    The three rotation transforms, around the X, Y, and Z axes respectively, are shown
    in Figure 3.5. There are several functions in GLM for building and using rotation
    matrices as well:


    +   - `glm::rotate(mat4, 0, x, y, z)` builds a rotation matrix for an angle θ
    around an axis x,y,z.

    +   - `mat4 * vec4`


    ![](img/1695de1bc7486362f86c143285f3fb40_62_0.png)


    **Figure 3.5** Rotation transform matrices.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'In practice, using Euler angles to rotate an item around an arbitrary line
    in 3D space takes a couple of additional steps if the line doesn’t pass through
    the origin. In general:


    +   1. Translate the axis of rotation so that it goes through the origin.

    +   2. Rotate by appropriate Euler angles around X, Y, and Z.

    +   3. Undo the translation of Step 1.


    The three rotation transforms shown in Figure 3.5 each have the interesting property
    that the inverse rotation happens to equal the transpose of the matrix. This can
    be verified by examining the previous matrices, recalling that cos(-θ) = cos(θ),
    and sin(-θ) = -sin(θ). This property will become useful later.


    Euler angles can cause certain artifacts in some 3D graphics applications. For
    that reason it is often advisable to use *quaternions* for computing rotations.
    Many resources exist for those readers interested in exploring quaternions (e.g.,
    [KU98]). Euler angles will suffice for most of our needs.


    # 3.5 VECTORS


    Vectors specify a *magnitude and direction*. They are not bound to a specific
    location; a vector can be “moved” without changing what it represents.


    There are various ways to notate a vector, such as a line segment with an arrowhead
    at one end, or as a pair (magnitude, direction), or as the difference between
    two points. In 3D graphics, vectors are frequently represented as a single point
    in space, where the vector is the distance and direction from the origin to that
    point. In Figure 3.6, vector V (shown in red) can be specified either as the


    ![](img/1695de1bc7486362f86c143285f3fb40_63_0.png)


    **Figure 3.6**

    Two representations for a vector V.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'difference between points P1 and P2, or as an equivalent distance from the
    origin to P3. In all of our applications, we specify V as simply (x,y,z), the
    same notation used to specify the point P3.


    It is convenient to represent a vector the same way as a point, because we can
    use our matrix transforms on points or vectors interchangeably. However, it also
    can be confusing. For this reason we sometimes will notate a vector with a small
    arrow above it (such as V⃗). Many graphics systems do not distinguish between
    a point and a vector at all, such as in GLSL and GLM, which provide data types
    vec3/vec4 that can be used to hold either points or vectors. Some systems (such
    as the graphicslib3D library used in an earlier Java-based edition of this book)
    have separate point and vector classes, and enforce appropriate use of one or
    the other depending on the operation being done. It is an open debate as to whether
    it is clearer to use one data type for both, or separate data types.


    There are several vector operations that are used frequently in 3D graphics, for
    which there are functions available in GLM and GLSL. For example, assuming vectors
    A(u,v,w) and B(x,y,z):


    *Addition and Subtraction:*


    A ± B = (u ± x, v ± y, w ± z)

    `glm: vec3 ± vec3`

    `GLSL: vec3 ± vec3`


    *Normalize (change to length=1):*


    Â = A/|A| = A/sqrt(u²+v²+w²), where |A| ≡ length of vector A

    `glm: normalize(vec3) or normalize(vec4)`

    `GLSL: normalize(vec3) or normalize(vec4)`


    *Dot Product:*


    A • B = ux + vy + wz

    `glm: dot(vec3,vec3) or dot(vec4,vec4)`

    `GLSL: dot(vec3,vec3) or dot(vec4,vec4)`


    *Cross Product:*


    A x B = (vz-wy, wx-uz, uy-vx)

    `glm: cross(vec3,vec3)`

    `GLSL: cross(vec3,vec3)`'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Other useful vector functions are *magnitude* (which is available in both GLSL
    and GLM as length()), and *reflection* and *refraction* (both are available in
    GLSL and GLM).


    We shall now take a closer look at the functions *dot product* and *cross product*.


    # ### 3.5.1 Uses for Dot Product


    Throughout this book, our programs make heavy use of the dot product. The most
    important and fundamental use is for finding the *angle between two vectors*.
    Consider two vectors V⃗ and W⃗, and say we wish to find the angle θ separating
    them.


    ![](img/1695de1bc7486362f86c143285f3fb40_65_0.png)


    V⃗ · W⃗ = |V⃗| * |W⃗| * cos(θ)


    cos(θ) = (V⃗ · W⃗) / (|V⃗| * |W⃗|)


    Therefore, if V⃗ and W⃗ are normalized (i.e., of unit length—here we use the “^”
    notation for normalization, as shown earlier), then:


    cos(θ) = V̂ · Ŵ

    θ = arccos(V̂ · Ŵ)


    Interestingly, we will later see that often it is *cos(θ)* that we need, rather
    than θ itself. So, both of the previous derivations will be directly useful.


    The dot product also has a variety of other uses:


    +   - Finding a vector’s magnitude: √(V⃗ · V⃗)

    +   - Finding whether two vectors are perpendicular, if: V⃗ · W⃗ = 0

    +   - Finding whether two vectors are parallel, if: V⃗ · W⃗ = |V⃗| * |W⃗|

    +   - Finding whether two vectors are parallel but pointing in opposite directions,
    if: V⃗ · W⃗ = -|V⃗| * |W⃗|'
