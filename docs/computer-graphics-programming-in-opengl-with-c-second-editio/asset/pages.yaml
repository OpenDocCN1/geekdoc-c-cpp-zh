    \ to perspective matrix computation, starting with the interpolated colors version\
    \ of Program 4.1.\n\n# ### 4.7.3 Back-Face Culling\n\nAnother way of improving\
    \ rendering efficiency is to take advantage of OpenGL's ability to do *back-face\
    \ culling*. When a 3D model is entirely “closed,” meaning the interior is never\
    \ visible (such as for the cube and for the pyramid), then it turns out that those\
    \ portions of the outer surface that are angled away from the viewer will always\
    \ be obscured by some other portion of the same model. That is, those triangles\
    \ that face away from the viewer cannot possibly be seen (they would be overwritten\
    \ by hidden surface removal anyway), and thus there is no reason to rasterize\
    \ or render them.\n\nWe can ask OpenGL to identify and “cull” (not render) back-facing\
    \ triangles with the command `glEnable(GL_CULL_FACE)`. We can also disable face\
    \ culling with `glDisable(GL_CULL_FACE)`. By default, face culling is disabled,\
    \ so if you want OpenGL to cull back-facing triangles, you must enable it.\n\n\
    When face culling is enabled, by default triangles are rendered only if they are\
    \ *front-facing*. Also by default a triangle is considered front-facing if its\
    \ three vertices progress in a *counter-clockwise* direction (based on the order\
    \ that they were defined in the buffer) as viewed from the OpenGL camera. Triangles\
    \ whose"
