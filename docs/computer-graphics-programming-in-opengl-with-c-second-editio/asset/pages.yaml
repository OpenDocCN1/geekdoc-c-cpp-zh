  md: 'Next, display() enables the buffer containing the cube vertices and attaches
    it to 0th vertex attribute to prepare for sending the vertices to the shader.


    The last thing display() does is draw the model by calling glDrawArrays(), specifying
    that the model is composed of triangles and has 36 total vertices. The call to
    glDrawArrays() is typically preceded by additional commands that adjust rendering
    settings for this model.⁴ In this example there are two such commands, both of
    which are related to depth testing. Recall from Chapter 2 that depth testing is
    used by OpenGL to perform hidden surface removal. Here, we enable depth testing
    and specify the particular depth test we wish OpenGL to use. The settings shown
    here correspond to the description in Chapter 2; later in the book we will see
    other uses for these commands.


    Finally, consider the shaders. First, note that they both include the same block
    of uniform variable declarations. Although this is not always required, it is
    often a good practice to include the same block of uniform variable declarations
    in all of the shaders within a particular rendering program.


    Note also in the vertex shader the presence of the layout qualifier on the incoming
    vertex attribute position. Since the location is specified as “0”, the display()
    function can reference this variable simply by using 0 in the first parameter
    of the glVertexAttribPointer() function call and in the glEnableVertexAttribArray()
    function call. Note also that the position vertex attribute is declared as a vec3,
    and so it needs to be converted to a vec4 in order to be compatible with the 4x4
    matrices with which it will be multiplied. This conversion is done with vec4(position,1.0),
    which builds a vec4 out of the variable named “position”, putting a value of 1.0
    in the newly added 4th spot.


    The multiplication in the vertex shader applies the matrix transforms to the vertex,
    converting it to camera space (note the right-to-left concatenation order). Those
    values are put in the built-in OpenGL output variable gl_Position, and then proceed
    through the pipeline and are interpolated by the rasterizer.


    The interpolated pixel locations (referred to as fragments) are then sent to the
    fragment shader. Recall that the primary purpose of the fragment shader is to
    set the color of an outputted pixel. In a manner similar to the vertex shader,
    the fragment shader processes the pixels one by one, with a separate invocation
    for each pixel. In this case, it outputs a hardcoded value corresponding to red.
    For reasons


    ⁴ Often, these calls may be placed in init() rather than in display(). However,
    it is necessary to place one or more of them in display() when drawing multiple
    objects with different properties. For simplicity, we always place them in display().'
