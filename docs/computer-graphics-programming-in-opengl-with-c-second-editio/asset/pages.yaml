- pgno: 31
  md: "The mechanism by which these functions are deployed is as follows: the GLFW\
    \ and GLEW libraries are initialized using the commands glfwInit() and glewInit()\
    \ respectively. The GLFW window and an associated OpenGL context¹ are created\
    \ with the glfwCreateWindow() command, with options set by any preceding window\
    \ hints. Our window hints specify that the machine must be compatible with OpenGL\
    \ version 4.3 (\"major\"=4, and \"minor\"=3). The parameters on the glfwCreateWindow()\
    \ command specify the width and height of the window (in pixels) and the title\
    \ placed at the top of the window. (The additional two parameters which are set\
    \ to NULL, and which we aren't using, allow for full screen mode and resource\
    \ sharing.) Vertical synchronization (VSync) is enabled by using the glfwSwapInterval()\
    \ and glfwSwapBuffers() commands—GLFW windows are by default double-buffered.²\
    \ Note that creating the GLFW window doesn't automatically make the associated\
    \ OpenGL context current—for that reason we also call glfwMakeContextCurrent().\n\
    \n![](img/1695de1bc7486362f86c143285f3fb40_31_0.png)\n\nFigure 2.3  \nOutput of\
    \ Program 2.1.\n\nOur main() includes a very simple rendering loop that calls\
    \ our display() function repeatedly. It also calls glfwSwapBuffers(), which paints\
    \ the screen, and glfwPollEvents(), which handles other window-related events\
    \ (such as a key being pressed). The loop terminates when GLFW detects an event\
    \ that should close the window (such as the user clicking the \"X\" in the upper\
    \ right corner). Note that we have included a reference to the GLFW window object\
    \ on the init() and display() calls; those functions may in certain circumstances\
    \ need access to it. We have also included the current time on the call to display(),\
    \ which will be useful for ensuring that our animations run at the same speed\
    \ regardless of the computer being used. For this purpose, we use glfwGetTime(),\
    \ which returns the elapsed time since GLFW was initialized.\n\n1 The term “context”\
    \ refers to an OpenGL instance and its state information, which includes items\
    \ such as the color buffer.\n\n2 “Double buffering” means that there are two color\
    \ buffers—one that is displayed, and one that is being rendered to. After an entire\
    \ frame is rendered, the buffers are swapped. Double buffering is used to reduce\
    \ undesirable visual artifacts."
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Now is an appropriate time to take a closer look at the OpenGL calls in Program
    2.1. Consider this one:


    ```

    glClear(GL_COLOR_BUFFER_BIT);

    ```


    In this case, the OpenGL function being called, as described in the OpenGL reference
    documentation (available on the web at https://www.opengl.org/sdk/docs), is:


    ```

    void glClear(GLbitfield mask);

    ```


    The parameter references a “GLbitfield” called “GL_COLOR_BUFFER_BIT”. OpenGL has
    many predefined constants (some of them are called *enums*); this one references
    the *color buffer* that contains the pixels as they are rendered. OpenGL has several
    color buffers, and this command clears all of them—that is, it fills them with
    a predefined color called the “clear color.” Note that “clear” in this context
    doesn’t mean “a color that is clear”; rather, it refers to the color that is applied
    when a color buffer is reset (cleared).


    Immediately before the call to glClear() is a call to glClearColor(). This allows
    us to specify the value placed in the elements of a color buffer when it is cleared.
    Here we have specified (1,0,0,1), which corresponds to the RGBA color *red*.


    Finally, our render loop exits when the user attempts to close the GLFW window.
    At that time, our main() asks GLFW to destroy the window and terminate, via calls
    to glfwDestroyWindow() and glfwTerminate() respectively.


    # 2.1.2 Vertex and Fragment Shaders


    Our first OpenGL program didn’t actually draw anything—it simply filled the color
    buffer with a single color. To actually draw something, we need to include a *vertex
    shader* and a *fragment shader*.


    You may be surprised to learn that OpenGL is capable of drawing only a few kinds
    of very simple things, such as *points, lines,* or *triangles*. These simple things
    are called *primitives*, and for this reason, most 3D models are made up of lots
    and lots of primitives, usually triangles.


    Primitives are made up of *vertices*—for example, a triangle consists of three
    vertices. The vertices can come from a variety of sources—they can be read from
    files and then loaded into buffers by the C++/OpenGL application, or they can
    be hardcoded in the C++ code or even in the GLSL code.'
  merge: -1
  img_proc: true
