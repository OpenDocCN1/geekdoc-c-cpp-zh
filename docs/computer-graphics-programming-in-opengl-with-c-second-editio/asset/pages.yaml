  md: "# 4.11.2 Pre-Computing the Perspective Matrix\n\nAnother optimization that\
    \ can be done to reduce overhead in the display() function is to move the computation\
    \ of the perspective matrix into the init() function. We mentioned this possibility\
    \ earlier in Section 4.5 (well, in a footnote). While this is certainly easy to\
    \ do, there is one slight complication. Although it is not normally necessary\
    \ to recompute the perspective matrix, it would be necessary if the user running\
    \ the application resizes the window (such as by dragging the window corner resize\
    \ handle).\n\nFortunately, GLFW can be configured to automatically make a callback\
    \ to a specified function whenever the window is resized. We add the following\
    \ to the main(), just before the call to init():\n\n```\n```cpp\nglfwSetWindowSizeCallback(window,\
    \ window_reshape_callback);\n```\n```\n\nThe first parameter is the GLFW window,\
    \ and the second is the name of a function that GLFW calls whenever the window\
    \ is resized. We then move the code that computes the perspective matrix into\
    \ init(), and also copy it into a new function called window_reshape_callback().\n\
    \nConsider for example Program 4.1. If we reorganize the code so as to remove\
    \ the computation of the perspective matrix from display(), then the revised versions\
    \ of the main(), init(), display(), and the new function window_reshape_callback()\
    \ would be as follows:\n\n```\n```cpp\nvoid init(GLFWwindow* window) {\n    ...\n\
    \    // same as earlier, plus the following three lines:\n    glfwGetFramebufferSize(window,\
    \ &width, &height);\n    aspect = (float)width / (float)height;\n    pMat = glm::perspective(1.0472f,\
    \ aspect, 0.1f, 1000.0f);    // 1.0472 radians = 60 degrees\n}\n\nvoid display(GLFWwindow*\
    \ window, double currentTime) {\n    ...\n    // same as earlier, except with\
    \ the following lines removed:\n    // build perspective matrix\n    glfwGetFramebufferSize(window,\
    \ &width, &height);\n    aspect = (float)width / (float)height;\n    pMat = glm::perspective(1.0472f,\
    \ aspect, 0.1f, 1000.0f);\n    // the rest of the function is unchanged\n    ...\n\
    }\n```\n```"
