  md: "# ### Vertex shader\n\n```\n```glsl\n#version 430\nlayout(location=0) in vec3\
    \ pos;\nlayout(location=1) in vec2 texCoord;\nout vec2 tc;          // texture\
    \ coordinate output to rasterizer for interpolation\nuniform mat4 mv_matrix;\n\
    uniform mat4 proj_matrix;\nlayout(binding=0) uniform sampler2D samp;    // not\
    \ used in vertex shader\n\nvoid main(void)\n{ gl_Position = proj_matrix * mv_matrix\
    \ * vec4(pos,1.0);\n  tc = texCoord;\n}\n```\n```\n\n# ### Fragment shader\n\n\
    ```\n```glsl\n#version 430\nin vec2 tc;          // interpolated incoming texture\
    \ coordinate\nout vec4 color;\nuniform mat4 mv_matrix;\nuniform mat4 proj_matrix;\n\
    layout(binding=0) uniform sampler2D samp;\n\nvoid main(void)\n{ color = texture(samp,\
    \ tc);\n}\n```\n```\n\n# ## 5.8 MIPMAPPING\n\nTexture mapping commonly produces\
    \ a variety of undesirable artifacts in the rendered image. This is because the\
    \ resolution or aspect ratio of the texture image rarely matches that of the region\
    \ in the scene being textured.\n\nA very common artifact occurs when the image\
    \ resolution is *less than* that of the region being drawn. In this case, the\
    \ image would need to be stretched to cover the region, becoming blurry (and possibly\
    \ distorted). This can sometimes be combated, depending on the nature of the texture,\
    \ by assigning the texture coordinates differently so that applying the texture\
    \ requires less stretching. Another solution is to use a higher resolution texture\
    \ image.\n\nThe reverse situation is when the resolution of the image texture\
    \ is *greater than* that of the region being drawn. It is probably not at all\
    \ obvious why this would pose a problem, but it does! In this case, noticeable\
    \ *aliasing* artifacts can"
  merge: -1
  img_proc: true
- pgno: 135
  md: 'occur, giving rise to strange-looking false patterns, or “shimmering” effects
    in moving objects.


    Aliasing is caused by *sampling errors*. It is most often associated with signal
    processing, where an inadequately sampled signal appears to have different properties
    (such as wavelength) than it actually does when it is reconstructed. An example
    is shown in Figure 5.6. The original waveform is shown in red. The yellow dots
    along the waveform represent the samples. If they are used to reconstruct the
    wave, and if there aren''t enough of them, they can define a different wave (shown
    in blue).


    ![](img/1695de1bc7486362f86c143285f3fb40_135_0.png)


    **Figure 5.6**

    Alias due to inadequate sampling.


    Similarly, in texture-mapping, when a high-resolution (and highly detailed) image
    is sparsely sampled (such as when using a uniform sampler variable), the colors
    retrieved will be inadequate to reflect the actual detail in the image, and may
    instead seem random. If the texture image has a repeated pattern, aliasing can
    result in a *different* pattern being produced than the one in the original image.
    If the object being textured is moving, rounding errors in texel lookup can result
    in constant changes in the sampled pixel at a given texture coordinate, producing
    an unwanted sparkling effect across the surface of the object being drawn.


    Figure 5.7 shows a tilted, close-up rendering of the top of a cube which has been
    textured by a large, high-resolution image of a checkerboard.


    ![](img/1695de1bc7486362f86c143285f3fb40_135_1.png)


    **Figure 5.7**

    Aliasing in a texture map.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/1695de1bc7486362f86c143285f3fb40_136_0.png)


    Aliasing is evident near the top of the image, where the under-sampling of the
    checkerboard has produced a “striped” effect. Although we can''t show it here
    in a still image, if this were an animated scene, the patterns would likely undulate
    between various incorrect patterns such as this one.


    **Figure 5.8**

    ''Sparkling'' in a texture map.


    Another example appears in Figure 5.8, in which the cube has been textured with
    an image of the surface of the moon [HT12].


    At first glance, this image appears sharp and full of detail. However, some of
    the detail at the upper right of the image is false and causes “sparkling” as
    the cube object (or the camera) moves. (Unfortunately, we can''t show the sparkling
    effect clearly in a still image.)


    These and similar sampling error artifacts can be largely corrected by a technique
    called *mipmapping*, in which different versions of the texture image are created
    at various resolutions. OpenGL then uses the texture image that most closely matches
    the resolution at the point being textured. Even better, colors can be averaged
    between the images closest in resolution to that of the region being textured.
    Results of applying mipmapping to the images in Figure 5.7 and Figure 5.8 are
    shown in Figure 5.9.


    ![](img/1695de1bc7486362f86c143285f3fb40_136_1.png)


    **Figure 5.9**

    Mipmapped results.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "Mipmapping works by a clever mechanism for storing a series of successively\
    \ lower-resolution copies of the same image in a texture image one-third larger\
    \ than the original image. This is achieved by storing the R, G, and B components\
    \ of the image separately in three-quarters of the texture image space, then repeating\
    \ the process in the remaining one-quarter of the image space for the same image\
    \ at one-quarter the original resolution. This subdividing repeats until the remaining\
    \ quadrant is too small to contain any useful image data. An example image and\
    \ a visualization of the resulting mipmap is shown in Figure 5.10.\n\n![](img/1695de1bc7486362f86c143285f3fb40_137_0.png)\n\
    \n**Figure 5.10**  \nMipmapping an image.\n\nThis method of stuffing several images\
    \ into a small space (well, just a bit bigger than the space needed to store the\
    \ original image) is how mipmapping got its name. MIP stands for *Multum In Parvo*\
    \ [Wl83], which is Latin for “much in a small space.”\n\nWhen actually texturing\
    \ an object, the mipmap can be sampled in several ways. In OpenGL, the manner\
    \ in which the mipmap is sampled can be chosen by setting the GL_TEXTURE_MIN_FILTER\
    \ parameter to the desired *minification* technique, which is one of the following:\n\
    \n+   - **GL_NEAREST_MIPMAP_NEAREST** chooses the mipmap with the resolution most\
    \ similar to that of the region of pixels being textured. It then obtains the\
    \ nearest texel to the desired texture coordinates."
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   - **GL_LINEAR_MIPMAP_NEAREST** chooses the mipmap with the resolution most
    similar to that of the region of pixels being textured. It then interpolates the
    four texels nearest to the texture coordinates. This is called “linear filtering.”

    +   - **GL_NEAREST_MIPMAP_LINEAR** chooses the two mipmaps with resolutions nearest
    to that of the region of pixels being textured. It then obtains the nearest texel
    to the texture coordinates from each mipmap and interpolates them. This is called
    “bilinear filtering.”

    +   - **GL_LINEAR_MIPMAP_LINEAR** chooses the two mipmaps with resolutions nearest
    to that of the region of pixels being textured. It then interpolates the four
    nearest texels in each mipmap and interpolates those two results. This is called
    “trilinear filtering” and is illustrated in Figure 5.11.


    ![](img/1695de1bc7486362f86c143285f3fb40_138_0.png)


    ![](img/1695de1bc7486362f86c143285f3fb40_138_1.png)


    Trilinear filtering is usually preferable, as lower levels of blending often produce
    artifacts, such as visible separations between mipmap levels. Figure 5.12 shows
    a close-up of the checkerboard using mipmapping with only linear filtering enabled.
    Note the circled artifacts where the vertical lines suddenly change from thick
    to thin at a mipmap boundary. By contrast, the example in Figure 5.9 used trilinear
    filtering.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Mipmapping is richly supported in OpenGL. There are mechanisms provided for
    building your own mipmap levels or having OpenGL build them for you. In most cases,
    the mipmaps built automatically by OpenGL are sufficient. This is done by adding
    the following lines of code to the Utils::loadTexture() function (described earlier
    in Section 5.1), immediately after the getTextureObject() function call:


    ```

    glBindTexture(GL_TEXTURE_2D, textureID);\nglTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER,
    GL_LINEAR_MIPMAP_LINEAR);\nglGenerateMipmap(GL_TEXTURE_2D);

    ```


    This tells OpenGL to generate the mipmaps. The brick texture is made active with
    the glBindTexture() call, and then the glTexParameteri() function call enables
    one of the minification factors listed previously, such as GL_LINEAR_MIPMAP_LINEAR
    shown in the above call, which enables trilinear filtering.


    Once the mipmap is built, the filtering option can be changed (although this is
    rarely necessary) by calling glTexParameteri() again, such as in the display function.
    Mipmapping can even be disabled by selecting GL_NEAREST or GL_LINEAR.


    For critical applications, it is possible to build the mipmaps yourself, using
    whatever is your preferred image editing software. They can then be added as mipmap
    levels when creating the texture object by repeatedly calling OpenGL’s glTexImage2D()
    function for each mipmap level. Further discussion of this approach is outside
    the scope of this book.


    # 5.9 ANISOTROPIC FILTERING


    Mipmapped textures can sometimes appear more blurry than non-mipmapped textures,
    especially when the textured object is rendered at a heavily tilted viewing angle.
    We saw an example of this back in Figure 5.9, where reducing artifacts with mipmapping
    led to reduced detail (compared with Figure 5.8).


    This loss of detail occurs because when an object is tilted, its primitives appear
    smaller along one axis (i.e., width vs. height) than along the other. When OpenGL
    textures a primitive, it selects the mipmap appropriate for the smaller of the
    two axes (to avoid “sparkling” artifacts). In Figure 5.9, the surface is tilted
    heavily away from the viewer, so each rendered primitive will utilize the mipmap
    appropriate for its reduced height, which is likely to have a resolution lower
    than appropriate for its width.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "One way of restoring some of this lost detail is to use *anisotropic filtering*\
    \ (AF). Whereas standard mipmapping samples a texture image at a variety of square\
    \ resolutions (e.g., 256x256, 128x128, etc.), AF samples the textures at a number\
    \ of rectangular resolutions as well, such as 256x128, 64x128, and so on. This\
    \ enables viewing at various angles while retaining as much detail in the texture\
    \ as possible.\n\nAnisotropic filtering is more computationally expensive than\
    \ standard mipmapping and is not a required part of OpenGL. However, most graphics\
    \ cards support AF (this is referred to as an *OpenGL extension*), and OpenGL\
    \ does provide both a way of querying the card to see if it supports AF, and a\
    \ way of accessing AF if it does. The code is added immediately after generating\
    \ the mipmap:\n\n```\n```cpp\n// if mipmapping\nglBindTexture(GL_TEXTURE_2D, textureID);\n\
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);\n\
    glGenerateMipmap(GL_TEXTURE_2D);\n\n// if also anisotropic filtering\nif (glewIsSupported(\"\
    GL_EXT_texture_filter_anisotropic\")) {\n    GLfloat anisoSetting = 0.0f;\n  \
    \  glGetFloatv(GL_MAX_TEXTURE_MAX_ANISOTROPY_EXT, &anisoSetting);\n    glTexParameterf(GL_TEXTURE_2D,\
    \ GL_TEXTURE_MAX_ANISOTROPY_EXT, anisoSetting);\n}\n```\n```\n\n![](img/1695de1bc7486362f86c143285f3fb40_140_0.png)\n\
    \nFigure 5.13\nAnisotropic filtering.\n\nThe call to glewIsSupported() tests whether\
    \ the graphics card supports AF. If it does, we set it to the maximum degree of\
    \ sampling supported, a value retrieved using glGetFloatv() as shown. It is then\
    \ applied to the active texture object using glTexParameterf(). The result is\
    \ shown in Figure 5.13. Note that much of the lost detail from Figure 5.8 has\
    \ been restored, while still removing the sparkling artifacts.\n\n# ### 5.10 WRAPPING\
    \ AND TILING\n\nSo far we have assumed that texture coordinates all fall in the\
    \ range [0..1]. However, OpenGL actually supports texture coordinates of any value.\
    \ There are"
  merge: -1
  img_proc: true
- pgno: 141
  md: "several options for specifying what happens when texture coordinates fall outside\
    \ the range [0..1]. The desired behavior is set using glTexParameteri(), and some\
    \ of the options are as follows:\n\n+   - **GL_REPEAT**: The integer portion of\
    \ the texture coordinates are ignored, generating a repeating or “tiling” pattern.\
    \ This is the default behavior.\n+   - **GL_MIRRORED_REPEAT**: The integer portion\
    \ is ignored, except that the coordinates are reversed when the integer portion\
    \ is odd, so the repeating pattern alternates between normal and mirrored.\n+\
    \   - **GL_CLAMP_TO_EDGE**: Coordinates less than 0 and greater than 1 are set\
    \ to 0 and 1 respectively.\n+   - **GL_CLAMP_TO_BORDER**: Texels outside of [0..1]\
    \ will be assigned some specified border color.\n\nFor example, consider a pyramid\
    \ in which the texture coordinates have been defined in the range [0..5] rather\
    \ than the range [0..1]. The default behavior (GL_REPEAT), using the texture image\
    \ shown previously in Figure 5.2, would result in the texture repeating five times\
    \ across the surface (sometimes called “tiling”), as shown in Figure 5.14:\n\n\
    ![](img/1695de1bc7486362f86c143285f3fb40_141_0.png)\n\n**Figure 5.14**\nTexture\
    \ coordinate wrapping with GL_REPEAT.\n\nTo make the tiles’ appearance alternate\
    \ between normal and mirrored, we can specify the following:\n\n```\n    glTexParameteri(GL_TEXTURE_2D,\
    \ GL_TEXTURE_WRAP_S, GL_MIRRORED_REPEAT);\n    glTexParameteri(GL_TEXTURE_2D,\
    \ GL_TEXTURE_WRAP_T, GL_MIRRORED_REPEAT);\n```\n\nSpecifying that values less\
    \ than 0 and greater than 1 respectively can be done by replacing GL_MIRRORED_REPEAT\
    \ with GL_CLAMP_TO_EDGE."
  merge: -1
  img_proc: true
