    out vec2 tes_out;\nvoid main(void)\n{  // map the texture coordinates onto the\
    \ sub-grid specified by the incoming control points\n   vec2 tc = vec2(tes_out[0].x\
    \ + (gl_TessCoord.x) / 64.0, tes_out[0].y + (1.0 - gl_TessCoord.y) / 64.0);\n\n\
    \   // map the tessellated grid onto the sub-grid specified by the incoming control\
    \ points\n   vec4 tessellatedPoint = vec4(gl_in[0].gl_Position.x + gl_TessCoord.x\
    \ / 64.0, 0.0,\n                                gl_in[0].gl_Position.z + gl_TessCoord.y\
    \ / 64.0, 1.0);\n\n   // add the height from the height map to the vertex:\n \
    \  tessellatedPoint.y += (texture(tex_height, tc).r) / 40.0;\n   gl_Position =\
    \ mvp_matrix * tessellatedPoint;\n   tes_out = tc;\n}\n~~~\n```\n\nNow that we\
    \ have achieved height mapping, we can work on improving it and incorporating\
    \ lighting. One challenge is that our vertices do not yet have normal vectors\
    \ associated with them. Another challenge is that simply using the texture image\
    \ as a height map has produced an overly “jagged” result—in this case because\
    \ not all grayscale variation in the texture image is due to height. For this\
    \ particular texture map, it so happens that Hastings-Trew has already produced\
    \ an improved height map that we can use [HT12]. It is shown in Figure 12.8 (on\
    \ the left).\n\nTo create normals, we could compute them on the fly by generating\
    \ the heights of neighboring vertices (or neighboring texels in the height map),\
    \ building vectors connecting them, and using a cross product to find the normal.\
    \ This requires some tuning, depending on the precision of the scene (and/or the\
    \ height map image). Here we have instead used the GIMP “normalmap” plugin [GP16]\
    \ to generate a normal map based on Hastings-Trew’s height map, shown in Figure\
    \ 12.8 (on the right).\n\n![](img/1695de1bc7486362f86c143285f3fb40_309_0.png)\n\
