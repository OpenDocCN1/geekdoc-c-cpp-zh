    \ grid vertices from [0..1] onto the desired vertices [-0.5,+0.5]\n   vec4 tessellatedPoint\
    \ = vec4(gl_TessCoord.x - 0.5, 0.0, gl_TessCoord.y - 0.5, 1.0);\n   // map the\
