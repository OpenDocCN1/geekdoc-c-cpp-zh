- pgno: 186
  md: "This makes it very easy to specify that an object has, say, a “gold” material,\
    \ in either the init() function or in the top level declarations, as follows:\n\
    \n```\n    float* matAmbient = Utils::goldAmbient();\n    float* matDiffuse =\
    \ Utils::goldDiffuse();\n    float* matSpecular = Utils::goldSpecular();\n   \
    \ float matShininess = Utils::goldShininess();\n```\n\n*Note that our code for\
    \ light and material properties described so far in these sections does not actually\
    \ perform lighting. It merely provides a way to specify and store desired light\
    \ and material properties for elements in a scene. We still need to actually compute\
    \ the lighting ourselves. This is going to require some serious mathematical processing\
    \ in our shader code. So let’s now dive into the nuts and bolts of implementing\
    \ ADS lighting in our C++/OpenGL and GLSL graphics programs.*\n\n# ## 5.4 ADS\
    \ LIGHTING COMPUTATIONS\n\nAs we draw our scene, recall that each vertex is transformed\
    \ so as to simulate a 3D world on a 2D screen. Pixel colors are the result of\
    \ rasterization as well as texturing and interpolation. We must now incorporate\
    \ the additional step of adjusting those rasterized pixel colors to effect the\
    \ lighting and materials in our scene. The basic ADS computation that we need\
    \ to perform is to determine the reflection intensity (I) for each pixel. This\
    \ computation takes the following form:\n\n$$I_{observed} = I_{ambient} + I_{diffuse}\
    \ + I_{specular}$$\n\nThat is, we need to compute and sum the ambient, diffuse,\
    \ and specular reflection contributions for each pixel, for each light source.\
    \ This will of course depend on the type of light(s) in our scene and the type\
    \ of material associated with the rendered model.\n\n*Ambient* contribution is\
    \ the simplest. It is the product of the specified ambient light and the specified\
    \ ambient coefficient of the material:\n\n$$I_{ambient} = Light_{ambient} * Material_{ambient}$$"
