    \ GLSL Errors\n\n```\nvoid printShaderLog(GLuint shader) {\n    int len = 0;\n\
    \    int chWritten = 0;\n    char *log;\n    glGetShaderiv(shader, GL_INFO_LOG_LENGTH,\
    \ &len);\n    if (len > 0) {\n        log = (char *)malloc(len);\n        glGetShaderInfoLog(shader,\
