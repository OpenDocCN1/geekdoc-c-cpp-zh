  md: 'In this example, for purposes of illustration, we deliberately specified texture
    coordinates that result in an oddly painted surface. If you look closely, you
    can also see that the image appears slightly stretched—that is because the aspect
    ratio of the texture image doesn''t match the aspect ratio of the cube face relative
    to the given texture coordinates.


    For simple models like cubes or pyramids, selecting texture coordinates is relatively
    easy. But for more complex curved models with lots of triangles, it isn’t practical
    to determine them by hand. In the case of curved geometric shapes, such as a sphere
    or torus, texture coordinates can be computed algorithmically or mathematically.
    In the case of a model built with a modeling tool such as Maya [MA20] or Blender
    [BL20], such tools offer “UV-mapping” (outside of the scope of this book) to make
    this task easier.


    Let us return to rendering our pyramid, only this time texturing it with an image
    of bricks. We will need to specify: (a) the integer ID referencing the texture
    image, (b) texture coordinates for the model vertices, (c) a buffer for holding
    the texture coordinates, (d) vertex attributes so that the vertex shader can receive
    and forward the texture coordinates through the pipeline, (e) a texture unit on
    the graphics card for holding the texture object, and (f) a uniform sampler variable
    for accessing the texture unit in GLSL, which we will see shortly. These are each
    described in the next sections.


