- pgno: 344
  md: '+   4. deciding on appropriate 3D texture coordinates for the object vertices

    +   5. texturing the object in the fragment shader using an appropriate sampler


    Texture coordinates for 3D textures range from 0 to 1, in the same manner as for
    2D textures.


    Interestingly, step #4 (determining 3D texture coordinates) is usually a lot simpler
    than one might initially suspect. In fact, it is usually simpler than for 2D textures!
    This is because (in the case of 2D textures) since a 3D object was being textured
    with a 2D image, we needed to decide how to “flatten” the 3D object’s vertices
    (such as by UV-mapping) to create texture coordinates. But when 3D texturing,
    both the object and the texture are of the same dimensionality (three). In most
    cases, we want the object to reflect the texture pattern, as if it were “carved”
    out of it (or dipped into it). So the vertex locations themselves serve as the
    texture coordinates! Usually all that is necessary is to apply some simple scaling
    to ensure that the object’s vertices’ location coordinates map to the 3D texture
    coordinates’ range [0..1].


    Since we are generating the 3D texture procedurally, we need a way of constructing
    an OpenGL texture map out of generated data. The process for loading data into
    a texture is similar to what we saw earlier in Section 5.12. In this case, we
    fill a 3D array with color values, then copy them into a texture object.


    Program 14.4 shows the various components for achieving all of the previous steps
    in order to texture an object with blue and yellow horizontal stripes from a procedurally
    built 3D texture. The desired pattern is built in the generate3Dpattern() function,
    which stores the pattern in an array named “tex3Dpattern”. The “image” data is
    then built in the function fillDataArray(), which fills a 3D array with byte data
    corresponding to the RGB colors R, G, B, and A, each in the range [0..255], according
    to the pattern. Those values are then copied into a texture object in the load3DTexture()
    function.


    # Program 14.4 3D Texturing: Striped Pattern


    C++ / OpenGL application:


    ```

    ```c++

    ...

    const int texWidth = 200;

    const int texHeight= 200;

    const int texDepth = 200;

    double tex3Dpattern[texWidth][texHeight][texDepth];

    ...

    ```

    ```'
