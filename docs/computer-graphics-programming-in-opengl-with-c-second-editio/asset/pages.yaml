    \ null_ray, null_collision };\n\nconst int stack_size = 100;\nStack_Element stack[stack_size];\
    \        // holds the \"recursive\" stack of raytrace invocations\nconst int max_depth\
    \ = 6;                // max sequence of rays, which equals max recursion depth\n\
