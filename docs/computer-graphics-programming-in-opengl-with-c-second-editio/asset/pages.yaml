  md: '![](img/1695de1bc7486362f86c143285f3fb40_280_0.png)


    **Figure 11.2**

    Points at parametric position $t = 0.75$.


    By introducing a parameter $t$, we can build a system of parametric equations
    that define a curve. The $t$ represents a fraction of the distance along the line
    segment connecting one control point to the next control point. Values for $t$
    are within the range [0,1] for points along the segment. Figure 11.2 shows one
    such value, $t = 0.75$, applied to the lines connecting $p_0$-$p_1$ and $p_1$-$p_2$
    respectively. Doing this defines two new points $p_{01}(t)$ and $p_{12}(t)$ along
    the two original lines. We repeat this process for the line segment connecting
    the two new points $p_{01}(t)$ and $p_{12}(t)$, producing point $P(t)$ where $t
    = 0.75$ along the line $p_{01}(t)$-$p_{12}(t)$. $P(t)$ is one of the points on
    the resulting curve, and for this reason it is denoted with a capital $P$.


    ![](img/1695de1bc7486362f86c143285f3fb40_280_1.png)


    **Figure 11.3**

    Building a quadratic Bézier curve.


    Collecting many points $P(t)$ for various values of $t$ generates a curve, as
    shown in Figure 11.3. The more parameter values for $t$ that are sampled, the
    more points $P(t)$ are generated, and the smoother the resulting curve.


    The analytic definition for a quadratic Bézier curve can now be derived. First,
    we note that an arbitrary point $p$ on the line segment $p_a p_b$ connecting two
    points $p_a$ and $p_b$ can be represented in terms of the parameter $t$ as follows:


    $$P_{ab}(t)=t p_b+(1-t)p_a$$


    Using this, we find the points $p_{01}$ and $p_{12}$ (points on $p_0$-$p_1$ and
    $p_1$-$p_2$ respectively) as follows:


    $$p_{01}(t)=t p_1+(1-t)p_0$$

    $$p_{12}(t)=t p_2+(1-t)p_1$$


    Similarly, a point on the connecting line segment between these points would be:


    $$P(t)=t p_{12}(t)+(1-t)p_{01}(t)$$'
