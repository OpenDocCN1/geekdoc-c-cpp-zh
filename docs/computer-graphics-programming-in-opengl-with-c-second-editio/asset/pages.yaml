  md: '+   7. Copy the **SOIL2** folder that contains the .h files into **/usr/local/include**.

    +   8. Place the **“libsoil2-debug.a”** file wherever you would like it to be
    permanently located.


    # B.1.2 Preparing the Development Environment


    As of this writing, the Mac version of Visual Studio 2019 (the development environment
    used in the instructions for running the book’s programs on a Windows platform)
    doesn’t support C++. A related product is available called *Visual Studio Code*
    that does include C++, but we had better luck using a more widely used IDE for
    the Mac called *Xcode*. If your Mac doesn’t already include Xcode, installing
    it is a common and straightforward (albeit rather slow) operation [XC20]. You
    may be required to update your operating system in order to install the latest
    version of Xcode.


    After installing Xcode, you’ll need to configure it to work with OpenGL and with
    the libraries we are using. Here are the steps we used to successfully set up
    Xcode for our C++/OpenGL applications:


    +   1. Run Xcode, and have it create a project of type “*macOS command line tool*”.
    Set the language to C++.

    +   2. A default **main.cpp** is created that contains a simple “hello world”
    program. In the Xcode editor, overwrite that code with the desired main.cpp code
    from one of our C++/OpenGL applications.

    +   3. Set up the *header search path* as follows:

    +      a. Click on the project name (at the top of the leftmost panel).

    +      b. Choose the **“Build Settings”** tab at the top center of the main panel.

    +      c. Scroll down to the **“Search Paths”** section.

    +      d. Under **“Header Search Paths”**, add the following path: /usr/local/include

    +   4. Add the path to the folder containing your “libsoil2-debug.a” file to the
    *library search path*. This is also under “Build Settings”, near the header search
    path section used in the previous step. You may need to add this to both the “release”
    and “debug” categories.

    +   5. Set up the binaries for the *linking phase* as follows:

    +      a. Click on the project name (at the top of the leftmost panel, in blue),
    if necessary.

    +      b. Choose the **“Build Phases”** tab at the top center of the main panel.

    +      c. Click the little triangle next to “*Link Binary with Libraries*” to
    open that section.'
