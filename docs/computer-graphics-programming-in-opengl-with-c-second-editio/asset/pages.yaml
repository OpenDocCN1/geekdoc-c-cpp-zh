- pgno: 454
  md: "The general solution to this problem is to *recursively* call raytrace(), with\
    \ the condition that terminates the recursion (the so-called “base case”) being\
    \ whenever a ray encounters a non-reflective or non-transparent surface (or whenever\
    \ a pre-determined maximum depth has been reached) or if the ray collides with\
    \ no object. Unfortunately, GLSL does not support recursion. So, to achieve any\
    \ reasonable simulation of the above effects, we need to keep track of the recursion\
    \ ourselves.\n\nBuilding a recursive version of raytrace() in the absence of native\
    \ support for recursion is not trivial. Our solution requires a *stack*, defining\
    \ a structure for items to be pushed onto the stack, building the appropriate\
    \ *push* and *pop* operations, a *driver* that contains the main loop for processing\
    \ the rays (using stack operations), and a function to *process* a stack element\
    \ (which contains the information for an individual ray).\n\nProgram 16.12 shows\
    \ these as additions (and replacements) to elements of the previous Program 16.11.\
    \ There is a struct called Stack_Element that defines the items stored in the\
    \ stack and functions for raytrace() (which is the driver), push(), pop(), and\
    \ process_stack_element(). The stack itself is stored as an array of Stack_Elements.\
    \ After presenting the code, more detailed explanations follow.\n\n# Program 16.12\
    \ – Recursive Ray Generation\n\nCompute Shader\n\n```\n```text\n...\nstruct Stack_Element\n\
    {\n    int type;       // type of ray (1 = reflected, 2 = refracted. Shadow rays\
    \ are never pushed on stack)\n    int depth;      // depth of the recursive raytrace\n\
    \    int phase;      // which of the five phases of a recursive call is currently\
    \ being processed\n    vec3 phong_color;      // holds the computed ADS color\n\
    \    vec3 reflected_color;  // holds the reflected color\n    vec3 refracted_color;\
    \  // holds the refracted color\n    vec3 final_color;      // final mixture of\
    \ all colors (plus texture) for this invocation\n    Ray ray;               //\
    \ the ray for this raytrace invocation\n    Collision collision;   // the collision\
    \ for this raytrace invocation. Starts with null_collision value.\n};\nconst int\
    \ RAY_TYPE_REFLECTION = 1;\nconst int RAY_TYPE_REFRACTION = 2;\n\n// \"NULL\"\
    \ values for structs are defined to make it easier to tell when a value hasn't\
    \ been assigned\nRay null_ray = {vec3(0.0), vec3(0.0)};\nCollision null_collision\
    \ = {-1.0, vec3(0.0), vec3(0.0), false, -1, vec2(0.0, 0.0), -1};\n```\n```"
