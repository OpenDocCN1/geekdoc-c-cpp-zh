    # Acknowledgments


    A lot of the content in this book is built from our first book *Computer Graphics
    Programming in OpenGL with Java*, which we drafted in 2016 for the CSc-155 (Advanced
    Computer Graphics Programming) course at CSU Sacramento. Many CSc-155 students
    actively contributed suggestions and bug fixes to an early draft during that year,
    including Mitchell Brannan, Tiffany Chiapuzio-Wong, Samson Chua, Anthony Doan,
    Kian Faroughi, Cody Jackson, John Johnston, Zeeshan Khaligh, Raymond Rivera, Oscar
    Solorzano, Darren Takemoto, Jon Tinney, James Womack, and Victor Zepeda. The following
    year our colleague Dr. Pinar Muyan-Ozcelik used the first edition of the Java
    book while teaching CSc-155 for her first time, and kept a running log of questions
    and corrections for each chapter, which led to many improvements both for the
    second edition of the Java book, and the first edition of the C++ book.


    In Spring 2020 we tested our idea of allowing students (in our CSc-155 course)
    to select either C++ or Java, using the respective edition of this textbook. It
    was a sort of acid test of our “sister” textbook idea, and we were pleased with
    how things went. Again, students caught typos – Paul McHugh in particular caught
    and fixed an important memory leak in our 3D texture code.


