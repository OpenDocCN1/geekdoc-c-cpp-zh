    # ### 10.2.7 Adding Shadows


    Ray casting provides a remarkably elegant method for detecting whether something
    is in shadow by leveraging some of the functions we have already written. We do
    this by defining a “shadow feeler ray” starting at the collision point being rendered,
    towards the position of the light. We then use our already-developed `get_closest_collision()`
    function to determine the closest collider for that ray. If it is closer than
    the positional light, then there must be an object in between the light and the
    collision point, and the point must be in shadow.


