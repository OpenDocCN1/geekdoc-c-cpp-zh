  md: '![](img/1695de1bc7486362f86c143285f3fb40_310_0.png)


    Most of the changes to our code are now simply to implement the standard methods
    for Phong shading:


    +   - *C++/OpenGL application*

    +     We load and activate an additional texture to hold the normal map. We also
    add code to specify the lighting and materials as we have done in previous applications.

    +   - *Vertex shader*

    +     The only additions are declarations for lighting uniforms and the sampler
    for the normal map. Lighting code customarily done in the vertex shader is moved
    to the tessellation evaluation shader, because the vertices aren''t generated
    until the tessellation stage.

    +   - *Tessellation Control shader*

    +     The only additions are declarations for lighting uniforms and the sampler
    for the normal map.

    +   - *Tessellation Evaluation shader*

    +     The preparatory code for Phong lighting is now placed in the evaluation
    shader:

    +     ```cpp

    +     varyingVertPos = (mv_matrix * position).xyz;

    +     varyingLightDir = light.position - varyingVertPos;

    +     ```

    +   - *Fragment shader*

    +     The typical code sections, described previously, for computing Phong (or
    Blinn-Phong) lighting are done here, as well as the code to extract normals from
    the normal map. The lighting result is then combined with the texture image with
    a weighted sum.'
