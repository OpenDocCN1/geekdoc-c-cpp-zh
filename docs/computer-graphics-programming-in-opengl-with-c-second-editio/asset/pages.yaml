    # ### 14.7 NOISE APPLICATION – WOOD


    Creating a “wood” texture can be done in a similar way as was done in the previous
    “marble” example. Trees grow in rings, and it is these rings that produce the
    grain we see in objects made of wood. As trees grow, environmental stresses create
    variations in the rings, which we also see in the grain.'
