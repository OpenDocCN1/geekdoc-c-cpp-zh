    # 16.1.2 Parallel Computing in Compute Shaders


    Recall that the exact number of times that a *vertex* shader runs (is “invoked”)
    is typically once per vertex, and is stated explicitly by the programmer as a
    parameter in the glDrawArrays() command. Similarly, the number of times that a
    compute shader is invoked is specified explicitly in the parameters to the glDispatch()
    command.


    Let’s look at an example of a compute shader to perform a simple parallel computing
    task. In Program 16.1, we present an application that *sums the corresponding
