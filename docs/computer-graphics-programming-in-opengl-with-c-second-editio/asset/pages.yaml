- pgno: 84
  md: 'The manner in which we load the vertices of a model into a buffer (VBO) depends
    on where the model’s vertex values are stored. In Chapter 6, we will see how models
    are commonly built in a modeling tool (such as Blender [BL20] or Maya [MA16]),
    exported to a standard file format (such as .obj—also described in Chapter 6),
    and imported into the C++/OpenGL application. We will also see how a model’s vertices
    can be calculated on the fly or generated inside the pipeline using a tessellation
    shader.


    For now, let’s say that we wish to draw a cube, and let’s presume that the vertices
    of our cube are hardcoded in an array in the C++/OpenGL application. In that case,
    we need to copy those values into one of our two buffers that we previously generated.
    To do that, we need to (a) make that buffer (say, the 0th buffer) “active” with
    the OpenGL glBindBuffer() command, and (b) use the glBufferData() command to copy
    the array containing the vertices into the active buffer (the 0th VBO in this
    case). Presuming that the vertices are stored in a float array named vPositions,
    the following C++ code² would copy those values into the 0th VBO:


    ```

    ```cpp

    glBindBuffer(GL_ARRAY_BUFFER, vbo[0]);

    glBufferData(GL_ARRAY_BUFFER, sizeof(vPositions), vPositions, GL_STATIC_DRAW);

    ```

    ```


    Next, we add code to display() that will cause the values in the buffer to be
    sent to the vertex attribute in the shader. We do this with the following three
    steps: (a) make that buffer “active” with the glBindBuffer() command as we did
    above, (b) associate the active buffer with a vertex attribute in the shader,
    and (c) enable the vertex attribute. The following lines of code accomplish these
    steps:


    ```

    ```cpp

    glBindBuffer(GL_ARRAY_BUFFER, vbo[0]);        // make the 0th buffer "active"

    glVertexAttribPointer(0, 3, GL_FLOAT, GL_FALSE, 0, 0);  // associate 0th attribute
    with buffer

    glEnableVertexAttribArray(0);                 // enable the 0th vertex attribute

    ```

    ```


    Now when we execute glDrawArrays(), data in the 0th VBO will be transmitted to
    the vertex attribute that has a layout qualifier with location 0. This sends the
    cube vertices to the shader.


    ² Note that here, for the first time, we are refraining from describing every
    parameter in one or more OpenGL calls. As mentioned in Chapter 2, the reader is
    encouraged to utilize the OpenGL documentation for such details as needed.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# ## 4.2 UNIFORM VARIABLES


    Rendering a scene so that it appears 3D requires building appropriate transformation
    matrices, such as those described in Chapter 3, and applying them to each of the
    models'' vertices. It is most efficient to apply the required matrix operations
    in the vertex shader, and it is customary to send these matrices from the C++/OpenGL
    application to the shader in a uniform variable.


    Uniform variables are declared in a shader by using the “uniform” keyword. The
    following example, which declares variables to hold model-view and projection
    matrices, will be suitable for our cube program:


    ```

    ```glsl

    uniform mat4 mv_matrix;

    uniform mat4 proj_matrix;

    ```

    ```


    The keyword “mat4” indicates that these are 4x4 matrices. Here we have named the
    variable mv_matrix to hold the model-view matrix and the variable proj_matrix
    to hold the projection matrix. Since 3D transformations are 4x4, mat4 is a commonly
    used datatype in GLSL shader uniforms.


    Sending data from a C++/OpenGL application to a uniform variable requires the
    following steps: (a) acquire a reference to the uniform variable and (b) associate
    a pointer to the desired values with the acquired uniform reference. Assuming
    that the linked rendering program is saved in a variable called “renderingProgram”,
    the following lines of code would specify that we will be sending model-view and
    projection matrices to the two uniforms mv_matrix and proj_matrix in our cube
    example:


    ```

    ```cpp

