    # ## 16.2.10 Plane Intersection and Procedural Textures


    In the previous examples, textures were provided in the form of texture image
    files. In some cases, a surface texture is sufficiently simple that it can be
    created procedurally, with the advantage that such textures are less likely to
    exhibit image-related artifacts.


    In Program 16.8, we add a plane object (more precisely, a plane segment) to the
    scene, serving as a sort of table-top surface below the objects. Shadows are cast
    onto the plane object, but not onto the skybox. The plane has been textured with
    a checkerboard pattern, generated procedurally.


    Computing the intersection point of a ray with a plane is significantly easier
    than it was for the sphere and the box because a plane has no “inside” that needs
    to be considered, so there is always at most one intersection point to consider.
    The derivation is well documented [§16]. Using standard geometry, the distance
    $t$ along a ray starting at position with direction when it intersects a horizontal
    plane centered at the origin with normal $n_p=(0,1,0)$ is:'
  merge: -1
  img_proc: true
- pgno: 441
  md: '$t = (-r_s \cdot n_p)/(r_d \cdot n_p)$


    The intersect point is then, as before,


    $collision\ point = r_s + t * r_d$


    Given the plane’s width $w$ (i.e., on the $x$-axis) and depth $d$ (i.e., on the
    $z$-axis), the ray misses the plane segment when


    $|collisionPoint_x| > \frac{w}{2}$ or $|collisionPoint_z| > \frac{d}{2}$


    These can be generalized to planes at an arbitrary location and rotation using
    the non-axis-aligned methods described previously in Section 16.2.8. Similarly,
    the surface normal at the collision point, which so far has been fixed as (0,1,0),
    may be rotated if the plane is not aligned with the XZ-axes. Texture coordinates
    are just the $collisionPoint$ x and z coordinates, normalized to the range [0..1].


    Computing the procedural checkerboard pattern of white and black colors can be
    done by scaling the texture coordinates up by the desired number of squares in
    the checkerboard, and then taking that result modulo 2. The result of 0 or 1 is
    then returned as either color (0,0,0) or (1,1,1) – i.e., black or white – respectively.


    Note that as we increase the number of objects, the test for which collision is
