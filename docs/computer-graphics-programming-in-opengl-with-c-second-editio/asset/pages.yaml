  md: "rather than the usual vec2. Since a pixel coordinate is a vec4, it is necessary\
    \ to project that onto 2D texture space in order to look up the depth value in\
    \ the shadow texture map. As we will see in the following, textureProj() does\
    \ all of this for us.\n\nThe remainder of the vertex and fragment shader code\
    \ implements Blinn-Phong shading. These shaders are shown in Figures 8.6 and 8.7,\
    \ with the added code for shadow mapping highlighted.\n\nLet’s examine more closely\
    \ how we use OpenGL to perform the depth comparison between the pixel being rendered\
    \ and the value in the shadow texture. We start in the vertex shader with vertex\
    \ coordinates in model space, which we multiply by shadowMVP2 to produce shadow\
    \ texture coordinates that correspond to vertex coordinates projected into light\
    \ space, previously generated from the light’s point of view. The interpolated\
    \ (3D) light space coordinates (x,y,z) are used in the\n\n```\n```glsl\n#version\
    \ 430\nlayout (location=0) in vec3 vertPos;\nlayout (location=1) in vec3 vertNormal;\n\
    \nout vec3 varyingNormal, varyingLightDir, varyingVertPos, varyingHalfVec;\nout\
    \ vec4 shadow_coord;\n\nstruct PositionalLight { vec4 ambient, diffuse, specular;\
    \ vec3 position; };\nstruct Material { vec4 ambient, diffuse, specular; float\
    \ shininess; };\nuniform vec4 globalAmbient;\nuniform PositionalLight light; \
    \      // light's position is assumed to be in eye space\nuniform Material material;\n\
    uniform mat4 mv_matrix;\nuniform mat4 proj_matrix;\nuniform mat4 norm_matrix;\n\
    uniform mat4 shadowMVP2;\nlayout (binding=0) uniform sampler2DShadow shTex;\n\n\
    void main(void)\n{\n    varyingVertPos = (mv_matrix * vec4(vertPos,1.0)).xyz;\n\
