  md: 'effects, we will need to know *outward normals* associated with the model we
    are rendering. Figure 3.8 shows an example of a simple model made up of six points
    (vertices) and the computation employing cross product that determines the outward
    normal of one of its faces.


    ![](img/1695de1bc7486362f86c143285f3fb40_67_0.png)


    # ### 3.6.6 LOCAL AND WORLD SPACE


    The most common use for 3D graphics (with OpenGL or any other framework) is to
    simulate a three-dimensional world, place objects in it, and then view that simulated
    world on a monitor. The objects placed in the 3D world are usually modeled as
    collections of triangles. Later, in Chapter 6, we will dive into modeling. But
    we can start looking at the overall process now.


    When building a 3D model of an object, we generally orient the model in the most
    convenient manner for describing it. For example, when modeling a sphere, we might
    orient the model with the sphere''s center at the origin (0,0,0) and give it a
    convenient radius, such as 1. The space in which a model is defined is called
    its *local space*, or *model space*. OpenGL documentation uses the term *object
    space*.


    The sphere might then be used as a piece of a larger model, such as becoming the
    head on a robot. The robot would, of course, be defined in its own local/model
    space. Positioning the sphere model into the robot model space can be done using
    the matrix transforms for scale, rotation, and translation, as illustrated in
    Figure 3.9. In this manner, complex models can be built hierarchically (this is
    developed further in Section 4.8 of Chapter 4 using a stack of matrices).


    In the same manner, modeled objects are placed in a simulated world by deciding
    on the orientation and dimensions of that world, called *world space*. The matrix
    that positions and orients an object into world space is called a *model matrix*,
    or M.'
