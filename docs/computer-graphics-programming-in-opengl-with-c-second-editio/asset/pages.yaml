    ...\nglDrawArrays(GL_TRIANGLES, 0, numSphereVertices);\n```\n\n# Fragment Shader:\n\
    \n```\n#version 430\nin vec2 tc;              // texture coordinates for this\
    \ fragment\nin vec3 origPos;          // original vertex positions in the model,\
    \ for accessing 3D texture\n...\nlayout (binding=0) uniform sampler3D n;     \
    \  // sampler for noise texture\nlayout (binding=1) uniform sampler2D e;     \
    \  // sampler for earth texture\n...\nuniform float t;          // threshold for\
    \ retaining or discarding fragment\n\nvoid main(void)\n{\n    float noise = texture(n,\
    \ origPos).x;      // retrieve noise value for this fragment.\n    if (noise >\
    \ t)                           // if the noise value > current threshold value,\n\
    \    {   fragColor = texture(e, tc);           // render the fragment using the\
    \ earth texture.\n    }\n    else\n    {   discard;       // otherwise, discard\
    \ the fragment (do not render it)\n    }\n}\n```\n\n![](img/1695de1bc7486362f86c143285f3fb40_368_0.png)\n\
    \n**Figure 14.24**\nDissolve effect with discard shader."
