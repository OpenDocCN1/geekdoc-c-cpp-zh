  md: "# ## 5.6 USING THE TEXTURE IN A SHADER: SAMPLER VARIABLES AND TEXTURE UNITS\n\
    \nTo maximize performance, we will want to perform the texturing in hardware.\
    \ This means that our fragment shader will need a way of accessing the texture\
    \ object that we created in the C++/OpenGL application. The mechanism for doing\
    \ this is via a special GLSL tool called a *uniform sampler variable*. This is\
    \ a variable designed for instructing a texture unit on the graphics card as to\
    \ which texel to extract or “sample” from a loaded texture object.\n\nDeclaring\
    \ a sampler variable in the shader is easy—just add it to your set of uniforms:\n\
    \n```\n    layout (binding=0) uniform sampler2D samp;\n```\n\nOurs is named “samp”.\
    \ The “layout (binding=0)” portion of the declaration specifies that this sampler\
    \ is to be associated with texture unit 0.\n\nA texture unit (and associated sampler)\
    \ can be used to sample whichever texture object you wish, and that can change\
    \ at runtime. Your display() function will need to specify which texture object\
    \ you want the texture unit to sample for the current frame. So each time you\
    \ draw an object, you will need to activate a texture unit and bind it to a particular\
    \ texture object, for example:\n\n```\n    glActiveTexture(GL_TEXTURE0);\n   \
    \ glBindTexture(GL_TEXTURE_2D, brickTexture);\n```\n\nThe number of available\
    \ texture units depends on how many are provided on the graphics card. According\
    \ to the OpenGL API documentation, OpenGL version 4.5 requires that this be at\
    \ least 16 per shader stage, and at least 80 total units across all stages [OP16].\
    \ In this example, we have made the 0th texture unit active by specifying GL_TEXTURE0\
    \ in the glActiveTexture() call.\n\nTo actually perform the texturing, we will\
    \ need to modify how our fragment shader outputs colors. Previously, our fragment\
    \ shader either output a constant color, or it obtained colors from a vertex attribute.\
