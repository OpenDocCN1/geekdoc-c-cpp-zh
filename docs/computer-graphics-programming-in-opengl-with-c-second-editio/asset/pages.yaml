  md: "# *Fragment Shader (for plane segment)*\n\n```\n~~~glsl\n// Similar to previous\
    \ fragment shaders, except that a checkerboard texture has been added.\n// Incoming\
    \ texture coordinates are scaled up here to facilitate repeating texture.\n#version\
    \ 430\n\nin vec2 tc;\nout vec4 color;\n\nuniform mat4 mv_matrix;\nuniform mat4\
    \ proj_matrix;\n\nvec3 checkerboard(vec2 tc)\n{\n    float tileSize = 64.0;\n\
    \    float tile = mod(floor(tc.x * tileSize) + floor(tc.y * tileSize), 2.0);\n\
    \    return tile * vec3(1,1,1);\n}\n\nvoid main(void)\n{\n    color = vec4(checkerboard(tc),\
    \ 1.0);\n}\n~~~\n```\n\nThe C++/OpenGL application specifies that the plane is\
    \ at a height of 0.0, meaning it is level with the XZ plane. The camera is 2.0\
    \ units above the plane, and pitched -15° looking downwards towards the plane.\
    \ Specifying the plane requires 18 floating point values (2 triangles × 3 vertices/triangle\
    \ × 3 coordinates/vertex). Computing its procedural “checkerboard” pattern is\
    \ accomplished in a similar manner as for the 3D example shown previously in Section\
    \ 14.4. The desired number of squares per side is specified in the variable tileScale,\
    \ and the pattern is then produced by scaling the texture coordinates up by tileScale\
    \ and taking that result modulo 2. The result of 0 or 1 is then returned as either\
    \ color (0,0,0) or (1,1,1) – i.e., black or white – respectively.\n\n![](img/1695de1bc7486362f86c143285f3fb40_375_0.png)\n\
    \n**Figure 15.1**\nGeometry setup for the plane segment surface"
