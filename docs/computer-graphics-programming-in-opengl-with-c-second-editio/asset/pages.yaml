- pgno: 231
  md: 'entire shadow map. Second, to achieve a sufficiently broad penumbra effect,
    a moderate number of nearby shadow map texels are sampled, each at some modest
    distance from the texel corresponding to the pixel being rendered.


    ![](img/1695de1bc7486362f86c143285f3fb40_231_0.png)


    **Figure 8.21**

    Soft shadow rendering — 64 samples per pixel.


    The width of the penumbra and the number of points sampled can be tuned depending
    on the scene and the performance requirements. For example, the image shown in
    Figure 8.21 was generated using PCF, with each pixel''s brightness determined
    by sampling 64 nearby shadow map texels at various distances from the pixel''s
    texel.


    The accuracy or smoothness of our soft shadows depends on the number of nearby
    texels sampled. Thus, there is a tradeoff between performance and quality—the
    more points sampled, the better the results, but the more computational overhead
    is incurred. Depending on the complexity of the scene and the framerate required
    for a given application, there is often a corresponding practical limit to the
    quality that can be achieved. Sampling 64 points per pixel, such as in Figure
    8.21, is usually impractical.


    A commonly used algorithm for implementing PCF is to sample four nearby texels
    per pixel, with the samples selected at specified offset distances from the texel
    which corresponds to the pixel. As we process each pixel, we alter the offsets
    used to determine which four texels are sampled. Altering the offsets in a staggered
    manner is sometimes called *dithering*, and aims to make the soft shadow boundary
    appear less “blocky” than it ordinarily would given the small number of sample
    points.


    A common approach is to assume one of four different offset patterns—we can choose
    which pattern to use for a given pixel by computing the pixel''s `glFragCoord
    mod 2`. Recall that `glFragCoord` is of type `vec2`, containing the x and y coordinates
    of the pixel location; the result of the `mod` computation is then one of four
    values: (0,0), (0,1), (1,0), or (1,1). We use this result to select one of our
    four different offset patterns in texel space (i.e., in the shadow map).


    The offset patterns are typically specified in the x and y directions with different
    combinations of -1.5, -0.5, +0.5, and +1.5 (these can also be scaled as desired).'
