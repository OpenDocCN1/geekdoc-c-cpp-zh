  md: "```\n~~~glsl\nuniform float winSizeY;\nlayout (binding=0) uniform sampler2D\
    \ lensTex;    // this is the previously rendered framebuffer texture\n\nvoid main(void)\n\
    { float K1 = -0.55; // distortion parameters for Google Cardboard\n  float K2\
    \ = 0.34;\n\n  // compute the location in the half window scaled to (-0.5,+0.5)\
    \ with (0,0) center\n  float xd = (gl_FragCoord.x-winSizeX*leftRight) / winSizeX\
    \ - 0.5;\n  float yd = gl_FragCoord.y / winSizeY - 0.5;\n\n  // compute the distance\
    \ to the center of the half window\n  float ru = sqrt(pow(xd,2.0) + pow(yd,2.0));\n\
    \n  // tune conversion from screen units to physical millimeters\n  float mmRatio\
    \ = 1.3; // ratio of ru/d, where d is the distance to the lens\n  float m = ru\
    \ * mmRatio;\n\n  // compute the undistorted corresponding location\n  float distortionFactor\
    \ = 1 + K1 * pow(m,2.0) + K2 * pow(m,4.0);\n  float xu = xd / distortionFactor;\n\
    \  float yu = yd / distortionFactor;\n\n  // move the resulting point by (+0.5,\
    \ +0.5) to convert to texture space\n  fragColor = texture(lensTex, vec2(xu+0.5,\
    \ yu+0.5));\n}\n~~~\n```\n\nIn Program 17.3, specifically the C++/OpenGL application,\
    \ setup of the framebuffer texture (i.e., setting up leftRightBuffer and its associated\
    \ texture named leftRightTexture) is identical to the water example from Program\
    \ 15.3. There, the buffer was used to store a reflection (later, a second one\
    \ was used to store a refraction). Here, it is used to store the entire scene,\
    \ at the same dimensions as the one-half screen window viewport. A second rendering\
    \ program (called distCorrectionProgram) is created for displaying this buffer\
    \ to the screen, which happens in the function copyFrameBufferToViewport(), which\
    \ is called once for the left eye, and then again for the right eye. Most of the\
    \ remaining C++ code is unchanged, including the display() function that renders\
    \ the scene. The main() function is expanded to manage enabling which of the two\
    \ framebuffers (the screen buffer, or the leftRightBuffer) is active.\n\nThe actual\
    \ distortion correction happens in distCorrectionProgram's fragment shader. The\
    \ GLSL shader code implements (1) the computation of the distance from the location\
    \ being rendered to the center of the half-screen viewport, (2) the lens distortion\
    \ correction computations, and (3) the resulting texel lookup in leftRightTexture."
