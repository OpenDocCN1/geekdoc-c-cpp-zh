    # 2.1.5 Rasterization


    Ultimately, our 3D world of vertices, triangles, colors, and so on needs to be
    displayed on a 2D monitor. That 2D monitor screen is made up of a raster—a rectangular
    array of pixels.


    When a 3D object is rasterized, OpenGL converts the primitives in the object (usually
    triangles) into fragments. A fragment holds the information associated with a
    pixel. Rasterization determines the locations of pixels that need to be drawn
    in order to produce the triangle specified by its three vertices.


    Rasterization starts by interpolating, pairwise, between the three vertices of
    the triangle. There are some options for doing this interpolation; for now it
    is sufficient to consider simple linear interpolation as shown in Figure 2.9.
    The original three vertices are shown in red.


    If rasterization were to stop here, the resulting image would appear as wireframe.
    This is an option in OpenGL, by adding the following command in the display()
    function, before the call to glDrawArrays():


    ```

    glPolygonMode(GL_FRONT_AND_BACK, GL_LINE);

    ```


    If the torus shown previously in Section 2.1.4 is rendered with the addition of
    this line of code, it appears as shown in Figure 2.10.


    ![](img/1695de1bc7486362f86c143285f3fb40_39_2.png)


    **Figure 2.9**


    Rasterization (step 1).'
