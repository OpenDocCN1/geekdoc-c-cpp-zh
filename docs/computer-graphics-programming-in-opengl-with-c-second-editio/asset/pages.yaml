  md: 'There are more sophisticated ways to organize the code for animating a scene,
    especially with respect to managing threads. Some language bindings such as JOGL
    and LWJGL (for Java) offer classes to support animation. Readers interested in
    designing a render loop (or “game loop”) appropriate for a particular application
    are encouraged to consult some of the more specialized books on game engine design
    (e.g., [NY14]), and to peruse the related discussions on gamedev.net [GD20].


    We glossed over one detail on the glShaderSource() command. The fourth parameter
    is used to specify a “lengths array” that contains the integer string lengths
    of each line of code in the given shader program. If this parameter is set to
    null, as we have done, OpenGL will build this array automatically if the strings
    are null-terminated. While we have been careful to ensure that our strings sent
    to glShaderSource() are null-terminated (by calling the c_str() function in createShaderProgram()),
    it is not uncommon to encounter applications that build these arrays manually
    rather than sending null.


    Throughout this book, the reader may at times wish to know one or more of OpenGL’s
    upper limits. For example, the programmer might need to know the maximum number
    of outputs that can be produced by the geometry shader, or the maximum size that
    can be specified for rendering a point. Many such values are implementation-dependent,
    meaning that they can vary between different machines. OpenGL provides a mechanism
    for retrieving such limits using the glGet() command, which takes various forms
    depending on the type of the parameter being queried. For example, to find the
    maximum allowable point size, the following call will place the minimum and maximum
    values (for your machine’s OpenGL implementation) into the first two elements
    of the float array named “size”:


    ```

    ```

    glGetFloatv(GL_POINT_SIZE_RANGE, size)

    ```

    ```


    Many such queries are possible. Consult the OpenGL reference [OP16] documentation
    for examples.


    In this chapter, we have tried to describe each parameter on each OpenGL call.
    However, as the book proceeds, this will become unwieldy and we will sometimes
    not bother describing a parameter when we believe that doing so would complicate
    matters unnecessarily. This is because many OpenGL functions have a large number
    of parameters that are irrelevant to our examples. The reader should get used
    to using the OpenGL documentation to fill in such details when necessary.'
