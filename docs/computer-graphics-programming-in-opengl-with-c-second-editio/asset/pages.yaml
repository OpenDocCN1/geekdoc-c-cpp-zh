- pgno: 179
  md: '# # LIGHTING


    +   - 7.1 Lighting Models ..... 159

    +   - 7.2 Lights ..... 161

    +   - 7.3 Materials ..... 164

    +   - 7.4 ADS Lighting Computations ..... 166

    +   - 7.5 Implementing ADS Lighting ..... 169

    +   - 7.6 Combining Lighting and Textures ..... 183

    +   - Supplemental Notes ..... 184

    +   - Historical Note ..... 186


    Light affects the appearance of our world in varied and sometimes dramatic ways.
    When a flashlight shines on an object, we expect it to appear brighter on the
    side facing the light. The earth on which we live is itself brightly lit where
    it faces the sun at noon, but as it turns, that daytime brightness gradually fades
    into evening, until becoming completely dark at midnight.


    Objects also respond differently to light. Besides having different colors, objects
    can have different reflective characteristics. Consider two objects, both green,
    but where one is made of cloth versus another made of polished steel—the latter
    will appear more “shiny.”


    # ## 7.1 LIGHTING MODELS


    Light is the product of photons being emitted by high energy sources and subsequently
    bouncing around until some of the photons reach our eyes. Unfortunately, it is
    computationally infeasible to emulate this natural process, as it would require
    simulating and then tracking the movement of a huge number of photons, adding
    many objects (and matrices) to our scene. What we need is a *lighting model*.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Lighting models are sometimes called *shading models*, although in the presence
    of shader programming, that can be a bit confusing. Sometimes the term *reflection
    model* is used, complicating the terminology further. We will try to stick to
    whichever terminology is simple and most practical.


    The most common lighting models today are called “ADS” models, because they are
    based on three types of reflection labeled A, D, and S:


    +   - **Ambient reflection** simulates a low-level illumination that equally affects
    everything in the scene.

    +   - **Diffuse reflection** brightens objects to various degrees depending on
    the light’s angle of incidence.

    +   - **Specular reflection** conveys the shininess of an object by strategically
    placing a highlight of appropriate size on the object’s surface where light is
    reflected most directly toward our eyes.


    ADS models can be used to simulate different lighting effects and a variety of
    materials.


    ![](img/1695de1bc7486362f86c143285f3fb40_180_0.png)


    **Figure 7.1**

    ADS lighting contributions.


    Figure 7.1 illustrates the ambient, diffuse, and specular contributions of a positional
    light on a shiny gold torus.


    Recall that a scene is ultimately drawn by having the fragment shader output a
    color for each pixel on the screen. Using an ADS lighting model requires specifying
    contributions due to lighting on a pixel’s RGBA output value. Factors include:


    +   - The type of light source and its ambient, diffuse, and specular characteristics

    +   - The object’s material’s ambient, diffuse, and specular characteristics

    +   - The object’s material’s specified “shininess”

    +   - The angle at which the light hits the object

    +   - The angle from which the scene is being viewed'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# ## 7.2 LIGHTS


    There are many types of lights, each with different characteristics and requiring
    different steps to simulate their effects. Some types include:


    +   * Global (usually called "global ambient") because it includes only an ambient
    component)

    +   * Directional (or "distant")

    +   * Positional (or "point source")

    +   * Spotlight


    *Global ambient light* is the simplest type of light to model. Global ambient
    light has no source position—the light is equal everywhere, at each pixel on every
    object in the scene, regardless of where the objects are. Global ambient lighting
    simulates the real-world phenomenon of light that has bounced around so many times
    that its source and direction are undeterminable. Global ambient light has only
    an ambient component, specified as an RGBA value; it has no diffuse or specular
    components. For example, global ambient light can be defined as follows:


    ```

    ```

    float globalAmbient[4] = { 0.6f, 0.6f, 0.6f, 1.0f };

    ```

    ```


    RGBA values range from 0 to 1, so global ambient light is usually modeled as dim
    white light, where each of the RGB values is set to the same fractional value
    between 0 and 1 and the alpha is set to 1.


    *Directional* or *distant* light also doesn''t have a source location, but it
    does have a *direction*. It is useful for situations where the source of the light
    is so far away that the light rays are effectively parallel, such as light coming
    from the sun. In many such situations we may only be interested in modeling the
    light and not the object that produces the light. The effect of directional light
    on an object depends on the light''s angle of impact; objects are brighter on
    the side facing a directional light than on a tangential or opposite side. Modeling
    directional light requires specifying its direction (as a vector) and its ambient,
    diffuse, and specular characteristics (as RGBA values). A red directional light
    pointing down the negative Z axis might be specified as follows:


    ```

    ```

    float dirLightAmbient[4] = { 0.1f, 0.0f, 0.0f, 1.0f };

    float dirLightDiffuse[4] = { 1.0f, 0.0f, 0.0f, 1.0f };

    float dirLightSpecular[4] = { 1.0f, 0.0f, 0.0f, 1.0f };

    float dirLightDirection[3] = { 0.0f, 0.0f, -1.0f };

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: "It might seem redundant to include an ambient contribution for a light when\
    \ we already have global ambient light. The separation of the two, however, is\
    \ intentional and noticeable when the light is “on” or “off.” When “on,” the total\
    \ ambient contribution would be increased, as expected. In the above example,\
    \ we have included only a small ambient contribution for the light. It is important\
    \ to balance the two contributions depending on the needs of your scene.\n\nA\
    \ *Positional* light has a specific location in the 3D scene. Light sources that\
    \ are near the scene, such as lamps, candles, and so forth, are examples. Like\
    \ directional lights, the effect of a positional light depends on angle of impact;\
    \ however, its direction is not specified, as it is different for each vertex\
    \ in our scene. Positional lights may also incorporate *attenuation factors* in\
    \ order to model how their intensity diminishes with distance. As with the other\
    \ types of lights we have seen, positional lights have ambient, diffuse, and specular\
    \ properties specified as RGBA values.\n\nA red positional light at location (5,\
    \ 2, -3) could for example be specified as follows:\n\n```\n    float posLightAmbient[4]\
    \ = { 0.1f, 0.0f, 0.0f, 1.0f };\n    float posLightDiffuse[4] = { 1.0f, 0.0f,\
    \ 0.0f, 1.0f };\n    float posLightSpecular[4] = { 1.0f, 0.0f, 0.0f, 1.0f };\n\
    \    float posLightLocation[3] = { 5.0f, 2.0f, -3.0f };\n```\n\nAttenuation factors\
    \ can be modeled in a variety of ways. One way is to include tunable non-negative\
    \ parameters for *constant*, *linear*, and *quadratic* attenuation (*k*<sub>c</sub>,\
    \ *k*<sub>l</sub>, and *k*<sub>q</sub> respectively). These parameters are then\
    \ combined, taking into account the distance (*d*) from the light source:\n\n\
    attenuationFactor = 1 / (*k*<sub>c</sub> + *k*<sub>l</sub>*d* + *k*<sub>q</sub>*d*<sup>2</sup>)\n\
    \nMultiplying this factor by the light intensity causes the intensity to be decreased\
    \ the greater the distance is to the light source. Note that *k*<sub>c</sub> should\
    \ always be set greater than or equal to 1.0, and at least one of the other parameters\
    \ greater than 0.0, so that the attenuation factor will always be in the range\
    \ [0..1] and approach 0 as the distance *d* increases.\n\n***Spotlights*** have\
    \ both a position and a direction. The effect of the spotlight’s “cone” can be\
    \ simulated using a *cutoff angle* θ between 0° and 90° specifying the half-width\
    \ of the light beam, and a *falloff exponent* to model the variation of intensity\
    \ across the angle of the beam. As shown in Figure 7.2, we determine the"
  merge: -1
  img_proc: true
- pgno: 183
  md: 'angle ϕ between the spotlight’s direction and a vector from the spotlight to
    the pixel. We then compute an *intensity factor* by raising the cosine of ϕ to
    the fall-off exponent when ϕ is less than θ (when ϕ is greater than θ, the intensity
    factor is set to 0). The result is an intensity factor that ranges from 0 to 1.
    The falloff exponent adjusts the rate at which the intensity factor tends to 0
    as the angle ϕ increases. The intensity factor is then multiplied by the light’s
    intensity to simulate the cone effect.


    A red spotlight at location (5,2,-3) pointing down the negative Z axis could be
    specified as:


    ```

    ```text

    float spotLightAmbient[4] = { 0.1f, 0.0f, 0.0f, 1.0f };

    float spotLightDiffuse[4] = { 1.0f, 0.0f, 0.0f, 1.0f };

    float spotLightSpecular[4] = { 1.0f,0.0f, 0.0f, 1.0f };

    float spotLightLocation[3] = { 5.0f, 2.0f, -3.0f };

    float spotLightDirection[3] = { 0.0f, 0.0f, -1.0f };

    float spotLightCutoff = 20.0f;

    float spotLightExponent = 10.0f;

    ```

    ```


    Spotlights also can include attenuation factors. We haven’t shown them in the
    above settings, but defining them can be done in the same manner as described
    earlier for positional lights.


    Historically, spotlights have been iconic in computer graphics since Pixar’s popular
    animated short “Luxo Jr.” appeared in 1986 [DI20].


    ![](img/1695de1bc7486362f86c143285f3fb40_183_0.png)


    When designing a system containing many types of lights, a programmer should consider
    creating a class hierarchy, such as defining a “Light” class and subclasses for
    “Global Ambient,” “Directional,” “Positional,” and “Spotlight.” Because spotlights
    share characteristics of both directional and positional lights, it'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'is worth considering utilizing C++’s *multiple inheritance* capability, and
    to design a Spotlight class that inherits from both directional and positional
    light classes. Our examples are sufficiently simple that we omit building such
    a class hierarchy for lighting in this edition.


    # 7.3 MATERIALS


    The “look” of the objects in our scene has so far been handled exclusively by
    color and texture. The addition of lighting allows us to also consider the *reflectance*
    characteristics of the surfaces. By that we mean how the object interacts with
    our ADS lighting model. This can be modeled by considering each object to be “made
    of” a certain *material*.


    Materials can be simulated in an ADS lighting model by specifying four values,
    three of which we are already familiar with—*ambient, diffuse,* and *specular*
    RGB colors. The fourth is called *shininess*, which, as we will see, is used to
    build an appropriate specular highlight for the intended material. ADS and shininess
    values have been developed for many different types of common materials. For example,
    “pewter” can be specified as follows:


    ```

    float pewterMatAmbient[4] = { .11f, .06f, .11f, 1.0f };

    float pewterMatDiffuse[4] = { .43f, .47f, .54f, 1.0f };

    float pewterMatSpecular[4] = { .33f, .33f, .52f, 1.0f };

    float pewterMatShininess = 9.85f;

    ```


    ADS RGBA values for a few other materials are given in Figure 7.3 (from [BA16]).


    Sometimes other properties are included in the material properties. *Transparency*
    is handled in the RGBA specifications in the fourth (or “alpha”) channel, which
    specifies an opacity; a value of 1.0 represents completely opaque and 0.0 represents
    completely transparent. For most materials it is simply set to 1.0, although for
    certain materials a slight transparency plays a role. For example, in Figure 7.3,
    note that the materials “jade” and “pearl” include a small amount of transparency
    (values slightly less than 1.0) to add realism.


    *Emission* is also sometimes included in an ADS material specification. This is
    useful when simulating a material that emits its own light, such as phosphorescent
    materials.'
