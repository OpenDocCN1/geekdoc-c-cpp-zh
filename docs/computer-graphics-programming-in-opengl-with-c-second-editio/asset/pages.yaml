  md: '+   * (shadow_coord.x+0.5, shadow_coord.y+0.5)

    +   * (shadow_coord.x+0.5, shadow_coord.y-1.5)


    (Recall that shadow_coord is the location of the texel in the shadow map corresponding
    to the pixel being rendered—shown as a white circle in Figures 8.22 and 8.23.)


    We next call textureProj() on each of these four points, which in each case returns
    either 0.0 or 1.0 depending on whether or not that sampled point is in shadow.
    We sum the four results and divide by 4.0 to determine the percentage of sampled
    points which are in shadow. This percentage is then used as a multiplier to determine
    the amount of diffuse and specular lighting to be applied when rendering the current
    pixel.


    ![](img/1695de1bc7486362f86c143285f3fb40_233_0.png)


