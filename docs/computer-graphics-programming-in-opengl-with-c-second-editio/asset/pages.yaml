  md: "![](img/1695de1bc7486362f86c143285f3fb40_159_0.png)\n\n**Figure 6.11**  \n\
    Building a torus.\n\neach of these vertices as they are built. An additional vector\
    \ tangent to the surface of the torus (called the *tangent vector*) is also generated\
    \ for each vertex.\n\nVertices for additional torus rings are formed by rotating\
    \ the original ring around the Y axis. Tangent and normal vectors for each resulting\
    \ vertex are computed by also rotating the tangent and normal vectors of the original\
    \ ring around the Y axis. After the vertices are created, they are traversed from\
    \ ring to ring, and for each vertex two triangles are generated. The generation\
    \ of six index table entries comprising the two triangles is done in a similar\
    \ manner as we did for the sphere.\n\nOur strategy for choosing texture coordinates\
    \ for the remaining rings will be to arrange them so that the S axis of the texture\
    \ image wraps halfway around the horizontal perimeter of the torus and then repeats\
    \ for the other half. As we rotate around the Y axis generating the rings, we\
    \ specify a variable ring that starts at 1 and increases up to the specified precision\
    \ (again dubbed “prec”). We then set the S texture coordinate value to ring*2.0/prec,\
    \ causing S to range between 0.0 and 2.0, then set the texture’s tiling mode to\
    \ GL_REPEAT as described in Section 5.10. The motivation for this approach is\
    \ to avoid having the texture image appear overly “stretched” horizontally. If\
    \ instead we did want the texture to stretch completely around the torus, we would\
    \ simply remove the “*2.0” multiplier from the texture coordinate computation.\n\
    \nBuilding a torus class in C++/OpenGL could be done in a virtually identical\
    \ manner as for the Sphere class. However, we have the opportunity to take advantage\
    \ of the indices that we created while building the torus by using OpenGL’s support\
    \ for vertex indexing (we could also have done this for the sphere, but we didn’t).\
    \ For very large models with thousands of vertices, using OpenGL indexing can\
    \ result in improved performance, and so we will describe how to do that next."
