  md: "We start by building a procedural “rings” 3D texture map, similar to the “checkerboard”\
    \ from earlier in this chapter. We then use a noise map to perturb those rings,\
    \ inserting dark and light brown colors into the ring texture map. By adjusting\
    \ the number of rings, and the degree to which we perturb the rings, we can simulate\
    \ wood with various types of grain. Shades of brown can be made by combining similar\
    \ amounts of red and green, with less blue. We then apply Phong shading with a\
    \ low level of “shininess.”\n\nWe can generate rings encircling the Z-axis in\
    \ our 3D texture map by modifying the fillDataArray() function, using trigonometry\
    \ to specify values for X and Y that are equidistant from the Z axis. We use a\
    \ sine wave to repeat this process cyclically, raising and lowering the red and\
    \ green components equally based on this sine wave to produce the varying shades\
    \ of brown. The variable sineValue holds the exact shade, which can be adjusted\
    \ by slightly offsetting one or the other (in this case increasing the red by\
    \ 80, and the green by 30). We can create more (or fewer) rings by adjusting the\
    \ value of xyPeriod. The resulting texture is shown in Figure 14.18.\n\n```\n\
    ```cpp\nvoid fillDataArray(GLubyte data[ ]) {\n    double xyPeriod = 40.0;\n \
    \   for (int i=0; i<noiseWidth; i++) {\n        for (int j=0; j<noiseHeight; j++)\
