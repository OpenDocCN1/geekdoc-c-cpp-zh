    \    double distanceFromZ = sqrt(xValue * xValue + yValue * yValue);\n       \
    \         double sineValue = 128.0 * abs(sin(2.0 * xyPeriod * distanceFromZ *\
    \ 3.14159));\n                float redPortion = (float)(80 + (int)sineValue);\n\
    \                float greenPortion = (float)(30 + (int)sineValue);\n        \
    \        float bluePortion = 0.0f;\n                data[(noiseWidth*noiseHeight*4)+(noiseHeight*4*k)+4*j+0]\
