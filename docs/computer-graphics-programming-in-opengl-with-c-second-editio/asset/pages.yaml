  img_proc: true
- pgno: 449
  md: '![](img/1695de1bc7486362f86c143285f3fb40_449_0.png)


    **Figure 16.14**

    Refraction with two secondary rays, through a transparent sphere

    (The angles have been exaggerated for clarity.)


    The derivation for computing a refraction angle is well-documented [F96]:


    $$

    S = \left( \eta_r (N \bullet I) - \sqrt{1 - \eta_r^2 \left(1 - \operatorname{dot}(N,I)^2\right)}
    \right) N - \eta_r I

    $$


    where η_r is the ratio of the IORs of the source and destination media. Rather
    than code this formula, we simply use the GLSL refract() function that implements
    it. refract() takes three parameters as input: the incoming vector I, the normal
    vector N, and the IOR ratio η_r. It then produces the refracted secondary ray
    S as output.


    For a transparent solid glass sphere, the IOR at the point of entry is IOR_air/IOR_glass
    = 1.0/1.5 ≈ 0.66, and at the point of exit, it is IOR_glass/IOR_air = 1.5/1.0
    = 1.5.


    Program 16.10 converts the sphere to solid transparent glass, this time using
    a sequence of two secondary rays so as to generate the refraction of the brick
    box and skybox behind it. We have also built yet a third copy of the raytrace()
    function, so that the two secondary rays can be generated and traced in succession,
    one entering the sphere (with IOR=0.66) and one leaving it (with IOR=1.5). Lighting
    is included in both the entry and exit points. Since the color and lighting values
    are all fractions in the range [0..1], and we are multiplying them together, it
    is common to also need to scale the resulting color values up or the final result
    will be too dark; here we have scaled the refracted colors up by a factor of 2.0.


    Note also that the trick we used to avoid surface acne is modified slightly in
    both functions; instead of adding a small offset along the normal, we subtract
    the offset. This is because the secondary rays now continue through the collision
    point rather than rebounding. So, for refracted rays, we must add a small offset
    along the negative of the normal.'
