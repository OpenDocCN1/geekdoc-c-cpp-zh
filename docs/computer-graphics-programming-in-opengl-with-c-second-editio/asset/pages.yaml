- pgno: 295
  md: "The resulting output mesh is shown in Figure 12.1.\n\nThe tessellator produces\
    \ a mesh of vertices defined by two parameters: *inner level* and *outer level*.\
    \ In this case, the *inner level* is 12 and the *outer level* is 6—the outer edges\
    \ of the grid are divided into 6 segments, while the lines spanning the interior\
    \ are divided into 12 segments.\n\n![](img/1695de1bc7486362f86c143285f3fb40_295_0.png)\n\
    \n**Figure 12.1**  \nTessellator triangle mesh output.\n\nThe specific relevant\
    \ new constructs in Program 12.1 are highlighted. Let’s start by discussing the\
    \ first portion—the C++/OpenGL code.\n\nCompiling the two new shaders is done\
    \ exactly the same as for the vertex and fragment shaders. They are then attached\
    \ to the same rendering program, and the linking call is unchanged. The only new\
    \ items are the constants for specifying the type of shader being instantiated—the\
    \ new constants are as follows:\n\n```\n    GL_TESS_CONTROL_SHADER\n    GL_TESS_EVALUATION_SHADER\n\
    ```\n\nNote the new items in the display() function. The glDrawArrays() call now\
    \ specifies GL_PATCHES. When using tessellation, vertices sent from the C++/OpenGL\
    \ application into the pipeline (i.e., in a VBO) aren't rendered, but are usually\
    \ *control points*, such as those we saw for Bézier curves. A set of control points\
    \ is called a “patch,” and in those sections of the code using tessellation, GL_PATCHES\
    \ is the only allowable primitive. The number of vertices in a patch is specified\
    \ in the call to glPatchParameteri(). In this particular example, there aren't\
    \ any control points being sent, but we are still required to specify at least\
    \ one. Similarly, in the glDrawArrays() call we indicate a start value of 0 and\
    \ a vertex count of 1, even though we aren't actually sending any vertices from\
    \ the C++ program.\n\nThe call to glPolygonMode() specifies how the mesh should\
    \ be rasterized. The default is GL_FILL. Shown in the code is GL_LINE, which,\
    \ as we saw in Figure 12.1, caused only connecting lines to be rasterized (so\
    \ we could see the grid itself that was produced by the tessellator). If we change\
    \ that line of code to GL_FILL (or comment it out, resulting in the default behavior\
    \ GL_FILL), we get the version shown in Figure 12.2."
