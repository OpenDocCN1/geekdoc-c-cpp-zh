    ![](img/1695de1bc7486362f86c143285f3fb40_481_0.png)


    This entire textbook is about 3D rendering. However, “3D” is a rather overloaded
    term. We have been using it to mean displaying scenes using 3D perspective so
    that we can realistically perceive their objects at their locations and at their
    relative sizes. However, “3D” can also mean viewing a scene through a binocular
    mechanism that creates a fuller illusion of depth, often called *stereoscopy*.
    For example, many readers have seen such techniques in action at a movie cinema,
    where viewers are given special glasses to see a movie in “3D.” In this chapter,
    we explore the basics of how to generate stereoscopic renderings using OpenGL.


    In the real world, we experience a sensation of depth because our two eyes physically
    exist in slightly different locations. Our brain is able to combine our two eyes’
    slightly different viewpoints into a single 3D experience. To replicate this experience
    mechanically requires providing each eye with a similarly slightly different view
    of the scene we are rendering. Many approaches for doing this have been invented
    over the years.


    One of the first such devices was produced in the 1800s, and it consisted of a
    simple bracket called a “stereoscope” [WST]. This allowed one to view specially-produced
    photographs – more specifically, image pairs – so that each eye viewed the same
    subject but from very slightly different vantage points. These early stereoscopes
    were the inspiration for the widely popular View-Master® toys that emerged in
    the mid-1900s, and more recently for virtual reality headsets (see Figure 17.1).
    Devices of this sort are often called “side-by-side” viewers.'
