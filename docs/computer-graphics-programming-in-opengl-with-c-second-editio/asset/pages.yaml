    \ = TL;\n      gl_TessLevelOuter[1] = TL; gl_TessLevelOuter[3] = TL;\n      gl_TessLevelInner[0]\
    \ = TL; gl_TessLevelInner[1] = TL;\n   }\n}\n```\n```\n\n*Tessellation Evaluation\
