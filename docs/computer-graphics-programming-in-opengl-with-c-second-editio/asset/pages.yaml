- pgno: 241
  md: 'Texturing the cube with a texture cube map requires specifying appropriate
    texture coordinates. Figure 9.3 shows the distribution of texture coordinates
    that are in turn assigned to each of the cube vertices.


    ![](img/1695de1bc7486362f86c143285f3fb40_241_0.png)


    +   - *How do we make the skybox appear “distant”?*


    Another important factor in building a skybox is ensuring that the texture appears
    as a distant horizon. At first, one might assume this would require making the
    skybox very large. However, it turns out that this isn’t desirable because it
    would stretch and distort the texture. Instead, it is possible to make the skybox
    *appear* very large (and thus distant), by using the following two-part trick:


    +   - Disable depth testing and render the skybox first (re-enabling depth testing
    when rendering the other objects in the scene).

    +   - Move the skybox with the camera (if the camera moves).


    By drawing the skybox first with depth testing disabled, the depth buffer will
    still be filled completely with 1.0s (i.e., maximally far away). Thus, all other
    objects in the scene will be fully rendered; that is, none of the other objects
    will be blocked by the skybox. This causes the walls of the skybox to appear farther
    away than every other object, *regardless of the actual size of the skybox*. The
    actual skybox cube itself can be quite small, as long as it is moved along with
    the camera whenever the camera moves. Figure 9.4 shows viewing a simple scene
    (actually just a brick-textured torus) from inside a skybox.'
