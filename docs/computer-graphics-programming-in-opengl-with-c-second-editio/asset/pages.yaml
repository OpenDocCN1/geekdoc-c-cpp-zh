    Despite the small sampling size—only four samples per pixel—this dithered approach
    can often produce surprisingly good soft shadows. Figure 8.24 was generated using
    four-point dithered PCF. While not quite as good as the 64-point sampled version
    shown previously in Figure 8.21, it renders considerably faster.


    ![](img/1695de1bc7486362f86c143285f3fb40_233_1.png)


