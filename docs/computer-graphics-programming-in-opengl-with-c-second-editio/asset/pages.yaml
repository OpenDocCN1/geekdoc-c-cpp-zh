- pgno: 60
  md: 'location to another. In this chapter, we will learn several useful transformation
    matrices:


    +   - *Translation*

    +   - *Rotation*

    +   - *Scale*

    +   - *Projection*

    +   - *Look-At*


    An important property of our transformation matrices is that they are all of size
    4x4. This is made possible by our decision to use the *homogeneous* notation.
    Otherwise, some of the transforms would be of diverse and incompatible dimensions.
    As we have seen, ensuring they are the same size is not just for convenience;
    it also makes it possible to combine them arbitrarily, and pre-compute groups
    of transforms for improved performance.


    # 3.4.1 Translation


    A *translation* matrix is used to move items from one location to another. It
    consists of an identity matrix, with the X, Y, and Z movement(s) given in locations
    A₀₃, A₁₃, A₂₃. Figure 3.3 shows the form of a translation matrix and its effect
    when multiplied by a homogeneous point; the result is a new point “moved” by the
    translate values.


    ![](img/1695de1bc7486362f86c143285f3fb40_60_0.png)


    Note that point (X,Y,Z) is translated (or moved) to location (X+Tₓ, Y+Tᵧ, Z+T𝓏)
    as a result of being multiplied by the translation matrix. Also note that multiplication
    is specified *right to left*.


    For example, if we wish to move a group of points upward 5 units along the positive
    Y direction, we could build a translation matrix by taking an identity matrix
    and placing the value 5 in the Tᵧ position. Then we simply multiply each of the
    points we wish to move by the matrix.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'There are several functions in GLM for building translation matrices and for
    multiplying points by matrices. Some relevant operations are:


    +   - `glm::translate(x, y, z)` — builds a matrix that translates by (x,y,z)

    +   - `mat4 * vec4`


    # 3.4.2 Scaling


    A scale matrix is used to change the size of objects or move points toward or
    away from the origin. Although it may initially seem strange to scale a point,
    objects in OpenGL are defined by groups of points. So, scaling an object involves
    expanding or contracting its set of points.


    The scale matrix transform consists of an identity matrix with the X, Y, and Z
    scale factors given in locations A₀₀, A₁₁, A₂₂. Figure 3.4 shows the form of a
    scale matrix and its effect when multiplied by a homogeneous point; the result
    is a new point modified by the scale values.


    ![](img/1695de1bc7486362f86c143285f3fb40_61_0.png)


    **Figure 3.4**

    Scale matrix transform.


    There are several functions in GLM for building scale matrices and multiplying
    points by scale matrix transforms. Some relevant operations are:


    +   - `glm::scale(x,y,z)` — builds a matrix that scales by (x,y,z)

    +   - `mat4 * vec4`


    Scaling can be used to switch coordinate systems. For example, we can use scale
    to determine what the left-hand coordinates would be, given a set of right-hand
    coordinates. From Figure 3.1, we see that negating the Z coordinate would toggle
    between right-hand and left-hand systems, so the scale matrix transform to accomplish
    this is:


    ![](img/1695de1bc7486362f86c143285f3fb40_61_1.png)'
