  md: "# 4.1 BUFFERS AND VERTEX ATTRIBUTES\n\nFor an object to be drawn, its vertices\
    \ must be sent to the vertex shader. Vertices are usually sent by putting them\
    \ in a buffer on the C++ side and associating that buffer with a vertex attribute\
    \ declared in the shader. There are several steps to accomplish this, some of\
    \ which only need to be done once, and some of which—if the scene is animated—must\
    \ be done at every frame:\n\nDone once—typically in init():\n\n+   1. create a\
    \ buffer\n+   2. copy the vertices into the buffer\n\nDone at each frame—typically\
    \ in display():\n\n+   1. enable the buffer containing the vertices\n+   2. associate\
    \ the buffer with a vertex attribute\n+   3. enable the vertex attribute\n+  \
    \ 4. use glDrawArrays(...) to draw the object\n\nBuffers are typically created\
    \ all at once at the start of the program, either in init() or in a function called\
    \ by init(). In OpenGL, a buffer is contained in a Vertex Buffer Object, or VBO,\
    \ which is declared and instantiated in the C++/OpenGL application. A scene may\
    \ require many VBOs, so it is customary to generate and then fill several of them\
    \ in init() so that they are available whenever your program needs to draw one\
    \ or more of them.\n\n![](img/1695de1bc7486362f86c143285f3fb40_82_0.png)\n\nA\
    \ buffer interacts with a vertex attribute in a specific way. When glDrawArrays()\
    \ is executed, the data in the buffer starts flowing, sequentially from the beginning\
    \ of the buffer, through the vertex shader. As described in Chapter 2, the vertex\
    \ shader executes once per vertex. A vertex in 3D space requires three values,\
    \ so an appropriate vertex attribute in the shader to receive these three values\
    \ would be of type vec3. Then, for each three values in the buffer, the shader\
    \ is invoked, as illustrated in Figure 4.1.\n\n**Figure 4.1**  \nData transmission\
    \ between a VBO and a vertex attribute."
  merge: -1
  img_proc: true
