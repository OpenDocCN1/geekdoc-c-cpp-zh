    As described in Chapter 1, there are a number of installation and setup steps
    that must be accomplished in order to use OpenGL and C++ on your machine. These
    steps vary depending on which platform you wish to use. The code samples in this
    book are designed to be run as-given on a PC (Windows); this Appendix provides
    setup instructions for the Windows platform. Libraries and tools change frequently,
    so these steps may become outdated. We maintain updated installation and setup
    instructions at: http://ecs.csus.edu/~gordonsv/textC2E.html.


    # ## A.1 INSTALLING THE LIBRARIES AND DEVELOPMENT ENVIRONMENT


    # ### A.1.1 Installing the Development Environment


    Since we implement several projects throughout the course of the book, and because
    there are so many libraries to coordinate in OpenGL, it will be useful to set
    up our C++ development environment in such a way as to minimize the number of
    configuration steps needed for each new project we create. Here, we will assume
    that *Visual Studio 2019* [VS20] is being used; similar steps may be possible
    for other IDEs.


    The first step is to download and install Visual Studio 2019 on your machine.
    Once this is done, our approach will be to install as many libraries as possible
    in a single shared location, and then create a Visual Studio *custom template*
    so that each new project we create will already have the necessary libraries and
    dependencies in place without having to be redefined. We describe creating such
    a template in Section A.2.1.'
