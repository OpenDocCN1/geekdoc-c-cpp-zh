- pgno: 110
  md: "Here is the sequence of steps for the “planet”:\n\n+   - `push()` This will\
    \ be the portion of the planet’s MV matrix that will also affect children.\n+\
    \   - `translate(...)` To incorporate the planet movement around the sun into\
    \ the planet’s MV matrix. In this example we use trigonometry to calculate the\
    \ planet movement as a translation.\n+   - `push()` This will be the planet’s\
    \ complete MV matrix, also including its axis rotation.\n+   - `rotate(...)` To\
    \ incorporate the planet’s axis rotation (this will later be popped and not affect\
    \ children).\n+   - `glm::value_ptr(mvStack.top())` To obtain the MV matrix and\
    \ then send it to the MV uniform.\n+   - Draw the planet.\n+   - `pop()` This\
    \ removes the planet MV matrix off the stack, exposing underneath it an earlier\
    \ copy of the planet MV matrix that doesn't include the planet’s axis rotation\
    \ (so that only the planet’s translation will affect the moon).\n\nWe now can\
    \ write the complete display() routine, shown in Program 4.4.\n\n# *Program 4.4\
    \ Simple Solar System Using Matrix Stack*\n\n```\n~~~cpp\nstack<glm::mat4> mvStack;\n\
    void display(GLFWindow* window, double currentTime) {\n    // setup of background,\
    \ depth buffer, rendering program, and proj matrices unchanged\n    ...\n    //\
    \ push view matrix onto the stack\n    vMat = glm::translate(glm::mat4(1.0f),\
    \ glm::vec3(-cameraX, -cameraY, -cameraZ));\n    mvStack.push(vMat);\n\n    //\
    \ ---------------------- pyramid == sun ----------------------------------\n \
    \   mvStack.push(mvStack.top());\n    mvStack.top() *= glm::translate(glm::mat4(1.0f),\
    \ glm::vec3(0.0f, 0.0f, 0.0f));  // sun position\n    mvStack.push(mvStack.top());\n\
    \    mvStack.top() *= glm::rotate(glm::mat4(1.0f), (float)currentTime, glm::vec3(1.0f,\
    \ 0.0f, 0.0f));  // sun rotation\n    glUniformMatrix4fv(mvLoc, 1, GL_FALSE, glm::value_ptr(mvStack.top()));\n\
    \    glBindBuffer(GL_ARRAY_BUFFER, vbo[1]);\n~~~\n```"
