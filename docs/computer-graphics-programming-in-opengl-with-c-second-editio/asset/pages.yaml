  md: 'Suppose we use Blender to build a simple pyramid such as the one we developed
    for Program 4.3. Figure 6.14 is a screenshot of a similar pyramid being created
    in Blender:


    ![](img/1695de1bc7486362f86c143285f3fb40_167_0.png)


    **Figure 6.14**

    Pyramid built in Blender.


    In Blender, if we now *export* our pyramid model, specify the .obj format, and
    also set Blender to output texture coordinates and vertex normals, an OBJ file
    is created that includes all of this information. The resulting OBJ file is shown
    in Figure 6.15. (The actual values of the texture coordinates can vary depending
    on how the model is built.)


    We have color-coded the important sections of the OBJ file for reference. The
    lines at the top beginning with “#” are comments placed there by Blender, which
    our importer ignores. This is followed by a line beginning with “o” giving the
    name of the object. Our importer can ignore this line as well. Later, there is
    a line beginning with “s” that specifies that the faces shouldn’t be smoothed.
    Our code will also ignore lines starting with “s”.


    The first substantive set of lines in the OBJ file are those starting with “v”,
    colored blue. They specify the X, Y, and Z local spatial coordinates of the five
    vertices of our pyramid model relative to the origin, which in this case is at
    the center of the pyramid.'
