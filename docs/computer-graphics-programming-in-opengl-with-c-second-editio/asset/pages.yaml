- pgno: 474
  md: "A third approach for handling colored planes is to convert the colors from\
    \ an RGB color model to an RYB subtractive model based on primary colors red/yellow/blue.\
    \ Precise algorithms for doing this tend to be complex. Sugita and Takahashi [ST15]\
    \ described a surprisingly simple algorithm for converting between RGB and RYB\
    \ that isn't perfect but works pretty well across the color spectrum. Program\
    \ 16.16 shows GLSL implementations of their conversion functions, which may be\
    \ practical for many cases.\n\n# ## Program 16.16 – Blending via Conversion to\
    \ RYB\n\n# ### Compute Shader\n\n```\n```glsl\n...\nvoid process_stack_element(int\
    \ index)\n{\n    // during phase 4 blending:\n    if ((objects[index].object_index).isTransparent)\n\
    \    {\n        vec3 mixedRYB = rgb2ryb(mixed_color);\n        vec3 refractedRYB\
    \ = rgb2ryb(refracted_color);\n        mixed_color = ryb2rgb(mixedRYB + refractedRYB);\n\
    \    }\n    ...\n}\n\nvec3 rgb2ryb(vec3 rgb)\n{\n    float white = min(rgb.r,\
    \ min(rgb.g, rgb.b)); // compute white and black contributions for input color\n\
    \    float black = min((1-rgb.r), min((1-rgb.g), (1-rgb.b))); // assumes colors\
    \ are clamped to the range [0, 1]\n    vec3 rgbWhiteRemoved = rgb - white; //\
    \ remove white from input color before converting to RYB\n\n    // build initial\
    \ RYB values for the output color\n    vec3 buildRYB = vec3(\n        rgbWhiteRemoved.r\
    \ - min(rgbWhiteRemoved.r, rgbWhiteRemoved.g),\n        (rgbWhiteRemoved.g + min(rgbWhiteRemoved.r,\
    \ rgbWhiteRemoved.g)) / 2.0,\n        (rgbWhiteRemoved.b + rgbWhiteRemoved.g -\
    \ min(rgbWhiteRemoved.r,\n            rgbWhiteRemoved.g)) / 2.0);\n\n    float\
    \ normalizeFactor = max(buildRYB.x, max(buildRYB.y, buildRYB.z))\n        / max(rgbWhiteRemoved.r,\
    \ max(rgbWhiteRemoved.g, rgbWhiteRemoved.b));\n    buildRYB /= normalizeFactor;\
    \          // normalize for similar white level\n    buildRYB += black;      \
    \              // normalize for similar black level\n    return buildRYB;\n}\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 475
  md: "```\n```cpp\nvec3 ryb2rgb(vec3 ryb)\n{\n    float white = min(ryb.x, min(ryb.y,\
    \ ryb.z)); // compute white and black contributions for input color\n    float\
    \ black = min((1-ryb.x), min((1-ryb.y), (1-ryb.z)));\n    vec3 rybWhiteRemoved\
    \ = ryb - white; // remove white from input color before converting to RGB\n\n\
    \    // build initial RGB values for the output color\n    vec3 buildRGB = vec3(\n\
    \        rybWhiteRemoved.x + rybWhiteRemoved.y - min(rybWhiteRemoved.y, rybWhiteRemoved.z),\n\
    \        rybWhiteRemoved.y + 2.0 * min(rybWhiteRemoved.y, rybWhiteRemoved.z),\n\
    \        2.0 * rybWhiteRemoved.z - min(rybWhiteRemoved.y, rybWhiteRemoved.z));\n\
    \n    float normalizeFactor = max(buildRGB.r, max(buildRGB.g, buildRGB.b))\n \
    \       / max(rybWhiteRemoved.x, max(rybWhiteRemoved.y, rybWhiteRemoved.z));\n\
    \    buildRGB /= normalizeFactor;        // normalize for similar white level\n\
    \    buildRGB += black;                  // normalize for similar black level\n\
    \    return buildRGB;\n}\n…\n```\n```\n\nThe functions that convert between RGB\
    \ and RYB are named rgb2ryb() and ryb2rgb(). They both start by computing the\
    \ amount of white and black in the input color, as minimum distance from [0,0,0]\
    \ and [1,1,1] for any of the three color channels (R, G, B, or R, Y, B). They\
    \ then remove the white portion in all three channels. They each then build equivalent\
    \ values for each of the three channels of the other color model. The approach\
    \ is based on a proposed subtractive RYB color model where white = [0,0,0], black\
    \ = [1,1,1], red = [1,0,0], yellow = [0,1,0], blue = [0,0,1], green = [0,1,1],\
    \ purple = [1,0, .5], and aqua = [0, .5, 1]. The code for constructing the vectors\
    \ buildRGB and buildRYB utilizing these proposed colors is based on the equations\
    \ derived by Sugita and Takahashi and not detailed here. Finally, the result is\
    \ normalized to generate similar white and black levels as the original input\
    \ color.\n\nThe color palette proposed by Sugita and Takahashi is designed to\
    \ be subtractive, and like CMY, its white and black definitions are reversed from\
    \ the RGB model. Blending colors is again done by simply adding them together,\
    \ as shown in the changes to the process_stack_element() function in Program 16.16.\n\
    \nThe results are shown in Figure 16.28 for the same three scenarios as shown\
    \ in Figure 16.27 (that is, the red/yellow/blue, red/green/blue, and magenta/yellow/cyan\
    \ panes). In each case, the colors of the panes were defined in RGB as described\
    \ in Program 16.13, converted to RYB using the rgb2ryb() function from Program\
    \ 16.16,"
