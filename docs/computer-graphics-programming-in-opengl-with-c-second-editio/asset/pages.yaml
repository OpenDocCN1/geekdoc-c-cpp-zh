  md: '![](img/1695de1bc7486362f86c143285f3fb40_228_0.png)


    Another common error is *jagged shadow edges*. This can happen when the shadow
    being cast is significantly larger than the shadow buffer can accurately represent.
    This usually depends on the location of the objects and light(s) in the scene.
    In particular, it commonly occurs when the light source is relatively distant
    from the objects involved. An example is shown in Figure 8.15.


    Eliminating jagged shadow edges is not as simple as for the previous artifacts.
    One technique is to move the light position closer to the scene during pass one,
    and then return it to the correct position in pass two. Another approach that
    is often effective is to employ one of the “soft shadow” methods that we will
    discuss next.


    # 8.7 SOFT SHADOWS


    The methods presented thus far are limited to producing *hard shadows*. These
    are shadows with sharp edges. However, most shadows that occur in the real world
    are *soft shadows*. That is, their edges are blurred to various degrees. In this
    section, we will explore the appearance of soft shadows as they occur in the real
    world and then describe a commonly used algorithm for simulating them in OpenGL.


    # 8.7.1 Soft Shadows in the Real World


    There are many causes of soft shadows, and there are many types of soft shadows.
    One thing that commonly causes soft shadows in nature is that real-world light
    sources are rarely points—more often they occupy some area. Another cause is the
    accumulation of imperfections in materials and surfaces, and the role that the
    objects themselves play in generating ambient light through their own reflective
    properties.


    ![](img/1695de1bc7486362f86c143285f3fb40_228_1.png)


    Figure 8.16 shows a photograph of an object casting a soft shadow on a table top.
    Note that this is not a 3D'
