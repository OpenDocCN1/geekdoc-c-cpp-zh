- pgno: 319
  md: "# ## 13.2 ALTERING PRIMITIVES\n\nGeometry shaders are convenient for changing\
    \ the shape of an object when that change can be effected through isolated changes\
    \ to the primitives (typically triangles).\n\nConsider, for example, the torus\
    \ we rendered previously in Figure 7.12. Suppose that torus represented an inner\
    \ tube (such as for a tire), and we want to “inflate” it. Simply applying a scale\
    \ factor in the C++/OpenGL code won’t accomplish this, because its fundamental\
    \ shape wouldn’t change. Giving it the appearance of being “inflated” requires\
    \ also making the inner hole smaller as the torus stretches into the empty center\
    \ space.\n\nOne way of doing this would be to add the surface normal vector to\
    \ each vertex. While it is true that this could be done in the vertex shader,\
    \ let’s do it in the geometry shader, for practice. Program 13.1 shows the GLSL\
    \ geometry shader code. The other modules are the same as for Program 7.3, with\
    \ a few minor changes: the fragment shader input names now need to reflect the\
    \ geometry shader outputs (for example, varyingNormal becomes varyingNormalG),\
