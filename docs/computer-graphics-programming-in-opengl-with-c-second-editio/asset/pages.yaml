    $$


    A point on the curve would then be:


    $$P(t) = tp_{12-23}(t) + (1-t)p_{01-12}(t)$$


    Substituting the definitions of $p_{12-23}$ and $p_{01-12}$ and collecting terms
    yields:


    $$P(t) = \sum_{i=0}^3 p_i B_i(t)$$


    where:


    $$

    B_0(t) = (1-t)^3

    B_1(t) = 3t^3 - 6t^2 + 3t

    B_2(t) = -3t^3 + 3t^2

    B_3(t) = t^3

    $$


    There are many different techniques for rendering Bézier curves. One approach
    is to iterate through successive values of $t$, starting at 0.0 and ending at
    1.0, using a fixed increment. For instance, if the increment is 0.1, then we could
    use a loop with $t$ values 0.0, 0.1, 0.2, 0.3, and so on. For each value of $t$,
    the corresponding point on the Bézier curve would be computed, and a series of
    line segments connecting the successive points would be drawn, as described in
    the algorithm in Figure 11.5.


    Another approach is to use de Casteljau''s algorithm to *recursively subdivide*
    the curve in half, where $t=\frac{1}{2}$ at each recursive step. Figure 11.6 shows
    the left side subdivision into new cubic control points $(q_0, q_1, q_2, q_3)$
    shown in green, as derived by de Casteljau (a full derivation can be found in
    [AS14]).


    The algorithm is shown in Figure 11.7. It subdivides the curve segments in half
    repeatedly, until each curve segment is sufficiently straight enough that further
    subdivision produces no tangible benefit. In the limiting case (as the control
    points are generated closer and closer together), the curve segment itself is
    effectively the same as a straight line between the first and last control points
    $(q_0$ and $q_3)$. Determining whether a curve segment is "straight enough" can
    therefore be done'
