    # ### 4.6.1 Instancing


    *Instancing* provides a mechanism for telling the graphics card to render multiple
    copies of an object using only a single C++/OpenGL call. This can result in a
    significant performance benefit, particularly when there are thousands or millions
    of copies of the object being drawn—such as when rendering many flowers in a field,
    or many zombies in an army.


    We start by changing the glDrawArrays() call in our C++/OpenGL application to
    glDrawArraysInstanced(). Now, we can ask OpenGL to draw as many copies as we want.
    We can specify drawing 24 cubes as follows:


    ```

    glDrawArraysInstanced(GL_TRIANGLES, 0, 36, 24);

    ```


    When using instancing, the vertex shader has access to a built-in variable gl_InstanceID,
    an integer that refers to which numeric instance of the object is currently being
    processed.


    To replicate our previous tumbling cubes example using instancing, we will need
    to move the computations that build the different model matrices (previously inside
    a loop in display()) into the vertex shader. Since GLSL does not provide translate
    or rotate functions, and we cannot make calls to GLM from inside a shader, we
    will need to use the utility functions from Program 3.1. We will also'
  merge: -1
  img_proc: true
- pgno: 100
  md: "need to pass the “time factor” from the C++/OpenGL application to the vertex\
    \ shader in a uniform. We also need to pass the view matrix in its own uniform\
    \ variable because the rotation computations have been moved to the vertex shader.\
    \ The revisions, including those in the C++/OpenGL application and those in the\
    \ new vertex shader, are shown in Program 4.2.\n\n# ### Program 4.2 Instancing\
    \ — Twenty-Four Animated Cubes\n\nVertex Shader:\n\n```\n```glsl\n#version 430\n\
    layout (location=0) in vec3 position;\nuniform mat4 v_matrix;\nuniform mat4 proj_matrix;\n\
    uniform float tf;            // time factor for animation and placement of cubes\n\
    \nout vec4 varyingColor;\n\nmat4 buildRotateX(float rad);    // declaration of\
    \ matrix transformation utility functions\nmat4 buildRotateY(float rad);    //\
    \ (GLSL requires functions to be declared prior to invocation)\nmat4 buildRotateZ(float\
    \ rad);\nmat4 buildTranslate(float x, float y, float z);\n\nvoid main(void)\n\
    {  float i = gl_InstanceID + tf;      // value based on time factor, but different\
    \ for each cube instance\n   float a = sin(2.0 * i) * 8.0;      // these are the\
    \ x, y, and z components for the translation, below\n   float b = sin(3.0 * i)\
    \ * 8.0;\n   float c = sin(4.0 * i) * 8.0;\n\n   // build the rotation and translation\
    \ matrices to be applied to this cube's model matrix\n   mat4 localRotX = buildRotateX(1000*i);\n\
    \   mat4 localRotY = buildRotateY(1000*i);\n   mat4 localRotZ = buildRotateZ(1000*i);\n\
    \   mat4 localTrans = buildTranslate(a,b,c);\n\n   // build the model matrix and\
    \ then the model-view matrix\n   mat4 newM_matrix = localTrans * localRotX * localRotY\
    \ * localRotZ;\n   mat4 mv_matrix = v_matrix * newM_matrix;\n\n   gl_Position\
    \ = proj_matrix * mv_matrix * vec4(position,1.0);\n   varyingColor = vec4(position,1.0)\
    \ * 0.5 + vec4(0.5, 0.5, 0.5, 0.5);\n}\n```\n```"
