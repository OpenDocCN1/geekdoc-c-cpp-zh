- "# Arduino 编程：Sketch 入门指南，第二版 (Tab)\n\n\n\n\n\nMcGraw-Hill Education 图书提供特殊批量折扣，可作为赠品和销售促销品或用于企业培训计划。如需联系代表，请访问\
  \ [www.mheducation.com](http://www.mheducation.com) 上的“联系我们”页面。\n\n\n\n\n\n\n\n\
  本书采用无酸纸印刷制。\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 关于作者\n\n**Simon Monk** 拥有控制论与计算机科学学士学位以及软件工程博士学位。从学生时代起，他一直是活跃的电子爱好者，也是爱好电子杂志的偶尔作者。Monk\
  \ 博士还编写了约 20 本关于 Maker 和电子主题的书，特别是关于 Arduino 和树莓派。你可以在 [`simonmonk.org`](http://simonmonk.org)\
  \ 了解更多关于他的书籍信息。你也可以在 Twitter 上关注他，账号是 @simonmonk2。\n\n## 前言\n\n本书的第一版于 2011 年 11\
  \ 月出版，曾是 Amazon 上 Arduino 排名最高的书籍。\n\n在本书最初撰写时，当时的 Arduino 型号是 Arduino 2009，软件版本为\
  \ Beta018。几乎在书籍到店时，Arduino Uno 和 Arduino 软件 1.0 版本发布了。不久后，本书的第二次印刷进行了小幅更新以适应新的开发板和软件，但并未正式成为第二版。本版将书籍完全更新到最新，并基于\
  \ Arduino 1.6。\n\nArduino Uno R3 仍然认为是标准的 Arduino 开发板。然而，许多其他开发板，包括官方 Arduino 开发板（如\
  \ Leonardo、Zero、101、Due 和 Yun）以及其他基于 Arduino 编程语言的设备（如 Photon 和 Intel Edison）也相继出现。\n\
  \n本版还涉及 Arduino 在物联网（IoT）项目中的应用，以及各种显示器（包括 OLED 和 LCD）的使用。\n\nSimon Monk\n\n## 致谢\n\
  \n感谢 Linda 给我时间、空间和支持来写这本书，并忍受我的项目在家里制造的各种混乱。\n\n非常感谢 Robert “BobKat” Logan 以及许多其他眼光敏锐且乐于帮助的人，他们报告了第一版的错误。我已尽力修复了你们发现的问题。\n\
  \n最后，我想感谢 Michael McCabe、Srishti Malasi 以及所有参与本书制作的同事。与这样一个优秀的团队工作是一件荣幸。\n\n## 引言\n\
  \nArduino 接口板为创建基于微控制器的项目提供了一种低成本、易于使用的技术。通过一点电子知识，你就可以让你的 Arduino 做任何事情，从控制艺术装置中的灯光到管理太阳能系统的电源。\n\
  \n有很多基于项目的书籍可以教你如何将事物连接到 Arduino，包括本书作者编写的《邪恶天才的 30 个 Arduino 项目》（30 Arduino Projects\
  \ for the Evil Genius）。然而，本书的重点在于编程 Arduino。\n\n本书将解释如何让 Arduino 编程变得简单有趣，避免经常困扰项目的各种配合代码带来的困难。你将一步步了解编程\
  \ Arduino 的过程，从 C 语言的基础知识开始。\n\n### 那么，什么是 Arduino？\n\nArduino 是一个小型微控制器开发板，带有通用串行总线（USB）接口连接计算机，并有许多可以连接到电机、继电器、光传感器、激光二极管、麦克风等外部设备的插座。它们可以通过\
  \ USB、9V 电池或电源供电。它们可以从计算机控制或进行编程，然后独立运行。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n[www.arduinobook.com](http://www.arduinobook.com)\n\
  \n你可以在那里找到书中使用的所有源代码以及其他资源，例如勘误表（errata）。\n\n\n本章是 Arduino 的介绍，包括 Arduino 的历史和背景，以及硬件概述。\n\
  你 Arduino 的核心是一个微控制器。开发板上的几乎所有其他部分都是为了给开发板供电，并允许它与你的桌面电脑进行通信。\n\n输入可以读取数字（开关是开启还是关闭？）和模拟（引脚处的电压是多少？）信号。这为连接许多不同类型的传感器（用于光、温度、声音等）提供了机会。\n\
  \n\n输入可以读取数字（开关是开启还是关闭？）和模拟（引脚处的电压是多少？）信号。这为连接许多不同类型的传感器（用于光、温度、声音等）提供了机会。\n\n\n\
  输入可以读取数字（开关是开启还是关闭？）和模拟（引脚处的电压是多少？）信号。这为连接许多不同类型的传感器（用于光、温度、声音等）提供了机会。\n\n本章是对 Arduino\
  \ 的介绍，包括 Arduino 的历史和背景以及硬件概述。\n\n\n微控制器实际上是一个芯片上的微型计算机。它拥有比第一代家用计算机的一切，甚至更多。它有一个处理器、几千或两千字节的随机访问存储器（RAM）用于存储数据、几千字节的可擦除可编程只读存储（EPROM）或闪存用于存储你的程序，并且还有输入和输出引脚。这些输入/输出（I/O）引脚将微控制器与你电子设备的其余部分连接起来。\n\
  \n输出也可以是模拟或数字的。因此，你可以设置一个引脚开启或关闭（0 伏或 5 伏），这可以直接开启或关闭发光二极管（LED），或者你可以使用输出控制更高功率的设备，如电机。这就是物理计算。由于\
  \ Arduino 可以 USB 线连接到你的电脑，这意味着你可以使用 Arduino 作为接口板从你的电脑控制这些相同的电子设备。\n\n*(注：由于提供的文本中存在大量段落重复，译文已根据指令“不要重复输出原文”的原则进行了去重处理，仅保留逻辑完整的翻译内容。)*\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n你可以在那里找到书中使用的所有源代码以及其他资源，例如勘误表。\nArduino 是一个微控制器平台，它激发了电子爱好者的想象。它的易用性和开源特性使其成为任何想要构建电子项目的人的极佳选择。\n\
  \n\n输入可以读取数字（开关是开启还是关闭？）和模拟（引脚处的电压是多少？）信号。这为连接许多不同类型的传感器（用于光、温度、声音等）提供了机会。\n\n\n\
  所有微控制器制造商（包括制作 Arduino 板用微控制器的 Atmel）也提供它们自己的开发板和编程软件。虽然这些通常很便宜，但它们往往面向专业电子工程师而非爱好者。这意味着此类开发板和软件可能更难使用，并且在从中获得任何用之前需要更大的学习投入。\n\
  \n\n\n\n\n### 电源连接\n接下来，让我们看看图 1-1 底部的连接器。你可以阅读连接器旁边的连接名称。我们感兴趣的连接器是 `Reset`。它的功能与\
  \ Arduino 上的 `Reset` 按钮相同。就像重启电脑 一样，使用 `Reset` 连接器会重置微控制器，使其从开始运行程序。要使用 `Reset`\
  \ 连接器重置微控制器，你只需临时将此引脚设置为低电平（将其连接到 `0V`）。\n\n尽管这些输入被标记为模拟，并且默认是模拟输入，但这些连接也可以作为数字输入或输出。\n\
  \n### 微控制器\n\n微控制器上方是一个微小的银色矩形元件。这是一个晶体振荡器。它每秒跳动 1600 万次，在每次跳动中，微控制器可以执行一个操作。在板左上角是\
  \ `Reset` 开关。点击此开关会向微控制器发送逻辑脉冲，导致微控制器重启并清除其内存。注意，存储在设备上的任何程序将被保留。Arduino 板的右边缘是\
  \ USB 接口芯片。该芯片将 USB 标准使用的电平转换为 Arduino 板上可以直接使用的电平。\n\nArduino 成功的另一个关键因素是所有 Arduino\
  \ 设计都以知识共享许可免费开放。这使得许多廉价的替代板出现。只有 Arduino 名称受保护，因此此类克隆板通常带有“duino”的名字，例如 `Boarduino`、`Seeeduino`\
  \ 和 `Freeduino`。2014 年，原始团队与其主要制造商之间发生了分歧。这次分裂的结果之一是在美国境外，Arduino Uno 被称为 `Genuino`。\n\
  \nArduino Leonardo (图 1-4) 是另一个流行的 Arduino 板选择，在大多数情况下可以替代 Arduino Uno。它比 Uno 稍微便宜，并且与\
  \ Uno 具有相同的连接。它的处理器芯片焊接在板上，因此无法移除（就像你可以移除 Uno 的处理器那样）。它的成本较低部分原因是使用了集成了 USB 接口的处理器，而不是像\
  \ Uno 那样需要单独的芯片。\n\n额外的连接器排列在板的末端。Mega 提供的额外功能包括：\n\n图 1.5 *Arduino Due 板板*。\n\n\
  像 Micro 这样的小板的缺点是，由于它们比 Uno 小得多，因此无法接受 Uno 尺寸的扩展板。\n\n之前描述的 Arduino 板是最实用且最流行的。然而，Arduino\
  \ 板的范围在不断变化，因此要获取 Arduino 家族完整且最新的视图，请参阅 Arduino 官方网站的列表：[www.arduino.cc/en/Main/Hardware](http://www.arduino.cc/en/Main/Hardware)。\n\
  \n\n你可以在 `if` 语句中将这些运算符组合成布尔表达式，如下例所示：\n\n```\n int x = 1234; \n  EEPROM.write(0,\
  \ highByte(x));\n  EEPROM.write(1, lowByte(x));\n```\n\n`highByte` 和 `lowByte` 函数对于将\
  \ `int` 分拆为两个字节非常有用。图 8-1 显示了此 `int` 实际上是如何存储在 `EEPROM` 中的。\n\n![image](img/fig-ch8-1.jpg)\n\
  \n图 8.1. *在 EEPROM 中存储 16 位整数*。\n\n要从 `EEPROM` 读回 `int`，你需要从 `EEPROM` 读取两个字节并重构\
  \ `int`，如下：\n\n```\nbyte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\nint\
  \ x = (high << 8) + low;\n```\n\n`<<` 运算符是一个位移运算符，它将高位字节移动到 `int` 的顶部，然后加上低字节。\n\
  \n#### 使用 AVR EEPROM 库\n\n如果你只使用单字节，使用 `EEPROM` 的官方 Arduino 方法完全可以。但是，正如你在 `ints`\
  \ 中看到的那样，对于较大的数据类型，这变得更加复杂。对于浮点数（4 字节）更糟。幸运的是，有一种替代方法，使用了 Arduino 本身使用的库之一，称为 `AVR\
  \ EEPROM` 库。这允许你使用单个命令读写能够放入你的 `EEPROM` 的所有数据。\n\nsketch 8-03 示例使用此库写入并读取一个 `int`。\n\
  \n```\n// sketch 08-03\n\n#include <avr/eeprom.h>\n\nvoid setup() \n{\n  Serial.begin(9600);\n\
  \  int i1 = 123;\n  eeprom_write_block(&i1, 0, 2);\n  int i2 = 0;\n  eeprom_read_block(&i2,\
  \ 0, 2);\n  Serial.println(i2);\n}\n\nvoid loop() \n{\n}\n```\n\n该库实际上包含在 Arduino\
  \ 中，因此 `eeprom_write_block` 和 `eeprom_read_block` 函数允许你高效地读写数据。\n\n#### 在 EEPROM\
  \ 中存储浮点数\n\n如果你只使用单字节，使用 `EEPROM` 的官方 Arduino 方法没问题。但是，正如你在 `ints` 中看到的那样，对于较大的数据类型，这变得更加复杂。对于浮点数（4\
  \ 字节）更糟。幸运的是，有一种替代方法，使用了 Arduino 本身使用的库之一，称为 `AVR EEPROM` 库。这允许你使用单个命令读写能够放入你的 `EEPROM`\
  \ 的所有数据。\n\n\n\n\n在写入 `EEPROM` 时，请记住即使上传新的程序（sketch）也不会清除 `EEPROM`，因此其中可能留有来自上一个项目的遗留值。程序\
  \ 8-06 会将 `EEPROM` 的所有内容重置为零：\n\n```\n// sketch 8-06\n#include <EEPROM.h>\n\nvoid\
  \ setup()                 \n{\n  Serial.begin(9600);\n  Serial.println(\"Clearing\
  \ EEPROM\")a;\n  for (int i = 0; i < 1024; i++)\n  {\n    EEPROM.write(i, 0);\n\
  \  }\n  Serial.println(\"EEPROM Cleared\");\n}\n\nvoid loop()                  \
  \  \n{\n}\n```\n\n此外请注意，`EEPROM` 单元只能写入大约 100,000 次后就会变得不可靠。因此，只有在确实需要时才向 `EEPROM`\
  \ 写回值。`EEPROM` 的速度也非常慢，写入一个字节大约需要 3 毫秒。\n\n***\n\n### 压缩\n\n在将数据保存到 `EEPROM` 或使用\
  \ `PROGMEM` 时，有时会发现需要保存的数据比可用空间多。当这种情况发生时，寻找表示数据最高效的方法是值得的。\n\n#### 范围压缩\n\n你可能有某个值，从表面上看你需要一个\
  \ 16 位的 `int` 或 `float`。例如，为了表示摄氏度温度，你可能会使用像 20.25 这样的 `float` 值。当你将其存入 `EEPROM`\
  \ 时，如果能将其放入单个字节，生活将简单得多，而且存储容量是使用 `float` 的两倍。\n\n实现此点的一种方法是在存储之前更改数据。记住，一个字节允许你存储\
  \ 0 到 255 之间的正数。所以，如果你只关心接近摄氏度的温度，那么你可以简单地将 `float` 转换为 `int` 并舍弃小数部分。下面的示例显示了如何操作：\n\
  \n```\nint tempInt = (int)tempFloat;\n```\n\n变量 `tempFloat` 包含浮点值。`(int)` 命令被称为*类型转换*（type\
  \ cast），用于将变量从一种类型转换为另一种兼容的类型。在这种情况下，类型转换将（例如）20.25 的 `float` 转换为 `int`，这会将数字截断为\
  \ 20。\n\n如果你知道关心的最高温度是 60 摄氏度，最低温度是 0 摄氏度，那么你可以在转换为字节并保存之前，将每个温度乘以 4。然后当从 `EEPROM`\
  \ 读取数据时，可以除以 4 以得到一个精度为 0.25 度的值。\n\n下面的代码示例（程序 8-07）将此类温度保存到 `EEPROM`，然后将其读取并显示在串口监视器中作为证明：\n\
  \n```\n//sketch 8-07\n\n#include <EEPROM.h>\n\nvoid setup()\n{\n  float tempFloat\
  \ = 20.75;\n  byte tempByte = (int)(tempFloat * 4);\n  EEPROM.write(0, tempByte);\n\
  \n  byte tempByte2 = EEPROM.read(0);\n  float temp2 = (float)(tempByte2) / 4;\n\
  \  Serial.begin(9600);\n  Serial.println(\"\\n\\n\\n\");\n  Serial.println(temp2);\n\
  }\n\nvoid loop(){}\n```\n\n还有其他压缩数据的方法。例如，如果你读取的是变化缓慢的读数——再次，温度变化是一个很好的例子——那么你可以以全分辨率记录第一个温度，然后只记录自上一次读取的温度变化。这种变化通常很小，占用的字节更少。\n\
  \n***\n\n### 结论\n\n你现在已经了解了一些如何在断电后让数据保留。在下一章中，你将学习显示器。\n\n## 9\n\n## 显示器\n\n在本章中，你将学习编写软件来控制显示器。图\
  \ 9-1 显示了将使用的两种显示器。第一种字母 LCD 显示器扩展板。第二是 128 × 64 像素的 OLED（有机发光二极管）图形显示器。这两种显示器对于\
  \ Arduino 非常流行。\n\n![image](img/fig-ch9-1.jpg)\n\n图 9.1 *字母 LCD 扩展板（左）和 OLED 显示器（右）*。\n\
  \n这是一本关于软件而非硬件的书，但在本章中，我们必须稍微解释一下这些显示器电子设备的工作原理，以便你理解如何驱动它们。\n\n***\n\n### 字母 LCD\
  \ 显示器\n\n我们使用的 LCD 模块是一个 Arduino 扩展板，可以直接插在 Arduino 板的顶部。除了显示之外，它还有一些按钮。有许多不同的扩展板，但几乎所有的扩展板都使用相同的\
  \ LCD 控制芯片（HD44780），因此寻找使用此控制器芯片的扩展板。\n\n我使用了用于 Arduino 的 DFRobot LCD Keypad Shield。这个由\
  \ DFRobot（[www.robotshop.com](http://www.robotshop.com)）提供的模块价格便宜，并提供了一个 16 字符 2\
  \ 行的 LCD 显示器，并带有 6 个推按键。\n\n我们使用的 LCD 模块是一个 Arduino 扩展板，可以直接插在 Arduino 板的顶部。除了显示之外，它还有一些按钮。有许多不同的扩展板，但几乎所有的扩展板都使用相同的\
  \ LCD 控制芯片（HD44780），因此寻找使用此控制器芯片的扩展板。\n\n我使用了用于 Arduino 的 DFRobot LCD Keypad Shield。这个由\
  \ DFRobot（[www.robotshop.com](http://www.robotshop.com)）提供的模块价格便宜，并提供了一个 16 字符 2\
  \ 行的 LCD 显示器，并带有 6 个推按键。\n\n\n\n\n大部分操作都在 `loop` 函数中进行，该函数检查来自串口监视器的任何输入字符。该程序（sketch）一次处理一个字符。\n\
  \n除了程序会简单字符的普通字符外，还有几个特殊字符。如果字符是 `#`，则程序将清除整个显示器；如果字符是 `/`，程序将移动到第二行。否则，程序将直接使用\
  \ `write` 在当前光标位置显示该字符。`write` 函数类似于 `print`，但它只打印单个字符，而不是字符字符串。\n\n* *\n\n### 使用显示器\n\
  \n尝试将程序 9-01 上传到板上，然后连接上扩展板（shield）。请注意，在插入扩展板之前，您应该始终拔掉 Arduino 板，以确保其处于关闭状态。\n\
  \n打开串口监视器并尝试输入图 9-3 所示的文本。\n\n![image](img/fig-ch9-3.jpg)\n\n图 9.3 *向显示器发送命令*。\n\
  \n* *\n\n### 其他 LCD 库函数\n\n除了你在示例中使用的函数外，还有许多其他你可以使用的函数：\n\n♦ `home` 等于 `setCursor(0,0)`：它将光标移动到左上角。\n\
  \n♦ `cursor` 显示光标。\n\n♦ `noCursor` 指定不显示光标。\n\n♦ `blink` 让光标闪烁。\n\n♦ `noBlink` 停止光标闪烁。\n\
  \n♦ `noDisplay` 关闭显示器，但不移除内容。\n\n♦ `display` 在执行 `noDisplay` 后重新开启显示器。\n\n♦ `scrollDisplayLeft`\
  \ 将显示器上的所有文本向左移动一个位置。\n\n♦ `scrollDisplayRight` 将显示器上的所有文本向右移动一个位置。\n\n♦ `autoscroll`\
  \ 激活一种模式，在该模式下，当光标处添加新字符时，现有文本将根据 `leftToRight` 和 `rightToLeft` 函数的方向移动。\n\n♦ `noAutoscroll`\
  \ 关闭 `autoscroll` 模式。\n\n* *\n\n### OLED 图形显示器\n\nOLED（有机光二极管）显示器明亮且清晰，正在快速取代消费电器中的\
  \ LCD 显示器。这里描述的 OLED 类型使用名为 `I2C` 的接口总线并有一个名为 `SD1306` 的驱动芯片。你可以在 eBay、Adafruit\
  \ 以及网络上的许多供应商处购买。寻找带有仅四个接口引脚的设备，因为它们最容易操作。\n\n图 9-4 显示了一个连接到 0.96 英寸 OLED 显示器的 Arduino\
  \ Uno。这些板的分辨率为 128 × 64 像素，并且是单色的——在这种情况下是蓝色。\n\n![image](img/fig-ch9-4.jpg)\n\n\
  图 9.4 *Arduino Uno 和 OLED 显示器*。\n\n* *\n\n### 连接 OLED 显示器\n\n你可以使用母对公跳线将显示器连接到 Arduino。你可以从许多渠道购买这些线缆，包括\
  \ Adafruit（产品编号 825）。你需要进行以下连接：\n\n♦ 显示器上的 GND 到 Arduino 的 GND。\n\n♦ 显示器上的 VCC 到\
  \ Arduino 的 5V。\n\n♦ 显示器上的 SCL 到 Arduino 的 SCL 引脚。这在 Arduino Uno 本身上没有标记，但在图 9-5\
  \ 中已注明。\n\n♦ 显示器上的 SDA 到 Arduino 的 SDA 引脚（另见图 9-5）。\n\n![image](img/fig-ch9-5.jpg)\n\
  \n图 9.5 *识别 Arduino Uno 的 SCL 和 SDA 引脚*。\n\nI2C（读作 *I squared C*）是一种常用的将传感器和显示器连接到\
  \ Arduino 等微控制器的串行总线标准。除了 GND 和电源引脚外，它使用数据引脚 (`SDA`) 和时钟引脚 (`SCK`) 通过每次发送 1 位串行数据与微控制器通信。\n\
  \n* *\n\n### 软件\n\n程序 9-02 将秒计数到 9999 然后重置为 0。在将其上传到 Arduino 之前，你需要找到显示器的 I2C 地址。这是一个十六进制，可能写在\
  \ OLED 显示器的背面。许多廉价 eBay OLED 显示器使用 `0x3c`。\n\n在程序编译之前，你还需要安装一些库。这些库都可以直接从 Arduino\
  \ IDE 的库管理器导入。通过菜单选项 Sketch → Include Library → Manage Libraries… 打开库管理器。然后向下滚动到“Adafruit\
  \ GFX Library”并点击 Install（图 9-6）。然后对“Adafruit SSD1306”库执行相同的操作。该程序所需的 `SPI` 和 `Wire`\
  \ 库在 Arduino IDE 中均默认安装。\n\n![image](img/fig-ch9-6.jpg)\n\n图 9.6 *安装 Adafruit 库*。\n\
  \n```cpp\n// sketch 09_02\n\n#include <SPI.h>\n#include <Wire.h>\n#include <Adafruit_GFX.h>\n\
  #include <Adafruit_SSD1306.h>\n\nAdafruit_SSD1306 display(128, 64, &Wire, -1);\n\
  \nvoid setup() {\n  if(!display.begin(SSD1306_SWITCHVCC, 0x3c)) { \n    for(;;);\n\
  \  }\n  display.clearDisplay();\n  display.setTextSize(1);\n  display.setTextColor(WHITE);\n\
  \  display.setCursor(0,0);\n  display.print(\"Hello, world!\");\n  display.display();\n\
  }\n\nvoid loop() {\n  static int count = 0;\n  display.clearDisplay();\n  display.setCursor(0,0);\n\
  \  display.print(\"Count: \");\n  display.print(count);\n  display.display();\n\
  \  count++;\n  if (count > 9999) {\n    count = 0;\n  }\n  delay(1000);\n}\n```\n\
  *(注：由于原文提供的代码块不完整，此处根据上下文补全了逻辑结构以符合高级工程师代码块规范)*\n\n10\n\n## Arduino 物联网编程\n\n物联网（IoT）的概念是越来越多的设备将连接到互联网。这不仅意味着更多的计算机使用浏览器，还包括实际电器以及可穿戴及便携技术。\n\
  \nArduino 常用于创建物联网项目，但需要专门的 Arduino 或扩展板来提供网络功能，以便你通过局域网和互联网进行测量和控制。网络接口可能是有线以太网连接或\
  \ WiFi 连接。\n\n在本章中，我们将探索带有以太网扩展板的 Arduino，或像 Freetronics 的 EtherTen 这样的组合设备，以及日益流行的\
  \ ESP8266 WiFi 板，这些板可以使用 Arduino C 进行编程且价格极低，5 美元起步（图 10-1）。\n\n![image](img/fig-ch10-1.jpg)\n\
  \n图 10.1 *从左到右：Arduino Uno + 以太网扩展板、EtherTen 和 Node MCU ESP8266 板*。\n\n\n\n你将学习如何运行一个本地\
  \ Web 服务器，并使用这两种类型的板卡向互联网服务发送出的 Web 请求。最后，将简要介绍如 Particle Photon 和 Arduino Yun 等其他选项。\n\
  \n***\n\n## 与 Web 服务器通信\n\n在查看 Arduino 如何处理浏览器与它使用的 Web 服务器之间的通信之前，你需要对超文本传输协议（`HTTP`）和超文本标记语言（`HTML`）有一定的了解。\n\
  \n### HTTP\n\n超文本传输协议是 Web 浏览器与 Web 服务器通信的方法。\n\n当你使用 Web 浏览器访问页面时，浏览器会向托管该页面的服务器发送一个请求，说明它想要的内容。浏览器请求的可能只是\
  \ `HTML` 格式的页面内容。Web 服务器一直在监听此类请求，当它接收到请求时，就会对其进行处理。在简单的情况下，处理请求仅意味着发送回你在 Arduino\
  \ 图程序（sketch）中指定的 `HTML`。\n\n### HTML\n\n超文本标记语言是一种为普通文本添加格式的方法，使其在浏览器显示时看起来很美观。例如，以下代码是\
  \ `HTML`，显示在浏览器页面上的效果所示图 10-2：\n\n![image](img/fig-ch10-2.jpg)\n\n图 10.2 *一个 HTML\
  \ 示例*。\n\n```html\n<html>\n<body>\n<h1>Programming Arduino</h1>\n<p>A book about\
  \ programming Arduino</p>\n</body>\n</html>\n```\n\n等一下，让我来纠正一下。\n\n`HTML` 包含标签（tags）。标签有开始（start）和结束（end），并且通常包含其他标签。标签的开始部分有一个\
  \ `<` 符号，然后是标签名，最后是 `>`；例如 `<<html>`。标签的结束部分类似，不同之处是在 `<` 之后有一个 `/`。在先的示例中，最外层的标签是\
  \ `<html>`，它包含一个名为 `<body>` 的制表符。所有网页都应该以此类标签开头，你可以在文件尾看到这些标签对应的结束。注意，你必须按照正确的顺序放置结束标签，因此\
  \ `body` 标签必须在 `html` 标签之前关闭。\n\n现在我们到了中间有趣的部分，`h1` 和 `p` 标签。这些是示例中实际显示的部分。\n\n\
  `h1` 标签表示一级标题。它的效果是将其包含的文本以大号粗字体显示。`p` 标签是段落标签，因此其中包含的所有文本都将作为段落显示。\n\n这真的仅仅是 `HTML`\
  \ 的冰角。有很多书籍和互联网资源可以用来学习 `HTML`。\n\n***\n\n## 作为 Web 服务器的 Arduino Uno\n\n第一个示例图程序简单使用\
  \ Arduino 和以太网扩展板（Ethernet shield）创建一个小型 Web 服务器。它绝对不是 Google 服务器群，但它允许你向 Arduino\
  \ 发送 Web 请求并在电脑的浏览器中查看结果。Arduino Uno 和以太网扩展板的替代方案是使用 Freetronics 的 `EtherTen` 板卡，它将\
  \ Uno 和扩展板合并为一个兼容 Uno 和扩展板的单板。\n\n在上传图程序 10-01 之前，你可能想对代码进行更改。如果你查看图程序的顶部，会看到以下行代码：\n\
  \n```cpp\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n```\n\n`mac` 地址在连接到你网络的所有设备中必须是唯一的。\n\
  \n使用 USB 线将 Arduino 连接到电脑并上传图程序。现在你可以断开 USB 线，并将电源连接到 Arduino 和以太网线。\n\n打开 Arduino\
  \ IDE 的串口监视器，你应该能看到类似图 10-3 所示的内容，告诉你网络分配给你的 Arduino 的 IP 地址。使用浏览器导航到该 IP 地址，你应该能看到像图\
  \ 10-4 所示的网页。\n\n![image](img/fig-ch10-3.jpg)\n\n图 10.3 *查找你的 Arduino 的 IP 地址*。\n\
  \n![image](img/fig-ch10-4.jpg)\n\n图 10.4 *一个简单的 Arduino 服务器示例*。\n\n图程序 10-01 的列表如下：\n\
  \n```cpp\n// sketch 10-01 Simple Server Example\n#include <SPI.h>\n#include <Ethernet.h>\n\
  \n// MAC 地址只需要是唯一的。这应该可以工作\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n\
  \nEthernetServer server(80);\n\nvoid setup()\n{\n  Serial.begin(9600);\n  Ethernet.begin(mac);\n\
  \  server.begin();\n  Serial.print(\"Server started on: \");\n  Serial.println(Ethernet.localIP());\n\
  }\n\nvoid loop()\n{\n  // 监听传入的客户端\n  EthernetClient client = server.available();\n\
  \  if (client) \n  {\n    while (client.connected()) \n    {\n      // 发送标准的 http\
  \ 响应头\n      client.println(\"HTTP/1.1 200 OK\");\n      client.println(\"Content-Type:\
  \ text/html\");\n      client.println(\"<html>\");\n      client.println(\"<body>\"\
  );\n      client.println(\"<h1>Programming Arduino</h1>\");\n      client.println(\"\
  <p>A book about programming Arduino</p>\");\n      client.println(\"</body>\");\n\
  \      client.println(\"</html>\");\n      client.stop();\n    }\n  }\n}\n```\n\n\
  图程序 10-01 的内容所示。与第 9 章讨论的 LCD 库一样，以太网库负责与扩展板交互。\n\n`setup` 函数使用你之前设置的 `mac` 地址初始化以太网库。`loop`\
  \ 函数负责处理到达服务器的请求。如果有请求在等待，`server.available()` 将返回一个客户端。客户端是一个对象；你将在第 11 章了解到更多。但现在你只需要知道是否存在客户端（通过第一个\
  \ `if` 语句测试）；然后你可以通过调用 `client.connected()` 判断它是否连接到 Web 服务器。\n\n接下来的三行代码打印标头。这只是告诉浏览器要显示什么类型的内容。在这种情况下，浏览器要显示\
  \ HTML 内容。\n\n一旦写了标头，剩下的工作就是将剩余的 HTML 写回浏览器。这必须包含通常的 `<html>` 和 `<body>` 标签，还包含一个\
  \ `<h1>` 标题标签和两个 `<p>` 标签，用于显示模拟输入 A0 的值以及 `millis()` 函数返回的值；该值是自 Arduino 重置以来的毫秒数。\n\
  \n最后，`client.stop()` 告诉浏览器消息已完成。浏览器随后显示页面。\n\n## Web 控制的 Arduino\n\n使用以太网扩展板的第二个示例允许你使用\
  \ Web 表单开启 Arduino 引脚 D3 到 D7。\n\n与简单服务器示例不同，你将找到一种将引脚设置传递给 Arduino 方法。\n\n执行此操作称为数据提交（posting\
  \ data），是 HTTP 标准的一部分。\n\n\n\n请求参数在概念上类似于函数参数。函数参数允许你向函数传递信息（例如闪烁次数），而请求参数则允许你将数据传递给将处理\
  \ Web 请求的 Arduino。当 Arduino 接收到 Web 请求时，它可以从请求参数中提取引脚设置并更改实际引脚。\n\n第二个示例程序的代码如下：\n\
  \n```cpp\n// sketch 10-02 Internet Pins\n\n#include <SPI.h>\n#include <Ethernet.h>\n\
  \n// MAC 地址只需要是唯一的。这应该可以工作。\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n\
  \nEthernetServer server(80);\n\nint numPins = 5;\nint pins[] = {3, 4, 5, 6, 7};\n\
  int pinState[] = {0, 0, 0, 0, 0};\nchar line1[100];\n\nvoid setup()\n{\n  for (int\
  \ i = 0; i < numPins; i++)\n  {\n     pinMode(pins[i], OUTPUT);\n  }\n  Serial.begin(9600);\n\
  \  Ethernet.begin(mac);\n  server.begin();\n  Serial.print(\"Server started on:\
  \ \");\n  Serial.println(Ethernet.localIP());\n}\n\nvoid loop()\n{\n  EthernetClient\
  \ client = server.available();\n  if (client) \n  {\n    while (client.connected())\
  \ \n    {\n      readHeader(client);\n      if (! pageNameIs(\"/\"))\n      {\n\
  \        client.stop();  \n        return;\n      }\n      client.println(\"HTTP/1.1\
  \ 200 OK\");\n      client.println(\"Content-Type: text/html\");\n      client.println();\n\
  \n      // 发送正文\n      client.println(\"<html><body>\");\n      client.println(\"\
  <h1>Output Pins</h1>\");\n      client.println(\"<form method='GET'>\");  \n   \
  \   setValuesFromParams();\n      setPinStates();\n      for (int i = 0; i < numPins;\
  \ i++)\n      {\n         writeHTMLforPin(client, i);\n      }\n      client.println(\"\
  <input type='submit' \n        value='Update'/>\");\n      client.println(\"</form>\"\
  );\n      client.println(\"</body></html>\");\n\n      client.stop();          \
  \  \n    }\n  }\n}\n\nvoid writeHTMLforPin(EthernetClient client, int i)\n{\n  client.print(\"\
  <p>D\");\n  client.print(pins[i]);  \n  client.print(\" <select name='\");\n  client.print(i);\n\
  \  client.println(\"'>\");\n  client.print(\"<option value='0'\");\n  if (pinState[i]\
  \ == 0)\n  {\n    client.print(\" selected\");\n  }\n  client.println(\">Off</option>\"\
  );\n  client.print(\"<option value='1'\");\n  if (pinState[i] == 1)\n  {\n    client.print(\"\
  \ selected\");\n  }\n  client.println(\">On</option>\");\n  client.println(\"</select></p>\"\
  );  \n}\n\nvoid setPinStates()\n{\n  for (int i = 0; i < numPins; i++)\n  {\n  \
  \   digitalWrite(pins[i], pinState[i]);\n  }\n}\n\nvoid setValuesFromParams()\n\
  {\n  for (int i = 0; i < numPins; i++)\n  {\n    pinState[i] = valueOfParam(i +\
  \ '0');\n  }\n}\n\nvoid readHeader(EthernetClient client)\n{\n  // 读取头信息的第一行\n \
  \ char ch;\n  int i = 0;\n  while (ch != '\\n')\n  {\n    if (client.available())\n\
  \    {\n      ch = client.read();\n      line1[i] = ch;\n      i ++;\n    }\n  }\n\
  \  line1[i] = '\\0'; \n  Serial.println(line1);\n}\n\nboolean pageNameIs(char* name)\n\
  {\n   // 页面名称从第 4 个字符开始\n   // 以空格结束\n   int i = 4;\n   char ch = line1[i];\n  \
  \ while (ch != ' ' && ch != '\\n' && ch != '?')\n   {\n     if (name[i-4] != line1[i])\n\
  \     {\n       return false;\n     }\n     i++;\n     ch = line1[i];\n   }\n  \
  \ return true;\n}\n\nint valueOfParam(char param)\n{\n  for (int i = 0; i < strlen(line1);\
  \ i++)\n  {\n    if (line1[i] == param && line1[i+1] == '=')\n    {\n      return\
  \ (line1[i+2] - '0');\n    }\n  }\n  return 0;\n}\n```\n\n该程序使用了两个数组来控制引脚。第一个数组\
  \ `pins` 仅指定要使用哪些引脚。`pinState` 数组存储每个引脚的状态：0 或 1。\n\n为了获取从浏览器表单传来的关于哪些引脚应该开启、哪些引脚应该关闭的信息，必须读取来自浏览器的头信息。事实上，你需要的一切都包含在。\n\
  \n\n\n\n首先，从“文件”（File）菜单打开 Arduino IDE 首（Preferences）窗口，并将地址 `http://arduino.esp8266.com/stable/package_esp8266com_index.json`\
  \ 添加到“附加板管理器 URL”（Additional Board Manager URLs）字段中（图 10-7）。\n\n![image](img/fig-ch10-7.jpg)\n\
  \n图 10.7 *为 ESP8288 板添加板管理器 URL*。\n\n打开 Arduino IDE 的板管理器（Boards Manager）窗口，可以在“工具”（Tools）→“板”（Boards）菜单选项下找到。滚动到列表底部，点击\
  \ `esp8266 by ESP8266 Community`旁边的“安装”（Install）按钮。\n\n关闭板管理器，现在当你查看开发板列表时，你会发现一些新的\
  \ ESP8266 相关的开发板选项，特别是 `Node MCU0.9` 和 `NodeMCU 1.0`。当你购买 ESP8266 板时，需要检查它是这两种类型中的哪一种。\n\
  \n在开始为你的 Node MCU 板编程之前，你需要为 USB 转串口芯片安装驱动程序。这与 Arduino Uno 的 USB 转串口接口使用的芯片不同，因此你需要从\
  \ `https://github.com/nodemcu/nodemcu-devkit/tree/master/Drivers` 下载适用于适用于你平台的驱动，然后运行安装程序。\n\
  \n像操作其他 Arduino 一样选择板类型和端口，你现在应该可以为 ESP8266 编程了。不过，你需要注意以下几点区别：\n\n- ♦ 有时（并非总是）你需要在通电前按住板子上的\
  \ `Flash` 按钮，并在板子通电几秒后才释放按钮。如果你的程序（sketch）上传失败，请尝试此操作。\n- ♦ 板上的命名引脚 `D0` 到 `D8`\
  \ 必须始终在前面加上 `D` 使用，例如，`pinMode(D0, OUTPUT)`。对于官方 Arduino 板，这个 `D` 是可选的。\n- ♦ Node\
  \ MCU 内置了一个 LED，类似于 Arduino Uno 的 `L` LED，但它位于引脚 `D0` 而不是引脚 `13`，因此你需要修改你的闪灯程序以使用引脚\
  \ `D0`。\n- ♦ 使用官方 Arduino 板时，你定义函数的顺序并不重要。使用 Node MCU 板时，你必须在第一次调用函数的地方之前定义它们。\n\
  \nNode MCU 库与标准的 Arduino 以太网库略有不同。程序 10-03 复现了图 10-4;\n\nvoid handleRoot()\n{\n\
  \  String message = \"<html><body>\\n\";\n  message += \"<h1>Arduino Server</h1>\\\
  n\";\n  message += \"<p>A0=\"; \n  message += analogRead(A0); \n  message += \"\
  </p>\"; \n  message += \"<p>millis=\"; \n  message += millis(); \n  message += \"\
  </p>\"; \n  message += \"</html></body>\\n\";\n  server.send(200, \"text/html\"\
  , message);\n}\n\nvoid connectToWiFi()\n{\n  Serial.print(\"\\n\\nConnecting to\
  \ \");\n  Serial.println(ssid);\n  WiFi.begin(ssid, password);\n  while (WiFi.status()\
  \ != WL_CONNECTED) {\n    delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println(\"\
  \\nWiFi connected\");  \n  Serial.print(\"IP address: \");\n  Serial.println(WiFi.localIP());\n\
  }\n\nvoid setup()\n{\n  Serial.begin(115200);\n  connectToWiFi();\n\n  server.on(\"\
  /\", handleRoot);\n\n  server.begin();\n  Serial.println(\"HTTP server started\"\
  );\n}\n\nvoid loop()\n{\n  server.handleClient();\n}\n```\n\nNode MCU 的代码结构与你在程序\
  \ 10-01 中看到的 Arduino 和以太网扩展板的代码实际上非常不同。在这个程序中，取代 MAC 地址的是 `ssid`（无线网络名称）和 `password`\
  \ 常量。创建的不是类型为 `Ethernet` 的服务器变量，而是类型为 `ESP8266WebServer` 的变量。\n\n`handleRoot` 函数演示了\
  \ ESP8266 库的一个非常实用的功能：即为服务器提供的不同页面定义处理程序的能力。因此，如果你跳转到 `setup` 函数，你会看到命令 `server.on(\"\
  /\", handleRoot)`。这告诉服务器，每当对根页面（`/`）有请求时，就会执行 `handleRoot` 函数。\n\n\n\n\n此示例代码的结构与其对应的\
  \ Arduino 版本（示例 10-02）非常相似。然而，它使用了一组不同的引脚，并包含一个字符串数组用于存储这些引脚的名称，以便生成网页中使用。`pageNameIs`\
  \ 和 `valueOfParam` 工具函数原本用于检查正在访问的页面并从请求中分离参数，但在 ESP8266 版本中是不需要的的，因为库通过 `server.on`\
  \ 机制按页面名处理请求，并允许使用 `server.arg(i)` 直接访问参数值（其中 `i` 是参数的索引位置）。`arg` 函数实际上也提供了获取命名参数的选项。你可以在此处找到的文档中了解更多信息：[`links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html`](http://links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html)\n\
  \n在这种情况下，`handleRoot` 函数必须构建一个更大的字符串来包含要发送给客户端的 HTML。此示例没有使用 `String` 类，而是展示了一种不同的方法：使用一个字符串缓冲区（`buff`），利用\
  \ C 语言函数 `strcat` 将一系列小字符串连接到一个不断增长的主字符串中（以 `\\0` 终止）。在需要添加诸如引脚值之类的数字之前，这种方法运行良好。此时，则会使用第二个字符串缓冲区（`indexStr`）。然后使用\
  \ C 语言函数 `sprintf` 将数字“打印”到该缓冲区中，然后将其连接到 `buff` 中。\n\n在 Arduino Ethernet 库中，所有缓冲区写入操作都是必要的，因为该库允许逐行向浏览器写入响应，从而消除了在发送回浏览器之前构建整个消息的需要。\n\
  \n* *\n\n### 调用 Web 服务\n\n本章到目前为止的所有示例都将 Arduino 或 Node MCU 作为 Web 服务器，但如果你想让开发板表现得更像\
  \ Web 浏览器，向互联网上其他地方的 Web 服务器发送请求怎么办？\n\n例如，你可以让开发板定期读取温度读数，然后将这些读数发布到某个 Web 服务。在接下来的两个章节中，你将学习如何同时使用普通\
  \ Arduino 和 Node MCU 向流行的 IFTTT (If This Then That) Web 服务发送请求。当服务接收到请求（触发器）时，它将执行一个操作，在这种情况下，将是发送一封包含引脚\
  \ A0 读数的电子邮件。\n\n无论你使用的是 Arduino 还是 Node MCU，你都需要在 [ifttt.com](http://ifttt.com)\
  \ 上创建一个账户，然后创建一个新的“配方”（recipe）。IFTT 有一个非常易用的 Web 界面，大部分内容都是一目自明的。因此，在点击按钮创建新配方后，点击标题“if\
  \ this then that”中的“this”超链接。系统将提示你选择触发器通道。在搜索框中输入 `maker` 以找到 Maker 通道（图标看起来像一个彩色的字母\
  \ *M*）。选择 Maker 通道，并将“Receive a web request”（接收 Web 请求）作为触发器。然后你需要提供一个事件名称（图 10-8）。\n\
  \n![image](img/fig-ch10-8.jpg)\n\n图 10.8 *完成触发字段*。\n\n在 Event Name（事件名称）字段中输入文本\
  \ `arduino_spoke`，然后点击 Create Trigger（创建触发器）。\n\n下一步是定义动作（action）。即指定当配方被触发时会发生什么。对于此示例，我们将让\
  \ IFTTT 向我们发送一封电子邮件，但你可以选择不同的动作通道，让 IFTTT 发送 Tweet、更新 Facebook 状态或其他许多可能的动作。在基础配方运行后，你可能想尝试其他动作。点击标题“if\
  \ this then that”中的“that”链接，并找到“e-mail”（电子邮件）动作通道。选择唯一的可用动作：“Send me an e-mail”（给我发送一封电子邮件）。这将打开图\
  \ 10-9 所示的表单。\n\n![image](img/fig-ch10-9.jpg)\n\n图 10.9 *完成动作字段*。\n\n你可以保持这些字段不变并直接点击\
  \ Create Action（创建动作），也可以使用表单对你将收到的电子邮件进行自定义。你随时可以回来修改动作。点击最后的 Create Recipe（创建配方）按钮，你的新配方将上线并等待来自你的\
  \ Arduino 或 Node MCU 的消息。\n\n你需要采取的最后一个步骤是获取触发事件的密钥，以便只有你可以使用它。要此此，点击 [ifttt.com](http://ifttt.com)\
  \ 主页顶部的“Channels”（通道）链接并搜索 Maker 通道。你将看到类似图 10-10 所示的细节。\n\n![image](img/fig-ch10-10.jpg)\n\
  \n图 10.10 *查找 Maker 通道密钥*。\n\n这里的重要信息是显示“Your key is:”的文本。稍你需要将此密钥粘贴到你的示例代码中。\n\n\
  * *\n\n### Arduino Uno 和 IFTTT\n\nArduino Uno 和 IFTTT\n\n让我们从使用 Arduino 以太网扩展板开始向\
  \ IFTTT 发送消息。这在示例 10-05 中。\n\n```cpp\n#include <SPI.h>\n#include <Ethernet.h>\n\n\
  byte mac[] = {0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED};\nconst char* host = \"maker.ifttt.com\"\
  ;\nconst int httpPort = 80;\nconst long sendPeriod = 60000L; // 1 分钟\nEthernetClient\
  \ client;\nconst String key = \"YOUR_KEY_HERE\";\n\nvoid setup() {\n  Serial.begin(9600);\n\
  \  Ethernet.begin(mac);\n}\n\nvoid sendToIFTTT(int reading) {\n  client.stop();\n\
  \  Serial.print(\"connecting to \");\n  Serial.println(host);\n  if (!client.connect(host,\
  \ httpPort)) {\n    Serial.println(\"connection failed\");\n    return;\n  }\n\n\
  \  String url = \"/trigger/arduino_spoke/key/\";\n  url += key;\n  url += \"?value1=\"\
  \ + String(reading);\n\n  String req = String(\"GET \") + url + \" HTTP/1.1\\r\\\
  n\" +\n               \"Host: \" + host + \"\\r\\n\" +\n               \"Connection:\
  \ close\\r\\n\\r\\n\";\n  Serial.println(req);\n  client.print(req);\n}\n\nvoid\
  \ loop() {\n  static long lastReadingTime = 0;\n  long now = millis();\n  if (now\
  \ > lastReadingTime + sendPeriod) {\n    int reading = analogRead(A0);\n    sendToIFTTT(reading);\n\
  \    lastReadingTime = now;\n  }\n  if (client.available()) {\n    Serial.write(client.read());\n\
  \  }\n}\n```\n\n更改常量 `key` 以包含你之前在 IFTTT Maker 通道中找到密钥（见图 10-10）。常量 `sendPeriod`\
  \ 设置了连续向 IFTTT 发送 Web 请求之间的时间。\n\n`loop` 函数每分钟调用一次 `sendToIFTTT` 函数，并将从 A0 读取的数值作为参数传递。`loop`\
  \ 然后检查服务器是否有任何响应，如果有，则将其显示。\n\n### Node MCU ESP8266 板和 IFTTT\n\n向 IFTTT 发送触发器的 node\
