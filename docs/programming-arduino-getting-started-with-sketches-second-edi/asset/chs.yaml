  \    Flasher(int pin, int duration);\n    void flash(int times);\n  private:\n \
  \   int _pin;\n    int _d;\n};\n```\n\n将此文件保存在 `Flasher` 文件夹中，命名为 `Flasher.h`。这是库类\
  \ `Flasher` 的头文件。该文件指定了类的不同部分。如你所见，它分为公共（public）和私（private）部分。\n\n公共部分包含了看起来两个函数的开头。这些被称为方法（methods），它们与函数的区别仅在于它们与类相关联。它们只能作为类的一部分来使用。与函数不同，它们不能单独使用。\n\
  \n第一个方法 `Flasher` 以大写字母开头，这在函数名中是不会使用的。它的名字与类 `Flasher` 相同。这种方法被称为**构造函数**（constructor），你可以你可以使用它来创建一个新的\
  \ `Flasher` 对象以便在程序（sketch）中使用。\n\n例如，你可以在程序中放入以下内容：\n\n```cpp\nFlasher slowFlasher(13,\
  \ 500);\n```\n\n这将创建一个名为 `slowFlasher` 的新 `Flasher` 对象，它将在 D13 引脚上闪烁，持续时间为 500 毫秒。\n\
  \n类中的第二个方法称为 `flash`。该方法接受一个参数，表示闪烁的次数。因为它与类相关，当你想要调用它时，必须引用你之前创建的对象，如下：\n\n```cpp\n\
  slowFlasher.flash(10);\n```\n\n这将导致 LED 按你在构造函数中为 `Flasher` 对象指定的周期闪烁十次。\n\n类的私有部分包含两个变量定义：一个用于引脚，另一个用于持续时间（简单称为\
  \ `d`）。每当你创建一个 `Flasher` 类的对象时，它都会拥有这两个变量。这使得它在创建新的 `Flasher` 对象时能够记住引脚和持续时间。\n\n\
  这些变量被称为**成员变量**（member variables），因为它们是类的成员。它们的命名通常很特殊，以下划线字符开头；然而，这仅仅是一种惯例，并不是编程的必须。另一种常用的命名惯例是使用小写\
  \ `m`（代表 *member*）作为变量名的第一个字母。\n\n### 实现文件\n\n头文件只是定义了类的结构。你现在需要一个实际执行工作的文件。这被称为实现文件（implementation\
  \ file），扩展名为 `.cpp`。\n\n因此，创建一个包含以下内容的新文件，并将其保存为 `Flasher` 文件夹中的 `Flasher.cpp`：\n\
  \n```cpp\n#include \"Flasher.h\"\n\nFlasher::Flasher(int pin, int duration)\n{\n\
  \  pinMode(pin, OUTPUT);\n  _pin = pin;\n  _d = duration / 2;\n}\n\nvoid Flasher::flash(int\
  \ times)\n{\n  for (int i = 0; i < times; i++)\n  {\n    digitalWrite(_pin, HIGH);\n\
  \    delay(_d);\n    digitalWrite(_pin, LOW);\n    delay(_d);\n  }  \n}\n```\n\n\
  文件中文件中不熟悉的语法。方法名都带有 `Flasher::` 前缀。这表示这些方法属于 `Flasher` 类。\n\n构造函数方法 `Flasher` 只是将它的每个参数赋值给相应的私有成员变量。`duration`\
  \ 参数在赋值给成员变量 `_d` 之前会被除以二。这是因为 `delay` 被调用了两次，让持续时间成为闪烁总时长和闪烁间隔的总和似乎更符合逻辑。\n\n`flash`\
  \ 函数实际上执行了闪烁业务；它循环相应的次数，并在相应的延迟内开启和关闭 LED。\n\n### 完成你的库\n\n你现在已经学习了完成该库的所有要点。你现在可以部署这个库，它将运行得良好。然而，为了完成你的库，你应该采取另外两个步骤。一个是定义库中使用的关键字，以便\
  \ Arduino IDE 能够在用户编辑代码时以适当的颜色显示它们。另一个是包含一些如何使用该库的示例。\n\n#### 关键字\n\n要定义关键字，你必须创建一个名为\
  \ `keywords.txt` 的文件，将其放入 `Flasher` 目录。该文件仅包含以下两行：\n\n```\nFlasher   KEYWORD1\n\
  flash     KEYWORD2\n```\n\n这本质上是文件中的双列表格。左列是关键字，右列是该关键字类型的指示。类名应该是 `KEYWORD1`，方法应该是\
  \ `KEYWORD2`。在两列之间放置多少空格或制表符并不重要，但每个关键字应该从新行开始。\n\n#### 示例\n\n作为一个良好的 Arduino 开发者，你还应该作为库的一部分包含一个示例文件夹。在这种情况下，该库非常简单，一个示例就足够了。\n\
  \n所有示例必须放在 `Flasher` 文件夹内名为 `examples` 的文件夹中。示例实际上只是一个 Arduino 程序（sketch），因此你可以使用\
  \ Arduino IDE 创建示例。但首先，你必须关闭并重新打开 Arduino IDE，以便它能感知到新库。\n\n重启 Arduino IDE 后，从 Arduino\
  \ IDE 的菜单中选择 `File` 然后 `New` 来创建一个新的程序窗口。然后从菜单中选择 `File` 然后 `Include Library` 来找到你的库。Arduino\
  \ IDE 不允许你直接将示例程序保存到库文件夹，因此将其另存为处为 `Simple_Flasher_Example`，然后将整个 `Simple_Flasher_Example`\
  \ 文件夹移动到库的 `examples` 文件夹中。\n\n```cpp\n#include <Flasher.h>\n\nconst int ledPin\
  \ = 13;\nconst int slowDuration = 300;\nconst int fastDuration = 100;\n\nFlasher\
  \ slowFlasher(ledPin, slowDuration);\nFlasher fastFasher(ledPin, fastDuration);\n\
  \nvoid setup(){}\n\nvoid loop()\n{\n   slowFlasher.flash(5);\n   delay(1000);\n\
  \   fastFasher.flash(10);\n   delay(2000);\n}\n```\n\n\n\n\n\n- `/*/`, 注释代码风格，61\n\
