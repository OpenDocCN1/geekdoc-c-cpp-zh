    \ connect to WiFi rather than to Ethernet and the use of the `WiFiClient` class\
    \ rather than `EthernetClient`, the code is almost identical.\n\n***\n\n### Other\
    \ IoT Options\n\nThe Arduino Yun and Particle Photon ([Figure 10-11](#19_Chapter_10.xhtml_fig-ch10-11))\
    \ offer alternative platforms for making Internet of Things projects.\n\n![image](images/fig-ch10-11.jpg)\n\
    \nFigure 10.11 *The Arduino Yun (left) and Particle Photon (right)*.\n\n#### Arduino\
    \ Yun\n\nThe Arduino Yun is the official Arduino approach to an IoT board. It’s\
    \ a very full-featured board that includes both a separate WiFi module and wired\
    \ Ethernet and USB host sockets. Effectively, it’s a bit like an `Arduino Uno`\
    \ combined with an `ESP8266`-style WiFi module. Communication between the Arduino\
    \ and WiFi module sides of the board is accomplished using software called “bridge.”\n\
    \nThe first step when using a Yun is to connect it to your WiFi network. After\
    \ you have done this you can program it using the Arduino IDE without having a\
    \ physical wire connecting it to the computer doing the programming. The board\
    \ can then be programmed over the WiFi connection.\n\nThe board also has USB host,\
    \ but all these features come at a cost, making the board prohibitively expensive\
    \ for many IoT projects, especially when put next to an `ESP8266`-based board.\n\
    \n#### Particle Photon\n\nThe Photon and its predecessor the Spark Core are a\
    \ third-party Arduino-like platform for the IoT. It is WiFi only and also allows\
    \ over-the-air programming using a Web-based IDE that is not actually the Arduino\
    \ IDE, but looks rather like it.\n\nThe Photon is programmed in Arduino C with\
    \ some extensions that link it seamlessly into Particle.io’s IoT framework, removing\
    \ a lot of the potentially tricky network programming that you have seen in this\
    \ chapter.\n\nThe Photon is a little more expensive than `ESP8266`-based boards\
    \ but its built-in IoT framework and over-the-air programming capabilities make\
    \ it a good choice for WiFi IoT projects.\n\nIf you want to learn more about the\
    \ Photon, then you might like to look at my book *Getting Started with the Photon*\
    \ (Maker Media, 2015).\n\n***\n\n### Conclusion\n\nHaving used shields and associated\
    \ libraries in the last two chapters, it is now time to investigate the features\
    \ that enable libraries to be written and learn how to write libraries of your\
    \ own.\n\n## 11\n\n## C++ and Libraries\n\nArduinos are simple microcontrollers.\
    \ Most of the time, Arduino sketches are quite small, so using the C programming\
    \ language works just fine. However, the programming language for Arduino is actually\
    \ C++ rather than C. C++ is an extension to the C programming language that adds\
    \ something called *object orientation.*\n\n***\n\n### Object Orientation\n\n\
    This is only a short book, so an in-depth explanation of the C++ programming language\
    \ is beyond its scope. The book can, however, cover the basics of C++ and object\
    \ orientation. But the main goal is to increase the *encapsulation* of your programs.\
    \ Encapsulation keeps relevant things together, something that makes C++ very\
    \ suitable for writing libraries such as those that you have used for the Ethernet\
    \ and LCD sketches in earlier chapters.\n\nThere are many good books on the topics\
    \ of C++ and object-oriented programming. Look for the higher-rated books on the\
    \ topic.\n\n#### Classes and Methods\n\nObject orientation uses a concept called\
    \ `classes` to aid encapsulation. Generally, a `class` is like a section of a\
    \ program that includes both member variables—and `methods`, which are like functions.\
    \ These functions can either be `public`, in which case they may be used by other\
    \ classes, or `private`, in which case the only within the same class.\n\nWhereas\
    \ an Arduino sketch is contained in a single file, when you are working in C++,\
    \ you tend to use more than one file. In fact, there are generally two files for\
    \ every class: A header file, which has `.h`, and the implementation file, which\
    \ has `.cpp`.\n\n***\n\n### Built-In Library Example\n\nThe LCD library has been\
    \ used in the previous chapters, so let’s look more closely and see what is going\
    \ on in a little more detail. Referring back to sketch 9-01 (open this in your\
    \ Arduino IDE), you can see that the `include` command includes the file `LiquidCrystal`:\n\
    \n```\n#include <LiquidCrystal>\n```\n\nThis file is the header file for the class\
    \ `LiquidCrystal`. This file tells the Arduino sketch what it needs to be able\
    \ to use the library. You can actually retrieve this file if you go to your Arduino\
    \ installation folder and find the `libraries/LiquidCrystal`. You will need to\
    \ open the file in a text editor.\n\nThe file `LiquidCrystal.h` contains lots\
    \ of code, as this is a fairly large library class. The code for the actual class\
    \ itself, where the nuts and bolts of displaying a message actually reside, is\
    \ in the `LiquidCrystal.cpp`.\n\nIn the next section, a simple example library\
    \ will be created that should put the concepts behind a library into context.\n\
    \n***\n\n### Writing Libraries\n\nCreating an Arduino library might seem like\
    \ the kind of thing that only a seasoned Arduino veteran should attempt, but actually\
    \ it is pretty straightforward to make a library. For example, you can convert\
    \ into a library the `flash` function from [Chapter 4](#13_Chapter_04.xhtml) that\
    \ causes an LED to flash for a specified number of times.\n\nTo create the C++\
    \ files needed to do this, you will need a text editor for your computer—something\
    \ like TextPad on Windows or TextMate on Mac.\n\n#### The Header File\n\nStart\
    \ by creating a folder to contain all the library files. You should create this\
    \ folder inside the `libraries` folder of your Arduino documents folder. In Windows,\
    \ your libraries folder will be in `My Documents\\Arduino`. On the Mac, you will\
    \ find it in your home directory, `Documents/Arduino/`, and on Linux, it will\
    \ be in the sketchbook directory of your home directory. If there is no `libraries`\
    \ folder in your Arduino, then create one.\n\nThis `libraries` folder is where\
    \ any libraries you write yourself, or any “unofficial” contributed libraries,\
    \ must be installed.\n\nCall the folder `Flas`. Start the text editor and type\
    \ the following into it:\n"
