    \    }\n    else if (ch >= 'A' && ch <= 'Z')\n    {\n      flashSequence(letters[ch\
    \ - 'A']);\n    }\n    else if (ch >= '0' && ch <= '9')\n    {\n      flashSequence(numbers[ch\
    \ - '0']);\n    }\n    else if (ch == ' ')\n    {\n     delay(dotDelay * 4); \
    \     // gap between words  \n    }\n  }\n}\n\nvoid flashSequence(char* sequence)\n\
    {\n   int i = 0;\n   while (sequence[i] != '\\0')\n   {\n       flashDotOrDash(sequence[i]);\n\
    \       i++;\n   }\n   delay(dotDelay * 3);    // gap between letters\n}\n\nvoid\
    \ flashDotOrDash(char dotOrDash)\n{\n  digitalWrite(ledPin, HIGH);\n  if (dotOrDash\
    \ == '.')\n  {\n    delay(dotDelay);           \n  }\n  else // must be a -\n\
    \  {\n    delay(dotDelay * 3);           \n  }\n  digitalWrite(ledPin, LOW); \
    \   \n  delay(dotDelay); // gap between flashes\n}\n```\n\nThis sketch includes\
    \ a loop function that is called automatically and repeatedly calls a **flashSequence**\
    \ function that you wrote, which itself repeatedly calls a **flashDotOrDash**\
    \ function that you wrote, which calls **digitalWrite** and **delay** functions\
    \ that are provided by Arduino!"
