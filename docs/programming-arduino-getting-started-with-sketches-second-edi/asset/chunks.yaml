  trans: "\n所以，在摄氏度转华氏度的例子中，你定义了变量 `degC` 并给它赋了一个 20 的初始值，但当你定义 `degF` 时，它并没有获得初始值。它的值会在下一行根据转换公式被赋值，然后发送到串口监视器供你查看。\n\
    \n观察这个表达式，你可以看到使用星号 `*` 进行乘法，使用斜杠 `/` 进行除法。算术运算符 `+`、`–`、`*` 和 `/` 有优先级顺序——即先进行乘法，然后是除法，最后是加减。这符合通常的算术用法。然而，有时在表达式中使用括号会让逻辑更清晰。例如，你可以写成如下形式：\n\
    \n```\ndegF = ((degC * 9) / 5) + 32;\n```\n\n你编写的表达式可以根据需要任意长长和复杂，除了常用的算术运算符外，还有其他不常使用的运算符以及大量的各种数学函数供你使用。你以后会学习这些内容。\n\
    \n***\n\n## 命令 (Commands)\n\nC 语言有许多内置命令。在本节中，我们将探索其中的一些，并看看它们在你的 sketch（程序）中可以有什么用。\n\
    \n### if\n\n在之前的 sketch 中，我们假设你的代码行会按顺序一个接一个执行，没有任何异常。但如果你不想这样做呢？如果你只想在某些条件为真时执行\
    \ sketch 的部分内容呢？\n\n让我们回到那个逐渐变慢的 LED 闪烁示例。目前，它会变得越来越慢，直到每次闪烁持续好几个小时。让我们看看如何修改它，让它在减慢到某个程度后，回到初始的快速起始速度。\n\
    \n要做到这一点，你必须使用 `if` 命令；修改后的 sketch 如下。尝试一下。\n\n```\n// sketch 3-06\nint ledPin\
    \ = 13;\nint delayPeriod = 100;\n```\n\n```\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop()\n{\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  delayPeriod = delayPeriod\
    \ + 100;\n  if (delayPeriod > 3000)\n  {\n    delayPeriod = 100;\n  }\n}\n```\n\
    \n`if` 命令看起来有点像函数定义，但这种相似性仅仅表面。括号中的单词不是参数，它被称为*条件*（a condition）。所以在这种情况下，条件是变量\
    \ `delayPeriod` 的值大于 3000。如果该条件为真，那么大括号内部的命令将被执行。在这种情况下，代码将 `delayPeriod` 的值设回\
    \ 100。\n\n如果条件不成立，Arduino 将直接继续执行后续操作。在这种情况下，“if”之后没有内容了，所以 Arduino 将再次运行 `loop()`\
    \ 函数。\n\n在脑中过一遍这一系列事件有助于你理解正在发生了什么。以下是发生的过程：\n\n1. Arduino 运行 `setup()`并将 LED\
    \ 引脚初始化为输出。\n2. Arduino 开始运行 `loop()`。\n3. LED 点亮。\n4. 发生延迟。\n5. LED 熄灭。\n6. 发生延迟。\n\
    7. 将 `delayPeriod` 加 100。\n8. 如果延迟时间大于 3000，则将其重置为 100。\n9. 回到步骤 3。\n\n我们使用了符号\
    \ `>`，它的意思是“大于”。它是所谓的比较运算符的一个例子。这些运算符总结在下表中：\n\n| 运算符 | 含义 | 示例 | 结果 |\n| ---\
    \ | --- | --- | --- |\n| `<` | 小于 | `9 < 10`, `10 < 10` | true false |\n| `>`\
    \ | 大于 | `10 > 10`, `10 > 9` | false true |\n| `<=` | 小于等于 | `9 <= 10`, `10 <=\
    \ 10` | true true |\n| `>=` | 大于等于 | `10 >= 10`, `10 >= 9` | true true |\n| `==`\
    \ | 等于 | `9 == 9` | true |\n| `!=` | 不等于 | `9 != 9` | false |\n\n比较两个数字时使用 `==`\
    \ 命令。这个双等号很容易与字符 `=` 混淆，后者用于给变量赋值。\n\n还有另一种形式的 `if`，它允许你在条件为真时执行一件事，在条件为假时执行另一件事。我们将在书的后的一些实际示例中使用它。\n\
    \n### for\n\n除了在不同情况下执行不同的命令外，你通常还想在程序中运行若干次一系列命令。你已经知道一种实现此点的方法，即使用 `loop()`\
    \ 函数。只要 `loop()` 函数中的所有命令执行完毕，它就会重新开始。然而，有时你需要比这更强大的控制。\n\n例如，假设你想写一个 sketch，闪烁\
    \ 20 次，暂停 3 秒，然后重新开始。你可以通过这种方式实现，即通过在 `loop()` 中反复执行相同的代码：\n\n```\n// sketch 3-07\n\
    int ledPin = 13;\nint delayPeriod = 100;\n\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop()\n{\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  delayPeriod = delayPeriod\
    \ + 100;\n  if (delayPeriod > 3000)\n  {\n    delayPeriod = 100;\n  }\n}\n```\n\
    （注：此处根据上下文逻辑推断，原文示例处可能省略了循环逻辑描述，翻译保持意意对应）\n\n但这种方法需要大量的输入，而且有几种更好的实现方法。让我们先看看如何使用\
    \ `for` 循环，然后看使用计数器和 if 语句的方法。\n\n```\n// sketch 3-08\nint ledPin = 13;\nint delayPeriod\
    \ = 100;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n\
    \  for (int i = 0; i < 20; i++)\n  {\n    digitalWrite(ledPin, HIGH);\n    delay(delayPeriod);\n\
    \    digitalWrite(ledPin, LOW);\n    delay(delayPeriod);\n  }\n}\n```\n\n`for`\
    \ 循环看起来有点像接收三个参数的函数，尽管这里的参数是用分号而不是逗号分隔的。这只是 C 语言的一个特性。编译器很快就会在你出错时提醒你。\n\n`for`\
    \ 括号中的第一部分是变量声明。它指定了一个用作计数器的变量并给它一个初始值——在这种情况下是 0。\n\n第二部分是让你留在 `loop` 中必须满足的条件。在这种情况下，只要\
    \ `i` 小于 20，你就会留在 `loop` 中，但一旦 `i` 达到 20 或更大，程序就会退出 `loop`。\n\n最后部分是每当你完成 `loop`\
    \ 中的所有操作后要做的事情。在这种情况下，是将 `i` 加 1，以便它在绕 20 次 `loop` 后不再小于 20，从而导致程序退出 `loop`。\n\
    \n尝试输入这段代码并运行。熟悉语法和所有这些讨厌标点符号的唯一方法就是输入并让编译器在你出错时提醒你。最终，这一切都会开始变得容易。\n\n这种方法的一个潜在缺点是\
    \ `loop()` 函数将花费很长时间。这对于这个 sketch 来说并不是问题，因为它只是在闪烁 LED。但通常，sketch 中的 `loop()`\
    \ 函数还会检查按键是否被按下或是否接收了串口通信。如果处理器正忙于 `for` 循环，它将无法执行这些操作。通常，让 `loop()` 函数尽可能快地运行以便尽可能频繁地运行是一个好主意。\n\
    \n下面的 sketch 展示了如何实现这一点：\n\n"
- fmt: "\n```cpp\n// sketch 3-09\nint ledPin = 13;\nint delayPeriod = 100;\nint count\
    \ = 0;\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n  digitalWrite(ledPin,\
    \ HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n\
    \  count ++;\n  if (count == 20)\n  {\n   count = 0;\n   delay(3000);\n  }\n}\n\
    ```\n\nYou may have noticed the following line:\n\n```cpp\ncount ++;\n```\n\n\
    This is just C shorthand for the following:\n\n```cpp\ncount = count + 1;\n```\n\
    \nSo now each time that `loop` is run, it will take just a bit more than 200 milliseconds,\
    \ unless it’s the 20th time round the loop, in which case it will take the same\
    \ plus the three seconds delay between each batch of 20 flashes. In fact, for\
    \ some applications, even this is too slow, and purists would say that you should\
    \ not use `delay` at all. The best solution depends on the application.\n\n###\
    \ while\n\nAnother way of looping in C is to use the `while` command in place\
    \ of the `for` command. You can accomplish the same thing as the preceding `for`\
    \ example using a `while` command as follows:\n\n```cpp\nint i = 0;\nwhile (i\
    \ < 20)\n{\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  i ++;\n}\n```\n\nThe expression in parentheses\
    \ after `while` must be true to stay in the `loop`. When it is no longer true,\
    \ then the sketch continues running the commands after the final curly brace.\n\
    \n### Constants\n\nFor constant values like pin assignments that do not change\
    \ during the running of a sketch, use the keyword `const`, which tells the compiler\
    \ that the variable has a constant value and is not going to change.\n\nAs an\
    \ example, you could define a pin assignment for an LED like this:\n\n```cpp\n\
    const int ledPin = 13;\n```\n\nAny sketch that you write will work just as well\
    \ without the `const` keyword in front of any such variables, but it will make\
    \ the program slightly smaller, something that can become significant as your\
    \ sketches get bigger. In any case, it’s a good habit to get into for any variables\
    \ whose value is not going to change.\n\n### Conclusion\n\nThis chapter has got\
    \ you started with C. You can make LEDs blink in various exciting ways and get\
    \ the Arduino to send results back to you over the USB by using the `Serial.println`\
    \ function. You also worked out how to use `if` and `for` commands to control\
    \ the order in which your commands are executed, and learned a little about making\
    \ an Arduino do some arithmetic.\n\nIn the next chapter, you will look more closely\
    \ at functions. The chapter will also introduce the variable types other than\
    \ the `int` type that you used in this chapter.\n\n# 4. Functions\n\nThis chapter\
    \ focuses mostly on the type of functions that you can write yourself rather than\
    \ the built-in functions such as `digitalWrite` and `delay`, which are already\
    \ defined for you.\n\nThe reason that you need to be able to write your own functions\
    \ is that as sketches start to get a little complicated, then your `setup` and\
    \ `loop` functions will grow and grow until they are long and complicated and\
    \ it becomes difficult to see how they work.\n\nThe biggest problem in software\
    \ development of any sort is managing complexity. The best programmers write software\
    \ that is easy to look at and understand and requires very little in the way of\
    \ explanation.\n\nFunctions are a key tool in creating easy-to-understand sketches\
    \ that can be changed without difficulty or risk of the whole thing falling into\
    \ a crumpled mess.\n\n### What Is a Function?\n\nA function is a little like a\
    \ program within a program. You can use it to wrap up some little thing that you\
    \ want to do. A function that you define can be called from anywhere in your sketch\
    \ and contains its own variables and its own list of commands. When the commands\
    \ have been run, execution returns to the point just after wherever it was in\
    \ the code that called the function.\n\nBy way of an example, code that flashes\
    \ a light-emitting diode (LED) is a prime example of some code that should be\
    \ put in a function. So let’s modify our basic “blink 20 times” sketch to use\
    \ a function that we will create called `flash`:\n\n```cpp\n// sketch 4-01\nconst\
    \ int ledPin = 13;\nconst int delayPeriod = 250;\n\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop()\n{\n  for (int i = 0; i < 20; i ++)\n  {\n    flash();\n\
    \  }\n  delay(3000);\n}\n\nvoid flash()\n{\n   digitalWrite(ledPin, HIGH);\n \
    \  delay(delayPeriod);\n   digitalWrite(ledPin, LOW);\n   delay(delayPeriod);\n\
    }\n```\n\nSo, all we have really done here is to move the four lines of code that\
    \ flash the LED from the middle of the `for` loop to be in a function of their\
    \ own called `flash`. Now you can make the LED flash any time you like by just\
    \ calling the new function by writing `flash()`. Note the empty parentheses after\
    \ the function name. This indicates that the function does not take any parameters.\
    \ The delay value that it uses is set by the same `delayPeriod` variable that\
    \ you used before.\n\n### Parameters\n\nWhen we call `flash`, we provide it how\
    \ many times to flash and how long the delay should be. In this case, we provide\
    \ two arguments.\n\n```cpp\n// sketch 4-02\nconst int ledPin = 13;\nconst int\
    \ delayPeriod = 250;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid\
    \ loop()\n{\n  flash(20, delayPeriod);\n  delay(3000);\n}\n\nvoid flash(int numlashes,\
    \ int d)\n{\n  for (int i = 0; i < numlashes; i++)\n  {\n    digitalWrite(ledPin,\
    \ HIGH);\n    delay(d);\n    digitalWrite(ledPin, LOW);\n    delay(d);\n  }\n\
    }\n```\n\nNow, if we look at our `loop` function, it has two lines in it. When\
    \ we call `flash` we supply it with two arguments. Where we define the function\
    \ at the bottom of the sketch, we declare the type of variable. In this case,\
    \ they are both `int`. However, these variables (`numlashes` and `d`) can only\
    \ be used within the `flash` function.\n\nThis is a good function because it wraps\
    \ up everything you need in order to flash an LED. The only information that it\
    \ needs from outside the function is which pin the LED is attached. If you wanted,\
    \ you could make this a parameter too—something that would be well doing if you\
    \ had more than one LED attached to your Arduino.\n\n### Global, Local, and Static\
    \ Variables\n\nAs was mentioned before, parameters to a function can be used only\
    \ inside that function. So, if you wrote the following code, you would get an\
    \ error:\n\n```cpp\nvoid indicate(int x)\n{\n  flash(x, 10);\n}\nx = 15;\n```\n\
    \nOn the other hand, suppose you wrote this:\n\n```cpp\nint x = 15;\nvoid indicate(int\
    \ x)\n{\n  flash(x, 10);\n}\n```\n\nThis code would not result in a compilation\
    \ error. However, you need to be careful, because you now actually have two variables\
    \ called `x` and they can each have different values. The one that you declared\
    \ on the first line is called a global variable. It is called global because it\
    \ can be used anywhere you like in the program, including inside any functions.\n\
    \nHowever, because you use the same variable name `x` inside the function as a\
    \ parameter, you cannot use the global variable `x` simply because whenever you\
    \ refer to `x` inside the function, the \"local\" version of `x` has priority.\
    \ The parameter `x` is said to shadow the global variable of the same name. This\
    \ can lead to some confusion when trying to debug a project.\n\nIn addition to\
    \ defining parameters, you can also define variables that are not parameters but\
    \ are just for use within a function. These are called local variables. For example:\n\
    \n```cpp\nvoid indicate(int x)\n{\n  int timesToFlash = x * 2;\n  flash(timesToFlash,\
    \ 10);\n}\n```\n"
  raw: "```\n// sketch 3-09\nint ledPin = 13;\nint delayPeriod = 100;\nint count =\
    \ 0;\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n digitalWrite(ledPin,\
    \ HIGH);\n delay(delayPeriod);\n digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n\
    \ count ++;\n if (count == 20)\n {\n   count = 0;\n   delay(3000);\n }\n}\n```\n\
    \nYou may have noticed the following line:\n\n```\ncount ++;\n```\n\nThis is just\
    \ C shorthand for the following:\n\n```\ncount = count + 1;\n```\n\nSo now each\
    \ time that **loop** is run, it will take just a bit more than 200 milliseconds,\
    \ unless it’s the 20th time round the loop, in which case it will take the same\
    \ plus the three seconds delay between each batch of 20 flashes. In fact, for\
    \ some applications, even this is too slow, and purists would say that you should\
    \ not use **delay** at all. The best solution depends on the application.\n\n\
    #### while\n\nAnother way of looping in C is to use the **while** command in place\
    \ of the **for** command. You can accomplish the same thing as the preceding **for**\
    \ example using a **while** command as follows:\n\n```\nint i = 0;\nwhile (i <\
    \ 20)\n{\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  i ++;\n}\n```\n\nThe expression in parentheses\
    \ after **while** must be true to stay in the **loop**. When it is no longer true,\
    \ then the sketch continues running the commands after the final curly brace.\n\
    \n* * *\n\n### Constants\n\nFor constant values like pin assignments that do not\
    \ change during the running of a sketch, use the keyword **const**, which tells\
    \ the compiler that the variable has a constant value and is not going to change.\n\
    \nAs an example, you could define a pin assignment for a LED like this:\n\n```\n\
    const int ledPin = 13;\n```\n\nAny sketch that you write will work just as well\
    \ without the **const** keyword in front of any such variables, but it will make\
    \ the program slightly smaller, something that can become significant as your\
    \ sketches get bigger. In any case, it’s a good habit to get into for any variables\
    \ whose value is not going to change.\n\n* * *\n\n### Conclusion\n\nThis chapter\
    \ has got you started with C. You can make LEDs blink in various exciting ways\
    \ and get the Arduino to send results back to you over the USB by using the **Serial.println**\
    \ function. You also worked out how to use **if** and **for** commands to control\
    \ the order in which your commands are executed, and learned a little about making\
    \ an Arduino do some arithmetic.\n\nIn the next chapter, you will look more closely\
    \ at functions. The chapter will also introduce the variable types other than\
    \ the **int** type that you used in this chapter.\n\n## 4\n\n## Functions\n\n\
    This chapter focuses mostly on the type of functions that you can write yourself\
    \ rather than the built-in functions such as **digitalWrite** and **delay**, which\
    \ are already defined for you.\n\nThe reason that you need to be able to write\
    \ your own functions is that as sketches start to get a little complicated, then\
    \ your **setup** and **loop** functions will grow and grow until they are long\
    \ and complicated and it becomes difficult to see how they work.\n\nThe biggest\
    \ problem in software development of any sort is managing complexity. The best\
    \ programmers write software that is easy to look at and understand and requires\
    \ very little in the way of explanation.\n\nFunctions are a key tool in creating\
    \ easy-to-understand sketches that can be changed without difficulty or risk of\
    \ the whole thing falling into a crumpled mess.\n\n* * *\n\n### What Is a Function?\n\
    \nA function is a little like a program within a program. You can use it to wrap\
    \ up some little thing that you want to do. A function that you define can be\
    \ called from anywhere in your sketch and contains its own variables and its own\
    \ list of commands. When the commands have been run, execution returns to the\
    \ point just after wherever it was in the code that called the function.\n\nBy\
    \ way of an example, code that flashes a light-emitting diode (LED) is a prime\
    \ example of some code that should be put in a function. So let’s modify our basic\
    \ “blink 20 times” sketch to use a function that we will create called **flash**:\n\
    \n```\n// sketch 4-01\nconst int ledPin = 13;\nconst int delayPeriod = 250;\n\n\
    void setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n  for (int i\
    \ = 0; i < 20; i ++)\n  {\n    flash();\n  }\n  delay(3000);\n}\n\nvoid flash()\n\
    {\n   digitalWrite(ledPin, HIGH);\n   delay(delayPeriod);\n   digitalWrite(ledPin,\
    \ LOW);\n   delay(delayPeriod);\n}\n```\n\nSo, all we have really done here is\
    \ to move the four lines of code that flash the LED from the middle of the **for**\
    \ loop to be in a function of their own called **flash**. Now you can make the\
    \ LED flash any time you like by just calling the new function by writing **flash()**.\
    \ Note the empty parentheses after the function name. This indicates that the\
    \ function does not take any parameters. The delay value that it uses is set by\
    \ the same **delayPeriod** variable that you used before.\n\n* * *\n\n### Parameters\n\
    \nWhen dividing your sketch up into functions, it is often worth thinking about\
    \ what service a function could provide. In the case of **flash**, this is fairly\
    \ obvious. But this time, let’s give this function parameters that tell it both\
    \ how many times to flash and how short or long the flashes should be. Read through\
    \ the following code and then I will explain just how parameters work in a little\
    \ more detail.\n\n```\n// sketch 4-02\nconst int ledPin = 13;\nconst int delayPeriod\
    \ = 250;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n\
    \  flash(20, delayPeriod);\n  delay(3000);\n}\n\nvoid flash(int numFlashes, int\
    \ d)\n{\n  for (int i = 0; i < numFlashes; i ++)\n  {\n    digitalWrite(ledPin,\
    \ HIGH);\n    delay(d);\n    digitalWrite(ledPin, LOW);\n    delay(d);\n  }\n\
    }\n```\n\nNow, if we look at our **loop** function, it has only two lines in it.\
    \ We have moved the bulk of the work off to the **flash** function. Notice how\
    \ when we call **flash** we now supply it with two arguments in parentheses.\n\
    \nWhere we define the function at the bottom of the sketch, we have to declare\
    \ the type of variable in the parameters. In this case, they are both **int**s.\
    \ We are in fact defining new variables. However, these variables (**numFlashes**\
    \ and **d**) can only be used within the **flash** function.\n\nThis is a good\
    \ function because it wraps up everything you need in order to flash an LED. The\
    \ only information that it needs from outside of the function is to which pin\
    \ the LED is attached. If you wanted, you could make this a parameter too—something\
    \ that would be well worth doing if you had more than one LED attached to your\
    \ Arduino.\n\n* * *\n\n### Global, Local, and Static Variables\n\nAs was mentioned\
    \ before, parameters to a function can be used only inside that function. So,\
    \ if you wrote the following code, you would get an error:\n\n```\nvoid indicate(int\
    \ x)\n{\n  flash(x, 10);\n}\nx = 15;\n```\n\nOn the other hand, suppose you wrote\
    \ this:\n\n```\nint x = 15;\nvoid indicate(int x)\n{\n  flash(x, 10);\n}\n```\n\
    \nThis code would not result in a compilation error. However, you need to be careful,\
    \ because you now actually have two variables called **x** and they can each have\
    \ different values. The one that you declared on the first line is called a *global\
    \ variable.* It is called *global* because it can be used anywhere you like in\
    \ the program, including inside any functions.\n\nHowever, because you use the\
    \ same variable name **x** inside the function as a parameter, you cannot use\
    \ the global variable **x** simply because whenever you refer to **x** inside\
    \ the function, the “local” version of **x** has priority. The parameter **x**\
    \ is said to shadow the global variable of the same name. This can lead to some\
    \ confusion when trying to debug a project.\n\nIn addition to defining parameters,\
    \ you can also define variables that are not parameters but are just for use within\
    \ a function. These are called *local variables.* For example:\n\n```\nvoid indicate(int\
    \ x)\n{\n  int timesToFlash = x * 2;\n  flash(timesToFlash, 10);\n}\n```"
