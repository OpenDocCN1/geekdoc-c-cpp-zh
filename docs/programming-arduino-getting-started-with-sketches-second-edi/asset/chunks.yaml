  trans: "\n从图 4-1 中的真值表中，你可以看到对于 `and`，如果 A 和 B 都为真，那么结果将为真；否则，结果为假。\n\n![image](img/fig-ch4-1.jpg)\n\
    \n图 4.1 *真值表*。\n\n另一方面，使用 `or` 运算符，如果 A 或 B 或 A 和 B 都为真，那么结果将为真。只有当 A 和 B 都为假时，结果才为假。\n\
    \n除了 `and` 和 `or` 之外，还有 `not` 运算符，写做 `!`。你不会惊讶地发现，“非真”是假，而“非假”是真。\n\n你可以在 `if`\
    \ 语句中将这些运算符组合成布尔表达式，如下例所示：\n\n```\nif ((x > 10) && (x < 50))\n```\n\n## 其他数据类型\n\
    \n正如你所见的，`int` 和偶尔使用的 `float` 数据类型在大多数情况下都是可以的；然而，在某些情况下，其他数值类型可能很有用。在 Arduino\
    \  sketch 图中，`int` 类型使用 16 位（二进制数字）。这允许它表示 –32768 到 32767 之间的数字。\n\n其他可用数据类型总结在表\
    \ 4-1 中。此表主要供参考。随着你不断阅读这本书，你将使用其中一些其他类型。\n\n| **类型** | **内存 (字节)** | **范围** |\
    \ **备注** |\n| --- | --- | --- | --- |\n| **boolean** | 1 | 真或假 (0 或 1) |  |\n\
    | **char** | 1 | –128 到 +127 | 用于表示美国信息交换标准 (ASCII) 字符码；例如，`A` 表示为 65。通常不使用其负数。\
    \ |\n| **byte** | 1 | 0 到 255 | 通常用于作为单个数据单元传输串口数据。参见第 9 章。 |\n| **int** | 2 |\
    \ –32768 到 +32767 |  |\n| **unsigned int** | 2 | 0 到 65535 | 可用于不需要负数时的额外精度。使用时要小心，因为对\
    \ `int` 进行算术运算会导致意外结果。 |\n| **long** | 4 | –2,147,483,648 到 2,147,483,647 | 仅在表示极大数字时需要。\
    \ |\n| **unsigned long** | 4 | 0 到 4,294,967,295 | 参见 `unsigned int`。 |\n| **float**\
    \ | 4 | –3.4028235E+38 到 + 3.4028235E+38 |  |\n| **double** | 4 | 与 `float` 相同\
    \ | 通常，这将是 8 字节且比 `float` 精度更高、范围更大。但在 Arduino 上，它与 `float` 相同。 |\n\n表 4-1 *C\
    \ 中的数据类型*\n\n需要考虑的一点是，如果数据类型超过它们的范围，就会发生奇怪的事情。所以，如果你有一个值为 255 的 `byte` 变量并对其加\
    \ 1，你将得到 0。令人警觉的是，如果你有一个值为 32767 的 `int` 变量并对其加 1，你最终将得到 –32768。\n\n在你不完全熟悉这些不同的数据类型之前，我建议坚持使用\
    \ `int`，因为它几乎可以处理所有情况。\n\n## 编码风格\n\nC 编译器并不在乎你如何布局代码。对它来说，你可以将所有内容写在一行内，并在每个语句之间加上分号。然而，布局良好、整洁的代码比布局糟糕的代码要易读和维护得多。从这个意义上说，阅读代码就像读书：格式非常重要。\n\
    \n在某种程度上，格式是个人品味的问题。没有人喜欢被认为自己的品味不好，因此关于代码应该长什么样子的争论可能会变成个人问题。程序员在被要求处理别人的代码时，往往从将所有代码重新格式化为自己偏好的呈现风格开始，这并不罕见。\n\
    \n为了解决这个问题，通常会制定编码标准，以鼓励每个人以相同的方式布局代码，并在编写程序时采用“良好实践”。\n\nC 语言有一种多年演变而来的事实标准，而这本书通常遵循该标准。\n\
    \n### 缩进\n\n在你看过的示例图中，你可以看到我们经常从左边距对程序代码进行缩进。例如，在定义一个 `void` 函数时，`void` 关键字位于左边距处，下一行的左大括号也是如此，但大括号内的所有文本都缩进了。缩进的多少并不重要。有些人使用两个空格，另人使用四个。你也可以按\
    \ TAB 键来缩进。在书中，我们使用两个空格进行缩进。\n\n如果你在函数定义内部有一个 `if` 语句，那么你再次需要为大括号内的行再增加两个空格。\n\
    \n```\nif ((x > 10) && (x < 50))\n```\n\n### 左大括号\n\n关于放在哪里放置大括号，有两种观点。一种方法是将大括号放在命令的下一行，如下：\n\
    \n```\nvoid loop()\n\n\n count = 0;\n\n\n\n (count  00)\ncount =00\n\n(3000)\n\
    \ }\n```\n\n### 空格\n\n编译器忽略空格、制表符和换行符，除非它们作为分隔“标记”或单词的方式。因此，下面的示例可以无问题地编译：\n\n\
    ```\nvoid loop() {static int count=0;count++;if(count==20){count=0;delay(3000);}}\n\
    ```\n\n### 注释\n\n注释是与程序代码一起保留在 sketch 中的文本，但并不执行任何编程功能。注释的唯一目的是提醒你或他人代码之所以是这样写的。注释行也可以用于显示标题。\n\
    \n编译器将完全忽略任何标记为注释的文本。到目前为止，我们已经在许多 sketch 的顶部包含了注释作为标题。\n\n注释有两种语法形式：\n\n♦ 单行注释，以\
    \ `//` 开始，并在行尾结束。\n\n♦ 多行注释，以 `/***` 开始并以 `***/**`结束。\n\n以下是一个使用了这两种注释形式的示例：\n\
    \n```\n/* 一个不太实用的循环函数。\n作者：Simon Monk\n为了说明注释的概念\n*/\nvoid loop() {\n static int\
    \ count = 0;\n count ++; 单行注释\n if (count == 20) {\n   count = 0;\n   delay(3000);\n\
    \ }\n}\n```\n"
- fmt: "\n- To describe anything that the user needs to do that is not part of the\
    \ program; for example, `// this pin should be connected to the transistor controlling\
    \ the relay`\n- To leave yourself notes; for example, `// todo: tidy this - it’s\
    \ a mess`\n\nThis last point illustrates a useful technique of `todo`s in comments.\
    \ Programmers often put `todo`s in their code to remind themselves of something\
    \ they need to do later. They can always use the search facility in their integrated\
    \ development environment (IDE) to find all occurrences of `// todo` in their\
    \ program.\n\nThe following are *not* good examples of reasons you should use\
    \ comments:\n\n- To state the blatantly obvious; for example, `a = a + 1; // add\
    \ 1 to a.`.\n- To explain badly written code. Don’t comment on it; just write\
    \ it clearly in the first place.\n\n***\n\n### Conclusion\n\nThis has been a bit\
    \ of a theoretical chapter. You have had to absorb some new abstract concepts\
    \ concerned with organizing our sketches into functions and adopting a style of\
    \ programming that will save you time in the long run.\n\nIn the next chapter,\
    \ you can start to apply some of what you have learned and look at better ways\
    \ of structuring your data and using text strings.\n\n# 5\n\n## Arrays and Strings\n\
    \nAfter reading [Chapter 4](#13_Chapter_04.xhtml), you have a reasonable appreciation\
    \ as to how to structure your sketches to make your life easier. If there is one\
    \ thing that a good programmer likes, it’s an easy life. Now our attention is\
    \ going to turn to the data that you use in your sketches.\n\nThe book *Algorithms\
    \ + Data Structures = Programs* by Niklaus Wirth (Prentice-Hall, 1976) has been\
    \ around for a good while now, but still manages to capture the essences of computer\
    \ science and programming in particular. I can strongly recommend it to anyone\
    \ who finds themselves bitten by the programming bug. It also captures the idea\
    \ that to write a good program, you need to think about both the algorithm (what\
    \ you do) and the structure of the data you use.\n\nYou have looked at `loop`s,\
    \ `if` statements, and what is called the “algorithmic” side of programming an\
    \ Arduino; you are now going to turn to how you structure your data.\n\n***\n\n\
    ### Arrays\n\nArrays are a way of containing a list of values. The variables that\
    \ you have met so far have contained only a single value, usually an `int`. By\
    \ contrast, an array contains a list of values, and you can access any one of\
    \ those values by its position in the list.\n\nC, in common with the majority\
    \ of programming languages, begins its index positions at 0 rather than 1. This\
    \ means that the first element is actually element zero.\n\nTo illustrate the\
    \ use of arrays, we could create an example application that repeatedly flashes\
    \ “SOS” in Morse code using the Arduino board’s built-in LED.\n\nMorse code used\
    \ to be a vital method of communication in the 19th and 20th centuries. Because\
    \ of its coding of letters as a series of long and short dots, Morse code can\
    \ be sent over telegraph wires, over a radio link, and using signaling lights.\
    \ The letters “SOS” (often taken to mean “save our souls”) are still recognized\
    \ as an international signal of distress.\n\nThe letter “S” is represented as\
    \ three short flashes (dots) and the letter “O” by three long flashes (dashes).\
    \ You are going to use an array of `int`s to hold the duration of each flash that\
    \ you are going to make. You can then use a `for` loop to step through each of\
    \ the items in the array, making a flash of the appropriate duration.\n\nFirst,\
    \ let’s have a look at how you are going to create an array of `int`s containing\
    \ the durations.\n\n```cpp\nint durations[] = {200, 200, 200, 500, 500, 500, 200,\
    \ 200, 200};\n```\n\nYou indicate that a variable contains an array by placing\
    \ `[]` after the variable name.\n\nIn this case, you are going to set the values\
    \ for the durations at the time that you create the array. The syntax for doing\
    \ this is to use curly braces and then values each separated by commas. Don’t\
    \ forget the semicolon on the end of the line.\n\nYou can access any given element\
    \ of the array using the square bracket notation. So, if you want to get the first\
    \ element of the array, you can write the following:\n\n```cpp\ndurations[0]\n\
    ```\n\nTo illustrate this, let’s create an array and then print out all its values\
    \ to the Serial Monitor:\n\n```cpp\n// sketch 5-01\n\nint durations[] = {200,\
    \ 200, 200, 500, 500, 500, 200, 200, 200};\n\nvoid setup()\n{\n  Serial.begin(9600);\
    \ \n  for (int i = 0; i < 9; i++)\n  {\n    Serial.println(durations[i]);\n  }\n\
    }\n\nvoid loop() {}\n```\n\nNote that you can use the keyword `const` with arrays\
    \ as well as ordinary variables, just as long as you do not intend to modify the\
    \ array within your sketch.\n\nUpload the sketch to your board and then open the\
    \ Serial Monitor. If all is well, you will see something like [Figure 5-1](#14_Chapter_05.xhtml_fig-ch5-1).\n\
