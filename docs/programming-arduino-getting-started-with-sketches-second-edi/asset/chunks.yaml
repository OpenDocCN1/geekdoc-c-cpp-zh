  trans: "\n你可以通过对随机数生成器进行“种子”（seeding）来提供这种干预，使数字序列变得不可预测。这基本上只是为它提供了一个起点。但是，如果你仔细考虑，你不能仅仅使用\
    \ `random` 来为随机数生成器赋值。一个常用的技巧是利用（正如在前章中讨论过的）模拟输入会浮动的特性。因此，可以使用从模拟输入读取的值作为随机数生成器的种子。\n\
    \n执行此操作的函数称为 `randomSeed`。示例 7-02 展示了如何为你的随机数生成器增加更多的随机性。\n\n```\n//sketch 7-02\n\
    \nvoid setup()\n{\n  Serial.begin(9600);\n  randomSeed(analogRead(0));\n}\n\n\
    void loop()\n{\n  int number = random(1, 7);\n  Serial.println(number);\n  delay(500);\
    \ \n}\n```\n\n尝试按几次复位按钮。你现在可以看到你的随机序列每次都是不同的。\n\n这种类型的随机数生成不能用于任何类型的抽票。为了获得更好的随机数生成，你需要硬件随机数生成器，它有时基于随机事件，例如宇宙射线事件。\n\
    \n* * *\n\n### 数学函数\n\n在少数情况下，你需要在 Arduino 上进行大量的数学运算，而不仅仅是一些算术运算。但是，如果你需要，有一个巨大的数学函数库供你使用。这些函数中最用的总结在下表中：\n\
    \n| 函数 | 说明 | 示例 |\n| --- | --- | --- |\n| `abs` | 返回其参数的绝对值。 | `abs(12) 返回 12`,\
    \ `abs(-12) 返回 12` |\n| `constrain` | 将数字限制在范围内使其防止超出。第一个参数是待限制的数字，第二个是范围的起点，第三个是允许数字范围的终点。\
    \ | `constrain(8, 1, 10) 返回 8`, `constrain(11, 1, 10) 返回 10`, `constrain(0, 1,\
    \ 10) 返回 1` |\n| `map` | 将一个范围内的数字映射到另一个范围。第一个参数是待映射的数字，第二个和第三个是“从”范围（或源范围），最后两个是“到”范围（或目标范围）。该函数对于重新映射模拟输入值非常有用。\
    \ | `map(x, 0, 1023, 0, 5000)` |\n| `max` | 返回两个参数中较大的一个。 | `max(10, 11) 返回 11`\
    \ |\n| `min` | 返回两个参数中较小的一个。 | `min(10, 11) 返回 10` |\n| `pow` | 返回第一个参数的第二个参数的幂。\
    \ | `pow(2, 5) 返回 32` |\n| `sqrt` | 返回数字的平方根。 | `sqrt(16) 返回 4` |\n| `sin, cos,\
    \ tan` | 执行三角函数。它们不经常被使用。 | |\n| `log` | 从对数热电阻计算温度（例如）。 | |\n\n* * *\n\n### 位操作\n\
    \n位（bit）是二进制信息的单个数字，即 0 或 1。单词 `bit` 实际上是 `binary digit`（二进制数字）的缩写。大多数时候，你使用的\
    \ `int` 变量实际上由 16 位组成。如果你只需要存储一个简单的真/假值（1 或 0），这有点浪费空间。实际上，除非你的内存短缺，否则浪费空间比创建难以理解的代码问题小得多，但有时能够紧凑地打包数据是有用的。\n\
    \n`int` 中的每个位都可以被认为具有一个十进制值，你可以通过相加所有值为 1 的位的值来找到 `int` 的十进制值。因此在图 7-2 中，`int`\
    \ 的十进制值为 38。实际上，处理负数会更复杂，但只有当最左边的位变为 1 时才会发生。\n\n![image](img/fig-ch7-2.jpg)\n\
    \n图 7.2 *一个 `int`*\n\n当你考虑单个位时，十进制值的效果并不理想。很难可视化像 123 这样的十进制数字哪些位被设置了。由于这个原因，程序员经常使用所谓的十六进制\
    \ `hexadecimal`，或者更常见地直接称为 `hex`。十六进制是 16 进制的。因此，你不仅有 0 到 9 的数字，还有额外的六个数字 A 到\
    \ F。这意味着每个十六进制位代表四个位。下表显示了 0 到 15 的十进制、十六进制和二进制之间的关系：\n\n| 十进制 | 十六进制 | 二进制（四位）\
    \ |\n| --- | --- | --- |\n| 0 | 0 | 0000 |\n| 1 | 1 | 0001 |\n| 2 | 2 | 0010 |\n\
    | 3 | 3 | 0011 |\n| 4 | 4 | 0100 |\n| 5 | 5 | 0101 |\n| 6 | 6 | 0110 |\n| 7 |\
    \ 7 | 0111 |\n| 8 | 8 | 1000 |\n| 9 | 9 | 1001 |\n| 10 | A | 1010 |\n| 11 | B\
    \ | 1011 |\n| 12 | C | 1100 |\n| 13 | D | 1101 |\n| 14 | E | 1110 |\n| 15 | F\
    \ | 1111 |\n\n### 高级 I/O\n\n有一些实用的小函数可以让你在执行输入输出任务时变得更轻松。\n\n#### 生成音调\n\n`tone`\
    \ 函数允许你在输出引脚上生成方波信号（见图 7-3）。这样做的最常见目的是使用扬声器或蜂鸣器产生可见的声音。\n\n![image](img/fig-ch7-3.jpg)\n\
    \n图 7.3 *方波信号*\n\n`tone` 函数接受两个或三个参数。第一个参数总是生成音调的引脚编号，第二个参数是频率（赫兹 Hz），最后一个参数是持续时间。如果没有指定持续，音调将持续播放，如示例\
    \ 7-03 所示。这就是为什么我们将 `tone` 函数调用放在 `setup` 中而不是 `loop` 中。\n\n```\n//sketch 7-03\n\
    \nvoid setup()\n{\n  tone(4, 500);\n}\n\nvoid loop() {}\n```\n\n要停止正在播放的音调，你可以使用\
    \ `noTone` 函数。该函数只有一个参数，即播放音调的引脚。\n\n#### 馈移位寄存器\n\n有时 Arduino Uno 的引脚并不够。例如，在驱动大量\
    \ LED 时，一种常用技术是使用移位寄存器。该芯片一次读取一个位的数据，当它有足够的数据时，它会将所有位锁存到一组输出上（每个位一个输出）。\n\n为了帮助你使用这种技术，有一个实用的函数称为\
    \ `shiftOut`。该函数接受四个参数：\n\n- 要发送的位将出现的引脚编号。\n- 用作时钟引脚的引脚编号。每发送一个位，它就会翻转一次。\n-\
    \ 一个标志，决定是从最低位还是最高位开始发送位。这应该是常量 `MSBFIRST` 或 `LSBFIRST` 之一。\n\n"
- fmt: "\n♦ The byte of data to be sent.\n\n## Interrupts\n\nOne of the things that\
    \ tend to frustrate programmers used to “programming in the large” is that the\
    \ Arduino can do only one thing at a time. If you like to have lots of threads\
    \ of execution all running at the same time in your programs, then you are out\
    \ of luck. Although a few people have developed projects that can execute multiple\
    \ threads in this way, generally this capability is unnecessary for the type of\
    \ uses that an Arduino is normally put to. The closest an Arduino usually gets\
    \ to such execution is the use of interrupts.\n\nTwo of the pins on the Arduino\
    \ Uno (`D2` and `D3`) can have interrupts attached to them. That is, these pins\
    \ act as inputs that, if the pins receive a signal in a specified way, the Arduino’s\
    \ processor will suspend whatever it was doing and run a function attached to\
    \ that interrupt.\n\nSketch 7-04 blinks an LED, but then changes the blink period\
    \ when an interrupt is received. You can simulate an interrupt by connecting your\
    \ wire between pin `D2` and `GND` and using the internal pull-up resistor to keep\
    \ the interrupt high most of the time.\n\n```\n//sketch 7-04\n\nconst int interruptPin\
    \ = 2;\nconst int ledPin = 13;\nint period = 500;\n\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n  pinMode(interruptPin, INPUT_PULLUP);\n  attachInterrupt(0, goFast,\
    \ FALLING);\n}\n\nvoid loop() \n{\n  digitalWrite(ledPin, HIGH);\n  delay(period);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(period);  \n}\n\nvoid goFast()\n{\n  period\
    \ = 100;\n}\n```\n\nThe following is the key line in the `setup` function of this\
    \ sketch:\n\n```\nattachInterrupt(0, goFast, FALLING);\n```\n\nThe first argument\
    \ specifies which of the two interrupts you want to use. Rather confusingly, a\
    \ `0` here means you are using pin `2`, while a `1` means you are using pin `3`.\n\
    \nThe next argument is the name of the function that is to be called when there\
    \ is an interrupt, and the final argument is a constant that will be one of `CHANGE`,\
    \ `RISING`, or `FALLING`. [Figure 7-4](#16_Chapter_07.xhtml_fig-ch7-4) summarizes\
    \ these options.\n\n![image](images/fig-ch7-4.jpg)\n\nFigure 7.4 *Types of interrupt\
    \ signals*. \n\nIf the interrupt mode is `CHANGE`, then either a `RISING` from\
    \ `0` to `1` or a `FALLING` from `1` to `0` will both trigger an interrupt.\n\n\
    You can disable interrupts using the function `noInterrupts`. This stops all interrupts\
    \ from both interrupt channels. You can resume using interrupts again by calling\
    \ the function `interrupts`.\n\nDifferent Arduino boards have different interrupt\
    \ names for different pins so if you are not using an Arduino Uno, check the documentation\
    \ for your board on [http://www.arduino.cc](http://www.arduino.cc).\n\n## Conclusion\n\
    \nIn this chapter, you have looked at some of the handy features that the Arduino\
    \ standard library provides. These features will save you some programming effort,\
    \ and if there is one thing a good programmer likes, it is being able to use high-quality\
    \ work done by other people.\n\nIn the next chapter, we will extend what we learned\
    \ about data structures in [Chapter 5](#14_Chapter_05.xhtml) and look at how you\
    \ go about remembering data on the Arduino after the power goes off.\n\n## 8 Data\
    \ Storage\n\nWhen you give values to variables, the Arduino board will remember\
    \ those values only as long as the power is on. The moment that you turn the power\
    \ off or reset the board, all that data is lost.\n\nIn this chapter, we look at\
    \ some ways to hang on to that data.\n\n## Constants\n\nIf the data that you want\
    \ to store does not change, then you can just set the data up each time that the\
    \ Arduino starts. An example of this approach is the case in the `letters` array\
    \ in your Morse code translator of [Chapter 5](#14_Chapter_05.xhtml) (sketch 5-05).\n\
    \nYou used the following code to define a variable of the correct size and fill\
    \ it with the data that you needed:\n\n```\nchar* letters[] = {\n  \".-\", \"\
    -...\", \"-.-.\", \"-..\", \".\", \n     \"..-.\", \"--.\", \"....\", \"..\",\
    \    // A-I\n  \".---\", \"-.-\", \".-..\", \"--\", \"-.\", \n     \"---\", \"\
    .--.\", \"--.-\", \".-.\",  // J-R\n  \"...\", \"-\", \"..-\", \"...-\", \".--\"\
    , \n     \"-..-\", \"-.--\", \"--..\"          // S-Z\n};\n```\n\nYou may remember\
    \ that you did the calculation and decided that you had plenty of your meager\
    \ 2K to spare. However, if memory was a bit tight, it would be far better to be\
    \ able to store this data in the 32K of flash memory used to store programs, rather\
    \ than the 2K of RAM. There is a means of doing this. It is a directive called\
    \ `PROGMEM;` it lives in a library and is a bit awkward to use.\n\n## Storing\
    \ Data in Flash Memory\n\nTo store your data in flash memory, you have to include\
    \ the `PROGMEM` library as follows:\n\n```\n#include <avr/pgmspace.h>\n```\n\n\
    The purpose of this command is to tell the compiler to use the `pgmspace` library\
    \ for this sketch.\n\nThe `PROGMEM` keyword indicates that the data structure\
    \ is to be stored in flash. You can only store constants like this; once in flash,\
    \ the data structure cannot be changed, hence the use of `const`. The size of\
    \ the array also has to be fully specified as 26 letters by `maxLen` (minus 1)\
    \ dots and dashes.\n\nThe structure to contain the letters now looks like this:\n\
    \n```\nPROGMEM const letters[26][maxLen] = {\n  \".-\", \"-...\", \"-.-.\", \"\
    -..\", \".\", \n     \"..-.\", \"--.\", \"....\", \"..\",    // A-I\n  \".---\"\
    , \"-.-\", \".-..\", \"--\", \"-.\", \n     \"---\", \".--.\", \"--.-\", \".-.\"\
    ,  // J-R\n  \"...\", \"-\", \"..-\", \"...-\", \".--\", \n     \"-..-\", \"-.--\"\
    , \"--..\"          // S-Z\n};\n```\n\nThe `loop` function is also slightly different\
    \ from sketch 5-05.\n\n```cpp\nvoid loop()                    \n{\n  char ch;\n\
    \  char sequence[maxLen];\n  if (Serial.available() > 0)\n  {\n    ch = Serial.read();\n\
    \    if (ch >= 'a' && ch <= 'z')\n    {\n      memcpy_P(&sequence, letters[ch\
    \ - 'a'], maxLen);\n      flashSequence(sequence);\n    }\n    else if (ch >=\
    \ 'A' && ch <= 'Z')\n    {\n      memcpy_P(&sequence, letters[ch - 'A'], maxLen);\n\
    \      flashSequence(sequence);\n    }\n    else if (ch >= '0' && ch <= '9')\n\
    \    {\n      memcpy_P(&sequence, numbers[ch - '0'], maxLen);\n      flashSequence(sequence);\n\
    \    }\n    else if (ch == ' ')\n    {\n      delay(dotDelay * 4);  // gap between\
    \ words  \n    }\n  }\n}\n```\n"
  raw: "♦ The byte of data to be sent.\n\n* * *\n\n### Interrupts\n\nOne of the things\
    \ that tend to frustrate programmers used to “programming in the large” is that\
    \ the Arduino can do only one thing at a time. If you like to have lots of threads\
    \ of execution all running at the same time in your programs, then you are out\
    \ of luck. Although a few people have developed projects that can execute multiple\
    \ threads in this way, generally this capability is unnecessary for the type of\
    \ uses that an Arduino is normally put to. The closest an Arduino usually gets\
    \ to such execution is the use of interrupts.\n\nTwo of the pins on the Arduino\
    \ Uno (D2 and D3) can have interrupts attached to them. That is, these pins act\
    \ as inputs that, if the pins receive a signal in a specified way, the Arduino’s\
    \ processor will suspend whatever it was doing and run a function attached to\
    \ that interrupt.\n\nSketch 7-04 blinks an LED, but then changes the blink period\
    \ when an interrupt is received. You can simulate an interrupt by connecting your\
    \ wire between pin D2 and GND and using the internal pull-up resistor to keep\
    \ the interrupt high most of the time.\n\n```\n//sketch 7-04\n\nconst int interruptPin\
    \ = 2;\nconst int ledPin = 13;\nint period = 500;\n\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n  pinMode(interruptPin, INPUT_PULLUP);\n  attachInterrupt(0, goFast,\
    \ FALLING);\n}\n\nvoid loop() \n{\n  digitalWrite(ledPin, HIGH);\n  delay(period);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(period);  \n}\n\nvoid goFast()\n{\n  period\
    \ = 100;\n}\n```\n\nThe following is the key line in the **setup** function of\
    \ this sketch:\n\n```\nattachInterrupt(0, goFast, FALLING);\n```\n\nThe first\
    \ argument specifies which of the two interrupts you want to use. Rather confusingly,\
    \ a 0 here means you are using pin 2, while a 1 means you are using pin 3.\n\n\
    The next argument is the name of the function that is to be called when there\
    \ is an interrupt, and the final argument is a constant that will be one of **CHANGE,\
    \ RISING**, or **FALLING**. [Figure 7-4](#16_Chapter_07.xhtml_fig-ch7-4) summarizes\
    \ these options.\n\n![image](images/fig-ch7-4.jpg)\n\nFigure 7.4 *Types of interrupt\
    \ signals*.\n\nIf the interrupt mode is **CHANGE**, then either a **RISING** from\
    \ 0 to 1 or a **FALLING** from 1 to 0 will both trigger an interrupt.\n\nYou can\
    \ disable interrupts using the function **noInterrupts**. This stops all interrupts\
    \ from both interrupt channels. You can resume using interrupts again by calling\
    \ the function **interrupts**.\n\nDifferent Arduino boards have different interrupt\
    \ names for different pins so if you are not using an Arduino Uno, check the documentation\
    \ for your board on [http://www.arduino.cc](http://www.arduino.cc).\n\n* * *\n\
    \n### Conclusion\n\nIn this chapter, you have looked at some of the handy features\
    \ that the Arduino standard library provides. These features will save you some\
    \ programming effort, and if there is one thing that a good programmer likes,\
    \ it is being able to use high-quality work done by other people.\n\nIn the next\
    \ chapter, we will extend what we learned about data structures in [Chapter 5](#14_Chapter_05.xhtml)\
    \ and look at how you go about remembering data on the Arduino after the power\
    \ goes off.\n\n## 8\n\n## Data Storage\n\nWhen you give values to variables, the\
    \ Arduino board will remember those values only as long as the power is on. The\
    \ moment that you turn the power off or reset the board, all that data is lost.\n\
    \nIn this chapter, we look at some ways to hang on to that data.\n\n* * *\n\n\
    ### Constants\n\nIf the data that you want to store does not change, then you\
    \ can just set the data up each time that the Arduino starts. An example of this\
    \ approach is the case in the letters array in your Morse code translator of [Chapter\
    \ 5](#14_Chapter_05.xhtml) (sketch 5-05).\n\nYou used the following code to define\
    \ a variable of the correct size and fill it with the data that you needed:\n\n\
    ```\nchar* letters[] = {\n  \".-\", \"-...\", \"-.-.\", \"-..\", \".\", \n   \
    \  \"..-.\", \"--.\", \"....\", \"..\",    // A-I\n  \".---\", \"-.-\", \".-..\"\
    , \"--\", \"-.\", \n     \"---\", \".--.\", \"--.-\", \".-.\",  // J-R\n  \"...\"\
    , \"-\", \"..-\", \"...-\", \".--\", \n     \"-..-\", \"-.--\", \"--..\"     \
    \     // S-Z\n};\n```\n\nYou may remember that you did the calculation and decided\
    \ that you had plenty of your meager 2K to spare. However, if memory was a bit\
    \ tight, it would be far better to be able to store this data in the 32K of flash\
    \ memory used to store programs, rather than the 2K of RAM. There is a means of\
    \ doing this. It is a directive called **PROGMEM;** it lives in a library and\
    \ is a bit awkward to use.\n\n* * *\n\n### Storing Data in Flash Memory\n\nTo\
    \ store your data in flash memory, you have to include the **PROGMEM** library\
    \ as follows:\n\n```\n#include <avr/pgmspace.h>\n```\n\nThe purpose of this command\
    \ is to tell the compiler to use the **pgmspace** library for this sketch. In\
    \ this case, a library is a set of functions that someone else has written and\
    \ that you can use in your sketches without having to understand all the details\
    \ of how those functions work.\n\nBecause you are using this library, the **PROGMEM**\
    \ keyword and the **pgm_read_word** function are available. You will use both\
    \ in the sketches that follow.\n\nThis library is included as part of the Arduino\
    \ software and is an officially supported Arduino library. A good collection of\
    \ such official libraries is available, and many unofficial libraries, developed\
    \ by people like you and made for others to use, are also available on the Internet.\
    \ Such unofficial libraries must be installed into your Arduino environment. You\
    \ will learn more about these libraries, as well as how to write your own libraries,\
    \ in [Chapter 11](#20_Chapter_11.xhtml).\n\nWhen using **PROGMEM**, you have to\
    \ make sure that you use special **PROGMEM**-friendly data types. Unfortunately,\
    \ that does *not* include an array of variable length **char** arrays. However,\
    \ it does include access to an array of **char** arrays if those **char** arrays\
    \ are of fixed size. The full program is very similar to that of sketch 5-05 in\
    \ [chapter 5](#14_Chapter_05.xhtml). You may like to open sketch 8-01 in the IDE\
    \ while I highlight the differences.\n\nThere is a new constant called maxLen\
    \ that contains the maximum length of a single character’s dots and dashes plus\
    \ one for the null character on the end.\n\nThe structure to contain the letters\
    \ now looks like this:\n\n```\nPROGMEM const char letters[26][maxLen] = {\n  \"\
    .-\", \"-...\", \"-.-.\", \"-..\", \".\", \"..-.\", \"--.\", \"....\", \"..\"\
    ,    // A-I\n  \".---\", \"-.-\", \".-..\", \"--\", \"-.\", \"---\", \".--.\"\
    , \"--.-\", \".-.\",  // J-R\n  \"...\", \"-\", \"..-\", \"...-\", \".--\", \"\
    -..-\", \"-.--\", \"--..\"          // S-Z\n};\n```\n\nThe **PROGMEM** keyword\
    \ indicates that the data structure is to be stored in flash. You can only store\
    \ constants like this; once in the flash, the data structure cannot be changed,\
    \ hence the use of **const**. The size of the array also has to be fully specified\
    \ as 26 letters by **maxLen** (minus 1) dots and dashes.\n\nThe loop function\
    \ is also slightly different from sketch 5-05.\n\n```\nvoid loop()           \
    \         \n{\n  char ch;\n  char sequence[maxLen];\n  if (Serial.available()\
    \ > 0)\n  {\n    ch = Serial.read();\n    if (ch >= 'a' && ch <= 'z')\n    {\n\
    \      memcpy_P(&sequence, letters[ch - 'a'], maxLen);\n      flashSequence(sequence);\n\
    \    }\n    else if (ch >= 'A' && ch <= 'Z')\n    {\n      memcpy_P(&sequence,\
    \ letters[ch - 'A'], maxLen);\n      flashSequence(sequence);\n    }\n    else\
    \ if (ch >= '0' && ch <= '9')\n    {\n      memcpy_P(&sequence, numbers[ch - '0'],\
    \ maxLen);\n      flashSequence(sequence);\n    }\n    else if (ch == ' ')\n \
    \   {\n      delay(dotDelay * 4);  // gap between words  \n    }\n  }\n}\n```\n\
    \nThe data may look like an array of strings, but actually internally it is stored\
    \ in flash in a way that can only be accessed by the special function **memcp_P**,\
    \ which copies the flash data into a **char** array called **sequence** that is\
    \ initialized to **maxSize** characters in length.\n\nThe & character before **sequence**\
    \ allows **memcpy_P** to modify the data inside the sequence character array."
