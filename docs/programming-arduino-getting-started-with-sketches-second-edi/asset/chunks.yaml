  trans: "\n\n首先，从“文件”（File）菜单打开 Arduino IDE 首（Preferences）窗口，并将地址 `http://arduino.esp8266.com/stable/package_esp8266com_index.json`\
    \ 添加到“附加板管理器 URL”（Additional Board Manager URLs）字段中（图 10-7）。\n\n![image](img/fig-ch10-7.jpg)\n\
    \n图 10.7 *为 ESP8288 板添加板管理器 URL*。\n\n打开 Arduino IDE 的板管理器（Boards Manager）窗口，可以在“工具”（Tools）→“板”（Boards）菜单选项下找到。滚动到列表底部，点击\
    \ `esp8266 by ESP8266 Community`旁边的“安装”（Install）按钮。\n\n关闭板管理器，现在当你查看开发板列表时，你会发现一些新的\
    \ ESP8266 相关的开发板选项，特别是 `Node MCU0.9` 和 `NodeMCU 1.0`。当你购买 ESP8266 板时，需要检查它是这两种类型中的哪一种。\n\
    \n在开始为你的 Node MCU 板编程之前，你需要为 USB 转串口芯片安装驱动程序。这与 Arduino Uno 的 USB 转串口接口使用的芯片不同，因此你需要从\
    \ `https://github.com/nodemcu/nodemcu-devkit/tree/master/Drivers` 下载适用于适用于你平台的驱动，然后运行安装程序。\n\
    \n像操作其他 Arduino 一样选择板类型和端口，你现在应该可以为 ESP8266 编程了。不过，你需要注意以下几点区别：\n\n- ♦ 有时（并非总是）你需要在通电前按住板子上的\
    \ `Flash` 按钮，并在板子通电几秒后才释放按钮。如果你的程序（sketch）上传失败，请尝试此操作。\n- ♦ 板上的命名引脚 `D0` 到 `D8`\
    \ 必须始终在前面加上 `D` 使用，例如，`pinMode(D0, OUTPUT)`。对于官方 Arduino 板，这个 `D` 是可选的。\n- ♦ Node\
    \ MCU 内置了一个 LED，类似于 Arduino Uno 的 `L` LED，但它位于引脚 `D0` 而不是引脚 `13`，因此你需要修改你的闪灯程序以使用引脚\
    \ `D0`。\n- ♦ 使用官方 Arduino 板时，你定义函数的顺序并不重要。使用 Node MCU 板时，你必须在第一次调用函数的地方之前定义它们。\n\
    \nNode MCU 库与标准的 Arduino 以太网库略有不同。程序 10-03 复现了图 10-4;\n\nvoid handleRoot()\n{\n\
    \  String message = \"<html><body>\\n\";\n  message += \"<h1>Arduino Server</h1>\\\
    n\";\n  message += \"<p>A0=\"; \n  message += analogRead(A0); \n  message += \"\
    </p>\"; \n  message += \"<p>millis=\"; \n  message += millis(); \n  message +=\
    \ \"</p>\"; \n  message += \"</html></body>\\n\";\n  server.send(200, \"text/html\"\
    , message);\n}\n\nvoid connectToWiFi()\n{\n  Serial.print(\"\\n\\nConnecting to\
    \ \");\n  Serial.println(ssid);\n  WiFi.begin(ssid, password);\n  while (WiFi.status()\
    \ != WL_CONNECTED) {\n    delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println(\"\
    \\nWiFi connected\");  \n  Serial.print(\"IP address: \");\n  Serial.println(WiFi.localIP());\n\
    }\n\nvoid setup()\n{\n  Serial.begin(115200);\n  connectToWiFi();\n\n  server.on(\"\
    /\", handleRoot);\n\n  server.begin();\n  Serial.println(\"HTTP server started\"\
    );\n}\n\nvoid loop()\n{\n  server.handleClient();\n}\n```\n\nNode MCU 的代码结构与你在程序\
    \ 10-01 中看到的 Arduino 和以太网扩展板的代码实际上非常不同。在这个程序中，取代 MAC 地址的是 `ssid`（无线网络名称）和 `password`\
    \ 常量。创建的不是类型为 `Ethernet` 的服务器变量，而是类型为 `ESP8266WebServer` 的变量。\n\n`handleRoot`\
    \ 函数演示了 ESP8266 库的一个非常实用的功能：即为服务器提供的不同页面定义处理程序的能力。因此，如果你跳转到 `setup` 函数，你会看到命令\
    \ `server.on(\"/\", handleRoot)`。这告诉服务器，每当对根页面（`/`）有请求时，就会执行 `handleRoot` 函数。\n\
    \n"
- fmt: "\nThis sketch is structured in much the same way as its Arduino counterpart\
    \ (sketch 10-02). However, it uses a different set of pins and also has an array\
    \ of strings holding the names of those pins for use in the generated webpage.\
    \ The utility functions `pageNameIs` and `valueOfParam`, which were written to\
    \ check the page being accessed and split parameters out of the request, are not\
    \ needed in the ESP8266 version as the library handles requests by page name using\
    \ the `server.on` mechanism and allows direct access to parameter values using\
    \ `server.arg(i)` where `i` is the index position of the parameter. The `arg`\
    \ function actually has options to retrieve named parameters too. You can find\
    \ out more about this in the documentation that you can find here: [http://links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html](http://links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html)\n\
    \nIn this case, the `handleRoot` function has to construct a much bigger string\
    \ to contain the HTML to be sent back to the client. Rather than use the `String`\
    \ class, this illustrates a different approach that uses a string buffer (`buff`)\
    \ that uses the `strcat` C function to concatenate a series of small strings to\
    \ an ever-increasing main string (terminated with a `\\0`). This works okay until\
    \ you get to adding a number such as the pin value. Then a second string buffer\
    \ (`indexStr`) is used. The number is then written into this buffer using the\
    \ `sprintf` C function that “prints” the number into the buffer that is then concatenated\
    \ into `buff`.\n\nAll this buffer writing is unnecessary in the Arduino Ethernet\
    \ library as that allows writing of the response to the browser a line at a time,\
    \ which removes the need to construct the whole message before sending it back\
    \ to the browser.\n\n* * *\n\n### Calling Web Services\n\nAll the examples so\
    \ far in this chapter have used the Arduino or Node MCU as a Web server, but what\
    \ if you want the board to act more like a Web browser and send requests to a\
    \ Web server somewhere else on the Internet?\n\nFor example, you could have your\
    \ board take temperature readings at regular intervals and then post those readings\
    \ to a Web service. In the next two sections you will learn how to use both a\
    \ regular Arduino and a Node MCU to send requests to the popular IFTTT (If This\
    \ Then That) Web service. When the service receives the request (its trigger)\
    \ it will perform an action that, in this case, will be to send you an e-mail\
    \ that contains the reading from pin A0.\n\nWhether you are using an Arduino or\
    \ a Node MCU, you will first need to create for yourself an account on [ifttt.com](http://ifttt.com)\
    \ and then create a new “recipe”. IFTTT has a very easy to use Web interface that\
    \ is for the most part self-explanatory. So after clicking the button to create\
    \ a new recipe, click on the “this” hyperlink in the heading “if this then that”.\
    \ You will then be prompted for a trigger channel. Type `maker` into the search\
    \ box to find the Maker channel (the logo looks like a colorful letter *M*). Select\
    \ the Maker channel and then “Receive a web request” as the trigger. You will\
    \ then need to supply an event name ([Figure 10-8](#19_Chapter_10.xhtml_fig-ch10-8)).\n\
    \n![image](images/fig-ch10-8.jpg)\n\nFigure 10.8 *Completing the trigger fields*.\n\
    \nEnter the text `arduino_spoke` into the Event Name field and then click Create\
    \ Trigger.\n\nThe next step is to define the action. That is, to specify what\
    \ will happen when the recipe is triggered. For this example we will have IFTTT\
    \ send us an e-mail, but you could choose a different action channel and have\
    \ IFTTT send a Tweet, update a Facebook status, or many other possible actions.\
    \ After you have the basic recipe working, you might like to experiment with other\
    \ actions. Click on the “that” link in the heading “if this then that” and find\
    \ the “e-mail” action channel. Select the only action available: “Send me an e-mail.”\
    \ This will open up the form shown in [Figure 10-9](#19_Chapter_10.xhtml_fig-ch10-9).\n\
    \n![image](images/fig-ch10-9.jpg)\n\nFigure 10.9 *Completing the action fields*.\n\
    \nYou can leave the fields as they are and just click Create Action, or you can\
    \ use the form to customize the e-mail that you will receive. You can always come\
    \ back and modify the action later. Click the final Create Recipe button and your\
    \ new recipe will go live waiting for a message from your Arduino or Node MCU.\n\
    \nOne final step that you need to take is to fetch the key for your trigger event\
    \ so that only you can use it. To do this, click on the “Channels” link at the\
    \ top of the [ifttt.com](http://ifttt.com) home page and search for the Maker\
    \ channel. You will then see details like the ones shown in [Figure 10-10](#19_Chapter_10.xhtml_fig-ch10-10).\n\
    \n![image](images/fig-ch10-10.jpg)\n\nFigure 10.10 *Finding the Maker channel\
    \ key*.\n\nThe important information here is the text that says “Your key is:”.\
    \ Later on you will need to paste this key into your sketch.\n\n* * *\n\n### Arduino\
    \ Uno and IFTTT\n\nArduino Uno and IFTTT\n\nLet’s start with the Arduino and Ethernet\
    \ shield to send messages to IFTTT. This is in sketch 10-05.\n\n```cpp\n#include\
    \ <SPI.h>\n#include <Ethernet.h>\n\nbyte mac[] = {0xDE, 0xAD, 0xBE, 0xEF, 0xFE,\
    \ 0xED};\nconst char* host = \"maker.ifttt.com\";\nconst int httpPort = 80;\n\
    const long sendPeriod = 60000L; // 1 minute\nEthernetClient client;\nconst String\
    \ key = \"YOUR_KEY_HERE\";\n\nvoid setup() {\n  Serial.begin(9600);\n  Ethernet.begin(mac);\n\
    }\n\nvoid sendToIFTTT(int reading) {\n  client.stop();\n  Serial.print(\"connecting\
    \ to \");\n  Serial.println(host);\n  if (!client.connect(host, httpPort)) {\n\
    \    Serial.println(\"connection failed\");\n    return;\n  }\n\n  String url\
    \ = \"/trigger/arduino_spoke/key/\";\n  url += key;\n  url += \"?value1=\" + String(reading);\n\
    \n  String req = String(\"GET \") + url + \" HTTP/1.1\\r\\n\" +\n            \
    \   \"Host: \" + host + \"\\r\\n\" +\n               \"Connection: close\\r\\\
    n\\r\\n\";\n  Serial.println(req);\n  client.print(req);\n}\n\nvoid loop() {\n\
    \  static long lastReadingTime = 0;\n  long now = millis();\n  if (now > lastReadingTime\
    \ + sendPeriod) {\n    int reading = analogRead(A0);\n    sendToIFTTT(reading);\n\
    \    lastReadingTime = now;\n  }\n  if (client.available()) {\n    Serial.write(client.read());\n\
    \  }\n}\n```\n\nChange the constant `key` to contain your key from the Maker channel\
    \ in IFTTT that you found earlier (see Figure 10-10). The `sendPeriod` constant\
    \ sets the time between successive sends of Web requests to IFTTT.\n\nThe `loop`\
    \ function calls the function `sendToIFTTT` every minute, passing the value read\
    \ from A0 as a parameter. `loop` then checks to see if there is any response from\
    \ the server and if there is, it displays it.\n\n### Node MCU ESP8266 Board and\
    \ IFTTT\n\nThe node MCU variant for sending triggers to IFTTT is listed in sketch\
    \ 10-06.\n"
  raw: "This sketch is structured in much the same way as its Arduino counterpart\
    \ (sketch 10-02). However, it uses a different set of pins and also has an array\
    \ of strings holding the names of those pins for use in the generated webpage.\
    \ The utility functions **pageNameIs** and **valueOfParam**, which were written\
    \ to check the page being accessed and split parameters out of the request, are\
    \ not needed in the ESP8266 version as the library handles requests by page name\
    \ using the **server.on** mechanism and allows direct access to parameter values\
    \ using **server.arg(i)** where **i** is the index position of the parameter.\
    \ The **arg** function actually has options to retrieve named parameters too.\
    \ You can find out more about this in the documentation that you can find here:\
    \ [http://links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html](http://links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html)\n\
    \nIn this case, the **handleRoot** function has to construct a much bigger string\
    \ to contain the HTML to be sent back to the client. Rather than use the **String**\
    \ class, this illustrates a different approach that uses a string buffer (**buff**)\
    \ that uses the **strcat** C function to concatenate a series of small strings\
    \ to an ever-increasing main string (terminated with a \\0). This works okay until\
    \ you get to adding a number such as the pin value. Then a second string buffer\
    \ (**indexStr**) is used. The number is then written into this buffer using the\
    \ **sprintf** C function that “prints” the number into the buffer that is then\
    \ concatenated into **buff**.\n\nAll this buffer writing is unnecessary in the\
    \ Arduino Ethernet library as that allows writing of the response to the browser\
    \ a line at a time, which removes the need to construct the whole message before\
    \ sending it back to the browser.\n\n* * *\n\n### Calling Web Services\n\nAll\
    \ the examples so far in this chapter have used the Arduino or Node MCU as a Web\
    \ server, but what if you want the board to act more like a Web browser and send\
    \ requests to a Web server somewhere else on the Internet?\n\nFor example, you\
    \ could have your board take temperature readings at regular intervals and then\
    \ post those readings to a Web service. In the next two sections you will learn\
    \ how to use both a regular Arduino and a Node MCU to send requests to the popular\
    \ IFTTT (If This Then That) Web service. When the service receives the request\
    \ (its trigger) it will perform an action that, in this case, will be to send\
    \ you an e-mail that contains the reading from pin A0.\n\nWhether you are using\
    \ an Arduino or a Node MCU, you will first need to create for yourself an account\
    \ on [ifttt.com](http://ifttt.com) and then create a new “recipe”. IFTTT has a\
    \ very easy to use Web interface that is for the most part self-explanatory. So\
    \ after clicking the button to create a new recipe, click on the “this” hyperlink\
    \ in the heading “if this then that”. You will then be prompted for a trigger\
    \ channel. Type **maker** into the search box to find the Maker channel (the logo\
    \ looks like a colorful letter *M*). Select the Maker channel and then “Receive\
    \ a web request” as the trigger. You will then need to supply an event name ([Figure\
    \ 10-8](#19_Chapter_10.xhtml_fig-ch10-8)).\n\n![image](images/fig-ch10-8.jpg)\n\
    \nFigure 10.8 *Completing the trigger fields*.\n\nEnter the text **arduino_spoke**\
    \ into the Event Name field and then click Create Trigger.\n\nThe next step is\
    \ to define the action. That is, to specify what will happen when the recipe is\
    \ triggered. For this example we will have IFTTT send us an e-mail, but you could\
    \ choose a different action channel and have IFTTT send a Tweet, update a Facebook\
    \ status, or many other possible actions. After you have the basic recipe working,\
    \ you might like to experiment with other actions. Click on the “that” link in\
    \ the heading “if this then that” and find the “e-mail” action channel. Select\
    \ the only action available: “Send me an e-mail.” This will open up the form shown\
    \ in [Figure 10-9](#19_Chapter_10.xhtml_fig-ch10-9).\n\n![image](images/fig-ch10-9.jpg)\n\
    \nFigure 10.9 *Completing the action fields*.\n\nYou can leave the fields as they\
    \ are and just click Create Action, or you can use the form to customize the e-mail\
    \ that you will receive. You can always come back and modify the action later.\
    \ Click the final Create Recipe button and your new recipe will go live waiting\
    \ for a message from your Arduino or Node MCU.\n\nOne final step that you need\
    \ to take is to fetch the key for your trigger event so that only you can use\
    \ it. To do this, click on the “Channels” link at the top of the [ifttt.com](http://ifttt.com)\
    \ home page and search for the Maker channel. You will then see details like the\
    \ ones shown in [Figure 10-10](#19_Chapter_10.xhtml_fig-ch10-10).\n\n![image](images/fig-ch10-10.jpg)\n\
    \nFigure 10.10 *Finding the Maker channel key*.\n\nThe important information here\
    \ is the text that says “Your key is:”. Later on you will need to paste this key\
    \ into your sketch.\n\n* * *\n\n### Arduino Uno and IFTTT\n\nLet’s start with\
    \ the Arduino and Ethernet shield sketch to send messages to IFTTT. This is in\
    \ sketch 10-05.\n\n```\n// sketch 10-05 IFTTT\n#include <SPI.h>\n#include <Ethernet.h>\n\
    \n// MAC address just has to be unique. This should work\nbyte mac[] = { 0xDE,\
    \ 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\nconst char* key = \"c1AsQq_qsQVTSO5-6NASqg\"\
    ;\nconst char* host = \"maker.ifttt.com\";\nconst int httpPort = 80;\nconst long\
    \ sendPeriod = 60000L; // 1 minute\nEthernetClient client;\n\nvoid setup()\n{\n\
    \  Serial.begin(9600);\n  Ethernet.begin(mac);\n}\n\nvoid sendToIFTTT(int reading)\n\
    {\n  client.stop(); // for second time around the loop\n  Serial.print(\"connecting\
    \ to \");\n  Serial.println(host);\n  if (!client.connect(host, httpPort)) {\n\
    \    Serial.println(\"connection failed\");\n    return;\n  }\n\n  String url\
    \ = \"/trigger/arduino_spoke/with/key/\";\n  url += key;\n  url += \"?value1=\"\
    \ + String(reading);\n\n  String req = String(\"GET \") + url + \" HTTP/1.1\\\
    r\\n\" +  \n               \"Host: \" + host + \"\\r\\n\" +\n               \"\
    Connection: close\\r\\n\\r\\n\";\n  Serial.println(req);\n  client.print(req);\n\
    }\n\nvoid loop() \n{\n  static long lastReadingTime = 0;\n  long now = millis();\n\
    \  if (now > lastReadingTime + sendPeriod)\n  {\n    int reading = analogRead(A0);\n\
    \    sendToIFTTT(reading);\n    lastReadingTime = now;\n  }\n  if (client.available())\n\
    \  {\n    Serial.write(client.read());\n  }\n}\n```\n\nChange the constant **key**\
    \ to contain your key from the Maker channel in IFTTT that you found earlier (see\
    \ [Figure 10-10](#19_Chapter_10.xhtml_fig-ch10-10)). The **sendPeriod** constant\
    \ sets the time between successive sends of Web requests to IFTTT.\n\nThe variable\
    \ **client** refers to the **EthernetClient** class rather than the **EthernetServer**\
    \ class that we used in previous examples because the Arduino is acting as a Web\
    \ client in this example.\n\nThe loop function calls the function **sendToIFTTT**\
    \ every minute, passing the value read from A0 as a parameter. **loop** then checks\
    \ to see if there is any response from the server and if there is, it displays\
    \ it. This isn’t strictly necessary but does give valuable feedback in the Serial\
    \ Monitor so that you know if anything is going wrong.\n\nThe **sendToIFTTT**\
    \ function first calls **client.stop()** to end any previous transaction before\
    \ connecting to the host server and constructing a **String url** to send to the\
    \ server that includes the **reading** parameter as one of the request parameters.\
    \ The URL also includes the **key** and the **arduino_spoke** event name that\
    \ you specified on IFTTT.\n\n* * *\n\n### Node MCU ESP8266 Board and IFTTT\n\n\
    The node MCU variant for sending triggers to IFTTT is listed in sketch 10-06."
