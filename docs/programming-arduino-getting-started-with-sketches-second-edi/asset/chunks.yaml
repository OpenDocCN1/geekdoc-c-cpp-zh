  trans: "\n\n也许有点让人惊讶的是，我们在没有准确定义什么是编程语言的情况下，进入了这本关于编程书籍的第 3 章](#12_Chapter_03.xhtml)。我们能识别出一个\
    \ Arduino 程序（sketch），并大概知道它正试图做什么，但我们需要更深入地了解编程语言代码是如何从页面上的文字变成执行实际操作的，比如控制 LED\
    \ 的亮和灭。\n\n图 3-1 总结了从在 Arduino IDE 中输入代码到在板上运行程序的整个过程。\n\n![image](img/fig-ch3-1.jpg)\n\
    \n图 3.1. *从代码到板载*。\n\n当你点击 Arduino IDE 上的上传（Upload）”按钮时，它会触发一系列事件，导致你的程序安装到 Arduino\
    \ 上并运行。这并不是简单地将你在编辑器中输入的文本移动到 Arduino 板上那么直接。\n\n第一步是执行被称为`编译（compilation）`的操作。这会将你编写的代码翻译成机器码——即\
    \ Arduino 能够理解的二进制语言。如果你点击 Arduino IDE 上的验证（Verify）”按钮，它实际上会尝试编译你编写的 C 代码，而不尝试将代码发送到\
    \ Arduino IDE。编译代码的一个副作用是它会被检查以确保其符合 C 语言的规则。\n\n如果你在 Arduino IDE 中输入 `Ciao Bella!`\
    \ 并点击播放（Play）按钮，结果将如图图 3-2 所示。\n\n![image](img/fig-ch3-2.jpg)\n\n图 3.2. *Arduino\
    \ 不说意大利语*。\n\nArduino 尝试编译“Ciao Bella”这两个单词，尽管它具有意大利血统，但它完全不知道你在说什么。这段文字不是 C 代码。因此，结果是在屏幕底部出现那条晦涩的信息：“Ciao\
    \ does not name a type（Ciao 不是一个类型）”。这实际上意味着你写的内容有很多处错误。\n\n让我们尝试另一个例子。这次我们将尝试编译一个完全没有任何代码的程序（参见图\
    \ 3-3）。\n\n![image](img/fig-ch3-3.jpg)\n\n图 3.3. *缺少 `setup` 或 `loop`*。\n\n这一次，编译器在告诉你你的程序中没有\
    \ `setup` 或 `loop` 函数。正如你在第 2 章中运行的闪灯（Blink）示例中所知，在程序中添加自己的代码之前，你必须拥有一些“模板化（boilerplate）”代码。在\
    \ Arduino 编程中，“模板化”代码的形式为 `setup` 和 `loop` 函数，这两个函数在程序中必须始终存在。\n\n你将在书的后面学习更多关于函数的知识，但现在，让我们接受你需要这些模板代码，并只需调整你的程序使其能够通过编译（参见图\
    \ 3-4）。\n\n![image](img/fig-ch3-4.jpg)\n\n图 3.4. *一个可以编译的程序*。\n\nArduino IDE 查看了你编写代码的尝试，并认为它们是可以接受的。它通过显示“Done\
    \ Compiling（编译完成）”并向你报告程序的大小（450 字节）来告诉你这一点。IDE 还告诉你最大大小为 32,256 字节，因此你仍有大量空间让你的程序变得更大。\n\
    \n让我们检查一下作为你编写的每个程序起点的模板代码。这里有一些新面孔。例如，有 `void` 单词和一些大括号。让我们先处理 `void`。\n\n`void\
    \ setup()` 这一行意味着你正在定义一个名为 `setup` 的函数。在 Arduino 中，某些函数已经为你定义好了，例如 `digitalWrite`\
    \ 和 `delay`，而你必须或可以自己定义其他函数。`setup` 和 `loop` 是你在编写的每个程序中必须自己定义的两个函数。\n\n需要理解的关键点是，在这里你并不是在调用\
    \ `setup` 或 `loop`（像你调用 `digitalWrite` 那样），而是你实际上是在创建这些函数，以便 Arduino 系统本身可以调用它们。这是一个很难掌握的概念，但一种思考方式是将其比作类似于法律文件中的定义。\n\
    \n大多数法律文件都有一个“定义”章节，其中可能会包含类似如下的内容：\n\n```\nDefinitions.\nThe Author: 负责创建书籍的人或人员\n\
    ```\n\n通过这种方式定义术语——例如，简单地使用“author（作者）”一词作为“负责创建书籍的人或人员”的缩写——律师可以使他们的文档更短、更易读。函数的工作方式非常这些定义。你定义一个函数，然后你或系统本身可以在程序的其他地方使用它。\n\
    \n回到 `void`，这两个函数（`setup` 和 `loop`）不像某些函数那样返回值，所以你必须使用 `void` 关键字说明它们是 `void`。如果你想象有一个名为\
    \ `sin` 的函数，它执行同名的三角函数，那么这个函数就会返回一个值。调用时返回的值将作为参数传递的角度的正弦值。\n\n就像法律定义使用单词来定义术语一样，我们在\
    \ C 中编写可以实现此点的函数。\n\n### 闪灯——再次！\n\nArduino 之拥有 `setup` 和 `loop` 这两个函数，是为了将启动时只需要执行一次的事情与持续发生的事情分开。\n\
    \n`setup` 函数会在程序启动时运行一次。让我们为其添加一些代码让 LED 闪烁。将代码添加到你的程序中，使其如下：\n\n```\nvoid setup()\n\
    {\n  pinMode(13, OUTPUT);\n  digitalWrite(13, HIGH);\n}\n\nvoid loop()\n{\n}\n\
    ```\n\n**setup** 函数本身调用了内置函数 `pinMode` 和 `digitalWrite`。你已经熟悉 `digitalWrite`，但\
    \ `pinMode` 是新的。`pinMode` 函数将引脚设置为输入或输出。因此，点亮 LED 实际上有两个阶段的过程。首先，你需要将引脚 13 设置为输出，其次，你需要将输出设置为高电平（5V）。\n\
    \n当你运行这个程序时，在板上你会看到 L LED 亮起并保持不变。这并不有趣，所以让我们至少尝试通过在 `loop` 函数而不是 `setup` 函数中让它闪烁。\n\
    \n你可以将 `pinMode` 调用留在 `setup` 函数中，因为你只需要调用它一次。如果你将其移动到 `loop` 中，程序仍然可以工作，但没有必要，而且在只需要执行一次时只执行一次是一种良好的编程习惯。因此，修改你的程序使其如下：\n\
    \n```\nvoid setup()\n{\n  pinMode(13, OUTPUT);\n}\n\nvoid loop()\n{\n digitalWrite(13,\
    \ HIGH);\n delay(500);\n digitalWrite(13, LOW);\n}\n```\n\n运行这个程序并观察发生了什么。结果可能与你预期的完全不同。LED\
    \ 基本上是一直亮着的。嗯，为什么会这样呢？\n\n尝试在脑海中逐行推演程序：\n\n"
- fmt: "\n1. Run `setup` and set pin 13 to be an output.\n2. Run `loop` and set pin\
    \ 13 to high (LED on).\n3. Delay for half a second.\n4. Set pin 13 to low (LED\
    \ off).\n5. Run `loop` again, going back to step 2, and set pin 13 to high (LED\
    \ on).\n\nThe problem lies between steps 4 and 5. What is happening is that the\
    \ LED is being turned off, but the very next thing that happens is that it gets\
    \ turned on again. This happens so quickly that it appears that the LED is on\
    \ all the time.\n\nThe microcontroller chip on the Arduino can perform 16 million\
    \ instructions per second. That’s not 16 million C language commands, but it is\
    \ still very fast. So, our LED will only be off for a few millionths of a second.\n\
    \nTo fix the problem, you need to add another delay after you turn the LED off.\
    \ Your code should now look like this:\n\n```\n// sketch 3-01\nvoid setup()\n\
    {\n  pinMode(13, OUTPUT);\n}\n\nvoid loop()\n{\n digitalWrite(13, HIGH);\n delay(500);\n\
    \ digitalWrite(13, LOW);\n delay(500);\n}\n```\n\nTry again and your LED should\
    \ blink away merrily once per second.\n\nYou may have noticed the comment at the\
    \ top of the listing saying “sketch 3-01.” To save you some typing, we have uploaded\
    \ to this book’s website all the sketches with such a comment at the top. You\
    \ can download them from [www.arduinobook.com](http://www.arduinobook.com).\n\n\
    ***\n\n### Variables\n\nIn this Blink example, you use pin 13 and have to refer\
    \ to it in three places. If you decided to use a different pin, then you would\
    \ have to change the code in three places. Similarly, if you wanted to change\
    \ the rate of blinking, controlled by the argument to `delay()`, you would have\
    \ to change 500 to some other number in two places.\n\nVariables can be thought\
    \ of as giving a name to a number. Actually, they can be a lot more powerful than\
    \ this, but for now, you will use them for this purpose.\n\nWhen defining a variable\
    \ in C, you have to specify the type of the variable. We want our variables to\
    \ be whole numbers, which in C are called `int`s. So to define a variable called\
    \ `ledPin` with a value of 13, you need to write the following:\n\n```\nint ledPin\
    \ = 13;\n```\n\nNotice that because `ledPin` is a name, the same rules apply as\
    \ those of function names. So, there cannot be any spaces. The convention is to\
    \ start variables with a lowercase letter and begin each new word with an uppercase\
    \ letter. Programmers will often call this “bumpy case” or “camel case.”\n\nLet’s\
    \ fit this into your Blink sketch as follows:\n\n```\n// sketch 3-02\nint ledPin\
    \ = 13;\nint delayPeriod = 500;\n```\n\n```\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop()\n{\n digitalWrite(ledPin, HIGH);\n delay(delayPeriod);\n\
    \ digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n}\n```\n\nWe have also sneaked\
    \ in another variable called `delayPeriod`.\n\nEverywhere in the sketch where\
    \ you used to refer to 13, you now refer to `ledPin`, and everywhere you used\
    \ to refer to 500, you now refer to `delayPeriod`.\n\nIf you want to make the\
    \ sketch blink faster, you can just change the value of `delayPeriod` in one place.\
    \ Try changing it to 100 and running the sketch on your Arduino board.\n\nThere\
    \ are other cunning things that you can do with variables. Let’s modify your sketch\
    \ so that the blinking starts really fast and gradually gets slower and slower,\
    \ as if the Arduino is getting tired. To do this, all you need to do is to add\
    \ something to the `delayPeriod` variable each time that you do a blink.\n\nModify\
    \ the sketch by adding the single line at the end of the `loop` function so that\
    \ it appears, as in the following listing, and then run the sketch on the Arduino\
    \ board. Press the Reset button and see it start from a fast rate of flashing\
    \ again.\n\n```\n// sketch 3-03\nint ledPin = 13;\nint delayPeriod = 100;\n\n\
    void setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n digitalWrite(ledPin,\
    \ HIGH);\n delay(delayPeriod);\n digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n\
    \ delayPeriod = delayPeriod + 100;\n}\n```\n\nYour Arduino is doing arithmetic\
    \ now. Every time that `loop` is called, it will do the normal flash of the LED,\
    \ but then it will add 100 to the variable `delayPeriod`. We will come back to\
    \ arithmetic shortly, but first you need a better way than a flashing LED to see\
    \ what the Arduino is up to.\n\n***\n\n### Experiments in C\n\nYou need a way\
    \ to test your experiments in C. One way is to put the C that you want to test\
    \ out into the `setup` function, evaluate them on the Arduino, and then have the\
    \ Arduino display any output back to something called the Serial Monitor, as shown\
    \ in [Figures 3-5](#12_Chapter_03.xhtml_fig-ch3-5) and [3-6](#12_Chapter_03.xhtml_fig-ch3-6).\n\
    \nThe Serial Monitor is a window that allows you to communicate with the Arduino.\
    \ To use it, you need to use `Serial.begin(baudrate)` in your `setup` function,\
    \ and then `Serial.print()` or `Serial.println()` to send data. The `baudrate`\
    \ is the speed of communication in bits per second. A common value is 9600.\n\n\
    ```c\nvoid setup()\n{\n  Serial.begin(9600);\n  Serial.println(\"Hello Arduino!\"\
    );\n}\n\nvoid loop()\n{\n  Serial.println(\"Blinking...\");\n  delay(1000);\n\
    }\n```\n\nYou can also read data from the Arduino using `Serial.read()`. This\
    \ allows you to create interactive programs.\n\n```c\nvoid setup()\n{\n  Serial.begin(9600);\n\
    }\n\nvoid loop()\n{\n  if (Serial.available() > 0) {\n    int data = Serial.read();\n\
    \    Serial.print(\"Received: \");\n    Serial.println(data);\n  }\n}\n```\n\n\
    #### Numeric Variables and Arithmetic\n\nIn C, you can perform arithmetic on variables.\
    \ The basic operators are `+` for addition, `-` for subtraction, `*` for multiplication,\
    \ and `/` for division. You can also use the `%` operator for modulo, which gives\
    \ the remainder of a division.\n\n```c\nint a = 10;\nint b = 3;\nint sum = a +\
    \ b; // 13\nint diff = a - b; // 7\nint product = a * b; // 30\nint quotient =\
    \ a / b; // 3\nint remainder = a % b; // 1\n```\n\nYou can also use compound assignment\
    \ operators to simplify your code:\n\n```c\nint x = 10;\nx += 5; // same as x\
    \ = x + 5\nx -= 2; // same as x = x - 2\nx *= 3; // same as x = x * 3\nx /= 4;\
    \ // same as x = x / 4\n```\n"
