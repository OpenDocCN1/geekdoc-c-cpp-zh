    ## 1


    ## This Is Arduino


    Arduino is a microcontroller platform that has captured the imagination of electronics
    enthusiasts. Its ease of use and open source nature make it a great choice for
    anyone wanting to build electronic projects.


    Ultimately, it allows you to connect electronics through its pins so that it can
    control things—for instance, turn lights or motors on and off or sense things
    such as light and temperature. This is why Arduino is sometimes given the description
    *physical computing.* Because Arduinos can be connected to your computer by a
    universal serial bus (USB) lead, this also means that you can use the Arduino
    as an interface board to control those same electronics from your computer.


    This chapter is an introduction to the Arduino, including the history and background
    of the Arduino, as well as an overview of the hardware.


    * * *


    ### Microcontrollers


    The heart of your Arduino is a microcontroller. Pretty much everything else on
    the board is concerned with providing the board with power and allowing it to
    communicate with your desktop computer.


    A microcontroller really is a little computer on a chip. It has everything and
    more than the first home computers had. It has a processor, a kilobyte or two
    of random access memory (RAM) for holding data, a few kilobytes of erasable programmable
    read-only memory (EPROM) or flash memory for holding your programs and it has
    input and output pins. These input/output (I/O) pins link the microcontroller
    to the rest of your electronics.


    Inputs can read both digital (is the switch on or off?) and analog (what is the
    voltage at a pin?). This opens up the opportunity of connecting many different
    types of sensor for light, temperature, sound, and more.


    Outputs can also be analog or digital. So, you can set a pin to be on or off (0
    volts or 5 volts) and this can turn light-emitting diodes (LEDs) on and off directly,
    or you can use the output to control higher power devices such as motors. They
    can also provide an analog output. That is, you can control the power output of
    a pin, allowing you to control the speed of a motor or the brightness of a light,
    rather than simply turning it on or off.


    The microcontroller on an Arduino Uno board is the 28-pin chip fitted into a socket
    at the center of the board. This single chip contains the memory, processor, and
    all the electronics for the input/output pins. It is manufactured by the company
    Atmel, which is one of the major microcontroller manufacturers. Each of the microcontroller
    manufacturers actually produces dozens of different microcontrollers grouped into
    different families. The microcontrollers are not all created for the benefit of
    electronics hobbyists like us. We are a small part of this vast market. These
    devices are really intended for embedding into consumer products, including cars,
    washing machines, DVD players, children’s toys, and even air fresheners.


    The great thing about the Arduino is that it reduces this bewildering array of
    choices by standardizing on one microcontroller and sticking with it. (Well, as
    we see later, this statement is not quite true, but it’s close enough.)


    This means that when you are embarking on a new project, you do not first need
    to weigh all the pros and cons of the various flavors of microcontroller.


    #### Development Boards


    We have established that the microcontroller is really just a chip. A chip microcontroller
    will not just work on its own without some supporting electronics to provide it
    with a regulated and accurate supply of electricity (microcontrollers are fussy
    about this) as well as a means of communicating with the computer that is going
    to program the microcontroller.


    This is where development boards come in. An Arduino Uno board is really a microcontroller
    development board that happens to be an independent open source hardware design.
    This means that the design files for the printed circuit board (PCB) and the schematic
    diagrams are all publicly available, and everyone is free to use the designs to
    make and sell his or her own Arduino boards.


    All the microcontroller manufacturers—including Atmel, which makes the ATmega328
    microcontroller used in an Arduino board—also provide their own development boards
    and programming software. Although they are usually fairly inexpensive, these
    tend to be aimed at professional electronics engineers rather than hobbyists.
    This means that such boards and software are arguably harder to use and require
    a greater learning investment before you can get anything useful out of them.


    * * *


