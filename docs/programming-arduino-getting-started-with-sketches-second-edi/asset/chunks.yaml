    ### 开发板

    我们已经确定微控制器仅仅是一个芯片。如果没有一些辅助电子设备为其提供调节且准确的电源，以及与编程微控制器的通信手段，芯片本身无法独立工作。


    这就是开发板的用处。Arduino Uno 板实际上是一个独立的开源硬件设计的微控制器开发板。这意味着电路板（PCB）的设计文件和原理图都是公开的，任何人都可以自由使用这些设计来制造和销售
