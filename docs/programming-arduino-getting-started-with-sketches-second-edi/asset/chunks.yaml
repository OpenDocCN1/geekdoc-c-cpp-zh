    接下来，让我们看看图 1-1 底部的连接器。你可以阅读连接器旁边的连接名称。我们感兴趣的连接器是 `Reset`。它的功能与 Arduino 上的 `Reset`
    按钮相同。就像重启电脑 一样，使用 `Reset` 连接器会重置微控制器，使其从开始运行程序。要使用 `Reset` 连接器重置微控制器，你只需临时将此引脚设置为低电平（将其连接到
    `0V`）。


    该部分的其余引脚如其标签所示，仅提供不同的电压（`3.3V`、`5V`、`GND` 和 `Vin`）。`GND`（地））表示零伏。它是板载上所有其他电压的参考电压。


    ### 模拟输入


    标记为 `Analog In A0` 到 `A5` 的六个引脚可以用于测量连接到它们上的电压，以便在该值可以在 sketch（Arduino 程序）中使用。请注意，它们测量的是电压而不是电流。由于它们的内部电阻非常大，只有极微的电流会流入它们并流向地。也就是说，引脚具有较大的内部电阻只允许极微的电流流入引脚。


    尽管这些输入被标记为模拟，并且默认是模拟输入，但这些连接也可以作为数字输入或输出。


    ### 数字连接


    我们现在切换到顶部连接器，并从图 1-1 的右侧开始。在这里我们找到了标记为 `Digital 0` 到 `13` 的引脚。它们可以用作输入或输出。当用输出时，它们的行为类似于本节之前讨论的电源电压，但这些都是
    `5V` 并且可以从你的 sketch 中开启或关闭。因此，如果你在 sketch 中开启它们，它们将处于 `5V`；如果你关闭它们，它们将处于 `0V`。与电源连接器一样，你必须小心不要超过它们的最大电流能力。这些连接中的前两个（`0`
    和 `1`）也被标记为 `RX` 和 `TX`，用于接收和传输。这些连接预留用于通信，并间接地作为你到电脑 USB 链路的接收和传输连接。


    这些数字连接可以在 `5V` 下提供 `40 mA`（毫安）。这对于点亮标准 LED 已经足够，但不足以直接驱动电动机。


    ### 微控制器


    继续我们的 Arduino 板板之旅，微控制器芯片本身是一个带有 28 个引脚的黑色矩形设备。它安装在双直插（DIL）插座中，以便于更换。Arduino Uno
    板上使用的 28 脚脚微控制器芯片是 `ATmega328`。图 1-2 展示了显示该设备主要功能的框图。


    ![image](img/fig-ch1-2.jpg)


    图 1.2 *ATmega328 框图*。


    设备的核心——或者更贴切地说是大脑是中央处理器（CPU）。它控制设备内部发生的一切。它获取存储在闪存中的程序指令并执行它们。这可能涉及从工作内存（`RAM`）中获取数据、对其更改，然后放回。或者，它可能意味着将一个数字输出从
    `0V` 变为 `5V`。


    `EEPROM` 内存有点像闪存内存，因为它是非易失的。也就是说，你可以关闭设备并重新打开，它不会忘记 `EEPROM` 中的内容。闪存内存用于存储程序指令（来自
    sketch），而 `EEPROM` 则用于存储你不希望在重置或掉电时丢失的数据。


    ### 其他组件


    微控制器上方是一个微小的银色矩形元件。这是一个晶体振荡器。它每秒跳动 1600 万次，在每次跳动中，微控制器可以执行一个操作。在板左上角是 `Reset`
    开关。点击此开关会向微控制器发送逻辑脉冲，导致微控制器重启并清除其内存。注意，存储在设备上的任何程序将被保留。Arduino 板的右边缘是 USB 接口芯片。该芯片将
    USB 标准使用的电平转换为 Arduino 板上可以直接使用的电平。


    ***


    ### Arduino 的起源


    Arduino 最初是作为教学辅助工具开发的。随后（2005 年）由 Massimo Banzi 和 David Cuartielles 进行商业化开发。以来，它由于其易用性和耐用性在创客、学生和艺术家中取得了巨大成功。


    Arduino 成功的另一个关键因素是所有 Arduino 设计都以知识共享许可免费开放。这使得许多廉价的替代板出现。只有 Arduino 名称受保护，因此此类克隆板通常带有“duino”的名字，例如
    `Boarduino`、`Seeeduino` 和 `Freeduino`。2014 年，原始团队与其主要制造商之间发生了分歧。这次分裂的结果之一是在美国境外，Arduino
    Uno 被称为 `Genuino`。


    Arduino 系列


    了解各种 Arduino 板的背景是有用的。我们将使用 Arduino Uno 作为我们的标准设备——具体来说是 Arduino Uno R3（第 3 版）。事实上，它是所有
    Arduino 板中最常用的，但这些板都使用相同的语言编程，并且与外部世界的连接大部分相同，因此你可以轻松使用不同的板。


    #### Uno 和 Leonardo


    Arduino Uno 只是长系列 Arduino 板的一种形式。该系列包括 `Diecimila`（意大利语 10,000）和 `Duemilanove`（意大利语
    2009）。图 1-4 展示了一个 Arduino Leonardo。到这里你可能已经猜到 Arduino 是意大利发明的。


    Arduino Leonardo (图 1-4) 是另一个流行的 Arduino 板选择，在大多数情况下可以替代 Arduino Uno。它比 Uno 稍微便宜，并且与
    Uno 具有相同的连接。它的处理器芯片焊接在板上，因此无法移除（就像你可以移除 Uno 的处理器那样）。它的成本较低部分原因是使用了集成了 USB 接口的处理器，而不是像
    Uno 那样需要单独的芯片。


    #### Mega 和 Due

    '
- fmt: '

    The Arduino Mega is the muscle car of Arduino boards. It boasts a huge collection
    of input/output ports, but cleverly adds these as extra connectors at one end
    of the board, allowing it to remain pin-compatible with the Arduino Uno and Leonardo
    and all the shields available for Arduino.


    It uses a processor with more input/output pins, the `ATmega1280`, which is a
    surface mount chip that is fixed permanently to the board. So, unlike with the
    Uno and similar boards, you cannot replace the processor if you accidentally damage
    it.


    The extra connectors are arranged at the end of the board. Extra features provided
    by the Mega include the following:


    - 54 input/output pins

    - 128KB of flash memory for storing sketches and fixed data (compared to the Uno’s
    32KB)

    - 8KB of RAM and 4KB of EEPROM


    The Arduino Due ([Figure 1-5](#10_Chapter_01.xhtml_fig-ch1-5)) has the same board
    size and connections as the Mega, but uses a 32-bit ARM processor running at 84MHz.
    It also operates at 3.3V rather than the 5V of most Arduino boards so some Arduino
    shields will not operate correctly.


    ![image](images/fig-ch1-5.jpg)


    Figure 1.5 *An Arduino Due board*.


    ## The Micro and Small Arduino Boards


    For those situations where an Uno is too big, there are a range of smaller Arduino
    and Arduino-compatible boards. [Figure 1-6](#10_Chapter_01.xhtml_fig-ch1-6) shows
    a selection of these boards.


    ![image](images/fig-ch1-6.jpg)


    Figure 1.6 *The Arduino Micro (left), Freetronics LeoStick (center), and Adafruit
    Trinket (right)*.


    The Arduino Micro uses the same microcontroller as the Leonardo but is shrunk
    down to a more compact board. Third-party boards such as the LeoStick and Adafruit
    Trinket offer alternatives to the Micro.


    The downside of small boards like the Micro is that because they are so much smaller
    than an Uno, they cannot accept Uno-sized shields.


    ## Yun


    The Arduino Yun ([Figure 1-7](#10_Chapter_01.xhtml_fig-ch1-7)) is essentially
    an Arduino Leonardo combined with a miniature WiFi module running Linux. The device
    is intended for Arduino applications that require a connection to the Internet.
    The Arduino and Linux halves of the Yun are linked using software called a bridge.
    The Yun is programmed using the Arduino IDE as normal, but can also be programmed
    wirelessly from the Arduino IDE once the Yun has been joined to your local network.


    ![image](images/fig-ch1-7.jpg)


    Figure 1.7 *Arduino Yun*.


    ## Lilypad


    The Lilypad ([Figure 1-8](#10_Chapter_01.xhtml_fig-ch1-8)) is a tiny, thin Arduino
    board that can be stitched into clothing for applications that have become known
    as wearable computing.


    ![image](images/fig-ch1-8.jpg)


    Figure 1.8 *Arduino Lilypad*.


    The Lilypad does not have a USB connection, and you must use a separate adaptor
    to program it. It has an exceptionally beautiful design.


    Adafruit also sell a board called the Flora, which is similar in concept to the
    Lilypad.


    ## Other “Official” Boards


    The previously described Arduino boards are the most useful and popular ones.
    However, the range of Arduino boards constantly changes, so for a complete and
    up-to-date picture of the Arduino family, see the official Arduino website list
    at [www.arduino.cc/en/Main/Hardware](http://www.arduino.cc/en/Main/Hardware).


    ***


    ## Arduino Clones and Variants


    Unofficial boards fall into two categories. Some just take the standard open source
    hardware designs of Arduino and build a cheaper one. Some names you can search
    for boards of this nature include the following:


    - The Sparkfun RedBoard

    - The Adafruit Metro

    - The Olimexino


    More interestingly, some Arduino-compatible designs are intended to extend or
    improve the Arduino in some way. New variants are appearing all the time, and
    far too many exist to mention them all. However, the following are some of the
    more interesting and popular variants:


    - The Node MCU board, which is based around the `ESP8266` WiFi System on a chip.
    This provides a very low-cost solution for projects where you need a WiFi connection
    for your Arduino. See Ch. 10 for more information.

    - Adafruit Trinket, a very small Arduino.

    - Freetronics EtherTen, an Arduino with built-in Ethernet.

    - Particle Photon, a low-cost board with WiFi. It is programmed over the Internet
    using Arduino C but with a Web-based IDE rather than the Arduino IDE.


    ***


    ## Conclusion


    Now that you have explored the Arduino hardware a little, it’s time to set up
    your Arduino software.


    ## 2


    ## Getting Started


    Having introduced the Arduino, and learned a little about what it is that we are
    programming, it is time to learn how to install the software that we will need
    on our computer and to start working on some code.


    ***


    ### Powering Up


    When you buy an Arduino board, it is usually preinstalled with a sample Blink
    program that will make the little built-in light-emitting diode (LED) flash.


    The LED marked `L` is wired up to one of the digital input output sockets on the
    board. It is connected to digital pin `13`. This does not mean that pin `13` can
    only be used to light the LED; you can also use it as a normal digital input or
    output.


    All you need to do to get your Arduino up and running is supply it with some power.
    The easiest way to do this is to plug it into your computer using the USB lead.
    You should see the green “On” LED on the Arduino light up. The Arduino board will
    probably already be flashing, as the boards are generally shipped with the Blink
    sketch installed. But let’s install it again and then modify it.


    ***


    ### Installing the Software


    To be able to install new sketches onto your Arduino board, you need more than
    supply it over the USB. [Figure 2-1](#10_Chapter_01.xhtml_fig-ch2-1)


    Before you can upload a sketch, you must tell the Arduino application what type
    of board you are using and which serial port you are connected to. [Figures 2-3](#10_Chapter_01.xhtml_fig-ch2-3)
    and [2-4](#10_Chapter_01.xhtml_fig-ch2-4) show how you do this from the `Tools`
    menu.


    Full and comprehensive instructions for installing this software on Windows, Linux,
    and Mac can be found at the Arduino website ([www.arduino.cc](http://www.arduino.cc)).


    ### Uploading Your First Sketch


    The blinking LED is the Arduino equivalent to the “Hello World” program used in
    other languages as the traditional first program to run when learning a new language.
    Let’s test out the environment by installing this program on your Arduino board.


    When you start the Arduino application on your computer, it opens with an empty
    sketch. Fortunately, the application ships with a wide range of examples. So from
    the `File` menu, open the `Blink` example as shown in [Figure 2-2](images/fig-ch2-2.jpg).
    On a Windows machine, the serial port is always `COM` followed by a number. On
    Macs and Linux machines, you will see a much longer list of serial devices. The
    device will normally be the bottom selection in the list, with a name similar
    to `/dev/cu.usbmodem621`.

