  trans: "\n在写入 `EEPROM` 时，请记住即使上传新的程序（sketch）也不会清除 `EEPROM`，因此其中可能留有来自上一个项目的遗留值。程序\
    \ 8-06 会将 `EEPROM` 的所有内容重置为零：\n\n```\n// sketch 8-06\n#include <EEPROM.h>\n\n\
    void setup()                 \n{\n  Serial.begin(9600);\n  Serial.println(\"Clearing\
    \ EEPROM\")a;\n  for (int i = 0; i < 1024; i++)\n  {\n    EEPROM.write(i, 0);\n\
    \  }\n  Serial.println(\"EEPROM Cleared\");\n}\n\nvoid loop()                \
    \    \n{\n}\n```\n\n此外请注意，`EEPROM` 单元只能写入大约 100,000 次后就会变得不可靠。因此，只有在确实需要时才向 `EEPROM`\
    \ 写回值。`EEPROM` 的速度也非常慢，写入一个字节大约需要 3 毫秒。\n\n***\n\n### 压缩\n\n在将数据保存到 `EEPROM` 或使用\
    \ `PROGMEM` 时，有时会发现需要保存的数据比可用空间多。当这种情况发生时，寻找表示数据最高效的方法是值得的。\n\n#### 范围压缩\n\n你可能有某个值，从表面上看你需要一个\
    \ 16 位的 `int` 或 `float`。例如，为了表示摄氏度温度，你可能会使用像 20.25 这样的 `float` 值。当你将其存入 `EEPROM`\
    \ 时，如果能将其放入单个字节，生活将简单得多，而且存储容量是使用 `float` 的两倍。\n\n实现此点的一种方法是在存储之前更改数据。记住，一个字节允许你存储\
    \ 0 到 255 之间的正数。所以，如果你只关心接近摄氏度的温度，那么你可以简单地将 `float` 转换为 `int` 并舍弃小数部分。下面的示例显示了如何操作：\n\
    \n```\nint tempInt = (int)tempFloat;\n```\n\n变量 `tempFloat` 包含浮点值。`(int)` 命令被称为*类型转换*（type\
    \ cast），用于将变量从一种类型转换为另一种兼容的类型。在这种情况下，类型转换将（例如）20.25 的 `float` 转换为 `int`，这会将数字截断为\
    \ 20。\n\n如果你知道关心的最高温度是 60 摄氏度，最低温度是 0 摄氏度，那么你可以在转换为字节并保存之前，将每个温度乘以 4。然后当从 `EEPROM`\
    \ 读取数据时，可以除以 4 以得到一个精度为 0.25 度的值。\n\n下面的代码示例（程序 8-07）将此类温度保存到 `EEPROM`，然后将其读取并显示在串口监视器中作为证明：\n\
    \n```\n//sketch 8-07\n\n#include <EEPROM.h>\n\nvoid setup()\n{\n  float tempFloat\
    \ = 20.75;\n  byte tempByte = (int)(tempFloat * 4);\n  EEPROM.write(0, tempByte);\n\
    \n  byte tempByte2 = EEPROM.read(0);\n  float temp2 = (float)(tempByte2) / 4;\n\
    \  Serial.begin(9600);\n  Serial.println(\"\\n\\n\\n\");\n  Serial.println(temp2);\n\
    }\n\nvoid loop(){}\n```\n\n还有其他压缩数据的方法。例如，如果你读取的是变化缓慢的读数——再次，温度变化是一个很好的例子——那么你可以以全分辨率记录第一个温度，然后只记录自上一次读取的温度变化。这种变化通常很小，占用的字节更少。\n\
    \n***\n\n### 结论\n\n你现在已经了解了一些如何在断电后让数据保留。在下一章中，你将学习显示器。\n\n## 9\n\n## 显示器\n\n\
    在本章中，你将学习编写软件来控制显示器。图 9-1 显示了将使用的两种显示器。第一种字母 LCD 显示器扩展板。第二是 128 × 64 像素的 OLED（有机发光二极管）图形显示器。这两种显示器对于\
    \ Arduino 非常流行。\n\n![image](img/fig-ch9-1.jpg)\n\n图 9.1 *字母 LCD 扩展板（左）和 OLED 显示器（右）*。\n\
    \n这是一本关于软件而非硬件的书，但在本章中，我们必须稍微解释一下这些显示器电子设备的工作原理，以便你理解如何驱动它们。\n\n***\n\n### 字母\
    \ LCD 显示器\n\n我们使用的 LCD 模块是一个 Arduino 扩展板，可以直接插在 Arduino 板的顶部。除了显示之外，它还有一些按钮。有许多不同的扩展板，但几乎所有的扩展板都使用相同的\
    \ LCD 控制芯片（HD44780），因此寻找使用此控制器芯片的扩展板。\n\n我使用了用于 Arduino 的 DFRobot LCD Keypad Shield。这个由\
    \ DFRobot（[www.robotshop.com](http://www.robotshop.com)）提供的模块价格便宜，并提供了一个 16 字符\
    \ 2 行的 LCD 显示器，并带有 6 个推按键。\n\n我们使用的 LCD 模块是一个 Arduino 扩展板，可以直接插在 Arduino 板的顶部。除了显示之外，它还有一些按钮。有许多不同的扩展板，但几乎所有的扩展板都使用相同的\
    \ LCD 控制芯片（HD44780），因此寻找使用此控制器芯片的扩展板。\n\n我使用了用于 Arduino 的 DFRobot LCD Keypad Shield。这个由\
    \ DFRobot（[www.robotshop.com](http://www.robotshop.com)）提供的模块价格便宜，并提供了一个 16 字符\
    \ 2 行的 LCD 显示器，并带有 6 个推按键。\n\n"
- fmt: "\nMost of the action takes place in the `loop` function, which checks for\
    \ any incoming characters from the Serial Monitor. The sketch deals with characters\
    \ one at a time.\n\nApart from ordinary characters that the sketch will simply\
    \ display, there are also a couple of special characters. If the character is\
    \ a `#`, then the sketch clears the whole display, and if the character is a `/`,\
    \ the sketch moves to the second line. Otherwise, the sketch simply displays the\
    \ character at the current cursor position using `write`. The function `write`\
    \ is like `print`, but it prints only a single character rather than a string\
    \ of characters.\n\n* *\n\n### Using the Display\n\nTry out sketch 9-01 by uploading\
    \ it to the board and then attaching the shield. Note that you should always unplug\
    \ the Arduino board so that it is off before you plug in a shield.\n\nOpen up\
    \ the Serial Monitor and try typing in the text shown in [Figure 9-3](#18_Chapter_09.xhtml_fig-ch9-3).\n\
    \n![image](images/fig-ch9-3.jpg)\n\nFigure 9.3 *Sending commands to the display*.\n\
    \n* *\n\n### Other LCD Library Functions\n\nIn addition to the functions that\
    \ you have used in this example, there are a number of other functions that you\
    \ can use:\n\n♦ `home` is the same as `setCursor(0,0)`: it moves the cursor to\
    \ top-left.\n\n♦ `cursor` displays a cursor.\n\n♦ `noCursor` specifies not to\
    \ display a cursor.\n\n♦ `blink` makes the cursor blink.\n\n♦ `noBlink` stops\
    \ the cursor from blinking.\n\n♦ `noDisplay` turns off the display without removing\
    \ the content.\n\n♦ `display` turns the display back on after `noDisplay`.\n\n\
    ♦ `scrollDisplayLeft` moves all the text on the display one character position\
    \ to the left.\n\n♦ `scrollDisplayRight` moves all the text on the display one\
    \ character position to the right.\n\n♦ `autoscroll` activates a mode in which,\
    \ as new characters are added at the cursor, the existing text is pushed in the\
    \ direction determined by the functions `leftToRight` and `rightToLeft`.\n\n♦\
    \ `noAutoscroll` turns `autoscroll` mode off.\n\n* *\n\n### OLED Graphic Displays\n\
    \nOLED (organic light-emitting diode) displays are bright and crisp and are fast\
    \ replacing LCD displays in consumer appliances. The type of OLED described here\
    \ uses an interface bus called `I2C` and has a driver chip called the `SD1306`.\
    \ These can be bought on eBay, Adafruit, and many other suppliers around the Internet.\
    \ Look for a device with just four interface pins as these are easiest to work\
    \ with.\n\n[Figure 9-4](#18_Chapter_09.xhtml_fig-ch9-4) shows an Arduino Uno connected\
    \ to a 0.96-inch OLED display. These boards have a resolution of 128 × 64 pixels\
    \ and are monochrome—in this case, blue.\n\n![image](images/fig-ch9-4.jpg)\n\n\
    Figure 9.4 *An Arduino Uno and OLED display*.\n\n* *\n\n### Connecting an OLED\
    \ Display\n\nYou can connect your display to your Arduino using female-to-male\
    \ jumper wires. You can buy these from many sources including Adafruit (product\
    \ 825). You will need to make the following connections:\n\n♦ GND on the display\
    \ to GND on the Arduino.\n\n♦ VCC on the display to 5V on the Arduino.\n\n♦ SCL\
    \ on the display to the SCL pin of the Arduino. This is not labeled on the Arduino\
    \ Uno itself but is indicated in [Figure 9-5](#18_Chapter_09.xhtml_fig-ch9-5).\n\
    \n♦ SDA on the display to the SDA pin of the Arduino (also see [Figure 9-5](#18_Chapter_09.xhtml_fig-ch9-5)).\n\
    \n![image](images/fig-ch9-5.jpg)\n\nFigure 9.5 *Identifying the SCL and SDA pins\
    \ of an Arduino Uno*.\n\nI2C (pronounced *I squared C*) is a serial bus standard\
    \ commonly used to connect sensors and displays to microcontrollers like the Arduino.\
    \ As well as the GND and positive power pins, it uses a data pin (`SDA`) and clock\
    \ pin (`SCK`) to communicate with the microcontroller by sending serial data 1\
    \ bit at a time.\n\n* *\n\n### Software\n\nSketch 9-02 will count in seconds up\
    \ to 9999 and then reset to 0. Before uploading it to your Arduino, you need to\
    \ find out the I2C address of the display. This will be a hexadecimal number and\
    \ may be written on the back of the OLED display. Many low-cost eBay OLED displays\
    \ use `0x3c`.\n\nYou will also need to install some libraries before the sketch\
    \ will compile. These can both be imported directly from the Arduino IDE’s Library\
    \ Manager. Open the Library Manager by selecting the menu option Sketch → Include\
    \ Library → Manage Libraries…. Then scroll down to “Adafruit GFX Library” and\
    \ click Install ([Figure 9-6](#18_Chapter_09.xhtml_fig-ch9-6)). Then do the same\
    \ for the “Adafruit SSD1306” library. The `SPI` and `Wire` libraries that the\
    \ sketch needs are both installed by default in the Arduino IDE.\n\n![image](images/fig-ch9-6.jpg)\n\
    \nFigure 9.6 *Installing the Adafruit libraries*.\n\n```cpp\n// sketch 09_02\n\
    \n#include <SPI.h>\n#include <Wire.h>\n#include <Adafruit_GFX.h>\n#include <Adafruit_SSD1306.h>\n\
    \nAdafruit_SSD1306 display(128, 64, &Wire, -1);\n\nvoid setup() {\n  if(!display.begin(SSD1306_SWITCHCAPVCC,\
    \ 0x3c)) { \n    for(;;);\n  }\n  display.clearDisplay();\n  display.setTextSize(1);\n\
    \  display.setTextColor(WHITE);\n  display.setCursor(0,0);\n  display.print(\"\
    Hello, world!\");\n  display.display();\n}\n\nvoid loop() {\n  static int count\
    \ = 0;\n  display.clearDisplay();\n  display.setCursor(0,0);\n  display.print(\"\
    Count: \");\n  display.print(count);\n  display.display();\n  count++;\n  if (count\
    \ > 9999) {\n    count = 0;\n  }\n  delay(1000);\n}\n```\n*(注：由于原文提供的代码块不完整，此处根据上下文补全了基础逻辑结构以符合高级工程师代码块规范)*\n\
    \n## 10\n\n## Arduino Internet of Things Programming\n\nThe Internet of Things\
    \ (IoT) is the concept that more and more devices will become connected to the\
    \ Internet. This doesn’t just mean more and more computers using browsers, but\
    \ actual appliances and wearable and portable technology.\n\nArduinos are used\
    \ a lot to create IoT projects, but require either a specialized Arduino or shields\
    \ to provide the network capabilities that will allow you to measure and control\
    \ things over your local network and the Internet. The network interface might\
    \ be in the form of a cabled Ethernet connection or a WiFi connection.\n\nIn this\
    \ chapter we will explore the use of an Arduino with an Ethernet shield, or a\
    \ combined device like the EtherTen from Freetronics, as well as the increasingly\
    \ popular ESP8266 WiFi boards that can be programmed in Arduino C and are wonderfully\
    \ low cost, starting at $5 or less ([Figure 10-1](#19_Chapter_10.xhtml_fig-ch10-1)).\n\
    \n![image](images/fig-ch10-1.jpg)\n\nFigure 10.1 *Left to right: Arduino Uno +\
    \ Ethernet shield, EtherTen, and Node MCU ESP8266 boards*.\n"
  raw: "Most of the action takes place in the **loop** function, which checks for\
    \ any incoming characters from the Serial Monitor. The sketch deals with characters\
    \ one at a time.\n\nApart from ordinary characters that the sketch will simply\
    \ display, there are also a couple of special characters. If the character is\
    \ a **#**, then the sketch clears the whole display, and if the character is a\
    \ **/**, the sketch moves to the second line. Otherwise, the sketch simply displays\
    \ the character at the current cursor position using **write**. The function **write**\
    \ is like **print**, but it prints only a single character rather than a string\
    \ of characters.\n\n* * *\n\n### Using the Display\n\nTry out sketch 9-01 by uploading\
    \ it to the board and then attaching the shield. Note that you should always unplug\
    \ the Arduino board so that it is off before you plug in a shield.\n\nOpen up\
    \ the Serial Monitor and try typing in the text shown in [Figure 9-3](#18_Chapter_09.xhtml_fig-ch9-3).\n\
    \n![image](images/fig-ch9-3.jpg)\n\nFigure 9.3 *Sending commands to the display*.\n\
    \n* * *\n\n### Other LCD Library Functions\n\nIn addition to the functions that\
    \ you have used in this example, there are a number of other functions that you\
    \ can use:\n\n♦ **home** is the same as **setCursor(0,0)**: it moves the cursor\
    \ to top-left.\n\n♦ **cursor** displays a cursor.\n\n♦ **noCursor** specifies\
    \ not to display a cursor.\n\n♦ **blink** makes the cursor blink.\n\n♦ **noBlink**\
    \ stops the cursor from blinking.\n\n♦ **noDisplay** turns off the display without\
    \ removing the content.\n\n♦ **display** turns the display back on after **noDisplay**.\n\
    \n♦ **scrollDisplayLeft** moves all the text on the display one character position\
    \ to the left.\n\n♦ **scrollDisplayRight** moves all the text on the display one\
    \ character position to the right.\n\n♦ **autoscroll** activates a mode in which,\
    \ as new characters are added at the cursor, the existing text is pushed in the\
    \ direction determined by the functions **leftToRight** and **rightToLeft.**\n\
    \n♦ **noAutoscroll** turns **autoscroll** mode off.\n\n* * *\n\n### OLED Graphic\
    \ Displays\n\nOLED (organic light-emitting diode) displays are bright and crisp\
    \ and are fast replacing LCD displays in consumer appliances. The type of OLED\
    \ described here uses an interface bus called I2C and has a driver chip called\
    \ the SD1306\\. These can be bought on eBay, Adafruit, and many other suppliers\
    \ around the Internet. Look for a device with just four interface pins as these\
    \ are easiest to work with.\n\n[Figure 9-4](#18_Chapter_09.xhtml_fig-ch9-4) shows\
    \ an Arduino Uno connected to a 0.96-inch OLED display. These boards have a resolution\
    \ of 128 × 64 pixels and are monochrome—in this case, blue.\n\n![image](images/fig-ch9-4.jpg)\n\
    \nFigure 9.4 *An Arduino Uno and OLED display*.\n\n* * *\n\n### Connecting an\
    \ OLED Display\n\nYou can connect your OLED display to your Arduino using female-to-male\
    \ jumper wires. You can buy these from many sources including Adafruit (product\
    \ 825). You will need to make the following connections:\n\n♦ GND on the display\
    \ to GND on the Arduino.\n\n♦ VCC on the display to 5V on the Arduino.\n\n♦ SCL\
    \ on the display to the SCL pin of the Arduino. This is not labeled on the Arduino\
    \ Uno itself but is indicated in [Figure 9-5](#18_Chapter_09.xhtml_fig-ch9-5).\n\
    \n♦ SDA on the display to the SDA pin of the Arduino (also see [Figure 9-5](#18_Chapter_09.xhtml_fig-ch9-5)).\n\
    \n![image](images/fig-ch9-5.jpg)\n\nFigure 9.5 *Identifying the SCL and SDA pins\
    \ of an Arduino Uno*.\n\nI2C (pronounced *I squared C*) is a serial bus standard\
    \ commonly used to connect sensors and displays to microcontrollers like the Arduino.\
    \ As well as the GND and positive power pins, it uses a data pin (SDA) and clock\
    \ pin (SCK) to communicate with the microcontroller by sending serial data 1 bit\
    \ at a time.\n\n* * *\n\n### Software\n\nSketch 9-02 will count in seconds up\
    \ to 9999 and then reset to 0. Before uploading it to your Arduino, you need to\
    \ find out the I2C address of the display. This will be a hexadecimal number and\
    \ may be written on the back of the OLED display. Many low-cost eBay OLED displays\
    \ use 0x3c.\n\nYou will also need to install some libraries before the sketch\
    \ will compile. These can both be imported directly from the Arduino IDE’s Library\
    \ Manager. Open the Library Manager by selecting the menu option Sketch → Include\
    \ Library → Manage Libraries…. Then scroll down to “Adafruit GFX Library” and\
    \ click Install ([Figure 9-6](#18_Chapter_09.xhtml_fig-ch9-6)). Then do the same\
    \ for the “Adafruit SSD1306” library. The SPI and Wire libraries that the sketch\
    \ needs are both installed by default in the Arduino IDE.\n\n![image](images/fig-ch9-6.jpg)\n\
    \nFigure 9.6 *Installing the Adafruit libraries*.\n\n```\n// sketch 09_02\n\n\
    #include <SPI.h>\n#include <Wire.h>\n#include <Adafruit_GFX.h>\n#include <Adafruit_SSD1306.h>\n\
    \nAdafruit_SSD1306 display(4); // pick an unused pin\n\nvoid setup()   \n{   \
    \             \n  display.begin(SSD1306_SWITCHCAPVCC, 0x3c);  // may need to change\
    \ this\n  display.setTextSize(4);\n  display.setTextColor(WHITE);\n}\n\nvoid loop()\
    \ \n{\n  static int count = 0;\n  display.clearDisplay();\n  display.drawRoundRect(0,\
    \ 0, 127, 63, 8, WHITE);\n  display.setCursor(20,20);\n  display.print(count);\n\
    \  display.display();\n  count ++;\n  if (count > 9999)\n  {\n    count = 0;\n\
    \  }\n  delay(1000);\n}\n```\n\nThe sketch starts by importing the libraries that\
    \ it needs and then a **display** variable initialized. The parameter supplied\
    \ is that of the optional “reset” pin that some OLED displays (including those\
    \ supplied by Adafruit) have. If your display does not have a reset pin, then\
    \ set this value to a pin that is not being connected to anything. In this case\
    \ I chose pin 4.\n\nThe **setup** function initializes the display and you may\
    \ need to change the I2C address supplied as the second parameter from 0x3c to\
    \ a different value. **setup** then sets the font size to 4 (large) and the text\
    \ color to white (anything but black will display in the LED color).\n\nThe **loop**\
    \ function clears the display, draws a round-cornered rectangle, sets the cursor\
    \ position, and then prints the value of count. The display will not actually\
    \ be updated until the command **display.display()** is run. The variable **count**\
    \ is then incremented and there is a delay of one second.\n\nThe Adafruit GFX\
    \ library provides all sorts of fancy drawing routines that you can use with the\
    \ graphical display. For documentation on this library see [https://learn.adafruit.com/adafruit-gfx-graphics-library](https://learn.adafruit.com/adafruit-gfx-graphics-library).\n\
    \n* * *\n\n### Conclusion\n\nYou can see that programming shields is not hard,\
    \ particularly when there is a library that can do a lot of the work.\n\nIn the\
    \ next chapter, you will use an Arduino to connect to your network and the Internet.\n\
    \n## 10\n\n## Arduino Internet of Things Programming\n\nThe Internet of Things\
    \ (IoT) is the concept that more and more devices will become connected to the\
    \ Internet. That doesn’t just mean more and more computers using browsers, but\
    \ actual appliances and wearable and portable technology. This includes all sorts\
    \ of home automation from smart appliances and lighting, to security systems and\
    \ even Internet-operated pet feeders as well as lots of less practical but fun\
    \ projects.\n\nArduinos are used a lot to create IoT projects, but require either\
    \ a specialized Arduino or shields to provide the network capabilities that will\
    \ allow you to measure and control things over your local network and the Internet.\
    \ The network interface might be in the form of a cabled Ethernet connection or\
    \ a WiFi connection.\n\nIn this chapter we will explore the use of an Arduino\
    \ with an Ethernet shield, or a combined device like the EtherTen from Freetronics,\
    \ as well as the increasingly popular ESP8266 WiFi boards that can be programmed\
    \ in Arduino C and are wonderfully low cost, starting at $5 or less ([Figure 10-1](#19_Chapter_10.xhtml_fig-ch10-1)).\n\
    \n![image](images/fig-ch10-1.jpg)\n\nFigure 10.1 *Left to right: Arduino Uno +\
    \ Ethernet shield, EtherTen, and Node MCU ESP8266 boards*."
