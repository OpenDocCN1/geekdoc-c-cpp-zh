    \n要从 `EEPROM` 读回 `int`，你需要从 `EEPROM` 读取两个字节并重构 `int`，如下：\n\n```\nbyte high = EEPROM.read(0);\n\
    byte low = EEPROM.read(1);\nint x = (high << 8) + low;\n```\n\n`<<` 运算符是一个位移运算符，它将高位字节移动到\
    \ `int` 的顶部，然后加上低字节。\n\n#### 使用 AVR EEPROM 库\n\n如果你只使用单字节，使用 `EEPROM` 的官方 Arduino\
    \ 方法完全可以。但是，正如你在 `ints` 中看到的那样，对于较大的数据类型，这变得更加复杂。对于浮点数（4 字节）更糟。幸运的是，有一种替代方法，使用了\
