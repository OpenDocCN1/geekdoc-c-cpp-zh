    \nIn addition to creating the data in a special way, you also have to read the\
    \ data back a special way. Your code to get the code string for a Morse letter\
    \ from the array has to be modified to look like this:\n\n```\nstrcpy_P(buffer,\
    \ (char*)pgm_read_word(&(letters[ch - 'a'])));\n```\n\nThis uses a **buffer**\
    \ variable into which the **PROGMEM** string is copied, so that it can be used\
    \ as a regular **char** array. This needs to be defined as a global variable as\
    \ follows:\n\n```\nchar buffer[6];\n```\n\nThis approach works only if the data\
    \ is constant—that is, you are not going to change it while the sketch is running.\
    \ In the next section, you will learn about using the EEPROM memory that is intended\
    \ for storing persistent data that can be changed.\n\nIf you have individual strings\
    \ that are perhaps formatted for messages to be displayed on the serial monitor,\
    \ then Arduino C provides a handy shortcut. You can just enclose the string in\
    \ F() as shown in the example below:\n\n```\nSerial.println(F(\"Hello World\"\
    ));\n```\n\nThe string will then be stored in flash memory, rather than use up\
    \ RAM.\n\n* * *\n\n### EEPROM\n\nThe ATMega328 at the heart of an Arduino Uno\
    \ has a kilobyte of electrically erasable read-only memory (EEPROM). EEPROM is\
    \ designed to remember its contents for many years. Despite its name, it is not\
    \ really read-only. You can write to it.\n\nThe official Arduino commands for\
    \ reading and writing to EEPROM are just as awkward to use as the ones for using\
    \ **PROGMEM**. You have to read and write to and from EEPROM one byte at a time.\n\
    \nThe example of sketch 8-02 allows you to enter a single-digit letter code from\
    \ the Serial Monitor. The sketch then remembers the digit and repeatedly writes\
    \ it out on the Serial Monitor.\n\n```\n// sketch 8-02\n#include <EEPROM.h>\n\n\
    int addr = 0;\nchar ch;\n\nvoid setup()\n{\n  Serial.begin(9600);\n  ch = EEPROM.read(addr);\n\
    }\n\nvoid loop()\n{\n  if (Serial.available() > 0)\n  {\n    ch = Serial.read();\n\
    \    EEPROM.write(0, ch);\n    Serial.println(ch);\n  }\n  Serial.println(ch);\n\
    \  delay(1000);\n}\n```\n\nTo try this sketch, open the Serial Monitor and enter\
    \ a new character. Then unplug the Arduino and plug it back in. When you reopen\
    \ the Serial Monitor, you will see that the letter has been remembered.\n\nThe\
    \ function **EEPROM.write** takes two arguments. The first is the address, which\
    \ is the memory location in EEPROM and should be between 0 and 1023\\. The second\
    \ argument is the data to write at that location. This must be a single byte.\
    \ A character is represented as eight bits, so this is fine, but you cannot directly\
    \ store a 16-bit **int**.\n\n#### Storing an int in EEPROM\n\nTo store a two-byte\
    \ **int** in locations 0 and 1 of the EEPROM, you could do this:\n\n```\n int\
    \ x = 1234; \n  EEPROM.write(0, highByte(x));\n  EEPROM.write(1, lowByte(x));\n\
    ```\n\nThe functions **highByte** and **lowByte** are useful for separating an\
    \ **int** into two bytes. [Figure 8-1](#17_Chapter_08.xhtml_fig-ch8-1) shows how\
    \ this **int** is actually stored in the EEPROM.\n\n![image](images/fig-ch8-1.jpg)\n\
    \nFigure 8.1 *Storing a 16-bit integer in EEPROM*.\n\nTo read the **int** back\
    \ out of EEPROM, you need to read the two bytes from the EEPROM and reconstruct\
    \ the **int**, as follows:\n\n```\nbyte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\n\
    int x = (high << 8) + low;\n```\n\nThe **<<** operator is a bit shift operator\
    \ that moves the eight high bytes to the top of the **int** and then adds in the\
    \ low byte.\n\n#### Using the AVR EEPROM Library\n\nThe official Arduino way of\
    \ using EEPROM is just fine if you are only using single bytes. However, as you\
    \ saw with **ints**, this becomes more complicated for larger data types. It’s\
    \ even worse for floats (4 bytes). Fortunately, there is an alternative method\
    \ that uses one of the libraries that Arduino itself uses called the AVR EEPROM\
    \ library. This allows you to read and write as much data as will fit into your\
    \ EEPROM with single commands.\n\nThe example of sketch 8-03 uses this library\
    \ to write and then read an **int**.\n\n```\n// sketch 08-03\n\n#include <avr/eeprom.h>\n\
    \nvoid setup() \n{\n  Serial.begin(9600);\n  int i1 = 123;\n  eeprom_write_block(&i1,\
    \ 0, 2);\n  int i2 = 0;\n  eeprom_read_block(&i2, 0, 2);\n  Serial.println(i2);\n\
    }\n\nvoid loop() \n{\n}\n```\n\nThe library is actually included in the Arduino\
    \ IDE, so you do not need to install anything, just include the library. The function\
    \ that writes to EEPROM is called **eeprom_write_block** and, as the name suggests,\
    \ it writes a block of memory into EEPROM. Its first parameter is a reference\
    \ to the variable. In this case, this is to **i1** that has been given a value\
    \ of 123\\. There is an & in front of **i1** as the function expects the parameter\
    \ to be a reference to the variable’s address in memory rather than the variable’s\
    \ value. The second parameter is the starting byte in EEPROM where the block should\
    \ be written and the final parameter is the number of bytes to write (2 for an\
    \ **int**).\n\nReading the value from EEPROM back into a RAM variable (**i2**)\
    \ is a mirror of the writing process with the same parameters.\n\n#### Storing\
    \ a float in EEPROM\n\nStoring a float in EEPROM using the AVR EEPROM library\
    \ is very similar to storing an **int** as sketch 8-04 illustrates.\n\n```\n//\
    \ sketch 08-04\n\n#include <avr/eeprom.h>\n\nvoid setup() \n{\n  Serial.begin(9600);\n\
    \  float f1 = 1.23;\n  eeprom_write_block(&f1, 0, 4);\n  float f2 = 0;\n  eeprom_read_block(&f2,\
    \ 0, 4);\n  Serial.println(f2);\n}\n\nvoid loop() \n{\n}\n```\n\nThe main difference\
    \ is that this time the final parameter to **eeprom_write_block** and **eeprom_read_block**\
    \ is 4 (4 bytes) rather than 2.\n\n#### Storing a String in EEPROM\n\nWriting\
    \ and reading character strings into the EEPROM is also best accomplished using\
    \ the AVR EEPROM library. Sketch 8-05 illustrates this with an example that reads\
    \ and writes passwords from EEPROM. The sketch first displays this password read\
    \ from EEPROM and then prompts you to enter a new password ([Figure 8-2](#17_Chapter_08.xhtml_fig-ch8-2)).\
    \ Having set the password, you can unplug the Arduino to power it down and when\
    \ you plug it back in again and open the Serial Monitor, the old password will\
    \ still be there.\n\n![image](images/fig-ch8-2.jpg)\n\nFigure 8.2 *Missing figure\
    \ caption*.\n\n```\n// sketch 08-05\n\n#include <avr/eeprom.h>\n\nconst int maxPasswordSize\
    \ = 20;\n\nchar password[maxPasswordSize];\n\nvoid setup() \n{\n  eeprom_read_block(&password,\
    \ 0, maxPasswordSize);\n  Serial.begin(9600);\n}\n\nvoid loop() \n{\n  Serial.print(\"\
    Your password is:\");\n  Serial.println(password);\n  Serial.println(\"Enter a\
    \ NEW password\");     \n  while (!Serial.available()) {};\n  int n = Serial.readBytesUntil('\\\
    n', password, \n    maxPasswordSize);\n  password[n] = '\\0';\n  eeprom_write_block(password,\
    \ 0, maxPasswordSize);  \n  Serial.print(\"Saved Password: \");\n  Serial.println(password);\n\
    }\n```\n\nThe character array **password** has a fixed size of 20 characters that\
    \ must also include the ‘\\0’ end marker. In the **startup** function the contents\
    \ of EEPROM starting at location 0 are read into **password**.\n\nThe **loop**\
    \ function displays the necessary messages and then the **while** loop does nothing\
    \ until serial communication arrives, indicated by **Serial.available** returning\
    \ more than 0\\. The **readBytesUntil** function will then keep reading characters\
    \ until the end of line character ‘\\n’ is encountered. The bytes being read will\
    \ be put straight into the **password char** array.\n\nBecause you don’t know\
    \ how long a password will be entered, the result of reading the bytes is stored\
    \ in **n** and then element **n** of the password is set to ‘\\0’ to mark the\
    \ end of the string. Finally, the new password is printed to the Serial Monitor\
    \ to confirm the change in password.\n\n#### Clearing the Contents of EEPROM"
