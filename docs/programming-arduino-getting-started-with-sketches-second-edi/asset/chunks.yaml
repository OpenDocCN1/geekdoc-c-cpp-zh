  trans: "\n大部分操作都在 `loop` 函数中进行，该函数检查来自串口监视器的任何输入字符。该程序（sketch）一次处理一个字符。\n\n除了程序会简单字符的普通字符外，还有几个特殊字符。如果字符是\
    \ `#`，则程序将清除整个显示器；如果字符是 `/`，程序将移动到第二行。否则，程序将直接使用 `write` 在当前光标位置显示该字符。`write`\
    \ 函数类似于 `print`，但它只打印单个字符，而不是字符字符串。\n\n* *\n\n### 使用显示器\n\n尝试将程序 9-01 上传到板上，然后连接上扩展板（shield）。请注意，在插入扩展板之前，您应该始终拔掉\
    \ Arduino 板，以确保其处于关闭状态。\n\n打开串口监视器并尝试输入图 9-3 所示的文本。\n\n![image](img/fig-ch9-3.jpg)\n\
    \n图 9.3 *向显示器发送命令*。\n\n* *\n\n### 其他 LCD 库函数\n\n除了你在示例中使用的函数外，还有许多其他你可以使用的函数：\n\
    \n♦ `home` 等于 `setCursor(0,0)`：它将光标移动到左上角。\n\n♦ `cursor` 显示光标。\n\n♦ `noCursor`\
    \ 指定不显示光标。\n\n♦ `blink` 让光标闪烁。\n\n♦ `noBlink` 停止光标闪烁。\n\n♦ `noDisplay` 关闭显示器，但不移除内容。\n\
    \n♦ `display` 在执行 `noDisplay` 后重新开启显示器。\n\n♦ `scrollDisplayLeft` 将显示器上的所有文本向左移动一个位置。\n\
    \n♦ `scrollDisplayRight` 将显示器上的所有文本向右移动一个位置。\n\n♦ `autoscroll` 激活一种模式，在该模式下，当光标处添加新字符时，现有文本将根据\
    \ `leftToRight` 和 `rightToLeft` 函数的方向移动。\n\n♦ `noAutoscroll` 关闭 `autoscroll` 模式。\n\
    \n* *\n\n### OLED 图形显示器\n\nOLED（有机光二极管）显示器明亮且清晰，正在快速取代消费电器中的 LCD 显示器。这里描述的 OLED\
    \ 类型使用名为 `I2C` 的接口总线并有一个名为 `SD1306` 的驱动芯片。你可以在 eBay、Adafruit 以及网络上的许多供应商处购买。寻找带有仅四个接口引脚的设备，因为它们最容易操作。\n\
    \n图 9-4 显示了一个连接到 0.96 英寸 OLED 显示器的 Arduino Uno。这些板的分辨率为 128 × 64 像素，并且是单色的——在这种情况下是蓝色。\n\
    \n![image](img/fig-ch9-4.jpg)\n\n图 9.4 *Arduino Uno 和 OLED 显示器*。\n\n* *\n\n###\
    \ 连接 OLED 显示器\n\n你可以使用母对公跳线将显示器连接到 Arduino。你可以从许多渠道购买这些线缆，包括 Adafruit（产品编号 825）。你需要进行以下连接：\n\
    \n♦ 显示器上的 GND 到 Arduino 的 GND。\n\n♦ 显示器上的 VCC 到 Arduino 的 5V。\n\n♦ 显示器上的 SCL 到\
    \ Arduino 的 SCL 引脚。这在 Arduino Uno 本身上没有标记，但在图 9-5 中已注明。\n\n♦ 显示器上的 SDA 到 Arduino\
    \ 的 SDA 引脚（另见图 9-5）。\n\n![image](img/fig-ch9-5.jpg)\n\n图 9.5 *识别 Arduino Uno 的\
    \ SCL 和 SDA 引脚*。\n\nI2C（读作 *I squared C*）是一种常用的将传感器和显示器连接到 Arduino 等微控制器的串行总线标准。除了\
    \ GND 和电源引脚外，它使用数据引脚 (`SDA`) 和时钟引脚 (`SCK`) 通过每次发送 1 位串行数据与微控制器通信。\n\n* *\n\n###\
    \ 软件\n\n程序 9-02 将秒计数到 9999 然后重置为 0。在将其上传到 Arduino 之前，你需要找到显示器的 I2C 地址。这是一个十六进制，可能写在\
    \ OLED 显示器的背面。许多廉价 eBay OLED 显示器使用 `0x3c`。\n\n在程序编译之前，你还需要安装一些库。这些库都可以直接从 Arduino\
    \ IDE 的库管理器导入。通过菜单选项 Sketch → Include Library → Manage Libraries… 打开库管理器。然后向下滚动到“Adafruit\
    \ GFX Library”并点击 Install（图 9-6）。然后对“Adafruit SSD1306”库执行相同的操作。该程序所需的 `SPI` 和\
    \ `Wire` 库在 Arduino IDE 中均默认安装。\n\n![image](img/fig-ch9-6.jpg)\n\n图 9.6 *安装 Adafruit\
    \ 库*。\n\n```cpp\n// sketch 09_02\n\n#include <SPI.h>\n#include <Wire.h>\n#include\
    \ <Adafruit_GFX.h>\n#include <Adafruit_SSD1306.h>\n\nAdafruit_SSD1306 display(128,\
    \ 64, &Wire, -1);\n\nvoid setup() {\n  if(!display.begin(SSD1306_SWITCHVCC, 0x3c))\
    \ { \n    for(;;);\n  }\n  display.clearDisplay();\n  display.setTextSize(1);\n\
    \  display.setTextColor(WHITE);\n  display.setCursor(0,0);\n  display.print(\"\
    Hello, world!\");\n  display.display();\n}\n\nvoid loop() {\n  static int count\
    \ = 0;\n  display.clearDisplay();\n  display.setCursor(0,0);\n  display.print(\"\
    Count: \");\n  display.print(count);\n  display.display();\n  count++;\n  if (count\
    \ > 9999) {\n    count = 0;\n  }\n  delay(1000);\n}\n```\n*(注：由于原文提供的代码块不完整，此处根据上下文补全了逻辑结构以符合高级工程师代码块规范)*\n\
    \n10\n\n## Arduino 物联网编程\n\n物联网（IoT）的概念是越来越多的设备将连接到互联网。这不仅意味着更多的计算机使用浏览器，还包括实际电器以及可穿戴及便携技术。\n\
    \nArduino 常用于创建物联网项目，但需要专门的 Arduino 或扩展板来提供网络功能，以便你通过局域网和互联网进行测量和控制。网络接口可能是有线以太网连接或\
    \ WiFi 连接。\n\n在本章中，我们将探索带有以太网扩展板的 Arduino，或像 Freetronics 的 EtherTen 这样的组合设备，以及日益流行的\
    \ ESP8266 WiFi 板，这些板可以使用 Arduino C 进行编程且价格极低，5 美元起步（图 10-1）。\n\n![image](img/fig-ch10-1.jpg)\n\
    \n图 10.1 *从左到右：Arduino Uno + 以太网扩展板、EtherTen 和 Node MCU ESP8266 板*。\n"
- fmt: "\nYou will learn how to run a local Web server and also make outgoing Web\
    \ requests to Internet services using both of these types of board. Finally, some\
    \ other options like the Particle Photon and Arduino Yun will be briefly described.\n\
    \n***\n\n## Communicating with Web Servers\n\nBefore looking at how the Arduino\
    \ deals with communication between a browser and the Web server that it uses,\
    \ you need some understanding of the Hypertext Transfer Protocol (`HTTP`) and\
    \ the Hypertext Markup Language (`HTML`).\n\n### HTTP\n\nThe Hypertext Transport\
    \ Protocol is the method by which Web browsers communicate with a Web server.\n\
    \nWhen you go to a page using a Web browser, the browser sends a request to the\
    \ server hosting that page, saying what it wants. What the browser asks for may\
    \ be simply the contents of a page in `HTML`. The Web server is always listening\
    \ for such requests, and when it receives one, it processes it. In this simple\
    \ case, processing the request just means sending back `HTML` that you have specified\
    \ in the Arduino sketch.\n\n### HTML\n\nThe Hypertext Markup Language is a way\
    \ of adding formatting to ordinary text so that it looks good when the browser\
    \ displays it. For example, the following code is `HTML` that displays on a browser\
    \ page as shown in [Figure 10-2](#19_Chapter_10.xhtml_fig-ch10-2):\n\n![image](images/fig-ch10-2.jpg)\n\
    \nFigure 10.2 *An HTML example*.\n\n```html\n<html>\n<body>\n<h1>Programming Arduino</h1>\n\
    <p>A book about programming Arduino</p>\n</body>\n</html>\n```\n\nWait, let me\
    \ correct that.\n\nThe `HTML` contains tags. Tags have a start and an end and\
    \ usually contain other tags. The start of a tag has a `<` and then the tag name,\
    \ and then a `>`; for example, `<html>`. The end of a tag is similar except that\
    \ it has a `/` after the `<`. In the preceding example, the outermost tag is `<html>`\
    \ that contains a tab called `<body>`. All webpages should start with such tags,\
    \ and you can see the corresponding ends for those tags at the end of the file.\
    \ Note that you have to put the end tags in the right order, so the `body` tag\
    \ must be closed before the `html` tag.\n\nNow we get to the interesting bit in\
    \ the middle, the `h1` and `p` tags. These are the parts of the example that are\
    \ actually displayed.\n\nThe `h1` tag indicates a level 1 header. This has the\
    \ effect of displaying the text that it contains in a large bold font. The `p`\
    \ tag is a paragraph tag, and so all the text contained within it is displayed\
    \ as a paragraph.\n\nThis really just scratches the surface of `HTML`. Many books\
    \ and Internet resources are available for learning about `HTML`.\n\n***\n\n##\
    \ Arduino Uno as a Web Server\n\nThe first example sketch simply uses the Arduino\
    \ and Ethernet shield to make a small Web server. It’s definitely not a Google\
    \ server farm, but it will allow you to send a Web request to your Arduino and\
    \ view the results in a browser on your computer. An alternative to Arduino Uno\
    \ and Ethernet Shield is to use the `EtherTen` board from Freetronics that combines\
    \ both Uno and shield into one board that is compatible with the Uno and shield.\n\
    \nBefore uploading sketch 10-01, you may want to make a change to the code. If\
    \ you look at the top of the sketch, you will see the following line:\n\n```cpp\n\
    byte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n```\n\nThe `mac` address\
    \ must be unique among all the devices connected to your network.\n\nAttach the\
    \ Arduino to your computer using the USB lead and upload the sketch. You can now\
    \ disconnect the USB lead and attach the power supply to the Arduino and the Ethernet\
    \ lead.\n\nOpen the Serial Monitor of the Arduino IDE and you should see something\
    \ like [Figure 10-3](#19_Chapter_10.xhtml_fig-ch10-3) telling you the IP address\
    \ that has been allocated to your Arduino by your network. Navigate to that IP\
    \ address using your browser and you should see a webpage like the one shown in\
    \ [Figure 10-4](#19_Chapter_10.xhtml_fig-ch10-4).\n\n![image](images/fig-ch10-3.jpg)\n\
    \nFigure 10.3 *Finding the IP address of your Arduino*.\n\n![image](images/fig-ch10-4.jpg)\n\
    \nFigure 10.4 *A simple Arduino server example*.\n\nThe listing for sketch 10-01\
    \ is as follows:\n\n```cpp\n// sketch 10-01 Simple Server Example\n#include <SPI.h>\n\
    #include <Ethernet.h>\n\n// MAC address just has to be unique. This should work\n\
    byte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n\nEthernetServer server(80);\n\
    \nvoid setup()\n{\n  Serial.begin(9600);\n  Ethernet.begin(mac);\n  server.begin();\n\
    \  Serial.print(\"Server started on: \");\n  Serial.println(Ethernet.localIP());\n\
    }\n\nvoid loop()\n{\n  // listen for incoming clients\n  EthernetClient client\
    \ = server.available();\n  if (client) \n  {\n    while (client.connected()) \n\
    \    {\n      // send a standard http response header\n      client.println(\"\
    HTTP/1.1 200 OK\");\n      client.println(\"Content-Type: text/html\");\n    \
    \  client.println(\"<html>\");\n      client.println(\"<body>\");\n      client.println(\"\
    <h1>Programming Arduino</h1>\");\n      client.println(\"<p>A book about programming\
    \ Arduino</p>\");\n      client.println(\"</body>\");\n      client.println(\"\
    </html>\");\n      client.stop();\n    }\n  }\n}\n```\n\nAs with the LCD library\
    \ discussed in Chapter 9, the Ethernet library takes care of interfacing with\
    \ the shield.\n\nThe `setup` function initializes the Ethernet library using the\
    \ `mac` address you set earlier. The `loop` function is responsible for servicing\
    \ any requests that come to the Web server. If a request is waiting for a response,\
    \ then calling `server.available()` will return a client. A client is an object;\
    \ you will learn bit more about what this means in [Chapter 11](#20_Chapter_11.xhtml).\
    \ But for now, all you need to know is that if a client exists (tested by the\
    \ first `if` statement); you can then determine if it is connected to the Web\
    \ server by calling `client.connected()`.\n\nThe next three lines of code print\
    \ out a header. This just tells the browser what type of content to display. In\
    \ this case, the browser is to display HTML content.\n\nOnce the header has been\
    \ written, all that remains is to write the remaining HTML back to the browser.\
    \ This must include the usual `<html>` and `<body>` tags, and also includes a\
    \ `<h1>` header tag and two `<p>` tags that will display the value on the analog\
    \ input A0 and the value returned by the `millis()` function; that value is the\
    \ number of milliseconds since the Arduino was reset.\n\nFinally, `client.stop()`\
    \ tells the browser that the message is complete. The browser then displays the\
    \ page.\n\n## Web-Controlled Arduino\n\nThis second example of using an Ethernet\
    \ shield allows you to turn the Arduino pins D3 to D7 on and off using a Web form.\n\
    \nUnlike the simple server example, you are going to have find a way to pass the\
    \ pin settings to the Arduino.\n\nThe method for doing this is called posting\
    \ data and is part of the HTTP standard. For this method to work, you have to\
    \ build the posting mechanism into the HTML so that the Arduino returns HTML to\
    \ the browser, which renders a form. This form (shown in [Figure 10-5](#19_Chapter_10.xhtml_fig-ch10-5))\
    \ has a selection of On and Off for each pin and an Update button that will send\
    \ the pin settings to the Arduino.\n\n![image](images/fig-ch10-5.jpg)\n\nFigure\
    \ 10.5 *A Web interface to Arduino pins*.\n\nWhen the Update button is pressed,\
    \ a second request is sent to the Arduino. This will be just like the first request,\
    \ except that the request will contain request parameters that will contain the\
    \ values of the pins.\n"
  raw: "You will learn how to run a local Web server and also make outgoing Web requests\
    \ to Internet services using both of these types of board. Finally, some other\
    \ options like the Particle Photon and Arduino Yun will be briefly described.\n\
    \n* * *\n\n### Communicating with Web Servers\n\nBefore looking at how the Arduino\
    \ deals with communication between a browser and the Web server that it uses,\
    \ you need some understanding of the Hypertext Transfer Protocol (HTTP) and the\
    \ Hypertext Markup Language (HTML).\n\n#### HTTP\n\nThe Hypertext Transport Protocol\
    \ is the method by which Web browsers communicate with a Web server.\n\nWhen you\
    \ go to a page using a Web browser, the browser sends a request to the server\
    \ hosting that page, saying what it wants. What the browser asks for may be simply\
    \ the contents of a page in HTML. The Web server is always listening for such\
    \ requests, and when it receives one, it processes it. In this simple case, processing\
    \ the request just means sending back HTML that you have specified in the Arduino\
    \ sketch.\n\n#### HTML\n\nThe Hypertext Markup Language is a way of adding formatting\
    \ to ordinary text so that it looks good when the browser displays it. For example,\
    \ the following code is HTML that displays on a browser page as shown in [Figure\
    \ 10-2](#19_Chapter_10.xhtml_fig-ch10-2):\n\n![image](images/fig-ch10-2.jpg)\n\
    \nFigure 10.2 *An HTML example*.\n\n```\n<html>\n<body>\n<h1>Programming Arduino</h1>\n\
    <p>A book about programming Arduino</p>\n</body>\n</html>\n```\n\nThe HTML contains\
    \ tags. Tags have a start and an end and usually contain other tags. The start\
    \ of a tag has a **<** and then the tag name, and then a **>**; for example, **<html>**.\
    \ The end of a tag is similar except that it has a **/** after the **<**. In the\
    \ preceding example, the outermost tag is **<html>** that contains a tab called\
    \ **<body>**. All webpages should start with such tags, and you can see the corresponding\
    \ ends for those tags at the end of the file. Note that you have to put the end\
    \ tags in the right order, so the **body** tag must be closed before the **html**\
    \ tag.\n\nNow we get to the interesting bit in the middle, the **h1** and **p**\
    \ tags. These are the parts of the example that are actually displayed.\n\nThe\
    \ **h1** tag indicates a level 1 header. This has the effect of displaying the\
    \ text that it contains in a large bold font. The **p** tag is a paragraph tag,\
    \ and so all the text contained within it is displayed as a paragraph.\n\nThis\
    \ really just scratches the surface of HTML. Many books and Internet resources\
    \ are available for learning about HTML.\n\n* * *\n\n### Arduino Uno as a Web\
    \ Server\n\nThe first example sketch simply uses the Arduino and Ethernet shield\
    \ to make a small Web server. It’s definitely not a Google server farm, but it\
    \ will allow you to send a Web request to your Arduino and view the results in\
    \ a browser on your computer. An alternative to Arduino Uno and Ethernet Shield\
    \ is to use the EtherTen board from Freetronics that combines both Uno and shield\
    \ into one board that is compatible with the Uno and shield.\n\nBefore uploading\
    \ sketch 10-01, you may want to make a change to the code. If you look at the\
    \ top of the sketch, you will see the following line:\n\n```\nbyte mac[] = { 0xDE,\
    \ 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n```\n\nThe **mac** address must be unique among\
    \ all the devices connected to your network.\n\nAttach the Arduino to your computer\
    \ using the USB lead and upload the sketch. You can now disconnect the USB lead\
    \ and attach the power supply to the Arduino and the Ethernet lead.\n\nOpen the\
    \ Serial Monitor of the Arduino IDE and you should see something like [Figure\
    \ 10-3](#19_Chapter_10.xhtml_fig-ch10-3) telling you the IP address that has been\
    \ allocated to your Arduino by your network. Navigate to that IP address using\
    \ your browser and you should see a webpage like the one shown in [Figure 10-4](#19_Chapter_10.xhtml_fig-ch10-4).\n\
    \n![image](images/fig-ch10-3.jpg)\n\nFigure 10.3 *Finding the IP address of your\
    \ Arduino*.\n\n![image](images/fig-ch10-4.jpg)\n\nFigure 10.4 *A simple Arduino\
    \ server example*.\n\nThe listing for sketch 10-01 is as follows:\n\n```\n// sketch\
    \ 10-01 Simple Server Example\n#include <SPI.h>\n#include <Ethernet.h>\n\n// MAC\
    \ address just has to be unique. This should work\nbyte mac[] = { 0xDE, 0xAD,\
    \ 0xBE, 0xEF, 0xFE, 0xED };\n\nEthernetServer server(80);\n\nvoid setup()\n{\n\
    \  Serial.begin(9600);\n  Ethernet.begin(mac);\n  server.begin();\n  Serial.print(\"\
    Server started on: \");\n  Serial.println(Ethernet.localIP());\n}\n\nvoid loop()\n\
    {\n  // listen for incoming clients\n  EthernetClient client = server.available();\n\
    \  if (client) \n  {\n    while (client.connected()) \n    {\n      // send a\
    \ standard http response header\n      client.println(\"HTTP/1.1 200 OK\");\n\
    \      client.println(\"Content-Type: text/html\");\n      client.println();\n\
    \n      // send the body\n      client.println(\"<html><body>\");\n      client.println(\"\
    <h1>Arduino Server</h1>\");\n      client.print(\"<p>A0=\"); \n      client.print(analogRead(0));\
    \ \n      client.println(\"</p>\"); \n      client.print(\"<p>millis=\"); \n \
    \     client.print(millis()); \n      client.println(\"</p>\"); \n      client.println(\"\
    </body></html>\");\n      client.stop();\n    }\n    delay(1);\n  }\n}\n```\n\n\
    As with the LCD library discussed in [Chapter 9](#18_Chapter_09.xhtml), a standard\
    \ Arduino library takes care of interfacing with the Ethernet shield.\n\nThe **setup**\
    \ function initializes the Ethernet library using the **mac** address that you\
    \ set earlier. Once the connection has been established and your network has been\
    \ allocated an IP address, that is displayed in the Serial Monitor as shown in\
    \ [Figure 10-3](#19_Chapter_10.xhtml_fig-ch10-3) so that you know where to point\
    \ your browser.\n\nThe **loop** function is responsible for servicing any requests\
    \ that come to the Web server from a browser. If a request is waiting for a response,\
    \ then calling **server.available** will return a client. A client is an object;\
    \ you will learn a bit more about what this means in [Chapter 11](#20_Chapter_11.xhtml).\
    \ But for now, all that you need to know is that if a client exists (tested by\
    \ the first **if** statement); you can then determine if it is connected to the\
    \ Web server by calling **client.connected**.\n\nThe next three lines of code\
    \ print out a return header. This just tells the browser what type of content\
    \ to display. In this case, the browser is to display HTML content.\n\nOnce the\
    \ header has been written, all that remains is to write the remaining HTML back\
    \ to the browser. This must include the usual **<html>** and **<body>** tags,\
    \ and also includes a **<h1>** header tag and two **<p>** tags that will display\
    \ the value on the analog input A0 and the value returned by the **millis** function;\
    \ that value is the number of milliseconds since the Arduino was last reset.\n\
    \nFinally, **client.stop** tells the browser that the message is complete. The\
    \ browser then displays the page.\n\nIn a later section in this chapter, this\
    \ example will be repeated, but using WiFi and an ESP8266 board rather than Ethernet.\n\
    \n* * *\n\n### Web-Controlled Arduino\n\nThis second example of using an Ethernet\
    \ shield allows you to turn the Arduino pins D3 to D7 on and off using a Web form.\n\
    \nUnlike the simple server example, you are going to have to find a way to pass\
    \ the pin settings to the Arduino.\n\nThe method for doing this is called *posting\
    \ data* and is part of the HTTP standard. For this method to work, you have to\
    \ build the posting mechanism into the HTML so that the Arduino returns HTML to\
    \ the browser, which renders a form. This form (shown in [Figure 10-5](#19_Chapter_10.xhtml_fig-ch10-5))\
    \ has a selection of On and Off for each pin and an Update button that will send\
    \ the pin settings to the Arduino.\n\n![image](images/fig-ch10-5.jpg)\n\nFigure\
    \ 10.5 *A Web interface to Arduino pins*.\n\nWhen the Update button is pressed,\
    \ a second request is sent to the Arduino. This will be just like the first request,\
    \ except that the request will contain request parameters that will contain the\
    \ values of the pins."
