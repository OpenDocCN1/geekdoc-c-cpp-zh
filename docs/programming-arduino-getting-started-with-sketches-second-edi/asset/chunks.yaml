    Once uploaded, the board automatically starts running the sketch and you will
    see the yellow ‘L’ LED start to blink.


    If this did not work, then check your serial and board type settings.


    Now let’s modify the sketch to make the LED blink faster. To do this, let’s alter
    the two places in the sketch where there is a delay for 1,000 milliseconds so
    that the delay is 500 milliseconds. [Figure 2-7](#11_Chapter_02.xhtml_fig-ch2-7)
    shows the modified sketch with the changes circled.


    ![image](images/fig-ch2-7.jpg)


    Figure 2.7 *Modifying the Blink sketch*.


    Click on the Upload button again. Then, once the sketch has uploaded, you should
    see your LED start to blink twice as fast as it did before.


    Congratulations, you are now ready to start programming your Arduino. First, though,
    let’s take a mini-tour of the Arduino application.


    * * *


    ### The Arduino Application


    Sketches in Arduino are like documents in a word processor. You can open them
    and copy parts from one to another. So you see options to Open, Save, and Save
    As in the File menu. You will not normally use Open because the Arduino application
    has the concept of a Sketchbook where all your sketches are kept carefully organized
    into folders. You gain access to the Sketchbook from the File menu. As you have
    just installed the Arduino application for the first time, your Sketchbook will
    be empty until you create some sketches.


    As you have seen, the Arduino application comes with a selection of example sketches
    that can be very useful. Having modified the Blink example sketch, if you try
    and save it, you get a message that says, “Some files are marked read-only so
    you will need to save this sketch in a different location.”


    Try this now. Accept the default location, but change the filename to MyBlink,
    as shown in [Figure 2-8](#11_Chapter_02.xhtml_fig-ch2-8).


    ![image](images/fig-ch2-8.jpg)


    Figure 2.8 *Saving a copy of Blink*.


    Now if you go to the File menu and then click on Sketches, you will see MyBlink
    as one of the sketches listed. If you look at your computer’s file system, you
    will find that, on a PC, the sketch has been written into My Documents\Arduino,
    and on Mac or Linux, it is in Documents/Arduino.


    All of the sketches used in this book can be downloaded as a zip file (Programming_Arduino.zip)
    from [www.arduinobook.com](http://www.arduinobook.com). I suggest that now is
    the time to download this file and unzip it into the Arduino folder that contains
    the sketches. In other words, when you have unzipped the folder, there should
    be two folders in your Arduino folder: one for the newly saved MyBlink and one
    called Programming Arduino (see [Figure 2-9](#11_Chapter_02.xhtml_fig-ch2-9)).
    The Programming Arduino folder will contain all the sketches, numbered according
    to chapter, so that sketch 03-01, for example, is sketch 1 of [Chapter 3](#12_Chapter_03.xhtml).


    ![image](images/fig-ch2-9.jpg)


    Figure 2.9 *Installing the sketches from the book*.


    These sketches will not appear in your Sketchbook menu until you quit the Arduino
    application and restart it. Do so now. Then your Sketchbook menu should look similar
    to that shown in [Figure 2-10](#11_Chapter_02.xhtml_fig-ch2-10).


    ![image](images/fig-ch2-10.jpg)


    Figure 2.10 *Sketchbook with the book’s sketches installed*.


    * * *


    ### Conclusion


    Your environment is all set up and ready to go.


    In the next chapter, we will look at some of the basic principles of the C language
    that the Arduino uses and start writing some code.


    ## 3


    ## C Language Basics


    The programming language used to program Arduinos is a language called C. In this
    chapter, you get to understand the basics of the C language. You will use what
    you learn here in every sketch you develop as an Arduino programmer. To get the
    most out of Arduino, you need to understand these fundamentals.


    * * *


    ### Programming


    It is not uncommon for people to speak more than one language. In fact, the more
    you learn, the easier it seems to learn spoken languages as you start to find
    common patterns of grammar and vocabulary. The same is true of programming languages.
    So, if you have used any other programming language, you will quickly pick up
    C.


    The good news is that the vocabulary of a programming language is far smaller
    than that of a spoken language, and because you write it rather than say it, the
    dictionary can always be at hand whenever you need to look things up. Also, the
    grammar and syntax of a programming language are extremely regular, and once you
    come to grips with a few simple concepts, learning more quickly becomes second
    nature.


    It is best to think of a program—or a sketch, as programs are called in Arduino—as
    a list of instructions to be carried out in the order that they are written down.
    For example, suppose you were to write the following:


    ```

    digitalWrite(13, HIGH);

    delay(500);

    digitalWrite(13, LOW);

    ```


    These three lines would each do something. The first line would set the output
    of pin 13 to HIGH. This is the pin with an LED built in to the Arduino board,
    so at this point the LED would light. The second line would simply wait for 500
    milliseconds (half a second) and then the third line would turn the LED back off
    again. So these three lines would achieve the goal of making the LED blink once.


    You have already seen a bewildering array of punctuation used in strange ways
    and words that don’t have spaces between them. A frustration of many new programmers
    is, “I know what I want to do, I just don’t know what I need to write!” Fear not,
    all will be explained.


    First of all, let’s deal with the punctuation and the way the words are formed.
    These are both part of what is termed the syntax of the language. Most languages
    require you to be extremely precise about syntax, and one of the main rules is
    that names for things have to be a single word. That is, they cannot include spaces.
    So, **digitalWrite** is the name for something. It’s the name of a built-in function
    (you’ll learn more about functions later) that will do the job of setting an output
    pin on the Arduino board. Not only do you have to avoid spaces in names, but also
    names are case sensitive. So you must write **digitalWrite**, not **DigitalWrite**
    or **Digitalwrite.**


    The function **digitalWrite** needs to know which pin to set and whether to set
    that pin HIGH or LOW. These two pieces of information are called *arguments*,
    which are said to be *passed* to a function when it is *called*. The parameters
    for a function must be enclosed in parentheses and separated by commas.


    The convention is to place the opening parenthesis immediately after the last
    letter of the function’s name and to put a space after the comma before the next
    parameter. However, you can sprinkle space characters within the parentheses if
    you want.


    If the function only has one argument, then there is no need for a comma.


    Notice how each line ends with a semicolon. It would be more logical if they were
    periods, because the semicolon marks the end of one command, a bit like the end
    of a sentence.


    In the next section, you will find out a bit more about what happens when you
    press the Upload button on the Arduino integrated development environment (IDE).
    Then you will be able to start trying out a few examples.


    * * *


    ### What Is a Programming Language?'
