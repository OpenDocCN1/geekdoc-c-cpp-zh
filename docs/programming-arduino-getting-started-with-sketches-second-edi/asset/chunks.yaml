  trans: "\n请求参数在概念上类似于函数参数。函数参数允许你向函数传递信息（例如闪烁次数），而请求参数则允许你将数据传递给将处理 Web 请求的 Arduino。当\
    \ Arduino 接收到 Web 请求时，它可以从请求参数中提取引脚设置并更改实际引脚。\n\n第二个示例程序的代码如下：\n\n```cpp\n// sketch\
    \ 10-02 Internet Pins\n\n#include <SPI.h>\n#include <Ethernet.h>\n\n// MAC 地址只需要是唯一的。这应该可以工作。\n\
    byte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n\nEthernetServer server(80);\n\
    \nint numPins = 5;\nint pins[] = {3, 4, 5, 6, 7};\nint pinState[] = {0, 0, 0,\
    \ 0, 0};\nchar line1[100];\n\nvoid setup()\n{\n  for (int i = 0; i < numPins;\
    \ i++)\n  {\n     pinMode(pins[i], OUTPUT);\n  }\n  Serial.begin(9600);\n  Ethernet.begin(mac);\n\
    \  server.begin();\n  Serial.print(\"Server started on: \");\n  Serial.println(Ethernet.localIP());\n\
    }\n\nvoid loop()\n{\n  EthernetClient client = server.available();\n  if (client)\
    \ \n  {\n    while (client.connected()) \n    {\n      readHeader(client);\n \
    \     if (! pageNameIs(\"/\"))\n      {\n        client.stop();  \n        return;\n\
    \      }\n      client.println(\"HTTP/1.1 200 OK\");\n      client.println(\"\
    Content-Type: text/html\");\n      client.println();\n\n      // 发送正文\n      client.println(\"\
    <html><body>\");\n      client.println(\"<h1>Output Pins</h1>\");\n      client.println(\"\
    <form method='GET'>\");  \n      setValuesFromParams();\n      setPinStates();\n\
    \      for (int i = 0; i < numPins; i++)\n      {\n         writeHTMLforPin(client,\
    \ i);\n      }\n      client.println(\"<input type='submit' \n        value='Update'/>\"\
    );\n      client.println(\"</form>\");\n      client.println(\"</body></html>\"\
    );\n\n      client.stop();            \n    }\n  }\n}\n\nvoid writeHTMLforPin(EthernetClient\
    \ client, int i)\n{\n  client.print(\"<p>D\");\n  client.print(pins[i]);  \n \
    \ client.print(\" <select name='\");\n  client.print(i);\n  client.println(\"\
    '>\");\n  client.print(\"<option value='0'\");\n  if (pinState[i] == 0)\n  {\n\
    \    client.print(\" selected\");\n  }\n  client.println(\">Off</option>\");\n\
    \  client.print(\"<option value='1'\");\n  if (pinState[i] == 1)\n  {\n    client.print(\"\
    \ selected\");\n  }\n  client.println(\">On</option>\");\n  client.println(\"\
    </select></p>\");  \n}\n\nvoid setPinStates()\n{\n  for (int i = 0; i < numPins;\
    \ i++)\n  {\n     digitalWrite(pins[i], pinState[i]);\n  }\n}\n\nvoid setValuesFromParams()\n\
    {\n  for (int i = 0; i < numPins; i++)\n  {\n    pinState[i] = valueOfParam(i\
    \ + '0');\n  }\n}\n\nvoid readHeader(EthernetClient client)\n{\n  // 读取头信息的第一行\n\
    \  char ch;\n  int i = 0;\n  while (ch != '\\n')\n  {\n    if (client.available())\n\
    \    {\n      ch = client.read();\n      line1[i] = ch;\n      i ++;\n    }\n\
    \  }\n  line1[i] = '\\0'; \n  Serial.println(line1);\n}\n\nboolean pageNameIs(char*\
    \ name)\n{\n   // 页面名称从第 4 个字符开始\n   // 以空格结束\n   int i = 4;\n   char ch = line1[i];\n\
    \   while (ch != ' ' && ch != '\\n' && ch != '?')\n   {\n     if (name[i-4] !=\
    \ line1[i])\n     {\n       return false;\n     }\n     i++;\n     ch = line1[i];\n\
    \   }\n   return true;\n}\n\nint valueOfParam(char param)\n{\n  for (int i = 0;\
    \ i < strlen(line1); i++)\n  {\n    if (line1[i] == param && line1[i+1] == '=')\n\
    \    {\n      return (line1[i+2] - '0');\n    }\n  }\n  return 0;\n}\n```\n\n\
    该程序使用了两个数组来控制引脚。第一个数组 `pins` 仅指定要使用哪些引脚。`pinState` 数组存储每个引脚的状态：0 或 1。\n\n为了获取从浏览器表单传来的关于哪些引脚应该开启、哪些引脚应该关闭的信息，必须读取来自浏览器的头信息。事实上，你需要的一切都包含在。\n"
- fmt: "\nFirst, open the Arduino IDE Preferences window from the File menu and add\
    \ the address `http://arduino.esp8266.com/stable/package_esp8266com_index.json`\
    \ to the Additional Board Manager URLs field ([Figure 10-7](#19_Chapter_10.xhtml_fig-ch10-7)).\n\
    \n![image](images/fig-ch10-7.jpg)\n\nFigure 10.7 *Adding a Board Manager URL for\
    \ ESP8288 boards*.\n\nOpen the Arduino IDE’s Boards Manager window, which you\
    \ will find under the `Tools` → `Boards` menu option. Scroll down to the bottom\
    \ of the list and click on the `Install` button next to the `esp8266 by ESP8266\
    \ Community` item.\n\nClose the Boards Manager and now, when you look at the list\
    \ of possible boards, you will find some new board options for ESP8266-related\
    \ boards, in particular `Node MCU0.9` and `NodeMCU 1.0`. When you buy your ESP8266\
    \ board you will need to check which of these two types it is.\n\nBefore you can\
    \ start programming your Node MCU board, you will need to install drivers for\
    \ the USB-to-serial chip. This is not the same chip as is used for an Arduino\
    \ Uno’s USB-to-serial interface, so you will need to download and install the\
    \ drivers for your platform from `https://github.com/nodemcu/nodemcu-devkit/tree/master/Drivers`\
    \ and then run the installer.\n\nSelect the board type and port as you would any\
    \ other Arduino and you should now be able to program the ESP8266. There are,\
    \ however, a few differences that you should be aware of:\n\n- ♦ Sometimes (not\
    \ always) you will need to hold down the `Flash` button on the board before you\
    \ power it up, and only release the button a few seconds after the board has been\
    \ powered up. Do this if your sketch fails to upload.\n- ♦ The named pins `D0`\
    \ to `D8` on the board must always be used with the `D` in front of them, for\
    \ example, `pinMode(D0, OUTPUT)`. This `D` is optional for the official Arduino\
    \ boards.\n- ♦ The Mode MCU has a built-in LED like the Arduino Uno’s `L` LED,\
    \ but it is on pin `D0` rather than pin `13`, so you will need to modify your\
    \ blink sketch to use pin `D0`.\n- ♦ When using an official Arduino board, it\
    \ does not matter in which order you define your functions. When using a Node\
    \ MCU board, you must define functions before the first place where they are called.\n\
    \nThe node MCU library is a little different from the standard Arduino Ethernet\
    \ library. Sketch 10-03 replicates the simple Web server shown in [Figure 10-4](#19_Chapter_10.xhtml_fig-ch10-4)\
    \ but using a Node MCU and WiFi rather than an Arduino and Ethernet.\n\n```cpp\n\
    // sketch 10-03. Node MCU Basic Web Server\n\n#include <ESP8266WiFi.h>\n#include\
    \ <WiFiClient.h>\n#include <ESP8266WebServer.h>\n#include <ESP8266mDNS.h>\n\n\
    const char* ssid = \"my-network-name\";\nconst char* password = \"my_password\"\
    ;\n\nESP8266WebServer server(80);\n\nvoid handleRoot()\n{\n  String message =\
    \ \"<html><body>\\n\";\n  message += \"<h1>Arduino Server</h1>\\n\";\n  message\
    \ += \"<p>A0=\"; \n  message += analogRead(A0); \n  message += \"</p>\"; \n  message\
    \ += \"<p>millis=\"; \n  message += millis(); \n  message += \"</p>\"; \n  message\
    \ += \"</html></body>\\n\";\n  server.send(200, \"text/html\", message);\n}\n\n\
    void connectToWiFi()\n{\n  Serial.print(\"\\n\\nConnecting to \");\n  Serial.println(ssid);\n\
    \  WiFi.begin(ssid, password);\n  while (WiFi.status() != WL_CONNECTED) {\n  \
    \  delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println(\"\\nWiFi connected\"\
    );  \n  Serial.print(\"IP address: \");\n  Serial.println(WiFi.localIP());\n}\n\
    \nvoid setup()\n{\n  Serial.begin(115200);\n  connectToWiFi();\n\n  server.on(\"\
    /\", handleRoot);\n\n  server.begin();\n  Serial.println(\"HTTP server started\"\
    );\n}\n\nvoid loop()\n{\n  server.handleClient();\n}\n```\n\nThe code for the\
    \ Node MCU is actually structured quite differently from the code for an Arduino\
    \ and Ethernet shield that you saw in sketch 10-01. In this sketch, in place of\
    \ the MAC address there are constants for the `ssid` (wireless network name) and\
    \ `password`. Instead of creating a server variable of type `Ethernet`, one of\
    \ type `ESP8266WebServer` is created.\n\nThe `handleRoot` function demonstrates\
    \ a nice feature of the ESP8266 library. That is, the ability to define handlers\
    \ for different pages that the server is serving. So if you jump down to the `setup`\
    \ function, you will see the command `server.on(\"/\", handleRoot)`. This tells\
    \ the server that whenever there is a request for the root page (`/`) the function\
    \ `handleRoot` is executed.\n"
  raw: "First, open the Arduino IDE Preferences window from the File menu and add\
    \ the address [http://arduino.esp8266.com/stable/package_esp8266com_index.json](http://arduino.esp8266.com/stable/package_esp8266com_index.json)\
    \ to the Additional Board Manager URLs field ([Figure 10-7](#19_Chapter_10.xhtml_fig-ch10-7)).\n\
    \n![image](images/fig-ch10-7.jpg)\n\nFigure 10.7 *Adding a Board Manager URL for\
    \ ESP8288 boards*.\n\nOpen the Arduino IDE’s Boards Manager window, which you\
    \ will find under the Tools → Boards menu option. Scroll down to the bottom of\
    \ the list and click on the Install button next to the “esp8266 by ESP8266 Community”\
    \ item.\n\nClose the Boards Manager and now, when you look at the list of possible\
    \ boards, you will find some new board options for ESP8266-related boards, in\
    \ particular “Node MCU0.9” and “NodeMCU 1.0”. When you buy your ESP8266 board\
    \ you will need to check which of these two types it is.\n\nBefore you can start\
    \ programming your Node MCU board, you will need to install drivers for the USB-to-serial\
    \ chip. This is not the same chip as is used for an Arduino Uno’s USB-to-serial\
    \ interface, so you will need to download and install the drivers for your platform\
    \ from [https://github.com/nodemcu/nodemcu-devkit/tree/master/Drivers](https://github.com/nodemcu/nodemcu-devkit/tree/master/Drivers)\
    \ and then run the installer.\n\nSelect the board type and port as you would any\
    \ other Arduino and you should now be able to program the ESP8266\\. There are,\
    \ however, a few differences that you should be aware of:\n\n♦ Sometimes (not\
    \ always) you will need to hold down the Flash button on the board before you\
    \ power it up, and only release the button a few seconds after the board has been\
    \ powered up. Do this if your sketch fails to upload.\n\n♦ The named pins D0 to\
    \ D8 on the board must always be used with the D in front of them, for example,\
    \ pinMode(D0, OUTPUT). This “D” is optional for the official Arduino boards.\n\
    \n♦ The Mode MCU has a built-in LED like the Arduino Uno’s L LED, but it is on\
    \ pin D0 rather than pin 13, so you will need to modify your blink sketch to use\
    \ pin D0.\n\n♦ When using an official Arduino board, it does not matter in which\
    \ order you define your functions. When using a Node MCU board, you must define\
    \ functions before the first place where they are called.\n\nThe node MCU library\
    \ is a little different from the standard Arduino Ethernet library. Sketch 10-03\
    \ replicates the simple Web server shown in [Figure 10-4](#19_Chapter_10.xhtml_fig-ch10-4)\
    \ but using a Node MCU and WiFi rather than an Arduino and Ethernet.\n\n```\n\
    // sketch 10-03\\. Node MCU Basic Web Server\n\n#include <ESP8266WiFi.h>\n#include\
    \ <WiFiClient.h>\n#include <ESP8266WebServer.h>\n#include <ESP8266mDNS.h>\n\n\
    const char* ssid = \"my-network-name\";\nconst char* password = \"my_password\"\
    ;\n\nESP8266WebServer server(80);\n\nvoid handleRoot()\n{\n  String message =\
    \ \"<html><body>\\n\";\n  message += \"<h1>Arduino Server</h1>\\n\";\n  message\
    \ += \"<p>A0=\"; \n  message += analogRead(A0); \n  message += \"</p>\"; \n  message\
    \ += \"<p>millis=\"; \n  message += millis(); \n  message += \"</p>\"; \n  message\
    \ += \"</html></body>\\n\";\n  server.send(200, \"text/html\", message);\n}\n\n\
    void connectToWiFi()\n{\n  Serial.print(\"\\n\\nConnecting to \");\n  Serial.println(ssid);\n\
    \  WiFi.begin(ssid, password);\n  while (WiFi.status() != WL_CONNECTED) {\n  \
    \  delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println(\"\\nWiFi connected\"\
    );  \n  Serial.print(\"IP address: \");\n  Serial.println(WiFi.localIP());\n}\n\
    \nvoid setup()\n{\n  Serial.begin(115200);\n  connectToWiFi();\n\n  server.on(\"\
    /\", handleRoot);\n\n  server.begin();\n  Serial.println(\"HTTP server started\"\
    );\n}\n\nvoid loop()\n{\n  server.handleClient();\n}\n```\n\nThe code for the\
    \ Node MCU is actually structured quite differently from the code for an Arduino\
    \ and Ethernet shield that you saw in sketch 10-01\\. In this sketch, in place\
    \ of the MAC address there are constants for the **ssid** (wireless network name)\
    \ and **password**. Instead of creating a server variable of type **Ethernet**,\
    \ one of type **ESP8266WebServer** is created.\n\nThe **handleRoot** function\
    \ demonstrates a nice feature of the ESP8266 library. That is, the ability to\
    \ define handlers for different pages that the server is serving. So if you jump\
    \ down to the setup function, you will see the command **server.on(“/”, handleRoot)**.\
    \ This tells the server that whenever there is a request for the root page (/)\
    \ the function **handleRoot** should be called to generate the necessary HTML\
    \ for that page and send it back to the browser.\n\nThis function uses the Arduino\
    \ **String** class to construct the HTML a line at a time. Note that the **String**\
    \ class can be quite memory hungry, so if you start to get unexpected errors in\
    \ your code, then it may be that the **String** class is to blame. For small string\
    \ construction like this example, it is fine, but for longer strings it can be\
    \ better to use a character buffer as shown later in sketch 10-04.\n\nThe process\
    \ of creating the WiFi connection, along with code to display the IP address of\
    \ the server in the Serial Monitor is all contained in the **connectToWiFi** function.\
    \ Note that the baud rate for this sketch is set to 115200 so you will need to\
    \ set the rate to the same on the drop-down list in the right-hand bottom corner\
    \ of the Serial Monitor to be able to see the messages.\n\nThe **setup** function\
    \ just calls **connectToWiFi**, links up the root handler and starts the server\
    \ running. The loop function just calls **handleClient** on the server, which\
    \ waits for incoming requests and then services them.\n\n* * *\n\n### Web-Controlled\
    \ Node MCU\n\nThe Web-controlled Arduino of sketch 10-02 can be adapted to work\
    \ using a Node MCU. The resulting sketch is sketch 10-04\\. To test the sketch,\
    \ you will need to attach LEDs to the pins used, or measure their voltage using\
    \ a multimeter.\n\n```\n// sketch 10-04 Web Controlled Node MCU\n\n#include <ESP8266WiFi.h>\n\
    #include <WiFiClient.h>\n#include <ESP8266WebServer.h>\n#include <ESP8266mDNS.h>\n\
    \nconst char* ssid = \"my-network-name\";\nconst char* password = \"my_password\"\
    ;\n\nint numPins = 5;\nchar* pinNames[] = {\"D5\", \"D6\", \"D7\", \"D8\", \"\
    D9\"};\nint pins[] = {D5, D6, D7, D8, D9};\nint pinState[] = {0, 0, 0, 0, 0};\n\
    \nESP8266WebServer server(80);\n\nvoid setPinStates()\n{\n  for (int i = 0; i\
    \ < numPins; i++)\n  {\n     digitalWrite(pins[i], pinState[i]);\n  }\n}\n\nvoid\
    \ setValuesFromParams()\n{\n  for (int i = 0; i < numPins; i++)\n  {\n    pinState[i]\
    \ = server.arg(i).toInt();\n  }\n}\n\nvoid connectToWiFi()\n{\n  Serial.print(\"\
    \\n\\nConnecting to \");\n  Serial.println(ssid);\n  WiFi.begin(ssid, password);\n\
    \  while (WiFi.status() != WL_CONNECTED) {\n    delay(500);\n    Serial.print(\"\
    .\");\n  }\n  Serial.println(\"\\nWiFi connected\");  \n  Serial.print(\"IP address:\
    \ \");\n  Serial.println(WiFi.localIP());\n}\n\nvoid handleRoot()\n{\n  char buff[1000];\n\
    \  Serial.println(\"Got a Request\");\n  setValuesFromParams();\n  setPinStates();\n\
    \n  strcat(buff, \"<html><body>\\n\");\n  strcat(buff, \"<h1>Output Pins</h1>\\\
    n\");\n  strcat(buff, \"<form method='GET'>\\n\"); \n  for (int i = 0; i < numPins;\
    \ i++)\n  {\n    strcat(buff, \"<p>\");\n    strcat(buff, pinNames[i]);\n    strcat(buff,\
    \ \" <select name='\");\n    char indexStr[10];\n    sprintf(indexStr, \"%d\"\
    , i);\n    strcat(buff, indexStr);\n    strcat(buff, \"'><option value='0'\");\n\
    \    if (pinState[i] == 0)\n    {\n      strcat(buff, \" selected\");\n    }\n\
    \    strcat(buff, \">Off</option>\");\n    strcat(buff, \"<option value='1'\"\
    );\n    if (pinState[i] == 1)\n    {\n      strcat(buff, \" selected\");\n   \
    \ }\n    strcat(buff, \">On</option></select></p>\\n\");\n  }\n  strcat(buff,\
    \ \"<input type='submit' value='Update'/>\");\n  strcat(buff, \"</form></html></body>\\\
    n\");\n  server.send(200, \"text/html\", buff);\n}\n\nvoid setup()\n{\n  for (int\
    \ i = 0; i < numPins; i++)\n  {\n     pinMode(pins[i], OUTPUT);\n  }\n  Serial.begin(115200);\n\
    \  connectToWiFi();\n  server.on(\"/\", handleRoot);\n\n  server.begin();\n  Serial.println(\"\
    HTTP server started\");\n}\n\nvoid loop()\n{\n  server.handleClient();\n}\n```"
