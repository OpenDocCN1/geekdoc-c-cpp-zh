- fmt: '

    Next let us look at the connectors at the bottom of [Figure 1-1](#10_Chapter_01.xhtml_fig-ch1-1).
    You can read the connection names next to the connectors. The connector of interest
    is `Reset`. This does the same thing as the `Reset` button on the Arduino. Rather
    like rebooting a PC, using the `Reset` connector resets the microcontroller so
    that it begins its program from the start. To reset the microcontroller with the
    `Reset` connector, you momentarily set this pin low (connecting it to `0V`).


    The rest of the pins in this section just provide different voltages (`3.3V`,
    `5V`, `GND`, and `Vin`), as they are labeled. `GND`, or ground, just means zero
    volts. It is the reference voltage to which all other voltages on the board are
    relative.


    ### Analog Inputs


    The six pins labeled as `Analog In A0` to `A5` can be used to measure the voltage
    connected to them so that the value can be used in a sketch (Arduino Program).
    Note that they measure a voltage and not a current. Only a tiny current will ever
    flow into them and down to ground because they have a very large internal resistance.
    That is, the pin having a large internal resistance only allows a tiny current
    to flow into the pin.


    Although these inputs are labeled as analog, and are analog inputs by default,
    these connections can also be used as digital inputs or outputs.


    ### Digital Connections


    We now switch to the top connector and start on the right-hand side in [Figure
    1-1](#10_Chapter_01.xhtml_fig-ch1-1). Here we find pins labeled `Digital 0` to
    `13`. These can be used as either inputs or outputs. When used as outputs, they
    behave rather like the power supply voltages discussed earlier in this section,
    except that these are all `5V` and can be turned on or off from your sketch. So,
    if you turn them on from your sketch they will be at `5V`, and if you turn them
    off they will be at `0V`. As with the power supply connectors, you must be careful
    not to exceed their maximum current capabilities. The first two of these connections
    (`0` and `1`) are also labeled `RX` and `TX`, for receive and transmit. These
    connections are reserved for use in communication and are indirectly the receive
    and transmit connections for your USB link to your computer.


    These digital connections can supply `40 mA` (milliamps) at `5V`. That is more
    than enough to light a standard LED, but not enough to drive an electric motor
    directly.


    ### Microcontroller


    Continuing our tour of the Arduino board, the microcontroller chip itself is the
    black rectangular device with 28 pins. This is fitted into a dual in-line (DIL)
    socket so that it can be easily replaced. The 28-pin microcontroller chip used
    on the Arduino Uno board is the `ATmega328`. [Figure 1-2](#10_Chapter_01.xhtml_fig-ch1-2)
    presents a block diagram showing the main features of this device.


    ![image](images/fig-ch1-2.jpg)


    Figure 1.2 *ATmega328 block diagram*.


    The heart—or, perhaps more appropriately, the brain—of the device is the central
    processing unit (CPU). It controls everything that goes on within the device.
    It fetches program instructions stored in the flash memory and executes them.
    This might involve fetching data from working memory (`RAM), changing it, and
    then putting it back. Or, it may mean changing one of the digital outputs from
    `0V` to `5V`.


    The `EEPROM` memory is a little like the flash memory in that it is non-volatile.
    That is, you can turn the device off and on and it will not have forgotten what
    is in the `EEPROM`. Whereas the flash memory is intended for storing program instructions
    (from sketches), the `EEPROM` is used to store data that you do not want to lose
    in the event of a reset or the power being turned off.


    ### Other Components


    Above the microcontroller is a small, silver, rectangular component. This is a
    quartz crystal oscillator. It ticks 16 million times a second, and on each of
    those ticks, the microcontroller can perform one operation—addition, subtraction,
    or another mathematical operation.


    In the top-left corner is the `Reset` switch. Clicking on this switch sends a
    logic pulse to the `Reset` pin of the microcontroller, causing the microcontroller
    to start its program afresh and clear its memory. Note that any program stored
    on the device will be retained, because this is kept in non-volatile flash memory—that
    is, memory that remembers even when the device is not powered.


    On the right-hand edge of the board is the `Serial Programming Connector`. It
    offers another means of programming the Arduino without using the USB port. Because
    we do have a USB connection and software that makes it convenient to use, we will
    not avail ourselves of this feature.


    In the top-left corner of the board next to the USB socket is the USB interface
    chip. This chip converts the signal levels used by the USB standard to levels
    that can be used directly by the Arduino board.


    ***


    ### The Origins of Arduino


    Arduino was originally developed as an aid for teaching students. It was subsequently
    (in 2005) developed commercially by Massimo Banzi and David Cuartielles. It has
    since gone on to become enormously successful with makers, students, and artists
    for its ease of use and durability.


    Another key factor in its success is that all the designs for Arduino are freely
    available under a Creative Commons license. This has allowed many lower-cost alternatives
    to the boards to appear. Only the name Arduino is protected, so such clones often
    have “duino” names, such as `Boarduino`, `Seeeduino`, and `Freeduino`. In 2014
    there was a falling out between the original Arduino team and their principal
    manufacturer. One result of this split is that outside the USA, the Arduino Uno
    is known as `Genuino`.


    ### The Arduino Family


    It is useful to have a little background on the various Arduino boards. We will
    be using the Arduino Uno as our standard device—more specifically, the Arduino
    Uno R3 (Revision 3). Indeed, this is by far the most used of the Arduino boards,
    but the boards are all programmed using the same language and largely have the
    same connections to the outside world, so you can easily use a different board.


    #### Uno and Leonardo


    The Arduino Uno is just one incarnation of a long series of Arduino boards. The
    series includes the `Diecimila` (Italian for 10,000) and the `Duemilanove` (Italian
    for 2009). [Figure 1-4](#10_Chapter_01.xhtml_fig-ch1-4) shows an Arduino Leonardo.
    By now you may have guessed that Arduino is an Italian invention.


    The Arduino Leonardo ([Figure 1-4](#10_Chapter_01.xhtml_fig-ch1-4)) is another
    popular choice of Arduino board and can be used in place of the Arduino Uno in
    most situations. It is slightly cheaper than the Uno and has the same connections
    as the Uno. Its processor chip is soldered onto the board and so cannot be removed
    (as you can an Uno’s processor.). Its lower cost is in part due to the use of
    a processor that includes its own USB interface rather than having to use a separate
    chip like the Uno.


    #### Mega and Due

