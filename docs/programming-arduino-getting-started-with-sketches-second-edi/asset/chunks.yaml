    \nLet’s examine this boilerplate code that will form the starting point for every\
    \ sketch that you ever write. There are some new things here. For example, there\
    \ is the word **void** and some curly braces. Let’s deal with **void** first.\n\
    \nThe line **void setup()** means that you are defining a function called **setup**.\
    \ In Arduino, some functions are already defined for you, such as **digitalWrite**\
    \ and **delay**, whereas you must or can define others for yourself. **setup**\
    \ and **loop** are two functions that you must define for yourself in every sketch\
    \ that you write.\n\nThe important thing to understand is that here you are not\
    \ calling **setup** or **loop** like you would call **digitalWrite**, but you\
    \ are actually creating these functions so that the Arduino system itself can\
    \ call them. This is a difficult concept to grasp, but one way to think of it\
    \ is as being similar to a definition in a legal document.\n\nMost legal documents\
    \ have a “definitions” section that might say, for example, something like the\
    \ following:\n\n```\nDefinitions.\nThe Author: The person or persons responsible\
    \ for creating the book\n```\n\nBy defining a term in this way—for example, simply\
    \ using the word “author” as shorthand for “The person or persons responsible\
    \ for creating the book”—lawyers can make their documents shorter and more readable.\
    \ Functions work much like such definitions. You define a function that you or\
    \ the system itself can then use elsewhere in your sketches.\n\nGoing back to\
    \ **void**, these two functions (**setup** and **loop**) do not return a value\
    \ as some functions do, so you have to say that they are void, using the **void**\
    \ keyword. If you imagine a function called **sin** that performed the trigonometric\
    \ function of that name, then this function would return a value. The value returned\
    \ to use from the call would be the sine of the angle passed as its argument.\n\
    \nRather like a legal definition uses words to define a term, we write functions\
    \ in C that can then be called from C.\n\nAfter the special keyword **void** comes\
    \ the name of the function and then parentheses to contain any arguments. In this\
    \ case, there are no arguments, but we still have to include the parentheses there.\
    \ There is no semicolon after the closing parenthesis because we are defining\
    \ a function rather than calling it, so we need to say what will happen when something\
    \ does call the function.\n\nThose things that are to happen when the function\
    \ is called must be placed between curly braces. Curly braces and the code in\
    \ between them are known as a *block* of code, and this is a concept that you\
    \ will meet again later.\n\nNote that although you do have to define both the\
    \ functions **setup** and **loop**, you do not actually have to put any lines\
    \ of code in them. However, failing to add code will make your sketch a little\
    \ dull.\n\n* * *\n\n### Blink—Again!\n\nThe reason that Arduino has the two functions\
    \ **setup** and **loop** is to separate the things that only need to be done once,\
    \ when the Arduino starts running its sketch, from the things that have to keep\
    \ happening continuously.\n\nThe function **setup** will just be run once when\
    \ the sketch starts. Let’s add some code to it that will blink the LED built onto\
    \ the board. Add the lines to your sketch so that it appears as follows and then\
    \ upload them to your board:\n\n```\nvoid setup()\n{\n  pinMode(13, OUTPUT);\n\
    \  digitalWrite(13, HIGH);\n}\n\nvoid loop()\n{\n}\n```\n\nThe **setup** function\
    \ itself calls two built-in functions, **pinMode** and **digitalWrite**. You already\
    \ know about **digitalWrite**, but **pinMode** is new. The function **pinMode**\
    \ sets a particular pin to be either an input or an output. So, turning the LED\
    \ on is actually a two-stage process. First, you have to set pin 13 to be an output,\
    \ and second, you need to set that output to be high (5V).\n\nWhen you run this\
    \ sketch, on your board you will see that the L LED comes on and stays on. This\
    \ is not very exciting, so let’s at least try to make it flash by turning it on\
    \ and off in the **loop** function rather than in the **setup** function.\n\n\
    You can leave the **pinMode** call in the **setup** function because you only\
    \ need to call it once. The project would still work if you moved it into the\
    \ loop, but there is no need and it is a good programming habit to do things only\
    \ once if you only need to do them once. So modify your sketch so that it looks\
    \ like this:\n\n```\nvoid setup()\n{\n  pinMode(13, OUTPUT);\n}\n\nvoid loop()\n\
    {\n digitalWrite(13, HIGH);\n delay(500);\n digitalWrite(13, LOW);\n}\n```\n\n\
    Run this sketch and see what happens. It may not be quite what you were expecting.\
    \ The LED is basically on all the time. Hmm, why should this be?\n\nTry stepping\
    \ through the sketch a line at a time in your head:"
