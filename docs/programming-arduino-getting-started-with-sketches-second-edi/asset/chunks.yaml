    \ | 4 | Same as **float** | Normally, this would be 8 bytes and higher precision\
    \ than **float** with a greater range. However, on Arduino, it is the same as\
    \ **float**. |\n\nTable 4-1 *Data Types in C*\n\nOne thing to consider is that\
    \ if data types exceed their range, then strange things happen. So, if you have\
