    \ i++)\n  {\n     digitalWrite(pins[i], pinState[i]);\n  }\n}\n\nvoid setValuesFromParams()\n\
    {\n  for (int i = 0; i < numPins; i++)\n  {\n    pinState[i] = valueOfParam(i\
    \ + '0');\n  }\n}\n\nvoid readHeader(EthernetClient client)\n{\n  // read first\
    \ line of header\n  char ch;\n  int i = 0;\n  while (ch != '\\n')\n  {\n    if\
    \ (client.available())\n    {\n      ch = client.read();\n      line1[i] = ch;\n\
    \      i ++;\n    }\n  }\n  line1[i] = '\\0'; \n  Serial.println(line1);\n}\n\n\
    boolean pageNameIs(char* name)\n{\n   // page name starts at char pos 4\n   //\
    \ ends with space\n   int i = 4;\n   char ch = line1[i];\n   while (ch != ' '\
    \ && ch != '\\n' && ch != '?')\n   {\n     if (name[i-4] != line1[i])\n     {\n\
    \       return false;\n     }\n     i++;\n     ch = line1[i];\n   }\n   return\
    \ true;\n}\n\nint valueOfParam(char param)\n{\n  for (int i = 0; i < strlen(line1);\
    \ i++)\n  {\n    if (line1[i] == param && line1[i+1] == '=')\n    {\n      return\
    \ (line1[i+2] - '0');\n    }\n  }\n  return 0;\n}\n```\n\nThe sketch uses two\
    \ arrays to control the pins. The first, **pins**, just specifies which pins are\
    \ to be used. The **pinState** array holds the state of each pin: either 0 or\
    \ 1.\n\nTo get the information coming from the browser form about which pins should\
    \ be on and which should be off, it is necessary to read the header coming from\
    \ the browser. In fact, all you need is contained in the first line of the header.\
    \ You will use a character array **line1** to contain the first line of the header.\n\
    \nWhen the user clicks on the Update button and submits the form from the browser,\
    \ the URL for the page will look something like this:\n\n```\nhttp://192.168.1.17/?0=1&1=1&2=0&3=0&4=0\n\
    ```\n\nThe request parameters come after the **?** and are each separated by an\
    \ **&**. Looking at the first parameter (**0=1**), this means that the first pin\
    \ in the array (**pins[0]**) should have the value 1\\. If you were to look at\
    \ the first line of the header, you would see those same request parameters there:\n\
    \n```\nGET /?0=1&1=1&2=0&3=0&4=0 HTTP/1.1\n```\n\nBefore the parameters, there\
    \ is the text **GET /.** This specifies the page requested by the browser. In\
    \ this case, **/** indicates the root page.\n\nIn the loop of the sketch, you\
    \ call the **readHeader** function to read the first line of the header. You then\
    \ use the **pageNameIs** function to check that the page request is for the root\
    \ page **/**.\n\nThe sketch then generates the header and the start of the HTML\
    \ form that is to be displayed. Before writing the HTML for each of the pins,\
    \ the sketch calls the **setValuesFromParams** function to read each of the request\
    \ parameters and set the appropriate values in the **pinStates** array. This array\
    \ is then used to set the values of the pin outputs before the **writeHTMLforPin**\
    \ function is called for each of the pins. This function generates a selection\
    \ list for each pin. It has to build this list part by part. The **if** statements\
    \ ensure that the appropriate options are selected.\n\nThe functions **readHeader,\
    \ pageNameIs**, and **valueOfParam** are useful general-purpose functions that\
    \ you can make use of in your own sketches.\n\nYou can use your multimeter as\
    \ you did in [Chapter 6](#15_Chapter_06.xhtml) to verify that the pins are indeed\
    \ turning on and off. If you are feeling more adventurous, you could attach LEDs\
    \ or relays to the pins to control things.\n\n* * *\n\n### Node MCU Web Server\n\
    \nThe ESP8266 is a WiFi System on a Chip. That is, it’s a single chip that pretty\
    \ much does everything that an Arduino Uno equipped with a WiFi shield could do.\
    \ It includes a few GPIO pins and an analog input and can be programmed from the\
    \ Arduino IDE as if it were an official Arduino board.\n\nThe two most common\
    \ boards that use the ESP8266 are shown in [Figure 10-6](#19_Chapter_10.xhtml_fig-ch10-6).\n\
    \n![image](images/fig-ch10-6.jpg)\n\nFigure 10.6 *ESP01 (left) and Node MCU (right)\
    \ ESP8266 boards*.\n\nThe ESP01 board is extremely minimal and only has two GPIO\
    \ pins and requires a separate USB to serial programmer in order to program it.\
    \ However, the Node MCU board on the right of [Figure 10-6](#19_Chapter_10.xhtml_fig-ch10-6)\
    \ includes an Arduino Uno-style USB-to–serial interface chip to program the board\
    \ as well as a decent selection of GPIO pins. The Node MCU board is the better\
    \ board to get started with.\n\nThe ESP8266 has around 36kB of memory available\
    \ for us in sketches (far more than the Arduino Uno’s 2kB). The ESP8266 does not\
    \ have any built-in flash memory, but rather the board it is on, such as the Node\
    \ MCU, has a separate flash memory chip that, in the case of the Node MCU, provides\
    \ 4MB of program storage.\n\nNone of the ESP8266 boards are official Arduino boards;\
    \ in fact, the Node MCU board actually comes with its own firmware that uses the\
    \ Lua programming language rather than Arduino C. However, thanks to the efforts\
    \ of Sandeep Mistry, this firmware can be replaced and the board programmed almost\
    \ like any other Arduino board. All ESP8266 boards can also be wired up to the\
    \ serial port of an Arduino and just used to provide a WiFi interface to a regular\
    \ Arduino. But, given that the boards are capable of filling in for an Arduino,\
    \ it makes sense to make full use of their capabilities.\n\nThe first step in\
    \ using a Node MCU is to update your Arduino IDE so that it is aware of this new\
    \ type of board. You must be using Arduino 1.6 or later for the following instructions\
    \ to work."
