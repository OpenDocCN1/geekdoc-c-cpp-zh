  trans: "\n\n```cpp\n// sketch 3-09\nint ledPin = 13;\nint delayPeriod = 100;\nint\
    \ count = 0;\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n\
    {\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  count ++;\n  if (count == 20)\n  {\n   count\
    \ = 0;\n   delay(3000);\n  }\n}\n```\n\n你可能已经注意到了这一行：\n\n```cpp\ncount ++;\n```\n\
    \n这只是 C 语言的简写，等于：\n\n```cpp\ncount = count + 1;\n```\n\n所以现在每次运行 `loop` 时，它花费的时间只比\
    \ 200 毫秒多一点，除非是循环的第 20 次，情况下它花费的时间将相同的时间加上每组 20 次闪烁之间的三秒延迟。事实上，对于某些应用来说，即使这样也太慢了，纯主义者会说你根本不应该使用\
    \ `delay`。最佳解决方案取决于具体的应用。\n\n### while\n\n在 C 语言中循环的另一种方法是使用 `while` 命令代替 `for`\
    \ 命令。你可以如下所示使用 `while` 命令来实现与前面的 `for` 示例相同：\n\n```cpp\nint i = 0;\nwhile (i <\
    \ 20)\n{\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n  digitalWrite(ledPin,\
    \ LOW);\n  delay(delayPeriod);\n  i ++;\n}\n```\n\n`while` 之后括号中的表达式必须为真才能留在 `loop`\
    \ 中。当它不再为真时，草图将继续运行最后一个大括号之后的命令。\n\n### 常量 (Constants)\n\n对于在草图运行期间不会改变的常量值（例如引脚分配），请使用\
    \ `const` 关键字，它告诉编译器该变量具有常量值且不会发生变化。\n\n例如，你可以这样定义 LED 的引脚分配：\n\n```cpp\nconst\
    \ int ledPin = 13;\n```\n\n你编写的任何草图在这些变量前面不加 `const` 关键字也能正常工作，但它会让程序体积略小，随着你的草图变大，这种优势会变得显著。无论如何，对于值不会改变的变量，养成这种习惯是好的。\n\
    \n### 总结 (Conclusion)\n\n本章带你入门了 C 语言。你可以让 LED 以各种有趣的方式闪烁，并使用 `Serial.println`\
    \ 函数让 Arduino 通过 USB 将结果传回给你。你还学习了如何使用 `if` 和 `for` 命令来控制命令执行的顺序，并了解了如何让 Arduino\
    \ 进行一些算术运算。\n\n在下一章中，你将更深入地查看函数。该章还将介绍在本章中使用的 `int` 类型以外的其他变量类型。\n\n# 4. 函数 (Functions)\n\
    \n本章主要关注你可以自己编写的函数类型，而不是像 `digitalWrite` 和 `delay` 这样已经为你定义好的内置函数。\n\n你之所以需要能够编写自己的函数，是因为随着草图开始变得有点复杂，你\
    \ yn 的 `setup` 和 `loop` 函数会不断增长，直到变得很长且复杂，导致很难看出它们是如何工作的。\n\n任何类型的软件开发中最大的问题都是管理复杂性。最好的程序员编写的软件易于观察和理解，并且几乎不需要任何解释。\n\
    \n函数是创建易于理解的草图的关键工具，这些草图可以被修改，而不会导致整个程序陷入混乱。\n\n### 什么是函数？(What Is a Function?)\n\
    \n函数就像程序中的小程序程序。你可以使用它来封装你想执行的一些微小操作。你定义的函数可以在草图的任何地方被调用，并包含它自己的变量和命令列表。命令执行完毕后，执行将返回到调用该函数的代码中紧随其的位置。\n\
    \n举个例子，闪烁发光二极管（LED）的代码是应该放在函数中的代码典型示例。所以，让我们修改基础的“闪烁 20 次”草图，使用我们创建的名为 `flash`\
    \ 的函数：\n\n```cpp\n// sketch 4-01\nconst int ledPin = 13;\nconst int delayPeriod\
    \ = 250;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n\
    \  for (int i = 0; i < 20; i ++)\n  {\n    flash();\n  }\n  delay(3000);\n}\n\n\
    void flash()\n{\n   digitalWrite(ledPin, HIGH);\n   delay(delayPeriod);\n   digitalWrite(ledPin,\
    \ LOW);\n   delay(delayPeriod);\n}\n```\n\n所以，我们在这里所做的是将闪烁 LED 的四行代码从 `for` 循环的中间移动到它们自己的名为\
    \ `flash` 的函数中。现在你只需要通过编写 `flash()` 调用新函数，就可以随时随地让 LED 闪烁。注意函数名后的空括号。这表示该函数不接受任何参数。它使用的延迟值是由你之前使用的相同\
    \ `delayPeriod` 变量设置的。\n\n### 参数 (Parameters)\n\n当我们调用 `flash` 时，我们为它提供闪烁次数以及持续多长时间。在这种情况下，我们提供了两个参数。\n\
    \n```cpp\n// sketch 4-02\nconst int ledPin = 13;\nconst int delayPeriod = 250;\n\
    \nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n  flash(20,\
    \ delayPeriod);\n  delay(3000);\n}\n\nvoid flash(int numlashes, int d)\n{\n  for\
    \ (int i = 0; i < numlashes; i++)\n  {\n    digitalWrite(ledPin, HIGH);\n    delay(d);\n\
    \    digitalWrite(ledPin, LOW);\n    delay(d);\n  }\n}\n```\n\n所以，我们真正做的是将闪烁 LED\
    \ 的四行代码从 `for` 循环的中间移动到它们自己的名为 `flash` 的函数中。现在你只需要通过编写 `flash()` 调用新函数，就可以随时随地让\
    \ LED 闪烁。注意函数名后的空括号。这表示该函数不接受任何参数。它使用的延迟值是由你之前使用的相同 `delayPeriod` 变量设置的。\n\n当我们调用\
    \ `flash` 时，我们为它提供闪烁次数以及持续多长时间。在这种情况下，我们提供了两个参数。\n\n现在我们看 `loop` 函数，它里面有两个行。我们在草图底部定义函数时，我们声明了变量类型。在这种情况下，它们都是\
    \ `int`。然而，这些变量（`numlashes` 和 `d`）只能在 `flash` 函数内部使用。这是一个很好的函数，因为它封装了闪烁 LED 所需的所有内容。它唯一从外部需要的信息是\
    \ LED 连接到哪个引脚。如果你愿意，你可以把这个变成一个参数——如果你的 Arduino 上连接了多个 LED，这样做会很好。\n\n### 全局变量、局部和静态变量\
    \ (Global, Local, and Static Variables)\n\n正如前面提到的，函数的参数只能在该函数内部使用。所以，如果你写以下代码，将得到错误：\n\
    \n```cpp\nvoid indicate(int x)\n{\n  flash(x, 10);\n}\nx = 15;\n```\n\n另一方面，假设你写了这样的：\n\
    \n```cpp\nint x = 15;\nvoid indicate(int x)\n{\n  flash(x, 10);\n}\n```\n\n这段代码不会导致编译错误。然而，你需要小心，因为你现在有两个名为\
    \ `x` 的变量，且它们的值可能不同。你在第一行声明的那个被称为全局变量。之所以被称为全局变量，是因为你可以在程序的任何地方使用它，包括任何函数内部。\n\
    \n但是，由于你在函数内部使用了与参数相同的变量名 `x`，你无法简单地使用全局变量 `x`，因为每当你在函数内部引用 `x` 时，“局部”版本的 `x`\
    \ 具有优先权。参数 `x` 被认为遮蔽（shadow）了同名的全局变量。这在调试项目时可能会导致一些困惑。\n\n除了定义参数之外，你还可以定义不是参数但仅供函数内部使用的变量。这些被称为局部变量。例如：\n\
    \n```cpp\nvoid indicate(int x)\n{\n  int timesToFlash = x * 2;\n  flash(timesToFlash,\
    \ 10);\n}\n```\n\n"
- fmt: "\nThe local variable `timesToFlash` will only exist while the function is\
    \ running. As soon as the function has finished its last command, it will disappear.\
    \ This means that local variables are not accessible from anywhere in your program\
    \ other than in the function in which they are defined.\n\nSo, for instance, the\
    \ following example will cause an error:\n\n```\nvoid indicate(int x)\n{\n  int\
    \ timesToFlash = x * 2;\n  flash(timesToFlash, 10);\n}\ntimesToFlash = 15;\n```\n\
    \nSeasoned programmers generally treat global variables with suspicion. The reason\
    \ is that they go against the principal of encapsulation. The idea of `encapsulation`\
    \ is that you should wrap up in a package everything that has to do with a particular\
    \ feature. Hence functions are great for encapsulation. The problem with “globals”\
    \ (as global variables are often called) is that they generally get defined at\
    \ the beginning of a sketch and may then be used all over the sketch. Sometimes\
    \ there is a perfectly legitimate reason for this. Other times, people use them\
    \ in a lazy way when it would be far more appropriate to pass parameters. In our\
    \ examples so far, `ledPin` is a good use of a global variable. It’s also very\
    \ convenient and easy to find up at the top of the sketch, making it easy to change.\n\
    \nAnother feature of local variables is that their value is initialized every\
    \ time the function is run. This is nowhere more true (and often inconvenient)\
    \ than in the `loop` function of an Arduino sketch. Let’s try and use a local\
    \ variable in place of a global variable in one of the examples from the previous\
    \ chapter:\n\n```\n// sketch 4-03\nconst int ledPin = 13;\nconst int delayPeriod\
    \ = 250;\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n int\
    \ count = 0;\n digitalWrite(ledPin, HIGH);\n delay(delayPeriod);\n digitalWrite(ledPin,\
    \ LOW);\n delay(delayPeriod);\n count ++;\n if (count == 20)\n {\n   count = 0;\n\
    \   delay(3000);\n }\n}\n```\n\nSketch 4-03 is based on sketch 3-09, but attempts\
    \ to use a local variable instead of the global variable to count the number of\
    \ flashes.\n\nThis sketch is broken. It will not work, because every time `loop`\
    \ is run, the variable `count` will be given the value 0 again, so `count` will\
    \ never reach 20 and the LED will just keep flashing forever. The whole reason\
    \ that we made `count` a global in the first place was so that its value would\
    \ not be reset. The only place that we use `count` is in the `loop` function,\
    \ so this is where it should be placed.\n\nFortunately, there is a mechanism in\
    \ C that gets around this conundrum. It is the keyword `static`. When you use\
    \ the keyword `static` in front of a variable declaration in a function, it has\
    \ the effect of initializing the variable only the first time that the function\
    \ is run. Perfect! That’s just what is required in this situation. We can keep\
    \ our variable in the function where it’s used without it getting set back to\
    \ 0 every time the function runs. Sketch 4-04 shows this in operation:\n\n```\n\
    // sketch 4-04\nconst int ledPin = 13;\nconst int delayPeriod = 250;\nvoid setup()\n\
    {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n static int count = 0;\n digitalWrite(ledPin,\
    \ HIGH);\n delay(delayPeriod);\n digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n\
    \ count ++;\n if (count == 20)\n {\n   count = 0;\n   delay(3000);\n }\n}\n```\n\
    \n***\n\n### Return Values\n\nComputer science, as an academic discipline, has\
    \ as its parents mathematics and engineering. This heritage lingers on in many\
    \ of the names associated with programming. The word `function` is itself a mathematical\
    \ term. In mathematics, the input to the function (the argument) completely determines\
    \ the output. We have written functions that take an input, but none that give\
    \ us back a value. All our functions have been “void” functions. If a function\
    \ returns a value, then you specify a return type.\n\nLet’s look at writing a\
    \ function that takes a temperature in degrees Centigrade and returns the equivalent\
    \ in degrees Fahrenheit:\n\n```\nint centToFaren(int c)\n{\n  int f = c * 9 /\
    \ 5 + 32;\n  return f;\n}\n```\n\nThe function definition now starts with `int`\
    \ rather than `void` to indicate that the function will return an `int` to whatever\
    \ calls it. This might be a bit of code that looks like this:\n\n```\nint pleasantTemp\
    \ = centToFaren(20);\n```\n\nAny nonvoid function has to have a `return` statement\
    \ in it. If you do not put one in, the compiler will tell you that it is missing.\
    \ You can have more than one `return` in the same function. This might arise if\
    \ you have an `if` statement with alternative actions based on some condition.\
    \ Some programmers frown on this, but if your functions are small (as all functions\
    \ should be), then this practice will not be a problem.\n\nThe value after `return`\
    \ can be an expression; it does not have to just be the name of a variable. So\
    \ you could compress the preceding example into the following:\n\n```\nint centToFaren(int\
    \ c)\n{\n  return (c * 9 / 5 + 32);\n}\n```\n\n***\n\n### Other Variable Types\n\
    \nComputer science, as an academic discipline, has as its parents mathematics\
    \ and engineering. This heritage lingers on in many of the names associated with\
    \ programming. The word `function` is itself a mathematical term. In mathematics,\
    \ the input to the function (the argument) completely determines the output. We\
    \ have written functions that take an input, but none that give us back a value.\
    \ All our functions have been “void” functions. If a function returns a value,\
    \ then you specify a return type.\n\nLet’s look at writing a function that takes\
    \ a temperature in degrees Centigrade and returns the equivalent in degrees Fahrenheit:\n\
    \n```\nint centToFaren(int c)\n{\n  int f = c * 9 / 5 + 32;\n  return f;\n}\n\
    ```\n\nThe function definition now starts with `int` rather than `void` to indicate\
    \ that the function will return an `int` to whatever calls it. This might be a\
    \ bit of code that looks like this:\n\n```\nint pleasantTemp = centToFaren(20);\n\
    ```\n\nAny nonvoid function has to have a `return` statement in it. If you do\
    \ not put one in, the compiler will tell you that it is missing. You can have\
    \ more than one `return` in the same function. This might arise if you have an\
    \ `if` statement with alternative actions based on some condition. Some programmers\
    \ frown on this, but if your functions are small (as all functions should be),\
    \ then this practice will not be a problem.\n\nThe value after `return` can be\
    \ an expression; it does not have to just be the name of a variable. So you could\
    \ compress the preceding example into the following:\n\n```\nint centToFaren(int\
    \ c)\n{\n  return (c * 9 / 5 + 32);\n}\n```\n\n#### floats\n\nOne such type, which\
    \ is relevant to, is `float`. This type represents numbers that may have a decimal\
    \ point. For circumstances like this, we can use `float`s. In the following example,\
    \ our temperature function is rewritten to use `float`s:\n\n```\nfloat centToFaren(float\
    \ c)\n{\n  float f = c * 9.0 / 5.0 + 32.0;\n  return f;\n}\n```\n\nNotice how\
    \ we have added `.0` to the end of our constants. This ensures that the compiler\
    \ knows to treat them as `float`s rather than `int`s.\n\n#### boolean\n\nBoolean\
    \ values are logical. They have a value that is true or false.\n\nIn the C language,\
    \ `boolean` is spelled with a lowercase *b,* but in general use, `Boolean` has\
    \ an uppercase initial letter, as it is named after the mathematician George Boole,\
    \ who invented the Boolean logic that is crucial to computer science.\n\nYou may\
    \ not realize it, but you have already met Boolean values when we were looking\
    \ at the `if` command. The condition in an `if` statement, such as `(count ==\
    \ 20)`, is actually an expression that yields a `boolean` result. The operator\
    \ `==` is called a comparison operator. Whereas `+` is an arithmetic operator\
    \ that adds two numbers together, `==` is a comparison operator that compares\
    \ two numbers and returns a value of true or false.\n\nYou can define Boolean\
    \ variables and use them as follows:\n\n```\nboolean tooBig = (x > 10);\nif (tooBig)\n\
    {\n  x = 5;\n}\n```\n\nBoolean values can be manipulated using Boolean operators.\
    \ So, similar to how you can perform arithmetic on numbers, you can also perform\
    \ operations on Boolean values. The most commonly used Boolean operators are **and**,\
    \ which is written as `&&`, and **or**, which is written as `||`.\n\n[Figure 4-1](#13_Chapter_04.xhtml_fig-ch4-1)\
    \ shows truth tables for the **and** and **or** operators.\n"
