  trans: "\n\n1. 运行 `setup`并将引脚 13 设置为输出。\n2. 运行 `loop`并将引脚 13 设置为高电平（LED 亮）。\n3.\
    \ 延迟半秒。\n4. 将引脚 13 设置为低电平（LED 灭）。\n5. 再次运行 `loop` 回到步骤 2，并将引脚 13 设置为高电平（LED 亮）。\n\
    \n问题出现在步骤 4 和 5 之间。发生的情况是 LED 被关闭了，但紧接着发生的事情是它再次被打开。这一切发生得如此，以至于 LED 看起来直亮的。\n\
    \nArduino 上的微控制器芯片每秒可以执行 1600 万条指令。这不是 1600 万条 C 语言命令，但仍然非常快。因此，我们的 LED 只会关闭几百万分之一秒。\n\
    \n要解决这个问题，你需要在关闭 LED 后再添加另一个延迟。你的代码现在应该看起来像：\n\n```\n// sketch 3-01\nvoid setup()\n\
    {\n  pinMode(13, OUTPUT);\n}\n\nvoid loop()\n{\n digitalWrite(13, HIGH);\n delay(500);\n\
    \ digitalWrite(13, LOW);\n delay(500);\n}\n```\n\n再次尝试，你的 LED 应该会每秒愉快地闪烁一次。\n\n\
    你可能注意到列表顶部的注释写着“sketch 3-01”。为了节省你的打字时间，我们已经在本书的网站上上传了所有带有此类注释的程序。你可以从 [www.arduinobook.com](http://www.arduinobook.com)\
    \ 下载它们。\n\n***\n\n### 变量\n\n在这个 Blink 示例中，你使用了引脚 13 并且在三个地方引用了它。如果你决定使用不同的引脚，那么你必须在三个地方更改代码。同样，如果你想更改闪烁频率（由\
    \ `delay()` 的参数控制），你需要在两个地方将 500 改为其他数字。\n\n变量可以被看作是给数字数字命名。实际上，它们的功能比这要强大得多，但目前你将它们用于此目的。\n\
    \n在 C 语言中定义变量时，你必须指定变量的类型。我们希望变量是整数，这在 C 语言中被称为 `int`。因此，要定义一个名为 `ledPin` 值为 13\
    \ 的变量，你需要写如下代码：\n\n```\nint ledPin = 13;\n```\n\n注意，由于 `ledPin` 是一个名称，适用于与函数名相同的规则。因此，不能有任何空格。惯例是用小写字母开始变量，每个新单词以大写字母开头。程序员通常称这为“波峰命名”（bumpy\
    \ case）或“驼峰命名”（camel case）。\n\n让我们将其整合到你的 Blink 程序中：\n\n```\n// sketch 3-02\n\
    int ledPin = 13;\nint delayPeriod = 500;\n```\n\n```\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop()\n{\n digitalWrite(ledPin, HIGH);\n delay(delayPeriod);\n\
    \ digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n}\n```\n\n我们还偷偷加入了另一个名为 `delayPeriod`\
    \ 的变量。\n\n在程序中所有以前引用 13 的地方，现在都引用 `ledPin`；在所有以前引用 500 的地方，现在都引用 `delayPeriod`。\n\
    \n如果你想让程序闪烁得更快，只需要在一个地方更改 `delayPeriod` 的值即可。尝试将其改为 100 并在你的 Arduino 板上运行该程序。\n\
    \n你还可以对变量做其他巧妙花样。让我们修改你的程序，让闪烁开始时非常快，然后逐渐变慢，就好像 Arduino 变累了一样。要做到这一点，你只需要在每次闪烁时给\
    \ `delayPeriod` 变量累加一些值。\n\n通过在 `loop` 函数末尾添加单行代码来修改程序，使其像如下列表所示，然后在 Arduino 板上运行该程序。按下\
    \ Reset 按钮，看它如何再次从快速的频率开始闪烁。\n\n```\n// sketch 3-03\nint ledPin = 13;\nint delayPeriod\
    \ = 100;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n\
    \ digitalWrite(ledPin, HIGH);\n delay(delayPeriod);\n digitalWrite(ledPin, LOW);\n\
    \ delay(delayPeriod);\n delayPeriod = delayPeriod + 100;\n}\n```\n\n你的 Arduino\
    \ 现在正在进行算术运算。每当调用 `loop` 时，它都会执行正常的 LED 闪烁，然后将变量 `delayPeriod` 增加 100。我们很快会回到算术部分，但首先你需要比闪烁\
    \ LED 更好的方法来观察 Arduino 在做什么。\n\n***\n\n### C 语言实验\n\n你需要一种方法来测试你的 C 实验。一种方法是将你想测试的\
    \ C 代码放入 `setup` 函数中，在 Arduino 上进行评估，然后让 Arduino 将任何输出显示到称为串口监视器（Serial Monitor）的地方，如图\
    \ 3-5 和 3-6 所示。\n\n串口监视器是一个允许你与 Arduino 通的窗口。要使用它，你需要在 `setup` 函数中使用 `Serial.begin(baudrate)`，然后使用\
    \ `Serial.print()` 或 `Serial.println()` 发送数据。`baudrate` 是每秒位的通信速率。常用值是 9600。\n\
    \n```c\nvoid setup()\n{\n  Serial.begin(9600);\n  Serial.println(\"Hello Arduino!\"\
    );\n}\n\nvoid loop()\n{\n  Serial.println(\"Blinking...\");\n  delay(1000);\n\
    }\n```\n\n你也可以使用 `Serial.read()` 从 Arduino 读取数据。这允许你创建交互式程序。\n\n```c\nvoid setup()\n\
    {\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  if (Serial.available() > 0) {\n\
    \    int data = Serial.read();\n    Serial.print(\"Received: \");\n    Serial.println(data);\n\
    \  }\n}\n```\n\n#### 数字变量与算术\n\n在 C 语言中，你可以对变量进行算术运算。基本的运算符是用于加法的 `+`、减法的 `-`、乘法的\
    \ `*` 和除法的 `/`。你还可以使用 `%` 运算符进行模运算，它给出除法的余数。\n\n```c\nint a = 10;\nint b = 3;\n\
    int sum = a + b; // 13\nint diff = a - b; // 7\nint product = a * b; // 30\nint\
    \ quotient = a / b; // 3\nint remainder = a % b; // 1\n```\n\n你还可以使用复合赋值运算符来简化你的代码：\n\
    \n```\nint x = 10;\nx += 5; // 等同于 x = x + 5\nx -= 2; // 等同于 x = x - 2\nx *= 3;\
    \ // 等同于 x = x * 3\nx /= 4; // 等同于 x = x / 4\n```\n\n"
- fmt: "\nSo, in the Centigrade to Fahrenheit example, you are defining the variable\
    \ `degC` and giving it an initial value of 20, but when you define `degF`, it\
    \ does not get an initial value. Its value gets assigned on the next line, according\
    \ to the conversion formula, before being sent to the Serial Monitor for you to\
    \ see.\n\nLooking at the expression, you can see that you use the asterisk `*`\
    \ for multiplication and the slash `/` for division. The arithmetic operators\
    \ `+`, `–`, `*`, and `/` have an order of precedence—that is, multiplications\
    \ are done first, then divisions, then additions and subtractions. This is in\
    \ accordance with the usual use of arithmetic. However, sometimes it makes it\
    \ clearer to use parentheses in the expressions. So, for example, you could write\
    \ the following:\n\n```\ndegF = ((degC * 9) / 5) + 32;\n```\n\nThe expressions\
    \ that you write can be as long and complex as you need them to be, and in addition\
    \ to the usual arithmetic operators, there are other less commonly used operators\
    \ and a big collection of various mathematical functions that are available to\
    \ you. You will learn about these later.\n\n***\n\n## Commands\n\nThe C language\
    \ has a number of built-in commands. In this section, we explore some of these\
    \ and see how they can be of use in your sketches.\n\n### if\n\nIn our sketches\
    \ so far, we have assumed that your lines of programming will be executed in order\
    \ one after the other, with no exceptions. But what if you don’t want to do that?\
    \ What if you only want to execute part of a sketch if some condition is true?\n\
    \nLet’s return to our gradually slowing-down Blinking LED example. At the moment,\
    \ it will gradually get slower and slower until each blink is lasting hours. Let’s\
    \ look at how we can change it so that once it has slowed down to a certain point,\
    \ it goes back to its fast starting speed.\n\nTo do this, you must use an `if`\
    \ command; the modified sketch is as follows. Try it out.\n\n```\n// sketch 3-06\n\
    int ledPin = 13;\nint delayPeriod = 100;\n```\n\n```\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop()\n{\n  digitalWrite(ledPin, HIGH);\n  delay(delayPeriod);\n\
    \  digitalWrite(ledPin, LOW);\n  delay(delayPeriod);\n  delayPeriod = delayPeriod\
    \ + 100;\n  if (delayPeriod > 3000)\n  {\n    delayPeriod = 100;\n  }\n}\n```\n\
    \nThe `if` command looks a little like a function definition, but this resemblance\
    \ is only superficial. The word in the parenthesis is not an argument; it is what\
    \ is called *a condition*. So in this case, the condition is that the variable\
    \ `delayPeriod` has a value that is greater than 3,000. If this is true, then\
    \ the commands inside the curly braces will be executed. In this case, the code\
    \ sets the value of `delayPeriod` back to 100.\n\nIf the condition is not true,\
    \ then the Arduino will just continue on with the next thing. In this case, there\
    \ is nothing after the “if”, so the Arduino will run the `loop()` function again.\n\
    \nRunning through the sequence of events in your head will help you understand\
    \ what is going on. So, here is what happens:\n\n1. Arduino runs `setup()` and\
    \ initializes the LED pin to be an output.\n2. Arduino starts running `loop()`.\n\
    3. The LED turns on.\n4. A delay occurs.\n5. The LED turns off.\n6. A delay occurs.\n\
    7. Add 100 to the `delayPeriod`.\n8. If the delay period is greater than 3,000,\
    \ set it back to 100.\n9. Go back to step 3.\n\nWe used the symbol `>`, which\
    \ means greater than. It is one example of what are called comparison operators.\
    \ These operators are summarized in the following table:\n\n| Operator | Meaning\
    \ | Examples | Result |\n| --- | --- | --- | --- |\n| `<` | Less than | `9 < 10`,\
    \ `10 < 10` | true false |\n| `>` | Greater than | `10 > 10`, `10 > 9` | false\
    \ true |\n| `<=` | Less than or equal to | `9 <= 10`, `10 <= 10` | true true |\n\
    | `>=` | Greater than or equal to | `10 >= 10`, `10 >= 9` | true true |\n| `==`\
    \ | Equal to | `9 == 9` | true |\n| `!=` | Not equal to | `9 != 9` | false |\n\
    \nTo compare two numbers, you use the `==` command. This double equals sign is\
    \ easily confused with the character `=`, which is used to assign values to variables.\n\
    \nThere is another form of `if` that allows you to do one thing if the condition\
    \ is true and another if it is false. We will use this in some practical examples\
    \ later in the book.\n\n### for\n\nIn addition to executing different commands\
    \ under different circumstances, you also often will want to run a series of commands\
    \ a number of times in a program. You already know one way of doing this, using\
    \ the `loop()` function. As soon as all the commands in the `loop()` function\
    \ have been run, it will start again automatically. However, sometimes you need\
    \ more control than that.\n\nSo, for example, let’s say that you want to write\
    \ a sketch that blinks 20 times, then pauses for 3 seconds, and then starts again.\
    \ You could do that by just repeating the same code over and over again in your\
    \ `loop()` function, like this:\n\n```\n// sketch 3-07\nint ledPin = 13;\nint\
    \ delayPeriod = 100;\n```\n\n```\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n\
    }\n\nvoid loop()\n{\n digitalWrite(ledPin, HIGH);\n delay(delayPeriod);\n digitalWrite(ledPin,\
    \ LOW);\n delay(delayPeriod);\n\n digitalWrite(ledPin, HIGH);\n delay(delayPeriod);\n\
    \ digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n\n digitalWrite(ledPin, HIGH);\n\
    \ delay(delayPeriod);\n digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n// repeat\
    \ the above 4 lines another 17 times\n\n delay(3000);\n}\n```\n\nBut this requires\
    \ a lot of typing and there are several much better ways to do this. Let’s start\
    \ by looking at how you can use a `for` loop and then look at another way of doing\
    \ it using a counter and an `if` statement.\n\n```\n// sketch 3-08\nint ledPin\
    \ = 13;\nint delayPeriod = 100;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n\
    }\n\nvoid loop()\n{\n  for (int i = 0; i < 20; i++)\n  {\n   digitalWrite(ledPin,\
    \ HIGH);\n   delay(delayPeriod);\n   digitalWrite(ledPin, LOW);\n   delay(delayPeriod);\n\
    \  }\n delay(3000);\n}\n```\n\nThe `for` loop looks a bit like a function that\
    \ takes three arguments, although here those arguments are separated by semicolons\
    \ rather than the usual commas. This is just a quirk of the C language. The compiler\
    \ will soon tell you when you get it wrong.\n\nThe first thing in the parentheses\
    \ after `for` is a variable declaration. This specifies a variable to be used\
    \ as a counter and gives it an initial value—in this case, 0.\n\nThe second part\
    \ is a condition that must be true for you to stay in the `loop`. In this case,\
    \ you will stay in the `loop` as long as `i` is less than 20, but as soon as `i`\
    \ is 20 or more, the program will exit the `loop`.\n\nThe final part is what to\
    \ do every time you have done all the things in the `loop`. In this case, that\
    \ is to increment `i` by 1 so that it can, after 20 trips around the `loop`, cease\
    \ to be less than 20 and cause the program to exit the `loop`.\n\nTry entering\
    \ this code and running it. The only way to get familiar with the syntax and all\
    \ that pesky punctuation is to type it in and have the compiler tell you when\
    \ you have done something wrong. Eventually, it will all start to make sense.\n\
    \nOne potential downside of this approach is that the `loop()` function is going\
    \ to take a long time. This is not a problem for this sketch, because all it is\
    \ doing is flashing an LED. But often, the `loop()` function in a sketch will\
    \ also be checking keys have been pressed or that serial communications have been\
    \ received. If the processor is busy inside a `for` loop, it will not be able\
    \ to do this. Generally, it is a good idea to make the `loop()` function run as\
    \ fast as possible so that it can be run as frequently as possible.\n\nThe following\
    \ sketch shows how to achieve this:\n"
