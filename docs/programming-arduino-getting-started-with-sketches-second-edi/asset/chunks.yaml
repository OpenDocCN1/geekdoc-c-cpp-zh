    \ and [3-6](#12_Chapter_03.xhtml_fig-ch3-6).\n\n![image](images/fig-ch3-5.jpg)\n\
    \nFigure 3.5 *Writing C in **setup***.\n\n![image](images/fig-ch3-6.jpg)\n\nFigure\
    \ 3.6 *The Serial Monitor*.\n\nThe Serial Monitor is part of the Arduino IDE.\
    \ You access it by clicking on the rightmost icon in the toolbar (it looks like\
    \ a magnifying glass). Its purpose is to act as a communication channel between\
    \ your computer and the Arduino. You can type a message in the text entry area\
    \ at the top of the Serial Monitor and when you press Return or click Send, it\
    \ will send that message to the Arduino. Also if the Arduino has anything to say,\
    \ this message will appear in the Serial Monitor. In both cases, the information\
    \ is sent through the USB link.\n\nAs you would expect, there is a built-in function\
    \ that you can use in your sketches to send a message back to the Serial Monitor.\
    \ It is called **Serial.println** and it expects a single argument, which consists\
    \ of the information that you want to send. This information is usually a variable.\n\
    \nYou will use this mechanism to test out a few things that you can do with variables\
    \ and arithmetic in C; frankly, it’s the only way you can see the results of your\
    \ experiments in C.\n\n#### Numeric Variables and Arithmetic\n\nThe last thing\
    \ you did was add the following line to your blinking sketch to increase the blinking\
    \ period steadily:\n\n```\ndelayPeriod = delayPeriod + 100;\n```\n\nLooking closely\
    \ at this line, it consists of a variable name, then an equals sign, then what\
    \ is called an expression (**delayPeriod + 100**). The equals sign does something\
    \ called assignment. That is, it assigns a new value to a variable, and the value\
    \ it is given is determined by what comes after the equals sign and before the\
    \ semicolon. In this case, the new value to be given to the **delayPeriod** variable\
    \ is the old value of **delayPeriod** plus 100.\n\nLet’s test out this new mechanism\
    \ to see what the Arduino is up to by entering the following sketch, running it,\
    \ and opening the Serial Monitor:\n\n```\n// sketch 3-04\nvoid setup()\n{\n  Serial.begin(9600);\n\
    \  int a = 2;\n  int b = 2;\n  int c = a + b;\n  Serial.println(c);\n}\nvoid loop()\n\
    {}\n```\n\n[Figure 3-7](#12_Chapter_03.xhtml_fig-ch3-7) shows what you should\
    \ see in the Serial Monitor after this code runs.\n\n![image](images/fig-ch3-7.jpg)\n\
    \nFigure 3.7 *Simple arithmetic*.\n\nTo take a slightly more complex example,\
    \ the formula for converting a temperature in degrees Centigrade into degrees\
    \ Fahrenheit is to multiply it by 9, divide by 5, and then add 32\\. So you could\
    \ write that in a sketch like this:\n\n```\n// sketch 3-05\nvoid setup()\n{\n\
    \  Serial.begin(9600);\n  int degC = 20;\n  int degF;\n  degF = degC * 9 / 5 +\
    \ 32;\n  Serial.println(degF);\n}\nvoid loop()\n{}\n```\n\nThere are a few things\
    \ to notice here. First, note the following line:\n\n```\nint degC = 20;\n```\n\
    \nWhen we write such a line, we are actually doing two things: We are declaring\
    \ an **int** variable called **degC**, and we are saying that its initial value\
    \ will be 20\\. Alternatively, you could separate these two things and write the\
    \ following:\n\n```\nint degC;\ndegC = 20;\n```\n\nYou must declare any variable\
    \ just once, essentially telling the compiler what type of variable it is—in this\
    \ case, **int**. However, you can assign the variable a value as many times as\
    \ you want:\n\n```\nint degC;\ndegC = 20;\ndegC = 30;\n```"
