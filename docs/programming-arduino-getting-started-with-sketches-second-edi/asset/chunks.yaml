  trans: "\n你将学习如何运行一个本地 Web 服务器，并使用这两种类型的板卡向互联网服务发送出的 Web 请求。最后，将简要介绍如 Particle Photon\
    \ 和 Arduino Yun 等其他选项。\n\n***\n\n## 与 Web 服务器通信\n\n在查看 Arduino 如何处理浏览器与它使用的 Web\
    \ 服务器之间的通信之前，你需要对超文本传输协议（`HTTP`）和超文本标记语言（`HTML`）有一定的了解。\n\n### HTTP\n\n超文本传输协议是\
    \ Web 浏览器与 Web 服务器通信的方法。\n\n当你使用 Web 浏览器访问页面时，浏览器会向托管该页面的服务器发送一个请求，说明它想要的内容。浏览器请求的可能只是\
    \ `HTML` 格式的页面内容。Web 服务器一直在监听此类请求，当它接收到请求时，就会对其进行处理。在简单的情况下，处理请求仅意味着发送回你在 Arduino\
    \ 图程序（sketch）中指定的 `HTML`。\n\n### HTML\n\n超文本标记语言是一种为普通文本添加格式的方法，使其在浏览器显示时看起来很美观。例如，以下代码是\
    \ `HTML`，显示在浏览器页面上的效果所示图 10-2：\n\n![image](img/fig-ch10-2.jpg)\n\n图 10.2 *一个 HTML\
    \ 示例*。\n\n```html\n<html>\n<body>\n<h1>Programming Arduino</h1>\n<p>A book about\
    \ programming Arduino</p>\n</body>\n</html>\n```\n\n等一下，让我来纠正一下。\n\n`HTML` 包含标签（tags）。标签有开始（start）和结束（end），并且通常包含其他标签。标签的开始部分有一个\
    \ `<` 符号，然后是标签名，最后是 `>`；例如 `<<html>`。标签的结束部分类似，不同之处是在 `<` 之后有一个 `/`。在先的示例中，最外层的标签是\
    \ `<html>`，它包含一个名为 `<body>` 的制表符。所有网页都应该以此类标签开头，你可以在文件尾看到这些标签对应的结束。注意，你必须按照正确的顺序放置结束标签，因此\
    \ `body` 标签必须在 `html` 标签之前关闭。\n\n现在我们到了中间有趣的部分，`h1` 和 `p` 标签。这些是示例中实际显示的部分。\n\n\
    `h1` 标签表示一级标题。它的效果是将其包含的文本以大号粗字体显示。`p` 标签是段落标签，因此其中包含的所有文本都将作为段落显示。\n\n这真的仅仅是\
    \ `HTML` 的冰角。有很多书籍和互联网资源可以用来学习 `HTML`。\n\n***\n\n## 作为 Web 服务器的 Arduino Uno\n\n\
    第一个示例图程序简单使用 Arduino 和以太网扩展板（Ethernet shield）创建一个小型 Web 服务器。它绝对不是 Google 服务器群，但它允许你向\
    \ Arduino 发送 Web 请求并在电脑的浏览器中查看结果。Arduino Uno 和以太网扩展板的替代方案是使用 Freetronics 的 `EtherTen`\
    \ 板卡，它将 Uno 和扩展板合并为一个兼容 Uno 和扩展板的单板。\n\n在上传图程序 10-01 之前，你可能想对代码进行更改。如果你查看图程序的顶部，会看到以下行代码：\n\
    \n```cpp\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED };\n```\n\n`mac` 地址在连接到你网络的所有设备中必须是唯一的。\n\
    \n使用 USB 线将 Arduino 连接到电脑并上传图程序。现在你可以断开 USB 线，并将电源连接到 Arduino 和以太网线。\n\n打开 Arduino\
    \ IDE 的串口监视器，你应该能看到类似图 10-3 所示的内容，告诉你网络分配给你的 Arduino 的 IP 地址。使用浏览器导航到该 IP 地址，你应该能看到像图\
    \ 10-4 所示的网页。\n\n![image](img/fig-ch10-3.jpg)\n\n图 10.3 *查找你的 Arduino 的 IP 地址*。\n\
    \n![image](img/fig-ch10-4.jpg)\n\n图 10.4 *一个简单的 Arduino 服务器示例*。\n\n图程序 10-01 的列表如下：\n\
    \n```cpp\n// sketch 10-01 Simple Server Example\n#include <SPI.h>\n#include <Ethernet.h>\n\
    \n// MAC 地址只需要是唯一的。这应该可以工作\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED\
    \ };\n\nEthernetServer server(80);\n\nvoid setup()\n{\n  Serial.begin(9600);\n\
    \  Ethernet.begin(mac);\n  server.begin();\n  Serial.print(\"Server started on:\
    \ \");\n  Serial.println(Ethernet.localIP());\n}\n\nvoid loop()\n{\n  // 监听传入的客户端\n\
    \  EthernetClient client = server.available();\n  if (client) \n  {\n    while\
    \ (client.connected()) \n    {\n      // 发送标准的 http 响应头\n      client.println(\"\
    HTTP/1.1 200 OK\");\n      client.println(\"Content-Type: text/html\");\n    \
    \  client.println(\"<html>\");\n      client.println(\"<body>\");\n      client.println(\"\
    <h1>Programming Arduino</h1>\");\n      client.println(\"<p>A book about programming\
    \ Arduino</p>\");\n      client.println(\"</body>\");\n      client.println(\"\
    </html>\");\n      client.stop();\n    }\n  }\n}\n```\n\n图程序 10-01 的内容所示。与第 9\
    \ 章讨论的 LCD 库一样，以太网库负责与扩展板交互。\n\n`setup` 函数使用你之前设置的 `mac` 地址初始化以太网库。`loop` 函数负责处理到达服务器的请求。如果有请求在等待，`server.available()`\
    \ 将返回一个客户端。客户端是一个对象；你将在第 11 章了解到更多。但现在你只需要知道是否存在客户端（通过第一个 `if` 语句测试）；然后你可以通过调用\
    \ `client.connected()` 判断它是否连接到 Web 服务器。\n\n接下来的三行代码打印标头。这只是告诉浏览器要显示什么类型的内容。在这种情况下，浏览器要显示\
    \ HTML 内容。\n\n一旦写了标头，剩下的工作就是将剩余的 HTML 写回浏览器。这必须包含通常的 `<html>` 和 `<body>` 标签，还包含一个\
    \ `<h1>` 标题标签和两个 `<p>` 标签，用于显示模拟输入 A0 的值以及 `millis()` 函数返回的值；该值是自 Arduino 重置以来的毫秒数。\n\
    \n最后，`client.stop()` 告诉浏览器消息已完成。浏览器随后显示页面。\n\n## Web 控制的 Arduino\n\n使用以太网扩展板的第二个示例允许你使用\
    \ Web 表单开启 Arduino 引脚 D3 到 D7。\n\n与简单服务器示例不同，你将找到一种将引脚设置传递给 Arduino 方法。\n\n执行此操作称为数据提交（posting\
    \ data），是 HTTP 标准的一部分。\n"
- fmt: "\nA request parameter is similar in concept to a function parameter. A function\
    \ parameter enables you to get information to a function, such as the number of\
    \ times to blink, and a request parameter enables you to pass data to the Arduino\
    \ that is going to handle the Web request. When the Arduino receives the Web request,\
    \ it can extract the pin settings from the request parameter and change the actual\
    \ pins.\n\nThe code for the second example sketch follows:\n\n```cpp\n// sketch\
    \ 10-02 Internet Pins\n\n#include <SPI.h>\n#include <Ethernet.h>\n\n// MAC address\
    \ just has to be unique. This should work\nbyte mac[] = { 0xDE, 0xAD, 0xBE, 0xEF,\
    \ 0xFE, 0xED };\n\nEthernetServer server(80);\n\nint numPins = 5;\nint pins[]\
    \ = {3, 4, 5, 6, 7};\nint pinState[] = {0, 0, 0, 0, 0};\nchar line1[100];\n\n\
    void setup()\n{\n  for (int i = 0; i < numPins; i++)\n  {\n     pinMode(pins[i],\
    \ OUTPUT);\n  }\n  Serial.begin(9600);\n  Ethernet.begin(mac);\n  server.begin();\n\
    \  Serial.print(\"Server started on: \");\n  Serial.println(Ethernet.localIP());\n\
    }\n\nvoid loop()\n{\n  EthernetClient client = server.available();\n  if (client)\
    \ \n  {\n    while (client.connected()) \n    {\n      readHeader(client);\n \
    \     if (! pageNameIs(\"/\"))\n      {\n        client.stop();  \n        return;\n\
    \      }\n      client.println(\"HTTP/1.1 200 OK\");\n      client.println(\"\
    Content-Type: text/html\");\n      client.println();\n\n      // send the body\n\
    \      client.println(\"<html><body>\");\n      client.println(\"<h1>Output Pins</h1>\"\
    );\n      client.println(\"<form method='GET'>\");  \n      setValuesFromParams();\n\
    \      setPinStates();\n      for (int i = 0; i < numPins; i++)\n      {\n   \
    \      writeHTMLforPin(client, i);\n      }\n      client.println(\"<input type='submit'\
    \ \n        value='Update'/>\");\n      client.println(\"</form>\");\n      client.println(\"\
    </body></html>\");\n\n      client.stop();            \n    }\n  }\n}\n\nvoid\
    \ writeHTMLforPin(EthernetClient client, int i)\n{\n  client.print(\"<p>D\");\n\
    \  client.print(pins[i]);  \n  client.print(\" <select name='\");\n  client.print(i);\n\
    \  client.println(\"'>\");\n  client.print(\"<option value='0'\");\n  if (pinState[i]\
    \ == 0)\n  {\n    client.print(\" selected\");\n  }\n  client.println(\">Off</option>\"\
    );\n  client.print(\"<option value='1'\");\n  if (pinState[i] == 1)\n  {\n   \
    \ client.print(\" selected\");\n  }\n  client.println(\">On</option>\");\n  client.println(\"\
    </select></p>\");  \n}\n\nvoid setPinStates()\n{\n  for (int i = 0; i < numPins;\
    \ i++)\n  {\n     digitalWrite(pins[i], pinState[i]);\n  }\n}\n\nvoid setValuesFromParams()\n\
    {\n  for (int i = 0; i < numPins; i++)\n  {\n    pinState[i] = valueOfParam(i\
    \ + '0');\n  }\n}\n\nvoid readHeader(EthernetClient client)\n{\n  // read first\
    \ line of header\n  char ch;\n  int i = 0;\n  while (ch != '\\n')\n  {\n    if\
    \ (client.available())\n    {\n      ch = client.read();\n      line1[i] = ch;\n\
    \      i ++;\n    }\n  }\n  line1[i] = '\\0'; \n  Serial.println(line1);\n}\n\n\
    boolean pageNameIs(char* name)\n{\n   // page name starts at char pos 4\n   //\
    \ ends with space\n   int i = 4;\n   char ch = line1[i];\n   while (ch != ' '\
    \ && ch != '\\n' && ch != '?')\n   {\n     if (name[i-4] != line1[i])\n     {\n\
    \       return false;\n     }\n     i++;\n     ch = line1[i];\n   }\n   return\
    \ true;\n}\n\nint valueOfParam(char param)\n{\n  for (int i = 0; i < strlen(line1);\
    \ i++)\n  {\n    if (line1[i] == param && line1[i+1] == '=')\n    {\n      return\
    \ (line1[i+2] - '0');\n    }\n  }\n  return 0;\n}\n```\n\nThe sketch uses two\
    \ arrays to control the pins. The first, `pins`, just specifies which pins are\
    \ to be used. The `pinState` array holds the state of each pin: either 0 or 1.\n\
    \nTo get the information coming from the browser form about which pins should\
    \ be on and which should be off, it is necessary to read the header coming from\
    \ the browser. In fact, all you need is contained in the.\n"
