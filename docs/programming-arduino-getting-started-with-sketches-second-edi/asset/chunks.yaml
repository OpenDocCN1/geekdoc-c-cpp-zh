    # 第一章：什么是 Arduino

    本章是对 Arduino 硬件的介绍，描述了它的功能以及现有的各种类型的 Arduino 开发板。


    # 第二章：快速上手

    在这里，你将对你的 Arduino 开发板进行首次实验：安装软件、通电以及上传你的第一个草图程序（sketch）。


    # 第三章：C 语言基础

    本章涵盖了 C 语言的基础知识；对于完全的编程初学者，本章也兼作为通用编程的入门介绍。


    # 第四章：函数

    本章解释了在 Arduino 草图中使用和编写函数的核心概念。这些草图将通过可运行的代码示例进行演示。


    # 第五章：数组与字符串

    在这里，你将学习如何创建和使用比简单整数变量更高级的数据结构。我们将逐步开发一个摩斯电码示例项目，以说明所解释的概念。


    # 第六章：输入与输出

    你将学习如何在程序中使用 Arduino 的数字和模拟输入/输出。使用万用表将帮助你看到 Arduino 输入/输出连接上发生了什么。


    # 第七章：标准 Arduino 库

    本章解释了如何使用 Arduino 标准库中提供的标准 Arduino 函数。


