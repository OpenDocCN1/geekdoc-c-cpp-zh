    \n读取和写入 `EEPROM` 的官方 Arduino 命令与使用 `PROGMEM` 的命令一样难用。你必须一次一个字节地对 `EEPROM` 进行读写操作。\n\
    \nsketch 8-02 示例允许你从串口监器输入单数字字母代码。该程序会记住该数字并反复在串口监器上打印它。\n\n```\n// sketch 8-02\n\
    #include <EEPROM.h>\n\nint addr = 0;\nchar ch;\n\nvoid setup()\n{\n  Serial.begin(9600);\n\
