    \ you should see the LED light. Bouncing may be going on here, but it is probably\
    \ too fast for you to see and does not matter.\n\n![image](images/fig-ch6-9.jpg)\n\
    \nFigure 6.9 *Using a wire as a switch*.\n\nOne situation where key bouncing would\
    \ matter is if you were making your switch toggle the LED on and off. That is,\
    \ if you press the button, the LED comes on and stays on, and when you press the\
    \ button again, it turns off. If you had a button that bounced, then whether the\
    \ LED was on or off would just depend on whether you had an odd or even number\
    \ of bounces.\n\nSketch 6-05 just toggles the LED without any attempt at “debouncing.”\
    \ Try it out using your wire as a switch between pin D5 and GND (or use a real\
    \ switch if you have one):\n\n```\n// sketch 6-05\n```\n\n```\nconst int inputPin\
    \ = 5;\nconst int ledPin = 13;\nint ledValue = LOW;\n\nvoid setup() \n{\n  pinMode(inputPin,\
    \ INPUT_PULLUP);\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() \n{\n  if (digitalRead(inputPin)\
    \ == LOW)\n  {\n     ledValue = ! ledValue;\n     digitalWrite(ledPin, ledValue);\n\
    \  }\n}\n```\n\nYou will probably find that sometimes the LED toggles, but other\
    \ times it appears not to toggle. This is bouncing in action!\n\nA simple way\
    \ to tackle this problem is simply to add a delay after you detect the first button\
    \ press, as shown in sketch 6-06:\n\n```\n// sketch 6-06\nconst int inputPin =\
    \ 5;\nconst int ledPin = 13;\nint ledValue = LOW;\n\nvoid setup() \n{\n  pinMode(inputPin,\
    \ INPUT_PULLUP);\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() \n{\n  if (digitalRead(inputPin)\
    \ == LOW)\n  {\n     ledValue = ! ledValue;\n     digitalWrite(ledPin, ledValue);\n\
    \     delay(500);\n  }\n}\n```\n\nBy putting a delay here, nothing else can happen\
    \ for 500 milliseconds, by which time any bouncing will have subsided. You should\
    \ find that this makes the toggling much more reliable. An interesting side-effect\
    \ is that if you hold the button down, the LED just keeps flashing.\n\nIf that\
    \ is all there is to the sketch, then this delay is not a problem. However, if\
    \ you do more in the **loop**, then using a delay can be a problem; for example,\
    \ the program would be unable to detect the press of any other button during that\
    \ 500 milliseconds.\n\nSo, this approach is sometimes not good enough and you\
    \ will need to be a bit more sophisticated. You can write your own advanced debouncing\
    \ code by hand, but doing so gets complicated and fortunately some fine folks\
    \ have done all the work for you.\n\nTo make use of their work, you must add a\
    \ library to your Arduino application. To do this, you must download the library\
    \ itself as a zip file from here: [http://www.arduino.cc/playground/Code/Bounce](http://www.arduino.cc/playground/Code/Bounce).\
    \ Download the file using the link to GitHub. Once downloaded, the file will be\
    \ called Bounce2-master.zip. To install it into your Arduino IDE, select the option\
    \ Add .ZIP Library… from the Sketch menu ([Figure 6-10](#15_Chapter_06.xhtml_fig-ch6-10)).\n\
    \n![image](images/fig-ch6-10.jpg)\n\nFigure 6.10 *Installing the Bounce library*.\n\
    \nSketch 6-07 shows how you can use the Bounce library. Upload it to your board\
    \ and see how reliable the LED toggling has become.\n\n```\n//sketch 06-07\n```\n\
    \n```\n #include <Bounce2.h>\n\nconst int inputPin = 5;\nconst int ledPin = 13;\n\
    \nint ledValue = LOW;\nBounce bouncer = Bounce(); \n\nvoid setup() \n{\n  pinMode(inputPin,\
    \ INPUT_PULLUP);\n  pinMode(ledPin, OUTPUT);\n  bouncer.attach(inputPin);\n}\n\
    \nvoid loop() \n{\n  if (bouncer.update() && bouncer.read() == LOW) \n  {\n  \
    \ ledValue = ! ledValue;\n   digitalWrite(ledPin, ledValue);\n  }\n}\n```\n\n\
    Using the library is pretty straightforward. The first thing that you will notice\
    \ is this line:\n\n```\n#include <Bounce2.h>\n```\n\nThis is necessary to tell\
    \ the compiler to use the Bounce library.\n\nYou then have the following line:\n\
    \n```\nBounce bouncer = Bounce();\n```\n\nDo not worry about the syntax of this\
    \ line at the moment; it is actually C++ rather than C syntax, and you will not\
    \ be meeting C++ until [Chapter 11](#20_Chapter_11.xhtml). For now, you will just\
    \ have to be content to know that this sets up a **bouncer** object.\n\nThe new\
    \ line in setup links **bouncer** to the **inputPin** using the attach function.\
    \ From now on, you use that **bouncer** object to find out what the switch is\
    \ doing rather than reading the digital input directly. It has put a kind of debouncing\
    \ wrapper around your input pin. So, deciding whether a button has been pressed\
    \ is wrapped up in this line:\n\n```\nif (bouncer.update() && bouncer.read() ==\
    \ LOW)\n```"
