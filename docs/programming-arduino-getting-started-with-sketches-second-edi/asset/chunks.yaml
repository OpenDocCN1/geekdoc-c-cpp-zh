    Arduino Mega 是 Arduino 板类中的“肌肉车”。它拥有海量的输入/输出端口集合，但巧妙地将这些端口作为额外连接器位于板载的一端，使其能够保持与
    Arduino Uno、Leonardo 以及所有适用于 Arduino 的扩展板（Shields）的引脚兼容。


    它使用了一个具有更多输入/输出引脚的处理器 `ATmega1280`，这是一个贴片芯片，永久固定在板载上。因此，与 Uno 和类似的板子不同，如果你不小心损坏了处理器，无法将其更换。


    额外的连接器排列在板的末端。Mega 提供的额外功能包括：


    - 54 个输入/输出引脚

    - 128KB 闪存，用于存储程序和固定数据（相比 Uno 的 32KB）

    - 8KB RAM 和 4KB EEPROM


    Arduino Due（图 1-5）与 Mega 相同的尺寸和连接方式，但使用了运行频率为 84MHz 的 32 位 ARM 处理器。它的工作电压为 3.3V，而不是大多数
    Arduino 板的 5V，因此某些 Arduino 扩展板无法正常工作。


    ![image](img/fig-ch1-5.jpg)


    图 1.5 *Arduino Due 板板*。


    ## Micro 和小型 Arduino 板类


    对于 Uno 来说太大的情况，有一系列更小的 Arduino 和 Arduino 兼容板子。图 1-6 显示了这些板子中的可选。


    ![image](img/fig-ch1-6.jpg)


    图 1.6 *Arduino Micro（左）、Freetronics LeoStick（中）和 Adafruit Trinket（右）*。


    Arduino Micro 使用与 Leonardo 相同的微控制器，但缩小到了更紧凑的板上。第三方板如 LeoStick 和 Adafruit Trinket
    提供了 Micro 的替代方案。


    像 Micro 这样的小板的缺点是，由于它们比 Uno 小得多，因此无法接受 Uno 尺寸的扩展板。


    ## Yun


    Arduino Yun（图 1-7）本质上是一个 Arduino Leonardo 结合了一个运行 Linux 的微型 WiFi 模块。该设备适用于需要连接的
    Arduino 应用。Yun 的 Arduino 和 Linux 部分通过称为“桥接”（bridge）的软件连接。Yun 可以像往常一样使用 Arduino
    IDE 进行编程，但一旦 Yun 加入你的本地网络，你也可以从 Arduino IDE 无线进行编程。


    ![image](img/fig-ch1-7.jpg)


    图 1.7 *Arduino Yun*。


    ## Lilypad


    Lilypad（图 1-8）是一种微小、纤薄的 Arduino 板，可以缝合在衣物中，用于已被称为可穿戴计算的应用。


    ![image](img/fig-ch1-8.jpg)


    图 1.8 *Arduino Lilypad*。


    Lilypad 没有 USB 接口，你必须使用单独的适配器对其进行编程。它的设计非常精美。


    Adafruit 还销售一种名为 Flora 的板子，其概念与 Lilypad 类似。


    ## 其他“官方”板类


    之前描述的 Arduino 板是最实用且最流行的。然而，Arduino 板的范围在不断变化，因此要获取 Arduino 家族完整且最新的视图，请参阅 Arduino
    官方网站的列表：[www.arduino.cc/en/Main/Hardware](http://www.arduino.cc/en/Main/Hardware)。


    ***


    ## Arduino 克隆版与变体


    非官方板子分为两类。有些只是直接采用 Arduino 的标准开源硬件设计并制造一个更廉价的版本。你可以搜索以下此类性质的板子名称：


    - Sparkfun RedBoard

    - Adafruit Metro

    - Olimexino


    更有趣的是，一些 Arduino 兼容设计旨在以某种方式扩展或改进 Arduino。新的变体层出不穷，数量多到无法一列尽举。然而，以下是一些更有趣且更流行的变体：


    - Node MCU 板，基于 `ESP8266` WiFi 单芯片系统。这为需要 Arduino 连接 WiFi 的项目提供了一个非常低成本的解决方案。更多信息请参阅第
    10 章。

    - Adafruit Trinket，一个非常小的 Arduino。

    - Freetronics EtherTen，一个内置以太网的 Arduino。

    - Particle Photon，一个带有 WiFi 的低成本板子。它通过互联网使用 Arduino C 进行编程，但使用的是基于 Web 的 IDE 而不是
    Arduino IDE。


    ***


    ## 结论


    现在你已经稍微探索了 Arduino 硬件，是时候设置你的 Arduino 软件了。


    ## 2


    ## 入门


    在介绍了 Arduino 并稍微了解了我们正在编写的内容后，是时候学习如何在计算机上安装我们所需的软件，并开始编写代码了。


    ***


    ### 通电


    当你购买 Arduino 板子时，它通常预装了一个示例 Blink（闪烁）程序，该程序会让微小的内置发光二极管（LED）闪烁。


    标记为 `L` 的 LED 连接到板子上的一个数字输入输出插座上。它连接到数字引脚 `13`。这并不意味着引脚 13 只能用于点亮 LED；你也可以将其作为普通的数字输入或输出。


    要让你的 Arduino 运行起来，你只需要为它提供电源。最简单的方法是通过 USB 线将其连接到电脑。你应该看到 Arduino 上的绿色“On”LED
    点亮。Arduino 板子可能已经在闪烁了，因为板子通常出厂自带 Blink 程序。但让我们重新安装一次并修改它。


    ***


    ### 安装软件


    为了能够将新的程序安装到你的 Arduino 板上，仅通过 USB 供电是不够的。图 2-1


    在上传程序之前，你必须告诉 Arduino 应用你使用的是哪种板子以及连接到了哪个串口。图 2-3 和 2-4 显示了如何从 `Tools` 菜单操作。


    在 Windows、Linux 和 Mac 上安装此软件的完整说明可以在 Arduino 网站（[www.arduino.cc](http://www.arduino.cc））找到。


    ### 上传你的第一个程序


    LED 相当于其他语言中的“Hello World”程序，这是学习新语言时传统的第一个运行程序。让我们通过将此程序安装到 Arduino 板上来测试环境。


    当你在电脑上启动 Arduino 应用时，它会打开一个空程序。幸运的是，应用程序自带了大量的示例。因此，从 `File` 菜单打开 `Blink` 示例，如图
    2-2 所示。在 Windows 机器，串口始终是 `COM` 后跟一个数字。在 Mac 和 Linux 机器，你会看到长长的串口设备列表。该设备通常是列表中的最后一个选项，名称类似于
    `/dev/cu.usbmodem621`。

