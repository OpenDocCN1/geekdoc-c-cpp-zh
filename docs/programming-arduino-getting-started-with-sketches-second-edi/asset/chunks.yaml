    \ **return** statement in it. If you do not put one in, the compiler will tell\
    \ you that it is missing. You can have more than one **return** in the same function.\
    \ This might arise if you have an **if** statement with alternative actions based\
    \ on some condition. Some programmers frown on this, but if your functions are\
    \ small (as all functions should be), then this practice will not be a problem.\n\
    \nThe value after **return** can be an expression; it does not have to just be\
    \ the name of a variable. So you could compress the preceding example into the\
    \ following:\n\n```\nint centToFaren(int c)\n{\n  return (c * 9 / 5 + 32);\n}\n\
    ```\n\nIf the expression being returned is more than just a variable name, then\
    \ it should be enclosed in parentheses as in the preceding example.\n\n* * *\n\
    \n### Other Variable Types\n\nAll our examples of variables so far have been **int**\
    \ variables. This is by far the most commonly used variable type, but there are\
    \ some others that you should be aware of.\n\n#### floats\n\nOne such type, which\
    \ is relevant to the previous temperature conversion example, is **float**. This\
    \ variable type represents floating point numbers—that is, numbers that may have\
    \ a decimal point in them, such as 1.23\\. You need this variable type when whole\
    \ numbers are just not precise enough.\n\nNote the following formula:\n\n```\n\
    f = c * 9 / 5 + 32\n```\n\nIf you give **c** the value 17, then **f** will be\
    \ 17 * 9 / 5 + 32 or 62.6\\. But if **f** is an **int**, then the value will be\
    \ truncated to 62.\n\nThe problem becomes even worse if we are not careful of\
    \ the order in which we evaluate things. For instance, suppose that we did the\
    \ division first, as follows:\n\n```\nf = (c / 5) * 9 + 32\n```\n\nThen in normal\
    \ math terms, the result would still be 62.6, but if all the numbers are **int**s,\
    \ then the calculation would proceed as follows:\n\n1.  17 is divided by 5, which\
    \ gives 3.4, which is then truncated to 3.\n\n2.  3 is then multiplied by 9 and\
    \ 32 is added to give a result of 59—which is quite a long way from 62.6.\n\n\
    For circumstances like this, we can use **float**s. In the following example,\
    \ our temperature conversion function is rewritten to use **float**s:\n\n```\n\
    float centToFaren(float c)\n{\n  float f = c * 9.0 / 5.0 + 32.0;\n  return f;\n\
    }\n```\n\nNotice how we have added `.0` to the end of our constants. This ensures\
    \ that the compiler knows to treat them as **float**s rather than **int**s.\n\n\
    #### boolean\n\nBoolean values are logical. They have a value that is either true\
    \ or false.\n\nIn the C language, *Boolean* is spelled with a lowercase *b,* but\
    \ in general use, *Boolean* has an uppercase initial letter, as it is named after\
    \ the mathematician George Boole, who invented the Boolean logic that is crucial\
    \ to computer science.\n\nYou may not realize it, but you have already met Boolean\
    \ values when we were looking at the **if** command. The condition in an **if**\
    \ statement, such as **(count == 20)**, is actually an expression that yields\
    \ a **boolean** result. The operator **==** is called a comparison operator. Whereas\
    \ **+** is an arithmetic operator that adds two numbers together, **==** is a\
    \ comparison operator that compares two numbers and returns a value of either\
    \ true or false.\n\nYou can define Boolean variables and use them as follows:\n\
    \n```\nboolean tooBig = (x > 10);\nif (tooBig)\n{\n  x = 5;\n}\n```\n\nBoolean\
    \ values can be manipulated using Boolean operators. So, similar to how you can\
    \ perform arithmetic on numbers, you can also perform operations on Boolean values.\
    \ The most commonly used Boolean operators are **and**, which is written as **&&**,\
    \ and **or**, which is written as **||**.\n\n[Figure 4-1](#13_Chapter_04.xhtml_fig-ch4-1)\
    \ shows truth tables for the **and** and **or** operators."
