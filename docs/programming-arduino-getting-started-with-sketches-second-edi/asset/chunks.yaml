    \ bounce. So a single button press becomes a series of presses that eventually\
    \ stabilize.\n\n![image](images/fig-ch6-8.jpg)\n\nFigure 6.8 *Oscilloscope trace\
    \ of a button press*.\n\nAll this happens very quickly; the total time span of\
    \ the button press on the oscilloscope trace is only 200 milliseconds. This is\
