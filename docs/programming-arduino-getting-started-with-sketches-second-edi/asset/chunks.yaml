  trans: "\n\n♦ 要发送的数据的字节。\n\n## 中断\n\n让进行“大型编程”（programming in the large）的程序员往往感到沮丧的原因之一，是\
    \ Arduino 一次只能执行一件事。如果你希望程序中有许多执行线程同时运行，那么你就没走运了。尽管有人开发了可以以这种方式执行多个线程的项目，但通常对于\
    \ Arduino 的常规用途来说，这种能力并不是必要的。Arduino 最接近这种执行方式的方法就是使用中断。\n\nArduino Uno 两个引脚（`D2`\
    \ 和 `D3`）可以连接中断。这意味着这些引脚作为输入使用，如果引脚以特定方式接收到信号，Arduino 处理器将停止正在执行的任务，并运行与该中断关联的函数。\n\
    \nSketch 7-04 闪烁 LED，但在接收到中断时会改变闪烁周期。你可以通过将线连接在引脚 `D2` 和 `GND` 之间模拟中断，并使用内部上拉电阻使中断大部分时间内保持高电。\n\
    \n```\n//sketch 7-04\n\nconst int interruptPin = 2;\nconst int ledPin = 13;\n\
    int period = 500;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n  pinMode(interruptPin,\
    \ INPUT_PULLUP);\n  attachInterrupt(0, goFast, FALLING);\n}\n\nvoid loop() \n\
    {\n  digitalWrite(ledPin, HIGH);\n  delay(period);\n  digitalWrite(ledPin, LOW);\n\
    \  delay(period);  \n}\n\nvoid goFast()\n{\n  period = 100;\n}\n```\n\n以下是此 sketch\
    \ `setup` 函数中的关键行：\n\n```\nattachInterrupt(0, goFast, FALLING);\n```\n\n第一个参数指定了你想使用的两个中断中的哪一个。令人困惑的是，这里的\
    \ `0` 表示你正在使用引脚 `2`，而 `1` 表示你正在使用引脚 `3`。\n\n下一个参数是发生中断时要调用的函数名称，最后一个参数是一个常量，可以是\
    \ `CHANGE`、`RISING` 或 `FALLING` 之一。图 7-4 总结了这些选项。\n\n![image](img/fig-ch7-4.jpg)\n\
    \n图 7.4 *中断信号类型*。\n\n如果中断模式为 `CHANGE`，那么从 `0` 到 `1` 的 `RISING`（上升）或从 `1` 到 `0`\
    \ 的 `FALLING`（下降）都会触发中断。\n\n你可以使用函数 `noInterrupts` 禁止中断。这将停止两个中断通道的所有中断。你可以通过调用函数\
    \ `interrupts` 恢复中断。\n\n不同的 Arduino 开发板对不同的引脚有不同的中断名称，如果你使用的不是 Arduino Uno，请在\
    \ [`www.arduino.cc`](http://www.arduino.cc) 查看你板的文档。\n\n## 结论\n\n在本章中，你查看了 Arduino\
    \ 标准库提供的一些方便功能。这些功能将为你节省一些编程工作，如果说一个优秀的程序员喜欢的一件事，那就是能够使用他人完成的高工作。\n\n在下一章中，我们将扩展在\
    \ 第 5 章 中中学关于数据结构的知识，并查看在掉电后如何在 Arduino 上保存数据。\n\n## 8 数据存储\n\n当你给变量赋值时，Arduino\
    \ 开发板只有在电源通电时才会记住这些值。一旦你关闭电源或重置开发板，所有数据都会丢失。\n\n在本章中，我们将研究一些保留这些数据的方法。\n\n## 常量\n\
    \n如果你想要存储的数据不会改变，那么只需要在每次 Arduino 启动时设置数据即可。这种方法的一个例子是第 5 章 Morse 斯密码翻译器（sketch\
    \ 5-05）中的 `letters` 数组。\n\n你使用了以下代码定义了一个正确大小的变量，并填充了你需要的数据：\n\n```\nchar* letters[]\
    \ = {\n  \".-\", \"-...\", \"-.-.\", \"-..\", \".\", \n     \"..-.\", \"--.\"\
    , \"....\", \"..\",    // A-I\n  \".---\", \"-.-\", \".-..\", \"--\", \"-.\",\
    \ \n     \"---\", \".--.\", \"--.-\", \".-.\",  // J-R\n  \"...\", \"-\", \"..-\"\
    , \"...-\", \".--\", \n     \"-..-\", \"-.--\", \"--..\"          // S-Z\n};\n\
    ```\n\n你可能记得你进行过计算并决定你那少量的 2K 内存绰绰剩余。然而，如果内存有点紧张，那么将这些数据存储在用于存储程序的 32K flash 内存中会比存储在\
    \ 2K RAM 中好得多。有一种方法可以做到。这是一个名为 `PROGMEM;` 的指令，它位于库，用起来有点麻烦。\n\n## 在 Flash 内存中存储数据\n\
    \n要将数据存储在 flash 内存中，你必须如下包含 `PROGMEM` 库：\n\n```\n#include <avr/pgmspace.h>\n```\n\
    \n此命令的目的是告诉编译器在此 sketch 使用 `pgmspace` 库。\n\n`PROGMEM` 关键字表示该数据结构将存储在 flash 中。你只能这样存储常量；一旦存储在\
    \ flash 中，数据结构就无法更改，因此使用了 `const`。数组的大小也必须完全指定为 26 个字母，由 `maxLen`（减去 1）个点和划组成。\n\
    \n包含字母的结构现在看起来如下：\n\n```\nPROGMEM const letters[26][maxLen] = {\n  \".-\", \"\
    -...\", \"-.-.\", \"-..\", \".\", \n     \"..-.\", \"--.\", \"....\", \"..\",\
    \    // A-I\n  \".---\", \"-.-\", \".-..\", \"--\", \"-.\", \n     \"---\", \"\
    .--.\", \"--.-\", \".-.\",  // J-R\n  \"...\", \"-\", \"..-\", \"...-\", \".--\"\
    , \n     \"-..-\", \"-.--\", \"--..\"          // S-Z\n};\n```\n\n`loop` 函数也与\
    \ sketch 5-05 有有不同。\n\n```cpp\nvoid loop()                    \n{\n  char ch;\n\
    \  char sequence[maxLen];\n  if (Serial.available() > 0)\n  {\n    ch = Serial.read();\n\
    \    if (ch >= 'a' && ch <= 'z')\n    {\n      memcpy_P(&sequence, letters[ch\
    \ - 'a'], maxLen);\n      flashSequence(sequence);\n    }\n    else if (ch >=\
    \ 'A' && ch <= 'Z')\n    {\n      memcpy_P(&sequence, letters[ch - 'A'], maxLen);\n\
    \      flashSequence(sequence);\n    }\n    else if (ch >= '0' && ch <= '9')\n\
    \    {\n      memcpy_P(&sequence, numbers[ch - '0'], maxLen);\n      flashSequence(sequence);\n\
    \    }\n    else if (ch == ' ')\n    {\n      delay(dotDelay * 4);  // 单词间隙  \n\
    \    }\n  }\n}\n```\n\n"
- fmt: "\nI have not listed sketch 8-01 here, as it is a little lengthy, but you may\
    \ wish to load it and verify that it works the same way as the RAM-based version.\n\
    \nIn addition to creating the data in a special way, you also have to read the\
    \ data back a special way. Your code to get the code string for a Morse letter\
    \ from the array has to be modified to look like this:\n\n```\nstrcpy_P(buffer,\
    \ (char*)pgm_read_word(&(letters[ch - 'a'])));\n```\n\nThis uses a `buffer` variable\
    \ into which the `PROGMEM` string is copied, so that it can be used as a regular\
    \ `char` array. This needs to be defined as a global variable as follows:\n\n\
    ```\nchar buffer[6];\n```\n\nThis approach works only if the data is constant—that\
    \ is, you are not going to change it while the sketch is running. In the next\
    \ section, you will learn about using the `EEPROM` memory that is intended for\
    \ storing persistent data that can be changed.\n\nIf you have individual strings\
    \ that are perhaps formatted for messages to be displayed on the serial monitor,\
    \ then Arduino C provides a handy shortcut. You can just enclose the string in\
    \ `F()` as shown in the example below:\n\n```\nSerial.println(F(\"Hello World\"\
    ));\n```\n\nThe string will then be stored in flash memory, rather than use up\
    \ RAM.\n\n***\n\n### EEPROM\n\nThe `ATMega328` at the heart of an Arduino Uno\
    \ has a kilobyte of electrically erasable read-only memory (`EEPROM`). `EEPROM`\
    \ is designed to remember its contents for many years. Despite its name, it is\
    \ not really read-only. You can write to it.\n\nThe official Arduino commands\
    \ for reading and writing to `EEPROM` are just as awkward to use as the ones for\
    \ using `PROGMEM`. You have to read and write to and from `EEPROM` one byte at\
    \ a time.\n\nThe example of sketch 8-02 allows you to enter a single-digit letter\
    \ code from the Serial Monitor. The sketch then remembers the digit and repeatedly\
    \ writes it out on the Serial Monitor.\n\n```\n// sketch 8-02\n#include <EEPROM.h>\n\
    \nint addr = 0;\nchar ch;\n\nvoid setup()\n{\n  Serial.begin(9600);\n  ch = EEPROM.read(addr);\n\
    }\n\nvoid loop()\n{\n  if (Serial.available() > 0)\n  {\n    ch = Serial.read();\n\
    \    EEPROM.write(0, ch);\n    Serial.println(ch);\n  }\n  Serial.println(ch);\n\
    \  delay(1000);\n}\n```\n\nTo try this sketch, open the Serial Monitor and enter\
    \ a new character. Then unplug the Arduino and plug it back in. When you reopen\
    \ the Serial Monitor, you will see that the letter has been remembered.\n\nThe\
    \ function `EEPROM.write` takes two arguments. The first is the address, which\
    \ is the memory location in `EEPROM` and should be between 0 and 1023. The second\
    \ argument is the data to write at that location. This must be a single byte.\
    \ A character is represented as eight bits, so this is fine, but you cannot directly\
    \ store a 16-bit `int`.\n\n#### Storing an `int` in EEPROM\n\nTo store a two-byte\
    \ `int` in locations 0 and 1 of the `EEPROM`, you could do this:\n\n```\n int\
    \ x = 1234; \n  EEPROM.write(0, highByte(x));\n  EEPROM.write(1, lowByte(x));\n\
    ```\n\nThe functions `highByte` and `lowByte` are useful for separating an `int`\
    \ into two bytes. [Figure 8-1](#17_Chapter_08.xhtml_fig-ch8-1) shows how this\
    \ `int` is actually stored in the `EEPROM`.\n\n![image](images/fig-ch8-1.jpg)\n\
    \nFigure 8.1. *Storing a 16-bit integer in EEPROM*.\n\nTo read the `int` back\
    \ out of `EEPROM`, you need to read the two bytes from the `EEPROM` and reconstruct\
    \ the `int`, as follows:\n\n```\nbyte high = EEPROM.read(0);\nbyte low = EEPROM.read(1);\n\
    int x = (high << 8) + low;\n```\n\nThe `<<` operator is a bit shift operator that\
    \ moves the eight high bytes to the top of the `int` and then adds in the low\
    \ byte.\n\n#### Using the AVR EEPROM Library\n\nThe official Arduino way of using\
    \ `EEPROM` is just fine if you are only using single bytes. However, as you saw\
    \ with `ints`, this becomes more complicated for larger data types. It’s even\
    \ worse for floats (4 bytes). Fortunately, there is an alternative method that\
    \ uses one of the libraries that Arduino itself uses called the `AVR EEPROM` library.\
    \ This allows you to read and write as much data as will fit into your `EEPROM`\
    \ with single commands.\n\nThe example of sketch 8-03 uses this library to write\
    \ and then read an `int`.\n\n```\n// sketch 08-03\n\n#include <avr/eeprom.h>\n\
    \nvoid setup() \n{\n  Serial.begin(9600);\n  int i1 = 123;\n  eeprom_write_block(&i1,\
    \ 0, 2);\n  int i2 = 0;\n  eeprom_read_block(&i2, 0, 2);\n  Serial.println(i2);\n\
    }\n\nvoid loop() \n{\n}\n```\n\nThe library is actually included in the Arduino\
    \ IDE, so the `eeprom_write_block` and `eeprom_read_block` functions allow you\
    \ to read and write data efficiently.\n\n#### Storing a float in EEPROM\n\nThe\
