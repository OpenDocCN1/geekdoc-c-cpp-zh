  trans: "\n本地变量 `timesToFlash` 仅在函数运行时存在。一旦函数执行完最后一条命令，它就会消失。这意味着局部变量在定义它的函数内部之外，在程序的任何其他地方都是无法访问的。\n\
    \n例如，下面的示例会导致错误：\n\n```cpp\nvoid indicate(int x)\n{\n  int timesToFlash = x *\
    \ 2;\n  flash(timesToFlash, 10);\n}\ntimesToFlash = 15;\n```\n\n经验程序员通常对全局变量持怀疑态度。这是因为它们违背了封装原则。封装（encapsulation）的思想是：你应该将与特定功能相关的所有内容封装在一个包中。因此，函数是封装的极佳工具。“全局变量”（全局变量通常被称为\
    \ globals）的问题在于，它们通常定义在 sketch（程序）的开头，然后在整个 sketch 中到处使用。有时，这样做有完全合理的理由。但在其他情况下，人们在更适合传递参数的情况下以一种懒惰的方式使用它们。在我们目前为止的示例中，`ledPin`\
    \ 是全局变量的一个良好用法。它非常方便且容易在 sketch 顶部找到，便于修改。\n\n局部变量的另一个特性是，它的值在每次函数运行时都会被初始化。这在\
    \ Arduino sketch 的 `loop` 函数中体现得最为明显（且往往不方便）。让我们尝试在上一章的示例之一中用局部变量代替全局变量：\n\n```cpp\n\
    // sketch 4-03\nconst int ledPin = 13;\nconst int delayPeriod = 250;\nvoid setup()\n\
    {\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n int count = 0;\n digitalWrite(ledPin,\
    \ HIGH);\n delay(delayPeriod);\n digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n\
    \ count ++;\n if (count == 20)\n {\n   count = 0;\n   delay(3000);\n }\n}\n```\n\
    \nSketch 4-03 基于 sketch 3-09，但它尝试使用局部变量而不是全局变量来计数闪烁的次数。\n\n这个 sketch 是损坏的。它无法工作，因为每次运行\
    \ `loop` 时，变量 `count` 都会再次被赋予值 0，所以 `count` 永远不会到达 20，LED 将会一直闪烁下去。我们之所以将 `count`\
    \ 设为全局变量，就是为了让它的值不被重置。我们使用 `count` 的唯一地方是在 `loop` 函数中，所以它应该放在那里。\n\n幸运的是，C 语言中有一种机制可以解决这个困境。它就是关键字\
    \ `static`。当你在函数的变量声明前使用 `static` 关键字时，它的效果是仅在函数第一次运行时初始化该变量。完美！这正是这种情况下所需要的。我们可以将变量保留在它使用的函数中，而不会在每次函数运行时都被重置为\
    \ 0。Sketch 4-04 展示了这一操作：\n\n```cpp\n// sketch 4-04\nconst int ledPin = 13;\nconst\
    \ int delayPeriod = 250;\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid\
    \ loop()\n{\n static int count = 0;\n digitalWrite(ledPin, HIGH);\n delay(delayPeriod);\n\
    \ digitalWrite(ledPin, LOW);\n delay(delayPeriod);\n count ++;\n if (count ==\
    \ 20)\n {\n   count = 0;\n   delay(3000);\n }\n}\n```\n\n***\n\n### 返回值\n\n计算机科学作为一门学科，其祖源是数学和工程学。这种遗产保留在许多与编程相关的名称中。`function`（函数）本身就是一个数学术语。在数学中，函数的输入（参数）完全决定了输出。我们写过接受输入的函数，但还没有写过任何返回值的函数。我们所有的函数都是“void”函数。如果一个函数返回一个值，你就可以指定一个返回类型。\n\
    \n让我们来看编写一个函数，它接收摄氏度温度并返回等值的华氏度：\n\n```cpp\nint centToFaren(int c)\n{\n  int f\
    \ = c * 9 / 5 + 32;\n  return f;\n}\n```\n\n现在的函数定义以 `int` 而不是 `void` 开头，表示该函数将向调用它的任何地方返回一个\
    \ `int`。代码可能像这样：\n\n```cpp\nint pleasantTemp = centToFaren(20);\n```\n\n任何非 void\
    \ 函数都必须内部包含一个 `return` 语句。如果你不写，编译器会提示你缺失它。你可以在同一个函数中使用多个 `return`。这在你有一个根据某些条件执行替代操作的\
    \ `if` 语句时可能会出现。有些程序员对此持反对意见，但如果你的函数很小（所有函数都应该是小的），那么这种做法就没问题。\n\n`return` 之后的值可以是一个表达式；它不必只是变量名。所以你可以将先前的示例压缩为如下：\n\
    \n```cpp\nint centToFaren(int c)\n{\n  return (c * 9 / 5 + 32);\n}\n```\n\n***\n\
