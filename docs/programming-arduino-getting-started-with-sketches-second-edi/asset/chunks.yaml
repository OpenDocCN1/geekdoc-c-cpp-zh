    ## 引言


    Arduino 接口板为创建基于微控制器的项目提供了一种低成本、易于使用的技术。通过一点电子知识，你就可以让你的 Arduino 做任何事情，从控制艺术装置中的灯光到管理太阳能系统的电源。


    有很多基于项目的书籍可以教你如何将事物连接到 Arduino，包括本书作者编写的《邪恶天才的 30 个 Arduino 项目》（30 Arduino Projects
