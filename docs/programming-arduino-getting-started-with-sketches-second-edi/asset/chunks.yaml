    ### The Origins of Arduino


    Arduino was originally developed as an aid for teaching students. It was subsequently
    (in 2005) developed commercially by Massimo Banzi and David Cuartielles. It has
    since gone on to become enormously successful with makers, students, and artists
    for its ease of use and durability.


    Another key factor in its success is that all the designs for Arduino are freely
    available under a Creative Commons license. This has allowed many lower-cost alternatives
    to the boards to appear. Only the name Arduino is protected, so such clones often
    have “*duino” names, such as Boarduino, Seeeduino, and Freeduino. In 2014 there
    was a falling out between the original Arduino team and their principal manufacturer.
    One result of this split is that you will now find that outside of the USA, the
    Arduino Uno is known as the Genuino Uno. Many big retailers sell only the official
    boards, which are nicely packaged and of high quality.


    Yet another reason for the success of Arduino is that it is not limited to microcontroller
    boards. There are a huge number of Arduino-compatible shield boards that plug
    directly into the top of an Arduino board. Because shields are available for almost
    every conceivable application, you often can avoid using a soldering iron and
    instead plug together shields that can be stacked one upon another. The following
    are just a few of the most popular shields:


    ♦ Ethernet, which gives an Arduino Web-serving capabilities


    ♦ Motor, which drives electric motors


    ♦ USB Host, which allows control of USB devices


    ♦ Relays, which switches relays from your Arduino


    [Figure 1-3](#10_Chapter_01.xhtml_fig-ch1-3) shows a motor shield (left) and relay
    shield (right).


