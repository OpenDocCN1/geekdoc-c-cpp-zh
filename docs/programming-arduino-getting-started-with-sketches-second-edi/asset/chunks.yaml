    \ and LCD sketches in earlier chapters.\n\nThere are many good books on the topics\
    \ of C++ and object-oriented programming. Look for the higher-rated books on the\
    \ topic in your favorite online bookstore.\n\n#### Classes and Methods\n\nObject\
    \ orientation uses a concept called *classes* to aid encapsulation. Generally,\
    \ a class is like a section of a program that includes both variables—called *member\
    \ variables*—and *methods*, which are like functions but apply to the class. These\
    \ functions can either be *public*, in which case the methods and functions may\
    \ be used by other classes, or *private*, in which case the methods can be called\
    \ only by other methods within the same class.\n\nWhereas an Arduino sketch is\
