    \ at all.\n\nSometimes bouncing does not matter. For instance, sketch 6-04 will\
    \ light the LED while the button is pressed. In reality, you would not use an\
    \ Arduino to do this; we are firmly in the realms of theory rather than practice\
    \ here.\n\n```\n//sketch 6-04\n\nconst int inputPin = 5;\nconst int ledPin = 13;\n\
    \nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n  pinMode(inputPin, INPUT_PULLUP);\n\
    }\n\nvoid loop()\n{\n  int switchOpen = digitalRead(inputPin);\n  digitalWrite(ledPin,\
    \ ! switchOpen);\n}\n```\n\nLooking at the **loop** function of sketch 6-04, the\
    \ function reads the digital input and assigns its value to a variable **switchOpen**.\
    \ This is a 0 if the button is pressed and a 1 if it isn’t (remember that the\
    \ pin is pulled up to 1 when the button is not pressed).\n\nWhen you program **digitalWrite**\
    \ to turn the LED on or off, you need to reverse this value. You do this using\
    \ the **!** or **not** operator.\n\nIf you upload this sketch and connect your\
