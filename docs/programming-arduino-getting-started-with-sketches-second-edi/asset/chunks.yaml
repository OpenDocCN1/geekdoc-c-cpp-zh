    \n![image](images/fig-ch5-1.jpg)\n\nFigure 5.1 *The Serial Monitor showing the\
    \ output*\n\n### String Arrays\n\nIn the programming world, the word *string*\
    \ has nothing to do with long thin stuff that you tie knots in. A string is a\
