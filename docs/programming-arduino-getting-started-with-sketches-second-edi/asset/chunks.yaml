  trans: "\n当计算机从串口监视器（Serial Monitor）向 Arduino 板板发送数据时，USB 会将 USB 信号电平和协议转换为 Arduino\
    \ 板板上的微控制器可以使用的格式。这种转换在 Arduino 板板上的一个专用芯片上完成。随后，数据由微控制器中一个称为通用异步收发传输器（UART）的部分接收。UART\
    \ 将接收到的数据放入一个缓冲区中。缓冲区是一个特殊的内存区域（128 字节），可以存储数据，并在读取后立即移除。\n\n这种通信的发生与你的程序（sketch）正在做什么无关。因此，即使你可能正在欢快地闪烁\
    \ LED，数据仍然会到达缓冲区并留在那里，直到你准备好读取它为止。你可以将缓冲区比作电子邮箱收件箱。\n\n检查是否有“新邮件”的方法是使用 `Serial.available()`\
    \ 函数。该函数返回缓冲区中等待你读取的字节字节数。如果没有等待读取的消息，则该函数返回 0。这为什么为什么 `if` 语句会检查可读的字节数是否大于 0，如果是，该语句执行的第一件事就是使用\
    \ `Serial.read()` 函数读取下一个可用的 `char`。该函数的结果被赋值给局部变量 `ch`。\n\n接下来是另一个 `if`，用于决定你想闪烁什么种的内容：\n\
    \n```\n if (ch >= 'a' && ch <= 'z')\n    {\n      flashSequence(letters[ch - 'a']);\n\
    \    }\n```\n\n起初，这看起来有点奇怪。你正在使用 `<=` 和 `>=` 来比较字符。你可以这样做是因为每个字符实际上都是由一个数字（其 ASCII\
    \ 码）表示的。因此，如果字符的代码在 `a` 和 `z`（97 和 122）之间，你就知道来自计算机的字符是一个小写字母。然后你调用一个你尚未编写的名为\
    \ `flashSequence` 的函数，并向其传递一个由点和横线组成的字符串；例如，为了闪烁 `a`，你会将 `.-` 作为参数传递给它。\n\n你将实际闪烁的责任交给了这个函数。你没有尝试在\
    \ `loop` 内部完成它。这让我们保持代码的易读。\n\n以下是确定需要发送给 `flashSequence` 函数的横线和点字符串的 C 代码：\n\n\
    ```\nletters[ch - 'a']\n```\n\n再次，这看起来有点奇怪。该函数似乎是从一个字符中减去另一个字符。这实际上是一个完全合理的操作，因为该函数实际上是在减去\
    \ ASCII 值。\n\n记住你将字母的代码存储在一个数组中。因此，数组的第一个元素包含字母 `A` 的横线和点字符串，第二个元素包含字母 `B` 的点和横线，以此此类推。因此，你需要为刚刚从缓冲区获取的字母在数组中找到正确的位置。任何小写字母的位置将该字母的代码减去字母\
    \ `a` 的代码。例如，`a` - `a` 实际上是 97 - 97 = 0。同样，`c` - `a` 实际上是 99 - 97 = 2。因此，在以下语句中，如果\
    \ `ch` 是字母 `c`，方括号内部的值将求值为 2，你将获得数组的元素 2，即 -.-:\n\n这一部分刚刚描述的是关于小写字母。你还必须处理大写字母和数字。这些者都以类似的方式进行处理。\n\
    \n### flashSequence 函数\n\n我们假设了一个名为 `flashSequence` 的函数并使用了它，但现在你需要编写它。我们计划让它接收一个包含一系列点和横线的字符串，并按照正确的计时完成必要的闪烁。\n\
    \n思考执行此操作的算法时，你可以将其拆分为以下步骤：\n\n- 对于点和横线字符串中的每个元素（例如 `.-.-`）：\n- 闪烁该点或横线。\n\n使用意图编程的概念，让我们保持函数那么简单。\n\
    \n所有字母的摩斯电码长度并不相同，因此你需要循环遍历字符串直到遇到结束标记 `\\0`。你还需要一个名为 `i` 的计数器变量，它从 0 开始，并在处理每个点和横线时递增：\n\
    \n```cpp\nvoid flashSequence(char* sequence)\n{\n   int i = 0;\n   while (sequence[i]\
    \ != '\\0')\n   {\n       flashDotOrDash(sequence[i]);\n       i++;\n   }\n  \
    \ delay(dotDelay * 3);    // 字母间隔\n}\n```\n\n再次，你将闪烁单个点或横线的实际工作委托给名为 `flashDotOrDash`\
    \ 的新方法，该方法实际上控制 LED 的开启和关闭。最后，当程序闪烁完点和横线后，它需要暂停相当于三个点的延迟时间。注意这里对注释的有用使用。\n\n###\
    \ flashDotOrDash 函数\n\n你函数链中的最后一个函数是实际执行 LED 开启和关闭工作的函数。作为参数，该函数接收单个字符，可以是点（`.`）或横线（`–`）。\n\
    \n该函数只需要：如果是点，则开启 LED 并等待点的持续时间；如果是横线，则等待三倍点的持续时间，然后关闭 LED。\n\n### 整合在一起\n\n将所有这些整合在一起，完整的列表位于\
    \ sketch 5-05。将其上传到你的 Arduino 板板并进行尝试。你应该看到文本以摩斯电码的形式闪烁。\n\n```cpp\n// sketch\
    \ 5-05\nconst int dotDelay = 200;\nconst int ledPin = 13;\n\nvoid setup()    \
    \             \n{\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n}\n\nvoid\
    \ loop()                    \n{\n  char ch;\n  if (Serial.available() > 0)   \
    \  \n  {\n    ch = Serial.read();        \n    if (ch >= 'a' && ch <= 'z')\n \
    \   {\n      flashSequence(letters[ch - 'a']);\n    }\n    else if (ch >= 'A'\
    \ && ch <= 'Z')\n    {\n      flashSequence(letters[ch - 'A']);\n    }\n    else\
    \ if (ch >= '0' && ch <= '9')\n    {\n      flashSequence(numbers[ch - '0']);\n\
    \    }\n    else if (ch == ' ')\n    {\n     delay(dotDelay * 4);      // 单词间隔\n\
    \    }\n  }\n}\n\nchar* letters[] = {\n  \".-\", \"-...\", \"-.-\", \"-..\", \"\
    .\", \"....-\", \"--.\", \"---\", \"--..\", \".\", // A-I\n  \"..-\", \"-..\"\
    , \".-.-\", \"-.-\", \"-\", \"...--\", \"--...\", \".-.\", \"-.\", // J-R\n  \"\
    ---...\", \"--..\", \".-.\", \"-.-\", \"-..\", \".--\", \"--.--\"          //\
    \ S-Z\n};\n\nchar* numbers[] = {\"-----\", \".----\", \"..---\", \"...--\", \"\
    ....-\", \".....\"}; // 0-5 partial\n\nvoid flashSequence(char* sequence)\n{\n\
    \   int i = 0;\n   while (sequence[i] != '\\0')\n   {\n       flashDotOrDash(sequence[i]);\n\
    \       i++;\n   }\n   delay(dotDelay * 3);    // 字母间隔\n}\n\nvoid flashDotOrDash(char\
    \ dotOrDash)\n{\n  digitalWrite(ledPin, HIGH);\n  if (dotOrDash == '.')\n  {\n\
    \    delay(dotDelay);           \n  }\n  else // 必须是 -\n  {\n    delay(dotDelay\
    \ * 3);           \n  }\n  digitalWrite(ledPin, LOW);    \n  delay(dotDelay);\
    \ // 闪烁间隔\n}\n```\n\n这个程序包含一个 `loop` 函数，它会自动并反复调用你编写的 `flashSequence` 函数，该函数本身又反复调用你编写的\
    \ `flashDotOrDash` 函数，而后者调用了 Arduino 提供的 `digitalWrite` 和 `delay` 函数！\n"
- fmt: "\nThis is how your sketches should look. Breaking things up into functions\
    \ makes it much easier to get your code working and makes it easier when you return\
    \ to it after a period of not using it.\n\n***\n\n### Conclusion\n\nIn addition\
    \ to looking at strings and arrays in this chapter, you have also built this more\
    \ complex `Morse-translator` that I hope will also reinforce the importance of\
    \ building your code with functions.\n\nIn the next chapter, you learn about input\
    \ and output, by which we mean input and output of analog and digital signals\
    \ from the Arduino.\n\n## 6. Input and Output\n\nThe Arduino is about physical\
    \ computing, and that means attaching electronics to the Arduino board. So you\
    \ need to understand how to use the various options for your connection pins.\n\
    \nOutputs can be digital, which just means switched between being at 0V or at\
    \ 5V, or analog, which allows you to set the voltage to any voltage between 0V\
    \ and 5V—although it’s not quite as simple as that, as we shall see.\n\nLikewise,\
    \ inputs can either be digital (for example, determining whether a button is pressed\
    \ or not) or analog (such as from a light sensor).\n\nIn a book that is essentially\
    \ about software rather than hardware, we are going to try and avoid being dragged\
    \ into too much discussion of electronics. However, it will help you to understand\
    \ what is happening in this chapter if you can find yourself a multimeter and\
    \ a short length of solid core wire.\n\nIf you are interested in learning more\
    \ about electronics, then you might like to look at my book *Hacking Electronics*\
    \ (TAB/McGraw-Hill, 2013).\n\n***\n\n### Digital Outputs\n\nIn earlier chapters,\
    \ you have made use of the LED attached to digital pin 13 of the Arduino board.\
    \ For example, in [Chapter 5](#14_Chapter_05.xhtml), you used it as a Morse code\
    \ signaler. The Arduino board has a whole load of digital pins available.\n\n\
    Let’s experiment with one of the other pins on the Arduino. You will use digital\
    \ pin 4, and to see what is going on, you will fix some wire to your multimeter\
    \ leads and attach them to your Arduino. [Figure 6-1](#15_Chapter_06.xhtml_fig-ch6-1)\
    \ shows the arrangement. If your multimeter has crocodile clips, strip the insulation\
    \ off the ends of some short lengths of solid core wire and attach the clip to\
    \ one end, fitting the other end into the Arduino socket. If your multimeter does\
    \ not have crocodile clips, then wrap one of the stripped wire ends around the\
    \ probe as shown in [Figure 6-1](#15_Chapter_06.xhtml_fig-ch6-1).\n\n![image](images/fig-ch6-1.jpg)\n\
    \nFigure 6.1 *Measuring outputs with a multimeter*.\n\nThe multimeter needs to\
    \ be set to its 0–20V direct current (DC) range. The negative lead (black) should\
    \ be connected to the ground (`GND`) pin and the positive to `D3`. The wire is\
    \ just connected to the probe lead and poked into the socket headers on the Arduino\
    \ board.\n\nLoad sketch 6-01:\n\n```cpp\n//sketch 6-01\n\nconst int outPin = 3;\n\
    \nvoid setup()\n{\n  pinMode(outPin, OUTPUT);\n  Serial.begin(9600);\n  Serial.println(\"\
    Enter 1 or 0\");\n}\n\nvoid loop()\n{\n  if (Serial.available() > 0)\n  {\n  \
    \  char ch = Serial.read();\n    if (ch == '1')\n    {\n      digitalWrite(outPin,\
    \ HIGH);\n    }\n    else if (ch == '0')\n    {\n      digitalWrite(outPin, LOW);\n\
    \    }\n  }\n}\n```\n\nAt the top of the sketch, you can see the command `pinMode`.\
    \ You should use this command for every pin that you are using in a project so\
    \ that Arduino can configure the electronics connected to that pin to be either\
    \ an input or an output, as in the following example:\n\n```cpp\npinMode(outPin,\
    \ OUTPUT);\n```\n\nAs you might have guessed, `pinMode` is a built-in function.\
    \ Its first argument is the pin number in question (an `int`), and the second\
    \ argument is the mode, which must be either `INPUT`, `INPUT_PULLUP` or `OUTPUT`.\
    \ Note that the mode name must be all uppercase.\n\nThis `loop` waits for a command\
    \ of either `1` or `0` to come from the Serial Monitor on your computer. If it’s\
    \ a `1`, then pin 3 will be turned on; otherwise, it will be turned off.\n\nUpload\
    \ the sketch to your Arduino and then open the Serial Monitor (shown in [Figure\
    \ 6-2](#15_Chapter_06.xhtml_fig-ch6-2)).\n\n![image](images/fig-ch6-2.jpg)\n\n\
    Figure 6.2 *The Serial Monitor*.\n\nSo, with the multimeter turned on and plugged\
    \ into the Arduino, you should be able to see its reading change between 0V and\
    \ about 5V as you send commands to the board from the Serial Monitor by either\
    \ pressing 1 and then ENTER or pressing 0 and then ENTER. [Figure 6-3](#15_Chapter_06.xhtml_fig-ch6-3)\
    \ shows the multimeter reading after a 1 has been sent from the Serial Monitor.\n\
    \n![image](images/fig-ch6-3.jpg)\n\nFigure 6.3 *Setting the output to High*.\n\
    \nIf there are not enough pins labeled “D” for your project, you can actually\
    \ use the pins labeled “A” (for analog) as digital outputs too. To do this, just\
    \ use the pins labeled “A” (for analog) as digital outputs too.\n\n***\n\n###\
    \ Digital Inputs\n\nThe most common use for digital inputs is to detect when a\
    \ switch has closed. A digital input can either be on or off.\n\n```cpp\n//sketch\
    \ 6-02\n\nconst int inputPin = 5;\n\nvoid setup()\n{\n  pinMode(inputPin, INPUT);\n\
    \  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  int reading = digitalRead(inputPin);\n\
    \  Serial.println(reading);\n  delay(1000);\n}\n```\n\nAs with using an output,\
    \ you need to tell the Arduino in the `setup` function that you are going to use\
    \ a pin as an input. You get the value of a digital input using the `digitalRead`\
    \ function. This returns 0 or 1.\n\n#### Pull-Up Resistors\n\nThe sketch reads\
    \ the input pin and writes its value to the Serial Monitor once per second. So\
    \ upload the sketch and open the Serial Monitor. You should see a value appear\
    \ per second. Push one end of your wire into the socket for D5 and pinch the end\
    \ of the wire between your fingers, as shown in [Figure 6-4](#15_Chapter_06.xhtml_fig-ch6-4).\n\
    \n![image](images/fig-ch6-4.jpg)\n\nFigure 6.4 *A digital input with a human antenna*.\n\
    \nContinue pinching for a few seconds and watch the text appear on the Serial\
    \ Monitor. You should see a mixture of ones and zeros appear in the Serial Monitor.\
    \ The reason for this is that the inputs to the Arduino board are very sensitive.\
    \ You are acting as an antenna, picking up electrical interference.\n\nTake the\
    \ end of the wire that you were holding and push it into the socket for +5V as\
    \ shown in [Figure 6-5](#15_Chapter_06.xhtml_fig-ch6-5). The stream of text in\
    \ the Serial Monitor should change to ones.\n\n![image](images/fig-ch6-5.jpg)\n\
    \nFigure 6.5 *Pin 5 connected to +5V*.\n\nNow take the end that was in +5V and\
    \ put it into one of the `GND` connections on the Arduino. As you would expect,\
    \ the Serial Monitor should now display zeros.\n\nA typical use for an input pin\
    \ is to connect a switch to it. [Figure 6-6](#15_Chapter_06.xhtml_fig-ch6-6) shows\
    \ how you might connect your switch.\n\n![image](images/fig-ch6-6.jpg)\n\nFigure\
    \ 6.6 *Connecting a switch to an Arduino board*.\n"
  raw: "This is how your sketches should look. Breaking things up into functions makes\
    \ it much easier to get your code working and makes it easier when you return\
    \ to it after a period of not using it.\n\n* * *\n\n### Conclusion\n\nIn addition\
    \ to looking at strings and arrays in this chapter, you have also built this more\
    \ complex Morse translator that I hope will also reinforce the importance of building\
    \ your code with functions.\n\nIn the next chapter, you learn about input and\
    \ output, by which we mean input and output of analog and digital signals from\
    \ the Arduino.\n\n## 6\n\n## Input and Output\n\nThe Arduino is about physical\
    \ computing, and that means attaching electronics to the Arduino board. So you\
    \ need to understand how to use the various options for your connection pins.\n\
    \nOutputs can be digital, which just means switched between being at 0V or at\
    \ 5V, or analog, which allows you to set the voltage to any voltage between 0V\
    \ and 5V—although it’s not quite as simple as that, as we shall see.\n\nLikewise,\
    \ inputs can either be digital (for example, determining whether a button is pressed\
    \ or not) or analog (such as from a light sensor).\n\nIn a book that is essentially\
    \ about software rather than hardware, we are going to try and avoid being dragged\
    \ into too much discussion of electronics. However, it will help you to understand\
    \ what is happening in this chapter if you can find yourself a multimeter and\
    \ a short length of solid core wire.\n\nIf you are interested in learning more\
    \ about electronics, then you might like to look at my book *Hacking Electronics*\
    \ (TAB/McGraw-Hill, 2013).\n\n* * *\n\n### Digital Outputs\n\nIn earlier chapters,\
    \ you have made use of the LED attached to digital pin 13 of the Arduino board.\
    \ For example, in [Chapter 5](#14_Chapter_05.xhtml), you used it as a Morse code\
    \ signaler. The Arduino board has a whole load of digital pins available.\n\n\
    Let’s experiment with one of the other pins on the Arduino. You will use digital\
    \ pin 4, and to see what is going on, you will fix some wire to your multimeter\
    \ leads and attach them to your Arduino. [Figure 6-1](#15_Chapter_06.xhtml_fig-ch6-1)\
    \ shows the arrangement. If your multimeter has crocodile clips, strip the insulation\
    \ off the ends of some short lengths of solid core wire and attach the clip to\
    \ one end, fitting the other end into the Arduino socket. If your multimeter does\
    \ not have crocodile clips, then wrap one of the stripped wire ends around the\
    \ probe as shown in [Figure 6-1](#15_Chapter_06.xhtml_fig-ch6-1).\n\n![image](images/fig-ch6-1.jpg)\n\
    \nFigure 6.1 *Measuring outputs with a multimeter*.\n\nThe multimeter needs to\
    \ be set to its 0–20V direct current (DC) range. The negative lead (black) should\
    \ be connected to the ground (GND) pin and the positive to D3\\. The wire is just\
    \ connected to the probe lead and poked into the socket headers on the Arduino\
    \ board.\n\nLoad sketch 6-01:\n\n```\n//sketch 6-01\n\nconst int outPin = 3;\n\
    \nvoid setup()\n{\n  pinMode(outPin, OUTPUT);\n  Serial.begin(9600);\n  Serial.println(\"\
    Enter 1 or 0\");\n}\n\nvoid loop()\n{\n  if (Serial.available() > 0)\n  {\n  \
    \  char ch = Serial.read();\n    if (ch == '1')\n    {\n      digitalWrite(outPin,\
    \ HIGH);\n    }\n    else if (ch == '0')\n    {\n      digitalWrite(outPin, LOW);\n\
    \    }\n  }\n}\n```\n\nAt the top of the sketch, you can see the command **pinMode**.\
    \ You should use this command for every pin that you are using in a project so\
    \ that Arduino can configure the electronics connected to that pin to be either\
    \ an input or an output, as in the following example:\n\n```\npinMode(outPin,\
    \ OUTPUT);\n```\n\nAs you might have guessed, **pinMode** is a built-in function.\
    \ Its first argument is the pin number in question (an **int**), and the second\
    \ argument is the mode, which must be either **INPUT, INPUT_PULLUP** or **OUTPUT**.\
    \ Note that the mode name must be all uppercase.\n\nThis **loop** waits for a\
    \ command of either **1** or **0** to come from the Serial Monitor on your computer.\
    \ It it’s a **1**, then pin 3 will be turned on; otherwise, it will be turned\
    \ off.\n\nUpload the sketch to your Arduino and then open the Serial Monitor (shown\
    \ in [Figure 6-2](#15_Chapter_06.xhtml_fig-ch6-2)).\n\n![image](images/fig-ch6-2.jpg)\n\
    \nFigure 6.2 *The Serial Monitor*.\n\nSo, with the multimeter turned on and plugged\
    \ into the Arduino, you should be able to see its reading change between 0V and\
    \ about 5V as you send commands to the board from the Serial Monitor by either\
    \ pressing 1 and then ENTER or pressing 0 and then ENTER. [Figure 6-3](#15_Chapter_06.xhtml_fig-ch6-3)\
    \ shows the multimeter reading after a 1 has been sent from the Serial Monitor.\n\
    \n![image](images/fig-ch6-3.jpg)\n\nFigure 6.3 *Setting the output to High*.\n\
    \nIf there are not enough pins labeled “D” for your project, you can actually\
    \ use the pins labeled “A” (for analog) as digital outputs too. To do this, just\
    \ use the letter A in front of the analog pin name, for example, A0\\. You could\
    \ try this out by modifying the first line in sketch 6-01 to use pin A0 and moving\
    \ your positive multimeter lead to pin A0 on the Arduino.\n\nThat is really all\
    \ there is to digital outputs, so let’s move on swiftly to digital inputs.\n\n\
    * * *\n\n### Digital Inputs\n\nThe most common use of digital inputs is to detect\
    \ when a switch has been closed. A digital input can either be on or off. If the\
    \ voltage at the input is less than 2.5V (halfway to 5V), it will be 0 (off),\
    \ and if it is above 2.5V, it will be 1 (on).\n\nDisconnect your multimeter and\
    \ upload sketch 6-02 onto your Arduino board:\n\n```\n//sketch 6-02\n\nconst int\
    \ inputPin = 5;\n\nvoid setup()\n{\n  pinMode(inputPin, INPUT);\n  Serial.begin(9600);\n\
    }\n\nvoid loop()\n{\n  int reading = digitalRead(inputPin);\n  Serial.println(reading);\n\
    \  delay(1000);\n}\n```\n\nAs with using an output, you need to tell the Arduino\
    \ in the **setup** function that you are going to use a pin as an input. You get\
    \ the value of a digital input using the **digitalRead** function. This returns\
    \ 0 or 1.\n\n#### Pull-Up Resistors\n\nThe sketch reads the input pin and writes\
    \ its value to the Serial Monitor once per second. So upload the sketch and open\
    \ the Serial Monitor. You should see a value appear once per second. Push one\
    \ end of your bit of wire into the socket for D5 and pinch the end of the wire\
    \ between your fingers, as shown in [Figure 6-4](#15_Chapter_06.xhtml_fig-ch6-4).\n\
    \n![image](images/fig-ch6-4.jpg)\n\nFigure 6.4 *A digital input with a human antenna*.\n\
    \nContinue pinching for a few seconds and watch the text appear on the Serial\
    \ Monitor. You should see a mixture of ones and zeros appear in the Serial Monitor.\
    \ The reason for this is that the inputs to the Arduino board are very sensitive.\
    \ You are acting as an antenna, picking up electrical interference.\n\nTake the\
    \ end of the wire that you were holding and push it into the socket for +5V as\
    \ shown in [Figure 6-5](#15_Chapter_06.xhtml_fig-ch6-5). The stream of text in\
    \ the Serial Monitor should change to ones.\n\n![image](images/fig-ch6-5.jpg)\n\
    \nFigure 6.5 *Pin 5 connected to +5V*.\n\nNow take the end that was in +5V and\
    \ put it into one of the GND connections on the Arduino. As you would expect,\
    \ the Serial Monitor should now display zeros.\n\nA typical use for an input pin\
    \ is to connect a switch to it. [Figure 6-6](#15_Chapter_06.xhtml_fig-ch6-6) shows\
    \ how you might connect your switch.\n\n![image](images/fig-ch6-6.jpg)\n\nFigure\
    \ 6.6 *Connecting a switch to an Arduino board*."
