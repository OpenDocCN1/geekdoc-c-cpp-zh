    \  int i2 = 0;\n  eeprom_read_block(&i2, 0, 2);\n  Serial.println(i2);\n}\n\n\
    void loop() \n}\n```\n\n#### 在 EEPROM 中存储浮点数\n\n如果你只使用单字节，使用 `EEPROM` 的官方 Arduino\
    \ 方法没问题。但是，正如你在 `ints` 中看到的那样，对于较大的数据类型，这变得更加复杂。对于浮点数（4 字节）更糟。幸运的是，有一种替代方法，使用了\
    \ Arduino 本身使用的库之一，称为 `AVR EEPROM` 库。这允许你使用单个命令读写能够放入你的 `EEPROM` 的所有数据。\n\nsketch\
    \ 8-03 示例使用此库写入并读取一个 `int`。\n\n```\n// sketch 08-03\n\n#include <avr/eeprom.h>\n\
