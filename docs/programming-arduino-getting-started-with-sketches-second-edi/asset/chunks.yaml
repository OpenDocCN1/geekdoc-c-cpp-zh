    参考图 1-1，USB 连接器正下方是 5 伏（5V）电压调节器。它将从 DC 电源提供的任何电压（7V 到 12V 之间）调节为恒定的 5V。


    5V 电压调节器芯片对于表面贴元件来说其实相当大。这是为了它可以散发在高电流调节电压所需的热量。这在驱动外部设备时非常有用。


    虽然通过 DC 电源为 Arduino 供电在电池或 DC 电源运行时很有，但 Arduino Uno 也可以通过 USB 端口供电，该端口也用于为 Arduino。


