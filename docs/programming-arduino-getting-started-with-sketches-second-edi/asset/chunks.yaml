    \ be thought of as having a decimal value, and you can find the decimal value\
    \ of the **int** by adding up the values of all the bits that are a 1\\. So in\
    \ [Figure 7-2](#16_Chapter_07.xhtml_fig-ch7-2), the decimal value of the **int**\
    \ would be 38\\. Actually, it gets more complicated to deal with negative numbers,\
    \ but that only happens when the leftmost bit becomes a 1.\n\n![image](images/fig-ch7-2.jpg)\n\
    \nFigure 7.2 *An **int***.\n\nWhen you are thinking about individual bits, decimal\
    \ values do not really work very well. It is very difficult to visualize which\
    \ bits are set in a decimal number such as 123\\. For that reason, programmers\
    \ often use something called *hexadecimal*, or, more commonly, just *hex*. Hex\
    \ is number base 16\\. So instead of having digits 0 to 9, you have six extra\
    \ digits, A to F. This means that each hex digit represents four bits. The following\
    \ table shows the relationship among decimal, hex, and binary with the numbers\
    \ 0 to 15:\n\n| **Decimal** | **Hex** | **Binary (Four Digit)** |\n\n| --- | ---\
    \ | --- |\n\n| 0 | 0 | 0000 |\n\n| 1 | 1 | 0001 |\n\n| 2 | 2 | 0010 |\n\n| 3 |\
    \ 3 | 0011 |\n\n| 4 | 4 | 0100 |\n\n| 5 | 5 | 0101 |\n\n| 6 | 6 | 0110 |\n\n|\
    \ 7 | 7 | 0111 |\n\n| 8 | 8 | 1000 |\n\n| 9 | 9 | 1001 |\n\n| 10 | A | 1010 |\n\
    \n| 11 | B | 1011 |\n\n| 12 | C | 1100 |\n\n| 13 | D | 1101 |\n\n| 14 | E | 1110\
    \ |\n\n| 15 | F | 1111 |\n\nSo, in hex, any **int** can be represented as a four-digit\
    \ hex number. Thus, the binary number 10001100 would in hex be 8C. The C language\
    \ has a special syntax for using hex numbers. You can assign a hex value to an\
    \ **int** as follows:\n\n```\nint x = 0x8C;\n```\n\nAs well as using hex notation\
    \ for numbers, you can also use binary notation directly using the prefix ‘0b’.\
    \ For example, the binary used in the hex example of 0x8C could be written directly\
    \ in binary as:\n\n```\n0b10001100\n```\n\nThe Arduino standard library provides\
    \ some functions that let you manipulate the 16 bits within an **int** individually.\
    \ The function **bitRead** returns the value of a particular bit in an **int**;\
    \ so, for the following example would assign the value 0 to the variable called\
    \ **bit**:\n\n```\nint x = 0b10001100;\nint bit = bitRead(x, 0);\n```\n\nIn the\
    \ second argument, the bit position starts at 0 and goes up to 15\\. It starts\
    \ with the least significant bit. So the rightmost bit is bit 0, the next bit\
    \ to the left is bit 1, and so on.\n\nAs you would expect, the counterpart to\
    \ **bitRead** is **bitWrite**, which takes three arguments. The first is the number\
    \ to manipulate, the second is the bit position, and the third is the bit value.\
    \ The following example changes the value of the **int** from 2 to 3 (in decimal\
    \ or hex):\n\n```\nint x = 0b10;\nbitWrite(x, 0, 1);\n```\n\n* * *\n\n### Advanced\
    \ I/O\n\nThere are some useful little functions that you can use to make your\
    \ life easier when performing various input/output tasks.\n\n#### Generating Tones\n\
    \nThe **tone** function allows you to generate a square-wave signal (see [Figure\
    \ 7-3](#16_Chapter_07.xhtml_fig-ch7-3)) on one of the digital output pins. The\
    \ most common reason to do this is to generate an audible tone using a loudspeaker\
    \ or buzzer.\n\n![image](images/fig-ch7-3.jpg)\n\nFigure 7.3 *A square-wave signal*.\n\
    \nThe function takes either two or three arguments. The first argument is always\
    \ the pin number on which the tone is to be generated, the second argument is\
    \ the frequency of the tone in hertz (Hz), and the optional final argument is\
    \ the duration of the tone. If no duration is specified, then the tone will continue\
    \ playing indefinitely, as is the case in sketch 7-03\\. This is why we have put\
    \ the **tone** function call in **setup** rather than in the **loop** function.\n\
    \n```\n//sketch 7-03\n\nvoid setup()\n{\n  tone(4, 500);\n}\n\nvoid loop() {}\n\
    ```\n\nTo stop a tone that is playing, you use the function **noTone**. This function\
    \ has just one argument, which is the pin on which the tone is playing.\n\n####\
    \ Feeding Shift Registers\n\nSometimes the Arduino Uno just doesn’t have enough\
    \ pins. When driving a large number of LEDs, for example, a common technique is\
    \ to use a shift register chip. This chip reads data one bit at a time, and then\
    \ when it has enough, it latches all those bits onto a set of outputs (one per\
    \ bit).\n\nTo help you use this technique, there is a handy function called **shiftOut**.\
    \ This function takes four arguments:\n\n♦ The number of the pin on which the\
    \ bit to be sent will appear.\n\n♦ The number of the pin to be used as a clock\
    \ pin. This toggles every time a bit is sent.\n\n♦ A flag to determine whether\
    \ the bits will be sent starting with the least significant bit or the most significant.\
    \ This should be one of the constants **MSBFIRST** or **LSBFIRST**."
