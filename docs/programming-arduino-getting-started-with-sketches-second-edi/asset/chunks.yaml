    \ 500, 200, 200, 200};\n```\n\nYou indicate that a variable contains an array\
    \ by placing **[]** after the variable name.\n\nIn this case, you are going to\
    \ set the values for the durations at the time that you create the array. The\
    \ syntax for doing this is to use curly braces and then values each separated\
    \ by commas. Don’t forget the semicolon on the end of the line.\n\nYou can access\
    \ any given element of the array using the square bracket notation. So, if you\
    \ want to get the first element of the array, you can write the following:\n\n\
    ```\ndurations[0]\n```\n\nTo illustrate this, let’s create an array and then print\
    \ out all its values to the Serial Monitor:\n\n```\n// sketch 5-01\n\nint durations[]\
    \ = {200, 200, 200, 500, 500, 500, 200, 200, 200};\n\nvoid setup()\n{\n  Serial.begin(9600);\
    \ \n  for (int i = 0; i < 9; i++)\n  {\n    Serial.println(durations[i]);\n  }\n\
    }\n\nvoid loop() {}\n```\n\nNote that you can use the keyword **const** with arrays\
    \ as well as ordinary variables, just as long as you do not intend to modify the\
    \ array within your sketch.\n\nUpload the sketch to your board and then open the\
    \ Serial Monitor. If all is well, you will see something like [Figure 5-1](#14_Chapter_05.xhtml_fig-ch5-1).\n\
    \n![image](images/fig-ch5-1.jpg)\n\nFigure 5.1 *The Serial Monitor showing the\
    \ output of sketch 5-01*.\n\nThis is quite neat, because if you wanted to add\
    \ more durations to the array, all you would need to do is add them to the list\
    \ inside the curly braces and change “9” in the **for** loop to the new size of\
    \ the array.\n\nYou have to be a little careful with arrays, because the compiler\
    \ will not try and stop you from accessing elements of data that are beyond the\
    \ end of the array. This is because the array is really a pointer to an address\
    \ in memory, as shown in [Figure 5-2](#14_Chapter_05.xhtml_fig-ch5-2).\n\n![image](images/fig-ch5-2.jpg)\n\
    \nFigure 5.2 *Arrays and pointers*.\n\nPrograms keep their data, both ordinary\
    \ variables and arrays, in *memory*. Computer memory is arranged much more rigidly\
    \ than the human kind of memory. It is easiest to think of the memory in an Arduino\
    \ as a collection of pigeonholes. When you define an array of nine elements, for\
    \ example, the next available nine pigeonholes are reserved for its use and the\
    \ variable is said to point at the first pigeonhole or *element* of the array.\n\
    \nGoing back to our point about access being allowed beyond the bounds of your\
    \ array, if you decided to access **durations[10]**, then you would still get\
    \ back an **int**, but the value of this **int** could be anything. This is in\
    \ itself fairly harmless, except that if you accidentally get a value outside\
    \ of the array, you are likely to get confusing results in your sketch.\n\nHowever,\
    \ what is far worse is if you try changing a value outside of the size of the\
    \ array. For instance, if you were to include something like the following in\
    \ your program, the results could simply make your sketch break:\n\n```\ndurations[10]\
    \ = 0;\n```\n\nThe pigeonhole **durations[10]** may be in use as some completely\
    \ different variable. So always make sure that you do not go outside of the size\
    \ of the array. If your sketch starts behaving strangely, then check for this\
    \ kind of problem.\n\n#### Morse Code SOS Using Arrays\n\nSketch 5-02 shows how\
    \ you can use an array to make your emergency signal of SOS:\n\n```\n// sketch\
    \ 5-02\nconst int ledPin = 13;\n\nint durations[] = {200, 200, 200, 500, 500,\
    \ 500, 200, 200, 200};\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid\
    \ loop()\n{\n  for (int i = 0; i < 9; i++)\n  {\n    flash(durations[i]);\n  }\n\
    \  delay(1000);\n}\n\nvoid flash(int delayPeriod)\n{\n   digitalWrite(ledPin,\
    \ HIGH);\n   delay(delayPeriod);\n   digitalWrite(ledPin, LOW);\n   delay(delayPeriod);\n\
    }\n```\n\nAn obvious advantage of this approach is that it is very easy to change\
    \ the message by simply altering the **durations** array. In sketch 5-05, you\
    \ will take the use of arrays a stage further to make a more general-purpose Morse\
    \ code flasher.\n\n* * *\n\n### String Arrays\n\nIn the programming world, the\
    \ word *string* has nothing to do with long thin stuff that you tie knots in.\
    \ A string is a sequence of characters. It’s the way you can get your Arduino\
    \ to deal with text. For example, sketch 5-03 will repeatedly send the text “Hello”\
    \ to the Serial Monitor one time per second:"
