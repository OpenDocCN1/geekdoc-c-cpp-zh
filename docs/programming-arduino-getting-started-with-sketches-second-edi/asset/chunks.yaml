  trans: "\n这种方法的问题在于，如果开关没有关闭，输入引脚就没有连接到任何地方。这被称为“浮空”（floating），并且很容易给你一个错误的读数。你需要输入更具可预测性，而实现这一点的方法就是使用所谓的上拉电阻。你稍后将看到如何启用\
    \ Arduino 内置的串联电阻，从而避免使用单独的电阻。插图 6-7 显示了上拉电阻的标准用法。它的作用是：当开关处于断开状态时，电阻会将浮空输入拉高到\
    \ 5V。当你按下开关并闭触点时，开关会覆盖电阻的作用，强制输入置为 0V。这的一个副作用是，当开关关闭时，5V 会跨越电阻，产生电流。因此，电阻的值选择得足够低，以使其免受任何电干扰，但同时又足够高，以防止在开关关闭时产生过大的消耗。\n\
    \n![image](img/fig-ch6-7.jpg)\n\n图 6.7 *带有上拉电阻的开关*。\n\n### 内部上拉电阻\n\n幸运的是，Arduino\
    \ 板的数字引脚中内置了软件可配置的上拉电阻。默认情况下，它们是关闭的。因此，对于程序 6-02，要启用引脚 5 上的拉电阻，只需要将引脚模式从 `INPUT`\
    \ 更改为 `INPUT_PULLUP`。\n\n程序 6-03 是修改后的版本。将其上传到你的 Arduino 板并再次像当作天线一样进行测试。你会发现，这次输入在串口监视器中保持为\
    \ 1。\n\n```\n//sketch 6-03\n\nconst int inputPin = 5;\n\nvoid setup()\n{\n  pinMode(inputPin,\
    \ INPUT_PULLUP);\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  int reading =\
    \ digitalRead(inputPin);\n  Serial.println(reading);\n  delay(1000);\n}\n```\n\
    \n### 抖动 (Debouncing)\n\n当你按下按钮开关时，你希望在按钮按下时只得到一个从 1（带有上拉电阻时）到 0 的单一变化。插图 6-8\
    \ 显示了按下按钮时可能发生的情况。按钮中的金属触点会抖动。因此，单次按钮按下会变成一系列按下，最终趋稳定。\n\n![image](img/fig-ch6-8.jpg)\n\
    \n图 6.8 *按钮按下的示波器轨迹*。\n\n这一切发生得非常快；示波器波形上按钮按下的总时间跨度仅为 200 毫秒。这是一个非常“糟糕”的旧开关。新的触感、点击型按钮可能完全不会抖动。\n\
    \n有时抖动并不重要。例如，程序 6-04 会在按钮被按下时点亮 LED。在实际上，你不会用 Arduino 这样做；我们在这里坚定地处于理论领域而非实践领域。\n\
    \n```\n//sketch 6-04\n\nconst int inputPin = 5;\nconst int ledPin = 13;\n\nvoid\
    \ setup()\n{\n  pinMode(ledPin, OUTPUT);\n  pinMode(inputPin, INPUT_PULLUP);\n\
    }\n\nvoid loop()\n{\n  int switchOpen = digitalRead(inputPin);\n  digitalWrite(ledPin,\
    \ ! switchOpen);\n}\n```\n\n查看程序 6-04 的 `loop` 函数，该函数读取数字输入并将其赋值给变量 `switchOpen`。如果按钮被按下，则为\
    \ 0；如果未按下，则为 1（记住，当按钮未按下时，引脚会被拉高到 1）。\n\n当你编写 `digitalWrite` 来开启或关闭 LED 时，你需要反转这个值。你使用\
    \ `!` 或 `not` 操作符来做到这一点。\n\n如果你上传此程序并在 D5 和 GND 之间连接电线（参见插图 6-9），你应该看到 LED 亮起。这里可能正在发生抖动，但可能太快了你看不见，并不重要。\n\
    \n![image](img/fig-ch6-9.jpg)\n\n图 6.9 *使用电线作为开关*。\n\n按键抖动变得重要的某种情况是你正在让开关切换 LED\
    \ 的开启和关闭。也就是说，如果你按下按钮，LED 开启并保持开启状态，当你再次按下按钮时，它会关闭。如果你有一个会抖动的按钮，那么 LED 是开启还是关闭将取决于你抖动的奇数次还是偶数次。\n\
    \n程序 6-05 只是切换 LED，而没有尝试“去抖动”。使用你的电线作为引脚 D5 和 GND 之间的开关进行测试（或者如果你有真实的开关也使用它）：\n\
    \n```\n// sketch 6-05\n```\n\n```\nconst int inputPin = 5;\nconst int ledPin =\
    \ 13;\nint ledValue = LOW;\n\nvoid setup() \n{\n  pinMode(inputPin, INPUT_PULLUP);\n\
    \  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() \n{\n  if (digitalRead(inputPin)\
    \ == LOW)\n  {\n     ledValue = ! ledValue;\n  }\n}\n```\n"
- fmt: "\nThe function `update` returns true if something has changed with the `bouncer`\
    \ object and the second part of the condition checks whether the button went `LOW`.\n\
    \n***\n\n### Analog Outputs\n\nA few of the digital pins—namely digital pins 3,\
    \ 5, 6, 9, 10, and 11—can provide variable output other than just 5V or nothing.\
    \ These are the pins on the board with a ~ or “PWM” next to them. PWM stands for\
    \ Pulse Width Modulation, which refers to the means of controlling the amount\
    \ of power at the output. It does so by rapidly turning the output on and off.\n\
    \nThe pulses are always delivered at the same rate (roughly 500 per second on\
    \ all the pins except pins 5 and 6, which provide 980 pulses per second), but\
    \ the length of the pulses is varied. If you were to use PWM to control the brightness\
    \ of an LED, then if the pulse were long, your LED would be on all the time. If,\
    \ however, the pulses are short, then the LED is actually lit only for a small\
    \ portion of the time. This happens too fast for the observer even to tell that\
    \ the LED is flickering, and it just appears that the LED is lighter or dimmer.\n\
    \nBefore you try using an LED, you can test this out with your multimeter. Set\
    \ the multimeter up to measure the voltage between `GND` and pin `D3` (see [Figure\
    \ 6-11](#15_Chapter_06.xhtml_fig-ch6-11)).\n\n![image](images/fig-ch6-11.jpg)\n\
    \nFigure 6.11 *Measuring the analog output*.\n\nNow upload sketch 6-08 to your\
    \ board and open the Serial Monitor (see [Figure 6-12](#15_Chapter_06.xhtml_fig-ch6-12)).\
    \ Enter `3` and press ENTER. You should see your volt meter register about 3V.\
    \ You can then try any other voltage between 0 and 5.\n\n![image](images/fig-ch6-12.jpg)\n\
    \nFigure 6.12 *Setting the voltage at an analog output*.\n\n```cpp\n//sketch 06-08\n\
    \nconst int outputPin = 3;\n\nvoid setup()\n{\n  pinMode(outputPin, OUTPUT);\n\
    \  Serial.begin(9600);\n  Serial.println(\"Enter Volts 0 to 5\");\n}\n\nvoid loop()\n\
    {\n  if (Serial.available() > 0)\n  {\n    float volts = Serial.parseFloat();\n\
    \    int pwmValue = volts * 255.0 / 5.0;\n    analogWrite(outputPin, pwmValue);\n\
    \  }\n}\n```\n\nThe program determines the value of PWM output between 0 and 255\
    \ by multiplying the desired voltage (0 to 5) by `255/5`. (Readers may wish to\
    \ refer to Wikipedia for a fuller description of PWM.)\n\nYou can set the value\
    \ of the output by using the function `analogWrite`, which requires an output\
    \ value between 0 and 255, where 0 is off and 255 is full power. This is actually\
    \ a great way to control the brightness of an LED. If you were to try to control\
    \ the brightness by varying the voltage across the LED, you would find that nothing\
    \ would happen until you got to about 2V; then the LED would very quickly get\
    \ quite bright. By controlling the brightness using PWM and varying the average\
    \ amount of time that the LED is on, you achieve much more linear control of the\
    \ brightness.\n\n***\n\n### Analog Input\n\nDigital inputs just give you an on/off\
    \ answer as to what is happening at a particular pin on the Arduino board. Analog\
    \ inputs, however, give you a value between 0 and 1023 depending on the voltage\
    \ at the analog input pin.\n\nThe program reads the analog input using the `analogRead`\
    \ function. Sketch 6-09 displays the reading and actual voltage at the analog\
    \ pin `A0` in the Serial Monitor every half second, so open the Serial Monitor\
    \ and watch the readings appear, as shown in [Figure 6-13](#15_Chapter_06.xhtml_fig-ch6-13).\n\
    \n![image](images/fig-ch6-13.jpg)\n\nFigure 6.13 *Measuring voltage with an Arduino\
    \ Uno*.\n\n```cpp\n//sketch 6-09\n\nconst int analogPin = 0;\n\nvoid setup()\n\
    {\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  int reading = analogRead(analogPin);\n\
    \  float voltage = reading / 204.6;\n  Serial.print(\"Reading=\");\n  Serial.print(reading);\n\
    \  Serial.print(\"\\t\\tVolts=\");\n  Serial.println(voltage);\n  delay(500);\n\
    }\n```\n\nWhen you run this sketch, you will notice that the readings change quite\
    \ a bit. As with the digital inputs, this is because the input is floating.\n\n\
    Take one end of the wire and put it into a `GND` socket so that `A0` is connected\
    \ to `GND`. Your readings should now stay at `0`. Move the end of the lead that\
    \ was in `GND` and put it into `5V` and you should get a reading of around `1023`,\
    \ which is the maximum reading. So, if you were to connect `A0` to the `3.3V`\
    \ socket on the Arduino board, the Arduino volt meter should tell you that you\
    \ have about `3.3V`.\n\nThe value of `204.6` is `1023` (the maximum analog reading)\
    \ divided by `5` (the maximum voltage). `Serial.print` is used to send messages\
    \ to the serial monitor without beginning a new line, which only happens when\
    \ `Serial.println` is used. The `\\t` in the messages is used to represent one\
    \ tab stop so that the numbers line up.\n\n***\n\n### Conclusion\n\nThis concludes\
    \ our chapter on the basics of getting signals into and out of the Arduino. In\
    \ the next chapter, we will look at some of the features provided in the standard\
    \ Arduino library.\n\n## 7\n\n## The Standard Arduino Library\n\nThis library\
    \ is where all the goodies live. You can only get so far with the core C language;\
    \ what you really need is a big collection of functions that you can use in your\
    \ sketches.\n\nYou have already met a fair few of these, such as `pinMode`, `digitalWrite`,\
    \ and `analogWrite`. But actually, there are many more. There are functions that\
    \ you can use for doing math, making random numbers, manipulating bits, detecting\
    \ pulses on an input pin, and using something called interrupts.\n\nThe Arduino\
    \ language is based on an earlier library called `Wiring` and it complements another\
    \ library called `Processing`. The Processing library is very similar to `Wiring`,\
    \ but it is based on the Java language rather than C and is used on your computer\
    \ to link to your Arduino over USB. In fact, the Arduino IDE application that\
    \ you run on your computer is based on Processing. If you find yourself wanting\
    \ to write some fancy interface on your computer, then take a look at Processing\
    \ ([www.processing.org]).\n\n***\n\n### Random Numbers\n\nDespite the experience\
    \ of anyone using a PC, computers are in actual fact very predictable. Occasionally\
    \ it is useful to deliberately make your Arduino unpredictable. For example, you\
    \ might want to make a robot take a “random” path around a room, heading for a\
    \ random amount of time in one direction, turning a random number of degrees,\
    \ and then setting off again. Or, you might be contemplating an Arduino-based\
    \ die that gives you a random number between one and six.\n\nThe Arduino standard\
    \ library provides you with a feature to do this. It is the function called `random`.\
    \ `random` returns an `int` and it can take either one argument or two. If it\
    \ just takes one argument, then it will return a random number between zero and\
    \ the argument minus one.\n\nThe two-argument version produces a random number\
    \ between the first argument (inclusive) and the second argument minus one. Thus\
    \ `random(1, 10)` produces a random number between one and nine.\n\nSketch 7-01\
    \ pumps out numbers between one and six to the Serial Monitor.\n\n```cpp\n//sketch\
    \ 7-01\n\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  int number\
    \ = random(1, 7);\n  Serial.println(number);\n  delay(500); \n}\n```\n\nIf you\
    \ upload this sketch to your Arduino and open the Serial Monitor, you will see\
    \ something like [Figure 7-1](#16_Chapter_07.xhtml_fig-ch7-1).\n\n![image](images/fig-ch7-1.jpg)\n\
    \nFigure 7.1 *Random numbers*.\n\nIf you run this a few times you will probably\
    \ be surprised to see that every time you run the sketch, you get the same series\
    \ of “random” numbers.\n\nThe output is not really random; the numbers are called\
    \ *pseudo-random* numbers because they have a random distribution. That is, if\
    \ you ran this sketch and collected a million numbers, you would get pretty much\
    \ the same number of ones, twos, threes, and so on. The numbers are not random\
    \ in the sense of being unpredictable. In fact, it is so against the workings\
    \ of a microcontroller to be random that it just plain can’t do it without some\
    \ intervention from the real world.\n"
