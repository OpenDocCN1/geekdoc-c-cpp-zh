  trans: "\n我没有在这里列出 sketch 8-01，因为因为它有点长，但你可能希望加载它并验证它的工作方式与基于 RAM 的版本相同。\n\n除了以特殊方式创建数据外，你还需要以特殊方式读回数据。你从数组获取摩尔斯字母字符串的代码需要修改为如下所示：\n\
    \n```\nstrcpy_P(buffer, (char*)pgm_read_word(&(letters[ch - 'a'])));\n```\n\n\
    这使用了一个 `buffer` 变量将 `PROGMEM` 字符串拷贝到其中，这样它就可以像普通的 `char` 数组一样使用。这需要如下定义为全局变量：\n\
    \n```\nchar buffer[6];\n```\n\n这种方法仅在数据是常量时有效——也就是说，你在程序运行期间不会更改它。在下一节中，你将学习使用\
    \ `EEPROM` 内存，它用于存储可以更改的持久性数据。\n\n如果你有可能是为了显示在串口监器上而格式化的单独字符串，Arduino C 提供了一个方便的快捷方法。你只需要像下面的示例所示将字符串封装在\
    \ `F()` 中：\n\n```\nSerial.println(F(\"Hello World\"));\n```\n\n该字符串将存储在闪存内存中，而不是占用\
    \ RAM。\n\n***\n\n### EEPROM\n\nArduino Uno 核心 `ATMega328` 具有千字节的电可擦除只读内存（`EEPROM`）。`EEPROM`\
    \ 设计用于记忆其内容多年。尽管名字如此，它并不是真的只读的。你可以向它写入。\n\n读取和写入 `EEPROM` 的官方 Arduino 命令与使用 `PROGMEM`\
    \ 的命令一样难用。你必须一次一个字节地对 `EEPROM` 进行读写操作。\n\nsketch 8-02 示例允许你从串口监器输入单数字字母代码。该程序会记住该数字并反复在串口监器上打印它。\n\
    \n```\n// sketch 8-02\n#include <EEPROM.h>\n\nint addr = 0;\nchar ch;\n\nvoid\
    \ setup()\n{\n  Serial.begin(9600);\n  ch = EEPROM.read(addr);\n}\n\nvoid loop()\n\
    {\n  if (Serial.available() > 0)\n  {\n    ch = Serial.read();\n    EEPROM.write(0,\
    \ ch);\n    Serial.println(ch);\n  }\n  Serial.println(ch);\n  delay(1000);\n\
    }\n```\n\n要尝试此程序，请打开串口监器并输入新字符。然后拔掉 Arduino 并重新插上。当你重新打开串口监器时，你会发现该字母被记住了。\n\n\
    `EEPROM.write` 函数接受两个参数。第一个是地址，即 `EEPROM` 中的内存位置，范围应在 0 到 1023 之间。第二个参数是要写入该位置的数据。这必须是一个单字节。字符被表示为八位，所以这没问题，但你不能直接存储一个\
    \ 16 位的 `int`。\n\n#### 在 EEPROM 中存储 `int`\n\n要在 `EEPROM` 的位置 0 和 1 存储一个双字节的 `int`，你可以这样操作：\n\
    \n```\n int x = 1234; \n  EEPROM.write(0, highByte(x));\n  EEPROM.write(1, lowByte(x));\n\
    ```\n\n`highByte` 和 `lowByte` 函数对于将 `int` 分拆为两个字节非常有用。图 8-1 显示了此 `int` 实际上是如何存储在\
    \ `EEPROM` 中的。\n\n![image](img/fig-ch8-1.jpg)\n\n图 8.1. *在 EEPROM 中存储 16 位整数*。\n\
    \n要从 `EEPROM` 读回 `int`，你需要从 `EEPROM` 读取两个字节并重构 `int`，如下：\n\n```\nbyte high = EEPROM.read(0);\n\
    byte low = EEPROM.read(1);\nint x = (high << 8) + low;\n```\n\n`<<` 运算符是一个位移运算符，它将高位字节移动到\
    \ `int` 的顶部，然后加上低字节。\n\n#### 使用 AVR EEPROM 库\n\n如果你只使用单字节，使用 `EEPROM` 的官方 Arduino\
    \ 方法完全可以。但是，正如你在 `ints` 中看到的那样，对于较大的数据类型，这变得更加复杂。对于浮点数（4 字节）更糟。幸运的是，有一种替代方法，使用了\
    \ Arduino 本身使用的库之一，称为 `AVR EEPROM` 库。这允许你使用单个命令读写能够放入你的 `EEPROM` 的所有数据。\n\nsketch\
    \ 8-03 示例使用此库写入并然后读取一个 `int`。\n\n```\n// sketch 08-03\n\n#include <avr/eeprom.h>\n\
    \nvoid setup() \n{\n  Serial.begin(9600);\n  int i1 = 123;\n  eeprom_write_block(&i1,\
    \ 0, 2);\n  int i2 = 0;\n  eeprom_read_block(&i2, 0, 2);\n  Serial.println(i2);\n\
    }\n\nvoid loop() \n{\n}\n```\n\n该库实际上包含在 Arduino 中，因此 `eeprom_write_block` 和 `eeprom_read_block`\
