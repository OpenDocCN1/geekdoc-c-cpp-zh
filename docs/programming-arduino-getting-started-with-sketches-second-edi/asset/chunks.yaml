- fmt: "\nIt is perhaps a little surprising that we can get to [Chapter 3](#12_Chapter_03.xhtml)\
    \ in a book about programming without defining exactly what a programming language\
    \ is. We can recognize an Arduino sketch and probably have a rough idea of what\
    \ it is trying to do, but we need to look a bit deeper into how some programming\
    \ language code goes from being words on a page to something that does something\
    \ real, like turn an LED on and off.\n\n[Figure 3-1](#12_Chapter_03.xhtml_fig-ch3-1)\
    \ summarizes the process involved from typing code into the Arduino IDE to running\
    \ the sketch on the board.\n\n![image](images/fig-ch3-1.jpg)\n\nFigure 3.1. *From\
    \ code to board*.\n\nWhen you press the Upload button on your Arduino IDE, it\
    \ launches a chain of events that results in your sketch being installed on the\
    \ Arduino and being run. This is not as straightforward as simply taking the text\
    \ that you typed into the editor and moving it to the Arduino board.\n\nThe first\
    \ step is to do something called `compilation`. This takes the code you have written\
    \ and translates it into machine code—the binary language that the Arduino understands.\
    \ If you click the Verify button on the Arduino IDE, this actually attempts to\
    \ compile the C that you have written without trying to send the code to the Arduino\
    \ IDE. A side-effect of compiling the code is that it is checked to make sure\
    \ that it conforms to the rules of the C language.\n\nIf you type `Ciao Bella!`\
    \ into your Arduino IDE and click on the Play button, the results will be as shown\
    \ in [Figure 3-2](#12_Chapter_03.xhtml_fig-ch3-2).\n\n![image](images/fig-ch3-2.jpg)\n\
    \nFigure 3.2. *Arduinos don’t speak Italian*.\n\nThe Arduino has tried to compile\
    \ the words “Ciao Bella,” and despite its Italian heritage, it has no idea what\
    \ you are talking about. This text is not C. So, the result is that at the bottom\
    \ of the screen we have that cryptic message “Ciao does not name a type.” What\
    \ this actually means is that there is a lot wrong with what you have written.\n\
    \nLet’s try another example. This time we will try compiling a sketch with no\
    \ code at all in it (see [Figure 3-3](#12_Chapter_03.xhtml_fig-ch3-3)).\n\n![image](images/fig-ch3-3.jpg)\n\
    \nFigure 3.3. *No `setup` or `loop`*.\n\nThis time, the compiler is telling you\
    \ that your sketch does not have `setup` or `loop` functions. As you know from\
    \ the Blink example that you ran in [Chapter 2](#11_Chapter_02.xhtml), you have\
    \ to have some “boilerplate” code, as it is called, before you can add your own\
    \ code into a sketch. In Arduino programming the “boilerplate” code takes the\
    \ form of the `setup` and `loop` functions that must always be present in a sketch.\n\
    \nYou will learn much more about functions later in the book, but for now, let’s\
    \ accept that you need this boilerplate code and just adapt your sketch so it\
    \ will compile (see [Figure 3-4](#12_Chapter_03.xhtml_fig-ch3-4)).\n\n![image](images/fig-ch3-4.jpg)\n\
    \nFigure 3.4. *A sketch that will compile*.\n\nThe Arduino IDE has looked at your\
    \ efforts at writing code and found them to be acceptable. It tells you this by\
    \ saying “Done Compiling” and reporting the size of the sketch to you: 450 bytes.\
    \ The IDE is also telling you that the maximum size is 32,256 bytes, so you still\
    \ have lots of room to make your sketch bigger.\n\nLet’s examine this boilerplate\
    \ code that will form the starting point for every sketch that you ever write.\
    \ There are some new things here. For example, there is the word `void` and some\
    \ curly braces. Let’s deal with `void` first.\n\nThe line `void setup()` means\
    \ that you are defining a function called `setup`. In Arduino, some functions\
    \ are already defined for you, such as `digitalWrite` and `delay`, whereas you\
    \ must or can define others for yourself. `setup` and `loop` are two functions\
    \ that you must define for yourself in every sketch that you write.\n\nThe important\
    \ thing to understand is that here you are not calling `setup` or `loop` like\
    \ you would call `digitalWrite`, but you are actually creating these functions\
    \ so that the Arduino system itself can call them. This is a difficult concept\
    \ to grasp, but one way to think of it is as being similar to a definition in\
    \ a legal document.\n\nMost legal documents have a “definitions” section that\
    \ might say, for example, something like the following:\n\n```\nDefinitions.\n\
    The Author: The person or persons responsible for creating the book\n```\n\nBy\
    \ defining a term in this way—for example, simply using the word “author” as shorthand\
    \ for “The person or persons responsible for creating the book”—lawyers can make\
    \ their documents shorter and more readable. Functions work much like such definitions.\
    \ You define a function that you or the system itself can then use elsewhere in\
    \ your sketches.\n\nGoing back to `void`, these two functions (`setup` and `loop`)\
    \ do not return a value as some functions do, so you have to say that they are\
    \ `void`, using the `void` keyword. If you imagine a function called `sin` that\
    \ performed the trigonometric function of that name, then this function would\
    \ return a value. The value returned to use from the call would be the sine of\
    \ the angle passed as its argument.\n\nRather like a legal definition uses words\
    \ to define a term, we write functions in C that can.\n\n### Blink—Again!\n\n\
    The reason that Arduino has the two functions `setup` and `loop` is to separate\
    \ the things that only need to be done once, when the sketch starts, from the\
    \ things that have to happen continuously.\n\nThe `setup` function will just be\
    \ run once when the sketch starts. Let’s add some code to it that will blink the\
    \ LED. Add the lines to your sketch so that it appears as follows:\n\n```\nvoid\
    \ setup()\n{\n  pinMode(13, OUTPUT);\n  digitalWrite(13, HIGH);\n}\n\nvoid loop()\n\
    {\n}\n```\n\nThe **setup** function itself calls built-in functions, `pinMode`\
    \ and `digitalWrite`. You already know about `digitalWrite`, but `pinMode` is\
    \ new. The function `pinMode` sets a particular pin to be either an input or an\
    \ output. So, turning the LED on is actually a two-stage process. First, you have\
    \ to set pin 13 to be an output, and second, you need to set that output to be\
    \ high (5V).\n\nWhen you run this sketch, on your board you will see that the\
    \ L LED comes on and stays on. This is not very exciting, so let’s at least try\
    \ to make it flash by turning it on and off in the `loop` function rather than\
    \ in the `setup` function.\n\nYou can leave the `pinMode` call in the `setup`\
    \ function because you only need to call it once. The project would still work\
    \ if you moved it into the loop, but there is no need and it is a good programming\
    \ habit to do things only once if you only need to do them once. So modify your\
    \ sketch so that it looks like this:\n\n```\nvoid setup()\n{\n  pinMode(13, OUTPUT);\n\
    }\n\nvoid loop()\n{\n digitalWrite(13, HIGH);\n delay(500);\n digitalWrite(13,\
    \ LOW);\n}\n```\n\nRun this sketch and see what happens. It may not be quite what\
    \ you were expecting. The LED is basically on all the time. Hmm, why should this\
    \ be?\n\nTry stepping through the sketch a line at a time in your head:\n"
