    \ then look at another way of doing it using a counter and an **if** statement.\n\
    \nThe sketch to accomplish this with a **for** loop is, as you can see, a lot\
    \ shorter and easier to maintain than the previous example:\n\n```\n// sketch\
    \ 3-08\nint ledPin = 13;\nint delayPeriod = 100;\n\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT);\n}\n\nvoid loop()\n{\n  for (int i = 0; i < 20; i ++)\n  {\n   digitalWrite(ledPin,\
    \ HIGH);\n   delay(delayPeriod);\n   digitalWrite(ledPin, LOW);\n   delay(delayPeriod);\n\
    \  }\n delay(3000);\n}\n```\n\nThe **for** loop looks a bit like a function that\
    \ takes three arguments, although here those arguments are separated by semicolons\
    \ rather than the usual commas. This is just a quirk of the C language. The compiler\
    \ will soon tell you when you get it wrong.\n\nThe first thing in the parentheses\
    \ after **for** is a variable declaration. This specifies a variable to be used\
    \ as a counter variable and gives it an initial value—in this case, 0.\n\nThe\
    \ second part is a condition that must be true for you to stay in the **loop**.\
    \ In this case, you will stay in the **loop** as long as **i** is less than 20,\
    \ but as soon as **i** is 20 or more, the program will stop doing the things inside\
    \ the **loop**.\n\nThe final part is what to do every time you have done all the\
    \ things in the **loop**. In this case, that is to increment **i** by 1 so that\
    \ it can, after 20 trips around the **loop**, cease to be less than 20 and cause\
    \ the program to exit the **loop**.\n\nTry entering this code and running it.\
    \ The only way to get familiar with the syntax and all that pesky punctuation\
    \ is to type it in and have the compiler tell you when you have done something\
    \ wrong. Eventually, it will all start to make sense.\n\nOne potential downside\
    \ of this approach is that the **loop** function is going to take a long time.\
    \ This is not a problem for this sketch, because all it is doing is flashing an\
    \ LED. But often, the **loop** function in a sketch will also be checking that\
    \ keys have been pressed or that serial communications have been received. If\
    \ the processor is busy inside a **for** loop, it will not be able to do this.\
    \ Generally, it is a good idea to make the **loop** function run as fast as possible\
    \ so that it can be run as frequently as possible.\n\nThe following sketch shows\
    \ how to achieve this:"
