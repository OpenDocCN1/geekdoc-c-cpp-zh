    \ 6-03\n\nconst int inputPin = 5;\n\nvoid setup()\n{\n  pinMode(inputPin, INPUT_PULLUP);\n\
    \  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  int reading = digitalRead(inputPin);\n\
    \  Serial.println(reading);\n  delay(1000);\n}\n```\n\n#### Debouncing\n\nWhen\
    \ you press a pushbutton, you would expect that you would just get a single change\
    \ from 1 (with a pull-up resistor) to 0 as the button is depressed. [Figure 6-8](#15_Chapter_06.xhtml_fig-ch6-8)\
