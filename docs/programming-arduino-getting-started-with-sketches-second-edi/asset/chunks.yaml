    \ for help or advice, the Arduino community on [www.arduino.com/forum](http://www.arduino.com/forum)\
    \ is extremely helpful. You will also find the author on there with the username\
    \ Si.\n\n## INDEX\n\n### Symbols\n\n>= (greater than or equal to), comparison\
    \ operators, [43](#12_Chapter_03.xhtml_page43)\n\n<= (less than or equal to),\
    \ comparison operators, [43](#12_Chapter_03.xhtml_page43)\n\n− (minus), as arithmetic\
