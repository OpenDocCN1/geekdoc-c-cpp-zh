  trans: "\n你的草图应该像这样。将内容拆分成函数可以让代码运行变得容易得多，并且在你在一段时间没有使用它后再次查看时，也更容易维护。\n\n***\n\n\
    ### 总结\n\n除了在本章查看字符串和数组之外，你还构建了这样一个更复杂的 `Morse-translator`，我希望它也能加强你对使用函数构建代码重要性的。\n\
    \n在下一章中，你将学习输入和输出，我们指的是来自 Arduino 的模拟和数字信号的输入与输出。\n\n## 6. 输入与输出\n\nArduino 涉及物理计算，这意味着要在\
    \ Arduino 板板上连接电子设备。因此，你需要了解如何使用用于连接引脚的各种选项。\n\n输出可以是数字的（这仅意味着在 0V 或 5V 之间切换），也可以是模拟的（这允许你将电压设置为\
    \ 0V 到 5V 之间的任何电压——尽管正如我们将会看到的，情况并没那么简单）。\n\n同样，输入也可以是数字的（例如判断按钮是否被按下），也可以是模拟的（例如来自光敏传感器）。\n\
    \n在一部本质上是关于软件而非硬件的书中，我们将尽量避免陷入过多的电子学讨论中。然而，如果你能找到一个万用表和一段短的单芯线，将有助于你理解本章中发生的内容。\n\
    \n如果你对学习更多电子学感兴趣，那么你可能会喜欢我的书 *Hacking Electronics* (TAB/McGraw-Hill, 2013)。\n\n\
    ***\n\n### 数字输出\n\n在前面的章节中，你已经使用了连接在 Arduino 板数字引脚 13 上的 LED。例如，在第 5 章中，你将其用作摩斯密码信号器。Arduino\
    \ 板有大量的数字引脚可用。\n\n让我们尝试 Arduino 上的其他引脚。你将使用数字引脚 4，为了观察发生了什么，你把一些线固定在万用表探线上并将其连接到\
    \ Arduino 上。图 6-1 显示了布局。如果你的万用表带有鳄夹，剥掉几段短单芯线末端的绝缘层并将鳄夹夹在一端，另一端插入 Arduino 插座。如果你的万用表没有鳄夹，请像图\
    \ 6-1 所示，将一个剥皮的线端绕在探头上。\n\n![image](img/fig-ch6-1.jpg)\n\n图 6.1 *用万用表测量输出*。\n\n\
    万用表需要设置为 0–20V 直流 (DC) 范围。负极（黑色）应连接到地 (`GND`) 引脚，正极连接到 `D3`。电线仅连接到探头，并插入 Arduino\
    \ 板上的插针插座中。\n\n加载 sketch 6-01：\n\n```cpp\n//sketch 6-01\n\nconst int outPin =\
    \ 3;\n\nvoid setup()\n{\n  pinMode(outPin, OUTPUT);\n  Serial.begin(9600);\n \
    \ Serial.println(\"Enter 1 or 0\");\n}\n\nvoid loop()\n{\n  if (Serial.available()\
    \ > 0)\n  {\n    char ch = Serial.read();\n    if (ch == '1')\n    {\n      digitalWrite(outPin,\
    \ HIGH);\n    }\n    else if (ch == '0')\n    {\n      digitalWrite(outPin, LOW);\n\
    \    }\n  }\n}\n```\n\n在 sketch 的顶部，你可以看到命令 `pinMode`。你应该对项目中所使用的每个引脚都使用此命令，以便\
    \ Arduino 可以配置连接到该引脚的电子设备为输入或输出，如下例所示：\n\n```cpp\npinMode(outPin, OUTPUT);\n```\n\
    \n正如你可能猜到的那样，`pinMode` 是一个内置函数。它的第一个参数是相关的引脚编号（一个 `int`），第二个参数是模式，它必须是 `INPUT`、`INPUT_PULLUP`\
    \ 或 `OUTPUT` 之一。注意模式名称必须全大写。\n\n此 `loop` 等待来自你电脑串口监视器的 `1` 或 `0` 指令。如果是 `1`，则引脚\
    \ 3 将开启；否则，它将关闭。\n\n将 sketch 上传到你的 Arduino，然后打开串口监视器（如图 6-2 所示）。\n\n![image](img/fig-ch6-2.jpg)\n\
    \n图 6.2 *串口监视器*。\n\n因此，当万用表打开并插入 Arduino 时，当你通过串口监视器按下 1 然后按回，或按下 0 然后按回向板板发送指令时，你应该能看到它的读数在\
    \ 0V 和约 5V 之间变化。图 6-3 显示了从串口监视器发送 1 之后万用表的读数。\n\n![image](img/fig-ch6-3.jpg)\n\
    \n图 6.3 *将输出设置为高电平*。\n\n如果你的项目没有足够的标记为“D”的引脚，你实际上也可以将标记为“A”（模拟）的引脚作为数字输出。要做到这一点，只需使用标记为“A”（模拟）的引脚即可。\n\
    \n***\n\n### 数字输入\n\n数字输入常用的用途是检测开关何时关闭。数字输入可以是开启的或关闭的。\n\n```cpp\n//sketch 6-02\n\
    \nconst int inputPin = 5;\n\nvoid setup()\n{\n  pinMode(inputPin, INPUT);\n  Serial.begin(9600);\n\
    }\n\nvoid loop()\n{\n  int reading = digitalRead(inputPin);\n  Serial.println(reading);\n\
    \  delay(1000);\n}\n```\n\n正如使用输出一样，你需要在 `setup` 函数中告诉 Arduino 你将使用一个引脚作为输入。使用\
    \ `digitalRead` 函数获取数字输入的值。它返回 0 或 1。\n\n所以上传 sketch 并打开串口监视器。你应该每秒看到一个值。将线的一端插入\
    \ D5 插座，并用手指捏住线的另一端，如图 6-4 所示。\n\n![image](img/fig-ch6-4.jpg)\n\n图 6.4 *带有人体天线的数字输入*。\n\
    \n持续捏几秒并观察串口监视器上的文本。你应该会在串口监视器上看到混合的 1 和 0。这是因为 Arduino 板的输入非常敏感。你充当了天线，拾到了电磁干扰。\n\
    \n将你手持线端插入 +5V 插座，如图 6-5 所示。串口监视器中的文本流应变为 1。\n\n![image](img/fig-ch6-5.jpg)\n\n\
    图 6.5 *引脚 5 连接到 +5V*。\n\n现在将原来在 +5V 的端插入 Arduino 上的 `GND` 连接之一。正如你预期的那样，串口监视器现在应该显示\
    \ 0。\n\n输入引脚的一个典型用途是将其连接到开关。图 6-6 显示了你可能如何连接开关。\n\n![image](img/fig-ch6-6.jpg)\n\
    \n图 6.6 *在 Arduino 板上连接开关*。\n"
- fmt: "\nThe problem with this is that if the switch is not closed, then the input\
    \ pin is not connected to anything. It is said to be floating, and could easily\
    \ give you a false reading. You need your input to be more predictable, and the\
    \ way to do this is with what is called a pull-up resistor. You will see later\
    \ how you can enable the Arduino’s built-in series resistors and avoid having\
    \ to use separate resistors. [Figure 6-7](#15_Chapter_06.xhtml_fig-ch6-7) shows\
    \ the standard use of a pull-up resistor. It has the effect that if the switch\
    \ is open, then the resistor pulls up the floating input to 5V. When you press\
    \ the switch and close the contact, the switch overrides the effect of the resistor,\
    \ forcing the input to 0V. One side-effect of this is, while the switch is closed,\
    \ 5V will be across the resistor, causing a current to flow. So, the value of\
    \ the resistor is selected to be low enough to make it immune from any electrical\
    \ interference, but at the same time high enough to prevent excessive current\
    \ drain when the switch is closed.\n\n![image](images/fig-ch6-7.jpg)\n\nFigure\
    \ 6.7 *Switch with a pull-up resistor*.\n\n### Internal Pull-Up Resistors\n\n\
    Fortunately, the Arduino board has software-configurable pull-up resistors built\
    \ into the digital pins. By default, they are turned off. So all you need to do\
    \ to enable the pull-up resistor on pin 5 for sketch 6-02 is to change the pin\
    \ mode from `INPUT` to `INPUT_PULLUP`.\n\nSketch 6-03 is the modified version.\
    \ Upload it to your Arduino board and test it by acting like an antenna again.\
    \ You should find that this time the input stays at 1 in the Serial Monitor.\n\
    \n```\n//sketch 6-03\n\nconst int inputPin = 5;\n\nvoid setup()\n{\n  pinMode(inputPin,\
    \ INPUT_PULLUP);\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  int reading =\
    \ digitalRead(inputPin);\n  Serial.println(reading);\n  delay(1000);\n}\n```\n\
    \n### Debouncing\n\nWhen you press a pushbutton, you would expect that you would\
    \ just get a single change from 1 (with a pull-up resistor) to 0 as the button\
    \ is depressed. [Figure 6-8](#15_Chapter_06.xhtml_fig-ch6-8) shows what can happen\
    \ when you press a button. The metal contacts in the button bounce. So a single\
    \ button press becomes a series of presses that eventually stabilize.\n\n![image](images/fig-ch6-8.jpg)\n\
    \nFigure 6.8 *Oscilloscope trace of a button press*.\n\nAll this happens very\
    \ quickly; the total time span of the button press on the oscilloscope trace is\
    \ only 200 milliseconds. This is a very “ropey” old switch. A new tactile, click-type\
    \ button may not even bounce at all.\n\nSometimes bouncing does not matter. For\
    \ instance, sketch 6-04 will light the LED while the button is pressed. In reality,\
    \ you would not use an Arduino to do this; we are firmly in the realms of theory\
    \ rather than practice here.\n\n```\n//sketch 6-04\n\nconst int inputPin = 5;\n\
    const int ledPin = 13;\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n  pinMode(inputPin,\
    \ INPUT_PULLUP);\n}\n\nvoid loop()\n{\n  int switchOpen = digitalRead(inputPin);\n\
    \  digitalWrite(ledPin, ! switchOpen);\n}\n```\n\nLooking at the `loop` function\
    \ of sketch 6-04, the function reads the digital input and assigns its value to\
    \ a variable `switchOpen`. This is a 0 if the button is pressed and a 1 if it\
    \ isn’t (remember that the pin is pulled up to 1 when the button is not pressed).\n\
    \nWhen you program `digitalWrite` to turn the LED on or off, you need to reverse\
    \ this value. You do this using the `!` or `not` operator.\n\nIf you upload this\
    \ sketch and connect your wire between D5 and GND (see [Figure 6-9](#15_Chapter_06.xhtml_fig-ch6-9)),\
    \ you should see the LED light. Bouncing may be going on here, but it is probably\
    \ too fast for you to see and does not matter.\n\n![image](images/fig-ch6-9.jpg)\n\
    \nFigure 6.9 *Using a wire as a switch*.\n\nOne situation where key bouncing would\
    \ matter is if you were making your switch toggle the LED on and off. That is,\
    \ if you press the button, the LED comes on and stays on, and when you press the\
    \ button again, it turns off. If you had a button that bounced, then whether the\
    \ LED was on or off would just depend on whether you had an odd or even number\
    \ of bounces.\n\nSketch 6-05 just toggles the LED without any attempt at “debouncing.”\
    \ Try it out using your wire as a switch between pin D5 and GND (or use a real\
    \ switch if you have one):\n\n```\n// sketch 6-05\n```\n\n```\nconst int inputPin\
    \ = 5;\nconst int ledPin = 13;\nint ledValue = LOW;\n\nvoid setup() \n{\n  pinMode(inputPin,\
    \ INPUT_PULLUP);\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop() \n{\n  if (digitalRead(inputPin)\
    \ == LOW)\n  {\n     ledValue = ! ledValue;\n  }\n}\n```\n\n[/content] (Wait,\
    \ I noticed the provided text had a strange repetitive/garbled section at the\
    \ end. I have cleaned the primary content based on the logical flow of the first\
    \ half. If you need the garbled part formatted as well, please let me know!) \n\
