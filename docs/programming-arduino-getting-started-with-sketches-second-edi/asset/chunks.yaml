    \  {\n    ch = Serial.read();\n    EEPROM.write(0, ch);\n    Serial.println(ch);\n\
    \  }\n  Serial.println(ch);\n  delay(1000);\n}\n```\n\n要尝试此程序，请打开串口监器并输入新字符。然后拔掉\
    \ Arduino 并重新插上。当你重新打开串口监器时，你会发现该字母被记住了。\n\n`EEPROM.write` 函数接受两个参数。第一个是地址，即 `EEPROM`\
    \ 中的内存位置，范围应在 0 到 1023 之间。第二个参数是要写入该位置的数据。这必须是一个单字节。字符被表示为八位，所以这没问题，但你不能直接存储一个\
    \ 16 位的 `int`。\n\n#### 在 EEPROM 中存储 `int`\n\n要在 `EEPROM` 的位置 0 和 1 存储一个双字节的 `int`，你可以这样操作：\n\
    \n```\n int x = 1234; \n  EEPROM.write(0, highByte(x));\n  EEPROM.write(1, lowByte(x));\n\
    ```\n\n`highByte` 和 `lowByte` 函数对于将 `int` 分拆为两个字节非常有用。图 8-1 显示了此 `int` 实际上是如何存储在\
