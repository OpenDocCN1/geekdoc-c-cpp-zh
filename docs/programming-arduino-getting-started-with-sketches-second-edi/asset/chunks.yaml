    \ 0, 2);\n  int i2 = 0;\n  eeprom_read_block(&i2, 0, 2);\n  Serial.println(i2);\n\
    }\n\nvoid loop() \n}\n```\n\n#### 在 EEPROM 中存储浮点数\n\n如果你有可能是为了显示在串口监器上而格式化的单独字符串，Arduino\
