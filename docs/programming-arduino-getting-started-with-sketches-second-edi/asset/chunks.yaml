    \ are in actual fact very predictable. Occasionally it is useful to be able to\
    \ deliberately make your Arduino unpredictable. For example, you might want to\
    \ make a robot take a “random” path around a room, heading for a random amount\
    \ of time in one direction, turning a random number of degrees, and then setting\
    \ off again. Or, you might be contemplating making an Arduino-based die that gives\
    \ you a random number between one and six.\n\nThe Arduino standard library provides\
    \ you with a feature to do just this. It is the function called **random. random**\
    \ returns an **int** and it can take either one argument or two. If it just takes\
    \ one argument, then it will return a random number between zero and the argument\
    \ minus one.\n\nThe two-argument version produces a random number between the\
    \ first argument (inclusive) and the second argument minus one. Thus **random(1,\
    \ 10)** produces a random number between one and nine.\n\nSketch 7-01 pumps out\
    \ numbers between one and six to the Serial Monitor.\n\n```\n//sketch 7-01\n\n\
    void setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  int number = random(1,\
    \ 7);\n  Serial.println(number);\n  delay(500); \n}\n```\n\nIf you upload this\
    \ sketch to your Arduino and open the Serial Monitor, you will see something like\
    \ [Figure 7-1](#16_Chapter_07.xhtml_fig-ch7-1).\n\n![image](images/fig-ch7-1.jpg)\n\
    \nFigure 7.1 *Random numbers*.\n\nIf you run this a few times you will probably\
    \ be surprised to see that every time you run the sketch, you get the same series\
    \ of “random” numbers.\n\nThe output is not really random; the numbers are called\
    \ *pseudo-random* numbers because they have a random distribution. That is, if\
    \ you ran this sketch and collected a million numbers, you would get pretty much\
    \ the same number of ones, twos, threes, and so on. The numbers are not random\
    \ in the sense of being unpredictable. In fact, it is so against the workings\
    \ of a microcontroller to be random that it just plain can’t do it without some\
    \ intervention from the real world."
