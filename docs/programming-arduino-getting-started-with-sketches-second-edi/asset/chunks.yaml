  trans: "\n`update` 函数在 `bouncer` 对象发生变化时返回 true，表达式的后半部分检查按钮是否变为 `LOW` 状态。\n\n***\n\
    \n### 模拟输出\n\n一些数字引脚——即数字引脚 3、5、6、9、10 和 11——可以提供变量输出，而不仅仅是 5V 或无输出。这些是板载上带有 `~`\
    \ 符号或 “PWM” 标记的引脚。PWM 代表脉冲宽度调制（Pulse Width Modulation），指的是控制输出功率大小的方法。它通过快速地开启和关闭输出来实现这一点。\n\
    \n脉冲始终以相同的速率传输（除引脚 5 和 6 外，所有引脚均为每秒约 500 次，两者为 980 次），但脉冲的长度是变化的。如果你使用 PWM 来控制\
    \ LED 的亮度，那么如果脉冲很长，LED 就会一直亮。然而，如果脉冲很短，LED 实际上只在极小部分时间内亮起。这种变化速度快到观察者甚至无法察觉到 LED\
    \ 是否在闪烁，看起来只是 LED 变亮或变暗了。\n\n在你尝试使用 LED 之前，可以先用万用表测试。将万用表设置为测量 `GND` 和引脚 `D3`\
    \ 之间的电压（参见图 6-11）。\n\n![image](img/fig-ch6-11.jpg)\n\n图 6.11 *测量模拟输出*。\n\n现在将\
    \ sketch 6-08 上传你的板并打开串口监视器（参见图 6-12）。输入 `3` 并按回车。你应该能看到电压表显示约为 3V。然后你可以尝试 0 到\
    \ 5 之间的任何其他电压。\n\n![image](img/fig-ch6-12.jpg)\n\n图 6.12 *设置模拟输出电压*。\n\n```cpp\n\
    //sketch 06-08\n\nconst int outputPin = 3;\n\nvoid setup()\n{\n  pinMode(outputPin,\
    \ OUTPUT);\n  Serial.begin(9600);\n  Serial.println(\"Enter Volts 0 to 5\");\n\
    }\n\nvoid loop()\n{\n  if (Serial.available() > 0)\n  {\n    float volts = Serial.parseFloat();\n\
    \    int pwmValue = volts * 255.0 / 5.0;\n    analogWrite(outputPin, pwmValue);\n\
    \  }\n}\n```\n\n该程序通过将所需的电压（0 到 5）乘以 `255/5` 来确定 0 到 255 之间的 PWM 输出值。（读者可能想参考维基百科获取关于\
    \ PWM 的完整描述。）\n\n你可以使用 `analogWrite` 函数设置输出值，它需要一个 0 到 255 之间的输出值，其中 0 为关闭，255\
    \ 为全功率。这实际上是控制 LED 亮度的一种方法。如果你尝试通过改变 LED 两端的电压来控制亮度，你会发现电压达到约 2V 之前什么都不会发生；然后\
    \ LED 会非常迅速变得很亮。通过 PWM 控制亮度并改变 LED 开启的平均持续时间，你可以实现更具线性的亮度控制。\n\n***\n\n### 模拟输入\n\
    \n数字输入只能告诉你 Arduino 板上特定引脚的开启/关闭状态。然而，模拟输入会根据模拟输入引脚的电压给你一个 0 到 1023 之间的值。\n\n\
    程序使用 `analogRead` 函数读取模拟输入。Sketch 6-09 每半秒在串口监视器中显示模拟引脚 `A0` 的读取值和实际电压，因此请打开串口监视器并观察读取数的出现，如图\
    \ 6-13 所示。\n\n![image](img/fig-ch6-13.jpg)\n\n图 6.13 *使用 Arduino Uno 测量电压*。\n\n\
    ```cpp\n//sketch 6-09\n\nconst int analogPin = 0;\n\nvoid setup()\n{\n  Serial.begin(9600);\n\
    }\n\nvoid loop()\n{\n  int reading = analogRead(analogPin);\n  float voltage =\
    \ reading / 204.6;\n  Serial.print(\"Reading=\");\n  Serial.print(reading);\n\
    \  Serial.print(\"\\t\\tVolts=\");\n  Serial.println(voltage);\n  delay(500);\n\
    }\n```\n\n当你运行此 sketch 时，你会发现读取值发生了很大变化。和数字输入一样，这是因为输入是浮空状态。\n\n取导线的一端插入 `GND`\
    \ 插座，使 `A0` 连接到 `GND`。现在你的读取值应该保持为 `0`。将原来插在 `GND` 的导线末端移动并插入 `5V`，你应该会得到大约 `1023`\
    \ 的读取值，这是最大读取值。因此，如果你将 `A0` 连接到 Arduino 板上的 `3.3V` 插座，Arduino 电压表应该会你大约有 `3.3V`。\n\
    \n`204.6` 的值是 `1023`（最大模拟读取值）除以 `5`（最大电压）。`Serial.print` 用于向串口监视器发送消息而不开始新行，只有当使用\
    \ `Serial.println` 时才会换行。消息中的 `\\t` 用于表示一个制表位，以便数字对齐。\n\n***\n\n### 总结\n\n到此，我们关于\
    \ Arduino 信号输入输出的基础章节就结束了。在下一章中，我们将查看标准 Arduino 库提供的一些功能。\n\n## 7\n\n## 标准 Arduino\
    \ 库\n\n这个库是所有好功能所在的地方。仅凭核心 C 语言你能达到的程度是有限的；你真正需要的是可以在 sketch 中使用的大量函数。\n\n你已经接触了其中相当多几个，例如\
    \ `pinMode`、`digitalWrite` 和 `analogWrite`。但实际上还有很多。你可以使用这些函数进行数学计算、生成随机数、处理位操作、检测输入引脚上的脉冲以及使用所谓的“中断”功能。\n\
    \nArduino 语言基于一个早期的名为 `Wiring` 的库，并补充了另一个名为 `Processing` 的库。Processing 库与 `Wiring`\
    \ 非常相似，但它是基于 Java 语言而不是 C 语言的。Processing 库通过 USB 连接到 Arduino。事实上，你在电脑上运行的 Arduino\
    \ 应用程序是基于 Processing (`www.processing.org/)。\n\n***\n\n### 随机数\n\n尽管使用 PC 的经验如此，计算机实际上是非常可预测的。有时你可能刻意让你的\
    \ Arduino 变得不可预测。例如，你可能想让机器人在房间里沿着“随机”路径移动，朝一个方向随机行驶一段时间，旋转随机的角度，然后再次出发。或者，你可能在考虑一个产生\
    \ 1 到 6 随机数的 Arduino 骰子。\n\nArduino 标准库提供了实现此功能的功能。它是名为 `random` 的函数。`random`\
    \ 返回一个 `int`，它可以接受一个或两个参数。如果它只接受一个参数，则返回 0 到参数减 1 之间的随机数。\n\n两个参数的版本产生第一个参数（包含）到第二个参数减\
    \ 1 之间的随机数。因此 `random(1, 10)` 产生 1 到 9 之间的随机数。\n\nSketch 7-01 向串口监视器输出 1 到 6 之间的数字。\n\
    \n```cpp\n//sketch 7-01\n\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\n\
    {\n  int number = random(1, 7);\n  Serial.println(number);\n  delay(500);\n}\n\
    ```\n\n如果你将此 sketch 上传到 Arduino 并打开串口监视器，你会看到类似[图 7-1`的内容。\n\n![image](img/fig-ch7-1.jpg)\n\
    \n图 7.1 *随机数*。\n\n如果你运行它几次，你可能会惊讶地发现，每次运行 sketch 时，得到的都是相同的“随机”数序列。\n\n输出并不是真正的随机；这些数字被称为*伪随机*（*pseudo-random*）数字，因为它们具有随机分布。也就是说，如果你运行此\
    \ sketch 并收集百万个数字，你得到的 1、2、3 等数字的数量几乎是相同的。这些数字在不可预测的意义上并不是随机的。事实上，随机与微控制器的工作原理是背道而驰的，如果没有现实世界的干预，它根本无法做到这一点。\n\
    \n"
- fmt: "\nYou can provide this intervention to make your sequence of numbers less\
    \ predictable by `seeding` the random number generator. This basically just gives\
    \ it a starting point for the sequence. But, if you think about it, you cannot\
    \ just use `random` to seed the random number generator. A commonly used trick\
    \ is to use the fact that (as discussed in the previous chapter) an analog input\
    \ will float. So you can use the value read from an analog input to seed the random\
    \ number generator.\n\nThe function that does this is called `randomSeed`. Sketch\
    \ 7-02 shows how you can add a bit more randomness to your random number generator.\n\
    \n```\n//sketch 7-02\n\nvoid setup()\n{\n  Serial.begin(9600);\n  randomSeed(analogRead(0));\n\
    }\n\nvoid loop()\n{\n  int number = random(1, 7);\n  Serial.println(number);\n\
    \  delay(500); \n}\n```\n\nTry pressing the Reset button a few times. You should\
    \ now see that your random sequence is different every time.\n\nThis type of random\
    \ number generation could not be used for any kind of lottery. For much better\
    \ random number generation, you would need hardware random number generation,\
    \ which is sometimes based on random occurrences, such as cosmic ray events.\n\
    \n* * *\n\n### Math Functions\n\nOn rare occasions, you will need to do a lot\
    \ of math on an Arduino, over and above the odd bit of arithmetic. But, should\
    \ you need to, there is a big library of math functions available to you. The\
    \ most useful of these functions are summarized in the following table:\n\n| Function\
    \ | Description | Example |\n| --- | --- | --- |\n| `abs` | Returns the unsigned\
    \ value of its argument. | `abs(12) returns 12`, `abs(-12) returns 12` |\n| `constrain`\
    \ | Constrains a number to stop it from exceeding a range. The first argument\
    \ is the number to constrain, the second is the start of the range, and the third\
    \ is the end of the allowed range of numbers. | `constrain(8, 1, 10) returns 8`,\
    \ `constrain(11, 1, 10) returns 10`, `constrain(0, 1, 10) returns 1` |\n| `map`\
    \ | Maps a number in one range into another range. The first argument is the number\
    \ to map, the second and third are the “from” range (or source range), and the\
    \ last two are the “to” range (or destination range). The function is useful for\
    \ remapping analog input values. | `map(x, 0, 1023, 0, 5000)` |\n| `max` | Returns\
    \ the larger of its two arguments. | `max(10, 11) returns 11` |\n| `min` | Returns\
    \ the smaller of its two arguments. | `min(10, 11) returns 10` |\n| `pow` | Returns\
    \ the first argument raised to the power of the second argument. | `pow(2, 5)\
    \ returns 32` |\n| `sqrt` | Returns the square root of a number. | `sqrt(16) returns\
    \ 4` |\n| `sin, cos, tan` | Perform trigonometric functions. They are not often\
    \ used. | |\n| `log` | Calculates the temperature from a logarithmic thermistor\
    \ (for example). | |\n\n* * *\n\n### Bit Manipulation\n\nA bit is a single digit\
    \ of binary information, that is, either 0 or 1. The word `bit` is a contraction\
    \ of `binary digit.` Most of the time, you use `int` variables that actually comprise\
    \ 16 bits. This is a bit wasteful if you only need to store a simple true/false\
    \ value (1 or 0). Actually, unless you are running short of memory, being wasteful\
    \ is less of a problem than creating difficult-to-understand code, but sometimes\
    \ it is useful to be able to pack your data tightly.\n\nEach bit in the `int`\
    \ can be thought of as having a decimal value, and you can find the decimal value\
    \ of the `int` by adding up the values of all the bits that are a 1. So in [Figure\
    \ 7-2](#16_Chapter_07.xhtml_fig-ch7-2), the decimal value of the `int` would be\
    \ 38. Actually, it gets more complicated to deal with negative numbers, but that\
    \ only happens when the leftmost bit becomes a 1.\n\n![image](images/fig-ch7-2.jpg)\n\
    \nFigure 7.2 *An `int`*.\n\nWhen you are thinking about individual bits, decimal\
    \ values do not really work very well. It is very difficult to visualize which\
    \ bits are set in a decimal number such as 123. For that reason, programmers often\
    \ use something called `hexadecimal`, or, more commonly, just `hex`. Hex is number\
    \ base 16. So instead of having digits 0 to 9, you have six extra digits, A to\
    \ F. This means that each hex digit represents four bits. The following table\
    \ shows the relationship among decimal, hex, and binary with the numbers 0 to\
    \ 15:\n\n| Decimal | Hex | Binary (Four Digit) |\n| --- | --- | --- |\n| 0 | 0\
    \ | 0000 |\n| 1 | 1 | 0001 |\n| 2 | 2 | 0010 |\n| 3 | 3 | 0011 |\n| 4 | 4 | 0100\
    \ |\n| 5 | 5 | 0101 |\n| 6 | 6 | 0110 |\n| 7 | 7 | 0111 |\n| 8 | 8 | 1000 |\n\
    | 9 | 9 | 1001 |\n| 10 | A | 1010 |\n| 11 | B | 1011 |\n| 12 | C | 1100 |\n| 13\
    \ | D | 1101 |\n| 14 | E | 1110 |\n| 15 | F | 1111 |\n\nSo, in hex, any `int`\
    \ can be represented as a four-digit hex number. Thus, the binary number 10001100\
    \ would in hex be 8C. The C language has a special syntax for using hex numbers.\
    \ You can assign a hex value to an `int` as follows:\n\n```\nint x = 0x8C;\n```\n\
    \nAs well as using hex notation for numbers, you can also use binary notation\
    \ directly using the prefix ‘0b’. For example:\n\n```\nint x = 0b10001100;\n```\n\
    \nThe Arduino standard library provides some functions that let you manipulate\
    \ bits. For example, `bitRead` returns the value of a particular bit:\n\n```\n\
    int val = bitRead(x, 0);\n```\n\nAs you would expect, the counterpart to `bitRead`\
    \ is `bitWrite`, which takes three arguments. The first is the number to manipulate,\
    \ the second is the bit position, and the third is the bit value:\n\n```\nbitWrite(x,\
    \ 0, 1);\n```\n\n* * *\n\n### Advanced I/O\n\nThere are some useful little functions\
    \ that you can use to make your life easier when performing input/output tasks.\n\
    \n#### Generating Tones\n\nThe `tone` function allows you to generate a square-wave\
    \ signal (see [Figure 7-3](#16_Chapter_07.xhtml_fig-ch7-3)) on one of the output\
    \ pins. The most common reason to do this is to generate an audible tone using\
    \ a loudspeaker or buzzer.\n\n![image](images/fig-ch7-3.jpg)\n\nFigure 7.3 *A\
    \ square-wave signal*.\n\nThe `tone` function takes either two or three arguments.\
    \ The first argument is always the pin number on which the tone is to be generated,\
    \ the second argument is the frequency of the tone in hertz (Hz), and the optional\
    \ final argument is the duration of the tone. If no duration is specified, then\
    \ the tone will continue playing indefinitely, as is the case in sketch 7-03.\
    \ This is why we have put the `tone` function call in `setup` rather than in the\
    \ `loop`.\n\n```\n//sketch 7-03\n\nvoid setup()\n{\n  tone(4, 500);\n}\n\nvoid\
    \ loop() {}\n```\n\nTo stop a tone that is playing, you use the function `noTone`.\
    \ This function has just one argument, which is the pin on which the tone is playing.\n\
    \n#### Feeding Shift Registers\n\nSometimes the Arduino Uno just doesn’t have\
    \ enough pins. When driving a large number of LEDs, for example, a common technique\
    \ is to use a shift register chip. This chip reads data one bit at a time, and\
    \ then when it has enough, it latches all those bits onto a set of outputs (one\
    \ per bit).\n\nTo help you use this technique, there is a handy function called\
    \ `shiftOut`. This function takes four arguments:\n\n- The number of the pin on\
    \ which the bit to be sent will appear.\n- The number of the pin to be used as\
    \ a clock pin. This toggles every time a bit is sent.\n- A flag to determine whether\
    \ the bits will be sent starting with the least significant bit or the most significant\
    \ bit. This should be one of the constants `MSBFIRST` or `LSBFIRST`.\n"
