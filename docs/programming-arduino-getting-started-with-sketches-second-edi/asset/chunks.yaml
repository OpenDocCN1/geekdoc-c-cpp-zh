  trans: "\n此示例代码的结构与其对应的 Arduino 版本（示例 10-02）非常相似。然而，它使用了一组不同的引脚，并包含一个字符串数组用于存储这些引脚的名称，以便生成网页中使用。`pageNameIs`\
    \ 和 `valueOfParam` 工具函数原本用于检查正在访问的页面并从请求中分离参数，但在 ESP8266 版本中是不需要的的，因为库通过 `server.on`\
    \ 机制按页面名处理请求，并允许使用 `server.arg(i)` 直接访问参数值（其中 `i` 是参数的索引位置）。`arg` 函数实际上也提供了获取命名参数的选项。你可以在此处找到的文档中了解更多信息：[`links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html`](http://links2004.github.io/Arduino/d3/d58/class_e_s_p8266_web_server.html)\n\
    \n在这种情况下，`handleRoot` 函数必须构建一个更大的字符串来包含要发送给客户端的 HTML。此示例没有使用 `String` 类，而是展示了一种不同的方法：使用一个字符串缓冲区（`buff`），利用\
    \ C 语言函数 `strcat` 将一系列小字符串连接到一个不断增长的主字符串中（以 `\\0` 终止）。在需要添加诸如引脚值之类的数字之前，这种方法运行良好。此时，则会使用第二个字符串缓冲区（`indexStr`）。然后使用\
    \ C 语言函数 `sprintf` 将数字“打印”到该缓冲区中，然后将其连接到 `buff` 中。\n\n在 Arduino Ethernet 库中，所有缓冲区写入操作都是必要的，因为该库允许逐行向浏览器写入响应，从而消除了在发送回浏览器之前构建整个消息的需要。\n\
    \n* *\n\n### 调用 Web 服务\n\n本章到目前为止的所有示例都将 Arduino 或 Node MCU 作为 Web 服务器，但如果你想让开发板表现得更像\
    \ Web 浏览器，向互联网上其他地方的 Web 服务器发送请求怎么办？\n\n例如，你可以让开发板定期读取温度读数，然后将这些读数发布到某个 Web 服务。在接下来的两个章节中，你将学习如何同时使用普通\
    \ Arduino 和 Node MCU 向流行的 IFTTT (If This Then That) Web 服务发送请求。当服务接收到请求（触发器）时，它将执行一个操作，在这种情况下，将是发送一封包含引脚\
    \ A0 读数的电子邮件。\n\n无论你使用的是 Arduino 还是 Node MCU，你都需要在 [ifttt.com](http://ifttt.com)\
    \ 上创建一个账户，然后创建一个新的“配方”（recipe）。IFTT 有一个非常易用的 Web 界面，大部分内容都是一目自明的。因此，在点击按钮创建新配方后，点击标题“if\
    \ this then that”中的“this”超链接。系统将提示你选择触发器通道。在搜索框中输入 `maker` 以找到 Maker 通道（图标看起来像一个彩色的字母\
    \ *M*）。选择 Maker 通道，并将“Receive a web request”（接收 Web 请求）作为触发器。然后你需要提供一个事件名称（图 10-8）。\n\
    \n![image](img/fig-ch10-8.jpg)\n\n图 10.8 *完成触发字段*。\n\n在 Event Name（事件名称）字段中输入文本\
    \ `arduino_spoke`，然后点击 Create Trigger（创建触发器）。\n\n下一步是定义动作（action）。即指定当配方被触发时会发生什么。对于此示例，我们将让\
    \ IFTTT 向我们发送一封电子邮件，但你可以选择不同的动作通道，让 IFTTT 发送 Tweet、更新 Facebook 状态或其他许多可能的动作。在基础配方运行后，你可能想尝试其他动作。点击标题“if\
    \ this then that”中的“that”链接，并找到“e-mail”（电子邮件）动作通道。选择唯一的可用动作：“Send me an e-mail”（给我发送一封电子邮件）。这将打开图\
    \ 10-9 所示的表单。\n\n![image](img/fig-ch10-9.jpg)\n\n图 10.9 *完成动作字段*。\n\n你可以保持这些字段不变并直接点击\
    \ Create Action（创建动作），也可以使用表单对你将收到的电子邮件进行自定义。你随时可以回来修改动作。点击最后的 Create Recipe（创建配方）按钮，你的新配方将上线并等待来自你的\
    \ Arduino 或 Node MCU 的消息。\n\n你需要采取的最后一个步骤是获取触发事件的密钥，以便只有你可以使用它。要此此，点击 [ifttt.com](http://ifttt.com)\
    \ 主页顶部的“Channels”（通道）链接并搜索 Maker 通道。你将看到类似图 10-10 所示的细节。\n\n![image](img/fig-ch10-10.jpg)\n\
    \n图 10.10 *查找 Maker 通道密钥*。\n\n这里的重要信息是显示“Your key is:”的文本。稍你需要将此密钥粘贴到你的示例代码中。\n\
    \n* *\n\n### Arduino Uno 和 IFTTT\n\nArduino Uno 和 IFTTT\n\n让我们从使用 Arduino 以太网扩展板开始向\
    \ IFTTT 发送消息。这在示例 10-05 中。\n\n```cpp\n#include <SPI.h>\n#include <Ethernet.h>\n\
    \nbyte mac[] = {0xDE, 0xAD, 0xBE, 0xEF, 0xFE, 0xED};\nconst char* host = \"maker.ifttt.com\"\
    ;\nconst int httpPort = 80;\nconst long sendPeriod = 60000L; // 1 分钟\nEthernetClient\
    \ client;\nconst String key = \"YOUR_KEY_HERE\";\n\nvoid setup() {\n  Serial.begin(9600);\n\
    \  Ethernet.begin(mac);\n}\n\nvoid sendToIFTTT(int reading) {\n  client.stop();\n\
    \  Serial.print(\"connecting to \");\n  Serial.println(host);\n  if (!client.connect(host,\
    \ httpPort)) {\n    Serial.println(\"connection failed\");\n    return;\n  }\n\
    \n  String url = \"/trigger/arduino_spoke/key/\";\n  url += key;\n  url += \"\
    ?value1=\" + String(reading);\n\n  String req = String(\"GET \") + url + \" HTTP/1.1\\\
    r\\n\" +\n               \"Host: \" + host + \"\\r\\n\" +\n               \"Connection:\
    \ close\\r\\n\\r\\n\";\n  Serial.println(req);\n  client.print(req);\n}\n\nvoid\
    \ loop() {\n  static long lastReadingTime = 0;\n  long now = millis();\n  if (now\
    \ > lastReadingTime + sendPeriod) {\n    int reading = analogRead(A0);\n    sendToIFTTT(reading);\n\
    \    lastReadingTime = now;\n  }\n  if (client.available()) {\n    Serial.write(client.read());\n\
    \  }\n}\n```\n\n更改常量 `key` 以包含你之前在 IFTTT Maker 通道中找到密钥（见图 10-10）。常量 `sendPeriod`\
    \ 设置了连续向 IFTTT 发送 Web 请求之间的时间。\n\n`loop` 函数每分钟调用一次 `sendToIFTTT` 函数，并将从 A0 读取的数值作为参数传递。`loop`\
    \ 然后检查服务器是否有任何响应，如果有，则将其显示。\n\n### Node MCU ESP8266 板和 IFTTT\n\n向 IFTTT 发送触发器的\
    \ node MCU 变体列在示例 10-06。\n"
