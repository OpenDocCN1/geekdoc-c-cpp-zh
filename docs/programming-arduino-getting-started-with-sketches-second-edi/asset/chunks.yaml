    \ if you have an **int** variable with 32767 and you add 1 to it, you will end\
    \ up with –32768.\n\nUntil you are completely comfortable with these different\
    \ data types, I would recommend sticking to **int**, as it works for pretty much\
    \ everything.\n\n* * *\n\n### Coding Style\n\nThe C compiler does not really care\
    \ about how you lay out your code. For all it cares, you can write everything\
    \ on a single line with semicolons between each statement. However, well-laid-out,\
    \ neat code is much easier to read and maintain than poorly laid-out code. In\
    \ this sense, reading code is just like reading a book: Formatting is important.\n\
    \nTo some extent, formatting is a matter of personal taste. No one likes to think\
    \ that he has bad taste, so arguments about how code should look can become personal.\
    \ It is not unknown for programmers, on being required to do something with someone\
    \ else’s code, to start by reformatting all the code into their preferred style\
    \ of presentation.\n\nAs an answer to this problem, coding standards are often\
    \ laid down to encourage everyone to lay out his or her code in the same way and\
    \ adopt “good practice” when writing programs.\n\nThe C language has a de facto\
    \ standard that has evolved over the years, and this book is generally faithful\
    \ to that standard.\n\n#### Indentation\n\nIn the example sketches that you have\
    \ seen, you can see that we often indent the program code from the left margin.\
    \ So, for example when defining a **void** function, the **void** keyword is at\
    \ the left margin, as is the opening curly brace on the next line, but then all\
    \ the text within the curly braces is indented. The amount of indentation does\
    \ not really matter. Some people use two spaces, some four. You can also press\
    \ TAB to indent. In this book, we use two spaces for indentation.\n\nIf you were\
    \ to have an **if** statement inside a function definition, then once again you\
    \ would add two more spaces for the lines within the curly braces of the **if**\
    \ command, as in the following example:\n\n```\nvoid loop()\n{\n static int count\
    \ = 0;\n count ++;\n if (count == 20)\n {\n   count = 0;\n   delay(3000);\n }\n\
    }\n```\n\nYou might include another **if** inside the first **if**, which would\
    \ add yet another level of indentation, making six spaces from the left margin.\n\
    \nAll of this might sound a bit trivial, but if you ever sort through someone\
    \ else’s badly formatted sketches, you will find it very difficult.\n\n#### Opening\
    \ Braces\n\nThere are two schools of thought as to where to put the first curly\
    \ brace in a function definition, **if** statement, or **for** loop. One way is\
    \ to place the curly brace on the line after the rest of the command, as we have\
    \ in all the examples so far, or put it on the same line, like this:\n\n```\n\
    void loop() {\n static int count = 0;\n count ++;\n if (count == 20) {\n   count\
    \ = 0;\n   delay(3000);\n }\n}\n```\n\nThis style is most commonly used in the\
    \ Java programming language, which shares much of the same syntax as C.\n\n####\
    \ Whitespace\n\nThe compiler ignores spaces, tabs, and new lines, apart from using\
    \ them as a way of separating the “tokens” or words in your sketch. Thus the following\
    \ example will compile without a problem:\n\n```\nvoid loop() {static int \ncount=0;count++;if(\n\
    count==20){count=0;\ndelay(3000);}}\n```\n\nThis will work, but good luck trying\
    \ to read it.\n\nWhere assignments are made, some people will write the following:\n\
    \n```\nint a = 10;\n```\n\nBut others will write the following:\n\n```\nint a=10;\n\
    ```\n\nWhich of these two styles you use really does not matter, but it is a good\
    \ idea to be consistent. I use the first form.\n\n#### Comments\n\nComments are\
    \ text that is kept in your sketch along with all the real program code, but which\
    \ actually performs no programming function whatsoever. The sole purpose of comments\
    \ is to be a reminder to you or others as to why the code is written as it is.\
    \ A comment line may also be used to present a title.\n\nThe compiler will completely\
    \ ignore any text that is marked as being a comment. We have included comments\
    \ as titles at the top of many of the sketches in the book so far.\n\nThere are\
    \ two forms of syntax for comments:\n\n♦ The single line comment that starts with\
    \ **//** and finishes at the end of the line\n\n♦ The multiline comment that starts\
    \ with a **/*** and ends with a ***/**\n\nThe following is an example using both\
    \ forms of comments:\n\n```\n/* A not very useful loop function.\nWritten by:\
    \ Simon Monk\nTo illustrate the concept of comments\n*/\nvoid loop() {\n static\
    \ int count = 0;\n count ++; // a single line comment\n if (count == 20) {\n \
    \  count = 0;\n   delay(3000);\n }\n}\n```\n\nIn this book, I mostly stick to\
    \ the single-line comment format.\n\nGood comments help explain what is happening\
    \ in a sketch or how to use the sketch. They are useful if others are going to\
    \ use your sketch, but equally useful to yourself when you are looking at a sketch\
    \ that you have not worked on for a few weeks.\n\nSome people are told in programming\
    \ courses that the more comments, the better. Most seasoned programmers will tell\
    \ you that well-written code requires very little in the way of comments because\
    \ it is self-explanatory. You should use comments for the following reasons:\n\
    \n♦ To explain anything you have done that is a little tricky or not immediately\
    \ obvious"
