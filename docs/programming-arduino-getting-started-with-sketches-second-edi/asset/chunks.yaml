  trans: "\n\n- 用于描述用户需要执行的但不属于程序本身的操作；例如，`// this pin should be connected to the\
    \ transistor controlling the relay`\n- 用于给自己留字记；例如，`// todo: tidy this - it’s\
    \ a mess`\n\n最后这一点说明了在注释中使用 `todo` 的一种实用技巧。程序员经常在代码中放置 `todo`，以提醒自己以后需要做的事情。他们可以随时使用集成开发环境\
    \ (IDE) 中的搜索功能来查找程序中所有出现 `// todo` 的地方。\n\n以下**不是**你应该使用注释的理由的良好范例：\n\n- 陈述显而易见的事实；例如，`a\
    \ = a + 1; // add 1 to a.`\n- 解释写得糟糕的代码。不要对它写注释；从一开始就应该把它写清楚。\n\n***\n\n### 结论\n\
    \n这一章的内容偏向于理论。你已经必须吸收一些新的抽象概念，涉及到如何将我们的草图组织成函数，以及采用一种长远来看可以为你节省时间的编程风格。\n\n在下一章中，你可以开始应用所学到的知识，并查看更好的结构化数据和使用文本字符串的方法。\n\
    \n# 5\n\n## 数组与字符串\n\n在阅读了第 4 章 后，你对如何组织草图以让生活变得更轻松有了合理的理解。如果说优秀的程序员非常喜欢的一样东西，那就是轻松的生活。现在，我们的注意力将转向你在草图中使用的数据。\n\
    \nNiklaus Wirth 编写的 *Algorithms + Data Structures = Programs* (Prentice-Hall,\
    \ 1976) 一书已经出版了很长时间，但它仍然捕捉到了计算机科学特别是编程的精髓。我强烈向任何发现自己掉进“编程坑”的人推荐这本书。它还捕捉到了这样一个观点：要写好一个程序，你既需要考虑算法（你做什么），也需要考虑你使用的数据结构。\n\
    \n你已经学习了 `loop`、`if` 语句以及所谓的 Arduino 编程的“算法”方面；现在你将转向转向如何组织你的数据。\n\n***\n\n###\
    \ 数组\n\n数组是包含值列表的一种方式。到目前为止，你遇到的变量只包含一个单一值，通常是一个 `int`。相比之下，数组包含一个值列表，你可以通过它们在列表中的位置来访问其中的任何一个值。\n\
    \nC 语言与大多数编程语言一样，索引位置从 0 开始而不是 1。这意味着第一个元素实际上是元素 0。\n\n为了说明数组的使用，我们可以创建一个示例程序，使用\
    \ Arduino 板板内置的 LED 重复闪烁摩斯密码形式的“SOS”。\n\n摩斯密码曾是 19 世纪和 20 世纪重要的通信方法。由于它将字母编码为一系列长点和短点，摩斯密码可以通过电报线、无线电链路以及信号灯进行发送。字母“SOS”（通常被认为意思是“救救灵魂”）仍然被公认为国际求救信号。\n\
    \n字母“S”由三个短闪光（点）表示，字母“O”由三个长闪光（电划线）表示。你将使用一个 `int` 数组来保存你将进行的每次闪烁的持续时间。然后你可以使用\
    \ `for` 循环遍历数组中的每一项，产生相应持续时间的闪烁。\n\n首先，让我们来看看你将如何创建一个包含这些持续时间的 `int` 数组。\n\n```cpp\n\
    int durations[] = {200, 200, 200, 500, 500, 500, 200, 200, 200};\n```\n\n你通过在变量名后放置\
    \ `[]` 来指示该变量是一个数组。\n\n在这种情况下，你将在创建数组时设置持续时间的值。执行此操作的语法是使用大括号，然后是每个用逗号隔开的值。不要忘记行末的分号。\n\
    \n你可以使用方括号符号访问数组的任何给定元素。所以，如果你想获取数组的第一个元素，可以这样写：\n\n```cpp\ndurations[0]\n```\n\
    \n为了说明这一点，让我们创建一个数组，然后将其所有值打印到串口监视器（Serial Monitor）：\n\n```cpp\n// sketch 5-01\n\
    \nint durations[] = {200, 200, 200, 500, 500, 500, 200, 200, 200};\n\nvoid setup()\n\
    {\n  Serial.begin(9600); \n  for (int i = 0; i < 9; i++)\n  {\n    Serial.println(durations[i]);\n\
    \  }\n}\n\nvoid loop() {}\n```\n\n注意，你也可以像普通变量一样对数组使用 `const` 关键字，只要你不打算在草图中修改该数组。\n\
    \n将草图上传到你的板，然后打开串口监视器。如果一切正常，你会看到类似图 5-1 的内容。\n\n![image](img/fig-ch5-1.jpg)\n\
    \n图 5.1 *串口监视器显示输出*\n\n（此处省略重复的图注说明，保持格式一致）\n\n### 字符串数组\n\n在编程世界中，“string”（字符串）一词与用来打结的细长物体无关。字符串是字符序列。它是让你你的\
    \ Arduino 处理文本的方式。例如，草图 5-03 会每秒向串口监视器发送一次文本“Hello”。\n\n"
- fmt: "\n```\n// sketch 5-03\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\n\
    {\n  Serial.println(\"Hello\");\n  delay(1000);\n}\n```\n\n### String Literals\n\
    \nString literals are enclosed in double quotation marks. They are literal in\
    \ the sense that the string is a constant, rather like the `int` 123.\n\nAs you\
    \ would expect, you can put strings in a variable. There is also an advanced string\
    \ library, but for now you will use standard C strings, such as the one in sketch\
    \ 5-03.\n\nIn C, a string literal is actually an array of the type `char`. The\
    \ type `char` is a bit like `int` in that it is a number, but that number is between\
    \ 0 and 127 and represents one character. The character may be a letter of the\
    \ alphabet, a number, a punctuation mark, or a special character such as a tab\
    \ or a line feed. These number codes for letters use a standard called ASCII.\
    \ Some of the most commonly used ASCII codes are shown in [Table 5-1](#14_Chapter_05.xhtml_tab-ch5-1).\n\
    \n| Character | ASCII Code (Decimal) |\n| --- | --- |\n| a–z | 97–122 |\n| A–Z\
    \ | 65–90 |\n| 0–9 | 48–57 |\n| space | 32 |\n\nTable 5-1 *Common ASCII Codes*\n\
    \nThe string literal “Hello” is actually an array of characters, as shown in [Figure\
    \ 5-3](#14_Chapter_05.xhtml_fig-ch5-3).\n\n![image](images/fig-ch5-3.jpg)\n\n\
    Figure 5.3 *The string literal “Hello”*.\n\nNote that the string literal has a\
    \ special null character `\\0` at the end. This character is used to indicate\
    \ the end of the string.\n\n### String Variables\n\nAs you would expect, string\
    \ variables are very similar to array variables, except that there is a useful\
    \ shorthand method for defining their initial value.\n\n```c\nchar name[] = \"\
    Hello\";\n```\n\nThis defines an array of characters and initializes it to the\
    \ word “Hello.” It will also add a final null value (ASCII 0) to mark the end\
    \ of the string.\n\nAlthough the preceding example is most consistent with what\
    \ you know about writing arrays, it would be more common to write the following:\n\
    \n```c\nchar *name = \"Hello\";\n```\n\nThis is equivalent, and the `*` indicates\
    \ a pointer. The idea is that `name` points to the first `char` element of the\
    \ `char` array. That is the memory location that contains the letter *H.*\n\n\
    You can rewrite sketch 5-03 to use a variable as well as a string constant, as\
    \ follows:\n\n```c\n// sketch 5-04\nchar message[] = \"Hello\";\n\nvoid setup()\n\
    {\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  Serial.println(message);\n  delay(1000);\n\
    }\n```\n\n### A Morse Code Translator\n\nLet’s put together what you have learned\
    \ about arrays and strings to build a more complex sketch that will accept any\
    \ message from the Serial Monitor and flash it out on the built-in LED.\n\nThe\
    \ letters in Morse code are shown in [Table 5-2](#14_Chapter_05.xhtml_tab-ch5-2).\n\
    \n| A | .- | N | -. | 0 | ----- |\n| B | -… | O | --- | 1 | .---- |\n| C | -.-.\
    \ | P | .--. | 2 | ..--- |\n| D | -.. | Q | --.- | 3 | …-- |\n| E | . | R | .-.\
    \ | 4 | ….- |\n| F | ..-. | S | … | 5 | ….. |\n| G | -. | T | - | 6 | -…. |\n\
    | H | …. | U | ..- | 7 | --… |\n| I | .. | V | …- | 8 | ---.. |\n| J | .--- |\
    \ W | .-- | 9 | ----. |\n| K | -.- | X | -..- | | | |\n| L | .-.. | Y | -.-- |\
    \ | | |\n| M | -- | Z | --.. | | | |\n\nTable 5-2 *Morse Code Letters*\n\nSome\
    \ of the rules of Morse code are that a dash is three times as long as a dot,\
    \ the time between each dash or dot is equal to the duration of a dot, the space\
    \ between two letters is the same length as a dash, and the space between two\
    \ words is the same duration as seven dots.\n\nFor this project, we will not worry\
    \ about punctuation, although it would be an interesting exercise for you to try\
    \ adding this to the sketch. For a full list of all the Morse characters, see\
    \ [en.wikipedia.org/wiki/Morse_code](http://en.wikipedia.org/wiki/Morse_code).\n\
    \n#### Data\n\nYou are going to build this example a step at a time, starting\
    \ with the data structure that you are going to use to represent the codes.\n\n\
    It is important to understand that there is no one solution to this problem. Different\
    \ programmers will come up with different ways to solve it. So, it is a mistake\
    \ to think to yourself, “I would never have come up with that.” Well, no, quite\
    \ possibly you would come up with something different and better. Everyone thinks\
    \ in different ways, and this solution happens to be.\n\n#### Globals and Setup\n\
    \nYou need to define a couple of global variables: one for the delay period for\
    \ a dot, and one to define which pin the LED is attached to:\n\n```c\nconst int\
    \ dotDelay = 200;\nconst int ledPin = 13;\n```\n\nThe `setup` function is pretty\
    \ simple; you just need to set `ledPin` as an output and set up serial port:\n\
    \n```c\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n  Serial.begin(9600);\n}\n\
    ```\n\n#### The loop Function\n\nYou are now going to start on the real processing\
    \ work in the `loop` function. The algorithm for this function is as follows:\n\
    \n- If there is a character to read from USB:\n- If it’s a letter, flash it using\
    \ the `letters` array\n- If it’s a number, flash it using the `numbers` array.\n\
    - If it’s a space, flash four times the dot delay.\n\nThat’s all. You should not\
    \ think too far ahead. This algorithm represents what you want to do, or what\
    \ your *intention* is, and this style of programming is called *programming by\
    \ intention*.\n\nIf you write this algorithm in C, it will look like this:\n\n\
    ```c\nvoid loop()\n{\n  char ch;\n  if (Serial.available() > 0)\n  {\n    ch =\
    \ Serial.read();\n    if (ch >= 'a' && ch <= 'z')\n    {\n      flashSequence(letters[ch\
    \ - 'a']);\n    }\n    else if (ch >= 'A' && ch <= 'Z')\n    {\n      flashSequence(letters[ch\
    \ - 'A']);\n    }\n    else if (ch >= '0' && ch <= '9')\n    {\n      flashSequence(numbers[ch\
    \ - '0']);\n    }\n    else if (ch == ' ')\n    {\n     delay(dotDelay * 4); \
    \     // gap between words\n    }\n  }\n}\n```\n\nThere are a few things here\
    \ that need explaining. First, there is `Serial.available()`. To understand this,\
    \ you first need to know a little about how an Arduino communicates with your\
    \ computer over USB. [Figure 5-4](#14_Chapter_05.xhtml_fig-ch5-4) summarizes this\
    \ process.\n\n![image](images/fig-ch5-4.jpg)\n\nFigure 5.4 *Serial communication\
    \ with an Arduino*.\n"
  raw: "```\n// sketch 5-03\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\n\
    {\n  Serial.println(\"Hello\");\n  delay(1000);\n}\n```\n\n#### String Literals\n\
    \nString literals are enclosed in double quotation marks. They are literal in\
    \ the sense that the string is a constant, rather like the **int** 123.\n\nAs\
    \ you would expect, you can put strings in a variable. There is also an advanced\
    \ string library, but for now you will use standard C strings, such as the one\
    \ in sketch 5-03.\n\nIn C, a string literal is actually an array of the type **char**.\
    \ The type **char** is a bit like **int** in that it is a number, but that number\
    \ is between 0 and 127 and represents one character. The character may be a letter\
    \ of the alphabet, a number, a punctuation mark, or a special character such as\
    \ a tab or a line feed. These number codes for letters use a standard called ASCII.\
    \ Some of the most commonly used ASCII codes are shown in [Table 5-1](#14_Chapter_05.xhtml_tab-ch5-1).\n\
    \n| **Character** | **ASCII Code (Decimal)** |\n\n| --- | --- |\n\n| a–z | 97–122\
    \ |\n\n| A–Z | 65–90 |\n\n| 0–9 | 48–57 |\n\n| space | 32 |\n\nTable 5-1 *Common\
    \ ASCII Codes*\n\nThe string literal “Hello” is actually an array of characters,\
    \ as shown in [Figure 5-3](#14_Chapter_05.xhtml_fig-ch5-3).\n\n![image](images/fig-ch5-3.jpg)\n\
    \nFigure 5.3 *The string literal “Hello”*.\n\nNote that the string literal has\
    \ a special null character (\\0) at the end. This character is used to indicate\
    \ the end of the string.\n\n#### String Variables\n\nAs you would expect, string\
    \ variables are very similar to array variables, except that there is a useful\
    \ shorthand method for defining their initial value.\n\n```\nchar name[] = \"\
    Hello\";\n```\n\nThis defines an array of characters and initializes it to the\
    \ word “Hello.” It will also add a final null value (ASCII 0) to mark the end\
    \ of the string.\n\nAlthough the preceding example is most consistent with what\
    \ you know about writing arrays, it would be more common to write the following:\n\
    \n```\nchar *name = \"Hello\";\n```\n\nThis is equivalent, and the ***** indicates\
    \ a pointer. The idea is that **name** points to the first **char** element of\
    \ the **char** array. That is the memory location that contains the letter *H.*\n\
    \nYou can rewrite sketch 5-03 to use a variable as well as a string constant,\
    \ as follows:\n\n```\n// sketch 5-04\nchar message[] = \"Hello\";\n\nvoid setup()\n\
    {\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  Serial.println(message);\n  delay(1000);\n\
    }\n```\n\n* * *\n\n### A Morse Code Translator\n\nLet’s put together what you\
    \ have learned about arrays and strings to build a more complex sketch that will\
    \ accept any message from the Serial Monitor and flash it out on the built-in\
    \ LED.\n\nThe letters in Morse code are shown in [Table 5-2](#14_Chapter_05.xhtml_tab-ch5-2).\n\
    \n| A | .- | N | -. | 0 | ----- |\n\n| B | -… | O | --- | 1 | .---- |\n\n| C |\
    \ -.-. | P | .--. | 2 | ..--- |\n\n| D | -.. | Q | --.- | 3 | …-- |\n\n| E | .\
    \ | R | .-. | 4 | ….- |\n\n| F | ..-. | S | … | 5 | ….. |\n\n| G | -. | T | -\
    \ | 6 | -…. |\n\n| H | …. | U | ..- | 7 | --… |\n\n| I | .. | V | …- | 8 | ---..\
    \ |\n\n| J | .--- | W | .-- | 9 | ----. |\n\n| K | -.- | X | -..- |  |  |\n\n\
    | L | .-.. | Y | -.-- |  |  |\n\n| M | -- | Z | --.. |  |  |\n\nTable 5-2 *Morse\
    \ Code Letters*\n\nSome of the rules of Morse code are that a dash is three times\
    \ as long as a dot, the time between each dash or dot is equal to the duration\
    \ of a dot, the space between two letters is the same length as a dash, and the\
    \ space between two words is the same duration as seven dots.\n\nFor this project,\
    \ we will not worry about punctuation, although it would be an interesting exercise\
    \ for you to try adding this to the sketch. For a full list of all the Morse characters,\
    \ see [en.wikipedia.org/wiki/Morse_code](http://en.wikipedia.org/wiki/Morse_code).\n\
    \n#### Data\n\nYou are going to build this example a step at a time, starting\
    \ with the data structure that you are going to use to represent the codes.\n\n\
    It is important to understand that there is no one solution to this problem. Different\
    \ programmers will come up with different ways to solve it. So, it is a mistake\
    \ to think to yourself, “I would never have come up with that.” Well, no, quite\
    \ possibly you would come up with something different and better. Everyone thinks\
    \ in different ways, and this solution happens to be the one that first popped\
    \ into the author’s head.\n\nRepresenting the data is all about finding a way\
    \ of expressing [Table 5-2](#14_Chapter_05.xhtml_tab-ch5-2) in C. In fact, you\
    \ are going to split the data into two tables: one for the letters, and one for\
    \ the numbers. The data structure for the letters is as follows:\n\n```\nchar*\
    \ letters[] = {\n  \".-\", \"-...\", \"-.-.\", \"-..\", \".\", // A-I\n  \"..-.\"\
    , \"--.\", \"....\", \"..\", \n  \".---\", \"-.-\", \".-..\", \"--\", \"-.\",\
    \ // J-R\n  \"---\", \".--.\", \"--.-\", \".-.\", \n  \"...\", \"-\", \"..-\"\
    , \"...-\", \".--\", // S-Z\n  \"-..-\", \"-.--\", \"--..\" \n};\n```\n\nWhat\
    \ you have here is an array of string literals. So, because a string literal is\
    \ actually an array of **char**, what you actually have here is an array of arrays—something\
    \ that is perfectly legal and really quite useful.\n\nThis means that to find\
    \ Morse for *A*, you would access **letters[0]**, which would give you the string\
    \ **.-**. This approach is not terribly efficient, because you are using a whole\
    \ byte (eight bits) of memory to represent a dash or a dot, which could be represented\
    \ in a bit. However, you can easily justify this approach by saying that the total\
    \ number of bytes is still only about 90 and we do have 2048 bytes to play with.\
    \ Equally importantly, it makes the code easy to understand.\n\nNumbers use the\
    \ same approach:\n\n```\n char* numbers[] = {\n    \"-----\", \".----\", \"..---\"\
    , \"...--\", \"....-\",\n  \".....\", \"-....\", \"--...\", \"---..\", \"----.\"\
    };\n```\n\n#### Globals and Setup\n\nYou need to define a couple of global variables:\
    \ one for the delay period for a dot, and one to define which pin the LED is attached\
    \ to:\n\n```\nconst int dotDelay = 200;\nconst int ledPin = 13;\n```\n\nThe **setup**\
    \ function is pretty simple; you just need to set the **ledPin** as an output\
    \ and set up the serial port:\n\n```\nvoid setup()                \n{\n  pinMode(ledPin,\
    \ OUTPUT);\n  Serial.begin(9600);\n}\n```\n\n#### The loop Function\n\nYou are\
    \ now going to start on the real processing work in the **loop** function. The\
    \ algorithm for this function is as follows:\n\n♦ If there is a character to read\
    \ from USB:\n\n♦ If it’s a letter, flash it using the letters array.\n\n♦ If it’s\
    \ a number, flash it using the numbers array.\n\n♦ If it’s a space, flash four\
    \ times the dot delay.\n\nThat’s all. You should not think too far ahead. This\
    \ algorithm represents what you want to do, or what your *intention* is, and this\
    \ style of programming is called *programming by intention*.\n\nIf you write this\
    \ algorithm in C, it will look like this:\n\n```\nvoid loop()                \
    \    \n{\n  char ch;\n  if (Serial.available() > 0)     \n  {\n    ch = Serial.read();\
    \        \n    if (ch >= 'a' && ch <= 'z')\n    {\n      flashSequence(letters[ch\
    \ - 'a']);\n    }\n    else if (ch >= 'A' && ch <= 'Z')\n    {\n      flashSequence(letters[ch\
    \ - 'A']);\n    }\n    else if (ch >= '0' && ch <= '9')\n    {\n      flashSequence(numbers[ch\
    \ - '0']);\n    }\n    else if (ch == ' ')\n    {\n     delay(dotDelay * 4); \
    \     // gap between words  \n    }\n  }\n}\n```\n\nThere are a few things here\
    \ that need explaining. First, there is **Serial.available()**. To understand\
    \ this, you first need to know a little about how an Arduino communicates with\
    \ your computer over USB. [Figure 5-4](#14_Chapter_05.xhtml_fig-ch5-4) summarizes\
    \ this process.\n\n![image](images/fig-ch5-4.jpg)\n\nFigure 5.4 *Serial communication\
    \ with an Arduino*."
