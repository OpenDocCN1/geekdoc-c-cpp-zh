    恭喜你，现在已经准备好为你的 Arduino 编程了。不过，让我们先浏览一下 Arduino 程序。


    * * *


    ### Arduino 应用


    Arduino 中的 sketch 就像文字处理器中的文档。你可以打开它们并将部分内容从一个复制到另一个。因此，你在 `File`（文件）菜单中看到了 `Open`（打开）、`Save`（保存）和
    `Save As`（另存为）选项。你通常不会使用 `Open`，因为 Arduino 程序有一个 `Sketchbook`（项目库）的概念，你所有的 sketch
    都被整齐地组织在文件夹中。你可以从 `File` 菜单访问 `Sketchbook`。由于你是第一次安装 Arduino 程序，在你创建一些 sketch
    之前，你的 `Sketchbook` 将是空的。


    正如你所看到的，Arduino 程序带有一些示例 sketch，这些示例非常有用。在修改了 Blink 示例 sketch 后，如果你尝试保存它，会收到一条消息说：“某些文件标记为只读，因此你需要将此
    sketch 保存到其他位置。”


    现在试一下。接受默认位置，但将文件名改为 `MyBlink`，如图 2-8 所示。


    ![image](img/fig-ch2-8.jpg)


    图 2.8 *保存 Blink 的副本*。


    现在，如果你进入 `File` 菜单并点击 `Sketches`，你将看到 `MyBlink` 是列出的 sketch 之一。如果你查看电脑的文件系统，你会发现，
    PC 上，sketch 被写入了 `My Documents\Arduino`，而在 Mac 或 Linux 上，它位于 `Documents/Arduino`。


    本书中使用的所有 sketch 都可以从 [www.arduinobook.com](http://www.arduinobook.com) 下载 zip
    压缩包（`Programming_Arduino.zip`）。我建议现在就是下载此文件并将其解压到包含 sketch 的 Arduino 文件夹的时候。换句话说，当你解压文件夹后，你的
    Arduino 文件夹中应该有两个文件夹：一个新保存的 `MyBlink`，另一个名为 `Programming Arduino` 的文件夹（参见图 2-9）。`Programming
    Arduino` 文件夹将包含所有 sketch，按章节编号，例如 sketch `03-01` 是第 3 章的第 1 个 sketch。


    ![image](img/fig-ch2-9.jpg)


    图 2.9 *安装书中的 sketch*。


    在你退出 Arduino 程序并重启它之前，这些 sketch 不会出现在你的 `Sketchbook` 菜单中。现在操作吧。然后你的 `Sketchbook`
    菜单应该看起来像图 2-10 所示。


    ![image](img/fig-ch2-10.jpg)


    图 2.10 *安装了书中的 sketch 的 Sketchbook*。


    * * *


    ### 总结


    你的环境已设置完毕并准备就绪。


    在下一章中，我们将学习 Arduino 使用的一些 C 语言基本原理，并开始编写代码。


    ## 3


    ## C 语言基础


    用于为 Arduino 的编程语言称为 C 语言。在本章中，你将了解 C 语言的基础。你作为 Arduino 程序员在开发的每个 sketch 中都将用到在这里学到的知识。为了充分利用
    Arduino，你需要理解这些基础知识。


    * * *


    ### 编程


    人们精通多种语言并不稀奇。事实上，你学得越多，学习口语语言似乎就越容易，因为你开始发现语法和词汇的共同模式。编程语言也是如此。所以，如果你用过任何其他编程语言，你很快就能学会
    C。


    好消息是，编程语言的语法非常规律，一旦你掌握了几个概念，就会习惯。编程语言的词汇比口语语言小得多，而且由于它是写出来的而不是说的，所以随时都可以查阅。


    最好将程序（在 Arduino 中称为 sketch）看作按照书写顺序执行的指令列表。例如，假设你写下：


    ```

    digitalWrite(13, HIGH);

    delay(500);

    digitalWrite(13, LOW);

    ```


    这三行代码每行都会执行操作。第一行将引脚 13 设置为 `HIGH`。这是板上带有 LED 的引脚，所以此时 LED 会亮起。第二行只需等待 500 毫秒（半秒），然后第三行将
    LED 再次关闭。所以这三行代码实现了 LED 闪烁一次的目标。


    你已经看到用法奇怪的标点符号以及没有空格的单词。许多新编程者的困扰在于：“我知道我想做什么，但不知道写什么！”别担心，一切都会解释的。


    首先，让我们处理标点符号和单词的构造方式。这些都是所谓的语言语法的一部分。大多数语言对语法要求极其精确，其中一个主要规则是名称必须是单个单词。也就是说，它们不能包含空格。所以，`digitalWrite`
    是某个东西的名字。它是内置函数（你稍后会学习更多函数）的名字，负责设置输出引脚的工作。你不仅要在名称中避免空格，而且名称还区分大小写。所以你必须写 `digitalWrite`，而不是
    `DigitalWrite` 或 `Digitalwrite`。


    `digitalWrite` 函数需要知道设置哪个引脚，以及是将该引脚设置为 `HIGH` 还是 `LOW`。这两个信息被称为参数，当函数被*调用*时，它们被*传递*给函数。参数必须封装在括号内，并用逗号分隔。


    惯例是将左括号紧跟在函数名的最后一个字母后面，并在逗号后的下一个参数前留一个空格。不过，如果你愿意，可以在括号内随意添加空格字符。


    如果函数只有一个参数，那么就不需要逗号。


    注意每行都以分号结尾。如果使用句号会更符合逻辑，因为分号标记了一个命令的结束，有点像句子的结束。


