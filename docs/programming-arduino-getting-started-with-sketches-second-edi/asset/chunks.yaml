- fmt: "\nWhen writing to `EEPROM`, remember that even uploading a new sketch will\
    \ not clear the `EEPROM`, so you may have leftover values in there from a previous\
    \ project. Sketch 8-06 resets all the contents of `EEPROM` to zeros:\n\n```\n\
    // sketch 8-06\n#include <EEPROM.h>\n\nvoid setup()                 \n{\n  Serial.begin(9600);\n\
    \  Serial.println(\"Clearing EEPROM\")a;\n  for (int i = 0; i < 1024; i++)\n \
    \ {\n    EEPROM.write(i, 0);\n  }\n  Serial.println(\"EEPROM Cleared\");\n}\n\n\
    void loop()                    \n{\n}\n```\n\nAlso be aware that you can write\
    \ to an `EEPROM` location only about 100,000 times before it will become unreliable.\
    \ So only write a value back to `EEPROM` when you really need to. `EEPROM` is\
    \ also quite slow, taking about 3 milliseconds to write a byte.\n\n***\n\n###\
    \ Compression\n\nWhen saving data to `EEPROM` or when using `PROGMEM`, you will\
    \ sometimes find that you have more to save than you have room to save it. When\
    \ this happens, it is worth finding the most efficient way of representing the\
    \ data.\n\n#### Range Compression\n\nYou may have a value for which on the face\
    \ of it you need an `int` or a `float` that is 16-bit. For example, to represent\
    \ a temperature in degrees Celsius, you might use a `float` value such as 20.25.\
    \ When you are storing that into `EEPROM`, life would be so much easier if you\
    \ could fit it into a single byte, and you could store twice as much as if you\
    \ used a `float`.\n\nOne way that you can do this is to change the data before\
    \ you store it. Remember that a byte will allow you to store a positive number\
    \ between 0 and 255. So if you only cared about the temperature to the nearest\
    \ degree Celsius, then you could simply convert the `float` to an `int` and discard\
    \ the part after the decimal point. The following example shows how to do this:\n\
    \n```\nint tempInt = (int)tempFloat;\n```\n\nThe variable `tempFloat` contains\
    \ the floating point value. The `(int)` command is called a *type cast* and is\
    \ used to convert a variable from one type to another compatible type. In this\
    \ case, the type cast converts the `float` of (for example) 20.25 to an `int`\
    \ that will simply truncate the number to 20.\n\nIf you know that the highest\
    \ temperature that you care about is 60 degrees Celsius and that the lowest is\
    \ 0 degrees Celsius, then you could multiply every temperature by 4 before converting\
    \ it to a byte and saving it. Then when you read the data back from `EEPROM`,\
    \ you can divide by 4 to get a value that has a precision of 0.25 of a degree.\n\
    \nThe following code example (sketch 8-07) saves such a temperature into `EEPROM`,\
    \ then reads it back and displays it in the Serial Monitor as proof:\n\n```\n\
    //sketch 8-07\n\n#include <EEPROM.h>\n\nvoid setup()\n{\n  float tempFloat = 20.75;\n\
    \  byte tempByte = (int)(tempFloat * 4);\n  EEPROM.write(0, tempByte);\n\n  byte\
    \ tempByte2 = EEPROM.read(0);\n  float temp2 = (float)(tempByte2) / 4;\n  Serial.begin(9600);\n\
    \  Serial.println(\"\\n\\n\\n\");\n  Serial.println(temp2);\n}\n\nvoid loop(){}\n\
    ```\n\nThere are other means of compressing data. For instance, if you are taking\
    \ readings that change slowly—again, changes in temperature are a good example\
    \ of this—then you can record the first temperature at full resolution and then\
    \ just record the changes in temperature from the previous reading. This change\
    \ will generally be small and occupy fewer bytes.\n\n***\n\n### Conclusion\n\n\
    You now know a little about how to make your data hang around after the power\
    \ has gone off. In the next chapter, you will look at displays.\n\n## 9\n\n##\
    \ Displays\n\nIn this chapter, you look at how to write software to control displays.\
    \ [Figure 9-1](#18_Chapter_09.xhtml_fig-ch9-1) shows the two types of display\
    \ that you will use. The first is an alphanumeric LCD display shield. The second\
    \ is a 128- × 64-pixel OLED (organic light-emitting diode) graphical display.\
    \ These two types of display are very popular for the Arduino.\n\n![image](images/fig-ch9-1.jpg)\n\
    \nFigure 9.1 *An alphanumeric LCD shield (left) and OLED display (right)*.\n\n\
    This is a book about software, not hardware, but in this chapter, we will have\
    \ to explain a little about how the electronics of these displays work so that\
    \ you understand how to drive them.\n\n***\n\n### Alphanumeric LCD Displays\n\n\
    The LCD module that we use is an Arduino shield that can just be plugged on top\
    \ of an Arduino board. In addition to its display, it also has some buttons. There\
    \ are a number of different shields, but nearly all of them use the same LCD controller\
    \ chip (the HD44780), so look for a shield that uses this controller chip.\n\n\
    I used the DFRobot LCD Keypad Shield for Arduino. This module supplied by DFRobot\
    \ ([www.robotshop.com](http://www.robotshop.com)) is inexpensive and provides\
    \ an LCD display that is 16 characters by 2 rows and also has 6 pushbuttons.\n\
    \nThe LCD module that we use is an Arduino shield that can just be plugged on\
    \ top of an Arduino board. In addition to its display, it also has some buttons.\
    \ There are a number of different shields, but nearly all of them use the same\
    \ LCD controller chip (the HD44780), so look for a shield that uses this controller\
    \ chip.\n\nI used the DFRobot LCD Keypad Shield for Arduino. This module supplied\
    \ by DFRobot ([www.robotshop.com](http://www.robotshop.com)) is inexpensive and\
    \ provides an LCD display that is 16 characters by 2 rows and also has 6 pushbuttons.\n"
  raw: "When writing to EEPROM, remember that even uploading a new sketch will not\
    \ clear the EEPROM, so you may have leftover values in there from a previous project.\
    \ Sketch 8-06 resets all the contents of EEPROM to zeros:\n\n```\n// sketch 8-06\n\
    #include <EEPROM.h>\n\nvoid setup()                 \n{\n  Serial.begin(9600);\n\
    \  Serial.println(\"Clearing EEPROM\")a;\n  for (int i = 0; i < 1024; i++)\n \
    \ {\n    EEPROM.write(i, 0);\n  }\n  Serial.println(\"EEPROM Cleared\");\n}\n\n\
    void loop()                    \n{\n}\n```\n\nAlso be aware that you can write\
    \ to an EEPROM location only about 100,000 times before it will become unreliable.\
    \ So only write a value back to EEPROM when you really need to. EEPROM is also\
    \ quite slow, taking about 3 milliseconds to write a byte.\n\n* * *\n\n### Compression\n\
    \nWhen saving data to EEPROM or when using **PROGMEM**, you will sometimes find\
    \ that you have more to save than you have room to save it. When this happens,\
    \ it is worth finding the most efficient way of representing the data.\n\n####\
    \ Range Compression\n\nYou may have a value for which on the face of it you need\
    \ an **int** or a **float** that is 16-bit. For example, to represent a temperature\
    \ in degrees Celsius, you might use a **float** value such as 20.25\\. When you\
    \ are storing that into EEPROM, life would be so much easier if you could fit\
    \ it into a single byte, and you could store twice as much as if you used a **float**.\n\
    \nOne way that you can do this is to change the data before you store it. Remember\
    \ that a byte will allow you to store a positive number between 0 and 255\\. So\
    \ if you only cared about the temperature to the nearest degree Celsius, then\
    \ you could simply convert the **float** to an **int** and discard the part after\
    \ the decimal point. The following example shows how to do this:\n\n```\nint tempInt\
    \ = (int)tempFloat;\n```\n\nThe variable **tempFloat** contains the floating point\
    \ value. The **(int)** command is called a *type cast* and is used to convert\
    \ a variable from one type to another compatible type. In this case, the type\
    \ cast converts the **float** of (for example) 20.25 to an **int** that will simply\
    \ truncate the number to 20.\n\nIf you know that the highest temperature that\
    \ you care about is 60 degrees Celsius and that the lowest is 0 degrees Celsius,\
    \ then you could multiply every temperature by 4 before converting it to a byte\
    \ and saving it. Then when you read the data back from EEPROM, you can divide\
    \ by 4 to get a value that has a precision of 0.25 of a degree.\n\nThe following\
    \ code example (sketch 8-07) saves such a temperature into EEPROM, then reads\
    \ it back and displays it in the Serial Monitor as proof:\n\n```\n//sketch 8-07\n\
    \n#include <EEPROM.h>\n\nvoid setup()\n{\n  float tempFloat = 20.75;\n  byte tempByte\
    \ = (int)(tempFloat * 4);\n  EEPROM.write(0, tempByte);\n\n  byte tempByte2 =\
    \ EEPROM.read(0);\n  float temp2 = (float)(tempByte2) / 4;\n  Serial.begin(9600);\n\
    \  Serial.println(\"\\n\\n\\n\");\n  Serial.println(temp2);\n}\n\nvoid loop(){}\n\
    ```\n\nThere are other means of compressing data. For instance, if you are taking\
    \ readings that change slowly—again, changes in temperature are a good example\
    \ of this—then you can record the first temperature at full resolution and then\
    \ just record the changes in temperature from the previous reading. This change\
    \ will generally be small and occupy fewer bytes.\n\n* * *\n\n### Conclusion\n\
    \nYou now know a little about how to make your data hang around after the power\
    \ has gone off. In the next chapter, you will look at displays.\n\n## 9\n\n##\
    \ Displays\n\nIn this chapter, you look at how to write software to control displays.\
    \ [Figure 9-1](#18_Chapter_09.xhtml_fig-ch9-1) shows the two types of display\
    \ that you will use. The first is an alphanumeric LCD display shield. The second\
    \ is a 128- × 64-pixel OLED (organic light-emitting diode) graphical display.\
    \ These two types of display are very popular for the Arduino.\n\n![image](images/fig-ch9-1.jpg)\n\
    \nFigure 9.1 *An alphanumeric LCD shield (left) and OLED display (right)*.\n\n\
    This is a book about software, not hardware, but in this chapter, we will have\
    \ to explain a little about how the electronics of these displays work so that\
    \ you understand how to drive them.\n\n* * *\n\n### Alphanumeric LCD Displays\n\
    \nThe LCD module that we use is an Arduino shield that can just be plugged on\
    \ top of an Arduino board. In addition to its display, it also has some buttons.\
    \ There are a number of different shields, but nearly all of them use the same\
    \ LCD controller chip (the HD44780), so look for a shield that uses this controller\
    \ chip.\n\nI used the DFRobot LCD Keypad Shield for Arduino. This module supplied\
    \ by DFRobot ([www.robotshop.com](http://www.robotshop.com)) is inexpensive and\
    \ provides an LCD display that is 16 characters by 2 rows and also has 6 pushbuttons.\n\
    \nThe shield comes assembled, so no soldering is required; you just plug it on\
    \ top of your Arduino board (see [Figure 9-2](#18_Chapter_09.xhtml_fig-ch9-2)).\n\
    \n![image](images/fig-ch9-2.jpg)\n\nFigure 9.2 *LCD shield attached to an Arduino\
    \ board*.\n\nThe LCD shield uses seven of the Arduino pins to control the LCD\
    \ display and one analog pin for the buttons. So we cannot use these Arduino pins\
    \ for any other purpose.\n\n* * *\n\n### A USB Message Board\n\nFor a simple example\
    \ of a simple use of the display, we are going to make a USB message board. This\
    \ will display messages sent from the Serial Monitor.\n\nThe Arduino IDE comes\
    \ with an LCD library. This greatly simplifies the process of using an LCD display.\
    \ The library gives you useful functions that you can call:\n\n♦ **clear** clears\
    \ the display of any text.\n\n♦ **setCursor** sets the position in row and column\
    \ where the next thing that you print will appear.\n\n♦ **print** writes a string\
    \ at that position.\n\nThis example is listed in sketch 9-01:\n\n```\n// sketch\
    \ 9-01 USB Message Board\n\n#include <LiquidCrystal.h>\n\n// lcd(RS, E, D4, D5,\
    \ D6, D7)\nLiquidCrystal lcd(8, 9, 4, 5, 6, 7);\nint numRows = 2;\nint numCols\
    \ = 16;\n\nvoid setup()\n{\n  Serial.begin(9600);\n  lcd.begin(numRows, numCols);\n\
    \  lcd.clear();\n  lcd.setCursor(0,0);\n  lcd.print(\"Arduino\");\n  lcd.setCursor(0,1);\n\
    \  lcd.print(\"Rules\");\n}\n\nvoid loop()\n{\n  if (Serial.available() > 0) \n\
    \  {\n    char ch = Serial.read();\n    if (ch == '#')\n    {\n      lcd.clear();\n\
    \    }\n    else if (ch == '/')\n    {\n      // new line\n      lcd.setCursor(0,\
    \ 1);\n    }\n    else\n    {\n      lcd.write(ch);\n    }\n  }\n}\n```\n\nAs\
    \ with all Arduino libraries, you have to start by including the library to make\
    \ the compiler aware of it.\n\nThe next line defines which Arduino pins are used\
    \ by the shield and for what purpose. If you are using a different shield, then\
    \ you may well find that the pin allocations are different, so check in the documentation\
    \ for the shield.\n\nIn this case, the six pins used to control the display are\
    \ D4, D5, D6, D7, D8, and D9\\. The purpose of each of these pins is described\
    \ in [Table 9-1](#18_Chapter_09.xhtml_tab-ch9-1).\n\n| **Parameter to LCD()**\
    \ | **Arduino Pin** | **Purpose** |\n\n| --- | --- | --- |\n\n| RS | 8 | Register\
    \ Select; this is set to 1 or 0 depending on whether the Arduino is sending data\
    \ for characters or an instruction. An instruction might make the cursor flash,\
    \ for example. |\n\n| E | 9 | Enable; this gets toggled to tell the LCD controller\
    \ chip that the data on the following four pins is ready to be read. |\n\n| Data\
    \ 4 | 4 | These four pins are used to transfer data. The LCD controller chip used\
    \ by the shield can use eight-bit or four-bit data. This shield uses four bits,\
    \ in which case the bits 4–7 are used rather than 0–7. |\n\n| Data 5 | 5 |\n\n\
    | Data 6 | 6 |\n\n| Data 7 | 7 |\n\nTable 9-1 *LCD Shield Pin Assignments*\n\n\
    The **setup** function is straightforward. You start serial communications so\
    \ that the Serial Monitor can send commands and initialize the LCD library with\
    \ the dimensions of the display being used. You also display the message “Arduino\
    \ Rules” on two lines by setting the cursor to top-left, printing “Arduino,” then\
    \ moving the cursor to the start of the second row and printing “Rules.”"
