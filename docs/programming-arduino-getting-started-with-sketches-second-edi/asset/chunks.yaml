  trans: "\n\n```\n// sketch 5-03\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid\
    \ loop()\n{\n  Serial.println(\"Hello\");\n  delay(1000);\n}\n```\n\n### 字符串字面量\
    \ (String Literals)\n\n字符串字面量包含在双引号中。它们之所以被称为“字面量”，是因为字符串是一个常量，类似于 `int` 类型的 123。\n\
    \n正如你预期的那样，你可以将字符串放入变量中。虽然还有一个高级的字符串库，但目前你将使用标准的 C 字符串，例如 sketch 5-03 中的那种。\n\n\
    在 C 语言中，字符串字面量实际上是一个 `char` 类型数组。`char` 类型与 `int` 相似，因为它是一个数字，但这个数字在 0 到 127 之间，代表一个字符。该字符可以是字母表中的一个字母、数字、标点符号，或者是如制表符或换行符之类的特殊字符。这些字母的数字代码使用一种名为\
    \ ASCII 的标准。一些最常用的 ASCII 代码如表 5-1 所示。\n\n| 字符 | ASCII 代码 (十进制) |\n| --- | ---\
    \ |\n| a–z | 97–122 |\n| A–Z | 65–90 |\n| 0–9 | 48–57 |\n| space | 32 |\n\n表 5-1\
    \ *常用 ASCII 代码*\n\n字符串字面量“Hello”实际上是一个字符数组，如图 5-3 所示。\n\n![image](img/fig-ch5-3.jpg)\n\
    \n图 5.3 *字符串字面量“Hello”。*\n\n注意，字符串字面量末尾有一个特殊的空字符 `\\0`。这个字符用于指示字符串的结束。\n\n###\
    \ 字符串变量 (String Variables)\n\n正如你预期的那样，字符串变量与数组变量非常相似，不同有一个实用的简写方法来定义它们的初始值。\n\
    \n```c\nchar name[] = \"Hello\";\n```\n\n这定义了一个字符数组并将其初始化为单词“Hello”。它还会添加最后的空值（ASCII\
    \ 0）以标记字符串的结束。\n\n虽然前面的示例与你所对编写数组的认知最一致，但以下写法更为常见：\n\n```c\nchar *name = \"Hello\"\
    ;\n```\n\n这是等价的，`*` 表示一个指针。其思想是 `name` 指向 `char` 数组的第一个 `char` 元素。即包含字母 *H* 的内存位置。\n\
    \n你可以重新改写 sketch 5-03 以同时使用变量和字符串常量，如下：\n\n```c\n// sketch 5-04\nchar message[]\
    \ = \"Hello\";\n\nvoid setup()\n{\n  Serial.begin(9600);\n}\n\nvoid loop()\n{\n\
    \  Serial.println(message);\n  delay(1000);\n}\n```\n\n### 一个莫尔斯密码翻译器 (A Morse\
    \ Code Translator)\n\n让我们把学到的数组和字符串知识结合起来，构建一个复杂的 sketch，它将接受来自串口监视器的任何消息，并在内置\
    \ LED 上闪烁显示出来。\n\n莫尔斯代码中的字母见表 5-2。\n\n| A | .- | N | -. | 0 | ----- |\n| B | -…\
    \ | O | --- | 1 | .---- |\n| C | -.-. | P | .--. | 2 | ..--- |\n| D | -.. | Q\
    \ | --.- | 3 | …-- |\n| E | . | R | .-. | 4 | ….- |\n| F | ..-. | S | … | 5 |\
    \ ….. |\n| G | -. | T | - | 6 | -…. |\n| H | …. | U | ..- | 7 | --… |\n| I | ..\
    \ | V | …- | 8 | ---.. |\n| J | .--- | W | .-- | 9 | ----. |\n| K | -.- | X |\
    \ -..- | | | |\n| L | .-.. | Y | -.-- | | | |\n| M | -- | Z | --.. | | | |\n\n\
    表 5-2 *莫尔斯代码字母*\n\n莫尔斯代码的规则之一是：横线的长度是点的三倍，每个横线或点之间的间隔等于一个点的持续时间，两个字母之间的间隔与横线的长度相等，而两个单词之间的间隔等于七个点的持续时间。\n\
    \n对于这个项目，我们不考虑标点符号，尽管尝试将此添加到 sketch 中对你来说会是一个有趣的练习。有关所有莫尔斯字符的完整列表，请参见 [en.wikipedia.org/wiki/Morse_code](http://en.wikipedia.org/wiki/Morse_code)。\n\
    \n#### 数据 (Data)\n\n你将一步一步构建这个示例，从你将用于表示代码的数据结构开始。\n\n重要的一是，这个问题没有唯一的解决方案。不同的程序员会想出不同的方法来解决它。因此，心里想“我绝对想不到那种方法”是错误的。嗯，不，你完全可能想出不同且更好的方法。每个人的思考方式都不同，而这个解决方案恰好如此。\n\
    \n#### 全局变量与设置 (Globals and Setup)\n\n你需要定义几个全局变量：一个用于表示点的延迟，另一个用于定义 LED 连接的引脚：\n\
    \n```c\nconst int dotDelay = 200;\nconst int ledPin = 13;\n```\n\n`setup` 函数非常简单；你只需要将\
    \ `ledPin` 设置为输出并设置串口：\n\n```c\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n\
    \  Serial.begin(9600);\n}\n```\n\n#### loop 函数 (The loop Function)\n\n你现在将要在 `loop`\
    \ 函数中开始实际处理。该函数的算法如下：\n\n- 如果从 USB 读取到字符：\n- 如果是字母，使用 `letters` 数组闪烁\n- 如果是数字，使用\
    \ `numbers` 数组闪烁\n- 如果是空格，闪烁四倍点的延迟。\n\n到此为止。你不应该考虑得太远。这个算法代表了你想做什么，或者说你的*意图*，这种编程风格被称为*意图编程*。\n\
    \n如果你用 C 语言编写这个算法，它看起来像这样：\n\n```c\nvoid loop()\n{\n  char ch;\n  if (Serial.available()\
    \ > 0)\n  {\n    ch = Serial.read();\n    if (ch >= 'a' && ch <= 'z')\n    {\n\
    \      flashSequence(letters[ch - 'a']);\n    }\n    else if (ch >= 'A' && ch\
    \ <= 'Z')\n    {\n      flashSequence(letters[ch - 'A']);\n    }\n    else if\
    \ (ch >= '0' && ch <= '9')\n    {\n      flashSequence(numbers[ch - '0']);\n \
    \   }\n    else if (ch == ' ')\n    {\n     delay(dotDelay * 4);      // 单词之间的间隔\n\
    \    }\n  }\n}\n```\n\n这里有几点需要解释。首先是 `Serial.available()`。要理解这一点，你首先需要了解一点 Arduino\
    \ 如何通过 USB 与计算机通信。图 5-4 总结了这个过程。\n\n![image](img/fig-ch5-4.jpg)\n\n图 5.4 *与 Arduino\
    \ 的串口通信*。\n\n"
- fmt: "\nIn the situation where the computer is sending data from the Serial Monitor\
    \ to the Arduino board, then the USB is converted from the USB signal levels and\
    \ protocol to something that the microcontroller on the Arduino board can use.\
    \ This conversion happens in a special-purpose chip on the Arduino board. The\
    \ data is then received by a part of the microcontroller called the Universal\
    \ Asynchronous Receiver/Transmitter (UART). The UART places the data it receives\
    \ into a buffer. The buffer is a special area of memory (128 bytes) that can hold\
    \ data that is removed as soon as it is read.\n\nThis communication happens regardless\
    \ of what your sketch is doing. So, even though you may be merrily flashing LEDs,\
    \ data will still arrive in the buffer and sit there until you are ready to read\
    \ it. You can think of the buffer as being a bit like an e-mail inbox.\n\nThe\
    \ way that you check to see whether you “have mail” is to use the function `Serial.available()`.\
    \ This function returns the number of bytes of data in the buffer that are waiting\
    \ for you to read. If there are no messages waiting to be read, then the function\
    \ returns 0. This is why the `if` statement checks to see that there are more\
    \ than zero bytes available to read, and if they are, then the first thing that\
    \ the statement does is read the next available `char`, using the function `Serial.read()`.\
    \ This function gets assigned to the local variable `ch`.\n\nNext is another `if`\
    \ to decide what kind of thing it is that you want to flash:\n\n```\n if (ch >=\
    \ 'a' && ch <= 'z')\n    {\n      flashSequence(letters[ch - 'a']);\n    }\n```\n\
    \nAt first, this might seem a bit strange. You are using `<=` and `>=` to compare\
    \ characters. You can do that because each character is actually represented by\
    \ a number (its ASCII code). So, if the code for the character is somewhere between\
    \ `a` and `z` (97 and 122), then you know that the character that has come from\
    \ the computer is a lowercase letter. You then call a function that you have not\
    \ written yet called `flashSequence`, to which you will pass a string of dots\
    \ and dashes; for example, to flash `a`, you would pass it `.-` as its argument.\
    \ \n\nYou are devolving responsibility to this function for actually doing the\
    \ flashing. You are not trying to do it inside the `loop`. This lets us keep the\
    \ code easy to read.\n\nHere is the C that determines the string of dashes and\
    \ dots that you need to send to the `flashSequence` function:\n\n```\nletters[ch\
    \ - 'a']\n```\n\nOnce again, this looks a little strange. The function appears\
    \ to be subtracting one character from another. This is actually a perfectly reasonable\
    \ thing to do, because the function is actually subtracting the ASCII values.\n\
    \nRemember that you are storing the codes for the letters in an array. So the\
    \ first element of the array contains a string of dashes and dots for the letter\
    \ `A`, the second element includes the dots and dashes for `B`, and so on. So\
    \ you need to find the right position in the array for the letter that you have\
    \ just fetched from the buffer. The position for any lowercase letter will be\
    \ the character code for the letter minus the character code for `a`. So, for\
    \ example, `a` - `a` is actually 97 - 97 = 0. Similarly, `c` - `a` is actually\
    \ 99 - 97 = 2. So, in the following statement, if `ch` is the letter `c`, then\
    \ the bit inside the square brackets would evaluate to 2, and you would get element\
    \ 2 from the array, which is -.-:\n\nWhat this section has just described is concerned\
    \ with lowercase letters. You also have to deal with uppercase letters and numbers.\
    \ These are both handled in a similar manner.\n\n### The flashSequence Function\n\
    \nWe have assumed a function called `flashSequence` and made use of it, but now\
    \ you need to write it. We have planned for it to take a string containing a series\
    \ of dashes and dots and to make the necessary flashes with the correct timings.\n\
    \nThinking about the algorithm for doing this, you can break it into the following\
    \ steps:\n\n- For each element of the string of dashes and dots (such as `.-.-`):\n\
    - Flash that dot or dash.\n\nUsing the concept of programming by intention, let’s\
    \ keep the function as simple as that.\n\nThe Morse codes are not the same length\
    \ for all letters, so you need to loop around the string until you encounter the\
    \ end marker, `\\0`. You also need a counter variable called `i` that starts at\
    \ 0 and is incremented as the processing looks at each dot and dash:\n\n```cpp\n\
    void flashSequence(char* sequence)\n{\n   int i = 0;\n   while (sequence[i] !=\
    \ '\\0')\n   {\n       flashDotOrDash(sequence[i]);\n       i++;\n   }\n   delay(dotDelay\
    \ * 3);    // gap between letters\n}\n```\n\nAgain, you delegate the actual job\
    \ of flashing an individual dot or dash to a new method called `flashDotOrDash`,\
    \ which actually turns the LED on and off. Finally, when the program has flashed\
    \ the dots and dashes, it needs to pause for three dots worth of delay. Note the\
    \ helpful use of a comment.\n\n### The flashDotOrDash Function\n\nThe last function\
    \ in your chain of functions is the one that actually does the work of turning\
    \ the LED on and off. As its argument, the function has a single character that\
    \ is either a dot (`.`) or a dash (`–`).\n\nAll the function needs to do is turn\
    \ the LED on and delay for the duration of a dot if it’s a dot and three times\
    \ the duration of a dot if it’s a dash, then turn the LED off.\n\n### Putting\
    \ All Together\n\nPutting all this together, the full listing is shown in sketch\
    \ 5-05. Upload it to your Arduino board and try it out. You should then see that\
    \ text being flashed as Morse code.\n\n```cpp\n// sketch 5-05\nconst int dotDelay\
    \ = 200;\nconst int ledPin = 13;\n\nvoid setup()                 \n{\n  pinMode(ledPin,\
    \ OUTPUT);\n  Serial.begin(9600);\n}\n\nvoid loop()                    \n{\n \
    \ char ch;\n  if (Serial.available() > 0)     \n  {\n    ch = Serial.read(); \
    \       \n    if (ch >= 'a' && ch <= 'z')\n    {\n      flashSequence(letters[ch\
    \ - 'a']);\n    }\n    else if (ch >= 'A' && ch <= 'Z')\n    {\n      flashSequence(letters[ch\
    \ - 'A']);\n    }\n    else if (ch >= '0' && ch <= '9')\n    {\n      flashSequence(numbers[ch\
    \ - '0']);\n    }\n    else if (ch == ' ')\n    {\n     delay(dotDelay * 4); \
    \     // gap between words  \n    }\n  }\n}\n\nchar* letters[] = {\n  \".-\",\
    \ \"-...\", \"-.-\", \"-..\", \".\", \"....-\", \"--.\", \"---\", \"--..\", \"\
    .\", // A-I\n  \"..-..\", \"--..\", \".-.-\", \"-.-\", \"-\", \"...--\", \"--...\"\
    , \".-.\", \"....\"\", \"-.\", // J-R\n  \"---...\", \"--..\", \".-.\", \"-.-\"\
    , \"-..\", \".--\", \"--.--\"          // S-Z\n};\n\nchar* numbers[] = {\"-----\"\
    , \".----\", \"..---\", \"...--\", \"....-\", \".....\"}; // 0-5 partial\n\nvoid\
    \ flashSequence(char* sequence)\n{\n   int i = 0;\n   while (sequence[i] != '\\\
    0')\n   {\n       flashDotOrDash(sequence[i]);\n       i++;\n   }\n   delay(dotDelay\
    \ * 3);    // gap between letters\n}\n\nvoid flashDotOrDash(char dotOrDash)\n\
    {\n  digitalWrite(ledPin, HIGH);\n  if (dotOrDash == '.')\n  {\n    delay(dotDelay);\
    \           \n  }\n  else // must be a -\n  {\n    delay(dotDelay * 3);      \
    \     \n  }\n  digitalWrite(ledPin, LOW);    \n  delay(dotDelay); // gap between\
    \ flashes\n}\n```\n\nThis sketch includes a loop function that is called automatically\
    \ and repeatedly calls a `flashSequence` function that you wrote, which itself\
    \ repeatedly calls a `flashDotOrDash` function that you wrote, which calls `digitalWrite`\
    \ and `delay` functions that are provided by Arduino!\n"
