  md: '# Chapter 16 · Ray Tracing and Compute Shaders 451


    To most people new to color models, Figure 16.24 looks very strange (it looks
    even stranger with red/yellow/blue panes – try it!). The red and blue planes combine
    to form a sort of light purple called magenta, which probably seems reasonable
    – but few people expect red and green would combine to make yellow. And yet, if
    these panes were light sources, believe it or not, this is much closer to what
    would actually happen in the real world. Note, for example, that at the very center,
    all red/green/blue primary light colors have been added together, resulting in
    full spectrum white light. The RGB additive color model, when used to blend colors
    by adding them, is accurate when we use it to blend light sources.


    But if we want to model colored objects that aren''t light sources, or instead
    passive colored objects responding to white light sources, window pane or a pair
    of orange sunglasses? It turns out that the additive RGB model is quite clumsy
    for this task.


    If transparent objects are desired, rather than light sources, one option is to
    switch to a subtractive color model, such as CMY (cyan/magenta/yellow). Whereas
    RGB is designed for computer monitors of tiny red, blue and green light emitters,
    CMY is commonly used for printers that mix ink into colors. In RGB, [0,0,0] is
    black and [1,1,1] is white, whereas in CMY, [0,0,0] is white and [1,1,1] is black.
    Adding colors together in CMY makes them darker. This models the real-world observation
    that when two pigments (such as paint) are mixed together, the resulting substance
    subtracts out more of the surrounding light and becomes darker. That''s why the
    model is called subtractive: the values indicate the amount of light removed from
    surrounding light sources, even though we still combine colors by adding them.


    It is easy to convert back and forth between RGB and CMY by inverting the colors
    (subtracting them from [1,1,1] or white). One way ways of blending colors is to
    invert the RGB colors to generate CMY versions, add them, and convert back to
    RGB:


    ```

    color1_{CMY} = vec3(1,1,1) - color1_{RGB}

    color2_{CMY} = vec3(1,1,1) - color2_{RGB}

    blend_{CMY} = color1_{CMY} + color2_{CMY}

    result_{RGB} = vec3(1,1,1) - blend_{CMY}

    ```'
