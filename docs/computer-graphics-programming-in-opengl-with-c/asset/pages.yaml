    # 6.3 LOADING EXTERNALLY PRODUCED MODELS


    Complex 3D models, such as characters found in videogames or computer-generated
    movies, are typically produced using modeling tools. Such “DCC” (digital content
    creation) tools make it possible for people (like artists) to build arbitrary
    shapes in 3D space and automatically produce the vertices, texture coordinates,
    vertex normals, and so on. There are too many such tools to list, but some examples
    are Maya, Blender, Lightwave, Cinema4D, and many others. Blender is free and open
    source. Figure 6.13 shows an example Blender screen during the editing of a 3D
    model.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Computer Graphics Programming in OpenGL with C++, 2/E


    ![](img/a15a9f662738db7597e865cb1a19c561_166_0.png)


    Figure 6.13

    Example Blender model creation [BL20].


    In order for us to use a DCC-created model in our OpenGL scenes, that model needs
    to be saved (exported) in a format that we can read (import) into our program.
    There are several standard 3D model file formats; again, there are too many to
    list, but some examples are Wavefront (obj), 3D Studio Max (3ds), Stanford Scanning
    Repository (ply), Ogre3D (mesh), to name a few. Arguably the simplest is Wavefront
    (usually OBJ), we will examine that one.


    OBJ files are simple enough that we can develop a basic importer relatively easily.
    In an OBJ file, lines of text specify vertex data, texture coordinates, normals,
    and other information. It has some limitations—for example, OBJ files have no
    way of specifying model animation.


    Lines in an OBJ file start with a character tag indicating what kind of data is
    on that line. Some common tags include:


    +   * v – geometric (vertex location) data

    * vt – texture coordinates

    * vn – vertex normal

    * f – face (typically vertices in a triangle)


    Other tags make it possible to store the object name, materials it uses, curves,
    shadows, and many other details. We will limit our discussion to the four tags
    listed above, which are sufficient for importing a wide variety of complex models.'
