  md: '# Chapter 14 — Other Techniques


    # 14.9 NOISE APPLICATION – SPECIAL EFFECTS


    Noise textures can be used for a variety of special effects. In fact, there are
    so many possible uses that its applicability is limited only by one''s imagination.


    One simple special effect that we will demonstrate here is a dissolve effect,
    where we make an object appear to gradually dissolve into small particles, until
    it eventually disappears. Given a 3D noise texture, this effect can be achieved
    with very little additional code.


    To facilitate the dissolve effect, we introduce the GLSL discard command. This
    command is only in the fragment shader, and when executed, it causes the fragment
    shader to discard the current fragment (not rendering it).


    Our strategy is a simple one. In the C++/OpenGL application, we create a grained
    noise texture map identical to the one shown in Figure 14.12, and also a float
    variable that gradually increases over time. This variable is then passed down
    the shader as a uniform variable, and the noise map is also placed in a texture
    map with an associated sampler. The fragment shader accesses the noise texture
    using the sampler—in this case, we use the returned noise value to determine whether
    or not to discard the fragment. We do this by comparing the grayscale noise value
    against the counter, which serves as a sort of "threshold" value. Because the
    threshold is gradually changing over time, we can set it up so that more and more
    fragments are discarded. Program 14.9 shows the relevant code sections, which
    are added to the rendered shader from Program 6.1. The generated output is shown
    in Figure 14.24.


    # Program 14.9 Dissolve Effect Using discard Command


    C++ / OpenGL application:


    ```

    float threshold = 0.0f; // gradually-increasing threshold for retaining/discarding
    fragment

    ```


