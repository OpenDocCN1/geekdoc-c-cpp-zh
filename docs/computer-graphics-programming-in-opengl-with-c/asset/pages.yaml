    \ be handled in pass one:\n\n+   - Configure the buffer and shadow texture.\n\
    - Disable output.\n- Build a look-at matrix from the light to shadow the objects\
    \ in view.\n- Enable the GLSL pass one shader program, containing only the simple\
    \ vertex shader in Figure 8.5 that expects to receive an MVP matrix. In this case,\
    \ the MVP matrix will include the object's model matrix M, the look-at matrix\
    \ computed in the previous step (serving as the view matrix V), and the perspective\
    \ matrix P. We call this MVP matrix “shadowMVP” because it is based on the point\
    \ of view of the light rather than the camera. Since the view from the light isn't\
    \ actually being displayed, the page shader's fragment shader does not do anything.\n\
    - For each object, create the shadowMVP matrix and call glDrawArrays(). It is\
    \ not necessary to include textures or lighting in pass one, because objects are\
    \ not rendered to the screen.\n\n```\n#version 430                 // vertex shader\n\
    layout(location=0) in vec3 vertPos;\nuniform mat4 shadowMVP;\n\nvoid main() {\n\
    \    gl_Position = shadowMVP * vec4(vertPos,1.0);\n}\n\n#version 430         \
    \        // fragment shader\nvoid main(void) { }\n```\n\nFigure 8.5 Shadow mapping\
    \ pass 1 vertex and fragment shaders.\n\n# 8.4.2 Shadow Mapping (Intermediate\
    \ Step) – Copying the Z-Buffer to a Texture\n\nOpenGL offers two methods for putting\
    \ Z-buffer depth data into a texture unit. The first method is to generate an\
    \ empty shadow texture and then use the command glCopyTexture2D() to copy the\
    \ active depth buffer into the shadow texture."
