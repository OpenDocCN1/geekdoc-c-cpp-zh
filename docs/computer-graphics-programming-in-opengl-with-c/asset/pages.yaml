    Program 6.1 shows the implementation of our sphere model as a class named Sphere.
    The center of the resulting sphere is at the origin. Code for using Sphere is
    also shown. Each vertex is stored in C++ vectors containing instances of the GLM
    classes vec2 and vec3 (this is different from previous examples, where vertices
    were stored in float arrays). vec2 and vec3 include methods for obtaining the
    desired x, y, and z as float values, which are then put into float buffers as
    before. The size depends on the number of slices specified at runtime.


    Note the calculation of triangle indices in the Sphere class, as described earlier
    in Figure 6.8. The variable "prec" refers to the “precision,” in which this case
    is used for the number of sliced sphere regions and the number of points per slice.
    Because the texture map wraps completely around the sphere, we need an extra coincident
    vertex at each of the points where the left and right edges of the texture map
    meet. The total number of vertices is (prec+1)*. Since six triangle indices are
    generated per vertex, the total number of indices is prec*prec*6.


