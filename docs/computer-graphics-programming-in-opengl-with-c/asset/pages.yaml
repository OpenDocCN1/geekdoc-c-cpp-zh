    The red and yellow overlap, we see orange, and where the red and blue overlap
    we see purple, both of which are likely to match our expectations. However, where
    yellow and blue overlap we probably expected green, a sort of grey color appears
    there instead.


    Welcome to the complex world of color models! If those were real glass panes,
    we should indeed see green where the yellow and blue panes overlap. That is because
    white light passes through a yellow pane, and then a blue pane, some of the spectrum
    from the original white light is removed, leaving only the green'
