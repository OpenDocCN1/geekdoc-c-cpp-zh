  md: '# 6.2.2 Indexing in OpenGL


    In both our sphere and torus models, we generate an array of integer indices referencing
    the vertex array. In the case of the sphere, we use the list of indices to build
    a complete set of individual vertices and load them into a VBO as we did for examples
    in earlier chapters. Instantiating the torus and loading its vertices, normals,
    and so on into buffers can be done in a similar manner as done in Program 6.1,
    but instead we will use OpenGL’s indexing.


    When using OpenGL vboing, we load the indices themselves into a VBO. We generate
    one additional VBO for holding the indices. Since each index value is an integer
    reference, we first copy the index array into a C++ vector of integers, and then
    use glBufferData() to load the vector into the added VBO, specifying that the
    VBO is of type GL_ELEMENT_ARRAY_BUFFER (this tells OpenGL the VBO contains indices).
    The code that can be added to setupVertices():


