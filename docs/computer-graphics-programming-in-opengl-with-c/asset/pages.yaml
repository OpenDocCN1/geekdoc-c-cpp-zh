    # 8.3 SHADOW VOLUMES


    Another important method, proposed by Crow in 1977, is to identify the spatial
    volume shadowed by an object and reduce the color intensity of polygons by the
    intersection of the shadow volume with the volume-accessible [CR77]. Figure 8.4
    shows a cube in a shadow volume, so the cube would be drawn darker.


    Shadow volumes have the advantage of being highly accurate, with fewer artifacts
    than other methods. However, finding the shadow volume and then computing whether
    each polygon is inside of it is computationally expensive on modern GPU hardware.
    Geometry shaders can be used to generate shadow volumes, and the stencil buffer¹
    be used to determine whether a pixel is within the volume. Some graphics cards
    include hardware support for optimizing certain shadow volume operations.


    ![](img/a15a9f662738db7597e865cb1a19c561_211_1.png)


    Figure 8.4

    Shadow volume.


    ¹ The stencil buffer is a third buffer—along with the color buffer and the z-buffer—accessible
    through OpenGL. The stencil buffer is not described in this textbook.'
