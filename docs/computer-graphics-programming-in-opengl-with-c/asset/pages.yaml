  md: 'The values colored purple (starting with “f”), near the bottom of the file,
    specify the triangles (i.e., “faces”). In this example, each face (triangle) has
    three elements, each with three values separated by “/” OBJ allows other formats
    as well). The values for each element are indices into the lists of vertices,
    texture coordinates, and normal vectors respectively. For example, the third face
    is:


    ```

    f 2/7/3 5/8/3 3/9/3

    ```


    This indicates that the second, fifth, and third vertices from the list of vertices
    (in blue) comprise a triangle (note that OBJ indices start at 1). The corresponding
    texture coordinates are the seventh, eighth, and ninth from the list of texture
    coordinates in the section red. All three vertices have a normal vector, the third
    in the list of normals in the section colored green.


    Models in OBJ format are not required to have normal vectors, or even texture
    coordinates. If a model does not have texture coordinates or normals, the face
    values would specify only the vertex indices:


    ```

    f 2 5 3

    ```


    If a model has texture coordinates, but not normal vectors, the format would be
    as follows:


    ```

    f 2/7 5/8 3/9

    ```


    And, if the model has normals but not texture coordinates, the format would be:


    ```

    f 2//13 5//13 3//13

    ```


    It is not unusual for a model to have tens of thousands of vertices. There are
    hundreds of such models available for download on the Internet for nearly every
    conceivable application, including models of animals, buildings, cars, planes,
    mythical creatures, people, and so on.


    Programs of varying sophistication that can import an OBJ model are available
    on the Internet. Alternatively, it is relatively easy to write a very simple OBJ
    loader function that can handle the basic tags we have seen (v, vt, vn, and f).
    Program 6.3 shows one such loader, albeit a very limited one. It incorporates
    a class to hold an arbitrary imported model, which in turn calls the importer.'
