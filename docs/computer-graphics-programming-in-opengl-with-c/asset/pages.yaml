  md: 'Chapter 16 · Ray Tracing and Compute Shaders 449


    It is a simple matter to declare an object to be transparent, and also having
    a color, by simply assigning an RGB value for whatever color we want (such as
    [1,0,0] for red), and combining this color with the incoming refracted color as
    we did in previous examples. However, the results are not always as one would
    expect! For example, suppose we declare three panes colored red, yellow, and blue,
