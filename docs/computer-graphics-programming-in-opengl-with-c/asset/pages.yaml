    Although fixing shadow acne is easy, sometimes the repair causes new artifacts.
    The "trick" of moving the object before pass one sometimes causes a gap to appear
    inside an object''s shadow. An example of this is shown in Figure 8.14. This artifact
    is often called "Peter Panning," because sometimes it causes the shadow of a resting
    object to inappropriately separate from the object''s base (thus making portions
    of the object''s shadow detach from the rest of the shadow, reminiscent of J.
    M. Barrie''s character Peter Pan [PP20]). Fixing this artifact requires adjusting
    glPolygonOffset(). If they are too small, shadow acne can appear; if too large,
    Peter Panning happens.


    There are many artifacts that can happen during shadow mapping. For example, shadows
    can repeat as a result of the region of the scene being rendered in pass one (into
    the shadow buffer) being different from the region of the scene rendered in pass
    two (they are from different vantage points). Because of this difference, those
    portions of the scene rendered in pass two that fall outside the region rendered
    in pass one will attempt to access the shadow texture using coordinates outside
    of the range [0]. Recall that the default behavior in this case is GL_REPEAT,
    which can result in incorrectly duplicated shadows.


    One possible solution is to add the following lines of code to setupShadowBuffers(),
    to set the texture wrap mode to "clamp to edge":


    ```

    glParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);

    glParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);

    ```


    This causes values outside of the edge to be clamped to the value at edge (instead
    of repeating). Note that this approach can introduce its own artifacts, namely,
    when a shadow exists at the edge of the shadow texture, clamping to the edge can
    produce a "shadow bar" extending to the edge of the scene.'
