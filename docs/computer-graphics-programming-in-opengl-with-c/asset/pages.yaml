    # # Acknowledgments


    A lot of content in this book is built from our first book Computer Graphics Programming
    in OpenGL with Java, which we drafted in 2016 for CSC-155 (Advanced Computer Graphics
    Programming) at CSU Sacramento. Many CSC-155 students actively contributed suggestions
    and bugs to fix an early draft that they made, including Mitchell Brannan, Tiffany
    Chiapuz-Zong, Samson Chua, Anthony Doan, Kia Faroughi, Cody Jackson, John Johnston,
    Zeeshan Khaliq, Raymond Rivera, Oscar Solorzano, Darren Takemoto, Jon Tinney,
    James Womack, and Victor Zeda. The following colleague Dr. Pinar Muyan-Ozellikik
    used the first edition of the Java book while teaching CSC-155 for her first time,
    and kept a log of questions and corrections for each chapter, which led to many
    improvements for the second edition of the Java book, and the first edition of
    the C++ book.


    In 2020 we tested our idea of allowing students (in our CSC-155 course) to select
    either C+ or Java, using the respective edition of this textbook. It was a sort
    of acid test of our “sister” textbook, and we were pleased with how things worked.
    Again, students caught typos – Paul McHugh in particular caught and fixed an important
    memory leak in 3D texture code.


    Much of the code in Chapters 15 and 16 was developed by two of our best students,
    Chris Swenson and Luis Gutierrez, respectively. Both did an excellent job of distilling
    these complex topics into coherent solutions, and their contributions helped to
    make these two new chapters possible.


    We continue to receive a steady stream of good feedback from instructors around
    the world who adopt our books for their courses, and from professionals and enthusiasts
    – Dr. Mauricio Papa (University of Tulsa), Dan Asimov (NASA Ames), Sean McCrory,
    Michael Hiatt, Scott Anderson, Reydaldo Hernandez, and Bill Crupi, just to name
    a few.'
