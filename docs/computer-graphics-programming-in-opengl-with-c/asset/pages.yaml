    # 16.2.3 Ray-Sphere Intersection


    Computing the intersection(s) of a ray with a sphere is derived using geometry
    and is well-documented [S16]. Although the derivation is relatively simple, here
    we describe only the solution. There are either 0, 1, or 2 intersection points,
    depending on if the ray misses the sphere, skims the surface, or enters on one
    side and exits the other. Given the ray''s origin r_o and direction r_d, the sphere''s
    position s_p and radius s_r then finding the distance t along the ray at which
    the intersection(s) occurs solving the following quadratic equation:


    ```

    $(r_d \cdot r_d)^2 + (2r_d \cdot (r_s - s_p))t + |r_s - s_p|^2 - s_r^2 = 0$

    ```


    First, we compute its discriminant:


    ```

    $\Delta = (2r_d \cdot (r_s - s_p))^2 - 4|r_d|^2|r_s - s_p|^2 - s_r^2$

    ```


    If $\Delta < 0$, we can stop before the ray misses the sphere (and avoid attempting
    to take the square root of a negative number). When $\Delta$ is not less than
    zero, there are two solutions to equation [1]:


    ```

    $t = \frac{-2r_d \cdot (r_s - s_p) \pm \sqrt{\Delta}}{2(r_d \cdot r_d)^2}$

    ```


    The smaller and larger of the two resulting values of t are denoted t_near and
    t_far, respectively.


    +   * When t_near and t_far are negative, the entire sphere is behind the ray
    and there is no intersection.

    * When t_near is negative and t_far is positive, then the ray started inside the
    sphere and the first intersection point is at t_far.

    * When both are positive, the first intersection point is at t_near. Note that
    this also handles the case of ray skimming the surface of the sphere, when both
    t_near and t_far are positive and equal to each other (which occurs when the discriminant
    Δ is zero).


    > In the code, we sometimes compute the square of the length of a vector $\vec{v}$
    by computing $\vec{v}^* \cdot \vec{v}^*$, for performance reasons.'
