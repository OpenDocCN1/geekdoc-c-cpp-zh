- img_proc: true
  md: '# Chapter 4 Managing 3D Graphics Data 93


    Situations like this often occur when creating terrain or shadows. It is sometimes
    possible to predict Z-fighting in such instances, and a common way of correcting
    it in these cases is to move one object slightly, so that the surfaces are no
    longer coplanar. We will see an example of this in Chapter 8.


    Z-fighting can also occur due to limited precision of the values in the depth
    buffer. For each pixel processed by the Z-buffer algorithm, the accuracy of its
    depth information is limited by the number of bits available for storing it in
    the depth buffer. The greater the range between near and far clipping planes used
    to build the perspective matrix, the more likely two objects'' points with similar
    (but not equal) actuals will be represented by the same numeric value in the depth
    buffer. Therefore, it is up to the programmer to select near and far clipping
    plane values to minimize the distance between the two planes, while ensuring that
    all objects element the scene lie within the viewing frustum.


    It is also important to understand that, due to the effect of the perspective
    transform, changing the near clipping plane value can have a greater impact on
    the likelihood of Z-fighting artifacts than making an equivalent change in the
    far clipping plane. Therefore, it is advisable to avoid selecting a near clipping
    plane that is too close to the eye.


    Previous examples in this book have simply used values of 0.1 and 1000 (in our
    calls to perspective())) for the near and far clipping planes. These may need
    to be adjusted for your scene.


