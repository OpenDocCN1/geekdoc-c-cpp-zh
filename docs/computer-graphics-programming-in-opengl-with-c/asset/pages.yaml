    # 7.2 LIGHTS


    There are many types of lights, each with different characteristics and requiring
    different steps to simulate their effects. Some types include:


    +   * Global (usually called "global ambient") because it includes only an ambient
    component)

    * Directional (or "distant")

    * Positional (or "point source")

    * Spotlight


    Global ambient light is the simplest type of light to model. Global ambient light
    has no source position—the light is everywhere, at each pixel object in the scene,
    regardless of where the objects are. Global ambient lighting simulates the real-world
    phenomenon of light that has bounced around many times that its source and direction
    are undetectable. Global ambient light has only an ambient component, specified
    as an RGBA value; it has no diffuse or specular components. Global ambient light
    can be defined as:


    ```

    float globalAmbient[4] = {0.6f, 0.6f, 0.6f, 1.0f};

    ```


    RGBA values range from 0 to 1, so global ambient light is usually modeled as dim
    white light, each of the RGB values is set to the same fractional value between
    0 and 1 and the alpha is set to 1.


    Directional or distant light also doesn''t have a source location, but it does
    have a direction. It is useful for situations where the source of light is so
    far away that the light rays are effectively parallel, like light coming from
    the sun. In such situations we may only be interested in modeling the light and
    not the object that produces the light. The effect of directional light on an
    object depends on the light''s angle of impact; objects are brighter on the side
    facing a directional light than on a tangential or opposite side. Modeling directional
    light requires its direction (as a vector) and its ambient, diffuse, and specular
    characteristics (as RGBA values). A red directional light pointing down the Z
    axis may be specified as:


    ```

    float dirLightAmbient[4] = {0.1f, 0.0f, 0.0f, 1.0f};

    float dirLightDiffuse[4] = {1.0f, 0.0f, 0.0f, 1.0f};

    float dirLightSpecular[4] = {1.0f, 0.0f, 0.0f, 1.0f};

    float dirLightDirection[3] = {0.0f, 0.0f, -1.0f};

    ```'
