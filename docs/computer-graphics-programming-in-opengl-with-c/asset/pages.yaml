  md: 'The manner in which ϕ is used to compute the specular contribution depends
    on the desired “shininess” of the object being rendered. Objects that are extremely
    shiny, such as a mirror, have very small specular highlights—that is, they reflect
    the incoming light to the eye materials. Materials that are less shiny have specular
    highlights that are more “spread out,” and thus more pixels are a part of the
    highlight.


    Shininess is generally modeled with a falloff function that expresses how quickly
    the specular contribution reduces to the angle ϕ grows. We can use cos(ϕ) to model
    falloff, and increase or decrease the shininess by using powers of the cosine
    function, as cos(ϕ), cos²(ϕ), cos³(ϕ), cos¹⁰(ϕ), cos⁵⁰(ϕ), and so on, as illustrated
    in Figure 7.6.


    ![](img/a15a9f662738db7597e865cb1a19c561_189_0.png)


    Note that the higher value of the exponent, the faster the falloff, and thus the
    smaller specular contribution of pixels with light reflections are off-axis from
    the viewing angle.


    We call the n, as used in the cos(ϕ) falloff function, the shininess factor for
    a specified material. Note back in Figure 7.3 that shininess factors for each
    of the materials listed are specified in the rightmost column.


    We can now specify the specular calculation:


    ```

    $I_{specular} = Light_{specular} * Material_{specular} * max(0, $(\hat{R} \cdot
    \hat{V}))$$

