    # SUPPLEMENT NOTES


    One of the appeals of geometry shaders is that they are relatively easy to use.
    Although many applications for which geometry shaders could be achieved through
    tessellation, the mechanism of geometry shaders often makes them easier to implement
    and debug. Of course, the relative fit of geometry versus tessellation depends
    on the particular application.


    Generating convincing hair or fur is challenging, and there is a wide range of
    techniques employed depending on the application. In some cases, simple texturing
    is adequate, and/or the use of tessellation or geometry shaders such as the basic
    technique shown in this chapter. When realism is required, movement (animation)
    and lighting become tricky. Two dedicated tools for hair and fur generation are
    HairWorks, which is part of the NVIDIA GameWorks [GW20], and TessFX, which was
    developed by AMD [TR20]. The former works with OpenGL and DirectX, the latter
    works only with DirectX. Examples of using TessFX can be found in [GP14].'
