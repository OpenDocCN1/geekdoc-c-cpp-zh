  md: "# Chapter 15 Simulating Water 369\n\n# 15.3 ADDING SURFACE WAVES\n\nSo far,\
    \ our simulated water has been perfectly still. We now add movement to the water's\
    \ surface. There are many ways to do this, depending on whether we wish to simulate\
    \ tiny ripples, random effects from wind, current flow, or ocean waves. In our\
    \ example, we simulate modest waves as might appear if there were a slight breeze,\
    \ by using the *normal mapping* technique previously covered in Chapter 10, with\
    \ a *noise map*. Since waves are not entirely random, the noise map we will build\
    \ for our water's surface will be a combination of the noise that we generated\
    \ previously in Chapter 14, with the regularity of a sine wave. The noise map\
    \ will then serve as a sort of height map, but note that we are *not* going to\
    \ actually modify the water surface geometry as is typically done in height mapping;\
    \ rather, we will modify the normal vectors (in a manner similar to normal mapping)\
    \ to make it appear that. (Techniques exist for actually modifying surface geometry;\
    \ for example, a geometry shader could be used, as we studied in Chapter 13.)\n\
    \nThe noise map is built using the code from Section 14.5, with a slight modification\
    \ to the turbulence() function. Specifically, we add a sine wave that runs diagonally\
    \ across the XZ plane:\n\n```\ndouble turbulence(double x, double y, double maxZoom)\
    \ {\ndouble sum = 0.0, zoom = maxZoom;\n\nsum = (sin(sin(1.0/512.0)*(8*PI)*(x+z))\
    \ + 1) * 8.0;\nwhile (zoom >= 0.9) {\n  sum = sum + smoothNoise(zoom, x/zoom,\
    \ y/zoom, z/zoom) * zoom;\n  zoom = zoom / 2;\n}\nsum = 128.0 * sum / maxZoom;\n\
    return sum;\n}\n```\n\nThe diagonal sine wave is accomplished via sin(x+z), with\
    \ additional factors for scaling (1/512 assuming that the size of the noise map\
    \ is 256 along the X and Z dimensions), ensuring that the range of values for\
    \ x+y spans a multiple of PI so that the sine wave wraps smoothly at edge boundaries,\
    \ adding -1 to 0..2, and then scaling the height to the desired amount (in this\
    \ case, by a factor of 8). Note that since we have been making use of tiling,\
    \ it is especially important in this application to use a noise map dimension\
    \ that is a power of 2, so that the noise wraps smoothly at edge boundaries."
