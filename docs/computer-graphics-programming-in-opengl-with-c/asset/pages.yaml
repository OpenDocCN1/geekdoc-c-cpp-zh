    One approach is called "faceted shading" or "flat shading." Here we assume every
    pixel in rendered primitive (i.e., polygon or triangle) has the same lighting
    value. Thus, we need only the lighting computations for one vertex in each polygon
    in the model, and then copy those lighting values across the nearby rendered pixels
    on a per-polygon or per-triangle basis.


    Faceted shading is rarely used today, because the resulting images tend to not
    look very realistic, and because modern hardware makes more accurate computations
    feasible. An example of a faceted-shaded torus, in which each triangle behaves
    as a flat reflective surface, as shown in Figure 7.7.


