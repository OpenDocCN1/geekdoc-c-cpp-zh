  md: 'to:


    layout (quads, fractional_even_spacing, ccw) in


    The reason for this modification is difficult to illustrate in still images. In
    an animated scene, a tessellated object moves through 3D space, if LOD is used
    it is sometimes possible to see the changes in tessellation levels on the surface
    of the object as wiggling artifacts called “popping.” Changing from equal spacing
    to fractional reduces this effect by making the grid geometry of adjacent patch
    instances more similar, even if they differ in level of detail. (See Exercises
    12.2 and 12.3.)


    Employing LOD can dramatically reduce the load on the system. For example, when
    animated, the scene might be less likely to appear jerky or to lag than the case
    without controlling LOD.


    Applying this LOD technique to the version that includes Phong shading (i.e.,
    Program 12.4) is a bit trickier. This is because the changes in LOD between adjacent
    patch instances can cause sudden changes to the associated normal vectors, causing
    popping artifacts in the lighting! As always, there are tradeoffs and compromises
    to consider when constructing a complex 3D scene.


    # SUPPLEMENTAL NOTES


    Combining tessellation with LOD is particularly useful in real-time virtual reality
    applications that require complex detail for realism and frequent object movement/or
    changes in camera position, as in computer games. In this chapter we have illustrated
    the use of tessellation and LOD for real-time terrain generation, it can also
    be applied in other areas such as displacement mapping for 3D models (where tessellated
    vertices are added to the surface of a model and then moved so to add detail).
    It is also useful in computer-aided design applications.


    Sellers et al. extends the LOD technique (shown in Program 12.5) further than
    we have presented, by also eliminating vertices in patches that are behind the
    camera (they do this by setting their inner and outer levels to zero) [SW15].
    This is an example of a culling technique, and it is a very useful one because
    of the load instanced tessellation can still place on the system.


    The four-parameter version of createShader() used in Program 12.1 is added to
    the Utils.cpp file. Later, we will add additional versions to accommodate the
    geometry shader stage.'
