  md: '# CHAPTER 12


    # TESSELLATION


    +   12.1 Tessellation in OpenGL ...................................................................................................271


    +   12.2 Tessellation for Bézier Surfaces ..............................................................................277


    +   12.3 Tessellation for Terrain / Height Maps ................................................................284


    +   12.4 Controlling Level of Detail (LOD) ................................................................291


    +   Supplemental Notes ............................................................................................................294


    The English term “tessellation” refers to a large class of design activities in
    which tiles of various geometric shapes are arranged adjacently to form patterns,
    generally on a flat surface. The purpose can be artistic or practical, with examples
    dating back thousands of years [TS20].


    In 3D graphics, tessellation refers to something a little bit different, but no
    doubt inspired by its classical counterpart. Here, tessellation refers to the
    generation and manipulation of large numbers of triangles for rendering complex
    shapes and surfaces, preferably in hardware. Tessellation is a rather recent addition
    to the OpenGL core, not appearing until 2010 with version 4.0.


    # 12.1 TESSELLATION IN OPENGL


    OpenGL support for hardware tessellation is made available through three pipeline
    stages:


    +   1. the tessellation control shader

    2. the tessellator

    3. the tessellation evaluation shader


    > ¹ The OpenGL Utility library (GLU) had previously included a utility for tessellation
    much earlier called gluToss. In 2001, Radeon released the first commercial graphics
    card with tessellation support, but there were few tools to take advantage of
    it.'
