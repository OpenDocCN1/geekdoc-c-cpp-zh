  md: '# 4.3 INTERPOLATION OF VERTEX ATTRIBUTES


    It is important to understand how vertex attributes are processed in the OpenGL
    pipeline, versus how uniform variables are processed. Recall that immediately
    before the fragment shader is rasterization, where primitives (e.g., triangles)
    are converted by vertices to fragments. Rasterization linearly interpolates vertex
    attribute values so that the displayed pixels seamlessly connect the modeled surfaces.


    By contrast, uniform variables behave like initialized constants and remain unchanged
    each vertex shader invocation (i.e., for each vertex sent from the buffer). A
    uniform variable is not interpolated; it always contains the same value regardless
    of the number of vertices.


    The interpolation done on vertex attributes by the rasterizer is useful in many
    ways. Later, we will use rasterization to interpolate colors, texture coordinates,
    and surface normals. It is important to understand that all values sent through
    a buffer to a vertex attribute will be interpolated further down the pipeline.


    We see vertex attributes in a vertex shader declared as “in” to indicate that
    they receive values from a buffer. Vertex attributes may be declared as “out”,
    meaning they send their values forward toward the next stage in the pipeline.
    For example, the following declaration in a vertex specifies a vertex attribute
    named “color” that outputs vec4:


    ```

    out vec4 color;

    ```


    It is not necessary to declare an “out” variable for the vertex positions, because
    OpenGL has a built-in out vec4 variable named gl_Position for purpose. The vertex
    shader, we apply the matrix transformations to the incoming vertex (declared earlier
    as position), assigning the result to gl_Position:


    ```

    gl_Position = proj_matrix * mv_matrix * position;

    ```


    ![](img/a15a9f662738db7597e865cb1a19c561_86_0.png)


    The transformed vertices will then be automatically output to the rasterizer,
    with corresponding pixel locations ultimately sent to the fragment shader.


    The rasterization process is illustrated in Figure 4.2. When specifying GL_TRIANGLES
    in the glDrawArrays() function, rasterization is'
