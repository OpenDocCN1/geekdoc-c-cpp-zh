  md: 'The reason we cannot answer this question is due to the lack of shadows in
    the scene. We expect to see shadows, and our brain uses shadows to help build
    a more complete model of the objects we see and where they are located.


    Consider the same scene, shown in Figure 8.2, with shadows incorporated. It is
    now obvious that the torus is resting on the ground plane in the left example
    and floating above it in the right example.


    ![](img/a15a9f662738db7597e865cb1a19c561_210_0.png)


    # 8.2 PROJECTIVE SHADOWS


    A variety of interesting methods have been devised for adding shadows to 3D scenes.
    One method that is well-suited to drawing shadows on a ground plane (such as our
    image in Figure 8.1) and relatively computationally inexpensive, is called projective
    shadows. Given a point light position $(X_l, Y_l, Z_l)$, an object to render,
    and a plane on which the object''s shadow is to be cast, it is possible to draw
    a transformation matrix that will convert $(X_w, Y_w, Z_w)$ on the object to corresponding
    shadow points $(X_s, 0, Z_s)$ on the plane. The resulting “shadow polygon” is
    then drawn, typically as a dark object blended with the texture on the ground
    plane, as illustrated in Figure 8.3.


    The advantages of projective shadow casting are that it is efficient and simple
    to implement. However, it only works on a flat plane—the method can''t be used
    to cast shadows on a curved surface or other objects. It is still useful for performance-intensive
    applications involving outdoor scenes, as in many video games.


    Development of projective shadow transformation matrices is discussed in [BL88],
    [AS14], and [KS16].'
