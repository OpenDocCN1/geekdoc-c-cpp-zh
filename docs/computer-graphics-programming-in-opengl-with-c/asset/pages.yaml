  md: '![](img/a15a9f662738db7597e865cb1a19c561_287_0.png)


    **Figure 11.11**

    Recursive subdivision for Bézier surfaces.


    points in a sub-quadrant control mesh are within some small allowable distance

    from a plane defined by three of the four corner points of mesh. The distance

    d between a point (x,y,z) and a plane (A,B,C,D) is


    ```

    $d = abs\left(\frac{Ax + By + Cz + D}{\sqrt{A^2 + B^2}}\right)$

    ```


    If $d$ is less than some sufficiently small tolerance, then we stop subdividing,

    and simply use the four corner control points of the sub-quadrant mesh to draw

    two triangles.'
