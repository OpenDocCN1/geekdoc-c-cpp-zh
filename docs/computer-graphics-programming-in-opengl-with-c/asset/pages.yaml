    Assuming we use the method whereby a shadow texture has been attached to our custom
    framebuffer, OpenGL provides some relatively simple tools for determining each
    pixel is in shadow as we draw the objects. Here is a summary of the details handled
    in pass two:


    +   - Build the “B” transform matrix for converting to texture space (actually,
    this is more appropriately done in init()).

    - Enable the shadow texture for lookup.

    - Enable color output.

    - Enable the GLSL pass two rendering program, containing both vertex and fragment
    shaders.

    - Build the MVP matrix for the object being drawn based on the camera position
    (as normal).

    - Build the shadowMVP matrix (incorporating the B matrix, described earlier)—the
    shaders will need it to look up pixel coordinates in the shadow texture.

    - Send the matrix transforms to shader uniform variables.

    - Enable buffers containing vertices, normal vectors, and texture coordinates
    (if used), as usual.

    - Call glDrawArrays().


    In addition to their rendering duties, the vertex and fragment shaders have additional
    tasks:


    +   - The vertex shader converts vertex positions from camera space to light space
    and sends the resulting coordinates to the fragment shader in a vertex attribute
    so that they will be interpolated. This makes it possible to retrieve the correct
    values from the shadow texture.

    - The fragment shader calls the textureProj() function, returns a 0 or 1 indicating
    whether or not the pixel is in shadow (this mechanism is explained later). If
    it is in shadow, the shader outputs a darker pixel by not including its diffuse
    specular contributions.


    Shadow mapping is a common task that GLSL provides a special type of sampler variable
    called sampler2DShadow (previously mentioned) that can be attached to a shadow
    texture in the C++/OpenGL application. The textureProj() function is used to look
    up values from a shadow texture, and it is similar to texture() that we saw previously
    in Chapter 5, except that it uses a vec3 to index the texture'
