    # ORGANIZING THE C++ CODE FILES


    So far, we have been placing all of the C++/OpenGL application code in a single
    file called "main.cpp", and the GLSL shaders into files called "vertShader.glsl"
    and "fragShader.glsl". While we admit that stuffing a lot of application code
    into main.cpp isn''t a best practice, we have adopted this convention in this
    book so that it is absolutely clear in every example which file contains the main
    block of C++/OpenGL code relevant to the example being discussed. Throughout this
    text-, it will always be useful to modularize appropriately to reflect the tasks
    performed by the application.


    However, as we proceed, there will be circumstances in which we create others
    will be useful in many different applications. Wherever appropriate, we will move
    those modules into separate files to facilitate reuse. For example, later we will
    define a Sphere class that will be useful in many different examples, and so will
    be separated into its own files (Sphere.cpp and Sphere.h).


    Similarly, as we encounter functions that we wish to reuse, we will place them
    in a file called "Utils.cpp" (and an associated "Utils.h"). We have already seen
    functions that are appropriate to move into "Utils.cpp": the error-detecting modules
    described in Section 2.2, and the functions for reading in GLSL shader programs
    described in Section 2.3. The latter is well-suited to overloading, so that a
    “createShaderProgram() function can be defined for each possible combination of
    pipeline shaders assembled in a given application:


    +   - GLUtils::ShaderProgram(const char *vp,const char *fp)

    - GLUtils::ShaderProgram(const char *vp, const char *gp, const char *fp)

    - GLUtils::ShaderProgram(const char *vp, const char *ICS, const char *tES, const
    char *fp)

    - GLUtils::ShaderProgram(const char *vp, const char *tCS, const char *tES, const
    char *gp, const char *fp)


    The first case in the previous list supports shader programs which utilize only
    a vertex and fragment shader. The second supports those utilizing vertex, geometry,
    and fragment shaders. The third supports those using vertex, tessellation,'
