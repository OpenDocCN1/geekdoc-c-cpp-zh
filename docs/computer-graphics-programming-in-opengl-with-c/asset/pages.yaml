  md: 'A major limitation of environment mapping, as presented in this chapter, that
    it is only capable of constructing objects that reflect the cube map. Other objects
    rendered in the scene are not reflected in the reflection-mapped object. Depending
    on the nature of the scene, this might or might not be acceptable. If other objects
    are present that must be reflected in a mirror or chrome object, other methods
    must be used. A common approach utilizes the stencil buffer (mentioned earlier
    in Chapter 8) and is described in various web tutorials ([OV12], [NE14], and [GR16],
    for example), but it is outside the scope of this text.


    We didn''t include an implementation of skydomes, although they are in ways arguably
    simpler than skyboxes and can be less susceptible to distortion. Even environment
    mapping is simpler—at least the map—but the OpenGL support for cube maps makes
    skyboxes more practical.


    Of the topics covered in the layers of this textbook, skyboxes, skydomes are arguably
    the simplest conceptually. However, getting them to look convincing can consume
    a lot of time. We have dealt briefly with some of the issues that can occur (as
    seams), and depending on the texture image files used, other issues can occur,
    requiring additional repair. This is especially true when the scene is animated,
    or when the camera can be moved interactively.


    We glossed over the generation of usable and convincing cube map images. There
    are excellent tools for doing this, one of the most popular being Terragen [TE19].
    All of the cube maps in this chapter were made by the authors (except for the
    star field in Figure 9.6) using Terragen.


