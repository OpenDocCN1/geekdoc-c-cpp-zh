    head on a robot. The robot, of course, be defined in its own local/model space.
    Positioning the sphere model into the robot model space can be done using the
    matrix transforms for scale, rotation, and translation, as illustrated in Figure
    3.9. In this manner, complex models can be built hierarchically (this is developed
    further in Section 4.8 of Chapter 4 using a stack of matrices).


    In the same manner, modeled objects are placed in a simulated world by deciding
    on the orientation and dimensions of that world, called world space. The matrix
    that positions and or an object into world space is called a model matrix, or
    M.'
