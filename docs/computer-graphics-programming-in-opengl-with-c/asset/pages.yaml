  md: 'The vertex shader now specifies sixteen control points (the “patch” vertices)
    representing a particular Bézier surface. In this example they are all normalized
    to the range [-1,+1]. The vertex shader also uses the control points to determine
    texture coordinates appropriate for the tessellated grid, with values in the range
    [0.,1]. It is important to reiterate that the vertices output from the vertex
    shader are not vertices that will be rasterized, but are instead Bézier control
    points. When using tessellation, patch vertices are never tessellated—proceed
    to rasterization.


    The control shader still specifies the inner and outer tessellation levels. It
    now has the additional responsibility of forwarding the control points and texture
    coordinates to the evaluation shader. Note that the tessellation levels only need
    to be specified once, and therefore that step is done only during the 0th invocation
    (recall that the TCS runs once per vertex—thus there are sixteen invocations in
    this example). For convenience, we have specified thirty-subdivisions for each
    tessellation level.


    Next, the evaluation shader performs all of the Bézier surface computations. The
    large block of assignment statements at the beginning of main() extracts the control
    points from the incoming gl_Position_in (note that these correspond to the control
    shader''s gl_out variable). The weights for the blending functions are computed
    using the grid points coming from the tessellator, resulting in a new outputPosition
    to which the model-view-projection matrix is applied, producing an output gl_Position
    for each grid point and forming the Bézier surface.


    It is also necessary to create texture coordinates. The vertex shader only provided
    one per control point location. But it is not—we need texture coordinates for
    the much larger number of tessellated grids. There are various ways of doing this—here
    we linearly interpolate using GLSL’s mix function. The mix() function expects
    three parameters: (a) starting point, (b) ending point, and (c) interpolation
    value, which ranges from 0 to 1. The value between the starting and ending point
    corresponding to the interpolation value. The tessellated grid coordinates also
    range from 0 to 1, they can be used directly for this purpose.


    This time in the fragment shader, rather than outputting a single color, standard
    tessellation is applied. The texture coordinates in the attribute texCoord_TEsout
    are those that were produced in the evaluation shader. The changes to the C++
    program are similarly straightforward—note that a patch size of 16 is now specified.
    The resulting output is shown in Figure 12.5 (a tile texture from [LU16] is applied).'
