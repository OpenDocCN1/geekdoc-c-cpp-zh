  md: '# APPENDIX C

    USING THE NSIGHT GRAPHICS DEBUGGER


    +   C.1 About NVIDIA Nsight ................................................................................................497


    +   C.2 Setting Up Nsight ...................................................................................................498


    +   C.3 Running a C++/OpenGL Application in Nsight ................................................................498


    Debugging GLSL shader code is notoriously difficult. Unlike programming in typical
    languages such as C++ or Java, it is often unclear exactly a shader program failed.
    Often, a shader error manifests as a blank screen, offering no clues to the nature
    of the error. Even more frustrating is that there is no way to print out the values
    of shader variables during run time, as one would commonly when tracking down
    an elusive bug.


    We listed some techniques for detecting OpenGL and GLSL errors in Section 2.2.
    Despite the help that these techniques provide, the lack of a simple ability to
    display shader variables is a serious handicap.


    For this reason, graphics card manufacturers have sometimes provided capabilities
    in hardware for extracting information from shaders at run time and have built
    tools for accessing the information in the form of a graphics debugger. Each manufacturer''s
    debugging tools work only in the presence of that manufacturer''s graphics card.
    NVIDIA''s graphics debugger is part of a larger suite of tools called Nsight,
    and AMD has a similar suite of tools called CodeXL. This appendix describes how
    to get started using Nsight.


    # C.1 ABOUT NVIDIA NSIGHT


    Nsight is an NVIDIA suite of tools that includes a graphics debugger which makes
    it possible to look inside the stages of the OpenGL graphics pipeline, including
    shaders, while a program is running. It isn''t necessary to change or add any
    code.'
  merge: -1
