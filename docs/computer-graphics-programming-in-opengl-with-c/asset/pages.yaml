    # 4.4 MODEL-VIEW AND PERSPECTIVE MATRICES


    A fundamental step in rendering an object in 3D is to create appropriate transformation
    matrices and send them to uniform variables like we do in Section 4.2. We start
    by defining three matrices:


    +   1. a Model matrix

    2. a View matrix

    3. a Perspective matrix


    The Model matrix positions and orients the object in the world coordinate space.
    Each model has its own model matrix, and that matrix would need to be continuously
    rebuilt if the model moves.


    The View matrix moves and rotates the models to simulate the effect of a camera
    at a desired location. Recall from Chapter 2 that the OpenGL camera exists at
    location (0,0,0) and faces down the negative Z Axis. To simulate the appearance
    of that camera being moved a certain way, we will need to move the objects themselves
    in the opposite direction. For example, moving a camera to the right would cause
    the objects in the scene to appear to move to the left; although OpenGL camera
    is fixed, we can make it appear as though we have moved it to the right by moving
    the objects to the left.


    The Perspective matrix is a transform that provides the 3D effect according to
    the desired frustum, as described earlier in Chapter 3.


    It is also important to understand when to compute each type of matrix. Matrices
    that never change can be built in init(), but those that change need to be built
    in display() so that they are rebuilt for each frame. Let''s assume that the models
    are animated and the camera is movable.


    +   * A Model matrix needs to be created for each model and at each frame.

    * The view matrix needs to be created once per frame (because the camera can be
    moved), but it is the same for all objects rendered during that frame.'
