  md: '# Chapter 11 · Parametric Surfaces 265


    we will refer to the parameters as **u** and **v**.\ Whereas our curves were composed
    of points P(t), our surfaces will comprise points P(u,v), as shown in Figure 11.8.


    For Bézier surfaces, there are three control points on each axis $u$ and $v$,
    for a total of **nine** control points. Figure 11.9 shows an example of a set
    of nine control points (typically called *control point ''mesh''*) in blue, and
    the associated curved surface (in red).


    ![](img/a15a9f662738db7597e865cb1a19c561_285_0.png)


    Figure 11.8

    Parametric surface.


    The control points in the mesh are labeled $P_{ij}$, where $i$ and $j$ represent
    the indices in the $u$ and $v$ directions respectively. Each of three adjacent
    control points, such as $P_{00}, P_{01}, P_{02}$, defines a Bézier curve. Points
    P(u,v) on the surface are then defined as a sum of two blending functions, one
    in the $u$ direction and one in the $v$ direction. The form of the two blending
    functions for surfaces follows from the methodology given previously for Bézier
    curves:


    ![](img/a15a9f662738db7597e865cb1a19c561_285_1.png)


    Figure 11.9

    Quadratic Bézier mesh and corresponding surface.


    ```

    $B_0(u) = (1 - u)^2$

    $B_1(u) = -2u^2 + 2u$

    $B_2(u) = u^2$

    $B_0(v) = (1 - v)^2$

    $B_1(v) = -2v^2 + 2v$

    $B_2(v) = v^2$

    ```


    The points P(u,v) comprising the Bézier surface are then generated by summing
    the product of each control point $P_{ij}$ and the $i^{th}$ and $j^{th}$ blending
    functions evaluated at parametric values $u$ and $v$:


    ```

    $P(u,v) = \sum_{i=0} \sum_{j=0} P_{ij} * B_i(u) * B_j(v)$

    ```'
