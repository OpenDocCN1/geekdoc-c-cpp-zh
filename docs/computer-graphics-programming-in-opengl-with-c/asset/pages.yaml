    # 16.3.3 Generalizing the Solution


    Our solution works well, but for a particular set of objects: one transparent
    and partially reflective sphere, one textured and partially reflective box, a
    procedurally textured plane, and a solid-colored room box. If we wish to alter
    the set of objects in the scene, by adding another box, or making the sphere textured,
    we would have to not only change the declarations at the top of the compute shader,
    but also need to make significant changes in the process_stack_element() and get_closest_collision()
    functions. What we really need is a more general solution that allows us to define
    an arbitrary set of these objects.


    To achieve this, we introduce another struct for specifying an object in the scene,
    and then build an array of these objects. The get_closest_collision() function
    iterates through them, taking into account the type of each object. The room box
    is handled separately as the 0th object, and we assume there is one of those.


    Our “general” solution has limitations; there are many ways of defining texture
    coordinates even simple shapes. So, our solution is still limited to spheres,
    planes, and boxes with texture coordinates as specified so far, a single room
    box, global ambient light plus a single positional light (although adding more
    lights is not difficult), and a fixed camera facing down the negative Z axis.
