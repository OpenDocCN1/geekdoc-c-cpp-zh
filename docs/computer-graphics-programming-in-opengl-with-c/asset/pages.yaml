  md: '# 7.5.2 Phong Shading


    Bui Tuong Phong developed a smooth shading algorithm while a graduate student
    at the University of Utah, and described it in his 1973 dissertation [PH73] and
    published it in [PH75]. The structure of the algorithm is similar to the algorithm
    for Gouraud shading, except that the lighting computations are done per-pixel
    rather than per-vertex. Since the lighting computations require a normal vector
    $N$ and a light vector $L$, which are only available in the model on a per-vertex
    basis, Phong shading is often implemented using a clever “trick,” where $N$ and
    $L$ are computed in the vertex shader and *interpolated* during rasterization.
    Figure 7.10


    outlines the strategy:


    | OpenGL (C++) code | | Vertex shader | Fragment shader |

    | :--- | :---: | :--- | :--- |

    | (same as for Gouraud shading) | | 1. compute:<br>$N, L, V$ | 1. incoming interpolated:<br>$N,
    L, V$ |

    | | | 2. output attributes:<br>$N, L, V$<br>gl\_Position$ | 2. compute:<br>$R,
    \theta, \phi$ |

    | | | | 3. compute ADS |

    | | | | 4. output color |


    **Figure 7.10**nPhong shading.


    The C++/OpenGL code is completely unchanged. Some of the computations previously
    done in the vertex shader are now moved into the fragment shader. The effect of
    interpolating normal vectors is illustrated in Figure 7.11:


    ![](img/a15a9f662738db7597e865cb1a19c561_198_0.png)


    **Figure 7.11**nInterpolation of normal vectors.'
