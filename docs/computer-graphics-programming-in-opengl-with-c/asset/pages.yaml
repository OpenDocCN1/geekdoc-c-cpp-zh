  md: '# Chapter 16 · Ray Tracing and Compute Shaders 429


    ![](img/a15a9f662738db7597e865cb1a19c561_449_0.png)


    **Figure 16.14**

    Refraction with secondary rays, through a transparent sphere

    (the angles have been exaggerated for clarity)


    The derivation for computing a refraction angle is well-documented [F96]:


    ```

    $S = \left(\eta_n(N \cdot I) - \sqrt{1-\eta_n^2(1-dot(N,I)^2)}\right)N - \eta_nI$

    ```


    where $\eta_n$ is the ratio of the IOR of the source and destination media. Then
    using this formula, we use the GLSL refract() function that implements it. `refract()`
    takes three parameters as input: the incoming vector $I$, the normal vector $N$,
    and the IOR ratio $\eta_n$. It produces the refracted secondary ray $S$ as output.


    For a transparent solid sphere, the IOR at the point of entry is $IOR_{air}/IOR_{glass}
    = 1.0/1.5 \approx 0.66$, and at the point of exit, it is $IOR_{glass}/IOR_{air}
    = 1.5/1.0 = 1.5$.


    Program 16.10 converts the sphere to transparent glass, using a sequence of secondary
    rays so as to generate the refraction of the brick box and skybox behind it. We
    have also built yet the `raytrace()` function, so that the two secondary rays
    can be generated and traced in succession, entering the sphere (with IOR=0.66)
    and leaving it (with IOR=1.5). Lighting is included in both the entry and exit
    points. Since the color and lighting values are all fractions in the range [0..1],
    and we are multiplying them, it is common to also need to scale the resulting
    color values or the final result will be too dark; here we scaled the refracted
    colors up by a factor of 2.0.


    Note also that the trick we used to avoid surface acne is modified slightly in
    both functions; instead of adding a small offset along the normal, we subtract
    the offset. This is because the secondary rays now continue through the collision
    rather than rebounding. So, for refracted rays, we must add a small offset along
    the negative of the normal.'
