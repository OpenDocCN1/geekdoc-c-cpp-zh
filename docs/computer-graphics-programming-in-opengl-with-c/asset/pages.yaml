  md: '# 11.4 CUBIC BÉZIER SURFACES


    The set of generated points that comprise a Bézier surface is sometimes called
    a patch. The term "patch" can be confusing, as we will see later when we study
    tessellation shaders (useful for actually implementing Bézier surfaces). There,
    it is the grid of control points that is typically called a “patch.”


    Moving from quadratic to cubic surfaces requires utilizing a larger mesh—4x4 rather
    than 3x3. Figure 11.10 shows an example of a 16-control-point mesh (in blue),
    and the corresponding curved surface (in red).


    ![](img/a15a9f662738db7597e865cb1a19c561_286_0.png)


    As before, we can derive the formula for P(u,v) on the surface by combining the
    associated blending functions for cubic curves:


    ```

    $P(u,v) = \sum_{i=0}^{3} \sum_{j=0}^{3} P_{i,j} * B_i(u) * B_j(v)$

    ```


    where:


    ```

    $B_0(u) = (1-u)^3$

    $B_1(u) = 3u - 6u^2 + 3u^3$

    $B_2(u) = -3u^2 + 3u^3$

    $B_3(u) = u^3$

    ```


    ```

    $B_0(v) = (1-v)^3$

    $B_1(v) = 3v - 6v^2 + 3v^3$

    $B_2(v) = -3v^2 + 3v^3$

    $B_3(v) = v^3$

    ```


    Rendering Bézier surfaces can also be done with recursive subdivision [AS14],
    by alternately splitting the surface in half along each dimension, as shown in
    Figure 11.11. Each subdivision produces four new control point meshes, each containing
    sixteen points which define one quadrant of the surface.


    When rendering Bézier curves, we stopped subdividing until the curve was "straight
    enough." For Bézier surfaces, we stop recursing until the surface is "flat enough."
    One way of doing this is to ensure that all of the recursively generated'
