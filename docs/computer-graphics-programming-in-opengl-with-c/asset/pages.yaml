  md: 'Matrix multiplication is frequently referred to as *concatenation*, because
    as will be seen, it is used to combine a set of matrix transforms into a single
    matrix. This ability to combine matrix transforms is made possible by the *associative*
    property of matrix multiplication. Consider the following sequence of operations:


    New Point = Matrix₁ * (Matrix₂ * Matrix₃ Point))


    Here, we multiply a point by Matrix₁, then multiply that result by Matrix₂, and
    that result finally by Matrix₁. The result is a new point. The associative property
    ensures that the previous computation is equivalent to:


    New Point = (Matrix₁, Matrix₂, Matrix₃) * Point


    Here, we multiply the three matrices together, forming the *concatenation* of
    Matrix₁, Matrix₂, and Matrix₃ (which itself is also a 4x4 matrix). If we refer
    to this concatenation as Matrix_c, we can rewrite the previous operation as:


    New Point = Matrix_c * Point


    The advantage here, as we will see in Chapter 4, is that we will frequently apply
    the same sequence of matrix transformations to every point in our scene. By pre-computing
    the concatenation of all of those matrices once, it turns out that we can reduce
    the total number of matrix operations needed manifold.


    GLSL and GLM both support matrix multiplication with the overloaded * operator.


    The *inverse* of a 4x4 matrix M is another 4x4 matrix, denoted M⁻¹, that has the
    following property under matrix multiplication:


    M*(M⁻¹)M = (M⁻¹)¹M = identity matrix


    We won''t present the details of computing the inverse here. However, it is worth
    knowing that determining the inverse of a matrix can be computationally expensive;
    therefore, we rarely need it. In the instances when we do, it is available in
    both GLSL and GLM through the mat4.inverse() function.


