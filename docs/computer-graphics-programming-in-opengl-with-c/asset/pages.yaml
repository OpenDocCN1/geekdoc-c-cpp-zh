    # HISTORICAL NOTE


    We took the liberty of over-simplifying some of the terminology in this chapter
    with respect to the contributions of Gouraud and Phong. Gouraud is credited with
    Gouraud shading—the notion of generating a smoothly surface appearance by computing
    light intensities at vertices and allowing the rasterizer to interpolate these
    values (sometimes “smooth shading”). Phong is credited with Phong shading, another
    form of smooth shading that interpolates normals and computes light per pixel.
    Phong is also credited with pioneering the successful incorporation of specular
    highlights into smooth shading. For this reason, the ADS lighting model, when
    applied to computer graphics, is often referred to as the Phong Reflection Model.
    Our example of Gouraud shading is, more accurately, Gouraud shading with a Phong
