  md: '# 318 Computer Graphics Programming in OpenGL with C++, 2/E


    Actually, the reason that the back faces of the pyramid did not appear is because
    we enabled back-culling. A reasonable idea might be to disable back-culling while
    drawing the pyramid. However, this often produces other artifacts, as shown in
    Figure 14.5 (on the left). The problem with disabling back-culling is that the
    effects of blending on the order that are rendered (which determines the source
    and destination pixels), and we don''t always have control over the rendering
    order. It is generally advantageous to render opaque objects, as well as objects
    that are in the back (such as the torus) before any transparent objects. This
    also holds true for the surfaces of the pyramid, and in this case the reason that
    the two triangles comprising the base of the pyramid appear different is that
    one of them was rendered before the front of the pyramid and one was rendered
    after. Artifacts such as are sometimes called “ordering” artifacts, which can
    manifest in transparent models because we cannot always predict the order in which
    its triangles will be rendered.


    We can solve the problem in our example by rendering the front and back faces
    separately, ourselves, starting with the back faces. Program 14.2 shows the code
    for doing this. We specify the alpha value for the pyramid by passing it to the
    shader program in a uniform variable, then apply it in the fragment shader by
    substituting the specified alpha into the computed output.


    Note that for working properly, we must flip the normal vector when rendering
    the back faces. We accomplish this by sending a flag to the vertex shader, and
    there we flip the normal vector.


    # Program 14.2 Two-Pass Blending for Transparency


    C++ / OpenGL application - in display(1) for rendering pyramid:


    ```

    glEnable(GL_CULL_FACE);

    Enable(GL_BLEND);                // configure blend settings

    BlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);

    BlendEquation(Equation(GL_FUNC_ADD);

    glCullFace(GL_FRONT);               // render back faces first

    glProgramUniform1f(renderingProgram, aLoc, 0.3f);    // back faces very transparent

    glProgramUniform1f(renderingProgram, fLoc, -1.0f); // flip normals on back faces

    glDrawArrays(GL_TRIANGLES, 0, numPyramidVertices);

    ```'
