  md: 'To understand how this works, we start by noting that a vector can be stored
    to reasonable precision in three bytes, one for each of the X, Y, and Z components.
    This makes it possible to store normals in a color image file, with the R, G,
    and B components corresponding to X, Y, and Z. RGB values in an image are stored
    in bytes and are usually interpreted as values in the range [0..1], whereas vectors
    can have positive or negative component values. If we restrict normal components
    to the range [-1..1], a simple conversion to storing normal vector N as a pixel
    in an image file is:


    ```

    R=(N_x + 1)/2

    G=(N_y + 1)/2

    B=(N_z + 1)/2

    ```


    We can use of such a normal map through another application of texture units:
    instead of storing colors in the texture unit, we store the desired normal vectors.
    We can then use a sampler to look up the value in the normal map to output the
    pixel color (as we did in texture mapping), we use it as the normal vector.


    ![](img/a15a9f662738db7597e865cb1a19c561_264_0.png)


    One example of such a normal map image file is shown in Figure 10.3. It was generated
    by applying the GIMP normal mapping plugin [GI20] to a texture from Luna [LU16].
    Normal-mapping image files are not intended for viewing; we show this to point
    out that such images end up being largely blue. This is because every entry in
    the image file has a B value of 1 (maximum blue), making the image appear “bl
    bluish” if viewed.


    Figure 10.3

    Normal mapping image file example [LU16].'
