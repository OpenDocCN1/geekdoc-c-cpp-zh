    These and similar sampling error artifacts can be largely corrected by a technique
    called mipmapping, in which different versions of the texture image are created
    at various resolutions. OpenGL uses the texture image that closely matches the
    resolution at the point being textured. Even better, colors can be averaged between
    the images closest in resolution to that of the region being textured. Results
    of applying mipmapping to the images in Figure 5.7 and Figure 5.8 are shown in
