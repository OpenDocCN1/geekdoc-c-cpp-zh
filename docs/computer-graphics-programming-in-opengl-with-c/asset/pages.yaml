    We can build a single transform that does both the rotation and the translation
    in one matrix, called the viewing transform matrix, or V. The matrix V is produced
    by concatenating the two matrices T (a translation matrix containing the desired
    camera location) and R (a rotation matrix containing the negative of the desired
    camera orientation). In this case, working from right to left, we first translate
    point P, then rotate it:


