  md: '# Computer Graphics Programming in OpenGL with C++, 2E


    +   - Some Macs, as those with a Retina display, are slightly trickier when it
    comes to setting up the GLFW rendering resolution. After creating the window with
    glfCreateWindow(), you will need to retrieve the actual screen dimensions from
    the frame buffer, as follows:


    int actualScreenWidth,actualScreenHeight;

    glfwGetFramebufferSize(window,&actualScreenWidth,&actualScreenHeight);

    Then, after the glfwMakeContext(current) command, add the following line:

    glViewport(0,0,actualScreenWidth,actualScreenHeight);


    This will ensure that what is drawn to the framebuffer matches what appears in
    the GLFW window.

    - Finally, immediately before initializing GLEW with glewInit(), add the following
    line:

    glewExperimental = GL_TRUE;


    # B.2.2 Modifying the GLSL Code


    Some changes need to be made at various locations in our GLSL shader code (and
    of the associated C++/OpenGL code) because of the slightly later-version of OpenGL
    (specifically, 4.1) present in Macs:


    +   - The specified version number in the shaders must be changed. Presuming that
    your Mac supports version 4.1, at the top of each shader locate the line that
    says:


    #version 430

    this must be changed to:

    #version 410

    - Version 4.1 doesn''t support layout binding qualifiers for texture sampler variables.
    This affects material starting from Chapter 5. You''ll need to remove the layout
    binding qualifiers, and replace them with another command that accomplishes the
    same thing. Specifically, look for lines in the shaders that have the following
    format:


    layout (binding=0) uniform sampler2D sampler;

    nThe texture unit number specified in the binding clause might be different (it
    is "0" here), and the name of the sampler variable might be different (it is "sampler"
    here). In any case, you''ll need to remove the layout clause, and simplify the
    command so that it just says:


    uniform sampler2D sampler;


    Then, you''ll need to add the following command to the C++ program for each texture
    enabled:'
