    # ##17.4 CORRECTING LENS DISTORTION IN HEADSETS


    Headsets for viewing side-by-side images utilize high-field-of-view lenses that
    often suffer from lens distortion. Two important types of distortion in lenses
    are *pincushion distortion*, where objects on the periphery bow outward, and *barrel
    distortion*, where objects on the periphery bow inwards. Figure 17.7 shows a simple
    grid, and then the same grid having been distorted with both pincushion and barrel
    distortions.'
