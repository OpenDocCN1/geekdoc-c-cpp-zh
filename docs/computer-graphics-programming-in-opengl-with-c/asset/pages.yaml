  md: '# CHAPTER 10


    # ENHANCING SURFACE DETAIL


    +   10.1 Bump Mapping ...................................................................................................241


    +   10.2 Normal Mapping ...................................................................................................243


    +   10.3 Height Mapping ...................................................................................................252


    +   Supplemental Notes ...............................................................................................256


    ![](img/a15a9f662738db7597e865cb1a19c561_261_0.png)


    Suppose we want to model an object with an irregular surface—like the bumpy surface
    of an orange, the wrinkled surface of a raisin, or the cratered surface of the
    moon. How would we do it? So far, we learned two potential methods: (a) we could
    model the entire irregular surface, which would be impractical (a highly cratered
    surface would require a huge number of vertices); or (b) we could apply a texture-map
    image of the irregular surface to a smooth version of the object. The second option
    is often effective. However, if the scene includes lights, and the lights (or
    camera angle) move, it becomes quickly obvious that the object is statically textured
    (and smooth), because the light and dark areas on the texture wouldn''t change
    as they would if the object was actually bumpy.


    In this chapter, we are going to explore several related methods for using lighting
    to make objects appear to have realistic texture, even if the underlying object
    model is smooth. We will start by examining bump mapping and normal mapping, which
    can add considerable realism to the objects in our scenes when it would be too
    expensive to include tiny surface details in the object models. We will also look
    at ways of actually perturbing the vertices in a smooth surface through height
    mapping, which is useful for generating terrain (and other uses).


    # 10.1 BUMP MAPPING


    In Chapter 7, we saw how surface normals are critical to creating convincing lighting
    effects. Light intensity at a pixel is determined largely by the reflection angle,'
  merge: -1
  pgno: 261
- img_proc: true
  md: '242 Computer Graphics Programming in OpenGL with C++, 2/E


    taking into account the light source location, camera location, and the normal
    vector at the pixel. Thus, we can avoid generating detailed vertices corresponding
    to a bumpy or wrinkled surface if we can find a way of generating the corresponding
    normals.


    ![](img/a15a9f662738db7597e865cb1a19c561_262_0.png)


    10.1 illustrates the concept of modified normals responding to a single "bump".


    **10.1**

    Perturbed normal vectors for bump mapping.


    Thus, if we want to make an object look like it has bumps (wrinkles, craters,
    etc.), one way is to compute the normals that would exist on such a surface. Then
    when the scene is lit, the lighting would produce the desired illusion. This was
    first proposed by Blinn 1978 [BL78], and it became practical with the advent of
    the capability of performing per-pixel lighting in fragment shader.


    ![](img/a15a9f662738db7597e865cb1a19c561_262_1.png)


    **10.2**

    Procedural bump mapping example.


    An example is illustrated in the vertex and fragment shaders shown in Program
    10.1, which produces a torus with a "golf-ball" surface in Program 10.2. The code
    is almost identical to what we saw previously in Program 7.2. The only significant
    change is in the fragment shader—the incoming interpolated normal vectors (varyingNormal
    in the original program) are altered with bumps calculated using a sine wave function
    in the X, Y, and Z axes applied to the original (untransformed) vertices of the
    torus model. Note that the shader therefore now needs to pass these untransformed
    vertices down the pipeline.


    Altering the normals in this manner, with a mathematical function computed at
    runtime, is called procedural bump mapping.'
