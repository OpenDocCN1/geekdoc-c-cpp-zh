    one of its lenses (right), exhibiting pincushion distortion


    Because headsets tend to use lenses that produce pincushion distortion, applications
    that target virtual reality headsets usually try to anticipate the pincushion
    distortion and correct it by applying a reverse distortion, specifically barrel
    distortion. Since different headset lenses can have different properties, this
    distortion correction would ideally be tunable for different headsets.'
