    # 4.8 MATRIX STACKS


    So far, the models we have rendered have each been constructed of a single set
    of vertices. It is often desired, however, to build complex models by assembling
    smaller, simple models. For example, a model of “robot” could be created by separately
    drawing the head, body, legs, and arms, each of those is a separate model. An
    object built in this manner is often called a hierarchical model. The tricky part
    of building hierarchical models is keeping track of all the model-view matrices
    and making sure they stay perfectly coordinated—otherwise the robot fly fly into
    pieces!


    Hierarchical models are useful not for building complex objects—they can also
    be used to generate complex scenes. For example, consider how our planet Earth
    revolves around the sun, and in turn how the moon revolves around the Earth. Such
    a scene is seen in Figure 4.11⁵ Computing the moon’s actual


