    The reader may still wonder why it can be advantageous to subdivide a solution
    among work groups, rather than simply making each work group of size 1 and dispatching
    a large number of them (or, conversely, one very large group). Some problems lend
    themselves to being decomposed into chunks, such as an image blurring filter (described
    in [SW15]) in which the colors of neighboring pixels are averaged together. In
    such cases, the need for shared data within a group arises and is supported by
    OpenGL’s shared local memory construct (which is not covered in this book). In
    some cases, there can be performance benefits to selecting a work group size that
    best utilizes a particular GPU’s architecture [Y10].


    Our ray tracing application builds a two-dimensional texture image. So it makes
    sense to utilize abstract grids that are 2D dimensionality. For simplicity, we
    set the work group size to 1 and generate a work group for each pixel. For example,
    if our ray traced image is of size 512×512, we would call glDispatchCompute(512,1,1)
    and in the compute shader use layout (local_size_x=1); to denote a work group
    size of (1,1,1). This will generate a compute shader invocation for each pixel.
    Alternatively, we could subdivide the problem into work groups of size 8×8 by
    calling glDispatchCompute(64,64,1) and in the compute shader use layout (local_size_x=8,
    local_size_y=8); to denote a work group size of (8,8,1). This would also generate
