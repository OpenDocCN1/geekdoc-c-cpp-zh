    There are a variety of methods for simulating fog, from very simple ones to sophisticated
    methods that include light scattering effects. However, even very simple approaches
    can be effective. One method is to blend the actual pixel color with another (the
    "fog" color), typically gray or bluish-gray—also used for the background color),
    based on the distance the object is from the eye.


    Figure 14.1 illustrates the concept. The eye (camera) is shown at the left, and
