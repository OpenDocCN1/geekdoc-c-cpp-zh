    Now, let''s say we wish to draw a cube, and let us presume that the vertices of
    our cube are hardcoded in an array in the C++/OpenGL application. In case, we
    need to copy those values into one of two buffers that we previously generated.
    To do that, we need to (a) make that buffer (the 0th buffer) "active" with the
    glBindBuffer() command, and (b) use the glBufferData() command to copy the array
    containing the vertices into the active buffer (the 0th VBO in case). Presuming
    that the vertices are stored in a float array named vPositions, the following
    C++ code would copy those values into the 0th VBO:


    ```

    glBindBuffer(GL_ARRAY_BUFFER, vbo[0]);

    glBufferData(GL_ARRAY_BUFFER, sizeof(vPositions), vPositions, GL_STATIC_DRAW);

    ```


    Next, we add code to display that will call the values in the buffer to be the
    vertex attribute in the shader. We do this with the following three steps: (a)
    make that buffer "active" with the glBindBuffer() command as we did above, (b)
    associate the active buffer with a vertex attribute in the shader, and (c) enable
    the vertex attribute. The following lines of code complete these steps:


    ```

    glBindBuffer(GL_ARRAY_BUFFER, vbo[0]); // make the 0th buffer "active"

    glVertexAttribPointer(0, 3, GL_FLOAT, GL_FALSE, 0, 0); // associate 0th attribute
    with buffer

    EnableVertexAttribArray(0); // enable the 0th vertex attribute

    ```


    Now when we execute glDrawArrays(), data in the 0th VBO will be transmitted to
    the vertex attribute that has a layout qualifier with location 0. This sends the
    cube vertices to the shader.


