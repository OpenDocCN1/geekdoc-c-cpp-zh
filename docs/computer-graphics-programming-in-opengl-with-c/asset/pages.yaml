    +   - How do we make the skybox appear “distant”?


    Another factor in building a skybox is ensuring that the texture appears as a
    distant horizon. At first, one might assume this would require making the skybox
    very large. However, it turns out that this isn’t desirable because it would stretch
    and distort the texture. Instead, it is possible to make the skybox appear very
    (and thus distant), using the following two-part trick:


    +   - Disable testing and render the skybox first (re-enabling depth testing when
    rendering the other objects in the scene).

    - Move the skybox with the camera (if the camera moves).


    By drawing the skybox first with depth testing, the depth buffer will still be
    filled completely with 1s (i.e., maximally far away). Then, all other objects
    in the scene will be fully rendered; none of the other objects will be blocked
    by the skybox. This causes the walls of the skybox to appear farther away every
    other object, regardless of the actual size of the skybox. The actual skybox itself
    could be quite small, as long as it is moved along the camera whenever the camera
    moves. Figure 9.4 shows viewing a simple scene (actually just a brick-textured
    torus) from inside a skybox.'
