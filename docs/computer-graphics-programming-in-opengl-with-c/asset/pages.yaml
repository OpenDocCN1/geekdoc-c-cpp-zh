    # 8.6 SHADOW MAPPING ARTIFACTS


    Although we have implemented all of the basic requirements for adding shadows
    to our scene, running Program 8.1 reduces mixed results, as shown in Figure 8.11.


    There are wavy lines covering many of the surfaces in the scene. This is a common
    by-product of shadow mapping, and is called shadow acne or erroneous self-shadowing.


    Figure 8.11 Shadow ''acne''.


    ![](img/a15a9f662738db7597e865cb1a19c561_225_0.png)


    Shadow acne is caused by rounding errors during depth testing. The texture coordinates
    computed when looking up the depth information in a shadow texture often don''t
    exactly match the actual coordinates. Thus, the lookup may return the depth for
    a neighboring pixel, rather than the one being rendered. If the distance to the
    neighboring pixel is further, then our pixel will appear to be in shadow even
    if it isn’t.


    The good news is that our pyramid is now casting a shadow on the torus! Unfortunately,
    this success is accompanied by a severe artifact.'
