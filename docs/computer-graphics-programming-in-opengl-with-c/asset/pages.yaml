    call. The shader was written in such a way that each of the invocations processed
    a different element of the matrix.


    However, the glDispatchCompute() function is more flexible than that. Its three
    parameters make it possible to spread the computations over a 1D, 2D or 3D grid.
    In the matrix example, the matrices had dimension 4x1, so it was logical to spread
    the invocations over a 1D matrix of dimension 4x11 (which is what we did). However,
    soon we will write a compute shader that uses tracing to produce a display image,
    and in application we will process each pixel in parallel. The display is a 2D
    grid of pixels, it will make more sense to specify the set of computations in
    a 2D grid. For example, if the GL window was 800x600 pixels, then we could initialize
    the compute shaders with glDispatchCompute(800, 600, 1), and then gl_GlobalInvocationID
    would correspond directly to the value of a particular pixel''s 2D coordinates.
    The total number of invocations would be 800x600 = 480,000. OpenGL will assign
    these 480,000 invocations to many different processors (running in parallel) all
    at.


    The setup for compute shader invocations is even more flexible than that! In this
    last example, the total number 800x600 = 480,000 specified in the glDispatchCompute
    is actually not strictly the number of invocations, but the number of work groups.
    In our simple matrix example, the compute shader specified:


    ```

    layout(local_size_x=1);

    ```


    the work group size was set to 1, meaning that there was one invocation per workgroup.
