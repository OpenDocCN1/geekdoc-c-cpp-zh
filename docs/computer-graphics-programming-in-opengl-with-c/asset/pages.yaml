  md: 'Mipmapping is richly supported in OpenGL. There are mechanisms provided for
    building your own mipmap levels or having OpenGL build them for you. In most cases,
    the mipmaps build automatically by OpenGL are sufficient. This is done by adding
    the following lines of code to the Utils::loadTexture() function (described earlier
    in Section 5.1), immediately after the getTextureObject() function call:


    ```

    glBindTexture(GL_TEXTURE_2D, textureID);

    Parameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);

    glGenerateMipmap(GL_TEXTURE_2D);

    ```


    This OpenGL call to generate the mipmaps. The brick texture is active with the
    glBindTexture(), and then the glTexParameteri() function call enables one of the
    minification factors listed previously, as GL_LINEAR_MIPMAP_LINEAR shown in the
    above call, which enables trilinear filtering.


    Once the mipmap is built, the filtering option can be changed (although this is
    rarely necessary) by calling glTexParameteri() again, such as in the display function.
    Mipmapping can be disabled by selecting GL_NEAREST or GL_LINEAR.


    For critical applications, it is possible to build the mipmaps yourself, using
    whatever is your preferred image editing software. Then they can be added as mipmap
    levels when creating the texture object by repeatedly calling OpenGL’s glTexImage2D()
    function for each mipmap level. Further discussion of this approach is outside
    the scope of this book.


    # 5.9 ANISOTROPIC FILTERING


    Mipmapped textures can sometimes appear more blurry than non-mipmapped textures,
    especially when the textured object is rendered at a heavily tilted viewing angle.
    We saw an example of this in Figure 5.9, reducing artifacts with mipmapping led
    to reduced detail (compared with Figure 5.8).


    This loss of detail occurs when an object is tilted, its primitives appear smaller
    along one axis (i.e., width vs. height) than the other. When OpenGL textures a
    primitive, it selects the mipmap appropriate for the smaller of the two axes (to
    avoid “sparkling” artifacts). In Figure 5.9, the surface is tilted heavily from
    the viewer, each rendered primitive will utilize the mipmap appropriate for its
    reduced height, which is likely to have a resolution lower than appropriate for
    its width.'
