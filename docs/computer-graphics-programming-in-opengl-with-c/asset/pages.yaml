    Although faceted shading can be adequate in some circumstances (or used as a deliberate
    effect), usually a better approach is "smooth shading," in which the lighting
    intensity is computed for each pixel. Smooth shading is feasible because of the
    parallel processing done on modern graphics cards, and because of the interpolated
    rendering that takes place in the OpenGL graphics pipeline.


