  md: '# Chapter 14 · Other Techniques 349


    The discard command should, if possible, used sparingly, because it can incur
    a performance penalty. This is because its presence makes it more difficult for
    OpenGL to optimize Z-buffer depth testing.


    # SUPPLEMENTAL NOTES


    When specifying a user-defined clipping plane for the plane $ax + by + cz + d
    = 0$, the plane should be “normalized” so that $\sqrt{a^2+b^2+c^2}=1$. The plane
    that we used in the example shown in Section 14.3 was already normalized in this
    manner. Alternatively, the distance $d$ can be divided by $\sqrt{a^2+b^2+c^2}$.


    In this chapter, we used Perlin noise to generate and simulate both wood and a
    marble-like stone from which we rendered the dragon. People have found many others
    for Perlin noise. For example, it has been used to create fire and smoke [CC16,
    AF14] and build realistic bump maps [GR05]; it has been used to generate terrain
    in the video game Minecraft [PE11].


    The noise maps generated in this chapter are based on procedures outlined by Lode
    Vandevenne [VA04]. There remain some deficiencies in our 3D cloud generation.
    Occasionally, small horizontal and vertical structures appear that don’t look
    very cloud-like. Another issue is that at the northern peak of the skydome spherical
    distortion can cause a pincunction effect.


    The clouds implemented in this chapter also fail to model some important aspects
    of real clouds, such as the way that real clouds scatter the sun’s light. Real
    clouds also tend to be more white on the top and gray at the bottom. Our clouds
    also not achieve a 3D “fluffy” look like many actual clouds have.


    Similarly, more expressive models for generating fog, such as the one described
    by Kilgard and Fernando [KF03].


    While using the OpenGL documentation, the reader might notice that GLSL includes
    some noise functions named noise(1), noise(2), noise(3), and noise(4), which are
    described as taking an input seed and producing Gaussian-like stochastic output.
    We didn’t use these functions in this chapter because, as of this writing, most
    vendors have not implemented them. For example, many NVIDIA cards currently return
    0 for these functions, regardless of the input seed.'
