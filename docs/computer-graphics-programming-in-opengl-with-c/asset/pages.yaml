  md: "One way of restoring some of this lost detail is to use anisotropic filtering\
    \ (AF). Whereas standard mipmapping samples a texture image at a variety of square\
    \ resolutions (e.g., 256x256, 128x128, etc.), AF samples the textures at a number\
    \ of rectangular resolutions as well, such as 256x128, 64x128, and so on. This\
    \ enables viewing at various angles while retaining as much detail in the texture\
    \ as possible.\n\nAnisotropic filtering is more computationally expensive than\
    \ standard mipmapping and is not a required part of OpenGL. However, most graphics\
    \ cards support AF (this is referred to as an OpenGL extension), and OpenGL provides\
    \ both a way of querying the card to see if it supports AF, and a way of accessing\
    \ AF if it does. The code is added immediately after generating the mipmap:\n\n\
    ```\n// if mipmapping\nglBindTexture(GL_TEXTURE_2D, textureID);\nglTexParameteri(GL_TEXTURE_2D,\
    \ GL_TEXTURE_MIPMAP_FILTER, GL_LINEAR_MIPMAP_LINEAR);\nglMipmap(GL_TEXTURE_2D);\n\
    // if also anisotropic filtering\nif (glIsSupported(\"GL_EXT_texture_filter_anisotropic\"\
    )) {\n  float anisoSetting = 0.0f;\n  glGetFloat(GL_MAX_TEXTURE_ANISOTROPY_EXT,\
