  md: 'complicated by the fact that normal $(\hat{N})$ vectors are typically available
    to us only for the vertices that define the models, not for each pixel. Thus,
    we need to either compute normals for each pixel, which could be time-consuming,
    or find some way of estimating the values that we need to achieve a sufficient
