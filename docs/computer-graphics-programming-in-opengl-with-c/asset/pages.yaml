  md: 'path through space could be complex. However, if we can combine the transforms
    representing the two simple circular paths—the moon''s path around the Earth and
    the Earth''s path around the sun—we avoid having to explicitly compute the moon''s
    trajectory.


    It turns out that we can do this fairly easily with a matrix stack. A matrix stack,
    as its name implies, is a stack of transformation matrices. As we will see, matrix
    stacks make it easy to create and manage complex hierarchical objects and scenes,
    where transforms can be built upon (and removed from) other transforms.


    OpenGL has a built-in matrix stack, but as part of the older fixed-function (non-programmable)
    pipeline it has long been deprecated [OL16]. However, the C++ Standard Template
    Library (STL) has a class called “stack” that is relatively straightforward to
    adapt as a matrix stack, by using it to build a stack of mat4s. As we will see,
    of the view, model-view matrices that would normally be defined in a complex scene
    can be replaced by a single instance of stack<glm::mat4>.


    We first examine the basic commands for instantiating and utilizing a C++ stack,
    then use the C++ stack class in the following ways:


    +   - push() — makes a new entry on the top of the stack. We will typically use
    this command by pushing a copy of the matrix that is currently at the top of the
    stack, with the intent of concatenating additional transforms onto the copy.

    - pop() — removes (and returns) the top matrix.

    - top().top() returns a reference to the matrix at the top of the stack, without
    removing it.

    - <stack>.top() *= rotate(parameters to build a rotation matrix) apply transforms

    - <stack>.top() *= scale(parameters to build a scale matrix) directly to the top
    matrix in the stack

    - <stack>.top() = translate(parameters to build a translation)


    As shown in the previous list, the “*=” operator is overloaded in mat4 so that
    it can be used to concatenate matrices. Therefore, we will typically use it in
    one of the forms shown to add translations, rotations, and so on to the matrix
    at the top of the matrix stack.'
