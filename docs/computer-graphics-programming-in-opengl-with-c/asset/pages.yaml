    **Figure 11.2**

    Points at parametric position t = 0.75.


    By introducing a parameter **t**, we can build a system of parametric equations
    that define a curve. The **t** represents a fraction of the distance along the
    line segment connecting one control point to the next control point. Values for
    **t** points are within the range [0,1] for the segment. Figure 11.2 shows such
    a value, t = 0.75, applied to the lines connecting $p_0$-$p_1$ and $p_1$-$p_2$
    respectively. Doing this defines new points $p_a(t)$ and $p_b(t)$ along the two
    original lines. We repeat this for the line segment connecting the two new points
    $p_a(t)$ and $p_b(t)$, producing point $P(t)$ where t = 0.75 along the line $p_a(t)$p_b(t)$.
    $P(t)$ is one of the points on the resulting curve, and for this reason it is
    denoted with a capital P.


    ![](img/a15a9f662738db7597e865cb1a19c561_280_1.png)


    **Figure 11.3**

    Building a quadratic Bézier curve.


    Collecting many P(t) for various values of **t** generates a curve, as shown in
    Figure 11.3. The more parameter values P(t) are generated, and the smoother the
    resulting curve.


    The analytic definition for a quadratic Bézier curve can now be derived. We note
    that an arbitrary point **p** on the line segment $p_a$-$p_b$ connecting two points
    $p_a$ and $p_b$ can be represented in terms of the parameter **t** as follows:


    ```

    $P(t) = tp_a + (1-t)p_b$

    ```


    ```

    $p_{01}(t) = tp_1 + (1-t)p_0$

    $p_{12}(t) = tp_2 + (1-t)p_1$

    ```


    Similarly, a point on the connecting line segment between these two points would
    be:


    ```

    $P(t) = tp_{12}(t) + (1-t)p_{01}(t)$

    ```'
