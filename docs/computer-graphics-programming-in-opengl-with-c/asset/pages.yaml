  md: "# Chapter 14 · Other Techniques 323\n\nUnlike 2D textures, which can be built\
    \ from standard image files, 3D textures are usually generated procedurally. As\
    \ was done previously for 2D textures, we decide on a resolution—that is, the\
    \ number of textures in dimension. Depending on the colors in the texture, we\
    \ may build a three-dimensional array containing those colors. Alternatively,\
    \ if the texture holds a “pattern” that can be utilized with various colors, we\
    \ might instead build an array that holds the pattern, as with 0s and 1s.\n\n\
    For example, we can build a 3D texture that represents horizontal stripes by filling\
    \ an array with 0s and 1s corresponding to the desired stripe pattern. Suppose\
    \ the desired resolution of the texture is 200x200x200 texels, and the texture\
    \ is comprised of alternating stripes that are each 10 texels high. A simple function\
    \ that builds such a structure by filling an array with appropriate 0s and 1s\
    \ in a nested loop (assuming in this case that width, height, and depth variables\
    \ are each set to 200) be as follows:\n\n```\nvoid generate3Pattern() {\n  for\
    \ (int x=0; x<width; x++) {\n    for (int y=0; y<height; y++) {\n      for (int\
    \ z=0; z<depth; z++) {\n        if ((y/10) % 2 == 0)\n          tex3dPattern[x][y][z]\
    \ = 0.0;\n        else\n          tex3dPattern[x][y][z] = 1.0;\n      }\n    }\n\
    \  }\n}\n```\n\nThe pattern stored in the tex3dPattern array is illustrated in\
    \ Figure 14.8 with the 0s rendered in blue and the 1s rendered in yellow.\n\n\
    Texturing an object with the striped pattern shown in Figure 14.8 requires the\
    \ following steps:\n\n+   1. generating the pattern as already shown\n2. using\
    \ the pattern to fill a byte array of desired colors\n3. loading the byte array\
    \ into a texture object\n\n![](img/a15a9f662738db7597e865cb1a19c561_343_0.png)\n\
    \nFigure 14.8\nStriped 3D texture pattern."
