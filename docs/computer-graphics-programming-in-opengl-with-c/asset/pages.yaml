  md: 'Computer Graphics Programming in OpenGL with C++, 2/E


    Shadow acne can also be caused by differences in precision between the texture
    map and the depth computation. This too can lead to rounding errors and subsequent
    incorrect assessment of whether or not a pixel is in shadow.


    Fortunately, fixing acne is fairly easy. Since shadow acne typically occurs on
    surfaces that are not in shadow, a simple trick is to move every pixel slightly
    to the light during pass one, and then move them back to their normal positions
    for pass two. This is usually sufficient to compensate for either type of rounding
    error. An easy way is to call PolygonOffset() in the display() function, as shown
    in Figure 8.12 (highlighted).


    Adding these few lines of code to our display() function improves the output of
    our program considerably, as shown in Figure 8.13. Note also that with the artifacts,
    we can now see that the inner circle of the torus displays a small correctly cast
    shadow on itself.


    ```

    void display(GLFWwindow* window, double currentTime) {

    // clearing the depth and color buffers as before here

    //

    // setting matrices for camera and light points of view as before here

    glBindFramebuffer(GL_FRAMEBUFFER, shadowTex);

    glFramebufferTexture(GL_FRAMEBUFFER, GL_DEPTH_ATTACHMENT, shadowTex, 0);

    DrawBuffer(GL_NONE);

    Enable(GL_DEPTH_TEST);

    // for reducing shadow artifacts

    Enable(GL_POLYGON_OFFSET_FILL);

    PolygonOffset(2.0, 4.0);

    passOne();

    Disable(GL_POLYGON_OFFSET_FILL);

    glBindFramebuffer(GL_FRAMEBUFFER, 0);

    glActiveTexture(GL_TEXTURE0);

    glBindTexture(GL_TEXTURE_2D, shadowTex);

    DrawBuffer(GL_FRONT);

    passTwo();

    }

    ```


    Figure 8.12

    Combating shadow acne.'
