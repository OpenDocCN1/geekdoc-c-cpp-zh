    vector

    glBindBuffer(GL_ELEMENT_ARRAY_BUFFER, vbo[3]); // vbo #3 is the additional added
    vbo

    glBufferData(GL_ELEMENT_ARRAY_BUFFER, ind.size()*4,&ind[0],GL_STATIC_DRAW);

    ```


