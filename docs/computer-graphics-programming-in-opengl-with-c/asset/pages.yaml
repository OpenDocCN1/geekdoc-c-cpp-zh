  md: '# 14.3 USER-DEFINED CLIPPING PLANES


    OpenGL includes the capability to specify clipping planes beyond those defined
    by the view frustum. One use for a user-defined clipping plane is to slice a model.
    This makes possible to create complex shapes by a simple model and slicing sections
    off of it.


    A clipping plane is defined according to the standard mathematical definition
    of a plane:


    ```

    ax + by + cz + d = 0

    ```


    where a, b, c, and d are parameters defining a particular plane in 3D space with
    X, Y, and Z axes. The parameters represent a vector (a,b,c) normal to the plane,
    and a distance d from the origin to the plane. Such a plane can be specified in
    the vertex shader using a vec4, as follows:


    ```

    vec4 clip_plane = vec4(0.0, 0.0, -1.0, 0.2);

    ```


    This would correspond to the plane:


    ```

    (0.0) x + (0.0) y + (-1.0) z + 0.2 = 0

    ```


    The clipping can be achieved, also in the vertex shader, by using the built-in
    GLSL variable gl_ClippingDistance[], as in the following example:


    ```

    gl_ClippingDistance[] = dot(clip_plane.xyz, vertPos) + clip_plane.w;

    ```


    In this example, vertPos refers to the vertex position in the vertex shader as
    a attribute (such as from a VBO); clip_plane was defined above. We compute the
    signed distance from the clipping plane to the incoming vertex (shown in Chapter
    3), which is 0 if the vertex is on the plane, or negative or positive depending
    on which side of the plane the vertex lies. The script on the gl_ClipDistance
    array enables multiple clipping distances (i.e., multiple planes) to be defined.
    The maximum number of user clipping planes depends on the graphics card''s OpenGL
    implementation.


    User-defined clipping must then be enabled in the C++/OpenGL application. There
    are built-in OpenGL identifiers GL_CLIP_DISTANCE0, GL_CLIP_DISTANCE1, and so on,
    corresponding to each gl_ClipDistance[] array element. The 0th user-defined clipping
    plane can be enabled, as follows:


    ```

    glEnable(GL_CLIP_DISTANCE0);

    ```'
