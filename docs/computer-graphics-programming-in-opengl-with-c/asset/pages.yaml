    As previously mentioned, the code for Program 15.3 is is spread over three parts,
    starting with part one, which is listed above. So far, Program 15.3 doesn''t actually
    produce any rendered output different from that produced by Program 15.2. However,
    it reorganizes the camera in a way that will be useful as we proceed, because
    we have (1) created two custom framebuffers for holding reflection and refraction
    information, and (2) isolated sections of display() that prepare particular portions
    of the scene for rendering (skybox, floor, and surface), facilitating multiple
    renders.


    Now in two (of Program 15.3), we build the reflection and refraction textures.
    By repeating some of the actions in display(), but with different view matrices.
    The strategy is illustrated in Figure 15.3. The camera is above the water''s surface
    looking slightly downwards. Directly below the camera and under the surface is
    a second camera pointing upwards, which is dubbed the "reflection camera." It
    is used to render objects above the surface (such as the skybox) to build the
    reflection texture. It is positioned at a depth equal to the height of the camera
    above the water, which would be surfacePlaneHeight -Height. Our camera rotation
    implementation only includes the pitch (rotation around the X-axis), so for the
    reflection camera, we simply negate the pitch value.


    Since the purpose of the reflection camera is to generate a texture containing
    items reflecting off the surface, we only render those objects that are above
    the surface of the water when rendering from the point of view of the reflection
    camera. Therefore, in this example, we would render the skybox, but we wouldn''t
