    # 15.5 ANIMATING THE WATER MOVEMENT


    Animating the water’s surface can be done in a similar manner as was done for
    clouds by taking advantage of the third dimension in the noise map (as was unused).
    Recall from Section 14.8 the trick of replacing the texture lookup constant in
