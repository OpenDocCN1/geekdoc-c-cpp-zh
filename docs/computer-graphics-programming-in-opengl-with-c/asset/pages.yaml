    # A.2 DEVELOPING AND DEPLOYING OPENGL PROJECTS IN MS VISUAL STUDIO


    # A.2.1 Creating a Visual Studio Custom Project Template


    Because we are using many special-purpose libraries in our C++/OpenGL programs,
    creating a Visual Studio template will make it significantly easier to start new
    OpenGL projects. This section describes the steps for creating and using this
    template.


    Start Visual Studio (we will assume the 2019 version). Create a new, C++ project.
    At the top center, under the menu, there are two pull-down menus next to each
    other:


    +   - The one on the right allows you to specify "x86" or "x64"—choose "x64$.

    - The one on the left allows you to specify whether compilation is done in "debug"
    or "release" mode. Several steps need to be done for BOTH modes. That is, they
    should be done in "debug" mode, and then repeated in "release" mode.


    In "debug" mode (and afterward in "release" mode), go into "project properties"
    and make the following changes:


    After making the previous changes to the project properties, for both the "debug"
    and "release" modes, you are ready to create the template. This is done by going
    into the "Project" menu and selecting "Export template". Choose this is a "project"
    template, and give the template a useful name, such as "OpenGL project".'
