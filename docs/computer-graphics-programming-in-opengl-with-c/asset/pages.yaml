    OpenGL (Open Graphics Library) is a multi-platform 2D and 3D graphics API that
    incorporates hardware and software. Using OpenGL requires a graphics card (GPU)
    that supports a sufficiently up-to-date version of OpenGL (as described in Chapter
    1).


    On the hardware side, OpenGL provides a multi-stage graphics pipeline that is
    partially programmable using a language called GLSL (OpenGL Shading Language).


    On the software side, OpenGL’s API is written in C and C++. Stable language bindings
    (or “wrappers”) are available for more than a dozen popular languages (Java, Perl,
    Python, Visual Basic, Delphi, Haskell, Lisp, Ruby, etc.) with virtually equivalent
    performance. This textbook uses C++, the most popular language choice. When using
    C++, the programmer writes code that runs on the CPU (compiled, of course) and
    includes OpenGL calls. We will refer to a C++ program that contains OpenGL calls
    as a C++/OpenGL application. One important task of a C++/OpenGL application is
    to install the programmer’s GLSL code to the GPU.


    An overview of a C++-based graphics application is shown in Figure 2.1, with the
    software components highlighted in pink.'
