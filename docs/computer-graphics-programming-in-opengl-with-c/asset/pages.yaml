    Immediately following tessellation in the OpenGL pipeline is the geometry stage.
    Here, the programmer has the option of including a geometry shader. This stage
    actually pre-dates tessellation; it became part of the OpenGL core at version
    3.2 (2009).


    Like tessellation, geometry shaders enable the programmer to manipulate groups
    of vertices, in ways that are impossible to do in a vertex shader. In some cases,
    a task might be accomplished using either a tessellation shader or a geometry
    shader, as their capabilities overlap in some ways.


    # 13.1 PER-PRIMITIVE PROCESSING IN OPENGL


    The geometry shader stage is situated between tessellation and rasterization,
    within the segment of the pipeline devoted to primitive processing (refer back
    to Figure 2.2). Where vertex shaders enable the manipulation of one vertex at
    a time, and fragment shaders enable the manipulation of one fragment (essentially
    one pixel) at a time, geometry shaders enable manipulation of one primitive at
    a.


    Recall that primitives are the basic building blocks in OpenGL for drawing objects.
    Only a few types of primitives are available; we will focus primarily on geometry
    shaders that manipulate triangles. Thus, when we say that a geometry'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'shader can manipulate one primitive at a time, we usually mean that the shader
    has access to all three vertices of a triangle at a time. Geometry shaders allow
    you to:


    +   - access all vertices in a primitive at once,

    - output the same primitive unchanged, or

    - output the same primitive with modified vertex locations, or

    - output a different type of primitive, or

    - output additional primitives, or

    - delete the primitive (not output at all).


    Similar to the tessellation evaluation shader, incoming vertex attributes are
    accessible in a geometry shader as arrays. However, in a geometry shader, incoming
    attribute arrays are indexed only up to the primitive size. For example, if the
    primitives are triangles, then the available indices are 0, 1, and 2. Accessing
    the vertices themselves is done using the predefined array gl_in, as follows:


    ```

    gl_in[2].gl_Position // position of the 3rd vertex

    ```


    Also similar to the tessellation evaluation shader, the geometry shader''s output
    attributes are all scalars. That is, the output is a stream of individual vertices
    (their positions and other attribute variables, if any) that form primitives.


    There is a layout qualifier used to set the primitive input/output types and the
    output size.


    The special GLSL command EmitVertex() specifies that a vertex is to be output.

    The special GLSL command EndPrimitive() indicates the completion of building a
    particular primitive.


    We will explore four common categories of operations:


    +   - altering primitives

    - deleting primitives

    - adding primitives

    - changing primitive types'
