    # SUPPLEMENTAL NOTES


    Even the simple examples given in this chapter require significant computing resources,
    and the later ones (Programs 16.13, 16.14, and 16.15) run very slowly. On a standard
    laptop, the reader can expect them to take several seconds or minutes to render,
    especially for large depth of recursion settings. On some machines, the default
    settings for the graphics card may cause OpenGL to timeout, crashing the program
    before it has a chance to complete. On a Windows machine, the time limit is typically
    2 seconds, but can be increased by increasing the TdrDelay registry setting. Instructions
    for doing this are widely available on the Web [A19]. The author set the timeout
    to 8 seconds. An appropriate value depends on the machine and the application.
    Be warned that making this change can also make it bit more difficult to run a
    graphics process.


    We have tried to write our shader code for readability rather than performance;
    e.g., our heavy use of conditionals (“if” statements) can slow execution. Tricks
    for removing conditionals can be found elsewhere [H13].


    There are few rather obvious things that we have not implemented in our ray tracer.
    One is the ability to rotate the sphere. Of course, if the sphere is a solid'
