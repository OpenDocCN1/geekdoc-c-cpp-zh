  md: '# 4.2 UNIFORM VARIABLES


    Rendering a scene so that it appears 3D requires building appropriate transformation
    matrices, such as those described in Chapter 3, and applying them to each of the
    models'' vertices. It is most efficient to apply the required matrix operations
    in the vertex shader, and it is customary to send these matrices from the C++/OpenGL
    application to the shader in a uniform variable.


    Uniform variables are declared in a shader using the "uniform" keyword. The following
    example, which declares variables to hold model-view and projection matrices,
    will be suitable for our cube program:


    ```

    uniform mat4 mv_matrix;

    uniform mat4 proj_matrix;

    ```


    The keyword "mat4" indicates that these are 4x4 matrices. Here we have named the
    mv_matrix to hold the model-view matrix and the variable proj_matrix to hold the
    projection matrix. Since 3D transformations are 4x4, mat4 is a commonly used datatype
    in GLSL shaders uniforms.


    Sending data from a C++/OpenGL application to a uniform variable requires the
    following steps: (a) acquire a reference to the uniform variable and (b) associate
    a pointer to the desired values with the acquired uniform reference. Assuming
    that the linked rendering program is saved in a variable called "renderingProgram",
    the following lines of code would send model-view and projection matrices to the
    uniform mv_matrix and proj_matrix in our example:


    ```

    mvLoc = glUniformLocation(renderingProgram,"mv_matrix"); // get locations of uniforms

    projLoc = glUniformLocation(renderingProgram,"proj_matrix"); // in the shader
    program

    glUniformMatrix4fv(mvLoc, 1, GL_FALSE, glm::value_ptr(mvMat)); // send matrix
    data to the shader

    glUniformMatrix4fv(projLoc, 1, GL_FALSE, glm::value_ptr(pMat)); // // uniform
    variables

    ```


    The above example assumes that we have utilized the GLM utilities to build model-view
    and projection transforms mvMat and pMat, which will be discussed in greater detail
    shortly. They are of type mat4 (a GL class). The GLM function call value_ptr()
    returns a reference to the matrix data, which is needed by glUniformMatrix4fv()
    to transfer matrix values to the uniform variable.'
