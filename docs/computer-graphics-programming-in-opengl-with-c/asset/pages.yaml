  md: '# C++/OpenGL code


    Assuming we wish to build a cubic Bézier surface, we will need sixteen control
    points. We could send them from the C++ side in a VBO, or we could hardcode them
    in the vertex shader. Figure 12.4 shows an overview of the process with the control
    points coming from the C++ side.


    ![](img/a15a9f662738db7597e865cb1a19c561_298_0.png)


    Now is a good time to explain a bit more precisely the tessellation shader (TCS)
    works. Similar to the vertex shader, the TES executes once per vertex. Also, recall
    from Chapter 2 that OpenGL provides a built-variable gl_VertexID which holds a
    counter that indicates invocation of the vertex shader is currently


    Figure 12-4

    Overview of Bézier surfaces.


    executing. A similar built-in variable gl_InvocationID exists for the tessellation
    control shader.


    A powerful feature of tessellation is that the TCS (and also the TES) shader has
    access to all of the control point vertices simultaneously, in arrays. At first,
    it may seem confusing that the TES executes once per vertex, when each invocation
    has access to all of the vertices. It is also counterintuitive that the tess levels
    are specified in assignment statements which are redundantly set at each TCS invocation.
    Although all of this may seem odd, it is done this way because the tessellation
    architecture is designed so that TCS can run in parallel


    OpenGL provides several built-in variables for use in the TCS and TES shaders.
    Ones that we have already mentioned are gl_InvocationID and gl_TessLevelInner
    and gl_TessLevelOuter. Here are some more details and descriptions of the most
    useful built-in variables:


    Tessellation Control Shader (TCS) built-in variables:


    +   - gl_in[] — an array containing each of the incoming control point vertices—one
    array element per incoming vertex. Particular vertex attributes can be accessed
    as fields using the [][] notation. One built-in attribute is gl_Position—thus,
    the position of incoming vertex “i” is accessed as gl_in[i].gl_Position.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '+   gl_out[] – an array for sending outgoing control point vertices to the
    TES—one element per outgoing vertex. Particular vertex attributes can be accessed
    as fields using the “.\” notation. One built-in attribute is gl_Position—thus,
    the position of outgoing vertex “i” is accessed as gl_out[i].gl_Position.


    +   gl_InvocationID—an integer ID indicating invocation of the TCS is currently
    executing. One use is for passing through vertex attributes; for example, passing
    the current invocation’s vertex position from the TCS to the TES would be as follows:
    gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;


    Tessellation Evaluation Shader (TES) built-in variables:


    +   gl_in[] – an array containing each of the incoming control point vertices—one
    element per incoming vertex. Particular vertex attributes can be accessed as fields
    using the “.\” notation. One built-in attribute is gl_Position—thus, incoming
