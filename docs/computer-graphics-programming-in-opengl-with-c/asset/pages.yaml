  md: 'the outputs of the example programs, and since this is an introductory text,
    the resulting scenes are unlikely to impress an expert. However, the techniques
    presented today constitute the foundational elements for producing today''s stunning
    3D effects.


    We haven''t tried to create an OpenGL “reference.” Our coverage of OpenGL represents
    only tiny fraction of its capabilities. Our aim is to use OpenGL as a vehicle
    for teaching the fundamentals of modern shader-based 3D graphics programming and
    provide the reader with a sufficiently deep understanding for further study.


    #  What''s New in this Edition


    We have added three new chapters in this 2nd edition of Computer Graphics Programming
    in OpenGL using C++:


    +   - Chapter 15 – Simulating Water

    - Chapter 16 – Ray Tracing

    - Chapter 17 – Stereoscopy


    Ray tracing in particular has become “hot” recently, so we are especially excited
    that it is now included in our book. It is also a huge topic, even though our
    coverage is just a basic introduction, Chapter 16 is the longest chapter in the
    book. Chapter 16 also includes an introduction to compute shaders, which were
    introduced in OpenGL 4.3, and an introduction to additive and subtractive color
    blending, which expands on a topic that was introduced in Section 14.2.


    For years, our students have repeatedly expressed an interest in simulating water.
    However, water takes so many forms that writing an introductory section on the
    topic is challenging. Ultimately, we decided to present water in a way that would
    complete related topics in the book such as terrain, sky, etc., and so in Chapter
    15 we focus on utilizing our noise maps from Chapter 14 to generate water surfaces
    as are seen in lakes and oceans.


    The new chapter on stereoscopy is motivated by the increased popularity of virtual
    reality. However, it is also applicable to the development of animation for “3D
    movies”, and we have tried to provide introductory coverage of both uses equally.


    As a result of these additions, this 2nd edition is larger than the previous edition.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# xiv Preface


    Besides the new material, there are important revisions throughout the book. For
    example, we fixed bugs in our Torus class in Chapter 6 and made significant improvements
    to our noise map functions in Chapter 14. We expanded our Utils.cpp utility class
    to handle the loading of compute shaders. We also helped identify a bug in SOIL2
    (now fixed) that affected Macintosh users attempting to load cubemaps.


    There are dozens of small changes in every chapter that the reader might not notice:
    fixing typos, cleaning up code inconsistencies, updating the installation instructions,
    making slight wording changes, sprucing up figures, updating references, etc.
    Completely eliminating typos is virtually impossible in a book that covers an
    ever-changing technology-rich topic, but we really have tried hard.


    # Intended Audience


    This book is targeted at students of computer science. This could mean undergraduates
    pursuing a BS degree, but it could also mean anyone who studies computer science.
    As such, we are assuming that the reader has at least a solid background in object-oriented
    programming, at the level of someone who is, a computer science major at the junior
    or senior level.


    There are also specific things that we use in this book that we don''t cover,
    because we assume the reader already has sufficient background. In particular,
    these are:


    +   - C++ and its most commonly used libraries, such as the Standard Template
    Library;

    - familiarity with using an Integrated Development Environment (IDE), such as
    Visual Studio;

    - basic data structures and algorithms, such as linked lists, stacks, and queues,
    etc.

    - recursion;

    - event-driven programming concepts;

    - basic matrix algebra and trigonometry; and

    - awareness of color models, such as RGB, RGBA, etc.


    It is hoped that the potential audience for this new book is further bolstered
    by the existence of its "sister" textbook, Computer Graphics Programming in OpenGL
    with Java. In particular, we envision a learning environment where students are
    free to utilize either C++ or Java in the same classroom, selecting one or the
    other book. The two texts cover the material sufficiently in lockstep that we
    have been able to conduct a graphics programming course successfully in this manner.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# How to Use This Book


    This book is designed to be read from front to back. That is, material in later
    chapters frequently relies on information learned in earlier chapters. So, it
    probably won''t work to jump back and forth in the chapters; work your way forward
    through the material.


    This is also intended mostly as a practical, hands-on guide. While there is plenty
    of theoretical material included, the reader should treat this text as a sort
    of "workbook," in which you learn basic concepts by actually programming them.
    We have provided code for all of the examples, but to really learn the concepts
    you will want to "play" with these examples—extend them to build your own 3D scenes.


    At the end of each chapter are a few exercises to solve. Some are very simple,
    involving merely simple modifications to the provided code. The problems that
    are marked "(PROJECT),", however, are expected to take time to solve, and require
    writing a significant amount of code, or combining techniques from various examples.
    There are also a few marked "(RESEARCH)\”—those that encourage independent study
    by this textbook does not provide sufficient detail to solve them.


    OpenGL calls often involve lists of parameters. While writing this book, the authors
    debated whether or not to, in each case, describe all of the parameters. We decided
    that in the early chapters we would describe every detail. Further into the book,
    as we progress, we decided to avoid getting bogged down in every piece of minutiae
    in the OpenGL calls (and there are *many), for fear of the reader losing sight
    of the big picture. For this reason, it is essential when working through the
    examples to have easy access to reference material for OpenGL and the various
    libraries being used.


    For this, there are a number of excellent online resources that we recommend using
    in conjunction with this book. The documentation for OpenGL is absolutely essential;
    details on the various commands are available either by simply using Google to
    search for the command in question, or by visiting:


    ```

    https://www.khronos.org/registry/OpenGL-Refpages/gl4/

    ```


    Our examples utilize a mathematics library called GLM. After installing GLM (described
    in the appendices), the reader should locate the accompanying online documentation
    and bookmark it. At press time, the current link is:


    ```

    https://glm.g-truc.net/0.9.9/index.html

    ```'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'xvi Preface


    Another library used throughout the book for which the reader may wish to periodically
    consult its documentation is SOIL2, which is used for loading and processing texture
    image files. SOIL2, and the image loading stb on which it is based, doesn''t have
    a central documentation resource, but several examples are available via Google,
    and on their respective repositories:


    ```

    https://github.com/Spartan/soil2

    https://github.com/notings/stb

    ```


    There are many other books on 3D graphics programming that we recommend in parallel
    with this book (as for solving the “research” problems). Here are five that we
    often refer to:


    +   * (Sellers al.) OpenGL SuperBible [SW15]

    * (Kessenich et al.) OpenGL Programming Guide [KS16] (the “red book")

    * (Wolff) OpenGL 4 Shading Language Cookbook [WO18]

    * (Angel and Schreiner) Interactive Computer Graphics [AS14]

    * (Luna) Introduction to 3D Game Programming with DirectX 12 [LU16]


    # Companion Files


    This book is accompanied by a companion disc that contains the following items:


    +   * All of the C++/OpenGL programs and related class files and GLSL shader code
    presented in the book

    * The models and texture files used in the various programs and examples

    * The cubemap and skydome image files used to make the skies and horizons

    * Normal maps and height maps for lighting and surface detail effects

    * All of the figures in the book, as image files


    Readers who have purchased the electronic version of this book may obtain these
    files by contacting the publisher at info@merclearning.com.


