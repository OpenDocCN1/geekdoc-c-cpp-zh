    # 4.11 CODING FOR PERFORMANCE


    As the complexity of our 3D scenes grows, we will become increasingly concerned
    with performance. We have already seen a few instances where coding decisions
    were made in the interest of speed, such as we were using instantiation, and when
    we moved expensive computations to the shaders.


    Actually, the code we have presented has also included some optimizations that
    we haven''t yet discussed. We now explore these and other important techniques.


    # 4.11.1 Minimizing Dynamic Memory Allocation


    The critical section of our C++ code, with respect to performance, is clearly
    the display() function. This is the function that is called repeatedly during
    any animation or real-time rendering, and it is thus in this function (or in any
    function that it calls) where we must strive for maximum efficiency.'
