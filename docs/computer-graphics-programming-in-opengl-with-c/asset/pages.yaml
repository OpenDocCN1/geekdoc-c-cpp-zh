    While working at the Renault corporation in the 1950s and 1960s, Pierre Bézier
    developed software systems for designing automobile bodies. His programs utilized
    mathematical systems of equations developed by Paul de Casteljau, who was working
    for the Citroën automobile manufacturer [BE72, DC63]. The de Casteljau equations
    describe curves using just a few scalar parameters, and are accompanied by a clever
    recursive algorithm “de Casteljau’s algorithm” for generating the curves to arbitrary
    precision. Now known as “Bézier surfaces,” these methods are commonly used to
    efficiently model many kinds of curved 3D objects.


    # 11.1 QUADRATIC BÉZIER CURVES


    A quadratic Bézier curve is defined by a set of parametric equations that specify
    a particular curved shape using three control points, each of which is a point
    in 2D space.¹ Consider, for example, the set of three points [P₀ P₁, P₂] shown
    in Figure 11.1.


    ![](img/a15a9f662738db7597e865cb1a19c561_279_0.png)


    **Figure 11.1**

    Control points for a Bézier curve.


    > ¹ Of course, a curve can exist in 3D space. However, a quadratic curve lies
    entirely within a 2D plane.'
