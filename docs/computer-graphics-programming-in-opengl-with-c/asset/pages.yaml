  md: '# # Preface


    This book is designed primarily as a textbook for a typical computer science undergraduate
    course in OpenGL 3D graphics programming. However, we have also endeavored to
    create a text that could be used to teach oneself, without an accompanying course.
    With both of those aims in mind, we have tried to explain things as clearly and
    as simply as we can. All of the programming examples are stripped down and simplified
    as much as possible, but they are still complete so that the reader may run them
    all presented.


    One of the things that we hope is unique about this book is that we have strived
    to make it accessible to someone new to 3D graphics programming. While there is
    no lack of information available on the topic—quite the contrary—many students
    are initially overwhelmed. This text is our attempt to write the book we wish
    we had when we were starting out, with step-by-step explanations of the basics,
    progressing in an ordered manner through advanced techniques. We considered titling
    the book "shader programming easy"; however, we don''t think there really any
    way of making shader programming "easy.\ We hope that we have come close.


    This book teaches OpenGL programming in C++. There are several advantages to learning
    graphics programming in C++:


    +   - OpenGL''s native language is C, so a C++ program can make direct OpenGL
    function calls.


    +   - OpenGL applications written in C++ typically exhibit high performance.

    - C++ offers modern programming constructs (classes, polymorphism, etc.) not available
    in C.


    +   - C++ is a popular language choice for using OpenGL, and a large number of
    instructional resources for OpenGL are available in C++.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# xii Preface


    It is worth mentioning that there exist other language bindings for OpenGL. Popular
    alternatives exist for Java, C#, Python, and many others. This textbook focuses
    only on C++.


    Another thing that makes this book unique is that it has a “sister” textbook:
    Computer Graphics Programming in OpenGL with Java 2/E. The two books are organized
    in-step, with the same chapter and section numbers and topics, figures, exercises,
    and theoretical descriptions. Wherever possible, the code is organized similarly.
    Of course, the code of C++ versus Java leads to considerable programming differences
    (although all of the shader code is identical). Still, we believe that we have
    provided virtually identical learning paths, allowing a student to choose either
    option within a single classroom.


    An important point of clarification is that there exist different versions of
    OpenGL. For example, in addition to “standard OpenGL” (sometimes called “desktop
    OpenGL”), there exists a variant “OpenGL ES,” which is tailored for development
    of embedded systems (hence the ES). “Embedded systems” include devices as mobile
    phones, game consoles, automobiles, and industrial control systems. OpenGL ES
    is mostly a subset of standard OpenGL, eliminating a large number of operations
    that are typically not needed for embedded systems. OpenGL ES also adds some functionality,
    typically application-specific operations for particular target environments.
    This book focuses on standard OpenGL.


    Yet another variant of OpenGL is called “WebGL.” Based on OpenGL ES, WebGL is
    designed to support the use of OpenGL in web browsers. WebGL allows an application
    to invoke OpenGL ES operations, which makes it easy to embed OpenGL graphics into
    standard HTML (web) documents. Most modern web browsers support WebGL including
    Apple Safari, Google Chrome, Microsoft Edge, Internet Explorer, Mozilla Firefox,
    and Opera. Since web programming is outside the scope of this book, we will not
    cover any WebGL specifics. Note that because WebGL is based on OpenGL ES, which
    in turn is based on standard OpenGL, of what is covered in this book can be transferred
    directly to learning about these OpenGL variants.


    The very topic of 3D graphics lends to impressive, even beautiful images. Indeed,
    many popular textbooks on the topic are filled with breathtaking scenes, and it
    is enticing to leaf through their galleries. While we acknowledge the motivational
    utility of their examples, our aim is to teach, not to impress. The images in
    this book are simply


    +   1 JavaScript is a scripting language that can be used to embed code in webpages.
    It has strong similarities to Java, but also many important differences.'
  merge: -1
