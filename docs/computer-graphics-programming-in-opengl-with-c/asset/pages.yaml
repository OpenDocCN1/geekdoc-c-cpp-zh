    # 7.4 ADS LIGHTING COMPUTATIONS


    As we draw our scene, recall that each vertex is transformed so as to simulate
    a 3D world on a 2D screen. Pixel colors are the result of rasterization as well
    as texturing and interpolation. We must now incorporate the additional step of
    adjusting those rasterized pixel colors to effect the lighting and materials in
    our scene. The basic ADS computation that we need to perform is to determine the
    reflection intensity ($I$) for each pixel. This computation takes the following
    form:


    > $I_{observed} = I_{ambient} + I_{diffuse} + I_{specular}$


    That is, we need to compute and sum the ambient, diffuse, and specular contributions
    for each pixel, for each light source. This will course depend on the type of
    light(s) in our scene and the type of material associated with the rendered model.


    Ambient contribution is the simplest. It is the product of the specified ambient
    light and the specified ambient coefficient of the material:


    > $I_{ambient} = Light_{ambient} * Material_{ambient}$'
