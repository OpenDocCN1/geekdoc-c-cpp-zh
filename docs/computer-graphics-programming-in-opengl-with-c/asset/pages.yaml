  md: '# Chapter 16 · Ray Tracing and Compute Shaders ■ 391


    If you just want to learn about implementing ray tracing, and don''t care to learn
    about work groups, you may now bypass the next section and skip ahead to Section
    16.2.


    # 16.1.4 Work Group Details


    A complete description of work groups would start by stating that the glDispatchCompute()
    calls distribute the desired computations that are to be done in parallel to work
    groups, where a work group is a set of invocations that have a to share some local
    data. If, for a particular application, all of the invocations can be done completely
    independently of each other, which is the case in our matrix or ray tracing applications
    (i., without any needing to share any local data), the work group size may be
    set to 1, and in that case, the number of invocations is equal to the number of
    work groups.


    The set of all work groups is organized in an abstract 3D grid (if the programmer
    wishes, one or more of the dimensions may be set to 1, reducing the dimensionality
    of the grid of workgroups to 2D or 3D). Thus, the numbering scheme used to identify
    a particular work group is not a single integer, but a tuple of three values.
    Furthermore, the invocations within a work group (i.e., in those cases where the
    work group size is to be greater than one) are also organized in a 3D grid. Thus,
    the programmer must specify (1) the size and dimensionality of each work group
    (also organized as a grid). This gives the programmer a huge degree of flexibility
    in organizing a potentially large set of parallel computations. The entire set
    of invocations are then initiated in the C++/OpenGL applicions by calling


    ```

    glDispatchCompute(x,y,z)

    ```


    where the x, y, and z parameters specify the size and dimensionality of the abstract
    grid of the set of work groups. The number of compute shader invocations then
    executed within each work group (and the dimensionality in which they are organized)
    is specified in the compute shader with the GLSL command


    ```

    layout (local_size_x = X, local_size_y = Y, local_size_z = Z)

    ```


    where X, Y, and Z are the dimensions of each work group. The dimensions of the
    set of work groups, and the work groups themselves, need not be the same, and
    may be 1D, 2D, or 3D. The resulting compute shader invocations can then run in
    parallel on the GPU.'
