    # 3.6 LOCAL AND WORLD SPACE


    The common use for 3D graphics (with OpenGL or any other framework) is to simulate
    a three-dimensional world, place objects in, and then view that simulated world
    on a monitor. The objects placed in the 3D world are usually modeled as triangles.
    Later, in Chapter 6, we will dive into modeling. But we can start looking at the
    overall process now.


    When building a 3D model of an object, we generally orient the model in the most
    convenient manner for describing it. For example, when modeling a sphere, we might
    orient the sphere''s center at the origin (0,0,0) and give it a convenient radius,
    such as 1. The space in which a model is defined called its local space, or model
    space. OpenGL documentation uses the term object space.


