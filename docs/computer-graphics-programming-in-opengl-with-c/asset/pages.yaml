    # 1.1.6 Texture Management


    Starting with Chapter 5, we will use image files to add “texture” to the objects
    in our graphics scenes. This means we will frequently need to load such image
    files into our C++/OpenGL code. It is possible to code a texture image loader
    from scratch; however, given the wide variety of image formats, it is preferable
    to use a texture loading library. Some examples are FreeImage, DevIL, OpenGL Image
    (GLI), and Glad. Probably the most commonly used OpenGL image library is Simple
    OpenGL Loader (SOIL), although it has become outdated.


    The image loading library used in this book is SOIL2, an updated fork of SOIL.
    Like the previous libraries we have chosen, SOIL2 is compatible with a wide variety
    of platforms [SO20], and detailed installation and configuration instructions
    are given in the appendices.


    # 1.1.7 Optional Libraries


    There are many other helpful libraries that the reader may wish to utilize. For
    example, in this book we show how to implement a simple “OBJ” model loader from
    scratch. However, as we will see, it doesn’t handle many of the options available
    in the OBJ standard. Some examples of more sophisticated OBJ importers are Assimp
    and tinyobjloader. For our examples, we will just use our simple loader described
