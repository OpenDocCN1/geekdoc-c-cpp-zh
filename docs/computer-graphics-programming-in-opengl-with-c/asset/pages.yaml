    # 8.7 SOFT SHADOWS


    The methods presented are far limited to producing hard shadows. These are shadows
    with sharp edges. However, most shadows that occur in the real world are soft
    shadows. That is, their edges are blurred to various degrees. In this section,
    we will explore the appearance of soft shadows as they occur in the real world
    and then describe a commonly used algorithm for simulating them in OpenGL.


    # 8.7.1 Soft Shadows in the Real World


    There are many causes of soft shadows, and there are many types of soft shadows.
    One thing that commonly causes soft shadows in nature is that real-world light
    sources are rarely points—often they occupy some area. Another cause is the accumulation
    of imperfections in materials and surfaces, and the role that the objects themselves
    play in generating ambient light through their own reflective properties.


    ![](img/a15a9f662738db7597e865cb1a19c561_228_1.png)


    Figure 8.16 shows a photograph of an object casting a soft shadow on a table top.
    Note that this is not a 3D


