- img_proc: true
  md: 'Before we describe the code in our simple OBJ importer, we must warn the reader
    of its limitations:


    +   - It only supports models that include all three face attribute fields. That
    is, vertex positions, texture coordinates, and normals must all be present and
    in the form: f ### ### ###.


    +   - The material tag, often used to specify a texture file, is ignored—texturing
    be done using the methods described in Chapter 5.


    +   - Only OBJ models composed of a single triangle mesh are supported (the OBJ
    format supports models comprised of multiple meshes, but our simple importer does
    not).


    +   - It assumes that elements on each line are separated by exactly one space.


    If you have an OBJ model that doesn''t satisfy all of the criteria, and you wish
    to import it using the simple loader in Program 6.3, it may still be feasible
    to do so. It is often possible to load a model into Blender, and export it to
    another OBJ file that accommodates the loader''s limitations. For instance, if
    the model doesn''t include normal vectors, it is possible to have Blender produce
    normal vectors while it exports the OBJ file.


    Another limitation of our OBJ loader has to indexing. Observe in the previous
    descriptions that the "face" tag allows for the possibility of mix-and vertex
    positions, texture coordinates, and normal vectors. For example, two different
    "face" may include indices which point to the same v entry, by different vt entries.
    Unfortunately, OpenGL''s indexing mechanism does not support this level of freedom—indices
    in OpenGL can only point to a particular along with its attributes. This complicates
    writing an OBJ model loader somewhat, we cannot simply copy the references in
    the triangle face entries into an index array. Rather, using OpenGL indexing would
    require ensuring that entire combinations of v, vt, and vn for a face each have
    their own references in the index array. A simpler, albeit less efficient, alternative
    is to create a new vertex for every triangle face entry. We opt for this simpler
    approach here in the interest of clarity, despite the space-saving advantage of
    using OpenGL indexing (especially when loading larger models).


    The ModelImporter class includes a parseOBJ() function that reads in each line
    of an OBJ file one by one, handling separately the four cases v, vt, vn, and f.
    In each case, the subsequent numbers on the line are extracted, first by using
    erase()'
