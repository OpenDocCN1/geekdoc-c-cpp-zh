    Although Phong shading offers better realism than Gouraud shading, it does so
    without incurring a performance cost. One optimization to Phong shading was proposed
    by James Blinn in 1977 [BL77], and is referred to as the Blinn-Phong reflection
    model. It is based on the observation that one of the most expensive computations
    in Phong shading is determining the reflection vector R.


    Blinn observed that the vector R itself is not needed—R is only produced as a
    means of determining the angle φ. It turns out that φ can be found without outcomputing
    R, by computing a vector H that is halfway between L and V. As shown in Figure
    7.13, the angle α between H and N is usually close to ½φ). Although α isn''t identical
    to φ, Blinn showed that good results can be obtained by using α instead of φ.


    ![](img/a15a9f662738db7597e865cb1a19c561_200_0.png)


    Figure 7.13

    Blinn-Phong reflection.


    The “halfway” vector H is most easily determined by finding L+V (see Figure 7.14),
    after which cos(α) can be found using the dot product H·N.'
