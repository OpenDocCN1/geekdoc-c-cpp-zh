  md: '# 4.1 BUFFERS AND VERTEX ATTRIBUTES


    For an object to be drawn, its vertices must be sent to the vertex shader. Vertices
    are usually sent by putting them in a buffer on the C++ side and associating that
    buffer with a vertex attribute declared in the shader. There are several steps
    to accomplish this, some of which only need to be done once, and some of which—if
    the scene is animated—must be done at every frame:


    Done once—typically in init():


    +   1. create a buffer

    2. copy the vertices into the buffer


    Done at each frame—typically in display():


    +   1. enable the buffer containing the vertices

    2. associate the buffer with a vertex attribute

    3. enable the vertex attribute

    4. use glDrawArrays(..) to draw the object


    Buffers are typically created all at the start of the program, either in init()
    or in a function called init(). In OpenGL, a buffer is a Vertex Buffer Object,
    or VBO, which is declared and instantiated in the C++/OpenGL application. A scene
    may require many VBOs, so it is custom to generate and then fill several of them
    in init() so they are available whenever your program needs to draw one or more
    of them.


    ![](img/a15a9f662738db7597e865cb1a19c561_82_0.png)


    A buffer interacts with a vertex attribute in a specific way. When glDrawArrays(..)
    is executed, the data in the buffer starts flowing, sequentially from the beginning
    of the buffer, through the vertex shader. As described in Chapter 2, the vertex
    in 3D space requires three values, so an appropriate vertex attribute in the shader
    to receive these three values would be of vec3. Then, for each three values in
    the buffer, the shader is invoked, as illustrated in Figure 4.1.'
