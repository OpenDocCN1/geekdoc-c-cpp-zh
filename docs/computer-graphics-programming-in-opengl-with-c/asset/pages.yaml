  md: "# Chapter 15 · Simulating Water 355\n\nFragment Shader (for plane segment)\n\
    \n```\n// Similar to previous fragment shaders, except that a checkerboard texture\
    \ has been added.\n// Incoming texture coordinates are scaled up here to facilitate\
    \ repeating texture.\n#version 430\n```\n\n```\nin vec2 tc;\nout vec4 color;\n\
    uniform mat4 mv_matrix;\nuniform mat4 proj_matrix;\n```\n\n```\nvec3 checkerboard(vec2\
    \ tc) {\n  float tileScale = 64.0;\n  float tile = mod(floor(tc.x * tileScale)\
    \ + floor(tc.y * tileScale), 2.0);\n  return tile * vec3(1,1,1);\n}\n```\n\n```\n\
    void main(void) {\n  color = vec4(checkerboard(tc), 1.0);\n}\n```\n\nThe C++/OpenGL\
    \ application specifies that the plane is at a height of 0.0, meaning it is level\
    \ with the XZ plane. The camera is 2.0 units above the plane, and pitched -15°\
    \ looking downwards towards the plane. Specifying the plane requires 18 floating\
    \ point values (2 triangles x 3 vertices/triangle x 3 coordinates/vertex). Computing\
    \ its procedural “checkerboard” pattern is accomplished in a similar manner as\
    \ for the 3D example shown in Section 14.4. The desired number of squares is specified\
    \ in the variable tileScale, and the pattern is produced by scaling the texture\
    \ coordinates up by tileScale and taking that modulo 2. The result of 0 or 1 is\
    \ returned as either color (0,0,0) or (1,1,1) – i.e., black or white – respectively.\n\
