  md: '# Chapter 4 Managing 3D Graphics Data


    A related structure in OpenGL is called a Vertex Array Object, or VAO. VAOs were
    introduced in version 3.0 of OpenGL and are provided as a way of organizing buffers
    and making them easier to manipulate in complex scenes. OpenGL requires that at
    least one VAO be created, and for our purposes one will be sufficient.


    For example, suppose we wish to display two objects. In the C++ side, we could
    do this by declaring a single VAO and an associated set of two VBOs (one per object),
    as follows:


    ```

    Glint vao[1]; // OpenGL requires these values to be specified in arrays

    Glint vbo[2];


    glGenVertexArrays(1, vao);

    glBindVertexArray(vao[0]);

    GenBuffers(2, vbo);

    ```


    The two OpenGL commands glGenVertexArrays and glGenBuffers() create VAOs and VBOs
    respectively, and produce integer IDs for them that are stored in the arrays and
    vbo. The two parameters on each refer to how many IDs are created, and an array
    to hold the returned IDs. The purpose of glBindVertexArrays() is to make the specified
    VAO "active" so that the generated buffers'' will be associated with that VAO.


    A buffer needs to have a corresponding vertex attribute declared in the vertex
    shader. Vertex attributes are generally the first variables declared in a shader.
    In our cube example, a vertex attribute to receive the vertices could be declared
    in the vertex shader as:


    ```

    layout (location = 0) in vec3 position;

    ```


    The key word in "input" indicates that this vertex attribute will be receiving
    values from a buffer (as we will see later, vertex attributes can also be used
    for "output"). As seen before, the "vec3" means that invocation of the shader
    will draw three float values (presumably x, y, z, comprising a single variable).
    The variable name is "position". The "layout(location=0)" portion of the command
    is called a layout qualifier and how we associate the vertex attribute with a
    particular buffer. Thus this vertex attribute has an identifier 0 that we will
    use for this purpose.


    +   Throughout this example, two buffers are declared, to emphasize that usually
    we will use several buffers. Later we will use the additional buffer(s) to store
    other information associated with the vertex, such as color. In the current case
    we are using only one of the declared buffers, it would have been sufficient to
    declare just one VBO.'
