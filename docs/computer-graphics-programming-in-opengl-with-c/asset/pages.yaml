    Add►Existing Item to load your main.cpp file. Repeat the process for .cpp files.

    9. Also in the solution explorer on the right, right click on “Header Files” and
    choose Add►Existing Item to load any header (.h) files in your application.


    +   10. You are now ready to build and execute your program.


