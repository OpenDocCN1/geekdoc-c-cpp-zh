    # SUPPLEMENTAL NOTES


    One of the fundamental limitations of bump or normal mapping is that, while they
    are capable of providing the appearance of surface detail in the interior of a
    rendered object, the silhouette (outer boundary) doesn''t show any detail (it
    remains smooth). Height mapping, if used to actually modify vertices, fixes this
    deficiency, but has its own limitations. As we will see later in this book, sometimes
    a geometry or tessellation shader can be used to increase the number of vertices,
    making height mapping more practical and effective.


    We have taken the liberty of simplifying some of the bump and normal mapping computations.
    More accurate and/or more efficient solutions are available for critical applications
    [BN12].


