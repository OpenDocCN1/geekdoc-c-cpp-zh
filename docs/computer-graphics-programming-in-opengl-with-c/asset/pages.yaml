    Computing the intersection(s) of a ray with a box is similarly well-documented
    and using geometry, the most common approach has been derived by Kay and Kajiya
    [KK86]. Again we describe only the solution, as adapted for GPU vector operations
    [H89]. And as for the sphere, a ray will intersect it at 0, 1, or 2 points.


    Program 16.2 assumes the box is aligned with the world axes (we handle other orientations
    later). We define the box using two points at diagonally-opposite corners; i.e.,
    (xmin, ymin, zmin) and (xmax, ymax, zmax). In Program 16.2, those two points are
    box_mins and box_maxs at (-2, 0, 0) and (-0.5, 1, 2), respectively. These two
    points are then used to identify the six X/Y/Z planes that comprise the box. For
    example, the two “X-planes” are specified as the X values for the two boxes parallel
    to the Y plane. Finding the distance at which the ray intersects each of the six
    planes can be done efficiently with GLSL vec3 operations (see [S11] for a derivation):


    ```

    tmins = (box_mins - r_o)/r_d

    tmax = (box_maxs - r_o)/r_d

    ```


    The resulting tmins and tmax contain minimum and maximum distances to planes defined
    by the X, Y, and Z-aligned boxes. The smaller and larger of each of those can
    be found efficiently as:


    ```

    tminDist = min(tmins, tmax)

    tmaxDist = max(tmins, tmax)

