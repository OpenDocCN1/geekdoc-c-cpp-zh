  md: 'Substituting the definitions of $p_{12}$ and $p_{01}$ gives:


    $P(t) = t[p_2 + (1-t)p_1] + (1-t)[p_1 + (1-t)p_0]$


    Factoring and combining terms gives:


    $P(t) = (1-t)^2 p_0 + (-2t^2 + 2t)p_1 + t^2 p_2$


    or,


    $P(t) = \sum_{i=0}^2 p_i B_i(t)$


    where:


    $B_0(t) = (1-t)^2\nB_1(t) = -2t^2 + 2t\nB_2(t) = t^2$


    Thus, we find any point on the curve by a weighted sum of the control points.
    The weighting function $B$ is often called a "blending function" (the name "$B$
    actually derives from Sergei Bernstein [BE20], who first characterized this family
    of polynomials). Note that the blending functions are all quadratic in form, which
    is the resulting curve is called a quadratic Bézier curve.


    # 11.2 CUBIC BÉZIER CURVES


