  md: "# Computer Graphics Programming in OpenGL with C++, 2/E\n\n```\n// calculate\
    \ tangent vector\nif ((x==0) && (y==1) && (z==0)) || ((x==0) && (y==-1) && (z==0))\
    \ // if north or south pole,\n    tangent[i*(prec+1)] = glm::vec3(0.0f, 0.0f,\
    \ -1.0f); // set tangent to -Z axis\nelse // otherwise, calculate tangent\n  \
    \  tangent[i*(prec+1)] = glm::cross(glm::vec3(0.0f, 1.0f, 0.0f), glm::vec3(x,y,z));\n\
    \n... // remaining computations are unchanged\n```\n\nFor models that do not lend\
    \ themselves to analytic derivation of surface tangents, the tangents can be approximated,\
    \ by drawing vectors from each vertex to the next they are constructed ( loaded).\
    \ Note that such an approximation can lead to tangent vectors that are not strictly\
    \ perpendicular to the corresponding vectors. Implementing normal mapping that\
    \ works across a variety of models needs to take this possibility into account\
    \ (our solution).\n\nThe tangent vectors are sent from a buffer (VBO) to a vertex\
    \ attribute in the vertex shader, as is done for vertices, texture coordinates,\
    \ and normals. The vertex shader then processes them the same as is for normal\
    \ vectors, by applying the inverse-transpose of the MV matrix and forwarding the\
    \ result down the pipeline for interpolation by the rasterizer and ultimately\
    \ into the fragment shader. The application of the inverse transpose converts\
    \ the normal and tangent vectors into camera space, after which we construct the\
    \ bitangent using the cross product.\n\nOnce we have the normal, tangent, and\
    \ bitangent vectors in camera space, we can use them to construct a matrix (called\
    \ the \"TBN\" matrix, after its components) which transforms the normals retrieved\
    \ from the normal map into their corresponding orientation in camera space relative\
    \ to the surface of the object.\n\nIn the fragment shader, the computing of the\
    \ new normal is done in the calcNewNormal() function. The computation in the third\
    \ line of the function (the one containing dot(tangent, normal)) ensures that\
    \ the tangent vector is perpendicular to the normal vector. A cross product between\
    \ the new tangent and the normal produces the bitangent.\n\nWe create the TBN\
    \ as a 3x3 mat3 matrix. The mat3 constructor takes three vectors and generates\
    \ a matrix containing the first vector in the top row, the second vector in the\
    \ middle row, and the third in the bottom row (similar to building a view matrix\
    \ from a camera position—see Figure 3.13)."
