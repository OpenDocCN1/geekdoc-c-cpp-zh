  md: 'on an appropriate interocular distance (IOD), which is the distance between
    the pupils of our two eyes. While it is a simple matter to measure this distance,
    say in millimeters or inches, the relationship between real-world distance measure
    (e.g., millimeters) and the units used in our rendered scene (i.e., the meaning
    of "1", "2", etc. along our X, Y, and Z axes) is entirely application-dependent.
    A commercial application, such as a videogame or movie, needs to ensure that the
    human''s IOD (around 65 mm), and may even need to provide for the user to adjust
    for his/her own IOD. In our application, we define a variable called IOD and simply
    decide by trial and error on a value that produces decent results.


    We determine the location of each eye as the location of the camera offset by
    half of the interocular distance. The offset computation includes any rotation
    applied to the camera. In the examples in this chapter, the camera is fixed at
    location (cameraX, cameraY, cameraZ) and faces the negative Z axis. Therefore,
    in those cases, ignoring rotation, the eye locations are simply (cameraX ± IOD/2.0,
    cameraY, cameraZ), and the remainder of the computations for computing each eye''s
    view matrix remains unchanged.


    Deriving accurate projection matrices is complex [N10], although implementing
    them is fairly simple. While it is possible to get decent results using the standard
    perspective matrix used for the camera, this can lead to undesirable effects at
    the periphery, nearly distant regions that only one eye can see. Figure 17.3 shows
    frustums applied to both eyes, the first using standard perspective transforms,
    and with slightly modified perspective transforms that allow both eyes the same
    distance view while still facing forward. The second approach produces better
    results, but requires the creation of perspective matrices for asymmetric frustums.
    GLM provides a function called glm::frustum() that builds such a matrix given
    the top, left, and right boundaries of the projection plane. Derivations for such
    matrices can be found elsewhere [S16].


