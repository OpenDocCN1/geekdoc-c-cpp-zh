    # 8.7.2 Generating Soft Shadows – Percentage Filtering (PCF)


    There are various ways of simulating the penumbra effect to generate soft shadows
    in software. One of the simplest and most common is called Percentage Filtering
    (PCF). In PCF (proposed in 1987 by Reeves et al. [RS87]), we sample the texture
    at surrounding locations to estimate what percentage of nearby locations are in
    shadow. Depending on how many of the nearby locations are in shadow, we increase
    or decrease the degree of lighting contribution for the pixel being rendered.
    The entire computation can be done in the fragment shader, and that is the place
    where we have to change any of the code. PCF can also be used to reduce jagged
    artifacts.


    Before we study the actual PCF algorithm, let’s look at a simple motivating example
    to illustrate the goal of PCF. Consider the set of output fragments (pixels) shown
    in Figure 8.18, whose colors are computed by the fragment shader.


