  md: '# Computer Graphics Programming in OpenGL with C++, 2/E


    +   - GL_LINEAR_MIPMAP_NEAREST

    chooses the mipmap with the resolution most similar to that of the region of pixels
    being textured. It then interpolates the four texels nearest to the texture coordinates.
    This is called “linear filtering.”


    +   - GL_LINEAR_MIPMAP_LINEAR

    chooses the two mipmaps with resolutions nearest to that of the region of pixels
    being textured. It then obtains the nearest texel to the texture coordinates from
    each mipmap and interpolates them. This is called “bilinear filtering.”


    +   - GL_LINEAR_MIPMAP_LINEAR

