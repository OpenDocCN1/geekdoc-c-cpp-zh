  md: 'Computer Graphics Programming in OpenGL with C++, 2/E


    # 1.1.4 Extension Library


    OpenGL is organized around a set of base functions and an extension mechanism
    to support new functionality as technologies advance. Modern versions of OpenGL,
    such as those found in version 4+ as we use in this book, require identifying
    the extensions available on the GPU. There are commands built into core OpenGL
    for doing this, but they involve several convoluted lines of code that need to
    be performed for each modern command used—and in this book we use such commands
    constantly. Therefore, it has become standard practice to use an extension library
    to take care of these details, and to make modern OpenGL commands available to
    the programmer directly. Examples are Glee, GLEoader, GLEW, and most recently
    GL3W and GLAD.


    A commonly used library among others is GLEW, which stands for OpenGL Extension
    Wrangler. It is available for a variety of operating systems including Windows,
    Macintosh, and Linux [Ge20]. GLEW is not a perfect choice; for example it requires
    an additional DL. Recently, many developers are choosing GL3W and GLAD. They have
    the advantage of being automatically updated, but they also require that Python
    be installed. For these reasons, in this book we have opted to use GLEW. It can
    be downloaded at glew.sourceforge.net. Complete instructions for installing and
    configuring GLEW are given in the appendices.


