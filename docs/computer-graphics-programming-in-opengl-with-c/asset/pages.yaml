    $t = (-r_s \cdot n_p)/(r_d \cdot n_p)$


    The intersect point is then, as before,


    $collision\point = r_s + t * r_d$


    Given the plane''s width w (i.e., on the x-axis) and depth $d$ (i.e., on the z-axis),
    the ray misses the plane segment when


    $|collisionPoint_x| > \frac{w}{2}$ or $|collisionPoint_z| > \frac{d}{2}$


    These can be generated to planes at an arbitrary location and rotation using the
    non-aligned methods described previously in Section 16.2.8. Similarly, the surface
    normal at the collision point, which so far has been as (0,1,0), may be rotated
    if the plane is not aligned with the XZ-axes. Texture coordinates are just the
    $collisionPoint$ x and z coordinates, normalized to the range [0,1].


    Computing the procedural checkerboard pattern of white and black colors can be
    done by scaling the texture coordinates by the desired number of squares in the
    checkerboard, and then taking result modulo 2. The result of 0 or 1 is returned
