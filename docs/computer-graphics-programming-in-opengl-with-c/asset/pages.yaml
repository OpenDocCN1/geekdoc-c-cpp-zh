  md: 'Chapter 12 · Tessellation 277


    Next let''s look at the Tessellation Evaluation Shader. It starts with a line
    of code that says:


    ```

    layout (quads, equal_spacing, ccw) in;

    ```


    This may at first appear to be related to the “out” layout statement in the control
    shader, but actually they are unrelated. Rather, this is where we instruct the
    tessellator to generate vertices so they are arranged in a large rectangle (a
    “quad”). It also specifies the subdivisions (inner and outer) to be of equal length
    (later we will see a use for subdivisions of unequal length). The “ccw” parameter
    specifies the winding order in which the tessellated grid vertices are generated
    (in this case, counter-clockwise).


    The vertices generated by the tessellator are then sent to the evaluation shader.
    Thus, the evaluation shader may receive vertices both from the control shader
    (typically as control points) and from the tessellator (the tessellated grid).
    In 12.1, vertices are only received from the tessellator.


    The evaluation shader executes once for each vertex produced by the tessellator.
    The vertex location is accessible using the built-in variable gl_TessCoord. The
    tessellated grid is oriented such that it lies in the X-Z plane, and therefore
    gl_TessCoord’s X and Y components are applied to the grid’s X and Z coordinates.
    The grid coordinates, and the values of gl_TessCoord, range from 0.0 to 1.0 (this
    will be handled later when computing texture coordinates). The evaluation shader
    uses the mvp matrix to orient each vertex (this was done in the vertex shader
    in examples from earlier chapters).


    Finally, the fragment shader simply outputs a constant color yellow for each pixel.
    We can, of course, also use it to apply a texture or lighting to our scene as
    we saw in previous chapters.


    # 12.2 TESSELLATION FOR BÉZIER SURFACES


    Let’s extend our program so that it turns our simple rectangular grid into a Bézier
    surface. The tessellated grid should give us plenty of vertices for sampling the
    surface (and we can increase the inner/outer subdivision levels if we need more).
    What we need is to send control points through the pipeline, and then use those
    control points to perform the computations to convert the tessellated grid into
    the desired Bézier surface.'
