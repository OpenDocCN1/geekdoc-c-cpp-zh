    ![](img/a15a9f662738db7597e865cb1a19c561_167_0.png)


    **Figure 6.14**

    ramid built in Blender.


    In Blender, if we export our pyramid model, specify the .obj format, and also
    set Blender to output texture coordinates and vertex normals, an OBJ file is created
    that includes all of this information. The resulting OBJ file is shown in Figure
    6.15. (The actual values of the texture coordinates can vary depending on how
    the model is built).


    We have color-coded the important sections of the OBJ file for reference. The
    lines at the top beginning with “#” are comments placed by Blender, which our
    importer ignores. This is followed by a line beginning with “o” giving the name
    of the object. Our importer can ignore this line as well. There, is a line beginning
    with “s” that specifies that the faces shouldn''t be smoothed. Our code will also
    ignore lines starting with “s”.


    The first substantive set of lines in the OBJ file are those starting with “v”,
    colored blue. They specify the X, Y, and Z spatial coordinates of the vertices
    of our pyramid model relative to the origin, which in this case is at the center
    of the pyramid.'
