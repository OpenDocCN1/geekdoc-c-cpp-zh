  md: '# 5.12 TEXTURES – ADDITIONAL OPENGL DETAILS


    The SOIL2 texture image loading library that we are using throughout this book
    has the advantage that it is relatively easy and intuitive to use. However, when
    learning OpenGL, SOIL2 has the unintended consequence of shielding the user from
    some important OpenGL details that are useful to learn. In this section, we describe
    some of those details a programmer would need to know in order to load and use
    textures in the absence of a texture loading library such as SOIL2.


    It is possible to load texture image data into OpenGL directly, using C++ and
    OpenGL functions. While it is a bit more complicated, it is commonly known. The
    general steps are:


    +   1. Read the image file using C++ tools.

    2. Generate an OpenGL texture object.

    3. Copy the image data into the texture object.


    We won''t describe the first step in detail—there are numerous methods. One approach
    is described at opengl-tutorials.org (the specific tutorial page is [OT18]), and
    we use C++ functions fopen() and fread() to read data from a .bmp file into an
    array of unsigned char.


    Steps 2 and 3 are more generic and involve mostly OpenGL. In step 2, we create
    one or more texture objects using the OpenGL glGenTextures() command. For example,
    generating a single OpenGL texture object (with an integer reference ID) can be
    as follows:


    ```

    GLuint textureID;// or an array of GLuint if making more than one texture object

    glGenTextures(1, &textureID);

    ```


    In step 3, we associate the image data from step 1 into the texture object created
    in step 2. This is done using the OpenGL glTexImage2D() command. The following
    example loads the image data from the unsigned char array described in step 1
    (and denoted here as “data”) into the texture object created in step 2:


    ```

    glBindTexture(GL_TEXTURE_2D, textureID)

    glTexImage2D(GL_TEXTURE_2D, 0, GL_RGB, width, height, 0, GL_RGB, GL_UNSIGNED_BYTE,
    data);

    ```


    At this point, the various glTexParameteri() calls described earlier in this chapter
    for setting up mipmaps and so forth can be applied to the texture object. We also'
