    the ratio width/height of the near and far clipping planes. The shape formed by
    these elements and shown in Figure 3.15 is called a frustum.


    ![](img/a15a9f662738db7597e865cb1a19c561_72_1.png)


    Figure 3.15 Perspective view volume or frustum.'
