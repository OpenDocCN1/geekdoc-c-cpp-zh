    In this chapter, we explore a variety of techniques utilizing the tools we have
    learned throughout the book. Some we will develop fully, for others we will offer
    a more cursory description. Graphics programming is a huge field, and this chapter
    is by means comprehensive, but rather an introduction to just a few of the creative
    effects that have been developed over the years.


    # 14.1 FOG


    When people think of fog, they think of early misty mornings with low visibility.
    In truth, atmospheric haze (such as fog) is more common than most of us. The majority
    of the time, there is some degree of haze in the air, and although we have become
    accustomed to seeing it, we don''t usually realize it is there. So we can enhance
    the realism in our outdoor scenes by introducing fog—even if only a small amount.


    Fog can also enhance the sense of depth. When close objects have better clarity
    than distant objects, it is one more visual cue that our brains can use to decipher
    the topography of a 3D scene.'
