  md: 'portion. This is called a subtractive color effect, and is how colors blend
    when, for example, mixing paint or ink.


    However, suppose that these panes were actually emitting colors, rather than filtering
    them – as if a yellow light source was combined (added) to a blue light source.
    In that case, the yellow and blue panes would not combine to form green. Thus,
    depending on what we wish to model, we need to blend colors in different ways.


    So far, all of our colors have been expressed using the RGB color model. RGB is
    an example of an additive color model, and it is designed for blending light sources
    – most specifically the red, green, and blue elements of an RGB computer monitor
    – by adding them together. That is, it is designed not to “mix” its colors like
    paint, but ideally to add them. When mixing paint, we expect each successive combined
    color to darken the mix (because each successive color subtracts some portion
    of the light). However, in an additive model that blends light sources, each successive
    color brightens the mix, moving it closer to white light.


    Another thing about the RGB model is a common source of confusion is that it is
    designed with primary colors red, green, and blue, rather than the familiar red,
    yellow, and blue primary colors for paints or crayons that most of us learned
    in elementary school. The RGB primary colors work well if our three panes are
    light sources. Suppose for example that we replaced the red/yellow/blue panes
    with red/green/blue panes, and simply added their colors, without weights, as
    in the following:


    ```

    mixed_color = pane_color + refracted_color;

    ```


    The result is shown in Figure 16.24.


    ![](img/a15a9f662738db7597e865cb1a19c561_470_0.png)


    Figure 16.24

    A scene with three overlapping colored light sources, colors added together'
