    # 3.2.2.4 PUT Statement Cursor and Line Pointers Are Not Supported


    This Base SAS DATA step writes neatly organized information in the log using cursor
    controls (@) and line feeds (/):


    ```

    data_null;

    Text=''Hello, world'';

    X=1;

    put @7 Text = /7 X =;

    ```


    SAS Log:


    ```

    Text=Hello, world

    X=1

    NOTE: DATA statement used (Total process time):

    real time 0.00 seconds

    cpu time 0.01 second

    ```


    However, the same code in DS2 generates syntax errors, because the PUT statement
    in DS2 does not accept cursor and line controls:


    ```

    proc ds2;

    data_null;

    method run();

    Text=''Hello, world'';

    X=1;

    put @6 Text = / @6 X=;

    enddata;

    run;

    quit;

    ```


