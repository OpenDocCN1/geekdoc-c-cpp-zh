  md: "# About This Book\n\n# Purpose\n\nThis book will take you from complete novice\
    \ to confident competence with the new SAS programming language, DS2.\n\n# Is\
    \ This Book for You?\n\nAre you comfortable with traditional Base SAS DATA step\
    \ and SQL processing? Want to supercharge your data preparation? Then DS2, the\
    \ new SAS programming language that integrates the power and control of the DATA\
    \ step with the ease, flexibility, and rich data type palette of SQL might be\
    \ just what you are looking for! DS2 plays well with multiple data sources, which\
    \ is exceptionally suited for manipulating data on massively parallel platforms\
    \ (MPPs) like Hadoop, Greenplum, and Teradata.\n\nDS2 gives you the power to accomplish\
    \ tasks such as:\n\n+   - traditional SAS data sets and DBMS data tables containing\
    \ full-precision ANSI data types, all in the same DS2 data program\n- easily create\
    \ and share reusable code modules\n- create custom objects and use object-oriented\
    \ programming techniques\n- safely and process simple rows or multiple rows of\
    \ data simultaneously in Base SAS\n- execute DS2 code in-database on Hadoop, Greenplum,\
    \ and Teradata\n\n# Prerequisites\n\nThis book assumes reader proficiency in these\
    \ topics:\n\n+   - DATA step programming:\n  - SAS libraries\n  - accessing data\
    \ with a LIBNAME statement\n  - reading and writing SAS data sets\n  - the role\
    \ of the program data vector (PDV) in DATA step processing\n  - conditional processing\
    \ techniques"
  merge: -1
  img_proc: true
