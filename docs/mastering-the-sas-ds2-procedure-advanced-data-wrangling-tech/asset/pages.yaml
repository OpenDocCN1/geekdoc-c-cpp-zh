  md: "# 112 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\
    \nA quick look at the thread set reveals that it looks much like a package, but\
    \ the column that contains the exerted source is SAS_TEXTTHREAD_instead of SAS_TEXTPACKAGE_,\
    \ as shown in Figure 6.1:\n\nFigure 6.1: Viewing the Contents of a Stored DS2\
    \ Thread Program\n\n| SAS_ROWID_ | SAS_CHECKSUM | SAS_TEXTTHREAD_ |\n|---|---|---|\n\
    | 1 | | 1612651414 DATA_STEP_J_PROGRAM |\n| 2 | | 60987635850 |\n| 3 | | 29526935554\
    \ |\n| 4 | | 42292655442 BIAREBAU2ZRBQLN34HAGPLZFY2PR90ROBEGZYPYSO5OLMXQAGILLI22X6HRFPSDAXINVBHHN\
    \ |\n| 5 | | 6668155542 GWKDSW05MLSIJAQKFFSWBTYTRGY6WDM5Z47ECB5PALYZIXYQKPHFTTVQR2OMFS3JVC\
    \ |\n| 6 | | 92082837 JTQ4FRAGCAE25HGQNDNIPZZAQ66YWRQJTMKX8XCLGVQVTSFVNAHR6RR2QBQ====\n\
    \nTo execute the thread, we must first declare an instance in a data program.\
    \ Because the thread requires a parameter, we will call the SETPARMS method to\
    \ parameter before we use a SET statement to execute the thread. The THREADS=3\
    \ option will cause three copies of the thread program to execute in parallel\n\
    \n```\ndata null;\n  decl thread work.myThread;\n  method init();\n    t.setparms(1);\n\
    \  end;\n  method run();\n    set from t threads=3;\n  end;\n  method term();\n\
    \    put 'DATA Program: ';\n    put _all_;\n    put;\n  end;\nenddata;\n```\n\n\
    SAS Log:\n\n| ThreadNo=0 Count=3\nThreadNo=1 Count=0\nThreadNo=2 Count=0\nDATA\
    \ Program:\nNAME-National Savings and Trust Count=3 ThreadNo= N=4 RATE=0.0328\n\
    \nThe log reveals that the thread program variable flag is available for processing\
    \ in the thread program, but not in the data program. The thread's globally declared\
    \ ThreadNoCount appear in the data program's PDV, and this can be confusing. Count\
    \ was created with a SUM statement, its value is retained in the PDV. So, by the\
    \ time data program TERM method is executed, Count is still there, but ThreadNo\
    \ has been reinitialized to missing-even though _n_ is 4! In this case, it might\
    \ have been a better idea to drop ThreadNo and Count in the thread program, as\
    \ we really have no use for them in the output result set."
