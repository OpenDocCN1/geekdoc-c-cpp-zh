- pgno: 47
  md: '# 3.2.2.5 Keywords Are Reserved Words


    The Base SAS DATA step language has very few reserved words. By examining the
    context, the compiler decides whether a keyword should be interpreted as code
    or as identifier. For example, it is perfectly OK to name your set Data or a Variable
    Character:


    ```

    data Data;

    Character=''A'';

    put ''The character is '' Character;

    run;

    ```


    SAS Log:


    The character is A


    However, the same code in DS2 generates syntax errors, because DS2 all keywords
    are reserved:


    ```

    proc ds2;

    data Data/overwrite=yes;

    dcl char(1) Character;

    method run();

    Character=''A'';

    put ''The character is '' Character;

    end;

    enddata;

    run;

    quit;

    ```


    SAS Log: ERROR: Compilation error.

    ERROR: Parse encountered DATA when expecting '';'';

    ERROR: Line 457: Parse failed: data >>> Data << /overwrite=yes;


    > The SAS System stopped processing this step because of errors.


    Following ANSI SQL standards, you can use a keyword as an identifier only if you
    enclose it in double quotation marks:


    ```

    proc ds2;

    data "Data"/overwrite=yes;

    dcl char(1) "Character"

    method run();

    "Character"=''A'';

    put ''The character is '' "Character";

    end;

    enddata;

    run;

    quit;

    ```'
  merge: -1
  img_proc: true
