    # 5.3 The Hash and Hiter (Hash Iterator) Packages


    # 5.3.1 General


    Hash and hash iterator objects are memory-resident objects that enable quick and
    efficient storage, retrieving of data based on lookup keys. They are frequently
    used as lookup tables. Depending on the order of keys and the size of the data,
    a hash object can retrieve values significantly faster than a SAS format. Hash
    objects can be loaded from a SAS data set, referenced, manipulated, and stored
    back to SAS a data set using a traditional SAS DATA step or DS2 program. Data
    is loaded in the order in which it occurs in the data set. The order determines
    the order in which items are retrieved from the hash. When loading a hash object,
    you can specify the ORDERED argument, which determines the order. The DS2 hash
    and hiter packages provide hash and hash iterator functionality in DS2 programs.


    Think of a hash iterator (hiter) as an ordered view of an existing hash object.
    It can retrieve data in whatever order, regardless of the hash ORDERED argument.
    A hiter object must reference an existing hash object, the referenced hash object
    must be instantiated before you instantiate a hash iterator object.


    # 5.3.2 Hash Package Example


    In this example, we will load a hash object to hold supplier information and use
    the hash object to look up supplier name, address, and country information based
    on supplier ID values contained in the creatlistdata set.


    # 5.3.2.1 Using the Hash Package


    To use a hash object in DS2, we must first set the object by declaring an instance
    of the hash package and providing the necessary constructor parameters. A hash
    object can be completely defined at instantiation, providing the data source,
    key, and values. We''ll work our way through a complete definition, discussing
    parameters along the way.'
