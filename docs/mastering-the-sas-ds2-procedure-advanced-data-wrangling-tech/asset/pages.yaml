    When calling this type of method, you must supply a variable name for IN_OUT parameter
    values; otherwise, constant values will result in a syntax error:


    ```

    proc ds2;

    /* No output DATA set. Results returned as a report (like SQL) */

    data;

    dcl double Tf Tc;

    /* Method modifies a value at the call site */

    method f2c(in out double T);

    /* Fahrenheit to Celsius (Rounded) */

    T=round((T-32)*5/9);

    end;

    method init();

    /* Method f2c requires a variable as a parameter */

    /* Passing in a constant causes an error */

    f2c(37.6);

    end;

    enddata;

    run;

    quit;

    ```


    SAS Log:


    ```

    ERROR: Compilation error.

    ERROR: In call of f2c: argument 1 is ''in_out''; therefore, the argument must
    be a modifiable value.

    ```


    # 2.2.7 Variable Identifiers and Scope


    In a DS2 program, all objects, variables, and code blocks must have identifiers
    (names). Within the DS2 program, an identifier''s scope is either global or local,
    and identifiers are unique within their scope. Figure 2.4 shows a DS2 program
    with variable identifiers of both global and local scope and indicates which values
    will be returned when referenced.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "# Chapter 2: Introduction to the DS2 Language\n\nFigure 2.4: DS2 Data Program\
    \ Variable Scope\n\n| Global identifiers can be referenced anywhere in the data\
    \ program. | proc ds2;\ndata null;\n-dcl varchar(6) var1 var2;\n-retain var2 'Global';\n\
    -method init();\n-dcl varchar(5) var1;\n-put var1='Local';\n-put 'INIT method\
    \ ' var1=;\n-put 'INIT method ' var2=;\n-end;\nmethod run();\n-put var1=;\n-put\
