    \n```\nproc ds2;\ndata _null;\n  decl package sqlstmt make (\n    'create table\
    \ work.dates(DTM double, DT double, T double)');\n  decl package sqlstmt apnd\
    \ (\n    'insert into work.dates(DTM,DT) VALUES (?,?,?)'\n    ;SAS_Datetime SAS_Date\
