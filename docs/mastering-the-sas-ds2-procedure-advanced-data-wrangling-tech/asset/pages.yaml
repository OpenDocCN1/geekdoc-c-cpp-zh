    # 1.1 Introduction


    Today''s data scientists deal with ever larger data sets from a widening variety
    of data sources, and the computations required to process that data are continually
    becoming more complex. As the SAS System has been modernized with each new release,
    SAS procedures (PROCs) have been rewritten to be thread-enabled, allowing them
    to use multiple CPUs on a single computer or even push processing into massively
    parallel processing (MPP) environments such as Teradata, Hadoop, or the SAS High-Performance
    Analytics grid. But the step, with its sequential, observation-by-observation
    approach to data manipulation, has remained stubbornly single.


    In the summer of 2013, SAS released SAS 9.4, which included a revolutionary new
    programming language named DS2. DS2 is basically DATA step programming redesigned
    from the ground up with several important goals.


    Here is what DS2 can do:


    +   - natively process American National Standards Institute (ANSI) SQL data types
    for better integration with external data stores

    - provide modern structured programming constructs, making it simple to extend
    the functionality of the DS2 language with reusable code modules

    - tightly integrate with SQL

    - provide simple, safe syntax for multi-threaded processing to accelerate CPU-intensive
    tasks


    I like to think of DS2 as a language that retains the power and control of the
    Base SAS DATA step programming language combined with the simplicity of SQL and
    with just enough object-oriented features to make simple, reusable code modules.


    If you have a SAS/ACCESS license for a supported database management system (DBMS),
    the traditional SAS DATA step can process DBMS data, but native data types are
    first translated to SAS 8-byte floating-point numeric or fixed-width character
    types by the LIBNAME engine. This causes a loss of precision when dealing with
    higher-precision ANSI data types, such as BIG or DECIMAL. DS2 is capable of directly
    manipulating ANSI data types—including multi-byte character types—even when processing
    on the SAS compute platform. Figure 1.1'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    compares and contrasts traditional Base SAS DATA step processing with DS2 data
    program processing, illustrated by a basic example.


    Figure 1.1: Traditional DATA Step versus DS2 Data Program Processing


    | Base SAS DATA step | DS2 data program in Base SAS |

    | --- | --- |

    | SAS | SAS -> DS2 |

    | PDV | PDV |

    | ID Name Salary | ID Name Salary |

    | Num Char Num | Bigint VarChar Decimal |


    | SAS/ACCESS LIBNAME engine | DS2 driver |

    | --- | --- |

    | DBMS Table | DBMS Table |

    | ID Name Salary | BIGINT VarChar Decimal |


    We can see in Figure 1.1, when the traditional SAS DATA accesses DBMS data via
    the SAS/ACCESS engine using a LIBENAME statement, DBMS data types are automatically
    converted to fixed-width character or double-precision, floating-point numeric.
    In contrast, the DS2 data program accesses the RDBMS data via a special driver
    associated with the SAS/ACCESS product and can therefore process the data in its
    native data.


    The SAS DATA step is essentially a data-driven loop: reading, manipulating, and
    writing out one observation at a time. If the process is computationally complex,
    it can easily become CPU bound; that, data can be read into memory faster than
    it can be processed. If the DATA step elapsed (clock) time in the SAS log is the
    same as the CPU time, your process is most likely CPU bound. DS2 can accelerate
    CPU-bound processing by processing data rows in parallel using DS2 threads. Figure
    1.2 contrasts traditional SAS DATA step, single-threaded processing with multi-threaded
    processing using DS2 thread and data programs.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Figure 1.2: Serial Processing in the DATA Step versus DS2 Parallel Processing


    Single-threaded DATA step


    DS2 threads parallel processing on the SAS compute platform


    ![](img/ef05c3db88dda150abd07414dd206d3f_19_0.png)


    ![](img/ef05c3db88dda150abd07414dd206d3f_19_1.png)


    SAS/ACCESS LIBENAME engine


    DS2 threaded DBMS driver


    As can be seen in Figure 1.2, the traditional SAS DATA step must process each
    row of data sequentially. By contrast, DS2 can use thread and data programs to
    process multiple rows of data simultaneously.


    Notice that both processes use a single-read thread, so if getting data from disk
    or the DBMS into memory on the SAS compute platform for processing is the bottleneck,
    threaded processing on the SAS compute platform will not improve overall performance.
    This situation is referred to as an “I/O bound” operation. DS2 uses a single read
    to feed multiple compute threads when processing in Base SAS to ensure that row
    of data is distributed to only one compute thread for processing. If I/O is the
    bottleneck and computations are taking place on the SAS, DS2 is unlikely to improve
    performance.


    However, today''s DBMS data is enormous, data movement should be completely avoided
    whenever possible. With DS2, in a properly provisioned and configured SAS installation
    that includes the SAS In-Database Code Accelerator, your DS2 programs can actually
    execute on the database hardware without having to move data to the SAS compute
    platform at all. Figure 1.3 compares DS2 data thread processing over the SAS compute
    platform to in-database processing with DS2 and the SAS In-Database Code Accelerator.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    Figure 1.3: Parallel Processing with Threads: SAS Compute Platform versus In-Database


    # DS2 threads parallel processing

    on the SAS compute platform


    # DS2 threads parallel

    processing in-database


    ![](img/ef05c3db88dda150abd07414dd206d3f_20_0.png)


    As you can see in Figure 1.3, using DS2 thread and data programs with the SAS
    In-Database Code Accelerator allows the DS2 code to compile and execute on the
    massively parallel DBMS hardware. If the process reads from a DBMS table and also
    writes to a DBMS table, then only the code goes into the DBMS, and only the SAS
    log comes out. Processing takes place in the DBMS. This concept of "taking the
    code to the data instead of the traditional "bringing the data to the code" greatly
    reduces the amount of data movement for processing, extends the computational
    capabilities of the DBMS to include SAS functions and processing logic, and takes
    full advantage of the massively parallel processing (MPP) capabilities of the
    DBMS. If you are a SAS programmer or a data scientist in an environment that includes
    SAS, you will find that DS2 quickly becomes a go-tool for data manipulation.


