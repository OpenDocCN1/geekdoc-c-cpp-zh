  md: '# About The Author


    ![](img/ef05c3db88dda150abd07414dd206d3f_15_0.png)


    A self-avowed technophile, Mark Jordan grew up in northeast Brazil as the son
    of Baptist missionaries. He served 20 years as a US Navy submariner pursuing his
    passion for programming as a hobby. Upon retiring from the Navy, he turned his
    hobby into a dream job, working as a SAS programmer for 9 years in manufacturing
    and financial services before coming to SAS Institute in 2003. Mark teaches a
    broad spectrum of Foundation SAS programming classes, and has authored and co-authored
    the several SAS Tricks


    When he isn''t teaching SAS programming, Mark sporadically posts “Jedi SAS Tricks”
    on the SAS Training Post blog, enjoys playing with his grandchildren and great-grandchildren,
    hanging out at the beach and reading science novels. His secret obsession is flying
    toys – kites, rockets, drones – though he tries (unsuccessfully) to convince his
    wife they are for the grandkids. Mark currently lives in Toano, VA with his wife,
    and their cat, the amazing Tiger Man. You can read his blog at http://go.sas.com/jedi
    and follow him on Twitter @SASJedi.


    Learn more about this author by visiting his author page at http://support.sas.com/jordan.
    There you can download free book excerpts, access example code and data, read
    the latest reviews, get updates, and more.'
