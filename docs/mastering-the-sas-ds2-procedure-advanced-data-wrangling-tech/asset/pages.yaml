  md: "# 34 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\n\
    there is no loss of functionality-DS2 has a different approach to resolving the\
    \ problem. We will examine several cases where it appears Base SAS DATA step has\
    \ lost as well as the new approaches that DS2 takes to get the job.\n\n# 3.2.3.1\
    \ WHERE Statement\n\nI was shocked when I realized that DS2 did not include a\
    \ WHERE statement.\n\n```\nproc ds2;\n  data test/overwrite=yes;\n  method run();\n\
    \    set crs.one_day;\n    where amount<15;\n  end;\nendata;\nrun;\nquit;\n```\n\
    \nSAS Log:\n\n```\nERROR: Compilation error.\nERROR: Missing END statement for\
    \ the method run.\nERROR: Parse encountered WHERE when expecting end of input.\n\
    ERROR: Line nnn: Parse failed: >>> amount<15;\n```\n\nI couldn't find a WHERE\
    \ statement in the DS2 document. But while researching this \"problem\" I made\
    \ a delightful discovery-DS2 allows you to write a SQL query in the SET statement,\
    \ requesting the SQL result set as if it were a data set! Now I understand just\
    \ how \"tight integration between DS2 and SQL\" accomplish. For example, I can\
    \ join data sets, order the results, and use a SET statement to ingest the SQL\
    \ result and perform Data-step BY-group processing. Using this technique, I can\
    \ produce detail and summary output data sets, all in a single DS2 data program\
    \ step:\n\n```\nproc ds2;\n  data detail (Keep=(Employee_ID Emp_Total)\n    summary\
