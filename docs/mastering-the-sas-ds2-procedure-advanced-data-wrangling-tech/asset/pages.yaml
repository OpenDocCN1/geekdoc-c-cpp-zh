- pgno: 93
  md: '# Chapter 5: Predefined Packages 77


    This DCL PACKAGE statement instantiates a hash object named h1 with the keys and
    data parameters defined.


    ```

    dcl package hash h1(

    [SupplierID],[SupplierName SupplierAddress Country]);

    ```


    +   1. The **keys** parameter accepts a variable list and defines the variables
    that are used as keys to look up data.

    2. The **data** parameter accepts a variable list that indicates the values that
    are to be returned by a successful lookup. In this example, **SupplierID** is
    the key and SupplierName, SupplierAddress, and Country are the data.

    3. The third parameter, **hashash** (hash expression), accepts an exponent value
    (n), which defines the hash package''s table size as 2ⁿ. The hash table size does
    not equate to the number of items that be stored—each container can actually hold
    an infinite number of items. Using a larger number of containers for larger data
    improves the efficiency of the hash table''s lookup routines. You might have to
    experiment with different values to find the sweet spot for your particular hash
    object''s performance. The maximum value for *n* is 16, which produces 64K containers.
    Our data in this example is small, so we''ll use a hash expression of 1:


    ```

    dcl package hash h1(

    [SupplierID],[SupplierName SupplierAddress Country],1);

    ```


    +   4. The fourth parameter, **datasrc**, provides the name of the data set to
    load into the hash object. Instead of providing a data set name, you can choose
    instead to provide a FedEx query in bases. These hash declarations are equivalent:


    ```

    dcl package hash h1(

    [SupplierID],[SupplierName SupplierAddress Country],1

    ,''crs.supplier'');

    ```


    ```

    dcl package hash h2(

    [SupplierID],[SupplierName SupplierAddress Country],1

    ,''select * from crs.supplier'');

    ```


    +   5. The fifth parameter, **ordered**, describes the order in which the values
    will be returned from the hash object. Acceptable values are ''ascending'' (''a''
    or ''yes''), ''descending'' (''d'') or ''no'', which leaves the order in which
    data is returned undefined. The default is ''no''.


    ```

    dcl package hash h1(

    [SupplierID],[SupplierName SupplierAddress Country],1

    ,''crs.supplier'',''a'');

    ```'
