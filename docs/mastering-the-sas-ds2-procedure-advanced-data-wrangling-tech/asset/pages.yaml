  md: "# Chapter 6: Parallel Processing in DS2 111\n\ntransistors operating at 1-2\
    \ MHz clock speeds in the first Apple computers to today's 64-bit processors with\
    \ over 1.5T transistors operating at clock speeds greater than 4 GHz, we pushed\
    \ the CPU speed envelope to its. Eventually, making a single CPU with smaller\
    \ transistors and a faster clock no longer produced dramatic processing speeds,\
    \ and we needed to rethink our approaches to boosting speed. And, as the age of\
    \ parallel processing was born. Instead of a single CPU, today's processor chips\
    \ boost multiple CPU cores, each capable of processing separate tasks in parallel.\
    \ A task is normally referred to two threads at once, so a chip with four cores\
    \ can process eight threads simultaneously. Today, even our smart phones multiple-cored\
    \ CPUs and the associated parallel processing capabilities.\n\nHaving more than\
    \ one CPU available opens up new ways of approaching to improve the speed of operations.\
    \ Those willing to redesign processes from the ground up can identify program\
    \ tasks that could be accomplished independently of each other and rewrite the\
    \ program to do these tasks in parallel, greatly reducing the clock time required\
    \ to complete the entire program. As you might imagine, this greatly increases\
    \ the complexity of writing software, but can provide dramatic speed boosts. This\
    \ is the world in which DS2 was created to operate.\n\n# 6.3 DS2 Thread Programs\n\
    \n# 6.3.1 Writing DS2 Thread Programs\n\nDS2 threads are stored programs that\
    \ can be executed in parallel. They are in some ways similar to data programs\
    \ in that they must contain at least one explicit system method (INIT, RUN, or\
    \ TERM), which can declare local and global variables that affect the PDV, and\
    \ can instantiate and use packages.\n\nThreads are also similar to packages: they\
    \ are stored in SAS libraries as encrypted source code and can include user-defined\
    \ methods. Threads can accept parameters, but unlike packages, which do not use\
    \ user-defined constructor methods and thus do not accept parameter upon instantiation.\
    \ Instead, parameter values are set using the SETPARMS method, which for a package,\
    \ must be called before executing the thread with a SET statement. Like a package,\
    \ parameter variables are private to the thread program, but globally available\
    \ within the thread.\n\nLet's write our first thread program and take a look at\
    \ the results.\n\n```\nproc ds2;\nthread work.myThread(double flag)/overwrite=y;\n\
    \tdcl int ThreadNo;\n\tdcl int Count;\n\tmethod run();\n\t\tset crs.banks;\n\t\
    \tcount+1;\n\t\tend;\n\tmethod term();\n\t\treadThreadNo=_threadid;\n\t\tput ThreadNo=Count=;\n\
    \t\tend;\nendthread;\nrun;\nquit;\n```"
