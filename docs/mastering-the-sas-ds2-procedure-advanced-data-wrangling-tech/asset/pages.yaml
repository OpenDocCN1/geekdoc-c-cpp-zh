  md: '# 5.8 Review of Key Concepts


    +   * SAS uses predefined DS2 packages to extend the capabilities of the DS2 language.

    * PROC FCMP can create custom functions for use in traditional SAS DATA step and
    PROC FC SQL processing.

    * The FCMP package allows DS2 to use FCMP functions as if they were methods stored
    in a DS2 package, without requiring copying or extra maintenance.

    * Hash and hiter objects can provide lookup features in a DS2 program when implemented
    using the hash and hiter packages.

    * The HTTP package enables querying Internet APIs from a DS2 program, and the
    JSON package provides the methods necessary to parse the JSON returned from an
    API query.

    * The matrix package provides powerful matrix programming capabilities for your
    DS2 programs.

    * The SQLSTMT package makes it possible to perform cross-library table updates
    without requiring both tables to reside in the same DBMS, without the need for
    correlated subqueries, and without the need to learn DBMS-specific SQL.

    * The TZ package makes dealing with date, time, and timestamp data from multiple
    time zones a snap'
