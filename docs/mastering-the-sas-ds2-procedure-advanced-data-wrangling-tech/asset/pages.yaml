    \ var1=;\n-put 'TERM method ' var2=;\n-end;\nendata;\nrun;\nquit; |\n Local identifiers\
    \ can only be referenced within the method in which they were defined. \n\n![](img/ef05c3db88dda150abd07414dd206d3f_33_0.png)\n\
    \n+   Legend:\n- Global Scope\n- Local Scope\n\nIf the program illustrated in\
    \ Figure 2.4 is executed, the following results are produced in the SAS log:\n\
    \n| INIT method var1=Local\nINIT method var2=Global\nRUN method var1=Global\n\
    RUN method var2=Global\nTERM method var1=Global\nTERM method var2=Global |\n\n\
    Variable identifiers are also in scope if the variable is undeclared or introduced\
    \ to the program via a statement. In DS2, an undeclared variable is created whenever\
    \ a variable is first referenced in a program statement other than a SET or DECLARE\
    \ statement, such as an assignment statement. The use of undeclared variables\
    \ in DS2 is discouraged; doing so will produce warnings in the SAS log. Although\
    \ this might at first seem strange to a SAS data programmer, if you ever executed\
    \ a long-running SAS program only to be greeted by the dreaded NOTE: Variable\
    \ var is uninitialized in the SAS log, you will understand the benefit of this\
    \ behavior. Generally, that means you've misspelled a variable name somewhere\
    \ in your code, and the processing time for that run of the step has been wasted.\n\
    \nYou can control DS2 behavior for undeclared variables with the system option\
    \ DS2COND or SCOND=option in the PROC DS2 statement. The default is WARNING, but\
    \ NONE, NOTE, and ERROR are all valid values. When writing, prototyping, or coding,\
    \ I prefer to have this option to ERROR, so that DS2 programs containing undeclared\
    \ variables will fail to compile, will not execute, and will produce this message\
    \ in the SAS log:\n\n| ERROR: Compilation error.\nERROR: Line nn: No DECLARE for\
    \ referenced variable var; creating as a global variable of type double. |"
