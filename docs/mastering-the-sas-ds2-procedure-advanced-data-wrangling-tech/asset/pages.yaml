    \ crs.dates;\n  apnd.execute();\nend\nenddata;\nrun;\nquit;\n```\n\nThe SQLMT\
    \ package also provides the FETCH method for interrogating a result set produced\
    \ by executing a query, as well as the BINDRESULTS method for populating an ordered\
    \ list of PDV variables by the query results.\n\nThe BINDRESULTS method need only\
    \ be called once. It uses the information provided via the second argument during\
    \ SQLMT package instantiation to create a map for populating PDV variables from\
    \ columns in the query results. You must execute this method once before using\
    \ FETCH to retrieve values.\n\nThe FETCH method reads a row from the result set\
    \ and produces a zero (0) return code if a row was retrieved. A nonzero result\
    \ indicates either that there was an error (1) or no more result sets are available\
    \ (2). This method is typically used in a DO WHILE or DO UNTIL expression.\n\n\
    ```\nproc ds2;\ndata _null;\ndecl package sqlstmt qry{\n  'select * from crs.dates';\n\
    \  decl double DTM having format datetime;\n  decl double DT having format mmddyy10;\n\
    \  decl double T having format timeampm.\n  method init();\n    query.execute();\n\
    \  query.bindresults({DT T});\n    do while (qry.fetch(dt) = 0);\n      put dt=\
    \ dt= t=;\n    end\nend;\nenddata;\nrun;\nquit;\n```"
