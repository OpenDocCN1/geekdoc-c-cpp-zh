  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\nSAS\
    \ Log:\n\nThe character is A\nNOTE: Execution succeeded. One row affected.\n\n\
    # 3.2.2.6 DS2 Uses ANSI SQL Quoting Standards\n\nIn DS2, double quotation marks\
    \ are used only to delimit an identifier. Single quotation marks are required\
    \ to delimit\n\n```\nproc ds2;\ndata _null;\ndcl char(25) \"Character\";\nmethod\
    \ run();\n  \"Character\"='This is the message.';\n  put \"Character\";\nend;\n\
    enddata;\nrun;\nquit;\n```\n\nSAS Log:\n\nThis is the message.\nNOTE: Execution\
    \ succeeded. No rows affected.\n\nThis requirement can be problematic when trying\
    \ to resolve macro variables as all or part of a character value in DS2. If the\
    \ macro reference is placed in the single quotation marks that DS2, the macro\
    \ variable fails to resolve. That is because single quotation marks prevent tokenization\
    \ of the enclosed text:\n\n```\n%let msg=This is the message;\nproc ds2;\ndata\
    \ _null;\ndcl char(25) \"Character\";\nmethod run();\n  \"Character\"='&msg';\n\
    \  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n%msg\n\
    NOTE: Execution succeeded. No rows affected.\n\nIf you place the macro reference\
    \ in double quotation marks so that it will be tokenized and resolved, DS2 will\
    \ interpret the resolved text as an identifier instead of constant text:\n\n```\n\
    %let msg=This is the message;\nproc ds2;\n```"
