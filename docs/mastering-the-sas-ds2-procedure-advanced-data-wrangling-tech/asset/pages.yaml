  md: "# Chapter 3: DS2 Data Program Details\n\nHere are the other pertinent rules\
    \ for missing and null values while operating DS2 in SAS mode:\n\n+   1. Missing\
    \ values are automatically converted to null when assigned to a variable of any\
    \ data type other than CHAR or DOUBLE.\n2. Other times when null values are automatically\
    \ converted to missing:\n   a. used in expressions containing CHAR or DOUBLE values\n\
    \   b. when assigned to a CHAR or DOUBLE type variable\n   c. when passed to a\
    \ Base SAS function as a parameter value\n\n+   3. In expressions comparing a\
    \ character value to a single blank, the single blank is interpreted as a SAS\
    \ character missing value.\n\nExecuting program Ch3.3.4.2.sas demonstrates the\
    \ handling of SAS missing and ANSI null values in PROC DS2 operating in SAS mode.\n\
    \nSAS Log:\n\n```\n*** From SAS Data Set ***\n*** DS2 CHAR Values - SAS Mode ***\n\
    C is = ' \nmissing(C) is true.\nnull(C) is not true.\n\n*** DS2 DOUBLE Values\
    \ - SAS Mode***\nN is = ' \nmissing(N) is true.\nnull(N) is not true.\n\n*** SAS\
    \ Mode Using ANSI VARCHAR and Decimal Variables ***\n*** DS2 VARCHAR Values ***\n\
    Var is not = ' '\nmissing(Var) is true.\nnull(Var) is not true.\n\n*** DS2 DECIMAL\
    \ Values ***\nDec is = ' \nmissing(Dec) is true.\nnull(Dec) is not true.\n```\n\
    \nNote that the CHAR and DOUBLE values behave just as you would expect-both evaluate\
    \ as to the constant missing representation, the Base SAS MISSING function evaluates\
    \ them both as missing, and the DS2 NULL function sees them both as null.\n\n\
    VARCHAR null values are not equal to the constant missing value, the Base SAS\
    \ MISSING function returns TRUE. This is because all null values are automatically\
    \ transformed to missing before being passed to a Base SAS function. As expected,\
    \ the DS2 NULL function evaluates VARCHAR as null.\n\nDECIMAL null values are\
    \ equal to the constant missing value, are evaluated as missing by the SAS MISSING\
    \ function for the reasons previously stated, and evaluated as null by the DS2\
    \ NULL function."
