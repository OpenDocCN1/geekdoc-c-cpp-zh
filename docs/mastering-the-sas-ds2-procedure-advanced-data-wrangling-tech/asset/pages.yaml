    ANSI TIME, DATE, and TIMESTAMP values should not be confused with SAS TIME, DATE,
    and DATETIME values which are all stored as doubleprecision-floating-point numbers
    and adherence to external rules to be properly interpreted. SAS TIME values are
    actually SAS numeric values indicating the number of seconds between midnight
    and the time being expressed. SAS DATE values indicate the number of days between
    January 1, 1960, and the date being expressed. SAS DATETIME values are numeric
    values indicating the number of seconds since midnight, January 1, 1960, and the
    date and time being expressed. These values are not interchangeable with ANSI
    DATE, TIME, and TIMESTAMP values.


    # 3.3.2 Automatic Data Type Conversion


    In any programming, all values in an expression must be presented as values of
    the same data type before the expression can be resolved. With 17 different data
    types available, you can begin to see that automatic data type conversion will
    be happening more frequently in a DS2 data program than ever did in a traditional
    SAS DATA step. Because of this, by default DS2 does not write a note to the SAS
    log when automatic data type conversions occur, which might make troubleshooting
    subtle problems that were caused by data type conversion a bit'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Chapter 3: DS2 Data Program Details


    difficult. You can force DS2 to write the log whenever automatic data type conversions
    occur by place using the global DS2 statement DS2_OPTIONS TYPEWARN immediately
    before the data program that you want to debug.


    # 3.3.2.1 When Data Types Are Converted


    In SAS programming, a numeric value is used in a character context or a character
    value is used in a numeric context, automatic data type conversion occurs. For
    example, using a numeric value as one of the arguments to the CATX concatenation
    function causes the number to be converted to the BEST16 format, and the resulting
    text is used in the same. Adding a character value to a number causes the text
    to be converted to a standard SAS numeric format. If the automatic conversion
    does not meet our requirements, we can always do explicit conversions using the
    PUT INPUT functions. With DS2 and its myriad of data types, the process will be
    more complex. For example, what happens if you add an integer value to a DOUBLE?
    There is a long ensuing discussion in the DS2 documentation around automatic data
    type conversion in a variety of situations, based on a hierarchy of data priorities.
    The truth is, we will primarily be concerned with numeric conversions. I use the
    following "rule of thumb", which works in the majority of situations:


    +   1. In DS2, the DOUBLE (Base SAS numeric) is king of the hill. Any expression
    involving a DOUBLE or an undeclared variable will produce a DOUBLE as a result.

    * Undeclared numeric variables are always DOUBLE.

    * Any expression involving a DOUBLE causes all numeric values to convert to DOUBLE.
    This is important to remember when processing BIGINT or DECIMAL values in conjunction
    with DOUBLE, as loss of precision can result.

    * Text values converted to numeric produce DOUBLE values.

    * All values passed to Base SAS functions are converted to DOUBLE, if necessary,
    before being passed to the function as parameters.


    +   2. In numeric expressions that do not involve a DOUBLE, all convert to the
    highest precision data type involved in the expression. For example, if you are
    adding an INTEGER value to a BIGINT, the INTEGER value will convert to BIGINT,
    and the expression is resolved, producing a BIGINT value as the result.


    +   3. Any value passed as a parameter to a DS2 method will be converted to the
    type specified for that parameter when the method was defined. For example earlier
    expects to be a single DOUBLE value. If the c2f method is defined as an INTEGER,
    if I call c2f(MyTemp) the value of MyTemp will be converted to DOUBLE before being
    passed to the c2f method.


    # 3.3.2.2 Troubleshooting Automatic Type Conversion Issues


    As you can see, automatic data type conversions happen with great frequency during
    DS2 processing. In order to prevent saturating the log with data conversion notes,
    DS2 programs do not produce notes in the SAS log for automatic data type conversions.
    The DS2_OPTIONS TYPEWARN statement can be used to troubleshoot problems resulting
    from automatic type conversion. DS2_OPTIONS settings remain in effect only for
    the next program, and they should be placed immediately before the DS2 data program:


    ```

    proc ds2;

    ds2 options TYPEWARN;

    ```


