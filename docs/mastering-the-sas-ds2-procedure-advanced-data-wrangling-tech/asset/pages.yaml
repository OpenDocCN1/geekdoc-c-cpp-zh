  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\nbetween\
    \ the Base SAS DATA step and the DS2 data program. For example, these statements\
    \ work essentially the same in both languages:\n\n+   - SET\n- BY-group processing,\
    \ including First.variable and Last.variable\n- DO groups and DO loops\n  - DO\
    \ i= start TO STOP BY interval\n  - DO WHILE ()\n  - DO UNTIL ()\n  - loop flow\
    \ control statements CONTINUE, LEAVE, and END\n- Program flow control statements\n\
    \  - RETURN\n  - OUTPUT\n  - GOTO\n  - STOP\n- Declarative statements\n  - KEEP\
    \ and DROP\n  - RETAIN\n\nRemember that in any DS2 program, global declarative\
    \ statements must appear in the global program space—that is, after the DATA,\
    \ THREAD, or PACKAGE statement and before the first method definition.\n\n# 3.2.2\
    \ The “Six Subtle Dissimilarities”\n\nThough many things work exactly the same\
    \ in a traditional DATA step and a DS2 data program, there are some differences\
    \ that are quite subtle and be kept in mind when programming in DS2. Let’s go\
    \ over the primary cutcuts, which I’ve come to refer to as the six subtle dissimilarities.\n\
    \n# 3.2.2.1 All Executable Statements Must Be Part of a Method Code Block\n\n\
    Executable statements in the global program space result in a syntax error:\n\n\
    ```\nproc ds2;\ndata _null_;\nset crs.one_day;\nput _all_;\nenddata;\nrun;\nquit;\n\
    ```"
