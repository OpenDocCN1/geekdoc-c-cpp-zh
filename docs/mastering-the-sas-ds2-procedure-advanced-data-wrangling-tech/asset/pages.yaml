- pgno: 65
  md: "# Chapter 3: DS2 Data Program Details 49\n\nThe CHAR value read in from the\
    \ SAS set evaluates as '=', but now for a different reason: in ANSI mode ' indicates\
    \ ANSI space character, and the CHAR value is indeed full of spaces. Note that\
    \ neither the MISSING and NULL functions return FALSE for the CHAR value, which\
    \ is interpreted as ANSI space filled instead of missing.\n\nIn ANSI mode, DOUBLE\
    \ functions work the same as any other ANSI numeric. It evaluates as '.' because\
    \ missing values are immediately replaced with ANSI null values when read into\
    \ the PDV. For the same reason, the NULL function returns TRUE when presented\
    \ with the DOUBLE value. The SAS MISSING function returns TRUE, but this is because\
    \ the null value was automatically converted to missing when passed to the Base\
    \ SAS null function.\n\n# 3.4 Review of Key Concepts\n\n+   * \"Six Subtle Dissimilarities\"\
    \n    * All executable statements must be part of a method code block\n    * DS2\
    \ programs do not overwrite data by default.\n    * All variables not introduced\
    \ via the SET statement must be declared.\n    * PUT statement cursor line pointers\
    \ are not supported.\n    * Keywords are reserved words.\n    * DS2 uses ANSI\
    \ SQL quoting standards:\n        * Single quotation marks delimit text constants.\n\
    \        * Double quotation marks delimit identifiers.\n    * Use %TSLSIT to resolve\
    \ macro variable values in literal text.\n* DS2 “Missing” Features\n    * Many\
    \ “missing” features are not missing—they are just accomplished differently in\
    \ DS2:\n        * There is no WHERE statement, but the SET statement accepts SQL\
    \ query result that might contain a WHERE clause.\n        * There is no UPDATE\
    \ or MODIFY statement, but this behavior can be emulated with an SQL query in\
    \ a SET statement.\n* Traditional SAS DATA steps read raw data, control the SAS\
    \ environment, or execute arbitrary system commands are not supported in DS2.\n\
    * DS2 natively processes a wide variety of ANSI data types. Because of this, automatic\
    \ data type conversions happen frequently. Whenever a DOUBLE value is involved\
    \ in a numeric expression, all other values will be converted to DOUBLE for processing,\
    \ and some precision might be lost if BIGINT or DECIMAL values are involved.\n\
    * DS2 provides functions for explicit conversion between ANSI TIMESTAMP, DATE,\
    \ and TIME and SAS DATETIME, DATE, and TIME values.\n* SAS missing values and\
    \ ANSI null values are fundamentally different ways of expressing unknown data.\
    \ DS2 has two modes, SAS mode and ANSI mode, that allow you to select the default\
    \ processing paradigm. ANSI null and SAS missing values can be successfully processed\
    \ together in the same program as long as the conversion behaviors are understood."
