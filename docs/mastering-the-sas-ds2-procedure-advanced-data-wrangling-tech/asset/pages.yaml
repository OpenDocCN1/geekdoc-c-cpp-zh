    ```\nset crs.one_day;\nend;\nenddata;\nrun;\nquit;\n```\n\n# 2.2.5.3 The TERM\
    \ Method\n\nThe TERM method executes once, and only once, immediately after the\
    \ RUN method completes execution and before the data or thread program terminates\
    \ execution. It provides an appropriate place to execute program finalization\
    \ code. This DATA step and DS2 data program would produce the same results, but\
    \ the DATA step requires the use of the END= statement option, the associated\
    \ automatic variable, and a conditional logic decision to accomplish the DS2 data\
    \ program without requiring any additional resources or code:\n\n```\ndata new_data;\n\
    if _n=1 then do\n  put 'Execution is beginning';\nend;\nset crs.one_day end=last;\n\
    if last=1 then do\n  put 'Execution is ending';\nend;\n```\n\n```\nproc ds2;\n\
    data null;\nmethod init();\n  put 'Execution is beginning';\nend;\nmethod run();\n\
    \  set crs.one_day;\nend;\nmethod term();\n  put 'Execution is ending';\nend;\n\
    enddata;\nrun;\nquit;\n```\n\n# 2.2.6 User-Defined Methods\n\nIn DS2, you can\
    \ easily define and use your own reusable code blocks. These code blocks are called\
    \ user-defined methods, and they can accept parameter values either by reference\
    \ or by value. When all parameters are passed into a method by value, the values\
    \ are available inside the method for use in calculations, and the method can\
    \ return a single value to the calling process—like like a Base SAS function.\
    \ This data program uses a user-defined method to convert temperatures from Celsius\
    \ to Fahrenheit.\n\n```\nproc ds2;\n/* No output DATA set. Results returned as\
    \ a report (like SQL) */\ndata;\n  dcl double DegC DegF;\n  /* Method returns\
    \ a value */\n```"
  merge: -1
