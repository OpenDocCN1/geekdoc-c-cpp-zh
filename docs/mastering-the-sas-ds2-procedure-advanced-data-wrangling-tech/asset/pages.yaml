  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\nFigure\
    \ 4.3: Results of the Modified User-Defined Interest Method with Four Parameters\n\
    \nResults for each bank - $5,000 deposit variable compounding periods\n\n| Total\
    \ | Years | Periods | Bank | Rate |\n|---|---|---|---|---|\n| $5,858.01 | 5 |\
    \ 4 | Carolina Bank and Trust | 0.0318 |\n| $5,861.40 | 5 | 52 | Carolina Bank\
    \ and Trust | 0.0318 |\n| $5,866.73 | 5 | 4 | Big Federal Credit Union | 0.0321\
    \ |\n| $5,870.20 | 5 | 52 | Big Federal Credit Union | 0.0321 |\n| $5,887.13 |\
    \ 5 | 4 | National Savings and Trust | 0.0328 |\n| $5,890.77 | 5 | 52 | National\
    \ Savings and Trust | 0.0328 |\n\nNow we have a dilemma. If everyone in the company\
    \ is using our v1.0 interest method, which requires only three parameters, to\
    \ do their calculations and if we replace it with the new v1.1, which requires\
    \ four parameters, all of the current programs using the interest method will\
    \ fail because of syntax errors. Because DS2 methods require that all parameters\
    \ be identified when the method is compiled, we can’t have “optional” parameters.\
    \ What we would really like to do is write several versions of the same method\
    \ and have the system choose the most appropriate version at run time. And, in\
    \ a nutshell, *is method overloading*.\n\n# 4.2.4. Method Overloading\n\nMethod\
    \ overloading is accomplished by creating two or more methods that have the same\
    \ name but that have “signatures.” A method’s signature consists of its name and\
    \ the ordered list of its parameter data classes. Consider the following method\
    \ definitions:\n\n```\nmethod t (double val);\n    put 'Double Parameter';\nend;\n\
    method t(real val);\n    put 'Real Parameter';\nend;\n```\n\nExecuting a program\
    \ with these methods in the same scope will result in a compilation error:\n\n\
    ```\nERROR: Compilation error.\nERROR: Duplicate declaration for method t.\n```\n\
    \nThe signatures for these methods would look something like this:\n\n+   - t,\
    \ floating-point numeric\n- t, floating-point numeric\n\nWhen we think of this,\
    \ we can easily see why the compiler is complaining about our code! In order for\
    \ a method’s signature to be unique, it must either have a different number of"
