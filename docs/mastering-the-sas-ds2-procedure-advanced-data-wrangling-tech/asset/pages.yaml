- pgno: 61
  md: '# 3.3.4 Processing SAS Missing and ANSI Null Values


    SAS missing values and ANSI null values are two very different representations
    of unknown values in a data store. ANSI null values are actually no value: zeros
    of data are stored when the actual value for a variable is not known. As a result,
    nothing can be determined about the unknown value. So a null value is an unknown
    value.


    SAS takes a different approach to missing data. It stores special codes for missing
    values in each variable where the actual value is unknown. Although the actual
    value for this variable is not known, MISSING itself is a known value of sorts.
    There are three types of missing in SAS:


    +   - character missing value, represented by a blank ('' '') when displayed in
    reports

    - standard numeric missing, represented by a period (''.'') when displayed in
    reports

    - special numeric missing values (27 levels), represented by ''_'' and ''A'' through
    ''Z''


    # 3.3.4.1 SAS Missing versus Null: The Rest of the Story


    If the idea of special missing values is news to you, SAS might see a bit obsessive
    in its provisions for missing. However, there is a good reason for all of this
    focus. Consider a scenario where you are tasked with collecting demographic data
    in a neighborhood. Here is a copy of your questionnaire:


    | House # | Question | Response |

    |---|---|--|

    | | How many people reside in this home? | |

    | | How long have you lived here? | |

    | | What is the total household annual income? |


    With your clipboard in hand, you valiantly set forth on your mission to collect
    data. You knock on the first door and ask your questions. When asked about household
    income, the first respondent answers, "How should I know?" My spouse works-I stay
    home and drink beer all day!" Well, it seems our survey is off to a very poor
    start! At house number 3, you are still rattled from the encounter at house number
    one that you forgot to ask the income question at all, and just to make the day
    more "interesting" the respondent at house number 5 becomes indignant when you
    asked about household income and slams the door in your face! The rest of your
    day goes reasonably well, with respondents answering all of the questions. When
    the survey is complete, there are several income data points for which we don''t
    have a value, but we know the reasons why the data is missing: some respondents
    refused to answer, others were clueless, and at times, we forgot to ask the household
    income question.


    If we store data in SAS, we can check each of the missing values to know why the
    data is missing. .R could indicate the respondent refused to answer, .C that the
    respondent was reluctant, .F that I forgot to ask for the salary value. The crs.survey
    data contains the reason is missing. The table cr.survey contains the data stored
