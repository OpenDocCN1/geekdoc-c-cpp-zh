    \  and memename='X'\n\nquit;\n%put NOTE: &=rows &=columns;\n```\n\n```\nproc ds2;\n\
    data _null;\n  varray double a[2];\n  dcl package matrix m(&rows,&columns)\n \
    \ method run();\n  /* Read data, load each row of matrix from varray*/\n  set\
    \ x;\n  m.min(a, _n);\n  enddata;\n  run;\nquit;\n```\n\n# 5.5.1.2 Manipulating\
    \ and Retrieving Values from a Matrix\n\nA matrix is manipulated using one of\
    \ the methods available in the matrix package. Data can be offloaded from a matrix\
    \ to a declared array or a variable array created with a VARARRAY statement. If\
    \ a variable array is used, the data is loaded into PDV variables and becomes\
    \ part of data program result set.\n\nIn the following example, values are loaded\
    \ into array a, and the values of array a's elements are printed in the SAS log.\
    \ Subsequently, the IN method is used to populate matrix from the values in array\
    \ a. Matrix m then transposed using the TRANS method, and its elements are passed\
    \ back to array a using the TOARRAY method. The elements of array a are once again\
    \ written to the SAS log. Finally, a square root transformation is performed on\
    \ all the elements of matrix m, and the element values are once again passed to\
    \ array a using the TOARRAY method. The values of elements of array a in the SAS\
    \ log show the results of the transformation.\n\n```\nproc ds2;\ndata _null;\n\
    \  dcl double a[2, 2];\n  dcl package matrix m(2,2);\nmethod init();\n  a:=1,\
    \ 9, 4, 16);\n  put 'before: ' a[*]=;\n  m.min(a);\n  m.trans(a);\n  m.toarray(a);\n\
    \  put 'Trans: ' a[*]=;\n  m.sqrt(sqrt);\n  m.toarray(a);\n  put 'SQRT ' a[*]=;\n\
    enddata;\nrun;\nquit;\n```"
