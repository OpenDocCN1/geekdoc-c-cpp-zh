- pgno: 34
  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\nIn\
    \ a DS2 data program, variable scope plays one important role: only global variables\
    \ are included in the PDV, and only PDV variables are eligible to become part\
    \ of the data program result. You can explicitly remove global variables from\
    \ the program result set using DROP or KEEP statements. Variables with local scope\
    \ are not included in the PDV, so there is no need to drop them-they will never\
    \ appear in the program result set.\n\nFor example, in the following DS2 program,\
    \ the variables Total and Count are declared globally and have global scope. The\
    \ variables Category and Amount are introduced via the SET statement and also\
    \ have global scope. All of these variables can be referenced in both the RUN\
    \ and TERM methods, and all are included in the program result set.\n\n```\nproc\
    \ ds2;\ndata;\n  double Total Count;\n  method run();\n    set crs.one_day (keep=(Payee\
    \ Amount));\n    Total+Amount;\n    Count+1;\n  end;\n  method term();\n    put\
    \ Total= Count=;\n  end;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n| Total=7230.5\
    \ Count=6 |\n\n**Figure 2.5: Report Produced by the Data Program**\n\n| Obs |\
    \ Total | Payee | Amount |\n|---|---|---|-*|\n| 1 | 9.60 | 1 Misc | $9.60 |\n\
    | 2 | 19.91 | 2 Ice Cream | $10.31 |\n| 3 | 37.91 | 3 Services | $18.00 |\n| 4\
    \ | 230.50 | 4 Big Retailer | $192.59 |\n| 5 | 3230.50 | 5 Misc | $3,000.00 |\n\
    | 6 | 7230.50 | 6 Misc | $4,000.00 |\n\nIn the next DS2 program, the variables\
    \ Total and Count are locally declared in the RUN method. As a result, their scope\
    \ is local to RUN and can be referenced only by the RUN method. When the TERM\
    \ method attempts to reference variables Total and Count, they are not available\
    \ in the PDV, so the DS2 compiler treats these as new, undeclared variables. Warning\
    \ messages are produced in the SAS log and, because undeclared variables have\
    \ global scope, Total and Count"
