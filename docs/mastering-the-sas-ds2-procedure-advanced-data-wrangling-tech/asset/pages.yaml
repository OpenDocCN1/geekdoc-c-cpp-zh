  md: '# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    # 6.2 Understanding Threaded Processing


    # 6.2.1 The Need for Speed


    We humans are such an impatient species! Since the inception of the computer,
    extraordinary effort has been expended to increase processing speed. There are
    many factors affecting processing speed that we''ll be able to address the problem
    in realistic detail in this book. However, to simplify now, we''ll break down
    the problem into two major categories: moving data from off-line storage to system
    memory (RAM) and back to off-line storage, and processing data that is resident
    in memory.


    # 6.2.2 Loading Data to and from RAM


    Memory and storage have traditionally been limited assets, requiring careful conservation
    of the part of the program. Off-line storage has taken many forms over the years,
    from punch cards to paper tape, magnetic tape, floppy disks, hard drives, thumb
    drives, and today''s solid state disk (SSD) drives. Until the invention of solid
    state devices, moving data to and off-line storage has always been an electro-mechanical
    process and has always been orders of magnitude slower than processing data in
    RAM. And even today''s solid state technologies have significantly higher lag
    than RAM. In data retrieval can be exacerbated by the need to draw the data to
    the compute platform over a busy network. The process is referred to as more typically
    as I/O bound. If you have a long-running step and the SAS logs indicate much faster
    elapsed than CPU time, the process is likely to be I/O bound.


    With off-line storage, the goal is to move the data into and out of RAM as quickly
    as possible. Many strategies have evolved to address this issue. Some of the more
    significant improvements come from redundant arrays of independent disks (RAID)
    technology and the rise of SSDs. Caching strategies with physically parallel data
    storage and retrieval schemes like RAID have greatly increased data throughput
    rates. SSDs store in memory chips that don''t require constant power instead of
    the spinning platters and moving read heads of the traditional hard drive. Because
    the process is completely electronic, the data transfer rates of SSDs are much
    faster than those of hard drives, although they use a bit more than hard drives.
    SSDs are slower than the dynamic memory technologies used in RAM, but the gap
    is narrowing.


    All of these technologies and strategies present data to a CPU in the same order
    as it would have appeared read really from a single disk. Because of this, any
    modifications to accomplish Read/Write operations primarily affect the operating
    system and are transparent to the applications that are consuming the data.


    # 6.2.3 Manipulating Data in RAM


    As data was moved into RAM at even faster rates and as the computations performed
    on each row became more complex, it becomes more for processes to receive additional
    data faster than the CPU could accomplish the calculations on the current row.
    This type of process is described as CPU bound. You can identify CPU-bound DATA
    steps in SAS by looking at the log. If the CPU time is consistently the same as
    the elapsed time, the process is probably CPU bound.


    Like the field of off-line storage, our CPU and supporting systems were evolving
    to meet the new demand, becoming ever faster and more efficient. From the 8-bit
    processors with ~3.5K'
