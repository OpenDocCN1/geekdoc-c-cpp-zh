    # ## 2.1 Introduction


    In this chapter, we will describe the basic components and construction of DS2
    programs. Along the way, we''ll note similarities and differences between DS2
    data programs and traditional Base SAS DATA steps. We''ll also convert an existing
    DATA step to a DS2 data program and execute our first DS2 program using PROC DS2.


    # ## 2.2 DS2 Programming Basics


    # ### 2.2.1 General Considerations


    I like to describe DS2 as a next-generation language that combines the flexibility,
    control, and power of DATA step programming, the rich ANSI SQL data palette, and
    the benefits of object-based code modularity. At first glance, the DS2 language
    is comfortably similar to the DATA'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    step. It is fundamentally a high-level imperative, procedural language that is
    designed for manipulating rectangular data sets and includes features for working
    with arrays, hash objects, and matrices. Like the DATA step, ds2 programs begin
    with a keyword, and all statements end with a semicolon. However, there are significant
    differences. Table 2.1 highlights those.


    Table 2.1: DATA Step versus DS2


    | DATA Step | DS2 |

    |---|---|

    | There are almost no reserved words. | All keywords are reserved words. |

    | Data rows are processed individually and sequentially in single compute threaded.
    | Several data rows can be processed in parallel, using multiple concurrent threads.
    |

    | All variables referenced in a DATA step are global in scope. | Variables referenced
    in a DATA program can be global or local in scope. |

    | All variables referenced in a DATA step are in the program data vector (PDV)
    and will become part of the result set unless explicitly dropped. | Variables
    with local scope are not added to the PDV and are never part of the result set.
    |

    | Creating code with variable encapsulation requires the use of a separate procedure,
    PROC FCMP, which has its own syntax. | Reusable code modules with variable encapsulation
    are possible using standard PROC DS2 syntax in a package program. |

    | The DATA step can consume a table produced by an SQL query as input to the SET
    statement. | DS2 can directly accept the result set of an SQL query as input to
    the SET statement. |

    | The DATA step can process only double-precision numeric or fixed-width character
    data, DBMS ANSI SQL data types must be converted to one of these data types before
    processing can occur. | DS2 processes ANSI SQL data types in their native format
    at full precision.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 2.2.2 Program Structure


    A quick comparison of a DATA step and the equivalent DS2 data program clearly
    show the languages are closely related, but DS2 data programs are more rigidly
    structured:


    ```

    data _null;

    Message=''Hello World!'';

    put Message=\;

    run;

    proc ds2;

    data _null();

    method run()

    Message=''Hello World!'';

    put Message=\;

    end

    enddata;

    run;

    quit;

    ```


    The primary structural difference is that DS2 programs are written in code blocks.
    In Base SAS, the DS2 language is invoked with a PROC DS2 block, which begins with
    a PROC DS2 statement and ends with a QUIT statement:


    ```

    proc ds2;

    <ds2 program blocks>

    quit;

    ```


    Within a PROC DS2 block, you can define and execute three fundamental types of
    program blocks.


    # Table 2.2: DS2 Program Blocks


    | Program Block | Brief Description |

    | --- | --- |

    | Data | The heart of the DS2 language, data programs manipulate input data sets
    to produce output result sets. They can accept input from tables, thread program
    result sets, or SQL query result sets. |

    | Package | Package programs create collections of variables and methods stored
    in SAS libraries, enabling an object-oriented approach to development. Easy and
    effective reuse of proven code modules can ensure standardization of important
    proprietary processes, decrease time required to write new programs, and improve
    overall code quality. |'
  merge: -1
  img_proc: true
- pgno: 26
  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\n|\
    \ Program Block | Brief Description |\n|---|---|\n| Thread | Threads manipulate\
    \ input data sets to produce output result sets that are returned to a data program.\
    \ Used to simultaneously process rows of data in parallel, threads can accept\
    \ input from tables or SQL queries. |\n\nA more detailed description of each of\
    \ these program blocks is provided in Section 2.2.3. Each program block is delimited\
    \ by the appropriate DATA, PACKAGE, or THREAD statement and the corresponding\
    \ statement. DS2 uses RUN group processing and requires an explicitly coded RUN\
    \ statement to cause the preceding program block to execute:\n\n```\nproc ds2;\n\
    package package_name;\n  <ds2 programming statements to create the package here>\n\
    \  endpackage;\nrun;\nthread thread_name;\n  <ds2 programming statements to create\
    \ the thread here>\n  endthread;\nrun;\n  data output_dataset_name;\n    <ds2\
    \ programming statements to process data here>\n  enddata;\nrun;\nquit;\n```\n\
    \nEach program block consists of a combination of global declarative statements,\
    \ followed by one or more uniquely named executable method blocks. In DS2, executable\
    \ statements are valid only in the context of a method block. Method blocks are\
    \ delimited by METHOD and END statements:\n\n```\nproc ds2;\n  data output_dataset_name;\n\
    \  <global declarative statements>\n  method method_name(<method parameters>);\n\
    \    <local variable declarations>\n    <executable DS2 programming statements>\n\
    \  end;\nenddata;\nrun;\nquit;\n```"
  merge: -1
  img_proc: true
- pgno: 27
  md: "# 2.2.3 Program Blocks\n\nA brief description of each of the three program\
    \ blocks is provided here to help you interpret the simple examples in this chapter.\
    \ Most of this is dedicated to the data program. Package programs are discussed\
    \ in detail in Chapter 5, and thread programs in Chapter 6.\n\n# 2.2.3.1 DATA\
    \ Data Programs\n\nA DS2 data program begins with a DATA statement, includes at\
    \ least one system method definition, and generates a result. It is the fundamental\
    \ programming tool in the DS2 language. As in Base SAS DATA step, the DS2 data\
    \ program DATA statement normally lists the name or names of the table or tables\
    \ to which the result set will be written. Using the special table name NULL to\
    \ suppress the result set is optional. If no destination table is named in a SAS\
    \ DATA step, SAS directs the result set to the WORK library, using an automatically\
    \ generated data set name (DATA1, DATA2, and so on). A DS2 data program without\
    \ a destination table name sends its results to the Output Delivery System (ODS)\
    \ for rendering as a report, much like SQL query.\n\n```\ndata:\n  set crs.banks;\n\
    ;\n\nproc ds2;\ndata;\n  method run();\n    set crs.banks;\n  end;\nenddata;\n\
    run;\nquit;\n```\n\nThe SAS log for the traditional DATA step indicates that the\
    \ result set was written to a data set named DATA1 in the WORK library:\n\n> NOTE:\
    \ There were 3 observations read from the data set CRS.BANKS.\nNOTE: The data\
    \ set WORK.DATA has 3 observations and 2 variables.\n\nThe output from the DS2\
    \ data program appears instead in the Results tab:\n\nFigure 2.1: Output of the\
    \ DS2 Data Program\n\n| Name | Rate |\n| Carolina Bank and Trust | 0.0318 |\n\
    | State Savings Bank | 0.0321 |\n| National Savings and Trust | 0.0328 |"
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    # ## 2.2.3.2 Package Programs


    A DS2 package begins with a PACKAGE statement, ends with an ENDPACKAGE statement,
    and generates a package as a result. DS2 packages are used to store reusable code,
    including user-defined methods and variables. Packages are stored in SAS libraries
    and look like data sets. However, the contents of the package are a couple of
    rows of clear text header information followed by more rows encrypted source code.
    Packages make creating and sharing platform-independent reusable code modules
    secure and they provide an excellent means for us to extend the capabilities of
    the DS2 language.


    Packages can be used for more than just user-defined methods—they are the "objects"
    of the DS2 programming language. Global package variables (variables declared
    outside the package) act as static variables for each instance you instantiate
    a package, the instance has a private set of variables that it can use to keep
    track of its state. Packages can also accept constructor arguments to initialize
    the package when it is instantiated. DS2 packages allow SAS to easily create and
    reuse objects in their DS2 programs.


    # ## 2.2.3.3 Thread Programs


    A DS2 program begins with a THREAD statement, ends with an ENDTHREAD statement,
    and generates a thread as a result. Like DS2 packages, threads are stored in SAS
    libraries as data sets their contents consist of clear text header information
    followed by encrypted source code. Threads are structured like a DS2 program,
    in that they contain at least one system method definition and can include package
    references and user-defined methods. Once a thread is created, it can be executed
    from a DS2 program using the SET statement. The THREAD= option in the SET statement
    allows several copies of the thread program to run in parallel on the SAS compute
    platform for parallel processing, with each thread returning observations to the
    data program as soon as computations are complete.


    # ## 2.2.4 Methods


    Methods are named code blocks within a DS2 program, delimited by a METHOD statement
    and an END statement. Method blocks contain not nested method blocks, and all
    identifiers (names) must be unique within their DS2 data, package, or thread program
    block. There are two types of methods:


    +   1. *system methods* execute automatically at prescribed times in a DS2 program.

    2. *user-defined methods* execute only when called.


    # ## 2.2.5 System Methods


    There are three system methods that are included in every DS2 data program, either
    implicitly or explicitly. These methods provide a DS2 data program with a more
    structured framework than the SAS DATA step. In the Base SAS DATA step, the entire
    program is included in the implicit, data-driven loop. In a DS2 program, the RUN
    method provides the implicit, data-driven loop that will be most familiar to the
    traditional DATA step programmer. the INIT and TERM methods are not included in
    the loop, and provide a place to execute program initialization and finalization
    code.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Chapter 2: Introduction to the DS2 Language 13


    System methods execute automatically and do not accept parameters. You must explicitly
    define at least one of these methods in your data or thread program or the program
    will not execute. You do not write explicit code for one or more system method
    blocks, the DS2 compiler will create an empty version of the missing system method
    for you at compile time. An empty method contains only the appropriate METHOD
    statement by an END statement.


    # 2.2.5.1 The INIT Method


    The INIT method executes once and only once, immediately upon commencement of
    program execution. It provides a standard place to execute program initialization
    routines. The following DATA step and DS2 data programs produce the same results,
    but the DS2 data program does not require any conditional logic:


    DATA step:


    ```

    data _null;

    if _n=1 then do;

    put ''Execution is beginning'';

    end;

    ```


    DS2 data program:


    ```

    proc ds2;

    data _null;

    method init();

    put ''Execution is beginning'';

    end;

    endata;

    run;

    quit;

    ```


    # 2.2.5.2 The RUN Method


    The RUN method emulates the performance of a traditional SAS DATA step. It begins
    operation as soon as the INIT method has completed execution and acts as a data-driven
    loop. The RUN method iterates once for every row (observation) in the input data
    set. The RUN method is the only method that includes an implicit output at the
    END statement. The DATA step and DS2 data program produce the results:


    ```

    data new_data;

    if _n=1 then do;

    put ''Execution is beginning'';

    end;

    set crs.one_day;

    run;

    ```


    ```

    proc ds2;

    data new_data;

    method init();

    put ''Execution is beginning'';

    end;

    method run();

    ```'
  merge: -1
  img_proc: true
