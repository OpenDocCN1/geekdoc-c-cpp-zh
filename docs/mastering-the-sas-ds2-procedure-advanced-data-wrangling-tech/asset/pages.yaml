  md: '# 7.3 Analyzing Performance with the SAS Log


    # 7.3.1 Obtaining Performance Statistics


    The default option settings in SAS provide a modulus of performance reporting
    in the SAS log. Here is an example of the default performance statistics reported
    under Linux (the operating system used by SAS University Edition):


    Here is an example of standard performance statistics in the SAS log:


    ```

    NOTE: PROCEDURE DS2 used (Total process time):

    real time 2.35 seconds

    cpu time 0.17 seconds;

    ```


    You will notice that SAS produces performance statistics only after the QUIT statement
    for PROC DS2 session, so if you have included several DS2 steps within the boundaries,
    you only get aggregate results for the entire process. For troubleshooting and
    tuning, try placing each DS2 program in its own PROC DS2 session to obtain more
    granular results.


    When your performing is poorly, the problem usually boils down to one or more
    of the factors:


    +   * CPU

    * memory

    * I/O

    * network latency


    When tracking performance issues, or trying to tune your code, setting OPTIONS
    FULLSTEM can provide more detailed information that can help you narrow down the
    areas where the system might be having problems. You can then try writing code
    in different ways with the intent of mitigating performance problems by alleviating
    any problems detected.


    Here is an example of the performance statistics reported using FULLER:


    ```

    NOTE: PROCEDURE DS2 used (Total process time):

    real time 2.35 seconds

    user cpu time 0.10 seconds

    system cpu time 0.07 seconds

    memory 5738.84k

    OS Memory 30268.00k

    Timestamp 02/14/2016 10:23:11 AM

    Step Count 87 Switch Count 50

    Page Faults 0

    Page Reclaims 1925

    Page Swaps 0

    Voluntary Context Switches 2648

    Involuntary Context Switches 191

    Block Input Operations 0

    Block Output Operations 0

    ```'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    As you can see, the information that is reported is richer with FULLSTIMER turned
    on. Here is some descriptive information for selected performance statistics:


    Table 7.1: Performance Statistics in the SAS Log


    | Statistic | Significance |

    | --- | --- |

    | Real Time | This is the "wall clock" time elapsed while your job was executing—for
    example, the time you spent waiting for the step to complete. If any other programs
    are running on your system beside SAS, real time can fluctuate significantly for
    the same job depending on how long SAS has to wait for system resources in use
    by other processes. |

    | CPU Time | When FULLSTIMER is not in effect, SAS reports the sum of CPU time
    and system time as CPU time. When FULLSTIMER is in effect, CPU time and system
    time are reported separately. When parallel processing is in effect, CPU time
    can be greater than real time. |

    | User CPU Time | This is the CPU time expended executing user-written code, including
    the SAS program that you wrote and the built-in SAS processes that support its
    execution. |

    | System CPU Time | This is the CPU time expended by the operating system in support
    of user-written code. |

    | Memory | This is the memory allocated to this job or step, not including SAS
    system overhead. |

    | Involuntary Context Switches | This is the number of times a process releases
    its CPU time-slice involuntarily. Causes include running out of CPU time before
    your job is finished or having another task grab your time-slice because it has
    higher priority. |

    | Page Swaps | This is the number of times a process was swapped out of main memory.


    When benchmarking performance, it is necessary to run each version of a process
    several times in separate SAS sessions and average the performance results. It
    is very helpful to be able to extract performance statistics from the SAS log
    and save them to a SAS data set for later analysis. The experimental %LOGPARSE
    macro is available for download from the SAS Support website and can automate
    this process for you to some extent.


    If these techniques do not identify your problem, configuring the SAS logging
    facility to use some of the DS2 loggers might be useful. Setting up SAS to use
    these loggers can be a bit intimidating at first, but a lot of detailed information
    can be gained using this technique. See *SAS DS2 Language Reference* appendix
    titled “DS2 Loggers.” Also see *SAS Logging: Configuration and Programming Reference*.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Chapter 7: Performance Tuning in DS2 123


    # 7.3.2 Analyzing Performance Statistics


    One of the first comparisons to make is real CPU time. If your task is performing
    real and time CPU time are consistently within 10 to 15% of each other, the limiting
    factor is probably CPU time, and your task is CPU bound. If there is a large difference
    between real time and CPU time, the limiting factor is probably I/O, and your
    process is probably I/O bound. Other valuable information from FULLSTIMER can
    be gained by analyzing the remaining statistics. A search of support.sas.com for
    “FULLSTIMER SAS option” will provide more in-depth guidance on how to proceed.


    # 7.3.3 Tuning Your Code


    As a general rule, if your task reads from a table in a DBMS that has the SAS
    In-Database Accelerator installed, it will run much faster if you rewrite the
    data program and execute the thread from a data program using the SET statement.
    Performance will be even better if the data program output is also a database
    table and your database is capable of running both the thread and data programs
    in-database. As of this writing, only Teradata and Hadoop have that capability.
    If your task sources its data from a DBMS, using DS2_OPTIONS TRADE or OPTIONS
    SASTRACE or both can identify how much processing is happening in the database
    and how much movement to the SAS platform for processing was necessary.


    In summary, the following


    +   - If your task is I/O bound, threading on the SAS platform will likely exacerbate
    the problem. However, if your task sources its data from a DBMS that has the SAS
    Database Code Accelerator installed, you can probably significantly improve performance
    by running the process in-database as a DS2 THREAD program.

    - If your task is CPU bound, it can benefit from parallel processing using DS2
    threads, even if you do not have in-database processing capability available.
    Try writing the data program as a thread program, and executing it in parallel
    from a data program using the SET statement, experimenting with THREADS+ option
    values.

    - Another technique I''ve found (when my DS2 program uses an SQL query as input
    to the SET statement) is to create a temporary table using the query and then
    use the temporary table as input to the DS2 program while troubleshooting. This
    can help isolate performance degradation to the DS2 or SQL portion of the program.


    # 7.4 Learning and Trouble-Shooting Resources


    # 7.4.1 SAS Learning Resources


    SAS provides extensive documentation for the DS2 language, including many code
    examples that provide an excellent opportunity for learning about DS2. A great
    place to begin is https://support.sas.com/documentation. You will find the DS2
    documentation in the Base SAS section.


    SAS also provides free-to-videos via their YouTube channel at https://www.youtube.com/user/SASsoftware.
    And, of course, well-word search of the Internet will frequently yield instructive
    examples with source code.'
  merge: -1
