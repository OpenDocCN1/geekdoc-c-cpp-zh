    referred to as JSON package IS methods. All of them accept a single argument and
    return either TRUE or FALSE:


    Table 5.4: JSON Package IS Methods


    | Method | Returns TRUE in These Conditions |

    |---|---|

    | ISBOOLEANTRUE | Token value is Boolean True |

    | ISBOOLEANFALSE | Token value is Boolean False |

    | ISFLOAT | Token value is type Float |

    | ISINTEGER | Token value is type Integer |

    | ISLABEL | Token value is a label |

    | ISLEFTBRACE | Token value is a left brace |

    | ISLEFTBRACKET | Token value is a left bracket |

    | ISNULL | Token value is null |

