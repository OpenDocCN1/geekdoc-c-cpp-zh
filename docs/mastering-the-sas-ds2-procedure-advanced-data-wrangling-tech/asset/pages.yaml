  md: "# 5.7.2 TZ Package Example\n\nWe have a data set, crs.cities, that contains\
    \ information about all the cities in which we have brick and mortar stores. We\
    \ would like to read a report that shows the local time on the SAS server, as\
    \ well as the local time and UTC offset for each of those cities.\n\n# 5.7.2.1\
    \ All Executable Statements Must Be Part of METHOD Code Block\n\nOur solution\
    \ code uses two instances of the TZ package to do the work. The TZ package for\
    \ the local server will be instantiated at compile, the city TZ package will be\
    \ instantiated at runtime using the _NEW_ keyword and information from the TimeZone\
    \ variable in the crs.cities data\n\n```\nproc ds2;\ndata;\n/* Instantiate the\
    \ server TZ package */\ndcl package tzServer();\n/* Declare but do not instantiate\
    \ the city TZ package */\ndcl package tzCity;\ndcl double DTCity DTServer having\
    \ format datetime;\ndcl int TimeDifference;\ndcl varchar(20) TimeZoneID;\ndrop\
    \ TimeZone lat long;\nmethod run();\n set crs.cities;\n/* Instantiate the city\
    \ TZ package */\n/* using TimeZone variable from data set */\ntzCity_new _tz(TimeZone);\n\
    /* Get server current time */\nDTServer=tzServer.getLocalTime();\n/* Get city\
    \ current time and time zone ID */\nDTCity-dtCity=tzCity.getLocalTime();\nTimeZoneID=tzCity.getTimeID();\n\
    /* Calculate offset from server time in hours */\nTimeDifference=tzServer.getoffset(time(),\
    \ TimeZoneID)/3600;\nend;\nadda;\nrun;\nquit;\n```\n\nFigure 51: Date/Time Information\
    \ Produced with the TZ Package\n\n| DTCity | DTServer | TimeDifference | TimeZone\
    \ | AU | City |\n|---|---|---|---|---||\n| 20JAN16:23:42:22 | 20JAN16:07:42:22\
    \ | 11 | Australia/Melbourne | AU | Melbourne |\n| 20JAN16:23:42:22 | 20JAN16:07:42:22\
    \ | 11 | Australia/Sydney | AU | Sydney |\n| 20JAN16:07:42:22 | 20JAN16:07:42:22\
    \ | -5 | America/New-York | US | Miami |\n| 20JAN16:07:42:22 | 20JAN16:07:42:22\
    \ | -5 | America/New-York | US | Philadelphia |\n| 20JAN16:04:42:22 | 20JAN16:07:42:22\
    \ | -8 | America/Los-Angeles | US | San Diego |"
