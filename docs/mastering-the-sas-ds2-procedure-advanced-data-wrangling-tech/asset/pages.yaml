    ERROR: Compilation error.

    ERROR: Parse encountered invalid character when expecting '''';

    ERROR: Line 212: Parse failed: put >>> <<< 6 Text = / @6 X=;

    \NOTE: The SAS System stopped processing this step because of errors.

    ```'
