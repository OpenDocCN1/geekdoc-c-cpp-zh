- pgno: 132
  md: "# 6.4 DS2 and the SAS In-Database Code Accelerator\n\n# 6.4.1 Running DS2 Programs\
    \ In-Database\n\nRegardless of where your DS2 threads are stored, if you have\
    \ licensed, installed, and configured the SAS In-Database Code Accelerator for\
    \ a supported database, the thread program can be sent into the database where\
    \ it compiles and executes on database hardware. The prospect of running thread\
    \ programs on an MPP excites you, you will really love knowing that, on Teradata\
    \ or Hadoop installations, the DS2 program itself can also run in parallel in-database!\
    \ This allows us to use the power and flexibility of SAS2 compute processes while\
    \ benefiting from the massively parallel processing capability of the database\
    \ hardware. As of the time this book was written, the SAS In-Database Code Accelerator\
    \ is available for Teradata, Hadoop, and Greenplum databases.\n\nTo set your DS2\
    \ program free from the bounds of the SAS compute platform, you only need to ensure\
    \ that the thread program is reading from a database table in the SET statement\
    \ and that the PROC option DS2ACCEL=YES is set. If you also write the results\
    \ of your program to the same database, your code goes in, all processing happens\
    \ on the DBMS platform, and nothing is returned to the SAS session log. It is\
    \ impressively speedy!\n\nYou might not have access to a Teradata instance with\
    \ the SAS In-Database code Accelerator installed, but I did while writing this\
    \ section of the book. First, I ran a DS2 program in threads on the SAS compute\
    \ platform, using a large Teradata table as input and writing the results to Teradata.\
    \ I then ran the exact same program in-database on Teradata by setting the PROC\
    \ option DS2ACCEL=YES.\n\nHere is the code on the SAS platform:\n\n```\nproc ds2;\n\
    data crs_db.scored_thread/overwrite=yes;\ndcl thread ScoreIt th;\n  method run();\n\
    \    set from th threads=4;\n  end;\nenddata;\nrun;\nquit;\n```\n\nHere is the\
    \ SAS log excerpt from execution on the SAS platform:\n\n| NOTE: PROCEDURE DS2\
    \ used (Total process time): |\n| real time | 4:08.68 |\n| cpu time | 6.48 seconds\
    \ |\n\nAnd here is the code used in-database processing:\n\n```\nproc ds2 ds2accel=yes;\n\
    data crs_db.scored_thread/overwrite=yes;\ndcl thread ScoreIt th;\n  method run();\n\
    \    set from th;\n  end;\nenddata;\n```"
  merge: -1
  img_proc: true
