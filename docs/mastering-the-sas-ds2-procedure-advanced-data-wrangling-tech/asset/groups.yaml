    \ 127\n\n## 前言\n\n在我管理 SAS 产品核心数据处理语言（如 DATA 步、DS2、PROC SQL 和 FedSQL）开发的多年，我逐渐意识到教育的价值。如果技术再好，但受益的人群无法理解它，一切也毫无意义。仅仅将事实汇集成一本书并不等同于教学生。\n\
    \n在他的新书《精通 DS2 过程：高级数据抓取技术》中，Mark 成功地不仅为 SAS DS2 语言的语法，更重要的是为该语言的目标提供了一个极其简洁的介绍。他系统地构建了示例，让读者以令人满意的速度翻阅每一页。从\
    \ DATA 步到 DS2 的对比帮助 SAS 程序员快速找到方向，而无需成为 DATA 步的专家。\n\n他对 DS2 包的覆盖非常有价值，因为这些包由\
    \ SAS 提供的或用户编写，扩展了语言的功能。在数据量爆炸的网格计算时代，对并行执行的关注非常及时。\n\n最后，我特别喜欢他在学习语言历程中的个人轶事，说明了缺失之处、不同之处以及独特之处。我认为他的输入对\
    \ DS2 设计团队的未来非常有价值。\n\nRobert Ray\n总监\nSAS \n北卡罗来纳州 Cary\n\n## 关于本书\n\n### 目的\n\
    \n本书将带你从初学者变为 DS2 的熟练运用。\n\n### 本书适合你吗？\n\n你熟悉传统的 DATA 步和 SQL 处理吗？想要增强你的数据准备能力？那么\
    \ DS2 这种集成了 DATA 步的力量与控制，以及 SQL 的易用性和丰富数据类型的新语言，可能正是你需要的！DS2 让你能够完成任务：\n\n- 轻松创建和共享复用模块\n\
    - 创建自定义对象并使用面向对象的技术\n- 在传统的 数据集和 DBMS 表中同时处理单行或多行数据\n- 在 Hadoop、Greenplum 和 Teradata\
    \ 等大规模并行平台上操作数据。\n\n### 背景知识\n\n本书假设读者熟悉以下主题：\n\n- DATA 步编程：\n  - SAS 库\n  - 使用\
    \ LIBNAME 语句访问数据\n  - 读取和写入数据集\n  - PDV 在数据步处理中的作用\n  - 条件处理\n- 数组\n- 迭代处理（DO\
    \ 循环）\n- 宏处理：\n  - 为宏变量赋值\n  - 在 SAS 代码中解析宏变量\n  - 宏过程执行与其他 SAS 代码执行的时机\n- SQL\
    \ 连接\n\n### 本书范围\n\n本书涵盖了以下主题：\n\n- 该语言设计的流程类型，以及何时使用 DS2 是改进性能的良好选择\n- 传统数据步与\
    \ DS2 共享的编程语句和函数\n- DS2 中不具备的功能\n- 传统数据步不支持的 DS2 新功能\n- 在 DS2 中全精度操作 ANSI 数据类型\n\
    - 将传统的 SAS 转换为 DS2 数据程序\n- 在 DS2 中创建复用模块并进行封装以便于复用\n- 使用 DS2 包创建面向对象的程序\n- 创建\
    \ DS2 线程程序并行处理数据记录\n\n## 关于示例\n\n#### 开发本书内容的软件\n\nSAS 9.4M3\n\n书中的大部分程序仅使用 Base\
    \ SAS 并在 SAS University Edition 中开发。\n\n- 写 DBMS 的程序还需要这些解决方案：\n  - SAS/ACCESS\
    \ to Teradata 接口。\n  - SAS Teradata 数据库内代码加速器。\n\n所有 DBMS 数据都存储在 Teradata Express\
    \ 15.0 中。\n\n"
