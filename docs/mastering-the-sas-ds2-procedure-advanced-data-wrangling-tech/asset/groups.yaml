  mdcn: "\n\n# 精通 SAS DS2 过程：高级数据处理技术\n\n## 6.2 理解多线程处理\n\n### 6.2.1 对速度的需求\n\n我们人类是这样一种缺乏耐心的物种！自从计算机诞生以来，人们就付出了巨大的努力来提高处理速度。影响处理速度的因素有很多，我们将在书中通过现实的细节来解决这些问题。然而，为了简单起见，我们将问题分为两大类：将数据从离线存储移动到系统内存（RAM）并返回离线存储，以及处理驻留在内存中的数据。\n\
    \n### 6.2.2 在 RAM 之间加载数据\n\n内存和存储在传统上一直是有限的资产，需要对程序的某些进行谨慎维护。多年来，离线存储经历了多种形式，从打孔卡到纸带、磁带、软磁盘、硬盘、优\
    \ 盘，以及如今的固态硬盘（SSD）。在固态设备发明之前，数据在离线存储之间的移动一直是一个电机械过程，且速度始终比在 RAM 中处理数据慢几个数量级。即使是今天的固态技术，其延迟也显著高于\
    \ RAM。数据检索可能会因为需要通过繁忙的网络将数据提取到计算平台而加剧。这种过程通常被称为 I/O 密集型（I/O bound）。如果你有一个运行很长的步骤，且\
    \ SAS 日志显示通过时间远快于 CPU 时间，那么该过程可能是 I/O 密集型的。\n\n对于离线存储，目标是尽可能地将数据移入离开 RAM。为了解决这个问题已经进化出了许多策略。一些最重要的改进来自于独立磁盘冗余（RAID）技术和\
    \ SSD 的兴起。具有物理并行数据存储和检索方案的缓存策略极大地提高了数据吞吐率。SSD 存储在不需要持续电源的内存芯片中，而不是传统硬盘的旋转盘片和移动读头。由于整个过程完全是电子化的，SSD\
    \ 的数据传输速度远快于硬盘，尽管它们使用的空间比硬盘多一点。SSD 慢于 RAM 中使用的动态内存技术，但差距正在缩小。\n\n所有这些技术和策略向 CPU\
    \ 呈现数据的顺序与它们从单个磁盘中实际读取时的顺序相同。因此，任何为了完成读/写操作而进行的修改主要影响操作系统，而对消耗数据的应用程序是透明的。\n\n\
    ### 6.2.3 在 RAM 中操作数据\n\n随着数据以更快的速度移入 RAM，以及对每行执行的计算变得越来越复杂，进程接收额外数据的速度变得比 CPU\
    \ 完成当前行计算的速度更快，这变得更加困难。这种过程被称为 CPU 密集型（CPU bound）。你可以通过查看日志来识别 SAS 中的 CPU 密集型\
    \ DATA 步骤。如果 CPU 时间始终与通过时间一致，则该过程可能是 CPU 密集型的。\n\n就像离线存储领域一样，我们的 CPU 及其系统也在进化以满足新需求，变得越来越快、越来越高效。从第一代苹果计算机中运行\
    \ 1-2 MHz 时钟频率、具有约 3.5K 个晶体管的 8 位处理器，到如今主频超过 4 GHz、拥有超过 1.5 万亿晶体管的 64 位处理器，我们将\
    \ CPU 速度推向了极限。最终，使用更小晶体管和更快时钟的单 CPU 不再能产生显著的处理速度，我们需要重新思考提高速度的方法。于是，并行处理时代诞生了。如今的处理器芯片不再是单个\
    \ CPU，而是提升了多个 CPU 核心，每个核心都能够并行处理单独的任务。一个任务通常同时涉及两个线程，因此具有四个核心的芯片可以同时处理八个线程。今天，甚至我们的智能手机也拥有多核\
    \ CPU 以及相关的并行处理能力。\n\n可用多个 CPU 为提高操作速度开启了新方法。愿意从头开始设计进程的人可以识别可以独立完成的程序任务，并重写程序以并行执行这些任务，从而大大缩短完成整个程序所需的时钟时间。正如你想象的，这大大增加了编写软件的复杂性，但可以提供巨大的速度提升。这正是\
    \ DS2 设计运行的世界。\n\n## 6.3 DS2 线程程序\n\n### 6.3.1 编写 DS2 线程程序\n\nDS2 线程是可以并行执行的存储程序。它们在某些方面与数据程序相似，因为它们必须至少包含一个显式系统方法（INIT、RUN\
    \ 或 TERM），这些方法可以声明影响 PDV 的局部和全局变量，并可以实例化和使用包。\n\n线程也与包相似：它们以加密源代码的形式存储在 SAS 库中，并包含用户自定义的方法。线程可以接受参数，但与包不同，包不使用用户定义的构造方法，因此在实例化时不接受参数。相反，参数值是通过\
    \ SETPARMS 方法设置的，对于包来说，该方法必须在使用 SET 语句执行线程之前调用。与包一样，参数变量对于线程程序是私有的，但在线程内部是全局可用的。\n\
    \n让我们编写第一个线程程序并查看结果。\n\n```\nproc ds2;\nthread work.myThread(double flag)/overwrite=y;\n\
    \tdcl int ThreadNo;\n\tdcl int Count;\n\tmethod run();\n\t\tset crs.banks;\n\t\
    \tcount+1;\n\t\tend;\n\tmethod term();\n\t\treadThreadNo=_threadid;\n\t\tput ThreadNo=;\n\
    \t\tend;\n;\n```\n\n要执行线程，我们必须首先在数据程序中声明实例。由于线程需要参数，我们会在使用 SET 语句执行线程之前调用 SETPARMS\
    \ 方法。THREADS=3 选项将导致三个线程副本并行执行。\n\n```\ndata null;\n  decl thread work.myThread;\n\
    \  method init();\n    t.setparms(1);\n  end;\n  method run();\n    set from t\
    \ threads=3;\n  end;\n  method term();\n    put 'DATA Program: ';\n    put _all_;\n\
    \    put;\n  end;\nenddata;\n```\n\nSAS 日志：\n\nThreadNo=0 Count=3\nThreadNo=1\
    \ Count=0\nThreadNo=2 Count=0\nDATA Program:\nNAME-National Savings and Trust\
    \ Count=3 N=4 RATE=0.0328\n\n日志显示线程变量 flag 在线程中可用但在数据程序中不可用。线程的全局变量 ThreadNoCount出现在数据程序的\
    \ PDV 中，这可能会引起困惑。Count 是使用 SUM 语句创建的，其值保留在 PDV 中。因此，当数据程序 TERM 方法执行时，Count 仍在那里，但\
    \ ThreadNo 已初始化为空，尽管 n_ 是 4！在这种情况下，在线程中删除 ThreadNo 和 Count 可能是更好的主意，因为我们实际上在输出结果集中不需要它们。\n\
    \n图 6.1：查看存储线程的内容\n\n| SAS_ROWID | SAS_CHECKSUM | SAS_THREAD_ |\n|---|---|---|\n\
    | 1 | 1612651414 | DATA_STEP |\n| 2 | 6098763580 | |\n| 3 | 2952693555 | |\n|\
    \ 4 | 4229265544 | BIAREU |\n| 5 | 6668155542 | GWKDSW |\n| 6 | 9208283724 | JTQ4FR\
    \ |\n\n"
