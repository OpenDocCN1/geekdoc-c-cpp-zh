    \n- 当前时间\n- 协调世界时 (UTC)\n- 时区 ID\n- 时区名称\n- 针对特定本地时间相对于 UTC 的偏移量\n- 针对特定 UTC 时间相对于本地时间的偏移量\n\
    \nTZ 包处理并返回 DOUBLE 类型的 SAS 日期、时间以及日期时间值。\n\n### 5.7.1.1 声明、实例化和使用 TZ 包\n\n一旦实例化，即可使用包方法来获取时间信息。作为一个快速示例，该程序使用了两个\
