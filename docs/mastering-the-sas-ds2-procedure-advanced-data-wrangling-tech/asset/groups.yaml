    # Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    missing values when computing statistics. Figure 3.7 demonstrates that running
    a PROC MEANS analysis of the survey data produces the results for data stored
    as SAS data sets with special missing values and data stored in DBMS tables with
    null values:


    **Figure 3.7: PROC MEANS Results**


    | Analysis of SAS survey data | Analysis of Database survey data |

    | :--- | :--- |

    | Analysis Variable: Salary | Analysis Variable: Salary |

    | Minimum Mean Median Maximum Std Dev | Minimum Mean Median Maximum Std Dev |

    | 19603 34783 34806 50870 4896 | 19603 34783 34806 50870 4896 |


    Executing FREQ against salary values in SAS provides significant information about
    why the values are missing. The same code executed against database data provides
    no information at all, because all missing values are stored as null in the database.
    I think of null as an black hole-no what you put into a null, no information comes
    out. Figure 3.8 demonstrates that PROC FREQ analysis of the SAS data containing
    special missing values can help us determine which data items are missing, but
    the same analysis on data stored in a DBMS gives no information about why the
    data was missing because all missing values must be stored as a null in DBMS.


    **Figure 3.8: PROC FREQ Results Using Custom Formats**


    *Formatted Frequencies of SAS Salary Values | Formatted Frequencies of Database
    Salary Values*


    | Salary Frequency | Percent | Salary Frequency | Percent |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | clueless | 1 | 0.1 | missing | 42 | 4.2 |

    | forget | 10 | 1.0 | obtained | 958 | 9.8 |

    | refused | 31 | 3.1 | | | |

    | obtained | 95 | 9.8 | | |


    The concepts of null and missing are so fundamental to how data is processed and
    so radically different from each other, PROC DS2 actually has two separate operating
    modes on which concept for handling nonexistent data is given: SAS mode and ANSI
    mode. But I launch into a detailed description of missing null, I want to make
    clear that, in DS2, only those data types that are available in Base SAS DATA
    step and DS2 programs (DOUBLE and CHAR) are capable of containing missing values.
    Variables of any other data type are strictly ANSI in their behavior. They will
    always contain null when assigned a nonexistent value.


    # 3.3.42 PROC DS2 SAS Mode


    SAS mode is the default mode for PROC DS2, and thus it is never specified in the
    PROC DS2 statement. In SAS mode, expressions resolving to an unknown value produce
    SAS missing values as an intermediate result. When those are assigned to CHAR
    or DOUBLE variables, those variables will contain a SAS missing value.'
  - "[PAGE 63]\n\n# Chapter 3: DS2 Data Program Details\n\nHere are the other pertinent\
    \ rules for missing and null values while operating DS2 in SAS mode:\n\n+   1.\
    \ Missing values are automatically converted to null when assigned to a variable\
    \ of any data type other than CHAR or DOUBLE.\n2. Other times when null values\
    \ are automatically converted to missing:\n   a. used in expressions containing\
    \ CHAR or DOUBLE values\n   b. when assigned to a CHAR or DOUBLE type variable\n\
    \   c. when passed to a Base SAS function as a parameter value\n\n+   3. In expressions\
    \ comparing a character value to a single blank, the single blank is interpreted\
    \ as a SAS character missing value.\n\nExecuting program Ch3.3.4.2.sas demonstrates\
    \ the handling of SAS missing and ANSI null values in PROC DS2 operating in SAS\
    \ mode.\n\nSAS Log:\n\n```\n*** From SAS Data Set ***\n*** DS2 CHAR Values - SAS\
    \ Mode ***\nC is = ' \nmissing(C) is true.\nnull(C) is not true.\n\n*** DS2 DOUBLE\
    \ Values - SAS Mode***\nN is = ' \nmissing(N) is true.\nnull(N) is not true.\n\
    \n*** SAS Mode Using ANSI VARCHAR and Decimal Variables ***\n*** DS2 VARCHAR Values\
    \ ***\nVar is not = ' '\nmissing(Var) is true.\nnull(Var) is not true.\n\n***\
    \ DS2 DECIMAL Values ***\nDec is = ' \nmissing(Dec) is true.\nnull(Dec) is not\
    \ true.\n```\n\nNote that the CHAR and DOUBLE values behave just as you would\
    \ expect-both evaluate as to the constant missing representation, the Base SAS\
    \ MISSING function evaluates them both as missing, and the DS2 NULL function sees\
    \ them both as null.\n\nVARCHAR null values are not equal to the constant missing\
    \ value, the Base SAS MISSING function returns TRUE. This is because all null\
    \ values are automatically transformed to missing before being passed to a Base\
    \ SAS function. As expected, the DS2 NULL function evaluates VARCHAR as null.\n\
    \nDECIMAL null values are equal to the constant missing value, are evaluated as\
    \ missing by the SAS MISSING function for the reasons previously stated, and evaluated\
    \ as null by the DS2 NULL function."
