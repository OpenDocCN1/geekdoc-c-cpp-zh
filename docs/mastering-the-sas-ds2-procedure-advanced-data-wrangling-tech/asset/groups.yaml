    \ this. So, JSON package to the rescue!\n\n## 5.4.3 JSON Package Specifications\n\
    \nThe JSON package provides an interface to create and parse JSON text. The names\
    \ of the methods used to process JSON text all with the prefix WRITE and are generally\
    \ referred to as JSON package WRITE methods accurately calculate requests in memory.\
    \ The generated JSON can be retrieved into text variables. This could be useful\
