    # 4.2 Diving into User-Defined Methods


    # 4.2.1 Overview


    User-defined methods are named code blocks in a DS2 program that execute only
    when called. Methods that produce values can be designed to deliver those values
    in one of two ways: the method can either perform like a Base SAS function, returning
    a single value to the calling process, or it can perform like a Base SAS routine,
    modifying one or more values at the call site. User-defined methods for one-time
    use can be easily written inline in DS2 data or thread programs and called from
    one of the program''s system blocks.


    # 4.2.2 Designing a User-defined Method


    Methods are a great tool for standardizing processes in your code. Let''s take
    a simple interest calculation as an example. Here is how a bank could calculate
    the accumulated interest for my account after one year:


    ```

    Amount=SUM(Amount, Amount*Rate);

    ```


    To calculate the amount over several years, it''s possible to execute the formula
    in a DO loop:


    ```

    do i=1 to Years;

    Amount=SUM(Amount, Amount*Rate);

    end;

    ```


    # 4.2.2.1 Method Design Considerations


    To create a method to perform interest calculations, we must first decide how
    want to pass the calculated interest value back to our calling process. Because
    there is only one value involved, we choose to return a value or modify one of
    the method''s parameters at the call site by defining an IN_OUT parameter. Each
    method has pros and cons. A method that returns a value is the most flexible when
    called. When parameters are passed by value (there are no IN_OUT parameters),
    each parameter value can be performed at execution time with constant, a variable
    reference, or an expression. A method that modifies the values of its parameters
    at the call site must pass in the values of the IN_OUT parameters by reference.
    When called, all IN_OUT parameter values must be returned using variable names.
    Because the method results must be returned directly by modifying the IN_OUT parameter,
    using constants or complex expressions will produce a syntax error.


    # 4.2.2.2 The Interest Method - V1.0


    Let''s make version 1.0 of our method using an IN_OUT parameter to provide the
    initial amount invested and to hold the resulting total after the interest has
    been compounded.


    ```

    proc ds2;

    title ''Results for each bank - initial $5,000 deposit'';ndata;

    dcl double Total having format dollar10.2;

    dcl int Duration;

    keep total duration bank rate;

    ```'
