    \ |\n\n## 3.3.4 处理 SAS 缺失值和 ANSI 空值\n\nSAS 缺失值（missing values）和 ANSI 空值（null values）是数据存储中未知值的两种完全不同的表示。ANSI\
    \ 空值实际上没有值：当变量的实际值未知时，存储的是零。因此，无法对该未知值得出任何结论。所以，空值就是一个未知值。\n\nSAS 对缺失数据采取了不同的方法。它在每个实际值未知的变量中为缺失值存储了特殊代码。虽然该变量的实际值未知，但\
    \ MISSING 本身是某种程度的已知值。SAS 中有三种类型的缺失：\n\n-   字符型缺失：在报告中显示时为空格 (' ') \n-   数值型缺失：在报告中显示时用点号\
