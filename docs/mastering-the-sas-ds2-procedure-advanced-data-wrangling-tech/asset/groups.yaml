    \ 函数返回 `TRUE`，但这是因为空值在传递给 Base SAS 空函数时被自动转换为了缺失。\n\n## 3.4 核心概念回顾\n\n- “六个细微的差异”\n\
    \    - 所有可执行语句必须是方法代码块的一部分。\n    - DS2 程序默认不会覆盖数据。\n    - 所有未通过 `SET` 语句引入的变量都必须声明。\n\
    \    - `PUT` 语句不支持光标行指针。\n    - 关键字是保留字。\n    - DS2 使用 ANSI SQL 引用标准：\n      \
    \  - 单引号界定文本常量。\n        - 双引号界定标识符。\n    - 使用 `%TSLSIT` 解析字面量中的宏变量值。\n- DS2 “缺失”功能\n\
    \    - 许多“缺失”功能并不缺失——它们只是在 DS2 中的实现方式不同：\n        - 没有 `WHERE` 语句，但 `SET` 语句接受可能包含\
    \ `WHERE` 子句的 SQL 查询结果。\n        - 没有 `UPDATE` 或 `MODIFY` 语句，但这种行为可以通过 `SET` 语句中的\
    \ SQL 查询来模拟。\n- 传统的 SAS DATA 步骤（读取原始数据、控制 SAS 环境或执行任意系统命令）在 DS2 中是不被支持的。\n- DS2\
    \ 原生处理多种 ANSI 数据类型。由于此，自动数据类型转换会频繁发生。每当数值表达式中涉及 DOUBLE 值时，所有其他值都将转换为 `DOUBLE`\
    \ 进行处理，如果涉及 `BIGINT` 或 `DECIMAL` 值，可能会丢失某些精度。\n- DS2 提供了函数，用于在 ANSI TIMESTAMP、DATE\
    \ 和 TIME 与 SAS DATETIME、DATE 和 TIME 值之间进行显式转换。\n- SAS 缺失值和 ANSI 空值是表达未知数据的两种本质不同的方式。DS2\
    \ 有两种模式：SAS 模式和 ANSI 模式，允许你选择默认的处理范式。只要理解了转换行为，ANSI 空值和 SAS 缺失值可以在同一个程序中成功处理。\n\
    \n## 第 4 章：用户定义方法与包\n\n4.1 引言 ............................................................................................................\
    \ 51\n\n4.2 深入研究用户定义方法 ........................................................................\
    \ 52\n\n4.2.1 概述 ............................................................................................\
