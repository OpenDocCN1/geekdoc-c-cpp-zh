  mdcn: "\n\n## 3.2.2.3 所有未通过 SET 语句引入的变量都应当声明\n\n默认情况下，未声明新变量会导致 SAS 日志产生警告。这种行为可以通过\
    \ SAS 系统选项 `DS2COND` 进行全局控制。可以使用 `PROC DS2 SCOND` 为特定的 DS2 实例覆盖该系统选项。\n\n表 3.1：DS2SCOND\
    \ 和 SCOND 选项值及其影响\n\n| 选项设置 | 对未声明变量的影响 |\n|---|---|\n| NONE | 程序正常编译并执行。日志中无条目。\
    \ |\n| NOTE | 程序正常编译并执行。每个声明的变量会在 SAS 日志中生成备注。 |\n| WARNING (默认) | 程序正常编译并执行。每个声明的变量会在\
    \ SAS 日志中生成警告。 |\n| ERROR | 每个声明的变量都会在 SAS 日志中生成错误。程序无法编译和执行。 |\n\n以下是将系统选项 `DS2SCOND`\
    \ 设置为 `ERROR` 的示例：\n\n```\noptions ds2cond=ERROR;\nproc ds2;\ndata _null;\nmethod\
    \ run();\nText='Hello, world';\nx=1;\nput Text= X=;\nend;\nddata;\nrun;\nquit;\n\
    ```\n\nSAS 日志：\n\n```\nERROR: Compilation error.\nERROR: Line 92: No DECLARE for\
    \ assigned-to variable text; creating it as a global variable of type char.\n\
    ERROR: Line 93: No DECLARE for assigned-to variable x; creating it as a global\
    \ variable of type double.\n\nNOTE: The SAS stopped processing this step because\
    \ of errors.\n```\n\n以下是使用 `PROC DS2` 选项 `COND` 覆盖系统选项的示例：\n\n```\noptions ds2cond=ERROR;\n\
    proc ds2 scond=NONE;\ndata _null;\nmethod run();\nText='Hello, world';\nX=1;\n\
    put Text= X=;\nenddata;\nrun;\nquit;\n```\n\nSAS 日志：\n\n```\nText=Hello, world\n\
    NOTE: Execution succeeded. No rows affected.\n```\n\n## 3.2.2.4 PUT 语句不支持光标和指针\n\
    \n此 Base SAS DATA 步使用光标控制符 (@) 和换行符 (/) 在日志中写入组织整齐的信息：\n\n```\ndata_null;\nText='Hello,\
    \ world';\nX=1;\nput @7 Text = /7 X =;\n```\n\nSAS 日志：\n\n```\nText=Hello, world\n\
    X=1\nNOTE: DATA statement used (Total process time):\nreal time 0.00 seconds\n\
    cpu time 0.01 second\n```\n\n然而，相同的代码在 DS2 中会产生语法错误，因为 DS2 中的 `PUT` 语句不接受光标和行控制：\n\
    \n```\nproc ds2;\ndata_null;\nmethod run();\nText='Hello, world';\nX=1;\nput @6\
    \ Text = / @6 X=;\nenddata;\nrun;\nquit;\n```\n\nSAS 日志：\n\n```\nERROR: Compilation\
    \ error.\nERROR: Parse encountered invalid character when expecting '';\nERROR:\
    \ Line 212: Parse failed: put >>> <<< 6 Text = / @6 X=;\nNOTE: The SAS System\
    \ stopped processing this step because of errors.\n```\n\n## 3.2.2.5 关键字是保留字\n\
    \nBase SAS DATA 步语言的保留字非常少。编译器通过检查上下文来决定关键字应被解释为代码还是标识符。例如，将数据集命名为 `Data` 或将变量命名为\
    \ `Character` 是完全允许的：\n\n```\ndata Data;\nCharacter='A';\nput 'The character is\
    \ ' Character;\nrun;\n```\n\nSAS 日志：The character is A\n\n然而，相同的代码在 DS2 中会产生语法错误，因为\
    \ DS2 的所有关键字都是保留字：\n\n```\nproc ds2;\ndata Data/overwrite=yes;\ndcl char(1) Character;\n\
    method run();\nCharacter='A';\nput 'The character is ' Character;\nend;\nenddata;\n\
    run;\nquit;\n```\n\nSAS 日志：ERROR: Compilation error.\nERROR: Parse encountered\
    \ DATA when expecting ';';\nERROR: Line 457: Parse failed: data >>> Data << /overwrite=yes;\n\
    \nThe SAS System stopped processing this step because of errors.\n\n遵循 ANSI SQL\
    \ 标准，只有在用双引号括起关键字时，你才能将其作为标识符：\n\n```\nproc ds2;\ndata \"Data\"/overwrite=yes;\n\
    dcl char(1) \"Character\"\nmethod run();\n\"Character\"='A';\nput 'The character\
    \ is ' \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS 日志：The character\
    \ is A\nNOTE: Execution succeeded. One row affected.\n\n## 3.2.2.6 DS2 使用 ANSI\
    \ SQL 引用标准\n\n在 DS2 中，双引号仅用于界定标识符。单引号则用于界定\n\n```\nproc ds2;\ndata _null;\ndcl\
    \ char(25) \"Character\";\nmethod run();\n  \"Character\"='This is the message.';\n\
    \  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS 日志：This is the\
    \ message.\nNOTE: Execution succeeded. No rows affected.\n\n当尝试解析作为宏变量全部或部分时，这一要求可能会产生问题...\n\
    \n"
