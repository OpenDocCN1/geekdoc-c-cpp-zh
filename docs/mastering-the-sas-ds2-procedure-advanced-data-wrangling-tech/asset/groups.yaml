    \ | 5 | 365 | National Savings and Trust | 0.0328 |\n\n# 4.3.3 Object-Oriented\
    \ Programming with DS2 Packages\n\nThe ultimate power of the DS2 package comes\
    \ from using it to enable object-oriented application design. In object-oriented\
    \ programming, software objects can be used to model real-world objects, and existing\
