  - '[PAGE 115]


    # Chapter 5: Predefined Packages 99


    interrogating the rows returned by the query. Because the SQLSTMT instance prepares
    and stores the FedSQL statement in the database, the instance can efficiently
    execute the statement multiple times.


    # 5.6.1.1 Declaring, Instantiating, and Using an SQLSTMT Package


    At instantiation, the SQLSTMT package can accept either one or two parameters.
    The first parameter is required and defines the query that the package will execute.


    ```

    dcl package sqlstmt drop (''drop crs.new_prices'');

    ```


    The SQLSTMT query may be dynamic by inserting question marks (?) as placeholders
    indicating where PDV variables will be inserted when the query is executed. Dynamic
    queries require a second parameter that provides the ordered list of PDV variables
    that will supply the placeholders when the query is executed. The SQL statement
    will be built and customized dynamically when the DS2 program calls the EXECUTE
    command.


    ```

    dcl package sqlstmt upd

    (''update crs_db.prices set Price=? where Product_ID=?''

    , [Price Product_ID]);

    ```


    The code in the first SQLSTMT package parameter is checked for correct syntax
    when the package is instantiated. You might want to create a table inside a data
    program and query that with the SQLSTMT later in the same data program. Because
    the table does not exist at compile time, syntax of the SQLSTMT package code at
    compile time would produce syntax errors, and the code would not execute.


    You can circumvent this by declaring the SQLSTMT package at compile time and instantiating
    it at execution using the _NEW_operator, as we discussed in the previous section
    with the matrix package.


    ```

    dcl package sqlstmt make;

    dcl package sqlstmt apnd;

    method init() (

    make=NEW_sqlstmt (

    ''create table work.dates (DTM double, DT double,T double)'')

    make.execute();

    apnd=NEW_sqlstmt (

    ''insert into work.dates(DTM,DT,T) VALUES (?,?,?)''

    ,[SAS Datetime SAS Date SAS Time]);

    end;

    ```'
