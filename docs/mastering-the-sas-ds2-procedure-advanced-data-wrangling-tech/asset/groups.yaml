    # 5.3.3 Hash Iterator Package Example


    The hash iterator enables you to retrieve data from a hash object in forward or
    reverse key order. In this example, we will use two hash objects—one for price
    information and the other for product informationand a hash iterator on the price
    object. The hash iterator methods that we will use are FIRST, NEXT, LAST, and
    PREV, allow us to retrieve the first, next, last, and previous records from the
    hash object that is associated with the hash iterator. Methods all produce a zero
    return code, indicating successful execution.


    # 5.3.3.1 Using Hash Objects and a Hash Iterator Object to Look Up Values in Data
    Sets


    The crs.pricelist dataset contains the product ID and pricing information for
    all products. The crs.productlist dataset contains the product ID and descriptive
    information for all products. We will declare one hash object for each of those
    data sets.


    ```

    dcl package hash prod([Product_ID], [ProductName],1

    ''crs.productlist'',''a'');

    dcl package hash price([UnitsSalesPrice], [Product_ID UnitsSalesPrice]

    ,''crs.pricelist'',''a'');

    ```'
  - '[PAGE 96]


    We will also declare a hash iterator to access the price hash object in both forward
    and

    reverse order:


    ```

    dcl package hash prod([Product_ID],[ProductName],1

    ,''crs.productlist'',''a'');

    dcl package hash price([UnitSalesPrice],[Product_ID UnitSalesPrice]

    ,l,''crs.pricelist'',''a'');

    dcl package hiter GetThe(''price'');

    ```


    Because all of our work with data sets will be done with hash objects, we will
    have to explicitly

    control flow and row output. This can be done from any system method in the data
    program, so

    I have chosen to use the INIT method:


    ```

    proc ds2;

    title "Lowest and Higest Cost Products"

    data;

    dcl bigint Product_ID;

    dcl varchar(55) ProductName Ranking;

    dcl decimal(10,2) UnitSalesPrice;

    dcl package hash prod([Product_ID],[ProductName],1

    ,''crs.productlist'',''a'');

    dcl package hash price([UnitSalesPrice],[Product_ID

    UnitSalesPrice]);

    ,''crs.pricelist'',''a'');

    dcl package hiter GetThe(''price'');

    method init(rc);

    dcl int rc;

    Ranking=''Lowest Cost'';

    GetThe.first();

    rc=prod.find();

    output;

    Ranking=''Second Lowest Cost'';

    GetThe.next();

    rc=prod.find();

    output;

    Ranking=''Second Highest Cost'';

    GetThe.last();

    GetThe.prev();

    rc=prod.find();

    output;

    Ranking=''Highest Cost'';

    GetThe.last();

    rc=prod.find();

    output;

    end;

    data;

    run;

    quit;

    title;

    ```'
