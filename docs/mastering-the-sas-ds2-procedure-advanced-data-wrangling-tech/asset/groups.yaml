    ## 5.6.2 SQLSTMT 包示例


    在我的真实 SAS 经验中，我一直对 SAS/ACCESS 引擎提供的灵活性感到惊叹。无论数据源是什么，都能使用我已经掌握的强大的 SAS 语言工具来处理几乎任何数据，而无需为每个数据源学习新语言，这种感觉太令人兴奋了！但能力越大，责任越大——使用
    `LIBNAME` 语句在同一个过程中管理来自优秀数据源的数据凸显了这一原则！这些跨库操作要求所有数据存在于同一个平台上才能进行。在我职业生涯早期，这通常意味着需要将巨大的数据集从
    DBMS 系统提取到同一平台进行处理。这导致简单的进程运行非常长时间，除了让我失去不耐外，还激怒了对所有项目成功至关重要的“神灵”——DBA 和 SYSADMIN。我很快学会了寻求帮助，并主动在
    DBMS 中创建数据副本以解决这些问题。在 ANSI SQL 环境中，这带来了另一个长时间运行的问题：为了更新第二个表中包含的数据中的值，需要一个相关子查询，而该查询似乎会永远运行无止。或者每个
    DBMS 提供了几个我们可以规避的复杂过程……你可以看到过程复杂性是如何迅速升级的！


    这个 `SQLSTMT` 包将使用另一个库中较小表中的值来更新大表中的数据。我们不需要在 DBMS 库中预先阶段 SAS 表的副本，也不需要使用相关子查询或其他复杂过程来高效运行。在例例中，两个表都在
    SAS 库中，因为我想练习使用 SAS University Edition，它不提供连接到 DBMS 的 SAS/ACCESS 接口。但我已经在 Teradata
    中对较大的表执行过类似的代码，且性能非常出色。


    ### 5.6.2.1 使用 SQLSTMT 包进行跨库表更新


    我们的示例使用了两个 `SQLSTMT` 实例：一个用于从更新表中读取新价格（我们将在数据程序的 `INIT` 方法中创建），另一个用于执行 `UPDATE`
    语句以修改主表 `cr.prices` 中的值。由于所有操作都使用 `SQLSTMT` 包完成，我们实际上可以使用 `DATA _NULL` 程序。然而，我决定在更新时创建一个审计数据集，以便我们对所做的更改保留永久记录，因此我们将使用一个产生输出的数据程序，并在处理过程中使用
    `OUTPUT` 语句来创建审计文件。以下是更新前数据的情况：


    图 5.16：使用 SQLMGMT 包更新前的数据样本


    #### 更新前


    | 行 | product_id | PRICE |

    |---|---|---|

    | 1 | 210200100009 | $34.70 |

    | 2 | 2220010012 | $58.70 |

    | 3 | 23010500006 | $8.40 |

    | 4 | 24010100366 | $16.30 |

    | 5 | 24050010039 | $34.50 |

    | 6 | 24080200063 | $36.90 |


    210200100009 和 24080200063 不应更新

    原始价格为 $34.70 和 $36.90


    我们将更新第二到第五行项目的值，而不修改第一和第六行的数据，以确保运行正常。以下是我们将用于更新数据的程序：


    ```sas

    proc ds2;

    data work.Price_Change_Audit /overwrite=;

    /* 存储值的全局变量 */

    declare double Changed format datetime.;

    declare char(15) Changed_By;

    retain Changed_By=''Student'';

    declare double Prod_ID format z12;

    declare double Original_Price Updated_Price format dollar8.;


    /* 实例化更新语句的 sqlmgmt 包 */

    /* 动态插入值的占位符 */

    /* 位置列表 */

    dcl sqlmgmt update(''update crs.db.prices set=? where Product_ID=?'',

    [Updated_Price, Prod_ID]);


    /* 实例化读取源数据的 sqlmgmt 包 */

    /* 在 INIT 方法中创建 SAS 表 */

    dcl sqlmgmt get_values;


    method init();

    Changed_By=''Student'';

    /* 创建更新大表的表 */

    sqlexec(''create table crs.new_prices as select

    Product_ID, Price, ROUND(Price*1.05,.01) as New_Price

    from crs.prices where Product_ID in (''210200100009'',''2220010012'',''23010500006'',''24010100366'',''24050010039''));


    method term();

    /* 实例化从表中获取值的 sqlstmt 包 */

    get_values=sqlstmt(''select product_ID,Price, New_Price from crs.new_prices'');

    /* 执行查询以获取插入的值 */

    get_values.execute();

    /* 将查询结果绑定到变量 */

    bind(Prod_ID, Original_Price, Updated_Price);

    /* 从结果集中获取行 - 如果成功则返回 0 */

    while (get_values.fetch() = 0);

    /* 执行更新语句 */

    update_me.execute();

    /* 向审计文件写入记录 */

    Changed_On=datetime();

    output;

    end;

    end;

    run;

    quit;

    ```


    从更新后的报告中，我们可以看到只有目标行被更新了。


    图 5.17：使用 SQLSTMT 包更新后 crs.Prices 的数据样本


    | 行 | product_id | PRICE |

    |---|---|---|

    | 1 | 210200100009 | $34.70 |

    | 2 | 2220010012 | $61.64 |

    | 3 | 23010050006 | $8.82 |

    | 4 | 24010110366 | $17.12 |

    | 5 | 24050010039 | $36.23 |

    | 6 | 24080200063 | $36.90 |


    210200100009 和 24080200063 不应更新

    原始价格为 $34.70 和 $36.90


    更新程序运行时，我们有一个 `PROC APPEND` 步骤，将此程序生成的审计信息添加到 `cors` 库中的主集中。从审计数据集生成的报告显示它包含了所做更改的良好记录。


    图 5.18：使用 SQLSTMT 包更新时产生的审计数据集


    #### 价格更改轨迹


    | 行 | Changed_On | Changed_By | Prod_ID | Original_Price | Updated_Price |

    |---|---|---|---|---|---|

    | 1 | 16JAN16:11:37:08 | Student | 22020100012 | $58.70 | $61.64 |

    | 2 | 16JAN16:11:37:08 | Student | 23010500006 | $8.40 | $8.82 |

    | 3 | 16JAN16:11:37:08 | Student | 24010010366 | $16.30 | $17.12 |

    | 4 | 16JAN16:11:37:08 | Student | 24050010039 | $34.50 | $36.23 |


    210200100009 24080020063 不应更新

    原始价格为 $34.70 和 $36.90


    程序的最后部分将值重置为原始值。因为包含要更新值的表已经存在，我们使用 `SET` 语句来读取用于更新的值。然而，我们仍然需要一个 `SQLSTMT` 包来读取大表中的值。由于我们现在使用
    `RUN` 方法来读取数据，因此不需要编写 `LOOP do` 来读取数据行，并且我们需要编写显式的 `OUTPUT` 语句，因为 `RUN` 方法的 `END`
    语句包含隐式输出。虽然这段代码仍然规避了常见的跨库问题，但编写和更新起来更加简单。


