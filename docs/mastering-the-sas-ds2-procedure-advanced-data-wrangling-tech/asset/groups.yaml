    \ |\n| 6 | 6450382472 | |\n| 7 | 9017327308 | VALUHYGTEDK31FTGUE55CAKS55RP.INJDOTGGUOMSTHLQ\
    \ |\n| 8 | 42215452817 | KMWSKWMQDBLLQUIFSHYTYORZBHFTYROWCZNASMMCC |\n| 9 | 2693584753\
    \ | MKDXQRAVUON6JVAHYODTSYXO5FBR32ZXHWNR36OFA2I |\n| 10 | 7120110423 | HFEUEIBVNF63CAET33IN3OAS57K33INOAS57K33\
    \ |\n| 11 | 2456580629 | GZJYTFT2WKYGJ32ZTDOVE7JHPDTUTXL4 |\n\n## 4.3.2 使用包中的方法\n\
    \n要使用包中的方法，你需要声明并实例化包的实例。当你声明包时，会给实例指定一个标识符。要使用包中的方法，只需使用点语法 `instance.method()`\
    \ 来调用它们。\n\n包通过 `DCL PACKAGE` 语句声明，并可以在编译时实例化——即同时声明和实例化。或者，也可以在运行时实例化——即先声明，然后在单独的可执行语句中实例化。这并不复杂。但如果包构造方法需要直到程序开始执行才能获得的信息，我们需要运行时实例化包，因为我们构建的包没有使用参数。稍后我们将看到一个示例。\n\
    \n这是一个使用我们在上一节中创建的包中的 `CONTENTS` 方法的程序：\n\n```\nproc ds2;\ndata _null;\n  /* Declare\
    \ and instantiate the package */\n  /* This instance's identifier is mm */\n \
    \ dcl package crs.MyMethods mm();\n  method init();\n    /* Execute contents method\
    \ from instance mm */\n    mm.contents();\n  end;\nrun;\n```\n\n此包包含以下方法：\n- contents()\n\
    - interest()\n\n源代码：\n\n接下来，我们将使用不带参数的 `interest` 方法版本来检索其语法：\n\n```\nproc ds2;\n\
    data _null;\n  dcl package crs.MyMethods mm();\n  method init();\n    mm.interest();\n\
    \  end;\nrun;\nquit;\n```\n\nSAS 日志：\n\nSyntax: interest(Amount,Rate,Years,Periods)>\n\
    Amount (double) - 原金\nRate (double) - 利率\nYears (int) - 年数\nPeriods (int) -每年复利周期（可选）\n\
    \n当未指定周期时，利息按年计算；返回复利后的总金额 (double)\n\n现在我们知道了语法，让我们使用 `interest` 方法来执行一些工作：\n\
    \n```\nproc ds2;\ntitle 'Results for each bank - initial $5000 deposit';\ntitle\
    \ 'compounding annually and daily ';data;\ndcl package cr.MyMethods mm();\ndcl\
    \ double Total;\ndcl int Periods;\nkeep Total Years bank;\nmethod run();\nYears=5;\n\
    Periods=1;\nTotal=mm.interest(5000,Rate,Years);\noutput;\nPeriods=365;\nTotal=mm.interest(5000,Rate,Years,Periods);\n\
    output;\nenddata;\nrun;\nquit;\ntitle;\n```\n\n## 图 4.5：使用包方法的 DS2 程序输出\n每个银行的结果——初始\
    \ $5,000 存款按每年和每日复利\n\n| | 年 | 银行 | |\n|---|---|---|---|\n| $5,847.20 | 5 | 1\
    \ | Carolina Bank and Trust | 0.318 |\n| $5,861.65 | 5 | 365 | Carolina Bank and\
    \ Trust | 0.318 |\n| $5,855.70 | 5 | 1 | Big Federal Credit Union | 0.321 |\n\
    | $5,870.45 | 5 | 365 | Big Federal Credit Union | 0.321 |\n| $5,875.59 | 5 |\
    \ 1 | National Savings and Trust | 0.328 |\n| $5,891.03 | 5 | 365 | National Savings\
    \ and Trust | 0.328 |\n\n## 4.3.3 使用 DS2 包进行面向对象编程\n\nDS2 包的最终威力在于利用它来实现面向对象的应用程序设计。在面向对象编程中，软件对象可以用于对现实世界对象建模，然后可以将现有对象组合起来建模其他更复杂的对象，而无需重写或重新测试现有对象的功能。这可以显著加快开发周期。对于那些想在\
    \ DS2 程序包上“更上一层楼”的人，我们将简要查看如何在 DS2 程序中使用包作为对象使用。\n\n你可以将包认为是一个“类”：包作为创建对象实例的模板，并包含了创建和销毁该实例所需的的方法、提供对象的行为（方法）以及跟踪对象的当前状态（私有全局变量）。例如，一个家用灯。灯有功能（方法），例如操作开关和它的状态——开启或关闭。在创建模拟灯的\
    \ DS2 包中，我们将编写方法来提供灯的功能，并创建包变量来跟踪灯的状态。\n\n虽然包不能包含自动执行的系统方法 INIT、RUN 和 TERM，但每个包都包含两个特殊方法：构造方法和析构方法。构造方法和析构方法不返回类型且不能返回值。\n\
    \n析构方法始终是 `DELETE`，由 DS2 包程序自动生成。当包终止（销毁）时，它会执行清理并将包释放回系统。你可以编写自己的 `DELETE` 方法来添加自定义例程。当包实例离开范围并销毁时，`DELETE`\
    \ 方法会自动执行。\n\n"
