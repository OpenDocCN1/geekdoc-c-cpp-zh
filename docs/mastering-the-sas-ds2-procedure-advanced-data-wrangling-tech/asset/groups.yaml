    \nIn a DS2 data program, variable scope plays one important role: only global\
    \ variables are included in the PDV, and only PDV variables are eligible to become\
    \ part of the data program result. You can explicitly remove global variables\
    \ from the program result set using DROP or KEEP statements. Variables with local\
    \ scope are not included in the PDV, so there is no need to drop them-they will\
    \ never appear in the program result set.\n\nFor example, in the following DS2\
    \ program, the variables Total and Count are declared globally and have global\
    \ scope. The variables Category and Amount are introduced via the SET statement\
    \ and also have global scope. All of these variables can be referenced in both\
    \ the RUN and TERM methods, and all are included in the program result set.\n\n\
    ```\nproc ds2;\ndata;\n  double Total Count;\n  method run();\n    set crs.one_day\
    \ (keep=(Payee Amount));\n    Total+Amount;\n    Count+1;\n  end;\n  method term();\n\
    \    put Total= Count=;\n  end;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n| Total=7230.5\
