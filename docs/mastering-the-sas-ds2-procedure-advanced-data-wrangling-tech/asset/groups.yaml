    \ |\n\n从 SAS 日志中，我们看到 ANSI 值的显示与报告中的显示不同。这是因为 ANSI 值在被 ODS 显示之前，已经转换为了 SAS DATETIME、DATE\
    \ 和 TIME 值并进行了格式化。\n\n## 3.3.3. TO DOUBLE 函数\n\nDOUBLE 函数接受单个 ANSI TIME、DATE 或\
