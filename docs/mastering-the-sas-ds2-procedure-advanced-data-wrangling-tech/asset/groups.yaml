    # 5.4 The HTTP and JSON Packages


    # 5.4.1 General


    For years I''ve used the FILENAME URL statement to access data from Internet-based
    application programming interfaces (APIs) in SAS. The data returned by an API
    was JavaScript Object Notation (JSON) format. As a format for data interchange,
    JSON is both easy for machines to parse and generate and easy for humans to read
    and write. It is based a subset of the JavaScript programming language and uses
    JavaScript syntax for describing data. SAS has had PROC JSON for quite some time,
    but it only writes JSON files, it don''t read them. Without SAS tools for parsing
    JSON, I became quite adept at writing DATA steps with complex string manipulation
    routines that provide the data I need from tags.


    When DS2 launched without any raw data tools, I was disappointed to think that
    I would not be able to access Internet APIs from DS2. I shouldn''t have been pessimistic!
    The SAS 9.4 ME Release in 2014 brought us the HTTP package, and I was back in
    bringing Internet APIs. By my absolute delight, in July of 2015 the SAS 9.4 M
    delivered the JSON package, and for the first time SAS had a native tool for both
    reading and parsing JSON.


    We''ll be using the API from Kiva.org for demo code. Kiva is a nonprofit organization
    with a mission to connect people to alleviate poverty throughout the world. Through
    their website (http://kiva.org), Kiva connects individuals to entrepreneurs in
    developing nations using a worldwide network of microfinance institutions. Individuals
    make small loans of $25 each. These funds are aggregated and then microfinance
    institutions manage all of the loans. This financing for very small businesses
    that would not normally have access to loans, opening up tremendous opportunity
    for our loan recipients. Fortunately for us, Kiva also provides an extensive API
    with excellent documentation provided at http://build.kiva.org, which we will
    use in our DS2 code examples. We will use the Kiva API to gather information about
    loans by female entrepreneurs in South America.


    Note: Here''s a little background about how I came to the HTTP and JSON package
    examples used in this book, and why I chose Kiva for the demo code in this book.
    As the son of Baptist missionaries, I was raised in northern Brazil. I came to
    the US to make up lost residency when I was 15 years old. Decades later, my ability
    to speak both Portuguese and English landed my first job with SAS, first working
    in Brazil, then in the Andean region of South America and the Caribbean. I eventually
    migrated to a post with SAS in the United States, but I still have many friends
    and contacts in South America. So I feel a deep connection with the people of
    that region, particularly for those struggling to lift themselves from extreme
    poverty. My research indicates that giving women a hand up is an excellent strategy'
