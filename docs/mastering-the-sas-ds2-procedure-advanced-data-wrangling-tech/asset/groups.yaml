    \n## 精通 SAS DS2 过程：高级数据处理技术\n\n## 5.5 矩阵包\n\n### 5.5.1 通用\n\n矩阵是排列好的数值或字符值的二维数组。矩阵包提供了许多\
    \ DS2 操作。数据可以从矩阵到数组，也可以从数组到矩阵。\n\n### 5.5.1.2 声明、实例化和加载矩阵\n\n矩阵可以在编译时实例化，但在运行时之前尚未加载。代码如下：\n\
    \n```sas\ndcl double a[2];\ndcl package m;\nmethod init();\n/* 加载值 */\na:=(1,\
    \ 9, 4, 16);\nend;\n```\n\n或者，可以使用 IN 方法稍后实例化并加载矩阵：\n\n```sas\ndcl double a[2];\n\
    dcl package m(2,2);\nmethod init();\n/* 加载值 */\na:=(1, 9, 4, 16);\nend;\n```\n\
    \n使用矩阵的 IN 方法从表中加载数据：\n\n```sas\ndata x;\nv1=1;v2=2;output;\nv1=4;v2=16;output;\n\
    run;\n```\n\n将行列获取变量：\n\n```sas\nproc sql noprint;\nselect nobs\ninto :rows :columns\n\
    from dictionary.tables\nwhere libname='WORK'\nand memename='X';\nquit;\n```\n\n\
    ```sas\nproc ds2;\ndata _null;\n  varray double a[2];\n  dcl package m(&rows,&columns)\n\
    \  method run();\n  /* 读取数据，从 varray 加载矩阵的每一行*/\n  set x;\n  m.append(a, _n);\n\
    enddata;\nrun;\n```\n\n### 5.5.1.3 操作矩阵值\n\n使用矩阵包可用的方法之一对矩阵进行操作。数据可以从矩阵移动到声明数组或变量数组。如果使用了变量数组，数据将加载到\
    \ PDV 变量并成为程序结果集的一部分。\n\n在以下示例中，值被加载到数组 `a`，数组 `a` 的元素值打印在 SAS 日志中。随后，使用 IN 方法从数组值填充矩阵。然后使用\
    \ TRANS 方法转置矩阵 `m`，并通过 TOARRAY 方法将其元素传回数组 `a`。数组 `a` 的元素再次写入 SAS 日志。最后，对矩阵 `m`\
