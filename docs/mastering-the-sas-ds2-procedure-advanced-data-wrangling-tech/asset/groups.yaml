    # 5.1 Introduction


    Chapter 4 introduced the concept of DS2 packages and how they can be used to extend
    the DS2 language and object-oriented architecture design. It should come as no
    surprise that the developers at SAS would choose packages as a means of providing
    new capabilities in DS2, especially when these capabilities are used as objects.
    Although each predefined DS2 package provides powerful new techniques for processing
    data, the packages available in your SAS session will depend on the release you
    are using, as shown in Table 5.1. In this chapter, we will delve into all of the
    predefined packages that are shipped with DS2 in the SAS 9.4M3 release.'
  - '[PAGE 86]


    # Table 5.1: DS2 Predefined Packages by SAS Release


    | Package | SAS Release | Purpose |

    | FCMP | SAS 9.4 M0 | Allows calling FCMP functions and subroutines from a DS2
    program. |

    | Hash | SAS 9.4 M0 | Enables you to use hash objects in your DS2 programs. Hash
    objects enable you to quickly and efficiently store, search, and retrieve data
    based on lookup keys. Hash records can also be easily manipulated, sorted, and
    saved to a table within a DS2 program. |

    | Hiter | SAS 9.4 M0 | Enables you to conduct iterative processing of the associated
    hash object in your DS2 program. You must declare the hash before declaring the
    associated hiter. |

    | HTTP | SAS 9.4 M2 | Provides an HTTP client with methods that allow you to access
    HTTP web services and capture the returned results in a DS2 program. |

    | JSON | SAS 9.4 M3 | Provides the methods necessary to parse and write JSON text
    and is quite handy for decoding results returned by the HTTP package. |

    | Logger | SAS 9.4 M0 | Provides methods to detect which SAS logging facility
    message levels are active in the current SAS session and to write messages at
    user-selected levels. This package is pretty simple to use but it does not currently
    produce output when operating in client/server mode. Therefore, it is not useful
    when programming in SAS Studio or SAS Enterprise Guide. For these reasons, there
    will not be a logger section in this book, but it is mentioned here so that we
    do not forget it exists. |

    | Matrix | SAS 9.4 M0 | Implements SAS/IM capabilities in DS2, providing powerful
    and flexible matrix programming tools. No licensing over Base SAS is required
    to use the matrix package. |

    | SQLSTMT | SAS 9.4 M0 | Provides methods for passing a dynamic FedSQL statement
    to a database for execution and for accessing any result rows produced without
    using a SET statement. |

    | TZ | SAS 9.4 M3 | Provides methods for facilitating the processing of local
    and international time and date values in a DS2 program. |'
  - "[PAGE 87]\n\n# 5.2 Executing FCMP Functions in DS2\n\n# 5.2.1 The FCMP Package\n\
    \nThe SAS Compiler procedure (PROC FCMP) enables you to create SAS functions and\
    \ CALL routines that can subsequently be used in other SAS or DATA steps. PROC\
    \ FCMP builds custom functions using DATA step-like syntax and stores the results\
    \ in a SAS data set. With the SAS data set, FCMP functions are grouped into “packages”\
    \ of related functions. These FCMP packages should not be confused with DS2 packages.\
    \ An FCMP package is a subset of the functions stored in a single SAS data set\
    \ containing FCMP functions. A DS2 package is entire to collect custom methods\
    \ and data types.\n\nWhen stored in a permanent SAS library, FCMP functions are\
    \ easily reusable in subsequent SAS programs as if they were native SAS functions\
    \ and CALL routines. After specifying the CMPLIB system option to identify the\
    \ FCMP data set for DS2, you can use FCMP functions in your SAS code as if they\
    \ were native SAS functions.\n\nFCMP functions are an excellent means of standardizing\
    \ and encapsulating programming methodologies across an enterprise, and mature\
    \ SAS shops who have invested significant time and effort in building them. It\
    \ would certainly be a shame if we were forced to expend extra resources for recreating\
    \ and maintaining those same functions as methods in DS2 packages.\n\nThe DS2\
    \ FCMP provides an easy, one-time means of creating a wrapper package for an existing\
    \ FCMP data set. The wrapper package can subsequently be used to execute the FCMP\
    \ functions transparently from a DS2 program, just as the custom functions were\
    \ actually DS2 methods. Modifications to the FCMP functions are immediately reflected\
    \ through the DS2 package without any additional maintenance.\n\n# 5.2.2 FCMP\
    \ Package Example\n\nLet’s build a couple of custom functions using PROC FCMP\
    \ and use them in a DS2 program. We’ll subsequently modify one of the PROC FCMP\
    \ functions, and then to check whether the modifications are automatically reflected\
    \ in our DS2 program without any further maintenance required.\n\n# 5.2.2.1 Creating\
    \ Custom Functions with PROC FCMP\n\nThe following FCMP step builds user-defined\
    \ functions:\n\n```\n/* Create the FCMP functions */\nproc fcmp outlib = crs.fcmp_functions.ourFuncs;\n\
    function ourGMP(GS, Cog);\n  /* Cross Margin %*/\n  return ((GS-Cog)/GS);\nendsub;\n\
    function forBE(GS, Fix, Units);\n  /* Break Even (Units) */\n  return (ceil(Fix/(GS/Units))-(Cog/Units)));\n\
    endsub;\nrun;\nquit;\n```\n\nA curious person (like me!) would be tempted to see\
    \ what is inside the SAS data set created by PROC FCMP. The data set contains\
    \ variables that indicate the names of the functions, statement"
