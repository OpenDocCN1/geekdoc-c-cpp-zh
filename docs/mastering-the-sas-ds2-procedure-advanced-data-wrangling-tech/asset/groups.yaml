  mdcn: "\n从日志也可以清楚看出，尽管启动了三个线程，但线程 1 和 2 并没有处理任何数据。因为 `cls.banks` 非常小，实际上只有一块数据，因此所有数据都发送到了线程\
    \ 0。线程 1 和 2 执行后并终止了，且没有处理任何数据。\n\n在 SAS 计算平台上使用具有真实大小的数据执行 DS2 时，我将该过程可视化了，如图\
    \ 6.2 所示。\n\n**图 6.2：SAS 计算平台上的 DS2 多线程处理**\n\n![](img/ef05c3db88dda150abd07414dd206d3f_129_0.png)\n\
    \n`SET` 语句会启动单个读取线程，将源数据分发到指定的线程数中。该单个读取线程确保每一行数据都不会被传递给多个一个线程。当每个线程完成对某行数据的计算后，会将结果返回给数据程序的\
    \ PDV。数据程序在单线程进程中处理该行并将其写入目标数据集。\n\n## 6.3.2 使用 DS2 线程进行并行数据处理\n\n当你考虑在 SAS 计算平台上对\
    \ DS2 使用多线程是否会提高性能时，请询问以下两个主要问题：\n\n- 该过程是 CPU 密集型的吗？如果过程是 I/O 密集型的，我们必须记住我们的进程只有一个读取线程，增加额外的线程可能会导致性能下降，而不是提高。\n\
    - 数据集是否足够大，能够产生多个可以分发到多个线程的数据块？即使过程是 CPU 密集型的，如果数据量小到所有数据都发送到单个计算线程，我们也不应该期望性能的提升。\n\
    \n我们拥有一个 DS2 程序包，其中包含一个评分方法和一个当前用于评分的 DS2 数据程序。我们被要求将其转换为线程进程。我们正在评分的数据集是 `cr.campaign`。\n\
    \n114 精通 SAS DS2 过程：高级数据处理技术\n\n让我们运行数据程序并检查日志，看看它可能是 CPU 密集型的：\n\n```sas\nproc\
    \ ds2;\ndata scored/overwrite=yes;\n dcl package crs.Scoring s;\n dcl double FinalScore;\n\
    \ dcl bigint Count;\n drop Count;\n keep id FinalScore;\n method run();\n  set\
    \ crs.campaign;\n /* 使用变量的值实例化 SCORING 包 */\nvariables = *;\n s= new;\ncrs.Scoring(IM_DemMedHomeValue,\
    \ IM_GiftAvgAll, IM_PromCntNall);\n /* 调用 SCORE 方法对数据评分 */\n s.Score(FinalScore);\n\
    \ Count=1;\nend;\nmethod term();\n  put 'The DATA step processed ' Count ' observations.';\n\
    enddata;\nrun;\nquit;\n```\n\n以下是 DS2 数据程序的 SAS 日志摘录：\n\n| DATA step processed\
    \ 10000 observations. |\n| NOTE: Execution succeeded. 10000 rows affected. |\n\
    | NOTE: PROCEDURE DS2 used (Total process time): |\n| real time 0.47 seconds |\
    \ cpu time 0.46 seconds |\n\n实际运行时间与 CPU 时间非常接近，所以该过程很可能是 CPU 密集型的。让我们将数据程序转换为线程，执行该线程并比较性能：\n\
    \n```sas\nproc ds2;\nthread ScoreIt / overwrite=yes;\n dcl package crs.Scoring\
    \ s;\n dcl double FinalScore;\n dcl bigint Count;\n drop Count;\n keep id FinalScore;\n\
    \ method run();\n  set crs.campaign;\n /* 使用输入值实例化 SCORING 包 */\ns=new_ crs.Scoring\n\
    \ (IM_DemMedHomeValue, IM_GiftAvgAll, IM_PromCntNall);\n /* 调用 SCORE 方法对数据评分 */\n\
    \ s.Score(FinalScore);\n Count=1;\nend;\n```\n\n第 6 章：DS2 中的并行处理\n\n```sas\nmethod\
    \ term();\nput 'Thread ' _threadid_ 'processed ' Count ' observations.';\nend;\n\
    endthread;\nrun;\nquit;\nproc ds2;\ndata scored_thread/overwrite=yes;\ndcl thread\
    \ ScoreIt th;\nmethod run();\n  set from th;\nend;\nenddata;\nrun;\nquit;\n```\n\
    \n以下是执行单线程程序的 DS2 数据程序的日志摘录：\n\nThread 0 processed 10000 observations.\nNOTE:\
    \ Execution succeeded. 10000 rows affected.\nNOTE: PROCEDURE DS2 used (Total process\
    \ time):\nreal time 0.45 seconds\ncpu time 0.46 seconds\n\n线程线程版本正在无错误运行，耗时与原始数据程序差不多。这是预料之中的，因为我们没有指定\
    \ `THREADS=`，所以程序是单线程运行的。我的笔记本电脑有四个核心，让我们用四个线程执行此操作，看看是否能提高性能。\n\n```sas\nproc\
    \ ds2;\ndata scored_threads/overwrite=yes;\ndcl thread ScoreIt th;\nmethod run();\n\
    \  set from th threads=4;\nend;\nenddata;\nrun;\n;\n```\n\n并行执行四个线程程序的 DS2 数据程序\
    \ 日志摘录：\n\nThread 3 processed 1634 observations.\nThread 0 processed 2314 observations.\n\
    Thread 2 processed 2492 observations.\nThread 1 processed 3560 observations.\n\
    NOTE: Execution succeeded. 10000 rows affected.\nNOTE: PROCEDURE DS2 used (Total\
    \ process time):\nreal time 0.23 seconds\ncpu time 0.56 seconds\n\n多线程版本也运行无错误，并且执行时间减少了一半！\n\
    \n## 6.4 DS2 与 SAS 数据库加速器\n\n### 6.4.1 在数据库中运行 DS2 程序\n\n无论你的 DS2 线程存储在何处，只要你为数据库许可了并配置了\
    \ SAS 数据库加速器，线程程序就可以发送到数据库中并在其中进行编译和执行。在 MPP 上运行线程程序的前景让你感到兴奋，你会喜欢在 Teradata 或\
    \ Hadoop 上，DS2 程序本身也可以在数据库中并行运行！这允许我们在利用 SAS 计算过程的力量和灵活性的同时，受益于数据库大规模并行处理的能力。在本书编写时，SAS\
    \ 数据库加速器适用于 Teradata、Hadoop 和 Greenplum。\n\n第 6 章：DS2 中的并行处理\n\n以下是在数据库中执行 DS2\
    \ 程序的 SAS 日志摘录：\n\n| NOTE: PROCEDURE DS2 used (Total process time): |\n| real\
    \ time 16.65 seconds |\n| cpu time 0.40 seconds |\n\n由于我的 SAS 服务器位于波士顿，而 Teradata\
    \ 服务器位于卡罗来纳，引入了一些额外的网络延迟，但如你所见，通过将过程移动到 Teradata 数据库，处理速度得到了巨大的提升。\n\n## 6.5 核心概念回顾\n\
    \n- 如果 SAS 日志报告该步骤的实际运行时间与 CPU 时间之间在 10% 以内，则该步骤可能是 CPU 密集型的。\n- 传统的 SAS DATA\
    \ 在单计算线程中顺序处理逐行数据。\n- 对每行数据进行大量计算的 DATA 很容易变成 CPU 密集型。\n- CPU 密集型的 DATA 如果转换为\
    \ DS2 在多个线程中执行，性能可能会更好。\n- SAS 数据库加速器适用于 Hadoop、Teradata 和 Greenplum。\n- 只要为数据库安装了\
    \ SAS 数据库加速器，DS2 线程程序就可以在数据库执行。对于 Hadoop 和 Teradata，DS2 数据程序也可以在数据库中执行。\n- 如果你的数据存储在安装了\
    \ SAS 数据库加速器的数据库中，即使是 I/O 密集型过程，如果转换为 DS2 THREADs 并在数据库中执行，执行速度也可能会显著提高。\n"
