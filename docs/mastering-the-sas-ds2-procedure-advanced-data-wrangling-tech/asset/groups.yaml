    # 3.2.3.5 COMMENT, LINK, and DELETE Statements


    There are many documented ways of writing comments in traditional base languages,
    but the DS2 documentation lists only /* * comments. Therefore, if you find you
    can “get away” with other styles, I''d recommend sticking with the documented
    style. LINK statements were used to process subroutine blocks of code and are
    not necessary in DS2: we have the more flexible and useful user-defined method.
    And if you are using the DELETE statement instead of the subsetting IF, you''ll
    be disappointed-only the subsetting IF works in DS2. All of this is in keeping
    with a design philosophy that I admire: if you already have a good way of doing
    something in a language, you shouldn''t spend a lot of resources creating other,
    similar processes. Use those resources to add new features!


    # 3.2.3.6 Traditional DATA Step Features from DS2


    Some traditional Base DATA step functionality is missing from DS2, but usually
    for very good reasons that could anticipate. For example, DS2 does not include
    any of these statements: FILE, INPUT, NODE, LIST, CARDS, and DATALINES. Because
    DS2 is built to manipulate structured data, it''s not surprising that these statements
    were designed for processing raw data are not included. And because DS2 executes
    in a process separate from the SAS process, statements that were used to control
    the SAS session, including DISPLAY, MB, ABORT, ENDAS, ERROR, DESCRIBE, and MISSING
    are also not found in the DS2 lexicon. Finally, statements that allow execution
    of arbitrary operating system commands, such as EXECUTE and X, will probably never
    become part of DS2. As DS2 is capable of executing in-database, the ability to
    execute arbitrary operating system commands represents an unacceptable risk to
    the host platform.


    And this concludes our comparison between the traditional DATA step language and
    DS2. Looking back. Now let''s dive into the new and exciting features and capabilities
    of the DS2 language!


    # 3.3 Data Types in DS2


    # 3.3.1 DS2 and ANSI Data Types


    Most SAS processes access database data via the SAS LIBNAME engine. When you are
    using a SAS/ACCESS interface engine to retrieve data from a database, all database
    data types are'
