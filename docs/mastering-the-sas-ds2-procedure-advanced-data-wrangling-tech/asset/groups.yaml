  mdcn: "\n\n# 第 2 章：DS2 语言简介 13\n\n系统方法会自动执行且不接受参数。你必须在数据或线程程序中显式地定义这些方法中的至少一个，否则程序将无法执行。你不需要为一个或多个系统方法块编写显式代码，DS2\
    \ 编译器将在编译时为你创建一个缺失的系统方法的空版本。空方法仅包含由 `END` 语句结束的适当的 `METHOD` 语句。\n\n## 2.2.5.1\
    \ `INIT` 方法\n\n`INIT` 方法在程序执行开始时立即执行，且执行且仅执行一次。它为执行程序初始化例程提供了一个标准位置。以下 DATA 步和\
    \ DS2 数据程序产生相同的结果，但 DS2 数据程序不需要任何条件逻辑：\n\nDATA 步：\n\n```\ndata _null;\nif _n=1\
    \ then do;\nput 'Execution is beginning';\nend;\n```\n\nDS2 数据程序：\n\n```\nproc\
    \ ds2;\ndata _null;\nmethod init();\nput 'Execution is beginning';\nend;\nendata;\n\
    run;\nquit;\n```\n\n## 2.2.5.2 `RUN` 方法\n\n`RUN` 方法模拟传统 SAS DATA 步的性能。它在 `INIT`\
    \ 方法执行完成后立即开始操作，并作为一个数据驱动的循环。`RUN` 方法为输入数据的每一行（观测值）迭代一次。`RUN` 方法是唯一在 `END` 语句中包含隐式输出的方法。DATA\
    \ 步和 DS2 数据程序产生的结果如下：\n\n```\ndata new_data;\nif _n=1 then do;\nput 'Execution\
    \ is beginning';\nend;\nset crs.one_day;\nrun;\n```\n\n```\nproc ds2;\ndata new_data;\n\
    method init();\nput 'Execution is beginning';\nend;\nmethod run();\nset crs.one_day;\n\
    end;\nenddata;\nrun;\nquit;\n```\n\n## 2.2.5.3 `TERM` 方法\n\n`TERM` 方法在 `RUN` 方法执行完成后、数据或线程程序终止执行之前立即执行，执行且仅执行一次。它为执行程序终结代码提供了一个合适的位置。此\
    \ DATA 步和 DS2 数据程序将产生相同的结果，但 DATA 步需要使用 `END=` 语句选项、关联的自动变量以及条件逻辑判断来完成不需要任何额外资源或代码的\
    \ DS2 数据程序：\n\n```\ndata new_data;\nif _n=1 then do\n  put 'Execution is beginning';\n\
    end;\nset crs.one_day end=last;\nif last=1 then do\n  put 'Execution is ending';\n\
    end;\n```\n\n```\nproc ds2;\ndata null;\nmethod init();\n  put 'Execution is beginning';\n\
    end;\nmethod run();\n  set crs.one_day;\nend;\nmethod term();\n  put 'Execution\
    \ is ending';\nend;\nenddata;\nrun;\nquit;\n```\n\n## 2.2.6 用户定义方法\n\n在 DS2 中，你可以轻松地定义和使用自己的可重用代码块。这些代码块被称为用户定义方法，它们可以通过引用或传值接受参数值。当所有参数都通过传值传递到方法时，这些值在方法内部可用并用于计算，且方法可以向调用过程返回一个单值——类似于\
    \ Base SAS 函数。此数据程序使用用户定义方法将温度从摄氏度转换为华氏度。\n\n```\nproc ds2;\n/* 无输出 DATA set。结果以报告形式（类似于\
    \ SQL）返回 */\ndata;\n  dcl double DegC DegF;\n  /* 方法返回值 */\nmethod c2f(double\
    \ Tc) returns double;\n/* 摄氏度转华氏度 */\nreturn ((Tc*9)/5+32);\nend;\nmethod init();\n\
    \  do DegC=0 to 30 by 15;\n  DegF=c2f(DegC);\nend;\n```\n\n"
