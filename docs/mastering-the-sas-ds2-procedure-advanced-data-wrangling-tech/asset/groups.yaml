    \ 5.1 所示。在本章中，我们将深入研究 SAS 9.4M3 版本中随 DS2 一带的所有预定义包。\n\n### 表 5.1：不同 SAS 版本的 DS2\
    \ 预定义包\n\n| 包 | SAS 版本 | 目的 |\n| :--- | :--- | :--- |\n| FCMP | SAS 9.4 M0 | 允许从\
    \ DS2 程序调用 FCMP 函数和子程序。 |\n| Hash | SAS 9.4 M0 | 允许你在 DS2 程序中使用 hash 对象。Hash 对象使你能够根据查找键快速、高效地存储、搜索和检索数据。Hash\
    \ 记录还可以在 DS2 程序中轻松地操作、排序并保存到表中。 |\n| Hiter | SAS 9.4 M0 | 允许你在 DS2 程序中对关联 hash\
    \ 对象进行迭代处理。你必须在声明关联的 hiter 之前声明 hash。 |\n| HTTP | SAS 9.4 M2 | 提供一个 HTTP 客户端，其方法允许你访问\
    \ HTTP Web 服务并在 DS2 程序中捕获返回的结果。 |\n| JSON | SAS 9.4 M3 | 提供解析和写入 JSON 文本所需的方法，对于解码\
    \ HTTP 包返回的结果非常有用。 |\n| Logger | SAS 9.4 M0 | 提供方法来检测当前 SAS 会话中哪些 SAS 日志设施消息级别，并按用户选择的级别写入消息。此包非常易用，但目前在客户端/服务器模式下运行时不会产生输出。因此，在\
    \ SAS Studio 或 SAS Enterprise Guide 中编程时它没有用。由于这些原因，书中将没有 logger 部分，但在此提到它是为了不忘记它的存在。\
    \ |\n| Matrix | SAS 9.4 M0 | 在 DS2 中实现 SAS/IM 能力，提供强大且灵活的矩阵编程工具。使用矩阵包不需要 Base\
    \ SAS 许可。 |\n| SQLSTMT | SAS 9.4 M0 | 提供方法将动态 FedSQL 语句传递到数据库执行，以便在不使用 SET 语句的情况下访问生成的任何结果行。\
    \ |\n| TZ | SAS 9.4 M3 | 提供方法方便 DS2 程序中本地时间和日期值进行处理。 |\n\n### 5.2 在 DS2 中执行 FCMP\
    \ 函数\n\n#### 5.2.1 FCMP 包\n\nSAS 编译过程 (PROC FCMP) 允许你创建 SAS 函数和 CALL 例程，这些程序可以在其他\
    \ SAS 或 DATA 步中使用。PROC FCMP 使用类似于 DATA 步的语法构建自定义函数，并将结果存储在数据集中。通过 SAS 数据集，FCMP\
    \ 函数被分组为相关函数的“包”。这些 FCMP 包不应与 DS2 包混淆。FCMP 包是存储在包含自定义方法和数据类型的单个数据集中的函数子集。当存储在持久\
    \ SAS 库中时，FCMP 函数可以在 SAS 程序中轻松重用，就像它们是原生函数一样。在指定 CMPLIB 选项来标识 FCMP 数据集后，你可以在 SAS\
    \ 代码中像使用原生函数一样使用 FCMP 函数。FCMP 函数是跨企业标准化和封装编程方法论的极佳手段，对于那些投入了大量精力和精力构建这些函数的成熟 SAS\
    \ 用户来说非常有利。PROC FCMP 提供了一种简单、一次性的方法为现有数据集创建包装器。该包装器随后可用于从 DS2 程序中透明地执行 FCMP 函数。对\
    \ FCMP 函数的修改会立即通过 DS2 反映，无需额外的维护。\n\n让我们使用 PROC FCMP 构建几个自定义函数并在 DS2 程序中使用它们，然后检查修改是否自动反映在我们的\
    \ DS2 程序中。 \n\n### 5.2.2 FCMP 包示例\n\n#### 5.2.2.1 使用 PROC FCMP 创建自定义函数\n\n以下 FCMP\
    \ 步创建了用户定义的函数：\n\n```sas\nproc fcmp outlib=crs.fcmp;\nfunction GMP(GS, Cog);\n\
    \  /* 毛利 */\n  return ((GS-Cog)/GS);\nendsub;\nfunction BE(GS, Fix, Units);\n\
    \  /* 平衡 */\n  return (Fix/(Units));\nendsub;\nquit;\n```\n\n一个好奇的人（比如我！）可能会想查看由\
    \ FCMP 创建的数据集。数据集包含了函数的名称、序列，以及一个用于执行 FCMP 函数所需的变量。默认情况下，这些信息是加密的。有了数据集，我们的下一个任务是像使用原生函数一样使用这些函数：\n\
    \n```sas\noptions cmplib=crs.fcmp;\n\ndata work.underperforming_base;\n  set crs.Sales_2014;\n\
    \  /* 使用 OBE 函数 */\n  breakEven=ourOBE(GrossSales,CostOfGoods,Fixed,Units);\n\
    \  if breakEven > units;\n  /* 使用自定义 GMP 函数 */\n  GrossMargin=ourGMP(GrossSales,CostOfGoods);\n\
    \  NetRevenue=GrossSales-CostOfGoods-Fixed;\n  format GrossMargin percent.7 NetRevenue\
    \ dollar.2;\n  label Units ='销量'\n        Product ID='产品 ID'\n        GrossMargin='毛利'\n\
    \        BreakEven='平衡 (销量)'\n        NetRevenue='净收入'\n        Fixed Costs='成本';\n\
    run;\n\ntitle \"销售不佳的项目 - 传统 SAS 步\";\nproc ...\n```\n\n图 5.1：在传统 SAS 步中使用 FCMP\
    \ 函数生成的报告\n\n| SupplierName | ProductName | Product ID | Units | GrossSales |\
    \ CostOfGoods | Fixed | Gross Margin | NetRevenue |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- |\n| Carolina Sports | Bat-5Py | 2404020003 | 10000\
    \ | 80600 | 1065 | 44197.2 | 51.6% | -2597.20 |\n| Nautilus SportsWear Inc | Capsy\
    \ Hood | 24010100031 | 5000 | 24050 | 7083 | 8450.0 | 64.9% | -6498.60 |\n| Top\
