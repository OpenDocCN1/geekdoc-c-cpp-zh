  mdcn: "\n\n# 40 精通 SAS DS2 过程：高级数据处理技术\n\n| 数据类型 | 类别 | 描述 |\n| --- | --- | ---\
    \ |\n| DECIMAL(p,s) | 精确小数型 | 用户定义精度和标度的带符号、精确、固定小数数值。精度 (p) 决定了有效数字的最大数量，最多为\
    \ 52 位。标度 (s) 决定了有效数字中有多少位保留给数值部分。NUMERIC(p,s) 是 DECIMAL 的别名。 |\n| BIGINT | 整数型\
    \ | 高达 19 位有效数字的带符号、精确数值。 |\n| INTEGER | 整数型 | 高达 10 位有效数字的带符号、精确数值。 |\n| SMALLINT\
    \ | 整数型 | 高达 5 位有效数字的带符号、精确数值。 |\n| TINYINT | 整数型 | -128 到 127 之间的单字节带符号、精确数值。\
    \ |\n| BINARY(n) | 二进制 | 固定长度二进制数据，$n =$ 为每行存储数据而分配的字节数。 |\n| VARBINARY(n) | 二进制\
    \ | 变长度二进制数据，仅使用存储数据每行中实际值所需的字节，最多为 $n$。 |\n| TIME | 时间 | 存储 ANSI 时间值。 |\n| DATE\
    \ | 日期 | 存储 ANSI 日期值。 |\n| TIMESTAMP | 日期时间 | 存储 ANSI 时间戳（datetime）值。 |\n\nANSI\
    \ TIME、DATE 和 TIMESTAMP 值不应与 SAS TIME、DATE 和 DATETIME 值混淆，因为后者都被存储为双精度浮点数，并需要遵循外部规则才能被正确解释。SAS\
    \ TIME 值实际上是表示午夜到所表示时间之间秒数的 SAS 数值。SAS DATE 值表示 1960 年 1 月 1 日到所表示日期之间的天数。SAS\
    \ DATETIME 值是自 1960 年 1 月 1 日午夜到所表示日期和时间之间的秒数的数值值。这些值与 ANSI DATE、TIME 和 TIMESTAMP\
    \ 值不能互换。\n\n## 3.3.2 自动数据类型转换\n\n在任何编程中，表达式中的所有值在表达式解析之前必须表现为相同数据类型的值。由于有 17 种不同的数据类型可用，你可以发现，DS2\
    \ 数据程序中自动数据类型转换发生的频率比传统的 SAS DATA 步高得多。因此，默认情况下，DS2 在发生自动数据类型转换时不会向 SAS 日志写入注释，这可能会使排查由数据类型转换引起的微妙问题变得有些困难。你可以通过在要调试的数据程序之前立即使用全局\
    \ DS2 语句 `DS2_OPTIONS TYPEWARN;` 来强制 DS2 在每次发生自动数据类型转换时写入日志。\n\n### 3.3.2.1 数据类型转换的时机\n\
    \n在 SAS 编程中，当数值值用于字符上下文中或字符值用于数值上下文中时，会发生自动数据类型转换。例如，将数值值作为 CATX 拼接函数的参数之一会导致数字转换为\
    \ BEST16 格式，生成的文本将以相同的方式使用。在数字上加上字符值会将文本转换为标准的 SAS 数值格式。如果自动转换不符合我们的需求，我们始终可以使用\
    \ `PUT` 和 `INPUT` 函数进行显式转换。由于 DS2 及其大量的数据类型，该过程将变得更加复杂。例如，如果给 DOUBLE 加一个整数值会发生什么？DS2\
    \ 文档中围绕各种情况下自动数据类型转换有长长的讨论，这些基于数据优先级的层次结构。事实是，我们主要关注数值转换。我使用以下在大多数情况下有效的“经验法则”：\n\
    \n- 1. 在 DS2 中，DOUBLE（Base SAS 数值）是王者之王。任何涉及 DOUBLE 或未声明变量的表达式都会产生 DOUBLE 结果。\n\
    \    - 未声明的数值变量始终是 DOUBLE。\n    - 任何涉及 DOUBLE 的表达式会导致所有数值值转换为 DOUBLE。在结合 DOUBLE\
    \ 处理 BIGINT 或 DECIMAL 值时，记住这一点很重要，因为可能会导致精度丢失。\n    - 文本值转换为数值会产生 DOUBLE 值。\n\
    \    - 传递给 Base SAS 函数的所有值在作为参数传递给函数之前如果有必要转换为 DOUBLE。\n\n- 2. 在不涉及 DOUBLE 的数值表达式中，所有值将转换为表达式中涉及的高精度数据类型。例如，如果你正在将\
    \ INTEGER 值与 BIGINT 相加，INTEGER 值将转换为 BIGINT，表达式解析并产生 BIGINT 值作为结果。\n\n- 3. 任何作为参数传递给\
    \ DS2 方法的值都将在方法定义时转换为该参数指定的类型。例如，`earlier` 期望单个 DOUBLE 值。如果 `c2f` 方法定义为 INTEGER，那么当我调用\
    \ `c2f(MyTemp)` 时，`MyTemp` 的值将在传递给 `c2f` 方法之前转换为 DOUBLE。\n\n### 3.3.2.2 排查自动类型转换问题\n\
    \n如你所见，自动数据类型转换在 DS2 处理过程中发生非常频繁。为了防止日志被数据转换注释淹没，DS2 程序不会在 SAS 日志中产生自动数据类型转换注释。可以使用\
    \ `DS2_OPTIONS TYPEWARN` 语句来排除由自动类型转换引起的问题。`DS2_OPTIONS` 设置仅对下一个程序有效，并且它们应该放置在\
    \ DS2 数据程序之前：\n\n```\nproc ds2;\nds2 options TYPEWARN;\n```\n\n![](img/ef05c3db88dda150abd07414dd206d3f_57_0.png)\n\
    \n```\ndata null;\ndcl decimal(52,5) Dec;\ndcl double SASNum;\ndcl char(5) SASChar;\n\
    method init();\nDec=12345678901234567890.9n;\nSASNum=1.1;\nSASChar='1.1';\nDec=Dec+SASChar;\n\
    put 'dec=' 'Dec=12345678901234567892.00000';\nput dec=;\nput ;\nDec=12345678901234567890.99999n;\n\
    Dec=Dec+SASNum;\nput 'dec=' 'Dec=12345678901234567892.00000';\nput dec=;\nput\
    \ ;\nend;\nrun;\n```\n\nSAS Log:\n```\ndec=12345678901234567892.00000\nDec=12345678901234567892.00000\n\
    dec=12345678901234567892.00000\nDec=12345678901234567892.00000\ndec\n12345678901234567892.00000\n\
    Dec=12345678901234567892.00000\ndec=12345678901234567892.00000\nDec=1234567890.\n\
    ```\n\n# 42 精通 SAS DS2 过程：高级数据处理技术\n\n"
