    \ |\n|---|---|---|\n| 1 | 121145 | $182.00 |\n| 2 | 121143 | $182.00 |\n| 3 |\
    \ 121142 | $182.00 |\n| 4 | 120791 | $156.00 |\n| 5 | 120660 | $130.00 |\n\n图\
    \ 3.2: DS2 数据程序生成的摘要数据集\n5 行摘要数据\n\n| 行号 | 部门 | Dept_Count | Dept_Total |\n|---|---|---|---|\n\
    | 1 | Sales | 45 | $1,966.50 |\n| 2 | IS | 11 | $949.00 |\n| 3 | Accounts | 11\
    \ | $695.00 |\n| 4 | Stock & Shipping | 9 | $624.00 |\n| 5 | Sales Management\
    \ | 4 | $598.00 |\n\n这比传统的 DATA 步语言有了巨大的改进！它为编写更紧凑、高效的程序开启了许多惊机会。值得注意的是，与 DS2\
    \ 结合使用的 SQL 并不是老老的 PROC SQL，而是基于更现代的 ANSI 1999 标准的新版本 SQL。你也可以在 DS2 程序之外使用新的 SQL\
    \ 查询——只需调用 PROC FedSQL 即可。在《SAS 9.4 FedSQL 语言参考》中，提供了关于 FedSQL 优秀且详尽的文档。\n\n##\
    \ 精通 SAS DS2 过程：高级数据处理技术\n\n### 3.2.3.2 UPDATE 和 MODIFY 语句\n\nDS2 既不包含 UPDATE\
    \ 语句也不包含 MODIFY 语句。你可以使用 SQLSTMT 包通过少量额外的代码来实现相同的效果。我们将在第 5 章讨论预定义包时向你展示更多内容。\n\
    \n### 3.2.3.3 ATTRIB, LABEL, LENGTH, FORMAT 和 INFORMAT 语句\n\n虽然 DS2 不包含 ATTRIB、LABEL、LENGTH、FORMAT\
    \ 和 INFORMAT 语句，但 DECLARE 语句的 HAVING 子句提供了相同的功能。由于这些每个语句都有自己的语法，我认为仅用一个语句就能完成所有事情是一项巨大的优势！\n\
    \n```sas\ndata test1;\n  length A $4;\n  attrib A=$UPCASE4;\n  format B comma10.2;\n\
    \  label A='Text (Test1)' B='Number (Test1)';\n  a='xx';\n  b=10000.00000;\nrun;\n\
    \nproc ds2;\n  data test2 /overwrite=yes;\n  dcl char(2) having $upcase4.label\
    \ 'Text (Test2)';\n  dcl double B having format comma10.2 label 'Number (Test2)';\n\
    \  method run();\n    a='xx';\n    b=10000.00000;\n  end;\nenddata;\nrun;\nquit;\n\
    ```\n\n图 3.3: 使用 DECLARE 语句 HAVING 子句指定格式和标签\n\n| Text (Test1) | Number (Test1)\
    \ | Text (Test2) | Number (Test2) |\n|---|---|---|---|\n| XX | 10,000.00 | XX\
    \ | 10,000.00 |\n\n### 3.2.3.4 ARRAY 语句\n\n我发现 DS2 不包含 ARRAY 语句也感到遗憾。然而，如果你考虑\
    \ DATA 步中的 ARRAY 语句，你可以清楚地看到，在传统的 SAS DATA 步中，ARRAY 语句用于产生两种不同的数组：元素引用 PDV 中变量的数组，以及元素存储在内存中不与变量关联的\
    \ *_TEMPORARY_*（临时）数组。DS2 同样提供了这两种数组类型，但它们通过不同的语句产生。临时数组通过 DECLARE 语句创建。引用 PDV\
    \ 元素的数组则通过 VAR 语句创建。\n\n```sas\ndata test1;\n  array N [5];\n  array C [5] _temporary_;\n\
    \  do i=1 to dim(N);\n    N[i]=dim(n);\n  end;\n  do i=1 to dim(C);\n    C[i]=BYTE(i+6);\n\
    \  end;\n  put all_;\nrun;\n\nproc ds2;\n  data test2 /overwrite=yes;\n  /* PDV\
    \ 变量数组 - N1-N5 */\n  array N [5];\n  /* 临时数组 - 元素不在 PDV 中 */\n  dcl char(1) C[5];\n\
    \  method run();\n    dcl integer i;\n    do i=1 to dim(n);\n      /* ... 逻辑继续\
    \ ... */ \n```\n\nDS2 数组同时具有特殊的数组赋值 (:=) 和引用元素的方法，设计用于简化你的编程。:= 运算符按位置将一个值列表分配给数组的相应元素，或将值从一个数组分配到另一个数组。\n\
    \n```sas\nproc ds2;\ndata;\n  /* PDV 变量数组 - N1-N5 */\n  array char(1) V[6];\n\
    \  /* 临时数组 - 元素不在 PDV 中 */\n  dcl char(1) T[2,3];\n  method init();\n    /* 将值列表分配给数组元素\
    \ */\n    V=('A','B','C','D','E','F');\n  end;\n  method run();\n    /* 将数组元素分配给数组\
    \ T */\n    T=V;\n    PUT T[*];\n    PUT V[*];\n  end;\nenddata;\nrun;\nquit;\n\
    ```\n\nSAS Log：\n\n```\nT[1,1]=A T[1,2]=B T[1,3]=C T[1,4]=D T[2,2]=E T[2,3]=F\n\
    V[1]=A V[2]=B V[3]=C V[4]=D V[5]=E V[6]=F\n```\n\n图 3.4: 使用 := 运算符的 DS2 输出\n\n\
    | V1 | V2 | V3 | V4 | V5 | V6 |\n|---|---|---|---|---|---|\n| A | B | C | D |\
    \ E | F |\n\n从图 3.4 中可以看到，PDV 中的元素都在。\n\n### 3.2.3.5 COMMENT, LINK 和 DELETE 语句\n\
    \n在传统语言中有许多编写注释的方法，但 DS2 文档仅列出了。因此，如果你发现有其他方式来实现注释，我建议坚持这种风格。LINK 语句用于处理代码块，但在\
    \ DS2 中并不必要。而且如果你使用 DELETE 语句而不是 subsetting IF，你会感到失望——只有 subsetting IF 在 DS2\
    \ 中有效。这一切符合我欣赏的设计理念：利用资源添加新功能！\n\n### 3.2.3.6 DS2 中传统的 DATA 步功能\n\n某些传统的 DATA\
    \ 步功能在 DS2 中缺失了，但通常有非常好的理由。例如，DS2 不包含这些语句：FILE、INPUT、LIST、CARDS 和 DATALINES。由于\
    \ DS2 是为了处理结构化数据设计的，不包含这些处理原始数据的语句并不意外。而且由于 DS2 在独立于 SAS 的过程中运行，用于控制 SAS 会话的语句（包括\
    \ DISPLAY、ABORT、ERROR、DESCRIBE 和 MISSING）也没有出现在 DS2 中。最后，允许执行任意操作系统命令的语句（如 EXECUTE\
    \ 和 X）可能永远不会成为 DS2 的一部分。由于 DS2 能够在数据库内部执行，执行任意操作系统命令对于主机平台来说是一个不可接受的风险。\n\n到此结束我们传统\
    \ DATA 步语言与 DS2 的对比。回顾一下，让我们深入探讨 DS2 语言令人兴奋的功能和能力！\n\n## 3.3 DS2 中的数据类型\n\n###\
    \ 3.3.1 DS2 和 ANSI 数据类型\n\n大多数 SAS过程通过 LIBNAME 引擎访问数据库。当你使用 SAS/ACCESS 接口引擎从数据库检索数据时，所有数据库数据类型在呈现给\
    \ SAS 处理之前都会被转换为固定宽度字符或 8 字节浮点数。这是必要的，因为 Base SAS DATA 步和 PROC 是为处理 SAS 数据设计的，而\
    \ SAS 数据只能包含这些类型的数据。\n\n然而，数据库可以包含丰富的 ANSI 数据类型，其中某些类型的精度远高于 8 字节浮点数可以实现的精度。由于\
    \ 8 字节浮点数的限制，我们从未无法在 Base SAS 中以全精度处理这些值。然而，DS2 使用自己的驱动程序访问数据且不依赖于 LIBNAME 引擎，我们第一次可以在\
    \ Base SAS 中检索和处理多种 ANSI 数据类型。下表列出了 DS2 可以原生处理的 ANSI 数据类型：\n\n"
