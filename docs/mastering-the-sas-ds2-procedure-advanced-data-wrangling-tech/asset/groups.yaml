    \ | Ford | F550 | 皮卡车 | 2015 | 24 | 7.0 | 26.7 | | 17.5 | 5.9 |\n| 2 | Ford |\
    \ Expedition | 全尺寸 SUV | 2015 | 12 | 6.0 | 18.5 | | 13.1 | 3.6 |\n| 3 | Dodge\
    \ | Ram Proaster 3500 | 货运箱 | 2015 | 20 | 6.0 | 10.6 | | 9.0 | 4.8 |\n| 4 | GMC\
