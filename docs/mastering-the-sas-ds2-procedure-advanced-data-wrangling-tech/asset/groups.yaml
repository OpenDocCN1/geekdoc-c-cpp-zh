    \ DS2 程序处理它。所以，JSON 程序包来救急！\n\n## 5.4.3 JSON 程序包规范\n\nJSON 程序包提供了一个用于创建和解析 JSON\
    \ 文本的接口。处理 JSON 文本的方法名称都以 WRITE 为前缀，通常被称为 JSON 程序包 WRITE 方法，它们准确地在内存中计算请求。生成的\
    \ JSON 可以检索到变量中。这对于创建用于 HTTP 方法的 JSON 数据非常有用。\n\n### 5.4.3.1 读取 JSON 解析器实例\n\n\
    要使用 JSON 程序包，我们必须首先声明程序包的实例。我们还需要声明处理响应体外数据的变量：\n\n```sas\ndcl package json();\n\
