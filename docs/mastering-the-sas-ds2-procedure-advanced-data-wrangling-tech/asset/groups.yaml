    # 5.4.2 HTTP Package Specifications


    The HTTP package allows you to construct an HTTP client, create an HTTP GET, HEAD,
    or POST method and execute those methods to retrieve or post data via the Internet.
    You can retrieve the response information from the web server as a complete entity
    or you can stream the response. With the HTTP package you can also retrieve status
    codes from HTTP responses, socket time-values, and log the HTTP traffic between
    the HTTP client and server using the SAS logging facility.


    # 5.4.2.1 Understanding the GET, HEAD, and POST Methods


    Most APIs on the Internet consist of a collection of methods properly formed Uniform
    Resource Identifiers (URIs). The API will have a base URL to which additional
    information is appended. To access the desired API method, specify the desired
    response format and pass in the parameters required by the method.


    The API calls can be for GET, HEAD, or POST methods.


    +   - The GET method is used to retrieve information from the server. GET requests
    are used only to retrieve data, and should have no effect on the server''s data.

    - The HEAD method works just like GET, but a HEAD request will return only the
    status and header information given the request without returning the detailed
    data (body) of the request.

    - POST methods are used to send data to the server. POST requests are generally
    used to upload data or to update data on the server.


    Our examples will focus on using the GET method to retrieve information from an
    API method call.


    # 5.4.2.2 Working with the Kiva API


    All calls to the Kiva API will use the GET method. The Kiva API base URL is http://api.kivars.org/v1/.
    For example, to get a list of microfinance partners in HTML, the URI would be
    http://api.kivars.org/v1/partners.html. Typing that URI into a browser produces
    a result like:


