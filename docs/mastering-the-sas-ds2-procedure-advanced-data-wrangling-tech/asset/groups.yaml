    \ 57\n\n4.3.1 通用考虑因素 ...................................................................\
    \ 57\n\n4.3.2 用户定义包细节 ................................................................\
    \ 57\n\n4.3.3 使用包进行面向对象编程...................................... 61\n\n4.4 核心概念回顾\
    \ ............................................................ 68\n\n## 4.1 引言\n\
    \n在本章中，我们将探索用户定义方法以创建自定义的可用块。首先，我们将定义内联方法，然后学习如何共享。具体来说，我们将涵盖以下点：\n\n- 用户定义方法\n\
    - 内联\n- 参数\n- 返回值与调用处修改\n- 使用包\n- DS2 程序\n- 编译时与执行时\n- 使用构造参数\n- 使用全局和局部变量\n-\
    \ 使用点符号\n- 面向对象编程\n\n## 4.2 深入研究用户定义方法\n\n### 4.2.1 概述\n\n用户定义方法是在被调用时才执行的命名代码块。产生值的方法有两种设计方式：方法可以像\
    \ Base SAS 函数一样，向调用过程返回单个值；也可以像 Base SAS 过程一样，在调用处修改一个或多个值。\n\n### 4.2.2 设计用户定义方法\n\
    \n方法是标准化流程的极佳工具。让我们以简单的利计算为例。以下是计算一年后金额的方法：\n\n```sas\nAmount=SUM(Amount, Amount*Rate);\n\
    ```\n\n为了计算多年的金额，可以在 DO 循环中执行公式：\n\n```sas\ndo i=1 to Years;\nAmount=SUM(Amount,\
    \ Amount*Rate);\nend;\n```\n\n### 4.2.2.1 方法设计考虑因素\n\n创建一个执行利息计算的方法，我们必须决定如何将计算出的利值传回调用过程。由于只涉及一个值，我们选择返回值或通过定义\
    \ `IN_OUT` 参数在调用处修改。每种方法都有优缺点。返回值的方法在调用时最为灵活。当按值传递参数时（没有 `IN_OUT` 参数），每个参数值都可以在执行时通过常量、变量引用或表达式进行处理。在调用处修改参数的方法必须通过引用传递\
    \ `IN_OUT` 参数。在调用时，所有 `IN_OUT` 参数值必须使用变量名返回。\n\n"
