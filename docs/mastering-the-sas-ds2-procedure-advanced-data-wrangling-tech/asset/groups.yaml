    \ 年发布的 SAS 9.4 ME 版本为我们带来了 HTTP 程序包，我重回了引入互联网 API。令我非常高兴的是，2015 年 7 月 SAS 9.4\
    \ M 交付了 JSON 程序包，SAS 首次拥有了同时用于读取和解析 JSON 的原生工具。\n\n我们将使用 Kiva.org 的 API 进行演示代码。Kiva\
    \ 是一家非营利组织，使命是连接人们以消除全球的贫困。通过他们的网站（http://kiva.org），Kiva 利用全球微型金融网络将个人与发展中国家的创业者联系起来。个人提供每笔\
    \ 25 美元的小额贷款。资金被汇总在一起，然后由微型金融机构管理所有贷款。这种为通常无法获得贷款的极小企业提供的融资，为我们的贷款人开启了巨大的机会。幸运的是，Kiva\
    \ 还提供了一个功能丰富的 API，并在 http://build.kiva.org 提供了卓越的文档，我们将在我们的 DS2 代码示例中使用它。我们将使用\
    \ Kiva API 收集有关南美洲女性创业者贷款的信息。\n\n注意：这里有一些关于我如何得到书中使用的 HTTP 和 JSON 程序包示例，以及为什么我选择\
    \ Kiva 作为书中演示代码的简单背景介绍。作为浸信会传教士的儿子，我在巴西北部长大。我 15 岁时来到美国，以弥补错失的居住经历。十年后，我精通葡萄牙语和英语的能力让我获得了\
    \ SAS 的第一工作，首先在巴西工作，然后是在南美洲的安第斯地区和加勒比地区。我最终搬到了美国 SAS 的职位，但在南美仍有许多朋友和联系人。因此，我觉得与该地区的人有着深厚的情缘，特别是对于那些挣扎于摆脱极端贫困的人。我的研究表明，帮助女性获得支持是提高生活水平的极佳策略，我有兴趣向南美洲的女性企业提供贷款。\n\
    \n### 5.4.2 HTTP 程序包规范\n\nHTTP 程序包允许你构建一个 HTTP 客户端，创建 HTTP GET、HEAD 或 POST 方法，并执行这些方法通过互联网检索或发布数据。你可以从\
    \ Web 服务器检索完整实体的响应信息，也可以流式处理响应。通过 HTTP 程序包，你还可以从 HTTP 响应中检索状态码、套接字值，并使用 SAS 日志功能记录\
    \ HTTP 客户端和服务器之间的 HTTP 流量。\n\n### 5.4.2.1 理解 GET、HEAD 和 POST 方法\n\n互联网上的大多数 API\
    \ 都由一组格式正确的统一资源标识符（URI）组成。API 将具有一个基础 URL，在其后附加额外信息。要访问所需的 API 方法，请指定所需的响应格式并传递该方法所需的参数。\n\
    \nAPI 调用可以是 GET、HEAD 或 POST 方法。\n\n- GET 方法用于从服务器检索信息。GET 请求仅用于检索数据，且不应对服务器数据产生任何影响。\n\
    - HEAD 方法的作用与 GET 相同，但 HEAD 请求仅返回根据请求提供的状态和标头信息，而不返回请求的详细数据（正文）。\n- POST 方法用于向服务器发送数据。POST\
    \ 请求通常用于上传数据或更新服务器上的数据。\n\n我们的示例将重点关注使用 GET 方法从 API 方法调用中检索信息。\n\n### 5.4.2.2\
    \ 使用 Kiva API\n\n所有对 Kiva API 的调用都将使用 GET 方法。Kiva API 的基础 URL 为 http://api.kivars.org/v1/。例如，要获取\
    \ HTML 格式的微型金融合作伙伴列表，URI 将为 http://api.kivars.org/v1/partners.html。在浏览器中输入该 URI\
    \ 生成的结果结果：\n\n## 图 5.6：HTML 输出结果\n\n| id | name | status | start_date | delinquency_rate\
