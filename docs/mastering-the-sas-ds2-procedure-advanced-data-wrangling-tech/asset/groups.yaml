    | 1 | 210200100009 | $34.70 |\n| 2 | 2220010012 | $58.70 |\n| 3 | 23010500006\
    \ | $8.40 |\n| 4 | 24010100366 | $16.30 |\n| 5 | 24050010039 | $34.50 |\n| 6 |\
