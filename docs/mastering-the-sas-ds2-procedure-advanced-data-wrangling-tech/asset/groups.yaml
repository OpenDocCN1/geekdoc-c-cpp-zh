  - "[PAGE 37]\n\nChapter 2: Introduction to the DS2 Language 21\n\n# Figure 2.8:\
    \ Report Produced by the Data Program\nIncome levels\n\n| WholeName | GivenName\
    \ | Surname |\n|---|---|---|\n| Schmidt, William | Schmidt | |\n| Laverty, Daniel\
    \ | Daniel | Laverty |\n| Grayson, Sarah | Sarah | Grayson |\n| Hastings, Eldon\
    \ | Hastings |\n\nIf you have ever stored snippets of code in a SAS program file\
    \ for inclusion in a traditional DATA step, you have probably experienced what\
    \ I refer to as PDV contamination. When the included code references a variable\
    \ that already existed in the main program, or when it includes new variable references,\
    \ PDV values for existing variables can be inadvertently modified by the included\
    \ code. Also, unwanted variables can be added to the PDV and affect the output\
    \ data set.\n\nWhen using DS2 methods, the method's local variables never affect\
    \ the PDV, a concept often referred to as variable encapsulation. Because method\
    \ parameters and locally declared variables are in scope, they are encapsulated\
    \ in your method code and will not contaminate the PDV. In a later chapter, we\
    \ will store our user-defined methods in a DS2 package for simple reuse in future\
    \ programs. Because of variable encapsulation, you will never need to worry about\
    \ PDV contamination when reusing properly written DS2 methods.\n\n# 2.2.8 Data\
    \ Program Execution\n\nDS2 data programs are delivered by the DS2 compiler for\
    \ syntax checking, compilation, and execution. At compile time, resources are\
    \ reserved for the PDV, the code is compiled for execution, and an output data\
    \ set is being produced, the output data descriptor is written. After compilation,\
    \ execution begins with the INIT method, and it is automatically followed by the\
    \ RUN and TERM method code. Only system methods execute automatically; any user-defined\
    \ methods must be called from the INIT, RUN, or TERM methods else the user-defined\
    \ method will not be executed.\n\n# 2.3 Converting a SAS DATA Step to a DS2 Data\
    \ Program\n\n# 2.3.1 A Traditional SAS DATA Step\n\nHere is a traditional SAS\
    \ DATA step with three subsections, which we will convert into a DS2 data program:\n\
    \n```\ndata null;\n/* Section 1 then */\nif n_=1 then\ndo;\n  put '*********';\n\
    \  put 'Starting';\n```"
  - "[PAGE 38]\n\n# 22 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\
    \n```\nput '*********';\nend;\n\n/* Section 2 */\nset crs.banks=last;\nput Bank\
    \ Rate;\n\n/* Section 3 */\nif last then\ndo\n  put '*********';\n  put 'Ending';\n\
    \  put '*********';\nend;\nrun;\n```\n\n# 2.3.2 Considerations\n\n+   1. Section\
    \ consists of a DO group of statements that will be executed only when _N =1.\
    \ The automatic variable _N_ counts the number of times the DATA step has iterated,\
    \ so this block will execute only one time, when the DATA step starts execution.\n\
    2. Section 2 consists of unconditionally executed statements. These statements\
    \ execute once for every observation in the input data set. In this section, the\
    \ SET statement uses the END= to create last, a temporary variable containing\
    \ an end-of-file indicator. The variable last is initialized to zero and remains\
    \ 0 until the SET statement reads the last observation of last data listed, when\
    \ it is set to 1. As an automatic variable, last is automatically flagged for\
    \ DROP, and will not appear in the output data set.\n3. Section 3 consists of\
    \ a DO group of statements that will execute only if the variable last contains\
    \ a value other than 0 or missing.\n\nIf we think about this, Section 1 code sounds\
    \ like a great candidate for the INIT system method, Section 2 for the RUN method,\
    \ and Section 3 for the TERM method.\n\n# 2.3.3 The Equivalent DS2 Data Program\n\
    \nHere is a DS2 data program equivalent to the original SAS DATA step:\n\n```\n\
    proc ds2;\ndata _null_;\n\n/* Section 1 */\nmethod init();\n  put '*********';\n\
    \  put 'Starting';\n  put '*********';\nend;\n\n/* Section 2 */\nmethod run();\n\
    \  set crs.banks;\n  put Bank Rate;\nend;\n```"
