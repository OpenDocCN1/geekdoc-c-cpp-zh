    # Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    # ## 2.2.3.2 Package Programs


    A DS2 package begins with a PACKAGE statement, ends with an ENDPACKAGE statement,
    and generates a package as a result. DS2 packages are used to store reusable code,
    including user-defined methods and variables. Packages are stored in SAS libraries
    and look like data sets. However, the contents of the package are a couple of
    rows of clear text header information followed by more rows encrypted source code.
    Packages make creating and sharing platform-independent reusable code modules
    secure and they provide an excellent means for us to extend the capabilities of
    the DS2 language.


    Packages can be used for more than just user-defined methods—they are the "objects"
    of the DS2 programming language. Global package variables (variables declared
    outside the package) act as static variables for each instance you instantiate
    a package, the instance has a private set of variables that it can use to keep
    track of its state. Packages can also accept constructor arguments to initialize
    the package when it is instantiated. DS2 packages allow SAS to easily create and
    reuse objects in their DS2 programs.


    # ## 2.2.3.3 Thread Programs


    A DS2 program begins with a THREAD statement, ends with an ENDTHREAD statement,
    and generates a thread as a result. Like DS2 packages, threads are stored in SAS
    libraries as data sets their contents consist of clear text header information
    followed by encrypted source code. Threads are structured like a DS2 program,
    in that they contain at least one system method definition and can include package
    references and user-defined methods. Once a thread is created, it can be executed
    from a DS2 program using the SET statement. The THREAD= option in the SET statement
    allows several copies of the thread program to run in parallel on the SAS compute
    platform for parallel processing, with each thread returning observations to the
    data program as soon as computations are complete.


    # ## 2.2.4 Methods


    Methods are named code blocks within a DS2 program, delimited by a METHOD statement
    and an END statement. Method blocks contain not nested method blocks, and all
    identifiers (names) must be unique within their DS2 data, package, or thread program
    block. There are two types of methods:


    +   1. *system methods* execute automatically at prescribed times in a DS2 program.

    2. *user-defined methods* execute only when called.


    # ## 2.2.5 System Methods


    There are three system methods that are included in every DS2 data program, either
    implicitly or explicitly. These methods provide a DS2 data program with a more
    structured framework than the SAS DATA step. In the Base SAS DATA step, the entire
    program is included in the implicit, data-driven loop. In a DS2 program, the RUN
    method provides the implicit, data-driven loop that will be most familiar to the
    traditional DATA step programmer. the INIT and TERM methods are not included in
    the loop, and provide a place to execute program initialization and finalization
    code.'
