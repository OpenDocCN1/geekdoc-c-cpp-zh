    \ 49\n\n# 3.1 引言\n\n在本章中，我们将关注 DS2 数据程序的基础，首先通过将传统的 DATA Step 与 DS2 数据程序进行进一步对比，并深入研究\
    \ DS2 中的一些新特性。在此过程中，我们将更复杂的 Base DATA Step 转换为 DS2 数据程序，并引入几个 DS2 特有的概念和技术。具体而言，我们将涵盖以下几点：\n\
    \n- 更多 DS2 数据程序语法和结构\n- 使用 FedSQL 查询直接为 DS2 数据程序的 `SET` 语句提供输入\n- DS2 中可以处理的各种\
    \ ANSI 数据类型\n- DS2 自动数据类型转换规则\n- 独特的 DS2 程序语句\n- 独特的 DS2 表达式\n- 选定的 DS2 函数\n\n\
    ## 3.2 DS2 数据程序与 Base SAS DATA Steps 的对比\n\n### 3.2.1 通用注意事项\n\nDS2 数据程序语法与 Base\
    \ SAS DATA Step 语法的相似性对于丰富的 SAS 程序员来说是一个优势。这种相似性明显体现在 Base SAS DATA Step 和 DS2\
    \ 数据程序共享的语句语法上。例如，这些语句在两种语言中的工作方式基本相同：\n\n- `SET`\n- BY 组处理，包括 `First.variable`\
    \ 和 `Last.variable`\n- DO 组和 DO 循环\n    - `DO i= start TO STOP BY interval`\n\
    \    - `DO WHILE ()`\n    - `DO UNTIL ()`\n    - 循环控制语句 `CONTINUE`、`LEAVE` 和 `END`\n\
    - 程序流控制语句\n    - `RETURN`\n    - `OUTPUT`\n    - `GOTO`\n    - `STOP`\n- 声明语句\n\
    \    - `KEEP` 和 `DROP`\n    - `RETAIN`\n\n记住，在任何 DS2 程序中，全局声明语句必须出现在全局程序空间中——即在\
    \ `DATA`、`THREAD` 或 `PACKAGE` 语句之后，第一个方法定义之前。\n\n## 3.2.2 “六个微妙差异”\n\n尽管传统的 DATA\
    \ Step 和 DS2 数据程序中的许多工作工作完全相同，但存在一些非常微妙的差异，在 DS2 中编程时需要记住。让我们回顾一下主要的区别，我称之为“六个微妙差异”。\n\
    \n### 3.2.2.1 所有可执行语句必须是方法的一部分\n\n在全局程序空间中的可执行语句会导致语法错误：\n\n```\nproc ds2;\ndata\
    \ _null_;\nset crs.one_day;\nput _all_;\nenddata;\nrun;\n```\n\nSAS 日志：\n\n```\n\
    ERROR: Compilation error.\nERROR: Parse encountered end of input.\n```\n\n将可执行语句封装在方法中可以解决这个问题：\n\
