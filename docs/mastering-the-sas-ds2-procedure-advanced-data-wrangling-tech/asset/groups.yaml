    * 每种类型维护的数量 */\ndcl double a_units[1] Inventory;\n* 需要购买的每种液体总量 */\nvararray double\
    \ a_vals[4] Oil Cooling Transmission Differential;\nkeep Oil Cooling Transmission\
    \ Differential;\n```\n\n```sas\nmethod run();\n  set curs.out_fleet;\n/* 从 vararray逐行加载容量矩阵\
