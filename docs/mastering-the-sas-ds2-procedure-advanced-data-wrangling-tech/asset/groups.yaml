    \ statement in the DS2 document. But while researching this \"problem\" I made\
    \ a delightful discovery-DS2 allows you to write a SQL query in the SET statement,\
    \ requesting the SQL result set as if it were a data set! Now I understand just\
    \ how \"tight integration between DS2 and SQL\" accomplish. For example, I can\
    \ join data sets, order the results, and use a SET statement to ingest the SQL\
