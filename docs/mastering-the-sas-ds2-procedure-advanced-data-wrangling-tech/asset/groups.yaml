  - "[PAGE 100]\n\n# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\
    \nWe can call CREATEGETMETHOD to prepare a GET request and EXECUTMETHOD to execute\
    \ the request:\n\n```\nproc ds2;\ndata null;\n  /* Declare the HTTP package */\n\
    \  dcl package h();\n  dcl varchar(1000000) character set utf8 API_Response;\n\
    \  dcl int rc;\n  method init();\n    /* create a GET request */\n    h.createGetMethod(\n\
    \      cats('http://api.kivaws.org/vl/loans/search.json',\n           '?region=sa&per_page=5&status=fundraising',\n\
    \           '&gender=female&sort_by=newest'));\n    /* execute the GET to query\
    \ the Kiva API */\n    h.executeGetMethod();\n  end;\nenddata;\nrun;\nquit;\n\
    ```\n\nExecuting this code produces a warning in the SAS log because we didn't\
    \ retrieve the API response text:\n\n```\nWARNING: Warning reported by DS2 package\
    \ d2http:\nWARNING: Aborted execution of HTTP GET method with URL:\nhttp://api.kivaws.org/vl/loans/search.json?region=sa&per_page=5&fundraising-gender=female&sort_by=newest\n\
    ```\n\nLet's use the GETRESPONSEBODYASSTRING method to retrieve the JSON produced\
    \ by the API call and write the results to the SAS log using PUT statements. In\
    \ addition, we'll write the data to work.json so we can use that data for future\
    \ prototyping:\n\n```\nproc ds2;\ndata work.json/overwrite=;\n  /* Declare the\
    \ HTTP package */\n  dcl package http();\n  dcl varchar(1000000) character set\
    \ utf8 API_Response;\n  dcl int rc;\n  method init();\n    /* create a GET request\
    \ */\n    h.createGetMethod(\n      cats('http://api.kivaws.org/vl/loans/search.json',\n\
    \           '?region=sa&per_page=5&status=fundraising',\n           '&gender=female&sort_by=newest'));\n\
    \    /* execute the GET to query the Kiva API */\n    h.executeGetMethod();\n\
    \    /* retrieve Response as text, write to the log */\n    h.getResponseBodyAsString(API_Response,\
    \ rc);\n    put(\n      output);\n  end;\nenddata;\nrun;\nquit;\n```"
