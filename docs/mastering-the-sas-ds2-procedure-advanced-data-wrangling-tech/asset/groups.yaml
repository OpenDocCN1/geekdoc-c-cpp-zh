    \ JSON 格式进行搜索，这种 API 调用可以生成查询参数。参数字符串紧跟 API 方法的 URI 之后，并用问号（?）分隔。参数值对用和符号（&）分隔。例如，要使用\
    \ Kiva API 并请求南美洲地区正在筹款的女性贷款的 HTML 结果，并按降序排列结果，每页显示五个结果，这里是格式正确的 URI：http://api.aws.org/search.html?region=sa&gender=female&status=fundraising&sort=newest&page=5\n\
    \n### 5.4.2.3 使用 HTTP 程序包配合 Kiva API\n\n要使用 HTTP 程序包，我们必须首先声明该程序包的实例。我们还要了一些变量来处理执行\
