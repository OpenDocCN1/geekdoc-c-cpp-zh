  md: "\n## Chapter 7: Performance Tuning in DS2\n\n## 7.3.2 Analyzing Performance\
    \ Statistics\n\nOne of the first comparisons to make is real CPU time. If your\
    \ task is performing real-time and real time and CPU time are consistently within\
    \ 10 to 15% of each other, the limiting factor is probably CPU time, and your\
    \ task is CPU bound. If there is a large difference between real time and CPU\
    \ time, the limiting factor is probably I/O, and your process is probably I/O\
    \ bound. Other valuable information from FULLSTIMER can be gained by analyzing\
    \ the remaining statistics. A search of support.sas.com for “FULLSTIMER SAS option”\
    \ will provide more in-depth guidance on how to proceed.\n\n## 7.3.3 Tuning Your\
    \ Code\n\nAs a general rule, if your task reads from a table in a DBMS that has\
    \ the SAS In-Database Accelerator installed, it will run much faster if you rewrite\
    \ the data program and execute the thread from a data program using the SET statement.\
    \ Performance will be even better if the data program output is also a database\
    \ table and your database is capable of running both the thread and data programs\
    \ in-database. As of this writing, only Teradata and Hadoop have that capability.\
    \ If your task sources its data from a DBMS, using DS2_OPTIONS TRADE or OPTIONS\
    \ SASTRACE or both can identify how much processing is happening in the database\
    \ and how much movement to the SAS platform for processing was necessary.\n\n\
    In summary, the following:\n\n- If your task is I/O bound, threading on the SAS\
    \ platform will likely exacerbate the problem. However, if your task sources its\
    \ data from a DBMS that has the SAS Database Code Accelerator installed, you can\
    \ probably significantly improve performance by running the process in-database\
    \ as a DS2 THREAD program.\n- If your task is CPU bound, it can benefit from parallel\
    \ processing using DS2 threads, even if you do not have in-database processing\
    \ capability available. Try writing the data program as a thread program, and\
    \ executing it in parallel from a data program using the SET statement, experimenting\
    \ with THREADS+ option values.\n- Another technique I've found (when my DS2 program\
    \ uses an SQL query as input to the SET statement) is to create a temporary table\
    \ using the query and then use the temporary table as input to the DS2 program\
    \ while troubleshooting. This can help isolate performance degradation to the\
    \ DS2 or SQL portion of the program.\n\n## 7.4 Learning and Trouble-Shooting Resources\n\
    \n### 7.4.1 SAS Learning Resources\n\nSAS provides extensive documentation for\
    \ the DS2 language, including many code examples that provide an excellent opportunity\
    \ for learning about DS2. A great place to begin is https://support.sas.com/documentation.\
    \ You will find the DS2 documentation in the Base SAS section.\n\nSAS also provides\
    \ free-to-videos via their YouTube channel at https://www.youtube.com/user/SASsoftware.\
    \ And, of course, a well-word search of the Internet will frequently yield instructive\
    \ examples with source code.\n\n## Mastering the SAS DS2 Procedure: Advanced Data\
    \ Wrangling Techniques\n\nAnother great place to learn about SAS is to read the\
    \ SAS Blogs at http://blogs.sas.com. They provide a wealth of information, and\
    \ many times provide data and source code, too. I write sporadically for the SAS\
    \ Learning Post blog. You can find a collection of my contributions at http://go.sas.com/jedi.\n\
    \nOnline formal training for DS2 is in Live Web format. Just go to http://support.sas.com/training\
    \ and search for DS2.\n\n### 7.4.2 SAS Support Communities\n\nMy favorite destination\
    \ for seeking (and sometimes providing) answers is the SAS Support website at\
    \ http://communities.sas.com. There are many sub-communities available, but most\
    \ of the DS2 activity appears in the SAS Programming and General SAS Programming\
    \ communities (under SAS Programming). The SAS Support forums are very active\
    \ with seasoned users, newcomers, and SAS staff all eager to help each other.\n\
    \nAnother excellent community resource is the Wiki at http://www.sascommunity.org.\
    \ Contributors come from all the world and all walks of life. The \"saspedia\"\
    \ portion is a unique source of information about a wide array of SAS techniques.\n\
    \nWhen posing a question to an online community, you can get help more quickly\
    \ if you prepare properly. Post your question clearly and succinctly. Provide\
    \ a program that demonstrates your problem as simply as possible. And if you want\
    \ a quicker response, include a sample data set. The best way to provide sample\
    \ data is to include a LITTLE DATA step that produces the sample data, so the\
    \ folks on the can can run your code for themselves, using the same data, and\
    \ be able to quickly reproduce your results. I wrote a blog about this \"Jedi\
    \ SAS Tricks: The DATA to STEP Macro\" which included code for the data2datastep\
    \ macro. This macro can create a DATA step to reproduce a data set that you specify.\
    \ I've included the code for this macro in the ZIP file containing the data for\
    \ this book. Look for the program file named data2datastep. The macro is self-documenting,\
    \ but you can read more about how the macro works at http://go.gl/spQojuc. Please\
    \ note that these shortened URLs are sensitive, make sure you use a capital Q.\n\
    \n### 7.4.3 SAS Technical Support\n\nAny licensed user can contact SAS Technical\
    \ Support with his or her SAS questions. There is a guide to help you optimize\
    \ your interactions with SAS Technical Support.\n\n- What can I expect from SAS\
    \ Technical Support?\n  See http://support.sas.com/techsup/support.html\n- How\
    \ can I contact SAS Technical Support?\n  a. Use the telephone for business-critical\
    \ issues: +1 (919) 677-8008.\n  b. Use the web form for all other issues: http://support.sas.com/ctx/supportform/createForm\n\
    - What information will I need when contacting SAS Technical Support?\n  * If\
    \ you are using a commercial version of SAS, your company name.\n  * The country\
    \ in which your SAS software is licensed.\n  * Your name, email address, and phone\
    \ number.\n- Site number, operating system, and software release. You can obtain\
    \ this information from the top of a fresh SAS log, or you can execute this macro\
    \ to print the information that you need in the SAS log:\n\n```\n%macro siteinfo;\n\
    %PUT NOTE: Site ID is &SYSITE;\n%PUT NOTE- SAS Version is &SYSLONG;\n%PUT NOTE-\
    \ Operating System is &SYSSCP (&SYSSCPL);\n%end;\n\n%siteinfo\n```\n- SAS product\
    \ involved (Base SAS is the product for DS2 questions).\n- Succinct, one-line\
    \ description of the issue for the subject line of your technical support track.\n\
    - Detailed problem description, including error or warning messages.\n- A clear,\
    \ concise description of any troubleshooting or research that you've already done.\n\
    - Copies of your SAS program, SAS log, and any other pertinent files. If at possible,\
    \ supply some mock-up input data for your program to add the Technical Support\
    \ folks in troubleshooting your problem. You can use the data2dataset macro discussed\
    \ in Section 7.4.2 to provide the data. To include attachments, wait for the first\
    \ automatic email response to arrive after you post your problem, and then reply\
    \ to that email with the requisite attachments.\n\n## 7.5 Review of Key Concepts\n\
    \n- The SAS system option FULLSTIM can provide significantly more detailed performance\
    \ information in the SAS log than is usually available. own- The DS2_OPTIONS statement\
    \ with the TRACE option can provide extra insight into how-database processing\
    \ is accomplished by DS2 programs running in database.\n- For benchmarking, it\
    \ is necessary to code several approaches to the same problem, run them on realistically\
    \ sized and located data, and compare performance statistics in order to best\
    \ tune your DS2 programs.\n- There is a lot of help available online for SAS users,\
    \ including free e-learning courses, how-videos, SAS community forums, and SAS\
    \ Technical Support.\n- Proper preparation before contacting SAS Technical Support\
    \ will make the engagement smoother and result in faster answers to your questions.\n\
    \n## 7.6 Connecting with the Author\n\nI can't believe it - I've completed my\
    \ very first book! Writing this book has been quite an amazing experience for\
    \ me. I thank you for taking the time to read it and hope you find DS2 delightful\
    \ and useful as I have found it to be my own work. I'd love to hear from you,\
    \ perhaps with feedback on your real-world problems. Please feel free to connect\
    \ with me on LinkedIn (http://linkedin.com/in/sasjedi), follow me on Twitter (http://twitter.com/sasjedi),\
    \ read my sporadic “Jedi SAS Tricks” posts on The SAS Post blog (http://go.sas.com/jedi)\
    \ or contact me via my author page at http://support.sas.com/Jordan. Of course,\
    \ your reviews on Amazon, Goodreads, etc. are always appreciated.\n\nI wish you\
    \ the best in all your SAS endeavors – and may the SAS be with you!\n"
  mdcn: "\n\n## 第 7 章：DS2 中的性能调优\n\n## 7.3.2 分析性能统计数据\n\n第一个要做的对比是实际 CPU 时间（real CPU\
    \ time）。如果你的任务是实时运行的，且实际时间（real time）与 CPU 时间始终在彼此的 10% 到 15% 以内，那么限制因素可能是 CPU\
    \ 时间，你的任务属于 CPU 密集型。如果实际时间和 CPU 时间之间存在巨大差异，限制因素可能是 I/O，你的进程可能是 I/O 密集型。通过分析剩余统计数据可以从\
    \ FULLSTIMER 获取其他价值信息。在 support.sas.com 上搜索“FULLSTIMER SAS option”可以获得关于如何操作的深入指导。\n\
    \n## 7.3.3 调优你的代码\n\n通常情况下，如果你的任务从安装了 SAS 数据库加速器（SAS In-Database Accelerator）的\
    \ DBMS 表中读取数据，重写数据程序并使用 `SET` 语句从数据程序执行线程，运行速度会快得多。如果数据程序的输出也是数据库表，且你的数据库能够在数据库内部运行线程和数据程序，性能将更出色。截至本文写作时，仅\
    \ Teradata 和 Hadoop 具备该能力。如果你的任务数据源自 DBMS，使用 `DS2_OPTIONS TRADE` 或 `OPTIONS SASTRACE`\
    \ 或两者都可以识别数据库中发生了多少处理，以及为了处理需要移动到 SAS 平台多少数据。\n\n总结如下：\n\n- 如果你的任务是 I/O 密集型的，在\
    \ SAS 平台上使用线程可能会加剧问题。然而，如果你的任务数据来自安装了 SAS 数据库代码加速器的 DBMS，你可能通过作为 DS2 THREAD 程序在数据库内部运行进程来显著提高性能。\n\
    - 如果你的任务是 CPU 密集型的，即使你没有数据库内部处理能力，也可以从使用 DS2 线程的并行处理中受益。尝试将数据程序编写为线程程序，并使用 `SET`\
    \ 语句进行并行执行，尝试 `THREADS` 值。\n- 我发现的另一种技术（当 DS2 程序使用 SQL 查询作为 `SET` 语句的输入时）是创建一个临时表，然后将该临时表作为\
    \ DS2 程序的输入进行故障排除。这有助于隔离 DS2 部分或 SQL 部分的性能下降。\n\n## 7.4 学习与故障排除资源\n\n### 7.4.1\
    \ SAS 学习资源\n\nSAS 为 DS2 语言提供了大量的文档，包括许多代码示例，这是学习 DS2 的绝佳机会。一个很好的起点是 https://support.sas.com/documentation。SAS\
    \ 还通过其 YouTube 频道 https://www.youtube.com/user/SASsoftware 提供免费视频。当然，在互联网上搜索 DS2\
    \ 文档（https://support.sas.com）经常会产生启发性的示例。\n\n## 掌握 DS2 过程：高级数据处理技术\n\n学习 SAS 的另一个好地方是阅读\
    \ http://blogs.sas.com 上的博客。关于 DS2 的博客，他们提供了丰富的信息，有时还会提供数据和源代码。你可以在 http://go.sas.com/jedi\
    \ 找到我的贡献。\n\nDS2 的在线正式培训采用在线格式。只需访问 http://support.sas.com/training 并搜索 DS2。\n\
    \n### 7.4.2 SAS 支持社区\n\n我寻求（有时也提供）答案的最喜目的地是 SAS 支持网站 http://communities.sas.com。有很多子社区可用，但大多数\
    \ DS2 活动出现在 SAS Programming 和 General SAS Programming 社区。SAS 支持论坛非常活跃，资深用户、新手和\
    \ SAS 工作人员都渴望互相帮助。\n\n另一个出色的社区资源是 http://www.sascommunity.org 上的 Wiki。贡献者来自世界各地和各行各业。“aspedia”\
    \ 部分是关于各种 SAS 技术的独特信息来源。\n\n在向在线社区提问时，如果你准备得当，可以更快地获得帮助。请清晰、简洁地发布你的问题。尽可能简单地提供演示问题的程序。如果你想获得快速回复，请包含示例数据集。提供示例数据的最佳方法是包含一个产生示例数据的\
    \ DATA 步骤，以便社区的人可以使用相同的数据运行你的代码并快速复现结果。我写过一篇关于“Jedi SAS Tricks: The DATA Macro”的博客，其中包含了\
    \ `data2datastep` 宏的代码。该宏可以创建一个你指定的生成数据集的 DATA 步骤。我在包含本书数据的 ZIP 文件中包含了该宏的代码。该宏是自文档的，但你可以通过\
    \ http://go.gl/spQojuc 了解更多关于该宏的工作原理。请注意，这些缩短的 URL 是敏感的，请确保使用大写 Q。\n\n### 7.4.3\
    \ SAS 技术支持\n\n任何授权用户都可以就其 SAS 问题联系 SAS 技术支持。有一份指南帮助你与 SAS 技术支持进行交互。\n\n- 我可以从\
    \ SAS 技术支持得到什么？\n  参见 http://support.sas.com/techsup/support.html\n- 我如何联系 SAS\
    \ 技术支持？\n  a. 关键业务问题使用电话：+1 (919) 677-8008。\n  b. 其他问题使用 Web 表单：http://support.sas.com/ctx/supportform/createForm\n\
    - 联系 SAS 技术支持时需要哪些信息？\n  * 如果你使用的是 SAS 商业版本，你的公司名称。\n  * 你的 SAS 授权的国家。\n  * 你的姓名、电子邮件地址和电话号码。\n\
    - 站点号、操作系统和软件版本。你可以从新的 SAS 日志顶部获取这些信息，也可以执行此宏在 SAS 日志中打印你需要的信息：\n\n```\n%macro\
    \ siteinfo;\n%PUT NOTE: Site ID is &SYSITE;\n%PUT NOTE- SAS Version is &SYSLONG;\n\
    %PUT NOTE- Operating System is &SYSSCP (&SYSSCPL);\n%end;\n\n%siteinfo\n```\n\
    - 涉及的 SAS 产品（DS2 问题使用 Base SAS 产品）。\n- 技术支持跟踪主题中，对问题的简短的一行描述。\n- 详细的问题描述，包括错误或警告消息。\n\
    - 对你已经做的任何故障排除或研究进行清晰、简洁的描述。\n- 你的 SAS 程序、SAS 日志以及任何其他文件的副本。如果可能，为你的程序提供一些模拟输入数据，以帮助技术支持人员排除你的问题。你可以使用\
    \ 7.4.2 节讨论的 `data2dataset` 宏来提供数据。要包含附件，请发布问题后等待第一封自动邮件回复，然后回复该邮件并带上附件。\n\n##\
    \ 7.5 核心概念回顾\n\n- SAS 系统选项 FULLSTIM 可以在 SAS 日志中提供比通常可用详细得多的性能信息。\n- 带有 `TRACE`\
    \ 选项的 `DS2_OPTIONS` 语句可以对数据库中运行的 DS2 程序如何实现数据库处理提供额外见解。\n- 对于基准测试，必须对同一个问题编写几种方法，在真实大小和位置的数据上运行它们，并比较统计数据以便充分优化你的\
    \ DS2 程序。\n- SAS 用户在网上可以许多帮助，包括在线课程、视频、SAS 社区论坛和 SAS 技术支持。\n- 在联系 SAS 技术支持之前良好的准备将使交互更顺畅，并更快获得答案。\n\
    \n## 7.6 与作者联系\n\n我不敢相信——我写了我的第一本书！写这本书对我来说是一次非常奇妙的经历。感谢你抽出时间阅读，希望你发现 DS2 如我发现的那样有趣。我很我很听到你的声音，也许是关于你现实世界问题的反馈。欢迎通过\
    \ LinkedIn (http://linkedin.com/in/sasjedi) 与我联系，关注我的 Twitter (http://twitter.com/sasjedi)，在\
    \ SAS Post 博客 (http://go.sas.com/jedi) 上阅读我偶尔发布的“Jedi SAS Tricks”文章，或通过我的作者页面\
    \ http://support.sas.com/Jordan 与我联系。当然，非常感谢你在 Amazon、Goodreads 等平台上的评价。\n\n祝你在所有的\
    \ SAS 事务中一切顺利——愿 SAS 与你同在！\n\n"
