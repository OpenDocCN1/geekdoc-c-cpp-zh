    \ DS2 数据程序的结构更加严谨：\n\n```sas\ndata _null;\nMessage='Hello World!';\nput Message=\\\
    ;\nrun;\nproc ds2;\ndata _null();\nmethod run()\nMessage='Hello World!';\nput\
    \ Message=\\;\nend\nenddata;\nrun;\nquit;\n```\n\n主要的结构差异是 DS2 程序是在代码块中编写的。在 Base\
    \ SAS 中，DS2 语言通过 PROC DS2 块调用，该块以 PROC DS2 语句开始并以 QUIT 语句结束：\n\n```sas\nproc ds2;\n\
    <ds2 program blocks>\nquit;\n```\n\n在 PROC DS2 内部，你可以定义并执行三种基本类型的程序块。\n\n## 表\
    \ 2.2：DS2 程序块\n\n| 程序块 | 简要描述 |\n| --- | --- |\n| Data (数据) | DS2 语言的核心，数据程序处理输入数据集以生成输出结果集。它们可以接受来自表、线程程序结果集或\
    \ SQL 查询结果集的输入。 |\n| Package (包) | 包程序创建存储在 SAS 库中的变量和方法集合，实现了面向对象的开发方法。简单且高效地重用经过证明的代码模块可以确保重要专有流程的标准化，减少编写新程序的时间并提高整体代码质量。\
    \ |\n| Program Block (程序块) | 简要描述 |\n|---|---|\n| Thread (线程) | 线程处理输入数据集以生成返回给数据程序的输出结果集。线程用于同时并行处理数据行，可以接受来自表或\
    \ SQL 查询的输入。 |\n\n关于这些程序块中每个部分的详细描述请见 2.2.3 节。每个程序块由相应的 DATA、PACKAGE 或 THREAD\
    \ 语句及其对应的语句界定。DS2 使用 RUN 组处理，并要求显式编写 RUN 语句来执行之前的程序块：\n\n```sas\nproc ds2;\npackage\
    \ package_name;\n  <在此处编写创建包的 ds2 编程语句>\n  endpackage;\nrun;\nthread thread_name;\n\
    \  <在此处编写创建线程的 ds2 编程语句>\n  endthread;\nrun;\n  data output_dataset_name;\n  \
    \  <在此处编写处理数据的 ds2 编程语句>\n  enddata;\nrun;\nquit;\n```\n\n每个程序块由一组全局声明语句以及一个或多个具有唯一命名的可执行方法块组合组成。在\
    \ DS2 中，可执行语句仅在方法块的上下文中有效。方法块由 METHOD 和 END 语句界定：\n\n```sas\nproc ds2;\n  data\
    \ output_dataset_name;\n  <全局声明语句>\n  method method_name(<method parameters>);\n\
    \    <局部变量声明>\n    <可执行 DS2 编程语句>\n  end;\nenddata;\nrun;\nquit;\n```\n\n## 2.2.3\
    \ 程序块\n\n此处提供了三个程序块的简要描述，以帮助你理解本章中的简单示例。大部分内容关于数据程序。包程序将在第 5 章详细讨论，线程程序将在第 6 章。\n\
    \n### 2.2.3.1 DATA 数据程序\n\nDS2 数据程序以 DATA 语句开始，包含至少一个系统方法定义，并生成结果。它是 DS2 语言中的基础编程工具。与\
    \ Base SAS DATA 步一样，DS2 数据程序的 DATA 语句通常列出结果集将写入的表或多个表的名称。使用特殊表名 NULL 来抑制结果集是可选的。如果在\
    \ SAS DATA 步中没有指定目标表，SAS 将结果集重定向到 WORK 库，使用自动生成的数据集名称（DATA1、DATA2 等）。没有指定目标表的\
    \ DS2 数据程序将结果结果发送到输出交付系统 (ODS) 以渲染为报告。\n\n```sas\ndata:\n  set crs.banks;\n\n\
    method run();\n  set crs.banks;\n  end;\nenddata;\nrun;\n```\n\n> 注意: 从 CRS.BANKS\
    \ 读取了 3 个观测值。\n> 注意: WORK.DATA 有 3 个观测值。\n\n图 2.1：DS2 程序的输出\n\n| 名称 | 速率 |\n|---|---|\n\
    | Carolina Bank and Trust | 018 |\n| State Savings Bank | 021 |\n| National Savings\
    \ and Trust | 022 |\n\n# 掌握 SAS DS2 过程：高级数据处理技术\n\n### 2.2.3.2 包程序\n\n包程序以 PACKAGE\
    \ 语句开始，以 ENDPACKAGE 语句结束，并生成结果。与 DS2 程序一样，线程存储在 SAS 库中并类似于数据集。然而，包的内容是头部信息随后的源代码。包不仅用于用户定义方法——它们是\
    \ DS2 语言的“对象”。全局包变量（包外部定义的变量）对于每个实例充当静态变量，当你实例化包时，实例有一组私有变量可以跟踪状态。包还可以接收构造参数在实例化时初始化包。DS2\
    \ 包允许轻松创建和重用对象。\n\n### 2.2.3.3 线程程序\n\nDS2 程序以 THREAD 语句开始，以 ENDTHREAD 语句结束，并生成线程作为结果。与\
    \ DS2 程序一样，线程的结构类似于 DS2 程序，包含至少一个方法定义，并可以包含包引用和用户定义方法。一旦创建线程，可以使用 SET 语句从 DS2\
    \ 程序执行它。SET 语句中的 THREAD= 允许多个线程程序在计算平台上并行运行，每个线程在计算完成后将观测值返回给数据程序。\n\n## 2.2.4\
    \ 方法\n\n方法是 DS2 程序内部命名的代码块，由 METHOD 和 END 语句界定。方法块不支持嵌套的方法块，所有标识符（名称）在 DS2 数据、包或线程程序块中必须是唯一的。方法有两种：\n\
    \n- *系统方法*在 DS2 程序的指定时间自动执行。\n- *用户定义方法*仅在调用时执行。\n\n## 2.2.5 系统方法\n\n每个 DS2 数据程序都包含三个系统方法（隐式或显式的）。这些方法为\
    \ DS2 数据程序提供了比 SAS DATA 步更结构化的框架。在 Base SAS DATA 步中，整个程序都包含在隐式的、数据驱动的循环中。在 DS2\
    \ 程序中，RUN 方法提供了隐式的、数据驱动的循环，这对传统的 DATA 步程序员来说是最熟悉的。INIT 和 TERM 方法不在循环内，为执行程序初始化和终止代码提供了位置。\n\
    \n"
