    \ TO_DOUBLE function allows explicit conversion to a double-precision SAS value.\
    \ |\n| TIMESTAMP | Datetime | Non-coercible. TO_DOUBLE function allows explicit\
    \ conversion to a double-precision SAS DATETIME value. |\n\n# 3.3.3.1 Explicit\
    \ Conversion for Non-coercible Data Types\n\nDS2 provides functions for conversion\
