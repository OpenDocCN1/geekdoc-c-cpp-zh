    \ use and administer. I would recommend some practices that can improve usability\
    \ and make administration easier:\n\n+   - Include a user-defined CONTENTS method\
    \ in every package that you create. The CONTENTS method should not accept parameters.\
    \ When called, this method should document the package in the SAS log. At a minimum,\
    \ it should provide a list of the methods included in the package and the location\
    \ of the source code. You will need to have the entire package source code to\
    \ perform any maintenance on the package, as the whole package must be re-created\
    \ each time a change is made.\n- Every method in the package should be overloaded\
    \ with a version of the method that accepts no parameters and does nothing but\
    \ document the method in the SAS log.\n\nLet's create a simple package that includes\
    \ the two versions of our interest method and also includes the self-documenting\
    \ features discussed above:\n\n```\nproc ds2;\npackage crs.MyMethods;\n contents();\n\
    put;\n  put 'This package contains the following methods:';\nput '  - contents();';\n\
    put '  - interest();';\nput;\n  put 'Package source:';\nput %tslit(&path);\nput;\n\
