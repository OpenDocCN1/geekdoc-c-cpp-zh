    \ | For Two | 微型 | 2015 | 144 | 3.6 | 4.5 | | 2.5 | 0.0 |\n| 6 | Land Rover |\
    \ Range Rover | 全尺寸 SUV | 2010 | 48 | 6.5 | 16.0 | | 10.5 | 1.5 |\n\n首先，我们创建一个六行四列的矩阵，代表所有车辆的液体容量，并创建一个一行六列的第二个矩阵，代表每种车辆的库存。下一步是这两个矩阵的乘法。结果是一个一行四列的矩阵，包含了今年维护所需的每种液体的总量。\n\
    \n### 5.5.2.1 将数据读入/导出矩阵\n\n由于使用数组（arrays）在矩阵包之间传输数据更为方便，因此对于我们创建的每个矩阵，我们都会创建一个相应的数组或变量。我们将使用\
