    \  SAS_Datetime=HMS(21069,07,09,17.09017);\n  SAS_Date=date(SAS_Datetime);\n \
    \ SAS_Time=to_time(SAS_Datetime);\n  ANSI_Timestamp=to_timestamp(SAS_Datetime);\n\
    \  ANSI_Date=to_date(SAS_Date);\n  ANSI_Time=to_time(SAS_Time);\n  put 'SAS: '\
