    ## 图 1.2：DATA Step 中的串行处理与 DS2 并行处理


    单线程 DATA step


    SAS 计算平台上的 DS2 线程并行处理


    ![](img/ef05c3db88dda150abd07414dd206d3f_19_0.png)


    ![](img/ef05c3db88dda150abd07414dd206d3f_19_1.png)


    SAS/ACCESS LIBENAME 引擎


    DS2 线程 DBMS 驱动程序


    如图 1.2 所示，传统的 SAS DATA step 必须顺序处理每一行数据。相比之下，DS2 可以使用线程和数据程序同时处理多行数据。


    请注意，这两个过程都使用单读取线程，因此如果将数据从磁盘或 DBMS 加载到 SAS 计算平台的内存中进行处理是瓶颈，那么在 SAS 计算平台上进行线程处理将不会提高整体性能。这种情况被称为“I/O
    密集型”操作。在 Base SAS 中处理时，DS2 使用单次读取来为多个计算线程提供数据，以确保该行数据仅被分配到一个计算线程进行处理。如果 I/O 是瓶颈且计算在
    SAS 上进行，DS2 可能无法提高性能。


    然而，如今的 DBMS 数据是海量的，应该尽可能完全避免数据移动。通过 DS2，在包含 SAS 数据库内代码加速器且配置备和配置得当的 SAS 安装环境中，你的
    DS2 程序实际上可以直接在数据库硬件上执行，而无需将数据移动到 SAS 计算平台。图 1.3 比较了 SAS 计算平台上的 DS2 数据线程处理与使用 DS2
    和 SAS 数据库内代码加速器的数据库内处理。


    ## 精通 SAS DS2 过程：高级数据清洗技术


    图 1.3：使用线程的并行处理：SAS 计算平台与数据库内处理


    # SAS 计算平台上的 DS2 线程并行处理


    # 数据库内 DS2 线程并行处理


    ![](img/ef05c3db88dda150abd07414dd206d3f_20_0.png)


    如图 1.3 所示，结合 SAS 数据库内代码加速器使用 DS2 线程和数据程序，允许 DS2 代码在海量并行 DBMS 硬件上编译和执行。如果过程从 DBMS
    表读取数据并写入 DBMS 表，则只有代码进入 DBMS，处理在数据库内部进行。这种“代码去数据”的概念大大减少了数据移动，扩展了 DBMS 的计算能力，并充分利用了其大规模并行处理
    (MPP) 能力。


    ### 1.1.1 本书简介


    数据清洗（Data wrangling），正如我们所定义的，不仅仅是清洗数据为分析做准备。数据清洗人员从各种来源获取数据，然后以独特的方式进行组织和组合以获得新的洞察。本书将教你如何使用
    DS2 进行数据清洗，并提升数据处理速度。


    ## 第 1 章：入门 5


    完成本课程后，你将能够：


    - 识别该语言设计的处理类型，并理解在尝试提高 DATA step 执行性能时选择 DS2 的条件

    - 识别 DATA step 和 DS2 程序共享的编程语句和函数

    - 识别 DS2 中不提供的 DATA step 功能及其原因

    - 了解传统 DATA step 中哪些 DS2 程序功能

    - 在 DS2 程序中操作 ANSI 数据类型

    - 理解处理包含 SAS 缺失值和 ANSI 空值的数据时的影响

    - 将 Base SAS 数据处理过程从 DATA step 转换为 DS2 程序

    - 理解 DS2 系统方法及其与传统 DATA step 构造的关系

    - 创建 DS2 方法以扩展 DS2 语言的功能

    - 将 DS2 方法存储在包并在后续 DS2 程序中重用

    - 使用 DS2 程序创建面向程序

    - 使用预定义的 DS2 包为你的 DS2 数据程序添加功能

    - 创建 DS2 线程程序并在 DS2 程序中执行以对数据记录进行并行处理

    - 在 DS2 程序或线程中使用 BY-GROUP 以及 FIRST.variable 和 LAST.variable 处理执行自定义数据汇总，无需预设数据

    - 确定你的系统是否具有在数据库内执行 DS2 程序的能力，并在 MPP 平台上分布式执行你的 DS2 线程程序


    ### 1.1.2 先验知识


    本书是为经验丰富的 Base SAS 程序员编写的。在开始之前，你可能希望熟悉以下关键概念。你可以从 SAS Press 的其他书籍获取先验知识，例如 Ron
    Cody 的《An Introduction to SAS University Edition》或 Lara Deliche 和 Susan Slaughter
    的《The Little SAS Book: A Primer》。


