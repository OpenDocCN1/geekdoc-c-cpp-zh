    ## 团队协作


    许多程序员在团队中工作。团队对于分配工作、构思新点以及解决问题非常有帮助。程序员可能会因为他们为团队带来的特殊技能而被分配特定的任务。团队也是程序员分享知识和学习新技能的绝佳方式。


    ![](img/40f5547c988795f8089b3518c78a314c_57_0.png)


    ## 图形程序员


    如今的应用程序色彩斑纷、引人注目，且细节惊人。图形程序员从事应用程序开发，因为他们擅长字体设计、动作设计（用于游戏）和艺术创作等领域。


    ![](img/40f5547c988795f8089b3518c78a314c_57_1.png)


    图形程序员会从应用程序员那里获得关于设计的指令和反馈。


    ![](img/40f5547c988795f8089b3518c78a314c_57_2.png)


    应用程序员会通过与用户交流，将应用程序运行过程中出现的任何问题告知系统程序员。


    ## 应用程序员


    通常有一位或多位程序员负责创建应用程序的外观以及人们使用方式。这些应用程序员经常与客户紧密合作，以确保应用程序满足他们的需求。


    ## 网页程序员


    网站通常在后台运行着代码，控制着在线支付和视频加载等功能。网页程序员创建这些代码。每天都有数百万互联网用户使用这些代码。


    ![](img/40f5547c988795f8089b3518c78a314c_57_3.png)


    网站的代码通常根据应用程序员的设计请求来构建。


    ## 游戏程序员


    游戏是最受欢迎的应用程序类型之一，整个团队由程序员组成，他们理解如何创建用于评分、关卡和爆炸等功能的特殊代码。


    ## 系统程序员


    手机、平板电脑和电脑运行着软件，允许应用程序与它们进行通信。系统程序员经常需要创建代码，以便应用程序能够在不同的操作系统上运行。


    网页程序员经常需要系统程序员为不同的网页浏览器制作特殊代码。


    游戏程序员在设计游戏外观和玩家使用方式时会使用应用编程。


    游戏程序员需要理解音频编程，以便创建游戏中的声音。


    ## 音频程序员


    声音对于许多类型的应用程序都很重要，尤其是游戏。音频程序员为你在使用应用程序时听到的声音创建代码。


