    ![](img/40f5547c988795f8089b3518c78a314c_48_1.png)


    The script being built is for the current sprite shown.


    The blocks slot together, making sets of instructions that tell the sprite what
    to do.


    Sword moves down.


    ![](img/40f5547c988795f8089b3518c78a314c_48_2.png)


    > WOW!

    Scratch is used in more than 150 countries around the world.


    Pirate costume 1

    Costumes are pictures of sprites in different poses. Swapping costumes can make
    this pirate move.


    Pirate costume 2

    When switching from costume 1 to costume 2, the pirate''s leg and sword appear
    to move.


    Leg moves out.'
  - '[PAGE 49]


    # Raspberry Pi


    The Raspberry Pi is a mini-computer, made to teach people how computers work.
    It connects to all kinds of devices, such as TVs, cameras, and even robots, and
    has enough power to run similar programs to a full-sized computer.


    ![](img/40f5547c988795f8089b3518c78a314c_49_0.png)


    # Micro SD card


    A tiny memory card stores the operating system, programs, and data.


    ![](img/40f5547c988795f8089b3518c78a314c_49_1.png)


    ![](img/40f5547c988795f8089b3518c78a314c_49_2.png)


    # Connector for LCD display panel


    A liquid crystal display (LCD) panel can be connected to this port.


    ![](img/40f5547c988795f8089b3518c78a314c_49_3.png)


    # HDMI video


    A computer screen or modern television can be connected to this port.


    ![](img/40f5547c988795f8089b3518c78a314c_49_4.png)


    # Camera port


    Attaching a camera lets the Pi take photos and videos.'
- md: "\n# Pi in action\n\nJapanese engineer Shota Ishiwatari created the human-like\
    \ robot 'Rapiro', which works with a Raspberry Pi. The Rapiro has eyes that can\
    \ be lit up with LED lights, and can walk and move its arms.\n\n# GPIO pins\n\n\
    Lights or buzzers can be attached to these pins. They light up or sound when the\
    \ Pi is in use.\n\n![](img/40f5547c988795f8089b3518c78a314c_50_0.png)\n\n# USB\
    \ ports\n\nA mouse and keyboard can be connected to these ports for use with a\
    \ computer screen.\n\n![](img/40f5547c988795f8089b3518c78a314c_50_1.png)\n\n#\
    \ LAN port\n\nThe Raspberry Pi can access the Internet with a wired connection\
    \ using this port.\n\n![](img/40f5547c988795f8089b3518c78a314c_50_2.png)\n\n#\
    \ Audio output\n\nHeadphones or speakers can be connected here for listening to\
    \ music.\n\n![](img/40f5547c988795f8089b3518c78a314c_50_3.png)\n\n> More than\
    \ 11 million Raspberry Pis have been sold since its release in 2012.\n\n# Key\
    \ coders\n\nComputing has changed a lot since the first computers were invented,\
    \ and programmers across the globe are working on new technology all the time.\
    \ Some people create things that change our world. How many of these famous coders\
    \ do you know about?\n\n![](img/40f5547c988795f8089b3518c78a314c_51_0.png)\n\n\
    # TIM BERNNNERS-LEE\n\nEnglish computer programmer Tim Berners-Lee created the\
    \ World Wide Web in links in 1989. The World Wide Web links web pages together,\
    \ and is now used by millions of people across the globe.\n\n![](img/40f5547c988795f8089b3518c78a314c_51_1.png)\n\
    \n# GRACE HOPPER\n\nA Rear Admiral in the US Navy as well as a computer scientist,\
    \ Grace Hopper created the world's first computer compiler – a program that converts\
    \ ordinary language into code that a computer can understand.\n\n![](img/40f5547c988795f8089b3518c78a314c_51_2.png)\n\
    \n# MARK ZUCKERBERG\n\nUniversity student Mark Zuckerberg became one of the youngest\
    \ billionaires in the world when he created social media website Facebook in 2004.\
    \ The site had one million users within ten months.\n\n# MARGARET HAMILTON\n\n\
    American computer programmer Margaret Hamilton worked for the US space agency,\
    \ NASA. She was responsible for developing the on-board flight software that landed\
    \ the first people on the Moon in 1969.\n\n# STEVE JOBS AND STEVE WOZNIAK\n\n\
    Founders of technology company Apple, Americans Steve Jobs and Steve Wozniak built\
    \ one of the earliest home computers in 1976. Now the Apple brand is one of the\
    \ most successful in the world.\n\n# BILL GATES\n\nAmerican Bill Gates co-founded\
    \ Microsoft, a computer software company, in 1975. Ten years later, Microsoft\
    \ created Windows, the most widely used operating system.\n\n# SERGEY BRIN AND\
    \ LARRY PAGE\n\nGoogle, the world's most popular search engine, was created by\
    \ Sergey Brin and Larry Page in 1998. Today, around 80 to 85 percent of all Internet\
    \ queries are typed into Google's search engine.\n\n# Meet the expert\n\nCoder\
    \ and author Jeff Atwood co-created Stack Overflow, a website for answering questions\
    \ about coding, and Discourse, a program for communicating online.\n\n- Q: We\
    \ know it is something to do with coding, but what is your actual job?\nA: My\
    \ job is to write commands that tell the computer what to do, and commands that\
    \ make it do a better job.\n\n- Q: Do you use any special equipment?\nA: We use\
    \ fast computers, with lots of memory. We also use multiple monitors and nice\
    \ chairs.\n- Q: What do you love most about coding?\nA: Software is easy to change\
    \ to make it better, and software can also encourage people to do better things\
    \ and help others.\n- Q: What is a usual work day for you?\nA: I work from home,\
    \ so I get up and head to my home office. I talk to my team via the Internet.\n\
    - Q: What are the best and worst things about your job?\nA: The best thing about\
    \ my job is that software can touch so many people – through their smartphones,\
    \ through their laptops and computers. The worst thing about my job is that I\
    \ spend a lot of time talking to the computer. It can be unforgiving when you\
    \ make mistakes, even tiny ones!\n\n![](img/40f5547c988795f8089b3518c78a314c_53_0.png)\n\
    \n```c\nvoid main() {\n    printf(\"Hello, World!\");\n}\n```\n\n- Q: What made\
