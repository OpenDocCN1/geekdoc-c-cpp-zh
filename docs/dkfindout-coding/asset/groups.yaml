    ![](img/40f5547c988795f8089b3518c78a314c_5_1.png)\n\n# What is a coder?\nCoders,\
    \ or programmers, are people who write the code for computers – a set of instructions\
    \ that tell computers what to do. Many coders teach themselves how to code, others\
    \ learn at school. Coders need a variety of different skills in order to build\
    \ good programs.\n\n# Code in teams\nWhile many coders work alone, most of them\
    \ work in teams. Working in teams programs are finished faster and with fewer\
    \ errors. Teamwork helps coders learn skills from others.\n\n# Logical thinking\n\
    Computers follow rules and logic when running programs. Coders need to be able\
    \ to think like a computer when writing code, and build all the steps necessary\
    \ for the program to work.\n\n# Many languages\nBeing able to code in different\
    \ languages is a valuable skill. It is important for programmers to keep learning\
    \ coding in order to create modern programs. Pepper the robot allows Pepper to\
    \ read feelings. A typical coder's screen is filled with code like this:\n\n```javascript\n\
    var type = \"image\";\nvar currentImage = document.getElementById(\"image\");\n\
    currentImage.src = \"images/\" + type + \".png\";\nfunction updatePage() {\n \
    \ var html = \"<div style=\\\"width:300px\\\" class=\\\"page\\\">\";\n  html +=\
    \ \"<div style=\\\"text-align:center\\\">\";\n```\n\n### Staying up to date\n\
    Technology is constantly changing. Coders must stay up to date with the latest\
    \ programming languages and techniques. This can help them find jobs and build\
    \ programs for the latest devices.\n\n# Accuracy\nCoders must always check and\
    \ re-check code to make sure programs work. The instructions need to be clear,\
    \ detailed, and broken down into small chunks that are easy to follow.\n\n###\
    \ Space code\nAstronaut and flight engineer Sunita Williams uses her laptop whilst\
    \ in space.\n\n# How do you become a coder?\nYou're never too young to learn how\
    \ to code. There are many books that teach coding, as well as plenty of information\
    \ online. You can also learn to code at school, or you could find out if there\
    \ are any clubs near you.\n\n### Micro:bit\nUsed in schools to teach coding.\n\
    \n### Raspberry Pi\nA mini-computer that shows people how computers work.\n\n\
    # Codes around us\nWhen we think of coding we think of computers but codes are\
    \ all around us. Throughout history, humans have created many different codes\
    \ for communicating. Some codes are used to send secret messages, while others\
    \ deliver information across long distances. People who cannot see or hear can\
    \ use codes to speak to each other.\n\nBlind people use their hands to read Braille.\n\
    \n# Morse code\nMorse code sent messages long distance along electric wires. Each\
    \ letter was represented by a series of dots and dashes tapped out on a special\
    \ machine.\n\n| Letter | Code |\n| :--- | :--- |\n| A Y | 1 |\n| B N | 2 |\n|\
    \ C O | 3 |\n| D P | 4 |\n| E Q | 5 |\n| F S | 6 |\n| G T | 7 |\n| H U | 8 |\n\
    | I V | 9 |\n| J W | 0 |\n\nThis is a short sound, or a dot.\nThis is a long sound,\
    \ or a dash.\n\nWOW!\nThe Ancient Egyptians had more than 700 different hieroglyphs.\n\
    \n### Picture language\nAncient Egyptians didn't have an alphabet system. Instead,\
    \ they used a series of pictures called hieroglyphs to represent sounds and words.\n\
    \nThis stone is covered with hieroglyphs.\n\n## Semaphore flags\nSemaphore is\
    \ a system of signalling with hand-held flags. It is often used by ships at sea\
    \ because the flags are easy to see from far away. The flags are held in different\
    \ positions to signal letters and numbers.\n\n## Braille\nSome blind people use\
    \ a system called Braille to read and write. Different sets of raised dots represent\
    \ letters and numbers.\n\n## Sign language\nAs deaf people can't hear sounds,\
    \ they can use sign language to communicate. Letters, numbers, and words can be\
    \ shown using a variety of hand signs.\n"
  mdcn: "\n\n# findout! 编码\n\n![](img/40f5547c988795f8089b3518c78a314c_0_0.png)\n\n\
    你想发现什么？\n趣味冷知识、惊奇图片、测试\n\n# findout! 测试\n测试你对代码的认知，并发现更多有趣的冷知识！\n\n1 德国人在第二次世界大战中使用什么机器对信息进行加密？\n\
    2 什么是树莓派（Raspberry Pi）？\n3 什么是弹乓游戏（Pong）？\n4 什么是应用（app）？\n5 什么是帕斯林计算（Pascaline）？\n\
    6 哪个游戏的销量超过了5亿份？\n7 谁发明了炸弹机（Bombe）？\n8 哪种类型的代码使用击字机？\n9 谁创建了 Facebook？\n10 什么是\
    \ Python？\n\n# 翻面答案\n\n# 编码历史\n\n软件历史上出现过一些惊人的发现，软件是告诉计算机如何工作以及做什么的程序。\n\n![](img/40f5547c988795f8089b3518c78a314c_2_0.png)\n\
    \n### 电子邮件\n雷·汤姆林（Ray Tomlinson）创建了第一个用于发送数字信息的电子邮件程序。\n\n### WordStar\nMicropro\
    \ 发布了第一个文字处理器，让人们能够轻松在计算机上写作。\n\n### 计算机病毒\n“大脑”（Brain）是第一个全球计算机病毒。它通过软盘在计算机之间传播。\n\
    \n### 社交媒体\n世界上第一个社交媒体网络诞生了。它被称为 SixDegrees。\n\n![](img/40f5547c988795f8089b3518c78a314c_2_1.png)\n\
    \n| 年份 | 事件 |\n| :--- | :--- |\n| 1969 | ARPANET：第一台计算机网络建立，形成了今天现代互联网的基础。 |\n\
    | 1971 | Apple Lisa于1983年发布，是最早的个人桌面电脑之一。 |\n| 1979 | MacPaint 和 MacWrite：Apple\
    \ 随其 Macintosh 电脑发布了两个程序，允许用户在计算机上绘图和写作。 |\n| 1984 | 互联网浏览器：世界上第一个互联网浏览器 Mosaic\
    \ 发布。 |\n| 1986 | HTML5：万维网的原始 HTML 代码更新为 HTML5，让编码员更容易使用。 |\n| 1992 | |\n| 2003\
    \ | |\n| 2014 | |\n\n![](img/40f5547c988795f8089b3518c78a314c_2_2.png)\n\n需要发现的内容：\n\
    \n# DK 发现百科！\n\n# 编码\n\n![](img/40f5547c988795f8089b3518c78a314c_4_0.png)\n\n\
    作者：James Floyd Kelly\n\n# 目录\n\n![](img/40f5547c988795f8089b3518c78a314c_5_0.png)\n\
    \n高级编辑 Lizzie Davey\n设计师 Emma Hobson\n项目编辑 Manisha Majithia, Ishani Nandi\n艺术编辑\
