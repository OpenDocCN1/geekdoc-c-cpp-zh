    # Programs


    Whether you say program, app, or code, what you''re describing is a special set
    of instructions called “software”. Most modern devices are controlled by software.
    This includes mobile phones, tablets, satellites in space, cars, planes, and even
    robots on Mars. Software is all created by programmers, who are also known as
    coders.


    # Mobile apps


    Each app on a phone or tablet is a tiny program that works by itself. Apps can
    do all sorts of things. They let you take photos, send messages, and play music
    and games.


    # Drones


    Drones are devices that do not need a pilot to make them fly. Instead, a person
    uses a remote control and special software. They are used to take photos and videos.


    ![](img/40f5547c988795f8089b3518c78a314c_37_0.png)


    ![](img/40f5547c988795f8089b3518c78a314c_37_1.png)'
  - '[PAGE 38]


    # From coder to user


    There''s more to apps than just code. Coders spend a lot of time making their
    apps work smoothly, but they need to get the app out to all the people who use
    it. Someone has to create instructions for using the app. Sometimes the app needs
    some help in the forms of advertising and marketing, and word of mouth is a great
    way to do this. Sharing and talking about the app means that it can get a lot
    more users, and could even go viral. This means that it has been spoken about
    and shared between many people.


    ![](img/40f5547c988795f8089b3518c78a314c_38_0.png)


    > There''s an app for that!


    # Surgical robots


    Some surgeons rely on robots to help with the most delicate operations. The robot
    has special code for each of its arms that help the surgeon with important tasks.


    # Mars Rover


    The Mars Exploration Rover B is exploring the surface of Mars. It uses special
    code that allows it to work over 225 million km (140 million miles) away from
    Earth.


    ![](img/40f5547c988795f8089b3518c78a314c_38_1.png)'
  - '[PAGE 39]


    # Worms and bugs


    Computers don’t always run smoothly. Some people spread bad code, such as worms,
    to damage or steal information on a computer. Programs may also stop working if
    there are errors in the code. These are called bugs. Anti-virus programs and “firewalls”
    are software that can protect computers from bad code.


    ![](img/40f5547c988795f8089b3518c78a314c_39_0.png)


    Computer errors have been called bugs since 1945, when a university computer in
    the USA was found to have a moth inside it.


    ![](img/40f5547c988795f8089b3518c78a314c_39_1.png)


    # Computer hackers


    Hackers are people who write bad programs, called malware, to gain illegal access
    to a computer. They can then steal information, like passwords or personal details.
    They can also damage or delete important data on the computer.


    ![](img/40f5547c988795f8089b3518c78a314c_39_2.png)


    # Trojan horse


    A Trojan horse is a file that pretends to be harmless. Once opened, however, it
    loads a program that takes control of your computer.


    ![](img/40f5547c988795f8089b3518c78a314c_39_3.png)


    ![](img/40f5547c988795f8089b3518c78a314c_39_4.png)


    ![](img/40f5547c988795f8089b3518c78a314c_39_5.png)


    ![](img/40f5547c988795f8089b3518c78a314c_39_6.png)


    ![](img/40f5547c988795f8089b3518c78a314c_39_7.png)


    ![](img/40f5547c988795f8089b3518c78a314c_39_8.png)


    # Computer virus


    A virus is a type of malware that attaches itself to a program on a computer and
    runs automatically, destroying files.


    # Backdoor programs


    Backdoor programs ignore your computer’s normal security and allow hackers to
    break in without a password.


    ![](img/40f5547c988795f8089b3518c78a314c_39_9.png)


    ![](img/40f5547c988795f8089b3518c78a314c_39_10.png)'
  - "[PAGE 40]\n\n# Vulnerability scanners\n\nHackers use programs called vulnerability\
    \ scanners to look for weaknesses in a computer’s “firewall” (protection) system.\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_40_0.png)\n\n# Sniffers\n\nSniffers\
    \ monitor information travelling over a computer network. They capture the passwords\
    \ and user IDs of anyone using the network.\n\n![](img/40f5547c988795f8089b3518c78a314c_40_1.png)\n\
    \n# Computer worms\n\nComputer worms infect networks by sending copies of themselves\
    \ to all the machines in the system. They are harder to stop than viruses because\
    \ they do not have to attach themselves to a program.\n\n![](img/40f5547c988795f8089b3518c78a314c_40_2.png)\n\
    \n# Keylogging\n\nKeylogging lets hackers monitor every key that is pressed on\
    \ someone's keyboard without knowing them. They lets see the user’s passwords\
    \ or other private information.\n\n![](img/40f5547c988795f8089b3518c78a314c_40_3.png)\n\
    \n# Bugs\n\nA bug is a mistake or fault found in a computer program or system.\
    \ Bugs can cause a program to run incorrectly - for example, showing strange text\
    \ or objects on the screen. They can also cause a program to stop working completely.\n\
    \n```\nswitch (i) {\n  case 1:\n    do_something(1); break;\n  case 2:\n    do_something(2);\
    \ break;\n  case 3:\n    do_something(3); break;\n  case 4:\n    do_something(4);\
    \ break;\n  default:\n    break;\n}\n```\n\n> This is an error in the code — Case\
    \ 1 has incorrectly been copied under case 3.\n\n![](img/40f5547c988795f8089b3518c78a314c_40_4.png)"
