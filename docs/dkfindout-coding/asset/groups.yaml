    ## 社交功能无法使用

    社交网络应用让你随时与朋友聊天。


    ## 发送文件

    互联网让我们即时共享和下载文件。如果没有它，我们只能通过计算机之间的线缆进行共享，或者通过邮寄副本来分享。


    你可以与大量朋友同时聊天、安排会面并分享最新消息。


    ## 购物

    你可以通过互联网购买几乎你需要的任何东西，从食物饮料到巨大的塑料象！所有物品都会通过邮寄送给你，所以你不需要去商店。


    ## 看什么呢？

    互联网让我们即时观看电影。我们只需点击按钮即可下载任何想要的内容，而不需要寻找和观看 DVD。


    ![](img/40f5547c988795f8089b3518c78a314c_42_0.png)


    ## 什么是 App？

    App 是用代码编写的指令集。它们主要用于手机和平板，完成许多不同的任务，从玩游戏到打视频电话。有很多专门为孩子设计的 App。


    ![](img/40f5547c988795f8089b3518c78a314c_43_0.png)

    ![](img/40f5547c988795f8089b3518c78a314c_43_1.png)


    ## 游戏

    问答、比赛和谜题都是有趣且流行的游戏 App 类型。有些是免费的，但另一些会对游戏内项目收费，所以要小心！


    ## 购物

    购物 App 让人们无需出门就能买东西。大多数大型商店都有 App。你还可以和其他人竞标拍卖来购买物品。


    ## App 开发

    你手机或电脑上的 App 并不是凭空出现的。从一个想法到变成完成的程序，需要大量的工作。以下是实现方法。


    ![](img/40f5547c988795f8089b3518c78a314c_43_2.png)

    ![](img/40f5547c988795f8089b3518c78a314c_43_3.png)


    ### 想法

    人们对新 App 有想法。这些 App 通常尝试实现一些目前还没有 App 实现的实用功能。


    ### 设计

    App 的外观以及人们如何它的它很重要。流行的 App 通常看起来精美且易于使用。


    ## 智能手机

    智能手机是你随身携带的微型计算机。与台式电脑不同，它们足够小可以在途中使用。智能手机拥有操作系统。这是一个内置的指令集，让 App 运行。苹果的 iOS 和谷歌的
    Android 是最流行的两个操作系统。


    ![](img/40f5547c988795f8089b3518c78a314c_44_0.png)


    手机运行中

    ![](img/40f5547c988795f8089b3518c78a314c_44_1.png)

    ![](img/40f5547c988795f8089b3518c78a314c_44_2.png)


    ## 地图


    ## 通信

    手机不仅仅用于通话。App 让人们以许多不同的方式交流，包括视频通话、图片消息和群聊。


    ![](img/40f5547c988795f8089b3518c78a314c_44_3.png)

    ![](img/40f5547c988795f8089b3518c78a314c_44_4.png)

    ![](img/40f5547c988795f8089b3518c78a314c_44_5.png)


    ## 编程

    每个 App 都由代码组成。在 App 发布之前，代码经过多次测试以确保其正常工作。


    ## 反馈

    一旦 App 开始使用，人们会对哪些功能有效、哪些不起作用提供反馈。程序员会不断调整代码，直到它完美运行。


    哇！在 2016 年，智能手机可用 App 超过两百万。


    ## 日常编码

    虽然我们看不代码，但代码无处不在，每天帮助着我们。计算机使用代码让现代技术顺畅运行。以下是生活中编码的一些示例。


    ## 交通灯

    编码用于控制许多城镇和城市的交通流量。计算机向交通灯发送编码指令，告诉它们变换。司机和行人知道何时停止，何时通过。

    ![](img/40f5547c988795f8089b3518c78a314c_45_0.png)


    ## 电脑游戏

    电脑游戏可以带领玩家进入虚拟世界。每个游戏都有代码在后台运行，让你的角色跳跃或移动。

    ![](img/40f5547c988795f8089b3518c78a314c_45_1.png)


    ## 自动售卖机

    当你投入货币并选择后，售卖机的代码会计算你需要多少找零，并将物品掉到盘子里供你取用。

    ![](img/40f5547c988795f8089b3518c78a314c_45_2.png)


    ## 微波炉

    当你按下微波炉上的按钮时，简单的编码指令会控制微波炉的计时和加热温度。

    ![](img/40f5547c988795f8089b3518c78a314c_45_3.png)


    ## 条码扫描

    商店里的每件物品都有唯一的线条代码来识别。这些线条（条码）由计算机读取并在数据库中找到物品及其价格，以便你购买。

    ![](img/40f5547c988795f8089b3518c78a314c_46_0.png)


    ## 车辆

    汽车使用计算机代码监控发动机并确保其运行正常。代码还控制转向灯等功能。


    ## 智能板

    这些大屏幕使用计算机编码指令让学生选择并控制显示的信息。他们只需触摸屏幕。

    ![](img/40f5547c988795f8089b3518c78a314c_46_1.png)


    ## 计算器

    计算器使用代码计算数学题答案。结果立即显示在屏幕上。

    ![](img/40f5547c988795f8089b3518c78a314c_46_2.png)


    ## Scratch

    Scratch 是最容易的编程语言之一。程序通过组合彩色区块来告诉屏幕上的角色做什么。Scratch 让你制作自己的故事、游戏和艺术。


    ## Scratch 布局

    屏幕布局右侧有放置指令的空间。左侧是“舞台”，你的代码在此运行。

    - 指令区块被称为脚本。

    - 你可以根据项目更改背景图片。

    - Scratch 中的角色被称为 Sprite。

    - 区块包含许多不同的指令。

    ![](img/40f5547c988795f8089b3518c78a314c_47_0.png)


    ## 关于 Scratch 的事实

    1. Scratch 发于美国麻省理工学院（MIT）。

    2. Scratch 支持 40 多种语言，在全球范围内使用。

    3. 在没有网络时，可以使用离线版本的 Scratch。


    ## 角色 (Sprites)

    Sprite 是 Scratch 中使用的角色。它们由编码指令集控制。Sprite 可以移动、在气泡中说话以及出现和消失。

    ![](img/40f5547c988795f8089b3518c78a314c_48_0.png)


    ### 绘制你自己的角色

    Scratch 有许多可选择的 Sprite。还有一个绘画工具让你创建自己的。

    ![](img/40f5547c988795f8089b3518c78a314c_48_1.png)


    正在构建的脚本用于当前显示的 Sprite。区块相互组合在一起，告诉 Sprite 该做什么。

    剑向下移动。

    ![](img/40f5547c988795f8089b3518c78a314c_48_2.png)


    哇！Scratch 被全球 150 多个国家使用。


    海盗装扮 1

    服装是不同姿态的 Sprite 图片。切换服装可以让这个海盗移动。


    海盗装扮 2

    从装扮 1 切换到装扮 2 时，海盗的腿和剑似乎在移动。

    向外移动。


    ## 树莓派

    树莓派是一种微型计算机，用于教人们计算机是如何运作的。它可以连接到各种设备，如电视、摄像头甚至机器人，并有足够的功率运行全尺寸计算机类似的程序。

    ![](img/40f5547c988795f8089b3518c78a314c_49_0.png)


    ## Micro SD 卡

    微型内存卡存储操作系统、程序和数据。

    ![](img/40f5547c988795f8089b3518c78a314c_49_1.png)

    ![](img/40f5547c988795f8089b3518c78a314c_49_2.png)


    ## LCD 显示面板接口

    液晶显示器（LCD）面板可以连接到此端口。

    ![](img/40f5547c988795f8089b3518c78a314c_49_3.png)


    ## HDMI 视频

    计算机屏幕或现代电视可以连接到此端口。

    ![](img/40f5547c988795f8089b3518c78a314c_49_4.png)


    ## 摄像头接口

    连接摄像头让树莓派能够拍摄照片和视频。


