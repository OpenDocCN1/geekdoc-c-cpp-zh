    \ through their laptops and computers. The worst thing about my job is that I\
    \ spend a lot of time talking to the computer. It can be unforgiving when you\
    \ make mistakes, even tiny ones!\n\n# Gaming\n\nAlthough they were once a rare\
    \ hobby, people now spend more money on games than music or films. They can be\
    \ played on own, or with friends, and range from fast-paced action games to story-focused\
    \ roleplaying.\n\n> Tetris is the most popular video game ever, with 500 million\
    \ copies sold.\n\n![](img/40f5547c988795f8089b3518c78a314c_55_0.png)\n\n# Games\
    \ console\n\nVideo game consoles like Xbox or PlayStation are also computers,\
    \ but their hardware is dedicated to playing games. This allows them to offer\
    \ advanced graphics and sound. Competition is fierce between different brands\n\
    \n# Mobile gaming\n\nGames consoles get smaller all the time. Games that used\
    \ to be too advanced for a computer can now be played, often for free, on phones\
    \ or tablets. Some even use cameras to set the game in the world.\n\n![](img/40f5547c988795f8089b3518c78a314c_55_1.png)\n\
    \n# Online gaming\n\nEarly computer games had only one player. These days, online\
    \ gaming means millions of people can play together in “massively multiplayer”\
    \ games, or share their gaming experience online. Some famous gamers attract an\
    \ audience of millions.\n\n![](img/40f5547c988795f8089b3518c78a314c_56_0.png)\n\
    \n# Special controls\n\nNot all game controllers use buttons. Some look like instruments,\
    \ dance mats, or even steering wheels. Motion controls allow gamers to play without\
    \ a controller at all, as the game “watches” the player and responds to their\
    \ movements.\n\n![](img/40f5547c988795f8089b3518c78a314c_56_1.png)\n\n# Virtual\
    \ reality\n\nThe next big step in gaming is virtual reality. A headset can surround\
    \ players with lifelike graphics that respond to their movements, so they feel\
    \ like they are inside the game.\n\n![](img/40f5547c988795f8089b3518c78a314c_56_2.png)\n"
  mdcn: "\n\n# 树莓派的应用\n\n日本工程师石渡翔（Shota Ishiwatari）创造了名为“Rapiro”的类机器人，它通过树莓派运行。Rapiro\
    \ 有眼睛可以用 LED 灯点亮的眼睛，并且走路并移动手臂。\n\n# GPIO 引脚\n\n这些引脚可以连接灯光或蜂鸣器。当树莓派运行时，它们会亮起或发出声音。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_50_0.png)\n\n# USB 端口\n\n鼠标和键盘可以连接到这些端口，与电脑配合使用。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_50_1.png)\n\n# 以太网端口\n\n树莓派可以通过此端口通过有线连接访问互联网。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_50_2.png)\n\n# 音频输出\n\n耳机或扬可以连接到这里听音乐。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_50_3.png)\n\n> 自2012年发布以来，树莓派的销量已超过了1100万台。\n\
    \n# 关键程序员\n\n自从第一台计算机发明以来，计算领域发生了巨大的变化，全球的程序员一直在不断开发新技术。有些人创造了改变我们世界的事物。你认识这些著名的程序员有多少？\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_51_0.png)\n\n# 蒂姆·伯纳斯-利\n\n英国计算机程序员蒂姆·伯纳斯-利（Tim\
    \ Berners-Lee）在1989年发明了万维网。万维网将网页连接在一起，现在被全球数百万人使用。\n\n![](img/40f5547c988795f8089b3518c78a314c_51_1.png)\n\
    \n# 格蕾丝·霍珀\n\n格蕾丝·霍珀（Grace Hopper）是美国海军一名少将，也是一位计算机科学家，她创造了世界上第一个计算机编译器——一种将普通语言转换为计算机可以理解的代码程序。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_51_2.png)\n\n# Mark·扎克伯格\n\n大学学生马克·扎克伯格（Mark\
    \ Zuckerberg）在2004年创立社交媒体网站Facebook时，成为了世界上最年轻的亿万富翁之一。该网站在十个月内就拥有了一百万用户。\n\n#\
    \ 玛格丽特·汉密尔顿\n\n美国计算机程序员玛格丽特·汉密尔顿（Margaret Hamilton）曾任职于美国航空航天局（NASA）。她负责开发1969年将人类送上月球的飞行软件。\n\
    \n# 斯蒂夫·乔布斯和斯蒂夫·沃兹尼亚克\n\n科技公司苹果的创始人，美国人斯蒂夫·乔布斯（Steve Jobs）和斯蒂夫·沃兹尼亚克（Steve Wozniak）在1976年制造了最早的家用电脑之一。现在苹果是世界上最成功的品牌之一。\n\
    \n# 比尔·盖斯\n\n美国人比尔·盖斯（Bill Gates）在1975年共同创立了计算机软件公司微软。十年后，微软创建了Windows，这是应用最大的操作系统。\n\
    \n# 谢尔格·布林和拉里·佩奇\n\n全球最流行的搜索引擎Google是由谢尔格·布林（Sergey Brin）和拉里·佩奇（Larry Page）在1998年创立的。今天，大约80到85%的互联网查询是在Google搜索引擎中完成的。\n\
    \n# 认识专家\n\n程序员兼作家杰夫·阿特伍德（Jeff Atwood）共同创立了Stack Overflow（一个回答问题的网站）以及Discourse（一个在线交流程序）。\n\
    \n- Q：我们知道这是关于编程的，但你的实际工作是什么？\nA：我的工作是写指令告诉计算机做什么，并让它做得更好。\n\n- Q：你使用特殊的设备吗？\n\
    A：我们使用带有大量内存的计算机。我们还使用多个显示器和舒适的椅子。\n\n- Q：你最喜欢编程的什么？\nA：软件很容易变得更好，软件还可以鼓励人们做更好的事情并帮助他人。\n\
    \n- Q：你的日常工作是怎样的？\nA：我在家里工作，所以我起床后就在办公室。我通过互联网与团队交流。\n\n- Q：你工作中最好和最坏的部分是什么？\n\
    A：我工作中最好的部分是软件可以触及许多人——通过他们的手机、笔记本电脑和电脑。我工作中最坏的部分是花费大量时间与计算机交流。当你犯错时（即使是微小的错误），它也是不留情的。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_53_0.png)\n\n```c\nvoid main() {\n\
    \    printf(\"Hello, World!\");\n}\n```\n\n- Q：成为软件开发者？我一直很喜欢计算机，我发现我可以建立自己的游戏——我被迷住了。\n\
    \n- Q：你有什么开发过的最喜欢的东西吗？\nA：我们建立了Stack Overflow，它就像程序员的百科全书！\n\n![](img/40f5547c988795f8089b3518c78a314c_53_1.png)\n\
    \n# 认识专家\n\n我们遇到了计算机科学家Kiki Prottman。她是code.org的课程经理，目标是让更多人参与编程。\n\n- Q：我们知道这是关于编程的，但你的实际工作是什么？\n\
    A：我走遍各地，向学生和老师展示如何像科学家一样思考。\n\n- Q：成为计算机科学家？\nA：当我还是女孩时，我爸爸教我编程。我喜欢计算机科学中的解决问题和创造力。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_54_0.png)\n\n![](img/40f5547c988795f8089b3518c78a314c_54_1.png)\n\
