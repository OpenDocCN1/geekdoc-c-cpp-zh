    \n```java\nclass Hello, WorldApp {\n    public static void main (String[] args)\
    \ {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n```php\n\
    <?php\necho\"Hello, World!\";\n?>\n```\n\n点击时\n说 Hello, World!\n\n# BASIC\n\n\
    BASIC 是最老的编程语言之一。它的全称是“初学者通用符号指令代码”。\n\n# C\n\nC 是世界上广泛使用的语言之一，但学习起来很困难。它通常用于制作运行快速的软件。\n\
    \n# Scratch\n\nScratch 被用来教初学者编程。与其输入代码，不如使用现制块来构建指令。\n\n> 线索：\n每行代码都以数字开头。\n\n\
    > 线索：\nC 程序以井号 (#) 开头。\n\n> 线索：\nScratch 使用彩色块来构建代码。\n\n# 程序\n\n无论是程序、应用还是代码，你描述的都是一组特殊的指令，被称为“软件”。大多数现代设备由软件控制。这包括手机、平板电脑、太空中的卫星甚至火星上的机器人。\n\
    \n# 移动应用\n\n手机或平板电脑上的每个应用都是独立运行的小型程序。应用可以做各种事情：拍照、发送消息以及玩游戏。\n\n# 无人机\n\n无人机是不需要飞行员飞行的设备。相反，它们使用遥控器和特殊软件。它们被用于拍摄照片和视频。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_37_0.png)\n\n![](img/40f5547c988795f8089b3518c78a314c_37_1.png)\n\
    \n# 从编码员到用户\n\n程序员花费大量时间让应用运行流畅，但他们需要将应用发布给所有用户。有时应用需要广告和营销的帮助，而口碑是一个很好的方法。分享应用意味着它可以获得更多用户，甚至可能病毒式传播。这意味着它在许多人之间被谈论。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_38_0.png)\n\n> 有这样一个应用！\n\n# 手术机器人\n\
    \n有些外科医生依靠机器人协助最精细的操作。机器人的每个手臂都有特殊代码来帮助医生完成重要任务。\n\n# 火星探测器\n\n探测 B 正在探测火星表面。它使用特殊代码，可以在距离地球\
    \ 2.25亿公里（1.4亿英里）的地方工作。\n\n![](img/40f5547c988795f8089b3518c78a314c_38_1.png)\n\
    \n# 计算机计算机并不总是运行流畅。有些人传播恶意代码（如蠕虫）来损害或窃取信息。如果代码中有错误，程序可能会停止工作。这些被称为漏洞。防病毒程序和“防火墙”是保护计算机免受恶意代码侵害的软件。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_0.png)\n\n自从 1945 年发现一台美国大学的计算机里有一蛾以来，计算机错误一直被称为漏洞。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_1.png)\n\n# 计算机黑客\n\n黑客是编写恶意代码（恶意软件）以获取计算机访问的人。他们可以窃取信息或损坏数据。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_2.png)\n\n# 洛马木\n\n洛马木是一个伪装无害的文件。一旦打开，它就会加载一个控制你计算机的程序。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_3.png)\n\n![](img/40f5547c988795f8089b3518c78a314c_39_4.png)\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_5.png)\n\n![](img/40f5547c988795f8089b3518c78a314c_39_6.png)\n\
    \n```c\nfor (i) {\n  case 1:\n    do_something(1); break;\n  case 2:\n    do_something(2);\
    \ break;\n  case 3:\n    do_something(3); break;\n  case 4:\n    do_something(4);\
    \ break;\n  default:\n    break;\n}\n```\n> 这是代码中的一个错误——Case 1 被错误地复制到了 case 3\
    \ 下。\n\n# 病毒\n\n病毒是恶意软件的一种，它附着在程序上并自动运行。\n\n![](img/40f5547c988795f8089b3518c78a314c_39_7.png)\n\
    \n# 后门\n\n后门程序允许黑客在没有密码的情况下入侵系统。\n\n![](img/40f5547c988795f8089b3518c78a314c_39_8.png)\n\
    \n# 漏洞\n\n漏洞是程序中的错误或故障。它可以导致程序运行异常，例如在屏幕上显示奇怪的文字。它会导致程序停止工作。\n\n# 漏洞扫描\n\n黑客使用漏洞扫描程序来寻找安全漏洞。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_40_0.png)\n\n# 嗅探器\n\n嗅探器监控网络上传输的信息。它们捕获用户数据。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_40_1.png)\n\n# 计算机虫\n\n计算机蠕虫通过向所有机器发送副本来感染网络。它们比病毒更难对付。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_40_2.png)\n\n# 键盘记录\n\n键盘记录监控别人键盘上按下的每一个键。它让黑客看到密码或其他隐私信息。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_40_3.png)\n\n# 互联网\n\n互联网是一个连接全球计算机的网络。它起源于\
    \ 20 世纪 60 代，但当时只有少数大学在使用它。现在，数百万人每天使用它进行通信、获取信息以及娱乐。它让我们能够快速方便地完成许多原本需要更长时间的事情。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_41_0.png)\n\n# 慢速\n\n我们利用互联网几乎立即获取信息。如果没有它，我们必须找到关于我们感兴趣的书，然后查找，这会花费更长的时间。\n\
    \n# 蜗政\n\n我们每秒发送 240 万封电子邮件。如果通过邮寄发送这么多信息，将花费 1.32 亿英镑（1.6 亿美元），而且信件需要几天才能到达！\n\
    \n# 地图阅读\n\n手机使用太空卫星在地图上显示位置。如果没有互联网，手机将无法与卫星，因此无法显示你在哪里。\n\n![](img/40f5547c988795f8089b3518c78a314c_41_1.png)\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_41_2.png)\n\n"
