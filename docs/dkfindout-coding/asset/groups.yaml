    ![](img/40f5547c988795f8089b3518c78a314c_17_4.png)


    The Germans used a machine called Enigma to encode their messages. This allowed
    them to surprise their enemies, and communicate with their spies.


    ![](img/40f5547c988795f8089b3518c78a314c_17_5.png)


    These secret orders made it impossible to track down the deadly German submarines,
    called U-boats.


    ![](img/40f5547c988795f8089b3518c78a314c_17_6.png)'
  - '[PAGE 18]


    In Britain, more than 10,000 people worked to break the Enigma code at a top-secret
    base called Bletchley Park, or "Station X".


    ![](img/40f5547c988795f8089b3518c78a314c_18_0.png)


    Some of the world''s first computers were used at Bletchley Park, designed by
    top scientists and engineers like Alan Turing.


    ![](img/40f5547c988795f8089b3518c78a314c_18_1.png)


    On 30 October 1942, three British sailors rescued a working Enigma machine from
    a sinking German U-boat.


    ![](img/40f5547c988795f8089b3518c78a314c_18_2.png)


    These machines helped Britain break Enigma, and control the sea.


    ![](img/40f5547c988795f8089b3518c78a314c_18_3.png)


    Hurrah!


    ![](img/40f5547c988795f8089b3518c78a314c_18_4.png)


    > We got the codes!


    ![](img/40f5547c988795f8089b3518c78a314c_18_5.png)


    Victory!


    Germany''s control of the sea was broken. On 7 May 1945, Germany surrendered.'
  - '[PAGE 19]


    # Alan Turing


    Englishman Alan Turing was a maths and science genius. When World War II started,
    he joined Bletchley Park, a top-secret base, where he worked to break enemy codes
    and uncover Germany’s plans. His inventions and ideas began the age of modern
    computers.


    Each Bombe was 2 m (7 ft) wide, and weighed 0.9 tonnes (1 ton).


    > The Turing Award is a yearly computing prize. Google gives the winner $1,000,000.


    ![](img/40f5547c988795f8089b3518c78a314c_19_0.png)


    Secret work

    Turing''s work on codes and computing was so secret that de few people were allowed
    to know about it, even after the war ended. Today, he is recognized as “the father
    of computing”.


    | Turing machine | Hidden voices |

    |---|---|

    | In 1936, Turing wrote about an imaginary machine that could perform any task,
    if it was given the right set of instructions. He never built one, but we call
    the idea a Turing machine. | In 1944, Turing helped develop SIGSALY, a secure
    way of encrypting radio messages using random noise. It was also called the Green
    Hornet, because anyone listening in would only hear buzzing.|'
  - '[PAGE 20]


    # Turing test


    In 1950, Turing imagined a test to decide if a computer was “intelligent”. A human
    would communicate with a hidden partner and try to decide if they were really
    human, or a computer.


    # Tiger stripes


    After the war, Turing used maths to explore new kinds of science. In 1951, he
    created an equation to explain how patterns form in living creatures, like stripes
    on tigers, or the number of fingers on a hand.


    # Computer chess


    Turing published the world’s first chess-playing program, Turochamp, in 1951.
    No computer had power to run it, so Turing used the program’s rules to decide
    his moves in a real chess game.


    > Bombe, Turing designed the Bombe. In 1939, this early computer cracked enemy
    codes by testing every possible combination the Enigma machine could use. Over
    200 ran day and night at Bletchley Park.


    ![](img/40f5547c988795f8089b3518c78a314c_20_0.png)'
  - '[PAGE 21]


    # The first computer


    In 1943, engineers in the USA began designing a machine that could be programmed
    to solve different maths problems. This was the Electronic Numerical Integrator
    And Computer (ENIAC, “en-ee-ack”) – the first computer. The ENIAC could follow
    5,000 instructions per second, which was 1,000 times faster than the calculators
    of the time. It was huge and filled a whole room.


    ![](img/40f5547c988795f8089b3518c78a314c_21_0.png)'
  - '[PAGE 22]


    # How it worked


    The ENIAC weighed 27 tonnes (30 tons) – the same as five elephants.


    The ENIAC did not have “insides” as modern computers do. Instead, its parts were
    fixed to 40 panels. Each panel had hundreds of wires, switches, and tubes attached
    to it.


    ![](img/40f5547c988795f8089b3518c78a314c_22_0.png)


    The ENIAC had more than 17,000 vacuum tubes


    Vacuum tubes

    Vacuum tubes look a bit like light bulbs. They act like on/off switches, making
    or breaking electrical circuits.


    ![](img/40f5547c988795f8089b3518c78a314c_22_1.png)


    Men and women worked side by side to program the ENIAC.


    Programming the ENIAC

    Each time the ENIAC was programmed, everything had to be moved around by hand.
    Setting it up to perform a single task could take weeks.


    ![](img/40f5547c988795f8089b3518c78a314c_22_2.png)'
  - '[PAGE 23]


    # # Multi-tasking machines


    The more tasks a computer can handle at once, the faster it can complete them
    all. The first computers could only handle one task, but these days a laptop or
    mobile phone can perform thousands of separate tasks, called processes, at the
    same time.


    > WOW! The heaviest computer ever was the SAGE system, at 226.8 tonnes (250 tons).


    # Z3


    The Z3, built in Germany, was the world''s first programmable computer. Older
    computers needed to be rewired to run new programs, but the Z3 stored its programs
    on paper tape. It was destroyed by bombs during World War II.


    FACT FILE

    >> When: 1941

    >> Weight: 0.9 tonnes (1 ton)

    >> Fun fact: The German government refused to help improve the Z3. They felt computers
    were not important to the war.


    ![](img/40f5547c988795f8089b3518c78a314c_23_0.png)'
  - '[PAGE 24]


    # SSEM


    The Small-Scale Experimental Machine (SSEM) was built at Manchester University,
    UK. It was the first computer to store programs on its own memory, instead of
    on tape.


    ![](img/40f5547c988795f8089b3518c78a314c_24_0.png)


    # FACT FILE


    +   >> **When**: 1948


    +   >> **Weight**: 1 tonne (1.1 tons)


    +   >> **Fun fact**: The SSEM was nicknamed “Baby” as a joke, because it was so
    large.


    # UNIVAC I


    The UNIVAC I was the first computer to be sold to the public in the USA. Its name
    stood for “Universal Automatic Computer”. The UNIVAC I''s memory used seven large
    tanks of liquid mercury, which picked up electrical signals from pulses of sound
    sent by quartz crystals.


    ![](img/40f5547c988795f8089b3518c78a314c_24_1.png)


    # FACT FILE


    +   >> **When**: 1951


    +   >> **Weight**: 13 tonnes (14.3 tons)


    +   >> **Fun fact**: UNIVAC forecast Eisenhower''s victory in the 1952 US presidential
    election before anyone else.


    # IBM System/360


    The IBM 360 was the first series of computers to use programs that worked on more
    than one machine. They were designed to be affordable, so businesses could buy
    or rent them.


    ![](img/40f5547c988795f8089b3518c78a314c_24_2.png)


    # FACT FILE


    +   >> **When**: 1964


    +   >> **Weight**: Varied from 0.7 tonnes (0.75 tons) to 2.3 tonnes (2.6 tons)


    +   >> **Fun fact**: IBM 360 computers were used to plan the Apollo moon landings.'
  - '[PAGE 25]


    # Think like a computer


    Computers cannot think for themselves. They follow very specific instructions
    given by programmers. These instructions must be exact but simple. Programmers
    often break down complex instructions into smaller steps that are easier to follow.


    ![](img/40f5547c988795f8089b3518c78a314c_25_0.png)


    Each time the robot hits an obstacle, it follows the rules again, starting at
    the beginning of the algorithm.


    # Follow the rules


    This robot must get across the maze, following set steps like a computer does.
    It must follow the rules below. The algorithm has the same information as the
    rules, but written so that a computer (the robot) can follow them.


    | Algorithm |

    | --- |

    | START <--> Move forward <|

    | If stopped by wall: Turn right if no wall on right. Turn left if no wall on
    left. Go to START. <|

    | If red door is seen: Ignore. Go to START. <|

    | If blue door is seen: Ignore. Go to START. <|

    | If green door is seen: Open door. Move into space beyond green door. Close green
    door. Go to START. <|


    +   * The robot is trying to get through the maze.

    * The maze is filled with red doors, and green doors.

    * Red doors and blue doors should be ignored.

    * Go through green doors.

    * When a wall is encountered, try turning left or right.'
- md: '

    # What is an algorithm?


    Coders often develop a set of steps or instructions called an algorithm before
    they write any code. For example, programming a robot to put on a pair of socks
    might follow this simple algorithm.


    ![](img/40f5547c988795f8089b3518c78a314c_26_0.png)


    - Locate the sock

    - Pick up the sock

    - Place sock on one foot

    - Repeat steps 1-3 for other foot


    ![](img/40f5547c988795f8089b3518c78a314c_26_1.png)


    - The robot ignores blue doors.

    - The robot turns left or right when it hits a wall.

    - The robot enters the maze.

    - The robot ignores the red doors.

    - The robot opens and moves through the green doors.


    ## Early games


    Coders have been making games since the early days of computing. We all need code,
    all the games we play code, whether played on a computer, a television, or a mobile
    phone. These images look simple now, but when they were created they were groundbreaking!


    ### PONG


    Pong was created in 1972 by Atari. Two players used paddles with rotating knobs
    to bounce a "ball" back and forth. A point was scored when the other player missed
    the ball. There were two versions: an arcade game and one that attached to a television.


    ![](img/40f5547c988795f8089b3518c78a314c_27_0.png)


    ### Atari 2600


    The Atari 2600 was one of the earliest and most popular gaming systems sold for
    home use, from 1977. Games were small, rectangular plastic boxes slotted into
    the box, called a console.


    The controls had joysticks for movement and a single "fire" button.


    ### SPACE INVADERS


    One of the earliest arcade games was Space Invaders, released in 1978. Aliens
    moved across the sky, and the player fired missiles at them to try to stop the
    aliens from landing.


    ![](img/40f5547c988795f8089b3518c78a314c_27_1.png)


    ![](img/40f5547c988795f8089b3518c78a314c_27_2.png)


    24

    © TAITO CORPORATION 1978 ALL RIGHTS RESERVED


    ### Adventure


    Created for the Atari 2600 in 1979, Adventure allowed the player to fight dragons
    and hunt treasure. It was the first game to feature an Easter Egg – a hidden secret
    added by the programmer.


    ### ZORK I


    Some early games had no graphics. Instead, players read descriptions and typed
    in commands. Zork I, released in 1977, was one of the most popular text-adventure
    games. Players explored tunnels beneath a house, fighting monsters and trying
    to survive.


    ![](img/40f5547c988795f8089b3518c78a314c_28_0.png)


    ![](img/40f5547c988795f8089b3518c78a314c_28_1.png)


    > Zork 1 cover art


    ### PAC-MAN


    In this game from 1980, players used a joystick to direct Pac-Man, a small yellow
    circle, around a maze. Pac-Man ate dots to get points and had to avoid being eaten
    by four ghosts that chased him.


    ### NINTENDO NES


    In the mid-1980s, the Nintendo NES was the most popular gaming console in the
    world. Its games came in plastic boxes, and players used a chunky grey controller
    with a handful of buttons.


    ![](img/40f5547c988795f8089b3518c78a314c_28_2.png)


    ![](img/40f5547c988795f8089b3518c78a314c_28_3.png)


    © 1980 BANDAI NAMCO Entertainment Inc.


    # Inside a computer


    The physical parts of a computer are called hardware. Coders need to understand
    how computer hardware works so that they can write the code that tells computers
    what to do.


    ## Hard drive


    This is where most of the computer''s data is stored.


    ![](img/40f5547c988795f8089b3518c78a314c_29_0.png)


    ## RAM


    Random Access Memory is short-term memory that stores information only when the
    power is on.


    ## Storage


    Computer data needs to be saved so that it can be shared and used again. Today,
    we save data using “clouds”, a form of Internet storage. Here are some physical
    storage devices, of which we still use.


    ![](img/40f5547c988795f8089b3518c78a314c_29_1.png)


    - Punched tape: Early computers in the 1950s and 60s stored data as holes on punched
    tape.

    - Floppy disk: From the 1970s, data was stored on these discs protected by plastic
    covers.


    ## Screen


    Text and images are displayed here. WOW! The first laptop was released in 1981.


    ## Motherboard


    This large circuit board holds the processor. Everything connects to it, so that
    different parts of the computer can communicate.


    ## Processor


    This is the “brain” of the computer. It performs most of the calculations that
    make the computer work.


    ## Battery


    Computers need power to work. The battery powers a laptop when it is not plugged
    in.


    ![](img/40f5547c988795f8089b3518c78a314c_30_0.png)


    ## CD


    CD uses a laser to write data onto a disc. It can store more data than floppy
    disk.


    ## DVD


    DVDs have better sound and more space than CDs, so used to store video.


    ## USB


    USBs are smaller than other storage devices, but hold more data. They plug straight
    into a computer.


    | Feature | Details |

    |---|---|

    | Weight | 5 kg (7 lbs) |

    | Function | To solve equations |

    | Speed | 30-60 seconds for calculations |

    | Hardware | Keyboard with 37 keys, printer, and plastic shell with the central
    processing unit |


    ## Program computer


    In 1965, the Italian company, Olivetti, made history by creating the world''s
    first desktop computer. This groundbreaking piece of technology was designed to
    work easily and fit comfortably on a desk. The blue light meant the machine was
    running and ready for input, while the red light indicated an error.


    ![](img/40f5547c988795f8089b3518c78a314c_31_0.png)


    The computer could print 30 characters (numbers, letters, or symbols) per second.
    The keyboard featured switches to run programs, record data, and print results.


    ## Then and now


    Computers have changed a lot over the years. Early computers were large enough
    to fill rooms, but modern computers are small enough to fit into a backpack. By
    the 1960s, people were able to buy their own personal computer for their home.
    The display screen is clear and sharp, allowing users to view and edit images,
    create games, and access the Internet. A handheld, movable device called a mouse
    is used to move around the screen. Data that is typed on the keyboard appears
    immediately on the display screen.


    | Feature | Details |

    |---|---|

    | Weight | 10 kg (22 lbs) |

    | Function | Data processing, information storage, and data output |

    | Speed | Almost instant results for complex functions |

    | Hardware | Keyboard with 102 keys, display screen, and microprocessor technology
    |


    ## Modern machine


    Compared to, modern computers are much lighter and have a wider range of functions.
    These devices can be used at home and some also also used on the move. Modern
    computers use smaller processors, called microprocessors, to store, process, and
    display huge amounts of data.


    # Talk like a computer


    The English language has 26 letters in its alphabet, but computers and other digital
    devices only “speak” in 0s and 1s. Can you imagine having to talk to a friend
    using only 0s and 1s? All computer information is stored as 0s and 1s.


    ## Binary


    All computers communicate using two values called binary. “1” means a signal is
    “on” and “0” means the signal is “off”. Think of a light switch; by turning the
    light on, you can send the message “1” to a friend in the distance, while off
    sends the message “0”.


    ![](img/40f5547c988795f8089b3518c78a314c_33_0.png)


    # Bytes


    A byte of data is made up of eight bits. Each bit is a 0 or 1. One byte of data
    can represent one of 255 different letters, numbers, or symbols.


    - Byte: Eight bits are grouped together to create one byte of data, which translates
    to a letter, number, or symbol. This is A.

    - Bits: A single bit is a 0 or 1.


    ![](img/40f5547c988795f8089b3518c78a314c_33_1.png)


    # Communication


    The devices that make up a computer all communicate in binary by moving bytes
    of data. Everything they “say” to each other is made up of a string of 0s and
    1s.


    ![](img/40f5547c988795f8089b3518c78a314c_34_0.png)


    All data is stored in a series of electrical pulses that are either “1” or “0”.
    Bytes of data move back and forth constantly.


    ![](img/40f5547c988795f8089b3518c78a314c_34_1.png)


    ![](img/40f5547c988795f8089b3518c78a314c_34_2.png)


    ASCII

    To turn binary numbers into characters, computers use ASCII (“key”), the American
    Standard Code for Information Interchange. Each set of eight binary numbers represents
    a number, letter, or symbol in ASCII code.


    # STORING DATA


    # How many bytes?


    Computer storage is described using bytes. Units show how many 0s and 1s the computer
    has space for.


    + 1 Kilobyte is 1,024 bytes

    2 Megabyte is 1,024 kilobytes

    3 Gigabyte is 1,024 megabytes

    4 Terabyte is 1,024 gigabytes

    5 Petabyte is 1,024 terabytes

    6 Exabyte is 1,024 petabytes


    | Binary | ASCII |

    |---|---|

    | 01000001 | A |

    | 01000010 | B |

    | 01000011 | C |

    | 00110001 | 1 |

    | 00110010 | 2 |

    | 00110011 | 3 |

    | 00101110 | . |

    | 00101111 | ! |

    | 00111111 | ? |

    | 01000000 | @ |

