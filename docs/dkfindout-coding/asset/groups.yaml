- md: "\n# findout! Coding\n\n![](img/40f5547c988795f8089b3518c78a314c_0_0.png)\n\n\
    What do you want to find out?\nFun Facts, Amazing Pictures, Quizzes\n\n# findout!\
    \ QUIZ\nTest your knowledge on code and find out even more fun facts!\n\n1 What\
    \ machine did the Germans use to encode messages in WWII?\n2 What is a Raspberry\
    \ Pi?\n3 What is Pong?\n4 What is an app?\n5 What was the Pascaline?\n6 Which\
    \ game has sold over 500 millions copies?\n7 Who created the Bombe machine?\n\
    8 Which type of code uses a tapping machine?\n9 Who created Facebook?\n10 What\
    \ is Python?\n\n# Turn over to discover the answers\n\n# Coding History\n\nThere\
    \ have been some amazing discoveries in the history of software, the programs\
    \ that tell computers how to work and what to do.\n\n![](img/40f5547c988795f8089b3518c78a314c_2_0.png)\n\
    \n### Email\nRay Tomlinson creates the first email program, for sending digital\
    \ messages.\n\n### WordStar\nMicropro releases the first word processor, letting\
    \ people easily write on computers.\n\n### Computer virus\n\"Brain\" is the first\
    \ worldwide computer virus. It spreads across computers through floppy disks.\n\
    \n### Social media\nThe world's first social media network is created. It is called\
    \ SixDegrees.\n\n![](img/40f5547c988795f8089b3518c78a314c_2_1.png)\n\n| Year |\
    \ Event |\n| :--- | :--- |\n| 1969 | ARPANET: The first computer network is built,\
    \ forming the basis of today's modern Internet. |\n| 1971 | The Apple Lisa, released\
    \ in 1983, was one of the first personal desktop computers. |\n| 1979 | MacPaint\
    \ and MacWrite: Apple releases two programs with its Macintosh computer, to allow\
    \ users to draw and write on their computers. |\n| 1984 | Internet browser: Mosaic,\
    \ the world's first Internet browser, is released. |\n| 1986 | HTML5: The original\
    \ HTML code for the World Wide Web is updated to HTML5, making it easier for coders\
    \ to use. |\n| 1992 | |\n| 2003 | |\n| 2014 | |\n\n![](img/40f5547c988795f8089b3518c78a314c_2_2.png)\n\
    \nThings to find out:\n\n# DK findout!\n\n# Coding\n\n![](img/40f5547c988795f8089b3518c78a314c_4_0.png)\n\
