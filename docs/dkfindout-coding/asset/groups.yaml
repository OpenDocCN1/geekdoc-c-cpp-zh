    # Top secret


    The word “code” refers to a set of rules. Coders use these rules to tell computers
    what to do. However, codes can also be used to keep secrets. Throughout history,
    people have created codes to hide what a message says. A coded message can only
    be read if you know the secret rules to decode it.


    # Polybius Square


    The Greek historian Polybius worked for the Romans. He created a new code for
    their armies, using a square grid which matched each letter in the Greek alphabet
    to a pair of numbers. People with the same square could exchange messages written
    only in numbers.


    # Scytale


    The Ancient Greeks of Sparta would scramble their messages by writing them on
    leather or parchment wrapped around a rod or stick. Then they added extra letters,
    so when the message was unwrapped from the rod it became a meaningless jumble.


    # Hail, Caesar!


    Julius Caesar’s code was very simple, but it worked for centuries. Most of his
    enemies could not read very well, so they thought he was writing his messages
    in a foreign language.


    # Caesar shift


    The Roman general and emperor Julius Caesar swapped each letter in his secret
    messages with a different one. Every letter moved a set number of spaces forwards
    in the alphabet, so in a one-shift code, “A” would become “B”.


    # Alberti formula


    In 1467, the Italian architect Leon Alberti invented a disc with two wheels, which
    could be rotated to swap one letter in a message for another. To swap the letters
    back and decode the message, you needed to know how the discs had been rotated.


    ![](img/40f5547c988795f8089b3518c78a314c_15_0.png)'
