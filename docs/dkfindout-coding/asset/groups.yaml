    \ play games other people create – I was hooked.\n\n- Q: Do you have a favourite\
    \ thing that you have developed?\n\nA: We built Stack Overflow, which is like\
    \ a Wikipedia for programmers!\n\n![](img/40f5547c988795f8089b3518c78a314c_53_1.png)\n\
