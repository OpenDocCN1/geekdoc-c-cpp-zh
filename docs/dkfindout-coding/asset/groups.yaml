    # 计算机内部\n\n计算机的物理部分被称为硬件。编码人员需要理解硬件如何工作，以便编写告诉计算机做什么的代码。\n\n## 硬盘\n\n这是存储计算机大部分数据的地方。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_29_0.png)\n\n## RAM（随机存存储器）\n\n随机存存储器是在通电时存储信息的内存。\n\
    \n## 存储\n\n计算机数据需要保存以便共享和再次使用。今天，我们使用“云”存储数据。这里是我们仍在使用的物理存储设备。\n\n![](img/40f5547c988795f8089b3518c78a314c_29_1.png)\n\
    \n- 磁带：20 世纪 50 年代和 60 年代的早期计算机以孔带的形式存储数据。\n- 软盘：从 20 世纪 70 年代开始，数据存储在这些由塑料盖保护的圆盘上。\n\
    \n## 屏幕\n\n文本和图像在这里显示。哇！第一台笔记本电脑于 1981 发布。\n\n## 主板\n\n这块巨大的电路板持有处理器。所有部分都连接到它，以便计算机的不同部分可以通信。\n\
    \n## 处理器\n\n这是计算机的“大脑”。它执行运行计算机的大部分计算。\n\n## 电池\n\n计算机需要能量才能工作。笔记本未插电时由电池供电。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_30_0.png)\n\n## CD\n\nCD 使用激光写入磁盘。它可以存储比软盘更多的数据。\n\
    \n## DVD\n\nDVD 比 CD 有更好的音质和更大的空间存储视频。\n\n## USB\n\nUSB 比其他存储设备小，但容量更大。它们直接插入计算机。\n\
    \n| 特性 | 详情 |\n|---|---|\n| 重量 | 5 公斤 (7 磅) |\n| 功能 | 解方程 |\n| 速度 | 计算需要 30-60\
    \ 秒 |\n| 硬件 | 带有 37 个键的键盘、打印机和带有中央处理单元的塑料壳 |\n\n## 程序控制计算机\n\n1965 年，意大利公司 Olivetti\
    \ 通过创建世界上第一台台式电脑创造了历史。这项突破性的技术设计易于操作并适合放在桌子上。蓝灯表示机器正在运行并准备好输入，红灯指示错误。\n\n![](img/40f5547c988795f8089b3518c78a314c_31_0.png)\n\
    \n计算机每秒可以打印 30 个字符（数字、字母或符号）。键盘具有运行程序、记录数据和打印结果的开关。\n\n## 过去与\n\n多年来计算机发生了巨大的变化。早期计算机大到可以填房间，但现代电脑小到可以放入背包。20\
    \ 世纪 60 年代，人们为家里购买个人电脑。屏幕清晰锐，允许用户查看和编辑图像、创建游戏并访问互联网。一种称为鼠标的手持移动设备用于在屏幕上移动。在键盘上打字的数据会立即显示在屏幕上。\n\
    \n| 特性 | 详情 |\n|---|---|\n| 重量 | 10 公斤 (22 磅) |\n| 功能 | 数据处理、信息存储和数据输出 |\n| 速度\
    \ | 复杂功能的几乎即时结果 |\n| 硬件 | 带有 102 个键的键盘、屏幕和微处理器技术 |\n\n## 现代机器\n\n相比之下，现代计算机轻得多，功能更广泛。这些设备可以在家里使用，有些也可以移动使用。现代计算机使用较小的处理器（微处理器）来存储、处理和显示海量数据。\n\
    \n# 像计算机一样说话\n\n英语中有 26 个字母，但计算机和其他数字设备只用 0 和 1 “说话”。你能想象只用 0 和 1 与朋友交聊天吗？所有的计算机信息都存储为\
    \ 0 和 1。\n\n## 二进制\n\n所有计算机都使用称为二进制的两个进行通信。“1”意味着信号“开启”，“0”意味着信号“关闭”。想象灯开关；通过打开灯，你可以向远处的朋友发送信息“1”，而关闭则发送信息“0”。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_33_0.png)\n\n# 字节\n\n一个字节的数据由八个位（bit）组成。每个位是\
    \ 0 或 1。一个字节可以表示 255 个不同的字母、数字或符号。\n\n- 字节：八位组合成一个字节。\n- 位：单个位是 0 或 1。\n\n![](img/40f5547c988795f8089b3518c78a314c_33_1.png)\n\
    \n# 通信\n\n构成计算机的设备通过移动字节进行二进制通信。它们之间“说”的一切都是由 0 和 1 的字符串组成的。\n\n所有数据存储在系列为“1”或“0”的电脉冲中。字节不断地往回移动。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_34_0.png)\n\n![]((img/40f5547c988795f8089b3518c78a314c_34_1.png)\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_34_2.png)\n\nASCII\n为了将二进制数字转换为字符，计算机使用\
    \ ASCII（键），即美国信息交换标准。每组二进制数字代表 ASCII 代码中的一个数字、字母或符号。\n\n# 存储数据\n\n# 多少字节？\n\n\
    计算机存储使用字节描述。单位显示了计算机空间有多少 0 和 1。\n\n+ 1 千字节是 1024 字节\n2 兆字节是 1024 千字节\n3 吉字节是\
    \ 1024 兆字节\n4 太字节是 1024 吉字节\n5 拍字节是 1024 太字节\n6 艾字节是 1024 拍字节\n\n| 二进制 | ASCII\
    \ |\n|---|---|\n| 01000001 | A |\n| 01000010 | B |\n| 01000011 | C |\n| 00110001\
    \ | 1 |\n| 00110010 | 2 |\n| 00110011 | 3 |\n| 00101110 | . |\n| 00101111 | !\
    \ |\n| 00111111 | ? |\n| 01000000 | @ |\n\n"
