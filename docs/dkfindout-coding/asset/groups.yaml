    教育顾问 Jacqueline Harris\n\n- 4 什么是编码员？\n- 6 我们周围的代码\n- 8 计算机之前的编码\n- 10 编码先驱\n\
    - 12 顶级机密\n- 14 恩格玛密码\n- 16 阿兰·图灵\n- 18 第一台计算机\n- 20 多任务机器\n- 22 像计算机一样思考\n- 24\
    \ 游戏\n- 26 计算机内部\n- 28 过去与现在\n- 30 像计算机一样说话\n- 32 计算机语言\n- 34 程序\n- 36 蠕虫与漏洞\n\
