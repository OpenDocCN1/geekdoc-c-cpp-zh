    The Mars Exploration Rover B is exploring the surface of Mars. It uses special\
    \ code that allows it to work over 225 million km (140 million miles) away from\
    \ Earth.\n\n![](img/40f5547c988795f8089b3518c78a314c_38_1.png)\n\n# Worms and\
    \ bugs\n\nComputers don’t always run smoothly. Some people spread bad code, such\
    \ as worms, to damage or steal information on a computer. Programs may also stop\
    \ working if there are errors in the code. These are called bugs. Anti-virus programs\
    \ and “firewalls” are software that can protect computers from bad code.\n\n![](img/40f5547c988795f8089b3518c78a314c_39_0.png)\n\
    \nComputer errors have been called bugs since 1945, when a university computer\
    \ in the USA was found to have a moth inside it.\n\n![](img/40f5547c988795f8089b3518c78a314c_39_1.png)\n\
    \n# Computer hackers\n\nHackers are people who write bad code, called malware,\
    \ to gain access to a computer. They can then steal information or damage data.\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_2.png)\n\n# Trojan horse\n\nA Trojan\
    \ horse is a file that pretends to be harmless. Once opened, it loads a program\
    \ that takes control of your computer.\n\n![](img/40f5547c988795f8089b3518c78a314c_39_3.png)\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_4.png)\n\n![](img/40f5547c988795f8089b3518c78a314c_39_5.png)\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_39_6.png)\n\n```c\nfor (i) {\n  case\
    \ 1:\n    do_something(1); break;\n  case 2:\n    do_something(2); break;\n  case\
    \ 3:\n    do_something(3); break;\n  case 4:\n    do_something(4); break;\n  default:\n\
    \    break;\n}\n```\n> This is an error in the code — Case 1 has incorrectly copied\
    \ under case 3.\n\n# Virus\n\nA virus is a type of malware that attaches itself\
    \ to a program and runs automatically.\n\n![](img/40f5547c988795f8089b3518c78a314c_39_7.png)\n\
    \n# Backdoor\n\nBackdoor programs allow hackers to break into a system without\
    \ password.\n\n![](img/40f5547c988795f8089b3518c78a314c_39_8.png)\n\n# Bugs\n\n\
    A bug is a mistake or fault found in a computer program. It can cause a program\
    \ to run incorrectly, for example, showing strange text on the screen. It can\
    \ also cause a program to stop working.\n\n# Vulnerability scanners\n\nHackers\
    \ use programs called vulnerability scanners to look for weaknesses in security.\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_40_0.png)\n\n# Sniffers\n\nSniffers\
    \ monitor information travelling over a network. They capture user data.\n\n![](img/40f5547c988795f8089b3518c78a314c_40_1.png)\n\
    \n# Computer worms\n\nComputer worms infect networks by sending copies of themselves\
    \ to all the machines. They are harder to stop than viruses.\n\n![](img/40f5547c988795f8089b3518c78a314c_40_2.png)\n\
    \n# Keylogging\n\nKeylogging monitors every key that is pressed on someone's keyboard.\
    \ It lets hackers see passwords or other private information.\n\n![](img/40f5547c988795f8089b3518c78a314c_40_3.png)\n\
    \n# The Internet\n\nThe Internet is a network that links together computers over\
    \ the world. It was first thought of in the 1960s, but was only used by a handful\
    \ of people in universities. Now, millions of people use it every day, to communicate\
    \ with each other, to find things out, and for entertainment. It lets us do many\
    \ things quickly and easily that would otherwise take much longer.\n\n![](img/40f5547c988795f8089b3518c78a314c_41_0.png)\n\
    \nSlow information\nWe use the Internet to find things out almost instantly. Without\
