    \n### PONG（乒乓球）\n\nPong 由 Atari 在 1972 年创建。两名玩家使用带有旋转旋钮的拍子来回击“球”。当对方玩家没接住球时即可得分。它有两个版本：街机游戏版和一个连接到电视的版本。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_27_0.png)\n\n### Atari 2600\n\nAtari\
    \ 2600 是从 1977 年起销售最早且最受欢迎的家用游戏系统之一。游戏是小的矩形塑料盒，插入到一个被称为“主机”的盒子里。\n\n控制器带有用于移动的摇杆和一个单一“发射”按钮。\n\
    \n### 宇宙侵入侵者（SPACE INVADERS）\n\n最早的街机游戏之一是《太空侵入侵者》，于 1978 年发布。外星人在空中移动，玩家向他们发射导弹，试图阻止外星人着陆。\n\
    \n![](img/40f5547c988795f8089b3518c78a314c_27_1.png)\n\n![](img/40f5547c988795f8089b3518c78a314c_27_2.png)\n\
    \n24\n© TAITO 公司 1978 版权所有\n\n### 冒险（Adventure）\n\n《冒险》于 1979 年为 Atari 2600 创建，允许玩家与龙战斗并猎取宝藏。它是第一个包含“彩蛋”（Easter\
