  mdcn: '


    我的发现事实：


    ## 计算机历史


    计算机是处理信息的机器。发现一些不可思议的计算发明。


    ![](img/40f5547c988795f8089b3518c78a314c_69_0.png)


    ### 算盘

    算盘珠被用于世界上包括埃及、希腊和中国在基础数学计算。


    ![](img/40f5547c988795f8089b3518c78a314c_69_1.png)


    ### ENIAC（电子IAC计算机）

    第一台电子通用计算机是在美国宾夕法尼亚大学建造的。


    ### 第一台时钟

    这种机械钟制造于中国，由水力驱动。


    ### 分析机

    查尔斯·巴贝奇设计了分析机，这是一种早期的齿轮驱动计算机。


    | 公元前500年 | 公元前200年 | 公元700年 | 1801年 | 1822年 | 1890年 | 1936年 | 1943年 |

    | --- | --- | --- | --- | --- | --- | --- | --- |


    ### 打孔卡织布机

    约瑟·雅卡尔发明了用于编织织物图案的打孔卡织布机。


    ### 制表机

    赫尔曼·霍勒律发明了一种使用打孔卡存储数据的机器。


    ### 安提基特拉机械

    古希腊人使用这种设备来预测恒星的位置和食相。


    安提基特拉机械是从一次沉船中发现的。


    ### 图灵机

    艾兰·图灵提出了一种可以进行编程以遵循指令的机器。


    ![](img/40f5547c988795f8089b3518c78a314c_69_2.png)


    ![](img/40f5547c988795f8089b3518c78a314c_69_3.png)


    霍勒律机记录了1890年人口普查的数据。


    ![](img/40f5547c988795f8089b3518c78a314c_70_0.png)


    ![](img/40f5547c988795f8089b3518c78a314c_70_1.png)


    ![](img/40f5547c988795f8089b3518c78a314c_70_2.png)


    ![](img/40f5547c988795f8089b3518c78a314c_70_3.png)


    ## 想了解更多吗？把它们全部收集起来！


    ![](img/40f5547c988795f8089b3518c78a314c_70_4.png)


    ## DK findout! 上线了！


    孩子唯一需要的免费在线百科全书！


    www.dkfindout.com


    了解该网站


    ## DK 编程


    你是否想知道计算机是如何思考的？或者什么是计算机漏洞（bug）？


    你可以发现答案！


    DK findout! 编程系列充满了来自编程世界的迷人事实和惊奇图片。这是一本装满宏大思想的小书。


    ![](img/40f5547c988795f8089b3518c78a314c_71_0.png)


