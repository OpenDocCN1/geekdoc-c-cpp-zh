    ## 恩格玛密码


    在20世纪30年代，德国想要控制其他国家。1939年，它入侵了波兰。英国和法国对此宣战，第二次世界大战爆发了。战争使用了坦克、雷达和机密的恩格玛密码机等新技术。


    在第二次世界大战期间，军队在陆地、空、海上进行战斗，并在战斗之间快速移动。电报和无线电被用于跨远距离发送指令。


    ![](img/40f5547c988795f8089b3518c78a314c_17_0.png)


    ![](img/40f5547c988795f8089b3518c78a314c_17_1.png)


    ![](img/40f5547c988795f8089b3518c78a314c_17_2.png)


    ![](img/40f5547c988795f8089b3518c78a314c_17_3.png)


    ![](img/40f5547c988795f8089b3518c78a314c_17_4.png)


    德国人使用名为恩格玛（Enigma）的机器对他们的信息进行加密。这让他们能够袭击敌人，并与他们的间谍通信。


    ![](img/40f5547c988795f8089b3518c78a314c_17_5.png)


    这些秘密指令使得无法追踪到被称为U潜艇的致命德国潜艇。


    ![](img/40f5547c988795f8089b3518c78a314c_17_6.png)


    在英国，有超过1万人在一个名为布莱切莱园公园（Bletchley Park）或“X站”的机密基地工作，破解恩格玛密码。


    ![](img/40f5547c988795f8089b3518c78a314c_18_0.png)


    世界上最早的计算机之一被用于布莱切莱园公园，由艾伦·图灵等顶级科学家和工程师设计。


    ![](img/40f5547c988795f8089b3518c78a314c_18_1.png)


    1942年10月30日，三名英国水员从一艘沉没的德国U潜艇上救出一台运行中的恩格玛机器。


    ![](img/40f5547c988795f8089b3518c78a314c_18_2.png)


    这些机器帮助英国破解了恩格玛并控制了海洋。


    ![](img/40f5547c988795f8089b3518c78a314c_18_3.png)


    万岁！


    ![](img/40f5547c988795f8089b3518c78a314c_18_4.png)


    > 我们破解了密码！


    ![](img/40f5547c988795f8089b3518c78a314c_18_5.png)


    胜利！


    德国对海洋的控制被打破了。1945年5月7日，德国投降。


    ## 艾伦·图灵


    英国人艾伦·图灵是一位数学和科学天才。第二次世界大战开始时，他加入了机密基地布莱切莱园公园，在那里他致力于破解敌密码并揭露德国的计划。他的发明和思想开启了现代计算机时代。


    每台炸弹机（Bombe）宽2米（7英尺），重0.9吨（1吨）。


    > 图灵奖是一项年度计算奖项。谷歌将给获奖者1,000,000美元。


    ![](img/40f5547c988795f8089b3518c78a314c_19_0.png)


    秘密工作

    图灵在密码和计算方面的工作极其秘密，以至于在战争结束后也少有人知道。今天，他被认为是“计算机之父”。


    | 图灵机 | 隐藏的声音 |

    | --- | --- |

    | 1936年，图灵写描述了一种想象中的机器，只要给它正确的指令集，它就能执行任何任务。他从未制造过它，但我们把这个想法称为图灵机。 | 1944年，图灵帮助开发了SIGABA，一种使用随机噪声加密消息的安全方法，因为任何窃听的人都会听到嗡嗡声。
    |


    ## 图灵测试


    1950年，图灵设想了一项测试，用来判断计算机是否具有“智能”。人类将与一个隐藏的伙伴交流，并试图判断对方是人类还是计算机。


    ## 虎纹


    战后，图灵利用数学探索了新的科学领域。1951年，他创建了一个方程来解释生物体中的模式，比如老虎身上的条纹或手手指的数量。


    ## 计算机象棋


    图灵在1951年发表了世界上第一个下象棋程序Turochamp。当时没有计算机可以运行它，所以图灵设计了程序的规则来决定真实象棋中的走法。1939年，这台早期计算机通过测试恩格玛机器可能的组合来破解密码。200多人在布莱切莱园公园日夜工作。


    ![](img/40f5547c988795f8089b3518c78a314c_20_png)


    ## 第一台计算机


    1943年，美国的工程师开始设计一种可以通过编程解决不同数学问题的机器。这是电子积分计算机（ENIAC），第一台计算机。ENIAC每秒可以执行5000条指令，比当时的计算器快1000倍。它体积巨大，占据了整个房间。


    ![](img/40f5547c988795f8089b3518c78a314c_21_0.png)


    ## 它是如何工作的


    ENIAC重27吨（30吨）——相当于五头大象。ENIAC没有现代计算机那样的“内部”。相反，它的部件固定在40个面板上。每个面板上有数百根电线和真空管。


    ![](img/40f5547c988795f8089b3518c78a314c_22_0.png)


    ### 真空管

    真空管看起来像灯泡。它们的作用像开关，用于接通或断开电路。


    ![](img/40f5547c988795f8089b3518c78a314c_22_1.png)


    ### 为ENIAC编程

    男女并肩为ENIAC编程。每次编程时，一切都必须手动移动。设置它执行单个任务可能需要几周时间。


    ![](img/40f5547c988795f8089b3518c78a314c_22_2.png)


    ## 多任务机器


    计算机同时处理的任务越多，完成得越快。早期的计算机只能处理一项任务，但现在的笔记本电脑或手机可以同时执行数千个独立任务，称为“进程”。


    > 哇！最重的计算机是SAGE系统，重226.8吨（250吨）。


    ## Z3


    Z3制造于德国，是世界上第一台可编程的计算机。旧的计算机需要重新布线才能运行新程序，但Z3将程序存储在纸带上。它在第二次世界大战期间被炸弹摧毁。


    ### 档案

    - **时间**：1941年

    - **重量**：0.9吨（1吨）

    - **趣事实**：德国政府拒绝帮助改进Z3。他们认为计算机对战争并不重要。


    ![](img/40f5547c988795f8089b3518c78a314c_23_0.png)


    ## SSEM


    小型实验机器（SSEM）建造于英国曼彻斯特大学。它是第一台将程序存储在自己内存而非纸带上的计算机。


    ![](img/40f5547c988795f8089b3518c78a314c_24_0.png)


    ### 档案

    - **时间**：1948年

    - **重量**：1吨（1.1吨）

    - **趣事实**：因为SSEM非常小，它被戏戏地命名为“宝贝”。


    ## UNIVAC I


    UNIVAC I是第一台向公众出售的计算机。它的名字代表“通用自动计算机”。它使用大型汞延迟线来存储电信号。


    ![](img/40f5547c988795f8089b3518c78a314c_24_1.png)


    ### 档案

    - **时间**：1951年

    - **重量**：13吨（14.3吨）

    - **趣事实**：UNIVAC预测了艾森豪在1952年总统选举中的胜利。


    ## IBM System/360


    IBM360是第一系列可以在多台机器上运行的计算机。它们的设计非常负担得起，以便企业购买或租赁。


    ![](img/40f5547c988795f8089b3518c78a314c_24_2.png)


    ### 档案

    - **时间**：1964年

    - **重量**：从0.7吨（0.75吨）到2.3吨（2.6吨）不等

    - **趣事实**：IBM 360计算机用于规划阿波罗登月计划。


    ## 像计算机一样思考


    计算机不能自己思考。它们遵循程序员提供的非常具体的指令。这些指令必须既精确又简单。程序员经常将复杂的指令分解为更容易遵循的较小步骤。


    ![](img/40f5547c988795f8089b3518c78a314c_25_0.png)


    当机器人遇到障碍时，它都会再次遵循规则，从算法开始开始。


    ## 遵循规则


    机器人必须像计算机一样，按照固定的步骤穿过迷宫。它必须遵循下面的规则。算法的信息与规则相同，但其写法是为了让计算机（机器人）能够遵循。


    | 算法 |

    | --- |

    | 开始 <--> 向前 <|

    | 如果被墙挡住：右侧没有墙则向右转；左侧没有墙则向左转。返回开始 <|

    | 如果看到红门：忽略。返回开始 <|

    | 如果看到蓝门：忽略。返回开始 <|

    | 如果看到绿门：打开门。进入绿门后的空间。关闭绿门。返回开始 <|


