    # # The Internet


    The Internet is a network that links together computers all over the world. It
    was first thought of in the 1960s, but was only used by a handful of people in
    universities. Now, millions of people use it every day, to communicate with each
    other, to find things out, and for entertainment. It lets us do many many things
    quickly and easily that would otherwise take much longer.


    ![](img/40f5547c988795f8089b3518c78a314c_41_0.png)


    Slow information

    We use the Internet to find things out almost instantly. Without it we would have
    to find a book about what we wanted to know, and then look it up, which would
    take a lot longer.


    Snail mail

    We send around 2.4 million emails every second. To send that many messages by
    post would cost about £132 million ($165 million), and the letters would take
    several days to arrive!


    ![](img/40f5547c988795f8089b3518c78a314c_41_1.png)


    Map reading

    Mobile phones use satellites in space to show positions on maps. Without the Internet,
    phones would not be in touch with satellites, so wouldn''t be able to show you
    where you are.


    ![](img/40f5547c988795f8089b3518c78a314c_41_2.png)'
- md: '

    ## Social not working

    Social networking apps let you talk with your friends all the time.


    ## Sending files

    The Internet lets us share and download files instantly. Without it we could only
    share using wires between computers or by putting copies in the post.


    You can chat, arrange to meet up, and share the latest news with large groups
    of friends at once.


    ## Shopping

    You can buy almost anything you want using the Internet, from food and drink to
    giant plastic elephants! Everything is put in the post to you, so you don''t have
    to go to the shops.


    ## What to watch?

    The Internet lets us watch films instantly. We can download whatever we want at
    the click of a button instead of having to find and watch DVDs.


    ![](img/40f5547c988795f8089b3518c78a314c_42_0.png)


    ## What is an app?

    Apps are sets of instructions written in code. They are mostly used on phones
    and tablets, to do lots of different things, from playing games to making video
    calls. There are plenty of apps designed especially for kids.


    ![](img/40f5547c988795f8089b3518c78a314c_43_0.png)

    ![](img/40f5547c988795f8089b3518c78a314c_43_1.png)


    ## Gaming

    Quizzes, races, and puzzles are all fun, popular types of game apps. Some are
    free, but others charge money for things within the game, so be careful!


    ## Shopping

    Shopping apps let people buy things without leaving the house. Most big shops
    have apps. You can also bid against other people to buy things in auctions.


    ## App building

    Apps on your phone or computer don''t appear fully formed. It takes a lot of work
    to get them from a first idea to a finished program. Here''s how it''s done.


    ![](img/40f5547c988795f8089b3518c78a314c_43_2.png)

    ![](img/40f5547c988795f8089b3518c78a314c_43_3.png)


    ### Idea

    People have ideas for new apps. These apps often try to do something useful, for
    which an app doesn''t already exist.


    ### Design

    The look of an app and how people use it is important. Popular apps usually look
    good and are easy to use.


    ## Smartphones

    Smartphones are mini computers that you can carry around. Unlike a desktop computer,
    they are small enough to use on the go. Smartphones have an operating system.
    This is a built-in set of instructions that lets apps work. Apple''s iOS and Google''s
    Android are the two most popular operating systems.


    ![](img/40f5547c988795f8089b3518c78a314c_44_0.png)


    Smartphones in action

    ![](img/40f5547c988795f8089b3518c78a314c_44_1.png)

    ![](img/40f5547c988795f8089b3518c78a314c_44_2.png)


    ## Maps


    ## Communication

    Phones aren''t just for making calls. Apps let people talk in lots of different
    ways, including using video calls, picture messages, and group chats.


    ![](img/40f5547c988795f8089b3518c78a314c_44_3.png)

    ![](img/40f5547c988795f8089b3518c78a314c_44_4.png)

    ![](img/40f5547c988795f8089b3518c78a314c_44_5.png)


    ## Programming

    Every app is made up of code. The code is tested many times before the app is
    released, to make it work.


    ## Feedback

    Once the app is in use, people give feedback about what does and doesn''t work.
    Programmers tweak the code until it works perfectly.


    WOW! In 2016, over two million apps were available for smartphones.


    ## Everyday coding

    Although we can''t see them, codes are all around us, helping us every day. Computers
    use code to make modern technology run smoothly. Here are some examples of coding
    in life.


    ## Traffic lights

    Coding is used to control the flow of traffic in many towns and cities. A computer
    sends coded instructions to the traffic lights to tell them to change. Drivers
    and people on foot know to stop and when to go.

    ![](img/40f5547c988795f8089b3518c78a314c_45_0.png)


    ## Computer games

    Computer games can take players to imaginary worlds. Every game has code working
    behind the scenes to make your character jump or move.

    ![](img/40f5547c988795f8089b3518c78a314c_45_1.png)


    ## Vending machines

    After you have inserted money and made your selection from a vending machine,
    the code will work out how much change you need, and drop your item down to a
    tray for you to pick up.

    ![](img/40f5547c988795f8089b3518c78a314c_45_2.png)


    ## Microwaves

    Simple coded instructions control the timer on your microwave and the temperature
    your food is cooked at when you press the buttons on the microwave.

    ![](img/40f5547c988795f8089b3518c78a314c_45_3.png)


    ## Barcode scanner

    Every item in a shop has a unique code of lines to identify it. These lines, or
    barcodes, are read by a computer that finds the item and its price in a database
    so you can buy it.

    ![](img/40f5547c988795f8089b3518c78a314c_46_0.png)


    ## Vehicles

    Cars use computer code to monitor their engines and make sure they run properly.
    Code also controls things like the indicators on the dashboard and windscreen
    wipers.


    ## Smartboard

    These giant screens use computer coded instructions to let students choose and
    control what information is shown. All they have to do is touch the screen.

    ![](img/40f5547c988795f8089b3518c78a314c_46_1.png)


    ## Calculator

    Calculators use code to work out the answers to mathematical questions. They display
    the results immediately on the screen.

    ![](img/40f5547c988795f8089b3518c78a314c_46_2.png)


    ## Scratch

    One of the easiest programming languages to learn is Scratch. Programs are made
    by joining together coloured blocks that tell characters on screen what to do.
    Scratch lets you make your own stories, games, music, and art.


    ## Scratch layout

    The screen layout has space for your instructions on the right. On the left is
    the ''stage'', where your code is put into action.

    - This is the stage, where you will see what you create.

    - The blocks of instructions are called scripts.

    - You can change the background picture to suit your project.

    - Characters in Scratch are called sprites.

    - The blocks contain many different instructions.

    ![](img/40f5547c988795f8089b3518c78a314c_47_0.png)


    ## SCRATCH FACTS

    1. Scratch was invented at the Massachusetts Institute of Technology (MIT), USA.

    2. Scratch is available in more than 40 languages, and is used all over the world.

    3. An offline version of Scratch is available for times when you don''t have access
    to the Internet.


    ## Sprites

    Sprites are the characters that are used in Scratch. They are controlled by coded
    sets of instructions called scripts. Sprites can move around, talk in speech bubbles,
    and appear and disappear.

    ![](img/40f5547c988795f8089b3518c78a314c_48_0.png)


    ### Draw your own sprites

    Scratch has many sprites that you can choose from. There''s also a drawing tool
    so you can create your own.

    ![](img/40f5547c988795f8089b3518c78a314c_48_1.png)


    The script being built is for the current sprite shown. The blocks slot together,
    making sets of instructions that tell the sprite what to do.

    Sword moves down.

    ![](img/40f5547c988795f8089b3518c78a314c_48_2.png)


    WOW! Scratch is used in more than 150 countries around the world.


    Pirate costume 1

    Costumes are pictures of sprites in different poses. Swapping costumes can make
    this pirate move.


    Pirate costume 2

    When switching from costume 1 to costume 2, the pirate''s leg and sword appear
    to move.

    Leg moves out.


    ## Raspberry Pi

    The Raspberry Pi is a mini-computer, made to teach people how computers work.
    It connects to all kinds of devices, such as TVs, cameras, and even robots, and
    has enough power to run similar programs to a full-sized computer.

    ![](img/40f5547c988795f8089b3518c78a314c_49_0.png)


    ## Micro SD card

    A tiny memory card stores the operating system, programs, and data.

    ![](img/40f5547c988795f8089b3518c78a314c_49_1.png)

    ![](img/40f5547c988795f8089b3518c78a314c_49_2.png)


    ## Connector for LCD display panel

    A liquid crystal display (LCD) panel can be connected to this port.

    ![](img/40f5547c988795f8089b3518c78a314c_49_3.png)


    ## HDMI video

    A computer screen or modern television can be connected to this port.

    ![](img/40f5547c988795f8089b3518c78a314c_49_4.png)


    ## Camera port

    Attaching a camera lets the Pi take photos and videos.

