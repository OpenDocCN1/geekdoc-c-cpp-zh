    # Pi in action


    Japanese engineer Shota Ishiwatari created the human-like robot ''Rapiro'', which
    works with a Raspberry Pi. The Rapiro has eyes that can be lit up with LED lights,
    and can walk and move its arms.


    # GPIO pins


    Lights or buzzers can be attached to these pins. They light up or sound when the
    Pi is in use.


    ![](img/40f5547c988795f8089b3518c78a314c_50_0.png)


    # USB ports


    A mouse and keyboard can be connected to these ports for use with a computer screen.


    ![](img/40f5547c988795f8089b3518c78a314c_50_1.png)


    # LAN port


    The Raspberry Pi can access the Internet with a wired connection using this port.


    ![](img/40f5547c988795f8089b3518c78a314c_50_2.png)


    # Audio output


    Headphones or speakers can be connected here for listening to music.


    ![](img/40f5547c988795f8089b3518c78a314c_50_3.png)


    > More than 11 million Raspberry Pis have been sold since its release in 2012.'
