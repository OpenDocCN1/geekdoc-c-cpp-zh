    ## 事实与数字

    编程是一个迷人的探索领域。这里有一些可能不知道的奇特事实。


    ![](img/40f5547c988795f8089b3518c78a314c_61_0.png)


    1980年，国防部以这位最年轻程序员的名字命名了一种新语言 ADA。


    ![](img/40f5547c988795f8089b3518c78a314c_61_1.png)


    世界上最年轻的程序员去世时60岁。


    ![](img/40f5547c988795f8089b3518c78a314c_61_2.png)


    第一个计算机病毒是为了玩笑创建的。


    ![](img/40f5547c988795f8089b3518c78a314c_61_3.png)


    世界上最快的计算机是神华太湖。它每秒可以进行万亿次计算。


    第一台笔记本电脑重量为11公斤（24磅）。Colossus机在二战期间被用于布莱切奇公园破解德国密码。


    ## 词汇表

    以下是学习编程时实用的一些词汇含义。


    - 算法：执行任务的一系列简单步骤指令。为计算机编写的算法称为程序。

    - 位：计算机数据的最小单位。计算机数据存储在字节中；一个字节是八个位。

    - 控制台：用于玩游戏的计算机。

    - 数据：信息的另一种说法。数据按位测量并存储在内存中。

    - 调试：检查并移除错误。

    - 应用：通常为移动设备设计的用于任务任务程序。

    - Bug：程序中的错误，会导致程序运行异常或停止。

    - 数字：任何使用二进制的电子设备。

    - 下载：从互联网上的另一台计算机接收数据副本。

    - 应用：见

    - 芯片：存储内存或运行程序的微型设备。

    - 加密：将计算机数据另一种形式以保持秘密，只有某些人可以阅读。

    - ASCII：以计算机理解的格式存储数字和字母的代码。

    - 代码：计算机程序使用的编写指令或语言。

    - 图形：计算机创建的图像。

    - 汇编：人类难以阅读的简单计算机代码


    屏幕是电脑硬件的一部分。

    - 黑客：编写坏程序（恶意软件）以非法访问计算机的人。

    - 后端：计算机程序中对用户隐藏的部分。

    - 硬盘：在计算机上永久存储信息的内置设备。

    - 二进制：用于在计算机上存储信息的代码。它只使用数字0和1来表示字母和数字。

    - 硬件：电脑的物理部分，如键盘和电缆。


    ![](img/40f5547c988795f8089b3518c78a314c_63_0.png)


