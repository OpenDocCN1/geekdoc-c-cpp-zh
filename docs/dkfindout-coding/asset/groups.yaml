    ## Be a robot master

    Robot kits let you build a robot easily. You can then tell the robot what to do
    by writing code.


    ![](img/40f5547c988795f8089b3518c78a314c_60_3.png)


    Motherboard connects different parts of the.


    ![](img/40f5547c988795f8089b3518c78a314c_60_4.png)


    ## Facts and figures

    Coding is a fascinating area to explore. Here are some weird and wonderful facts
    you may not know.


    ![](img/40f5547c988795f8089b3518c78a314c_61_0.png)


    In 1980, the Department of Defense named a new language ADA, after the youngest
    programmer.


    ![](img/40f5547c988795f8089b3518c78a314c_61_1.png)


    The world''s youngest programmer was 60 years old.


    ![](img/40f5547c988795f8089b3518c78a314c_61_2.png)


    The first computer virus was created as a joke.


    ![](img/40f5547c988795f8089b3518c78a314c_61_3.png)


    The fastest computer in the world is Sunway Taihu. It can do 9 quadrillion calculations
    per second.


    The first laptop weighed 11 kg (24 lb). Colossus machines were used at Bletchley
    Park to crack German codes during World II.


    ## Glossary

    Here are the meanings of some words that are useful for you to know when learning
    about coding.


    - algorithm Set of simple step-by-step instructions for performing a task. algorithm
    written for computers is called a program

    - bit Smallest unit of data in a computer. Computer data is stored in bytes; one
    byte is eight bits

    - console Computer designed for playing games

    - data Another word for information. Data is measured in bits, and stored in a
    computer''s memory

    - debug To check for errors, and remove them

    - app Programs designed to be used for a specific task, usually on mobile devices

    - bug Mistake in a program, which makes it behave incorrectly or stop working

    - digital Any electronic device that uses binary

    - download Receiving a copy of data from one computer to another over the Internet

    - application see

    - chip Tiny device that stores memory or runs programs

    - encryption Converting computer data to another form to keep it secret so only
    certain people can read it

    - ASCII Code for storing numbers and letters in a format computers can understand

    - code Written commands, or language, used in a computer program

    - graphics Images created by a computer

    - assembly code Simple computer code that is not easily read by humans


    A screen is part of a computer''s hardware.

    - hackers People who wrote bad programs, called malware, to gain illegal access
    to a computer

    - back end Parts of a computer program that are hidden from the user

    - hard drive In-built device for storing information permanently on a computer

    - binary Code used for storing information on computers. It uses only two digits,
    0 and 1, to represent letters and numbers

    - hardware Physical parts of a computer, like keyboards and cables


