    # Key coders


    Computing has changed a lot since the first computers were invented, and programmers
    across the globe are working on new technology all the time. Some people create
    things that change our world. How many of these famous coders do you know about?


    ![](img/40f5547c988795f8089b3518c78a314c_51_0.png)


    # TIM BERNNERS-LEE


    English computer programmer Tim Berners-Lee created the World Wide Web in links
    in 1989. The World Wide Web links web pages together, and is now used by millions
    of people across the globe.


    ![](img/40f5547c988795f8089b3518c78a314c_51_1.png)


    # GRACE HOPPER


    A Rear Admiral in the US Navy as well as a computer scientist, Grace Hopper created
    the world''s first computer compiler – a program that converts ordinary language
    into code that a computer can understand.


    ![](img/40f5547c988795f8089b3518c78a314c_51_2.png)


    # MARK ZUCKERBERG


    University student Mark Zuckerberg became one of the youngest billionaires in
    the world when he created social media website Facebook in 2004. The site had
    one million users within ten months.'
  - '[PAGE 52]


    # MARGARET HAMILTON


    American computer programmer Margaret Hamilton worked for the US space agency,
    NASA. She was responsible for developing the on-board flight software that landed
    the first people on the Moon in 1969.


    # STEVE JOBS AND STEVE WOZNIAK


    Founders of technology company Apple, Americans Steve Jobs and Steve Wozniak built
    one of the earliest home computers in 1976. Now the Apple brand is one of the
    most successful in the world.


    # BILL GATES


    American Bill Gates co-founded Microsoft, a computer software company, in 1975.
    Ten years later, Microsoft created Windows, the most widely used operating system.


    # SERGEY BRIN AND LARRY PAGE


    Google, the world''s most popular search engine, was created by Sergey Brin and
    Larry Page in 1998. Today, around 80 to 85 percent of all Internet queries are
    typed into Google''s search engine.'
