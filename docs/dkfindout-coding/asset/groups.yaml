    # 计算机之前的编码


    在现代计算机发明之前，人们就已经在编写代码了。许多早期程序以打孔卡的形式存在，代表了一组指令。这些卡片被机器读取以执行不同的任务。


    # 帕斯卡机 (Pascaline)


    帕斯卡机是由法国数学家布莱斯·帕斯卡发明的。它是一种可以进行加法的简单的计算设备。


    总和是通过箱内部滚筒和齿轮的运动来计算的。


    ![](img/40f5547c988795f8089b3518c78a314c_11_0.png)


    # 雅卡织机


    这台织布机由约瑟·雅卡（Joseph Jacquard）制造。它能够根据打孔卡上的指令在织物上织出图案。


    # 人口普查机


    赫曼·霍勒律（Herman Hollerith）发明了这台机器为1890年美国人口普查记录数据。它使用打孔卡来记录年龄和性别等信息。


