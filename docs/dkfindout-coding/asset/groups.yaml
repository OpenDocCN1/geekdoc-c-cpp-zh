    ## Learning to code


    You can use books or online videos to get started with coding. The most important
    thing is to code as much as you can – practice makes perfect. Code won’t always
    be right the first time. It takes a lot of problem solving, but it is exciting
    when you get it right and your code works.


    ![](img/40f5547c988795f8089b3518c78a314c_59_0.png)


    ![](img/40f5547c988795f8089b3518c78a314c_59_1.png)


    ### Play!

    Using coding games to learn is a great way to start coding. This is because you
    can work at your own pace. You can choose easy or difficult games that let you
    learn as much as you want.


    ### Coding programs

    Simple programs, like Scratch, let you practise writing basic code. For example,
    you might write instructions that move a character round the screen.


    ![](img/40f5547c988795f8089b3518c78a314c_59_2.png)


    ![](img/40f5547c988795f8089b3518c78a314c_59_3.png)


    Hard drive saves data to a disk, and can read data stored on disks.


    ### Build your own computer

    Building a computer teaches you what the different parts are and how they work
    together. It’s not as hard as you might think!


    ![](img/40f5547c988795f8089b3518c78a314c_59_4.png)


    Keyboard


    ![](img/40f5547c988795f8089b3518c78a314c_59_5.png)


    Memory Stores Information


    ![](img/40f5547c988795f8089b3518c78a314c_59_6.png)


    ![](img/40f5547c988795f8089b3518c78a314c_59_7.png)


    Mouse


    ## Speak Code

    There are many different coding languages, such as Python, Ruby, and C++. Learn
    as many as you can so you can write code for different things.


    ## Code together

    You don''t have to learn coding by yourself. It is taught in schools all over
    the world. One of the most fun ways to code is is with a partner or as a member
    of a team. Once you know your stuff, you could even teach someone else to code.


    ![](img/40f5547c988795f8089b3518c78a314c_60_0.png)


    ![](img/40f5547c988795f8089b3518c78a314c_60_1.png)


