    MacPaint and MacWrite

    Apple releases two programs with its Macintosh computer, to allow users to draw
    and write on their computers.


    Internet browser

    Mosaic, the world''s first Internet browser, is released.


    HTML5

    The original HTML code for the World Wide Web is updated to HTML5, making it easier
    for coders to use.


