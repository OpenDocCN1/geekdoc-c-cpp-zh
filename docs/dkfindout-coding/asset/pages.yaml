  md: '# Coding before computers


    Even before the invention of the modern computer, people were creating code. Many
    early programs took the form of cards punched with holes, which represented a
    set of instructions. These cards were read by machines to perform different tasks.


    # Pascaline


    The Pascaline was invented by French mathematician Blaise Pascal. It was a simple
    calculating device that could add and subtract.


    Sums were calculated by the movement of drums and gears inside the box.


    ![](img/40f5547c988795f8089b3518c78a314c_11_0.png)


    # Jacquard loom


    This weaving machine was made by Joseph Jacquard. It could weave patterns in fabric
    by following instructions from cards punched with holes.


    # Census machine


    Herman Hollerith invented this machine to record data for the 1890 US census.
    It used punched cards such as age and gender.


    ![](img/40f5547c988795f8089b3518c78a314c_11_1.png)


    > FACT FILE

    >> When: Early 1800s

    >> Function: Loom

    >> Fun fact: Fabric patterns today are still created using special computer programs.


    ![](img/40f5547c988795f8089b3518c78a314c_11_2.png)


    A clerk would sit at the desk and insert punched cards into the machine.'
