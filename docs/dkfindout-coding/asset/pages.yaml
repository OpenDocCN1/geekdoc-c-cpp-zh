  md: '# # Computer History


    Computers are machines that process information. Discover some incredible computing
    inventions.


    ![](img/40f5547c988795f8089b3518c78a314c_69_0.png)


    ### Abacus

    Abacus beads are used for basic math around the world, including Egypt, Greece,
    and China.


    ![](img/40f5547c988795f8089b3518c78a314c_69_1.png)


    ### ENIAC

    The first electronic general-purpose computer is built at the University of Pennsylvania,
    in the USA.


    ### First clock

    Created in China, this mechanical clock is powered by running water.


    ### Analytical Engine

    Charles Babbage designs the Analytical Engine, an early gear-driven computer.


    | 500 BCE | 200 BCE | 700 CE | 1801 | 1822 | 1890 | 1936 | 1943 |


    ### Punch card loom

    Joseph Jacquard invents a punch card loom that weaves fabric patterns.


    ### Tabulating machine

    Herman Hollerith creates a machine that uses punched cards to store data.


    ### Antikythera

    The Ancient Greeks use this device to predict the position of stars and eclipses.


    The Antikythera was recovered from a shipwreck.


    ### Turing machine

    Alan Turing proposes a machine that can be programmed to follow instructions.


    ![](img/40f5547c988795f8089b3518c78a314c_69_2.png)


    ![](img/40f5547c988795f8089b3518c78a314c_69_3.png)


    The Hollerith machine recorded data from the 1890 census.


    ![](img/40f5547c988795f8089b3518c78a314c_69_4.png)'
