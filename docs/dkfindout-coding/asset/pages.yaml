  md: 'HTML Language used for programming webpages.


    stands for Hypertext Markup Language


    Internet Network that links computers across the world


    language Set of words and rules used to give computers instructions


    malware Harmful programs that steal information or damage computers


    memory Physical device on a computer used for storing information immediately


    motherboard Printed circuit that connects all the main parts of a computer, and
    passes instructions between them


    network Two or more linked computers that communicate electronically with each
    other


    operating system Most important program on a computer. It controls all the functions
    of the computer


    processor Computer chip that runs programs following machine code


    program Set of instructions a computer follows to complete a task


    programming Creating instructions for a computer to follow, written in a special
    language


    RAM Computer''s short-term memory, used to help it run faster. RAM stands for
    Random Access Memory


    Raspberry Pi Tiny computer used to help teach people computers work. It connects
    to different devices and can run programs


    ROM Computer''s long-term memory, which stores the important programs that tell
    it how to work. ROM stands for Read-Only Memory


    runtime Time during which a program is working, or running. A fast computer has
    a low runtime


    Scratch One of the easiest programming languages to learn. Coloured blocks are
    used to program and animate characters


    server Computer that can transfer information between computers over a network
    connection


    social media Website or application that allows users to communicate and share
    content with each other


    Vacuum tubes were used in early computers.


    software Various programs on a computer that tell it how to work


    upload Sending a copy of data to another computer over the Internet


    vacuum tubes Glass tubes used in early computers as on-off switches


    virus Malware attaches itself to another program and destroys files


    website Collection of linked webpages on the Internet


    Wi-Fi Technology allows computers to connect to other electronic devices or the
    Internet without wires


    World Wide Web Collection of pages of information, which link to each other like
    a web


    worm Harmful program that copies itself to other computers


