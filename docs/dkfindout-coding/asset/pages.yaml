- img_proc: true
  md: '# Turing test


    In 1950, Turing imagined a test to decide if a computer was “intelligent”. A human
    would communicate with a hidden partner and try to decide if they were really
    human, or a computer.


    # Tiger stripes


    After the war, Turing used maths to explore new kinds of science. In 1951, he
    created an equation to explain how patterns form in living creatures, like stripes
    on tigers, or the number of fingers on a hand.


    # Computer chess


    Turing published the world’s first chess-playing program, Turochamp, in 1951.
    No computer had power to run it, so Turing used the program’s rules to decide
    his moves in a real chess game.


    > Bombe, Turing designed the Bombe. In 1939, this early computer cracked enemy
    codes by testing every possible combination the Enigma machine could use. Over
    200 ran day and night at Bletchley Park.


    ![](img/40f5547c988795f8089b3518c78a314c_20_0.png)'
  merge: -1
