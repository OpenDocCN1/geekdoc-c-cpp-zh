  md: '# Game coders


    Games are one of the most popular types of app, and entire teams consist of coders
    who understand how to create the special code for things like scoring, levels,
    and explosions.


    # System coders


    Mobile phones, tablets, and computers run software that allows apps to communicate
    with them. System coders regularly have to create code so that apps can run on
    each different operating system.


    Web coders often need special code made by system coders for different web browsers.


    Game coders use application coding when designing how the game will look and how
    players will use it.


    Game coders need to understand audio coding in order to create the sounds in games.


    # Audio coders


    Sound is important for many types of app, especially games. Audio coders create
