  md: '# Interview with Ada Lovelace


    # Coding pioneer


    In 1842, English mathematician Ada Lovelace became the world’s first computer
    programmer. She is best known for her work on an early mechanical computer made
    by Charles Babbage. She helped to pave the way for the future of computers. This
    is an imaginary conversation with the clever countess.


    +   FACT FILE

    >> Name: Augusta Ada King-Noel, Countess of Lovelace

    >> Dates: 1815–52

    >> Location: England

    >> Fun fact: When Ada was 12 years old, she tried to build a flying machine!


    Q: Ada, when did you find out you were good at maths?


    Watercolour portrait of Ada from 1840


    A: Very early on. Even as a child I remember being good at solving mathematical
    problems.


    Q: Do you come from a family of mathematical geniuses?


    A: Not at all! However, my father was the celebrated poet, Lord Byron. I had tutors
    to teach me science and mathematics and although it was unusual for a young girl
    to learn these subjects, I soon found I was good at them.


    Q: How did you meet computer genius Charles Babbage?


    A: I was lucky enough to meet him in 1833 while he was teaching at Cambridge University
    in England.


    ![](img/40f5547c988795f8089b3518c78a314c_13_0.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'showed me a version of his machine called the Difference Engine. It was designed
    to stop people getting maths calculations wrong.


    Q: Is it right that Charles has given you a nickname?


    A: Yes! Charles calls me the “Enchantress of Numbers” and he is called the “Father
    of Computing”.


    Q: Tell us about the machine that you worked with Charles.


    A: The Analytical Engine was the second machine designed by Charles, and it was
    fascinating! Charles gave me the designs for the machine. I realized that it could
    use codes made up of letters, symbols, and numbers to solve problems. It was the
    first computer that could be programmed.


    Q: When did you actually write your computer program?


    A: In 1842, I wrote a set of instructions and showed them they could be used by
    the computer to solve a mathematics problem. A science journal in England published
    my findings.


    Q: So you are the first computer programmer?


    A: Well, yes, but I don’t like to brag! What excmites me is most is this machine’s
    potential. It is more than a calculator. The possibilities are endless! I believe
    all types of different things can be converted into computer code. Who knows what
    the future of computer coding will bring!


    ![](img/40f5547c988795f8089b3518c78a314c_14_0.png)


    The Analytical Engine (1837) was designed by Charles Babbage to solve more complex
    maths calculations than ever before.


    Modern-day laptop computer


    # Visionary Ada Lovelace believed computers could one day be used to create music
    or art.


    ![](img/40f5547c988795f8089b3518c78a314c_14_1.png)'
