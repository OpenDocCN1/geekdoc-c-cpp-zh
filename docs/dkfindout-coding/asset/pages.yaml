  md: '# Glossary


    Here are the meanings of some words that are useful for you to know when learning
    all about coding.


    +   algorithm Set of simple step-by-step instructions for performing a task. algorithm
    written for computers is called a program


    +   bit Smallest unit of data in a computer. Computer data is stored in bytes;
    one byte is eight bits


    +   console Computer designed for playing video games


    +   data Another word for information. Data is measured in bits, and stored in
    a computer''s memory


    +   debug To check for errors, and remove them


