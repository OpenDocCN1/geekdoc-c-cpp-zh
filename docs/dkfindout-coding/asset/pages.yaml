  md: '# ## Semaphore flags


    Semaphore is a system of signalling with hand-held flags. It is often used by
    ships at sea because the flags are easy to see from far away. The flags are held
    in different positions to signal letters and numbers.


    # ## Braille


    Some blind people use a system called Braille to read and write. Different sets
    of raised dots represent letters and numbers.


    ![](img/40f5547c988795f8089b3518c78a314c_10_0.png)


    This woman is learning sign language.


    ![](img/40f5547c988795f8089b3518c78a314c_10_1.png)


    ![](img/40f5547c988795f8089b3518c78a314c_10_2.png)


    # ## Sign language


    As deaf people can''t hear sounds, they can use sign language to communicate.
    Letters, numbers, and words can be shown using a variety of hand signs.


    ![](img/40f5547c988795f8089b3518c78a314c_10_3.png)'
