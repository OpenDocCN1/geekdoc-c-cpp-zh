  md: '# Meet the expert


    We met computer scientist Kiki Prottman to find out how to think like a coder.
    She is the curriculum manager at code.org, which aims to get more people involved
    in coding.


    Q: We know it is something to do with coding, but what is your actual job?


    A: I travel all over the place, showing students and teachers how to think like
    a computer scientist.


    Q: What made you decide to become a computer scientist?


    A: My dad taught me to program when I was a little girl. I enjoy the problem solving
    and creativity of computer science.


    ![](img/40f5547c988795f8089b3518c78a314c_54_0.png)


    ![](img/40f5547c988795f8089b3518c78a314c_54_1.png)


    Q: Do you use any special equipment?


    A: I get to play with computers, tablets, 3D printers, learning games, and robots
    like Dot and Dash!


    Q: What do you love most about coding?


    A: Computer science is a lot like ballet, poetry, or painting. It takes practice,
    but it''s a wonderful way to express yourself.


    Q: What is a usual work day for you?


    A: I don''t have a usual work day. I work from a home lot, so a lot of my work
    happens in my pyjamas!


    ![](img/40f5547c988795f8089b3518c78a314c_54_2.png)


    Q: Do you have a favourite thing that you have worked on?


    A: The project I''m working on right now teaches computer science using books,
    games, and craft projects. It''s a new way of introducing kids to coding.


    Q: What are the best and worst thing about your job?


    A: The best thing about my job is that I''m always working on something new. The
    worst thing is that technology and education move at very different speeds. Technology
    changes all the time! Schools change very slowly.'
  merge: -1
