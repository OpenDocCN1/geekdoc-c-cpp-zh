  md: '# Codes around us


    When we think of coding, we think of computers but codes are all around us. Throughout
    history, humans have created many different codes for communicating. Some codes
    are used to send secret messages, while others deliver information across long
    distances. People who cannot see or hear can use codes to speak to each other.


    Blind people use their hands to read Braille.


    # Morse code


    Morse code sent messages long distance along electric wires. Each letter was represented
    by a series of dots and dashes tapped out on a special machine.


    +   A -- Y -- 1

    B --- N -- 2

    C --- O -- 3

    D --- P -- 4

    E --- Q -- 5

    F --- S -- 6

    G --- T -- 7

    H --- U -- 8

    I --- V -- 9

    J --- W -- 0



    This is a short sound, or a dot.


    This is a long sound, or a dash.


    Morse code tapping machine


    WOW!


    The Ancient Egyptians had more than 700 different hieroglyphs.


    Picture languagenAncient Egyptians didn''t have an alphabet system. Instead, they
    used a series of pictures called hieroglyphs to represent sounds and words.


    This stone is covered with hieroglyphs.'
