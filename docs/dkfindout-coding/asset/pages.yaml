  md: '# Gaming


    Although they were once a rare hobby, people now spend more money on video games
    than music or films. They can be played on your own, or together with friends,
    and range from fast-paced action games to story-focused roleplaying games.


    > Tetris is the most popular video game ever, with 500 million copies sold.


    ![](img/40f5547c988795f8089b3518c78a314c_55_0.png)


    # Games console


    Video game consoles like Xbox or PlayStation are also computers, but their hardware
    is dedicated to playing games. This allows them to offer advanced graphics and
    sound. They become more powerful each year.


    Competition is fierce between different brands of console


    # Mobile gaming


    Games consoles get smaller all the time. Games that used to be too advanced for
    a computer can now be played, often for free, on phones or tablets. Some even
    use cameras to set the game in the world around the player.


    ![](img/40f5547c988795f8089b3518c78a314c_55_1.png)


    Mobile phones let you play games wherever you are'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Online gaming


    Early computer games had only one player. These days, online gaming means millions
    of people can play together in “massively multiplayer” games, or share their gaming
    experience online. Some famous gamers attract an audience of millions.


    ![](img/40f5547c988795f8089b3518c78a314c_56_0.png)


    Online gaming means you can play with people all over the world


    # Special controls


    Not all game controllers use buttons. Some look like instruments, dance mats,
    or even steering wheels. Motion controls allow gamers to play without a controller
    at all, as the game “watches” the player and responds to their movements.


    ![](img/40f5547c988795f8089b3518c78a314c_56_1.png)


    A guitar controller helps gamers rock out in rhythm games


    # Virtual reality


    The next big step in gaming is virtual reality. A headset can surround players
    with lifelike graphics that respond to their movements, so they feel like they
    are inside the game.


    ![](img/40f5547c988795f8089b3518c78a314c_56_2.png)


    Virtual reality games put players in the driver’s seat'
  merge: -1
  pgno: 56
