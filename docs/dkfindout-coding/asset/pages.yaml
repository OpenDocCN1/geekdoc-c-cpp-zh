  md: '# Teamwork


    Many coders work in teams. Teams are useful for dividing up work, coming up with
    new ideas, and solving problems. A coder may be given a job due to special skills
    they bring to the team. Teams are also a great way for coders to share their knowledge
    and learn new skills.


    ![](img/40f5547c988795f8089b3518c78a314c_57_0.png)


    # Graphic coders


    Today''s apps are colourful and eye-catching with incredible details. Graphic
    coders work on apps, as they are skilled in areas such as font design, movement
    (for games), and making art.


    ![](img/40f5547c988795f8089b3518c78a314c_57_1.png)


    Graphic coders receive instructions and feedback on their designs from application
    coders.


    ![](img/40f5547c988795f8089b3518c78a314c_57_2.png)


    Application coders advise system coders of any problems with the way the apps
    run by talking to the customers who use them.


    # Application coders


    One or more coders are usually in charge of creating the look of an app, and how
    people use it. These application coders often work closely with customers to make
    sure an app gives them what they want.


    # Web coders


    Websites generally have code running behind the scenes that controls things like
    online payments and video loading. Web coders create this code. It is used by
    millions of Internet users every day.


    ![](img/40f5547c988795f8089b3518c78a314c_57_3.png)


    Code for a website is often built based on design requests from application coders.


    54'
