  md: '# SSEM


    The Small-Scale Experimental Machine (SSEM) was built at Manchester University,
    UK. It was the first computer to store programs on its own memory, instead of
    on tape.


    ![](img/40f5547c988795f8089b3518c78a314c_24_0.png)


    # FACT FILE


    +   >> **When**: 1948


    +   >> **Weight**: 1 tonne (1.1 tons)


    +   >> **Fun fact**: The SSEM was nicknamed “Baby” as a joke, because it was so
    large.


    # UNIVAC I


    The UNIVAC I was the first computer to be sold to the public in the USA. Its name
    stood for “Universal Automatic Computer”. The UNIVAC I''s memory used seven large
    tanks of liquid mercury, which picked up electrical signals from pulses of sound
    sent by quartz crystals.


    ![](img/40f5547c988795f8089b3518c78a314c_24_1.png)


    # FACT FILE


    +   >> **When**: 1951


    +   >> **Weight**: 13 tonnes (14.3 tons)


    +   >> **Fun fact**: UNIVAC forecast Eisenhower''s victory in the 1952 US presidential
    election before anyone else.


    # IBM System/360


    The IBM 360 was the first series of computers to use programs that worked on more
    than one machine. They were designed to be affordable, so businesses could buy
    or rent them.


    ![](img/40f5547c988795f8089b3518c78a314c_24_2.png)


    # FACT FILE


    +   >> **When**: 1964


    +   >> **Weight**: Varied from 0.7 tonnes (0.75 tons) to 2.3 tonnes (2.6 tons)


    +   >> **Fun fact**: IBM 360 computers were used to plan the Apollo moon landings.'
