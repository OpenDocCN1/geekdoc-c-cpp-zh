  md: '# Coding History


    There have been some amazing discoveries in the history of software, the programs
    that tell computers how to work and what to do.


    ![](img/40f5547c988795f8089b3518c78a314c_2_0.png)


    Email

    Ray Tomlinson creates the first email program, for sending digital messages.


    WordStar

    Micropro releases the first word processor, letting people easily write on computers.


    Computer virus

    "Brain" is the first worldwide computer virus. It spreads across computers through
    floppy disks.


    Social media

    The world''s first social media network is created. It is called SixDegrees.


    ![](img/40f5547c988795f8089b3518c78a314c_2_1.png)


    1969


    1971


    1979


    1984


    1986


    1992


    2003


    2014


    ARPANET

    The first computer network is built, forming the basis of today''s modern Internet.


    The Apple Lisa,

    released in 1983, was one of the first personal desktop computers.


    MacPaint and MacWrite

    Apple releases two programs with its Macintosh computer, to allow users to draw
    and write on their computers.


    Internet browser

    Mosaic, the world''s first Internet browser, is released.


    HTML5

    The original HTML code for the World Wide Web is updated to HTML5, making it easier
    for coders to use.


    ![](img/40f5547c988795f8089b3518c78a314c_2_2.png)'
