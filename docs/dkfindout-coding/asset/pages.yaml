    # ### Staying up to date

    Technology is constantly changing. Coders must stay up to date with the latest
    programming languages and techniques. This can help them find jobs and build programs
    for the latest devices.


    Testing a new tablet


    # ## Accuracy


    Coders must always check and re-check code to make sure programs will work correctly.
    The instructions need to be clear, detailed, and broken down into small chunks
    that are easy to follow.


    ![](img/40f5547c988795f8089b3518c78a314c_8_1.png)


    Coding in space


    # ### Space code


    Astronaut and flight engineer Sunita Williams uses her laptop whilst in space.


    # ## How do you become a coder?


    You''re never too young to learn how to code. There are many books that teach
    coding, as well as plenty of information online. You can also learn to code at
    school, or you could find out if there are any coding clubs near you.


    ![](img/40f5547c988795f8089b3518c78a314c_8_2.png)


