- pgno: 136
  md: '# CHAPTER 6


    # Review of Subprograms


    # 6.1  Introduction


    It is necessary to understand why and how subprograms are used before trying to
    learn how to write macros. Though it is expected that the readers are well aware
    of subprograms, this chapter presents a brief review to refresh the memory. Even
    if one has used subprograms before, it is highly recommended that this chapter
    be read carefully, to eliminate the possibility of any missing link.


    # What Is a Subprogram?


    As the name suggests, a subprogram is a part of a program that is stored in the
    memory of CNC like any other program with a specified program number. It is not
    a complete program, and is designed to be called by some other program, which
    can be a main program, another subprogram, or a macro. A subprogram by itself
    would generally be meaningless, unless used inside some other program.


    # Why Is It Used?


    Sometimes a program contains repetitive program blocks that appear at several
    places without any change. For example, assume that a groove of certain geometry
    and 10-mm depth is to be cut on a flat plate on a milling machine. If the maximum
    permissible depth of cut is 2 mm, the groove would have to be milled in five passes,
    after placing the tool at successively increasing depths of 2, 4, 6, 8, and 10
    mm. This means that the program blocks, which define the geometry of the groove,
    would appear at five places in the program, making the program unnecessarily long.
    In such cases, a better way would be to store the repetitive blocks as a subprogram,
    and call it five times.'
  merge: -1
  img_proc: true
