- pgno: 42
  md: "# ## CHAPTER 3\n# Types of Variables\n\n# ### 3.1  Local and Global Variables\n\
    \nIn a high-level computer language, there are concepts of *local variables* and\
    \ *global variables*. Local variables are defined inside a subroutine, and are\
    \ local to them. They are used for intermediate calculations in the subroutine\
    \ and have no significance outside it or in another subroutine nested to it. So,\
    \ even if different subroutines use local variables with the same names, these\
    \ refer to different and independent memory locations, and hence do not affect\
    \ one another. And, in the case of nesting, after the execution of the nested\
    \ subroutine is over and the execution goes back to the calling subroutine, the\
    \ previously defined local variables of the calling subroutine again become available\
    \ to it, with the same previously stored values. The main program also can have\
    \ its own set of local variables. Global variables, on the other hand, are global\
    \ in nature in the whole program. They can be used anywhere with the same meaning\
    \ since these refer to the same memory locations:\n\n```\nMain program\n    GLOVAR\
    \ = 1\n    Call subroutine 1\n    Print GLOVAR                    (Prints 3, because\
    \ the global vari-\n                                   able, GLOVAR, gets modified\
    \ by\n                                   both the subroutines)\nEnd\nSubroutine\
    \ 1\n    Local variables: LOCVAR\n    LOCVAR = 1\n    GLOVAR = GLOVAR + 1\n  \
    \  Call Subroutine 2\n    Print LOCVAR                    (Prints 1, not 10, because\
    \ the local\n                                   variables LOCVAR of the two\n\
    \                                   subroutines are stored at differ-\n      \
    \                             ent and independent memory\n                   \
    \                locations)\n\nReturn\n```"
  merge: -1
  img_proc: true
- pgno: 43
  md: "```\nSubroutine 2\n    Local variables: LOCVAR\n    LOCVAR = 10\n\n    GLOVAR\
    \ = GLOVAR + 1\n    Return\n```\n\n> (LOCVAR defined here is different from LOCVAR\
    \ defined in Subroutine 1)\n\nSubprograms and macros are used as subroutines in\
    \ a CNC program. The discussion about local variables applies to macros only.\
    \ A subprogram does not have its own set of local variables. It uses the variables\
    \ of the calling program, with the same meaning. And, if a subprogram defines\
    \ some new variables, these become available to the calling program also, when\
    \ the execution returns to it. In fact, a subprogram can be considered to be a\
    \ part of the calling program only, which is defined separately to avoid multiple\
    \ typing of repetitive lines.\n\nIn macro programming terminology, local variables\
    \ are referred to as local variables only, but the global variables are referred\
    \ to as common variables. Further, common variables of a special type are available,\
    \ which retain the values stored in them even after the machine is switched off.\
    \ The values stored in these variables remain available in all the future machining\
    \ sessions and can be used/modified by all the programs. These can be cleared\
    \ (made null) or modified only intentionally. Such variables are called permanent\
    \ common variables. These variables are one of the unique features of macro programming,\
    \ and are not available in conventional programming languages such as PASCAL.\n\
    \nThere is one more type of variable that is used to read/write a variety of control\
    \ data, indicating machine status, such as current tool position and tool offset\
    \ values. These are called system variables, some of which are read-only type.\
    \ System variables are described in detail in Sec. 3.5.\n\nThus, macro variables\
    \ are of the following types:\n\n+   - Predefined, read-only null variable (#0)\n\
    +   - Local variables (#1 to #33)\n+   - Common variables (#100 to #199)\n+  \
    \ - Permanent common variables (#500 to #999)\n+   - System variables (#1000 and\
    \ above)\n\nVariables #34 to #99 and #200 to #499 are not available and cannot\
    \ be used.\n\n# 3.2 Effect of System Reset on Macro Variables\n\nWhenever M02\
    \ or M30 is executed, or the RESET button on the MDI panel is pressed, all local\
    \ variables (i.e., #1 to #33) and common variables (i.e., #100 to #199) are cleared\
    \ to null. This means that a common variable,"
  merge: -1
  img_proc: true
- pgno: 44
  md: "with the same meaning, can only be used in one program (and in the subprograms/macros\
    \ nested to it). So, if a calculated value in one program is needed to be used\
    \ in other program(s) also, it has to be stored in a permanent common variable\
    \ (i.e., #500 to #999).\n\nA permanent common variable always has the same meaning\
    \ for all the programs, not only in the current machining session, but also in\
    \ all future sessions, until it is modified to store a new value. And, it can\
    \ be modified anytime by any program. It can also be modified in the MDI mode.\
    \ It is not cleared by the M02/M30/RESET button.\n\nAlthough not recommended (in\
    \ the interest of a safe programming practice, as most of the people believe that\
    \ the local variables and the common variables in a new program start with null\
    \ values), the following parameter setting would retain the values stored in local\
    \ and common variables, even after system reset (though power OFF will still clear\
    \ them):\n\n+   - `Parameter 6001#6 = 1` — Retains common variables even after\
    \ system reset\n+   - `Parameter 6001#7 = 1` — Retains local variables even after\
    \ system reset\n\nThe default setting for these parameter bits is 0, which clears\
    \ the stored values, if any, whenever the system is reset. It is, however, good\
    \ programming practice not to depend on defaults and set all the local and common\
    \ variables to null before using them in a program. And, the permanent common\
    \ variables also should be carefully used because they may contain some previously\
    \ stored values.\n\n# 3.3 Levels of Local Variables\n\nA macro always starts with\
    \ null values for all the local variables, except those whose values are passed\
    \ on to the macro through the arguments of the macro call. The method of passing\
    \ desired values to certain local variables is discussed in detail in Chap. 7.\
    \ At this stage, it is sufficient to know that G65 P2 A5 is a macro call for program\
    \ number 2, with macro variable #1 = 5 (initially), and the other local variables\
    \ of the macro running null.\n\nThe local variables, defined in a macro, remain\
    \ accordingly defined only in the current call of the macro. Any subsequent call\
    \ of the same macro will again start with null values for all the local variables\
    \ (except, of course, those defined through the argument list):\n\n```\nMain program\n\
    \nO0001;                 (Program number 1)\nG65 P2 A5;             (The macro\
    \ execution starts with #1 = 5, and sets\n                       #10 = 5. Then,\
    \ it redefines #1 and stores 6 in it.\n                       Other local variables\
    \ of the macro remain null.\n                       Once the execution of the\
    \ macro is complete, the\n                       values assigned to #1 and #10\
    \ are lost)\n```"
  merge: -1
  img_proc: true
- pgno: 45
  md: "```\nG65 P2 A5;                 (This macro call does not get affected by the\
    \ previous\n                             call in any manner. The execution of\
    \ the macro\n                             starts with #1 = 5 and null values for\
    \ the remaining\n                             local variables, as in the previous\
    \ call. So, the macro\n                             sets #10 = 5 and #1 = 6, as\
    \ in the previous call)\nM30;                         (End of the main program)\n\
    \nMacro\n00002;                       (Program number 2)\n#10 = #10 + #1;    \
    \          (Recall that a null variable is equivalent to 0, in\n             \
    \                arithmetic operations)\n#1 = #1 + 1;                 (Redefines\
    \ #1)\nM99;                         (Return to the calling program)\n```\n\nNesting\
    \ of macros up to a maximum of four levels is allowed. This means that the main\
    \ program may call macro 1, macro 1 may call macro 2, macro 2 may call macro 3,\
    \ and macro 3 may call macro 4. If a local variable has the same designation in\
    \ both places used everywhere, it will have five different meanings, corresponding\
    \ to the main program and the four macros. When a macro calls another macro, a\
    \ new set of local variables becomes active. However, the values stored in the\
    \ local variables of the calling macro are not lost. After M99, when the control\
    \ returns to the calling macro, the previously stored values become available.\
    \ For example, let us assume that the main program and the four nested macros\
    \ set a local variable #10 equal to 1, 2, 3, 4, and 5, respectively. Then, when\
    \ the control returns to macro 5, macro 2 (after executing M99 of macro 3), the\
    \ value of #10 would be restored to 3. Note that the values of the local variables\
    \ of a macro are retained only in case of nesting, not in a subsequent call of\
    \ the macro, as already discussed.\n\nThe five different sets of the local variables\
    \ in nested macros are referred to as five levels (which are actually five different\
    \ memory locations) of local variables. The level of the main program is defined\
    \ as level 0, and the levels of the subsequent nested macros are incremented by\
    \ 1:\n\n+   - Main program:                         #1 to #33 of level 0\n+  \
    \ - Macro 1 (called by main program):     #1 to #33 of level 1\n+   - Macro 2\
    \ (called by macro 1):           #1 to #33 of level 2\n+   - Macro 3 (called by\
    \ macro 2):           #1 to #33 of level 3\n+   - Macro 4 (called by macro 3):\
    \           #1 to #33 of level 4\n\nNote that the main program can call both macros\
    \ and subprograms, and macros and subprograms can also call each other. Since\
    \ subprograms also allow a nesting of up to four levels, we can have a mixed nesting\
    \ of up to eight levels—for four macros and four for subprograms—in any order:\
    \ main program calling macro 1, macro 1 calling macro 2, macro 2 calling macro\
    \ 3, macro 3 calling macro 4, macro 4 calling subprogram 1, subprogram 1 calling\
    \ subprogram 2, subprogram 2 calling subprogram 3,"
  merge: -1
  img_proc: true
- pgno: 46
  md: 'and subprogram 3 calling subprogram 4. Several other combinations of the four
    macros and the four subprograms are also possible, such as main program calling
    macro 1, macro 1 calling subprogram 1, subprogram 1 calling macro 2, macro 2 calling
    subprogram 2, subprogram 2 calling macro 3, macro 3 calling subprogram 3, subprogram
    3 calling macro 4, and macro 4 calling subprogram 4. There is no restriction on
    the total number of macros or subprograms in a program, only the maximum level
    of nesting has to be four or less, separately for macros and subprograms. In other
    words, in case of a mixed nesting, not more than four macros or four subprograms
    are allowed. However, there is no restriction on the total number of nested calls
    at different places in the same program, as long as the maximum permissible level
    of nesting is not exceeded at each place.


    It should, however, be noted that subprograms do not have their own set of local
    variables. A subprogram uses the local variables as defined by the calling program
    (which can be the main program, a macro or another subprogram), and can also modify
    those variables. For example, let us assume that the main program calls a macro,
    and the macro calls a subprogram. If the same local variable #10 (say) is being
    used everywhere, then #10 of the main program and #10 of the macro will have different
    meanings (corresponding to level 0 and level 1, respectively), but #10 of the
    macro will be the same as #10 of the subprogram. If the subprogram modifies #10,
    it will also overwrite #10 of the macro, because both refer to the same memory
    location (corresponding to level 1).


    These concepts are further explained through examples of Figs. 3.1 and 3.2, depicting
    the maximum possible level of nesting. Refer to Chaps. 6 and 7 for the methods
    of calling subprograms and macros. For these examples, it is sufficient to know
    the following:


    +   - `G65 P2 A3;` — Calls program number 2 as a macro, and sets for the macro,
    #1 = 3, with the other local variables remaining null, initially.

    +   - `M98 P2;` — Calls program number 2 as a subprogram. The calling program
    and program number 2, both use the same set of local variables.

    +   - `M99;` — Returns execution to the calling program.


    Note that a subprogram is no different from a macro, structure-wise. Both (as
    well as the main program) can use all types of macro variables and macro functions.
    If a program is called by G65, it becomes a macro, and the rules regarding local
    variables are followed. The same program, if called by M98, becomes a subprogram.
    However, usually a program is designed to be used either as a macro or as a subprogram
    (or as the main program). If it is a macro, then certain local variables will
    be assigned to specific values through the argument list in the macro call statement;
    other local variables will remain null. It is also possible not to assign any
    initial value to any local variable,'
  merge: -1
  img_proc: true
