    \ Four digits from the right are considered the (sub)program number, and the remaining\
    \ digits (maximum three) to the left indicate the number of repetitions. And if\
    \ eight digits are specified in the P-word, the eighth digit from the right is\
    \ ignored:\n\n```\n~~~\nM98 P50001;         (Calls program number 1, five times,\
    \ which is\n                    equivalent to five consecutive blocks of M98 P0001\n\
    \                    or M98 P1)\nM98 P050001;        (Same as above)\nM98 P050001;\
    \        (Same as above)\nM98 P9990001;       (Program number 1 is called 999\
    \ times)\nM98 P12340001;      (Program number 1 is called 234 times. The eighth\n\
    \                    digit from right is ignored)\n~~~\n```\n\nA subroutine also\
    \ can be repeatedly called by inserting an L-word in the M98 block. The argument\
    \ of the L-word is the number of repetitions. The advantage of using this method\
    \ is that up to 9999 repetitions would be possible, compared to only 999 with\
    \ the earlier method:\n\n```\n~~~\nM98 P0001 L9999;    (Program number 1 is called\
