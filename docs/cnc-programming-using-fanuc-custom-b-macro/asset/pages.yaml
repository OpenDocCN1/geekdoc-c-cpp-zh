    # 6.4  Subprogram Nesting


    A subprogram can call another subprogram, which is called nesting. A maximum of
    four levels of nesting, involving the main program and four different subprograms,
    is permitted, that is, the main program can call subprogram 1, subprogram 1 can
    call subprogram 2, subprogram 2 can call subprogram 3, and subprogram 3 can call
    subprogram 4 (subprogram 4 cannot call any other subprogram). This is pictorially
    represented in Fig. 6.4, where the flow of execution is shown by arrows. Note
    that there is no restriction on the total number of subprograms or the number
    of nested subprograms in a main program, only that the level of nesting at a given
    place should be four or less.


    Refer also to Fig. 3.2 that explains that the variables of the main program and
    all the nested subprograms belong to the same set of variables. For example, if
    a variable, say #1, is being used by the main program as well as all the nested
    subprograms, then all five occurrences of #1 refer to the same memory location.'
  merge: -1
  img_proc: true
