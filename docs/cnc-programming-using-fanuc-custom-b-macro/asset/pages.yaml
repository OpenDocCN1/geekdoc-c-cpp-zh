    # ## 2.5 Real versus Integer Values


    Though perhaps inappropriate, Fanuc control is very liberal in the use of real
    numbers in place of integer numbers, and vice versa, in *macro statements* (only).
    While integer numbers in place of real numbers do not cause any problem, real
    numbers (direct assignment or the value of an arithmetic expression) used in place
    of integer numbers are automatically rounded. This has already been explained
    with reference to designation numbers of variables. Here are some different examples
    (once again, this is only a theoretical discussion, with the sole purpose of explaining
    the logic being followed by the control, as it might help in error diagnosis):


    ```

    #1 = 1000.4999;

    ```


    ```

    M03 S#1;             (Equivalent to M03 S1000)

    ```'
