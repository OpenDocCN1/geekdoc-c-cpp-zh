- pgno: 196
  md: "```\nM99;\n```\n\n(Return to the calling program.  \nStep 9 complete)\n\nIt\
    \ is left as an exercise for the readers to modify this macro to make it suitable\
    \ for both absolute and incremental modes. In fact, it is pretty simple:\n\n+\
    \   - In the beginning of the macro, read system variable #4003 to find out the\
    \ mode (it stores 90 in absolute mode, and 91 in incremental mode).\n+   - Replace\
    \ G01 by G90 G01 in the macro, to force absolute mode.\n+   - Command G91 at the\
    \ end of the macro, if the first step revealed incremental mode.\n\nThe examples\
    \ given above explain how a complex toolpath can be generated, if it is mathematically\
    \ defined. There is no need to use a CAM software for such a requirement. However,\
    \ a CAM software may not provide as much flexibility as is possible with a macro.\
    \ Some examples for a macro are discussed next.\n\nA complication in turning applications\
    \ is that the depth of cut must be limited to its maximum permissible value, for\
    \ a given cutting condition. Hence, it is not possible to obtain a complex turned\
    \ shape just by moving the tool along the generated boundary. One has to make\
    \ use of G71/G72/G73, where the part boundary is defined between P- and Q-block\
    \ numbers. If G71/G72 type II cycles are not available on a particular machine,\
    \ G73 would have to be used wherever the change in part diameter, along the axis\
    \ of the part, is not monotonic. G71/G72 type I cycles require that there be monotonic\
    \ increase or decrease in part diameter, along its axis.\n\nThe two cases are\
    \ discussed below: one with monotonic increase, and the other with nonmonotonic\
    \ increase. The monotonic case may be considered suitable for G71, whereas the\
    \ nonmonotonic case uses G73. However, as explained in the next section, G71/G72\
    \ cannot be used for such applications.\n\n# 8.4  Parabolic Turning\n\nReflectors\
    \ are given parabolic shapes because a signal or light emitted at its focus becomes\
    \ parallel to its axis after reflection, which makes transmission possible over\
    \ a long distance. Similarly, if it is used for receiving signals from a long\
    \ distance (which are nearly parallel rays), a signal receptor placed at its focus\
    \ receives strong converging signals. Parabolic turning, however, is not a standard\
    \ feature of a lathe, though it can be very easily done using a macro.\n\nConsider\
    \ the geometry shown in Fig. 8.4. It is assumed that the workpiece has an initial\
    \ bore, and the girth of the internal turning tool is small enough to enter the\
    \ hole, without any interference. If not, a central hole of"
