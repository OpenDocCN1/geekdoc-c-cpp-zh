    \ uniformly increasing radius.\n\nThe coordinates of some point P on the arc (X_p,\
    \ Y_p), as a function of angle θ, can be found using the following equations,\
    \ assuming the radius r changes with θ in a uniform (linear) manner:\n\nr = r_1\
    \ + ((r_B − r_A) θ) / ∠ACB\n\nX_p = X_c + r cos(θ + θ_A)\n\nY_p = Y_c + r sin(θ\
    \ + θ_A)\n\n+   where\n+   \n+   - r_A = CA (start radius)\n+   - r_B = CB (end\
    \ radius)\n+   - ∠ACB = included angle of the arc\n+   - θ_A = angle of CA with\
    \ the X-axis (start angle)\n+   - X_c = X-coordinate of the arc center C\n+  \
    \ - Y_c = Y-coordinate of the arc center C\n\nAt the start point of the arc (A),\
    \ the value of θ is zero. Thereafter, it gradually increases to reach the end\
    \ point (B). This forms the basis of an algorithm for this problem.\n\nThe first\
    \ step in developing an algorithm for the macro is to decide how to use the macro.\
    \ Here, it is assumed that the tool is 2 mm above the start point of the arc (A)\
    \ at the time of calling the macro, and it comes back to the same Z-level at the\
    \ end point of the arc (B) when execution of the macro ends. It is also assumed\
    \ that the calling program uses millimeters, (G21), the XY-plane (G17), feedrate\
    \ in millimeters per minute (G94), absolute coordinates (G90), no radius compensation"
