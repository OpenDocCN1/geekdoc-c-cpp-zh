- pgno: 64
  md: '#3902 and #3901, respectively. Part count information can also be seen/modified
    on the timer/part count screen, or through parameters 6713 and 6711 which store
    the number of parts required to be produced and the number of parts produced,
    respectively.


    The timer/part count screen also displays the total number of parts produced during
    the entire service time of the machine, as read-only information. Whenever a part
    is completed, both the number of parts produced and the total number of parts
    produced are incremented by 1. While the required and the completed number of
    parts can be altered (through the associated system variables, parameter settings,
    or through the setting screen), as and when desired, the total number of completed
    parts can be altered through parameter 6712. This information has been made available
    to keep a record of the total number of parts produced during the entire service
    time of the machine.


    The default setting (parameter 6700#0 = 0) of the machine increments the part
    count by 1 whenever M02, M30, or the M-code number specified in parameter 6710
    (which normally contains 30 only, signifying M30) is executed. If it is desired
    to increment the part count only after the M-code specified in parameter 6710
    is executed (which may be the same as or different from 02 or 30, but not 0, 98,
    or 99), set parameter 6700#0 = 1.


    Finally, note that M02 or M30 must be typed with the end-of-block (EOB) symbol
    (i.e., as M02; or M30;), otherwise the part count will not be incremented, even
    though the part would be produced without any error message (the control allows
    the missing EOB symbol at the end of the program).


    # Modal Information


    The G-codes have been categorized into different groups based on similarity in
    functionality. At any time, one G-code from each group (except Group 0) remains
    active. Those belonging to Group 0 are called *nonmodal codes*, which remain effective
    only in the block where they are programmed. Other codes are modal codes, which
    remain effective until replaced by some other code from the same group. For example,
    G01 is a modal code, grouped with G00, G02, G03, etc. So, if G01 is used once
    in the program, it need not be typed again, if the subsequent motions are executed
    with linear interpolation. However, as soon as G02 (or some other code from the
    same group) is commanded, G01 is cancelled and G02 becomes active.


    During programming, specially while using general-purpose macros, which are to
    be used with several programs, it may be necessary to know the active G-code of
    a particular group. For example, referring to a milling machine, if the main program
    calls a macro in incremental mode, the macro should interpret the values in the
    macro call argument list as being incremental values. The macro should work'
  merge: -1
  img_proc: true
