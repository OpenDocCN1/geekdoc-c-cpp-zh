  md: '```

    #2 = BIN[16];

    ```


    When converted to BCD format, becomes 0001 0000. The decimal interpretation of
    the converted BCD representation is 16. So, #1 stores 16)


    (Converts 0001 0000 to 1010, corresponding to equivalent decimal number 10. Explanation:
    There is a BCD number (0001 0000), which, when interpreted in binary, is 16. So,
    16 is the argument of the BIN function. This number, which is actually decimal
    10, becomes 1010 when converted to binary format. The decimal interpretation of
    the converted binary representation is 10. So, #2 stores 10)


    Note that, in both the examples, the same decimal number 10 is involved in conversion.
    The concept would be easier to understand if it is realized that the representation
    of a given decimal number in one format is converted to the representation of
    the same decimal number in the other format.


    Following similar logic, verify, as an exercise, that BCD[64] returns 100, and
    BIN[100] returns 64:


    ```

    0110 0100 ↔ 1000000

    ```


    (Both represent decimal number 64 in BCD and binary formats, respectively)


    Negative values for the arguments of BCD and BIN are not allowed (an “ILLEGAL
    ARGUMENT” alarm message would be displayed). The arguments should be integers.
    If a real value is specified, rounding to the nearest integer is automatically
    done.


    These functions are used in conjunction with system variables for interface signals
    (explained in Chap. 3), which are used for receiving/sending 16-bit/32-bit signals
    to/from the PMC. For example, if variable #1032 corresponds to input status 0000000000010011,
    it will store a decimal value of 19.000:


    ```

    #1 = #1032;    (#1 is set to 19.000)

    ```


    If the same signal is to be sent to an external device(s), in the BCD format,
    through variable #1132, BCD function would be needed:


    ```

    #2 = BCD[#1];

    ```


    (The BCD representation of 19 is 0000 0000 0001 1001. Its binary interpretation
    is 25. So, #2 is set to 25)


    ```

    #1132 = #2;

    ```


    (#1132 sends the required BCD signal, 0000000000011001)


    In fact, there is no need to involve intermediate variables. The following statement
    would do the same thing:


    ```

    #1132 = BCD[#1032];

    ```


    The BIN and BCD functions can also be used for variable #1133 that sends a 32-bit
    signal. Since the representation of a single-bit signal, in both binary and BCD
    formats, is the same, these functions are not needed for variables #1000 to #1015,
    and #1100 to #1115.'
