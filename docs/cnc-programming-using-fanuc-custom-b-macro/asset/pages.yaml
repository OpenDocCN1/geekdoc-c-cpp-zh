  md: "Coming back to the discussion on defining variables, note that a variable always\
    \ stores a value with minimum three decimal places, if the total number of digits\
    \ does not exceed eight. If less than three decimal places are used, zeroes are\
    \ added.\n\n```\nExamples:\n#1 = 1234;             (Stores 01234.000)\n#1 = 12345;\
    \            (Stores 12345.000)\n#1 = 123456;           (Stores 123456.000)\n\
    #1 = 1234567;          (Stores 1234567.0)\n#1 = 12345678;         (Stores 12345678)\n\
    ```\n\nIf more than eight digits are specified, the additional digits might be\
    \ converted to 0, after rounding up to eight digits (irrespective of decimal position),\
    \ which may give unexpected results, as explained in the following example:\n\n\
    ```\n#1 = 123456.789;     (Stores 123456.790 in variable #1)\n#2 = 123456.794;\
    \     (Stores 123456.790 in variable #2)\n#3 = #2 - #1;        (Stores 0.000 in\
    \ variable #3)\n```\n\nHowever, in the Fanuc 0i control, specifying more than\
    \ eight digits, for any value, generates an error message, \"TOO MANY DIGITS\"\
    , and terminates the program execution. It will not store values like 123456.789\
    \ in a variable, and will display the error message. If, however, more than eight\
    \ digits result after an arithmetic calculation, rounding is automatically done\
    \ up to eight digits, and no error (alarm message) or warning (operator’s message)\
    \ appear.\n\nA variable can also be defined in a conditional manner (conditional\
    \ statements are explained in Sec. 5.3):\n\n```\n#10 = 10;\n#25 = 5;\nIF [#10\
    \ GT #25] THEN #25 = #25 + 10;    (TRUE condition, so\n                      \
    \                     #25 becomes 15.000)\n```\n\n# 2.4  Display of Variables\n\
    \nIt is necessary to understand how the values of variables are displayed on the\
    \ macro variable screen, because it might cause some confusion. The calculated\
    \ value of a variable must lie within the permitted range (10⁻²⁹ ≤ magnitude ≤\
    \ 10⁴⁷, or be 0). However, all the legal values cannot be displayed correctly\
