  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_224_0.png)


    Note:


    +   1. The syntax of G174, a user-defined cycle, for drilling a deep hole can
    be

    +      G174 Z_ Q_ F_;

    +      where (in millimeter mode)

    +      Z is hole depth (in millimeters),

    +      Q is peck length (in microns) and

    +      F is feedrate (in millimeters per minute or millimeters per revolution).

    +   2. All the pecks and the retractions are along the axis of the hole. In the
    figure,

    +      these are shown separately for clarity.

    +   3. The designed toolpath is same as that in the standard G74 cycle, except
    that the retraction

    +      at the end of each peck is up to the start point, for driving the chips
    to outside the hole.

    +   4. All the outward motions (retractions) are rapid motions.

    +   5. Each inward motion is rapid up to 1 mm before the previous drilled depth,
    after which feed

    +      motion starts, to increase the depth by the specified peck length.

    +   6. The peck continues until the bottom of the hole is reached. Thereafter,
    the tool retracts to

    +      the start point of the cycle. The last peck would have an adjusted movement,
    to suit the

    +      specified depth.


    Figure 10.2 Deep-hole peck drilling on a lathe.


    +   3. If <required depth> is less than or equal to Q, go to step 15.

    +   4. Drill at the specified feedrate up to Q depth from the initial position.

    +   5. Store the current Z-position.

    +   6. Set <required depth> = <required depth> - Q

    +   7. Retract at rapid rate to the initial position.

    +   8. If <required depth> is less than or equal to Q, go to step 17.

    +   9. Rapid motion up to 1 mm before the Z-position at the end of the previous
    peck.

    +   10. Feed motion to increase the existing depth of the hole by Q.

    +   11. Store the current Z-position.

    +   12. Retract at rapid rate to the initial position.

    +   13. Set <required depth> = <required depth> - Q.

    +   14. Go to step 8.'
