    | Decimal Number | BCD Representation | Binary Interpretation |

    |---:|:---:|---:|

    | 0 | 0000 0000 0000 0000 | 0 |

    | 1 | 0000 0000 0000 0001 | 1 |

    | 9 | 0000 0000 0000 1001 | 9 |

    | 10 | 0000 0000 0001 0000 | 16 |

    | 19 | 0000 0000 0001 1001 | 25 |

    | 20 | 0000 0000 0010 0000 | 32 |

    | 99 | 0000 0000 1001 1001 | 153 |

    | 100 | 0000 0001 0000 0000 | 256 |

    | 999 | 0000 1001 1001 1001 | 2457 |

    | 1000 | 0001 0000 0000 0000 | 4096 |

    | 9999 | 1001 1001 1001 1001 | 39321 |


    external devices (that might be using signals in binary-coded decimal format,
    e.g., for seven-segment display of each digit of a number, separately), connected
    to the CNC.


    Recall that, in the binary-coded decimal (BCD) representation of a decimal number,
    each digit of the number is independently represented by four binary digits. Refer
    to Table 4.3 for some examples of BCD representations of up to four-digit decimal
    numbers. Note that four binary digits can have a highest decimal value of 15,
    but since the highest decimal digit is only 9, 1010 and above (i.e., up to 1111)
    do not appear in BCD representation.


    Format:


    ```

    #i = BCD[<binary interpretation of a binary number>];

    #i = BIN[<binary interpretation of a BCD number>];

    ```


    The arguments of both BCD and BIN are binary interpretations, and the results
    of conversion are again interpreted in binary. Note that the binary interpretation
    of a binary number is the actual number, but such an interpretation of a BCD number
    is not the number that the BCD represents. Format conversion is done with respect
    to the actual decimal number that is being represented in the two formats.


    Examples:


    ```

    #1 = BCD[101];

    ```


    (Converts 1010 to 0001 0000, corresponding to equivalent decimal number 10.) Explanation:
    There is a binary number (1010) which, when interpreted in binary, is 10. So,
    10 is the argument of the BCD function. This number,'
