    This is not an example of a macro involving a complex logic. Therefore, a flowchart
    or an algorithm is not really necessary. It is, however, recommended to at least
    write down how the toolpath is to be generated, which would streamline the thought
    process:


    +   1. Send the turret to its home position, and select tool number 1 with offset
    number 1.

    +   2. Place the tool at (X54 Z2), and face up to Z−0.5 using G94, in a single
    pass.

    +   3. Place the tool at (X50 Z2), and rough out using G71, leaving suitable finishing
    allowances.

    +   4. Send the turret to its home position, and select tool number 3 with offset
    number 3.

    +   5. Place the tool at (X50 Z2), and finish by G70, at reduced feedrate and
    increased rpm (CSS, with radius compensation). (Since it is a right-hand turning
    tool, the tool-tip number on a rear-type lathe would be 3 that has to be entered
    in the third row of the geometry or wear offset table. The radius of the tool
    tip is entered in the geometry offset table.)


    The defined profile, which is same for both G71 and G70, is shown in Fig. 9.2.


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_211_0.png)


