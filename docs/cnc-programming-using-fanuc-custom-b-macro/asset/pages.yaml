- pgno: 88
  md: '+   - `1 LT [2 AND 3]` — Equivalent to 1 LT 2, which evaluates to TRUE

    +   - `1 AND 2 LT 3` — Equivalent to 0 LT 3, which evaluates to TRUE

    +   - `1 AND [2 LT 3]` — Equivalent to 1 AND TRUE, which is meaningless, hence
    illegal

    +   - `[1 LT 2] AND [3 LT 4]` — Equivalent to TRUE AND TRUE. Hence, returns TRUE


    Similarly, Boolean values cannot be used in any arithmetic operation:


    +   - `1 * [2 LT 3]` — Equivalent to 1 * TRUE, which is meaningless, hence illegal

    +   - `1 * 2 LT 3` — Equivalent to 2 LT 3, which evaluates to TRUE


    Skipping brackets and relying exclusively on priority rules may make a program
    difficult to interpret in certain cases, some of which have already been discussed.
    A program should not just be error-free; it is important that its logic also is
    easy to follow. So, especially in complex conditional statements, use of extra
    brackets is highly recommended. Priority rules should mainly be used for arithmetic
    operations only. And, as a rule of thumb, a conditional expression must be enclosed
    within brackets.


    # Enabling Boolean Operations


    AND, OR, and XOR, as bitwise functions, are always available on the machine. However,
    their availability as Boolean functions is parameter (6006#0) dependent. The default
    setting of 6006#0 is 0, which does not allow AND, OR, and XOR to be used as Boolean
    functions. If their use as Boolean functions is also desired, set this bit to
    1. With this setting, these functions can be used as both as bitwise functions
    and Boolean functions. An example of a mixed use is given below, where behavior
    (bitwise or Boolean operation) of the AND function depends on the context of its
    use:


    ```

    IF [[[#1 AND #2] LT 2] AND [#3 LT #4]] THEN #5 = 1;

    ```


    Here, the first (from left) occurrence of AND is a bitwise operation, whereas
    the second occurrence is a Boolean operation.


    # An Application Example of Bitwise Operation


    The Boolean AND, OR, and XOR are used more often than bitwise AND, OR, and XOR
    in common applications. Bitwise functions are normally used in conjunction with
    system variables for interface signals for interacting with external devices connected
    to the CNC. As an example, consider the case where several pallets are available
    for holding the workpieces for a milling machine, and the'
