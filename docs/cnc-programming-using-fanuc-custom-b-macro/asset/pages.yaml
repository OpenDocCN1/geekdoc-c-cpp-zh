    # 12.5 Discrete Sensors for Sourcing/Sinking PLC Inputs


    In the standard PMC configuration, only discrete input/output signals are allowed.
    Input signals can be provided by mechanical switches (*momentary-* or *maintained-*type
    ON/OFF switch, or a limit switch) or proximity sensors. The proximity sensors
    have an electronic switching system inside them. These are typically *normally
    open* (N/O) type, and when an object comes within their designed range, the contact
    closes, simulating a switching action.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_260_0.png)


    **FIGURE 12.6** Discrete proximity sensors.


    Since an internal transistor is typically used for switching, such sensors can
    be both PNP and NPN types. The PNP-type sensor supplies +V<sub>CC</sub> on its
    output terminal, whereas an NPN-type sensor connects it to ground (0 V) when switched
    ON. In the OFF state, the output terminal remains electrically open. Thus, a PNP
    sensor provides a source output (+V<sub>CC</sub>), and it is called a source-type
    sensor. Similarly, an NPN sensor is called a sink-type sensor (since it draws
    current through its output terminal). Figure 12.6 shows both types of sensors.


    Electrical circuit can be complete only if the current supplied by a source is
    drained to a sink. Therefore, a sourcing sensor can only be connected to a sinking
    input of PLC. Similarly, a sinking sensor is connected to a sourcing input. While
    both possibilities exist, usually all PMC inputs at sourcing are connected as
    source-type sensors are connected to these. Figure 12.7 shows how a source-type
    sensor is connected to a sink-type PLC input. Connection to the PMC is done in
    a similar manner. (The input of the PMC may not have optoisolation.)


    A limitation of sink-type PLC inputs is that both the sensor and the PLC must
    use the same V<sub>CC</sub>. A sourcing PLC input, on the other hand, allows the
    sensor to work on a different V<sub>CC</sub> also; only the ground should be common.
    This is useful when the operating-voltage requirements of the sensor and the PLC
    are different. Such an arrangement is shown in Fig. 12.8, where a sink-type sensor
    is connected to a source-type PLC input. Note that the inputs of the PLC shown
    in this figure are actually source/sink type (AC type) that can be wired as both
    source- and sink-type. Here, source-type wiring is shown, which is needed for
    a sink-type sensor. The operating voltages of the PLC and the sensor, V<sub>CC1</sub>
    and V<sub>CC2</sub>, respectively, can be the same or different. However, as discussed
    earlier, this type of wiring is not recommended for safety considerations.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_261_0.png)


    **Figure 12.7** Sourcing sensor connected to a sinking PLC input.


    # 12.6  Output Types and Wiring


    In commercial PLCs, several types of outputs are available, employing different
    controls. The PMC used in I/O control, however, uses N-channel enhancement-type
    MOSFET switching technique. The switching action is similar to that of an NPN
    transistor, where source, gate, and drain of MOSFET correspond, respectively,
    to emitter, base, and collector of NPN transistor.


    A major difference between a MOSFET and a transistor is that MOSFET is voltage-controlled,
    whereas transistor is current-controlled (for required biasing). When a voltage
    is applied at the gate, an electrostatic field is generated which creates a conducting
    channel (P-type or N-type) between drain and source. No current flows through
    the'
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_262_0.png)


    **FIGURE 12.8** Sinking sensor connected to a sourcing PLC input.


    gate. This not only can provide isolation between input and output circuits, but
    the input load requirement also remains negligible, which is the main advantage
    of a MOSFET over transistors.


    The conductivity of the conducting channel between drain and source of a MOSFET
    depends on the voltage level on the gate. As in case of switching using transistors,
    MOSFET also is used for switching in its saturated mode of operation (i.e., the
    drain current is either zero or remains constant at its maximum value, for a given
    gate voltage). Figure 12.9 explains the switching action of an N-channel MOSFET.
    (The other type is P-channel MOSFET. The difference between the two is at the
    construction level. Overall circuit connection is same, except that polarity of
    source and drain changes. Its switching action is similar to that of a PNP transistor.)
    When the switch is pressed, the LED lights up. Notice that the high resistance
    connected to the gate'
