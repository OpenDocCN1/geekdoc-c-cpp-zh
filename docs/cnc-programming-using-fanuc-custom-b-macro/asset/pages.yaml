    \ correctly used for further calculations. Also, Fanuc 0i series controls do not\
    \ allow more than eight digits (including leading or trailing zeroes) for specifying\
    \ a value in direct assignment. Some examples are given below:\n\n```\n#1 = 0.00000001;\
    \                 (Illegal value, as it contains\n                           \
    \       more than eight digits)\n```"
