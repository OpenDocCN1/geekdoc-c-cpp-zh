- pgno: 89
  md: 'program needs to know whether the correct pallet is loaded. Each pallet has
    a unique designation number (e.g., 27), a binary coding system to indicate this
    number. It also has a number of independent N/O (normally open) limit switches
    (one switch for each binary signal) to indicate whether it is loaded or empty.


    Though the method described below is simple, it is not the best method, given
    practical considerations. It is given here because unless one realizes the limitations
    of a particular solution, one will not be able to appreciate the best solution.
    A better method is described at the end.


    In a simple coding arrangement, there can be an eight-pole dual in-line package
    (DIP) switch attached to each pallet (assuming, the largest pallet numbers is
    255 or less), and the switch setting would indicate the pallet number (in binary,
    i.e., 0 for OFF and 1 for ON), which could be 00011011 corresponding to 27. A
    DIP switch is a set of manual electric switches that are arranged in a group in
    a standard package. The whole package unit is referred to as a DIP switch in the
    singular. DIP is sometimes also referred to as DIL (dual in-line). This type of
    switch is designed to be used on a printed circuit board (PCB) along with other
    electronic components and is commonly used to customize the behavior of an electronic
    device for specific situations. Several types of DIP switches are available. The
    slide-type and the rocker-type DIP switches are very commonly used for binary
    coding. These are arrays of simple single-pole, single-throw (SPST) contacts,
    which can be either ON or OFF. This allows each switch to select a one-bit binary
    value. The values of all switches in the package can be interpreted as a decimal
    number. Eight switches offer 256 combinations—0 to 255—corresponding to 00000000
    and 11111111, respectively. A common multipin IC is another example of a dual
    in-line package.


    Each pole of the DIP switch is connected in series with an independent N/O limit
    switch, so that the binary signals would be sent only if the limit switch is pressed.
    A physical connection, through a ribbon cable (having eight signal wires and one
    common wire) between the terminal strip of the input/output (I/O) module of the
    PMC and the limit switches of each pallet, would be needed for sending the signals
    to the PMC.


    Addition of eight rungs in the PMC ladder, one for each input signal, for writing
    these signals (in a sequential manner) to the appropriate G-signals (G54.0 to
    G54.7), would define the corresponding system variables (#1000 to #1007, and #1032).
    While #1000 to #1007 would contain 0 or 1, corresponding to the OFF/ON state of
    the corresponding switch, #1032 would contain the complete information in its
    16 bits (in fact, the decimal interpretation of the binary representation, 27
    in this case, would get stored in #1032). So, by analyzing the content of #1032
    bitwise AND/OR/XOR are needed for this purpose. For example, #1032 XOR 27 would
    return 0 for #1032 = 27, and a nonzero number otherwise. So, a 0 value would confirm
    that pallet'
