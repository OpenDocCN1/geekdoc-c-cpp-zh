  md: '(G40), and no active canned cycle (G80). It is further assumed that the correct
    tool (slotdrill of 6 mm diameter) is held by the spindle, and it is rotating with
    the correct rpm. Finally, the choice of WCS (G54) and tool length compensation
    (G43 H_) are assumed to be correct. With these assumptions, the macro cannot be
    said to be quite general, but the purpose here is to describe the technique of
    generating an arc with varying radius. The arc, of course, would be defined in
    terms of a number of variable parameters, making it quite general. Once the basic
    program is ready, it becomes easy to make it more general, as per requirement.
    In fact, it is not recommended to consider all the possibilities in the very beginning,
    as such an approach makes programming difficult, leaving enough scope for logical
    errors.


    The parameters of the slot, the selected letter addresses for these, and the associated
    local variables, as per argument specification I (refer to Table 7.4), are given
    in Table 8.1. Since the letter addresses would be used for passing data in the
    G65/G66 macro call, their choice should reflect their actual physical meanings,
    as much as possible. This would help in recalling which letter address refers
    to which parameter. In the present case, the first letters of the parameters have
    been chosen as letter addresses, except A and F, where it would not be possible.


    Now, the algorithm for this problem, suitable for WHILE...DO END loop, can be
    written (note that the specified condition is checked in the beginning of the
    loop, in a WHILE statement):


    +   1. Make a plunge entry up to the specified depth, with the specified plunge
    feedrate.

    +   2. Choose the increment in angle, Δθ, and assign θ = Δθ.

    +   3. If θ is greater than the included angle of the arc, go to step 8.


