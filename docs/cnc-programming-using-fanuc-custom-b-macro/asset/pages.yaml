  md: "![](img/1341ce50369ce8fcfb8dc3539d51c52f_223_0.png)\n\n**Note:**\n\n1. The\
    \ syntax of G74 for drilling a hole is\n   ```\n   G74 R_\n   G74 Z_ Q_ F_\n \
    \  ```\n   where (in millimeter mode)\n   R is retraction after each peck (in\
    \ millimeters),\n   Z is hole depth (in millimeters),\n   Q is peck length (in\
    \ microns) and\n   F is feedrate (in millimeters per minute or millimeters per\
    \ revolution).\n2. All the pecks and the retractions are along the axis of the\
    \ hole. In the figure, these are shown separately for clarity.\n3. The peck continues\
    \ until the bottom of the hole is reached. Thereafter, the tool retracts to the\
    \ start point of the cycle. In general, the last peck would have a movement of\
    \ Q+R, to suit the specified depth.\n\n# FIGURE 10.1  Peck-drilling cycle (G74)\
    \ on a lathe.\n\nsatisfactorily when the hole is too deep, because though it does\
    \ break the chips, it does not clear them. While this would not cause any problem\
    \ with a through-coolant drill, it is likely to result in a reduced tool life\
    \ because of chip clogging and coolant starvation, if solid drills are used. G74\
    \ is, in fact, the lathe equivalent of G73 on a milling machine, with similar\
    \ limitations. While G83 is available on a milling machine, which clears the chips\
    \ by retracting to outside the hole (up to R-point) after each peck, it is usually\
    \ available on a lathe only if it has live tooling. Therefore, it is desirable\
    \ to have a user-defined G-code on a lathe, which retracts the tool to outside\
    \ the hole after each peck. The desired toolpath is shown in Fig. 10.2, where\
    \ the G174 code number has been especially chosen to indicate that it is a modified\
    \ version of G74. In fact, it is for this very reason that the peck length in\
    \ G174 has been kept in microns, not in millimeters. This ensures that the Z-,\
    \ Q- and F-words of both the cycles have the same meanings. Thus, both G74 and\
    \ G174 can be used in the same manner, except that G174 would have a “missing”\
    \ first block. Any programmer would be able to make use of G174, as if it were\
    \ a built-in canned cycle of the control, without bothering about how it was made\
    \ available on the machine. And so what if the programmer had never heard about\
    \ macro programming!\n\nOur next task is to define such a G-code. Referring to\
    \ Table 7.1, 174 would need to be stored in parameter number 6051 (say), while\
    \ the corresponding macro 0901 should generate the desired toolpath, as shown\
    \ in Fig. 10.2, for which the following algorithm can be used:\n\n+   1. Store\
