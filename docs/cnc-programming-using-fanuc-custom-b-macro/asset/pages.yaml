    The macro call (with G65 or by other methods) should appear in a separate block,
    as in the given example where G98 and G99 are not clubbed with G183. If a G-code
    is commanded to the left of the macro call, in the same block, it is ignored by
    the control. On the other hand, a G-code to the right of macro call alarms out,
    because it is considered an argument of the macro, whereas a G-word is not allowed
    as an argument. M98 has a different behavior in this situation. It does not ignore
    the G-code or alarms out, but does not wait for the completion of G-code execution.
    Hence, if it is a movement code (such as G01), the subprogram execution would
    start while the tool is still moving. Therefore, to avoid any confusion, subprograms
    and macros should always be called in separate blocks.


    Some of the canned cycles, as well as codes for special functions such as helical
    interpolation, are available as options, for which additional payment is required
    to be made to the control manufacturer. It is also possible to activate any option
    at a later date, provided the hardware of the machine tool is equipped to handle
    it (in case of doubt, consult the MTB). However, as the given examples demonstrate,
    it is possible for the users themselves to define the required G-codes, with desired
    features. And these can be made even better than the standard codes, in certain
    cases! If you know macro programming well enough, and are ready to flex your brain,
