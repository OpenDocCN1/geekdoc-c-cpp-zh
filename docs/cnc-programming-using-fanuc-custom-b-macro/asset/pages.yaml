  md: 'The following algorithm can be used for developing a macro (O8021) for this
    problem:


    +   1. Set arguments for G81, with K0 (with K0, the information gets stored without
    drilling a hole).

    +   2. Calculate the angle between consecutive holes, by dividing 360 by the number
    of holes.

    +   3. Set <hole counter> = 1.

    +   4. If the hole counter is greater than the number of holes, go to step 8.

    +   5. Specify XY-coordinates of the first/next hole. (This would make the tool
    move to the specified coordinates where a hole would be drilled by G81.)

    +   6. Increment hole counter by 1.

    +   7. Go to step 4.

    +   8. Cancel canned cycle.

    +   9. Return to the calling program.


    ```

    ```

    O8021 (BOLT HOLES ON A FLANGE) ;

    G81 Z[ABS[#26]] R#18 F#9 K0 ;

    (Arguments of G81 specified. Step 1

    complete)

    #100 = [360 / #11] ;

    (Angle between subsequent holes calcu-

    lated. A negative value for the number

    of holes, H, is also permitted that would

    drill the holes in the clockwise direc-

    tion. Step 2 complete)

    #101 = 1 ;

    (Hole counter initialized. Its value indicates

    the hole number that is to be drilled next.

    1 and #1 correspond to the first and the last

    holes, respectively. Step 3 complete)

    WHILE [#101 LE ABS[#11]] DO 1 ;

    (Jump out of the loop if the hole counter

    exceeds the specified number of holes,

    i.e., when all the holes have been drilled.

    Step 4 complete)

    #102 = #19 + #100 * [#101 - 1] ;

    (Calculates the angular position of the

    first/next hole with respect to the X-axis,

    i.e., the CCW angle subtended at the center

    of the pitch circle by the position where the

    next drilling is to be done. A negative value

    for the start angle, #19, is also permitted.)

    #103 = #24 + [#7 / 2]COS[#102] ;

    (X-coordinate of the first/next hole

    calculated)

    ```

    ```'
