- pgno: 121
  md: '# Methods of Zero Shift


    We will now consider a simple example to see how such system variables can be
    identified and manipulated for a desired effect through a program. Let us say,
    the requirement is to place the origin of the currently active (or some other)
    workpiece coordinate system (among G54–G59 or optionally available 48 additional
    coordinate systems G54.1 P1–P48) at the current XY-position of the tool, on a
    milling machine. This is known as a zero shift or datum shift. Recall that the
    origin of the workpiece coordinate system (G54, G55, etc.) is also referred to
    as the workpiece zero point or the program zero point or the component zero point,
    and at any time, any one of the six standard and 48 additional workpiece coordinate
    systems can be selected to be the active coordinate system. A program is executed
    in the currently active coordinate system (CNC interprets the coordinate values
    used in a program in the currently active coordinate system).


    Zero shift can be very simply done just by commanding G90 G92 X0 Y0, which is
    obviously the simplest method. The corresponding command on a lathe is G50 X0
    Z0. Zero shift for single axis is also possible. For example, G90 G92 Z0 (G50
    Z0 on the lathe) shifts zero only for the Z-axis. However, a limitation of using
    G92 or G50 is that the shift remains valid only for the current machining session.
    Once the machine is switched off and again switched on, the information fed to
    it through G92 or G50 in the previous session is lost, and the machine starts
    using the original zero setting. Moreover, zero shift, using this method, can
    only be done for the currently active coordinate system.


    On the other hand, if zero shift is done by manipulating the values stored in
    the system variables for the relevant work offset distances, the shifted origin
    remains fixed at the new position permanently, until the offset values are changed
    again (using any method). In addition, this method works for all coordinate systems,
    even if these are not currently active. Of course, if the system variables, corresponding
    to the offset distances of a coordinate system which is not currently active,
    are manipulated, its effect will be seen only after this coordinate system becomes
    active.


    The system variables for various offset values are read/write type. So, if the
    values stored in them are changed, the corresponding offset distances automatically
    change. Conversely, if the offset distances are changed, the corresponding system
    variables automatically get redefined (i.e., store new values). Note that the
    terms “offset distance,” “offset value,” and even “offset” are usually used synonymously.
    So, X-offset value, X-offset distance, and X-offset all mean the same thing.


    Further discussion on this topic necessitates a clear understanding of the way
    the control defines and uses the various coordinate systems. Refer to Fig. 5.12
    for the discussion that follows. The X- and Y-offset distances are the X- and
    Y-component (with sign) of the corresponding offset vector shown in this figure.
    For a lathe, replace X by Z, and Y by X.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_122_0.png)


    # Machine Coordinate System


    On any machine, the origin of the *machine coordinate system* (MCS), which is
    also called the *machine zero point*, is placed at a desired location by a parameter
    setting. This is done by the MTB, and there is no need for the end-user to change
    it. In fact, it must not be changed because several machine settings are done
    in MCS.


    For example, the 1300 series parameters (refer to the *Parameter Manual* for details)
    are used for defining the software overtravel limits for the tool movement. If,
    due to a programming error or otherwise, the tool is required to enter the prohibited
    zone, it will automatically stop at the boundary, with an alarm. Such a software
    limit is desirable because of safety considerations. For example, the tool should
    never hit the chuck or the tailstock on a lathe. The software limits do not allow
    the tool to enter a defined dangerous zone. These limits are specified in certain
    parameters, as coordinate values in MCS. This means that any change in the position
    of the MCS would automatically redefine the prohibited zone, which is obviously
    not desirable. So, one can say that the MCS is fixed for a given machine.


    The MCS, however, is not convenient for running part programs; in fact, the control
    does not allow program execution in MCS. There are other coordinate systems for
    this purpose.


    # External Workpiece Coordinate System


    The *external workpiece coordinate system*, which is usually referred to simply
    as the *external coordinate system*, is defined relative to'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'MCS, as shown in Fig. 5.12. The X- and Y-coordinates (in MCS) of the origin
    of this coordinate system are called the X- and Y-external offsets. These values
    are stored in system variables #5201 and #5202, respectively, on a milling machine.
    All other workpiece coordinate systems (G54, G55, etc.) are defined with respect
    to this coordinate system, which is its only purpose. It cannot be used for program
    execution. A program is always executed in the chosen workpiece coordinate system
    (WCS). If no choice is made, G54 is used which is the default WCS.


    The external workpiece coordinate system is used for uniformly shifting the origins
    of all the other workpiece coordinate systems. Such a situation arises when the
    same fixture, which holds a number of workpieces, all requiring to be machined
    in different coordinate systems (G54, G55, etc.), is placed at a different location
    on the machine table. In such cases, instead of redefining G54, G55, etc. independently,
    only the external coordinate system is redefined to have the same effect. Such
    a situation on a lathe arises when the original chuck, which was used for offset
    setting, is replaced by another chuck with a different holding position along
    the Z-axis. If such a requirement is not there, there is no need to use this coordinate
    system. In such cases, all the external offset values are kept zero, which means
    that this coordinate system coincides with the MCS, and G54, G55, etc. are, effectively,
    directly defined with respect to the MCS.


    # G54–G59, G54.1 P1–P48 Workpiece Coordinate Systems


    Six standard and 48 optional (which are activated, on milling machines only, on
    extra pay with workpiece coordinate systems are available. These are all defined
    with respect to the external workpiece coordinate system, as shown in Fig. 5.12.
    The various offset distances are stored in different system variables, as shown
    in Tables 3.12 and 5.2 (which is a subset of Table 3.12).


    These coordinate systems are used for machining purpose (only), and placed at
    desired locations (i.e., at the desired datum of the workpiece) by specifying
    the various offset distances. The procedure of tool offset setting actually measures
    these offset distances only.


    Only one of these coordinate systems can be active at a time. The coordinates
    used in the program are interpreted by the control, in the active coordinate system
    (say, in the G54 coordinate system, though the control internally converts all
    coordinates to the machine coordinate system). If there is only a single workpiece
    to be machined all the time, there is no need to have so many workpiece coordinate
    systems. However, in a practical situation, several workpieces need to be machined,
    all having data at different locations. In such cases, independent coordinate
    systems, corresponding to every datum, are defined, and the appropriate coordinate
    system is made active'
  merge: -1
  img_proc: true
