    \ that store some value. The following examples assume that #1 stores 1.3, and\
    \ #2 stores 1.7:\n\n```\nROUND[#1]                 (Returns 1.0)\nROUND[#−2] \
    \               (Returns −2.0)\nFIX[#1]                   (Returns 1.0)\nFIX[#−2]\
    \                  (Returns −1.0)\nFUP[#1]                   (Returns 2.0)\nFUP[#−2]\
    \                  (Returns −2.0)\n```\n\nIt is also possible to round a value\
    \ to the desired number of places after the decimal point, which may be needed\
    \ for some special application. For example, if 100.12345 is required to be rounded\
    \ up to four places after the decimal point, carry out the following procedure:\n\
    \n```\n#1 = 100.12345;             \n#2 = #1 * 10000;            (Sets #2 = 1001234.5)\n\
    #3 = ROUND[#2];             (Sets #3 = 1001235.0)\n#4 = #3 / 10000;          \
    \  (Sets #4 = 100.12350)\n#1 = #4;                    (#1 contains rounded value\
    \ up to four places\n                            after the decimal point, 100.1235)\n\
    ```\n\nThese commands are given separately for the purpose of explaining the intermediate\
    \ calculation steps. It is also possible to combine these in a single nested block,\
    \ in the following manner:\n\n```\n#1 = ROUND[#1 * 10000] / 10000;\n```\n\nFor\
    \ rounding to three places after the decimal point, use 1000 as the multiplier;\
    \ for two places after the decimal point, use 100, and so on.\n\nSpecial care\
    \ is needed while using the FIX function because of a possible inaccuracy in macro\
    \ calculations. For example, if variable #1 contains 0.002, and variable #2 is\
    \ defined as #1 * 1000, the resulting value may not exactly be 2. It may typically\
    \ be 1.9999999. As a result, FIX[#2] would return 1.0! So, in such cases, either\
    \ use the ROUND function, or modify the calculated value appropriately. Since\
    \ the least input increment on the machine in millimeter mode is 0.001, it is\
    \ safe to add 0.0001 to the calculated value, for the purpose of rounding it down.\
