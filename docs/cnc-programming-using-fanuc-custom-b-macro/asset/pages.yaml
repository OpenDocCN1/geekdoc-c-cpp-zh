    #2 = 1;                                      (b, i.e., coefficient of x)\n#3 =\
    \ −2;                                     (c, i.e., constant term)\n#100 = #2\
    \ * #2 − 4 * #1 * #3;                (Determinant calculated)\n\nIF [ABS[#100]\
    \ LT 0.000001] GOTO 10;          (Branching to N10 if determinant\n          \
