- pgno: 130
  md: 'At this stage, it is appropriate to point out a major difference in the way
    a program is run in MDI and AUTO modes. While these two modes are for different
    purposes: the MDI mode for 2–3 line programs which are not required to be saved,
    and the AUTO mode for running long programs stored in the memory of the CNC, this
    is not the only difference. When a program is run in the MDI mode, the system
    does not reset automatically when the execution is over. If reset is desired,
    M02 or M30 will have to be explicitly programmed. On the other hand, even if M02
    or M30 is missing at the end of the program being run in the AUTO mode, the system
    will get reset automatically when the execution ends (if parameter 3404#6 is set
    to 0, the system enters the execute state if M30 or M02 is missing at the end
    of the program. The default setting of this parameter is 1, which resets the system
    without any alarm, even if M30 or M02 is missing). This means that if a single-line
    program G66 is executed in the MDI mode, G56 will become the active WCS. On the
    other hand, if the same program is executed in the AUTO mode, the active WCS will
    change back to G54 at the end of the execution! Another difference, which is not
    relevant to our discussion, is that *dynamic graphic display* is not available
    in the MDI mode.


    The given program for datum shift, after some changes, can also be used for automatic
    tool offset setting, using *touch probes*, which will drastically reduce the set-up
    time. This aspect is discussed in detail in Chap. 11.


    # 5.6  Nested WHILE Statement


    The discussion in this chapter is complete, except that no example for a nested
    WHILE statement has been given so far. A simple WHILE statement is used when a
    number of similar operations are required to be done, as long as a specified condition
    remains satisfied. On the other hand, if each operation involves another set of
    similar operations, in a conditional loop, then a nested WHILE statement is used.
    Though the control allows one more level of nesting, it is practically never needed.


    The regular rectangular array of holes on a plate, shown in Fig. 5.13, can be
    very conveniently made using a canned cycle for drilling (say, G81), as all canned
    cycles can be repeated specified number of times. Program number 8012 is one such
    program for this job. It is assumed that the required depth of holes is 5 mm,
    and the top surface of the plate is the datum for the Z-axis. XY-datum is placed
    at the center of hole-1 as shown in the figure.


    Program number 8013 uses a two-level nested WHILE statement, based on the flowchart
    given in Fig. 5.14. In the nested WHILE statement, the outer loop has been used
    to drill the required number of holes along the X-axis (i.e., on the Y = 0 line),
    and the inner loop has been used to create a column of holes at each hole made
    by the outer loop.'
