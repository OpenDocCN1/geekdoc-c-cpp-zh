    +   F (#9) = feedrate

    +   #100 = stores Z-coordinate of the initial tool position

    +   #101 = stores <required depth> (the remaining depth to be drilled), which
    is updated after every peck

    +   #102 = stores Z-coordinate at the end of a peck, hence this also is updated
