  md: 'different programs for the five pins. A single parametric program O8020 would
    produce all five pin types (as well as pins with any other dimensions, as long
    as the overall geometry is the same), when called with the desired values for
    parameters A, B, C, D, and R that correspond to local variables #1, #2, #3, #7,
    and #18, respectively, in program O8020. Thus, G65 P8020 A10 B10 C15 D25 R2 would
    produce pin number 1, G65 P8020 A15 B10 C15 D30 R2 would produce pin number 2,
    and so on.


    The following assumptions have been made while writing the macro:


    +   1. The calling program is in millimeter mode (G21).

    +   2. The initial diameter of the workpiece is 50 mm, for all the pins.

    +   3. The workpiece zero point is at the center of the right face of the workpiece.
    (In fact, all the lathe programs in this text assume the same location for the
    workpiece zero point.)

    +   4. The workpiece requires a facing of 0.5 mm, in one pass. (A tailstock is
    not being used to support the workpiece.) Note that this would result in the right
    face of the part being at Z = -0.5 mm, since Z = 0 is assumed to lie on the right
    face of the workpiece.

    +   5. The feedrate and the spindle speed (or CSS, the constant surface speed
    in G96 mode) in the calling program are correct and would be used for roughing.
    For finishing, feedrate would be halved and spindle speed/CSS would be doubled.

    +   6. Tool number 1 with offset number 1 would be used for roughing, and tool
    number 3 with offset number 3 would be used for finishing.

    +   7. G71 (Type I) and G70 would be used for roughing and finishing, respectively.

    +   8. Part-off operation is not needed (would be done separately, using, say,
    G75), for which 3 mm extra length should be provided on the larger diameter.


    These assumptions are not really a limitation of the given macro. One always has
    to first decide what the macro is supposed to do, which is what has been done
    here. If some of these assumptions are not quite suitable in a certain case, the
    macro would need to be modified accordingly. In general, modifying in a macro
    is much simpler than writing a new macro. In fact, one should always start with
    a simple and easily achievable goal. The complexities should be incorporated one
    by one, only after the basic macro is ready and tested. Trying to develop a complex
    macro in the very first attempt is a source of confusion, leading to programming
