    # 11.5 Finding Angle of an Edge


    Sometimes the machining program for a rectangular block is written with program
    zero point at, say, the lower left corner of the block, with the coordinate axes
    being parallel to its axes. In such a case, a very accurate (hence expensive)
    fixture is needed, to hold the workpiece properly. An inaccurate fixture would
    hold it incorrectly, as shown in Fig. 11.4, where the coordinate system used for
    programming (X-Y) does not coincide with the workpiece coordinate system (X<sub>w</sub>Y<sub>w</sub>).
    A solution to this problem would be to shift the workpiece zero point to point
    O, and then execute the machining program using coordinate-system-rotation feature
    (G68). Calling macro C0808, after placing the tool at point O, would shift the
    coordinate system, as done in the previous example. For commanding G68, the angle
    θ (in degrees) must be known. The algorithm would be


    +   1. Find angle θ.

    +   2. Find X- and Y-coordinates of point O.

    +   3. Place the tool at point O (at a safe height from the workpiece).

    +   4. Call C0808.


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_246_0.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: '+   5. Command `G17 (G68 X0 Y0 R<θ>)` (X0 Y0, which is the center of rotation,
    can be left blank because the current tool position automatically becomes the
    center of rotation, if it is not specified).

    +   6. Execute machining program.

    +   7. Command `G69` (cancel coordinate rotation).

    +   8. End of program.


    The X- and Y-coordinates of point O, and the angle θ, can be determined using
    touch probes. For this, the probe would need to touch the orthogonal edges of
    the workpiece at three points, as shown in Fig. 11.4. Let the coordinates of each
    of the points be $(x_A, y_A)$, $(x_C, y_C)$, and $(x_D, y_D)$, respectively, corresponding
    to points A, C, and D. The equation given below can be used for necessary calculations.
    (Try to derive these, using coordinate geometry.)


    The equations of lines CD and AB (which is orthogonal to CD) would be:


    $$y_{CD}=\frac{y_D-y_C}{x_D-x_C}(x-x_C)+y_C$$


    $$y_{AB}=-\frac{x_D-x_C}{y_D-y_C}(x-x_A)+y_A$$


    The coordinates $(x_B, y_B)$ of the point of intersection of these lines (point
    B) can be found out by solving these equations simultaneously, which gives:


    $$x_B=\frac{m^2x_C-my_C+x_A+my_A}{m^2+1}$$


    $$y_B=\frac{-mx_C+y_C+mx_A+m^2y_A}{m^2+1}$$


    where


    $$m=\frac{y_D-y_C}{x_D-x_C}$$


    Angle θ would be given by


    $$\theta=\tan^{-1}m$$


    Finally, the coordinates of the program zero point O would be


    $$x_O=x_B+\sqrt{2}\,r\cos(\theta+45)$$


    $$y_O=y_B+\sqrt{2}\,r\sin(\theta+45)$$


    where r is the radius of the ball of the probe.'
