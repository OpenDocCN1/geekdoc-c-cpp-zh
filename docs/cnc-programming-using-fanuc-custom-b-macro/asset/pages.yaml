- pgno: 152
  md: '# # CHAPTER 7

    ## Macro Call


    # ### 7.1 Introduction


    Several of the macro-programming features have already been discussed. The use
    of these features is not restricted to just macros. They can be used anywhere—in
    the main program, subprograms, and macros. A macro program, however, is a unique
    feature of macro programming, which adds an entirely new dimension to what can
    be done through programming. Developing a macro does require good programming
    skills, possessed by very few individuals, but using a macro is pretty simple—it
    is like commanding a canned cycle. This chapter explains how to define and use
    macros.


    # ### 7.2 Macro versus Subprogram


    A macro can be broadly described as a sophisticated version of sub-programs (this
    is the reason why this chapter is preceded by the chapter, Review of Subprograms).
    The overall program structure is the same for both. A subprogram can be called
    by the main program, other subprograms or macros, and it can also call any type
    of program. Similarly, a macro can be called by any program, and it can call any
    program. Both allow nesting up to a maximum of four levels. In case of a mixed
    nesting, a maximum of four subprograms and four macros can appear, in any order,
    apart from the main program.


    The single major difference between a subprogram and a macro lies in the flexibility
    of the input data. A subprogram either does not use variables at all, or always
    uses fixed initial data for the variables used inside it, with values as defined
    in the calling program at the time of calling the subprogram. A macro, on the
    other hand, uses the values specified in the macro-call statement, for its local
    variables. (If the macro call statement does not define a local variable, it remains
    null, initially.) In fact, as discussed in Chap. 3, a subprogram does not even
    have its own set of local variables. It uses the variables of the calling program.
    Common variables, permanent common variables, and system variables, of course,
    behave in the same manner in both subprograms and macros.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# ### 7.3 Macro Call


    By now, it should be clear that the main difference between a macro call and a
    subprogram call is that the level of local variables changes with a macro call,
    but it does not change with a subprogram call. Moreover, a macro call can pass
    data to the called program, whereas a subprogram call does not have this capability.


    A subprogram is called by M98 and M198. A macro can be called using any of the
    following methods:


    +   * Simple call (G65)

    +   * Modal call (G66)

    +   * Call with user-defined G-code

    +   * Call with user-defined M-code


    Those who are new to macro programming may skip the last two methods of calling
    a macro, at this stage. Even the modal call (G661) is not very frequently used.
    G65 can be used for calling any macro, without any limitation. Other methods do
    provide some convenience, but one can manage with G65 also. However, one must
    know all the methods because of the specific advantages these offer. Moreover,
    any method may have been used in the programs developed by other programmers,
    which one can understand only if one knows the method used. However, in the interest
    of a steeper learning curve, one may choose to read about G65 only. The remaining
    methods can be learned at a later stage. One may skip Sec. 7.4 also.


    # ### Simple Call (G65)


    The syntax of macro call with G65 is


    ```

    ```

    G65 P<program number> L<repetition count> <argument 1>

    . . . <argument n>

    ```

    ```


    The program number is the number of an existing program that is to be called.
    Usually, 8000 or 9000 series numbers are used as macro-program numbers, since
    these can be protected from accidental editing/deletion, through parameters 3202#0
    and 3202#4, respectively. However, any legal program number (1 to 9999) can be
    used.


    Repetition count, which defaults to one (i.e., L1 can be omitted), is the number
    of successive executions of the called macro. This is the only way a macro can
    be repeatedly executed. The repetition count of a macro cannot be included in
    the P-word, unlike what can be done for repeating a subprogram call. As explained
    in Chap. 6, the repetition count of a subprogram can be included in the P-word
    also (apart from the L-word method). Here, the P-word is used only for specifying
    the program number. Up to 9999 macro repetitions are possible.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'The argument specification is for passing on the desired initial values to
    the local variables of the macro. All the local variables, #1 through #33, can
    be initialized. The uninitialized local variables remain null in the beginning
    of the macro execution. The exact method of argument specification is discussed
    in Sec. 7.5.


    As an example, G65 P8000 L2 A10 B20 calls program number 8000 twice, in succession,
    with #1 (because of address A) and #2 (because of address B) set to 10 and 20,
    respectively, whereas the other local variables (#3 through #33) remain null,
    initially. Note that the called macro modifies variables #1 and #2, its second
    call would start with the new values stored in #1 and #2. Similarly, if the first
    call defines a new local variable, say, #3, then the second call would start with
    the stored value of #3. (The first call started with a null value for #3.) In
    other words, all repeated calls of a macro, the specified values in the argument
    list are passed on to the local variables only in the first execution of the macro.
    Any subsequent execution uses the values obtained in the previous execution.


    Thus, G65 P8000 L2 A10 B20 is not equivalent to G65 P8000 A10 B20 commanded twice
    in two successive blocks. If a macro is called in two (or more) successive blocks,
    the macro becomes independent of the previous executions, with each execution
    using the initial values in its macro-call block, as the initial values for its
    local variables.


    For a better clarity, consider program 00013 that repeatedly calls subprogram
    00014 and macro 00015, thrice each, followed by three separate macro calls of
    00016 in three successive blocks. Programs numbers 14, 15, and 16 are essentially
    same, but behave differently depending on how these are called, which explains
    the underlying principles. Recall that the same program becomes a subprogram when
    called by M98, and a macro when called by G65 or G66. Some of these concepts have
    already been discussed in Chap. 3. (Refer back to Figs. 3.1, 3.2, and 3.3.)


    | Program statement | Explanation |

    |---|---|

    | `O0013;` | (Program number 13) |

    | `#1 = 1;` | (The value assigned here is used only by this program and the nested
    subprogram O0014, but not by the nested macros, because a subprogram uses the
    local variables of the calling program, whereas macros use a different set or
    level of local variables) |

    | `M98 P0014;` | (Same as M98 P0014 L3, to execute O0014 thrice in succession,
    as a subprogram) |

    | `G65 P0015 L3 A1;` | (Calls O0015 as a macro, thrice in succession. The first
    execution uses #1 = 1, initially, but the second and third executions start with
    the updated values of #1, obtained at the end of the first and second executions,
    respectively) |

    | `G65 P0016 A1;` | (Calls O0016 as a macro once, with #1 set to 1, initially)
    |'
