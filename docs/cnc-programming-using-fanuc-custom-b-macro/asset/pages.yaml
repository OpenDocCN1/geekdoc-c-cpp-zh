- pgno: 12
  md: '# # Preface


    Due to excellent accuracy, repeatability, and several other unparalleled and exotic
    features, computer numerical control (CNC) machines have now virtually completely
    replaced manual machines in the manufacturing industry. Even small manufacturing
    units are now using CNC machines because these prove to be cheaper in the long
    run. In fact, “why CNC?” is not at all a topic of discussion these days.


    CNC machines with recently introduced *macro programming* features have become
    so powerful that not using the macro features is like using the latest mobile
    handset only for exchanging voice messages. Unfortunately, there is a lack of
    adequately trained personnel in this area. The main reason is that because this
    is an industry-oriented subject, engineering colleges/polytechnics do not deal
    with it in sufficient detail. Even the commercial CNC training schools generally
    provide only basic CNC training, and the few training school that do provide advanced
    training charge exorbitantly. The worst part is that, because of professional
    competition, people are generally unwilling to share their knowledge with their
    colleagues; in such a scenario, it is difficult to learn macro programming, which
    is often rightly described as the *best kept secret* of CNC.


    The root cause of hindrance in learning macro programming is the lack of suitable
    books in this area. Even the manuals which come with the machines do not serve
    the purpose because, though these do describe all the features of the language,
    these are actually reference books not written in a textbook style. As a result,
    while these are good for getting detailed information about some specific programming
    feature, one cannot really learn the language in a systematic manner from them.
    What is required is a text with step-by-step instructions, starting from the very
    basic principles and gradually proceeding further in order of complexity. This
    was the prime motivation for the present book. It is a self-sufficient text, designed
    to be read from beginning until the end, in chapter sequence. No external help,
    in the form of any other book or an instructor, would be needed. One can learn
    simply by *self-study*.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'The present text specifically deals with the Fanuc version of macro programming
    language called *Custom Macro B* (*Custom Macro A* is outdated and no longer used),
    with reference to 0 series controls. Though the language is the same on all control
    versions of Fanuc (as well as on Fanuc-compatible controls), some of the *system
    variables* and *control parameters* differ on different control versions. Therefore,
    one would need to verify these from the respective machine manuals and make necessary
    changes wherever required.


    Finally, note that though every care has been taken to ensure that the programs
    given in the text are error free and work as intended, neither the author nor
    the publisher assumes any responsibility for any inadvertent error that might
    have crept in. As a rule of thumb, one should always check the simulation of a
    new program before actual execution.


    Suggestions for further improvement would be gratefully acknowledged. Any feedback
    can be sent directly to the author at sinha_nsit@yahoo.co.uk.


    S. K. Sinha'
  merge: -1
  img_proc: true
