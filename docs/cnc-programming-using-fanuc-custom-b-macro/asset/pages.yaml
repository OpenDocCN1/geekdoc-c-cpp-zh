    # ROUND, FIX, and FUP


    Three functions are available for explicit rounding: ROUND, FIX, and FUP. These
    are used for rounding a real number to the nearest integer, the lower integer,
    and the upper integer, respectively. The operation of these functions is similar
    to that in a typical high-level programming language, except that the CNC control
    saves the integer answer as a real number with zero after the decimal point.


    **Examples:**


    | Function | Result |

    |---|---|

    | `ROUND[10.0]` | Returns 10.0 |

    | `ROUND[10.2]` | Returns 10.0 |

    | `ROUND[10.499999]` | Returns 10.0 |

    | `ROUND[10.5]` | Returns 11.0 |

    | `ROUND[10.8]` | Returns 11.0 |

    | `FIX[10.0]` | Returns 10.0 |

    | `FIX[10.2]` | Returns 10.0 |

    | `FIX[10.499999]` | Returns 10.0 |

    | `FIX[10.5]` | Returns 10.0 |

    | `FIX[10.8]` | Returns 10.0 |

    | `FUP[10.0]` | Returns 10.0 |

    | `FUP[10.000001]` | Returns 11.0 |

    | `FUP[10.2]` | Returns 11.0 |

    | `FUP[10.499999]` | Returns 11.0 |

    | `FUP[10.5]` | Returns 11.0 |

    | `FUP[10.8]` | Returns 11.0 |


    The result of operating these functions on a negative number is the same as that
    in the case of a positive number, except that the negative sign is retained:'
