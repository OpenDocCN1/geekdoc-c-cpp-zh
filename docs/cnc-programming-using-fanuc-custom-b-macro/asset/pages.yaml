- pgno: 178
  md: '# ## 7.6 Processing of Macro Statements


    It is first necessary to understand the concept of *buffering* during program
    execution, before discussing how macro statements are processed by the control.


    # ### What Is Buffering?


    Though the execution of a program is block by block, the control pre-reads the
    NC statement to be executed next, for smooth machining. The next NC statement
    is read and interpreted in advance, but executed only after the execution of the
    previous statement is complete. If both are movement commands, the execution of
    the second command starts a little before the end point of the first command is
    reached, which results in slightly rounded corners. This small distance is called
    *in-position width*, which is specified in parameter 1827. For obtaining sharp
    corners, specify a small value in this parameter. Alternatively, on a milling
    machine, run the program in the *exact stop mode*, G61. However, rounding the
    corners speeds up the execution, due to less deceleration/acceleration effect,
    and, in most of the cases, very sharp corners are not needed. In radius compensation
    mode, two NC statements are read in advance, and if one of these is not a movement
    command in the plane of compensation, then one more NC statement is preread. Such
    a prereading operation is referred to as buffering.


    # ### How Many Blocks Are Buffered?


    Up to three NC statements are buffered, depending on specific situations, though
    the blocks next to G31, M00, M01, M02, M30, and M-codes specified in parameters
    3411 to 3420 are not buffered. However, the control tries to buffer as many macro
    statements as it can, during the execution of the current NC statement.


    # ### When Are the Buffered Blocks Processed?


    As already mentioned, a buffered NC statement is processed (executed) after the
    execution of the current NC statement ends (or "nearly" ends). However, a macro
    statement is immediately processed, as soon as it is buffered.


    Processing of macro statements depends on how buffering is done by the control.
    There are four possible situations, in which buffering is done differently. Processing
    of macro statements in these cases is described next, with the help of examples.


    # ### Processing When the Next Block Is Not Buffered


    While executing certain M-codes and G31, the control does not buffer the next
    block. Therefore, if the next block contains a macro statement,'
  merge: -1
  img_proc: true
