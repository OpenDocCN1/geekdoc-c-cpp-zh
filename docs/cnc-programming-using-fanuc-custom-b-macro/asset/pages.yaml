    is shown in Fig. 12.10, where external relays, powered by external 24-V DC power
    supply, are being controlled by DC signals. Relays are used because a MOSFET cannot
    take very heavy current. Moreover, it cannot be used for AC devices. A relay obviates
    such problems.


    All output terminals must be wired independently, as shown in the figure. Never
    short two (or more) output terminals to drive a single device. Also note the presence
    of reverse-biased diodes, connected in parallel with each relay coil. Such a diode
    prevents excessive voltage built-up across the relay coil of the relay, when the
    MOSFET signal turns OFF. If unchecked, the developed voltage can rise up to several
    hundred volts, which can damage the MOSFET. The diode shunts the induced current,
    preventing voltage rise-up. In fact, some relays are manufactured with this diode
    preinstalled.


    A limitation of source-type outputs is that all output devices would have to work
    on the same $V_{CC}$ (though this does not matter because we use only relays as
    output devices, and we can always decide to use some type of relays), since $V_{CC}$
    is connected to the common output-terminal (DOCOM). In a sink-type output (which
    is not available with PMC), 0 V is connected to the common output-terminal, and
    $V_{CC}$ goes directly to output devices. Hence, it is possible to use'
