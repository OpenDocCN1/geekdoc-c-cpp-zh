- pgno: 297
  md: '# # Master CNC macro programming


    CNC Programming Using Fanuc Custom Macro B shows you how to implement powerful,
    advanced CNC macro programming techniques that result in unparalleled accuracy,
    repeatability, flexible automation, and enhanced productivity. Step-by-step instructions
    begin with basic principles and gradually proceed in complexity. Specific descriptions
    and programming examples follow Fanuc''s Custom Macro B language with reference
    to Fanuc 0i series controls. By the end of the book, you will be able to develop
    highly efficient programs that exploit the full potential of CNC machines.


    # ## COVERAGE INCLUDES:


    +   - VARIABLES AND EXPRESSIONS

    +   - TYPES OF VARIABLES—LOCAL, GLOBAL, MACRO, AND SYSTEM VARIABLES

    +   - MACRO FUNCTIONS, INCLUDING TRIGONOMETRIC, ROUNDING, LOGICAL, AND CONVERSION
    FUNCTIONS

    +   - BRANCHES AND LOOPS • SUBPROGRAMS • MACRO CALL

    +   - COMPLEX MOTION GENERATION

    +   - PARAMETRIC PROGRAMMING • CUSTOM CANNED CYCLES

    +   - PROBING • COMMUNICATION WITH EXTERNAL DEVICES

    +   - PROGRAMMABLE DATA ENTRY'
