- pgno: 86
  md: 'may be meaningless, but not illegal. Note that since multiplication and AND
    have equal priority, the expression would be evaluated from left to right as:


    ```

    #1 = [#2 * #3] AND #4;

    ```


    On the other hand, multiplication has higher priority than OR. Hence, both the
    following statements are equivalent:


    ```

    #1 = #2 OR #3 * #4;

    #1 = #2 OR [#3 * #4];

    ```


    If evaluation of OR is desired first, brackets will have to be used:


    ```

    #1 = [#2 OR #3] * #4;

    ```


    One may not always remember all the priority rules, so it is a good practice to
    use brackets to avoid confusion. Extra brackets do no harm, except that the maximum
    permitted level of nesting is five. If this limitation creates problem, or if
    multiple nesting makes the expression too complex, break the expression into smaller
    parts, spread over multiple lines.


    # Boolean Functions


    The logical AND, OR, and XOR can also be used as Boolean functions, operated upon
    two Boolean expressions, and the result of operation is a Boolean value—TRUE or
    FALSE (recall that bitwise operation is done on two arithmetic values or arithmetic
    expressions, and the result of operation is an arithmetic value). These are often
    used in IF and WHILE conditional statements (conditional statements are described
    in detail in the next chapter), in a manner such as


    ```

    IF [<conditional expression-1> AND <conditional

    expression-2>] THEN #1 = 1;

    ```


    which sets #1 = 1, if both conditions are TRUE.


    Such as use of AND, OR, and XOR is similar to AND, OR, and XOR functions of any
    high-level computer programming language, and the meaning is the same as that
    in plain English. The truth table (given in Table 4.2) is similar to that of bitwise
    functions.


    | Condition-1 | Condition-2 | AND | OR | XOR |

    |---|---|---|---|---|

    | FALSE | FALSE | FALSE | FALSE | FALSE |

    | FALSE | TRUE | FALSE | TRUE | TRUE |

    | TRUE | FALSE | FALSE | TRUE | TRUE |

    | TRUE | TRUE | TRUE | TRUE | FALSE |


    Table 4.2  Truth Table for Boolean AND, OR, and XOR'
  merge: -1
