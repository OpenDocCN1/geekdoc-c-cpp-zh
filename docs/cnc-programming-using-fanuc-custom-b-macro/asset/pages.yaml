  md: '# **FIGURE 12.9** An N-channel enhancement-type MOSFET as a switch


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_263_0.png)


    consumes negligible power. Refer to a basic text on solid-state devices for more
    information about MOSFETs.


    The output signals of PNC are designed to be used as sourcing outputs, with MOSFETs
    used as switching devices. A typical output wiring for CB104 (wiring for CB105,
