  md: '# # CHAPTER 11

    ## Probing


    # ### 11.1 Introduction


    The productivity of a CNC machine can be increased if the set-up time and inspection
    time are reduced, by automating these time-consuming processes. The technique
    broadly involves automatic measurement of certain dimensions, and taking machining-related
    decisions, based on the result of measurement. This process is referred to as
    *probing*.


    The device that is commonly used for probing is a touch probe that remains electronically
    connected (through a cable or an infrared/radio signal) to the control. A touch
    probe senses very small displacement, and sends out an electrical signal (called
    *skip signal*) when “touched.” The control immediately stores the probe/tool position
    at the moment it receives the signal, in system variables, #5061–#5064 (refer
    to Table 3.11), and stops further movement of the tool. The stored positions at
    planned locations are used for calculating the desired dimensions.


    There are two basic types of touch probes: *tool probe* and *work probe*. A tool
    probe is used for automating the tool offset setting procedure, which is a manual
    process involving error-prone human judgment. It is a fixed-type probe, and remains
    attached to a stationary part on the machine body. The tool, which is to be probed,
    is made to touch it (probe). Since the position of the probe is known, information
    regarding the geometry of the tool can be extracted. Moreover, a periodic repetition
    of this process gives information about the extent of tool wear, so that the wear
    offset could be suitably edited to nullify the error introduced due to tool wear.
    A sudden and large change in tool dimensions indicates tool breakage.


    Work probe, on the other hand, is a moving-type probe. It is held by the machine
    the way a tool is held. It is moved like a tool, so as to touch the workpiece/finished
    part at desired locations. The stored positions at skip signals are used to calculate
    the desired dimensions of the workpiece/finished part. The examples in this chapter
    pertain to this type of probe only. Such a probe has a long stylus, with a small
    ruby ball at its end (ruby is used since it is hard and hence prevents any change
    in the dimension of the ball due to wearing). When the'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'ball presses against a fixed surface, the stylus deflects a little bit, and
    disturbs an optical focusing arrangement inside the probe. A differential photocell
    senses the change in the position of the image point, and triggers a signal. The
    diameter of the ball has to be taken into account in calculations, if required.
    (In some cases it does not come into the picture, e.g., it may cancel out while
    taking a difference in two positions.)


    The stylus of the probe is supported by a spring system, so that it does not break
    when suddenly deflected by a hard surface. Typically, deflection of up to 5 mm
    at the probe tip (ball) is permitted. Note that the stored positions are not likely
    to be very accurate because of tip overshoot. One way to handle the overshoot
    is to use a fixed and controlled speed (feedrate), and use a calibration chart
    to estimate the overshoot. Another way involves probing at a very slow speed.
    Since it would take too much time, the surface is probed twice. First it is touched
    with a high speed, then, when the skip signal is triggered, it is backed off by
    a small amount (say, 2 to 3 mm), and moved again toward the surface with a very
    slow speed. This technique gives good results in a very short time, and hence
    is preferred most of the time. The examples in this chapter use the same method.


    # ## 11.2 Skip Function on a CNC Machine


    Apart from the required hardware (a touch probe and a physical connection for
    receiving the skip signal by the control), the control also should be equipped
    with the skip-function feature, at software level. The associated G-code is G31.
    Hence, unless G31 (or a similar code on controls other than Fanuc) is available,
    probing would not be possible. G31 might be an optional feature on some control
    versions.


    G31 is very much similar to G01, except that when the control receives a skip
