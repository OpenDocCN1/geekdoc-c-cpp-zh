  md: 'This completes the discussion on how to define a new G-code on a lathe. It
    is also possible to redefine an existing G-code, to add certain desirable feature(s)
    to it. For example, commanding G01 with very low spindle speed is likely to be
    a programming mistake. (How can you machine unless the spindle is rotating at
    a reasonable speed?) Therefore, it may be desirable that commanding G01 with a
    very low spindle speed pauses the program execution, and waits for a confirmation
    from the operator (by pressing CYCLE START again), to continue the execution.
    Similarly, commanding both X and U (or Z and W) in the same block is meaningless,
    and should alarm out. The required modification in G01 can be done in the following
    manner:


    ```

