- pgno: 203
  md: '# ## 8.5 Turning a Sine Curve


    Consider the part shown in Fig. 8.6, which is to be machined from a cylindrical
    workpiece. The lateral surface of this part is defined by a sine curve. An additional
    complexity in this case is that the diameter of the part does not have monotonic
    increase or decrease along the length. The diameter first increases, then decreases
    and again increases, in the negative Z-direction. This makes the roughing operation
    by G90/G94 difficult to incorporate, which was easily done in the previous example
    of parabolic turning. Hence, the only way is to make use of G73 cycle. In fact,
    one simply has to define the geometry of the profile between P- and Q-block numbers
    of G73.


    As discussed earlier, this technique cannot be used with G71 and G72, because
    a loop cannot have movement G-codes for defining the profile for G71/G72. G73,
    however, does not have this limitation. The only problem, in fact a serious one,
    with G73 is that it is very inefficient for this type of job, where most of the
    feed motion would be in air, wasting a lot of time. However, in the absence of
    a suitable method, one has to use G73 that will at least produce the correct part.
    Ideally, G73 should be used where the workpiece already has a preformed shape,
    requiring nearly equal amount of material removal over its entire length, to get
    the exact shape. In other words, it is mainly suitable for machining of cast or
    forged parts, for which no other machining cycle would be as efficient. Every
    canned cycle has been designed with some specific purpose.


    We are using the terms ‘cycle’ and canned cycle interchangeably. Broadly speaking,
    if a G-code brings back the tool to its initial position after machining, it is
    called a cycle. If a cycle also involves some calculations, it is usually referred
    to as a canned cycle. Thus, G90 is a cycle whereas G71 is a canned cycle. For
    manuals, however, refer


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_203_0.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: "to all cycles as canned cycles. For this reason we are not differentiating\
    \ between the two terms in this text.\n\nComing back to the original problem,\
    \ an algorithm for turning a sine curve is given below:\n\n+   1. Place the tool\
    \ at the start point of G73.\n+   2. Command G73 and place the tool at the start\
    \ point of the sine curve, that is, at X = D and Z = 0.\n+   3. Use the specified\
    \ axial-step distance ΔZ, and assign Z = −ΔZ.\n+   4. If |Z| is greater than W,\
    \ which is |Zₘₐₓ|, go to step 9.\n+   5. Calculate X, using the equation of the\
    \ sine curve:\n+   \n+      `X = D + A sin(360|Z| / W)`\n+   \n+   6. Move to\
    \ the calculated coordinates by G01.\n+   7. Change the Z-coordinate (Z = Z −\
    \ ΔZ).\n+   8. Go to step 4.\n+   9. End of profile definition of G73.\n+   10.\
    \ Finish by G70 with half the specified feedrate, and twice the current rpm, for\
    \ a better finish.\n+   11. Return to the calling program.\n\nProgram number 8019,\
    \ which uses the local variables given in Table 8.4, is based on this algorithm.\n\
    \nAxial relief has to be kept zero in the case being considered, as the geometry\
    \ of the part requires that there be no axial shift in the subsequent cutting\
    \ passes of G73 because axial shift would result in interference between the toolpath\
    \ and the part geometry. In fact, for the same reason, even the Z-finishing allowance\
    \ for the G73 cycle has to\n\n| Parameters of the Sine Curve | Selected Letter\
    \ Addresses | Associated Variables |\n|---|---|---|\n| Average diameter | D |\
    \ #7 |\n| Wavelength of sine curve | W | #23 |\n| Amplitude of sine curve | A\
    \ | #1 |\n| Step distance in Z | Q | #17 |\n| Roughing depth of cut | R | #18\
    \ |\n| Feedrate | F | #9 |\n\n**Table 8.4**  Parameters of Sine Curve Turning\
    \ and the Selected Letter Addresses"
  merge: -1
  img_proc: true
- pgno: 205
  md: "be kept zero in this case). In this example, the cutting passes are required\
    \ to shift only in the radial direction, to gradually approach the defined profile.\n\
    \nThe radial relief in the present case can be chosen to be equal to the maximum\
    \ depth of the “valley” (i.e., equal to 2A). However, with this radial relief,\
    \ the first pass of G73 would only touch the workpiece at a location where the\
    \ part has minimum diameter, without removing any material. Since it is desirable\
    \ that material be removed even in the first cutting pass, radial relief should\
    \ be taken equal to (2A − <desired depth of cut>).\n\nThough the macro O8019 allows\
    \ specification of roughing depth of cut, G73 does not use this information directly.\
    \ Instead, one has to specify the number of cutting passes (R-word in the first\
    \ block of G73), the chosen radial/axial relief (U-word/W-word in the first block\
    \ of G73), such that the resulting depth of cut is as desired.\n\nRecall that\
    \ G73 offsets the first cutting pass, with respect to the defined profile (shifted\
    \ by finishing allowances, if specified, along the corresponding directions),\
    \ by the specified radial- and axial-relief amounts, in radial and axial directions,\
    \ respectively. The last cutting pass exactly follows the defined profile (plus\
    \ finishing allowances). Since the total number of passes is the value specified\
    \ in the R-word, there would be (<R-value> − 2) intermediate passes. All the passes\
    \ are automatically evenly spaced, and approach the last pass (i.e., the defined\
    \ profile plus finishing allowances) gradually. Therefore, the spacing between\
    \ two consecutive passes determines the depth of cut in a pass.\n\nThe required\
    \ number of passes (R-value), to ensure that the maximum depth of cut in each\
    \ pass is equal to or smaller than the specified depth of cut, would be equal\
    \ to\n\n\\[\n\\frac{\\text{radial relief}}{\\text{specified depth of cut}} + 1\n\
    \\]\n\nSince, in general, this expression would evaluate to a real number, the\
    \ next (higher) whole number should be specified as the R-value. Note that the\
    \ actual depth of cut in the example being considered would not remain constant.\
    \ It would vary between zero (where no cutting is involved) and the specified\
    \ depth of cut (where the part has minimum diameter).\n\n```\n```gcode\nO8019\
    \ (TURNING A SINE CURVE);\n#105 = #5041;              (Stores the initial X-position\
    \ of the tool)\n#106 = #5042;              (Stores the initial Z-position of the\
    \ tool)\nG00 X[#7 + 2 * #1 + 4] Z2; (Tool placed at the start point of G73\n \
    \                           cycle, leaving a clearance of 2 mm in\n          \
    \                  radial as well as axial direction, with\n                 \
    \           respect to the workpiece. Step 1\n                            complete)\n\
    ```\n```"
  merge: -1
  img_proc: true
