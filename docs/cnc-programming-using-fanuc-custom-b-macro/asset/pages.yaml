- pgno: 90
  md: 'number 27 is loaded), information about the loaded pallet becomes available
    inside the program that may take appropriate machining decisions, suitable for
    the workpiece on that specific pallet.


    The method explained above is theoretically correct, but not practical, because
    of a possible interference caused by the cables (that run from each pallet to
    the terminal strip) in a moving system. A practical method is described below.


    First determine the maximum number of different pallets there will be. Two pallets
    can be encoded with just one switch (ON or OFF). Four pallets with two switches
    (OFF/OFF, ON/OFF, OFF/ON, and ON/ON), eight pallets with three switches, sixteen
    pallets with four switches, and so on. There is no need to eight switches unless
    there are 256 pallets. In addition to the “binary number” switch array, an additional
    switch would be needed to confirm whether the pallet is loaded and locked. Now,
    what remains is how to actuate these switches.


    All the switches (push-to-ON type) are mounted on the stationary part of the machine,
    underneath where the pallets are clamped down. The pallets simply have protruded
    (meaning 1) or recessed (meaning 0) little buttons (the number of buttons being
    equal to the number of switches) on the bottom, that line up with the switches
    mounted on the machine. When a pallet is locked down, a certain combination of
    switches gets actuated by the buttons on the pallet, indicating its number. The
    additional switch, to sense whether or not a pallet is loaded, is actuated by
    all the pallets in the same manner. And there is no need to have a physical series
    connection between this switch and the switches used for pallet coding purpose
    (in fact, for such a connection, several independent switches would be needed—one
    for each coding switch). Instead, it may appear as an N/O relay, in series, in
    all the ladder rungs corresponding to other switches. The array of switches and
    the additional switch are permanently wired to the I/O module with a cable. So,
    just a single cable is needed, which always remains stationary, fixed to the stationary
    parts of the machine.


    A more sophisticated pallet system might use bar-coding or a radio frequency (RF)
    tag to pass more information to the machine than just a pallet number.


    Knowledge of the ladder language is a prerequisite for such applications. Though
    ladder language is not covered in this text, a brief description of wiring methods
    is given in Chap. 12.


