- pgno: 104
  md: 'Note that, on a 7.2-in LCD screen, it is not possible to continuously type
    more than 34 characters in one block, using the MDI keys. In a complex mathematical
    calculation, more than 34 characters in a block do appear. For example, in the
    standard deviation program, there is a block (the one next to the N20 block) with
    40 characters. The only way to have such blocks in a program is to first type
    the program on a PC, and then download it to the CNC through the RS-232C port.
    This way, a block with practically any number of characters can be used in a program.
    If, however, the program is typed by using MDI keys only, a long block (with more
    than 34 characters) would need to be split into smaller blocks. For example,


    ```

    #104 = #104 + [#103 - #[#101]] * [#103 - #[#101]];

    ```


    can be split into smaller blocks in the following manner, which will have the
    same effect:


    ```

    #111 = #103 - #[#101];


    #111 = #111 * #111;

    #104 = #104 + #111;

    ```


    (A new variable #111 introduced for intermediate calculations)


    The next example finds the roots of a quadratic equation in the form


    $$ax^2 + bx + c = 0$$


    The formula for the two roots is


    $$x_1 = \frac{-b + \sqrt{b^2 - 4ac}}{2a} \qquad\text{and}\qquad x_2 = \frac{-b
    - \sqrt{b^2 - 4ac}}{2a}$$


    The flowchart of an algorithm for finding the two roots is shown in Fig. 5.4.
    In program number 8003, which is based on this algorithm, any values can be assigned
    to the variables corresponding to a, b, and c. Here, 1, 1, 1, and −2 have been
    taken, which give 1 and −2 as the solution for the two roots.


    ```

    O8003 (QUADRATIC EQUATION SOLUTION);

    (FORM @ A * X * X + B * X + C = 0);

    (#1 @ A);

    (#2 @ B);

    (#3 @ C);

    (ASSIGN DESIRED VALUES TO A,B,C);

    (#100 @ DISCRIMINANT);

    (#502 @ ROOT1);

    (#503 @ ROOT2);

    ;

    #1 = 1;                         (a, i.e. coefficient of x²)

    ```'
