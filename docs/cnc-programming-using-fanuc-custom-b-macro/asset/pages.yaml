    \                      statement is described in detail in\n                 \
    \                              Sec. 5.3)\n\n#502 = [−#2 + SQRT[#100]] / [2 * #1];\
    \         (First root calculated and stored\n                                \
    \               in the permanent common variable #502)\n```\n```"
