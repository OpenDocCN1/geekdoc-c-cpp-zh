    Though there is nothing wrong with this method, the G65 block needs to be inserted
    repeatedly. In case any change in the G65 block is desired, the change would have
    to be incorporated in all the G65 blocks. This not only involves extra typing
    effort, the program size also increases. The modal call, G66, removes this difficulty.
    A G66 macro call remains effective until canceled by G67. After a G66 block, whenever
    the tool is moved in a subsequent block, the macro is automatically called, after
    completing the motion, until G67 is programmed, which cancels the G66 mode. The
    program structure with G66 would take the following form (this is similar but
    not exactly equivalent to the G65-form given above, due to reasons explained below):


    ```

    ...

    ...

    G66 P_ L_ <argument specification>;

    <Move the tool to location 1>

    <Move the tool to location 2>

    <Move the tool to location 3>

    ...

    ...

    <Move the tool to location n>

    G67;

    ...

    ...

    ```


    The syntax of G66 is exactly same as that of G65. All the rules applicable to
    G65 apply also to G66. A major difference is that G66 only stores the information
    provided in its block as modal data (i.e., data for future use, until changed),
    without calling the macro. The macro is called only when the tool is moved in
    a subsequent block, after the completion of the specified motion. Moreover, the
    values specified in'
