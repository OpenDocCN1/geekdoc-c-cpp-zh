  md: "![](img/1341ce50369ce8fcfb8dc3539d51c52f_87_0.png)\n\nFigure 4.3. Venn diagram\
    \ representation for Boolean AND, OR, and XOR.\n\nThe Venn diagram representation\
    \ (shown in Fig. 4.3) also is similar to that for bitwise functions. In this figure,\
    \ the circular area corresponding to a condition represents a Boolean value of\
    \ TRUE, and the area lying outside the circle represents a Boolean value of FALSE.\
    \ The shaded area represents the result (Boolean value TRUE) of the specified\
    \ logical operation.\n\nIt is important to note that a Boolean value TRUE is not\
    \ equivalent to the arithmetic value 1, and similarly, FALSE is not equivalent\
    \ to 0. So, a statement such as\n\n```\n```text\n#1 = #2 EQ #3; or\n#1 = [#2 EQ\
    \ #3];\n```\n```\n\nis meaningless, and would give “FORMAT ERROR IN MACRO.” It\
    \ is not possible to assign a Boolean value (TRUE or FALSE) to a variable, which\
    \ can only be assigned an arithmetic value. Confusion prevails among some macro\
    \ programmers that if a Boolean value is assigned to some variable (as in the\
    \ given example) #1, 1 or 0 gets stored in the variable, corresponding to TRUE\
    \ and FALSE, respectively.\n\n# Bitwise versus Boolean Operations\n\nBy now, the\
    \ reader must have realized that whenever AND, OR, and XOR are treated upon arithmetic\
    \ values, these functions behave as bitwise functions, and the result is an arithmetic\
    \ value. On the other hand, if these functions are operated upon Boolean values,\
    \ these become Boolean functions, returning a Boolean value (TRUE or FALSE). And,\
    \ of course, arithmetic and Boolean values cannot be mixed up with AND, OR, and\
    \ XOR.\n\n+   1. `1 LT 2 AND 3`  \n+      (Presence of conditional operators,\
    \ such as EQ and LT, makes an expression a Boolean expression. A Boolean expression\
    \ such as this is evaluated from left to right, if there are no brackets. Hence,\
    \ this expression is equivalent to TRUE AND 3, which is meaningless, hence illegal.)\n\
    +   \n+   2. `[1 LT 2] AND 3`  \n+      (Same as above, hence illegal.)"
