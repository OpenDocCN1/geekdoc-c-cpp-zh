- pgno: 266
  md: '# CHAPTER 13


    # Programmable

    # Data Input


    # 13.1  Introduction


    This feature of a CNC machine is not really related to macro programming. It has
    been included in this text because it is an advanced programming feature which
    many programmers are not aware of, even though it is very useful and its use is
    pretty straightforward.


    As the name suggests, *programmable data input*, which is commanded by G10, is
    used to write certain data into the control such as offset values and parameters.
    G10 is an optional feature on some control versions, which would need to be activated
    if its use is desired. This feature does not allow reading the current values
    of such data; one can only overwrite these.


    The main applications of G10 are data input for the following:


    +   - Offset distances for workpiece coordinate systems

    +   - Offset distances for additional workpiece coordinate systems on a milling
    machine

    +   - Compensation values on a milling machine (length and diameter)

    +   - Compensation values on a lathe (radial/axial values, nose radius, and tip
    number)

    +   - Parameter values


    G10 can also be used to feed tool-management data such as tool life and offset
    number. This is, however, not discussed in this chapter, since it is not a very
    common application.


    If the macro-programming feature is available on the machine, G10 is not needed
    in most cases. This is because system variables for all the offset distances and
    compensation values are available as read/write variables (refer to Sec. 3.5).
    In fact, system variables offer more flexibility, since the current values stored
    in them can also be read'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'which is not possible with G10. System variables are available even for some
    of the parameters (though very few of them are covered). However, for the remaining
    parameters and tool-life data, G10 has to be used, if their values are to be altered
    through a program.


    G10 can be used in both absolute as well as incremental modes, for specifying
    offset distances and compensation values. In absolute mode, the specified values
    simply overwrite the existing values; in incremental mode, the specified values
    are added (with the sign) to the existing values.


    The effect of G10 is permanent, that is, it remains valid for all the subsequent
    machining sessions, until the values are changed again by G10 or otherwise.


    # ## 13.2  Data Input for WCS Offset Distances


    Offset distances for external and G54 through G59 workpiece coordinate systems
    can be specified for each axis, in absolute or incremental mode. The syntax is
    the same for both lathe and milling machines:


    ```

    G10 L2 P_ X_ Y_ Z_;

    ```


    where


    +   - L2 selects this category of data input,

    +   - P0 refers to external WCS,

    +   - P1 refers to G54 WCS,

    +   - P2 refers to G55 WCS,

    +   - P3 refers to G56 WCS,

    +   - P4 refers to G57 WCS,

    +   - P5 refers to G58 WCS,

    +   - P6 refers to G59 WCS,

    +   - X, Y, and Z contain the desired values for the respective axes.


    On a milling machine, G90/G91 would need to be commanded before G10, for selecting
    absolute/incremental modes. On a lathe, with G-code system, X, Z are used for
    absolute values, and U/W for incremental values (the Y-axis is generally not available
    on a lathe).


    Incremental mode is very useful for correcting the offset distances by the observed
    error. For example, on a milling machine, if it is desired to shift the G54 WCS
    by 0.1 mm in the negative Z-direction (so that the same tool now machines at a
    level of 0.1 mm lower than the previous level, without modifying the program),
    one may command (in MDI mode, if the adjustment is to be done only once)


    ```

    G91 G10 L2 P1 Z-0.1;

    ```


    Of course, this can also be done through the associated system variable (refer
    to Table 3.12):


    ```

    #5223 = #5223 - 0.1;

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Both methods have the same effect. Selection between the two is a matter of
    individual choice. However, if the macro option is not enabled on the machine,
    G10 has to be used. In fact, G10 also is an optional feature, but now it is usually
    available with the standard control package.


    # ### 13.3 Data Input for Additional WCS Offset Distances


    Besides the six standard WCS, selectable with G54 through G59, 48 additional WCS
    are optionally available on milling machines (in fact, this option is available
    for up to 300 additional WCS also). These are invoked in a program by


    ```

    `G54.1 P<n>;`

    ```


    or simply by


    ```

    `G54 P<n>;`

    ```


    where n = 1 to 48.


    These are referred to as first additional WCS, second additional WCS, and so on,
    corresponding to n = 1, 2, ... A P-word must be specified with G54.1/G54. If it
    is not specified, P1 (implying first additional WCS) is automatically assumed
    by the control.


    Offset distances for these can be specified in a manner similar to that used in
    Sec. 13.2:


    ```

    `G10 L20 P_ X_ Y_ Z_;`

    ```


    where


    +   - L20 selects this category of data input,

    +   - P1 refers to first additional WCS,

    +   - P2 refers to second additional WCS,

    +   - ...

    +   - ...

    +   - P48 refers to 48th additional WCS,

    +   - X, Y, and Z contain the desired values for the respective axes.


    Both absolute and incremental modes can be used. As an example, the following
    command would shift the first additional WCS by 0.1 mm in the positive Z-direction:


    ```

    `G91 G10 L20 P1 Z0.1;`

    ```


    This, of course, can also be done through system variables (refer to Table 3.12):


    ```

    `#7003 = #7003 + 0.1;`

    ```'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 13.4  Data Input for Compensation Values

    on a Milling Machine


    The description given here refers to C-type compensation memory (also referred
    to as C-type offset memory), used in (i) series controls. Compensation values
    for length (H-code) and radius (D-code) of a milling cutter can be specified as
    described in Table 13.1, where the P-word defines the offset number (typically
    1 through 400) and the R-word contains the corresponding compensation value. To
    provide compatibility with programs written for older control models, the system
    allows L1 to be specified instead of L1. The permissible input range for compensation
    values, in IS-B (Increment System B), is given in Table 13.2. The valid range
    is much larger than what might actually be needed.


    Some examples are given below. Note that the given descriptions are valid only
    when these commands are executed sequentially:


    +   1. `G90 G10 L12 P10 R5;`  — Enters 5 mm into offset number 10, as the geometry
    compensation value for D-code, making the tool radius equal to 5 mm, assuming
    that the wear value for the radius is zero. Note that the D-code refers to the
    radius, not to the diameter.

    +   2. `G91 G10 L12 P10 R5;`  — Enters 5 mm incrementally into offset number 10
    as the geometry compensation value for the D-code, making the tool radius equal
    to 10 mm, which was 5 mm earlier.

    +   3. `G90 G10 L13 P10 R−0.5;`  — Enters −0.5 mm into offset number 10 as the
    wear compensation value for the D-code, making the tool radius equal to 9.5 mm.


    | Compensation Value | Format |

    |---|---|

    | Geometry compensation value for H-code | `G10 L10 P_R_;` |

    | Wear compensation value for H-code | `G10 L11 P_R_;` |

    | Geometry compensation value for D-code | `G10 L12 P_R_;` |

    | Wear compensation value for D-code | `G10 L13 P_R_;` |


    **TABLE 13.1**  Programmable Data-Entry Format for H- and D-Code Values


    | Geometry Compensation Value |  | Wear Compensation Value |  |

    |---|---|---|---|

    | Metric input | Inch input | Metric input | Inch input |

    | ± 999.999 mm | ± 99.9999 inch | ± 99.999 mm | ± 9.9999 inch |


    **TABLE 13.2**  The Valid Input Range for Compensation Values in IS-B'
  merge: -1
  img_proc: true
