- pgno: 222
  md: '# # CHAPTER 10

    ## Custom Canned Cycles


    # 10.1 Introduction


    It has already been discussed in Sec. 7.3 (subsection Call with User-Defined G-Code)
    how a new G-code can be defined or an existing one be redefined. The basic aim
    of defining a new G-code, instead of using a G65/G66 macro call, is that one need
    not know anything about macro programming to be able to call a macro. The defined
    G-code would call a macro without using G65/G66. It can be used the way a predefined
    canned cycle such as G71 on a lathe is used, with the difference that the user-defined
    G-code would always be a single-block code. In fact, all built-in canned cycles
    internally call some pre-defined macros only, without we realizing this. One only
    needs to know the significance of different letter addresses in such codes. The
    new G-code also can be used in the same manner. Thus, in a way, it enhances the
    standard control features, by making available some extra G-codes for complex
    machining applications. As many as 10 new G-codes can be defined (including redefined
    G-codes).


    There might be situations where no standard G-code would be quite suitable. A
    deep-hole drilling, requiring peck drilling with progressively reduced peck lengths,
    is one such example on a milling machine. Similarly, on a lathe, G74 is available
    for peck drilling, but the tool does not retract to outside the hole after a peck.
    This makes deep-hole drilling difficult. Moreover, some of the G-codes, such as
    helical interpolation, are available as options, which need to be additionally
    purchased. In all such cases, it may be possible to define/redefine G-code to
    suit particular application. Two examples, one for a lathe and one for a milling
    machine, are discussed next.


    # 10.2 Deep-Hole Peck Drilling on a Lathe


    The pecking action of the standard G74 cycle on a lathe is shown in Fig. 10.1.
    G74 is designed for drilling deep holes, but it does not work'
