  md: 'whenever required. Since G54 is the default coordinate system, whenever the
    machine is switched on, or the control is reset (by pressing RESET key, or by
    executing M02 or M30), G54 becomes active.


    # Zero Shift by Manipulating Offset Distances


    By now, it should be clear that the control places the origins of different WCSs
    at the user-specified distances from the origin of the MCS. This distance is the
    vector sum of the external offset vector and the corresponding work offset vector.
    So, for example, if the X-external offset is 10, and the X-offset for G54 is 200,
    then the control will place the origin of the G54 coordinate system at a distance
    of 210, in the positive X-direction, from the origin of the MCS. On the other
    hand, if the desired distance of G54 from the MCS is, say, 250, and the external
    offset is not to be changed, then the X-offset of G54 will have to be changed
    to 240. Therefore, as an example of zero shift, if the current X-position of the
    tool is to be made the origin of G54 (which may or may not be the currently active
    coordinate system), the sum of the X-external offset and the X-offset of G54 will
    have to be made equal to the X-distance of the current position of the tool from
    the MCS (which will be equal to the X-coordinate of the current tool position
    in MCS). Mathematically,


    X-external offset + X-offset of G54 = X-coordinate of the

    current tool position, in MCS


    Hence, if the external offset value is not to be changed, the X-offset of G54
    will have to be made equal to the X-coordinate in MCS minus the X-external offset,
    that is,


    X-offset of G54 = X-coordinate of the current tool position,

    in MCS − X-external offset


    Similarly, for zero shift to the current Y-position of the tool,


    Y-offset of G54 = Y-coordinate of the current tool position,

    in MCS − Y-external offset


    This is the principle we are going to make use of for zero shift, that is, for
    shifting the origin of the desired (active or otherwise) WCS to the current tool
    position.


