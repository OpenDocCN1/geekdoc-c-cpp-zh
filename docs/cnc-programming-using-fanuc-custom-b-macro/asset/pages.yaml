- pgno: 60
  md: 'shows the error message. The alarm condition may arise due to a number of reasons,
    including hardware problems with the machine. Further operation on the machine
    is possible only after rectifying the problem, and then pressing the RESET key.
    A syntax error in the program, out of range values, illegal data entry, etc. are
    software-related error conditions. CNC automatically issues an alarm in such cases.


    There are, however, situations when the control will not sense the error, even
    though the program execution must be terminated. For example, a probing system
    installed on the machine may detect tool breakage, necessitating immediate termination
    of program execution, though the control will not recognize this problem. To tackle
    such cases, provision also has been made to issue user-generated alarms, which
    are called macro alarms.


    When a value from 0 to 200 is assigned to system variable #3000, the machine stops
    with an alarm message “MACRO ALARM”. The displayed alarm number is 3000 plus the
    number assigned to it. Thus #3000 = 1 will determine the execution operation,
    and display “3001 MACRO ALARM” when the MESSAGE key is pressed.


    It is also possible to display a user-specified message up to 26 characters as
    alarm message by typing it within parentheses, after the assigned value for variable
    #3000.


    Example:


    ```

    #3000 = 1 (TOOL BROKEN);

    ```


    that would display “3001 TOOL BROKEN” on the message screen.


    # Time Information


    The system variables for time-related information are given in Table 3.6. Variables
    #3001 and #3002 are read / write variables, whereas #3011 and #3012 are read-only
    variables. So, it is not possible to change the current date or time through these
    variables.


    Current date/time can only be set/altered on the time setting screen, which is
    called timer/part count screen. (Select MDI mode → Press OFS/SET key → Press SETTING
    soft key → Press PAGE down key twice → Using up/down/left/right arrow keys, bring
    the cursor to time or date display, type the new value and press INPUT key.) This
    screen also displays some time-related information such as power ON time and cutting
    time, in hour-minute-second format. Part count information (the number of parts
    required and the number of parts produced) is also displayed on this screen. This
    is discussed in the section “Number of Machined Parts.”


    # Automatic Operation Control


    The single-block switch on the MOP can be used to execute a program block by block,
    that is, one block at a time. For executing the next block, the CYCLE START button
    must be pressed again.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '| Variable Number | Function |

    |---|---|

    | #3001 | This variable functions as a timer, with a 1-ms increment. It counts
    the total “on-time” of the machine in the **current session**. When the power
    is turned off, the value of this variable is reset to 0. When 2147483648 ms (which
    is nearly equal to 25 days) is reached, the value of this variable resets to 0,
    and time counting starts again. |

    | #3002 | This variable functions as a timer, with a 1-hour increment. It counts
    the total “run-time” of the machine (i.e., the duration of on-time of the CYCLE
    START lamp) in **all the sessions**. When the power is turned off, the value of
    this variable is preserved. When 9544.371767 hours (which is nearly equal to 13
    months) is reached, the value of this variable resets to 0, and time counting
    starts again. |

    | #3011 | This variable stores the current date (year-month-day) in decimal format.
    For example, 4 February 2009 is represented as 20090204. |

    | #3012 | This variable stores the current time (hour-minute-second) in decimal
    format. For example, 21 minutes and 30 seconds past 8 pm is represented as 202130.
    |


    **Table 3.6** System Variables for Time Information


    However, it is possible to disable this switch through the system variable #3003.


    Another feature, which is controlled by variable #3003 concerns completion of
    auxiliary functions (M-, S- and T-code), specified in a block also having a G-code.
    The G-codes allow specification of auxiliary codes in the same block. Whether
    the execution of the G-code starts immediately or waits for the completion of
    the auxiliary command is decided by this variable. For example, if G01 X100 S500;
    is commanded, the linear interpolation may start immediately, without waiting
    for the spindle to attain 500 rpm, or it may wait till the specified rpm is reached.
    Note that the T-code possibly cannot be used for changing the tool during machining
    because of a possible interference between the tool and the workpiece or the machine
    body. The only use of the T-code, in such a case, would be for changing the tool
    offset number (e.g., T0101, T0111, T0112, etc., with tool number 1 being in the
    cutting position, on a lathe).


    Even if the auxiliary codes are specified in a separate block, the execution of
    the next block may or may not wait for the completion of the auxiliary command,
    depending on the setting of variable #3003.'
