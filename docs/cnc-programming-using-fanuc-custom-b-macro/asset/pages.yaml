    Such a feature of macro variables can also be used for manipulating certain system
    variables which follow a definite pattern. For example, there is a jump of 20
    in the variable numbers for various work offset values for a particular axis (see
    each row of Table 5.2(a), which is a part of Table 3.12). Similarly, corresponding
