    # Interface Signals


    This is perhaps the toughest concept in macro programming, because it also requires
    a knowledge of PLC programming. It is only for advanced users. So, the readers
    may skip it until they have learned the basic features of macro programming.


    Interface signals are used for communicating with (i.e., receiving input and sending
    output), as binary signals, from/to external devices, connected to the CNC machine.
    This issue is discussed in more detail in Chap. 12. Here, only a broad overview
    is given, without going into the finer details, so, certain things may not be
    very clear until the reader refers to the chapter exclusively devoted to this
    topic. The main objective here is to explain what interface signals are, not how
    they are used, though some idea of that is also given.


    A discussion on interface signals and their use requires an understanding of the
    hardware architecture of the control (refer also to Communication with external
    devices in Sec. 1.2 where some information is given). The CNC (control) is mainly
    concerned with toolpath control. The overall control of the machine is through
    the logic incorporated in a PLC. For example, if the door is open, machining should
    not start. If, for some reason, machining is required to be done with the door
    open, the PLC logic will have to be altered, through a change in its ladder diagram.
    (Ladder diagram or ladder language is one of the methods of programming a PLC.
    It is assumed that the reader possesses its basic knowledge. If not, one may refer
    to some book on PLC programming, such as the one by John R. Hackworth, published
    by Pearson Education.)


    Though a PLC is an integral part of the control hardware supplied by the control
    manufacturers, it is programmed by the machine tool builders to suit particular
    machine tools. Fanuc calls its PLC programmable machine control (PMC). Essentially,
    both PLC and PMC refer to the same thing.


    When a CNC machine is connected to external devices, two-way communication between
    the CNC, the PMC, and the external devices is needed. The CNC, however, does not
    communicate with the external devices directly. The communication between the
    two is through the PMC, as shown in Fig. 3.4.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_53_0.png)


    FIGURE 3.4 Communication between CNC, PMC, and external devices.


    The PMC accepts inputs from the CNC as well as from external devices (including
    the machine tool). These inputs are called F-signals and X-signals, respectively.
    Similarly, it sends outputs to the CNC (G-signals) as well as to the external
    devices (Y-signals). The X- and Y-signals are also called DI (*data in*) and DO
    (*data out*) signals, respectively.


    Since F- and G-signals are *internal* to the control, the signal addresses and
    the corresponding meanings are decided by Fanuc. On the other hand, X- and Y-signals
    are *external* signals, so the signal addresses and their meanings are decided
    by the MTB. The MTB does not need to use all the available X- and Y-addresses.
    The left-over addresses can be used by the end-user, as interface signals to/from
    external devices. Some X-addresses (such as X4.0 to X4.7, and X8.4), however,
    are standard, and always used with the same meaning.


    All the signals are eight-bit signals, each bit carrying a different meaning from
    the other seven bits. For example, the PMC sends the “cycle start” signal to the
    CNC by G7.2 (which means bit #2 of G7 or G007; usually, the F- and G-signal addresses
    are three-digit numbers, and X- and Y-addresses are two-digit numbers, where the
    leading zeroes can be omitted). On the other hand, G7.1 is the “start lock” signal
    (which disables the CYCLE START button on the MOP), and G7.0 is not defined. Similarly,
    X0.0 (bit #0 of X0) and X0.1 (bit #1 of X0) are two independent input signals.
    Sometimes, a combination of certain bits is used for sending appropriate signals.
    For example, G43.0, G43.1, and G43.2 are for mode selection signal to the CNC.
    When these are all 0, the CNC considers it an instruction to work in the MDI mode.
    On the other hand, 001 is for HANDLE mode, 100 is for MEMORY or AUTO mode, and
    so on.


    The hardware connections for F- and G-signals are internal. The predefined meanings
    of F- and G-signals cannot be changed by the MTB or the end-user. The address
    numbers for these signals and the associated meanings can be found in the *Fanuc
    Maintenance Manual*.


    A number of X- and Y-signals are available for interacting with the outside world.
    Typically, X0 to X3 are for general-purpose signals, X4 to X11 are connected to
    the keys of the Fanuc-manufactured MOP, X12 is connected to the *manual pulse
    generator* (MPG), X13 and X14 are for additional MPGs, and X15 is for error signals.
    Many MTBs do not'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'use Fanuc’s MOP. They design their own MOP. In such cases, X0 to X11 become
    general-purpose signals, and any signal can be used for any purpose. The available
    Y-signals typically are Y0 to Y7. One will have to refer to the manual supplied
    by the MTB to find out which X- and Y-addresses have been used by them. The remaining
    addresses can be used by the users for the purpose of communication with external
    devices.


    The physical connection between the PMC and the external device is done by connecting
    wires to the terminal strip attached to the I/O (input/output) module (also called
    the I/O unit) of the PMC. Refer to the *Connection Manual (Hardware)* of Fanuc
    to know the pin assignment (i.e., which terminal corresponds to which X- or Y-address)
    on the terminal strip. The I/O module is generally placed in the wiring cabinet
    designed by the MTB. It is connected to the terminal strip by four 50-pin connectors
    (on the I/O module) and ribbon cables.


    In order to communicate an external signal to the CNC, the corresponding X-signal
    will need to be written to the appropriate G-signal (G54.0 to G54.7 and G55.0
    to G55.7 are reserved for this purpose). This can be done by adding a new rung
    to the PMC ladder:


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_54_0.png)


    This defines a system variable (corresponding to the specified G-address), which
    can be read in a program. For example, when X0.0 (assuming the MTB has not used
    this address) is written to G54.0 (which corresponds to variable #1000), it defines
    variable #1000 (which becomes 0 or 1 depending on whether X0.0 is low or high).
    Variable #1000 can be read in a program. Thus, the ON/OFF state of an external
    sensor becomes available inside the program.


    Similarly, the F-signals (those which are used for the purpose of external communication,
    F54.0 to F54.7 and F55.0 to F55.7) generated by the CNC become available to the
    outside world only when they are passed on as the Y-signals by adding new rungs
    to the PMC ladder (these signals can be tapped from the specified pins on the
    terminal strip and sent to external devices through wires):


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_54_1.png)


    For example, if F54.0 (which corresponds to variable #1100) is written to Y0.0
    (assuming the MTB has not used Y0.0), the assigned value (0 or 1) to variable
    #1100, inside the program, becomes available at the output terminal Y0.0, which
    can be used to switch an external device on or off. Thus, a program statement
    can drive an external device.


    The binary signals (corresponding to variables #1000, etc.) for such a communication
    are called interface signals. Typically, 16 input'
