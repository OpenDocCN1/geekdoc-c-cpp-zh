  md: "+   - If a macro call is needed without tool movement, specify zero distance\
    \ for some axis in incremental mode. For example, G91 G00 X0 (G00 U0 on a lathe)\
    \ would call the macro without any tool movement. Actually, an axis movement block\
    \ is necessary; the specified displacement can be **zero also!**\n+   - In the\
    \ *word address format*, which today's CNC machines use, the order of different\
    \ words associated with a command is not important. For example, G66 P15 A1 and\
    \ G66 A1 P15 are both equivalent (though P15 G66 A1 is illegal, since all arguments\
    \ of a G-code must come *after* the code). However, only the recommended order\
    \ should be used, so as to eliminate any possibility of confusion to other users.\n\
    \n# ## Call with User-Defined G-Code\n\nIt is possible to define up to 10 new\
    \ G-codes that can be used for calling a macro in the way G65 calls it, with the\
    \ difference that the program number is not required to be mentioned with the\
    \ defined G-code. Such G-codes become similar to the built-in standard G-codes,\
    \ especially like the codes for canned cycles (those canned cycles that are defined\
    \ in one block). For using these codes, one only needs to know the meanings of\
    \ the used letter addresses. For example, G100 D80 Q5 R90 F10 S1000 may be designed\
    \ to call a macro for drilling a hole with progressively reducing peck lengths,\
    \ with the following meanings for its letter addresses. (We have yet not discussed\
    \ the correspondence between various letter addresses and the local variables\
    \ of the called macro. The only thing we have used so far is letter A defines\
    \ variable #1 and letter B defines variable #2. So, do not worry about how the\
    \ called macro in this example uses the given data. It is discussed later.)\n\n\
    ```\n    G100:    New G-code\n    D80:     Depth of hole (80 mm)\n    Q5:    \
    \  First peck length (5 mm)\n    R90:     Reduction percentage for the next peck\
    \ length (90%)\n    F10:     Feedrate (10 mm/min)\n    S1000:   Spindle speed\
    \ (1000 rpm)\n```\n\nIf G100 is designed to call macro O9010, the given command\
    \ is equivalent to G65 P9010 D80 Q5 R90 F10 S1000.\n\nThe advantage of calling\
    \ a macro in this manner is that even a programmer with less programming skills\
    \ can make use of some (not all) predefined macros, **without** needing to know\
    \ anything about macro programming! A new G-code can be used just like a standard\
    \ G-code. One **need not** even know the macro program number it calls. In other\
    \ words, some *extra* G-codes become available on the machine. Of course, only\
    \ an experienced programmer can define such codes. The exact procedure is described\
    \ below."
