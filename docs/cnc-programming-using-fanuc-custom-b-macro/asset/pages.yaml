    # 10.3 Drilling with Reducing Peck Lengths on a Milling Machine


    G73 and G83 are the two peck-drilling cycles available on milling machines. G83
    is a high-speed peck-drilling cycle, using a very small retraction after each
    peck. It is used when the hole is not too deep. G83 retracts the tool to R-point
    after every peck. This clears the chips completely, making the cycle suitable
    for deep holes. If, however, the hole is too deep, coolant starvation becomes
    an issue after a few pecks. The only solution is to use pecks of gradually reducing
    lengths, by a desired factor. Such a peck-drilling cycle is also referred to as
    a regressive peck-drilling cycle. Unfortunately, Fanuc control does not provide
    a built-in regressive peck-drilling cycle. Therefore, in case it is really needed,
    one would need to write a macro for it. Better still, a new G-code (say, G183
    that indicates a modified G83) may be written for it. For this, 183 would need
    to be stored in, say, parameter 6052, while the corresponding program 09012 should
    generate the desired toolpath, as shown in Fig. 10.4.


    The algorithm for macro 09012 would generally be similar to the one used for macro
    09011, with the main difference that the peck length would need to be calculated
    before each peck:


    +   1. Store the initial Z-position.

    +   2. Rapid motion to the X-Y-position (the hole center).

    +   3. Rapid motion to R-point.

    +   4. Calculate <required depth> (drilling to be started from the R-point).

    +   5. If <required depth> is less than or equal to Q, go to step 20.

    +   6. Drill at the specified feedrate up to Q depth from the R-point.

    +   7. Store the current Z-position.

    +   8. Set <required depth> = <required depth> − Q.

    +   9. Retract at rapid rate to the R-point.

    +   10. If <required depth> is less than or equal to M or the new peck length
    (which is equal to the previous peck length multiplied by regression factor I),
    go to step 18.

    +   11. Calculate the new peck length. If it comes out to be smaller than M, set
    it equal to M.'
