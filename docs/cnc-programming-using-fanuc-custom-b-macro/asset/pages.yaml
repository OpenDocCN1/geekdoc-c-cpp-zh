- pgno: 26
  md: '# 1.4 Aim of the Present Text


    The macro programming feature is so powerful that its applicability is limited
    only by your imagination. It has given a whole new dimension to conventional part
    programming. Unfortunately, the resource material to learn macro programming is
    not readily available. Moreover, information is available either in handbook forms
    or as application examples. Handbooks are mainly useful for reference purpose
    only, to have more details about a certain feature, and the application examples
    assume basic knowledge of the language. The easiest method to learn would be to
    study the features of the language one by one, in order of increasing complexity,
    with a number of suitable examples. Such an approach enables one to understand
    the concepts simply by self-study. The present text is carefully designed with
    this approach only, and aims at explaining all the necessary tools and techniques
    for developing macro programs for common applications. The present text, however,
    assumes a basic knowledge of conventional part programming. Macro programming
    is only its extension. So, it is necessary to brush up the basic programming concepts
    before venturing into the fascinating world of macro programming.


    The subsequent chapters describe the features of macro programming in detail.
    Although the general discussion is not brand specific, the specific descriptions
    and programming examples follow Fanuc’s Custom Macro B language. The earlier version
    Custom Macro A is outdated and no longer used. Our discussion will generally revolve
    around Fanuc 0 series controls.


    Today, Fanuc enjoys over 50 percent market share in CNC control, worldwide. In
    India, its share is over 75 percent. This has made Fanuc control the de facto
    standard, which is the main reason for focusing on Custom Macro B in this text.
    In fact, many smaller companies have specially designed their controls so as to
    match the features of Fanuc control. Such controls are referred to as unaffiliated
    Fanuc controls, a number of which are available in the market today. Such controls,
    however, do not ensure 100 percent similarity with Fanuc control. They still have
    a market because their prices are much lower compared to original Fanuc control.
    The emulated Fanuc controls generally do not have macro programming capability.


    # 1.5 How to Use This Book


    This book is written in textbook style. It is designed to be read sequentially,
    from the beginning till the end. Proceed further without skipping any chapter
    or section (unless suggested otherwise), because this may cause difficulty in
    understanding certain concepts discussed subsequently. Macro programming is a
    typical high-level programming'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'language that has to be learnt step by step and thoroughly. The more slowly
    you move, the faster you will reach your destination, because a superficial knowledge
    of any programming language may land you in trouble anytime, and you may not even
    be able to figure out your mistakes.


    A simple reading, however, will not be sufficient, because it is not possible
    to remember everything unless it is practiced rigorously. So, as far as possible,
    the readers should verify all the programming statements on their machines. For
    example, if it is stated that #0.5 is equivalent to #1, it can be tested by executing
    a one-line program, #0.5 = 1; which should assign a value of 1 to variable #1.


    Simple statements can be verified in MDI mode also, without creating a new program.
    The default parameter setting for MDI mode, however, automatically erases the
    typed program after its execution is over (and it is not possible to save a program
    created in MDI mode). If some change in the previously typed program is desired,
    the whole program would need to be typed again. A change in parameter setting
    would solve this problem; this is explained in Chap. 2. With appropriate parameter
    settings, MDI program can be deleted or modified only intentionally, through the
    editing keys on the MDI panel.


    Finally, it is important to note that there is no universally accepted standard
    for macro programming. Although all the reputed control manufacturers offer similar
    features, there are differences in their programming methodology. This precludes
    the possibility of portability of macro programs among different controls. In
    fact, even among the different control versions of the same manufacturer, 100
    percent portability would generally not be possible, mainly because of differences
    in control parameters and system variables in different control versions. What
    is important is to understand the basic concepts of macro programming technique.
    The necessary fine-tuning to suit a particular control version can always be done.


    Macro programming techniques are not very common knowledge among CNC users, many
    of whom are not even aware that their machine possibly does have such a programming
    feature. Unfortunately, macro programming is hyped as an extremely complex and
    sophisticated way of part programming. This has caused an undue hindrance in the
    learning process. The fact is that macro programming is much simpler than a high-level
    programming language such as PASCAL. All that is needed is the willingness to
    learn and a methodical approach. The author believes that a workable knowledge
    can be acquired in just one week. Read on and find out for yourself!'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# # CHAPTER 2

    ## Variables and Expressions


    # ## 2.1 Macro Variables


    A macro variable is a mathematical quantity that can assume any value within its
    allowed range. Although macro programming on Fanuc and similar controls has several
    features of a high-level computer programming language, it is somewhat primitive
    at this stage when it comes to the way variables are defined. It does not allow
    the use of arbitrary combinations of alphanumeric characters for designating a
    variable, for which there is a single specific way. Variables are designated with
    the # symbol, followed by a number (called the variable number), in the permissible
    range (which depends on the control version). Some examples of variables are


    ```

    #1

    #10

    #100

    #1000

    #10000

    ```


    These numbers represent specific memory locations that may contain some positive
    or negative arithmetic values (if defined, i.e., if some value is assigned to
    them) or be empty (if not defined).


    # ## 2.2 Macro Expressions


    There are two types of macro expressions: *arithmetic expressions* and *conditional
    expressions*.


    An arithmetic expression is a mathematical formula involving variables and/or
    constants (such as 0.12, 1.2, 12, 120, etc.), with or without functions (such
    as SIN, ACOS, SQRT, LN, etc., which are described in Chap. 4). A nested expression
    and the argument of a function must be enclosed within square brackets. Small
    brackets (parentheses)'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'cannot be used because they are used for inserting comments in a program. An
    arithmetic expression evaluates to an arithmetic value.


    ```

    Examples:

    #1 = #2

    #3 = #4 + #4 * SIN[30 * [#5 / 10]]

    ```


    A conditional expression includes *conditional operators* (such as EQ, NE, and
    LT) between two variables/constants/arithmetic expressions. It must be enclosed
    in square brackets. It evaluates to either TRUE or FALSE (these are called Boolean
    values). A conditional expression is also referred to as a *Boolean expression*.


    ```

    Examples:

    [#1 EQ 0]

    [[#2 + 1] LT [SIN[30] * #3]]

    ```


    The available macro variables cannot be used to store the result of a conditional
    expression. Only arithmetic values can be stored in macro variables. The Boolean
    TRUE/FALSE is not equivalent to the arithmetic 1/0.


    ```

    Examples:

    #1 = 10;                         (Stores 10.000 in variable #1)

    #2 = [#1 LT 2];                   (Illegal, as TRUE or FALSE cannot be stored
    in a variable)

    ```


    The manual data input (MDI) panel usually has just one key for the left bracket
    and another one for the right bracket. While typing, whether the bracket will
    appear as a square bracket or a parenthesis, depends on your parameter setting.
    If the machine has Fanuc 0i or Mate control, set the first bit (from right), which
    is conventionally referred to as bit #0 (the eight bits are designated as #0 through
    #7, starting from the right), of the parameter number 3204 to 0 for a square bracket,
    and 1 for a parenthesis:


    |  | #7 | #6 | #5 | #4 | #3 | #2 | #1 | #0 |

    |---|---|---|---|---|---|---|---|---|

    | 3204 |  |  |  |  |  |  |  |  |


    The default setting for the remaining bits is 0, which is not shown, for the purpose
    of highlighting what requires to be edited (i.e., bit #0). Obviously, it would
    not be possible to use square brackets and insert comments at the same time with
    this parameter setting. If some comments are desired to be inserted in a macro
    program, first type/edit the program using square brackets, wherever required.
    Then change the parameter setting to get parentheses, for the purpose of inserting
    comments. After inserting comments, if again some corrections in the program involving
    square brackets are needed, another change in parameter 3204 would be required.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'There is, however, a way to use both types of brackets, with the same parameter
    setting. For this, set parameter 3204#2 to 1 (3204#0 should remain 0; status of
    the other six bits does not affect this feature):


    | | #7 | #6 | #5 | #4 | #3 | #2 | #1 | #0 |

    |---|---|---|---|---|---|---|---|---|

    | 3204 |  |  |  |  |  | 1 |  | 0 |


    Such a parameter setting displays an extended character set, as soft keys, in
    the EDIT mode, displaying “(”, “)” and “@”. With this setting, if square brackets
    are needed, use the bracket keys on the MDI panel, and if parentheses are needed,
    do the following (in EDIT mode):


    +   - Press PROG on MDI panel (press PROG again if the current program is not
    displayed).

    +   - Press the OPRT soft key.

    +   - Press the right extension key (▶) twice.

    +   - Press the C-EXT soft key.


    After this, soft keys for left parenthesis, right parenthesis, and @ (which can
    be used in the comments inserted in a program) will appear which can be used as
    and when required for editing in EDIT mode. However, a change in display screen
    will make these soft keys disappear. If they are needed again, the process to
    display them will have to be repeated.


    Note that the MDI panel and the LCD screen (color or monochrome) come as an integral
    unit as well as separate units. The stand-alone type MDI panel is larger and has
    more keys. So, there is a lesser need to use the SHIFT key for typing alphanumeric
    characters/arithmetic operators, which makes typing faster. The keypad also has
    separate keys for both types of brackets, obviating the need for displaying soft
    keys for them.


    Coming back to the discussion about macro expressions, an arithmetic expression
    evaluates to a positive or negative arithmetic value, following the usual priority
    rule: bracket (innermost first) → function evaluation → division and multiplication
    → addition and subtraction. Mixed mode arithmetic, that is, calculations involving
    both real and integer numbers, is permitted, which results in a real number. In
    fact, the control stores even an integer number as a real number, with zeros after
    the decimal point. So, for example, 10 is equivalent to 10.0, and these can be
    used interchangeably in all arithmetic calculations. Note that this statement
    is valid only for arithmetic calculations. For example, X10 may be interpreted
    as 10 mm or 10 μm (in millimeter mode), depending on whether parameter 3401#0
    is 1 or 0.


    The negative of the value stored in a variable can be used by putting a minus
    sign before the variable address, but two consecutive'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Arithmetic operators (+, -, *, % and /) are not allowed. In such cases, square
    brackets will have to be used:


    +   - `#1 + 10` — (A valid expression)

    +   - `10 + #1` — (An invalid expression)

    +   - `10 + [#1]` — (A valid expression)


    A variable can also be designated in terms of another variable or an arithmetic
    expression, which must be enclosed within square brackets:


    +   - `#{#1}` — (#1 should contain a number in the permissible range. If, for
    example, #1 contains 10, then `#{#1}` is equivalent to #10. #1 is illegal.)

    +   - `#{#1+10}` — (If #1 contains 10, then the referred variable is #20.)


    The designation number of a variable is an integer quantity. If a real value is
    specified (which is only a theoretical possibility, as this situation would never
    arise in any practical application), it is automatically rounded to the nearest
    integer (refer to Sec. 2.3 for the methods of assigning a value to a variable):


    +   - `#1 = 1.4999999;` — (Stores 1.4999999 in variable #1)

    +   - `#[#1] = 1.5000000;` — (Stores 1.5000000 in variable #1)

    +   - `#[#1] = 1;` — (Stores 0001.000 in variable #2. A variable stores and displays
    a value using eight digits, with three digits after the decimal, unless the value
    cannot be expressed in this format.)

    +   - `#0.4999999 = 1;` — (Illegal command because it tries to assign a value
    to variable #0. Variable #0 is a pre-defined, read-only type null variable, which
    cannot be redefined. Properties of null variables are described in detail in Sec.
    2.5.)

    +   - `#0.5000000 = 1;` — (Stores 0001.000 in variable #1.)


    # ### 2.3 Assigning a Value to a Variable


    A value can be assigned to a variable in the general format


    ```

    `#1 = <some value or arithmetic expression>;`

    ```


    where i is the variable number. On the left-hand side, in place of i, an expression
    may also be used. Some examples are


    +   - `#1 = 10;` — (Stores 0010.000 in variable #1)

    +   - `#1 = #1 + 1;` — (Redefines #1 by storing 0011.000 in it)

    +   - `#[#1 + 10] = [10 + 20] / 30 - #1;` — (Stores -00010.000 in variable #21)

    +   - `#[#1] = SQRT[-#21];` — (Stores 3.1622777, the rounded value up to eight
    digits, in variable #1. Rounding is automatically done by the control, in ...)'
