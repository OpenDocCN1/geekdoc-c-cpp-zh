    +   3. The X- and Z-coordinates of P are (−9) and (−2), respectively.

    +   4. The X- and Z-coordinates of Q are (54 and 5), respectively.

    +   5. The extended toolpath at the start of the profile is at the angle of the
    chamfer (45°). This makes a better-quality corner.

    +   6. The Z-coordinate of Q includes 3 mm extra length on the larger diameter,
