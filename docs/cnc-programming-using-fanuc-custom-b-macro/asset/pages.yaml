- pgno: 182
  md: '# CHAPTER 8


    # Complex Motion Generation


    # 8.1 Introduction


    So far, only the basic tools of macro programming have been discussed. With the
    help of these, it is possible to generate complex toolpaths, apart from several
    other applications that are discussed in subsequent chapters. Some examples of
    complex motion generation are given in this chapter. Generally speaking, it is
    easier to do it on a milling machine (in 2D machining), than on a lathe, because
    the generated toolpath would have to be used in conjunction with a suitable canned
    cycle (G71/G72/G73) on a lathe, to avoid large depth of cut. Therefore, milling
    examples are discussed first.


    # 8.2 Arc with Uniformly Varying Radius


    Consider the slot shown in Fig. 8.1, which is in the form of an arc (AB), with
    uniformly increasing radius. The start and the end radii are 35 mm (CA) and 40
    mm (CB), respectively. The angle of arc is 60°, the start angle being 15°. The
    workpiece zero point (origin or datum of the chosen WCS, among G54, G55, . . .,
    G59) is at O. The center of the arc (C) is located at coordinates (30, 20). The
    depth of the slot is assumed to be 3 mm.


    Since the radius of the arc is continuously varying, circular interpolation cannot
    be used in this case. The only way is to locate closely spaced points on the arc
    AB, and join these points by linear interpolation. The spacing between these points
    has to be carefully selected. A small value would improve the smoothness of the
    arc. However, too small a value would increase the calculations, which may result
    in sluggish tool movement. (Another and main cause of the sluggish motion is that
    acceleration/deceleration is involved in every toolpath segment. Therefore, the
    effective feedrate might be much smaller than the specified feedrate.)'
