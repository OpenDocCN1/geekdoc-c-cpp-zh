- pgno: 81
  md: "Finally, it is very important to understand that if ROUND is used for some\
    \ axis distance in an NC statement, rounding is done up to the least input increment\
    \ of the machine. The least input increment in millimeter mode is typically 0.001\
    \ mm, as assumed in the following example:\n\n```\n```text\n#1 = 100.12345;\n\
    G00 X[ROUND[#1]];    (Places the tool at X=100.123)\n```\n```\n\nIn fact, the\
    \ ROUND function is redundant here. As already explained in Chap. 2, even without\
    \ the ROUND function, implicit rounding would be done up to the least input increment.\
    \ So, the second statement is equivalent:\n\n```\n```text\nG00 X#1;\n```\n```\n\
    \nAlso note the presence of the outer bracket in the ROUND function. If a function\
    \ or an expression is being used as the value in an NC word, it must be enclosed\
    \ in brackets as:\n\n```\n```text\nX ROUND[1.2];       (An illegal command)\n\
    X[ROUND[1.2]];      (Equivalent to X1.200)\n```\n```\n\nIt is not that the ROUND\
    \ function is completely useless in an NC statement (as can be concluded from\
    \ the given example). In fact, it can be very effectively used to eliminate the\
    \ round-off errors during program execution. Consider the following case, with\
    \ 0.001 as the least input increment, on a milling machine (assume that the current\
    \ tool position is X100, along the X-axis):\n\n```\n```text\n#1 = 100.2345;\n\
    #2 = 200.3456;\nG91 G00 X#1;         (Places the tool at X200.235)\nX#2;     \
    \            (Places the tool at X400.581, because 200.235 +\n               \
    \      200.346 = 400.581)\nX−[#1 + #2];         (Equivalent to X−[300.580] which\
    \ is rounded to\n                     X−300.580, so the tool is placed at X100.001,\
    \ which\n                     is not the initial position of the tool)\n```\n\
    ```\n\nThough the difference between the expected position (X100) and the actual\
    \ position (X100.001) is very small (0.001), which may not be of any practical\
    \ concern, it will cause a logical flaw in an application involving comparison\
    \ of tool positions. Moreover, since the error is accumulative, it is possible\
    \ that, after several such operations, the tool may actually deviate from the\
    \ correct position to an unacceptable extent. This problem can easily be obviated\
    \ by replacing the last statement by\n\n```\n```text\nX−[ROUND[#1] + ROUND[#2]];\n\
    ```\n```\n\nwhich is equivalent to X−[100.235 + 200.346], that is, X−300.581,\
    \ which would place the tool exactly at the expected position."
