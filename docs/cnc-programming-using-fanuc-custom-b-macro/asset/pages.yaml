    Though permanent common variables are very useful for applications such as the
    one just discussed, preset values may not always be desirable, as this may result
    in incorrect initialization of variables in some cases (e.g., #500 = #500 + #1,
    where the initial value of #500 is desired to be 0). Moreover, it can never be
    said with certainty if the displayed values are actually calculated by the program
    or are just the old values. So, for the sake of safe programming practice, all
    the permanent common variables, which are to be used in a program, are set to
    null in the very beginning of the program, unless their old values are actually
    needed.


    In some cases, it may even be desirable to clear all the permanent common variables.
    Program number 8001 does the same, setting all variables in the range #500 to
    #999 to null. The execution completes in about 10 seconds on 0i Mate TC (macro
    calculations are not very fast). The flowchart of an algorithm and its execution
    trace are shown in Fig. 5.2.


    ```

    ~~~

    O8001 (CLEARING ALL PERMANENT COMM VARS)

    ;

    #1 = 500; (Initial value of COUNTER)

    N10 #[#1] = #0; (The variable number, referenced by COUNTER, set to null)

    ~~~

    ```'
