    used on a milling machine, though it is very useful and often used on a lathe.


    Though any local and/or common variable can be used to store the results of intermediate
    calculations, it is better to use common variables only, because local variables
    are used for passing data to the macro. This will reduce the possibility of programming
    errors. Moreover, a subsequent modification in the macro, to include additional
    data to be passed on to the macro, would be easy, as any local variable (which
    has not been used previously to pass data) can be made use of for storing the
    additional data. Otherwise, the total number of available common variables is
    also much more than the number of local variables. Finally, if the result of a
    calculation needs to be stored permanently (i.e., to be retained even after system
    reset or a power cycle), it would need to be retained in a permanent common variable.
    This methodology will be used in all the programs that follow from now on.


    Before trying to write the macro, it is recommended to first write down the step-by-step
