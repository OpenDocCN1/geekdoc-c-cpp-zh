    \ information, without calling the macro. A second or any subsequent G66 block\
    \ remains independent of previous G66 blocks. In fact, the previous G66 automatically\
    \ gets canceled, and the new G66 takes effect. So, the updated values for the\
    \ local variables from the previous execution are not used. The next execution\
    \ of O0015 would again start with the specified data in the current G66 block)\n\
    \n`X100;`  \n(The tool further moves 100 mm along the X-axis. Thereafter, O0015\
    \ is again called as a macro, with #1 initially set to 1, its specified value\
    \ in the currently active G66 block. Therefore, the current execution of the macro\
    \ assigns a value of 3 to both #1 and #501, which happens to be the same as that\
    \ obtained in the previous execution of the macro, because all the modal parameters\
    \ are same in both the G66 blocks)\n\n`G67;`  \n(The current G66 mode canceled.\
    \ The previous G66 mode was automatically canceled when a new G66 was commanded)\n\
    \n`M30;`  \n(Execution and control reset)\n\n# Additional comments:\n\n+   - Nesting\
    \ with G66 is permitted. A maximum nesting depth of four levels is allowed, including\
    \ both G65 and G66. Subprograms also can be nested to G66. Over all, a maximum\
    \ of four macros (called by G65 and/or G66) and four subprograms can be nested.\n\
    +   - The G66 block only stores modal data. It does not call a macro. Therefore,\
    \ no movement command should be included in the G66 block. If the movement command\
    \ (such as X100) appears before the G66 word, the tool moves without calling the\
    \ macro (though modal data are stored for future use). If it appears after the\
    \ G66 word, it is taken as data for a local variable (X100 would assign a value\
    \ of 100 to variable #24)! Moreover, an address such as G01 at the right of G66\
    \ is illegal, since the letters L, O, N, C, and P are not allowed to be used for\
    \ argument specification.\n+   - While G66 is active, M-codes or any other code\
    \ that does not cause tool movement are executed without calling the macro.\n\
    +   - As with G65, up to 9999 repetitions (specified with address L) in a G66\
    \ macro call are permitted.\n+   - The modal data are defined only in the G66\
    \ block. For example, in a subsequent block where G66 is active, X100 L3 would\
    \ not change the repetition count to 3."
