    \ increases, the program remains essentially the same; only the two variables\
    \ (#3 and #4) for the numbers of holes along the X- and Y-directions would need\
    \ to be redefined, as per requirement. While the use of a loop, especially a nested\
    \ loop, makes a simple program complex, it does make a complex problem pretty\
