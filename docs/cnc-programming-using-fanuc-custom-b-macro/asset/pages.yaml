    The readers should observe the programming styles adopted in O8020 and O8021.
    O8020 includes most of the required set-up related commands (such as tool change),
    requiring very few of these in the calling program. On the other hand, O8021 has
    none of these commands, which requires that these be inserted in the calling program.
    The first style is considered better, provided the macro is made flexible enough
    by using local variables for controlling its action. For example, a limitation
    of O8020 is that it will always use T0101 for roughing and T0303 for finishing.
    If some other tool/offset number is desired to be used, the macro would need to
    be modified, which is not considered good practice. Usually, macros are written
    by expert programmers and are edit-protected through parameters. Hence, local
    variables for roughing and finishing tool numbers should have been added in the
    argument list. On the other hand, even though several set-up commands are needed
    for calling O8021, this macro can be used in different cutting conditions, without
    any modification in it. Every approach has its own advantages and limitations.
    It is, basically, a matter of individual choice and specific requirements.'
