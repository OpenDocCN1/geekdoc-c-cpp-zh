    The given program may appear trivial (as one can shift the datum manually, using
    the visual offset setting procedure), but it can be very effectively used. For
    example, if the workpiece on a lathe is changed to a different one, having different
    dimensions, the datum setting for Z would need to be repeated. (X-datum would
    remain the same, because the X0 position does not depend on the diameter of the
    workpiece). If the machine operator is not fully aware of the offset setting procedure,
    he may simply be asked to first bring the tool manually (in JOG or HANDLE mode)
    to the desired Z0 position, and then run program number 8009, without disturbing
    the position of the tool. This would place the Z-datum of the current WCS at the
    chosen location. Naturally, this has to be done in the same workpiece coordinate
    system which the machining program uses. If it is, say, G56, one will have to
    first execute G56 in the MDI mode, before running program number 8009 in AUTO
    mode. And the RESET key must not be pressed in-between, otherwise, the default
    workpiece coordinate system, G54, will again become the active coordinate system!'
