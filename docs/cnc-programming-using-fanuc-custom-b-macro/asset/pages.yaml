    Note that the conical shape at the bottom of the hole is caused by the tip angle
    of the drill bit. Using trigonometric relations, it can be shown that, for a given
    tool diameter D and tip angle θ, the height h of the cone is given by


    $$h = \frac{D}{2} \times \tan\left(90 - \frac{\theta}{2}\right)$$


    For the usual tip angle of 119°, this equation gets approximately simplified to


    $$h = 0.3D$$


