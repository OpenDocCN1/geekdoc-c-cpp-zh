    \ statement after the currently executing NC statement, are read and immediately\
    \ processed. (This example pertains to a milling machine, assuming that the plane\
    \ of compensation is G17, i.e., the XY-plane.)\n\n```\n```text\n...\n\nN100 G01\
    \ X100 F100;    (While executing this block, buffering is done up to N109)\nN101\
    \ #100 = 1;          (#100 is set to 1 while N100 is being executed)\nN102 #101\
    \ = 2;          (#101 is set to 2 while N100 is being executed)\nN103 Y100;  \
    \            (The first NC statement, after N100 block)\nN104 #102 = 3;      \
    \    (#102 is set to 3 while N100 is being executed)\nN105 #103 = 4;         \
    \ (#103 is set to 4 while N100 is being executed)\nN106 Z10;               (The\
    \ second NC statement, after N100 block)\n                       (This statement\
    \ does not cause movement in\n                        the plane of compensation)\n\
    \nN107 #104 = 5;          (#104 is set to 5 while N100 is being executed)\nN108\
    \ #105 = 6;          (#105 is set to 6 while N100 is being executed)\nN109 X100;\
    \              (The third NC statement, after N100 block)\nN110 #106 = 7;    \
