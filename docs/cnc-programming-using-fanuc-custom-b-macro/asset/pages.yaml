    \ for the sake of discussion, this case is equivalent to the previous case, with\
    \ regard to buffering of macro statements (for example, if N103 Y100 is replaced\
    \ by, say, N103 M08, buffering would still be done up to N109 only).\n\n# Effect\
    \ of Buffering of Macro Statements on Program Execution\n\nThe purpose of buffering\
    \ is to speed up the program execution by performing the calculations in advance.\
    \ Normally, it only improves the performance of the machine, but there are situations\
    \ when buffering is not desirable, and it must be somehow suppressed. For example,\
    \ assume that system variable #1100 (which corresponds to signal F54.0 in the\
    \ PMC ladder diagram) has been used to operate an external device, connected to\
    \ the output terminal Y5.0 (which can be located on the terminal strip of the\
