    6059, G1000 would call the macro 09019. And, if the program number corresponding
    to a defined G-code does not exist, the control would enter the alarm state, displaying
    the “NUMBER NOT FOUND” alarm message. For example, storing 100 in parameter 6050,
    without defining program 09010, would cause an alarm state if G100 is commanded.


