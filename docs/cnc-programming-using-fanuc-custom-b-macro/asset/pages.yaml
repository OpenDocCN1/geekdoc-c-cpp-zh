- pgno: 275
  md: '# NOTE:


    +   1. In a bit-type parameter, it is not possible to change a single bit independently.
    All eight bits must be specified.

    +   2. A decimal cannot be used in the value specified in the R-Word.

    +   3. Other NC statements cannot be specified between G10 L50 and G11.

    +   4. If a canned cycle is being used, it must be canceled before commanding
    G10 L50.

    +   5. For axis-type parameters, P1 refers to the first row, P2 to the second
    row, and so on.

    +   6. Inserting sequence numbers in the given format is permitted. If two N-words
    appear in a block, the one at the left is considered the sequence number, and
    the other parameter number.


    # Example 1 (Word-Type Parameter):


    G-code that calls custom-macro-program number 09010 is stored in parameter 6050,
    on both lathe and milling machine. Therefore, if it is desired to call 09010 by,
    say, G100 (any value from 1 to 9999 can be selected; note that the acceptable
    range of a word-type parameter is larger than the defined range for parameter
    6050), 100 would need to be stored in parameter 6050. This can be done by


    ```

    G10 L50;

    N6050 R100;

    G11;

    ```


    # Example 2 (Two-Word Axis-Type Parameter):


    It is desired to set external offset to zero, G54 X-offset to 150.123 mm, and
    G54 Z-offset to 350.456 mm on a lathe. The associated parameters are 1220 and
    1221, respectively. The values are required to be specified in microns. The first
    row of such parameters corresponds to the X-axis, and the second to the Z-axis,
    and a lathe. On a milling machine, the third row would correspond to the Z-axis.
    The desired changes can be done by


    ```

    G10 L50;

    N1220 P1 R0;

    N1220 P2 R0;

    N1221 P1 R150123;

    N1221 P2 R300456;

    G11;

    ```


    Of course, the G10 L2 method also can be used (which is a bit simpler method),
    which does not directly refer to these parameters:


    ```

    G10 L2 P0 X0 Z0;

    G10 L2 P1 X150.123 Z300.456;

    ```


    Note that the distances are specified in millimeters, not in microns. A flexibility
    in G10 L50 method is that changes can be done in both absolute and incremental
    modes. G10 L50 method does not permit incremental changes; R-word always contains
    the new value. The system-variable method can also be used in this case.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Example 3 (Byte-Type Parameter):


    If a compact PCMCIA card is desired to be used as an external memory device, parameter
    0020 would need to store 4, on both lathe and milling machines. The permissible
    range of this parameter is 0 to 35 (which is smaller than the defined range for
    a byte-type parameter). The desired change can be done by


    ```

    G10 L50;

    N20 R4;

    G11;

    ```


    When specifying parameter number, leading zeroes can be omitted. Therefore, N20
    and N0020 are both equivalent in this example.


    # Example 4 (Bit-Type Parameter):


    It is desired to use calculator-type decimal input for distances (so that, e.g.,
    X10 is interpreted as 10 mm, not as 10 μm). Parameter 3401#0 (which means bit
    #0, the one at the extreme right, of parameter 3401) is required to be set as
    1 for this. However, the G10 L50 method requires that all the eight bits be specified,
    even if change in just one bit is needed. Let us assume that the current setting
    of parameter 3401 on a lathe is 00000100 (one has to find out; there is no way
    out). This would need to be changed to 00000011, which can be done by


    ```

    G10 L50;

    N3401 R00000011;

    G11;

    ```


    Note that leading zeroes in the R-word cannot be omitted.


    # Example 5 (Bit-Axis-Type Parameter):


    G51/G51.1 is available on a milling machine for mirroring of a selected toolpath.
    If, however, it is desired to always have mirroring for, say, the X-axis, this
    can be more conveniently done by setting parameter 0012#0 to 1 for the X-axis,
    which would obviate the need for using G51/G51.1 for mirroring. Let us assume
    that the current setting of parameter 0012 is 00000000, in the first row (i.e.,
    for X-axis). This would need to be changed to 00000001, for the X-axis mirroring.
    The change can be done by


    ```

    G10 L50;

    N12 P1 R00000001;

    G11;

    ```


    Another, and a simpler, way to do this is to use system variable for mirroring,
    #3007 (see Table 3.9):


    ```

    #3007 => 1;

    ```


    A change in parameter 0012#0 automatically changes variable #3007, and vice versa.


    In general, if a system variable corresponding to a parameter is available, there
    is no need to use G10, since the system-variable method would be simpler. Moreover,
    by reading system variables, it is also possible to know the current settings
    (to which one can never read back, if so desired), which is not possible with
    parameters which can only be overwritten with new values (if change through a
    program is desired).'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Actually, G10 is an older feature that came before macro programming was introduced.
    Now, it has lost its relevance in many cases.


    # A Limitation of G10 L50 Method


    Once a parameter is changed, there is no way it could be reverted back to its
    original value, unless we know its prechange value. (Then we can use G10 L50 again
    with the original values.) G10 L50 only overwrites a parameter with a new value(s).
    In fact, this is true for all applications of G10. It is not possible to “undo”
    a G10. While incorrect changes in other applications may not have serious implications,
    improper parameter setting may prove to be extremely dangerous. Therefore, extreme
    care must be exercised while using G10 L50. In fact, as a rule of thumb, one should
    not play with parameters unless it is absolutely necessary, and one fully understands
    the function of the parameter which is going to be changed. To be on the safer
    side, one must always keep a backup of the original settings of all the parameters.
    If you do not have an external memory device (such as a compact flash card) or
    RS-232 connection on your machine, or you simply do not know how to do the backup,
    just note down all the parameter values on a piece of paper and keep it in a safe
    place. An hour or two spent today may one day save weeks of downtime on the machine!'
  merge: -1
  img_proc: true
