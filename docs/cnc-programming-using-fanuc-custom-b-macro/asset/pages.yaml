    In program O0009, it is assumed that the maximum permissible depth of cut is 2
    mm. As an exercise, try to modify the program when the maximum permissible depth
    of cut is 1 mm. Also, try to construct the loop using the IF_GOTO_ statement.
    The flowchart for such a case is given in Fig. 6.3. Note, however, that the WHILE
    statement is preferred over the IF_GOTO_ statement for constructing loops, as
    discussed in Chap. 5.


    The flowchart given in Fig. 6.3 would need to use the IF_GOTO_ statement twice.
    This is because the desired depth of the groove may even be less than 1 mm. In
    the loop created by the IF_GOTO_ statement, the loop terminating condition is
    checked in the end. Therefore, it is also necessary to check the desired depth
    before entering the loop, to decide whether the loop should be executed. This
    problem was not there with the WHILE loop because the loop terminating condition
    is checked in the beginning of the loop. This is yet another reason why the WHILE
    loop is preferred over the IF_GOTO_ loop.


    Programs 0008 and 0009 have used several of the macro-programming features. The
    use of macro-programming features is not restricted to developing macros only,
    even though this is their main purpose. The main programs also can use these features.
    In fact, this is the way one should start learning macro programming. Writing
    macros for different applications should be started only after mastering the basic
    features of the language, by using these in main programs and subprograms, as
    much as possible.'
