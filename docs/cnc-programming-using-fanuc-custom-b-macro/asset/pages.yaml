  md: "![](img/1341ce50369ce8fcfb8dc3539d51c52f_201_0.png)\n\nNote:\n\n+   1. The\
    \ sequence of toolpath is numbered.\n+   2. Rapid motions: 1, 4, 5, 8, 9, 12,\
    \ 13, 16, 17, 20, 21, 24.\n+   3. Feed motions: 2, 3, 6, 7, 10, 11, 14, 15, 18,\
    \ 19, 22, 23, 25, 26, 27.\n+   4. Toolpath 1 to 24, caused by executing G94 in\
    \ a loop (along with a positioning move at the end of each G94 cycle), simulates\
    \ the roughing operation of G72 (without finishing allowances), with the difference\
    \ that the retractions (3, 7, etc.) are not at 45°\n+   5. Toolpath 25 is a positioning\
    \ move, after the completion of all G94 cycles.\n+   6. Toolpath 26 consists of\
    \ very small straight-line path segments along the defined parabolic profile.\
    \ It removes the steps that are nearly triangular in shape, created along the\
    \ parabolic profile, by toolpath 1 to 24. Thus, it simulates the step-removal\
    \ operation of G72. The accuracy of machining would, obviously, depend on the\
    \ chosen value of Z-increment for generating toolpath 26.\n+   7. Toolpath 27\
    \ is a straight-line move along the tangential direction, for removing a possible\
    \ kink at the outer edge of the parabola.\n+   8. The final rapid move, to the\
    \ position of the tool immediately before calling the macro, is not shown.\n\n\
    Figure 8.5 Toolpath for turning a parabola.\n\n```\n    #102 = [[#13 * #13 * ABS[#7]]\
