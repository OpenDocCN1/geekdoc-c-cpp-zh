    IF [#24 NE #0] AND [#21 NE #0] THEN 3000 = 1 (BOTH X

    AND U SPECIFIED);

    IF [#26 NE #0] AND [#23 NE #0] THEN 3000 = 2 (BOTH Z

    AND W SPECIFIED);

    IF [#9 EQ #0] THEN #7 = 4109;

    IF [#19 EQ #0] THEN #19 = 4119;

    IF [#19 LT 100] AND [#4002 EQ 97]] THEN #3006 = 1 (IS

    LOW RPM OK);

    IF [#19 LT 10] AND [#4002 EQ 96]] THEN #3006 = 1 (IS

    LOW CSS OK);

    G01 X24 U12 Z26 W23 F#8 S#19;

    ```

    ```


