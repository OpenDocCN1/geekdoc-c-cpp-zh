    and complete this exercise by editing a parameter among 6050–6059 (storing 1 in
    it) and defining the corresponding program number among O9010–O9019.


    Recall that a G-code, inside a macro called by the same or a different G-code
    (other than G65/G66), is treated as the predefined standard G-code, with the usual
    function. Hence, G01 inside the macro called by G01 would be considered linear
    interpolation only; it would not call the same macro again, forming an endless
    loop.


    Note that the chosen minimum values for rpm and CSS (100 and 10 m/min, respectively)
    are arbitrary. Specify suitable values for specific applications. Moreover, just
    checking the S-value does not confirm that M03 or M04 has been commanded to start
    the spindle! In fact, there is no way to determine whether or not the spindle
    is rotating through a program. The system variable for the M-code (#4113) stores
