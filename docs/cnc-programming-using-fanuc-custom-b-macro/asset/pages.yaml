    In fact, in general, the methods of calling a macro/subprogram, using G-code/M-code/T-code,
    cannot be used in programs called by any of these methods. The G-code/M-code/T-code
    used in these programs are treated as ordinary codes with the original function.
    For example, if parameter 6071 contains 3, M03 will call subprogram 09001. But,
    if M03 is again used in 09001, it would be treated as spindle start command. This
    “restriction” can be very advantageously used, as explained in the following example.


    If the spindle is rotating, the command to change the direction of rotation abruptly
    (counterclockwise to clockwise or vice versa) may cause excessive load on the
    spindle motor, due to inertia. Therefore, it may be desirable to insert M05, with
    a 5-second dwell, while switching between M03/M04. By storing 3 in parameter 6071,
    and defining 09001 in the given manner, M03 used in any program (the main program,
    a subprogram called by M98/M99, or a macro called by G65/G66, that is, a program
    not called by G-code/M-code/T-code) will first stop the spindle, and dwell for
    5 seconds, before starting clockwise rotation. Thus, M03 gets modified to have
    a similar but extended function.'
