  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_231_0.png)


    Note:


    +   1. The syntax of G183, a regressive peck-drilling cycle on a milling machine,
    can be

    +      `G183 X_ Y_ Z_ R_ Q_ I_ M_ F_`

    +      where

    +      X, Y is hole location,

    +      Z is the hole depth,

    +      R is the R-point level,

    +      Q is the first peck length,

    +      I is the regression factor,

    +      M is the minimum peck length and

    +      F is the feedrate.

    +   2. The tool first moves to the XY-point (hole axis), and then to the R-point,
    at rapid traverse r after drilling starts. The designed toolpath is the same as
    that in the standard G83 cycle, except that the subsequent peck lengths get reduced
    by the regression factor

    +      (Q → Q × I → Q × I × I, and so on).

    +   3. All the pecks and the retractions are along the axis of the hole. In the
    figure, these are shown separately for clarity.

    +   4. If a calculated peck length comes out to be smaller than the specified
    minimum peck length, this as well as all the subsequent peck lengths are clamped
    to the specified minimum value.

    +   5. All the outward motions (retractions) are rapid motions.

    +   6. Each drilling motion is rapid up to 1 mm before the previous drilled depth,
    after which feed motion starts, to increase the depth by the calculated peck length.

    +   7. The peck continues until the bottom of the hole is reached. Thereafter,
    the tool retracts to R-point or the initial Z-level. The last peck would have
    an adjusted movement, to suit the specified depth.


    Figure 10.4  Regressive peck-drilling cycle on a milling machine.'
