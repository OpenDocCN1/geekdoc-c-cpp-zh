    The subroutine given above is definitely better, since it can be called in both
    absolute and incremental modes. Nevertheless, it does have a shortcoming: it forces
    incremental mode when the execution returns to the calling program. Moreover,
    it assumes that G01 is active at the time of calling it. This is yet another source
    of programming errors. Subprograms and macros should be made as general as possible/practical,
    because usually these are developed by expert programmers for use in several programs
    prepared by other programmers. If a new programmer calls a subroutine developed
    by some other programmer, he definitely does not expect that the subroutine would
    change the coordinate mode or any other setting of the calling program! Fortunately,
    using macro-programming features, it is possible to identify the current coordinate
    mode, among several other things. So, a subprogram can be designed in such a manner
    that it does not change the current status of the control. This can be done by
    identifying the status of the control in the beginning of the subprogram, and
    restoring it in the end, that is, just before exiting to the calling program by
    M99.


    Note that the subprogram O0007 needs to use three things: G01, G91, and F-code.
    G01 belongs to G-code Group 01, and G91 belongs to Group 03. The other G-codes
    in Group 01 are G00, G02, G03, and G33 on a milling machine. On the other hand,
    G90 is the only other G-code in Group 3. Referring to Table 3.10(b), the system
    variable #4001 stores 0, 1, 2, or 3 depending on the currently active G-code of
    Group 01 (G00, G01, G02, G03, and G33, respectively). For example, if G01 is currently
    active, #4001 would store 1 (recall that, at any time, one G-code from each group
    remains active). Similarly, system variable #4003 stores 90 or 91 depending on
    which one of G90 and G91 is currently active. The current feedrate is stored in
    system variable #4109.


