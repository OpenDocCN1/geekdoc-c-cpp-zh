- pgno: 190
  md: 'This program is quite general now, except that it assumes certain control conditions.
    It is left as an exercise for the users to make the macro suitable for any control
    conditions. The approach would be similar to that used in the macros of Chap.
    7 (O9011 and O9012). Moreover, the macro assumes that the maximum permissible
    depth of cut in a pass is 3 mm. A local variable can be used to supply this value
    to the macro. This is desirable because different cutting conditions require different
    cutting parameters. The readers should try to do this also, which is pretty straightforward
    (just replace 3 by the chosen local variable at required places).


    An important point regarding the style of this program must be observed: the local
    variables, which were used for value assignment through the G65/G66 statement,
    have not been redefined inside the macro. The temporary calculation results have
    been stored in common variables. This practice reduces the possibility of errors
    in the macro that may require using the original specified values at several places.
    So, if the specified value of some local variable is to change, as per the logic
    of the macro, store it in some common variable, and use it instead of the local
    variable. The #107 = ABS[#7] statement does exactly the same thing, to take care
    of reducing the depth of the slot after each pass. #7 has not been redefined.


    # 8.3  Helical Interpolation with Variable Radius


    Helical interpolation is available on three-axis milling machines, as an option.
    It is, basically, a circular interpolation only, superimposed with synchronized
    linear motion along the third axis, such that the drive motors for all the three
    axes reach the specified end point at the same time, while moving at a uniform
    rate (though their speeds would be different from one another). The specified
    feedrate is maintained along the projected toolpath on the plane of circular interpolation.
    Therefore, the feedrate along the linear axis would be


    $$\text{specified feedrate} \times \frac{\text{length of linear axis}}{\text{length
    of circular arc}}$$


    (which is automatically calculated by the control)


    Obviously, the actual feedrate of the tool, that is, feedrate along the toolpath,
    would be more than the specified feedrate. It would, in fact, be equal to


    $$\sqrt{(\text{feedrate along linear axis})^2+(\text{specified feedrate})^2}$$


    On a three-axis milling machine, helical interpolation is possible along the X-,
    Y-, and Z-axes, corresponding to G19 (YZ-plane), G18 (XZ-plane), and G17 (XY-plane),
    respectively. Helical interpolation along the Z-axis is shown in Fig. 8.2, which
    can be commanded as'
  merge: -1
  img_proc: true
