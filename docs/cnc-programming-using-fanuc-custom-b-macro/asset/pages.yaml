- pgno: 108
  md: '# 5.3  Conditional Execution of a Single Macro Statement


    Such a statement (IF_THEN_) has already been used in program number 8003 (it is
    left as an exercise for the reader to think how the program can be developed without
    using this statement). Here, it is formally described, in detail.


    A specified macro statement may or may not be executed depending on whether a
    specified condition is satisfied or not. The format is


    ```

    IF <a conditional expression> THEN <a macro statement>;

    ```


    The conditional expression may even be a complex combination of several independent
    conditions.


    The IF_THEN_ format has the following limitations:


    +   - Only a single macro statement can be specified.

    +   - An NC statement is not allowed.


    **Examples:**


    | Example | Explanation |

    |---|---|

    | `IF [#1 LT #2] THEN #3 = 3;` | (If the condition is TRUE, a value of 3 is assigned
    to the variable #3. A FALSE condition leaves the previous value stored in #3 unchanged.)
    |

    | `IF [#1 LT #2] #3 = 3;` | (Illegal command. THEN must be there) |

    | `IF [#1 LT #2] THEN M30;` | (Illegal command because an NC statement has been
    specified) |

    | `IF [#1 LT #2] THEN [#3 = 3; #4 = 4];` | (Illegal command because more than
    one macro statements have been specified. In fact, it is not possible to have
    this command displayed in the manner shown. The first semicolon changes the line
    which breaks the statement into two separate blocks, making it completely meaningless)
    |


    If more than one macro statements are desired to be executed if a specified condition
    is TRUE (e.g., if [#1 LT #2] is TRUE), this can be done in the following manner
    where the statements between the IF_GOTO_ and N100 blocks are executed only if
    #1 is less than #2):


    ```

    IF [#1 GE #2] GOTO 100;

    <macro statement -1>

    <macro statement -2>

    ...

    ...

    <macro statement -n>

    <NC statement -1>

    <NC statement -2>

    ...

    ...

    ```'
