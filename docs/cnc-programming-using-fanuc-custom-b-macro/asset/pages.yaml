- pgno: 110
  md: "If the specified condition is satisfied (i.e. if the conditional expression\
    \ evaluates to TRUE), the program blocks between DO and END are executed. Thereafter,\
    \ the condition is checked again, and if the condition is still satisfied, the\
    \ loop is reexecuted. As long as the condition remains satisfied (which is tested\
    \ in the beginning of each loop), the loop is repeatedly executed.\n\nThe program\
    \ blocks inside the loop are so designed that their processing affects the specified\
    \ condition, such that, after a few executions of the loop, the condition becomes\
    \ FALSE. Thereafter, the program execution proceeds to the block next to END,\
    \ after fully completing the execution of the loop which changed the condition\
    \ from TRUE to FALSE. Note that the condition is checked before executing a new\
    \ loop; it is not checked while executing a loop. The flowchart for the WHILE\
    \ statement is given in Fig. 5.6.\n\nThough only 1, 2, and 3 can be used as identification\
    \ numbers (n), these can be used any number of times in a program:\n\n```\nWHILE\
    \ [<conditional expression 1>] DO 1;\n                         (The identification\
    \ number is 1)\n...\n...\n<program blocks within the first loop>\n...\n...\nEND\
    \ 1;\nWHILE [<conditional expression 2>] DO 1;\n                         (Same\
    \ identification number permitted)\n...\n...\n```\n\n![](img/1341ce50369ce8fcfb8dc3539d51c52f_110_0.png)\n\
    \n**FIGURE 5.6**\nFlowchart for a\nWHILE statement."
  merge: -1
  img_proc: true
