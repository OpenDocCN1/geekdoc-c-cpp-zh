- pgno: 35
  md: '```

    #1 = 1000.5000;

    M03 S#1;          (Equivalent to M03 S1001)

    M03 S1000.0;      (An illegal statement. S-value must be an integer number)


    #1 = 3.4999999;

    M#1 S1000;        (Equivalent to M03 S1000)

    #1 = 3.5000000;

    M#1 S1000;

    M3.0 S1000;       (An illegal statement. M-value must be an integer number)

    ```


    Although the last statement is illegal, if 3.0 (or some other real number or expression)
    is enclosed within square brackets, it becomes a macro expression, and rounding
    is done:


    ```

    M[3.0] S1000;       (Equivalent to M03 S1000)

    M[3.4999999] S1000; (Equivalent to M03 S1000)

    M[3.5] S1000;       (Equivalent to M04 S1000)

    ```


    This also applies to all other addresses (except G-codes) such as spindle speed
    also:


    ```

    M03 S[1000.0];    (Equivalent to M03 S1000)

    M03 S[1000.4999];  (Equivalent to M03 S1000)

    M03 S[1000.5000];  (Equivalent to M03 S1001)

    ```


    All these square brackets can also contain arithmetic expressions. Note that if
    parameter 3451#2 (on a milling machine only; this parameter is not available on
    a lathe) is set to 1, the spindle speed can have up to one decimal point, though
    the interpreted speed would be the rounded integer value:


    ```

    S1000.5;   (Equivalent to S1001, if parameter 3451#2 = 1)

    S1000.50;  (Illegal, because of more than one decimal place)

    ```


    “Too much flexibility makes a programming language rather “undisciplined,” and
    it becomes error-prone. An inadvertent mistake by the programmer might be interpreted
    “correctly” by the machine, leading to undesirable consequences. And this is very
    possible because macro programming may involve complex calculations and complicated
    logic. In the author’s opinion, a real value must not be accepted where an integer
    value is required. Moreover, as has been described in Sec. 2.6, Fanuc control
    (in fact, perhaps all controls) treats a null variable as a variable having 0
    value in arithmetic calculations. This is again illogical and may prove to be
    dangerous. Typing mistakes are always possible. Perhaps the control manufacturers
    should modify their macro compilers to make it a PASCAL-like disciplined language.
    Presently, the programmer has to very meticulously understand the logic followed
    by the macro compilers.'
