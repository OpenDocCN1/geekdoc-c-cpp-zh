- pgno: 72
  md: '# CHAPTER 4


    # Macro Functions


    # 4.1 Types of Macro Functions


    Macro programming is equipped with all the commonly used mathematical functions
    that are typically available in a high-level computer programming language. The
    available macro functions can be separated into groups, to make their understanding
    and usage easier to learn. There are broadly five groups, apart from the usual
    arithmetic operations:


    +   - Trigonometric functions

    +   - Rounding functions

    +   - Miscellaneous functions

    +   - Logical functions

    +   - Conversion functions


    A value may be assigned to a variable (or an expression that evaluates to a legal
    variable number) using any combination (that should, of course, be logically correct)
    of these functions. An unassigned (undefined) variable is called a null variable
    that is equivalent to 0 in mathematical calculations. So, as a general rule, a
    variable should not be used in any mathematical expression without first defining
    it.


    # Priority of Operations in Arithmetic Expressions


    In a complex expression, involving several functions and brackets, the following
    priority rule is followed:


    +   1. Brackets (only square brackets are permitted)

    +   2. Functions (such as SIN, ATAN, SQRT, and EXP)

    +   3. Multiplication (*), division (/), and bitwise AND

    +   4. Addition (+), subtraction (-), bitwise OR, and bitwise XOR


    If more than one operation of equal priority appear in a row, the calculation
    is done from left to right.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "+   **Examples:**\n+   \n+   - `2 + 2 / 2` — (Returns 3)\n+   - `[2 + 2] /\
    \ 2` — (Returns 2)\n+   - `2 - 2 / 2` — (Returns 0.5)\n\n# Priority of Operations\
    \ in Boolean Expressions\n\nA Boolean expression can have arithmetic expressions\
    \ (within square brackets) to the left as well as to the right of the conditional\
    \ operator. The priority rules are followed inside each bracket independently:\n\
    \n```\n`[[2 + 2 / 2] LT [2 + 2]]`  (Equivalent to `[3 LT 4]`, which returns TRUE)\n\
    ```\n\nThe arithmetic expression at the right of a conditional operator must be\
    \ enclosed within brackets, but the brackets at the left are optional:\n\n+  \
    \ - `[2 + 2 / 2 LT [2 + 2]]`  (Same as above, hence returns TRUE)\n+   - `[2 +\
    \ 2 / 2 LT 2 + 2]`  (After evaluating the arithmetic expression at the left, which\
    \ returns 3, further evaluation is done from left to right. So, the statement\
    \ is equivalent to FALSE + 2, which is meaningless and hence illegal)\n\nSkipping\
    \ brackets in Boolean expressions (even if it does not give an error, in some\
    \ cases) is a source of confusion. So, it is a good programming practice to use\
    \ brackets on both sides of conditional operators, as well as outer brackets for\
    \ the whole expression.\n\n# Effect of Order of Calculations\n\nIn some cases,\
    \ the order of calculation does not change the mathematical meaning of an arithmetic\
    \ expression, and therefore, the same final result is expected. However, in certain\
    \ cases of extremely large or extremely small values, the order of calculation\
    \ may become very important:\n\n+   - `#1 = 10000000;`  (Assigns a value of 10⁷\
    \ to #1)\n+   - `#1 = #1 * #1 * #1 * #1 * #1 * #1 * #1;`  (Assigns a value of\
    \ 10⁴⁹ to #1)\n+   - `#1 = #1 * 100000;`  (Assigns a value of 10⁴⁷ to #1, which\
    \ is the largest legal value)\n+   - `#2 = #1 / 10 * 10;`  (Sets #2 = 10⁴⁷)\n\
    +   - `#3 = #1 * 10 / 10;`  (Though the expression on the RHS is mathematically\
    \ the same as the previous expression, the first calculation from the left gives\
    \ 10⁴⁸, which would cause data overflow, terminating the program execution. In\
    \ such cases, brackets can be used to change the order of calculation.)\n+   -\
    \ `#4 = #1 * [10 / 10];`  (Sets #4 = 10⁴⁷)"
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_74_0.png)


    **FIGURE 4.1** Nesting of brackets.


    # Nesting of Brackets


    Nesting of brackets is permitted up to a maximum of five levels (i.e., five left
    and five right nested brackets can be used), including the brackets used with
    functions such as


    ```

    SIN[<a variable number or an arithmetic value or an arithmetic expression>]

    SQRT[<a variable number or an arithmetic value or an arithmetic expression>]

    ```


    The calculation starts from the innermost brackets, and proceeds to the outermost
    brackets, one by one. The example given in Fig. 4.1 is trivial, but it does show
    the maximum possible level of nesting, and explains the order of calculation.


    There is no limitation on the total number of brackets in an expression. The same
    expression can have nesting at several places, each nesting being restricted to
    a maximum of five levels.


    # 4.2  Arithmetic Operations


    The four arithmetic operators, addition (+), subtraction (−), division (/), and
    multiplication (*), carry usual meanings and give calculator-type results. In
    fact, these have already been used in several examples. The only thing that needs
    to be repeated here is that the control does not differentiate between real and
    integer numbers. In fact, all numbers are treated as real numbers, in calculations.
    So,


    ```

    #1 = 1 / 2;

    #1 = 1.0 / 2;

    #1 = 1 / 2.0;

    #1 = 1. / 2.0;

    ```


    are all equivalent, and assign a value of 0.5 to #1.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Another point to mention is about the accuracy of the calculated values. Since
    the calculations are done using a limited number of binary digits, typically an
    error of 10^-3 gets introduced in each arithmetic operation. This is insignificant
    because the accuracy of the machine is only 0.001 mm in millimeter mode. However,
    in equality comparison statements, this might create problems, as the values may
    not be exactly equal, up to all decimal digits. So, instead of using


    ```

    IF [#1 EQ #2] THEN #3 = 10;


    use


    IF [ABS[#1 - #2] LT 0.001] THEN #3 = 10;

    ```


    assuming 0.001 is the acceptable error (or else, choose a still smaller value).
    Conditional statements are explained in detail in Chap. 5.


    # Division versus Block-Skip Function


    The slash symbol (/) is used both for division and the block-skip function. Normally,
    a slash in the beginning of a block is interpreted as the block-skip symbol, and
    then in the middle of a block is taken as the division operator. However, some
    controls (including Fanuc) allow mid-block skip also. This may give unexpected
    results. So, on such controls, enclose the division operation within brackets:


    ```

    #1 = 10;

    #2 = #1 / 2;


    #3 = [#1 / 2];

    ```


    (The slash may be interpreted as the block-skip symbol. So, #2 is set to 10, if
    the block-skip switch on the MOP is ON)


    (#3 is always set to 5, even if mid-block skip is permitted and the block-skip
    switch is ON)


    Some machine tool models do not have block-skip switches. On such machines, slash
    is always interpreted as the division operator; as such, there is no need to use
    brackets for division.


    # 4.3  Trigonometric Functions


    The available functions are


    +   - SIN

    +   - COS

    +   - TAN

    +   - ASIN

    +   - ACOS

    +   - ATAN'
  merge: -1
  img_proc: true
- pgno: 76
  md: "representing sine, cosine, tangent, arc sine (sin⁻¹), arc cosine (cos⁻¹), and\
    \ arc tangent (tan⁻¹), respectively, since these are those found on scientific\
    \ calculators. All inputs for SIN, COS, and TAN are in degrees, and the outputs\
    \ of the inverse functions ASIN, ACOS, and ATAN are also in degrees. So, if an\
    \ angle is given in degree/minute/second format, it would need to be converted\
    \ into degrees using the conversion formula\n\n$$D_d = D + \\frac{M}{60} + \\\
    frac{S}{3600}$$\n\nwhere D, M, and S are degree, minute, and second values of\
    \ the specified angle, respectively, and D_d is the converted value in degrees.\n\
    \n# Example:\n\n10° 30′ 36″ = 10 + 0.5 + 0.01 = 10.51°\n\nLike all other functions,\
    \ the trigonometric functions also must be used with square brackets. The brackets\
    \ may contain a constant, a variable number, or an arithmetic expression. Note\
    \ that ATAN uses a rather unusual way of representation—the two sides (perpendicular\
    \ and base) of the right-angled triangle are required to be specified within separate\
