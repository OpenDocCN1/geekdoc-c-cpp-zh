- pgno: 197
  md: 'suitable diameter would be required to be drilled first, before proceeding
    with parabolic turning. The method given here, however, cannot be directly used
    if the design does not permit existence of a central hole. In such a case, machining
    would have to be done using the pattern repeating cycle (G73) in facing operation
    (i.e., with radial relief = 0 and axial relief = as required), with a neutral
    facing tool. However, as a first approximation, a central hole can still be made,
    with a stoplit, to have a flat surface at the bottom of the hole. The error introduced
    (the distance between the vertex of the parabola and the flat bottom) may be negligibly
    small. For example, it is 0.3175 mm for the dimensions given in Fig. 8.4.


    The first task is to derive a mathematical equation for the parabola. It can be
    shown that the general equation in terms of the maximum diameter (M), bore diameter
    (B), and the depth (D) is


    $$X^2 = \frac{M^2 - B^2}{D}\left\{Z + \frac{M^2D}{M^2 - B^2}\right\}$$


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_197_0.png)


    Figure 8.4  Turning a parabola.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'One can verify that Z = 0 gives X = M, and Z = −D gives X = B. Note that this
    equation has been written in a form to suit diameter programming on a lathe. For
    the dimensions given in Fig. 8.4, this equation reduces to


    $$X^2 = 315(Z + 20.3175)$$


    However, instead of using this equation, the general format would be used in the
    macro.


    Machining of this type, both internal and external, which involves bulk material
    removal, is usually done by G71, the multiple turning cycle (also called the stock
    removal cycle, or simply the roughing cycle) or G72, the multiple facing cycle,
    as these are the most efficient cycles. So, one may think of using, say, G71,
    for machining, where the given equations would be used for defining the parabolic
    curve between P- and Q-block numbers. (Note, however, that when the radial dimension
    of the material to be removed is more than its axial dimension, as in the present
    case where these values are 35 and 20 mm, respectively, G72 would be more efficient
    than G71.) An algorithm involving G71 can be written in the following manner:


    +   1. Place the tool at the start point of G71.

    +   2. Command G71 and place the tool at the start point of the parabola, that
    is, at X = M and Z = 0.

    +   3. Use the specified axial step distance ΔZ, and assign Z = −ΔZ.

    +   4. If |Z| is greater than D, which is |Zₘₐₓ|, go to step 9.

    +   5. Calculate X, using the given formula.

    +   6. Move to the calculated coordinates by G01.

    +   7. Change the Z-coordinate (Z = Z − ΔZ).

    +   8. Go to step 4.

    +   9. End of G71.

    +   10. Finish by G70 with half the specified feedrate, and twice the current
    rpm, for a better finish.

    +   11. Return to the calling program.


    Unfortunately, the technique described above does not work. This is because though
    G71 and G72 do allow loops between the P- and Q-blocks, presence of a movement
    command in a loop is not allowed.


    Therefore, it is not possible to define the geometry of the part through a loop;
    for G71/G72, where even subprograms/macros cannot be called from within G71/G72
    cycles (M98 is ignored, and G65/G66 alarm out). G73, the pattern repeating cycle,
    does not have these limitations, but it would be a highly inefficient cycle for
    such applications, as it would be cutting in the air most of the time.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Hence, the only way, in such a case, is to simulate the roughing operation
    of G71 and G72 by calling G90 and G94, respectively, in a loop. The step-removal
    operation of G71/G72 can be simulated by moving the tool along the desired profile,
    defined as tiny straight line segments. An algorithm for simulating G72 (which
    is more efficient compared to G71, for the given dimensions) is given below:


    # Roughing Operation


    +   1. Place the tool at Z = 0, with 1 mm clearance from the hole, i.e., at X
    = B − 2D.

    +   2. Assign Z = − <specified roughing depth of cut>.

    +   3. If |Z| is greater than D, go to step 9.

    +   4. Calculate X, using the given formula.

    +   5. Command G94, with the calculated coordinates and the specified feedrate
    as its arguments.

    +   6. Shift the tool axially, to the Z-level of the machined surface, which would
    be the start point of the next G94 cycle.

    +   7. Change the Z-coordinate (Z = Z − <specified roughing depth of cut>).

    +   8. Go to step 3.


    # Step-Removal Operation


    +   1. Place the tool at the inner edge of the parabola, that is, at (B, −D).

    +   2. Assign Z = −D.

    +   3. If Z is greater than 0, go to step 16.

    +   4. Calculate X, using the given formula.

    +   5. Move to the calculated coordinates by G01.

    +   6. Change the Z-coordinate (Z = Z + <specified step distance in Z>).

    +   7. Go to step 11.

    +   8. Return to the calling program.


    Note that if the depth of the parabola is not an exact multiple of the specified
    step distance in Z, the tool will not exactly reach the outer edge of the parabola.
    This would leave a small kink at the edge. This can be removed by moving the tool
    by some distance along the tangential direction at Z = 0. It can be shown that
    the increments in X and Z, at Z = 0, are related by the following formula:


    $$\Delta X = \frac{M^2 - B^2}{2MD}\Delta Z$$'
  merge: -1
  img_proc: true
