  md: '# CHAPTER 12


    # Communication with External Devices


    # ## 12.1 Introduction


    Adequate description of how to control an external device through the PMC has
    already been given in Sec. 3.5 (Subsection Interface Signals). Knowledge of Ladder
    language, however, is a prerequisite for programming the PMC. Additionally, one
    must also know input types (source/sink type), output types (source/sink relay
    type), and wiring techniques for a PLC. Moreover, if noncontact-type proximity
    switches are desired to be used for sensing the presence of an object, one must
    know the characteristics of such sensors (source/sink type). The whole thing is
    pretty vast, and can be described in detail only in a text designed especially
    for this purpose. However, for the convenience of readers, a brief description
    is given in this chapter, the minimum one must know. The main purpose here is
    to refresh the memory, rather than explaining the fundamental concepts meticulously.
    Hence, a reader who is completely new to PLC applications would need to refer
    to some basic text on PLC.


    # ## 12.2 Switching Principle


    The input/output digital signals of a PLC are based on the principle of saturation-mode
    operation of a transistor, when it starts working like an electronic ON/OFF switch.
    (Before saturation, it serves the purpose of signal amplification.)


    The representation of an NPN transistor is shown in Fig. 12.1, along with its
    functional model. I_B, I_C, and I_E are base current, collector current, and emitter
    current, respectively. (I_E = I_B + I_C.) The variable resistance between collector
    and emitter (R_CE), to which power source (+V_CC) and load are connected, can
    be thought of as being controlled by the base current; when the base current is
    zero, the resistance is infinite, which decreases with an increase in base current.
    As a result, when the base current increases, the collector current also increases.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_253_0.png)


    **Figure 12.1** An NPN transistor.


    The ratio of I_C to I_B is called the current gain of the transistor, a typical
    value being 100. (Since the current gain is typically very high, I_C and I_E would
    be nearly equal.) This describes the use of a transistor as a current amplifier.
    However, beyond a certain value of base current, R_CE becomes nearly zero. As
    a result, I_C does not increase any further, and the transistor is said to be
    saturated. In saturation mode, I_C depends on external resistance (load) and power
    supply; with the transistor offering nearly zero resistance to the current flow.
    Such an ideal transistor characteristic is shown in Fig. 12.2.


    Thus, a transistor can be used as an electronic switch, in saturation mode. For
    such a use of a transistor, the circuit (regulating the base current) is designed
    in such a manner that the transistor remains either OFF (I_B = 0, resulting in
    I_C = 0) or becomes saturated.


    The digital inputs/outputs of a PLC use similar electronic switching. However,
    to protect the internal circuits from external currents, generally some kind of
    optoisolator is used. An optoisolator is a device consisting of a light-producing
    element, such as an LED, and a light-sensing element, such as a phototransistor.
    When a voltage is applied


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_253_1.png)'
  merge: -1
  img_proc: true
- pgno: 254
  md: "**FIGURE 12.3**  \nTypical PLC input circuits.\n\n![](img/1341ce50369ce8fcfb8dc3539d51c52f_254_0.png)\n\
    \nto the LED, light is produced that is sensed by the photodetector. Sufficient\
    \ light causes the phototransistor to saturate and it starts conducting. This\
    \ arrangement completely isolates the PLC from external current/voltage, as the\
    \ connection between the two is through a light beam only. For AC inputs, two\
    \ opposing LEDs are used. Figure 12.3 shows this arrangement for both DC and AC\
    \ input signals. DC signals can be given to AC inputs also, without bothering\
    \ about the polarity. Hence, AC-type input is actually AC/DC-type input. A current-limiting\
    \ resistor is needed to limit the current through the LED. The solid-state output\
    \ terminals also generally use a similar isolation technique.\n\n# 12.3  Input\
    \ Types and Wiring\n\nA commercial PLC provides for several types of inputs such\
    \ as DC-, AC-, and analog-type “normal” inputs, apart from inputs for special\
    \ functions such as high-speed input and immediate input. The PMC, however, usually\
    \ accepts only 24-V DC-type normal inputs. A restriction is that an external power\
    \ source must not be used for providing input signals; 24-V DC from inside the\
    \ PMC remains available for this purpose, on a pin of each 50-pin connector on\
    \ the input/output unit (on pin number B01 of CB104/105/106/107 on 01 control:\
    \ 0 V is available on pin number A01). This is because the PMC generally"
  merge: -1
  img_proc: true
- pgno: 255
  md: 'does not have PLC-like optoisolators inside it. Note, however, that various
    types of inputs/outputs, with or without isolation, can be made available as options,
    by inserting certain input/output cards in the input/output unit of the PMC. The
    standard configuration usually accepts only 24-V DC sink/source inputs, and provides
    source-type outputs (obviously for keeping external devices, such as a relay,
    working on a 24-V DC external power supply). Our discussion in this chapter would
    remain limited to these input/output types only.


    The input-signals (referred to as DI signals) to the PMC, through connectors CB104/105/106/107,
    are generally sink type (a type that drains energy). Hence, +24 V, as ON input
    signals, must be provided at respective terminals. Some DI signals, however, can
    be set to either sink type or source type, though a source-type DI signal is undesirable
    from the viewpoint of safety. This is because a source-type input requires that
    0 V, as ON input signal, be provided to the input terminal. This dangerous, because
    a grounded input line (due to a fault) would be interpreted as ON input signal.
    Hence, it is recommended that all DI signals be used as sink-type signals.


    Figure 12.4 explains the method of providing sink-type DI signal (digital, of
    course) to the PMC. The wiring for source-type DI signal would be similar, with
    the difference that instead of +24 V, 0 V avail-able at pin number A01 is used
    as ON input signal. DI signal X000.4 through X000.47 (which are provided through
    connector CB106) can be used both as source- and sink-type signals. For terminal
    (terminal number A14) of CB106 is connected to 0 V (terminal number A01) when
    these signals are used as sink-type signals. For source-type applications, COM4
    is connected to +24 V (terminal number B01). COM4 must never be left open, otherwise
    X000.4 through X000.47 would always remain OFF, irrespective of input signal condition.
    The external switch represents the discrete switching-action (ON/OFF) by an external
    switch/sensor.


    # 12.4 Connector Pin Assignment


    The block diagram of the general arrangement (on 0i control) for input/output
    connections is shown in Fig. 12.5. The PMC resides in the CNC control unit. It
    is connected to the I/O unit through an I/O link (which is a standard Fanuc cable).
    The I/O unit, terminal strip, and relay PCB can be seen in the MTB-designed electrical
    cabinet of the machine. On the I/O unit, four 50-pin connectors (CB104, CB105,
    CB106, and CB107) are present for receiving/sending input/output signals. These
    are connected to the terminal strip through four ribbon (flat) cables. Every pin
    of these connectors is used for some specific input/output signal, as given in
    Tables 12.1 and 12.2. Input wires from switches/sensors are directly connected
    to the terminal strip, but output devices are driven through relays, as these
    may require high current and/or AC supply.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/1341ce50369ce8fcfb8dc3539d51c52f_256_0.png)


    **FIGURE 12.4**  Input wiring for sink-type DI signals.


    Typically, 96 inputs (plus 24 inputs for *manual pulse generators* and eight for
    DO-alarm detection) and 64 outputs are available. On 0i control, X0 to X11 (each
    consisting of eight bits, e.g., X0000.0 through X0000.7) are used for 96 DI signals,
    X12 is used for MPG, X13 and X14 (eight signals each) for additional MPGs (if
    any), and X15 (eight signals) for DO-alarm detection (e.g., overcurrent or abnormal
    temperature inside DO driver, caused by overload due to reasons such as accidental
    grounding of power cable). Y0 to Y7 (each consisting of eight signals, e.g., Y0000.0
    through Y0000.7) are used for DO signals.


    The 96 inputs and all 64 outputs can be used for any purpose. However, if the
    machine has Fanuc MOP, X4 to X11 are connected to various keys of MOP. Thus, only
    X0 to X3 (32 signals) are general-purpose DI signals, some of which might be used
    by the MTB, and'
