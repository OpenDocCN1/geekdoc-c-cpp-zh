- pgno: 16
  md: '# CHAPTER 1


    # Introduction


    Numerical control is an application of digital technology to control a machine
    tool by actuating various drive motors, relays, etc. by a series of coded instructions,
    called *part programs*. These machines were initially called *numerically controlled
    (NC)* machines. NC technology was made commercially available in mid-1950s. Later,
    as the technology advanced, a computer was made an integral part of the machine,
    and most of the functions of the machine were controlled through software rather
    than dedicated hardware for each function. Such machines were called *computer
    numerical control (CNC)* machines. NC machines are not manufactured anymore, though
    we still use this term for referring to this technology.


    Due to excellent accuracy, repeatability, and several other unparalleled and exotic
    features, the CNC machines have now virtually completely replaced the manual machines
    in the manufacturing industry. Even small manufacturing units are now using CNC
    machines, because these prove to be cheaper in the long run. In fact, “why CNC?”
    is not at all a topic of discussion these days.


    However, as with any other computer application, it is imperative to develop good
    and efficient programs to exploit the full potential of CNC machines. Unfortunately,
    there is a lack of adequately trained manpower in this area. The main reason is
    that the age-old curriculum of engineering colleges/polytechnics does not deal
    with CNC programming in detail. Moreover, if you are a practicing engineer, you
    may have realized that the few people in industry who indeed have good programming
    knowledge are not too willing to share their knowledge and experience with others,
    for obvious reasons! And, learning on one’s own is not really so easy, particularly
    if the subject is complex and the information is available in a scattered manner.


    To cater to this need, a number of commercial CNC training schools have come up
    recently. However, most of these provide only basic CNC training. Advanced CNC
    training is provided by very few training schools in the whole world. Even the
    relevant books, presented in a self-contained textbook style, are not available.
    And, manuals/handbooks are mainly useful for reference only, when one wants to
    see a detailed description of some specific feature. This makes learning by self-study
    difficult, especially for a newcomer who'
  merge: -1
  img_proc: true
- pgno: 17
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 18
  md: 'not allow the use of variables, mathematical operations, functions, logical
    statements, loops, and the like in a program. In other words, it does not have
    even the basic features of a typical computer language such as PASCAL. It is just
    a rigid type program for a particular requirement. This obviously limits the scope
    of programs to a great extent. It is not possible to write an “intelligent” part
    program with built-in logic for different requirements. In fact, as we will see
    later, there are a number of applications where conventional part programming
    cannot be used. It only serves the limited purpose for which it was designed.


    # Conversational Part Programming


    Even conventional part programming is fairly complex. So, for the purpose of simplifying
    programming for certain common applications, *conversational* or *lead-through
    programming* (referred to as *blue print programming* or *direct dimension programming*)
    was introduced, which enables users to even without having adequate programming
    experience, easily develop suitable part programs. The programmer need not know
    the part programming language in detail; he only has to know what is to be done
    in what sequence, and with what cutting parameters. The control prompts him for
    all the required information, in an interactive manner. This method of programming,
    however, suffers from the inherent limitation of being applicable only to certain
    specific geometries. So, even though it is possible to quickly write efficient
    programs for some common applications, this method is useless for special requirements.
    In reality, conversational programming is only a small subset of what can be done
    with conventional part programming technique. In fact, conversational programming
    is not meant for qualified engineers.


    # Part Programming Using CAM Software


    As long as only two axes of a machine are required to be simultaneously controlled
    (including helical interpolation), which is usually the case in most of the practical
    applications, it is possible to write suitable part programs manually, unless
    the geometry is nonstandard, for example, involving a parabolic segment. For nonstandard
    and/or three-dimensional geometries, such as die machining, manual development
    of part programs might become too tedious or even impossible in certain cases.
    Several CAM softwares have been developed, which generate the required toolpath
    for the desired machining, and automatically prepare a part program to suit the
    selected control version. However, the basic purpose of CAM software is to calculate
    what cannot be calculated manually (e.g., the toolpath for a 5-axis machining
    where it is desirable to always keep the axis of the tool perpendicular to the
    surface it is machining). So, even though it can generate a complex toolpath,
    and give certain machining-related'
  merge: -1
  img_proc: true
- pgno: 19
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 20
  md: 'this. In today’s world of cut-throat competition, one cannot really afford
    to be totally ignorant of such a powerful feature of CNC machines. Given the enhancements
    that this kind of programming brings, it is surprising that most of the *machine
    tool builders* (MTB), control manufacturers, and even commercial training schools
    do not say much about it.


    The major application areas of macro programming are discussed in the following
    sections.


    # Complex Motions


    Most CNC controls provide only linear and circular motions. As a result, it is
    not possible, for example, to do a parabolic turning on a lathe or to cut an elliptical
    groove on a milling machine. For such applications, one has to take help of some
    external computer programming language for generating the toolpath, a chain of
    very small straight line segments, joined sequentially by linear interpolation
    (G01). The other way would be to use CAM software. However, macro programming,
    which has all the relevant features of a high-level computer programming language,
    enables us to easily generate any type of complex motion for which mathematical
    equations are available. It also obviates the problem of loading into the CNC’s
    RAM, the extremely large file generated by the external computer program or the
    CAM software, which sometimes makes macro programming a much better option. While
    macro programming cannot completely replace CAM software, it can certainly do
    many things that may not be possible without the use of CAM software.


    # Families of Parts


    Almost all companies have some applications that fit into this category. Part
    programming time can be reduced by developing *parametric programs for families
    of parts*. An example is bolt-hole drilling on a flange. While all the flanges
    may belong to the same family by virtue of similarity in design and production
    method, they may all be actually different. For example, the number of holes,
    the depth of holes (i.e., the thickness of the flange), and the diameter of the
    pitch circle may be different in different flanges. Even the workpiece materials
    may be different, requiring different feedrates and rpms. These differences may
    also necessitate the use of different machining cycles (G81, G82, etc.) in different
    flanges.


    This means that even though the machining methods for all the flanges are essentially
    the same, all the programs would be somewhat different. However, a single program,
    using the macro programming features, would do the job. We only have to identify
    the varying entities and write a program with these entities as variables, defined
    in the beginning of the program. It is also possible to define a subroutine,'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'with the variable quantities as the *arguments*. For a particular flange, the
    *main program* (i.e., the program at the top-most level in nested programs) can
    simply call the subroutine, with the desired values for its arguments. The subroutine
    would be executed with the specified values for the variable quantities. The programming
    methodology is very similar to that in any high-level computer language. The major
    difference lies in the way the variables are designated.


    Note that a subroutine called without an argument list is called a *subprogram*,
    whereas if it is called with an argument list, it is called a *macro program*
    (or, simply a *macro*). A built-in macro, which is made available on the machine
    by the machine tool builder, is called a *machine macro*, and a user-defined macro
    is referred to as a *custom macro*. Subprograms are called as M98 (which does
    not permit an argument list), whereas macros are called by G65 or G66 (which permit
    an argument list). Note that G65/G66 need not necessarily have an argument list
    (though this is a rare possibility). A macro is designed to be called with an
    argument list. A subprogram, on the other hand, is designed to be called without
    an argument list. The same program behaves like a subprogram if it is called by
    M98, whereas it behaves like a macro if called by G65 or G66 (with or without
    an argument list). The difference between a subprogram and a macro is explained
    in detail in Chaps. 6 and 7.


    Using a macro for a family of parts is often referred to as *parametric programming*;
    the arguments of the macro are the *parameters* that define the specific function
    of the macro. Here, the term “parameter” is used in the mathematical sense. It
    is not even remotely related to *control parameters*, which define the default
    settings of the machine. Control parameters are also referred to as system parameters,
    CNC/PMC parameters, machine parameters, or, simply, parameters.


    It is also possible to define a new G-code (say, G100) or a new M-code (say, M100),
    corresponding to a macro. Then, such a macro can also be called by the defined
    G- or M-codes. In fact, the new codes become available to all the programs on
    that particular machine, and all the programmers can use them. This simplifies
    programming as the programmers need not even know how to call a macro; they only
    need to know how to use the new codes that become similar to the ordinary G-codes/M-codes.
    Of course, an expert programmer has to develop the new codes initially.


    # Custom Canned Cycles


    CNC machines are equipped with a large number of *canned cycles* for different
    machining operations, which simplify programming to a great extent. For example,
    if one has to generate G71 (multiple turning cycle) to perform external roughing
    G00 and G01, it would be prohibitively complex and lengthy because of enormous
    number of mathematical calculations involved. The same exercise would have'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'to be repeated for every job with a different geometry. But, G71 is just a
    two-line code, for all geometries.


    However, a situation may arise when no predefined canned cycle would be quite
    suitable for a particular application. For example, if a very deep hole is to
    be drilled, it may be desirable to progressively reduce the peck length in subsequent
    pecks, to allow the chips to come out of the hole easily, especially when the
    tool is deep inside the hole. Such a canned cycle is not available on any CNC
    machine. All the peck-drilling cycles use uniform peck length throughout the depth
    of the hole (except the last peck, which is adjusted to suit the hole depth).
    However, using the macro programming technique, it is possible to write a program
    with varying peck length (as per user-defined logic), and as mentioned earlier,
    it is also possible to define a new G-code for such a program, which can, then,
    be very conveniently used the way a built-in canned cycle is used. Development
    of new canned cycles customizes CNC machines, as per individual needs.


    # **“Intelligent” Programs**


    Macro programming allows the use of conditional statements (IF–THEN,) to be used
    with conditional operators (equal to, not equal to, less than, less than or equal
    to, greater than, and greater than or equal to), logical operators (AND, OR, and
    XOR), conditional and unconditional branching (IF_GOTO and GOTO) and loops (WHILE_DO–END),
    apart from the usual mathematical and trigonometric functions. This enables the
    programmer to write an “intelligent” program that will automatically make certain
    decisions based on certain input conditions. For example, if the specified depth
    of cut is too large, the machine can be programmed to automatically select a roughing
    tool. Similarly, appropriate drilling cycle can be automatically selected by the
    machine depending on the hole parameters. The possibilities are unlimited. Practically
    any logic that you can think of can be incorporated in a macro program, and then
    you do not have to worry about a “what-if” situation. The machine knows what it
    should do in specific situations.


    It is also possible to insert error traps in a program. Under certain specified
    conditions, the machine will automatically pause or abort the execution of a program
    and display the programmed error message. After the remedial action is taken by
    the operator, the paused program can be resumed from that point by pressing the
    CYCLE START button again. All this makes the program quite flexible, which improves
    machining quality as well as productivity—an important step toward flexible automation.


    # **Probing**


    Probing on a CNC machine has several advantages, because the inspection results
    are immediately available, at a small fraction of the'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'cost of having a separate CMM facility. There is, however, a general perception
    that since the machine is very accurate, there is no need to measure the obtained
    dimensions. This is too optimistic a view. The tool may wear out to an unacceptable
    extent, or it may even break. If the critical dimensions are not checked at least
    occasionally, a large batch of defective parts might be produced before realizing
    the problem.


    The scope of probing is not limited to just measuring certain dimensions of a
    part or inspecting the tools for the purpose of quality control. It is also possible
    to drastically reduce the setup time by automating the tool offset setting procedure.
    This is extremely useful if the initial sizes of different workpieces are not
    exactly same, which then requires that the offset setting procedure be repeated
    for every new workpiece.


    Probing also obviates the need for extremely accurate fixtures, which are expensive.
    Any inaccuracy in clamping the workpiece can be measured by the probe, and the
    corrective logic may be given in the program. In the course of machining, the
    machine may be programmed to automatically make certain decisions based on probing
    results. All this leads to better quality and increased productivity at a lower
    cost. However, probing would not be possible unless the machine has macro programming
    capability.


    # Machine Status Information/Manipulation


    Many a time it is desirable to know the control conditions of a machine, such
    as offset distances, the current position of the tool, the current spindle speed
    / feedrate / tool number, the active modal codes of the various groups of G-codes
    (e.g., whether G90 or G91 of Group 3 is active on a machining centre. Recall that
    in every group of G-codes, except those belonging to Group 0 which are nonmodal
    codes, one code remains active until it is replaced by another code from the same
    group.) The number of parts produced, the current date / time, the incremental
    time of machine operation, etc. Such data are made available through a number
    of system variables (described in detail in Chap. 3), which can be used in a program,
    for making certain decisions. It is also possible to take the printout of such
    data on a printer connected to the machine. Some of these variables, such as the
    variable for storing the current tool position, are read-only types that cannot
    be modified. Other variables, such as those for offset distances, can be modified
    through the program, to alter the machine behavior. Such a communication with
    the machine, to know or alter its control status, is possible only through the
    macro programming feature.


    # Communication with External Devices


    A programmable logic controller (PLC) is an integrated part of the CNC (control)
    hardware. Generally speaking, the CNC controls the motion of the tool, whereas
    the PLC controls other machine functions. The PLC can be programmed to control
    various automatic systems of'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'the machine, as per our requirements. Most controls use the familiar *ladder
    diagram* for programming the PLC.


    This PLC can also be used to accept input signal or pass on output signal from/to
    some external device, using macro programming features. This allows two-way communication
    between the machine and the outside world. For example, a sensor can be used to
    find out whether or not a pallet is loaded (input signal). The machining cycle
    would not start unless the pallet is loaded. And, if the pallet is not loaded,
    an external lamp would be flashed (output signal). Finally, when a machining cycle
    is complete, the part count would be incremented by one and displayed on an external
    display board. And, when the part count becomes equal to a predefined number,
    the machine would stop, and an external buzzer would be sounded. Such a sequence
    of operation would be useful in case of an unattended, automatic loading/unloading
    on the machine. Similarly, there are several other useful and innovative applications
    of automation in the production process, which would result in higher productivity
    and better quality.


    The macro programming feature virtually puts “life” in a CNC machine and you can
    make it respond in the manner you want, in some specific situation. What the machine
    can be made to do is limited only by the ingenuity of the programmer. Practically,
    any logic, that one can think of, can be implemented on it. Another issue is that
    not many people are aware of such features of modern CNC machines. Today, using
    a CNC machine only for conventional machining applications is like using a 64-bit
    processor, 2-GB RAM computer only for word processing!


    # 1.3 Does My Machine Have Macro Capability?


    This is the most pertinent question at this stage, because unless the machine
    on which one works has macro capability, there is no point in learning macro programming.
    Although macro programming has now become a standard feature on most controls,
    it is still an optional feature on some. So, if a new machine is to be purchased,
    this feature must be mentioned in the specifications. On an existing machine,
    execute some macro statement to test whether the machine has this option enabled,
    in the following manner:


    +   - Set proper conditions for machining (hydraulic pump ON, feed drives enabled,
    spindle rotation enabled, tailstock extended, chuck closed, and door closed).

    +   - Select *manual data input* (MDI) mode, using the selector switch on the
    machine operator''s panel (MOP).

    +   - Press the PROG function key on the MDI panel. If a blank program screen
    does not appear, press PROG again. The blank screen displays.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'OOOOO

    §


    +   - Type #1 = 1 (or any other “harmless” macro statement, so as not to cause
    any unexpected machine behavior), followed by the *end of block* (EOB) character
    (which is a semicolon), and then press the INPUT key, on the MDI panel.


    +   - Press the CYCLE START button on the MOP.


    This will assign a value of 1 to the macro variable number 1. If no error message,
    the machine has macro programming capability with full functionality (the control
    manufacturers do not enable this feature with partial functionality; it will either
    be available or not available). To doubly sure, check the value of the defined
    macro variable on the offset/setting screen.


    +   - Press the OFS/SET function key on the MDI panel.


    +   - Press the right extension key (▶) below the display screen, if the MACRO
    soft key does not appear. Now press the MACRO soft key.


    This will show, on a *roll-over* screen (i.e., the first line reappears after
    the last line, in forward scrolling), the values stored in all the macro variables
    (001 to 033, 100 to 199, and 500 to 999, typically), which can be viewed using
    the up/down arrow keys and the page up/page down keys on the MDI panel. The value
    stored in variable number 001 (which is the same as variable number 1) would be
    displayed as 00001.000 (values are stored using eight digits, with blank fields
    for the remaining variables (a blank field indicates an undefined variable), except
    perhaps those in the 500 to 999 range, which retain the previously stored values
    even after power OFF. These variables, which are called *permanent common variables*,
    can, however, be re-defined. Pressing the RESET key will clear all the variables
    except the permanent common variables. A parameter setting, however, can retain
    the values of all the variables, even after RESET operation. Different types of
    variables are described in detail in Chap. 3.


    If the machine does not have the macro feature, it will not recognize the macro
    statement, and will give an error message. In such a case, the company whose control
    is installed on the machine (such as Fanuc, Siemens, Heidenhain, etc.) has to
    be contacted. They will enable this option on the machine for a charge. It is
    interesting to note that the electronic hardware of a particular control version
    is the same for all the machines on which the standard features always remain
    available. But the control manufacturers enable (through software coding) only
    those optional features for which they receive additional payment. So, do not
    worry if your machine is not macro-enabled, just be willing to pay for it. However,
    nonstandard controls usually do not have macro capability.'
