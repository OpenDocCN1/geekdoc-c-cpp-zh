- pgno: 166
  md: "It is dangerous to change the tool unless the turret is at the home position,\
    \ because of a possible interference between the rotating tools and the chuck\
    \ / workpiece / tailstock. Therefore, G28 U0 W0 command must be given before issuing\
    \ a tool change command. If a programmer forgets to do this, it may cause an accident\
    \ on the machine. It is, however, possible to redefine the tool change command,\
    \ to send the turret to the home position automatically, before changing the tool.\
    \ First set parameter 6001#5 to 1, and then define O9000 in the given manner.\
    \ Then, T0707 (say) in the calling program will bring tool number 7 to the cutting\
    \ position, choosing offset number 7, after sending the turret to the home position.\n\
    \n```\n```\nO9000;            (The permitted program number for calling a subpro-\n\
    \                  gram, using a T-code)\nG28 U0 W0 ;       (Home position return)\n\
    T#149;            (This is the usual tool change command, with offset num-\n \
    \                 ber #149 stores the number used with the T-code in the\n   \
    \               calling program. So, the specified T-code is executed here\n \
    \                 with the usual tool change function)\nM99;              (Return\
    \ to the calling program)\n```\n```\n\nBy now, it should be clear that the purpose\
    \ of redefining the existing G-codes, M-codes, and T-codes is to incorporate extended\
    \ functions into them. This feature should never be used to change the basic meaning\
    \ of any code. Always use an unused number for defining codes with new functions.\n\
    \nAs another example, one may try to redefine G01, such that if the specified\
    \ feedrate is more than 100 mm/min for tool number 7, the feedrate used in linear\
    \ interpolation would be 100 mm/min only. (This is an arbitrary requirement, for\
    \ the sake of illustration only.) Such a macro, however, cannot be written unless\
    \ one fully knows the methods of argument specification. Therefore, this example\
    \ will be taken up in the next section, with the additional purpose of explaining\
    \ the use of argument specification.\n\n# ## 7.5 Argument Specification\n\nIn\
    \ a macro call, certain letter addresses can be used for passing on the desired\
    \ initial values to the local variables of the called macro. This is called argument\
    \ specification. Two methods of argument specification are available:\n\n+   -\
    \ Argument specification I, which uses all the letters of the alphabet, except\
    \ L, O, N, G, and P, once each.\n+   - Argument specification II, which uses A,\
    \ B, and C once each, and also uses I, J, and K up to 10 times each."
