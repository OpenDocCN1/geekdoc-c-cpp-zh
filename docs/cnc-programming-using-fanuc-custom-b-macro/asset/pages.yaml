- pgno: 207
  md: 'This macro, to obtain the shape of Fig. 8.6, can be called in a manner such
    as


    ```

    ...

    G98 G00 X100 Z0;

    G65 P8019 D30 W65 A3 C0.1 R0.5 F60;

    ...

    ```


    The shank of a right-hand turning tool is likely to interfere with the geometry
    of this part, unless the tip angle is very small (say, 35°), and the amplitude
    to the length ratio of the sine curve is also small. This necessitates the use
    of a neutral tool. If a diamond-shaped insert is used in a neutral shank, the
    square edge at the left end of the sine curve cannot be obtained by this method.
    (There would be overcutting at half the tip angle on the left side.) One cannot
    use a round insert, because it has to be used with radius compensation (since
    the point on the tool that cuts the material continuously changes its position),
    and radius compensation cannot be used inside G71-G73 cycles (which is a limitation
    of these cycles).'
