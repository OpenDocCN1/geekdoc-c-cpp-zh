    tend to become too complex to understand. The objective of nesting is to simplify
    programming, not to complicate it!


    Though nesting and use of macro-programming features in subprograms make a program
    quite general and compact, the real power comes through macros that have virtually
    unlimited scope. Of course, a thorough understanding of subprograms is absolutely
