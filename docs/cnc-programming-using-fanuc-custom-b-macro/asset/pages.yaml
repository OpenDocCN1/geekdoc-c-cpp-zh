  md: '| Parameters of the Parabola | Selected Letter Addresses | Associated Variables
    |

    |---|---|---|

    | Maximum diameter | M | #13 |

    | Bore diameter | B | #2 |

    | Depth of parabola | D | #7 |

    | Step distance in Z | Q | #17 |

    | Roughing depth of cut | R | #18 |

    | Feedrate | F | #9 |


    # TABLE 8.3  Parameters of Parabolic Turning and the Selected Letter Addresses


    Thus, an additional tangential move, using the given formula, is desirable before
    returning to the calling program.


    Program number 8018 is based on this algorithm, using the local variables given
    in Table 8.3. The toolpath for this program is shown in Fig. 8.5. For the geometry
    given in Fig. 8.4, this program would need to be called in a manner such as


    ```

    G00 X0 Z2;

    G65 P8018 M80 B10 D20 Q0.1 R0.5 F60;

    ```


    The initial positioning of the tool at (X0, Z2) avoids a possible interference
    between the tool and the workpiece or the machine body, when the tool makes the
    first move inside the macro. Roughing is done at the current rpm and the specified
    feedrate, whereas finishing is done at twice the current rpm and half the specified
    feedrate. This gives a better surface finish.


    ```

    O8018 (PARABOLIC TURNING WITH G94);

    #105 = #5041;          (Stores the initial X-position of the tool)

    #106 = #5042;          (Stores the initial Z-position of the tool)


    G00 X[#2 - 2] Z0;     (Tool placed at the start point of the first G94 cycle,
    leaving a clearance of 1 mm in the radial direction. Step 1 complete)


    #100 = ABS[#17];       (ABS function would accept both positive and negative values
    for step distance in Z)

    #101 = - #18;          (The first step change in Z. Step 2 complete)


    WHILE [ABS[#101] LE ABS[#17]] DO 1;    (Exit from the loop if the entire depth
    is roughed out. Step 3 complete)

    ```'
