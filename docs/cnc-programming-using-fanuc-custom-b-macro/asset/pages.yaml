- pgno: 162
  md: '```

    O9010;    (The program number corresponding to parameter number 6050, as per Table
    7.1)

    G04 X10;   (Causes a dwell of 10 seconds)

    M99;       (Return to the calling program)

    ```


    Now, in any program, wherever G100 is commanded, it would result in a dwell of
    10 seconds. And, for a dwell of, say, 50 seconds, G500 L5 would need to be programmed.
    G65 P9010 and G65 P9010 L5 also would do the same thing, causing delays of 10
    and 50 seconds, respectively. Basically, G65 P_ is being replaced by a G-code,
    for convenience. Extremely complex macros also can be used for defining new G-codes.
    Such an example is not given here, as the idea was to explain only the methodology.


    Apart from this method of calling a program, a program can also be called with
    M-codes and T-codes, as discussed in the next section. In a program, which is
    called by any of these methods, all G-codes are treated as ordinary G-codes, with
    their original meanings. In other words, a G-code in such programs would not call
    a program, even if it is designed to call a program. It would be executed in the
    usual manner. This issue is discussed in more detail later.


    # Call with User-Defined M-Code


    The way a macro can be called by a G-code, it can also be called by an M-code,
    exactly in the same manner. This method of macro call defines a new M-code, or
    redefines an existing M-code, if the number of a predefined M-code is chosen.
    Therefore, only an unused number should be selected.


    Any number between 1 and 99,999,999 can be used, which would need to be stored
    in any of the parameters between 6080 and 6089. Up to 10 M-codes can be defined.
    These call program numbers between O9020 and O9029. The correspondence between
    the parameter numbers and the program numbers is given in Table 7.2. As an example,
    if M1000 is desired to be defined, 1000 would need to be stored in, say, parameter
    6080 that would make M1000 call the macro O9020. And, if O9020 does not exist,
    a program would be generated, with the message “NUMBER NOT FOUND.” It is possible
    to specify up to 9999 repetitions of the called macro, using the L-word. As in
    case of a G-code macro call, the method of specifying the arguments in the M1000
    (or in any other user-defined M-code) block, for passing on the desired values
    to the local variables of the called macro, is the same as that used in a G65/G66
    macro call.


    There is a restriction that the M-code macro call, along with all the arguments,
    be used only in its block otherwise, it would either be an illegal command, or
    it may ignore the other codes. Moreover, as in case of macro call using G-codes,
    this method of macro call cannot be used in programs called by G-codes, M-codes,
    or T-codes. In such programs, all M-codes possess their usual meanings; no macros
    are called.'
