    ...

    ...

    END 1;

    ```

    ```


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_111_0.png)


    The DO_END ranges cannot overlap in nesting, as it makes the statement illogical
    and meaningless:


    ```

    ```text

    WHILE [<condition 1>] DO 1;

    ...

    ...

    WHILE [<condition 2>] DO 2;

    ...

    ...

    END 1;

    ...

    END 2;

    ```

    ```


    ![](img/1341ce50369ce8fcfb8dc3539d51c52f_111_1.png)


    It is permitted to use any macro or NC statement, including IF_THEN_IF_GOTO and
    GOTO_, and inside a loop (i.e., inside the DO_END_range):


    ```

    ```text

    WHILE [<condition 1>] DO 1;

    ...

    ...

    ```

    ```'
