- pgno: 94
  md: '# CHAPTER 5


    # Branches and Loops


    In a program, the sequence of execution can be changed using GOTO and IF_GOTO
    statements, which is called branching. These statements can also be used to create
    a loop, and execute it repeatedly until a certain condition gets satisfied. This,
    however, is not considered a good method of creating loops. It is a standard practice
    to avoid the use of GOTO in any structured programming language (such as Pascal),
    as it makes the program less readable. Moreover, it also introduces element of
    risk, as a subsequent change in the sequence numbers might make the program unusable.
    Better methods are available. Custom Macro B provides the WHILE statement for
    this purpose.


    # 5.1  Unconditional Branching


    The format is


    ```

    ```text

    GOTO n;

    ```

    ```


    where n is the desired sequence number (1 to 99999).


    This causes an unconditional jump to the specified sequence number (recall that
    sequence number is also referred to as block number or line number or N-number).
    The sequence number in the GOTO statement can also be specified using a variable
    or an expression.


    If the specified sequence number does not lie in the range 1 to 99999, or if the
    program does not contain the specified sequence number, further execution of the
    program terminates with an alarm.


    It is not necessary to have sequence numbers for all the blocks of the program;
    only the target blocks must have sequence numbers.


    Duplication of sequence numbers is permitted in a part program, though not recommended,
    as it might cause inadvertent errors. With the GOTO statement, it would result
    in an ambiguous branching instruction, generating an error condition. So, for
    the sake of good programming practice, the same sequence number must not appear
    more than once in a part program, especially when the program uses macro programming
    features.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Some examples of unconditional jump are given below:


    | Statement | Description |

    |---|---|

    | `GOTO 100;` | Flow of program execution jumps to N100 block. If such a sequence
    number does not exist in the program, further execution would be terminated, and
    an alarm message would be displayed at the screen. |

    | `#1 = 1000;` |  |

    | `GOTO #1;` | Jumps to N1000 block |

    | `GOTO [#1 + 100];` | Jumps to N1100 block |

    | `GOTO 0;` | Illegal command |

    | `GOTO 100000;` | Illegal command |


    The argument of GOTO is expected to be an integer. However, if a real number is
    specified, or if the variable or the expression, used as the argument, evaluates
    to a real number, rounding is automatically done to the nearest integer:


    | Statement | Description |

    |---|---|

    | `GOTO 100.0;` | Equivalent to GOTO 100 |

    | `GOTO 100.49999;` | Equivalent to GOTO 100. More than eight digits, such as
    100.4999990, is not allowed |

    | `GOTO 100.5;` | Equivalent to GOTO 101 |

    | `#1 = 100.49999;` |  |

    | `GOTO #1;` | Jumps to N100 block |

    | `GOTO [#1 + .00001];` | Jumps to N101 block |


    Though such a use of GOTO is only a theoretical possibility, and never likely
    to occur in a practical situation, a thorough understanding of the logic being
    followed by the control helps in error diagnosis. At least, typing mistakes are
    always possible, which might give unexpected results, without generating any error
    message.


    # 5.2 Conditional Branching


    In conditional branching, GOTO is used in conjunction with a conditional expression.
    The format is


    ```

    IF [<a conditional expression>] GOTO n;

    ```


    If the specified condition is satisfied (i.e., evaluates to TRUE), the program
    execution jumps to sequence number n. If the specified condition is not satisfied
    (i.e., evaluates to FALSE), execution proceeds to the next block. The conditional
    expression must be enclosed within square brackets.


    The six available conditional operators, which can be used in a conditional expression,
    carry the meanings given in Table 5.1 (these operators have already been used
    in various contexts; here they are described formally). Note that the equivalent
    mathematical symbols, shown in this table, are given for reference only. These
    cannot be used as conditional operators.'
