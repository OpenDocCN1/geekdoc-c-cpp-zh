- pgno: 192
  md: 'There are two limitations of the built-in helical interpolation, described
    above:


    +   - The radius/pitch of the helix cannot be varied.

    +   - The feedrate along the actual toolpath is more than the specified feedrate.


    We will now develop a macro, to do away with these limitations. However, for the
    sake of simplicity, the travel along the linear axis would be assumed to be occurring
    at a uniform rate, synchronized with angular displacement. In other words, the
    pitch would be assumed constant, as in the case of the built-in helical interpolation.
    The radius would, of course, vary but the change in radius would be assumed to
    be at a uniform rate, with respect to angular displacement. Thus, the helix would
    be formed on the lateral surface of a right-angle cone.


    A macro with this feature can be used for thread milling of taper pipe threads,
    with a modification to introduce pitch instead of number of loops. This is left
    as an exercise for the readers. However, it is possible to use the given macro
    even without any modification—one only has to calculate and then specify the number
    of turns (which can be in fraction also) by dividing the total depth (Z-travel)
    by pitch.


    Consider a helix with a constant pitch and uniformly varying radius, having the
    following characteristics:


    | Characteristic | Value |

    |---|---|

    | Number of loops (turns) | = T |

    | Start radius | = R_i |

    | End radius | = R_e |

    | Total depth | = d |

    | Plane of circular interpolation | = XY-plane |

    | Linear axis | = Z-axis |

    | XY-coordinates of helix axis | = (X_0, Y_0) |

    | Coordinates of the start point | = (X_i, Y_i, Z_i) |

    | Start angle, with positive X-axis | = θ_i |

    | Direction of toolpath | = CCW |


    The top view of such a helical toolpath is shown in Fig. 8.3, where four complete
    turns are shown, and the end radius is smaller than the start radius (though it
    does not affect the mathematical equation of the helix).


    To have conformity with the way the built-in helical interpolation is used, the
    macro would be designed in such a manner that the start point of the helix would
    be at the current tool position, and the tool will remain at the end point of
    the helix in the end. In other words, the tool position at the time of calling
    the macro would automatically become the start point of the helix. This means
    that the center line (axis) of the'
