    # 13.5  Data Input for Compensation Values on a Lathe


    Geometry as well as wear values for radial/axial distances, nose radius, and tip
    number can be specified. A difference from the previously described formats is
    that no L-word is used for entering compensation values on a lathe. The format
    is


    ```

    G10 P_ X_ Y_ Z_ R_ Q_;    (Absolute mode)

    G10 P_ U_ V_ W_ C_ Q_;    (Incremental mode)

    ```


    where


    +   - P0 refers to work-shift values,

    +   - P1 through P64 refer to wear compensation values corresponding to offset
    numbers 1 through 64 (assuming availability of 64 offset numbers),

    +   - P1001 through P10064 refer to geometry compensation values corresponding
    to offset numbers 1 through 64,

    +   - X/U, Y/V (if the Y-axis is available) and Z/W contain the desired values
    for the respective axes in absolute/incremental mode,'
