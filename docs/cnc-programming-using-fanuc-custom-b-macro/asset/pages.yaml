    make it better! So, as a rule of thumb, always start with a small and easily achievable
    target.


    Coming back to the nesting issue, the reader must have realized by now that there
    had been a pattern of holes instead of single hole at each location, the third
    level of nesting would have been required to make the hole-pattern at each location.
    Such an example is shown in Fig. 5.15. However, three levels of nesting make the
    logic too complex to understand easily. So, not more than two levels should be
    used, unless it is absolutely necessary. This would practically always be possible,
    though the program would not be as compact and general as with three levels of
    nesting. For example, it is possible to use just one level of nesting (actually,
    one level of nesting implies that there is no nesting at all) for the job of Fig.
    5.15. Just write a macro for the polar pattern (which will require a single level
    of WHILE statement, without any nesting), and call it 12 times after placing the
    tool at the centers of all the polar patterns one by one. Such a program will,
