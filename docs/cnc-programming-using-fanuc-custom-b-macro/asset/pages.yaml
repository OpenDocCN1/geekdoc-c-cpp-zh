- pgno: 55
  md: 'and 16 output signals are available. The current status of these signals is
    available inside a program through certain system variables, as already explained
    by some examples.


    Two types of system variables are available: for 16 single-bit signals and for
    one 16-bit signal (for both input and output signals). The examples given pertain
    to system variables for single-bit signals which can only be 0 or 1. The variables
    for 16-bit signals are used to read/write all the 16 signals simultaneously by
    a single program statement. For example, if the first and the second signals (i.e.,
    F54.0 and F54.1) are 1 and the rest are 0 then the corresponding 16-bit signal
    would be 0000000000000011 (the decimal interpretation of which is 3). So, #1100
    = 1101 = 1; is the same as #1132 = 3; except that the two outputs are triggered
    simultaneously in the second case. It is a matter of individual choice/requirement
    whether the signals are read/written by the program one by one or simultaneously.
    The complete variable list is given below. (32-bit signals are also available.
    They are not described here because they are rarely used.)


    # System Variables for Input Interface Signals


    | Variables | Description |

    |---|---|

    | `#1000` to `#1015`, `#1032` | `#1000` to `#1015` are single-bit signals. `#1032`
    is a 16-bit signal, whose individual bits (starting from the right) correspond
    to `#1000` to `#1015`. These are read-only variables. |


    # System Variables for Output Interface Signals


    | Variables | Description |

    |---|---|

    | `#1100` to `#1115`, `#1132` | `#1100` to `#1115` are single-bit signals. `#1132`
    is a 16-bit signal, whose individual bits (starting from the right) correspond
    to `#1100` to `#1115`. These are read/write variables. |


    The decimal values of #1032 and #1132 (all other variables either 0 or 1) would
    be given by the following equations:


    $$#1032 = \sum_{i=0}^{15} [#1000+i] \times 2^i$$


    $$#1132 = \sum_{i=0}^{15} [#1100+i] \times 2^i$$


    where the individual terms on the right-hand side would be either 0 or 2ⁱ, depending
    on whether the corresponding signal is 0 or 1. The correspondence between these
