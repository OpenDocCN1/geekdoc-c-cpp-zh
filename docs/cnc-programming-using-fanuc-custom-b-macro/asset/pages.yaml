  md: 'The type of argument specification is determined automatically according to
    the letters used.


    # Argument Specification I


    This type of argument specification can define variables #1 through #26, except
    #10, #12, #14, #15, and #16. Variables #27 through #33 cannot be defined. The
    correspondence between the letter addresses and the variable numbers is given
    in Table 7.4. The prohibited letter addresses can be easily remembered by the
    phrase "LONG Program."


    As an example of argument specification I, G65 P2000 L2 A10 D20 H30 I40 M50 Q60
    Z70 would call program 08000, as a macro, with its local variables initially set
    as #1 = 10, #7 = 20, #4 = 30, #9 = 40, #13 = 50, #17 = 60, and the remaining local
    variables set to null. The word L2 would cause two successive executions of the
    macro, before returning to the calling program. However, as already discussed
    in Sec. 7.3, in the second execution (as well as in all the subsequent executions,
    if the L-word has a value greater than 2), the local variables do not use the
    specified values in the G65 block as their initial values. Instead, the updated
    values in the first (previous) execution are used as initial values in the second
    (subsequent) execution.


