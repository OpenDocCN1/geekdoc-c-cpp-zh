    the count argument as 1 in the strings standard package to clone a string. Since
    Go 1.12, the underlying implementation of strings.Repeat will make use of strings.Builder,
    to avoid unnecessary duplicate.


    # Kind-of Memory Leaking Caused by Subslices


    Similarly to substrings, slices may also cause kind-of memory leaking. In the
    following code, after the g function is called, most occupied memory block hosting
    the elements of s1 will be lost (if no more values reference the memory block).


    ```

    1 var s0 []int

    2 func g(s1 []int) int {

    3 // Assume the length of s1 is much larger than 30.

    4 s0 = s1[len(s1)-30:]

    5 }

    ```


    If we want to avoid the kind-of memory leaking, we must duplicate the 30 elements
    for s0, so that the aliveness of s0 will not prevent the memory block hosting
    the elements of s1 from being collected.


    ```

    1 func g(s1 []int) []int {

    2 s0 = append([]int(nil), s1[len(s1)-30:]...)

    3 // Now, the memory block hosting the elements

    4 // s1 can be collected if no other values

    5 // are referencing the memory block.

    6 }

    ```'
