    Note, as any method set is a superset of a blank method set, so any type implements
    any blank interface type. This is an important fact in Go.


    The implicit implementation design makes it possible to let concrete types defined
    in other library packages, as standard packages, passively implement some interface
    types declared in user packages. For example, if we declare an interface type
    like the following one, then the type DB declared in the database/sql standard
    package (https://golang.org/pkg/database/sql/) will implement the interface type
    automatically, for they both have the three corresponding methods specified in
