    # # cgo


    We can call C from Go code, and vice versa, through the cgo mechanism. Please
    follow the

    following links for details.


    +   * cgo official documentation (https://golang.org/cmd/cgo/cgo)

    * C? Go? Cgo! (https://blog.golang.org/c-go-cgo)

    * cgo on Go wiki (https://github.com/golang/go/wiki/cgo)


    It is possible to call C++ libraries through cgo wrapping C++ libraries as C functions.


    Please note that using cgo can make it hard to maintain cross-platform compatibility

    of Go programs, and the calls between Go and C code are some less efficient than
    Go-Go and C-

    calls.


    # # Build Constraints (Tags)


    We can use build constraints (https://golang.org/pkg/go/build/) to let compilers
    build source files

    selectively. A build constraint is called a build tag. A build constraint can
    appear as a comment

    line like // +build constraints or appear as the suffix in the base name of a
    source file.


    # # Compiler Directives


    The standard Go compiler supports compiler directives

    https://golang.org/cmd/compile/hdr-Compiler_Directives). A directive appears as
    a comment

    line like //directive args. The most used compiler directive in practice may be
    the

    go:generate (https://blog.golang.org/generate) directive.


