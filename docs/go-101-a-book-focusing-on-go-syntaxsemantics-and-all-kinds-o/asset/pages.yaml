    with the shallowest depth. Other full-form selectors are shadowed by the one with
    the shallowest depth.

    - if there are more than one full-form selectors with the shallowest depth, then
    none of the full-form selectors can be shortened as X.Y. We say such full-form
    selectors with the shallowest depth are colliding with each other.


