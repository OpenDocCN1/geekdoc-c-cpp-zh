  md: '# Function Declarations and Function Calls


    Except the operator operations introduced in the last article, function operations
    are another kind of popular operations in programming. Function operations are
    often called function calls. This article will introduce how to declare functions
    and call functions.


    # Function Declarations


    Let''s view a function declaration.


    ```

    func SquaresOfSumAndDiff(a int64, b int64) (s int64, d int64) {

    x, y := a + b, a - b

    s = x * x

    d = y * y

    return // <= return s, d

    }

    ```


    We can find that, a function declaration is composed of several portions. From
    left to right,


    +   1. the first portion is the func keyword.

    2. the next portion is the function name, which must be an identifier. Here the
    function name is SquareOfSumAndDiff.

    3. the third portion is the parameter declaration list, which is enclosed in a
    pair of ().

