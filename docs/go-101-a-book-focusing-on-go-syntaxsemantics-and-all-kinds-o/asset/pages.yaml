    # Comma (,) Will Not Be Inserted Automatically


    In syntax forms containing multiple alike items, commas are used as separators,
    as composite lists, argument lists, function lists and return result lists. In
    such a syntax, the last item can always be followed by a comma. If the following
    comma is the last effective character in its respective code line, the comma is
    required, otherwise, it is optional. Compilers will not insert commas for any
    cases.


    For example, the following code snippet is valid.


    ```

    1 func f1(a int, b string) (x bool, y int) {

    2   return 789

    3 }

