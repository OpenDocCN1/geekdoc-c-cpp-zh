    As the comments in above example describe, unlike many other languages, in Go,
    at the end of each branch control block, the execution will automatically break
    out of the corresponding switch-case control block. Now how to let the execution
    slip into the next branch control block? Go provides a fallthrough keyword to
    do this task. For example, in the following example, every branch code will be
    executed, by orders, from top to down.


    ```

