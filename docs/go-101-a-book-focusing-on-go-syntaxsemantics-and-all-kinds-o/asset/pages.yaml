    \ package is low for this specified program).\n\n# Concurrency Synchronization\n\
    \nThe above program is not perfect. The two new goroutines are intended to print\
    \ ten greetings each. However, the main goroutine will exit in two seconds, so\
    \ many greetings have not a chance to get printed. How to let the main goroutine\
    \ know when the two goroutines have finished their tasks? We must use some concurrency\
