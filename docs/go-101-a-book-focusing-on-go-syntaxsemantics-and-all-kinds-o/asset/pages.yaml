  md: '# # When Will Memory Blocks Be Allocated?


    In Go, memory blocks may be allocated but not limited at following situations:


    +   - explicitly call the `new` and `make` built-in functions. the `new` call
    will always allocate exact one memory block. `make` call will allocate more than
    one memory blocks to host the direct and underlying part(s) of created slice,
    map or channel value.

    - create maps, slices and anonymous functions with corresponding literals. More
    than one memory block may be allocated in each of the processes.

    - declare variables.

    - assign non-interface values to interface values (when the non-interface value
    is not a pointer value).

    - concatenate non-constant strings.

    - convert strings to byte or rune slices, and vice versa, except some compiler
    optimization cases ($19).

    - convert integers to strings.

    - call the built-in `append` function (when the capacity of the base slice is
    not large enough).

    - add a new key-element pair into a map (when the underlying hash table needs
    to be resized).


    # # Where Will Memory Blocks Be Allocated?


    For every Go program compiled by the standard Go compiler, at runtime, each goroutine
    will maintain a stack, which is a memory segment. It acts as a pool for some memory
    blocks to be allocated from/. The initial stack size is small (around 2k bytes
    on 64-bit systems). The stack size will grow and shrink as needed during goroutine
    running.


    > (Note, for the standard Go compiler, there is a limit of stack size each goroutine
    can have. For standard Go compiler 1.11, the maximum stack size is 1 GB on 64-bit
    systems, and 250 MB on 32-bit systems. We can call the `SetMaxStack` function
    in the `runtime/debug` standard package to change this.


    Memory blocks can be allocated on stacks. Memory blocks allocated on the stack
    of a goroutine can only be used (referenced) in the goroutine entirely. They are
    goroutine localized resources. They are not safe to be referenced crossing goroutines.
    A goroutine can access or modify the value parts hosted on a memory block allocated
    on the stack of the goroutine without using any data synchronization techniques.


    Heap is a singleton in each program. It is a virtual concept. If a memory block
    is not allocated on any goroutine stack, then we say the memory block is allocated
    on heap. Value parts hosted on memory blocks allocated on heap can be used by
    multiple goroutines. In other words, they can be used currently. Their uses should
    be synchronized when needed.


    Heap is a conservative place to allocate memory blocks on. If collectors detect
    a memory block will be referenced crossing goroutines or can''t confirm whether
    or not the memory block is safe to be put on the stack of a goroutine, the memory
    block will be allocated on heap at run'
