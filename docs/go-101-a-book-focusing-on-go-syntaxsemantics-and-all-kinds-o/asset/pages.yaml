  md: '# 41. Memory Order Guarantees in Go


    The behavior of this program is very possible as we expect, a hello, world text
    will be printed. The behavior of this program is compiler and CPU dependent. If
    the program is compiled with a different compiler, or with a later version, or
    it runs on a different architecture, the hello, world text might not be printed,
    or a text from world might be printed. The reasons are compilers and CPUs may
    change the execution orders of the first two lines in the setup function, so the
    final setup function may become to


    ```

    1 func setup() {

    2 done = true

    3 a = "hello, world"

    4 if done {

    5 log.Println(len(a))

    6 }

    7 }

    ```


    The setup routine in the program is unable to observe the reordering, so the log.Println(len(a))
    line will always print 12 (if this gets executed before the program exits). However,
    the main goroutine may observe the reordering, which is why the printed text might
    not be hello, world.


    Besides the problem of ignoring memory reordering, there are data races in the
    program. There are not any synchronizations in the variable a and done. So, the
    above program is a showcase of concurrent programming mistakes. A professional
    programmer should not make these mistakes.


    We can use the go build -race command provided in Go SDK to build a program, then
    we can run the output executable to check whether or not there are data races
    in the program.


    # Go Memory Model


    Sometimes, we need to ensure that the execution of some code lines in a goroutine
    must happen before (or after) the execution of some code lines in another goroutine
    (from the view of either of the two goroutines), to keep the correctness of a
    program. Instruction reordering may cause some troubles for such circumstances.
    How should we do to prevent certain instruction reordering?


    Different CPU architectures provide different fence instructions to prevent different
    kinds of instruction reordering. Some programming languages provide ranging functions
    to insert these fences the bar. However, understanding and correctly using the
    fence instructions the bar of concurrent programming.


    The design philosophy of Go is to use as few features as possible to support more
    use cases as possible, at the same time to ensure a good enough overall code execution
    efficiency. So Go built-in and standard packages do not provide direct ways to
    use the CPU fence instructions. In'
