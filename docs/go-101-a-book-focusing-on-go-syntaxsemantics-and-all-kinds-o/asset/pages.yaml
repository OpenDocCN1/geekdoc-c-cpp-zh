  md: "# Some function calls are evaluated at compile time\n\nMost function calls\
    \ are evaluated at runtime. But calls to the functions of the unsafe standard\
    \ package are always evaluated at compile time. Calls to other built-in functions,\
    \ such as len and cap, may be evaluated at either compile time or runtime ($46),\
    \ depending on the passed arguments. The results of the function calls evaluated\
    \ at compile time can be assigned to constants.\n\n# All function arguments are\
    \ passed by copy\n\nLet's repeat it again, all value assignments in Go, all function\
    \ arguments are passed by copy in Go. When a value is copied, only its direct\
    \ part is copied ($17) (a.k.a., a shallow copy).\n\n# Function declarations without\
    \ bodies\n\nWe can implement a function in Go assembly (https://golang.org/doc/asm).\
