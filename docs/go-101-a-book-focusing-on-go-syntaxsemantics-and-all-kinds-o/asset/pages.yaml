  md: '# Expressions, Statements and Simple Statements


    This article will introduce expressions and statements in Go.


    Simply speaking, an expression represents a value and a statement represent an
    operation. However, in fact, some expressions may be composed of and represent
    several values, and some statements may be composed of sub operations/statements.
    By context, some statements can also be viewed as expressions.


    Simple statements are some special statements. In Go, portions of all kinds of
    control flows must be statements, and some portions must be expressions. Control
    flows will be introduced in the next Go 101 article.


    This article will not make accurate definitions for expressions and statements.
    It is hard to achieve this. This article will only list expression and statement
    cases. Not all kinds of expressions and statements will be covered in this article,
    but all of simple statements will be listed.


    # Some Expression Cases


    Most expressions in Go are single-value expressions. Each of them represents one
    value. Some expressions each represents multiple values. Such expressions are
    called multi-value expressions.


    Later, out of the current article, unless otherwise specified, when an expression
    is mentioned, mean it is a single-value expression.


    Value literals, variables, and named constants are all single-value expressions.
    They also called elementary expressions.


    The operations (using the assignment parts) using the operators introduced in
    the article common operators ($8) are all single-value expressions.


    If a function returns one result, its calls (without the assignment parts) are
    expressions. In particular, if the function returns more than one, its calls belong
    to multi-value expressions. Calls to functions without results are not expressions.


    Methods can be viewed as special functions. So the mentioned function cases also
    apply to methods. Methods will be explained in detail the method in Go ($22) later.


    In fact, later we will learn that custom functions, including methods, are all
    function values, so are also (single-value) expressions. We can learn more about
    function types and values ($20) later.


    Channel receive operations (without the assignment parts) are also expressions.
    Channel operations will be explained in the article channels in Go ($21) later.'
