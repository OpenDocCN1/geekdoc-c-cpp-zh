    # ## About the result of arithmetic operator operations


    Except bitwise shift operations, the result of a binary arithmetic operator operation


    +   - is a value of the same type of the two operands if the two operands are
    both typed of the same type.

    - is a value of the same type of the typed operand if only one of the operands
    is a typed value. In the computation, the (untyped) value will be deduced as a
    value of the type of the typed operand. In other words, the untyped operand will
    be implicitly converted to the type of the typed operand.

    - is still untyped value if both of the two operands are untyped. The default
    type of the result is one of the default types and it is the one later in this
    list: int, rune, float64, complex128. For example, if the default type of one
    untyped operand is int, and the other one is rune, then the default type of the
    result value is rune.


    The rules for a bitwise shift operator is a little complicated. Firstly, the result
    value is always an integer. Whether it is typed or untyped depends on specific
    scenarios.


    +   - If the left operand is a typed value (an integer value), then the type of
    the result is as the type of the left operand.

    - If the left operand is an untyped value and the right operand is a constant,
    then the left operand will always be treated as an integer, if its default is
    not an integer type, it must represent as an untyped integer and its default type
    will be viewed as int. For such cases, the result is also an untyped value and
    the default type of the result is the same as the left operand.

    - If the left operand is an untyped value and the right operand is a non-constant
    (unsigned) integer, then the left operand will be first converted to the type
    it would assume if the bitwise shift operator operation were replaced by its left
    operand. The result is a typed value whose type is the assumed type.


    Example:


    ```

    1 func main() {

    2   // Three untyped values. Their default

    3   // types are: int, rune(int32), complex64.

    4   const X, Y, Z = 2, ''A'', 31

    5

    6   var a, b int = X, Y // two typed values.

    7

    8   // The type of d is the default type of Y: rune.

    9   d := X + Y

    10  // The type of e is the type of a: int.

    11  e := Y - a

    ```'
