    A Mutex value is often called a mutual exclusion lock. A zero Mutex value is an
    unlocked mutex. A Mutex value can only be locked when it is in an unlocked status.
    In other words, an addressable Mutex value m is locked successfully (a.k.a., a
    m.Lock() method call returns), a new attempt by a goroutine to lock m will make
    the goroutine enter blocking state, until the Mutex value is unlocked (through
    a later m.Unlock() call).


    Please note that m.Lock() and m.Unlock() are shorthands of (&m).Lock() and (&m).Unlock(),
    respectively.


    An example of using sync.Mutex:


    ```

    1 package main

    2

