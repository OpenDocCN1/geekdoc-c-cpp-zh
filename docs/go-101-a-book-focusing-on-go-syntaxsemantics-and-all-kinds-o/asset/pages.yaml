  md: '# About Struct Value Comparisons


    Most struct types are comparable types, except the ones who have fields of uncomparable
    types (S14).


    Two struct values are comparable only if they can be assigned to each other and
    their types are both comparable. In other words, struct values can be compared
    with each other only if they have the identical underlying (comparable) types
    of the struct values have (considering field tags) and at least one of the types
    is non-defined.


    When comparing two struct values of the same type, each pair of their corresponding
    fields will be compared. The struct values are equal only if all of their corresponding
    fields are equal.


