    # # Pointer dynamic value vs. non-pointer dynamic value


    The official Go compiler/runtime makes an optimization that boxing pointer size
    values into interface values is more efficient than boxing non-pointers. small
    size values ($34), the efficiency differences are small, but for large sizes,
    the differences may be not small. By the same optimization, type assertions with
    a pointer type are more efficient than type assertions with the base of pointer
    type if the base is a large size type.


