    By the rules, a `select-case` code without any branches, `select()`, will make
    the current goroutine stay blocking state forever.


    The following program will enter the `default` branch for sure.


    ```

    1 package main

    2

    3 import "fmt"

    4

    5 func main() {

    6     var c chan struct{} // nil

    7     select {

    8     case c <- -c:      // blocking operation

    9     case c <- struct{}{}: // blocking operation

    10    default:

    11        fmt.Println("Go here.")

    12    }

    13 }

    ```


