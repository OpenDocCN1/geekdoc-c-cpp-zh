    function, but with one exception case (https://github.com/golang/go/issues/15992#issuecomment-337673303)
    when a method calls an interface receiver argument as the only argument of the
    nesting calls. This exception may be a bug of the standard Go compiler. At present,
    SDK 1.12, the bug still exists in the standard compiler.)


