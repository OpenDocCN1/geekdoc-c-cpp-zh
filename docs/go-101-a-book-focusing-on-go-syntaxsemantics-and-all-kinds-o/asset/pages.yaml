    # # Concept: Directions of Channel Types


    Channel values can be viewed as synchronized first-in-out (FIFO) queues. Channel
    types and values have directions.


    +   • A value channel which is both sensible and receivable is called a bidirectional
    channel. Its type is called a bidirectional channel type. The underlying types
    of bidirectional channel types are denoted as chan T in literal.

    • A value channel which is only sensible is a send-only channel. This type is
    called a send-only channel type. Send-only channel types are denoted as chan<-
    T in literal.

    • A value channel which is only receivable is a receive-only channel. Its type
    is called a receive-only channel type. Receive-only channel types are denoted
    as <-chan T in literal.


    For more about channel types and values, please read channels in Go ($21).


    # # Fact: Types Which Support or Don''t Support Comparisons


    Currently (Go 1.12), following types don''t support comparisons between values
    of the following types (with the == and != operators):


    +   • slice types

    • map types

    • function types

    • any struct type with a field whose type is uncomparable and any array type which
    element type is uncomparable.


    Above listed types are called incomparable types. All other types are called comparable
    types. Compilers forbid comparing values of incomparable types.


    Note, some Go tools may call uncomparable types as incomparable types.


    The key type of any map must be a comparable type.


    We can learn more about the detailed rules of comparisons from the article value
    conversions, assignments and comparisons in Go ($48).


