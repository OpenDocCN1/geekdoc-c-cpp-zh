    contexts between OS threads.


    The following picture depicts a more detailed lifecycle for a goroutine. In the
    picture, the running state is divided into several more sub-states. A goroutine
    in the queuing sub-state is waiting to be executed. A goroutine in the executing
    sub-state may enter the queuing sub-state again when it has been executed for
    a while (a very small piece of time).


    ![](img/3a90c5f4301e0f48c5d016c7feed3244_92_0.png)


    Please notes, for explanation simplicity, the sub-states shown in the above picture
    will not be mentioned in other articles in Go 101. And again, in Go 101, the sleeping
    and system calling sub-states are not viewed as sub-states of the blocking.


    The standard Go runtime adopts the [M-P-G model](https://docs.google.com/document/d/1TTJt4tJFO4kq2uD5ID9e889ao0SkhJYDDO0_kqxDv3I3Xmw)
    to do the goroutine job, where M represents OS threads, P represents logical/virtual
    processors (not logical CPUs) and G represents goroutines. The schedule work is
    made by logical processors (Ps), which act as brokers by attaching goroutines
    (Gs) to OS threads (Ms). Each OS thread can only be attached to at most one goroutine
    at any given time, and each goroutine can only be attached to one OS at any given
    time. A goroutine that has been executed for a while will try to detach from the
    corresponding OS thread, so that other running goroutines have choices to detach
    and attached.


    At runtime, we can call [GOMAXPROCS](https://golang.org/pkg/runtime#GOMAXPROCS)
    function to get and set the number of logical processors (Ps). Before standard
    Go runtime, before Go 1.5, the default value of this number is 1, but since Go
    1.5, the default value of this number is equal to the number of logical CPUs available
    for the current running program. But for some file IO heavy programs, a `GOMAXPROCS`
    value larger than `runtime.NumCPU()` may be helpful.


    The default initial value of `runtime.GOMAXPROCS` can also be set through the
    `GOMAXPROCS` environment variable.


    At any time, the number of goroutines in the executing sub-state is no more than
    the smaller one of `runtime.NumCPU` and `runtime.GOMAXPROCS`.'
