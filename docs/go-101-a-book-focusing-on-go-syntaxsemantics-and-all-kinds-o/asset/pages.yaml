  md: "# # Memory Order Guarantees in Go\n\n# ## About Memory Ordering\n\nMany compilers\
    \ (at compile time) and CPU processors (at run time) make some optimizations by\
    \ adjusting the instruction orders, so that the instruction execution orders may\
    \ differ from the orders presented in code. Instruction reordering is also called\
    \ [memory ordering](https://en.wikipedia.org/wiki/Memory_ordering).\n\nSurely,\
    \ reordering cannot be arbitrary. The base requirement for a reordering within\
    \ a specified goroutine is the reordering must not be detectable by the goroutine\
    \ if the goroutine doesn't share data with other goroutines. In other words, from\
    \ the perspective of such a goroutine, it can think its instruction execution\
    \ order is the same as the order specified by code, even if instruction reordering\
    \ happens inside.\n\nHowever, if some goroutines share some data, then instruction\
    \ reordering happens inside one of these goroutines may be observed by the other\
    \ goroutines, and affect the behaviors of all goroutines. Sharing data between\
    \ goroutines is common in concurrent programming. If we ignore the results caused\
    \ by instruction reordering, the behaviors of concurrent programs might make compiler\
    \ and CPU dependent, and often abnormal.\n\nHere is an unprofessional Go program\
    \ which does not consider instruction reordering, the program is expanded from\
    \ an example in the official documentation [Go 1 memory model](https://golang.org/ref/ref/mem).\n\
    \n```\npackage main\nimport \"log\"\nimport \"runtime\"\n\nvar a string\nvar done\
    \ bool\n\nfunc setup() {\n\ta = \"hello, world\"\n\tdone = true\n\tif done {\n\
    \t\tlog.Println(len(a)) // always 12 once printed\n\t}\n}\n\nfunc main() {\n\t\
    go setup()\n\tif !done {\n\t\trunime.Gosched()\n\t}\n\tlog.Println(a) // expected\
    \ to print: hello, world\n\n```"
