  md: '# §0. About Go 101


    understand shallowly and prevent you from mastering Go.


    Go is a feature rich language. Its syntax is surely not large, but we can''t say
    it is small. Some syntax and semantics designs in Go are straightforward, some
    are a little counter-intuitive or inconsistent with others. There are several
    trade-offs in Go syntax and semantics designs. A programmer needs Go programming
    experiences to comprehend the trade-offs.


    Go provides first-citizen non-essential kinds of types. Some encapsulations are
    made in implementing these types to hide the internal structures of these types.
    On one hand, the encapsulations bring convenience to Go programming. On the other
    hand, the encapsulations make some obstacles to understand the behaviors of these
    types deeply.


    Many official and unofficial Go tutorials are very simple and cover the general
    use cases by ignoring many details. This may be good to encourage new Go programmers
    to learn and use Go. On the other hand, this also makes many Go programmers overconfident
    on the extent of their knowledge.


    Several functions and types declared in some standard packages are not got detailed
    explanations. This is understandable, for many details are so subtle that it is
    hard to find proper wording to explain them clearly. Saying a few accurate words
    is better than some lots of words with inaccuracies. This really leaves some confusions
    for the package users.


    # So do you think simplicity is not a selling point of Go?


    I think, at least, simplicity is not a main selling point of Go. After all, there
    are several languages simpler than Go. On the other hand, Go, as a feature rich
    language, is also not a complicated language. A new Go programmer with right attitudes
    can master Go programming in one year.


    # Then what are the selling points of Go do you think?


    Personally, I think the fact that, as a static language, Go is flexible as many
    dynamic script languages is the main selling point of Go language.


    Memory saving, fast program warming-up and fast execution speed combined is another
    main selling point of Go. Although this is a common selling point of many C family
    languages. For web development, seldom languages own the three characteristics
    at the same time. In fact, this is the reason why I switched to Go from Java for
    web development.


    Built-in concurrent programming support is also a selling point of Go, though
    personally I don''t think it is the main selling point of Go.


    Great code readability is another important selling point of Go. I feel readability
    is the most important factor considered in designing Go.'
