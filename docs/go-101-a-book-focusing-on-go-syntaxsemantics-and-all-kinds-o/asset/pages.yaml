    # # Value Boxing


    We can view each value as a box to encapsulate a non-interface value. To box/encapsulate
    a non-interface value into an interface value, the type of the non-interface value
    must implement the type of the interface value.


    In Go, if a type T implements an interface I, then any value of T can be implicitly
    converted to type I. In other words, any value of type T is assignable (§7) to
    (modifiable) values of type I. When a T value is converted (assigned) to an I
    value,


    +   - if T is a non-interface type, a copy of the type T is boxed (or encapsulated)
    into the result (or destination) I value. The time complexity of the copy is O(n),
    where n is the size of copied.

    - if T is also an interface type, a copy of the value boxed in T is boxed (or
    encapsulated) into the result (or destination) I value. The Go compiler makes
    an optimization here, so the time complexity of the copy is O(1), or O(n).


    The type of information of the boxed value is also stored in the result (or destination)
    interface value. (This will be further explained below.)


    When a value is boxed in an interface value, the value is called the dynamic value
    of the interface value. The type of the dynamic value is called the dynamic type
    of the interface value.


    The direct part of the dynamic value of an interface value is immutable, though
    we can replace the dynamic value of an interface value with another dynamic value.'
