  md: '# Go Related Topics


    Go 101 articles focus on syntax and semantics in Go. There are some other related
    topics which are not covered in Go 101. The remaining of the current article will
    make simple introductions to these topics and provide some web links for readers
    to dig into them.


    # Profiling, Tests and Benchmarks


    We can use `go test` command in the official SDK to run tests and benchmarks.
    Test source names must end with `_test.go`. The official Go SDK supports profiling
    Go programs. Please read the following articles for more details.


    +   * [The standard package](https://golang.org/pkg/testing/)

    * [Using subbenchmarks](https://blog.golang.org/subtests)

    * [go test command options](https://golang.org/cmd/go/#hdr-Test-packages)

    * [Profiling Go programs](https://github.com/golang/go/wiki/Performance).


    # gccgo


    [gccgo](https://github.com/golang/gccgo) is another Go compiler maintained by
    the Go Core team. It is mainly used to verify the correctness of the Go compiler
    (gc). We can use the `-compiler=gccgo` build option in official Go commands to
    use the gccgo compiler instead of gc. For example, `go run -compiler=gccgo main.go`.
    This option requires the gccgo program to be installed. Once the gccgo program
    is installed, we can also use the [command directly to compile Go](https://golang.org/doc/install/gccgo#Using_gccgo).


    # Go Assembly


    Go functions can be implemented with Go assembly language. Go assembly language
    is a cross-architectures (though not 100%) assembly language. Go assembly language
    is often used to implement some functions that are critical for Go execution performances.


    For more details, follow the following links.


    +   * [A guide to Go''s assembler](https://golang.org/doc/asm)

