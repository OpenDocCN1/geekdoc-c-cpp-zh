  md: '# Go Value Copy Costs


    Value copying happens frequently in Go programming, Values assignments, argument
    passing and channel send operations are all value copying involved. This article
    will talk about the copy costs of values of all kinds of types.


    # Value Sizes


    The size of a value means how many bytes the direct part (§17) of the value will
    occupy in memory. The indirect underlying parts of a value don''t contribute to
    the size of the value.


    In Go, if the types of two values belong to the same kind (§14), and the type
    is not string kind, interface kind, array and struct, then the sizes of the two
    values are always equal.


    In fact, for the standard Go compiler/runtime, the size of two values are also
    always equal. The same relation is for size of two interfaces.


    Up to present (Go 1.12), values of a specified type always have the same value
    size. So, often, we call the size of a value as the size of the type of the value.


    The size of an array type depends on the element size and the length of the array
    type. The array type size is the product of the size of the element type and the
    array length.


    The size of a struct depends on all of the sizes and the order of its fields.
    There may be some padding bytes (§44) inserted between adjacent structs to guarantee
    certain memory alignment requirements of these fields, the size of a struct type
    must be no smaller than (and often larger than) the sum of the respective type
    sizes of its fields.


    The following table lists the sizes of all kinds of types (for the standard Go
    compiler version 1.12), one word means one word, which is 4 bytes on 32bits architectures
    and 8 bytes on 64bits architectures.


    | Kind of Types | Value Size | Required (https://golang.org/ref/spec#Size_and_alignment_guarantees
    by Go Specification https://golang.org/ref/spec#Numeric_types) |

    | bool | 1 byte | not specified |

    | int8, uint8 (byte) | 1 byte | 1 byte |

    | int16, uint16 | 2 bytes | 2 bytes |

    | int32, (rune), uint32, float32 | 4 bytes | 4 bytes |

    | int64, uint64, float64 | 8 bytes | 8 bytes |'
