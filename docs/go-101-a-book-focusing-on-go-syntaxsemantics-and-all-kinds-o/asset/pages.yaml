  md: '# Kind-of Memory Leaking Caused by Not Resetting

    Pointers in Lost Slice Elements


    In the following code, the h function is called, the memory block allocated for
    the first and

    last elements of slice s will get lost.


    ```

    func h() []*int {

    s := []*int{new(int), new(int), new(int), new(int)}

    // do something with s ...


    treturn s[1:3]

    }

    ```


    As long as the returned slice is still alive, it will prevent any elements of
    s from being collected,

    which in consequence prevents the two memory blocks allocated for the two int
    values

    referenced by the first and last elements of s from being collected.


    If we want to avoid such kind-of memory leaking, we must reset the pointers stored
    in the last\lements.


    ```

    func h() []*int {

    s := []*int{new(int), new(int), new(int), new(int)}

    // do something with s ...


    // Reset pointer values.

    s[0], s[len(s)-1] = nil, nil

    return s[1:3]

    }

    ```


    We often need to reset the pointers for some old slice elements in slice deletion

    operations ($18).


    # Real Memory Leaking Caused by Hanging

    Goroutines


    Sometimes, some goroutines in a Go program may stay in blocking state for ever.
    Such

    goroutines are called hanging goroutines. Go runtime will not kill hanging goroutines,
    so the

    resources allocated for (the memory blocks referenced by) the hanging goroutines
    will

    get garbage collected.


    There are two reasons why Go runtime will not kill hanging goroutines. One is
    that sometimes it

    is hard for Go runtime to judge whether or not a blocking goroutine will be blocked
    for ever. The

    other is sometimes we deliberately make a goroutine hanging. For example, sometimes
    we may

    let the main goroutine of a Go program to avoid the program exiting.


    We should avoid hanging goroutines which are caused by some logic mistakes in
    code design.'
