    Although Go absorbs many features from all kind of other languages, Go is mainly
    viewed as a C family language. One evidence is Go also supports pointers. Go pointers
    and C pointers are similar in many aspects, but there are also some differences
    between Go pointers and C pointers. This article will list all kinds of concepts
    and details related to pointers in Go.


    # Memory Addresses


    A memory address means an offset (number of bytes) from the start point of the
    whole memory managed by a system (generally, operation system).


    Generally, a memory address is stored as an unsigned native (integer) word. The
    size of a native word is 4 (bytes) on 32-bit architectures and 8 (bytes) on 64-bit
    architectures. The theoretical maximum memory space size is $2^{32}$ bytes, a.k.a.
    4GB (1GB==$2^{30}$ bytes), on 32-bit architectures, and is $2^{34}$GB (16 exabytes)
    on 64-bit architectures.


    Memory addresses are often represented with hex integer literals, such as `0x1234CDEF`.


    # Value Addresses


    The address of a value means the start address of the memory segment occupied
    by the direct part (§17) of the value.


    # What Are Pointers?


    Pointer is one kind of type in Go. A pointer is a value of some pointer type.
    A pointer value can store a memory address. In, we often call a memory address
    as a pointer, and vice versa.


    Generally, the stored memory address in a pointer is the address of another value.
    Unlike C language, for safety reason, there are some restrictions for Go pointers.
    Please read the following sections for details.


    # Go Pointer Types and Values


    In Go, a non-defined pointer type can be represented with `*T`, `T` can be an
    arbitrary type. Type `T` is called the base type of pointer type `*T`.


    We can declare defined pointer types, but generally, it''s not recommended to
    use defined pointer types, for non-defined pointer types have better readabilities.


    If the underlying type (§14) of a defined pointer type is `*T`, then the base
