  md: '# §21. Channels in Go


    These circumstances are called races. One of the duties in concurrent programming
    is to control resource sharing among concurrent computations, so that races will
    not happen. The ways to achieve this duty are called concurrency synchronization,
    or data synchronization. Go supports several data synchronization techniques.
    The following section will introduce one of them, channel.


    Other duties in concurrent programming include


    +   - determine how many computations are needed.

    - determine when to start, block, unlock and end a computation.

    - determine how to distribute workload among concurrent computations.


    Most operations in Go are not synchronized. In other words, they are not concurrency-safe.
    These operations include value assignments, argument passing and container element
    manipulations, etc. There are only a few operations which are synchronized, including
    the several to be introduced channel operations below.


    In Go, generally, each computation is a goroutine. So later we use goroutines
    to represent computations.


    # # Channel Introduction


    One suggestion (made by Rob Pike) for concurrent programming is **don''t (let
    computations) communicate by sharing memory, let them) share memory by communicating
    (through channels).**


    Communicating by sharing memory and sharing memory by communicating are two programming
    manners in concurrent programming. When goroutines by sharing memory, we need
    some traditional concurrency synchronization techniques, such as mutex locks,
    to protect the shared memory to prevent data races. We can use channels to implement
    sharing memory by communicating.


    Go provides a unique concurrency synchronization technique, channel. Channels
    make goroutines sharing by communicating. We can view a channel as an internal
    FIFO (first, first out) data queue within a program. Some goroutines send values
    to the queue (the channel) and some other goroutines receive values from the queue.


    Along with transferring values (through channels), the ownership of some values
    may also be transferred between goroutines. When a goroutine sends a value to
    a channel, we can view the goroutine releases the ownership of values. When a
    goroutine receives a value from a channel, we can view the goroutine acquires
    the ownership of values.


    Surely, there may be also any ownership transferred along channel communications.
    are often referenced (but are not required to be referenced) by the transferred
    value. Please note, here, when we talk about ownership, we mean the ownership
    from the logic view. Unlike Rust, Go doesn''t ensure value ownership from the
    syntax view. Go channels help programmers write data races free code easily, but


