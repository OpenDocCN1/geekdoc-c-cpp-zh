  md: "# §25. Type-Unsafe Pointers\n\nCurrently (Go 1.12), Go compilers allow the\
    \ following explicit conversions.\n\n+   - A safe pointer can be explicitly converted\
    \ to an unsafe pointer, and vice versa.\n- An uintptr can be explicitly converted\
    \ to an unsafe pointer, and vice versa. But please note, a nil unsafe.Pointer\
    \ shouldn't be converted to uintptr and back with arithmetic.\n\nBy using these\
    \ conversions, we can convert a safe pointer to an arbitrary pointer type.\n\n\
    However, although these conversions are all at compile time, not all of them are\
    \ valid (safe) at run time. These conversions defeat the memory safety the Go\
    \ type system (except the unsafe part) tries to maintain. We must follow the instructions\
    \ listed in a later section below to write valid Go with unsafe pointers.\n\n\
    # # Some Facts in Go We Should Know\n\nBefore introducing the valid unsafe pointer\
    \ patterns, we need to know some facts in Go.\n\n# # Fact 1: unsafe pointers are\
    \ pointers and uintptr values are integers\n\nEach of non-nil safe and unsafe\
    \ pointers reference another value. However uintptr values don't reference any\
    \ values, they are just integers, though often each of them stores an integer\
    \ which can be used to represent a memory address.\n\nGo is a language supporting\
    \ automatic garbage collection. When a Go program is running, runtime will check\
    \ which memory blocks are not used by any value more or collect the memory ($43)\
    \ allocated for these unused blocks, from time to time. Pointers play an important\
    \ role in the check process. If a memory block is unreachable (referenced by)\
    \ any values in using, Go runtime thinks it is an unused value and it can be safely\
    \ collected.\n\nAs uintptr values are integers, they can participate arithmetic\
    \ operations.\n\nThe example in the next section shows the differences between\
    \ pointers and uintptr values.\n\n# # Fact 2: unused memory blocks may be collected\
    \ at any time\n\nAt run time, the garbage collector may run at an uncertain time,\
    \ and each garbage collection process may last an uncertain duration. When a memory\
    \ block becomes unused, it may be collected at an uncertain time ($43).\n\nFor\
    \ example:\n\n```\nimport \"unsafe\"\n// Assume createInt will not be inlined.\n\
    func createInt() *int {\n  return new(int)\n}\n```"
