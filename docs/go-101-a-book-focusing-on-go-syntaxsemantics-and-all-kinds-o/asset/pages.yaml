    In Go code, if a place needs a value of a certain type and an untyped value (often
    a constant) is representable as a value of the certain type, then the untyped
    value can be used in the place. Go compilers will view the untyped value as a
    value of the certain type. Such places include an operand in an operator operation,
    an argument in a function call, a destination value or a source value in an assignment,
    etc.


