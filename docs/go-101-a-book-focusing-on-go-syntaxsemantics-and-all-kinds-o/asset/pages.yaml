    10    for {

    11      time.Sleep(d)

    12      select {

    13      case c <- struct{}:

    14      default:

    15      }

    16    }

    17  }()

    18  return c

    19 }\n20

    21 func main() {

    22  t := time.Now()

    23  for range Tick(time.Second) {

    24    fmt.Println(time.Since(t))

    25  }

    26 }

