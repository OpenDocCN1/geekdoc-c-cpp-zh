    \ in detail later in article. Here we can simply think\n\n+   - The Add method\
    \ is used to register the new number of tasks.\n- the Done method is used to notify\
    \ that a task is finished.\n- and the Wait method makes the caller goroutine become\
    \ blocking until all registered tasks are finished."
