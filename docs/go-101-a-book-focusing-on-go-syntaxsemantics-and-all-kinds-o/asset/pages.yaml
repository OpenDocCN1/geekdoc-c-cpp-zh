    # # What Is the Meaningfulness of Type Embedding?


    The main purpose of type embedding is to extend the functionalities of the embedded
    types into the embedded type, so that we don''t need to re-implement the functionalities
    of the embedded types for the embedding type.


    Many other object-oriented programming languages use inheritance to achieve the
    same goal of type embedding. Mechanisms have their own [benefits and drawbacks](https://en.wikipedia.org/wiki/Composition_over_inheritance),
    this article will not discuss which one is better. We should just know Go chose
    the embedding mechanism, and there is a difference between two:


    +   - If a type T inherits another, then type T obtains the abilities of the other.
    At the same time, each value of type T can also be viewed as a value of the other
    type.

    - If a type T embeds another, then other type becomes a part of type T, and type
    T obtains the abilities of the other type, but none values of type T can be viewed
    as values of the other type.


    Here is an example to show how an embedding type extends the functionalities of
    the embedded type.


    ```

    ```go

