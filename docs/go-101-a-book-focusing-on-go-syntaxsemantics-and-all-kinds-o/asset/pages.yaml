  md: 'The remaining code declares a function which is called `main`. The `main` function
    in the `main` package specifies the entry point of a program. (Note that some
    other user code might be executed before the `main` function gets invoked.)


    # Run Go Programs


    The official Go SDK requires that Go source code to have the extension `.go`.
    Here, we assume the above source code is saved in a file named `simplest-go-program.go`.


    Open a terminal and change the current directory to the directory which contains
    the above source file, then


    ```

    $ go run simplest-go-program.go

    ```


    Nothing is output? Yes, this program outputs nothing.


    If there are some syntax errors in the source code, then these errors will be
    reported as compilation errors.


    Note: if multiple source files are in the `main` package of a program, then we
    should run the program with the following command


    ```

    $ go run *.go

    ```


    Note, the `go run` command is not recommended to compile and run large Go projects.
    It is just a convenient way to run simple Go projects, like the ones in the Go
    101 articles. For large Go projects, please use the commands `go build` or `go
    install` to create (and run) executable binaries instead.


    # More Go Subcommands


    The three commands, `go run`, `go build` and `go install`, will only show code
    syntax warnings (if any). They don''t (try) to show code warnings (a.k.a., possible
    code logic mistakes). We can use the `go vet` command to check and report warnings.


    We can use the `go fmt` command to format Go source code with a consistent style.


    We can use the `go test` command to run tests and benchmarks.


    We can use the `go doc` command to view Go documentations in terminal windows.'
