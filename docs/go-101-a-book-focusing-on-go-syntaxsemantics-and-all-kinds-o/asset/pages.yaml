  md: '# §11. Expressions, Statements and Simple Statements


    Some expressions in Go, including the just mentioned channel receive operations,
    may have optional results in Go. Such expressions can present as both single-value
    and multi-value expressions, depending on different contexts. We can learn such
    expressions in other Go 101 articles later.


    # # Simple Statement Cases


    There are six kinds of simple statements.


    +   1. short variable declaration forms

    2. pure value assignments (not mixing with variable declarations), including `x
    op= y` operations.

    3. function/method calls and channel receive operations. As mentioned in the last
    section, these simple statements can also be used as expressions.

    4. channel send operations.

    5. nothing (a.k.a., blank statements). We will learn some use of blank statements
    in the next article.

    6. `x++` and `x--`.


    Again, channel receive and send operations will be introduced in the article channels
    in Go (§21).


    Note, `x++` and `x--` can''t be used as expressions. And Go does not support `+++`
    and `--x` syntax forms.


    # # Some Non-Simple Statement Cases


    An incomplete non-simple statements list:


    +   - standard variable declaration forms. Yes, short variable declarations are
    simple statements, but standard ones are not.

    - named constant declarations.

    - custom type declarations.

    - package import declarations.

    - explicit code blocks. An explicit code block starts with a `{` and ends with
    a `}`. A code block may contain many sub-statements.

    - function declarations. A function declaration may contain many sub-statements.

    - control flows and code execution jumps. Please read the next article (§12) for
    details.

    - return lines in function declarations.

    - deferred function calls and goroutine creations. They will be introduced in
    the article after next (§13).


