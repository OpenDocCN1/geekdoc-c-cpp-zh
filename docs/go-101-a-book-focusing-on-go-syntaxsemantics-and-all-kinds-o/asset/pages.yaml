  md: '# Bounds Check Elimination


    Go is a memory safe language. Array/slice element indexing and subslice operations,
    Go runtime will check whether or not the indices are out of range. If an index
    is out of range, a panic will be produced to prevent the invalid index from doing
    harm. This is called bounds check. Bounds checks make our code run safely, on
    the other hand, they also make our code run a bit slower.


    Since Go SDK 1.7, the Go compiler has used a new compiler backend, based on SSA
    (static single-assignment form). SSA helps Go compilers efficiently use optimizations
    like BCE (https://en.wikipedia.org/wiki/Bounds_checking_elimination) (bounds check
    elimination) and CSE (https://en.wikipedia.org/wiki/Common_subexpression_elimination)
    (common subexpression elimination). BCE can avoid unnecessary bounds checks, and
    CSE can avoid some duplicate calculations, that the standard Go compiler can generate
    more efficient programs. The improvement effects of these optimizations are obvious.


    This article will list some examples of how BCE works with the Go compiler 1.7+.


    For Go SDK 1.7+, we can run `go build -gcflags="-d=ssa/check_check_bce/debug=1"`
    to show which code lines still need bounds checks.


    # Example 1


    ```

    1 // example1.go

    2 package main

    3

    4 func f1(s [ ]int) {

    5     = s[0] // line 5: bounds check

    6     = s[1] // line 6: bounds check

    7     = s[2] // line 7: bounds check

    8 }

    9

    10 func f2(s [ ]int) {

    11     = s[2] // line 11: bounds check

    12     = s[1] // line 12: bounds check eliminated!

    13     = s[0] // line 13: bounds check eliminated!

    14 }

    15

    16 func f3(s [ ]int, index int) {

    17     = s[index] // line 17: bounds check

    18     = s[index] // line 18: bounds check eliminated!

    19 }

