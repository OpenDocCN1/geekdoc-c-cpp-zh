  md: '# §43. Memory Blocks


    time. This means some values can be safely allocated on stacks may also be allocated
    on heap.


    In fact, stacks are not essential for Go programs. Go compiler/runtime allocate
    all memory block on heap. Supporting stacks is just to make Go programs run more
    efficiently:


    +   - allocating memory blocks on stacks is much faster than on.

    - memory blocks allocated on a stack don''t need to be garbage collected.

    - stack memory blocks are more CPU cache friendly than heap ones.


    If a memory block is allocated somewhere, we can also say the value parts hosted
    on the memory block are allocated on the same place.


    If some value parts of a local declared in a function are allocated on heap, we
    can say the value parts (the variable) escape to heap. By using the official SDK,
    we can run go build -gcflags -m to check which local values (value parts) escape
    to heap at runtime.


    As above has mentioned, the current escape analyzer in the Go compiler is not
    perfect, many local value parts on stacks will still escape to heap.


    An active value part allocated on heap must be referenced by at least one value
    part allocated on a stack. If a value escaping to heap is a declared variable,
    and assume its type is T, Go runtime will create (a memory block for) an implicit
    pointer of T on the stack of the current goroutine. The value of the pointer stores
    the address of the memory block allocated for the variable on heap (a.k., the
    address of the local variable of T). Go compiler will replace all uses of the
    variable with the dereferences of the pointer value at compile time. The T pointer
    on stack may be marked as dead since a later time, so the reference relation from
    to the T value on heap will disappear. The reference relation from the T value
    on stack to the T value on heap plays an important role in the garbage collection
    process which will be described below.


    Similarly, we can view each package-level variable allocated on heap, and the
    variable referenced by an implicit pointer which is allocated on a global memory
    zone. In the implicit pointer references the direct part of the package-level
    variable, and the direct part of the variable references some other value parts.


    A memory block allocated on heap may be referenced by multiple value parts allocated
    on different stacks at the same time.


    Some facts:


    +   - if a field of a struct value escapes to heap, then the whole struct value
    will also escape to heap.

    - if an element of an array value escapes to heap, then the whole array value
    will also escape to heap.

    - if an element of a slice value escapes to heap, then all the elements of the
    slice will also escape to heap.

    - if a value (part) V is referenced by a value (part) which escapes to heap, then
    the value (part) V will also escape to heap.'
