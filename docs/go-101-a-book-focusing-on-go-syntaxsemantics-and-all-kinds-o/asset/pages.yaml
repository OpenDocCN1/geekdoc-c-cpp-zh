    # Two Nil of the Same Type May Not Be Comparable


    In Go, map, slice and function types don''t support comparison. Comparing two
    values, including nil values, of incompatible types is illegal. The following
    comparisons fail to compile.


    ```

    1 var = ([int](nil) == ([int](nil)

    2 var = (map[string]int)(nil) == (map[string]int)(nil)

    3 var = (func())(nil) == (func())(nil)

    ```


    But any values of the mentioned incompatible types can be compared with the bare
    nil identifier.


    ```

    1 // The following lines compile okay.

    2 var = ([int](nil) == nil

    3 var = (map[string]int)(nil) == nil

    4 var = (func())(nil) == nil

    ```


    # Two Nil Values May Not Be Equal


    If one of the two nil values is an interface value and the other is not, assume
    they are comparable, the comparison result is always false. The reason is the
    non-interface value will be converted to the type of the interface value ($23)
    before making the comparison. The converted interface value has a concrete dynamic
    type but the other interface value has not. This is why the comparison result
    is always false.


    Example:


    ```

    fmt.Println((interface{}(nil)) == (*int)(nil)) // false

    ```


    # Retrieving Elements From Nil Maps Will Not Panic


    Retrieving element from a nil map value will always return a zero element value.'
