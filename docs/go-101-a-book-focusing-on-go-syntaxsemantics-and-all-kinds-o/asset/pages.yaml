  md: '# §5. Keywords And Identifiers in Go


    An identifier starting with a Unicode upper case letter (http://www.logfile/info/unicode/category/Lu/list.htm)
    is called an exported identifier. The word exported can be interpreted as public
    in other languages. The identifiers do not start with an Unicode upper case letter
    are non-exported identifiers. The word non-exported can be interpreted as private
    in many other languages. (Go 1.12), eastern characters are viewed as non-exported
    letters. Sometimes, non-exported identifiers are also called unexported identifiers.


    Here are some legal exported identifiers:


    ```

    1 Player_9

    2 DoSomething

    3 VERSION

    4 Go

    5 П

    ```


    Here are some legal non-exported identifiers:


    ```

    1 -

    2 _status

    3 memStat

    4 book

    5 П

    6 一个类型

    7 变量

    8 错误

    ```


    And here are some tokens which are illegal to be used as identifiers:


    ```

    1 // Starting with a Unicode digit.

    2 123

    3 apples

    4

    5 // Containing Unicode characters not

    6 // satisfying the requirements.

    7 a.b

    8 *ptr

    9 $name

    10 a@b.c

    11

    12 // These are keywords.

    13 type

    14 range

    ```


