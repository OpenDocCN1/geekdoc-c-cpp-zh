  md: '# # Keywords And Identifiers in Go


    This article will introduce keywords and identifiers in Go.


    # # Keywords


    Keywords are the special words which help compilers understand and parse user
    code.


    Up to now (Go 1.12), Go has only 25 keywords:


    ```

    ```

    1 break     default   interface select

    2 case      defer    go       map      struct

    3 chan      else      goto     package switch

    4 const    fallthrough if       range    type

    5 continue  import    return  var

    ```

    ```


    They can be categorized as four groups:


    +   * **const, func, import, package, type** and **var** are used to declare all
    kinds of code elements in Go.

    * **chan, interface, map** and **struct** are used as parts in some composite
    type denominations.

    * **break, case, continue, default, else, fallthrough, for, goto, if, range, return,
    select and switch are used to control flow of code.

    * **defer** and go are also control keywords, but by other specific manners. They
    modify function calls, which we''ll talk about in this article ($13).


    These keywords will be explained in detail in other articles.


    # # Identifiers


    An identifier is a token which must be composed of Unicode letters, Unicode digits
    (Number category Nd in Unicode Standard 8.0) and (underscore) and start with an
    Unicode letter or Here.


    +   * Unicode letters mean the characters defined in the Letter categories Lu,
    Ll, Lt, Lm, or Lo [The Unicode Standard 8.0](http://www.unicode.org/versions/Unicode8.0/).

    * Unicode digits mean the characters defined in the Number category Nd of The
    Unicode Standard 8.0.


    **keywords** can not be used as identifiers.


    Identifier is a special identifier, and is called **blank identifier**.


    Later we will learn that all names of types, variables, constants, labels, package
    names and package import names must be identifiers.'
