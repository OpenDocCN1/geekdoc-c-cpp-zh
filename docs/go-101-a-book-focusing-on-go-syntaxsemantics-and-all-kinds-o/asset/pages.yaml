    # ## About overflows


    Overflows are not allowed for typed constant values but are allowed for non-constant
    and untyped constant values, either values are intermediate or final results.
    Overflows will be truncated (wrapped around) for non-constant values, but overflows
    (for default types) on untyped constant value will not be truncated (wrapped around).


    Example:


    ```

    1 // Results are non-constants.

    2 a, b uint8 = 255, 1

    3 // Compiles ok, higher overflowed bits are truncated.

    4 var c = a + b // c = 0

    5 // Compiles ok, higher overflowed bits are truncated.

    6 var d = a << b // d = 254

    78 // Results are untyped constants.

    9 const X = 0xFFFFFFFF * 0xFFFFFFFF // overflows int

    10 const R = ''a'' + 0xFFFFFFFF // overflows run

    11 // The above two lines both compile ok, though they

    12 // untyped value X and R both overflow their

    13 // respective default types.

    14

    15 // Operation or conversion results are

    16 // typed values. These lines all fail to compile.

    17 var e = X // error: untyped constant X overflows int

    18 var h = R // error: constant 217483474 overflows run

    19 const Y = 128 - int8(1) // error: 128 overflows int

    20 const Z = uint8(255) + 1 // error: 256 overflow uint8

    ```


    # ## About integer division and remainder operation


    Assume x and y are operands of the same type, the integer q (x / y) and remainder
    r (= x % y) satisfies x = q*y + r, where |x| < |y|. If r is not zero, the sign
    is the same as x (the dividend). The result of x / y is truncated towards zero.


    If the y is a constant, it must not be. If the divisor is zero at runtime and
    it is an integer, a runtime-panic occurs. Panics are exceptions in some other
    languages. We can learn more about panics in this article ($13).'
