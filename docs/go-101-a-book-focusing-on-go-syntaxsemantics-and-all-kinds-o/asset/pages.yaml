    # # Which types can we implement methods for?


    Please read methods in Go ($22) for details.


    # # How to declare immutable values in Go?


    There are three immutable value definitions:


    +   1. the values which have no addresses (so they are not addressable)

    2. the values which have addresses but are not addressable (their addresses are
    not allowed to be taken in syntax).

    3. the values which are addressable but their values are not allowed to be modified
    in syntax.


    In Go, up to now (Go 1.12), there are no values satisfy the third definition.
    In other words, the third definition is not supported.


    Name constant values satisfy the first definition.


    Methods and package-level functions can also be viewed as declared immutable values.
    They satisfy the second definition. String elements (bytes) also satisfy the second
    definition.


    There are no ways to declare other custom immutable values in Go.


    # # Why isn''t there a built-in set container type?


    Sets are just maps but don''t care about element values. In Go, `map[Tkey]struct{}`
    is often used as a set type.


    # # What is byte? What is rune? How to convert []byte and []rune values to strings?


    In Go, `byte` is an alias of `uint8`. `byte` and `uint8` are the same identical
    type. The relation is for `rune` and `int32`.


    A `rune` is often used to store a Unicode break point.


    `[]byte` and `[]rune` values can be explicitly and directly converted to strings,
    and vice versa.


    ```

