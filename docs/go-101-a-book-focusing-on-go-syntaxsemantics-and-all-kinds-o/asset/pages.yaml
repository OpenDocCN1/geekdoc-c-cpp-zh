  md: '# §2. An Introduction to Go


    Later we shall call it the Standard Go, or gc (an abbreviation for Go compiler,
    not for garbage collection GC). The Go design also maintains a second Go compiler,
    gccgo. Nowadays it is less popular than gc, but it always serves as a reference,
    and both compilers are in active development. As now many of the Go team focuses
    on the improvement of gc.


    gc is provided in the official Go SDK. Go SDK 1.0 was released at March, 2012.
    The version of Go is consistent with the version of Go SDK. There were/two major
    versions released each year.


    Since the release of Go 1.0, the syntax of Go changed a little, but there were/many
    improvements in the tools in Go SDK, from version to version, especially for gc.
    For example, noticeable lags caused by garbage collection is a common criticism
    for languages with automatic memory management. But since Go 1.8, improvements
    made for the concurrent garbage collection implementation in gc eliminated the
    lag problem.


    gc supports cross-platform compilation. For example, we can build a Windows executable
    on a Linux OS, and vice versa.


    Programs written in Go language mostly compile very fast. Compilation time is
    an important factor for the happiness in development. Short time is one reason
    why many programmers like programming with Go.


    Advantages of Go executables:


    +   - small memory footprint

    - fast code execution

    - short warm-up duration (so great deployment experience)


    Some other compiled languages, such as C++/Rust may also also have these three
    advantages (and they may have their respective advantages compared to Go), but
    they lack three important characteristics of Go:


    +   - fast compilation results in happy local development experience and short
    deployment cycles

    - flexible like dynamic languages

    - built-in concurrent programming supports


    All the advantages combined Go become an outstanding language and a good choice
    for many kinds of projects. Currently, Go is popularly used in network, system
    tools, database development and block chain development areas. But there are also
    more and more game, big data and AI projects to use Go.


    Finally, Go is not perfect in all aspects. There are trade-offs in Go design.
    The current Go 1 really has some shortcomings. For example, Go doesn''t support
    generics for custom types and functions now. Go team members are not against introducing
    custom generics into Go, they just haven''t found a good solution that keeps Go
    clean and simple. Go 2 is in planning now. Nothing is impossible in the future.'
