    7     trySend := func(v string) {

    8     select {

    9     case c <- v:

    10    default: // go here if c is full.

    11    }

    12 }

    13    tryReceive := func() string {

    14        select {

    15        case v := <-c: return v

    16        default: return "" // go here if c is empty

    17    }

