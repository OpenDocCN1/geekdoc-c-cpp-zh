  md: '# # Channels in Go


    Channel is an important built-feature in Go. It is one of the features that makes
    Go unique.


    This article will list all the channel related concepts, syntax and rules. To
    understand channels better, the internal structure of channels and some implementation
    details by the standard Go compiler/runtime are also simply described.


    The information in this article may be slightly challenging for new gophers. Some
    parts of this article may need to be read several times to fully understand them.


    # # Concurrent Programming and Concurrency Synchronization


    Modern CPUs often have multiple cores, and some CPU cores support hyper-threading.
    In other words, modern CPUs can process multiple instruction pipelines simultaneously.
    To fully use the power of modern CPUs, we need to do concurrent programming in
    coding our programs.


    Concurrent computing is a form of computing in which several computations are
    executed during overlapping time periods. The following picture depicts two concurrent
    computations. The second case is also parallel computing, which is special concurrent
    computing. In the first case, A and B are only in parallel during a small piece
    of time.


    | Concurrent: | A | A | A |

    |---|---|---|---||

    | | B | | | B |

    | Parallel: | | A | |

    | | | B | |


    Concurrent computing may happen in a program, a computer, or a network. In Go
    101, we only talk about program-scope concurrent computing. Goroutine, which has
    been introduced before (S13), is the Go way to create concurrent computations.


    Concurrent computations may share resources, generally memory resource. There
    are some circumstances may happen in a concurrent computing.


    +   - In the same period of one computation is writing to a memory segment, another
    computation is reading data from the memory segment. Then the integrity of the
    data read by the other computation might be not preserved.

    - In the same period of one computation is writing to a memory segment, another
    computation is also writing data to the same memory segment. Then the integrity
    of the data stored at the memory segment might not be preserved.'
