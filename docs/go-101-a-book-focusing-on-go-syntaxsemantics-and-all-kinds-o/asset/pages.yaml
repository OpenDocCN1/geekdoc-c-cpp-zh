  md: '# Basic Types and Basic Value Literals


    Types can be viewed as value templates, and can be viewed as type instances. This
    article will introduce the built-in basic types and their value literals in Go.
    Composite types will not get introduced in this article.


    # Built-in Basic Types in Go


    Go supports following built-in basic types:


    +   - one boolean built-in boolean type: `bool`

    - 11 built-in integer numeric types: `int8`, `uint8`, `int16`, `uint16`, `int32`,
    `uint32`, `int64`, `uint64`, `int`, `uint`, and `uintptr`

    - two built-in floating-point numeric types: `float32` and `float64`

    - two built-in complex numeric types: `complex64` and `complex128`

    - one built-in string type: `string`


    Each of the 17 built-in basic types belongs to one different kind of type in Go.
    We can use the above-in types in code without importing any packages, though all
    the names of these types are non-exported identifiers.


    15 of the 17 built-in basic types are numeric types. Numeric types includes integer
    types, floating-point types and complex types.


    Go also support two built-in type aliases,


    +   - `byte` is a built-in alias of `uint8`. We can view `byte` and `uint8` as
    the same type.

    - `rune` is a built-in alias of `int32`. We can view `rune` and `int32` as the
    same type.


    The integer types names starting with a u are unsigned types. Values of unsigned
    types are always non-negative. The name of the type means how many binary bits
    of the type will occupy memory at runtime. For example, the largest of `uint8`
    value is 255 (2⁸-1), the largest of `int8` value is 127 (2⁷-1), and the smallest
    `int8` value is -128 (-2⁷).


    If a value occupies N bits in memory, we say the size of the value is N bits.
    Bits of all values are of the same, so value sizes are often called type sizes.


    We measure the size of a value based on the number of bytes occupies in memory.
    One contains 8 bytes. So the size of the `uint32` type is four bytes.


    The sizes of `int` and `uint` in memory are operation system dependent, either
    32 or 64 bits. The size of `uintptr` value must be large enough to store the uninterpreted
    bits of any memory address.'
