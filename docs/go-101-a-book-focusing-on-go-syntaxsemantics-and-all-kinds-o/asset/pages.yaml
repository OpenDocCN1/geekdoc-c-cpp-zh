  md: '# §4. Introduction to Source Elements


    Although the code written in high-level programming languages is more understandable
    than low-level machine languages, we still need some comments for some code to
    explain the logic. The example program in the next section contains many comments.


    # A Simple Go Demo Program


    Let''s view a short Go demo program to know all kinds of code elements in Go.
    Like some other languages, in Go, line comments start with //, and each comment
    block is enclosed in a pair of /* and */.


    Below is the demo Go program. Please read the comments for explanations. More
    explanations are the following program.


    ```

    package main // specify the source file''s package

    import "math/rand" // import a standard package

    const MaxRnd = 16 // a named constant declaration

    /* A function declaration


    StatRandomNumbers produces certain number of

    non-negative random integers which are less than

    MaxRnd, counts and returns the numbers of

    small and large ones among the produced random.

    s specifies how many random to be produced.

    */

    func StatRandomNumbers(n int) (int, int) {

    // Declare two variables (both as 0).

    var a, b int

    // A for-loop control flow.

    for i := 0; i < n; i++ {

    // An if-else control flow.

    if rand.Intn(MaxRnd) < MaxRnd/2 {

    a = a + 1

    } else {

    b++ // same as: b = b + 1

    }

    }

    return a, b // this function return two results

