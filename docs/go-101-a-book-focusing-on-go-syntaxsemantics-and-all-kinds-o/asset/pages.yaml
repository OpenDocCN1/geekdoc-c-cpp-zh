    7 fallthrough

    8 case 5, 6, 7, 8:

    9 // A new declared variable also called "n"

    10 // it is only visible in the currrent

    11 // branch code block.

    12 n := 99

    13 fmt.Println("n = ", n) // 99

    14 fallthrough

    15 default:

    16 // This "n" is the switch expression "n".

    17 fmt.Println("n = ", n)

    18 }

    ```


    Please note,


    +   - a fallthrough statement must be the final statement in a branch.

    - a fallthrough statement cannot show up in the final branch in a switch-case
    control flow block.


    For example, the fallthrough uses are all illegal.


