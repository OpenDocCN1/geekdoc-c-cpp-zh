    \ If a slice rune value is outside the range of Unicode code points, it will be\
    \ viewed as U+FFFF, the code point for the Unicode replacement character. U+FFFF\
    \ is UTF-8 encoded as three bytes (0xef 0xbf 0xbd).\n\nWhen a string is converted\
    \ to a rune, the bytes stored in the string will be viewed as successive UTF-8\
    \ encoding sequences by representation of many Unicode code points. Bad UTF-8\
    \ encoding representations will be converted to a rune value U+FFFF.\n\nWhen a\
    \ string is converted to a slice, the result slice is just a deep copy of the\
    \ underlying byte sequence. When a slice is converted to a string, the underlying\
    \ byte sequence of the result slice is just a deep copy of the byte slice. A memory\
    \ allocation is needed to store the deep copy in each of such conversions. The\
    \ reason why a deep copy is essential is slice elements are mutable but the bytes\
    \ in strings are immutable, so a byte slice and string cannot share bytes below.\n\
