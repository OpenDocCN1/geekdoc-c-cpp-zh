  md: '# We should use the three-index subslice form at some scenarios.


    Assume a package provides a func NewX(...Option) *X function, and the implementation
    of this function will merge the input options with some internal default options,
    then the following implementation is not recommended.


    ```

    1 func NewX(opts ...Option) *X {

    2 options := append(opts, defaultOpts...)

    3 // Use the merged options to build and return a X.

    4 // ...

    5 }

    ```


    The reason why the above implementation is not recommended is the append call
    may modify the underlying Option sequence of the argument opts. For most scenarios,
    it is not a problem. But for some scenarios, it may cause unexpected results.


    To avoid modifying the underlying Option sequence of the input argument, we should
    use the following way instead.


    ```

    1 func NewX(opts ...Option) *X {

    2 opts := append(opts[:len(opts)], defaultOpts...)

    3 // Use the merged options to build and return a X.

    4 }

    ```


    On the other hand, the callers of the New function, it is not a good idea to think
    and rely on the New function will not modify the underlying elements of the passed
    slice, so it is best to pass these with the three-index subslice form.


    Another scenario at which we should use three-index subslice form is mentioned
    in [this article](https://github.com/go101/go101/wiki/The-capacity-of-the-result-byte%28-or-run%29-slice-of-a-conversion-from-string-is-undefined).


    One drawback of three-index subslice forms is that they are verbose. In fact,
    ever made a [proposal](https://github.com/golang/go/issues/25638) to make it less
    verbose, but it was declined.


