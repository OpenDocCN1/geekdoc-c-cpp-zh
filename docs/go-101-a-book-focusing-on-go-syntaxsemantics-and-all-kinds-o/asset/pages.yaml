  md: '# Arrays, Slices and Maps in Go


    Strictly speaking, there are three kinds of first-class container types in Go,
    array, slice and map. Sometimes, strings and channels can also be viewed as container
    types, but this article will not touch the two kinds of types. All container types
    talked about in the current article are arrays, slices and maps.


    There are many container related details in Go. This article will list them by
    one.


    # Simple Overview of Container Types and Values


    Each value of the three kinds of types is used to store a collection of element
    values. The types of all the elements stored in a container value are identical.
    The identical type is the element type (of the container type) of container value.


    Each element in a container has an associated key. Any element value can be accessed
    or modified through its associated key. The key types of map must be comparable
    types (§14). The keys of array and slice types are all the built-in type `int`.
    The keys of an array or slice are non-negative integers which mark the positions
    of the elements in the array or slice. The non-negative integer keys are often
    indexed.


    Each container value has a length property, which indicates how many elements
    are stored in that container. The valid range of the integer keys of array or
    slice is from zero (inclusive) to the length (exclusive) of the array or slice.
    For each value of a map, the keys of that value can be an arbitrary value of the
    key type of the map type.


    There are many differences between the three kinds of container types. Most of
    the differences originate from the differences between the memory layouts of the
    three kinds of types. From the last, value parts (§17), we learned that an array
    consists of only one direct part, however a slice or map value may have an underlying
    part, which is referenced by the direct part of the slice or map value.


    Elements of an array or slice are both stored contiguously in a continuous memory
    segment. For an array, the continuous memory segment hosts the direct part of
    the slice. The implementation of the Go compiler/runtime adopts the hashtable
    algorithm. All elements of a map are also stored in an underlying continuous memory
    segment, but they may not contiguous. There may be many holes (gaps) within the
    continuous memory segment. Another common map implementation is the binary tree
    algorithm. Whatever algorithm is used, the keys associated with the elements of
    a map are also stored in (the underlying parts of) the map.


    We can access an element through its key. The time complexities of accesses on
    all container values are O(1), though generally map element accesses are several
    times slower than array and slice element accesses. But maps have two advantages
    over arrays and slices:'
