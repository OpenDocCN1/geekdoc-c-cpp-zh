    \ This is real memory, not kind of.\n\nFor example, the following function calls\
    \ and exits, and the memory blocks allocated for are not guaranteed to be garbage\
    \ collected in future garbage.\n\n```\nfunc memoryLeaking() {\n\ttype T struct\
    \ {\n\tv [1<<20]int\n\tt *T\n}\n\nvar finalizer = func(t *T) {\n\tfmt.Println(\"\
    finalizer\")\n}\n\nvar x, y T\n\n// The SetFinalizer call makes x escape to heap.\n\
    // runtime.SetFinalizer(&x, finalizer)\n\n// The following line forms a cyclic\
    \ reference group with two members, x and y.\n// This causes x and y are not collectable.\n\
    x.t, y.t = &y, x // y also escapes to heap.\n```\n\nSo, avoid setting finalizers\
    \ for values in a cyclic reference group.\n\nBy the way, we shouldn't use finalizers\
    \ as object destructors ($51).\n\n# Kind-of Resource Leaking by Deferring Function\
    \ Calls\n\nPlease read this article ($29) for details."
