    \ this FAQ item ($51) for reasons.\n\nFor example:\n\n```\npackage main\nimport\
    \ \"fmt\"\nfunc main() {\n    a := [5]int{2, 3, 5, 7}\n    s := make([]bool, 2)\n\
    ```"
