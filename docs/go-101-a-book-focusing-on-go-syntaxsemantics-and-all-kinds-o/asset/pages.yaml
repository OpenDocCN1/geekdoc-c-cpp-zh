  md: '# Named source code elements which can be declared together within ()


    Following source code elements (of the same kind) can be declared together within
    ():


    +   - import

    - type

    - variable

    - constant


    Functions can''t be declared together within (). Also labels.


    # Named source code elements which can be declared both inside functions and outside
    any functions


    Following named source code elements can be declared both inside functions and
    outside any functions:


    +   - type

    - variable

    - constant


    Imports must be declared before declarations of other elements (and after the
    package clause).


    Functions can only be declared outside any functions. Anonymous functions can
    be defined inside other function bodies, but such definitions are not function
    declarations.


    Labels must be declared inside functions.


