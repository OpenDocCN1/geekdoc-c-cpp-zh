    \ from one map will reflect on the other map.\n\nLike map assignments, if a slice\
    \ is assigned to another slice, they will share all (underlying) elements. Their\
    \ respective lengths and capacities equal to each other. However, if the length/capacity\
    \ of one slice changes, the change will not reflect on the other slice.\n\nWhen\
    \ an array is assigned to another array, all the elements are copied from the\
    \ source to the destination. The two arrays don't share any elements.\n\nExample:\n\
    \n```\npackage main\nimport \"fmt\"\nfunc main() {\n    m0 := map[int]int{0:7,\
    \ 1:8, 2:9}\n    m1 := m0\n    m1[0] = 2\n    fmt.Println(m0, m1) // map[0:2 1:8\
    \ 2:9] map[0:2 1:8 2:9]\n\nns0 := []int{7, 8, 9}\n    s1 := s0\n    s1[0] = 2\n\
    \    fmt.Println(s0, s1) // [2 8 9] [2 8 9]\n\nna0 := [...]int{7, 8, 9}\n    a1\
    \ := a0\n    a1[0] = 2\n    fmt.Println(a0, a1) // [2 8 9] [2 8 9]\n}\n```\n\n\
    # # Append and Delete Container Elements\n\nThe syntax of appending a key-element\
    \ pair (an entry) to a map is the same as the syntax of modifying map element.\
    \ For example, for a non-nil map value m, the following line\n\nm[k] = e\n\nput\
    \ the key-pair (k, e) into the map m if m doesn't contain an entry with key k,\
    \ or modify the value associated with key k if m contains an entry with key k.\n\
    \nThere is a built-in delete function which is used to delete an entry from a\
    \ map. For example, the following line will delete the entry with key k from the\
    \ map m. If the map m doesn't contain an entry with key k, it is a no-op, no panics\
    \ will occur, even if m is a nil map."
