    Assume M is a map type and n is non-negative integer, we can use the following
    two forms to create maps of type M.


    ```

    1 make(M, n)

    2 make(M)

    ```


    The first form creates new empty map which is allocated with enough space to hold
    at least n entries without reallocating memory. The second form takes only one
    argument, in which case new map with enough space to hold small number of entries
    without reallocating memory. The small number is compiler dependent.


    Assume S is a slice type, length and capacity are two non-negative integers, length
    is not larger than capacity, we can use the following two forms to create new
    types of slice S.


    ```

    1 make(S, length)

    2 make(S, length)

    ```


    The first form creates a slice with the specified length and capacity. The second
    form takes two arguments, in which case the capacity of the new slice is the same
    as its length.


    All the elements in the result slice of a make function are all initialized as
    the zero value (of the slice element type).


