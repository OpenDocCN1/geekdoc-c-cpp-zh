    # The sync.Once Type


    A sync.Once has a Do(func func()) method, which takes a solo parameter with type
    func().


    For an addressable Once value, the method o.Do(), is a shorthand of (&o).Do(),
    can be concurrently executed multiple times, in multiple goroutines. The arguments
    of these o.Do() calls should (but are not required) to be the same function value.


    Among these o.Do method calls, only one argument function will be invoked. The
    invoked argument function is guaranteed to exit before any o.Do method call returns.
    In other words, the code in the invoked argument function is guaranteed to be
    executed before any o.Do method call returns.


    Generally, a Once value is used to ensure that a piece of code will be executed
