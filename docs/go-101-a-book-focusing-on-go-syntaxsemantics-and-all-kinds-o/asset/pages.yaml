  md: "# Type Embedding\n\nFrom the article structs in Go ($16), we know that a struct\
    \ type can have many fields. Each field is composed of one field name and one\
    \ type field. In fact, sometimes, a struct field can be composed of one field\
    \ type only. The way we declare structs is called type embedding.\n\nThis article\
    \ will explain the purpose of type embedding and all kinds of details in type\
    \ embedding.\n\n# What Does Type Embedding Look Like?\n\nHere is an example demonstrating\
    \ type embedding:\n\n```\npackage main\n2\n3 import \"net/http\"\n4\n5 func main()\
    \ {\n6 type P *bool\n7 type M map[int]int\n8 var x struct {\n9 string // a defined\
    \ non-pointer type\n10 error // a defined interface type\n11 *int // a non-defined\
    \ pointer type\n12 P // an alias of a non-defined pointer type\n13 M // an alias\
    \ of a non-defined type\n14\n15 http.Header // a defined map type\n17 x.string\
    \ = \"Go\"\n18 x.error = nil\n19 x.int = new(int)\n20 x.P = new(bool)\n21 x.M\
    \ = make(M)\n22 x.Header = http.Header{}\n23}\n```\n\nIn the example above, six\
    \ types are embedded in the struct. Each type embedding forms an embedded field.\
    \ \n\nEmbedded fields are also called as anonymous fields. However, in fact, each\
    \ embedded field has a name specified implicitly. The unqualified (https://golang.org/ref/spec#Qualified_identifiers)\
    \ type name of an embedded field acts as the name of the field. For example, the\
    \ names of the embedded fields in the examples above are string, error, int, P,\
    \ M, Header respectively.\n\n# Which Types Can be Embedded?"
