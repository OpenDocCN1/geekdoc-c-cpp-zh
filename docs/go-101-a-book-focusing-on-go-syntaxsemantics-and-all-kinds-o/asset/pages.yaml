    A channel receive operation always returns at least one result, which is a value
    of the element type of the channel, and the channel ch must not be a send-only
    channel. Note that here <- is a channel-receive operator. Yet, its representation
    is the same as a channel-send operator.


    For many scenarios, a channel receive operation is viewed as a single-value expression.
    However, when a channel is used as the source value expression in an assignment,
    it can return an optional untyped boolean and a multi-value expression. The untyped
    boolean value indicates whether or not the first result is before the channel
    is closed. (Below we will learn that we can receive unlimited number of values
