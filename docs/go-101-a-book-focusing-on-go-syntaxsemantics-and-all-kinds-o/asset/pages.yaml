    # What is the difference between the function call time.Sleep(d) and the channel
    receive operation <-time.After(d)?


    The two will pause the current goroutine execution for a certain duration. The
    difference is the call `time.Sleep(d)` will let the goroutine enter sleeping-state,
    but still stay in running state (§13), whereas the channel receive operation <-time.After(d)`
    will leave the current goroutine blocking state.


    # Can I use finalizers as destructors?


    In Go programs, we can set a finalizer for an object by using `runtime.SetFinalizer`.
    Generally, the finalizer will be called before the object is collected. But finalizers
    are never intended to be used as destructors of objects. The finalizers by `runtime.SetFinalizer`
    are not guaranteed to run. So you shouldn''t rely on them for program correctness.


    The main intention of finalizers is for library maintainers to make extra efforts
    to remedy the damage caused by users not using the libraries correctly. For example,
    in a program, if we use the `os.Open` to open many files but forget to close them
    after using them, then the program will hold too many file descriptors until the
    program exits. This resource leak. The maintainers of the `os` package will set
    a finalizer on the every created `os.File` object. The finalizer will close the
    file descriptor in the `os.File` object. As mentioned above, the finalizers are
    not guaranteed to be called. They are just used to make the extent of resource
    leak as small as possible.


