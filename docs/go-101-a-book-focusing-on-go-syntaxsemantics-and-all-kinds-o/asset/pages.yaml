    \ seen in case operations, from top to bottom and left to right. Destination values\
    \ for receive operations (as value assignments) aren't needed to be evaluated\
    \ at this time.\n2. randomize the branch orders for locking the default branch\
    \ is always put at the last position in the result order. Channels may duplicate\
    \ in the case operations.\n3. sort all involved channels by the case operations\
    \ to avoid deadlock in the next step. Duplicate channels stay in the first N channels\
    \ of the sorted result, where N is the number of involved channels in the case\
    \ operations. Below, the channel lock order is a concept for the first N channels\
    \ in the sorted result.\n4. lock(a,), acquire the locks of) all channels by the\
    \ channel lock order produced in last step.\n5. poll each branch in the select\
    \ block by the order produced in step 2:\n    * (wait, step is 2)\n* if this is\
    \ a case branch and the corresponding channel operation is a send-to-closed-channel\
    \ operation, unlock all channels by the inverse channel lock order and make the\
    \ current goroutine panic. Go to step I2.\n* if this is a case branch and the\
    \ corresponding channel operation is non-blocking, perform the channel operation\
    \ and unlock all channels by the inverse channel lock order, execute the corresponding\
    \ case branch body. The channel operation may wake up another goroutine in blocking\
    \ state. Go to step I2.\n* if this is the default branch, then unlock all channels\
