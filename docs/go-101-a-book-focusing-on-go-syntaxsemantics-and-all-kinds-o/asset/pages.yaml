  md: 'The real and imaginary parts of a **complex64** value, and the real and imaginary
    parts of a **complex128** are both **float64** values.


    In memory, floating-point numbers in Go are stored in IEEE-754 format (https://en.wikipedia.org/wiki/IEEE_754).


    A boolean value represents a truth. There are two possible boolean values in memory,
    which are denoted by the two predefined constants, `false` and `true`. Name constants
    will be introduced in the next article ($7).


    In logic, a string value denotes a piece of text. A string stores a sequence of
    bytes, which is the UTF-8 encoding of the piece of text denoted by the string
    value. We can learn more strings from the article strings in Go ($19).


    Although there is only one built-in for boolean and string types, we can define
    custom boolean and string types and string types. There can be many boolean and
    string types. The same is for any kind of numeric types. The following are some
    type declarations examples. In these declarations, the `type` is a keyword.


    ```

    1 /* Some type definition declarations /

    2

    3 // status and bool are two different types.

    4 type status bool

    5 // MyString and string are two different types.

    6 type MinMaxScaler string

    7 // Id and uint64 are two different types.

    8 type Id uint64

    9 // real and float32 are two different types.

    10 type real float32

    11

    12 /* Some type alias declarations /

    13

    14 // boolean and bool denote the same type.

    15 type boolean = bool

    16 // Text and string denote the same type.

    17 type Text = string

    18 // U8, int8 and byte denote the same type.

    19 type U8 = uint8

    20 // char, rune and int32 denote the same type.

    21 type char = rune

