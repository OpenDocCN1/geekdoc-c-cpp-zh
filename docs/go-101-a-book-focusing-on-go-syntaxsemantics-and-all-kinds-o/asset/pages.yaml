  md: "# §13. Goroutines, Defer Function Calls and Panic/Recover\n\nExample:\n\n```\n\
    package main\n\nimport (\n    \"log\"\n    \"math/rand\"\n    \"time\"\n    \"\
    sync\"\n)\n\nvar wg sync.WaitGroup\n\nfunc Greetings(greeting string, times int)\
    \ {\n    for i := 0; i < times; i++ {\n        log.Println(greeting)\n       \
    \ d := time.Second * time.Duration(rand.Intn(5)) / 2\n        time.Sleep(d)\n\
    \    }\n    // Notify a task is finished.\n    wg.Done() // <= wg.Add(-1)\n}\n\
    \nfunc main() {\n    rand.Seed(time.Now().UnixNano())\n    log.SetFlags(0)\n \
    \   // register two tasks.\n    go Greetings(\"hi\", 10)\n    go Greetings(\"\
    hello\", 10)\n    wg.Wait() // block until all tasks are finished.\n}\n```\n\n\
    Run it, we can find that, before the program exits, each of the two new goroutines\
    \ prints greetings.\n\n# Goroutine States\n\nThe last example shows that a goroutine\
    \ may stay in (and switch between) two states, running and blocking. In example,\
    \ the main goroutine enters the blocking state when the wg.Wait method is called,\
    \ and enter running state again when the other two goroutines finish their respective\
    \ tasks.\n\nThe following picture depicts a possible lifecycle of a goroutine.\n\
    \n![](img/3a90c5f4301e0f48c5d016c7feed3244_90_0.png)"
