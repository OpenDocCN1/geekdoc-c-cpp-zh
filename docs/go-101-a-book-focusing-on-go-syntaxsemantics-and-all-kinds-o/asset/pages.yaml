  md: '# Basic Control Flows


    The control flow code blocks in Go are much like other popular programming languages,
    but there are also many differences. This article will show these similarities
    and differences.


    # An Introduction of Control Flows in Go


    There are three kinds of basic control flow code blocks in Go:


    +   * `if-else` two-way conditional execution block.

    * `for` loop block.

    * `switch-case` multi-way conditional execution block.


    There are also control flow code blocks which are related to certain kinds of
    types in Go.


    +   * `for-range` loop block for container ($18) types.

    * `type-switch` multi-way conditional execution block for interface ($23) types.

    * `select-case` block for channel ($21) types.


    Like many other languages, Go also supports `break`, `continue` and `goto` code
    execution jump statements. There besides, there is a special code jump statement
    in Go, `fallthrough`.


    Among the six kinds of control flow, except the `if-else` control flow, the other
    five are called **breakable control flow blocks**. We can `break` statements to
    make executions out of breakable control flow blocks.


    `for` and `for-range` loop blocks are called **loop control flow blocks**. We
    can use `continue` statements to loop a step advance in a loop control flow block.


    Please note, each of the above mentioned control flow blocks is a statement, and
    it may contain many other sub-statements.


    Above mentioned control flow statements are all in narrow sense. The mechanisms
    introduced in the article `goroutines`, `deferred function calls` and `panic/recover`
    ($13), the concurrency synchronization techniques introduced in the later article
    `concurrency synchronization overview` ($36) can be viewed as control flow statements
    in broad sense.


