    On the other hand, Go can also be viewed as a C language framework. This is mainly
    reflected from the fact that Go supports several kinds of types whose memory structures
    are not totally transparent, whereas the main characteristic of C types is the
    structures of C values are transparent. Each C value in memory occupies one continuous
    memory segment. However, values of some Go types may often consist of more than
    one continuous memory segments.


    Each continuous memory segment hosts a value, more speaking precisely, a value
    part. The following picture depicts a multi-part value. Its direct part is referencing
    its indirect underlying part.


    | Direct Value Part | Underlying Value Part |


