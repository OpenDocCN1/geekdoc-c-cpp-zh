  md: '# Goroutines, Deferred Function Calls and Panic/Recover


    This article will introduce goroutines and deferred function calls. Goroutine
    and deferred function calls are two unique features in Go. This article also explains
    panic and recover mechanism. Not all knowledge relating to these features is covered
    in this article, more will be introduced in future articles.


    # # Goroutines


    Goroutines are also called green threads. Green threads are maintained and scheduled
    by the language runtime instead of the operation systems. The cost, as memory
    consumption and context switching, of a goroutine is much less than an OS thread.
    So, it is not a problem for a Go program to maintain thousands of goroutines at
    the same time, as long as the system memory is sufficient.


    Go doesn''t support creating threads in user code. So, using goroutines is the
    only way to do concurrent programming (program scope) in Go.


    Each Go program starts with one goroutine, we call it the main goroutine. A goroutine
    can create new goroutines. It is super easy to create a new goroutine in Go, just
    make a function call the go keyword. The function call will be executed in a newly
    created goroutine. The new created goroutine will exit along the exit of the called
    function.


    All the results of a goroutine call (if the called function returns values) must
    be discarded in the function statement. The following is an example which creates
    two new goroutines in the main goroutine. In the example, time.Duration is a custom
    type defined in the time package. Its typing is the built-in int64. Underlying
    types will be explained in the next article (S14).


    ```

    1 package main

    2

    3 import (

    4 "log"

    5 "math/rand"

    6 "time"

    7 )

    8

    9 func SayGreetings(greeting string, times int) {

    10 for i := 0; i < times; i++ {

    11 log.Println(greeting)

    12 d := time.Second * time.Duration(rand.Intn(5)) / 2

    13 time.Sleep(d) // sleep for 0 to 2.5 seconds

    14 }

    15 }

    ```'
