  md: "# The Method Set of a Type\n\nEach type has a method set ($22) associated with\
    \ it.\n\n+   - For a non-interface type, its method set is the prototype collection\
    \ of all the methods (either explicit or implicit ones) declared ($22) for it.\n\
    - For an interface type, its method set is the prototype collection it specifies.\n\
    \nFor convenience, the method set of a type is also called the method set of any\
    \ value of the type.\n\nTwo non-defined interface types are identical if their\
    \ method sets are identical. Please note, nonexported names, which start with\
    \ lower-case letters, from different packages will be always viewed as two different\
    \ method names, even if the method names are the same in literal.\n\n# What Are\
    \ Implementations?\n\nIf the method set of an arbitrary type, `T`, may be an interface\
    \ type or not, is a super set of the method set of an interface `I`, then we say\
    \ `T` implements interface `I`.\n\nImplementations are all implicit in Go. The\
    \ implementation relations are not needed to be specified for compilers in code\
    \ explicitly. There is not `implements` keyword in Go. Go compilers will check\
    \ the implementation relations automatically as needed.\n\nAn interface type always\
    \ implements itself. Two interface types with the same method set implement each\
    \ other.\n\nFor example, in the following example, the method sets of struct pointer\
    \ type `Book`, integer type `MyInt` and pointer type `MyInt` all contain the method\
    \ prototype `About() string`, so they all implement the mentioned interface type\
    \ `interface {About() string}`.\n\n```\ntype Book struct {\n    name string\n\
    \    // other fields ...\n}\nfunc (b Book) About() string {\n    return \"Book:\
    \ \" + b.name\n}\ntype MyInt int\nfunc (m MyInt) About() string {\n```"
