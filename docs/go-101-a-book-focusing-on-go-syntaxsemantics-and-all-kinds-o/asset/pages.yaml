    Iota is the ninth letter of the Greek alphabet. In Go, iota is used in constant
    declarations. In each constant declaration group, its value is N in the Nth constant
    specification in that declaration group.


    # Why isn''t there a built-in closed function to check whether or a channel is
    closed?


    The reason is the usefulness of such function is very. The return result of a
    such function may not be able to reflect the latest status of the input channel
    argument. So it is not a good idea to make decisions relying on the return result.


    If you need such a function, it would be effortless to write one by yourself.
    Please read this article ($38) to get how to write closed functions and how to
    avoid using such function.


    # Is it safe for a function to return pointers of local variables?


    Yes, it is absolutely safe in Go.


    Go compilers which support stack will escape analysis. For the standard Go compiler,
    if the escape analyzer will only be used in current function for sure, it will
    allocate the memory block on stack, otherwise then the memory block will be allocated
    on heap. Please read memory block ($43) for more information.


