    # # What does the compile error message non-name on left side of := mean?


    Up to Go (1.12), there is a mandatory rule (https://golang.org/ref/spec#ShortVariableDeclaration)
    for short variable declarations:


    All items at the left side of := must be identifiers and at least one of them
    must be a variable name. (https://golang.org/ref/spec#Identifiers)


    This means contains (x*F), struct fields (x.f), pointer dereferences (*p) and
    qualified identifiers (aPackage.Value) can''t appear at the left side of :.


    Currently, there is an open issue (https://github.com/golang/go/issues/377) which
    was merged with a more related (https://github.com/golang/go/issues/6842) for
    this problem. It looks Go authors want to leave this unresolved until Go 2.0.'
