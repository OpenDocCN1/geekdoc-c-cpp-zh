    # ## Calls to Many Built-in Functions With Return Results Can''t Deferred


    In Go, the result values of a call to a custom functions can be absent (discarded).
    However, for built-in functions with non-blank result lists, the result values
    of their calls must''t be absent ($49) (at least for the Go compiler 1.12), except
    the calls to the built-in recover functions. On the other hand, we have learned
    that the result values of a deferred call must be discarded, so the calls to many
    built-in functions can''t be deferred.


    Fortunately, the needs to defer built-in functions (with non-blank result lists)
    are rare in practice. As for I know, calls to the built-in function may need to
    be deferred. For this case, we can defer a call to an anonymous function which
    wraps the append call.


    ```

