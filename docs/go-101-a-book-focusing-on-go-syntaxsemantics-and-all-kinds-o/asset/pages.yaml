  md: '# Memory Leaking Scenarios


    When programming in a language supporting auto collection, generally we don''t
    care about memory leaking problems, for the runtime will collect unused memory
    regularly. However, we need to be aware of some special scenarios which may cause
    kind-of or or real memory leaking. The remaining of the current article will list
    several scenarios.


    # Kind-of Memory Leaking Caused by Substrings


    Go specification does not specify whether or not the result string and string
    involved in a substring expression share the same memory block sequences ($19)
    of the strings. The standard Go compiler/runtime does them share the same underlying
    memory block. This is a good design, which is both memory and CPU consuming wise.
    But it may cause kind-of memory leaking sometimes.


    For example, after the demo function in the following is called, there will be
    1M memory leaking (kind of), until the package-level variable so is modified elsewhere.


    ```

    var s string // a package-level variable

    // A demo purpose function.

    func f(s string) {

    s0 = s1[:50]

    // Now, s0 shares the same underlying memory block

    // with s1. Although s1 is not alive now, but s0

    // is still alive, so the memory block they share

    // couldn''t be collected, there are only 50

    // bytes used in the block and all other bytes in

    // the block become unavailable.

    func demo() {

    s := createStringLengthOnHeap(1 << 20) // 1M bytes

    f(s)

    }

    ```


    To avoid this kind of memory leaking, we can convert the substring to a []byte
    value back to string.


    ```

    func f(s string) {

    s0 = string([]byte(s1[:50]))

    }

    ```


    The drawback of the way above to avoid the kind-of memory leaking is there are
    two 50-byte duplicates in the conversion process, one of them is unnecessary.


    We can use one of the optimizations ($19) made by the Go compiler to avoid the
    unnecessary duplicate, with a small extra cost of one byte memory wasting.'
