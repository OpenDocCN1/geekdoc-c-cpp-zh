  md: '# §14. Overview of Go Type System


    An instance of a type is called a value, of the type. A type may have many values,
    one of them is the zero value of the type. Values of the same type share some
    common properties.


    Each type has a zero value, which can be viewed as the default value of the type.
    The predeclared nil identifier can be used to represent zero values of slice,
    map, function, channel, pointer (including type-unsafe pointer) and interfaces.
    About more on nil, read nil in Go (§47).


    There are several kinds of value representation forms in code, including literals
    ($6), named constants ($7), variables ($8) and expressions ($11), though the former
    three can be viewed as special cases of the latter.


    Value may be typed or untyped ($7).


    All kinds of basic literals have been introduced in the article, basic types and
    basic value literals ($6). There are two more kinds of literals in Go, composite
    literals and function literals.


    Function literals, as the names, are used to represent function values. A function
    declaration ($9) is composed of a function literal and an identifier (the function
    name).


    Composite literals are used to represent values of struct and container types
    (arrays, slices and maps), Please read structs in Go ($16) and containers in Go
    ($18) for details.


    There are no literals of value pointer, channel and interface types.


    # Concept: Value Parts


    At run time, many values are stored somewhere in memory. In Go, each of such values
    has a direct path, some of them one or more indirect paths. Each value part occupies
    a continuous memory segment. The indirect underlying parts of a value are referenced
    by its direct path through pointers ($15).


    The terminology value part ($17) is not specified in Go. It is just used in Go
    101 to make some explanations simpler and help Go programmers understand Go types
    and values better.


    # Concept: Value Sizes


    When a value is stored in memory, the number of bytes occupied by the direct path
    of the value is called the size of the value. All the values of the same type
    have the same size, so the size of values of a type is often called the Sizeof,
    or size of value, of the type.


    We can use Sizeof function in the unsafe standard package to get the size of any
    value.


    Go specification doesn''t specify size requirements for non-numeric types. The
    requirements for value of all kinds of basic numeric types are listed in the article
    basic'
