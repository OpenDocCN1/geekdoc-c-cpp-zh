  md: '# Functions in Go


    Function declarations and calls ($9) have been explained before. The current article
    will touch more function related concepts and details in Go.


    In fact, function is kind of first-class citizen types in Go. In other words,
    we can use functions as values. Although Go is a static language, Go functions
    are very flexible. The feeling of using Go functions is like using many dynamic
    languages.


    There are some built-in functions in Go. These functions are declared in builtin
    and unsafe standard code packages. Built-in functions have several differences
    from custom ones. One difference is that built-in functions support generic parameters,
    but custom declared ones''t (up to now, Go 1.12). More differences will be mentioned
    below.


    # Function Signatures and Function Types


    The literal of a function type is composed of the func keyword and a function
    signature literal. A function signature is composed of two type list, one is the
    input parameter type list, the other is the output result type lists. Parameter
    and result names can appear in function type and signature literals, but the names
    are not important.


    We use a function type literal as a function signature literal.


    Here is a literal of a function type:


    ```

    func (a int, b string, c string) (x int, y int, z bool)

    ```


    From the article function declarations and calls ($9), we have learned that consecutive
    parameters and the results of the same type can be declared together. So the above
    is equivalent to


    ```

    func (a int, b string, c string) (x int, y int, z bool)

    ```


    Parameter and result names are not important in the literals (as long as there
    are no duplicate-blank names), the ones above are equivalent to the following.


    ```

    func (x int, y int, z string) (a int, b, c bool)

    ```


    Variable (parameter and result names) can be blank identifier _. The ones above
    are equivalent to this one.


    ```

    func (_ int, _, string) (_, int, _, bool)

    ```


    The parameter names must be either present or absent (anonymous). The same rule
    is for result names. The ones above are equivalent to the following ones.


    ```

    func (int, string, string) (int, int, bool) // the standard form

    func (a int, b string, c string) (int, int, bool)

    func (x int, _ string, z string) (int, int, bool)

    ```'
