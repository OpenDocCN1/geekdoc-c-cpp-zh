    # ## Arithmetic Operators


    Go supports basic binary arithmetic operators:


    | Operator | Name | Requirements for the Two Operands |

    | --- | --- | --- |

    | + | addition | |

    | - | subtraction | |

    | * | multiplication | The two operands must be both values of the same basic
    numeric type.

    | / | division | |

    | % | remainder | The two operands must be both values of the same basic integer
    type |


    The five operators are also called sum, difference, product, quotient and modulo
    operators, respectively. Go 101 will not explain how these operators work in detail.


    Go supports six bitwise binary arithmetic operators:


    | Operator | Name | Requirements for the Two Oper and Mechanism Explanations |

    | --- | --- | --- |

    | & | bitwise and | The two operands must be both values of the same integer type.

    | | | bitwise or | Mechanism explanations (a value with the subscript 2 is the
    binary literal of the value):

    | ^ | bitwise xor | - 11002 & 10102 results 10002

    - 11002 | 10102 results 11102

    - 11002 ^ 10102 results 01102

    - 11002 &^ 10102 results 01002 |

    | &^ | bitwise clear | The left operand must be an integer and the right operand
    must be an unsigned integer (or an untyped §7) integer constant which is representable
    as a uint value)(1).

    | << | bitwise left shift | Mechanism explanations:

    - 110002 << 3 results 11000002

    - 11002 >> 3 results 12 |

    | >> | bitwise right shift | If the left operand of a bitwise-right-shift operation
    is (or viewed as) signed integer, the sign bit (the highest bit) in the left operand
    will always be kept in the result. For example, if the left operand is an int
    value -128, or 10000002 in the binary literal, 10000002 >> 1 results 11000002,
    a.k.a., -64. |


    (1) Since Go the coming 1.13, it is possible that the requirements of the right
    operand in a bitwise shift operation will be relaxed to any integers (https://github.com/golang/go/issues/19133),
    either


