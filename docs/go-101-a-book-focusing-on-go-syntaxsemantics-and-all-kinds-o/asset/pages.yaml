  md: '# # Introduction to Source Code Elements


    Go is known for its simple and clean syntax. This article introduces the common
    source code elements in programming through a simple example. This will help new
    gophers (Go programmers) get a basic idea of the usage of Go.


    # ## Programming and Source Code Elements


    Programming can be viewed as manipulating operations in all kinds of ways to reach
    certain goals. Operations write data and read data from hardware devices to complete
    tasks. For modern computers, elemental operations are low-level CPU and GPU instructions.
    Common hardware devices include memory, disk, network card, graphics card, monitor,
    keyboard and mouse, etc.


    Programming by manipulating low-level instructions directly is tedious and error
    prone. High-level programming languages make some encapsulations for low-level
    operations, and make some abstractions for data, to make programming more intuitive
    and human friendly.


    In popular high-level programming languages, operations are mainly achieved by
    calling **functions** and using **operators**. Most popular high-level programming
    languages support several kinds of conditional and loop **control flows**, we
    can think them as special operations. The syntax of these control flows is close
    to human language so that the code written by programmers is easy to understand.


    Data is abstracted as **types** and **values** in most high-level programming
    languages. Types can be viewed as value types, and values can be viewed as instances.
    Most languages support several built-in types, and also support custom types.
    The type system of a programming language is the spirit of the language.


    There may be a large number of values used in programming. Some of them can be
    represented with their **literals** (text representations) directly, but others
    can''t. To make programming flexible and less error prone, many values are named.
    Such values include **variables** and named **constants**.


    Named functions, named values (including variables and named constants), defined
    types and type aliases are **resources** in Go 11. The names of resources must
    be [identifiers](s5). Package names and package names should also be identifiers.


    High-level programming code will be translated to low-level CPU instructions by
    compilers to get executed. To help compilers parse high-level programming code,
    many words are reserved to prevent them from being used as identifiers. Such words
    are called [keywords](s5).


    Many modern high-level programming languages use **packages** to organize code.
    A package must **import** another package to use the exported (public) resources
    in the other package. Package names and package import names should also be identifiers.


    Although the code written in high-level programming languages is more understandable
    than'
