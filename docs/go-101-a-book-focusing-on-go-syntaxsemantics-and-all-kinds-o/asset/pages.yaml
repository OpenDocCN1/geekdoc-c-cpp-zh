  md: "# §13. Goroutines, Deferred Calls and Panic/Recover\n\nNote, a goroutine in\
    \ sleeping (by calling time.Sleep function) or waiting the response of a system\
    \ call or a network connection is viewed as staying in runtime.\n\nWhen a new\
    \ goroutine is created, it will enter running state automatically. If for any\
    \ reason, a goroutine stays in blocking state, it will never leave. Such cases,\
    \ except rare ones, should be avoided in concurrent programming.\n\nA blocking\
    \ goroutine can only be unlocked by an operation made in another goroutine. If\
    \ all goroutines in a Go program are in blocking state, all of them will stay\
    \ in blocking state forever. This can be viewed as an overall deadlock. When this\
    \ happens in a program, the standard Go runtime will try to crash the program.\n\
    \nThe following program will crash, after two seconds:\n\n```\npackage main\n\
    import (\n    \"sync\"\n    \"time\"\n)\nvar wg sync.WaitGroup\nfunc main() {\n\
    \    wg.Add(1)\n    go func() {\n        time.Sleep(time.Second * 2)\n       \
    \ wg.Wait()\n    }()\n    wg.Wait()\n}\n```\n\nThe output:\n\n```\nfatal error:\
    \ all goroutines are asleep - deadlock!\n..\n```\n\nLater, we will learn more\
    \ operations which will make goroutines enter blocking state.\n\n# Goroutine Schedule\n\
    \nNot all goroutines in running state are being executed at a given time. At any\
    \ given time, the maximum number of goroutines being executed will not exceed\
    \ the number of the logical CPUs available for the current program. We can call\
    \ the runtime.NumCPU(https://golang.org/pkg/runtime#NumCPU) function to get the\
    \ number of logical CPUs available for the current program. Each logical CPU can\
    \ execute only one goroutine at any given time. Go must frequently switch contexts\
    \ between goroutines to let each goroutine have chances to execute. This is similar\
    \ to how operating systems switch execution"
