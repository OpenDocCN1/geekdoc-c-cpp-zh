  md: '# Code Blocks and Identifier Scopes


    This article will explain the code blocks and identifier scopes in Go.


    (Please note, the definitions of code block hierarchies in this article are a
    little different from Go specification.)


    # Code Blocks


    In a Go project, there are four kinds of code blocks (also called blocks later):


    +   - the **universe block** contains all project source code.

    - each package has a **package block** containing all source code, excluding the
    package import declarations in that package.

    - each file has a **file block** containing all source code, including the package
    import declarations, in that file.

    - generally, a pair of braces {} encloses a **local block**. However, some local
    blocks don''t enclosed with {}, such blocks are implicit local blocks. The local
    blocks enclosed with {} are explicit local blocks. The {} in composite literals
    and type definitions don''t form blocks.


    Some kinds of control flows are followed by some implicit code blocks.


    +   - An `if`, `switch` or `for` keyword is followed by two nested local blocks.
    One is implicit, the other is explicit. The explicit is nested in the implicit
    one. If such a keyword is followed by a short declaration, then the variables
    are declared in the implicit block.

    - An `else` keyword is followed by one explicit or implicit block, which is nested
    in the implicit block following its if. If another keyword, then the code block
    following the else can be implicit, otherwise the code block must be explicit.

    - An `select` keyword is followed by one explicit block.

    - Each `case` and `default` keyword is followed by one implicit block, which is
    nested in the explicit block following its corresponding `switch` or `select`
    keyword.


    The local blocks aren''t nested in any other blocks are called top-level (or package-level)
    local blocks. Top-level local blocks are all function bodies.


    Note, the input parameters and output results of a function are viewed as declared
    in explicit body block of the function, even if their declarations stay out of
    the pair of braces enclosing the function body block.


    Code block hierarchies:


    +   - package blocks are nested in the universe block.'
