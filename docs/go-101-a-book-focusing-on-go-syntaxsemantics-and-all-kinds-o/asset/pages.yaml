  md: 'The current Go specification (version 1.12) says (https://golang.org/ref/spec#Struct-types)


    An embedded field must be specified as a name T or as a pointer to a non-interface
    type name *T, and T itself may not be a pointer type.


    The above description is accurate before 1.9. However, with the introduction of
    type aliases in Go 1.9, the description becomes a little outdated and inaccurate
    (https://github.com/golang/issues/22005). For example, the description doesn''t
    include the case of the P field in the example in the last section.


    Here, the article tries to provide more descriptions.


    +   * A type T can be embedded as an embedded field T denotes a pointer type which
    base type is either a pointer or an interface type.

    * A pointer type *T, where T is a type name denoting the base type of the pointer
    type, can be embedded as an embedded field only if T doesn''t denote a pointer
    or interface type.


    Or, a slight modification on the Go specification:


    An embedded field must be specified as the form T or *T, where T is a type name
    and the embedded type may not be a pointer type whose base type is a pointer or
    interface type.


    The following lists some example types which and can''t be embedded:


    ```

    1 type Encoder interface {Encode([]byte) []byte}

    2 type Person struct {name string; age int}

    3 type Alias = struct {name string; age int}

    4 type AliasPtr = *struct {name string; age int}

    5 type IntPtr *int

    6 type AliasPP = *IntPtr

    7

    8 // These types and aliases can be embedded.

    9 Encoder

    10 Person

    11 *Person

    12 Alias

    13 *Alias

    14 AliasPtr

    15 int

    16 *int

    17

    18 // These types and aliases can''t be embedded.

    19 AliasPP // base type is a pointer type

    20 *Encoder // base type is an interface type

    21 *AliasPtr // base type is a pointer type

    22 IntPtr // defined pointer type

    23 *IntPtr // base type is a pointer type

    24 *chan int // base type is a non-defined type

    25 struct {age int} // non-defined non-pointer type

    26 map[string]int // non-defined non-pointer type

    27 []int64 // non-defined non-pointer type

    ```'
