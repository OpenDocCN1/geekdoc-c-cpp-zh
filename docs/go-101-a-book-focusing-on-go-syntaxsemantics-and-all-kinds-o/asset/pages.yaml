  md: "# # Atomic Operations for Values of Arbitrary Types\n\nThe `Value` type provided\
    \ in the `sync/atomic` standard package can be used to atomically and store values\
    \ of any type.\n\nType `*Value` has two methods, `Load` and `Store`. Add `Swap`\
    \ methods are not available for type `*Value`.\n\nThe input parameter and output\
    \ result of the `Load` and `Store` methods are both `interface{. So a call of\
    \ the `Store` can take a value of any type. But for an addressable `Value` v,\
    \ once the `v.Store()` (a shorthand of `(&v).Store()`) call has been called, the\
    \ subsequent `v.Store()` calls must take values of the same concrete type as the\
    \ argument of the `v.Store()` call, otherwise panic will occur. A `nil` interface\
    \ argument will also panic.\n\nExample:\n\n```\npackage main\nimport (\n    \"\
    fmt\"\n    \"sync/atomic\"\n)\nfunc main() {\n    type T struct {a, b, c int}\n\
    \    var ta T{1, 2, 3}\n    var v atomic.Value\n    v.Store(ta)\n    var tb =\
    \ v.Load().(T)\n    fmt.Println(tb) // {1 2 3}\n    fmt.Println(ta == tb) // true\n\
    \    v.Store(\"hello\") // will panic\n}\n```\n\nIn fact, we can use the pointer\
    \ functions explained in the last section to atomic operations for values of any\
    \ type, with one more level indirection. Both ways have their respective advantages\
    \ and disadvantages. Which should be depends on the requirements in practice.\n\
    \n# # Memory Order Guarantee Made by Atomic Operations in Go\n\nFor easy using,\
    \ Go operations provided in the `sync/atomic` standard package are designed without\
    \ any relations to memory ordering. At least the official documentations don't\
    \ specify any memory guarantees made by the `sync/atomic` standard package. Please\
    \ read"
