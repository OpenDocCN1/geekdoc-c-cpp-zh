  md: '# §53. More Go Related Topics


    # The go/* Standard Packages


    The go/* standard packages provide functionalities of parsing Go source files,
    which are very useful to write custom Go tools. Please read go/types: The Go Type
    Checker (https://github.com/golang/example/tree/master/gotypes) and and package
    documentations (https://golang.org/pkg/go/) for how to use these packages.


    # More Build Modes


    The go build command in the official Go SDK supports several build modes. Please
    run go help buildmode to show the available build modes or read the explanations
    for -buildmode option (https://golang.org/cmd/go/#hdr-Build-modes) instead. Except
    the default build mode, the most used build mode may be the plugin build mode.
    We can use the functions in the plugin standard package (https://golang.org/pkg/plugin/)
    to load and use the Go plugin files outputted by using the plugin build mode.


