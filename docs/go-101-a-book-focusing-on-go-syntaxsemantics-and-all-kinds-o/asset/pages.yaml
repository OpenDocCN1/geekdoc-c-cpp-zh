    # # The Assignment Requirement for 64-bit Word Atomic Operations


    **64-bit** words mean of values whose underlying types are int64 or uint64.


    The article atomic operations ($40) mentions a 64-bit atomic operations on a 64-bit
    word require the address of the 64-bit word must be 8-byte aligned. This is not
    a problem for the current 64-bit architectures supported by the standard Go compiler,
    because 64-bit words on these 64-bit architectures are always 8-byte aligned.


    However, on 32-bit architectures, the alignment guarantee made by the Go compiler
    for 64-bit words is only 4 bytes. 64-bit atomic operations on a 64-bit word is
    not 8-byte aligned panic at runtime. Worse, on very old CPU architectures, 64-bit
    atomic functions are not supported.


    At the end of sync/atomic documentation (https://golang.org/pkg/sync/atomic/#pkg-note-BUG),
    it mentions:


    > On x86-32, the 64-bit functions use instructions unavailable before the Pentium
    MMX.


    On non-Linux ARM, the 64-bit functions use instructions unavailable before the
    ARMv6 core.


    On both ARM and x86-32, it is the caller''s responsibility to arrange for 64-bit
    alignment of 64-bit words accessed atomically. The first word in a variable or
    an allocated array, or slice can be relied upon to be 64-byte aligned.


    So, things are not bad for two reasons.


    +   1. The old CPU architectures are not mainstream architectures nowadays. If
    a program needs to do synchronization for 64-bit words on these architectures,
    there are other [synchronization techniques](somelink) ($39) to rescue.'
