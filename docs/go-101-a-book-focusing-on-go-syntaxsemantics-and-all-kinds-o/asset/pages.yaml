    4     "fmt"

    5     "runtime"

    6     "sync"

    7 )

    8

    9 type Counter struct {

    10     m sync.Mutex

    11     n uint64

    12 }

    13

    14 func (c *Counter) Value() uint64 {

    15     c.m.Lock()

    16     defer c.m.Unlock()

    17     return c.n

    18 }

    19

    20 func (c *Counter) Increase(delta uint64) {

    21     c.m.Lock()

    22     c.n += delta

    23     c.m.Unlock()

    24 }

    25

    26 func main() {

    27     var c Counter

    28     for i := 0; i < 100; i++ {

