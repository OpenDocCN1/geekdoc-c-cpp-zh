  md: "# goto Statement and Label Declaration\n\nLike other languages, Go also supports\
    \ goto statement. The goto keyword must be followed by a label to a statement.\
    \ A label is declared with the form LabelName:, where LabelName must be an identifier.\
    \ A label which is not the blank identifier must be used at least once.\n\nA goto\
    \ statement will make the execution jump to the next statement following the declaration\
    \ of the label used in the goto statement. So a label declaration must be followed\
    \ by one statement.\n\nA label must be declared within a function body. A use\
    \ of a label can appear before or after the declaration of the label. A label\
    \ is not visible (and can't appear) outside the innermost code block the label\
    \ is declared in.\n\nThe following example uses a package goto statement and a\
    \ label to implement a loop control flow.\n\n```\npackage main\nimport \"fmt\"\
    \nfunc main() {\n    i := 0\nNext: // here, a label is declared.\n    fmt.Println(i)\n\
    \    if i < 5 {\n        goto Next // execution jumps\n    }\n}\n```\n\nAs above\
    \ has mentioned, a label is not visible (and can't appear) outside the innermost\
    \ code block the label is declared in. So the following example fails to compile.\n\
    \n```\npackage main\nfunc main() {\ngoto Label1 // error\n{\n    Label1:\n   \
    \ goto Label2 // error\n}\n{\nLabel2:\n}\n```\n\nAnother note, if a label is declared\
    \ within the scope of a variable, then the uses of the label can't appear before\
    \ the declaration of the variable. Identifier scopes will be explained in the\
    \ article blocks and scopes in Go ($32) later."
