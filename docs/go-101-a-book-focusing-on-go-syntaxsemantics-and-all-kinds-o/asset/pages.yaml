  md: '# Reflections in Go


    Go is a static language with reflect support. The remaining of this article will
    explain the reflection functionalities provided in the reflect standard package.


    It is very helpful to read the overview of Go type system ($14) and interfaces
    in Go ($23) articles before reading the remaining of the current article.


    # Overview of Go Reflection


    From the last article ($26), we know that currently Go lacks of generic support
    for custom types and functions. Go reflection brings dynamic functionalities to
    Go programming, which makes up for the lacking of custom generic program to some
    extent (though the reflection is less efficient than generic the CPU consuming
    view). Many standard code packages, such as the fmt and encoding, rely on reflection
    heavily.


    We can inspect Go through the values of the Type and Value types defined in the
    reflect standard package. The following two sections will show how to use values
    of the two types.


    One of the Go reflection design goals is any non-reflection operation should also
    be possible to applied through the reflection ways. For all kinds of reasons,
    this is not 100 percent achieved currently (Go 1.12). However, most non-reflection
    operations can be applied through the reflection ways. On the other hand, through
    the reflection we can do some operations which are impossible to be achieved through
    non-reflection ways. The operations which can''t can only be achieved through
    the reflection ways will be mentioned in the following sections.


    # The reflect Type and Values


    In Go, we can create a reflect.Type value from an arbitrary non-interface value
    by calling the reflect.TypeOf function. The result reflect.Type value represents
    the type of the interface value. Surely, we can also pass an interface value to
    a reflect.TypeOf call, but the call will return a reflect.Type value which represents
    the dynamic type of the interface value. In fact, the reflect.TypeOf function
    has only one parameter of type interface() and always return a reflect.Type value
    which represents the dynamic type of the interface parameter.


    The reflect.Type is an interface type. It specifies several methods (https://golang.org/pkg/reflect/#Type).
    We can call these methods to inspect the information of the type represented by
    a reflect.Type receiver value. Some of these methods apply for all kinds of types
    (https://golang.org/pkg/reflect/#Kind), some of them are one kind or several kinds'
