    values of the types in the second category as pointers or structs in programs.
    These definitions are just used in implementing Go Runtimes.


    In Go, each value assignment (including parameter passing, etc) is is a shallow
    value copy if the involved destination and source values have the same type (if
    they are different, we can think that the value will be implicitly converted to
    the destination type before assignment). In other words, only the direct part
    of the source value is copied to the destination value in an value assignment.
    If the source value has underlying value part(s), then the direct parts of the
    destination and source values will reference the same underlying value part(s),
    in other words, the destination and source values will share the same underlying
    value part(s).


