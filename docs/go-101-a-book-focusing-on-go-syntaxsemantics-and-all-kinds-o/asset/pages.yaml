    # Should a Method Be Declared With Pointer Receiver or Value Receiver?


    Firstly, from the last section, we know that sometimes we must declare methods
    with pointer receivers.


    In fact, we can always declare methods with pointer receivers without any logic
    problems. It is just a matter of program performance that sometimes it is better
    to declare methods with value receivers.


    For the cases value receivers and pointer receivers are both acceptable, there
    are some factors needed to be considered to make decisions.


    +   * Too many pointer copies may cause heavy workload for garbage collector.

    * If the size of a value receiver type is large, then the receiver copy cost may
    not be negligible. Pointer types are all `small-size ($34) types.

    * Declaring methods of value receivers and pointer receivers for the same base
    type is more likely to cause data races if the declared methods are called concurrently
    in multiple goroutines.

    * Values of the types in the `sync` standard package should not be copied, so
    defining methods with value receivers for types which `embedding` ($24) the types
    in the `sync` standard package is problematic.


    If it is hard to make a decision whether a method should use a pointer receiver
    or a value receiver, then just choose the pointer receiver way.


