    (BTW, nil and NULL in many other languages are also keywords.)


    # The Sizes of Nil Values With Types of Different Kinds May Be Different


    The memory layouts of all values of a type are always the same. nil values of
    the type are not exceptions (assume the zero values of the type can be represented
    as nil). The size of a nil value is always the same as the sizes of non-nil values
    whose types are the same as the nil value. But nil values of different kinds of
    types may have different sizes.'
