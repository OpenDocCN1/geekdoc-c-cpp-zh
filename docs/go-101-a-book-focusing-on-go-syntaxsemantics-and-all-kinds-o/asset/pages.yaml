  md: '# Memory Layouts


    This article will introduce type alignment and size guarantees in Go. It is essential
    to know the guarantees to ensure the sizes of structs properly and use the 64-bit
    functions in sync/atomic package.


    Go is a C family language, so many concepts talked in this article are shared
    with C language.


    # Type Alignment Guarantees in Go


    Type alignment guarantees are also called value alignment guarantees. If the alignment
    guarantee of a type T is N, then the address of every type T must be a multiple
    of N at runtime. We can also say the addresses of addressable values of type T
    are guaranteed to be N-aligned.


    In fact, each type has two alignment guarantees, for one when it is used as fields
    of other (struct) types, the other is for other cases (when it is used for variable
    declaration, array element type, etc). We call the former the field alignment
    guarantee of that type, and the latter one general alignment guarantee of that
    type.


    For a type T, we can call unsafe.Align(t) to get its general alignment guarantee,
    where t is a non-field value of type T, and call unsafe.Align(x.t) to get its
    field alignment guarantee, where x is a struct value and t is a field value of
    type T.


    Calls to the functions in the standard code packages are always evaluated at compile
    time.


    At runtime, for a value t of type T, we can call reflect.TypeOf(t).Align() to
    get the general alignment guarantee of type T, and call reflect.TypeOf(t).FieldAlign()
    to get the field alignment guarantee of type T.


    For the current Go compiler (1.12), the field alignment guarantee and the general
    alignment guarantee of a type are always equal. For gccgo compiler, this is false.


    Go specification only mentions a little on type alignment guarantees (https://golang.org/ref/size_and_alignment_guarantees):


    ```

    The following minimum alignment properties are guaranteed:

    1. For a variable of x type: unsafe.Alignof(x) is at least 1.

    2. For a variable of struct type: unsafe.Alignof(x) is the largest of all the
    values unsafe.Alignof(x.f) for each field f of x, but at least 1.

    3. For a variable of x array type: unsafe.Alignof(x) is the same as the alignment
    of a variable of the array''s element type.

    ```


    So Go does not specify the exact alignment guarantees for any types. It just specifies'
