    Note the types of using the return results of the three functions are uintptr.
    Below we will learn that uintptr values can be converted to unsafe pointers (and
    vice versa).


    Although the return results of calls of any of the three functions are consistent
    in the same program, they might be different operating system functions of different
    architectures, crossing compilers, and crossing compiler versions.


    Calls to the three function are always evaluated at compile time. Their results
    can be assigned to constants.


