    One problem of channels is, the experience of programming channel type is enjoyable
    and fun that programmers often prefer even to use for the scenarios which channels
    are not best for.


    # Channel Types and Values


    Like array, slice and map, each channel type has an element type. A channel can
    only transfer values of the element type (of type of) the channel.


    Channel types can be bi-directional or single-directional. Assume T is an arbitrary
    type,


    +   - chan T denotes a bidirectional channel type. Compilers allow both receiving
    values from sending values to bidirectional channels.

    - chan- T denotes a send-only channel type. Compilers don''t allow receiving values
    to send-only channels.

    - <-chan T denotes a receive-only channel type. Compilers don''t allow sending
    values to receive-only channels.


    T is called element types of these channels.


    Values of bidirectional type chan T can be implicitly converted to send-only type
    chan- T and receive-only type <-chan, T, but not vice versa (even if explicitly).
    Values of send-only type chan- T can''t be converted to receive-only type <-chan,
    T, and vice versa. Note that the <-- signs in chan type are literals.


    Each channel value has a capacity, which will be explained in the section after
    next. A channel value with a zero capacity is called unbuffered channel and a
    channel value with a non-zero capacity is called buffered channel.


    The zero values of channel types are represented by the predeclared identifier
    nil. A non-nil channel value must be created using the built-in make function.
    For example, make(chan int, 10) will create a channel whose element type is int.
    The second argument of the make function can specify the capacity of the new created.
    The second parameter is optional and its default value is zero.


