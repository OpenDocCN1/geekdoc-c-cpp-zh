  md: '# 38. How to Gracefully Close Channels


    In fact, even if there is a simple built-in closed to check whether or not a channel
    has been closed, its usefulness would be very limited, just like the len function
    for checking the current number of values stored in the value buffer of a channel.
    The reason is that the checked channel may have changed after a call to such functions,
    that the returned value may not already been able to reflect the latest status
    of the checked channel. Although it is okay to send values to a channel ch closed(ch)
    returns true, it is not safe to close the channel or continue sending values to
    the channel if the call closed(ch) returns false.


    # The Channel Closing Principle


    One general principle of using Go channels is don''t close a channel from the
    receiver side and don''t close a channel if the channel has multiple concurrent
    senders. In other words, should only close a channel in a sender routine if the
    sender is the only sender of the channel.


    (Below, we will call the above principle as channel closing principle.)


    Surely, this is not a universal principle to close channels. The universal principle
    is don''t close (or send values to) a non-closed non-nil channel any more, then
    a goroutine not close the channel safely. However, making such queries by a receiver
    or by one of many senders of a channel usually needs much effort, and often makes
    quite complicated. On the contrary, it is much easy to hold the channel closing
    principle mentioned above.


    # Solutions Which Close Channels Rudely


    If you would close a channel from the receiver side or in one of the multiple
    senders of the channel anyway, then you can use the recover mechanism ($13) to
    prevent the possible panic from crashing your program. Here is an example (assume
    the channel element type is T).


    ```

    1 func SafeClose(ch chan T) (justclosed bool) {

    2   defer func() {

    3     if recover() != nil {

    4       // The return result can be altered

    5       // in a defer function call.

    6       justclosed = false

    7     }

    8 }

    9

    10  // assume ch != nil here.

    11  close(ch) // panic if ch is closed

    12  return true // <> justClosed = true; return

    13 }

    ```


    This solution obviously breaks the channel closing principle.


    The same idea can be used for sending values to a potential closed channel.'
