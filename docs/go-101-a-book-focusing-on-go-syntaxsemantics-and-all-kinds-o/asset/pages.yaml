    the rough internal structures of internal channel objects is very helpful.


    We can think of each channel as maintaining three queues (all can be viewed as
    FIFO queues) internally:


    +   1. the receiving goroutine. The queue is a linked list without size limitation.
    Goroutines in this queue are all in blocking state and waiting to receive values
    from that channel.

    2. the sending goroutine. The queue is also a linked list without size limitation.
    Goroutines in this queue are all in blocking state and waiting to send values
    to that channel. The value (or the address of the value, depending on compiler
    implementation) each goroutine trying to send is also stored in the queue along
    with goroutine.

    3. the value buffer queue. This is a circular queue. Its size is equal to the
    capacity of the channel. The values stored in this buffer queue are all the element
    type of that channel. If the current number of values stored in the value buffer
    queue reaches the capacity of the channel, the channel is called in full status.
    If no values are stored in the value buffer queue of the channel, it is called
    in empty status. For a zero-capacity (unbuffered) channel, it is always in both
    full and empty status.


    Each channel internally holds a mutex lock which is used to avoid data races in
    all kinds of operations.


