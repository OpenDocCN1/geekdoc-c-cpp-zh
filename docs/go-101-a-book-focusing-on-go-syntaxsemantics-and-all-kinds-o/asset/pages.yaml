    # # Container Related Operations are Not Synchronized Internally


    Please note that, all container operations are not synchronized internally. Without
    using any data synchronization technique, it is okay for multiple goroutines to
    read a container concurrently, but it is not okay for multiple goroutines to manipulate
    a container concurrently and at least one goroutine modifies it. The latter case
    will cause data races, make even goroutines panic. We must synchronize the container
    operations manually. Please read the articles on data synchronizations (#36) for
    details.


