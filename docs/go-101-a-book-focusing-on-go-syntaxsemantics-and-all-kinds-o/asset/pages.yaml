    \ a sugar, not an intrinsic rule.\n- a value of type *T can always call methods\
    \ defined on type T. This is because it is legal to define a pointer value. This\
    \ convenience is not only a sugar, but also an intrinsic rule.\n\nIt is much reasonable\
