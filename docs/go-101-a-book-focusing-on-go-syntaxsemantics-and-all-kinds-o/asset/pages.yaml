  md: '# Memory Blocks


    Go is a language which supports automatic memory management, such as automatic
    memory allocation and automatic garbage collection. Go programmers can do programming
    without handling the verbose memory management. This ont brings much convenience
    and saves Go lots of time, but also helps Go programmers avoid many careless bugs.


    Although knowing the underlying memory implementation details is not necessary
    for Go programmers, understanding some concepts and being aware of facts in the
    memory management implementation by the standard Go compiler and runtime is very
    helpful for Go programmers to write quality Go code.


    This article will explain some concepts and list some of the implementation of
    memory block allocation and garbage collection by the Go compiler and runtime.
    Other aspects, such as memory apply and memory release in memory management, will
    not be touched in this article.


    # Memory Blocks


    A memory block is a continuous segment to host value parts ($17) at run. Different
    memory blocks may have different sizes, to host different value parts. One memory
    block may host multiple value parts at the same time, but each value part can
    only be hosted within one memory block, no matter how large the size of that part
    is. In other words, for any value part, it never crosses memory blocks.


    There are many reasons when one memory block may host multiple value parts. Some
    of them:


    +   - a struct value often has several fields. When a memory block is allocated
    for a struct value, the memory block will also host (the direct parts of) these
    fields value.

    - an array value has many elements. When a memory block is allocated for an array
    value, the memory block will also host (the direct parts of) the array elements.

    - the underlying element of two sequences may be hosted on the same memory block,
    the two element sequences can overlap with each other.


    # A Value References the Memory Blocks Which Host Its Value Parts


    We have known that a value part can reference another value part. Here, we extend
    the reference definition by saying a memory block is referenced by all the value
    parts it hosts. So if a value part v is referenced by another value part, the
    other value will also reference the memory block hosting v, indirectly.


    # When Will Memory Blocks Be Allocated?'
