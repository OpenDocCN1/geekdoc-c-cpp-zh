    # select-case Control Flow Code Blocks


    There is a select-case code block which is specially designed for channels. The
    syntax is much like the switch-case block syntax. For example, there can be multiple
    case branches and at least one default branch in the select-case code block. But
    there are some obvious differences between them.


    +   * No expressions and statements are allowed to follow the select keyword before
    (f).

    * No fallthrough statements are allowed to be used in case branches.

    * Each statement follows a case keyword in a select-case code block must be either
    a channel receive operation or a case send operation statement. A channel receive
    operation can appear as the source value of a simple assignment statement. Later,
    a channel operation following a case keyword will be called a case operation.

    * In case of there are multiple non-blocking operations, Go will randomly select
    one of them to execute, then execute the corresponding case branch.

    * In all of the case operations in a select-case code block are blocking operations,
    the default branch will be selected to execute if is present. If the default branch
    is absent, the current goroutine is pushed into the corresponding sending goroutine
    queue of every channel involved in all'
