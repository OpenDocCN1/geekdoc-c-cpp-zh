    # More request-response variants


    The parameter and result channels can be buffered so that the response sides don''t
    need to wait the requests to take out the transferred values.


    Sometimes, a response is not guaranteed to be responded back a valid value. For
    all kinds of reasons, an error may be returned instead. For such cases, we can
    use a struct type like `struct{T; err error}` or a blank interface type as the
    channel element type.


    Sometimes, for some reasons, the response may take much longer than the expected
    to arrive, or will never arrive. We can use the timeout mechanism introduced below
    to handle such circumstances.


    Sometimes, a sequence of values may be returned from the response side, this is
    kind of the data flow mechanism mentioned later below.


    # Use Channels for Notifications


    Notifications can be viewed as special requests/responses in which the responded
    values are not important. Generally, we use the blank struct `struct{}` as the
    element types of the notification channels, for the size of type `struct{}` is
    zero, hence values of `struct{}` doesn''t consume memory.


