    # # Why are two nil values equal sometimes?


    (The answer (https://golang.org/doc/faq#nil_error) in the Official Go FAQ may
    also answer this question.)


    An interface value can be viewed as a box which is used to encapsulate non-interface
    values. Only values whose the type of the interface value can be boxed (encapsulated)
    into the interface value. In Go, there are several kinds of types whose zero values
    are represented as the predeclared identifier nil. An interface value boxing is
    not a zero interface value, a.k.a., a nil value. However an interface value boxing
    a non-interface value doesn''t box boxing, so it is not, and doesn''t equal to,
    a nil interface value.


    When comparing a nil value and a non-interface value (assume they can be compared),
    the nil non-interface value will be converted to the type of the nil interface
    value before the going comparison. The conversion result is an interface value
    boxing copy of the non-interface value. The result value doesn''t box boxing,
    so it is not, or doesn''t equal to, the nil interface value.


    Please read interfaces in Go ($23) and nils in Go ($47) for detailed explanations.


    For example:


    ```

    1 package main

    2

    3 import "fmt"

    4

    5 func main() {

    6     var pi *int = nil

    7     var pb *bool = nil

    8     var x interface{} = pi

    9     var y interface{} = pb

    10    var z interface{} = nil

    11

    12    fmt.Println(x == y) // false

    13    fmt.Println(x == nil) // false

    14    fmt.Println(y == nil) // false

    15    fmt.Println(x == z) // false

    ```'
