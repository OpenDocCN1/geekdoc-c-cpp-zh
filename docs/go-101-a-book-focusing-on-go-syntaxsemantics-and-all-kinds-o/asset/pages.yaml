  md: "# # An Introduction of Go\n\nGo is a compiled and static programming language\
    \ from Google. Many of the core Go design and SDK development team members have\
    \ many years of experience in the field of programming language research.\n\n\
    Go has many features. Some are unique, some are borrowed from other programming\
    \ languages:\n\n+   - built-in concurrent programming support\n  - goroutines\
    \ (green threads) and start new goroutines easily.\n  - channels (based on CSP\
    \ model) and select mechanisms to do synchronizations between goroutines.\n- the\
    \ container types map slice are first-class citizens.\n- polymorphism through\
    \ interfaces.\n- value boxing and reflection through interfaces.\n- pointers.\n\
    - function closures.\n- methods.\n- deferred function calls.\n- type embedding.\n\
    - type deduction.\n- memory safety.\n- automatic garbage collection.\n- great\
    \ cross-platform compatibility.\n\nBesides above features, further highlights:\n\
    \n+   - The Syntax of Go is deliberately designed to be simple, clean, and similar\
    \ to other popular programming languages. This makes Go programming easy to pick\
    \ up.\n- Go comes with a great set of standard code packages which provide all\
    \ of common functionalities. Most of the packages are cross-platform.\n- Go also\
    \ has an community, and there plenty of high quality third party Go packages and\
    \ projects (https://github.com/avelino/awesome-go) to import and use.\n\nGo programmers\
    \ are called gophers.\n\nIn fact, although Go is compiled and static programming\
    \ language, Go also has many features which are usually only available in dynamic\
    \ script languages. It is hard to combine these two kinds into one language, Go\
    \ did it. In other words, Go owns the strictness of static languages and the flexibility\
    \ of dynamic languages. I can't say there are any compromises between the two,\
    \ but the effect of the compromises is weaker than the benefits of the combination\
    \ in Go.\n\nReadability is an important factor which affects the design of Go\
    \ heavily. It is not hard for a gopher to understand the Go code written by other\
    \ gophers.\n\nCurrently, the most popular Go compiler is written in Go and maintained\
    \ by the Go design team."
