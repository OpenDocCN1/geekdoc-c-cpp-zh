    # # Are 64-bit integer values guaranteed to be 64-bit aligned so that they can
    be accessed atomically?


    The addresses passed to the 64-bit functions in sync/atomic package must be 64-bit
    aligned, otherwise, calls to these functions may fail at run time.


    For the standard Go compiler and gccgo compiler on 64-bit architectures, 64-bit
    integers are guaranteed to be 64-bit aligned. They can always be accessed atomically
    without any problems.


    On 32-bit architectures, 64-bit integers are only guaranteed to be 32-bit aligned.
    Accessing many 64-bit integers atomically may cause panics. However, there are
    some ways to guarantee 64-bit integers to be relied upon by 64-bit aligned. Please
    read memory layouts in Go (§44) for details.


