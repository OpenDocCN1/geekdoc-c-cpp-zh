  md: '# #32. Code Blocks and Identifier Scopes


    +   * file blocks are also directly nested in the universe block, instead of package
    blocks. (This explanation is different from Go specification and the go/* standard
    packages.)

    * each top-level local block is nested in both a package block and a file block.
    (This explanation is different from Go specification and the go/* standard packages.)

    * a non-top local block is nested in another local block.


    (The differences in Go specification are to make the explanation of identifier
    shadowing simpler below.)


