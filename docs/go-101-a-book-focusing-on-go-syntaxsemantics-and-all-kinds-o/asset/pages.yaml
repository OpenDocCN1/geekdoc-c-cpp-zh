    that Go is a simple language and I had mastered Go programming. At that time,
    I had collected many details in Go programming. I thought I can archive these
    details into a book. Though it should be an easy job.


    I was wrong. I was overconfident. In trying to make explanations for some details,
    I found I couldn''t explain them clearly. With more and more confusions were gathered,
    I felt my Go knowledge was so limited that I was still a newbie Go programmer.


    I gave up writing that book.


    # Gave up? Isn''t this book almost finished now?


    It was that book being cancelled, not the book Go 101. I eventually cleared almost
    all the confusions by reading official Go documentations and all kinds of Go articles
    on Internet, and by finding answers from some Go forums and the Go project issue
    tracker.


    I spent about one year clearing the confusions. In the period, from time to time,
    I had cleared most confusions on a topic and regained the confidence on that topic,
    I wrote one blog article for that topic. In the end, I had written twenty Go articles.
