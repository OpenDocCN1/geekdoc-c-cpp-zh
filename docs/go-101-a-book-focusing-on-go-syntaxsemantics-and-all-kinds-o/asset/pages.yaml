  md: '# # The Official Go SDK


    Currently, the tools in the official Go SDK are the most used tools to develop
    Go projects. In Go 101 article series, all examples are compiled and verified
    with the standard Go compiler.


    This article will introduce how to set up the Go development environment and how
    to run simple programs. Some tools of the official Go SDK will also be introduced.


    # ## Install Go SDK


    Please [download](https://golang.org/doc/install/) the official Go SDK and install
    it according the instructions shown in the download page.


    The version of an official Go release is consistent with the highest Go language
    version release outputs. For example, the latest Go 1.12.x supports all Go language
    versions from 1.0 to Go 1.12.


    The path to the `bin` subfolder in the Go installation root path must be put in
    the `PATH` environment variable to execute the manly (`go` subcommands) in the
    SDK without inputting their full paths. If Go is installed with an installer or
    by a package manager, the path to the `bin` subfolder may have already set in
    the `PATH` environment variable automatically for you.


    Earlier Go SDK versions may require `GOROOT` and `GOPATH` environment variables
    to be set. The latest Go has no such requirements. The default value of `GOPATH`
    is the path to the `go` folder under the home directory of the current user. `GOPATH`
    environment may list multiple paths.


    # ## The Simplest Go Program


    Let''s write a simple example and learn how to run Go programs.


    The following program is the simplest Go program.


    ```

    package main

    func main() {

    }

    ```


    The words `package` and `func` are two keywords. The two `main` words are identifiers.
    Keywords and identifiers are introduced in [a coming article](https://example.com)
    ($5).


    The first line `package main` specifies the package name (`main` here) of the
    source file.


    The second line is a blank line for better readability.'
