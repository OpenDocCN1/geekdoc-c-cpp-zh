  md: "# #28. Line Break Rules in Go\n\n```\n11  sum += i;\n12  ++;\n13  }\n14  fmt.Println(sum);\n\
    15 };\n```\n\nAssume the above program is stored in a file named semicolons.go,\
    \ we can run go fmt semicolons.go to remove all unnecessary semicolons from it.\
    \ Compilers will insert the removed semicolons back (in memory) automatically\
    \ when compiling the source code.\n\nWhat are the semicolons insertion rules in\
    \ Go? Let's read the semicolon rules listed in Go specification (https://golang.org/ref/spec#Semicolons).\n\
    \nThe formal grammar uses \";\" as terminators in a number of productions. Go\
    \ programs may omit most of these semicolons using the following rules:\n\n+ \
    \  1. When the input is broken into tokens, a semicolon is automatically inserted\
    \ into the token stream immediately after a line final if token is\n    * an identifier\
    \ ($5)\n    * an integer, floating-point, imaginary, rune, or string literal ($6)\n\
    \    * one of the keywords break, continue, fallout, or return\n    * one of the\
    \ operators and punctuation ++, -, ,, ), ], or j\n2. To allow complex statements\
    \ to occupy a single line, a semicolon may be omitted before a closing ) or j\
    \ .\n\nFor the scenarios listed in the first rule, we can also insert the semicolons\
    \ manually, like the semicolons in the last code example. In other words, these\
    \ semicolons are optional in programming.\n\nThe second rule means the last semicolon\
    \ in a multi-item declaration before the closing sign ) and the last semicolon\
    \ within a block (struct or interface) type declaration before the closing sign\
    \ ) are optional. If the last semicolon is absent, compilers will automatically\
    \ insert it back.\n\nThe second rule lets us able to write the following valid\
    \ code.\n\n```\n1 import \"math\" \"fmt\"\n2 var (a int; b string)\n3 const (M\
    \ = iota; N)\n4 type (MyInt int; T struct{x bool; y int32})\n5 type I interface{m1(int)\
    \ int; m2(string) string}\n6 func f() {fmt.print(\"\"); panic(nil) }\n```\n\n\
    Compilers will automatically insert the needed semicolons for us, as the following\
    \ code shows.\n\n```\n1 var (a int; string);\n2 const (M = iota; N);\n3 type (MyInt\
    \ int; T struct{x bool; y int32});\n```"
