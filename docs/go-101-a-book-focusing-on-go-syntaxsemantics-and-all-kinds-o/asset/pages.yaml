  md: '# $28. Line Break Rules in Go


    Like other design details in Go, there are both praises and criticisms for the
    semicolon insertion rules. Some programmers don''t like the rules, for they think
    the rules limit the freedom of code styles. Praisers think the rules make code
    compile faster, and make the code written by different programmers look similar,
    so that it is easy to understand the code written by each other.


