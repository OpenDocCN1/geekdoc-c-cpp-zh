    A RWMutex value is often called a reader+writer mutual exclusion lock. For an
    addressable RWMutex value m, data writers can acquire the lock of m through m.Lock()
    method calls, and data readers can acquire the lock of m through m.RLock() method
    calls. m.Unlock() and m.RUnlock() are used to release the read and write locks
    of m.


    Please note that m.Lock(), m.Unlock(), m.RLock() and m.RUnlock() are shorthands
    of (&m.Lock()), (&m.Unlock()), (&m.RLock()) and (&m.RUnlock()), respectively.


    For an addressable RWMutex value m, the following rules exist:


    +   - A writer can acquire the lock of m only if neither of the read lock and
    write lock m is held by others. In other words, the write lock of m can only be
    held by one writer at any given time, and the read and write lock of m cannot
    be held at the same time.

    - When the write lock of m is held by a data writer, any new attempts to acquire
    the write lock or the read lock will be blocked until the lock is released.

    - When the read lock m is held by a data reader, any new attempts to acquire the
    read lock will succeed unless the attempts are performed after a blocked attempt
    to acquire the write lock (see the next rule for details). In other words, the
    read lock can be held by multiple readers at the same time.

    - Assume the read lock of the value m is held by some data readers now, to avoid
    recursive locking, any new attempts to acquire the read lock after a blocked attempt
    to acquire the write lock will be blocked.

    - Assume the write lock of the value m is held by a data writer, for the official
    standard Go compiler, to avoid recursive writing locking, the attempts to acquire
    the read lock before releasing the write lock will succeed for sure once the write
    lock is released, even if the attempts are made after still being blocked another
    another attempt to acquire the write lock.


    The last two rules are to ensure both readers and writers have to acquire locks.


    Please note, a lock acquirer might not be the holder of the lock acquired. In
    other words, a lock doesn''t know which goroutine acquired it, and any goroutine
    can release a lock which is in acquired status.


