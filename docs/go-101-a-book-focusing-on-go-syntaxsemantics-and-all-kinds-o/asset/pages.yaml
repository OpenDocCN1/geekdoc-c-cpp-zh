  md: '# Line Break Rules in Go


    If you have written code go, you should have known that we can''t arbitrary code
    styles in Go programming. Specifically speaking, we can''t break a code line at
    an arbitrary space position. The remaining of this article will list the detailed
    line break rules in Go.


    # Semicolon Insertion Rules


    One rule we often obey in practice, we should not put the starting curly brace
    ({}) of any explicit code block on a new line. For example, the following for
    loop block fails to compile.


    ```

    1 | i := 5; i > 0; i-

    2 | // unexpected newline, expecting { after for clause

    3 | }

    ```


    To make it okay, the starting curly brace mustn''t be on a new line, like the
    following:


    ```

    1 | for i := 5; i > 0; i-

    2 | }

    ```


    However, there are some exceptions for the rule mentioned above. For example,
    the following bare for loop block compiles okay.


    ```

    1 | for

    2 | {

    3 | // do something ...

    4 | }

    ```


    Then, what are the fundamental rules to do line breaks in Go programming? Before
    answering this question, we should know a fact that the formal Go grammar uses
    semicolons ; as terminators of code lines. However, we use some semicolons in
    our Go code. Why? The reason is most semicolons are optional and can be omitted.
    Go compilers will insert the omitted semicolons automatically in compiling.


    For example, the ten semicolons in the following program are all optional.


    ```

    1 | package main;

    2 |

    3 | import "fmt";

    4 |

    5 | func main() {

    6 | var (

    7 | i int;

    8 | sum int;

    9 | );

    10 | for i < 6 {

    ```'
