  md: "# Concurrency Synchronization Techniques\nProvided in the sync Standard Package\n\
    \nThe channel use cases ($37) introduces many use cases in which channels are\
    \ used to do data synchronizations among goroutines. In fact, channels are not\
    \ the only synchronization techniques provided by Go. For specific circumstances,\
    \ using the synchronization techniques other than channel are more efficient and\
    \ reliable than using channels. Below will introduce the synchronization techniques\
    \ provided in the sync standard package.\n\nThe sync standard package provides\
    \ several types which can be used to do synchronizations for some specialized\
    \ circumstances and guarantee some specialized memory orders. For the specialized\
    \ circumstances, these techniques are more efficient, and cleaner, than the channel\
    \ ways.\n\n(Please note, to avoid abnormal behaviors, it is best never to copy\
    \ the values of the types in the sync standard package.)\n\n# The sync.WaitGroup\
    \ Type\n\nEach sync.WaitGroup maintains a counter internally. The initial value\
    \ of the counter is zero.\n\nThe 'WaitGroup' type has three methods (https://golang.org/pkg/sync/#WaitGroup):\
    \ Add(delta int), Done() and Wait().\n\nFor an addressable WaitGroup wg method\
    \ to change the counter maintained by wg.\n\n+   - we can call wg.Add(delta)\n\
    - the method wg.Done() is isally equivalent to the call wg.Add(-1).\n- if a call\
    \ wg.Add(delta) or, wg.Done()) modifies the counter maintained by wg to negative,\
    \ panic will happen.\n- when a goroutine calls wg.Wait().\n  - if the counter\
    \ maintained by wg is already zero, then the call wg.Wait() can be viewed as a\
    \ no-op.\n  - otherwise (the counter is positive), the goroutine will enter blocking\
    \ state. It will enter running state again (a.k.a., the wg.Wait()) returns when\
    \ goroutine modifies the counter to zero, calling wg.Done().\n\nPlease note that\
    \ wg.Add(delta), wg.Done() and wg.Wait() are shorthands of (&wg).Add(delta), (&wg).Done()\
    \ and (&wg).Wait()), respectively.\n\nGenerally, a WaitGroup value is used for\
    \ the scenario that one goroutine waits until all of other goroutines finish their\
    \ jobs. An example:"
