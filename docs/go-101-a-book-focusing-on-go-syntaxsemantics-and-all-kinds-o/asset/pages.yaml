    # # Identifier Shadowing


    Ignoring labels, an identifier declared in an outer code block can be shadowed
    by the same identifier declared in code blocks nested (directly or indirectly)
    in the outer code block.


    Labels can''t be shadowed.


    If an identifier is shadowed, its scope will exclude the scopes of its shadowing
    identifiers.


