  md: '# Value Conversion, Assignment and Comparison Rules in Go


    This article will list all the value, conversion and comparison rules in Go.


    # Value Conversion Rules


    Note, the definition of conversion in Go 101 is not exactly the same as Go specification.
    The conversion in Go spec means explicit conversion. The conversions in Go 101
    include both explicit and implicit conversions.


    In Go, v can be explicitly converted to type T, the conversion can be represented
    as the form (T)(v). For most cases, in particular T is a type name (identifier),
    the form can be simplified to T(v).


    One fact we should know, when it says a value x can be implicitly converted to
    a type T, then it means x can also be explicitly converted to type T.


    # 1. the apparent conversion rule


    If two types denote the identical, then their values can be implicitly converted
    to either type of the two. For example,


    +   * values of type byte and uint8 can be converted to each other.

    * values of type rune and int32 can be converted to each other.

    * values of type []byte and []uint8 can be converted to each other.


    Nothing more to explain about this rule, whether this case involves conversions
    or not.


    # 2. underlying type related conversion rules


    Given a non-interface value x and a non-interface T, assume the type of x is TX,


    +   * if Tx and T share the underlying type ($14) (ignoring struct tags), then
    x can be explicitly converted to T.

    * if either Tx or T a non-defined type ($14) and their underlying types are identical
    (considering struct tags), then x can be implicitly converted to T.

    * if Tx and T have different underlying types, but both Tx and T are non-pointer
    types and their base types share the same underlying type (ignoring struct tags),
    then x can (and must) be explicitly converted to T.


    (Note, the ignoring struct tags occurrences have taken effect since Go 1.8.)'
