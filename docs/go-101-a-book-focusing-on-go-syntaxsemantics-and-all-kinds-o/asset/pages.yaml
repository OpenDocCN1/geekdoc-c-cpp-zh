  md: '# # §37. Channel Use Cases


    In some request-response scenarios, for all kinds of reasons, a request may need
    a long time to response, sometimes will never respond. For such cases, we should
    return an error message to the client side by using a timeout solution. Such a
    timeout solution can be implemented with the select mechanism.


    The following code shows how to make a request with timeout.


    ```

    1 func requestWithTimeout(timeout time.Duration) (int, error) {

    2   c := make(chan int)

    3   // May need a long time to get the response.

    4   go doRequest(c)

    5

    6   select {

    7   case data := <-c:

    8     return data, nil

    9   case <-time.After(timeout):

    10     return 0, errors.New("timeout")

    11  }

    12 }

    ```


