    # What does Go 101 do to clear these confusions?


    Go 101 tries to clear many confusions by doings the following.


    +   1. Emphasizes on basic concepts and terminologies. Without understanding these
    basic concepts and terminologies, it is hard to understand many rules and high
    level concepts.

    2. Adds the value part terminology and one special article to explain value parts.
    This article uncovers the underlying structures of some kinds of types, so that
    Go programmers could understand Go values of those types deeply. I think knowing
    a little possible underlying implementations is very helpful to clear some confusions
    about all Go values.

    3. Explains memory blocks in detail. Knowing the relations between Go values and
    memory blocks is very helpful to understand how a garbage collector works and
    how to avoid memory leaking.

    4. Views interface values as boxes for wrapping non-interface values. I found
    thinking interface values as boxes is very helpful to clear many interface related
    confusions.

    5. Makes several summary articles and special topics by aggregating many knowledge
    points and details, which would save Go programmers much learning time.


