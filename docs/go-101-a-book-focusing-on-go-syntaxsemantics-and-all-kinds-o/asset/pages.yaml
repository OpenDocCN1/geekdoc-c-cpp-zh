    There are two circumstances for the unsigned argument.


    +   1. For an unsigned variable v of type T, -v is legal in Go. We can just pass
    -v as the second argument of AddT

    2. For a positive integer c, -c is illegal to be used as the second argument of
    an AddT call (where T denotes an unsigned integer type). We can use ^T(c-1) as
    the second argument.


    This ^T(v-1) trick works for an unsigned variable v, but ^T(v-1) is less efficient
    than T(-v).


    In the trick ^(c-1), if c is a typed value and its value is exactly T, then the
    form can be shortened as ^(c-1).


