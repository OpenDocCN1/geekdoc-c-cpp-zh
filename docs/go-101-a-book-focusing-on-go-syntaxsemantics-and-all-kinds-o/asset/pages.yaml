    Two non-defined pointer types with the same base type are the same type.


    Example:


    ```

    *int // A non-defined pointer type whose base type is int.

    **int // A non-defined pointer type whose base type is *int.


    // Ptr is a defined pointer type whose base type is int.

    type Ptr *int

    // PP is a defined pointer type whose base type is Ptr.

    type PP *Ptr

    ```


    Zero values of any pointer type are represented by the declared nil. Addresses
    are stored in nil pointer values.


    A value of a pointer type whose base type is T can only store the addresses of
    values of type T.


    # # About the Word "Reference"


    In Go 101, "reference" indicates a relation. For example, if a pointer value stores
    the address of another value, we can say the pointer value (directly) references
    the other value, and the other value has at least one reference. The uses of the
    word "reference" in Go 101 are consistent with Go specification.


    When a pointer value references another value, we also say the pointer value points
    to the other value.


    # # How to Get a Pointer Value and What Are Addressable Values?


    There are two ways to get a non-nil pointer value.


    +   The built-in new function can be used to allocate memory for a value of any
    type. new(T) will allocate memory for a T (an anonymous variable) and return the
    address of the T value. The allocated value is a zero value of type T. The returned
    address is viewed as a pointer value of type *T.

    We can also take the addresses of values which are addressable in Go. For an addressable
    value of type T, we can use the expression & to take the address of t, & is the
    operator to take value addresses. The type of &t is viewed as *T.


    Generally speaking, an addressable value means a value which is hosted in memory.
