    \ stacks. This is different to C++.\n\n# # When Can a Memory Block Be Collected?\n\
    \nMemory blocks allocated for direct parts of package-level variables will never\
    \ be collected.\n\nThe stack of a goroutine will be collected as a whole when\
    \ the goroutine exits. So there is no need to collect the memory blocks allocated\
    \ on stacks, individually, one by one. Stacks are not collected by the garbage\
    \ collector.\n\nFor a memory block allocated on heap, it can be collected only\
    \ if it is no longer referenced (directly or indirectly) by all the value parts\
    \ allocated on goroutine stacks and the global memory zone. We call such memory\
    \ blocks as unused memory blocks. Unused memory blocks on heap will be collected\
    \ by the garbage collector.\n\nHere is an example to show when some memory blocks\
    \ can be collected:\n\n```\npackage main\nvar p *int\n\nfunc main() {\n    done\
    \ := make(chan bool) and the following\n    // \"done\" will be used in main and\
    \ will be allocated\n    // new goroutine, so it will be allocated on heap.\n\n\
    \    go func() {\n        x, y, z := 123, 456, 789\n        = z // z can be allocated\
    \ on stack safely.\n        p = &x // For x and y are both referenced\n      \
    \  p = &y // by the global p, so they will be both\n            // allocated on\
    \ heap.\n\n        // Now, x is not referenced by anyone, so\n        // its memory\
    \ block can be collected now.\n\n        p = nil\n        // Now, y is also not\
    \ referenced by anyone,\n        // so its memory block can be collected now.\n\
    \n        done <- true\n    }\n\n    <-done\n    // Now the above goroutine exits,\
    \ the done channel\n    // is not used any more, a smart compiler may\n    //\
    \ think it can be collected now.\n\n    // ...\n```"
