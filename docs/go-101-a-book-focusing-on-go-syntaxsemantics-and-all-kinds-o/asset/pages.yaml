  md: '# # Type-Unsafe Pointers


    We have learned Go pointers from the article [pointers in Go](#($$15). From that
    article, we know that, comparing to C pointers, there are many restrictions on
    Go pointers. For example, Go pointers can''t participate in arithmetic operations,
    and for two arbitrary pointers, it is very possible that their values can be converted
    to each other.


    The pointers explained in that article are called type-unsafe pointers actually.
    Although the restrictions on type pointers really mean we are able to write safe
    Go with ease, they also make some obstacles to write efficient code for some scenarios.


    In fact, Go also supports type-unsafe pointers, which are pointers without the
    restrictions of safe pointers. Type-unsafe pointers are also called unsafe pointers
    in Go. Go unsafe are much like C pointers, they are powerful, and also dangerous.
    For some cases, we can write more efficient code with the help of unsafe pointers.
    On the other hand, by using pointers, it is easy to write bad code which is subtle
    to detect.


    Another risk of using unsafe pointers comes from the fact that the unsafe mechanism
    is not protected by [the Go compatibility guidelines](https://golang.org/doc/go1).
    Code depending on unsafe pointers today could break since a larger version.


    If you really desire the code efficient improvements by unsafe pointers for any
    reason, not only should you know the above mentioned risks, but also should follow
    the instructions written in official Go documentations and clearly understand
    the effects of each unsafe pointer, so that you can write safe Go with unsafe
    pointers.


    # ## About the unsafe Standard Package


    Go provides a special [kind of types](#($$14) for unsafe pointers. We must import
    [the unsafe standard package](https://golang.org/pkg/unsafe/) to use unsafe pointers.
    The `unsafe.Pointer` is defined as


    ```

    type Pointer *ArbitraryType

    ```


    Surely, it is not a usual type definition. Here the `ArbitraryType` just hints
    that a `unsafe.Pointer` value can be converted to any safe pointer values in Go
    (and vice versa). In other words, `unsafe.Pointer` is like the `void*` in C language.


    Go unsafe pointers means the types you underly using `unsafe.Pointer`.


    The zero values of unsafe pointers are also represented with the predeclared identifier
    `nil`.


    The `unsafe` standard package also provides three functions.


    +   * `func Alignof(variable ArbitraryType) uintptr`, which is used to get the
    address alignment of a value. Please notes, the aligns for struct-field values
    and non-field values of'
