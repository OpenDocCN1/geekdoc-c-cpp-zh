  md: '# Common Operators


    Operator operations are the operations using all kinds of operators. This article
    will introduce common operators in Go. More operators will be introduced in other
    articles later.


    # About Some Descriptions in Operator Explanations


    This article will only introduce arithmetic operators, bitwise operators, comparison
    operators, boolean operators and string concatenation operator. These operators
    are binary operators or unary operators. A binary operator operation takes two
    operands and a unary operator takes only one operand.


    All the operator operations introduced in this article returns one result.


    This article doesn''t pursue the accuracy of some descriptions. For example, when
    it says that a binary operator requires the types of its two operands must be
    the same, what it means is:


    +   * if both of the two operands are typed, then their types must be the same,
    or one operand can be implicitly converted to the type of the other.

    * if only one of the two is typed, the other (untyped) operand must be representable
    as a value of the typed of the typed operand, or the values of the other (untyped)
    operand can be implicitly converted to the typed of the typed operand.

    * if both of the two operands are untyped values, then they must be both boolean
    values, string values or basic numeric values.


    Similarly, when it says an operator, a binary operator or a unary operator, requires
    the type of one of its operands must be of a certain type, what it means is:


    +   * if the operand is typed, then its type must be, or be implicitly converted
    to, that certain type.

    * if the operand is untyped, the untyped value must be representable as a value
    of certain type, or the values of the default type of the operand can be implicitly
    converted to that certain type.


    # Constant Expressions


    Before introducing all kinds of operators, we should know what are constant expressions
    and a fact in the evaluations of constant expressions. Expressions will get explained
    in a later article expressions and statements ($11). At present, we should know
    that most of the operations mentioned in the current article are expressions.


    If all the operands involved in an expression are constants, then this expression
    is called a constant expression. All constant expressions are evaluated at compile
    time. The evaluation result of a constant expression is still a constant.'
