  md: '# 14. Overview of Go Type System


    Each interface value can box a non-interface value. The value boxed in an interface
    value is called the dynamic value of the interface value. The type of the dynamic
    value is called the dynamic type of the interface value. An interface value boxing
    nothing is a zero interface value. A zero interface value has no dynamic value
    and dynamic type.


    An interface type can specify zero or several methods, which form the method set
    of the interface type.


    If the method set of a type, which is either an interface type or a non-interface
    type, is the super set of the method set of an interface type, we say the type
    implements ($23) that interface type.


    For more about interface types and values, please read this article ($23).


    # Concept: Concrete Value and Concrete Type of a Value


    For a (typed) non-interface value, its concrete value is itself and its concrete
    type is the type of the value.


    A zero interface value has neither concrete type nor concrete value. For a non-zero
    interface value, its concrete value is its dynamic value and its concrete type
    is its dynamic type.


    # Concept: Container Types


    Array, slice and map can be viewed as formal container types.


    Sometimes, string and channel types can also be viewed as container types formally.


    Each value of a container type has a length, either that container type is a formal
    one or an informal one.


    For more about formal container types and values, please read containers in Go
    ($18).


    # Concept: Key Type of a Map Type


    If the underlying type of a map type can be denoted as map[Tkey]T, then Tkey is
    called the key type of the map type. Tkey must be a comparable type (see below).


    # Concept: Element Type of a Container Type


    The types of the elements stored in values of a container type must be identical.
    The identical type of the elements is called the element type of the container
    type.


    +   - For an array type, if its underlying type is [N]T, then its element type
    is T.'
