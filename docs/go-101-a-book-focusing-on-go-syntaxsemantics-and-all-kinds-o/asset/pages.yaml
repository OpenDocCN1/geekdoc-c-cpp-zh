    # # String Encoding and Unicode Code Points


    Unicode standard specifies a unique value for each character in all kinds of human
    languages. The basic unit in Unicode is not character, but code point instead.
    For most code points, each of them corresponds to a character, but for a few characters,
    each of them consists of several code points.


    Code points are represented as rune values ($7). The built-in `rune` type is an
    alias of `int32`.


    In applications, there are several methods to represent code points, such as UTF-8
    encoding and UTF-16 encoding. Nowadays, the most popularly used encoding method
    is UTF-8 encoding. In Go, all string are viewed as UTF-8 encoded. At compile time,
    illegal UTF-8 encoded strings will cause compilation fail. However, at run, runtime
    can prevent some strings from being illegal UTF-8 encoded.


    For UTF-8 encoding, each code point value be stored as one or more bytes (up to
    four bytes). For example, each English code point (which corresponds to one English
    character) is stored as one byte, however each Chinese code point (which corresponds
    to one Chinese character) is stored as three bytes.


