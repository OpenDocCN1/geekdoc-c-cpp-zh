  md: '# Atomic Operations Provided in The sync/atomic Standard Package


    Atomic operations are more primitive than other synchronization techniques. They
    are lockless and generally implemented directly at hardware level. In fact, they
    are often used in implementing other synchronization techniques.


    Please note, many examples below are not concurrent programs. They are just for
    demonstration and explanation purposes, to show how to use the atomic functions
    in the sync/atomic standard package.


    # Overview of Atomic Operations Provided in Go


    The sync/atomic standard package provides the following five atomic functions
    for an integer type T, where T must be any int32, int64, uint32, uint64 and uintptr.


    ```

    1 func Add(addr *T, delta T) (new T)

    2 func Load(addr *T) (val T)

    3 func Store(addr *T, val T)

    4 func Swap(addr *T, new T) (old T)

    5 func CompareAndSwap(addr *T, old, new T) (swapped bool)

    ```


    For example, the following functions are provided for type int32.


    ```

    1 func AddInt32(addr *int32, delta int32) (new int32)

    2 func LoadInt32(addr *int32) (val int32)

    3 func StoreInt32(addr *int32, val int32)

    4 func SwapInt32(addr *int32, new int32) (old int32)

    5 func CompareAndSwapInt32(addr *int32, old, new int32) (swapped bool)

    ```


    The four atomic functions are provided for (safe) pointers. As Go 1 doesn''t support
    generic types, these functions are implemented through the unsafe type ($25) unsafe.Pointer
    (the Go counterpart of void*).


    ```

    1 func LoadPointer(addr *unsafe.Pointer) (val unsafe.Pointer)

    2 func StorePointer(addr *unsafe.Pointer, val unsafe.Pointer)

    3 func SwapPointer(addr *unsafe.Pointer, new T) (old unsafe.Pointer)

    4 func CompareAndSwapPointer(addr *unsafe.Pointer, old, new unsafe.Pointer) (swapped
    bool)

    ```


    There is no AddPointer function for pointers, as Go pointers don''t support arithmetic
    operations.


    The sync/atomic standard package also provides a type Value. Its corresponding
    type *Value has two methods, Load and Store. Value value can be used to atomically
