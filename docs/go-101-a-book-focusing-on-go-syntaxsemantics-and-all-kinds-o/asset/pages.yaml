    # ## Derive Slices From Arrays and Slices


    We can derive a new slice from another (base) slice or a base addressable array
    by using the subclass syntax forms (Go specification calls them syntax forms).
    The process is often called as resizing. The elements of the derived slice and
    the base array or slice are hosted on the same memory segment. In other words,
    the derived slice and the base array or slice may share some contiguous elements.


    There are two slice syntax forms (baseContainer is an array or slice):


    ```

    1 baseContainer[low : high] // two-index form

    2 baseContainer[low : high : max] // three-index form

    ```


    The two-index form is equivalent to


    ```

    baseContainer[low : high : cap(baseContainer)]

    ```


    The two-index form is a special case of the three-index form. The two-index form
    is used much more popularly than the three-index form in practice.'
