    2 // values are not allowed to overflow their

    3 // respective default types. The 3 lines

    4 // all fail to compile.

    5 const n int = 1 << 64         // overflows int

    6 const r rune = ''a'' + 0xFFFFFFFF // overflows rune

    7 const x float64 = 2e+308      // overflows float64

    ```


    # Each named constant identifier will be replaced with its literal value at compile
    time


    Constant declarations can be viewed as #define macros in C. A constant declaration
    defines a named constant which represents a literal. The occurrences of a named
    constant will be replaced with the literal it represents at compile time.'
