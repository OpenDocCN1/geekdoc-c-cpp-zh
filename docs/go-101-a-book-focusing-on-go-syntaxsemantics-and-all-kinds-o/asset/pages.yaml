  md: '# $20. Functions in Go


    ```

    func (int, string, string) (x int, y, z bool)

    func (int, string, string) (a int, b int, _ bool)

    ```


    All of the above function types denote the same (non-defined) function type.


    Each parameter list must be enclosed in a () in literal, even if the parameter
    list is blank. If a result list of function type is blank, then it can be omitted
    from literal of the function type. When a result list has only one result, then
    the result list doesn''t need to be enclosed in a () if the literal of the result
    contains no names.


    ```

    // The following three function types are identical.

    func () (x int)

    func () (int)

    func () int


    // The following two function types are identical.

    func (a int, b string) ()

    func (a int, b string)

    ```


    # |Variadic parameters and variadic function types


    The last parameter of a function can be a variadic parameter. Each function can
    have at most one variadic parameter. The type of a variadic parameter is always
    a slice type. To indicate the last parameter is variadic, prefix three dots ...
    to the element type of its (slice) type in its declaration. Example:


    ```

    func (values ...int64) (sum int64)

    func (sep string, tokens ...string) string

    ```


    A function type with variadic parameter can be called a variadic function type.
    A variadic function type and a non-variadic function type are absolutely not identical.


    Some variadic function examples will be shown in a below section.


    # |Function types are incomparable types


    It has been mentioned ($14) several times in Go 13 that function types are incomparable
    types. But like map and slice values, function values can compare with the untyped
    base nil identifier. (Function values will be explained in the last section of
    the current article.)


    As function types are incomparable types, they can''t be used as the key types
    of map types.


    # |Function Prototypes


    A function prototype is composed of a function name and a function type. Its literal
    is composed of the func keyword, a function name and the literal of a function
    signature.'
