  md: '# The Evaluation Moment of the Arguments of

    defer and Goroutine Function Calls


    The arguments of a deferred function call or a goroutine function call are all
    evaluated at the moment when the function is invoked.


    +   - For a deferred function call, the invocation moment is the moment when it
    is pushed into the defer-stack of its caller goroutine.

    - For a goroutine function call, the invocation moment is the moment when the
    corresponding goroutine is created.


    The expressions enclosed within the body of an anonymous function call, whether
    the call is a general call or a deferred/goroutine call, will not be evaluated
    at the moment when the anonymous function call is invoked.


    Here is an example.


    ```

    package main

    2

    3 import "fmt"

    4

    5 func main() {

    6   func() {

    7     for i := 0; i < 3; i++ {

    8       defer fmt.Println("a", i)

    9     }

    10  }()

    11  fmt.Println()

    12  func() {

    13    for i := 0; i < 3; i++ {

    14      defer func() {

    15        fmt.Println("b", i)

    16    }

    17  }

    18 }()

    19 }

    ```


    Run it. The output:


    ```

    a: 2

    a: 1

    a: 0


    b: 3

    b: 2

    b: 1

    ```


    The first loop prints 2, 1 and 0 as a sequence. The second loop always prints
    1 as 3, for when the three fmt.Println calls in the deferred anonymous functions
    are invoked, the value of the loop variable 1 has become to 3.'
