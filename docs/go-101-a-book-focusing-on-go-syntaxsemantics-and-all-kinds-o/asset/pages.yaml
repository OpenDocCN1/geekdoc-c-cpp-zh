    # |Data validation/filtering


    A validation or filtering module discards some transferred data in a stream. For
    example, the following worker function discards all non-prime numbers.


    ```

    1 import "math/big"

    2

    3 func Filter(input <-chan uint64, output chan uint64) <-chan uint64 {

    4   if output == nil {

    5     output = make(chan uint64)

    6   }

    7   go func() {

    8     bigInt := big.NewInt(0)

    9     for {

    10      x := <-input

    11      bigInt.SetUint64(x)

    12      if bigInt.ProbablyPrime(1) {

    13        output <- x

    14      }

    15    }

    16  }()

    17 return output

    18 }

    ```


