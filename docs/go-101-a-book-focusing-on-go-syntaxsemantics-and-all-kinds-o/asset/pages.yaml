  md: "# Deferred Function Calls\n\nA deferred function call is a function call which\
    \ follows a defer keyword. Like goroutine function calls, all the result values\
    \ of the function call (if the called returns values) must be discarded in the\
    \ function call statement.\n\nWhen a function call is deferred, it is not executed\
    \ immediately. It will be pushed into a defer-stack managed by its caller goroutine.\
    \ After a function call fc(...) returns and enters its exiting phase ($9), all\
    \ the deferred function calls pushed in the function call (fc...) (which has not\
    \ exited yet) will be executed, by their inverse order being pushed into the defer-call\
    \ stack. Once all the deferred calls are executed, the function call fc(...) exits.\n\
    \nHere is a simple example of how to use deferred function calls.\n\n```\n1 package\
    \ main\n2\n3 import \"fmt\"\n4\n5 func main() {\n6\tdefer fmt.Println(\"The third\
    \ line.\")\n7\tdefer fmt.Println(\"The second line.\")\n8\tfmt.Println(\"The first\
    \ line.\")\n9}\n```\n\nThe output:\n\n```\nThe first line.\nThe second line.\n\
    The third line.\n```\n\nIn fact, each goroutine maintains two call stacks, the\
    \ normal-call stack and defer-call stack.\n\n+   - For two adjacent function calls\
    \ in the normal-call stack of a goroutine, the later pushed one is called by the\
    \ earlier pushed one. The bottom function call in the normal-call stack is the\
    \ function call following the go keyword.\n- The function calls in the defer-call\
    \ stack have no calling relations.\n\nHere is another example which is a little\
    \ more complex. The example will print 0 to 9, each per line, by their natural\
    \ order.\n\n```\n1 package main\n2\n3 import \"fmt\"\n4\n5 func main() {\n6\t\
    defer fmt.Println(\"9\")\n7\tfmt.Println(\"0\")\n8\tdefer fmt.Println(\"8\")\n\
    9\tfmt.Println(\"1\")\n10\tif false {\n```"
