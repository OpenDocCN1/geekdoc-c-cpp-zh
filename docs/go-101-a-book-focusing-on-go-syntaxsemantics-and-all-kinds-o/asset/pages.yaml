  md: '# # Constants and Variables


    This article will introduce constant and variable declarations in Go. The concept
    of untyped values and explicit conversions will be introduced.


    The literals introduced in [the last article](#$6) are all unnamed constants (or
    literal constants), except `false` and `true`, which are two preclared (built-in)
    named constants. Custom named declarations will be introduced below in this article.


    # ## Untyped Values and Typed Values


    In Go, some values are untyped. An untyped value means the type of the value has
    not confirmed yet. On the contrary, the type of a typed value is determined.


    For most untyped values, each of them has a default type. The declared `nil` is
    the only untyped value which has no default type. We will learn more about `nil`
