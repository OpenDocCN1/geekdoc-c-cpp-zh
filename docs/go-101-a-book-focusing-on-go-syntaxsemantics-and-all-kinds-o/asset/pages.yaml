  md: 'Note, the three-index form is only supported since Go 1.2.


    In a subslice expression, the low, high and max indexes must satisfy the following
    relation requirements:


    ```

    // two-index form

    0 <= low <= high <= cap(baseContainer)

    ```


    ```

    // three-index form

    0 <= low <= high <= max <= cap(baseContainer)

    ```


    Indexes not satisfying these requirements may make the subslice expression fail
    to compile at compile time or panic at run time, depending on the base container
    type and whether or not the indexes are constants.


    Note:


    +   - the low and high indexes can be larger than len(baseContainer), as long
    as the above relations are satisfied. The two indexes must not be larger than
    cap(baseContainer).

    - a subslice expression will not cause a panic if baseContainer is a nil slice
    and all indexes used in the expression are zero. The result derived from a nil
    slice is still a nil slice.


    The length of the derived slice is equal to high - low, and the capacity of the
    derived slice is equal to max - low. The length of a derived slice may be larger
    than the base container, but the capacity will never be larger than the base container.


    In practice, for simplicity, we have omitted some indexes in subslice syntax forms.
    The omission rules:


    +   - the low index is equal to zero, it can be omitted, either for two-index
    or three-index forms.

    - if the high is equal to len(baseContainer), it can be omitted, but only for
    two-index forms.

    - the max can never be omitted in three-index forms.


    For example, the following expressions are equivalent:


    ```

    1 baseContainer[: : len(baseContainer)]

    2 baseContainer[: : len(baseContainer)]

    3 baseContainer[: : ]

    4 baseContainer[:]

    5 baseContainer[: : len(baseContainer) : cap(baseContainer)]

    6 baseContainer[: len(baseContainer) : cap(baseContainer)]

    ```


    An example of using subslice syntax forms:


    ```

    1 package main

    2

    ```'
