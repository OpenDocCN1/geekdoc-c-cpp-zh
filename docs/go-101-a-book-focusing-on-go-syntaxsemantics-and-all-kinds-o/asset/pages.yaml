    # The Current Status of the Built-in Generic Functionalities in Go


    Besides the built-in generics for composite types, there are several built-in
    functions which also support generics. Such as the built-in len function can be
    used to get the length of values of arrays, slices, maps and strings. Generally,
    the functions in the unsafe standard package are also viewed as built-in functions.


    The fact that Go doesn''t support generics for custom types and functions really
    brings some inconveniences in Go programming. For example, the arguments of the
    math standard package are float64. When we want to use these functions on values
    of other kinds of numeric types, we must first convert the values to float64 values
    and we must convert float64 back to the original numeric types, which is not only
    inconvenient, but also not efficient.


    Luckily, many kinds of Go projects don''t need custom generic and functions. And
    the shortcomings caused by lacking of custom generics can be partially remedied
    by the reflection functionalities provided in Go (at run time) and code generating
    (at compile time).'
