    # What are the differences between the fmt.Print and fmt.Println functions?


    The fmt.Println function will always write a space between two adjacent arguments,
    whereas the fmt.Print function will write a space between adjacent arguments only
    if both of (the concrete values of) the two adjacent arguments are not strings.


    Another difference is fmt.Println will write a newline character in the end, but
    the fmt.Print function will not.


    # Is there any difference between the log.Print and log.Println functions?


    The difference between the log.Print and log.Println functions is the sams as
    the first difference between the fmt.Print and fmt.Println functions described
    in the last question.


    Both of the two functions will write a newline character in the end.


    # Are fmt.Print, fmt.Println and fmt.Printf functions synchronized?


    No, these functions are not synchronized. Please use the corresponding functions
    in the log standard package instead when synchronizations are needed. You can
    call log.SetFlags(0) to remove the prefix from each log line.


