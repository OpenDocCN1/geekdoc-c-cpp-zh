    # Then, What Is the Principle Rule to Make a recover Call Take Effect?


    The rule is simple.


    > In a goroutine, assume the caller function of a recover call is f and the depth
    of the f call is d, to make the recover call take effect, the f must be a deferred
    call and must be an active panic at depth d-1. Whether or not the recover call
    itself is deferred is not important.


