    # # Ways to block the current goroutine forever by using the channel mechanism


    Without importing package, we can use the following ways to make the current goroutine
    enter (and stay in) blocking state forever:


    +   1. send a value to a channel which no one will receive values from


    ```

    make(chan struct{}) <- struct{}

    // or

    make(chan<- struct{}) <- struct{}

    ```


    +   2. receive a value from a non-closed channel which no values have been and
    will be sent to


    ```

    <-make(chan struct{})

    // or

    <-make(<-chan struct{})

    // or

    for range make(<-chan struct{}) {

    ```


    +   3. receive a value from struct{} (or send a value to) a nil channel


    ```

    chan struct{}(nil) <- struct{}

    // or

    <-chan struct{}(nil)

    // or

    for range chan struct{}(nil) {

    ```


    +   4. use a bare select block


    ```

    select(){}

    ```


