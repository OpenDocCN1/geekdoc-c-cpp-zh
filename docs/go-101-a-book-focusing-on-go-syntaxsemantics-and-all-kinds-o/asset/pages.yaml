  md: '# §44. Memory Layouts


    For the same compiler, the exact alignment guarantees may be different between
    different architectures and different compiler versions. For the current version
    (1.12) of the standard Go compiler, the alignment guarantees are listed here:


    | type | alignment guarantee |

    |---|---|

    | bool, byte, uint8, int8 | 1 |

    | uint16, int16 | 2 |

    | uint32, int32 | 4 |

    | float32, complex64 | 4 |

    | arrays | depend on element types |

    | structs | depend on field types |

    | other types | size of a native word |


    Here, the size of a native word (or machine word) is 4-byte on 32-bit architectures
    and 8-byte on 64-bit architectures.


    This means, for the current version of the standard Go compiler, the alignment
    guarantees of other types may be either 4 or 8, depends on build target architectures.
    This is also true for ggcgo.


    Generally, we don''t need to care about the value address alignments in Go programming,
    except that we optimizing memory consumption, or write portable programs which
    use functions from `sync/atomic` package. Please read the following sections for
    details.


    # Type Sizes and Structure Padding


    Go specification makes following type size guarantees (https://golang.org/ref/spec/Size_and_alignment_guarantees):


    | type | size in bytes |

    |---|---|

    | byte, uint8, int8 | 1 |

    | uint16, int16 | 2 |

    | uint32, int32, float32 | 4 |

    | uint64, int64 | 8 |

    | float64, complex64 | 8 |

    | complex128 | 16 |

    | uint, int | 4 or 8, depends on architectures large enough to store the uninterpreted
    bits |

    | uintptr | of a pointer value |


    Go specification doesn'' make value size guarantees for other kinds of types.
    The full list of different types settled by the standard Go compiler are listed
    in value copy costs ($34).


