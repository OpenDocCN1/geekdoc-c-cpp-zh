    element type has size zero |


    # # Value Copy Costs


    Generally speaking, the cost to copy a value is proportional to the size of the
    value. However, value sizes are not the only factor determining value costs. Different
    CPU architectures may specially optimize value copying for specific sizes.


    In practice, we can view values with sizes smaller not larger than four native
    words as small-size values. The costs of copying small-size values are small.


    For the standard Go compiler, every value of large-size struct and array types,
    other types in Go are all small-size types.


    To avoid large value copy costs in argument passing and channel value send and
    receive operations, we should try to avoid using large-size struct and array types
    as function and method parameter types (including method receivers) and channel
    element types. We can use pointer types whose base are large-size types instead
    for such scenarios.


    One other hand, we should also consider that fact many pointers will increase
    the pressure of garbage collectors at runtime. So when large-size struct and array
    types or their corresponding pointer types be used relies on specific circumstances.


    Generally, in practice, we use pointer types whose base types are slice types,
    map types, channel maps, function types, string types and interface types. The
    costs of copying values of these assumed base types are very small.


    We also try to avoiding the two-iteration-variable forms to iterate array and
    slice elements if the element types are large-size types, for each element value
    will be copied to the second iteration variable in the iteration process.'
