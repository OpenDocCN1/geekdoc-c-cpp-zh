    # Nested function calls


    The basic rule:


    | If the number of the return results of a function call is not zero, the return
    results can be used as the whole arguments of another function call, then the
    former function call can be nested in the latter function call, the former nested
    call cant mix up with other arguments of the latter nesting call |


    Sugar:


    | If a function call returns exactly one, then the function call can always be
    used as a single-value argument in other function calls, the single-result function
    call can mix up with other arguments of the nesting function calls |


    Exception:


    | For the standard Go compiler, the basic rule doesn''t apply to nesting calls
    of some builtin functions with multiple input parameters, including copy, delete,
    print and print1n functions. Calls to these functions cant''t multi-result function
    calls as arguments |


    (The basic rule may apply to (https://github.com/golang/go/issues/15992) copy
    function later, but will newer apply to (https://github.com/golang/go/issues/20656)
    print and print1n functions.)


