  md: '# §13. Goroutines, Deferred Function Calls and Panic/Recover


    We can call the builtin panic function to create a panic to make the current goroutine
    enter panicking status. The panic is only within the current goroutine.


    Panicking is another way to return a function. Once a panic is produced in a function
    call, the function returns immediately and enters its exiting point. The deferred
    functions pushed into the defer-call will get executed, by their reverse order
    being pushed.


    By calling the builtin recover function in a deferred call, any panic in the current
    goroutine can be removed so that the current goroutine will enter normal calm
    status.


    If a panicking goroutine exits without being recovered, it will make the whole
    program crash.


