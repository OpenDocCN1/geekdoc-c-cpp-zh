  md: "# How to Gracefully Close Channels\n\nSeveral days ago, I wrote an article\
    \ which explains the channel rules in Go ($21). That article got many votes on\
    \ reddit (https://www.reddit.com/r/golang/comments/5k489/the_full_list_of_rules_in_golang/)\
    \ and HN (https://news.ycombinator.com/item?id=13252416), but there are also criticisms\
    \ on Go channel design details.\n\nI collected some criticisms on the following\
    \ designs and rules of Go channels:\n\n+   1. no easy and universal ways to check\
    \ whether or not a channel is closed without modifying the status of the channel.\n\
    2. closing a closed channel will panic, so it is dangerous to close a channel\
    \ if the closers know whether or not the channel is closed.\n3. sending values\
    \ to a closed channel will panic, so it is dangerous to send values to a channel\
    \ if the senders don't know whether or not the channel is closed.\n\nThe criticisms\
    \ look reasonable (in fact not). Yes, there is really not a built-in function\
    \ to check whether or not a channel has been closed.\n\nThere is a simple method\
    \ to check whether or not a channel is closed if you can make no values were (and\
    \ will) ever sent to the channel. The method has been shown in the last article\
    \ ($37). Here, for a better coherence, the method is listed in the following example.\n\
    \n```\npackage main\nimport \"fmt\"\ntype T int\nfunc IsClosed(ch <-chan T) bool\
    \ {\n\tselect {\n\tcase <-ch:\n\t\treturn true\n\tdefault:\n\t}\n\treturn false\n\
    }\nfunc main() {\n\tc := make(chan T)\n\tfmt.Println(IsClosed(c)) // false\n\t\
    close(c)\n\tfmt.Println(IsClosed(c)) // true\n}\n```\n\nAs above mentioned, this\
    \ is not a universal way to check whether a channel is closed."
