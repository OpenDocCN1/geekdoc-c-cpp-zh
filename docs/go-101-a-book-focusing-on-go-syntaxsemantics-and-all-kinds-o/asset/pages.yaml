  md: 'A garbage collection (GC) process is divided into two phases, the mark phase
    and the sweep phase. In the mark phase, the collector (a group of goroutines actually)
    uses the tri-color algorithm to analyze which memory blocks are unused.


    The following quote is taken from [a Go blog article](https://golang.org/go15gc),
    in which objects is either value or memory blocks.


    > At the start of a GC all objects are white. The GC visits all roots, which are
    objects directly accessible by the application as globals and on the stack, colors
    these grey. The GC then chooses a grey object, blackens it, and then scans it
    for other objects. When this scan finds a pointer to a white object, it turns
    object grey. At this point, white objects are known to be unreachable and can
    be reused.


    In the sweep phase, the unused memory blocks will be collected.


    The GC algorithm is a non-compacting one, so it will not move memory blocks to
    rearrange them. In other words, the address of a value will not change in its
    lifetime.


    # When will an Unused Memory Block Be Collected?


    Unused heap memory blocks are viewed as garbage by Go runtime and will be collected
    to release memory. The garbage collector is not always running. It will start
    when a threshold is satisfied. An unused memory block may not be collected when
    it becomes unused. It will be collected eventually. (Go 1.2), the threshold is
    controlled by [GC environment variable](https://golang.org/pkg/runtime#Hld-Environment_Variables).


    The GC variable sets the initial garbage collection target. A collection is triggered
    when the ratio of freely allocated to live data remaining after the previous collection
    reaches this percentage. The default is GC=100. Setting GC=off disables the garbage
    collector entirely.


    The value of environment variable determines the frequency of garbage collecting,
    and it can be modified at runtime by calling [runtime/debug.SetGCPercent](https://golang.org/pkg/runtime/debug#SetGCPercent).
    Smaller values lead to more frequent garbage collections. A negative percentage
    disables automat garbage collection.


    A garbage collection process can also be started by calling the [runtime.GC](https://golang.org/pkg/runtime#GC)
    function.


    An unused memory block may not be released to OS immediately after it is collected,
    so that it can be reused for some new value parts. Don''t worry, the official
    runtime is less memory greedy than most Java runtimes.


