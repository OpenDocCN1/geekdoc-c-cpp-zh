  md: "# nils in Go\n\nnil is a frequently used and important predeclared identifier\
    \ in Go. It is the literal representation of zero values of many kinds of types.\
    \ Many Go programmers with experiences of some other popular languages view nil\
    \ as the counterpart of null (or NULL) in other languages. This is partly right,\
    \ but there are many differences between nil in Go (or NULL) in other languages.\n\
    \nThe remaining of this article will list kinds of facts and details related to\
    \ nil.\n\n# nil Is a Preclared Identifier in Go\n\nWe can use nil without declaring\
    \ it.\n\n# nil Can Represent Zero Values of Many Types\n\nIn Go, nil can represent\
    \ zero values of the following kinds of types:\n\n+   * pointer types (including\
    \ type-unsafe ones)\n* map types.\n* slice types.\n* function types.\n* channel\
    \ types.\n* interface types.\n\n# Predeclared nil Has Not a Default Type\n\nEach\
    \ of other predeclared identifiers in Go has a default type. For example,\n\n\
    +   * the default types of true and false are both bool type.\n* the default type\
    \ of iota int.\n\nThe predeclared nil has not a default type, it has many possible\
    \ types. In fact, the predeclared nil is the only untyped value that has not a\
    \ default type in Go. There must be sufficient information to deduce the type\
    \ of a nil from context.\n\nExample:\n\n```\npackage main\nfunc main() {\n   \
    \ // There must be sufficient information for\n    // compiler to deduce the type\
    \ of a nil value.\n    _ = (*struct{})(nil)\n\n```"
