  \ `add()`、`remove()` 和 `iterator()`。前两个方法执行的是其名称所暗示直接直接，而最后一个方法通常返回一个对象——通常称为 `Iterator`（迭代器)—其方法允许你方便地遍历集合。\n\
  \n下面显示了本章中使用的集合类的接口。除了上述方法外，下所示接口还包含以下便利方法：`length()`、`contains()`、`first()` 和 `clear()`。`length()`\
  \ 方法返回集合中对象的数量；`contains()` 方法测试特定对象是否已在集合中；`first()` 方法返回集合中第一个对象的引用；`clear()`\
  \ 方法清空集合。请注意，`first()` 返回的内容也会通过对 `iterator()` 返回的迭代器对象的第一次 `next()` 方法调用返回。\n\n\
  ```\n public interface MagicCollection<T> {\n\tpublic void add( T x );\n\tpublic\
  \ void remove(T x);\n\tpublic Iterator<T> iterator();\n\tpublic int length();\n\t\
  public boolean contains( T item );\n\tpublic T first();\n\tpublic void clear();\n\
  }\n```\n\n# 17.12 MagicList 和 MagicSet 类\n\n本节首先介绍 `MagicCollection` 接口的 `MagicList`\
  \ 实现。我们在“分院帽”演示中使用的大多数迭代器示例都是基于对基于 `MagicList` 的集合进行遍历。接下来介绍的另一个 `MagicCollection`\
  \ 接口的实现是 `MagicSet` 类。\n\n`MagicList` 使用的存储机制是链表。我们将存储在 `MagicList` 集合中的对象想象为“悬挂”在一个相互链接的节点上，每个节点都是\
  \ `Node` 类的实例，该类被定义为 `MagicList` 的一个内部类。节点通过 `Node` 类的 `next` 实例变量连接。`Node` 类的 `item`\
  \ 实例变量持有“悬挂”在该 particular 节点上的对象引用。\n\n`MagicList` 类提供了两个 `Node` 类型的实例变量 `head`\
  \ 和 `tail`，帮助我们访问列表的任何所需元素。实例变量 `head` 持有链表头部 `Node` 实例引用，实例变量 `tail` 持有同一链表末尾 `Node`\
  \ 实例引用。在开始时，这两个实例变量都初始化为 `null`。这种初始化表示一个空的 `MagicList`。我们可以将链表可视化为从左向右增长，`head`\
  \ 始终指向链表左端的 `Node` 实例，`tail` 始终指向链表右端的最后一个 `Node` 实例。由于为 `add()`、`remove()` 和 `contains()`\
  \ 显示的代码使用了链表类型数据结构中此类函数的标准惯用法，因此不需要进一步阐述。\n\n关于 `iterator()` 的实现，请记住此方法必须返回一个 `Iterator`\
  \ 类型的对象。这是通过调用类型为 `Iterator` 的匿名类的构造函数实现的。该匿名类有一个名为 `ptr` 的 `Node` 类型实例变量，初始持有与外部类实例变量\
  \ `head` 相同的对象引用。观察 `hasNext()` 和 `next()` 的实现，最初如果 `ptr` 不为空，`hasNext()` 返回 `true`。随后的\
  \ `next()` 调用返回链表开头 `Node` 实例所持有的对象。此后，每次调用 `next()` 都会获取 `ptr` 指向的 `Node` 实例中的对象，同时将\
  \ `ptr` 持有的引用值更改为 `ptr.next`。\n\n`MagicList` 类的其他特征包括它维护列表中存储对象的计数。当你分别对 `MagicList`\
  \ 实例调用 `add()` 和 `remove()` 时，该计数会自动递增和递减。`MagicList` 类还包含了 `toString()` 方法的实现，这在代码调试期间非常方便，因为它会打印整个列表。`MagicList`\
  \ 的 `toString()` 实现反过来依赖于内部 `Node` 类的 `toString()` 实现，而该实现又依赖于存储在 `MagicList` 中的对象类型存在\
  \ `toString()` 实现。\n\n```\n public class MagicList<T> implements MagicCollection<T>{\n\
  \n\tprotected class Node {\n\t\tT item;\n\t\tNode next = null;\n\t\tNode( T item\
  \ ) { this.item = item; }\n\t\tpublic String toString() { return (String) item;\
  \ }\n\t}\n\tprotected Node head = null;\n\tprotected Node tail = null;\n\tprivate\
  \ int length = 0;\n\tpublic MagicList() {}\n\tpublic T first() { return head.item;\
  \ }\n\tpublic void add( T item ) {\n\t\tif ( head == null ) {\n\t\t\thead = new\
  \ Node( item );\n\t\t\tlength++;\n\t\t\ttail = head;\n\t\t} else {\n\t\t\ttail.next\
  \ = new Node( item );\n\t\t\tlength++;\n\t\t\ttail = tail.next;\n\t\t}\n\t}\n\t\
  public void remove( T item ) {\n\t\tNode ptr = head;\n\t\tNode ptr_prev = ptr;\n\
  \t\twhile (ptr != null) {\n\t\t\tif ((ptr == head) && (ptr.item == item)) {\n\t\t\
  \t\thead = ptr.next;\n\t\t\t\tlength--;\n\t\t\t\treturn;\n\t\t\t} else if (ptr.item\
  \ == item) {\n\t\t\t\tptr_prev.next = ptr.next;\n\t\t\t\tlength--;\n\t\t\t\treturn;\n\
  \t\t\t} else {\n\t\t\t\tptr_prev = ptr;\n\t\t\t\tptr = ptr.next;\n\t\t\t}\n\t\t\
  }\n\t}\n\tpublic boolean contains( T item ) {\n\t\tNode ptr = head;\n\t\twhile (ptr\
  \ != null) {\n\t\t\tif (ptr.item == item) return true;\n\t\t\tptr = ptr.next;\n\t\
  \t}\n\t\treturn false;\n\t}\n\tpublic void clear() {\n\t\thead = null;\n\t\ttail\
  \ = null;\n\t\tlength = 0;\n\t}\n\tpublic Iterator<T> iterator() {\n\t\treturn new\
  \ Iterator<T>() {\n\t\t\tprotected Node ptr = head;\n\t\t\tpublic boolean hasNext()\
  \ { return ptr != null; }\n\t\t\tpublic T next() {\n\t\t\t\tif (ptr != null) {\n\
  \t\t\t\t\tT item = ptr.item;\n\t\t\t\t\tptr = ptr.next;\n\t\t\t\t\treturn item;\n\
  \t\t\t\t} else {\n\t\t\t\t\tthrow new RuntimeException();\n\t\t\t\t}\n\t\t\t}\n\t\
  \t};\n\t}\n\tpublic int length() {\n\t\treturn length;\n\t}\n\tpublic String toString()\
  \ {\n\t\tString result = \"\";\n\t\tIterator<T> it = iterator();\n\t\twhile ( it.hasNext()\
  \ ) {\n\t\t\tT node = it.next();\n\t\t\tresult += node + \"\\n\";\n\t\t}\n\t\treturn\
  \ result;\n\t}\n}\n```\n\n这引我们我们演示中 `MagicCollection` 接口的第二个实现 —— `MagicSet` 类。正如读者所知，集合仅仅是不允许存储重复项的列表。如果调用类似\
  \ `add()` 方法再次在集合中存储相同的项，它应该直接返回而不修改当前存储的内容。\n\n\n\n\n\n```java\n public class MagicSet<T>\
  \ implements MagicCollection<T>{\n    protected class Node {\n        T item;\n\
  \        Node next = null;\n        Node( T item ) { this.item = item; }\n     \
  \   public String toString() { return (String) item; }\n    }\n    protected Node\
  \ head = null;\n    protected Node tail = null;\n        private int length = 0;\n\
  \        public MagicSet() {}\n    public T first() { return head.item; }\n    public\
  \ void add( T item ) {\n        if ( contains( item ) ) {\n            return;\n\
  \        }\n        if ( head == null ) {\n            head = new Node( item );\n\
  \            length++;\n            tail = head;\n        } else {\n           \
  \ tail.next = new Node( item );\n            length++;\n            tail = tail.next;\n\
  \        }\n    }\n    public void remove( T item ) {\n        Node ptr = head;\n\
  \        Node ptr_prev = ptr;\n        while (ptr != null) {\n            if ((ptr\
  \ == head) && (ptr.item == item)) {\n                head = ptr.next;\n        \
  \        {length--;\n                return;\n            } else if (ptr.item ==\
