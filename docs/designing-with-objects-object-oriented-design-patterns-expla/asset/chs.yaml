  }\n\t\t\t}\n\t\t}\n\t}\n}\n```\n\n* * *\n\n## 13.11 ClientClass\n\n这是测试代理模式的类。回顾一下，我们的演示基于伏地魔想要让他的代理奇洛尔从邓布利躲在愿望镜中的密室里夺取魔石。在我们的演示中，奇洛尔是\
  \ `DarkWizard` 类的实例，而伏地魔是 `DarkLord` 类唯一的一个实例。这个演示是《哈利·波特》第一本书结尾处的一个片段，当哈利·波特进入邓布利躲躲魔石的密室时，发现奇洛尔比他先到一步，并试图弄如何从镜子中取出魔石。\n\
  \n\n\n\n```java public class ClientClass {\n    public static void main( String[]\
  \ args ) {\n        DarkLord youKnowWho =\n            DarkLord.makeInstanceOfDarkLord(\"\
  Voldemort\");\n        DarkWizard proxy = new DarkWizard(\"Quirrell\");\n      \
  \  proxy.setCanCastUnforgivableCurses(true);\n        youKnowWho.goal(\"steal the\
  \ Philosopher’s Stone\", proxy );\n    }\n}\n```\n\n## 13.12 玩代码\n\n从书籍网站下载此模式的类文件到单独的目录。使用命令编译代码：\n\
  \n```bash\n javac *.java\n```\n\n并通过以下命令执行 `ClientClass` 类：\n\n```bash\n java ClientClass\n\
  ```\n\n根据 `ClientClass` 中 `main()` 方法 get 的代码，执行该类将产生以下输出：\n\n`Quirrell:`\n\n`主人，这是您让我去取魔法石石的命令吗？`\n\
  \n`Voldemort:`\n\n`是的，没错！`\n\n`Quirrell:`\n\n`这面镜子是做什么的？它是如何工作的？帮帮我，主人！`\n\n`Voldemort:`\n\
  \n`利用那个男孩……利用那个男孩……`\n\n`Quirrell:`\n\n`主人，那个男孩不配合！`\n\n`Voldemort:`\n\n`抓住他！！！`\n\
  \n`Quirrell:`\n\n`主人，我不行。我的手！！我的手！！！`\n\n`Voldemort:`\n\n`杀了他！`\n\n为了获得额外的见解，你可以按照以下思路对该模式的代码进行扩展：\n\
  \n*   在所示的代码中，黑魔主与他的代理 Quirrell 之间的所有通信都是由代理发起的。也就是说，当代理需要咨询黑魔主时，它调用为 `DarkWizard`\
  \ 类定义的 `establishCommunicationLinkWithDarkLord()` 方法，从而与黑魔主建立一个双向通信链路。你可能想扩展代码，使得代理和主之间的双向通信链路可以由任何一方建立。\n\
  \n*   在第 13.3 节中，我们讨论了不同类型的代理。本章实际演示的类型在需要为主服务器创建一个前端时非常有用，由前端处理大部分例行的入站查询（或至少是它已缓存服务器服务器响应的查询），而后端服务器仅专注于异常情况。我们也可以考虑另一种类型的代理，它仅作为一侧客户端与互联网另一侧之间的传输通道。这种类型的代理可以作为客户端人员的匿名化设备。此类代理还可以用于对谁允许与外部通信以及允许通过何种类型的流量设置安全限制。假设魔法部已经找到了一种监控黑魔主与魔法界其他部分之间所有通信的方法，请修改本章中的线程间通信代码，这样你就可以在像\
  \ Quirrell 这样的巫师与黑魔主之间建立一个类似于受监控的管道。\n\n## 注意事项\n\n# 第三部分\n\n## 行为模式\n\n顾其实名义，行为模式（Behavioral\
  \ Patterns）关于设计协同工作以提供特定运行时服务的类。这与我们通过创建模式和结构模式所实现的功能形成对比。正如读者所回的，创建模式涉及类设计以及构造其实例的方法，同时解决与以下需求相关的问题：面向接口编程、实例生产过程中的间接性、对产生的实例进行控制等。结构模式也涉及类设计和编写实例生产代码，但现在由于产生所需的实例时类与类之间需要交互，表示上的问题变得更加复杂。\n\
  \n行为模式是这三者中最复杂的。复杂性的一个重要原因是追踪类之间运行时交互的困难。当软件设计基于行为模式时，类对由用户输入或某些对象状态变化所创建的条件的响应，通常取决于该条件通过所有其他相关条件对象的状态所蕴含的时间上下文。当某种模式允许在运行时向系统注入新对象时，执行的运行时流会变得更加不可预测。虽然此类对象的类型在编译时是已知的，但它如何影响执行流则是未知的。正如读者预期的，产生的动态效应的呈现方式随模式而异。\n\
  \n以下是该部分中每一种种模式的摘要：\n\n*   **责任链（Chain of Responsibility）：** 该模式关于动态创建一个领域问题解决者的链，以解决某些领域的问题。也许与该模式实现的功能最接近的类比是某些组织在客户帮助部门使用的查询升级流程的动态版本。响应客户查询的人员按层级排列。例行查询由层级底部的人员处理，更复杂的查询则一步步向帮助部门的顶层升级。此类系统的动态版本允许根据查询的优先级和可用人员的能力，实时根据情况选择查询解决人员的链。\n\
  *   **命令（Command）：** 命令模式关注的通信交互处理代表“动作”而非“执行者”的对象。通常，当你编写面向对象的程序时，你关注的是赋予了定义方法中所包含的行为的执行者对象。命令模式将这种关注转移到动作对象。该模式教我们如何通过合成一组动作类提供的基本行为来合成大型的运行时行为。\n\
  *   **解释器（Interpreter）：** 解释器模式向我们展示了如何使用类集合来解释语言。大多数情况下，在解释语言之前，你必须对句子进行解析以识别主体、对象和涉及的动作。解析是必要的，因为它消除了给定词汇在句子中可能扮演的不同角色。通过解析，你可以缩小可能需要与单词关联的含义范围。为了确定单词的实际含义，你还必须理解其用法的上下文。虽然解析对于自由语言很困难，但提取上下文则更为困难。这两个挑战只有通过对语言施加限制才能解决。我们基于哈利·波特的模式演示涉及将魔法语翻译成麻瓜语。\n\
  *   **迭代器（Iterator）：** 在计算机内存中存储对象集合有许多不同的方法。这些方法在对集合上执行的不同操作的计算效率方面存在差异。我们指的是通过地址和值检索对象、插入和删除对象等操作。如果无论集合实际上如何存储在内存中都使用标准范式来遍历集合，将极大地提高编程便利。迭代器模式关于通过\
  \ `Iterator` 接口的帮助创建此类标准范式。\n\n\n\n\n\n### 中介模式 (Mediator)\n中介模式帮助我们设计负责协调其他类之间运行时交互的类。在许多应用程序中，大量类之间不受限制的直接交互可能会消除你通过使用面向对象编程进行代码模块化所获得的任何优势。类之间过多的直接交互意味着存在大量的类间依赖，这可能使得独立于其他类来维护每个类变得更加困难。在这种情况下，解决方案是使用一个\
  \ `Mediator` 类，并将所有对象之间的运行时调用路由到该 `Mediator`。此时，`Mediator` 的工作就是跟踪所有其他对象的状态，并决定何时允许系统中的其他类之间发生特定的交互。\n\
  \n### 备忘录 (Memento)\n这种模式向我们展示如何在尊重状态变量封装属性的情况下，将对象的状态在运行时回滚到之前的状态。这种模式的酷之处在于，所有的之前的状态信息都可以由客户端存储，但客户端无法直接访问状态变量及其值。通过这种模式，状态被保存在在一个通常名为\
  \ `Memento` 的类实例中。虽然客户端无法查看 `Memento` 实例内部，但这些实例对于那些状态被保存并可能被客户端回滚的类来说仍然是可用的。\n\n\
  ### 观察者 (Observer)\n观察者模式展示了如何在一组类之间协调协作运行时交互，其中一个特殊的对象作为某些随时间变化的数据维护者，而其他对象在这些数据上与该特殊对象保持同步。如果其他对象想要访问其数据，该特殊对象必须允许其他对象向其注册。当你考虑到观察者模式时，脑中浮的是基于订阅的广播。想要访问可用信息的人必须先向信息提供者注册。\n\
  \n### 状态 (State)\n当系统的整体运行时行为适合离散的特征描述（我们可以将其称为其“状态”）时，状态模式就很有用。正如你所预期的，这样的系统在任何给定时间只处于这些状态中的一个，且其运行时行为只会产生特定的状态转换。考虑用户与此类系统交互的场景。假设用户提出的问题对应于少数不同的上下文，我们可以让每个上下文对应系统的一个运行时状态，而问题上下文的任何变化都可以自动触发状态转换。如果你想促进与（你软件的客户端）进行基于状态的运行时交互，这种模式展示了你应该如何设计软件。\n\
  \n### 策略 (Strategy)\n追求目标通常涉及在途中解决多个问题。你如何选择解决遇到的问题通常取决于你的能力和资源。我们可以认为实现目标所采取的所有解决方案合在一起构成了一个策略。专注于软件开发，假设我们有一组类共同工作以实现某个特定的结束条件。如果每个类提供的功能足够丰富，以至于在可用资源的情况下为我们提供了调用何种特定方法的选择，那么你可能可以将所有这些选择串联成一个策略集合。然后，你可以使用策略模式来调节类之间的运行时交互，以实现所需的目标。\n\
  \n### 模板方法 (Template Method)\n这种模式展示了你如何在抽象基类中将算法编写为通通用的步骤序列。该类可以为某些步骤提供实现代码，而将其他步骤留留在声明的形式，或者留有什么都不做（do-nothing）的实现。基类中未完全实现的步骤预计将在该基类的具体子类中实现。随后，在运行时，你将通过对子类提供的实现代码的方法进行多态调用，来实现算法的动态定制。\n\
  \n### 访问者 (Visitor)\n访问者模式的目的是在不以任何方式修改层次结构中的类的情况下，从类层次结构中引导新的（之前未预料到的）运行时行为。通过让层次结构中的类包含一个访问者钩子（Visitor\
  \ hook），这变得可行。。同一个钩子可以使用不同的访问者对象来引导不同的新行为。\n\n# 14 责任链 (CHAIN OF RESPONSIBILITY)\n\
  \n## 14.1 踢皮球 (PASSING THE BUCK)\n你很可能听过某些业务用来处理愤怒客户投诉的“查询升级”或“投诉升级”。负责为客户提供帮助的人员通常被安排成层级结构，底部的人有资格处理客户可能遇到的最常规的问题，这些问题可能是那些不能阅读或不愿阅读产品随附说明的客户提出的。此类层级安排中较高层的人员被要求在底层人员对客户提出的问题感到困惑时介入。在事企业对企业（B2B）交互中，特别是当涉及重要客户时，该层级结构中的顶端人物是组织的\
  \ CEO 并不罕见。这里需要注意的重要的一点是，通常情况下，查询/投诉由底层处理该问题的个人决定是否升级到下一个更高级，因为例如，他/她无法解决它。\n\n\
  处理查询和投诉的人员层级组织的另一种替代方案是主题的层级组织和人员的矩阵式组织。主题层级的安排方式使得底部的叶子节点代表一个定义狭窄的特定问题，而较高级的节点代表该节点后代所代表的问题的“整合”。在这种方法中，在客户上传查询之前，他/她被要求点击所有最描述客户面临问题的主题类别。如果客户勾选的分类信息意味着定义狭窄的问题，它可能会被发送给分配给主题层级相关叶子节点的所有人员，期望其中某人将承担处理查询的工作。另一方面，如果客户勾选的分类信息意味着一个以多种方式表现的更系统性的问题，查询将发送给位于主题层级中与客户上传的信息最匹配的层级的人员。此外，当底层处理查询的人员发现手头的问题可能导致其他问题（客户可能尚未报告）时，查询将根据这些其他问题可能具有系统性的程度升级到更高层。我们再次拥有了查询升级，但现在查询不仅可以一次只升级一级，还可以根据查询已知的（或可能）导致系统性问题的程度，跳跃到任何层级。\n\
  \n\n\n\n上述提出的第二种方案更为复杂，可能仅用于企业对企业（B2B）查询处理系统。但需要注意，在这两种方法中，从层次结构中的任何叶子节点到根节点路径上的节点都构成了一个`chain\
  \ of responsibility`（责任链）。这些链在意义上往往是静态的，因为任何两个相似的查询都会以大致相同的方式在问题解决器的层次结构中向上传播。理想情况下，我们希望责任链是`dynamic`（动态的），这意味着链的结构会根据每条查询的不同而变化，即使两个查询是的，也取决于接收查询时实际可用的问题解决者，以及其中谁最适合解决需要处理的问题；与查询相关的优先级；与查询解决延迟相关的惩罚；客户重要性等。通常情况下，查询的这些方面无法预知，并且可能根据查询的不同而变化，甚至对于同一个客户也可能不同。`责任链`模式告诉我们如何基于查询升级的隐喻，在软件系统中创建动态的责任链。\n\
  \n## 14.2 意图与适用性\n\n`责任链`模式的意图是动态地指定一个对象链，该对象链负责接收查询并进行处理。查询在链中的对象之间进行传递，直到最终得到解决。\n\
  \n在以下情况下您应该使用此模式：\n\n*   在编译时并不知道哪些对象应该处理查询；\n*   当一个对象需要将查询传递给链中的下一个“更高级”对象时，而最合格的接收对象的身份只能在运行时确定；\n\
  *   存在多个有资格处理查询的对象，但将接受查询并进行处理的对象仅在运行时才能确定。\n\n## 14.3 责任链模式简介\n\n如前所述，通常通常实现的查询升级系统会产生静态的责任链。在静态链中，所有相似的查询都预先编写程序，由现有的查询升级系统以大致相同的方式进行处理。然而，理想情况下，您希望采用一种动态方法，通过问题解决器的层次结构来解决问题。在动态方法中，您将为每条新查询关联一条专为该查询设计的责任链。为了构建此类链，您需要寻找接收查询时实际可用的、且与查询提出的问题最匹配的问题解决者。分配给查询的链还可以考虑其他因素，例如其技术复杂性、解决问题的紧迫性、未及时解决问题所导致的成本等。\n\
  \n图 14.1 显示了软件系统中的静态责任链如何处理客户查询。每个查询处理器——`Handler`类的一个实例——既可以自己处理查询，也可以在无法解决问题时，将其升级给链中下一个被认为更合格的处理器。此类责任链通常在编译时硬编码。静态责任链的优势——如果有的话的话——是它的控制流易于理解。参考图\
  \ 14.1，`Handler1`的适用查询处理器方法只需简单调用`Handler2`的适当查询处理器方法，依此类推。显然，一旦您在潜在的查询响应者链中创建了这种硬编码链接，您就会失去处理查询的灵活性。\n\
  \n![image](img/c14f001.gif)\n\n**图 14.1**](#c14.xhtml_R_c14-fig-0001)\n\n另一方面，图\
  \ 14.2 说明了人们如何使用动态方法创建责任链。现在，每个查询处理器维护了一个其他查询处理器的列表（绑定到名为`successors`的变量），如果查询没有在本地得到解决，这些处理器更有资格处理该查询。在图\
  \ 14.2 中需要注意的是，对于给定的查询，变量`successors`仅在运行时才分配一个特定的、指定的更合格的查询处理器列表。此外，只有在运行时，才会从该列表中为给定的查询选择下一个处理器。从这些列表中的选择哪个具体的处理器，取决于查询在最初被查询处理系统记录时分配给它的各种参数。\n\
  \n![image](img/c14f002.gif)\n\n**图 14.2**](#c14.xhtml_R_c14-fig-0002)\n\n## 14.4\
  \ 现实世界应用中的责任链模式\n\n该模式的一个典型应用是 GUI（图形用户界面）软件。在 GUI（通常由一个包含按钮、复选框、文本窗口、滚动条等控件的主窗口组成）实例化后，它被放置于所谓的事件处理循环中，等待用户的交互。随后，为了响应用户的操作，GUI\
  \ 会调用通常称为`callback functions`（回调函数）或 de`callbacks`的内容。GUI 软件系统通常在不同的粒度级别上定义回调，且通常对于用户的某个特定操作，只调用最具体的回调。例如，GUI\
  \ 系统可以为“按键”事件定义一个通用回调，该回调与按下键盘上的*任何*键相关；并为“回车”事件定义一个更具体的回调，该回调仅与按下键盘上的 `Return`\
  \ 键（即 `Enter` 键）相关。如果用户实际上按了 `Return` 键，只会调用与“回车”事件相关的回调。\n\n通常，与 GUI 中的控件相关的回调构成了一个树，该树对应于\
  \ GUI 的`containment hierarchy`（包含层次结构）。正如名称所示，GUI 中包含其他控件的控件产生了包含层次结构。关于包含结构，虽然一个控件允许包含多个控件，但它只能有一个父节点。显然，这种层次结构将以\
  \ GUI 的主窗口为根。当用户与控件交互时，如果该控件没有注册回调，事件将沿包含层次结构传递到该控件的父节点，依此类推。*这代表了责任链模式的一种现实世界实现，特别是当包含层次结构仅在运行时产生时（对于富交互的动态生成网页情况如此）。*从包含层次结构的叶子节点向根节点看，我们将看到事件处理代理的链。促进事件在链上传递的事实是所有潜在的事件处理器都是相同类型的对象——即所有\
  \ GUI 类派自的类型。\n\n## 14.5 用于说明责任链模式的哈利·波特故事\n\n\n\n\n我们对责任链模式的演示是基于解决魁奇球（Quidditch）比赛中的违规行为的，这是魔法世界中一项主要的有组织运动。给定一支魁奇球球员队、学校老师、裁判、校长等，我们希望在运行时创建一个责任链，用于解决魁奇球比赛中的违规行为。也就是说，在运行时，我们希望决定某位球员犯下的某次违规行为是由裁判在本地解决，还是在当违规行为严重时，由裁判转发给监督比赛的老师。进一步扩展这一场景，我们可能还会考虑某些极具冒犯性且争议性的违规行为，这些行为需要由监督老师转发给副校长，或者干脆转发给校长本人。\n\
  \n需要注意的关键点是，我们希望能够为每场比赛单独指定用于违规报告和解决的官员链，并在运行时完成此操作。`报告链接不能被硬编码到类定义中`。在我们的演示中，这种构建责任链的运行时能力将通过让链中的所有潜在参与者都继承自我们命名为\
  \ `Adjudicator`（裁决者）的根类来实现。至少在原则上，任何作为 `Adjudicator` 的人都有权解决一个或多个违规行为。\n\n以下是我们在演示中包含的魁奇球违规行为列表：\n\
  \n1. 抢夺对手的扫帚（Blagging）\n2. 带着碰撞意图飞行（Blatching）\n3. 锁定扫帚手柄使对手偏离航线（Blurting）\n4. 将�狼球击向守门员或观众\
  \ —— 然而，如果分球在得分区域内，则允许此行为（Bumphing）\n5. 过度用肘撞（Cobbing）\n6. 守门员从后方防御球门时（Flacking）\n\
  7. 追球员在分球通过球门时仍与球保持接触（Haversacking）\n8. 当追球员干扰分球时（QuafflePocking）\n9. 当多名追球员同时位于得分区域时（Stooging）\n\
  10. 球员离开边界\n11. 将球员推下扫帚\n12. 激怒裁判\n13. 用球棒击球员\n14. 击球手击中分球\n15. 将分球掷出界外\n16. 非搜逐者接触金色飞贼\n\
  17. 超超时后未返回\n18. 比赛期间使用魔棒施咒\n19. 团队犯规\n20. 篡改扫帚\n21. 篡改裁判扫帚\n\n在我们的演示中，当球员违反违规规则时，解决该违规行为的需求将如下所示：\n\
  \n```\n Player p = .....\n    p.resolveViolation( PissOffTheReferee );\n```\n\n\
  其中我们首先构造一个 `Player` 实例，然后在该球员上调用 `resolveViolation()` 方法，同时将违规行为作为参数传递给该方法。违规行为\
  \ `PissOffTheReferee` 是上述列表中第 12*个*违规行为的代码表示。至于解决此违规行为的责任链，我们将在 `Player` 实例创建时动态设置。以下是创建\
  \ `Player` 实例的示例：\n\n```\n Player p = new Player( \"Fred Weasley\",\n      \"Blind\
  \ Side Beater\",\n      new ArrayList<Adjudicator>(\n          Arrays.asList( referee,\
  \ teacher, deputyHead )));\n```\n\n其中 `Player` 构造函数的第一个参数是球员名称，第二个参数是司职位置，第三个参数是作为\
  \ `resolveViolation()` 参数提供的违规责任链。在上方所示的代码段中，绑定到变量 `referee`、`teacher` 和 `deputyHead`\
  \ 的对象将在运行时设置，并且通常会随球员而异。此外，这些变量将被分配它们自己的责任链，这些链也是动态设置的。请注意，只有当球员犯了需要解决的违规行为时，你才会创建一个\
  \ `Player` 实例。因此，为第三个参数选择的值将隐含地考虑到有资格解决该球员违规行为的人员。\n\n## 14.6 模式演示的顶层视图\n\n图 14.3\
  \ 展示了此演示代码的顶层视图。从图中显而易见，`Adjudicator` 类在代码如何实现责任链模式以及如何允许我们动态创建链起着最重要的作用。正如读者将在下一节看到的，责任链的动态创建之所以可行，是因为\
  \ `Adjudicator` 类拥有一个实例变量 `successors`，它存储了其他有权接收违规行为进行处理的 `Adjudicator` 实例列表。该实例变量在运行时绑定到其他\
  \ `Adjudicator` 实例列表。由于演示中的所有其他“演员”——老师、裁判等——也是 `Adjudicator` 类型，它们被允许成为绑定到任何给定\
  \ `Adjudicator` 的实例变量 `successors` 的列表成员。在根类 `Adjudicator` 中定义的 `successors` 实例变量被派类继承。\n\
  \n**图 14.3**\n\n为了方便起见，我们将所有魁奇球违规行为放在下一节介绍的 `Violations` 接口中。通过让抽象类 `Adjudicator`\
  \ 实现此接口，并由于演示中的所有“演员”都继承自 `Adjudicator`，使得 `Violations` 接口中声明的所有违规行为均可用。\n\n读者可能对\
  \ `Player` 类也继承自 `Adjudicator` 的事实感到困惑。如果我们的实现反映的是我们在引言中提到的投诉处理系统（另见图 14.2），你不会期望客户与商业机构中的查询处理器是同一类型^c14.xhtml_R_c14-note-0001)。将\
  \ `Player` 子类自抽象根 `Adjudicator` 完全是为了演示中的方便（并防止代码库过大）。由于 `Player` 是 `Adjudicator`\
  \ 的子类，我们可以利用后者建立的框架将违规行为升级到下一个可用权限。此外，这还使得 `Violations` 接口中声明的所有违规行为对 `Player` 类可用。\n\
  \n*读者可能会问：如果 `Player` 类也继承自 `Adjudicator`，我们如何防止球员自己解决自己的违规行为？* 我们通过不为 `Player`\
  \ 类提供 `violationsResolved` 变量来确保球员不会解决自己的违规行为——这一事实将在第 14.9 节中变得清晰。此演示的可执行类是 `Test`。该类在第\
  \ 14.11 节中给出，向我们展示了如何动态创建责任链并将其绑定到 `Adjudicator` 类型对象的实例变量 `successors` 上。\n\n##\
  \ 14.7 接口类 Violations\n\n\n\n\n\n下方显示了一个辅助接口，它存储了违规行为符号名称与分配给它们的整数值之间的映射。虽然使用符号引用违规行为更方便，但相关的整数值使得编写违规处理代码更容易。\n\
  \n```java\n public interface Violations {\n\n\tpublic final int CannotResolveViolations\
  \ = -1;\n\tpublic final int Blagging = 0; // 抢夺对手的扫帚。\n\tpublic final int Blatching\
  \ = 1; // 意图碰撞\n\t\t\t\t// 的飞行。\n\tpublic final int Blurting = 2; // 锁定扫帚手柄以\n\t\
  \t\t\t// 使对手偏离路线。\n\tpublic final int Bumphing = 3; // 将格瓜撞向\n\t\t\t\t// 守门员或观众。\n\
  \t\t\t\t// 然而，如果魁球\n\t\t\t\t// 在得分区域内，前面的行为\n\t\t\t\t// 是允许的。\n\tpublic final int\
  \ Cobbing = 4; // 过度肘击对手。\n\tpublic final int Flacking = 5; // 当守门员从后面\n\t\t\t\t\
  // 防守球门时。\n\tpublic final int Haversacking = 6; // 追球员在魁球\n\t\t\t\t// 通过球门时仍与球//\
  \ 接触。\n\tpublic final int QuafflePocking = 7;// 当追球员扰动\n\t\t\t\t// 魁球时。\n\tpublic\
  \ final int Stooging = 8; // 当多一个追球员\n\t\t\t\t// 同时在得分区域\n\t\t\t\t// 内时。\n\tpublic\
  \ final int PlayerLeavesBoundary = 9;\n\tpublic final int PushPlayerOffTheBroom\
  \ = 10;\n\tpublic final int PissOffTheReferee = 11;\n\tpublic final int HitPlayerWithClub\
  \ = 12;\n\tpublic final int BeaterHittingQuaffle = 13;\n\tpublic final int ThrowQuaffleOutOfBounds\
  \ = 14;\n\tpublic final int NonSeekerContactingGoldenSnitch = 15;\n\tpublic final\
