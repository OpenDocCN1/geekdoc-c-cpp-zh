  \n## 9.9 THE Auror CLASS\n\n`Auror` 的工作是捕获食死徒。`Death Eater` 是一个转投黑暗阵面的巫师。食死徒在第一次和第二次巫师战争期间为伏地魔战斗。他们造成了巨大的破坏，并杀死了许多无辜的巫师、女巫和麻瓜。显而易见，你必须成为一名出色的巫师才能成为傲罗员。你必须精通\
  \ `DADA`（黑魔法防御）。候选人被录取为傲罗员后，将接受三年的严格魔法战斗和法医调查训练。\n\n在下面的实现中，我们仅列出了两个作为傲罗员的资格：拥有的巫术水平必须达到“大师”级，且\
  \ `DADA` 必须是巫师的长处之一。傲罗员的职位资格仅在他们第一次被要求捕获食死徒时进行检查。该实现还假设傲罗员在任何时候都不会处理超过五个食死徒。\n\n\
  * * *\n\n```\nimport java.util.*;\n```\n\n```\npublic class Auror extends Wizard\
  \ {\n```\n\n```\n  private List<Wizard> deathEatersAssigned = new ArrayList<Wizard>();\n\
    private boolean hasPreviousExperienceInDealingWithDeathEaters = false;\n```\n\n\
