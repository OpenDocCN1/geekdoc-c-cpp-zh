  \ year1 );\n\t\tSystem.out.println( dada_class.getState() );\n\t\tSystem.out.println(\
  \ dada_class.teacherPersonalityTraits() );\n\t\tSystem.out.println( dada_class.terminationConditions()\
  \ );\n\t\t// 如果人类感兴趣了解哈利·波特住在\n\t\t// 霍格沃黑第一年关于 DADA 的信息，\n\t\t// 请实例化具体状态 DADA_Year1\n\
  \t\t// 并将其作为参数传递给上下文\n\t\t// 类 TeachingDADA()，如下所示：\n\t\tDADA_State year1 = new\
  \ DADA_Year1();\n\t\tTeachingDADA dada_class = new TeachingDADA( year1 );\n\t\t\
  System.out.println( dada_class.getState() );\n\t\tSystem.out.println( dada_class.teacherPersonalityTraits()\
  \ );\n\t\tSystem.out.println( dada_class.terminationConditions() );\n\t\t// 等此类推\n\
  \t\t// 尝试状态切换：\n\t\tDADA_State new_state = year2.changeState();\n\t\tdada_class\
  \ = new TeachingDADA( new_state );\n\t\tSystem.out.println( dada_class.getState()\
