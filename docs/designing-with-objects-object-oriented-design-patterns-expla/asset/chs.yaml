  \ yesOrNo) {\n\t\tcanCastUnforgivableCurses = yesOrNo;\n\t}\n\tpublic void setCanBrewDarkPotions(boolean\
  \ yesOrNo){\n\t\tcanBrewDarkPotions = yesOrNo;\n\t}\n\tpublic void setCanAnimateInferi(boolean\
  \ yesOrNo){\n\t\tcanAnimateInferi = yesOrNo;\n\t}\n}\n```\n\n\n\n我们现在展示 `DarkLord`\
  \ 类的实现。如上一节所示，为了让奇洛尔（Quirrell）作为伏地魔（Voldemort）的代理，代表奇洛林的 `DarkWizard` 实例必须首先与黑主建立通信链接。因此，`DarkLord`\
  \ 类必须为此目的提供支持。正如我们在解释 `DarkWizard` 类时提到的，`DarkWizard` 与 `DarkLord` 之间的通信链接由四个单工通道（simplex\
  \ channels）组成，其中两个由 `DarkWizard` 实例启动，另外两个由 `DarkLord` 本身启动。由 `DarkLord` 创建的两个单工通道是通过内部类\
  \ `TalkToDarkWizard` 和 `LinkFromDarkWizard` 实现的。\n\n接下来的类定义中，第一个内部类 `TalkToDarkWizard`\
  \ 用于建立一个独立的线程，以便与 `DarkWizard` 保持持续联系，并对来自 `DarkWizard` 的查询发送输出响应。第二个内部类 `LinkFromDarkWizard`\
  \ 用于创建一个独立的线程（该线程与所有其他执行线程并发运行），用于与 `DarkWizard` 保持持续联系以处理其查询。正如读者已经看到的，这些内部类在 `DarkWizard`\
  \ 类中各有一个对应的类。\n\n需要注意的是，`DarkWizard` 与 `DarkLord` 之间的通信链接是由 `DarkWizard` 发起的。换句话说，在演示中，`DarkLord`\
  \ 实例并不主动与 `DarkWizard` 接触。`DarkWizard` 通过调用其方法 `establishCommunicationLinkWithDarkLord()`\
  \ 来此。该方法调用 `DarkWizard` 类和 `DarkLord` 类的相应方法来设置四个单工链接，形成一个双向通信链接。`DarkWizard` 类的\
  \ `establishCommunicationLinkWithDarkLord()` 方法通过静态变量 `youKnowWho` 知晓 `DarkLord`\
  \ 类的内部类，该变量对于每个 `DarkWizard` 类实例都是相同的。\n\n上一节中关于每个单工通信链接如何在独立线程中实现的解释同样适用于此处。此外，该节中关于为什么\
  \ `setOutgoingMessage(String msg)` 方法需要在从 `DarkLord` 发往某个 `DarkWizard` 实例的每条消息后附加换行符\
  \ `\\n` 的注释同样适用。以及为什么在独立线程中运行的代码的某些点必须调用 `Thread.sleep()` 的原因与之前的解释相同。\n\n另一个值得注意的是对\
  \ `DarkLord` 类使用了单例模式。该模式已在第 6 章中介绍过。\n\n* *\n\n```java\n import java.io.*;\n\n\
