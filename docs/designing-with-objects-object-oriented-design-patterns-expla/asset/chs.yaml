  \                return;\n            } else {\n                ptr_prev = ptr;\n\
  \                ptr = ptr.next;\n            }\n        }\n    }\n    public boolean\
  \ contains( T item ) {\n        Node ptr = head;\n        while (ptr != null) {\n\
  \            if (ptr.item == item) return true;\n            ptr = ptr.next;\n \
  \       }\n        return false;\n    }\n    public void clear() {\n        head\
  \ = null;\n        tail = null;\n        length = 0;\n    }\n    public Iterator<T>\
  \ iterator() {\n        return new Iterator<T>() {\n            protected Node ptr\
  \ = head;\n            public boolean hasNext() { return ptr != null; }\n      \
  \      public T next() {\n                if (ptr != null) {\n                 \
  \   T item = ptr.item;\n                    ptr = ptr.next;\n                  \
  \  return item;\n                } else {\n                    throw new RuntimeException();\n\
  \                }\n            }\n        };\n    }\n    public int length() {\n\
  \        return length;\n    }\n    public String toString() {\n        String result\
  \ = \"\";\n        Iterator<T> it = iterator();\n        while ( it.hasNext() )\
  \ {\n            T node = it.next();\n            result += node + \"\\n\";\n  \
