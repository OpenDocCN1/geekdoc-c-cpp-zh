  \    }\n}\n```\n\n* *\n\n## 9.10 遗忘咒类\n\n`Obliviator` 是另一种类型的 `Wizard`（巫师），受魔法部长的监督。正如你稍将在第\
  \ 9.12 节 中看到的，`MinisterForMagic` 类的定义包含一个实例变量，用于存储为部长工作的 `Obliviator` 的引用。\n\n`Obliviator`\
  \ 的工作是对那些无意中目睹了该看到的魔法的麻瓜执行记忆修改咒。要被聘用为 `Obliviator`，巫师至少必须擅长咒语，并且受过学校教育。\n\n`Obliviator`\
  \ 通过调用类定义中显示的 `alterMuggle()` 方法对麻瓜执行记忆修改咒——被执行记忆修改咒的麻瓜作为参数传递的。该方法首先检查调用该方法执行咒语的巫师。它通过调用类内部的\
  \ `isAllowedPerformMemory()` 方法来实现。在完成此检查后，巫师通过念出一个由 `Obliviate` 单词后跟麻瓜名字组成的咒语来改变所选麻瓜的记忆。为了达到特殊效果，下面的实现实际上通过语音合成器\
  \ `espeak()` 帮助发出咒语。对于不支持使用 `espeak` 进行语音合成的平台，`alterMuggle()` 方法仅打印出对指定麻瓜执行了记忆修改咒的消息。\n\
  \n* *\n\n```java\nimport java.io.*;\n\npublic class Obliviator extends Wizard {\n\
  \n    public Obliviator( String firstname, String lastname ) {\n        super( firstname,\
  \ lastname );\n    }\n    public boolean isAllowedToMemoryCharm()\n        throws\
  \ UnauthorizedAccessException {\n        if ( this.getSchoolGraduatedFrom().equals(\n\
  \                WizardTraits.SchoolGraduatedFrom.HomeSchooled ) )\n           \
  \ return false;\n        if (! this.getWizardryStrength().equals(\n            \
  \    WizardTraits.WizardryStrength.Charms ) )\n            return false;\n     \
  \   for (SchoolGraduatedFrom school : SchoolGraduatedFrom.values()){\n         \
  \   if ( school.equals( this.getSchoolGraduatedFrom() ) ) {\n                return\
  \ true;\n            }\n        }\n        return false;\n    }\n    public void\
  \ alterMuggleMemory( String muggleName )\n        throws UnauthorizedAccessException\
  \ {\n        if ( !isAllowedToMemoryCharm() ) {\n            System.out.println(\n\
  \                \"这位巫师没有资格执行记忆修改咒\" );\n            System.exit(0);\n        }\n\
  \        try {\n            Process p = Runtime.getRuntime().exec( \"which espeak\"\
  \ );\n            BufferedReader stdInput =\n                new BufferedReader(\n\
