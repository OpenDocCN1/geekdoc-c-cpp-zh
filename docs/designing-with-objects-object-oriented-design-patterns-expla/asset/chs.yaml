  \            System.exit(-1);\n        }\n    }\n}\n```\n\n* *\n\n## 9.12 魔法部长类\n\
  \n\n\n\n这里定义的类是用于魔法部部长（Minister for Magic）角色的。推测担任该职位的人员是由英国（UK）的巫师和女巫选出的。同样推测，魔法部的资金来源于对英国魔法界征收的税款。当一位新的麻瓜出身（muggle）首相被选出时，魔法部部长的一项重要工作就是向首相告知英国魔法世界的存在。\n\
  \n[第 9.5 节] 列出了魔法部中一些较重要的部门。该节还提到，一些较大的部门被细分为若干个办公室，每个办公室负责一项职能。下面所示的 `MinisterForMagic`\
  \ 的实现基于这样一个假设：虽然部门主管负责跟踪分配给他们的员工，但对于更关键的员工——例如食记忆夺者（aurors）、遗忘咒师（obliviators）、部门主管等——他们的聘用和解雇决定权保留在部长手中。\n\
  \n下面所示的实现代码确保了只有一个魔法部部长。这是通过在[第 6 章]中介绍的单例模式（Singleton pattern）实现的。单例模式要求将类的构造函数放在其私有区域中。这样，类的客户端就无法随意构造实例。实例构造功能现在通过一个名为\
  \ `makeInstanceOfMinisterForMagic()` 的静态方法提供。该方法中的逻辑确保 `MinisterForMagic` 类的私有构造函数只被调用一次——即在第一次调用\
  \ `makeInstanceOfMinisterForMagic()` 时。随后，该方法将返回第一次调用 `makeInstanceOfMinisterForMagic()`\
  \ 时构造的同一个 `MinisterForMagic` 实例。\n\n为了我们这里的简单演示，我们提供了 `MinisterForMagic` 类，其包含的方法可以为遗忘咒师、食记忆夺者和部门主管等重要职位聘用单个巫师。该类还包含一个方法，用于列出部长聘用的所有此类巫师的名字。\n\
  \n* *\n\n```\nimport java.util.*;\n```\n\n```java\npublic class MinisterForMagic\
  \ extends Wizard {\n```\n\n```java\n  private Set<Obliviator> obliviators = new\
