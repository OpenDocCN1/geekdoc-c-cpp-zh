  \ be resolved\n```\n\n为了获得进一步的见解，你可以按照以下思路自己扩展此模式的代码：\n\n\n\n\n\n*   如图 14.3 所示，为了编程上的方便，我们将\
  \ `Player` 类设为 `Adjudicator` 类的子类。这样做的好处是，使得 `Player` 类中直接可以使用违规语言。另一个好处是，它为我们提供了一个统一的违规升级机制，直接从\
  \ `Player` 本身开始。但正如图 14.2 所示，你通常不会预期生成查询（或投诉、违规，或者你如何称这些需要解决的问题）的类与处理这些查询的类是相同类型。请修改演示代码，使得玩家与校方之间实现完全的类型分离。\n\
  \n*   在当前的演示代码中，玩家不被允许解决违规。尽管 `Player` 类被赋予了 `resolveViolation()` 方法。玩家无法解决违规的原因在于\
  \ `Player` 类没有拥有名为 `violationsResolved` 的静态变量。^(3) 然而，我们可以很容易想象出某些情况，你希望玩家能够解决一些较轻微的违规。例如，队长可能被赋予解决违规的权限，前提是除非受到对方队长的挑战，否则该结果将有效。请修改代码，使玩家能够参与违规的解决。\n\
  \n# 15 命令 (COMMAND)\n\n## 15.1 动作与执行者的关系\n\n几乎每个叙事都涉及执行者和他们的动作。作为作者，你可以选择将主要重点放在执行者身上（这在你编写关于英雄人物及其事迹时会所做的），或者放在他们的动作上。当是后者时，提到的特定执行者就变成了次要，并且可以被叙事中其他可比的执行者取代。\n\
  \n在多年编程风格和语言的演变过程中，看到这种“动作与执行者”的二元对立非常有趣。编程起初主要是过程化的——重点主要是由函数指定的动作。然而，随着面向对象编程的出现，编程重心已转向对象——即执行者。使用面向对象的编程风格，当你被要求为新应用程序开发软件时，首先想到的是你需要的主要的类。从这些类构造的实例在运行时充当执行者。你赋予这些类应用程序所需的方法——即动作。这里需要注意的是，以这种方式编写代码时，概念重点的焦点在于执行者本身。另一方面，以方法形式存在的动作在执行者面前起着从属的作用——这种从属的意思是你先考虑执行者，然后才考虑他们应该能够执行哪些动作。\n\
  \n尽管面向对象的编程风格有这种以执行者为中心的关注，但我们仍然需要能够创建动作为主要、执行者为次要的软件设计。也就是说，在仍在面向对象范式内操作的同时，我们需要能够反转上述概念重点的顺序。正如你在本章中看到的，可以通过命令模式（Command\
  \ pattern）来实现。这种模式帮助我们编写一个类，通过整合其他类提供的更基础的动作来合成一个复杂的动作。通过命令模式，你的思考是从动作以及如何合成它们开始，而不是从有状态的对象以及分配给它们的动作开始。我们在图\
  \ 15.1 中阐述了将重点放在动作合成上。\n\n![image](img/c15f001.gif)\n\n**图 15.1**\n\n在本章的其余部分，我们将使用“行为”（behaviors）一词来表达与动作（actions）相同的意思，因为前者是后者的标准面向对象术语。\n\
  \n## 15.2 意图与适用性\n\n命令模式的意图是将动作表示为对象，然后通过代表较小动作的对象的组合（composition）合成更大的动作。赋予此类对象属性有助于诸如撤销（undo）、跟踪、排序、日志记录等操作。\n\
  \n你应该在以下情况下使用此模式：\n\n*   你正试图解决的问题要求：不再将对象作为具有行为的“名词”，而是将对象作为具有属性的“动词”使用；\n*   你需要将属性与动作关联起来——这些属性与例如动作请求发出的上下文、请求时间、发布请求的对象、请求的优先级等相关；\n\
  *   你的应用程序要求你通过对较小动作的组合来合成更大的动作，同时考虑到与较小动作相关的属性；\n*   你的应用程序要求你对动作请求进行队列化，并在任何给定时间根据它们的优先级级别对当前待处理的请求进行排序；\n\
  *   你的应用程序涉及 GUI 框架，并且需要一种面向对象的方法来处理回调。\n\n## 15.3 命令模式简介\n\n首先是一些与命令模式相关的词汇：它使用“接收者”（receiver）一词来指代那些更基础的行为被整合在一起以创建所需的较大行为的对象。该模式还包含了“调用者”（invoker）对象的概念，用于协调合成的宏大行为的调用。\n\
  \n记住接收者和调用者的这些词汇，现在让我们用建筑房屋来作为创建软件的比喻，以说明命令模式具体实现了什么。显然，建造房屋需要打地基、立上结构墙、在结构上盖屋顶等等。使用传统的面向对象编程方法，我们会创建一个名为\
  \ `HouseBuilder` 的类，赋予它实例变量以为从类构造的实例提供状态，然后配备与建造房屋对应的方法。这种方法等同于为建造房屋编写一个巨大的单体类。\n\
  \n现在考虑基于命令模式的方法。考虑到模式，我们意识到房屋的每个部分可能由一个或多个专门从事该领域的工匠建造。因此，我们将指定一个 `FoundationLayer`\
  \ 接收者，其工作只是打地基；一个 `Carpenter` 接收者，其工作是建造地板和墙壁；一个 `Roofer` 接收者来安装屋顶，等等。我们将所有这些工作整合在一个名为\
  \ `HouseConstruction` 的类中，如图 15.2 所示。如果你所在地区的房地产开发要求按照特定顺序建造房屋，或者要求房屋建造与另一个宏观活动交替进行（例如在房屋所在的土地安装围栏，如图\
  \ 15.2\n\n**图 15.2**\n\n\n\n\n命令模式（Command pattern）要求所有主要的行为类——即那些需要通过调用更基础的行为来合成行为的类，以及提供基础行为的类——都继承自一个名为\
  \ `Command` 的根接口。这主要是为了方便 `Invoker`（调用者）类进行操作。当所有被调用的命令都是 `Command` 类型时，`Invoker`\
  \ 类就可以以统一的方式处理所有命令。如图 15.2` 的方法。因此，任何实现 `Command` 接口的具体类都必须为 `execute()` 提供实现代码。回到我们的盖房示例，`FoundationLayer`\
  \ 类将为 `execute()` 提供一个实现，该实现将包含执行建造新房屋地基的不同步骤。同样，`Carpenter`（木匠）的 `execute()` 方法将参与建造地板和墙壁所需的木工工作。\n\
  \n## 15.4 现实应用中的命令模式\n\n命令模式最广为人知的现实应用之一，与我们在上一章第 14.4 节 中描述的责任链模式的现实应用有许多共同点。我们指的是用户与图形用户界面（GUI）交互时产生的事件的处理。在运行时，当与事件相关的回调（在\
  \ Java 中这些回调是 `Listener` 对象）被放入事件调度队列时，一个事件处理循环（通常运行在名为 `Event Dispatch Thread`\
  \ 的独立线程中）会按照先来后到的原则从该队列中执行每个回调。命令模式可以非常有效地用于协调这些回调的调用——特别是当人们想在事件处理中引入“撤销”（undo）和“重做”（redo）功能时。\n\
  \n当回调类实现 `Command` 接口时，`Invoker` 不再按照它们被放入事件调度队列的顺序来处理回调，而可以在任何时刻使用优先级队列访问准则，选择当前优先级最高的回调进行执行。`Invoker`\
  \ 的 `execute()` 方法还可以调用诸如 `peek()` 等辅助方法，首先检查当前可用的最高优先级回调，以确保考虑到已执行的回调序列，其执行是恰当的。这对于允许用户通过操作图形图标创建新程序的视觉化编程系统非常有用。¹\
  \ 在视觉化编程中，与新图标相关的程序片段必须与已有的图标“协调”。回到之前介绍的房屋建造示例，使用视觉化编程语言构建程序与盖房子之间存在着强烈的类比。\n\n\
  ## 15.5 用哈利·波特的故事来说明命令模式\n\n我们对命令模式的演示基于保护哈利·波特的任务。你可以看到，根据伏地魔大佬（Lord Voldemort）只听过了一部分的预言，他坚信自己可以击败宿敌哈利·波特。因此，邓布利确保哈利在离开霍格沃茨时始终能得到保护。哈利特别需要这种保护，尤其是在他必须与德思礼一家人度过的夏季月份。当哈利身体上待在他姨妈和舅舅的家里时，他不会受到黑暗力量的影响，因为与他去世母亲的亲近血亲（在本例中是他母亲的姨姐姐）住在一起为他提供了天然的保护。但在房子外面，他是脆弱的。为了在他在房子外时保护他，邓布利请求阿拉贝拉·菲格（Arabella\
  \ Figg）和蒙孟古斯·弗莱彻（Mundungus Fletcher）这对组合留意哈利，由前者负责（因为后者有些不可预测——他是个小偷之类）。\n\n在哈利在女瓜树路\
  \ 4 号与德思礼一家长大的这些里，阿拉贝拉·菲格通常很好地做到了留意哈利，无论是直接还是间接的。1995 年夏天，发生了一个异常事件，导致哈利在小德威格（Littleinging）需要额外的保护。食血魔袭击了哈利，这引起了关心哈利的人的恐慌。哈利住在德思礼夫妇那里不再安全了。随后，凤凰社的成员护送哈利前往格姆莫德广场\
  \ 2 号，即凤凰社的总部，为了他在飞行期间免受伤害。\n\n我们命令模式的演示将包括编写一个名为 `ProtectHarryter` 的类，在前往格姆莫德广场的途中，首先必须决定使用何种交通工具。在魔法世界中有，壁炉网络，但因为它很容易被敌人监控所以被排除了。还有使用钥匙，但这需要魔法部的授权。剩下的两个选择是瞬间移动（apparating）到达目的地以及骑扫帚到达。由于哈利还没有大到可以瞬间移动，选择自动缩小到骑扫帚。在开阔空间中骑扫帚显然会将哈利暴露在危险之中。因此，前往格姆莫德广场的巫师女巫团队需要在飞行期间全方位地保护他。\n\
  \n我们命令模式的演示将包括编写一个名为 `ProtectHarryter` 类，其主要任务是在食血魔袭击以及从德思礼家前往格姆莫德广场的途中尽一切保护哈利。`ProtectHarryter`\
  \ 类将为哈利定义两种不同的保护方式：一种是将主要的保护任务分配给个人（可能是巫师、女巫，甚至是麻鬼，²](#c15.xhtml_c15-note-0002），另一种是由巫师女巫团队共同提供的保护。\n\
  \n## 15.6 模式演示的顶层视图\n\n图 15.3` 函数必须通过调用这些巫师/女巫/麻鬼来合成哈利所需的保护。*这就是命令模式的精髓。*\n\n```\n\
  ![image](img/c15f003.gif)\n```\n\n\n\n\n由于 `Wizard`（巫）或 `Squib`（麻瓜）在帮助保护哈利·波特之前必须满足某些条件，因此我们需要一种机制来指定这些条件未满足的情况。`UnableToProtectHarryPotterException`\
  \ 类正是为此设计的。`Invoker` 类的作用仅仅是为 `Command` 类型的对象提供存储。在更复杂的演示中，`Invoker` 类可以用于确保不同的命令遵守某些预设的调度约束。最后，我们在\
  \ `Client` 类中测试了此演示的代码。\n\n## 15.7 Command 接口\n\n下面展示了本演示中使用的 `Command` 接口。如前所述，定义此接口的主要目的是为了让客户端（或\
  \ `Invoker` 类）能够以统一的方式操作所有的行为（无论是合成的的还是基础的行为）。\n\n正如我们将在第 15.9 节中提到的，下面所示接口定义中使用的异常类用于信号那些无法保护哈利·波特的情况。例如，如果目标是在小女贞格（Little\
  \ Whinging）留意哈利，但他已经离开去和韦斯莱夫妇在陋屋（The Burrow）度过剩下的夏天，那么我们需要抛出 `UnableToProtectHarryPotterException`\
  \ 异常，因为哈利目前所在地和请求保护哈利的地方不是同一个。\n\n```\npublic interface Command {\n    public void\
  \ execute() throws UnableToProtectHarryPotterException;\n}\n```\n\n## 15.8 MyPlaces\
  \ 接口\n\n下面定义的接口目标（更多是为了编程方便而非出于其他目的）是将 `Place` 声明为一个具有五个可能值的枚举（enum）。这允许我们声明一个 `Place`\
  \ 类型的变量，赋予它诸如 `Place.Privet_Drive` 的值，并检查变量的当前值是否对应下面声明的其中之一。\n\n```\n public interface\
  \ MyPlaces {\n    public enum Place { Privet_Drive,\n        The_Burrow,\n     \
  \   Number_12_Grimmauld_Place,\n        Hogwarts,\n        Hogsmeade\n    }\n}\n\
  ```\n\n## 15.9 ProtectHarryPotter 类\n\n我们现在介绍 `ProtectHarryPotter` 类。正如其名称所示，该类的主要目的是在哈利·波特不在霍格沃茨时为他提供所需的保护。当危险程度需要几位巫师和女师（有时还有麻瓜）共同努力以确保哈利安全时，像\
  \ `ProtectHarryPotter` 这样的类*必须通过参与者的各种能力来合成所需的保护。*正如之前提到的，从某些执行者提供的系列基础行为创建大型行为是\
  \ Command 模式的精髓。\n\n读者再次如所知，在 Command 模式的上下文中，执行者被称为*接收者*（receivers），因为它们是必须执行的命令的接收者，以便\
  \ `Command` 对象能够履行其提供请求行为的合约。对于 `ProtectHarryPotter` 类，接收者是 `Wizard` 和 `Squib` 类的实例。\n\
  \n`ProtectHarryPotter` 类包含了处理保护哈利的两种不同情况的逻辑：一种情况是由单个巫师或麻瓜提供保护，另一种情况是保护是巫师女师团队共同行动的结果。这些是我们在第\
  \ 15.5 节中讨论过的两种情况。\n\n对于上述两种情况中的第一种，该类直接调用巫师或麻瓜的 `execute()` 方法来获取所需的保护。对于第二种，所需的保护通过汇总参与的巫师女师的个人能力合成而成。正如你在下所示类定义中看到的，当基础行为可以独立执行时，第二种情况所需的行为合成是相当直接的。然而，当基础行为之间需要协调时，Command\
  \ 模式的实现就会变得复杂。将我们的演示代码扩展到在合成大型行为时更基础的行为之间需要协调的情况，将留给读者在第 15.15 节中进行练习。\n\n请注意下所示类定义中的三个构造函数。第一个构造函数初始化一个\
  \ `ProtectHarryPotter` 实例，其包含的 `Wizard` 实例职责是保护哈利。第二个构造函数执行相同的操作，但现在保护由 `Squib`\
  \ 提供。第三个构造函数用于需要巫师女师团队来保护哈利的情况，例如当哈利正从女贞格路 4 号（Number 4 Privet Drive）搬到格里马德广场 12\
  \ 号（Number 12 Grimmauld Place）。\n\n关于 `execute()` 方法中的代码，你可以很容易地识别出在由单个巫师、单个麻瓜以及巫师女师团队提供保护时的部分。在所有这些情况下，我们都会检查是否了某些最小条件，以便接收者能够完成任务。例如，如果要求一名巫师在哈利住在女贞格路期间保护他，我们需要该巫师拥有一件隐身篷（否则巫师将无法工作）。同样，当要求一组巫师女师在哈利前往格里马德广场\
  \ 12 号的途中护卫他时，我们要求他们都属于凤凰鸣社。\n\n```\nimport java.util.*;\n\npublic class ProtectHarryPotter\
  \ implements MyPlaces, Command {\n    private Wizard wizardGuard = null;\n    private\
  \ Squib squibGuard = null;\n    private List<Wizard> guards = new ArrayList<>();\n\
  \    private String whenProtectionNeeded = null;\n\n    private static Wizard harry\
  \ = new Wizard(\"Harry Potter\") {\n        harry.setAt(Place.Privet_Drive);\n \
  \   }\n\n    public ProtectHarryPotter(Wizard guard) {\n        wizardGuard = guard;\n\
  \    }\n\n    public ProtectHarryPotter(Squib guard) {\n        squibGuard = guard;\n\
  \    }\n\n    public ProtectHarryPotter(List<Wizard> guards, String whenProtectionNeeded)\
  \ {\n        this.guards = guards;\n        this.whenProtectionNeeded = whenProtectionNeeded;\n\
  \    }\n\n    public void execute() throws UnableToProtectHarryPotterException {\n\
  \        if (squibGuard != null || wizardGuard != null) {\n            if (squibGuard\
  \ != null) {\n                squibGuard.setWhomToProtect(harry);\n            \
  \    squibGuard.execute();\n            }\n            if (wizardGuard != null)\
  \ {\n                wizardGuard.setWhomToProtect(harry);\n                wizardGuard.execute();\n\
  \            }\n        }\n        if (guards.size() != 0 && whenProtectionNeeded\
  \ != null) {\n            if (whenProtectionNeeded.equals(\"take Harry to 12 Grimmauld\
  \ Place\")) {\n                throw new UnableToProtectHarryPotterException(\n\
  \                    \"The activity during which Harry is to be protected not recognized\"\
  );\n            }\n            ListIterator<Wizard> it = guards.listIterator();\n\
  \            while (it.hasNext()) {\n                Wizard wiz = it.next();\n \
  \               if (wiz.getCanCastDisillusionmentCharm()) {\n                  \
  \  wiz.castDisillusionmentCharm();\n                    break;\n               \
  \ }\n            }\n            it = guards.listIterator();\n            while (it.hasNext())\
  \ {\n                Wizard wiz = it.next();\n                if (!wiz.getMembershipInOrderOfPhoenix())\
  \ {\n                    throw new UnableToProtectHarryPotterException(\n      \
  \                  \"At least one member of the guards is a traitor to the cause!\"\
  );\n                }\n                System.out.println(wiz + \" will fly in formation\
  \ and deliver Harry Potter to Number 12, Grimmauld Place\");\n            }\n  \
  \      }\n    }\n}\n```\n\n## 15.10 THE Wizard 类\n\n\n\n\n\n如前所述，命令模式包含了接收者（receiver）的概念，接收者是一个对象，其基本行为是所期望的较大行为的一部分。换句话说，当我们观察到较大行为时，我们实际上看到的是参与的接收者对象提供的更基础行为的聚合。在我们的演示中，接收者由巫师（wizards）、女巫师（都是我们这里展示的\
  \ `Wizard` 类创建的两种实例）以及麻瓜（squibs）组成。\n\n第 15.5 节中介绍的保护哈利·波特的场景描述应该说明我们类型为 `Wizard`\
  \ 接收者对象什么种类型的属性。要求巫师在小女瓜环跟踪哈利同时对麻格人保持隐身的保护场景，要求巫师必须拥有一件隐身篷。同样，自愿在哈利于女女瓜巷 4 号和格里马德广场\
  \ 12 号之间的途中护卫他的巫师和女巫师必须属于凤凰会，否则他们可能无法看到目的地的房屋，更不用说被允许进入了。这些对巫师和女巫师的要求解释了我们在下方为 `Wizard`\
  \ 类定义的基础行为。\n\n***\n\n```java\n import java.util.*;\n\npublic class Wizard implements\
  \ MyPlaces, Command {\n\tprivate String wizardName;\n\tprivate Place currentlyLocatedAt;\n\
  \tprivate boolean hasInvisibilityCloak = false;\n\tprivate boolean canApparate =\
  \ false;\n\tprivate boolean canCastDisillusionmentCharm = false;\n\tprivate boolean\
  \ hasMembershipInOrderOfPhoenix = false;\n\tprivate Wizard whomToProtect;\n\n\t\
  public Wizard( String wizardName ) {\n\t\tthis.wizardName = wizardName;\n\t}\n\t\
  public String toString() { return wizardName; }\n\n\tpublic void setCurrentlyLocatedAt(\
  \ Place place ) {\n\t\tcurrentlyLocatedAt = place;\n\t}\n\tpublic Place getCurrentlyLocatedAt()\
  \ {\n\t\treturn currentlyLocatedAt;\n\t}\n\tpublic void setMembershipInOrderOfPhoenix(\
  \ boolean truOrFalse ) {\n\t\thasMembershipInOrderOfPhoenix = truOrFalse;\n\t}\n\
