    Malfoy starting run 10\n  Malfoy 不再对 Dark Lord 忠诚\n  不忠诚的 Malfoy 已从 Observable\
  \ 中注销\n  现在 Dark Lord 有 1 个追随者\n\n  Wormtail starting run 11\n  Wormtail 不再对 Dark\
  \ Lord 忠诚\n  不忠诚的 Wormtail 已从 Observable 中注销\n  现在 Dark Lord 有 0 个追随者\n```\n\n\n\
  \n\n通常情况下，在面向对象编程中，谈论从类构造的实例处于特定状态并不罕见，该状态是由赋值给实例变量的值定义的。但这*并不是*我们在本章中所指的*状态*（state）。本章中所使用的*状态*概念处于一个更高的层次——一个更具全局性的——的概念化水平。如果我们非要与纯过程化编程中的某个相当概念进行类比，那么我们在本章中所指的状态，将类似于使用一个全局变量，该全局变量在\
  \ `if-then` 或 `switch` 等控制结构中的条件评估将导致不同代码段的执行。遗憾的是，如果在面向对象的代码中直接使用这些过程化编程机制来注入全局上下文，你可能会得到一个难以调试和维护的软件。因此，引入了\
  \ `State`（状态）模式。\n\n`State` 模式向我们展示了如何编写类，这些类的行为很大程度上取决于从一组较少的高级上下文中所选择的上下文。正如你将看到的，通过\
  \ `State` 模式，每个状态都变成一个独立的类。代表不同状态的所有类都通过一个公共接口向软件的其他部分呈现。随后，任何特定于状态的功能都可以通过该接口进行调用。\n\
  \n## 21.2 意图与适用性\n\n`State` 模式的意图是允许全局上下文的状态改变软件系统的行为。\n\n在以下情况下你应该考虑使用此模式：\n\n\
  *   类系统操作的全局上下文具有少数量的离散特征，这些特征可以被称为状态；\n*   全局上下文可以在运行时更改，并且当它发生变化时，软件表现出的运行时行为也随之改变；\n\
  *   独立于全局上下文的行为部分可以放在基于状态的抽象层次结构的根类中，而其余行为放在子类中，每个子类特定于其中一个状态。\n\n## 21.3 状态模式简介\n\
  \n`State` 模式告诉我们，面向对象系统中所有与上下文无关的行为都应该抽象到一个根类中，随后我们为每个上下文创建该根类的不同具体实现，每个实现对应一个上下文。\n\
  \n另一种方案——拥有一个单体类，其方法通过一组 `if`-`then` 块或 `switch` 语句提供依赖于上下文的行为——可能会导致软件难以维护和升级，因为调节行为的大部分控制代码在不同方法中很可能是相同的。每当你有可以避免的代码重复（我们称之为*无谓重复*，*gratuitous\
  \ duplication*）时，它都可能成为软件 Bug 的根源。假设你在给定类中有大量方法，每个方法都有许多处理上下文的 `switch` 语句。现在假设在稍后的某个时间点，你想让你的软件对一个新上下文做出响应。你现在必须编辑每个方法，并在所有方法中进行几乎完全相同的更改，以创建处理新上下文的代码。在任何一个方法中忘记这样做，都将是一个严重的错误。\n\
  \n相反，通过 `State` 模式，你只需要为新上下文创建一个抽象类的新的具体实现，并包含依赖于该上下文的行为。由于所有与新上下文相关的代码都将在新的子类中，你不太可能因为反复执行相同操作却又漏掉某一次而导致错误。\n\
  \n## 21.4 现实世界应用中的状态模式\n\n电子商务网站用于多步业务交易的软件适合用 `State` 模式进行建模。交易的不同状态可能包括以下内容：(1)\
  \ 选择需要订购的物品；(2) 下单；(3) 支付；(4) 安排运输等。虽然交易的每个状态都具有独特的元素，但所有状态将共享某些共同行为，例如允许客户在不完成交易的情况下退出的行为、在交易途中保存交易的行为（以允许其在未来的会话中继续进行）等。\n\
  \n这些共同行为在交易的不同状态中显然具有不同的实现。在选定物品后立即保存正在进行的交易所需的逻辑，与在例如信用卡信息处理后保存交易所需的逻辑是不同的。当交易处理软件基于\
  \ `State` 模式时，所有共同行为都声明为根交易类中的抽象方法。它的具体子类（每个对应一个不同的状态）则为这些共同行为提供特定于状态的实现——外加上每个状态所需的共同行为之外的任何额外功能。\n\
  \n`State` 模式的另一个应用是用于在虚拟画布上绘制视觉图案和编辑图像的图形软件。绘图通常需要用户选择笔或画笔作为工具，选择该工具的许可状态之一，并使用工具执行笔触以获得所需的视觉效果。不同的状态可能对应调色板中不同的颜色和纹理。此类软件可以设计有一个主绘图类，该类声明基本的笔触产生方法，将通过笔触创建各种视觉效果的细节留给绘图类的子类，每个子类对应一个不同的状态。另一个类似的应用是图像编辑软件。人们可以再次想象一个主编辑器类，其行为由其操作时选择的状态来调节。用户再次选择一个工具（例如画笔），其对于像素平滑和重新着色的动作将取决于画笔选择了哪种调色板。调色板中的不同选择对应于工具的不同状态。\n\
  \n## 21.5 用哈利·波特的故事说明状态模式\n\n我们对 `State` 模式的演示是基于编写一组类，客户端可以使用这些类来获取有关霍格沃茨黑魔法防御术（DADA）教学的信息。由于黑魔法防御术的教学方法每年变化很大，我们将使用教学年份来设置上下文的状态。感兴趣于使用我们的类获取特定年份黑魔法防御术教学信息的客户端，需要将系统置于对应于年份的状态。\n\
  \n正如你可能知道的，霍格沃茨的黑魔法防御术教学在伏地魔未被选入该工作时中了咒。结果是，没有哪个黑魔法防御术老师的寿命超过一年。更糟糕的是，每年底，黑魔法防御术老师不可避免地遭遇了悲性的终场。关于霍格沃茨黑魔法防御术教学的另一个重要事实是，黑魔法防御术老师无一例外地在教室内外让哈利·波特的生活变得痛苦。\n\
  \n我们演示的目标是编写一个可以回答关于霍格沃茨黑魔法防御术教学问题的程序。这些问题可以关于某年的老师是谁、老师的性格怪癖、老师的这一年是如何结束的等。由于这些问题的答案每年不同，我们可以将每一年视为一个状态。因此我们将定义以下七个状态：`Year1`、`Year2`、.\
  \ . . , `Year7`。正如熟悉的哈利·波特的读者记得，教授黑魔法防御术的老师以及他们每个人的年度终场如表 21.1 所示。\n\n\n\n\n\n##\
  \ 表 21.1\n\n| 状态（年份） | 老师 | 终止情况 |\n| --- | --- | --- |\n| `Year 1` | Quirinus Quirrell\
  \ | 被伏地魔附身……死亡。 |\n| `Year 2` | Gilderoy Lockhart | 因冒领他人魔法行为的功劳被揭穿。最终在圣圣芒戈魔法疾病治疗医院失去了记忆。\
  \ |\n| `Year 3` | Remus Lupin | 在斯内普揭露卢平是狼人人后，被迫下台。 |\n| `Year 4` | Alastor Moody（由巴蒂·克鲁奇小儿子冒充）\
  \ | 巴蒂·克鲁奇小儿子被施了摄魂吻并被送往阿兹卡班。阿拉斯多·穆迪回了退休生活。 |\n| `Year 5` | Dolores Umbridge | 在禁森林从受伤状态被救出并返回了魔法部。\
  \ |\n| `Year 6` | Severus Snape | 在伏地魔为了夺取魔杖的过程中被杀害。 |\n| `Year 7` | Amycus Carrow\
  \ | 伏地魔倒台后被送往阿兹卡班。 |\n\n## 21.6 模式演示的顶层视图\n\n我们演示的目标是确保当向软件提出一个关于黑魔法防御术（DADA）教学的问题时，其答案由一个类提供，该类代表了根据问题所属年份确定的上下文状态。为此，我们将定义七个特定于状态的类，名称如\
  \ `DADA_Year1`、`DADA_Year2` 等。每个此类类都将包含（就本演示而言）该类所对应年份的所有信息。所有这些类都将实现 `DADA_State`\
  \ 中定义的根状态接口。演示本身将由名为 `Hogwarts` 的代码可执行类中提出的 DADA 教学相关问题组成。这些问题将以对 `TeachingDADA`\
  \ 类实例的方法调用形式出现。在提出问题之前，将为 `TeachingDADA` 实例提供问题所属的年份。我们预计 `TeachingDADA` 实例将使用对应年份的上下文类，但仅通过为所有上下文状态类定义的\
  \ `DADA_State` 接口进行操作。\n\n你可以将 `TeachingDADA` 类视为作为以 `DADA_State` 为根的状态类层次结构的前端。客户端只能与\
  \ `TeachingDADA` 交互。不要求客户端知道软件中如何组织与 DADA 相关的信息，更不用知道软件中基于状态的组织方式。\n\n模式演示由图 21.1\
  \ 所示的类图说明。该图中图中需要注意的是，定义 `TeachingDADA` 功能的方法与 `DADA_State` 接口的方法相同。因此，在状态 `DADA_State`\
  \ 的具体实现中将实现的方法也将是相同的。那么 `TeachingDADA` 中的这些方法是如何与 `DADA_State` 中的相同方法（以及后一组方法在具体状态类中的实现）建立联系的？这种关系通过\
  \ `TeachingDADA` 类中的私有变量 `state` 实现。因此，当调用 `TeachingDADA` 下列出的方法时（当然是在 `TeachingDADA`\
  \ 的实例上调用），我们将执行转移到对实例化为其中一个状态的 `state` 变量的同名方法的调用。正是通过这种方式，`TeachingDADA` 的功能取决于系统处于何种状态，或者更准确地说，取决于\
  \ `TeachingDADA` 变量 `state` 绑定到了哪个具体状态。\n\n![image](img/c21f001.gif)\n\n**图 21.1**\n\
  \n注意 `DADA_State` 接口中的 `changeState()` 方法。在许多以状态概念为特征的实际应用中，只允许某些状态转换。`changeState()`\
  \ 方法旨在捕获我们演示中允许的状态转换。通过将此方法声明置于 `DADA_State` 接口中，我们迫使每个具体状态类在需要退出其所代表的状态时，声明下一个允许的状态是什么。另一种方法是将根\
  \ `DADA_State` 声明为抽象类，并将所有状态转换在其中声明为一种数据结构。我们将在第 21.11 节“玩转代码”中提到这种更改状态的替代方法。\n\n\
  ## 21.7 DADA_State 接口\n\n回到我们演示的主要目标，我们想要创建一个计算机程序，为用户提供关于哈利·波特系列丛书中七年内黑魔法防御术教学的信息。我们说的信息是指老师的名字、老师的任何为人所知的怪癖、老师在该一年结束时的情况等。我们希望将演示代码基于“状态”的概念——即提出\
  \ DADA 相关问题时的上下文状态。\n\n下面显示了状态类的根接口。因此，任何具体状态类都必须实现这些方法。正如你稍后在第 21.9 节中看到的，这里包含的方法与\
  \ `TeachingDADA` 中的是相同的。接口与具体状态类之间的相互作用之前解释过。21.7 接口还包含一个 `changeState()` 方法。\n\n\
  ```\nimport java.util.List;\n\npublic interface DADA_State {\n    String getState();\n\
  \    String getTeacher();\n    String teacherTraits();\n    List<String> terminationConditions();\n\
  \    String teacherBackground();\n    DADA_State changeState();\n}\n```\n\n## 21.8\
  \ 状态的 yearly 实现的类\n\n由于演示中的状态是由客户端所需的年份决定的，因此对于七年我们共有七个状态。本节介绍了为每个年份实现 `DADA_State`\
  \ 接口的具体状态类。下面显示这些具体状态类中的第一个。所示，该类是基于奎瑞斯·奇奎尔作为第一个老师的。\n\n```\nimport java.util.*;\n\
