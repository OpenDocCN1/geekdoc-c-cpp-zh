  \ 接口，并且尽可能地也利用 `TeacherForDADA` 类中的教学材料，这对应于前任老师教授黑魔法防御术的方式。\n\n请注意适配器在接随后的类中是如何实现的。对于\
  \ `TeachingDADA` 接口中声明的每个方法，下面的适配器类都结合了在被适配类 `TeacherForDADA` 中定义的实现以及此处定义的新功能。例如，`defenseAgainstCruciatusCurse()`\
  \ 方法的实现调用了本地定义的方法来教授如何对人施展钻心咒，然后调用了从父类 `TeacherForDADA` 继承的关于该诅咒教学的其他教育材料。\n\n通过这种方式，由\
  \ `AdapterSafeTeaching` 类代表的新老师能够在实际开始教授各种魔法行为以及如何防御它们之前，注入了接触黑魔法的道德维度。\n\n```java\n\
