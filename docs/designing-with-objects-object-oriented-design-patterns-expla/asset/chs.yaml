  \ (!prosecutionWitnesses )\n\t\t& (defenseWitnesses == true ) {\n\t\t\tverdict =\
  \ Verdict.NotGuilty;\n\t} else if (!prosecutionWitnesses )\n\t\t& (defenseWitnesses\
  \ == false ) {\n\t\tverdict = Verdict.Guilty;\n\t} else if (!defenseWitnesses )\n\
  \t\t& (prosecutionWitnesses == true ) {\n\t\tverdict = Verdict.Guilty;\n\t} else\
  \ if (!defenseWitnesses )\n\t\t& (prosecutionWitnesses == false ) {\n\t\tverdict\
  \ = Verdict.NotGuilty;\n\t} else if ( (prosecutionWitnesses == true)\n\t\t& (defenseWitnesses\
  \ == false ) ) {\n\t\tverdict = Verdict.Guilty;\n\t} else if ( (prosecutionWitnesses\
  \ == false)\n\t\t& (defenseWitnesses == true ) ) {\n\t\tverdict = Verdict.NotGuilty;\n\
  \t} else {\n\t\tverdict = Verdict.UnableToReach;\n\t\t}\n\t}\n\treturn transitions.get(\
  \ currentState );\n\t}\n\tpublic boolean corroborateWitnessTestimony( Evidence testimony\
  \ ) {\n\t\t// This is just a place-holder at the moment since the logic\n\t\t//\
  \ encoded here would not be important to demonstrating\n\t\t// main ideas of the\
  \ Mediator pattern.\n\treturn true;\n\t}\n\n\tpublic Set<Witness> remainingWitnesses()\
  \ {\n\t\tSet<Witness> remaining = new HashSet<Witness>();\n\t\tfor ( Witness w :\
  \ setOfWitnesses ) {\n\t\t\tif ( witnessesHeardByTheCourt.contains(w) ) {\n\t\t\t\
  \tremaining.add(w);\n\t\t\t}\n\t\t}\n\t\treturn remaining;\n\t}\n}\n```\n\n* * *\n\
  \n## 18.10 WITNESS 类\n\n由 `MinistryOfTrial` 所完成的核心工作是对证人提供的证言进行质询。读者可能记得，我们在介绍 `Mediator`\
  \ 接口和 `MinstryOfMagicTrialMediator` 类时提到必须预先知道证人是辩方证人还是控方证人，这一事实通过下文 `Witness`类的实例变量\
  \ `whoseWitness`（通过 `wit.getWhoseWitness()`get）指示。实例变量 `initialTestimony` 用于 `MinistryOfMagicTrialMediator`\
  \ 类中的逻辑，用以标记证言已完成，从而同一证人不会被再次调用。\n\n布尔实例变量 `testimonyCorroboratedUponExamination`\
  \ 在 `Witness` 提供的证言被法庭认为真实时被设置为 true，否则设置为 false。请记住，无罪（NotGuilty）判决的最低条件是所有辩方证人均提供了真实的证言，且至少有一个控方证人提供了虚假证言。同样，有罪（Guilty）判决的最低条件是所有控方证人均提供了真实的证言，且至少有一个辩方证人提供了虚假证言。\n\
  \n“`get`”方法 `getTestimony()` 在 `MinistryOfMagicTrialMediator` 的 `getNextState()`\
  \ 方法中被调用，用于提供调用 `corroborateWitnessTestimony()` 所需的参数。\n\n\n\n```java\n public class\
  \ Witness implements TrialElements {\n\tprivate String name;\n\tprivate Evidence\
  \ testimony;\n\tprivate String whoseWitness;\n\tpublic boolean initialTestimonyPresented\
  \ = false;\n\tpublic boolean testimonyCorroboratedUponExamination;\n\tpublic Witness(String\
  \ name, Evidence testimony, String whoseSide) {\n\t\tthis.name = name;\n\t\tthis.testimony\
  \ = testimony;\n\t\tthis.whoseWitness = whoseSide;\n\t}\n\tpublic String getWhoseWitness()\
  \ {\n\t\treturn whoseWitness;\n\t}\n\tpublic Evidence getTestimony() { return testimony;\
  \ }\n\tpublic String toString() { return name; }\n}\n```\n\n## 18.11 Trial 接口\n\n\
  这里的目标是为 `Trial` 类定义一个最小化的接口。该接口基于这样一个假设：审判可以被分为不同的阶段，每个阶段都表示为超父接口 `TrialElements`\
  \ 中声明的八种状态之一。此接口中的方法声明言不自明。\n\n```java\n public interface Trial extends TrialElements\
  \ {\n\tpublic void addNewWitness(Witness w);\n\tpublic void setLeadWitness(Witness\
  \ lw);\n\tpublic TrialState getNextTrialState( TrialState currentState )\n\t\t\t\
  throws Exception;\n\tpublic void setCurrentTrialState( TrialState state );\n\tpublic\
  \ Verdict getTrialVerdict();\n}\n```\n\n## 18.12 HarryPotterTrial 类\n\n本节中显示的类 `HarryPotterTrial`\
  \ 用于演示具体中介者类 `MinistryOfMagicTrialMediator` 的工作机制。\n\n下面的实现声明了三个对哈利·波特审判（以及任何审判）执行至关重要的实例变量。我们有一个实例变量\
  \ `mediator`，其值由构造函数设置为 `MinistryOfMagicTrialMediator` 的实例。另外两个实例变量存储了审判的当前状态，以及在当前状态完成后下一个状态将是什么。在\
  \ `main()` 中，我们从 `currentState` 开始，它在进入 `while` 循环之前被设置为 `ChargeBeingFiled`，然后通过将\
  \ `nextState` 设置为 `currentState`，我们循环遍历审判的所有状态，直到到达 `TrialCompleted` 状态。正如读者从我们对\
  \ `MinistryOfMagicTrialMediator` 的介绍中看到的，当审判处于需要质询证人的状态时，我们会积累所需的证据，以达到三个最终裁决之一：`Guilty`、`NotGuilty`\
  \ 和 `VerdictCannotBeReached`。\n\n关于下面提供的其余代码，请注意我们如何将谓词 `setAvailabilityOfDefenseWitnees`\
  \ 设置为 `true`，并将谓词 `setAvailability ofProsecutionWitnesses` 设置为 `false`。这反映了 J. K.\
  \ 罗琳对审判的描述。基本上，这场审判由魔法部长内利斯·福福奇对哈利·波特提出指控，提交指控证据，而邓布利和费格夫人担任辩护证人，其中前者作为首席证人。没有控方证人。审判所需的两个证人——邓布利和费格夫人——在\
  \ `main()` 的方法体中构造，其中前者也被被设置为首席证人（在我们简单的演示中，首席证人意味着他/她将是第一个被质询的证人）。\n\n```java\n\
  \ public class HarryPotterTrial implements Trial {\n\tprivate Mediator mediator;\n\
  \tprivate TrialState currentState;\n\tprivate TrialState nextState;\n\tpublic HarryPotterTrial()\
  \ {\n\t\tmediator = new MinistryOfMagicTrialMediator();\n\t\tmediator.setChargeAgainstAccused(Charge.ConjuredPetronusInMuggle);\n\
  \t\tmediator.setAvailabilityOfDefenseWitnesses(true);\n\t\tmediator.setAvailabilityOfProsecutionWitnesses(false);\n\
  \t}\n\tpublic void addNewWitness(Witness w) {\n\t\tmediator.addNewWitness(w);\n\t\
  }\n\tpublic void setLeadWitness(Witness lw) {\n\t\tmediator.setLeadWitness( lw );\n\
  \t}\n\tpublic TrialState getNextTrialState( TrialState currentState )\n\t\t\tthrows\
  \ Exception {\n\t\treturn mediator.getNextState( currentState );\n\t}\n\tpublic\
  \ void setCurrentTrialState( TrialState state ) {\n\t\tcurrentState = state;\n\t\
  \tmediator.setCurrentState( state );\n\t}\n\tpublic Verdict getTrialVerdict() {\n\
  \t\treturn mediator.getVerdict();\n\t}\n\tpublic static void main(String[] args)\
  \ {\n\t\ttry {\n\t\t\tHarryPotterTrial trial = new HarryPotterTrial();\n\t\t\tWitness\
  \ dumbledore = new Witness( \"Dumbledore\",\n\t\t\t\tEvidence.LifeOfAccusedInDanger,\
  \ \"defense\");\n\t\t\tWitness figg = new Witness( \"Figg\",\n\t\t\t\tEvidence.LifeOfAccusedInDanger,\
  \ \"defense\");\n\t\t\ttrial.addNewWitness( dumbledore );\n\t\t\ttrial.addNewWitness(\
  \ figg );\n\t\t\ttrial.setLeadWitness(dumbledore);\n\t\t\ttrial.setCurrentTrialState(TrialState.ChargeBeingFiled);\n\
  \t\t\twhile (trial.currentState != TrialState.TrialCompleted) {\n\t\t\t\ttrial.nextState\
  \ =\n\t\t\t\t\ttrial.getNextTrialState(trial.currentState);\n\t\t\t\ttrial.setCurrentTrialState(\
  \ trial.nextState );\n\t\t\t}\n\t\t\tSystem.out.println( \"The final trial state\
  \ is: \"\n\t\t\t\t+ trial.nextState );\n\t\t\tSystem.out.println( \"The verdict\
  \ is: \"\n\t\t\t\t+ trial.getTrialVerdict() );\n\t\t} catch(Exception e) {\n\t\t\
  \te.printStackTrace();\n\t\t}\n\t}\n}\n```\n\n## 18.13 玩转代码\n\n从书籍网站下载此模式的类文件到单独目录。使用命令编译代码：\n\
  \n```\njavac *.java\n```\n\n并通过以下命令执行 `HarryPotterTrial` 类：\n\n```\njava HarryPotterTrial\n\
  ```\n\n给定 `HarryPotterTrial` 中 `main()` 方法的代码，执行该类将产生以下输出：\n\n```\nList of all witnesses:\
  \ [Dumbledore, Figg]\nRemaining witnesses: [Dumbledore, Figg]\nNext witness to be\
  \ questioned: Dumbledore\n```\n\n这是辩护证人 --- 将被控方质询：\n`Dumbledore`\n.\n\n```\nList\
  \ of all witnesses: [Dumbledore, Figg]\nRemaining witnesses: [Figg]\nNext witness\
  \ to be questioned: Figg\n```\n\n这是辩护证人 --- 将被控方质询：\n`Figg`\n.\n\n```\nList of all\
  \ witnesses: [Dumbledore, Figg]\nRemaining witnesses: []\nThe final trial state\
  \ is: TrialCompleted\n\nThe verdict is: NotGuilty\n```\n\n\n\n\n在用于创意工作的计算机应用程序软件（如写作、绘图、动画等）中，记录之前时刻的真实情况同样重要。这种回溯最简单的形式出现在“撤销（undo）”操作中，它使用户能够将对象恢复到之前的状态。在最简单的情况下，“撤销”必须将工作恢复到最近更改之前的状态。该操作更复杂的版本通过递归调用“撤销”，将工作回溯到之前的任何一个状态。\n\
  \n人们可能认为，将软件对象恢复到其之前的状态是简单的，因为可以使用带有时间戳的令牌（tokens）来记录对象在发生变化时的状态，并在之后通过令牌的帮助来回溯这些旧状态。遗憾的是，将对象恢复到其之前一个状态的问题并不总是适用于这种简单的解决方案。原因在于，状态可能涉及用户无法直接访问且无法进行简单回滚的参数。\n\
  \n详细来说，正如读者所知，在面向对象的软件中，对象的状态（或其某部分）通常存在于对象的私有区域（private section）。如果你希望软件允许用户保存对象的旧状态以备日后进行“撤销”操作，你就会面临一个困境：如何保存状态中那些不希望用户直接访问的部分。如果你坚持认为状态私有部分所持的信息对用户不可见，那么由用户发起的简单回滚方法将行不通。此外，考虑这种情况：一家公司使用的文档处理工具涉及安全参数，这些参数控制谁对文档的不同部分具有什么访问权限。在创建文档时设置这些参数后，如果创建文档的用户不具备适当的安全凭证，那么通过普通的“撤销”实现来取消这些参数设置可能无法生效。另一个例子是，假设正在创建一个大型多媒体文档涉及从网络中的其他位置导入对象。如果有关对象导入和源归属的规则对创建文档的用户是不可见的，那么普通的“撤销”逻辑实现可能会因为“并非所有文档状态都能供用户直接用于将文档恢复到之前的状态”而感到困惑。\n\
  \n因此，显而易见，通常情况下对象状态变化的所有内容不能被假设为软件系统用户可以直接访问的。这使得在用户端将对象状态回滚到早前的状态变得具有挑战性。如何克服这一困难？如何在不让用户访问这些信息的情况下，存储所有与对象之前状态相关的信息，同时让这些信息能够回滚对象状态？\n\
  \n备忘模式（Memento pattern）正是为了解决这一挑战。该模式向我们展示了如何为软件对象建立一种溯机制，其中更改及其相关参数以“备忘录（mementos）”的形式存储，这样虽然用户无法直接查看其内部内容，但“备忘录”仍然可以用于将对象恢复到之前的状态。\n\
  \n## 19.2 意图与适用性\n\n备忘模式的意图是允许类的客户端（client）保存其实例的先前状态，但又不违反类定义中访问控制修饰符 `private`/`protected`/`package`\
  \ 所决定的封装约束。\n\n如果满足以下条件，你应该考虑使用这种模式：\n\n*   你希望赋予软件客户端回滚对象状态的能力（假设你的软件创建了状态随时间变化的对象）；\n\
  \n## 19.3 备忘模式简介\n\n正如本章开头部分所指出的，我们希望客户端能够将对象的当前状态回滚到之前的某个状态之一。这里的关键点在于，我们希望客户端拥有这种功能，而又不需要直接访问更改本身。正如你将看到的，备忘模式通过将对象的所有先前状态存储为通常命名为\
  \ `Memento` 的类的实例来实现这一点。客户端软件无法直接查看任何 `Memento` 实例内部。尽管如此，客户端软件可以使用这些 `Memento`\
  \ 实例将对象状态回滚到之前的某个时刻。\n\n在通常与此模式相关的术语中，需要将其实例回滚到先前状态的类被称为 `Originator`（生成者）类。`Originator`\
  \ 类实例的更改状态被存储为 `Memento` 类的实例。通常，即使这些实例存储在客户端处，`Originator` 的客户端也无法查看 `Memento`\
  \ 实例内部，更不用以任何方式修改它们。同样的另一种说法是，备忘模式在赋予客户端回滚此类对象状态的自由的同时，并没有违反任何与 `Originator` 对象相关的封装约束。`Originator`、`Memento`\
  \ 和 `Client` 类之间的关系如图 19.1 所示所示。\n\n![image](img/c19f001.gif)\n\n**图 19.1**](#c19.xhtml_R_c19-fig-0001)\n\
  \n本节的其余部分通过一个虚构的代码示例说明了回滚 `Originator` 对象状态的困难性。所示的 `Originator` 类有三个实例变量，都在它的私有区域。仅关注\
  \ `x` 和 `y` 变量，假设只有 `x` 可以由用户设置。\n\n```\nClass Originator {\n\tprivate int clockTick;\n\
  \tprivate int x;\n\tprivate int y;\n\n\tpublic Originator(int time, int xx) {\n\t\
  \tclockTick = time;\n\t\tx = xx;\n\t\ty = f(x);\n\t}\n\n\tprivate int f(int xx)\
  \ {\n\t\t// 处理 xx 的代码\n\t\treturn xx;\n\t}\n}\n```\n\n该类允许客户端每个时钟（tick）构造一个实例。（在备忘模式的后续说明中，我们将时钟称为虚构单词\
  \ `clockTick`。）从该类构造的每个实例的状态显然由创建实例时对应的 `clockTick` 以及那时实例变量 `x` 和 `y` 的值表征。\n\n\
  假设在某一时刻，客户端想要将那时构造的实例恢复到之前某个 `clockTick` 的状态。如果实例变量（以及设置 `y` 值时使用的函数 `f()`）位于类的私有区域这一事实不是问题，那么客户端只需存储状态变量的值并直接恢复所需的先前状态即可。然而，由于实例变量的可见性限制，这种情况下是不可能的。读者可能会辩称，如果所有的状态更改都是通过构造函数调用引起的，为什么不直接存储构造函数参数，然后通过调用带有那时数值参数的构造函数来将对象恢复到之前的时刻状态呢？在上面的示例中，当我们通过\
  \ `y=rand(x)` 设置实例变量 `y` 时，这种回滚对象状态的方法可能不起作用是显而易见的。我们可以预期，即使 `x` 相同，每次调用 `rand()`\
  \ 都会返回不同的 `y` 值。将 `y=rand(x)` 比喻为设置对象状态时可能发生的任何情况——这些情况对于类的客户端并不总是可见的。\n\n\n\n\n\
  # 19.4 备忘模式在现实世界中的应用\n\n备忘模式最常见的应用场景可能是在处理文档处理、计算机艺术和其他类似的创作活动中。在文档处理中，与不断演变的文档相关的状态信息必须包括文档的按键内容、与内容布局相关的任何格式信息，以及任何额外信息（如与安全和可访问性相关的信息）。虽然这些状态的大部分对用户是直接可见的，但也有某些方面——可能存储在相关对象的私有部分——是用户不可访问的。状态中用户不可访问的部分可能用于某些操作的参数，这些操作控制着在用户控制更改窗口大小时，字体大小和文档布局如何自动变化、显示给用户的菜单选项如何随文档内容的改变而变化、提供给用户的注释工具如何显示等。就此语境下的“撤销”（undo）而言，最简单的回滚情况发生在用户在文档中出错时——这可能是按键错误或格式错误——而你想让计算机将文档恢复到错误之前的状态。如前所述，这种“撤销”的更高级版本包含了递归回滚，允许用户一次一步地向后追溯，并将文档恢复到这些较早时刻的每一个。同样的考虑也适用于创作计算机艺术的软件。\n\
  \n# 19.5 使用哈利·波特的故事来解释备忘模式\n\n我们对备忘模式的演示基于《哈利·波特》系列第三本书结尾发生在霍格沃的某些事件，当时赫德敏·格兰杰（Hermione\
  \ Granger）使用她的时间汤回到三小时前，以拯救西西夫·布莱克和天马兽海角兽（Buckbeak）的生命。如果你读过《阿瓦班的囚禁》，你会记得在故事结尾，卢西斯·马尔福（Lucius\
  \ Malfoy，他对比霍格沃魔法生物饲养员海格德毫无好感）在不不尊重地靠近天马兽时被海角兽伤了。随后，马尔福向魔法部投诉，认为学生在与海格德上课的期间，待在海角兽附近是极不安全的。在卢西斯父亲的影响下，尽管海格德对这一判决的不公发出了哀求，魔法部还是决定处决海角兽。\n\
  \n这把我们带到了时刻：执行小组（由魔法部长科内利斯·福奇、行刑官沃尔登·麦克奈尔和校长邓布利多组成）出现在海格德的小屋，准备斩掉那只天马兽。\n\n但海角兽通过赫德敏·格兰杰和哈利·波特利用赫德敏时间汤的魔法得以获救。被救的不止海角兽，还有西西夫·布莱克，他自从从阿瓦班监狱逃狱后就一直被食魂鬼追捕。哈利和赫德敏让重获自由的海角兽飞起来，载着西西夫·布莱克飞出了霍格沃。\n\
  \n营救海角兽和西西夫·布莱克的关键是赫德敏使用她的时间汤回到三小时前。*回到较早的现实等同于将对象的状态恢复到它在较早时刻的状态。* 使用这个“回到过去”的故事来解释备忘模式确实产生了一个有趣的副作用：当赫德敏给她的时间汤转三圈并回到三小时前时，从那一刻起，你必须允许两个*并行*的时间流发生，直到它们在准确的三小时后再次相汇。\n\
  \n为了分别跟踪两个时间流中的事件，我们的备忘模式演示将使用一个名为 `HogwartsHappening` 的类来存储霍格沃重大事件的叙述。例如，当执行小组出现在海格德的小屋处决海角兽时，该事件的叙述将被存储在\
  \ `HogwartsHappening` 实例中。当为某个事件创建该类的实例时，除了叙述，我们还会在实例中存储与该事件相关的时间。时间将通过类的实例变量 `clockTick`\
  \ 进行记录。使用 `clockTick` 允许我们对 `HogwartsHappening` 实例在时间轴上排序。这使得允许我们在时间上向前向后移动。\n\n\
  与《阿瓦班的囚禁》中两个时间流的发展方式一致，`HogwartsHappening` 类的客户端将构造该类的实例序列，每个时间流中的每个 `clockTick`\
  \ 分别构造一个。当实例在第一个时间流中被构造时（我们可以将其视为主时间流），这些实例不断变化的状态将自动存储在客户端处，形式为名为 `Memento` 的类的实例，而该类将被定义为\
  \ `HogwartsHappening` 的一个*内部类*。通过作为内部类 `Memento` 实例被存放，我们确保客户端无法直接访问 `HogwartsHappening`\
  \ 实例的存储状态。最终，在某一点，为了遵循《阿瓦班的囚禁》中的脚本，客户端将想要最新的 `HogwartsHappening` 对象的状态重置为 `clockTick`\
  \ 0 时的状态，这正是三小时之前。随后构造的任何 `HogwartsHappening` 实例将对应于导致海角兽和西西夫·布莱克逃脱的并行时间流。\n\n我们的演示将包括创建一个一个小事件序列，大约从赫德敏给她的时间汤转三圈的时刻三小时开始：\n\
  \n**ClockTick 1**: 我们启动事件时钟，哈利、罗恩和赫德敏在隐形衣下出发去探海格德，在他痛苦的时刻表示同情和支持；海格德刚刚接到魔法部的通知，他心爱的生物海角兽今晚将被处决。\n\
  \n**ClockTick 2**: 我们记录的下一个事件是执行小组敲了海格德的小屋，海格德让哈利、罗恩和赫德敏从后门离开他的小屋。\n\n**ClockTick\
  \ 3**: 当哈利、罗恩和赫德敏返回城堡时，罗恩的鼠小矮比开始反常，表面上是因为赫德敏的魔法猫奇鲁敏在附近。（我们后来发现，奇鲁敏知道小矮比的真实身份：那只鼠实际上是彼得·奇格鲁，他是一个变形人兽，意味着他可以随意变成动物。同样我们后来发现，正是彼得·奇格鲁将哈利的父母背叛了伏魔王。）小矮比走向受伤格柳树根部的一个大洞，后面跟着一只非常大的狗（实际上是西西夫·布莱克，也是一个变形人兽）以及被拖着走的罗恩，接着是猫奇鲁敏，然后是哈利，最后是赫德敏。这个格柳树根部的洞通向一条地下隧道，是通往霍格米德村外尖叫小屋的秘密通道。\n\
  \n**ClockTick 4**: 全体成员——哈利、罗恩、赫德敏、西西夫、奇鲁敏和小矮比——发现自己在霍格米德村尖叫小屋的一个上楼房间里。\n\n**ClockTick\
  \ 5**: ....\n\n**ClockTick 6**: ....\n\n这里是赫德敏通过给时间汤转三圈回到过去后，重新追溯的事件序列：\n\n\n\n\n\
  \n*   **时间点 1：** 赫敏和哈利在一个扫帚间里。他们听到外面传来了脚步声，听起来像是三个人下楼梯走向海格的小屋。事实证明，这些是在原始事件序列中哈利、罗恩和赫敏披着隐形衣走过的脚步声。\n\
  *   **时间点 2：** 赫敏和哈利留在扫帚间内，对邓布利多那段相当隐晦的话感到困惑，他提到他们正在进行的时空冒险可以拯救两条生命，而不仅仅是海角。他们经过推断得出结论：如果成功的话，他们可以同时救下海角和西西夫·布莱。\n\
  *   **时间点 3：** 赫敏和哈利出发前往海格的小屋，尽力躲在树的阴影中，避免在穿过城堡后方的草坪时被发现。他们到达了一个可以看到小屋正门的地方。躲在树后，他们看到了来自原始时间流的自己以及罗恩正在敲门。\n\
  *   **时间点 4：** 随后，他们看到自己在执行委员会进入小屋时从后门离开。哈利和赫敏看到麦克奈尔透过窗户看向海角。由于小屋的后门是开着的，他们还能听到内部正在进行的对话。他们决定是时候对海角实施救援了。于是哈利冲向海角被拴在栅栏上的地方，解开绳子，将海角拉进森林边缘的树林中，那里从海格的小屋看不见他。执行委员会走出小屋准备执行海角的刑，但惊讶地发现哪里都没有那只天马了。\n\
  *   **时间点 5：** ....\n*   **时间点 6：** ....\n\n## 19.6 模式演示的顶视图\n\n如上一节所述，我们对 `Memento`\
  \ 模式的演示是基于使用 `HogwartsHappening` 类作为 `Originator`（源节点）类的。（第 19.3 节 说明了我们什么是 `Originator`\
  \ 类）。图 19.2 展示了我们演示的类图。正如 `Memento` 类附带的注释所说，它是 `HogwartsHappening` 的内部类，这使得 `HogwartsHappening`\
  \ 可以自由访问 `Memento` 的私有成员。这种策略也防止了任何外部类直接访问存储在 `Memento` 实例中的状态信息。\n\n注意 `HogwartsHappening`\
  \ 类列出的公共方法，特别是 `saveStateToMemento()` 和 `restoreStateFromMemento()` 方法，前者用于保存 `HogwartsHappening`\
  \ 实例的当前状态，后者用于将当前实例恢复到早之前的状态。\n\n![image](img/c19f002.gif)\n\n**图 19.2**\n\n在 `Client`\
  \ 类中，随着故事的展开（从赫敏转动她的时间汤轮三圈的三小时前开始），我们为每个重大事件创建 `HogwartsHappening` 实例。我们将每个 `HogwartsHappening`\
  \ 实例关联一个整数索引，作为实例变量 `clockTick` 的值。当这些实例被创建时，它们被客户端作为 `HogwartsHappening.Memento`\
  \ 对象存储在本地。然而，由于它们是 `HogwartsHappening.Memento` 类型的对象，客户端无法查看存储实例的内部。尽管如此，通过调用 `HogwartsHappening`\
  \ 的适当方法，客户端能够将该类的当前实例恢复到早之前存储的状态。\n\n通过这种方式，在赫敏转动她的时间汤轮三圈的瞬间，我们可以回到三小时前的那个早些时刻。随后，新的\
  \ `HogwartsHappening` 实例将对应另一个时间流，在那个流中，海角和西西夫·布莱都逃之大生。\n\n## 19.7 HogwartsHappening\
  \ 类和内部 Memento 类\n\n我们现在展示两个关联的类 `HogwartsHappening` 和 `Memento`。由于后者是前者的内部类，且同时后者不包含任何公共实例变量，这使得满足\
  \ Memento 模式的主要要求之一变得简单：`HogwartsHappening` 的客户端应该能够保存和恢复 `HogwartsHappening` 实例的状态，而无需直接访问状态信息。\n\
  \n首先关注本节所示实现代码中的 `HogwartsHappening` 类，除了为该类配备两个实例变量 `clockTick` 和 `storyline` 之外，我们还为其提供了一个名为\
  \ `nextClockTick` 的类变量。这允许我们仅通过 `storyline` 参数按顺序创建 `HogwartsHappening` 实例，并让该类自行决定下一个\
  \ `HogwartsHappening` 实例使用什么值作为 `clockTick`。你可以将类变量 `nextClockTick` 视为我们已经使用了多少个\
  \ `clockTick` 的记录者；因此它可以告诉我们哪个 `clockTick` 适用于下一个 `storyline`。注意无参构造函数是如何用于增加静态变量\
  \ `nextClockTick` 的。读者肯定知道，当客户端调用任何其他构造函数时，无参构造函数会被自动调用。因此，无论我们如何创建 `HogwartsHappening`\
  \ 实例，静态变量 `nextClockTick` 都会增加。\n\n接下来，注意这两个公共方法的实现：\n\n```\nsaveStateToMemento()\n\
  restoreStateFromMemento(Memento memento)\n```\n\n当 `HogwartsHappening` 客户端在实例上调用\
  \ `saveStateToMemento()` 时，会创建一个内部类 `Memento` 的实例，并将 `HogwartsHappening` 实例的状态保存在创建的\
  \ `Memento` 实例中。然而，由于 `Memento` 类没有任何公共方法，`Memento` 实例的内容对客户端是不可见的。尽管客户端无法查看 `Memento`\
  \ 实例以检查 `HogwartsHappening` 对象的保存状态，但客户端可以调用 `HogwartsHappening` 类的公共方法 `restoreStateFromMemento()`，将最新的\
  \ `HogwartsHappening` 实例回滚到某个之前的 `clockTick` 值的状态。\n\n关于内部类 `Memento` 的实现，这里最值得的一点是它的所有成员都是私有的。因此，存储在\
  \ `Memento` 实例中的任何内容都只能由封闭类 `HogwartsHappening` 类的方法访问。所以虽然客户端可以在本地存储 `Memento`\
  \ 类实例，但客户端无法以任何方式更改这些对象。\n\n\n\n\n\n```java\n public class HogwartsHappening {\n\
  \    private int clockTick;\n    private static int nextClockTick = 1;\n    private\
  \ String storyline;\n\n    public HogwartsHappening() {\n        clockTick = nextClockTick++;\n\
  \    }\n    public HogwartsHappening( int clockTick, String story ) {\n        this.clockTick\
  \ = clockTick;\n        nextClockTick = clockTick + 1;\n        this.storyline =\
  \ story;\n    }\n    public HogwartsHappening( String story ) {\n        this();\n\
  \        this.storyline = story;\n    }\n    public String getLatestStoryline()\
  \ {\n        String answer = \"Storyline at time \" + clockTick\n              \
  \          + \": \" + storyline;\n        return answer;\n    }\n    public Memento\
  \ saveStateToMemento() {\n        return new Memento( clockTick, storyline );\n\
  \    }\n    public void restoreStateFromMemento(Memento memento) {\n        nextClockTick\
  \ = memento.getSavedStateClockTick() + 1;\n        clockTick = memento.getSavedStateClockTick();\n\
  \        storyline = memento.getSavedStateStoryLine();\n    }\n\n    public static\
  \ class Memento {\n        private final int clockTick;\n        private final String\
  \ storyline;\n\n        private Memento( int clockTick, String story ) {\n     \
  \       this.clockTick = clockTick;\n            this.storyline = story;\n     \
  \   }\n        private int getSavedStateClockTick() {\n            return clockTick;\n\
  \        }\n        private String getSavedStateStoryLine() {\n            return\
  \ storyline;\n        }\n    }\n}\n```\n\n## 19.8 Client 类\n\n`Client` 类是我们想要创建有状态的\
  \ `HogwartsHappening` 实例的地方——这些实例会随着时间的推移而变化。我们通过为 `HogwartsHappening` 类的实例变量 `clockTick`\
  \ 赋予连续较大的整数值来编码时间。给定这样一个随时间推移的 `HogwartsHappening` 实例序列，客户端在某个时间点可能会将实例状态回滚到之前某个时间的状态。为了方便起见，客户端希望在本地存储所有的实例状态，但是——如果遵循备忘录（Memento\
  \ pattern）的意图——我们不希望客户端直接访问这些状态。\n\n在下面所示的 `Client` 类中，调用 `HogwartsHappening` 类的\
  \ `saveStateToMemento()` 方法返回的 `Memento` 实例以 `<key,value>` 对的形式保存在名为 `savedStates`\
  \ 的哈表中。键是不同故事叙述的 `clockTick` 整数，值是由 `saveStateToMemento()` 返回的相应 `Memento` 实例。随后，当客户端想要将最新的\
  \ `HogwartsHappening` 实例的状态恢复到较早的状态时，客户端只需要调用 `restoreStateFromMemento()`，并将其参数设置为与所需\
  \ `clockTick` 对应的 `Memento` 对象即可。`Client` 类还提供名为 `latestStoryline` 的便利变量，你可以在为其创建\
  \ `HogwartsHappening` 实例之前在其中存储最新的情节。\n\n`main()` 函数中的其余代码用于首先在主时间流中创建一个 `HogwartsHappening`\
  \ 对象的序列，每个对象对应一个特定的 `clockTick`，并且每个都有自己的故事叙述。在这个序列的末尾（对应于赫敏将她的时间汤轮转了三圈），我们将最新的\
  \ `HogwartsHappening` 实例的状态恢复到三小时前的状态，即 `clockTick` 0。这是通过在最新的 `HogwartsHappening`\
  \ 实例化身上调用 `restoreStateFromMemento()` 命令实现的。发出此命令后，由于所提供的命令参数，`clockTick` 被重置为 0，随后的任何对\
  \ `HogwartsHappening` 构造函数的调用将创建一个该类的新实例序列，其新叙述对应于海角马和西里夫·布莱安全逃脱自由。\n\n\n\n\n\n\
