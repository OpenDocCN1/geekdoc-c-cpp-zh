  \ =\n\t\tBorderFactory.createMatteBorder(20,20,20,20, Color.red);\n\tpublic static\
  \ final Border blueborder =\n\t\tBorderFactory.createMatteBorder(20,20,20,20, Color.blue);\n\
  \tpublic static final Border magentaborder =\n\t\tBorderFactory.createMatteBorder(20,20,20,20,\
  \ Color.magenta);\n\tpublic static final Border greenborder =\n\t\tBorderFactory.createMatteBorder(20,20,20,20,\
  \ Color.green);\n}\n```\n\n## 12.11 ImageNotAvailableException 类\n\n由于 `ImageManager`\
  \ 类库存中可能没有肖像制作者请求的图像，我们需要一个异常类，当接收到此类图像的请求时，其实例可以作为抛出对象。所示异常类即是用于此目的。\n\n```java\n\
  \ public class ImageNotAvailableException extends Exception {\n\tpublic ImageNotAvailableException()\
  \ {\n\t\tsuper();\n\t}\n\tpublic ImageNotAvailableException(String message) {\n\t\
  \tsuper(message);\n\t}\n}\n```\n\n## 12.12 PortraitMakerAssignment 类\n\n`PortraitMakerAssignment`\
  \ 将作为我们的客户端，因为它将执行这个重量级模式（Flyweight pattern）演示中的其余代码。\n\n下面的代码展示了一个肖像制作者收到了四个肖像请求。其中有两个请求针对同一个前校长——Ambrose\
  \ Swott——这两个请求可能来自两个不同的客户。这两个肖像是带有两种不同边框请求的。如果我们的重量级模式按预期工作，第一个对 Ambrose Swott 肖像的请求应该导致\
  \ `FlyweightImageStore` 从 `ImageManager` 订购他的图像。然而，对同一个肖像的第二个请求只需要从 `FlyweightImageStore`\
  \ 类维护的本地存储中获取相同的图像。由于从 `ImageManager` 订购的每个图像都被 `FlyweightImageStore` 类存储，因此对该存储中图像数量的检查以及对实际从图像库（`ImageManager`\
  \ 类）订购图像数量的检查，可以告诉我们的重量级模式实现是否正常工作。需要注意的是，仅仅检查肖像制作者维护的本地存储中的图像数量是不够的。由于它是哈希表，重复插入一个\
  \ `<key,value>` 对（键是个人姓名，值是图像对象）将只会替换旧值。因此，我们还必须检查实际从 `ImageManager` 类订购的图像数量。这两个检查都由下面实现中的最后两个语句完成。在我们的案例中，对于肖像制作者收到的四个订单，这两个数字都应该是\
  \ 3。\n\n```java\n import javax.swing.*;\nimport javax.swing.border.*;\n\npublic\
  \ class PortraitMakerAssignment implements PortraitBorderChoices {\n\n\tString headmastername;\n\
  \tHeadMasterPortrait portrait;\n\n\tpublic PortraitMakerAssignment( String name,\
  \ Border border ) {\n\t\theadmastername = name;\n\t\tImageIcon imageRequested =\
  \ null;\n\t\ttry {\n\t\t\timageRequested =\n\t\t\t\tFlyweightImageStore.getImage(\
  \ headmastername );\n\t\t} catch (ImageNotAvailableException e) {\n\t\t\tSystem.out.println(\
  \ \"This portrait cannot be made since \"\n\t\t\t\t\t\t\t\t+ headmastername + \"\
  ’s image is not \"\n\t\t\t\t\t\t\t\t+ \"available from the archive.\");\n\t\t}\n\
  \t\tif (imageRequested != null)\n\t\t\tportrait =\n\t\t\tnew HeadMasterPortrait(name,\
  \ imageRequested, border);\n\t}\n\n\tpublic static void main( String[] args ) throws\
  \ Exception {\n\t\tPortraitMakerAssignment job1 =\n\t\tnew PortraitMakerAssignment(\"\
  Ambrose Swott\", greenborder );\n\t\tjob1.portrait.displayPortrait();\n\n\t\tPortraitMakerAssignment\
  \ job2 =\n\t\tnew PortraitMakerAssignment(\"Basil Frons\", redborder );\n\t\tjob2.portrait.displayPortrait();\n\
  \n\t\tPortraitMakerAssignment job3 =\n\t\tnew PortraitMakerAssignment(\"Ambrose\
  \ Swott\", redborder );\n\t\tjob3.portrait.displayPortrait();\n\n\t\tPortraitMakerAssignment\
  \ job4 =\n\t\tnew PortraitMakerAssignment(\"Phineas Nigellus Black\", blueborder\
  \ );\n\t\tjob4.portrait.displayPortrait();\n\n\t\tSystem.out.println( \"Number of\
  \ images in the portrait \"\n\t\t+ \"maker’s image store: \"\n\t\t+ FlyweightImageStore.getPortraitImageSize()\
  \ );\n\n\t\tSystem.out.println( \"Number of images ordered from the image \"\n\t\
  \t+ \"archive: \"\n\t\t+ FlyweightImageStore.howManyImagesOrderedFromImage());\n\
  \t}\n}\n```\n\n## 12.13 运行代码\n\n从书籍网站下载此模式的类文件到单独目录。使用命令编译代码：\n\n```\njavac *.java\n\
  ```\n\n并通过以下命令执行 `PortraitMakerAssignment` 类：\n\n```\njava PortraitMakerAssignment\n\
  ```\n\n根据 `PortraitMakerAssignment` 中 `main()` 方法的代码，执行该类将产生以下输出：\n\n```\n Number\
  \ of images in the portrait\nmaker’s image store: 3\nNumber of images ordered from\
  \ the image\narchive: 3\n(Also displayed on your screen will be four\nphotos ordered\
  \ from the archive --- of the three\ndifferent heads.)\n```\n\n为了获得额外的见，你可能希望按照以下方向扩展此模式的代码：\n\
  \n- 读者一定注意到，`ImageManager` 实现中的 `slideshow()` 方法在重量级模式的演示并没有实际使用。然而，这是一个有用的方法，`ImageManager`\
  \ 的客户端可以使用它快速浏览 `ImageManager` 持有的整个图像集合。修改演示代码，为 `PortraitMakerAssignment` 类提供幻灯片的选项。为了让这个扩展真正有用，最好是为\
  \ `PortraitMakerAssignment` 类创建一个基于 GUI 的界面，不仅允许用户查看幻灯片，还可以通过鼠标点击选择图像。\n\n- 在当前的演示中，客户端\
  \ `PortraitMakerAssignment` 在选择所需的图像之前下载了 `ImageManager` 持有的整个图像集合。这对于大型集合可能并不适用。更有可能是图像库——`ImageManager`\
  \ 类向肖像制作者提供其集合中图像的缩略图。预计肖像制作者将根据他们看到的缩略图选择图像。如果你愿意尝试，可以修改演示代码，将实际图像存储在 `ImageManager`\
  \ 类的私有部分，仅通过公共部分提供缩略图。当然，在肖像制作者选择了图像后，`ImageManager` 类将希望从其私有集合中提供图像。\n\n- `PortraitBorderChoices`\
  \ 接口中的边框都是统一颜色的，且宽度均为 20 像素。为了更复杂的演示，可以使用基于图标等的像素模式创建更精美的边框。如果读者选择按此方向扩展演示，他们会发现先学习官方\
  \ Java 网站上的 Swing “如何使用边框”教程会有益。\n\n\n\n\n`ImageManager` 类提供的霍格沃校长和女校长图像是从 [5] 下载的。\n\
  \n## 注意事项\n\n# 13 代理 (PROXY)\n\n## 13.1 必须要有实物 吗？\n\n在大多数情况下，人类想要只与真实的物体交互。当我们发现自己关注的对象是虚假的时，我们会觉得自己被欺骗了。\n\
  \n尽管我们对“假货”一词带有贬义色彩，但在现实生活中确实存在这样的情况：你需要的并不是真实物体本身，而是可以作为真实物体替代品的物体。泛泛地说，替代品之所以是“假”的，简单的原因是它与实物并不完全相同。尽管如此，当实物不可用，且认为替代品可以达到同样的效果时，替代品就可能是至关重要的。在许多情况下，这些替代品被称为\
  \ `proxies`（代理）。\n\n决定是否需要代理的实际考虑因素随情况而异。例如，企业组织通常允许股东在无法或不愿参加利益相关者会议时通过代理投票进行投票。在代理投票中，你可以指定其他人代表你进行投票。另一个例子（同样是在人类组织的背景下），组织负责人可以将其权力委托给指定的\
  \ `surrogate`（代理人）——实际上就是代理——以便在活动中执行某些职责。\n\n虽然“surrogate”和“proxy”这两个词在许多语境下含义相同，但前者通常指你指定某人代表你行动，而后者指上级指定某人代表你行动。\n\
  \n代理的概念在现代计算机网络中变得极其重要。在网络中，代理除了起到与人类组织基本相同的作用外，还用于控制资源访问以及允许用户在互联网上实现匿名。\n\n##\
  \ 13.2 意图与适用性\n\n代理模式的意图是提供一个可以作为真实对象替代的对象。\n\n在以下情况下，你应该考虑使用该模式：\n\n* 出安全考虑，你需要一个替代对象（代理）来监管对真实对象的访问；\n\
  * 你需要一个用于网络缓存的代理；\n* 你的客户端需要一个代理来对其访问访问进行匿名；\n* 你的客户端需要网络中远程主机上对象的代理，以便它们可以通过对本地代理的方法调用，来访问这些远程对象提供的服务。\n\
  \n## 13.3 代理模式简介\n\n代理模式是关于设计接口，客户端可以通过这些接口访问无法直接（或不允许直接）到达的资源。此类接口最常见的例子可能是某些互联网服务提供商（ISP）使用的代理服务器，用于引导客户所有通往网页的访问。至少，代理服务器可以为客户访问的信息提供缓存服务。因此，如果一个客户下载了（例如）*纽约时报*的网页，并在几秒钟内，另一个客户尝试执行相同的操作，那么第二个客户将看到第一个客户下载的内容的缓存副本。此类代理接口还可以充当安全网关。当用于安全时，代理可以在将连接转发到真实服务器之前，对客户和/或其请求进行身份验证。在这种情况下，代理模式的实现归变为编写一个客户端-服务器程序：对于那些需要访问网络其他地方资源的客户，它表现得像一个服务器；而对于客户想要访问的真实服务器，它表现得像一个客户端。\n\
  \n代理的概念也是分布式计算的基础，在分布式计算中，网络中的一台机器提供其他机器想要利用的服务。在所谓的分布式计算服务面向架构（SOA）中（如[图 13.1]\
  \ 所示），客户端想要调用位于网络中某台机器内存中的对象上的函数。然而，客户端必须首先解决由于对象由内存地址表示且内存地址不跨越机器边界而引起的问题。为了克服这一困难，在\
  \ SOA 实现中，当首次与拥有该对象的机器（服务器）建立连接时，客户端下载远程对象的代理（在此语境下通常被称为 `stubs` 存根）。这些位于客户端的代理随后作为基于服务器的远程对象的替代品。当客户端机器调用远程对象上的方法时（更准确地说，是对远程对象的本地代理的方法调用），代理的任务是将方法调用进行打包（这可能涉及对方法调用涉及的参数进行打包，或更常用的\
  \ `serializing` 序列化），并将其发送到远程服务器。服务器必须解包参数（或进行 `deserialize` 反序列化），执行方法，计算结果，必要时对结果进行序列化，并将通过这种方式获得的打包结果传回客户端。显然，只有当客户端机器也拥有从远程服务器计算得到的结果中对象的代理时，这种方法才有效。\n\
  \n![image](img/c13f001.gif)\n\n[**图 13.1**]\n\n## 13.4 现实应用中的代理模式\n\nSquid [7] 可能是世界上最流行的网络服务代理服务器。Squid\
  \ 代理既可以用于自我匿名，也可以用于缓存。对于匿名，你显然会使用托管在远程位置的此类代理，它将你的调用路由出去而不泄露你的身份。而当用于缓存时，ISP（互联网服务提供商）可以通过在其本地内存中临时存储客户端请求的网络资源，这样对相同网页对象的重复请求就可以无需从其原始源反复获取了。有些人还声称，如果你在自己的机器上安装这样的代理服务器，并要求网络浏览器通过代理路由所有外部请求，就可以改善你的个人上网体验。像\
  \ Squid 这样的代理服务器还可以被组织用于控制内部人员可以访问哪些外部资源。\n\n关于使用代理调用网络中远程机器上对象的方法，其中一个重要例子是 Java\
  \ 中的 RMI（远程方法调用）。当代理以此方式使用时，有时被称为 `remote proxy`（远程代理）。\n\n## 13.5 用于说明代理模式的哈利·波特故事\n\
  \n在我们对代理模式的演示中，黑魔伏地魔是真实的。读者可能记得，在前四本哈利·波特书中，伏地魔仅以精神形式存在，即没有人类身体。特别是在第一书中，伏地魔通过在霍格沃教授教授性魔法术的奇里勒斯·奇奇鲁精神存在。在代理模式的语言中，奇奇鲁在哈利·波特在霍格沃茨的第一年担任了伏地魔的代理。\n\
  \n\n\n\n\n# 演示代码背景回顾\n\n作为本章演示代码的背景，让我们简单回顾一下奇奇尔相对于他的导师伏地魔所扮演的角色。伏地魔的愿望是让奇奇尔偷走由著名炼金术士尼尼拉斯·弗拉梅尔拥有、并储存在古灵汇巫师银行的金石。伏地魔想要这块石头是因为它可以用来熬制一种能赋予饮者永生生命的药水。（伏地魔显然认为获得永生将让他恢复完整的生命形态。）不幸的是，伏地魔的这个计划失败了，因为邓布利在奇奇尔进入存放魔石的地下室之前，派遣了海格从古灵汇取走了魔石。\n\
  \n## 魔金石的保护\n\n从古灵汇取出魔石后，邓布利将其储存在霍格沃的一个秘密室里，该室的入口由多道咒语保护，每道咒语由霍格沃的不同教授创造。要到达隐藏魔石的密室，你必须首先穿过一只凶猛的三头狗（这是海格对魔石保护的贡献），并进入一个由三头狗守护的陷阱门后的滑道。你顺着滑道掉入布满魔植物的房间，正如其名称所示，它们试图紧紧地缠住你并将你勒死。这道咒语是由霍格沃茨的植物学教授波姆娜·斯鲁特创造的。如果你在魔植物中幸存，就会发现自己处于一个到处不断飞行的有翅钥匙的房间里。钥匙在墙壁之间穿梭，并在墙上弹跳。只有其中一把钥匙可以打开通往隐藏魔石下一个房间的门。这些钥匙是由菲利斯·弗莱维教授施了魔法的，他在哈利·波特在霍格沃茨第一年负责魔法课。\n\
  \n鉴于哈利·波特在魁地奇比赛中展现出的卓越金色球捕球员技巧，对他来说，通过在房间里的扫帚上追逐并抓到正确的钥匙相对容易。通往魔石之路上的下一个挑战是一个装有米内瓦·麦格格教授教授巫师棋盘的房间，上面有高大且带有魔法的棋子。哈利、罗恩和赫敏别无通过游戏来穿过棋盘到达另一侧，因为那里有一扇通往下一个房间的门。棋盘被施了魔法，允许哈利、罗恩和赫敏替换他们选择的三个黑棋。至于黑方如何下棋取决于这三个人，因为黑棋听从他们的命令，但白棋被施了魔法，会独立行动与黑棋对战。当白棋吃掉黑棋时，它们丝毫不留情——它们会将吃掉的棋子从棋盘上拖走并掉在地板上撞碎。因此，当罗恩决定赢得游戏的唯一方法是让白皇后吃掉自己时，他不得不让皇后击败——这让哈利和赫敏感到非常震惊。\n\
  \n这就剩下哈利和赫敏来对下一道保护——一只巨大的山魔。但正如后来为人知的，山魔被奇奇尔击昏了，而奇奇尔在到达魔石的过程中就在他们前面。所以哈利和赫敏能够直接走过山魔。这让哈利和赫敏来到了保护魔石的下一道咒语——一个有一个桌子的房间，上面放着七个形状不同的瓶子，装有不同种药水。（这道咒语是由塞弗勒斯·斯内教授创造的，他在哈利·波特在霍格沃茨第一年教授魔药。）关于七瓶药水的用途，发生的情况是：当哈利和赫敏一进房间，他们刚刚进入的门和通往下一个房间的门就会喷射出紫色火焰。在七瓶药水中，一种可以让饮者穿过通往下一个房间门的火焰，一种允许饮者穿过他们刚刚进入药水室门的火焰，两瓶含有无害酒，但三瓶含有会杀死他们的毒药。为了弄清楚哪瓶装的是什么药水，他们必须解决一个被称为“药水之谜”的谜题。赫敏凭借敏锐的逻辑感解决了谜题，让哈利进入了装有魔石最后的密室。赫敏回到罗恩昏迷的地方以便复活他，同时尝试向邓布利寻求帮助。\n\
  \n之所以对魔石的保护方式进行这番相当冗长的回顾，是为了让读者理解，为什么伏地魔的代理人必须是一个有能力的黑巫师，并预期能够克服用于保护魔石的咒语。\n\n##\
  \ 演示目标\n\n我们演示的目标不是完全重演奇奇尔如何尝试执行伏地魔的任务。相反，我们的演示将集中在奇奇尔尝试获取魔石最后这一小部分场景：哈利进入了实际隐藏魔石的房间。在他进入的那一刻，哈利看到奇奇尔感到震惊，因为他一直认为是斯内教授在寻找魔石。哈利对奇奇尔表达了极度惊讶，结果发现奇奇尔是作为伏地魔的代理人。从那时起，我们见证了奇奇尔与哈利之间的挣——奇奇尔试图从愿望镜中取出魔石（因为邓布利把魔石藏在在那里），而哈利则尽力防止奇奇尔将所有注意力都放在镜子上。\n\
  \n具体来说，我们的演示代码试图捕捉奇奇尔作为伏地魔代理人感到沮丧的时刻，因为他无法在愿望镜中看到魔石，更不用得到魔石了。他向他的导师寻求帮助以理解愿望镜的作用。伏地魔回复说，奇奇尔需要利用哈利来寻找魔石。这种代理人奇奇尔与导师之间的交流正是我们在此处的演示中所捕捉到的。\n\
  \n\n\n\n当我们说一个 `DarkWizard` 想要担任 `DarkLord` 的代理时，我们的意思是 `DarkWizard` 实例想要执行 `DarkLord`\
  \ 的命令。在我们的演示中，Quirrell 将作为 `DarkWizard` 的实例出现。如前提到的，我们的演示将集中在《哈利·波特》第一本书结尾的场景，在那里，伏地魔想要他的代理\
  \ Quirrell 从邓布利层在层层咒语下保护的密室中偷走魔石之石。\n\n## 13.7 抽象类 Wizard\n\n本节介绍的抽象类 `Wizard` 是用于演示代理模式的层级结构的根节点。如果读者对下方类定义中提到的属性感到困惑——你可能会说这些属性仅仅刻画了黑巫师——请注意，我们将这些属性的默认值设置为\
  \ `false`。换句话说，一个不是黑巫师的巫师`不`能够施展不可原谅的咒语；`不`能够熬制黑暗魔药；并且`不`能够复活魂尸。通过排除否定特征（而非包含正面特征）来定义该类的主要原因是，从所创建的对象实例来说，这个演示仅涉及那些倒向黑暗一方的巫师以及伏地魔本人。我们可以通过将下方类定义中的属性设置为\
  \ `true` 来捕捉巫师转向黑暗一面的概念。\n\n![image](img/c13f002.gif)\n\nFig. 13.2\n\n```\n abstract\
  \ class Wizard {\n\tprotected String name;\n\tprotected boolean canCastUnforgivableCurses\
  \ = false;\n\tprotected boolean canBrewDarkPotions = false;\n\tprotected boolean\
  \ canAnimateInferi = false;\n\n\tprotected Wizard(String name){\n\t\tthis.name =\
  \ name;\n\t}\n\tpublic String getName() { return name; }\n}\n```\n\n## 13.8 DarkWizardTraits\
  \ 接口\n\n记住，将黑巫师与普通巫师区分开来的是，前者从事一门或多种黑魔法，而这些魔法的实践通常会被关禁在阿兹卡班（巫师监狱）以作为惩罚。至少，黑魔法包括上一节中描述的：施展三种不可原谅的咒语、熬制黑暗魔药以及复活魂尸。\n\
  \n在我们的演示中，黑巫师必须实现下方的接口。这包括伏地魔本人。接口中声明的方法可以用于选择性地赋予黑巫师我们在上一节中描述的三种黑魔法中的一门或多种能力。例如，Quirrell\
  \ 承认他曾试图杀死哈利·波特（代表伏地魔），正如上一节所述，这使他成为了一名黑巫师。我们将使用下方所示的 `setCanCastUnforgivableCurses()`\
  \ 方法将 Quirrell 的实例变量 `canCastUnforgivableCurse` 设置为 `true`。\n\n```java\npublic interface\
  \ DarkWizardTraits {\n\tvoid setCanCastUnforgivableCurses(boolean yesOrNo);\n\t\
  void setCanBrewDarkPotions(boolean yesOrNo);\n\tvoid setCanAnimateInferi(boolean\
  \ yesOrNo);\n}\n```\n\n## 13.9 DarkWizard 类\n\n读者会记得，我们对代理模式的演示是基于 Quirrell 的，Qurell\
  \ 是 `DarkWizard` 类的一个实例，作为由唯一的 `DarkLord` 实例代表的伏地魔的代理。为了让 Quirrell 担任伏地魔的代理，Quirrell\
  \ 必须先与伏地魔建立通信链路。下方的 `DarkWizard` 类大部分内容与建立此通信链路的设施有关。\n\n`DarkWizard` 实例与单一 `DarkLord`\
  \ 实例之间的通信链路由四个单工通道组成，其中两个由 `DarkWizard` 实例启动，另外两个由 `DarkLord` 启动。`DarkWizard` 创建的两个单工通道通过它的两个内部类实现：\n\
  \n```\n TalkToDarkLord\n LinkFromDarkLord\n```\n\n第一个内部类 `TalkToDarkLord` 用于建立一个独立的线程，以便与\
  \ `DarkLord` 保持持续联系以处理发出的消息。第二个内部类 `LinkFromDarkLord` 用于创建一个独立的线程（该线程与其他所有执行线程并发运行），用于与\
  \ `DarkLord` 保持持续联系，以接收他对通过第一个通道发送的问题的回答。这些通道在 `DarkLord` 的实现代码中都有对应的项；我们将在介绍 `DarkLord`\
  \ 类时讨论它们。\n\n请注意 `establishCommunicationLinkWithDarkLord()` 方法的作用。正是这个方法知道 Java\
  \ 中的线程间通信是通过管道流（piped streams）进行的。这些流被称为 `PipedOutputStream` 和 `PipedInputStream`，定义了单向通信链路的两个端。假设你想让\
  \ `DarkWizard` 的线程 `A` 持续向 `DarkLord` 的线程 `B` 发送数据。你必须通过将本地输出流实例传递给输入管道流的构造函数，首先创建一个关联的输入管道流对。然后你将这对的本地端提供给本地线程\
  \ `A`，将这对的远程端提供给 `DarkLord` 的线程 `B`。显然，如果你想让 `DarkWizard` 持续接收来自 `DarkLord` 的答案，也必须为下行链路创建一个类似的管道流对。\n\
  \n现在让我们关注 `TalkToDarkLord` 内部类的实现。任何需要发送给 `DarkLord` 的消息都是通过该类的实例方法 `sendMessageToDarkLord(String\
  \ msg)` 给实例的。注意该方法是如何在消息末尾附加换行符 `\\n` 的。这样做有一个重要原因：实际上向输出管道流写入数据的流是 `DataOutputStream`\
  \ 对象。为了向伏地魔发送消息，`TalkToDarkLord` 实例调用了 `DataOutputStream` 对象的 `writeChars()` 方法。在通信链路的另一端，正如我们在下一节将看到的，`DarkLord`\
  \ 实例将使用 `BufferedReader` 对象的 `readLine()` 方法来读取摄入的数据。但该方法会阻塞，直到看到字符串末尾有换行符。也就是说，当\
  \ `readLine()` 方法从 `BufferedReader` 实例获取数据时，如果它没有看到换行符，它将一直继续等待下一个换行符的出现。因此，我们必须确保任何发出的消息都附加了换行符，否则接收方将无法从通信管道中获取消息。\n\
  \n\n\n\n在下方所示的类定义中，注意代码中本应在独立线程中运行的不同位置对 `Thread.sleep()` 的调用。让线程睡眠是促进线程协作和防止线程死锁的最有效方法之一。然而，当一个线程进入睡眠时，即使非常短暂，也会为另一个等待共享\
  \ CPU 时间的线程提供机会。我们将睡眠时间设为随机值，即在固定值的基础上加上随机数。这样做是为了打破因线程之间计时问题而可能引起的任何死锁。在所示的实现中，通过我们在\
  \ `assignedTask()` 方法中使用 `download.answerReceived` 变量的方式，已经进行了一定程度的线程同步。但是除非使用 `wait-notify`\
  \ 机制，否则通过变量进行线程同步具有导致线程死锁的风险。由于我们选择不使用 `wait-notify` 机制进行同步，因此我们通过检查 `downlink.answerReceived`\
  \ 变量的布尔值以及随机化睡眠时间来采取手动控制。\n\n后续代码中需要注意的额外一点是在类定义开始处构建了唯一的 `DarkLord` 实例。这里的想法是，我们希望所有的\
  \ `DarkWizard` 实例都知道 `DarkLord` 是谁——这可能就像《哈利波特》系列期间所有黑巫师的情况一样。读者可能会好奇这种构造与客户端类 `ClientClass`\
  \ 在第 13.11 节中构造 `DarkLord`的关系。有趣的是，正如读者在下一节看到的，由于 `DarkLord` 类是使用单例模式实现的，无论是谁从 `DarkLord`\
  \ 类构造实例，始终只有一个 `DarkLord` 实例。下方代码中的调用 `DarkLord.makeInstanceOfDarkLord()` 仅仅返回了在\
  \ `ClientClass` 的 `main()` 方法中构造的 `DarkLord` 实例，以便在第 13.11 节中展示。\n\n同样注意 `LinkFromDarkLord`类的实例变量\
  \ `answerReceived` 如何帮助处理 `DarkWizard` 与 `DarkLord` 之间通信的序列化。该变量的重要性从它在 `DarkWizard`\
  \ 的 `assignedTask()` 方法中的用法显而易见。`DarkWizard` 在向 `DarkLord` 发送新查询之前，会将此变量（即所指的 `downlink.answerReceived`）设置为\
  \ `false`。随后，当 `LinkFromDarkLord` 类的 `run()` 方法接收到响应时，该变量会被设置为 `true`。\n\n```java\n\
  \ import java.io.*;\n\npublic class DarkWizard extends Wizard implements DarkWizardTraits\
  \ {\n\n\tprivate TalkToDarkLord uplink;\n\tprivate LinkFromDarkLord downlink;\n\n\
  \tprivate static DarkLord youKnowWho =\n\t\t\tDarkLord.makeInstanceOfDarkLord( \"\
  Voldemort\" );\n\tpublic DarkWizard(String name){\n\t\tsuper(name);\n\t\t}\n\t\t\
