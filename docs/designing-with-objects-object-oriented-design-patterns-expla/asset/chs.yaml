  \        if ( reply.contains(\"/espeak\") ) {\n                String incantation\
  \ = \"Obliviate\" + muggleName;\n                incantation = incantation.replaceAll(\"\
  \ \", \"\");\n                Runtime.getRuntime().exec( incantation );\n      \
  \      } else {\n                if (error != null)\n                    System.out.println(\
