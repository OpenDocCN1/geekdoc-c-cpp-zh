  \n> `....`\n> `....`\n> `....`\n\n为了获得额外的见解，你可以尝试按照以下方向扩展该模式的代码：\n\n* 在适配器模式的三种实现中，我们的所有方法都返回\
  \ `void`。我们之所以可以这样做，是因为我们使用了方法打印的文本来代表老师要教的内容。你可能希望创建替代性的演示，让方法返回结果。对客户端可以接受的值进行限制，并相对于被适配器类（adaptee\
  \ classes）来编写你的适配器类，使得适配器类中获取的任何新功能都能满足客户端的限制。\n* 我们对适配器模式的实现之所以变得简单，是因为我们在适配器类和被适配器类中使用了相同的数据类型。如果在情况不是如此的情况下需要这种模式该怎么办？假设客户端想用一个新软件包替换旧软件包（因为新软件包增加了旧软件包提供的功能），但面临着由于两个软件包使用的数据类型之间不兼容而引起的问题。现在，你需要一个更复杂的适配器类，因为它还必须将新软件包中的数据类型翻译为被适配器类使用的数据类型。看看你能否为这个想法创建一个演示。\n\
  \n# 8 桥接 (BRIDGE)\n\n## 8.1 概念及其实现\n\n似乎提出一个新概念并将其实现是同一枚硬币的两面。将两者认为是不可分割的，这适用于我们日常生活中所完成的大部分工作。我们考虑到某件事（为了响应需求或其他原因），然后付诸行动。在这些情况下，我们自己既是概念的创建者，也是实现者。\n\
  \n然而，还有其他同样多的例子，即构思新概念的人与实现这些概念的人不是同一种。例如，在房屋的概念化（最初通过一组概念图，然后通过建筑布局图）和最终的建造过程中，涉及了不同的实体。\n\
  \n有趣性的一点是，当概念化和实现由两个不同的实体执行时，这两个实体不能完全独立地相互运行。创建新概念的人必须对实现者的能力有良好的感知。毕竟，制定一个遥远到任何人都可能无法实施的计划有什么意义呢？这表明，在参与创建新概念的人与负责实现这些概念的人之间需要一种直接的联系。这种联系允许概念创建者将他们的想法传达给执行这些想法的人，并随后检查实现是否按照概念创建者所列出的规范执行。\n\
  \n这引导我们进入桥接模式的核心关注点。该模式告诉我们，在面向对象的软件中，可以存在两个不同的实体：一个负责指定概念，另一个负责实现这些概念的任务，以及这两个实体如何通过一种你可能会称为“桥接”的结构连接在一起。\n\
  \n## 8.2 意图与适用性\n\n如果我们认为一个类连同它的属性定义了一个数据抽象，那么桥接模式的意图是将抽象与我们想要与抽象关联的行为的实现解耦。\n\n\
  在以下情况下，你应该考虑使用这种模式：\n\n* 负责指定抽象的实体与负责为抽象相关的行为提供实现代码的实体是独立的；\n* 需要允许对抽象及其实现进行独立的扩展；\n\
  * 需要向客户端“隐藏”客户端代码中使用的抽象实际上是如何实现这些的细节。\n\n## 8.3 桥接模式简介\n\n该模式关注了传统基于继承的类层次结构的一个主要缺点：它们受限于的问题在于，层次结构中的实现代码是永久地绑定在概念抽象层次结构上的。正如读者所知，在传统的类层次结构中，顶端是最通用的类，而底部的类则越来越专门。通常，从一个类中创建实例所需的所有代码都是该类从其父类和祖先继承的代码以及专门为该类定义的代码的组合。\n\
  \n实现代码与概念抽象之间的这种永久绑定，使得在编写完类层次结构的代码之后，修改和/优化实现变得更加困难。在某些情况下，这种永久绑定也会使得扩展概念抽象层次变得更加困难。\n\
  \n桥接模式教会我们如何将概念抽象层次结构与相关概念的实现类层次结构分开。这使得概念抽象的实现代码可以与抽象本身分开维护。这还允许可能存在两个独立的组织：一个负责发布高层次描述的概念抽象，另一个负责提供这些抽象的实现代码。\n\
  \n\n\n\n在解释桥接模式如何允许实现代码与类层次结构分离之前，让我们简要回顾一下传统编程的类层次结构，如图 8.1 所示。当你使用传统方法创建此类层次结构时，你会在根类\
  \ `A` 中放置供层次结构中所有其他类继承的最通用的属性和行为。随后，当你为类 `B` 编写代码时，将利用该类从其父类继承的属性和行为，并编写任何额外的代码来将这些属性和行为具体化为\
  \ `B`；以此此类推。这在概念抽象与实现这些抽象的功能代码之间创建了永久的绑定。通常情况下，这不是一个问题，因为提供概念抽象的软件供应商可能就是负责提供实现代码的供应商。而且，如果需要，使用该软件库的客户端始终可以通过对该库进行子类化以及额外的概念抽象和相关的实现代码，来根据其特定需求定制库定制。\n\
  \n![image](img/c08f001.gif)\n\n**图 8.1**\n\n然而，在某些情况下，你最好创建一个与概念层次结构独立但又与之连接的实现层次结构。也就是说，在某些情况下，我们只想在一个类层次结构中*声明*我们所需的功能，然后在另一个类层次结构中放置实现该功能的代码，这两个层次结构之间是相互独立的。为了解释这里*独立*一词的含义，让我们暂时考虑一下只有一个概念类的情况。通过下面的示例，让我们看看我们如何将类的声明与其实现分离开。\n\
  \n下面所示的 `Hello` 类想要向其客户端提供一个名为 `sayHello()`的功能。然而，该功能的实际实现是由另一个名为 `Hello_impl` 的类提供的（同样如下所示）。`Hello`\
  \ 类所做的仅仅是请求 `Hello_impl` 的实例来与 `sayHello()` 相关的行为执行所需的操作。\n\n```\n########################\
  \ class Hello ########################\nclass Hello {\n\tprivate Hello_Impl imp\
  \ = new Hello_Impl();\n\tpublic Hello( Hello_Impl impl ) {\n\t\tthis.imp = imp;\n\
  \t}\n\tpublic void sayHello() {\n\t\timp.sayHello();\n\t}\n}\n\n######################\
  \ class Hello_Impl ######################\nclass Hello_Impl {\n\tpublic void sayHello()\
  \ {\n\t\tSystem.out.println( \"Here is a hello from class Hello \" +\n\t\t\t\" --\
  \ it was supplied by class Hello_Impl\" );\n\t}\n}\n\n######################## class\
  \ Client ########################\nclass Client {\n\tpublic static void main(String[]\
  \ args) {\n\t\tHello h = new Hello( new Hello_Impl() );\n\t\th.sayHello();\n\t}\n\
  }\n```\n\n图 8.2 是上述代码的类图。如果我们将这种概念（显然用类表示）与其实现之间的分离扩展到图 8.1 的层次结构，那么该层次结构的整体实现将看起来像图\
  \ 8.3 所示所示，其中实现类的名称带有 `_Impl` 后缀。我们会在根实现类 `A_Impl` 中（它可能是抽象的）放置实现层次结构中所有其他类预期提供的功能声明。为了举一个简单的例子，假设每个概念类都有一个名为\
  \ `name` 的实例变量，我们期望每个类都提供一个返回从该类构造的实例中 `name` 值的“get”方法。基于桥接模式的软件设计，必须由实现层次结构提供此功能。因此，根节点的抽象实现类（我们在图\
  \ 8.3 示例中的 `A_Impl`）必须声明一个命名类似于 `getName()` 的方法。\n\n![image](img/c08f001.gif)\n\n\
  **图 8.2**\n\n![image](img/c08f002.gif)\n\n**图 8.3**\n\n## 8.4 现实应用中的桥接模式\n\n为了理解此模式如何在实际应用中使用的，首先熟悉\
  \ E-API 的概念是很好的，它代表*扩展 API*（*Extension API*）。更熟悉的 API 是*服务 API*（*Service API*），当需要将其与\
  \ E-API 区分时标记为 S-API。S-API 通常由由软件模块提供的方法列表（以方法签名的形式）组成。希望利用模块功能的人可以根据 S-API 中的声明来调用这些方法。\n\
  \n另一方面，模块的 E-API 是该模块期望由其他软件制品（通常称为插件）实现的方法的声明。插件的目的是通过额外的能力扩展模块的功能。为给定模块的插件创建实现代码的人只需要查看该模块的\
  \ E-API 即可。换句话说，如果你是一个插件开发者，只要你能够访问该模块的 E-API，你可能不需要查看该模块的源代码。\n\n这种基于插件的设计现在软件工程中被广泛使用。此类设计最流行的例子也许是用于软件开发的\
  \ Eclipse IDE、Java 平台的 EJB 容器框架等。\n\n根据第 8.3 节的讨论，插件结合通过 E-API 暴露的概念层次结构构成了桥接模式的实现。\n\
  \n## 8.5 用于说明桥接模式的哈利·波特故事\n\n为了演示桥接模式，我们将考虑一个涉及哈利·波特中某些魔法生物（特别是类人生物）的概念层次结构。演示将基于：食魂者、地精精和家养精灵。我们在图\
  \ 8.4 中展示了这一层次结构。\n\n![image](img/c08f004.gif)\n\n**图 8.4**\n\n\n\n\n桥接模式告诉我们，按照图\
  \ 8.5 所示的方式来实现如图 8.4 中的类层次结构具有若干优势。在后者的图中，我们通过为原始层次结构中的每个类创建一个相应的实现类，将实现代码保持在独立的层次结构中。\n\
  \n![image](img/c08f005.gif)\n\n图 8.5\n\n当实现代码按照图 8.5 所示的方式进行组织时，扩展概念层次结构会变得更容易，特别是当一个新概念可以使用现有的实现时。为了解释这一点，假设在我们按照图\
  \ 8.5 所示的方式编写了 `Humanoid` 层次结构的实现后，我们想要创建一个 `Human` 层次结构，作为 `Humanoid` 层次结构的子类（人类是类人，但反之不然）。让我们假设该概念层次结构的供应商还希望为这个新的\
  \ `Human` 创建子类，这些子类将对应于类人的 `Dementor`、`Goblin` 和 `HouseElf` 子类（2）。\n\n有了图 8.5 所示的新型解耦实现，供应商现在可以按照图\
  \ 8.6 所示的方式继续操作。由于 `Dementor` 可能会与类人的 `Dementor` 共享许多特征，最初编写在 `Dementor_Impl` 中的大部分代码现在可以直接复用在\
  \ `Dementor_Impl` 类的定义中。`Goblin_Impl` 和 `Elf_Impl` 类也是如此。甚至可能，当我们构造 `Dementor` 实例时，能够可以直接使用实现类\
  \ `Dementor_Impl` 来实现该目的。也就是说，我们可能甚至无需创建一个名为 `Dementor_Impl` 的独立实现类。这种方法对新创建的 `Goblin`\
  \ 和 `Elf` 类可能同样有效。为了强调这一点，图 8.6 中的类图并没有显示 `Dementor`、`Goblin` 和 `Elf` 的独立实现类。\n\n\
  ![image](img/c08f006.gif)\n\n图 8.6\n\n对于客户端类，我们的演示将使用“魔法部”（Ministry of Magic），因为该部的工作的工作是跟踪魔法世界中的类人。该类将命名为\
  \ `MinistryOfMagic`，它将创建摄魂怪（Dementors）、地精精和家养精灵的不同实例。\n\n## 8.6 模式演示的顶视图\n\n图 8.7\
  \ 展示了我们桥接模式演示的顶视图。如图所示，与我们之前的讨论一致，一方面，我们有一个 `Humanoid` 层次结构，它由同名的根抽象类及其子类 `Dementor`、`HouseElf`\
  \ 和 `Goblin` 组成。另一方面，我们有一个实现层次结构，它由抽象根类 `Humanoid_Impl` 及其具体子类 `HouseElf_Impl`、`Goblin_Impl`\
  \ 和 `Dementor_Impl` 组成。客户端类 `MinistryOfMagic` 的目标是构造魔法生物 `HouseElf`、`Goblin` 和 `Dementor`\
  \ 的实例，而无需知道这些具体是如何创建的。\n\n![image](img/c08f007.gif)\n\n图 8.7 这一点对于桥接模式尤为重要：模式的客户端不需要知道软件功能被编码在一个独立的实现类层次结构中，该结构独立于类声明所在的层次结构。换句话说，`Humanoid`\
  \ 是被编写为传统的基于继承的类层次结构，还是以桥接模式的形式编写，对客户端来说都没有影响。\n\n## 8.7 Humanoid 类\n\n本节介绍了概念层次结构的抽象根节点——`Humanoid`\
  \ 类。我们将此类声明为抽象类，仅仅是因为通常你不想直接从该类构造实例。作为一个概念，`Humanoid` 的抽象性与像 `Bird` 这样的类的抽象性是相同的。在鸟类的类层次结构中，你会希望构造\
  \ `Bird` 更具体的子类的实例，例如 `BlueJay`、`Finch` 等。抽象根类 `Bird` 的目的仅仅是捕捉所有鸟的通用属性。抽象根类 `Humanoid`\
  \ 也是如此。\n\n在下方所示类定义中最值得注意的一点可能是，它有一个名为 `imp` 的实例变量，类型为 `Humanoid_Impl`。这是以 `Humanoid`\
  \ 为根的概念层次结构与以 `Humanoid_Impl` 为根的实现层次结构之间唯一的联系。\n\n```java\nimport java.util.*;\n\
  \nabstract class Humanoid {\n\tprotected Humanoid_Impl imp;\n\n\tprotected Humanoid(Humanoid_Impl\
  \ imp) {\n\t\tthis.imp = imp;\n\t}\n\n\tprotected void registerWithMagic(String\
  \ category) {\n\t\timp.registerWithMagic(category);\n\t}\n\n\tprotected void unRegisterWithMagic(String\
  \ category) {\n\t\timp.unRegisterWithMagic(category);\n\t}\n\n\tprotected int howMany()\
  \ {\n\t\treturn imp.howMany();\n\t}\n\n\tprotected String getName() {\n\t\treturn\
  \ imp.getName();\n\t}\n\n\tprotected String getServingAs() {\n\t\treturn imp.getServingAs();\n\
  \t}\n\n\tpublic List<String> getAppearance(String category) {\n\t\treturn imp.getAppearance(category);\n\
  \t}\n\n\tpublic List<String> getBehavior(String category) {\n\t\treturn imp.getBehavior(category);\n\
  \t}\n}\n```\n\n## 8.8 Dementor, Goblin 和 HouseElf 类\n\n由于 `Humanoid` 层次结构中的三个类具有相似的定义，我们将它们在本节一起介绍。对于所示的\
  \ `Dementor` 类，请注意构造函数如何将实现类 `Dementor_Impl` 的实例发送给根类。对于方法定义，尽管这些方法大部分名称与父类相同，但它们实际上并不是相同的方法（也就是说，即使方法名与父类相同，父方法也需要类参数，而这里对应的方法是无参方法）。\n\
  \n```java\nimport java.util.List;\n\npublic class Dementor extends Humanoid {\n\n\
  \tpublic Dementor(String occupation) {\n\t\tsuper(new Dementor_Impl(occupation));\n\
  \t}\n\n\tpublic void registerWithMagic() {\n\t\tregisterWithMagic(\"Dementor\");\n\
  \t}\n\n\tpublic void unRegisterWithMagic() {\n\t\tunRegisterWithMagic(\"Dementor\"\
  );\n\t}\n\n\tpublic void printName() {\n\t\tString name = getName();\n\t\tSystem.out.println(\"\
  The name of the dementor is: \" + name);\n\t}\n\n\tpublic void printServingAs()\
  \ {\n\t\tString name = getServingAs();\n\t\tSystem.out.println(\"The dementor is\
  \ serving as: \" + name);\n\t}\n\n\tpublic List<String> getAppearance() {\n\t\t\
  List<String> list = getAppearance(\"Dementor\");\n\t\treturn list.toString();\n\t\
  }\n\n\tpublic List<String> getBehavior() {\n\t\tList<String> list = getBehavior(\"\
  Dementor\");\n\t\treturn list.toString();\n\t}\n}\n```\n\n*(注：由于原文文本中 8.8 节的代码块在输入处似乎不完整，译文已根据逻辑尽可能翻译了提供的部分，并保持了代码块格式。)*\n\
  \n\n\n\n\n接下来，我们在 `Humanoid` 概念层次结构中介绍 `Goblin` 类。与 `Dementor` 类一样，请注意 `Goblin`\
  \ 构造函数是如何将实现类 `Goblin_Impl` 的实例发送给 `Humanoid` 根类的构造函数的。这种机制为根类 `Humanoid` 中的实例变量\
  \ `imp` 赋予了正确的值。之前之前关于 `Dementor` 类方法定义的注释也适用于这里。特别地，我们指的是：尽管 `Goblin` 的几个方法名称与父类\
  \ `Humanoid` 中的方法相同，但由于它们的方法签名（signatures）不同，它们实际上并不是是同一种方法。因此，`Goblin` 类中同名的方法并不是为了重写\
  \ `Humanoid` 类中对应的方法。\n\n* *\n\n```java\nimport java.util.List;\n\npublic class\
  \ Goblin extends Humanoid {\n\n  public Goblin( String name, int age ) {\n    super(\
  \ new Goblin_Impl( name, age ) );\n  }\n  public void registerWithMinistryOfMagic()\
  \ {\n    registerWithMinistryOfMagic( \"Goblin\" );\n  }\n  public void unRegisterWithMinistryOfMagic()\
  \ {\n    unRegisterWithMinistryOfMagic( \"Goblin\" );\n  }\n  public void printName(){\n\
      String name = getName();\n    System.out.println( \"The name of the Goblin is:\
  \ \" + name );\n  }\n  public String getAppearance() {\n    List<String> list =\
  \ getAppearance( \"Goblin\" );\n    return list.toString();\n  }\n  public String\
  \ getBehavior() {\n    List<String> list = getBehavior( \"Goblin\" );\n    return\
  \ list.toString();\n  }\n}\n```\n\n* *\n\n最后，我们介绍 `HouseElf` 类。除了类名以及由于类名不同导致的变化外，下面所示的代码与\
  \ `Dementor` 和 `Goblin` 类代码完全相同。\n\n* *\n\n```java\nimport java.util.*;\n\n  public\
  \ class HouseElf extends Humanoid {\n\n  public HouseElf( String name, int age )\
  \ {\n    super( new HouseElf_Impl( name, age ) );\n  }\n  public void registerWithMinistryOfMagic()\
  \ {\n    registerWithMinistryOfMagic( \"House Elf\" );\n  }\n  public void unRegisterWithMinistryOfMagic()\
  \ {\n    unRegisterWithMinistryOfMagic( \"House Elf\" );\n  }\n  public void printName(){\n\
      String name = getName();\n    System.out.println( \"The name of the House Elf\
  \ is: \" + name );\n  }\n  public String getAppearance() {\n    List<String> list\
  \ = getAppearance( \"House Elf\" );\n    return list.toString();\n  }\n  public\
  \ String getBehavior() {\n    List<String> list = getBehavior( \"House Elf\" );\n\
      return list.toString();\n  }\n}\n```\n\n* *\n\n## 8.9 Humanoid Imp 类\n\n这是实现层次结构的根类。首先，请注意该类是抽象的，就像概念层次结构的根类\
  \ `Humanoid` 也是抽象的一样。我们不期望直接从该类创建实例。该类从实现的角度定义了尽可能通用地一个实体作为 Humanoid（类人）意味着什么。因此，在该根类的实现代码中，没有特定的\
  \ `Dementor`（食魂鬼）、`Goblin`（地精）等特定信息。\n\n请注意该类的静态变量，即 `registeredHumanoids`、`behavior`\
  \ 和 `appearance`。这些变量用于存储通用的类别级信息。也就是说，关于概念层次结构中所有具体概念的通用信息将存储在这些变量中。正如你所看到的，这三个静态变量中的\
  \ `behavior` 和 `appearance` 将在各自的实现类 `HouseElf_Impl`、`Goblin_Impl` 和 `Dementor_Impl`\
  \ 中分别初始化。由于这些静态变量存储的是哈希表，信息以 `<key,value>` 对的形式存储，其中 key 是物种的名称，value 是该物种的属性列表。\n\
  \n\n\n\n下方显示了实现类 `Dementor_Impl`。该具体类的构造函数调用了父类 `Humanoid_Impl` 的单参数构造函数。此外请注意类定义中大括号内的双语句段落对静态变量\
  \ `behaviors` 和 `appearance` 的初始化。\n\n由于我们正在定义一个继承自抽象类 `Humanoid_Impl` 的具体类，因此我们有责任为根类\
  \ `Humanoid_Impl` 中声明的抽象方法 `howManyRegistered()` 提供具体实现。此处显示的实现专门 `Dementor_Impl`\
  \ 类。\n\n```\n import java.util.*;\n\npublic class Dementor_Impl extends Humanoid_Impl\
  \ {\n\n  public Dementor_Impl( String occupation ) {\n   super( occupation );\n\
    }\n  {\n   setBehavior( \"Dementor\", new ArrayList<String>(\n   Arrays.asList(\
  \ \"soulless\",\n   \"prison guard duty\",\n   \"immortal\"\n   ) ) );\n   setAppearance(\
  \ \"Dementor\", new ArrayList<String>(\n   Arrays.asList( \"10 feet tall\",\n   \"\
  no eyes\",\n   \"hole for mouth\"\n   ) ) );\n  }\n\n  public int howManyRegistered()\
  \ {\n   int n = 0;\n   for (Map.Entry<String, String>\n   entry: registeredHumanoids.entrySet())\
  \ {\n   if ( \"Dementor\".equals( entry.getValue() ) ) n++;\n  }\n  return n;\n\
    }\n}\n```\n\n接下来我们展示实现类 `Goblin_Impl`。`Dementor_Impl` 的构造函数调用其父类的单参数构造函数来初始化子类实例的父类部分，而\
  \ `Goblin_Impl` 构造函数则调用父类的双参数构造函数来完成相同的操作。这种差异的原因是，如前面提到的，摄魂者大多通过一个属性广为人知——它们的职业（例如担任监狱守卫），而地精更有可能通过它们的名字和年龄等个人属性广为人知。\n\
  \n关于静态变量 `behaviors` 和 `appearance` 的初始化，此处的代码与 `Dementor_Impl` 类中的相同，如类定义中大括号内的双语句段所示。继承自父类的抽象方法\
  \ `howManyRegistered()` 的实现遵循与 `Dementor_Impl` 类相同的逻辑，尽管其具体细节特定于 `Goblin_Impl` 类。\n\
  \n```\n import java.util.*;\n\npublic class Goblin_Impl extends Humanoid_Impl {\n\
  \n  public Goblin_Impl( String name, int age ) {\n   super( name, age );\n  }\n\
    {\n  setBehavior( \"Goblin\", new ArrayList<String>(\n   Arrays.asList( \"no wands\"\
  ,\n   \"goblin magic only\",\n   \"banking\"\n   ) ) );\n   setAppearance( \"Goblin\"\
  , new ArrayList<String>(\n   Arrays.asList( \"long thin fingers\",\n   \"large domed\
  \ heads\",\n   \"large black eyes\"\n   ) ) );\n  }\n  public int howManyRegistered()\
  \ {\n   int n = 0;\n   for (Map.Entry<String, String>\n   entry: registeredHumanoids.entrySet())\
  \ {\n   if ( \"Goblin\".equals( entry.getValue() ) ) n++;\n  }\n  return n;\n  }\n\
  }\n```\n\n最后，我们展示实现类 `HouseElf_Impl`。由于它的定义与之前的类 `Goblin_Impl` 非常相似，因此代码不需要解释。\n\
  \n```\n import java.util.*;\n\npublic class HouseElf_Impl extends Humanoid_Impl\
  \ {\n\n  public HouseElf_Impl( String name, int age) {\n   super( name, age);\n\
    }\n  {\n   setBehavior( \"House Elf\", new ArrayList<String>(\n   Arrays.asList(\
  \ \"obedient\",\n   \"pliant\",\n   \"loyal\"\n   ) ) );\n   setAppearance( \"House\
  \ Elf\", new ArrayList<String>(\n   Arrays.asList( \"small\",\n   \"spindly arms\"\
  ,\n   \"large head\"\n   ) ) );\n  }\n  public int howManyRegistered() {\n   int\
  \ n = 0;\n   for (Map.Entry<String, String>\n   entry: registeredHumanoids.entrySet())\
  \ {\n   if ( \"House Elf\".equals( entry.getValue() ) ) n++;\n  }\n  return n;\n\
    }\n\n## 8.1 客户端 MinistryOfMagic\n\n这是演示桥接模式的可执行类。在该类的 `main()` 方法中，我们创建了 `HouseElf`、`Goblin`\
  \ 和 `Dementor` 的实例并用 `MinistryOfMagic` 注册它们。我们还打印了不同类型人类的特征。\n\n有趣的是，在类的 `main()`\
  \ 中产生的输出是通过直接在不同类型的 `Humanoid` 实例上调用方法得到的。然而，读者现在应该知道，这些调用实际上是由 `Humanoid_Impl`\
  \ 类中的代码处理的。例如，当我们注册一个 `HouseElf` 时，该代码位于 `Humanoid_Impl` 类中。同样，当我们打印一个 `HouseElf`\
  \ 的名字时，该代码也位于 `Houseoid_Impl` 类中。\n\n`Humanoid` 实例上的所有调用转化为 `Humanoid_Impl` 层次结构的调用，而当你意识到\
  \ `Humanoid` 抽象层次结构与 `Humanoid_Impl` 实现层次结构之间的连接是 `Humanoid` 类中的实例变量 `imp` 时，这一事实变得更加显著。\n\
  \n```\n public class MinistryOfMagic {\n  public static void main( String[] args\
  \ ) {\n\n  // House Elves:\n  HouseElf elf1 = new HouseElf( \"Dobby\", 15 );\n  elf1.registerWithMinistryOfMagic();\n\
    elf1.printName();\n  HouseElf elf2 = new HouseElf( \"Hokey\", 15 );\n  elf2.registerWithMinistryOfMagic();\n\
    elf2.printName();\n  int n = elf2.howManyRegistered();\n  System.out.println(\
  \ \"Number of elves registered: \" + n );\n...（此处省略重复代码）\n```\n\n\n\n\n* 之前提到过桥接模式可以使概念层次结构的扩展变得更容易。图\
  \ 8.6 显示，可以为 `Humanoid` 类构想一个 `Human` 子类，然后进一步将 `Human` 类扩展为 `Human_Dementor`、`Human_Goblin`\
  \ 和 `Human_Elf` 类，这些类是真正的类人生物 `Dementor`、`Goblin` 和 `HouseElf` 更接近人类的等价物。按照这一思路修改本章演示的代码，看看你可以在多大程度上重用实现类\
  \ `Dementor_Impl`、`Goblin_Impl` 和 `HouseElf_Impl` 中已经提供的代码。\n\n* 在客户端类 `MinistryOfMagic`\
  \ 中，我们创建的所有 `Humanoid` 实例的引用都是由特定于这些实例类型的变量持有的。这通常被认为是一种糟糕的编程实践.^(4) 例如，这里是与 `MinistryOfMagic`\
  \ 的 `main()` 方法中创建第一个类人生物 `HouseElf` 相关的语句：\n\n```\nHouseElf elf1 = new HouseElf(\
  \ \"Dobby\", 15 );\nelf1.registerWithMinistryOfMagic();\nelf1.printName();\n```\n\
  \n由于 `HouseElf` 是一个 `Humanoid`，我们是否可以将变量 `elf1` 声明为 `Humanoid` 类型呢？如果你不知道答案，请看将\
  \ `elf1` 的类型从 `HouseElf` 改为 `Humanoid` 会发生什么，并为你观察到的现象给出理由。\n\n# 9 组合模式 (COMPOSITE)\n\
  \n## 9.1 回路关系\n\n不同类型对象之间最易理解的关系通常是严格层次化的。这种关系也容易可视化，因为它们可以以树的形式显示。考虑为生物体和植物创建的分类法.^(1)。在这些分类法中，对某个类别的成员身份划分基于共同的进化历史，类别之间的主要关系是源自最近共同祖先的共同后代。这种分类法是严格层次化的，因此可以作为树来显示。\n\
  \n现在让我们谈谈不同类型的人造物理对象之间以及不同类型的抽象概念之间的关系。虽然我们可以自由地使用任何标准来定义不同类别的成员身份以及类别之间关系的构成，但我们希望这些标准能产生某些用途。至于这个用途是什么，取决于你尝试建模物理对象（或抽象概念）的应用领域。\n\
  \n事实证明，人造对象和抽象概念所需的建模——即服务某些有用目的的建模——通常也是严格层次化的。任何做过一点点面向对象编程的人都知道，对象类别之间最常用的关系之一是继承，即父类别的后代继承父类的属性。至少在精神上，对于人造对象（以及抽象概念）的情况，类别之间纯基于继承的关系，与自然对象中基于进化历史的分类法关系是相似的。\n\
  \n尽管我们有很多关于人造对象和抽象概念的严格层次模型示例，但也存在许多并非如此的例子。也就是说，当我们对人造对象和抽象概念进行建模时，建模图中的某些关系可能需要从专门的类别回更通用的类别形成回路。这些回路链接通常涉及某种包含关系——这是一种关系概念，也被称为聚合（aggregation）、组合（composition）和\
  \ `has-a`（拥有）。^(2)\n\n考虑以下简单的示例：假设我们想要建模座椅类对象之间的关系——即人们在不想站立或躺下时坐在上面的对象。我们可以将 `seat`（座椅）视为一个泛抽象对象，赋予它“*可以坐*”的属性。通过继承（通过\
  \ `is-a` 关系），我们现在指定更具体的对象类别，如 `chair`（椅子）、`stool`（凳子）、`sofa`（沙发）等作为根类别 `seat` 的子类。为止，我们的类别间关系完全是层次化的，可以以树的形式显示，`seat`\
  \ 为根，具体类别作为根的节点。\n\n然而，考虑到模块化家具已不再稀奇，而且通过组合不同配置的座椅可以设计出扩展的区域，我们可以构想另一个对象类别，称为 `combo_seat`（组合座椅）。^(3)\
  \ 因为 `combo_seat` 毕竟是一个座椅，它也是 `seat` 的子类。但同时，`combo_seat` 也是其他 `seat` 对象的聚合。因此，在描述\
  \ `combo_seat` 对象的领域的关系时，我们必须显示从 `combo_seat` 回到通用类 `seat` 的链接。该链接显然是一个包含链接——类图术语中的关联链接（associational\
  \ link）。因此，我们对类别的整体描述将显示从 `seat` 到每个 `chair`、`stool`、`sofa`、`combo_seat`等的继承链接，然后是从\
  \ `combo_seat` 回到通用类 `seat` 的回路。\n\n正如你在本章中看到的，组合模式利用类图中的这些回路，为了更高效地组织类实例的生成。\n\n\
  ## 9.2 意图与适用性\n\n组合模式的意图是通过相同接口中的代码以统一的方式处理所有对象，包括那些对其他对象的组合。\n\n在以下情况下，你应该使用此模式：\n\
  \n* 所有类（包括涉及其他类的组合类）具有相同的基本类型；\n\n* 类层次结构的客户端希望使用相同的根接口操作所有对象，包括涉及其他对象的组合对象；\n\n\
  * 你可以在根接口中放置必要的保护，以处理针对复杂类的行为调用在从其他类构建的对象上的情况。\n\n## 9.3 组合模式简介\n\n正如你从第 1 章所知以及在第\
  \ 9.1 节](#c09.xhtml_head-c9-1)中提到的那样，当我们认为一个大实体是由较小实体组成时，我们可以把前者称为后者的组合（composition）或组合体（composite）。通常情况下，组合体可能涉及异的元素。而且通常情况下，大实体本身可能与构成它的较小元素非常不同。这种组合如图图\
  \ 9.1 所示。该类图告诉我们，我们可以认为汽车是四个轮子、引擎、变速箱和车身的组合体。\n\n![image](img/c09f001.gif)\n\n**图\
  \ 9.1**\n\n\n\n\n\n组合模式（Composite pattern）*并不是*为了图 9.1 所示的情况而设计的。为了理解该模式适用于哪种组合，让我们考虑为工厂的工作人员绘制一张类图。这些员工中有些是普通工人，有些是间头，有些是计算机操作员，有些是秘书，还有一些经理。经理是指监督一群工人、间头、计算机操作员、秘书等的人。因此，当我们定义\
  \ `Manager` 类时——我们将类定义看作代表个人所扮演的角色，而不仅仅是个人本身——它必须包含对经理所监督的个人的引用。为了构建这种情况的类图，我们首先注意到，所有在工厂工作的人员（包括经理在内）都是拥有该工厂的组织的员工。尽管\
  \ `Manager` 本质上是一个 `Employee`，但我们仍然为 `Manager` 类赋予实例变量，用于表示那些受经理监督的其他员工。虽然在类图中我们将\
  \ `Manager` 描述为 `Employee` 的特化类，但我们也希望显示出经理的角色涉及一个对其他 `Employee` 的组合。这些事实在图 9.2\
  \ 的类图中得到了体现。\n\n![image](img/c09f002.gif)\n\n**图 9.2**\n\n在图 9.2 的类图中，带箭头的链接表示我们通过继承扩展了\
  \ `Employee` 类。这些链接意味着 `Worker` 是一个 `Employee`，`Foreman` 是 `Employee`，`Secretary`\
  \ 如此，`Computer Operator` 也是如此。更进一步，尽管 `Manager` 也是一个 `Employee`，但它的定义涉及对任意数量的 `Worker`、`Foreman`、`Computer\
  \ Operator` 和 `Secretary` 实例的组合。最后一个事实是通过从 `Manager` 回到 `Employee` 的链接中端端的实心菱形（filled-diamond）表示的。*这种组合正是组合模式的焦点。*来自\
  \ `Manager` 的组合链接在 `Employee` 端的的多重性符号‘1..*’表示 `Manager` 角色涉及对任意数量的 `Employee` 角色的组合，只要经理至少监督一个其他员工即可。\n\
  \n由于图 9.2 建模图中显示的所有类都是 `Employee` 类型，我们可以提出以下问题：是否可能仅通过根类 `Employee` 类中定义的接口，就可以操作从类图中具体类中创建的所有对象？*组合模式恰恰回答了这个问题。*\n\
  \n组合模式告诉我们，从如图 9.2 所示的类层次结构中构建的所有对象，都可以通过仅为根类 `Employee` 定义的接口进行创建、访问和操作。这里特别值得注意的是，这还包括了从\
  \ `Manager` 类构建的对象，而该类的定义包含了对其他 `Employee` 对象的组合。你可能会问，由于 `Manager` 类预期的职责比非监督性的\
  \ `Employee` 类多得多，如何可能通过 `Employee` 接口甚至操作 `Manager` 对象呢？这正是组合模式的秘密所在。\n\n根据组合模式，你为图\
  \ 9.2 中的 `Employee` 类赋予了任何后代类（包括 `Manager` 类）所需的所有行为，但带有一个默认定义，该定义通常会在对对象进行不当的情况下调用这些行为时警告客户端。为了说明，假设我们想要定义一个名为\
  \ `hireSecretary()` 的方法，允许 `Manager` 实例能够聘佣新秘书。但由于允许 `Foreman` 实例聘佣秘书可能没有意义，我们将在根类\
  \ `Employee` 中定义此方法，并给出一个默认定义，仅抛出异常并显示警告消息。相反，此方法可以在 `Manager` 类中重写，以提供该类聘佣秘书所需的功能\n\
  \n## 9.4 真实世界应用中的组合模式\n\n该模式适用于任何你希望以统一方式处理基本类以及任何涉及对基本类组合的较大类的应用。最常见的情况下，你可能只想针对涉及不同类的特定计算执行此操作，如下文所示。\n\
  \n让我们假设，你正在为一个大类 `C[large]` 编写代码，该类通过其实例变量与若干更基础的类 `C[1]`、`C[2]`、`· · ·` 关联，这些类之前在可能不同的上下文中定义。你的应用程序要求你根据某些元素属性\
  \ `p[elem]` 遍历 `C[large]` 实例包含的所有对象。但不幸的是，该属性的计算在定义 `C[1]`、`C[2]`、`· · ·` 时并未包含在它们的实现中。假设\
  \ `p[elem]` 的计算在所有组件类 `C[1]`、`C[2]`、`· · ·` 中都需要相同的实现，那么解决此问题的一种简便方法（这将对组件类 `C[1]`、`C[2]`、`·\
  \ · ·` 的改动极小）是首先定义一个抽象根类 `C[new_root]`，其中包含组件类所需的计算 `p[elem]` 的代码。(4)随后，我们将所有其他类\
  \ `C[i]`（`i = 1, 2, ...`）和 `C[large]` 自新根类 `C[new_root]`。在你正在工作的 `C[large]` 类中，你显然需要对根类方法进行重写实现，因为该方法需要遍历组件对象。随后，你将可以通过\
  \ `C[new_root]` 中定义的接口操作你的 `C[large]` 对象，并通过调用你在 `C[new_root]` 中定义的方法来计算 `p[elem]`。这构成了基于组合模式的解决方案。\n\
  \n## 9.5 用于说明组合模式的哈利·波特故事\n\n\n\n\n\n在我们演示组合模式（Composite pattern）时，感兴趣的组合对象是魔法部。具体而言，我们将关注魔法部部长的角色，特别是他或她对魔法部内不同巫师的监督。这些人员包括遗忘咒者、食魂捕猎者以及各种部门主管。遗忘咒者的工作是如果麻瓜类目击了巫师或女巫的任何魔法活动，就对其施加记忆咒。该咒会让麻瓜类忘记他们可能通过魔法看到的任何内容。食魂捕猎者的工作是捕获食魂徒，这些是投向黑暗面的巫师。部长还负责聘用和解雇魔法部内各个部门的主管。魔法部一些较著名的部门包括魔法法律执法部、魔法事故与灾难部以及魔法交通部。大型部门会进一步划分为办公室，每个办公室负责一个独立的功能。例如，魔法法律执法部由魔法滥用办公室、食魂捕猎者办公室和巫师法委员会（它更像是一个高等法院而非办公室）等组成。\n\
  \n图 9.3 直接直观地描述了这样一个事实：如上所述，魔法部部长的角色包括对魔法部的其他员工行使监督权。然而，这种描述未能体现部长本身也是一名巫师这一事实，而且他与图中所有员工共享许多特质。\n\
  \n![image](img/c09f003.gif)\n\n图 9.3\n\n因此，由于图 9.3 类图中的所有实体仅仅是不同类型的 `Wizard`（巫师），因此图\
  \ 9.4 展示了[图 9.3]中关系的更完整的描述。通过像图 9.4 那样表示类关系——特别是关注到图 9.4 中的所有类（即使是那些复杂的类）都与更基础的类\
  \ `Wizard` 类型相同这一事实——使我们能够从组合模式中获益。通过组合模式，我们的目标是在层级结构中定义所有类（包括更复杂的类 `MinisterForMagic`，魔法部长）的所有功能，即根类\
  \ `Wizard`。我们在本章后面展示的 `Wizard` 类的实现正是此操作。\n\n![image](img/c09f004.gif)\n\n图 9.4\n\
  \n## 9.6 模式演示的顶层视图\n\n图 9.5 展示了我们组合模式演示的顶层视图。为了编程方便起，我们在一个名为 `WizardTraits` 的独立接口中以枚举（enums）的形式定义了一些关键的巫师资质。我们将在下一节中对这些枚举进行更多说明。在这里只需说明，这些枚举为我们在魔法部不同职位的巫师资质提供了一套词汇。\n\
  \n图 9.5 中的图包含了 `UnauthorizedAccessException` 类，该类在组合模式的运行中起着重要作用。回想一下，我们希望在根类 `Wizard`\
  \ 中放置任何后类所需的所有行为，这包括了相当复杂的 `MinisterForMagic` 类。显然，几种适用于部长的行为并不适用于其他巫师。为了在组合模式的框架内解决这个问题，对于\
  \ `Wizard` 类中专门为 `MinisterForMagic` 设计的行为，我们为它们提供了默认实现，该实现仅是抛出 `UnauthorizedAccessException`\
  \ 异常。正如你所预期的，`MinisterForMagic` 类会根据情况覆盖这些默认定义。`UnauthorizedAccessException` 类的定义非常直观。如下所示，该异常类可能唯一值得注意的地方就是它的名字。该名称将向客户端指示导致触发此异常的违规性质。\n\
  \n![image](img/c09f005.gif)\n\n图 9.5\n\n```java\npublic class UnauthorizedAccessException\
  \ extends Exception {\n  public UnauthorizedAccessException() { super(); }\n  public\
  \ UnauthorizedAccessException(String arg0) { super(arg0); }\n}\n```\n\n最后，注意图 9.5\
  \ 中的 `Test` 类。我们在这个类中测试组合模式的演示代码。你可以将 `Test` 认为是 `Wizard` 层级的客户端类。\n\n## 9.7 WizardTraits\
  \ 接口\n\n`WizardTraits` 的作用仅仅是作为根类 `Wizard` 以及本次演示中其他一些类的辅助接口。如前所述，该接口的目的是为魔法部职位的巫师资质创建一个词汇。我们使用\
  \ Java 枚举来定义四种类型的资质：`WizardLevel`、`SchoolGraduatedFrom`、`HogwartsHouse` 以及 `WizardryStrength`。演示假设，当巫师的任何这些资质类型未知时，将其设置为\
  \ `Unknown`。\n\n```java\npublic interface WizardTraits {\n  public static enum WizardLevel\
  \ {\n  Novice, Intermediate, Advanced, Master, Unknown }\n  public static enum SchoolGraduatedFrom\
  \ {\n  Hogwarts, Durmstrang, Beauxbatons, HomeSchooled, Unknown }\n  public static\
  \ enum HogwartsHouse {\n  Gryffindor, Hufflepuff, Ravenclaw, Slytherin, Unknown\
  \ }\n  public static enum WizardryStrength {\n  Transfiguration, DADA, Charms, Spells,\
  \ Flying, Unknown }\n}\n```\n\n## 9.8 Wizard 类\n\n现在应该显而易见，当在“整体-部分”关系中，整体和部分属于同一种基础类型时，组合模式可以高效实现类层级。当满足这一条件时，可以在定义基础类型的根类中声明所有功能——涵盖部分和整体。然后，这些功能可以在派自基础类型的类中被选择性地覆盖。`Wizard`\
  \ 类在演示中充当基础类型。\n\n本节定义的 `Wizard` 类包含了从任何子类构造的所有对象（至少就演示而言）所需的功能。但请注意，所示的方法定义是默认定义，应根据情况在子类中覆盖。当方法未在子类中被覆盖时，将应用下文所示的默认定义。读者可以看到，默认定义仅抛出异常，信息表明该方法正以非预期的方式使用。抛出的异常由一个特殊定义的\
  \ `UnauthorizedAccessException` 类实例组成，该类的定义见第 9.6 节。\n\n\n\n\n如下所示，该类的定义从六个描述 `Wizard`\
  \ 特性的实例变量开始。其中前两个 `firstName` 和 `lastName` 是预期每个 `Wizard` 实例都应该拥有的。因此，它们包含在在六个实例变量声明之后的\
  \ `Wizard` 构造函数定义中。其余的实例变量——`schoolGraduatedFrom`、`wizardryLevel`、`strongAt` 和 `houseAssigned`\
  \ 是可选的。如代码所示，我们将它们初始化为默认的 `Unknown`。构造函数之后是这四个可选实例变量的“get”和“set”方法。该类的其余部分定义了该类层次结构的整体功能。\n\
