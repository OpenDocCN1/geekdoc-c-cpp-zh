  ## 14.12 运行代码\n\n从书籍网站下载此模式的类文件到单独目录。使用以下命令编译代码：\n\n```bash\njavac *.java\n```\n\
  \n通过以下命令执行 `Test` 类：\n\n`java Test`\n\n根据 `Test` 中 `main()` 方法的代码，执行该类将产生以下输出：\n\
