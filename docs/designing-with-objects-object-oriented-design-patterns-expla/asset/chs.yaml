  关于原型模式（Prototype pattern）的更多见解，你可能希望按照以下思路扩展该模式的演示代码：\n\n- 理想情况下，只允许 `PrototypeManagerAndDuplicator`\
  \ 类的一个实例。然而，我们的演示并没有这样做，因为为了与书中各部分模式的字母顺序保持，我们尚未介绍单例模式（Singleton pattern）。但是，在读者学习了单例模式后，你可能希望将\
  \ `PrototypeManagerAndDuplicator` 类实现为单例。\n\n- 当前的演示代码不包含让 `Dragon` 类验证来自 `PrototypeManagerAndDuplicator`\
  \ 访问的方法，以便构建八个通用的 `Dragon` 实例。因此，按照目前的实现，任何外部类都可以调用 `Dragon` 的 `makeNewDragonInstance()`\
  \ 方法为八种 `Dragon` 类型创建额外的原型。我们真正需要的是对 `Dragon` 的 `makeNewDragonInstance()` 方法进行身份验证。为此，你需要在\
  \ `Dragon` 类 `makeNewDragonInstance()` 方法的定义处插入额外的代码。看看你是否能做到。\n\n# 6 单例 (SINGLETON)\n\
  \n## 6.1 单一对象 (SINGULAR OBJECTS)\n\n在大多数情况下，对物理现实建模的抽象层次越高，需要的模型实例化就越少。而且，如果你恰好是一个宗教倾向的人，你可能会相信在最高层级只有一个实体——一个单一实体——解释了一切。但这让我们远离了本书的主题——面向对象设计。考虑到这本书既不是关于形而上学的，也不是关于宗教的，让我们不要再纠结于最高层次的现实建模。\n\
  \n通常，是否有一个单一对象取决于你试图建模的内容范围。假设你正尝试构建一个大学管理人员的心理模型。如果严格限于一所大学，那么在你脑海中，“校长”这个角色只会存在一个对象。然而，如果你的模型涵盖了特定区域内的几所大学，情况显然不再如此。\n\
  \n## 6.2 意图与适用性 (INTENT AND APPLICABILITY)\n\n单例模式的意图是确保类的客户端无法从类定义构造出超过指定数量（通常只有一个）的实例。\n\
  \n在以下情况下你应该考虑使用这种模式：\n\n- 类所应该建模的现实使得在任何时刻只允许该类的实例存在，并且任何后续的对象构造尝试必须返回之前构造的同一个对象；\n\
  \n- 或者，在模式的变体中，物理现实对任何时刻允许存在的实例总数存在限制；\n\n- 或者，在模式的另一个变体中，你希望类只响应一个实例构造请求，并对所有后续请求抛出异常；\n\
  \n- 并且在模式的另一个变体中，你不仅限制类在任何时刻允许存在的实例数量，还限制从类的子类中构造的实例数量。\n\n## 6.3 单例模式简介 (INTRODUCTION\
  \ TO THE SINGLETON PATTERN)\n\n当建模过程要求被认为是单一的对象只存在一个时，如何防止无意中创建同一个对象的多个版本？显然，必须有人创建该对象的第一个实例，并且防止多个此类对象的机制必须在第一个实例创建后立即生效。这些都是单例模式解决的问题。该模式的主要目的是确保在任何时刻类只存在一个实例。将该模式的实现泛化到以下情况是简单的：在任何时候，对于指定的数值\
  \ *N*，类将只存在 *N* 个实例。\n\n当一个类实现了单例模式时，在客户端构造了一个实例后，任何后续的实例构造尝试必须返回原始构造的同一个实例，或者抛出一个异常警告用户违反了类的契约。如所述，此类实现可以简单地扩展，以允许在任何时刻从类中构造最多\
  \ *N* 个实例。\n\n此时，读者可能会问：上一章的原型模式的整体目标与本章的单例模式之间是否不存在某些相似之处——假设你使用单例模式来建立从类中构造的最大实例数量的限制？并不如此。注意，原型模式对从类中可以构造的实例总数没有任何限制。该模式只说你构造的实例对应于存储的少量原型中的一个。只要你只是通过复制原型来创建实例，原型模式就允许你创建任何数量的实例。另一方面，单例模式对任何时刻允许存在的类实例总数加了严格限制。最常见的情况下，单例模式坚持从一个类只能产生一个实例。\n\
  \n## 6.4 现实应用中的单例模式 (THE SINGLETON PATTERN IN REAL-WORLD APPLICATIONS)\n\n当软件供应商需要强制执行类只存在一个实例的条件时，他们会使用单例模式。考虑一个表示应用程序与关系型数据库之间连接的类。此类类的实例可以用于向数据库发送\
  \ SQL 命令。如果软件系统的不同地方有两次或多次实例化此类类的调用，且所有这些调用都指向同一个数据库，你可能希望所有此类调用都返回同一个连接对象。该对象将由第一次创建调用进行实例化。\n\
  \n\n\n\n\n再举一个例子，考虑对控制计算机硬件的系统软件采用面向对象的设计方法。该软件可能会对代表串口端口抽象的类允许构造的串口端口实例数量进行限制。在任何时刻，此类实例的数量都不能超过机器上实际的串口端口数量。如果一台机器只有一个串口端口（这通常是如此），你只会希望从串口端口类创建一个实例。类似的理由也适用于在需要并发的程序中创建多个线程或多个进程的面向对象方法。由于每个进程和每个线程都会消耗系统资源，因此在资源受限的环境中，你不会希望软件允许创建超过特定数量的进程或线程。\n\
  \n关于 `Singleton` 类相对于应用程序中其他部分所扮演的角色，你可以将从该类构造的实例看作是一个带有状态的全局变量。显然，该状态取决于类定义中所有的实例变量。如果你还为该类配备了一个用于更改状态的方法，那么在任何点对\
  \ `Singleton` 实例所做的更改都将通过所有持有该实例引用的其他变量立即可见。\n\n## 6.5 用哈利·波特的故事来说明单例模式\n\n我们将定义一个名为\
  \ `MinisterForMagic`（魔法部长）的类来演示单例模式。显然，在任何时刻只能存在一个魔法部长。\n\n《哈利·波特》的读者会记得，魔法部是英国魔法世界的管理机构。它在魔法社区中执行法律执法；负责管理霍格沃茨魔法学校以培养新的巫师和女巫；确保不发生不当的魔法使用（特别是针对未成年巫师和女巫，而且尤其是针对麻瓜的）；并确保麻瓜不会发现魔法世界。偶尔，如果事局势失控且麻瓜窥视了魔法世界的一角（例如德思礼一家亲眼目睹了哈利如何让他厌恶的玛奇姨妈像气球一样飘到客厅天花板上），魔法部会立即冲入并对麻瓜施加记忆咒，让他们忘记所看到的一切。正如标题所暗示的，魔法部长（有时被任命，有时被选举）负责监督魔法部。\n\
  \n## 6.6 模式演示的高层视图\n\n图 6.1 中的类图展示了我们单例模式演示的高层视图。从 `MinisterForMagic` 类中的可见性标记可以推断出，我们将该类的构造函数放在了它的私有区域。这是为了防止该类的客户端直接构造其实例。对于公共的实例创建，该类提供了\
  \ `makeInstanceOfMinisterForMagic()` 方法。正如后文解释的，该方法确保了该类只会被构造一个实例——这种情况发生在接收到对此类对象的第一个请求时。后续对该方法的任何调用将返回同一个实例。我们在\
  \ `TestSingleton` 类中测试 `MinisterForMagic` 类的行为。关于我们如何这样做，将在 6.8 节中解释。\n\n![image](img/c06f001.gif)\n\
  \n**图 6.1**\n\n## 6.7 MinisterForMagic 类\n\n那么，哪些属性应该被放在 `MinisterForMagic` 类中呢？如果我们的目标仅局限于传达单例模式的本质，我们可以通过一个空类来实现，即一个不包含任何与担任这一高职的人员职责及其他方面相关的实例变量的类。然而，仅仅为了更大的“真实性”，我们将在类中放置两个实例变量：一个用于存储部长的姓名，另一个用于存储任年份。\n\
  \n下方所示的类定义将构造函数放在了它的私有区域。这防止了任何人通过直接调用其构造函数来构造该类的实例。构造该类实例的唯一方法是通过公共方法 `makeInstanceOfMinisterForMagic()`。该方法首先检查静态变量\
  \ `unique` 是否已经存在绑定。只有当没有之前创建的赋值给 `unique` 的类实例时，`makeInstanceOfMinisterForMagic()`\
  \ 才会通过调用该类的私有构造函数来创建一个实例。私有静态变量 `unique` 所扮演的角色显然对于该模式的操作至关重要——该变量持有在任何时刻允许存在的唯一一个魔法部长的引用。\n\
  \n此外，请注意公共静态方法 `retireInstanceOfMinisterForMagic()`，它用于销毁之前构造的 `MinisterForMagic`\
  \ 实例。显然，在调用此方法后，我们可以再次创建该类的下一个版本的实例，正如我们将在 `TestSingleton.java` 中演示的那样。\n\n有趣的是，`MinisterForMagic`\
  \ 的唯一实例在类类的客户端需要它之前不会被创建。这有时被称为延迟实例化（lazy instantiation）。\n\n下方所示的类定义只有在你忽略了大英国以外的国家可能拥有自己的魔法部长这一事实时才是合理的。例如，众所周知保加利亚和挪威确实有自己的魔法部长。事实上，保加利亚魔法部长奥布兰斯基先生曾受邀参加\
  \ 1994 年魁地奇球决赛。因此，严格来说，这里提出的类名称应该是 `BritishMinisterForMagic`，以免冒犯其他国家。\n\n```\n\
  \ public class MinisterForMagic {\n    private String name;\n    private int yearAppointed;\n\
  \    private static MinisterForMagic unique;\n\n    private MinisterForMagic(String\
  \ name, int yearAppointed){\n        this.name = name;\n        this.yearAppointed\
  \ = yearAppointed;\n    }\n\n    public static MinisterForMagic makeInstanceOfMinisterForMagic(String\
  \ name, int year) {\n        if ( unique == null )\n            unique = new MinisterForMagic(\
  \ name, year );\n        }\n        return unique;\n    }\n\n    public static void\
  \ retireInstanceOfMinisterForMagic() {\n        unique = null;\n    }\n\n    public\
  \ String whoIsMinisterForMagic(){\n        return name;\n    }\n}\n```\n\n## 6.8\
  \ TestSingleton 类\n\n对于上一节定义的类，我们现在必须演示它在任何时刻只允许存在一个实例。\n\n在下方所示的 `TestSingleton`\
  \ 类 `main()` 方法的测试代码中，我们尝试通过带有不同的参数调用两次 `makeInstanceOfMinisterForMagic()` 来构造两个所谓的不同的\
  \ `MinisterForMagic` 类实例 `minster_1` 和 `minster_2`。正如我们在 6.10 节所示，第二次调用返回第一次调用创建的同一个对象。也就是说，第二次调用关于创建新\
  \ `MinisterForMagic` 实例请求被忽略了。正如 6.10 节所介绍，在我们调用 `retireInstanceOfMinisterForMagic()`\
  \ 方法销毁第一次调用创建的实例后，我们可以再次创建另一个 `MinisterForMagic` 类的实例。\n\n\n\n\n\n```java\n public\
  \ class TestSingleton {\n  public static void main( String[] args ) {\n    MinisterForMagic\
  \ minister_1 =\n        MinisterForMagic.makeInstanceOfMinisterForMagic(\n     \
  \           \"Cornelius Fudge\", 1990);\n\n        MinisterForMagic minister_2 =\n\
  \        MinisterForMagic.makeInstanceOfMinisterForMagic(\n                \"Pius\
  \ Thicknesse\", 1996);\n        if ( minister_1 == minister_2 )\n            System.out.println(\
  \ \"The two ministers are the same\" );\n\n        System.out.println(\"The name\
  \ of the Minster: \"\n            + minister_1.whoIsMinisterForMagic() );\n    \
  \    System.out.println(\"The name of the Minster: \"\n            + minister_2.whoIsMinisterForMagic()\
  \ );\n\n        MinisterForMagic.retireInstanceOfMinisterForMagic();\n\n       \
  \ minister_2 = MinisterForMagic.makeInstanceOfMinisterForMagic(\n              \
  \          \"Pius Thicknesse\", 1996);\n        System.out.println(\"The name of\
  \ the Minster: \"\n            + minister_2.whoIsMinisterForMagic() );\n    }\n\
  }\n```\n\n***\n\n## 6.9 单例模式的变体\n\n本节将介绍目前为止讨论的单例模式的某些变体。\n\n如果你希望单例类仅响应对实例的第一次请求，并且希望后续所有的客户端请求都抛出异常，那么下面的实现将非常有用。这种情况下所需的异常类也定义在下方。\n\
  \n***\n\n```java\n class UnauthorizedInstanceException extends Exception {\n  public\
  \ UnauthorizedInstanceException() {\n    super();\n  }\n  public UnauthorizedInstanceException(\
  \ String message ) {\n    super( message );\n  }\n}\n\nclass Singleton {\n  static\
  \ boolean instanceExists = false;\n\n  public Singleton() throws UnauthorizedInstanceException\
  \ {\n    if ( instanceExists ) {\n      throw new UnauthorizedInstanceException(\n\
  \            \"Unique instance constructed previously.\"\n      + \" New instance\
  \ creation request denied.\" );\n    } else {\n        instanceExists = true;\n\
  \      System.out.println(\"Unique instance of Singleton created\");\n    }\n  }\n\
  }\n\nclass TestSingleton {\n  public static void main( String[] args )\n  {\n  \
  \  // 第一次尝试运行正常：\n    try {\n      Singleton obj_1 = new Singleton();\n    } catch(\
  \ UnauthorizedInstanceException u ) {\n      System.out.println( u.getMessage()\
  \ );\n    }\n\n    // 第二次尝试会导致异常异常：\n    try {\n      Singleton obj_2 = new Singleton();\n\
  \    } catch( UnauthorizedInstanceException u ) {\n      System.out.println( u.getMessage()\
  \ );\n    }\n  }\n}\n```\n\n***\n\n你可以将此代码存放在任何文件中，使用 `javac` 命令编译该文件并通过以下命令执行：\n\
  \n```\njava TestSingleton\n```\n\n以查看我们所说的 `Singleton` 类仅尊重一个实例请求的情况。\n\n对于该模式的另一种变体，如果我们希望一个从单例扩展的类也表现得像单例呢？下面是一个完整的示例代码，说明了派生自单例类的子类如何也能表现得像单例。注意，我们现在没有将基类\
  \ `Singleton` 的构造函数放在类的私有（private）部分，而是放在保护（protected）部分，以便对 `Singleton` 的子类可见。\n\
  \n***\n\n```java\n class Singleton {\n  protected static Singleton unique;\n  protected\
  \ Singleton(){}\n  public static Singleton makeInstanceOfSingleton() {\n    if (\
  \ unique != null )\n      return unique;\n    else {\n        unique = new Singleton();\n\
  \      return unique;\n    }\n  }\n}\nclass SingletonExtended extends Singleton\
  \ {\n  private static SingletonExtended unique;\n  public static SingletonExtended\
  \ makeInstanceOfSingletonExtended() {\n    if ( unique != null )\n      return unique;\n\
  \    else {\n        unique = new SingletonExtended();\n      return unique;\n \
  \   }\n  }\n}\n\nclass TestSingletonExtended {\n  public static void main( String[]\
  \ args )\n  {\n    Singleton obj_1 = Singleton.makeInstanceOfSingleton();\n    Singleton\
  \ obj_2 = Singleton.makeInstanceOfSingleton();\n    if ( obj_1 == obj_2 )\n    \
  \  System.out.println(\n        \"The two Singleton objects are the same\" );\n\
  \    SingletonExtended obj_3 =\n      SingletonExtended.makeInstanceOfSingletonExtended();\n\
  \    SingletonExtended obj_4 =\n      SingletonExtended.makeInstanceOfSingletonExtended();\n\
  \    if ( obj_3 == obj_4 )\n      System.out.println(\n        \"The two SingletonExtended\
  \ objects are the same\" );\n  }\n}\n```\n\n***\n\n你可以将此代码存放在任何文件中，使用 `javac` 命令编译该文件并通过以下命令执行：\n\
  \n```\njava TestSingletonExtended\n```\n\n以此亲身验证首先从父类创建然后从扩展类创建的两个看似不同的实例在每个情况下都是同一个。\n\
  \n## 6.10 运行代码\n\n现在我们将展示第 6.6 节 到第 6.8 节 中单例模式主要演示的输出。将这些章节中所示代码的类文件下载到单独目录，并使用命令编译代码：\n\
  \n```\njavac *.java\n```\n\n并通过以下命令执行 `TestSingleton` 类：\n\n```\njava TestSingleton\n\
  ```\n\n根据第 6.8 节 中 `TestSingleton` 的 `main()` 方法中的代码，执行该类将产生以下输出：\n\n```\n The two\
  \ ministers are the same\n\n  The name of the Minster: Cornelius Fudge\n  The name\
  \ of the Minster: Cornelius Fudge\n  The name of the Minster: Pius Thicknesse\n\
  ```\n\n如果你查看第 6.8 节 中 `TestSingletonClass` 的定义，在 `main` 方法中有三次尝试构造 `MinisterForMagic`\
  \ 实例。正如你在上面看到的输出所示，第二次尝试虽然部长姓名和任命年份不同，但它产生的与第一次尝试创建的实例是同一个。第一行输出“The two ministers\
  \ are the same”是比较两次尝试实例的结果。“Pius Thicknesse”输出行证明了，在我们“退休”第一次尝试创建的实例后，我们可以再次创建新的\
  \ `MinisterForMagic` 实例。\n\n为了获得更多单例模式的见解，你可能希望按照以下方向扩展代码：\n\n\n\n\n例如，需要类间协作来生成实例的表示问题在七种结构型模式中都是独特的。此外，每种模式所需的协作程度也各不相同。当某种模式允许任意数量的类共同工作时，该模式提供的解决方案的表示效率并不会受到损害。\n\
  \n对于结构型模式解决的表示问题，假设你的应用程序包含一个需要与可能大量的装饰（embellishments）混合的类，并假设该类的客户端希望以任意方式混合和匹配这些装饰。应该如何相对于基本类来表示装饰，以便能够高效地产生包含装饰的实例？对于另一个表示问题，假设我们有一个类是由几个较小类组成的组合，但恰好的是，涉及的所有类都是同一种基本类型。是否有某种方法可以利用所有这些类的类型相似性，使得它们（包括那个大类）都能通过一个公共接口进行操作？对于另一个最适合通过多个类协作来解决的表示问题，是否可能由一个组织负责指定建模领域所需的数据抽象，而由另一个组织负责提供与这些抽象相关的行为的实现？那么，当你想要用新类的服务来增强现有类的服务，但这两个类是针对不同的接口编写的，所产生的表示问题又该如何处理？以此类推。\n\
  \n在下文中，我们将简要列出解决此类问题的七种结构型模式：\n\n*   **适配器 (Adapter)**：假设你想使用一个新类来增强现有类提供的服务，或者替换一个现有类。当新类编写的接口与现有类的接口不完全相同时，这种模式为我们提供了三种不同的解决方案，以解决如何最好在软件中整合新类的问题。\n\
  *   **桥接 (Bridge)**：在某些情况下，有必要将类的实现与其高层定义解耦来。例如，这可能发生当一个组织负责发布类的规范，而另一个组织负责根据这些规范创建实现时。`Bridge`\
  \ 模式展示了如何实现这种解耦。\n*   **组合 (Composite)**：`Composite` 模式不仅向我们展示了子类类型如何由父类类型的对象组成（这对于熟悉面向对象编程的人来说几乎没什么新意图），还展示了子类类型的对象——包括作为父类类型组合的对象——如何仅通过父类中声明的接口进行操作。\n\
  *   **装饰器 (Decorator)**：假设一个类的客户端希望看到它以不同的方式被装饰。解决这个问题的看似简单的方案是为每个可能的装饰扩展基本类。在某些情况下，这可能运行良好。然而，当装饰的数量很大且它们的组合是任意的时，基于纯继承的表示框架可能会变得繁琐。这就是\
  \ `Decorator` 模式大显身场的地方。这种模式提供了一个紧凑的表示结构，其中包含客户端所需核心功能的类允许被带有嵌套层级的装饰进行增强，而对嵌套的顺序或深度没有限制限制。\n\
  *   **门面 (Facade)**：如果你不想让软件遭受以下在你的计算机上运行的许多应用程序中常见的问题，你会发现这种模式非常有用：即使你对该应用程序的需求从未超过新手，你也必须在专家水平上掌握该应用程序。这种模式展示了你如何为复杂类创建不同的使用视图。因此，对于一个复杂的应用程序，你可以为初学者准备一个使用视图，为专家准备另一个。\n\
  *   **享享模式 (Flyweight)**：当你能够从客户端可能需要的所有对象中提取出极少数的核心形式，并将其余视为这些形式的装饰时，这种模式就是很有用的。如果可以这样做，你就可以使用这种模式显著减少为了涵盖客户端预期的所有装饰而需要定义的类总数。该模式为你提供了一个在实例产生和对软件未来的任何更改方面都是高效的表示结构。\n\
  *   **代理 (Proxy)**：代理器在如今无处不在。企业使用所谓的 `proxy servers` 来引导所有传出和传入的流量是非常常见的。正如你预期的，代理对象是真实对象的替代品。作为真实对象的替代品，代理对象也常用于远程方法调用协议。假设你想调用一个实际上位于远端服务器上的对象的方法。你如何做到这一点？这是通过为远程对象维护本地代理来实现。\n\
  \n# 7 适配器\n\n## 7.1 让事物协同工作\n\n在国外旅行时，当你无法将笔记本电脑的电源插头接入酒店墙上的插座时，你需要一个适配器。在这种情况下，你迫切需要一个电气功能的机械适配器示例。在一方，它具有所需数量的插脚，其形状和配置满足你所在国家的电气标准；在另一方，则是你家乡国家使用的插座孔。机械适配器的其他示例包括：两端直径不同的管段，用于连接两个直径不相同的管子；相机镜头接口适配器，它允许带有自带镜头卡口的第三方镜头与相机匹配；等等等等。\n\
  \n当一个系统想要使用另一个系统提供的服务，但其中一个系统使用的交互模式另一个系统无法理解时，你就有了一个更复杂的适配器。为了让这些系统协同工作，你需要在它们之间插上一个适配器。适配器的工作是将一个系统的请求翻译成另一个系统可以理解的语言。在以太网成为局域网交换数字信息的常用协议之前，当一个网络接口理解以太网协议的计算机需要连接到令牌环网络时，经常采用这类适配器。在计算机网络发展的早期，当通信接口基于\
  \ TCP/IP 协议的计算机与基于 AppleTalk 或 IPX 的网络的另一个计算机交换信息时，也需要适配器。但现在，几乎所有的数据转发都是通过 TCP/IP\
  \ 协议实现的。\n\n在软件上下文中，正如你在本章中看到的，当你尝试使用一个供应商提供的类（因为它具有所需的功能），但其接口与你软件中调用该功能的方式不兼容时，适配器就是你需要的。\n\
  \n\n\n\n\n- 可以将适配器类（adapter class）变为被适配器类（adaptee class）的子类；\n- 或者，适配器类可以实现客户端代码所编写的接口，然后由适配器类调用被适配器类的实例或其某个子类，以便在服务的新版本中选择性地使用被适配器的服务；\n\
  - 或者，在模式的变体中，适配器可以实现客户端代码所编写的接口，随后，适配器可以从多个可能的被适配器类中进行运行时选择。\n\n## 7.3 适配器模式简介\n\
  \n\n\n在讨论适配器模式（Adapter pattern）时，使用“目标接口（Target interface）”的概念非常方便，这个接口就是你自己的代码为了使用供应商提供的类而编写的接口。现在假设你想切换到另一个供应商，该供应商更先进的类提供了你当前通过\
  \ `Target` 接口使用的相同功能的增强版本。遗憾的是，新供应商的类的接口是不同的。那么，我们该如何解决这个问题呢？使用适配器模式，新供应商可以创建一个适配器类，该类一方面实现你所习惯的\
  \ `Target` 接口，另一方面调用新类中的代码。随后，你可能只需要在自己的代码中进行一行的更改，就可以通过适配器类使用升级后的功能。\n\n我们通过图 7.1\
  \ 和图 7.2 来说明这一思想。图 7.1 中的类图显示客户端需要 `Target` 接口中定义的功能，出于这一目的，客户端使用了图底部的类。在某个时刻，客户端想要切换到另一个供应商，并发现了一个提供密切相关但并不相同功能的供应商。这通过图\
  \ 7.2 中的类图进行了说明。只要新供应商愿意修改这个新类，客户端就可以使用它，使其作为一个适配器类，直接实现 `Target` 接口，或者如果之前的类将保留在系统中，则扩展之前的类。（图\
  \ 7.2 显示的是后者情况。）正如你将通过本章的演示代码所看到的，很有可能在新类中需要的修改是相对微不足道的——大部分体现在更改类头以及定义简单方法上，这些方法调用新类中的代码主体来执行重型工作。无论哪种情况，当客户端从第一个供应商切换到第二个供应商时，都需要对其自己的代码进行极微的更改（最小只需更改一条语句）。如图\
  \ 7.2 所示，我们将旧类称为被适配器类（adaptee class），将新类称为适配器类（adapter class）。\n\n![image](img/c07f001.gif)\n\
  \n图 7.1\n\n![image](img/c07f002.gif)\n\n图 7.2\n\n## 7.4 现实世界应用中的适配器模式\n\n\n\n假设你的公司正参与为制造某些类的产品所需的工业控制器编写软件。例如，考虑为现在广泛用于制造的\
  \ 6-DoF（六自由度）取放臂机器人创建一个控制器软件软件包。市上有大量的此类机器人，但它们都按照相同的原理工作——运动学控制原理。简要解释一下这意味着：控制器的主要目标是将机器人端执行器（把你的手想象成手臂的端执行器）发送到特定的\
  \ 3D 坐标（占据了 3 个自由度）并具有特定的方向（占据了其他 3 个自由度）。假设我们处理的是所谓的关节机器人（articulated robots），控制器的主要工作是根据端执行器的给定位置和方向，计算机器人相邻连杆之间旋转关节处电机的旋转程度。控制器估计的关节旋转必须馈送到控制关节电机的低级函数调用中。换句话说，控制器软件必须针对一个描述电机函数调用的特定\
  \ API 编写。\n\n在编写此类软件时，你的公司必须在以下两个选项之间做出选择：公司可能会选择为每种不同的机器人类型创建一个单独的软件包，或者公司可能会选择为其自己设计的低级\
  \ API 创建一个控制器包，然后根据适配器模式为不同类型的机器人提供适配器。由于控制器软件可能非常复杂，想象一下只有一个这样的包需要维护，你公司的工作将简单多少。与主控制器包相比，适配器可能要简单得多。通过将它们视为独立的软件部分，你将从自己的控制器包中消除对单个机器的依赖。因此，错误报告可能仅针对为特定机器人类型设计的适配器。显然，如果你的控制器如广告的那样工作，那么控制器本身出现故障的可能性就较低。\n\
  \n## 7.5 使用哈利·波特故事来演示适配器模式\n\n\n\n我们对适配器模式的演示基于霍格沃魔法学校的 DADA（防御黑术）教学需求。这个职位被认为是因为伏魔在年轻时申请该工作被拒绝而被诅咒了。从以后，霍格沃出现了一批\
  \ DADA 老师。为了我们的演示，我们假设这种高频率的人员流动为学校带来了后勤问题。我们进一步假设学校管理要求每位 DADA 老师在引入他们选择的任何主题之前符合学校规定的基本教学大纲。\n\
  \n现在考虑以下情况：学校刚刚失去了一个 DADA 老师。于是学校聘请了一个新老师，结果证明这位老师还想教育学生黑术的道德维度。学校希望满足新老师的愿望，但由于资源短缺，不想对自己的记录和学校管理协议进行太多的更改。学校如何实现这一点呢？通过适配器模式，正如你将在本章其余部分所看到的。\n\
  \n## 7.6 模式演示的高层视图\n\n\n\n\n\n图 7.3 展示了我们适配器模式（Adapter pattern）演示的类图。（更准确地说，此图描述了该模式的主要演示。7.11\
  \ 节 和 7.12 节  own 了实现适配器模式的另外两种方式。）我们将使用接口 `TeachingDADA` 中声明的方法，从高级层面表示黑魔法防御术（DADA）老师必须向霍格沃茨学生教授的内容。\n\
  \n![image](img/c07f003.gif)\n\n图 7.3\n\n我们假设旧老师已在一个名为 `TeacherForDADA` 的类中实现了 `TeachingDADA`\
  \ 接口。正如你稍后在那个类中看到的，旧老师以一种非常通用的方式，或者你可以说是以一种实事求是的方式进行教学。他的课程完全没有涉及道德问题，也没有警告学生练习黑魔法可能会导致灵魂毁灭，并可能导致他们身体毁容。\n\
  \n聘请的新老师通过一个名为 `AdapterForSafeTeaching` 的适配器类来实现教学大纲，该类扩展了旧老师的类 `TeacherForDADA`。新类相对于被适配类（adaptee\
  \ class）`TeacherForDADA` 和目标接口（Target interface）`TeachingDADA` 是适配器类。\n\n对于通过客户端类\
  \ `SchoolOfMagic` 实现的魔法学校，我们将使用基础教学接口 `TeachingDADA` 通过以下声明来定义老师实例：\n\n```\n TeachingDADA\
  \ teacher;\n```\n\n如果学校续签了上任老师的合同（假设该老师还在职），它将把 `teacher` 实例变量设置为调用 `TeacherForDADA`\
  \ 构造函数返回的对象。然而，我们知道旧老师不再可用，新老师将以稍微不同的方式教授相同的课程。为了在我们的软件演示中完成从旧老师到新老师的切换，学校只需要将变量\
  \ `teacher` 的绑定改为 `AdapterForSafeTeaching` 的实例。这之所以行得通，是因为正如图 7.3 所示，适配器类 `AdapterForSafeTeaching`\
  \ 派自 `TeacherForDADA`（而后者又实现了目标接口 `TeachingDADA`）。因此，`AdapterForSafeTeaching` 的实例也是\
  \ `TeachingDADA` 类型。\n\n虽然适配器类 `AdapterForSafeTeaching` 将为目标接口 `TeachingDADA` 中的所有方法提供实现，但它还通过以下方法包含额外的额外功能：\n\
  \n```\n doTeachPowerOfLove()\n  doTeachHowDarkMagicCanHarmTheCaster()\n  doTeachAboutProtectiveDevices()\n\
  ```\n\n适配器类需要这些方法，因为它们将在其对 `TeachingDADA` 接口中原始声明的方法的重写实现中被调用。\n\n重复一遍，我们使用 `TeacherForDADA`\
  \ 作为被适配类，并使用 `AdapterForSafeTeaching` 作为适配器类。正如你预期的，除了提供额外功能外，适配器类还对被适配类进行了适配，使得使得客户端\
  \ `SchoolOfMagic` 在从被适配类切换到适配器类时，只需要更改代码中的单行。\n\n## 7.7 目标接口：TeachingDADA\n\n本节展示了霍格沃茨魔法学校发布的\
  \ `TeachingDADA` 接口。该接口在高级层面阐明了学校对黑魔法防御老师应该教授内容的期望。尽管黑魔法有许多形式，但接口将仅关注以下五种：\n\n*\
  \   **钻心咒（Cruciatus Curse）：** 这种咒语会导致极度痛苦。它是三大不可饶咒之一，另外两个是杀嘴咒（Avada Kedavra Curse）和夺魂咒（Imperius\
  \ Curse）。\n*   **魂器（Horcrux）：** 魂器是一个无生命的物体或生物，黑巫师可以将部分灵魂存放在其中以求安全，目的是实现永生。\n* \
  \  **石化石（Petrificus Totalus）：** 这种咒语会导致受害者进入石化般的昏迷状态。\n*   **闷咒（Sectumsempra）：**\
  \ 这种咒语旨在割伤受害者。受害者身上的伤口遵循攻击者魔杖的动作。如果魔杖在指向特定肢体时保持不动，咒语会导致该肢体与身体分离。\n*   **杀嘴咒（Avada\
  \ Kedavra）：** 这是三大不可饶咒之一，它会导致即刻死亡。如前所述，另外两个不可饶咒是已经描述过的钻心咒和夺魂咒，后者会导致受害者表现得像施咒者的的奴隶一样。\n\
  \n巫师可以利用多种手段来防御黑魔法可能造成的伤害。例如，护盾咒（Shield Charm）可以让某些并非那么强力的咒语变得更弱，甚至反弹回攻击者身上。还有嗅声器（sneakascope），这是一种小型旋转玻璃顶，如果它检测到附近有怀有恶意的人，就会发出尖锐的声音。同时也存在针对咒语的防御方法。例如，可以通过躲在墙或其他物体后面来防御杀嘴咒。用这种方式使用的防护物体在被杀嘴咒击时会燃起火焰。学校期望黑魔法防御老师指导学生这些防御技术。\n\
  \n我们下面展示的教学接口简单表示，如果遇到任何方法名所示的黑魔法实例，老师将提供如何防御的指导。\n\n* * *\n\n```\n public interface\
  \ TeachingDADA {\n\n  defenseAgainstCruciatusCurse();\n\n  defenseAgainstPetrification();\n\
  \n  defenseAgainstSectumsempra();\n\n  defenseAgainstAvadaKedavra();\n\n  awarenessOfHorcrux();\n\
  }\n```\n\n* * *\n\n## 7.8 TeacherForDADA 类\n\n霍格沃茨的上一任黑魔法防御老师由下方的类表示。尽管它符合学校指定的\
