  \t\tIterator<Obliviator> it1 = obliviators.iterator();\n\t\tIterator<Auror> it2\
  \ = aurors.iterator();\n\t\tIterator<DepartmentHead> it3 = deptHeads.iterator();\n\
  \t\tSystem.out.print(\"\\n The obliviators in the Ministry: \");\n\t\twhile (it1.hasNext())\
  \ {\n\t\t\tvisitor.visit( it1.next() );\n\t\t}\n\t\tSystem.out.print(\"\\n The aurors\
  \ in the Ministry: \");\n\t\twhile (it2.hasNext()) {\n\t\t\tvisitor.visit( it2.next()\
  \ );\n\t\t}\n\t\tSystem.out.print(\n\t\t\t\t\"\\n The department heads in the Ministry:\
  \ \");\n\t\twhile (it3.hasNext()) {\n\t\t\tvisitor.visit( it3.next() );\n\t\t}\n\
  \t}\n}\n```\n\n* * *\n\n我们现在介绍 `UnauthorizedAccessException`，这是 `Wizard` 层次结构中的最后一个类。关于这个类的重要性，请记住我们对访问者模式的演示是基于第\
  \ 9 章中组合模式的 `Wizard` 层次结构的简化版本。组合模式要求所有特化 `Wizard` 类的所有行为都必须在根类 `Wizard` 本身中声明。这显然应该包括像\
  \ `MinisterForMagic` 这样更复杂类的行为。但显然，会存在专为 `MinisterForMagic` 实例设计的行为——这些行为对于派自根类\
  \ `Wizard` 的其他类来说没有任何意义。如果在根类 `Wizard` 中定义的方法在一个对该方法没有意义的子类实例上被调用，我们希望抛出一个异常。该异常的类型将如下所示。\n\
  \n* * *\n\n```java\n class UnauthorizedAccessException extends Exception {\n\tpublic\
  \ UnauthorizedAccessException() {\n\t\tsuper();\n\t}\n\tpublic UnauthorizedAccessException(String\
  \ arg0) {\n\t\tsuper(arg0);\n\t}\n}\n```\n\n* * *\n\n## 24.10 可执行类\n\n`Client` 类的作用是执行访问者模式。它必须构造不同类型巫师的实例，特别是\
  \ `MinisterForMagic` 实例的巫师（因为这是我们 `Wizard` 层次结构中最复杂的类），然后它必须在这些实例上调用 `accept(Visitor\
  \ visitor)` 以演示访问者对象的工作原理。\n\n如之前提到的，访问者模式的特殊之处在于，对于你希望通过 `Visitor` 对象增强其行为的类，你只需要让这些类实现一个通常命名为\
  \ `accept(Visitor visitor)` 的通用钩子。随后，可以使用该钩子，首先构造一个合适的 `Visitor` 对象，然后通过钩子将其“注入”到需要增强行为的类中。\n\
  \n为了说明这一点，我们在本章中的演示包含了在第 24.8 节中介绍的两个 `Visitor` 类。其中一个用于打印魔法部巫师的名字，另一个用于打印巫师们在霍格沃茨期间被分配的学院。在下面的代码中，你将看到\
  \ `Client` 构造了这些不同类型的访问者，然后通过它们的 `accept(Visitor visitor)` 钩子将它们“注入”到 `Wizard` 实例中。\n\
  \n下面的类定义开始构造 `Obliviator`、`Auror`、`DepartmentHead` 实例以及一个 `MinisterForMagic` 实例。由于前三个巫师是本次演示中\
  \ `MinisterForMagic` 角色所构成的组合部分的一部分，我们通过在 `MinisterForMagic` 实例上调用 `appoint` 方法让他们在魔法部获得任命。然后，我们调用\
  \ `MinisterForMagic` 实例的 `listEmployeesWorkingAtMinistry()` 方法列出在该部工作的员工。\n\n接下来，我们从\
  \ `MinisterForMagic` 实例上调用 `accept(Visitor visitor)` 钩子，并将 `visitor` 设置为 `VisitorPrintingNames`\
  \ 类的实例，以打印出魔法部所有巫师的名字。正如从 `MinisterForMagic` 的钩子实现中所知，这种 `accept(visitor)` 的调用将传播到所有在魔法部工作的巫师。我们随后对\
  \ `MinisterForMagic` 实例使用 `VisitorHouseNames` 访问者重复上述实验。最后，我们将 `VisitorPrintingNames`\
  \ 访问者注入到 `Obliviator` 实例中，以证明它会打印出该遗忘咒的名字，正如我们预期的的一样。\n\n## 24.11 运行代码\n\n从书籍网站下载此模式的类文件到单独目录。使用以下命令编译代码：\n\
