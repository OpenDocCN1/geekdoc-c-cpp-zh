  \n\tby\n\n\tprivate MagicCollection<T> gryffindor = new MagicSet<T>();\n\tprivate\
  \ MagicCollection<T> hufflepuff = new MagicSet<T>();\n\tprivate MagicCollection<T>\
  \ ravenclaw = new MagicSet<T>();\n\tprivate MagicCollection<T> slytherin = new MagicSet<T>();\n\
  ```\n\n- 通过使用集合 own 列表，你的代码将更好地防止无意中将同一个学生两次放在同一个学院的情况。\n\n- 本演示中未涉及的一个重要问题是*健壮的迭代器*。如果一个迭代器在遍历过程中集合发生变化（添加新对象或删除现有对象）仍然能够执行正确的操作，那么这个迭代器就是健壮的。*我们演示中的迭代器使用基于一个假设，即正在遍历的集合在迭代过程中不会发生变化。*\
  \ 使迭代器变得健壮的一种简单方法是让它在迭代期间跟踪集合的状态。例如可以定义一个集合修改标记，如果在迭代期间调用了 `add()` 或 `remove()`\
  \ 函数（针对集合本身，或者如果 `Iterator` 类提供了此类函数则针对迭代器），则将该标记设置为 true。通过检测标记布尔值的变化来检测到集合状态的变化，可以导致迭代器适应新状态，或者在不可行的情况下抛出异常。创建对于多线程操作具有线程安全的健壮迭代器面临着其自身的挑战。\n\
  \n至少，你可能需要同步 `next()` 和 `hasNext()` 的调用。如果你愿意，可能希望为本演示创建健壮的迭代器。\n\n## 17.15 鸣谢\n\
