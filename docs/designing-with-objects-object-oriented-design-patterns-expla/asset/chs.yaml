  \ 类）印印在某些介质上（如纸张、织物、画布等），然后在图像周围加上客户选择的边框来制作肖像。因此，基本上，肖像是图像和边框的结合。这个类实际上是一个接口，为了方便我们提供了一组预定义的边框。这些边框宽度为\
  \ 20 像素，呈现哑光外观。\n\n```java\n import java.awt.*;\nimport javax.swing.*;\nimport javax.swing.border.*;\n\
