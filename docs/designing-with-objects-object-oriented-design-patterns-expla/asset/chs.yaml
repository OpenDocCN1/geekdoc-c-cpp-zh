  \ `Player` 构造函数的第三个参数。这些参数为每个构建实例提供了一个继任者，该继任者将接收构建实例无法解决的违规行为。对于 `Player` 实例，第二个参数表示球员的位置。代码的其余部分展示了被指控有不同违规行为的\
  \ `Player` 实例。当我们对这些 `Player` 实例调用 `resolveViolation()` 方法时，我们看到责任链模式的运作。\n\n***\n\
