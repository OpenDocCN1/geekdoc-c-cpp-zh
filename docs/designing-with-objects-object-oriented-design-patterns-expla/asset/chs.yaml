  \ `Command` 实例并按顺序执行它们，可以将它们存储在 `Invoker` 类中。存储的 `Command` 实例的执行是通过调用该静态方法 `invokeExecute()`\
  \ 触发的。虽然我们的演示没有这样做，但该类也可以用于强制执行适用于存储实例的任何排序和优先级限制。\n\n该类的实现非常直观。如果有什么值得注意的，那就是 `invokeExecute()`\
  \ 的最后语句初始化一个新的容器。至于为什么，在我们执行完 `invokerList` 中的所有 `Command` 实例后，需要重新初始化该容器，以便存储新的\
  \ `Command` 实例。\n\n***\n\n```java\n import java.util.*;\n\npublic class Invoker\
  \ {\n\tstatic private List<Command> invokerList =\n\t\tnew ArrayList<Command>();\n\
  \tstatic public void addToCommandList( Command command ) {\n\t\tinvokerList.add(\
  \ command );\n\t}\n\n\tstatic public void invokeExecute(){\n\t\tListIterator<Command>\
  \ iter = invokerList.listIterator();\n\t\twhile ( iter.hasNext() ) {\n\t\t\tSystem.out.println();\n\
  \t\t\ttry {\n\t\t\t\titer.next().execute();\n\t\t\t} catch(UnableToProtectHarryterException\
  \ e) {\n\t\t\t\te.printStackTrace();\n\t\t\t}\n\t\t}\n\t\tinvokerList = new ArrayList<Command>();\n\
  \t}\n}\n```\n\n***\n\n## 15.13 UnableToProtectHarryPotterException 类\n\n\n\n\n\n\
  如前所述，负责保护哈利·波特的人员必须满足某些条件。例如，为了让一名巫师在哈利住在德思家女瓜巷 4 号的夏天期间照看他，该巫师必须物理上出现在大致相同的位置。因此，像\
  \ `ProtectingHarryPotter` 这样的类必须检查被赋予任务保护哈利的人员是否满足了这些条件。实现这种条件检查逻辑要求我们能够处理条件被违反的情况。这就是像\
  \ `UnableToProtectHarryPotterException` 异常类派上用场的地方。当违反保护哈利必须满足的条件时，我们抛出一个类型为 `UnableToProtectHarryPotterException`\
  \ 的异常。下面的实现请求其父类 `Exception` 来完成所有与异常通知的工作。\n\n```\n public class UnableToProtectHarryPotterException\
  \ extends Exception {\n    public UnableToProtectHarryPotterException() {\n    \
  \    super();\n    }\n    public UnableToProtectHarryPotterException(String arg0)\
  \ {\n        super(arg0);\n    }\n}\n```\n\n## 15.14 Client 类\n\n`Command` 模式的 `Client`\
  \ 必须首先创建一个或多个接收者实例，并将它们作为参数传递给行为合成 `Command` 类的构造函数，例如演示中的 `ProtectingHarryPotter`\
  \ 类。客户端还需要将这样创建的行为合成 `Command` 对象存入 `Invoker` 类的实例中。随后，客户端可以请求 `Invoker` 类执行存储在那里的\
  \ `Command` 实例。\n\n下面显示的客户端实现针对 第 15.5 节 中描述的两种哈利·波特保护场景：在 1995 年夏天哈利住在德思家期间保护他，以及在哈利从女瓜巷\
  \ 4 号前往格里马德广场 12 号的途中护卫哈利。第一种情况的接收者是阿贝拉·菲格（Arabella Figg）和 曼德守戈·弗莱彻（Mundungus Fletcher），第二种情况则是小眼汉穆迪（Mad-Eye\
  \ Moody）、辛芬多拉·汤克斯（Nymphadora Tonks）和莱姆斯·卢平（Remus Lupin）。³\n\n我们在下面显示的类定义中为接收者（巫师、女师和唯一的麻瓜子）设置的属性，取决于对哈利·波特进行两种不同类型保护的需求（参见\
  \ `ProtectHarryPotter` 类中的逻辑）。例如，曼德守戈·弗莱彻在本次演示中的作用是在哈利在小灵灵郡活动时秘密跟踪（躲在隐形斗篷下）。因此，我们需要确保\
  \ `Wizard` 类的 Mundungus Fletcher 实例的 `hasInvisibilityCloak` 属性设置为 true。此外，除非个人在物理上位于同一区域，否则麻瓜子或巫师将无法在小灵灵郡保护哈利。对于需要巫师和女师团队在哈利前往格里马德广场\
  \ 12 号途中护卫他的保护场景，所有这些巫师和女师必须属于凤凰社，因为这是看到目的地房屋并被允许进入内部的必要条件。\n\n```\n import java.util.*;\n\
  \npublic class Client implements MyPlaces {\n    public static void main(String[]\
  \ args) {\n        Squib battyOldNeighbor = new Squib( \"Arabella Figg\" );\n  \
  \      battyOldNeighbor.setCurrentlyLocatedAt(Place.Privet_Drive );\n        battyOldNeighbor.setOwnsCat(\
  \ true );\n        Command c1 = new ProtectHarryPotter( battyOldNeighbor );\n  \
  \      Invoker.addToCommandList( c1 );\n        Invoker.invokeExecute();\n\n   \
  \     Wizard sneakThief = new Wizard( \"Mundungus Fletcher\");\n        sneakThief.setHasInvisibityCloak(\
  \ true );\n        sneakThief.setCanApparate( true );\n        sneakThief.setCurrentlyLocatedAt(Place.Privet_Drive\
  \ );\n        Command c2 = new ProtectHarryPotter( sneakThief );\n        Invoker.addToCommandList(\
  \ c2 );\n        Invoker.invokeExecute();\n\n        Wizard guard1 = new Wizard(\"\
  Mad-Eye Moody\");\n        Wizard guard2 = new Wizard(\"Nymphadora Tonks\");\n \
  \       Wizard guard3 = new Wizard(\"Remus Lupin\");\n        guard1.setMembershipInOrderOfPhoenix(\
  \ true );\n        guard2.setMembershipInOrderOfPhoenix( true );\n        guard3.setMembershipInOrderOfPhoenix(\
  \ true );\n        List<Wizard> guards = new ArrayList<>(Arrays.asList(guard1, guard2,\
  \ guard3));\n        Command c3 = new ProtectHarryPotter( guards );\n        Invoker.addToCommandList(\
  \ c3 );\n        Invoker.invokeExecute();\n    }\n}\n```\n\n## 15.15 运行代码\n\n从网站下载此模式的类文件并存放在单独目录中。使用命令编译代码：\n\
  \n```\njavac *.java\n```\n\n并通过以下命令执行 `Client` 类：\n\n```\njava Client\n```\n\n根据\
  \ `main()` 方法中的代码，这将产生以下输出：\n\n```\nCat owned by Arabella Figg keeping an eye on\
  \ Harry\nFollowing Harry while staying under invisibility cloak\nMad-Eye Moody casting\
  \ Disillusionment to make him difficult to see\nNymphadora Tonks joining the Order\
  \ of Phoenix\nRemus Lupin joining the Order of Phoenix\n``````\n\n为了获得进一步的见解，你可以考虑按照以下方向扩展此模式的代码：\n\
  \n*   我们对 15.5 节 中描述的哈利·波特第二种场景的实现仅部分完整。与其说是陪伴哈利前往格里马德广场 12 号的十二个巫师女师，不如我们只有小眼汉穆迪、辛芬多拉·汤克斯和莱姆斯·卢平三人。扩展代码为哈利的行程创建一个完整的护送。\n\
  \n*   `Wizard` 类包含了一些目前没有在任何地方调用的行为。例如，与巫师移动传送（apparating）相关的行为未被使用。然而，我们知道当曼德守戈·弗莱彻被要求去小灵灵郡护卫哈利时，他通常会移动传送。扩展演示将这些额外的行为纳入哈利·波特的保护合成中。\n\
  \n*   如 15.9 节 描述所示，`ProtectHarryPotter` 类包含了针对保护哈利的不同情况的逻辑：由单个巫师或麻瓜子提供保护，以及保护是巫师女师团队共同行动的结果。虽然在第一种情况下，我们通过对单个巫师和麻瓜子调用\
  \ `Command` 接口的 `execute()` 方法来提供所需的保护，但在第二种情况下，我们直接调用了参与的巫师女师的各种保护功能。从这个意义上说，对于第二种情况，我们违反了\
  \ Command 模式的精神。扩展演示代码，使得不同巫师的协调行动也可以通过调用 `Command` 接口的 `execute()` 来执行。\n\n*  \
  \ 我们对 `Invoker` 类的使用还有很大的改进空间，因为所展示的模式演示即使没有 `Invoker` 类也能同样地工作。扩展演示，使其从接收者类提供的基本行为中合成出多个大规模行为。对于你定义的新行为，请确保你需要对行为调用的顺序执行顺序约束。利用\
  \ `Invoker` 类来执行这些顺序约束。\n\n\n\n\n\n-   如果你想让你的 `Invoker` 类更具智能性，可以尝试为你的命令添加“撤销（undo）”功能。在执行命令之前，`Invoker`\
  \ 会存储所有参与执行命令的对象的状态。随后，如果对刚刚执行的命令调用了“撤销”，所有对象都将恢复到原始状态。在这种情况下，你可能希望利用第 19 章中备忘模式（Memento\
  \ pattern）的元素来设计 `Invoker` 类。\n\n# 16 解释器\n\n## 16.1 解析与解释\n\n理解一种语言——任何语言——都是两步过程。首先，你必须对语言的语法单元（在大多数情况下是句子）根据其所包含的不同的语法组件进行解析。然后，你必须理解这些语法组件所做的声明或建议的动作。第一步即对句子的语法组件进行分析，被称为`解析（parsing）`。第二步根据语法组件推断句子的目的，被称为`解释（interpretation）`。解释器模式针对的就是第二步。但显然，没有第一步，第二步就无法进行。\n\
  \n在尝试解释之前必须进行的解析程度取决于应用领域。仅从用户交互式应用来看，在光谱的一端，你有像 Apple 移动设备上的 Siri 这样的“个人助手”，它们非常接近提供自然语言界面（至少对于一组选定的动作而言）；而在另一端，你有命令行界面，它为用户提供一组特定的选项（必须以规定的方式在命令行中表示）来启动应用程序。通常，用户界面越接近看起来是自由流动的自然语言，解释器为了良好工作，解析器就必须越复杂。\n\
  \n解析器通常对其要求解析的文本输出正式上称为抽象语法树（AST）的内容，然后解释器根据该语法树中的信息进行工作。树的内部节点对应于句子的不同语法组件。例如，假设给解析器的语法规则（也称为`产生式/productions`）如下：^(1)\n\
  \n| `Statement` | ::= | `NounPhrase VerbPhrase?` |\n| `NounPhrase` | ::= | `( Pronoun\
  \ &#124; ( Determiner? Adjective*` |\n| | | `  CompoundNoun ) ) PrepPhrase?` |\n\
  | `CompoundNoun` | ::= | `Noun Noun?` |\n| `PrepPhrase` | ::= | `Preposition Adjective\
  \ NounPhrase` |\n| `VerbPhrase` | ::= | `Verb (NounPhrase &#124; PrepPhrase)` |\n\
  |   | | | |\n| `Noun` | ::= | `\"charm\" &#124; \"help\" &#124; \"wizard\" &#124;\
  \ magic ...` |\n| `Verb` | ::= | `\"is\" &#124; \"cast\" &#124; \"are\" &#124; ...`\
  \ |\n| `Adjective` | ::= | `\"good\" &#124; \"fast\" &#124; ...` |\n| `Preposition`\
  \ | ::= | `\"of\" &#124; \"on\" &#124; \"for\" &#124; ...` |\n| `Determiner` | ::=\
  \ | `\"the\" &#124; \"every\" &#124; \"this\" &#124; \"a\" &#124; \"an\" &#124;\
  \ ...` |\n\n当要求具有这些规则的解析器解析如下句子时：\n\n```\n the magic of your charm is of no help.\n\
  ```\n\n它将产生一个可以用以下形式显示的语法树：\n\n```\n Statement\n   NounPhrase\n   Determiner : the\n\
     CompoundNoun\n    Noun : magic\n  PrepPhrase\n   Preposition : of\n   Adjective\
  \ : your\n  NounPhrase\n   CompoundNoun\n    Noun : charm\n  VerbPhrase\n  Verb\
  \ : is\n  PrepPhrase\n  Preposition : of\n  Adjective : no\n  NounPhrase\n  CompoundNoun\n\
     Noun : help\n```\n\n*解释器必须依靠这个语法树来对句子进行解释。* 在通常用法中，解释将告诉我们句子传达了什么，提到了哪些具体动作，主语是谁。\n\
  \n## 16.2 意图与适用性\n\n正如其名称暗示的那样，解释器模式的意图是通过检查上下文为给定的输入生成解释。在以下情况下你应该考虑使用这种模式：\n\n\
  *   语法非常简单——显然不比上下文无关文法复杂；\n*   输入的解析可以表示为语法树；\n*   解释的上下文可以通过周围的单词相对容易地确定；\n* \
  \  解释可以通过字典查找来完成。\n\n## 16.3 解释器模式简介\n\n正如本章开头部分所述，在执行解释之前，解析是一个关重要的第一步。该部分未提到的另一个必须解决的问题是`建立上下文`。你看，即使你已经正确识别了所有单词的语法类别，像“John\
  \ went to the bank”^(2)这样的句子的精确含义只能根据上下文来确定。\n\n在语言中引入上下文并非易事，对于自然语言来说，仍然是一个未解决的问题。增加困难的是，上下文有时由并不总是可见的因素暗示。在两个个人之间的直接交流中，它可能由难以描述的因素（如肢体语言等）暗示。\n\
  \nGoF 提出的解释器模式虽然提到了这是一个必须处理的问题，但对于如何表示和利用上下文大部分保持沉默。这是因为 GoF 将解释器模式视为更“复杂”解析器的廉价替代品，例如由自动解析器生成器创建的那些。\n\
  \n我们对解释过程采取了稍大的视角。考虑到解析器生成器多年来变得如此易用，^(3)，我们认为通过语法类别类可以提高解释器模式的门槛。至于上下文，我们可以利用句子级或短语级某些单词（我们称之为触发词）的出现为单个单词的解释定义上下文。\n\
  \n\n\n\n\n我们对解释器模式（Interpreter pattern）的解释基于展示如何自动将“魔法语言”（magic-speak）转换为“麻瓜语言”（muggle-speak）。我们希望将者的每一个句子翻译成后者的句子。正如《哈利·波特》的读者所知，巫师使用的语言对麻瓜来说可能是令恐惧的。麻瓜不应该知道任何关于巫师、女巫、摄魂怪、咒语、护符、恶咒、诅咒等的任何事情。麻瓜甚至不应该知道存在像魔杖这样的东西，巫师用它来指向他们想要施咒的物体。\n\
  \n因此，我们的解释器模式必须首先分析魔法语言句子的语法结构，然后考虑到每个单词的语境，将每个单词/短语翻译成让麻瓜听起来无害的内容。请注意，我们并没有将魔法语言翻译成胡言乱语（即随机的无害词汇集合）因为，因为会引起麻瓜的怀疑。为了产生有意义的翻译语法，我们显然必须先解析魔法语句。本章提供的演示代码包含一个由\
  \ `JavaCC` 解析器/词法分析器生成器创建解析器。`JavaCC` 使得将 BNF 形式的规则直接转换为解析器代码成为可能。JavaCC 是“Java\
  \ Compiler Compiler”的缩写。\n\n解释器模式的一个重要方面是，它要求解释器的客户端能够通过通用接口访问所有的解释功能，即使在需要将输入分块并对每个块进行单独解释的情况下。至于如何实现，我们将通过本章后续部分的演示代码进行说明。\n\
  \n总的来说，我们的魔法语言到麻瓜语言翻译器演示将要求我们首先识别魔法语言不同的语法部分，识别每个部分的语境，然后对解释以及后续翻译成麻瓜语言做出决策。\n\n\
  ## 16.4 现实世界应用中的解释器模式\n\n在实际软件开发中，解释器模式适用于那些不像需要全功能自然语言界面那样的复杂的应用程序。该模式可能的应用是那些对动词、名词、形容词等的选择，以及这些词之间允许的语法关系相当有限的场景。\n\
  \n该模式被广泛应用于编译器，编译器在设计上必须将用显然带有一组语法约束编写的程序转换为适合转换为可执行机器码的结构。\n\n作为该模式更简单的应用示例，想象一个多列信息显示器，它允许用户在每列信息的显示方式、哪一列是显示排序的主要控制因素、甚至显示哪些特定列方面具有相当大的自由度（假设显示器有很多列，但任何用户可能只对其中一小部分子集感兴趣）。可能以一种微语言（mini-language）的形式来表达用户选择的所有允许排列。此类语言通常可以用有限状态机进行建模，这意味着它们可以使用快速算法进行解析。此类解析的输出可以提交给一个基于本章描述模式的解释器。\n\
  \n## 16.5 用《哈利·波特》故事阐释解释器模式\n\n如前所述，我们对解释器模式的演示包括将魔法语言翻译成麻瓜语言。当巫师和女巫在麻瓜经常出没的公共场所互相交流时，他们必须格外小心，因为巫师世界的一些言论对麻瓜来说听起来可能是令人恐惧的（即使是毫无意义的）。\n\
  \n解释和翻译魔法语言要求我们必须先解析魔法语句以识别它们的语法部分。这尤为重要，因为通常情况下，一个单词在句子中扮演几种不同的语法角色，而你将其翻译成另一种语言的单词的方式，取决于它在原句中扮演的角色。正如第\
  \ 16.1 节所述，句子中单词扮演的语法角色识别可以通过检查解析器生成的句子语法树来完成。使用语法树，从一种语言的单词到另一种语言单词的解释/翻译至少可以使用该单词的短语和句子层面的语境。\n\
  \n对于我们的演示，考虑两个巫师（一个年长巫师和一个未成年巫师）在公共场所（同样对麻瓜开放的场所）试图边午餐聊天的情况。巫师毕竟是巫师，显然想谈论对巫师世界重要的事。。然而，如果麻瓜偷听了这段对话的片段，他们可能会感到害怕并可能向当局举报这些巫师——特别是当世界上同时发生其他不不详且可能无法解释的事情时，例如太多的猫头鹰在飞、太多的流星爆发等等。\n\
  \n为了防止此类情况发生，年长巫师可以对他们周围的空间施一个护符，使他们被一个想象的泡泡包围，任何通过泡泡边界的声音都会被翻译成麻瓜认为无害的短语。在这样的护符下，如果年长巫师在向未成年巫师解释如何使用魔杖时说了如下的话：\n\
  \n```\n you point with your magic wand when you want to cast a spell\n```\n\n这句话会被附近的的麻瓜听为：\n\
  \n```\n you point with your little finger when you want to show a picture.\n```\n\
  \n包围两个巫师的魔法泡泡显然需要解析原始句子，并决定如何对不同的单词进行替换。年长巫师所说句子的解析可能如下：\n\n```\n Statement\nNounPhrase\n\
     Pronoun : you\nVerbPhrase\n   Verb : point\nPrepPhrase\n   Preposition : with\n\
  NounPhrase\n   Adjective : your\nCompoundNoun\n   Noun : wand\nPrepPhrase\n   Preposition\
  \ : when\nNounPhrase\n   Pronoun : you\nVerbPhrase\n   Verb : want\nPrepPhrase\n\
     Preposition : to\nVerbPhrase\n   Verb : cast\nNounPhrase\n   Determiner : a\n\
  CompoundNoun\n   Noun : spell\n```\n\n包围两个巫师的护符泡泡需要检查上面显示的语法树，并决定哪些单词需要被其他单词替换，以构建一个在泡泡外听到的无害句子。读者应该看到在决定单词替换之前构建语法树的必要性。\n\
  \n\n\n\n除了单词所承担的语法作用外，决定如何进行单词替换的另一个因素是单词所处的局部（甚至是句子或更高级层级）的上下文。为了说明这个问题，当单词“magic”（魔法）被用作一个显然属于魔法世界的词汇“wand”（魔棒）的修饰语时，它可能需要替换为某个非魔法世界的单词；但当同一个词出现在“the\
  \ magic of your charm is of no help（你的咒语魔法毫无帮助）”这样的句子中，它就不需要替换了。\n\n**这说明了一个事实，即除了通过句子的语法树提取单词的语法作用外，解释器还必须检查该单词至少的短语上下文以进行正确的解释。**\n\
  \n根据上述解释，我们可以说解释器必须具备以下两种能力：(1) 它必须知道如何向下遍历语法树，直到到达句子单个单词的叶子节点。(2) 当它尝试确定使用什么种规则进行解释时，它必须考虑当前作为解释焦点的短语或单词的上下文。本章后续部分介绍的解释器同时具备这两种能力。\n\
  \n## 16.6 解释器模式的解析器前端\n\n任何尝试直接解释的尝试——即不经过任何形式解析的解释——其效用都非常有限。没有解析，你所做的只是执行基于关键词（或基于关键短语）的解释。你可以想象的，这可能仅适用于最简单的应用程序。无论如何，既然解析器生成器现在已经变得非常易用，为什么不利用它们来演示解释器模式呢？通过借助如\
  \ `JavaCC` 这样的解析器生成器来解决解析问题，我们可以将更多精力放在解释器模式使用的另一个挑战上——上下文。\n\n我们对解释器模式的演示将使用 `JavaCC`\
  \ 生成解析器和词法分析器，作为解释器模式的前端。`JavaCC` 是 Java 应用中最流行的解析器/词法分析器生成器。解析器生成器是一种工具，可以将一组语法规则（通常使用我们在第\
  \ 16.1 节中描述的 BNF 表示法或其变体）转换为解析程序。而词法分析器生成器是一种工具，用于翻译哪些字符组合构成了不同语法类别的单词。\n\n由于解析是在词法分析器的输出上进行的，因此有必要谈谈文本的词法分析。词法分析器通常从左到右扫描字符序列，同时将字符分组为令牌（tokens`），对于普通文本处理来说，这些令牌就是单词和标点符号。对于如下句子产生的令牌：\n\
  \n`  The magic of your charm is of no help.`\n\n产生的令牌为：\n\n```\n\"The\" SPACE \"\
  magic\" SPACE \"of\" SPACE \"your\" SPACE \"charm\" SPACE\n      \"is\" SPACE \"\
  of\" SPACE \"no\" SPACE \"help\" PERIOD\n```\n\n其中，`SPACE` 是词法分析器可能用于单词之间空格字符的标识符，而\
  \ `PERIOD` 是句末句号的标识符。除了提供令牌外，词法分析器还为解析器提供令牌的语法类型。对于上述示例，词法分析器会知道单词“magic”的语法类型是\
  \ `NOUN`（名词）；解析器将连同令牌一起接收到该信息。当解析器接收到令牌及其语法类型时，它会尝试将语法规则应用到令牌上，以便构建句子的语法树。\n\n当令牌属于多个语法类型时，解析器面临的主要挑战之一就是如何处理可选的类型。为了解释这一点，考虑以下句子：\n\
  \n`  Harry and Ron play quidditch.`\n\n以及这个句子：\n\n`  That was a great play by Harry.`\n\
  \n在第一种情况下，“play”是一个 `VERB`（动词），在第二种情况下它是一个 `NOUN`（名词）。所以，假设在处理上述两个句子中的第一个句子时，解析器首先将“play”视为类型为\
  \ `NOUN` 的令牌。由于“play”作为 `NOUN` 令牌处理，解析器将无法解析整个句子。也就是说，当解析器处理句子中的最后一个令牌时，它将无法找到能够适应句子最后一个单词的语法规则。为了解决此类困难，理想情况下，你需要一个允许回溯并撤销决策的解析器，直到它到达一个选择点，在该选择点上，解析器可以使用其他语法规则并继续进行。对于上面显示的第一个句子，如果允许回溯，解析器现在会将“play”视为一个\
  \ `VERB` 令牌。有了这个选择，解析器就能解析整个句子了。\n\n由 `JavaCC` 生成的解析器属于 `LL` 解析器类别。这些解析器处理从左到右扫描句子产生的令牌，并执行所谓的句子解析的“自顶向下最左推推导（top-down\
  \ leftmost derivation）”。由于这些解析器还允许在前述脚注中解释过的前瞻（lookahead），这些解析器更通俗地归类为 `LL(k)` 解析器，其中\
  \ `k` 代表前瞻令牌的数量。显然，`k` 越大，解析器的性能就越慢。\n\n`JavaCC` 为我们提供了几种不同的方式来指定生成词法分析器和解析器所需的所有信息。如果我们只需要解析器判断句子是否符合某些语法规则，可以将所有信息放在\
  \ `.jj` 文件中。如果我们希望解析器在发现输入中的语法成分时执行代码，情况也是如此。但如果我们希望解析器返回输入的语法树，那么我们应该将所有信息放在 `.jjt`\
  \ 文件中。在这里我们只对后者感兴趣。为了让读者了解一个 jjt 文件的内容，我们将在本节展示针对以下语法的这样一个文件：\n\n| `MagicalSpeech`\
  \ | `::=` | `( Statement <PERIOD> )+` |\n| `Statement` | `::=` | `NP VP?` |\n| `NP`\
  \ | `::=` | `( Pronoun &#124; ( Determiner )?` |\n| | | | `  ( Adjective )* CN )\
  \ ) ( PP )?` |\n| `CN` | `::=` | `Noun ( Noun )?` |\n| `PP` | `::=` | `Preposition\
  \ NP` |\n| `VP` | `::=` | `Verb (NP &#124; PP)` |\n\n其中规则以 BNF 形式呈现，其基本表示法在第 16.1\
  \ 节脚注中解释过。（补充之前提到的 BNF 表示法，`+` 表示“至少一次”。）在上述规则中，`NP` 代表名词短语，`VP` 代表动词短语，`CN` 代表复合名词，`PP`\
  \ 代表介词短语。这些规则放在名为 `magic_speak_parser_specs.jjt` 的 .jjt 文件中，方式如下。如你所见，文件由四个部分组成：首先是选项部分，随后是指定词法分析器规则的部分。文件的第三部分是指定语法规则的部分。文件的最后一部分用于指定生成语法树叶子节点的规则。在这里我们只对这种情况感兴趣。\n\
  \n\n\n\n```java\n //\n// filename: magic_speak_parser_specs.jjt\n//\n\n//////////////////////////\
  \ 第 1 部分：选项 //////////////////////////\n\noptions {\n  JAVA_UNICODE_ESCAPE = true;\n\
    NODE_PREFIX = \"AST\";\n  MULTI = true;\n  STATIC = false;\n  NODE_DEFAULT_VOID\
  \ = true;\n}\n\nPARSER_BEGIN(Parser)   //解析器类名为 \"Parser\"\nimport java.io.*;\n\
  public class Parser {}\nPARSER_END(Parser)\n\n///////////////// 第 2 部分：词法分析器规则 ////////////////////\n\
  \nSKIP : {\n \" \"\n| \"\\t\"\n| \"\\n\"\n| \"\\r\"\n| \"\\f\"\n}\nTOKEN_MGR_DECLS:\
  \ {\n  public static int commentNestingCounter = 0;\n}\nSKIP: {\n  <\"//\" (~[\"\
  \\n\",\"\\r\"])* (\"\\r\\n\"|\"\\r\"|\"\\n\") >\n}\nSKIP: {\n  <\"/*\"> {commentNestingCounter=1;}:\
  \ INSIDE_COMMENT\n}\n<INSIDE_COMMENT> SKIP: {\n  <\"/*\"> {commentNestingCounter++;}\n\
  }\n<INSIDE_COMMENT> SKIP: {\n  <\"*/\"> {commentNestingCounter--;\n   if (commentNestingCounter==0)\
  \ SwitchTo(DEFAULT);}\n|\n  <~[]>\n}\nTOKEN :\n{\n  < NUMBER: (<DIGIT>)+ ( \".\"\
  \ (<DIGIT>)+ )? >\n|\n  < #DIGIT: [ \"0\"-\"9\" ] >\n}\nTOKEN : { < DETERMINER:\
  \ \"the\" | \"every\" | \"this\" | \"a\" | \"an\" > }\nTOKEN: { < NOUN: \"wand\"\
  \ | \"chess\" | \"spell\" | \"business\" | \"beings\"\n     \"help\" | \"mousetraps\"\
  \ | \"dementors\"\n     \"world\" | \"wizards\" | \"charm\" | \"polyjuice\"\n    \
  \ \"potion\" | \"else\" | \"magic\"\n     \"pieces\" | \"problems\" > }\nTOKEN:\
  \ { < PRONOUN: \"i\" | \"we\" | \"this\" | \"you\" | \"us\" > }\nTOKEN: { < ADJ:\
  \ \"magic\" | \"wizard\" | \"polyjuice\" | \"your\" | \"dark\"\n     \"fast\" |\
  \ \"large\" | \"dangerous\" | \"wizarding\"\n     \"no\" | \"high\" | \"animated\"\
  \ | \"else\"\n     \"difficult\"> }\nTOKEN: { < VERB: \"is\" | \"are\" | \"have\"\
  \ | \"has\" | \"make\"\n     \"want\" | \"cast\" | \"look\" | \"play\" | \"can\"\
  \n     \"makes\" | \"point\" | \"allows\"\n     \"construct\" | \"build\" | \"builds\"\
  \n     \"stores\" | \"conquer\" >}\nTOKEN: { < PREPOSITION: \"with\" | \"when\"\
  \ | \"without\" | \"for\"\n     \"about\" | \"at\" | \"after\" | \"to\"\n     \"\
  of\" | \"between\" | \"but\" | \"below\"\n     \"in\" | \"into\" | \"like\" | \"\
  except\"\n     \"following\" | \"on\" | \"than\" | \"over\"\n     \"near\" | \"\
  of\" | \"like\" | \"near\"\n     \"since\" | \"up\" | \"upon\" | \"within\"\n    \
  \ \"by\" > }TOKEN : /* 单词 */\n{\n  < WORD: (<LETTER>)+\n|\n  <LETTER: [\"a\"-\"\
  z\", \"A\"-\"Z\"] >\n}\n/* 分隔符 */\nTOKEN :\n{\n  < PERIOD: \".\" >\n}\n\n///////////////////////\
  \ 第 3 部分：语法规则 //////////////////////\n\nASTMagicalSpeech MagicalSpeech() #MagicalSpeech\
  \ :\n  {}\n  {\n    ( Statement() <PERIOD> )+\n    { return jjtThis; }\n  }\nvoid\
  \ Statement() #Statement :\n  {}\n  {\n    () ( VP() )?\n  }\nvoid NP() #NounPhrase\
  \ :\n  {}\n  {\n    Pronoun() | ( Determiner() )? ( Adjective() )* CN() ) (PP())?\n\
    }\nvoid CN() #CompoundNoun:\n  {}\n  {\n    Noun() ( Noun() )?\n  }\nvoid PP()\
  \ #PrepPhrase :\n  {}\n  {\n    Preposition() ( (NP() (VP())?) | VP() )\n  }\nvoid\
  \ VP() #VerbPhrase :\n  {}\n  {\n    Verb() (NP() | PP())\n  }\n\n///////////////////\
  \ 第 4 部分：语法叶节点 /////////////////////\n\nvoid Noun() #Noun :\n  {}\n  {\n    t=<NOUN>\
  \ {jjtThis.setLexem(t.image);}\n  }\nvoid Pronoun() #Pronoun :\n  {}\n  {\n    t=<PRONOUN>\
  \ {jjtThis.setLexem(t.image);}\n  }\nvoid Determiner() #Determiner :\n  {}\n  {\n\
      t=<DETERMINER> {jjtThis.setLexem(t.image);}\n  }\nvoid Adjective() #Adjective\
  \ :\n  {}\n  {\n    t=<ADJ> {jjtThis.setLexem(t.image);}\n  }\nvoid Preposition()\
  \ #Preposition :\n  {}\n  {\n    t=<PREPOSITION> {jjtThis.setLexem(t.image);}\n\
    }\nvoid Verb() #Verb :\n  {}\n  {\n    t=<VERB> {jjtThis.setLexem(t.image);}\n\
    }\n```\n\n* * *\n\n本节的其余部分解释了上述文件中词法器和解析器使用的语法。为了方便读者根据第 16.12 节的建议扩展本章示例代码。\n\
  \n上述 `.jjt` 文件的第 2 部分标记为“词法分析器规则”的部分为词法器声明了不同的标记类型。更准确地说，`SKIP`、`INSIDE COMMENT`、`TOKEN`\
  \ 等标识符定义了*词法状态*（lexical states）。当从左到右扫描输入时，词法分析器在任何时刻只能处于这些状态中的一种。至于词法分析器对与词法状态相关的正则表达式匹配的输入部分做了什么，取决于状态本身。例如，任何匹配\
  \ `SKIP` 标识符正则表达式的输入部分都会被丢弃。而任何匹配 `TOKEN` 正则表达式的输入部分将作为一个标记发送给解析器。虽然上述 `.jjt` 文件中的某些词法状态（`SKIP`\
  \ 和 `TOKEN`）是由 JavaCC 提供的，你也可以定义自己的词法状态，并在适当定义的正则表达式匹配输入中的某些字符序列时让词法分析器进入这些状态。词法状态\
  \ `INSIDE COMMENT` 就是此类自定义状态的示例。注意 `SKIP` 和 `INSIDE COMMENT` 状态是如何协作丢弃输入中所有注释块（甚至是嵌套注释块）的。\n\
  \n\n\n\n\n此标题行同时完成了多项功能。一方面，它声称声明了一个名为 `MagicalSpeech()` 的方法，该方法应该返回一个类型为 `ASTMagicalSpeech`\
  \ 的对象；另一方面，符号 `#MagicalSpeech` 意味着我们希望解析器输出一个语法树节点，而这个名为 `MagicalSpeech` 的节点将由 Java\
  \ 类 `ASTMagicalSpeech` 创建。如果没有 `#MagicalSpeech` 这种形式的额外语法糖，解析器的工作方式将完全相同，但你不会在语法树中看到标签为\
  \ `MagicalSpeech` 的节点。\n\n标题行之后是两对大括号。第一对大括号包含了可能在声明以及第二对大括号内部的可执行代码中使用的任何局部变量。第二对大括号内部的任何语句——例如\
  \ `return jjtThis;` 语句——都代表在解析发生过程中需要执行的用户操作。第二对大括号内部的 `return jjtThis;` 语句简单地表示返回解析树的当前节点。变量\
  \ `jjtThis` 始终代表当前节点，即包含 `jjtThis` 语句的规则所对应的节点。\n\n这使我们离开了 `.jjt` 文件的第 4 部分。该部分在本节显示的文件中标记为“语法叶子节点”（Grammar\
  \ Leaf Nodes），包含了解析树叶节点的规则。与“语法规则”（Grammar Rules）部分中规则的表达式一样，请注意每个规则的标题既声明了一个方法（如\
  \ `Noun` 叶子节点标题中的 `Noun()` 部分），又说明了我们希望语法树包含相应的节点，后者通过标题中类似 `#Noun` 的声明来实现。同样，与“语法规则”部分的规则一样，每个规则都涉及两对大括号：第一对用于声明第二对大括号内部所需的任何局部变量，第二对用于实际放置代码，以为该语法类别创建值。由于是叶子节点，第二对大括号内部的代码会获取用\
  \ `<>` 分隔符显示的对应令牌（token），并通过调用该令牌的“镜像”（image）来设置解析树中对应节点的值，该镜像仅仅是对应令牌的字符字符串。\n\n\
  正如第 16.12 节中将提到的，在本节中显示的 `magic_speak_parser_specs.jjt` 文件将由 JavaCC 库的 `jjtree`\
  \ 预处理器处理。\n\n## 16.7 模式演示的总体视图\n\n图 16.1 显示了我们解释器模式演示的类层次结构。解释的整体编排由 `Driver` 类在从根解释类\
  \ `Interpreter_Sentence` 派生的类的帮助下完成。魔法语言中单个名词、动词和形容词的实际解释分别由类 `Interpreter_Noun`、`Interpreter_Verb`\
  \ 和 `Interpreter_Adjective` 执行。然而，`Driver` 类只能通过 `Interpreter_Sentence` 类提供的接口访问这些更具针对性的\
  \ `Interpreter` 类。\n\n正如你将将在本章其余部分的解释中看到的那样，`Driver` 类扮演的角色至关重要，其意义在于：一方面，它知道如何调用根据上一节提出的语法规范生成的解析器功能；另一方面，它知道如何使用\
  \ `Interpreter_Sentence` 类提供的接口并触发对魔法语言句子中单个单词和短语的解释。\n\n![image](img/c16f001.gif)\n\
  \n**图 16.1**\n\n关于 `Driver` 类的第一个功能，即它如何调用从上一节 `.jjt` 文件生成的解析器，这里是 `Driver` 代码中的核心调用，我们将在下一节更详细地展示：\n\
  \n```\n Parser parser = new Parser(inputStream);\nASTMagicalSpeech root = parser.MagicalSpeech();\n\
  ```\n\n其中 `Parser` 是根据 `.jjt` 文件中的语法规范自动生成的类，第二次调用调用了解析器上的 `MagicalSpeech()` 方法以启动词法分析和解析过程。注意\
  \ `Parser` 实例是如何绑定到 `InputStream` 对象的。正如你稍将看到的，这个输入流被附加到包含魔法语言句子的文件中。\n\n`Driver`\
  \ 类的第二个功能是它启动自动解释的能力，在我们案例中，这会导致魔法语言自动转换为普通语言（muggle-speak）。`Driver` 通过对调用 `MagicalSpeech()`\
  \ 返回的 `root` 节点进行以下调用来实现的：\n\n```\nprocessForInterpretation(root);\n```\n\n正是这个调用向下遍历挂在根节点上的语法树，并在提供解释所需的上下文的同时，对\
