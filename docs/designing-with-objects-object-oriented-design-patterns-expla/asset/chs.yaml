  \n\n读者可能还记得，我们对状态模式的演示是基于构建一个小型“教育工具”，该工具可以回答用户关于霍格沃黑魔法防御术（DADA）教学的问题。可以提出的问题类型在接口\
  \ `DADA_State` 中定义，而实现该接口的具体类命名为 `DADA_YearX`，其中 `X` 从 1 到 7。状态类的接口及其七个具体实现已在之前的两个节中介绍过。\n\
  \n除了这些状态类外，我们还需要一个可以作为用户交互“前端”的类。这个角色由下所示的 `TeachingDADA` 类承担。你是在该类的实例中，通过七个状态类之一来指定用户查询的上下文。一旦上下文的状态固定，`TeachingDADA`\
  \ 对象就会自动将与 DADA 相关的用户查询重定向到相应的具体状态类。\n\n你可以将 `TeachingDADA` 理解为了通用的上下文，而将上一节中的七个状态类理解为使上下文具体化的手段。使上下文具体化的精确机制包括：首先实例化七个状态类之一，然后将其作为参数传递给\
  \ `TeachingDADA` 类的构造函数。注意 `TeachingDADA` 类是如何将状态类与软件客户端隔离开的。\n\n`TeachingDADA`\
  \ 类有一个类型为 `DADA_State` 的实例变量 `state`。对 `TeachingDADA` 实例提出的任何问题（即在该类实例实例上调用的任何方法）都会被翻译为通过实例变量\
  \ `state` 选择的状态上的方法调用。\n\n***\n\n```\n import java.util.List;\n\npublic class TeachingDADA\
  \ {\n\n\tprivate static DADA_State state;\n\n\tpublic TeachingDADA( DADA_State state\
  \ ) {\n\t\tthis.state = state;\n\t}\n\tpublic String getState() {\n\t\treturn state.getState();\n\
  \t}\n\tpublic String getTeacher(){\n\t\treturn state.getTeacher();\n\t}\n\tpublic\
  \ String teacherPersonalityTraits() {\n\t\treturn state.teacherPersonalityTraits();\n\
  \t}\n\tpublic List<String> terminationConditions() {\n\t\treturn state.terminationConditions();\n\
  \t}\n\tpublic String teacherBackground() {\n\t\treturn state.teacherBackground();\n\
  \t}\n}\n```\n\n***\n\n## 21.10 霍格沃黑类\n\n到为止，我们定义了一组状态类以及类 `TeachingDADA`，其中其中一个状态类被用于使上下文具体化。如上一节所述，`TeachingDADA`\
  \ 定义了通用的上下文。在回答用户关于 DADA 教学的问题之前，上下文必须获取的特殊性是通过其中一个具体状态类来实现的。`TeachingDADA` 类将自身上的方法调用翻译为所选状态类上相应的方法调用。\n\
  \n现在我们定义一个客户端类，向 `TeachingDADA` 类提出与 DADA 相关的查询。我们将此类命名为 `Hogwarts`，因为推测我们在这里展示的可能是一个更大的类的一部分（以学校本身命名），用于提供有关霍格沃黑的所有信息。\n\
  \n在接下来的类定义中，我们构造一个具体状态类的实例，并将其作为参数传递给 `TeachingDADA` 的构造函数。随后，我们通过在构造的 `TeachingDADA`\
  \ 实例上调用方法来“模拟”用户提问的过程。言而明，这种模式更真实的用法应该是与人类用户进行基于 GUI 的交互。根据用户提供的信息，此处所示类的扩展版本将自动构造适用状态类的实例，并使用它来构造\
  \ `TeachingDADA` 实例。之后，用户可以看到一个菜单列表，系统中每个项目都有与用户所选年份的 DADA 教学相关的信息。用户点击这些项目中的任何一个，都会导致在\
  \ `TeachingDADA` 实例上调用特定于该项目的方法。\n\n***\n\n```\n public class Hogwarts {\n\n\tpublic\
  \ static void main(String[] args) {\n\t\t// 如果人类感兴趣了解哈利·波特住在\n\t\t// 霍格沃黑第一年关于 DADA\
