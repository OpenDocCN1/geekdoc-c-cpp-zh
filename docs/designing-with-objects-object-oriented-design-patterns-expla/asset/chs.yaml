  \ | :--- |\n| `原生栖息范围:` | `瑞典` |\n| `喜好进食:` | `狗、人类` |\n| `可生长长度:` | `22 英尺 (22\
  \ feet)` |\n\n## 5.6 原型模式演示的顶层视图\n\n图 5.3 中的类图展示了我们原型模式（Prototype pattern）演示的顶层视图。`PrototypeManagerAndDuplicator`\
  \ 类的职责是创建并存储 `Dragon` 类的八个通用实例（原型），并在收到客户端请求龙请求时，随后交付这些原型的克隆。如图所示，`PrototypeManagerAndDuplicator`\
  \ 类配备了八个私有实例变量，用于存储对这八个原型的引用。正如读者后将看到的，当我们调用 `PrototypeManagerAndDuplicator` 的无参构造函数时，这些实例变量会被自动初始化。\n\
  \n![image](img/c05f003.gif)\n\n**图 5.3**\n从图 5.3 中 `Dragon` 类的可见性标记可以看出，该类的构造函数被放在类的私有区域。这是为了禁止直接构造\
  \ `Dragon` 类的实例。构造 `Dragon` 实例的唯一机制是通过 `Dragon` 位于类公共区域的 `makeNewDragonInstance()`\
  \ 方法，正如图 5.3 中的可见性标记所暗示的那样。\n\n图 5.3 还向我们展示了如何使 `Dragon` 类可隆。所示，八个原型龙由 `PrototypeManagerAndDuplicator`\
  \ 类存储。这些原型在处理任何供应龙的请求之前就已经创建并存储了。随后，当 `PrototypeManagerAndDuplicator` 类收到来自龙爱好者的请求时，该类将交付与所请求类型对应的原型克隆。\n\
  \n## 5.7 Dragon 类\n\n`Dragon` 类的实现基于这样一个假设：该类仅会被调用为 `allTypes` 集合中列出的八种类型之一提供实例。\n\
  \n注意实例变量 `whatType`、`nativeRange`、`likesToEat` 和 `length`。第一个 `whatType` 只能设置为 `allTypes`\
  \ 集合中的八种类型之一，否则将抛出 `UnknownDragonException`。实例变量 `nativeRange` 被设置为默认值 `Unknown`。三个实例变量\
  \ `whatType`、`nativeRange` 和 `length` 不需要任何特殊的克隆过程。也就是说，对实例进行逐字节的复制在这些三个实例变量方面将表现出正确的行为。\n\
  \n然而，实例变量 `likesToEat` 持有一个类型为 `List<String>` 的容器的引用。当我们克隆一个 `Dragon` 实例以创建其副本时，这个实例变量需要特别注意。为了确保克隆的\
  \ `Dragon` 实例的 `likesToEat` 变量不会指向与原始 `Dragon` 实例相同的 `ArrayList`，请注意在 `clone()`\
  \ 的实现代码中，调用 `super.clone()` 后，我们调用了 `ArrayList` 构造函数，从原始 `ArrayList` 的内容构建一个新的 `ArrayList`。\n\
  \n此外，注意所有不同 `Dragon` 类型的名称存储在一个名为 `allTypes` 的 `final static` 集合中。由于我们不想以任何方式扩展或更改此集合，因此将其声明为\
  \ `final`。此外，由于这些信息适用于所有 `Dragon` 实例，我们将其声明为 `static`。\n\n另外，注意 `Dragon` 构造函数被声明为\
  \ `private`。同时，我们为类配备了 `public` 方法 `makeNewDragonInstance()`，可以通过调用私有构造函数返回新的 `Dragon`\
  \ 实例。我们不希望构造函数可以在类外部直接访问，因为我们想要控制 `Dragon` 实例的产生方式。正如读者从第 5.6 节所示的演示顶层视图，我们使用 `PrototypeManagerAndDuplicator`\
  \ 类通过复制该类中存储的原型实例来提供新的 `Dragon` 实例。在 `PrototypeManagerAndDuplicator` 类中，我们将通过 `Dragon`\
  \ 的 `makeNewDragonInstance()` 方法创建所需的原型。\n\n最后，注意 `get` 和 `set` 方法，前者用于打印特定 `Dragon`\
  \ 实例的属性，后者用于更改某些属性。我们将使用这些方法来证明，尽管客户端请求的 `Dragon` 实例是通过从原型复制创建的，但客户端可以修改获取的实例的属性，而不影响所使用的原型或其他从同一原型复制获得的其他实例。\n\
