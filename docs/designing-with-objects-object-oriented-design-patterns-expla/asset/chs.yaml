  nn15: [nn11, nn12, nn13, nn14]\n```\n\n\n\n\n假设你拥有一个以独特品质著称的特殊对象。假设世界上只这样一个对象。如果需要更多这样的对象，为什么不直接通过复制你所拥有的对象来构建它们呢？另一种方法是为每个新复制的对象从头开始，通过指定其所有属性的值，然后实际构建它。\n\
  \n通过克隆你所拥有的版本来构建新的对象副本，可以避免在从头开始构建对象时，由于指定所需属性而可能导致的错误。此类错误发生的概率会随着对象复杂性的增加而不断。。当一个对象拥有大量属性，或者某些属性的值必须通过猜测时，你可能会将某个值设置为你认为是正确的，但实际上它并非如此。\n\
  \n上述注释与第 5 章中关于原型模式的第 5.1 节 提到的内容在本质上是相同的。\n\n为了进一步扩展原型模式中“通过复制构建”的想法，让我们现在考虑一种情况：你的客户想要你所拥有的对象的副本，但要求这些副本要有所变体。假设你拥有的唯一对象可以看作由一个核心部分一些对核心部分的装饰部分组成。我们进一步假设，客户所需的对象变体只需要对装饰部分进行更改。现在的问题是，如何最好组织新版本对象的生产，以便在直接复制核心部分的同时，根据客户表达的偏好来设置装饰部分。这正是**享量模式**（Flyweight\
  \ pattern）所解决的问题。\n\n推广到你拥有的多个对象的情况，享量模式的核心思想可以这样解释：假设你的软件产生的所有对象都由少数几个核心形式以及对这些形式进行装饰的多种方式组成。享量模式认为，最好的做法是在内存中存储所有的核心形式——这些形式可能是由一个或少数几个类构建的实例。为了为客户端构建一个对象，你只需快速复制存储的核心形式之一，然后使用客户指定的装饰对其进行定制化。\n\
  \n## 12.2 意图与适用性\n\n享量模式的意图是为对象的生产提供效率，这些对象的特征是具有相对不变的*内在状态*（intrinsic state）和更易变化的*外在状态*（extrinsic\
  \ state）。\n\n在以下情况下，你应该考虑使用该模式：\n\n*   从类系统中构建的对象可以被视为是对少数核心形式的装饰，其中核心形式决定了对象的内在状态，而装饰部分决定了外在状态；\n\
  *   通过复制来生产核心形式的新版本，比通过`constructor`调用从头开始生产更廉价；\n*   客户所需的对象定制主要由更改装饰部分组成；\n* \
  \  优化装饰部分的生产比优化核心形式的生产更廉价。\n\n## 12.3 享量模式简介\n\n让我们把制作披萨比作构建软件对象的隐喻。假设你想向客户提供四种风格完全不同的披萨：(1)\
  \ 薄底的；(2) 芝加哥式深层底；(3) 锅底的，其底部通过在锅中用油微煎使其变得酥脆；以及(4) 即烤即食。正如你预期的那样，每种披萨的配料会随订单而变化。如果你使用享量模式，你**不需要**为每种风格和每种配料组合创建一个单独的类。你也**不需要**创建一个类来表示所有披萨，并让每个披萨的风格及其配料由类的`instance\
  \ variables`（实例变量）来处理。相反，通过享量模式，你将为四种基本的披萨核心风格创建四个类。对于你操作产出的每一个披萨，你都会从这些核心类中的一个创建一个`instance`（或者更有可能使用之前创建的实例的副本），然后像本章将解释的那样，用配料对该`instance`进行装饰。图\
  \ 12.1 所示的核心形式对应于四种基本的披萨风格，装饰部分对应于配料。\n\n![image](img/c12f001.gif)\n\n**图 12.1**\n\
  \n图 12.1 中每个核心形式所需的标识信息可以被认为是构成客户所需对象的*内在参数*（intrinsic parameters）。而你为了定制核心形式而需要的额外状态信息可以被认为是对象的*外在参数*（extrinsic\
  \ parameters）。将披萨制作过程中的内在参数和外在参数隔离，允许你分别控制披萨核心形式及其装饰部分的构建，可以认为这可以提高你披萨外送业务的整体效率。例如，应用到核心形式内在参数的任何优化都需要更彻底的分析和理解（因为从该形式定制的所有披萨实例都会受到影响）。对于仅应用于外在参数的任何优化，情况就不可能是这样，因为相对而言，只有少量的最终披萨实例可能会受到影响。\n\
  \n## 12.4 现实应用中的享量模式\n\n这些思想在现实世界中的应用可以是：使用纯面向对象的方法表示文本文档及其内容。每个字符可能在文档中出现任意次数。对于每个给字符，变化的是它在文档中的位置以及字体样式和大小。字符的每次出现都可以是该字符核心形式的一个`instance`，并与字符位置及字体大小相关的外在参数进行装饰。这种文档表示方法可以让我们一方面独立控制核心形式，另一方面独立控制它们的装饰部分——特别是与字体大小和样式相关的装饰部分。\n\
  \n## 12.5 用哈利·波特的故事说明享量模式\n\n几位霍格沃斯的任校长因他们在任期内取得的成就而闻名。由于名声，人们和组织喜欢将他们的肖像挂在墙上。这些肖像具有魔力，因为同一个人的图像可以从一个肖像移动到另一个肖像，即使这两个肖像相隔很远。例如，在《凤凰社》书中，邓布利与前校长埃弗拉德教授的肖像交话，要求教授前往魔法部的肖像处发出警报，以引起对在魔法部受伤的阿瑟·韦斯莱的关注。，邓布利派遣前女校长迪莉丝·德文特前往她在圣芒戈医院的肖像处，询问阿瑟是否被送往了医院。在同一个故事中，邓布利与前校长菲尼斯·尼格勒卢斯·布莱克的肖像交话，要求他前往格里莫德广场\
  \ 12 号的肖像处，告诉他的曾曾孙西里斯·布莱克阿瑟·韦斯莱受伤了，阿瑟的妻子孩子以及哈利·波特很快就会到达那里。\n\n\n\n我们对享重量模式（Flyweight\
  \ pattern）的演示基于制作霍格沃前任校长的肖像。我们假设制作这样的肖像涉及：(1) 从官方图像存档获取校长（或女校长）的图像；(2) 将图像印在纸张或画布等合适的介质上；最后，(3)\
  \ 在介质周围加上一个边框，*边框是对客户肖像的定制化*。因此，为了与我们之前的示例进行类比，我们可以将肖像中的图像视为核心形式，将边框视为装饰。享重量模式指出，如果可能的话，当获取前任校长的图像时，应该将其存储起来，以便在未来对同一位校长或女校肖像请求时可以使用相同的图像。\n\
  \n如果我们假设魔法社区规模庞大，而肖像制作者较少，那么肖像制作者可能会收到大量关于霍格沃前任校长的肖像请求——特别是对于那些在校期间非常受欢迎的人。因此，与其反复从图像存档购买同一位校长的图像，不如肖像制作者更合理的做法是在收到第一次请求时获取图像，将其存储在自己的某种设备中，然后使用它为后续涉及同一前任校长的订单创建带有客户特定边框的副本。*这正是享重量模式应该要做的事情。*\n\
  \n## 12.6 模式演示的顶层视图\n\n我们将想象以下场景，魔法社区的人们通过这种方式获取霍格沃前任校长和女校长的肖像：\n\n*   官方图像存档中提供各种类型的图像，包括霍格沃前任校长的图像——在我们的案例中，这一角色将由\
  \ `ImageManager` 类担任。存档将图像出售给获得许可的肖像制作者，方式是“一次性购买，无限使用”。\n*   由于肖像制作者获取的图像在未来可以使用任意次数，他/她必须将获取的每个图像存储在自己的数据库中。\n\
  *   当客户请求肖像时，客户通常还会为肖像请求一个他们选择的边框。通常，边框的选择将基于肖像要悬挂的学院的合适颜色和其他符号（如纹章）。然而，为了简单起见，我们假设这种定制仅包括在图像周围放置一个宽宽的彩色边框。\n\
  \n我们对享重量模式的演示基于以下“角色”：\n\n*   **ImageManager：** 该类的主要契约是担任魔法世界的官方图像存档。该类旨在为该类的客户提供一组图像，客户可以从中进行挑选。（该类的客户将是肖像制作者。）`ImageManager`\
  \ 通过一个名为 `loadImages()` 的静态方法提供其图像。当肖像制作者调用\n\n    ```\n    ImageManager.loadImages();\n\
  \    ```\n\n*   肖像制作者可以获取——但仅供检查——存档中提供的所有图像。随后，肖像制作者必须为收到的肖像订单选择图像，并将其存储在自己的本地数据库中。肖像制作者仅对所选图像付费。如前所述，肖像制作者只需为一张图像支付一次费用^(1)。获取图像后，他/她可以根据意从该图像创建任意数量的肖像。\n\
  \n*   **HeadMasterPortrait：** 该类的实例是根据从 `ImageManager` 类订单或从肖像制作者维护的本地存储中检索的图像制成的肖像。因此，该类的实例就是肖像制作者交付给客户的肖像。使用购买或检索的图像，实际创建新肖像的工作交给了\
  \ `PortraitMakerAssignment` 类。由 `PortraitMakerAssignment` 创建的每个肖像都是霍格沃前任校长图像与为制作该肖像的客户选择的边框的组合。\n\
  \n*   **FlyweightImageStore：** 回想一下，享重量模式的核心存储之前创建的肖像实例的核心部分，这些核心部分是霍格沃校长的图像，这样图像就可以在未来相同校长的肖像中再次使用。（再次提醒读者，肖像是图像及其边框的组合。）`FlyweightImageStore`\
  \ 是肖像制作者的本地存储。它是一个智能存储系统，其意义在于只有当该图像之前没有被使用过，它才会从 `ImageManager` 类获取新图像。\n\n*  \
  \ **PortraitBorderChoices：** 每个肖像订单都包含一个定制请求，定制内容是肖像的特定颜色的边框。`PortraitBorderChoices`\
  \ 类为该目的提供了一个预定义的彩色边框列表。该类实际上是一个 Java 接口。因此，类中定义的任何常量都可以被任何子类直接访问。\n\n*   **PortraitMakerAssignment：**\
  \ 肖像制作者使用此类类通过构造 `HeadMasterPortrait` 实例来创建一个新肖像。`HeadMasterPortrait` 构造函数必须提供校长（或女校长，视情况而定）的图像以及与图像使用的边框。校长图像是从\
  \ `FlyweightImageStore` 类获取的。如之前所述，该类将自行决定是否可以从自己的本地存储提供请求的图像，还是应该从官方存档购买。另一方面，边框是由客户指定的。\n\
  \n图 12.2 显示了演示代码的顶层视图。如所述，新肖像的订单由 `PortraitMakerAssignment` 处理。\n\n## 12.7 HeadMasterPortrait\
  \ 类\n\n当肖像制作者根据图像和客户要求的边框制作肖像时，该肖像是此处类的实例。当该类的构造函数被调用时（如由 `PortraitMakerAssignment`\
  \ 调用所示），必须提供霍格沃校长的图像以及与图像使用的边框。\n\n```java\nimport javax.swing.*;\nimport javax.swing.border.*;\n\
  \npublic class HeadMasterPortrait {\n\n\tprivate String headMasterName;\n\tprivate\
  \ ImageIcon image;\n\tprivate Border borderRequested;\n\n\tpublic HeadMasterPortrait(\
  \ String name, ImageIcon picture, Border border ) {\n\t\theadMasterName =name;\n\
  \t\timage = picture;\n\t\tborderRequested = border;\n\t}\n\n\tpublic void displayPortrait()\
  \ throws Exception {\n\t\tImageManager.displaySingleImage( headMasterName, image,\
  \ borderRequested );\n\t}\n}\n```\n\n## 12.8 FlyweightImageStore 类\n\n本节定义的类的目的是为肖像使用的图像提供存储（供肖像制作者本地使用）。图像是从下一节介绍的\
  \ `ImageManager` 类（担任存档角色）获取的。当第一次获取图像时，它被存储在由下方实现中 `portraitImages` 变量引用的集合中。\n\
  \n\n\n\n\n该类的两个静态成员 `imageDatabase` 和 `portraitImages` 都是用于存储图像的哈希表。但请注意它们的用法语义非常不同。`imageDatabase`\
  \ 存储是由 `ImageManager` 类表示的图像存档提供的。另一方面，`portraitImages` 是由肖像制作者（portrait maker）维护的本地存储，用于存储之前从存档中获取的图像。\n\
  \n关于 `getImage()` 方法的实现，它首先检查图像是否已经在肖像制作者维护的本地存储 `portraitImages` 中。如果在该存储中没有找到请求的图像，它将从\
  \ `ImageManager` 供应商处获取（为了演示的故事情，我们可以称之为“购买”），从其 `imageDatabase` 中检索图像。随后，任何此类图像都会存储在本地存储\
  \ `portraitImages` 中，以备以后为同一个头像制作肖像。\n\n静态方法 `getPortraitImageStoreSize()` 可以告诉我们到目前为止从\
  \ `ImageManager` 供应商获取并由肖像制作者本地存储的图像数量。静态方法 `howManyImagesOrderedFromImageArchive()`\
  \ 可用于确定从存档订购了多少幅图像。在随后的节 12.13 中，我们将比较这两个方法的整数值，以证明我们的享重量模式（Flyweight pattern）演示工作正常——也就是说，之前使用过的图像不会为新的肖像订单再次从\
  \ `ImageManager` 类订购。每当从存档订购图像时，静态整数变量 `numberImagesOrderedFromArchive` 的值就会加 1。\n\
  \n```\nimport java.util.*;\nimport javax.swing.ImageIcon;\n\npublic class FlyweightImageStore\
  \ {\n\n\tprivate static Hashtable<String,ImageIcon> imageDatabase =\n\t\t\t\t\t\t\
  ImageManager.loadImages();\n\tprivate static Hashtable<String,ImageIcon> portraitImages\
  \ =\n\t\t\t\t\t\tnew Hashtable<String,ImageIcon>();\n\tprivate static int numberImagesOrderedFromArchive\
  \ = 0;\n\n\tpublic static ImageIcon getImage( String name )\n\t\t\t\tthrows ImageNotAvailableException\
  \ {\n\t\tif (portraitImages.containsKey( name ) ) {\n\t\t\treturn portraitImages.get(\
  \ name );\n\t\t}\n\t\tif ( !imageDatabase.containsKey(name) ) {\n\t\t\tthrow new\
  \ ImageNotAvailableException();\n\t\t}\n\t\tImageIcon newImage = imageDatabase.get(\
  \ name );\n\t\tnumberImagesOrderedFromArchive++;\n\t\tportraitImages.put(name, newImage);\n\
  \t\treturn newImage;\n\t}\n\n\tpublic static int getPortraitImageStoreSize() {\n\
  \t\treturn portraitImages.size();\n\t}\n\n\tpublic static int howManyImagesOrderedFromImageArchive()\
  \ {\n\t\treturn numberImagesOrderedFromArchive;\n\t}\n}\n```\n\n* * *\n\n## 12.9\
  \ ImageManager 类\n\n本节介绍的 `ImageManager` 类在我们的演示中充当图像供应商。它的静态方法 `loadImages()` 将当前目录下的\
  \ jpeg 图像以哈希表的形式提供给其他人，其中以前的霍格沃茨头像名称作为键，从 jpeg 图像创建的 `ImageIcon` 对象作为相应的值。\n\n作为对巫魔法世界的服务，`ImageManager`\
  \ 类还提供了一个方法来显示由肖像制作者制作肖像。该类还包含一个幻灯片方法用于快速浏览数据库中的所有图像——仅为了查看数据库中当前有哪些图像。该方法称为 `slideshow()`，在此处的享重量模式演示中没有用到，但如果读者感兴趣进行尝试，可以通过\
  \ `ImageManager` 类使用它。\n\n通过查看 `ImageManager` 类定义的代码，读者可能想知道为什么我们需要静态变量 `nextPhotoDisplayIndex`。这个变量使得在终端窗口中同时显示多个图像变得更容易。详细来说，如你在节\
  \ 12.12 中所示，`PortraitMakerAssignment` 类的 `main` 方法会在计算机的终端窗口中同时构造并显示多个肖像。通常，所有这些肖像将一个接一个显示。然而，在静态变量\
  \ `nextPhotoDisplayIndex` 的帮助下，我们为每个肖像关联了一个整数索引，并使用此索引来平移每个显示的肖像。\n\n类中显示的第一个方法是\
  \ `loadImages()`。正是这个方法允许 `ImageManager` 类作为一个存档，将其图像提供给肖像制作者（我们假装收费）。该方法简单地扫描当前目录中的任何\
  \ jpeg 图像，并以哈希表的形式呈现给肖像制作者，哈希表的键源自名称。假设每个图像文件的名称为 `firstName_lastName.jpg` 或 `name.jpg`\
  \ 格式。图像中人物的名称是从名称中提取的子字符串构建的。在哈希表中，每个图像随后根据名称建立键值。\n\n类定义中的下一个方法签名如下：\n\n```\nvoid\
  \ displaySingleImage( Hashtable<String,ImageIcon> hash, String name)\n```\n\n该方法在你的计算机屏幕上显示单个图像，其名称在第二个参数中指定。这个名称推测是某位之前的校长或女校长。第一个参数是通过调用该类的\
  \ `loadImages()` 方法构造的哈希表。\n\n下一个方法的签名如下：\n\n```\nvoid displaySingleImage( String\
  \ name, ImageIcon image, Border border)\n```\n\n该方法被 `ImageMaker` 类的客户端用于显示一个“肖像”。记住，肖像是肖像制作者通过将图像印在某些介质上并在周围放置边框而创建的。\n\
  \n下一个静态方法是 `slideshow()`，它目前未用于享重量模式演示，但包含了它，以防用户想要快速查看 `ImageManager` 类提供的所有图像。该方法本质上是对内部类\
  \ `SlideShowDisplay` 中同名方法的封装。我们的封装方法首先构造内部类的实例，并在实例上调用内部类的 `slideshow()` 方法。内部类使用定时器在固定时间间隔显示每幅图像；此间隔的长度可以通过更改内部类中的变量\
  \ `pause` 值来修改。\n\n注意，所有的图像显示方法都使用 `javax.swing.Label` 类来实际显示图像。这个类的很棒之处在于它接受一个文本标签，可以与图像一起显示。该类提供了各种方法来控制文本标签相对于图像放置的位置。\n\
