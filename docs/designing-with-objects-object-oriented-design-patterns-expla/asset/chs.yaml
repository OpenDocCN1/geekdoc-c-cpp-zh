  \ path, String location) throws Exception;\n}\n```\n\n* *\n\n关于上述类定义中的方法，请注意演示代码启动时必须初始化内置网络。这是通过\
  \ `initializeBuiltinNetwork()` 方法实现的然而然而由于我们不希望多次初始化内置网络，我们通过静态变量 `builtinNetworkInitialized`\
  \ 来确保这一点。第一次调用 `initializeBuiltinNetwork()` 时，该布尔变量将被设置为 true。之后对 `initializeBuiltinNetwork()`\
  \ 的任何调用将直接返回。\n\n类定义中的另一个方法 `doesDestinationExistInBuiltinNetwork()` 对于任何计划前往目的地的人都很有用。这样的人想要知道该目的地是否是网络上的站点。\n\
  \n最后，我们有了 `travelByBuiltinFlooNetwork()` 方法，这可能是根类提供的最重要的方法。为了将自己传送到目的地，你需要调用此方法。该方法通过搜索网络中的最短路径来计算前往目的地的路径。\n\
  \n## 11.8 Network 类\n\n本节介绍了 `Network` 类，它用于对流火网以及由流火网管理局工作人员幻化的任何网络扩展进行建模。\n\n\
  类定义从以下静态变量开始，用于存储与内置网络的所有信息（5）：\n\n```\n  networkAddressesBuiltIn\n  networkLocationsBuiltIn\n\
    neighborhoodBuiltIn\n  networkArcsBuiltIn\n```\n\n\n\n我们将内置网络的地址存储在 `networkAddressesBuiltIn`\
  \ 中。内置网络中每个停靠点的内置地址都会被转换为 `Node` 实例，并存储在列表 `networkLocationsBuiltIn` 中。我们还将每条直接链接（即每对直接连接的节点）单独存储在列表\
  \ `networkArcsBuiltIn` 中。最后，我们将每个邻域单独存储在哈希表 `neighborhoodBuiltIn` 中，它由 `<key,value>`\
  \ 对组成，其中每个键是网络中的一个节点，对应的值是组成该节点邻域的节点列表。对于任何给定的节点，其邻域是与该节点直接连接的其他节点列表。对于内置网络的普通用途——即仅将网络用于传输——我们期望用户仅与这些这些静态变量中的信息进行交互。\n\
  \n静态变量之后，`Network` 类包含了实例变量，用于存储与巫师在运行时可能创建任何新网络相关的信息（假设他们有权这样做）。这些实例变量是 `networkAddresses`、`networkLocations`、`networkNodesHash`、`neighborhoods`\
  \ 和 `networkLinks`。\n\n在定义了上述静态和实例变量后，`Network` 类的定义包含了以下两个方法的实现：\n\n```\ninitializeBuiltInNetworkNodes()\n\
  initializeBuiltInNetwork()\n```\n\n调用第一个方法只是为每个地址创建一个 `Node` 实例，而调用第二个方法则根据根据第一个调用输出的\
  \ `Node` 实例实际创建一个网络。`Node` 类在[第 11.9 节]中介绍。网络创建的一个重要方面是用于决定哪些节点直接连接以及为这些直接连接分配距离值的随机性。在解释如何引入这种随机性之前，请注意，当两个\
  \ `Node` 实例之间建立直接连接时，我们说它们之间存在 `Link`。`Link` 类也定义在[第 11.9 节]中。\n\n关于如何在网络连接中引入随机性，让我们检查\
  \ `initializeBuiltInNetwork()` 方法定义代码：我们在 `for` 循环中访问每个 `Node` 实例，站在每个节点上，逐一检查所有其他\
  \ `Node` 实例，以决定是否应该从我们所在的位置向该节点构建直接链接。该决定是通过投掷一个加权硬币的，硬币正面的概率为 `p`，反面的概率为 `1 - p`。如果我们看到正面，就连接，否则不连接。在计算机代码中，投掷加权硬币可以通过启动一个伪随机数生成器来模拟，该生成器产生\
  \ 0 到 1 之间均匀分布的实数。如果伪随机数生成器产生的数字小于 `p`，我们可以解释为加权硬币以概率 `p` 显示出正面。调用 `initializeBuiltInNetwork()`\
  \ 还为这些链接分配了距离。在下面所示的实现中，这些距离是 0 到 100 之间的随机数。\n\n由于巫师可能希望查看整个破罗网（Floo network）的地图，`Network`\
  \ 类必须提供这样一个方法。内置网络可以通过静态方法 `displayNetwork()` 和 `displayNeighborhoods()` 进行查看。这两个方法以两种不同但互补的方式显示网络。第一个方法\
  \ `displayNetwork()` 分别显示每条直接链接，列出起始 `Node`、结束 `Node` 以及它们之间的距离。另一方面，`displayNeighborhoods()`\
  \ 一次显示一个邻域。如之前所述，一个邻域由一个 `Node` 以及所有直接连接到该节点的其他 `Node` 实例组成。当你能直接看到由第二种显示方式产生的邻域时，更容易感知\
  \ `Node` 实例处的局部连接性。\n\n不言而喻的是，`Network` 类最重要的功能是在给定的起始 `Node` 和给定的目的地 `Node` 之间创建路由。为了这一目的，该类包含了静态方法\
  \ `findShortestPath()`，用于寻找内置网络任意两个 `Node` 实例之间的最短路径。新创建网络的相同功能由实例方法 `findShortestPath2()`\
  \ 提供。这两个方法基本上都使用相同的代码来实现 Dijkstra 算法，用以寻找图中的最短路径。尽管如此，我们选择将它们分开，以便读者更容易按照[第 11.12\
  \ 节]“玩转代码”中指示的方向扩展演示代码。\n\n到目前为止，我们的讨论大部分是关于专门处理内置网络的静态方法。该类的最后一部分包含了实例方法，用于处理通过创建\
  \ `Network` 类的新实例而可以创建的新网络。网络初始化例的实例版本之所以不同，是因为在输入实例化新网络所需的所有信息时存在困难性。\n\n```\n\
