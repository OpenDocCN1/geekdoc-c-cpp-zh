  \ hook）。对于简单的类，钩子本身可能只具有非常简单的实现。然而，对于涉及其他类组合的复杂类，钩子会变得更加复杂。\n\n## 24.2 意图与适用性\n\n\
  访问者模式的意图是提供一种机制，允许在不对类层次结构进行实质修改的情况下，将额外的功能与类层次结构关联。\n\n在以下情况下，你应该考虑使用这种模式：\n\n\
  *   你的客户端在不同的应用程序中使用你的软件，希望从你的类中获得额外的、特定应用程序的功能；\n*   如果你在源代码中添加客户端所需的所有不同类型的特定应用程序功能，你的代码将变得不可维护；\n\
  *   你或你的客户端愿意在适当的访问者类中编码额外功能（使用访问者类将使添加的功能保持在原始代码之外）；\n*   你愿意在编写源代码时将其包含 `accept`\
  \ 钩子。\n\n## 24.3 访问者模式简介\n\n假设你创建了一个类层次结构并将其提供给客户端。随后，你收到了客户端关于该层次结构的某些额外功能的请求。通常情况下，增强软件功能需要为类赋予新方法。显然，解决该问题的直接方法是修改原始源代码。\n\
  \n然而，通过访问者模式，你有了另一种选择。如果你在编写原始层次结构时已经包含了 `accept()` “钩子”，那么你可能可以使用访问者模式从外部为你的类整合额外功能（可以说），而无需对原始源代码进行任何实质性的修改。当然，敏锐的读者会问：如果你在编写原始类时没有包含\
  \ `accept()` 钩子怎么办？取决于你的应用程序，这可能不是问题，因为你总是可以从原始类派生，并在子类中包含 `accept()` 钩子。此类子类的定义将是微不足道的，因为它们只需要定义\
  \ `accept()` 方法调用即可。\n\n必须放置在原始类层次结构（或派自原始类的子类）中的 `accept()` 钩子，其参数接收一个通常被称为 `Visitor`\
  \ 的类实例。新所需的行为将通过 `accept()` 钩子中的代码与 `Visitor` 类实现中的代码相结合提供，正如我们在本章的演示所示。这些在不对其实现进行重大修改的情况下被赋予新行为的类，在访问者模式的介绍中通常被称为\
  \ `Element` 类。\n\n为了进一步说明，假设我们需要一个工具，可以打印出 `Element` 类层次结构中给定类构造的实例的某个私有属性的值。我们假设该属性位于类的私有区域且无法直接显示，尽管层次结构中的类提供了访问此类属性的\
  \ `get` 方法——`get` 方法只需要获取部分信息，而不需要同时打印它。假设你编写的原始 `Element` 类包含了如下方法：\n\n```\n public\
  \ void accept(Visitor visitor) {\n    visitor.visit(this);\n}\n```\n\n那么你就可以在 `Visitor`\
  \ 类中提供所需的打印功能，而无需更改原始类。对于你所希望的新行为是针对一个其他类组合的复杂类的情况，你可能需要在原始源代码中放置的 `accept()` 钩子可能如下：\n\
  \n```\n public void accept(Visitor visitor) {\n    Iterator<Obliviator> it1 = some_collection.iterator();\n\
  \    while (it1.hasNext()) {\n        visitor.visit( it1.next() );\n    }\n    //\
  \ 更多代码\n}\n```\n\n显然，只有当集合中涉及的所有类都适合基于访问者的新行为提取时，上述显示的代码片段才会产生预期的结果。\n\n正如你可能从上述代码片段中推断出的那样，`accept(Visitor)`\
  \ 钩子允许一个 `Visitor` 实例在运行时“注入”到 `Element` 实例中。这种“注入”返回的内容取决于 `visitor.visit(arg)`\
  \ 方法的实现方式。如果你希望通过访问者模式为类创建的新行为涉及类的实例变量（这很可能是可能的），那么 `Visitor` 实例需要从外部访问这些变量。如果这些实例变量恰好位于类的私有区域，且你没有为该类配备用于检索其值的\
  \ `get` 方法，那么在类中整合 `accept(Visitor)` 钩子可能并不是一个很有用的做法。\n\n至于在 `accept(Visitor)` 钩子中使用的\
  \ `Visitor` 实例，通常会构建一个 `Visitor` 层次结构，其根节点可能是一个抽象类，例如：\n\n```\n public interface\
  \ Visitor {\n    void visit(....);\n    void visit(....);\n    ....\n}\n```\n\n\n\
  \n\n访问者模式（Visitor pattern）已成为在现代编译器面向对象的词法分析器/解析器生成器产生的类系统中嵌入“外部功能”的一种方式。此类生成器的两个知名例子是\
  \ JavaCC（Java 编译器）和 ANTLR（另一种语言识别工具）。如之前在第 16 章中提到的，词法分析生成器的目标是创建一个名为 `lexer` 的可执行程序，该程序基于你对输入文件中单个字符分组为令牌（tokens）的规则的高级描述。当你将这样构建的词法分析器应用于输入文件时，它将输出从该文件中提取的令牌流。与此，再次如之前在第\
  \ 16 章中提到的，解析器生成器的目标是创建另一个名为 `parser` 的可执行代码，它可以将用户指定的文法规则应用于词法分析器输出的令牌。在所有现代编译器中，词法分析器通常使用正则表达式对输入进行词法分析，而解析器通常基于上下文无关文法。\n\
  \n如第 16 章所示，解析输入的最终结果是一棵语法树，其非叶节点对应于各种语法类别，其叶节点对应于词法分析器从输入中提取的不同令牌。如果你的目标仅限于确定给定输入是否根据文法规则构成合法结构，那么对输入进行成功解析就足以建立这一点。然而，我们经常需要不仅仅是建立输入的文法正确性。我们可能还需要扫描语法树，并根据该节点代表输入的哪个部分在每个节点上采取某些操作。\n\
  \n这正是访问者模式大显身手的地方。如果解析器生成器输出解析器类的方式使得它们都包含了 `accept(Visitor visitor)` 钩子，那么人们随后就可以在不修改解析器类的情况下，对语法树进行各种类型的分析。这正是开源工具\
  \ JTB（Java Tree Builder）所完成的工作。JTB 输出的访问者类是泛型化的，因为它们允许你访问语法树的每个节点，而无需在节点上执行任何操作。通过重写自动生成的访问者类，你可以以多种实用的方式操纵语法树，这些方法的范围从仅对树进行美化打印，到在节点处搜索特定语法类别的信息。\n\
  \n## 24.5 用哈利·波特的故事说明访问者模式\n\n读者可能记得我们在第 9 章中对组合模式（Composite pattern）的介绍，魔法部被分为几个部门，每个部门都有一个官方指定的部门主管。这些部门包括魔法法律执法部、魔法事故与灾难部、魔法交通部等。若干部门进一步细分为办公室。例如，魔法法律执法部包含傲地者办公室、非法施用魔法办公室等。\n\
  \n我们对访问者模式的演示将使用我们在第 9 章中为演示组合模式而创建的类层次结构的修改版（且也是简化版）。该层次结构之所以有趣，是因为 `MinisterForMagic`\
  \ 类相对于层次结构中的其他类具有复杂性。由于魔法部长本身是一个 `Wizard`（巫师），但他监管着魔法部工作的各种 `Wizard`，因此我们将 `MinisterForMagic`\
  \ 类表示为对在魔法部工作的其他巫师的组合对象。为了方便读者阅读，第 9 章中的类层次结构再次在图 24.2 中显示，它涉及以下 `Wizard` 类：`Obliviator`（遗忘妖）、`DepartmentHead`（部门主管）和\
  \ `Auror`（傲地者）。\n\n![image](img/c24f002.gif)\n\n**图 24.2**\n\n第 9 章中组合模式演示的一个重要特性是，我们在根类\
  \ `Wizard` 本身中定义了层次结构中*所有*类的功能，包括更复杂的 `MinisterForMagic` 类。该 `Wizard` 类被赋予了演示组合模式所需的行为。然而，从我们本章的需求来看，第\
  \ 9 章中 `Wizard` 类*不具备*的两个行为是：\n\n1. 一个打印在魔法部工作的巫师名字的方法。对于单个巫师来说，就是该巫师的名字。但对于一个更复杂的对象，例如从\
  \ `MinisterForMagic` 类构建的类，我们可能希望该方法*也*打印出所有向部长汇报的巫师的名字。考虑到——如读者从第 9 章中所记得的——`Wizard`\
  \ 类都是为了模拟个人所扮演的角色而非个人本身，当在 `MinisterForMagic` 的实例上调用打印工具时，想要打印出所有向部长汇报的巫师的名字似乎是合理的做法。在任何情况下，此类工具的代码都展示了当它作为类定义的一部分时，如何从组合成员中获取信息。\n\
  \n2. 一个打印巫师在霍格沃茨入学时被分配的学院名称的方法。\n\n我们本章演示的目标是通过访问者模式为 `Wizard` 层次结构提供两个额外的行为。\n\n\
  ## 24.6 模式演示的顶层视图\n\n访问者模式要求我们在图 24.2 中所示的所有类中放置 `accept(Visitor)` 钩子，然后定义一组具体的\
  \ `Visitor` 类，通过这些钩子来检查图 24.2 中类的实例。为了符合访问者模式的一般实现方式，我们首先定义一个仅包含以下语句的 `Element`\
  \ 接口来为层次结构赋予钩子：\n\n```\npublic interface Element {\n  void accept(Visitor visitor);\n\
  }\n```\n\n然后如图 24.3 所示，将整个层次结构挂在这个接口下。这迫使每个挂在 `Element` 根节点上的具体类都实现 `accept(Visitor)`\
  \ 钩子。对于简单类，这种实现可能看起来如下：\n\n```\npublic void accept(Visitor visitor) {\n  visitor.visit(this);\n\
  }\n```\n\n对于更复杂的类，实现显然会更复杂，例如我们案例中的 `MinisterForMagic` 类。\n\n![image](img/c24f003.gif)\n\
  \n**图 24.3**\n\n加上访问者类后，我们演示的整体类图如图图 24.4 所示。如图所示，我们使用了 `Visitor` 接口的不同具体扩展。*这样做是为了演示集成在\
  \ `Wizard` 类层次结构中的 `accept(Visitor)` 钩子是非常通用的，可以与任意 `Visitor` 实例一起，只要这些实例是从实现 `Visitor`\
  \ 接口的类构造的，并且具体 `Visitor` 类中的实现代码访问了 `Element` 类层次结构通过其“get”或其他此类方法公开的信息。我们使用的两个具体的访问者类命名为：\n\
  \n![image](img/c24f004.gif)\n\n**图 24.4**\n\n\n\n\n```\n VisitorForPrintingWizardNames\n\
  \    VisitorForPrintingHouseNames\n```\n\n第一个是 `VisitorForPrintingWizardNames`，它用于打印巫师的名字；第二个是\
  \ `VisitorForPrintingHouseNames`，用于打印这些巫师在霍格沃茨学校期间所属的学院院名称。\n\n这里需要理解的关键在于，每个 `Element`\
  \ 类中的 `accept(Visitor visitor)` 钩子是如何与具体 `Visitor` 类中的功能协同工作的。最终结果是：提供给 `accept()`\
  \ 方法的 `Visitor` 实例会从 `Element` 实例中激发出所需的新功能。\n\n## 24.7 Visitor 接口\n\n`Visitor`\
  \ 接口声明了一组方法，由实现该接口的具体 `Visitor` 类来实现这些方法。通常，这组方法包括为 `Element` 层次结构中的每个类提供的 `visit()`\
  \ 方法。这使得每个具体的 `Element` 类都允许 `Visitor` 实例通过 `accept(Visitor)` 钩子访问其公共内部，在最简单的情况下，这些钩子的实现方式如下：\n\
  \n```java\n public void accept(Visitor visitor) {\n    visitor.visit(this);\n}\n\
  ```\n\n在运行时，语句 `visitor.visit(this)` 会调用 `Element` 类实例上相应的 `visit()` 版本。\n\n* *\
  \ *\n\n```java\n public interface Visitor {\n    void visit(Auror element);\n  \
  \  void visit(DepartmentHead element);\n    void visit(Obliviator element);\n  \
  \  void visit(MinisterForMagic element);\n}\n```\n\n* * *\n\n## 24.8 Visitor 接口的两个具体实现\n\
  \n`Visitor` 接口要求实现该接口的类为 `Element` 层次结构中的每个类提供 `visit()` 方法的代码。这样一来，当我们在运行时通过 `accept(Visitor)`\
  \ 钩子将 `Visitor` 实例注入到 `Element` 类实例中时，我们可以在注入的 `Visitor` 实例上调用如 `visit(this)` 的方法，从而从该\
  \ `Element` 实例中激发我们想要的行为。\n\n下面显示了获取巫师真实名字的 `visit()` 方法。关于将参数 `element` 作为字符串直接通过\
  \ `System.out.println()` 打印（或与其他字符串拼接后打印），这里有一个隐含的假设：`Wizard` 类都已实现 `toString()`\
  \ 方法，当上下文需要巫师实例的字符串值时，该方法会返回该巫师的名字。\n\n* * *\n\n```java\n public class VisitorForPrintingWizardNames\
  \ implements Visitor {\n\n    public void visit(Auror element) {\n        System.out.println(element);\n\
  \    }\n    public void visit(Obliviator element) {\n        System.out.println(element);\n\
  \    }\n    public void visit(DepartmentHead element) {\n        System.out.println(element);\n\
  \    }\n    public void visit(MinisterForMagic element) {\n        System.out.println(\"\
  \ Minister for Magic: \" + element);\n    }\n}\n```\n\n* * *\n\n如前所述，本章中的代码旨在强调这一点：在类层次结构整合了\
  \ `accept(Visitor)` 通用钩子后，之后可以通过创建相应的 `Visitor` 类从这些类中激发任何新行为。为此，我们上面展示的是一个试图打印巫师名字的具体\
  \ `Visitor` 类。接下来我们展示另一个具体的 `Visitor` 类，这次用于打印巫师在霍格沃茨入学期间被分配的学院名称。\n\n* * *\n\n\
  ```java\n public class VisitorForPrintingHouseNames implements Visitor {\n    public\
  \ void visit(Auror element) {\n        System.out.println( \" House assigned to\
  \ \" + element\n                + \" : \" + element.getHouseAssigned() );\n    }\n\
  \    public void visit(Obliviator element) {\n        System.out.println( \" House\
  \ assigned to \" + element\n                + \" : \" + element.getHouseAssigned()\
  \ );\n    }\n    public void visit(DepartmentHead element) {\n        System.out.println(\
  \ \" House assigned to \" + element\n                + \" : \" + element.getHouseAssigned()\
  \ );\n    }\n    public void visit(MinisterForMagic element) {\n        System.out.println(\
  \ \" House assigned to \" + element\n                + \" : \" + element.getHouseAssigned()\
  \ );\n    }\n}\n```\n\n* * *\n\n## 24.9 使用组合模式重新实现 Visitor 层次结构\n\n除了简化 `Wizard`\
  \ 层次结构外，我们还将该层次结构“挂载”在下面定义的名为 `Element` 的新接口上。将 `Element` 接口适配到 `Wizard` 的主要目的是：它强制层次结构中的所有类都必须为\
  \ `accept()` 方法提供实现。\n\n```java\n public interface Element {\n    void visit(Visitor\
  \ visitor);\n}\n```\n\n实现此接口后，层次结构对 `Visitor` 对象开放。\n\n在下面所示 `Wizard` 类的新定义中，读者会注意到，尽管实现了\
  \ `Element` 接口，但该类并没有为 `accept(Visitor)` 钩子提供实现。这是因为 `Wizard` 类是抽象的。由于我们的演示只需要专门的巫师——追捕者、遗忘者、魔法部长等等——我们没有特别需要将\
  \ `Wizard` 成为具体类。\n\n遵循组合模式的“规则”，下面所示 `Wizard` 类提供了任何 `Wizard` 实例都预期的所有功能，无论是 `Auror`、`DepartmentHead`\
  \ 还是 `MinisterForMagic`。同时，根据组合模式，对于只适用于子类 `MinisterForMagic` 的功能，它提供了实现，其默认行为是抛出\
  \ `UnauthorizedAccessException` 异常。\n\n```java\npublic abstract class Wizard implements\
  \ Element {\n    private String firstName;\n    private String lastName;\n    private\
  \ String houseAssigned = \"Unknown\";\n\n    public Wizard(String firstName, String\
  \ lastName) {\n        this.firstName = firstName;\n        this.lastName = lastName;\n\
  \    }\n\n    public String getHouseAssigned() {\n        return houseAssigned;\n\
  \    }\n\n    public void setHouseAssigned(String houseAssigned) {\n        this.houseAssigned\
  \ = houseAssigned;\n    }\n\n    @Override\n    public String toString() {\n   \
  \     return firstName + \" \" + lastName;\n    }\n\n    @Override\n    public abstract\
  \ void accept(Visitor visitor);\n}\n```\n\n\n\n\n\n```java\n public abstract class\
  \ Wizard implements Element {\n\n\tprivate String firstName;\n\tprivate String lastName;\n\
  \tprivate String houseAssigned = \"Unknown\";\n\n\tpublic Wizard( String fname,\
  \ String lname ) {\n\t\tfirstName = fname; lastName = lname;\n\t}\n\n\tpublic String\
  \ toString() { return firstName + \" \" + lastName; }\n\n\tpublic String getHouseAssigned()\
  \ { return houseAssigned; }\n\tpublic void setHouseAssigned( String house ) {\n\t\
  \thouseAssigned = house;\n\t}\n\tpublic void appointWizardAsObliviator(Wizard w)\n\
  \               throws UnauthorizedAccessException {\n\t\tthrow new UnauthorizedAccessException(\
  \ \"Only the minister \"\n\t\t\t\t+ \"for magic can appoint a wizard as obliviator\"\
  \ );\n\t}\n\tpublic void appointWizardAsAuror(Wizard w)\n               throws UnauthorizedAccessException\
  \ {\n\t\tthrow new UnauthorizedAccessException( \"Only the minister \"\n\t\t\t\t\
  + \"for magic can appoint a wizard as auror\" );\n\t}\n\tpublic void appointDepartmentHead(Wizard\
  \ w)\n\t\tthrows UnauthorizedAccessException {\n\t\t\tthrow new UnauthorizedAccessException(\
  \ \"Only the minister \"\n\t\t\t\t+ \"for magic can appoint a dept head\" );\n\t\
  }\n\tpublic void listEmployeesWorkingAtMinistry()\n\t\tthrows UnauthorizedAccessException\
  \ {\n\t\tthrow new UnauthorizedAccessException( \"This method can only \"\n\t\t\t\
  + \"be called on an instance of MinsterForMagic\" );\n\t}\n}\n```\n\n* * *\n\n这带我们进入了抽象类\
  \ `Wizard` 的四个扩展中的第一个——`Auror` 类。正如上面所示的 `Wizard` 类版本相对于组合模式（Composite pattern）中相同类的情况，下面所示的\
  \ `Auror` 类是第 9 章中介绍的相同类的更简化版本。这里 `Auror` 的简单性显然是我们在演示中使用的 `Wizard` 抽象类简单性的直接结果。由于我们这里的重点重点是钩子方法\
  \ `accept(Visitor)` 如何在 `Element` 层次结构中的每个具体类中实现，因此下面所示的 `Auror` 类只是对上述 `Wizard`\
  \ 类的微小扩展。除了构造函数外，我们在该类中放置的所有内容都是通过 `Wizard` 类继承自 `Element` 接口的 `accept(Visitor)`\
  \ 钩子的强制实现。请注意，该钩子的实现仅仅调用了 `Visitor` 对象的 `visit()` 方法，并将调用 `accept()` 的 `Auror` 类实例作为其唯一参数传递给该方法。这显然假设\
  \ `Visitor` 对象提供了一个名为 `visit()` 方法的代码，其参数类型为 `Auror`。\n\n* * *\n\n```java\n public\
  \ class Auror extends Wizard {\n\tpublic Auror( String firstname, String lastname\
  \ ) {\n\t\tsuper( firstname, lastname );\n\t}\n\tpublic void accept(Visitor visitor)\
  \ {\n\t\tvisitor.visit(this);\n\t}\n}\n```\n\n* * *\n\n接下来我们展示了抽象类 `Wizard` 的四个扩展中的第二个——`DepartmentHead`\
  \ 类。与 `Auror` 类一样，下面所示的 `DepartmentHead` 类是第 9 章中介绍的相同类的更简化版本。与 `Auror` Parallel，我们对\
  \ `DepartmentHead` 的实现是演示访问者模式所能达到的最小。与 `Auror` 一样，这里唯一注意的是，该类为通过 `Wizard` 类从 `Element`\
  \ 接口继承的钩子方法 `accept(Visitor)` 提供了实现。\n\n* * *\n\n```java\n public class DepartmentHead\
  \ extends Wizard {\n\n\tprivate String nameOfDepartment;\n\n\tpublic DepartmentHead(\
  \ String firstname, String lastname,\n\t\t\t\tString deptName ) {\n\t\tsuper( firstname,\
  \ lastname );\n\t\tnameOfDepartment = deptName;\n\t}\n\tpublic String getDepartment()\
  \ { return nameOfDepartment; }\n\tpublic void accept(Visitor visitor) {\n\t\tvisitor.visit(this);\n\
  \t}\n}\n```\n\n* * *\n\n这带我们来到了 `Wizard` 的四个扩展中的第三个——`Obliviator` 类。与 `Auror` 和\
  \ `DepartmentHead` 一样，除了构造函数外，我们在该类中放置的都是通过 `Wizard` 类继承自 `Element` 接口的 `accept(Visitor)`\
  \ 钩子的实现。\n\n* * *\n\n```java\n public class Obliviator extends Wizard {\n\n\tpublic\
  \ Obliviator( String firstname, String lastname ) {\n\t\tsuper( firstname, lastname\
  \ );\n\t}\n\tpublic void accept(Visitor visitor) {\n\t\tvisitor.visit(this);\n\t\
  }\n}\n```\n\n* * *\n\n我们现在准备展示 `Wizard` 层次结构中最复杂的类——`MinisterForMagic` 类。正如读者所，在\
  \ `Wizard` 层次结构中，`MinisterForMagic` 类是特殊的，因为它虽然也是一个 `Wizard` 类，但它是另外三个类：`Auror`、`DepartmentHead`\
  \ 和 `Obliviator` 的组合。我们在这里展示的 `MinisterForMagic` 类实现是第 9 章中之前介绍的相同类的简化版本，因为我们这里的目标只是关注访问者模式的工作原理。\n\
  \n`MinisterForMagic` 是其他类的组合这一事实使得 `accept(Visitor)` 的实现稍微复杂一些。现在`accept(Visitor)`\
  \ 必须传播到 `MinisterForMagic` 实例所包含的组合元素。例如，考虑 `VisitorForPrintingNames` 类的目的。这个 `Visitor`\
  \ 类试图打印出通过钩子 `accept(Visitor)` 要求操作的所有巫师的名字。当我们要求 `VisitorForPrintingNames` 实例在\
  \ `MinisterForMagic` 实例上执行其工作时，我们需要将此 `Visitor` 实例传递给与 `MinisterForMagic` 实例关联的\
  \ `Wizard` 实例。这就是读者在下面所示的实现中看到的。\n\n除了与访问者相关的方面外，下面所示的 `MinisterForMagic` 实现强制了只能有一个魔法部长的事实。正如在组合模式中所解释的那样，这是通过使用单例模式（Singleton\
  \ pattern）实现的。单例模式要求将类的构造函数放在类的私有区域，并通过命名如 `makeInstanceOfMinisterForMagic()` 的静态方法提供实例构造机制。该方法中的逻辑确保了私有构造函数只被调用一次——在我们第一次调用\
  \ `makeInstanceOfMinisterForMagic()` 方法时。随后，将提供之前构造的 `MinisterForMagic` 副本。\n\n\
  另外注意，对于我们的简单演示，我们为 `MinisterForMagic` 类仅提供了为遗忘者、食人取者和部门主管等重要职位任命巫师的方法。为了测试访问者模式逻辑，该类还包含一个列出魔法部长雇佣的所有巫师的方法。\n\
  \n```java\n public class MinisterForMagic extends Wizard {\n\n\tprivate List<Wizard>\
  \ obliviators = new ArrayList<>();\n\tprivate List<Wizard> aurors = new ArrayList<>();\n\
  \tprivate List<Wizard> departmentHeads = new ArrayList<>();\n\n\tprivate static\
  \ MinisterForMagic instance;\n\n\tprivate MinisterForMagic( String firstname, String\
  \ lastname ) {\n\t\tsuper( firstname, lastname );\n\t}\n\n\tpublic static MinisterForMagic\
  \ makeInstanceOfMinisterForMagic( String firstname, String lastname ) {\n\t\tif(instance\
  \ == null ) {\n\t\t\tinstance = new MinisterForMagic( firstname, lastname );\n\t\
  \t}\n\t\treturn instance;\n\t}\n\n\tpublic void addAuror( Wizard w ) {\n\t\tobliviators.add(w);\n\
  \t}\n\n\tpublic List<Wizard> getAllWizards() {\n\t\tList<Wizard> allWizards = new\
  \ ArrayList<>();\n\t\tallWizards.addAll(obliviators);\n\t\tallWizards.addAll(aurors);\n\
  \t\tallWizards.addAll(departmentHeads);\n\t\treturn allWizards;\n\t}\n\n\tpublic\
  \ void accept(Visitor visitor) {\n\t\tvisitor.visit(this);\n\t\tfor ( Wizard w :\
  \ getAllWizards() ) {\n\t\t\tw.accept(visitor);\n\t\t}\n\t}\n}\n```\n\n\n\n\n\n\
  ```java\n import java.util.*;\n\npublic class MinisterForMagic extends Wizard {\n\
