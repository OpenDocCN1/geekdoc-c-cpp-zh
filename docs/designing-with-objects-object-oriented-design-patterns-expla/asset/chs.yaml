  \tprivate static MinisterForMagic theMinister;\n\n\t// 注意：此构造函数是私有的，因为我们想要确保\n\t\
  // 不可能构造出多个魔法\n\t// 部（Minister for Magic）\n\tprivate MinisterForMagic( String firstname,\
  \ String lastname ) {\n\t\tsuper( firstname, lastname );\n\t}\n\n\tpublic static\
