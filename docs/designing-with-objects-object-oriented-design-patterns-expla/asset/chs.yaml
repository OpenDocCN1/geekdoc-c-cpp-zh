  \ \"Error: \" + e );\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\n\t//////////////// 内部类 LinkFromDarkLord\
  \ //\n\tpublic class LinkFromDarkLord extends Thread {\n\t\tprivate BufferedReader\
