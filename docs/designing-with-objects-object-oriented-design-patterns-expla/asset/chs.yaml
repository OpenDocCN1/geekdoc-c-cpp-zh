  \  魔法部大厅\n*   格姆尔德广场 12 号\n\n\n\n\n为了让我们能够对网络中尝试不同的连接模式，我们将为任意两个节点之间的直接连接分配一个概率。因此，当你执行此演示代码时，你最终获得的特定网络将取决于随机性，这将在稍后进行解释（4）。\n\
  \n关于 `Facade` 类，在抽象根类 `Facade` 中定义的基本功能将允许魔法世界中的所有人通过内置网络进行旅行。专为成年巫师设计的额外功能（通过 `WizardFacade`\
  \ 类提供）将包括：允许巫师查询网络以其旅行将经过的路线，并查询网络某个特定地点（可能被敌人占据）是否在路线上。除了这两个功能外，`WarlockFacade`\
  \ 类还允许流火网管理局的巫师幻化出新的流火网。\n\n如果你想查看内置的流火网网络，可以通过调用 `Facade` 类的方法 `displayBuiltinFlooNetwork()`\
  \ 来。它将产生如下所示的显示内容：\n\n```\n  网络中的节点总数: 8\n```\n\n```\n  正在显示网络:\n```\n\n```\n  网络中的直接连接数:\
  \ 15\n```\n\n```\n  直接连接: 对角巷 <=> 黑格魔法防御术教授办公室: 18\n  直接连接: 对角巷 <=> 韦斯莱家: 62\n  直接连接:\
  \ 翻墙者巷 <=> 格利芬多公共区域: 36\n  ....\n  ....\n```\n\n```\n  正在显示网络中的区域:\n```\n\n```\n\
    格利芬多公共区域: [翻墙者巷, 黑格魔法防御术教授办公室,\n     魔法部大厅, 布姆尔德广场 12 号]\n```\n\n```\n  布姆尔德广场\
  \ 12 号: [翻墙者巷, 格利芬多公共区域,\n 黑格魔法防御术教授办公室, 多德洛斯·姆布里奇办公室, 韦斯莱家]\n  ....\n  ....\n```\n\
  \n此显示的第一部分显示了网络中的各个链接，每条链接都是地点对之间的直接连接。以这种方式显示的每个直接连接还显示了该连接两个端点之间的距离。显示的第二部分显示了每个地点周围的区域。例如，由于格利芬多公共区域直接连接到翻墙者巷、黑格魔法防御术教授办公室、魔法部大厅和布姆尔德广场\
