  \ \" : + lexem; }\n```\n\n这段代码段必须输入以下由 JavaCC 自动生成的语法树叶节点类中：^14\n\n```\nASTNoun.java\n\
  ASTVerb.java\nASTAdjective.java\nASTPronoun.java\nASTPreposition.java\n```\n\n##\
  \ 16.8 Driver 类\n\n如前所述，`Driver` 类必须同时履行两个重要角色：(1) 它必须首先实例化解析器（在演示中由 `Parser` 类表示），然后对包含魔法语言的文件调用解析器。在这个角色中，我们还期望\
  \ `Driver` 对魔法语言文件中的每个句子进行格式打印。(2) 它必须调用一个用于魔法语言转普通语言的指定方法。该方法在 `Driver` 类定义中的名称为\
  \ `processForInterpretation()`。\n\n\n\n\n为了解释接下来的类定义，让我们从它的四个静态变量开始。变量 `interpretedSentence`\
  \ 用于存储魔法语言（magic-speak）句子的解释后版本。因此，当一个文件包含多个魔法语言句子时，随着文件中的句子被翻译成麻语语（muggle-speak），该变量的字符串值将随之改变。静态变量\
  \ `offset` 用于解释后句子的格式化打印。静态变量 `savedNounContext` 和 `savedVerbContext` 存储了单个单词解释的上下文信息。如前所述，单词不能脱离其他单词孤立地解释。当解释器沿着语法树向下演进时，`savedNounContext`\
  \ 和 `savedVerbContext` 变量持有适用于短语中每个单词的更高级别的短语级信息。随后，单词翻译将在考虑每个单词对应的上下文短语的情况下进行。以这种方式使用上下文是解释器器模式（Interpreter\
  \ pattern）的一个重要方面。\n\n至于 `main()` 内部的局部变量，变量 `inputStream` 绑定到包含魔法语言的文件上。该文件的文件名作为命令行参数传递给\
  \ `Driver` 类。变量 `parser` 持有对 `Parser` 类实例的引用。为了构造 `Parser` 实例，我们向 `Parser` 构造函数提供附加到魔法语言文件的\
  \ `inputStream` 引用。通过在解析器实例上调用顶层解析方法 `MagicalSpeech()`，我们解析了魔法语言文件中的所有句子。随后，我们通过将所有句子的复合树的根节点传递给\
  \ `ShowSyntaxTree` 实例，显示这些句子的语法树。\n\n这引出了对解析器构建的语法树进行解释——这也是本次演示的意义所在（raison d’etre）。如前所述，调用\
  \ `Driver` 的方法 `processForInterpretation()` 并传入语法树根节点作为参数，导致了魔法语言句子到麻语语句子的翻译。\n\n\
  如果你查看 `processForInterpretation()` 方法的代码，你会发现该方法递归地向下语法树演进。你最初在树的根节点上调用此方法；然后它会在根节点的子节点上递归地调用自己，以此此类推。注意看在根节点的直接子节点处，`processForInterpretation()`\
  \ 构建了一个 `Interpreter Sentence` 的新实例。由于我们的解析器可以处理文件中多个由句号分隔的句子，为此，它为每个新句子在解析树中创建一个新的\
  \ `Statement` 节点。在语法树中，`Statement` 节点的子节点对应于句子的名词短语-动词短语分解。因此，随后的 `if` 条件判断寻找 `NounPhrase`\
  \ 和 `VerbPhrase` 节点，当找到这些节点时，`processForInterpretation()` 将 `saveNounContext` 和\
  \ `saveVerbContext` 设置为语法树中这些非终止节点的总字符串值。我们所说的字符串值是指悬挂在对应非终止节点的子树上的实际终端字符串。这些字符串值是通过调用\
  \ `getStringValue()` 方法获取的。\n\n随着 `processForInterpretation()` 继续向下语法树演进，它最终会遇到树的终端节点——这些节点对应于句子中的名词、动词、形容词等。当遇到此类节点时，`processForInterpretation()`\
  \ 要求在句子根节点处构建的 `Interpreter_Sentence` 实例也构建实际解释类的实例，如 `Interpreter_Noun`、`Interpreter_Verb`\
  \ 和 `Interpreter_Adjective`。这些请求将适用的上下文作为 `constructXXXNode()` 方法的参数。\n\n***\n\n\
  ```java\n import java.io.*;\n\npublic class Driver {\n\n\tstatic String interpretedSentence\
  \ = \"\";\n\tstatic String offset = \"\";\n\tstatic String savedNounContext = \"\
  \";\n\tstatic String savedVerbContext = \"\";\n\n\tpublic static void main(String\
  \ args[]) {\n\t\tInputStreamReader inputStream = null;\n\n\t\ttry {\n\t\t\tif (args.length\
  \ == 1) {\n\t\t\t\tSystem.out.println(\"\\nReading from file \" + args[0]);\n\t\t\
  \t\tinputStream = new FileReader(args[0]);\n\t\t\t} else {\n\t\t\t\tSystem.out.println(\n\
  \t\t\t\t\"Usage: java Driver magic_phrases.txt\");\n\t\t\t\tSystem.exit(-1);\n\t\
  \t\t}\n\n\t\t\t// Construct parser instance for parsing the file with\n\t\t\t//\
  \ magic-speak:\n\t\t\tParser parser = new Parser(inputStream);\n\t\t\tASTMagicalSpeech\
  \ root = parser.MagicalSpeech();\n\t\t\tSystem.out.println(\n\t\t\t\"\\nMagical\
  \ speech parsed successfully.\");\n\n// Print an indented list of the AST nodes\n\
  \t\t\tShowSyntaxTree printer = new ShowSyntaxTree();\n\t\t\tprinter.print(root);\n\
  \n// Now process the AST for the interpretation of\n// magic-speak:\n\t\t\tprocessForInterpretation(root);\n\
  \t\t\tSystem.out.println( \"\\nInterpreted sentence(s):\\n\"\n+ interpretedSentence\
  \ );\n\t\t} catch (ParseException pe) {\n\t\t\tSystem.out.println(\"Main : \" +\
  \ pe.getMessage());\n\t\t} catch (java.io.FileNotFoundException fnfe) {\n\t\t\t\
  System.out.println(\"Main : \" + fnfe.getMessage());\n\t\t\tSystem.exit(0);\n\t\t\
  }\n\t}\n\n\tprivate static void processForInterpretation(Node node) {\n\t\tInterpreter_Sentence\
  \ st = new Interpreter_Sentence();\n\t\tif (node instanceof ASTStatement ) {\n\t\
  \t\tst = new Interpreter_Sentence();\n\t\t\tinterpretedSentence += \"\\n\";\n\t\t\
  } else if (node instanceof ASTNounPhrase ) {\n\t\t\tString nounContext = getStringValue(\
  \ node );\n\t\t\tsavedNounContext = nounContext;\n\t\t} else if (node instanceof\
  \ ASTVerbPhrase ) {\n\t\t\tString val = getStringValue( node );\n\t\t\tsavedVerbContext\
  \ = val;\n\t\t} else if (node instanceof ASTNoun ) {\n\t\t\tst.constructNounNode(\
  \ node.toString(), savedNounContext );\n\t\t\tinterpretedSentence += offset + st.interpretNoun()\
  \ + \"\\n\";\n\t\t} else if (node instanceof ASTVerb ) {\n\t\t\tst.constructVerbNode(\
  \ node.toString(), savedVerbContext );\n\t\t\tinterpretedSentence += offset + st.interpretVerb()\
  \ + \"\\n\";\n\t\t} else if (node instanceof ASTAdjective ) {\n\t\t\tst.constructAdjectiveNode(\
  \ node.toString(),\n\t\t\t\tsavedNounContext );\n\t\t\tinterpretedSentence += offset\n\
  \t\t\t\t+ st.interpretAdjective() + \"\\n\";\n\t\t} else {\n\t\t\tif ( node.toString().contains(\
  \ \":\")) {\n\t\t\t\tinterpretedSentence += offset + node + \"\\n\";\n\t\t\t}\n\t\
  \t}\n\t\tint count = node.jjtGetNumChildren();\n\t\toffset += offset;\n\t\tfor (int\
  \ i=0;i<count;i++) {\n\t\t\tNode child = node.jjtGetChild(i);\n\t\t\tprocessForInterpretation(child);\n\
  \t\t}\n\t}\n\n\tprivate static String getStringValue( Node node ) {\n\t\tString\
  \ val = \"\";\n\t\tint nn = node.jjtGetNumChildren();\n\t\tif (nn == 0) {\n\t\t\t\
  String str = node.toString();\n\t\t\tval += str.substring( 1+ str.indexOf( ':'’\
  \ )\n\t\t}\n\t\tfor (int i=0;i<nn;i++) {\n\t\t\tNode child = node.jjtGetChild(i);\n\
  \t\t\tval += getStringValue( child );\n\t\t}\n\t\treturn val;\n\t}\n}\n```\n\n##\
  \ 16.9 THE Interpreter Sentence CLASS\n\n根解释类 `Interpreter_Sentence` 有两个主要角色：一方面，它必须存储将魔法单词翻译成麻语单词所需的字典；另一方面，它必须作为\
  \ `Driver` 类可以调用的接口，用于解释魔法句子。下面所示的 `Interpreter_Sentence` 类包含了这两个角色的逻辑。\n\n\n\n\n\
  ### 解释概述\n\n关于 `Interpreter_Sentence` 类的第二个角色，请注意魔法语言中单个名词、动词和形容词的实际解释分别由 `Interpreter_Noun`、`Interpreter_Verb`\
  \ 和 `Interpreter_Adjective` 类执行，这些类都是根类 `Interpreter_Sentence` 的子类。但 `Driver` 类只能通过\
  \ `Interpreter_Sentence` 类提供的接口来访问这些更具体的解释器类。\n\n### Driver 的角色\n读者可能还记得我们对 `Driver`\
  \ 类的描述，它通过遍历解析器构建的语法树来履行其解释作用。当它遇到高级节点时（例如对应句子名词短语和动词短语部分的节点），它会将它们的字符串值作为上下文保存，这对于翻译叶子节点上的实际单词非常有帮助。当\
  \ `Driver` 遇到语法树的叶子节点时，它会使用相应的上下文将魔法语言名词、动词和形容词翻译成对应的魔法语言版本。\n\n### 动态解释\n由于魔法语言的解释是在\
  \ `Driver` 访问语法树的每个节点时动态进行的，因此下方类定义中实例变量 `mn`、`mv` 和 `ma` 的值将取决于 `Driver` 正在访问哪个叶子节点。当我们讨论为该类定义的方法时，这些实例变量扮演的角色将会变得清晰。\n\
  \n### 初始化与上下文\n在下方的代码中，在实例变量之后、方法定义之前，我们创建了一个名为 `trigger_words` 的集合，以及三个字典：`nounTranslator`、`verbTranslator`\
  \ 和 `adjectiveTranslator`。这里的思路是：名词、动词或形容词解释的上下文必须包含 `trigger_words` 集合中的至少一个单词。换句话说，如果某个魔法语言句子从麻瓜（muggle）接收的角度来看是无害的，我们就不进行修改。\n\
  \n尽管触发集和三个字典非常小，但它们足以传达本次演示的要点。显然，如果要在实际应用中实现这种模式，你需要大得多的触发集和三个字典。\n\n### 方法定义\n\
  这引出了类中的方法定义。回想 `Driver` 类的描述，当 `Driver` 遇到魔法语言句子的语法树叶子节点时，它会调用此处类的 `constructNounNode()`、`constructVerbNode()`\
  \ 和 `constructVerbNode()`（注：原文此处可能有笔误，应为 constructAdjectiveNode）方法。如下所示，这些方法分别构造名词、动词和形容词的相应解释类实例，同时为构造函数提供了从语法树高级节点收集的可用上下文。每个此类方法返回的实际\
  \ `Interpreter` 类实例存储在此处所示类的一个实例变量中。随后，当 `Driver` 需要解释结果时，它会调用类定义中的后三个方法之一，这些调用被翻译为该类实例变量的调用。\n\
  \n我们对 `Interpreter_Sentence` 的实现完全将 `Driver` 类与参与解释任务的实际类隔离开。因此，`Driver` 类只需要知道为下方类定义的方法。这是解释器模式的一个重要特征。\n\
  \n* *\n\n```java\nimport java.util.*;\n\npublic class Interpreter_Sentence {\n\n\
  \    private Interpreter_Noun mn;\n    private Interpreter_Verb mv;\n    private\
  \ Interpreter_Adjective ma;\n\n    static protected Set<String> trigger_words =\
  \ new HashSet<String>();\n    static protected Map<String,String> nounTranslator\
  \ =\n                new HashMap<String,String>();\n    static protected Map<String,String>\
  \ verbTranslator =\n                new HashMap<String,String>();\n    static protected\
  \ Map<String,String> adjectiveTranslator =\n                new HashMap<String,String>();\n\
  \    {\n        nounTranslator.put(\"wand\", \"finger\");\n        nounTranslator.put(\"\
  wizards\", \"people\");\n        nounTranslator.put(\"dementors\", \"greedy businessmen\"\
  );\n        nounTranslator.put(\"spell\", \"picture\");\n\n        verbTranslator.put(\"\
  cast\", \"show\");\n\n        adjectiveTranslator.put(\"magic\", \"little\");\n\
  \        adjectiveTranslator.put(\"dark\", \"ambitious\");\n        adjectiveTranslator.put(\"\
  wizarding\", \"trading\");\n\n        trigger_words.addAll( Arrays.asList(\"wizards\"\
  , \"wand\",\n                \"spell\", \"dementors\", \"wizarding\"));\n    }\n\
  \n    void constructNounNode(String str, String context) {\n        mn = new Interpreter_Noun(str,\
  \ context);\n    }\n\n    void constructVerbNode(String str, String context) {\n\
  \        mv = new Interpreter_Verb(str, context);\n    }\n\n    void constructAdjectiveNode(String\
  \ str, String context) {\n        ma = new Interpreter_Adjective(str, context);\n\
  \    }\n\n    String interpretNoun() {\n        return mn.interpret();\n    }\n\n\
  \    String interpretVerb() {\n        return mv.interpret();\n    }\n\n    String\
  \ interpretAdjective() {\n        return ma.interpret();\n    }\n}\n```\n\n* *\n\
  \n## 16.10 用于解释的执行类\n\n如前所述，尽管根解释器类 `Interpreter_Sentence` 作为 `Driver` 的主解释接口，但从魔法语言到麻瓜语言的实际单词级翻译是由\
  \ `Interpreter_Sentence` 的三个子类执行的。在我们深入这些类中的第一个之前，请再次注意它们与 `Driver` 是完全隔离的。也就是说，这三个子类只能通过根类\
  \ `Interpreter` 提供的接口访问。\n\n每个派自根解释器 `Interpreter_Sentence` 的类都继承了我们提到的 `trigger_words`\
  \ 集合和三个字典。因此，这三个子类的实现代码主要由将上下文与 `trigger_words` 集合中的内容进行比较，并在上下文需要翻译时实际翻译魔法语言单词，否则保持单词原样。\n\
  \n下方的 `Interpreter_Noun` 类代码主要由构造函数和 `interpret()` 方法的实现组成。构造函数首先通过调用\n\n```\nval\
  \ = str.substring(2 + str.indexOf(':'));\n```\n\n从第一个参数字符串中提取需要解释的实际名词。关于此调用参数的结构，请注意由\
  \ `Driver` 类提供的叶子节点值对于语法树的 `Noun` 叶子节点格式为\n\n```\nNoun : actual_noun_word\n```\n\
  \n因此，为了获取实际名词，我们必须首先定位分隔符 `:`，然后从发现 `:` 的位置两个字符之后开始提取单词。随后，构造函数将上下文字符串拆分为字符串数组，并尝试查看任何上下文单词出现在继承自父类\
  \ `Interpreter_Sentence` 的 `trigger_words` 集合中。如果答案是肯定的，我们将解释标志 `muggleAlert` 设置为\
  \ true。\n\n`interpret()` 方法的实现首先检查上下文驱动解释标志 `muggleAlert` 是否开启，以及 `nounTranslator`\
  \ 是否确实包含需要翻译的魔法名词。\n\n\n\n\n\n```java\n public class Interpreter_Noun extends Interpreter_Sentence\
  \ {\n\n\tprivate String val;\n\tprivate String[] contextWords;\n\tprivate boolean\
  \ muggleAlert = false;\n\n\tpublic Interpreter_Noun( String str, String context\
  \ ) {\n\t\tval = str.substring( 2+ str.indexOf( ‘:’ ) );\n\t\tcontextWords = context.trim().split(\
  \ \"\\\\s+\" );\n\t\tfor ( String word : contextWords ) {\n\t\t\tif (trigger_words.contains(word))\
  \ {\n\t\t\t\tmuggleAlert = true;\n\t\t\t\tbreak;\n\t\t\t}\n\t\t}\n\t}\n\tString\
  \ interpret() {\n\t\tif ( (muggleAlert == true) &&\n\t\t\t(nounTranslator.containsKey(val))\
  \ ) {\n\t\t\treturn \"noun interpreted as: \" + nounTranslator.get(val);\n\t\t}\n\
  \t\treturn \"noun not interpreted: \" + val;\n\t}\n}\n```\n\n接下来我们展示 `Interpreter_Verb`\
  \ 工作类的实现。与它的兄弟类 `Interpreter_Noun` 一样，该类也从父类继承了 `trigger_words` 集合以及我们在介绍 `Interpreter_Sentence`\
  \ 时列出的三个字典。与 `Interpreter_Noun` 类似，`Interpreter_Verb` 中的实现代码主要将上下文与 `trigger_words`\
  \ 集合中的内容进行比较，然后根据上下文是否触发翻译需求来实际翻译魔法单词，或者保持输入单词不变。\n\n```java\n public class Interpreter_Verb\
  \ extends Interpreter_Sentence {\n\n\tprivate String val;\n\tprivate String[] contextWords;\n\
  \tprivate boolean muggleAlert = false;\n\n\tpublic Interpreter_Verb( String str,\
  \ String context ) {\n\t\tval = str.substring( 2+ str.indexOf( ‘:’ ) );\n\t\tcontextWords\
  \ = context.trim().split( \"\\\\s+\" );\n\t\tfor ( String word : contextWords )\
  \ {\n\t\t\tif (trigger_words.contains(word)) {\n\t\t\t\tmuggleAlert = true;\n\t\t\
  \t\tbreak;\n\t\t\t}\n\t\t}\n\t}\n\tString interpret() {\n\t\tif ( (muggleAlert ==\
  \ true) &&\n\t\t\t(verbTranslator.containsKey(val)) ){\n\t\t\treturn \"Verb interpreted\
  \ as: \" + verbTranslator.get(val);\n\t\t}\n\t\treturn \"verb not interpreted: \"\
  \ + val;\n\t}\n}\n```\n\n下面所示的 `Interpreter_Adjective` 代码与之前展示的 `Interpreter_Noun`\
  \ 和 `Interpreter_Verb` 代码结构相似。因此，我们不再对其进行进一步解释。\n\n```java\n public class Interpreter_Adjective\
  \ extends Interpreter_Sentence {\n\n\tprivate String val;\n\tprivate String[] contextWords;\n\
  \tprivate boolean muggleAlert = false;\n\n\tpublic Interpreter_Adjective( String\
  \ str, String context) {\n\t\tval = str.substring( 2+ str.indexOf( ‘:’ ) );\n\t\t\
  contextWords = context.trim().split( \"\\\\s+\" );\n\t\tfor ( String word : contextWords\
  \ ) {\n\t\t\tif (trigger_words.contains(word)) {\n\t\t\t\tmuggleAlert = true;\n\t\
  \t\t\tbreak;\n\t\t\t}\n\t\t}\n\t}\n\tString interpret() {\n\t\tif ((muggleAlert\
  \ == true) &&\n\t\tadjectiveTranslator.containsKey(val))) {\n\t\treturn \"adjective\
  \ interpreted as: \"\n\t\t+ adjectiveTranslator.get(val);\n\t\t}\n\t\treturn \"\
  adjective not interpreted: \" + val;\n\t}\n}\n```\n\n## 16.11 工具类 ShowSyntaxTree\n\
  \n工具类 `ShowSyntaxTree` 用于对解析器生成的语法树进行格式化打印。你看到的是此类代码的标准实现。`getIndentation()` 方法在\
  \ `visit()` 方法递归向下遍历树时，返回逐渐增加的空白字符。\n\n```java\n public class ShowSyntaxTree {\n\
  \tprivate int indentationIndex = 1;\n\n\tprivate String getIndentation() {\n\t\t\
  String indentation = \" \";\n\t\tfor (int i=0; i< indentationIndex; i++ ) {\n\t\t\
  \tindentation += \" \";\n\t\t}\n\t\treturn indentation;\n\t}\n\tpublic void print(Node\
  \ node) {\n\t\tSystem.out.println(\"\\nPrinting the ...\");\n\t\tvisit(node);\n\t\
  }\n\tprivate void visit(Node node) {\n\t\tSystem.out.println( getIndentation() +\
  \ node.toString() );\n\t\t++indentationIndex;\n\t\tint count = node.jjtNumChildren();\n\
  \t\tfor (int i=0;i<count;i++) {\n\t\t\tNode child = node.jjtGetChild(i);\n\t\t\t\
  visit(child);\n\t\t}\n\t\t--indentationIndex;\n\t}\n}\n```\n\n## 16.12 运行代码\n\n\
