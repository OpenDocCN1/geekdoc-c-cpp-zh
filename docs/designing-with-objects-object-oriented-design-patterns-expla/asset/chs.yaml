  \n## 注意事项\n\n# 4 工厂方法\n\n## 4.1 重新审视软件中的工厂概念\n\n第 2.1 节中提到的所有注释都适用于本章。正如该节提到的，在软件语境下，工厂的主要目的是增加对象生产者和消费者之间的分离度。第\
  \ 2 章中的抽象工厂模式通过一组工厂高效地生产相关对象，而客户端只需要编写两个接口。而我们在本章中学习的方法方法模式（Factory Method pattern）关注的是如何通过方法调用来构造实例——这些方法被称为工厂方法——以及如何为类组织工厂方法代码。\n\
  \n当提供给客户端获取实例的主要机制是通过调用工厂方法时，你可以在软件中包含以下类型的功能：(1) 能够控制对该类的访问，其能力超过了将其构造函数放在私有或受保护区域所能实现的；(2)\
  \ 在实际调用构造函数之前，能够检查构造实例所需的（计算、网络及其他资源）的可用性；(3) 能够使实例创建受到同一客户端或所有客户端创建了多少此类实例的影响；以此类推。\n\
  \n\n如果实例构造要由工厂方法来管理，你将面临一个问题：如何最好编写此类方法的代码——特别是当你处理的不仅仅是一个类，还有它的子类时。如果可能，你希望创建一个统一的工厂接口，其方法可以用于构造所有不同类型，即使是对应主对象类的子类。理想情况下，你希望让客户端可以使用相同的工厂方法调用来构造所有不同类型的对象——显然，其预期是在工厂接口的不同实现上调用该方法。本章通过方法模式解决了为对象类层次结构构造统一工厂接口的问题。\n\
  \n## 4.2 意图与适用性\n\n方法模式的意图是提供一个根接口，定义客户端可以调用的用于从类层次结构构造对象的工厂方法，而根接口的不同具体实现为不同对象类型提供覆盖实现。\n\
  \n当满足以下时，你应该考虑使用此模式：\n\n*   你希望类层次结构的客户端调用特定的指定方法来构造对象，而不是直接调用构造函数。\n\n\n\n\n\n\
  *   对象构造方法的代码可以进行如下组织，使得所有对象（对应于类层次结构中的不同类）都可以通过重写根接口中声明的一个或多个抽象方法的定义来构造；\n*   你需要在对象类层次结构与定义用于从该层次结构构造对象的方法代码之间建立一种分离。\n\
  \n## 4.3 工厂方法模式简介\n\n假设你提供给客户的软件包含两个类 `A` 和 `B`，它们的实例是客户感兴趣的软件构制品。进一步假设，你的代码还提供了一个独立的类——我们称之为\
  \ `ArtifactMaker`——它的工厂方法 `makeArtifactA()` 和 `makeArtifactB()` 分别返回类型为 `A` 和 `B`\
  \ 的实例。显然，由于在第 4.1 节中提到的原因，我们假设客户没有获得直接访问类 `A` 和 `B` 构造函数的权限。是工厂方法调用了这些类的构造函数来实际生产实例的。如果你的软件架构是这样组织的，那么在假设\
  \ `A` 和 `B` 是无关的类的情况下，它很可能运行良好。\n\n但现在让我们考虑两个构制品类 `A` 和 `B` 相关联的情况，即它们都是某个更通用类的微变体，因此可以派生自根类，你可以在根类中放置\
  \ `A` 和 `B` 共同的所有代码。这就是工厂方法派上用场场的地方。这种模式教会了我们关于在这种情况下如何最好组织基于工厂方法的对象生产代码的几个重要点。首先，如图\
  \ 4.1 所示，该模式并不是只包含一个包含 `A` 和 `B` 工厂方法的 `ArtifactMaker` 类，而是认为拥有一个构制品制造者类的层次结构更好，该结构与客户所需的类实例层次结构是并行的。其次，正如图\
  \ 4.1 所示，该模式要求构制品制造者类层次结构和构制品类层次结构的根节点都成为纯接口。这允许软件的客户通过针对构制品制造者类层次结构的接口编程来获取所需的实例。这样做了良好的面向对象编程的基本原则，即面向接口编程。由于构制品制造者类层次结构也可能仅针对构制品层次结构的接口编程，因此类\
  \ `A` 和 `B` 的软件开发者对于未来构制品层次结构代码的任何更改将获得更大的自由。\n\n![image](img/c04f001.gif)\n\n**图\
  \ 4.1**](#c04.xhtml_R_c4-fig-0001)\n\n现在让我们看看图 4.1 右侧的工厂方法层次结构如何用于产生对象，同时为客户构造所有不同类型的对象提供一个统一的接口。如图所示，在\
  \ `ArtifactMaker` 接口中，我们声明了一个名为 `makeArtifact()` 的方法，预计对于左侧层次结构中的每个对象类，都会有一个实现该接口的具体类。在图中，我们将这些具体类标记为\
  \ `ArtifactMakerForA` 和 `ArtifactMakerForB`。我们预期的 `ArtifactMakerForA` 在确认请求确实可以实现后，将向类\
  \ `A` 发送客户对该类实例的请求。`ArtifactMakerForB` 类相对于类 `B` 的作用亦是如此。\n\n## 4.4 现实世界应用中的工厂方法模式\n\
  \n工厂方法是现代应用面向对象软件中使用得广泛的模式之一。在任何需要由于第 4.1 节中之前提到的任何原因而禁止直接访问构造函数的场合，你都会看到这种模式的应用。工厂方法通常具有如\
  \ `makeX()` 的名称，它们最终会调用客户所需实例的适当构造函数。\n\n除了第 4.1 节中列出的原因外，在现实世界应用中，通过工厂方法路由构造函数调用的另一个重要原因是：这对于相对于参与类的数据元素类型，在类行为的自定义方面提供了便利性。这的一个经典例子是\
  \ Java 及其他语言中的 `Iterator` 类。你需要一个 `Iterator` 类的实例，因为你想遍历一个对象集合。通过遍历集合，我们的意思是从例如第一个元素开始，依次访问每个元素，直到到达最后一个元素。这里的重要的是，由于你需要的\
  \ `Iterator` 对象必须特定于集合和集合中的元素类型，因此通过通常的构造函数调用模式来构造迭代器并不方便。至少，你可能需要为容器类型和元素类型的每种不同组合提供自己的构造函数。因此，Java\
  \ 提供了一个种用于构造 `Iterator` 对象的工厂方法。例如，如果你需要一个 `ArrayList` 容器的 `Iterator` 实例，你可以通过调用后者的工厂方法\
  \ `listIterator()` 来获得前者。\n\n## 4.5 用哈利·波特故事说明工厂方法模式\n假设我们有需要魔术棒和回记忆水的客户。同样，假设这些魔法构制品可以用图\
  \ 4.2 所示的层次结构表示。满足这种需求的直接方法是为魔术棒和记忆水的类配备适当的构造函数。客户可以直接调用这些构造函数来构造任意数量的这些魔法实例。\n\n\
  ![image](img/c04f002.gif)\n\n**图 4.2**](#c04.xhtml_R_c4-fig-0002)\n\n虽然上述解决方案会在很多情况下被使用，但在某些情况下，这种解决方案会导致存在\
  \ `MagicWand` 和 `Remembrall` 类的层次结构实现与客户类之间产生过直接的耦合。以下是这样一种情况的例子。\n\n考虑一种假设的情况：魔法部想要对希望获取魔法对象的巫师的资质进行限制，并想要跟踪巫师社区中此类对象数量。魔法部本身对直接向大众提供此类对象并不感兴趣。然而，当构制品制造者收到客户的请求时（客户可能是代表巫师下单的对角巷零售商），魔法部要求首先根据想要魔法对象的巫师资质对请求进行检查。魔法部还希望为构制品制造者提供给客户的每个构制品分配一个唯一的识别码。\n\
  \n\n\n\n\n在实际构造魔法对象之前必须执行上述的检查，这使得在这种情况下，基于工厂方法（Factory Method）的实现成为该对象构造软件的理想选择。图\
  \ 4.3 中 `ArtifactMaker` 层次结构中的 `makeArtifact()` 工厂方法可以在调用魔法对象的构造函数之前，执行魔法部要求的检查。以下是我们将在演示代码中包含的一项检查示例：我们将确保在为巫师构造魔杖时，其核心材料——这种材料承载着魔力——与该巫师的经验水平相匹配。魔法部认为，初级巫师（例如霍格沃的新学生）通常无法处理核心为龙心（丝）的魔杖。巫师在用魔杖施出新咒语时必须能够保持冷静。如果巫师本人因试图创造的咒语而变得过于焦虑，该咒语可能无法持续多久。出于所有这些原因，魔杖制造者的一项重要责任是确保魔杖相对于其预期用户的任何限制条件不被违反。关于为魔法对象分配唯一识别码，我们将对象构造的这一部分整合到魔法对象的类定义中，尽管我们也可以同样容易在工厂方法本身中完成。\n\
  \n![image](img/c04f003.gif)\n\n图 4.3\n\n## 4.6 模式演示的高层视图\n\n图 4.4 展示了我们工厂方法模式演示中所有类的顶层视图。除了上一节提到的\
  \ `Enchanted` 和 `ArtifactMaker` 层次结构中的类外，我们现在还包含了以下类：`Client`、`WandCores` 和 `ArtifactCannotBeCreated`。在这些类中，`Client`\
  \ 类的作用是执行其余代码。`Client` 实例代表巫师或女巫师，通过调用声明在 `ArtifactMaker` 层次结构根部的方法，向相应的 `ArtifactMaker`\
  \ 类请求其中一个 `Enchanted` 魔法制品。在下单时，预计客户还需提供与订单相关的客户资质。为了演示，我们将客户端与 `ArtifactMaker`\
  \ 层次结构之间的交互限制在对魔杖的订购上。魔杖制造者想要知道接收魔杖的客户是初级、中级还是资深巫师或女巫。\n\n![image](img/c04f004.gif)\n\
  \n图 4.4\n\n注意，类图中的 `Enchanted` 仅仅是一个标记接口（marker interface）——也就是说，它是一个用于定义 `Enchanted`\
  \ 类型对象的空接口。在另一个层次结构中，即魔法制品制造者层次结构中，根接口 `ArtifactMaker` 只有一个职责，即声明一个 `makeArtifact()`\
  \ 方法。由于在订购时不总能构造出对象（例如，因为没有记忆球所需的烟雾，或者即使可用，由于某种原因导致其魔力注入未成功），根类 `ArtifactMaker`\
  \ 将 `makeArtifact()` 方法声明为抛出一个名为 `ArtifactCannotBeCreated` 的特殊异常。\n\n\n```\n public\
  \ interface WandCores {\n  public enum WandCore { phoenixTailFeather,\n   unicornTailHair,\n\
     veelaHair,\n   dragonHeartString };\n}\n```\n\n回想起不同核心的魔杖具有不同的能力。只有最有经验的巫师预期能够处理核心为龙心的魔杖。\n\
  \n`ArtifactCannotBeCreated` 类在我们的演示中用作异常类。由于我们演示的一项重要功能是对对象构造某些限制的强制执行，我们显然需要在当这些限制无法满足时，让代码抛出异常。该异常类的定义如下：\n\
  \n```\n public class ArtifactCannotBeCreated extends Exception {\n  public ArtifactCannotBeCreated(\
  \ String s ) {super(s);}\n}\n```\n\n在完成了接口 `WandCores` 和类 `ArtifactCannotBeCreated`\
  \ 的定义后，后续章节将介绍 图 4.4 中剩余的类。\n\n\n正如上一节提到的，`Enchanted` 仅仅是一个标记接口，它的工作是为我们的演示代码“汇聚”巫师和女巫世界存在的魔法制品。我们的演示基于这样一个假设：魔法部以类定义的形式发布了所有被认为是\
  \ `Enchanted` 的魔法制品的规范。魔法部还规定了巫师或女巫获得这些对象之一时必须具备的资质。由于只是标记接口，这里是 `Enchanted` 的官方定义：\n\
  \n```\n public interface Enchanted {}\n```\n\n接下来我们展示 `Enchanted` 层次结构中的 `MagicWand`\
  \ 类。由于魔杖最重要的部分是它的核心——它必须由可以承载魔力的材料制成——类规范对核心的选择进行了限制。此外，该类确保所选的核心对于使用魔杖的巫师或女巫的经验水平是可以接受的。用户经验水平与魔杖内部核心之间的关系通过\
  \ `HashMap` 容器来强制执行，该容器的引用由类定义中的静态变量 `experience to wandCore mapping` 持有。在主构造函数中，我们检查调用的魔杖核心是否与存储中的信息匹配。如果检测到违反，将抛出\
  \ `ArtifactCannotBeCreated` 异常。\n\n如果巫师或女巫选择订购魔杖而没有告诉制造者他们的经验水平，魔法部允许制造者提供一个核心由女妖发制成的魔杖。由于这是魔杖的默认构造，我们将其放在类的无参构造函数中。\n\
  \n此外注意魔法部要求每根魔杖都必须盖有一个唯一的序列号。这一要求通过为类提供一个名为 `nextIdNum` 的类变量和一个实例变量 `idNum` 轻松解决。这些变量用于无参构造函数。当魔杖制造者构造一个新的\
  \ `MagicWand` 时，制造者调用下方所示类的构造函数，该构造函数随后在开头调用无参构造函数。从而为新魔杖生成一个新的序列号。\n\n\n\n\n\n\
  ```java\n import java.util.*;\n\npublic class MagicWand implements WandCores, Enchanted\
  \ {\n\n\tpublic int idNum;\n\tpublic static int nextIdNum = 1;\n\n\tprivate String\
  \ owner;\n\tprivate String wizardExperienceLevel;\n\tprivate WandCore wandCore;\n\
  \n\tpublic static final HashMap<String, WandCore>\n\t\texperience_to_wandCore_mapping\
  \ =\n\t{ experience_to_wandCore_mapping.put( \"novice\",\n\t\tWandCore.phoenixTailFeather\
  \ );\n\texperience_to_wandCore_mapping.put( \"intermediate\",\n\t\tWandCore.unicornTailHair\
  \ );\n\texperience_to_wandCore_mapping.put( \"advanced\",\n\t\tWandCore.dragonHeartString\
  \ );\n\t}\n\tpublic MagicWand() {\n\t\tidNum = nextIdNum++;\n\t\twandCore= WandCore.veelaHair;\n\
  \t}\n\tpublic MagicWand( String owner, WandCore core,\n\t\tString wizardExperienceLevel)\n\
  \t\t\tthrows ArtifactCannotBeCreated {\n\t\tthis();\n\t\tthis.owner = owner;\n\t\
  \tthis.wandCore = core;\n\t\tthis.wizardExperienceLevel = wizardExperienceLevel;\n\
  \t\tif ( !experience_to_wandCore_mapping.get(\n\t\t\twizardExperienceLevel ).equals(\
  \ core ) ) {\n\t\tthrow new ArtifactCannotBeCreated(\n\t\t\t\"wizard’s experience\
  \ not matched to the wand\");\n\t\t}\n\t}\n\n\tpublic MagicWand( String owner )\
  \ {\n\tthis();\n\tthis.owner = owner;\n\t}\n\n\tpublic String toString() {\n\t\t\
  return \"Wand Owner: \" + owner + \"   Wand Core: \"\n\t\t+ wandCore + \"    Serial\
  \ Num: \" + idNum;\n\t}\n\n\tpublic int getIdNum() { return idNum; }\n\tpublic String\
  \ getOwner() { return owner; }\n\tpublic String getWizardExperienceLevel() {\n\t\
  \treturn wizardExperienceLevel;\n\t}\n}\n```\n* *\n\n接下来展示 `Remembrall` 类，其定义与 `MagicWand`\
  \ 类相似。在这种情况下，魔法部要求球体内必须包含烟雾，且烟雾必须经过魔法处理。人们可能会预料负责提供记忆球的 `ArtifactMaker` 类会检查这两项要求。然而，为了万无一失，该类会检查球体确实充满了烟雾，并且烟雾确实经过了魔法处理。如果违反了这两个条件的任何一个，该类将抛出\
  \ `ArtifactCannotBeCreated` 异常。\n\n与魔法王国的大多数魔法物品一样，魔法部要求每个 `Remembrall` 都带有一个唯一的序列号。这通过静态变量\
  \ `nextIdNum` 实现，该变量持有下一个 `Remembrall` 实例将要使用的序列号。\n\n* *\n\n```java\n public class\
  \ Remembrall implements Enchanted {\n\tpublic int idNum;\n\tpublic static int nextIdNum\
  \ = 1;\n\n\tprivate String owner;\n\n\tpublic Remembrall( String owner, boolean\
  \ isSmokeAvailable,\n\t\tboolean isSmokeEnchanted )\n\t\t\tthrows ArtifactCannotBeCreated\
  \ {\n\t\tif (! isSmokeAvailable) {\n\t\t\tthrow new ArtifactCannotBeCreated(\n\t\
  \t\t\t\"Smoke not available for making a new remembrall\");\n\t\t}\n\t\tif (! isSmokeEnchanted)\
  \ {\n\t\t\tthrow new ArtifactCannotBeCreated(\n\t\t\t\"Enchantment not available\
  \ for the smoke\" );\n\t\t}\n\t\tidNum = nextIdNum++;\n\t\tthis.owner = owner;\n\
  \t}\n\tpublic String toString() {\n\t\treturn \"Remembrall owner: \" + owner + \"\
  \ Serial Num: \" + idNum;\n\t}\n\tpublic int getIdNum() { return idNum; }\n\tpublic\
  \ String getOwner() { return owner; }\n}\n```\n\n* *\n\n## 4.8 ARTIFACTFACTORY 类的层次结构以及其中包含的工厂方法\n\
  \n下面显示在本节中定义的具体制品制造器类的根接口。该接口规定任何实现该接口的类都至少必须实现工厂方法 `makeArtifact()`，且该方法必须返回一个\
  \ `Enchanted` 制品，除非客户端请求的制品由于某些原因无法制造，在这种情况下，制造者必须抛出类型为 `ArtifactCannotBeCreated`\
  \ 的异常。制品制造者无法提供特定 `Enchanted` 对象的原因可能包括：制造订单对象的组件不可用；无法对对象或其关键组件进行魔法处理；\n\n* *\n\
  \n```java\n public interface ArtifactMaker extends Enchanted {\n\tpublic Enchanted\
  \ makeArtifact( String owner )\n\tthrows ArtifactCannotBeCreated;\n}\n```\n\n* *\n\
  \n接下来展示 `MagicWandMaker` 类。由于该类实现了 `ArtifactMaker` 接口，它必须为接口中声明的工厂方法 `makeArtifact(String\
  \ owner)` 提供实现代码。在案例中，该方法简单地询问订购魔杖的巫师的经验等级。随后，它调用了两个参数版本的工厂方法来实际生产魔杖。如所示，两个参数的 `makeArtifact()`\
  \ 方法的契约是抛出 `ArtifactCannotBeCreated` 异常。这是必要的，因为当 `MagicWand` 构造函数在发现魔杖制造者试图提供不符合合的魔杖时，也会抛出相同的异常。\n\
  \n另外请注意每个 `if` 块中的注释行。这些注释旨在用作 `ArtifactMaker` 类必须执行的那些魔杖制造步骤的占位符。这些步骤之一将是确保魔杖核心与经验等级相匹配。显然，如果这些步骤中的任何一个失败，它们将抛出\
  \ `ArtifactCannotBeCreated` 异常。\n\n最后请注意，如果订购魔杖的巫师等级既不是新手不是高级，魔杖制造者将提供一个可以被称为通用魔杖的东西——这是一个带有女妖核心的魔杖。这种魔杖通过调用\
  \ `MagicWand` 的无参数构造函数自动生成。\n\n* *\n\n```java\n import java.util.*;\n\npublic class\
  \ MagicWandMaker implements ArtifactMaker, WandCores {\n\n\tpublic Enchanted makeArtifact(\
  \ String owner )\n\t\tthrows ArtifactCannotBeCreated {\n\t\t\t\"\\n\\nEnter 巫师的经验等级为\\\
  \"novice\\\",\"\n\t\t+ \\\"intermediate\\\", \\\"advanced\\\", 或 \\\"unknown\\\"\
  \ \");\n\t\tScanner sc = new Scanner(System.in);\n\t\tString experienceLevel = sc.next();\n\
  \t\treturn makeArtifact( owner, experienceLevel );\n\t}\n\n\tpublic Enchanted makeArtifact(\
  \ String owner,\n\t\tString experienceLevel ) throws ArtifactCannotBeCreated {\n\
  \t\tif ( experienceLevel.equals( \"novice\" ) {\n\t\t\t// 调用检查凤凰尾羽可用性的步骤\n\t\t\t\
  // 如果成功，调用下方的返回；否则\n\t\t\t// 抛出异常。\n\t\t\treturn new MagicWand( owner,\n\t\t\t\t\
  WandCore.phoenixTailFeather,\n\t\t\t\texperienceLevel );\n\t\t} else if ( experienceLevel.equals(\
  \ \"intermediate\" ) ) {\n\t\t\t// 调用检查独角兽毛可用性的步骤\n\t\t\t// 如果成功，调用下方的返回；否则\n\t\t\
  \t// 抛出异常。\n\t\t\treturn new MagicWand(owner,\n\t\t\t\tWandCore.unicornTailHair,\n\
  \t\t\t\texperienceLevel );\n\t\t} else if ( experienceLevel.equals( \"advanced\"\
  \ ) ) {\n\t\t\t// 调用检查龙芯可用性的步骤\n\t\t\t// 如果成功，调用下方的返回；否则\n\t\t\t// 抛出异常。\n\t\t\t\
  return new MagicWand( owner,\n\t\t\t\tWandCore.dragonHeartString,\n\t\t\t\texperienceLevel\
  \ );\n\t\t} else {\n\t\t\t// 或者用户在响应经验等级提示时输入了无法识别的字符串\n\t\t\t// 或者没有输入任何内容：\n\t\
  \t\treturn new MagicWand( owner );\n\t}\n}\n```\n\n* *\n\n接下来展示 `RemembrallMaker`\
  \ 类。与之前的制品制造器类一样，由于该类实现了 `ArtifactMaker` 接口，它必须为根接口中声明的工厂方法 `makeArtifact(String\
  \ owner)` 提供实现代码。\n\n\n\n\n在本案例中，工厂方法 `makeArtifact()` 的实现通过调用随机数生成器的布尔输出，来决定正在构造的记忆盆（remembrall）是否有可用烟雾，以及在有雾的情况下是否可以对其进行附魔。将这两个调用都视为对于烟雾的可用性或可附魔性并没有硬性的保证。通常情况下，验证这两个条件是否都满足应该是记忆盆制造者的责任。然而，在这个案例中，法器制造者会随心所章地将记忆盆的构造请求发送给\
  \ `Remembrall` 构造函数。正如你从 `Remembrall` 类的规范中所记忆的，`Remembrall` 构造函数会在为构造中的记忆盆发放唯一的序列号之前，确保烟雾及其可附魔性均符合规范。\n\
  \n```java\nimport java.util.Random;\n\npublic class RemembrallMaker implements ArtifactMaker\
  \ {\n\n    public Enchanted makeArtifact( String owner )\n        throws ArtifactCannotBeCreated\
  \ {\n        boolean isSmokeAvailable = rand.nextBoolean();\n        boolean isSmokeEnchantmentAvailable=\
  \ rand.nextBoolean();\n        return new Remembrall( owner, isSmokeAvailable,\n\
  \            isSmokeEnchantmentAvailable );\n    }\n}\n```\n\n## 4.9 Client 类\n\n\
  此演示中的客户理应是对角巷的魔法法器零售商。此类客户知道，魔法法器只能从某些负责其生产的特定法器制造者处订购。客户也知道，只有当巫师和女巫有资格接收他们订购的法器时，法器制造才会发送法器。他们还意识到，收到的每个魔法法器都带有唯一的序列号，魔法部用它来跟踪魔法王国中所有的魔法法器。\n\
  \n下面展示了一个为哈利订购了一根魔杖并为内维尔订购了一个记忆盆的客户。当客户向魔杖制造者下达哈利的魔杖订单时，制造者会向客户询问哈利的经验等级。我们假定客户并提前不知道所有与订购法器相关的合规性问题；客户无论如何都认为这些是魔杖制造者的责任。因此，客户直接提交了订单，并等待魔杖制造者告诉它可能需要哪些额外信息，以符合魔法部的最新规定。\n\
  \n```java\npublic class Client {\n    public static void main( String[] args ) {\n\
  \        ArtifactMaker maker1 = new MagicWandMaker();\n        try {\n         \
  \   // 这是对工厂方法‘makeArtifact’的调用\n            // MagicWandMaker 类：\n            MagicWand\
  \ mw = (MagicWand) maker1.makeArtifact( \"Harry\" );\n            System.out.println(\
  \ mw );\n        } catch( ArtifactCannotBeCreated u ) {}\n\n        ArtifactMaker\
  \ maker2 = new RemembrallMaker();\n        try {\n            // 这是对 RemembrallMaker\
  \ 类工厂方法‘makeArtifact’的调用：\n            Remembrall rem = (Remembrall) maker2.makeArtifact(\
  \ \"Neville\" );\n        } catch( ArtifactCannotBeCreated u ) {}\n    }\n}\n```\n\
  \n## 4.10 代码玩\n\n从书籍网站下载此模式的类文件到单独目录。使用命令 `javac *.java` 编译代码，并通过 `java Client`\
  \ 执行 `Client` 类。\n\n根据 `Client` 的 `main()` 方法中的代码，执行 `Client` 类将提示你看到以下消息：\n\n```\n\
  Enter the experience level of the wizard as \"novice\", \"intermediate\", \"advanced\"\
  , or \"unknown\":\n\n如果你输入（例如）`novice`，系统将：\n\n`Wand Owner: Harry Core: phoenixTailFeather\
  \ Serial Num: 1`\n`Remembrall Owner: Neville Serial Num: 1`\n\n回想 `Client` 的 `main()`\
  \ 方法中的代码为哈利·波特订购了一根魔杖，为内维尔·隆戈底订购了一个记忆盆。这就是上面输出中“Harry”和“Neville”名字的来源。你是否能看到上面的第二行取决于\
  \ `RemembrallMaker` 类工厂方法 `makeArtifact()` 实现中随机数生成器的输出。回想我们使用这个随机数生成器产生一个随机布尔值，用来决定构造中的记忆盆是否有可用烟雾。如果没有雾，`Remembrall`\
  \ 构造函数将抛出 `ArtifactCannotBeCreated` 异常。由于该异常被 `Client` 捕获，在这种情况下你将看不到第二行。\n\n为了深入了解工厂方法模式，你可以按照以下思路自行扩展演示代码：\n\
  \n- 我们目前的演示隐含了某个像魔法部之类的实体的存在，它负责维护法器的规范（通过负责法器的类定义），并负责规定向巫师和女巫供应法器的条件。为了保持演示代码的简单，我们将这些条件直接整合到了法器类定义的构造函数代码中。你可以通过实际定义一个名称如\
  \ `MinistryOfMagic` 的监管类来使演示更加详尽，该类用于指定和存储法器构造限制，并作为分配给法器的唯一标识码的保管。\n- 在当前的演示代码中，法器制造者仅仅是在确认客户资质后，直接将客户请求传递给法器构造函数。我们的演示代码之所以可以这样运行，是因为在\
  \ `Enchanted` 层次中，每种法器类型都有一个法器制造者。你可以通过创建一个零件的对象层次（由法器制造者将其组装成产品）来使演示更加精彩。现在你需要实现魔法部对零件、组装对象以及订单巫师女巫的限制。\n\
  \n# 5 原型\n\n## 5.1 为什么不通过拷贝旧对象来创建新对象？\n\n假设你可以直接从一家专门制作法国君主命名的家具工厂订购椅子。假设你的订单是路易十六椅。\n\
  \n假设工厂的工人包括能够从零开始创作正统时代作品的高级工匠，以及在给定时代作品进行拷贝时擅长制作复制品的没那么昂贵的工人，工厂有两种选择：它要么让那些高成本工人从零开始为你制作一把椅子，要么让那些低成本工人从一把之前制作的路易十六椅制作一个复制品。\n\
  \n工厂很可能会选择后者。为了在所有后续订单中常规使用这种方法，工厂可能会永久保存每个时代作品的一个示例，并将其称为原型（prototype）。随后，履行客户订单将归结为要求低成本工人从原型创建一个复制品。\n\
  \n有趣的是，通过拷贝原型创建新对象还有另一个经常被忽视的优势。当工人被要求创建另一个对象的精确复制时，由此产生的新对象不太可能偏离客户订购的内容——假设客户的订单提到了某个特定的原型。\n\
  \n\n\n另一方面，当从头开始创建一个新对象时，最终产物不完全符合客户预期的概率更大。假设该对象是复杂的，任何从头开始的生产都将涉及给对象的各种属性赋值。客户在下单时，他/她可能只提到了那些较为显著的属性，这并不罕见。然而，客户指定的属性可能不足以约束那些从零开始创建对象的人。结果更有可能的可能是，当客户看到最终对象时，他/她将不会完全满意，特别是当客户在下单时未提及的属性的后果很严重时^(1)。从头开始构建方法的其他可能错误还包括误解客户的规范等。\n\
  \n正如本章很快将论证的那样，通过复制构建对象（相对于从头开始构建对象）的这些优势也适用于软件开发领域。\n## 5.2 意图与适用性\n\n`Prototype`（原型）模式的意图是通过对存储的版本进行复制来构建新对象。\n\
  \n在以下情况下，你应该考虑使用这种模式：\n\n*   从头开始构建对象的成本显著超过仅复制之前存储的相同版本的成本；\n*   客户端需要从同一个类构建的不同类型实例的数量较少，以至于每种类型都可以被存储为\
  \ `prototype`（原型）；\n*   类定义没有导致由深层嵌套结构组成的对象（这可能会在从存储的原型进行深拷贝时产生问题）。\n\n## 5.3 原型模式简介\n\
  \n正如读者所知，通用面向对象编程的基本原理是通过调用类的 `constructor`（构造函数）来创建类的的新实例。这种创建软件对象的方式等同于每次都从头开始构建它。可能会问，这真的必要吗，正如我们在第\
  \ 5.1 节中针对物理世界对象那样？在软件世界中，通过克隆仍在内存中的之前构建的对象来创建一个新对象是否有益处——当然，前提是客户端请求的新对象的状态与内存中旧对象的状态是相同的？我们所说的状态是指从类中构造新对象时分配给\
  \ `instance variables`（实例变量）的值。\n\n对于小型而简单的对象——比方说涉及基本类型`instance variables`的类——在大多数情况下，从头开始构造实例并不涉及主要的成本（例如，所需的计算量）。因此，通过调用类的\
  \ `constructor` 重新创建一个新实例来满足客户对新对象的请求是有意义的——但可能有以下例外：当你赋予程序员通过直接调用类的 `constructor`\
  \ 来构建对象的自由时，你也赋予了程序员在设置对象状态时犯错的自由。当在 `constructor` 调用中直接设置 `instance variables`\
  \ 时，它们会受到键盘输入错误以及其他可能由于程序员对要提供的 `constructor parameters`（构造函数参数）的值做出错误假设而引起的错误的影响。研究过\
  \ API 复杂性相关问题^(2)的研究人员表明，函数调用中的参数数量越多，特别是当其中几个参数是相同类型时，程序员在调用此类函数时正确指定参数的出错概率就越大。因此，即使与实际对象构建相关的成本微乎其微，也可能存在其他因素反对在客户端每次需要类的新实例时都通过\
  \ `constructor` 调用来从头开始构建对象。\n\n而当对象是复杂的，例如，因为它们的 `instance variables` 本身是类类型对象，或者因为\
  \ `instance variables` 需要从网络中其他地方获取的值，那么通过简单地克隆之前构建的对象来提供新对象可能更快、更简单。\n\n但显然，只有当之前构建的实例的状态与新实例的要求相同时，之前构建的实例的克隆体才能作为新实例返回。\n\
  \n\n为了直观地展示通过调用 `constructors` 直接构建实例与从少数原型之一克隆构建实例之间的区别，我们用图 5.1 描绘了前者情况，用图 5.2\
  \ 描绘了后者。当通过调用类构造函数直接创建实例时，每个构造实例的状态*可以*是唯一的。因此，图 5.1 中显示的 *N* 个对象中的每一个可能是唯一的。另一方面，图\
  \ 5.2 中描绘的基于原型的实例构建涉及从少数原型创建复制品。显然，从同一个原型创建的每个实例的状态将与原型相同。图 5.2 显示了只有三个原型时的情况。\n\
  \n\n\n\n因此，如果原型模式的核心是通过复制一个原型实例来创建新实例，那么实际上应该如何执行所需的复制呢？在通过复制一个实例来创建另一个实例时是否存在任何陷阱？事实证明，在编写通过复制而非通过调用构造函数来创建实例的代码时，必须格外小心。这种情况的原因与计算机内存中存储对象的访问方式有关。详细来说，考虑两个\
  \ Java 类 `A` 和 `B`，前者拥有一个持有指向后者类实例引用的成员变量。假设你已经构造了类 `A` 的实例，我们将该实例命名为 `instanceA`。显然，`instanceA`\
  \ 有一个变量指向类型为 `B` 的实例；我们将该实例命名为 `instanceB`。如果你通过简单的逐字节拷贝（byte-by-byte copying）复制\
  \ `instanceA`，那么复制后的 `instanceA` 中的相同变量将指向同一个 `instanceB` 对象。根据你的应用程序需求，这可能符合（也可能不符合）你对“通过复制一个实例来创建新实例”的意图。在大多数情况下，这种被称为`浅拷贝`（`shallow\
  \ copying`）的复制语义会导致程序行为异常。\n\n`浅拷贝` 的反面是`深拷贝`（`deep copying`）。当采用深拷贝从例如 `instanceA`\
  \ 创建副本实例时，你需要确保 `instanceA` 内部成员变量所指向的任何类类型对象都在内存的另一个处经过了它们自身的复制。*通过这种方式，你可以确保实例的副本是一个完全独立的对象，与创建该副本的原对象没有隐藏的连接。*\n\
  \n在 Java 中复制类类型对象之前——无论是通过浅拷贝还是深拷贝——你必须首先确保创建原始实例的类实现了 `Cloneable` 接口。尽管 `Cloneable`\
  \ 是一个空接口，但它向 Java 编译器发送了一个信号，允许创建由该类构造的对象的副本。一旦你以这种方式声明一个类为 `Cloneable`，你就可以为 `clone()`\
  \ 方法提供覆盖实现（该方法最初定义在根类 `Object` 中），并规定从该类构造的实例将如何被复制。如果没有 `clone()` 的重写实现，系统将使用 `Object`\
  \ 对该方法的定义——但该定义只能创建被复制实例的逐字节拷贝。换句话说，Java 中默认的实例复制是逐字节复制，这等同于对需要复制的对象进行浅拷贝。对于深拷贝，你别无选择地提供继承自根类\
  \ `Object` 的 `clone()` 方法的覆盖实现。\n\n几乎所有主要的面向对象语言都提供了从类定义创建的实例复制的功能。例如，Java 中 `clone()`\
  \ 起的作用在 C++ 中通过拷贝构造函数的概念来实现。放在类拷贝构造函数中的代码决定了从该类构造的实例的复制语义。也就是说，取决于你如何在 C++ 中编写类的拷贝构造函数，你可以实现浅拷贝或深拷贝。\n\
  \n## 5.4 真实世界应用中的原型模式\n\n大多数主要的面向对象语言都提供了实现原型模式的机制。如前所述，Java 为此目的提供了 `Cloneable`\
  \ 接口。\n\n如果从类定义中创建的实例状态对于应用程序的正常运行至关重要，那么软件供应商会使用这种模式对这些实例的状态进行更有效的控制。当一个类只允许有限数量的不同状态时，使用原型模式进行此类控制尤为有效。对于此类类，供应商为客户端提供一个基于工厂方法（4）的对象构造前端，其工作是首先存储该类所有允许的不同状态的原型实例，然后向客户端提供这些原型的副本。客户端获取哪一个副本取决于客户端提出的对象创建请求。目标是为客户端提供一个与其需求最接近的实例。\n\
  \n除了控制实例状态之外外，每当直接调用构造函数创建新实例的成本大于从之前构造的实例进行克隆的成本时，原型模式就有用。两种对象创建方式都需要分配内存——因此内存分配的开销不是问题。然而，如果客户端可以使用之前构造对象的克隆来满足需求，则可以避免与对象创建相关的其他成本。例如，这些其他成本可能与构造函数参数值的算法级估算有关。在某些情况下，确定这些值可能涉及访问远程数据库、下载数据、数据过滤等。因此，如果客户端对之前构造的实例所使用的参数值感到满意，为什么不给客户端提供该实例的副本呢？\n\
  \n## 5.5 用哈利·波特的故事说明原型模式\n\n我们将借助哈利·波特魔法世界中的巨龙来解释原型模式。世界上只存在极少数不同*类型*的巨龙。它们居住在世界的不同地区，在食性、生长周期、体重等方面有所不同。虽然它们在少数特定特征上可能有所不同，但它们的共同点远超不同点——毕竟，它们都是巨龙。\n\
  \n为了演示原型模式，我们将定义一个单一的 `Dragon` 类，带有以下三个属性的成员变量：巨龙的原栖地、它喜爱的食物以及它的长度（英尺）。我们将为列出的八种不同类型的巨龙各从该类创建一个实例（5）。这八个实例将作为不同类型巨龙的原型。管理类负责存储这些原型，并在接收到对巨龙请求后，通过从其中一个原型复制来提供。\n\
