  \    Violation handed over to Headmaster\n    Violation UsingWandToEnchantDuringPlay\
  \ resolved by the Headmaster\n        Professor Dumbledore\n\nFor player Viktor\
  \ Krum (Violation: Broom Tampering):\n    Violation handed over to Referee\n   \
  \ Violation handed over to Teacher\n    Violation handed over to Deputy Headmaster\n\
  \    Violation BroomTampering resolved by the Deputy Headmaster\n        Professor\
  \ McGonagall\n\nFor player Fred Weasley (Violation: Piss off the referee):\n   \
  \ Violation handed over to Referee\n    Violation handed over to Teacher\n    Violation\
  \ handed over to Deputy Headmaster\n    Violation handed over to Headmaster\n  \
