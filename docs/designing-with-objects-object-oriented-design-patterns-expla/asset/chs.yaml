  ## 18.8 接口 TrialElements\n\n`TrialElements` 接口的目的是为审判的“术语”提供一个中心仓库——我们在极简的意义下通过枚举（enum）来实现这一点。我们的第一个枚举\
  \ `TrialState` 定义了审判必须经历的不同阶段。正如读者在上一节中看到的，我们的 `Mediator` 抽象类识别了这些状态。下面的其他声明定义了什么是针对被告的指控\
  \ `Charge`，什么是证据 `Evidence`，以及什么是判决 `Verdict`。\n\n***\n\n```java\npublic interface\
  \ TrialElements {\n    public static enum TrialState {\n        ChargeFiled,\n \
  \       EvidencePresented,\n        WitnessesBeingQuestioned,\n        WitnessBeingQuestionedByProsecution,\n\
  \        WitnessBeingQuestionedByDefense,\n        WitnessTestimoniesCompleted,\n\
  \        JudgmentBeingRendered,\n        TrialCompleted\n    }\n\n    public static\
  \ enum Charge {\n        ConjuredPetronusInugglePresence,\n        UsedCharmOnMuggle,\n\
  \        UnderageUsesOfMagic\n    }\n\n    public static enum Evidence {\n     \
  \   AccusedNotPlaceOfCrime,\n        LifeOfAccusedInDanger\n    }\n\n    public\
  \ static enum Verdict {\n        Guilty,\n        NotGuilty,\n        UnableToReachVerdict\n\
  \    }\n}\n```\n\n***\n\n## 18.9 MinistryOfMagicTrialMediator 类\n\n你已经以抽象类的形式看到了\
  \ `Mediator` 接口。该接口的一个重要组件是规范了审判通过不同阶段时允许的转换。在该接口中，我们将审判的每个阶段称为审判的状态。\n\n我们现在展示\
  \ `Mediator` 接口的一个具体实现。该实现类 `MinistryOfMagicTrialMediator` 是专为哈利·波特在魔法部的审判而设计的。`Mediator`\
  \ 这一具体实现最重要的部分是实现了\n\n```java\nTrialState getNextState(TrialState current_state)\n\
  ```\n\n方法。除了根据 `Mediator` 接口中的 `transitions` 规范返回下一个状态外，`MinistryOfMagicTrialMediator`\
  \ 还提供了以下占位符，用于根据法庭程序建立证人提供的证言真实性所需的证据逻辑：\n\n```java\nboolean corroborateWitnessTestimony(Evidence\
  \ testimony)\n```\n\n\n\n\n我们对该方法的实现仅仅是一个占位符，因为它所做的只是对所呈现的证据返回 `true`。这种方法的完整实现将偏离我们的演示目标，即从中调者模式（Mediator\
  \ pattern）的角度关注类与类之间的交互。\n\n下方类定义中的实现代码从定义一组实例变量开始；它们的名称自解释。中调者通过两个实例变量 `setOfWitnesses`\
  \ 和 `witnessesHeardByCourt` 来跟踪已听证的证人以及所有可用证人的列表。还要注意 `defenseWitnessesAvailable`\
  \ 和 `prosecutionWitnessesAvailable` 这两个实例变量扮演的角色。正如读者之后在 `Witness` 类中看到的，每个证人不是控方证人就是辩方证人。控方证人由辩方进行询问，辩方证人由控方进行询问。\n\
  \n实例变量之后是 `Mediator` 接口中声明的方法实现。`Trial`实例通过这些方法与中调者进行交互。不同的 `set` 方法用于初始化特定审判使用的\
  \ `MinistryOfMagicTrialMediator` 实例。`getVerdict()` 方法用于获取后续描述的 `getNextState()`\
  \ 逻辑所得出的判决。\n\n`getNextState(currentState)` 方法的大部分逻辑非常简单：它查看根接口 `Mediator` 中 `transitions`\
  \ 关联列表允许的内容，并返回由该列表决定的下一个 `TrialState`。如果该方法有任何复杂性，那在于证人如何被“处理”。我们首先判定证人是控方证人还是辩方证人。无论哪种情况，我们检查相关证人实例变量\
  \ `testimonyCorroboratedUponExamination` 的值，以确定证言的真实性。该变量的值通过调用下方类的 `corroborateWitnessTestimony()`\
  \ 方法设置。如前所述，我们对该方法的实现是简单的，因为它总是返回 `true`。在这方面，它只是一个占位符，读者可以使用它来实现根据证言返回 `true` 或\
  \ `false` 的复杂逻辑。\n\n读者还应该注意 `getNextState()` 中根据证人提供的证言决定发布何种判决的逻辑。该逻辑非常简单：辩方证人的任何一个否定证言都会否定被告的辩护。同样，控方证人的任何一个否定证言都会否定整个控方诉讼。如果辩方提出的案件失败，则被告被判定有罪。如果控方提出的案件失败，则被告被判定无罪。如果辩方和控方的案件均被证明有效，或者两者都失败，则被告被释放，判决为\
  \ `UnableToReachVerdict`。\n\n\n\n\n```java\n import java.util.*;\n\npublic class\
