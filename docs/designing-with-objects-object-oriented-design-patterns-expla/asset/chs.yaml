  \ `Range` 中使用了 `MagicSet`。在那里，`MagicSet` 被用于存储那些取符号值（而非数值值）的实例变量的所有可能值。然而，当前的演示代码在关于决定应为新学生分配哪个学院院的任何决策中，都没有使用这些符号值。如果你决定扩展演示代码，使得具有符号值的实例变量在学院院分配决策中发挥作用，你将会发现自己将更广泛地使用\
  \ `MagicSet` 存储。\n\n- 为了创建本章所示代码的更健壮版本，你可以尝试替换 `SortingHat` 类中的以下声明：\n\n```java\n\
  \ private MagicCollection<T> gryffindor = new MagicList<T>();\n\tprivate MagicCollection<T>\
  \ hufflepuff = new MagicList<T>();\n\tprivate MagicCollection<T> ravenclaw = new\
