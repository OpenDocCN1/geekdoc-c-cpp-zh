  \t}\n}\n```\n\n## 17.1 SortingHat 类\n\n我们现在在本节中介绍 `SortingHat` 类。这个类是“魔法的”，但这种魔法仅限于它知道如何动态决定为进入霍格沃茨的学生选择最佳排序标准。这个\
  \ Java 类足够智能，不会对每一批新生使用相同的排序标准。该类可以在运行时计算出最有效的标准，用于将一批新新生分配到四个学院中。\n\n扫描本节给出的类定义中的代码，其定义始于创建四个列表，用于存储分配在四个学院中的新生姓名。出于显而易见的原因，这些列表被命名为\
  \ `gryffindor`（格兰芬）、`hufflepuff`（赫奇奇）、`ravenclaw`（拉文隆）和 `slytherin`（斯莱林）。接下来我们定义了一个包含这四个列表的列表\
  \ `all houses`，它将在以后帮助我们遍历这四个学院列表。随后是一个用于初始化学院列表的匿名代码块。\n\n这进入了类的方法部分。其中第一个赋予了我们的\
  \ `SortingHat` 类“魔法”能力的方法：\n\n```\nfindDiscriminatingField()\n```\n\n该方法分析所有新生四项素质的数值分，并找到一个在将新生分配到四个学院方面具有最大判别能力的字段。回如前面提到的，如果所有新生在某项素质上（例如勇气素质，通过实例变量\
  \ `aptitudeForBravery` 衡量）的得分大同小异，那么尽管格兰芬多学院最看重勇气，勇气也将不再是一个可以用于学院分配练习的属性。因此，上述方法的目的是确定这四项素质中哪一项对于我们的目标具有最大的判别性。该方法的运行依赖于以下两个方法：\n\
  \n```\nlistAllNumericFields()\ngetRangeOfAttributeValues()\n```\n\n其中第一个方法 `listAllNumericFields()`\
  \ 简单地返回一个该类所有公共数值实例变量的数组，该类的实例存储在作为 `findDiscriminatingField()` 参数提供的容器中。在我们的案例中，这将是\
  \ `Fresher` 类。在我们的演示代码中，调用 `listAllNumericFields()` 会返回以下 `Fresher` 类实例变量的列表：\n\n\
  ```\naptitudeForBravery\naptitudeForWitAndKnowledge\nhowFairnessMinded\nhowGoalOriented\n\
  rankWeightedStrengthOfPreference\n```\n\n其中前四个是决定学生与四个学院之间匹配程度的素质。最后一个 `rankWeightedStrengthOfPreference`\
  \ 仅仅是为了编程方便。它出现在 `listAllNumericFields()` 方法的输出中，是因为正如你预期的那样，它是数值型的（而且因为它是公共的）。我们在\
  \ `Fresher` 类中声明 `rankWeightedStrengthOfPreference` 为公共，以便作为 `SortingHat` 类内部类的类\
  \ `MagicComparator` 能够轻松访问它。\n\n我们来看第二个方法 `getRangeOfAttributeValues()`，它是 `findDiscriminatingField()`\
  \ 依赖的。`getRangeOfAttributeValues()` 的任务是检查 `listAllNumericFields()` 返回的每个实例变量，并计算所有新生所取值的范围。随后，这些范围将用于\
  \ `findDiscriminatingField()` 来确定最具判别力的实例变量，即最具判别能力的素质。\n\n接下来我们考虑 `sortAndRank()`\
  \ 方法的实现。正如你所预期的，`sortAndRank()` 首先调用 `findDiscriminatingField()` 来找到四项素质中判别力最强的一个，然后调用\
  \ `java.util.Arrays.sort()` 对新生进行实际排序。为了确保排序程序使用判别力最强的素质，我们为 `sort()` 的第二个参数提供了一个内部类\
  \ `MagicComparator` 的实例，该类的构造函数接收了要使用的排序标准。\n\n```java\njava.util.Arrays.sort( (T[])\
  \ objArray, this.new MagicComparator<T>(field) );\n```\n\n其中 `objArray` 是新生列表的数组版本，我们需要使用\
  \ `this.new` 语法来创建内部内部类 `MagicComparator` 的实例（因为内部类不是静态的）。因此，为了创建这个内部类的实例，我们必须相对于外部类的实例来创建它。\n\
  \n\n\n\n对 `sortAndRank()` 的调用返回一个学生列表，该列表根据四种学院录取天赋中区分度最高的一项得分进行排序。对我们来说更重要的是，`sortAndRank()`\
  \ 还在每个代表学生的实例对象中，为特殊的实例变量 `rankWeightedStrengthOfPreference` 存储了一个值。\n\n该变量的值在新生最终分配到各个学院时起着重要作用，它是学生对所选学院表达的**偏好强度**与基于区分度最高天赋计算出的**排名**的乘积。这里的重点是，只有当学生在所有学生按区分度最高的天赋排序时，排名靠前，该学生的偏好强度才应该被赋予重要性。假设我们有一位新生表示想进入赫奇奇（Hufflepuff）学院，偏好强度为\
  \ 9（满分 10 分）。如果该新生在按区分度最高的天赋排序时排名很高——例如在 24 人中排第 2 名——那么 9 的偏好强度就应该具有高权重。但如果事实证明该新生排名靠底，例如在\
  \ 24 人中排第 23 名，那么他/她的偏好强度应该具有较低的权重。在第一情况下，我们在变量 `rankWeightedStrengthOfPreference`\
  \ 中存入值 `9*(24−2)*/24`；在第二情况下，我们在同一变量中存入值 `9*(24 − 23*/24`。\n\n在 `sortAndRank()`\
  \ 完成后，分院帽准备好将新生分配到各个学院。这是通过调用 `makeHousePlacements()` 实现的。该方法的作用是根据 `rankWeightedStrengthOfPreference`\
  \ 中存储的值对新生进行重新排序，以便兼考虑到新生表达的偏好以及他们在区分度最高的天赋得分。随后，`makeHousePlacements()` 只要心仪学院还有空间，就会按照“先来后得”的原则将新生分配到各个学院。“先来”一词是对在最终排序列表中排名靠前的生的非正式称呼。在最终排序列表中排名靠前的新生可能获得他/她选择的学院。相反，在最终排序列表中排名靠后的新生可能无法获得他/她选择的学院。记住，每个学院为新一批入学学生提供的名额是固定的。\n\
