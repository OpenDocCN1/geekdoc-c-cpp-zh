  \            System.exit(-1);\n        }\n    }\n}\n```\n\n* *\n\n## 9.11 部门类\n\n\
  如前提到的，魔法部分为几个部门，每个部门都有一个官方指定的负责人。正如你在下一节中看到的，`MinisterForMagic` 类定义包含一个实例变量，用于存储为部长工作的\
  \ `Department` 的引用。\n\n`Department` 的工作是执行与其领域相关的任务。要被聘用为 `Department`，巫师至少必须精通该领域，并且受过学校教育。\n\
  \n`Department` 通过调用类定义中显示的 `performTask()` 方法执行任务——被执行的任务作为参数传递的。该方法首先检查调用该方法执行任务的巫师。它通过调用类内部的\
  \ `isAllowedPerformTask()` 方法来实现。在完成此检查后，巫师通过念出一个由 `Execute` 单词后跟任务名字组成的咒语来改变所选的任务。为了特殊效果，下面的实现实际上通过语音合成器\
  \ `espeak()` 帮助发出咒语。对于不支持使用 `espeak` 进行语音合成的平台，`performTask()` 方法仅打印出对指定目标执行了任务的消息。\n\
