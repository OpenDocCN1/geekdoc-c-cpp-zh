  }\n}\n```\n\n***\n\n## 17.8 Iterator 接口\n\n下面显示了 `Iterator` 接口及其两个方法：`hasNext()`\
  \ 和 `next()`。正如我们之前提到的，最好将 `Iterator` 实例想象成指向对象之间的空间。通过这种想象，我们可以认为 `hasNext()` 在前方有对象时返回\
  \ true，然后通过 `next()` 返回该对象。\n\n***\n\n```\npublic interface Iterator<ItemType> {\n\
  \tItemType next();\n\tboolean hasNext();\n}\n```\n\n***\n\n## 17.9 Fresher 类\n\n\
  正如之前提到的，我们将进入霍格沃茨的一批新学生称为新生（freshers）。每个新生都是本节定义的 Java 类 `Fresher` 的实例。回想一下，我们演示的核心是创建一个新生集合并遍历该集合以将他们分配到四个学院中。\n\
  \n为了实现  17.6 节 中述的目标，我们需要为每个新生关联一组属性，在某种程度上衡量学生的勇气、正义感、公平感以及追求目标的专注能力。这正如早在  17.6\
  \ 节 中提到的，是通过你在类定义中看到的变量 `aptitudeForBravery`、`aptitudeForWitAndKnowledge`、`howFairnessMinded`\
  \ 和 `howGoalOriented` 完成的。显然，当我们从本节定义的类实例化一个新生时，需要为这些属性赋值。在不影响我们迭代器模式演示的情况下，我们将启动一个随机数生成器来为每个新学生产生这些值。\n\
  \n\n\n\n为新新生与能力相关的属性分配随机值确实带来了一个有趣的编程挑战——*对学生排序的标准无法提前设定。* 这是因为，从排序学生的角度来看，这些值的有效性直接取决于这些值所跨越的范围。重复\
  \ 第 17.6 节 中之前提到的内容，假设所有新新生在某项能力（例如，勇气能力）上的得分几乎相同，那么勇气能力在决定谁应该去何处学院时就失去了效力。因此，从编程的角度来看，我们必须首先确定四个能力相关属性中，哪一个对于将学生分配到各个学院包含的信息最多。*这只能在运行时完成。*\n\
  \n### 编程难度\n\n为了解释在编译时不知道如何对学生进行排序带来的编程难度，假设我们想通过调用 Java 的 `Arrays.sort()` 函数对学生进行排序。该函数要求我们提供一个\
  \ `java.util.Comparator` 对象，该对象需要知道如何比较任意两个学生。⁵ 然而，在我们的案例中，我们无法在编译时提供这样一个比较器对象，因为比较标准取决于四个能力相关属性中，哪一个在需要排序的新新生中表现出最大的差异。这些信息只有在我们为学生的不同能力相关属性分配了随机值后，在运行时才能知道。\n\
  \n我们需要一种能力来创建一个 `java.util.Comparator` 接口的动态实现，该实现取决于新生的四个能力相关属性中，哪一个对于排序当年的新学生最有效。正如我们在\
  \ 第 17.10 节 中的 `SortingHat` 类所示，这种 `java.util.Comparator` 接口的动态实现可以通过所谓的 *Java 反射*\
  \ 来。反射允许在运行时创建新的 Java 类或修改现有的 Java 类。\n\n### Fresher 类\n\n在下面所示的类定义中，在四个衡量新生相对于霍格沃茨学院能力的实例变量之后，我们还有以下两个实例变量，指示学生的个人学院偏好以及对该偏好的认同程度：`preferredHouse`\
  \ 和 `howStronglyPreferenceWanted`。下一个实例变量 `preferredHouseIndex` 是一个便利变量，它存储的信息与\
  \ `preferredHouse` 中存储的信息基本上相同。`preferredHouseIndex` 存储的是整数值（这些是 0 到 3 之间的整数，每个整数代表一个学院），而\
  \ `preferredHouse` 存储由 `Hogwarts_Info` 接口定义的 `HogwartsHouse` 枚举提供的学院实际符号名称。`preferredHouseIndex`\
  \ 中存储的整数与学院名称之间的映射关系如下：\n\n| `Griffyndor` | `=>` | `0` |\n| `Hufflepuff` | `=>`\
  \ | `1` |\n| `Ravenclaw` | `=>` | `2` |\n| `Slytherin` | `=>` | `3` |\n\n与学院名称相关的整数使得随机生成新生的初始学院偏好更加方便。\n\
  \n读者可能已经注意到，衡量新生对四个霍格沃茨学院能力的四个实例变量是公共的（public），而其他实例变量是私有的（private）。将能力相关变量保持公开的原因是为了让\
  \ 第 17.10 节 `SortingHat` 类中基于 Java 反射的逻辑可以直接访问（无需通过四个额外的“get”方法作为中介）。\n\n这把我们带到了类定义中的构造函数。根据我们之前的解释，构造函数使用随机数生成器为新学生的每个能力相关实例变量分配一个\
  \ 50 到 100 之间的值。⁶ 随后，构造函数通过随机选择一个 0 到 3 之间的整数，并将所选整数映射到学院的实际名称，来设置新生的学院偏好。使用 0 到\
  \ 9（包含边界）之间的随机数来设置所选学院偏好的认同强度。\n\n接下来我们有三个“get”方法和一个用于创建新生打印表示的 `toString()` 方法。这些方法的功能从它们的实现中显而易见。\n\
  \n### Main 方法\n\n这把我们带到了类中 `main()` 部分的代码。那里的代码由以下步骤组成，使用 第 17.7 节 中 `SortingHat`\
  \ 类的功能对对新生的 `MagicCollection` 进行排序：\n\n1. 我们首先创建一个 `SortingHat` 类的实例，名为 `sorter`。\n\
  2. 然后，我们创建一个包含所有新生的 `MagicList`，名为 `all freshers`，这些学生的名字在 `Hogwarts Info` 接口中声明。\n\
  3. 接下来，我们调用：\n```java\nsorter.makeInitialHousePlacements( all_freshers,\n      \
  \                          \"getPreferredHouseIndex\");\n```\n此调用仅仅是为了了解有多少学生对四个学院中的每一个表达了偏好。参数\
  \ `getPreferredHouseIndex` 使新生的学院偏好以 0 到 3 之间的整数形式返回，其中 0 代表格芬奇，1 代表赫奇奇，2 代表拉文劳，3\
  \ 代表斯莱特林。上述调用计算出的偏好计数通过调用以下代码显示在终端屏幕上：\n```java\nSystem.out.println( \"Initial house\
  \ counts: \"\n+ sorter.getHouseCounts() );\n```\n4. 现在我们要求 `SortingHat` 根据对霍格沃茨学院重要的最具区分能力的能力对新生进行排序：\n\
  ```java\nMagicCollection<Fresher> sortedFreshers = sorter.sortAndRank(\n       \
  \                         all_freshers,\n                                \"getHowStronglyPreferenceWanted\"\
  ,\n                                \"setRankWeightedStrengthOfPreference\" );\n\
  ```\n5. 现在 `SortingHat` 类准备好将学生分配到学院。这是通过调用以下实现的：\n```java\nsorter.makeHousePlacements(\
  \ sortedFreshers,\n                           \"getPreferredHouseIndex\",\n    \
  \                       \"rankWeightedStrengthOfPreference\");\n```\n在下一节对 `SortingHat`\
  \ 描述中，我们将描述上述方法调用是如何工作的以及为什么它除了排序后的新生列表还需要两个参数。\n\n`Fresher` 类的定义如下：\n\n* * *\n\n\
  \n\n\n```java\n public class Fresher implements Hogwarts_Info {\n\n\tpublic FresherName\
  \ name;\n\tpublic double aptitudeForBravery;\n\tpublic double aptitudeForWitAndKnowledge;\n\
  \tpublic double howFairnessMinded;\n\tpublic double howGoalOriented;\n\tprivate\
  \ int preferredHouseIndex;\n\tprivate HogwartsHouse preferredHouse;\n\tprivate int\
  \ howStronglyPreferenceWanted;\n\tpublic double rankWeightedStrengthOfPreference;\n\
  \n\tpublic Fresher( FresherName name ) {\n\t\tthis.name = name;\n\t\tthis.aptitudeForBravery\
  \ = 50 + (int) (50 * Math.random());\n\t\tthis.aptitudeForWitAndKnowledge =\n  \
  \                          50 + (int) (50 * Math.random());\n\t\tthis.howFairnessMinded\
  \ = 50 + (int) (50 * Math.random());\n\t\tthis.howGoalOriented = 50 + (int) (50\
  \ * Math.random());\n\t\tthis.preferredHouseIndex = (int) ( 4 * Math.random() );\n\
  \t\tthis.preferredHouse =\n                            HogwartsHouse.values()[ preferredHouseIndex\
  \ ];\n\t\tthis.howStronglyPreferenceWanted =\n                               (int)\
  \ (10 * Math.random() + 1);\n\t}\n\n\tpublic int getPreferredHouseIndex() {return\
