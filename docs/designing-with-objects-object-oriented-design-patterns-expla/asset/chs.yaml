  \n```\nendOfSummerHolidays()\n```\n\n```\ntravelToHogwarts()\n```\n\n```\nwelcomeCeremonyAtHogwarts()\n\
  ```\n\n这些每一个主要故事生成方法都依赖于故节生成器，正如读者在下一节看到的，这些生成器在抽象根类本身中只有 `null` 实现。这是因为故节生成器的行为每年都在变化；因此，必须为哈利·波特去霍格沃的每一年进行重写。例如，故事生成器\
  \ `endOfSummerHolidays()` 故事的故节方法是：\n\n```\nendOfSummerWithDursleys()\n```\n\n```\n\
  acquiringSchoolSupplies()\n```\n\n因此，虽然主故事生成器 `endOfSummerHolidays()` 每年必须调用，但正是上述两个故节方法的重写定义使故事特定于年份。我们的演示代码仅包含了哈利停留的前两年的重写定义。这两个年份由图\
  \ 23.1 所示的 `EndOfSummerYear1` 和 `EndOfSummerYear2` 类表示。（显然，我们可以以相同的方式为每年定义其余的具体类。）\n\
  \n此演示的可执行类是 `TestStoryGenerator`，也位于图 23.1。它的作用是创建 `EndOfSummerStories` 实例，然后根据用于创建\
  \ `EndOfSummerStories` 实例的具体子类查询相应的年份故事，你可以在第 23.10 节看到。\n\n## 23.7 叙事生成类的抽象根\n\n\
