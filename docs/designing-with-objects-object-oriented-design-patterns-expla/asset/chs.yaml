  , \"TeamFoul\", \"BroomTampering\", \"TamperingWithRefereeBroom\"};\n}\n```\n\n\
  ## 14.8 抽象类 Adjudicator\n\n由于是抽象类，该类的对象永远不会被实例化。然而，任何授权解决违规行为的人都预期是派生自该类的类型。如前所述，使\
  \ `Adjudicator` 能够将传入的违规请求转发给另一个 `Adjudicator` 的原因是以下两个事实：\n\n*   `Adjudicator`\
  \ 类通过以下声明配备了一个名为 `successors` 的实例变量：\n\n```java\nprotected List<Adjudicator> successors\
  \ = new ArrayList<Adjudicator>();\n```\n\n显然，`successors` 仅仅是 `Adjudicator` 类型实例的列表。如果责任链中的当前\
  \ `adjudicator` 必须将违规行为转发到下一层，我们在这里存储违规的接收者。例如，如果 `Referee` 看到一个违规行为，但认为超出了他的裁决范围，则\
  \ `Referee` 实例将将其转发给 `successors` 列表中列出的权威。这些权威是谁取决于 `Referee` 实例是如何创建的。当创建一个 `Referee`\
  \ 实例时，会为它的 `successors` 实例提供值，这些值是继承自 `Adjudicator` 父类的。\n\n*   所有参与魁地球比赛的类的构造函数都接受第二个参数，其中我们为\
  \ `successors` 实例变量提供一个或多个值。正如你将在第 14.10 节中看到的，每个不同类型的 `adjudicator` 都被赋予一组其授权解决的固定违规行为。这将通过在第\
  \ 14.10 节 `Adjudicator` 的具体子类中为变量 `violationsResolved` 分配值列表来实现。因此，虽然每个类型 `adjudicator`\
  \ 的权力是在编译时定义的，但解决特定玩家特定违规行为的 `adjudicators` 责任链是在运行时设置的，这在下一节介绍 `Player` 类时的讨论中将而易见。\n\
  \n读者可以看到，这个抽象类提供了三个不同的构造函数。这只是为了方便。第一个构造函数用于那些没有 `successors` 的 `Adjudicator` s。也就是说，责任将在此类\
  \ `adjudators` 实例处停止——但仅限于他们所了解的违规行为。如果此类 `Adjudicator` 接收到违规行为，但他/她没有能力处理该违规，则该违规将被视为不可解决。第二个构造函数用于为\
  \ `Adjudicator` 指定单个后继者的情况，第三个构造函数用于指定后继者列表的情况。\n\n注意谓词方法 `canResolveViolations()`。如果\
  \ `violationsResolved` 变量中的列表为空，且 `successors` 变量中的列表为空，我们说该 `Adjudicator` 将无法解决任何违规。注意\
  \ `resolveViolation()` 方法的实现。如果 `Adjudicator` 本身无法解决违规，则该违规将传递给每一个 `successors`。它将被由第一个能够处理它的后继者解决。\n\
  \n\n\n\n\n注意构造函数是如何为 `successor` 实例变量提供赋值的，每个 `Player` 都从父类 `Adjudicator` 继承了该变量。\n\
  \n`Player` 类定义中最重要的部分可能是 `resolveViolation()` 方法。在该方法的实现中，我们首先调用了为父类 `Adjudicator`\
  \ 定义的谓词 `canResolveViolations()`。如果这个继承的谓词发现 `successors` 列表为空，且继承的实例变量 `violationsResolved`\
  \ 中的违规列表也为空，它将返回 `false`。随后，它会检查相关的违规行为是否包含在继承的实例变量 `violationsResolved` 存储的列表中。与我们在下一节中介绍的\
  \ `Adjudicator` 其他具体子类的定义不同，`Player` 类并没有提供一个名为 `violationsResolved` 的静态变量。因此，它继承了该重要变量的空列表默认值。这意味着一个\
  \ `Player` 实例——即使他/她是（比如）队队长——也不允许解决任何违规行为，即使这些是队内违规行为。\n\n基于上述事实，当在 `Player` 实例上调用\
  \ `resolveViolation()` 时，控制将转移到下方所示实现的第 (A) 行。这可能会让读者好奇，为什么我们没有为该方法提供更短的定义（即不包含到第\
  \ (A) 行代码的定义）。其目的是让有进心的读者能够扩展演示代码，允许某些玩家解决某些队内违规行为（参见第 14.12 节）。\n\n关于第 (A) 行的 `if`-`else`\
  \ 子句，调用 `resolveViolation()` 首先通过调用为父类 `Adjudicator` 定义的方法的实现来处理违规。如果父类中的代码无法解决相关的违规，则声明该违规无法由所有在运行时被引入某场魁地地球比赛责任链的人来解决。\n\
  \n* * *\n\n```\n import java.util.*;\n\npublic class Player extends Adjudicator\
  \ {\n\tprivate String role; // must be one of Chaser,\n\t\t// Beater, Seeker, and\
  \ Keeper\n\tpublic Player( String name, String role, Adjudicator successor ) {\n\
  \t\tsuper(name, successor);\n\t\tthis.role = role;\n\t}\n\tpublic Player( String\
  \ name, String role,\n\t\t\t\tList<Adjudicator> successors ) {\n\t\tsuper(name,\
  \ successors);\n\t\tthis.role = role;\n\t}\n\tpublic boolean resolveViolation( int\
  \ vio ) {\n\t\tif ( !canResolveViolations() ) {\n\t\t\tSystem.out.println( \" It\
  \ is not possible to resolve \"\n\t\t\t\t+ \"this violation\" );\n\t\t\treturn false;\n\
  \t\t} else if ( violationsResolved != null &&\n               violationsResolved.contains(\
  \ new Integer(vio) ) ) {\n\t\t\tSystem.out.println( \" Violation \" + printViolation[vio]\n\
  \t\t\t\t+ \" resolved by the \" + this + \" \" + name );\n\t\t\treturn true;\n\t\
  \t} else {\n\t\t\tif ( super.resolveViolation(vio) ) // (A)\n\t\t\t\treturn true;\n\
  \t\t\telse {\n\t\t\t\tSystem.out.println( \" The violation \"\n\t\t\t\t+ printViolation[vio]\
  \ + \" cannot be resolved\" );\n\t\t\t\treturn false;\n\t\t\t}\n\t\t}\n\t}\n}\n\
  ```\n\n* * *\n\n## 14.10 具有违处理权的类\n\n我们从 `Referee` 类开始。注意与 `Player` 类不同，`Referee`\
  \ 类提供了自己的自己的静态变量 `violationsResolved`，该变量存储了 `Referee` 允许自己解决的违规列表。正如之前在第 14.8 节\
  \ 中提到的，这相当于对每种类型的 `Adjudicator` 的违规处理权限范围进行编译时声明。因此，虽然每个裁员的权力是在编译时声明的，但为特定违规行为服务的裁员列表是在运行时创建的。\n\
  \n同时请注意，`Referee` 的 `resolveViolation()` 方法的实现比 `Player` 类或父类 `Adjudicator` 得多。该类中的实现在静态变量\
  \ `violationsResolved` 中查找相关的违规。如果在列表中找到了该违规，我们的工作就完成了，可以认为 `Referee` 能够自己解决该违规。否则，我们将违规转发给父类的\
  \ `resolveViolation()`，在该类中，我们只需遍历由实例变量 `successors` 指向的每个后续者，并检查其中任何一个是否可以处理该违规。我们在首次成功解决违规时停止。\n\
  \n* * *\n\n```\n import java.util.*;\n\npublic class Referee extends Adjudicator\
  \ {\n\tprivate static List<Integer> violationsResolved =\n\tnew ArrayList<Integer>(\
  \ Arrays.asList( Blatching, Cobbing,\n\t\tQuaffleocking, Haversacking, Stooging,\n\
  \t\tBlurting, Bumphing );\n\tpublic Referee( String name, Adjudicator successor\
  \ ) {\n\t\tsuper( name, successor );\n\t}\n\tpublic Referee( String name, List<Adjudicator>\
  \ successors ) {\n\t\tsuper( name, successors);\n\t}\n\tpublic boolean resolveViolation(\
  \ int vio ) {\n\t\tSystem.out.println( \" Violation handed over to \" + this );\n\
  \t\tif ( violationsResolved.contains( new Integer(vio) ) ) {\n\t\t\tSystem.out.println(\
  \ \" Violation \" + printViolation[vio]\n\t\t\t\t+ \" resolved by the \" + this\
  \ + \" + name );\n\t\t\treturn true;\n\t\t} else {\n\t\t\treturn super.resolveViolation(vio);\n\
  \t\t}\n\t}\n}\n```\n\n* * *\n\n接下来我们介绍 `Teacher` 类。除了名称及其产生的影响，该类的定义与 `Referee`\
  \ 类完全相同。因此，针对 `Referee` 类的所有注释也适用于此类。\n\n```\n import java.util.*;\n\npublic class\
  \ Teacher extends Adjudicator {\n\n\tprivate static List<Integer> violationsResolved\
  \ =\n\t\tnew ArrayList<Integer>( Arrays.asList(\n\t\t\tFailureToReturnAfterTimeout\
  \ ));\n\n\tpublic Teacher( String name, Adjudicator successor ) {\n\t\tsuper( name,\
  \ successor );\n\t}\n\tpublic Teacher( String name, List<Adjudicator> successors\
  \ ) {\n\t\tsuper( name, successors );\n\t}\n\tpublic boolean resolveViolation( int\
  \ vio ) {\n\t\tSystem.out.println( \" Violation handed over to \" + this );\n\t\t\
  if ( violationsResolved.contains( new Integer(vio) ) ) {\n\t\t\tSystem.out.println(\
  \ \" Violation \"\n\t\t\t\t+ printViolation[vio] + \" resolved by the \"\n\t\t\t\
  \t+ this + \" \" + \"Professor \" + name );\n\t\t\treturn true;\n\t\t}\n\t}\n}\n\
  ```\n\n\n\n\n\n```java\n import java.util.*;\n\npublic class DeputyHeadmaster extends\
  \ Adjudicator {\n\n    private static DeputyHeadmaster unique;\n\n    private final\
  \ static List<Integer> violationsResolved =\n        new ArrayList<Integer>( Arrays.asList(\
  \ BroomTampering ) );\n\n    private DeputyHeadmaster( String name, Adjudicator\
  \ successor ) {\n        super( name, successor );\n    }\n    // Enforce the condition\
  \ that there can only\n    // be one Assistant Headmaster:\n    public static DeputyHeadmaster\
  \ makeInstanceOfDeputyHeadmaster(\n                String name, Adjudicator successor){\n\
  \        if ( unique == null )\n            unique = new DeputyHeadmaster( name,\
  \ successor );\n        return unique;\n    }\n    public DeputyHeadmaster(String\
  \ name,List<Adjudicator> successors){\n        super(name, successors);\n    }\n\
  \    public boolean resolveViolation( int vio ) {\n        System.out.println( \"\
  \ Violation handed over to \" + this );\n        if ( violationsResolved.contains(\
  \ new Integer(vio) ) ) {\n            System.out.println( \" Violation \"\n    \
  \            + printViolation[vio] + \" resolved by the \" + this\n            \
  \                + \" \" + \"Professor \" + name );\n            return true;\n\
  \        } else {\n            return super.resolveViolation(vio);\n        }\n\
  \    }\n}\n```\n\n***\n\n这介绍了本节的最后一个类，`Headmaster` 类。这个类与我们刚刚介绍的 `DeputyHeadmaster`\
  \ 类相似，相似之处在于它的实现也是基于单例模式的——原因与 `DeputyHeadmaster` 类完全相同。然而，这两个类之间有一个重要的区别：`Headmaster`\
  \ 类的构造函数只接受一个参数，即校长的名字；而 `DeputyHeadmaster` 构造函数接受两个参数，一个名字，另一个是继任者。我们对该模式的演示基于这样一个假设：处理魁地球违规行为的责任链的最终终点是校长。这意味着占据这一职位的巫师不会有继任者。\n\
  \n***\n\n```java\n import java.util.*;\n\npublic class Headmaster extends Adjudicator\
  \ {\n\n    private static Headmaster unique;\n    private final static List<Integer>\
  \ violationsResolved =\n        new ArrayList<Integer>(\n            Arrays.asList(\
  \ UsingWandToEnchantDuringPlay ));\n    private Headmaster( String name ) {\n  \
  \      super( name );\n    }\n    // Enforce the condition that there can only be\
  \ one Headmaster:\n    public static Headmaster makeInstanceOfHeadmaster( String\
  \ name ) {\n        if ( unique == null ) unique = new Headmaster( name );\n   \
  \     return unique;\n    }\n    public boolean resolveViolation( int vio ) {\n\
  \        System.out.println( \" Violation handed over to \" + this );\n        if\
  \ ( violationsResolved.contains( new Integer(vio) ) ) {\n            System.out.println(\
  \ \" Violation \"\n                + printViolation[vio] + \" resolved by the\"\n\
  \                    + this + \" \" + \"Professor \" + name );\n            return\
  \ true;\n        }\n        return false;\n    }\n}\n```\n\n***\n\n## 14.1 测试代码\n\
