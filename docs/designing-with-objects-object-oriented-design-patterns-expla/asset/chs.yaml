  \ *.java\n```\n\n并执行 `Hogwarts` 类：\n\n```\njava Hogwarts\n```\n\n根据 `main()` 中的代码，这将产生以下输出：\n\
  \n> 奇洛洛·奇洛翘\n> 紧张不安；戴着头巾以隐藏在脑后的伏魔面孔\n> 被伏魔附身，在地下室与哈利·波特战斗\n> 在伏魔逃离他的身体时死亡\n> 吉德洛德·洛哈特\n\
  > 写过几本关于魔法的书\n> 莱姆斯·卢平\n> null\n\n为了获得更多见解，你可以考虑沿着以下方向扩展此模式的代码：\n\n*   记得 `changeState()`\
  \ 方法（首次在 21.7 根接口 `DADA_State` 中声明，然后在 21.8 的每个具体状态类中实现），它捕捉了允许的状态转换。这样一来，每个具体状态类在需要离开其所代表的状态时知道下一个状态。表示状态转换的另一种方法是将根\
  \ `DADA_State` 声明为抽象类，并让它在一个地方包含所有的状态转换，就像我们在中者模式演示中所做的那样。尝试创建一个基于这种其他方法的实现。\n\n\
  *   在 21.7 根接口 `DADA_State` 中定义的问题列表对于我们据称的演示目标的问答教育工具来说还非常简陋。如何扩展这个列表以增强该模式演示的威力呢？\n\
  \n\n\n\n\n不言而喻，如果你追求一个困难的目标，在沿途中将会遇到挑战。\n\n举例来说，考虑一位刚被大学录年轻女性，她的目标是获得学士学位。为了实现这一目标，她显然必须克服大量问题，其中最重要的一点是在课程中表现优异，并确保自己有足够的资金来支付学费以及住宿费。如果她被要求通过兼工来分担部分教育费用，她就需要每周的工作时长与课业负担之间取得平衡。考虑到时间上的竞争性需求，她显然需要制定一个`strategy`，以便以最佳方式实现最终目标。\n\
  \n有趣的是，在大多数情况下，这类学生对于每个预期会遇到的问题，可行的解决方案数量其实相当少。例如，就工作花费的时间而言，可行的解决方案可能被归类为“四分之一时间的工作”、“半职工作”等。同样，关于每学期承担多大学业负担的问题，解决方案体现在她应该选修学分数上。当她为这些每个问题选择一个解决方案时，所有的解决方案组合在一起就构成了她该学期的`strategy`。由于可用策略的总数可能很小（这一点在你很快就会看到的`Strategy\
  \ pattern`中起着重要作用），学生在每个学期开始之前，应该能够容易地分析（意识地或无意识地）学期的可用策略，并选择最适合该学期的一个。\n\n总来说，`strategy`是你追求目标过程中将面临的每个问题的解决方案选择的组合。也就是说，如果你预计在实现目标的途中会遇到\
  \ `N` 个问题，并且对如何解决这些每个问题做了选择，那么这 `N` 个解决方案组合在一起就构成了你实现目标的`strategy`。通常，存在多种实现目标的策略，你将根据自己的能力和资源选择其中一种。\n\
  \n## 22.2 意图与适用性\n\n对于涉及多个步骤且解决方案具有可选性的问题，`Strategy pattern`的意图是首先定义一个包含通用策略的抽象根类（abstract\
  \ root class）。随后，派生自根类的子类将为通用策略中列出的各个步骤提供特定策略的重写（overrides）。\n\n在以下情况下，你应该考虑使用这种模式：\n\
  \n*   你的代码解决的整体问题是复杂的——意味着它由多个步骤组成，并且处理这些步骤时存在选择；\n*   将整体问题的不同步骤的具体解决方案选择串联起来可以被描述为一种策略；\n\
  *   你可以构出一个通用的整体策略，这可能仅仅是对必须处理各个步骤的顺序的声明。\n*   你可以将一个通用的整体策略放在抽象根类中，然后让其特定的策略子类为问题的各个步骤提供重写。\n\
  \n## 22.3 策略模式简介\n\n`Strategy pattern` 解决了当需要解决的问题复杂且需要多步解决方案时，如何最好组织代码的问题——*特别是当处理单个步骤时存在多种选择时。*在这些情况下，将所有代码堆在一起会导致软件主体需要频繁地进行条件评估，以确定为整体解决方案中的每个步骤做出最佳选择。这样的代码可能难以理解、调试和维护。\n\
  \n现在考虑这样一种情况：处理每个步骤的各种备选方案可以组织成少数的几类（categories）。只要这些类别代表了完成工作的备选方法，我们就可以从在本章开头部分所定义的意义上，将它们称为策略。如果每个策略都可以单独分离成一个类，并且每个此类类都是一个接口的实现，而该接口的方法声明代表了整体解决方案的各个步骤，那么我们可能会得到一种更容易理解、调试和维护的代码。这种方法等同于`Strategy\
  \ pattern`的实现。\n\n如图 22.1 所示，`Strategy pattern`向我们展示了如何实现实现目标的运行时策略选择。你首先根据在实现目标过程中预期遇到的各种问题的抽象方法调用来制定一个通用策略。当该策略通过特定具体策略类的实例在运行时执行时，通用策略中的方法调用将根据根据所选具体策略类中的实现代码进行执行。通过这种方式，你根据某些指示实现目标所需的可用“能力”和“资源”的运行时参数，将一个通用策略定制为一个具体的策略。\n\
  \n![image](img/c22f001.gif)\n\n`图 22.1**\n\n## 22.4 现实应用中的策略模式\n\n从所实现的代码组织来看，`Strategy\
  \ pattern`所实现的效果与上一章介绍的`State pattern`所实现的效果非常相似。如果你发挥想象，将每个状态代表一种策略，你就能看到这两种模式之间概念上的相似性。因此，我们为`State\
  \ pattern`描述的所有现实应用，也可能通过`Strategy pattern`来实现。\n\n尽管`State pattern`和`Strategy pattern`之间存在相似性，但它们之间存在一个重要的区别——那就是`State\
  \ pattern`案例中状态转换的概念。通常情况下，每当谈论系统处于某种状态时，往往也会谈论系统从一个状态转换到另一个状态。例如，回想上一章[21.4 节](#c21.xhtml_head-c21-4\
  \ 如何用`State pattern`对业务事务服务器进行建模。在那里提到，业务事务按照特定的顺序从一个状态进入另一个状态——从客户选择商品的第一个状态直到他提供送货信息的最后一个状态。基于`State\
  \ pattern`的软件实现可能会自动检测每个状态的结束，然后根据系统允许的状态转换将系统置于下一个状态。*状态转换的概念对于策略模式并不相关。*`Strategy\
  \ pattern`的目的仅仅是根据你选择的策略，从一组输入条件引导到输出。当达到输出时所处的情况通常不利于由其他一个策略进行进一步处理。\n\n\n\n\n\
  考虑一个软件系统，其中一组类必须协作以实现某个目标。然而，从这些类中调用的功能可能取决于实现目标时可用的硬件和软件资源。如果这些类足够丰富——也就是说，它们可以提供通往相同终点的不同方式，且选择取决于可用资源——那么你应该能够使用**策略模式**（Strategy\
  \ pattern）来编排类与类之间的运行时交互。\n\n## 22.5 用《哈利·波特》故事说明策略模式\n\n我们对策略模式的演示基于三三夺赛的第二个任务，该任务是在参赛的各个学校中选出最优秀的年轻男巫或女巫。通常情况下，三所魔法学校的每一所在比赛中都由一名冠军代表。所有想要参赛的学生都被允许将名字投入火焰之杯，在一个指定的日期，火焰之杯会为每所学校选出作为该校锦赛冠军的学生。冠军们将在由包括参赛学校校长组成的委员会选定的三个任务中进行竞争。\n\
  \n1994 年，三夺赛的常规规则被打破了，因为巴蒂·小翘翘二（他当时伪装成防御性黑术教授奇洛拉斯·穆迪）在火焰之杯上施加了魂魂咒，导致火焰之杯相信今年将有四个学校参加比赛。由于巴蒂·小翘翘二也将哈利·波特的名字放入了火焰之杯，而且哈利是唯一与第四所虚构学校相关的人，火焰之杯吐出了他的名字作为第四个冠军——这让所有人大吃一惊。由于火焰之杯吐出名字构成了一个约束学生必须参赛的魔法合同，哈利·波特别选择参加锦标赛。结果，比赛中有四位冠军在竞争：代表布卫巴伏魔法学院的芙蓉·德拉拉尔、代表德姆斯兰学院的维克多·克格姆，以及代表霍格沃茨的塞德里克·迪格高里和哈利·波特。\n\
  \n对于第二个任务——本章的演示代码正是基于此任务——冠军们被告知，他们在第一个任务中取回的金蛋将为他们提供完成任务所需行动的线索。虽然这听起来很简单，但问题在于，当冠军们打开蛋时，它只是哀嚎和尖叫，完全毫无意义。因此，冠军们面临的首要挑战是设法如何让蛋展示出它包含的线索。事实证明，至少对哈利·波特来说，这个谜是由塞德里克·迪格高告诉他如何让蛋配合的——通过在水下打开它。塞德里克从防御性黑术教授奇洛拉斯·穆迪（实际上是伪装成穆迪的巴蒂·小翘翘二）那里获得了信息，他是一个正直的人。觉得自己必须与哈利分享这个关键信息，以报哈利在第一个任务中的帮助。尽管塞德里克出于最好的意图分享了信息，但讽刺的是，这正是巴蒂·小翘翘二希望他所做的，这样哈利就不会退出锦标赛。\n\
  \n至于蛋揭示的线索，上面说冠军们必须在水下游到霍格沃茨大湖（被称为黑湖）下的人鱼村，从那里那里带回一个与他们亲近的人，并在一小时内完成。因此，冠军们面临的下一个重大挑战是设法如何在水下长时间游泳。正是锦标赛的这一特定部分——解决长时间水下游泳的问题——被我们用于在策略模式演示中命名不同的策略。\n\
  \n冠军们为水下游泳选择了不同的解决方案。塞德里克·迪格高里和芙蓉·德拉拉尔都决定使用“气泡咒”（Bubble Head Charm），这意味着在水下用一个气泡包住头部。另一方面，维克多·克格姆选择了“变形术”（Transfiguration），这意味着在比赛期间把自己变成一种海洋生物——维克多选择变成一条鲨鱼。（对维克多不幸的是，他的变形只部分成功；只有他的头部变成了鲨鱼，身体其他部分保持不变）。最后，哈利·波特决定吃“水鳃草”（gillyweed），这使他长出了用于在水下呼吸的鳃和用于游得更快的鱼鳍。哈利是如何想到出这个主意的，那是一个独立的故事，我们在这里不作详述。\n\
  \n关于本章介绍的演示，重要的是每个解决水下呼吸问题的解决方案都影响了解决第二个任务时涉及的其他问题。这些其他问题包括抵御格灵怪（grindylows，这些是长着手指的小魔法生物，它们用手指来捕获猎物）、寻找人鱼村和村里的人质、释放被绑在石头人鱼尾巴上的人质（这意味着要切断系住人质的绳子）等等。例如，由于变形成了鲨鱼，维克多·克格姆无法利用他的鲨牙来切断系住赫敏·格兰杰绳子，而赫敏是他应该从湖下取回的“物体”。哈利不得不注意到附近一块带有尖角的石头，那石头替哈利完成了工作，现在可以供维克多使用。\n\
  \n在我们的演示代码中，我们将用于水下呼吸的方法来命名策略，因为这是完成锦标赛第二个任务的基础。然而，策略将包括解决完成锦标赛第二个任务过程中遇到的所有问题的解决方案。冠军是否能够执行策略中的解决方案，取决于他/她的能力以及所拥有的资源。\n\
  \n## 22.6 模式演示的顶层视图\n\n策略模式教我们如何制定一种“即插即用”的方法，在运行时选择实现目标的具体策略。通过这种模式，我们首先通过根抽象策略类中的通用方法声明来构建实现目标的通用抽象策略。随后，通过运行时选择的具体策略类，我们获得一个根据可用能力和资源的最佳解决方案。\n\
  \n图 22.2 展示了我们策略模式演示的类图。特别注意作为三个具体策略类父类的抽象类 `StrategyAbstractRoot` 所起的作用。父类声明了并为了编程方便，为所有具体策略类必须具备的功能提供了默认定义。在所有具体策略类中，选择策略意味着选择一种水下呼吸的方法、一种抵御格灵怪的方法、寻找人鱼村和村里人质的方法、一种切断系住人质的石头鱼绳子的方法，以及最后一种在人鱼试图阻止安全带回人质时处理的方法。\n\
  \n\n\n\n冠军选择的特定策略显然取决于该冠军的能力。例如，如果一个冠军不知道如何执行变形（transfiguration），那么该冠军就无法使用 `Transfiguration`\
  \ 策略。同样，如果一个冠军不知道摄入人鱼草（gillyweed）可以长出在水下呼吸的鳃，那么该冠军根本就不会考虑过使用 `Gillyweed` 策略。\n\n\
  因此，为了本次演示，我们能够指定某个冠军是否具备解决任务中每个问题的条件至关重要。这就是 `Champion` 类的用场。该类配备了一组布尔属性，其真值表示冠军是否能够解决将要遇到的问题。尽管为了保持演示的简单性，我们在\
  \ `Champion` 类中将所有这些属性的默认值都设置为 `true`；在构造特定的冠军实例时，我们可以根据他/她的个人能力和方案选择为每个冠军自定义这些属性。`Champion`\
  \ 类配有 `set` 方法，可以更改这些布尔实例变量的默认值。\n\n为了理解代码的整体结构以及读者需要理解的图 22.2 中不同类之间的关系，读者需要理解以下三个实体之间的关系：(1)\
  \ *问题*（problems）；(2) 在根策略类 `StrategyAbstractRoot` 中声明的*方法*（methods）；以及(3) *策略*（strategies）。*问题*是冠军在执行锦赛第二个任务时遇到的，其中第一个问题是水下呼吸。`StrategyAbstractRoot`\
  \ 类中声明的*方法*用于为问题提供解决方案。这些方法返回字符串，说明在给定策略下如何解决问题。最后，*策略*由解决方案组成，这些解决方案就是为根策略类中声明的方法所提供的描述。\n\
  \n如果读者对冠军在锦赛第二个任务中面临的问题在我们的演示代码中存储在哪里感兴趣，它们就在 `StrategyAbstractRoot` 类中。你将在下一节中看到的该类的\
  \ `HashMap` 容器 `problemSequencer` 定义了第二个任务的所有问题。\n\n锦赛第二个任务的整体执行由客户端类 `SecondTaskManager`\
  \ 协调。正如读者稍在第 22.10 节中看到的，这种协调是以下两个方法之间的相互作用：`SecondTaskManager` 类的 `executeTask(champion)`\
  \ 方法和 `StrategyAbstractRoot` 类（所有具体策略类的父类）的 `invokeSolution(problem, champion)`\
  \ 方法。`executeTask()` 方法按照 `StrategyAbstractRoot` 类中 `getNextProblem()` 方法确定的顺序处理每个问题，并通过调用同一类的\
  \ `invokeSolution()` 来寻求其解决方案。\n\n希望读者能从这个对演示的顶层描述中看出，当你有多种实现某目标的不同策略，且所有策略都可以用一组相同的方法来描述（而这些方法在不同策略中通常具有不同的实现）时，策略模式是非常有用的。在这种情况下，我们可以定义一个抽象根策略类，并为其配备上述方法的声明。包含方法实现代码的具体策略类可以从该抽象根策略类派生出来。这允许通过抽象根策略类中的方法声明，以通用的方式描述实现目标的解决方案。在运行时为具体策略类实例创建的动态绑定，可以为该特定策略定制通用解决方案。\n\
  \n关于仅根据根类 `StrategyAbstractRoot` 中的问题解决方法声明就能创建的*通用解决方案*，在接后的材料中，读者应该密切关注根策略类的 `invokeSolution()`\
  \ 方法与 `SecondTaskManager` 类的 `executeTask()` 方法如何协同工作，从而为我们提供*到达目标的通用解决方案*——在我们的案例中，即让冠军从霍格沃黑湖下的的人鱼村中营救人质。\n\
  \n## 22.7 策略的抽象根类：StrategyAbstractRoot\n\n上一节中提到的很多内容涉及在本节中介绍的类的设计。这是因为该类在我们的演示中起着核心作用。\n\
  \n关于下方所示的实现代码，回想上一节，根策略类 `StrategyAbstractRoot` 的主要目的是声明这些方法，这些方法组合在一起定义了一个通用策略。这些方法在\
  \ true 类的最后五个语句中声明。纯粹为了编程方便，我们还为这些方法提供了默认实现——它们都返回 `null`。也就是说，默认情况下，除非具体策略为该方法提供了重写实现，否则它不会为该方法提供非空解决方案。\n\
  \n为了实现锦赛目标的任务执行，我们需要按照冠军遇到问题的顺序处理这些问题，其中第一个问题显然是水下呼吸。这些问题的排序是由类定义中所示 `HashMap` `problemSequencer`\
  \ 和方法 `getNextProblem()` 调节的。\n\n`invokeSolution(problem, champion)` 方法告诉我们冠军如何解决作为其第一个参数提供的问题。只有当冠军有能力解决相关问题时，该方法才会返回非空值（实际上是一个指示在调用该方法的策略下如何解决问题的字符串）。因此，你可以说\
  \ `invokeSolution()` 方法是 `Champion` 类与 `Strategy` 类之间的联系。\n\n\n\n\n\n```java\n import\
  \ java.util.*;\n\npublic abstract class StrategyAbstractRoot {\n\n\tprotected Champion\
  \ competitor;\n\tprotected String firstProblem = \"breathingUnderwater\";\n\n\t\
  protected static Map<String,String> problemSequencer =\n\t\t\tnew HashMap<String,String>();\n\
  \n\t{\n\t\tproblemSequencer.put(\"breathingUnderwater\",\n\t\t\t\t\"keepingGrindylowsAtBay\"\
  );\n\t\tproblemSequencer.put(\"keepingGrindylowsAtBay\",\n\t\t\t\t\"locatingHostage\"\
  );\n\t\tproblemSequencer.put(\"locatingHostage\", \"freeingHostage\");\n\t\tproblemSequencer.put(\"\
  freeingHostate\",\n\t\t\t\t\"dealingWithMerpeople\");\n\t}\n\tpublic static String\
  \ getNextProblem( String problem ){\n\t\treturn problemSequencer.get(problem);\n\
  \t}\n\tpublic String invokeSolution(String problem, Champion champ) {\n\t\tif (problem\
  \ == \"breathingUnderwater\"\n\t\t\t\t&& champ.getHasSolutionForBreathingUnderwater()\
  \ ) {\n\t\t\treturn this.breathingUnderwater();\n\t\t} else if (problem == \"keepingGrindylowsAtBay\"\
  \n\t\t\t\t&& champ.getHasSolutionForKeepingGrindylowsAtBay() ) {\n\t\t\treturn this.keepingGrindylowsAtBay();\n\
  \t\t} else if (problem == \"locatingHostage\"\n\t\t\t\t&& champ.getcanLocateHostage()\
  \ ) {\n\t\t\treturn this.locatingHostage();\n\t\t} else if (problem == \"freeingHostage\"\
  \n\t\t\t\t&& champ.getCanFreeHostage() ) {\n\t\t\treturn this.freeingHostage();\n\
  \t\t} else if (problem == \"dealingWithMerpeople\"\n\t\t\t\t&& champ.getCanDealWithMerpeople()\
  \ ) {\n\t\t\treturn this.dealingWithMerpeople();\n\t\t} else {\n\t\t\treturn null;\n\
  \t\t}\n\t}\n\tpublic String getFirstProblem() { return firstProblem; }\n\tpublic\
  \ String breathingUnderwater(){ return null; }\n\tpublic String keepingGrindylowsAtBay()\
  \ { return null; }\n\tpublic String locatingHostage() { return null; }\n\tpublic\
  \ String freeingHostage() { return null; }\n\tpublic String dealingWithMerpeople()\
  \ { return null; }\n}\n```\n\n## 22.8 具体策略类\n\n本节介绍了源自上一节抽象根基类的三个具体策略类。\n\n我们首先介绍\
  \ `BubbleHeadCharmStrategy`，它是根基类 `StrategyAbstractRoot` 的具体扩展。该具体类代表了塞德里克·迪戈戈（Cedric\
  \ Diggory）和芬·德拉拉尔（Fleur Delacour）用于水下呼吸以及解决从水下人鱼村营质质其他问题的策略。\n\n至于根类 `StrategyAbstractRoot`\
  \ 中问题解决方法的重写实现，我们展示的是每个解决方案内容的简单字符串声明。显然，这些重写定义可以做得更详尽——但风险是分散我们对演示重点的注意力，即展示各个类如何相互作用以实现策略模式所需的行为。\n\
  \n回想一下，具体策略类继承了根策略类的类型为 `Champion` 的实例变量 `competitor` 和类型为 `String` 的 `firstProblem`。从根类继承的还有\
  \ `HashMap` 容器 `problemSequencer` 和方法 `getNextProblem()`。这些继承的实例变量和方法允许 `SecondTaskManager`\
  \ 类使用具体策略（如下所示）来编排冠军执行锦赛第二项任务的行为。在这种编排中起着重要作用的是 `invokeSolution()` 方法，该方法也被下类继承自\
  \ `StrategyAbstractRoot`。如第 22.6 节所述，第二项任务执行的整体编排是通过 `SecondTaskManager` 类的 `executeTask()`\
  \ 与下类从根继承的 `invokeSolution()` 方法之间的相互作用实现的。这种相互作用将在你在第 22.10 节看到 `SecondTaskManager`类的实现后变得清晰。所示是\
  \ `BubbleHeadCharmStrategy` 类的定义，及其对根抽象策略问题解决方法的重写实现。\n\n```java\n public class\
  \ BubbleHeadCharmStrategy extends StrategyAbstractRoot {\n\tpublic String breathingUnderwater()\
  \ {\n\t\treturn \"Create a magical bubble of air around your head \" + \"for underwater\"\
  ;\n\t}\n\tpublic String keepingGrindylowsAtBay() {\n\t\treturn \"Stay clear of grindylows\"\
  ;\n\t}\n\tpublic String locatingHostage(){\n\t\treturn \"Ask underwater creatures\
  \ for help with the \" + \"directions\";\n\t}\n\tpublic String freeingHostage()\
  \ {\n\t\treturn \"The rope used to tie the hostage may not be that \" + \"easy to\
  \ untie. Cut it with a sharp rock.\";\n\t}\n\tpublic String dealingWithMerPeople()\
  \ {\n\t\treturn \"Threaten merpeople by pointing the wand at them if \" + \"necessary\"\
  ;\n\t}\n}\n```\n\n接下来我们定义具体策略类 `GillyweedStrategy`，它再次扩展了根类 `StrategyAbstractRoot`。哈利·波特（Harry\
  \ Potter）正是这种策略来进行水下呼吸，并解决他在黑湖底部拯救罗·韦斯莱（Ron Weasley）以及芬·德拉拉尔的妹妹加布里埃（Gabrielle）时遇到的其他问题。由于所示类中的代码与上方所示相似，我们将不再对其进行评论，除非再次提到下类继承自根策略类的\
  \ `invokeSolution()` 方法与我们在 `SecondTaskManager` 类中定义的 `executeTask()` 方法之间的相互作用。这种相互作用用于：首先根据根策略类中的方法规范一个通用的实现目标的解决方案；随后通过下文所示的具体策略对该解决方案进行运行时自定义。如前所述，第\
  \ 22.10 节将使这种相互作用更加清晰。\n\n```java\n public class GillyweedStrategy extends StrategyAbstractRoot\
  \ {\n\n\tpublic String breathingUnderwater() {\n\t\treturn \"Eat gillyweed just\
  \ prior to entering water\";\n\t}\n\tpublic String keepingGrindylowsAtBay() {\n\t\
  \treturn \"Cast the Relashio spell on grindylows; Ordinarily \" + \"this spell releases\
  \ a shower of fiery sparks from \" + \"the tip of the wand and attack the enemy;\
  \ \" + \"Underwater, the wand releases jets of boiling \" + \"water.\";\n\t}\n\t\
  public String locatingHostage(){\n\t\treturn \"Ask magical creatures underwater\
  \ for directions \" + \"especially Moaning Myrtle\";\n\t}\n\tpublic String freeingHostage()\
  \ {\n\t\treturn \"Use a sharp rock to the cut the ropes used to tie \" + \"the hostage\"\
  ;\n\t}\n\tpublic String dealingWithMerPeople() {\n\t\treturn \"Threaten merpeople\
  \ by pointing your wand at them\";\n\t}\n}\n```\n\n接下来介绍的是冠军们用于水下呼吸以及解决尝试从霍格沃湖底部营救人质时出现的其他问题的最后一个策略。这种策略基于变形术，是维克·克鲁姆（Viktor\
  \ Krum）用来变成鲨鱼的。与另外两个具体策略类一样，所示类也为根抽象策略的问题解决方法提供了重写实现。\n\n\n\n\n\n```java\n public\
  \ class TransfigurationStrategy extends StrategyAbstractRoot {\n\n\tpublic String\
  \ breathingUnderwater() {\n\t\treturn \"If transfigured into a shark, breathe like\
  \ a shark\";\n\t}\n\tpublic String keepingGrindylowsAtBay() {\n\t\treturn \"Scare\
  \ the grindylows by baring your shark fangs at \"\n\t\t\t+ \"them\";\n\t}\n\tpublic\
  \ String locatingHostage(){\n\t\treturn \"Scare the underwater magical creatures\
  \ into giving \"\n\t\t\t+ \"your directions\";\n\t}\n\tpublic String freeingHostage()\
  \ {\n\t\treturn \"Do not use your shark teeth to free the hostage; \"\n\t\t\t+ \"\
  your shark head will prevent you from doing that. \"\n\t\t\t+ \"Instead listen to\
  \ Harry’s suggestion and use the \"\n\t\t\t+ \"sharp-edged rock lying on the lake\
  \ bed\";\n\t}\n\tpublic String dealingWithMerPeople() {\n\t\treturn \"Since you\
  \ look so scary, order the merpeople to \"\n\t\t\t+ \"stay away from you\";\n\t\
  }\n}\n```\n\n* * *\n\n## 22.9 冠军类\n\n上一节中定义的三个具体的策略类应该让人清楚，通过通过在根抽象策略类中表达的问题解决功能来编写一个实现目标的解决方案，可以获得什么，以及这种实现目标的解决方案如何在运行时被自定义为不同的特定策略。\n\
  \n显然，策略是供代理对象（agents）使用的。在我们的案例中，这些代理是参加三巫夺赛的冠军。同样显然，只有当冠军拥有执行该策略所需的能力和资源时，策略才能被使用。因此，我们需要一种表示方法，允许我们表达冠军是否具备执行特定策略的条件。这解释了本节中提出的\
  \ `Champion` 类的定义。\n\n在早前的第 22.6 节中，我们还提到了我们的演示是如何利用根策略类的 `invokeSolution()` 方法与\
  \ `SecondTaskManager` 类的 `executeTask()` 方法之间的相互作用的。这种作用将在下一节中展示，以说明：首先，根据根策略类中的问题解决方法创建一个实现目标的解决方案；然后是将该解决方案在运行时自定义为任何派生自根策略类的具体策略。根策略类的\
  \ `invokeSolution()` 方法和 `SecondTaskManager` 类的 `executeTask()` 方法都接受一个 `Champion`\
  \ 实例作为参数。当我们对策略对象调用 `invokeSolution()` 时，它必须代表某个冠军进行操作，并且必须考虑该冠军是否能够解决作为 `invokeSolution()`\
  \ 第一个参数的问题。同样，当我们在 `SecondTaskManager` 类的 `main()` 方法中调用 `executeTask()` 时，我们指的是冠军对任务的执行。\n\
  \n下所示的类定义始于实例变量，用于命名冠军，以及命名冠军在三巫夺赛第二个任务中使用的策略。接下来的五个实例变量旨在用于声明冠军是否能够解决在执行第二个任务期间将遇到的问题。仅仅为了编程方便起见，我们将它们默认初始化为\
  \ `true`。也就是说，除非由 `Champion` 类的某个 `set` 方法进行设置，否则我们假设冠军有能力解决在第二个任务期间将遇到的所有问题。\n\n\
  * * *\n\n```java\n public class Champion {\n\tprivate String name;\n\tprivate StrategyAbstractRoot\
  \ strategy;\n\n\t// 下面的‘能力’实例变量被默认\n\t// 初始化为 true 以便编程方便。它们\n\t// 也可以，可以通过此类的任何一个‘set’\n\
  \t// 方法将其设置为‘false’。\n\tprivate boolean hasSolutionForBreathingUnderwater = true;\n\
  \tprivate boolean hasSolutionForKeepingGrindylowsAtBay = true;\n\tprivate boolean\
  \ canLocateHostage = true;\n\tprivate boolean canFreeHostage = true;\n\tprivate\
  \ boolean canDealWithMerpeople = true;\n\n\tpublic Champion( String name, StrategyAbstractRoot\
  \ strategy ) {\n\t\tthis.name = name;\n\t\tthis.strategy = strategy;\n\t}\n\tpublic\
  \ String getName() {\n\t\treturn name;\n\t}\n\tpublic StrategyAbstractRoot getStrategy()\
  \ {\n\t\treturn strategy;\n\t}\n\tpublic void setHasSolutionForBreathingUnderwater(\
  \ boolean b ) {\n\t\thasSolutionForBreathingUnderwater = b;\n\t}\n\tpublic boolean\
  \ getHasSolutionForBreathingUnderwater( ) {\n\t\treturn hasSolutionForBreathingUnderwater;\n\
  \t}\n\tpublic void setHasSolutionForKeepingGrindylowsAtBay( boolean b ) {\n\t\t\
  hasSolutionForKeepingGrindylowsAtBay = b;\n\t}\n\tpublic boolean getHasSolutionForKeepingGrindylowsAtBay(\
  \ ) {\n\t\treturn hasSolutionForKeepingGrindylowsAtBay;\n\t}\n\tpublic void setLocateHostage(\
  \ boolean b ) {\n\t\tcanLocateHostage = b;\n\t}\n\tpublic boolean getLocateHostage(\
  \ ) {\n\t\treturn canLocateHostage;\n\t}\n\tpublic void setFreeHostage( boolean\
  \ b ) {\n\t\tcanFreeHostage = b;\n\t}\n\tpublic boolean getFreeHostage( ) {\n\t\t\
  return canFreeHostage;\n\t}\n\tpublic void setDealWithMerpeople( boolean b ) {\n\
  \t\tcanDealWithMerpeople = b;\n\t}\n\tpublic boolean getDealWithMerpeople( ) {\n\
  \t\treturn canDealWithMerpeople;\n\t}\n}\n```\n\n* * *\n\n## 22.10 第二 TaskManager\
  \ 类\n\n我们现在展示 `SecondTaskManager` 类，它的工作是提供我们之前提到的 `executeTask()` 方法。我们希望该方法只有在执行第二个任务期间遇到的所有问题都成功解决时，才返回\
  \ `true`。\n\n作为一个客户端类，该类还包含了 `main()` 方法，我们在其中构造了 `Champion` 实例并让它们使用不同的策略来解决第二个任务。\n\
  \n在所示的代码中，我们首先定义了静态方法 `executeTask()`，它接受传入的 `Champion` 实例作为唯一参数。注意，实现的第一步是确定冠军所选的策略。接下来，我们确定在该策略下必须解决第一个问题。回顾一下，策略是由执行任务期间遇到的系列问题的解决方案组成的。每个问题在给定策略下都有特定的解决方案，但只有当冠军拥有该解决方案所需的能力和资源时，该解决方案才能被采用。因此，在\
  \ `while` 循环中我们调用 `invokeSolution()` 来确定冠军是否可以解决每一个遇到的问题。如果在 `while` 循环的任何迭代中发现某个问题没有解决方案，我们将退出循环并报告失败。\n\
  \n这就到了 `main()` 中的代码。正如读者看到的，我们为参加比赛第二个任务的四个冠军各构造了实例。注意我们如何对“芙尔·德拉库（Fleur Delacour）”实例通过调用相应的\
  \ `set` 方法将其 `HasSolutionForKeepingGrindylowsAtBay` 能力设置为 `false`。正如读者预期的那样，这导致了“芙尔·德拉库”实例未能完成第二个任务。\n\
