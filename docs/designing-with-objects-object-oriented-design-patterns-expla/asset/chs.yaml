  public class Link {\n  private Node start;\n  private Node destination;\n  private\
  \ int distance;\n}\n```\n\n```java\n  public Link( Node start, Node destination,\
  \ int distance ) {\n   this.start = start;\n   this.destination = destination;\n\
     this.distance = distance;\n }\n  public Link( Node start, Node destination )\
  \ {\n   this.start = start;\n   this.destination = destination;\n }\n  public boolean\
  \ equals( Link other) {\n   if ( ( ( start.equals( other.start ) )\n   && (destination.equals(other.destination)\
  \ ) ) ||\n   〃( ( start.equals( other.destination ) )\n   && (destination.equals(other.start)\
  \ ) ) ) {\n    return true;\n   }\n  return false;\n }\n  public int getDirectDistance()\
  \ {\n   return distance;\n }\n  public Node getStartNode() { return start; }\n  public\
  \ Node getDestinationNode() { return destination; }\n  public String toString()\
  \ {\n   return \" Direct connection: \" + start + \" <=> \"\n   + destination +\
  \ \": \" + distance;\n  \n}\n```\n\n这介绍了网络所需的最后一个构建块类——`Path`。`Path` 类的实现方式对 `Network`\
  \ 类中 Dijkstra 最短路径算法的实现代码有很大影响。\n\n我们显然必须能够在路径列表中快速找到最短路径。如果我们能够按照路径长度升序对列表进行排序，并简单地返回第一条路径作为最短路径，这个任务就可以轻松完成。在\
  \ Java 中排序集合最简单的方法是让类实现 `Comparable`，这正是我们在下面所做的。让类实现 `Comparable` 意味着扩展 `Comparable`\
  \ 接口并实现它的 `compareTo()` 方法。`compareTo()` 的实现代码告诉系统何时一个 `Path` 实例可以被认为比另一个 `Path`\
  \ 实例短、相等或更长。\n\n由于 `Path` 仅仅是 `Node` 实例的序列，如果我们也让该类实现 `Iterable`，那么显示路径以及按顺序搜索路径中的特定节点就会变得简单。为了这一目标，`Path`\
  \ 类也实现了 `Iterable` 接口。这是通过在 Path 类的定义中实现该接口的 `iterator()` 方法完成的。\n\n正如后续类定义中所示的实例变量，路径以\
  \ `Node` 实例序列的形式存储在 `nodeSequence` 列表中，该列表被初始化为空列表。对于每条路径，我们还通过实例变量 `pathLength`\
  \ 维护其长度，并将最后添加到路径的节点存储在变量 `lastNode` 中。这三个实例变量就是与 `Network` 类通过静态方法创建的内置 Floo 网络交互所需的全部内容。当\
  \ `Path` 用于 `Network` 类实例方法创建的新网络时，我们需要在 `Path` 类中添加一个额外的实例变量——名为 `network` 的实例变量。\n\
  \n注意 `Path` 类的不同构造函数模式。通常，一条路径是从一个起始节点开始存在的。为此，我们需要所示的第一个构造函数。显然，此类路径的 `pathLength`\
  \ 值将是默认的 0，因为此时路径上仅存在 `Node` 实例。下一个构造函数实际上更是一个拷贝构造函数，对于构造路径的深拷贝有用。此构造函数返回的路径是基于对参数路径中节点的新内存分配。接下来的三个构造函数接受\
  \ `Network` 实例作为参数之一。它们的作用与前两个构造函数相同，但针对的是新实例化的网络，而不是内置网络。\n\n注意必须提供的 `compareTo()`\
  \ 方法的实现，因为该类实现了 `Comparable` 接口。正是这个实现允许我们能够在 `Network` 类的最短路径计算中，直接对 `Path` 实例列表调用\
  \ `sort()`。\n\n`getLastNode()` 方法获取当前位于路径头部的节点；这是最近被添加到路径的节点。最后，`Path` 类实现了 `Iterable`\
  \ 接口中的 `iterator()` 方法，以便该类对于路径上的节点是可迭代的。该方法必须返回一个定义了 `hasNext()` 和 `next()` 方法的\
  \ `Iterable` 实例。在我们案例中，`iterator()` 返回的对象是内部类 `PathIterathor` 的实例，其定义在 Path 类的末尾。\n\
  \n\n\n\n\n```java\npublic Path( Node nn ) {\n    nodeSequence.add(nn);\n    lastNode\
  \ = nn;\n}\npublic Path( Path otherPath ) {\n    for (Node nn: otherPath) {\n  \
  \    if (nn == null) continue;\n      nodeSequence.add( nn );\n      if (nodeSequence.size()\
  \ == 1) {\n        pathLength = 0;\n      } else {\n        pathLength +=\n    \
  \        Network.getDirectConnectionDistanceBetweenTwoNodes(\n                lastNode,\
  \ nn );\n      }\n      lastNode = nn;\n    }\n}\npublic Path( Network network )\
  \ {\n    this.network = network;\n}\npublic Path( Node nn, Network network ) {\n\
  \    nodeSequence.add(nn);\n    lastNode = nn;\n    this.network = network;\n}\n\
  // The second arg ‘network’ in the following method is to supply it\n// with a reference\
  \ to the underlying network so that it can\n// get access to inter-node distances\
  \ for calculating path lengths.\npublic Path( Path otherPath, Network network )\
  \ {\n    this.network = network;\n    for (Node nn: otherPath) {\n      if (nn ==\
  \ null) continue;\n      nodeSequence.add( nn );\n      if (nodeSequence.size()\
  \ == 1) {\n        pathLength = 0;\n      } else {\n        pathLength +=\n    \
  \        network.getDirectConnectionDistanceBetweenTwoNodes2(\n                lastNode,\
  \ nn );\n      }\n      lastNode = nn;\n    }\n}\npublic void extendPath( Node nn\
  \ ) {\n    nodeSequence.add(nn);\n    Node oldLastNode = lastNode;\n    lastNode\
  \ = nn;\n    // The logic of shortest path calculation ensures\n    // that the\
  \ following statement will only be invoked if\n    // there is a direct path between\
  \ the last node on the path\n    // and the argument node nn:\n    pathLength +=\n\
  \        Network.getDirectConnectionDistanceBetweenTwoNodes(\n            oldLastNode,\
  \ lastNode );\n}\n// The following version is for non-static versions of the network.\n\
  // The second arg supplies a reference to the network in which the\n// path is to\
  \ be extended.\npublic void extendPath2( Node nn, Network net ) {\n    network =\
  \ net;\n    nodeSequence.add(nn);\n    Node oldLastNode = lastNode;\n    lastNode\
  \ = nn;\n    pathLength +=\n        network.getDirectConnectionDistanceBetweenTwoNodes2(\n\
  \            oldLastNode, lastNode );\n}\npublic String toString() {\n    String\
  \ outputString = \"\";\n    for ( Node nn: nodeSequence ) {\n      outputString\
  \ += nn + \" : \";\n    }\n    outputString += \" length: \" + pathLength;\n   \
  \ return outputString;\n}\npublic int getPathLength() {\n    return pathLength;\n\
  }\npublic int compareTo( Path other ) {\n    if ( pathLength < other.pathLength\
  \ ) {\n    return -1;\n    } else if ( pathLength > other.pathLength ) {\n     \
  \ return 1;\n    }\n    return 0;\n}\npublic boolean lessThan(Path other ) {\n \
  \   if ( pathLength < other.pathLength ) return true;\n    return false;\n}\npublic\
  \ Node getLastNode() {\n    return lastNode;\n}\npublic Iterator<Node> iterator()\
  \ {\n    return new PathIterator( nodeSequence.toArray() );\n}\n// Inner class:\
  \ PathIterator\nclass PathIterator implements Iterator<Node> {\n    private int\
  \ index = 0;\n    private Object[] pathAsArray = null;\n    public PathIterator(\
  \ Object[] collection ) {\n        pathAsArray = collection;\n    }\n    public\
  \ boolean hasNext() {\n        return index < pathAsArray.length;\n    }\n    public\
  \ Node next() {\n      if (hasNext()) {\n        return (Node) pathAsArray[index++];\n\
  \      } else {\n        throw new NoSuchElementException();\n      }\n    }\n \
  \   public void remove() {\n        throw new UnsupportedOperationException();\n\
  \    }\n}\n```\n\n## 11.10 三个具体的 Fac 面（Facade）类\n\n如前所述，我们对 Fac 面模式的演示是基于针对三个不同类别巫师的\
  \ Floo 网络的三种用法视图。这些视图是抽象根类 `Facade` 的三个具体子类：`UnderageFacade`、`WizardFacade` 和 `WarlockFacade`。\n\
  \n我们现在展示这些具体子类中第一个也是简单的一个：`UnderageWizardFacade` 类。我们对该类的定义非常简单，因为之前介绍的根类 `Facade`\
  \ 定义了 Floo 网络的所有基本功能——这是我们允许未成年巫师使用的唯一功能。基本功能指的是使用内置的 Floo 网络进行交通，这是你预期每个巫师都能从事的事情。因此，下面类定义所做的只是传递父类\
  \ `Facade` 中已经定义的功能，并在未成年巫师尝试调用其未被允许使用的方法时抛出异常。\n\n```java\npublic class UnderageWizardFacade\
  \ extends Facade {\n\npublic Network constructNewFlooNetwork( String[] placeNames\
  \ )\n    throws Exception{throw new Exception(\"未成年巫师不被允许 \"\n+ \"构建新网络\");\n}\n\
  public boolean checkForLocationOnShortestPath( String start,\n    String destination,\
  \ String place ) throws Exception {throw new Exception(\"未成年巫师不被允许以\n+ \"这种方式查询网络\"\
  );\n}\npublic boolean doesGivenPathPassThroughLocation( Path path,\n    String location\
  \ ) throws Exception {\nthrow new Exception(\"未成年巫师不被允许以\n+ \"这种方式查询网络\");\n}\n\
  ```\n\n下一个类 `WizardFacade` 是为成年巫师准备的。除了可以使用根类 `Facade` 中原始定义的基本功能外，这个新类使成年巫师能够避开\
  \ Floo 网络中可能存在敌人的地址。巫师可以通过两种方式调用此功能：\n\n```\ncheckForLocationOnShortestPath()\n\
  doesGivenPathPassThroughLocation()\n```\n\n参阅第 11.7 节了解这两个方法的区别以及成年巫师如何使用它们来避开敌人。\n\
  \n```java\nimport java.util.*;\n\npublic class WizardFacade extends Facade {\n \
  \   public Network constructNewFlooNetwork( String[] placeNames )\n        throws\
  \ Exception{\n        throw new Exception(\"只有巫师可以构建新网络\");\n    }\n    public boolean\
  \ checkForLocationOnShortestPath( String start,\n        String destination, String\
  \ place ) throws Exception {\n        initializeBuiltinNetwork();\n        Path\
  \ path = Network.findShortestPath( start, destination );\n        Iterator<Node>\
  \ it = path.iterator();\n        Node node = new Node(place);\n        boolean answer\
  \ = false;\n        while (it.hasNext()) {\n            if (node.equals( it.next()\
  \ )) {\n                answer = true;\n                break;\n            }\n\
  \        }\n        return answer;\n    }\n    public boolean doesGivenPathPassThroughLocation(\
  \ Path path,\n        String location ) throws Exception {\n        initializeBuiltinNetwork();\n\
  \        Iterator<Node> it = path.iterator();\n        Node node = new Node(location);\n\
  \        boolean answer = false;\n        while (it.hasNext()) {\n            if\
  \ (node.equals( it.next() )) {\n                answer = true;\n               \
  \ break;\n            }\n        }\n        return answer;\n    }\n}\n```\n\n接下来，我们介绍三个具体\
  \ `Facade` 类中的最后一个。这个类 `WarlockFacade` 是为女巫师（warlocks）设计的，这些是拥有非凡能力的巫师。我们认为所有在魔法部\
  \ Floo 网络管理局工作的人都属于这一类。我们在这里的重点是女巫师召唤新 Floo 网络的能力，作为现有内置网络的可能扩展。\n\n\n\n\n\n下文所示类提供的用于创建新网络的两种主要方法是：\n\
  \n```\nconstructNewFlooNetwork()\nconstructNewFlooNetworkUsingNeighborhoods()\n\
  ```\n\n前者用于逐个链接地构建网络，直到指定所有链接；后者用于逐个邻域地指定网络，直到指定所有邻域。由于这两种方法在向导（wizard）提供所需信息的方式上不同，支持它们的方法也不同。这两种情况下的调用序列如图图\
  \ 11.4\n\n**图 11.4**\n\n读者可能还希望注意我们如何使用类中的布尔类型实例变量来确保网络创建方法不会按错误的顺序被调用。我们的意思是，我们不允许在调用\
  \ `constructNewFlooNetwork()` 之前调用 `setNetworkLink()` 方法。这是因为后者必须先指定网络地址，以便在调用前者来指定由第一次调用创建的实例对之间的链接之前，先创建并放置相应的\
  \ `Node` 实例。同样地，在图 11.4 左侧的方法序列中，在通过调用 `setNetworkLink()` 放置链接之前，不能调用 `setNeighborhoodsAndDisplayNetworkCreated()`。类似的推理也适用于使用布尔变量来控制右侧所示方法序列的调用顺序。\n\
  \n在女巫师（warlock）创建了一个新网络后，他/她自然会想要分析网络中给定起始节点和给定目标节点之间的最佳路径。女巫师可以通过调用以下方法来实现这一点：\n\
  \n```\nfindShortestPathInNewNetwork()\n```\n\n正如该方法的实现代码所示，此调用被直接翻译为 `Network` 类中用于寻找网络最短路径的实例方法。最后，该类包含了以下方法的实现：\n\
  \n```\ncheckForLocationOnShortestPath()\ndoesGivenPathPassThroughLocation()\n```\n\
  \n这些方法在根类 `Facade` 中被声明为抽象方法。在这里实现它们的原因与在 `WizardFacade` 类中实现的原因相同。\n\n***\n\n```\n\
