  \ `SchoolOfMagic`。记得当学校聘请新老师时，客户端类中只有一行需要更改 —— 就是我们设置 `teacher` 变量的行。代码的其他部分与前任老师时完全一致。\n\
  \n```java\npublic class SchoolOfMagic {\n\n    TeachingDADA teacher;\n\n    public\
  \ SchoolOfMagic() {\n        teacher = new AdapterSafeTeaching();\n    }\n\n   \
  \ public void teachDefenseAgainstDarkArts() {\n        teacher.defenseAgainstPetrification();\n\
  \        System.out.println(\"\\n\\n\");\n        teacher.defenseAgainstCruciatusCurse();\n\
  \        System.out.println(\"\\n\\n\");\n        teacher.awarenessOfHorcrux();\n\
  \        System.out.println(\"\\n\\n\");\n        teacher.defenseAgainstPetrification();\n\
  \        System.out.println(\"\\n\\n\");\n        teacher.defenseAgainstSectumsempra();\n\
  \        System.out.println(\"\\n\\n\");\n        teacher.defenseAgainstAvadaKedavra();\n\
  \    }\n\n    public static void main(String[] args) {\n        SchoolOfMagic hogwarts\
  \ = new SchoolOfMagic();\n        hogwarts.teachDefenseAgainstDarkArts();\n    }\n\
  }\n```\n\n\n\n\n这就完成了适配器模式的演示代码。更准确地说，这完成了适配器模式中“类适配器”（`Class Adapter`）版本的演示代码（关于其具体含义，请参见下一节）。通常情况下，在章节的这一位置，下一节会被标记为“运行代码”，其中将展示模式演示的可执行类产生的输出。在本章中，我们偏离了这一公式，因为我们需要让读者意识到实现适配器模式的另外两种方式。你到为止所看到的代码执行后产生的输出将在本章的第\
  \ 7.13 节 中给出。\n\n## 7.11 对象适配器（OBJECT ADAPTER）\n\n读者可能还记得，适配器模式的目的是让客户端能够使用一个新类来替换现有类，或者增强其功能，而只需要对客户端代码进行极少的改动。因此，正如前面提到的，我们将旧类视为被适配器类（adaptee\
  \ class），将新类视为适配器类（adapter class）。适配器类必须适应被适配器，同时可能增强旧类所提供的功能。\n\n我们在本章中到为止所演示的内容被称为实现适配器模式的`类适配器`方法。存在另外两种实现此模式的方法：`对象适配器``Object\
  \ Adapter`）方法和`可插拔适配器”（`Pluggable Adapter`）方法。在本节中，我们将解释什么是“对象适配器”。下一节将介绍“可插拔适配器”。\n\
  \n在本章之前的节介绍的类适配器方法中，适配器类是自自被适配器类并重写了它的方法。在本节介绍的对象适配器方法中，适配器将**不会**继承自 `Adaptee`（被适配器）。相反，适配器现在将构造一个被适配器的实例，然后调用该实例，以获取适配器从被适配器处所需的功能，同时为客户端提供额外的功能（在我们的案例中是\
  \ `SchoolOfMagic`）。\n\n在我们对对象适配器方法的演示中，我们将使用与之前相同的 `TeachingDADA` 接口。请记住，该接口规定了学校对\
  \ DADA 老师在课堂上涵盖内容的最低预期。我们还将使用与之前相同的 `TeacherForDADA` 类来表示旧老师。至于客户端，我们将再次使用之前展示的\
  \ `SchoolOfMagic` 类。因此，在我们对象适配器方法的演示中，唯一的新类是 `AdapterForSafeTeaching`。记住，这代表了新老师。\n\
  \n适配器类的新版本如下。根据上面的解释，我们现在不再继承自 `TeacherForDADA`，而是使用一个类型为 `TeacherForDADA` 的实例变量。随后，我们在该变量上调用接口\
  \ `TeachingDADA` 在中声明的各种方法，以引入被适配器类 `TeacherForDADA` 中定义的功能。\n\n```\n public class\
  \ AdapterForSafeTeaching implements TeachingDADA {\n\n  TeachingDADA oldTeacher\
  \ = new TeacherForDADA();\n\n  public void defenseAgainstCruciatusCurse(){\n    doTeachHowDarkMagicCanHarmTheCaster();\n\
      doTeachPowerOfLove();\n    oldTeacher.defenseAgainstCruciatusCurse();\n  }\n\
    public void awarenessOfHorcrux(){\n    doTeachHowDarkMagicCanHarmTheCaster();\n\
      doTeachPowerOfLove();\n    oldTeacher.awarenessOfHorcrux();\n  }\n  public void\
  \ defenseAgainstPetrification(){\n    doTeachAboutProtectiveDevices();\n    oldTeacher.defenseAgainstPetrification();\n\
    }\n  public void defenseAgainstSectumsempra(){\n    doTeachHowDarkMagicCanHarmTheCaster();\n\
      oldTeacher.defenseAgainstSectumsempra();\n  }\n  public void defenseAgainstAvadaKedavra()\
  \ {\n    doTeachHowDarkMagicCanHarmTheCaster();\n    oldTeacher.defenseAgainstAvadaKedavra();\n\
    }\n  void doTeachPowerOfLove() {\n    System.out.println(\n      \"The magic of\
  \ love can conquer the darkest magic\");\n    }\n  void doTeachHowDarkMagicCanHarmTheCaster()\
  \ {\n    System.out.println( \"Use of Dark Magic can corrupt the soul \"\n      +\
  \ \"and body of the caster. An evil wizard \"\n      + \"may use such magic to prolong\
  \ the \"\n      +\"life and obtain great power. A \"\n      +\"look deformed and\
  \ inhuman.\");\n   }\n  void doTeachAboutProtectiveDevices() {\n    System.out.println(\
  \ \"Don’t forget to take along the \"\n      +\"Sneoscope detector as a \"\n      +\"\
  general protection against curses \"\n      +\"and spells.\");\n  }\n }\n}\n```\n\
  \n* *\n\n关于类适配器和对象适配器的相对缺点，这里是前者的某些优点：类适配器让被适配器更容易流通过。为了进一步解释这一点，如果第 7.9 节 中的 `AdapterForSafeTeaching`\
  \ 类没有重写所有方法，`SchoolOfMagic` 仍然可用。至于对象适配器的优点，在在本节所示的对象适配中，适配器构造一个被适配器的实例，然后选择性地使用后者或对其增强。这减轻了客户端的工作。\n\
  \n## 7.12 可插拔适配器（PLUGGABLE ADAPTER）\n\n到为止，我们介绍了实现适配器模式的两种方法：类适配器方法和对象适配器方法。上一节也介绍了这两种方法的相对优点。\n\
  \n现在我们演示第三种方法——`可插拔适配器`。这种方法允许我们动态（即在运行时）更改被适配器的选择。在之前的两个演示中，被适配器类是固定的。\n\n我们将通过以下假设来解释第三种方法：假设有两种不同类型的\
  \ DADA 老师，*vecchio*（旧）和*nuovo*（新），后者更有可能向学生灌输练习黑暗艺术的不道德性。学校在某一年聘用什么类型的 DADA 导师完全取决于校长的喜好。因此，聘用的新老师可能需要适应\
  \ *vecchio* 风格的 DADA 教学或 *nuovo* 风格。为了在程序中体现这一点，我们需要两个不同的被适配器类，命名为 `TeacherVecchio`\
  \ 和 `TeacherNuovo`。\n\n\n\n\n接下来的演示了客户端类 `SchoolOfMagic` 如何轻松地在两个适配器类（adaptee classes）之间切换。新的讲师以\
  \ `PluggableAdapterForDADATeaching` 类实例的形式存在，它将适应运行时对适配器类所做的任何选择。此演示的高层视图如图图 7.4\
  \ 中的类图所示。\n\n![image](img/c07f004.gif)\n\n**图 7.4**\n\n正如读者所想象的，此演示的关键在于展示 `PluggableAdapterForDADATeaching`\
  \ 类允许在运行时于 `TeacherNuovo` 和 `TeacherVecchio` 之间切换适配器类。至于如何实现，请注意 `PluggableAdapterForDADATeaching`\
  \ 类的一个非常有趣的特性：`TeachingDADA` 接口在类定义中同时扮演两个不同的角色。一方面，该类实现了 `TeachingDADA` 接口；另一方面，它拥有一个类型为\
  \ `TeachingDADA` 的实例变量。我们希望可插适配器类实现 `TeachingDADA` 接口，因为客户端类 `SchoolOfMagic 正通过其实例变量\
  \ `teacher` 接收 DADA 讲师。记住，一个新的 DADA 讲师是从适配器类构造的实例。但实现 `TeachingDADA` 接口意味着 `PluggableAdapterForDADATeaching`\
