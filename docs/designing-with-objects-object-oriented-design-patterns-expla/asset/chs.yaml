  \n## Note\n\n# 11\n\n外观面模式 (FACADE)\n\n## 11.1 隐藏复杂性\n\n大多数人将外观面（facades）与建筑联系在一起，认为外观面是建筑的前部。对于许多人来说，“facade”一词也与旧好莱坞西部建筑的假门有强烈的关联——通常是酒馆、杂货店、监狱等。观看这些老西部片的人：将\
  \ `facade` 与建筑联系起来，认为 `a facade` 是建筑的前部。对于许多人来说，“facade”一词也与旧好莱坞西部建筑的假门有强烈的关联——通常是酒馆、杂货店、监狱等……（注：原文此处存在大量重复段落，翻译已根据要求处理，确保无重复输出）。\n\
  \n## 11.1 隐藏复杂性\n\n大多数人将外观面（facades）与建筑联系在一起，认为外观面是建筑的前部。对于许多人来说，“facade”一词也与旧好莱坞西部建筑的假门有强烈的关联——通常是酒馆、杂货店、监狱等……（注：原文此处存在大量重复段落，翻译已根据要求处理，确保无重复输出）。\n\
  \n\n\n\n\n在开源社区中，开发者为复杂模块提供自己的接口版本并不罕见，这些接口用于模块的特定用途。对于开源软件而言，这些更简单且用途有限的接口就是外观模式（Facade\
  \ pattern）的示例。\n\n[2] 中[第 10 章]末尾提到的 `FileIO` Java 类旨在设计为一个外观，从这个意义上说，它为某些特定的 IO\
  \ 任务提供了一个简单的接口，省去了用户翻阅 `java.io` 包中所有类以弄清楚应该使用哪些基本 IO 类和包装类的组合的麻烦。正如在前一章的另一个语境下提到的那样，`java.io`\
  \ 包中大量的包装类可以以不同的组合实现相同的结果。正如 [2] 中[第 6 章]的程序 `WriteIntToFile.java` 所示，如果你的目标是将整数类型变量的值以\
  \ ASCII 数字序列的形式写入磁盘文件，那么至少存在六种不同的包装类组合可以产生相同的结果。在 `FileIO` 类提供的更简单的接口中，该目的只需调用一个函数，即\
  \ `writeOneInt()`。[2] 中[第 6 章]中外观模式的另外两个例子是用于其名称所示的 IO 操作的 `TerminalIO` 和 `FileReaderData`\
  \ 类。\n\n## 11.5 用于说明外观模式的哈利·波特故事\n\n我们对外观模式的演示基于《哈利·波特》中的飞炉网（Floo network）。巫师界利用这个网络几乎瞬间从一个地方移动到另一个地方。网络本身由魔法部魔法事务部的飞炉网管理局管理。他们的工作是建立网络、扩展网络，并在危险时期监控网络并跟踪谁在网络中旅行。\n\
  \n要在飞炉网中从一个位置旅行到另一个位置，你只需将一把魔法过的飞炉粉撒入点燃的壁炉。当火焰变成翡翠绿色时，你走进壁炉并清晰地说出你的目的地。突然，你会发现自己飞过了通往目的地巫师们的壁炉。飞炉网也适用于其他几种魔法运输方式。例如，你不需要物理上将将整个身体从所在地运到目的地。如果你只想和另一端的人聊天，你只需要把头部伸进火焰中，而身体的其他部分稳固地留在起点即可。这时只有你的头部会旅行到目的地。它会出现在另一端的火焰中，并与那里的个人进行对话。\n\
  \n可以假设，对于魔法部飞炉网管理局的巫师来说，运行和管理飞炉网是一项复杂的工作，这主要是他们还必须随着巫师界的扩张召唤出当前网络的扩展。尽管这种复杂性的大部分对于一个只想从一个地方旅行到另一个地方的未成年巫师来说是不可见的，但拥有许多敌人并希望知道自己在网络中旅行精确路线的经验巫师可能会遇到一些复杂性。显然，巫师不希望经过敌人的壁炉路由。通过阅读《哈利·波特》，我们知道，当巫师在网络中高速旅行时，当他们穿过沿途的壁炉时可以看到房间的模糊图像。因此，坐在那些房间里的经验巫师完全有可能拦截穿过他们壁炉的人。（尽管\
  \ J.K. 罗琳 并没有提到过此类拦截，甚至没有提到过此类拦截的可能性。尽管如此，我们还是做出这个假设，因为这*可能是*真实的，而且它允许我们在此处添加有趣的功能。）\n\
  \n在我们这里对飞炉网的使用中，我们将做出以下假设：\n\n*   未成年巫师不应该处理飞炉网的任何复杂性。这样的巫师应该能够简单地使用网络从一个地方旅行到另一个地方。\n\
  *   经验丰富的巫师应该能够查询网络中用于到达目的地的路由，以确保该路线避开了可能被敌人占据的房屋。\n*   黑巫师（我们将所有在魔法部飞炉网管理局的巫师以及所有拥有超常能力的巫师，如邓布利多、伏地魔等，统称为黑巫师）应该能够创建一个新的飞炉网。显然，黑巫师也必须能够以普通巫师可以的所有方式使用网络。\n\
  \n这意味着，我们的飞炉网必须允许上述三种类型巫师进行不同类型的用途。由于显而见的原因，我们不希望未成年巫师访问专门为成年巫师和黑巫师设计的类型用途。成年巫师对于专门为黑巫师设计的类型用途情况也是如此。\n\
  \n我们如何做到这一点呢？正如本次演示所示，我们可以为飞炉网创建三种不同的用途视图——或称外观——并确保每一类用户都只允许访问专门为该类用户设计的用途视图。\n\
  \n这三个不同的外观类将继承自一个名为 `Facade` 的根抽象类，如[图 11.2]所示。\n\n![image](img/c11f002.gif)\n\n\
  **图 11.2**\n\n我们将飞炉网的基础用法放在抽象根类 `Facade` 中。我们所说的基础用法指的是所有人预期的服务，例如从一个地方旅行到另一个地方的能力。通过继承，这种用法在三个视图中都是可用的。*我们会在根类中声明一些高级用法，但我们会确保这些功能在不需要的视图中无法利用。*\n\
  \n## 11.6 模式演示的顶层视图\n\n图 11.3 中的类图是我们外观模式演示的顶层视图。演示的核心是左侧所示的 `Network` 类扮演的角色。内置飞炉网由该类建模，任何新的网络扩展也是如此。网络中可访问的每个地方（更准确地说，每个壁炉）都被认为是\
  \ `Node` 类的实例。每对 `Node` 实例之间的每个直接连接由 `Link` 类的实例表示。构成网络中旅行路径的节点和链接序列由 `Path` 类的实例表示。\n\
