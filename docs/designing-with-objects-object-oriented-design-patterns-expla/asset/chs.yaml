  \n## 注意事项\n\n# 10 装饰器\n\n## 10.1 以洋葱作为比喻\n\n当必须剥开层层看似并不紧要的细节才能看到最终真理时，洋葱经常被用作比喻。不意外的是，几位心理学家将人类人格描述为一个洋葱。假设，我们人格（persona）的最外层用于与大多数时候只有工作关系的人进行日常互动。更深的层留给我们认为是朋友的人。而最内层——这些是我们核心信念和价值观所在的层——仅适用于那些与我们最亲近的人。\n\
  \n这种比喻也可以用来描述物理对象——俄罗斯套娃就是一个经典的例子——以及你很快看到的软件对象。在物理对象中，我们还有这样的例子：多层包装的礼物以增加悬念，因为每拆开一层都会揭示关于礼物的一个诱人线索，或者对它提出一个问题。\n\
  \n正如你猜的那样，在日常生活中使用这种比喻的主要原因是引起人们关注包裹感兴趣事物的层次的存在。有趣的是，在通常用法中，这种比喻不太可能引起我们注意每个封装层对所有被封装层提供的隔离程度，或者层出现的顺序，甚至是层的数量。有时，洋葱比喻的这些额外方面受到领域性质的隐式限制。例如，对于俄罗斯套娃的情况，虽然层的数取决于不同的制造者，但层的顺序是由尺寸限制固定的——即每个娃娃必须放进下一个更大的娃娃内部的限制。\n\
  \n正是洋葱比喻的这些额外方面——特别是我们对层的选择和顺序的控制程度——在当这种比喻用于软件开发中抽象对象的建模时非常重要。在软件语境中使用这种比喻的目的是，让你先为某些基本功能编写代码，然后以装饰的形式提供额外的代码，这些代码可以包裹在基本功能周围。装饰器模式告诉我们，如何编写这类代码，使得客户端在如何混合和匹配这些装饰以根据其需求自定义软件行为方面，能够获得最大程度的自由度。\n\
  \n## 10.2 意图与适用性\n\n装饰器模式的意图是赋予客户端为类提供的核心功能添加多个装饰的能力，而不限制添加这些装饰的顺序。\n\n在满足以下情况下，你应该考虑使用这种模式：\n\
  \n*   类提供的核心功能可以通过调用其他类来增强装饰；\n*   客户端希望自由地混合和匹配装饰，以增强来自某个类的核心功能；\n*   为每种不同的装饰组合创建一个子类的备选方案会导致子类过多。\n\
  \n## 10.3 装饰器模式简介\n\n假设你为某些基本功能编写的代码需要根据不同的使用场景以不同的方式进行装饰。解决此问题的简单方法是为每个使用场景创建一个基本功能的独立变体。在[图\
  \ 10.1]中，根节点类代表基本功能，而它的子类代表基本功能的各种装饰后的版本。\n\n![image](img/c10f001.gif)\n\n**图 10.1**\n\
  \n然而，如果你的客户寻求装饰的组合，这种看似直接的方法可能会遇到障碍。对于你的客户所需的每种组合，你都需要在类层次结构中创建一个新的扩展，如[图 10.2]所示。想象一下，如果你有许多并非微不足道的不同装饰，并且你的客户期望你提供它们的每种可能的组合，那么纯基于继承的实现[图\
  \ 10.2]，你需要创建一个多庞大且复杂的类层次结构。\n\n![image](img/c10f002.gif)\n\n**图 10.2**\n\n然而，正如我们在本章所示，通过基于装饰器的方法（当所有装饰都实现相同的接口时这种方法是行的），你只需要为每个装饰创建一个子类，如图\
  \ 10.3 所示。随后，你的软件客户端将能够以任意顺序调用它们。*这是因为装饰器模式允许对装饰进行递归合并，同时对它们的选择或顺序不施加任何限制*。\n\n\
  ![image](img/c10f003.gif)\n\n**图 10.3**\n\n从第 10.5 节开始，本章的其余部分将使用一个非常适合装饰器模式的哈利·波特故事更清晰地解释这些思想。\n\
  \n## 10.4 现实世界应用中的装饰器模式\n\nJava IO（输入/输出）类可能是现代面向对象软件中广泛使用装饰器模式的最早例子。为了说明这种装饰器的用法，特别地说明为什么想在\
  \ Java IO 中使用装饰器类，让我们考虑将整数 98 写入磁盘文件的行为。从编程的角度来看，人们可能认为向文件写入像 98 这样普通的整数可能并不复杂。\n\
  \n假设整数 98 是局部变量 `anInt` 的值。现在的问题是，你是否希望将 `anInt` 的值作为两个 ASCII 字符 9 和 8 写入文件。或者，你是否希望将整数以它在计算机内存中存储的形式写入文件——在大多数系统中是一个\
  \ 4 字节位模式，其十六进制表示为 ‘00000062’。此外，你还需要决定你的程序是否应对用于写入磁盘文件的流进行缓冲。\n\n\n\n\n\n# Java\
  \ 和 PHP 中的装饰器模式\n\n## Java IO 与装饰器模式\n\nJava 借助装饰器模式来处理所有这些文件 IO 的变体。例如，Java IO\
  \ 中的核心功能类之一是 `FileOutputStream` —— 该类知道如何将原始字节写入文件。随后，如果你想让输出的字节经过缓冲处理，并让信息以 ASCII\
  \ 字符的形式显示在文件中，你可以在程序中进行如下调用：\n\n```java\n int anInt = 98;\n PrintStream pbs = new\
  \ PrintStream(\n    new BufferedOutputStream(\n        new FileOutputStream(\"out.dat\"\
  )));\n    pbs.print( anInt );\n    pbs.close();\n```\n\n其中，`BufferedOutputStream()`\
  \ 和 `PrintStream()` 的调用是对由 `FileOutputStream()` 构建的流所提供的核心功能的装饰器封装。\n\n装饰器模式的另一个成功应用是基于\
  \ PHP 的 Zend 平台中的 `Zend_Form`，用于提供动态创建的 Web 内容。`Zend_Form` 用于动态生成用于浏览器显示表单的 HTML\
  \ 标记以及填充表单的数据。显然，Zend 平台的每个客户端都希望自定义表单的外观以及数据在表单中的显示方式，以体现品牌身份。Zend 平台的开发者为 `Zend_Form`\
  \ 选择了基于装饰器的设计，以赋予客户在表单定制方面所需的灵活性。读者可能希望访问 Zend 主页上的“decorators-with-zend-forms”网页，以获取有关他们使用装饰器模式方法的更多信息。特别值得的是，看到他们所称的“内容装饰器”（用于表单中显示的信息）与“表单给用户外观的装饰器”之间所做的区分是很有启发性的。\n\
  \n## 10.5 用哈利·波特的故事来说明装饰器模式\n\n考虑一个类，其主要功能是在哈利·波特住在德思家家里时给他寄送一封信。在通常情况下，信件会被放在普通的麻格尔邮件中，信封上写着哈利的名字以及德思家住所的家庭地址。事实上，这正是霍格沃学校在需要通知哈利已被录取时最初尝试的方法。完成此任务的类可以定义如下：\n\
  \n```java\n class DeliverMsgToHarryPotter {\n    String message = \"Dear Harry,\
  \ You have been admitted to Hogwarts.\" +\n        \"Contgratulations!\";\n    public\
  \ deliverMessage() {\n        // 将消息放入写有哈利名字\n        // 和德思家地址的信封中。\n    }\n}\n\
  ```\n\n但是，如果上述直接递送消息的方法行不通 —— 万一德思先生习惯于拦截任何寄给哈利的普通邮件呢！—— 我们我们需要另一种方法来通知哈利他已被霍格沃茨录取。霍格沃茨可以尝试在德思一家同哈利确定都在吃早餐时，将信封从进房子的烟囱。这可以通过扩展上面所示类来实现：\n\
  \n```java\n class DeliverMsgThruChimney extends DeliverMsgToHarryPotter {\n    public\
  \ deliverMessage() {\n        super.deliverMessage();\n        // 调用父类的 deliverMessage()\n\
  \        // 将准备好消息和信封。\n        // 这里的新代码将把信封\n        // 掉进烟囱。\n    }\n}\n```\n\
  \n注意派生类的 `deliverMessage()` 是如何调用父类的 `deliverMessage()` 方法来完成将消息放入信封以及在信封上写上正确地址的核心工作的。之后，派生类的\
  \ `deliverMessage()` 将信封投入德思家的烟囱道。\n\n但是，如果德思先生也拦截了这种递送模式呢？霍格沃茨可以尝试将信封滑入前门下的缝隙。这可以通过一个与上面所示类似的类来实现，该类再次依赖\
  \ `DeliverMsgToHarryPotter` 类来完成将信放入信封和正确填写信封地址的核心工作：\n\n```java\n class DeliverMsgThruDoorCrack\
  \ extends DeliverMsgToHarryPotter {\n    public deliverMessage() {\n        super.deliverMessage();\n\
  \        // 调用父类的 deliverMessage()\n        // 将准备好消息和信封。\n        // 这里的新代码将把信封\n\
  \        // 滑入德思家的正门下。\n    }\n}\n```\n\n但是，正如我们所知，在拦截了基于门缝的消息递送后，德思先生会封死家里所有外门和窗户的缝隙。为了应对这种情况，霍格沃茨可以再次尝试一种基于隐藏的方法。这可以通过如下类来实现：\n\
  \n```java\n class DeliverMsgThruConcealment extends DeliverMsgToHarryPotter {\n\
  \    public deliverMessage() {\n        super.deliverMessage();\n        // 调用父类的\
  \ deliverMessage()\n        // 将准备好消息和信封。\n        // 这里的新代码将信封\n        // 隐藏在另一个信封内部并让\n\
  \        // 外层信封看起来像是来自玩具店。\n    }\n}\n```\n\n\n\n\n如图 10.6 所示，装饰器模式要求我们首先定义一个根接口，声明需要实现的基本功能。在我们的演示中，该接口命名为\
  \ `MessageDelivery`。随后，我们定义了一个名为 `MessageDeliveryDecorator` 的抽象类，它实现了 `MessageDelivery`\
  \ 接口，同时包含一个接收类型为 `MessageDelivery` 参数的构造函数。这一事实使得从 `MessageDeliveryDecorator` 具体子类创建的实例可以递归嵌套。至于实现\
  \ `MessageDelivery` 中声明的核心功能，由 `CoreMessageDeliveryClass` 类负责。该类也实现了根接口 `MessageDelivery`。由于核心功能类和所有递归装饰类都实现了同一个接口——在我们的案例中是\
  \ `MessageDelivery`——因此，可以在核心功能周围包装任何任意嵌套的装饰器。\n\n![image](img/c10f006.gif)\n\n\
  Fig. 10.6\n\n## 10.6 模式演示的顶层视图\n\n图 10.7 展示了我们装饰器模式演示的顶层视图。暂时忽略客户端类 `Test` 及其发出的链接，图\
  \ 10.7 中的类图仅仅是图 10.6 所示图表的更详细版本。类层次结构继承自根接口 `MessageDelivery`，其定义如下：\n\n![image](img/c10f007.gif)\n\
  \nFig. 10.7\n\n```\n public interface MessageDelivery {\n\tpublic void deliverMessage();\n\
  }\n```\n\n该接口在装饰器模式中起着至关重要的作用，它允许对派自抽象类 `MessageDeliveryDecorator` 的类所对应的装饰器进行任意嵌套。一个要发送给哈利·波特的消息是\
  \ `CoreMessageDeliveryClass` 类的实例。该消息使用 `MessageDeliveryDecorator` 的一个或多个子类进行“传递”，并且传递模式可以任意地链链，正如我们在第\
  \ 10.9 节的客户端类 `Test` 中所示。以下是从 `Test` 的 `main()` 方法开始的消息传递模式链的示例：\n\n```\n MessageDelivery\
  \ m3 = new DeliverMsgThruHagrid(\n\tnew DeliverMsgThruChimney(\n\t\tnew CoreMessageDeliveryClass()\
  \ ) );\nm3.deliverMessage();\n```\n\n这显示了消息的传递模式为海格拿着信交给德思思一家，并从他们的烟囱掉进去。\n\n至于装饰器模式如何允许我们从\
  \ `MessageDeliveryDecorator` 类的后代创建任意的消息传递模式链，请注意图 10.7 类图中的以下内容：抽象类 `MessageDeliveryDecorator`\
  \ 的构造函数接收一个类型为 `MessageDelivery` 的参数，该类的所有具体子类也是如此。此外，核心功能类 `CoreMessageDeliveryClass`\
  \ 也是 `MessageDelivery` 类型，且如图所示，它的构造函数也接收一个类型为 `MessageDelivery` 的参数。因此，从图 10.7\
  \ 所示的具体类中构造的所有实例（当然是客户端类 `Test`）都是 `MessageDelivery` 类型。因此，我们可以构造一个例如 `DeliverThruPost`\
  \ 的实例，并向其构造函数提供一个类型为 `CoreMessageDeliveryClass` 的实例。这将使核心传递类提供的功能被 `DeliverThruPost`\
  \ 传递类提供的额外功能自动装饰。同样，我们可以将一个 `DeliverMsgThruHagrid` 实例包装在一个 `DeliverMsgThruChimney`\
  \ 实例周围，而后者又是 `CoreMessageDeliveryClass` 实例的包装。正如读者看到的，这种递归包装的概念可以嵌套到任意程度。\n\n##\
  \ 10.7 CoreMessageDeliveryClass 类\n\n该类的实例定义了通过 `MessageDeliveryDecorator` 类型实例创建的递归包装（或嵌套包装或嵌套装饰）的终点。这些包装都是\
  \ `MessageDelivery` 类型，而下面所示类创建的实例也是该类型。\n\n* * *\n\n```\npublic class CoreMessageDeliveryClass\
  \ implements MessageDelivery {\n\tpublic void deliverMessage() {\n\t\tSystem.out.println(\
  \ \"Dear Harry, You have been admitted to \"\n\t\t\t+ \"Hogwarts. Congratulations!\"\
  \ );\n\t}\n}\n```\n\n* * *\n\n## 10.8 装饰器类\n\n具体的装饰器类都派自 `MessageDeliveryDecorator`，如下文所示，它是一个抽象类。正如前面提到的，装饰器模式的核心在于，下面所示的类既实现了\
  \ `MessageDelivery` 接口，又包含一个接收相同类型参数的构造函数。此外，`MessageDeliveryDecorator` 的实例包含一个实例变量\
  \ `message`。这些事实使得构造 `MessageDeliveryDecorator` 实例成为可能，因为下面的类是抽象的——并且该对象作为 `MessageDelivery`\
  \ 的实例——这是装饰器模式的核心事实。\n\n* * *\n\n```\npublic abstract class MessageDeliveryDecorator\
  \ {\n\tprivate MessageDelivery message;\n\n\tpublic MessageDeliveryDecorator( MessageDelivery\
  \ m ) {\n\t\tmessage = m;\n\t}\n\n\tpublic void deliverMessage() {\n\t\tmessage.deliverMessage();\n\
  \t}\n}\n```\n\n* * *\n\n接下来我们展示 `DeliverMsgThruChimney` 类——它是 `MessageDeliveryDecorator`\
  \ 的具体子类，定义了一种特定的消息传递模式。为了允许递归装饰，请注意构造函数如何接收类型为 `MessageDelivery` 的单一参数，并为继承自父类的实例变量\
  \ `message` 赋值。\n\n同样注意 `deliverMessage()` 方法的覆盖实现调用了父类的同名方法。这将导致在被包装的实例上调用 `deliverMessage()`\
  \ 方法。如前所述，这种递归调用的终点是由 `CoreMessageDeliveryClass` 实例定义的，这也就是装饰器模式实现的“洋葱效应”。\n\n*\
  \ * *\n\n```\n public class DeliverMsgThruChimney extends MessageDeliveryDecorator\
  \ {\n\tpublic DeliverMsgThruChimney(MessageDelivery m) {\n\t\tsuper(m);\n\t}\n\t\
  public void deliverMessage() {\n\t\tsuper.deliverMessage();\n\t\tSystem.out.println(\
  \ \"This message is being sent through the \"\n\t\t\t+ \"chimney of Harry Potter’s\
  \ home\" );\n\t}\n}\n```\n\n\n\n\n\n```java\n public class DeliverMsgThruHagrid\
  \ extends MessageDeliveryDecorator {\npublic DeliverMsgThruHagrid(MessageDelivery\
  \ m) {\nsuper(m);\n}\npublic void deliverMessage() {\nsuper.deliverMessage();\n\
  System.out.println( \"This message was carried by Hagrid\" );\n}\n}\n```\n\n这引出了派自抽象类\
  \ `MessageDeliveryDecorator` 的第三个也是最后一个具体子类 —— `DeliverMsgThruPost` 类，用于通过普通邮政向哈利·波特发送消息。它的定义与之前的两个子类完全平行，那两个子类定义了向哈利·波特发送消息的另外两种模式。\n\
  \n```java\npublic class DeliverMsgThruPost extends MessageDeliveryDecorator {\n\
    public DeliverMsgThruPost(MessageDelivery m) {\n    super(m);\n  }\n  public void\
  \ deliverMessage() {\n    super.deliverMessage();\n   System.out.println( \"This\
  \ message is being sent via the Postal \"\n    + \"Service\");\n  }\n}\n```\n\n\
  ## 10.9 客户端类 Test\n\n下面所示的 `Test` 类说明装饰器模式所基于的洋葱比喻。特别注意向哈利·波特发送消息的第三种交付模式。它要求海格将消息带送到德思一家居住的地方，并从烟囱投进信封。\n\
