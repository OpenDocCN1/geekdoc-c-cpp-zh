  \n***\n\n## 15.11 Squib 类\n\n我们现在展示用于演示 `Command` 模式的第二个接收者类 `Squib`。麻瓜（squib）显然是麻格人环境中保护哈利的完美哨兵——因为在麻格人看来，麻瓜看起来就像普通的非魔法类人。\n\
  \n至于为什么这个类拥有与猫相关的方法和属性，请回想第 15.5 节，在那个夏日的夜晚，当两个摄魂怪在黑暗的小巷里袭击哈利（以及他的表弟达德利）时，是费格夫人的猫蒂布尔先生目睹了那次攻击。那只猫跑回家并告诉了费格夫人。考虑到猫在保护哈利方面所起的重要作用，赋予\
  \ `Squib` 类你在下方类类中看到的那些与猫相关的方法和属性似乎是合理的。请记住，费格夫人也是一个麻瓜。\n\n***\n\n```java\ning Squib\
  \ implements MyPlaces, Command {\n\tprivate String squibName;\n\tprivate Place currentlyLocatedAt;\n\
  \tprivate boolean ownsCat = false;\n\tprivate Wizard whomToProtect;\n\n\tpublic\
  \ Squib( String squibName ) {\n\t\tthis.squibName = squibName;\n\t}\n\tpublic String\
  \ toString() { return squibName; }\n\n\tpublic void setCurrentlyLocatedAt( Place\
  \ place ) {\n\t\tcurrentlyLocatedAt = place;\n\t}\n\tpublic Place getCurrentlyLocatedAt()\
  \ {\n\t\treturn currentlyLocatedAt;\n\t}\n\tpublic void setOwnsCat( boolean yesOrNo\
  \ ) {\n\t\townsCat = yesOrNo;\n\t}\n\tpublic boolean getOwnsCat( ) {\n\t\treturn\
  \ ownsCat;\n\t}\n\tpublic void useCatAsLookout( Wizard target ) {\n\t\tSystem.out.println(\
  \ \"Cat owned by \" + squibName\n\t\t\t+ \" keeping an eye on \" + target );\n\t\
  }\n\tpublic void setWhomToProtect(Wizard ward) {\n\t\twhomToProtect = ward;\n\t\
  }\n\tpublic void execute() throws UnableToProtectHarryterException {\n\t\tif ( getCurrentlyLocatedAt()\
  \ !=\n\t\t\t\twhomToProtect.getCurrentlyLocatedAt() ) {\n\t\t\tthrow new UnableToProtectHarryterException(this\n\
