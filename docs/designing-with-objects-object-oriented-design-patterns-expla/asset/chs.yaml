  \n# 23 模板方法\n\n## 23.1 可定制的食谱\n\n如果你是一个世界旅行者，你可能会注意到当你走进一家异国美食餐厅时，得到的食物味道与原产地并不完全相同。正如你可能猜到的，原因在于根据当地的口味偏好对原始食谱进行定制，否则食物将卖出去。如果原始食谱让食物对当地口味来说太辣了，那么他们的定制就必须减少香料的使用。\n\
  \n泛指食谱，让我们来谈谈算法，因为你可以把算法看作食谱。通常情况下，当你尝试解决一个新问题时，你会发现，如果某个已知算法的某些步骤可以自定义以处理你数据的特殊性，那么这个问题就可以通过该算法来解决。有趣的是，许多允许任何程度定制的标准算法通常也会清楚地指示哪些步骤是可以更改的，从而使得整个解决方案仍然是认为是符合算法的。\n\
  \n例如，考虑常用的排序算法，如 `quicksort`、`mergesort`、`heapsort` 等。这些算法的特征是具有不同的最坏空间时间权衡，它们在处理数据以进行排序方面存在差异。然而，所有此类算法都有一个共同点：它们都需要某一个比较器函数，告诉算法如何对数据中的任何两个元素进行排序。对于排序类对象，必须仔细指定比较器函数，因为如何比较从类中构造的两个不同实例是由程序员决定的。将比较器函数插入排序算法中就是对其数据进行定制的示例。\n\
  \n在算法定制的背景下，模板方法模式的目的是通过在基类中定义不变部分并在派生类中定义变量部分来定制方法的行为。这是从自上而下的视角来看模板方法。从自底下的视角来看，假设你有一个算法，它的某些步骤取决于调用算法的上下文，或者取决于算法处理的对象类型，或者任何其他影响算法运行的因素。考虑到算法是一系列步骤，我们在抽象基类中放置那些无论上下文、对象类型或任何影响算法运行的因素都保持相同的步骤。对于其他步骤，我们只在基类中声明它们，而在不同的子类中提供它们的实现。随后，当我们通过构造一个具体子类的实例来实例化算法时，我们可以确定该算法将使用基类代码处理不变步骤，使用子类代码处理剩余步骤。\n\
  \n## 23.2 意图与适用性\n\n模板方法模式的意图是将问题的算法解决方案的不变步骤（这些通常是定义定义至关重要的本质步骤）放在基类中，然后让子类为基类代码的不同可能定制提供重写。\n\
  \n在以下情况下，你应该考虑使用此模式：\n\n* 你使用的算法解决方案需要针对处理不同的数据类型、操作上下文、计算资源等进行定制；\n\n\n\n\n\n*\
  \   你所需的自定义不会改变算法本身的根本特征，但可能会改变与涉及的数据元素操作相关的低级细节、计算资源的使用方式、与环境的交互模式等。\n\n## 23.3\
  \ 模板方法模式简介\n\n模板方法模式的核心在于，我们能够将解决问题的算法解决方案表示为在根类中声明的一系列更基础的方法调用。通常，这些更基础的方法中的某些在根类中可能被赋予“什么都不做”（do-nothing）的实现。然而，当运行时通过派生自根类的子类实例调用相同的算法时，根类的方法调用——包括那些在根类中具有“什么都不做”实现的方法——将被翻译为对子类中重写定义的调用。这允许我们在根类中以泛化的方式定义算法。随后，在运行时，这些算法能够根据子类对根类中泛方法调用的重写定义展现出自定义的行为。\n\
  \n具体来说，假设某个算法解决方案需要步骤 A、B 和 C。我们可以将该算法解决方案可视化：\n\n```\nAlgorithm:\n    Step A\n\
  \    Step B\n    Step C\n```\n\n对于基于模板方法模式的解决方案，我们定义一个根类，可以将其命名为 `GenericSteps`，并为该类配备命名为\
  \ `method_for_A()`、`method_for_B()` 和 `method_for_C()` 的方法。在 `GenericSteps` 类本身中，我们将这些方法定义为具有“什么都不做”的实现：\n\
  \n```\n    class GenericSteps:\n        protected void method_for_A() { return null;)\n\
  \        protected void method_for_B() { return null;)\n        protected void method_for_C()\
  \ { return null;)\n```\n\n随后，我们指定 `GenericSteps` 的多个子类，这些子类在三个步骤的部分或全部实现上有所不同。因此我们可以有：\n\
  \n```\nclass Approach_1 extends GenericSteps:\n    void method_for_A() {\n     \
  \ // A 步骤过程\n    }\n    void method_for_B() {\n      // B 步骤过程\n    }\n    void\
  \ method_for_C() {\n      // C 步骤过程\n    } \n```\n\n```\nclass Approach_2 extends\
  \ GenericSteps:\n    void method_for_A() {\n      // A 步骤过程\n    }\n    void method_for_B()\
  \ {\n      // B 步骤过程\n    }\n    void method_for_C() {\n      // C 步骤过程\n    }\n\
  ```\n\n现在，某些问题的算法解决方案可以在编译时根据根类 `GenericSteps` 中的方法调用来指定。随后，在运行时，可以通过上述任一子类调用相同的算法，选择取决于与算法使用相关的上下文。我们将这种在根类中声明算法步骤、并在根类的不同子类中放置步骤的多种备选实现的方法称为算法的*模板化*（templatization）。\n\
  \n在足够抽象的描述层级上，上一章的策略模式与本章的模板方法之间存在许多概念上的相似之处。两者的共同点在于在基类中勾勒解决问题的多步解决方案，并由其具体的子类为那些与基类代码不同特定自定义相关的步骤提供重写实现。在这种情况下，读者可能会问，策略模式和模板方法之间有什么区别呢？\n\
  \n这两种模式之间存在两个差异：(1) 一个差异关系到它们在实践中可能的实现方式。对于策略模式，人们可能会通过所选策略的中间体来调用具体策略子类中的解决方案步骤。另一方面，当使用模板方法模式时，正如本章所解释的，人们更有可能直接依赖具体子类方法的多态调用。(2)\
  \ 第二个差异关系到基类代码中有多少部分需要在子类中重写。在策略模式中，子类可能会为基类中的*所有*算法步骤提供重写实现（因为所有步骤的解决方案加在一起就构成了一个策略*）。而在模板方法中，算法的大部分将在基类中实现，每个子类则仅为那些定义了特定自定义的步骤提供重写。\n\
  \n## 23.4 现实应用中的模板方法模式\n\n注意，模板方法模式所属的基础概念直了面向对象编程的核心——*多态*（polymorphism）概念。作为面向对象编程的基石之一，你可能会在面向对象的软件中到处看到这个概念。多态允许我们通过根类中声明的方法来操作从不同子类实例化的对象。因此，当在一个对象集合上调用相同的方法时，通过多态，我们确保每个对象所使用的方法定义与构建该对象的子类中的实现相对应。\n\
  \n以下是一些著名的软件系统示例，在这些系统中，根接口中定义的高级任务通过上述方式的方法多态调用来执行：`Qt` 中的低级事件处理以及 `wxWindows`\
  \ 中所有事件的处理。`Qt` 和 `wxWindows` 都是基于 C++ 的 GUI（图形用户界面）编程平台。\n\n模板方法模式之所以超越了多态的基本概念，仅在于它侧重于根类将算法定义为一系列更基础的方法调用，其中一些基础方法定义在根类本身中，而另一些则仅表示为抽象声明，期望子类能够提供其具体实现。\n\
  \n在算法意义上，方法多态调用最著名的例子可能是面向对象语言中对排序工具的支持。例如，Java 集合框架提供了排序算法，这些算法默认使用所谓的待排序元素的*自然顺序*（natural\
  \ order）。如果你对自然排序产生的结果不满意，可以在调用排序方法时传入一个额外的 `Comparator` 参数，用于说明如何在排序时对元素两两比较。因此，如果你的代码调用了\
  \ `Collections.sort()`，并将待排序集合作为方法的第一个参数，并将 `Comparator` 对象作为第二个参数，那么运行时排序程序的执行将遵循\
  \ `Collections` 类中定义的逻辑。然而，对于任何两个元素之间的比较，Java 将使用你通过 `Comparator` 对象提供的标准。\n\n\n\
  \n\n\n我们对模板方法模式的演示包含编写一个计算机程序，用于生成关于哈利·波特在每个夏天结束时回到学校的故事。这些故事讲述了哈利在德思礼一家度过的最后几天发生的事件、他前往霍格沃的旅程，以及学校学期的开学仪式。在《哈利·波特》系列书中，这些故事每年各异，作为该年剩余时间所发生事件的引言。\n\
  \n更具体地说，我们的目标是编写一个具有“算法”风格的程序——尽管“算法”本身只是一个仅三个步骤的简单序列——使得其通用步骤在每年保持不变，而这些步骤的实现细节则随之变化。保持不变的步骤形成了一个有序序列，并对应于以下故事叙事的生成：\n\
  \n1. 夏季假假的结束，\n2. 前往霍格沃的旅行，以及\n3. 霍格沃的欢迎仪式。\n\n这三个故事的叙事生成器将由一系列故节生成器组成。尽管故节生成器的名称每年也保持不变，但它们产生的故节将是特定于每。例如，考虑通往国王斯十字站四分之站台的故节生成器。到达该站台是每年学年初前往霍格沃旅行的一部分（上述列出的第二个故事）。因此，虽然你每年都需要\
  \ `getting-to-theplatform` 故节生成器，但产生的故节每年都不同。例如，对于第一年，故节必须考虑到哈利完全不知道如何到达站台，以及韦斯莱夫人（她碰巧注意到了哈利看起来不知所措的神情）如何告诉他必须刻意“撞上”\
  \ 9 号和 10 号站台之间的屏障。而在第 2 年，与魔法站台相关的故节变得复杂了，因为小家精灵多比对屏障施了咒咒，以在哈利遵循他第一年使用的相同程序时防止其打开。\n\
  \n为了了解上述三个故事的叙事生成器如何被分解为更基础的故节生成器，请考虑上述三项中的第一项。这是关于夏季假结束结束，此时哈利·波特仍在德思礼一家。我们将这个故事生成器标记为\
  \ `endOfSummerHolidays`，它将由以下两个故节生成器组成：`endOfSummerWithDursleys` 和 `acquiringSchoolSupplies`。为了合成\
  \ `endOfSummerHolidays` 的叙事，我们必须首先获取 `endOfSummerWithDursleys` 的故节，然后对 `acquiringSchoolSupplies`\
  \ 执行同样的操作。将这两个故节合并就成了 `endOfSummerHolidays` 的故事。我们将使用模板方法模式来处理这两个故节每年变化的问题。我们将首先创建一个根类——`EndOfSummerStories`——它对这两个步骤的故节将返回\
  \ `null`。然后，我们将该根类扩展为不同的具体子类，对应哈利在霍格沃度过的不同年份。对于生成另外两个故事，我们将执行相同的操作。它们的故事生成器将标记为\
  \ `travelToHogwarts` 和 `welcomeCeremoniesAtHogwarts`。\n\n我们可以将上述内容称为《哈利·波特》中夏季结束故事和学年开始故事叙事生成的“模板化”。\n\
  \n## 23.6 模式演示的高层视图\n\n在图 23.1 所示的类图中，故事生成类的根是抽象类 `EndOfSummerStories`，我们在其中定义了下面列出的三个方法，这些方法构成了创建与哈利·波特在夏季假结束时回到学校相关的叙事的简单“算法”的基本步骤。我们在这个抽象类中还放置了其他相对于三个主要故事生成方法起支持作用的方法。为了突出这种区别（这种区别对于理解所示代码如何演示模板方法模式至关重要），我们在图\
  \ 23.2 中仅重新绘制了抽象根类 `EndOfSummerStories`，其中支持主故事生成器的故节生成方法以偏移方式显示。正如图 23.2 所示，构形成我们故事生成器算法的三个主要方法是：\n\
