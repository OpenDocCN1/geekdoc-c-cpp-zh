  \n## Notes\n\n# 17 迭代器 (ITERATOR)\n\n## 17.1 存储对象集合并与之交互\n\n假设你的应用程序需要扫描计算机内存中的对象集合，并且偶尔查询其中一个对象。但正如你所知道的，你与集合的交互在很大程度上取决于你如何在内存中存储对象。如果每个对象都可以分配相同数量的空间，你就可以将对象存储在连续的内存中，一个接一个。这样做的一个巨大优势是，访问任何对象所需的时间将与整个集合的大小无关。要访问集合中的第\
  \ $N^{th}$ 个对象，你只需要将每个对象占据的空间乘以 $N - 1$，你就知道要查询哪个内存位置的所需对象。读者显然知道，这就是计算机程序存储 `array`（数组）的方式。当集合在创建后不再需要被修改时，这种存储在非连续内存段的方法效果非常好。\n\
  \n现在让我们考虑一种情况，即集合的某些特性限制了对象在内存中的存储顺序。例如，假设你将组织中所有员工的姓名按年薪递增顺序存储起来。当你最初编写代码时，你确保了为数组分配了足够的内存以容纳组织中的所有人。但对你的代码不利的是，在代码运行后，你的组织又雇用了几个人。现在你面临着一个困境：你不仅必须向集合中添加额外的成员，还根据他们的年薪将姓名插入到集合中的特定位置。假设你想坚持使用数组存储方法，这意味着你需要创建另一个版本的源码，其编译将产生与组织当前状态对应的目标代码。如果你的代码是给其他人使用的，他们可能不会对每当组织雇佣或解雇人员就必须重新编译源码感到兴奋。\n\
  \n\n\n显然，聪明的程序员会预见到此类问题，并且对于上述描述的场景，会使用其他更灵活的存储形式，允许在程序运行时修改集合。这些灵活的存储形式都基于链式结构，这种结构允许对象存储在非连续的内存块中。在最简单的此类结构（称为\
  \ `linked lists`，即链表）中，你为每个对象关联一个内存地址，该地址指向下一个对象的位置。有了这些链接内存地址，程序就可以从一个对象跳转到另一个对象，直到到达最后一个对象（而该对象没有与下游的任何对象链接）。像这样的灵活的结构允许在集合的任何位置插入新对象。你只需要更改上一个对象的链接内存地址——它现在需要指向新插入的对象——而新插入对象的链接内存地址将指向下一个对象。相似的逻辑也使得从集合中移除任何对象都变得变得轻而易举。\n\
  \n然而，链式结构带来的灵活性是需要代价的：现在无法以与集合大小无关的时间访问单个对象。当泛化使用链式结构时，访问集合中任何对象的唯一方法就是从集合开始开始，从一个对象跳转到另一个对象，直到找到你正在寻找的对象。\n\
  \n可以创建既保留了数组的效率又具有链式结构灵活性的集合存储结构，但仅限于某种程度。例如，在数组分配内存时，你可以请求比当前实际需要的更多的内存，以便在数组中放置额外项目而无需重新编译源代码。出于显而易见的原因，这种方法的成功取决于你预测未来的能力——即使在理想的情况下，这也是一项极具风险的任务。\n\
  \n到目前为止，我们只讨论了存储结构在最简单的对象访问问题上的效率和灵活性：即在对象以某种顺序存储在集合中的假设下，访问集合中的单个对象。人们还可以针对以下问题提出对象访问和检索：\n\
  \n* 访问特定值的对象；\n* 检索指定值范围内的所有对象；\n* 访问集合中与另一个对象值最接近的对象；\n* 检索集合中与给定对象值最接近的 `k` 个对象；\n\
  * 等。\n\n这些问题最简单的情况发生在对象值是一维的场景。对于一维情况，效率最高的存储结构通常是 `binary search tree`（二叉搜索树）的变体，其中每个节点存储一个对象（或指向一个对象的指针）以及两个内存地址，一个用于左子节点，另一个用于右子节点。所有值小于节点对象值的对象都在该节点的左分支中。所有值大于节点对象值的对象都在该节点的右分支中。在类二叉树的常见变体中，对象仅存储在二叉树的叶节点中，每个节点仅存储一个决策值，用于区分挂在左分支的叶节点对象与挂在右分支的叶节点对象。当对象由多维值表征时，一维情况的简单二叉搜索树就推广为所谓的\
  \ `k-d tree`，其中“k-d”代表“k 维”。\n\n这里得出的重要点是，不存在一种单一的最佳方法来计算机内存中存储集合。如果你正在创建一个涉及对象集合的软件库，你为集合提供的存储机制将取决于客户端想要对集合执行什么种的操作，以及客户端在从集合中寻求答案时期望的计算效率。\n\
  \n迭代器模式（Iterator pattern）旨在设计一种接口，用以访问集合中的对象，使客户端不受对象存储方式精确细节的影响。\n\n## 17.2 意图与能力\n\
  \n迭代器模式的意图是为软件客户端提供一种访问集合中单个对象的方法，这种方式独立于集合中对象的具体存储方式。\n\n在以下情况下，你应该使用此模式：\n\n*\
  \ 你提供的用于遍历集合的接口对于不同类型的集合需要是统一的，无论对象是如何存储的；\n* 你提供的接口包含了对插入新对象和删除现有对象的运行时支持（并且你的客户端期望你的接口能显式说明动态插入和删除的后果）；\n\
  * 你提供的迭代功能需要允许以同等的便利进行正向和反向的遍历；\n* 遍历集合的机制需要允许同时发生多次遍历。\n\n## 17.3 迭代器模式简介\n\n正如第\
  \ 17.1 节所示，遍历对象集合的精确细节取决于用于集合的存储结构，而且通常情况下，存储结构选择取决于你的客户端想要在集合上执行什么种类型的操作，以及集合应该以何种计算效率对哪些类型的问题提供答案。\n\
  \n正如预期的那样，将这些特定集合的细节暴露给程序员不仅会导致编程效率的低下，还会使代码变得更加不可读。这正是迭代器模式大显身手的地方。该模式告诉我们遍历不同类型集合的统一接口的优点。通过基于迭代器模式的接口，客户端不需要知道对象存储的精确细节。对于所有编写为给定迭代器接口的集合，客户端将使用完全相同的编程范式。\n\
  \n## 17.4 现实应用中的迭代器模式\n\n迭代器在所有现代面向对象的平台上都是通用的。例如，Java 带有 `java.util.Iterator` 接口类，其\
  \ API 由以下声明组成：\n\n```\n boolean hasNext()\n T next()\n void remove()\n```\n\n其中\
  \ `T` 是实现接口的集合所存储的对象类型。`hasNext()` 方法在集合还有对象时返回 true；随后可以通过调用 `next()` 获取该对象。`remove()`\
  \ 方法删除上次调用 `next()` 返回的对象。\n\nJava 平台还包含了另一个名为 `ListIterator` 的接口类，它派自 `Iterator`，专门用于遍历基于链表的存储结构。（Java\
  \ 的 `java.util.ArrayList` 就是这样一种存储结构的示例）。加上从父接口 `Iterator` 继承的方法，`ListIterator`\
  \ 的 API 包含以下声明：\n\n```\n void add( T object)\n boolean hasNext()\n boolean hasPrevious()\n\
  \ T next()\n int nextIndex()\n T previous()\n int previousIndex()\n void remove()\n\
  \ void set(T object)\n```\n\n\n\n在上述方法声明中，除了从父接口 `Iterator` 继承的方法外，`hasPrevious()`\
  \ 和 `previous()` 允许对容器进行反向遍历，就像 `hasNext()` 和 `next()` 允许我们正向遍历容器一样。`add()` 方法在\
  \ `next()` 调用将返回的对象之前插入一个新对象。`set()` 方法将 `next()` 返回的上一个对象替换为新对象。在上述其他方法声明中，`nextIndex()`\
  \ 和 `previousIndex()` 返回一个类似数组的整数索引，当这些对象被概念化为线性顺序结构时（可以称之为一个想象的数组），人们可以将该索引与这些对象相关起来。\n\
  \n在迭代器模式的实际实现中，一个重要的考虑因素是在遍历过程中对集合所做的任何更改及其后果。假设用户在遍历集合时，他/她决定删除一个对象。那么问题变成了：该对象应该是立即删除，还是在迭代循环结束时删除？在迭代过程中动态（动态）删除现有对象（或插入新对象）会带来编程开销，这在运行时可能会产生性能影响。另一方面，如果在迭代循环完成后执行相同操作，而在迭代进行过程中访问了之前标记为删除的对象，则可能会在运行时产生逻辑错误。\n\
  \n## 17.5 用于说明迭代器模式的哈利·波特故事\n\n迭代器通过富含需要遍历的集合的程序能得到最好的演示。为了这个目的，我们选择了《哈利·波特》第一本中的分帽故事。这个故事的讲述（通过计算机程序）需要多个列表。\n\
  \n以下是对分帽的内容以及它为什么能很好地说明迭代器模式的简要描述：当第一批新生——在本章中被称为“新生”——首次到达霍格沃时，他们经历的第一个仪式之一就是被分配到学校的四个学院之一。新生人数总是\
  \ 40 人，每个人都必须被分配到以下四个学院之一：格芬德、赫奇奇、斯拉文学院和斯莱林。每个学院都有其独特之处。正如分帽告知新生的那样，格芬德以内心勇敢的巫师闻名；赫奇奇以相信公正和忠诚闻名；拉文学院以对智慧和学习充满热情的巫师闻名；最后，斯莱林以为了实现目标可以不择手段的巫师闻名。在分学院仪式上，每个新生都被要求戴上帽子，帽子由于施了魔法，能够读取新生的心绪并为新学生找出最合适的学院。为此，如果学生有任何偏好，帽子会考虑进去。你看，有些新生来到霍格沃时对不同的学院有强烈的观点。对于那些来自熟悉这四个学院及其传统的巫师家族的新生来说，情况尤为如此。新学生可能有学院偏好的另一个原因是，他/她可能在分学院仪式之前就已经建立了友谊，并希望与朋友待在同一个学院。\n\
  \n在计算机程序中捕捉分帽仪式涉及到几个集合以及对它们进行遍历。我们需要从一个新生姓名列表开始。我们希望使用某种标准对此列表进行排序，该标准对于为每个新生命名最佳学院有用。我们需要维护一个已分配到每个学院的新生列表，以便确保每个学院的新生总数不超过该学院可用空位数量。最后，我们还需要一个四个学院的列表，以便我们的程序在尝试模拟分帽为每个新生寻找最佳学院时可以遍历这些学院。所有列表如何被访问和处理，将受到每个学院可用空间数量（每个\
  \ 10 个）以及男女之间可用空间划分（每个性别在每个学院获得 5 个空间）的限制。本章中迭代器模式的演示忽略了与男女可用空间划分相关的限制。\n\n从编程的角度来看，我们必须决定在基于计算机程序的分帽故事重述中，为不同的列表使用何种存储结构。我们在新生首次到达霍格沃时需要一个存储结构。我们还需要已分配到每个学院的姓名的存储结构，因为我们需要跟踪每个学院仍剩余多少空位。基于学院的学生列表最好实现为链表，因为这些列表在学生被分配到每个学院的过程中，是在运行时动态创建的。最后，将新生分配到四个学院必须遵守与“真实”分帽相同的限制：它必须考虑\
  \ (1) 学生的才能和偏好；(2) 每个学院的特质；以及 (3) 学院中剩余的空位。\n\n## 17.6 模式演示的高层视图\n\n图 17.1 是本章模式演示的高层视图。首先关注\
  \ `Fresher` 类，由于每个霍格沃学院都以居住在那里的巫师的特殊特质闻名，我们必须在分配学院时考虑到入学学生的才能相对于这些特质。为此，我们将根据以下才能相关的属性对学生进行评估：\n\
  \n```\naptitudeForBravery\naptitudeForWitAndKnowledge\nhowFairnessMinded\nhowGoalOriented\n\
  ```\n\n我们将假设这四个属性中的每一个都是按 100 分制衡量的，并且当学生被要求戴上帽子时，帽子能够算出值。这些属性的值将存储在上述 `Fresher`\
  \ 类的实例变量中。所示，该类的其他实例变量为：\n\n```\nname\npreferredHouse\nhowStronglyPreferenceWanted\n\
  ```\n\n其中变量 `name` 显然是新姓名。我们将新生对希望所在的学院的偏好存储在变量 `preferredHouse` 中。此外，我们使用变量 `howStronglyPreferenceWanted`\
  \ 来存储学生偏好的坚定程度。\n\n![image](img/c17f001.gif)\n\n**图 17.1**\n\n我们将对分帽如何将新生分配到学院做出合理的假设。为了理解下述假设，请注意，描述学生的才能属性的取值范围越大，该属性在排序过程中就越有用。例如，考虑一下如果所有新生在\
  \ `aptitudeForBravery` 上的得分都一样会发生什么。如果每个人在 `aptitudeForBravery` 方面都一样优秀，那么勇敢的才能就不再是决定谁应该去哪个学院的区分特质。记住这一观察，我们的演示基于以下逻辑（我们假装这是分帽使用的逻辑）将新生分配到学院：\n\
  \n\n\n\n\n1. 我们根据四个属性中最具判别力的一个对新生生进行排序，即 `aptitudeForBravery`、`aptitudeForWitAndKnowledge`、`howFairnessMinded`\
  \ 和 `howGoalOriented`。这将会是新生生中取值范围最大的属性。\n\n2. 随后，从上一步生成的排序列表中一个接一个地取出学生，通过一个两步的过程将学生分配到一个学院院中，该过程由一个初始分配和一个随其后的最终分配组成。关于这两个步骤：\n\
  \n    1. 初始分配是将学生安置在他/她偏好的学院院中。\n    2. 最终分配可能会考虑到学生在排序列表中的排名以及其偏好的强度，从而改变初始的学院分配。因此，如果一个学生在最具判别力的能力属性中排名较低，且对目标学院院的偏好强度也低，那么为了平衡每个学院院分配人数需要将其移动到另一个学院院，该学生极有可能从其最初分配的学院院被移出。\n\
  \n这引出了我们在演示如何使用迭代器模式（Iterator pattern）的描述。正如图 17.1 所示，我们定义了一个容器接口 `MagicCollection`\
  \ 并在两个容器 `MagicList` 和 `MagicSet` 中实现了该接口。这两个容器都以链表的形式存储其对象，两者之间的唯一区别在于后者容器不允许你存储已在容器中的重复对象，因为那违反了集合（set）的访问准则。对于迭代器模式的演示，这两个容器最重要的共同点是它们都实现了一个名为\
  \ `iterator()` 的方法，该方法返回一个 `Iterator` 类型的对象。每我们需要遍历任何 `MagicList` 实例或 `MagicSet`\
  \ 实例时，都通过 `Iterator` 接口中声明的 `hasNext()` 和 `next()` 方法来实现。这些通过 `hasNext()` 和 `next()`\
  \ 方法对 `Iterator` 接口的调用构成了我们对迭代器模式的演示。\n\n## 17.7 用于演示迭代器模式的工具接口\n\n为了让读者更容易理解本章其余部分的演示代码，本节描述了在代码中如何表示不同的霍格沃茨学院以及新生的名字。³\
  \ 正如本节所示，我们将这两者都表示为接口中的 Java 枚举（enum）结构。\n\n后续接口定义中显示的第一个枚举是用于霍格沃茨学院的名字。这个枚举非常简单，不需要进一步解释。然而，显示的第二个枚举用于新生的名字，则更为复杂。它的复杂性源于在声明新生名字之后，⁴，该枚举提供了一个构造函数，其作用是返回一个\
  \ `FresherName` 类型的实例。因此，当枚举返回实例 `AbbotHannah` 时，它实际上是调用了构造函数来执行此操作，并向构造函数提供了跟随每个枚举值之后的括号参数。所以对于\
  \ `AbbotHannah` 实例，两个参数将是“Hannah”和“Abbot”，第一个成为 `firstName` 参数的值，第二个在调用构造函数时成为 `lastName`\
  \ 参数的值。`FresherName` 枚举还附带了一个 `toString()` 方法，它告诉系统如何为枚举的每个实例创建一个打印表示。`toString()`\
  \ 方法根据与每个枚举实例关联的实例变量 `firstName` 和 `lastName` 创建打印表示。正如你预期的，实例变量通过构造函数获取其值。因此，如果你的代码中有如下陈语句：\n\
  \n```\nFresherName name = AbbotHannah;\n```\n\n变量 `name` 将被设置为 `FresherName` 枚举构造函数返回的对象。该构造函数将被隐式调用，并带有两个参数“Hannah”和“Abbot”。\n\
