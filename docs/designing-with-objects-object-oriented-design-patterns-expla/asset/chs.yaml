  353. 348\n354. 349\n355. 350\n356. 351\n358. 353\n359. 354\n\n\n\n\n\n\n一直关注我的“对象三曲”（Objects\
  \ Trilogy）项目进展的读者们，看到该系列的第三部也是最后一部将会感到欣慰——尽管它比计划推后了近两年。\n\n\n\n\n\n\n主要的罪魁祸首在于找到解释设计模式的合适媒介。当我几年前首次宣布我的\
  \ `Objects Trilogy` 项目时，正如我当时所说的，我的计划是通过世界上著名的短篇故事来解释这些模式。我所说的“著名”是指经典且通用的——即那些在用于解释模式时不需要重新讲述的故事。这些本应该是汉斯·克里斯蒂亚安·安德森、格林兄弟以及他们世界其他地区的对应的作品。但不幸的是，当我开始将这些模式映射到这些故事上时，我越发地发现这类故事并不具备模式所需的所需的复杂度。于是，我转向了\
  \ `Harry Potter`。\n\n我应该提一下，在本书项目之初，`Harry Potter`完全不在我的考虑范围内。并不是说我不知道`哈利·波特`已经成为一种全球性现象。毕竟，谁会错过那些媒体报道呢？比如在每本新的`哈利·波特`发布时，孩子们和父母在商店门口排成几英里长的队伍。但对我来说，我是随着上述那些悠久且受推崇的经典短故事长大的，为了探索其解释设计模式的可能性，而去费力阅读一个非常长的故事（共七本书）似乎是没有必要的。\n\
  \n\n然而，在意识到传统民俗和童话对于这个项目的局限性后，我带着更加严肃的目标转向`哈利·波特`。当我开始阅读这个系列丛时，不仅被 J. K. 罗林的叙事能力彻底震撼，更被整个多卷本故事内部子叙事那种令人愉悦的复杂性所吸引。当我一本接一本阅读`哈利·波特`书籍时，每当遇到一段似乎具有我所寻找的复杂性的故事片段，我都会产生一个“啊！”的时刻。尽管有很多这样的时刻，但在对该系列进行多次阅读之后，除了与家人朋友交流，特别是与那些已经读过很多`哈利·波特`的家人和朋友的孩子交流之后，我才有信心使用故事的某一部分来解释某种模式。\n\
  \n如果读者对我使用`哈利·波特`来解释模式的最初反应是类似于：“解释这些模式真的需要使用任何文学媒介吗？”我不会感到意外。这些读者可能会补充道：“如果对模式的解释不满意，为什么不基于真实世界的例子，而不是来自魔法世界的故事来进行进一步解释呢？”我接下来将回答这些问题。\n\
  \n## 真实世界案例 vs 文学故事\n\n除了 Erich Gamma、Richard Helm、Ralph Johnson 和 John Vlissides\
  \ 编写开创性书籍《Design Patterns — Elements of Reusable Object-Oriented Software》（首次向编程界引入了这些模式）之外，现在在各种书籍和互联网上几乎存在成百上千种对这些模式的解释。我认为，大量材料出现出现让许多更复杂的模式变得更容易理解。相反，那些更复杂的模式在今天仍然像\
  \ Gamma 等人首次介绍它们时一样晦涩难懂。而且，即使通过 Gamma 等人提供的原始解释，这些模式已经很难理解了，这一点可以从他们书籍序言中的这段评论中推断出来：“*一句警告和鼓励：如果你在第一次阅读时没有完全读懂这本书，请不要担心。我们在第一次撰写它时，也没有完全理解所有内容！*”\n\
  \n现在让我来讨论使用真实世界案例来改进现有模式解释的问题。请注意，对于目前存在的绝大多数解释，作者确实尝试过使用真实世界案例。但由于各种原因，这些解释的效果并不理想。主要原因可能是，典型的空间限制使得作者无法充分展示一个真实世界的应用。因此，读者得到的是某些真实世界案例的高度缩减版本，从其与模式的关联性来看，这些版本往往难以欣赏。此外，读者可能对作者所使用的真实世界应用完全感兴趣。如果由于某种原因，读者无法对所谓的真实世界案例产生共鸣，为什么不使用熟悉文学作品中的例子呢？希望读者能发现那些更容易产生共鸣。\n\
  \n根据我教学面向对象（OO）设计模式的经验，我观察到，当学生试图通过导师对某个真实世界应用的高度简简的演示来掌握模式中的软件抽象时，而这种演示又未能激发他们的积极性，结果就是学生和导师之间产生了立即的脱节。如果某个模式的解释是基于导师并不熟悉的应用，那么学生收到的很可能是一个缺乏清晰度和说服力的演示。\n\
  \n我认为，这是由于缺乏既能吸引学生注意力，又便于教学且不会给教师带来过大负担的解释性材料，导致尽管 OO 模式非常重要，但大多是以碎片化的方式被传授的。在大多数情况下，软件工程讲师只教他/她熟悉的几种模式。很少有以任何统一的方式教授所有模式的情况。\n\
  \n\n我必须强调，并不是所有模式都难以理解。事实上，几个处理对象创建的模式是非常容易理解的，通过最简单的解释就能立即明白。但那些涉及不同对象之间相当复杂的运行时交互的模式，在开始被大脑吸收之前可能需要巨大的努力。Gamma\
  \ 等人在我之前展示的序言引用中，指的正是这些更复杂的模式。我这本书的目标是借助取自`哈利·波特`的故事，让这些模式变得更容易理解。\n\n你们中可能有人在想，`哈利·波特`已经过时了——因为它不再像以前那样频繁出现在新闻中——所以我可能在解释模式时寄希望于了一颗正在陨落的星上。是的，看起来过去几年环绕着`哈利·波特`的极度媒体炒作已经结束了。但那是因为媒体中没有东西是永恒的，这既适用于转瞬即逝的主题，也适用于永恒的主题。我仍然看到许多年轻人在阅读和喜爱`哈利·波特`。我的感觉是，`哈利·波特`就像苏斯博士的作品一样永恒。它们都不再受到媒体的关注，但在全球范围内继续受到广泛喜爱。\n\
  \n\n\n\n\n我显然没有幻想，那些对于目前现有解释难以理解更复杂模式的读者，在读到我基于`哈利·波特`的相同内容的解释时，会突然产生“啊哈！”的顿悟。我有理由确信，将`OO`设计这一严肃的主题与`哈利·波特`的轻快素材相结合，我将会面临一些批评。尽管如此，至少，这本书将证明，可以利用那些我们在情感上能产生共鸣的主题（通过我们的幻想或其他方式），为`OO`设计模式构建解释性的类比。即使这本书仅仅鼓励了其他作者在未来编写使用非传统类比的书籍——即那些我们可以基于共同的人类经验产生共鸣的类比——来解释那些通常被认为复杂且枯燥的想法，我也会感到非常满意。\n\
  \n这引出了我在本书中使用的`哈利·波特`故事。如果你读过系列丛，可能有自己最喜欢的故事。至于这些故事是什么，可能取决于几个因素，包括你可能的教育背景和文化视角。然而，如果你具有科学思维，很难想象与以下魔法物体相关的故事没有在你脑中留下不可磨灭的印象：用于将每届新生分配到四个`霍格沃学院`的`分院帽`；作为记忆助具的`记忆球`；用于时间旅行的`时间转换器`；以最强烈方式传递情感的`尖叫信`；用于在伦敦快速旅行的`流网网`；用于瞬时信号传递的`黑记`以及其他几个。这些故事所传达的与自己的幻想并不遥远，这些幻想部分源于我们的科学狂热，部分源于我们应对日常生活及其所有挫折的渴望。我在本书对模式的解释中使用了其中几个故事。\n\
  \n\n模式章节的其余部分从一个提到该模式解决的广为人知的现实问题的部分开始。接着是一个回顾用于解释该模式的`哈利·波特`故事的部分。我尝试这样编写这部分，即使是以前没有读过`哈利·波特`的读者也能看到一个大致完整的叙述，可以作为章节其余部分演示模式的“介质”。至于我在这一努力在多大程度上取得了成功，还有待待观察。章节中的后续部分首先通过整体类图展示模式演示的顶层视图，然后是展示演示中使用的`Java`类的部分。每个章节都以“玩代码”部分结束，该部分首先展示了读者通过执行演示代码可以看到什么，然后讨论了读者自己如何进一步扩展代码，以获得对模式的额外见解。\n\
  \n书中显示的所有代码都可以在 `https://engineering.purdue.edu/kak/designingwithobjects/` 下载。目前，所有代码都是`Java`语言的。如果时间允许，该网站在未来的某个时间点还将包含其他语言的实现。如果我在书籍印刷后发现任何错误——或者我收到了读者的此类报告——它们将发布在同一网站的勘表中。我非常乐听到读者对书中任何拼写错误、错误等的反馈，以及对书中未来版本的改进建议。\n\
  \n我希望这本书能像`对象三部曲`（Objects Trilogy）的前两本书一样受到好评。第一本《面向对象的编程》（Programming with Objects）已被许多大学选为教材。第二本《面向对象的脚本》（Scripting\
  \ with Objects）作为教材和参考书正获得关注，尽管它更有可能被用作后者。这本书《面向对象的设计》（Designing with Objects）除了可能作为高级编程课程的教材或参考书外，旨在供个人兴趣阅读。\n\
  \nAvinash C. Kak\n\n*印第安纳州，西拉法法尔特*\n\n## Notes\n\n\n我要感谢我在 John `Wiley` 出版公司的前编辑\
  \ George Telecki，他启动了这项书籍计划。考虑到这项工作相当不常的性质，需要像 George 这样拥有宏大技术观的编辑才能欣赏这样书的价值。\n\n\
  我还要感谢 John `Wiley` 的两位编辑 Kari Capone 和 Brett Kurzman。Kari 接手了 George 的工作，然后将项目交给了\
  \ Brett，并由他完成了工作。\n\n非常感谢 Malena de la Fuente，感谢我们许多关于`哈利·波特`的交谈。Malena 读了很多遍`哈利·波特`，而且是用两种语言——英语和法语读过的。对于某些模式，我并不立刻清楚哪一个`哈利·波特`章节是构建解释的最佳介质。与\
  \ Malena 的交谈在选择最佳章节方面非常有帮助。\n\n手稿的最终清理得助于 Sriram Karthik Badam，他是一个罕见的人才，对`哈利·波特`和`Java`\
  \ 编程都有深奥的了解。他发现了几个拼写错误，并对改进用于解释模式的代码提出了许多有用建议。\n\n我还要感谢 `ArgoUML` 的开发者，这是我用来创建书中所示类图的开源\
  \ `UML` 图表工具。\n\n最后，最重要的是，我想向 Stacey Smythe 表示最深切的谢意，她不仅是生活中让我们人性的最重要的事的来源，而且是第一个建议通过`哈利·波特`来构建模式解释的人。我无法想象比与价值观如此反映我的人分享生活更快乐的事了。\n\
  \nA.C.K.\n\n\n总的来说，设计涉及复杂的心理过程，其中大部分并没有被很好地理解。然而，人们通常认为，所有设计在某种细节程度上都涉及到使用以前学过的模式。人们完全可以假设，那些因其工作而闻名的设计师在相当低的细节水平上使用模式。像莫扎特这样的音乐天才，可能只为他想要创造的最基础的音效使用任何以前学过的模式。另一方面，可以说，他那个时代（或者坦率地说，任何时代）的水平较平庸的作曲家可能从那些天才们创造的和声和节奏中借鉴了大量的元素。\n\
  \n在艺术和文学领域，对内容原创性的要求使得在新的设计中必须将现有模式的使用降到最低，但在软件领域，情况恰恰相反。在软件设计中，虽然在处理迄未见过的问题时，原创性和创造力很重要，但更重要的是所产生软件的正确性和健壮性。\n\
  \n\n\n\n\n如果软件设计中的一个新问题与之前过的问题相似（并且已经已知存在正确的软件解决方案），那么使用之前开发的解决方案将优于解决该新问题的全新且创新的方法。使用该问题的\
  \ `previously known trusted solution` 只能增加他人对你软件的信任。\n\n而且，如果你恰好正在处理一个大型复杂的问题，该问题不适用于任何单一的先前已知解决方案策略，那么你被要求要有创造性，将问题分解为多个子问题，并使用先前已知的信赖解决方案来解决这些子问题。\n\
  \n总的来说，当你分解一个大问题时，产生的子问题可能具有不同程度的复杂性和细节。你的整体分解可能是分层级的，其中最小的问题可以使用你用于软件开发的编程语言中通用的编程惯用法来解决。是的，这些编程惯用法也可以称为模式（patterns）。然而，在本书书中我们不会关注此类低级设计问题。\n\
  \n另一方面，本书介绍的是针对你在为大问题创建软件解决方案时可能遇到的、模糊可以称为“中级问题”的信赖解决方案。特别是，我们将关注那些由四位作者（现在被亲切地称为“四人帮”，GoF）首次提出的二十三种模式可以解决的中级问题。这些模式首次出现的书籍现在通常被称为面向对象（OO）设计模式的“圣经”。下一节将专门介绍这本书及其内容。\n\
  \n\n软件社区的模式运动是由 Erich Gamma、Richard Helm、Ralph Johnson 和 John Vlissides 编写的备受盛名的书籍\
  \ `Design Patterns — Elements of Reusable Object-Oriented Software` [1] 开启的。基于他们在面向对象编程方面的共同经验，作者们成功地凝练出了二十种设计模式，如世所周知，这些模式已成为许多现代面向对象软件的构建模块。正如上一节提到的，这些作者被称为“四人帮”（GoF），而这本书经常被称为“GoF\
  \ 面向对象模式之书”。\n\nGoF 书籍令人惊叹的之处，也是使其永不过时的原因，不仅在于其二十三种模式可以解决的各种编程问题，更在于作者们具有远见，能够识别出面向对象设计中许多可能永远存在的基础问题。把握当下的现实并从中抽象出可以在未来很长一段时间内服务我们的新基本理解，绝非易事。\n\
  \n大多数 GoF 模式的核心是以下四个良好的面向对象编程原则之间的相互作用：\n(1) 针对类层次结构根部声明的公共接口进行编程，而不是直接调用这些接口实现中定义的方法。\n\
  (2) 如果在尝试创建泛型对象所有不同变体的表示最佳方法时，纯基于继承的实现可能导致类的数量到无法维护，则选择组合（composition）而非继承（inheritance）。\n\
  (3) 再次选择组合而非继承，如果由前者在对象间相互关系上所实现的灵活性比后者所提供的表示效率（representational efficiency）更重要的话。\n\
  \n在这里，我们将简要回顾上述原则的直观基础：当类层次结构的用户确保他们自己的代码只调用层次结构根接口中声明的公共方法时，那些负责提供和维护层次结构中实现代码的人，只要接口声明保持不变，就获得了更改这些代码的自由。\n\
  \n关于第二个原则，尽管继承被尊为面向对象编程的基石，但不加思考地使用它可能会导致类层次结构过大。如果你尝试为捕获通用类的每一个细微变化创建一个子类，你可能会得到太多的子类。为什么不通过组合来处理这些细微变化呢，即为你的通用类赋予额外的实例变量，以获得额外的自由度，从而允许从类中创建更多样化的实例？由于从类定义构造的对象是由于给定实例变量的值“组合”而成的——这些值本身可以是类类型对象——你可以理解为什么我们使用“组合”一词来描述这种继承的替代方案。\n\
  \n正如第三个原则所示，偏向组合而非继承，在需要保持不同类型对象之间相互关系方面的编程灵活性的情况下也是意义的。虽然继承可以实现高效的表示框架（因为在通用类中声明的公共属性不需要在特化类中重复），但一旦创建，产生的对象间关系就会硬编码在代码库中。\n\
  \n第四个原则中提到的利用函数重写对类行为进行运行时自定义的直觉同样显而易见。当你使用函数重写时，你为方法编写的代码——特别是方法调用同一类中定义的其他辅助方法时——从表示一系列行为的角度来看，变得更加高效。你从运行时激发的特定行为可以通过重写子类中的辅助方法来定制。\n\
  \n回到 GoF 书籍中二十三种模式的主题，这些模式被 GoF 分为以下三类：(1) 创建（Creational）、(2) 结构（Structural）和 (3)\
  \ 行为（Behavioral）。为了进一步区分，每个模式都被赋予了一个助记名称，捕捉了该模式的本质。\n\n创建模式从面向对象编程中经常出现的若干考虑因素角度出发，研究了设计类以及从这些类构造实例的方法时所面临的问题。例如，考虑上述良好的面向对象编程原则之一：面向对象软件的用户应该只针对类层次结构的接口进行编程。记住这一原则，这里有一个创建模式解决的问题示例：假设我们有两个类层次结构，一个在其中建模领域知识，另一个在其中我们有使用间接（indirection）输出第一个层次结构中类实例的代码。我们仍然能够让软件的客户端遵守上述良好的面向对象编程原则吗？创建模式还意识到，如果要产生的实例需要特殊的计算资源，那么随意调用类的构造函数可能是件危险的事情。这些模式教给我们的教训包括如何设计一个类，以便我们对从类创建的实例进行某些控制——即对同时存在的实例数量的控制。\n\
  \n\n\n\n\n结构型模式也涉及设计类以及从类构造实例，但现在与类设计相关的表示问题变得更加复杂。举例来说，假设由单个类捕获的问题领域的基本表示必须通过某些特定装饰的任意组合来增强。创建一个整体表示的最方法是什么，使其既能高效地生产实例，又能将这些装饰融入其中？结构型模式的另一个重要表示问题是，当问题领域需要实例化由小对象组成的大对象时，且所有对象（包括大对象）都具有同种基本类型时，该如何设计类层次结构？结构型模式还涉及如何编写一个新类，该类必须同时适应旧类的行为，并为该旧类的客户端提供新服务；以及如何为不同类别的用户为复杂的类系统创建不同的使用视图等。\n\
  \n行为模式关注的是如何从一组协作工作的类中诱发出有用的运行时行为。这些行为是动态的，从这个意义上说，一个类（或一组协作工作的类）对运行时条件（可能由用户输入或其中一个对象的状态变化引起）的响应，通常取决于与该条件相关的所有其他对象的状态。这的一个主要结果是，类在运行时交互的执行流无法提前预测——这与创建型和结构型模式的情况不同。行为模式表现出的动态效果包括：在运行时从支持类提供的更基础的行为合成大型行为；调节一组类之间的交互以符合运行时选择的协议；将对象的状态回滚到早些时候的状态等。\n\
  \n\n尽管二十三种设计模式中的某些是直观易懂且容易理解的，但有几种模式需要反复阅读 GoF 的书籍才能让这些思想深入脑海。而且，即使在阅读多次之后，只有当你亲手编写了一个模式后，你才能声称完全理解了\
  \ GoF 作者试图传达的内容。以下引用 GoF 书序言的引言可能是说明其中几种模式复杂性的最好指标：\n\n> “一句警告也是一句鼓励：如果你在第一次读这本书时没有完全读懂，请不要担心。我们第一次写出来时也没有完全写懂！”\n\
  \n斜体部分由本书作者编写。[¹]](#c01.xhtml_c1-note-0001)\n\n正是这些更困难模式的复杂性，构成了你在书中其余部分的动力：试图通过《哈利·波特》中的故事来解释这些模式，从而消除它们的神秘感。感谢\
  \ J. K. 罗琳讲述故事的天赋，《哈利·波特》中不同角色之间交互的丰富性可以用来解释面向对象模式中最复杂的对象交互。书中的其余章节正是这样做的。\n\n没有读过\
  \ GoF 书的读者可能会问，书中作者在最初介绍模式时使用了什么解释模式。或者，在 GoF 书出版后的其他关于面向对象设计模式的书书中使用了哪些类型的解释。在读者在现有文献中看到的多数解释中，作者都尝试使用面向对象软件开发中的“真实世界”问题来既激励读者学习模式，又展示它们的内部工作原理。但遗憾的是，在几乎所有情况下，书籍典型的空间限制阻止了对“真实世界”问题的充分阐述。\n\
  \n因此，读者在几乎所有其他书籍中看到的模式解释，仅仅是一些真实世界问题的骨架版本。对于大多数读者来说，要根据这些高度简化的原始真实世界问题描述的模式解释产生共鸣并不容易——除非他们恰恰在这些问题领域工作。让我们换种说法：我们真的能相信，一个花费所有时间为金融应用程序编写代码的人，能够通过文本格式转换或计算机辅助设计中高度简化的问题版本，就理解与该模式相关的所有细微差别吗？\n\
  \n读者在基于真实世界问题简短虚构版本的模式解释中体验到的这种脱节，对于一个年轻的学生来说往往会更加明显，因为他必须同时跨越两个世界：一个是他类她仍在努力理解封装、继承、并发、多态等基本概念的世界，另一个用于模式解释的真实世界。\n\
  \n所以，如果所谓的“真实世界”问题的骨架版本不是解释模式的最佳媒介，那么使用听起来通用的类名、属性和方法名来构建模式解释又如何？例如，对于类名，我们可以使用\
  \ `A`、`B`、`C` 等字母；对于方法名，我们可以使用 `fooA()`、`barA()`、`bazA()`、`footB()` 等。随后，我们可以通过方法调用来描述从一个类构造的对象对从另一个类构造的对象到底做了什么，并将这些交互编织进一个解释模式的叙述中。这种方法的主要问题是，随着类数量和类与之间交互数量的增加，要记住分配给不同类的角色以及编写在它们方法中的行为将变得困难。\n\
  \n当然，可以给类及其方法赋予更有意义的名字，即能唤起其目的的名字。但这通常会导致荒谬的名字或长得离谱的名字。例如，假设你为一个模式编写解释，展示如何让一个新类适应旧类。你可以尝试将旧类称为\
  \ `OldClass`，将新类称为 `NewClass`。现在假设你的解释需要你为多个具有不同角色的旧新类命名。作为使用“有意义”名称的尝试，你可以尝试 `OldClassForRoleM`、`NewClassForRoleN`\
  \ 等，并将后缀 `RoleM` 和 `RoleN` 替换为类的实际角色名称。如你所示，随着类数量的增加，你的解释听起来将变得无味、笨拙且枯燥。\n\n\n\n\
  \n\n\n![image](img/c01f001.gif)\n\n**图 1.1**\n\n![image](img/c01f002.gif)\n\n**图\
  \ 1.2**\n\n\n虽然这本书是为已经熟悉哈利·波特的读者撰寫的，但这并不意味着没读过那些书的人就无法理解书中提供的解释。从下一章开始，每一章都包含一个标题为“用于说明\
  \ XYZ 模式的哈利·波特故事”的章节，该章节主要目的是为了让哈利·波特粉丝回忆起解释该模式时使用的观点，但对于其他人来说，它作为一个独立的“短故事”也应该是易于理解的。如果一个读者在开始读这本书之前没有阅读哈利·波特的兴趣，只要他能足够包容地将这一章节视为一个独立的叙述——它是关于某些魔法物品的，或者是关于某些角色之间的互动——尽管其文字绝不是以\
  \ J. K. 罗琳那种同样引人入胜的风格编写的——但他/她应该能够利用该故事来理解该模式的其余解释。\n\n\n每个模式都将在单独的章节中介绍，每个章节由以下部分组成：\n\
  \n*   模式中核心思想的介绍。\n*   模式的意图和适用性。\n*   模式的总体介绍。\n*   一个描述使用了哈利·波特故事哪个部分来解释模式的章节。该章节的标题始终为“用于说明\
  \ XYZ 模式的哈利·波特故事”（模式 XYZ）。\n*   一个标题为“模式演示顶视图”的章节，展示了相关模式的整体类图以及相关的解释。该章节中对模式的解释是前一个“哈利·波特故事”章节叙述的扩展。\n\
  *   “顶视图”章节之后是多个章节，每个章节专门解释一个类，尽管在某些情况下，一个章节可能会介绍多个密切相关的类。\n*   每一章都以一个名为“玩代码 (Playing\
  \ with the Code)”的章节结束，该章节首先描述如何编译和执行为该模式提供的 Java 代码，然后讨论读者如何扩展演示代码，以对该模式获得额外的见解。\n\
  \n## 1.5 面向对象编程的术语\n\n快速翻读这本书的读者——尤其是那些对面向对象编程接触较少的读者——可能会对某些描述软件中如何创建和操作对象、它们如何相互作用、客户端如何与它们交互等的术语感到困惑。下方显示的术语定义正是为了这类读者准备的，其理念是，这可能帮助读者从高层面上（即使不是详尽地）掌握书中对模式的解释。[²]](#c01.xhtml_c1-note-0002)\n\
  \n\n定义中以斜体出现的单词在随后的“术语表”中也会有定义。\n\n*   `abstract class:`（抽象类）：在 `class` 条目的基础上补充，如果无法从该类中构造出`instances`（实例），则该类是抽象的。抽象类通过充当接口，在面向对象程序编程中起着非常重要的作用。\n\
  *   `abstract method:`（抽象方法）：在 `method` 条目的基础上补充，如果方法的头部包含 `abstract` 关键字，则该方法可以声明为抽象的。当一个方法被声明为抽象时，它不带有任何实现代码。\n\
  *   `access control modifiers:`（访问控制修饰符）：类的每个成员（无论是变量还是方法）都关联有一个访问控制属性，在 Java 中该属性是\
  \ `private`、`public`、`protected` 和 `package` 之一。\n*   `attribute:`（属性）：参见 `instance\
  \ variable`（实例变量）。\n*   `base class:`（基类）：参见 `inheritance`（继承）。\n*   `child class:`（子类）：参见\
  \ `inheritance`（继承）。\n*   `class:`（类）：在概念的高层面上，`class` 可以被看作一种类别或类型。我们可以将“User”视为一个类，那么一个特定的用户就是该类的\
  \ `instance`（实例）或从该类构造的 `object`（对象）。以下是 Java 中 `User` 类的定义：\n\n    ```\n    class\
  \ User {\n     private String name;\n     private int age;\n    }\n    ```\n*  \
  \ `class hierarchy:`（类层次结构）：参见 `inheritance`（继承）。\n*   `class method:`（类方法）：参见 `method`（方法）。\n\
  \n\n\n\n\n首先阅读 `instance variable`（实例变量）条目。除了实例变量外，我们还可以为类赋予一个或多个 `class variables`。实例变量的值是每个实例单独的，而类变量的值对于从该类构造的所有实例都是全局的。类变量通常被称为\
  \ `static variables`（静态变量）。在 Java 中，通过使用关键字 `static` 来声明类变量，如下面的类定义，该类声明了两个实例变量和一个类变量：\n\
  \n```java\nclass SavingsAccount {\n    private String name;\n    private int age;\n\
  \    public static double interestRate;\n    // ....\n}\n\n### 具体类 (concrete class)\n\
  非 `abstract`（抽象）的类非正式地称为 `concrete class`。\n\n类通常被赋予一个 `constructor`，其任务是从类中创建实例。构造函数为实例分配所需的内存，并在该内存中根据传递给构造函数的参数设置实例变量的值（或者在没有参数的情况下，根据已知的默认值进行设置）。下面显示了\
  \ `User` 类的另一种定义。你在标记为 “(A)”到 “(D)”的行中看到的是该类的构造函数。\n\n```java\nclass User {\n  \
  \  private String name;\n    private int age;\n\n    public User(String str, int\
  \ yy) {    (A)\n        name = str;                 //(B)\n        age = yy;   \
  \                //(C)\n    }                               ..(D)\n}\n```\n\n通常，一个类允许拥有数量数量构造函数。当一个类有多个构造函数时，它们在参数数量和参数类型上不同。编译器使用\
  \ `overload resolution`（重载解析）来确定对于给定的构造函数调用调用哪一个。\n\n参见 `inheritance`（继承）条目。\n\n\
  ### 扩展类 (extended class)\n参见 `inheritance`（继承）条目。\n\n### final\n参见 `inheritance`（继承）、`instance\
  \ variable`（实例变量）和 `overriding`（重写）条目。\n\n### implements\n首先阅读 `interface` 条目。为接口中声明的方法提供实现代码的类被称为\
  \ `implement`（实现）该接口。\n\n之前我们将 `class` 定义为一个类别。更通用类别的子类别也可以被定义为一个类——形式为更通用类的 `subclass`（子类）。子类\
  \ `inherits`（继承）对应于更通用类别类定义的某些或全部属性和方法。\n\n由于通常情况下一个类可以扩展为多个 `subclasses`（子类），每个这样的子类进一步扩展为更专门的\
  \ `subclasses`，依此类推，我们可能会得到所谓的 `class hierarchy`（类层次结构）。\n\n子类通常也被称为 `derived class`、`extended\
  \ class` 或 `child class`（子类）。更通类通常被称为 `base class`（基类）或 `superclass`（父类）。\n\nJava\
  \ 中用于定义子类的语法由以下示例所示：\n\n```java\nclass User {\n    private String name;\n    private\
  \ int age;\n    public User(String str, int yy) { name = str; age = yy; }\n}\nclass\
  \ StudentUser extends User {    (A)\n    private String schoolEnrolled;\n    public\
  \ StudentUser( String nam, int y, String sch ) {\n        super(nam, y); //(B)\n\
  \        schoolEnrolled = sch;\n    }\n}\n```\n\n其中 `StudentUser` 是 `User` 的子类。注意行\
  \ (A) 中的 Java 关键字 `extends`。还要注意子类的 `constructor` 定义如何通过行 (B) 中的关键字 `super` 调用基类的构造函数，以构造子类对象的基类部分。通过上所示的类与子类定义，`StudentUser`\
  \ 类型的实例可以像 `User` 类型的实例一样工作。也就是说，我们可以构造一个 `StudentUser` 实例并将其赋值给 `User` 类型的变量。子类类型对象可以像父类类型的事实被称为\
  \ `polymorphism`（多态）。另外注意声明为 `final` 的类不能有子类。\n### 实例 (instance)\n给定一个类，你可以通过调用它的\
  \ `constructor` 来构造该类的特定 `instance`。由构造函数创建的 `instance` 通常也称为 `object`（对象）。\n\n\
  ### 实例方法 (instance method)\n参见 `method` 条目。\n\n### 实例变量 (instance variable)\n在 `class`、`constructor`\
  \ 和 `inheritance` 条目中的 `User` 类定义中，我们将 `name` 和 `age` 称为类的 `instance variables`。通常，我们期望此类变量的值在不同实例之间有所变化。再次，通常除非声明为\
  \ `final`，否则赋值给实例变量的值是可以更改的。`instance variable` 也可以在类定义中被赋予一个默认值。`instance variable`\
  \ 也称为 `attribute`（属性）。\n\n### 实例化 (instantiation)\n`instantiation` 一词意味着构造类的 `instance`。\n\
  \nJava `interface` 是一种 `abstract class`（抽象类），在最常用的用法中，它仅通过提到方法的 `signatures`（签名）来声明一组方法。Java\
  \ `interface` 不得包含任何实现代码。这里是 Java 框架中的一个接口示例：\n\n```java\ninterface Collection {\n\
  \    public boolean add( Object a );\n    public boolean remove( Object a );\n \
  \   // other methods\n}\n```\n\nJava 接口还用于将相关的常量组合在一起。当类继承自此类接口时，这些常量看起来就像是在类中局部定义的。此类常量被隐式地视为\
  \ `static` 和 `final`。\n\n类通常通过函数赋予行为，这些函数通常在从该类构造的实例上被调用。此类函数最常用方法称为方法。下面所示 `User`\
  \ 类中 `print()` 的定义就是一个例子：\n\n```java\nclass User {\n    private String firstname;\n\
  \    private String lastname;\n    public User(String str, int yy) { name = str;\
  \ age = yy; }\n    public void print() {\n        System.out.print( firstname +\
  \ \" \" + lastname );\n    }\n}\n```\n\n\n### 对象 (object)\n首先看 `instance` 条目。小写\
  \ ‘o’ 的 `object` 不要与 Java 中大写 ‘O’ 的 `Object` 混淆。前者可以指任何通过调用构造函数创建的实例，而后者是 Java 中所有类的父类的名称。因此，Java\
  \ 中的所有对象都是 `Object` 类型。\n\n\n\n\n- **重载 (overloading)**：重载方法名或构造函数名意味着能够使用不同数量和/或类型的参数来使用相同的名称。当一个类具有重载的构造函数或方法名时，由编译器负责确定为给定的调用哪个构造函数或方法。编译器通过使用所谓的`overload\
  \ resolution algorithm`（重载解析算法）来实现这一点。\n- **重载解析 (overload resolution)**：请参见`overloading`\
  \ 条目。\n- **重写 (overriding)**：`subclass`（子类）可以为基类定义的方法提供重写实现。随后，如果在类型为基类但实际指向子类对象的变量上调用该方法，则将使用子类中的方法定义。在基类中声明为`final`的`method`不能在基类的子类中重写。\n\
  - **包 (package)**：请参见`access control modifiers`(访问修饰符）条目。`Package`也可以指“Java 包”，它将相关的类组合在一起并为它们定义命名空间。例如，用户程序中自动提供的\
  \ Java 基础类位于 `java.lang` 包中。通常，如果你需要使用某个包中的类，要么要在程序中导入该包，要么必须使用该类的全限定名。\n- **多态\
  \ (polymorphism)**：请参见`inheritance`(继承)条目。\n- **私有 (private)**：请参见`access control\
  \ modifiers`条目。\n- **保护 (protected)**：请参见`access control modifiers`条目。\n- **公共 (public)**：请参见`access\
  \ control modifiers`条目。\n- **静态 (static)**：请参见`class variable`(类变量)和`class method`(类方法)条目。\n\
  - **静态方法 (static method)**：请参见`method`条目。\n- **子类 (subclass)**：请参见`inheritance`条目。\n\
  - **父类 (superclass)**：请参见`inheritance`条目。\n\n上述列出的面向对象编程术语并不完整。我们只定义了书中其他部分出现频率最高的术语。显然，只有专门研究面向对象的书籍，如《Programming\
  \ with Objects [2]》，才能全面介绍面向对象编程的所有术语。\n\n\n本书用于解释模式的图表大多是基于构建此类图表的 UML 规定的类图。\n\
  \n在 UML 中，类由一个矩形框表示，在最详细的表示中，它被垂直划分为三个部分。类名写在框的最上部分区，中间分区是它的实例变量和静态变量（在 UML 中称为`attributes`属性），底部的分区是它的方法（在\
  \ UML 中称为`operations`操作）。对于具体类，类名以**粗体**显示；对于抽象类，以*斜体*显示。[图 1.3]显示了名为 `Employee`\
  \ 的类的这种表示示例。\n\n![image](img/c01f003.gif)\n\n\n在最常用的用法中，类图显示了不同类之间的两种关系：`generalization`(泛化)和`association`(关联)。父类被认为是其子类的泛化。同样，子类被认为是其父类的特化。例如，[图\
  \ 1.4]的类图用一条带箭头的实线显示 `Employee` 类作为 `Manager` 类的父类，因此是泛化。注意泛化箭头（带有封闭三角形箭头）指向父类。在[图\
  \ 1.4]中，`Manager` 类被认为是 `Employee` 类的特化。另一方面，关联用两个类之间的之间的实线表示，如如图中的 `Employee` 和\
  \ `Corporation` 之间。如果从一个类构造出的对象在某种程度上（例如作为实例变量）使用了从另一个类构造出的对象，则应在两个类之间显示一个关联链接。\n\
  \n![image](img/c01f004.gif)\n\n\n类图中可以描绘的类之间其他类型的关系包括`aggregation`(聚合)和`composition`(组合)。接下来的两个小节将更详细地讨论类图中关联、聚合和泛化的表示。\n\
  \n在[图 1.4]的类图中，我们只在框中放置了类名。通常情况下，一个类显示的细节程度取决于绘制图表时使用的视角。类图可以使用三种不同的视角绘制：(i) `conceptual`(概念的)、(ii)\
  \ `specification`(规范的)和(iii) `implementation`(实现的)。\n\n在概念层级，对于每个类，你只包含传达问题领域主要概念整体感觉所需的最少信息。这是你刚开始设计面向对象程序时可能会绘制的图。然而，即使在完全开发了一个面向对象系统后，概念层图对于向其他人通信系统的粗粒度描述也是有用的。在规范层级，你想显示每个类的接口。在这一层级，你需要明确类的职责，这些职责体现在每个类的公有操作中。在实现层级，你想更精确地显示类在代码中是如何（或需要如何）被实现的。现在，你还将包含私有和受保护的属性和操作。\n\
  \n在面向对象的文献中，还会看到类之间 IsA 和 HasA 关系的提到。前者表示泛化-特化关系，后者表示关联、聚合或组合。IsA 名称旨在捕捉诸如如下的关系：\n\
  \n> `Manager 是一个 Employee`\n> `企业客户 是一个客户`\n\n在这样的语句中，`IsA` 之后的内容是之前内容的泛化或超类型。另一方面，像下面的语句：\n\
  \n> `订单 拥有一个客户`\n> `交响团 拥有一个演奏家`\n> `窗口 拥有一个滑块`\n\n表达了包含关系，即关联、聚合或组合。\n\n\n[图 1.4]中的类图通过关联显示了\
  \ `Employee` 类型对象和 `Corporation` 类型对象之间的概念链接。[图 1.5]显示了此类关联的更详尽表示示例。\n\n![image](img/c01f005.gif)\n\
  \n\n\n\n\n\n在所示示例中，`Employee` 有一个类型为 `Corporation` 的实例变量名为 `employedBy`；该实例变量显示为从\
  \ `Employee` 指向 `Corporation` 的关联链接箭头的标签。我们可以将标签 `employedBy` 称为 `Corporation` 在\
  \ `Employee` 类型实例中扮演的*角色*（*role*）。从 `Employee` 指向 `Corporation` 的关联链接上的箭头被称为*导航*（*navigability*）箭头。箭头告诉我们两个对象中的哪一个实现了该关联。在所示的示例中，角色名为\
  \ `employedBy` 的关联是在 `Employee` 类中实现的，因此它“属于”类型为 `Employee` 的实例。关联末端 `Corporation`\
  \ 处的标签 `0..1` 关联的*多重性*（*multiplicity*），它规定了在角色 `employedBy` 中*有多少个* `Corporation`\
  \ 类型实例可以与单个 `Employee` 类型实例相关联。`0..1` 的多重性意味着一个 `Employee` 雇佣于不超过一个 `Corporation`。\n\
  \n关于图 1.5 中从 `Corporation` 到 `Employee` 的关联链接，导航箭头指向后者，角色名标签为 `employees`，多重性符号为\
  \ `0..*`。`0..*` 的多重性意味着从 `Corporation` 构造的实例允许任意数量的员工，包括零。如果法律要求公司至少拥有一名员工，且对上限没有限制，则与角色名\
  \ `employees` 相关的多重性标签将变为 `1..*`。正如你可能已经猜到的，多重性标签中的符号 `*` 表示*无限数量*（*an indefinite\
  \ number*）。\n\n图 1.5 中的两个关联链接也可以显示为两个类之间的单条线。如果我们对我们的示例这样做，该线将在两端都显示导航箭头、角色名和多重性符号。没有导航箭头的关联被被认为是双向的。\n\
  \n图 1.5 是两个不同类之间二元关联的示例。二元关联也允许连接类到自身，在这种情况下，关联被称为*自反射*（*reflexive*）。图 1.6 展示了一个自反射关联的示例。下一小节将讨论你在图\
  \ 1.6 关联链接底部看到的菱形的作用。\n\n![image](img/c01f006.gif)\n\n**图 1.6**\n### 1.6.2 聚合与组合作为类之间的关系\n\
  \n通过关联连接的对象可能独立于彼此存在，也可能不独立，在类图中区分这两种情况是有用的，特别是当关联是“整体”与其“部分”之间的链接时。\n\n当整体与其部分之间存在生存依赖关系时——即部分仅是为了整体的利益而存在——我们将整体与部分之间的关系称为*组合*（*composition*）。也就是说，我们认为整体是其各部分的复合体。这种关联在基底部用一个实心菱形表示。虽然这种关系也可以用带有适当导航箭头和多重性的简单关联来表示，但将其显示为组合可以引起人们对复合体与其部分之间生存依赖关系的关注。\n\
  \n考虑图 1.7 中的示例，我们使用了实心菱形来显示 `Window` 组合。显然，形成复合体的“部分”（如滑块、滚动条等）在 `Window` 关闭时将停止存在。\n\
  \n![image](img/c01f007.gif)\n\n**图 1.7**\n\n当你拥有一种整体与部分的关系，其中部分可以独立于整体存在时，你所拥有的是*聚合*（*aggregation*）。在图\
  \ 1.8 所示的聚合中，即使 `Orchestra`（乐队）对象停止存在，表演者也将继续存在。聚合在关联链接的一端用一个空心菱形表示，该端是另一端对象的聚合。虽然这种类型的关系也可以显示为带有适当导航箭头和多重性的简单关联，但聚合的概念旨在捕捉这样一个事实：尽管乐队是其表演者的总和，但即使乐队停止存在，表演者也将继续存在。\n\
  \n![image](img/c01f008.gif)\n\n\n### 1.6.3 属性的表示\n\n如前所述，类的属性——可以是实例变量也可以是静态变量——显示在表示类的框的中间分区。UML\
  \ 显示属性的规范如下：\n```\n visibility name [N] : type = initialValue {property-string}\n\
       ---------------\n```\n\n其中可见性为：\n\n```\n + for public visibility\n    # for\
  \ protected visibility\n     - for private visibility\n```\n\n尽管 *public*、*protected*\
  \ 和 *private* 关键字也可以直接使用。可见性标记的缺失表示未定义。\n\n在显示属性的 UML 符号中，属性名位于你看到字符串 `name` 的地方。方括号内的\
  \ `N` 表示多重性。多重性的约定与关联相同。例如，如果属性允许一个或多个值，多重性符号 `N` 将被替换为 `1..*`。多重性的缺失意味着允许仅有一个值。\n\
  \n属性实现类型的语言特定规范位于你看到字符串 `type` 的地方。`initialValue` 是新创建实例属性默认值的语言特定表达式，`property-string`\
  \ 是用于表示属性的其他特性的字符串。例如，对于只读属性（如在 Java 中声明为 `final` 的属性），`property-string` 将被设置为 `frozen`。\n\
  \n在 `name` 和 `type` 下方的下划线如果使用，表示该属性具有类作用域，这与静态的含义相同，而不是每个实例一个。除了 `name` 外，规范的所有其他元素都是可选的。\n\
  \n\n类框从顶部开始的第三个分区（如果存在）显示其*操作*（operations），即类定义的方法。当在规范级别绘制类时，只显示类的公共操作。然而，在实现级别，你还希望显示私有和受保护的操作。操作的完整\
  \ UML 语法为：\n\n visibility name (parameter-list) : return-type {property-string}\n\
        -----------------------------------\n```\n\n其中 *visibility* 和 *name* 的含义与属性的情况相同。*parameter-list*\
  \ 是操作的形式参数的逗号分隔列表，每个参数使用以下语法指定：\n\n```\n kind name : type = defaultValue\n```\n\n\
  其中 `kind` 可以是 *in*、*out* 或 *inout*，其中 *in* 用于向操作传递值的参数，*out* 用于从操作中获取值的参数，*inout*\
  \ 用于可以同时扮演这两种角色的参数。`name`、`type` 和 `defaultValue` 符号起到它们通常的作用。\n\n\n\n\n\n关于操作的语法，`return-type`\
  \ 符号是一个取决于语言的语言类型，表示操作返回的值的类型。`property-string` 可用于表达此类特征，例如操作是否是抽象的（即只有方法的头部是类定义的一部分，而没有提供实现代码的情况）。最后，具有类作用域的操作——即静态方法——将如所示带有下划线。\n\
  \n区分两种类型的操作：`query`（查询）和 `modifier`（修改）是有用的。`query` 操作仅简单地尝试获取某些类属性的值，而不改变对象的状态。相反，`modifier`\
  \ 操作将改变对象的状态。从非正式地说，这两种操作也被分别称为类的 `getter`（get 器）和 `setter`（set 器）方法。\n\n\n创建模式（Creational\
  \ Patterns）向我们展示了如何为类或类层次结构编写代码，以便客户端在从类创建实例时能够遵循良好的面向对象编程原则（如第 1 章中所述的）。\n\n特别是，我们希望类定义能够让客户端通过面向接口编程来轻松创建实例。此外，当我们的类非常复杂时，如果我们能通过提供的实例生产方式某种程度上隐藏这些复杂性，客户端编写的代码更有可能没有错误。让类层次结构中的所有类的接口保持统一也有许多益处。而且，有时我们需要控制从某个类中构造的实例数量。创建模式向我们展示了如何在面向对象的软件中实现这些以及其他类似的目标。\n\
  \n在接下来的内容中，我们列出了书中第一介绍的五种创建模式：\n\n- **抽象工厂（Abstract Factory）**：`Abstract Factory`\
  \ 模式向我们展示了如何通过一组相关的工厂类来高效地组织一组相关对象的生产，以便客户端只需要针对两个接口（每个族各一个）进行编程即可构造出所有对象。\n- **构建器（Builder）**：`Builder`\
  \ 模式通过用于构造由多个部分组成的复杂对象，其构造过程可能涉及算法步骤，这些步骤限制了部分在对象中的组合方式。这里的目标是使客户端与类相关的许多复杂性隔离开。\n\
  - **工厂方法（Factory Method）**：当使用工厂方法进行对象构造且我们发现自己正在处理类层次结构时，我们将面临如何为所有涉及的工厂方法创建一个统一接口的问题。`Factory\
  \ Method` 模式解决的正是这个问题。顺便说一下，通过被称为工厂方法的方法将调用路由到构造函数可能有许多实际原因。我们将在第 4 章中回顾这些内容。\n\
  - **原型（Prototype）**：当类中的实例变量只能取少数离散值时，`Prototype` 模式非常有用。变量的每组离散值都可以被看作是一个原型。通过“预制造”原型并存储在某处，随后所有的实例创建都可以简化为提供其中一个原型的克隆。当通过克隆创建新实例比通过构造函数调用这样做更便宜时，这种模式特别有用。\n\
  - **单例（Singleton）**：如果在任何时刻允许存在的类实例存在实际限制，则 `Singleton` 模式非常有用。在这种模式的典型用法中，一个类允许创建一个实例。任何后续对实例的请求都返回为第一个此类请求创建的同一个实例的副本。\n\
  \n\n## 2.1 软件中工厂的概念\n\n众所周知，工厂是制造产品的地方。软件系统中的工厂具有相同的目的——作为新软件对象的制造者。听到这里，熟悉面向对象编程的读者可能会问：类定义中的\
  \ `constructors` 不应该负责处理对象的构造吗？既然 `constructor` 的概念已经为我们服务很好，为什么还要引入另一种构造对象的机制呢？\n\
  \n要理解类定义中通过 `constructor` 构造与通过工厂构造的区别，请将后者考虑为任务的外包。尽管外包在近年来收到了负面评价，但确实存在外包对所有参与方都有利的情况。它在列出对象规范的代码和使用这些对象的代码之间创建了更大的分离。如果你将对象的设计者、生产者和消费者看作构成了某种链条，那么链条两端之间的分离越大，每一端就越有更大的自由去修改其代码而不影响链另一端的代码。\n\
  \n将“外包”作为理解软件中“工厂”概念的比喻是有效的，前提是必须记住该比喻的以下局限性：在大多数实际外包的示例中，有关产品如何实际制造的细节被委托给了“外包方”组织；而在软件开发中，从类中构造实例的最终责任仍然归类本身所有。在所有情况下，无论是否有工厂，类都必须提供一个允许创建类实例的\
  \ `constructor`。*当部署工厂时，它仅仅是代表客户端决定何时以及如何调用 `constructor` 的中介者*。\n\n由工厂实现的调用 `constructor`\
  \ 的“何时以及如何”在以下情况下可能非常重要：当类的需求很大时；当实例的生产需要特殊的计算资源时；当任何时刻允许存在的实例数量存在实际限制时；当类必须与其他类协作进行实例生产时等。此外，在类供应商和软件客户端之间将工厂作为中介，也让供应商具有更大的自由来升级类的实现代码，只要工厂使用的接口保持不变。\n\
  \nGoF 中有两个处理工厂的相关模式：`抽象工厂` 和 `工厂方法`。上述介绍的软件背景下工厂的基本概念对这两种模式都同样适用。至于两者之间的区别，`抽象工厂`\
  \ 处理的是从一组关联工厂创建一组相关实例，前提是客户端只需要针对两个接口编程，一个用于对象类，另一个用于工厂。这是我们在本章剩余部分重点介绍的模式。另一方面，`工厂方法`\
  \ 模式（正如你在第 4 章中所看到的）更多关注的是通过方法调用（这些方法反过来调用 `constructors`）来创建实例，并为类层次结构中的此类方法调用建立统一的接口。\n\
  \n\n`Abstract Factory` 模式的意图是使客户端能够通过编程少数接口（通常只有两个：一个位于类层次结构的根部，另一个位于工厂类类的根部）来构造一组相关对象。\n\
  \n在以下情况下应考虑使用此模式：\n\n\n\n\n\n- 所有对象可能的不同定制方案可以通过共同主题来刻画（你可以认为每个主题代表某一组密切相关的对象族）；\n\
  - 属于同一主题的所有相关对象都可以由同一个工厂类创建；\n- 满足不同可能主题所需的所有工厂类都可以通过一个通用的工厂接口进行操作。\n\n\n如第 2.1\
  \ 节所述，抽象工厂的重点在于创建`密切相关的对象族`。“密切相关对象族”的一个经典例子——这个例子几乎在几乎每处关于该模式的介绍中都能找到——是一个 GUI（图形用户界面）平台，配备了生产具有不同外观和感受的用户界面的手段。GUI\
  \ 平台为我们提供了窗口、按钮、滚动条和其他控件，这些控件具有特定的外观和感受，或者具有一小组外观效果，供用户从中选择一种。我们可以认为，每种外观对应的控件是密切相关的，因此属于同一个大族。根据抽象工厂模式为此类库编写前端程序，使得创建任何所需外观的控件变得更加高效。\n\
  \n将给定外观所需的所有控件组织到一个族中，只是将此模式用于 GUI 应用的一种方式。另一种在某些情况下更方便的对象族概念化方法是考虑，例如，将不同外观效果的所有\
  \ GUI 按钮视为一个族，将不同外观效果的所有滚动条视为另一个族，以此此类推。每个此类族将指定一个单独的工厂。抽象工厂模式的目标现在是在确保`所有工厂都纯粹通过工厂类层次结构根部的抽象接口进行操作`的情况下，便于从相应的工厂生产所需的对象。\n\
  \n无论如何将对象组织成族，该模式教给我们的重要设计教训是：软件客户端仅可以使用少量的接口（通常只有两个），其中一个接口作为工厂类层次结构的根节点，另一个接口作为描述待创建对象的类层次结构的根节点，从而与整个对象创建软件进行交互。\n\
  \n## 2.4 现实应用中的抽象工厂模式\n\n由于与上一节所述的原因完全相同，该模式被软件供应商所使用，他们为从事电子商务的商业企业创建功能相似但外观独特的\
  \ Web 端 GUI。每家企业都希望其面向客户的前端是独一无二的。然而，所有前端都必须执行非常相似的任务：提供一个允许客户搜索产品的搜索控件；提供一个产品浏览控件；提供一个“购物车”控件；提供一个从客户处获取送货信息的控件；等等。在通用形式下，电子商务网站所需的所有控件可以被认为构成一个族。\n\
  为了创建生产这些控件的工厂，软件供应商可能会设计一个根工厂接口，然后由一个具体类来实现它，以满足特定电子商务客户对外观和感受所需的定制。你可以将根工厂接口理解为定义了一个通用工厂。\n\
  \n利用专门为电子商务客户创建的具体工厂类，客户端只需要调用控件层次结构和工厂层次结构根接口中的方法，即可生产具有所需背景/前景颜色、形状、布局等的不同 GUI\
  \ 组件。客户端不需要知道为了客户的 Web 业务门户的外观感受，哪些类是如何协作工作的精确细节。\n## 2.5 用哈利·波特故事阐明抽象工厂模式\n\n考虑一种情况：我们希望工厂生产以下三种魔法对象：`MagicWands`（魔术棒）、`Broomsticks`（扫帚）和\
  \ `Owls`（猫头鹰）。假设这三所魔法学校——布斯蒂斯、德姆斯特朗和霍格沃茨都希望这些对象能为自己的学生进行定制，定制内容包括在对象上印上校徽。例如，当为霍格沃茨的学生提供魔术棒时，它必须在魔棒的一端附近显示霍格沃茨的校徽。至于猫头鹰，校徽则刻在它们尾部附近。\n\
  \n我们可以将每种对象类型及其其特定的学校定制定义为一个单一的对象族。生成的三个`对象族`随后可以像图 2.1 所示那样可视化。\n\n![image](img/c02f001.gif)\n\
  \n**图 2.1**\n\n\n![image](img/c02f002.gif)\n\n**图 2.2**\n\n现在让我们谈谈由工厂创建的对象。记住，抽象工厂模式是关于创建某种程度上相关的对象，因为只有此类对象才适合通过通用接口进行操作。那么在魔法世界中，扫帚、魔术棒和猫头鹰有什么共同？从我们这里的演示角度来看，它们的共同点都是被魔法化的。因此，我们可以认为所有这些对象都属于图\
  \ 2.3 所示的类层次结构。\n\n![image](img/c02f003.gif)\n\n\n为了演示该模式，我们需要一个向工厂下单的客户。为此我们将使用一个名为\
  \ `DiagonAlleyRetailer` 的类。该类将代表伦敦对角巷的一个零售商。这条街道通常对麻瓜（即非女巫师或女巫师的人）是隐藏的，它是伦敦魔法贸易的主要枢纽。霍格沃茨等学校的学生会在每个学年初在对角巷购买学校用品。\n\
  \n\n\n\n\n\n图 2.4 中的类图是我们对抽象工厂模式演示的顶层视图。代码中唯一的可执行类 `DiagonAlleyRetailer` 是两个类层次结构的客户端，其中一个由根类\
  \ `Enchanted` 头部，另一个由根类 `Factory` 头部。前者根类充当魔法对象类的接口，而后者对工厂类也起了相同的作用。\n\n如类图所示，客户端类\
  \ `DiagonAlleyRetailer` 仅通过两个根类（`Enchanted` 和 `Factory`）中定义的接口来操作这两个类层次结构。这里的“操作”意味着在客户端类的实现代码中调用的方法仅存在于在\
  \ `Factory` 和 `Enchanted` 接口中声明的那些方法。这在本章后续章节的代码中将得到演示。类图还显示工厂根接口声明了方法 `deliverItem()`。对角巷零售商与工厂的交互包括对该方法进行调用。\n\
  \n![image](img/c02f004.gif)\n\n**图 2.4**\n\n我们的演示代码还使用一个名为 `FactoryStore` 的辅助类，如类图所示。如果对角巷零售商想要为霍格沃茨的学生订购魔杖，零售商将使用\
  \ `Factory` 接口方法 `deliverItem()` 向 `MagicWand` 工厂下单。然而，零售商并不知情情，订单实际上是由 `FactoryStore`\
  \ 处理的。只有当 `FactoryStore` 的魔杖供应耗尽时，负责生产魔杖的实际工厂才会被要求补充商店的库存。\n本章的其余部分将介绍我们抽象工厂演示的代码。我们从抽象的\
  \ `Factory` 类开始。\n\n\n这是我们演示中工厂类层次结构的根。除了声明所有继承自此根的具体工厂类都必须实现的 `deliverItem()` 方法外，该类还实例化了\
  \ `FactoryStore` 类。`protected` 变量 `store` 持有商店的引用。这样，在扩展 `Factory` 的所有具体工厂类中都可以访问商店。\n\
  \n```\n public abstract class Factory {\n\n  protected FactoryStore store;\n\n  public\
  \ Factory( String schoolName ) {\n   store = FactoryStore.makeFactoryStore(schoolName);\n\
   }\n\n  abstract Enchanted deliverItem();\n}\n```\n## 2.8 辅助类 FactoryStore\n\n现在描述辅助类\
  \ `FactoryStore`，其目的是作为对角巷零售商与工厂之间的“缓冲区”——这一事实对零售商是隐藏的。换句话说，我们在本节中描述的对商店的使用是工厂层次结构操作中完全内部的细节，客户端对此无所知。请记住，在我们抽象工厂模式的演示中，对角巷零售商仅仅是两个类层次结构的客户端：魔法对象层次结构和工厂层次结构。\n\
  \n至于商店实际上是如何使用的，当零售商向工厂订购魔法对象时，工厂做的第一件事是将订单发送到商店。商店通过一次性向工厂订购 *N* 个魔法对象来管理其库存。这种操作是针对每种魔法对象以及每种魔法对象的特定学校定制化分别进行的。当任何某种特定学校的魔法对象库存耗尽时，商店会自动向相应的工厂请求一个包含该对象\
  \ *N* 件物品的新订单。只要从零售商处收到的订单中的魔法对象有货，商店就会直接履行订单，而不打扰工厂。\n\n在下方所示的 `FactoryStore` 类定义中，实例变量\
  \ `forWhichSchool` 用于订购的魔法对象的特定学校定制。静态变量 *N* 决定了由任何具体工厂类制造每种魔法对象的批量大小。例如，当 *N* 设置为\
  \ 2 时，对于任何给定的学校，`MagicWand` 工厂将被要求一次恰好生产两根魔杖。只有当两根魔杖都被客户订购后（也就是说，只有当 `FactoryStore`\
  \ 提供了它一次从 `MagicWandFactory` 收到的两根魔杖后），`FactoryStore` 实例才会再订购两个。\n\n如 `broomsticksDeliveredFromNewStock`\
  \ 这样的实例变量用于跟踪某种类型物品的已订购数量。当该数量达到任何物品类别由 *N* 指定的值时，相应的工厂会调用其 `replenishBroomstickStock()`\
  \ 方法来制造另一批物品。然后，工厂调用商店的 `acquireMoreBroomsticksFromFactory()` 方法来获取新批物品。诸如 `initializeBroomstickStock()`\
  \ 等名称初始化方法由各个工厂调用，用于初始化如 `broomsticksDeliveredFromNewStock` 等变量；对于这些方法和变量名，当先前的订单耗尽时，会订购一批新的扫帚。\n\
  \n\n`FactoryStore` 类是使用你在第 6 章中将看到的单例模式实现的。这是因为我们希望只让工厂商店为所有零售商提供服务。单例模式的实现方法是将构造函数设为私有（如你在下方代码所示），并提供一个诸如\
  \ `makeFactoryStore()` 的方法，用于获取指向允许存在的唯一且仅有的工厂商店的引用。\n\n\n\n\n\n```java\n import\
  \ java.util.*;\n\npublic class FactoryStore {\n\n    private static FactoryStore\
  \ theStore;\n\n    private String forWhichSchool;\n    private static final int\
  \ N = 2;\n    private int broomsticksDeliveredFromNewStock;\n    private int magicWandsDeliveredFromNewStock;\n\
  \    private int owlsDeliveredFromNewStock;\n\n    private ArrayList<Broomstick>\
  \ broomsticksInStock =\n        new ArrayList<Broomstick>();\n    private ArrayList<MagicWand>\
  \ magicWandsInStock =\n        new ArrayList<MagicWand>();\n    private ArrayList<Owl>\
  \ owlsInStock = new ArrayList<Owl>();\n\n    private FactoryStore( String forWhichSchool\
  \ ) {\n      this.forWhichSchool = forWhichSchool;\n      broomsticksDeliveredFromNewStock\
  \ =\n        magicWandsDeliveredFromNewStock =\n        owlsDeliveredFromNewStock\
  \ = 0;\n      for ( int i = 0; i < N; i++ ) {\n        broomsticksInStock.add( new\
  \ Broomstick( forWhichSchool ));\n        magicWandsInStock.add( new MagicWand(\
  \ forWhichSchool ));\n        owlsInStock.add( new Owl( forWhichSchool ));\n   \
  \   }\n    }\n\n    public static FactoryStore makeFactoryStore(String forWhichSchool)\
  \ {\n      if (theStore == null) {\n        theStore = new FactoryStore(forWhichSchool);\n\
  \      }\n      return theStore;\n    }\n\n    public int batchSize() { return N;\
  \ }\n    public String forWhichSchool() { return forWhichSchool; }\n    public void\
  \ acquireMoreBroomsticksFromFactory(\n        ArrayList<Broomstick> freshStock)\
  \ {\n      broomsticksInStock = freshStock;\n    }\n    public void initializeBroomstickStock()\
  \ {\n      broomsticksDeliveredFromNewStock = 0;\n    public void acquireMoreMagicWandsFromFactory(\n\
  \        ArrayList<MagicWand> freshStock) {\n      magicWandsInStock = freshStock;\n\
  \    }\n    public void initializeMagicWandStock() {\n      magicWandsDeliveredFromNewStock\
  \ = 0;\n    }\n    public void acquireMoreOwlsFromEmporium(ArrayList<Owl> freshStock)\
  \ {\n      owlsInStock = freshStock;\n    }\n    public void initializeOwlStock()\
  \ {\n      owlsDeliveredFromNewStock = 0;\n    }\n    public boolean checkBroomstickStockIsEmpty()\
  \ {\n      return broomsticksDeliveredFromNewStock == N ? true : false;\n    }\n\
  \    public boolean checkMagicWandStockIsEmpty() {\n      return magicWandsDeliveredFromNewStock\
  \ == N ? true : false;\n    public boolean checkOwlStockIsEmpty() {\n      return\
  \ owlsDeliveredFromNewStock == N ? true : false;\n    }\n    public Broomstick deliverOneBroomstickToClient()\
  \ {\n      return broomsticksInStock.get(broomsticksDeliveredFromNewStock++);\n\
  \    }\n    public MagicWand deliverOneMagicWandToClient() {\n      return magicWandsInStock.get(magicWandsDeliveredFromNewStock++);\n\
  \    }\n    public Owl deliverOneOwlToClient() {\n      return owlsInStock.get(owlsDeliveredFromNewStock++);\n\
  \    }\n}\n```\n\n\n抽象类 `Enchanted` 是魔法对象类层次结构的根节点。所有具体的魔法对象类必须继承此类。该类定义了所有工厂制造的魔法对象共有的属性。\n\
  \n在下方所示的类定义中，实例变量 `idNum`、`schoolID` 和 `itemType` 用于为不同学校的魔法对象进行定制。注意，我们并没有试图通过进一步从根类\
  \ `Enchanted` 派生出的具体类 `MagicWand`、`Broomstick` 和 `Owl` 来实现特定学校的定制。这保持了魔法对象层次结构的简单性，并使得根类中的接口更加简单。这种定制方法对我们来说足够了，因为定制非常简单——我们只需要在实例描述中包含学校名称。然而，对于更复杂的定制，可能需要从下一节开始派生定制类。\n\
  \n以标签形式呈现的特定学校定制，是由下方所示类中的 `toString()` 方法自动生成的。魔法对象的标签包含了制造该对象的学校名称，以及一个出于特殊目的的唯一标识符（即序列号）。序列号由实例变量\
  \ `idNum` 提供。\n\n不同魔法对象类型的序列号是分开保存的。`MagicWand`、`Broomstick` 和 `Owl` 之间的序列号不会混用。序列号通过此处定义的实例变量\
  \ `idNum` 以及下一节中展示的每个具体对象类定义的静态变量顺序递增。\n\n public abstract class Enchanted {\n\n\
  \    public int idNum;\n    public String schoolID;\n    public String itemType;\n\
  \    public Enchanted( String forWhichSchool, String itemType ) {\n      schoolID\
  \ = forWhichSchool;\n      this.itemType = itemType;\n    }\n\n    public int getIdNum()\
  \ { return idNum; }\n    public void print() { System.out.println( idNum + \" \"\
  \ + schoolID ); }\n    public String toString() {\n      return schoolID + \"_\"\
  \ + itemType + \"_\" + idNum;\n    }\n}\n```\n\n\n本节的目标是展示 `Enchanted` 类的三个具体扩展类。我们将从\
  \ `Broomstick` 类开始。\n\n在下方所示的 `Broomstick` 类定义中，注意静态变量 `nextBroomstickNum` 初始化为\
  \ 1。该静态变量与继承自父类 `Enchanted` 的实例变量 `idNum` 一起，确保了每个订购的扫帚都有一个唯一的 `id`。这个 `id` 是学校名称与分配给扫帚的唯一序列号的组合。`nextBroomstickNum`\
  \ 在构造函数中递增，以存储分配给下一个扫帚的序列号。\n\n public class Broomstick extends Enchanted {\n\n\
  \    public static int nextBroomstickNum = 1;\n\n    public Broomstick( String forWhichSchool\
  \ ) {\n      super( forWhichSchool, \"Broomstick\" );\n      idNum = nextBroomstickNum++;\n\
  \    }\n}\n```\n\n对应 `Broomstick` 类，接下来展示 `MagicWand` 类的定义。由 `nextBroomstickNum`\
  \ 承担的角色现在由静态变量 `nextMagicWandNum` 扮演。正如读者所期的，这个静态变量与继承自父类 `Enchanted` 的实例变量 `idNum`\
  \ 一起，确保每个订购的魔法棒都关联有一个唯一的 `id`。提醒读者，这个 `id` 是学校名称与分配给每个魔法棒的唯一序列号的组合。`nextMagicWandNum`\
  \ 在构造函数中递增，以存储分配给下一个魔法棒的序列号。\n\n public class MagicWand extends Enchanted {\n\n\
  \    public static int nextMagicWandNum = 1;\n\n    public MagicWand( String forWhichSchool\
  \ ) {\n      super( forWhichSchool, \"MagicWand\" );\n      idNum = nextMagicWandNum++;\n\
  \    }\n}\n```\n\n接下来是 `Owl` 类的定义。它的工作方式与上面出的 `Broomstick` 和 `MagicWand` 类完全相同。\n\
  \n public class Owl extends Enchanted {\n\n    public static int nextOwlNum = 1;\n\
  \n    public Owl( String forWhichSchool ) {\n      super( forWhichSchool, \"Owl\"\
  \ );\n      idNum = nextOwlNum++;\n    }\n}\n```\n## 2.11 具体工厂类\n\n本节展示了派生自 2.7\
  \ 节中抽象根类 `Factory` 的三个具体工厂类。这些具体工厂是 `BroomstickFactory`、`MagicWandFactory` 和 `OwlEmporium`。\n\
  \n\n\n\n\n具体工厂类必须实现父抽象类 `Factory` 中声明的 `deliverItem()` 方法。正如读者在下所示 `BroomstickFactory`\
  \ 定义中看到的，`deliverItem()` 的实现调用了本地私有方法 `deliverBroomstick()`，该方法的实现代码首先检查工厂商店当前持有的库存是否为空。如果不为空，它将从该库存中交付下一把可用的扫帚。然而，如果该库存已用尽，它将触发\
  \ `replenishBroomstickStock()` 方法，为商店生产新一批扫帚。\n\n另请注意，在下方所示 `BroomstickFactory`\
  \ 类定义的三个方法中，只有 `deliverItem()` 方法是公共的，另外两个是私有的。这与根类 `Factory` 中公开的接口保持一致。具体工厂类绝不能将根类\
  \ `Factory` 中不存在的方法通过将其设为公共而暴露出来。换句话说，`Factory` 层次结构的客户端将无法访问任何不在根类 `Factory` 中的工厂方法。\n\
  \n* * *\n\n```\n import java.util.*;\n\n\n  public BroomstickFactory( String schoolName\
  \ ) { super(schoolName); }\n\n  public Broomstick deliverItem() {\n   return deliverBroomstick();\n\
    }\n  private Broomstick deliverBroomstick() {\n   if ( store.checkBroomstickStockIsEmpty()\
  \ )\n   replenishBroomstickStock();\n   return store.deliverOneBroomstickToClient();\n\
    }\n  private void replenishBroomstickStock() {\n   System.out.println( \"Replenishing\
  \ stock with \"\n   + store.batchSize() + \" broomsticks\" );\n   ArrayList<Broomstick>\
  \ freshStock = new ArrayList<Broomstick>();\n   for ( int i = 0; i < store.batchSize();\
  \ i++ ) {\n   freshStock.add(new Broomstick( store.forWhichSchool() }));\n   }\n\
     store.acquireMoreBroomsticksFromFactory(freshStock);\n   store.initializeBroomstickStock();\n\
    }\n}\n```\n\n* * *\n\n接下来所示的 `MagicWandFactory` 类定义与上述的 `BroomstickFactory` 定义平行。遵循抽象工厂模式的精神，我们再次坚持只有继承的\
  \ `deliverItem()` 方法是公共的，任何其他方法对该类都是私有的，这样客户端就不可能直接访问该工厂的任何本地定义的功能。客户端无法直接访问的关键本地方法是\
  \ `deliverMagicWand()`；任何对 `deliverItem()` 的调用都会被转换为对此本地方法的调用。与 `BroomstickFactory`\
  \ 类一样，该本地方法首先从工厂商店交付物品，当商店维护的库存为空时，本地定义的 `replenishMagicWandStock()` 会补充库存。\n\n\
  * * *\n\n```\n import java.util.*;\n\n\n  public MagicWandFactory( String schoolName\
  \ ) { super(schoolName); }\n  MagicWand deliverItem() {\n   return deliverMagicWand();\n\
    }\n  private MagicWand deliverMagicWand() {\n   if ( store.checkMagicWandStockIsEmpty()\
  \ )\n   replenishMagicWandStock();\n   return store.deliverOneMagicWandToClient();\n\
    }\n  private void replenishMagicWandStock() {\n   System.out.println( \"Replenishing\
  \ stock with \"\n   + store.batchSize() + \" magic wands\" );\n   ArrayList<MagicWand>\
  \ freshStock = new ArrayList<MagicWand>();\n   for ( int i = 0; i < store.batchSize();\
  \ i++ ) {\n   freshStock.add(new MagicWand( store.forWhichSchool() }));\n   }\n\
     store.acquireMoreMagicWandsFromFactory(freshStock);\n   store.initializeMagicWandStock();\n\
    }\n}\n```\n\n* * *\n\n由于下方展示的 `OwlEmporium` 定义与 `BroomstickFactory` 和 `MagicWandFactory`\
  \ 类完全对应，其含义不言自明。\n\n* * *\n\n```\n\npublic class OwlEmporium extends Factory {\n\
  \n  public OwlEmporium( String schoolName ) { super(schoolName); }\n\n  Owl deliverItem()\
  \ {\n   return deliverOwl();\n\n  private Owl deliverOwl() {\n   if ( store.checkOwlStockIsEmpty()\
  \ )\n   replenishOwlStock();\n   return store.deliverOneOwlToClient();\n}\n\n  private\
  \ void replenishOwlStock() {\n   System.out.println( \"Replenishing stock with \"\
  \n   + store.batchSize() + \" owls\" );\n   ArrayList<Owl> freshStock = new ArrayList<Owl>();\n\
     for ( int i = 0; i < store.batchSize(); i++ ) {\n   freshStock.add(new Owl( store.forWhichSchool()\
  \ }));\n   }\n   store.acquireMoreOwlsFromFactory(freshStock);\n   store.initializeOwlStock();\n\
    }\n}\n```## 2.12 客户端类 DiagonRetailer\n本节介绍了演示中的可执行类 `DiagonRetailer`。该类的目的是使用\
  \ `Factory` 声明的接口来订购对象。该类通过向用户提供一个文本交互工具来实现这一点，让用户输入想要订购的对象。客户端调用 `Factory` 接口中定义的\
  \ `deliverItem()` 方法来订购。然而，在订购物品之前，我们必须先实例化每个工厂。正如类中的一个注释所示，读者可能会发现对角巷零售商构造工厂实例很奇怪。我们这样做完全是为了编程方便，并且正如第\
  \ 2.13 节所述，留给读者创建一个与实例化独立的更复杂的抽象工厂模式演示。\n\n关于订购特定对象，类中的用户界面提示用户输入 1 表示订购扫帚，输入 2\
  \ 表示订购魔杖，输入 3 表示猫头鹰。如果用户输入 4，则保留结束订购交互。随后，提示用户是否想查看实际订购的内容。注意我们如何使用 `java.lang.Class`\
  \ 的 `isAssignableFrom()` 方法来动态确定客户订购物品的类类型。\n\n\n\n\n\nimport java.util.*;\n\npublic\
  \ class DiagonAlleyRetailer {\n\n    public static void main( String[] args ) {\n\
  \        ArrayList<Enchanted> itemsOrdered = new ArrayList<Enchanted>();\n     \
  \   // To keep the demonstration code simple, we construct instances\n        //\
  \ of the concrete factory classes here (despite the fact that\n        // it seems\
  \ odd for the client class to be instantiating factory\n        // classes):\n \
  \       Factory broomfac = new BroomstickFactory( \"Hogwarts\" );\n        Factory\
  \ wandfac = new MagicWandFactory( \"Hogwarts\" );\n        Factory owlfac = new\
  \ OwlEmporium( \"Hogwarts\" );\n\n        while( true ) {\n            System.out.println(\
  \ \"\\n\\nTo order an enchanted broomstick, \"\n                + \"enter 1\"\n\
  \                + \"\\nTo order a magic wand, enter 2\"\n                + \"\\\
  nTo order an owl, enter 3\"\n                + \"\\nTo quit ordering, enter 4\\\
  n\");\n            Scanner sc = new Scanner(System.in);\n            int in = sc.nextInt();\n\
  \            if ( in == 1 ) itemsOrdered.add( broomfac.deliverItem() );\n      \
  \      if ( in == 2 ) itemsOrdered.add( wandfac.deliverItem() );\n            if\
  \ ( in == 3 ) itemsOrdered.add( owlfac.deliverItem() );\n            if ( in ==\
  \ 4 ) break;\n        }\n        System.out.println( \"Number of items ordered:\
  \ \"\n            + itemsOrdered.size() );\n        System.out.println( \"\\n\\\
  nWould you like to see what you \"\n            + \"\\n Answer \\\"y\\\" for yes\
  \ and \\\"n\\\" \"\n            + \"for no: \" );\n        Scanner sc = new Scanner(System.in);\n\
  \        String yORn = sc.next();\n        System.out.println();\n        if ( yORn.equals(\
  \ \"y\" ) ) {\n            ListIterator<Enchanted> iter = itemsOrdered.listIterator();\n\
  \            while ( iter.hasNext() ) {\n                Object item = iter.next();\n\
  \                if (Broomstick.class.isAssignableFrom(item.getClass())) {\n   \
  \                 System.out.println( \"Item ordered: \"\n                     \
  \   + \"one broomstick \" + item );\n                    continue;\n           \
  \     }\n                if (MagicWand.class.isAssignableFrom(item.getClass()))\
  \ {\n                    System.out.println( \"Item ordered: \"\n              \
  \          + \"one magic wand \" + item );\n                    continue;\n    \
  \            }\n                if (Owl.class.isAssignableFrom(item.getClass()))\
  \ {\n                    System.out.println( \"Item ordered: \"\n              \
  \          + \"one owl \" + item );\n                    continue;\n           \
  \     }\n            }\n        }\n        System.out.println( \"Goodbye!!\" );\n\
  \    }\n}\n```\n\n\n将此模式的文件下载到单独目录中。使用 `javac *.java` 编译代码并通过 `java DiagonAlleyRetailer`\
