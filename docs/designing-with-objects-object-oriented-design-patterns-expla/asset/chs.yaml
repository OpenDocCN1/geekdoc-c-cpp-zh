  \n*   用户通过调用以下代码回滚 `HogwartsHappening` 当前实例的状态：\n\n```\nrestoreStateFromMemento(\
  \ savedStates.get(0) );\n```\n\n*   这意味着，对于任何给定的状态回滚，用户必须能够回想起与想要回滚的先前状态相关的时间索引。但显然，考虑到非常长的状态序列，大多数用户很难记住与\
  \ `HogwartsHappening` 类不同实例相关的 `clockTick` 值。如果你愿意的话，可以通过创建一个与不同状态中的剧情相关的关键词以及相应的\
  \ `clockTick` 值的倒排索引，来让用户的生活过得更轻松。用户随后可以查询此索引，并决定使用哪个先前的 `clockTick` 进行回滚。如果用户对感兴趣的剧情有多个关键词，通过对倒排索引针对不同关键词返回的\
  \ `ClockTick` 条目取交集，用户极有可能锁定到相关的 `clockTick` 值。\n\n## 注释\n\n# 20\n\n观察者模式\n\n##\
  \ 20.1 基于订阅的广播\n\n网络中的信息流可以有多种形式，最常见的是`点对点`和`广播`。对于前者，信息的发送者指定了一个特定的接收者。而对于后者，发送者提供的信息可以被网络中所有能够访问该发送者的人同时接收——除非我们谈论的是`基于订阅的广播`。在基于订阅的广播中，每个希望接收由发送方提供的信息的方都必须先在发送方处进行注册。普通广播的一个例子是你所在地区的广播电电台，而基于订阅的广播的一个例子则是有线电视网络。\n\
  \n软件系统创建的对象之间的若干种运行时行为可以从信息在对象之间的流向方式来理解。例如，考虑以下情况：某个对象（称为“可观察者”，Observable）提供了某些其他对象所需要的随时间变化的信息。每个寻求从可观察者获取此类信息及其更新的对象，完全可以向可观察者发送一对一的请求，并定期这样做以保持与可观察者的最新更新同步。如果接收对象的数量较少且在编译时已知，这种方法可能运行得良好。\n\
  \n然而，从计算开销的角度来看，如果可观察者能够以基于订阅的广播模式向其他对象提供信息，可能会发现更加高效——特别是当接收对象在编译时未知的情况下。在这种模式下，希望从可观察者接收信息的对象将向其注册。可观察者的契约是向所有订阅了其服务的对象广播其所持信息的任何更新。观察者模式教导我们如何最好地实现这种逻辑。\n\
  \n## 20.2 意图与适用性\n\n观察者模式的意图是允许信息从一个指定的对象传播到所有向信息提供者注册的其他对象。\n\n在以下情况下，你应该考虑使用这种模式：\n\
  \n*   你的应用程序需要一个对象（称之为可观察者，Observable），它可以作为几个其他对象重要的、时间变化信息的中心存储库；\n*   你的应用程序中的对象需要一种机制，将它们拥有的信息传播给其他对象——可能通过将其发布在可观察者处；\n\
  *   希望与可观察者保持同步的对象仅在运行时产生；\n*   为了计算效率，可观察者希望仅更新那些与其注册的对象中的信息。\n\n## 20.3 观察者模式简介\n\
  \n正如本章开头部分提到的，运行时的某些对象间行为通过信息在对象之间的流向方式来理解是最好的。当一个 `Observable` 对象作为其他对象所需要的某些特殊信息（可能是随时间变化的）的存储库时，我们希望\
  \ `Observable` 以广播模式运行，即所有希望与 `Observable` 保持同步的其他对象都需要向其注册。这些希望从 `Observable` 接收信息的对象被称为观察者（Observer）对象。而观察者与\
  \ `Observable` 保持同步被称为同步（synchronization）。\n\n至于可能导致 `Observable` 提供的信息随时间变化的原因，可能是应用程序本身状态变化的结果（在广泛使用该模式的\
  \ GUI 框架中通常如此），也可能是因为其中一个观察者向可发布新信息，以便传播给所有其他观察者。\n\n根据模式，`Observable` 类应该提供注册设施，供对象注册为观察者，并在需要时（如果观察者不再希望接收由\
  \ `Observable` 提供的信息）进行“取消注册”。然而，可观察者的主要工作向已注册接收此类信息的对象广播其所持信息的最新变化。观察者需要首先订阅可观察者提供的同步服务，然后接收由可观察者维护的数据存储的最新状态。图\
  \ 20.1 描述了可观察者与观察者之间的关系。\n\n**图. 20.1**\n\n![image](img/c20f001.gif)\n\n## 20.4\
  \ 观察者模式在现实世界中的应用\n\n\n\n\n\n以某种形式，`Observer` 模式在几乎所有现代 GUI 框架的事件处理机制中都起着重要作用。例如在\
  \ Java 中，用户与 GUI 组件的交互会“产生”一个事件，该事件只能被实现了指定的 `Listener` 接口的对象所捕获。例如，当用户点击 GUI 按钮时，按钮产生的事件可以被任何类类实现了\
  \ `ActionListener` 接口的对象所捕获。如果我们与 `Observer` 模式进行类比，那么 `Listener` 对象就是 `Observer`（观察者），而被\
  \ `Listener` 捕获事件的事件产生对象对应于 `Observable`（可观察）对象。\n\nJava 还提供了一个 `Observable` 类和一个\
  \ `Observer` 接口，它们都位于 `java.util` 包中，且都直接基于 `Observer` 模式。让我们快速查看 `Observable` 类的方法：\n\
  \n```\n void addObserver(Observer o)\n protected void clearChanged()\n int countObservers()\n\
  \ void deleteObserver(Observer o)\n void deleteObservers()\nboolean hasChanged()\n\
  \ void notifyObservers()\n void notifyObservers(Object arg)\n protected void setChanged()\n\
  ```\n\n其中第一个方法 `addObserver()` 正如其签名所示，会添加一个新的 `Observer`，该对象会在 `Observable` 对象发生任何变化时接收通知。要让一个对象相对于一个\
  \ `Observable` 对象成为 `Observer`，前者必须实现 `Observer` 接口，该接口仅包含以下方法声明：\n\n```\n void\
  \ update(Observable o, Object arg)\n```\n\n因此，任何 Java 类只要提供了上述声明的 `update()` 方法的实现代码，就可以作为\
  \ `Observer`。至于参数 `arg` 的作用，它被传递给 `Observable` 的单对象通知方法，稍后我们将进行解释。\n\n`Observable`\
  \ 类中的第二个方法 `clearChanged()` 在所有观察者都收到 `Observable` 对象的最新更改后被调用。该方法由 `notifyObservers()`\
  \ 方法自动调用。随后，在 `Observable` 对象上任何对 `hasChanged()` 方法的调用将返回 false。在 `Observable` 对象上调用\
  \ `setChanged()` 方法会将其标记为已更改。在调用 `setChanged()` 后，谓词 `hasChanged()` 将再次返回 `true`。注意这两个同名为\
  \ `notifyObservers()` 的方法签名：\n\n```\n void notifyObservers()\n void notifyObservers(Object\
  \ arg)\n```\n\n这些方法用于通知观察者 `Observable` 对象的任何更改。关于这两个方法之间的区别，请记住每个 `Observer` 都实现了\
  \ `update(Observable o, Object arg)` 方法。在 `Observer` 实例上调用此方法是该实例接收来自 `Observable`\
  \ 对象最新更新的方式。当在 `Observable` 上调用 `notifyObservers(Object arg)` 时，会自动导致已注册到 `Observable`\
  \ 的 `Observer` 实例上调用 `update(Observable o, Object arg)`。另一方面，如果观察者的通知是通过应用程序调用 `Observable`\
  \ 对象的 `notifyObservers()` 完成的，这等同于在 `Observer` 实例上调用 `update(Observable o, null)`。上述列出的\
  \ `Observable` 类其他方法的行为从它们的名称中应该是显而易见的。\n\n带有镜像网站的大型网站是 `Observer` 模式可以实现功能的另一个良好示例。在这些关联的网站中，你有一个主站作为\
  \ `Observable`，它是信息最初发布的地方。所有镜像站所做的就是与主站保持同步。\n\n## 20.5 用哈利·波特故事来阐述观察者模式\n\n我们对\
  \ `Observer` 模式的演示基于食死徒如何与黑主交流，以及他如何召唤他们来到自己身边。读者可能已经知道，黑主在他最忠诚的追随者的左前臂上印了一个“黑记标记”。当黑主想要他的追随者传送到他身边时，他会用他的魔杖触碰自己的前臂，或者他附近任何一个追随者的前臂。食死徒也可以通过按自己的黑记标记来向伏地魔发出信号。从编程的角度来看，该标记充当了通信通道，而黑主触摸标记等同于他向食死徒发送了一条消息。\n\
  \n为了提醒读者记住黑记标记，这个标记看起来像一个口里吐出一条蛇的骷，它是由伏地魔烙在他最忠诚的追随者的左前臂内侧的。当黑主失去力量时，标记褪成了暗淡的灰色。但当他开始恢复力量时，标记开始变得越来越清晰、颜色越来越深。当伏地魔想要追随者传送到他身边时，该标记会让佩戴者感到灼热感。\n\
  \n为了基于上述叙述建立 `Observer` 模式的演示，我们必须将黑主设为 `Observable`，将食死徒设为 `Observer`，因为根据黑主的意愿，食死徒必须与他保持“同步”——假设他们对黑主是忠诚的。由于忠诚的表达可以解释为向\
  \ `Observable` 注册，因此 `Observable` 类必须允许 `Observer` 实例能够与其注册，因为只有注册的 `Observer` 才能接收来自\
  \ `Observable` 的消息。因此，我们将为 `Observable` 类赋予两个名称如 `registerWithObservable()` 和 `unRegisterWithObservable()`\
  \ 的方法。\n\n我们还必须处理 `Observable` 和 `Observer` 之间建立通信链路的问题。在魔法世界中，黑主无论食死徒在何处都知道如何向其发送消息，但在编程世界中这并不容易实现。在我们的演示中，新注册的\
  \ `Observer` 需要让 `Observable` 知道如何与其进行通信。因此，当我们构造 `Observer` 实例时，为它提供通信管道的两个端点，一个端点供黑主放入消息，另一个端点由\
  \ `Observer` 保留用于获取这些消息。\n\n这仍然留下了谁来实例化 `Observable` 和 `Observer` 的问题。我们可以为此目的构建出几种场景。最接近魔法世界的场景要求\
  \ `Observable` 在系统初始化时以 `DarkLord` 实例的形式实例化，并让其作为后台服务器进程持续运行。一个想要注册 `DarkLord` 的\
  \ `Observer`（在我们的案例中是 `DeathEater` 实例）将向服务器进程发送一条相应的消息。服务器进程将为每个这样的 `DeathEater`\
  \ 派出一个子客户端进程。在主服务器进程中，将存在一个持续运行的循环，通过所有当前子进程的客户端套接字将黑主的消息广播给 `DeathEater` 实例。这种方法为黑主和食死徒创建了独立的程序。这种实现的主要优点是，我们不需要担心谁来实例化\
  \ `DarkLord` 以及谁来实例化 `DeathEater` 实例，从意义上说，`DarkLord` 将变成机器上一个持续运行的服务器进程，而 `DeathEater`\
  \ 将——你可以说是——自我实例化的（`DeathEater` 实例将由执行 `DeathEater` 类的人实例化）。\n\n\n\n\n然而，为了保持代码库及其说明的紧凑，在本章后续部分所演示的对象实例化将不再基于上述描述的方法（尽管该方法有很多优点）。我们将该类型的实现留给读者在第\
  \ 20.12 节“玩转代码”中进行练习。在我们的演示中，对象的实例化将根据下一节提到的，通过为该目的定义一个单独的类来实现。\n\n## 20.6 模式演示的总体视图\n\
  \n如上一节所述，我们对 `Observer` 模式的演示基于黑主如何与他的追随者——食死伏徒保持联系。正如那里提到的，黑主使用“黑标记标记”（`Dark Mark`）作为一种信号机制，告诉他的追随者他需要他们来到身边。我们显然可以将“黑标记”视为黑主与食死伏徒之间的某种通信管道。将黑主向食死伏徒信号的方式与我们此处的演示进行类比，我们可以说，前臂标记处产生的灼热感就是食死伏徒在黑主想要召唤时从黑主处`接收`（receive）的`消息`（message）。\n\
  \n将黑主视为 `Observable`，将食死伏徒视为 `Observer`s，我们的演示展示了我们如何在 `Observable` 和 `Observer`\
  \ 类的多线程实现中使用线程间通信管道，使 `Observable` 能够立即将其意愿传输给 `Observer`。通过多线程，黑主将扫描所有向他注册过的食死伏徒，并使用与食死伏徒相关的管道流立即向他们发送他的召唤。图\
  \ 20.2\n\n**图 20.2**\n\n我们将为名为 `DarkLord` 的类的单一实例分配一个线程——它是我们演示中的 `Observable`。我们将为名为\
  \ `DeathEater` 的类的每个实例分配一个单独线程；该类是演示中 `Observer` 对象的类。通过让这些线程并发运行，将在 `DarkLord`\
  \ 和各种 `DeathEater` 类实例之间创建一个持续的实时交互。这种交互将由 `DarkLord` “表达”他的意愿组成，这些意愿将实时通信给每个向 `DarkLord`\
  \ 实例注册过的 `DeathEater` 实例。\n\n至于由来实例化 `DarkLord` 和 `DeathEater` 实例的问题，假设比黑主更大的力量决定了谁将成为或不成为食死伏徒。正因如此，我们的演示包含一个名为\
  \ `GodProcess` 的类。`GodProcess` 类将 `DarkLord` 实例化为 `Observable` 类型的实例，并让它在一个线程中持续运行。`GodProcess`\
  \ 类还以 `DeathEater` 实例的形式实例化 `Observer` 对象。每个 `DeathEater` 实例也在一个单独的线程中持续运行。当启动一个\
  \ `DeathEater` 实例时，它会获得一个用于 Java 线程间通信的管道流的两个端点。当 `DeathEater` 实例向 `DarkLord` 注册时，`DarkLord`\
  \ 获取管道流的一个端点，另一个端点由 `DeathEater` 实例持有。\n\n## 20.7 Observer 接口\n\n下面显示了 `Observer`\
  \ 接口。由于食死伏徒是我们演示中的观察者，此接口由我们在第 20.10 节中提供的 `DeathEater` 类实现。\n\n此接口的仅是声明 `outputStreamToBeUsedByObservable()`\
  \ 方法。正如其名称所示的，当 `Observable`（在我们的案例中为 `DarkLord` 类型的单一实例）想要一个 `Observer` 接收其消息时，`Observable`\
  \ 将在相应的 `Observer` 实例上调用此方法。此方法交付的 `DataOutputStream` 对象是 `PipedOutputStream` 对象的包装器，其工作是将旨在发送给\
  \ `Observer` 的消息放入线程间通信管道中。相应的 `DeathEater` 然后将从同一条管道的另一端接收消息。\n\n* * *\n\n```\n\
  import java.io.*;\n\npublic interface Observer extends Runnable {\n    DataOutputStream\
  \ outputStreamToBeUsedByObservable();\n}\n```\n\n* * *\n\n## 20.8 Observable 接口\n\
  \n`Observable` 接口显然必须声明供 `Observer` 用于向 `Observable` 对象进行注册和注销的功能。推测，在我们基于哈利波特的模式演示中，当一个\
  \ `Observer` 对象认为它对 `Observable` 忠诚时，它会向 `Observable` 注册。随后，它将收到来自 `Observable`\
  \ 的消息。另一方面，当 `Observer` 对象不再认为它可以继续对 `Observable` 忠诚时，它将调用后者的注销方法。随后，`Observable`\
  \ 将不再向该 `Observer` 发送更多消息。下面是此演示的 `Observable` 接口。它声明了两个方法：`registerWithObservable()`\
  \ 和 `unRegisterWithObservable()`。\n\n* * *\n\n```java\npublic interface Observable\
  \ {\n    void registerWithObservable();\n    void unRegisterWithObservable();\n\
  }\n```\n\n* * *\n\n## 20.9 DarkLord 类\n\n我们现在展示 `DarkLord` 类。除了实现 `Observable` 接口外，该类扩展了\
  \ `Thread` 类。扩展 `Thread` 的类（或实现 `Runnable` 接口的类）可以作为多线程类。放在此类类的 `run()` 方法中的代码将在新线程中执行。这对我们有效，因为我们希望\
  \ `DarkLord` 在 `DeathEater` 实例在各自线程中执行时持续运行。为了确保没有单一线程主导 CPU（即使是 `DarkLord` 线程），我们在\
  \ `run()` 方法代码的每个循环中让该线程睡眠几秒。在 `run()` 方法的 `while` 循环遍历的主要工作是调用 `notifyObservers()`\
  \ 方法，通知已注册的 `Observer` 实例 `DarkLord` 有关于它们的新消息。\n\n下面所示 `DarkLord` 类的设计基于第 6 章的单例模式。这是因为我们希望强制限制只能有一个黑主实例。这解释了为什么构造函数在类的私有区域。因此，创建\
  \ `DarkLord` 类实例的唯一方法是调用 `makeInstanceOfDarkLord()` 方法。\n\n实例化方法之后是 `registerWithObservable()`\
  \ 和 `unRegisterWithObservable()` 方法的实现。由于此类实现了 `Observable` 接口，它要求提供这两个方法的实现。第一个方法将\
  \ `Observer` 实例插入到 `DarkLord` 维护的 `observers` 列表中，第二个方法在当观察者不再希望接收来自 `DarkLord`\
  \ 的信息更新时，从同一个列表中移除参数 `Observer`。\n\n`observers` 列表中当前的 `DeathEater` 成员通过 `notifyObservers()`\
  \ 方法发送消息。注意此方法实现中的以下语句\n\n```java\nDataOutputStream out = observer.outputStreamToBeUsedByObservable();\n\
  ```\n\n\n\n如前所述，当一个 `Observer` 初被创建时，它会被提供两个用于线程间通信的管道端点。其中一个用于其他线程向运行 `Observer`\
  \ 代码的线程发送信息，另一个则供该线程用于接收发送给它的信息。上述语句允许唯一的 `DarkLord` 实例获取通信端点，通过该端点可以向观察者发送消息。\n\
  \n最后，读者会注意到我们把其中几个方法声明为 `synchronized`。执行同步方法的线程不会被线程调度算法从 CPU 上取下。众所周知，当不同的线程共享一个数据对象时，线程在交互共同对象过程中的相互冲突可能会损坏该数据对象。在我们的案例中，线程共享\
  \ `observers` 列表。\n\n```java\nimport java.util.*;\nimport java.io.*;\n\npublic class\
  \ DarkLord extends Thread implements Observable {\n\n\tprivate static ArrayList<Observer>\
  \ observers =\n\t\t\tnew ArrayList<Observer>();\n\tprivate static DarkLord voldemort;\n\
  \tprivate DataOutputStream out;\n\tprivate ArrayList<DataOutputStream> out_arr;\n\
  \tprivate String messageForDeathEaters =\n\t\t\t\"Bring me Harry Potter --- dead\
  \ or alive\";\n\tprivate static int messageID = 0;\n\n\tprivate DarkLord(){\n\t\t\
  super();\n\t}\n\tpublic static synchronized DarkLord makeInstanceOfDarkLord() {\n\
  \t\tif (voldemort == null) {\n\t\t\tvoldemort = new DarkLord();\n\t\t}\n\t\treturn\
  \ voldemort;\n\t}\n\tpublic synchronized void registerWithObservable( Observer observer\
  \ ) {\n\t\tobservers.add( observer );\n\t\tSystem.out.println( \" The loyal \" +\
  \ observer\n\t\t\t\t+ \" has registered with the Observable\");\n\t\tint howMany\
  \ = observers.size();\n\t\tSystem.out.println( \" Now the Dark Lord has \"\n\t\t\
  \t\t+ howMany + \" followers\\n\");\n\t}\n\tpublic synchronized void unRegisterWithObservable(Observer\
  \ observer) {\n\t\tobservers.remove( observer );\n\t\tSystem.out.println( \" The\
  \ disloyal \" + observer\n\t\t\t\t+ \" has unregistered with the Observable\");\n\
  \t\tint howMany = observers.size();\n\t\tSystem.out.println( \" Now dark lord has\
  \ \" + howMany\n\t\t\t\t+ \" followers\\n\");\n\t}\n\tprivate synchronized void\
  \ notifyObservers() {\n\t\tint this_mesg_id = messageID++;\n\t\tIterator<Observer>\
  \ it = observers.iterator();\n\t\twhile (it.hasNext()) {\n\t\t\tObserver observer\
  \ = it.next();\n\t\t\ttry {\n\t\t\t\tDataOutputStream out =\n\t\t\t\t\tobserver.outputStreamToBeUsedByObservable();\n\
  \t\t\t\tSystem.out.println(\" Dark Lord sending message \"\n\t\t\t\t\t+ this_mesg_id\
  \ + \" to Death Eater \" + observer);\n\t\t\t\tout.writeUTF( messageForDeathEaters\
  \ + \" <mesg_id: \"\n\t\t\t\t\t+ this_mesg_id + \">\");\n\t\t\t\tout.flush();\n\t\
  \t\t} catch( IOException e ) {\n\t\t\t\tSystem.out.println(\n\t\t\t\t\"Error at\
  \ sending of pipe: \" + e );\n\t\t\t}\n\t\t}\n\t}\n\tpublic void run() {\n\t\tint\
  \ i = 0;\n\t\twhile (true) {\n\t\t\tint howMany = observers.size();\n\t\t\tSystem.out.println(\
  \ \"\\n\\nRun \" + i++ + \" of the Observable \"\n\t\t\t\t+ \"with \" + howMany\
  \ + \" observers\");\n\t\t\tnotifyObservers();\n\t\t\ttry {\n\t\t\t\tThread.sleep(3000);\n\
  \t\t\t} catch(InterruptedException e) {}\n\t\t}\n\t}\n}\n```\n\n## 20.10 DeathEater\
  \ 类\n\n现在我们介绍 `DeathEater` 类。该类的实例是黑主的追随者。他们希望在 `DarkLord` 的消息可用时尽快听到消息，而这种情况发生在黑主用他的魔杖触碰自己左前臂或其某个追随者左前臂上的黑标记（Dark\
  \ Mark）。正如之前提到的，黑标记充当通信通道，触碰标记的行为等同于黑主向食死鬼们发送消息。\n\n与 `DarkLord` 类一样，`DeathEater`\
  \ 类也是多线程的，因为它继承了 `Thread`。记住，我们的目标是让唯一的 `DarkLord` 实例以及每个 `DeathEater` 实例都运行在独立的线程中。\n\
  \n关于该类 `run()` 方法中的代码（该代码在每个 `DeathEater` 实例的独立线程中执行），请注意变量 `startTime` 和 `currentTime`。前者被设置为\
  \ `DeathEater` 实例创建时的时间，后者则被设置为 `run()` 中执行以下语句时的时间：\n\n```java\nlong currentTime\
  \ = System.currentTimeMillis();\n```\n\n由于 `run()` 中的代码基本上是一个 `while` 循环，`currentTime`\
  \ 获取的值将是循环在某次迭代中的值。现在让我们考虑实例变量 `loyaltyDurationTimePeriod`。为了证明 `Observer`（实际上是\
  \ `DeathEater` 实例）只有在它对后者忠诚时才会收到来自黑主的消息，我们会定期关闭 `DeathEater` 对 `DarkLord` 的忠诚度。至于\
  \ `DeathEater` 实例保持忠诚多长时间，它是执行 `run()` 中代码的时间加上循环中每次运行结束时调用 `getMessageFromObservable()`\
  \ 函数的时间。正如读者所示，`getMessageFromObservable()` 函数调用的时间间隔等于 `loyaltyDurationTimePeriod`\
  \ 的值。\n\n关于 `loyaltyDurationTimePeriod` 的值，我们在初始时将其设置为 800 毫秒到 1300 毫秒之间的随机数。由于是随机数，每个\
  \ `DeathEater` 实例的 `loyaltyDurationTimePeriod` 都不同。这样做是为了确保所有 `DeathEater` 实例在对黑主的忠诚声明（或不忠诚声明）上不会同步。显然，即使我们允许这种同步情况发生，演示仍然可以进行，但从我们预期魔法世界运作的角度来看，这显然是不现实的。\n\
  \n关于 `getMessageFromObservable()` 方法中的代码，我们将 `loyaltyDurationTimePeriod` 时间间隔分为四部分，并在每隔一部分让\
  \ `DeathEater` 实例线程睡眠。这确保了演示中的其他线程能够获得公平 CPU 的机会。当 `DeathEater` 实例清醒时，它的主要工作是检查是否有来自黑主的消息。显然，如果有消息，`DeathEater`\
  \ 实例会检索它并显示在控制台上。读者会注意到 `getMessageFromObservable()` **不是**一个同步方法。因此，执行该方法的线程无法对其加锁以防止其他线程插入。我们并不在乎当给定线程从黑主处检索消息时另一个线程是否插入，因为我们可以确定，消息会在给定线程回到\
  \ CPU 后最终被检索到。\n\n现在让我们关注 `getMessageFromObservable()` 中的以下代码段：\n\n```java\nBufferedInputStream\
  \ buffin = new BufferedInputStream(in);\nif (buffin.available() > 0) {\n\tString\
  \ messageReceived = in.readUTF();\n\tSystem.out.println( \" \" + this\n\t\t+ \"\
  \ received message from Dark Lord: \" + messageReceived );\n}\n```\n\n\n\n其中对象 `in`\
  \ 是一个 `DataInputStream` 对象，它作为参数传递给 `BufferedInputStream` 构造函数，并且我们在上面调用了 `readUTF()`\
  \ 方法。我们需要从 `DataInputStream` 对象创建一个 `BufferedInputStream` 实例，其是为了解决由于后者提供的 IO 是阻塞类型的而带来的困难。也就是说，在\
  \ `DataInputStream` 对象上调用 `readUTF()` 等方法将一直阻塞，直到流中出现可用数据。因此，如果从 `DarkLord` 处没有消息可读取，通常调用\
  \ `readUTF()` 将会一直挂起，直到该消息出现。通过构建一个 `BufferedInputStream` 实例作为 `DataInputStream`\
  \ 对象的包装，你可以调用 `BufferedInputStream` 实例上的 `available()` 方法来检查 `DataInputStream` 对象是否包含了准备就绪可读取的字节。\n\
  \n```java\nimport java.io.*;\n\npublic class DeathEater extends Thread implements\
  \ Observer {\n    private DataInputStream in;\n    private DataOutputStream out_used_by_volde;\n\
  \    private Observable voldemort;\n    private boolean loyalty_to_dark_lord;\n\
  \    private boolean registered_with_observable;\n    private long startTime = System.currentTimeMillis();\n\
  \    private int loyaltyDurationTimePeriod = 2000 + (int) (Math.random()*500);\n\
  \    private String name;\n\n    public DeathEater( String name, Observable observable,\
  \ OutputStream ostr, InputStream istr ) {\n        this.name = name;\n        voldemort\
  \ = observable;\n        out_used_by_volde = new DataOutputStream( ostr );\n   \
  \     in = new DataInputStream( istr );\n    }\n\n    public DataOutputStream outputStreamToBeUsedByObservable()\
  \ {\n        return out_used_by_volde;\n    }\n\n    public String toString() {\n\
  \        return name;\n    }\n\n    public void run() {\n        int j = 0;\n  \
  \      while (true) {\n            System.out.println( \"\\n\" + this + \" starting\
  \ run \" + j++);\n            long currentTime = System.currentTimeMillis();\n \
  \           long diffTime = currentTime - startTime;\n            int which_interval\
  \ = (int) diffTime / loyaltyDurationTimePeriod;\n            if( which_interval\
  \ % 2 == 1) {\n                loyalty_to_dark_lord = false;\n                System.out.println(\
  \ \" \" + this + \" is no longer loyal to Dark Lord\");\n            } else {\n\
  \                loyalty_to_dark_lord = true;\n                System.out.println(\
  \ \" \" + this + \" declares loyalty to Dark Lord\");\n            }\n         \
  \   if (loyalty_to_dark_lord) {\n                if (!registered_with_observable)\
  \ {\n                    registered_with_observable = true;\n                  \
  \  voldemort.registerWithObservable( this );\n                }\n            } else\
  \ {\n                if (registered_with_observable) {\n                    registered_with_observable\
  \ = false;\n                    voldemort.unRegisterWithObservable( this );\n  \
  \              }\n            }\n            getMessageFromObservable(loyaltyDurationTimePeriod);\n\
  \        }\n    }\n\n    public void getMessageFromObservable( int howLong ) {\n\
  \        int quarter = howLong / 4;\n        for (int i=0;i<4;i++){\n          \
  \  if (i%2 == 0) {\n                if (registered_with_observable) {\n        \
  \            long curr = System.currentTimeMillis();\n                    while\
  \ (System.currentTimeMillis() < curr + quarter) {\n                        try {\n\
  \                            BufferedInputStream buffin = new BufferedInputStream(in);\n\
  \                            if (buffin.available() > 0) {\n                   \
  \             String messageReceived = in.readUTF();\n                         \
  \       System.out.println( \" \" + this + \" received message from \" + \"Dark\
  \ Lord: \" + messageReceived );\n                            }\n               \
  \         } catch( IOException e ) {\n                            System.out.println(\
  \ \"Error at receiving end of pipe: \" + e);\n                        }\n      \
  \              }\n                }\n            } else {\n                long\
  \ timeAtTheMoment = System.currentTimeMillis();\n                while ( (System.currentTimeMillis()\
  \ - timeAtTheMoment) < quarter ) {\n                    try {\n                \
  \        sleep(quarter);\n                    } catch( InterruptedException e){}\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n## 20.1 GodProcess\
  \ 类\n\n早在在第 20.5 节中，我们讨论了在观察模式演示中由谁来实例化 `DarkLord` 和 `DeathEater` 类的问题。如果我们选择以网络为中心的模式实现方式，其中\
  \ `DarkLord` 实例充当服务器而 `DeathEater` 实例作为服务器的客户端，那么对象的实例化将不值得任何特殊讨论。在那种实现中，`DarkLord`\
  \ 和 `DeathEater` 类将成为独立的程序，它们可以在同一台机器上或不同的计算机上运行。\n\n另一方面，我们的演示使用了一个更紧凑的基于多线程的程序来实现类之间所需的协作。这在实例构建上需要一种相当不同的方法。在我们多线程设计中，请注意我们本可以将所有的对象实例化代码放在例如\
  \ `DarkLord` 类的 `main()` 方法中。但由于这会产生一种 `DeathEater` 忠诚于他时拥有完全控制权的感觉，我们放弃了那种方法。相反，我们的演示使用了一个名为\
  \ `GodProcess` 的独立类，它负责对象实例化的工作。我们现在展示这个类。\n\n在下所示 `GodProcess` 实现中，请注意该类只有静态变量和方法。第一个变量是\
  \ `voldemort`，它是被允许创建的 `DarkLord` 类的实例。该类还维护了一个名为 `observers` 的列表，与 `voldemort`\
  \ 实例维护的列表有所不同。当一个 `DeathEater` 不再忠诚于 `DarkLord` 实例时，他的/她的名字会自动从 `voldemort` 维护的列表中移除。下面的列表是到为止由\
  \ `GodProcess` 创建的所有 `DeathEater` 实例。\n\n静态方法 `addNewObserver()` 被 `GodProcess`\
  \ 用于创建新的 `DeathEater` 实例。注意此方法如何创建线程间通信管道的两个端点，并将它们交给 `DeathEater` 实例妥善保存。\n\n由于为此创建的所有实例都是多线程对象，该类的\
  \ `main()` 所做的只需通过调用 `start()` 来启动线程。调用 `start()` 将线程的状态从“已出生”变为“可运行”。随后，系统的线程调度程序可以在系统可用的处理器上为线程调度时间。\n\
  \n## 20.12 运行代码\n\n从书籍网站下载此模式的类文件到单独目录。使用以下命令编译代码\n\n\n\n\n\n```\njavac *.java\n\
  ```\n\n通过以下命令执行 `GodProcess` 类：\n\n```\njava GodProcess\n```\n\n我们将展示在执行 `GodProcess`\
  \ 类时会看到的输出。下面显示的输出是通过让 `DarkLord` 类 `run()` 方法中的 `while` 循环的每次迭代都休眠 3000 毫秒，并且 `DeathEater`\
  \ 类 `run()` 方法中的每次循环持续大约 2200 毫秒得到的。\n\n为了理解下面显示的输出，请注意，只有当至少有一个追随者宣布对主人忠诚时，`DarkLord`\
  \ 才会向追随者发送消息。由于 `DeathEater` 实例大约每 2200 毫秒切换一次忠诚，结果在 `DarkLord` 循环的第一次迭代中没有忠诚的追随者。是的，我们在启动该循环时有两个忠诚的\
