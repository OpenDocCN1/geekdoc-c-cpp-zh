  \ 19;\n\tpublic final int TamperingWithRefereeBroom = 20;\n\n\tpublic final String[]\
  \ printViolation = new String[]{\"Blagging\",\n\t\t\t\t\"Blatching\", \"Blurting\"\
  , \"Bumphing\",\n\t\t\t\t\"Cobbing\", \"Flacking\", \"Haversacking\",\n\t\t\t\t\"\
  QuafflePocking\", \"Stooging\",\n\t\t\t\t\"PlayerLeavesBoundary\",\n\t\t\t\t\"PushPlayerOffTheBroom\"\
  , \"PissOffTheReferee\", \"HitPlayerWithClub\", \"BeaterHittingQuaffle\", \"ThrowQuaffleOutOfBounds\"\
