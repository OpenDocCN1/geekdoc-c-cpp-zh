  :\n\t\t\t\t+ answer + \"\\n\");\n\t\t\t\tanswerReceived = true;\n\t\t\t\tsleep(\
  \ 100 + 100 * (long) Math.random() );\n\t\t\t\t} catch(InterruptedException e){\n\
  \t\t\t\tSystem.out.println( \"InterruptedException: \" + e );\n\t\t\t\t} catch(\
  \ IOException e ) {\n\t\t\t\tSystem.out.println( \"Error: \" + e );\n\t\t\t\t}\n\
  \t\t\t}\n\t\t}\n\t}\n\n\t///////////////// DarkWizard 的其余代码 ////////////\n\tpublic\
