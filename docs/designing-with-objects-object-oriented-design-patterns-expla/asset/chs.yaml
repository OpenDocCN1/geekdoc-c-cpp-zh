  \ lastname );\n  }\n```\n\n\n\n\n\n```java\n    public boolean isAurorInGoodStanding()\n\
  \        throws UnauthorizedAccessException {\n        if (!this.getWizardryLevel().equals(\n\
  \                WizardTraits.WizardryLevel.Master)) {\n            System.out.println(\n\
  \                \"这位巫师没有资格捕获食形徒\");\n            return false;\n        }\n   \
