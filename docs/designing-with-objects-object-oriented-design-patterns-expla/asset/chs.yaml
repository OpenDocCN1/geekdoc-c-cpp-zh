        new CoreMessageDeliveryClass() ) );\n    m3.deliverMessage();\n    System.out.println();\n\
    }\n}\n```\n\n## 10.10 玩代码\n\n从书籍网站下载此模式的类文件到单独目录。使用以下命令编译代码：\n\n```bash\n javac\
