  n\";\n        hh = new HogwartsHappening(latestStoryline);\n        savedStates.put(\
  \ 4, hh.saveStateToMemento() );\n    }\n}\n```\n\n## 19.9 运行代码\n\n从书中的网站下载此模式的类文件到单独目录。使用以下命令编译代码：\n\
  \n```bash\njavac *.java\n```\n\n并通过以下命令执行 `Client` 类：\n\n```bash\njava Client\n\
