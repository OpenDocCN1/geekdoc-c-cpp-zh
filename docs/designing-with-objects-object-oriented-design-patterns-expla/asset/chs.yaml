  \n\n## 3.1 构建复杂对象\n\n我们认为一个对象是复杂的，如果它由多个部分组成，构建它涉及大量的组装步骤，并且在执行每个步骤之前需要满足预置条件。这些预置条件通常分为两类。\n\
  \n第一类与执行新步骤之前部分构建对象的状态有关。考虑建造房屋：在开始建造上层结构之前，必须先准备好基础。(1)\n\n第二类与单个步骤相关的条件可以被宽泛地称为后勤条件。这些预置条件与夹具、工具等有关。\n\
  \n\n\n鉴于构建复杂对象的这些不同方面，人们可以认为，通常情况下，想要构建此类对象的客户不应该直接与构建器（builders）交互。在这样的情况下，需要一个实体——我们称这个实体为\
  \ `director`（总监）——它能够很好地判断当前情况是否允许构建一个对象。根据当前能够满足的对象组装相关条件，总监可以发布指令，一次性构建整个对象，也可以分阶段地构建对象。\n\
  \n这些正是软件语境下构建器模式（Builder pattern）所处理的问题类型。在从复杂类创建实例时，我们可能需要处理类中构造函数调用的某些或所有步骤的特定限制。例如，可能会出现某一个步骤需要从数据库获取某些信息，而不同的实例变体需要使用不同的数据库。也可能某些数据库要求请求信息的一方提供特定的安全凭据以进行身份验证。此外，我们还可能需要处理这样的情况：实例构建的后续某些步骤取决于所用数据库具体提供了什么内容。鉴于这种复杂性，我们不应该允许客户端直接发出实例构建的调用，因为他们可能无法判断是否能满足与不同步骤相关的条件。因此，我们需要在客户端和构建器之间引入一个总监。总监将跟踪任何时刻可以满足的条件，并要求构建器相应进行——如有必要，则分阶段进行。\n\
  \n\n当对象构建涉及算法步骤时，构建器模式的意图是在高效的表示层次结构中组织对象构建细节，并将客户端与对象组装的复杂性隔离开来。\n\n在以下情况下应该使用该模式：\n\
  \n*   对象构建涉及其不同部分如何组合在一起的算法细节，且该细节独立于对象不同定制化时对部分的选择；\n*   你必须向类层次结构的客户端隐藏对象构建的算法构建细节；\n\
  *   可以将客户端从类层次结构中所需的所有对象设为对一种通用形式的不同定制，这样你就可以将通用形式的构建步骤放在基类中，而将定制步骤放在不同的子类中。\n\n\
  \n正如读者可能从本章的开头部分推断出的那样，该模式关于从一个具有以下方面复杂的类中构建实例及其变体：(1) 每个实例由几个部分组成，这些部分之间存在非平凡的关系；(2)\
  \ 客户端对通用实例的少数变体感兴趣；以及 (3) 实例的复杂性使得客户端无法预期知在任何给定时刻是否能满足实例构建的所有条件。最后一个原因要求我们通过在中间引入总监，将对象构建器与客户端隔离开来。总监的工作是判断当前条件是否允许至少分阶段地构建实例，如果不是一蹴呵成的话。\n\
  \n构建器模式告诉我们，实例构建的算法部分最好通过创建一个类层次结构来处理，该层次结构的根包含所有实例通用的基本构建知识，而其子类则为不同类型的实例提供定制。我们可以将根类中的代码（在本节的其余部分中我们将其称为基类）视为通用的实例创建代码。在图\
  \ 3.1 中，基类显示为抽象类 `Builder`。\n\n![image](img/c03f001.gif)\n\n`图 3.1`\n\n为了创建对象的不同变体，构建器模式利用了多态和方法重写。基类中的通用实例创建代码可能会调用同一类的辅助方法，以处理那些需要为不同类型实例定制的步骤。基类中的这些辅助方法可以在派生类中被重写以进行实例定制。对于构造对应某个派生类的实例，派生类对象的基类部分将根据基类定义中的通用算法进行构建，辅助方法将根据它们在派生类中的定义进行执行。(2)\n\
  \n关于总监的角色，该实体的职责是掌握条件是否存在，以便向具体的构建器发出实例构建的调用。总监的复杂实现可以允许在当前条件和可用资源指示的情况下，以分阶段的方式进行实例创建——假设构造函数的定义可以分解为一系列函数调用，其输出可以存储在持久性内存中。无论实例是如何创建的，总监的主要作用都是将构建器与客户端隔离开来。\n\
  \n构建器模式中值得强调的一点是，总监虽然了解各个具体构建器的整体需求，但并不知晓与实例构建相关的细微细节。这些知识只存在于基构建器类的具体子类中。尽管如此，总监的角色至关重要，因为只有总监知道何时调用特定的构建器来为客户端构建实例。\n\
  \n根抽象类 `Builder`、具体的 `Builder` 子类、总监类和客户端类之间的关系如图图 3.1 所示。\n## 3.4 现实应用中的构建器模式\n\
  \n涉及复杂对象实例化的应用程序——其复杂性导致你不希望让客户端面对这些性——可以从构建器模式中获益。\n\n我们讨论的是需要多步构建且步骤执行可能存在先验约束的对象。在此类应用程序中，构建器模式中的总监概念可以为客户端的实例构建创建一个更容易处理的接口。\n\
  \n\n\n\n为了一个更具体的例子，考虑一个用于在线客户画像分析的软件工具。画像分析工具首先通过收集客户浏览习惯信息来评估个人的生活方式偏好。随后，软件会对这些浏览习惯进行分析，以构建一个客户画像，该画像表达其对食物、服装、消费品等的偏好。从软件的角度来看，你可以将画像视为一个对象，该对象的构建通常需要大量的参数——实际数量取决于使用了多少个维度来刻画客户。虽然为已经使用用户名和密码登录的客户创建画像相对容易，但当公司试图为来自访问请求来源\
  \ IP 地址的任何人创建画像时，情况就并非如此。现在，必须以更加谨慎的态度来搜集感兴趣的参数。首要任务是确定特定 IP 地址的网浏览模式是否具有任何一致性。（如果该\
  \ IP 地址被几个人使用怎么办，例如图书馆里的公共电脑呢？）随后，画像分析工具将尝试确定另一端的用户是成年人还是儿童、是男性还是女性等。\n\n这里的关键点在于，通常情况下，客户画像分析工具需要关注感兴趣参数在收集和处理步骤中的**先序约束**。构建器模式（Builder\
  \ pattern）是这种对象构建的理想选择。构建器模式将使更容易将所有潜在客户放入少数几个类别中，每个类别对应于基础画像类的一个子类。\n\n\n我们对构建器模式的演示基于将药水作为构建器类层次结构要配制的对象。我们将特别关注以下三种药水的制作：宁神剂（Draught\
  \ of Peace Potion）、智力水（Wit Sharpening Potion）和情药（Love Potion）。我们的根抽象构建器类通常称为 `Builder`\
  \ 将命名为 `PotionMaker`。如图 3.2 所示，根类将扩展为三个具体的制药类，分别称为 `DraughtOfPeacePotionMaker`、`WitSharpeningPotionMaker`\
  \ 和 `LovePotionMaker`。这些具体类都知道如何准备各自药水所需的原料，更重要的是，它们关于制作不同药水的知识仅限于使用这些原料。\n\n![image](img/c03f002.gif)\n\
  \n[图 3.2]\n\n每个具体的制药类将从根接口 `PotionMaker` 继承两个抽象方法：`makePotion()` 和 `getResult()`，前者用于确保遵守原料混合顺序的任何约束，后者用于让任何访问此具体类的用户获取制好的药水。\n\
  \n宁神剂需要两种原料：月亮石（moonstones）和黑半葵（hellebore）。这种药水的困难之处在于，原料必须以正确的方式处理，药水才能发挥作用。药水从月亮石原料开始，必须将其磨成粉。粉末必须精确地逆时针搅拌三次。随后，必须让药水恰好煮七分钟。只有那时，才向药水中加入恰好两滴黑半葵糖浆。\n\
  \n相反，智力水需要三种原料：姜根（ginger roots）、甲虫（scarab beetles）和��adillo 胆（armadillo bile）。姜根必须切片，甲虫必须压碎，��adillo\
  \ 胆要量出恰好一杯，并按照列出的顺序添加原料。\n\n最后，情药需要四种原料：火蛇蛋（ashwinder eggs）、玫瑰刺（rose thorns）、薄荷（peppermint）和月亮石。火蛇蛋必须冷冻后使用，其他三种原料要磨成粉。原料必须按照此处列出的顺序添加。\n\
  \n我们对构建器模式的演示将涉及一个哈利·波特中不存在的实体——一个名为 `Director` 的实体，它也显示于图 3.2。当客户端需要药水时，它会将请求发送给\
  \ `Director`。`Director` 的工作是在要求具体的制药师提供客户所需的药水之前，确保药水原料都已就绪。在检查原料可用性后，`Director`\
  \ 实例调用相应的具体 `PotionMaker` 类实例的 `makePotion()` 方法来制作药水，然后在同一实例上调用 `getResult()` 方法为客户端检索药水。\n\
  \n\n图 3.3 所示的类图是我们构建器模式演示中所有类的顶层视图。除了图 3.2 所示的类外，我们现在还展示了三个辅助类：`Ingredient`（原料）、`Potion`（药水）和\
  \ `PotionMakingFeasibilityViolation`（药水制作可行性违反）。在这些中，`Ingredient` 和 `Potion` 类代表的内容直接由其名称暗示。\n\
  \n![image](img/c03f003.gif)\n\n[图 3.3]\n\n每个具体的制药类将从根接口 `PotionMaker` 继承两个抽象方法：`makePotion()`\
  \ 和 `getResult()`。辅助类 `PotionMakingFeasibilityViolation` 的角色特别有趣。我们希望每个具体的制药类只拥有如何制作自己药水的知识。此外，我们还要求每个制药类在添加原料时严格遵循配方。我们将使用\
  \ `PotionMakingFeasibilityViolation` 作为一个类，当制药师被要求创建超出其能力范围的药水，或者由于偶然等原因药水原料未严格按照配方组合时，该类的实例可以作为异常被抛出。\n\
  \n关于图 3.3 所示的整体设计，基础构建器类 `PotionMaker` 汇总了所有基类扩展类的共同知识。在我们的演示中，我们假设这些共同知识包括：(a)\
  \ 进入不同药水的所有原料的名称——仅是名称；(b) 每个具体的制药师必须实现一个名为 `makePotion()` 的方法；(c) 每个具体的制药师还必须为名为\
  \ `getResult()` 的方法提供实现以返回制制的药水。这种设计的重要方面——即关于如何准备和组合原料的所有知识都局限于 `PotionMaker` 基类的具体扩展中——通过让基类本身的所有\
  \ `prepareAndAdd` 方法都返回 `false` 来实现。这样，默认情况下，具体的制药师只会对其那些重写了基类 `prepareAndAdd` 方法的原料显示出其处理能力。对于其他的\
  \ `prepareAndAdd` 方法，制药师将明确表示无所不知。\n\n\n\n\n`Director`（如图 3.3 所示）预计能够知道每个具体的 `PotionMaker`\
  \ 类所需的成分。然而，根据构建器模式的定义，`Director` 并不知道具体类如何准备成分的细节，以及不同成分混合的顺序限制。为了测试 `Director`\
  \ 的作用，我们将在任何时刻随机化可用成分，并检查该类的行为。我们预计，在具体的 `PotionMaker` 所需的所有成分可用之前，`Director` 不会发出制作药剂的调用。\n\
  \n考虑到我们演示中涉及的类数量相当多，以下对主要类所扮演的角色的总结可能对读者有所帮助：\n\n-   该演示涉及一个根构建器类，在我们的案例中是 `PotionMaker`，它了解构建对象（在我们的案例中是制作药剂）时涉及的所有各个部分（在我们的案例中是成分）。我们在\
  \ `PotionMaker` 类中声明了所有成分名称。\n-   我们为根构建器类 `PotionMaker` 提供了如何准备每个部分（即每种成分）的默认实现。在我们的案例中，默认实现将简单地声明其无法准备某部分（在我们的案例中是无法准备某种成分）。\n\
  -   我们为抽象根构建器类提供了一个实例创建方法（在我们的案例中是名为 `makePotion()` 的制药方法），其在根类中的实现仅抛出异常。因此，通过从根\
  \ `PotionMaker` 类派生得到的具体药剂制作器*必须*对继承自根类的默认实现提供重写。\n-   我们将根构建器类扩展为客户端所需的不同类型的具体构建器类。在我们的案例中，这等于将抽象根\
  \ `PotionMaker` 类扩展为具体的药剂制作类。\n-   在每个具体药剂制作类的实现中，我们为药剂所需的那些成分准备方法提供了重写实现。在 `makePotion()`\
  \ 方法的重写中，我们确保所有约束条件（例如成分组合的顺序）都得到满足。\n-   我们定义了一个 `Director` 类，它完全将客户端与药剂制作类层次体系的内部细节隔离开来。`Director`\
  \ 了解具体药剂制作类的整体需求。只有当该药剂的所有成分都就绪时，它才会要求具体的药剂制作类制作药剂。\n\n\n`PotionMaker` 是我们构建器模式演示中的基础构建器类。\n\
  \n在下所示实现中，请注意此抽象类了解任何具体药剂制作器可能想要使用的任何药剂中将包含的所有成分。同样请注意，所有的 `prepareAndAdd` 方法都赋予了返回\
  \ `false` 的默认行为。这是为了确保，除非具体药剂制作器针对给定成分重写了特定的 `prepareAndAdd` 方法，否则它将能够诚实地声明其不晓（不知道）关于该成分的准备工作。最后，请注意\
  \ `makePotion()` 和 `getResult()` 的抽象方法声明。`makePotion()` 方法的重写实现（将在派自 `PotionMaker`\
  \ 的具体子类中显示）将确保从 `PotionMaker` 派生类中对成分组合顺序的任何约束以及对单个成分的任何中间处理步骤都得到满足。预计 `getResult()`\
  \ 的重写实现将返回通过调用 `makePotion()` 方法制作的药剂。\n\n* * *\n\n```\n```\n\n```\npublic abstract\
