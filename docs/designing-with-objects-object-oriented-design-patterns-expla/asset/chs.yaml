  ## Notes\n\n# 18 中介者\n\n## 18.1 中介者在协作解决问题中的作用\n\n作为一个协作解决问题的一个例子，让我们考虑一次法庭审判，被告的有罪或无罪由一群坐在一大桌子周围的智者男女委员会决定。为了完成这一形象，我们假设被告坐在桌子的一端，证人坐在另一端。智者们和女士们向证人和被告提问，且没有特定的顺序。如果这些对话对于确立被告的有罪或无罪是有帮助的，智者也被允许相互交谈。\n\
  \n这种解决问题的努力涉及多个个人同时与被告和证人交互。也就是说，委员会与坐在桌子两端的人之间的交互没有特定的顺序。这种交互可能涉及到由负责审判被告的人随心所欲的通信。\n\
  \n虽然按照上述方式运行的法庭审判可能会解决问题，但它没有你在现代法庭看到的效率，在现代法庭中，法庭礼程充当*中介者*，调节参与审判的个人之间的交互。可以客观地说，现代审判中的所有通信都是通过法庭本身进行的。审判期间的每一次信息交换都必须符合法庭规则，否则法官将不允许。\n\
  \n人们通常将中介者与争议解决联系在一起。在本章中，我们对那些中介者感兴趣。我们感兴趣的是那些为参与协作解决问题的代理之间的交互带来秩序的中介者。\n\n##\
  \ 18.2 意图与适用性\n\n中介者模式的意图是定义一个对象，该对象可以为软件系统中其他对象交互带来秩序。\n\n在以下情况下，你应该考虑使用这种模式：\n\
  \n- 需要结构化软件系统中对象之间的交互；\n- 对象间交互的复杂性导致，允许对象直接调用其他对象的方法可能会隐式地创建类之间的依赖关系，从而使得单独修改类变得更加困难；\n\
  - 可以精确地阐述对象之间每次交互必须满足的条件，并且将这些条件封装在中介者对象中是可行的；通过指定的中介者对象路由它们与其他对象的交互。\n\n## 18.3\
  \ 中介者模式引言\n\n中介者模式的主要目的是调节系统内各种对象之间的交互。这些对象*可以*直接调用对方的方法，但正如第 18.1 节中提到的现代审判一样，如果此类方法调用通过中介者引导，可能会更有效率。该模式指定了一个中介者类，其作用是跟踪涉及多个对象的系统的整体状态。根据状态，中介者类可以允许对象之间的某些交互而拒绝其他交互。正如读者所预期的，以这种方式运行的中介者类为复杂系统中对象之间的连接带来了秩序。我们还可以预计，当对象需要相互调用的频率越高时，通过这种中介带来的效率就越重要。\n\
  \n当系统中的对象进行交互时，很可能在在一个对象调用另一个对象的方法之前，需要满足某些先决条件。而且，当一个对象执行另一个对象的方法时，那可能会为随后的对象交互建立启用先决条件。与其让每个对象都自己去检查是否存在调用另一个对象的方法的正确条件，不如让中介者跟踪所有参与对象的系统整体状态。各种对象可以在调用任何方法之前向中介者进行检查，并向中介者告知它们所调用方法所产生的后果。\n\
  \n\n\n\n\n可以合理假设，强制所有对象间的交互都通过这种中介者（mediator）进行，将使由大量交互类组成的系统更具扩展性。它还将使此类系统更具可复性，因为如果由于某种原因发现\
  \ `Mediator` 类的特定实现不再适用，可以扩展该类并使用派生类来控制其他类之间的交互。\n\n中介者模式涉及一个通用的 `Mediator` 接口，该接口声明了各种方法，以及任何受中介的类之间的交互都必须遵守的约束。至于如何调节交互的具体细节，取决于\
  \ `Mediator` 接口的具体实现是如何编写的。为了进一步解释这一点，假设我们定义一个 `Mediator` 接口，通过其方法声明和约束来规定参与法庭审判的各种实体应该如何交互。这个\
  \ `Mediator` 接口可以由国家的不同法院以不同的方式实现。考虑到美国的法院，不同的法院在采纳证据和证明被告有罪方面使用不同的程序和标准。例如，在刑事案件中，证明被告有罪的责任在于控方，而在民事诉讼中则在于原告。此外，当控方试图确立某个事实时，必须做到“排除合理怀疑”。另一方面，在民事诉讼中，当原告试图确立某个事实时，必须达到“证据优势”。因此，虽然不同的法院可能使用相同的\
  \ `Mediator` 接口，但它们必须对接口中声明的方法使用不同的实现。图 18.1 中的概念类图应该能清晰地说明这一点——即 `Mediator` 仅仅是一个接口，人们将根据编排相关对象之间交互的需要来对其进行实现。\n\
  \n![image](img/c18f001.gif)\n\n图 18.1\n\n## 18.4 现实世界应用中的中介者模式\n\n中介者模式在保持旨在用于复杂图形用户界面的软件控制流组织方面起着重要作用。\n\
  \n在 GUI 编程中，通常，你在屏幕上看到的每个图形对象都是从某个类构造的实例。当用户通过（例如）点击选择一个对象时，这可能会启用一个或多个其他对象以供用户进一步交互。如果用户点击了报纸\
  \ GUI 中的“天气报告”按钮，可能会在面板中显示当前天气，并启用几个其他按钮来向用户传达天气报告的其他方面，例如跨不同时间段的预报、不同种类的天气图等。点击“天气报告”按钮还可能导致不同的面板和弹出窗口中显示广告。随后，当用户点击或以其他方式选择一个新启用的图形对象与\
  \ GUI 进行第二次交互时，可能会导致产生自己的一组启用和禁用的对象（除了它自己的一组弹出窗口和广告之外），以此此类推。\n\n如果每个接受用户直接输入的图形对象都必须跟踪所有需要通知的其他对象，以便这些对象能够启用或禁用自身，或者跟踪所有需要告知其应该显示内容的其他弹出窗口和面板，请想象一下你在\
  \ GUI 软件中将创建出多么错综复杂的链接关系。只要想一下，为了添加某些新功能而修改此类 GUI 的行为将有多么困难。中介者模式可以从软件中消除大部分这种复杂性。通过中介者模式，每个对象都将向指定的中介对象通信有关其状态变化的信息。确定哪些其他对象应该感知这些信息以及它们应该如何改变状态将是中介者的工作。\n\
  \n通过这种方式，中介者将成为关于 GUI 中不同对象如何相互交互的所有信息的中央存储库。这种集中化的方法便于用一组易于遵循的 UML 图进行表示。希望更改 GUI\
  \ 行为的开发者只需要咨询这些图表，以决定为了添加任何新功能需要更改中介的哪些方面——所有其他对象类都将保持不变。\n\n## 18.5 用哈利·波特的故事来阐明中介者模式\n\
  \n我们对中介者模式的演示基于哈利·波特在魔法部威森委员会（Wizengamot，魔法法律的最高法庭）的审判。该法庭位于魔法部内部。这次特定的审判的任务是裁定哈利·波特是否犯在麻瓜面前实施了未成年禁魔法的罪，当时他召唤了守护神来驱逐攻击他和他的表弟德德利的摄魂怪（dementors*）。这次审判的主检察官是魔法部长康内利斯·福奇（Cornelius\
  \ Fudge）。辩护方由邓布多带领，他同时也担任首席辩护证人。还有一位额外的辩护证人阿拉贝拉·菲格夫人（Mrs. Arabella Figg），她住在德德利家附近的小灵敏镇，哈利·波特在那里度过夏天。对哈利和德德利的攻击发生在一个夏天夜晚，当时男孩在回家的路上，距离德德利家不远的地方。\n\
  \n## 18.6 模式演示的高层视图\n\n图 18.2 中的类图是我们中介者模式演示的高层视图。\n\n![image](img/c18f002.gif)\n\
  \n图 18.2\n\n我们在这里演示的目标显然不是捕捉哈利·波特法庭审判的每一个方面。相反，我们的目标仅仅是展示中介者类如何协调法庭与证人之间的交互。在我们演示的简化法庭程序模型中，中介者的工作将是确保审判按顺序通过以下步骤：\n\
  \n1. 对哈利·波特的指控\n2. 支持指控的证据呈现\n3. 质问证人\n4. 控方质问辩方证人\n5. 辩方质问控方证人\n6. 根据被认为可靠的证人报告做出判决\n\
  \n\n\n\n\n状态转换的限制将通过将允许的转换存储在一个 `Map` 结构中的关联列表中来表示，该结构的元素是 `<key,value>` 键值对，形式为\
  \ `<TrialState, TrialState>`，其中对的第一个元素表示法庭审判的当前状态，第二个元素表示下一个允许的状态。此 `Map` 结构将作为静态变量\
  \ `transitions` 的值存储，该变量是在你在图中的 `Mediator` 接口（实际上是一个抽象类）中看到的。\n\n除了存储 `transitions`\
  \ Map 之外，`Mediator` 还会声明若干个可供 `Trial` 实例使用的方法。其中最重要的方法可能是 `getNextState()` 方法，它在当前状态完成时被调用，以确定审判的下一个状态应该是什么。该函数显而易见地遵循存储在\
  \ `transitions` Map 中的后续状态转换。启动状态转换需要识别当前状态的结束。至于如何做到，以及对于涉及证人证言的状态，如何建立证人证言的可信度（或缺乏可信度），则留给抽象\
  \ `Mediator` 类的具体实现。在我们这里的简单演示中，由于我们的重点仅仅在于如何编写调解器的程序，我们不会过度担心与建立证人提供的证言的可信度相关的细细节。\n\
  \n我们演示的目标是展示 `MinistryOfMagicTrialMediator` 如何实现 `Mediator` 抽象类中的方法，然后展示这些方法如何在\
  \ `HarryPotterTrial` 类中被使用，以对证人进行良好的审问。通过将图 18.2 的类图与更通用的图 18.1 图相比，我们这里的演示仅包含了\
  \ `Mediator` 抽象类的一个具体实现以及 `Trial` 接口的一个具体实现。\n\n## 18.7 抽象类 Mediator\n\n`Mediator`\
  \ 接口（实际上是一个抽象类）的定义从声明 `transitions` 开始，它是一个 `<TrialState, TrialState>` 对的关联列表，其中第一个元素是审判的当前状态，第二个元素是后续状态。接下来，接口声明了若干个便利方法，可以在\
  \ `Trial` 实例中使用以设置和检索涉及的更变量的值。最后，`Mediator` 接口声明了最重要的方法 `getNextState()`，该方法预计将由此抽象类的不同具体实现针对不同的法庭系统以不同的方式实现。\n\
  \n```java\n public abstract class Mediator implements TrialElements {\n\n  public\
  \ static java.util.Map<TrialState, TrialState> transitions =\n       new java.util.HashMap<TrialState,TrialState>();\n\
    \n  transitions.put( TrialState.ChargeBeingFiled,\n      TrialState.WitnessesBeingQuestioned\
  \ );\n  transitions.put( TrialState.WitnessesBeingQuestioned,\n      TrialState.WitnessBeingQuestionedByProsecution\
  \ );\n  transitions.put( TrialState.WitnessesBeingQuestioned,\n      TrialState.WitnessBeingQuestionedByDefense\
  \ );\n  transitions.put(\n      TrialState.WitnessBeingQuestionedByProsecution,\n\
        TrialState.WitnessBeingQuestionedByDefense );\n  transitions.put( TrialState.WitnessBeingQuestionedByDefense,\n\
        TrialState.WitnessBeingQuestionedByProsecution );\n  transitions.put(\n      TrialState.WitnessBeingQuestionedByProsecution,\n\
        TrialState.WitnessTestimoniesCompleted );\n  transitions.put( TrialState.WitnessBeingQuestionedByDefense,\n\
        TrialState.WitnessTestimoniesCompleted );\n  transitions.put( TrialState.WitnessTestimoniesCompleted,\n\
        TrialState.JudgmentBeingRendered );\n  transitions.put( TrialState.JudgmentBeingRendered,\n\
        TrialState.JudgmentBeingRendered ); // 注意：原文此处有重复或拼写错误逻辑\n // 等等，根据文本流进行修正\n\
  ```\n\n根据文本流的修正：\n\n```java\npublic abstract class Mediator implements TrialElements\
