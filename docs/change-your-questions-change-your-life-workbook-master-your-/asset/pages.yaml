- pgno: 102
  md: '# # The Only Person You Can Change Is You... and That''s What Makes You Powerful!


    Have you noticed that throughout this workbook we have only focused on your mindsets—not
    the other person''s? There''s an important reason for that.


    The only person you can change is you, and the only mindset you can master is
    your own.


    As tempted as you may be to try to Switch another person when you think they are
    in Judger Mindset, that''s not your work to do. Imagine how you would react if
    you were in the grip of a Judger Mindset reaction and someone asked you if you
    were in Judger. That would just push most of us deeper into the Judger Pit!


    The good news is, as you master your mindset, how you show up when other people
    are in Judger will change. As you practice Switching to Learner instead of reacting
    from Judger, you will create new possibilities and new futures that would never
    have been possible if you''d stayed in Judger.


    No one can change anyone else, however, we can contribute to the conditions that
    might make it easier for someone to change. We do that by being in Learner ourselves
    so they can join us there. Remaining committed to growing and changing through
    mastering your mindset is the essence of Learner Living.


    > > "Out beyond ideas of wrongdoing and rightdoing, there is a field. I''ll meet
    you there."

    > >

    > > Rumi'
