- pgno: 45
  md: '# # What Is the Relationship between Mindset and Questions?


    As you can see illustrated on the Choice Map, we ask ourselves distinctly different
    questions when we are on the Learner path in contrast with when we are on the
    Judger path. That points to how our mindsets are encoded in our questions.


    Turn back to the Choice Map and read out loud all the questions on the Judger
    path. As you read, ask yourself, “How do these Judger questions make me feel when
    I read them?” Note what you experience in the space provided below.


    *What did I experience when I read the Judger questions out loud? Take note of
    your thoughts, and also your breathing, feelings, and sensation in your body.*


    Next, read out loud all the questions on the Learner path, while asking yourself,
    “How do these Learner questions make me feel when I read them?” Note what you
    experience in the space provided below.


    *What did I experience when I read the Learner questions out loud? Take note of
    your thoughts, and also your breathing, feelings, and the sensation in your body.*


    Great work!


    The simple exercise of observing how you felt—both emotionally and physically—while
    reading Judger and Learner questions out loud is key to the foundation of mindset
    mastery: building awareness of the impact of each mindset.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # What Is Question Thinking?


    Question Thinking describes how we think with questions and, when utilized intentionally,
    is a method of purposeful and skillful question asking that improves the quality
    and results of the questions we ask ourselves and others.


    You may have noticed that the thought bubbles on the Choice Map are all filled
    with questions. That’s because we think with questions. The mindset we are in
    at any given moment determines the kinds of questions we think with. I remember
    what an “ah ha” it was for me to realize we think with questions!


    Let’s look at how Question Thinking operates by exploring how you decided to wear
    the clothes you have on right now.


    # # How Did You Decide What to Wear Today?


    Look at what you’re wearing right now. Which of the following things did you consider
    when you got dressed? Check all that apply.


    +   - [ ] **Weather:** How hot/cold will it be? Will it rain?

    +   - [ ] **Activities:** What will I be doing today? Who will I be seeing? Where
    will I be going?

    +   - [ ] **Comfort:** What will I be comfortable in for all my plans for the
    day?

    +   - [ ] **Appropriateness:** Will I be over/under-dressed? What are others likely
    wearing?

    +   - [ ] **Appearance:** How do I look in this outfit? Is it clean?

    +   - [ ] **Other Considerations:** Write down any additional questions you asked
    yourself.


    NOTICE that you are wearing the answers to your questions!'
  merge: -1
