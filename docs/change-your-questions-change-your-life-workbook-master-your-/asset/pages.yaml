- pgno: 14
  md: 'The hero of the fable is named Ben, and this workbook is designed for you to
    experience a successful change journey that parallels Ben''s. By learning Question
    Thinking, Ben becomes more capable and self-confident as he upgrades his skills
    as a leader with his team, and even creates a better relationship with his wife.
    Ben''s journey will serve as an example for you as you move through this workbook,
    and you will see how he would navigate the various exercises to help bring them
    to life for you.


    # Introducing Ben


    When we meet Ben in *Change Your Questions, Change Your Life: 12 Powerful Tools
    for Leadership, Coaching, and Results*, he is about to resign from his job. Ben
    had been hired by Alexa, the CEO of QTec and a friend and former boss, to lead
    a team and project that is now on the verge of failing. All his career Ben had
    been the “Answer Man,” known for his deep technical expertise and ability to solve
    tough problems. But now Ben is leading people, and he is failing at it.


    It seems nobody on the team listens to Ben and their meetings just end up as frustrating
    dead ends. His biggest problem is with Charles, who had applied for the leadership
    position that Ben now holds. Communicating with Charles is going from bad to worse.
    In fact, Ben thinks Charles is trying to sabotage him and feels plagued by his
    incessant questions.


    Just as dismaying, Ben’s troubles at work are spilling over into his relationship
    with his wife, Grace. Tension between them is mounting. Finally, Ben decides that
    his only option for averting disaster at work and at home is to resign from QTec—but
    his boss, Alexa, disagrees. She refuses to accept his resignation and instead
    sends him to Joseph, a Question Thinking coach, who teaches Ben the tools you
    will learn here.'
