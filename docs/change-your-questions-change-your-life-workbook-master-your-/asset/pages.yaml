- pgno: 90
  md: '# Somatic Practice: Hand on Heart


    Linda Graham, MFT. *Bouncing Back: Rewiring Your Brain for Maximum Resilience
    and Well-Being.*


    The “Hand on Heart” practice is a powerful, easy, and quick way to become calm
    and centered. It’s also a physical, embodied way to switch from Judger to Learner,
    which is why I call it a “Learner practice.” It works because it helps counteract
    the stress hormone cortisol by releasing the calming hormone oxytocin. This helps
    you develop a state of equanimity. I do this practice often. I even do it in meetings
    because it’s such a normal, everyday gesture that no one notices!


    Here’s how it works:


    +   1. Place your hand over your heart and feel the warmth of your own touch.
    You might notice the warmth spreading beyond your hand. You might also notice
    the feeling of your chest rising and falling as you inhale and exhale.

    +   2. Breathe slowly and deeply through your nose into your heart center.

    +   3. Bring to mind an experience of being with someone who loves you unconditionally
    and with whom you feel completely safe (pets count too!).

    +   4. Notice in your body any positive, calming feelings as you recall this experience.

    +   5. When your connection to these feelings is steady, continue your deep, slow
    breathing as you release the image and simply bathe in the calm for about 30 seconds.'
  merge: -1
  img_proc: true
