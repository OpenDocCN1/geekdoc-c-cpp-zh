- pgno: 54
  md: 'In this chapter, you will have the opportunity to examine your Judger Mindset
    reactions as they relate to your Mindset Challenge so you can learn from them.
    Increasing your awareness of Judger—both toward yourself and toward others—is
    the first step to mindset mastery. I call this a “Learner practice.” When we look
    at our Judger with curiosity, we are standing on the Learner path of the Choice
    Map and reflecting on what triggers us to go Judger and how we think, feel, and
    behave when we are on the Judger path.


    # Judger Mindset and making a judgment are not the same!


    +   - Judger Mindset always refers to an attitude of being critical and judgmental
    toward ourselves and others.

    +   - Sound judgment is made with attention to logic and facts rather than limited
    to only emotions, opinions, and biases. We need to be able to make sound judgments
    in both our personal and professional lives.


    If you’re like me and most of the people I have coached and trained over the years,
    you’ve experienced lots of “Judger hijacks” in your life. That’s when someone
    says or does something that triggers a Judger reaction, one that is out of proportion
    to what actually happened. Typically, some events in our past have set us up for
    this kind of reactiveness, which can really get in the way of our relationships,
    happiness, and results. Perhaps at some point in the past you have overreacted
    in the situation you are working on. Maybe that’s why you chose to work on this
    relationship and behavior.


    If you have experienced a “Judger hijack” take heart. We all have! Exploring your
    Judger history will help you understand why the thing this particular person says
    or does triggers a Judger reaction in you. That’s why it’s so useful to explore
    our own Judger histories, which is what you’ll get to do next.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # What Is My History with Judger?


    Every human being has a Judger Mindset. And every human has their own deeply personal
    list of things—people, behaviors, ideas, words, sounds, smells, etc.—that trigger
    a Judger reaction. In this exercise, you get to explore Judger throughout your
    life so you can begin to understand how your Judger works. It’s much easier to
    make friends with something when you understand it.


    # ### LEARNER REFLECTION


    What thoughts or feelings do I have about getting caught in a “Judger hijack”?
    What questions do I have about this idea? What implications might this have for
    me?


    Before it’s your turn, let’s hear from Ben about his Judger history.


    # ### Ben’s Mindset Challenge: Ben’s Judger History


    > *When is the first time I can remember encountering Judger Mindset? What had
    happened? Was I the person reacting from Judger or was it someone else?*


    The first memory I have of Judger Mindset was my father getting angry at my mother
    because he asked her a question and she didn’t know the answer. I was so young
    I don’t even remember the details of why he was mad, I just remember how loud
    he talked and how big he seemed. My mother’s face got red and she got really quiet.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '*When this happened, what did my Judger Mindset say to me about myself?*


    I remember I vowed to myself I would always know the answers—or at least never
    admit that I didn’t know. I realize that’s probably what set me on the road to
    being the “Answer Man.”


    *When this happened, what did my Judger Mindset say to me about other people and/or
    about life?*


    My Judger Mindset told me people only care about you when you have the answers
    they want and that not knowing is risky and unsafe and looks bad.


    *Now, as an adult, what situations, behaviors, words, or people tend to trigger
    my Judger reaction and what do I think, say, or do—or not say or do—when I “go
    Judger”?*


    I tend to get angry when either I or another person doesn’t know something or
    should know but doesn’t. It drives me crazy when people don’t use their turn signals
    or merge correctly because my Judger says they should know better.


    My Judger has me hide out when I don’t have the answers, or sometimes I want to
    throw my hands up and quit. I try to solve problems, and I get triggered when
    other people don’t. I go Judger on others, but as angry as I can get at Charles
    or my wife Grace, that is nothing compared to how angry I get at myself. I hate
    it when I don’t know how to solve a problem or find the answer.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'What emotions and body sensations do I typically associate with my experience
    of Judger (when I’m being Judger with myself and with others)?


    When I go Judger I get mad. I can be mean. I talk in a sharp tone of voice, or
    I interrupt people and cut them off. My Judger is not at all subtle! My Judger
    is loud and, I am sad to say, proud.


    The other day when I felt myself go Judger on Charles, I could feel my fingers
    curling into fists. I felt tense and like I wanted to punch him.


    What Judger beliefs have I developed about myself and what does Judger say to
    me about myself?


    My Judger believes I am worthless unless I have the answers and can solve problems.
    My Judger thinks it’s my answers that make me worthy of love and that if I don’t
    have the answers, Grace won’t respect me or want to be with me anymore.


    What Judger beliefs do I now hold about other people (or “types” of people) and
    life in general? How do they affect and limit my life?


    I have the Judger belief that people who ask a lot of questions aren’t smart and
    aren’t contributing to the solution. While having answers has served me in the
    past, I can see that thinking it’s not smart to ask questions is getting in the
    way of being a good leader and husband. Ugh.


    Reflecting on what I’ve just written, what observations do I have about Judger
    and the impact it has had on me? What beliefs and patterns do I associate with
    Judger Mindset?'
