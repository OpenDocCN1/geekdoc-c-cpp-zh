- pgno: 69
  md: '# CHAPTER FOUR


    # What if You Could Choose

    to Switch Mindsets?


    # *Spoiler Alert: You Already Can!*


    # What Is Switching?


    The ability to Switch is the basis for change and possibility. Switching is an
    ability all humans naturally possess, and we have all Switched many times in our
    lives, likely without even realizing it. I call that unconscious Switching. To
    master our mindsets, we must develop the skill of Switching intentionally.


    > > Switching is our innate human ability to change our mindset, and it is a skill
    that can be intentionally developed.


    Intentional Switching requires us to first notice what mindset we are in, and
    then make a conscious choice. We can either choose to remain in our current mindset
    or choose to ask a new question from a different mindset. Developing the skill
    of intentional Switching requires practice—we need to catch ourselves in Judger
    and make the conscious decision to Switch to Learner. We all go from Judger to
    Learner on occasion, but that is seldom intentional!


    We will talk about how to build the skill of intentional Switching shortly. Before
    we do that, it’s helpful to simply notice how naturally we move between Learner
    and Judger Mindsets.'
  merge: -1
  img_proc: true
