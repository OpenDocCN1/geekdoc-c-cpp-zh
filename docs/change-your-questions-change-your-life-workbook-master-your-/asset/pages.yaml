- pgno: 10
  md: '+   - Discover how changing your questions can change your life

    +   - Learn how to use Question Thinking to master your mindset

    +   - Increase your ability to remain calm, present, and strategic

    +   - Enhance your ability to communicate successfully—even when you''re frustrated
    or under pressure

    +   - Become more effective at creatively collaborating and solving problems

    +   - Apply what you learn to a personal or professional situation that you want
    to change—and see some progress!


    # ## How Did I Discover Question Thinking?


    Many years ago when I was in graduate school, I was struggling to complete my
    dissertation. I was plagued with frustration and self-doubt. I felt like I was
    spinning my wheels in the mud and just couldn''t get out. One day, out of desperation,
    I decided to just watch how I was thinking about my work, hoping that might provide
    clues about getting out of the awful rut I was in. Little did I know that what
    I discovered would lead to a major personal breakthrough, a whole body of work,
    and eventually to this workbook.


    As I began observing myself, watching how I was thinking and not just what I was
    thinking, I realized that all the negativity that made me so unhappy was in the
    form of questions I was asking myself. They were questions such as: “What’s wrong
    with me? Why can’t I ever get anything right? What makes me think I have anything
    to offer? How come everybody else is so much smarter and more successful than
    I am? Why did my advisor wait so long to share this feedback? Didn’t he know it
    would have been helpful to know this sooner?” Anyone who’s spent much time trying
    to answer questions like these will recognize how stuck and frustrating that can
    feel.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '*What deflating questions like these do you ask yourself?*


    On that day when I sat observing my own thoughts, something very different occurred.
    I got curious about the I questions I was asking myself and the impact they were
    having on me and my dissertation work. I noticed that some of those thinking questions
    pushed me deeper in the mud and another kind of thinking question lifted me up
    and even helped me envision new possibilities. Some examples of the second kind
    of questions were: “What excites me about this topic? What will energize and inspire
    me? What resources do I have that can help me make this work? What have I learned
    from past struggles that I can use to be successful in this one?”


    *What expansive questions like these do you ask yourself?*


    What was different about those two sets of questions? I realized that the questions
    came from two distinct mindsets. Through careful observation I noted that the
    more uplifting and helpful questions had a positive impact on my experience and
    results. I began to practice this process of observing my thinking. Any time I
    noticed I was asking myself the deflating-type of question or otherwise feeling
    stuck, I intentionally asked myself an uplifting-type question. Over time, I became
    quite'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'skilled at observing myself. I found that thinking with the second set of questions
    activated more energy, hopefulness, and creativity in me. I used this discovery
    to redirect my own thinking, which enabled me to finish my dissertation—and I
    even received accolades for it!


    Today I call the mindset that generates the uplifting questions “Learner Mindset”
    and the mindset that generates constricting questions “Judger Mindset.” What’s
    more, I realized that every human has both mindsets and always will, which means
    that both mindsets are normal for all of us. This workbook will help you learn
    to identify your own Learner Mindset and Judger Mindset and increase your ability
    to make intentional choices about how you respond to people and circumstances
    in your life. The method I developed for changing questions and mindsets I now
    call Question Thinking, or QT.


    I first presented these ideas about Question Thinking for the general public in
    a book now entitled *Change Your Questions, Change Your Life: 12 Powerful Tools
    for Leadership, Coaching, and Results*. That book is a business fable, which became
    an international bestseller with hundreds of thousands of readers. That success
    has given me the opportunity to hear feedback from readers, workshop attendees,
    individuals I’ve coached, and organizational clients about the life-changing difference
    that QT Tools have made for them. Their feedback inspired me to create this workbook
    so that even more people could experience those same benefits, even if they haven’t
    read the fable. It is my deepest desire that you’ll experience the same wonderful
    results by engaging with this workbook!


    # New Futures Model


    The reason this workbook and the original fable book are called *Change Your Questions,
    Change Your Life* is that when we change the questions we use to think with situations,
    people, or ourselves, we change the relationships we have and the results we get,
    which in turn changes our lives (see Figure 1).'
