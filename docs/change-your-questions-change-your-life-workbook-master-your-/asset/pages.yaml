- pgno: 24
  md: 'To get the most out of this workbook, you want to practice mastering your mindset
    in relationship to an actual person in your life. That means you should not choose
    a group of people—like drivers who don’t use their turn signals on Ben’s list.


    While we absolutely do have relationships with ourselves, and these skills can
    be applied to how you interact with yourself, the exercises in this workbook are
    designed for a situation involving another person. You’ll learn to master your
    mindset more effectively when you are getting the benefit of feedback from the
    other person. When I say “feedback from the other person” I do not mean that you
    will need to ask that person to give you input. But what will almost certainly
    happen is that your interactions with each other will change as you practice and
    apply Question Thinking, and that will provide useful feedback on the inner work
    you are doing.


    # LEARNER REFLECTION


    What thoughts or feelings do I have about this Mindset Challenge? What questions
    do I have about doing this? What implications might this have for me?


    For his Mindset Challenge, Ben chooses to focus on changing his reaction to Charles,
    the colleague he thinks asks too many questions. Also, while he doesn’t explicitly
    work on his relationship with Grace, Ben does see improvements in his marriage.
    The beauty of learning to master our mindsets with Question Thinking is that as
    we get skilled at using the tools in one part of our lives, the other parts usually
    benefit, too.


    With all this coaching in mind, return to your list and choose the one person
    you’d like to focus on and the behavior that person engages in that you react
    to negatively. This will be your Mindset Challenge and the primary focus for the
    exercises in this workbook.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# # Why Do You Care about Changing?


    Remember how I said to choose a person and situation you care enough about to
    keep you motivated when the exercises feel hard? Well now is your opportunity
    to connect with why changing your reaction to this person and their behavior matters
    to you.


    Before you write down your answers, let’s look at what Ben would say about why
    he wants to change his reaction to Charles.


    # ## Ben’s Mindset Challenge:

    ### Why Ben Cares about Changing


    > *Who is this person to me? Why does this relationship matter?*


    Charles is my direct report. He was in line to get the job I have leading the
    team. I work with him every day and he is an important member of this project
    team. If I don’t improve my working relationship with him, our project will almost
    certainly fail.


    > *What do they keep doing that I find annoying? (Give yourself permission to
    complain and be specific!)*


    Charles asks so many questions. In meetings that’s all he does. He challenges
    everything I say with questions, questions, and more questions. Sometimes I think
    he wants to sabotage me with all his questions.


    > *When they behave in this way, how do I react? What do I think, feel, say, and
    do? (Consider faces you make, how you breathe, your tone of voice, whether you
    get upset or shut down, etc. Be specific about your reactions; awareness is key.)*'
  merge: -1
  img_proc: true
