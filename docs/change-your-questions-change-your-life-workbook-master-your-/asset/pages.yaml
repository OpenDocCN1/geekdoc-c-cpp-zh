- pgno: 33
  md: '# # What Are Learner Mindset and Judger Mindset?


    Congratulations! You just observed your own mindsets. By answering these questions,
    you have experienced what it is like to notice yourself in one of the two mindsets
    that all humans possess: Learner and Judger. Let’s look briefly at each mindset.


    > > **Learner Mindset** is characterized by curiosity, flexibility, open-mindedness,
    and appreciation—all encoded in a set of beliefs, assumptions, expectations, and
    possibilities we hold about ourselves, others, and the world. *Everyone* has a
    Learner Mindset.


    > > **Judger Mindset** is characterized by the desire to be right, in control,
    safe, and certain. It stems in part, from our hardwiring for survival. Judger
    mindset is frequently critical and judgmental of both self and others—all encoded
    in a set of beliefs, assumptions, expectations, and possibilities we hold about
    ourselves, others, and the world. *Everyone* has a Judger mindset.


    Judger Mindset produces the constricting set of questions I was asking myself
    when I was struggling to write my dissertation; Learner Mindset produces the more
    expansive, energizing questions I taught myself to ask whenever I noticed a Judger
    Mindset question.


    Both mindsets can be directed inward toward ourselves, like I was doing about
    my dissertation, or outward toward other people and circumstances in the world.
    Ben exemplified external-facing Judger when encountering drivers who don’t use
    their turn signals. (Confession: I have Judger thoughts and sometimes make Judger
    comments toward people who park on the line in parking lots.)'
  merge: -1
  img_proc: true
