  md: '**Berrett-Koehler** is an independent publisher dedicated to an ambitious mission:
    *Connecting people and ideas to create a world that works for all.*


    Our publications span many formats, including print, digital, audio, and video.
    We also offer online resources, training, and gatherings. And we will continue
    expanding our products and services to advance our mission.


    We believe that the solutions to the world’s problems will come from all of us,
    working at all levels: in our society, in our organizations, and in our own lives.
    Our publications and resources offer pathways to creating a more just, equitable,
    and sustainable society. They help people make their organizations more humane,
    democratic, diverse, and effective (and we don’t think there’s any contradiction
    there). And they guide people in creating positive change in their own lives and
    aligning their personal practices with their aspirations for a better world.


    And we strive to practice what we preach through what we call “The BK Way.” At
    the core of this approach is *stewardship*, a deep sense of responsibility to
    administer the company for the benefit of all of our stakeholder groups, including
    authors, customers, employees, investors, service providers, sales partners, and
    the communities and environment around us. Everything we do is built around stewardship
    and our other core values of *quality, partnership, inclusion,* and *sustainability.*


    This is why Berrett-Koehler is the first book publishing company to be both a
    B Corporation (a rigorous certification) and a benefit corporation (a for-profit
    legal status), which together require us to adhere to the highest standards for
    corporate, social, and environmental performance. And it is why we have instituted
    many pioneering practices (which you can learn about at www.bkconnection.com),
    including the Berrett-Koehler Constitution, the Bill of Rights and Responsibilities
    for BK Authors, and our unique Author Days.


    We are grateful to our readers, authors, and other friends who are supporting
    our mission. We ask you to share with us examples of how BK publications and resources
    are making a difference in your lives, organizations, and communities at www.bkconnection.com/impact.'
