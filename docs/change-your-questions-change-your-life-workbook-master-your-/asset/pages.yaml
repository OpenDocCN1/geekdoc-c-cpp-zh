- pgno: 79
  md: '# D: What will you **DECIDE** to do?


    The last part of Switching is deciding whether to stay on the Judger Mindset path
    or intentionally step onto the Learner Mindset path and decide what to say or
    do next.


    **Reminder!** In the future, you will be triggered and react from Judger even
    after you’ve become skilled at mastering your mindset and Switching! I’ve been
    working to master my mindset for many years, and I still react from Judger sometimes.
    The good news is, I go there less frequently and it’s less intense and now I can
    usually laugh about it.


    In this exercise you are only reflecting on the Judger trigger you chose to work
    on, which is not the same as experiencing the Judger trigger in real time. Taking
    the time here to ask yourself the following questions will help you decide to
    Switch when you are triggered in the future. This practice will support you in
