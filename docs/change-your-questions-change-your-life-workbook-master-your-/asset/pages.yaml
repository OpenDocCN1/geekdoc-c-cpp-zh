  md: '# Switching Strategy #1:

    The ABCD Choice Process for Switching


    ABCD is a simple way to remember to Switch if you discover you’ve landed in Judger
    and don’t want to stay there. Each letter specifies questions to ask yourself.
    Often building the habit of saying ABCD to yourself is all you’ll need to Switch
    (Figure 6). I’ve even worked with teams who reminded each other about this all
    the time—from a Learner Mindset, of course!


