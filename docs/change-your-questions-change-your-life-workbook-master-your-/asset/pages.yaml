    # ## Q-Prep a Conversation


    Now that you see the value Learner Mindset creates, it’s time to plan how to remain
    in Learner in the face of a likely Judger Mindset trigger. Specifically, think
    about the next conversation you might have with the person from your Mindset Challenge.
    Chances are this conversation will offer opportunities for your Judger Mindset
    to be triggered again.


    Good.


    Most conversations with others offer bounteous opportunities to practice Switching!


    Why? Because we come to conversations already making assumptions and interpreting
    information in our own unique way—and so does the other person. Since Judger listens
    for disagreement, conversations can easily trigger Judger Mindset.


    Think about your situation as you answer the following questions. These questions
    make up the Question Thinking protocol that I call Q-Prep.


    **Q-Prep** is a protocol for preparing for successful conversations and meetings
    using prompts for thinking through goals, assumptions, and questions to ask oneself
    and others.'
