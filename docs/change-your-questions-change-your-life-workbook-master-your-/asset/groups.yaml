    \n### 我如何发现问题思考法？\n\n很多年前，我在研究生院时，正努力完成学位论文。我备受挫败感和自我怀疑的折磨。我感觉自己像在泥里空转车轮，就是无法脱身。有一天，出于绝望，我决定只是观察自己是如何思考工作的，希望这能提供一些线索，帮我摆脱所处的可怕困境。我几乎不知道，我的发现会带来一次重大的个人突破、一整套工作体系，并最终促成本练习手册。\n\
    \n当我开始观察自己，观察我如何思考而不只是思考什么时，我意识到，所有让我如此不快乐的负面情绪，都以我问自己的问题的形式出现。那些问题诸如：“我怎么了？为什么我从来做不对任何事？我凭什么认为自己有什么可提供的？为什么其他人都比我聪明、成功得多？我的导师为什么等了这么久才分享这个反馈？他难道不知道早点知道会更有帮助吗？”任何花很多时间试图回答这类问题的人，都会明白那会让人感到多么卡住和沮丧。\n\
    \n*你会问自己哪些像这样令人泄气的问题？*\n\n那天，当我坐下来观察自己的念头时，发生了非常不同的事。我对自己正在问的问题以及它们对我本人和学位论文工作的影响产生了好奇。我注意到，有些思考性问题把我往泥里推得更深，而另一种思考性问题则把我托举起来，甚至帮助我设想新的可能性。第二类问题的一些例子是：“这个主题哪里让我兴奋？什么会给我能量和灵感？我有哪些资源可以帮助我完成这项工作？我从过去的挣扎中学到了什么，可以用来在这次中取得成功？”\n\
    \n*你会问自己哪些像这样拓展思维的问题？*\n\n这两组问题有什么不同？我意识到，这些问题来自两种截然不同的心态。通过仔细的观察，我注意到，那些更令人振奋、更有帮助的问题，对我的体验和结果产生了积极影响。我开始练习这种观察自己思维的过程。每当我注意到自己在问令人泄气类的问题，或以其他方式感到卡住时，我就有意识地问自己一个令人振奋类的问题。随着时间推移，我变得相当擅长观察自己。我发现，用第二组问题来思考，会激发我更多的能量、希望和创造力。我利用这一发现来重新引导自己的思维，这让我完成了学位论文——我甚至因此获得了赞誉！\n\
    \n如今，我把产生振奋性问题的心态称为“学习者心态”，把产生限制性问题的心态称为“评判者心态”。更重要的是，我意识到每个人都有这两种心态，而且永远都会有，这意味着这两种心态对我们所有人来说都是正常的。本练习手册将帮助你学会识别自己的学习者心态和评判者心态，并增强你有意识地选择如何回应生活中的人和情境的能力。我开发的用于改变问题和心态的方法，现在称为问题思考法，简称\
    \ QT。\n\n我最初通过一本现在名为*改变你的问题，改变你的人生：领导力、教练与成果的12个强大工具*的书，向公众呈现了这些关于问题思考法的理念。那本书是一部商业寓言，后来成为国际畅销书，拥有数十万读者。这一成功让我有机会听到读者、工作坊参与者、我辅导过的个人以及组织客户的反馈，了解\
    \ QT 工具为他们带来的改变人生的差异。他们的反馈激励我创作了本练习手册，以便更多人能体验同样的益处，即使他们尚未读过那本寓言。我深切希望你能通过投入本练习手册，体验到同样美妙的结果！\n\
    \n### 新未来模型\n\n本练习手册和原版寓言书之所以名为*改变你的问题，改变你的人生*，是因为当我们改变用来思考情境、他人或自己的问题时，我们就会改变所拥有的关系和所获得的结果，而这反过来又改变了我们的人生（见图1）。\n\
    \n"
