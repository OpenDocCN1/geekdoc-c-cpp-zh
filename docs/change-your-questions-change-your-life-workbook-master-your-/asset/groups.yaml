    ## About Marilee Adams


    ![](img/061f1b5492e98ee8a01f818779461e15_121_0.png)


    Dr. Marilee Adams is an award-winning author and pioneer in the fields of inquiry-based
    coaching, leadership, change, and organizational effectiveness. She is the founder
    and CEO of Inquiry Institute and the originator of the Question Thinking Approach.
    She is also a thought leader, consultant, executive coach, and keynote speaker.
    Marilee has been an adjunct professor at American University’s Key Executive Leadership
    Program in the School of Public Affairs and is an affiliate instructor for Weatherhead
    Executive Education at Case Western Reserve University. Marilee is a faculty member
    at the Institute for Life Coach Training and Expedition Coaching and is an ACC
    with the International Coaching Federation. She is also a Fellow at the Institute
    for Social Innovation at Fielding Graduate University.


    Marilee is the author of the internationally bestselling book *Change Your Questions,
    Change Your Life*, which is a #1 Amazon Bestseller in Business and Organizational
    Learning. She also wrote *Teaching that Changes Lives*, which brought Question
    Thinking and Marilee’s love of inquiry into the world of education and won a Gold
    Medal IPPY Publishers Award. Marilee’s first book, *The Art of the Question: A
    Guide to Short-Term Question-Centered Therapy*, was lauded as a “seminal and breakthrough
    contribution to the field of psychotherapy.” Marilee has published articles on
    the expert use of questions in coaching, business, relationships, and organizational
    transformation.


    Question Thinking is known for transforming the “spirit of inquiry” into practical
    and powerful questioning and thinking skills and tools that make a difference
    throughout the world. Marilee’s work is considered the gold standard for excellence
    in inquiry in the coaching profession and is widely used for leadership and organizational
    development.

