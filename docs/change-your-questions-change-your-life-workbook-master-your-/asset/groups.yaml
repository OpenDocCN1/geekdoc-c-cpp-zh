    \n查看你列出的假设，在评判者心态假设旁标“J”，在学习者心态假设旁标“L”。\n\n*我能从自己所做的假设中学到什么？这如何帮助我以不同的方式看待自己、对方、他们的行为和/或情境？*\n\
    \n______________________________\n______________________________\n______________________________\n\
    ______________________________\n______________________________\n\n*我的评判者心态向我展示了我在这段关系中在乎什么？*\n\
    \n干得好！\n\n仔细审视我们的评判者心态需要勇气，也是掌握心态的重要一步。一旦你开始从评判者心态中学习，你就能把它变成顾问——甚至变成朋友！\n\n深呼吸，继续前进！\n\
    \n问问自己……\n\n*当我用“评判者的耳朵”倾听对方时，这会如何影响我们的关系以及我们应该共同创造的结果？*\n\n*基于我的假设，我似乎对这个人的看法是什么？（考虑你给他们贴过的任何标签，即使是负面的。）*\n\
