  - '[PAGE 110]


    # # My Personal Vision for Learner Living


    This workbook has led you through a Learner Living change journey. I hope you
    have enjoyed learning how to make friends with Judger and how to Switch from Judger
    Mindset to Learner Mindset. If you’ve made even one small change, you can make
    many more until Learner Living is your new normal.


    Now it’s time to expand on what Learner Living could make wonderful and possible
    in your entire life. In the space below, use your imagination to create a vision
    of Learner Living as your new normal. What would your relationships at work and
    home be like? What could your relationship with yourself become? How would being
    a resilient Learner affect your results and experiences in your life in general?
    How much more ease, calm, connection, fun, and even love could you enjoy?


    What additional possibilities do you see for yourself? Give yourself wild permission
    to envision what your life and your relationships could look and feel like when
    they are rooted in Learner Living.'
  - '[PAGE 111]


    # # My Learner Living Pledge


    Now that you’ve completed your Mindset Challenge and made it to the end of this
    change journey, I invite you to commit yourself to your own vision of Learner
    Living. This inevitably includes falling into Judger from time to time. When that
    happens, you now know to kindly remind yourself that you are human and look for
    what you can learn from Judger and have confidence in your ability to Switch!


    I, ________________________, am committed to Learner Living.


    I thank my Judger for [list whatever your Judger has taught you]


    ____________________________________________

    ____________________________________________

    ____________________________________________

    ____________________________________________

    ____________________________________________

    ____________________________________________

    ____________________________________________


    Without you I would not be the Learner I am today.


    From this day forward, I will use the awareness and tools of mindset mastery and
    Question Thinking to keep building my Learner Living skills. This is how I can
    keep showing up as Learner for my colleagues, family, friends, community, and
    myself. In this way, I can contribute to creating a Learner world.


    Signed ________________________________  Date __________


    *Here’s a suggestion: mark your calendar to come back to this workbook to reinforce
    and celebrate your continuing progress.*'
  - '[PAGE 112]


    # Congratulations!


    We have finally arrived at the end of this journey together. I’m so appreciative
    of you for the time, effort, and commitment that this achievement has called for.
    I’ve been doing this work with myself daily for about 30 years now. I certainly
    wouldn’t have the wonderful life I have today (including its ups and downs!) without
    living as Learner and accepting Judger over and over and over again.


    I’ve also had the privilege of doing this work directly with thousands of people
    all over the world, including in many organizations, large and small. I’ve witnessed
    up close and personal the remarkably positive impact that Question Thinking can
    make, both at work and at home. People say that they find the QT work “practical
    and profound and easy to use.” They tell me that they are enjoying more peace,
    confidence, and connection in their lives. They also say they’ve become more optimistic
    that having a successful and satisfying life, regardless of the circumstances,
    is possible for them personally.


    This is my heartfelt desire for you as well. You have the awareness, tools, and
    practices you need. May you use them often and well to bring more clarity, wisdom,
    love, and success into your life.


    I know that Learner Living is easier when connected with others on the same journey,
    so I invite you to join our Learner Community. And I’d love to hear from you about
    how you’re doing and whatever questions you might have.


    In the spirit of inquiry!


    *Marilee*'
  - '[PAGE 113]


    # Learner Resources


    **Choice Map Download:** As you''ve learned in the book, the Choice Map is a powerful
    self-coaching tool to help you learn about your Learner Mindset and Judger Mindset
    and discover new questions to get the results you want. To receive your free full
    color copy of the Choice Map, visit InquiryInstitute.com.


    **Change Your Questions, Change Your Life Book Club:** Engage with our Learner
    Community by joining the Change Your Questions, Change Your Life Book Club! Participate
    with other Learners from all around the world who want to learn, engage with,
    and support each other with the concepts from the book. Register to join at https://InquiryInstitute.com/LearnerResources.


    # Online Courses


    **The Choice Map Course:** Are you curious about how you can use The Choice Map™
    in your daily life and experience more happiness, connection, and productivity?
    The Choice Map Online Course will take you on the journey of exploring your mindsets
    and how to effectively use the Choice Map with yourself and in relationships with
    others. Learn more at https://InquiryInstitute.com/LearnerResources.


    **Seven Days to Learner Living:** To reinforce your Learner Mindset and build
    Learner habits, the Seven Days to Learner Living Online Course will help you develop
    the strengths of Learner Mindset, understand Judger Mindset, and know how to Switch
    back to Learner when you fall into Judger. Learn more at https://InquiryInstitute.com/LearnerResources.


    # Live Programs (in Person and Virtual)


    Do you want Learner Living and breakthrough results for yourself, your team, and/or
    your organization? Visit our website Services page for details.


    **Question Thinking (QT) Foundation:** The QT Foundation Workshop is a practical,
    experiential introduction to Question Thinking and mindset mastery.'
