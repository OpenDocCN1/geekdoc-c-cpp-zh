    \n## 切换策略1：用于切换的ABCD选择过程\n\nABCD是一种简单的记忆方式，用来提醒你切换——如果你发现自己陷入了评判者模式并且不想留在那里。每个字母都代表要问自己的问题。通常，养成对自己说ABCD的习惯就是你切换所需的全部（见图6）。我甚至与一些团队合作过，他们总是互相提醒这一点——当然是来自学习者思维模式！\n\
    \n![](img/061f1b5492e98ee8a01f818779461e15_74_0.png)\n\n**图6：** ABCD过程\n\n###\
    \ 我如何练习ABCD？\n\n思考你的思维模式挑战，想想那个人说了或做了什么时常引发你的评判者思维反应。当你专注于这种评判者触发因素时，放慢脚步，善待自己。善待自己是一种很棒的学习者练习。\n\
    \n### A：你觉察到了什么？\n\n既然你已经将那个评判者触发因素记在心里，请回答以下问题，以帮助你注意自己正在经历什么：\n\n*我有哪些想法和感受？*\n\
    \n________________________________________\n________________________________________\n\
    ________________________________________\n________________________________________\n\
    ________________________________________\n\n*我在问自己什么问题？*\n\n________________________________________\n\
    ________________________________________\n________________________________________\n\
    ________________________________________\n________________________________________\n\
    \n*我的身体有什么感觉？*\n\n________________________________________\n________________________________________\n\
    ________________________________________\n________________________________________\n\
    ________________________________________\n\n### B：如果你暂停并有意地呼吸一次，会发生什么？\n\n现在用鼻子深吸一口气，完全呼出，然后反思这些问题：\n\
    \n*充分吸气和呼气让我感觉如何？*\n\n*充分而深长的呼吸如何影响我对评判者触发因素的体验？（例如，你紧咬的下巴是否放松了，或者你所感受到的情绪强度是否有所减弱？）*\n\
    \n*活动我的身体如何帮助我管理自己的评判者反应？*\n\n### 身体练习：四拍呼吸\n\n注意到自己处于评判者状态了吗？为了让自己集中精神，尝试一次四拍呼吸。\n\
    \n用鼻子吸气，数四拍，暂停一拍，呼气，数四拍，然后再暂停一拍。重复几次，直到你感到脚踏实地、更加平静。\n\n### C：有什么值得好奇的？\n\n在觉察自己的思维模式并选择呼吸的过程中，你已经在运用学习者的好奇心帮助自己切换。将学习者的好奇心带到我们的评判者反应中，是切换的重要方面。\n\
    \n让我们再来看看本，看看他的好奇心发现了什么。\n\n### 本的思维模式挑战：\n\n**本的学习者好奇心**\n\n> **我到底怎么了？我真正感到沮丧的是什么？**\n\
    >\n> 我必须面对它，我真正沮丧的不是查尔斯和他的问题。我对自己感到沮丧，对我正在失败这一事实感到沮丧，而且我为自己无法回答他的问题感到沮丧。查尔斯只是在提醒我，有太多我不知道的东西，而我讨厌不知道。\n\
    \n> **对方真正的情况是什么？他们关心什么？**\n>\n> 我不确定我是否知道查尔斯关心什么。保住他的工作？我曾以为他只关心升职，但即使他被忽略后他仍然留在QTC，所以也许事实并非如此。\n\
    \n> **对方想要/关心的事情与我关心的事情是如何一致或不一致的？我们如何找到共同点？**\n>\n> 我想，如果我想得到这个问题的答案，我最好开始问查尔斯一些问题。哈！\n\
    \n### D：你**决定**要做什么？\n\n切换的最后部分是决定是留在评判者思维模式的道路上，还是有意识地踏上学习者思维模式的道路，并决定接下来要说什么或做什么。\n\
    \n**提醒！** 未来，即使你已经熟练掌握了你的思维模式和切换技巧，你仍然会被触发并从评判者角色作出反应！我多年来一直在努力掌握自己的思维模式，但有时我仍然会以评判者身份作出反应。好消息是，我去的次数减少了，强度也降低了，现在我通常可以一笑置之。\n\
    \n在这个练习中，你只是在反思你选择处理的评判者触发因素，这与实时体验评判者触发因素不同。花时间在这里问自己以下问题，将帮助你在将来被触发时决定切换。这种练习将支持你保持在学习者思维模式中。\n\
