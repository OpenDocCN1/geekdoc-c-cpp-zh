    \n## 第四章\n\n## 如果你可以选择切换心态呢？\n\n### *剧透警告：你其实已经可以了！*\n\n### 什么是切换？\n\n切换的能力是改变和可能性的基础。切换是人类天生就拥有的能力，我们一生中都切换过很多次，很可能甚至没有意识到。我称之为无意识切换。要掌握我们的心态，我们必须发展有意切换的技能。\n\
    \n> 切换是我们与生俱来改变心态的人类能力，也是一项可以有意识地发展的技能。\n\n有意切换要求我们首先注意到自己处于哪种心态，然后做出有意识的选择。我们可以选择保持当前心态，也可以选择从不同心态提出一个新问题。发展有意切换的技能需要练习——我们需要觉察到自己处于评判者状态，并有意识地决定切换到学习者状态。我们偶尔都会从评判者转到学习者，但这很少是有意的！\n\
    \n稍后我们将讨论如何建立有意切换的技能。在此之前，不妨先注意一下我们是如何自然地在学习者心态和评判者心态之间转换的。\n\n### 学习者反思\n\n对有意切换心态的可能性，我有什么想法或感受？我对这个想法有什么疑问？这可能对我意味着什么？\n\
    \n### 切换是什么感觉？\n\n环顾四周。注意你空间里的所有事物。也许你在家里，透过窗户看到你种下的一棵美丽的树生机勃勃。也许你看到墙上挂着一幅画，发现它是歪的。也许你在飞机上，旁边有人在大声说话；或者，也许你向窗外看去，看到太阳在远处的山后落下。\n\
    \n当你环顾四周时，停下来观察每一种因周围环境而触发的心态。通过完成下方针对你在当下环境中注意到的至少五个不同的人或事物的句子，记录伴随心态出现的任何想法、情绪或身体感受：\n\
