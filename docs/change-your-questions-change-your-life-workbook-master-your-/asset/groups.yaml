    ## 思维模式与问题之间有什么关系？


    正如选择地图上所示，当我们走在学习者路径上与走在评判者路径上时，我们向自己提出的问题截然不同。这表明我们的思维模式是如何编码在我们的问题中的。


    回到选择地图，大声读出评判者路径上的所有问题。阅读时，问问自己：“当我读到这些评判者式的问题时，它们让我有什么感受？”在下方提供的空白处记录你的体验。


    *当我大声读出评判者式的问题时，我有什么体验？留意你的想法、呼吸、情绪以及身体的感受。*


    接下来，大声读出学习者路径上的所有问题，同时问自己：“当我读到这些学习者式的问题时，它们让我有什么感受？”在下方提供的空白处记录你的体验。


    *当我大声读出学习者式的问题时，我有什么体验？留意你的想法、呼吸、情绪以及身体的感受。*


    做得好！


    在大声朗读评判者和学习者式问题时，观察自己在情感和身体上的感受，这个简单的练习是掌握思维模式的关键基础：建立对每种思维模式影响的觉察。


    ## 什么是问题思维？


    问题思维描述了我们如何借助问题进行思考；当有意识地运用时，它是一种有目的、有技巧的提问方法，能提升我们向自己和他人提出的问题的质量和结果。


    你可能已经注意到，选择地图上的想法气泡里全都充满问题。那是因为我们依靠问题来思考。在任何特定时刻，我们所处的思维模式决定了我们会用什么样的问题来思考。我还记得当我意识到我们是在用问题思考时，那种“恍然大悟”的感觉！


