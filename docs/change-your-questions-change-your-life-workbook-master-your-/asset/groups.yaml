    \n## 学习者的特质\n\n*当处于学习者心态时，我们常常会……*\n\n- 思维开放\n- 好奇且有创造力\n- 懂得欣赏\n- 接纳\n- 灵活\n\
    - 乐于合作\n- 专注于解决方案\n- 专注于责任\n- 专注于未来和可能性\n\n## 学习者的相处方式\n\n*当处于学习者心态时，我们与他人（或自己）的相处方式可能……*\n\
    \n- 双赢\n- 有辨识力、包容\n- 有联结\n- 在冲突中具有建设性\n- 倾向于欣赏、解决或创造\n\n## 学习者的倾听\n\n*当我们用“学习者的耳朵”倾听时，我们往往……*\n\
    \n- 关注共识和有效之处\n- 听到我们认可的内容\n- 注意到我们喜欢的东西\n- 试图理解\n- 假设积极的意图——即使我们不同意或不喜欢对方的信息\n\
    - 寻找分享内容中的价值\n\n## 我注意到了什么？\n\n现在，让我们花一点时间反思一下，关于你为心态挑战所选的那个恼人的人或情境，你注意到了什么样的心态平衡。\n\
    \n### 你的心态挑战：\n\n### 关于你的心态，你注意到什么\n\n结合你的情况，回答以下问题：\n\n*我得到的对他人评判者心态的分数，说明了我在如何思考、感受、表现以及如何与这个人及其行为相处？*\n\
    \n*我得到的对自己评判者心态的分数，说明了当这个人这样表现时，我在如何思考、感受、表现以及如何与自己相处？*\n\n"
