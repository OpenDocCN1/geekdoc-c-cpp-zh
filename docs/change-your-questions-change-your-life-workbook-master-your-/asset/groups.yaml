    \n恭喜！你刚刚观察到了自己的心态。通过回答这些问题，你体验到了在两个人类共有的心态中觉察到自己的感觉：学习者心态和评判者心态。让我们简要了解一下这两种心态。\n\
    \n> **学习者心态**的特点是好奇心、灵活性、开放的思想和欣赏——所有这些都编码在我们对自己、他人和世界所持的一系列信念、假设、期望和可能性中。*每个人*都有学习者心态。\n\
    \n> **评判者心态**的特点是渴望正确、掌控、安全和确定。它部分源于我们为生存而天生的硬连线。评判者心态常常对自我和他人充满批评和评判——所有这些都编码在我们对自己、他人和世界所持的一系列信念、假设、期望和可能性中。*每个人*都有评判者心态。\n\
    \n评判者心态产生了我写论文遇到困难时问自己的那种令人束缚的问题；学习者心态则产生了我教自己在每次注意到评判者心态的问题时去问的那些更开阔、更有力量的问题。\n\
