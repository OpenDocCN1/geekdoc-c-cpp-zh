  - '[PAGE 76]


    # B: What happens if you pause and take an intentional BREATH?


    Now take a deep breath through your nose, exhale completely, and reflect on these
    questions:


    *How does taking a deep breath and exhaling fully make me feel?*


    *How does breathing fully and deeply impact the experience of my Judger trigger?
    (For example, did your clenched jaw relax or the intensity of the emotion you
    were feeling subside?)*


    *How might moving my body help me manage my Judger reaction?*


    # Somatic Practice: Four-Count Breath


    Notice yourself in Judger? To get centered, try taking a four-count breath.


    Inhale through your nose for a count of four, pause for one count, exhale for
    a count of four, and then pause for one count. Repeat the process several times
    until you feel grounded and calmer.'
