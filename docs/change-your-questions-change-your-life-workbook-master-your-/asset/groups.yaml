    # How Can I Practice ABCD?


    Think about your Mindset Challenge and remember what the person says or does that
    regularly triggers a Judger Mindset reaction from you. As you focus on this Judger
    trigger, slow down and be gentle with yourself. Being kind to yourself is a wonderful
    Learner practice.


