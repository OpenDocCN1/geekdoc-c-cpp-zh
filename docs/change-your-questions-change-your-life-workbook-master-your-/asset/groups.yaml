  mdcn: "\n强化我的学习者心态如何帮助我把生活变得更好？\n\n在学习者生活之旅走到现在，我因为哪些方面而认可和庆祝自己？\n\n## 更多学习方式\n\n\
    既然你已接近这段学习之旅的终点，我鼓励你利用其他一些方式保持前进势头。以下是一些关于如何持续践行学习者生活的建议：\n\n- **1. 熟能生巧！**\n\n\
    \  首先，要知道你随时可以从头再学一遍这本书，想学多少次都可以。选择另一个让你烦心的情境，可以是同一个人，也可以是全新的人和全新的情境，并做一次新的心态挑战。例如，如果你第一次选的是工作中的某个情境和某个人，你可以从个人生活中选择一个人和一个情境来练习。你甚至可以回顾第1章中列出的让你烦心的情境清单，再选一个来练习。\n\
    \n- **2. 找一个学习伙伴！**\n\n  有些人在有一个学习伙伴分享旅程时学得更好。找一个愿意完成自己的心态挑战的人，这样你们可以比较经历、强化提问思维技能，并相互支持。你可以邀请工作中的同事、朋友，甚至配偶或伴侣。\n\
    \n  - a. 讨论并分享你的转换故事。\n  - b. 彼此讲述自己掉进评判者陷阱的时刻，以及你当时如何应对。\n  - c. 庆祝你们对自己有了新的发现，以及你们各自正在建立的新觉察。\n\
    \  - d. 创建一个“学习者联盟”，定期交流，并借助选择地图、转换问题和 Q-Prep 等 QT 工具相互支持。\n\n## 现在做什么？\n\n你取得的成就是好消息，但我还有更好的消息要分享。你在这里完成的大部分工作，都与你选择练习的心态挑战情境有关。令人高兴的是，你学到的技能也可以应用到生活中任何会触发评判者心态的情境中。也就是说，处处都可以应用！\n\
    \n在接下来的两页中，你会看到一张新的空白选择地图可供填写（图9）。既然你已经体验了心态挑战的完整过程，你已经对自己、你的学习者和你的评判者有了很多了解。填写这张选择地图时，你将为自己创建一个强大的参考工具——一张帮助你识别自己的心态并进行转换的路线图。\n\
    \n我邀请你反思自己在生活中最常问自己的评判者心态问题，并把它们写在评判者心态路径的思考气泡中。你可以随意翻阅选择地图中的所有评判者问题，以及你在这本练习册中做过的练习，找出那些经常反复出现在你心中的问题。\n\
    \n同时反思你经常使用的学习者心态问题，并把它们写在学习者的思考气泡中。完成这本练习册后，你可能已经有了一些新的学习者问题。这些问题将帮助你推进学习者心态思维，或在察觉自己处于评判者心态时帮助你转换。\n\
    \n完成这个练习后，你将拥有一张个性化的地图，上面列出最常出现在你身上的学习者心态和评判者心态问题。带着这些学习者问题和新的自我觉察，哦，你将去往多么广阔的地方！\n\
    \n## 选择地图™\n\n我们每时每刻都在选择\n\n![](img/061f1b5492e98ee8a01f818779461e15_108_0.png)\n\
    \n任何时刻影响我们的事物\n\n想法 · 感受 · 境况\n\n- 起点\n- 选择\n\n学习者心态\n\n评判者心态\n\n- 反应\n\n评判者陷阱\n\
    \n## 我对学习者生活的个人愿景\n\n这本练习册带你走过了一段学习者生活变革之旅。我希望你喜欢学习如何与评判者做朋友，以及如何从评判者心态转换到学习者心态。如果你已经做出了哪怕一个小改变，你也可以做出更多改变，直到学习者生活成为你的新常态。\n\
    \n现在，是时候进一步展开想象：学习者生活能为你的整个人生带来哪些美好和可能。在下方空白处，运用你的想象力，描绘一幅学习者生活成为你新常态的愿景。你在工作和家庭中的关系会是什么样？你与自己的关系会变成什么样？成为一个有韧性的学习者会如何影响你生活中的结果和体验？你能多享受多少轻松、平静、联结、乐趣，甚至爱？\n\
    \n你还能看到哪些额外的可能性？给自己充分的许可，去想象当你的生活和关系扎根于学习者生活时，它们会呈现出怎样的面貌和感受。\n\n## 我的学习者生活承诺\n\
    \n既然你已完成心态挑战，并走到了这段变革之旅的终点，我邀请你投身于你自己的学习者生活愿景。这不可避免地包括偶尔掉进评判者心态。当这种情况发生时，你现在知道要善意地提醒自己：你是人，并寻找可以从评判者身上学到的东西，同时相信自己有能力完成转换！\n\
    \n我，________________________，承诺践行学习者生活。\n\n我感谢我的评判者，因为[列出你的评判者教会你的一切]\n\n____________________________________________\n\
    ____________________________________________\n____________________________________________\n\
    ____________________________________________\n____________________________________________\n\
    ____________________________________________\n____________________________________________\n\
    \n没有你，我就不会成为今天这样的学习者。\n\n从今天起，我将运用心态掌控和提问思维的觉察与工具，持续培养我的学习者生活技能。这样我才能继续以学习者的身份出现在我的同事、家人、朋友、社区和我自己面前。通过这种方式，我可以为创造一个学习者世界贡献力量。\n\
    \n签名 ________________________________  日期 __________\n\n*这里有一个建议：在日历上标记一个日期，回来重温这本练习册，以强化并庆祝你持续取得的进步。*\n\
    \n## 恭喜！\n\n我们终于一起走到了这段旅程的终点。我非常感激你为取得这一成就所付出的时间、努力和承诺。我本人已经每天坚持这项工作大约30年了。如果没有一次又一次地以学习者身份生活并接纳评判者，我肯定不会有今天这样美好的生活（包括其中的起起落落！）。\n\
    \n我还有幸直接与世界各地成千上万的人一起做这项工作，包括在许多大大小小的组织中。我近距离亲身见证了提问思维在工作场所和家庭中能产生的显著积极影响。人们说，他们觉得\
    \ QT 工作“实用、深刻且易于使用”。他们告诉我，他们在生活中享受着更多平静、自信和联结。他们还说，自己变得更加乐观，相信无论境遇如何，个人都有可能拥有成功而令人满意的生活。\n\
    \n这也是我对你的衷心期望。你已经拥有所需的觉察、工具和练习。愿你常常善用它们，为你的生活带来更多清晰、智慧、爱与成功。\n\n我知道，与同行者联结时，学习者生活会更容易，所以我邀请你加入我们的学习者社区。我也很乐意听到你的近况以及你可能有的任何问题。\n\
    \n以探究的精神！\n\n*Marilee*\n\n## 学习者资源\n\n### 选择地图下载：\n\n正如你在书中所学，选择地图是一个强大的自我教练工具，可帮助你了解自己的学习者心态和评判者心态，并发现新的问题，从而获得你想要的结果。要获取免费的全彩选择地图副本，请访问\
    \ InquiryInstitute.com。\n\n### 改变你的问题，改变你的生活读书会：\n\n加入“改变你的问题，改变你的生活读书会”，与我们的学习者社区互动！与来自世界各地、希望学习、参与并相互支持书中概念的其他学习者一起参与。请访问\
    \ https://InquiryInstitute.com/LearnerResources 注册加入。\n\n### 在线课程\n\n**选择地图课程：**\
    \ 你是否好奇如何在日常生活中使用选择地图™，体验更多幸福、联结和生产力？选择地图在线课程将带你踏上探索自身心态的旅程，并学习如何在自己身上以及与他人的关系中有效使用选择地图。了解更多，请访问\
    \ https://InquiryInstitute.com/LearnerResources。\n\n**七天走向学习者生活：** 为了强化你的学习者心态并培养学习者习惯，“七天走向学习者生活”在线课程将帮助你发展学习者心态的优势、理解评判者心态，并知道在掉入评判者心态时如何转换回学习者心态。了解更多，请访问\
