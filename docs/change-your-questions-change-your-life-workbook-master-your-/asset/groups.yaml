    # CHAPTER ONE


    # # What Do You Want to Change?


    *Intentional change typically involves changing mindsets, so that is where we
    will begin.*


    # ## What Is a Mindset?


    Since you picked up this workbook to master your mindset, I think it’s important
    to begin by defining a mindset.


    Mindset is more than an attitude; it’s the place from which we operate in any
    given moment. It’s a way of being that influences how we think and feel, what
    we do, and how we relate to others and to ourselves. Mindset is always affecting
    our moods, experiences, behaviors, and results, and it has an impact in both our
    personal and professional lives.


    Mindset is not static; our mindset can change from moment to moment, often as
    an unconscious reaction. We react to our circumstances, to our interactions with
    others, and even to what is happening inside us—our thoughts and feelings. Keep
    in mind, feelings can be either emotional or physical, which means mindset also
    has a somatic or bodily aspect to it. Our mindsets are not just in our heads.


    **Mindset** represents the beliefs, assumptions, expectations, and possibilities
    we hold about ourselves, others, and the world. Our mindset is not static and
    can change unconsciously from moment to moment. Learning to master our mindset
    means we can choose to change it intentionally.'
