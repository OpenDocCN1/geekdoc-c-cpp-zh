  mdcn: '

    - *如果我大部分时间都能处于学习者**在家时的心态**，会有什么可能？如果我大部分时间处于学习者心态，我与**家人**的关系会如何变得更好？*

    - *如果我能**在面临重要决定时**大部分时间都处于学习者心态，会有什么可能？*

    - *如果我能**在经历冲突时**大部分时间都处于学习者心态，会有什么可能？*

    - *如果我能**在犯错之后**大部分时间都处于学习者心态，会有什么可能？*

    - *如果我能**在别人做了我觉得受伤或不尊重的事情时**大部分时间都处于学习者心态，会有什么可能？*


    - *如果我能够迅速而可靠地切换，当我意识到自己处于评判者心态时，我会如何以更多的接纳和慈悲来对待**自己**？*

    - *如果我能够迅速而可靠地切换，当我意识到自己处于评判者心态时，我会如何更慷慨、更有效地对待**他人**？*

    - *如果我大部分时间都处于学习者心态，我的生活中还会有什么变得更好？我能否变得不那么紧张、更加平静？*


    让我们回到你在这本工作手册中一直用于“心态挑战”的那个情境。


    - *如果当这个人说出或做出触发我评判者反应的事情时，我能够主要保持学习者心态，我所得到的**结果**会如何改善？这对我与他人的关系有什么好处？*

    - *在这种情境下，主要保持学习者心态会如何增强**我与自己的关系**？*


    ### 用 Q-Prep 准备一次对话


    既然你已经看到了学习者心态创造的价值，是时候计划如何在可能触发评判者心态的情况下保持学习者心态了。具体来说，想一想你接下来可能会与“心态挑战”中的那个人进行的对话。很可能这次对话会再次给你提供触发评判者心态的机会。


    很好。


    与大多数人的对话都提供了大量练习切换的机会！


    为什么？因为我们在进入对话时，已经带着自己的假设和独特的解读方式——对方也是如此。由于评判者心态总是在寻找分歧，对话很容易触发评判者心态。


    在回答以下问题时，想一想你的情境。这些问题构成了我称之为 Q-Prep 的“提问思维”协议。


    **Q-Prep** 是一种使用提示来为成功对话和会议做准备的协议，你可以这样问自己……


    - 在这场对话中，我的评判者心态可能会如何被触发？

    - 当我注意到自己处于评判者心态时，我会使用什么切换策略？（例如，问自己一个常用的切换问题，深呼吸，做一次身体练习，等等。）

    - 我该如何准备自己，用学习者的耳朵去倾听对方？


    现在把所有这些问题汇总起来，问自己……


    - *理想情况下，我希望这场对话如何进行？*

    - *对我来说，对对方来说，对这种情况来说，怎样才算赢？*

    - *在这场对话中，我会说（或不说）什么，做（或不做）什么，才能向我表明我已经朝着掌握自己的心态迈出了步伐？*


    记住，当你看到进步时，要庆祝——任何进步！记住，我们追求的是进步，而不是完美！


    运用提问思维掌握心态需要意愿、准备和练习。我们越快地注意到——甚至预见到——评判者的存在，就能越早切换到学习者。我们练习得越多，心理准备越充分，就能越快注意到并切换。一旦进入学习者心态，我们就能专注于向前迈进，创造学习者的解决方案、体验和结果。


    > **学习者生活提示。** 准备好让你的评判者心态定期被触发——这会发生，因为你是人。为这种不可避免的情况做好准备，准备一个切换策略，支持你回到学习者心态的道路上。


    无论对方在我们的对话中表现如何，我该做些什么来让自己保持在学习者心态的道路上？


    ________________________________________


    我鼓励你尽可能经常使用 Q-Prep。除了选择地图之外，它是许多人最喜欢的 QT 工具。我在桌上放一个笔记本，几乎每次对话前都会做一个简短的 Q-Prep。结果，我的会议更有效率，对话更令人满意，甚至偶尔会有突破。


    ### Q-Prep 反思


    当你完成了 Q-Prep 之后，进行过对话后，用下面的空间反思发生了什么、取得了什么进步、学到了什么。


    使用 Q-Prep 如何影响了我的对话方式？


    ________________________________________


    在这场对话中，我的评判者心态是如何出现的？我是对它做出反应，还是仅仅注意到了它？我能否切换？如果能，我用了什么切换策略？我问了自己什么切换问题？结果如何？


    ________________________________________


    - *如果我在对话前没有完成 Q-Prep，事情可能会如何发展？*

    - *在这场对话中，我对自己心态的管理有什么值得庆祝的？我有没有说过（或没说过）什么、做过（或没做过）什么，反映出我日益增长的心态掌控力？*

    - *我从这场对话中管理自己心态的方式中学到了什么，可以应用到未来？*


    记住……反思是一种基础的学习者心态练习。它给了我们停顿、学习和从观察到的事物中成长的空间。


    ## 第六章


    ## 欢迎来到你的新未来


    *你能想象哪些新的可能性？*


    ### 看看你已经走了多远


    做得好！你表现出了对“学习者生活”改变之旅的承诺……不是每个人都能做到。花点时间庆祝一下吧。


    如果你不是一个喜欢自我祝贺的人，请允许我提醒你你所取得的所有成就。通过全身心投入这段旅程，你加深了对自己的心态以及思考时所使用的问题的认识。这是发展真正自我意识的基础，是所有学习和成长的基石。你勇敢地审视了自己的评判者心态，并开始了将评判者转变为顾问的进程。你还通过自我反思和“心态挑战”建立了学习者心态的练习。当然，你还学会了关键的切换艺术。


    ### 唯一能改变的人是你自己……而这正是你力量的来源！


    你有没有注意到，在这本工作手册中，我们只关注了你的心态——而不是对方的？这有一个重要的原因。


    唯一能改变的人是你自己，唯一能掌握的心态也是你自己的。


    尽管你可能很想在认为对方处于评判者心态时尝试“切换”他们，但这不是你的工作。想象一下，如果你正处于评判者心态反应的控制之下，而有人问你是否处于评判者心态，你会如何反应？那只会把我们大多数人推向更深的评判者深坑！


    好消息是，当你掌握了自己的心态，当别人处于评判者心态时你的表现会改变。当你练习切换到学习者而不是从评判者反应时，你将创造出新的可能性和新的未来，而这些如果留在评判者心态中将永远不可能实现。


    没有人能改变别人；然而，我们可以为可能使他人更容易改变的条件做出贡献。我们通过自己处于学习者心态来做到这一点，这样他们就能加入我们。保持通过掌握心态来成长和改变的承诺，是“学习者生活”的本质。


    > “在对与错的想法之外，有一片田野。我将在那里与你相会。”

    >

    > 鲁米


