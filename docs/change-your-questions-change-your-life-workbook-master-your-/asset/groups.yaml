    # Glossary


    **Mindset:** The beliefs, assumptions, expectations, and possibilities we hold
    about ourselves, others, and the world. Our mindset is not static and can change
    unconsciously from moment to moment, or, when we learn to master it, we can choose
    to change our mindset intentionally.


    **Question Thinking:** How we think with questions and, when utilized intentionally,
    is a method of purposeful and skillful question asking that improves the quality
    and results of the questions we ask ourselves and others.


    **Learner Mindset:** A mindset characterized by curiosity, flexibility, open-mindedness,
    and appreciation—all encoded in a set of beliefs, assumptions, expectations, and
    possibilities we hold about ourselves, others, and the world. Everyone has a Learner
    Mindset.


    **Judger Mindset:** A mindset characterized by the desire to be right, in control,
    safe, and certain, and it stems, in part, from our hardwiring for survival. Judger
    Mindset is frequently critical and judgmental of both self and others—all encoded
    in a set of beliefs, assumptions, expectations, and possibilities we hold about
    ourselves, others, and the world. Everyone has a Judger Mindset.


    **Choice Map:** The self-awareness and self-coaching tool that illustrates the
    two mindsets we all share: Learner and Judger. It helps us locate which mindset
    we are in at any given moment. That enables us to map where our current mindset
    will likely take us, and can help us choose whether to proceed on our current
    path or Switch mindsets and travel a different route that will take us to the
    results we want.


    **Switching:** This is the innate ability all humans possess to change their mindset
    and it is a skill that can be intentionally developed.


    **ABCD Choice Process:** The QT tool that describes the process of Switching from
    Judger Mindset to Learner Mindset: becoming Aware of your mindset, taking a moment
    to step back and Breathe, getting Curious about yourself, and Deciding what to
    do next.'
  - '[PAGE 116]


    **Learner Living:** A commitment to create better experiences, relationships,
    and results in our daily lives so that we spend more time in Learner and decrease
    the frequency and impact of Judger.


    **Learner Listening and Judger Listening:** The mindset through which we listen
    impacts how we interpret what we hear. Learner Mindset listens with Learner questions
    such as, “What''s valuable in what they''re saying?” Judger ears listen with Judger
    questions such as, “What''s wrong with what they''re saying?” At any moment we
    can choose to listen with Learner ears or with Judger ears.'
