    2. Breathe slowly and deeply through your nose into your heart center.

    3. Bring to mind an experience of being with someone who loves you unconditionally
    and with whom you feel completely safe (pets count too!).

    4. Notice in your body any positive, calming feelings as you recall this experience.

    5. When your connection to these feelings is steady, continue your deep, slow
    breathing as you release the image and simply bathe in the calm for about 30 seconds.


    ### LEARNER REFLECTION


    What thoughts or feelings do I have about the possibility of living more reliably
    in my Learner Mindset? What questions do I have about this idea? What implications
    and possibilities might this have for me?


    ## How Can I Live (Mostly) in Learner?


    How would your life be different if you lived most of the time in Learner? At
    the beginning of this workbook, I asked you to focus on a person who says or does
    something that regularly triggers your Judger Mindset. When you chose that triggering
    situation to work on, I asked you how your life would be better if you could change
    your reaction. We will return there in a moment, but first let’s take time to
    reflect on how living predominantly in Learner would improve your life in general.
    I encourage you to think big about all the joy, love, and success you can envision
    for yourself!


    *What would be possible if I could spend most of my time in Learner Mindset at
    work?* How would my relationships at work be better if I were in Learner Mindset
    most of the time?

