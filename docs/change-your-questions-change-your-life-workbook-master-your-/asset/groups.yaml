    现在你已经有了一张个人化的思维模式问题地图，与你遇到的“思维模式挑战”息息相关。在阅读本工作手册的过程中，请使用这张选择地图来帮助你驾驭自己的思维模式。在工作手册的末尾，你还会有一张空白的“选择地图”需要填写。完成整个工作手册后，你可能会发现自己注意到脑海中出现了新的问题。你可以用自己提出的问题填写第二张“选择地图”。


    在这一章中，你将有机会检视与你的“思维模式挑战”相关的评判者思维反应，并从中学习。提升你对评判者思维的觉察——无论是朝向自己的还是朝向他人的——是掌握思维模式的第一步。我把这称为“学习者练习”。当我们带着好奇心审视自己的评判者思维时，我们就站在了选择地图的学习者路径上，反思是什么触发我们进入评判者思维，以及我们处于评判者路径时如何思考、感受和行动。


    ### 评判者思维与做出判断不是一回事！


    - 评判者思维指的是一种对自己和他人持挑剔、批判态度的思维模式。

    - 明智的判断是注重逻辑和事实的，而不是仅仅局限于情绪、观点和偏见。我们必须在个人和职业生活中做出明智的判断。


    如果你像我以及多年来我指导、培训过的大多数人一样，那么你一生中经历过很多次“评判者劫持”。那是指某人说或做了某件事，触发了一种与实际情况不成比例的评判者反应。通常，过去的某些事件让我们变得如此易激惹，而这种反应模式确实会妨碍我们的人际关系、幸福和成果。也许在过去的某个时刻，你在当前所处理的情境中反应过度。也许这就是你选择处理这段关系和这种行为的缘故。


    如果你经历过“评判者劫持”，请不要灰心。我们都经历过！探索你的评判者历史，将帮助你理解为什么这个特定的人所说或所做的事情会触发你的评判者反应。这就是为什么探索我们自己的评判者历史如此有用，而接下来你将要做的正是这件事。


    ## 我与评判者思维的历史是怎样的？


    每个人都有评判者思维。每个人也都有自己内心深处的一串清单——人、行为、观点、话语、声音、气味等等——会触发评判者反应。在这个练习中，你将探索一生中的评判者思维，从而开始理解你的评判者是如何运作的。当你理解某件事时，就更容易与它和平共处。


    ### 学习者反思


    对于陷入“评判者劫持”，我有什么想法或感受？我对这个观点有什么疑问？这可能对我产生什么影响？


    在轮到你之前，我们先听听本（Ben）讲述他的评判者历史。


    ### 本的思维模式挑战：本的评判者历史


    > *我记得最早遇到评判者思维是什么时候？当时发生了什么？我是那个以评判者思维做出反应的人，还是别人？*


    我对评判者思维最早的记忆是父亲对母亲发火，因为他问了她一个问题，而母亲不知道答案。那时我还太小，甚至不记得他为什么生气的细节，只记得他说话的声音有多大，身影显得多么高大。母亲的脸涨得通红，然后变得非常沉默。


