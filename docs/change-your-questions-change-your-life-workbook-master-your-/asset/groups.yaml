    寓言中的主角名叫本，这本练习册旨在让你体验一段与本的经历相似的成功改变之旅。通过学习提问式思维，本在提升自己作为团队领导者的技能时，变得更有能力、更自信，甚至与妻子建立了更好的关系。在你完成这本练习册的过程中，本的旅程将作为你的范例，你将看到他如何应对各种练习，从而让这些练习对你鲜活起来。


    ## 介绍本


    当我们在《改变你的问题，改变你的生活：领导力、教练与成果的12个强大工具》中遇见本时，他即将辞去自己的工作。本受聘于QTec的CEO亚历克萨——她也是他的朋友和前老板——来领导一个团队和项目，而如今这个项目濒临失败。在整个职业生涯中，本一直是“答案先生”，以深厚的技术专长和解决难题的能力著称。但现在本要领导他人，而他在这一点上正走向失败。


    团队里似乎没有人听本的话，他们的会议最终只是令人沮丧的死胡同。他最大的问题出在查尔斯身上，查尔斯曾申请本现在担任的领导职位。与查尔斯的沟通越来越糟。事实上，本认为查尔斯正试图破坏他，并觉得自己被查尔斯没完没了的问题所困扰。


    同样令人沮丧的是，本工作上的麻烦正蔓延到他和妻子格蕾丝的关系中。他们之间的紧张关系正在加剧。最后，本认定，要避免工作和家庭中的灾难，他唯一的选择就是从QTec辞职——但他的老板亚历克萨不同意。她拒绝接受他的辞呈，而是把他送到提问式思维教练约瑟夫那里，约瑟夫教给本你在这里将要学到的工具。


    本页有意留白


    ## 第一章


    ## 你想改变什么？


    *有意的改变通常涉及改变思维模式，所以我们就从这里开始。*


    ### 什么是思维模式？


    既然你拿起这本练习册是为了掌握自己的思维模式，我认为有必要先定义一下思维模式。


    思维模式不仅仅是一种态度；它是我们在任何特定时刻运作的出发点。它是一种存在方式，影响着我们如何思考和感受、我们做什么，以及我们如何与他人和自己相处。思维模式始终在影响我们的情绪、经历、行为和结果，并且对我们的个人生活和职业生活都有影响。


    思维模式不是静态的；我们的思维模式可以每时每刻发生变化，常常是无意识的反应。我们对环境、与他人的互动，甚至对内心正在发生的事情——我们的想法和感受——作出反应。请记住，感受既可以是情绪性的，也可以是身体性的，这意味着思维模式也有躯体或身体层面。我们的思维模式并不只存在于头脑中。


    **思维模式**代表了我们对自己、他人和世界所持有的信念、假设、期望和可能性。我们的思维模式不是静态的，可以每时每刻无意识地改变。学会掌握我们的思维模式意味着我们可以有意识地选择改变它。


    ## 本的思维模式挑战：本列出的烦人人物与情境


    | 人物<br>*（列出他们的姓名和你们的关系）* | 我觉得烦人的行为<br>*（描述他们说的/做的让你困扰的事）* | 我如何反应<br>*（描述你的想法、感受、言语和行为）*
    |

    |---|---|---|

    | **查尔斯（我的员工）** | 查尔斯在会议上问太多问题，感觉他质疑一切，拖慢我们的进度。 | 我知道我在心里抱怨查尔斯。我想有时他问问题时我会大声叹气。有一次我翻了白眼。
    |

    | **格蕾丝（我的妻子）** | 格蕾丝在我上班时打电话给我，抱怨她的工作日，好像我不忙一样。 | 我对格蕾丝语气尖锐，有时告诉她我太忙没空说话。（我确实忙！）
    |

    | **不使用转向灯的司机** | 这些人表现得好像路上只有他们一样，还强行加塞，可能造成事故。 | 我按喇叭。我咒骂。独自在车里时，有时我会冲他们大喊，好像他们能听见我一样。
    |

    | **我（本）** | 我对自己非常沮丧，似乎弄不明白团队为什么停滞不前。我通常是“答案先生”，但在这份新工作中我没有答案。 | 独自一人时，我沮丧又恼火地摇头。我告诉自己，离开旧工作是个错误。
    |


    为了最大限度地利用这本练习册，你要练习在与生活中一个实际的人的关系中掌握自己的思维模式。这意味着你不应该选择一群人——比如本清单上那些不使用转向灯的司机。


    虽然我们确实与自己有关系，而且这些技能也可以应用于你如何与自己互动，但这本练习册中的练习是为涉及另一个人的情境设计的。当你从另一个人那里获得反馈的益处时，你会更有效地学会掌握自己的思维模式。当我说“从另一个人那里获得反馈”时，我并不是说你需要请那个人给你意见。但几乎可以肯定会发生的是，当你练习并应用提问式思维时，你们彼此的互动会发生变化，而这会为你正在进行的内在功课提供有用的反馈。


    ## 学习者反思


    我对这个思维模式挑战有什么想法或感受？对于做这件事我有什么疑问？这对我可能有什么影响？


    对于自己的思维模式挑战，本选择专注于改变他对查尔斯的反应，他认为查尔斯问太多问题。此外，虽然本没有明确去改善他与格蕾丝的关系，但他确实看到自己的婚姻有所改善。学习用提问式思维掌握思维模式的美妙之处在于，当我们在生活的某一部分熟练使用这些工具时，其他部分通常也会受益。


    带着所有这些教练指导，回到你的清单，选择你想重点关注的那个人，以及那个人表现出的、你会负面反应的行为。这将是你的思维模式挑战，也是这本练习册中练习的主要焦点。


    ## 你为什么在意改变？


    还记得我说过要选择一个人和一种情境，你对它们的在意程度足以在练习变得困难时让你保持动力吗？现在就是你的机会，去联系为什么改变你对这个人和其行为的反应对你很重要。


    在你写下答案之前，让我们看看本会如何说明他为什么想改变对查尔斯的反应。


    ### 本的思维模式挑战：本为什么在意改变


    > *这个人对我来说是谁？为什么这段关系重要？*


    查尔斯是我的直接下属。他原本有望获得我现在拥有的领导团队职位。我每天都和他共事，他是这个项目团队的重要成员。如果我不改善与他的工作关系，我们的项目几乎肯定会失败。


    > *他们一直做什么让我觉得烦人？（允许自己抱怨，并具体一些！）*


    查尔斯问太多问题了。开会时他就只做这件事。他用问题、问题、更多问题质疑我说的每件事。有时我觉得他想用所有这些问题的来破坏我。


    > *当他们这样表现时，我如何反应？我想什么、感受什么、说什么、做什么？（考虑你做的表情、你的呼吸方式、你的语气，以及你是变得烦躁还是封闭自己等。要具体描述你的反应；觉察是关键。）*


    当查尔斯张嘴要问问题时，我能感觉到身体变得紧张。我咬紧牙关，我就是知道他要说的话会让我心烦。当我回答他的问题时，我能听出自己语气中的强烈情绪。其他时候，我干脆不理他的问题，因为我只能勉强忍住不发火。


    为什么改变我对这个人和其行为的反应对我重要？


    查尔斯和我正在做的项目落后于计划，我们需要合作才能成功。他所有的问题以及我对这些问题的沮丧正在阻碍我们。


    如果我不改变我对这个人和其行为的反应，会让我付出什么代价？（例如，可能让你失去一段友谊或一次晋升，也可能只是不断耗尽你的快乐，或在家庭或工作中感到成功的感受。）


    如果查尔斯和我继续像现在这样互动，这个项目会失败，那对我们所有人以及公司都不利。


    ## 你的思维模式挑战：你为什么在意改变


    想一想你选择重点关注的那个人，以及他们经常说的/做的让你烦人的事，然后回答以下问题：


    *这个人对我来说是谁？为什么这段关系重要？*

