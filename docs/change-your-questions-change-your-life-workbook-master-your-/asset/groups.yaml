    \n*我的评判者思维模式如何阻碍我成为我想成为的人？*\n\n______________________________\n\n______________________________\n\
    \n______________________________\n\n______________________________\n\n______________________________\n\
    \n## 切换策略2：切换问题\n\n你也可以通过问自己一种特定类型的问题来触发思维模式切换，这种问题被称为“切换问题”。把切换问题看作是救援问题或“第一响应者”问题。一旦你意识到自己处于评判者状态，它们真的可以将你从评判者的体验或后果中拯救出来。切换问题让你有机会选择新的路线，有时还能取得重大突破——无论是在你自身还是在与他人的关系中。\n\
    \n切换问题是“从……到……”的问题，当你选择切换时，它们会带你从评判者思维模式走向学习者思维模式（图7）。切换问题实际上是学习者思维模式的问题，当你发现自己处于评判者模式而不想待在那里时，你可以使用它们。问这些问题是为了打断你评判者思维模式的想法、感受、行为和倾听。然后你可以邀请自己切换到学习者的路径上。切换问题嵌入在ABCD过程中，因为当我们好奇时，我们会问自己问题——通常来自学习者。\n\
    \n无论你是否意识到，你已经有了自己的切换问题。最终目标是将切换发展为一种可靠且可预测的技能。\n\n![](img/061f1b5492e98ee8a01f818779461e15_81_0.png)\n\
    \n图7：切换车道\n\n### 我如何发现自己的切换问题？\n\n最好的切换问题是那些让你感觉最自然、最易于使用的问题。查看这个列表，在每个你能想象自己在任何时间、任何地点、对任何人使用的问题旁边打勾。你可能会发现自己把所有问题都勾上了！欢迎在下一页提供的空白处添加你自己的切换问题。\n\
    \n- [ ] 我现在处于评判者模式吗？\n- [ ] 我还能怎么想这件事？\n- [ ] 这件事有什么令人惊讶的？\n- [ ] 我更愿意在哪里？\n-\
    \ [ ] 我们有什么共识？\n- [ ] 这是我想感觉到的吗？\n- [ ] 这是我想做的事情吗？\n- [ ] 这场战斗真的值得打吗？\n- [ ] 我错过了什么或正在逃避什么？\n\
    - [ ] 我现在的目标是什么？\n- [ ] 我现在害怕吗？\n- [ ] 我是否正在成为我想成为的那种人（同事、朋友、家人、领导者）？\n- [ ] 我现在致力于什么？\n\
