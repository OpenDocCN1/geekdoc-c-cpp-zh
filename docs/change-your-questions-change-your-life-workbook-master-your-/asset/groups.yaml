    # Switching Strategy #2:

    Switching Questions


    You can also trigger a mindset Switch by asking yourself a specific kind of question,
    referred to as a “Switching Question.” Think of Switching questions as rescue
    questions or “first responder” questions. They can literally rescue you from Judger
    experiences or consequences once you’ve recognized that’s where you are. Switching
    questions give you the opportunity to choose a new course, and sometimes make
    major breakthroughs—both with yourself and in your relationships with others.


    Switching questions are “from-to” questions that carry you from Judger Mindset
    to Learner Mindset when you’ve chosen to Switch (Figure 7). Switching questions
    are actually Learner Mindset questions you can use when you notice you are in
    Judger and don’t want to be. Ask them in order to interrupt your Judger Mindset
    thoughts, feelings, behaviors, and listening. Then you can invite yourself to
    Switch over to the Learner path. Switching questions are embedded in the ABCD
    process because when we are curious we ask ourselves questions—usually from Learner.


    Whether or not you realize it, you already have Switching questions of your own.
    The ultimate goal is to develop Switching as a reliable and predictable skill.


    ![](img/061f1b5492e98ee8a01f818779461e15_81_0.png)


    Figure 7: Switching Lane'
  - '[PAGE 82]


    # How Can I Discover My

    Switching Questions?


    The best Switching questions are those that feel most natural and accessible to
    you. Review this list and place a check next to every question that you could
    imagine yourself using anytime, anywhere, with any person. You may find yourself
    checking all of them! Feel free to add any of your own Switching questions in
    the space provided on the next page.


    +   - [ ] Am I in Judger?

    +   - [ ] How else can I think about this?

    +   - [ ] What’s surprising about this?

    +   - [ ] Where would I rather be?

    +   - [ ] What do we agree about?

    +   - [ ] Is this what I want to feel?

    +   - [ ] Is this what I want to be doing?

    +   - [ ] Is this battle really worth fighting?

    +   - [ ] What am I missing or avoiding?

    +   - [ ] What is my goal right now?

    +   - [ ] Am I afraid right now?

    +   - [ ] Am I being the kind of person (colleague, friend, family member, leader)
    I want to be?

    +   - [ ] What am I committed to right now?

    +   - [ ] What might the other person be thinking, feeling, and wanting?

    +   - [ ] What humor can I find in this situation?

    +   - [ ] Is this the example I want to set for others (my children, colleagues,
    friends, etc.)?'
