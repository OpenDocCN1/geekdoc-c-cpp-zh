    - [ ] 我对自己、他人和这种情况有什么期望？

    - [ ] 这种感受/情绪在告诉我什么？

    - [ ] 我可能如何促成了这种情况（即使是无意的）？

    - [ ] 此刻我选择成为什么样的人？

    - [ ] 现在，我的选择是什么？


    *在此处添加你自己的转换问题：*


    现在，在你正在处理的触发事件中，当你发现自己处于评判者状态时，在可以作为你的首选问题的那个转换问题旁标一颗星。下次当你发现自己处于评判者心态时，深吸一口气，问自己这个问题，然后看看会发生什么。也尝试一些其他的转换问题，看看哪些对你有效。


    *用这个空间大胆写下你最好的“首选”转换问题。*


    ## 两种可能的未来是什么？


    在前面“欢迎”部分，当我讲述自己在论文中挣扎时如何发现提问思维时，我向你展示了新未来模型。这一次，让我们通过“转换”的视角再看一次（图 8）。


    ![](img/061f1b5492e98ee8a01f818779461e15_84_0.png)


    **图 8：** 新未来模型


    从根本上说，新未来模型向我们展示了转换如何影响我们的未来：当我们提出一个新问题时，我们就会创造新的可能结果。


    让我们回顾一下本的故事，看看他如何通过提出新问题为自己和团队创造新的未来。


    ## 本的心态挑战：


    ### 本的新未来


    与约瑟夫的合作让本学会了如何使用提问思维和选择地图，来识别自己在思考查尔斯时所用的评判者心态问题，例如“为什么查尔斯想破坏我的工作？”——并鼓励本进行转换。本接受了这一指导，将他的旧问题换成新问题，比如“查尔斯看到了什么是我没看到的？”以及“我还能如何理解查尔斯？”


    > 在与约瑟夫进行一次辅导后，本选择与查尔斯坐下来，承认自己一直以评判者的方式倾听和回应。通过承认自己的评判者心态，本创造了一个让查尔斯也感到安全的空间。从这里开始，他们开始以学习者的姿态高效协作，这改变了他们的项目进程和彼此关系。最终，本和查尔斯按时交付了项目，并取得了巨大成功。


    本获得的这些新成果并非奇迹。它们只是说明了一个道理：改变我们内心提出的问题，能够改变我们获得的结果。


    ## 你的心态挑战：


    ### 你的新未来


    在这个练习中，你要为正在处理的情况探索两种可能的未来：


    1. 如果你继续不断问自己那些关于自己、他人和情况的评判者问题，那么**可能的未来**是什么？

    2. 当你面对这个恼人的情况时，运用学习者的好奇心，选择转而问自己转换问题，你所能创造的**新未来**是什么？


    回答以下问题时，请再次思考你的情况：


    *如果我继续用关于自己、他人及其行为的评判者问题来思考，可能的未来是什么？请考虑你可能会出现的分歧，以及这些问题会如何影响你们的关系和任何结果。*


    ## 但如果我还没准备好转换怎么办？


    如果你在怀疑自己是否准备好并愿意转换，那么恭喜你！你展现出了某种程度的自我意识和诚实，这对于学习使用提问思维来掌控自己的心态至关重要。


    有时候我们就是还没准备好转换——这完全没问题！


    请注意，即使你问自己“我准备好从评判者心态中转换出来了吗？”这个问题本身也是一个转换问题。当你问自己一个转换问题时，你已经有一只脚踏上了学习者心态的道路——即使你对这个问题的回答是“不，我还没准备好转换！”


    ### 学习者反思


    对于有时不愿转换，我有什么想法或感受？关于这个想法，我有哪些问题？这可能对我有什么影响？


    转换通常需要我们对自己和他人抱有好奇心、同情心、同理心、宽恕和接纳。而有时，我们只是还无法给予自己或他人那种宽厚。


    你可能一直固守着关于自己、他人或某种情况的评判者想法、感受、信念、假设或解读。如果你发现自己不愿放下评判者心态的反应，不妨暂停一下，看看能否用学习者的好奇心去审视那份抗拒。请记住，在这个过程中要善待自己。用评判者心态去评判评判者心态只会造成不必要的痛苦，而且毫无帮助！


    让我们试一试。


    ## 是什么让我紧抓着评判者不放？


    再一次，想一想你在心态挑战中一直在处理的评判者反应。在完成这个练习之前，你甚至可以回到第 1 章完成的“心态检查”，回顾你在第 1 部分和第 3 部分中对评判者心态问题的回答。


    我可能固守着哪些与我的心态挑战相关的评判者心态想法、感受、信念、假设、解读或问题？（你的评判者反应可能是针对自己，也可能针对他人。）


    为什么我固守着这些评判者心态的想法、感受、信念、假设、解读或问题？它们对我意味着什么？如果我挑战自己的评判者视角，会发生什么？固守这种评判者视角是如何让我觉得自己是对的，或帮助我感到安全和确定？


    当我注意到自己有任何这些评判者想法、感受、信念、假设、解读或问题时，我可以问自己什么转换问题？


    ## 躯体练习：手放心口


    琳达·格雷厄姆（Linda Graham），婚姻与家庭治疗师。*《回弹：重新训练大脑以获得最大韧性和幸福感》。*


    “手放心口”练习是一种强大、简单且快速的方法，能让你平静下来并恢复专注。它也是一种从评判者切换到学习者的具体身体实践，因此我称之为“学习者练习”。它之所以有效，是因为它通过释放平静的荷尔蒙催产素来抵消压力荷尔蒙皮质醇。这有助于你发展出一种平静安详的状态。我经常做这个练习。我甚至会在会议上做，因为这是一个非常正常、日常的手势，没有人会注意到！


    具体做法如下：


    1. 将手放在心口，感受自己触碰的温暖。你可能会注意到温暖感从手边蔓延开来。你也可能会注意到随着吸气和呼气，胸部的起伏。

    2. 通过鼻子缓慢而深地呼吸，将气吸入心口中心。

    3. 回想一个与无条件爱你、让你感到完全安全的人在一起的经历（宠物也算！）。

    4. 当你回想起这段经历时，注意身体中任何积极、平静的感受。

    5. 当你与这些感受的连接稳定后，继续深而慢的呼吸，同时放下那个画面，只是沐浴在平静中约 30 秒。


    ### 学习者反思


    对于更稳定地生活在学习者心态中的可能性，我有什么想法或感受？关于这个想法，我有哪些问题？这可能对我有什么影响和可能性？


    ## 如何才能（大部分）生活在学习者心态中？


    如果你大部分时间都生活在学习者心态中，你的生活会有何不同？在这本工作手册的开头，我请你关注某个经常用言语或行动触发你评判者心态的人。当你选择那个触发情境来处理时，我问过你，如果你能改变自己的反应，你的生活会变得多好。我们稍后会回到那里，但首先让我们花点时间思考，主要生活在学习者心态中会如何在总体上改善你的生活。我鼓励你大胆想象你能为自己设想的所有快乐、爱和成功！


    *如果我能把大部分工作时间都花在学习者心态上，会有什么可能？* 如果我大部分时间都处于学习者心态，我的工作关系会如何改善？


