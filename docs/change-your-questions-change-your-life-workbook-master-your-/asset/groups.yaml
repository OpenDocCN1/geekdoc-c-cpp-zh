  mdcn: "\n*当这一切发生时，我的评判者心态对自己说了些什么？*\n\n我记得我对自己发誓，我永远会知道答案——或者至少永远不会承认自己不知道。我意识到，这可能就是让我走上“答案先生”之路的原因。\n\
    \n*当这一切发生时，我的评判者心态对他人和/或生活说了些什么？*\n\n我的评判者心态告诉我，只有当你拥有他们想要的答案时，人们才会关心你；不知道答案是危险的、不安全的，而且看起来很糟。\n\
    \n*现在，作为一个成年人，什么样的情况、行为、话语或人容易触发我的评判者反应？当我“进入评判者状态”时，我会想什么、说什么、做什么——或不去说什么或做什么？*\n\
    \n当我自己或别人不知道某件事，或者本该知道却不知道时，我往往会生气。当人们不打转向灯或不正确地并线时，我会抓狂，因为我的评判者心态认为他们应该更懂。\n\n\
    当我没有答案时，我的评判者心态会让我躲起来，有时我想举起双手放弃。我努力解决问题，而当别人不这样做时，我就被触发。我对别人进入评判者状态，但无论我对查尔斯或我妻子格蕾丝有多生气，都比不上我对自己生气的程度。我讨厌自己不知道怎么解决问题或找不到答案。\n\
    \n我通常会将哪些情绪和身体感受与我的评判者体验联系在一起（当我对自己和他人进行评判时）？\n\n当我进入评判者状态时，我会生气。我可能很刻薄。我说话语气尖锐，或者打断别人，截断他们的话。我的评判者心态一点也不微妙！我的评判者心态声音很大，而且，我很遗憾地说，还很骄傲。\n\
    \n前几天，当我感觉自己对查尔斯进入评判者状态时，我能感觉到手指握成了拳头。我感到紧张，想揍他。\n\n我对自己形成了哪些评判者信念？评判者心态对我自己说了些什么？\n\
    \n我的评判者心态认为，除非我有答案并能解决问题，否则我一文不值。我的评判者心态认为，是我的答案让我值得被爱；如果我没有答案，格蕾丝就不会再尊重我或想和我在一起。\n\
    \n我现在对他人（或“类型”的人）和一般生活持有哪些评判者信念？它们如何影响并限制我的生活？\n\n我有一个评判者信念：问很多问题的人不聪明，对解决方案没有贡献。虽然拥有答案过去帮了我很多，但我能看出，认为提问不聪明的想法正在阻碍我成为一名好的领导者和丈夫。唉。\n\
    \n反思我刚写下的内容，我对评判者心态及其对我的影响有什么观察？我把哪些信念和模式与评判者心态联系在一起？\n\n### 我在假设什么？\n\n再次将注意力转向你的心态转变，以及你正在努力改变其反应的评判者触发点。你对自己、对方以及情境本身做了哪些假设？在下方空白处记录你的反思。\n\
