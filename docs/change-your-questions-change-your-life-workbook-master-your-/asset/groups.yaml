  - '[PAGE 105]


    # More Ways to Learn


    Now that you are nearing the end of this learning journey, I encourage you to
    take advantage of some other ways to keep your momentum going. Here are a few
    suggestions for how to stay committed to Learner Living:


    +   1. Practice Makes Perfect!


    First, know that you can always work through this book again from the beginning,
    as many times as you want. Choose another annoying situation with the same person,
    or a new person and new situation entirely and do a new Mindset Challenge. For
    example, if you picked a situation and person at work the first time around, you
    could select a person and situation from your personal life to work with. You
    could even review your list of annoying situations in chapter 1, and choose another
    one to work through.


    +   2. Find a Learning Buddy!


    Some people learn better when we have a learning buddy to share our journey. Find
    someone who will work through their own Mindset Challenge so you can compare experiences,
    reinforce Question Thinking skills, and support each other. You could ask a colleague
    at work, a friend, or even a spouse or partner.


    +   a. Discuss and share your Switching stories.

    +   b. Tell each other about moments when you fell into the Judger Pit and what
    you did about it.

    +   c. Celebrate discoveries you made about yourselves and the new awareness you
    are each building.

    +   d. Create a “Learner Alliance” and check in regularly to support each other
    using QT Tools, like the Choice Map, Switching questions, and Q-Prep.'
  - '[PAGE 106]


    <!-- no content -->'
  - '[PAGE 107]


    # What Now?


    While what you’ve accomplished is all good news, I have even better news to share.
    Most of the work you’ve done here related to the Mindset Challenge scenario you
    chose to work on. Happily, the skills you’ve learned can also be applied to any
    situation in your life where Judger triggers come into play. That means everywhere!


    On the next two pages, you’ll find a new blank Choice Map to fill out (Figure
    9). Now that you have experienced the full arc of the Mindset Challenge, you’ve
    learned a lot about yourself, your Learner, and your Judger. In filling out this
    Choice Map, you will be creating a powerful reference tool for yourself—a road
    map that will help you identify your mindsets and Switch.


    I invite you to reflect on the Judger Mindset questions you’ve been asking yourself
    most frequently in your life and write those in the Judger Mindset path thought
    bubbles. Feel free to look through all the Judger questions from the Choice Map
    and the exercises you’ve done in this workbook to find the questions that tend
    to continually come up for you.


    Also reflect on Learner Mindset questions that you use frequently and write those
    in the Learner thought bubbles. You might have some new Learner questions since
    you’ve completed this workbook. These are questions that will help you to advance
    your Learner Mindset thinking or help you Switch when you notice you are in Judger.


    When you’ve completed the exercise, you will have a personalized map of the Learner
    Mindset and Judger Mindsets questions that come up for you most. With those Learner
    questions and your new self-awareness, oh, the places you’ll go!'
