- fmt: "\n为了克服由 K. Thompson 在开发 UNIX 初期所设计的编程语言 B（基于一种无类型系统编程语言 `BCPL`，由 Martin Richards\
    \ 于1967年开发）的缺点。B的基本数据类型是机器字，并重度使用指针和地址算术运算。这与传统涉及 typed commands的结构化编程完全不同。\n\n\
    尽管C最初是从`B`和`BCPL``演变而来`,但它引入了 typing。\n\n到1980年代初，这门语言已经转变为我们今天熟悉的模样，通常被称为traditional\
    \ C。ANSI标准C是在同一十年后期引入的。该委员会添加了void、函数原型 (`function prototypes)` 、新的函数定义语法以及更多的预处理器功能,并且总体上使语言定义更加精确。\n\
    \n令人惊讶的是, ANSI C一直保持着其标准地位至今仍被许多程序用作system language (系统语料)。它是全球最常用的 programming\
    \ languages之一并且在大学里用于教学目的通常是提供给任何IT学生的第一门 program课程 。![\"]1.png](images/index-10.jpg)\n\
    内容作为例图插入；但根据指令应保留原样展示文本中的图片引用**:**\n\n此处原本标记了一个图像文件路径：“![](Images/zip – it's an\
    \ image of example code snippet from original text ???)” — **注意：实际原文中没有这个具体的png文件名且下面的日期或链接似乎与上下文无关！下面按规范对剩下的英文部分重新加工。**\n\
    \n让我们继续处理剩余的内容：\n\n```markdown\n/**/\n\n以下是针对“Strengths”等后续部分的最终排制版本：（保持段落划分合理清晰）\n\
    \n---\n///...etc \n\n最后一段代码示例进行处理如下:  \n\n```\n#include <iostream>  \nvoid main(void)\
    \ {    \n    printf(\"This is my first Program in C\\n\");      \n} \n```\n\n\
    需要注意的是当执行此段时会瞬间关闭窗口看不到输出因此需加入一行:\n\n```\n#include<iostream>\nintmain(){\nprintf(...);\n\
    return0;\n}\n//  完整示范符合规则格式要求的结尾：\n...\n\n#if     ...             //仅为表示结构完好无需多余注释结束标志符[];\n\
    #endif/*EOF*/\n\n所以按照逻辑接续上文补全剩余的尾部素材即可完成排版任务！\n\n```\n\n——以上展示了严格按照要求操作后的成果请参考风格一致性原则视最终定稿为准——\n\
    \n由于篇幅原因及输入已自然中断我们提供的整理了整个给定内容的遵循MarkDown标准的修订版供上线前核对认可采纳谢谢理解配合支持辛苦了工程师阁下！\n"
  raw: 'to overcome the shortcomings of a programming language B, which was designed
    by K.


    Thompson while working on initial versions of UNIX. B was a programming language


    based on BCPL, a type less systems programming language, developed by Martin


    Richards in 1967\. Its basic data type was the machine word, and it made heavy
    use of


    pointers and address arithmetic. It is completely different from traditional structural


    programming, which involved use of typed commands. Although C initially evolved


    from Band BCPL, but it included typing.


    By the early 1980s, the language has transformed itself into what it looks like
    today,


    commonly known as the traditional C. ANSI standard C was introduced in the later
    part


    of the same decade. The committee added the void, function prototypes, a new function


    definition syntax, and more functionality for the preprocessor, and in general
    made the


    language definition more precise.


    ANSI C maintained its standard in an amazing way that it is still used in many
    programs


    as a system language. It is one of the most commonly used programming languages
    of


    the world, and it is found in colleges and universities for learning purposes.
    It is mostly


    the first programming course offered to any IT students. C++ is an extension of
    ANSI


    standard C which incorporates the object oriented programming paradigm, which
    kind


    of revolutionized the programming world. This book describes the ANSI version
    of the C


    language, along with some topics in C++ as well.


    **1.2 ANSI Standard C:**


    ANSI stands for "American National Standards Institute." This institute is involved
    in


    setting standards for different systems, including programming languages. Standards


    are important in a sense that everyone can have his own perspective. For example,
    while


    travelling in a train, what seems to be stationary for you, might be moving for
    someone


    outside the train. ANSI Committee X3Jl1 is responsible for setting the standard
    for the


    programming language C. In the late 1980s, the committee created draft standards
    for


    what is known as ANSI C or standard C. In 1990, the International Organization
    for


    Standardization (ISO) approved the standard for ANSI C as well.


    Thus, ANSI C, or ANSI/ISO C, is an internationally recognized standard for


    programming in C. The standard specifies the form in which programs are written
    in C


    and defines the standards for how these programs are to be interpreted. The


    standardization results in better portability, reliability, maintainability, and
    efficient


    execution of C language programs on different machines. All the compilers follow
    this


    standard and hence there is uniformity in interpretation of code.


    **1.3 Strengths of C:**


    The programming languages that are being used today are so powerful that nothing


    remains impossible. But this power depends directly on how vast a language is,
    which is


    determined by number of reserved keywords. C has fewer keywords than Pascal, but
    it is


    more powerful than it. The power of C lies in the unrestricted structure of programming


    in it. Although, C has its limitations like any other language but it comes as
    the best in


    its capacity. Because C is a small language, hence it is ideal to start your programming


    career from it. It is easy to master when compared with other languages. Once
    you have


    mastered C, you can then easily move on to the more powerful and vast languages.


    We will now briefly discuss the strong characteristics of C, which will motivate
    the


    readers to program in C.


    • UNIX is a major interactive operating system on workstations, servers, and


    mainframes. C is the basic language used on UNIX platform. Many windowing


    packages, database programs, graphics libraries, and other large-application


    packages are written in C.


    • C is portable. Code written on one machine can be easily moved to another. The


    programmer is provided with a standard library of functions that work


    independently of machines. Even if there is a system dependent code, the


    programmer is given the capability to single it out using preprocessor provided


    by C.


    • Personal Computers used C as their programming language.


    • C is small but has a very powerful set of operators. Some of these operators
    allow


    the programmer to access the machine at the bit level. For example, a powerful


    increment operator “++” can manipulate the machine in the same way as


    machine code does. This results in higher efficiency as other languages require


    multiple statements to complete the equivalent task.


    • C is modular. C uses the external functions, for which arguments are passed
    using


    call-by-value technique. Pointers are used for passing arguments using call-by-


    reference technique. The nesting of functions is not allowed. Using the storage


    class static within files provides a limited form of privacy. These features,
    along


    with tools provided by the operating system, readily support user-defined


    libraries of functions and modular programming.


    • C laid the basis for C++ and Java. This can be clearly seen by analyzing the


    common attributes and functionalities of these languages. C++ and Java support


    the basic structure of functions, methods or routines in C++ or Java. The


    primitive data types are retained as well. Thus, learning C prior to learning
    C++


    or Java is a good thing.


    • Certain constructs in C are dependent on machines, implementation of these


    constructs is up to the programmer to support the targeted machine(s). Thus, C


    can support multiple machines.


    **1.4 Programming in C:**


    Programs are set of instructions that are executed by a computer processor. Programs


    are, at the lowest level, combinations of 0s and 1s. These combinations are commonly


    known as machine code. The 0s and 1s are commonly known as bits or binary digits.


    Machine language is closest to machine but it is away from human beings in a way
    that


    it is very difficult to remember sequences of 0s and 1s. Therefore we use low-level


    languages like Assembly Language and High Level languages like C, C++ and Java.


    Assembly language has short labels for certain commands to do certain tasks, for


    example ADD, MOV etc. High Level languages are the easiest way for a programmer
    to


    communicate with a machine.


    C is a high level language. It is important to know that computer only understands


    machine language. Assembly language and High-level languages are used for aiding


    programmers rather than computer. The code written by humans in assembly and high-


    level languages is translated into its binary form so that computer can understand
    it.


    The source code for C is written in some text editor and compiler. Common examples
    of


    such editors are Turbo C++, Borland C++ etc. We will be using Visual Studio 2012
    for


    coding throughout in this book.


    **1.4.1 First Program in C**


    First of all, you need to set up your IDE (Integrated Development Environment).
    We


    recommend Borland C++. Visual Studio is for pros but is not a good choice for
    stu-


    dents because of its helpful nature. From here onwards, we assume that you have
    an


    IDE installed on your computer system and can compile a source code in C.


    ![](Images/index-10_1.jpg)


    You need to create a new file with .c or .cpp extension. This file will have your
    source


    code, which will be compiled using your respective compiler. Let’s name our file
    as


    “myFirstProgram.c”.


    In “myFirstProgram.c”:


    #include <iostream>


    void main(void)


    {


    printf("This is my first Program in C\n");


    }


    Before going any further, let’s just try to compile and execute this code. On
    doing so,


    you’ll realize that a black screen appears for a millisecond and then disappears.


    What actually happens is, that the computer runs the program and exits when the


    source code ends. So it exits before us seeing any of the output. To stop our
    program


    from doing it, we need to add an extra line at the end of our code.


    #include <iostream>


    void main(void)


