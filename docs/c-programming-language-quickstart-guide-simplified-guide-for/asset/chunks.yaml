  trans: "\n\n![](img/index-89_1.jpg)\n\n## 第 8 章：二叉树\n\n树是元素（通常称为节点）的有限集合。每棵树都有一个唯一的起始节点，称为根节点，其余节点则是该根节点的互不相交的子树的集合。每个节点都会记录其父节点和/或子节点的信息，以便能够进行遍历。没有子节点的节点被称为叶结点或终端结点。\n\
    \n二叉树是一种每个结点的子结点数量最多为两个的树结构。对于其中的每一个元素来说它具备两个可能的亚元:分别叫 `左`孩子与`右`孩子当某一元素缺少其中任一方向的孩子时相应位置会被赋予\
    \ NULL 以表示不存在...注意除非另有指定(即它们可以为空值)以外的情形下每条链接都必须指向一个新的对象.\n\n用来在二叉堆里展示单个条目的通用形式看上去像:\n\
    \n```\nstructnode\n{\n    charvalue;\n    Node *left,*right ;\n};\n```\n\n无论是就组织预先排序数据的存储速度还是快速提取这些已存数据而言证明出是非常的有用从而造成整体上关于搜索及分类执行效率方面带来了巨大的改进……\n\
    \n**8.1  组成**\n\n在任何给定的二叉树内部我们可以找到保存着资料以及连接至最上方且不超过两后继游走的最大数使的两者彼此联动的母节(=叶子);这存在于那些延续下来的复件之间的关联性定义了为什么恰好架构起处理已经整理完毕的数据呈现高效方式的套组们之所以成为可能的原因所在\
    \ 。\n\n一般而言按照刚刚提到的两大简单章程左右两条不同演化路径行进的作用编队可实现整体的表现提升跨越各个横纵面层面达成优化目标 :处于整个顶蓬左侧远端一定位于低数值范围内显示最小登记量而同样道理右侧边的标本反而是呈现出峰值型数字条目根据凡是有需求最低值的操作者所需只需一贯向下通行直至到达触发点同时观测当前数据库是否超过搜寻的量进而决定往下朝向更深处推进相反的状况则迫使转向另一分支沿途前进抵达终点算子完成任务检索而没有必要按顺序扫描全体数据集从而使途中的处理器循环大幅度节约下来!\n\
    \n另外一条值得强调的重要侧面是由其实例别附加对等更新孪生新后辈来在每个部属下面发起单独分叉启始开去的有效途径借助结合了适当条件检测的回溯模式规范保留了贯穿全程的全部流程层级有序性无论遇到的原始树木维度尺寸多大而是在修改变动命令下达之前的时刻被发动布局最终把摘采之新鲜物正确放置到或许此刻已然深藏于某些混凝土级别层次的层序结构中准确自动所需求的位段;整个过程完成之后控制权宝座会神奇地返回给常规应用程序作业流当中去……\
