  raw: 'the null character \0.


    Although, char constants and strings seem closely related but they are not same.
    For


    example, "a" and ''a'' are not the same. “a” has two characters one of which is
    ‘a’ and the


    other one is \0.


    A string is considered by the compiler as a pointer. Its value is the base address
    of the


    string. Consider the following code:


    char


    *pointer


    =


    "abc";


    printf(“%s %s\n”, pointer, pointer + 1);


    The pointer variable is assigned the starting value of string. The first string
    is printed


    starting from ‘a’. The second string moves its address by one unit (char is of
    1 byte,


    usually) and hence starts from ‘b’. So, the output for above lines of code will
    be:


    abc bc


    As strings can be considered as pointers, statements like *(“abc”+2) and “abs”
    [2] are


    legal in compilers.


    Let us now see an example which uses a char array as well as a string. You can
    see the


    convenience in using strings:


    void main(void)


    {


    char *s = "aString";


    char characters[10] = { ''c'', ''h'', ''a'', ''r'', ''a'', ''c'', ''t'', ''e'',
    ''r'', ''s''};


    for(int i=0;i<10;i++)


    printf("%c", characters[i]);


    printf("\n%s\n", s);


    system("pause");


    }


    For technical reasons, it is better not to print null characters. Strings do not
    print null


    character unless we use pointer to access the last character of the string.


    Now, we write a program to count number of words in a string to get better


    understanding of strings. The program uses a macro, isspace() which returns true
    in a


    case when the specified character is a space. It returns false otherwise.


    int numberOfWords(const char *str)


    {


    int count = 0;


    while (*str!= ''\0'')


    {


    while (isspace(*str))


    {


    ++str;


    if(*str != ''\0'')


    {


    count++;


    }


    }


    }


    return ++count;


    }


    A string or pointer to character array is passed as an argument. We consider spaces
    as


    word separator. We increment the word count variable for all the words separated
    by


    spaces. We increment it again at the again, so that the last word is also counted.


    ANSI C provides the programmer with pre-defined functions to handle strings. This
    sec-


    tion demonstrates how to use some of these functions. The function prototypes
    for


    string-handling functions are given in the standard header file string.h. These
    proto-


    types use character pointers and strings for certain parameters. Remember, these
    can be


    used interchangeably.


    **Function Name**


    **Description**


    char *strcat(char *s1, canst char *s2);


    Concatenates second string to the end of first


    string and returns it.


    int strcmp(const char *s1, const char *s2); Compares two strings. It returns a
    value less


    than 0 if first string is less than second, a value


    greater than 0 if first string is greater than


    second and returns 0 if both are equal.


    char *strcpy(char *s1, const char *s2);


    String s1 is overwritten by String s2 and s1 is


    returned.


    size_t strlen(const char *s)


    Returns number of characters in string s,


    excluding the ending character.


    These functions can be written by programmers as well. It is recommended to use
    these


    as they are more efficient because they use register class variables.


    **6.4 2-D Arrays**


    Even though array elements are stored contiguously one after the other, it is
    usually


    convenient to think of a two-dimensional array as a table of elements with rows
    and


    columns. This helps in better understanding of 2-Dimensional arrays. For example,
    to


    declare an array of twenty elements with five rows and 4 columns, we use the following


    statement:


    int Two_D[5][4];


    Nested loops are usually used for dealing with 2-Dimensional arrays.


    These elements can be represented as:


    Two_D[0][0] Two_D[0][1]


    Two_D[0][2]


    Two_D[0][3]


    Two_D[1][0]


    Two_D[1][1]


    Two_D[1][2]


    Two_D[1][3]


    Two_D[2][0]


    Two_D[2][1]


    Two_D[2][2]


    Two_D[2][3]


    Two_D[3][0]


    Two_D[3][1]


    Two_D[3][2]


    Two_D[3][3]


    Two_D[4][0]


    Two_D[4][1]


    Two_D[4][2]


    Two_D[4][3]


    **6.5 3-D Arrays**


    Arrays of dimension higher than two work in a similar fashion. Let us describe
    how


    three-dimensional arrays work. If we declare


    Int Three_D[5][3][2];


    The compiler allocates 5*3*2 memory address for integer type. The base address
    is


    Three_D[0][0][0].


    Here is a function that adds the elements of a three dimensional array and returns
    the


    total.


    int sum(int Three_D[5][3][2])


    {


    int i, j, k, sum = 0;


    for (i = 0; i < 7; ++i)


    for (j = 0; j < 9; ++j)


    for (k = 0; k < 2; ++k)


    sum += Three_D[i][j][k];


    return sum;


    **}**


    ![](Images/index-76_1.jpg)


    ## Chapter 7: Structures


    C is an easily extensible language. It can be extended using header files and
    standard


    libraries to use certain functions and macros. It can also be extended by defining
    data


    types that are constructed from the fundamental types such as an array which is
    a group


    of default data type variables.


    The structure type is used to represent heterogeneous data. A structure has components,


    called members. Structures are designed for programmer’s ease so that they can
    define a


    data type of their own which may contain more than one members. Each member can
    be


    either a default data type or another structure. Because the components of a structure


    can be of various types, the programmer can design them as per his requirements.


    **7.1 Declaration**


    The structures allow programmer to integrate different type of variables together.


    Arrays are used for storing variables of same type. As a simple example, let us
    define a


    structure that describes a student. A student has various attributes of different
    types


    such as Name, Course, Section, CGPA and ID. A student can be defined as a structure
    in


    C. We can declare the structure type for student using the keyword struct as follows:


    struct Student


    {


    char *Name;


    int Course, ID;


    char Section;


    double CGPA:


    } ;


    This declaration creates the derived data type struct student. It is a user defined
    data


    type. The structures one defined can be used to define identifiers of this user-defined


    type. The tag name or identifier along with keyword struct is used to declare
    variables of


    type student:


    Struct Student s1, s2, s3;


    The above declarations for struct variables allocates storage for the identifiers,
    which


    now represent a Student. An alternative way to declare these identifiers is as
    follows:


    struct Student


    {


    char *Name;


    int Course, ID;


    char Section;


    double CGPA:


    } s1, s2, s3;


    Another way of declaration, which is highly recommended as it shortens the declaration


    of identifiers of the structure, is as follows:


    typedef struct


    {


    char *Name;


    int Course, ID;


    char Section;


    double CGPA:


    } Student;


    **7.2 Memory Allocation**


    Although memory is allocated to these variables at the time of declaration but
    these


    variables have been assigned nothing. No student type variable has details saved
    in it.


    Here’s how each component of a struct type variable is initialized:


    s1.Name = “R Khan”


    s1.Course = 18;


    s1.ID = 786;


    s1.Section = ‘A’;


    s1.CGPA = 3.74;


    **7.3 Member Access Operators**


    We can access a member of a struct variable in two ways. The above example uses
    the


    member access operator “.”. We will now give further examples of its use and introduce


    the other member access operator “->”. Both operators are used for same purpose.
    The


    difference lies in the caller. The dot operator is used by a structure variable
    while arrow


    is used by a pointer to structure variable.


    typedef struct


    {


    char *Name;


    int Course, ID;


    char Section;


    double CGPA;


    }Student;


    void printUsingPointer(Student *s)


    {


    printf("%s %d %d %c %f\n", s -> Name, s -> ID, s -> Course, s -> Section, s ->
    CGPA);


    }


    void main(void)


    {


    Student s1,s2;


    s1.Name = "R Khan";


    s1.Course = 18;


    s1.ID = 786;


    s1.Section = ''A'';


    s1.CGPA = 3.74;


    s2.Name = "Ali Khan";


    s2.Course = 18;


    s2.ID = 890;


    s2.Section = ''A'';


    s2.CGPA = 3.14;


    printf("%s %d %d %c %f\n", s1.Name, s1.ID, s1.Course, s1.Section, s1.CGPA);


    printUsingPointer(&s2);


    system("pause");


    }


