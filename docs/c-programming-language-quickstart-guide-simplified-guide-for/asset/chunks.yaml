  trans: "\n\n为了克服由 K. Thompson 在开发 UNIX 初期所设计的编程语言 B（基于一种无类型系统编程语言 `BCPL`，由 Martin\
    \ Richards 于 1967 年开发）的缺点。B 的基本数据类型是机器字，并重度使用指针和地址算术运算。这与传统涉及结构化命令的类型化编程完全不同。\n\
    \n尽管 C 最初是从`B`和`BCPL``演变而来`,但它引入了类型系统。\n\n到 1980 年代初，这门语言已经转变为我们今天熟悉的模样，通常被称为传统\
    \ C。ANSI 标准 C 是在同一十年后期引入的。该委员会添加了 void、函数原型 (`function prototypes`) 、新的函数定义语法以及更多的预处理器功能,并且总体上使语言定义更加精确。\n\
    \n令人惊讶的是, ANSI C 一直保持着其标准地位至今仍被许多程序用作**系统语料** (system language)。它是全球最常用的 **programming\
