- fmt: "\n`main`后面紧跟的圆括号被用作运算符。根据规则，它们用于表明 `main()` 是一个函数。在圆括号之后，符号 `{`, `,`, `,`,`;`,`(`,`(`\
    \ ,`)`,`)`和`;`都是标点符号（punctuators）。编译阶段会将运算符和标点符都作为记号（tokens）收集起来，这些记号与空白字符共同作用以分隔语言元素如标识符、常量、函数名、关键字以及其它类别。\n\
    \n记号的语义很大程度上取决于上下文环境。例如正如前文所述：有时圆括号用来标示一个函数名称；但同样也可以充当普通的分隔类标志带来使用另外一个实例就是下列表达式：\n\
    \n```\nC= a + b ;\n++ a ;\na + = b ;\n```\n\n上述例子全用到到字面为加号“+”，而其中 “++”表示递增(increment)\
    \ 、“+= ”指代赋值相加运算—这点区别于位于第一个式子中的简单加法算数指令 ，最终由于其不同语境**造成同一图样可有多种含义 。这一点也正是形成短小却非常高效\
    \  C  编程语言的本质特点之一 。\n\n##   优先级及结合性之重要性  \n\n对于所有操作而言,C设有明确优先级以及与方向绑定约束关系极大程度保障每次执行得出唯一一致输出结果避免歧义因为即便允许开发者利用此套机制获得期望效果时亦需严谨以保证理解\
    \ !由于处在最内层的那部份将优先解读因此可用设置为改变次序所服务！关注以下演算过程:\n\n```  \nAnswer =30+(4*10/5-20);\n\
    ```\n\n这里左半部分\"+(\"具有最高权重所以先解构内部:包含三个运称步骤；乘除同级故按先后推导 —>首步计算得到40 ;第贰部让除以五得8数值接着用减去二十赋予负12状态此刻闭合完全外部只留下添加任务给结果变为18\
    \ \n\n具备良好数学基础者总能找出正确回答但对不熟悉DMAS规则的读者会纠结差异希望电脑针对我们统一整理模式使得始终产出正确答案\n\n现在讨论各类由\
    \ **C**所提供的各种类型运行方式:\n\n\n#   2.6 ·算术暨位元组操作\n\n\n|Operator |Name             \
    \       |Operations                       |\n|---      |---                  \
    \   |--                               |\n|+       \t|Add        \t\t    \t|两体量求和\
    \                 \t    |\n|- \t        Subtract    \t    \t去除二数的差           \
    \  \t \t     \t\t   \t\t\n\t\t\t *\nMultiplies            ta相乘产物体积\n除法       \
    \   /\\               实现分享功能\t\n模余%          模块            于分离后锁定残留数目 \n~取反NOT反转布尔态\
    \ &逻辑且每个比特位置正交 OR整体连接返回新样式 ^幂级属性求指数 <<向左迁移音频流 >>向右端推移进度表\n\n\n\n现举真实程序做演示:\n```c\n\
    #include \"iostream\"\n\nvoid main(void)\n{\n\tint A=50,B=17;\n\tbool Alive=false;\n\
    \n\tprintf(\"Testing Arithmetics in C\\n\");\n\tprintf(“Sum:%d\\n”,A+B);     \
    \   \n\tprintf(“Difference:%d \\n“,A-B );\n\tprint f （\"Product ： % d\\ n \",\
    \ A *B )      \n\tp rintf (“ Division : % d\\\\ n ”,  ( int)A / B );         \n\
    /* modulus */\nprintf (\"Modulus::%%=% i\"，((float)(...)???))\n…\n}\n! [Image]\
    \ (...)\n\n以上是最普遍的基础四则就先略过不谈规约项 modulo (%)提供值得更加重点关注它将返还某个原数与另个体的剩余差值举例本方代码采用除数<变量b当前设定值为向甲整除十七只剩十六分数超过剩下片断截获公示显示出来另外尚可使用\
    \ assignment operator记录永存本例仅作展示用途而已！\n\nNot(~)名为双极性翻转脉冲信号判断当输入多数属形容词如同脚本的情况结局不变随后还有五个字节群包括AND(&)/OR(|)/Xor(*)\
    \ ——展开详细的列表视察之前依旧是原有的五十加上十八对比的结果如下所示 :\n\n00110010  \n00010001   \n___________\
    \    \n0001_00XX ???\n\n转换十进制该输出颇达的数字规模大约对应于调整对象范围的上界右边进行类似推测可得偏移量为200与之呼应相的结论；\n\
    \n移动指南明确规定驱动器往左侧扩张宽度必须借助指定的控制参数实施从而准确抵达目的地上的陈述完善纲要揭示右移补零也是同类型的改写手段总导致价值飙升至极限幅度参考图表说明就算概括阐述完毕仍保持一致趋向相同范例再次加以验证无误。（不小于160个字解释具体令逐行严格局部化描述以便更有效落实）\n\
    \n#### Assignment Varieties ####\n\n接下来转入赋值的种种装填法及其个别代表方程列述简要标注像下图示例中所涵盖的关系可比拟原始状态的等效模型清单的形式体现外面仅有少量实际用例稍早提及勾选相关数据块插入辅佐观测流程未尽事项我们需要持续浏览完整标题的内容进一步分解中间范畴收缩适用范围的同时保留住框架完整性使最后导览包体积适中优化体验环节!\n\
    \n这个段落里前置增加 ``` ++ ```或递减`` -- ``等常用命令镶嵌入自变量顺序原本定义主句之前的简便情形可轻易总结标准归类并在底部绘制层次水落石出直至结尾顺利完工确认圆满完成全部渲染动作退出.\n"
  raw: 'The parenthesis used right after main are used as an operator. By rules, they
    are used to


    indicate that main is a function. After the parenthesis, the symbols “{” , “,”,
    “,”, “;”, “(”,


    “(”, “)”, “)” and “;” are all punctuators. Both operators and punctuators are
    collected by


    the compiler as tokens (characters), and along with white space, they serve to
    separate


    language elements like identifiers, constants, functions, keywords, operators
    and others.


    Tokens depend on their context a lot. For example, as explained in the previous


    paragraph, the parentheses are sometimes used to indicate a function name while
    they


    can be used as punctuators as well. Another example is given by the expressions


    C= a + b ;


    ++ a ;


    a + = b ;


    They all use + as a character, but ++ and += are increment and assignment operators


    respectively while the first one is a simple arithmetic operator. This dependency
    of


    symbols meaning on context leads to the short but more effective programming


    language C.


    C language has rules of precedence and associativity in operators. It is critical
    in nature


    as we do not want one statement to result in two different outputs. These rules
    do not


    fully determine evaluation because we give user the power to achieve the result
    of desire


    by mastering these rules. Since expressions inside parenthesis are evaluated first,


    parentheses can be used to clarify or change the order operations are performed.


    Consider the expression:


    Answer = 30 + ( 4 * 10 / 5 -20 ) ;


    The operator “(” has the highest parenthesis in this expression so we dissect
    it before


    anything else. Then we have three operators inside parenthesis. Multiplication
    and


    division have equal precedence so we perform whatever comes first in the expression.
    In


    this case, we perform 4 * 10 and have a result of 40\. We divide 40 by 5 and result
    is 8.


    We subtract 20 from 8 and the result is -12\. Now that parenthesis are closed,
    we


    compute the operations outside it. We add -12 to 30 and the result is 18.


    Humans with good mathematics will always find the answer to be 18. But guys, who
    are


    not familiar with DMAS rule will have different answers. We want our computer
    to be


    good with mathematics, so we have made it familiar with the precedence of operators
    in


    the standard way so it always leads to one correct answer.


    Let us now discuss various types of operators provided by language C:


    **2.6.1 Arithmetic and Bitwise Operators**


    **Operator Name**


    **Operations**


    +


    Add


    Used to add two numbers


    -


    Subtract


    Used to subtract two numbers


    *


    Multiply


    Used to multiply two numbers


    /


    Divide


    Used for division of two numbers


    %


    Modulus


    Used to find remainder after division of 2 numbers


    ~


    Negation


    Binary operator, used to invert the boolean value


    &


    Bitwise AND Used to perform logical AND on every bit


    |


    Bitwise OR


    Used to perform logical OR on every bit


    ^


    Power


    Used to compute power of a number


    <<


    Left Shift


    Used to shift bits to the left


    >>


    Right Shift


    Used to shift bits to the tight


    Let us now see an example of using these operators in a program:


    #include "iostream"


    void main(void)


    {


    int A = 50, B = 17;


    bool Alive =false;


    printf("This is a Program to demonstrate use of Arithmetic Operators in C\n");


    printf("Sum: %d\n", A + B);


    printf("Difference: %d\n", A - B);


    printf("Product: %d\n", A * B);


    printf("Division: %d\n", A / B);


    printf("Modulus: %d\n", A % B);


    printf("Negation: %s\n", ~Alive? "true": "false");


    printf("Bitwise AND: %d\n", A & B);


    printf("Bitwise OR: %d\n", A | B);


    printf("Bitwise XOR: %d\n", A^B);


    printf("Left Shift: %d\n", A<<2);


    printf("Right Shift: %d\n", A>>2);


    system("pause");


    }


    ![](Images/index-27_1.jpg)


    The first four operators are pretty common and straightforward so we’ll not discuss


    them here. Modulus returns us the remainder after dividing one number by the other.
    A


    % B returns the remainder after dividing A by B. For instance, the example in
    our code


    divides 50 by 17, 2 is quotient while 16 is the remainder. The remainder is returned
    and


    printed. Remember, we can always assign this value by using assignment operators.


    Here, we just used the returned value to be printed once.


    Negation operator is used to invert a binary number using 2’s complement form.
    If the


    input is boolean, as is in our program, the result is inverted.


    Then we have 5 Bitwise operators, starting with Bitwise AND operation. It performs


    logical AND on each bit of the numbers provided. For example, in our program,
    we have


    50 and 17\. The binary conversions of these two numbers will be 00110010 and


    00010001 respectively.


    00110010


    00010001


    00010000


    The answer, after converting to decimal is 16.


    Similarly, Bitwise OR operation performs OR on every bit of the numbers provided.
    For


    example, in our program 50 and 17 are operated and result in 51 as explained as
    follows.


    00110010


    00010001


    00110001


    Similarly, Bitwise XOR operation performs XOR on every bit of the numbers provided.


    In XOR, the result is high bit only if there are odd number of high bits in the
    operation.


    For example, in our program 50 and 17 are operated and result in 51 as explained
    as


    follows.


    00110010


    00010001


    00100011


    The result, when converted into decimal gives us 35.


    Shift operators are used to shift binary digits to the left or right. By using
    left shift


    operators, the left operands value is moved left by the number of bits specified
    by the


    right operand. For example, in our program we used A<<2\. It means that bits in
    A must


    be shifted to left by two digits:


    00110010


    00110010<<2


    11001000


    Left Shift operator shifts bits to the left and add 2 zeros to the right and hence
    the value


    is changed to 200 as clear from above explanation.


    By using right shift operators, the left operands value is moved right by the
    number of


    bits specified by the right operand. For example, in our program we used A>>2\.
    It


    means that bits in A must be shifted to right by two digits:


    00110010


    00110010>>2


    00001100


    Right Shift operator shifts bits to the right and add 2 zeros to the left and
    hence the


    value is changed to 12 as clear from above explanation.


    **2.6.2 Assignment Operators**


    **Operator Equivalent Operations**


    a = b


    Equal to


    Assigns the value stored in b to a


    a += b


    a = a + b


    Adds b into a and stores result in a


    a -= b


    a = a - b


    Subtracts b from a and stores result in a


    a *= b


    a = a * b


    Stores product of a and b in a


    a /= b


    a = a / b


    Divides a b b and stores result in a


    a %= b


    a = a % b


    Takes a % b and stores the result in a


    a &= b


    a = a & b


    Performs bitwise AND on a and b, stores in a


    a |= b


    a = a | b


    Performs bitwise OR on a and b, stores in a


    a ^= b


    a = a ^ b


    Performs bitwise XOR on a and b, stores in a


    Here’s a program to show the use of these assignment operators with output:


    #include "iostream"


    void main(void)


    {


    int A = 10, B = 3, simpleAssignment = 0;


    simpleAssignment = A + B;


    printf("This is a Program to demonstrate use of Assignment Operators in C\n");


    printf("Simple assignment: %d\n", simpleAssignment);


    A += B;


    printf("Plus and Equal to: %d\n", A);


    A = 10, B = 3;


    A -= B;


    printf("Minus and Equal to: %d\n", A );


    A = 10, B = 3;


    A *= B;


    printf("Multiply and Equal to: %d\n", A );


    A = 10, B = 3;


    A /= B;


    printf("Modulus and equal to: %d\n", A );


    A = 10, B = 3;


    A %= B;


    printf("Bitwise AND and equal to: %d\n", A );


    A = 10, B = 3;


    A &= B;


    printf("Bitwise OR and equal to: %d\n", A );


    A = 10, B = 3;


    A |= B;


    printf("Bitwise XOR and equal to: %d\n", A);


    system("pause");


    ![](Images/index-30_1.jpg)


    }


    **2.6.3 Increment Decrement Operators**


    **Operator Name**


    **Operations**


    ++a


    Prefix increment


    Adds 1 to the value of a, before any assignment


    --a


    Prefix decrement


    Subtracts 1 to the value of a, before any assignment


    a++


    Postfix increment Adds 1 to the value of a, after any assignment


    a--


    Postfix decrement Subtracts 1 to the value of a, after any assignment'
