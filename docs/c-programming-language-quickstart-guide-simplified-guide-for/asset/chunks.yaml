- fmt: "\nC语言是一种面向过程的语言，因此每个C程序都基于一个或多个函数。在任何C程序中，至少有一个名为`main()`的方法。`main()`函数是任何程序的入口点。\n\
    \n函数的理念源于将庞大且复杂的任务分解为更小、更简单的问题的需求。管理较小的任务总是更容易的。函数完全由程序员决定，但建议每个函数都有特定且唯一的职责。所有独立函数的集合解决基本问题。例如，在一个计算器应用程序中，应该为每种运算定义一个函数,以便于编码和调试。\n\
