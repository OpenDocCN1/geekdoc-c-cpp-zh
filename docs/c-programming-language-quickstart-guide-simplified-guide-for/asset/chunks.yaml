  raw: 'header files because programs become too complex and it’s better to handle
    them in


    smaller files with lesser complexity. We divide the functionality into different
    categories


    and write code and functions for each category in a separate file. In this way,
    it becomes


    easier to digest each smaller chunk of a code.


    A C program is a sequence of characters. This sequence of characters is transformed
    into


    object code by compiler. The object code is translated into a target language
    depending


    upon the machine. Target language, on most of the systems is the machine language
    that


    can be interrupted. The program must be correct in its syntax. The compiler takes
    each


    character as a token. Token is considered as the basic unit of vocabulary in the
    language.


    In ANSI C, there are six kinds of tokens: keywords, identifiers, constants, string


    constants, operators and punctuators. We will discuss each of these tokens in
    this


    chapter. The role of a compiler is to check if all the tokens can be translated
    into proper


    understandable strings according to the compiler requirements. Most compilers
    are very


    precise in their requirements.


    Computers are dumb. We, the humans have the capability to understand a line more


    efficiently if an extra punctuation mark is used in a sentence but computers on
    the other


    hand will not be able to understand a sentence if it has an extra punctuation
    mark called


    token, it is not familiar with. Hence, the programmer must be familiar with which


    tokens can be used and which cannot be.


    In the remaining part of this chapter, we will be covering the basic structure
    elements of


    any C program. Every large thing in the universe comprises of smaller components.


    These smaller components might not be that effective individually, but assembling
    them


    in a right way certainly leads to a greater success.


    The scenario mentioned above is true for the language C as well. C consists of
    individual


    components called Functions. Functions are considered as basic structural element
    in C


    programming. The Functions themselves comprise of smaller components like


    Variables, constants, operators and other functions as well. We will study Functions
    in


    detail in another chapter. In this chapter, we will discuss these individual components


    one by one.


    **2.2 Variables**


    A variable name, also known as an identifier, consists of a sequence of letters,
    digits, and


    underscores, but may not start with a digit. These variables are usually declared
    at the


    start of program but you can declare one anywhere in your program before using
    it. You


    can store values in these variables depending upon their data types and “vary”
    them at


    any stage of your program. Identifiers should be chosen to reflect their use in
    the


    program. In this way, they serve as documentation, making the program more readable.


    There is a code for everything we do in life. Similarly, we have rules for writing
    variable


    name in C. Variable name can be composed of uppercase and/or lowercase letters,
    digits


    and only one special character that is ‘_’. The first letter of a variable must
    be either a


    letter or an underscore. But, it is discouraged to start variable name with an
    underscore


    though it is legal because, variable name that starts with underscore can conflict
    with


    system names and compiler may complain. The length of a variable name has no


    restrictions. However, the first 31 characters of a variable are discriminated
    by the


    compiler. So, the first 31 letters of two variables in a program should be different
    by at


    least one character.


    Let us get to know the use of variables by quoting some practical applications.
    Here is a


    program to calculate sum of two numbers:


    #include <iostream>


    void main(void)


    {


    int firstNumber=10;


    int secondNumber=5;


    ![](Images/index-16_1.jpg)


    int sum=firstNumber+secondNumber;


    printf("This is a Program to demonstrate use of variables in C\n");


    printf("First number is: %d\n", firstNumber);


    printf("Second number is: %d\n", secondNumber);


    printf("Their sum is: %d\n", sum);


    system("pause");


    }


    The output for above program is as follows:


    Some of you might be wondering why use the variables here instead of just using
    the


    numbers. That would be easy but it will have limited use as well as a bad programming


    approach. Let us add a few more lines to the above code to prove these two points:


    #include <iostream>


    void main(void)


    {


    int firstNumber=10;


    int secondNumber=5;


    int sum=firstNumber+secondNumber;


    printf("This is a Program to demonstrate use of variables in C\n");


    printf("First number is: %d\n", firstNumber);


    printf("Second number is: %d\n", secondNumber);


    printf("Their sum is: %d\n", sum);


    firstNumber=3;


    secondNumber=4;


    sum=firstNumber+secondNumber;


    printf("First number is: %d\n", firstNumber);


    printf("Second number is: %d\n", secondNumber);


    ![](Images/index-17_1.jpg)


    printf("Their sum is: %d\n", sum);


    system("pause");


    }


    As you can see that the print statements are duplicated in the second code, but
    the


    values are changed by just changing the variables. So, we can use same code to
    get


    different output by just changing variables. This gives us a huge advantage. For
    example,


    consider a scenario that you have a list of 300 students with their obtained marks
    in a


    uniform C programming test. What would be the best way to represent total marks
    for


    this list? Would you recommend writing total marks with each entry? Absolutely
    not but


    just consider for a second that you do that and then you find out that total marks
    are 50


    instead of hundred. You are bound to make a change i each entry. To avoid all
    this, you


    could just assign a value to a variable and use that variable in each entry. This
    is what


    variables are actually used for. Variables are a critical component of any program.


    **2.3 Constants**


    A constant is something whose value does not change throughout the program


    execution. These are fixed for a purpose though. For example, using standard values
    for


    certain entities, for having not to type a long digit or value like 3.141517...
    or making the


    program easy to follow by mentioning all the constant values in one place.


    Let us just go through a C program using constants:


    #include <iostream>


    #define PI 3.14159265359


    void main(void)


    {


    int radius=10;


    float Area=PI*radius*radius;


    printf("This is a Program to demonstrate use of Constants in C\n");


    printf("Radius of circle is: %d\n", radius);


    printf("Area of circle is: %f\n", Area);


    ![](Images/index-18_1.jpg)


    system("pause");


    }


    We used preprocessor #define to declare a constant PI in this program. This is
    a flexible


    and recommended way to use constants in C. There is another way to use constants
    as


    well using the keyword ‘const’. Let us see how that works too:


    #include <iostream>


    void main(void)


    {


    int radius=10;


    const float PI=3.14159265359;


    float Area=PI*radius*radius;


    printf("This is a Program to demonstrate use of Constants in C\n");


    printf("Radius of circle is: %d\n", radius);


    printf("Area of circle is: %f\n", Area);


    system("pause");


    }


    **2.4 Keywords**


    Keywords are reserved words in any language. These words are already reserved
    for a


    particular functionality so programmers cannot use them. These keywords represent


    primitive data types, pre-built functions and other programming components.


    Here is a list of keywords in C, predefined by ANSI:


    **Keywords**


    **Functionality**


    auto


    Defines a local variable as having a local lifetime.


    break


    Passes control out of the compound statement.


    case


    Used to program a logic based decision on input through Switch.


    char


    Used to define a character type variable.


    const


    Makes variable value or pointer parameter unmodifiable.


    continue


    Passes control to the beginning of the loop.


    default


    Used in switch-case statements for defining default operation.


    do


    This keyword along with ‘while’ is used for a special kind of loop.


    double'
