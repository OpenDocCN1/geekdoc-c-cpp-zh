    as


    the unary operators. In ANSI C, however they have the very highest pre- and left-to-


    right associativity as postfix operators, and they have the same pre- as the other
    unary


    operators and right-to-Left associativity as prefix operators.


    ![](Images/index-38_1.jpg)


    ## Chapter 3:Data Types


    Data types refer to various categories of data that is to be manipulated. C provides


    several default data types. We need to discuss limitations on what can be stored
    in each


    type.


    The keywords signed char, unsigned char, char, signed long int, signed short int,
    signed


    int, unsigned int, unsigned short int, unsigned long int, float, double, and long
    double


    are the default data types but for programmers’ ease, it is allowed to use the
    short forms.


    The next paragraph has those legal shortened forms of data types in C.


    Fundamental data types include long, short, signed char, unsigned char, char,
    int, float,


    double, long double, unsigned, unsigned short and unsigned long.


    These are all keywords which means that they cannot be used as names of variables.


    Usually, the keyword signed is not used. The reason is that the signed int is
    equivalent of


    int, and because shorter names are easier to type, int is used on most of the
    occasions.


    The type char, however, is special in this regard as we’ll see in the later parts
    of this


    ## chapter


    Let us assume that the category type is defined to be anyone of the types given
    in the


    preceding paragraph. Using this category, we can provide the syntax of declaring
    a


    variable of any type:


    type identifier;


    For example, this can represent int x or double a or char alphabet etc.


    It is always easy to understand things when they are grouped (except cats). The
    default


    data types can also be grouped according to their functionality. The integral
    types can be


    used to hold integer values; the floating and double types are those that be used
    to hold


    real values in them. These both categories, when combined form Arithmetic data
    types.


    **Integral Data Types**


    **Floating Point Data Types**


    char


    float


    signed char


    double


    unsigned char


    long double


    short


    int


    long


    unsigned short


    unsigned


    unsigned long


    **3.1 Integral Data Types**


    The data type int, the short for integer is the most used integral data type in
    C. This type,


    along the other integral types such as char, short, and long, is designed for
    working the


    integer values that are representable on a machine. Mathematics define integers
    as


    positive and negative whole numbers such as -11, 13, 66 etc.


    Since machines are designed within bounds, we can have integers up to a certain
    limit.


    Typically, an integer is stored in either 16 bits or in 32 bits. There are other
    possibilities,


    but this is what happens in most C systems. On older PCs, an integer is typically
    stored


    in 16 bits while newer PCs, workstations and mainframes support 32 bit integers.


    To calculate the range we use the power rule. On a 16 bit system, we can have
    2^16 =


    65536 distinct values, half of which would be negative if we are dealing with
    signed


    numbers. Similarly on a 32 bit system, we can have 2^32 = 4294967296 distinct
    values,


    half of which are negative if we are dealing with signed numbers.


    In C, the data type integer is considered the "natural" or "usual" type for working
    with


    integer. There are other integral types such as char, short, and long. The data
    type short,


    for example, can be used in situations where we need to use less number of bytes
    to


    store our integer, although it is not required to do so in today’s advanced world
    as we do


    not have any storage issues nowadays. In a similar fashion, the type long might
    be in


    situations where large integer values are needed. The compiler may provide storage


    greater than it is required for a natural integer. Typically, short is stored
    in 2 bytes and


    along is stored in 4 bytes. Machines with 4 byte systems have equal sized short
    and long


    data types.


    **3.2 Floating Point Data Types**


    C provides the three floating types: float, double, and long double. Floating
    point


    variables are used to store real values like 3.14, 1.33334 etc. A suffix can be
    added to a


    floating constant to specify its type. Any floating constant without suffix is
    of type


    double. The working floating type for C is double rather than float.


    Integers can be used as floating constants, but they must be written with a decimal


    point. For example, the constants 1\. 0 and 2.0 are both of type double, whereas
    as


    integers, their value will be 1 and 2 respectively.


    There is another notation to represent floating point numbers as well which involves


    exponent. For example, the number 1\. 234567e-3 calls for shifting the decimal
    point


    three to the left to obtain the equivalent constant 0.001234567\. This becomes
    handy


    when you have to deal with a number of zeros to start right after decimal point.
    It is easy


    to remember a floating type number like this.


    A floating type number consists of four parts: an integer part, a decimal point,
    a


    fractional part, and an exponential part (if any). A floating type number must
    contain


    either a decimal point or an exponential part or both. If a decimal point is present,


    either an integer part or fractional part or both must be present. If no decimal
    point is


    present, then there must be an integer part along with an exponential part to
    indicate


    the possible position of decimal point.


    Some examples of floating constants are 3.14159, 314.15ge-2, 1333e-3 etc.


    **3.3 Using “typedef”**


    The C language provides the programmer to define a data type using existing data
    types


    but with his own customized names. This is achieved through typedef mechanism,


    which allows the programmer to use an identifier of his choice to represent certain
    data


    types. Some examples are


    typedef int numberOfStudents ;


    typedef double percentage ;


    typedef short int age;


    In each of these type definitions, the named identifiers can be used later to
    declare


    variables or functions in the same way ordinary types can be used.


    numberOfStudents Strength;


    The above statement declares the variable Strength to be of type numberOfStudents,


    which is synonymous with integer as per our definition.


    The advantage of using typedef for customized data types is in abbreviating long


    declarations. Another advantage is having names that reflect the intended use
    like


    numberOfStudents.


    **3.4 Storage Classes**


    Variables and functions in C have two attributes: type and storage class. You
    must have


    gathered around the first attribute so far. Let us now discuss the storage class
    attribute.


    The storage classes are used for certain utilities of variables and functions.
    The most


    common storage class is auto. There are three other storage classes defined by
    these


    keywords:


    auto


    extern


    register


    static


    **3.4.1 The Storage Class auto**


    By default, C variables declared within function definitions are automatic. Thus,


    automatic is the most used of the four storage classes. If a compound statement
    starts


    with able declarations, then these variables can be acted on within the scope
    of the


    enclosing compound statement. For difference between compound statements starting


    with declarations and those which do not start with variable declarations, we
    use block


    terminology. A block is a compound statement with declarations.


    Declarations within a block are automatically of storage class auto. We don’t
    need to


    explicitly state auto for these variables. The keyword auto is rarely used. When
    the


    program control enters a block, the system allocates memory for all the automatic


    variables enclosed in the block. The variables are “local” in nature within that
    block.


    When the program control exits a block, the system releases the memory that was
    set


    aside for the automatic variables. As soon as the blocks are gone, gone are the
    variables.


    That is why these variables are called local.'
