  raw: 'The increment operator ++ and the decrement operator -- are unary operators.
    ++ and -


    - can be applied to identifiers, but not to constants or ordinary expressions.
    Moreover,


    different effects may occur depending on whether the operators occur in prefix
    or


    postfix position.


    Clearly, Increment and decrement operators can be tricky to work with. In simple


    situations, one can consider ++ and -- as operators that provide concise notation
    for the


    incrementing and decrementing of a variable. In other situations, careful attention
    must


    be paid as to whether prefix or postfix position is desired. They are pretty simple
    once


    you know the purpose and use of each and the best way to make you familiar with


    purpose of each of these operators is the practical. So here is a program which
    describes


    usage of these operators:


    #include "iostream"


    void main(void)


    {


    int A = 10;


    printf("This is a Program to demonstrate use of Increment Decrement Operators
    in C\n");


    printf("Before Prefix Increment, A = %d\n", A);


    ![](Images/index-31_1.jpg)


    printf("Prefix Increment, A = %d\n", ++A);


    printf("After Prefix Increment, A = %d\n", A);


    printf("Before Postfix Increment, A = %d\n", A);


    printf("Postfix Increment, A = %d\n", A++);


    printf("After Postfix Increment, A = %d\n", A);


    printf("Before Prefix Decrement, A = %d\n", A);


    printf("Prefix Decrement, A = %d\n", --A);


    printf("After Prefix Decrement, A = %d\n", A);


    printf("Before Postfix Decrement, A = %d\n", A);


    printf("Postfix Decrement, A = %d\n", A--);


    printf("After Postfix Decrement, A = %d\n", A);


    system("pause");


    }


    So, the initial value of A is 10\. Prefix increment increments the value to 11
    before


    assignments and thus prints 11 in 3rd line of output. Fourth line just prints
    and shows


    that A has been assigned the value 11\. Sixth line of output has a postfix increment
    which


    means A will be incremented after any assignments in the expression. Thus, the
    same


    value, 11 is printed and then A is incremented to 12 which can be seen in the
    next line.


    Prefix decrement decrements the value to 11 before assignments and thus prints
    11 in


    9th line of output. Next line just prints and shows that A has been assigned the
    value 11.


    12th line of output has a postfix decrement which means A will be decremented
    after


    any assignments in the expression. Thus, the same value, 11 is printed and then
    A is


    decremented to 10 which can be seen in the next line.


    **2.6.4 Logical Operators**


    Logical operators are used to get a binary output depending upon certain operations


    between one or more operands. They are handy when developing decision statements.


    ![](Images/index-32_1.jpg)


    **Operator Name**


    **Operations**


    !a


    Negative


    Inverts the value of a


    a && b


    Logical AND Returns true if both a, b are true


    a || b


    Logical OR


    Returns true if a or b or both are true


    Following is an example illustrating the use of these logical operators:


    #include "iostream"


    void main(void)


    {


    bool A = true, B = false, C = true;


    printf( !A? "True\n": "False\n");


    printf( (A&&B)? "True\n": "False\n");


    printf( (A&&C)? "True\n": "False\n");


    printf( (A||B)? "True\n": "False\n");


    system("pause");


    }


    **2.6.5 Comparison Operators**


    The comparison operators are used to compare two numbers or characters. For binary


    and string comparisons, we have separate operators and functions so avoid comparing


    two strings or binary numbers using these operators. It is not recommended.


    **Operator Name**


    **Operations**


    a == b


    Equals


    Returns true if contents of a equal to that of b


    a != b


    a < b


    Not equal to


    Returns true if a is not equal to that of b


    a > b


    a <= b


    Less than


    Returns true if a is less than b


    ![](Images/index-33_1.jpg)


    a >= b


    Greater than


    Returns true if a is greater than b


    Less than or equal to


    Returns true if a is less than or equal to b


    Greater than or equal to Returns true if a is greater than or equal to b


    Following is an illustration of usage of Comparison operators in C with output.


    #include "iostream"


    void main(void)


    {


    int a = 10, b = 5;


    printf((a==b)? "True\n": "False\n");


    printf((a!=b)? "True\n": "False\n");


    printf((a<b)? "True\n": "False\n");


    printf((a>b)? "True\n": "False\n");


    printf((a<=b)? "True\n": "False\n");


    printf((a>=b)? "True\n": "False\n");


    system("pause");


    }


    The output is pretty straightforward, so we trust the audience for understanding.


    **2.6.6 Special Operators**


    The ternary operator, the one we have consistently used in previous examples is
    quite


    useful. Its syntax is as follows:


    Condition ? (In case of true) : (In case of false)


    So, ternary operator checks a certain condition and depending upon the boolean
    output,


    selects one of the alternative cases.


    Another useful operator is typecasting operator. It takes an operand and converts
    it into


    the desired data type. Its syntax is as follows:


    (Type) operand;


    For example, (int) 3.14 yields 3.


    C provides the unary operator sizeof to find the number of bytes needed to store
    an


    object. It has the same precedence and associativity as all the other unary operators.
    The


    syntax of expression is as follows:


    sizeof(object)


    **2.7 Precedence and Associativity**


    As we discussed earlier as well, we have rules of precedence and associativity
    that are


    used to determine how certain expressions are evaluated. Let us briefly discuss
    how


    precedence rules are used by a C compiler to compute the unique and correct answer
    of


    an expression.


    The following is a table representing the precedence of operators in C. The operators
    at


    the top have highest precedence while the operators at bottom have the least precedence


    in an expression. The operators with higher precedence are computed first in an


    expression.


    **Category**


    **Operator**


    **Associativity**


    Postfix


    () [] -> . ++ - -


    Left to right


    Unary


    + - ! ~ ++ - - (type)* & sizeof


    Right to left


    Multiplicative * / %


    Left to right


    Additive


    + -


    Left to right


    Shift


    << >>


    Left to right


    Relational


    < <= > >=


    Left to right


    Equality


    == !=


    Left to right


    Bitwise AND


    &


    Left to right


    Bitwise XOR


    ^


    Left to right


    Bitwise OR


    |


    Left to right


    Logical AND


    &&


    Left to right


    Logical OR


    ||


    Left to right


    Conditional


    ?:


    Right to left


    Assignment


    = += -= *= /= %=>>= <<= &= ^= |=


    Right to left


    Comma


    ,


    Left to right


    Consider the following code and try to compute the results. We will discuss the
    output


    but it is better if you try it yourself before matching our results.


    #include "iostream"


    void main(void)


    {


    int a = 20, b = 10, c = 5;


    a = b = c += 2;


    printf("a= %d\n",a);


    printf("b= %d\n",b);


    printf("c= %d\n",c);


    a = 20, b = 10, c = 5;


    a = ++b -= c = 2;


    printf("a= %d\n",a);


    printf("b= %d\n",b);


    printf("b= %d\n",c);


    system("pause");


    }


    The initial values of a, b and c are 20, 10 and 5 respectively. The equivalent
    expression


    for the first expression can be: (a = (b = ( c = c + 2 )));


    The inner most parentheses assigns the value 5 to c. The other two parenthesis
    simply


    assign c to b and b to a. So, all the variables contain 7 after the execution
    of first


    assignment.


    Then, we re initialize values of a, b and c with 20, 10 and 5 respectively. The
    equivalent


    expression for the second assignment would be:


    (a=((b=b+1)=b-(c=2)));


    The inner most parenthesis stores 2 in variable c. The next parenthesis then compute
    b-


    c, equivalent to 10-2, and results 8 which is stored in b. Then b is incremented
    by 1


    which gives b the value 9\. Then a is assigned the value of b, which is 9.


    All the operators on a given line, such as * / % have equal precedence with respect
    to


    each other, but have higher precedence than all the operators that occur on the
    lines


    below them. We have associativity for all the operators in the rightmost column.
    For


    every operator, we will declare its precedence and associativity so that there
    is a


    standard to compute a mathematical expression. These rules are to be remembered
    by


    every C programmer for efficient programming.'
