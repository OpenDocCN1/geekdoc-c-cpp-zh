    ## Chapter 2:Tokens and Syntax


    In this chapter, we explain the syntax and lexical elements of the C programming


    language. C is a high level programming language. Like other high level languages,
    it has


    rules and principles for putting together different components to create legal
    and


    working programs. These rules and principles define the syntax of the language.


    The program that checks on the legality of C code is called the compiler. The
    compiler


    translates each line of code into machine language to see if there are any errors.
    If there


    is an error, the compiler will print an error message and stop. If the compiler
    finds no


    errors, then the source code is correct, and the code is translated into object
    code. The


    object code is used by loader to create an executable file.


    As we discussed earlier, the preprocessors are processed prior to execution of
    remaining


    code. We can think of the preprocessor as being built into the compiler. This
    is what


    actually happens on some systems, whereas on others the preprocessor is separate.
    This


    might not concern us at this stage but we have to be aware, however, that preprocessors


    and compiler can both cause various errors in our programs. Let us discuss


    preprocessors in a bit of detail now.


    **2.1 Preprocessors**


    C compiler has a preprocessor built into it. Lines that begin with a # are called


    preprocessors. We have so far used #define and #include. The compiler processes
    these


    preprocessors before actually compiling a code. For example, when we defined a


    constant using #define in section 2.2, the compiler replaced all the instances
    of PI with


    the value specified at the start before compiling the code. Such constants are
    usually


    known as Symbolic constants.


    We write all the #define statements at the top of our file. It is a convention
    to write all


    the letters of a constant in capital. Following this convention enables programmers
    to


    easily identify Symbolic constants or any other constants as well. It is important
    to note


    that though, the preprocessor never changes the contents of quoted strings. For


    example, in the following statement, only second PI will be replaced by the value
    defined


    by preprocessor PI.


    printf(" PI == %f\n ", PI);


    The program becomes more readable by using preprocessors. It makes easy to follow
    the


    flow of program. More importantly, if a constant has been defined symbolically
    by


    means of the #define facility and used throughout a program, it is easy to change
    it later,


    if necessary. For example, the letter c is universally accepted to be used to
    represent the


    speed of light, which is approximately 299792.458 lan/sec. If we write the following


    preprocessor and then use the letter C throughout tens of thousands of lines of
    code to


    represent symbolically the constant 299792.458, it will be easy to change the
    code when


    a new physical experiment produces a better value for the speed of light. All
    the code is


    updated by simply changing the constant in the #define line. Such are the advantages
    of


    using preprocessors.


    #define C 299792.458


    #include *filename.h* is a preprocessing directive that causes a copy of the file
    filename.h


    to be included at the point in the file when it is compiled. A #include line can
    occur


    anywhere in a file, though it is typically at the head of the file as a convention.
    It is


    necessary to specify the filename in quotes as it indicates that it is a pre-defined
