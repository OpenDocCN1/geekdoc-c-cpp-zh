- fmt: "\nSome of you may have noticed that we have not used function prototypes in\
    \ the program of section 4.1\\. Instead, we defined the functions above the `main`\
    \ function. This is an alternative for prototypes, acceptable by ANSI C compilers.\
    \ We write the preprocessors, followed by all the function definitions and then\
    \ finally our main program. This is recommended if you have only one file to work\
    \ with. For example，请参考第 4．1节中的示例。\n\n## Function Invocation\n\nThis section aims\
    \ to familiarize you with how a function call works。 Every C program consists\
    \ of one or more programs（函数），其中一个是主“功能”。 The `main`function serves as the entry\
    \ point; therefore，execution begins there 。When a**called/**invoked from within\
    \ another environment ，control shifts immediately over towards said invoked Body\
    \ where it executes according what was written inside until finishes doing so\
    \ before returning back out again into previous location (i.e.,the calling envoronment.)\n\
    \nFunctions must be called providing valid input parameters consistent their declarations/definitions\
    \ .The compiler will generate error mismatch between passed required ones especially\
    \ when using prototype checking mechanisms like type compatibility enforced through\
    \ \"call-by-value\".\n\n\"Call-by-value\" describes parameter passing semantics\
    \ : actual argument values aren't directly transferred but instead copied creating\
    \ local variable copies occurring each invocation time — meaning original caller’s\
    \ variables remain unaffected because both sides maintain separate instances.\n\
    \nConsider following demonstration illustrating concept :\n\n```c\nvoid changeValue(int\
    \ a)\n{\n    a = a + 10;\n    printf(\"Inside changeValue: Value now=%d\\n\",a);\n\
    }\nvoid main(void){\n   int b=10；\n   print f(\"% d\"，b) ;\nchange value(b); //\
    \ prints unchanged \nprint (\"After...still %dn”, B ）;\n\nsystem(pause);  \n}\
    \ ...\n```\n\nAs shown above addition occurs locally ；original stays same .\n\n\
    Another common technique passes references via pointers—we'll discuss detail later\
    \ chapter .\n\n## Environment  \n\nWhat constitutes ideal collaborative approach\
    \ ? Everyone having assigned roles/boundaries leads success rather than unnecessary\
    \ interference causing disaster ! Similarly ，C language structures follow these\
    \ principles ensuring locality yet allowing controlled sharing among multiple\
    \ modules e.g.,global /static identifiers etc...\n\nBasic scoping rule ：variables\
    \ accessible solely within block they're declared unknown outside unless explicitly\
    \ made visible otherwise — easy enough however programmers often reuse names across\
    \ contexts causing ambiguity except due proper rules enforcing differentiation\
    \ Example includes multiple uses identifier 'A' various nested blocks below demonstrates\
    \ this along misuse loop counter scope violation problem too！\n\nExample showing\
    \ scopes including global/local conflicts plus illegal usage beyond definition\
    \ region：\n\n```\nint GLOBAL_VAL ＝　１０；\n\nv o i d ch ange(ｉｎｔ ａ）\n\n｛ａ＋＝１Ｏ；ｐrintf(“Local\
    \ var:%d%dGlo bal：％Ｄｎ”，aglobal)；}\n\nvo id m ain（）{ \n\nint loc al＿var　　２）；ch\
    \ ang(loca l_var);\n\nfor(x＝１２３４５){／＊ Loop body *／ }\n\nprintf （”Error!out-of-scope\
    \ X accessed here ”）/*！Compile fail */\n\n}\n ```\n\nFour distinct regions exist－first\
    \ being outermost whole-file reachable modificatios reflected everywhere rest\
    \ three internal limited respective braces instance Local,a,X Each follows norm\
    \ except latter which violates & hence fails compilation fix removed offending\
    \ statement line preceding loops exit next good!\n\n### Recursion   \n\nRecursive\
    \ method self-referential invoking itself repeatedly driven conditional check\
