  raw: 'Let us now see another example which involves if else statement:


    void main(void)


    {


    printf("Program starts\n");


    int x=0;


    printf("Enter a number and press enter: ");


    scanf("%d", &x);


    if(x==0)


    {


    printf("If executes\n");


    }


    else


    {


    printf("Else executes\n");


    }


    printf("Program ends\n");


    system("pause");


    **}**


    This program has an alternate condition in the block covered by else statement.
    Else


    statement is always used with if statement. In the case, when if statement holds
    true, the


    compiler just ignores the else statement. Otherwise, when if statement is false,
    the body


    of else block is executed.


    Following is an example involving multiple if else statements:


    void main(void)


    {


    printf("Program starts\n");


    int x=0;


    printf("Enter a number and press enter: ");


    scanf("%d", &x);


    if(x==0)


    {


    printf("1st If executes\n");


    }


    else if(x<10)


    {


    printf("2nd If executes\n");


    }


    else if(x<20)


    {


    printf("3rd If executes\n");


    }


    else


    {


    printf("Else executes\n");


    }


    printf("Program ends\n");


    system("pause");


    }


    **4.2 Switch Case statement**


    Switch case is another popular decision making statement in C programming language.


    The use is very similar to if else statements but instead of conditions which
    result in


    Boolean values, this decision making statement has certain cases for different
    values.


    Let us see an example for better understanding:


    void main(void)


    {


    printf("Program starts\n");


    char x;


    printf("Enter a small alphabet and press enter: ");


    x=getchar();


    switch(x)


    {


    case ''a'': printf("You entered a..!\n"); break;


    case ''b'': printf("You entered b..!\n"); break;


    case ''c'': printf("You entered c..!\n"); break;


    case ''d'': printf("You entered d..!\n"); break;


    default: printf("You entered something else..!\n");


    }


    printf("Program ends\n");


    system("pause");


    }


    Based on input from user which is passed as an argument in switch statement, the


    program executes a particular case. If it cannot find any case, the default case
    is


    executed.


    An important thing to note is the break statement at the end of each case. Break


    statement is used to leave the current block in any situation. For example, if
    you are in


    for loop, you will ignore the code inside for loop after the break statement.
    Here, break


    statement is necessary if we do not want multiple cases to be associated with
    one input.


    For example, see the following program:


    void main(void)


    {


    printf("Program starts\n");


    char x;


    printf("Enter a small alphabet and press enter: ");


    x=getchar();


    switch(x)


    {


    case ''a'': printf("You entered a..!\n"); break;


    case ''b'': printf("You entered b..!\n");


    case ''c'': printf("You entered c..!\n"); break;


    case ''d'': printf("You entered d..!\n"); break;


    default: printf("You entered something else..!\n");


    }


    printf("Program ends\n");


    system("pause");


    }


    In the above program, if user enters character b as input, two cases are executed.
    Start-


    ing from case ‘b’, compiler executes every line of code unless it reaches a break
    state-


    ment or end of switch case block.


    **4.3 For Loop**


    As we described earlier, loops are used for repetitive execution of statements.
    When we


    know the number of iterations, for loop is the ideal loop to use in a program.


    The general format is as follows:


    for(initialization expression; check condition; increment/decrement){…}


    Here is an example which uses for loop:


    void main(void)


    {


    printf("Program starts\n");


    char x;


    for(int i=0 ; i<5 ; i++)


    {


    printf("Enter a small alphabet and press enter: ");


    x=getchar();


    switch(x)


    {


    case ''a'': printf("You entered a..!\n"); break;


    case ''b'': printf("You entered b..!\n"); break;


    case ''c'': printf("You entered c..!\n"); break;


    case ''d'': printf("You entered d..!\n"); break;


    default: printf("You entered something else..!\n");


    }


    }


    printf("Program ends\n");


    system("pause");


    **}**


    The above program executes the statements within for loop five times. When compiler


    reaches for loop, it first of all initializes the variable involved. After that,
    condition is


    checked. If condition is true, keep going else stop. So, in the first execution
    cycle, I is


    initialized to 0 and condition is true as 0 is less than 5\. After first execution
    cycle,


    increment or decrement statement at the end of for loop is executed and condition
    is


    checked. Now, increment operator gives I the value of 1, which is again less than
    5 so


    loop keeps going. Similarly, loop goes on for three more cycles. After a total
    of five


    cycles, value of I will be 5\. For 6th possible cycle, value of I is compared
    with 5 and the


    answer will be false as 5 is not less than 5\. Hence, 6th cycle won’t be executed
    and loop is


    terminated.


    **4.4 While Loop**


    This loop uses only a condition to determine how many iterations are to be computed.


    There are no (necessary) initialization and incremental change in value of a variable.


    There can be initialization and change in a while loop if it is required by program
    logic.


    The general syntax of while loop is as follows:


    while(condition){….}


    Here is an illustration for better understanding of while loop:


    void main(void)


    {


    printf("Program starts\n");


    char x=''a'';


    printf("Enter a small alphabet and press enter: ");


    x=getchar();


    while(x!=''e'')


    {


    switch(x)


    {


    case ''a'': printf("You entered a..!\n"); break;


    case ''b'': printf("You entered b..!\n"); break;


    case ''c'': printf("You entered c..!\n"); break;


    case ''d'': printf("You entered d..!\n"); break;


    default: printf("You entered something else..!\n");


    }


    printf("Enter e to exit. Else, enter another small alphabet and press enter: ");


    x=getchar ();


    }


    printf ("Program ends\n");


    system ("pause");


    }


    This program keeps repeating until user enters ‘e’. Thus, user is given the control
    of how


    many iterations are made by using while loop. This can be done with for loop too,
    but


    while is designed for this particular purpose. While loop is highly recommended
    if the


    number of iterations required are unknown.


    **4.5 Do While Loop**


    Do while loop is almost similar to while loop except that do while always execute
    its first


    cycle without testing any condition. On the other hand, while loop always checks
    that


    the condition given is true, even for the first execution cycle.


    Consider following example and compare it with the while loop example:


    void main(void)


    {


    printf ("Program starts\n");


    char x=''a'';


    do


    {


    printf ("Enter a small alphabet and press enter: ");


    x=getchar();


    switch(x)


    {


    case ''a'': printf("You entered a..!\n"); break;


    case ''b'': printf ("You entered b..!\n"); break;


    case ''c'': printf ("You entered c..!\n"); break;


    case’d’: printf ("You entered d..!\n"); break;


    default: printf ("You entered something else..!\n");


    }


    } while(x!=''e'');


    printf ("Program ends\n");


    system ("pause");


    **}**


    **4.6 Nested Loops**


    Nested loops refer to loops within loops. They are usually useful when dealing
    with 2-D


    arrays. Here is an example in which a 2-D array is initialized using a nested
    for loop:


    void main (void)


    {


    int Two_D[10][10];


    for (int i = 0; i < 10; i++)


    {


    for (int j = 0; j<10; j++)


    {


    Two_D[i][j] = i+j;


    }


    }


    for(int i = 0; i < 10; i++)


    {


    for(int j = 0; j<10; j++)


    {


    printf("%d, ", Two_D[i][j]);


    }


    }


    system ("pause");


    **}**


    Similarly, we can use nested loops for a while and do while. You can nest different
    loops


    together as well.


    Decision statements and loops provide flexibility to the programmer to develop
    a


    program according to his understanding. It leads to better development techniques
    and


    encourages programmer to think of new solutions instead of just following already


    established solutions.


