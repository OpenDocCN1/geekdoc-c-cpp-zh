    ## Chapter 8: Binary Trees


    A tree is a finite set of elements, often known as nodes. Every tree has a unique
    starting


    node, called the root node, whereas the remaining nodes are a disjoint collection
    of


    subtrees of this root node. Each node keeps track of its parents or/and children
    so that


    traversal can be made possible. A node with no children is called a leaf node
    or a


    terminal node.


    A binary tree is a tree whose nodes can have a maximum of two children. A binary
    tree is


    a data structure which comprises of two possible sub-elements of every node, called
    left


    child and right child. If a node does not have a left or right child, they are
    assigned


    NULL values. Each link must point at a new object not pointed at or be NULL.


    The general form a node in a binary tree is as follows:


    struct node


    {


    Char value;


    Node *left, *right ;


    };


    The binary tree is a useful data structure for rapidly storing sorted data and
    rapidly


    retrieving stored data. This results in an immense increase in efficiency of searching
    and


    sorting.


    **8.1 Composition**


    A binary tree is composed of parent nodes, or leaves, each of which stores data
    and also


    links to up to at most two child nodes. It is the relationship between the leaves
    linked to


    and the linking leaf, also known as the parent node, which makes the binary tree
    such an


    efficient data structure.


    Generally, the left node has a lesser value than parent while right child has
    a greater key


    value than its parents. Due to these two simple rules, the efficiency of trees
    is enormous.


    As a result, the leaves on the farthest left of the tree have the lowest values
    and we


    already know that so if we want to get the lowest value, we only need to traverse
    to the


    lowermost leaf node to the left instead of going through every element of the
    tree.


    Similarly, the leaves on the right of the tree have the greatest values and therefore
    if we


    need to find the highest number, we just need to traverse to one side of the tree
    and we


    can reach the destination much quicker than a program which used sorting and


    searching algorithms to accomplish this task.


    More importantly, as each leaf connects to two other leaves, it is the beginning
    of a new,


    smaller, binary tree. Due to this reason, it is possible to easily access and
    insert any type


    data in a binary tree at any point of time, using search and insert functions
    recursively


    called on successive leaves and maintaining the order of tree as well. The newly
    inserted


    node always goes to the right place.


    **8.2 Insert Function**


    The following insert function inserts elements in a tree. If tree is not created,
    the


    element creates it as well. It uses pointers to pointers in order to handle the
    case of a


    tree that might not exist. By taking a pointer to a pointer, it is possible to
    allocate


    memory if the root pointer is NULL.


    void insert(int key, struct node **terminal)


    {


    if( *terminal == 0 )


    {


    *terminal = (struct node*) malloc( sizeof( struct node ) );


    (*terminal)->key_value = key;


    (*terminal)->left = 0;


    (*terminal)->right = 0;


    }


    else if(key < (*terminal)->key_value)


    {


    insert( key, &(*terminal)->left );


    }


    else if(key > (*terminal)->key_value)


    {


    insert( key, &(*terminal)->right );


    }


    **}**


    The insert function follows the two basic rules of a binary tree. For any current
    node,


    move left if you have a lower value to enter and move right for a greater value,
    until it


    reaches a NULL node, which it allocates memory for and initializes with the new
    key


    value. The pointers to the second last node are updated and pointers for newly


    initialized node are set to NULL. Once, the element has been added, the insert
    function


    will stop calling itself and return program control to normal environment for
    execution.


    **8.3 Search Function**


    Here is a search function for a binary tree. It takes a key value and a starting
    node and


    searches the key value in the tree recursively. If leaf node is found, it is returned
    elsewise


    0 is returned.


    struct node *search(int key, struct node *terminal)


    {


    if( terminal != 0 )


    {


    if(key==terminal->key_value)


    {


    return terminal;


    }


    else if(key<terminal->key_value)


    {


    return search(key, terminal->left);


    }


    else


    {


    return search(key, terminal->right);


    }


    }


    else return 0;


    **}**


    The search function shown above recursively moves down the tree until it either
    reaches


    a node with a key value equal to the value for which the function is searching.
    The value


    being searched for may not be stored in the binary tree and hence we and hence
    we


    maintain a condition when search reaches a node with NULL value, it is concluded
    that


    the key value leaf is not there in the binary tree. It returns a pointer to the
    node to the


    previous instance of the function which called it.


    ![](Images/index-93_1.jpg)


    **Conclusion**


    The book is a simple, complete and quick reference for programming in C. The book


    presents the general purpose language, step by step. It is written following a


    programmer’s approach and is therefore ideal for using as a quick guide and reference


    for people who aim to code in C.


    The book covers all the basic concepts of programming in detail like Operators,


    Functions, Pointers, Arrays, Strings, and decision making statements. The book
    has the


    flexibility to help the readers if they are interested in selective study. The
    chapters are


    written with minimum possible inter-dependency.


    At the end of the book, the reader must be an efficient programmer in C and will
    be


    familiar with following concepts of C:


    • An overview of the language


    • Lexical elements of C


    • Loops


    • Decision Making statements


    • Arrays ()


    • Strings


    • Pointers


    • Functions


    • Abstract data types


    • Stacks


    • Queues


    • Linked lists


    • Binary Tree


    If you’ve found the book helpful, please leave a review for it now. Also check
    out my


    other books on Kindle.


    R.J. Khan


