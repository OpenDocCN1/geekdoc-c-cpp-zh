    **2.6 Operators and Punctuators**


    Like every other programming language, C has many characters with certain meanings.


    Examples include the Arithmetic operators which stand for the usual arithmetic


    operations of addition, subtraction, multiplication, division, and modulus, respectively.


    Modulus in mathematics returns the remainder after dividing a number by another.
    For


    example, the value of “a modulus b” is obtained by taking the remainder after
    dividing a


    by b. % is the character used for Modulus opertion in C. Thus, 15%7 has the answer
    1,


    and 7 % 5 results in 2.


    In a program, operators can be used to separate identifiers that are involved
    in an


    expression. Remember, an expression is a statement that ends with a semicolon.
    It is


    good practice to give whitespaces between each identifier and operators to give
    better


    readability but it is not necessary. Compiler ignores Whitespaces unless they
    are quoted


    in the code. So, the following statements are identical to the compiler,


    X=A+B;


    X = A + B ;


    Context is very important in almost everything. Symbols change their meaning


    depending upon where and how they are used. For example consider the following
    two


    statements which use % symbol in two different contexts.


    printf("Owner: %s\n", OWNER);


    int x = 15 % 4 ;


    The first % symbol is the start of a conversion specification, or format which
    is related to


    the identifier in the later part of the expression, whereas the second % symbol


    represents the modulus operator of mathematics.


    Examples of punctuators include parentheses, braces, commas, and semicolons.


    Consider the following code:


    void main(void)


    {


    int a, b = 2, c = 3;


    a = (b * (b + c));


