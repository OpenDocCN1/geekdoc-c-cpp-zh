    **7.4 Definition**


    All external and static variables, including struct variables, are initialized
    by the


    programmer are automatically initialized by the system to zero, unless specified


    otherwise. In traditional C, only external and static variables can be initialized.
    ANSI C


    allows automatic variables, including structures, to be initialized as well. The
    syntax for


    initializing structures is quite similar to that for initializing arrays as structures
    also take


    values in braces.


    A structure variable in a declaration can be initialized by following it with
    an equal sign


    and a list of constants contained within braces. If not enough values are used
    to assign


    all the members of the structure, the remaining members are assigned with value
    0.


    Some examples are:


    Student s1 = {“Mashal”, 18, 123, ‘A’, 3.79};


    Pair a[3][3] = { {{1.0, -10}, {20.0, 0.2}, {3.5, 0.3}}, {{4.7, -0.4}, {2.0, 0.5},
    {6.0, 1.6}} };


    **7.5 Abstract Data Types**


    The term abstract data type (ADT) refers to a data structure together with its
    operations,


    without specifying an implementation. Suppose we wanted a new integer type, one
    that


    could hold arbitrarily larger values than the default value. The new integer type
    together


    with its arithmetic operations will be an ADT. The idea of ADT comes from variety
    of


    requirements that keeps growing with innovative applications. Native types such
    as


    char, int, and double are already implemented by the C compiler and cannot be
    altered.


    So, we need a mechanism to define our own Data types with certain operations.


    **7.5.1 Stacks**


    An ADT stack is a container of objects that follows the last-in first-out (LIFO)
    principle.


    It means that you can access only the latest element you have entered. A stack
    is a


    limited access data structure - elements can be added and removed from the stack
    only


    at the top. For accessing other elements, you need to remove the objects on top
    of them.


    Only two primary operations are necessary for stack implementation: push and pop.


    Push refers to adding an element to the top of stack while pop removes the item
    at the


    top of the stack. A helpful analogy is to think of a stack of dumbbells on a steel
    rod; you


    can remove only the top dumbbell, also you can add a new dumbbell on the top.


    Now we develop and implement the ADT stack, one of the most useful standard data


    structures. The typical operations that can be implemented for a stack are push,
    pop,


    top, empty, full, and reset. The push and pop operations are discussed earlier.
    The


    empty operator tests if the stack is empty or not and results in a Boolean value.
    The full


    operator tests if the stack is full, which also returns a Boolean value. The reset
    operator


    removes all the elements of stack and initializes it.


    We will use a fixed-length char array to store the contents of the stack. The
    top of the


    stack will be an integer-valued member named top. The various stack operations


    discussed in the previous paragraph will be implemented as functions, each of
    whose


    parameter lists includes a parameter of type pointer to stack. Using a pointer
    results in


    better efficiency by avoiding to copy large stack values.


    Here is a complete C program, which implements various functions of stack:


    #define MAX_SIZE 50


    int stack[MAX_SIZE];


    void push();


    int pop();


    int is_empty();


    int peek();


    int TOP = -1;


    int main()


    {


    int element, choice;


    while(1)


    {


    printf("Stack Operations.\n");


    printf("1\. Insert into stack (Push operation).\n");


    printf("2\. Delete from stack (Pop operation).\n");


    printf("3\. Print top element of stack.\n");


    printf("4\. Check if stack is empty.\n");


    printf("5\. Exit.\n");


    printf("Enter your choice.\n");


    scanf("%d",&choice);


    switch (choice)


    {


    case 1:


    if (TOP == MAX_SIZE - 1)


    printf("Error: Overflow\n\n");


    else {


    printf("Enter the value to insert.\n");


    scanf("%d", &element);


    push(element);


    }


    break;


    case 2:


    if (TOP == -1)


    printf("Error: Underflow.\n\n");


    else {


    element = pop();


    printf("Element removed from stack is %d.\n", element);


    }


    break;


    case 3:


    if (!is_empty()) {


    element = peek();


    printf("Element at the top of stack is %d\n\n", element);


    }


    else


    printf("Stack is empty.\n\n");


    break;


    case 4:


    if (is_empty())


    printf("Stack is empty.\n\n");


    else


    printf("Stack is not empty.\n\n");


    break;


    case 5:


    exit(0);


    }


    }


    }


    void push(int value)


    {


    TOP++;


    stack[TOP] = value;


    }


    int pop()


    {


    int element;


    if (TOP == -1)


    return TOP;


    element = stack[TOP];


    TOP--;


    return element;


    }


    int is_empty()


    {


    if (TOP == - 1)


    return 1;


    else


    return 0;


    }


    int peek()


    {


    return stack[TOP];


    }


    **7.5.2 Queues**


    A queue is a container of objects (a linear collection) that follows the first-in
    first-out


    (FIFO) principle. An example of queues is any real life queue like in a Bank,
    or ATM or


    Airport. A new element or object is added to the back of the queue, while removal
    (or


    serving) happens from the front. In the queue only two operations are allowed.
    These


    are enqueuer and dequeuer functions. First one means to insert an item into the
    back of


    the queue and de-queue refers to removing an item from the front.


    The difference between stacks and queues is in removing. In a stack we remove
    the last


    item that was added whereas in a queue, we remove the item that has been in the
    queue


    more than anyone else.


    Here is a complete program illustrating the use of Queues:


    #define MAX_SIZE 50


    int queue_array[MAX_SIZE];


    int rear = - 1;


    int front = - 1;


    void main(void)


    {


    int choice;


    while (1)


    {


    printf("1.Insert element to queue \n");


    printf("2.Delete element from queue \n");


    printf("3.Display all elements of queue \n");


    printf("4.Quit \n");


    printf("Enter your choice : ");


    scanf("%d", &choice);


    switch (choice)


    {


    case 1:


    insert();


    break;


    case 2:


    delete();


    break;


    case 3:


    display();


    break;


    case 4:


    exit(1);


    default:


    printf("Wrong choice \n");


    }


    }


    }


    void insert()


    {


    int add_item;


    if (rear == MAX - 1)


    printf("Queue Overflow \n");


    else


    {


    if (front == - 1)


    front = 0;


    printf("Inset the element in queue : ");


    scanf("%d", &add_item);


    rear = rear + 1;


    queue_array[rear] = add_item;


    }


    }


    void delete()


    {


    if (front == - 1 || front > rear)


    {


    printf("Queue Underflow \n");


    return ;


    }


    else


    {


    printf("Element deleted from queue is : %d\n", queue_array[front]);


    front = front + 1;


    }


    }


    void display()


    {


    int i;


    if (front == - 1)


    printf("Queue is empty \n");


    else


    {


    printf("Queue is : \n");


    for (i = front; i <= rear; i++)


    printf("%d ", queue_array[i]);


    printf("\n");


    }


    }


    **7.5.3 Linked Lists**


    A linked list is a sequential access data structure, where each element can be
    accessed


    only in particular order. A typical illustration of sequential access finding
    a particular


    file from an unorganized pile of files. It is like a clothes line on which the
    data structures


    hang sequentially. A head pointer addresses the first element of the list, and
    each


    element points at a successor element, with the last element having a NULL value.


    Here’s a code that implements a linked list. Linked list consists of adjacent
    nodes with


    each having the address of next node. Starting from head, we can traverse through
    the


    whole list by using the pointer next in each node. We can take another pointer
    in node


    which can hold address for previous node as well.


    struct Node


    {


    int val;


    struct Node * next;


    };


    typedef struct Node element;


    void main()


    {


    element * curr, * head;


    int i;


    head = NULL;


    for(i=1;i<=10;i++)


    {


    curr = (element *)malloc(sizeof(element));


    curr->val = i;


    curr->next = head;


    head = curr;


    }


    curr = head;


    while(curr) {


    printf("%d\n", curr->val);


    curr = curr->next ;


    }


    **}**'
