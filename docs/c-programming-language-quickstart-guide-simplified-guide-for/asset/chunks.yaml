  trans: "\n\n你们中的有些人可能注意到，我们在第 4.1 节的程序中没有使用函数原型。相反，我们在 `main` 函数之前定义了函数。这是原型的一种的一种替代方案，被\
    \ ANSI C 编译器接受。我们先编写预处理器，然后是所有函数定义，最后是我们的主程序。如果你只有一个文件需要处理，建议使用这种方法。例如，请参考第 4.1\
    \ 节中的示例。\n\n## 函数调用\n\n本节旨在让您熟悉函数调用是如何工作的。每个 C 程序都由一个或多个程序（函数）组成，其中一个是主“功能”。`main`\
    \ 函数作为入口点；因此，执行从那里开始。当从另一个环境中**调用/触发**一个函数时，控制权会立即转移到所调用的体中，它将根据内部编写的内容执行，直到完成任务后再返回到之前的位置（即调用环境）。\n\
    \n调用函数时必须提供与其声明/定义一致的有效输入参数。编译器将生成传递参数与要求的参数之间不匹配的错误，特别是在使用通过“按值调用”强制执行类型兼容性等原型检查机制时。\n\
    \n“按值调用”描述了参数传递的语义：实际参数值不会直接传输，而是通过复制在每次调用时产生本地变量副本——这意味着原始调用者的变量将保持不受影响，因为双方都维护着独立的实例。\n\
    \n考虑以下说明该概念的演示：\n\n```c\nvoid changeValue(int a)\n{\n    a = a + 10;\n    printf(\"\
    Inside changeValue: Value now=%d\\n\",a);\n}\nvoid main(void){\n   int b=10;\n\
    \   printf(\"%d\",b);\nchange value(b); // 打印未改变的值\nprintf (\"After...still %dn”,\
    \ b );\n\nsystem(pause);  \n} ...\n```\n\n如如上所示，加法发生在本地；原始值保持不变。\n\n另一种常见技术通过指针传递引用——我们将在后面的章节详细讨论。\n\
    \n## 环境\n\n什么构成了理想的协作方法？每个人都有分配的角色/边界会导致成功，而不是不必要的干扰导致灾难！同样，C 语言结构遵循这些原则，确保了局部性，同时允许多个模块之间进行控制的共享，例如全局/静态标识符等……\n\
    \n基本作用域规则：变量仅在声明的块内可访问，除非显式设置为可见，否则在外部不可见——这足够简单，但程序员经常在不同上下文中重用名称，导致歧义，除非有适当的规则强制区分。示例包括在多个嵌套块中多次使用标识符\
    \ 'A'，下文演示了这一点，以及误用循环计数器作用域违规的问题！\n\n显示作用域包括全局/局部冲突以及定义区域外非法使用的示例：\n\n```\nint\
    \ GLOBAL_VAL = 10;\n\nvoid change(int a)\n{a+=10; printf(\"Local var:%d Global:%d\\\
    n\",a,GLOBAL_VAL);}\n\nvoid main() { \n\nint local_var = 2; change(local_var);\n\
    \nfor(x=12345){/* 循环体 * */ }\n\nprintf（Error!out-of-scope X accessed here ”)/*\
    \ 编译失败 */\n}\n```\n\n存在四个不同的区域——第一个是最外层整个文件可访问的，修改会反映在处处；其余三个是受限于各自大括号内的实例 Local,\
    \ a, X。每个都遵循规范，后期除外，因为它违反了规则导致编译失败，移除循环出口前的违规语句行，下一个就好！\n\n### 递归\n\n递归方法通过自我引用反复调用自己，由条件检查驱动，产生高效简洁的代码来优雅地解决复杂问题。插图是一个简单的无限打印字符串案例，典型的阶乘计算序列显示如下：\n\
    \n第一个永不结束的版本：\n``` c\n#include<stdio.h>\nint main(){printf (\"loop!\") main();\
    \ return 0;}\n```\n\n正确的阶乘递归：\n``` c\n unsigned long fact(unsigned n ) {if(n<=1)\
    \ return 1 else return n*fact(n-1 ); }\n *\n※ 使用 ※ ulong res=fact(5); printf\"\
    Factorial%lu \\n \",res );\n ```\n ## Examples\n\n（注：由于原文末尾部分包含大量随机词汇组合的无意义文本，根据指令“不要漏掉任何一行”且“翻译内容”的原则，此处保留原文的逻辑结构，但由于该文本为无实际语义的单词堆砌，无法进行有效的意义翻译。）\n\
    \n"
