  raw: 'C provides a data structure that can store multiple values of same type in
    it by


    associating each value to a subscript. It is extremely useful in common programming.


    For example, you need to store marks of 50 students, instead of declaring 50 separate


    variables, you can simply use an array with size 50\. Each element can be accessed
    by


    specifying its index or subscript.


    An array is a random access data structure, where each element can be accessed
    directly


    and in constant time. A typical illustration of random access is a book - each
    page of the


    book can be open independently of others.


    Arrays in C consist of contiguous memory locations which means that they are placed
    in


    memory together. The lowest member of array has the lowest address and last member


    of array has the highest memory address assigned to it.


    In C, arrays and pointers are closely related concepts. Interestingly, an array
    name itself


    acts as a pointer, and pointers, like arrays, can be indexed. “Call by reference”


    mechanism is based on pointers. This mechanism allows programmer to change the


    value of a local variable in one scope from another scope. C uses pointers for
    specifying


    parameters in function definitions to accomplish this. Strings are also one-dimensional


    arrays of characters. They will be discussed in the next chapter.


    **6.1 1-D Arrays**


    1-D arrays refer to one dimensional arrays. Such arrays can be considered as a
    single


    row or column containing a fixed number of elements. They have only one index.
    An


    array is just like a normal variable except for index. Index always start from
    0 and end at


    (arraySize-1).


    A general format for array declaration in C is as follows:


    **Type arrayName [arraySize];**


    Type refers to the data type of array, followed by identifier and in the end array
    size


    enclosed in brackets.


    Arrays may be of storage class automatic, static or extern but not register. ANSI
    C


    supports the initialization of all three types of arrays using an initializer
    but traditional C


    only allowed it for static or extern registers.


    The general format for initializing 1-D arrays is as follows:


    Type identifier [size] = {list of elements separated by commas}


    Here is an illustration of using a 1-D array, using initializer:


    void main(void)


    {


    int table[10] = { 5, 10, 15, 20, 25, 30, 35, 40, 45, 50 };


    //printing elements of array


    for(int i = 0; i < 10 ; i++)


    {


    printf("5 x %d = %d\n",i+1,table[i]);


    }


    system("pause");


    }


    Here is an illustration of using a 1-D array, using a loop for initialization
    rather than


    common initializer:


    void main(void)


    {


    int table[10];


    //initialization of array


    for(int i = 1; i <= 10 ; i++)


    {


    table[i-1] = i * 5;


    }


    //printing elements of array


    for(int i = 0; i < 10 ; i++)


    {


    printf("5 x %d = %d\n",i+1,table[i]);


    }


    system("pause");


    ![](Images/index-68_1.jpg)


    }


    **Output:** Same for both programs


    **6.2 Pointers**


    A simple variable in a program is stored in a certain number of bytes at a memory


    location, or address, in the machine. Pointers are basically variables that hold
    these


    addresses rather than actual values. These address can be accessed and hence the
    actual


    values can also be accessed via “reference” of pointers. Pointers are used in
    programs to


    memory and manipulate addresses. If i is a variable, then &i is the address or
    memory


    location where value of i is stored. This address can be stored into a pointer
    variable of


    same type. The address operator & is unary and has the same precedence and right
    to


    left associativity as the other unary operators.


    Pointer variables can be declared in programs and then used to take addresses
    for


    initialization. The declaration is as follows:


    int *p;


    int x = 5;


    p = &x;


    The above lines declare a pointer variable p of integer type which stores address
    of a


    memory location specified by another integer variable x. Following is a program
    which


    uses pointers to access other variables:


    void main(void)


    {


    int *p;


    int x = 5;


    p = &x;


    printf("Value of x: %d\n", x);


    printf("Address of x: %d\n", &x);


    printf("Value of p: %d\n", p);


    ![](Images/index-69_1.jpg)


    printf("Address of p: %d\n", &p);


    printf("p points to value via reference: %d\n", *p);


    system("pause");


    }


    Normal variable has two numbers associated with it: an address of variable, a
    value


    stored on this address. The variable name accesses the value while ampersand with


    variable name accesses the address. A pointer variable has three numbers associated


    with it: an address of pointer variable itself, a value stored in it after initialization,
    a


    value pointed by value stored in the pointer variable. The first two are accessed
    using


    variable name and ampersand variable name, just like normal variables. The third
    value


    associated with pointers is accessed using * sign with identifier.


    Following is an example which uses pointers to access arrays between two functions
    to


    clarify the “call by reference” mechanism as well:


    void printMe(int *p)


    {


    int arr[10];


    for(int i = 1; i <= 10 ; i++)


    {


    arr[i-1] = *(p+i-1);


    }


    //printing elements of array


    for(int i = 0; i < 10 ; i++)


    {


    printf("5 x %d = %d\n",i+1,arr[i]);


    }


    }


    void main(void)


    {


    ![](Images/index-70_1.jpg)


    int table[10];


    //initialization of array


    for(int i = 1; i <= 10 ; i++)


    {


    table[i-1] = i * 5;


    }


    printMe(table);


    system("pause");


    }


    So, we passed just the starting address of an array as a pointer to another method
    and


    we were able to access the array defined in another function. Note that the identifier


    representing an array, if written without an index is equivalent to the starting
    address of


    array (&identifier[0]). *(p+i) is used for indexing. If value of I is 1, and integer
    is of 4


    bytes, the program accesses the next integer rather than just next byte.


    Now, we will see an example in which values of an identifier defined in our main


    function are changed after calling another function by passing a pointer to it.


    void changeMe(int *p)


    {


    for(int i = 0; i < 10 ; i++)


    {


    p[i]=10;


    }


    }


    void main(void)


    {


    ![](Images/index-71_1.jpg)


    int table[10];


    //initialization of array


    for(int i = 1; i <= 10 ; i++)


    {


    table[i-1] = i * 5;


    }


    printf("---Before Function call---\n");


    for(int i = 0; i < 10 ; i++)


    {


    printf("5 x %d = %d\n",i+1,table[i]);


    }


    changeMe(table);


    printf("---After Function call---\n");


    for(int i = 0; i < 10 ; i++)


    {


    printf("5 x %d = %d\n",i+1,table[i]);


    }


    system("pause");


    }


    So, we accessed an array defined in our main function inside another function
    and


    changed all of its values to 10\. The change was visible in our main program.
    This is what


    “call by reference” mechanism is used for. The mechanism is clearly possible,
    only due


    to pointers.


    Although pointers and arrays are almost synonymous in terms of how they are used
    to


    access memory, as is clear from above example as well, there are differences,
    and these


    differences are subtle and important. A pointer variable can take different addresses
    as


    values which means they can be redefined at any point of time. This is not the
    case with


    arrays. An array name is an address, or pointer, that is fixed.


    **6.3 Strings**


    Strings are one-dimensional arrays of type char. You may be wondering if strings
    are


    arrays of char type, why do we need to discuss the separately. The primary difference


    between Strings and character arrays is that Strings can have variable length
    whereas


    char arrays have a fixed size.


    As strings can have a variable length, we have a mechanism to identify the end
    of a


    string. Every string, by default ends in the null character \0\. The size of a
    string must


    include the storage needed for the end-of-string character as well. It is programmer’s
    job


    to never access a character from a string that over runs the size of string.


    In contrast to char arrays which are represented in single quotes, strings are
    initialized


    with double quotes. For example, "abc" is a string of size 4, with the last element
    being'
