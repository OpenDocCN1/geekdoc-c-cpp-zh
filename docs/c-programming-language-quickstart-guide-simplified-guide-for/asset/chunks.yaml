  raw: 'Some of you may have noticed that we have not used function prototypes in
    the program


    of section 4.1\. Instead, we defined the functions above the main function. This
    is an


    alternative for prototypes, acceptable by ANSI C compilers. We write the preprocessors,


    followed by all the function definitions and then finally our main program. This
    is


    recommended, if you have only one file to work with. For example, please refer
    to the


    examples in section 4.1.


    **5.4 Function Invocation**


    This section is intended to make you familiar with how a function call works.
    Every C


    program is structured upon one or more programs, one of which is main function.
    Main


    function is the entry point in a program so execution starts from main function.
    When a


    function is called or invoked, the program control is shifted from main program
    to the


    ![](Images/index-59_1.jpg)


    called function body. Once, the execution of invoked function is completed, program


    control is returned to previous environment (main program in this case).


    Functions must be called by providing the valid input parameters as defined by


    Function declaration and definition. Compiler generates an error if a mismatch
    is found


    between parameters passed and parameters required. The compiler enforces type


    compatibility when function prototypes are used.


    "Call-by-value" is a term associated with passed parameters in C. It means that
    when


    you call a function and pass it parameters, the actual parameters are not passed
    to the


    other function. Instead their values are copied and another variable is created
    in the


    body of invoked function. This means that each argument is evaluated, and its
    value is


    used locally in its own environment. Thus, if a variable is passed to a function,
    the stored


    value of that variable in the calling environment will not be changed because
    the calling


    environment and called environment have their own copy of arguments.


    Following is an example, demonstrating the concept of “call by value”:


    void changeValue(int a)


    {


    a = a + 10;


    printf("Inside changeValue function: Value of a = %d\n", a);


    }


    void main(void)


    {


    int a = 10;


    printf("Inside main function, before changeValue is called: Value of a = %d\n",
    a);


    changeValue(a);


    printf ("Inside main function, before after changeValue is called: Value of a
    = %d\n", a);


    system ("pause");


    }


    So, as you can see, the changeValue function adds 10 to the value of passed parameter


    but the change is not visible to the variable “a” in main program. The change
    is made


    only to the local variable, initialized by making a copy of variable in main function
    in


    changeValue function.


    The other common technique used in C is passed by reference which uses pointers.
    We


    will discuss pointers and this mechanism in detail in one of the following chapters.


    **5.5 Environment**


    What is an ideal way to work in a group? The ideal way to work in a group is to
    play an


    assigned ole within certain limits and boundaries. Everyone has his privileges
    and


    certain limitations. If everyone pokes into each other’s work without necessity,
    it will


    lead the group to a disaster. The C structure follows these basic principles for
    the


    success of every program. As we discussed earlier, C provides locality of variables
    in


    functions. At the same time, C gives the programmer to choose the scope of a variable
    by


    himself. If a programmer wants something to be shared by multiple functions, C


    provides multiple options to do so. For example, use of pointers or global variables.


    The basic rule of scoping is that variables are accessible only within the block
    of their


    declaration. They are unknown outside the boundaries of that block unless specified


    otherwise using special techniques. This is an easy rule to be followed but programmers


    seem to use same identifiers in different environments. For example, see the second


    example in Examples section at the end of this chapter. The programmer used the


    identifier ‘a’ to represent multiple variables in different scope. If there were
    no rules for


    Scoping, the compiler could not have differentiated between these identifiers.
    Let us see


    another example:


    int globalVariable = 10;


    void changeValue (int a)


    {


    a = a + 10;


    printf ("Inside changeValue function: Value of localVariable = %d\n", a);


    printf ("Inside changeValue function: Value of gloabalVariable = %d\n", globalVariable);


    }


    void main(void)


    {


    int localVariable=20;


    changeValue(localVariable);


    printf("Inside changeValue function: Value of loclVariable = %d\n", localVariable);


    for(int x=1; x<=5; x++)


    {


    printf ("%d,", x);


    }


    printf("\n");


    printf ("%d,", x);


    system ("pause");


    }


    The above program uses four scopes. The first one is global which means it can
    be


    accessed anywhere and changes made to it in one place are visible to everyone
    else. All


    the others are local scopes which mean they are visible only to their scope. The


    identifiers “local Variable”, “a” and “x” are all variables defined in local scope.
    The first


    two variables follow the general rules of scope but x violates it. This program
    fails to


    compile because variable x, declared in the “for” loop is accessed outside its
    scope. The


    compiler is unable to identify x as an identifier outside for loop. To make this
    program


    work, just delete the second last statement in main program.


    **5.6 Recursion**


    Recursion is a technique in which a function calls itself in order to achieve
    a certain goal.


    Recursion is a very important as it provides a way for more efficient and concise
    code for


    difficult program.


    A function is said to be recursive if it calls itself within its body based on
    a decision


    statement usually. Here is an example for better illustration:


    void main(void)


    {


    printf("This program is never going to end..!\n");


    main ();


    system ("pause");


    }


    Following is another example, which keeps calling itself unless a certain condition


    (n<=1) is met.


    int factorial (int n)


    {


    if (n <= 1)


    return 1;


    else


    return (n * factorial(n - 1));


    }


    void main(void)


    {


    int f=factorial(5);


    printf("Factorial = %d\n", f);


    system("pause");


    }


    **5.7 Examples**


    **5.7.1 Equalizers**


    void printTable( int );


    void printHeading();


    void main(void)


    {


    printHeading();


    int x = 1;


    for(x=1;x<=10;x++)


    {


    printTable(x);


    }


    system("pause");


    }


    void printTable(int a)


    {


    for(int x=1; x<=10; x++)


    {


    printf("%d\t",x*a);


    }


    printf("\n");


    }


    void printHeading()


    {


    printf("-----------------------------Table of Tables-----------------------------\n\n");


    }


    **5.7.2 Multiple Files**


    In a file header.h:


    void func(int a);


    void funcSquare(int a);


    void funcCube(int a);


    In a file Implementation1.c:


    void func(int a)


    {


    printf("I am func. I have to print: a = %d\n", a);


    }


    In a file Implementation2.c


    void funcSquare(int a)


    {


    printf("I am funcSquare. I have to print: a = %d\n", a*a);


    }


    void func(int a)


    {


    printf("I am funcCube. I have to print: a = %d\n", a*a*a);


    }


    In a file main.c


    #include "header.h"


    void main(void)


    {


    printf("This is our main Program. Let''s start...\n");


    func(5);


    funcSquare(5);


    funcCube(5);


    printf("This is our main Program. Let''s finish...\n");


    system("pause");


    }


    **5.7.3 Multiple Files**


    void demo()


    {


    int normalVariable = 5;


    static int staticVariable = 5;


    normalVariable += 10;


    staticVariable += 10;


    printf("Normal: %d\n", normalVariable);


    printf("Static: %d\n", staticVariable);


    }


    void main(void){


    demo();


    demo();


    demo();


    system("pause");


    }


    **5.7.4 Pointers**


    void swap(int *p, int *q)


    {


    int tmp;


    tmp = *p;


    *q = tmp ;


    }


    void main(void){


    int a = 10, b =20;


    printf(“a = %d, b = %d\n”, a, b);


    swap(&a, &b);


    printf(“a = %d, b = %d\n”, a, b);


    system("pause");


    }


    **5.7.5 BubbleSort**


    void bubble(int a[], int n)


    {


    int i, j;


    for (i 0; i < n; ++i)


    for (j n 1; j > i; -j)


    if (a[j 1J > a[j])


    swap(&a[j-1], &a[jJ);


    }


