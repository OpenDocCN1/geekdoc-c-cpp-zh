  raw: 'oriented language hence every C program is based on one or more functions.
    There is at


    least one method in any C program, called main function. Main function is the
    entry


    point into any program.


    The concept of functions come from the need to divide large and complex tasks
    into


    smaller and simpler problems. It is always easy to manage smaller tasks. Functions
    are


    entirely up-to the will of programmer, but it is recommended that each function
    has a


    specific and unique tasks. Assembly of every individual function solves the basic


    problem. For example, in a Calculator application, there should be a function
    for every


    operation so that coding and debugging is easy.


    The use of Functions give us many advantages such as reusability, modularity,


    readability, simplicity and maintainability.


    The basic structuring element of C programs is Function. The standard C library
    itself,


    provides many built in functions such as sqrt, abs etc. We will see some of these


    functions in this chapter.


    In C, we have two terminologies regarding Functions. One is Function-Declaration
    and


    the other one is Function Definition. Function Declaration means that the function
    is


    registered with compiler while Function Definition actually contains the body
    and


    functionality of the function.


    **5.1 Function Definition**


    The function definition is the actual code which is executed whenever that particular


    function is executed.


    A function definition starts with the type of output a function provides. If no
    value is


    returned, then the type should be void. The default return type is int. If the
    type is other


    than void, then a value of that type is to be returned. If there is a mismatch
    between the


    required type and actually returned type, some conversions may be necessary. After


    that, we have a function name. The parameters, enclosed within parenthesis, act
    as a list


    of inputs that come with a function when it is called. The body includes the functionality


    core, the actual operations on the input to generate output.


    Remember, Function declaration is something different which we will discuss later
    on. A


    function definition has the following general form:


    type functionName (parameter list)


    {body}


    The first line represents the header of a function. Second line here represents
    the body


    of a function enclosed in braces by convention. The parameter list refers to a
    possible


    multiple inputs. functionName is the name of function while type represents the
    output


    of the function.


    An example of a function definition is:


    int sum (int a, int b)


    {


    sum = a + b;


    return sum;


    }


    In the program above, there are two integer inputs whose sum is returned as an
    output.


    The first int represents the return type. Then “sum” is the name of function.
    A list of


    parameters passed or inputs (both integer type) is enclosed inside parenthesis.
    Then,


    the body is enclosed within braces. The last statement has the keyword “return”,
    which


    is used for returning an output in specified format and along with that, program
    control


    also returns to the point from where sum(a, b) are called.


    The following are two ways to calculate sum of two numbers. One involves use of


    function and the other does not. Please see the differences to understand the
    utility of


    functions:


    1\. Without Function:


    void main (void)


    {


    int a = 20, b = 10, c = 5;


    a = b = c += 2;


    printf ("a= %d\n", a);


    printf ("b= %d\n", b);


    printf ("c= %d\n", c);


    a = 20, b = 10, c = 5;


    a = ++b -= c = 2;


    printf ("a= %d\n", a);


    printf("b= %d\n",b);


    printf("b= %d\n",c);


    a = 20, b = 10, c = 5;


    printf("%d",(a=((b=b+1)=b-(c=2))));


    a = 20, b = 10, c = 5;


    printf("%d",((b=b+1)=b-(c=2)));


    system("pause");


    }


    2\. With Function:


    int sumAndPrint(int a, int b)


    {


    int answer = a + b;


    printf("Answer = %d\n",answer);


    return answer;


    }


    void main(void)


    {


    int a=10, b=20, c=30, d=10, e=30, f=30, answer;


    answer = sumAndPrint(a , b);


    answer = sumAndPrint(c , d);


    answer = sumAndPrint(e , f);


    system("pause");


    }


    One of the differences between traditional C and ANSI C is the format of function


    definition. Traditional C declares the type of input parameters after the parenthesis
    end


    but identifiers of parameters are written inside parenthesis. An example is


    void functionANSI(a, b, c, d, e) int a, b, c; double d, e; { function body }


    The order in the declaration of parameters does not matter. Since ANSI standard
    allows


    most of the features provided by traditional C, hence C compiler nowadays accept
    both


    formats for definition of functions.


    **5.1.1 The return statement**


    When a return statement is executed, the current program finishes its execution
    and


    returns to the environment from which it was called. If the return statement is
    followed


    by an expression such as ++b; or a; then a value is returned to the calling environment


    which can be stored and used for further processing. Moreover, this value will
    be


    converted, if necessary, to the type of the function as specified in the function
    definition.


    A function can have zero or more return statements. If there are no return statements
    in


    a function, it completes its execution at the end of braces and then return to
    previous


    environment. An illustration is followed for better understanding:


    void sumAndPrint(int a, int b)


    {


    int answer = a + b;


    printf("Answer = %d\n",answer);


    return;


    printf("Again Answer = %d\n",answer);


    }


    Now, the above function prints the sum only once and returns to previous environment


    without executing the last statement. If there were no return statement in the
    code, the


    answer would have been printed twice. Of course, this example was just to illustrate
    the


    use of return statement, but you often come across situations in practical problems
    that


    you don’t need to fully execute a function.


    **5.2 The Function Prototypes**


    Function prototypes refer to Function Declarations. Functions should be declared
    before


    they are used. ANSI C provides for a new function declaration syntax called the
    function


    prototype. Function Prototypes are usually written at the top of main program.


    A function prototype declares how a function is to be used by specifying the function


    name, input parameter list along with their data types and the return type. Input


    parameter list may or may not contain identifiers. An example is:


    int sum (int, int);


    If someone understands the prototypes, he can use the function in his program.
    For


    example, the above function prototype tells us that we need to input two numbers
    and


    (most probably) their sum will be returned. Hence, I can write the following statement


    even though I have not written the sum function myself:


    Answer = sum ( a, b);


    Function prototypes allow the compiler to check the code in more detail by specifying
    all


    the functions that are used in your program. As we mentioned earlier, the type
    of


    parameters may need conversion. Function prototypes make it easier for the compiler
    to


    implement these conversions. For example, if we call our sum function like this:


    Answer = sum (2.5, 4.3);


    If we have used prototypes, compiler knows that sum function needs two integers
    rather


    than double and therefore either converts the input parameters into integers or


    generates an error of input type mismatch.


    **5.2.1 Function Prototypes in C++**


    In C++ function prototypes, the use of void in the parameter type list in both
    function


    prototypes and function definitions is optional. This is different from traditional
    C. For


    example:


    void func (void);


    void func ();


    In C++, both of these prototypes represent same thing: there are no input parameters


    but in traditional C, the first prototype is illegal and second function prototype
    refers


    that there can be any number of parameters for this function. Void is not a keyword
    in


    traditional C and hence cannot be used in function declaration and definition.


    **5.3 Alternative Style for Declarations**'
