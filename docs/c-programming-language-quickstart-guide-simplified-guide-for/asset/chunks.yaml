  raw: '**3.4.2 Storage Class extern**


    The communication between blocks is critical. One way of transmitting information


    across your scope is using methods to pass parameters to another scope. But, this


    method is not applicable in certain situations. The storage class extern provides
    us with


    another mechanism for communication between different environments or scopes.


    Declaration for a variable of extern class is very similar normal variable declaration


    except that variables are declared outside any block. These variables act as global
    for all


    the functions written after their declaration. An example follows for better


    understanding:


    int globalVariable = 10;


    void printMe()


    {


    printf("Value of gloabalVariable = %d\n", globalVariable);


    }


    void main(void)


    {


    printf("Value of gloabalVariable = %d\n", globalVariable);


    globalVariable+=10;


    printMe();


    }


    Note that we could have written the following statement as traditional C did not
    allow it


    but modern ANSI compilers do not complain about this format and also consider
    a


    variable outside any scope of extern class even if extern keyword is not used:


    extern int globalVariable = 10;


    Such variables cannot be of automatic or register class but they can be static
    if required


    as explained in storage class static section. The keyword extern is used to make
    compiler


    look for this variable anywhere in this file or in any other file for definition
    and use.


    Another important point to remember is that external variables are not de-allocated


    entirely through the program but the may be hidden if a similar identifier is
    redefined


    inside a scope. If this happens, the local variable is accessed, not the global
    variable in


    that scope.


    As we mentioned in the start, Information can be passed into a function two ways:
    by


    use of external variables and use of the parameter mechanism. Although there are


    exceptions, it is preferred to use the second method for this purpose because
    it leads to


    better modularity and conciseness of code. Using external variables carelessly
    may often


    result in surprises and magic. Global variables cascade their change throughout
    the


    program, which clearly can be harmful for your logic. The message or parameter
    passing


    technique is free from these hazards since changes are localized. Programs are
    therefore,


    easier to write and maintain. All functions have external storage class. This
    means that


    we can use the keyword extern in function definitions and in function prototypes.
    For


    example:


    extern double sum(double a, double b);


    **3.4.3 Storage Class register**


    The register storage class makes variables to work as high speed register. Obviously,
    it


    might have hardware based restrictions since there are a limited number of registers
    in


    physical space. Because of physical restrictions, variables of this class are
    automatically


    converted to auto type whenever compiler finds it impossible to use the variable
    as a


    memory register.


    Register class is used when fast execution is critical. When speed is a concern,
    the


    programmer may choose a few variables that are frequently accessed and declare
    them


    to be of storage class register. Registers take lesser number of clock cycles
    when they are


    accessed for use or modification than normal memory location. Since registers
    store


    integer values, hence extern variables are integer by default as well. Therefore
    following


    two declarations are equivalent:


    extern int variable;


    extern variable;


    **3.4.4 Storage Class static**


    Static means something which keeps its state constant. Static class have two basic
    uses.


    The primary use is similar to what the word static means: for declaring variables
    which


    retain their state when blocks are entered and exited frequently. Remember, normal


    variables are de-allocated as soon as the block is closed. The second use is its
    use with


    external class declarations.


    Here is an example:


    ![](Images/index-43_1.jpg)


    void demo()


    {


    int normalVariable = 5;


    static int staticVariable = 5;


    normalVariable += 10;


    staticVariable += 10;


    printf("Normal: %d\n", normalVariable);


    printf("Static: %d\n", staticVariable);


    }


    void main(void)


    {


    demo();


    demo();


    demo();


    system("pause");


    }


    As you can see in the output of above program, static variable retains its previous
    value


    for second and third function call as well. The static declaration of variable
    is executed


    only the first time function is called. After that, the compiler ignores it. The
    next time,


    static variable has value 15 and 10 is added in to it and 25 is printed. The third
    function


    call uses the retained value 25 for static variable and adds 10 to it. On the
    other hand,


    normal variable is initialized again and again to 5 and 10 is added. Each of the
    three


    function calls creates a normal variable of its own while static variable is only
    generated


    the first time and then retained for future references.


    Let us now discuss the static external variables. Extern and static together provide
    better


    privacy options to the programmer. As you know that global or external variables
    are


    accessible only to the functions defined after their declaration. The static variables
    on


    the other hand are dependent on their blocks that can be molded for use by


    programmers.


    Let us use this facility to provide a variable that is global to a family of functions
    but, at


    the same time, is private to the file.


    Another use of static is as a storage class to specify function definitions and
    prototypes.


    This use causes the scope of the function to be restricted. Static functions are
    visible


    only within the file in which they are defined. Unlike ordinary functions, which
    can be


    accessed from other files, a static function is available throughout its own file,
    but no


    other.


    **3.5 Default Initializations**


    In C, both external variables and static variables that are not assigned any values
    at the


    time of declaration are automatically initialized with 0\. This default initialization
    is


    applicable on arrays, strings, pointers, structures and union.


    In contrast to this, automatic and register variables are not automatically initialized
    by


    the system. This means compiler either generates an error or uses a garbage value
    if you


    access an automatic variable or register variable without initializing it.


    ![](Images/index-45_1.jpg)


    **Chapter 4: Loops & Decisions**


    Loops refer to programming tools for repetitive execution. This is extremely useful
    as it


    allows programmer to write codes that are concise. For example, consider that
    we want


    to print a statement a thousand times. Instead of writing the statement a thousand


    times, we can just program a loop. Such are the benefits of using a loop.


    C supports all the basic loops provided by other high level languages. These include
    for


    loop, while loop and do while loop. We will discuss each of these loops with example
    in


    this chapter.


    Computer works on logic designed by humans and is fed to it by programmers using


    programming languages. Logic is based upon decisions. Decision statements are


    required for defining these decisions. We will discuss two types of decision statements
    in


    this chapter.


    **4.1 If else statement**


    The most basic and most commonly used decision statement in any programming


    language is if else statement. This statement can be used for multiple scenarios.
    It can


    be used for one or any number of scenarios. Here’s a program only with one if


    statement:


    void main(void)


    {


    printf("Program starts\n");


    int x=0;


    printf("Enter a number and press enter: ");


    scanf("%d", &x);


    if(x==0)


    {


    printf("If executes\n");


    }


    printf("Program ends\n");


    system("pause");


    **}**


    This program takes an integral input from user using scanf function. If the user
    enters 0,


    then the logical operation in if statement holds true and therefore the body of
    if


    statement is executed. If any other number is entered, the body of if statement
    is not


    executed.'
