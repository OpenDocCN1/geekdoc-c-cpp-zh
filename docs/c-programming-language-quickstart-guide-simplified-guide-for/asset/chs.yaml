  \n\n\n\n\n递增运算符`++`和递减运算符`--`是一元运算符。它们可以应用于标识符，但不能应用于常量或普通表达式。此外，根据这些运算符出现在前缀位置还是后缀位置，会产生不同的效果。\n\
  \n显然，递增和递减操作符使用起来可能比较棘手。在简单的情况下，可以将 `++` 和 `--`` 视为为变量的递增和递减提供简洁表示的*速记符号* 。在其他情况下，（比如）必须仔细注意是需要**前缀形式**（如\
  \ ++x）还是**后缀形式** （如 x++).一旦你了解了每个运算的目的及用法后就会觉得很简单；而让你熟悉所有这些目的的每个算子的最佳方法就是实践练习以下包含用法的程序：\n\
  \n```\n#include \"iostream\"\n\nvoid main(void)\n{\n   int A = 10;\n   printf(\"\
  这是一个演示 C 语言中增减量算子使用的程序\\n\");\n   printf(\"在前缀自增之前, A = %d\\n\", A);\n   \nprintf(\"\
  前缀自增之后, A = %d\\n\", ++A);\nprintf(“在后缀字增量结束后 ，                         实际的变量值等于”,\
