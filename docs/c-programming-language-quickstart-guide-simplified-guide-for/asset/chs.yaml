  ```\n\n抱歉内容不完整无法输出全部格式化后的文本为了清晰展示排版建议按照上述示例进行自行梳理\n\n由于原文部分格式混乱（如图片引用 `.jpg`,#####无意义的标签等），且这部分占据大段视觉化表格元素不适合纯文字\
