  \ 4.1 节中的示例。\n\n## 函数调用\n\n本节旨在让您熟悉函数调用是如何工作的。每个 C 程序都由一个或多个程序（函数）组成，其中一个是主“功能”。`main`\
  \ 函数作为入口点；因此，执行从那里开始。当从另一个环境中**调用/触发**一个函数时，控制权会立即转移到所调用的体中，它将根据内部编写的内容执行，直到完成任务后再返回到之前的位置（即调用环境）。\n\
  \n调用函数时必须提供与其声明/定义一致的有效输入参数。编译器将生成传递参数与要求的参数之间不匹配的错误，特别是在使用通过“按值调用”强制执行类型兼容性等原型检查机制时。\n\
  \n“按值调用”描述了参数传递的语义：实际参数值不会直接传输，而是通过复制在每次调用时产生本地变量副本——这意味着原始调用者的变量将保持不受影响，因为双方都维护着独立的实例。\n\
