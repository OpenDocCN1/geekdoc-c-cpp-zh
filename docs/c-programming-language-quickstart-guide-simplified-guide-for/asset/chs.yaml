  \n\n\n\n\n## 3.4.2 存储类 `extern`\n\n代码块之间的通信至关重要。在作用域之间传递信息的一种方法是使用函数将参数传递给另一个作用域，但这种方法在某些情况下并不适用。存储类`extern`为我们提供了另一种在不同环境或作用域之间进行通信的机制。\n\
  \n声明一个`extern`类的变量与普通变量的声明非常相似，不同之处在于这些变量是在任何代码块之外声明的。这些变量对于在其声明之后编写的所有函数来说充当全局变量的角色。以下示例有助于更好地理解：\n\
  \n```\nint globalVariable = 10;\n\nvoid printMe()\n{\n    printf(\"Value of gloabalVariable\
  \ = %d\\n\", globalVariable);\n}\n\nvoid main(void)\n{\n    printf(\"Value of gloabalVariable\
  \ = %d\\n\", globalVariable);\n    globalVariable+=10;\n    printMe();\n}\n```\n\
  \n请注意，我们本可以编写如下语句；尽管传统的 C 语言不允许这样做，但现代的 ANSI 编译器对此格式并无异议，并且即使未使用关键字 `extern` ，也会将任何位于任意范围之外的变量视为\
  \ extern （外部）类的成员：\n\n```\nextern int globalVarible = student\n```（原文此句存在明显错误 'globalVarible'：疑似拼写问题及不完整内容）\n\
  \n这类变量不能是自动（auto）或寄存器(register)类别,但在需要时可以设置为静态类型 (static)，具体说明见 static **语段**(storage\
  \ class**段落)。关键词 ‘_*Exceled’   **[‘keyword ’ ]\n\nused to 进【图】原此处持有不明窜改迹象暂保留不乱译\n\
