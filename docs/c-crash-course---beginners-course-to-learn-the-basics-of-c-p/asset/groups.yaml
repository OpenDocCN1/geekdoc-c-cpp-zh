    # Chapter 5: The Console


    This chapter will teach you how to use the console in providing and collecting
    data.

    You''ll learn how to use this tool in performing I/O (i.e. Input/Output) operations
    in

    t C# language.


    # Console – The Basics


    A console is a tool that you can use to interact with the programs available in
    your

    computer. Because of this, consoles are considered as an important part of any

    operating system.


    In C#, user-to-program interactions involve standard output (e.g. screen) and/or

    standard input (e.g. keyboard strokes). When combined, these things are called
    I/O

    operations. The text within the console provides useful data and is a set of characters

    from a computer program.


    The computer''s OS (i.e. operating system) links I/O devices to every console

    program installed on the computer. Most systems tag screens and keyboards as

    deault output and input devices. However, you can easily redirect these channels
    to

    certain files or devices.


    # The Interaction between a Program and Its User


    Most programs interact with their user/s. Users need to provide inputs and

    instructions to the program they are interacting with. There are a lot of interaction

    methods available these days: console-based, browser-based, internet-based,

    graphical, etc. Now, the people who use consoles for program interactions are

    continuously decreasing. That''s because the alternative options (e.g. browser-based)

    better in terms of convenience and user-friendliness.


    # Using the Console


    Sometimes, the console serves as the most important tool for user-program

    interactions. For instance, you need to use the console when creating simple computer

    programs. These programs require you to focus on the problems that must be fixed.

    Beautiful GUIs (i.e. graphical user interface) and attractive outputs won''t help
    you

    with this task.


    You can also use the console to try a small code block before adding it to a complex

    program. Since the console is a simple tool, you can easily isolate the code block

    without pressing any button or seeing different screens. The console will give
    you the

    results you need in just a few seconds.'
