    \n# 逻辑运算符\n\nC# 也支持逻辑运算符。程序员使用这些运算符来创建布尔（也称为“逻辑”）语句。让我们详细讨论一下每个逻辑运算符：\n\n## AND\
    \ 和 OR 运算符\n\n你只能在涉及布尔值的表达式上使用 AND（即 `&&`）运算符和逻辑 OR（即 `||`）运算符。当的两个操作数都为真时，逻辑\
    \ AND 运算符将给你返回 \"true\"。例如：\n\n```c\nbool sample = (1 < 2) && (10 == 10);\n```\n\
    \n由于 1 小于 2 且 10 等于 10，该表达式将返回 true。由于逻辑 AND 运算符在不执行不必要的分析的情况下快速提供结果，程序员将其称为“短路运算符”。它会检查第一个语句的部分。如果求值结果为\
    \ \"false\"，操作将立即停止。由于其中一个操作数为假，该表达式将不再可能为真。\n\n另一方面，逻辑 OR（即 `||`）运算符在你的操作数中至少有一个求值结果为真时，将给你返回\
    \ true。例如：\n\n```csharp\nbool sample = (1 < 2) || (10 > 100);\n```\n\n这个示例将返回\
    \ true，因为左侧的操作数为真。逻辑 OR 运算符也是一个“短路运算符”，因为它在不检查整个 C# 语句的情况下也能给出结果。在当前的示例中，由于第一个操作数已经是真了，逻辑\
    \ OR 将不再分析第二个操作数。因此，条件已经满足。\n\n# 异或和取反运算符\n\n异或（即 `^`）是一个全路路运算符，因为它在给出结果之前需要检查两个操作数。如果其中某一个操作数的求值结果为真，它将给你返回\
    \ true。因此，如果其中一个操作数为真，你将得到 false。请查看以下示例：\n\n```csharp\nbool sample = (1 < 2)^(2\
    \ == 2);\n```\n\n由于两个表达式均为真，异或将给你返回 false。\n\n然而，取反运算符（即 `!`）简单地反转它所附的布尔值。例如：\n\
    \n```csharp\nbool sample = !(1 < 2);\n```\n\n1 小于 2。但是，由于“!”附加在布尔表达式上，结果将被反转。这意味着该表达式求值为“false”。\n\
    \n# 语句\n\n现在你已经知道如何使用比较运算符和逻辑运算符，是时候讨论条件语句的了。这些语句是强大的工具，可以帮助你实现编程逻辑。\n\n## If\
    \ 语句\n\nif 语句的语法如下：\n\n```csharp\nif (conditional expression)\n{\n    if 语句体\n\
    }\n```\n\n如你所示，该语法包含三个部分：\n\n1. “if” 子句 – 这部分表示 if 语句的开始。\n2. 布尔表达式 – 这部分可以包含逻辑表达式或一个存储数据的变量。与\
    \ C 不同，C# 的条件语句不接受整型表达式。\n3. 语句体 – 你需要使用大括号包围这部分。C# 允许你在此区域内放置多个语句。\n\n如果布尔表达式求值为真，程序将运行该语句。如果求值为假，程序将忽略该语句并将控制传递给后续块。下面的示例将展示“if”语句是如何工作的的：\n\
    \n重要说明：如果你的条件语句体只有单行，你可以省略大括号。\n\n```csharp\nConsole.WriteLine(\"Please enter\
    \ a number.\");\nint number1 = int.Parse(Console.ReadLine());\nint number2 = 0;\n\
    if (number1 > number2)\n    Console.WriteLine(\"C# is an excellent language.\"\
    );\n```\n\n## If-Else 语句\n\n与其他编程语言一样，C# 支持“if-else”条件语句。在编写 if-else 语句时，你应该使用以下语法：\n\
    \n```csharp\nif (the Boolean variable or expression)\n{\n    条件语句体\n} \nelse \n\
    {\n    else 语句体\n}\n```\n\n上述语法由以下部分组成：\n\n- “if” 子句 – 这部分开始条件语句。\n- 布尔表达式或变量\
    \ – 该表达式的值决定了程序将使用哪些代码。\n- 条件语句体 – 这可以是一条语句或是一组语句。如果你使用多个语句，请将它们包围在大括号内。\n- “else”\
    \ 关键字 – 这是一个触发“else”子句的 C# 关键字。\n- else 子句体 – 这与条件语句体相同（见上文）。\n\n在处理 if-else 语句时，程序会分析括号内的值。该值需要是布尔值（即为真或假）。如果值为“true”，程序将执行条件语句体并忽略“else”子句。然而，如果值为假，程序将运行\
    \ else 语句体。分析以下示例：\n\n```csharp\nint a = 100;\nif (a != 50)\n{\n  Console.WriteLine(\"\
    The variable is not equal to 50\");\n}\nelse\n{\n    Console.WriteLine(\"The variable\
    \ is equal to 50\");\n}\n```\n\n你可以将此代码解释为：如果 a != 50，控制台将打印：“The variable is\
    \ not equal to 50”。另一方面，如果 a = 50，控制台将显示：“The variable is equal to 50”。由于变量 a\
    \ 持有 100，你的提示符将给出：The variable is not equal to 50\n\n# 嵌套语句\n\n在某些情况下，你需要将一个“if”语句写在另一个“if”语句内部。程序员将此过程称为“嵌套”。如果你将条件语句写在另一个条件语句内部，你就是在进行“嵌套”。\n\
    \n重要说明：C# 允许你嵌套 if-else 语句。在这种情况下，每个“else”子句指向它之前的“if”子句。这个简单的规则可以帮助你分析复杂的条件语句。根据专家程序员的建议，不要创建超过三层的嵌套语句。如果你确实需要使用四个或更多条件结构，请将其导出到不同的方法（你以后会学习方法）。\n\
    \n下面的代码将展示嵌套“if”语句是如何工作的：\n\n```csharp\nint a = 10;\nint b = 20;\n\nif (a > b)\n\
    {\n    Console.WriteLine(\"a is greater than b\");\n}\nelse\n{\n    if (a < b)\n\
    \    {\n        Console.WriteLine(\"a is less than b\");\n    }\n    else\n  \
    \  {\n        Console.WriteLine(\"a is equal to b\");\n    }\n}\n```\n\n# Switch-Case\
    \ 语句\n\n程序员在可能的答案很多的情况下使用 switch-case 语句。以下是 switch-case 语句的语法：\n\n```csharp\n\
    switch (selector) {\n    case first_integer:\n        statements;\n        break;\n\
    \    case second_integer:\n        statements;\n        break;\n    default:\n\
    \        statements;\n        break;\n}\n```\n\n基本上，选择器是返回可用值的表达式（即你可以比较或处理的值）。“switch”关键字将选择器的值与各个“case”进行比较。如果选择器的值与某个\
    \ case 匹配，分配给该 case 的语句将运行。然而，如果没有匹配，程序将执行默认语句/语句（如果有）。这意味着程序在运行任何语句之前会先分析选择器。\n\
    \n"
