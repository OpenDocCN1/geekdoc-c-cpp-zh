- md: "\n# Chapter 8: The Methods of the C# Language\n\nThis chapter will focus on\
    \ the C# methods. Here, you'll learn how to declare and utilize methods in your\
    \ own programs. You need to memorize the lessons contained in this chapter if\
    \ you want to be an effective C# programmer in just 7 days.\n\n## Methods – The\
    \ Basics\n\nFor most programmers, methods are core aspects of any program. Methods\
    \ can solve problems, accept user inputs (known as parameters), and produce results.\n\
    \nMethods complete their tasks by representing the data conversions done by the\
    \ program. Additionally, methods are the areas where the actual processes are\
    \ completed. This is the main reason why C# programmers consider methods as the\
    \ basic units of any computer program.\n\n## The Benefits Offered by Methods\n\
    \nIn this section, you'll discover the major benefits offered by C# methods. After\
    \ reading this material, you'll know why you should use these tools in writing\
    \ your programs.\n\n### Better Structure and Code Readability\n\nProgramming experts\
    \ claim that you should use methods while writing computer programs. Methods,\
    \ even the simplest ones, can improve the structure and readability of your C#\
    \ codes.\n\nHere's an important fact that you need to know: programmers spend\
    \ 20% of their time on writing and checking their computer program. The remaining\
    \ 80% is spent on maintaining and improving the software. Obviously, you'll have\
    \ an easy time working on your program if your codes are readable and well-structured.\n\
    \n### Prevention of Redundant Codes\n\nMethods can help you avoid redundant codes\
    \ in your programs. Redundant or duplicated codes often produce undesirable results\
    \ in computer applications.\n\n### Better Code Repetition\n\nThis benefit is closely\
    \ related to the previous one. If your program needs to use a certain code fragment\
    \ multiple times, it's an excellent idea to transfer the said fragment into a\
    \ C# method. You can invoke methods multiple times, which means you can repeat\
    \ important codes without retyping them.\n\n## Declaring, Implementing, and Invoking\
    \ C# Methods\n\nAt this point, you need to know the processes that you can perform\
    \ on an existing method. These processes are:\n\n- Declaration – In this process,\
    \ you will link a method to a program. This process allows you to call the method\
    \ in any part of your program.\n- Implementation – This process involves entering\
    \ codes to complete a certain task. The codes involved here exist inside the method\
    \ you're using.\n- Invocation – This is the process of calling a declared method.\
    \ Here, you’ll use the method to solve a problem or perform an action.\n\n## Method\
    \ Declarations\n\nIn C#, you need to declare methods inside a class. Additionally,\
    \ you're not allowed to “nest” methods (i.e. write a method inside the body of\
    \ another method). The perfect example for this is Main(), the method you’ve used\
    \ multiple times. The code given below will illustrate this:\n\n```\nclass DeclaringMethods\n\
    {\n    static void Main()\n    {\n        System.Console.WriteLine(\"Hi C#!\"\
    );\n    }\n}\n```\n\n## The Syntax\n\nUse the following syntax when declaring\
    \ a method:\n\n```\nstatic data_type_of_the_result name_of_method (list_of_parameters)\n\
    ```\n\nLet’s analyze this syntax using the Main() method (i.e. static void Main()).\
    \ Main() uses “void” as its return type since it doesn’t generate any result.\
    \ The word “Main\" serves as its name. The parentheses, on the other hand, act\
    \ as containers for the parameters that the programmer will provide.\n\nImportant\
    \ Note: You have to follow this syntax when writing a C# program. Don’t change\
    \ the placement of the method’s parts.\n\nC# doesn’t require you to include parameters\
    \ in your declarations. That means you can leave the parentheses empty (e.g. Main()).\n\
    \n## The Method’s Name\n\nYou need to indicate the method’s name during declarations,\
    \ invocations, or implementations. Here are the rules that you need to remember\
    \ when naming your methods:\n\n- Make sure that the initial letter is in uppercase.\n\
    - Begin each word with an uppercase letter (e.g. SampleMethod, NewMethod, MainLine,\
    \ etc.).\n- Use verbs and nouns as names of methods.\n\nImportant Note: The rules\
    \ discussed above are completely optional. Follow these rules if you want to have\
    \ excellent structure and readability in your C# codes.\n\n## Method Implementations\n\
    \nDeclaring a method isn’t enough. You also need to implement your methods if\
    \ you want them to run inside your programs. Programmers use the term “body” when\
    \ referring to the implementation of a method.\n\n### The Body\n\nYou’ll find\
    \ the method’s body inside a pair of curly braces. This body consists of commands,\
    \ expressions, and statements that you want to execute. Thus, the body is an important\
    \ part of any method.\n\nImportant Note: Keep in mind that you cannot nest methods\
    \ in C#. Don’t write methods inside other methods.\n\n## Method Invocations\n\n\
    Basically, this is the process of running the statements within the method’s body.\
    \ Invoking a method is easy and simple: you just have to indicate its name, add\
    \ a pair of curly braces, and terminate the line using a semicolon. Here’s the\
    \ syntax that you should use:\n\n```\nname_of_method();\n```\n\nThe sample code\
    \ given below will show you how to invoke a method:\n\n```\nclass Animals\n{\n\
    \    static void Main()\n    {\n        Console.WriteLine(\"I love dogs.\");\n\
    \    }\n}\n```\n\nIf you'll compile and execute that code, your command prompt\
    \ will print the following message:\n\nI love dogs.\n\n## The Places Where You\
    \ Can Invoke a Method\n\nC# allows you to invoke methods in the following areas:\n\
    \n- Inside the program's main method (i.e. Main()).\n- Inside another method.\n\
    - Inside the method's own body. This technique is called “recursion”.\n\n## Conclusion\n\
    \nThank you again for downloading this book!\nI hope this book was able to help\
    \ you become a skilled C# programmer in just a few days.\nThe next step is to\
    \ continue writing your own programs using C#.\n\nFinally, if you enjoyed this\
    \ book, then I ’d like to ask you for a favor, would you be kind enough to leave\
    \ a review for this book on Amazon? It ’d be greatly appreciated!\nThank you and\
    \ good luck!\n"
  mdcn: "\n\n# 第 8 章：C# 语言的方法\n\n本章将重点介绍 C# 方法。在这里，你将学习如何在自己的程序中声明和利用方法。如果你想在 7 天内成为一名高效的\
    \ C# 程序员，你就需要记住本章包含的课程。\n\n## 方法——基础知识\n\n对于大多数程序员来说，方法是任何程序的核心方面。方法可以解决问题、接受用户输入（称为参数）并产生结果。\n\
    \n方法通过表示程序所执行的数据转换来完成其任务。此外，方法是完成实际过程的区域。这就是为什么 C# 程序员将方法视为任何计算机程序的基本单元的主要原因。\n\
    \n## 方法提供的优势\n\n在本节中，你将发现 C# 方法提供的主要优势。在读完这些材料后，你将知道为什么在编写程序时应该使用这些工具。\n\n###\
    \ 更好的结构和代码可读性\n\n编程专家声称，编写计算机程序时应该使用方法。即使是最简单的方法，也能提高 C# 代码的结构和可读性。\n\n这里有一个你需要知道的重要事实：程序员花费了\
    \ 20% 的时间在编写和检查计算机程序上。剩下的 80% 时间用于维护和改进软件。显然，如果你的代码是可读且结构良好的，你工作程序时将会变得轻松。\n\n\
    ### 防止冗余代码\n\n方法可以帮助你避免程序中的冗余代码。冗余或重复的代码通常会在计算机应用程序中产生不理想的结果。\n\n### 更好的代码重复\n\
    \n这一优势与前一个密切相关。如果你的程序需要多次使用某个代码片段，将该片段转换为 C# 方法将是一个极佳的主意。你可以多次调用方法，这意味着你无需重新输入即可重复重要的代码。\n\
    \n## 声明、实现和调用 C# 方法\n\n此时，你需要了解对现有方法可以执行的操作过程。这些过程包括：\n\n- 声明——在这个过程中，你将一个方法链接到程序中。此过程允许你在程序的任何部分调用该方法。\n\
    - 实现——此过程涉及输入代码以完成特定任务。这里涉及的代码存在于正在使用的方法内部。\n- 调用——这是调用已声明方法的过程。在这里，你将使用方法来解决问题或执行操作。\n\
    \n## 方法声明\n\n在 C# 中，你需要在类内部声明方法。此外，你不允许“嵌套”方法（即在另一个方法的体内部编写方法）。最完美的例子就是你多次使用的\
    \ Main() 方法。下面的代码将说明这一点：\n\n```\nclass DeclaringMethods\n{\n    static void Main()\n\
    \    {\n        System.Console.WriteLine(\"Hi C#!\");\n    }\n}\n```\n\n## 语法\n\
    \n在声明方法时使用以下语法：\n\n```\nstatic data_type_of_the_result name_of_method (list_of_parameters)\n\
    ```\n\n让我们使用 Main() 方法（即 static void Main()）来分析此语法。Main() 使用“void”作为其返回类型，因为它不产生任何结果。“Main”一词作为它的名称。而括号作为程序员将提供的参数的容器。\n\
    \n重要提示：在编写 C# 程序时必须遵循此语法。不要更改方法各个部分的顺序。\n\nC# 并不要求你在声明中包含参数。这意味着你可以让括号为空（例如 Main()）。\n\
    \n## 方法名称\n\n在声明、调用或实现期间，你需要指定方法的名称。以下是你在命名方法时需要记住的规则：\n\n- 确保首字母大写。\n- 每个单词的首字母都用大写字母（例如\
    \ SampleMethod, NewMethod, MainLine, 等）。\n- 使用动词和名词作为方法的名称。\n\n重要提示：上述讨论的规则完全可选。如果你希望你的\
    \ C# 代码具有极佳的结构和可读性，请遵循这些规则。\n\n## 方法实现\n\n声明方法是不够的。如果你想让它们在程序中运行，还需要实现你的方法。程序员在提到方法的实现时使用“体”一词。\n\
    \n### 方法体\n\n你将在一对括号内找到方法体。此体由你想要执行的命令、表达式和语句组成。因此，体是任何方法的重要部分。\n\n重要提示：记住在 C#\
    \ 中你不能嵌套方法。不要在其他方法内部编写方法。\n\n## 方法调用\n\n基本上，这是运行方法体内语句的过程。调用方法简单而容易：你只需要指定它的名称，添加一对括号，并使用分号结束行。以下是你应该使用的语法：\n\
    \n```\nname_of_method();\n```\n\n下面的示例代码将向你展示如何调用方法：\n\n```\nclass Animals\n{\n\
    \    static void Main()\n    {\n        Console.WriteLine(\"I love dogs.\");\n\
    \    }\n}\n```\n\n如果你编译并执行该代码，你的命令行提示符将打印以下消息：\n\nI love dogs.\n\n## 你可以调用方法的地方\n\
    \nC# 允许你在以下区域调用方法：\n\n- 在程序的主方法内部（即 Main()）。\n- 在另一个方法内部。\n- 在方法自身的体内部。这种技术被称为“递归”。\n\
    \n## 结论\n\n再次感谢你下载这本书！\n我希望这本书能够帮助你在短短几天内成为一名熟练的 C# 程序员。\n下一步是继续使用 C# 编写你自己的程序。\n\
    \n最后，如果你喜欢这本书，我想请你帮个忙，你是否愿意在亚马逊上给这本书留个评价？将不胜感激！\n感谢并祝你好运！\n\n"
