    \n## Chapter 1: The Core Concepts of C#\n\nAccording to computer experts, the\
    \ best way to learn a programming language is by writing and analyzing codes.\
    \ Thus, you'll write an actual computer program before studying the language itself.\
    \ This approach will help you to understand how C# works. Also, you'll become\
    \ familiar with the syntax and structures of this language.\n\n### Your First\
    \ Program\n\nHere's the code that you need to:\n\n```csharp\nclass HelloCSharp\n\
    {\n    static void Main(string[] args)\n    {\n        System.Console.WriteLine(\"\
    Hello C#\");\n    }\n}\n```\n\nThis program prints \"Hello, C#\" onto your computer's\
    \ default output device. It's still a \"raw\" program so you can't run it yet.\
    \ For, let's analyze its structure. The next section will teach you how to compile\
    \ and run programs using a command prompt and a programming environment.\n\n####\
    \ How Does It Work?\n\nThis sample program consists of three parts:\n\n- The class\
    \ definition;\n- The method definition; and\n- The method's contents.\n\nLet's\
    \ discuss each part in detail:\n\n**The Class Definition** – The initial line\
    \ of the program defines a class named HelloCSharp. The most basic class definition\
    \ has two sections: (1) the word \"class\" and (2) the name of the new class.\
    \ In this example, HelloCSharp serves as the class's name. You'll find the contents\
    \ of the class inside the pair of braces { } .\n\n**The Method Definition** –\
    \ This part is located at the third line of the program. Here, you defined a method\
    \ named Main(). All C# programs use the main() method as their starting point.\
    \ Here's the syntax that you need to use:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n```\n\nAs you can see, Main() needs to be void and static. The arguments\
    \ (i.e. the part inside parentheses) are completely optional. That means you can\
    \ simplify the Main() function into:\n\n```csharp\nstatic void Main()\n```\n\n\
    **The Method’s Contents** – You'll find the contents of the class after its name.\
    \ In general, a pair of braces encloses these contents. The sample program uses\
    \ System.Console.WriteLine() to display message on your console.\n\n## The Rules\
    \ To Remember When Writing Codes\n\n### C# – A Case-Sensitive Language\n\nThis\
    \ language is case-sensitive. That means you need to be careful with capitalization\
    \ when typing C#. Basically, C# treats “power” and “Power” as different objects.\n\
    \n### Use the Proper Format\n\nYou need to add tabs, spaces, and newlines to your\
    \ code to improve its readability. These characters, which are ignored by the\
    \ C# compiler, give an excellent structure to your codes.\n\nFor instance, you\
    \ may remove the newline characters from HelloCSharp code:\n\n```csharp\nclass\
    \ HelloCSharp{static void Main() {System.Console.WriteLine(\"Hello C!\");}}\n\
    ```\n\nAs an alternative, you may remove the tab characters from it:\n\n```csharp\n\
    class HelloCSharp\n{\n    static void Main()\n    {\n      System.Console.WriteLine(\"\
    Hello C!\");\n    }\n}\n```\n\nThe last two examples work fine in terms of compilation\
    \ and program execution. However, they are difficult to analyze, modify, and maintain.\n\
    \n#### How to Format Codes\n\nHere are the rules that you need to follow:\n\n\
    - You indent methods within the class definition. C# allows you to use any number\
    \ of tab characters (i.e. the character you get after hitting the Tab key of your\
    \ keyboard) when formatting source codes.\n- You should indent the method's contents\
    \ within its own definition.\n- Place the opening brace (i.e. { ) right after\
    \ the class or method to which it belongs. Also, it would be best if it will be\
    \ the only character on its line.\n- Make sure that the closing brace (i.e. }\
    \ ) is vertically aligned with the opening brace.\n- The names of your class should\
    \ begin with an uppercase letter.\n- The names of your variables should start\
    \ with a lowercase letter.\n- The names of your methods should begin with an uppercase\
    \ letter.\n- Indent codes that are written inside another.\n\n## Class Names\n\
    \nIn C#, each program has one or more class definitions. Programmers often store\
    \ each class definition inside a separate file that corresponds to the class's\
    \ name. Also, the extension of these files should be “.cs”. You can compile different\
    \ classes into a single file without experiencing any technical problems. However,\
    \ you'll have a hard time navigating your codes.\n\n## More Information about\
    \ C#\n\nThe C# programming language is advanced, modern, multipurpose, and object-\n"
