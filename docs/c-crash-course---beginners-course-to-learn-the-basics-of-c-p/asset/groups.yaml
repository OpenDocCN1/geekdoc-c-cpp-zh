    \ C# 中，数据转换可以是隐式的也可以是显式的。\n\n每个 C# 表达式都有数据类型。这种数据类型是由表达式内部使用的字面量、变量、值和结构产生的。基本上，你可能会使用一个类型与情况不兼容的表达式。当这种情况发生时，你会得到以下结果之一：\n\
