- md: "\n# Chapter 7: The Loop Statements\n\nThis chapter will teach you how to use\
    \ loop statements. As a programmer, you'll use a loop statement to run certain\
    \ code blocks repeatedly. Loops play an important part in C# programming, you\
    \ should study this material carefully as well if you want to master this language\
    \ in 7 days.\n\n## Loops – The Basics\n\nWhile creating programs, you often need\
    \ to execute code sequences multiple times. Typing the same blocks of code several\
    \ times can be extremely boring. Thus, you need to find a quick and simple way\
    \ to repeat codes. Fortunately, the C# language supports loop statements.\n\n\
    A loop is a tool that runs code fragments repeatedly. You can use it to run codes\
    \ for a certain number of times or as long as a given condition is fulfilled.\
    \ C# offers types of loop statements. Let's analyze each type in detail:\n\n##\
    \ The While Loop\n\nThis is the simplest loop statement in C#. Its syntax is:\n\
    \n```c\nwhile (the_assigned_condition)\n{\n    the_loop's_body;\n}\n```\n\nIn\
    \ this syntax, \"the_assigned_condition\" is an expression that produces a Boolean\
    \ value. This condition dictates how many times the \"body\" will run. The \"\
    body\", the other hand, is the statement (or group of statements) that you want\
    \ to execute.\n\nThe diagram given below will illustrate how while loops work:\n\
    \n![](img/db7fc11d2cefedc4fd84ae99c01f1d63_43_0.png)\n\nWorking on a “while” loop,\
    \ a C# program checks the value of the Boolean expression. If the value is “true”,\
    \ the program will run all of the statements within the loop’s body. Then, the\
    \ program will check the Boolean expression to see its value. If the value is\
    \ still true, the program will rerun the loop’s body and go back to the first\
    \ step (i.e. check the expression’s value). This process will go on until the\
    \ Boolean expression evaluates to false. Once this happens, the program will process\
    \ the code blocks right after the loop.\n\nImportant Note: Your C# program won’t\
    \ run the while loop’s body if the Boolean expression is false. Thus, if the Boolean\
    \ value is false when you launched the program, your in-loop statements will never\
    \ be executed.\n\nThe following example will illustrate how loops work:\n\n```csharp\n\
    int timer = 10;\nwhile (timer >= 0)\n{\n    System.Console.WriteLine(\"Time remaining:\
    \ \" + timer);\n    timer--;\n}\n```\n\nIf you will compile and execute this code,\
    \ your command prompt will print this data:\n\nTime remaining: 10\nTime remaining:\
    \ 9\nTime remaining: 8\nTime remaining: 7\nTime remaining: 6\nTime remaining:\
    \ 5\nTime remaining: 4\nTime remaining: 3\nTime remaining: 2\nTime remaining:\
    \ 1\nTime remaining: 0\n\n## The Break Operator\n\nYou can use \"break\" (a C#\
    \ operator) to exit a loop prematurely. Programmers use this operator if they\
    \ don't want to wait for the loop's natural termination. Basically, a loop will\
    \ end once it encounters a break operator. This situation forces the program to\
    \ jump to the code fragments right after the loop.\n\nIn C#, you can only use\
    \ this operator inside the loop's body. That means “break” will only work while\
    \ the loop is running.\n\n## The Do-While Loop\n\nA do-while loop is almost identical\
    \ to a while loop. The only difference between these loops is that the former\
    \ analyzes the Boolean value after running the loop's body. Thus, you can rest\
    \ assured that your codes will run at least once even if the Boolean expression\
    \ is false. Here is the syntax of the do-while loop:\n\n```csharp\ndo {\n  statements;\n\
    } while (Boolean expression);\n```\n\nDo-while loops work according to this pattern:\n\
    \n![](img/db7fc11d2cefedc4fd84ae99c01f1d63_44_0.png)\n\nThe program will execute\
    \ all of the statements within the loop’s body. Then, it will check the condition\
    \ (i.e. the Boolean expression). If the condition evaluates to true, the program\
    \ will execute the loop’s body again and perform the “value inspection”. This\
    \ process will go on until the condition becomes false. Thus, codes might run\
    \ forever if your assigned condition always evaluates to true.\n\n## The For Loop\n\
    \nIn general, \"for\" loops are more complex than do-while and while loops. However,\
    \ for loops can help you perform difficult tasks using fewer codes. The syntax\
    \ of \"for\" loop is:\n\n```csharp\nfor (initializer; Boolean_expression; update)\n\
    {\n    the_loop_body;\n}\n```\n\nA “for” loop has an initializer (i.e. the initial\
    \ value of the counter), a Boolean expression, a statement that updates the counter,\
    \ and the loop’s body. The \"counter\" (i.e. the initial value assigned to the\
    \ loop) serves as \"for\" loop’s distinctive feature. In most cases, the counter’s\
    \ value increases until it reaches the final value (e.g. 1 to 10). Also, programmers\
    \ usually know how many times the “for\" loop will iterate. You may include one\
    \ or more variables in your \"for\" loops. These variables may be in descending\
    \ or ascending order. When writing programs, you may combine ascending and descending\
    \ variables in a single loop. In addition, for loops support arithmetic operations\
    \ (e.g. addition, multiplication, etc.).\n\nImportant Note: All of the parts of\
    \ for loop are optional. You can create an infinite loop by leaving spaces on\
    \ the syntax:\n\n```csharp\nfor ( ; ) {\n    // Loop body\n}\n```\n\nAt this point,\
    \ you’re ready to learn more about the sections of the for loop.\n\n### The Initialization\n\
    \nA “for” loop can possess an initializing fragment:\n\n```csharp\nfor (double\
    \ sample = 1; ... )\n{\n    // You can use the \"sample\" variable here.\n}\n\
    // The variable here\n```\n\nC# programs execute this fragment right before running\
    \ the loop loop. Often, programmers use an initializing fragment to create a counter\
    \ (also known as “loop variable”) and assign its initial value. C# allows you\
    \ to declare multiple variables using a single initializing fragment.\n\n### The\
    \ Condition\n\nObviously, a for loop needs a conditional expression. Here’s a\
    \ sample:\n\n```csharp\nfor (double sample = 1; sample < 5; )\n{\n    // This\
    \ is the loop’s body.\n}\n```\n\nComputer programs evaluate the conditional expression\
    \ before running the loop’s body. If the result is “true”, the body of the loop\
    \ will run; otherwise, the program will jump to the statements written after the\
    \ current loop.\n\n### The Update Statement\n\nThis is the final part of a for\
    \ loop. Basically, an update statement updates the loop’s counter. Let’s use the\
    \ code snippet above:\n\n```csharp\nfor (double sample = 10; sample > 1; sample--)\n\
    {\n    // This is the loop's body.\n}\n```\n\nThe program executes this part after\
    \ running the loop’s body. Keep in mind that this statement updates the counter's\
    \ value.\n\n### The Loop's Body\n\nThis part consists of C# statements. It can\
    \ utilize the variables declared in the initializing fragment. Check the example\
    \ below:\n\n```csharp\nfor (double sample = 10; sample > 1; sample--)\n{\n   \
    \ System.Console.WriteLine(sample);\n}\n```\n\n### The Continue Operator\n\nIn\
    \ some cases, you need to stop the active iteration without ending the loop itself.\
    \ You can accomplish this task using the C# operator called \"continue\". The\
    \ example given below will illustrate how this works:\n\n```csharp\nint n = int.Parse(Console.ReadLine());\n\
    int sum = 0;\nfor (int i = 1; i <= n; i += 2)\n{\n    if (i % 7 == 0)\n    {\n\
    \        continue;\n    }\n    sum += i;\n}\nConsole.WriteLine(\"sum = \" + sum);\n\
    ```\n\nThis code computes the total of all the odd numbers within the range (1\
    \ to n), which produces a remainder when divided by 7.\n\n## The “Foreach” Loop\n\
    \nJust recently, C# introduced the concept of “foreach” loops (i.e. extended for\
    \ loops). This loop is also available in other programming languages such as C,\
    \ VB, C++, etc. With this programming tool, you can run all of the elements of\
    \ a list, array, or other groups of values. A “foreach” loop takes all of the\
    \ existing elements even in non-indexed data groups.\n\nWhen writing this kind\
    \ of loop, use the following syntax:\n\n```csharp\nforeach (type name_of_variable\
    \ in name_of_group) {\n    the_statements;\n}\n```\n\nAs you can see, this loop\
    \ is much simpler than a typical for loop. A foreach loop can help you scan all\
    \ of the objects inside a collection quickly. It’s no surprise that countless\
    \ programmers use this loop in writing their deodes.\n\n## The Nested For Loop\n\
    \nC# allows you to place a for loop inside another for loop. The loop at the innermost\
    \ part of the code runs the most number of times. The one at the outermost section,\
    \ on the other hand, gets the least number of repetitions. You should use the\
    \ following syntax when \"nesting\" for loops:\n\n```csharp\nfor (initializing_fragment,\
    \ condition, update_statement) {\n    for (initializing_fragment, condition, update_statement)\
    \ {\n        statements;\n    }\n}\n```\n\nHere, the program runs the initial\
    \ for loop, executes its body, and triggers the nested loop. The program will\
    \ check the second loop’s condition and execute the codes inside until the evaluation\
    \ becomes false. Then, the program will make the necessary adjustments on the\
    \ loops’ counters. The program will repeat the entire process until all of the\
    \ conditions evaluate to false."
  mdcn: "\n\n# 第 7 章：循环语句\n\n本章将教你如何使用循环语句。作为一名程序员，你将使用循环语句反复运行某些代码块。循环在 C# 编程中起着重要作用，如果你想在\
    \ 7 天内掌握这门语言，你应该仔细学习这些材料。\n\n## 循环 – 基础\n\n在创建程序时，你经常需要多次执行代码序列。多次输入完全相同的代码块会非常无聊。因此，你需要找到一种快速简单的方法来重复代码。幸运的是，C#\
    \ 语言支持循环语句。\n\n循环是一种重复运行代码片段的工具。你可以用它运行指定次数的代码，或者在满足给定条件时一直运行。C# 提供了多种类型的循环语句。让我们详细分析每类型：\n\
    \n## While 循环\n\n这是 C# 中是最简单的循环语句。它的语法如下：\n\n```csharp\nwhile (the_assigned_condition)\n\
    {\n    the_loop's_body;\n}\n```\n\n在此语法中，“the_assigned_condition”是一个产生布尔值的表达式。该条件决定了“循环体”运行的次数。而“循环体”是你想要执行的语句（或语句组）。\n\
    \n下面的图将说明 while 循环是如何工作的：\n\n![](img/db7fc11d2cefedc4fd84ae99c01f1d63_43_0.png)\n\
    \n在执行“while”循环工作时，C# 程序会检查布尔表达式的值。如果值为“true”，程序将运行循环体内的所有语句。然后，程序将检查布尔表达式以查看其值。如果值仍然为\
    \ true，程序将重新运行循环体并返回第一步（即检查表达式的值）。这个过程将一直持续，直到布尔表达式求值为为 false。一旦发生这种情况，程序将处理循环紧后的代码块。\n\
    \n重要提示：如果布尔表达式为 false，你的 C# 程序将不会运行 while 循环的体。因此，如果你在启动程序时布尔值为 false，你的循环内语句将永远不会被执行。\n\
    \n下面的示例将说明循环是如何工作的：\n\n```csharp\nint timer = 10;\nwhile (timer >= 0)\n{\n   \
    \ System.Console.WriteLine(\"Time remaining: \" + timer);\n    timer--;\n}\n```\n\
    \n如果你编译并执行此代码，你的命令行提示符将打印此数据：\n\nTime remaining: 10\nTime remaining: 9\nTime remaining:\
    \ 8\nTime remaining: 7\nTime remaining: 6\nTime remaining: 5\nTime remaining:\
    \ 4\nTime remaining: 3\nTime remaining: 2\nTime remaining: 1\nTime remaining:\
    \ 0\n\n## Break 运算符\n\n你可以使用 \"break”（一个 C# 运算符）来提前退出循环。如果程序员不想等待循环的自然结束，他们就会使用此运算符。基本上，循环一旦遇到\
    \ break 运算符就会结束。这种情况下迫迫程序跳转到循环紧后的代码片段。\n\n在 C# 中，你只能在循环体内部使用此运算符。这意味着“break”只有在循环运行时才会起作用。\n\
    \n## Do-While 循环\n\ndo-while 循环与 while 循环几乎相同。这些循环之间唯一的区别在于，前者在运行循环体之后分析布尔值。因此，你可以放心，即使布尔表达式为\
    \ false，你的代码也会至少运行一次。以下是 do-while 循环的语法：\n\n```csharp\ndo {\n  statements;\n}\
    \ while (Boolean expression);\n```\n\ndo-while 循环按照这种模式工作：\n\n![](img/db7fc11d2cefedc4fd84ae99c01f1d63_44_0.png)\n\
    \n程序将执行循环体内的所有语句。然后，它将检查条件（即布尔表达式）。如果条件求值为 true，程序将再次执行循环体并执行“值检查”。这个过程将一直持续，直到条件变为\
    \ false。因此，如果你的分配的条件始终求值为 true，代码可能会永远运行。\n\n## For 循环\n\n通常情况下，“for”循环比 do-while\
    \ 和 while 循环更复杂。然而，for 循环可以帮助你用更少的代码完成困难的任务。“for” 循环的语法为：\n\n```csharp\nfor (initializer;\
    \ Boolean_expression; update)\n{\n    the_loop_body;\n}\n```\n\n一个“for”循环有一个初始化器（即\
    \ 计数器的初始值）、一个布尔表达式、一个更新计数器的语句以及循环体。“计数器”（即分配给循环的初始值）是“for”循环的独特特征。在大多数情况下，计数器的值会一直增加直到达到最终值（例如从\
    \ 1 到 10）。此外，程序员通常知道“for”循环将迭代多少次。你可以在你的“for”循环中包含一个或多个变量。这些变量可以是降序或升序的。在编写程序时，你可以在单个循环中组合升序和降序变量。此外，for\
    \ 循环支持算术运算（例如加法、乘法等）。\n\n重要提示：for 循环的所有部分都是可选的。你可以通过在语法中留空来创建一个无限循环：\n\n```csharp\n\
    for ( ; ) {\n    // Loop body\n}\n```\n\n到此时，你已经准备好学习更多关于 for 循环各个部分的内容了。\n\n\
    ### 初始化\n\n“for”循环可以拥有一个初始化片段：\n\n```csharp\nfor (double sample = 1; ... )\n{\n\
    \    // 你可以在这里使用 \"sample\" 变量。\n}\n// 这里的变量\n```\n\nC# 程序在运行循环之前会执行此片段。通常，程序员使用初始化片段来创建一个计数器（也称为“循环变量”）并为其分配初始值。C#\
    \ 允许你使用单个初始化片段声明多个变量。\n\n### 条件\n\n显然，for 循环需要一个条件表达式。这里有一个示例：\n\n```csharp\n\
    for (double sample = 1; sample < 5; )\n{\n    // 这是循环的体。\n}\n```\n\n计算机程序在运行循环体之前会评估条件表达式。如果结果为“true”，循环体将运行；否则，程序将跳转到写在当前循环之后的语句。\n\
    \n### 更新语句\n\n这是 for 循环的最后部分。基本上，更新语句更新循环计数器。让我们使用上面的代码片段：\n\n```csharp\nfor (double\
    \ sample = 10; sample > 1)\n{\n    // 这是循环体\n}\n```\n\n程序在运行循环体后执行此部分。记住此语句更新计数器的值。\n\
    \n### 循环体\n\n这部分由 C# 语句组成。它可以利用在初始化片段中声明的变量。查看示例：\n\n```csharp\nfor (double sample\
    \ = 10; sample--)\n{\n    Console.WriteLine(sample);\n}\n```\n\n### Continue 运算符\n\
    \n在某些情况下，你需要停止迭代但不结束循环本身。可以使用名为 \"continue\" 的 C# 运算符完成此任务。下面的示例将说明它是如何工作的：\n\n\
    ```csharp\nint n = int.Parse(Console.ReadLine());\nint sum = 0;\nfor (int i =\
    \ 1; i <= n; i += 2)\n{\n    if (i % 7 == 0)\n    {\n        continue;\n    }\n\
    \    sum += i;\n}\nConsole.WriteLine(\"sum = \" + sum);\n```\n\n这段代码计算 1 到 n 范围内所有不能被\
    \ 7 整除的奇数的和。\n\n## Foreach 循环\n\n最近，C# 引入了 foreach 循环的概念（即扩展循环）。这种循环也适用于 C、VB、C++\
    \ 等编程语言。使用这种编程工具，你可以运行列表、数组或其他值组的所有元素。“foreach”循环可以处理非索引数据组中的所有现有元素。\n\n编写这种循环时，使用以下语法：\n\
    \n```csharp\nforeach (type name_of_variable in name_of_group) {\n    the_statements;\n\
    }\n```\n\n如你所示，这种循环比典型的 for 循环简单得多。foreach 循环可以帮助你快速扫描集合中的所有对象。无数程序员在编写代码时使用这种循环并不意外。\n\
    \n## 嵌套 For 循环\n\nC# 允许将一个 for 循环放在另一个 for 循环内部。代码最内层的循环运行次数最多。而最外层的循环运行次数最少。在“嵌套”for\
    \ 循环时，你应该使用以下语法：\n\n```csharp\nfor (initializing_fragment, condition, update_statement)\
    \ {\n    for (initializing_fragment, condition, update_statement) {\n        statements;\n\
    \    }\n}\n```\n"
