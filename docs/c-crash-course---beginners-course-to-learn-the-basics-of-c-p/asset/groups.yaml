    \n## 目录\n\n- 引言\n- 第一章：C# 的核心概念\n- 第二章：C# 数据类型、变量和字面量\n- 第三章：C# 语言的运算符\n- 第四章：数据类型转换\n\
    - 第五章：控制台\n- 第六章：C# 的条件语句\n- 第七章：循环语句\n- 第八章：C# 方法\n- 结论\n\n根据计算机专家，学习编程语言的最佳方法是编写和分析代码。因此，在学习语言本身之前，你将编写一个计算机程序。这种方法将帮助你理解\
    \ C# 如何工作。此外，你将熟悉该语言的语法和结构。\n\n### 你的第一个程序\n\n这里是你需要的代码：\n\n```csharp\nclass HelloCSharp\n\
    {\n    static void Main(string[] args)\n    {\n        System.Console.WriteLine(\"\
    Hello C#\");\n    }\n}\n```\n\n此程序在你的计算机的默认输出设备上打印“Hello, C#”。它仍然是一个“原始”程序，所以你还不能运行它。例如，让我们分析它的结构。下一节将教你如何使用命令提示符和编程环境编译并运行程序。\n\
    \n#### 它是如何工作的？\n\n此示例程序由三部分组成：\n\n- 类定义；\n- 方法定义；以及\n- 方法的内容。让我们详细讨论每个部分：\n\n\
    **类定义** – 程序的第一行定义了一个名为 HelloCSharp 的类。最基础的类定义包含两个部分：(1) 单词“class”和 (2) 新类的名称。在这个示例中，HelloCSharp\
    \ 充类名。你将在大括号 `{ }` 内部找到类的内容。\n\n**方法定义** – 这部分位于程序的第三行。在这里，你定义了一个名为 `Main()` 的方法。所有的\
    \ C# 程序都使用 `main()` 方法作为起点。是你需要使用的语法：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n```\n\n如你所见，`Main()` 需要是 `void` 和 `static`。参数（即括号内的部分）是完全可选的。这意味着你可以将\
    \ `Main()` 函数简化为：\n\n```csharp\nstatic void Main()\n```\n\n**方法的内容** – 你将在类名之后找到类的内容。通常，一对大括号括起这些内容。示例程序使用\
    \ `System.Console.WriteLine()` 来显示信息。\n\n## 编写代码时记住的规则\n\n### C# – 大写敏感语言\n\n\
    这种语言是大写敏感的。这意味着在输入 C# 时需要注意大小写。基本上，C# 将“power”和“Power”视为不同的对象。\n\n### 使用正确的格式\n\
    \n你需要为代码添加制表符、空格和换行符以提高可读性。这些字符被 C# 编译器忽略，但为代码提供了良好的结构。\n\n例如，你可以从 HelloCSharp\
    \ 代码中删除换行符：\n\n```csharp\nclass HelloCSharp{static void Main() {System.Console.WriteLine(\"\
    Hello C!\");}}\n```\n\n另一种方案，你可以从中删除制表符：\n\n```csharp\nclass HelloCSharp\n{\n\
    \    static void Main()\n    {\n      System.Console.WriteLine(\"Hello C!\");\n\
    \    }\n}\n```\n\n后两个例子在编译和程序执行方面运行良好。但它们难以分析、修改和维护。\n\n#### 如何格式化代码\n\n以下是你需要遵循的规则：\n\
    \n- 在类定义内部缩进方法。C# 允许使用任意数量的制表符（即按下键盘上的 Tab 键得到的字符）来格式化源代码。\n- 你应该在方法定义内部缩进方法的内容。\n\
    - 将左大括号 `{` 放在它所属的类或方法之后。此外，如果它是该行的唯一字符，则最好。\n- 确保右大括号 `}` 与左大括号对齐。\n- 类名应以大写字母开头。\n\
    - 变量名应以小写字母开头。\n- 方法名也应以大写字母开头。\n- 缩进写在另一个结构内部的代码。\n\n"
