    type, requires the “object” keyword during its declaration, may accept any value
    from other data types. You may think of objects as addresses that point to certain
    parts of your computer’s memory.


    ## Real Type – Floating Points


    In the C# language, “real type” refers to the actual numbers you’ve learned in
    mathematics. A floating-point real data type can be either “float” or “double”.


    - 1. Programmers call this subtype “single-precision real integer”. default value
    of a float number is 0.0F (the “F” at the end is not case-sensitive). The letter
    “F” indicates that the value is a “float”.

    - 2. Programmers use the term “double-precision real integer” when referring to
    this subtype. Its default value is 0.0D (i.e. the letter “d” at the end is not
    case-sensitive). C# automatically tags real numbers as “double” so you don’t really
    need to add “d” at the end of the real value.


    ## Real Type – Decimals


    This programming language supports “decimal arithmetic”, a mathematical approach
    that uses decimal values to represent numbers. The main advantage of this approach
    is that it preserves its accuracy regardless of how it works.


    C# uses the “decimal” data type to represent this kind of real number. This data
    type is 128 bits long and is accurate up to the 29th decimal value. Because of
    its excellent accuracy, these are used by programmers for financial computations
    (e.g. payments, taxes, interest, etc.).


    ## Integers


    This data type contains of 8 subtypes, which are:


    - SBYTE – An sbyte is a signed integer that is 8 bits long. It means it can contain
    up to 256 values (i.e. $2^8$). Additionally, sbytes can be either negative or
    positive.

    - BYTE – This subtype contains unsigned integers that are 8 bits long. It is almost
    identical to sbyte. The only difference is that byte can never be negative.

    - SHORT – These integers are signed and 16-bits long.

    - USORT – These are signed integers whose length is 16 bits.

    - INT – This is probably the most popular data type in C#. Programmers use this
    data type because it is perfectly compatible with 32-bit processors and big enough
    for typical computations. It is a signed integer whose length is 32 bits.

    - UINT – This 32-bit integer is unsigned. Thus, it can only be positive.

    - LONG – This is 64 bits long. It can be either positive or negative.

    - ULONG – This is similar to “long” integers. The only difference is that “ulong”
    can only assume positive values.


    ## Strings


    A string is a set or sequence of characters. C# requires you to use “string” (i.e.
    a keyword) when declaring values that belong to this data type. You have to write
    each string between a pair of quotation marks. This language allows you to perform
    various operations on strings (e.g. concatenation, character replacement, character
    search, etc.).


    ## The Variables


    You can use a variable to store, retrieve, and modify changeable data. As a programmer,
    you need use variables in storing and processing information.


    ## The Characteristics of a Variable


    A variable has the following characteristics:


    - Name (also known as “Identifier”)

    - Data Type

    - Value (i.e. the information you want to store).


    Variables are sections of computer memory that have a name. They store values
    and allow a computer program to access their contents. You may place a variable
    inside the stack (i.e. the working memory of your computer program) or within
    the program’s dynamic memory.


    Characters, Booleans, and Integers are known as value types since they keep their
    data within the program’s stack. On the other hand, strings, arrays, and objects
    are known as “reference types” because they don’t hold the values inside them.
    Instead, they serve as markers that point to the part of computer memory where
    the data is stored.


    ## How to Name a Variable


    You need to know your variables before using them. The variable''s name serves
    as an identifier; it helps the program in locating and specifying the variable.
    C# allows you to choose variable names freely. However, just like any other language,
    C# has some rules regarding variable names.


    - Variable names must start with a letter or an underscore.

    - They can only contain letters, digits, and underscores.

    - Variable names are case-sensitive (e.g. "MyVar" and "myvar" are different).

    - You cannot use reserved keywords as variable names.

    - Variable names should be descriptive to make the code easier to read.

