    # Standard I/O


    The Standard I/O system is a mechanism developed for UNIX computers. This system
    involves special devices to accept input and produce output.


    If a program is waiting for the user to perform an action or provide information,
    the console will show a cursor. This means the system is in "waiting mode".


    # Input and Output


    Operating systems need to define the standard I/O mechanisms for user-program
    interactions. When launching a console-based application, the code at the program''s
    initialization block needs to work with I/O mechanisms assigned by the OS. This
    code allows the user to interact with the console-based program involved.


    Because of this code, the program can read the user''s input, send information
    to "Console.In" (i.e. C#''s standard stream for inputs), and report problematic
    situations through "Console.Out" (i.e. C#''s standard stream for outputs), and
    "Console.Error" (i.e. C#''s standard stream for error messages).


    Important Note: You''ll learn about C# streams later in this book. This chapter
    will concentrate on the concepts and ideas related to C#''s I/O mechanisms.'
