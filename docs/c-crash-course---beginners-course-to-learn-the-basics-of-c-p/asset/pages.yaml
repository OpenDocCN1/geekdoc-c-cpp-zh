  md: "# Chapter 7: The Loop Statements\n\nThis chapter will teach you how to use\
    \ loop statements. As a programmer, you'll use a loop statement to run certain\
    \ code blocks repeatedly. Loops play an important part in C# programming, you\
    \ should study this material carefully as well if you want to master this language\
    \ in 7 days.\n\n# Loops – The Basics\n\nWhile creating programs, you often need\
    \ to execute code sequences multiple times. Typing the same blocks of code several\
    \ times can be extremely boring. Thus, you need to find a quick and simple way\
    \ to repeat codes. Fortunately, the C# language supports loop statements.\n\n\
    A loop is a tool that runs code fragments repeatedly. You can use it to run codes\
    \ for a certain number of times or as long as a given condition is fulfilled.\
    \ C# offers types of loop statements. Let's analyze each type in detail:\n\n#\
    \ The While Loop\n\nThis is the simplest loop statement in C#. Its syntax is:\n\
    \n```\nwhile (the_assigned_condition)\n{\n    the_loop's_body;\n}\n```\n\nIn this\
    \ syntax, \"the_assigned_condition\" is an expression that produces a Boolean\
    \ value. This condition dictates how many times the \"body\" will run. The \"\
    body\", the other hand, is the statement (or group of statements) that you want\
    \ to execute.\n\nThe diagram given below will illustrate how while loops work:"
  merge: -1
