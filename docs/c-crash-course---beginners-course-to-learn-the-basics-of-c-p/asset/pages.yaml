  md: '# Objects


    Programmers regard objects as the most special type of data in the C# language.
    Basically, objects serve as the parent of other data types within .NET. This data
    type, requires the “object” keyword during its declaration, may accept any value
    from other data types. You may think of objects as addresses that point to certain
    parts of your computer’s memory.


    # Real Type – Floating Points


    In the C# language, “real type” refers to the actual numbers you’ve learned in
    mathematics. A floating-point real data type can be either “float” or “double”.


    +   1. Programmers call this subtype “single-precision real integer”. default
    value of a float number is 0.0F (the “F” at the end is not case-sensitive). The
    letter “F” indicates that the value is a “float”.


    +   2. Programmers use the term “double-precision real integer” when referring
    to this subtype. Its default value is 0.0D (i.e. the letter “d” at the end is
    not case-sensitive). C# automatically tags real numbers as “double” so you don’t
    really need to add “d” at the end of the real value.


    # Real Type – Decimals


    This programming language supports “decimal arithmetic”, a mathematical approach
    that uses decimal values to represent numbers. The main advantage of this approach
    is that it preserves its accuracy regardless of how it works.


    C# uses the “decimal” data type to represent this kind of real number. This data
    type is 128 bits long and is accurate up to the 29th decimal value. Because of
    its excellent accuracy, these are used by programmers for financial computations
    (e.g. payments, taxes, interest, etc.).


    # Integers


    This data type contains of 8 subtypes, which are:


    +   SBYTE – An sbyte is a signed integer that is 8 bits long. It means it can
    contain up to 256 values (i.e. 28). Additionally, sbytes can be either negative
    or positive.


    +   BYTE – This subtype contains unsigned integers that are 8 bits long. It is
    almost identical to sbyte. The only difference is that byte can never be negative.


    +   SHORT – These integers are signed and 16-bits long.'
