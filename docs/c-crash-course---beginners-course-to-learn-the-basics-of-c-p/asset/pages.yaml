  md: '# Values and References


    C# programmers divide data types into two categories: value types and reference
    types.


    A value type exists inside the execution stack of a program. Additionally, it
    holds the value stored by the programmer. The Value Type category consists of
    the Booleans, Characters, and Integers. The memory assigned to these data types
    becomes available once the program finishes its code execution. For instance,
    the variables within the Main() method of your program will be emptied once the
    program is closed.


    A reference type, on the other hand, stores an address (i.e. a reference) in the
    program’s stack. This address points to the location of the needed value. Basically,
    a reference type assigns dynamic memory during its declaration. It also frees
    up some memory the program no longer needs.


    # The Literals


    Literals are the values specified in a program’s source code. The example given
    below will illustrate this idea:


    ```

    bool isdelicious = false;

    short income = 22000;

    char firstletter = ''c'';

    byte ten = 10;

    int prize = 25000;

    ```


    In this example, the literals are false, 22000, ''c'', 10 and 250000. These are
    values that you’ll add directly to the program’s code.


    # The Different Kinds of Literals


    C# supports the following kinds of literals:


    +   * Real

    * Integer

    * String

    * Character

    * Boolean


    Let’s discuss each of these literals in detail:'
