  md: "# The Switch-Case Statement\n\nProgrammers use a switch-case statement in situations\
    \ where the possible answers are numerous. Here’s the syntax of a switch-case\
    \ statement:\n\n```\nswitch (selector) {\n    case first_integer:\n        statements;\n\
    \        break;\n    case second_integer:\n        statements;\n        break;\n\
    \    default:\n        statements;\n        break;\n}\n```\n\nBasically, selectors\
    \ are expressions that return usable values (i.e. values that you can compare\
    \ or process). The “switch” keyword compares the selector’s value against the\
    \ “cases”. If the value of the selector matches that of a case, the statements\
    \ assigned to that case will run. If there’s no match, however, the program will\
    \ execute the default statement/s (if any). That means the program will analyze\
    \ the selector first before running any statement.\n\nImportant Note: Make sure\
    \ that the cases have unique values. If two or more cases share the same value,\
    \ your program will produce undesirable results.\n\nAs you can see, each case\
    \ has a “break” clause. The “break” clause terminates the body of the case to\
    \ which it belongs. C# requires you to add this clause to all of your switch statements.\n\
    \nYou don’t have to place the “default” part at the end of your switch-case statement.\
    \ However, this position is recommended if you want to keep your codes readable."
