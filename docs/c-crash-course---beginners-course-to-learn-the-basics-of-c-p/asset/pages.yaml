  md: "![](img/db7fc11d2cefedc4fd84ae99c01f1d63_43_0.png)\n\nWorking on a “while”\
    \ loop, a C# program checks the value of the Boolean expression. If the value\
    \ is “true”, the program will run all of the statements within the loop’s body.\
    \ Then, the program will check the Boolean expression to see its value. If the\
    \ value is still true, the program will rerun the loop’s body and go back to the\
    \ first step (i.e. check the expression’s value). This process will go on until\
    \ the Boolean expression evaluates to false. Once this happens, the program will\
    \ process the code blocks right after the loop.\n\nImportant Note: Your C# program\
    \ won’t run the while loop’s body if the Boolean expression is false. Thus, if\
    \ the Boolean value is false when you launched the program, your in-loop statements\
    \ will never be executed.\n\nThe following example will illustrate how loops work:\n\
    \n```\nint timer = 10;\nwhile (timer >= 0)\n{\n    System.Console.WriteLine(\"\
    Time remaining: \" + timer);\n    timer--;\n}\n```\n\nIf you will compile and\
    \ execute this code, your command prompt will print this data:"
