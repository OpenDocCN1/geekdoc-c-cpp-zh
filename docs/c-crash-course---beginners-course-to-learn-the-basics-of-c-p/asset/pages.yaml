  md: '# Binary Operators


    These operators work on binary numbers. In the IT world, all of the information
    is expressed as a sequence of zeros and ones. That mean you need to master binary
    operators if you want to be a successful programmer.


    A binary operator works exactly like a logical one. Actually, you may think that
    binary and logical operators use different inputs but conduct the same processes.
    A logical operator uses Boolean values to produce results. A binary operator,
    on the other hand, works on numbers presented as binary digits. Here are the binary
    operators you''ll encounter using C#:


    +   “&” – This is called “Binary AND”. It indicates the position/s where both
    of the operands have “1”..


    +   “^” – Programmers refer to this operator as “Binary Exclusive OR”. It will
    place “1” in each position where the values are different.


    +   “|” – This is the “Binary OR” operator. It indicates the position/s where
    any of the operands have “1”.


    +   “~” – This acts as the negation operator for binary values. Just like “!”,
    it reverses the current value of a variable.


    +   “<<” – This is the “Binary Left Shift” operator. It moves the bits of a binary
    number to the left. This movement depends on the value that you’ll assign (e.g.
    4 << 1, 4 << 3, 4 << 2, etc.).


    # Comparison Operators


    These operators allow you to compare the values inside two operands. Each of these
    operators gives a Boolean value as the final output. Here are the comparison operators
    of the C# language:


    +   “==” – This is the Equality operator. It checks whether the two operands are
    equal (e.g. x == y)


    +   “>” – This operator checks whether the left-hand operand’s value is greater
    than that of the right-hand operand (e.g. x > y).'
