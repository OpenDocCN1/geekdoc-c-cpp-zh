    # Metabolic programming and immune suppression in the tumor microenvironment


    Emily N Armer* and Jeffrey C Rathmill**

    ¹Department of Medicine, Vanderbilt University Medical Center (VUMC), Nashville,
    USA

    ²Vanderbilt Center for Immunology, Vanderbilt University Medical Center (VUMC),
    Nashville, USA

    ³Vanderbilt-Ingram Cancer Center, Vanderbilt University Medical Center (VUMC),
