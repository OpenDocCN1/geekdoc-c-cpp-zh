    https://doi.org/10.1016/j.cell.2023.01.009


    # SUMMARY


    Increased glucose metabolism and uptake are characteristic of many tumors and
    use molecules to clinically diagnose and monitor cancer progression. In addition
    to cancer cells, the tumor microenvironment (TME) encompasses a wide range of
    stromal, innate, and adaptive immune cells. Cooperation and competition between
    these populations support tumor proliferation, progression, metastasis, and immune
    evasion. Cellular heterogeneity leads to metabolic heterogeneity where tumors
    are dependent not only on the TME cellular composition but also on cell states,
    location, and nutrient availability. In addition driving metabolic plasticity
    of cancer cells, altered nutrients and signals in the TME can lead to metabolic
    suppression of effector cells and regulate immune cells. Here we discuss how metabolic
    programming of cells within the TME promotes proliferation, progression, and metastasis.
    We discuss how metabolic heterogeneity may offer therapeutic opportunities to
    overcome immune suppression and augment immunotherapies.


    # INTRODUCTION


    Tumors require an abundance of energy for growth, proliferation, and metastasis.
    To sustain these processes, oncogenic genes drive diverse metabolic pathways,
    including glycolysis, the tricarboxylic acid (TCA) cycle, and other pathways that
    generate essential energy and biosynthetic precursors. It is apparent, however,
    that these pathways are not only for cell growth but for proliferative cells,
    including pro-tumor and anti-tumor immune cells. This shared demand for nutrients
    creates a competitive tumor microenvironment and immune suppression.


    The tumor microenvironment (TME) is composed of many cells that support or resist
    treatment. As the TME includes a diversity of cells, it is metabolically and highly
    active (Figure 1). Cells and resulting tumors populate various regions of the
    TME, in part through support cell populations seeking oxygen and nutrient supply
    in poorly vascularized or highly metabolically active areas. The TME is also shaped
    and altered by accumulation of waste products and inflammation, where nutrients
    are limited. Because nutrients are abundant on systemic and whole-body factors,
    type, location of the tumor within the primary tissue, host diet and nutritional
    scale will affect nutrient availability within the TME. Additionally, metabolic
    plasticity may occur as cells within the TME adapt to different nutrient depending


    availability. Metabolism within the TME supports proliferation of tumor cells
    but also in metastatic disease because metabolic processes influence each stage
    of the metabolic cycle within cancer cells and in the TME as normal cells escape
    and survive.


    This complex landscape can be detrimental for treatment because targeting the
    growth or metastasis of cancer cells can also inhibit or enhance the effectiveness
    of immunotherapies. Conversely, new approaches must specifically target the immune
    cells in turn by interfering with their metabolic pathways. While, immunotherapies
    blocking PD-1 or CTLA-4 can activate anti-T cells in multiple cancer cell types,
    resistance to some therapies often develops after an initial response. The mechanisms
    of resistance are not well understood, but metabolic pathways are fundamentally
    involved in cell fate and cell differentiation, and immunotherapy.


    Improvingotherapotherap and reducing resistance is of high priority, but it requires
    understanding how cells interact and interact with cancer cells in the TME, in
    regard to nutrient shared and resource utilization, to overcome metabolic suppression
    in the TME.

    The diverse metabolic programs of cancer and tumor-associated immune cells may
    explain some failed therapies and provide new avenues to prevent metastasis and
    limit


