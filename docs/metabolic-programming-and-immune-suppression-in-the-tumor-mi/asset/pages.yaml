    # ## METABOLIC HETEROGENEITY


    Proliferating cells require abundant and diverse nutrients to support bioenergetic
    demands, growth and while maintaining cell functions or migratory properties.
    The fuels for these cells come from glucose, glycolysis, and lipolysis. Increased
    glucose uptake that occurs in hypoxia despite the presence of oxygen is referred
    to the “Warburg effect” or aerobic glycolysis. Indeed, glucose uptake in high
    tumors can cause extracellular levels of glucose reduced and elevated. Many factors
    contribute to the turning of tumors to undergo aerobic glycolysis, including oncogenic
    signaling or loss of tumor


