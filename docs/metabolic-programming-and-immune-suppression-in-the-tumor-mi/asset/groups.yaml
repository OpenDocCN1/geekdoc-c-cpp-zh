    # 癌细胞 (Cancer Cell)


    # CellPress


    综述


    # 肿瘤微环境中的代谢重编程与免疫抑制


    Emily N Armer* 和 Jeffrey C Rathmill**

    ¹范斯比德大学医学中心 (VUMC) 医学科，美国纳什维尔

    ²范斯比德免疫学中心，范斯比德大学医学中心 (VUMC)，纳什维尔

    ³范斯比德-Ingram 癌症中心，范斯比德大学医学中心 (VUMC)，纳什维尔

    ⁴病理学、微生物学与免疫科学，范斯比德大学医学中心 (VUMC)，纳什维尔

    *通讯：jeff.rathmill@vanderbilt.com

    https://doi.org/10.1016/j.cell.2023.01.009


    # 摘要


    糖代谢和摄取的增加是许多肿瘤的特征，并可利用分子进行临床诊断和监测癌症进展。除了癌细胞外，肿瘤微环境（TME）还涵盖了广泛的基质、先天性和适应性免疫细胞。这些群体之间的协作与竞争支持肿瘤的增殖、进展、转移和免疫逃逸。细胞异质性导致了代谢异质性，肿瘤不仅依赖于
    TME 的细胞组成，还取决于细胞状态、位置和营养可用性。此外，驱动癌细胞代谢可塑性的同时，TME 中改变的营养和信号可导致效应细胞的代谢抑制并调节免疫细胞。在这里，我们讨论了
    TME 内细胞的代谢重编程如何促进增殖、进展和转移。我们还讨论了代谢异质性如何为克服免疫抑制和增强免疫疗法提供治疗机会。


    # 引言


    肿瘤的生长、增殖和转移需要大量的能量。为了维持这些过程，ic/致癌基因驱动了多种代谢通路，包括糖酵解、三羧酸（TCA）循环以及其他产生必需能量和生物合成前体的通路。然而，显而易见，这些通路不仅用于细胞生长，还用于增殖细胞，包括促肿瘤和抗肿瘤免疫细胞。这种对营养的共同需求创造了竞争性的肿瘤微环境和免疫抑制。


    肿瘤微环境（TME）由许多支持或抵抗治疗的细胞组成。由于 TME 包含多种细胞，因此在代谢上是高度活跃的（图 1）。细胞及产生的肿瘤占据了 TME 的各个区域，部分是通过支持细胞群体在血管化不良或代谢高度活跃的区域寻求氧气和营养供应。TME
    还受到废物产物积累和炎症的塑造和改变，在这些区域营养是有限的。由于系统和全身因素的营养是充足的，肿瘤在原发组织中的类型、位置、宿主饮食和营养状况将影响 TME
    内部的营养可用性。此外，随着 TME 内细胞适应不同的营养可用性，可能会发生代谢可塑性。TME 内的代谢支持肿瘤细胞的增殖，在转移性疾病中也是如此，因为代谢过程影响了癌细胞和
    TME 内代谢循环的每个阶段，随着正常细胞逃逸并存活。


    这种复杂的格局对治疗是有不利的，因为针对癌细胞的生长或转移可能会抑制或增强免疫疗法的有效性。相反，新方法必须通过干扰免疫细胞的代谢通路来反向针对免疫细胞。虽然阻塞
    PD-1 或 CTLA-4 的免疫疗法可以激活多种癌细胞类型的抗 T 细胞，但在初始反应后往往会对某些疗法产生抗性。耐性机制尚不完全清楚，但代谢通路从根本上参与了细胞命运、细胞分化和免疫治疗。


    提高免疫治疗效果并减少耐性是高优先事项，但这需要理解细胞在 TME 中如何与癌细胞相互作用（特别是在营养共享和资源利用方面），以克服 TME 中的代谢抑制。

    癌症和肿瘤相关免疫细胞的多样代谢程序可能解释某些治疗的失败，并为预防转移和限制提供新途径。


    ![](img/33f55c57731d5bd51413de5f6eaeddd6_0_0.png)


    Cancer Cell 41, 2023年3月13日 Elsevier Inc. 421


