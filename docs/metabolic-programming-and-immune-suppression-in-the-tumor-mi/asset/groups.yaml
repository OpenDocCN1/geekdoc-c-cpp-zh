    # 癌症 综述


    ![](img/33f55c57731d5bd51413de5f6eaeddd6_0.png)


    **图 1. TME 中的代谢异质性依赖于位置**

    肿瘤微环境（TME）由许多支持或抵抗治疗的细胞组成。由于 TME 包含多种细胞，因此在代谢上是高度活跃的。细胞及产生的肿瘤占据了 TME 的各个区域，部分是通过支持细胞群体在血管化不良或代谢高度活跃的区域寻求氧气和营养供应。TME
    还受到废物产物积累和炎症的塑造和改变，在这些区域营养是有限的。由于系统和全身因素的营养是充足的，肿瘤在原发组织中的类型、位置、宿主饮食和营养状况将影响 TME
    内部的营养可用性。此外，随着 TME 内细胞适应不同的营养可用性，可能会发生代谢可塑性。TME 内的代谢支持肿瘤细胞的增殖，在转移性疾病中也是如此，因为代谢过程影响了癌细胞和
    TME 内代谢循环的每个阶段，随着正常细胞逃逸并存活。

    糖代谢和摄取的增加是许多肿瘤的特征，并可利用分子进行临床诊断和监测癌症进展。除了癌细胞外，肿瘤微环境（TME）还涵盖了广泛的基质、先天性和适应性免疫细胞。[此处描述](img/33f55c57731d5bd51413de5f6eaeddd6_0.png)
    描述了 TME 中的代谢异质性依赖于位置。糖摄入的增加在肿瘤中由于缺乏营养的，会导致氨基酸（如甘氨酸、天冬氨酸和天冬氨酸）的增加并产生活性氧（ROS）。重要的是，跨细胞的代谢差异会影响
    TME 内的细胞活性。代谢重编程可以导致免疫抑制。我们讨论了 TME 内代谢的多样性如何支持通路并调节免疫功能，以及这些变化为癌症患者打开了治疗窗口。


    ## 代谢异质性


    增殖细胞需要丰富且多样化的营养来支持能量需求、生长并维持细胞功能和迁移特性。这些细胞的燃料来自葡萄糖、糖酵解和脂肪解。在存在氧气的情况下发生的高糖摄入被称为“瓦伯格效应”或有氧糖酵解。事实上，肿瘤的高糖摄入会导致细胞外葡萄糖水平降低或升高。许多因素导致肿瘤进行有氧糖酵解，包括致癌信号或肿瘤缺失，如
    Von Hippel-Lindau (VHL) 或 p53 改变、糖酵解酶的调节或缺氧信号。这些因素是由缺氧驱动的磷酰肌醇醇3-激酶 (PI3Ks) 和肌甲基氧同源物
    (MYC)，直接促进糖酵解的胰岛样生长因子。此外，在肿瘤形成或 VHL 缺失期间发生缺氧，包括 GLUT1、葡萄糖激酶 1 (HK1)、葡萄糖激酶 2 (HK2)
    和丙酮酸激酶结构域1 (PKM2) 以及乳酸脱氢酶 (LDHA) 的激活也会降低代谢活性和 ROS，这些受氧化应激通路调节。


    除了有氧糖酵解，无氧代谢还需要广泛的营养。磷酸戊糖途径（PPP）对于产生烟酰腺嘌呤核酰酸（NADPH）和核糖至关重要，这些用于核苷酸合成、ATP 生成和消除氧化应激。脂质和胆醇也被细胞用于支持肿瘤，它们可以通过游脂肪酸摄取，也可以通过脂肪酸合成和从头合成产生。细胞调节甘氨酸和谷氨酸作为氨基酸的摄取和合成，通过转氨作用供给
    TCA循环。


    氨基酸（如精氨酸、色氨酸和亮氨酸）的代谢在 TME 内的细胞代谢和生长中也起着作用，突显了可以增强细胞中心抗性的代谢通路。


    通路如单碳代谢、糖酵解和 TCA 循环不仅用于癌细胞的生长，还用于


