    # 癌症回顾


    ![](img/33f55c57731d5bd51413de5f6eaeddd6_2_0.png)


    肿瘤微环境（TME）由多种细胞组成，包括B细胞、T细胞、中性粒细胞、自然杀伤（NK）细胞、巨噬细胞，以及促进和抗肿瘤免疫细胞的纤维细胞、脂肪细胞、内皮细胞和间质细胞¹¹-³这导致了营养交换有限的区域或微环境。虽然通过激活蛋白激酶（AMPK）增加自噬和溶酶体活性可以部分补偿细胞外营养的缺乏，¹⁸-²¹但这些区域承受着极端压力。


    除了炎症和抗肿瘤，虽然细胞性细胞通常如此，但不同的细胞群体可能同时具有促进和抗肿瘤的功能，取决于时间和依赖于的代谢程序。


    癌细胞可以重塑环境以支持肿瘤并逃避免疫系统。这种情况的一种方式是癌细胞与TME内其他细胞之间代谢物和中间体的穿梭导致了代谢异质性，这可能导致免疫抑制，但并非普遍自愿的。


    非小细胞肺癌（NSCLC）已被显示使用多种代谢物，而在侵袭性较小的区域，用于代谢的营养的多样性受到限制。这些差异可能是由于血液供应减少，从而导致严重或持续缺乏营养。


    事实上，在免疫治疗后，肿瘤中心的葡萄糖、精氨酸、天冬酰胺和谷氨酰胺等氨基酸水平往往下降⁷等等的研究发现肿瘤区域的空泡（RCC）细胞密度高于肿瘤，表明恶劣的环境为癌细胞的生存创造了选择压力.³


    此外，不同细胞类型之间的相互作用至关重要。例如，肿瘤来源的抑制性髓细胞（MDSCs）可以抑制T细胞和NK细胞，同时减少调节T细胞和B细胞的功能以驱动免疫抑制。²⁴增加的巨噬细胞可以促进极化、肿瘤进展、侵润和逃逸，以驱动肿瘤发生.³⁵,⁶⁷


    如果这些坏死区域内的营养缺乏²⁹³⁸为转移细胞的选择和生存提供了代谢优势，那么代谢压力可能会为转移潜能提供选择压力。


    ## 不同细胞所需的不同营养


    经典上，癌症微环境研究利用肿瘤限制来定义基本途径和潜在脆弱性³⁵。根据驱动葡萄糖代谢的氧气营养可用性，癌细胞是葡萄糖的主要消费者和乳酸的生产者。这一过程具有高度变性，但人们对肿瘤由癌细胞之外的许多细胞组成的认识日益增加。


    ## TME内部的营养可用性


    肿瘤位置、氧气和宿主决定了TME内细胞的营养可用性。在缺氧区域，低氧水平、高浓度乳酸可以阻断细胞分化并抑制效应T细胞，同时促进应激和T细胞免疫逃逸¹¹（图1）。此外，乳酸促进T细胞向促肿瘤表型（如Treg和MDSCs）的分化和极化。


    肿瘤中氧有限，营养变得有限，细胞必须进行适应。当癌细胞产生并消耗葡萄糖时，T细胞可能被阻止获得足够的葡萄糖⁷⁶⁴⁹。阻止高摄取细胞中的葡萄糖摄取，


    然而，在TME中使用¹⁴-²²G和基于IGF的技术跨多种代谢途径直接使用葡萄糖，显示出癌细胞和B细胞无法竞争葡萄糖。


    腺苷受体1型（CD236）。这些M2样T细胞分泌抑制性白细胞素-10（IL-10）和代谢物，促进对癌细胞的抑制⁴¹。


    在缺氧区域，T细胞获得促精氨酸和促炎表型，这可以抑制肿瘤生长。这些数据也表明，低葡萄糖摄取的细胞并非受限的，而是通过增加葡萄糖代谢来适应低葡萄糖环境。


    T细胞通过雷霉素（mTOR）代谢途径如糖酵解、从脂解、蛋白应激和转录获取能量。在缺氧条件下，mTOR复合物1（mTORC1）被REDD1抑制⁴²，导致细胞重编程其他途径，如糖酵解和还原代谢。


    针对葡萄糖代谢通过增加T细胞的线粒代谢来抑制抗肿瘤免疫。


    肿瘤血管生成导致血管生长不规则，并在递送营养或清除废物方面可能是无效的。这加剧了


    由于营养与代谢活动之间的相互作用，TME可能会影响肿瘤中其他细胞的代谢特征。模型显示，选择性针对癌细胞的糖酵解可以增强T细胞代谢和抗肿瘤免疫³⁹。癌细胞对代谢摄取的增加可以导致代谢物水平升高。SLC34A2导致细胞毒性T细胞代谢减少，


    癌症回顾，2023年3月14日 4


    ## 癌细胞


    可以通过细胞毒性T细胞功能抑制的效应T细胞来减少⁶⁹。Treg细胞在促进免疫逃逸和耗竭中起直接作用⁷⁰,⁷¹由于Treg细胞在代谢脆弱的TME中丰富，已显示依赖免疫抑制环境中脂质的线粒体氧化代谢²–⁶⁶。不清楚Treg细胞在代谢上如何通过氧化进行增殖，而TME内的癌细胞如何通过代谢和减少CD8+
    T细胞功能或IFN(γ)来促进免疫抑制⁶⁷


    由癌细胞产生并在Treg中通过CD39和CD73转化，将ATP转化为腺苷，腺苷结合细胞毒性T细胞和NK细胞上的腺苷A2受体（A2AR），并通过抑制因子b（NF-κB）信号抑制抗肿瘤免疫⁷³⁷⁴因此，阻断A2AR被认为是一种耐性细胞的免疫治疗方法。腺苷也由癌细胞分泌并可以作为免疫细胞的激动剂⁷⁵。腺苷可以被摄取或激活受体，通过PI3K/Akt/mTOR1通路将M2样代谢连接起来，促进促肿瘤功能，如增加抑制和转移⁷⁶。


    在巨噬细胞中，不仅氧气的可用性可以影响代谢，而且通过TME中不同的细胞因子驱动不同的代谢程序。体外，促炎巨噬细胞（M1）将其代谢转向有氧糖酵解，但酸富集的巨噬细胞（M2）转向氧化磷酸化、蛋白质和脂肪酸合成⁷⁷然而，当巨噬细胞被细胞因子或M2样表型（如IL-4、IL-10或IL-13）激活时，满足其代谢需求⁷⁸。其他途径可能在给肿瘤区域提供益。全面理解这些相互关系为操控细胞代谢和缓解免疫抑制微环境提供了新的独特机会。


    某些细胞中由乳酸脱氢酶产生2-羟基丁酸，或由胶质母产生，乳酸可以被T细胞摄取，这减少了T细胞的转录活性和多胺生物，抑制细胞毒性T细胞⁷⁹。乳酸可在肿瘤中积累，引起T细胞的内质网（ER）应激，从而损害T细胞效应功能。T细胞中的ER应激反应还会激活XBP-1，促进免疫抑制分子PD-1、T-3和LAG-3的表达，以促进T细胞耗竭。


    TME内的不同营养，如精氨酸，


    在TME内，氨基酸如丝氨酸、半氨酸和丙酸可能有限，导致癌细胞与细胞毒性T细胞之间的竞争。癌细胞需要营养进行增殖⁸⁰但由于细胞外尿素循环酶精氨酸合成酶1，它通过合成精氨酸酶产生游离细胞⁸¹,⁸²这种对细胞外精氨酸酶摄取的增加导致供T细胞的可用精氨酸减少⁸³。饮食异常导致耗竭样T细胞增加，这意味着T细胞的效应功能和免疫力降低⁸⁴。促肿瘤乳酸也消耗精氨酸，进一步减少了供T细胞消耗的可用精氨酸⁸⁵。


    ### *废物*产物


    - 癌细胞通过分泌“废物”产物抑制T细胞。代谢产物被分泌以主动控制，但比周转时间更快被细胞或邻细胞使用。例如，糖酵解产生的乳酸作为癌细胞中T细胞周期的燃料，乳酸可能抑制CD8+
    T细胞⁸⁶

    - 此外，高水平的乳酸可以直接抑制效应T细胞⁸⁷。IFN的产生可能对葡萄糖和增加的乳酸特别敏感⁷⁸⁷⁹乳酸增加还促进利用线粒体氧化途径的Treg细胞。注意的是，乳酸可能并非仅在TME内产生，这会导致氧化应激，并在某些背景下可能是抗炎的。相反，在报道乳酸导致多种细胞类型免疫抑制的情况下，急性也会导致T细胞效应功能的增加⁸⁰这表明乳酸对T细胞功能和T细胞耗竭的影响可能取决于复杂的背景。


    - 丝氨酸是饮食中必需的氨基酸，由于TME内的竞争在肿瘤中可能限制。癌细胞可以摄取并利用丝氨酸，而TME细胞使用芳香受体（AHR）的配体⁸¹。丝氨酸导致分化为免疫抑制性Treg⁸²–⁸⁴。犬氨酸也导致CD8+
    T细胞上PD-1的表达，导致功能抑制⁸⁵（图2）犬氨酸和精氨酸，丝氨酸细胞消耗大量的丝氨酸。丝氨酸是人体非必需氨基酸，但用于构建蛋白质，无需线粒体氧化还原代谢⁸⁸。当癌细胞摄取大部分细胞外丝氨酸时，留给T细胞的有限，已显示它们依赖细胞外丝氨酸进行T细胞扩和效应功能。


    TME内影响其他细胞代谢的另一个废物例子是腺苷。腺苷。


