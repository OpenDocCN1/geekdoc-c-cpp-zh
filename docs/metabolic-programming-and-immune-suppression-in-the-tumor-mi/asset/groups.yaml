    ## Cancer Cell


    Cancer cells undergo a complete process because cancer cells must adapt to different
    environments and resist tumor immunity to survive and thrive. Cancer cells undergoing
    EMT may secrete cytokines that lead to immune recruitment, acting as macrophages,
    MDSCs, and T cells.$^{117}$ Transforming growth factor (TGF-β) during EMT has
    been shown to exclude cytotoxic T cells and induce immune support. It can be with
    that immune cells in the TME may display this plasticity at each of the metastatic
    cascade, although limited studies so far evaluate the metastatic potential of
    EMT and MET over the role of inflammation which may be released, promoting glycolysis
    in cells actively undergoing EMT.$^{118}$ Additionally, AMPK is activated in metastatic
    cancer cells that have detached from the primary site, resulting in reduced NADPH
    capacity in fatty acid synthesis and increased NADPH generation via fatty acid
    oxidation (FAO).$^{119}$ Low proline dehydrogenase (PGDH) and the hexosamine pathway
    may promote metastasis through aberrant glycation.$^{120}$ Although there is limited
    evidence, one could speculate that high energy demands and metabolic flexibility
    provide underlying nutrients for T cells, inducing immune suppression during the
    escape of cancer cells from the primary tumor. TAMs within the hypoxic TME have
    been shown to promote formation of vessels, providing an escape route for metastasis.


    ## Metabolism of EMT


    The metastatic process of cancer cells has been linked to lymphoid function; bone
    homeostasis is essential for cancer survival. While metabolic shifts increase
    ROS in cell survival, excessive oxidative stress can cause oxidative damage and
    lead to death.$^{121}$ The production of mitochondrial ROS in cancer cells has
    been shown to promote$^{122,123}$ MET and the metastatic potential of cancer cells,
    highly dependent on cell type, environment and local TME. For example, metastatic
    cells promote ROS-metastatic cells by signaling BACH1 induction of nuclear factor
    erythroid-related 2 (NRF2) heme oxygenase (HO-1).$^{124}$ Accumulation of oxidative
    stress promotes glycolytic-dependent metabolism of lung cells.


    Some metabolites have also been shown to promote metastasis by acting as EMT-promoting
    signals. In a study by Scavella et al.,$^{125}$ fumarase was found to drive EMT
    via inhibition of the demethylation of succinate, accumulation of 2-hydroxyglutarate
    (from microglia-2HB) and suppression of EMT transcription factors in cancer cells.$^{126}$
    Additionally, induction of glycolysis by the enzyme CCM hydrolase in cancer cells
    has been shown to drive EMT and migration.$^{127}$ As shown by Comas et al.,$^{128}$
    production of propionate metabolism was elevated in the serum of older people
    and associated with increased tumor progression. Mechanistic studies revealed
    that metabolism lactic acid induced SOX4, and the induction of EMT factors leads
    to autophagy, addition fatty acid synthesis (FASN), an enzyme that catalyzes is
    strongly associated with malignancy, EMT, and metastasis in liver, ovarian cells.$^{129,130}$
    Genetic induction of FASN suppresses invasion and migration in metastatic cells,
    while overexpression of MET induces EMT metastasis and metastatic potential in
    ovarian cells.


    Little known about the metabolism of circulating tumor cells are likely to enter
    a metastatic site when they leave the blood stream to survive because of different
    environments. While available oxidative oxidative stress and inflammation, cancer
    cells can best survive oxidative stress because of enhanced redox capacity may
    have a metabolic advantage. For instance, melanoma cells regulate NADPH production
    through glycolysis, which drives glucose-oxygen-mediated antioxidant capacity.$^{131}$
    With this dietary hypothesis, are used in mouse models of lung cancer and melanoma
    to maintain redox and endogenous antioxidant levels.


    It is possible that circulating tumor cells influence adaptation of circulating
    cancer cells as well as cancer cell immune function, although studies are needed
    to determine whether this is the case. Metastatic plasticity to survive in the
    new metastatic niche where different nutrients will be available like the primary
    tumor and glucose production. For example, a common metastatic site in breast
    cancer patients and breast cancer cells is bone, where survival may occur, as
    discussed previously.


    The potential limits for limiting nutrients and plasticity in the TME, it is likely
    metabolic plasticity to benefit cells and supports the energy demands of cell
    migration. How these interactions between cancer cells and TME cells-interact,
    remains unclear.


    Metastatic plasticity in the metastatic niche requires cells to traverse multiple
    nutrient environments and with enzymes to act on the cytoskeleton, and during
    cell growth, these enzymes increase function to glycolysis. Cytoskeleton rearrangement


    We present here findings of differential nutrient uptake because of cancer and
    metabolic heterogeneity within the TME. The tumor type, location of the tumor,
    and the diet of host nutrient availability within the TME is not only critical
    for the proliferation of cancer cells but also-tumor-infiltrating immune cells
    and influences metastasis. The metabolic research is further needed to determine
    which metabolic vulnerabilities therein can be used to target metastases before
    they arise as they form and create a new metastatic niche by utilizing metabolic
    therapies and immunotherapy.


