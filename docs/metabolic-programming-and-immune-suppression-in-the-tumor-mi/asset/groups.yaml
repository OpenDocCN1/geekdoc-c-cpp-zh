    ## 癌细胞


    癌细胞经历一个完整的过程，因为癌细胞必须适应不同的环境并抵抗肿瘤免疫以生存和繁衍。正在发生上皮-间质转化（EMT）的癌细胞可能会分泌细胞因子导致免疫招募，充当巨噬细胞、骨髓源性抑制细胞（MDSCs）和T细胞的作用$^{117}$
    EMT 过程中的转化生长因子（TGF-β）已被证明能排除细胞毒性T细胞并诱导免疫支持。在 TME（肿瘤微环境）中的免疫细胞在转移级联的每个阶段都可能表现出这种塑性，尽管目前有限的研究评估了
    EMT 和 MET（间质-上皮转化）的转移潜力相对于炎症可能释放的作用，这可能促进正在进行 EMT 的细胞中的糖解作用$^{118}$ 此外，在脱离原发位的转移性癌细胞中，AMPK
    被激活，导致脂肪酸合成中的 NADPH 能力降低，并通过脂肪酸氧化（FAO）增加 NADPH 的产生$^{119}$ 低水平丙氨酸脱氢酶（PGDH）和己糖胺代谢途径可能通过异常糖基化促进转移$^{120}$
    尽管证据有限，但可以推测，高能量需求和代谢灵活性为 T 细胞提供了底层营养，在癌细胞从原发肿瘤逃逸期间诱导免疫抑制。低氧 TME 中的肿瘤相关巨噬细胞（TAMs）已被证明促进血管形成，为转移提供逃逸途径。


    ## EMT 代谢


    癌细胞的转移过程与淋巴功能有关；骨稳态对于癌症的生存至关重要。虽然代谢转变增加了细胞生存中的 ROS（活性氧）水平，但过度的氧化应激会导致氧化损伤并导致死亡$^{121}$
    癌细胞中线粒体 ROS 的产生已被证明促进$^{122,123}$ MET 和癌细胞的转移潜力，这高度取决于细胞类型、环境和局部 TME。例如，转移细胞通过信号调节
    BACH1 诱导核血红素相关蛋白 2（NRF2）血红素加氧酶（HO-1）来促进 ROS-转移性细胞$^{124}$ 氧化应激的蓄积促进了肺细胞依赖糖解的代谢。


    某些代谢产物也被证明通过作为 EMT 促进信号促进转移。在 Scavella 等人的研究中$^{125}$发现延胡酸酶通过抑制琥酸的去甲基化、2-羟基戊二酸（来自小胶质-2HB）的蓄积以及抑制癌细胞中的
    EMT 转录因子来驱动 EMT$^{126}$ 此外，癌细胞中酶 CCM 水解酶对糖解的诱导已被证明驱动 EMT 和迁移$^{127}$ 正如 Comas
    等人所示$^{128}$ 老人血清中的丙酸代谢产物升高并与肿瘤进展的增加有关。机制研究揭示了乳酸代谢诱导了 SOX4，而 EMT 因子的诱导导致自噬、脂肪酸合成（FASN）——一种催化酶的增加与肝脏、卵巢细胞的恶性肿瘤、EMT
    和转移密切相关$^{129,130}$ 遗传诱导 FASN 抑制了转移细胞的侵润和迁移，而 MET 的过表达会诱导卵巢细胞的 EMT 转移和转移潜力。


    关于循环肿瘤细胞代谢的已知较少，它们在离开血液循环时可能进入转移位点，为了在不同的环境中生存。尽管存在现有的氧化应激和炎症，癌细胞由于增强的氧化还原能力最能生存氧化应激，可能具有代谢优势。例如，黑色素细胞通过糖解调节
    NADPH 的产生，从而驱动葡萄糖-氧介导的抗氧化能力$^{131}$ 这种饮食假设用于肺癌和黑色瘤小鼠模型维持氧化还原和内源性抗氧化水平。


    循环肿瘤细胞可能会影响循环癌细胞的适应以及癌细胞免疫功能，尽管还需要研究确定是否如此。为了在新的转移生态位生存（那里有与原发肿瘤不同的营养和葡萄糖产生），例如，乳腺癌患者和乳腺癌细胞常见的转移位点是骨骼，如前所述，在那里可能发生生存。TME
    中限制营养和塑性的潜在限制，很可能是代谢塑性使细胞受益并支持细胞迁移的能量需求。癌细胞与 TME 细胞之间的这些相互作用如何尚不清楚。


