    glycolytic enzymes, or hypoxia signaling. These factors are caused by oxygen deprivation
    driving phosphatidylinositol 3-kinase (PI3Ks) and myelomethyl oxygen homolog (MYC),
    directly cell insulin-like growth factors that promote glycolysis. In addition
    hypoxia occurs during tumorigenesis or loss of VHL, the activation of glycolytic
