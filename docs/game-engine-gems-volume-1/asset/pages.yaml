    the viewport transformation. The values of M_viewport and M_project are ordinarily
    constant from one frame to the next, but the values of M_camera, M_model, and
    P_model can change. Thus, it is necessary to store the M_camera matrix used by
    the camera during the preceding frame, and it is necessary to store the M_model
    matrix used by each model during the preceding frame. If the model-space vertex
