- pgno: 53
  md: '# 2.3 Push or Pull Pipeline Model


    It is really tempting to directly modify an intermediate asset without editing
    the source asset and re-exporting. When pressed for time, it seems like the right
    thing to do, but most of the time, this is not such a good idea since intermediate
    assets get overwritten next time the source is modified and exported.


    The ideal solution would be to be able to make changes at any point in the pipeline
    and make sure that those changes are reported back in the source data. One way
    to do this is to be able to import the intermediate assets back into the DCC tool
    so the modifications can be merged back into the source assets. But there is a
    slew of data in the source assets that are not reproduced in the intermediate
    data, such as construction history and tool widget layout. Additionally, the intermediate
    asset may have been processed so that the original form of the data is lost. Therefore,
    reimporting the intermediate assets should be done with the idea that changes
    will be merged into the source. Unfortunately, unlike source code development
    where diff and merge tools are common and allow for concurrent development, detecting
    and merging changes is not a common feature of DCC tools. This lack of merge tools
    in the asset workflow has also directly impacted the way content versioning systems
    are used. When dealing with source code, it is customary for several programmers
    to make changes to the same source files and use merging tools to consolidate
    the changes later. But the lack of such tools for content forces the use of lock
    mechanisms, allowing only one person to make changes to a given source asset at
    a time. This in turn has forced the source assets to be split in a large number
    of files in order to enable concurrent development to take place, because if all
    the data was in a single file, only one artist would be able to work on the content
    at a time. This is robust, but not very flexible or efficient.


    Traditionally, the asset pipeline has been designed as a push model, in which
    the user has to create the intermediate assets or'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'final assets by invoking the build process and then load the result into the
    editor to see what the final result is. An improvement to this model is to use
    the game engine editor to pull the intermediate or final assets directly from
    the user interface. An example of this technique is implemented in the latest
    Torque 3D asset pipeline [18], where the game engine editor is actively listening
    to changes in the intermediate or final assets and automatically updates the content
    in the editor upon external changes. Another similar idea is described in The
    All-Important Import Pipeline [19], where the game engine editor provides the
    user with direct loading of the intermediate assets and automatically invokes
    the build process to create the final assets on demand. This enables the user
    to pull the intermediate assets directly, rather than having to invoke the build
    process manually. Those two ideas can be combined to listen for intermediate asset
    changes and automatically invoke the build process. This mechanism can be combined
    with the fast path loading mechanism to provide a better interactive WYSIWYG iterative
    process, while a background process creates the final assets and automatically
    replaces the "slow" content with "optimized" content whenever it is available,
    transparently to the user.


    Those ideas are a step in the right direction, but do not yet address the problem
    of editing intermediate assets when the source asset should in fact be modified.
    The asset pipeline design illustrated in Figure 2.3 adds a Remote Control line
    where the user can select any content in the game engine editor, and provided
    that the intermediate asset stores the source asset dependency and associated
    DCC tool, the source asset editing tool is automatically launched and provided
    to the user so it can be changed and re-exported. Combined with the previous method
    where the engine is listening to intermediate asset changes and automatically
    invoking the build process, this provides for an efficient, flexible, and robust
    design of the asset pipeline. The asset pipeline is viewed as a pull model by
    the user. Intermediate assets are pulled into the editor, for example, using an
    asset browser that can provide a quick preview of the assets categorized by type.
    The editor can'
