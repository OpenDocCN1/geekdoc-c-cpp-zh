  md: '# Chapter 12: Precomputed 3D Velocity Field for Simulating Fluid Dynamics


    Khalid Djado and Richard Egli


    Centre Moivre, Université de Sherbrooke


    This gem describes a method for simulating 3D fluid dynamics by using a precomputed
    velocity field. First, we present a method for building the fluid velocity field
    by using fluid dynamics. The fluid velocity field is computed on a fixed grid
    in the fluid domain. Second, we present a method for simplifying the fluid dynamics
    by using the precomputed velocities and some heuristics. The advantage to using
    a precomputed velocity field is that it reduces the fluid dynamic computation
    time. The greater part of the fluid dynamic computation is included in the velocity
    field computation process, which can be performed offline.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 12.1 Introduction


    In recent years, much effort has been devoted to integrating real physics into
    virtual worlds like those found in video games. Some of these techniques, such
    as collision detection, are now very familiar to game developers and have been
    widely integrated into game physics engines. This is not the case for fluids.
    Simulating fluid dynamics well in virtual environments is generally a challenge.
    The primary difficulty is that there is no analytic solution to the Navier-Stokes
    equations describing the fluid dynamics. In general, the computer graphics community
    uses a grid or particle system to simulate a fluid. This gem uses an Eulerian
    3D method on a grid to compute the fluid velocity field.


    One of the first studies on simulating fluids in computer graphics was done by
    Foster and Metaxas [2]. Their work is based on a paper published by Harlow and
    Welch [3]. A great summary of work on fluids can be found in a recent book [1].
    We have implemented the method of Foster and Metaxas [2] to compute the fluid
    dynamics, so the fluid domain is discretized into voxels. The velocity field computation
    process is as follows:


    +   - The velocity source (or an exterior force), which we call the *blower*,
    is placed inside the fluid domain (for example, on a selected face of a voxel).


    +   - The fluid velocity on all voxel faces in the fluid domain is calculated
    by solving the Navier-Stokes equations. These velocities can be stored in a file
    for future use, or precomputed before the simulation starts.


    The use of fluid dynamics in video games is very expensive in terms of computing
    time. For greater performance, we precompute the physics of the fluid. The key
    idea is to precompute the steps that take a long time. Once the time-consuming
    steps in the calculation have been done, we use these data to simulate the fluid'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'as if performing all calculations in real time. The method is thus fast, while
    yielding realistic and acceptable results for interactive applications such as
    video games. The opportunities afforded by the approach used in this article are:


    +   - Computation of the fluid velocity anywhere in the fluid domain using the
    precomputed velocities.

    +   - Simulation of a new velocity field using the precomputed velocities and
    heuristics when the blower changes intensity and direction.

    +   - Simulation of the presence of a new object or the motion of an existing
    object in the fluid domain using the precomputed velocities and heuristics. This
    allows interaction between fluid and objects.'
  merge: -1
