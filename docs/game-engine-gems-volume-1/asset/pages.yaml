- pgno: 354
  md: '# 15.1 Positioning the Sun and Moon


    Natural light comes primarily from the sun and moon, so the first step in lighting
    an outdoor scene is to know where to place these light sources. To do this, you
    will need an *ephemeris model* to compute the location of the sun and moon for
    a given time and location. Since this is a game engine book and not an astronomy
    book, we don''t go into the details here, but refer you instead to the `Ephemeris`
    class in the code included on the accompanying CD. Understanding this class does
    require a few key concepts, which we describe here.


    Numerical approximations of the position of astronomical objects are generally
    done in *ecliptic coordinates* for a given *epoch time*. Our `Ephemeris` class
    starts by computing the location of the sun, moon, and visible planets in ecliptic
    coordinates, which are just latitudes and longitudes relative to the plane defined
    by the path the sun takes across the sky. As a result, the ecliptic latitude of
    the sun is always zero. The algorithms used take as input Greenwich Mean Time
    expressed as the number of centuries elapsed since the year 2000; this is the
    epoch time for epoch 2000. Our `LocalTime` class will handle converting times
    in hours, minutes, and seconds for a given day to epoch centuries for you. While
    we are computing the location of the moon, we also compute the phase of the moon,
    which is important for nighttime lighting.


    Ecliptic coordinates are not terribly useful for rendering, so you will need to
    transform the ecliptic polar coordinate system to a Cartesian coordinate system
    relative to your local horizon. Fortunately, this can be done with just a couple
    of 3 × 3 rotation matrices. Our code starts by taking the ecliptic coordinates
    of the sun or moon together with its distance from the Earth, and transforming
    that into a 3D vector in ecliptic space from the center of the Earth. Then, we
    rotate this vector into *equatorial coordinates*, which is a system defined by
    the plane of the Earth''s equator instead of the plane of the Earth''s revolution
    around the sun; doing'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'this requires computing the Earth''s tilt for the simulated time.

    Finally, we transform the equatorial coordinates into horizon

    coordinates for the location on Earth that you wish to simulate. As

    a finishing touch, we also apply atmospheric refraction to the

    horizon coordinates, which affects the perceived location of the sun

    and moon as they approach the horizon.


    Care must be taken that this final transformation is consistent with

    your engine''s coordinate system conventions; if your users might

    define "north" and "up" as any arbitrary axis, you''ll want to provide

    a means for them to influence this final transformation into local

    coordinates. The sun rising in the West instead of the East is an

    embarrassing bug that is very easy to slip through testing. You

    may also want to expose geographic coordinates for the sun and

    moon; instead of being relative to a specific location on the surface

    of the Earth, these coordinates are relative to the center of the

    Earth. Flight simulators that can cover large distances frequently

    use this coordinate system, and our Ephemeris class will

    compute this for you as well.


    These same matrices are useful for transforming things such as

    star fields in the sky. It may sound like overkill, but having

    accurately positioned stars in your scenes could be important to

    someone creating, for example, a navigation training application.


    All this work pays off when your engine''s sun and moon rise at

    exactly the right time for the location being simulated. Got a game

    that takes place in the winter in Alaska? Your nights will be long

    and the sun will be low—automatically.'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 15.2 Computing Natural Sunlight


    Now that we know where the sun is in the sky, we can simulate what happens to
    its light as it passes through the atmosphere; this is called *atmospheric transmittance*
    and *atmospheric scattering*, and it is simulated by the `Spectrum` class in the
    included source code. Our approach uses a modified "Bird simple spectral model",
    named after Dr. Richard Bird who developed it at the Solar Energy Research Institute
    (now the National Renewable Energy Laboratory) in 1984 [1]. It is relatively simple
    compared to other models, yet amazingly accurate. This code is what will turn
    sunlight red near sunset, for example.


    Our `Spectrum` class operates over a full visible spectrum, and starts with data
    from NASA on the spectrum of the sun from outside of the atmosphere as input.
    (This spectrum is inside our `SolarSpectrum` class.) It also takes in the angle
    between the sun and the top of the sky dome (the *zenith angle*), your altitude,
    and the *atmospheric turbidity*, which is essentially a measure of how polluted
    the air is. A reasonable value for turbidity is around 2.2; going lower than 1.8
    or higher than 20.0 will cause the math to start breaking down. This class will
    reward you with spectra of the *direct irradiance* of the sunlight transmitted
    through the atmosphere (this will become the diffuse component of your light source
    for the sun) and the *scattered irradiance* (which will become the ambient component
    of your light source).


    The meat of the simulation is in `Spectrum :: ApplyAtmosphericTransmittance`.
    This method iterates over samples of the visible spectrum from 380 nm to 720 nm.
    For each wavelength, we simulate the effects of several components of the atmosphere
    on how that wavelength is transmitted and scattered by the atmosphere. We can
    multiply together the transmittances from each component to arrive at a final
    transmittance for the given wavelength, and multiply that by the sun''s irradiance
    at that wavelength. The scattered components'
  merge: -1
  img_proc: true
- pgno: 357
  md: 'are added together and then multiplied by the sun''s irradiance.

    Once we''re done with all of the wavelengths of the visible

    spectrum, we can convert this spectrum into RGB values for direct

    and ambient natural light.


    It starts by computing the air mass for the given solar angle, which

    represents how much atmosphere the sunlight needs to pass

    through before it gets to the camera. The air mass M for a given

    solar zenith angle Z (in degrees) is given by


    \( M = \frac{1.0}{\cos Z + 0.50572(93.885 - Z)^{-1.636}} \).


    The lower the sun is, the more air will scatter its sunlight. We

    multiply the air mass by the isothermal effect, which is a fancy way

    of saying that the higher you are, the less atmosphere there is. As

    your altitude increases, lower air masses will result in less light

    being scattered and more direct light reaching you; modeling this

    may yield effects such as the sky darkening as you start to enter

    space. The isothermal effect is given by \( e^{-a/H} \), where \( a \) is the

    altitude above sea level, and \( H \) is the "pressure scale height" of

    8435 meters.


    Then, various components of the atmosphere are treated

    independently and their effects combined together at the end. The

    main component is Rayleigh scattering which is caused by the

    molecules of air itself; it is the reason the sky is blue, and your

    scattered light will be a bit blue as a result. The light transmitted by

    Rayleigh scattering \( T_R \) for a given wavelength \( \lambda \) in micrometers
    is

    given by


    \( T_R = e^{\frac{-M}{\lambda^4(115.6406 - 1.335/\lambda^2)}} \).


    Next comes the effect of aerosols, or larger particulate matter—this

    is affected by the turbidity \( T \) you passed in; more aerosols mean

    redder sunsets. The light transmitted by aerosols \( T_A \) is given by'
