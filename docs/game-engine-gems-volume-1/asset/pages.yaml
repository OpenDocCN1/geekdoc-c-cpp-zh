  md: 'thumb. Lipton''s values appear to work for many VR applications, but they do
    not generally apply for all viewing conditions. According to Lipton, compositing
    stereoscopic images is an art, not a science. In the end what matters is that
    it looks and feels good!


    # The Basic Setup


    Several propositions have been made on how to setup and render graphics for stereoscopic
    displays as efficiently as possible. One way is to let the graphics driver handle
    it. Some of the major graphics vendors have native support for stereoscopic displays
    in their drivers where it creates the stereo pair. This does require that the
    game is compatible with stereoscopic display in the form that the content is conformed
    for these kinds of systems. And this limits your game to be used only for these
    specific graphics card vendors in order to make your game work in stereo. The
    second, less common alternative in the context of the game industry is to make
    a graphics command interceptor [3]. This is an application that pretends to be
    the graphics driver and intercepts all the graphics sent from an application.
    This can be stored and then in theory be used to create the two stereo pairs.
    It is still required that the game create content that is suitable for stereoscopic
    displays.


    Usually, we would use the following simple approach to create the game in stereo.


    ```

    while (user wants to play)

    doGameLogic()

    setupProjectionForLeftEye()

    render()

    setupProjectionForRightEye()

    render()

    ```


    In our game, we must set the virtual cameras to focus on the point of interest,
    as shown in Figure 8.7, using the previously described math in order to ensure
    that the parallax do not exceed the values for the allowable virtual space depth.'
