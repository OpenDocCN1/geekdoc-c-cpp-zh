- pgno: 359
  md: 'The scattered term $D_{aer}$ for aerosols is


    ```

    $D_{aer} = C_2 T_R^{1.5} (1 - T_{As}) F_S$ .

    ```


    The total scattered irradiance can then be derived by adding $D_{ray}$ and $D_{aer}$
    multiplying it by the sun''s irradiance for the given wavelength. Modeling Rayleigh
    and aerosol effects will be accurate enough for most applications. The sample
    code also models the effects of water vapor, ozone, mixed gas, reflection from
    the ground, and some effects specific to wavelengths under 450 nm, but these effects
    are all small during daytime. However, simulating ozone scattering will improve
    the realism of your sunsets.


    An important limitation of these equations is that they break down at zenith angles
    over 90 degrees—that is, as soon as the sun drops below the horizon. Civil twilight
    is defined as the point where the sun is 6 degrees below the horizon, so to avoid
    a discontinuity at 90 degrees, you''ll want to interpolate the direct and scattered
    sunlight between its value at 90 degrees and 0 at 96 degrees. Light doesn''t really
    fall off linearly during this time; better implementations would use a lookup
    table based on experimental data of twilight luminance for given solar angles
    below the horizon. The nautical almanac [5] listed in the references is one source
    of this data.


    The resulting spectra for transmitted and scattered sunlight are then converted
    to a CIE XYZ color. You will need to know a little about color theory to know
    what''s going on here, but the important thing is that XYZ contains chromaticity
    information as well as luminance information. As such, it may represent "high
    dynamic range" colors, and the sun certainly qualifies as a high lighting value.
    We will map this light down to something displayable on a monitor, but first we
    also need to add in the light from the moon.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# # 15.3 Moonlight and Other Nighttime Light Sources


    Moonlight gets scattered through the atmosphere in exactly the same way as sunlight;
    the only difference is that instead of starting with a fixed spectrum of the extraterrestrial
    solar light source, we must generate the moon''s spectrum algorithmically, since
    it varies depending on its phase and its distance from the Earth.


    Fortunately, our *Ephemeris* class will give us that information. Moonlight consists
    of two components: light reflected from the Earth off the moon ("Earthshine")
    and light reflected from the sun off the moon. Both depend on the phase of the
    moon, as expressed by its phase angle Φ. Earthshine is given by


    $E_{sm} = 0.095 \left[ 1 - \sin \frac{\pi - \varphi}{2} \tan \frac{\pi - \varphi}{2}
    \ln \left( \cot \frac{\pi - \varphi}{4} \right) \right]$


    This value becomes a component of the expression for computing the total moonshine
    irradiance seen from the Earth:


    $E_m = \frac{2Cr_m^2}{3d^2} \left\{ E_{sm} + E_{sm} \left[ 1 - \sin \frac{\vartheta}{2}
    \tan \frac{\vartheta}{2} \log \left( \cot \frac{\varphi}{4} \right) \right] \right\}$


    Here, *d* is the distance from the Earth to the moon returned from our *Ephemeris*
    class, *r<sub>m</sub>* is the radius of the moon (1738.1×10³ m), *E<sub>sm</sub>*
    is the irradiance of the sun at the moon (1905 W/m²), and *C* is the average albedo
    of the moon (0.072).


    To turn this into a spectrum that you can pass through the Bird spectral model,
    first convert W/m² from the equation above to cd/m² using the approximate conversion
    factor of 683.0/3.14. Then, linearly scale this value from 0.7 at the low end
    of the visible spectrum to 1.3 at the high end, normalizing the results to ensure
    the resulting spectrum adds up to the lunar irradiance you'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'computed above. From there, you can treat moonlight just like sunlight, and
    model the moon as a second light source in the same manner as the sun.


    Even when there is no moon out at night, there are sources of ambient illumination.
    Light from bright planets, zodiacal light, starlight, airglow, galactic light,
    and cosmic light can all be modeled, but are negligible (~2×10^6 W/m^2) compared
    to artificial light pollution in all but the most remote areas. To preserve some
    visibility on moonless nights, you will want to add an arbitrary light pollution
    term to your ambient illumination.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# 15.4 Tone-Mapping the Light


    Now that you have the direct and scattered irradiance from the sun and moon expressed
    as XYZ colors, the challenge is to map these down to RGB values for lighting your
    scene.


    The difference in luminance between a moonless night and high noon in the summer
    is more than ten orders of magnitude and cannot be directly displayed by any display
    device. Tone-mapping is required to capture the fact that your eyes adapt to the
    ambient light, allowing you to see on a moonlit night while not being blinded
    during the day. During the day, the cones in your eye create what is known as
    *photopic vision*. At night, your rods are responsible for *scotopic vision*.
    At dawn and dusk, both may be active to provide *mesopic vision*. Perceptual tone
    mapping works differently in each case. For example, things appear to look a little
    blue at night, which is an effect we can capture. Fortunately, this is a solved
    problem. Frédo Durand and Julie Dorsey at MIT presented a simple tone-mapping
    operator for this purpose in 2000, which we''ll summarize here.


    Perceptual tone-mapping requires knowledge of both the average luminosity of the
    scene (this is the *adaptation luminosity* that your eyes are adapted to), and
    the maximum luminosity of the display device. The adaptation luminosity may be
    approximated by the Y component of the sum of the sun and moon''s scattered light.
    The display''s luminosity is generally set to 100 cd/m².


    The Durand operator treats tone mapping independently for rods and cones; we''ll
    use the same notation used in Durand''s paper [3]. The adaptation luminosity for
    cones $L_{waC}$ is simply the Y component of the scene''s scattered light, as
    mentioned above. The display threshold for rods $L_{waR}$ may be approximated
    by


    ```

    $L_{waR} = -0.702X+1.039Y+0.433Z$,

    ```'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'where X, Y, and Z are the XYZ components of the scene''s scattered light, which
    is the sum of the scattered light from the sun and the moon. The display luminosities
    $L_{daC}$ and $L_{daR}$ are set to 100 cd/m$^2$, but may be adjusted for brighter
    or darker scenes. The rod and cone thresholds from the scene are then mapped to
    rod and cone thresholds for the display, using a technique called *threshold mapping*.
    For both rods and cones, photopic, mesopic, and scotopic conditions are treated
    separately; the rod threshold is given by $\epsilon_R$ and the cone threshold
    by $\epsilon_c$:


    ```

    \log \epsilon_R(L_{ad}) = \begin{cases} -2.86, & \text{if } \log L_{ad} \le -3.94;
    \\ \log L_{ad} - 0.395, & \text{if } \log L_{ad} \ge -1.44; \\ (0.405 \log L_{ad}
    + 1.6)^{2.18} - 2.86, & \text{otherwise.} \end{cases}

    \log \epsilon_c(L_{ac}) = \begin{cases} -0.72, & \text{if } \log L_{ac} \le -2.6;
    \\ \log L_{ac} - 1.255, & \text{if } \log L_{ac} \ge 1.9; \\ (0.249 \log L_{ac}
    + 0.65)^{2.7} - 0.72, & \text{otherwise.} \end{cases}

    ```


    What we really need is to compute two scaling values, one for rods ($m_R$) and
    one for cones ($m_C$):


    ```

    m_R = \frac{\epsilon_C (L_{daC})}{\epsilon_R (L_{waR})}

    m_C = \frac{\epsilon_C (L_{daC})}{\epsilon_C (L_{waC})}.

    ```


    We also need a scaling value $k$ which is used to interpolate between full color
    perception from cones and blue-shifted monochromatic perception from rods in mesopic
    conditions. With the value $\sigma$ set to 100 cd/m$^2$,


    ```

    k = \sqrt[3]{4} \frac{\sigma L_{waR}}{\sigma + L_{waR}}.

    ```'
  merge: -1
  img_proc: true
- pgno: 364
  md: "Finally, we have everything we need to map the raw XYZ values of the direct\
    \ and scattered light to something displayable. For the raw lighting value L,\
    \ the tone-mapped value lighting value L' is given by\n\n```\nR = -0.702Lx + 1.039Ly\
    \ + 0.433Lz\nS = (0.3, 0.3, 0.4, 0.4)R\nL' = \\frac{L(1-k)m_C + S(km_r)}{L_{dacC}}\n\
    ```\n\nThe intermediate value S above represents the scotopic color from the rods\
    \ (with a perceptual blue-shift), which is blended with the full color L from\
    \ the cones.\n\nThe final step is to convert the tone-mapped XYZ value into an\
    \ RGB value. You may perform this conversion with many matrices found online that\
    \ assume different white points. Here is one with good results (this is the HDTV\
    \ rec. 709 matrix):\n\n```\n[R G B]=[X Y Z] [ 3.240479 -0.969256 0.055648 ]\n\
    \                  [ -1.53715 1.875991 -0.204043 ]\n                  [ -0.49853\
    \ 0.041556 1.057311 ]\n```\n\nUnless you're working in HDR space, you'll want\
    \ to clamp the results to [0,1] for each color component.\n\nThe algorithms above\
    \ are implemented in the class LuminanceMapper in the included sample code on\
    \ the CD."
  merge: -1
  img_proc: true
- pgno: 365
  md: '# 15.5 Implementation Notes


    Although the computations described above can execute pretty quickly, there is
    no need to compute them every frame. The resulting light values should be cached
    until the time of day or location changes, and may even be precomputed for the
    range of zenith angles for a given location at load time.


    With physically-based light sources, it becomes important that the materials on
    your scene''s objects are also accurate. If the materials on your objects are
    set to 100% brightness for diffuse or ambient light, they will look too bright
    when using these techniques. Real-world materials do not reflect 100% of the incoming
    light, unless they are perfect mirrors. Work with your art staff to ensure your
    materials are reasonable.


    These algorithms all assume a clear sky at the camera''s location; for cloudy
    conditions, you''ll need to attenuate the results. Since the amount of attenuation
    depends on the thickness of the clouds, how much is really up to you. For really
    thick clouds, you may want to reduce the amount of direct light and increase the
    ambient, since the clouds will scatter the sunlight further.


    Strictly speaking, scattered sunlight and moonlight is not really ambient light—it
    is more accurately modeled as directional light radiating perpendicular to the
    surface of the sky dome. Without some sort of global illumination scheme, however,
    your objects will likely appear too dark if the scattered light does not reflect
    between objects on the ground, and treating it as an ambient term will yield better
    results. There is certainly nothing to stop you from doing something more sophisticated
    with the resulting direct and scattered light that these techniques produce.'
  merge: -1
  img_proc: true
