    (\mathbf{r}_i + \mathbf{s}) \otimes (\mathbf{r}_i + \mathbf{s}) \right] \).


    Expanding this summation, we have


    (14.13) \( I = \sum m_i r_i^2 \mathbf{E}_3 + \left[ 2 \left( \sum m_i \mathbf{r}_i
