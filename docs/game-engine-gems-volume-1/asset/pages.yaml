  md: '# examine the moving parts.


    +   The enumerated `State` subtype (`GameState.State`) contains the "master list"
    of all valid game states.


    +   The `__instance` data member is marked as private, keeping accessibility to
    the data under the control of the class itself. This data member is also marked
    static, meaning it belongs to the class and not to the instance.


    +   The `__currentState` data member is also private. It stores the value of the
    current game state, as allowed by the `GameState.State` enumerated type.


    +   The only constructor provided for the `GameState` class is also marked private,
    meaning the class can only be instantiated from within itself.


    +   The `instance` accessor parameter allows the outside world to get a reference
    to the singleton instance of `GameState`. The retrieval mechanism first checks
    to see if the class has been instantiated. If not, it creates a new instance of
    `GameState` and stores a reference to it in the static `__instance` member. Once
    a valid instance has been created and stored, a reference to it is returned.


    +   The `currentState` accessor parameters are used to set and retrieve the current
    game state. While the implementations shown here are quite simple, more complex
    logic can be employed to ensure that all state transitions are legal.


    At this point, we have a fairly simple, but functional game state manager. It
    has everything it needs to be a useful addition to a game or game engine project.
    In its current state, it can be used to establish and update the current game
    state, and it can be queried by other software modules that need to know the state
    of the game in order to function properly.'
