- pgno: 379
  md: '# Highlights


    Motion blur adds a significant amount of realism to a rendered scene since our
    eyes are accustomed to seeing it when we look at moving objects in the real world.
    There are several techniques for producing motion blur in computer graphics, and
    they vary widely in both rendering speed and image quality. Temporal supersampling,
    in which multiple frames are rendered and then combined to form one image, can
    produce very accurate results, but its extreme rendering expense makes it impractical
    for real-time applications like games. Techniques using an accumulation buffer
    of some kind to store previous frames to be combined with the current frame are
    fast, but produce terrible results in terms of image quality.


    There is a class of motion blur techniques that are based on calculating perpixel
    velocities and using them to collect many samples from the color buffer along
    the direction of motion. These techniques generally produce good results, but
    many of them produce a particular artifact that manifests itself as a fuzzy halo
    around foreground objects when the pixels behind them are moving quickly. The
    technique described in [1] makes no attempt to eliminate or reduce the appearance
    of this artifact. The method presented in [2] eliminates the artifact, but also
    eliminates some cases of correct motion blur, and it comes with some significant
    limitations.


    There is but one method that is both fast and capable of producing high-quality
    images, and it involves the use of a velocity buffer in conjunction with a post-processing
    shader to render a directional blur for pixels belonging to moving objects. A
    basic implementation of this concept produces adequate results for some applications,
    but it also produces the fuzzy halo artifact. This gem discusses an improvement
    to this motion blur technique that eliminates halo artifacts without also affecting
    cases where motion blur would be correctly rendered, producing images of much
    higher quality than'
  merge: -1
  img_proc: true
- pgno: 380
  md: is possible with other techniques. The method described here was originally
    implemented in the C4 Engine [3], and that is the source of the images shown in
    this gem.
  merge: -1
