  md: 'evolving needs of the team. Unfortunately, these two priorities are somewhat
    in opposition to each other, so there isn''t a single solution that can satisfy
    all projects. Instead, a choice of compromises defining the requirements for the
    design of the asset pipeline is needed.


    Therefore, the game engine editor will offer a combination of view-only and editing
    capabilities based on the specifics of a project. The question is where to draw
    the line. Obviously, it is not practical to rewrite all the editing functionality
    of all the DCC tools in the editor. This would be a major task and change the
    focus of the development from creating a game to creating DCC tools, which is
    a different business all together. Some have tried to go the other way around,
    writing the game editor as a plug-in to a DCC tool. But it does not work either,
    as this requires writing (for example) an image editor, audio editor, script editor,
    AI tool, and level editor inside a 3D package, and it locks the tool chain to
    the extension capabilities of the tool SDK. The right compromise is to write only
    the editing features in the game editor that are either very specific to the game
    itself or provide a very large efficiency improvement over off-the-shelf tools.
    In fact, a game team should always be on the lookout for the availability of new
    tools that could improve their efficiency. The asset pipeline should be designed
    to provide enough flexibility to enable the inclusion of new tools, which can
    be a delicate process throughout the course of a project.


    The other main point to consider is robustness. The asset pipeline is the backbone
    of the project and the team. The project is at a standstill when the pipeline
    is broken, and everyone on the team is idling while they wait for the pipeline
    to be fixed. A solid design and the proper documentation telling a team how to
    use and extend the asset pipeline is the key to its robustness.


    Efficiency, flexibility, and robustness are all main goals of the intermediate
    asset format. The primary advantage of providing a step between the source and
    the final asset format is decoupling engine development and asset creation. If
    the final assets are to be'
