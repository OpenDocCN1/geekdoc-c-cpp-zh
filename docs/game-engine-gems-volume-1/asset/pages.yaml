- pgno: 353
  md: '# # Overview


    Adventure games, role-playing games, and "serious" training and simulation games
    often need to render the same scene under various times of day. This gem provides
    a physically-based approach for generating realistic direct and diffuse ambient
    skylight for any given time and location, together with a tone-mapping operator
    to account for human perception. (See Figure 15.1.) This gives games with outdoor
    scenes a greater level of realism, and provides the physically accurate lighting
    required by training systems that might use your engine.


    | Shape | Mass and CM | Inertia Tensor |

    |---|---|---|

    | Box | \( m = \rho abc \)

    C = (0,0,0) | \( I_{xx} = \frac{1}{12}m(b^2+c^2) \)

    \( I_{yy} = \frac{1}{12}m(a^2+c^2) \)

    \( I_{zz} = \frac{1}{12}m(a^2+b^2) \) |

    | Cylinder | \( m = \rho \pi abh \)

    C = (0,0,h/2) | \( I_{xx} = \frac{1}{12}m(3a^2+h^2) \)

    \( I_{yy} = \frac{1}{12}m(3b^2+h^2) \)

    \( I_{zz} = \frac{1}{12}m(a^2+b^2) \) |

    | Pyramid | \( m = \frac{1}{3}\rho abh \)

    C = (0,0,h/4) | \( I_{xx} = \frac{1}{20}ma^2 + \frac{1}{12}mh^2 \)

    \( I_{yy} = \frac{1}{20}mb^2 + \frac{1}{12}mh^2 \)

    \( I_{zz} = \frac{1}{20}m(a^2+b^2) \) |

    | Cone | \( m = \frac{1}{3}\pi\rho abh \)

    C = (0,0,h/4) | \( I_{xx} = \frac{3}{80}ma^2 + \frac{3}{20}mh^2 \)

    \( I_{yy} = \frac{3}{80}mb^2 + \frac{3}{20}mh^2 \)

    \( I_{zz} = \frac{3}{10}m(a^2+b^2) \) |

    | Ellipsoid | \( m = \frac{4}{3}\pi\rho abc \)

    C = (0,0,0) | \( I_{xx} = \frac{1}{5}m(b^2+c^2) \)

    \( I_{yy} = \frac{1}{5}m(a^2+c^2) \)

    \( I_{zz} = \frac{1}{5}m(a^2+b^2) \) |

    | Dome | \( m = \frac{2}{3}\pi\rho abc \)

