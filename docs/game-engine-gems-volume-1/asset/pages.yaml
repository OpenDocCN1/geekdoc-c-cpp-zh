- pgno: 426
  md: '# 19.4 Improvements


    While this technique''s results can be utilized immediately, there are a number
    of things that can be improved. First, while the end caps formed by the matrix
    flattening don''t look that bad, they don''t really convey any kind of localized
    damage. To remedy this, it''s possible to use "gore caps" and "blood flowers".
    These artist created models can be attached to the end of a damage zone joint
    to create the appearance of bone shards or bloody entrails. Since they are defined
    per damage zone, it is possible to provide a unique context-specific gore cap
    for any given break point. It''s also possible to detect whether a matrix has
    been flattened within a shader and react accordingly, possibly blending between
    a damage texture created with procedural texture coordinates or fading out the
    polygons completely to show interior surfaces. In coordination with particle systems
    for effects like blood, a very rich visual presentation can be created.'
  merge: -1
  img_proc: true
