- pgno: 72
  md: '# 2.6 User Content


    Modding is a computer game community slang expression that is derived from the
    verb "modify", used particularly with regard to creating new or altered content.
    Modding was once regarded as a fringe activity, but is now encouraged since it
    extends the shelf life of games. Tools are provided to help the gaming community
    create additional content requiring the purchase of the game itself, which provides
    additional content and revenues at no additional cost for the developers. In fact,
    strong communities are developed and provide strong viral marketing, thereby creating
    additional stickiness and loyalty to the game developer. Content created by end
    users is referred to as user content or as player content.


    In order for end-users to create content, the game developer has to provide access
    to a simplified or more robust version of the game editor, scripting, and content
    pipeline. Since end-users are not likely to have access to expensive DCC tools,
    it is important to provide an asset pipeline that can also take advantage of free
    tools such as Blender [36], Google SketchUp [37], or XSI Mod Tool [38]. Crymod
    is an example of a successful modding community for the Crytek games, which has
    its own portal on the web at http://www.crymod.com/. Crytek has partnered with
    Softimage (now owned by Autodesk) to offer a specialized version of their COLLADA
    exporter that provides a free-to-use professional grade tool with integrated asset
    pipeline to enhance the creation of high quality user content. The modified exporter
    uses specific name semantics that are recognized by the Crytek engine and used
    to connect the created content to their physics and other game-specific entities.
    It should be noted that this asset pipeline (Mod Tool to COLLADA to CryEngine)
    was not used by Crytek to develop their own game, but was designed specifically
    for the modding community. But now that this tool chain has been developed, it
    has also found internal usage.


    More and more user content can be found online in 3D content'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'repositories. Google 3D Warehouse has been offering the capability for SketchUp
    users to upload content to this repository, allowing anyone to search and download
    the content in the COLLADA format. With the introduction of SketchUp 7.1 features
    providing free import and export of COLLADA, it now is possible for content created
    in any other tools to be uploaded into the warehouse to be shared with other users.
    Since the warehouse is connected to Google Earth, there are many models of existing
    buildings and ever increasing variety of content. Taking advantage of this content
    in the prototyping phase of a game is something that should be considered since
    it is a good shortcut for developing the gameplay before replacing the content
    with the real assets later on. Another user content website has taken a different
    approach: www.3dvia.com (a Dassault Systèmes company) enables users to upload
    the content encoded in many source formats and automatically run conversion tools
    on the server so that any uploaded content is made available in both 3DXML (a
    Dassault proprietary format) and COLLADA. At the time of this writing, more than
    150,000 users and 15,000 models are active within this 3D user content community.


    Some games go even further in taking advantage of end-user creativity. Spore,
    a game from Maxis/Electronic Arts, is a good example in which the user is provided
    content creation tools to make their own creatures, vehicles, and buildings to
    use in the game. The latest edition of Spore extends the principle to the creation
    of adventures, or mini-games. The motto of this type of game is that “the fun
    is in the tool”, and Spore users had a lot of fun, as it is reported that more
    than three million creatures have been created already. During SIGGRAPH 2009,
    Will Wright, creator of the The Sims and Spore, delivered a keynote [39] in which
    he announced an additional step in favor of user content. With the latest patch
    for Spore, users cannot only create content that enriches the game for everyone
    else, but can also export the creature from the game into the COLLADA format [40].
    This small change opens up a world of possibilities for end-users. The creatures
    are exported with their skeleton and skin, as well as'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'diffuse, specular, and bump maps. Already, many end-users have given freedom
    to their creatures from the *Spore* engine and used sophisticated rendering and
    materials to embellish their creations, which they then share with others. (For
    example, see the "Majestic Dragon" on the accompanying CD.) More sophisticated
    users are creating animations that have been posted on YouTube. These advanced
    users are now educating other users and trying out all the tools that can import
    COLLADA models. In the future, it is likely that short animated features will
    be created by end-users, but even more exciting will be the intersection of different
    gaming communities. It is possible that there are already *Spore* creatures fighting
    inside a CryMod!


    # The Future


    Pandora''s box is open, and there is no turning back. User content is growing,
    and the need for an easy-to-use asset pipeline for both end-users and professional
    content developers alike is growing. 3D is making its way toward becoming main
    stream media, just like audio and video in digital form are now commonly produced
    and consumed via mainstream media. It is expected that the need for a better asset
    pipeline is growing as 3D is becoming more pervasive. In particular, the consumer
    availability of native 3D display TVs and monitors [41], advanced shader-capable
    3D accelerators in mobile devices [42], and native hardware-accelerated 3D rendering
    inside web browsers [43, 44] are also pushing the envelope.'
  merge: -1
  img_proc: true
