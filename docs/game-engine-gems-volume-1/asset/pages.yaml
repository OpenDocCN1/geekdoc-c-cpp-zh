  md: "Some game objects need to perform an update once per frame on the position\
    \ of their sound emitter. For example, you may have a sound that moves along a\
    \ predefined path and need to update where it is on that path each frame. To achieve\
    \ this, we take advantage of the sound grid's structure to allow for dynamic sounds.\
    \ During each frame, a game object such as a car can move its sound emitter. To\
