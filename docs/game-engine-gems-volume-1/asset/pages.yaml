- pgno: 257
  md: 'like. For bonus points in the memory category, you could make a dynamically
    resizable version of this structure that holds only delta states that change between
    to this draw call and the previous one. In effect, this matches closer to what
    the APIs use internally, but for the complexity involved, the simple version presented
    above will suffice for the descriptive purposes of this article.


    # Device-Independent Resource Handles


    By design, the `RenderCommand` structure must contain handles to device resources
    that it will reference when executing the draw command. This exhibits a problem
    in that directly exposing device handles to the rest of the systems makes it difficult
    to port the engine to other platforms, often causing rendering code to be spread
    out across the entire project. As such, it''s often useful to create managers
    that hold the actual device-specific resource handles and offer a wrapped handle
    to the rest of the systems. These `ResourceHandle` objects can help the process
    of porting the code to other platforms and also grant you a buffer interface for
    doing asynchronous asset loading. A full discussion regarding the issues of multithreaded
    resource creation and management is beyond the scope of this gem. For more information,
    we refer the reader to [1] as an introduction to the topic.


    # Filling a RenderCommand Structure


    A given `RenderCommand` structure simply references device information that it
    needs to execute. It does not, in contrast, actually load or own the device resources
    itself. As such, another class, which we will call a `RenderObject`, is responsible
    for managing the lifetime of a given resource (the actual resource itself should
    be owned by the manager responsible for it at a lower level, as described previously).
    Before filling in a `RenderCommand` structure, we assume that a given `RenderObject`
    structure has already been loaded into your engine and has communicated with the
    device in such a way to acquire proper rendering resources'
