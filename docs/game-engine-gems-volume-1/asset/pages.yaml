- pgno: 432
  md: '# Overview


    Rendering decals is a common method used to apply more detail to 3D worlds dynamically.
    Decals are often used to add bullet holes, blood stains, tire marks, and similar
    items to a world as events occur in a game, but they can also be used by level
    designers to enrich the environment with wear and tear textures, dirt textures,
    signs on walls, etc.


    This gem presents a decal rendering technique that uses deferred shading to produce
    scenes like the one shown in Figure 20.1. The technique is entirely shader based,
    extremely lightweight on the CPU, does not need to dynamically generate triangles,
    and is a straightforward addition to most 3D engines.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_432_0.png)


    **Figure 20.1:** Decals applied to complex geometry.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# ## 20.1 The Problem


    There are several things that a good decal system should solve:


    +   1. The system should integrate well with lighting. Decals should not only
    change the color, but also change the normal, specular factors, and any other
    surface parameters such that they become indistinguishable from all other geometry.


    +   2. Decals should work convincingly on all surfaces, static and dynamic.


    +   3. Decals need to clip properly to geometry boundaries, and possibly even
    wrap around corners.


    +   4. The system needs to work with geometry that might be very different from
    the geometry used for collision detection.


    Item 1 in this list is easily solvable when the graphics engine includes deferred
    rendering capabilities [2]. For forward renderers, the system in this gem can
    still be used, but some modifications will be necessary. For a thorough explanation
    of deferred shading, please refer to [3,4,5,6].


    Item 2 can be solved if we can get our hands on a free 8-bit channel in the G-buffer.
    If not, we can at least make it work on static geometry. This is discussed in
    Section 20.5.


    Item 3 is where the real problems begin. The decal needs to follow the surface
    to which it is applied, even if that surface is highly tessellated. Some existing
    decal rendering techniques generate a triangle representation for a decal on such
    a surface [1], but this can be computationally expensive. Furthermore, the raw
    mesh is often not available at all on the CPU since the mesh data is loaded into
    a vertex buffer accessible only by the GPU at a reasonable speed.'
  merge: -1
  img_proc: true
- pgno: 434
  md: Item 4 is an issue because today's games often use very complex meshes for rendering,
    but a less detailed mesh might be used for collision detection. The difficulty
    is that the point of intersection that a ray cast returns might differ quite a
    bit from the location where the decal must be rendered.
  merge: -1
  img_proc: true
- pgno: 435
  md: '# 20.2 The General Idea


    The basic solution afforded by our technique is to project a decal onto a surface
    using a special fragment shader applied to the decal''s bounding volume instead
    of rendering new decal polygons on top of the scene geometry. The only information
    required to achieve this consists of the position and orientation of the decal,
    the decal''s size, and a texture containing depth values for the viewport being
    rendered. This information allows all computation to be done in the vertex and
    fragment shaders.


    When rendering a decal, it is natural for us to work in "decal space", where the
    x- and y-axes lie in the tangent plane to the underlying surface at the decal''s
    center, and the z-axis is parallel to the surface''s normal vector at the decal''s
    center. In order to move data into the decal''s local coordinate system, the shader
    needs to be supplied with the inverse of the decal''s transformation matrix.


    The code in Listing 20.1 first fetches the depth from the G-buffer at the fragment
    position and uses it to reconstruct the 3D world-space position of the fragment.
    The `worldToDecal` constant is the inverse of the transformation matrix for the
    decal that we are currently rendering. With this matrix, we can transform the
    fragment''s position into the local space of the decal. This local position can
    then be used to compute texture coordinates at which the decal texture is sampled.
    In this first version, we are using the (x,y) position only, which simply projects
    the decal along its local z-axis onto the underlying geometry, as shown in Figure
    20.2.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_436_0.png)


    Figure 20.2: Using a simple projection onto the local x-y plane causes decals
    to be smeared in the direction of the local z-axis.


    Listing 20.1: This code determines the decal-space coordinates for the fragment
    being rendered and transforms them into texture coordinates for the decal. The
    RT_Depth texture contains depth values for the viewport, the worldToDecal constant
    is the inverse of the decal''s 4x4 matrix transform from decal space to world
    space, and the recipDecalSize constant is 1/s, where s is the size of the decal
    in the scene.


    ```

