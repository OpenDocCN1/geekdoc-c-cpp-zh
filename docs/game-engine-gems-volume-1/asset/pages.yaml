  md: 'have an early version of a progressive LOD system based on the work of [11]
    and [18]. It is little more than a vanilla implementation of the techniques described
    in these papers, with the exception that we modify the edge collapse heuristic
    to not collapse edges that lie on material boundaries or on the boundaries of
    regions. This eliminates the cracks between regions but the system is significantly
    slower than the discrete LOD approach. In particular, generating a low level-of-detail
    mesh with the progressive system takes at least as long as generating a high-resolution
    mesh, plus the time taken to perform the simplification. In contrast, our current
    discrete approach can generate a low LOD in much less time than the higher LOD.


    # 3.4.3 Threading the Algorithm


    Interactive volume editing is crucial for allowing designers to build their 3D
    worlds, and within our engine we like to think of it as a game play feature as
    well. Therefore, it is essential that the regeneration of a dirty region''s surface
    is performed as quickly as possible. Efficiently threading the algorithm can go
    a long way in helping us achieve this goal.


    Our system is illustrated in Figure 3.5 and works as follows. Our main game thread
    handles logic and rendering and is the only one to have both read and write access
    to the volume. Voxels are modified based on user input and in-game events, and
    the region''s dirty flag is set. We periodically collect dirty regions and populate
    a simple `TaskData` structure with the region, the required LOD level, and a priority.
    This priority is based upon the region''s distance from the camera, such that
    nearby regions will be regenerated sooner. The task data is added to a prioritized
    queue of tasks that need to be processed. If the task is already in the queue
    then there is no need to add it again, as the corresponding region is already
    scheduled for an update.'
