  md: '# # 17.2 Rendering to the Velocity-Depth-Gradient Buffer


    At some point in time before post-processing is performed, we must fill a dedicated
    velocity-depth-gradient buffer with the information that will be used to generate
    the motion blur effect. Many modern engines render a depth-only pass at the beginning
    of a frame in order to maximize the effectiveness of hierarchical depth buffering
    capabilities built into the graphics hardware. This gives us a convenient place
    to also render our velocity information without having to pass vertex data through
    the rendering pipeline a second time. Since many engines also require a linear
    depth value to be generated and stored early in the frame in order to render some
    types of special effects, it is doubly convenient that such a depth is one of
    the values we must calculate and store in the velocity buffer.


    We render out velocity, depth, and gradient values into a floating-point buffer
    having 16 bits per channel. It is possible to implement the technique described
    in this gem using a conventional integer buffer with 8 bits per channel, but the
    small amount of available precision for the depth value in that case limits the
    practical range for which we can eliminate motion blur artifacts to an unacceptably
    short distance in front of the camera.


    To calculate a two-dimensional screen-space velocity, we determine the screen-space
    positions for each vertex over two consecutive frames, subtract them, and then
    multiply by a normalizing scale factor. The homogeneous screen-space position
    P_screen of a vertex is given by


    ```

    (17.2) P_screen = M_viewport M_proj M_camera M_model P_model +

    ```


    where P_model is the model-space vertex position, M_model is the matrix that transforms
    model-space points into world space, M_camera is the matrix that transforms worldspace
    points into camera'
  merge: -1
  img_proc: true
