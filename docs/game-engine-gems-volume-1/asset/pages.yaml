- pgno: 151
  md: '# 5.3 Constructing the Sound Grid


    The sound grid is constructed using data from both static and dynamically moving
    game objects. A game object is an object created by the game that has information
    about the sound event it wants to play and where the sound should be positioned.


    The sound grid is first constructed using the static game objects. We process
    each static game object present within the game world only once when the game''s
    level is loading. We use the audible distance and position of each game object
    to determine which grid cells its sound emitter touches (see Figure 5.2). We construct
    a single sound emitter for that game object and setup its m_cells_touched_array
    member for the number of cells within audible distance. For each of those grid
    cells within audible range, we use a free element in the m_cells_touched_array
    member to form a link between that cell''s appropriate priority list and the newly
    constructed emitter. We return the pointer for the newly-constructed sound emitter
    object back to the game object to optionally store in case it needs to later make
    modifications to the emitter''s state.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_152_0.png)


    # Figure 5.2: Sounds emitters using their audible distance to determine which
    grid cells they touch.


    Some sound emitters do not occupy a single fixed position in the game world. For
    example, you may have a spline representing a river that is to have a sound emitter
    placed at the position nearest to the listener on the spline. Another example
    may be that the game world contains a forested region inside of which you wish
    to play a bird chirping sound at a randomly determined position. For these cases,
    we construct the sound emitter as with static sounds, but do not add it to any
    grid cells. We treat these as dynamic sound emitters, which will be changing which
    grid cells they belong to as the game progresses.'
  merge: -1
  img_proc: true
