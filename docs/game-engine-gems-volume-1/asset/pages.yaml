- pgno: 160
  md: '# 5.5 Supporting Multiple Listeners


    Some games need to support more than one player using the same television or monitor.
    This requires that the display is split in some fashion to show both players''
    view of the world. As well as having both players'' view being processed by the
    same game console, we must also divide up the sound channels to represent what
    each player is hearing. The sound grid can be modified to support this with a
    few changes to the way the active list is built:


    +   - We first construct an active list for each listener present in the game.

    +   - Once this has been done for all listeners, we copy the highest priority
    sounds from each list into the master active list.

    +   - We then make sure any sounds that were in any of the listeners'' active
    lists and didn''t make it into the master active list are not playing.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 5.6 Extensions


    The sound grid is one possible solution to culling sounds occupying known world
    positions. While the implementation discussed in this gem only constructs a two-dimensional
    grid, this technique should work without change for most types of game worlds.
    If your game contains a high number of vertical sounds occupying a nearby space
    in x and y, then the process can be extended to allow for culling sound emitters
    in the z dimension. Either you may wish to have multiple sound grids, with each
    one at a different z height, or expand into a 3D sound grid.


    Additional future work can be performed on the sound grid, such as embedding additional
    information about the grid cell or sound emitters, such as which reverb effects
    to apply to the emitters, or whether we need to apply a filter (due to an obstruction
    between the sound emitter and listener). Dynamically generated sounds, such as
    gunfire, may also be able to use information contained in the sound grid to calculate
    any filtering that needs to be applied, avoiding the need to perform expensive
    tests in real time. Also, additional optimizations could be made to the sound
    emitter linked lists. We could, for example, add a head and tail node to each
    linked list and thus remove the conditional tests surrounding the insertion and
    removal of a sound emitter to a grid cell.'
  merge: -1
  img_proc: true
