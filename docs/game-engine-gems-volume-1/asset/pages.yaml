- pgno: 202
  md: 'So, there you have it! The above code will partition a set of data into two
    pieces very well. Still, refinement is required to get a good global fitting to
    the data. Also, be aware that the data structures shown are for educational purposes
    only—you can do far better than O(logN) lookups everywhere.


    # Step 3 — Reassigning All Samples


    Now that we have two smaller clusters where one large, poorly fitted cluster used
    to be, there is no guarantee that every sample in these two clusters are closest
    to their centroids. Mathematically speaking, they will be closest to one of the
    two centroids. Further, samples that previously belonged to other clusters may
    be attracted to these shiny new centroids because they''re a closer fit than their
    current one. Global sample allocation refinement reduces the measurable sample
    error, yielding a better palette. Also, future iterations will measure the quality
    of clusters based on how "well-liked" they are by their samples. A cluster partitioner
    that never reallocated samples would end up splitting the wrong cluster eventually,
    and overall would not fit the data well.


    So, first, we clear out all the samples from their clusters. Then, to avoid infinite
    loops, the first thing we do is iterate over all the empty clusters and find the
    closest unallocated sample (using the error metric function) and assign it to
    the cluster. This associates something with every palette entry, so we don''t
    end up with unused spaces in the palette.


    Second, we iterate over all the samples and bin them out one-by-one to the closest
    cluster, using the error metric devised above. At the end, we recompute the centroid
    of each cluster so that the representative value is ideal for the samples it represents.
    This process of reassignment could be repeated if desired, as it should be quite
    stable if the algorithm is implemented correctly. If samples migrate to a couple
    of clusters, it probably indicates a slightly imbalanced error metric.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Step 4 — Termination


    Whenever the cluster count reaches the desired number of palette entries, stop
    iterating. A final reassignment is effectively the final palettization of the
    data. In case there are fewer unique samples than palette entries, the error metric
    should return zero because there is a palette entry for every possible input.
    Another simple check is that the cluster count did not change over the last iteration.
    In any of these cases, the algorithm has completed, and the palette and palettized
    data can be written out.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 7.5 Future Work


    Error diffusion is an interesting technique that drastically helps heavily compressed
    images. While definitely not appropriate for non-image data sets, when using error
    diffusion, one might tweak the algorithm to intentionally reduce to 2N colors
    in the palette, then start attempting to find pairs of colors in the palette that
    interpolate at 25%, 50%, and 75% to other colors in the palette. Those colors
    that can easily be interpolated from existing palette entries could be removed
    from the palette easily and induce relatively little error. Some care would need
    to be taken to ensure that samples are kept with preference for those that appear
    most frequently in the source image.


    It is plausible that converting the colors to a more meaningful color space, one
    that interprets the color channels differently by separating important data into
    one channel, and less important data into other channels, the quantizer could
    be guided to prefer accuracy on one axis more than others. One such specific color
    space is Y''CbCr . For instance, the chrominance values Cb and Cr can be given
    lower weighting than the luma value Y'', which is more perceptually relevant.
    This should help the overall contrast and brightness control of the final image,
    at some expense to color range. In theory, it sounds like a good idea and is a
    simple convolution applied to the input data.'
  merge: -1
  img_proc: true
