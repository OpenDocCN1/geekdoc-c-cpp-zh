    can directly load PSD images and may even take advantage of layers and other additional
    information. Interestingly, Adobe has recently made available the open source
    Generic Image Library [15], which aims at simplifying and optimizing the processing
    of image assets, but unfortunately, it does not provide I/O support for Adobe''s
    own PSD format!


    In the past, game engine developers had to create their own'
  merge: -1
