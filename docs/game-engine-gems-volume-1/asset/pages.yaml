- pgno: 178
  md: 'Adding an item to a `GuiSelectableGroup` object is done via the `AddItem()`
    function, which provides the option of automatically attaching the new item''s
    `Frame` to this one. If used as a menu, this attachment means that all items in
    the menu can be moved together, perhaps animated onto or off of the screen just
    by animating the x component of the root node matrix. Note also, that after adding
    items to an empty list, if we want one highlighted, we still want to manually
    do that, or call `HighlightNext()` to highlight the first available. This is typical
    for a console or keyboard-based control system.


    This class conforms to the *composite* design pattern, as the `GuiSelectableGroup`
    class itself derives from the `GuiSelectable` class. This straightforward, but
    powerful distinction means that it inherits the ability to be selected, to be
    highlighted, and importantly, to be included in a list inside another `GuiSelectableGroup`
    object. This is useful for a number of situations—for example, with an options
    screen where the main items run vertically, selected by up/down on the joypad,
    but where some items provide multiple options to choose from, such as selecting
    low, medium, or high for graphics detail, stereo or mono for sound, etc., which
    run horizontally.


    In conforming to the composite design pattern, the `GuiSelectableGroup` class
    is responsible for managing calls through the `GuiSelectable` virtual functions
    too. `Update()` and `Render()` calls are passed through to all contained `GuiSelectable`
    objects, the `OnSelect()` function determines the currently highlighted item and
    (if present and active) calls the relevant `OnSelect()` function only on that
    item. Functions such as `OnHighlighted()` and `SetActive()` follow a similar pattern,
    though it is worth browsing the code to see the details of when objects become
    active or not.


