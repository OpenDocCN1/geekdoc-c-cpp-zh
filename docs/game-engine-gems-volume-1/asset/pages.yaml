- pgno: 145
  md: '# Overview


    Each generation of game hardware brings with it new and exciting challenges for
    developers to tackle. One constant challenge with each hardware iteration is how
    to process data efficiently in real time. This must be done optimally to maximize
    hardware performance and deliver competitive results.


    A number of techniques have been developed to efficiently handle spatial data
    for various systems. These include techniques such as using space partitioning
    structures to cull geometry that is not visible to the camera and using different
    AI complexity levels to reduce the processing time spent on distant or hidden
    characters.


    A problem that receives less attention, however, is that of determining how to
    select and process real-time audio within a scene. There may be hundreds or thousands
    of permanent environmental sound sources in a scene in addition to the many transient
    sound sources that occur during gameplay, but only a small subset of them can
    actually be playing at any one time for performance reasons. This gem discusses
    a technique for efficiently reducing the complete set of sounds to the active
    set that is audible to the player.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 5.1 The Problem


    As our game environments increase in graphical detail, so too must our levels
    of audio detail to match the graphical representation of the game world. Numerous
    sounds are commonly layered to construct a game''s environmental ambiance. This
    supersedes earlier techniques, which would have played a single stereo file to
    achieve the same goal. The advantage to playing multiple sounds, rather than a
    single audio clip, is that the sound closely matches the player''s surroundings.
    For example, if the player was inside an old haunted house, there could be a grandfather
    clock, a television showing static, and wind howling through open windows. As
    the player moves through the house, the ambiance changes as the player goes from
    room to room. The player could change the ambiance by closing the windows or smashing
    the grandfather clock.


    Environmental sounds to be played are selected from those near the listener. The
    listener represents a position and orientation in the game world from which the
    player is listening. Usually, this is either attached to the camera rendering
    the player''s view of the world, or it uses some variation of the player''s position
    and the camera''s orientation.


    The problem we must address is how to handle the multitude of sounds positioned
    within the game world. These sounds range from statically positioned continuous
    sounds such as fires and rivers, to more complex and dynamic audio events such
    as a crowd cheering on a fight, or a character interacting with a piece of animated
    geometry such as a lever.


    All of these cases require that a sound emitter is placed within the world, either
    manually by a designer or as part of an automated process. Sound emitters are
    used to control how and when the sound is triggered, and most have a position
    from which the sound is triggered.'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'A sound emitter also contains a pointer to a sound event. Sound events are
    objects containing information about how to play a sound, such as which wave file
    to play, volume, audible distance, pitch settings, and a priority. Priority checks
    are used as a method to select which audio channels are made available to the
    newly-requested sound event when there are no free channels available. If there
    are no channels available with a lower priority, then the requested sound event
    is not played.


    While the game is running, each active sound emitter checks whether the listener
    is within audible distance (see Figure 5.1). If this test succeeds, and there
    are no free sound channels available, then a priority check against all currently
    playing sounds is performed. If both tests are passed, then the emitter can finally
    start playing its sound. The number of tests being performed each frame has increased
    as the number of sound emitters has risen in a typical game. Therefore, we need
    a fast method for rejecting large numbers of unsuitable sound emitters.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_147_0.png)


    Figure 5.1: All sound emitters testing against the listener.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 5.2 A Sound Culling Solution


    We need to find a way to efficiently cull sound emitters that are not within an
    audible distance of the listener. We also need to cull any remaining sound emitters
    whose priority is too low to consider playing. The solution presented here involves
    the construction of a sound grid as a means of rapidly culling large numbers of
    sound emitters positioned within the game world. The sound grid is a two-dimensional
    grid parallel to the x-y plane that encompasses the entire game world. The grid
    is made up of equal-sized cells, and each cell contains an array of sound emitter
    lists. Each list within the array represents a different priority value, starting
    with the highest priority taking index 0 in the array. All sound emitters within
    a list have the same priority, matching that represented by the array''s index.
    The sound emitters stored in these lists are those that are within audible range
    of that grid cell.


    Since each grid cell contains lists of audible sound emitters, we only need to
    determine which cell contains the listener in order to know which sound emitters
    should be playing. This avoids having to perform complex searches for suitable
    sound emitters in real time.


    We use a fixed cell size, rather than dividing up the space unequally, due to
    the nature of sound emitters. Sound emitters may be in physical proximity to each
    other, but have wildly differing audible distances. These different audible distances
    would cause any form of grouping to be potentially less efficient and result in
    more processing being used to determine which sound emitters are audible. Having
    a fixed cell size also allows for optimizations when determining which grid cell
    is occupied by the listener. The size of a grid cell can vary depending on your
    application, but too small of a size can lead to performance problems.


    We take advantage of being able to group the sound emitters into priority lists,
    as most applications will only use a limited priority'
  merge: -1
  img_proc: true
- pgno: 149
  md: "range, typically between 5 and 10 different priority levels for environmental\
    \ sounds.\n\nUsing a culling system such as a sound grid allows the audio system\
    \ to rapidly cull thousands of potential sound emitting objects very quickly by\
    \ only storing what can be heard within a given area of the world. By storing\
    \ the sound emitters in matching priority lists, we can start by processing the\
    \ highest priority list and quickly bail out of our sound emitter processing if\
    \ we have run out of free sound channels and have reached a priority level that\
    \ is too low.\n\nListing 5.1 shows an example sound grid cell along with an example\
    \ sound emitter and linking class used to bind them. We use instances of the `SoundEmitterLink`\
    \ class within the `SoundEmitter` class to form the linked list connecting up\
    \ sound emitters of matching priority within a cell. The `SoundEmitter` class\
    \ contains the `m_cells_touched_array` member, which is an array of `SoundEmitterLink`\
    \ objects. The array's size is set on constructing the sound emitter object, and\
    \ should be the maximum number of cells that could be touched by that `SoundEmitter`.\n\
    \n# Listing 5.1: This pseudocode shows an example sound grid cell and sound emitter.\n\
    \n```\nstruct Cell\n{\n    SoundEmitterLink *m_emitter_list[MAX_PRIORITY\n};\n\
    \nstruct SoundEmitterLink\n{\n    Cell *m_cell;\n    SoundEmitter *m_parent;\n\
    \    SoundEmitterLink *m_prev;\n    SoundEmitterLink *m_next;\n};\n```"
