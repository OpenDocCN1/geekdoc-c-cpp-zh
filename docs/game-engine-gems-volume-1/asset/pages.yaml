- pgno: 228
  md: '# ## 8.4 Outlook


    Using stereoscopic displays is a great way to increase the gameplay value in the
    form of immersion. This is still somewhat of an unexplored field even though stereoscopic
    displays have been used for a longer period of time in other fields such as scientific
    visualization. The film industry has more experience than the game industry with
    stereoscopic displays, and we are now starting to see more and more movies created
    for these types of displays. When will the game industry follow in those footsteps
    and release more games that are directly catered for stereo enabled devices? So
    far, the majority of the games that are stereo capable are ports from monoscopic
    games. The step from monoscopic to stereoscopic also gives us game developers
    a new dimension to create more interesting games design-wise. After all, 3D stereoscopy
    is regarded by the film makers as yet another important storytelling technique.
    The future will hold many new design approaches, both from a pure rendering perspective
    and also from a gameplay perspective. An interesting approach is to render the
    scene from one virtual camera position and use the information in the depth buffer
    to generate a stereo pair using Depth-Image-Based Rendering (DIBR) [7]. A simple
    example of a unique gameplay experience available only in stereo could be the
    sniper scope common in many games involving guns. The standard way of handling
    this is to render a circle in the middle of the screen where the player sees the
    zoomed-in piece of the world. The stereoscopic version could then, when the player
    zooms with the scope, black out one eye and the player would also loose the stereopsis,
    giving more realism and immersion.


    The future also holds other types of stereoscopic displays called auto-stereoscopic
    displays. These displays function without glasses, but must render many more than
    two views [11, 5]. Even though the technique has been around for a long time,
    it still has not been widely accepted because it has some drawbacks such as ghosting.
    Making sure that your game engine is adopted for plano-'
