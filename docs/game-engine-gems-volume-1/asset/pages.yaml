- pgno: 274
  md: '# Overview


    The PlayStation 3 and Xbox 360 game consoles both contain unified memory architectures
    in which the GPU can directly read to and write from CPU-accessible memory. The
    graphics APIs on these consoles allow graphics data to be placed anywhere in memory
    and provide the ability to directly create and manipulate GPU resources such as
    textures or vertex buffers. With this low level of control, it is natural to consider
    the construction of streaming systems in which we dynamically load, move, and
    unload the resources that the GPU renders.


    Streaming systems require that data is copied into memory where it can be accessed
    by the GPU for rendering. One implementation option is to manage all data copying
    with the CPU through a traditional `memcpy()` style API. Since the CPU and GPU
    run concurrently, we need to take care to ensure that any data is in place when
    the GPU is ready to read it. However, dealing with the synchronization overhead
    in achieving this can be complex and error prone.


    In this gem, we describe an alternative solution that uses the GPU to manage the
    data copying. This approach ensures that the complexity and overhead of synchronizing
    GPU operations and data movement are vastly reduced. In addition, this approach
    removes the CPU costs for data copying and, on our target platforms, allows us
