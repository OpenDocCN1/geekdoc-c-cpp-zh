- pgno: 625
  md: '# Chapter 17: Motion Blur and the Velocity-Depth-Gradient Buffer


    Listing 17.1: This GLSL vertex shader first transforms the vertex position for
    the current frame to homogeneous clip-space coordinates in the ordinary manner
    using the model-view-projection (MVP) matrix. The shader then transforms the vertex
    position into screen space for both the preceding frame using the matrix motionA
    and the current frame using the matrix motionB. The resulting positions are output
    as texture coordinates that will be read by the fragment shader.


    Listing 17.2: This GLSL fragment shader calculates the screen-space velocity and
    writes it to the red and green components of the output color. The velocityScale
    parameter holds the value of s/rmax shown in Equation (17.6). The depth is taken
    directly from the w-coordinate of the current position and is written to the blue
    component of the output color. The gradient of the depth is calculated using the
    hardware derivative functions, and the larger of its components is written to
    the alpha component of the output color.


    Listing 17.3: This GLSL fragment shader applies the motion blur effect in the
    post-processing pass. The nine color samples are accumulated in the x, y, and
    z components of the color vector, and the number of valid samples is stored in
    the w component of the color vector. The value of minDepth is calculated using
    Equation (17.9), and only samples having a depth at least this far from the camera
    plane are used to generate the final blurred pixel.'
  merge: -1
  img_proc: true
