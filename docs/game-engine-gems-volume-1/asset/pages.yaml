    model. (Image courtesy of Terathon Software LLC.)


    Figure 17.3: (See also Color Plates.) In these two images, the camera is rotating
    around the character, causing the ground to move across the screen while the character
    is almost completely still. In the left image, the depth and gradient information
    in the velocity buffer is not considered, and all color samples along the direction
    of the velocity are used. Notice the ghosting of the glowing parts of the character''s
    armor and the fuzzy halo surrounding his legs. In the right image, the depth and
    gradient information in the velocity buffer is considered, and the rejection of
    the appropriate color samples eliminates the artifacts. (Images courtesy of Terathon
    Software LLC.)


