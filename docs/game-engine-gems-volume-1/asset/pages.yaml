- pgno: 19
  md: '# 1.1 Middleware, How Do I Love Thee?


    Modern games are very rarely works comprised entirely of proprietary, custom code
    written by in-house developers. The amount of polished functionality required
    to compete in the games industry is simply an enormous task for a single studio
    to undertake, and is in a word, unproductive. These days, game programmers are
    expected to be comfortable using certain wheels that have been invented elsewhere
    and only reinventing those that provide tangible benefits to their project or
    studio by directly contributing to the success of a title or differentiating them
    in some way from the competition. Given that some middleware libraries will be
    chosen to fulfill certain needs, and often there are several products to choose
    between with similar feature sets, we ask, "What are the considerations a team
    should take into account when comparing middleware products?"


    Let''s assume that the language of choice is C/C++, as is most common today with
    middleware and game development. Let''s also assume that we''re discussing an
    existing codebase where a specific feature is missing that can be filled by middleware,
    and that the team''s desire is to be surgical during integration and leave the
    smallest scar possible should it need to be removed.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.2 Integration Complexity and Modularity


    The first, most important feature of a middleware package is its integration complexity.
    Good libraries are highly modular, minimally intrusive, and easy to plug into
    very different codebases. In short, they make very few assumptions and are fairly
    decoupled from implementation details of other systems. A good library should
    come with reasonable defaults or require very limited configuration before the
    system is in a testable, working state. The integration engineer''s level of experience
    can play a role in the usability of a system, so minimal integration is key. This
    promotes a rapid evaluation cycle—it leaves a bitter aftertaste when an engineer
    has a long integration cycle, only to find the library is not desirable. My rule
    of thumb is two days. Anything that takes more than two days to get running will
    waste a week putting it through its paces, and there aren''t enough weeks in a
    development cycle to try out alternatives.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 1.3 Memory Management


    Console developers all know that careful memory management is crucial to a stable
    product. Middleware intended for virtual memory-backed PC systems, or even those
    technologies with hefty demands that next generation consoles can satisfy, may
    not be suitable for the more modest RAM budgets of yesteryear. It''s important
    to know not just what memory budgets are expected, but also who is responsible
    for managing the allocations.


    Ideally, each middleware library will have its own memory management scheme that
    simply initializes with two arguments: a pointer to a block of memory and its
    size. A middleware library author is the person most knowledgeable of the sizes
    of allocations, the churn rate for allocations, and the memory management algorithm
    most appropriate to prevent fragmentation within their own allocation pool. Further,
    this has the advantage of explicitly notifying the developer when the memory budget
    has been exceeded, rather than collecting undesirable large amounts of memory
    from the main heap where tracking down memory consumption can be tedious and problematic.
    Also, this method tends to highlight integration mishaps where library assets
    are being leaked, because it soon fails when the heap is exhausted. A resizable
    heap is sometimes desirable, specifically if certain game levels need to shift
    memory privileges to emphasize different systems, though this feature is fairly
    rare.


    In the absence of a completely isolated heap managed by the middleware library,
    a good fallback is one where you are expected to provide a pair of missing functions
    for `alloc()` and `free()`, you can override weakly declared functions with your
    own, or lastly, you can compile the library from source and are able to provide
    a `#define` macro used throughout for allocation. None of these methods incur
    per-allocation function call overhead because they are resolved by the compiler
    or linker. In this method, you have the option of forwarding allocations to the
    main heap'
  merge: -1
  img_proc: true
- pgno: 22
  md: '(refrain!), or declaring a special heap that is dedicated to the subsystem
    using your choice of allocation strategy. Some middleware provide only a method
    for registering allocation callbacks. It is a common pet peeve to unnecessarily
    waste CPU cycles, and this is one minor gripe I have about otherwise solid offerings.


    The worst possible situation is a library that is littered with direct calls to
    new/malloc and delete/free. This provides you no simple means to encapsulate the
    system''s resources and no simple way to measure or limit its consumption.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1.4 Mass Storage I/O Access


    Accessing optical media is very slow, and seeking—even on hard drives—can dominate
    load times. While certain kinds of middleware need to access the file system,
    particularly sound systems that stream music or asynchronous streaming systems
    that load game assets in the background, most do not need direct access to the
    physical media API.


    These exceptions aside, middleware generally does require access to some assets,
    but it should never do so by directly requesting them from the underlying system
    API. A good middleware library provides explicit hooks for the developer to overload
    file and data requests easily so they can be funneled through any custom file
    system (e.g., WAD or pack files) in which the developer may have chosen to store
    data or redirect the file request to different hardware.


    The most flexible libraries do not attempt to treat data as files or streams at
    all, rather they deal exclusively with bulk memory buffers and leave resource
    acquisition firmly in the hands of developers. This approach simplifies error
    handling and load time optimization, and it is more rapidly deployed to new hardware
    with dependable results.


    The worst middleware libraries (I''ve seen this frequently in open source code)
    assume that a POSIX file system is always available, or one like it, and depend
    directly on C Runtime Library calls such as `FILE` and `fopen()`.


    Another misguided attempt to address file system abstraction is the invasive extension
    of file streams by providing an abstract interface for a reader/writer class that
    the user provides. A derived instance of this interface grabs data via a virtual
    function one byte at a time, or even in small fixed sized blocks. This maps very
    poorly to real-world data and performance characteristics, and it should be'
  merge: -1
  img_proc: true
- pgno: 24
  md: avoided at all costs.
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 1.5 Logging


    There will be times when expectations will not be met inside a middleware library.
    A good library handles warnings in a uniform way and has a way to integrate them
    into your existing log system. Better libraries will have some kind of trivial
    verbosity setting that ranges from noisy to absolutely silent and will preferably
    compile out the strings and error checking entirely. Noisy verbosity settings
    that spew plenty of details about the data being fed in affords developers a sense
    of trust that the library has been integrated correctly and its files are being
    read properly. However, if you cannot compile this out entirely, it comes at a
    cost of memory and CPU performance that is unacceptable in final shipping builds.
    Some middleware comes with release and debug libraries for this reason alone.


    The best architected middleware products have a simple method for hooking a logging
    output callback so the logs can be integrated into the game''s existing reporting
    system. Beware any library that blithely calls `printf()`, since this function
    is relatively expensive and may not even have a standard output pipe connected,
    providing no means to alert the user.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.6 Error Handling


    The best middleware will not have error conditions at all because they always
    work. I hold out hope that such a thing exists. Meanwhile back on Earth, errors
    are inevitable, and the handling of them is an important trait when determining
    whether some software can operate in your project environment. There are different
    schools of thought about when an error is always fatal, always recoverable, or
    in the gray area in between. Middleware libraries that give you no choice in the
    matter, no way to override the handling of errors, tends to be graded downward.


    As console developers know, patching a game is often impossible, and some bugs
    are virtually impossible to reproduce or track down. Sometimes "heroic measures"
    are called for to guarantee the game does not crash even when some subsystem experiences
    complete and utter failure. Every piece of software should have some capacity
    to forward serious errors through a handler, where in a fit of desperation you
    can silence the sound system, clear the screen and print "You Win!" before hanging,
    or at least reboot. Steer clear of anything that appears to use `exit()`, `abort()`,
    or even naked `assert()` calls.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 1.7 Stability and Performance Consistency


    Middleware should be stable. After all, the main reason developers don’t write
    something themselves is the time required to write and debug it. Libraries that
    are unable to report (and attempt to recover) from common trivial errors are fragile,
    and will be often cursed by developers. The best middleware will never crash,
    will fix garbage inputs or ignore them, and will leave plenty of debugging breadcrumbs
    for programmers to follow while tracking down the problem. Top tools and engines
    can sustain significant data corruption and missing files without crashing outright,
    which can end up impeding an entire team’s progress while dealing with the problem.


    Every project has different expectations when it comes to performance, so it’s
    up to you to judge for yourself what is acceptable in absolute terms. However,
    every middleware library that you consider usable should also have a consistent
    memory and CPU performance profile. A stable frame-to-frame memory footprint is
    essential for shipping games on time. Occasional spikes in the frame rate can
    be hard to track down, too, and severely degrade the game experience. Good middleware
    should be a rock when instrumented with a profiler in every situation.


    A recent project I worked on had a single frame memory spike of 2 MB and 100 ms.
    After tracking it down, it was due to a minor change in how a level script was
    written. A more consistent virtual machine would have limited the number of instructions
    it would execute or limit execution to a time slice. A more stable library would
    have kept a closer watch on its memory usage. Anecdotal evidence is sometimes
    all you can get here until you run afoul with personal experience, at the worst
    possible time. Ask around.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 1.8 Custom Profiling Tools


    Whenever considering a package for inclusion, I am impressed with tools that reduce
    uncertainty near the end of a project. These include any system that comes with
    a monitoring API, or better yet, a profiler of some sort, that cuts days of potential
    programmer time near the end of the game when memory is tight, CPU time is scarce,
    and nobody knows where it''s going. Being able to immediately pull out a tool
    that can instrument a part of the game helps to rapidly narrow down the search.
    Gaining visibility into content is typically hard, so any help your middleware
    provides is tremendous.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.9 Customer Support


    Commercial middleware typically offers integration specialists, telephone support,
    direct email support, and forums or mailing lists. Sometimes, this is exactly
    what a team needs to move forward, especially when they reach a major stumbling
    block. The whole reason for middleware is to reduce risk and uncertainty, which
    customer support does. Middleware that comes with no expectation of support is
    useless. I have discarded more than a few great and promising technologies simply
    because the author was unavailable to answer a couple of questions.


    Watch for fast response times in forums and dedicated personnel who answer questions
    on the phone or in email, and be prepared to send your integration code to them
    when they ask for it. (That''s all the better reason to keep it tidy.)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 1.10 Demands on the Maintainers


    Programmers are busy, expensive resources. Middleware that requires a lot of effort
    and attention to integrate well with your flavor of build system is going to be
    kicked to the curb very quickly. Ideally, you simply add a library to the build
    process, #include a header file, and call a few functions. Ta-da! It''s integrated.


    Sometimes, the middleware is more invasive, and requires various #define macros
    to be set to configure it. Or perhaps it needs to be integrated directly into
    your project and compiled with your game. Additionally, some middleware has external
    dependencies that must be present for it to compile. Worse still, it may require
    introducing a new tool into the build process that may not work well with the
    build system. Turnkey systems are clearly preferable. I look for middleware that
    comes with GCC and Microsoft Visual Studio project files, but with extremely basic
    project configurations. This proves that the compilers I care about can handle
    the code, and that I can throw away the project files and integrate them my own
    way after an initial build using the provided project file.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 1.11 Source Code Availability


    Eventually, you may need to debug into the source code of a middleware product
    you plan to integrate. If it is a proprietary, closed-source product without a
    source code option at a reasonable price, look for alternatives. While certain
    "industry secret" parts of libraries may be binary-only, vendors know that source
    code is expected and will often provide it with a license. Those who don''t provide
    source typically claim that their customer support obviates that need. While this
    may be true, the moment there''s an issue that customer support can''t solve,
    but source code could, is the moment we start searching for a replacement. Again,
    a big reason for using middleware is that it''s proven and stable, so source code
    should not really be necessary. But the availability is still important should
    the need arise.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 1.12 Quality of Source Code


    Having source code does not always mean you have the ability to make meaningful
    changes. The best middleware has excellent documentation that is auto-generated
    from source on every new code drop. It will have a familiar and consistent bracing
    scheme, some kind of naming convention for functions and variables, and ideally
    will live inside a brief namespace.


    Take a moment to peruse the important header files. Inspect for `#define` macros
    for language keywords or common functions such as `new`, `min`, and `max`, or
    in fact any macro that escapes the scope of the header which could cause issues
    elsewhere. Use an archive-inspection utility such as `dumpbin` (in Windows) or
    `nm` (in Linux) to verify that the only exported symbols the middleware library
    defines are in a consistent namespace to avoid conflicts with other libraries
    or your own code.


    Questionable middleware will be littered with `#pragma` statements, will disable
    errors, will reduce the warning level, etc. Scrutinize this heavily. These statements
    being in header files can harm the quality of your code and may cause some files
    to stop compiling simply by including them.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 1.13 Platform Portability


    Certain kinds of middleware are likely to be platform independent, but even if
    you have the source code there may be lurking byte ordering (endianness) issues.
    Inspect the file and network stream handling for endian swapping code or perhaps
    different asset building tools per-platform that sets up data into native formats.


    Multithreading is very common in games today. Some middleware libraries predate
    this shift. Determine how thread locking is handled, if the code is thread-safe,
    and whether the thread controls are easy to override with a different platform’s
    interface. Be aware that any library that does nothing with threading is, by its
    very nature, likely to be unsafe to use in a threaded environment. Factor in time
    for making the library thread-safe, or at least limiting its use to a single,
    specific thread at all times.


    Also consider whether your game may be ported to a less-capable hardware platform
    at some point. If it might, determine what features are unique to this middleware
    offering that would make porting to a different library particularly difficult
    if this library does not exist for lower-end platforms.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 1.14 Licensing Requirements


    I am not a lawyer, and this is not legal advice. Consult a lawyer of your own
    to answer specific questions, and read every license personally. Also note, most
    publishers and even some hardware manufacturers have strict regulations about
    what open source licenses are allowed in products you develop. Clear all open
    source licenses through their legal departments before integrating one. What follows
    are my informed layman''s opinions.


    Every open source license that I know of springs into action as the result of
    distributing software. What this means is, as long as you do not distribute the
    software outside your company, you can use whatever you like for applications
    used internally. Feel free to use any open source code in your internally-facing
    server technology or tools, but do not plan to distribute those programs.


    Public domain code is completely harmless. Once you copy the code to your hard
    drive, you own it, and every modification you put into it is yours to keep. You
    may of course change the license to something else, release it back to the public
    domain, or keep it secret. It''s yours.


    The MIT, Zlib, etc., licenses appear to more or less disavow any responsibility
    for how you use their software. They do not require anything except a credit clause
    and that certain notices remain in the code. This is not a restrictive license
    with respect to retail use.


    The LGPL license has some stipulations that require distribution of the source
    of the library (and possibly parts of your own application). Read this carefully
    before using in retail products.


    The GPL license and many other similar licenses require complete code release
    on distribution if you integrate them into your products.


    Frequently, commercial middleware licenses will require credit'
  merge: -1
  img_proc: true
- pgno: 35
  md: attributions, splash screens, an intro movie, etc. Be careful to adhere to these,
    and give credit where it's due—middleware authors helped make your game happen.
  merge: -1
