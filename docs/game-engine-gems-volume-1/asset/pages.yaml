    The integral over the disk is evaluated with numerical quadrature. The total volume
    of the visible part of the hemisphere is approximated by the sum of the volume
    of pipes. The axes of these pipes are parallel to the z-axis. The pipes are inside
    the hemisphere and may be limited by the height field of the depth buffer. To
    define the pipes, we sample n uniformly distributed points (x_p,y_p) in the disk
    radius R. Thus, each pipe has the same cross section area \Delta A=R^2\pi/n.


    A line crossing the i-th sample point and being parallel with the z-axis enters
    the sphere at


    ```

