  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_427_0.png)


    # Figure 19.2: A limb is removed by transforming the vertices associated with
    its joints by a skinning matrix that makes those vertices degenerate. The detached
    limb is formed by performing the process in reverse.


    Another area of improvement has to do with how detached limbs are rendered. While
    degenerate triangles that have no pixels generated save on fill rate, the vertices
    still have been processed. This has the potential to waste quite a bit of vertex
    throughput on the GPU. To fix this, we can scan all the vertices in the model
    and store the ones that belong to the child joints of a particular damage zone
    as a continuous "damage surface". The generated surfaces can then be recombined
    to form a new mesh that has its vertices prearranged by limb order. When it comes
    time to render a detached limb, only the range of vertices and triangle indices
    defined for a given damage zone need to be rendered. The'
