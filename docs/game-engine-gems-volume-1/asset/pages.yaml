- pgno: 538
  md: '# 27.5 Considerations


    When using a fixed-point format, overflow and precision are a constant concern.
    The following considerations must be taken into account when using these functions:


    +   1. The length of the vector(x_p,y_i) will grow as it is rotated by a factor
    of approximately 1.65. You must constrain the input values to ensure that this
    will not cause an overflow.


    +   2. Certain optimizations in the code presented here are done in order to eliminate
    branching and multiplication. Optimizations such as these can be tailored to the
    target platform.


    +   3. The code implemented here assumes that the compiler implements the shift
    operator on signed types using an arithmetic shift. In C/C++, the precise behavior
    of the shift operator on signed integer types is defined by the compiler implementation.
    The compiler may or may not use an arithmetic shift in this case. For example,
    the result of shifting the value -1 right by one bit may be 0x7FFFFFFF or 0xFFFFFFFF,
    depending on the compiler.'
