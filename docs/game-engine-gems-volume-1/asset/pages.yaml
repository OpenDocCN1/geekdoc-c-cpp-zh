- pgno: 49
  md: '# 2.2 Asset Pipeline Design


    From the end-user perspective, the asset pipeline should be transparent. In fact,
    the ultimate reward for the developer of the asset pipeline occurs when artists
    and game designers do not know about the existence of the pipeline and feel there
    is nothing in between their creation tools and the game engine. The most important
    piece of the asset pipeline from the user''s point of view is the game engine
    editor. It is the tool that provides the asset integration interface into the
    game engine. The editor is built on top of the same engine core technology as
    the game itself and provides artists, designers, and engineers the necessary WYSIWYG
    (What You See Is What You Get) environment for putting together the assets and
    addressing design or engine issues rapidly.


    # Game Engine Editor


    There are two possible workflows to consider for the game engine editor:


    +   1. The editor is an advanced viewer, enabling the user to check the assets
    within the engine and have control over the camera position, lighting conditions,
    and which assets are displayed. In this design, the assets are modified and edited
    only in the DCC tools and are exported whenever there is a change.


    +   2. Some of the assets can be edited using the editor. This alternate design
    creates a more complex asset pipeline workflow, as the editor is effectively creating
    source assets that need to be stored properly for the build process.


    The two main concerns when designing a content pipeline are efficiency and flexibility
    [17]. Efficiency is required in order for the team building the game to be able
