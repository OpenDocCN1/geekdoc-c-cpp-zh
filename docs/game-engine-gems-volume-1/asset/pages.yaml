- pgno: 208
  md: '# Overview


    In recent years, there has been an increasing interest in the field of 3D display
    technologies from the entertainment industry. Today, the movie industry is moving
    in at a wide front as thousands of 3D stereoscopic movie theaters are being installed
    worldwide and movie production companies produce their films also in 3D. In fact,
    a new job title has emerged, the stereoscopist, in charge of making sure that
    the scenes can be viewed without problems by the audience. Some of the things
    the stereoscopist must deal with are explained in this gem. At the same time,
    many products for the home audience have been developed at an affordable price
    range and sold to a growing number of customers, including stereo capable TV sets
    and computer screens. This gives the games industry a user base that will be familiar
    with watching 3D stereoscopic content and who, in the future, might also be expecting
    their favorite games to be released in stereoscopic 3D. This gem deals with the
    far most common type of stereoscopic display, the plano-stereoscopic display.
    In contrast to other types of stereoscopic displays, these are displays that work
    with two planar surfaces in order to achieve the impression of depth. We base
    the discussion around the importance of designing the content to fit for a stereoscopic
    display and the different kinds of viewing conditions that must be considered.
    Moreover, we discuss the mathematics that help us compute these viewing conditions
    in order to be able to view the content without any problems. And finally, we
    provide an overview of different types of display techniques.


    We start by briefly familiarizing the reader with the field of stereoscopy and
    different depth cues, covering some implementation details. We then iterate over
    some issues that can arise when integrating stereoscopic display support into
    a game engine. Even though most terms are explained herein, it might be valuable
    for the reader to use the online glossary provided by [6].'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 8.1 Mechanisms of Plano-Stereoscopic Viewing


    The concept behind plano-stereoscopic displays can be seen quite simply as the
    creation of two planar views of the game, one for the left eye and one for the
    right. Then, it is important to make sure that each eye sees only the view intended
    for that eye. The processes involved can be seen as coding and decoding processes.
    In scientific visualization, one says that stereoscopic images are aimed to help
    the viewer form a 3D mental image of the data set. In video games, on the other
    hand, the aim is to give the player a richer visual experience.


    In order to create the sense of depth in a normal rendered game (i.e., a monoscopic
    rendering), monocular depth cues are used in contrast to the binocular depth cues
    discussed later. Some examples of monocular depth cues are the following:


    +   - Occlusion occurs when objects closer to the viewer occlude objects that
    are further away, and this is handled by the depth buffer algorithm.


    +   - Parallax is an effect caused by the motion of the observer, and it creates
    the illusion that objects close to the observer are moving by faster than objects
    further away. For instance, to someone looking out the window of a moving train,
    trees in the foreground appear to move by much faster than a distant hillside.


    +   - The size of an object varies depending on the distance from the viewer due
    to the perspective projection, where parallel lines converge at the horizon.


    +   - Texture detail levels provide information about the distance to an object.


    +   - Atmospheric effects such as scattering or haze make objects appear more
    gray in relation to the distance between them'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'and the viewer.


    +   - Shading and shadows tell us about curvature and inter-object relationships.


    +   - The proximity to the horizon also provides a depth cue since we know that
    the horizon is far away, and objects close to the line of the horizon are thus
    perceived as being far away.


    What a stereoscopic display adds to these cues are the three binocular depth cues
    known as accommodation, convergence, and retinal disparity. Convergence occurs
    when we focus our view at an object in real life by rotating our eyes so that
    their lines of sight intersect at the point of interest. At the same time, we
    apply pressure to the lenses in the eyes in order to focus, and this is called
    accommodation. Under normal natural viewing conditions, both accommodation and
    convergence correspond and are habitual, but can be voluntarily put out of function
    by crossing the eyes. The third cue is retinal disparity, and this pertains to
    the fact that we have two retinal images that fall on different points of the
    two retinas. These are then merged by the brain and perceived as a single image.


    The virtual space that we define is divided by the screen into two regions called
    view space and screen space. The volume between the viewer and the display is
    the view space and the volume behind the display is called screen space. If we
    look at a point lying at the same depth as the display surface onto which it projects,
    as shown in the left image of Figure 8.1, then the homologous points on the display
    have zero parallax because they have no lateral displacement. The homologous points
    are identical features in the stereo pair; thus, the same point in space is located
    on different places in the left and right stereo image for nonzero parallax. Points
    that are lying in either view space or in screen space have a lateral displacement
    and are then said to have either negative or positive parallax. All three cases
    are shown in Figure 8.1. Converging at a point behind the display surface causes
    the homologous points on the display to have positive parallax. This'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'point is said to be in screen space. Similarly, converging at a point in front
    of the display surface causes the homologous points on the display to have negative
    parallax, and this point is said to be in view space.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_211_0.png)


    **Figure 8.1:** Three different types of parallax that can occur, from left to
    right— zero parallax, negative parallax, and positive parallax.


    Converging the eye''s axes upon a virtual point at distance \(D_c\) supports the
    fusion of the parallax image and stereopsis as shown in Figure 8.2, where stereopsis
    is the mental and psychological process in visual perception leading to the sensation
    of depth from two slightly different projections of the world onto each eye [1].
    Keeping the visual structure on-screen in focus requires accommodation at screen
    distance \(D_s\). Usually, accommodation is dominant, and for unaided viewing,
    we see one planar double image in focus. With some training (crossing the eyes)
    we can converge at \(D_c\) and see a fused 3D image out of focus. Stereographic
    devices such as stereo glasses greatly support image fusion and stereopsis at
    the cost of suppressed accommodation.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_212_0.png)


    Figure 8.2: Convergence and accommodation in plano-stereoscopic displays.


    # Scale Considerations for 3D Stereo Images


    To be able to create comfortable stereo images, we need to calculate the correct
    perspective for the given setup and make sure that we stay within those limits
    [8]. Some new situations arise from using a stereoscopic display. Mainly, scale
    considerations are important when modeling the virtual view volume and creating
    the actual stereo pair.


    When converging on objects at some certain distance, a point at a different distance
    in the scene appears at the retina with some lateral disparity, independent of
    convergence, as shown in Figure 8.3. The inter-pupillary distance (IPD) is the
    distance between the eyes measured from the center of the pupils in each eye.
    The retinal disparity is, according to Kalawsky [12], computed as the difference
    of the two angles shown in the figure:


    ```

    $disp=\theta_1-\theta_2$.

    ```'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_213_0.png)


    # Figure 8.3: The two angles used to compute the retinal disparity.


    A retinal disparity of more than 10° causes diplopia (double vision) and should,
    of course, be avoided at all times.


    The projection in stereoscopic displays does not scale linearly. The projection
    of the two points that we fuse in our brain is very dependent on how far away
    we sit from the screen and how big the screen is. As this point is projected onto
    our eyes, the distance between our eyes is also a big impact factor. An average
    person has an eye separation around 6.5 cm. In a more uncommon case, we can find
    people with up to 7.5 cm between their eyes, and the largest audience or user
    group, youngsters, can have as few as 4.5 cm between their eyes. And it should
    be remembered that there is a great variation among people, particularly on different
    continents [4]. Some good advice would probably be for the IPD to be an adjustable
    variable set by the player in order to give a comfortable stereo depth.


    The physical limit on our depth perception is around 200 yards. This comes from
    the fact that beyond this point, we don''t get any'
  merge: -1
  img_proc: true
