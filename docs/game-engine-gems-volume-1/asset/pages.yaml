    ```

    \frac{\partial u}{\partial t} + \frac{\partial}{\partial x}(uu) + \frac{\partial}{\partial
    y}(uv) + \frac{\partial}{\partial z}(uw) = -\frac{\partial P}{\partial x} + g_x
    + \nu \left( \frac{\partial^2 u}{\partial x^2} + \frac{\partial^2 u}{\partial
