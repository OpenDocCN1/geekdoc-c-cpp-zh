- pgno: 187
  md: '# # 7.2 Understanding Quantization


    For such a simple concept, reduce the cardinality of a dataset from M samples
    to a fixed number N that minimizes error, there are a surprising number of tough
    lessons to be learned when designing a quantizer. Some interrelated questions
    have to be answered that vary with the data and the situation to which they''re
    applied:


    +   - How do you compute a representative value for multiple samples?


    +   - What is a good metric for measuring error between samples and their representative
    values?


    +   - Are all aspects of the input data equivalent, or is there a need for weighting
    some channels or computing error differently for them?


    +   - Is it better to start with M representative values and merge them?


    +   - Is it better to start with one and subdivide until reaching N?


    +   - What about stochastic processes that gradually improve the fit until some
    measure is satisfied?


    If you study the research on palettizing algorithms and vector quantization, there
    are many trade-offs that various approaches make, such as tools performance against
    runtime quality, code complexity against ease of implementation, perceptive error
    against numerical error, etc. What is important is that you understand that this
    is effectively a k-means clustering problem, which is NP-hard even for finding
    two palette entries for a data set, much less N [1]. So, for any algorithm to
    be practical, there will be assumptions made, and possibly inadequate results
    for specific inputs. It is therefore important to try not to solve too general
    a problem and only worry about large sources of error as long as the'
  merge: -1
  img_proc: true
