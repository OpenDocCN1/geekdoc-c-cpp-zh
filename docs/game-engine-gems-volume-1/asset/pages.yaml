- pgno: 189
  md: '# 7.3 Hard-Earned Lessons


    The best experiences (in programming) are those of failure. As Charles Kettering
    once said, "One fails forward toward success." Here are a few observations after
    designing several algorithms that did not produce satisfactory results. Others
    may have better luck or better ideas, but the following were important lessons
    I learned:


    +   Colors and other attributes can be unified nicely by converting them all to
    floating point numbers and passing them around as arrays or `std::vector<float>`.
    There is no loss in generality and it simplifies code to do this.


    +   Color spaces are important when determining the quality of a color sample,
    and ideally the measurement of two samples can be meaningfully performed by Euclidean
    distance formula. R''G''B'' colors (as computer-generated art and digital photography
    typically is) are in a nonlinear gamma-corrected space, and slight errors in any
    one component may be very noticeable. (There is a tremendous rabbit hole here,
    where you may be tempted to spend a lot of time learning about color spaces. Color
    encoding and representation is a deep field with mountains of research. Dive in
    if you must [2].) I found that moving R''G''B'' gamma-corrected colors to linear
    RGB space had the effect of oddly characterizing samples as both closer and farther
    (at different points along the gamma curve) from each other than they appeared.
    In short, I found that leaving colors in gamma-corrected space is best. The samples
    in this article are quantized directly from your standard, run-of-the-mill R''G''B''.


    +   An obvious optimization is to reduce the number of input samples to only unique
    values. However, it is worth mentioning that if you do this, make sure each unique
    sample also carries a weight that is proportional to the number of'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'samples that it represents from the source data. Otherwise, the palettizer
    will not be able to know how relatively important each sample is, and in general
    will provide poor fits for highly redundant data sets.


    +   I tried starting with M different representative values and merging them down
    to N. The problem is intractable, though, because M may be huge, and the act of
    finding "close" values to merge together is O(n^2). This is why very little research
    exists using this approach.


    +   Most of the algorithms that start with more than one entry do so by selecting
    a random set of N representative values for their palette and nudging them around
    until good values are found. I saw no clear guidance as to how to select these
    initial values. Seeing as how the initial selection of values greatly influences
    the number of iterations required to find an optimal fitting, and that it''s quite
    hard to know if the values are stuck in a local minima or are actually good representations,
    I abandoned these approaches. In tools, I personally prefer to get near-optimal
    results (by some criteria) in a deterministic number of iterations.


    +   Once decided upon the strategy of partitioning clusters until N is reached,
    I still had issues with cycles in the algorithm. Thinking that it would yield
    tighter clusters, I recomputed the representative value of each partition, then
    reassigned every sample to the closest value in the palette. This was fine, except
    that occasionally a cluster would end up with no samples assigned to it. Naturally,
    I just deleted the value and continued. Don''t. This sometimes causes infinite
    loops when a set of samples cycles between two or three extreme values. In the
    end, I found that I''d compute the centroid of a set, then find the closest sample
    in that set and force it to stay associated with the value. At least this way,
    there is no possibility of an infinite loop. As a further improvement, at the
    end of an iteration, any cluster that has only one sample assigned to it'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'changes its value to be exactly that sample''s value, to be a perfect fit.


    +   During the reassignment phase, I also experimented with updating the centroid
    of clusters dynamically. This sounded like a good idea, but it has negative feedback
    loops based on the ordering of samples. For example, if values are spread out
    along the number line and there are two values A=0 and B=1000, assigning a sample
    499 to value A will move its centroid to 249.5. Suddenly, the next sample 501
    will be closer to A than B, and further skews the cluster positioning. Order dependency
    is a terrible way to build robust tools and will give highly variable results,
    so this kind of adaptive behavior is to be avoided at all costs.'
  merge: -1
  img_proc: true
