- pgno: 523
  md: '# 26.5 Managing Functionality by Game State


    In a real game application, we''d want our objects and game entities to react
    in meaningful ways when a notification of change has been received. When working
    with game state this typically means the game needs to react differently to controller
    input or render a different scene or menu. Imagine a game engine with a series
    of queues that provide different functionality. For example, modules that want
    to process controller input could be placed in the "input queue", and models or
    sprites that need to be drawn could be placed in the "render queue". These queues
    can provide methods to allow objects to be added and removed from them.


    Upon receipt of notification of a state change, a game module can add or remove
    itself from the above queues proactively. The avatar management code can stop
    processing input when the game is in a paused state, and the menu management software
    can stop rendering menus when the game is in play.


    A full example of such a mechanism is well beyond the scope of this gem, but a
    simple example can be found on the accompanying CD. The example, called observerSample,
    is a small XNA project that shows how the modification of game state can be communicated
    to all the interested modules of a game application to manage which components
    process input and render to the screen.'
  merge: -1
