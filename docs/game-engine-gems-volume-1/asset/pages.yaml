- pgno: 139
  md: '# 4.6 Detailed Paths Phase


    Now that our soldiers know how to get to their destination legally, it’s time
    to get them moving. We could path between each point, rounding the paths to be
    prettier, but what if our soldiers got cold feet and decided they preferred to
    do something other than fight? We would have done a lot of pathfinding that was
    unnecessary.


    The key to producing aesthetically pleasing paths while avoiding waste is to incrementally
    path along the way. When an actor approaches a beacon point, the actor paths to
    the next beacon point before arriving at the actual beacon point. If we displayed
    lines showing an actor’s path, we would frequently see him cutting off the end
    of each beacon path while he moved and pathing ahead to the next beacon. That
    distance is something that a programmer must experiment with, as it affects both
    the time at which a low-level path calculation occurs (performance) and the overall
    aesthetics of a path. To give an example threshold for a grid resolution of 10
    × 10, we must meet one of two criteria to path to the next beacon: an actor must
    either enter a path region where his current beacon point exists, or he must be
    within 12 tiles of that beacon point. If one of those conditions is true, then
    we path the actor to the next beacon using our detailed path engine.


    What we end up with is a nicely rounded path. Actors won’t be walking to the middle
    of regions, only to turn and head in an unnatural angle to the next beacon. Simply
    put, we get a natural look, as shown in Figure 4.5. To the player, there is no
    evidence of a high-level grid-based path.'
  merge: -1
  img_proc: true
