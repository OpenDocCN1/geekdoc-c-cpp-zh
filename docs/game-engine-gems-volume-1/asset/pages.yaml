- pgno: 542
  md: '# Overview


    The remote procedure call (RPC) technique is a powerful tool for constructing
    distributed applications. It implements a client/server based system without requiring
    that callers be aware of the underlying network. That is, the programmer would
    write essentially the same code whether the procedure is local to the executing
    program or remote. RPC isolates the application from the physical and logical
    elements of the data communications mechanism and allows the application to use
    a variety of transports (e.g., TCP/IP or UDP/IP).


    When an application is combined with an RPC subsystem, it is able to interact
    with a second application (e.g., editor and game), and it transparently makes
    remote calls through a local procedure interface. The two processes may be on
    the same system as in Figure 28.1(a), or they may be on different systems with
    a network connecting them as in Figure 28.1(b).'
  merge: -1
  img_proc: true
- pgno: 543
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_543_0.png)


    Figure 28.1: Two applications connected via RPC—Client and server applications
    on (a) the same or (b) different machines.


    Because of its transport independence, RPC makes the client/server model of computing
    more powerful and easier to program. It is based on extending the notion of conventional,
    or local, procedure calling so that the called procedure need not exist in the
    same address space as the calling procedure. Implementing your own RPC system
    is useful because it enables you to connect different systems like PCs and multimedia
    game consoles such as the PlayStation 3 or Xbox 360. It is easy to use RPC in
    your own application, so it makes sense to integrate it into your engine and development
    tools.'
  merge: -1
