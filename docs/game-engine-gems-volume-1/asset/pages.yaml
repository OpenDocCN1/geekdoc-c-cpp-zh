    cached and the source-asset-dependency tracked, the final assets can be recreated
    from the intermediate assets automatically, mimicking what is already true today
    for source code (when building the executable does not need to rebuild all the
    intermediate object code). Having an intermediate asset format in an easily readable
    format provides an easier way for game engine programmers to debug and experiment.


