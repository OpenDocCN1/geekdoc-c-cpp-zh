- pgno: 36
  md: '# 1.15 Cost


    Every game has a different budget for middleware. Expect prices to vary widely
    from $100 to $750,000, depending on what kind of product you''re looking at. Great
    middleware demands professional attention to detail, and when using a library
    professionally, good support is important (but often costs more depending on your
    level of need).


    When looking for a library that costs money, consider whether the cost is per-seat,
    per-game, per-platform, or if it has a maintenance license such as per-annum.
    Many middleware companies have special rates for digital download titles versus
    retail titles. Also, be willing to call up the account manager at your chosen
    middleware shop and try to sweet talk them into a discount. You might be surprised
    at how flexible they are if this is your first title with them—they know very
    well that middleware tends to become entrenched and expensive to remove, so it''s
    good for them to get you hooked on their product. Try to work out multiple project
    deals, if you have that kind of leverage.


    Some libraries, such as Zlib, have evolved to the point where there is plenty
    of support online in forums and sample code, and the number of bugs is approaching
    zero. When libraries calcify, the fact that they are free is not an issue. However,
    open source libraries are not free in general unless your time has no value. Take
    an estimate of how many man-weeks it will take to implement the various missing
    features listed above, assign a price to those man-weeks and compare that with
    the cost of the middleware library. If they''re even close to parity, go with
    commercial middleware, simply because it''s established, tested, supported, and
    best of all, you will free up programmers to work on actual game features instead
    of patching up someone else''s pet project.'
  merge: -1
  img_proc: true
