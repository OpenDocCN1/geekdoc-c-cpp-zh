- pgno: 589
  md: '# Chapter 3: Volumetric Representation of Virtual Environments


    Figure 3.1: Volumetric representations can be used for many different types of
    environments. In (a) we see a complex terrain with two primary levels and numerous
    overhangs [5]. (Image courtesy of Thomas Schöps.) The Earth in (b) has been cut
    away to illustrate that the interior is also modeled [15]. Manmade structures
    with many different materials (c) can also be represented [15], while (d) shows
    a mining ship inside an asteroid, destroying it in real time [8]. (Image courtesy
    of Keen Software House.)


    Figure 3.2: (a) This volume consists of an 8×8×8 grid of voxels, though real volumes
    are considerably larger. The corner is cut away to show how voxels also model
    the interior of an object. (b) Each group of 2×2×2 voxels forms a cell. Note that
    voxels and volumes are the only types that are stored explicitly within our system,
    as edges and cells are implicit constructs that we build by looking at a voxel''s
    neighbors.


    Figure 3.3: The set of triangles generated by the Marching Cubes algorithm for
    each of the 18 possible cell configurations. The numbers indicate how many times
    each configuration occurs. Solid circles represent voxels containing solid material,
    while hollow circles represent voxels containing empty space. In most cases the
    inverse configuration generates the same set of triangles, with the exception
    of the last three cases (which are inverses of earlier cases but with different
    triangles to avoid holes).


    Figure 3.4: The volume with dimensions 8×8×8 voxels at the top of the figure contains
    four different material IDs represented by colors (see figure on accompanying
    CD). It is split into 8 blocks, each of which have dimensions 4×4×4 voxels. The
    four top blocks and the two lower left blocks (one of which is hidden at the back)
    are homogeneous and so can share copies of the actual data. The reference counts
    are indicated at the bottom of the figure. Explicitly storing block data for only
    four out of the'
  merge: -1
  img_proc: true
- pgno: 590
  md: 'eight blocks gives us a memory saving of 50% in this overly simplistic example.


    Figure 3.5: A small number of background threads continuously process the queue
    of regions that have been modified and regenerate the surface geometry. The main
    thread retrieves the results and uploads the geometry to the GPU.


    Figure 3.6: A single input mesh containing multiple material IDs, represented
    by different colors (see figure on accompanying CD), is split into two meshes.
    In the uniform triangle mesh, all the components are spatially adjacent and are
    only split up in the figure to aid visualization. In the nonuniform triangle mesh,
    the three parts are drawn on top of each other such that the alpha values blend
    correctly.'
  merge: -1
  img_proc: true
