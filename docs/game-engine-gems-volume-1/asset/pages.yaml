- pgno: 324
  md: '# Overview


    The moment of inertia is an important quantity in rigid body dynamics. It’s the
    rotational analog of mass, and it describes how difficult it is to change the
    angular velocity of an object. The formula used to calculate the moment of inertia
    \( I \) about a particular axis is the integral


    (14.1) \( I = \int_V r^2 dm, \)


    where \( dm \) is a differential mass at some point inside the body, \( r \) is
    the distance from that point to the axis of rotation, and \( V \) represents the
    set of points making up the entire body. Although this integral looks very simple,
    the shape of the volume \( V \) often turns the integral into something very complicated.
