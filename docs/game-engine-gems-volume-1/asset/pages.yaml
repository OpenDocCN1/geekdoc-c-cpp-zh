- pgno: 515
  md: 'Both the `Subscribe()` and `Unsubscribe()` methods take exactly one parameter.
    This parameter has the type `INotifiable`, meaning it is an instance of a class
    that implements the `INotifiable` interface shown in Listing 26.2. The `INotifiable`
    interface defines only one method, `ProcessNotification()`. This method accepts
    one argument of type `IObservable`, meaning it is any instance of a class that
    implements the `IObservable` interface.


    Since any class can implement an interface, you as the developer can decide which
    modules in your software can observe and/or be observed. To implement the interface,
    the class definition must first be modified to indicate that it implements a given
    interface. Then it must provide an implementation for every method that the interface
    defines.'
