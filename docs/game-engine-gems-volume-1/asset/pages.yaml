  md: '# 12.3 Physics Simplification


    Using the full fluid dynamics solver as presented in Section 12.2, we can change
    blower direction and move an object. In this section, we present heuristics that
    allow us to simulate the presence and motion of an object and also to change the
    blower velocity direction without using the full solver. We have two kinds of
    heuristics: the "obstacle heuristic" and the "blower heuristic".


    # Obstacle Heuristic


    With full calculation, an obstacle such as the black box shown in Figure 12.2
    requires us to recalculate all quantities (velocities and pressure) in the fluid
    domain at each time step. The presence of an obstacle in the fluid domain entails
    a distortion in the velocity field. We simplify the full solver by not computing
    lines 4 to 11 in Listing 12.1 and by setting the number of iterations for the
    null divergence step. In fact, the divergence minimization process from lines
    16 to 29 is in some cases performed more than 10 times when we set s_epsilon to
    0.0001. In the case of the "obstacle heuristic" we set the number of iterations
    to around 2 to make the process faster.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_299_0.png)


    Figure 12.2: Images of the velocity field—(a) from the full solver; (b) from the
    obstacle heuristic.


    The new velocity is computed by the interpolation described below. Let V be the
    current velocity on a face, let Vp be the precomputed velocity on the same face,
    and let c be a constant that is set to determine how fast the velocity field is
