    For a continuous volume in a coordinate system aligned to the principal axes of
    inertia, the diagonal entries of the inertia tensor I are given by the integrals


    ```

    (14.10) \( I_{11} = \rho \int_V (y^2 + z^2) dv \quad I_{22} = \rho \int_V (x^2
    + z^2) dv \quad I_{33} = \rho \int_V (x^2 + y^2) dv. \)

    ```


    # Transformations


    Given an invertible 3x3 transformation matrix M that transforms points from one
    coordinate system to another coordinate system with the same origin, an inertia
    tensor I is transformed according to the formula


    ```

    (14.11) \( I'' = \mathbf{M} \mathbf{I} \mathbf{M}^{-1} \).

    ```


    It''s useful to think of this product as first transforming in reverse from the
    new coordinate system to the original coordinate system using M^{-1}, applying
    the inertia tensor I in that coordinate system, and then transforming back into
    the new coordinate system using M.


    To transform an inertia tensor into a coordinate system with a different origin,
    we can use a formula known as the parallel axis theorem. Let s be an offset vector
    representing the difference between the new origin and the old origin. Then, starting
    with the'
