  md: '# 3.6 Physics


    Integration of a physics solution (in our case Bullet [2]) into our engine was
    relatively straightforward, as for the most part, the geometry generated by the
    Marching Cubes algorithm can be treated the same as any other. A physics mesh
    is constructed for each region from the vertex and index buffers, and the same
    bounding volume hierarchy that we used for view frustum culling can be used for
    the broad-phase collision detection.


    During simulation, we found that the sheer number of triangles did put the physics
    system under a lot of strain, and that an effective LOD system becomes essential
    for volumes with dimensions over about 256³ (of course, this varies wildly depending
    on the complexity of the volume). Our existing LOD system is not particularly
    suitable for this purpose due to the mismatches between LOD level alignment discussed
    in Section 3.4.2. Simplifying the original high-resolution meshes would likely
    be an improvement here.


    Dynamically updating the meshes as voxels are removed was a lot more straightforward
    than initially anticipated. Simply replacing one mesh with another between simulation
    time steps seemed to cause the physics engine no problems at all. Dynamically
    adding voxels is a lot more complex because an object can suddenly find itself
    penetrating a surface that it was previously not close to. More work is required
    to decide how or if this scenario should best be handled.


    One additional point worth noting is that while all collision detection is currently
    performed against the surface meshes, there is potential for doing it directly
    against the voxel volume. Hit testing and picking is currently performed in this
    way, and testing whether a point is inside an object or not becomes a simple case
    of checking the value of the voxel at that location.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 3.7 The Future


    Most of the techniques described in this chapter have been implemented in our
    experimental Thermite3D game engine [15], with the exception of the "density voxels"
    which are available in the _Forever War_ spin-off project [5]. The techniques
    are appropriate for integration into other game engines running on current generation
    hardware. However, our project is currently at an early stage, and there are a
    number of features we would like to add in the near future.


