  md: 'likely, the mesh data found right after the export are polygons, and these
    are transformed into triangles closer to the end of the build pipeline.


    A <mesh> element contains a mandatory <vertices> element, as shown in Figure 2.6.
    It has one mandatory input element that references a <source> element, meaning
    it uses the <accessor> element in the <source> element to access the data. One
    very interesting design feature is that there is no mention of the dimensionality
    of the vertex data in COLLADA. In other words, a vertex can have one, two, three,
    or any number of dimensions, though most content will be using 3D vertices with
    X, Y, and Z parameter names since transformations and positions are limited to
    4D homogeneous coordinate space in the <scene> <node> element. The <input> element
    associates one semantic with a source. Naturally, the one mandatory input is for
    the semantic POSITION, which provides the position (e.g., x, xy, xyz, xyzw) of
    all the vertices used in the mesh primitives. A <vertices> element can contain
    as many <input> elements as necessary to attach additional data associated with
    each vertex. For example, it is customary to have a NORMAL stored per vertex,
