- pgno: 437
  md: '# 20.3 Geometry Rendering


    Now that we have some code that calculates basic texture coordinates, we must
    consider what kind of geometry we actually need to render. Each fragment rendered
    with the decal shader acts like a "window" through which we can possibly see our
    decal. So we could just render a surface-aligned quad corresponding to the size
    and position of the decal. However, we want our decal to have depth, so we instead
    render a bounding cube as shown in Figure 20.3. This allows us to see the decal
    from any direction, and it will allow us to add a wrap-around feature later on.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_437_0.png)


    Figure 20.3: A bounding cube centered on a decal can be rendered to ensure that
    we capture the decal''s influence from any viewpoint.


    As an optimization for scenes containing a large number of decals, it can be advantageous
    to render decals through hardware instancing [7]. Therefore, it is a good idea
    to simply render a unit cube and transform it to the correct size and position
    in the vertex shader, as demonstrated in Listing 20.2. Note that we can easily
    extend the uniform constants decalSize and decalToWorld to'
  merge: -1
  img_proc: true
