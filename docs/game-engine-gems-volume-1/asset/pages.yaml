- pgno: 163
  md: '# Overview


    Graphical user interface (GUI) design is an often overlooked and under-resourced
    part of game development, yet it is responsible for the look and feel of a game
    to the user as well as its all important first impressions. The user interface
    needs to be quickly and dramatically adapted continuously throughout a product''s
    development cycle in order to reflect modifications to virtually any other part
    of the game.


    Relatively little literature exists for GUI presentation code, and finding samples
    of rigorously tested source code is difficult. This gem provides a brief introduction
    to GUI systems and documents a proven, current, flexible, and working system that
    can provide the first step for in-game and tools-based systems. Drop-in source
    code is provided and should prove instantly useful for everyone from the student
    to the seasoned professional.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 6.1 GUI Systems


    Like many in-game systems, the difficulty of arriving at the finished product
    is in being flexible enough to respond to constant changes. The iterative nature
    of game development means that a game is constantly changing. For every change
    to scoring systems, game mode, or indeed any gameplay element, a subsequent change
    is most often required to the presentation layer, ensuring that the user is still
    clearly presented the relevant and required information they need to play the
    game. Iterative game design impacts many aspects of a game throughout its development,
    all of which needs to be fed back to the user, a task that falls to the presentation
    layer.


    A common and sensible approach is built around creating a set of solid, stable
    controls, or components that can be used and combined over and over in various
    ways. When requests come in to the presentation team for a new screen, or there''s
    a new gameplay mechanic that requires a screen to be rewritten, a familiar set
    of text boxes, buttons, menus etc. can be dropped into place.


    A GUI system should include an editor for artists to create and position components,
    textures, and text in the best way. Too often, and particularly on smaller projects,
    rather than creating an editor for this task, the job of positioning these screen
    elements falls to a programmer, who has to type the coordinates by hand into a
    text file. This is unacceptable for anything but the smallest of games and interfaces.


    Localization issues always create their own problems in user interface design.
    Translation of games to multiple languages inevitably leads to text strings of
    varying length, often occupying more screen space than initially allocated. Even
    seemingly innocent changes in the wording of key phrases, or even simple modifications
    in capitalization or grammar, can cause text strings to overlap the area of screen
    designated. The new word is likely to be'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'longer in another language—the German language generally being the most verbose.
    An essential feature of using an editor to design presentation screens is being
    able to preview static text in all languages to check for such issues.


    Console platform holders typically have their own set of technical requirements
    that must be fulfilled before the game is accepted. Without going into too much
    detail, these range from new screens, game modes, network requirements, controller
    configurations, and menu options to screen resolutions, drawable areas of the
    screen, and issues of text legibility.


    # Existing Solutions


    Several middleware solutions exist for creating front ends that provide full feature
    sets, including WYSIWYG editors, runtime components, custom animation, scripting,
    and Adobe Flash support. These prove compelling where the budget allows. Such
    tools provide support that empowers artists and designers to create the best looking
    and most advanced GUI systems with as little programmer involvement as possible.


    Support for these features comes at a cost, though, and some implementations can
    add significant memory and CPU overhead, with some Adobe Flash implementations
    in particular being typically resource-heavy. Smaller-scale products, however,
    often do not require such feature-rich implementations and can trade features
    for performance and flexibility.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# ## 6.2 Design Patterns: Model View Controller (MVC)


    A common problem, particularly evident with GUI systems, is that over time, last
    minute hacks and "temporary" bug fixes lead to strongly coupled code, leaving
    changes to one area of the system to cause unintended effects elsewhere and also
    making it difficult to refactor. The model-view-controller (MVC) design pattern
    aims to ensure only a loose coupling of elements by separating the framework into
    three distinct constituent parts to be maintained independently:


    +   - The *model* refers to the actual data that we represent on the screen. For
    example, this could be the game time or the number of lives remaining.

    +   - The *view* concerns itself only with the visual representation and rendering
    of that object. In our previous example, perhaps we might display an analogue
    clock to represent the time remaining or an icon for every life remaining.

    +   - The *controller* refers to how the object interacts with the game, user
    input, and general state, system, or game logic.


    MVC has gained popularity, now being a major contributing concept in many of the
    larger GUI and system frameworks, from Cocoa to Qt, MFC, and the current Windows
    Presentation Foundation.


    Taking our previous timer example, the *controller* would refer to our game update
    loop; being responsible for determining the current time and passing a `TimerUpdate`
    message to the timer *model* object, which in turn updates its internal representation.
    The *view* will typically have its own internal description, but will update that
    based on information inside the *model* itself.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Implementing MVC does require a change in thinking, as the three constituent
    parts are unaware of the others'' inner workings and unable to alter each other''s
    data so communication relies on sending messages. This could just take the form
    of calling a function on another object. In larger systems, though, it is beneficial
    to ensure a greater distinction between components by using event queues and traditional
    message passing systems.


    Depending on the technique used, this message passing can add a substantial amount
    of overhead to the system, reducing its flexibility. Choosing the correct method
    by which these messages are passed is crucial, and worthy of its own Gems topic.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 6.3 A GUI Design


    The goal of this gem is to present a simple and extensible drop-in GUI module
    whose target audience ranges from the student or smaller indie studio to the experienced
    professional wanting to quickly add some user interface interaction to their game
    without devoting too much of their time to reinventing the wheel. Therefore, the
    system must exhibit the following attributes:


    +   Modular. As a drop-in replacement, it must have the minimum possible number
    of external API dependencies.


    +   Lightweight and flexible. It should be adaptable to as many platforms as possible,
    have bindings to specific areas such as various input types, and rendering or
    audio code should be kept as minimal as possible. This guarantees the highest
    level of portability.


    +   Both programmer and artist-driven. For many smaller products, it is often
    feasible (if not fun) to hand-code our own front end design. While this exposes
    us to the dangers of localization, minor font changes, and rewordings, it can
    sometimes be the quickest way of creating a usable GUI. This system allows programmatically
    created GUI screens where necessary, and it leaves scope for data-driven designs
    from an external tool at a later date.


    +   Extensible. The code provided should give the user a solid base from which
    further, more advanced controls may be produced with the least amount of effort.


    +   Object oriented. Object-oriented programming tends to lend itself particularly
    well to GUI objects with inheritable behaviors and data sets.


    +   Localization-ready. All text rendering must be able to handle international
    character sets.'
  merge: -1
  img_proc: true
