  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_140_0.png)


    Figure 4.5: Beacon points serve as a guide to the detailed pathing engine. Note
    how the detailed path (round path with an arrowhead) does not go all the way to
    the beacon points.'
