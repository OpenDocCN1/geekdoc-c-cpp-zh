    # ## 3.5.2 Using Multiple Materials


    If our voxels include a material ID, then this will have been passed to the GPU
    as part of our vertex definition (see Section 3.4.1). One simple way in which
    we can use this material ID is to identify the texture (or set of textures for
    triplanar texturing) that should be applied. Modern GPUs provide direct support
    for this through _texture arrays_, which allow a single 2D texture to be indexed
    in an array of textures using the rounded value of a floating-point input. Older
    hardware can make use of a _texture atlas_ [14] to obtain a similar result, but
    special measures must be taken to avoid filtering artifacts when textures repeat.


    Although simple in principle, there are some additional issues to be wary of if
    you wish to blend smoothly from one material to another. For example, a triangle
    on the boundary of two or more materials will have a different material ID at
    each of its vertices. It does not make sense to simply interpolate these material
    IDs across the face of the triangle, as this would yield values which did not
    exist at any of the three vertices.


    Within our system we handle this scenario by splitting our input mesh in two.
    One of the resulting meshes contains only those triangles that have the same material
    at each vertex (we will call these _uniform_ triangles). The other _nonuniform_
    triangles are replaced with new triangles that have a material ID of zero at each
    vertex. During shading, we ensure that material zero is drawn as black by either
    setting the zeroth slot of our texture atlas to black, or by putting in an explicit
    check and return at the beginning of our fragment program.


    The second mesh that results from our splitting procedure contains the non-uniform
    triangles. Actually, each non-uniform triangle gets duplicated three times [3]
    to create three uniform triangles, one for each of the materials in the non-uniform
    version (see Figure 3.6).'
