  md: '# 14.1 Center of Mass


    In a rigid body simulation, it is most useful to know the moment of inertia for
    an object about its center of mass because that is the point about which the object
    naturally rotates. In order to calculate the center of mass for an object, we
    first need to be able to calculate the object''s mass. If we consider an object
    to be composed of a large number of particles, then it''s total mass m is simply
    the sum of the masses m_k of those particles:


    (14.2) \( m = \sum_k m_k \) .


    The center of mass C is found by taking the product of each particle''s mass m_k
    and its position r_k, summing over all particles, and then dividing by the total
    mass as follows:


    (14.3) \( \mathbf{C} = \frac{\sum_k \mathbf{r}_k m_k}{\sum_k m_k} \) .


    For a continuous volume, these summations become integrals. The mass m of an object
    is found by integrating the object''s density over its volume as follows:


    (14.4) \( m = \int_V \rho(\mathbf{r}) \, dv \) .


    Here, \(\rho(\mathbf{r})\) is a function that gives the density of the object
    at any point \(\mathbf{r}\) inside its volume, and \(dv = dx \, dy \, dz\) is
    a differential volume element. The density is often a constant that we can move
    out of the integral, so we drop the function notation and simply write it as'
  merge: -1
