- pgno: 233
  md: '# Chapter 9: A Multithreaded 3D Renderer


    Sebastien Schertenleib


    Sony Computer Entertainment Europe'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Overview


    The 3D renderer remains one of the main components in most modern video games.
    Usually, 3D rendering engines handle both the software and hardware pipelines
    that are being exposed through 3D graphics APIs such as DirectX, OpenGL, or libgcm.
    Nowadays, multi-core CPUs are widely available through game consoles and PCs.
    In order to ensure that the GPU is continuously fed with data to process, it is
    critical that 3D renderers take full advantage of this new programming scheme
    by utilizing the available processing cores. The workflow involved in creating
    a 3D picture on the screen relies on preparing a list of commands that the GPU
    can interpret and execute.


    Different approaches can be taken to decouple the CPU from the GPU. For instance,
    one common technique consists of using a double buffer or triple buffer scheme
    where the CPU builds the commands in frame N and where the GPU consumes them in
    frame N+1, as illustrated in Figure 9.1. Alternatively, the GPU can consume the
    data within the same frame in order to reduce the latency, as shown in Figure
    9.2. One potential drawback is that it might be difficult to avoid some GPU stalls
    early in the frame. On the other hand, the memory footprint is much smaller compared
    to a double buffering method, and this is particularly important on embedded systems
    with restricted amounts of memory.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_234_0.png)


    Figure 9.1: In a double-buffering scheme, the GPU consumes the data a frame later
    than it is generated by the CPU.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_235_0.png)


    Figure 9.2: In this scheme, the GPU consumes the data soon after it is generated
    by the CPU.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 9.1 The Memory Model


    Regardless of how the display lists get created, a renderer might ultimately be
    restricted by memory access speed, particularly when the graphics commands are
    generated through a single thread. In recent years, the increasing performance
    gap between GPU processing power and memory latencies has made it harder to feed
    the GPU due to expensive data accesses in system memory, as shown in Figure 9.3.
    A typical frame is subdivided into passes which handle, for instance, rendering
    shadow maps, rendering the main scene, and rendering fullscreen post-processing
    effects. A unit of work during rendering is often referred to as a batch and combines
    a set of render states, shaders, and geometry elements as exemplified by the following
    listing:


    ```

    //setting up a batch

    setRenderStates (...);

    bindTextures (...);

    setShaders (...);

    setShaderConstants (...);

    setVertexBuffer (...);

    setIndexBuffer (...);

    drawCall (...);

    ```


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_236_0.png)


    Figure 9.3: Both the render thread and the graphics API are'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'likely to access data in various locations in

    memory.


    Setting up a batch consists mostly of setting the addresses of

    various resources needed to render an object. In the process of

    creating batches, the rendering code has to traverse the scene

    graph and is likely to access data in various locations throughout

    main memory. This leads to a large number of cache misses. With

    inorder CPUs such as the PowerPC chips found in the Xbox 360

    and PlayStation 3 game consoles, this could stall the processor for

    hundreds of cycles each time a cache miss occurs, greatly

    impacting performance. This problem can be mitigated with out-of-

    order CPUs because other instructions can potentially be executed

    while previous instructions are waiting for data to be ready.


    One may argue that it might be possible to reorganize the data

    structures to avoid many of the cache-miss penalties. Indeed,

    adopting cache-aware or cache-oblivious algorithms [2] helps,

    especially for the scene graph management, but unfortunately, the

    graphics library also needs to access and manipulate some data

    on its own. Large structures such as vertex buffers and index

    buffers are generally stored in the GPU''s local memory and so do

    not cause a problem, but many types of rendering state, such as

    shader constants and texture configurations, need to be copied to

    the command buffer each frame. Therefore, alternative solutions

    are needed to overcome the cache limitations.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 9.2 Building the Display Lists in Parallel


    To ensure that the display lists are created in the shortest amount of time and
    in a way that minimizes memory bandwidth limitations, our solution uses multiple
    threads, and each is responsible for creating a subset of the rendering commands.
    However, this is only possible when the 3D graphics library exposes such a level
    of granularity. Thankfully, this is the case for Xbox 360, PlayStation 3, and
    DirectX 11 developers. In the PlayStation 3 case, the Synergistic Processing Units
    (SPUs) of the Cell Broadband Engine, being purely vector processors, excel with
    geometric processing. This means they can easily perform graphical operations
    that help offload work from the GPU when necessary. To create the display lists
    in parallel, a commonly found paradigm is to have the primary command buffer reference
    display lists created inside secondary command buffers. Those display lists are
    created in parallel on different execution units as shown in Figure 9.4. Often,
    those secondary buffers handle a subset of the frame, and the granularity could
    be anything from a single draw call to an entire pass.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_238_0.png)


    Figure 9.4: The primary command buffer references multiple secondary command buffers,
    each of which handles a subset of the frame.


    By distributing the creation of the draw calls and their graphics states to multiple
    command buffers in parallel, the overall latency for creating the display lists
    is considerably reduced, which is'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'particularly useful when using the scheme shown in Figure 9.2.

    Moreover, this makes the 3D renderer more scalable to various

    configurations of multi-core architectures and helps generate the

    thousands of draw calls commonly found in modern video games.'
  merge: -1
  img_proc: true
- pgno: 240
