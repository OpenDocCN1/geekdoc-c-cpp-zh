    \ to the ex\n    gfxObject *buffer = (gfxObject *) Allocate(dataS\n    DmaGet(buffer,\
    \ sourceAddr, dataSize);\n    DmaWait(...); // barrier to wait for the data\n\
    \    // let's do some work\n    for (int i = 0; i < count; ++i)\n    {\n     \
    \   buffer[i]->update();\n    }\n    // On some platforms like the PS3,\n    //\
    \ you may have to store back the data to system\n    DmaPut(buffer, sourceAddr,\
    \ dataSize);\n    DmaWait(...); // barrier to wait for the data\n}\n```\n\nThis\
    \ model provides an efficient parallel paradigm, where each task can be queued\
    \ and consumed by available processing units, as shown in Figure 9.5. This also\
    \ avoids some of the issues of a more standard multithreaded approach, as the\
    \ tasks provide a more fine-grained subdivision and can cope more easily with"
