    location and any color sample used to blur it. The value 1/r_max is a constant
    that is passed to the fragment shader as a parameter by which the velocity is
    multiplied. We can also include in this parameter a normalization factor s that
    accounts for the time in between two frames and adjusts the overall intensity
    of the motion blur effect. We define s as


    (17.5) \( s = \frac{t_0}{\Delta t} m, \)


