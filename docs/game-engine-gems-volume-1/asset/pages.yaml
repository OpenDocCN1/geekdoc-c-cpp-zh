- pgno: 276
  md: '# 11.1 Background


    # Streaming Requirements


    The game worlds in Split/Second are large and richly detailed. We cannot fit all
    of the graphics resources used to render them within the fixed memory space of
    our target console platforms. The solution for this problem is to dynamically
    stream into memory only the resources needed to render the part of the world nearest
    to the camera.


    Any streaming system consists of a number of components, such as the system to
    load resources efficiently from disc or the logic for deciding which resources
    should be loaded for a given camera position. In this gem, we concentrate only
    on the component that manages the memory used to store loaded resources.


    # Resource Types


    There are a number of graphics resource types that we use when rendering. In decreasing
    order of typical size, some examples are textures, vertex buffers, index buffers,
    shaders, and constant buffers. On current consoles, these resources are each made
    up of two parts. First, there is a small fixed size component that is read by
    the CPU, which we will call the "header". Second, there is a larger variable-sized
    component that is read by the GPU, which we will call the "data". When submitting
    rendering commands, the CPU parses the header to create entries in the GPU command
    buffer. The command buffer then contains references to the data that the GPU reads
    when executing the rendering commands.


    In this gem, we only consider the management of the data that is read directly
    by the GPU. The management of the header is a simpler problem. It generally involves
    fixed sized objects for which a fixed sized object memory pool [2] is a common
    approach.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Design Requirements


    When gathering the requirements for the streaming system in Split/Second, we decided
    that it should be able to dynamically load and unload any GPU resource from disc.
    We wanted to avoid overly complex code for synchronizing the GPU with the streamed
    resources. We also wanted to avoid the issues that can occur with memory fragmentation
    when resources are continually allocated and deallocated.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 11.2 The Memory Pool


    At the core of our streaming implementation is the memory pool class. We define
    our memory pool to be a block of contiguous memory along with the logic for dynamically
    managing it. We use one or more memory pool objects to manage the memory in which
    we store the GPU data resources for rendering.


    A simple design choice would be to split the memory in our pool into a number
    of blocks with predetermined but variable sizes. Each new allocation in the memory
    pool would then use one of these blocks. This technique sidesteps fragmentation
    issues and reduces the memory management logic to simply finding an appropriately
    sized empty block in which to place each asset.


    This might be a good approach if we want to store only texture data, since textures
    tend to take one of a finite combination of sizes and surface types. However,
    it would waste memory when we cannot predict with good accuracy what range of
    block sizes we need to support. Our design requirements state that we want to
    support other resources in our memory pool such as vertex and index buffers. These
    have a large potential range of data sizes. We therefore choose to avoid any assumptions
    about resource size and do not use the fixed block approach to memory management.


    Instead, our memory pool is made up of dynamically sized data "chunks". These
    chunks can be of any size, and may contain data or be empty "free chunks". Although
    a chunk may contain more than one item of data, each item of data is guaranteed
    to live within a single chunk. This means that chunks can be moved around the
    memory pool without breaking the internal consistency of the data that they hold.


    Chunks need to be kept aligned according to platform restrictions. For example,
    on one target platform, all vertex buffer data may need to be aligned to 128-byte
    address boundaries. Often, there'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'are different alignment restrictions for different resource types. For simplicity,
    all chunks can be aligned to the size of the platform''s maximum data alignment
    restriction. For example if our target platform also requires that textures need
    to be 1 kB aligned, then we might chose to align all chunks, including those containing
    only vertex buffers, to 1 kB.


    A memory pool starts out with no data in it and so contains a single empty chunk
    that spans the entire memory in the pool. When we add new data to the memory pool,
    we find an empty chunk that it fits inside. If the size of the new data is less
    than the size of the empty chunk then we break the chunk in two. One chunk now
    contains the new data, and the other is a free chunk containing any remaining
    unused memory. When we remove a chunk from the memory pool, we mark it as empty
    and merge the resulting free chunk with any adjacent free chunks. A typical sequence
    of operations is illustrated in Figure 11.1.


    | Operation | | | | | | | | |

    |---|---|---|---|---|---|---|---|---|

    | Allocate | Allocation 1 | | | | | | | |

    | Allocate | Allocation 1 | | | Allocation 2 | | | | |

    | Free | | | Allocation 2 | | | | | |

    | Allocate | Allocation 3 | | | Allocation 2 | | | | |

    | Allocate | Allocation 3 | | | Allocation 2 | | Allocation 4 | | |


    **Figure 11.1:** A memory pool layout shown as it undergoes a number of allocate
    and free operations. Note that each data chunk is kept to the alignment shown
    by the dotted lines. Also note that after only a few operations, we have a fragmented
    memory pool.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# 11.3 Synchronization Issues


    On our target platforms, the GPU executes a single command buffer stream created
    by the CPU. The serial execution of these commands is the key to the memory pool
    data movement remaining synchronized with GPU usage.


    Consider the case where we have a texture in the memory pool that we use for rendering,
    and then wish to move it within the memory pool before using it for rendering
    a second time. This is a typical sequence of operations if we wish to support
    defragmentation of the memory pool. If we use the CPU to manage memory copying,
    then the CPU is forced to wait for any rendering that uses the texture to complete
    before moving the texture. This is difficult to synchronize correctly and efficiently.
    It is also intrusive in that we need to keep track of when the texture is used.
    Figure 11.2 shows how this approach is executed on the CPU and GPU sides.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_280_0.png)


    Figure 11.2: Sequence diagram of memory movement within our memory pool using
    the CPU. Note how the CPU needs to wait for an indeterminate length of time before
    moving the texture data in the memory pool.


    In contrast, if we use the GPU to manage memory copying, then the GPU executes
    each movement of data in the memory pool as'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'one action in a well-ordered stream of commands. This guarantees that any rendering
    from the texture is complete by the time we move the data. Conversely, it guarantees
    that the movement of texture data is complete by the time that it is next used
    for rendering. Figure 11.3 shows how this approach is executed on the CPU and
    GPU sides.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_281_0.png)


    Figure 11.3: Sequence diagram of memory movement within our memory pool using
    the GPU. Note that no complex synchronization is now needed between the CPU and
    the GPU and that the CPU can queue the data transfer immediately.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 11.4 The Staging Buffer


    We have shown how the GPU can control memory movement within the memory pool.
    We also need to deal with the case of moving new data into the memory pool. When
    adding new data into the memory pool, we first search for a free chunk to place
    it in. A chunk labeled as free in the memory pool may be in one of two states.
    It may be genuinely empty or it may contain valid data that has been scheduled
    to be moved by the GPU. In the latter case, any data copying into the chunk by
    the CPU would potentially corrupt the data already in the memory pool. For this
    reason, only the GPU should copy new data into the memory pool. To accomplish
    this, we initially load any new data into a CPU-managed staging buffer and then
    use the GPU to copy this data into the memory pool.


    This approach still requires some straightforward synchronization between the
    CPU and GPU. In our implementation, the staging buffer is a ring buffer structure.
    The ring buffer contains blocks of data that are awaiting upload to the memory
    pool. We can only clear each ring buffer entry when the GPU has completed copying
    it to the memory pool. To track the progress of copies into the memory pool, we
    use a fence synchronization primitive to determine when the GPU has completed
    processing an operation. The fence primitive is named and implemented slightly
    differently on different platforms. On Xbox 360 and in OpenGL, it is called a
    fence, but in DirectX it is called an event, and on PlayStation 3 it is called
    a label. On each of these platforms, we can push a fence to the GPU command buffer
    and poll to see whether it has been processed by the GPU. So for each ring buffer
    entry in our staging buffer, we place a GPU fence after the GPU copy operation.
    Once per frame, we check the fences to determine which copies are complete and
    clear the ring buffer entries accordingly. This usage is illustrated in Figure
    11.4.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '![](img/7ba1225bb0e5a87be0fd35866408ffa7_283_0.png)


    Figure 11.4: Staging buffer usage illustrating the use of fences to determine
    when a GPU copy is complete.


    This staging buffer is part of the system that throttles data movement into the
    memory pool. In our implementation, we stream new data into the staging buffer
    using a background loading thread. If the data transfer into the memory pool stalls,
    either because of lack of space or slow defragmentation, then the staging buffer
    fills up and the background loading thread sleeps until space becomes available
    again.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 11.5 Memory Pool Defragmentation


    Since our memory pool contains many flexibly-sized chunks that are added to and
    removed from the pool in no fixed order, it is prone to fragmentation. Using the
    GPU to manage our memory pool frees us from concerns about multiprocessor synchronization.
    This makes any defragmentation system simpler to implement.


    In their GDC presentation Balestra and Engstad [1] briefly describe a very simple
    algorithm that they employ to defragment streamed textures. Our initial defragmentation
    logic used the same approach. First, we scan through the memory pool from beginning
    to end until we find a free chunk. Then the next non-free chunk is moved down
    to fill this free chunk. The free chunk created by the move is then consolidated
    with any adjacent empty chunks and the scan is continued. This defragmentation
    pass is run once per frame. To avoid high GPU workload in pathological situations
    an upper limit is set on the total size of the data that each defragmentation
    pass can copy.


    The advantage of this algorithm is that given a sufficient data transfer budget,
    we are guaranteed to tend towards a fully defragmented pool. A disadvantage is
    that defragmenting a single empty block at the start of an otherwise full memory
    pool requires an expensive copy of almost the entire memory pool.


    In our naive implementation, we occasionally saw small spikes in the time it took
    to load data into the memory pool. These generally corresponded to the poor defragmentation
    performance in the pathological case outlined above. A simple solution that reduced
    these issues to a manageable level was to break the memory pool into a number
    of regions. The defragmentation pass was then run for each region, but it never
    defragmented across region boundaries. The region size was tuned by testing to
    find the size that gave the best performance. This approach is illustrated in
    Figure 11.5.'
  merge: -1
  img_proc: true
