  md: '# 26.3 Making GameState Observable


    To make our `GameState` class observable, we change its class declaration to read
    as follows: [2]


    ```

    class GameState : IObservable

    ```


    Now that we have tagged the `GameState` class as observable, we must provide the
    public methods necessary to satisfy the interface''s requirements. But before
    we move on to the method implementation, let''s take a brief look at how observation
    works in the game state observer pattern:


    +   The subject of observation (the `IObservable`) contains a list of subscribers.


    +   Any object capable of processing notifications (the `INotifiable` interface)
    can call the subject''s `Subscribe()` method and be added to the list of subscribers.


    +   When the subject is modified in a way that requires notification to be sent
    out, the subscriber iterates over the list of observers and calls each observer''s
    `ProcessNotification()` method.


    +   If an observer wants to stop receiving updates from the subject, the observer
    can call the subject''s `Unsubscribe()` method to be removed from the list of
    subscribers.


    The `GameState` class needs a data member in which to store its list of observers,
    so we add the following line of code to the `GameState` class definition under
    the definition of the `currentState` member:


    ```

    private List<INotifiable> _observers = new List<INo

    ```'
