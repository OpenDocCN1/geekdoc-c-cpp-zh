- pgno: 474
  md: '# Overview


    As hardware becomes more complex and powerful, the software that they run becomes
    larger and more complex. As software grows, the number of programmers needed to
    write and maintain the software increases. As anyone who has experienced large
    programming teams will tell you, the more programmers you have working on one
    product, the more time you need to spend policing the code structure and managing
    its complexity.


    As different programmers create and modify game systems, it is easy for the code
    to become a mismatch of different patterns and styles. Programmers also tend to
    have their own personal preferences when it comes to object creation, initialization,
    updating, and deletion.


    Inter-object communication, if not tightly regulated, can become a spaghetti of
    code dependencies and object graph traversals. As programmers build objects that
    require data from other objects, it is all too easy to create monolithic dependency
    graphs and be forced to navigate awkward and non-intuitive object linkages. It
    is also too easy to create header file dependencies that have nothing to do with
    the actual job you are trying to accomplish, but are required so you can connect
    to other objects in the code.


    Keeping track of code construction can become a full-time job, and modifying the
    code during the latter stages of a project can become error prone and dangerous.
    Fragile code is difficult to bug-fix without causing more bugs.


    This gem discusses code execution hierarchies (CEH) as a way of controlling these
    problems and visualizing your code when things get confusing.'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# 23.1 What are Code Execution Hierarchies?


    Code execution hierarchies provide a framework for code construction and updating.
    You use a simple base class for all of your major game components, and define
    the update order by way of a manager class with an internal tree structure. Rather
    than create objects and add them manually to the main loop, as in Figure 23.1(a),
    you create your objects and attach them to the execution tree relative to an already
    existing object. Conceptually, the structure is similar to a scene graph in graphics
    programming where each object has a parent, and the object''s location in the
    scene is always defined relative to its parent. When you move or update a node
    in the graph, all of its children are automatically moved with it, maintaining
    the parent-child relationships. The main loop using a code execution hierarchy
    is shown in Figure 23.1(b).


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_475_0.png)


    Figure 23.1: (a) Traditional update loop. (b) Code execution hierarchy.'
  merge: -1
  img_proc: true
- pgno: 476
  md: "Explicitly defining the parent-child and sibling relationships of your code\
    \ modules not only forces people to *think* before adding an object to the update\
    \ system (always a good thing), but also helps protect your code from structural\
    \ changes in the future. If a code module needs to be updated somewhere else during\
    \ the frame, you move the parent, and the child objects are automatically moved\
    \ along with it.\n\nA simple base class is used for execution objects so that\
    \ the manager class has a consistent API interface for your objects. This base\
    \ class also defines the API for object creation, initialization, updating, and\
    \ deletion. Runtime type identification systems provide a simple way for objects\
    \ to identify themselves within the hierarchy. This is used when objects need\
    \ to find objects of a certain type within the hierarchy. A simple base class\
    \ may look like that shown in Listing 23.1. Objects can be created and added to\
    \ the hierarchy as shown in Listing 23.2. Rather than building your code explicitly\
    \ and defining your update order in the main loop, you are creating code objects\
    \ and inserting them into the code execution hierarchy.\n\n# Listing 23.1: Example\
    \ base class.\n\n```\nclass CEHBase\n{\n    public:\n        CEHBase();\n    \
    \    virtual ~CEHBase();\n\n        virtual void Init(void);\n        virtual\
    \ void Update(float dt);\n        virtual void ... grab the latest code and pru\n\
    \n    protected:\n        m_classID;\n};\n```"
  merge: -1
