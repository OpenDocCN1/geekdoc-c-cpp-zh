  md: '# Overview


    Trigonometric functions are required to display 3D and rotating 2D graphics, but
    these functions are generally not well-supported on some game platforms such as
    handheld devices and cellular phones. On platforms without a floating-point processor,
    trigonometric functions may instead be implemented by emulating floating-point
    number representations and operations, and performance can be very poor as a result.
