  md: '# Chapter 7: World''s Best Palettizer


    Listing 7.1: Computing the centroid for a set of samples looks complicated because
    we allow for a reduced set of samples with associated frequencies. It''s really
    just an average.

    Listing 7.2: This computes the error for each cluster''s samples relative to the
    centroid chosen for it. The cluster with the greatest error is returned for subdivision.

    Listing 7.3: This function computes a squared error between the representative
    value of a cluster and all of its samples, with a weight per component.

    Listing 7.4: This computes a covariance matrix for the samples in this cluster.

    Listing 7.5: This uses the power method with up to 10 iterations to determine
    the dominant axis of the cluster.

    Listing 7.6: This code splits the cluster at the mid-section along the dominant
    axis, binning half the samples into each new cluster.'
