    Other matrices tend to make the sky look a little green, which looks quite unnatural.
    If you''re not working in HDR space, you''ll want to scale down the resulting
    RGB values to fit within [0,1] if necessary.


    The final tweak to the RGB value is important and often overlooked: gamma-correcting
    the color for the display. Your sky will appear too dark otherwise. Simply raise
    the final RGB color to the power of 1/γ. A gamma value of 1.8 provides satisfying
    results.


    A simple vertex program written in Cg that implements much of this algorithm is
    available with the book''s sample code. Potential extensions of this program would
    include handling two light sources simultaneously (the sun and the moon) instead
    of a single dominant light source, incorporating volumetric fog effects into the
    sky, simulating overcast conditions, and the tone-mapping described above.'
