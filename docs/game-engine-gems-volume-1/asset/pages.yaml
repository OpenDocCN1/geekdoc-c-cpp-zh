- pgno: 270
  md: '# 10.5 Future Work


    We''ve presented in this article a means in which to offload the overhead of creating
    command buffers to separate threads in a device API agnostic manner and use a
    camera-centric design to ensure proper load balancing across multiple threads.
    As we continue to take greater advantage of our rendering APIs for general purpose
    computing, the ability to properly break up work based upon packets of rendering
    data will continue to be important.


    There are many project- and system-specific issues that are related to this process
    that are beyond the scope of this article. For completeness however, we briefly
    describe them here and leave the nitty-gritty details as an exercise for the reader.


    # Sorting and Instancing


    RenderCommand objects provide excellent dynamic primitives for instancing evaluation.
    Once all the objects for a render view have been culled and added to a RenderCommand
    buffer, it is trivial at that point to define multiple types of sorting operations
    that can organize the RenderCommand objects in the buffer in various ways. Sorting
    by material index, vertex data, and object type often lends itself to a sorting
    process that combines objects in the command buffer in such a manner that multiple
    draw commands can be removed and a single command that uses instancing can be
    used. And if you''re generating your RenderCommand structures dynamically, you
    can easily remove the original commands and insert the new instanced version.
    On some hardware, this may be a more performance friendly method of sorting by
    data, as your RenderCommand can take better usage of processor caches and reduce
    memory traversal that would normally be required when walking your object list.


    # Better Load Balancing'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'For those of you who are more proficient at threaded architectures, it''s worth
    noting that there''s a modification to this process that can take greater advantage
    of your threading architecture. The practical observation is that most camera-specific
    `RenderCommand` generation processes exhibit uneven processing times. For instance,
    smaller viewports or different types of API commands cause less work to be done.
    As such, you can often wind up wasting processing time waiting for these unbalanced
    threads to finish.


    A more advanced solution is to modify your thread procedure to create one thread
    job for each draw call, allowing each to be created on a separate thread, yet
    filling in the camera data structure atomically. This usually means that your
    visibility culling for each camera would need to occur on the primary thread so
    that you can ensure proper allocation of space in your `RenderCommand` list. In
    order to take advantage of render-state filtering, sorting, or instancing, you
    must perform these processes once all the individual `RenderCommand` objects have
    been properly created.


    The benefit of this modification is that you''ve now created smaller job packets
    that can maximize your thread utilization over the course of your frame. This
    is very useful on platforms where your thread operations can be interrupted by
    OS events. For a further discussion on issues related to small-job packets in
    video games, please refer to [3].'
