- pgno: 471
  md: '# 22.4 The Future of Task Parallelism in Games


    Established habits of game development have been disrupted by the installed base
    of multi-core CPUs. In the same way, game development will be disrupted again
    by the introduction and evolution of powerful many-core processors that require
    special programming techniques in order to be used effectively. With the techniques
    discussed in this gem, you''ll be able to create task parallelism abstractions
    that will get your game running quickly in any parallel hardware environment.'
