    +   - Use appropriate data structures, and find ways to cache or reduce lookups
    for relationships that are costly to determine. My favorite is the simple adjacency
    list representation for graphs. It is trivial to implement and very easy to use
    when debugging algorithms.


    +   - Ask the right question. For partitioning, that question is "Which triangle
    should I put in the current partition now?". Many of my attempts were trying to
    decide "Which triangle would be better to move from partition A to partition B?",
    "Which partition should grow?", or "Which partition should shrink?". Involving
    relative decisions about the quality of partitions never materialized into a concrete
    and usable system for partitioning.


    +   - Always select the least-connected triangle as the starting point for new
    partitions. This discourages your final partition from including a large number
    of scattered "loner" triangles that no other partition wanted. The bounding sphere
    of such a partition would be very large and the rendering very inefficient. This
    same rule applies for triangle stripping algorithms, for the same reasons.


    +   - Graph theory helps. Read up on Prim''s algorithm [2]. It is a template for
    how this mesh partitioner works. However, do not be tempted to follow Prim''s
    algorithm exactly as described. It suggests a priority queue for candidate edges,
    but does not allow for reprioritizing adjacent nodes in the queue. Mesh partitions
    have potentially shared data between triangles, so it is likely that each additional
    triangle added to a partition changes the cost calculation for every candidate
    triangle. Placing triangles into a queue with a fixed priority clearly does not
    work for this kind of problem. This means you must scan the candidate triangle
    list every iteration and recompute the cost to find the best candidate.


