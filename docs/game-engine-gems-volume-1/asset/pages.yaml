- pgno: 368
  md: '# Overview


    Simple, GPU-friendly algorithms exist for rendering realistic skyboxes in real
    time for any given time and location. This gem reviews the Preetham et al. model
    [3] for accurately distributing luminance throughout a sky, with some extensions
    to ensure natural-looking results. When paired with the gem "Physically Based
    Outdoor Scene Lighting", outdoor scenes with lighting that perfectly matches the
    sky become possible. Algorithms for procedurally generating realistic skyboxes
    are surprisingly simple, and enable continuous time of day effects in your engine.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# # 16.1 Generating and Drawing the Skybox


    First, some skybox basics: a skybox is just that—a cube that is always rendered
    around the camera''s location such that it moves and rotates with the camera,
    which is colored to look like a sky. You may properly position it by simply zeroing
    out the translation components of your view matrix before drawing it.


    Intuition would tell us to render the skybox as the first thing in your frame,
    as it''s infinitely distant and everything else will be drawn in front of it.
    You could just disable depth buffer reads and writes, and draw the skybox instead
    of clearing the depth buffer, and go about rendering your scene. This simple approach,
    however, is not the most optimal, since you''ll end up spending time filling your
    color buffer with a bunch of sky that will end up being overdrawn by your scene.
    In reality, you won''t save anything on modern hardware by not clearing the depth
    buffer along with your color buffer at the beginning of the frame—in fact, it
    may hurt performance. A better approach is to keep clearing your color and depth
    buffer together, then draw your skybox as the last thing in your frame, with depth
    buffer reads enabled to prevent drawing parts of the sky that are not visible.
    If you use an infinite projection matrix while rendering the skybox, drawing the
    skybox last instead of first will render correctly and can gain you some performance.


    For procedurally generated skyboxes, we''ll use a vertex program to render the
    sky just using vertex colors (disable texturing and enable smooth shading). This
    implies that the geometry of the skybox warrants some effort; you need to have
    enough vertices in the skybox to achieve convincing results, but too many may
    impact performance. In the images shown in Figure 16.1, each face of the skybox
    cube consists of a 40×40 grid. You may choose to have a higher vertex density
    near the horizon, as this is where sky colors change more quickly; you may also
    choose to have higher vertex density vertically rather than horizontally, as the
    sky color changes less rapidly as you look around the horizon than as you look
    up'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'toward the sky''s zenith.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_370_0.png)


    Figure 16.1: (See also Color Plates.) Physically-based skybox generated for (left)
    late morning and (right) twilight. (Images courtesy of Sundog Software, LLC.)


    If you''re certain that the bottom of your skybox will never be visible, you may
    omit this face—but as an engine developer, you shouldn''t make this assumption.
    Your users might end up rendering the Earth from space using your skybox for a
    star-field and wonder why nothing is drawn underneath it. You may also want to
    allow your users to shift the skybox down by some amount instead of drawing it
    perfectly centered with the camera position; if the terrain in the scene doesn''t
    actually extend all the way to the horizon, this is a simple way to cover up that
    fact.


    The techniques in this gem will work just as well with a sky dome. However, a
    box is simpler, allows us to easily cull faces of the box that are not visible,
    and since we''re using vertex colors instead of texture mapping, the corners of
    the box are not at all perceptible.


    Using a conventional projection matrix, the size of the skybox must be chosen
    with care; you need to ensure that it falls within the near and far clipping planes
    of your view frustum. This becomes especially problematic with engines that dynamically
    adjust the near and far clip planes based on the scene''s bounding volumes to
    maximize depth buffer resolution. An elegant way around this problem is to render
    the skybox using an infinite projection matrix and with w-coordinates of zero,
    assuring the far clip plane is irrelevant and the skybox is drawn at maximum depth.
    Care must be taken with this technique to avoid round-off error artifacts [1].'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 16.2 Computing the Skybox Vertex Colors


    Back in 1993, Perez et al. developed a simple model for distributing luminance
    across the sky, by fitting equations to experimental data [2]. In 1999, Preetham
    et al. extended this method to work in full color in a paper presented at Siggraph.
    The only input required is the position of the sun (or moon) in the sky, and the
    _turbidity_ of the atmosphere. Turbidity is a measure of the particulate matter
    in the atmosphere; a reasonable value for realistic-looking scenes is around 2.2.
    Higher values imply more polluted skies, and will result in more dramatic sunsets.


    The position of the sun or moon is specified in polar coordinates. \(\theta_S\)
    is the angle from the up axis to the light source, and \(\phi_S\) is the angle
    from the South axis (positive is toward East.) The `Ephemeris` class introduced
    in "Physically-Based Outdoor Scene Lighting" is useful for computing the position
    of the sun and moon for a given time and location.


    The Perez model for distributing luminance across the sky is given by


    ```

    \( F(\theta, \gamma) = (1 + Ae^{B/cos\theta})(1 + C^{\gamma} + Ecos^2 \gamma)
    \).

    ```


    We refer to this equation as the "Perez function". Here, \(\theta\) is the angle
    of the skybox vertex from the up axis, and \(\gamma\) is the angle between the
    vertex and the sun or moon—your vertex program will compute these angles given
    the position of each skybox vertex. We''ll discuss the constants _A_ through _E_
    shortly.


    To arrive at an actual luminance value \(Y_P\) for a given vertex, you need to
    compute the above function once for the vertex''s position, and again for the
    position of the sun or moon (this only needs to be computed when the time of day
    changes, then cached):'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'Y_p = Y_z \frac{F(\theta, \gamma)}{F(0, \theta_s)}.


    You''ll also need the zenith luminance Yz—although Preetham et al. provides a
    function for computing this in their paper, we''ve gotten better results by using
    the Y component of the tone-mapped scattered sunlight or moonlight derived in
    the gem "Physically-Based Outdoor Scene Lighting". Divide that luminance by 1000,
    since the constants we''re using here are in units of kcd/m².


    Computing the luminance Yp for the skybox vertex is nice, but you want a color,
    not just a luminance. The trick is to work in xyY color space—this is a means
    of representing colors where the values x and y represent the color''s chromaticity,
    and Y represents its luminance. For each vertex, you compute the function above
    three times—once for x, once for y, and once for Y, and then convert the resulting
    xyY color to RGB.


    This means you''ll need an xyY value for the zenith Yz. If you have the zenith
    color in XYZ form, you''ll need to convert XYZ to xyY using the relationship


    x = \frac{X}{X + Y + Z}

    y = \frac{Y}{X + Y + Z}.


    The constants A, B, C, D, and E in the Perez function are themselves functions
    of the turbidity value T, and are different depending on whether you''re computing
    the Perez function for x, y, or Y. These constants are given by'
