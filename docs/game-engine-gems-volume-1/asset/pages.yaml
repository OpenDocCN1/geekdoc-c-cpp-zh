- pgno: 374
  md: 'warm glow surrounding a full moon in the sky.


    Then, convert XYZ to RGB using your favorite conversion matrix.

    We use


    ```

    [R G B]=[X Y Z] [ 3.240479 -0.969256 0.055648

    -1.53715 1.875991 -0.204043 .

    -0.49853 0.041556 1.057311 ].

