- pgno: 381
  md: '# 17.1 Technique Overview


    The technique described in this gem requires that a dedicated four-channel velocity
    buffer be allocated by the rendering system. For each frame we render, we fill
    this velocity buffer with information about the two-dimensional screen-space velocity
    of pixels belonging to each object to which we want to apply the motion blur effect.
    This is typically done early in the rendering process for a particular frame,
    and it happens independently of any previously rendered frames.


    When rendering to the velocity buffer, there are three sources of motion that
    we need to consider. First, we must take the motion of the camera into account,
    and this motion affects all objects in the scene. Second, we must consider the
    motion that individual objects have as a whole. An object may be moving through
    space or rotating, and this motion can be captured by considering the object''s
    transformation matrix for both the current frame and the preceding frame. Third,
    it''s possible that the vertices composing an object''s triangle mesh are themselves
    in motion. This frequently occurs with skinned character models, soft bodies,
    and cloth. Examples of motion blur arising from camera movement and object movement
    are shown in Figure 17.1. An example of motion blur due to vertex movement within
    a single mesh is shown in Figure 17.2.


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_381_0.png)


    ![](img/7ba1225bb0e5a87be0fd35866408ffa7_381_1.png)


    Figure 17.1: (See also Color Plates.) In the left image, motion blur resulting
    only from camera movement is shown. Notice how the ground and trees closer to
    the camera are blurred much more than distant objects. In the right image, motion
    blur'
  merge: -1
  img_proc: true
